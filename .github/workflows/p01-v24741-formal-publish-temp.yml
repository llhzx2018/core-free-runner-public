name: p01-v24741-formal-publish-temp

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v24741-formal-publish-temp.yml'
      - 'requests/p01-v24741-formal-publish-20260922.txt'

permissions:
  contents: read

concurrency:
  group: p01-v24741-formal-publish
  cancel-in-progress: false

env:
  PRODUCT_REPO: llhzx2018/vf-start
  TARGET_SHA: e860c52a6be09fa2087e93c9d3f88795f0edeb13
  TARGET_TREE: f6bc6d1d0216b7a76a564985f415f351c7a2b3c3
  VERSION: '2.47.41'
  SOURCE_VERSION: '2.47.40'
  SOURCE_SHA: 73bdfa38310aaabcf6df48810fe8479024a1a819
  SCHEMA: '2026090401'
  TAG: v2.47.41
  FORMAL_RUN_ID: '35715663753'
  FORMAL_RUN_HEAD: daef0d986a55d8a1910f67c12c43871dc712caff
  VISUAL_RUN_ID: '35711973411'
  VISUAL_RUN_HEAD: ddf59342e5b76b00bf6b2be30c015c468d35a615
  ARTIFACT_ID: '10688074415'
  FULL_NAME: VF-Start-V2.47.41-FULL.zip
  FULL_BYTES: '894237'
  FULL_SHA: c988e932be7744d6ba99a1447b2a69dc1c37d12c321e282341919a46c364d629
  UPDATE_NAME: VF_Start_V2.47.41_UPDATE.zip
  UPDATE_BYTES: '1911507'
  UPDATE_SHA: 0cd4085f25631db772d97e661cd4251c1901049837f59cbb086ab5d9f0111c8f

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Checkout release control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Credential and exact source gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "$RUNNER_TEMP/product"
          git -C "$RUNNER_TEMP/product" fetch -q --depth 1 origin "$TARGET_SHA"
          git -C "$RUNNER_TEMP/product" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/product" rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C "$RUNNER_TEMP/product" rev-parse 'HEAD^{tree}')" = "$TARGET_TREE"
          test "$(tr -d '\r\n ' < "$RUNNER_TEMP/product/VERSION")" = "$VERSION"
          test "$(tr -d '\r\n ' < "$RUNNER_TEMP/product/src/VERSION.txt")" = "$VERSION"
          echo P01_V24741_EXACT_RELEASE_SOURCE=PASS

      - name: Recheck final machine evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          formal="$(gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$FORMAL_RUN_ID")"
          visual="$(gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$VISUAL_RUN_ID")"
          test "$(jq -r '.head_sha' <<<"$formal")" = "$FORMAL_RUN_HEAD"
          test "$(jq -r '.conclusion' <<<"$formal")" = success
          test "$(jq -r '.head_sha' <<<"$visual")" = "$VISUAL_RUN_HEAD"
          test "$(jq -r '.conclusion' <<<"$visual")" = success
          echo P01_V24741_MACHINE_EVIDENCE_READBACK=PASS

      - name: Fetch exact formal artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$RUNNER_TEMP/formal" "$RUNNER_TEMP/formal.zip"
          mkdir -p "$RUNNER_TEMP/formal"
          gh api --method GET "repos/llhzx2018/core-free-runner-public/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/formal.zip"
          unzip -q "$RUNNER_TEMP/formal.zip" -d "$RUNNER_TEMP/formal"
          FULL="$(find "$RUNNER_TEMP/formal" -type f -name "$FULL_NAME" -print -quit)"
          UPDATE="$(find "$RUNNER_TEMP/formal" -type f -name "$UPDATE_NAME" -print -quit)"
          test -n "$FULL" && test -n "$UPDATE"
          test "$(stat -c %s "$FULL")" = "$FULL_BYTES"
          test "$(sha256sum "$FULL"|awk '{print $1}')" = "$FULL_SHA"
          test "$(stat -c %s "$UPDATE")" = "$UPDATE_BYTES"
          test "$(sha256sum "$UPDATE"|awk '{print $1}')" = "$UPDATE_SHA"
          unzip -t "$FULL" >/dev/null
          unzip -t "$UPDATE" >/dev/null
          echo "FULL_PATH=$FULL" >> "$GITHUB_ENV"
          echo "UPDATE_PATH=$UPDATE" >> "$GITHUB_ENV"
          echo P01_V24741_FINAL_ARTIFACT_READBACK=PASS

      - name: Immutable and stable-baseline preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          if tag_sha="$(gh api "repos/$PRODUCT_REPO/git/ref/tags/$TAG" --jq '.object.sha' 2>/dev/null)"; then
            test "$tag_sha" = "$TARGET_SHA" || { echo "TAG_IDENTITY_CONFLICT=$tag_sha" >&2; exit 91; }
          fi
          if gh api "repos/$PRODUCT_REPO/releases/tags/$TAG" >/dev/null 2>&1; then
            echo RELEASE_ALREADY_EXISTS=YES
          else
            echo RELEASE_ALREADY_EXISTS=NO
          fi
          baseline="$(gh api "repos/llhzx2018/core-updates/contents/projects/P01.json?ref=main" --jq '.content' | base64 -d)"
          jq -e '
            .target_version=="2.47.40" and
            .from_versions==["2.47.39"] and
            .schema_from=="2026090401" and
            .schema_to=="2026090401" and
            .release_tag=="v2.47.40" and
            .release_id==393453418 and
            .product_identity=="73bdfa38310aaabcf6df48810fe8479024a1a819" and
            .asset_name=="VF_Start_V2.47.40_UPDATE.zip" and
            .asset_bytes==1907748 and
            .asset_sha256=="48d549919623feea2adb42d8e807fa958fc213efa0a3bd1f5388422190fd8cc6"
          ' <<<"$baseline" >/dev/null
          echo P01_V24741_IMMUTABLE_AND_BASELINE_PREFLIGHT=PASS

      - name: Create exact tag and GitHub Release
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! gh api "repos/$PRODUCT_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            gh api --method POST "repos/$PRODUCT_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$TARGET_SHA" > "$RUNNER_TEMP/tag-create.json"
          fi
          test "$(gh api "repos/$PRODUCT_REPO/git/ref/tags/$TAG" --jq '.object.sha')" = "$TARGET_SHA"

          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          # VF Start V2.47.41

          P01 · VF Start V2.47.41 UX/UI 全产品收口正式更新。

          - Exact Source: $TARGET_SHA
          - Exact Tree: $TARGET_TREE
          - Source Version: V$SOURCE_VERSION
          - Target Version: V$VERSION
          - Schema: $SCHEMA（不变）
          - Full-product UX/UI visual closure: PASS / 88 screenshots / 10 compatibility checks
          - Canonical Regression: PASS / 0 new regressions
          - Formal Machine Preflight: PASS / run $FORMAL_RUN_ID
          - Visual Machine Gate: PASS / run $VISUAL_RUN_ID
          - Clean FULL install: PASS
          - Atomic V$SOURCE_VERSION → V$VERSION: PASS
          - Atomic idempotency: PASS
          - Injected-failure rollback + private sentinel preservation: PASS
          - OWNER direct release authorization: PASS
          - Independent OWNER runtime interaction evidence for this exact candidate: not separately recorded; limitation retained explicitly
          - Production upgrade: NOT INCLUDED; OWNER will apply update from P01 admin
          EOF

          if gh release view "$TAG" --repo "$PRODUCT_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FULL_PATH" "$UPDATE_PATH" --repo "$PRODUCT_REPO" --clobber
          else
            gh release create "$TAG" "$FULL_PATH" "$UPDATE_PATH"               --repo "$PRODUCT_REPO"               --target "$TARGET_SHA"               --title "VF Start V$VERSION"               --notes-file "$RUNNER_TEMP/release-notes.md"               --verify-tag >/dev/null
          fi

          gh api "repos/$PRODUCT_REPO/releases/tags/$TAG" > "$RUNNER_TEMP/release.json"
          jq -e --arg tag "$TAG" '.tag_name==$tag and .draft==false and .prerelease==false' "$RUNNER_TEMP/release.json" >/dev/null
          echo "RELEASE_ID=$(jq -r '.id' "$RUNNER_TEMP/release.json")" >> "$GITHUB_ENV"
          echo "PUBLISHED_AT=$(jq -r '.published_at' "$RUNNER_TEMP/release.json")" >> "$GITHUB_ENV"
          echo P01_V24741_TAG_RELEASE=PASS

      - name: Remote Release exact-byte readback
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$RUNNER_TEMP/release-readback"
          mkdir -p "$RUNNER_TEMP/release-readback"
          gh release download "$TAG" --repo "$PRODUCT_REPO" --dir "$RUNNER_TEMP/release-readback" --pattern "$FULL_NAME" --pattern "$UPDATE_NAME"
          test "$(stat -c %s "$RUNNER_TEMP/release-readback/$FULL_NAME")" = "$FULL_BYTES"
          test "$(sha256sum "$RUNNER_TEMP/release-readback/$FULL_NAME"|awk '{print $1}')" = "$FULL_SHA"
          test "$(stat -c %s "$RUNNER_TEMP/release-readback/$UPDATE_NAME")" = "$UPDATE_BYTES"
          test "$(sha256sum "$RUNNER_TEMP/release-readback/$UPDATE_NAME"|awk '{print $1}')" = "$UPDATE_SHA"
          jq -e --arg f "$FULL_NAME" --arg u "$UPDATE_NAME" --argjson fb "$FULL_BYTES" --argjson ub "$UPDATE_BYTES"             '([.assets[]|select(.name==$f and .size==$fb)]|length)==1 and ([.assets[]|select(.name==$u and .size==$ub)]|length)==1'             "$RUNNER_TEMP/release.json" >/dev/null
          echo P01_V24741_RELEASE_REMOTE_READBACK=PASS

      - name: Checkout core-updates stable authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: main
          token: ${{ env.WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: updates

      - name: Publish P01 V2.47.41 stable channel
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -e '
            .target_version=="2.47.40" and
            .from_versions==["2.47.39"] and
            .schema_from=="2026090401" and
            .schema_to=="2026090401" and
            .release_tag=="v2.47.40" and
            .release_id==393453418 and
            .product_identity=="73bdfa38310aaabcf6df48810fe8479024a1a819" and
            .asset_name=="VF_Start_V2.47.40_UPDATE.zip" and
            .asset_bytes==1907748 and
            .asset_sha256=="48d549919623feea2adb42d8e807fa958fc213efa0a3bd1f5388422190fd8cc6"
          ' updates/projects/P01.json >/dev/null

          python3 - <<'PY'
          import json, os, pathlib
          p=pathlib.Path('updates/projects/P01.json')
          x={
            "schema_version":"1.0",
            "project_id":"P01",
            "component_id":"APP",
            "enabled":True,
            "current_version":"2.47.40",
            "target_version":"2.47.41",
            "update_type":"ATOMIC",
            "from_versions":["2.47.40"],
            "schema_from":"2026090401",
            "schema_to":"2026090401",
            "repository":"llhzx2018/vf-start",
            "release_tag":"v2.47.41",
            "release_id":int(os.environ["RELEASE_ID"]),
            "product_identity":"e860c52a6be09fa2087e93c9d3f88795f0edeb13",
            "asset_name":"VF_Start_V2.47.41_UPDATE.zip",
            "asset_bytes":1911507,
            "asset_sha256":"0cd4085f25631db772d97e661cd4251c1901049837f59cbb086ab5d9f0111c8f",
            "backup_required":True,
            "rollback_supported":True,
            "released_at":os.environ["PUBLISHED_AT"],
            "minimum_php":"8.0.0",
            "notes":"P01 · VF Start V2.47.41 UX/UI 全产品收口正式稳定更新。Exact Source e860c52a6be09fa2087e93c9d3f88795f0edeb13；Schema 2026090401 不变；88 screenshots / 10 compat checks PASS；Canonical Regression 0 new regressions；Formal Machine Preflight 35715663753 PASS；Clean FULL、Atomic upgrade、idempotency、failure rollback/data sentinel 均 PASS。OWNER 已明确要求发布更新，并计划在 P01 后台手动执行 Production 更新；独立 OWNER runtime interaction evidence 未单独记录，此限制保留。Formal Release / Stable Channel Published 不代表 Production 已升级。"
          }
          p.write_text(json.dumps(x,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

          git -C updates config user.name 'VF Release Automation'
          git -C updates config user.email 'vf-release-automation@users.noreply.github.com'
          git -C updates add projects/P01.json
          git -C updates commit -m 'release(P01): publish VF Start V2.47.41 stable channel'
          git -C updates push origin HEAD:main
          echo "CORE_UPDATES_COMMIT=$(git -C updates rev-parse HEAD)" >> "$GITHUB_ENV"
          echo P01_V24741_STABLE_CHANNEL_WRITE=PASS

      - name: Stable channel remote exact readback
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$RUNNER_TEMP/updates-readback"
          git clone -q --depth 1 --branch main "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/core-updates.git" "$RUNNER_TEMP/updates-readback"
          M="$RUNNER_TEMP/updates-readback/projects/P01.json"
          jq -e --argjson rid "$RELEASE_ID" '
            .current_version=="2.47.40" and
            .target_version=="2.47.41" and
            .from_versions==["2.47.40"] and
            .schema_from=="2026090401" and
            .schema_to=="2026090401" and
            .release_tag=="v2.47.41" and
            .release_id==$rid and
            .product_identity=="e860c52a6be09fa2087e93c9d3f88795f0edeb13" and
            .asset_name=="VF_Start_V2.47.41_UPDATE.zip" and
            .asset_bytes==1911507 and
            .asset_sha256=="0cd4085f25631db772d97e661cd4251c1901049837f59cbb086ab5d9f0111c8f"
          ' "$M" >/dev/null
          test "$(git -C "$RUNNER_TEMP/updates-readback" rev-parse HEAD)" = "$CORE_UPDATES_COMMIT"
          echo P01_V24741_STABLE_REMOTE_READBACK=PASS

      - name: Formal publish summary
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo '# P01 V2.47.41 Formal Release'
            echo "Exact Source: $TARGET_SHA"
            echo "Tag: $TAG"
            echo "Release ID: $RELEASE_ID"
            echo "FULL: $FULL_BYTES bytes / $FULL_SHA"
            echo "UPDATE: $UPDATE_BYTES bytes / $UPDATE_SHA"
            echo "core-updates: $CORE_UPDATES_COMMIT"
            echo 'Production: NOT EXECUTED'
          } >> "$GITHUB_STEP_SUMMARY"
          echo P01_V24741_FORMAL_RELEASE_AND_STABLE=PASS

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/product" "$RUNNER_TEMP/formal" "$RUNNER_TEMP/formal.zip"             "$RUNNER_TEMP/release-readback" "$RUNNER_TEMP/updates-readback" updates
          rm -f "$RUNNER_TEMP/tag-create.json" "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/release-notes.md"
          echo P01_V24741_RELEASE_WORKSPACE_CLEANUP=PASS
