name: S01-C02 V1.21.1020 Recovery Workspace Rebuild Candidate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TARGET_REPO: llhzx2018/vf-tools-ops
      TARGET_SHA: cd86de25e7573524f758c2aff89cea38f3d9be73
      BASE_SHA: 4576c96dcec9bed21cc183ba621d2bd1f0cf5295
      TARGET_VERSION: 1.21.1020
      BASE_VERSION: 1.21.1019
      ARTIFACT_NAME: vf-tools-ops_V1.21.1020.zip
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ env.READ_TOKEN }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout baseline
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.BASE_SHA }}
          token: ${{ env.READ_TOKEN }}
          path: baseline
          fetch-depth: 0
          persist-credentials: false

      - name: Source contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n' < target/VERSION)" = "$TARGET_VERSION"
          grep -F "Version: $TARGET_VERSION" target/vf-ops.php >/dev/null
          grep -F "S01-V9-RECOVERY-WORKSPACE-REBUILD" target/vf-ops.php >/dev/null
          php target/tests/s01-c02-1211020-recovery-workspace-rebuild-contract.php
          php target/tests/s01-c02-121934-shell-header-visual-lock-r45-contract.php
          php target/tests/error-recovery-human-language-contract.php
          git -C target diff --name-only "$BASE_SHA..$TARGET_SHA" | tee evidence/changed-files.txt
          python3 - <<'PY'
          from pathlib import Path
          changed=set(Path('evidence/changed-files.txt').read_text().splitlines())
          allowed={
            'CHANGELOG.md','VERSION','vf-ops.php',
            'includes/admin-v13/views/system_recovery.php',
            'includes/views/admin-style-helpers/admin-s01-uiux-polish.php',
            'assets/css/current/admin-s01-recovery-r2.css',
            'docs/authority/PRD.md','docs/authority/SSOT.md','docs/authority/ACCEPTANCE_MATRIX.md',
            'tests/s01-c02-1211020-recovery-workspace-rebuild-contract.php',
            'tests/s01-c02-1211020-recovery-workspace-rebuild-browser-proof.js'
          }
          if changed != allowed: raise SystemExit('unexpected diff: '+repr(sorted(changed ^ allowed)))
          print('BOUNDED_DIFF=PASS')
          print('FROZEN_SHELL_HEADER_MENU=PASS')
          PY

      - name: PHP syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm -v "$PWD/target:/src:ro" -w /src php:8.3-cli sh -lc 'find . -path "./.git" -prune -o -name "*.php" -print0 | xargs -0 -n1 php -l >/dev/null'
          echo PHP_SYNTAX=PASS

      - name: Browser dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/vf-node && cd /tmp/vf-node
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.58.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Rebuilt Recovery geometry proof
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/target"
          export NODE_PATH=/tmp/vf-node/node_modules
          node tests/s01-c02-1211020-recovery-workspace-rebuild-browser-proof.js | tee "$GITHUB_WORKSPACE/evidence/recovery-rebuild.json"
          jq -e '.pass==true and (.failures|length)==0 and .owner_product_pass==false' "$GITHUB_WORKSPACE/evidence/recovery-rebuild.json" >/dev/null
          echo RECOVERY_REBUILD=PASS

      - name: Recovery behavior and global UX regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/target"
          export NODE_PATH=/tmp/vf-node/node_modules
          node tests/s01-c02-1211018-recovery-mature-workspace-browser-proof.js | tee "$GITHUB_WORKSPACE/evidence/recovery-behavior.json"
          jq -e '.pass==true and (.failures|length)==0' "$GITHUB_WORKSPACE/evidence/recovery-behavior.json" >/dev/null
          node tests/s01-c02-1211009-final-ux-guardrails-browser-proof.js | tee "$GITHUB_WORKSPACE/evidence/final-ux.json"
          jq -e '.pass==true and ([.checks[].failures[]]|length)==0' "$GITHUB_WORKSPACE/evidence/final-ux.json" >/dev/null
          node tests/s01-c02-1211008-global-workspace-centering-browser-proof.js | tee "$GITHUB_WORKSPACE/evidence/workspace-center.json"
          jq -e '.pass==true and ([.checks[].failures[]]|length)==0' "$GITHUB_WORKSPACE/evidence/workspace-center.json" >/dev/null
          echo REGRESSION=PASS

      - name: Build deterministic packages
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib,re,zipfile,json
          from pathlib import Path
          def keep(rel):
              p=rel.as_posix(); parts=p.split('/')
              if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in parts): return False
              if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',p,re.I): return False
              if '/' not in p: return p in {'vf-ops.php','uninstall.php'}
              return parts[0] in {'includes','assets','languages','config'}
          def build(root,ver):
              root=Path(root); out=Path(f'/tmp/vf-tools-ops_V{ver}.zip'); fs={}
              for p in root.rglob('*'):
                  if p.is_file() and not p.is_symlink():
                      rel=p.relative_to(root)
                      if keep(rel): fs[rel.as_posix()]=p.read_bytes()
              fs=dict(sorted(fs.items()))
              with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
                  for rel,data in fs.items():
                      info=zipfile.ZipInfo('vf-ops/'+rel,(2026,10,4,0,0,0)); info.compress_type=zipfile.ZIP_DEFLATED; info.external_attr=0o100644<<16
                      z.writestr(info,data)
              h=hashlib.sha256()
              for rel,data in fs.items():
                  h.update(rel.encode());h.update(b'\0');h.update(hashlib.sha256(data).hexdigest().encode());h.update(b'\n')
              return {'version':ver,'files':len(fs),'bytes':out.stat().st_size,'sha256':hashlib.sha256(out.read_bytes()).hexdigest(),'runtime_fingerprint':h.hexdigest()}
          rows={'baseline':build('baseline','1.21.1019'),'candidate':build('target','1.21.1020')}
          Path('evidence/package.json').write_text(json.dumps(rows,indent=2)+'\n')
          print(json.dumps(rows,indent=2))
          PY
          unzip -tq "/tmp/$ARTIFACT_NAME" >/dev/null
          echo PACKAGE_BUILD=PASS

      - name: Upgrade preservation
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/candpkg && mkdir -p /tmp/candpkg
          unzip -q /tmp/vf-tools-ops_V1.21.1020.zip -d /tmp/candpkg
          grep -F "Version: 1.21.1020" /tmp/candpkg/vf-ops/vf-ops.php >/dev/null
          grep -F "admin-s01-recovery-r2.css" /tmp/candpkg/vf-ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php >/dev/null
          grep -F 'class="vf-recovery-head vf-recovery-pagebar"' /tmp/candpkg/vf-ops/includes/admin-v13/views/system_recovery.php >/dev/null
          echo UPGRADE_PRESERVATION=PASS

      - name: Final evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE"
          jq -n --arg sha "$TARGET_SHA" --arg ver "$TARGET_VERSION"             --argjson recovery "$(cat evidence/recovery-rebuild.json)"             --argjson behavior "$(cat evidence/recovery-behavior.json)"             --argjson ux "$(cat evidence/final-ux.json)"             --argjson center "$(cat evidence/workspace-center.json)"             --argjson package "$(cat evidence/package.json)" '{
              status:"PASS",candidate_sha:$sha,candidate_version:$ver,
              recovery_rebuild:{result:($recovery.pass|if . then "PASS" else "FAIL" end),generic_pagehead_removed:"PASS",clean_visual_authority:"PASS",owner_product_pass:false},
              recovery_behavior:{result:($behavior.pass|if . then "PASS" else "FAIL" end)},
              final_ux:{result:($ux.pass|if . then "PASS" else "FAIL" end)},
              workspace_center:{result:($center.pass|if . then "PASS" else "FAIL" end)},
              upgrade:"PASS",package:$package,frozen_shell_header_menu:"PASS",production:"NOT_EXECUTED"
            }' | tee evidence/FINAL_EVIDENCE.json
          echo S01_C02_V1211020_MACHINE_PASS

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s01-c02-v1.21.1020-recovery-workspace-rebuild
          path: evidence/
          retention-days: 30
