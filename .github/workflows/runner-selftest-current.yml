name: S01 Mature Admin V6 R4 Content SEO Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-selftest-current.yml'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPS_REPO: llhzx2018/vf-tools-ops
      OPS_SHA: d144a86d9a39a9813bebf9235c7537606d30e718
      BASE_SHA: 4806d53fb6784d7fc1f7735b0e0195ea56bd0aaf
    steps:
      - name: Checkout exact Ops V6 R4 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          repository: llhzx2018/vf-tools-ops
          ref: d144a86d9a39a9813bebf9235c7537606d30e718
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: ops
          persist-credentials: false

      - name: Exact seven-file R4 fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$OPS_SHA"
          test "$(cat ops/VERSION)" = '1.21.869'
          mapfile -t changed < <(git -C ops diff --name-only "$BASE_SHA" "$OPS_SHA" | sort)
          printf '%s\n' "${changed[@]}"
          expected=(
            assets/css/current/admin-s01-v6-content-seo-r4.css
            includes/admin-v13/tab-controller.php
            includes/admin-v13/views/content_workflow_v6.php
            includes/admin-v13/views/seo_today_v6.php
            includes/s01/v6-landing-shell.php
            includes/views/admin-style-helpers/admin-s01-uiux-polish.php
            tests/s01-v6-r4-content-seo-contract.php
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"
          echo 'S01_V6_R4_EXACT_SCOPE=PASS'

      - name: PHP syntax and R4 contract
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l ops/includes/admin-v13/views/content_workflow_v6.php >/dev/null
          php -l ops/includes/admin-v13/views/seo_today_v6.php >/dev/null
          php -l ops/includes/s01/v6-landing-shell.php >/dev/null
          php -l ops/includes/admin-v13/tab-controller.php >/dev/null
          php -l ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php >/dev/null
          php -l ops/tests/s01-v6-r4-content-seo-contract.php >/dev/null
          php ops/tests/s01-v6-r4-content-seo-contract.php
          echo 'S01_V6_R4_SYNTAX_CONTRACT=PASS'

      - name: Content and SEO V6 landing fence
        shell: bash
        run: |
          set -Eeuo pipefail
          content='ops/includes/admin-v13/views/content_workflow_v6.php'
          seo='ops/includes/admin-v13/views/seo_today_v6.php'
          shell='ops/includes/s01/v6-landing-shell.php'
          grep -Fq 'vf-v6-content-overview' "$content"
          grep -Fq 'vf_ops_content_workflow_admin_post_v121647' "$content"
          grep -Fq 'ops.content.scan' "$content"
          ! grep -Fq 'class="vf-cw' "$content"
          grep -Fq 'data-vf-cw-action-form' "$content"
          grep -Fq 'vf-v6-seo-overview' "$seo"
          grep -Fq 'vf_ops_seo_planner_admin_post_v121647' "$seo"
          grep -Fq 'ops.seo.runGate' "$seo"
          ! grep -Fq 'class="vf-seo-today' "$seo"
          grep -Fq 'data-vf-seo-today-action' "$seo"
          grep -Fq 'vf_ops_v13_render_primary_navigation_v121403' "$shell"
          ! grep -Fq 'vf_ops_v13_render_route_tabs_v121391' "$shell"
          echo 'S01_V6_R4_SERVER_LANDING=PASS'

      - name: Controller semantic delta fence
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import subprocess, sys
          base='4806d53fb6784d7fc1f7735b0e0195ea56bd0aaf'
          head='d144a86d9a39a9813bebf9235c7537606d30e718'
          p='includes/admin-v13/tab-controller.php'
          diff=subprocess.check_output(['git','-C','ops','diff','--unified=0',base,head,'--',p],text=True)
          added=[]
          for line in diff.splitlines():
              if line.startswith('+') and not line.startswith('+++'):
                  added.append(line[1:].strip())
          if len(added) != 9:
              print('unexpected controller additions', len(added), added, file=sys.stderr); sys.exit(1)
          allowed=(
              '$requestGet=function_exists(',
              "$section=isset($requestGet['section'])",
              "if(is_array($result)&&isset($result['returnTab'])",
              "$section=sanitize_key((string)$result['returnTab']);",
              "if(!in_array($section,['quality','families','states','insights','professional'],true)){",
              "$route['view']='admin-v13/views/content_workflow_v6.php';",
              "$route['view']='admin-v13/views/seo_today_v6.php';",
              '}',
          )
          for line in added:
              if not any(line.startswith(prefix) for prefix in allowed):
                  print('unexpected controller delta:', line, file=sys.stderr); sys.exit(1)
          print('S01_V6_R4_CONTROLLER_DELTA=PASS')
          PY

      - name: Business ownership source unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          for path in \
            includes/admin-v13/services/content_workflow.php \
            includes/admin-v13/services/seo_today.php \
            includes/admin-v13/route-contract.php \
            includes/s01/tool-workbench.php \
            includes/admin-v13/services/acceptance_overview.php \
            includes/wp-update/bootstrap.php; do
            git -C ops diff --quiet "$BASE_SHA" "$OPS_SHA" -- "$path"
          done
          echo 'S01_V6_R4_OWNERSHIP_UNCHANGED=PASS'

      - name: Design owner and responsive fence
        shell: bash
        run: |
          set -Eeuo pipefail
          css='ops/assets/css/current/admin-s01-v6-content-seo-r4.css'
          loader='ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php'
          grep -Fq 'body.vf-ops-v6-admin .vf-v6-cs-page' "$css"
          for bp in 1180 960 782 520; do grep -Fq "@media (max-width: ${bp}px)" "$css"; done
          ! grep -Fq ':root' "$css"
          ! grep -Fq '.vf-m3u8-' "$css"
          grep -Fq '$isContentOverview' "$loader"
          grep -Fq '$isSeoToday' "$loader"
          grep -Fq '$isV6MigratedPage' "$loader"
          grep -Fq 'admin-s01-v6-content-seo-r4.css' "$loader"
          echo 'S01_V6_R4_DESIGN_OWNER=PASS'

      - name: Secret fence
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t files < <(git -C ops diff --name-only "$BASE_SHA" "$OPS_SHA")
          if grep -Eni '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|password\s*=\s*[^[:space:]]+|secret\s*=\s*[^[:space:]]+)' "${files[@]/#/ops/}"; then
            echo 'secret-like material detected' >&2; exit 1
          fi
          echo 'S01_V6_R4_SECRET_FENCE=PASS'
