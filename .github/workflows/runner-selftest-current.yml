name: Public Runner Current Self Test

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-selftest-current.yml'
      - 'scripts/p05_opportunity_explainability_truth_boundary_writer.py'

permissions:
  contents: read

concurrency:
  group: p05-opportunity-explainability-truth-boundary-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  p05-opportunity-explainability-truth-boundary:
    if: github.event.pull_request.head.ref == 'fix/p05-opportunity-explainability-truth-boundary-20260903'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      P05_REPO: llhzx2018/vf-seo
      P05_BRANCH: l2/opportunity-explainability-contract-20260903
      P05_BASE_SHA: a9c09033e846e7030cb460d0d2135c29090d07e0
      P05_EXPECTED_HEAD: 369065286a8c37b605ba4d043916ff36bba426bd
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Checkout exact truth-boundary writer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: ${{ github.event.pull_request.head.sha }}
          path: runner
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact Product candidate read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: 369065286a8c37b605ba4d043916ff36bba426bd
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: product
          persist-credentials: false
          fetch-depth: 1

      - name: Correct persisted Opportunity truth boundary
        shell: bash
        working-directory: product
        run: |
          set -Eeuo pipefail
          test -n "$VF_RELEASE_WRITE_TOKEN"
          test "$(git rev-parse HEAD)" = "$P05_EXPECTED_HEAD"
          test "$(cat VERSION)" = '1.2.4'
          python3 ../runner/scripts/p05_opportunity_explainability_truth_boundary_writer.py
