name: Public Runner Current Self Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths: ['.github/workflows/runner-selftest-current.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-runner-current-selftest-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout public runner control repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Hosted runner allocation proof
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "RUNNER_OS=$RUNNER_OS"
          uname -a
          php -v || true
          python3 --version
          echo 'PUBLIC_RUNNER_ALLOCATION=PASS'

      - name: Verify main push came from merged PR
        if: github.event_name == 'push'
        shell: bash
        env:
          VF_PUSH_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          python3 scripts/check_main_push_provenance.py \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$VF_PUSH_SHA"
          echo 'MAIN_PUSH_PROVENANCE=PASS' >> "$GITHUB_ENV"

      - name: Verify Git Estate anti-drift
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: python3 scripts/check_estate_anti_drift.py --live

      - name: Build public-safe receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/runner
          PROVENANCE="${MAIN_PUSH_PROVENANCE:-NOT_APPLICABLE}"
          cat > evidence/runner/PUBLIC_RUNNER_CURRENT.txt <<EOF
          PUBLIC_RUNNER_ALLOCATION=PASS
          ESTATE_ANTI_DRIFT=PASS
          MAIN_PUSH_PROVENANCE=$PROVENANCE
          RUNNER_REPOSITORY=llhzx2018/core-free-runner-public
          PRIVATE_SOURCE_USED=GOV_DOC_AUTHORITY_ONLY
          SECRET_USED=REGISTERED_PRIVATE_READ_CAPABILITY
          PRIVATE_SOURCE_PERSISTED=NO
          MAIN_WRITE=NO
          USER_MANUAL_EXECUTION_REQUIRED=NO
          EOF

      - name: Upload public-safe receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 Node24
        with:
          name: public-runner-current-selftest-${{ github.run_id }}
          path: evidence/runner/PUBLIC_RUNNER_CURRENT.txt
          if-no-files-found: error
          retention-days: 14

  p05-owner-first-overview-writer:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'write/p05-owner-first-overview-20260903'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact Product candidate branch read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: l2/owner-first-overview-20260903
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 2

      - name: Verify exact Product base
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '27ff0b4c2295226bb6d8a0f8c345da5ed43f6c2a'
          test "$(git rev-parse HEAD^{tree})" = '25586b8612d4b9ab3cd0a818aeac0f1bf3c3ce24'
          test "$(cat VERSION)" = '1.2.4'
          echo P05_OWNER_FIRST_BASE=PASS

      - name: Construct exact Owner-first overview candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import pathlib
          path=pathlib.Path('src/client/ProductApp.tsx')
          text=path.read_text()
          old_help="{ key: 'Overview', label: '概览', help: '发生了什么、为什么可能变化、哪里坏了、下一步做什么。' }"
          new_help="{ key: 'Overview', label: '概览', help: '先看哪里需要处理和下一步，再核对变化、证据与可能原因。' }"
          assert text.count(old_help)==1, text.count(old_help)
          text=text.replace(old_help,new_help,1)
          lines=text.splitlines(keepends=True)
          markers=[
              '    <section className="p05v2-brief">',
              '    <Panel eyebrow="可能原因" title="为什么可能变化">',
              '    <div className="p05v2-two"><Panel eyebrow="需要处理" title="哪里坏了 / 需要处理">',
              '    <Panel eyebrow="核心证据" title="只看支持判断的数据">',
              '    <div className="p05v2-two"><Panel eyebrow="变更观察" title="最近改动与后续观察">',
          ]
          idx=[]
          for marker in markers:
              matches=[i for i,line in enumerate(lines) if line.startswith(marker)]
              assert len(matches)==1,(marker,matches)
              idx.append(matches[0])
          assert idx==list(range(idx[0],idx[0]+5)),idx
          brief,hypothesis,actions,evidence,history=[lines[i] for i in idx]
          lines[idx[0]:idx[0]+5]=[actions,brief,evidence,hypothesis,history]
          path.write_text(''.join(lines))
          result=path.read_text()
          assert result.index('哪里坏了 / 需要处理') < result.index('发生了什么') < result.index('只看支持判断的数据') < result.index('为什么可能变化') < result.index('最近改动与后续观察')
          print('P05_OWNER_FIRST_SOURCE_ORDER=PASS')
          PY
          git diff --check
          test "$(git diff --name-only)" = 'src/client/ProductApp.tsx'
          test "$(cat VERSION)" = '1.2.4'
          grep -Fq '先看哪里需要处理和下一步，再核对变化、证据与可能原因。' src/client/ProductApp.tsx
          echo P05_OWNER_FIRST_SCOPE=PASS

      - name: Write exact Product file through GitHub Contents API
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          BRANCH='l2/owner-first-overview-20260903'
          path='src/client/ProductApp.tsx'
          old_sha="$(git rev-parse HEAD:"$path")"
          content="$(base64 -w0 "$path")"
          gh api --method PUT "repos/llhzx2018/vf-seo/contents/$path" \
            -f message='refactor(ui): put Owner actions first on overview' \
            -f content="$content" \
            -f branch="$BRANCH" \
            -f sha="$old_sha" >/dev/null
          gh api "repos/llhzx2018/vf-seo/git/ref/heads/$BRANCH" --jq '.object.sha' > /tmp/p05-head
          echo "P05_OWNER_FIRST_SHA=$(cat /tmp/p05-head)"
          echo P05_OWNER_FIRST_WRITE=PASS

      - name: Read back exact final Product scope
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          head="$(cat /tmp/p05-head)"
          gh api "repos/llhzx2018/vf-seo/compare/27ff0b4c2295226bb6d8a0f8c345da5ed43f6c2a...$head" > /tmp/compare.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/compare.json'))
          assert x['behind_by']==0 and x['ahead_by']==1,(x['ahead_by'],x['behind_by'])
          files=[f['filename'] for f in x['files']]
          assert files==['src/client/ProductApp.tsx'],files
          print('P05_OWNER_FIRST_FINAL_SCOPE=PASS')
          print('P05_OWNER_FIRST_FINAL_TREE='+x['commits'][-1]['commit']['tree']['sha'])
          PY
          echo P05_MAIN_WRITE=0
          echo P05_RELEASE_WRITE=0
          echo P05_PRODUCTION_WRITE=0
