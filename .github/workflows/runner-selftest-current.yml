          from pathlib import Path
          replacements = [
            ('src/server/product-portfolio.ts', 'NODE_INSERT_OLD', 'NODE_INSERT_NEW'),
            ('src/server/product-portfolio.ts', 'NODE_SORT_OLD', 'NODE_SORT_NEW'),
            ('php/src/ProductPortfolioService.php', 'PHP_INSERT_OLD', 'PHP_INSERT_NEW'),
            ('php/src/ProductPortfolioService.php', 'PHP_SORT_OLD', 'PHP_SORT_NEW'),
            ('src/client/ProductApp.tsx', 'APP_HELPER_OLD', 'APP_HELPER_NEW'),
            ('src/client/ProductApp.tsx', 'APP_SPAN_OLD', 'APP_SPAN_NEW'),
            ('tests/unit/product-portfolio-decision-ladder-truth.test.ts', 'TEST_IMPORT_OLD', 'TEST_IMPORT_NEW'),
            ('tests/unit/product-portfolio-decision-ladder-truth.test.ts', 'TEST_ADD_ANCHOR', 'TEST_ADD_NEW'),
            ('tests/unit/product-portfolio-decision-ladder-truth.test.ts', 'TEST_ASSERT_OLD', 'TEST_ASSERT_NEW'),
            ('tests/unit/product-portfolio-decision-ladder-truth.test.ts', 'TEST_UI_ANCHOR', 'TEST_UI_NEW'),
          ]
          encoded = {
            'NODE_INSERT_OLD': 'LyoqIE9uZSBzaXRlLWxpc3QgcXVlcnkgcGx1cyBzaXggc2V0LWJhc2VkIGRldGFpbCBxdWVyaWVzLCBpbmRlcGVuZGVudCBvZiB3ZWJzaXRlIGNvdW50LiAqLwpleHBvcnQgY29uc3QgUFJPRFVDVF9QT1JURk9MSU9fUVVFUllfQlVER0VUID0gNzsKCmZ1bmN0aW9uIG51bWJlcih2YWx1ZTogdW5rbm93bik6IG51bWJlciB7',
            'NODE_INSERT_NEW': '',
            'NODE_SORT_OLD': '',
            'NODE_SORT_NEW': 'ICByZXR1cm4gaXRlbXMuc29ydChwcm9kdWN0UG9ydGZvbGlvQ29tcGFyZSk7',
            'PHP_INSERT_OLD': 'ICAgIHB1YmxpYyBmdW5jdGlvbiBfX2NvbnN0cnVjdChwcml2YXRlIHJlYWRvbmx5IERhdGFiYXNlICRkYikge30KCiAgICAvKiogQHJldHVybiBsaXN0PGFycmF5PHN0cmluZyxtaXhlZD4+ICov',
            'PHP_INSERT_NEW': '',
            'PHP_SORT_OLD': 'ICAgICAgICAgICAgcmV0dXJuICRsZWZ0IDw9PiAkcmlnaHQgPzogc3RyY21wKChzdHJpbmcpICRhWyduYW1lJ10sIChzdHJpbmcpICRiWyduYW1lJ10pOw==',
            'PHP_SORT_NEW': '',
            'APP_HELPER_OLD': 'ZnVuY3Rpb24gcHJpb3JpdHkodmFsdWU6IHVua25vd24pIHsgY29uc3QgcmF3ID0gU3RyaW5nKHZhbHVlID8/ICcnKS50b1VwcGVyQ2FzZSgpOyByZXR1cm4gcmF3ID09PSAnUDEnIHx8IHJhdyA9PT0gJ0hJR0gnID8gJ+mrmCcgOiByYXcgPT09ICdQMicgfHwgcmF3ID09PSAnTUVESVVNJyA/ICfkuK0nIDogJ+S9jic7IH0KZnVuY3Rpb24gY29uZmlkZW5jZQ==',
            'APP_HELPER_NEW': '',
            'APP_SPAN_OLD': 'PHNwYW4+e3NpdGUucHJvamVjdF9uYW1lID8/ICfigJQnfSDCtyB7c2l0ZS51cmx9PC9zcGFuPg==',
            'APP_SPAN_NEW': 'PHNwYW4+5Lia5Yqh5Lu35YC8IHtidXNpbmVzc1ZhbHVlKHNpdGUuYnVzaW5lc3NfdmFsdWUpfSDCtyB7c2l0ZS5wcm9qZWN0X25hbWUgPz8gJ+KAlCd9IMK3IHtzaXRlLnVybH08L3NwYW4+',
            'TEST_IMPORT_OLD': 'aW1wb3J0IHsgcHJvZHVjdFBvcnRmb2xpb1N0YXR1cyB9IGZyb20gJy4uLy4uL3NyYy9zZXJ2ZXIvcHJvZHVjdC1vcHRpbWl6YXRpb24uanMnOw==',
            'TEST_IMPORT_NEW': 'aW1wb3J0IHsgcHJvZHVjdFBvcnRmb2xpb1N0YXR1cyB9IGZyb20gJy4uLy4uL3NyYy9zZXJ2ZXIvcHJvZHVjdC1vcHRpbWl6YXRpb24uanMnOwppbXBvcnQgeyBwcm9kdWN0QnVzaW5lc3NWYWx1ZVJhbmssIHByb2R1Y3RQb3J0Zm9saW9Db21wYXJlIH0gZnJvbSAnLi4vLi4vc3JjL3NlcnZlci9wcm9kdWN0LXBvcnRmb2xpby5qcyc7',
            'TEST_ADD_ANCHOR': '',
            'TEST_ADD_NEW': '',
            'TEST_ASSERT_OLD': '',
            'TEST_ASSERT_NEW': '',
            'TEST_UI_ANCHOR': 'dGVzdCgnUG9ydGZvbGlvIC9hcGkvcHJvZHVjdC9zaXRlcyBkZWNpc2lvbk9yZGVyIG1ldGFkYXRhIG5hbWVzIHRoZSBleGFjdCBzdGF0dXMgY29kZXMgZW1pdHRlZCBhbmQgc29ydGVkIGJ5IGJvdGggcnVudGltZXMnLCAoKSA9PiB7',
            'TEST_UI_NEW': ''
          }
          decoded={k:base64.b64decode(v).decode() for k,v in encoded.items()}
          cache={}
          for path, old_key, new_key in replacements:
              p=Path(path)
              text=cache.get(path, p.read_text())
              old=decoded[old_key]; new=decoded[new_key]
              assert text.count(old)==1,(path,old_key,text.count(old))
              assert new not in text,(path,new_key)
              cache[path]=text.replace(old,new,1)
          for path,text in cache.items(): Path(path).write_text(text)
          PY
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=('php/src/ProductPortfolioService.php' 'src/client/ProductApp.tsx' 'src/server/product-portfolio.ts' 'tests/unit/product-portfolio-decision-ladder-truth.test.ts')
          test "${#changed[@]}" -eq 4
          for i in 0 1 2 3; do test "${changed[$i]}" = "${expected[$i]}"; done
          grep -Fq "productBusinessValueRank(a.business_value) - productBusinessValueRank(b.business_value)" src/server/product-portfolio.ts
          grep -Fq "businessValueRank" php/src/ProductPortfolioService.php
          grep -Fq "业务价值 {businessValue(site.business_value)}" src/client/ProductApp.tsx
          echo P05_BUSINESS_VALUE_CONSTRUCT=PASS

      - name: Write exact Product files through GitHub Contents API
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64,json,os,subprocess,urllib.parse,urllib.request
          repo=os.environ['P05_REPO']; branch=os.environ['P05_BRANCH']; token=os.environ['VF_RELEASE_WRITE_TOKEN']
          paths=['php/src/ProductPortfolioService.php','src/client/ProductApp.tsx','src/server/product-portfolio.ts','tests/unit/product-portfolio-decision-ladder-truth.test.ts']
          headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}
          for path in paths:
              sha=subprocess.check_output(['git','rev-parse','HEAD:'+path],text=True).strip()
              content=base64.b64encode(open(path,'rb').read()).decode()
              body=json.dumps({'message':'feat(product): apply Business Value to Portfolio priority','content':content,'sha':sha,'branch':branch}).encode()
              url=f'https://api.github.com/repos/{repo}/contents/{urllib.parse.quote(path)}'
              req=urllib.request.Request(url,data=body,method='PUT',headers=headers)
              with urllib.request.urlopen(req) as r:
                  out=json.load(r)
                  assert out.get('commit',{}).get('sha')
                  print(path,out['commit']['sha'])
          print('P05_BUSINESS_VALUE_WRITE=PASS')
          PY

      - name: Read back exact final Product scope
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64,json,os,urllib.parse,urllib.request
          repo=os.environ['P05_REPO']; branch=os.environ['P05_BRANCH']; token=os.environ['VF_RELEASE_WRITE_TOKEN']; base=os.environ['P05_BASE_SHA']
          headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers)) as r:return json.load(r)
          head=get(f'https://api.github.com/repos/{repo}/branches/{urllib.parse.quote(branch,safe="")}')['commit']['sha']
          cmp=get(f'https://api.github.com/repos/{repo}/compare/{base}...{head}')
          files=sorted(x['filename'] for x in cmp['files'])
          expected=['php/src/ProductPortfolioService.php','src/client/ProductApp.tsx','src/server/product-portfolio.ts','tests/unit/product-portfolio-decision-ladder-truth.test.ts']
          assert cmp['status']=='ahead',cmp['status']
          assert cmp['behind_by']==0,cmp['behind_by']
          assert files==expected,(files,expected)
          version=get(f'https://api.github.com/repos/{repo}/contents/VERSION?ref={urllib.parse.quote(branch)}')
          assert base64.b64decode(version['content']).decode().strip()=='1.2.4'
          print('P05_BUSINESS_VALUE_FINAL_HEAD='+head)
          print('P05_BUSINESS_VALUE_FINAL_SCOPE=PASS')
          PY
