name: S01 Mature Admin R8 1.21.865 Final Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-selftest-current.yml'

permissions:
  contents: read

jobs:
  final-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact Ops final candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 5d04995c99baccb28fee51ded626984243c93720
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: ops
          persist-credentials: false

      - name: Verify release identity
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='277aac4ff4eec0d5fb474568bbb9ea2039aad708'
          HEAD='5d04995c99baccb28fee51ded626984243c93720'
          test "$(git -C ops rev-parse HEAD)" = "$HEAD"
          test "$(cat ops/VERSION)" = '1.21.865'
          grep -Fq 'Version: 1.21.865' ops/vf-ops.php
          grep -Fq "VF_OPS_VERSION', '1.21.865'" ops/vf-ops.php
          grep -Fq "VF_OPS_ROUND', 'S01-MATURE-ADMIN-R8-VISUAL-FIDELITY'" ops/vf-ops.php
          python3 - <<'PY'
          import pathlib, subprocess
          base='277aac4ff4eec0d5fb474568bbb9ea2039aad708'
          old=subprocess.check_output(['git','-C','ops','show',f'{base}:vf-ops.php'], text=True)
          new=pathlib.Path('ops/vf-ops.php').read_text()
          expected=old.replace('Version: 1.21.864','Version: 1.21.865')
          expected=expected.replace("VF_OPS_VERSION', '1.21.864'","VF_OPS_VERSION', '1.21.865'")
          expected=expected.replace("VF_OPS_ROUND', 'S01-MATURE-ADMIN-R7-TOOLS-QUALITY'","VF_OPS_ROUND', 'S01-MATURE-ADMIN-R8-VISUAL-FIDELITY'")
          assert new == expected, 'vf-ops.php changed beyond approved R8 release identity'
          print('S01_R8_121865_IDENTITY=PASS')
          PY

      - name: Syntax and R8 contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l ops/vf-ops.php
          php -l ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php
          php -l ops/tests/s01-mature-admin-r8-visual-fidelity-contract.php
          php ops/tests/s01-mature-admin-r8-visual-fidelity-contract.php
          php ops/tests/top-domains-visible-ui-contract.php
          echo 'S01_R8_121865_CONTRACTS=PASS'

      - name: Exact six-file release fence
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/expected <<'EOF'
          VERSION
          assets/css/current/admin-s01-mature-pages-r8.css
          assets/css/current/admin-s01-product-shell-r3.css
          includes/views/admin-style-helpers/admin-s01-uiux-polish.php
          tests/s01-mature-admin-r8-visual-fidelity-contract.php
          vf-ops.php
          EOF
          git -C ops diff --name-only '277aac4ff4eec0d5fb474568bbb9ea2039aad708'...HEAD | sort > /tmp/actual
          sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual
          echo 'S01_R8_121865_SCOPE=PASS'

      - name: Runtime ownership and secret fence
        shell: bash
        run: |
          set -Eeuo pipefail
          loader='ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php'
          shell='ops/assets/css/current/admin-s01-product-shell-r3.css'
          pages='ops/assets/css/current/admin-s01-mature-pages-r8.css'
          grep -Fq 'admin-s01-product-shell-r3.css' "$loader"
          grep -Fq 'admin-s01-mature-pages-r8.css' "$loader"
          ! grep -Fq 'admin-s01-product-shell-r2.css' "$loader"
          ! grep -Fq 'admin-s01-mature-pages-r7.css' "$loader"
          ! grep -Fq 'admin-s01-preview-samples-r5.css' "$loader"
          grep -Fq "vf_m3u8_first_run_initialize((int)get_current_user_id(), 'vf_ops_owner_workbench')" ops/includes/s01/tool-workbench.php
          grep -Fq 'FINAL_ONLINE_PASS=' ops/includes/admin-v13/views/acceptance_overview.php
          ! grep -q ':root' "$shell"
          ! grep -q ':root' "$pages"
          ! grep -q '\.vf-m3u8-' "$shell"
          ! grep -q '\.vf-m3u8-' "$pages"
          ! git -C ops diff '277aac4ff4eec0d5fb474568bbb9ea2039aad708'...HEAD | grep -E 'ghp_[A-Za-z0-9]|github_pat_|BEGIN (RSA |OPENSSH )?PRIVATE KEY'
          echo 'S01_R8_121865_OWNER_SECRET_FENCE=PASS'
          echo 'S01_R8_121865_FINAL_GATE=PASS'
