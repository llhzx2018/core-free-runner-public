          expected_sha={
            'src/server/product-optimization.ts':'b569ae84172e7f0747dbc9fc332e4dad352b98a7',
            'php/src/ProductOptimizationService.php':'4b0e8415c9546894721d6329bb06a0f9b7756e29',
