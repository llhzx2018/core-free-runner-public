name: S01 Mature Admin R9 1.21.866 Final Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-selftest-current.yml'

permissions:
  contents: read

concurrency:
  group: s01-r9-121866-final-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  final-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact Ops final candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 94a4355a1a6a1fa653922990cae246f90f9f790f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: ops
          persist-credentials: false

      - name: Verify 1.21.866 release identity
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='d84234c73265c96d8fa308314f8447124157ed7c'
          HEAD='94a4355a1a6a1fa653922990cae246f90f9f790f'
          test "$(git -C ops rev-parse HEAD)" = "$HEAD"
          test "$(cat ops/VERSION)" = '1.21.866'
          grep -Fq 'Version: 1.21.866' ops/vf-ops.php
          grep -Fq "VF_OPS_VERSION', '1.21.866'" ops/vf-ops.php
          grep -Fq "VF_OPS_ROUND', 'S01-MATURE-ADMIN-R9-VISUAL-CLOSURE'" ops/vf-ops.php
          python3 - <<'PY'
          import pathlib, subprocess
          base='d84234c73265c96d8fa308314f8447124157ed7c'
          old=subprocess.check_output(['git','-C','ops','show',f'{base}:vf-ops.php'], text=True)
          new=pathlib.Path('ops/vf-ops.php').read_text()
          expected=old.replace('Version: 1.21.865','Version: 1.21.866')
          expected=expected.replace("VF_OPS_VERSION', '1.21.865'","VF_OPS_VERSION', '1.21.866'")
          expected=expected.replace("VF_OPS_ROUND', 'S01-MATURE-ADMIN-R8-VISUAL-FIDELITY'","VF_OPS_ROUND', 'S01-MATURE-ADMIN-R9-VISUAL-CLOSURE'")
          assert new == expected, 'vf-ops.php changed beyond approved version/round identity lines'
          print('S01_R9_121866_IDENTITY=PASS')
          PY

      - name: Exact six-file release fence
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='d84234c73265c96d8fa308314f8447124157ed7c'
          cat > /tmp/expected <<'EOF'
          VERSION
          assets/css/current/admin-s01-product-shell-r3.css
          assets/js/admin-acceptance-overview.js
          assets/js/admin-s01-domain-shell-r1.js
          tests/s01-mature-admin-r9-visual-closure-contract.php
          vf-ops.php
          EOF
          git -C ops diff --name-only "$BASE"...HEAD | sort > /tmp/actual
          diff -u <(sort /tmp/expected) /tmp/actual
          echo 'S01_R9_121866_EXACT_SCOPE=PASS'

      - name: Syntax and final R9 contract
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l ops/vf-ops.php
          node --check ops/assets/js/admin-s01-domain-shell-r1.js
          node --check ops/assets/js/admin-acceptance-overview.js
          php -l ops/tests/s01-mature-admin-r9-visual-closure-contract.php
          php ops/tests/s01-mature-admin-r9-visual-closure-contract.php
          echo 'S01_R9_121866_SYNTAX_CONTRACT=PASS'

      - name: Screenshot closure and ownership fence
        shell: bash
        run: |
          set -Eeuo pipefail
          css='ops/assets/css/current/admin-s01-product-shell-r3.css'
          shelljs='ops/assets/js/admin-s01-domain-shell-r1.js'
          qualityjs='ops/assets/js/admin-acceptance-overview.js'
          grep -Fq 'background:#0e7490!important;' "$css"
          grep -Fq 'border-left:0!important;' "$css"
          grep -Fq 'min-height:56px!important;' "$css"
          grep -Fq 'aggregateToolBlockers' "$shelljs"
          grep -Fq 'polylang-languages' "$shelljs"
          grep -Fq 'simplifyOverviewNavigation' "$qualityjs"
          grep -Fq 'vf_m3u8_first_run_readiness' ops/includes/s01/tool-workbench.php
          grep -Fq 'vf_m3u8_first_run_initialize' ops/includes/s01/tool-workbench.php
          ! grep -Fq 'update_option(' ops/includes/s01/tool-workbench.php
          grep -Fq 'FINAL_ONLINE_PASS=' ops/includes/admin-v13/views/acceptance_overview.php
          ! git -C ops diff 'd84234c73265c96d8fa308314f8447124157ed7c'...HEAD | grep -E 'ghp_[A-Za-z0-9]|github_pat_|BEGIN (RSA |OPENSSH )?PRIVATE KEY'
          echo 'S01_R9_121866_OWNERSHIP_SECRET=PASS'
          echo 'S01_MATURE_ADMIN_R9_121866_FINAL_GATE=PASS'
