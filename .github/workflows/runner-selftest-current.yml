name: S01 Mature Admin V6 R3 Quality Overview Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-selftest-current.yml'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPS_REPO: llhzx2018/vf-tools-ops
      OPS_SHA: 0b594a90dc680cd396572c09449c2ae7511a9a92
      BASE_SHA: 96fbc3d53fdf64d895389e8a09e668f76db504ce
    steps:
      - name: Checkout exact Ops V6 R3 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 0b594a90dc680cd396572c09449c2ae7511a9a92
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: ops
          persist-credentials: false

      - name: Exact five-file R3 fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$OPS_SHA"
          mapfile -t files < <(git -C ops diff --name-only "$BASE_SHA" "$OPS_SHA" | sort)
          printf '%s\n' "${files[@]}"
          test "${#files[@]}" = '5'
          expected=(
            'assets/css/current/admin-s01-v6-quality-r3.css'
            'assets/js/admin-acceptance-overview.js'
            'includes/admin-v13/views/acceptance_overview.php'
            'includes/views/admin-style-helpers/admin-s01-uiux-polish.php'
            'tests/s01-v6-r3-quality-overview-contract.php'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "$(printf '%s\n' "${files[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"
          echo 'S01_V6_R3_EXACT_SCOPE=PASS'

      - name: PHP JS syntax and R3 contract
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l ops/includes/admin-v13/views/acceptance_overview.php
          php -l ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php
          php -l ops/tests/s01-v6-r3-quality-overview-contract.php
          node --check ops/assets/js/admin-acceptance-overview.js
          php ops/tests/s01-v6-r3-quality-overview-contract.php
          echo 'S01_V6_R3_CONTRACT=PASS'

      - name: Quality server DOM fence
        shell: bash
        run: |
          set -Eeuo pipefail
          view='ops/includes/admin-v13/views/acceptance_overview.php'
          grep -Fq 'vf-v6-quality-page' "$view"
          grep -Fq 'vf-v6-quality-stage-rail' "$view"
          grep -Fq 'vf-v6-quality-machine-grid' "$view"
          ! grep -Fq 'vf-r7-' "$view"
          ! grep -Fq 'vf-accept-product' "$view"
          js='ops/assets/js/admin-acceptance-overview.js'
          ! grep -Fq 'simplifyOverviewNavigation' "$js"
          ! grep -Fq '.remove()' "$js"
          grep -Fq 'vfOpsSoftRefresh' "$js"
          echo 'S01_V6_R3_SERVER_DOM=PASS'

      - name: Acceptance engineering truth fence
        shell: bash
        run: |
          set -Eeuo pipefail
          view='ops/includes/admin-v13/views/acceptance_overview.php'
          for route in acceptance_source publish_zip acceptance_online acceptance_components acceptance_export; do
            grep -Fq "'$route'" "$view"
          done
          grep -Fq "'FINAL_ONLINE_PASS='." "$view"
          # No acceptance service/controller/contract changed in R3.
          test -z "$(git -C ops diff --name-only "$BASE_SHA" "$OPS_SHA" -- 'includes/admin-v13/services/**' 'includes/acceptance/**' 'includes/release-acceptance-contract-service.php')"
          echo 'S01_V6_R3_ACCEPTANCE_TRUTH=PASS'

      - name: Design owner and legacy-layer fence
        shell: bash
        run: |
          set -Eeuo pipefail
          loader='ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php'
          css='ops/assets/css/current/admin-s01-v6-quality-r3.css'
          grep -Fq '$isQualityOverview' "$loader"
          grep -Fq 'admin-s01-v6-quality-r3.css' "$loader"
          grep -Fq 'if (!$isQualityOverview)' "$loader"
          grep -Fq 'body.vf-ops-v6-admin .vf-v6-quality-page' "$css"
          for bp in 1180 960 782 520; do grep -Fq "@media (max-width: ${bp}px)" "$css"; done
          ! grep -Fq ':root' "$css"
          ! grep -Fq '.vf-m3u8-' "$css"
          echo 'S01_V6_R3_DESIGN_OWNER=PASS'

      - name: Unrelated behavior source unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          for path in \
            includes/s01/tool-workbench.php \
            includes/s01/admin-shell-domain-contract.php \
            includes/wp-update/bootstrap.php \
            includes/admin-v13/route-contract.php; do
            test "$(git -C ops rev-parse "$BASE_SHA:$path")" = "$(git -C ops rev-parse "$OPS_SHA:$path")"
          done
          echo 'S01_V6_R3_UNRELATED_SOURCE=PASS'

      - name: Secret fence
        shell: bash
        run: |
          set -Eeuo pipefail
          files=(
            ops/assets/css/current/admin-s01-v6-quality-r3.css
            ops/assets/js/admin-acceptance-overview.js
            ops/includes/admin-v13/views/acceptance_overview.php
            ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php
            ops/tests/s01-v6-r3-quality-overview-contract.php
          )
          ! grep -EIn '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,})' "${files[@]}"
          echo 'S01_V6_R3_SECRET_FENCE=PASS'
