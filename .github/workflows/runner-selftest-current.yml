name: Public Runner Current Self Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths: ['.github/workflows/runner-selftest-current.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-runner-current-selftest-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout public runner control repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Hosted runner allocation proof
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "RUNNER_OS=$RUNNER_OS"
          uname -a
          php -v || true
          python3 --version
          echo 'PUBLIC_RUNNER_ALLOCATION=PASS'
      - name: Verify main push came from merged PR
        if: github.event_name == 'push'
        shell: bash
        env:
          VF_PUSH_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          python3 scripts/check_main_push_provenance.py --repository "$GITHUB_REPOSITORY" --sha "$VF_PUSH_SHA"
          echo 'MAIN_PUSH_PROVENANCE=PASS' >> "$GITHUB_ENV"
      - name: Verify Git Estate anti-drift
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: python3 scripts/check_estate_anti_drift.py --live
      - name: Build public-safe receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/runner
          PROVENANCE="${MAIN_PUSH_PROVENANCE:-NOT_APPLICABLE}"
          cat > evidence/runner/PUBLIC_RUNNER_CURRENT.txt <<EOF
          PUBLIC_RUNNER_ALLOCATION=PASS
          ESTATE_ANTI_DRIFT=PASS
          MAIN_PUSH_PROVENANCE=$PROVENANCE
          RUNNER_REPOSITORY=llhzx2018/core-free-runner-public
          PRIVATE_SOURCE_USED=GOV_DOC_AUTHORITY_ONLY
          SECRET_USED=REGISTERED_PRIVATE_READ_CAPABILITY
          PRIVATE_SOURCE_PERSISTED=NO
          MAIN_WRITE=NO
          USER_MANUAL_EXECUTION_REQUIRED=NO
          EOF
      - name: Upload public-safe receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 Node24
        with:
          name: public-runner-current-selftest-${{ github.run_id }}
          path: evidence/runner/PUBLIC_RUNNER_CURRENT.txt
          if-no-files-found: error
          retention-days: 14

  p05-v125-version-lock:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'write/p05-v125-version-lock-20260903'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact Product release branch read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: release/p05-v1.2.5-clean-20260903
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 2
      - name: Verify exact base
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '548257ea3d45234ebaafdeab6ab0a164c5c192a9'
          test "$(git rev-parse HEAD^{tree})" = '6afb88aabe9db95a51fc12afa0b81988a81c9bb0'
          test "$(cat VERSION)" = '1.2.4'
          test "$(node -p "require('./package.json').version")" = '1.2.4'
          echo P05_V125_VERSION_LOCK_BASE=PASS
      - name: Construct exact five-file v1.2.5 candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('.')
          (root/'VERSION').write_text('1.2.5\n')
          package=root/'package.json'; pkg=json.loads(package.read_text()); assert pkg['version']=='1.2.4'; pkg['version']='1.2.5'; package.write_text(json.dumps(pkg,ensure_ascii=False,indent=2)+'\n')
          app=root/'src/client/ProductApp.tsx'; text=app.read_text(); old='P05 · VF SEO · v1.2.4'; new='P05 · VF SEO · v1.2.5'; assert text.count(old)==1; app.write_text(text.replace(old,new,1))
          project=root/'VF_PROJECT.json'; p=json.loads(project.read_text()); assert p['version']=='1.2.4'
          p['status']='V1.2.5_RELEASE_CANDIDATE / OWNER_RELEASE_AUTHORIZED / PRODUCTION_V1.2.4_OWNER_OBSERVED'
          p['version']='1.2.5'; p['production_version']='1.2.4'; p['target_version']='1.2.5'; p['working_version']='1.2.5'; p['version_change']=True
          p['working_branch']='release/p05-v1.2.5-clean-20260903'; p['owner_real_use_review']='V1.2.4_OWNER_PRODUCTION_SCREENSHOT / READABILITY_DEFECT_CONFIRMED'; p['owner_real_use_pass']='PARTIAL / V1.2.4 VERSION OBSERVED; READABILITY HOTFIX REQUIRED'
          p['candidate_authorization']='OWNER_AUTHORIZED_V1.2.5_READABILITY_HOTFIX'; p['release_authorization']='OWNER_AUTHORIZED_V1.2.5 / EXECUTION_PENDING'; p['production_deployment_authorization']='PENDING_OWNER_BACKEND_UPDATE_AFTER_V1.2.5_PUBLICATION'
          p['next_action']='V1.2.5 FINAL RELEASE GATES → FORMAL FULL/TAG/RELEASE → UPDATE CHANNEL → OWNER BACKEND UPDATE'; p['deployment_readiness']='V1.2.5_RELEASE_CANDIDATE / PRODUCTION_V1.2.4_OWNER_OBSERVED'
          if isinstance(p.get('authority'),dict): p['authority']['release_candidate']='docs/authority/RELEASE_V1.2.5_CANDIDATE.md'
          project.write_text(json.dumps(p,ensure_ascii=False,indent=2)+'\n')
          (root/'docs/authority/RELEASE_V1.2.5_CANDIDATE.md').write_text('''# P05 · VF SEO v1.2.5 Release Candidate

Status: `OWNER_RELEASE_AUTHORIZED / FINAL_RELEASE_GATES_PENDING`

## Release basis

- Product main after readability merge: `548257ea3d45234ebaafdeab6ab0a164c5c192a9`
- Product tree: `6afb88aabe9db95a51fc12afa0b81988a81c9bb0`
- Owner-observed Production version: `v1.2.4`
- Target: `v1.2.5`
- Schema: `VF-SEO-SCHEMA@1 / 1` unchanged
- Database format: unchanged

## User-facing scope

Focused readability hotfix after owner-observed v1.2.4 Production showed materially undersized typography. The patch raises the Product typography hierarchy without changing SEO data, routing, runtime semantics, schema, or update behavior.

Browser-verified targets: navigation 14px desktop / 15px mobile, H1 30px, header copy 14px, website title 16px, key metric 18px, action button 13px, object title 13px, and zero desktop/mobile horizontal overflow.

## Verification already completed before release lock

- Product Native CI: Run `33690173360` / Job `100446871557` · PASS
- Governed Browser Gate: Run `33690821077` / Job `100448914890` · PASS
- Trigger Scope Gate: Run `33690821074` · PASS
- Workflow Archive Gate: Run `33690820994` · PASS
- Browser screenshot artifact: `9869964550`

## Release boundary

Only the readability change merged by Product PR #211 is in this hotfix. No unfinished multilingual-ordering experiment or unrelated L2 work is included. Production v1.2.5 must not be claimed until the Owner performs the backend update and real Production readback confirms it.
''')
          PY
          git diff --check
          test "$(git diff --name-only)" = $'VERSION\nVF_PROJECT.json\ndocs/authority/RELEASE_V1.2.5_CANDIDATE.md\npackage.json\nsrc/client/ProductApp.tsx'
          echo P05_V125_VERSION_LOCK_SCOPE=PASS
      - name: Write exact candidate files through GitHub Contents API
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          BRANCH='release/p05-v1.2.5-clean-20260903'
          MESSAGE='release: lock v1.2.5 readability hotfix candidate'
          for path in VERSION VF_PROJECT.json package.json src/client/ProductApp.tsx; do
            old_sha="$(git rev-parse HEAD:"$path")"
            content="$(base64 -w0 "$path")"
            gh api --method PUT "repos/llhzx2018/vf-seo/contents/$path" -f message="$MESSAGE" -f content="$content" -f branch="$BRANCH" -f sha="$old_sha" >/dev/null
          done
          path='docs/authority/RELEASE_V1.2.5_CANDIDATE.md'
          content="$(base64 -w0 "$path")"
          gh api --method PUT "repos/llhzx2018/vf-seo/contents/$path" -f message="$MESSAGE" -f content="$content" -f branch="$BRANCH" >/dev/null
          gh api "repos/llhzx2018/vf-seo/git/ref/heads/$BRANCH" --jq '.object.sha' > /tmp/p05-head
          echo "P05_V125_CANDIDATE_SHA=$(cat /tmp/p05-head)"
          echo P05_V125_VERSION_LOCK=PASS
      - name: Read back exact final branch scope
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          head="$(cat /tmp/p05-head)"
          gh api "repos/llhzx2018/vf-seo/compare/548257ea3d45234ebaafdeab6ab0a164c5c192a9...$head" > /tmp/compare.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/compare.json'))
          assert x['behind_by']==0 and x['ahead_by']==5, (x['ahead_by'],x['behind_by'])
          files=[f['filename'] for f in x['files']]
          expected=['VERSION','VF_PROJECT.json','docs/authority/RELEASE_V1.2.5_CANDIDATE.md','package.json','src/client/ProductApp.tsx']
          assert files==expected,(files,expected)
          print('P05_V125_FINAL_SCOPE=PASS')
          print('P05_V125_FINAL_TREE='+x['commits'][-1]['commit']['tree']['sha'])
          PY
          echo P05_MAIN_WRITE=0
          echo P05_PRODUCTION_WRITE=0
