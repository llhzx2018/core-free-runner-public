name: Public Runner Current Self Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: p05-v125-atomic-publish-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  publish-atomic-assets:
    if: github.event_name == 'pull_request' && github.head_ref == 'release/p05-v125-atomic-publish-20260904'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ATOMIC_RUN: '33777964749'
      ATOMIC_JOB: '100724316608'
      ATOMIC_ARTIFACT_ID: '9902394552'
      ATOMIC_ARTIFACT_NAME: P05_V1.2.5_VPS_ATOMIC_bdd5995a8f17415bd29596cf35f5a952281ed29e
      ATOMIC_ARTIFACT_DIGEST: c02c0ba55c41653c3e4b632043cb564df3eb9f5b164702a5aa76212bc15c219f
      RELEASE_ID: '382166024'
      RELEASE_TAG: v1.2.5
      RELEASE_TARGET: e37db145111366a29fc91c33348216a7af79ae8c
      FULL_NAME: VF_SEO_V1.2.5_FULL.zip
      FULL_SHA256: 6dada805391929de872355e9927365496412aaba001a61389f629d33eea3e2f3
      UPDATE_SHA256: 44b125c191c1d8be4b21fa1a73cfedf955ac071b7c770ccd9cc45bfba0c5b760
      UPDATE_BYTES: '796722'
      REPAIR_SHA256: eb3db1ef1475dfabc99e8bbd37e1cacef0b52835f153faf0a4eb161d64ae8ca9
      REPAIR_BYTES: '2158905'
    steps:
      - name: Bind exact Atomic PASS and artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$ATOMIC_RUN" > /tmp/run.json
          gh api "repos/llhzx2018/core-free-runner-public/actions/jobs/$ATOMIC_JOB" > /tmp/job.json
          gh api "repos/llhzx2018/core-free-runner-public/actions/artifacts/$ATOMIC_ARTIFACT_ID" > /tmp/artifact.json
          python3 - <<'PY'
          import json,os
          run=json.load(open('/tmp/run.json')); job=json.load(open('/tmp/job.json')); art=json.load(open('/tmp/artifact.json'))
          assert run['id']==int(os.environ['ATOMIC_RUN']) and run['conclusion']=='success'
          assert job['id']==int(os.environ['ATOMIC_JOB']) and job['run_id']==int(os.environ['ATOMIC_RUN']) and job['conclusion']=='success' and job['name']=='p05-v125-atomic'
          assert art['id']==int(os.environ['ATOMIC_ARTIFACT_ID']) and art['name']==os.environ['ATOMIC_ARTIFACT_NAME'] and not art['expired']
          assert art.get('digest')=='sha256:'+os.environ['ATOMIC_ARTIFACT_DIGEST']
          print('P05_V125_ATOMIC_EVIDENCE_BINDING=PASS')
          PY

      - name: Download exact Atomic evidence artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p05-atomic
          gh run download "$ATOMIC_RUN" --repo llhzx2018/core-free-runner-public --name "$ATOMIC_ARTIFACT_NAME" --dir /tmp/p05-atomic

      - name: Verify exact six Atomic assets and authority
        working-directory: /tmp/p05-atomic
        run: |
          set -Eeuo pipefail
          for f in repair-v1.2.5.php VF_SEO_V1.2.5_UPDATE.zip atomic-self-test.json P05-V1.2.5-ATOMIC-METADATA.json P05-V1.2.5-ATOMIC-GATE.json SHA256SUMS.txt; do test -s "$f"; done
          test "$(sha256sum VF_SEO_V1.2.5_UPDATE.zip | awk '{print $1}')" = "$UPDATE_SHA256"
          test "$(stat -c%s VF_SEO_V1.2.5_UPDATE.zip)" = "$UPDATE_BYTES"
          test "$(sha256sum repair-v1.2.5.php | awk '{print $1}')" = "$REPAIR_SHA256"
          test "$(stat -c%s repair-v1.2.5.php)" = "$REPAIR_BYTES"
          python3 - <<'PY'
          import json,hashlib,pathlib
          gate=json.load(open('P05-V1.2.5-ATOMIC-GATE.json')); meta=json.load(open('P05-V1.2.5-ATOMIC-METADATA.json'))
          assert gate['project_id']=='P05' and gate['source_version']=='1.2.4' and gate['target_version']=='1.2.5' and gate['result']=='PASS'
          for k in ['self_test','actual_upgrade','data_preservation','idempotence','rollback','interruption_recovery','browser_single_php','proxy_https_same_origin']:
              assert gate[k]=='PASS', (k,gate.get(k))
          assert gate['production_write']==0 and gate['distribution_revision']=='R1'
          assert meta['source_version']=='1.2.4' and meta['target_version']=='1.2.5'
          assert meta['proxy_https_same_origin']=='PASS' and meta['distribution_revision']=='R1' and meta['production_write']==0
          expected={}
          for line in pathlib.Path('SHA256SUMS.txt').read_text().splitlines():
              h,p=line.split(None,1); expected[pathlib.Path(p.strip()).name]=h
          names=['repair-v1.2.5.php','VF_SEO_V1.2.5_UPDATE.zip','atomic-self-test.json','P05-V1.2.5-ATOMIC-METADATA.json','P05-V1.2.5-ATOMIC-GATE.json']
          assert set(expected)==set(names), (expected.keys(),names)
          for n in names:
              actual=hashlib.sha256(pathlib.Path(n).read_bytes()).hexdigest(); assert actual==expected[n], (n,actual,expected[n])
          for n in names+['SHA256SUMS.txt']:
              p=pathlib.Path(n); h=hashlib.sha256(p.read_bytes()).hexdigest(); print(f'P05_LOCAL_{n}_SHA256={h}'); print(f'P05_LOCAL_{n}_BYTES={p.stat().st_size}')
          print('P05_V125_ATOMIC_SIX_ASSETS_LOCAL=PASS')
          PY

      - name: Verify formal Release before supplemental write
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api "repos/llhzx2018/vf-seo/releases/tags/$RELEASE_TAG" > /tmp/release-before.json
          python3 - <<'PY'
          import json,os
          r=json.load(open('/tmp/release-before.json')); a={x['name']:x for x in r['assets']}
          assert r['id']==int(os.environ['RELEASE_ID']) and r['tag_name']==os.environ['RELEASE_TAG'] and r['target_commitish']==os.environ['RELEASE_TARGET']
          assert a[os.environ['FULL_NAME']]['digest']=='sha256:'+os.environ['FULL_SHA256']
          names=['repair-v1.2.5.php','VF_SEO_V1.2.5_UPDATE.zip','atomic-self-test.json','P05-V1.2.5-ATOMIC-METADATA.json','P05-V1.2.5-ATOMIC-GATE.json','SHA256SUMS.txt']
          assert all(x not in a for x in names), [x for x in names if x in a]
          print('P05_V125_RELEASE_PRE_SUPPLEMENT=PASS')
          PY

      - name: Publish exact Atomic assets to v1.2.5 Release
        working-directory: /tmp/p05-atomic
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh release upload "$RELEASE_TAG" --repo llhzx2018/vf-seo VF_SEO_V1.2.5_UPDATE.zip repair-v1.2.5.php atomic-self-test.json P05-V1.2.5-ATOMIC-METADATA.json P05-V1.2.5-ATOMIC-GATE.json SHA256SUMS.txt
          echo P05_V125_ATOMIC_RELEASE_UPLOAD=PASS

      - name: Remote readback all v1.2.5 Release assets
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api "repos/llhzx2018/vf-seo/releases/tags/$RELEASE_TAG" > /tmp/release-after.json
          python3 - <<'PY'
          import json,os,hashlib,pathlib
          r=json.load(open('/tmp/release-after.json')); a={x['name']:x for x in r['assets']}
          assert r['id']==int(os.environ['RELEASE_ID']) and r['target_commitish']==os.environ['RELEASE_TARGET']
          assert a[os.environ['FULL_NAME']]['digest']=='sha256:'+os.environ['FULL_SHA256']
          names=['repair-v1.2.5.php','VF_SEO_V1.2.5_UPDATE.zip','atomic-self-test.json','P05-V1.2.5-ATOMIC-METADATA.json','P05-V1.2.5-ATOMIC-GATE.json','SHA256SUMS.txt']
          for name in names:
              p=pathlib.Path('/tmp/p05-atomic')/name; digest=hashlib.sha256(p.read_bytes()).hexdigest(); size=p.stat().st_size
              assert a[name]['digest']=='sha256:'+digest and a[name]['size']==size
              print(f'P05_ASSET_{name}_ID={a[name]["id"]}'); print(f'P05_ASSET_{name}_SHA256={digest}'); print(f'P05_ASSET_{name}_BYTES={size}')
          assert a['VF_SEO_V1.2.5_UPDATE.zip']['digest']=='sha256:'+os.environ['UPDATE_SHA256'] and a['VF_SEO_V1.2.5_UPDATE.zip']['size']==int(os.environ['UPDATE_BYTES'])
          assert a['repair-v1.2.5.php']['digest']=='sha256:'+os.environ['REPAIR_SHA256'] and a['repair-v1.2.5.php']['size']==int(os.environ['REPAIR_BYTES'])
          print('P05_V125_ATOMIC_RELEASE_REMOTE_READBACK=PASS')
          print('P05_CORE_UPDATES_WRITE=0')
          print('P05_PRODUCTION_WRITE=0')
          PY
