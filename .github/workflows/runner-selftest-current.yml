name: Public Runner Current Self Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths: ['.github/workflows/runner-selftest-current.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-runner-current-selftest-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout public runner control repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Hosted runner allocation proof
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "RUNNER_OS=$RUNNER_OS"
          uname -a
          php -v || true
          python3 --version
          echo 'PUBLIC_RUNNER_ALLOCATION=PASS'

      - name: Verify main push came from merged PR
        if: github.event_name == 'push'
        shell: bash
        env:
          VF_PUSH_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          python3 scripts/check_main_push_provenance.py \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$VF_PUSH_SHA"
          echo 'MAIN_PUSH_PROVENANCE=PASS' >> "$GITHUB_ENV"

      - name: Verify Git Estate anti-drift
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: python3 scripts/check_estate_anti_drift.py --live

      - name: Build public-safe receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/runner
          PROVENANCE="${MAIN_PUSH_PROVENANCE:-NOT_APPLICABLE}"
          cat > evidence/runner/PUBLIC_RUNNER_CURRENT.txt <<EOF
          PUBLIC_RUNNER_ALLOCATION=PASS
          ESTATE_ANTI_DRIFT=PASS
          MAIN_PUSH_PROVENANCE=$PROVENANCE
          RUNNER_REPOSITORY=llhzx2018/core-free-runner-public
          PRIVATE_SOURCE_USED=GOV_DOC_AUTHORITY_ONLY
          SECRET_USED=REGISTERED_PRIVATE_READ_CAPABILITY
          PRIVATE_SOURCE_PERSISTED=NO
          MAIN_WRITE=NO
          USER_MANUAL_EXECUTION_REQUIRED=NO
          EOF

      - name: Upload public-safe receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 Node24
        with:
          name: public-runner-current-selftest-${{ github.run_id }}
          path: evidence/runner/PUBLIC_RUNNER_CURRENT.txt
          if-no-files-found: error
          retention-days: 14

  p05-portfolio-primary-action-writer:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'write/p05-portfolio-primary-action-20260903'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact Product candidate branch read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: l2/portfolio-primary-action-20260903
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 2

      - name: Verify exact Product base
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '7e9d71a95317fed9bd4f0c280dcb14341b64b173'
          test "$(git rev-parse HEAD^{tree})" = 'ca6772fbb44e8c48f2bc16a19e116b6d568459e9'
          test "$(cat VERSION)" = '1.2.4'
          echo P05_PORTFOLIO_PRIMARY_BASE=PASS

      - name: Construct exact portfolio primary-action candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app=Path('src/client/ProductApp.tsx')
          text=app.read_text()
          old_anchor="""    const relatedPage = relatedPageId
      ? { label: '打开落地页证据 →', open: () => onOpenPage(site.id, relatedPageId) }
      : null;
    return <article className=\"p05v2-site-row\" key={site.id}>"""
          new_anchor="""    const relatedPage = relatedPageId
      ? { label: '打开落地页证据 →', open: () => onOpenPage(site.id, relatedPageId) }
      : null;
    const statusCode = String(site.status?.code ?? '').toUpperCase();
    const primaryAction = blockerDestination ? 'blocker' : statusCode === 'OPPORTUNITY' && exactOpportunity ? 'opportunity' : 'overview';
    return <article className=\"p05v2-site-row\" key={site.id}>"""
          assert text.count(old_anchor)==1, text.count(old_anchor)
          text=text.replace(old_anchor,new_anchor,1)

          old_actions="""<button onClick={() => onOpen(site.id)}>进入网站 →</button>{blockerDestination && <button type=\"button\" onClick={() => onOpenView(site.id, blockerDestination.view)}>{blockerDestination.label}</button>}{exactOpportunity && <button type=\"button\" onClick={exactOpportunity.open}>{exactOpportunity.label}</button>}{relatedPage && <button type=\"button\" onClick={relatedPage.open}>{relatedPage.label}</button>}"""
          new_actions="""{primaryAction === 'blocker' ? <button type=\"button\" className=\"primary\" onClick={() => onOpenView(site.id, blockerDestination!.view)}>{blockerDestination!.label}</button> : primaryAction === 'opportunity' ? <button type=\"button\" className=\"primary\" onClick={exactOpportunity!.open}>{exactOpportunity!.label}</button> : <button type=\"button\" className=\"primary\" onClick={() => onOpen(site.id)}>进入网站 →</button>}{primaryAction !== 'overview' && <button type=\"button\" onClick={() => onOpen(site.id)}>进入网站 →</button>}{exactOpportunity && primaryAction !== 'opportunity' && <button type=\"button\" onClick={exactOpportunity.open}>{exactOpportunity.label}</button>}{relatedPage && <button type=\"button\" onClick={relatedPage.open}>{relatedPage.label}</button>}"""
          assert text.count(old_actions)==1, text.count(old_actions)
          text=text.replace(old_actions,new_actions,1)
          app.write_text(text)

          css=Path('src/client/product-app.css')
          style=css.read_text()
          anchor='.p05v2-site-action button{width:100%;background:#f7fbfb}'
          replacement=anchor+'.p05v2-site-row .p05v2-site-action button.primary{background:#0d96a4;color:#fff;border-color:#0d8c99}'
          assert style.count(anchor)==1, style.count(anchor)
          style=style.replace(anchor,replacement,1)
          css.write_text(style)

          result=app.read_text()
          assert "const primaryAction = blockerDestination ? 'blocker'" in result
          assert "statusCode === 'OPPORTUNITY' && exactOpportunity ? 'opportunity' : 'overview'" in result
          assert result.count('className="primary"')==3
          assert 'blockerDestination!.view' in result
          assert 'exactOpportunity!.open' in result
          assert 'primaryAction !== \'overview\'' in result
          assert 'primaryAction !== \'opportunity\'' in result
          assert 'button.primary{background:#0d96a4;color:#fff;border-color:#0d8c99}' in css.read_text()
          print('P05_PORTFOLIO_PRIMARY_CONSTRUCT=PASS')
          PY
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = 'src/client/ProductApp.tsx'
          test "${changed[1]}" = 'src/client/product-app.css'
          test "$(cat VERSION)" = '1.2.4'
          echo P05_PORTFOLIO_PRIMARY_SCOPE=PASS

      - name: Write exact Product files through GitHub Contents API
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          BRANCH='l2/portfolio-primary-action-20260903'
          current='7e9d71a95317fed9bd4f0c280dcb14341b64b173'
          for path in src/client/ProductApp.tsx src/client/product-app.css; do
            old_sha="$(gh api "repos/llhzx2018/vf-seo/contents/$path?ref=$BRANCH" --jq '.sha')"
            content="$(base64 -w0 "$path")"
            gh api --method PUT "repos/llhzx2018/vf-seo/contents/$path" \
              -f message='refactor(ui): make portfolio next action explicit' \
              -f content="$content" \
              -f branch="$BRANCH" \
              -f sha="$old_sha" >/dev/null
          done
          gh api "repos/llhzx2018/vf-seo/git/ref/heads/$BRANCH" --jq '.object.sha' > /tmp/p05-head
          echo "P05_PORTFOLIO_PRIMARY_SHA=$(cat /tmp/p05-head)"
          echo P05_PORTFOLIO_PRIMARY_WRITE=PASS

      - name: Read back exact final Product scope
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          head="$(cat /tmp/p05-head)"
          gh api "repos/llhzx2018/vf-seo/compare/7e9d71a95317fed9bd4f0c280dcb14341b64b173...$head" > /tmp/compare.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/compare.json'))
          assert x['behind_by']==0,(x['ahead_by'],x['behind_by'])
          files=sorted(f['filename'] for f in x['files'])
          assert files==['src/client/ProductApp.tsx','src/client/product-app.css'],files
          assert 1 <= x['ahead_by'] <= 2,x['ahead_by']
          print('P05_PORTFOLIO_PRIMARY_FINAL_SCOPE=PASS')
          print('P05_PORTFOLIO_PRIMARY_FINAL_TREE='+x['commits'][-1]['commit']['tree']['sha'])
          PY
          echo P05_MAIN_WRITE=0
          echo P05_RELEASE_WRITE=0
          echo P05_PRODUCTION_WRITE=0
