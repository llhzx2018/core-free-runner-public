name: Diagnose core-updates S01-C02 1.21.864

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-selftest-current.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: e1320a92784c641db82e46efc94fa93e4223742f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          path: core-updates
          persist-credentials: false

      - name: Exact source proof
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C core-updates rev-parse HEAD)" = 'e1320a92784c641db82e46efc94fa93e4223742f'
          grep -Fq '"target_version": "1.21.864"' core-updates/projects/S01-C02.json
          grep -Fq '"1.21.863"' core-updates/projects/S01-C02.json
          grep -Fq '"release_tag": "v1.21.864"' core-updates/projects/S01-C02.json
          grep -Fq 'bee46bc48ca4249da08f62f7756f914183de41916491b72fdf3ea432318179da' core-updates/projects/S01-C02.json
          grep -Fq '"runtime_file_count": 941' core-updates/projects/S01-C02.json
          echo 'CORE_UPDATES_121864_EXACT_SOURCE=PASS'

      - name: Manifest Contract Audit with full output
        shell: bash
        run: |
          set -o pipefail
          cd core-updates
          python3 scripts/check_manifest_contract.py 2>&1 | tee /tmp/manifest-audit.log
          status=${PIPESTATUS[0]}
          echo "MANIFEST_AUDIT_EXIT=$status"
          exit "$status"

      - name: PHP syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          cd core-updates
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Update Core regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd core-updates
          php update-core/php/tests/run.php
          echo 'CORE_UPDATES_121864_REGRESSION=PASS'
