name: S01 Mature Admin R7 Tools Quality Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-selftest-current.yml'

permissions:
  contents: read

concurrency:
  group: s01-r7-tools-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  candidate-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact Ops R7 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          repository: llhzx2018/vf-tools-ops
          ref: d4304dbfd56737da2b0dfdeeb84289ba30642523
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: ops
          persist-credentials: false

      - name: Verify exact source identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = 'd4304dbfd56737da2b0dfdeeb84289ba30642523'
          test "$(cat ops/VERSION)" = '1.21.863'
          echo 'S01_R7_SOURCE_IDENTITY=PASS'

      - name: Syntax checks
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l ops/includes/s01/tool-workbench.php
          php -l ops/includes/admin-v13/views/acceptance_overview.php
          php -l ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php
          node --check ops/assets/js/admin-s01-domain-shell-r1.js
          node --check ops/assets/js/admin-s01-mature-shell-r7.js
          echo 'S01_R7_SYNTAX=PASS'

      - name: Mature R7 contract
        shell: bash
        run: |
          set -Eeuo pipefail
          php ops/tests/s01-mature-admin-r7-tools-quality-contract.php

      - name: Six-domain and page structure regression
        shell: bash
        run: |
          set -Eeuo pipefail
          for label in '工作台' '工具' '内容与 SEO' '质量' '发布' '系统'; do
            grep -Fq "'label'=>'$label'" ops/includes/s01/admin-shell-domain-contract.php
          done
          grep -Fq "'pages'=>['vf-toolsite-tools']" ops/includes/s01/admin-shell-domain-contract.php
          grep -Fq "'pages'=>['vf-toolsite-online-acceptance']" ops/includes/s01/admin-shell-domain-contract.php
          grep -Fq 'admin-s01-product-shell-r2.css' ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php
          grep -Fq 'admin-s01-mature-pages-r7.css' ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php
          php ops/tests/top-domains-visible-ui-contract.php
          echo 'S01_R7_RELATED_REGRESSION=PASS'

      - name: Changed-file and ownership fence
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C ops diff --name-only 6a30e2b28a22f93caaef4f3a608446a804bb5236...HEAD | sort > /tmp/changed.txt
          cat >/tmp/allowed.txt <<'EOF'
          assets/css/current/admin-s01-mature-pages-r7.css
          assets/js/admin-s01-mature-shell-r7.js
          includes/admin-v13/views/acceptance_overview.php
          includes/s01/tool-workbench.php
          includes/views/admin-style-helpers/admin-s01-uiux-polish.php
          tests/s01-mature-admin-r7-tools-quality-contract.php
          EOF
          sort -o /tmp/allowed.txt /tmp/allowed.txt
          diff -u /tmp/allowed.txt /tmp/changed.txt
          ! grep -R "update_option(" -n ops/assets/css/current/admin-s01-mature-pages-r7.css ops/assets/js/admin-s01-mature-shell-r7.js
          grep -Fq "vf_m3u8_first_run_initialize((int)get_current_user_id(), 'vf_ops_owner_workbench')" ops/includes/s01/tool-workbench.php
          grep -Fq "FINAL_ONLINE_PASS=" ops/includes/admin-v13/views/acceptance_overview.php
          echo 'S01_R7_CHANGED_FILE_FENCE=PASS'
