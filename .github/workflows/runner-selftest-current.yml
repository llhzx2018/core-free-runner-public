name: Public Runner Current Self Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths: ['.github/workflows/runner-selftest-current.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-runner-current-selftest-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout public runner control repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Hosted runner allocation proof
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "RUNNER_OS=$RUNNER_OS"
          uname -a
          php -v || true
          python3 --version
          echo 'PUBLIC_RUNNER_ALLOCATION=PASS'

      - name: Verify main push came from merged PR
        if: github.event_name == 'push'
        shell: bash
        env:
          VF_PUSH_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          python3 scripts/check_main_push_provenance.py \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$VF_PUSH_SHA"
          echo 'MAIN_PUSH_PROVENANCE=PASS' >> "$GITHUB_ENV"

      - name: Verify Git Estate anti-drift
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: python3 scripts/check_estate_anti_drift.py --live

      - name: Build public-safe receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/runner
          PROVENANCE="${MAIN_PUSH_PROVENANCE:-NOT_APPLICABLE}"
          cat > evidence/runner/PUBLIC_RUNNER_CURRENT.txt <<EOF
          PUBLIC_RUNNER_ALLOCATION=PASS
          ESTATE_ANTI_DRIFT=PASS
          MAIN_PUSH_PROVENANCE=$PROVENANCE
          RUNNER_REPOSITORY=llhzx2018/core-free-runner-public
          PRIVATE_SOURCE_USED=GOV_DOC_AUTHORITY_ONLY
          SECRET_USED=REGISTERED_PRIVATE_READ_CAPABILITY
          PRIVATE_SOURCE_PERSISTED=NO
          MAIN_WRITE=NO
          USER_MANUAL_EXECUTION_REQUIRED=NO
          EOF

      - name: Upload public-safe receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 Node24
        with:
          name: public-runner-current-selftest-${{ github.run_id }}
          path: evidence/runner/PUBLIC_RUNNER_CURRENT.txt
          if-no-files-found: error
          retention-days: 14

  p05-v125-production-closure-writer:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'write/p05-v125-production-closure-20260904'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PRODUCT_BASE: e37db145111366a29fc91c33348216a7af79ae8c
      PRODUCT_BRANCH: docs/p05-v125-production-closure-20260904
    steps:
      - name: Checkout exact Product closure branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.PRODUCT_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 2
          persist-credentials: false
          path: p05

      - name: Verify exact Product boundary
        env:
          VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        working-directory: p05
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_BASE"
          test "$(cat VERSION)" = '1.2.5'
          remote_main="$(git ls-remote "https://x-access-token:${VF_RELEASE_WRITE_TOKEN}@github.com/llhzx2018/vf-seo.git" refs/heads/main | awk '{print $1}')"
          test "$remote_main" = "$PRODUCT_BASE"
          echo P05_V125_CLOSURE_EXACT_BASE=PASS

      - name: Write three Current Truth files
        shell: bash
        working-directory: p05
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          p=Path('VF_PROJECT.json')
          v=json.loads(p.read_text())
          v.update({
            'status':'V1.2.5_RELEASED / PRODUCTION_CLOSED',
            'version':'1.2.5',
            'production_version':'1.2.5',
            'target_version':'1.2.5',
            'working_version':'1.2.5',
            'version_change':False,
            'formal_release':'v1.2.5',
            'formal_release_state':'RELEASED_PRODUCTION_MACHINE_READBACK_PASS',
            'formal_release_candidate_commit':'a6421fe27f8c3bedfdf9a761889af5317e3a8312',
            'formal_release_candidate_tree':'9107865be22bfcd237d13186d735406c0501a7c2',
            'formal_release_asset':'VF_SEO_V1.2.5_FULL.zip',
            'formal_release_asset_files':70,
            'formal_release_asset_bytes':362341,
            'formal_release_asset_sha256':'6dada805391929de872355e9927365496412aaba001a61389f629d33eea3e2f3',
            'runtime_recovery_candidate':'V1.2.5_ATOMIC_PASS_CLOSED',
            'runtime_recovery_release':'RELEASED_V1.2.5',
            'production_source_upload':'DEPLOYMENT_METHOD_NOT_ASSERTED / MACHINE_READBACK_CONFIRMED_V1.2.5',
            'production_runtime_acceptance':'MACHINE_HEALTH_READBACK_V1.2.5_PASS / OWNER_OBSERVED_V1.2.5_UPDATE_UI',
            'production_deployment':'DEPLOYED_V1.2.5_MACHINE_AND_OWNER_VERIFIED',
            'production_main_promotion':'NOT_APPLICABLE_RUNTIME_UPDATE_FROM_RELEASE_ASSETS',
            'working_branch':'main',
            'owner_real_use_review':'V1.2.5_OWNER_OBSERVED_UPDATE_SCREENSHOT / MACHINE_RUNTIME_READBACK_PASS',
            'owner_real_use_pass':'PASS / MACHINE_RUNTIME_READBACK + OWNER_OBSERVED_REFERENCE',
            'candidate_authorization':'CONSUMED_V1.2.5',
            'release_authorization':'CONSUMED_V1.2.5 / RELEASED',
            'production_deployment_authorization':'CONSUMED_V1.2.5 / PRODUCTION_CLOSED',
            'runtime_evidence':'docs/authority/RELEASE_V1.2.5_PRODUCTION_CLOSURE.md',
            'next_action':'V1.2.5_PRODUCTION_CLOSED → L2_PRODUCT_OPTIMIZATION',
            'deployment_readiness':'V1.2.5_PRODUCTION_CLOSED',
            'formal_release_id':382166024,
            'formal_release_asset_id':543015825,
          })
          v.setdefault('authority',{})['release']='docs/authority/RELEASE_V1.2.5_PRODUCTION_CLOSURE.md'
          v['release_publication']={
            'tag':'v1.2.5',
            'release_id':382166024,
            'release_name':'P05 · VF SEO v1.2.5 · Owner Workflow Patch',
            'target_commit':'e37db145111366a29fc91c33348216a7af79ae8c',
            'target_tree':'9107865be22bfcd237d13186d735406c0501a7c2',
            'published_at':'2026-09-03T16:16:47Z',
            'full_asset':'VF_SEO_V1.2.5_FULL.zip',
            'full_asset_id':543015825,
            'full_files':70,
            'full_bytes':362341,
            'full_sha256':'6dada805391929de872355e9927365496412aaba001a61389f629d33eea3e2f3',
            'receipt_asset':'VF_SEO_V1.2.5_RELEASE_RECEIPT.txt',
            'receipt_asset_id':543015827,
            'exact_candidate_source':'a6421fe27f8c3bedfdf9a761889af5317e3a8312',
            'state':'PASS_CLOSED',
            'real_endpoint':'MACHINE_READBACK_V1.2.5',
            'production':'DEPLOYED_MACHINE_AND_OWNER_VERIFIED'
          }
          v['v1_2_5_production_closure']={
            'state':'PASS_CLOSED',
            'release_source':'e37db145111366a29fc91c33348216a7af79ae8c',
            'release_tree':'9107865be22bfcd237d13186d735406c0501a7c2',
            'native_release_ci_run':33770882051,
            'atomic_gate_run':33777964749,
            'atomic_gate_job':100724316608,
            'update_asset_id':543024326,
            'repair_asset_id':543024328,
            'core_updates_main':'a4027aec74986151c8c9daba42febf0e16781986',
            'production_readback_run':33779780645,
            'production_readback_job':100730326851,
            'production_version':'1.2.5',
            'schema':1,
            'database':'READY',
            'process':'READY',
            'runtime':'php',
            'php_version':'8.4.24',
            'root_http':200,
            'legacy_bridge_http':404,
            'owner_observed_update_ui':'CURRENT_1.2.5 / LATEST_1.2.5 / ALREADY_LATEST',
            'demo_data_owner_observed':'PRESENT / NOT_CLEANED_BY_CLOSURE'
          }
          p.write_text(json.dumps(v,ensure_ascii=False,indent=2)+'\n')

          closure=Path('docs/authority/RELEASE_V1.2.5_PRODUCTION_CLOSURE.md')
          closure.write_text('''# P05 · VF SEO v1.2.5 Production Closure\n\nStatus: `RELEASED / PRODUCTION CLOSED`\n\n## Formal release truth\n\n- Release: `v1.2.5`\n- Release ID: `382166024`\n- Release source: `e37db145111366a29fc91c33348216a7af79ae8c`\n- Release tree: `9107865be22bfcd237d13186d735406c0501a7c2`\n- FULL: `VF_SEO_V1.2.5_FULL.zip` · asset `543015825` · 70 files · 362341 bytes\n- FULL SHA-256: `6dada805391929de872355e9927365496412aaba001a61389f629d33eea3e2f3`\n- UPDATE: `VF_SEO_V1.2.5_UPDATE.zip` · asset `543024326`\n- Repair: `repair-v1.2.5.php` · asset `543024328`\n- Schema remains `VF-SEO-SCHEMA@1 / 1`; database format unchanged.\n\n## Release and update evidence\n\n- Final Native release candidate CI: run `33770882051` · PASS.\n- Atomic v1.2.4 → v1.2.5 gate: `33777964749 / 100724316608` · PASS.\n- Atomic gate covered actual upgrade, business-data preservation, idempotence, rollback, interruption recovery, browser single-PHP and reverse-proxy HTTPS same-origin.\n- Update channel authority: `core-updates/main a4027aec74986151c8c9daba42febf0e16781986`.\n\n## Production evidence\n\nOwner-observed Production UI on 2026-09-04 showed `P05 · VF SEO · v1.2.5`; System Update showed `当前版本 v1.2.5`, `最新版本 v1.2.5`, and `已是最新版本`. The same screenshot also showed that the current website portfolio contains Demo data. Closure does not clean or mutate that Owner data state.\n\nGoverned read-only Machine Readback used the allowlisted Public Runner Current Self Test path: run `33779780645`, job `100730326851` · PASS. It read `https://seo.kewaro.com/api/health` as:\n\n- `version = 1.2.5`\n- `schema = 1`\n- `databaseProvider = sqlite`\n- `runtime = php`\n- `phpVersion = 8.4.24`\n- `database = READY`\n- `process = READY`\n- public root HTTP `200`\n- retired v1.2.2 update bridge HTTP `404`\n- Product source / Release / Production write from the readback gate = `0`\n\nRunner PR #659 was closed without merge after Current Self Test, Trigger Scope and Workflow Archive all passed.\n\n## Closure decision\n\n`P05 v1.2.5 Production = CLOSED`. The release authorization and Production deployment authorization are consumed. No further release work is pending. The next normal state is `L2 Product Optimization`; any future release requires a new explicit authorization.\n''')

          cs=Path('docs/handoff/CURRENT_STATE.md')
          old=cs.read_text()
          if old.startswith('# P05 · VF SEO · Current State\n'):
              old=old.split('\n',1)[1].lstrip('\n')
          head='''# P05 · VF SEO · Current State\n\n```text\nCurrent Formal Release: v1.2.5 · RELEASED / PRODUCTION CLOSED\nRelease / Tag Source: e37db145111366a29fc91c33348216a7af79ae8c\nRelease Tree: 9107865be22bfcd237d13186d735406c0501a7c2\nFormal FULL: VF_SEO_V1.2.5_FULL.zip · Asset 543015825 · 362341 bytes · SHA-256 6dada805391929de872355e9927365496412aaba001a61389f629d33eea3e2f3\nProduction: v1.2.5 · MACHINE + OWNER VERIFIED\nProduction Machine Readback: 33779780645 / 100730326851 · PASS\nProduction Runtime: PHP 8.4.24 · SQLite · Schema 1 · DATABASE READY · PROCESS READY\nProduction Root / Legacy Bridge: HTTP 200 / 404 · PASS\nAtomic Upgrade Gate: 33777964749 / 100724316608 · PASS\nUpdate Channel: core-updates/main a4027aec74986151c8c9daba42febf0e16781986\nSchema: VF-SEO-SCHEMA@1 / 1\nRelease Authorization: CONSUMED\nProduction Authorization: CONSUMED\nNext Action: V1.2.5_PRODUCTION_CLOSED → L2 Product Optimization\n```\n\n## v1.2.5 Production Closure\n\nCurrent release and Production authority is `docs/authority/RELEASE_V1.2.5_PRODUCTION_CLOSURE.md`. Owner UI and governed machine readback agree on v1.2.5. The Owner-observed Demo data state is preserved and was not cleaned by the closure process.\n\n## Historical state below\n\n'''
          cs.write_text(head+old)
          PY

          git add VF_PROJECT.json docs/authority/RELEASE_V1.2.5_PRODUCTION_CLOSURE.md docs/handoff/CURRENT_STATE.md
          expected=$'VF_PROJECT.json\ndocs/authority/RELEASE_V1.2.5_PRODUCTION_CLOSURE.md\ndocs/handoff/CURRENT_STATE.md'
          actual="$(git diff --cached --name-only)"
          test "$actual" = "$expected"
          test "$(cat VERSION)" = '1.2.5'
          git diff --cached --check
          echo P05_V125_CLOSURE_SCOPE=PASS

      - name: Commit and push Product closure branch
        env:
          VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        working-directory: p05
        run: |
          set -Eeuo pipefail
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git commit -m 'docs(P05): close v1.2.5 Production truth'
          git push "https://x-access-token:${VF_RELEASE_WRITE_TOKEN}@github.com/llhzx2018/vf-seo.git" "HEAD:refs/heads/$PRODUCT_BRANCH"
          echo P05_PRODUCT_RUNTIME_WRITE=0
          echo P05_RELEASE_WRITE=0
          echo P05_PRODUCTION_WRITE=0
