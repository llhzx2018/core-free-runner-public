name: S01 Mature Admin V6 R3 1.21.869 Final Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-selftest-current.yml'

permissions:
  contents: read

jobs:
  final-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPS_REPO: llhzx2018/vf-tools-ops
      OPS_SHA: c25307e731ffc53c664b1444e6a36bb0d21cd811
      BASE_SHA: 96fbc3d53fdf64d895389e8a09e668f76db504ce
      VERSION: 1.21.869
    steps:
      - name: Checkout exact Ops V6 R3 final candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          repository: llhzx2018/vf-tools-ops
          ref: c25307e731ffc53c664b1444e6a36bb0d21cd811
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: ops
          persist-credentials: false

      - name: Exact seven-file release fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$OPS_SHA"
          mapfile -t files < <(git -C ops diff --name-only "$BASE_SHA" "$OPS_SHA" | sort)
          test "${#files[@]}" = '7'
          expected=(
            'VERSION'
            'assets/css/current/admin-s01-v6-quality-r3.css'
            'assets/js/admin-acceptance-overview.js'
            'includes/admin-v13/views/acceptance_overview.php'
            'includes/views/admin-style-helpers/admin-s01-uiux-polish.php'
            'tests/s01-v6-r3-quality-overview-contract.php'
            'vf-ops.php'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "$(printf '%s\n' "${files[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"
          echo 'S01_V6_R3_121869_SCOPE=PASS'

      - name: Release identity semantic fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(cat ops/VERSION)" = '1.21.869'
          grep -Fq 'Version: 1.21.869' ops/vf-ops.php
          grep -Fq "VF_OPS_VERSION', '1.21.869'" ops/vf-ops.php
          grep -Fq "VF_OPS_ROUND', 'S01-MATURE-ADMIN-V6-R3-QUALITY-OVERVIEW'" ops/vf-ops.php
          git -C ops show "$BASE_SHA:vf-ops.php" > /tmp/base-vf-ops.php
          cp ops/vf-ops.php /tmp/head-vf-ops.php
          python3 - <<'PY'
          from pathlib import Path
          base=Path('/tmp/base-vf-ops.php').read_text()
          head=Path('/tmp/head-vf-ops.php').read_text()
          normalized=(head
            .replace('1.21.869','1.21.868')
            .replace('S01-MATURE-ADMIN-V6-R3-QUALITY-OVERVIEW','S01-MATURE-ADMIN-V6-R2-TOOLS-WORKBENCH'))
          if normalized != base:
              raise SystemExit('vf-ops.php contains changes beyond version/round identity')
          print('VF_OPS_IDENTITY_ONLY=PASS')
          PY
          echo 'S01_V6_R3_121869_IDENTITY=PASS'

      - name: PHP JS syntax and final V6 R3 contract
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l ops/vf-ops.php
          php -l ops/includes/admin-v13/views/acceptance_overview.php
          php -l ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php
          php -l ops/tests/s01-v6-r3-quality-overview-contract.php
          node --check ops/assets/js/admin-acceptance-overview.js
          php ops/tests/s01-v6-r3-quality-overview-contract.php
          echo 'S01_V6_R3_121869_CONTRACT=PASS'

      - name: Quality migration ownership fence
        shell: bash
        run: |
          set -Eeuo pipefail
          view='ops/includes/admin-v13/views/acceptance_overview.php'
          grep -Fq 'vf-v6-quality-page' "$view"
          grep -Fq 'vf-v6-quality-stage-rail' "$view"
          grep -Fq "'FINAL_ONLINE_PASS='." "$view"
          ! grep -Fq 'vf-r7-' "$view"
          ! grep -Fq 'vf-accept-product' "$view"
          js='ops/assets/js/admin-acceptance-overview.js'
          ! grep -Fq 'simplifyOverviewNavigation' "$js"
          ! grep -Fq '.remove()' "$js"
          loader='ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php'
          grep -Fq 'admin-s01-v6-quality-r3.css' "$loader"
          grep -Fq 'if (!$isQualityOverview)' "$loader"
          echo 'S01_V6_R3_121869_OWNERSHIP=PASS'

      - name: Unrelated behavior source unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          paths=(
            includes/s01/tool-workbench.php
            includes/s01/admin-shell-domain-contract.php
            includes/wp-update/bootstrap.php
            includes/admin-v13/route-contract.php
            includes/admin-v13/services/acceptance_overview.php
          )
          for path in "${paths[@]}"; do
            test "$(git -C ops rev-parse "$BASE_SHA:$path")" = "$(git -C ops rev-parse "$OPS_SHA:$path")"
          done
          test -z "$(git -C ops diff --name-only "$BASE_SHA" "$OPS_SHA" -- 'includes/acceptance/**' 'includes/release-acceptance-contract-service.php')"
          echo 'S01_V6_R3_121869_UNRELATED=PASS'

      - name: Secret fence
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t files < <(git -C ops diff --name-only "$BASE_SHA" "$OPS_SHA")
          args=(); for f in "${files[@]}"; do args+=("ops/$f"); done
          ! grep -EIn '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,})' "${args[@]}"
          echo 'S01_V6_R3_121869_SECRET_FENCE=PASS'
