name: S01 Mature Admin V6 R1 Shell Foundation Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-selftest-current.yml'

permissions:
  contents: read

concurrency:
  group: s01-v6-r1-shell-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact Ops V6 R1 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 3a6e95a6f3b12943ae7bff4bea8b2816f81d6e6c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: ops
          persist-credentials: false

      - name: Exact four-file R1 fence
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='6dff951061496e31db416b40fbf04033c6e30709'
          HEAD='3a6e95a6f3b12943ae7bff4bea8b2816f81d6e6c'
          test "$(git -C ops rev-parse HEAD)" = "$HEAD"
          cat > /tmp/expected <<'EOF'
          assets/css/current/admin-s01-v6-shell-r1.css
          includes/views/admin-shell-tabs-parts/02-shell-navigation.php
          includes/views/admin-style-helpers/admin-s01-uiux-polish.php
          tests/s01-v6-r1-shell-foundation-contract.php
          EOF
          git -C ops diff --name-only "$BASE"...HEAD | sort > /tmp/actual
          diff -u <(sort /tmp/expected) /tmp/actual
          test "$(cat ops/VERSION)" = '1.21.866'
          echo 'S01_V6_R1_EXACT_SCOPE=PASS'

      - name: PHP syntax and V6 R1 contract
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l ops/includes/views/admin-shell-tabs-parts/02-shell-navigation.php
          php -l ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php
          php -l ops/tests/s01-v6-r1-shell-foundation-contract.php
          php ops/tests/s01-v6-r1-shell-foundation-contract.php
          echo 'S01_V6_R1_PHP_CONTRACT=PASS'

      - name: Server-rendered shell fence
        shell: bash
        run: |
          set -Eeuo pipefail
          shell='ops/includes/views/admin-shell-tabs-parts/02-shell-navigation.php'
          loader='ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php'
          grep -Fq 'vf-ops-v6-shell' "$shell"
          grep -Fq 'vf-v6-shell-header' "$shell"
          grep -Fq 'vf-v6-domain-nav' "$shell"
          grep -Fq 'vf_ops_s01_admin_domain_contract_v1' "$shell"
          grep -Fq "routeKey !== 'acceptance_overview'" "$shell"
          ! grep -Fq 'admin-s01-product-shell-r3.css' "$loader"
          ! grep -Fq 'admin-s01-top-domains-v3.css' "$loader"
          ! grep -Fq 'admin-s01-mature-shell-r7.js' "$loader"
          grep -Fq 'if ($isToolWorkbench)' "$loader"
          echo 'S01_V6_R1_SERVER_SHELL=PASS'

      - name: Design-owner and responsive fence
        shell: bash
        run: |
          set -Eeuo pipefail
          css='ops/assets/css/current/admin-s01-v6-shell-r1.css'
          grep -Fq 'body.vf-ops-v6-admin' "$css"
          grep -Fq '@media (max-width: 1280px)' "$css"
          grep -Fq '@media (max-width: 960px)' "$css"
          grep -Fq '@media (max-width: 782px)' "$css"
          grep -Fq '@media (max-width: 480px)' "$css"
          ! grep -q ':root' "$css"
          ! grep -q '\.vf-m3u8-' "$css"
          echo 'S01_V6_R1_DESIGN_OWNER=PASS'

      - name: Unrelated behavior source unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='6dff951061496e31db416b40fbf04033c6e30709'
          git -C ops diff --exit-code "$BASE"...HEAD -- \
            includes/views/admin-operations-console-pages.php \
            includes/views/admin-online-acceptance.php \
            includes/views/admin-ai-report-shell.php \
            includes/admin-v13/views/dashboard.php \
            includes/wp-update/class-vf-ops-update-source-v1.php \
            includes/wp-update/bootstrap.php \
            includes/wp-update/class-vf-ops-update-admin-v1.php
          grep -Fq 'vf_ops_wp_update_force_refresh_v1' ops/includes/wp-update/bootstrap.php
          grep -Fq "delete_site_transient('update_plugins');" ops/includes/wp-update/bootstrap.php
          grep -Fq 'wp_update_plugins();' ops/includes/wp-update/bootstrap.php
          grep -Fq "'S01-C02'" ops/includes/wp-update/class-vf-ops-update-admin-v1.php
          grep -Fq 'vf_ops_v11_human_status_label_v121853' ops/includes/views/admin-operations-console-pages.php
          grep -Fq '线上终验待处理事项' ops/includes/views/admin-online-acceptance.php
          grep -Fq '源站发布前检查' ops/includes/views/admin-ai-report-shell.php
          echo 'S01_V6_R1_UNRELATED_BEHAVIOR=PASS'

      - name: Secret fence
        shell: bash
        run: |
          set -Eeuo pipefail
          ! git -C ops diff '6dff951061496e31db416b40fbf04033c6e30709'...HEAD | grep -E 'ghp_[A-Za-z0-9]|github_pat_|BEGIN (RSA |OPENSSH )?PRIVATE KEY'
          echo 'S01_V6_R1_SECRET_FENCE=PASS'
          echo 'S01_MATURE_ADMIN_V6_R1_SHELL_FOUNDATION=PASS'
