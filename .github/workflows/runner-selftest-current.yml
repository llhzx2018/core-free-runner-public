name: Public Runner Current Self Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-selftest-current.yml'
      - 'scripts/check_main_push_provenance.py'
      - 'tests/test_main_push_provenance.py'
      - 'scripts/ephemeral_lane_spec.py'
      - 'tests/test_ephemeral_lane_spec.py'
      - 'scripts/ephemeral_lane_worktree.py'
      - 'tests/test_ephemeral_lane_worktree.py'
      - 'scripts/shared_test_router.py'
      - 'tests/test_shared_test_router.py'
      - 'scripts/shared_test_queue.py'
      - 'tests/test_shared_test_queue.py'
      - 'scripts/shared_test_actions_bridge.py'
      - 'tests/test_shared_test_actions_bridge.py'
      - '.github/workflows/shared-test-on-demand.yml'
      - 'docs/authority/SHARED_TEST_PROTOCOL_V1.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-runner-current-selftest
  cancel-in-progress: false

jobs:
  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout public runner control repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Hosted runner allocation proof
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "RUNNER_OS=$RUNNER_OS"
          uname -a
          php -v || true
          python3 --version
          echo 'PUBLIC_RUNNER_ALLOCATION=PASS'

      - name: Verify main push came from merged PR
        if: github.event_name == 'push'
        shell: bash
        env:
          VF_PUSH_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          python3 scripts/check_main_push_provenance.py \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$VF_PUSH_SHA"
          echo 'MAIN_PUSH_PROVENANCE=PASS' >> "$GITHUB_ENV"

      - name: Verify current provenance and shared helper regressions
        shell: bash
        run: |
          python3 -m unittest tests.test_main_push_provenance -v
          python3 -m unittest tests.test_ephemeral_lane_spec -v
          python3 -m unittest tests.test_ephemeral_lane_worktree -v

      - name: Verify shared multi-project admission policy
        shell: bash
        run: python3 -m unittest discover -s tests -p test_shared_test_router.py -v

      - name: Verify durable queue cancellation and real subprocess concurrency
        shell: bash
        run: python3 -m unittest discover -s tests -p test_shared_test_queue.py -v

      # Stage-C PR-only transient private checkout; not a permanent main job.
      - name: Checkout pinned Private candidate for isolated safety tests
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/shared-test-v1-public-20261124'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/core-free-runner-private
          ref: 625990fc53c66a2f640d7230b05522fdad07e442
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: vf-private-exact
      - name: Execute pinned Private Linux locks and negative tests
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/shared-test-v1-public-20261124'
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C vf-private-exact rev-parse HEAD)" = 625990fc53c66a2f640d7230b05522fdad07e442
          if python3 -m unittest discover -s vf-private-exact/tests -p test_shared_test_private.py -q > "$RUNNER_TEMP/vf-private-test.log" 2>&1; then
            echo 'PRIVATE_EXACT_SOURCE_LINUX_TEST=PASS'
          else
            echo 'PRIVATE_EXACT_SOURCE_LINUX_TEST=FAIL'
            exit 1
          fi
      - name: Verify Public to Private v1 schema compatibility
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/shared-test-v1-public-20261124'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/vf-interop-test.log" 2>&1
          import importlib.util, pathlib
          import sys
          sys.path.insert(0,str(pathlib.Path('scripts').resolve()))
          import shared_test_router as pub
          spec=importlib.util.spec_from_file_location('private_test','vf-private-exact/scripts/shared_test_private.py')
          priv=importlib.util.module_from_spec(spec);spec.loader.exec_module(priv)
          job={'schema':'vf-shared-test-job/v1','task_id':'task-interop-0001','project':'P08',
               'source':{'repo':'llhzx2018/vf-adops','sha':'a'*40,'tree_sha':None},
               'test_id':'quick','kind':'unit','privacy':'PRIVATE_EVIDENCE','profile':'normal',
               'timeout_seconds':90,'submitted_at':1,'allow_public_ephemeral':False}
          catalog={'schema':'vf-shared-test-commands/v1',
                   'projects':{'P08':{'repo':'llhzx2018/vf-adops','directory':'P08',
                   'commands':{'quick':['/bin/true']}}}}
          assert pub.route(job)=='PRIVATE'
          assert priv.validate(job,catalog)==('P08',['/bin/true'])
          PY
          echo 'PUBLIC_PRIVATE_PROTOCOL_COMPAT=PASS'
      - name: Remove all transient Private checkout and test logs
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- vf-private-exact "$RUNNER_TEMP/vf-private-test.log" "$RUNNER_TEMP/vf-interop-test.log"
          test ! -e vf-private-exact
          echo 'PRIVATE_TEMPORARY_CLEANUP=PASS'

      - name: Verify official Actions adapter owner/cancel/Run-correlation safety
        shell: bash
        run: python3 -m unittest discover -s tests -p test_shared_test_actions_bridge.py -v

      # PR-only review of P02 installer source; no VM, secrets or activation.
      - name: Checkout P02 controller installer exact reviewed draft (read-only)
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/shared-test-v1-public-20261124'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-doc
          ref: fedb7bc69246a6ab59ce6969fa75e5fa65145c47
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: vf-p02-pr2-ref
      - name: Parse existing P02 Windows and Ubuntu installers without executing them
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/shared-test-v1-public-20261124'
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C vf-p02-pr2-ref rev-parse HEAD)" = fedb7bc69246a6ab59ce6969fa75e5fa65145c47
          bash -n vf-p02-pr2-ref/ops/p02-hyperv-ubuntu-install.sh
          grep -q PR2_NOT_PROMOTED_TO_MAIN vf-p02-pr2-ref/ops/p02-hyperv-windows-install.ps1
          grep -q GATE_NOT_NO_AFTER_INSTALL vf-p02-pr2-ref/ops/p02-hyperv-windows-install.ps1
          command -v pwsh >/dev/null || { echo 'BLOCKED_POWERSHELL_HOSTED_MISSING'; exit 2; }
          if pwsh -NoProfile -NonInteractive -Command '$tokens=$null; $issues=$null; [System.Management.Automation.Language.Parser]::ParseFile("vf-p02-pr2-ref/ops/p02-hyperv-windows-install.ps1",[ref]$tokens,[ref]$issues) | Out-Null; if ($issues.Count -gt 0) {exit 2}' > "$RUNNER_TEMP/vf-p02-ps-parse.log" 2>&1; then
            echo 'P02_REVIEWED_INSTALLER_PWSH_PARSE=PASS'
          else
            echo 'P02_REVIEWED_INSTALLER_PWSH_PARSE=FAIL'
            exit 2
          fi
          echo 'P02_UBUNTU_BASH_PARSE=PASS'
          echo 'P02_PR2_MAIN_PROMOTION_REQUIRED=YES'
      - name: Cleanup transient P02 installer checkout and parse log
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- vf-p02-pr2-ref "$RUNNER_TEMP/vf-p02-ps-parse.log"
          test ! -e vf-p02-pr2-ref
          echo 'P02_INSTALLER_TRANSIENT_CLEANUP=PASS'

      - name: Build public-safe receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/runner
          PROVENANCE="${MAIN_PUSH_PROVENANCE:-NOT_APPLICABLE}"
          cat > evidence/runner/PUBLIC_RUNNER_CURRENT.txt <<EOF
          PUBLIC_RUNNER_ALLOCATION=PASS
          MAIN_PUSH_PROVENANCE=$PROVENANCE
          MAIN_PUSH_PROVENANCE_TESTS=PASS
          EPHEMERAL_LANE_HELPER=PASS
          EPHEMERAL_WORKTREE_HELPER=PASS
          RUNNER_REPOSITORY=llhzx2018/core-free-runner-public
          PRIVATE_SOURCE_USED=NO
          SECRET_USED=NO
          PRIVATE_SOURCE_PERSISTED=NO
          MAIN_WRITE=NO
          USER_MANUAL_EXECUTION_REQUIRED=NO
          EOF

      - name: Upload public-safe receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 Node24
        with:
          name: public-runner-current-selftest-${{ github.run_id }}
          path: evidence/runner/PUBLIC_RUNNER_CURRENT.txt
          if-no-files-found: error
          retention-days: 14
