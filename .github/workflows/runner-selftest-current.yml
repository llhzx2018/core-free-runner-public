name: S01 Mature Admin R8 Visual Fidelity Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-selftest-current.yml'

permissions:
  contents: read

jobs:
  candidate-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact Ops R8 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ff8fc466a7665680b1f38c2f3f0507252f6c3966
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: ops
          persist-credentials: false

      - name: Exact source and changed-file fence
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='277aac4ff4eec0d5fb474568bbb9ea2039aad708'
          HEAD='ff8fc466a7665680b1f38c2f3f0507252f6c3966'
          test "$(git -C ops rev-parse HEAD)" = "$HEAD"
          test "$(cat ops/VERSION)" = '1.21.864'
          cat >/tmp/expected <<'EOF'
          assets/css/current/admin-s01-mature-pages-r8.css
          assets/css/current/admin-s01-product-shell-r3.css
          includes/views/admin-style-helpers/admin-s01-uiux-polish.php
          tests/s01-mature-admin-r8-visual-fidelity-contract.php
          EOF
          git -C ops diff --name-only "$BASE"...HEAD | sort > /tmp/actual
          sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual
          echo 'S01_R8_EXACT_SCOPE=PASS'

      - name: PHP and R8 contract checks
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php
          php -l ops/tests/s01-mature-admin-r8-visual-fidelity-contract.php
          php ops/tests/s01-mature-admin-r8-visual-fidelity-contract.php
          echo 'S01_R8_CONTRACT=PASS'

      - name: Shell and page ownership fence
        shell: bash
        run: |
          set -Eeuo pipefail
          loader='ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php'
          shell='ops/assets/css/current/admin-s01-product-shell-r3.css'
          pages='ops/assets/css/current/admin-s01-mature-pages-r8.css'
          grep -Fq 'admin-s01-product-shell-r3.css' "$loader"
          grep -Fq 'admin-s01-mature-pages-r8.css' "$loader"
          ! grep -Fq 'admin-s01-product-shell-r2.css' "$loader"
          ! grep -Fq 'admin-s01-mature-pages-r7.css' "$loader"
          ! grep -Fq 'admin-s01-preview-samples-r5.css' "$loader"
          ! grep -q ':root' "$shell"
          ! grep -q ':root' "$pages"
          ! grep -q '\.vf-m3u8-' "$shell"
          ! grep -q '\.vf-m3u8-' "$pages"
          ! grep -q 'update_option(' "$shell"
          ! grep -q 'update_option(' "$pages"
          echo 'S01_R8_OWNER_FENCE=PASS'

      - name: Existing real page structure continuity
        shell: bash
        run: |
          set -Eeuo pipefail
          php ops/tests/top-domains-visible-ui-contract.php
          grep -Fq 'data-vf-r7-tools' ops/includes/s01/tool-workbench.php
          grep -Fq 'vf-r7-action-grid' ops/includes/s01/tool-workbench.php
          grep -Fq 'vf-r7-snapshot' ops/includes/s01/tool-workbench.php
          grep -Fq 'data-vf-r7-quality-overview' ops/includes/admin-v13/views/acceptance_overview.php
          grep -Fq 'vf-r7-stage-grid' ops/includes/admin-v13/views/acceptance_overview.php
          grep -Fq "vf_m3u8_first_run_initialize((int)get_current_user_id(), 'vf_ops_owner_workbench')" ops/includes/s01/tool-workbench.php
          grep -Fq 'FINAL_ONLINE_PASS=' ops/includes/admin-v13/views/acceptance_overview.php
          echo 'S01_R8_STRUCTURE_CONTINUITY=PASS'

      - name: Secret fence
        shell: bash
        run: |
          set -Eeuo pipefail
          ! git -C ops diff '277aac4ff4eec0d5fb474568bbb9ea2039aad708'...HEAD | grep -E 'ghp_[A-Za-z0-9]|github_pat_|BEGIN (RSA |OPENSSH )?PRIVATE KEY'
          echo 'S01_R8_SECRET_FENCE=PASS'
          echo 'S01_R8_VISUAL_FIDELITY_GATE=PASS'
