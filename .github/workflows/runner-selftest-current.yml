name: S01 Mature Admin V6 R2 1.21.868 Final Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-selftest-current.yml'

permissions:
  contents: read

concurrency:
  group: s01-v6-r2-final-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  final-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact Ops V6 R2 final candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          repository: llhzx2018/vf-tools-ops
          ref: fd2b10ef7a19488dec5587f65b169de549bf487f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: ops
          persist-credentials: false

      - name: Exact six-file release fence
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='04ce86a5e371074c1b6e13e7ee648736861f6abd'
          HEAD='fd2b10ef7a19488dec5587f65b169de549bf487f'
          test "$(git -C ops rev-parse HEAD)" = "$HEAD"
          cat > /tmp/expected <<'EOF'
          VERSION
          assets/css/current/admin-s01-v6-tools-r2.css
          includes/s01/tool-workbench.php
          includes/views/admin-style-helpers/admin-s01-uiux-polish.php
          tests/s01-v6-r2-tools-workbench-contract.php
          vf-ops.php
          EOF
          git -C ops diff --name-only "$BASE"...HEAD | sort > /tmp/actual
          diff -u <(sort /tmp/expected) /tmp/actual
          test "$(cat ops/VERSION)" = '1.21.868'
          echo 'S01_V6_R2_FINAL_SCOPE=PASS'

      - name: Release identity semantic fence
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'Version: 1.21.868' ops/vf-ops.php
          grep -Fq "VF_OPS_VERSION', '1.21.868'" ops/vf-ops.php
          grep -Fq "VF_OPS_ROUND', 'S01-MATURE-ADMIN-V6-R2-TOOLS-WORKBENCH'" ops/vf-ops.php
          changed=$(git -C ops diff '04ce86a5e371074c1b6e13e7ee648736861f6abd'...HEAD -- vf-ops.php | grep -E '^[+-]' | grep -Ev '^(---|\+\+\+)' | wc -l)
          test "$changed" -eq 6
          echo 'S01_V6_R2_RELEASE_IDENTITY=PASS'

      - name: PHP syntax and final V6 R2 contract
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l ops/vf-ops.php
          php -l ops/includes/s01/tool-workbench.php
          php -l ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php
          php -l ops/tests/s01-v6-r2-tools-workbench-contract.php
          php ops/tests/s01-v6-r2-tools-workbench-contract.php
          echo 'S01_V6_R2_FINAL_CONTRACT=PASS'

      - name: Tools migration ownership fence
        shell: bash
        run: |
          set -Eeuo pipefail
          file='ops/includes/s01/tool-workbench.php'
          loader='ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php'
          css='ops/assets/css/current/admin-s01-v6-tools-r2.css'
          grep -Fq 'vf-v6-tools-primary-task' "$file"
          grep -Fq 'vf_ops_s01_admin_domain_contract_v1' "$file"
          grep -Fq 'vf_ops_s01_tool_workbench_daily_blockers_v2' "$file"
          grep -Fq 'Provider 原始记录' "$file"
          grep -Fq 'vf_m3u8_first_run_initialize' "$file"
          ! grep -Fq 'vf-r7-' "$file"
          ! grep -Fq 'admin-s01-domain-shell-r1.js' "$loader"
          ! grep -Fq 'wp_enqueue_script' "$loader"
          grep -Fq 'admin-s01-v6-tools-r2.css' "$loader"
          ! grep -q ':root' "$css"
          ! grep -q '\.vf-m3u8-' "$css"
          echo 'S01_V6_R2_MIGRATION_OWNERSHIP=PASS'

      - name: Unrelated behavior source unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='04ce86a5e371074c1b6e13e7ee648736861f6abd'
          git -C ops diff --quiet "$BASE"...HEAD -- \
            includes/site-release \
            includes/acceptance \
            includes/wp-update \
            includes/publish-workflow \
            includes/admin-v13/views/publish_zip.php \
            includes/admin-v13/views/acceptance_overview.php
          echo 'S01_V6_R2_UNRELATED_SOURCE=PASS'

      - name: Secret fence
        shell: bash
        run: |
          set -Eeuo pipefail
          ! git -C ops diff '04ce86a5e371074c1b6e13e7ee648736861f6abd'...HEAD | grep -E 'ghp_[A-Za-z0-9]|github_pat_|BEGIN (RSA |OPENSSH )?PRIVATE KEY'
          echo 'S01_V6_R2_SECRET_FENCE=PASS'
          echo 'S01_MATURE_ADMIN_V6_R2_121868_FINAL=PASS'
