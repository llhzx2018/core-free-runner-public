name: Public Runner Current Self Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths: ['.github/workflows/runner-selftest-current.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-runner-current-selftest-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout public runner control repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Hosted runner allocation proof
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "RUNNER_OS=$RUNNER_OS"
          uname -a
          python3 --version
          echo 'PUBLIC_RUNNER_ALLOCATION=PASS'
      - name: Verify main push came from merged PR
        if: github.event_name == 'push'
        shell: bash
        env:
          VF_PUSH_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          python3 scripts/check_main_push_provenance.py --repository "$GITHUB_REPOSITORY" --sha "$VF_PUSH_SHA"
          echo 'MAIN_PUSH_PROVENANCE=PASS' >> "$GITHUB_ENV"
      - name: Verify Git Estate anti-drift
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: python3 scripts/check_estate_anti_drift.py --live
      - name: Build public-safe receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/runner
          printf '%s\n' 'PUBLIC_RUNNER_ALLOCATION=PASS' 'ESTATE_ANTI_DRIFT=PASS' 'MAIN_WRITE=NO' > evidence/runner/PUBLIC_RUNNER_CURRENT.txt
      - name: Upload public-safe receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-runner-current-selftest-${{ github.run_id }}
          path: evidence/runner/PUBLIC_RUNNER_CURRENT.txt
          if-no-files-found: error
          retention-days: 14

  p05-mobile-portfolio-action-first-browser:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'test/p05-mobile-portfolio-action-first-browser-20260903'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vf_seo
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vf_seo
      VF_MASTER_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NODE_ENV: test
      P05_BASE_SHA: 830f442622719ed170d6a112d2ff38a9ac03b670
      P05_EXACT_SHA: 7a4baa512db32aad4f671cb1e913a343bdbcc72f
      P05_EXACT_TREE: dba1a7f161aa7e9ed43a1b4181773a92ee0e3d53
    steps:
      - name: Checkout exact P05 action-first candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.P05_EXACT_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 5

      - name: Verify exact candidate and scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_EXACT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$P05_EXACT_TREE"
          test "$(cat VERSION)" = '1.2.4'
          git cat-file -e "$P05_BASE_SHA^{commit}"
          git diff --check "$P05_BASE_SHA" HEAD
          mapfile -t changed < <(git diff --name-only "$P05_BASE_SHA" HEAD | sort)
          expected=('src/client/ProductApp.tsx' 'src/client/product-app.css' 'tests/unit/product-portfolio-top-opportunity-routing-truth.test.ts')
          test "${#changed[@]}" -eq 3
          for i in 0 1 2; do test "${changed[$i]}" = "${expected[$i]}"; done
          grep -Fq 'grid-template-areas:"main facts action"' src/client/product-app.css
          grep -Fq 'grid-template-areas:"main" "action" "facts"' src/client/product-app.css
          echo P05_MOBILE_ACTION_FIRST_EXACT_SOURCE=PASS

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm

      - name: Build exact candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          npm run typecheck
          npm run build
          npm run migrate
          VF_ADMIN_USERNAME=owner VF_ADMIN_PASSWORD='MobileActionFirst-2026!' npm run bootstrap:admin

      - name: Real Chrome desktop/mobile hierarchy journey
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p05-mobile-action-first
          PORT=18228 VF_SECURE_COOKIES=false VF_REQUIRE_HTTPS=false node dist/src/server/index.js >/tmp/p05-mobile-action-first/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import base64,json,pathlib,shutil,subprocess,sys,time,urllib.error,urllib.request
          BASE='http://127.0.0.1:18228'; DP=9544; PASSWORD='MobileActionFirst-2026!'; OUT=pathlib.Path('/tmp/p05-mobile-action-first')
          def fail(msg): print('P05_MOBILE_ACTION_FIRST_BROWSER=FAIL '+msg,file=sys.stderr); raise SystemExit(1)
          def http(method,url,payload=None,timeout=30):
              data=None if payload is None else json.dumps(payload).encode(); req=urllib.request.Request(url,data=data,method=method)
              if data is not None:req.add_header('Content-Type','application/json')
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      raw=r.read().decode(); return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e: fail(f'http {e.code} {url}: {e.read().decode(errors="replace")[:400]}')
          def wait_http(url):
              for _ in range(300):
                  try:
                      with urllib.request.urlopen(url,timeout=1) as r:
                          if r.status<500:return
                  except Exception:time.sleep(.1)
              fail('not ready '+url)
          def wd(method,path,payload=None):
              result=http(method,f'http://127.0.0.1:{DP}{path}',payload); value=result.get('value')
              if isinstance(value,dict) and value.get('error'):fail(f"webdriver {value.get('error')}: {value.get('message')}")
              return result
          driver=shutil.which('chromedriver'); chrome=shutil.which('google-chrome') or shutil.which('google-chrome-stable')
          if not driver or not chrome:fail('Chrome unavailable')
          proc=subprocess.Popen([driver,f'--port={DP}','--allowed-ips=127.0.0.1'],stdout=subprocess.DEVNULL,stderr=subprocess.STDOUT); session=''
          try:
              wait_http(BASE+'/api/health'); wait_http(f'http://127.0.0.1:{DP}/status')
              r=wd('POST','/session',{'capabilities':{'alwaysMatch':{'browserName':'chrome','goog:chromeOptions':{'binary':chrome,'args':['--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--window-size=1440,1000']}}}})
              session=str(r['value'].get('sessionId') or r.get('sessionId') or '')
              if not session:fail('missing session')
              def sv(method,path,payload=None):return wd(method,f'/session/{session}{path}',payload)['value']
              def js(code):return sv('POST','/execute/sync',{'script':code,'args':[]})
              def jsa(code):return sv('POST','/execute/async',{'script':code,'args':[]})
              def wait(fn,label):
                  last=None
                  for _ in range(400):
                      try:
                          last=fn()
                          if last:return last
                      except Exception as e:last=repr(e)
                      time.sleep(.1)
                  fail(f'timeout {label}: {last!r}')
              def find(css):return sv('POST','/element',{'using':'css selector','value':css})['element-6066-11e4-a52e-4f735466cecf']
              def send(e,v):sv('POST',f'/element/{e}/clear',{});sv('POST',f'/element/{e}/value',{'text':v,'value':list(v)})
              def click(label):return bool(js('''const x=%s;const b=[...document.querySelectorAll('button')].find(e=>e.textContent.trim()===x);if(!b||b.disabled)return false;b.click();return true;'''%json.dumps(label,ensure_ascii=False)))
              def content():return str(js("return document.querySelector('.p05v2-content')?.innerText || ''"))
              def shot(name):(OUT/name).write_bytes(base64.b64decode(sv('GET','/screenshot')))
              def api_sites():return jsa("""const done=arguments[0];fetch('/api/product/sites').then(async r=>({ok:r.ok,data:await r.json()})).then(done).catch(e=>done({ok:false,error:String(e)}));""")
              def expected(item):
                  code=str((item.get('status') or {}).get('code') or '').upper(); opp=item.get('topOpportunity') or {}; st=str(opp.get('subjectType') or '').upper(); sid=opp.get('subjectId'); sid=sid.strip() if isinstance(sid,str) else ''
                  if code=='DATA_PROBLEM':return '处理数据异常 →'
                  if code=='NEEDS_ATTENTION':return '处理技术问题 →'
                  if code=='OPPORTUNITY' and sid and st=='QUERY':return '打开精确关键词证据 →'
                  if code=='OPPORTUNITY' and sid and st=='PAGE':return '打开精确页面证据 →'
                  return '进入网站 →'
              def rows():return js("""
                return [...document.querySelectorAll('.p05v2-site-row')].map(row=>{
                  const main=row.querySelector('.p05v2-site-main'), facts=row.querySelector('.p05v2-site-facts'), action=row.querySelector('.p05v2-site-action');
                  const primary=[...action.querySelectorAll('button.primary')];
                  const mr=main.getBoundingClientRect(), fr=facts.getBoundingClientRect(), ar=action.getBoundingClientRect();
                  return {name:main.querySelector('strong')?.textContent?.trim()||'',primaryCount:primary.length,primary:primary[0]?.textContent?.trim()||'',main:{x:mr.x,y:mr.y},facts:{x:fr.x,y:fr.y},action:{x:ar.x,y:ar.y},domActionBeforeFacts:!!(action.compareDocumentPosition(facts)&Node.DOCUMENT_POSITION_FOLLOWING)};
                });
              """)
              def assert_authority(label,layout):
                  api=api_sites(); items=((api or {}).get('data') or {}).get('items') or []; dom=rows()
                  if not api.get('ok') or len(items)!=5 or len(dom)!=5:fail(f'{label} expected 5 rows')
                  by={r['name']:r for r in dom}; needs=0
                  for item in items:
                      name=str(item.get('name') or ''); row=by.get(name)
                      if not row:fail(f'{label} missing {name}')
                      if row['primaryCount']!=1 or row['primary']!=expected(item):fail(f'{label} primary drift {name}: {row}')
                      if not row['domActionBeforeFacts']:fail(f'{label} DOM action is not before facts for {name}')
                      if str((item.get('status') or {}).get('code') or '').upper()=='NEEDS_ATTENTION':needs+=1
                      if layout=='desktop' and not (row['main']['x'] < row['facts']['x'] < row['action']['x']):fail(f'desktop visual order drift {name}: {row}')
                      if layout=='mobile' and not (row['main']['y'] < row['action']['y'] < row['facts']['y']):fail(f'mobile vertical order drift {name}: {row}')
                  if needs!=2:fail(f'{label} expected 2 NEEDS_ATTENTION, got {needs}')
                  cw=js('return document.documentElement.clientWidth'); sw=js('return Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)')
                  if sw>cw+1:fail(f'{label} horizontal overflow {sw}>{cw}')
                  print(f'P05_MOBILE_ACTION_FIRST_{label}_AUTHORITY=PASS')
                  print(f'P05_MOBILE_ACTION_FIRST_{label}_ORDER=PASS')
                  print(f'P05_MOBILE_ACTION_FIRST_{label}_OVERFLOW=0')
              sv('POST','/url',{'url':BASE+'/'})
              wait(lambda:js("return !!document.querySelector(\"input[autocomplete='username']\")"),'login')
              send(find("input[autocomplete='username']"),'owner');send(find("input[autocomplete='current-password']"),PASSWORD);click('登录') or fail('login click')
              wait(lambda:'载入演示数据 →' in content(),'demo load ready');click('载入演示数据 →') or fail('demo load click')
              wait(lambda:js("return document.querySelectorAll('.p05v2-site-row').length") == 5,'portfolio rows')
              assert_authority('DESKTOP','desktop');shot('desktop-portfolio.png')
              sv('POST','/window/rect',{'x':0,'y':0,'width':390,'height':844});time.sleep(.6)
              js("document.querySelector('.p05v2-site-row')?.scrollIntoView({block:'start'}); return true");time.sleep(.3)
              assert_authority('MOBILE','mobile');shot('mobile-action-first.png')
              print('P05_MOBILE_ACTION_FIRST_BROWSER=PASS')
          finally:
              if session:
                  try:wd('DELETE',f'/session/{session}')
                  except Exception:pass
              proc.terminate()
          PY

      - name: Upload hierarchy screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p05-mobile-action-first-browser-${{ github.run_id }}
          path: /tmp/p05-mobile-action-first/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Read-only exact boundary
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_EXACT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$P05_EXACT_TREE"
          test -z "$(git status --porcelain)"
          echo P05_PRODUCT_SOURCE_WRITE=0
          echo P05_RELEASE_WRITE=0
          echo P05_PRODUCTION_WRITE=0
