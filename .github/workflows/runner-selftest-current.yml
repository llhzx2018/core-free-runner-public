name: Public Runner Current Self Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths: ['.github/workflows/runner-selftest-current.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-runner-current-selftest-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout public runner control repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Hosted runner allocation proof
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "RUNNER_OS=$RUNNER_OS"
          uname -a
          php -v || true
          python3 --version
          echo 'PUBLIC_RUNNER_ALLOCATION=PASS'

      - name: Verify main push came from merged PR
        if: github.event_name == 'push'
        shell: bash
        env:
          VF_PUSH_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          python3 scripts/check_main_push_provenance.py \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$VF_PUSH_SHA"
          echo 'MAIN_PUSH_PROVENANCE=PASS' >> "$GITHUB_ENV"

      - name: Verify Git Estate anti-drift
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: python3 scripts/check_estate_anti_drift.py --live

      - name: Build public-safe receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/runner
          PROVENANCE="${MAIN_PUSH_PROVENANCE:-NOT_APPLICABLE}"
          cat > evidence/runner/PUBLIC_RUNNER_CURRENT.txt <<EOF
          PUBLIC_RUNNER_ALLOCATION=PASS
          ESTATE_ANTI_DRIFT=PASS
          MAIN_PUSH_PROVENANCE=$PROVENANCE
          RUNNER_REPOSITORY=llhzx2018/core-free-runner-public
          PRIVATE_SOURCE_USED=GOV_DOC_AUTHORITY_ONLY
          SECRET_USED=REGISTERED_PRIVATE_READ_CAPABILITY
          PRIVATE_SOURCE_PERSISTED=NO
          MAIN_WRITE=NO
          USER_MANUAL_EXECUTION_REQUIRED=NO
          EOF

      - name: Upload public-safe receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 Node24
        with:
          name: public-runner-current-selftest-${{ github.run_id }}
          path: evidence/runner/PUBLIC_RUNNER_CURRENT.txt
          if-no-files-found: error
          retention-days: 14

  p05-portfolio-primary-action-browser:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'test/p05-portfolio-primary-action-browser-20260903'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vf_seo
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vf_seo
      VF_MASTER_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NODE_ENV: test
      P05_BASE_SHA: 7e9d71a95317fed9bd4f0c280dcb14341b64b173
      P05_EXACT_SHA: 994b81138de7598f1484dd97e9ad7e9c41c527b1
      P05_EXACT_TREE: f1988695d832932b33dd01fbf46e6520b2eaaefb
    steps:
      - name: Checkout exact P05 primary-action candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.P05_EXACT_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 4

      - name: Verify exact candidate and scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_EXACT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$P05_EXACT_TREE"
          test "$(cat VERSION)" = '1.2.4'
          git cat-file -e "$P05_BASE_SHA^{commit}"
          git diff --check "$P05_BASE_SHA" HEAD
          mapfile -t changed < <(git diff --name-only "$P05_BASE_SHA" HEAD | sort)
          expected=(
            'src/client/ProductApp.tsx'
            'src/client/product-app.css'
            'tests/unit/product-portfolio-top-opportunity-routing-truth.test.ts'
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done
          grep -Fq "const primaryAction = blockerDestination ? 'blocker' : statusCode === 'OPPORTUNITY' && exactOpportunity ? 'opportunity' : 'overview';" src/client/ProductApp.tsx
          grep -Fq '.p05v2-site-row .p05v2-site-action button.primary' src/client/product-app.css
          echo P05_PORTFOLIO_PRIMARY_ACTION_EXACT_SOURCE=PASS

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm

      - name: Build exact candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          npm run typecheck
          npm run build
          npm run migrate
          VF_ADMIN_USERNAME=owner VF_ADMIN_PASSWORD='PrimaryAction-2026!' npm run bootstrap:admin

      - name: Real Chrome Portfolio primary-action journey
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p05-portfolio-primary-action
          PORT=18227 VF_SECURE_COOKIES=false VF_REQUIRE_HTTPS=false node dist/src/server/index.js >/tmp/p05-portfolio-primary-action/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import base64,json,shutil,subprocess,sys,time,urllib.request,urllib.error,pathlib
          BASE='http://127.0.0.1:18227'; DP=9543; PASSWORD='PrimaryAction-2026!'; OUT=pathlib.Path('/tmp/p05-portfolio-primary-action')
          def fail(msg): print('P05_PORTFOLIO_PRIMARY_ACTION_BROWSER=FAIL '+msg,file=sys.stderr); raise SystemExit(1)
          def http(m,u,p=None,timeout=30):
              d=None if p is None else json.dumps(p).encode(); r=urllib.request.Request(u,data=d,method=m)
              if d is not None:r.add_header('Content-Type','application/json')
              try:
                  with urllib.request.urlopen(r,timeout=timeout) as x:
                      raw=x.read().decode(); return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e: fail(f'http {e.code} {u}: {e.read().decode(errors="replace")[:500]}')
          def wait_http(u):
              for _ in range(300):
                  try:
                      with urllib.request.urlopen(u,timeout=1) as r:
                          if r.status<500:return
                  except Exception:time.sleep(.1)
              fail('not ready '+u)
          def wd(m,p,d=None):
              r=http(m,f'http://127.0.0.1:{DP}{p}',d); v=r.get('value')
              if isinstance(v,dict) and v.get('error'):fail(f"webdriver {v.get('error')}: {v.get('message')}")
              return r
          driver=shutil.which('chromedriver'); chrome=shutil.which('google-chrome') or shutil.which('google-chrome-stable')
          if not driver or not chrome:fail('Chrome unavailable')
          proc=subprocess.Popen([driver,f'--port={DP}','--allowed-ips=127.0.0.1'],stdout=subprocess.DEVNULL,stderr=subprocess.STDOUT); s=''
          try:
              wait_http(BASE+'/api/health'); wait_http(f'http://127.0.0.1:{DP}/status')
              r=wd('POST','/session',{'capabilities':{'alwaysMatch':{'browserName':'chrome','goog:chromeOptions':{'binary':chrome,'args':['--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--window-size=1440,1000']}}}})
              s=str(r['value'].get('sessionId') or r.get('sessionId') or '')
              if not s:fail('missing webdriver session')
              def sv(m,p,d=None):return wd(m,f'/session/{s}{p}',d)['value']
              def js(code):return sv('POST','/execute/sync',{'script':code,'args':[]})
              def jsa(code):return sv('POST','/execute/async',{'script':code,'args':[]})
              def content():return str(js("return document.querySelector('.p05v2-content')?.innerText || ''"))
              def wait(fn,label,n=400):
                  last=None
                  for _ in range(n):
                      try:
                          last=fn()
                          if last:return last
                      except Exception as e:last=repr(e)
                      time.sleep(.1)
                  fail(f'timeout {label}: {last!r}')
              def find(css):return sv('POST','/element',{'using':'css selector','value':css})['element-6066-11e4-a52e-4f735466cecf']
              def send(e,v):sv('POST',f'/element/{e}/clear',{});sv('POST',f'/element/{e}/value',{'text':v,'value':list(v)})
              def click(label):return bool(js('''const x=%s;const b=[...document.querySelectorAll('button')].find(e=>e.textContent.trim()===x);if(!b||b.disabled)return false;b.click();return true;'''%json.dumps(label,ensure_ascii=False)))
              def shot(name):(OUT/name).write_bytes(base64.b64decode(sv('GET','/screenshot')))
              def api_sites():
                  return jsa("""const done=arguments[0];fetch('/api/product/sites').then(async r=>({ok:r.ok,status:r.status,data:await r.json()})).then(done).catch(e=>done({ok:false,error:String(e)}));""")
              def dom_rows():
                  return js("""
                    return [...document.querySelectorAll('.p05v2-site-row')].map(row=>{
                      const name=row.querySelector('.p05v2-site-main strong')?.textContent?.trim()||'';
                      const buttons=[...row.querySelectorAll('.p05v2-site-action button')];
                      const primary=buttons.filter(b=>b.classList.contains('primary'));
                      const p=primary[0]||null;
                      const secondary=buttons.find(b=>!b.classList.contains('primary'))||null;
                      return {name,buttons:buttons.map(b=>b.textContent.trim()),primaryCount:primary.length,primary:p?.textContent?.trim()||'',primaryBg:p?getComputedStyle(p).backgroundColor:'',secondaryBg:secondary?getComputedStyle(secondary).backgroundColor:'',rowRight:row.getBoundingClientRect().right};
                    });
                  """)
              def expected(item):
                  code=str((item.get('status') or {}).get('code') or '').upper()
                  opp=item.get('topOpportunity') or {}
                  st=str(opp.get('subjectType') or '').upper()
                  sid=opp.get('subjectId')
                  sid=sid.strip() if isinstance(sid,str) else ''
                  if code=='DATA_PROBLEM':return '处理数据异常 →'
                  if code=='NEEDS_ATTENTION':return '处理技术问题 →'
                  if code=='OPPORTUNITY' and sid and st=='QUERY':return '打开精确关键词证据 →'
                  if code=='OPPORTUNITY' and sid and st=='PAGE':return '打开精确页面证据 →'
                  return '进入网站 →'
              def assert_portfolio(label):
                  api=api_sites()
                  if not api or not api.get('ok'):fail(f'{label} product sites API {api!r}')
                  items=(api.get('data') or {}).get('items') or []
                  rows=dom_rows()
                  if len(items)!=5 or len(rows)!=5:fail(f'{label} expected canonical Demo 5 sites api={len(items)} dom={len(rows)}')
                  by_name={r['name']:r for r in rows}
                  if len(by_name)!=5:fail(f'{label} duplicate/missing DOM names {rows!r}')
                  needs=0
                  for item in items:
                      name=str(item.get('name') or '')
                      row=by_name.get(name)
                      if not row:fail(f'{label} missing DOM row for {name!r}')
                      if row['primaryCount']!=1:fail(f'{label} {name} primaryCount={row["primaryCount"]}')
                      want=expected(item)
                      if row['primary']!=want:fail(f'{label} {name} primary={row["primary"]!r} expected={want!r} status={(item.get("status") or {}).get("code")!r}')
                      code=str((item.get('status') or {}).get('code') or '').upper()
                      if code=='NEEDS_ATTENTION':
                          needs+=1
                          if '进入网站 →' not in row['buttons']:fail(f'{label} {name} missing secondary Overview')
                      if want!='进入网站 →' and '进入网站 →' not in row['buttons']:fail(f'{label} {name} primary replaced Overview instead of demoting it')
                      if row['secondaryBg'] and row['primaryBg']==row['secondaryBg']:fail(f'{label} {name} primary has no visual weight distinction')
                  if needs!=2:fail(f'{label} canonical Demo expected 2 NEEDS_ATTENTION sites, got {needs}')
                  sw=js('return document.documentElement.scrollWidth'); cw=js('return document.documentElement.clientWidth'); bw=js('return document.body.scrollWidth')
                  if sw>cw+1 or bw>cw+1:fail(f'{label} horizontal overflow sw={sw} bw={bw} cw={cw}')
                  print(f'P05_PORTFOLIO_PRIMARY_ACTION_{label}_ROWS=5')
                  print(f'P05_PORTFOLIO_PRIMARY_ACTION_{label}_NEEDS_ATTENTION=2')
                  print(f'P05_PORTFOLIO_PRIMARY_ACTION_{label}_AUTHORITY_MATCH=PASS')
                  print(f'P05_PORTFOLIO_PRIMARY_ACTION_{label}_VISUAL_WEIGHT=PASS')
                  print(f'P05_PORTFOLIO_PRIMARY_ACTION_{label}_OVERFLOW=0')
              sv('POST','/url',{'url':BASE+'/'})
              wait(lambda:js("return !!document.querySelector(\"input[autocomplete='username']\")"),'login')
              send(find("input[autocomplete='username']"),'owner'); send(find("input[autocomplete='current-password']"),PASSWORD); click('登录') or fail('login')
              wait(lambda:'载入演示数据 →' in content(),'empty portfolio'); click('载入演示数据 →') or fail('demo load')
              wait(lambda:len(js("return document.querySelectorAll('.p05v2-site-row').length")) if False else js("return document.querySelectorAll('.p05v2-site-row').length") == 5,'portfolio')
              assert_portfolio('DESKTOP')
              shot('desktop-portfolio.png')
              sv('POST','/window/rect',{'x':0,'y':0,'width':390,'height':844}); time.sleep(.7); js('window.scrollTo(0,0); return true'); time.sleep(.2)
              assert_portfolio('MOBILE')
              shot('mobile-portfolio.png')
              print('P05_PORTFOLIO_PRIMARY_ACTION_BROWSER=PASS')
          finally:
              if s:
                  try:wd('DELETE',f'/session/{s}')
                  except Exception:pass
              proc.terminate()
          PY

      - name: Upload Portfolio primary-action screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p05-portfolio-primary-action-browser-${{ github.run_id }}
          path: /tmp/p05-portfolio-primary-action/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Read-only exact boundary
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_EXACT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$P05_EXACT_TREE"
          test -z "$(git status --porcelain)"
          echo P05_PRODUCT_SOURCE_WRITE=0
          echo P05_RELEASE_WRITE=0
          echo P05_PRODUCTION_WRITE=0
