name: S01 Mature Admin V6 R4 1.21.870 Final Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-selftest-current.yml'

permissions:
  contents: read

jobs:
  final-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPS_SHA: 4afe631b7ae3fada27f47a9f0cb7ba8d2433cffa
      BASE_SHA: 4806d53fb6784d7fc1f7735b0e0195ea56bd0aaf
    steps:
      - name: Checkout exact Ops V6 R4 final candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 4afe631b7ae3fada27f47a9f0cb7ba8d2433cffa
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: ops
          persist-credentials: false

      - name: Exact nine-file release fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$OPS_SHA"
          test "$(cat ops/VERSION)" = '1.21.870'
          mapfile -t changed < <(git -C ops diff --name-only "$BASE_SHA" "$OPS_SHA" | sort)
          expected=(
            VERSION
            assets/css/current/admin-s01-v6-content-seo-r4.css
            includes/admin-v13/tab-controller.php
            includes/admin-v13/views/content_workflow_v6.php
            includes/admin-v13/views/seo_today_v6.php
            includes/s01/v6-landing-shell.php
            includes/views/admin-style-helpers/admin-s01-uiux-polish.php
            tests/s01-v6-r4-content-seo-contract.php
            vf-ops.php
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"
          echo 'S01_121870_EXACT_RELEASE_SCOPE=PASS'

      - name: Release identity semantic fence
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'Version: 1.21.870' ops/vf-ops.php
          grep -Fq "VF_OPS_VERSION', '1.21.870'" ops/vf-ops.php
          grep -Fq "VF_OPS_ROUND', 'S01-MATURE-ADMIN-V6-R4-CONTENT-SEO'" ops/vf-ops.php
          grep -Fq "VF_OPS_RELEASE_CHANNEL', 'candidate'" ops/vf-ops.php
          python3 - <<'PY'
          import subprocess, sys
          diff=subprocess.check_output(['git','-C','ops','diff','--unified=0','4806d53fb6784d7fc1f7735b0e0195ea56bd0aaf','4afe631b7ae3fada27f47a9f0cb7ba8d2433cffa','--','vf-ops.php'],text=True)
          changed=[]
          for line in diff.splitlines():
              if (line.startswith('+') or line.startswith('-')) and not line.startswith(('+++','---')):
                  changed.append(line[1:].strip())
          if len(changed) != 6:
              print('unexpected vf-ops.php delta', changed, file=sys.stderr); sys.exit(1)
          for line in changed:
              if not (line.startswith('* Version: 1.21.') or "VF_OPS_VERSION'" in line or "VF_OPS_ROUND'" in line):
                  print('unexpected release identity delta:', line, file=sys.stderr); sys.exit(1)
          print('S01_121870_RELEASE_IDENTITY_DELTA=PASS')
          PY

      - name: PHP syntax and sealed R4 contract
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l ops/vf-ops.php >/dev/null
          php -l ops/includes/admin-v13/tab-controller.php >/dev/null
          php -l ops/includes/admin-v13/views/content_workflow_v6.php >/dev/null
          php -l ops/includes/admin-v13/views/seo_today_v6.php >/dev/null
          php -l ops/includes/s01/v6-landing-shell.php >/dev/null
          php -l ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php >/dev/null
          php ops/tests/s01-v6-r4-content-seo-contract.php
          echo 'S01_121870_R4_CONTRACT=PASS'

      - name: R4 migration ownership fence
        shell: bash
        run: |
          set -Eeuo pipefail
          controller='ops/includes/admin-v13/tab-controller.php'
          grep -Fq "content_workflow_v6.php" "$controller"
          grep -Fq "seo_today_v6.php" "$controller"
          grep -Fq "['quality','families','states','insights','professional']" "$controller"
          shell='ops/includes/s01/v6-landing-shell.php'
          grep -Fq 'vf_ops_v13_render_primary_navigation_v121403' "$shell"
          ! grep -Fq 'vf_ops_v13_render_route_tabs_v121391' "$shell"
          content='ops/includes/admin-v13/views/content_workflow_v6.php'
          seo='ops/includes/admin-v13/views/seo_today_v6.php'
          grep -Fq 'vf_ops_content_workflow_admin_post_v121647' "$content"
          grep -Fq 'vf_ops_seo_planner_admin_post_v121647' "$seo"
          echo 'S01_121870_R4_MIGRATION=PASS'

      - name: Unrelated behavior source unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          for path in \
            includes/admin-v13/services/content_workflow.php \
            includes/admin-v13/services/seo_today.php \
            includes/admin-v13/route-contract.php \
            includes/s01/tool-workbench.php \
            includes/admin-v13/views/acceptance_overview.php \
            includes/admin-v13/services/acceptance_overview.php \
            includes/wp-update/bootstrap.php; do
            git -C ops diff --quiet "$BASE_SHA" "$OPS_SHA" -- "$path"
          done
          echo 'S01_121870_UNRELATED_SOURCE_UNCHANGED=PASS'

      - name: Controller semantic delta fence
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import subprocess, sys
          diff=subprocess.check_output(['git','-C','ops','diff','--unified=0','4806d53fb6784d7fc1f7735b0e0195ea56bd0aaf','4afe631b7ae3fada27f47a9f0cb7ba8d2433cffa','--','includes/admin-v13/tab-controller.php'],text=True)
          added=[line[1:].strip() for line in diff.splitlines() if line.startswith('+') and not line.startswith('+++')]
          if len(added) != 9:
              print('unexpected controller additions', added, file=sys.stderr); sys.exit(1)
          allowed=(
              '$requestGet=function_exists(', "$section=isset($requestGet['section'])",
              "if(is_array($result)&&isset($result['returnTab'])", "$section=sanitize_key((string)$result['returnTab']);",
              "if(!in_array($section,['quality','families','states','insights','professional'],true)){",
              "$route['view']='admin-v13/views/content_workflow_v6.php';", "$route['view']='admin-v13/views/seo_today_v6.php';", '}',
          )
          if any(not any(line.startswith(prefix) for prefix in allowed) for line in added):
              print('unexpected controller delta', added, file=sys.stderr); sys.exit(1)
          print('S01_121870_CONTROLLER_DELTA=PASS')
          PY

      - name: Secret fence
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t files < <(git -C ops diff --name-only "$BASE_SHA" "$OPS_SHA")
          if grep -Eni '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|password\s*=\s*[^[:space:]]+|secret\s*=\s*[^[:space:]]+)' "${files[@]/#/ops/}"; then
            echo 'secret-like material detected' >&2; exit 1
          fi
          echo 'S01_121870_SECRET_FENCE=PASS'
