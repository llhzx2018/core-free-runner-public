name: Diagnose core-updates S01-C02 1.21.867 V6 R1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-selftest-current.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          repository: llhzx2018/core-updates
          ref: dcdc6851f3dfa605cd0b6fb98e82c690a27d9a3d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          path: core-updates
          persist-credentials: false

      - name: Exact manifest identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C core-updates rev-parse HEAD)" = 'dcdc6851f3dfa605cd0b6fb98e82c690a27d9a3d'
          manifest='core-updates/projects/S01-C02.json'
          grep -Fq '"target_version": "1.21.867"' "$manifest"
          grep -Fq '"1.21.866"' "$manifest"
          grep -Fq '"release_tag": "v1.21.867"' "$manifest"
          grep -Fq '"asset_bytes": 3391987' "$manifest"
          grep -Fq '0cb6a96edcf0ce81ff9e114889b1046ae831dd830000bffe4fb00d8f5a8cd8b7' "$manifest"
          grep -Fq '"runtime_file_count": 944' "$manifest"
          grep -Fq 'a50fa172f06bdd8887b9fa807b2e017aa609fa148f9d1d859d057cf45ecd395a' "$manifest"
          echo 'CORE_UPDATES_121867_EXACT_MANIFEST=PASS'

      - name: Manifest Contract Audit
        shell: bash
        run: |
          set -Eeuo pipefail
          cd core-updates
          python3 scripts/check_manifest_contract.py
          echo 'CORE_UPDATES_121867_MANIFEST_AUDIT=PASS'

      - name: PHP syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          cd core-updates
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          echo 'CORE_UPDATES_121867_PHP_SYNTAX=PASS'

      - name: Update Core regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd core-updates
          php update-core/php/tests/run.php
          echo 'CORE_UPDATES_121867_REGRESSION=PASS'
          echo 'CORE_UPDATES_121867_DISTRIBUTION_DIAGNOSTIC=PASS'
