name: S01 Visible Console V2 Exact Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-selftest-current.yml'

permissions:
  contents: read

concurrency:
  group: s01-visible-console-v2-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact Theme candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 50c16f2ae4049a3f9ca2f87b89c70e43d561a49b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: theme
          persist-credentials: false

      - name: Checkout exact Ops candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 71c12884facd5a0e1f15ab6ce26299452af5610b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: ops
          persist-credentials: false

      - name: Checkout exact M3U8 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: 0d8f5ca1ff7c415c5668e730a90b72ac369cca0c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: m3u8
          persist-credentials: false

      - name: Exact source and changed-file fence
        shell: bash
        run: |
          set -Eeuo pipefail
          THEME_BASE='1337c9c65a453b15496b1f645a45ede70afe060a'
          OPS_BASE='e13191ff2efcb98d8a2866f85e3f9272a2aa49c8'
          M3U8_BASE='466e9ecb97b4d7e03aeadc0533bcef6ecda9346e'
          test "$(git -C theme rev-parse HEAD)" = '50c16f2ae4049a3f9ca2f87b89c70e43d561a49b'
          test "$(git -C ops rev-parse HEAD)" = '71c12884facd5a0e1f15ab6ce26299452af5610b'
          test "$(git -C m3u8 rev-parse HEAD)" = '0d8f5ca1ff7c415c5668e730a90b72ac369cca0c'
          cat > /tmp/theme.expected <<'EOF'
          VERSION
          src/assets/css/admin/admin-s01-console-v2.css
          src/assets/css/admin/admin-update-center-console-v2.css
          src/inc/admin/admin-s01-uiux-polish.php
          src/style.css
          tests/visible-console-v2-contract.php
          EOF
          cat > /tmp/ops.expected <<'EOF'
          VERSION
          assets/css/current/admin-s01-console-v2.css
          includes/views/admin-style-helpers/admin-s01-uiux-polish.php
          tests/visible-console-v2-contract.php
          vf-ops.php
          EOF
          cat > /tmp/m3u8.expected <<'EOF'
          VERSION
          src/admin/admin-s01-uiux-polish.php
          src/admin/ui-v4/admin-s01-console-v2.css
          src/vf-tool-m3u8.php
          tests/unit/visible-console-v2-contract.php
          EOF
          git -C theme diff --name-only "$THEME_BASE"...HEAD | sort > /tmp/theme.actual
          git -C ops diff --name-only "$OPS_BASE"...HEAD | sort > /tmp/ops.actual
          git -C m3u8 diff --name-only "$M3U8_BASE"...HEAD | sort > /tmp/m3u8.actual
          echo '--- THEME ACTUAL ---'; cat /tmp/theme.actual
          echo '--- OPS ACTUAL ---'; cat /tmp/ops.actual
          echo '--- M3U8 ACTUAL ---'; cat /tmp/m3u8.actual
          diff -u <(sort /tmp/theme.expected) /tmp/theme.actual
          diff -u <(sort /tmp/ops.expected) /tmp/ops.actual
          diff -u <(sort /tmp/m3u8.expected) /tmp/m3u8.actual
          echo 'EXACT_CHANGED_FILE_FENCE=PASS'

      - name: Entry-file semantic fence
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import subprocess, pathlib
          def show(repo, sha, path):
              return subprocess.check_output(['git','-C',repo,'show',f'{sha}:{path}'], text=True)
          old = show('ops','e13191ff2efcb98d8a2866f85e3f9272a2aa49c8','vf-ops.php')
          new = pathlib.Path('ops/vf-ops.php').read_text()
          expected = old.replace('Version: 1.21.851','Version: 1.21.852')
          expected = expected.replace("VF_OPS_VERSION', '1.21.851'","VF_OPS_VERSION', '1.21.852'")
          expected = expected.replace("VF_OPS_ROUND', 'S01-UNIFIED-UPDATE-CENTER'","VF_OPS_ROUND', 'S01-VISIBLE-CONSOLE-V2'")
          assert new == expected, 'Ops entry changed outside approved identity lines'
          old = show('m3u8','466e9ecb97b4d7e03aeadc0533bcef6ecda9346e','src/vf-tool-m3u8.php')
          new = pathlib.Path('m3u8/src/vf-tool-m3u8.php').read_text()
          expected = old.replace('Version: 1.25.22','Version: 1.25.23')
          expected = expected.replace("VF_TOOL_M3U8_VERSION', '1.25.22'","VF_TOOL_M3U8_VERSION', '1.25.23'")
          expected = expected.replace("VF_TOOL_M3U8_ROUND', 'R246'","VF_TOOL_M3U8_ROUND', 'R247'")
          expected = expected.replace("return 'R246_S01_UNIFIED_UPDATE_CENTER';","return 'R247_S01_VISIBLE_CONSOLE_V2';")
          assert new == expected, 'M3U8 entry changed outside approved identity lines'
          old = show('theme','1337c9c65a453b15496b1f645a45ede70afe060a','src/style.css')
          new = pathlib.Path('theme/src/style.css').read_text()
          expected = old.replace('Version: 1.35.13','Version: 1.35.14')
          expected = expected.replace('V1.35.13_S01_UPDATE_CENTER_UX_POLISH','V1.35.14_S01_VISIBLE_CONSOLE_V2')
          assert new == expected, 'Theme style.css changed outside version/round'
          print('ENTRY_SEMANTIC_FENCE=PASS')
          PY

      - name: PHP syntax gate
        shell: bash
        run: |
          set -Eeuo pipefail
          find theme ops m3u8 -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          echo 'PHP_LINT=PASS'

      - name: Visible UX contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          php theme/tests/visible-console-v2-contract.php
          php ops/tests/visible-console-v2-contract.php
          php m3u8/tests/unit/visible-console-v2-contract.php
          echo 'VISIBLE_CONSOLE_V2_CONTRACTS=PASS'

      - name: Existing update-policy regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          php theme/tests/update-refresh-policy-contract.php
          php ops/.github/phase3/v121811-update-refresh-policy.php
          php m3u8/tests/unit/update-refresh-policy-contract.php
          echo 'EXISTING_UPDATE_POLICY_REGRESSION=PASS'

      - name: Credential and migration boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          ! git -C theme diff '1337c9c65a453b15496b1f645a45ede70afe060a'...HEAD | grep -E 'ghp_[A-Za-z0-9]|github_pat_|BEGIN (RSA |OPENSSH )?PRIVATE KEY'
          ! git -C ops diff 'e13191ff2efcb98d8a2866f85e3f9272a2aa49c8'...HEAD | grep -E 'ghp_[A-Za-z0-9]|github_pat_|BEGIN (RSA |OPENSSH )?PRIVATE KEY'
          ! git -C m3u8 diff '466e9ecb97b4d7e03aeadc0533bcef6ecda9346e'...HEAD | grep -E 'ghp_[A-Za-z0-9]|github_pat_|BEGIN (RSA |OPENSSH )?PRIVATE KEY'
          echo 'SECRET_LEAK_FENCE=PASS'
          echo 'NO_SCHEMA_MIGRATION_CHANGED=PASS'
          echo 'S01_VISIBLE_CONSOLE_V2_GATE=PASS'
