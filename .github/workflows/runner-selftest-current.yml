name: Public Runner Current Self Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p05-v125-core-updates-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  p05-v125-core-updates:
    if: github.event_name == 'pull_request' && github.head_ref == 'test/p05-v125-core-updates-manifest-20260904'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CORE_UPDATES_HEAD: 4a5adf006fd125887f04acd323eb3d738218fa5a
      RELEASE_ID: '382166024'
      RELEASE_TAG: v1.2.5
      RELEASE_TARGET: e37db145111366a29fc91c33348216a7af79ae8c
      UPDATE_ASSET_ID: '543024326'
      UPDATE_SHA256: 44b125c191c1d8be4b21fa1a73cfedf955ac071b7c770ccd9cc45bfba0c5b760
      UPDATE_BYTES: '796722'
    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CORE_UPDATES_HEAD }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: core-updates

      - name: Verify exact single-hop P05 manifest
        working-directory: core-updates
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CORE_UPDATES_HEAD"
          python3 - <<'PY'
          import json,os
          m=json.load(open('projects/P05.json'))
          assert m['schema_version']=='1.0' and m['project_id']=='P05' and m['component_id']=='APP' and m['enabled'] is True
          assert m['current_version']=='1.2.4' and m['target_version']=='1.2.5' and m['update_type']=='ATOMIC'
          assert m['from_versions']==['1.2.4'] and m['schema_from']=='1' and m['schema_to']=='1'
          assert m['repository']=='llhzx2018/vf-seo' and m['release_tag']=='v1.2.5' and m['release_id']==int(os.environ['RELEASE_ID'])
          assert m['product_identity']==os.environ['RELEASE_TARGET']
          assert m['asset_name']=='VF_SEO_V1.2.5_UPDATE.zip' and m['asset_bytes']==int(os.environ['UPDATE_BYTES']) and m['asset_sha256']==os.environ['UPDATE_SHA256']
          assert m['backup_required'] is True and m['rollback_supported'] is True and m['minimum_php']=='8.2'
          print('P05_V125_CORE_UPDATES_MANIFEST_CONTRACT=PASS')
          PY

      - name: Run Update Core regression suite
        working-directory: core-updates
        run: |
          set -Eeuo pipefail
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          echo P05_V125_UPDATE_CORE_REGRESSION=PASS

      - name: Bind live v1.2.5 Release asset
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api "repos/llhzx2018/vf-seo/releases/tags/$RELEASE_TAG" > /tmp/release.json
          python3 - <<'PY'
          import json,os
          r=json.load(open('/tmp/release.json')); a={x['name']:x for x in r['assets']}
          assert r['id']==int(os.environ['RELEASE_ID']) and r['target_commitish']==os.environ['RELEASE_TARGET']
          x=a['VF_SEO_V1.2.5_UPDATE.zip']
          assert x['id']==int(os.environ['UPDATE_ASSET_ID']) and x['size']==int(os.environ['UPDATE_BYTES']) and x['digest']=='sha256:'+os.environ['UPDATE_SHA256']
          print('P05_V125_CORE_UPDATES_RELEASE_BINDING=PASS')
          print('P05_PRODUCTION_WRITE=0')
          PY
