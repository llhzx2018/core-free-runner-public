name: S01 Mature Admin V6 R4.1 Content SEO Closure Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-selftest-current.yml'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPS_REPO: llhzx2018/vf-tools-ops
      OPS_SHA: c961d05bc1a67f04ece14e40a9da3ca48b16b694
      BASE_SHA: 82c13ee4988a42aca31abfd6e423cf7cb66ab6ab
    steps:
      - name: Checkout exact Ops R4.1 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          repository: llhzx2018/vf-tools-ops
          ref: c961d05bc1a67f04ece14e40a9da3ca48b16b694
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: ops
          persist-credentials: false

      - name: Exact four-file R4.1 fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$OPS_SHA"
          mapfile -t changed < <(git -C ops diff --name-only "$BASE_SHA" "$OPS_SHA" | sort)
          expected=(
            assets/css/current/admin-s01-v6-content-seo-r4.css
            includes/admin-v13/views/content_workflow_v6.php
            includes/s01/v6-landing-shell.php
            tests/s01-v6-r41-content-seo-closure-contract.php
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"
          echo 'S01_V6_R41_EXACT_SCOPE=PASS'

      - name: PHP syntax and R4.1 contract
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l ops/includes/admin-v13/views/content_workflow_v6.php >/dev/null
          php -l ops/includes/s01/v6-landing-shell.php >/dev/null
          php -l ops/tests/s01-v6-r41-content-seo-closure-contract.php >/dev/null
          php ops/tests/s01-v6-r41-content-seo-closure-contract.php
          echo 'S01_V6_R41_SYNTAX_CONTRACT=PASS'

      - name: Six-domain active-state closure
        shell: bash
        run: |
          set -Eeuo pipefail
          shell='ops/includes/s01/v6-landing-shell.php'
          domain='ops/includes/s01/admin-shell-domain-contract.php'
          grep -Fq 'vf_ops_s01_admin_domain_contract_v1' "$shell"
          grep -Fq 'vf_ops_s01_admin_domain_for_page_v1' "$shell"
          grep -Fq 'vf-v6-domain-nav' "$shell"
          grep -Fq 'vf-v6-domain-mobile' "$shell"
          grep -Fq 'data-vf-domain-id' "$shell"
          ! grep -Fq 'vf_ops_v13_render_primary_navigation_v121403' "$shell"
          grep -Fq "'content_seo'" "$domain"
          grep -Fq "'vf-toolsite-content','vf-toolsite-seo-keywords'" "$domain"
          echo 'S01_V6_R41_DOMAIN_NAV=PASS'

      - name: Content issue-count reconciliation
        shell: bash
        run: |
          set -Eeuo pipefail
          view='ops/includes/admin-v13/views/content_workflow_v6.php'
          grep -Fq '$mediaRiskCount > 0' "$view"
          grep -Fq '$issueCategories['"'"'媒体资源'"'"']' "$view"
          grep -Fq '$classifiedIssueCount = array_sum($issueCategories)' "$view"
          grep -Fq '$issueCount = max($issueCount, $classifiedIssueCount)' "$view"
          echo 'S01_V6_R41_ISSUE_RECONCILIATION=PASS'

      - name: Visual closure fence
        shell: bash
        run: |
          set -Eeuo pipefail
          css='ops/assets/css/current/admin-s01-v6-content-seo-r4.css'
          grep -Fq 'V6-R4.1 screenshot closure' "$css"
          grep -Fq '.vf-v6-cs-switcher a.is-current::after' "$css"
          grep -Fq '.vf-v6-cs-verdict small::before' "$css"
          grep -Fq 'border-left-color: var(--vf-v6-danger)' "$css"
          grep -Fq '.vf-v6-cs-details summary:hover' "$css"
          for bp in 1180 960 782 520; do grep -Fq "@media (max-width: ${bp}px)" "$css"; done
          ! grep -Fq ':root' "$css"
          ! grep -Fq '.vf-m3u8-' "$css"
          echo 'S01_V6_R41_VISUAL=PASS'

      - name: Business ownership source unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          for path in \
            includes/admin-v13/services/content_workflow.php \
            includes/admin-v13/services/seo_today.php \
            includes/admin-v13/route-contract.php \
            includes/admin-v13/tab-controller.php \
            includes/s01/tool-workbench.php \
            includes/admin-v13/services/acceptance_overview.php \
            includes/wp-update/bootstrap.php; do
            git -C ops diff --quiet "$BASE_SHA" "$OPS_SHA" -- "$path"
          done
          echo 'S01_V6_R41_OWNERSHIP_UNCHANGED=PASS'

      - name: Secret fence
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t files < <(git -C ops diff --name-only "$BASE_SHA" "$OPS_SHA")
          if grep -Eni '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|password\s*=\s*[^[:space:]]+|secret\s*=\s*[^[:space:]]+)' "${files[@]/#/ops/}"; then
            echo 'secret-like material detected' >&2; exit 1
          fi
          echo 'S01_V6_R41_SECRET_FENCE=PASS'
