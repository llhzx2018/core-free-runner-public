name: Public Runner Current Self Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths: ['.github/workflows/runner-selftest-current.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-runner-current-selftest-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout public runner control repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Hosted runner allocation proof
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "RUNNER_OS=$RUNNER_OS"
          uname -a
          php -v || true
          python3 --version
          echo 'PUBLIC_RUNNER_ALLOCATION=PASS'

      - name: Verify main push came from merged PR
        if: github.event_name == 'push'
        shell: bash
        env:
          VF_PUSH_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          python3 scripts/check_main_push_provenance.py \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$VF_PUSH_SHA"
          echo 'MAIN_PUSH_PROVENANCE=PASS' >> "$GITHUB_ENV"

      - name: Verify Git Estate anti-drift
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: python3 scripts/check_estate_anti_drift.py --live

      - name: Build public-safe receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/runner
          PROVENANCE="${MAIN_PUSH_PROVENANCE:-NOT_APPLICABLE}"
          cat > evidence/runner/PUBLIC_RUNNER_CURRENT.txt <<EOF
          PUBLIC_RUNNER_ALLOCATION=PASS
          ESTATE_ANTI_DRIFT=PASS
          MAIN_PUSH_PROVENANCE=$PROVENANCE
          RUNNER_REPOSITORY=llhzx2018/core-free-runner-public
          PRIVATE_SOURCE_USED=GOV_DOC_AUTHORITY_ONLY
          SECRET_USED=REGISTERED_PRIVATE_READ_CAPABILITY
          PRIVATE_SOURCE_PERSISTED=NO
          MAIN_WRITE=NO
          USER_MANUAL_EXECUTION_REQUIRED=NO
          EOF

      - name: Upload public-safe receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 Node24
        with:
          name: public-runner-current-selftest-${{ github.run_id }}
          path: evidence/runner/PUBLIC_RUNNER_CURRENT.txt
          if-no-files-found: error
          retention-days: 14

  p05-recent-change-browser:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'test/p05-recent-change-why-routing-20260903'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vf_seo
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vf_seo
      VF_MASTER_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NODE_ENV: test
    steps:
      - name: Checkout exact P05 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: ee046b3248b1bf06fbb47bf93744409afc3aad38
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact candidate identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 'ee046b3248b1bf06fbb47bf93744409afc3aad38'
          test "$(git rev-parse HEAD^{tree})" = '0b52531ba076dac5fdec23d8041761888aaf8fc1'
          test "$(cat VERSION)" = '1.2.3'
          grep -Fq "hypothesisId === 'recent-change' || hypothesisId.startsWith('recent-change:')" src/client/ProductApp.tsx
          echo P05_RECENT_CHANGE_EXACT_SOURCE=PASS

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm

      - name: Focused routing truth and build
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          node --import tsx --test --test-concurrency=1 \
            tests/unit/product-overview-why-query-routing-truth.test.ts \
            tests/unit/product-overview-action-routing-truth.test.ts \
            tests/unit/product-overview-changes-workspace-action-truth.test.ts
          npm run typecheck
          npm run build

      - name: Real Owner recent-change WHY routing journey
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run migrate
          VF_ADMIN_USERNAME=owner VF_ADMIN_PASSWORD='RecentChange-2026!' npm run bootstrap:admin
          PORT=18217 VF_SECURE_COOKIES=false VF_REQUIRE_HTTPS=false node dist/src/server/index.js >/tmp/p05-recent-change-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import json, shutil, subprocess, sys, time, urllib.request, urllib.error
          BASE='http://127.0.0.1:18217'; DP=9531; PASSWORD='RecentChange-2026!'
          def fail(msg):
              print('P05_RECENT_CHANGE_BROWSER=FAIL '+msg, file=sys.stderr)
              try: print(open('/tmp/p05-recent-change-server.log').read()[-4000:], file=sys.stderr)
              except Exception: pass
              raise SystemExit(1)
          def http(m,u,p=None,timeout=30):
              d=None if p is None else json.dumps(p).encode(); r=urllib.request.Request(u,data=d,method=m)
              if d is not None:r.add_header('Content-Type','application/json')
              try:
                  with urllib.request.urlopen(r,timeout=timeout) as x:
                      raw=x.read().decode(); return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e: fail(f'http {e.code} {u}: {e.read().decode(errors="replace")[:500]}')
          def wait_http(u):
              for _ in range(300):
                  try:
                      with urllib.request.urlopen(u,timeout=1) as r:
                          if r.status < 500:return
                  except Exception:time.sleep(.1)
              fail('not ready '+u)
          def wd(m,p,d=None):
              r=http(m,f'http://127.0.0.1:{DP}{p}',d); v=r.get('value')
              if isinstance(v,dict) and v.get('error'):fail(f"webdriver {v.get('error')}: {v.get('message')}")
              return r
          driver=shutil.which('chromedriver'); chrome=shutil.which('google-chrome') or shutil.which('google-chrome-stable')
          if not driver or not chrome:fail('Chrome unavailable')
          proc=subprocess.Popen([driver,f'--port={DP}','--allowed-ips=127.0.0.1'],stdout=subprocess.DEVNULL,stderr=subprocess.STDOUT); s=''
          try:
              wait_http(BASE+'/api/health'); wait_http(f'http://127.0.0.1:{DP}/status')
              r=wd('POST','/session',{'capabilities':{'alwaysMatch':{'browserName':'chrome','goog:chromeOptions':{'binary':chrome,'args':['--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--window-size=1440,1000']}}}})
              s=str(r['value'].get('sessionId') or r.get('sessionId') or '')
              if not s:fail('missing webdriver session')
              def sv(m,p,d=None):return wd(m,f'/session/{s}{p}',d)['value']
              def js(code):return sv('POST','/execute/sync',{'script':code,'args':[]})
              def content():return str(js("return document.querySelector('.p05v2-content')?.innerText || ''"))
              def wait(fn,label,n=400):
                  last=None
                  for _ in range(n):
                      try:
                          last=fn()
                          if last:return last
                      except Exception as e:last=repr(e)
                      time.sleep(.1)
                  fail(f'timeout {label}: {last!r}')
              def find(css):return sv('POST','/element',{'using':'css selector','value':css})['element-6066-11e4-a52e-4f735466cecf']
              def send(e,v):sv('POST',f'/element/{e}/clear',{});sv('POST',f'/element/{e}/value',{'text':v,'value':list(v)})
              def click(label):return bool(js('''const x=%s;const b=[...document.querySelectorAll('button')].find(e=>e.textContent.trim()===x);if(!b||b.disabled)return false;b.click();return true;'''%json.dumps(label,ensure_ascii=False)))
              sv('POST','/url',{'url':BASE+'/'})
              wait(lambda:js("return !!document.querySelector(\"input[autocomplete='username']\")"),'login')
              send(find("input[autocomplete='username']"),'owner');send(find("input[autocomplete='current-password']"),PASSWORD);click('登录') or fail('login')
              wait(lambda:content() if '载入演示数据 →' in content() else '', 'empty portfolio')
              click('载入演示数据 →') or fail('demo load')
              wait(lambda:content() if all(x in content() for x in ['Kewaro Tools','Kewaro Start','Kewaro Guide','Kewaro AI','WordPress Lab']) else '', 'demo portfolio')
              options=js("return [...document.querySelector('.p05v2-site-context select').options].map(o=>({value:o.value,label:o.textContent.trim()}));")
              if not options:fail('no site options')
              found=None
              for opt in options:
                  ok=js('''const v=%s;const s=document.querySelector('.p05v2-site-context select');if(!s)return false;s.value=v;s.dispatchEvent(new Event('change',{bubbles:true}));return true;'''%json.dumps(opt['value']))
                  if not ok:fail('site selection failed '+str(opt))
                  probe=None
                  for _ in range(100):
                      probe=js('''const cards=[...document.querySelectorAll('.p05v2-hypothesis')];const card=cards.find(c=>c.querySelector('strong')?.textContent.trim()==='最近改动与本轮变化在时间上接近');if(!card)return null;return {text:card.innerText,button:[...card.querySelectorAll('button')].map(b=>b.textContent.trim())};''')
                      if probe:break
                      time.sleep(.1)
                  if probe:found={'site':opt,'probe':probe};break
              if not found:fail('no real recent-change WHY card found across Demo sites')
              print('P05_RECENT_CHANGE_SITE='+json.dumps(found['site'],ensure_ascii=False))
              print('P05_RECENT_CHANGE_CARD='+json.dumps(found['probe'],ensure_ascii=False))
              if '进入变更观察 →' not in found['probe']['button']:fail('WHY action missing')
              if '仅为候选解释，不代表因果' not in found['probe']['text']:fail('non-causal disclaimer missing')
              clicked=js('''const card=[...document.querySelectorAll('.p05v2-hypothesis')].find(c=>c.querySelector('strong')?.textContent.trim()==='最近改动与本轮变化在时间上接近');const b=card&&[...card.querySelectorAll('button')].find(x=>x.textContent.trim()==='进入变更观察 →');if(!b)return false;b.click();return true;''')
              if not clicked:fail('WHY action click failed')
              changes=wait(lambda:content() if '记录一次真正值得观察的改动' in content() and '哪次改动之后发生了什么' in content() else '', 'generic Changes workspace')
              if '最近改动与本轮变化在时间上接近' not in changes:fail('candidate explanation context missing')
              if bool(js("return !!document.querySelector('.p05v2-error')")):fail('Owner error visible after route')
              print('P05_RECENT_CHANGE_GENERIC_CHANGES_ROUTE=PASS')
              print('P05_RECENT_CHANGE_BROWSER=PASS')
          finally:
              if s:
                  try:wd('DELETE',f'/session/{s}')
                  except Exception:pass
              proc.terminate()
          PY

      - name: Read-only exact boundary
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 'ee046b3248b1bf06fbb47bf93744409afc3aad38'
          test "$(git rev-parse HEAD^{tree})" = '0b52531ba076dac5fdec23d8041761888aaf8fc1'
          test -z "$(git status --porcelain)"
          echo P05_PRODUCT_SOURCE_WRITE=0
          echo P05_RELEASE_WRITE=0
          echo P05_PRODUCTION_WRITE=0
