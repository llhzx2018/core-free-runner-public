name: Diagnose core-updates S01-C02 1.21.866

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-selftest-current.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          repository: llhzx2018/core-updates
          ref: e498dd88fd235b3eee70ca2dfaf668f0a2ef7a53
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          path: core-updates
          persist-credentials: false

      - name: Exact source proof
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C core-updates rev-parse HEAD)" = 'e498dd88fd235b3eee70ca2dfaf668f0a2ef7a53'
          manifest='core-updates/projects/S01-C02.json'
          grep -Fq '"target_version": "1.21.866"' "$manifest"
          grep -Fq '"1.21.865"' "$manifest"
          grep -Fq '"release_tag": "v1.21.866"' "$manifest"
          grep -Fq '"asset_bytes": 3387980' "$manifest"
          grep -Fq '398751aa2d78cae0c1e285f6c5b7a1d2eddc969fe86efbf84a09b16e312711b6' "$manifest"
          grep -Fq '"runtime_file_count": 943' "$manifest"
          grep -Fq '8ca58ae53a34d05d7200df520322304a98f0b9346edf105bdb298edf4bdacb8f' "$manifest"
          echo 'CORE_UPDATES_121866_EXACT_SOURCE=PASS'

      - name: Manifest Contract Audit with full output
        shell: bash
        run: |
          set -o pipefail
          cd core-updates
          python3 scripts/check_manifest_contract.py 2>&1 | tee /tmp/manifest-audit.log
          status=${PIPESTATUS[0]}
          echo "MANIFEST_AUDIT_EXIT=$status"
          exit "$status"

      - name: PHP syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          cd core-updates
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          echo 'CORE_UPDATES_121866_PHP_SYNTAX=PASS'

      - name: Update Core regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd core-updates
          php update-core/php/tests/run.php
          echo 'CORE_UPDATES_121866_REGRESSION=PASS'
          echo 'CORE_UPDATES_121866_DISTRIBUTION_DIAGNOSTIC=PASS'
