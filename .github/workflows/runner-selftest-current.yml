name: Diagnose core-updates S01-C02 1.21.868 V6 R2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-selftest-current.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          repository: llhzx2018/core-updates
          ref: ddd5db2f168a8a787141fc3ca834353dfba68a9b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          path: core-updates
          persist-credentials: false

      - name: Exact manifest identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C core-updates rev-parse HEAD)" = 'ddd5db2f168a8a787141fc3ca834353dfba68a9b'
          manifest='core-updates/projects/S01-C02.json'
          grep -Fq '"target_version": "1.21.868"' "$manifest"
          grep -Fq '"1.21.867"' "$manifest"
          grep -Fq '"release_tag": "v1.21.868"' "$manifest"
          grep -Fq '"asset_bytes": 3395247' "$manifest"
          grep -Fq 'e9d62af7556c896c47bafc06bb31d3a12d87a637cd0e516b8a8494e85846efb1' "$manifest"
          grep -Fq '"runtime_file_count": 945' "$manifest"
          grep -Fq '5771322452b2b9572c714293eca3959166c4833c6f76a753251f2adb541354a2' "$manifest"
          echo 'CORE_UPDATES_121868_EXACT_MANIFEST=PASS'

      - name: Manifest Contract Audit
        shell: bash
        run: |
          set -Eeuo pipefail
          cd core-updates
          python3 scripts/check_manifest_contract.py
          echo 'CORE_UPDATES_121868_MANIFEST_AUDIT=PASS'

      - name: PHP syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          cd core-updates
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          echo 'CORE_UPDATES_121868_PHP_SYNTAX=PASS'

      - name: Update Core regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd core-updates
          php update-core/php/tests/run.php
          echo 'CORE_UPDATES_121868_REGRESSION=PASS'
          echo 'CORE_UPDATES_121868_DISTRIBUTION_DIAGNOSTIC=PASS'
