name: S01 Mature Admin V6 R1 1.21.867 Final Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-selftest-current.yml'

permissions:
  contents: read

concurrency:
  group: s01-v6-r1-121867-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  final-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact Ops V6 R1 final candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 7176a055a8bb01bc77818d0bbf34f7b5d8c645fd
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: ops
          persist-credentials: false

      - name: Exact six-file release fence
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='6dff951061496e31db416b40fbf04033c6e30709'
          HEAD='7176a055a8bb01bc77818d0bbf34f7b5d8c645fd'
          test "$(git -C ops rev-parse HEAD)" = "$HEAD"
          cat > /tmp/expected <<'EOF'
          VERSION
          assets/css/current/admin-s01-v6-shell-r1.css
          includes/views/admin-shell-tabs-parts/02-shell-navigation.php
          includes/views/admin-style-helpers/admin-s01-uiux-polish.php
          tests/s01-v6-r1-shell-foundation-contract.php
          vf-ops.php
          EOF
          git -C ops diff --name-only "$BASE"...HEAD | sort > /tmp/actual
          diff -u <(sort /tmp/expected) /tmp/actual
          echo 'S01_V6_R1_121867_SCOPE=PASS'

      - name: Release identity semantic fence
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import pathlib, subprocess
          base='6dff951061496e31db416b40fbf04033c6e30709'
          old=subprocess.check_output(['git','-C','ops','show',f'{base}:vf-ops.php'], text=True)
          new=pathlib.Path('ops/vf-ops.php').read_text()
          expected=old.replace('Version: 1.21.866','Version: 1.21.867')
          expected=expected.replace("VF_OPS_VERSION', '1.21.866'","VF_OPS_VERSION', '1.21.867'")
          expected=expected.replace("VF_OPS_ROUND', 'S01-MATURE-ADMIN-R9-VISUAL-CLOSURE'","VF_OPS_ROUND', 'S01-MATURE-ADMIN-V6-R1-SHELL-FOUNDATION'")
          assert new == expected, 'vf-ops.php changed outside approved V6-R1 release identity lines'
          assert pathlib.Path('ops/VERSION').read_text().strip() == '1.21.867'
          print('S01_V6_R1_121867_IDENTITY=PASS')
          PY

      - name: PHP syntax and final V6 R1 contract
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l ops/vf-ops.php
          php -l ops/includes/views/admin-shell-tabs-parts/02-shell-navigation.php
          php -l ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php
          php -l ops/tests/s01-v6-r1-shell-foundation-contract.php
          php ops/tests/s01-v6-r1-shell-foundation-contract.php
          echo 'S01_V6_R1_121867_CONTRACT=PASS'

      - name: Shell migration ownership fence
        shell: bash
        run: |
          set -Eeuo pipefail
          shell='ops/includes/views/admin-shell-tabs-parts/02-shell-navigation.php'
          loader='ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php'
          css='ops/assets/css/current/admin-s01-v6-shell-r1.css'
          grep -Fq 'vf-ops-v6-shell' "$shell"
          grep -Fq 'vf_ops_s01_admin_domain_contract_v1' "$shell"
          grep -Fq "routeKey !== 'acceptance_overview'" "$shell"
          grep -Fq 'admin-s01-v6-shell-r1.css' "$loader"
          ! grep -Fq 'admin-s01-product-shell-r3.css' "$loader"
          ! grep -Fq 'admin-s01-top-domains-v3.css' "$loader"
          ! grep -Fq 'admin-s01-mature-shell-r7.js' "$loader"
          ! grep -q ':root' "$css"
          ! grep -q '\.vf-m3u8-' "$css"
          echo 'S01_V6_R1_121867_OWNERSHIP=PASS'

      - name: Unrelated behavior source unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='6dff951061496e31db416b40fbf04033c6e30709'
          git -C ops diff --exit-code "$BASE"...HEAD -- \
            includes/s01/tool-workbench.php \
            includes/admin-v13/views/acceptance_overview.php \
            includes/views/admin-operations-console-pages.php \
            includes/views/admin-online-acceptance.php \
            includes/views/admin-ai-report-shell.php \
            includes/wp-update/class-vf-ops-update-source-v1.php \
            includes/wp-update/bootstrap.php \
            includes/wp-update/class-vf-ops-update-admin-v1.php
          grep -Fq 'vf_m3u8_first_run_readiness' ops/includes/s01/tool-workbench.php
          grep -Fq 'vf_m3u8_first_run_initialize' ops/includes/s01/tool-workbench.php
          grep -Fq 'FINAL_ONLINE_PASS=' ops/includes/admin-v13/views/acceptance_overview.php
          echo 'S01_V6_R1_121867_BEHAVIOR=PASS'

      - name: Secret fence
        shell: bash
        run: |
          set -Eeuo pipefail
          ! git -C ops diff '6dff951061496e31db416b40fbf04033c6e30709'...HEAD | grep -E 'ghp_[A-Za-z0-9]|github_pat_|BEGIN (RSA |OPENSSH )?PRIVATE KEY'
          echo 'S01_V6_R1_121867_SECRET=PASS'
          echo 'S01_MATURE_ADMIN_V6_R1_121867_FINAL_GATE=PASS'
