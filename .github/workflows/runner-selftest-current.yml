name: S01 C02 1.21.861 Formal Release

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-selftest-current.yml'

permissions:
  contents: read

concurrency:
  group: s01-c02-121861-formal-release-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  formal-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPS_REPO: llhzx2018/vf-tools-ops
      OPS_SHA: b4eeed57365d2ad833ce25853bc0d92663a18151
      VERSION: 1.21.861
      TAG: v1.21.861
      ASSET: vf-tools-ops_V1.21.861.zip
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Checkout exact formal Ops source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          repository: llhzx2018/vf-tools-ops
          ref: b4eeed57365d2ad833ce25853bc0d92663a18151
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: ops
          persist-credentials: false

      - name: Verify exact source identity and release preconditions
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${GH_TOKEN:-}"
          test "$(git -C ops rev-parse HEAD)" = "$OPS_SHA"
          test "$(cat ops/VERSION)" = "$VERSION"
          grep -Fq 'Version: 1.21.861' ops/vf-ops.php
          grep -Fq "VF_OPS_VERSION', '1.21.861'" ops/vf-ops.php
          grep -Fq "VF_OPS_ROUND', 'S01-REFERENCE-SAMPLES-TOOLS-QUALITY-R5'" ops/vf-ops.php
          if gh release view "$TAG" --repo "$OPS_REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists" >&2
            exit 1
          fi
          if gh api "repos/$OPS_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists" >&2
            exit 1
          fi
          echo 'S01_C02_121861_RELEASE_PRECONDITIONS=PASS'

      - name: Re-run source and upgrade safety contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l ops/vf-ops.php
          php -l ops/includes/s01/tool-workbench.php
          php -l ops/includes/admin-v13/views/acceptance_overview.php
          php -l ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php
          php ops/tests/s01-121861-reference-samples-contract.php
          php ops/tests/visible-console-v2-contract.php
          php ops/tests/top-domains-visible-ui-contract.php
          php ops/tests/admin-human-language-contract.php
          php ops/tests/update-refresh-policy-current-contract.php
          echo 'S01_C02_121861_FORMAL_SOURCE_GATE=PASS'

      - name: Build exact WordPress plugin ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p dist
          git -C ops archive --format=zip --prefix=vf-tools-ops/ "$OPS_SHA" > "dist/$ASSET"
          test -s "dist/$ASSET"
          unzip -Z1 "dist/$ASSET" > /tmp/zip.list
          test "$(head -n1 /tmp/zip.list | cut -d/ -f1)" = 'vf-tools-ops'
          test "$(grep -c '^vf-tools-ops/vf-ops.php$' /tmp/zip.list)" = '1'
          test "$(grep -c '^vf-tools-ops/VERSION$' /tmp/zip.list)" = '1'
          ! grep -q '^vf-tools-ops/.git/' /tmp/zip.list
          rm -rf /tmp/vf-ops-package && mkdir -p /tmp/vf-ops-package
          unzip -q "dist/$ASSET" -d /tmp/vf-ops-package
          test "$(cat /tmp/vf-ops-package/vf-tools-ops/VERSION)" = "$VERSION"
          grep -Fq 'Version: 1.21.861' /tmp/vf-ops-package/vf-tools-ops/vf-ops.php
          php -l /tmp/vf-ops-package/vf-tools-ops/vf-ops.php
          sha256sum "dist/$ASSET" | tee /tmp/asset.sha256
          stat -c '%s' "dist/$ASSET" | tee /tmp/asset.bytes
          echo 'S01_C02_121861_PACKAGE_GATE=PASS'

      - name: Create immutable formal tag release and upload asset
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/release-notes.md <<EOF
          S01-C02 Reference-led Tools + Quality Preview.
          Exact main source: $OPS_SHA
          Product Machine Gate: 34664084382 PASS

          Visible scope is intentionally limited to two real WordPress admin pages:
          - Tools / Tool Workbench
          - Quality / Acceptance overview

          Visual direction follows the approved reference images: white product surfaces, light canvas, cyan/teal action language, restrained shadow, one dominant task, compact horizontal status blocks and professional evidence folded down.

          Schema remains 6.0.0; physical locator remains vf-ops/vf-ops.php; locator cutover remains false.
          Production: NOT_RUN
          Static: NOT_RUN
          Online: NOT_RUN
          EOF
          gh release create "$TAG" "dist/$ASSET#VF Tools Ops $VERSION WordPress plugin ZIP" \
            --repo "$OPS_REPO" \
            --target "$OPS_SHA" \
            --title "VF Tools Ops V$VERSION" \
            --notes-file /tmp/release-notes.md
          echo 'S01_C02_121861_RELEASE_CREATE=PASS'

      - name: Independent release and asset readback
        shell: bash
        run: |
          set -Eeuo pipefail
          release_json="$(gh api "repos/$OPS_REPO/releases/tags/$TAG")"
          test "$(jq -r '.tag_name' <<<"$release_json")" = "$TAG"
          test "$(jq -r '.draft' <<<"$release_json")" = 'false'
          test "$(jq -r '.prerelease' <<<"$release_json")" = 'false'
          asset_id="$(jq -r --arg name "$ASSET" '.assets[] | select(.name==$name) | .id' <<<"$release_json")"
          asset_size="$(jq -r --arg name "$ASSET" '.assets[] | select(.name==$name) | .size' <<<"$release_json")"
          asset_digest="$(jq -r --arg name "$ASSET" '.assets[] | select(.name==$name) | .digest // empty' <<<"$release_json")"
          test -n "$asset_id"
          local_size="$(cat /tmp/asset.bytes)"
          local_sha="$(awk '{print $1}' /tmp/asset.sha256)"
          test "$asset_size" = "$local_size"
          if [ -n "$asset_digest" ]; then test "$asset_digest" = "sha256:$local_sha"; fi
          tag_json="$(gh api "repos/$OPS_REPO/git/ref/tags/$TAG")"
          test "$(jq -r '.object.sha' <<<"$tag_json")" = "$OPS_SHA"
          mkdir -p /tmp/release-readback
          gh release download "$TAG" --repo "$OPS_REPO" --pattern "$ASSET" --dir /tmp/release-readback --clobber
          test "$(sha256sum "/tmp/release-readback/$ASSET" | awk '{print $1}')" = "$local_sha"
          test "$(stat -c '%s' "/tmp/release-readback/$ASSET")" = "$local_size"
          printf 'TAG=%s\nSOURCE_SHA=%s\nASSET=%s\nBYTES=%s\nSHA256=%s\nASSET_ID=%s\n' \
            "$TAG" "$OPS_SHA" "$ASSET" "$local_size" "$local_sha" "$asset_id" | tee /tmp/S01_C02_121861_RELEASE_RECEIPT.txt
          echo 'S01_C02_121861_FORMAL_RELEASE=PASS'

      - name: Upload public-safe release receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 Node24
        with:
          name: s01-c02-121861-formal-release-${{ github.run_id }}
          path: /tmp/S01_C02_121861_RELEASE_RECEIPT.txt
          if-no-files-found: error
          retention-days: 14
