name: Diagnose core-updates S01-C02 1.21.865

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-selftest-current.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          repository: llhzx2018/core-updates
          ref: 3b2beae21c4b7ae4d3cef3f39b234378763797bd
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          path: core-updates
          persist-credentials: false

      - name: Exact source proof
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C core-updates rev-parse HEAD)" = '3b2beae21c4b7ae4d3cef3f39b234378763797bd'
          manifest='core-updates/projects/S01-C02.json'
          grep -Fq '"target_version": "1.21.865"' "$manifest"
          grep -Fq '"1.21.864"' "$manifest"
          grep -Fq '"release_tag": "v1.21.865"' "$manifest"
          grep -Fq '"asset_bytes": 3385800' "$manifest"
          grep -Fq 'b1415f602af60671664f7655f0cc6d40500548b77b1b4ddd7dc3e559c3625f98' "$manifest"
          grep -Fq '"runtime_file_count": 943' "$manifest"
          grep -Fq 'ef723f566c1ffc411c6b406f3de7aa3d39685e644a8029e7d340d8459c91d3b7' "$manifest"
          echo 'CORE_UPDATES_121865_EXACT_SOURCE=PASS'

      - name: Manifest Contract Audit with full output
        shell: bash
        run: |
          set -o pipefail
          cd core-updates
          python3 scripts/check_manifest_contract.py 2>&1 | tee /tmp/manifest-audit.log
          status=${PIPESTATUS[0]}
          echo "MANIFEST_AUDIT_EXIT=$status"
          exit "$status"

      - name: PHP syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          cd core-updates
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          echo 'CORE_UPDATES_121865_PHP_SYNTAX=PASS'

      - name: Update Core regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd core-updates
          php update-core/php/tests/run.php
          echo 'CORE_UPDATES_121865_REGRESSION=PASS'
          echo 'CORE_UPDATES_121865_DISTRIBUTION_DIAGNOSTIC=PASS'
