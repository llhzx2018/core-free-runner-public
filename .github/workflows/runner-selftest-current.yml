name: S01 C02 1.21.867 V6 R1 Runtime Formal Release

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-selftest-current.yml'

permissions:
  contents: read

concurrency:
  group: s01-c02-121867-v6-r1-release-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  formal-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPS_REPO: llhzx2018/vf-tools-ops
      OPS_SHA: 04ce86a5e371074c1b6e13e7ee648736861f6abd
      VERSION: 1.21.867
      TAG: v1.21.867
      ASSET: vf-tools-ops_V1.21.867.zip
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Checkout exact V6 R1 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 04ce86a5e371074c1b6e13e7ee648736861f6abd
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: ops
          persist-credentials: false

      - name: Verify exact release identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${GH_TOKEN:-}"
          test "$(git -C ops rev-parse HEAD)" = "$OPS_SHA"
          test "$(cat ops/VERSION)" = "$VERSION"
          grep -Fq 'Version: 1.21.867' ops/vf-ops.php
          grep -Fq "VF_OPS_VERSION', '1.21.867'" ops/vf-ops.php
          grep -Fq "VF_OPS_ROUND', 'S01-MATURE-ADMIN-V6-R1-SHELL-FOUNDATION'" ops/vf-ops.php
          if gh release view "$TAG" --repo "$OPS_REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists" >&2
            exit 1
          fi
          if gh api "repos/$OPS_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists" >&2
            exit 1
          fi
          echo 'S01_C02_121867_RELEASE_IDENTITY=PASS'

      - name: Re-run V6 R1 source contract
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l ops/vf-ops.php
          php -l ops/includes/views/admin-shell-tabs-parts/02-shell-navigation.php
          php -l ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php
          php ops/tests/s01-v6-r1-shell-foundation-contract.php
          echo 'S01_C02_121867_V6_R1_SOURCE=PASS'

      - name: Stage Runtime Authority only
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf stage dist
          mkdir -p stage/vf-ops dist
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, shutil
          src=Path('ops'); dst=Path('stage/vf-ops')
          banned_segments={'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'}
          banned_ext={'.sql','.sqlite','.sqlite3','.db','.log','.zip','.tar','.gz','.bak','.tmp'}
          allowed_root={'vf-ops.php','uninstall.php'}
          allowed_dirs={'includes','assets','languages','config'}
          selected=[]
          for path in sorted(src.rglob('*')):
              if path.is_symlink():
                  rel=path.relative_to(src).as_posix()
                  parts=[p.lower() for p in Path(rel).parts]
                  runtime=(len(parts)==1 and rel in allowed_root) or (len(parts)>1 and parts[0] in allowed_dirs)
                  if runtime: raise SystemExit(f'runtime symlink forbidden: {rel}')
                  continue
              if not path.is_file(): continue
              rel=path.relative_to(src).as_posix(); parts=list(Path(rel).parts); low=[p.lower() for p in parts]
              if any(p in banned_segments for p in low): continue
              if path.suffix.lower() in banned_ext: continue
              if any(p.startswith('.env') for p in low) or low[-1]=='wp-config.php': continue
              runtime=(len(parts)==1 and rel in allowed_root) or (len(parts)>1 and parts[0] in allowed_dirs)
              if not runtime: continue
              target=dst/rel; target.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(path,target); selected.append(rel)
          if 'vf-ops.php' not in selected or not selected: raise SystemExit('runtime stage incomplete')
          hashes={rel:hashlib.sha256((dst/rel).read_bytes()).hexdigest() for rel in sorted(selected)}
          canonical=b''.join(rel.encode()+b'\x00'+hashes[rel].encode()+b'\n' for rel in sorted(hashes))
          fp=hashlib.sha256(canonical).hexdigest()
          Path('/tmp/runtime_count').write_text(str(len(hashes)))
          Path('/tmp/runtime_fingerprint').write_text(fp)
          print(f'RUNTIME_FILE_COUNT={len(hashes)}')
          print(f'RUNTIME_FINGERPRINT_SHA256={fp}')
          PY
          test -f stage/vf-ops/vf-ops.php
          test "$(find stage/vf-ops -type l | wc -l)" = '0'
          echo 'S01_C02_121867_RUNTIME_STAGE=PASS'

      - name: Validate staged Runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'Version: 1.21.867' stage/vf-ops/vf-ops.php
          while IFS= read -r -d '' phpfile; do php -l "$phpfile" >/dev/null; done < <(find stage/vf-ops -type f -name '*.php' -print0)
          ! find stage/vf-ops -type f | grep -E '/(\.git|\.github|tests?|docs?|evidence|private|tmp|temp|cache|logs?)/'
          echo 'S01_C02_121867_RUNTIME_VALIDATION=PASS'

      - name: Build and verify WordPress UPDATE ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          (cd stage && zip -X -q -r "../dist/$ASSET" vf-ops)
          test -s "dist/$ASSET"
          unzip -Z1 "dist/$ASSET" > /tmp/zip.list
          test "$(grep -c '^vf-ops/vf-ops.php$' /tmp/zip.list)" = '1'
          test "$(awk -F/ 'NF && $1!="vf-ops" {bad++} END{print bad+0}' /tmp/zip.list)" = '0'
          ! grep -q '^vf-ops/vf-ops/' /tmp/zip.list
          ! grep -Eqi '(^|/)(\.git|\.github|tests?|docs?|evidence|private|tmp|temp|cache|logs?)(/|$)' /tmp/zip.list
          rm -rf /tmp/vf-ops-readback && mkdir -p /tmp/vf-ops-readback
          unzip -q "dist/$ASSET" -d /tmp/vf-ops-readback
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('/tmp/vf-ops-readback/vf-ops')
          files=sorted(p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file())
          hashes={rel:hashlib.sha256((root/rel).read_bytes()).hexdigest() for rel in files}
          canonical=b''.join(rel.encode()+b'\x00'+hashes[rel].encode()+b'\n' for rel in files)
          fp=hashlib.sha256(canonical).hexdigest()
          assert len(hashes)==int(Path('/tmp/runtime_count').read_text())
          assert fp==Path('/tmp/runtime_fingerprint').read_text().strip()
          print('ZIP_RUNTIME_SNAPSHOT=PASS')
          PY
          sha256sum "dist/$ASSET" | tee /tmp/asset.sha256
          stat -c '%s' "dist/$ASSET" | tee /tmp/asset.bytes
          echo 'S01_C02_121867_PACKAGE_GATE=PASS'

      - name: Create formal v1.21.867 release
        shell: bash
        run: |
          set -Eeuo pipefail
          count="$(cat /tmp/runtime_count)"
          fingerprint="$(cat /tmp/runtime_fingerprint)"
          cat > /tmp/release-notes.md <<EOF
          S01 Mature Admin V6 · R1 Shell Foundation.
          Exact main source: $OPS_SHA
          Structural R1 Gate: 34692273857 PASS
          Final 1.21.867 Gate: 34692385350 PASS
          Runtime package root: vf-ops/
          Runtime files: $count
          Runtime fingerprint SHA256: $fingerprint

          R1 replaces the canonical WordPress admin shell with a server-rendered PHP V6 shell and shared six-domain navigation. Old shell presentation layers and the canonical DOM-rewriting shell adapter leave the live chain. Business page internals remain intentionally unmigrated until R2-R4; Tools keeps a bounded compatibility bridge until R2.

          Schema remains 6.0.0; physical locator remains vf-ops/vf-ops.php; locator_cutover remains false.
          Production: NOT_RUN
          Static: NOT_RUN
          Online/User visual acceptance: NOT_RUN until installed and reviewed in real WordPress.
          EOF
          gh release create "$TAG" "dist/$ASSET#VF Tools Ops $VERSION Runtime-only WordPress update ZIP" \
            --repo "$OPS_REPO" --target "$OPS_SHA" --title "VF Tools Ops V$VERSION" --notes-file /tmp/release-notes.md
          echo 'S01_C02_121867_RELEASE_CREATE=PASS'

      - name: Independent release and asset readback
        shell: bash
        run: |
          set -Eeuo pipefail
          release_json="$(gh api "repos/$OPS_REPO/releases/tags/$TAG")"
          test "$(jq -r '.tag_name' <<<"$release_json")" = "$TAG"
          test "$(jq -r '.draft' <<<"$release_json")" = 'false'
          test "$(jq -r '.prerelease' <<<"$release_json")" = 'false'
          asset_id="$(jq -r --arg name "$ASSET" '.assets[] | select(.name==$name) | .id' <<<"$release_json")"
          asset_size="$(jq -r --arg name "$ASSET" '.assets[] | select(.name==$name) | .size' <<<"$release_json")"
          asset_digest="$(jq -r --arg name "$ASSET" '.assets[] | select(.name==$name) | .digest // empty' <<<"$release_json")"
          published_at="$(jq -r '.published_at' <<<"$release_json")"
          local_size="$(cat /tmp/asset.bytes)"; local_sha="$(awk '{print $1}' /tmp/asset.sha256)"
          test -n "$asset_id"; test "$asset_size" = "$local_size"
          if [ -n "$asset_digest" ]; then test "$asset_digest" = "sha256:$local_sha"; fi
          test "$(jq -r '.object.sha' <<<"$(gh api "repos/$OPS_REPO/git/ref/tags/$TAG")")" = "$OPS_SHA"
          rm -rf /tmp/release-readback && mkdir -p /tmp/release-readback
          gh release download "$TAG" --repo "$OPS_REPO" --pattern "$ASSET" --dir /tmp/release-readback --clobber
          test "$(sha256sum "/tmp/release-readback/$ASSET" | awk '{print $1}')" = "$local_sha"
          test "$(stat -c '%s' "/tmp/release-readback/$ASSET")" = "$local_size"
          unzip -Z1 "/tmp/release-readback/$ASSET" | grep -q '^vf-ops/vf-ops.php$'
          printf 'TAG=%s\nSOURCE_SHA=%s\nASSET=%s\nASSET_ID=%s\nBYTES=%s\nSHA256=%s\nRUNTIME_FILE_COUNT=%s\nRUNTIME_FINGERPRINT_SHA256=%s\nPUBLISHED_AT=%s\n' \
            "$TAG" "$OPS_SHA" "$ASSET" "$asset_id" "$local_size" "$local_sha" "$(cat /tmp/runtime_count)" "$(cat /tmp/runtime_fingerprint)" "$published_at" | tee /tmp/S01_C02_121867_RELEASE_RECEIPT.txt
          echo 'S01_C02_121867_FORMAL_RELEASE=PASS'

      - name: Upload public-safe release receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 Node24
        with:
          name: s01-c02-121867-v6-r1-release-${{ github.run_id }}
          path: /tmp/S01_C02_121867_RELEASE_RECEIPT.txt
          if-no-files-found: error
          retention-days: 14
