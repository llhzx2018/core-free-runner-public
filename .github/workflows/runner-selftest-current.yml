name: Public Runner Current Self Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths: ['.github/workflows/runner-selftest-current.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-runner-current-selftest-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout public runner control repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Hosted runner allocation proof
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "RUNNER_OS=$RUNNER_OS"
          uname -a
          php -v || true
          python3 --version
          echo 'PUBLIC_RUNNER_ALLOCATION=PASS'

      - name: Verify main push came from merged PR
        if: github.event_name == 'push'
        shell: bash
        env:
          VF_PUSH_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          python3 scripts/check_main_push_provenance.py \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$VF_PUSH_SHA"
          echo 'MAIN_PUSH_PROVENANCE=PASS' >> "$GITHUB_ENV"

      - name: Verify Git Estate anti-drift
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: python3 scripts/check_estate_anti_drift.py --live

      - name: Build public-safe receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/runner
          PROVENANCE="${MAIN_PUSH_PROVENANCE:-NOT_APPLICABLE}"
          cat > evidence/runner/PUBLIC_RUNNER_CURRENT.txt <<EOF
          PUBLIC_RUNNER_ALLOCATION=PASS
          ESTATE_ANTI_DRIFT=PASS
          MAIN_PUSH_PROVENANCE=$PROVENANCE
          RUNNER_REPOSITORY=llhzx2018/core-free-runner-public
          PRIVATE_SOURCE_USED=GOV_DOC_AUTHORITY_ONLY
          SECRET_USED=REGISTERED_PRIVATE_READ_CAPABILITY
          PRIVATE_SOURCE_PERSISTED=NO
          MAIN_WRITE=NO
          USER_MANUAL_EXECUTION_REQUIRED=NO
          EOF

      - name: Upload public-safe receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 Node24
        with:
          name: public-runner-current-selftest-${{ github.run_id }}
          path: evidence/runner/PUBLIC_RUNNER_CURRENT.txt
          if-no-files-found: error
          retention-days: 14

  p05-mobile-readability-browser:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'test/p05-mobile-readability-browser-v125-20260903'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vf_seo
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vf_seo
      VF_MASTER_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NODE_ENV: test
      P05_EXACT_SHA: c0803dc05780b302d760a212fcbe4b69096bc41b
      P05_EXACT_TREE: 25586b8612d4b9ab3cd0a818aeac0f1bf3c3ce24
    steps:
      - name: Checkout exact P05 mobile readability candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.P05_EXACT_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 2

      - name: Verify exact candidate and scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_EXACT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$P05_EXACT_TREE"
          test "$(cat VERSION)" = '1.2.4'
          git diff --check HEAD^ HEAD
          test "$(git diff --name-only HEAD^ HEAD)" = 'src/client/product-site-views.css'
          grep -Fq 'v1.2.5 readability baseline' src/client/product-site-views.css
          grep -Fq 'v1.2.5 mobile readability closure' src/client/product-site-views.css
          echo P05_MOBILE_READABILITY_EXACT_SOURCE=PASS

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm

      - name: Build exact candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          npm run typecheck
          npm run build
          npm run migrate
          VF_ADMIN_USERNAME=owner VF_ADMIN_PASSWORD='Readability-2026!' npm run bootstrap:admin

      - name: Real Chrome desktop and mobile first-viewport journey
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p05-mobile-readability
          PORT=18225 VF_SECURE_COOKIES=false VF_REQUIRE_HTTPS=false node dist/src/server/index.js >/tmp/p05-mobile-readability/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import base64,json,shutil,subprocess,sys,time,urllib.request,urllib.error,pathlib
          BASE='http://127.0.0.1:18225'; DP=9541; PASSWORD='Readability-2026!'; OUT=pathlib.Path('/tmp/p05-mobile-readability')
          def fail(msg): print('P05_MOBILE_READABILITY_BROWSER=FAIL '+msg,file=sys.stderr); raise SystemExit(1)
          def http(m,u,p=None,timeout=30):
              d=None if p is None else json.dumps(p).encode(); r=urllib.request.Request(u,data=d,method=m)
              if d is not None:r.add_header('Content-Type','application/json')
              try:
                  with urllib.request.urlopen(r,timeout=timeout) as x:
                      raw=x.read().decode(); return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e: fail(f'http {e.code} {u}: {e.read().decode(errors="replace")[:500]}')
          def wait_http(u):
              for _ in range(300):
                  try:
                      with urllib.request.urlopen(u,timeout=1) as r:
                          if r.status<500:return
                  except Exception:time.sleep(.1)
              fail('not ready '+u)
          def wd(m,p,d=None):
              r=http(m,f'http://127.0.0.1:{DP}{p}',d); v=r.get('value')
              if isinstance(v,dict) and v.get('error'):fail(f"webdriver {v.get('error')}: {v.get('message')}")
              return r
          driver=shutil.which('chromedriver'); chrome=shutil.which('google-chrome') or shutil.which('google-chrome-stable')
          if not driver or not chrome:fail('Chrome unavailable')
          proc=subprocess.Popen([driver,f'--port={DP}','--allowed-ips=127.0.0.1'],stdout=subprocess.DEVNULL,stderr=subprocess.STDOUT); s=''
          try:
              wait_http(BASE+'/api/health'); wait_http(f'http://127.0.0.1:{DP}/status')
              r=wd('POST','/session',{'capabilities':{'alwaysMatch':{'browserName':'chrome','goog:chromeOptions':{'binary':chrome,'args':['--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--window-size=1440,1000']}}}})
              s=str(r['value'].get('sessionId') or r.get('sessionId') or '')
              if not s:fail('missing webdriver session')
              def sv(m,p,d=None):return wd(m,f'/session/{s}{p}',d)['value']
              def js(code):return sv('POST','/execute/sync',{'script':code,'args':[]})
              def content():return str(js("return document.querySelector('.p05v2-content')?.innerText || ''"))
              def wait(fn,label,n=400):
                  last=None
                  for _ in range(n):
                      try:
                          last=fn()
                          if last:return last
                      except Exception as e:last=repr(e)
                      time.sleep(.1)
                  fail(f'timeout {label}: {last!r}')
              def find(css):return sv('POST','/element',{'using':'css selector','value':css})['element-6066-11e4-a52e-4f735466cecf']
              def send(e,v):sv('POST',f'/element/{e}/clear',{});sv('POST',f'/element/{e}/value',{'text':v,'value':list(v)})
              def click(label):return bool(js('''const x=%s;const b=[...document.querySelectorAll('button')].find(e=>e.textContent.trim()===x);if(!b||b.disabled)return false;b.click();return true;'''%json.dumps(label,ensure_ascii=False)))
              def px(css):
                  v=js('''const e=document.querySelector(%s);if(!e)return null;return parseFloat(getComputedStyle(e).fontSize);'''%json.dumps(css)); return None if v is None else float(v)
              def require_px(css,minpx,label):
                  v=px(css)
                  if v is None or v+1e-6<minpx:fail(f'{label} font-size {v} < {minpx}')
                  print(f'P05_MOBILE_READABILITY_{label}={v}px')
              def shot(name):(OUT/name).write_bytes(base64.b64decode(sv('GET','/screenshot')))
              sv('POST','/url',{'url':BASE+'/'})
              wait(lambda:js("return !!document.querySelector(\"input[autocomplete='username']\")"),'login')
              send(find("input[autocomplete='username']"),'owner'); send(find("input[autocomplete='current-password']"),PASSWORD); click('登录') or fail('login')
              wait(lambda:'载入演示数据 →' in content(),'empty portfolio'); click('载入演示数据 →') or fail('demo load')
              wait(lambda:all(x in content() for x in ['Kewaro Start','Kewaro Guide','WordPress Lab']),'portfolio')
              for css,minimum,label in [('.p05v2-nav button',14,'DESKTOP_NAV'),('.p05v2-header h1',30,'DESKTOP_H1'),('.p05v2-header p',14,'DESKTOP_HEADER_COPY'),('.p05v2-site-main strong',16,'DESKTOP_SITE_TITLE'),('.p05v2-fact > strong',18,'DESKTOP_FACT_VALUE'),('.p05v2-site-action button',13,'DESKTOP_ACTION_BUTTON')]: require_px(css,minimum,label)
              desktop=js("return {sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth,sidebar:document.querySelector('.p05v2-sidebar')?.getBoundingClientRect().width||0}")
              if desktop['sw']>desktop['cw']+1 or desktop['sidebar']<255:fail('desktop layout '+repr(desktop))
              shot('desktop-portfolio.png')
              click('进入网站 →') or fail('enter site')
              wait(lambda:js("return (document.querySelector('.p05v2-header h1')?.textContent||'').trim() !== '网站组合'"),'site overview')
              click('关键词') or fail('keywords nav')
              wait(lambda:js("return !!document.querySelector('.p05v2-object-workspace')"),'keyword workspace')
              require_px('.p05v2-object-list button strong',13,'DESKTOP_OBJECT_TITLE')
              shot('desktop-keywords.png')
              sv('POST','/window/rect',{'x':0,'y':0,'width':390,'height':844}); time.sleep(.6); js('window.scrollTo(0,0); return true')
              mobile=js("""const s=document.querySelector('.p05v2-sidebar').getBoundingClientRect();const c=document.querySelector('.p05v2-content').getBoundingClientRect();const h=document.querySelector('.p05v2-header').getBoundingClientRect();const n=document.querySelector('.p05v2-nav');return {sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth,body:document.body.scrollWidth,sidebarH:s.height,contentTop:c.top,headerTop:h.top,headerBottom:h.bottom,navFont:parseFloat(getComputedStyle(document.querySelector('.p05v2-nav button')).fontSize),navDisplay:getComputedStyle(n).display,navOverflow:getComputedStyle(n).overflowX,navScroll:n.scrollWidth,navClient:n.clientWidth};""")
              if mobile['sw']>mobile['cw']+1 or mobile['body']>mobile['cw']+1:fail('mobile horizontal overflow '+repr(mobile))
              if mobile['sidebarH']>190:fail('mobile navigation too tall '+repr(mobile))
              if mobile['contentTop']>=210 or mobile['headerTop']>=230:fail('Product content not above fold '+repr(mobile))
              if mobile['headerBottom']>=600:fail('Product header consumes mobile first viewport '+repr(mobile))
              if mobile['navFont']<13:fail('mobile nav font too small '+repr(mobile))
              if mobile['navDisplay']!='flex' or mobile['navOverflow'] not in ('auto','scroll'):fail('mobile nav not horizontally reachable '+repr(mobile))
              if mobile['navScroll']<=mobile['navClient']:fail('mobile workspace navigation did not expose scrollable full set '+repr(mobile))
              shot('mobile-keywords.png')
              bool(js("const b=document.querySelector('.p05v2-portfolio');if(!b||b.disabled)return false;b.click();return true;")) or fail('mobile portfolio')
              wait(lambda:js("return (document.querySelector('.p05v2-header h1')?.textContent||'').trim() === '网站组合'"),'mobile portfolio header')
              js('window.scrollTo(0,0); return true'); time.sleep(.2)
              portfolio=js("""const h=document.querySelector('.p05v2-header').getBoundingClientRect();const r=document.querySelector('.p05v2-site-row').getBoundingClientRect();return {headerTop:h.top,rowTop:r.top,viewport:innerHeight};""")
              if portfolio['headerTop']>=230 or portfolio['rowTop']>=portfolio['viewport']:fail('mobile portfolio content not visible in first viewport '+repr(portfolio))
              shot('mobile-portfolio.png')
              print('P05_MOBILE_READABILITY_DESKTOP_OVERFLOW=0')
              print('P05_MOBILE_READABILITY_MOBILE_OVERFLOW=0')
              print('P05_MOBILE_READABILITY_CONTENT_ABOVE_FOLD=PASS')
              print('P05_MOBILE_READABILITY_BROWSER=PASS')
          finally:
              if s:
                  try:wd('DELETE',f'/session/{s}')
                  except Exception:pass
              proc.terminate()
          PY

      - name: Upload mobile readability screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p05-mobile-readability-browser-${{ github.run_id }}
          path: /tmp/p05-mobile-readability/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Read-only exact boundary
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_EXACT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$P05_EXACT_TREE"
          test -z "$(git status --porcelain)"
          echo P05_PRODUCT_SOURCE_WRITE=0
          echo P05_RELEASE_WRITE=0
          echo P05_PRODUCTION_WRITE=0
