name: Diagnose core-updates S01-C02 1.21.869 V6 R3

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-selftest-current.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          repository: llhzx2018/core-updates
          ref: 2e3fb888fe3167180c503f5b75f9d0f2b2f75add
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          path: core-updates
          persist-credentials: false

      - name: Exact manifest identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C core-updates rev-parse HEAD)" = '2e3fb888fe3167180c503f5b75f9d0f2b2f75add'
          manifest='core-updates/projects/S01-C02.json'
          grep -Fq '"target_version": "1.21.869"' "$manifest"
          grep -Fq '"1.21.868"' "$manifest"
          grep -Fq '"release_tag": "v1.21.869"' "$manifest"
          grep -Fq '"asset_bytes": 3398170' "$manifest"
          grep -Fq '55e18598f54320ed3e885bc22d35ddb792f6b9aaf0edf756f3c563447c5cdaf7' "$manifest"
          grep -Fq '"runtime_file_count": 946' "$manifest"
          grep -Fq '5b61dfe9758eb8f6637d52d589d5bf20a72fcf75b423ed3c889414de41e98106' "$manifest"
          echo 'CORE_UPDATES_121869_EXACT_MANIFEST=PASS'

      - name: Manifest Contract Audit
        shell: bash
        run: |
          set -Eeuo pipefail
          cd core-updates
          python3 scripts/check_manifest_contract.py
          echo 'CORE_UPDATES_121869_MANIFEST_AUDIT=PASS'

      - name: PHP syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          cd core-updates
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          echo 'CORE_UPDATES_121869_PHP_SYNTAX=PASS'

      - name: Update Core regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd core-updates
          php update-core/php/tests/run.php
          echo 'CORE_UPDATES_121869_REGRESSION=PASS'
          echo 'CORE_UPDATES_121869_DISTRIBUTION_DIAGNOSTIC=PASS'
