name: S01 C02 1.21.861 Reference Samples Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-selftest-current.yml'

permissions:
  contents: read

concurrency:
  group: s01-c02-121861-reference-samples-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact Ops preview candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 2e40306674c5fdac99a76a5bf7ce76249ac21182
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: ops
          persist-credentials: false

      - name: Exact source and changed-file fence
        shell: bash
        run: |
          set -Eeuo pipefail
          OPS_BASE='80385c532da2e91117bc3faace86d5e260464817'
          OPS_HEAD='2e40306674c5fdac99a76a5bf7ce76249ac21182'
          test "$(git -C ops rev-parse HEAD)" = "$OPS_HEAD"
          cat > /tmp/ops.expected <<'EOF'
          VERSION
          assets/css/current/admin-s01-preview-samples-r5.css
          includes/admin-v13/views/acceptance_overview.php
          includes/s01/tool-workbench.php
          includes/views/admin-style-helpers/admin-s01-uiux-polish.php
          tests/s01-121861-reference-samples-contract.php
          vf-ops.php
          EOF
          git -C ops diff --name-only "$OPS_BASE"...HEAD | sort > /tmp/ops.actual
          diff -u <(sort /tmp/ops.expected) /tmp/ops.actual
          echo 'S01_C02_121861_EXACT_SCOPE=PASS'

      - name: Release identity semantic fence
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import pathlib, subprocess
          base = '80385c532da2e91117bc3faace86d5e260464817'
          old = subprocess.check_output(['git','-C','ops','show',f'{base}:vf-ops.php'], text=True)
          new = pathlib.Path('ops/vf-ops.php').read_text()
          expected = old.replace('Version: 1.21.860','Version: 1.21.861')
          expected = expected.replace("VF_OPS_VERSION', '1.21.860'","VF_OPS_VERSION', '1.21.861'")
          expected = expected.replace("VF_OPS_ROUND', 'S01-DEFAULT-WORKBENCH-VISIBLE-UI-CLOSURE'","VF_OPS_ROUND', 'S01-REFERENCE-SAMPLES-TOOLS-QUALITY-R5'")
          assert new == expected, 'vf-ops.php changed outside approved identity lines'
          assert pathlib.Path('ops/VERSION').read_text().strip() == '1.21.861'
          print('S01_C02_121861_IDENTITY=PASS')
          PY

      - name: PHP syntax gate
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l ops/vf-ops.php
          php -l ops/includes/s01/tool-workbench.php
          php -l ops/includes/admin-v13/views/acceptance_overview.php
          php -l ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php
          php -l ops/tests/s01-121861-reference-samples-contract.php
          echo 'S01_C02_121861_PHP_LINT=PASS'

      - name: Two-page reference sample contract
        shell: bash
        run: |
          set -Eeuo pipefail
          php ops/tests/s01-121861-reference-samples-contract.php

      - name: Existing visible UI regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          for test in \
            ops/tests/visible-console-v2-contract.php \
            ops/tests/top-domains-visible-ui-contract.php \
            ops/tests/admin-human-language-contract.php \
            ops/tests/update-refresh-policy-current-contract.php; do
            if [ -f "$test" ]; then php "$test"; fi
          done
          echo 'S01_C02_121861_VISIBLE_REGRESSION=PASS'

      - name: UX ownership and secret fence
        shell: bash
        run: |
          set -Eeuo pipefail
          css='ops/assets/css/current/admin-s01-preview-samples-r5.css'
          ! grep -q ':root' "$css"
          ! grep -q -- '--vf-color-primary:' "$css"
          ! grep -q '\.vf-m3u8-' "$css"
          ! git -C ops diff '80385c532da2e91117bc3faace86d5e260464817'...HEAD | grep -E 'ghp_[A-Za-z0-9]|github_pat_|BEGIN (RSA |OPENSSH )?PRIVATE KEY'
          echo 'S01_C02_121861_DESIGN_OWNER_FENCE=PASS'
          echo 'S01_C02_121861_SECRET_FENCE=PASS'
          echo 'S01_C02_121861_REFERENCE_SAMPLES_GATE=PASS'
