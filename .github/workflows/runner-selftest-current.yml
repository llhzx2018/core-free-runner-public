name: Public Runner Current Self Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runner-selftest-current.yml'
      - 'requests/runner-selftest-current-*.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-runner-current-selftest
  cancel-in-progress: false

jobs:
  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout public runner control repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1

      - name: Hosted runner allocation proof
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "RUNNER_OS=$RUNNER_OS"
          uname -a
          php -v || true
          python3 --version
          echo 'PUBLIC_RUNNER_ALLOCATION=PASS'

      - name: Persist public-safe receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/runner
          cat > evidence/runner/PUBLIC_RUNNER_CURRENT.txt <<EOF
          PUBLIC_RUNNER_ALLOCATION=PASS
          RUNNER_REPOSITORY=llhzx2018/core-free-runner-public
          PRIVATE_SOURCE_USED=NO
          SECRET_USED=NO
          USER_MANUAL_EXECUTION_REQUIRED=NO
          EOF
          git config user.name 'VF Public Runner'
          git config user.email 'vf-public-runner@users.noreply.github.com'
          git add evidence/runner/PUBLIC_RUNNER_CURRENT.txt
          if git diff --cached --quiet; then
            echo 'EVIDENCE_ALREADY_CURRENT=YES'
          else
            git commit -m 'evidence(runner): public allocation PASS'
            git push origin HEAD:main
          fi
