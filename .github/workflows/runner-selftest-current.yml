name: Public Runner Current Self Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths: ['.github/workflows/runner-selftest-current.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-runner-current-selftest-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout public runner control repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Hosted runner allocation proof
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "RUNNER_OS=$RUNNER_OS"
          uname -a
          php -v || true
          python3 --version
          echo 'PUBLIC_RUNNER_ALLOCATION=PASS'

      - name: Verify main push came from merged PR
        if: github.event_name == 'push'
        shell: bash
        env:
          VF_PUSH_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          python3 scripts/check_main_push_provenance.py \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$VF_PUSH_SHA"
          echo 'MAIN_PUSH_PROVENANCE=PASS' >> "$GITHUB_ENV"

      - name: Verify Git Estate anti-drift
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: python3 scripts/check_estate_anti_drift.py --live

      - name: Build public-safe receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/runner
          PROVENANCE="${MAIN_PUSH_PROVENANCE:-NOT_APPLICABLE}"
          cat > evidence/runner/PUBLIC_RUNNER_CURRENT.txt <<EOF
          PUBLIC_RUNNER_ALLOCATION=PASS
          ESTATE_ANTI_DRIFT=PASS
          MAIN_PUSH_PROVENANCE=$PROVENANCE
          RUNNER_REPOSITORY=llhzx2018/core-free-runner-public
          PRIVATE_SOURCE_USED=GOV_DOC_AUTHORITY_ONLY
          SECRET_USED=REGISTERED_PRIVATE_READ_CAPABILITY
          PRIVATE_SOURCE_PERSISTED=NO
          MAIN_WRITE=NO
          USER_MANUAL_EXECUTION_REQUIRED=NO
          EOF

      - name: Upload public-safe receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 Node24
        with:
          name: public-runner-current-selftest-${{ github.run_id }}
          path: evidence/runner/PUBLIC_RUNNER_CURRENT.txt
          if-no-files-found: error
          retention-days: 14

  p05-v125-production-closure-verify:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'write/p05-v125-production-closure-20260904'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PRODUCT_BASE: e37db145111366a29fc91c33348216a7af79ae8c
      PRODUCT_HEAD: 3ca886ac766b3483d6f7e66d6fd0ab7680d8f636
    steps:
      - name: Checkout exact Product closure branch read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.PRODUCT_HEAD }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify exact three-file Production closure truth
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_HEAD"
          test "$(git rev-parse HEAD^)" = "$PRODUCT_BASE"
          test "$(cat VERSION)" = '1.2.5'
          expected=$'VF_PROJECT.json\ndocs/authority/RELEASE_V1.2.5_PRODUCTION_CLOSURE.md\ndocs/handoff/CURRENT_STATE.md'
          actual="$(git diff --name-only "$PRODUCT_BASE" "$PRODUCT_HEAD")"
          test "$actual" = "$expected"
          git diff --check "$PRODUCT_BASE" "$PRODUCT_HEAD"
          python3 - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('VF_PROJECT.json').read_text())
          assert v['status']=='V1.2.5_RELEASED / PRODUCTION_CLOSED'
          assert v['production_version']=='1.2.5'
          assert v['formal_release']=='v1.2.5'
          assert v['formal_release_id']==382166024
          assert v['formal_release_asset_id']==543015825
          assert v['deployment_readiness']=='V1.2.5_PRODUCTION_CLOSED'
          assert v['next_action']=='V1.2.5_PRODUCTION_CLOSED → L2_PRODUCT_OPTIMIZATION'
          c=Path('docs/authority/RELEASE_V1.2.5_PRODUCTION_CLOSURE.md').read_text()
          assert 'Status: `RELEASED / PRODUCTION CLOSED`' in c
          assert '33779780645 / 100730326851' in c
          s=Path('docs/handoff/CURRENT_STATE.md').read_text()
          assert 'Current Formal Release: v1.2.5 · RELEASED / PRODUCTION CLOSED' in s
          assert 'Production: v1.2.5 · MACHINE + OWNER VERIFIED' in s
          PY
          test -z "$(git status --porcelain)"
          echo P05_V125_CLOSURE_SCOPE=PASS
          echo P05_PRODUCT_SOURCE_WRITE=0
          echo P05_RELEASE_WRITE=0
          echo P05_PRODUCTION_WRITE=0
