name: Public Runner Current Self Test

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/runner-selftest-current.yml']

permissions:
  contents: read

jobs:
  selftest:
    if: github.event_name == 'pull_request' && github.head_ref == 'tmp/p05-v124-closure-docs-build-20260903'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout public runner control repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Construct exact P05 v1.2.4 Production Closure docs branch
        env:
          VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VF_RELEASE_WRITE_TOKEN"
          rm -rf /tmp/vf-seo
          git clone --quiet "https://x-access-token:${VF_RELEASE_WRITE_TOKEN}@github.com/llhzx2018/vf-seo.git" /tmp/vf-seo
          cd /tmp/vf-seo
          git fetch --quiet origin docs/v124-production-closure-20260903
          git checkout --quiet -B docs/v124-production-closure-20260903 origin/docs/v124-production-closure-20260903
          test "$(git rev-parse HEAD)" = "548257ea3d45234ebaafdeab6ab0a164c5c192a9"

          python3 - <<'PY'
          from pathlib import Path
          import json

          release_source='f752c13b44fb624924926a49197ebe9519ec3f28'
          release_tree='33c67dedfc25143c9e675c97dec903a8ef1c4134'
          engineering_main='548257ea3d45234ebaafdeab6ab0a164c5c192a9'
          full_sha='f318f75a34c1a7b0f731c0e7ab81e42846cf43aaee1b16ec38f0fd94606741c4'
          update_sha='78ef2f2682958769604b999f8edc7ac5bd9091697e2abe8645cf31621182fedd'

          def replace_first_fenced_block(path, heading, body):
              p=Path(path); s=p.read_text()
              marker=heading+'\n\n```text\n'
              assert s.count(marker)==1, (path, s.count(marker))
              start=s.index(marker)+len(marker)
              end=s.index('\n```', start)
              p.write_text(s[:start]+body+s[end:])

          readme_truth='''Project: P05 · VF SEO
Repository: llhzx2018/vf-seo
Current Formal Release: v1.2.4 · RELEASED / PRODUCTION CLOSED
Release / Tag Source: f752c13b44fb624924926a49197ebe9519ec3f28
Release Tree: 33c67dedfc25143c9e675c97dec903a8ef1c4134
Production: v1.2.4 · MACHINE_RUNTIME_READBACK_PASS
Production Readback: 33715543004 / 100523841051 · PASS
Production Runtime: PHP 8.4.24 · SQLite · VF-SEO-SCHEMA@1 / 1 · DATABASE READY · PROCESS READY
Production Root / Legacy Bridge: HTTP 200 / legacy bridge 404 · PASS
Atomic Upgrade Gate: 33688237965 / 100440700253 · PASS · v1.2.3 → v1.2.4
Atomic Publication: 33688475774 / 100441463821 · PASS
Online Update Discovery: 33715282219 / 100523053944 · AVAILABLE + VERIFIED
Current Engineering Main: 548257ea3d45234ebaafdeab6ab0a164c5c192a9
Engineering State: UNRELEASED · PR #211 v1.2.5 readability CSS is on main but NOT in v1.2.4 Release/Production
Latest Engineering PR: #211 · MERGED · UNRELEASED
VERSION: 1.2.4
Schema: VF-SEO-SCHEMA@1 / 1
Default Database: SQLite
Next Action: keep v1.2.4 Production frozen; handle v1.2.5 readability release as a separate future closure'''
          replace_first_fenced_block('README.md','## Current Truth',readme_truth)

          state_truth='''Current Formal Release: v1.2.4 · RELEASED / PRODUCTION CLOSED
Release / Tag Source: f752c13b44fb624924926a49197ebe9519ec3f28
Release Tree: 33c67dedfc25143c9e675c97dec903a8ef1c4134
Formal FULL: VF_SEO_V1.2.4_FULL.zip · Asset 541815708 · 357053 bytes · SHA-256 f318f75a34c1a7b0f731c0e7ab81e42846cf43aaee1b16ec38f0fd94606741c4
Production: v1.2.4 · MACHINE_RUNTIME_READBACK_PASS
Production Machine Readback: 33715543004 / 100523841051 · PASS
Production Runtime: PHP 8.4.24 · SQLite · Schema 1 · DATABASE READY · PROCESS READY
Production Root / Legacy Bridge: HTTP 200 / 404 · PASS
Atomic Upgrade Gate: 33688237965 / 100440700253 · PASS
Atomic UPDATE: VF_SEO_V1.2.4_UPDATE.zip · Asset 541819551 · 789778 bytes · SHA-256 78ef2f2682958769604b999f8edc7ac5bd9091697e2abe8645cf31621182fedd
Atomic Publication: 33688475774 / 100441463821 · PASS
Online Discovery Readback: 33715282219 / 100523053944 · AVAILABLE + VERIFIED
Current Engineering Main: 548257ea3d45234ebaafdeab6ab0a164c5c192a9
Engineering State: MAIN_AHEAD_OF_PRODUCTION · PR #211 v1.2.5 readability CSS merged, UNRELEASED / NOT_DEPLOYED
Schema: VF-SEO-SCHEMA@1 / 1
Release Authorization: NONE_OPEN
Production Authorization: NONE_OPEN
Next Action: V1.2.4_PRODUCTION_CLOSED → future v1.2.5 readability release handled separately'''
          replace_first_fenced_block('docs/handoff/CURRENT_STATE.md','# P05 · VF SEO · Current State',state_truth)

          p=Path('docs/handoff/CURRENT_STATE.md'); s=p.read_text()
          anchor='## Post-release Engineering Current Truth\n'
          assert s.count(anchor)==1
          closure_section='''## v1.2.4 Production Closure\n\nFormal v1.2.4 Release is closed at exact Release Source `f752c13b44fb624924926a49197ebe9519ec3f28` / tree `33c67dedfc25143c9e675c97dec903a8ef1c4134`. The deterministic FULL asset is `VF_SEO_V1.2.4_FULL.zip` (asset `541815708`, `357053` bytes, SHA-256 `f318f75a34c1a7b0f731c0e7ab81e42846cf43aaee1b16ec38f0fd94606741c4`). Atomic v1.2.3 → v1.2.4 upgrade Gate `33688237965 / 100440700253` passed actual upgrade, data preservation, idempotence, rollback, interruption recovery, browser single-PHP and reverse-proxy same-origin. Atomic publication `33688475774 / 100441463821` published the sealed UPDATE asset `541819551` (`789778` bytes / SHA-256 `78ef2f2682958769604b999f8edc7ac5bd9091697e2abe8645cf31621182fedd`).\n\nThe exact v1.2.3 formal updater client then performed a credentialed online-discovery readback using the established `VF_PRIVATE_READ_TOKEN` path: `33715282219 / 100523053944 · PASS`, returning `AVAILABLE` for v1.2.4 and `VERIFIED` for the real UPDATE package. A separate read-only Production probe `33715543004 / 100523841051 · PASS` read `https://seo.kewaro.com/api/health` as v1.2.4 / Schema 1 / SQLite / PHP 8.4.24 / DATABASE READY / PROCESS READY; root returned HTTP 200 and the retired v1.2.2 bridge returned 404. That probe performed `Production write = 0`. The exact deployment mechanism is not inferred from readback alone.\n\nEngineering `main` is now intentionally ahead at `548257ea3d45234ebaafdeab6ab0a164c5c192a9` because PR #211 merged an Owner-visible readability CSS change intended for future v1.2.5. That CSS is **not** part of the immutable v1.2.4 Release Source and is **not** claimed as deployed. Any older statements below that say Production remains v1.2.3 are historical pre-v1.2.4 engineering notes and are superseded for Release/Production truth by this closure section and `docs/authority/RELEASE_V1.2.4_PRODUCTION_CLOSURE.md`.\n\n'''
          s=s.replace(anchor,closure_section+anchor,1)
          p.write_text(s)

          p=Path('CHANGELOG.md'); s=p.read_text()
          anchor='# 变更记录\n\n'
          assert s.startswith(anchor)
          section='''## v1.2.4 · Released / Production Closed（2026-09-03）\n\n- 正式 Release Source=`f752c13b44fb624924926a49197ebe9519ec3f28` / tree=`33c67dedfc25143c9e675c97dec903a8ef1c4134`；FULL asset `541815708`，`357053` bytes，SHA-256 `f318f75a34c1a7b0f731c0e7ab81e42846cf43aaee1b16ec38f0fd94606741c4`。\n- v1.2.3 → v1.2.4 Atomic Gate `33688237965 / 100440700253` PASS；UPDATE asset `541819551`，`789778` bytes，SHA-256 `78ef2f2682958769604b999f8edc7ac5bd9091697e2abe8645cf31621182fedd`；Atomic Publication `33688475774 / 100441463821` PASS。\n- v1.2.3 正式更新客户端按既有 `VF_PRIVATE_READ_TOKEN` 路径执行 Online Discovery Readback `33715282219 / 100523053944`：v1.2.4=`AVAILABLE`，真实 UPDATE package=`VERIFIED`。\n- Production Readback `33715543004 / 100523841051` PASS：线上为 v1.2.4 / Schema 1 / SQLite / PHP 8.4.24，DATABASE/PROCESS 均 READY，根路径 HTTP 200，旧 v1.2.2 bridge=404；本 readback 无 Production 写入。\n- PR #211 的 v1.2.5 readability CSS 已进入后续 Engineering main=`548257ea3d45234ebaafdeab6ab0a164c5c192a9`，但不属于 v1.2.4 Release/Production。下方原 `Unreleased` 条目保留发布前工程流水语义，其 Release/Production 状态由本节统一收口。\n\n'''
          if '## v1.2.4 · Released / Production Closed' not in s:
              p.write_text(anchor+section+s[len(anchor):])

          p=Path('VF_PROJECT.json'); data=json.loads(p.read_text())
          data.update({
              'status':'V1.2.4_RELEASED_PRODUCTION_CLOSED / MAIN_AHEAD_V1.2.5_READABILITY_ENGINEERING_UNRELEASED',
              'version':'1.2.4',
              'production_version':'1.2.4',
              'target_version':'1.2.4',
              'working_version':'1.2.4',
              'version_change':False,
              'formal_release':'v1.2.4',
              'formal_release_state':'RELEASED_PRODUCTION_MACHINE_READBACK_PASS',
              'formal_release_candidate_commit':'39fd625dcf79a58f7882a57c292568d76066b5a1',
              'formal_release_candidate_tree':release_tree,
              'formal_release_asset':'VF_SEO_V1.2.4_FULL.zip',
              'formal_release_asset_files':70,
              'formal_release_asset_bytes':357053,
              'formal_release_asset_sha256':full_sha,
              'runtime_recovery_candidate':'V1.2.4_ATOMIC_R1_PASS_CLOSED',
              'runtime_recovery_release':'RELEASED_V1.2.4',
              'production_source_upload':'DEPLOYMENT_METHOD_NOT_ASSERTED / MACHINE_READBACK_CONFIRMED_V1.2.4',
              'production_runtime_acceptance':'MACHINE_HEALTH_READBACK_V1.2.4_PASS / OWNER_OBSERVED_V1.2.4_SCREENSHOT_REFERENCED_BY_PR_211',
              'production_deployment':'DEPLOYED_V1.2.4_MACHINE_READBACK_VERIFIED',
              'working_branch':'main',
              'owner_real_use_review':'V1.2.4_OWNER_OBSERVED_SCREENSHOT_REFERENCED_BY_PR_211 / MACHINE_RUNTIME_READBACK_PASS',
              'owner_real_use_pass':'PASS / MACHINE_RUNTIME_READBACK + OWNER_OBSERVED_REFERENCE',
              'candidate_authorization':'CONSUMED_V1.2.4',
              'release_authorization':'OWNER_AUTHORIZED_V1.2.4 / EXECUTED_CLOSED',
              'production_deployment_authorization':'OBSERVED_V1.2.4_DEPLOYED / NO_NEW_PRODUCTION_WRITE_AUTHORIZED',
              'runtime_evidence':'docs/authority/RELEASE_V1.2.4_PRODUCTION_CLOSURE.md',
              'next_action':'V1.2.4_PRODUCTION_CLOSED / V1.2.5_READABILITY_ENGINEERING_UNRELEASED',
              'deployment_readiness':'V1.2.4_PRODUCTION_CLOSED / V1.2.5_ENGINEERING_UNRELEASED',
              'formal_release_id':381599672,
              'formal_release_asset_id':541815708,
          })
          data['authority']['release']='docs/authority/RELEASE_V1.2.4_PRODUCTION_CLOSURE.md'
          data['release_publication']={
              'tag':'v1.2.4','release_id':381599672,
              'release_name':'P05 · VF SEO v1.2.4 · Product Optimization Patch',
              'target_commit':release_source,'target_tree':release_tree,
              'published_at':'2026-09-02T21:59:28Z',
              'full_asset':'VF_SEO_V1.2.4_FULL.zip','full_asset_id':541815708,
              'full_files':70,'full_bytes':357053,'full_sha256':full_sha,
              'receipt_asset':'VF_SEO_V1.2.4_RELEASE_RECEIPT.txt','receipt_asset_id':541815710,
              'exact_candidate_source':'39fd625dcf79a58f7882a57c292568d76066b5a1',
              'exact_candidate_run':33687064306,'exact_candidate_job':100437992318,
              'publication_run':33688012617,'publication_job':100439992986,
              'state':'PASS_CLOSED','real_endpoint':'MACHINE_READBACK_V1.2.4',
              'production':'DEPLOYED_MACHINE_VERIFIED'
          }
          data['v1_2_4_production_closure']={
              'state':'PASS_CLOSED','release_source':release_source,'release_tree':release_tree,
              'full_asset_id':541815708,'full_asset_bytes':357053,'full_asset_sha256':full_sha,
              'atomic_gate_run':33688237965,'atomic_gate_job':100440700253,
              'update_asset_id':541819551,'update_asset_bytes':789778,'update_asset_sha256':update_sha,
              'atomic_publication_run':33688475774,'atomic_publication_job':100441463821,
              'online_discovery_run':33715282219,'online_discovery_job':100523053944,
              'online_discovery':'AVAILABLE_AND_VERIFIED',
              'production_readback_run':33715543004,'production_readback_job':100523841051,
              'production_version':'1.2.4','schema_version':1,'database_provider':'sqlite',
              'runtime':'php','php_version':'8.4.24','database':'READY','process':'READY',
              'root_http':200,'legacy_bridge_http':404,'production_write':0,
              'engineering_main_after_closure':engineering_main,
              'engineering_main_note':'PR #211 v1.2.5 readability CSS merged after v1.2.4 Release Source; unreleased and not claimed deployed'
          }
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')

          closure=Path('docs/authority/RELEASE_V1.2.4_PRODUCTION_CLOSURE.md')
          assert not closure.exists()
          closure.write_text('''# P05 · VF SEO v1.2.4 Production Closure\n\nStatus: `RELEASED / PRODUCTION_MACHINE_READBACK_PASS / CLOSED`\n\n## Formal Release Authority\n\n- Release: `v1.2.4`\n- Release ID: `381599672`\n- Release Source: `f752c13b44fb624924926a49197ebe9519ec3f28`\n- Release Tree: `33c67dedfc25143c9e675c97dec903a8ef1c4134`\n- Exact clean candidate: `39fd625dcf79a58f7882a57c292568d76066b5a1`\n- Candidate Native CI: `33687064306 / 100437992318 · PASS`\n- Formal publication: `33688012617 / 100439992986 · PASS`\n- FULL: `VF_SEO_V1.2.4_FULL.zip`\n- FULL Asset ID: `541815708`\n- FULL bytes: `357053`\n- FULL SHA-256: `f318f75a34c1a7b0f731c0e7ab81e42846cf43aaee1b16ec38f0fd94606741c4`\n- Schema: `VF-SEO-SCHEMA@1 / 1` · no migration\n\n## Atomic Update Authority\n\n- Supported path: `v1.2.3 → v1.2.4` only\n- Atomic Gate: `33688237965 / 100440700253 · PASS`\n- Verified: actual upgrade, data preservation, idempotence, rollback, hard interruption recovery, browser single-PHP, reverse-proxy HTTPS same-origin\n- Atomic Publication: `33688475774 / 100441463821 · PASS`\n- UPDATE: `VF_SEO_V1.2.4_UPDATE.zip`\n- UPDATE Asset ID: `541819551`\n- UPDATE bytes: `789778`\n- UPDATE SHA-256: `78ef2f2682958769604b999f8edc7ac5bd9091697e2abe8645cf31621182fedd`\n- Repair Asset ID: `541819555`\n- Repair SHA-256: `fbcdf51321da52f4f2b268aa305313e466df219213381e87af3bb14bfa06b162`\n\n## Online Discovery Readback\n\nThe exact updater client extracted from the sealed v1.2.3 FULL package was executed through its normal credentialed path using the established read-only `VF_PRIVATE_READ_TOKEN`.\n\n- Run / Job: `33715282219 / 100523053944 · PASS`\n- Current version: `1.2.3`\n- Target: `1.2.4`\n- Discovery: `AVAILABLE`\n- Real UPDATE package: `VERIFIED`\n- Asset identity / bytes / SHA-256: exact match to the v1.2.4 Release\n- Production write: `0`\n\n## Production Machine Readback\n\nA separate disposable read-only probe reused the proven v1.2.3 Production health contract. It did not execute an update or any Product mutation.\n\n- Run / Job: `33715543004 / 100523841051 · PASS`\n- `https://seo.kewaro.com/api/health` → `version=1.2.4`\n- Schema: `1`\n- Database provider: `sqlite`\n- Runtime: `php`\n- PHP: `8.4.24`\n- Database: `READY`\n- Process: `READY`\n- Public root: HTTP `200`\n- Retired v1.2.2 bridge: HTTP `404`\n- Probe Production write: `0`\n\nThis readback proves the observed live runtime is v1.2.4 and healthy. It does **not** infer or fabricate the exact deployment mechanism. PR #211 separately records that an Owner-observed v1.2.4 Production screenshot existed.\n\n## Engineering-main boundary\n\nAfter the v1.2.4 Release Source was frozen, PR #211 merged one Owner-visible readability CSS change to Engineering `main`, which is now `548257ea3d45234ebaafdeab6ab0a164c5c192a9`. That work is intended for future v1.2.5 and is **not part of v1.2.4 Release Source** and **not claimed as deployed**. PR #212, an attempted v1.2.5 version-lock workflow, safe-failed and closed without merge.\n\nTherefore:\n\n- Formal Release Truth: `v1.2.4`\n- Production Truth: `v1.2.4 · CLOSED`\n- Engineering main may lead Production.\n- Future v1.2.5 release/deployment requires a separate formal closure.\n''')
          PY

          python3 -m json.tool VF_PROJECT.json >/dev/null
          test "$(cat VERSION)" = "1.2.4"
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(CHANGELOG.md README.md VF_PROJECT.json docs/authority/RELEASE_V1.2.4_PRODUCTION_CLOSURE.md docs/handoff/CURRENT_STATE.md)
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done
          git diff --exit-code -- VERSION src/client/product-site-views.css
          grep -F 'Current Formal Release: v1.2.4 · RELEASED / PRODUCTION CLOSED' README.md >/dev/null
          grep -F 'Production Machine Readback: 33715543004 / 100523841051 · PASS' docs/handoff/CURRENT_STATE.md >/dev/null
          grep -F '"production_version": "1.2.4"' VF_PROJECT.json >/dev/null
          grep -F 'PR #211 v1.2.5 readability CSS' docs/authority/RELEASE_V1.2.4_PRODUCTION_CLOSURE.md >/dev/null

          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add CHANGELOG.md README.md VF_PROJECT.json docs/authority/RELEASE_V1.2.4_PRODUCTION_CLOSURE.md docs/handoff/CURRENT_STATE.md
          git commit -m 'docs: close v1.2.4 Production truth'
          git push --quiet origin HEAD:docs/v124-production-closure-20260903
          echo "P05_V124_CLOSURE_DOCS_HEAD=$(git rev-parse HEAD)"
          echo "P05_V124_CLOSURE_DOCS_FILES=${#changed[@]}"
          echo P05_V124_CLOSURE_DOCS_BUILD=PASS
          echo P05_PRODUCTION_WRITE=0
