name: S01 C01 Update Center UX Gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s01-c01-update-center-ux-13513
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout governed runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact private Theme candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          repository: llhzx2018/vf-tools-theme
          ref: d0d9193190b25af4df42fd9e5a1e445e96ae3f5a
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: product
          fetch-depth: 0
          persist-credentials: false

      - name: Exact source and five-file scope gate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          test "$(git rev-parse HEAD)" = "d0d9193190b25af4df42fd9e5a1e445e96ae3f5a"
          BASE=8c50ad91678cad78788c04ca839ba8304228499b
          mapfile -t actual < <(git diff --name-only "$BASE"..HEAD | sort)
          expected=(
            VERSION
            src/assets/css/admin/admin-update-center.css
            src/inc/update/class-vf-wp-update-admin-v1.php
            src/style.css
            tests/update-refresh-policy-contract.php
          )
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected.txt
          printf '%s\n' "${actual[@]}" > /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          test "$(cat VERSION)" = "1.35.13"
          grep -q 'Version: 1.35.13' src/style.css
          grep -q 'V1.35.13_S01_UPDATE_CENTER_UX_POLISH' src/style.css
          echo 'EXACT_SOURCE_SCOPE=PASS'

      - name: PHP syntax and source contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          find src -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/theme-php-lint.txt
          php tests/update-refresh-policy-contract.php
          grep -q "apply_filters('vf_wp_update_components_v1'" src/inc/update/class-vf-wp-update-admin-v1.php
          grep -q "'S01-C01' =>" src/inc/update/class-vf-wp-update-admin-v1.php
          grep -q "check_all_updates" src/inc/update/class-vf-wp-update-admin-v1.php
          echo 'PHP_SOURCE_CONTRACT=PASS'

      - name: UX scale accessibility and legacy-anchor gate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          ADMIN=src/inc/update/class-vf-wp-update-admin-v1.php
          CSS=src/assets/css/admin/admin-update-center.css
          grep -q 'vf-update-center__summary' "$ADMIN"
          grep -q 'vf-update-components' "$ADMIN"
          grep -q 'vf-update-component__versions' "$ADMIN"
          grep -q 'component-<?php echo esc_attr($view' "$ADMIN"
          grep -q '可更新' "$ADMIN"
          grep -q '需要处理' "$ADMIN"
          grep -q '已是最新' "$ADMIN"
          grep -q 'repeat(auto-fit, minmax(300px, 1fr))' "$CSS"
          grep -q '@media (max-width: 600px)' "$CSS"
          grep -q 'min-height: 40px' "$CSS"
          python3 - <<'PY'
          from pathlib import Path
          css = Path('src/assets/css/admin/admin-update-center.css').read_text()
          assert css.count('{') == css.count('}'), 'unbalanced CSS braces'
          admin = Path('src/inc/update/class-vf-wp-update-admin-v1.php').read_text()
          assert admin.index('vf-update-center__hero') < admin.index('vf-update-center__summary') < admin.index('vf-update-components')
          assert '<details class="vf-update-center__panel">' in admin
          assert '状态码 <code>' in admin
          print('UX_STRUCTURE=PASS')
          PY
          echo 'UX_SCALE_ACCESSIBILITY=PASS'

      - name: Credential redaction and no-migration gate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          BASE=8c50ad91678cad78788c04ca839ba8304228499b
          if git diff --name-only "$BASE"..HEAD | grep -Eiq '(^|/)(schema|migration|migrations|database|db)(/|$)'; then
            echo 'Unexpected schema/migration scope' >&2
            exit 1
          fi
          if git diff "$BASE"..HEAD -- . | grep -Eiq '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)'; then
            echo 'Credential-like material detected' >&2
            exit 1
          fi
          grep -q '现有凭证永不回显到 HTML' src/inc/update/class-vf-wp-update-admin-v1.php
          echo 'CREDENTIAL_REDACTION=PASS'
          echo 'NO_SCHEMA_MIGRATION=PASS'

      - name: Build public-safe gate receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/runner
          cat > evidence/runner/S01_C01_UPDATE_CENTER_UX_13513.txt <<'EOF'
          PRODUCT=llhzx2018/vf-tools-theme
          BASE=8c50ad91678cad78788c04ca839ba8304228499b
          CANDIDATE=d0d9193190b25af4df42fd9e5a1e445e96ae3f5a
          VERSION=1.35.13
          CHANGED_FILES=5
          EXACT_SOURCE_SCOPE=PASS
          PHP_SOURCE_CONTRACT=PASS
          UX_SCALE_ACCESSIBILITY=PASS
          CREDENTIAL_REDACTION=PASS
          NO_SCHEMA_MIGRATION=PASS
          PRODUCTION_WRITE=NO
          EOF

      - name: Upload public-safe receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 Node24
        with:
          name: s01-c01-update-center-ux-13513-${{ github.run_id }}
          path: evidence/runner/S01_C01_UPDATE_CENTER_UX_13513.txt
          if-no-files-found: error
          retention-days: 14
