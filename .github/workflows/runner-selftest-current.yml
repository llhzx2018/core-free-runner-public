name: S01 C02 1.21.863 Six Domain Navigation Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-selftest-current.yml'

permissions:
  contents: read

jobs:
  candidate-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact Ops candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 4d9a759d095b6f5070d46974e5704b9c0493b240
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          path: ops
          persist-credentials: false

      - name: Verify exact candidate identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = '4d9a759d095b6f5070d46974e5704b9c0493b240'
          test "$(cat ops/VERSION)" = '1.21.863'
          grep -Fq 'Version: 1.21.863' ops/vf-ops.php
          grep -Fq "VF_OPS_VERSION', '1.21.863'" ops/vf-ops.php
          grep -Fq "S01-SIX-DOMAIN-NAV-TOOLS-QUALITY-R6" ops/vf-ops.php
          echo 'S01_C02_121863_SOURCE_IDENTITY=PASS'

      - name: Syntax checks
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l ops/vf-ops.php
          php -l ops/includes/s01/admin-shell-domain-contract.php
          php -l ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php
          node --check ops/assets/js/admin-s01-domain-shell-r1.js
          echo 'S01_C02_121863_SYNTAX=PASS'

      - name: Six-domain contract
        shell: bash
        run: |
          set -Eeuo pipefail
          php ops/tests/s01-121863-six-domain-nav-contract.php

      - name: Preview sample continuity
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f ops/assets/css/current/admin-s01-preview-samples-r5.css
          grep -Fq '.wrap.vf-s01-tools-workbench' ops/assets/css/current/admin-s01-preview-samples-r5.css
          grep -Fq '.vf-accept-product' ops/assets/css/current/admin-s01-preview-samples-r5.css
          grep -Fq 'vf-s01-tools-workbench' ops/includes/s01/tool-workbench.php
          grep -Fq 'vf-accept-product' ops/includes/admin-v13/views/acceptance_overview.php
          echo 'S01_C02_121863_PREVIEW_CONTINUITY=PASS'

      - name: Unversioned page structure regression
        shell: bash
        run: |
          set -Eeuo pipefail
          php ops/tests/top-domains-visible-ui-contract.php
          echo 'S01_C02_121863_PAGE_STRUCTURE=PASS'

      - name: Changed-file and ownership fence
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq "'label'=>'工具'" ops/includes/s01/admin-shell-domain-contract.php
          grep -Fq "'label'=>'质量'" ops/includes/s01/admin-shell-domain-contract.php
          grep -Fq "'pages'=>['vf-toolsite-content','vf-toolsite-seo-keywords']" ops/includes/s01/admin-shell-domain-contract.php
          grep -Fq 'admin-s01-product-shell-r2.css' ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php
          grep -Fq 'admin-s01-domain-shell-r1.js' ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php
          ! grep -Fq 'update_option(' ops/includes/s01/admin-shell-domain-contract.php
          ! grep -Fq 'wp_remote_' ops/includes/s01/admin-shell-domain-contract.php
          echo 'S01_C02_121863_CHANGED_FILE_FENCE=PASS'
