name: Public Runner Current Self Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths: ['.github/workflows/runner-selftest-current.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-runner-current-selftest-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout public runner control repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Hosted runner allocation proof
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "RUNNER_OS=$RUNNER_OS"
          uname -a
          python3 --version
          echo 'PUBLIC_RUNNER_ALLOCATION=PASS'
      - name: Verify main push came from merged PR
        if: github.event_name == 'push'
        shell: bash
        env:
          VF_PUSH_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          python3 scripts/check_main_push_provenance.py --repository "$GITHUB_REPOSITORY" --sha "$VF_PUSH_SHA"
          echo 'MAIN_PUSH_PROVENANCE=PASS' >> "$GITHUB_ENV"
      - name: Verify Git Estate anti-drift
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: python3 scripts/check_estate_anti_drift.py --live
      - name: Build public-safe receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/runner
          PROVENANCE="${MAIN_PUSH_PROVENANCE:-NOT_APPLICABLE}"
          cat > evidence/runner/PUBLIC_RUNNER_CURRENT.txt <<EOF
          PUBLIC_RUNNER_ALLOCATION=PASS
          ESTATE_ANTI_DRIFT=PASS
          MAIN_PUSH_PROVENANCE=$PROVENANCE
          RUNNER_REPOSITORY=llhzx2018/core-free-runner-public
          PRIVATE_SOURCE_PERSISTED=NO
          MAIN_WRITE=NO
          EOF
      - name: Upload public-safe receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-runner-current-selftest-${{ github.run_id }}
          path: evidence/runner/PUBLIC_RUNNER_CURRENT.txt
          if-no-files-found: error
          retention-days: 14

  p05-business-value-portfolio-runtime:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'test/p05-business-value-portfolio-runtime-20260903'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vf_seo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vf_seo
      VF_MASTER_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NODE_ENV: test
      P05_BASE_SHA: f8a89cd6faf533016dda8b73fdc5fcf1bef46911
      P05_EXACT_SHA: f9268920d5a57c5cc1c0c4b5f800ab4515188e13
      P05_EXACT_TREE: 5c3b37d7f04cbe624f3280934ea03045bcfe582e
    steps:
      - name: Checkout exact P05 Business Value candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: f9268920d5a57c5cc1c0c4b5f800ab4515188e13
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 5

      - name: Verify exact candidate and four-file scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_EXACT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$P05_EXACT_TREE"
          test "$(cat VERSION)" = '1.2.4'
          git cat-file -e "$P05_BASE_SHA^{commit}"
          git diff --check "$P05_BASE_SHA" HEAD
          mapfile -t changed < <(git diff --name-only "$P05_BASE_SHA" HEAD | sort)
          expected=('php/src/ProductPortfolioService.php' 'src/client/ProductApp.tsx' 'src/server/product-portfolio.ts' 'tests/unit/product-portfolio-decision-ladder-truth.test.ts')
          test "${#changed[@]}" -eq 4
          for i in 0 1 2 3; do test "${changed[$i]}" = "${expected[$i]}"; done
          echo P05_BUSINESS_VALUE_EXACT_SOURCE=PASS

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Build exact candidate and bootstrap isolated runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          npm run typecheck
          npm run build
          npm run migrate
          VF_ADMIN_USERNAME=owner VF_ADMIN_PASSWORD='BusinessValue-2026!' npm run bootstrap:admin

      - name: Real runtime and Chrome Business Value priority journey
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p05-business-value
          PORT=18231 VF_SECURE_COOKIES=false VF_REQUIRE_HTTPS=false node dist/src/server/index.js >/tmp/p05-business-value/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import base64,json,pathlib,shutil,subprocess,sys,time,urllib.error,urllib.request
          BASE='http://127.0.0.1:18231'; DP=9547; PASSWORD='BusinessValue-2026!'; OUT=pathlib.Path('/tmp/p05-business-value')
          EXPECTED_NAMES=['Zulu High','Mike Normal','Alpha Low']
          EXPECTED_VALUES=['HIGH','NORMAL','LOW']
          EXPECTED_LABELS=['业务价值 高','业务价值 普通','业务价值 低']
          def fail(msg): print('P05_BUSINESS_VALUE_RUNTIME=FAIL '+msg,file=sys.stderr); raise SystemExit(1)
          def http(method,url,payload=None,timeout=30):
              data=None if payload is None else json.dumps(payload).encode(); req=urllib.request.Request(url,data=data,method=method)
              if data is not None:req.add_header('Content-Type','application/json')
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      raw=r.read().decode(); return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e: fail(f'http {e.code} {url}: {e.read().decode(errors="replace")[:500]}')
          def wait_http(url):
              for _ in range(300):
                  try:
                      with urllib.request.urlopen(url,timeout=1) as r:
                          if r.status<500:return
                  except Exception:time.sleep(.1)
              fail('not ready '+url)
          def wd(method,path,payload=None):
              result=http(method,f'http://127.0.0.1:{DP}{path}',payload); value=result.get('value')
              if isinstance(value,dict) and value.get('error'):fail(f"webdriver {value.get('error')}: {value.get('message')}")
              return result
          driver=shutil.which('chromedriver'); chrome=shutil.which('google-chrome') or shutil.which('google-chrome-stable')
          if not driver or not chrome:fail('Chrome unavailable')
          proc=subprocess.Popen([driver,f'--port={DP}','--allowed-ips=127.0.0.1'],stdout=subprocess.DEVNULL,stderr=subprocess.STDOUT); session=''
          try:
              wait_http(BASE+'/api/health'); wait_http(f'http://127.0.0.1:{DP}/status')
              r=wd('POST','/session',{'capabilities':{'alwaysMatch':{'browserName':'chrome','goog:chromeOptions':{'binary':chrome,'args':['--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--window-size=1440,1000']}}}})
              session=str(r['value'].get('sessionId') or r.get('sessionId') or '')
              if not session:fail('missing session')
              def sv(method,path,payload=None):return wd(method,f'/session/{session}{path}',payload)['value']
              def js(code):return sv('POST','/execute/sync',{'script':code,'args':[]})
              def jsa(body):
                  script="""const done=arguments[arguments.length-1];(async()=>{try{const value=await (async()=>{%s})();done(value)}catch(e){done({__error:String(e&&e.stack||e)})}})();"""%body
                  value=sv('POST','/execute/async',{'script':script,'args':[]})
                  if isinstance(value,dict) and value.get('__error'):fail('browser async '+str(value['__error']))
                  return value
              def wait(fn,label,n=400):
                  last=None
                  for _ in range(n):
                      try:
                          last=fn()
                          if last:return last
                      except Exception as e:last=repr(e)
                      time.sleep(.1)
                  fail(f'timeout {label}: {last!r}')
              def find(css):return sv('POST','/element',{'using':'css selector','value':css})['element-6066-11e4-a52e-4f735466cecf']
              def send(e,v):sv('POST',f'/element/{e}/clear',{});sv('POST',f'/element/{e}/value',{'text':v,'value':list(v)})
              def click(label):return bool(js('''const x=%s;const b=[...document.querySelectorAll('button')].find(e=>e.textContent.trim()===x);if(!b||b.disabled)return false;b.click();return true;'''%json.dumps(label,ensure_ascii=False)))
              def shot(name):(OUT/name).write_bytes(base64.b64decode(sv('GET','/screenshot')))
              sv('POST','/url',{'url':BASE+'/'})
              wait(lambda:js("return !!document.querySelector(\"input[autocomplete='username']\")"),'login')
              send(find("input[autocomplete='username']"),'owner');send(find("input[autocomplete='current-password']"),PASSWORD);click('登录') or fail('login')
              wait(lambda:js("return !!document.querySelector('.p05v2-content')"),'product shell')
              auth=jsa("const r=await fetch('/api/auth/me',{credentials:'same-origin',cache:'no-store'});const b=await r.json();if(!r.ok)throw new Error(JSON.stringify(b));return b;")
              csrf=str(auth.get('csrfToken') or '')
              if not csrf:fail('missing csrf')
              project=jsa("const r=await fetch('/api/projects',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json','x-csrf-token':%s},body:JSON.stringify({name:'Business Value Gate'})});const b=await r.json();if(!r.ok)throw new Error(JSON.stringify(b));return b;"%json.dumps(csrf))
              project_id=str((project.get('project') or {}).get('id') or '')
              if not project_id:fail('project create not confirmed '+repr(project))
              specs=[('Zulu High','https://zulu-high.example.test','HIGH'),('Mike Normal','https://mike-normal.example.test','NORMAL'),('Alpha Low','https://alpha-low.example.test','LOW')]
              for name,url,value in specs:
                  created=jsa("const r=await fetch('/api/websites',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json','x-csrf-token':%s},body:JSON.stringify({projectId:%s,name:%s,url:%s,businessValue:%s})});const b=await r.json();if(!r.ok)throw new Error(JSON.stringify(b));return b;"%(json.dumps(csrf),json.dumps(project_id),json.dumps(name),json.dumps(url),json.dumps(value)))
                  if not str((created.get('website') or {}).get('id') or ''):fail('website create not confirmed '+repr(created))
              portfolio=jsa("const r=await fetch('/api/product/sites',{credentials:'same-origin',cache:'no-store'});const b=await r.json();if(!r.ok)throw new Error(JSON.stringify(b));return b;")
              rows=[x for x in portfolio.get('items',[]) if x.get('name') in EXPECTED_NAMES]
              names=[str(x.get('name')) for x in rows]; values=[str(x.get('business_value')) for x in rows]; statuses=[str((x.get('status') or {}).get('code')) for x in rows]
              if names!=EXPECTED_NAMES:fail(f'API order {names!r}')
              if values!=EXPECTED_VALUES:fail(f'API Business Value values {values!r}')
              if len(set(statuses))!=1 or statuses[0]!='DATA_PROBLEM':fail(f'API states must be identical DATA_PROBLEM {statuses!r}')
              print('P05_BUSINESS_VALUE_API_ORDER=HIGH_NORMAL_LOW')
              print('P05_BUSINESS_VALUE_API_SHARED_STATUS=DATA_PROBLEM')
              sv('POST','/url',{'url':BASE+'/'})
              wait(lambda:js("return document.querySelectorAll('.p05v2-site-row').length===3"),'three Portfolio rows')
              ui=js("return [...document.querySelectorAll('.p05v2-site-row')].map(r=>({name:r.querySelector('.p05v2-site-main strong')?.textContent.trim()||'',text:r.querySelector('.p05v2-site-main')?.innerText||''}))")
              ui_names=[str(x.get('name')) for x in ui]
              if ui_names!=EXPECTED_NAMES:fail(f'UI order {ui_names!r}')
              for row,label in zip(ui,EXPECTED_LABELS):
                  if label not in str(row.get('text') or ''):fail(f'UI missing {label}: {row!r}')
              desktop_width=int(js('return innerWidth'))
              if desktop_width<1000:fail(f'desktop viewport too narrow {desktop_width}')
              if int(js('return document.documentElement.scrollWidth'))>int(js('return document.documentElement.clientWidth'))+1:fail('desktop document overflow')
              shot('desktop-business-value-order.png')
              sv('POST','/window/rect',{'x':0,'y':0,'width':390,'height':844});time.sleep(.8);js('window.scrollTo(0,0);return true')
              mobile_width=int(js('return innerWidth'))
              if mobile_width>400:fail(f'mobile viewport not forced {mobile_width}')
              mobile_names=js("return [...document.querySelectorAll('.p05v2-site-row')].map(r=>r.querySelector('.p05v2-site-main strong')?.textContent.trim()||'')")
              if mobile_names!=EXPECTED_NAMES:fail(f'mobile UI order {mobile_names!r}')
              if int(js('return document.documentElement.scrollWidth'))>int(js('return document.documentElement.clientWidth'))+1:fail('mobile document overflow')
              shot('mobile-business-value-order.png')
              print('P05_BUSINESS_VALUE_UI_ORDER=HIGH_NORMAL_LOW')
              print('P05_BUSINESS_VALUE_UI_LABELS=PASS')
              print('P05_BUSINESS_VALUE_MOBILE_TRUE_VIEWPORT=PASS')
              print('P05_BUSINESS_VALUE_RUNTIME=PASS')
          finally:
              if session:
                  try:wd('DELETE',f'/session/{session}')
                  except Exception:pass
              proc.terminate()
          PY

      - name: Upload Business Value screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p05-business-value-portfolio-${{ github.run_id }}
          path: /tmp/p05-business-value/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Read-only Product source boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_EXACT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$P05_EXACT_TREE"
          test -z "$(git status --porcelain)"
          echo P05_PRODUCT_SOURCE_WRITE=0
          echo P05_RELEASE_WRITE=0
          echo P05_PRODUCTION_WRITE=0
          echo P05_EPHEMERAL_TEST_DB_MUTATION_ONLY=PASS
