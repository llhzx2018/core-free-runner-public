name: Public Runner Current Self Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths: ['.github/workflows/runner-selftest-current.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-runner-current-selftest-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout public runner control repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Hosted runner allocation proof
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "RUNNER_OS=$RUNNER_OS"
          uname -a
          php -v || true
          python3 --version
          echo 'PUBLIC_RUNNER_ALLOCATION=PASS'

      - name: Verify main push came from merged PR
        if: github.event_name == 'push'
        shell: bash
        env:
          VF_PUSH_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          python3 scripts/check_main_push_provenance.py \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$VF_PUSH_SHA"
          echo 'MAIN_PUSH_PROVENANCE=PASS' >> "$GITHUB_ENV"

      - name: Verify Git Estate anti-drift
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: python3 scripts/check_estate_anti_drift.py --live

      - name: Build public-safe receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/runner
          PROVENANCE="${MAIN_PUSH_PROVENANCE:-NOT_APPLICABLE}"
          cat > evidence/runner/PUBLIC_RUNNER_CURRENT.txt <<EOF
          PUBLIC_RUNNER_ALLOCATION=PASS
          ESTATE_ANTI_DRIFT=PASS
          MAIN_PUSH_PROVENANCE=$PROVENANCE
          RUNNER_REPOSITORY=llhzx2018/core-free-runner-public
          PRIVATE_SOURCE_USED=GOV_DOC_AUTHORITY_ONLY
          SECRET_USED=REGISTERED_PRIVATE_READ_CAPABILITY
          PRIVATE_SOURCE_PERSISTED=NO
          MAIN_WRITE=NO
          USER_MANUAL_EXECUTION_REQUIRED=NO
          EOF

      - name: Upload public-safe receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 Node24
        with:
          name: public-runner-current-selftest-${{ github.run_id }}
          path: evidence/runner/PUBLIC_RUNNER_CURRENT.txt
          if-no-files-found: error
          retention-days: 14

  p05-v125-production-readback:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'tmp/p05-v125-production-readback-20260904'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read Production health without mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsS --connect-timeout 10 --max-time 20 https://seo.kewaro.com/api/health > /tmp/health.json
          php -r '
          $v=json_decode(file_get_contents($argv[1]),true,32,JSON_THROW_ON_ERROR);
          if(($v["ok"]??false)!==true) exit(1);
          if((string)($v["version"]??"")!=="1.2.5") exit(2);
          if((string)($v["schema"]??"")!=="1") exit(3);
          if(($v["database"]??"")!=="READY") exit(4);
          if(($v["process"]??"")!=="READY") exit(5);
          echo "P05_PRODUCTION_VERSION=1.2.5\n";
          echo "P05_PRODUCTION_SCHEMA=1\n";
          echo "P05_PRODUCTION_DATABASE=READY\n";
          echo "P05_PRODUCTION_PROCESS=READY\n";
          ' /tmp/health.json
          cat /tmp/health.json

      - name: Confirm public root and legacy bridge state
        shell: bash
        run: |
          set -Eeuo pipefail
          root_code="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 20 https://seo.kewaro.com/)"
          bridge_code="$(curl -sS -o /tmp/bridge.out -w '%{http_code}' --connect-timeout 10 --max-time 20 https://seo.kewaro.com/P05_V1.2.2_TO_UNIFIED_UPDATE_BRIDGE.php)"
          test "$root_code" = "200"
          test "$bridge_code" = "404"
          echo P05_PRODUCTION_ROOT_HTTP=200
          echo P05_LEGACY_BRIDGE_CLEANED=PASS
          echo P05_PRODUCT_SOURCE_WRITE=0
          echo P05_RELEASE_WRITE=0
          echo P05_PRODUCTION_WRITE=0
