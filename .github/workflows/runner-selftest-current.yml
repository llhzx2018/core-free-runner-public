name: S01 C02 1.21.871 Distribution Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-selftest-current.yml'

permissions:
  contents: read

jobs:
  distribution-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CORE_UPDATES_REPO: llhzx2018/core-updates
      CORE_UPDATES_SHA: f5ba32ea9c2b8693b40c27a57234ca92af2053a2
      BASE_SHA: 4c4086458fa29c9aec95f1928571d2c41f952802
    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          repository: llhzx2018/core-updates
          ref: f5ba32ea9c2b8693b40c27a57234ca92af2053a2
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: core-updates
          persist-credentials: false

      - name: Exact one-file distribution fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C core-updates rev-parse HEAD)" = "$CORE_UPDATES_SHA"
          mapfile -t changed < <(git -C core-updates diff --name-only "$BASE_SHA" "$CORE_UPDATES_SHA" | sort)
          test "$(printf '%s\n' "${changed[@]}")" = 'projects/S01-C02.json'
          echo 'S01_C02_121871_EXACT_SCOPE=PASS'

      - name: Exact 1.21.871 manifest identity
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, pathlib, sys
          p=pathlib.Path('core-updates/projects/S01-C02.json')
          d=json.loads(p.read_text())
          expected={
            'target_version':'1.21.871',
            'release_tag':'v1.21.871',
            'asset_name':'vf-tools-ops_V1.21.871.zip',
            'asset_bytes':3412908,
            'asset_sha256':'af629c6251c4e64b69b3c648e615b28f7aa3f68de3740c2df1c38b02f62785a8',
            'runtime_files':950,
            'runtime_file_count':950,
            'runtime_fingerprint':'5affcdb1c749e4d185d8a0b10d4af444c819fdd65776fb552954e7c9d770b7c0',
            'runtime_fingerprint_sha256':'5affcdb1c749e4d185d8a0b10d4af444c819fdd65776fb552954e7c9d770b7c0',
            'released_at':'2026-09-16T06:55:18Z',
            'physical_locator':'vf-ops/vf-ops.php',
            'locator_cutover':False,
            'schema_from':'6.0.0',
            'schema_to':'6.0.0',
          }
          for k,v in expected.items():
              if d.get(k)!=v:
                  print(f'{k}: expected {v!r}, got {d.get(k)!r}', file=sys.stderr); sys.exit(1)
          fv=d.get('from_versions',[])
          if '1.21.870' not in fv or '1.21.861' in fv:
              print('from_versions contract failed', fv, file=sys.stderr); sys.exit(1)
          print('S01_C02_121871_MANIFEST_IDENTITY=PASS')
          PY

      - name: Manifest Contract Audit
        shell: bash
        run: |
          set -Eeuo pipefail
          cd core-updates
          python3 scripts/check_manifest_contract.py
          echo 'S01_C02_121871_MANIFEST_CONTRACT=PASS'

      - name: PHP syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          cd core-updates
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          echo 'S01_C02_121871_PHP_SYNTAX=PASS'

      - name: Update Core regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd core-updates
          php update-core/php/tests/run.php
          echo 'S01_C02_121871_UPDATE_CORE=PASS'

      - name: Secret fence
        shell: bash
        run: |
          set -Eeuo pipefail
          if git -C core-updates diff "$BASE_SHA" "$CORE_UPDATES_SHA" -- projects/S01-C02.json | grep -E '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)'; then
            echo 'secret-like material detected' >&2; exit 1
          fi
          echo 'S01_C02_121871_SECRET_FENCE=PASS'
