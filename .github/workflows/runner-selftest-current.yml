name: Public Runner Current Self Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths: ['.github/workflows/runner-selftest-current.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-runner-current-selftest-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout public runner control repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Hosted runner allocation proof
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "RUNNER_OS=$RUNNER_OS"
          uname -a
          python3 --version
          echo 'PUBLIC_RUNNER_ALLOCATION=PASS'
      - name: Verify main push came from merged PR
        if: github.event_name == 'push'
        shell: bash
        env:
          VF_PUSH_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          python3 scripts/check_main_push_provenance.py --repository "$GITHUB_REPOSITORY" --sha "$VF_PUSH_SHA"
          echo 'MAIN_PUSH_PROVENANCE=PASS' >> "$GITHUB_ENV"
      - name: Verify Git Estate anti-drift
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: python3 scripts/check_estate_anti_drift.py --live
      - name: Build public-safe receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/runner
          cat > evidence/runner/PUBLIC_RUNNER_CURRENT.txt <<EOF
          PUBLIC_RUNNER_ALLOCATION=PASS
          ESTATE_ANTI_DRIFT=PASS
          RUNNER_REPOSITORY=llhzx2018/core-free-runner-public
          PRIVATE_SOURCE_PERSISTED=NO
          MAIN_WRITE=NO
          EOF
      - name: Upload public-safe receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-runner-current-selftest-${{ github.run_id }}
          path: evidence/runner/PUBLIC_RUNNER_CURRENT.txt
          if-no-files-found: error
          retention-days: 14

  p05-mobile-portfolio-action-first-writer:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'write/p05-mobile-portfolio-action-first-20260903'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      P05_REPO: llhzx2018/vf-seo
      P05_BRANCH: l2/mobile-portfolio-action-first-20260903
      P05_BASE_SHA: 830f442622719ed170d6a112d2ff38a9ac03b670
      P05_BASE_TREE: f1988695d832932b33dd01fbf46e6520b2eaaefb
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Checkout exact Product candidate branch read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: l2/mobile-portfolio-action-first-20260903
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 2

      - name: Verify exact Product base and live main
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_BASE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$P05_BASE_TREE"
          test "$(cat VERSION)" = '1.2.4'
          python3 - <<'PY'
          import json, os, urllib.request
          repo=os.environ['P05_REPO']; token=os.environ['VF_RELEASE_WRITE_TOKEN']; base=os.environ['P05_BASE_SHA']; branch=os.environ['P05_BRANCH']
          def get(url):
              r=urllib.request.Request(url,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(r) as x:return json.load(x)
          main=get(f'https://api.github.com/repos/{repo}/branches/main')['commit']['sha']
          candidate=get(f'https://api.github.com/repos/{repo}/branches/{branch.replace("/","%2F")}')['commit']['sha']
          assert main==base,(main,base)
          assert candidate==base,(candidate,base)
          print('P05_MOBILE_ACTION_FIRST_EXACT_BASE=PASS')
          PY

      - name: Construct exact action-first candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          app_path=Path('src/client/ProductApp.tsx')
          css_path=Path('src/client/product-app.css')
          test_path=Path('tests/unit/product-portfolio-top-opportunity-routing-truth.test.ts')
          app=app_path.read_text()
          start=app.index('function SitePortfolio')
          facts_start=app.index('<div className="p05v2-site-facts">', start)
          action_start=app.index('<div className="p05v2-site-action">', facts_start)
          action_close=app.index('</div></article>;', action_start)+len('</div>')
          facts=app[facts_start:action_start]
          action=app[action_start:action_close]
          assert facts.count('p05v2-site-facts')==1
          assert action.count('p05v2-site-action')==1
          app=app[:facts_start]+action+facts+app[action_close:]
          app_path.write_text(app)

          css=css_path.read_text()
          replacements={
            '.p05v2-site-row{display:grid;grid-template-columns:minmax(240px,1.35fr) minmax(330px,1.5fr) minmax(210px,.8fr);gap:18px':'.p05v2-site-row{display:grid;grid-template-columns:minmax(240px,1.35fr) minmax(330px,1.5fr) minmax(210px,.8fr);grid-template-areas:"main facts action";gap:18px',
            '.p05v2-site-main{display:flex;':'.p05v2-site-main{grid-area:main;display:flex;',
            '.p05v2-site-facts{display:grid;':'.p05v2-site-facts{grid-area:facts;display:grid;',
            '.p05v2-site-action{min-width:0}':'.p05v2-site-action{grid-area:action;min-width:0}',
            '@media(max-width:1100px){.p05v2-site-row{grid-template-columns:1fr}':'@media(max-width:1100px){.p05v2-site-row{grid-template-columns:1fr;grid-template-areas:"main" "action" "facts"}'
          }
          for old,new in replacements.items():
              assert css.count(old)==1,(old,css.count(old))
              css=css.replace(old,new,1)
          css_path.write_text(css)

          tests=test_path.read_text()
          anchor="const app = readFileSync(new URL('../../src/client/ProductApp.tsx', import.meta.url), 'utf8');\n"
          assert tests.count(anchor)==1
          tests=tests.replace(anchor,anchor+"const css = readFileSync(new URL('../../src/client/product-app.css', import.meta.url), 'utf8');\n",1)
          addition='''\n\ntest('Portfolio mobile hierarchy puts Owner action before supporting metrics while desktop keeps the three-column visual contract', () => {\n  const portfolio = section(app, 'function SitePortfolio', 'function SiteSurface');\n  const row = portfolio.indexOf('return <article className="p05v2-site-row"');\n  const action = portfolio.indexOf('<div className="p05v2-site-action">', row);\n  const facts = portfolio.indexOf('<div className="p05v2-site-facts">', row);\n  assert.ok(row >= 0 && action > row && facts > action, 'Portfolio DOM must expose Owner action before supporting metric facts');\n  assert.match(css, /\\.p05v2-site-row\\{[^}]*grid-template-areas:"main facts action"/);\n  assert.match(css, /\\.p05v2-site-main\\{grid-area:main;/);\n  assert.match(css, /\\.p05v2-site-action\\{grid-area:action;/);\n  assert.match(css, /\\.p05v2-site-facts\\{grid-area:facts;/);\n  assert.match(css, /@media\\(max-width:1100px\\)\\{\\.p05v2-site-row\\{grid-template-columns:1fr;grid-template-areas:"main" "action" "facts"\\}/);\n});\n'''
          assert "Portfolio mobile hierarchy puts Owner action before supporting metrics" not in tests
          test_path.write_text(tests.rstrip()+addition)
          PY
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=('src/client/ProductApp.tsx' 'src/client/product-app.css' 'tests/unit/product-portfolio-top-opportunity-routing-truth.test.ts')
          test "${#changed[@]}" -eq 3
          for i in 0 1 2; do test "${changed[$i]}" = "${expected[$i]}"; done
          grep -Fq 'grid-template-areas:"main facts action"' src/client/product-app.css
          grep -Fq 'grid-template-areas:"main" "action" "facts"' src/client/product-app.css
          echo P05_MOBILE_ACTION_FIRST_CONSTRUCT=PASS

      - name: Write exact Product files through GitHub Contents API
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64,json,os,subprocess,urllib.parse,urllib.request
          repo=os.environ['P05_REPO']; branch=os.environ['P05_BRANCH']; token=os.environ['VF_RELEASE_WRITE_TOKEN']
          paths=['src/client/ProductApp.tsx','src/client/product-app.css','tests/unit/product-portfolio-top-opportunity-routing-truth.test.ts']
          headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}
          for path in paths:
              sha=subprocess.check_output(['git','rev-parse','HEAD:'+path],text=True).strip()
              content=base64.b64encode(open(path,'rb').read()).decode()
              body=json.dumps({'message':'refactor(ui): put mobile Portfolio action before metrics','content':content,'sha':sha,'branch':branch}).encode()
              url=f'https://api.github.com/repos/{repo}/contents/{urllib.parse.quote(path)}'
              req=urllib.request.Request(url,data=body,method='PUT',headers=headers)
              with urllib.request.urlopen(req) as r:
                  out=json.load(r)
                  assert out.get('commit',{}).get('sha')
                  print(path,out['commit']['sha'])
          print('P05_MOBILE_ACTION_FIRST_WRITE=PASS')
          PY

      - name: Read back exact final Product scope
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,os,urllib.parse,urllib.request
          repo=os.environ['P05_REPO']; branch=os.environ['P05_BRANCH']; token=os.environ['VF_RELEASE_WRITE_TOKEN']; base=os.environ['P05_BASE_SHA']
          headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers)) as r:return json.load(r)
          head=get(f'https://api.github.com/repos/{repo}/branches/{branch.replace("/","%2F")}')['commit']['sha']
          cmp=get(f'https://api.github.com/repos/{repo}/compare/{base}...{head}')
          files=sorted(x['filename'] for x in cmp['files'])
          expected=['src/client/ProductApp.tsx','src/client/product-app.css','tests/unit/product-portfolio-top-opportunity-routing-truth.test.ts']
          assert cmp['status']=='ahead',cmp['status']
          assert cmp['behind_by']==0,cmp['behind_by']
          assert files==expected,(files,expected)
          version=get(f'https://api.github.com/repos/{repo}/contents/VERSION?ref={urllib.parse.quote(branch)}')
          import base64
          assert base64.b64decode(version['content']).decode().strip()=='1.2.4'
          print('P05_MOBILE_ACTION_FIRST_FINAL_HEAD='+head)
          print('P05_MOBILE_ACTION_FIRST_FINAL_SCOPE=PASS')
          PY
