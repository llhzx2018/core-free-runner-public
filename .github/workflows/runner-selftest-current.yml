name: S01 C02 1.21.862 Source Identity Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-selftest-current.yml'

permissions:
  contents: read

concurrency:
  group: s01-c02-121862-source-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact Ops 1.21.862 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          repository: llhzx2018/vf-tools-ops
          ref: a8936ad6cc99572150452d5e84b093425d4b82de
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: ops
          persist-credentials: false

      - name: Exact six-file correction fence
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='b4eeed57365d2ad833ce25853bc0d92663a18151'
          HEAD='a8936ad6cc99572150452d5e84b093425d4b82de'
          test "$(git -C ops rev-parse HEAD)" = "$HEAD"
          cat > /tmp/expected <<'EOF'
          VERSION
          tests/admin-human-language-contract.php
          tests/s01-121861-reference-samples-contract.php
          tests/update-refresh-policy-current-contract.php
          tests/visible-console-v2-contract.php
          vf-ops.php
          EOF
          git -C ops diff --name-only "$BASE"...HEAD | sort > /tmp/actual
          diff -u <(sort /tmp/expected) /tmp/actual
          echo 'S01_C02_121862_SCOPE=PASS'

      - name: Prove visible sample source unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='b4eeed57365d2ad833ce25853bc0d92663a18151'
          git -C ops diff --exit-code "$BASE"...HEAD -- \
            includes/s01/tool-workbench.php \
            includes/admin-v13/views/acceptance_overview.php \
            assets/css/current/admin-s01-preview-samples-r5.css \
            includes/views/admin-style-helpers/admin-s01-uiux-polish.php
          echo 'S01_C02_121862_VISIBLE_SOURCE_UNCHANGED=PASS'

      - name: Semantic release identity fence
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import pathlib, subprocess
          base='b4eeed57365d2ad833ce25853bc0d92663a18151'
          old=subprocess.check_output(['git','-C','ops','show',f'{base}:vf-ops.php'], text=True)
          new=pathlib.Path('ops/vf-ops.php').read_text()
          expected=old.replace('Version: 1.21.861','Version: 1.21.862')
          expected=expected.replace("VF_OPS_VERSION', '1.21.861'","VF_OPS_VERSION', '1.21.862'")
          assert new == expected, 'vf-ops.php changed beyond 1.21.862 identity bump'
          assert pathlib.Path('ops/VERSION').read_text().strip() == '1.21.862'
          print('S01_C02_121862_IDENTITY=PASS')
          PY

      - name: PHP and regression gates
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l ops/vf-ops.php
          php -l ops/tests/s01-121861-reference-samples-contract.php
          php -l ops/tests/visible-console-v2-contract.php
          php -l ops/tests/admin-human-language-contract.php
          php -l ops/tests/update-refresh-policy-current-contract.php
          php ops/tests/s01-121861-reference-samples-contract.php
          php ops/tests/visible-console-v2-contract.php
          php ops/tests/top-domains-visible-ui-contract.php
          php ops/tests/admin-human-language-contract.php
          php ops/tests/update-refresh-policy-current-contract.php
          echo 'S01_C02_121862_REGRESSION=PASS'

      - name: Secret fence
        shell: bash
        run: |
          set -Eeuo pipefail
          ! git -C ops diff 'b4eeed57365d2ad833ce25853bc0d92663a18151'...HEAD | grep -E 'ghp_[A-Za-z0-9]|github_pat_|BEGIN (RSA |OPENSSH )?PRIVATE KEY'
          echo 'S01_C02_121862_SECRET_FENCE=PASS'
          echo 'S01_C02_121862_SOURCE_GATE=PASS'
