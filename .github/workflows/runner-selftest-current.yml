name: Public Runner Current Self Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths: ['.github/workflows/runner-selftest-current.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-runner-current-selftest-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout public runner control repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Hosted runner allocation proof
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "RUNNER_OS=$RUNNER_OS"
          uname -a
          python3 --version
          echo 'PUBLIC_RUNNER_ALLOCATION=PASS'
      - name: Verify main push came from merged PR
        if: github.event_name == 'push'
        shell: bash
        env:
          VF_PUSH_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          python3 scripts/check_main_push_provenance.py --repository "$GITHUB_REPOSITORY" --sha "$VF_PUSH_SHA"
          echo 'MAIN_PUSH_PROVENANCE=PASS' >> "$GITHUB_ENV"
      - name: Verify Git Estate anti-drift
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: python3 scripts/check_estate_anti_drift.py --live
      - name: Build public-safe receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/runner
          cat > evidence/runner/PUBLIC_RUNNER_CURRENT.txt <<EOF
          PUBLIC_RUNNER_ALLOCATION=PASS
          ESTATE_ANTI_DRIFT=PASS
          RUNNER_REPOSITORY=llhzx2018/core-free-runner-public
          PRIVATE_SOURCE_PERSISTED=NO
          MAIN_WRITE=NO
          EOF
      - name: Upload public-safe receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-runner-current-selftest-${{ github.run_id }}
          path: evidence/runner/PUBLIC_RUNNER_CURRENT.txt
          if-no-files-found: error
          retention-days: 14

  p05-mobile-secondary-tools-fit-writer:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'write/p05-mobile-secondary-tools-fit-20260903'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      P05_REPO: llhzx2018/vf-seo
      P05_BRANCH: l2/mobile-secondary-tools-fit-20260903
      P05_BASE_SHA: ceab6fd82c33c9f8259c5baa5f11c96bfeec4e7c
      P05_BASE_TREE: dba1a7f161aa7e9ed43a1b4181773a92ee0e3d53
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Checkout exact Product candidate branch read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: l2/mobile-secondary-tools-fit-20260903
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 2

      - name: Verify exact Product base and live main
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_BASE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$P05_BASE_TREE"
          test "$(cat VERSION)" = '1.2.4'
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          repo=os.environ['P05_REPO']; token=os.environ['VF_RELEASE_WRITE_TOKEN']; base=os.environ['P05_BASE_SHA']; branch=os.environ['P05_BRANCH']
          headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers)) as r:return json.load(r)
          main=get(f'https://api.github.com/repos/{repo}/branches/main')['commit']['sha']
          candidate=get(f'https://api.github.com/repos/{repo}/branches/{urllib.parse.quote(branch,safe="")}')['commit']['sha']
          assert main==base,(main,base)
          assert candidate==base,(candidate,base)
          print('P05_MOBILE_SECONDARY_TOOLS_EXACT_BASE=PASS')
          PY

      - name: Construct exact mobile secondary-tools candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          css_path=Path('src/client/product-site-views.css')
          test_path=Path('tests/unit/product-mobile-secondary-nav-width-truth.test.ts')
          css=css_path.read_text()
          old='.p05v2-secondary button{flex:0 0 auto;min-height:34px;padding:6px 9px;font-size:12px;white-space:nowrap}'
          new='.p05v2-secondary button{flex:0 0 auto;width:auto;min-height:34px;padding:6px 9px;font-size:12px;white-space:nowrap}'
          assert css.count(old)==1,css.count(old)
          assert new not in css
          css_path.write_text(css.replace(old,new,1))
          assert not test_path.exists()
          test_path.write_text('''import assert from 'node:assert/strict';
import { readFileSync } from 'node:fs';
import test from 'node:test';

const css = readFileSync(new URL('../../src/client/product-site-views.css', import.meta.url), 'utf8');
const common = readFileSync(new URL('../../src/client/CommonSystemCenter.tsx', import.meta.url), 'utf8');
const update = readFileSync(new URL('../../src/client/UpdateShortcut.tsx', import.meta.url), 'utf8');

test('mobile Product keeps workspace navigation scrollable but secondary tools content-width', () => {
  assert.match(css, /\\.p05v2-nav\\{grid-column:1\\/-1;grid-row:2;display:flex;gap:6px;overflow-x:auto;/);
  assert.match(css, /\\.p05v2-nav::-webkit-scrollbar\\{display:none\\}/);
  assert.match(css, /\\.p05v2-secondary\\{grid-column:1\\/3;grid-row:3;display:flex;gap:6px;overflow-x:auto\\}/);
  assert.match(css, /\\.p05v2-secondary button\\{flex:0 0 auto;width:auto;min-height:34px;/);
  assert.match(common, /querySelector\\('\.p05v2-secondary'\\)/);
  assert.match(update, /querySelector\\('\.p05v2-secondary'\\)/);
});
''')
          PY
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=('src/client/product-site-views.css' 'tests/unit/product-mobile-secondary-nav-width-truth.test.ts')
          test "${#changed[@]}" -eq 2
          for i in 0 1; do test "${changed[$i]}" = "${expected[$i]}"; done
          grep -Fq '.p05v2-secondary button{flex:0 0 auto;width:auto;' src/client/product-site-views.css
          grep -Fq 'workspace navigation scrollable but secondary tools content-width' tests/unit/product-mobile-secondary-nav-width-truth.test.ts
          echo P05_MOBILE_SECONDARY_TOOLS_CONSTRUCT=PASS

      - name: Write exact Product files through GitHub Contents API
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64,json,os,subprocess,urllib.parse,urllib.request
          repo=os.environ['P05_REPO']; branch=os.environ['P05_BRANCH']; token=os.environ['VF_RELEASE_WRITE_TOKEN']
          paths=['src/client/product-site-views.css','tests/unit/product-mobile-secondary-nav-width-truth.test.ts']
          headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}
          for path in paths:
              payload={'message':'fix(ui): fit mobile secondary tools without scrolling','content':base64.b64encode(open(path,'rb').read()).decode(),'branch':branch}
              try:
                  payload['sha']=subprocess.check_output(['git','rev-parse','HEAD:'+path],text=True,stderr=subprocess.DEVNULL).strip()
              except subprocess.CalledProcessError:
                  pass
              body=json.dumps(payload).encode()
              url=f'https://api.github.com/repos/{repo}/contents/{urllib.parse.quote(path)}'
              with urllib.request.urlopen(urllib.request.Request(url,data=body,method='PUT',headers=headers)) as r:
                  out=json.load(r); assert out.get('commit',{}).get('sha'); print(path,out['commit']['sha'])
          print('P05_MOBILE_SECONDARY_TOOLS_WRITE=PASS')
          PY

      - name: Read back exact final Product scope
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64,json,os,urllib.parse,urllib.request
          repo=os.environ['P05_REPO']; branch=os.environ['P05_BRANCH']; token=os.environ['VF_RELEASE_WRITE_TOKEN']; base=os.environ['P05_BASE_SHA']
          headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers)) as r:return json.load(r)
          main=get(f'https://api.github.com/repos/{repo}/branches/main')['commit']['sha']
          head=get(f'https://api.github.com/repos/{repo}/branches/{urllib.parse.quote(branch,safe="")}')['commit']['sha']
          assert main==base,(main,base)
          cmp=get(f'https://api.github.com/repos/{repo}/compare/{base}...{head}')
          files=sorted(x['filename'] for x in cmp['files'])
          expected=['src/client/product-site-views.css','tests/unit/product-mobile-secondary-nav-width-truth.test.ts']
          assert cmp['status']=='ahead',cmp['status']
          assert cmp['behind_by']==0,cmp['behind_by']
          assert files==expected,(files,expected)
          version=get(f'https://api.github.com/repos/{repo}/contents/VERSION?ref={urllib.parse.quote(branch)}')
          assert base64.b64decode(version['content']).decode().strip()=='1.2.4'
          print('P05_MOBILE_SECONDARY_TOOLS_FINAL_HEAD='+head)
          print('P05_MOBILE_SECONDARY_TOOLS_FINAL_SCOPE=PASS')
          PY
