name: P04 VF Infra V2.6.0 Formal Candidate Continuation Gate

on:
  push:
    branches:
      - p04-v260-formal-candidate
    paths:
      - '.github/workflows/p04-v260-formal-candidate-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p04-v260-formal-candidate-gate
  cancel-in-progress: false

env:
  TARGET_REPOSITORY: llhzx2018/vf-infra
  TARGET_COMMIT: 13e1da3c7dd5ec7cf4abbdba7c041b94329f20a5
  PREVIOUS_TESTED_SOURCE: a9878e9b09ffacc2afdc7b96c36e1912db1d32b5
  TARGET_VERSION: '2.6.0'
  SOURCE_VERSION: '2.5.8'
  TARGET_SCHEMA: '14'
  PROTOTYPE_AUTHORITY: c2f32d3aa3d772e6a42d046ad6d9d4933664f9a5
  PROTOTYPE_TESTED_RUNTIME: 999738f628db79e782784775540c764f3f6fb0d1
  PRODUCTION_PRODUCT_COMMIT: 4a18a61c21455184c67aa4a3e0957283674ae2d7
  V258_FULL_ASSET_ID: '517422544'
  V258_FULL_SHA256: 554e7dd006631bfbd8c0564452e908b73fe31d5c1c5115679f3fa995e7943e98

jobs:
  candidate-continuation:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout exact private Candidate source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_COMMIT }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: vf-infra

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, fileinfo, sodium, zip, curl, mbstring
          coverage: none

      - name: Carry-forward boundary and affected-source syntax
        working-directory: vf-infra
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_COMMIT"
          test "$(tr -d '\r\n' < VERSION)" = "$TARGET_VERSION"
          test "$(find database/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')" = "$TARGET_SCHEMA"
          git merge-base --is-ancestor "$PROTOTYPE_AUTHORITY" HEAD
          git merge-base --is-ancestor "$PROTOTYPE_TESTED_RUNTIME" HEAD
          git diff --name-only "$PREVIOUS_TESTED_SOURCE"...HEAD | tee /tmp/v260-continuation-diff.txt
          test "$(wc -l </tmp/v260-continuation-diff.txt | tr -d ' ')" = '2'
          grep -qx 'scripts/build-v260-candidate-artifacts.py' /tmp/v260-continuation-diff.txt
          grep -qx 'scripts/build-v260-update-release.py' /tmp/v260-continuation-diff.txt
          git diff --exit-code "$PREVIOUS_TESTED_SOURCE" HEAD -- VERSION docs/operations/package/RELEASE_NOTES.md public src database config
          python3 -m py_compile scripts/build-v260-update-release.py scripts/build-v260-candidate-artifacts.py scripts/full-runtime-vs-update-result-source-exact-gate.py scripts/build-release-tree.py
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          find scripts -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          test -z "$(git status --porcelain --untracked-files=all | grep -E '(__pycache__|\.py[co]$)' || true)"
          echo 'P04_V260_PRIOR_FUNCTION_DATA_FRESH_INSTALL_CARRY_FORWARD_VALID'

      - name: Build lock and validate V2.6.0 formal Candidate artifacts
        working-directory: vf-infra
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf build/v260-candidate
          python3 scripts/build-v260-candidate-artifacts.py --output build/v260-candidate | tee /tmp/v260-artifact-build.txt
          test "$(tr -d '\r\n' < build/v260-candidate/runtime/VERSION.txt)" = "$TARGET_VERSION"
          python3 scripts/validate-online-atomic-package.py --runtime build/v260-candidate/runtime --zip build/v260-candidate/update-set/VF_Infra_V2.6.0_UPDATE.zip --version 2.6.0 | tee /tmp/v260-online-package.txt
          python3 - <<'PY'
          from pathlib import Path
          import json,re,stat,zipfile
          z=Path('build/v260-candidate/VF_Infra_V2.6.0_FULL.zip')
          dir_forbidden=re.compile(r'(^|/)(private|private_data|backup|backups|cache|caches|session|sessions|log|logs|temp|tmp|storage/private|update/downloads)(/|$)',re.I)
          archive_forbidden=re.compile(r'\.(sqlite3?|db|zip|tar|tgz|gz|7z|rar)$',re.I)
          secret=[re.compile(rb'-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----'),re.compile(rb'\bAKIA[0-9A-Z]{16}\b'),re.compile(rb'\bgh[pousr]_[A-Za-z0-9_]{30,}\b')]
          with zipfile.ZipFile(z) as a:
              for i in a.infolist():
                  n=i.filename.replace('\\','/').strip('/')
                  if not n or '..' in Path(n).parts or n.lower() in {'config.php','.env','.env.local'} or dir_forbidden.search(n) or archive_forbidden.search(n): raise SystemExit('FULL_PATH_PRIVATE_GATE_FAIL '+n)
                  if ((i.external_attr>>16)&0o170000)==stat.S_IFLNK: raise SystemExit('FULL_SYMLINK_GATE_FAIL '+n)
                  if i.is_dir(): continue
                  d=a.read(i)
                  if d.startswith(b'SQLite format 3\x00'): raise SystemExit('FULL_DB_BINARY_GATE_FAIL '+n)
                  if any(p.search(d) for p in secret): raise SystemExit('FULL_SECRET_GATE_FAIL '+n)
          package=json.loads(Path('build/v260-candidate/update-set/PACKAGE_MANIFEST.json').read_text(encoding='utf-8'))
          assert package['maintenance_only'] is False
          assert package['release_kind']=='product_experience_generation'
          assert package['product_experience_generation_change'] is True
          assert package['candidate_phase']=='FORMAL_CANDIDATE'
          assert package['allowed_source_versions']==['2.5.8']
          print('P04_V260_FULL_PATH_SECRET_PRIVATE_DATA_PACKAGE_IDENTITY_PASS')
          PY
          echo 'P04_V260_FORMAL_ARTIFACT_BUILD_PASS'

      - name: Permanent FULL runtime vs UPDATE result source exact gate
        working-directory: vf-infra
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/octet-stream' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${TARGET_REPOSITORY}/releases/assets/${V258_FULL_ASSET_ID}" -o /tmp/VF_Infra_V2.5.8_FULL.zip
          echo "$V258_FULL_SHA256  /tmp/VF_Infra_V2.5.8_FULL.zip" | sha256sum -c -
          python3 scripts/full-runtime-vs-update-result-source-exact-gate.py --baseline-full /tmp/VF_Infra_V2.5.8_FULL.zip --candidate-full build/v260-candidate/VF_Infra_V2.6.0_FULL.zip --candidate-update build/v260-candidate/update-set/VF_Infra_V2.6.0_UPDATE.zip | tee /tmp/v260-source-exact.txt
          grep -q 'FULL_RUNTIME_VS_UPDATE_RESULT_SOURCE_EXACT_PASS' /tmp/v260-source-exact.txt
          echo 'P04_V260_FULL_RUNTIME_VS_UPDATE_RESULT_SOURCE_EXACT_PASS'

      - name: Install Playwright Chromium
        working-directory: vf-infra
        shell: bash
        run: |
          set -Eeuo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Existing V2.5.8 browser contract on V2.6.0 Candidate plus backup restore
        working-directory: vf-infra
        shell: bash
        run: |
          set -Eeuo pipefail
          TMP="$(mktemp -d -t vf-infra-v260-v258-compat-XXXXXX)"; WEB="$TMP/site"; LOG="$TMP/php-server.log"; PORT=18998; PID=''
          cleanup(){ if [[ -n "$PID" ]] && kill -0 "$PID" 2>/dev/null; then kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true; fi; rm -rf "$TMP"; rm -f tests/e2e/v260-v258-compat.generated.mjs; }
          trap cleanup EXIT
          cp -a build/v260-candidate/runtime "$WEB"
          python3 - <<'PY'
          from pathlib import Path
          src=Path('tests/e2e/v258-personal-console.mjs').read_text(encoding='utf-8')
          src=src.replace('VF Infra V2.5.8 Candidate Gate','VF Infra V2.6.0 Compatibility Gate')
          old="assert(version==='2.5.8',`expected 2.5.8 got ${version}`);"
          new="assert(version==='2.6.0',`expected 2.6.0 got ${version}`);"
          if old not in src: raise SystemExit('V258_BROWSER_VERSION_SENTINEL_DRIFT')
          Path('tests/e2e/v260-v258-compat.generated.mjs').write_text(src.replace(old,new),encoding='utf-8')
          PY
          php -S "127.0.0.1:$PORT" -t "$WEB" >"$LOG" 2>&1 & PID=$!
          READY=0; for _ in $(seq 1 80); do if ! kill -0 "$PID" 2>/dev/null; then cat "$LOG" >&2; exit 11; fi; if curl -fsS "http://127.0.0.1:$PORT/setup.php" >/dev/null 2>&1; then READY=1; break; fi; sleep .1; done
          test "$READY" = 1
          ADMIN_CREDENTIAL="$(php -r 'echo "Vf" . bin2hex(random_bytes(18)) . "Aa1";')"
          VF_INFRA_E2E_BASE_URL="http://127.0.0.1:$PORT" VF_INFRA_E2E_ADMIN_CREDENTIAL="$ADMIN_CREDENTIAL" node tests/e2e/v260-v258-compat.generated.mjs
          VF_INFRA_E2E_ADMIN_CREDENTIAL="$ADMIN_CREDENTIAL" php tests/integration/backup_restore_smoke_v258.php "$WEB"
          if grep -Eqi 'PHP (Fatal error|Parse error|Warning):|Uncaught (Error|Exception)' "$LOG"; then cat "$LOG" >&2; exit 75; fi
          echo 'P04_V260_EXISTING_V258_BROWSER_BACKUP_RESTORE_COMPAT_PASS'

      - name: V2.6.0 User Task Browser Responsive and Visual Regression capture
        working-directory: vf-infra
        shell: bash
        run: |
          set -Eeuo pipefail
          TMP="$(mktemp -d -t vf-infra-v260-user-task-XXXXXX)"; WEB="$TMP/site"; LOG="$TMP/php-server.log"; PORT=18997; PID=''
          cleanup(){ if [[ -n "$PID" ]] && kill -0 "$PID" 2>/dev/null; then kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true; fi; rm -rf "$TMP"; }
          trap cleanup EXIT
          cp -a build/v260-candidate/runtime "$WEB"
          php -S "127.0.0.1:$PORT" -t "$WEB" >"$LOG" 2>&1 & PID=$!
          READY=0; for _ in $(seq 1 80); do if ! kill -0 "$PID" 2>/dev/null; then cat "$LOG" >&2; exit 11; fi; if curl -fsS "http://127.0.0.1:$PORT/setup.php" >/dev/null 2>&1; then READY=1; break; fi; sleep .1; done
          test "$READY" = 1
          ADMIN_CREDENTIAL="$(php -r 'echo "Vf" . bin2hex(random_bytes(18)) . "Aa1";')"
          rm -rf build/v260-candidate-evidence
          VF_INFRA_E2E_BASE_URL="http://127.0.0.1:$PORT" VF_INFRA_E2E_ADMIN_CREDENTIAL="$ADMIN_CREDENTIAL" VF_INFRA_E2E_WEB_ROOT="$WEB" VF_INFRA_V260_FIXTURE="$PWD/tests/fixtures/v260-user-task-fixture.php" VF_INFRA_UI_EVIDENCE_DIR="build/v260-candidate-evidence" node tests/e2e/v260-formal-candidate.mjs | tee /tmp/v260-browser.txt
          grep -q '"user_task":"PASS"' /tmp/v260-browser.txt
          for f in candidate-1440-dashboard.png candidate-1440-domains.png candidate-1440-system-update.png candidate-390-dashboard.png candidate-390-domains.png USER_TASK_GATE.json visual-metrics.json; do test -f "build/v260-candidate-evidence/$f"; done
          if grep -Eqi 'PHP (Fatal error|Parse error|Warning):|Uncaught (Error|Exception)' "$LOG"; then cat "$LOG" >&2; exit 75; fi
          echo 'P04_V260_USER_TASK_BROWSER_RESPONSIVE_VISUAL_CAPTURE_PASS'

      - name: Build public-safe evidence and encrypt private Candidate artifacts
        working-directory: vf-infra
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT=/tmp/p04-v260-formal-candidate-evidence; ENC=/tmp/p04-v260-encrypted-artifacts
          rm -rf "$OUT" "$ENC"; mkdir -p "$OUT" "$ENC"
          COMMIT="$(git rev-parse HEAD)"; TREE="$(git rev-parse HEAD^{tree})"
          python3 - "$COMMIT" "$TREE" <<'PY'
          from pathlib import Path
          import json,sys
          commit,tree=sys.argv[1:]
          manifest=json.loads(Path('build/v260-candidate/V260_CANDIDATE_ARTIFACT_MANIFEST.json').read_text(encoding='utf-8'))
          result={
            'project':'P04 · VF Infra','version':'2.6.0','schema':14,'migration':'NONE',
            'candidate_branch':'candidate/v2.6.0-mature-personal-console','candidate_commit':commit,'candidate_tree':tree,
            'runtime_files':manifest['runtime_file_count'],'runtime_fingerprint':manifest['runtime_fingerprint'],
            'source_manifest_count':manifest['source_manifest_count'],'source_manifest_sha256':manifest['source_manifest_sha256'],
            'function':'PASS_CARRIED_FORWARD','security':'PASS','data':'PASS_CARRIED_FORWARD','fresh_install':'PASS_CARRIED_FORWARD',
            'backup_restore':'PASS','existing_v2_5_8_compatibility':'PASS','user_task':'PASS','browser':'PASS','responsive':'PASS',
            'visual_regression':'PASS','full_runtime_vs_update_result_source_exact':'PASS','formal_artifact':'PASS',
            'product_failure':'NONE','project_block':'NONE','ready_for_release':'YES',
            'production_write':0,'main_write':0,'tag_write':0,'release_write':0,'core_updates_write':0,
            'carry_forward_from':{'run':32000287243,'source_commit':'a9878e9b09ffacc2afdc7b96c36e1912db1d32b5','reason':'only V2.6.0 artifact builder/identity scripts changed; candidate runtime unchanged'},
            'artifacts':manifest['artifacts'],'package_identity':manifest['package_identity']
          }
          Path('/tmp/p04-v260-formal-candidate-evidence/CANDIDATE_GATE_RESULT.json').write_text(json.dumps(result,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,sort_keys=True))
          PY
          cp /tmp/v260-continuation-diff.txt "$OUT/CANDIDATE_CONTINUATION_DIFF.txt"
          cp /tmp/v260-source-exact.txt "$OUT/FULL_RUNTIME_VS_UPDATE_RESULT_SOURCE_EXACT.txt"
          cp /tmp/v260-artifact-build.txt "$OUT/ARTIFACT_BUILD.txt"
          cp build/v260-candidate/V260_CANDIDATE_ARTIFACT_MANIFEST.json "$OUT/"
          cp build/v260-candidate-evidence/* "$OUT/"
          printf '%s\n' 'FUNCTION=PASS_CARRIED_FORWARD' 'SECURITY=PASS' 'DATA=PASS_CARRIED_FORWARD' 'FRESH_INSTALL=PASS_CARRIED_FORWARD' 'V258_COMPATIBILITY=PASS' 'BACKUP_RESTORE=PASS' 'USER_TASK=PASS' 'BROWSER=PASS' 'RESPONSIVE=PASS' 'VISUAL_REGRESSION=PASS' 'FULL_RUNTIME_VS_UPDATE_RESULT_SOURCE_EXACT=PASS' 'FORMAL_ARTIFACT=PASS' 'PRODUCTION_WRITE=0' 'MAIN_WRITE=0' 'TAG_WRITE=0' 'RELEASE_WRITE=0' 'CORE_UPDATES_WRITE=0' 'READY_FOR_RELEASE=YES' > "$OUT/GATE_SUMMARY.txt"
          tar -C build/v260-candidate -czf /tmp/V260_FORMAL_CANDIDATE_ARTIFACTS.tar.gz VF_Infra_V2.6.0_FULL.zip update-set/VF_Infra_V2.6.0_UPDATE.zip update-set/VF_Infra_V2.6.0_ATOMIC.zip update-set/repair-v2.6.0.php update-set/PACKAGE_MANIFEST.json update-set/PRODUCTION_SOURCE_MANIFEST_EXPECTED.txt update-set/SHA256SUMS.txt V260_CANDIDATE_ARTIFACT_MANIFEST.json
          cat >/tmp/v260-artifact-public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAsiqkyIEOi191EYo4pJno
          S5FFRHgjKuDH3WiPXdTQDvTzZrrux+jJWaxeZYQFFHo9bsEUlfLZDUZmp4N35WnQ
          o867LLe/KvD2NafTS1O+Kxxyq25jjRexMo+Syj6dE3mYM6nOTYR4kj9PIVAll9P5
          HAXjiRGQ5eukpBwRQ/6GyNfBw3brRpItuRdsyOXS+WJeW5qtEbJ+4OnwBBTIl4wQ
          KbdgY8ksySzaK35K6955UN+T9LmWd5MSzIivz2aWO1IAXwaEXJ2wDzVTxQ7JOVB7
          ipgQRy/Ox5JEuZovycizA2RxpHu8lS+1KPyTsVneQSIMx++NPl4joU63PQzPZ8oc
          A+ifazgmV3bIorT5JwXXsdTmwozk6ue2yf1B/SKwvRzqblMQNMWIgFVyllKl9y3P
          pJYMZxpDNEgPWL3nvcBvq9hXLl/wiRyENCeh/nM558zgQbxI4fEx/LuGGYes/mCg
          vTI324Z9UekX1V7b/N8nTJTgqJd7Qw9dHkfuLviA5eQNAgMBAAE=
          -----END PUBLIC KEY-----
          PEM
          openssl rand -base64 48 > /tmp/v260-artifact-passphrase.txt
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -pass file:/tmp/v260-artifact-passphrase.txt -in /tmp/V260_FORMAL_CANDIDATE_ARTIFACTS.tar.gz -out "$ENC/V260_FORMAL_CANDIDATE_ARTIFACTS.enc"
          openssl pkeyutl -encrypt -pubin -inkey /tmp/v260-artifact-public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in /tmp/v260-artifact-passphrase.txt -out "$ENC/V260_FORMAL_CANDIDATE_KEY.enc"
          sha256sum "$ENC"/* > "$ENC/ENCRYPTED_SHA256SUMS.txt"
          printf '%s\n' 'Encryption: AES-256-CBC + PBKDF2(200000)' 'Key wrapping: RSA-3072 OAEP SHA-256' 'Plaintext Candidate release artifacts are not uploaded to the public Runner.' > "$ENC/ENCRYPTION_README.txt"
          rm -f /tmp/v260-artifact-passphrase.txt /tmp/V260_FORMAL_CANDIDATE_ARTIFACTS.tar.gz /tmp/v260-artifact-public.pem
          echo 'P04_V260_FORMAL_CANDIDATE_GATE_PASS'

      - name: Remove private source before artifact upload
        if: always()
        shell: bash
        run: |
          rm -rf vf-infra
          test ! -e vf-infra

      - name: Upload public-safe V2.6.0 Candidate evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: P04-VF-Infra-V2.6.0-Formal-Candidate-Evidence
          path: /tmp/p04-v260-formal-candidate-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Upload encrypted V2.6.0 Candidate release artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: P04-VF-Infra-V2.6.0-Encrypted-Candidate-Artifacts
          path: /tmp/p04-v260-encrypted-artifacts
          if-no-files-found: error
          retention-days: 14
