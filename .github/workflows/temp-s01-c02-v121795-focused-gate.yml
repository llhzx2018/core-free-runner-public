name: TEMP S01-C02 Ops 1.21.795 Focused Gate

on:
  push:
    branches:
      - temp/s01-c02-v121795-focused-gate-20260903

permissions:
  contents: read

concurrency:
  group: temp-s01-c02-v121795-focused-gate-20260903
  cancel-in-progress: true

jobs:
  focused-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPS_SHA: 12165a4bdf036f9b6cca658e90cfc39f036a3670
      EVIDENCE_DIR: /tmp/vf-s01-c02-v121795-evidence
    steps:
      - name: Checkout exact Ops candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 12165a4bdf036f9b6cca658e90cfc39f036a3670
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: ops

      - name: Verify exact source and PHP syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          test "$(git -C ops rev-parse HEAD)" = "$OPS_SHA"
          test "$(tr -d '\r\n' < ops/VERSION)" = '1.21.795'
          grep -Fq ' * Version: 1.21.795' ops/vf-ops.php
          grep -Fq "define('VF_OPS_VERSION', '1.21.795')" ops/vf-ops.php
          php -l ops/includes/plugins-governance/contract.php
          php -l ops/includes/plugins-governance/migration.php
          php -l ops/.github/phase3/v121795-backup-provider-policy-contract.php

      - name: Run backup-provider policy migration regression
        shell: bash
        run: |
          set -Eeuo pipefail
          php ops/.github/phase3/v121795-backup-provider-policy-contract.php | tee "$EVIDENCE_DIR/provider-policy-contract.txt"
          grep -Fxq 'PASS_V121795_BACKUP_PROVIDER_POLICY_RECONCILIATION' "$EVIDENCE_DIR/provider-policy-contract.txt"

      - name: Verify bounded diff and forbidden writes
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C ops fetch --depth=1 origin 22c39a988755defb71edd2b23b7777cfb8166b55
          mapfile -t changed < <(git -C ops diff --name-only 22c39a988755defb71edd2b23b7777cfb8166b55.."$OPS_SHA")
          printf '%s\n' "${changed[@]}" | tee "$EVIDENCE_DIR/changed-files.txt"
          test "${#changed[@]}" -eq 5
          for expected in \
            .github/phase3/v121795-backup-provider-policy-contract.php \
            VERSION \
            includes/plugins-governance/contract.php \
            includes/plugins-governance/migration.php \
            vf-ops.php; do
            printf '%s\n' "${changed[@]}" | grep -Fxq "$expected"
          done
          if grep -REn --include='*.php' 'activate_plugin\(|deactivate_plugins\(|delete_plugins\(|new[[:space:]]+Plugin_Upgrader|update_plugins\(' \
             ops/includes/plugins-governance/contract.php ops/includes/plugins-governance/migration.php; then
            echo 'FORBIDDEN_PLUGIN_STATE_WRITE' >&2
            exit 1
          fi

      - name: Seal evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$EVIDENCE_DIR/S01_C02_V121795_FOCUSED_GATE.txt" <<EOF
          S01_C02_V121795_FOCUSED_GATE=PASS
          OPS_SHA=$OPS_SHA
          OPS_VERSION=1.21.795
          GOVERNANCE_SCHEMA=1.2.1
          WPVIVID_POLICY=SITE_AUDIT_REQUIRED
          WPVIVID_OWNER=WPvivid Backup Plugin
          JDGG_POLICY=REQUIRED_PINNED
          UNKNOWN_PLUGIN_AUTO_REGISTER=NO
          EXISTING_POLICY_OVERWRITE=NO
          EVIDENCE_INVALIDATION=PASS
          MIGRATION_IDEMPOTENCE=PASS
          AUTOMATIC_DEACTIVATION=NO
          AUTOMATIC_DELETION=NO
          PRODUCTION_WRITE=NO
          EOF

      - name: Upload public-safe focused evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-v121795-focused-gate-${{ github.run_id }}
          path: /tmp/vf-s01-c02-v121795-evidence/
          if-no-files-found: warn
          retention-days: 14
