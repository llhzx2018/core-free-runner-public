name: P01 Multi-Surface Canonical Preflight 460
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-main460-canonical-preflight-20261025.yml'
permissions:
  contents: read
jobs:
  canonical-regression:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_REPOSITORY: llhzx2018/vf-start
      CANDIDATE_SHA: 5933c5bf374cc6a6bb0b977235643a471f977081
      BASELINE_TAG: v2.47.460
    steps:
      - name: Prepare ephemeral PHP test environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, curl, mbstring, zip, gd, openssl
          coverage: none
      - name: Checkout exact candidate and formal baseline privately
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN" || { echo P01_CANONICAL_BLOCKED_SECRET; exit 11; }
          for dir in current baseline; do
            git init -q "$dir"
            git -C "$dir" remote add origin "https://x-access-token:$READ_TOKEN@github.com/$SOURCE_REPOSITORY.git"
          done
          git -C current -c advice.detachedHead=false fetch -q --depth 1 origin "$CANDIDATE_SHA"
          git -C current checkout -q --detach FETCH_HEAD
          test "$(git -C current rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C baseline -c advice.detachedHead=false fetch -q --depth 1 origin "refs/tags/$BASELINE_TAG"
          git -C baseline checkout -q --detach FETCH_HEAD
          git -C current remote remove origin
          git -C baseline remote remove origin
          test "$(tr -d '\r\n ' < current/VERSION)" = "2.47.460"
          echo "P01_CANDIDATE_EXACT_SOURCE=$CANDIDATE_SHA"
          echo "P01_CANONICAL_BASELINE_TAG=$BASELINE_TAG"
      - name: Multi-surface PHP and JS syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          for file in \
            src/app/ChannelLibraryPage.php \
            src/app/CourseLibraryPage.php \
            src/app/FunctionalHome.php \
            src/app/FunctionalWorkspaceShell.php \
            src/app/ProjectActionCenterPage.php \
            src/app/SoftwareWorkspaceHome.php \
            src/app/ToolSceneDetail.php \
            src/app/ToolWorkspaceHome.php \
            src/app/TopicLibraryPage.php \
            src/app/WatchMediaLibraryPage.php \
            src/music-home.php; do
            php -l "current/$file" >/dev/null
          done
          for file in \
            src/assets/course-experience.js \
            src/assets/local-subsite-management.js \
            src/assets/software-group-editor.js \
            src/assets/software-workspace.js; do
            node --check "current/$file"
          done
          echo P01_MULTI_SURFACE_PHP_JS_LINT=PASS
      - name: Compare complete canonical unit regression against stable tag
        shell: bash
        run: |
          set -Eeuo pipefail
          bash current/tests/canonical_release_regression.sh current baseline --require-zero-debt
          echo P01_CANONICAL_PREFLIGHT=PASS
      - name: Erase transient private source
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          for dir in current baseline; do
            if [ -d "$dir" ]; then
              git -C "$dir" remote remove origin 2>/dev/null || true
              rm -rf "$dir"
            fi
            test ! -e "$dir"
          done
          echo P01_PRIVATE_SOURCE_CLEANUP=PASS
