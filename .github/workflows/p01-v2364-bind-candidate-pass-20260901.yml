name: P01 V2.36.4 Bind Candidate PASS
on:
  push:
    branches: [release/p01-v2364-candidate-20260901]
    paths: [.github/workflows/p01-v2364-bind-candidate-pass-20260901.yml]
permissions:
  contents: read
jobs:
  bind:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify live Candidate Readiness R2 evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,urllib.request
          run=json.load(urllib.request.urlopen('https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/runs/33518274633'))
          assert run['name']=='P01 V2.36.4 Candidate Readiness R2' and run['conclusion']=='success'
          arts=json.load(urllib.request.urlopen('https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/runs/33518274633/artifacts'))['artifacts']
          a=[x for x in arts if x['id']==9804570473][0]
          assert a['digest']=='sha256:d092acb2892308d3c481196e77c4edd0a2ed720bff3458067d6ad85acf7cdddb' and not a['expired']
          print('LIVE_CANDIDATE_READINESS_R2=PASS')
          PY
      - name: Checkout topology-clean candidate branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: release/v2.36.4-formal-source-r2-20260901
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
      - name: Bind exact Candidate Readiness PASS
        shell: bash
        run: |
          set -Eeuo pipefail
          C=2e5f09e1c75eeaaa6d3ab3d98edf2773d30e0062
          T=54dc8266d28f907991bb8d0a1be549a3890c3b6a
          RT=e1ee914a6d9e61bac7931b1f5363a8c7e24e925a
          P=718e043e3715ef7b21849bc08634fca89bf92c1f
          D=5615d19b07303132e8fc2e374de1236a37f3cb16
          test "$(git rev-parse HEAD)" = "$C"
          test "$(git rev-parse HEAD^{tree})" = "$T"
          test "$(git rev-parse HEAD:src)" = "$RT"
          test "$(git rev-parse HEAD^)" = "$P"
          LIVE=$(git ls-remote origin refs/heads/develop | cut -f1); test "$LIVE" = "$D"
          git fetch -q origin "$LIVE"
          test "$(git rev-parse FETCH_HEAD:src/assets/workspace-domain-nav.css)" = "$(git rev-parse HEAD:src/assets/workspace-domain-nav.css)"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('VF_PROJECT.json'); d=json.loads(p.read_text())
          if d.get('candidate_version')!='2.36.4' or d.get('production_version')!='2.36.3' or d.get('schema_version')!='2026082901': raise SystemExit('candidate authority drift')
          rc=d.get('v2_36_4_release_candidate') or {}
          if rc.get('formal_parent')!='718e043e3715ef7b21849bc08634fca89bf92c1f' or rc.get('product_pr')!=186: raise SystemExit('candidate contract drift')
          gate={
            'state':'PASS',
            'candidate':'2e5f09e1c75eeaaa6d3ab3d98edf2773d30e0062',
            'candidate_tree':'54dc8266d28f907991bb8d0a1be549a3890c3b6a',
            'runtime_tree':'e1ee914a6d9e61bac7931b1f5363a8c7e24e925a',
            'predecessor':'718e043e3715ef7b21849bc08634fca89bf92c1f',
            'predecessor_version':'2.36.3','schema':'2026082901','schema_change':False,'migration':None,
            'runtime_delta_count':3,
            'runtime_changed':['VERSION.txt','app/bootstrap.php','assets/workspace-domain-nav.css'],
            'runtime_added':[],'runtime_removed':[],
            'candidate_readiness_run':33518274633,'artifact':9804570473,
            'artifact_sha256':'d092acb2892308d3c481196e77c4edd0a2ed720bff3458067d6ad85acf7cdddb',
            'full_zip_bytes':587178,'full_zip_sha256':'dd0d25e8eacb367305b14cc830363539b0819a055a3b01f1333b79a8104dbe83',
            'update_zip_bytes':1236989,'update_zip_sha256':'3b0754d6c089baa0249064ba5683732a9784fc397b8971b97a30dda3c1ebde24',
            'repair_php_bytes':3592533,'repair_php_sha256':'14b12da6d14d53aa5b3fc43b3578efb323da7736ecef861782d1d0dfce543385',
            'candidate_json_bytes':567,'candidate_json_sha256':'d862789a26d343bad20b23edd26adeb65bb8354260093fde63c8e6b109fe1ad0',
            'deterministic_artifacts':'PASS','atomic_upgrade':'V2.36.3 -> V2.36.4 PASS','data_preservation':'PASS','fresh_install':'PASS',
            'anonymous_grid':'390 + 1319 + 1440 / BEFORE LOGIN + AUTHENTICATED + LOGOUT / PASS',
            'one_frontend':'PASS','sticky_overlap':'PASS','sqlite_integrity':'PASS','foreign_key_check':'0',
            'visual_readback':'PASS / 1319 anonymous Start screenshot manually reviewed; content column restored',
            'product_pr':186,'product_merge':'0a48be7a99d19fe8485b14b87cc5236682d4e24d',
            'eof_normalization_pr':187,'develop_exact_css_identity':'PASS',
            'release_published':False,'main_write':False,'core_updates_write':False,'owner_production_write':False
          }
          d['v2_36_4_candidate_gate']=gate
          d['current_phase']='V2.36.4 CANDIDATE READINESS R2 PASS / FORMAL BIND GATE PENDING'
          d['candidate_state']='CANDIDATE READINESS R2 PASS / FORMAL BIND GATE PENDING'
          d['develop_state']='V2.36.4 PATCH MERGED + EOF NORMALIZED / FORMAL SOURCE BINDING'
          d['formal_release_state']='V2.36.3 PUBLISHED + OWNER INSTALLED / V2.36.4 CANDIDATE PASS / NOT YET RELEASED'
          d['current_authority']='Owner Production V2.36.3 / Published Latest V2.36.3 / V2.36.4 Candidate Readiness R2 PASS / Formal Bind pending'
          d['next_action']='Run independent V2.36.4 Formal Bind Gate. Do not write main, Tag, GitHub Release, core-updates or Owner Production before subsequent gates pass.'
          rc.update({'candidate_source':gate['candidate'],'candidate_tree':gate['candidate_tree'],'runtime_tree':gate['runtime_tree'],'candidate_readiness_run':gate['candidate_readiness_run'],'candidate_readiness_artifact':gate['artifact'],'candidate_readiness_artifact_sha256':gate['artifact_sha256'],'candidate_readiness_state':'PASS','state':'CANDIDATE READINESS R2 PASS / FORMAL BIND PENDING'})
          d['v2_36_4_release_candidate']=rc
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          python3 -m json.tool VF_PROJECT.json >/dev/null
          git diff --check
          test "$(git diff --name-only | tr '\n' ' ')" = 'VF_PROJECT.json '
          test "$(git rev-parse HEAD:src)" = "$RT"
          git config user.name VictorForge; git config user.email llhzx2018@gmail.com
          git add VF_PROJECT.json
          git commit -m 'release(P01): bind V2.36.4 candidate PASS'
          echo "BOUND_SOURCE=$(git rev-parse HEAD)"
          echo "BOUND_TREE=$(git rev-parse HEAD^{tree})"
          echo "BOUND_RUNTIME_TREE=$(git rev-parse HEAD:src)"
          git push origin HEAD:release/v2.36.4-formal-source-r2-20260901
