name: P07 Care rc44 canonical compact-resource gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/p07-system-care/0.1.0-rc44/**'
      - 'installers/p07-system-care.sh'
      - 'installers/p07-toolbox.sh'
      - 'tests/test_p07_resource_brief.py'
      - '.github/workflows/p07-care-rc44-resource-compact-gate.yml'
permissions:
  contents: read
jobs:
  compact:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate package and isolated safety/UX test
        shell: bash
        run: |
          set -Eeuo pipefail
          pkg='packages/p07-system-care/0.1.0-rc44'
          test "$(cat "$pkg/VERSION")" = '0.1.0-rc44'
          test "$(git hash-object "$pkg/MANIFEST.gitblob")" = '933fdd4b849b219ee3d7ff0ff9dd601d3782200a'
          (cd "$pkg" && while read -r hash file; do test "$(git hash-object "$file")" = "$hash"; done < MANIFEST.gitblob)
          bash -n "$pkg/vf-system-care.sh" "$pkg/resource-apply.sh" installers/p07-system-care.sh installers/p07-toolbox.sh
          python3 -m py_compile "$pkg/lib/resource_brief.py"
          python3 -m unittest discover -s tests -p test_p07_resource_brief.py -v
          grep -Fq 'resource_brief.py" overview' "$pkg/vf-system-care.sh"
          grep -Fq 'resource_brief.py" plan' "$pkg/resource-apply.sh"
          grep -Fq 'resource_brief.py" result' "$pkg/resource-apply.sh"
          grep -Fq 'python3 "$ENGINE" apply --mode balanced --confirm APPLY_RESOURCE_PROFILE --json' "$pkg/resource-apply.sh"
          grep -Fq '确认按上述方案应用？[y/N]' "$pkg/resource-apply.sh"
          test "$(grep -Fc 'resource_brief.py" overview' "$pkg/vf-system-care.sh")" = 1
          test "$(grep -Fc 'resource_brief.py" plan' "$pkg/resource-apply.sh")" = 1
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc51"' installers/p07-toolbox.sh
          grep -Fq 'VF_NODE_EXPECTED="0.1.0-rc13"' installers/p07-toolbox.sh
          grep -Fq 'VPS_AUDIT_EXPECTED="V2.1.0"' installers/p07-toolbox.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release84"' installers/p07-toolbox.sh
          echo P07_RC44_RESOURCE_CONSISTENCY=PASS
      - name: Synthetic TTY, actual overview and apply path separation
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$(mktemp -d -t p07-rc44.XXXXXX)"
          trap 'rm -rf "$root"' EXIT
          p='packages/p07-system-care/0.1.0-rc44'
          mkdir -p "$root/lib"
          cp "$p/vf-system-care.sh" "$root/"
          cp "$p/lib/common.sh" "$root/lib/"
          echo 0.1.0-rc44 > "$root/VERSION"
          cat > "$root/lib/resource_brief.py" <<'PY'
          import sys
          if sys.argv[1] != "overview": raise SystemExit(99)
          print("服务器      1 核 · 内存 1966 MB")
          print("适用性      符合初步条件，执行时还需复核")
          PY
          cat > "$root/resource-apply.sh" <<'SH'
          #!/usr/bin/env bash
          printf '确认按上述方案应用？[y/N]：'
          read -r answer
          if [[ "$answer" == y ]]; then echo '模拟安全应用执行完成'; fi
          SH
          chmod +x "$root"/*.sh
          printf '4\n\n0\n' | timeout 20s env NO_COLOR=1 P07_FORCE_INTERACTIVE=1 bash "$root/vf-system-care.sh" menu >"$root/return.txt" 2>&1
          grep -Fq '适用性' "$root/return.txt"
          ! grep -Fq '模拟安全应用执行完成' "$root/return.txt"
          printf '4\nA\ny\n\n0\n' | timeout 20s env NO_COLOR=1 P07_FORCE_INTERACTIVE=1 bash "$root/vf-system-care.sh" menu >"$root/apply.txt" 2>&1
          grep -Fq '模拟安全应用执行完成' "$root/apply.txt"
          test "$(grep -Fc '服务器      1 核 · 内存 1966 MB' "$root/apply.txt")" = 1
          echo P07_RC44_ONE_SCREEN_AND_CONFIRMATION=PASS
