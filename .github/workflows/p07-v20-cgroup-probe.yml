name: P07 V20 Cgroup Resource Probe

on:
  push:
    branches: [experiment/p07-vps-audit-v20]
    paths: [.github/workflows/p07-v20-cgroup-probe.yml]

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read-only cgroup signals
        run: |
          set -u
          echo '=== mount ==='
          mount | grep cgroup || true
          echo '=== v2 ==='
          for f in /sys/fs/cgroup/cpu.max /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.swap.max /sys/fs/cgroup/pids.max; do
            printf '%s = ' "$f"; cat "$f" 2>/dev/null || echo unavailable
          done
          echo '=== v1 ==='
          for f in /sys/fs/cgroup/cpu/cpu.cfs_quota_us /sys/fs/cgroup/cpu/cpu.cfs_period_us /sys/fs/cgroup/memory/memory.limit_in_bytes /sys/fs/cgroup/memory/memory.memsw.limit_in_bytes; do
            printf '%s = ' "$f"; cat "$f" 2>/dev/null || echo unavailable
          done
          echo '=== proc ==='
          grep -E 'MemTotal|SwapTotal' /proc/meminfo || true
          nproc || true
