name: P07 M01 independent V2Ray manager install (NO node provisioning)
on:
  push:
    branches: [feat/p07-m01-independent-manager-20261112]
  pull_request:
    branches: [main]
    paths:
      - 'installers/p07-vf-node-independent-rc13.sh'
      - 'tests/test_p07_m01_independent.py'
      - '.github/workflows/p07-m01-independent-manager-20261112.yml'
permissions:
  contents: read
jobs:
  isolated-manager:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Real disposable standalone management runtime and sibling identities
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          python3 -B -m unittest discover -s tests -p 'test_p07_m01_independent.py' -v
          python3 -B -m unittest discover -s tests -p 'test_p07_m01_independent_manager.py' -v
          sudo env P07_M01_DISPOSABLE_RUNNER=1 python3 -B -m unittest discover -s tests -p 'test_p07_m01_independent_manager.py' -v
          for module in m02 m03 m04 m05; do
            sudo mkdir -p "/opt/vfops-modules/$module"
            printf '%s-UNCHANGED\n' "$module" | sudo tee "/opt/vfops-modules/$module/BUILD_ID" >/dev/null
          done
          sudo find /opt/vfops-modules -mindepth 2 -maxdepth 2 -name BUILD_ID -exec sha256sum '{}' \; | sort >/tmp/p07-m01-other-before
          sudo bash installers/p07-vf-node-independent-rc13.sh install
          test "$(readlink /opt/vfops-modules/m01/current)" = 'releases/0.1.0-rc13'
          NO_COLOR=1 bash /opt/vfops-modules/m01/current/vf-node.sh --version | grep -F '0.1.0-rc13'
          sudo bash installers/p07-vf-node-independent-rc13.sh install
          sudo find /opt/vfops-modules -mindepth 2 -maxdepth 2 -name BUILD_ID -exec sha256sum '{}' \; | sort >/tmp/p07-m01-other-after
          diff -u /tmp/p07-m01-other-before /tmp/p07-m01-other-after
          echo P07_M01_MANAGER_ONLY_INSTALLED=PASS
          echo P07_M02_M03_M04_M05_UNCHANGED=PASS
      - name: Simulated tampering fails closed without V2Ray/node execution
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          echo 'synthetic corruption' | sudo tee -a /opt/vfops-modules/m01/releases/0.1.0-rc13/status.sh >/dev/null
          set +e
          sudo bash installers/p07-vf-node-independent-rc13.sh install >/tmp/p07-m01-tamper.log 2>&1
          rc=$?
          set -e
          test "$rc" = 13
          grep -Fq '独立安装已阻断' /tmp/p07-m01-tamper.log
          sudo find /opt/vfops-modules -mindepth 2 -maxdepth 2 -name BUILD_ID -exec sha256sum '{}' \; | sort >/tmp/p07-m01-other-tamper
          diff -u /tmp/p07-m01-other-before /tmp/p07-m01-other-tamper
          echo P07_M01_TAMPERED_RELEASE_REFUSED=PASS
          echo P07_V2RAY_NODE_INSTALL_OR_SERVICE_START=NOT_RUN
      - name: Cleanup hosted synthetic modules
        if: always()
        shell: bash
        run: |
          sudo rm -rf /opt/vfops-modules/m01 /opt/vfops-modules/m02 /opt/vfops-modules/m03 /opt/vfops-modules/m04 /opt/vfops-modules/m05
          echo P07_HOSTED_TEST_CLEANUP=YES
