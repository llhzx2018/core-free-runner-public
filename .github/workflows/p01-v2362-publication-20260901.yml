name: P01 V2.36.2 Publication
on:
  push:
    branches: [release/p01-v2362-candidate-20260901]
    paths: [.github/workflows/p01-v2362-publication-20260901.yml]
permissions:
  actions: read
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FORMAL_SOURCE: 4fd25a5ce4383dc456e755fc2e031a861d6ff655
      FORMAL_TREE: 0f0e5329098ad5a87a4a72dbd368c88d7a44b339
      RUNTIME_TREE: 55bc3143df6ca4e8e66b3e8d3e0f01b3ec343424
      DEVELOP_EXPECTED: d3b6f4af92cbfab28df465938ea8348a35909052
      FORMAL_RUN: '33485021418'
      FORMAL_ARTIFACT: p01-v2362-formal-artifacts-33485021418
      FORMAL_DIGEST: sha256:cdab62d5664ed43f26e05e45b816a13c69c5e56c3ef728d8f418eeeb75ee69ed
      STRICT_RUN: '33485364786'
      PROMOTION_RUN: '33485493941'
      DOWNLOAD: /tmp/p01-v2362-publish-download
      ROUNDTRIP: /tmp/p01-v2362-release-roundtrip
      EVID: /tmp/p01-v2362-publication-evidence
    steps:
      - name: Download exact Formal Artifact Gate bytes
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.FORMAL_ARTIFACT }}
          path: ${{ env.DOWNLOAD }}
          repository: llhzx2018/core-free-runner-public
          run-id: ${{ env.FORMAL_RUN }}
          github-token: ${{ github.token }}
      - name: Checkout exact formal source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.FORMAL_SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01
      - name: Publish exact tag and release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVID"; rm -rf "$ROUNDTRIP"; mkdir -p "$ROUNDTRIP"
          FULL=$(find "$DOWNLOAD" -type f -name 'VF-Start-V2.36.2-FULL.zip' -print -quit); test -n "$FULL"
          PACK=$(dirname "$FULL")
          test "$(find "$PACK" -maxdepth 1 -type f | wc -l)" = 8
          for run in "$FORMAL_RUN" "$STRICT_RUN" "$PROMOTION_RUN"; do test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$run --jq .conclusion)" = success; done
          cd "$GITHUB_WORKSPACE/p01"
          test "$(git rev-parse HEAD)" = "$FORMAL_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$FORMAL_TREE"
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$FORMAL_SOURCE"
          DEV=$(git ls-remote origin refs/heads/develop | awk '{print $1}')
          test "$DEV" = "$DEVELOP_EXPECTED"
          git fetch origin "$DEV" --quiet
          git merge-base --is-ancestor "$FORMAL_SOURCE" "$DEV"
          test "$(git rev-parse "$DEV:src")" = "$RUNTIME_TREE"
          if git ls-remote --exit-code --tags origin refs/tags/v2.36.2 >/dev/null 2>&1; then echo UNEXPECTED_TAG; exit 20; fi
          if gh api repos/llhzx2018/vf-start/releases/tags/v2.36.2 >/dev/null 2>&1; then echo UNEXPECTED_RELEASE; exit 21; fi
          cd "$PACK"
          sha256sum -c SHA256SUMS.txt | tee "$EVID/sha256-check.txt"
          jq -e '.formal_source=="4fd25a5ce4383dc456e755fc2e031a861d6ff655" and .formal_tree=="0f0e5329098ad5a87a4a72dbd368c88d7a44b339" and .runtime_tree=="55bc3143df6ca4e8e66b3e8d3e0f01b3ec343424" and .version=="2.36.2" and .source_version=="2.36.1" and .schema=="2026082901" and .migration==null and .owner_production_write==false' P01-V2.36.2-FORMAL-METADATA.json >/dev/null
          test "$(sha256sum VF-Start-V2.36.2-FULL.zip | awk '{print $1}')" = 4a2defd88b5e25d8a5a431dfa00a23cea9370d9ea4f0f68255e483b25f2ff90c
          test "$(stat -c %s VF-Start-V2.36.2-FULL.zip)" = 649250
          test "$(sha256sum VF_Start_V2.36.2_UPDATE.zip | awk '{print $1}')" = 1718db148ea91987a8b3dee2474892b3df84b4b93cd8298e2e261153fa99c3ea
          test "$(stat -c %s VF_Start_V2.36.2_UPDATE.zip)" = 1396364
          test "$(sha256sum repair-v2.36.2.php | awk '{print $1}')" = 70f1221555b2d318081bead944ff1912f6e5ec9b919a2e340fb490614e33e797
          test "$(stat -c %s repair-v2.36.2.php)" = 4024813
          cp SHA256SUMS.txt "$EVID/prepublish-SHA256SUMS.txt"
          cd "$GITHUB_WORKSPACE/p01"
          git push origin "$FORMAL_SOURCE:refs/tags/v2.36.2"
          TAG=$(git ls-remote --tags origin refs/tags/v2.36.2 | awk '{print $1}')
          test "$TAG" = "$FORMAL_SOURCE"
          gh release create v2.36.2 "$PACK"/* --repo llhzx2018/vf-start --verify-tag --title 'VF Start V2.36.2' --notes 'V2.36.2 是 V2.36.1 的登录/退出可见性修复补丁。匿名访问继续只显示公开内容，并在导航、频道、影视等前台入口提供明确登录入口；管理员登录后在同一前台直接看到公开 + 私人内容、管理入口与明确退出入口，退出后立即恢复公开内容状态。没有重新引入“管理员视角 / 公开预览”双视角模型。Schema 仍为 2026082901，无 Migration。Candidate Readiness 33478737169 PASS；Formal Bind 33479052985 PASS；Formal Artifact 33485021418 PASS；Strict Fresh 33485364786 PASS；Main Promotion 33485493941 PASS。Owner Production 不由 Assistant 写入。'
          gh api repos/llhzx2018/vf-start/releases/tags/v2.36.2 > "$EVID/release.json"
          test "$(jq -r .tag_name "$EVID/release.json")" = v2.36.2
          test "$(jq -r .draft "$EVID/release.json")" = false
          test "$(jq -r .prerelease "$EVID/release.json")" = false
          test "$(jq '.assets|length' "$EVID/release.json")" = 8
          gh release download v2.36.2 --repo llhzx2018/vf-start --dir "$ROUNDTRIP"
          for f in "$PACK"/*; do n=$(basename "$f"); test -f "$ROUNDTRIP/$n"; test "$(sha256sum "$f"|awk '{print $1}')" = "$(sha256sum "$ROUNDTRIP/$n"|awk '{print $1}')"; test "$(stat -c %s "$f")" = "$(stat -c %s "$ROUNDTRIP/$n")"; done
          UPDATE_SHA=$(sha256sum "$ROUNDTRIP/VF_Start_V2.36.2_UPDATE.zip" | awk '{print $1}')
          UPDATE_BYTES=$(stat -c %s "$ROUNDTRIP/VF_Start_V2.36.2_UPDATE.zip")
          RELEASE_ID=$(jq -r .id "$EVID/release.json")
          PUBLISHED_AT=$(jq -r .published_at "$EVID/release.json")
          printf 'P01_V2362_PUBLICATION=PASS\nTAG=%s\nRELEASE_ID=%s\nPUBLISHED_AT=%s\nFULL_BYTES=649250\nFULL_SHA256=4a2defd88b5e25d8a5a431dfa00a23cea9370d9ea4f0f68255e483b25f2ff90c\nUPDATE_ASSET=VF_Start_V2.36.2_UPDATE.zip\nUPDATE_BYTES=%s\nUPDATE_SHA256=%s\nREPAIR_SHA256=70f1221555b2d318081bead944ff1912f6e5ec9b919a2e340fb490614e33e797\nFORMAL_SOURCE=%s\nFORMAL_ARTIFACT_DIGEST=%s\nSTRICT_FRESH_RUN=%s\nMAIN_PROMOTION_RUN=%s\nOWNER_PRODUCTION_WRITE=NO\n' "$TAG" "$RELEASE_ID" "$PUBLISHED_AT" "$UPDATE_BYTES" "$UPDATE_SHA" "$FORMAL_SOURCE" "$FORMAL_DIGEST" "$STRICT_RUN" "$PROMOTION_RUN" | tee "$EVID/verdict.txt"
          jq -r '.assets[] | [.name,.size,(.digest//"")] | @tsv' "$EVID/release.json" | sort > "$EVID/release-assets.tsv"
      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2362-publication-${{ github.run_id }}
          path: ${{ env.EVID }}
          if-no-files-found: error
          retention-days: 90
