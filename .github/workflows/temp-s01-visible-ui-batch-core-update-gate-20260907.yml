name: S01 Visible UI Batch Core Update External Gate

on:
  push:
    branches: [temp/s01-visible-ui-batch-core-update-gate-20260907]
    paths:
      - '.github/workflows/temp-s01-visible-ui-batch-core-update-gate-20260907.yml'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      CORE_BASE: e33835eb2607831cab26f28426b8a4e6ff1fb8be
      CORE_HEAD: f50256d32ad05b41d2ee54a11eb0eb3882f9764e
      THEME_SHA: e2a7f80d74f1c567cd468bb0c1d7c853ca94cbfd
      OPS_SHA: 371b64c66c6daca48c86af5bdf11a8022b444868
      M3U8_SHA: 023d0e82531da5c674dedeff8af5365bcd329011

    steps:
      - name: Credential boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo 'RELEASE_WRITE_USED=NO'
          echo 'PRODUCTION_WRITE_USED=NO'

      - name: Checkout exact core-updates candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CORE_HEAD }}
          token: ${{ env.READ_TOKEN }}
          path: core
          fetch-depth: 0
          persist-credentials: false

      - name: Exact three-manifest delta and canonical validation
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE_HEAD"
          git -C core diff --name-only "$CORE_BASE..$CORE_HEAD" | sort > /tmp/changed
          cat > /tmp/expected <<'EOF'
          projects/S01-C01.json
          projects/S01-C02.json
          projects/S01-C03.json
          EOF
          sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/changed
          cd core
          python3 -m json.tool projects/S01-C01.json >/dev/null
          python3 -m json.tool projects/S01-C02.json >/dev/null
          python3 -m json.tool projects/S01-C03.json >/dev/null
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php update-core/php/tests/run.php
          echo 'EXACT_THREE_MANIFEST_DELTA=PASS'
          echo 'CANONICAL_UPDATE_CORE_VALIDATION=PASS'

      - name: Three-component semantic boundary
        working-directory: core
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          c1=json.load(open('projects/S01-C01.json'))
          c2=json.load(open('projects/S01-C02.json'))
          c3=json.load(open('projects/S01-C03.json'))

          assert c1['target_version']=='1.35.16'
          assert c1['from_versions']==['1.35.8','1.35.9','1.35.10','1.35.11','1.35.12','1.35.13','1.35.14','1.35.15']
          assert c1['release_tag']=='v1.35.16'
          assert c1['asset_name']=='vf-tools-theme_V1.35.16.zip'
          assert c1['asset_bytes']==1805133
          assert c1['asset_sha256']=='b9077c362ef63e240190dd6e0f0ced78b503ad0320f021eb12943f3c4626d6fb'
          assert c1['runtime_files']==445
          assert c1['runtime_fingerprint']=='70e9f9311d0443b00e7fd6784638bd6c995752c1adbb3c32c1846c8aafb057f2'
          assert '34096243210 PASS' in c1['notes'] and '34097775613 PASS' in c1['notes']

          assert c2['target_version']=='1.21.855'
          assert c2['from_versions']==['1.21.849','1.21.850','1.21.851','1.21.852','1.21.853','1.21.854']
          assert c2['plugin_file']=='vf-ops/vf-ops.php' and c2['physical_locator']=='vf-ops/vf-ops.php'
          assert c2['canonical_locator']=='vf-tools-ops/vf-tools-ops.php' and c2['locator_cutover'] is False
          assert c2['schema_from']=='6.0.0' and c2['schema_to']=='6.0.0'
          assert c2['release_tag']=='v1.21.855'
          assert c2['asset_name']=='vf-tools-ops_V1.21.855.zip'
          assert c2['asset_bytes']==3338816
          assert c2['asset_sha256']=='a8789f9d20e252135023f88ff136b19d6c0a38c835d25bdefb9c4a9eb28d62f6'
          assert c2['runtime_files']==934 and c2['runtime_file_count']==934
          assert c2['runtime_fingerprint']=='747a19853fb39a166a36ca884c7ac3c7162d3906eb0700eb6148320ac929c533'
          assert c2['runtime_fingerprint_sha256']==c2['runtime_fingerprint']
          assert '34096208700 PASS' in c2['notes'] and '34097712570 PASS' in c2['notes']

          assert c3['target_version']=='1.25.25'
          assert c3['from_versions']==['1.25.20','1.25.21','1.25.22','1.25.23','1.25.24']
          assert c3['plugin_file']=='vf-tool-m3u8/vf-tool-m3u8.php' and c3['physical_locator']=='vf-tool-m3u8/vf-tool-m3u8.php'
          assert c3['canonical_locator']=='vf-tools-m3u8/vf-tools-m3u8.php' and c3['locator_cutover'] is False
          assert c3['schema_from']=='1.3.0' and c3['schema_to']=='1.3.0'
          assert c3['release_tag']=='v1.25.25'
          assert c3['asset_name']=='vf-tools-m3u8_V1.25.25.zip'
          assert c3['asset_bytes']==3577750
          assert c3['asset_sha256']=='ced5a61af90eb968b080a9b946aae519b60fa43fb9826a8399dafb81734cb08a'
          assert c3['runtime_files']==558 and c3['runtime_file_count']==558
          assert c3['runtime_fingerprint']=='e98e1e17be3573aacafdf5acae4ab9c82b7287f2d8ca1ea36f97778929a8454d'
          assert c3['runtime_fingerprint_sha256']==c3['runtime_fingerprint']
          assert 'M3U8 migration remains CLOSED' in c3['notes']
          assert '34096279623 PASS' in c3['notes'] and '34097842291 PASS' in c3['notes']
          print('THREE_COMPONENT_SEMANTIC_BOUNDARY=PASS')
          PY

      - name: Exact formal Release readback for all three components
        shell: bash
        run: |
          set -Eeuo pipefail
          auth=(-H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')

          check_release(){
            repo="$1"; tag="$2"; asset="$3"; bytes="$4"; digest="$5"; sha="$6"
            curl --fail-with-body -sS "${auth[@]}" "https://api.github.com/repos/$repo/releases/tags/$tag" > /tmp/release.json
            test "$(jq -r '.draft' /tmp/release.json)" = false
            test "$(jq -r '.prerelease' /tmp/release.json)" = false
            test "$(jq -r --arg a "$asset" '.assets[]|select(.name==$a)|.size' /tmp/release.json)" = "$bytes"
            test "$(jq -r --arg a "$asset" '.assets[]|select(.name==$a)|.digest' /tmp/release.json)" = "sha256:$digest"
            test "$(curl --fail-with-body -sS "${auth[@]}" "https://api.github.com/repos/$repo/git/ref/tags/$tag" | jq -r '.object.sha')" = "$sha"
            test "$(curl --fail-with-body -sS "${auth[@]}" "https://api.github.com/repos/$repo/branches/main" | jq -r '.commit.sha')" = "$sha"
          }

          check_release llhzx2018/vf-tools-theme v1.35.16 vf-tools-theme_V1.35.16.zip 1805133 b9077c362ef63e240190dd6e0f0ced78b503ad0320f021eb12943f3c4626d6fb "$THEME_SHA"
          check_release llhzx2018/vf-tools-ops v1.21.855 vf-tools-ops_V1.21.855.zip 3338816 a8789f9d20e252135023f88ff136b19d6c0a38c835d25bdefb9c4a9eb28d62f6 "$OPS_SHA"
          check_release llhzx2018/vf-tools-m3u8 v1.25.25 vf-tools-m3u8_V1.25.25.zip 3577750 ced5a61af90eb968b080a9b946aae519b60fa43fb9826a8399dafb81734cb08a "$M3U8_SHA"
          echo 'THREE_FORMAL_RELEASE_METADATA_READBACK=PASS'
          echo 'S01_VISIBLE_UI_BATCH_CORE_UPDATE_EXTERNAL_GATE=PASS'
