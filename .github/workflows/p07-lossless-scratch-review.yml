name: P07 lossless scratch and offline review exact-source proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-lossless-scratch-review.yml'
      - 'experiments/p07-lossless-review/**'
permissions:
  contents: read
jobs:
  lossless-offline-synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact source SHA and stage isolated release112 overlay
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(cat dist/p07/0.1.0/overlay/BUILD_ID)" = 0.1.0-release112
          test "$(git hash-object experiments/p07-lossless-review/lib/scratch_sql_host_policy.py)" = 0de4894b160f33b8beb0cd7afca24f4db423081e
          test "$(git hash-object experiments/p07-lossless-review/lib/server_migration_pull.py)" = 1c0e66594c99516a2382ef26021868ee56fbae71
          test "$(git hash-object experiments/p07-lossless-review/lib/private_sql_literal_reconcile.py)" = 9c616f31ab9e8f07816ed69a1fc2ddc3711ab852
          test "$(git hash-object experiments/p07-lossless-review/lib/private_conflict_preservation.py)" = 8ab17d9d8bb1ca66f3574acc1f056c675c405a81
          test "$(git hash-object experiments/p07-lossless-review/lib/migration_recovery_rehearsal.py)" = 4726bdfb7ad4e2e2f9691f89a53c30c15acff138
          test "$(git hash-object experiments/p07-lossless-review/lib/native_scratch_restore.py)" = f2bd59bce111816a67cae6ac7dcaacbf34259c5f
          test "$(git hash-object experiments/p07-lossless-review/lib/isolated_db_restore.py)" = 332346c6e2edf99bb592e095ac764afa1de8271c
          test "$(git hash-object experiments/p07-lossless-review/tests/test_scratch_sealed_input.py)" = 4d17107f4420c372aba1ce0d718a9ed3081eba52
          test "$(git hash-object experiments/p07-lossless-review/tests/test_scratch_sql_host_policy.py)" = 16d9ae0b181323811c9badc6ec3cf84ae154a671
          test "$(git hash-object experiments/p07-lossless-review/tests/test_server_migration_recovery_literal_cli.py)" = bde636f063a0ce422401693c02f44160bb80f59f
          test "$(git hash-object experiments/p07-lossless-review/tests/test_private_sql_literal_reconcile.py)" = 1fee1cc5522f75a884ba3a11a9cf5bc7bd773765
          test "$(git hash-object experiments/p07-lossless-review/tests/test_private_conflict_preservation.py)" = cd7649d77254dbf3528246ac302d74ce42b99c30
          test "$(git hash-object experiments/p07-lossless-review/tests/test_isolated_db_restore.py)" = e2dd76d86c1557fd85296f4718f17e517e2c7088
          test "$(git hash-object experiments/p07-lossless-review/tests/test_server_migration_pull.py)" = 04403482be20e46ed1752637c573119ea43d099e
          cp -a dist/p07/0.1.0/overlay "$RUNNER_TEMP/p07-lossless-review"
          for p in lib/scratch_sql_host_policy.py lib/server_migration_pull.py lib/private_sql_literal_reconcile.py lib/private_conflict_preservation.py lib/migration_recovery_rehearsal.py lib/native_scratch_restore.py lib/isolated_db_restore.py tests/test_scratch_sealed_input.py tests/test_scratch_sql_host_policy.py tests/test_server_migration_recovery_literal_cli.py tests/test_private_sql_literal_reconcile.py tests/test_private_conflict_preservation.py tests/test_isolated_db_restore.py tests/test_server_migration_pull.py; do
            cp "experiments/p07-lossless-review/$p" "$RUNNER_TEMP/p07-lossless-review/$p"
          done
          cd "$RUNNER_TEMP/p07-lossless-review"
          python3 -m py_compile lib/scratch_sql_host_policy.py lib/server_migration_pull.py lib/private_sql_literal_reconcile.py tests/test_scratch_sealed_input.py tests/test_server_migration_recovery_literal_cli.py
          echo P07_LOSSLESS_EXACT_SOURCE_PASS
      - name: Byte identity, dynamic guard, native and CLI synthetic cases
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/p07-lossless-review"
          PYTHONPATH=lib python3 -m unittest -v \
            tests.test_scratch_sealed_input \
            tests.test_scratch_sql_host_policy \
            tests.test_server_migration_recovery_literal_cli \
            tests.test_private_sql_literal_reconcile \
            tests.test_private_conflict_preservation
          echo P07_LOSSLESS_SCOPE_PASS
      - name: Existing rollback/restore and SQL safety regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/p07-lossless-review"
          PYTHONPATH=lib python3 -m unittest -q \
            tests.test_isolated_db_restore \
            tests.test_native_scratch_restore \
            tests.test_private_recovery_gate \
            tests.test_scratch_guard_quarantine \
            tests.test_migration_no_overwrite_resume \
            tests.test_restore_sql_preflight \
            tests.test_server_migration_pull
          for p in lib/cloudpanel.py lib/restore_apply_core.py lib/server_migration.py lib/package_core.py BUILD_ID; do
            test "$(git hash-object "$GITHUB_WORKSPACE/dist/p07/0.1.0/overlay/$p")" = "$(git hash-object "$p")"
          done
          echo P07_LOSSLESS_EXISTING_DB_WRITERS_UNCHANGED_PASS
