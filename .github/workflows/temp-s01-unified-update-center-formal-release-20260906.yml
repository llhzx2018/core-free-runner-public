name: S01 Unified Update Center Coordinated Formal Release

on:
  push:
    branches: [temp/s01-unified-update-center-formal-release-20260906]
    paths:
      - '.github/workflows/temp-s01-unified-update-center-formal-release-20260906.yml'

permissions:
  contents: read

concurrency:
  group: s01-unified-update-center-formal-release-20260906
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      THEME_SHA: 8c50ad91678cad78788c04ca839ba8304228499b
      OPS_SHA: e13191ff2efcb98d8a2866f85e3f9272a2aa49c8
      M3U8_SHA: 466e9ecb97b4d7e03aeadc0533bcef6ecda9346e
      THEME_FILES: '446'
      THEME_RUNTIME_FILES: '442'
      THEME_BYTES: '1797045'
      THEME_SHA256: db169bbcb00697d7c07f22684c41900b849bb6a54a0d1507782dc147a21ac54b
      THEME_FP: a9cc2869e36f153af594dae2063655c57d6365d5f49e5b449bacb99fced826a8
      THEME_RUNTIME_FP: 9b2a86985cbdfcc55548a95d0dbd7cb63cdff5b2e257d52dbafda74c0080fe15
      OPS_FILES: '933'
      OPS_BYTES: '3334436'
      OPS_SHA256: 67a12bc684852083a25d8f278e2114ff412596b1e339a2078b200be19ea25af6
      OPS_RUNTIME_FP: 4388ff01cf6633c4616ac245549b59f26ed8bdbac8cea071661f4d835140b631
      M3U8_FILES: '559'
      M3U8_RUNTIME_FILES: '557'
      M3U8_BYTES: '3574008'
      M3U8_SHA256: 6ea12ce7d85cc4411f71aea5944c46c306e8adcd4c276f6fcdb82c5538a1c891
      M3U8_FP: 5b0d7c3697a5ffe0650773b50b64d24a8208e27bed5fedce7ba9babf0e4b364e
      M3U8_RUNTIME_FP: 6fed3b9f537eee984ef78951342f4b18bfe4444ecfdd33417572d8978e91670f

    steps:
      - name: Credential authority gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"
          echo 'CREDENTIAL_MODEL=READ_WRITE_SEPARATED'

      - name: Checkout exact Theme source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-tools-theme
          ref: ${{ env.THEME_SHA }}
          token: ${{ env.READ_TOKEN }}
          path: theme
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact Ops source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.OPS_SHA }}
          token: ${{ env.READ_TOKEN }}
          path: ops
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact M3U8 source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: ${{ env.M3U8_SHA }}
          token: ${{ env.READ_TOKEN }}
          path: m3u8
          fetch-depth: 0
          persist-credentials: false

      - name: Coordinated source gates
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C theme rev-parse HEAD)" = "$THEME_SHA"
          test "$(git -C ops rev-parse HEAD)" = "$OPS_SHA"
          test "$(git -C m3u8 rev-parse HEAD)" = "$M3U8_SHA"

          test "$(tr -d '\r\n' < theme/VERSION)" = '1.35.12'
          grep -Eq '^Version: 1\.35\.12$' theme/src/style.css
          grep -Fq "apply_filters('vf_wp_update_components_v1'" theme/src/inc/update/class-vf-wp-update-admin-v1.php
          grep -Fq "'S01-C01' =>" theme/src/inc/update/class-vf-wp-update-admin-v1.php
          find theme/src -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php theme/tests/update-refresh-policy-contract.php
          php theme/tests/public-reading-final-owner-contract.php

          test "$(tr -d '\r\n' < ops/VERSION)" = '1.21.851'
          grep -Fq 'Version: 1.21.851' ops/vf-ops.php
          grep -Fq "VF_OPS_VERSION', '1.21.851'" ops/vf-ops.php
          grep -Fq "add_filter('vf_wp_update_components_v1'" ops/includes/wp-update/class-vf-ops-update-admin-v1.php
          grep -Fq "'S01-C02'" ops/includes/wp-update/class-vf-ops-update-admin-v1.php
          grep -Fq "remove_submenu_page('tools.php', 'vf-ops-updates')" ops/includes/wp-update/class-vf-ops-update-admin-v1.php
          find ops -type f -name '*.php' -not -path '*/.git/*' -print0 | xargs -0 -n1 php -l >/dev/null

          test "$(tr -d '\r\n' < m3u8/VERSION)" = '1.25.22'
          grep -Fq "VF_TOOL_M3U8_VERSION', '1.25.22'" m3u8/src/vf-tool-m3u8.php
          grep -Fq "VF_TOOL_M3U8_ROUND', 'R246'" m3u8/src/vf-tool-m3u8.php
          grep -Fq "add_filter('vf_wp_update_components_v1'" m3u8/src/includes/update/class-vf-m3u8-update-admin-v1.php
          grep -Fq "'S01-C03'" m3u8/src/includes/update/class-vf-m3u8-update-admin-v1.php
          grep -Fq "remove_submenu_page('tools.php', 'vf-m3u8-updates')" m3u8/src/includes/update/class-vf-m3u8-update-admin-v1.php
          find m3u8/src -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php m3u8/tests/unit/update-refresh-policy-contract.php
          php m3u8/tests/frontend-s01-uiux-final-owner-contract.php

          python3 - <<'PY'
          import subprocess
          checks = [
              ('theme','868192e5f355f4b2f49855de868360c47b87ea78', {'VERSION','src/inc/update/class-vf-wp-update-admin-v1.php','src/style.css','tests/update-refresh-policy-contract.php'}),
              ('ops','0e6fb809748a3c2b392c13b1c787490ebbeb390d', {'VERSION','includes/wp-update/class-vf-ops-update-admin-v1.php','vf-ops.php'}),
              ('m3u8','db11959db7ce726ad56d74be4add9fa594061817', {'VERSION','src/includes/update/class-vf-m3u8-update-admin-v1.php','src/vf-tool-m3u8.php','tests/unit/update-refresh-policy-contract.php'}),
          ]
          for repo,base,expected in checks:
              out=subprocess.check_output(['git','-C',repo,'diff','--name-only',base+'..HEAD'],text=True)
              got={x for x in out.splitlines() if x}
              assert got==expected,(repo,got,expected)
              assert not any('migration' in x.lower() or 'schema' in x.lower() for x in got),(repo,got)
          print('NO_SCHEMA_MIGRATION_DELTA=PASS')
          PY
          echo 'COORDINATED_SOURCE_GATE=PASS'

      - name: Build deterministic candidates and runtime authority
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/release" authority

          cat > /tmp/theme-authority.php <<'PHP'
          <?php
          define('ABSPATH','/');
          class WP_Error { public function __construct(...$x){} }
          require $argv[1].'/src/inc/update/class-vf-theme-runtime-authority-v1.php';
          $s=VF_Theme_Runtime_Authority_V1::snapshot($argv[1].'/src');
          unset($s['files']);
          echo json_encode($s, JSON_UNESCAPED_SLASHES), "\n";
          PHP
          php /tmp/theme-authority.php theme > authority/theme.json

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,re,zipfile

          def ident(items):
              h=hashlib.sha256()
              for rel,b in sorted(items): h.update((rel+'\0'+hashlib.sha256(b).hexdigest()+'\n').encode())
              return len(items),h.hexdigest()

          def zip_tree(src,prefix,out):
              rows=[(p.relative_to(src).as_posix(),p.read_bytes()) for p in sorted(src.rglob('*'),key=lambda x:x.relative_to(src).as_posix()) if p.is_file()]
              dirs={prefix+'/'}
              for rel,_ in rows:
                  cur=prefix
                  for part in rel.split('/')[:-1]: cur += '/'+part; dirs.add(cur+'/')
              with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
                  for d in sorted(dirs):
                      zi=zipfile.ZipInfo(d); zi.date_time=(1980,1,1,0,0,0); zi.external_attr=(0o40755<<16)|0x10; z.writestr(zi,b'')
                  for rel,b in rows:
                      zi=zipfile.ZipInfo(prefix+'/'+rel); zi.date_time=(1980,1,1,0,0,0); zi.compress_type=zipfile.ZIP_DEFLATED; zi.external_attr=0o100644<<16; z.writestr(zi,b)
              return rows

          out=Path(os.environ['RUNNER_TEMP'])/'release'
          theme_zip=out/'vf-tools-theme_V1.35.12.zip'
          trows=zip_tree(Path('theme/src'),'vf-tools-theme',theme_zip)
          tc,tfp=ident(trows)
          ta=json.load(open('authority/theme.json'))
          assert tc==int(os.environ['THEME_FILES'])
          assert theme_zip.stat().st_size==int(os.environ['THEME_BYTES'])
          assert hashlib.sha256(theme_zip.read_bytes()).hexdigest()==os.environ['THEME_SHA256']
          assert tfp==os.environ['THEME_FP']
          assert ta['file_count']==int(os.environ['THEME_RUNTIME_FILES'])
          assert ta['fingerprint_sha256']==os.environ['THEME_RUNTIME_FP']

          root=Path('ops'); orows=[]
          for p in root.rglob('*'):
              if not p.is_file() or p.is_symlink(): continue
              rel=p.relative_to(root).as_posix(); parts=rel.split('/')
              if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in parts): continue
              if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',rel,re.I): continue
              ok=(rel in {'vf-ops.php','uninstall.php'}) if '/' not in rel else parts[0] in {'includes','assets','languages','config'}
              if ok: orows.append((rel,p.read_bytes()))
          orows.sort(); ops_zip=out/'vf-tools-ops_V1.21.851.zip'
          with zipfile.ZipFile(ops_zip,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for rel,b in orows:
                  zi=zipfile.ZipInfo('vf-ops/'+rel,(2026,9,6,0,0,0)); zi.compress_type=zipfile.ZIP_DEFLATED; zi.external_attr=0o100644<<16; z.writestr(zi,b)
          oc,ofp=ident(orows)
          assert oc==int(os.environ['OPS_FILES'])
          assert ops_zip.stat().st_size==int(os.environ['OPS_BYTES'])
          assert hashlib.sha256(ops_zip.read_bytes()).hexdigest()==os.environ['OPS_SHA256']
          assert ofp==os.environ['OPS_RUNTIME_FP']

          m3_zip=out/'vf-tools-m3u8_V1.25.22.zip'
          mrows=zip_tree(Path('m3u8/src'),'vf-tool-m3u8',m3_zip)
          runtime=[]
          for rel,b in mrows:
              parts=rel.split('/'); low=[x.lower() for x in parts]; bn=parts[-1].lower()
              if any(x in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in low): continue
              if bn in {'readme.md','changelog.md','license','license.txt','package_profile.json'} or bn.endswith(('.sql','.sqlite','.sqlite3','.db','.log','.zip','.tar','.gz','.bak','.tmp')): continue
              ok=(rel in {'vf-tool-m3u8.php','uninstall.php','plugin-manifest.json','tool-settings.schema.json'}) if len(parts)==1 else parts[0] in {'admin','config','includes','public','templates','tools'}
              if ok: runtime.append((rel,b))
          mc,mfp=ident(mrows); mrc,mrfp=ident(runtime)
          assert mc==int(os.environ['M3U8_FILES']) and mrc==int(os.environ['M3U8_RUNTIME_FILES'])
          assert m3_zip.stat().st_size==int(os.environ['M3U8_BYTES'])
          assert hashlib.sha256(m3_zip.read_bytes()).hexdigest()==os.environ['M3U8_SHA256']
          assert mfp==os.environ['M3U8_FP'] and mrfp==os.environ['M3U8_RUNTIME_FP']

          for p in (theme_zip,ops_zip,m3_zip):
              with zipfile.ZipFile(p) as z: assert z.testzip() is None
          print('DETERMINISTIC_CANDIDATE_IDENTITY=PASS')
          print('RUNTIME_AUTHORITY=PASS')
          PY

      - name: Coordinated tag, draft, remote readback and publish transaction
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          created_tags=()
          created_releases=()
          cleanup(){
            rc=$?
            if [ "$rc" -ne 0 ]; then
              for spec in "${created_releases[@]:-}"; do repo="${spec%%|*}"; tag="${spec#*|}"; gh release delete "$tag" --repo "$repo" --cleanup-tag --yes >/dev/null 2>&1 || true; done
              for spec in "${created_tags[@]:-}"; do repo="${spec%%|*}"; tag="${spec#*|}"; gh api --method DELETE "repos/$repo/git/refs/tags/$tag" >/dev/null 2>&1 || true; done
            fi
            exit "$rc"
          }
          trap cleanup EXIT

          preflight(){ repo="$1"; tag="$2"; ! gh release view "$tag" --repo "$repo" >/dev/null 2>&1; ! gh api "repos/$repo/git/ref/tags/$tag" >/dev/null 2>&1; }
          preflight llhzx2018/vf-tools-theme v1.35.12
          preflight llhzx2018/vf-tools-ops v1.21.851
          preflight llhzx2018/vf-tools-m3u8 v1.25.22
          echo 'REMOTE_RELEASE_PREFLIGHT=PASS'

          mk_tag(){ repo="$1"; tag="$2"; sha="$3"; gh api --method POST "repos/$repo/git/refs" -f ref="refs/tags/$tag" -f sha="$sha" >/dev/null; created_tags+=("$repo|$tag"); test "$(gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.sha')" = "$sha"; }
          mk_tag llhzx2018/vf-tools-theme v1.35.12 "$THEME_SHA"
          mk_tag llhzx2018/vf-tools-ops v1.21.851 "$OPS_SHA"
          mk_tag llhzx2018/vf-tools-m3u8 v1.25.22 "$M3U8_SHA"
          echo 'COORDINATED_TAG_CREATE=PASS'

          gh release create v1.35.12 "$RUNNER_TEMP/release/vf-tools-theme_V1.35.12.zip" --repo llhzx2018/vf-tools-theme --title 'VF Tools Theme V1.35.12' --notes 'S01-C01 · VF Tools Theme 1.35.12 Unified Update Center Registry Host. VF 在线更新 is the single visible update-center owner and S01-C01 is registered in the component registry. Independent component release/recovery semantics remain unchanged. Git/Release PASS does not claim Production, Static, Online or FINAL_ONLINE_PASS.' --draft
          created_releases+=("llhzx2018/vf-tools-theme|v1.35.12")
          gh release create v1.21.851 "$RUNNER_TEMP/release/vf-tools-ops_V1.21.851.zip" --repo llhzx2018/vf-tools-ops --title 'VF Tools Ops V1.21.851' --notes 'S01-C02 · VF Tools Ops 1.21.851 Unified Update Center adapter. Legacy Tools submenu is hidden, old URL redirects to the central S01-C02 anchor, and the canonical physical locator remains vf-ops/vf-ops.php. Schema remains 6.0.0. Git/Release PASS does not claim Production, Static, Online or FINAL_ONLINE_PASS.' --draft
          created_releases+=("llhzx2018/vf-tools-ops|v1.21.851")
          gh release create v1.25.22 "$RUNNER_TEMP/release/vf-tools-m3u8_V1.25.22.zip" --repo llhzx2018/vf-tools-m3u8 --title 'VF Tools M3U8 V1.25.22' --notes 'S01-C03 · VF Tools M3U8 1.25.22 Unified Update Center adapter. Legacy Tools submenu is hidden, old URL redirects to the central S01-C03 anchor, and M3U8 migration remains CLOSED with schema 1.3.0 unchanged. Git/Release PASS does not claim Production, Static, Online or FINAL_ONLINE_PASS.' --draft
          created_releases+=("llhzx2018/vf-tools-m3u8|v1.25.22")
          echo 'COORDINATED_DRAFT_RELEASE_CREATE=PASS'

          mkdir -p "$RUNNER_TEMP/readback/theme" "$RUNNER_TEMP/readback/ops" "$RUNNER_TEMP/readback/m3u8"
          gh release download v1.35.12 --repo llhzx2018/vf-tools-theme --pattern vf-tools-theme_V1.35.12.zip --dir "$RUNNER_TEMP/readback/theme"
          gh release download v1.21.851 --repo llhzx2018/vf-tools-ops --pattern vf-tools-ops_V1.21.851.zip --dir "$RUNNER_TEMP/readback/ops"
          gh release download v1.25.22 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.22.zip --dir "$RUNNER_TEMP/readback/m3u8"
          test "$(stat -c %s "$RUNNER_TEMP/readback/theme/vf-tools-theme_V1.35.12.zip")" = "$THEME_BYTES"
          test "$(sha256sum "$RUNNER_TEMP/readback/theme/vf-tools-theme_V1.35.12.zip"|awk '{print $1}')" = "$THEME_SHA256"
          test "$(stat -c %s "$RUNNER_TEMP/readback/ops/vf-tools-ops_V1.21.851.zip")" = "$OPS_BYTES"
          test "$(sha256sum "$RUNNER_TEMP/readback/ops/vf-tools-ops_V1.21.851.zip"|awk '{print $1}')" = "$OPS_SHA256"
          test "$(stat -c %s "$RUNNER_TEMP/readback/m3u8/vf-tools-m3u8_V1.25.22.zip")" = "$M3U8_BYTES"
          test "$(sha256sum "$RUNNER_TEMP/readback/m3u8/vf-tools-m3u8_V1.25.22.zip"|awk '{print $1}')" = "$M3U8_SHA256"
          python3 - <<'PY'
          import os,zipfile
          items=[
            (os.environ['RUNNER_TEMP']+'/readback/theme/vf-tools-theme_V1.35.12.zip','vf-tools-theme','vf-tools-theme/style.css',b'Version: 1.35.12',446),
            (os.environ['RUNNER_TEMP']+'/readback/ops/vf-tools-ops_V1.21.851.zip','vf-ops','vf-ops/vf-ops.php',b'Version: 1.21.851',933),
            (os.environ['RUNNER_TEMP']+'/readback/m3u8/vf-tools-m3u8_V1.25.22.zip','vf-tool-m3u8','vf-tool-m3u8/vf-tool-m3u8.php',b'Version: 1.25.22',559),
          ]
          for p,root,main,needle,count in items:
              with zipfile.ZipFile(p) as z:
                  assert z.testzip() is None
                  files=[x for x in z.infolist() if not x.is_dir()]
                  assert len(files)==count
                  assert sorted({x.filename.split('/')[0] for x in files})==[root]
                  assert needle in z.read(main)
          print('REMOTE_ASSET_EXACT_READBACK_BEFORE_PUBLISH=PASS')
          PY

          gh release edit v1.35.12 --repo llhzx2018/vf-tools-theme --draft=false
          gh release edit v1.21.851 --repo llhzx2018/vf-tools-ops --draft=false
          gh release edit v1.25.22 --repo llhzx2018/vf-tools-m3u8 --draft=false

          test "$(gh api repos/llhzx2018/vf-tools-theme/branches/main --jq '.commit.sha')" = "$THEME_SHA"
          test "$(gh api repos/llhzx2018/vf-tools-ops/branches/main --jq '.commit.sha')" = "$OPS_SHA"
          test "$(gh api repos/llhzx2018/vf-tools-m3u8/branches/main --jq '.commit.sha')" = "$M3U8_SHA"
          test "$(gh api repos/llhzx2018/vf-tools-theme/releases/tags/v1.35.12 --jq '.assets[]|select(.name=="vf-tools-theme_V1.35.12.zip")|.digest')" = "sha256:$THEME_SHA256"
          test "$(gh api repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.851 --jq '.assets[]|select(.name=="vf-tools-ops_V1.21.851.zip")|.digest')" = "sha256:$OPS_SHA256"
          test "$(gh api repos/llhzx2018/vf-tools-m3u8/releases/tags/v1.25.22 --jq '.assets[]|select(.name=="vf-tools-m3u8_V1.25.22.zip")|.digest')" = "sha256:$M3U8_SHA256"
          trap - EXIT
          echo "THEME_RELEASE_ID=$(gh api repos/llhzx2018/vf-tools-theme/releases/tags/v1.35.12 --jq '.id')"
          echo "THEME_ASSET_ID=$(gh api repos/llhzx2018/vf-tools-theme/releases/tags/v1.35.12 --jq '.assets[]|select(.name=="vf-tools-theme_V1.35.12.zip")|.id')"
          echo "OPS_RELEASE_ID=$(gh api repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.851 --jq '.id')"
          echo "OPS_ASSET_ID=$(gh api repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.851 --jq '.assets[]|select(.name=="vf-tools-ops_V1.21.851.zip")|.id')"
          echo "M3U8_RELEASE_ID=$(gh api repos/llhzx2018/vf-tools-m3u8/releases/tags/v1.25.22 --jq '.id')"
          echo "M3U8_ASSET_ID=$(gh api repos/llhzx2018/vf-tools-m3u8/releases/tags/v1.25.22 --jq '.assets[]|select(.name=="vf-tools-m3u8_V1.25.22.zip")|.id')"
          echo 'COORDINATED_FORMAL_RELEASE=PASS'
          echo 'REMOTE_ASSET_EXACT_READBACK=PASS'
          echo 'TESTED_ARTIFACT_EQUALS_DELIVERED_ARTIFACT=PASS'
