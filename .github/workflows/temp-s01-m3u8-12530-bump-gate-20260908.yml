name: temp-s01-m3u8-12530-bump-gate-20260908
on:
  push:
    branches:
      - temp/s01-page-update-center-v4-20260907
    paths:
      - .github/workflows/temp-s01-m3u8-12530-bump-gate-20260908.yml
permissions:
  contents: read
jobs:
  bump-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      REPO: llhzx2018/vf-tools-m3u8
      BRANCH: work/s01-m3u8-provider-dashboard-visible-ui-20260908
      EXPECTED_HEAD: b986fb485a3d08828e3926472076aae29aaf469f
    steps:
      - name: Bump exact M3U8 identity and gate candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'BUMP_GATE_MODE=CANDIDATE_ONLY MAIN_WRITE_USED=NO RELEASE_WRITE_USED=NO DISTRIBUTION_WRITE_USED=NO PRODUCTION_WRITE_USED=NO MIGRATION_WRITE_USED=NO'
          rm -rf /tmp/m3u8-bump
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/${REPO}.git" /tmp/m3u8-bump
          git -C /tmp/m3u8-bump checkout -q "$BRANCH"
          test "$(git -C /tmp/m3u8-bump rev-parse HEAD)" = "$EXPECTED_HEAD"
          cd /tmp/m3u8-bump
          test "$(tr -d '\r\n' < VERSION)" = '1.25.29'
          python3 - <<'PY'
          from pathlib import Path
          Path('VERSION').write_text('1.25.30\n')
          plugin=Path('src/vf-tool-m3u8.php')
          text=plugin.read_text()
          replacements={
              'Version: 1.25.29':'Version: 1.25.30',
              "VF_TOOL_M3U8_VERSION', '1.25.29":"VF_TOOL_M3U8_VERSION', '1.25.30",
              "VF_TOOL_M3U8_ROUND', 'R253":"VF_TOOL_M3U8_ROUND', 'R254",
              'R253_S01_ERROR_RECOVERY_UX_CLOSURE':'R254_S01_PROVIDER_DASHBOARD_VISIBLE_UI_CLOSURE',
          }
          for old,new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing plugin identity token: {old}')
              text=text.replace(old,new)
          plugin.write_text(text)
          for path in Path('tests').rglob('*.php'):
              data=path.read_text()
              updated=(data.replace('1.25.29','1.25.30')
                           .replace('R253_S01_ERROR_RECOVERY_UX_CLOSURE','R254_S01_PROVIDER_DASHBOARD_VISIBLE_UI_CLOSURE')
                           .replace('R253','R254'))
              if path.name=='provider-dashboard-visible-ui-contract.php':
                  updated=updated.replace('visible UI candidate must not bump VERSION','release candidate VERSION must be 1.25.30')
              if updated != data:
                  path.write_text(updated)
          PY
          test "$(tr -d '\r\n' < VERSION)" = '1.25.30'
          grep -q 'Version: 1.25.30' src/vf-tool-m3u8.php
          grep -q "VF_TOOL_M3U8_VERSION', '1.25.30" src/vf-tool-m3u8.php
          grep -q "VF_TOOL_M3U8_ROUND', 'R254" src/vf-tool-m3u8.php
          grep -q 'R254_S01_PROVIDER_DASHBOARD_VISIBLE_UI_CLOSURE' src/vf-tool-m3u8.php
          if grep -RInE --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=vendor '1\.25\.29|R253_S01_ERROR_RECOVERY_UX_CLOSURE|VF_TOOL_M3U8_ROUND.?[^\n]*R253' VERSION src/vf-tool-m3u8.php tests >/tmp/stale-identity; then
            cat /tmp/stale-identity
            echo 'stale release identity remains' >&2
            exit 1
          fi
          php -l src/vf-tool-m3u8.php >/dev/null
          php -l src/admin/Controller/class-v6-provider-operations-controller.php >/dev/null
          php tests/provider-dashboard-visible-ui-contract.php
          php tests/frontend-s01-uiux-final-owner-contract.php
          for f in tests/unit/*.php; do php "$f"; done
          php tests/unit/package-physical-locator-contract.php
          git diff -- src/config src/database src/migrations docs/authority/CURRENT.md | tee /tmp/boundary-diff
          test ! -s /tmp/boundary-diff
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | grep -c '^VERSION$')" = '1'
          test "$(printf '%s\n' "$changed" | grep -c '^src/vf-tool-m3u8.php$')" = '1'
          test "$(printf '%s\n' "$changed" | grep -c '^src/admin/Controller/class-v6-provider-operations-controller.php$')" = '0'
          test "$(git diff --name-only | grep -Ec '^(src/config|src/database|src/migrations)/|^docs/authority/CURRENT\.md$' || true)" = '0'
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add VERSION src/vf-tool-m3u8.php tests
          git commit -m 'release(S01): bump M3U8 visible Provider dashboard to 1.25.30'
          bumped="$(git rev-parse HEAD)"
          git push -q "https://x-access-token:${WRITE_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${BRANCH}"
          echo "BUMPED_CANDIDATE_SHA=$bumped"
          echo 'VERSION=1.25.30'
          echo 'ROUND=R254'
          echo 'MARKER=R254_S01_PROVIDER_DASHBOARD_VISIBLE_UI_CLOSURE'
          echo 'SCHEMA_LOCATOR_MIGRATION_BOUNDARY=UNCHANGED'
          echo 'PASS_S01_C03_M3U8_12530_BUMP_GATE'
