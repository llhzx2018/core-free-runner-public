name: P05 V1.0.0 Formal Release Public Runner Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p05-v100-formal-release-bridge.yml'

permissions:
  actions: read
  contents: read

env:
  PRODUCT_REPOSITORY: llhzx2018/vf-seo
  RUNNER_REPOSITORY: llhzx2018/core-free-runner-public
  CANDIDATE_COMMIT: d2bfd4b984d554ced8e8879d46770b71dbc9d07a
  CANDIDATE_TREE: 60feabec2a256cb0377c2fad77fb0895e9d83812
  VERSION: 1.0.0
  TAG: v1.0.0
  ASSET_NAME: VF_SEO_V1.0.0_FULL.zip
  CHECKSUM_NAME: VF_SEO_V1.0.0_FULL.zip.sha256
  EXPECTED_FILES: '123'
  EXPECTED_BYTES: '278418'
  EXPECTED_SHA256: abd06aae47493a8c9b1ad07a590629109e61f9dc66c2ee82dec7efdd0d11392e
  CANDIDATE_ARTIFACT_ID: '9257482586'
  CANDIDATE_RUN_ID: '31924752636'

jobs:
  formal-release-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      RUNNER_TOKEN: ${{ github.token }}
    steps:
      - name: Existing credential authority gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"
          test -n "$RUNNER_TOKEN"
          echo 'PRIVATE_READ_CREDENTIAL=VF_PRIVATE_READ_TOKEN'
          echo 'RELEASE_WRITE_CREDENTIAL=VF_RELEASE_WRITE_TOKEN'
          echo 'NEW_CREDENTIAL_CREATED=NO'
          echo 'NEW_RUNNER_CREATED=NO'

      - name: Checkout exact private Candidate with READ credential
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.CANDIDATE_COMMIT }}
          token: ${{ env.READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product

      - name: Exact Candidate source identity gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          test "$(git -C product rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test "$(tr -d '\r\n' < product/VERSION)" = "$VERSION"
          echo "CANDIDATE_COMMIT=$CANDIDATE_COMMIT"
          echo "CANDIDATE_TREE=$CANDIDATE_TREE"
          echo 'REMOTE_CANDIDATE_IDENTITY=PASS'

      - name: Reuse exact tested Candidate Artifact from prior PASS run
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf candidate-artifact candidate-wrapper.zip
          mkdir -p candidate-artifact
          curl -fL --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $RUNNER_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${RUNNER_REPOSITORY}/actions/artifacts/${CANDIDATE_ARTIFACT_ID}/zip" \
            -o candidate-wrapper.zip
          unzip -q candidate-wrapper.zip -d candidate-artifact
          test -f "candidate-artifact/$ASSET_NAME"
          test -f "candidate-artifact/$CHECKSUM_NAME"
          echo "CANDIDATE_ARTIFACT_SOURCE_RUN=$CANDIDATE_RUN_ID"
          echo "CANDIDATE_ARTIFACT_ID=$CANDIDATE_ARTIFACT_ID"
          echo 'TESTED_ARTIFACT_REUSED=PASS'

      - name: Exact FULL identity and publication preflight gate
        shell: bash
        run: |
          set -Eeuo pipefail
          FULL="candidate-artifact/$ASSET_NAME"
          SUM="candidate-artifact/$CHECKSUM_NAME"
          test "$(stat -c '%s' "$FULL")" = "$EXPECTED_BYTES"
          test "$(sha256sum "$FULL" | awk '{print $1}')" = "$EXPECTED_SHA256"
          test "$(unzip -Z1 "$FULL" | grep -c .)" = "$EXPECTED_FILES"
          grep -Fq "$EXPECTED_SHA256" "$SUM"
          unzip -t "$FULL" >/dev/null
          rm -rf local-readback
          mkdir local-readback
          unzip -q "$FULL" -d local-readback
          test -f local-readback/RELEASE_MANIFEST.sha256
          (cd local-readback && sha256sum -c RELEASE_MANIFEST.sha256 >/dev/null)
          ! find local-readback -type f | grep -E '(^|/)(\.env|.*\.(sqlite|sqlite3|db|db-wal|db-shm|pem|key|p12|pfx))$'
          ! find local-readback -type d | grep -E '(^|/)(\.git|\.github|tests|node_modules|private|PRIVATE_DATA)(/|$)'
          ! grep -aERn --exclude='*.map' '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AIza[0-9A-Za-z_-]{20,}|-----BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY-----)' local-readback
          test -f local-readback/RELEASE_SOURCE_IDENTITY.txt
          grep -Fq "Source Commit: $CANDIDATE_COMMIT" local-readback/RELEASE_SOURCE_IDENTITY.txt
          grep -Fq "Source Tree: $CANDIDATE_TREE" local-readback/RELEASE_SOURCE_IDENTITY.txt
          grep -Fq 'Default Database: SQLite' local-readback/RELEASE_SOURCE_IDENTITY.txt
          echo 'ZIP_INTEGRITY=PASS'
          echo 'RELEASE_MANIFEST=PASS'
          echo 'SECRET_GATE=PASS'
          echo 'PRIVATE_DATA_GATE=PASS'
          echo 'EMBEDDED_SOURCE_IDENTITY=PASS'
          echo 'EXACT_ARTIFACT_IDENTITY=PASS'

      - name: Preflight remote Tag and Release absence with WRITE credential
        env:
          GH_TOKEN: ${{ env.WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/${PRODUCT_REPOSITORY}" >/dev/null
          ! gh api "repos/${PRODUCT_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1
          ! gh api "repos/${PRODUCT_REPOSITORY}/releases/tags/${TAG}" >/dev/null 2>&1
          echo 'RELEASE_WRITE_CREDENTIAL_AVAILABLE=PASS'
          echo 'REMOTE_RELEASE_PREFLIGHT=PASS'

      - name: Create Tag Release Assets then authenticated exact remote readback
        shell: bash
        run: |
          set -Eeuo pipefail
          FULL="candidate-artifact/$ASSET_NAME"
          SUM="candidate-artifact/$CHECKSUM_NAME"
          FINALIZED=0
          rollback() {
            if [ "$FINALIZED" != '1' ]; then
              GH_TOKEN="$WRITE_TOKEN" gh release delete "$TAG" --repo "$PRODUCT_REPOSITORY" --yes >/dev/null 2>&1 || true
              GH_TOKEN="$WRITE_TOKEN" gh api --method DELETE "repos/${PRODUCT_REPOSITORY}/git/refs/tags/${TAG}" >/dev/null 2>&1 || true
            fi
          }
          trap rollback ERR

          GH_TOKEN="$WRITE_TOKEN" gh api --method POST "repos/${PRODUCT_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${TAG}" \
            -f sha="$CANDIDATE_COMMIT" >/tmp/tag-created.json
          test "$(jq -r '.object.sha' /tmp/tag-created.json)" = "$CANDIDATE_COMMIT"

          cat > /tmp/release-notes.md <<'EOF'
          # VF SEO V1.0.0

          VF SEO 首个正式 V1.0.0。

          - 默认数据库：SQLite。
          - 运行环境：Node.js 24。
          - CloudPanel：支持 Node.js Site + `install-cloudpanel.sh` 安装路线。
          - 进程管理：PM2 Server + 单 Worker。
          - SQLite Backup / Restore：已支持。
          - PostgreSQL：保留为 Advanced / Optional / Compatibility Provider。
          - PostgreSQL Backup / Restore：当前 **NOT PRODUCTION READY**。
          - MariaDB / MySQL：本版 **DEFERRED / 未实现**。
          - Production：**NOT DEPLOYED**；本 Release 不代表 Production 已上线。

          正式 FULL：`VF_SEO_V1.0.0_FULL.zip`

          SHA-256：`abd06aae47493a8c9b1ad07a590629109e61f9dc66c2ee82dec7efdd0d11392e`
          EOF

          GH_TOKEN="$WRITE_TOKEN" gh release create "$TAG" \
            "$FULL#$ASSET_NAME" \
            "$SUM#$CHECKSUM_NAME" \
            --repo "$PRODUCT_REPOSITORY" \
            --verify-tag \
            --target "$CANDIDATE_COMMIT" \
            --title 'VF SEO V1.0.0' \
            --notes-file /tmp/release-notes.md

          GH_TOKEN="$READ_TOKEN" gh api "repos/${PRODUCT_REPOSITORY}/git/ref/tags/${TAG}" >/tmp/tag-readback.json
          test "$(jq -r '.object.sha' /tmp/tag-readback.json)" = "$CANDIDATE_COMMIT"

          GH_TOKEN="$READ_TOKEN" gh api "repos/${PRODUCT_REPOSITORY}/releases/tags/${TAG}" >/tmp/release-readback.json
          jq -e --arg tag "$TAG" '.tag_name==$tag and .draft==false and .prerelease==false and .name=="VF SEO V1.0.0"' /tmp/release-readback.json >/dev/null
          ASSET_ID="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.id' /tmp/release-readback.json)"
          test -n "$ASSET_ID" && test "$ASSET_ID" != null
          REMOTE_SIZE="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.size' /tmp/release-readback.json)"
          test "$REMOTE_SIZE" = "$EXPECTED_BYTES"
          REMOTE_DIGEST="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.digest // empty' /tmp/release-readback.json)"
          if [ -n "$REMOTE_DIGEST" ]; then test "$REMOTE_DIGEST" = "sha256:${EXPECTED_SHA256}"; fi

          GH_TOKEN="$READ_TOKEN" gh api -H 'Accept: application/octet-stream' \
            "repos/${PRODUCT_REPOSITORY}/releases/assets/${ASSET_ID}" >/tmp/remote-asset.zip
          test "$(stat -c '%s' /tmp/remote-asset.zip)" = "$EXPECTED_BYTES"
          test "$(sha256sum /tmp/remote-asset.zip | awk '{print $1}')" = "$EXPECTED_SHA256"
          test "$(unzip -Z1 /tmp/remote-asset.zip | grep -c .)" = "$EXPECTED_FILES"
          unzip -t /tmp/remote-asset.zip >/dev/null
          cmp -s "$FULL" /tmp/remote-asset.zip
          rm -rf remote-readback
          mkdir remote-readback
          unzip -q /tmp/remote-asset.zip -d remote-readback
          (cd remote-readback && sha256sum -c RELEASE_MANIFEST.sha256 >/dev/null)
          ! find remote-readback -type f | grep -E '(^|/)(\.env|.*\.(sqlite|sqlite3|db|db-wal|db-shm|pem|key|p12|pfx))$'
          ! find remote-readback -type d | grep -E '(^|/)(\.git|\.github|tests|node_modules|private|PRIVATE_DATA)(/|$)'
          ! grep -aERn --exclude='*.map' '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AIza[0-9A-Za-z_-]{20,}|-----BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY-----)' remote-readback
          grep -Fq "Source Commit: $CANDIDATE_COMMIT" remote-readback/RELEASE_SOURCE_IDENTITY.txt
          grep -Fq "Source Tree: $CANDIDATE_TREE" remote-readback/RELEASE_SOURCE_IDENTITY.txt
          grep -Fq 'Default Database: SQLite' remote-readback/RELEASE_SOURCE_IDENTITY.txt

          FINALIZED=1
          trap - ERR
          echo 'TAG_REMOTE_READBACK=PASS'
          echo 'FORMAL_RELEASE=PASS'
          echo 'AUTHENTICATED_REMOTE_ASSET_READBACK=PASS'
          echo 'REMOTE_ZIP_INTEGRITY=PASS'
          echo 'REMOTE_RELEASE_MANIFEST=PASS'
          echo 'REMOTE_SECRET_GATE=PASS'
          echo 'REMOTE_PRIVATE_DATA_GATE=PASS'
          echo 'REMOTE_EMBEDDED_SOURCE_IDENTITY=PASS'
          echo 'TESTED_ARTIFACT_EQUALS_FORMAL_RELEASE_ASSET=PASS'
          echo 'RELEASE_ASSET_IMMUTABLE_FROM_THIS_POINT=YES'

      - name: Final publication verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'P05_V1_0_0_FORMAL_PUBLICATION=PASS'
          echo 'FORMAL_RELEASE_CLOSED=YES'
          echo 'DEFAULT_DATABASE=SQLITE'
          echo 'POSTGRESQL=ADVANCED_OPTIONAL_COMPATIBILITY'
          echo 'POSTGRESQL_BACKUP_RESTORE=NOT_PRODUCTION_READY'
          echo 'MARIADB_MYSQL=DEFERRED'
          echo 'PRODUCTION=NOT_DEPLOYED'
          echo 'MAIN_MODIFIED=NO'
          echo 'NEXT=STOP_FOR_MASTER_PRODUCTION_DECISION'

      - name: Cleanup private source and temporary release bytes
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf product candidate-artifact candidate-wrapper.zip local-readback remote-readback
          rm -f /tmp/tag-created.json /tmp/tag-readback.json /tmp/release-readback.json /tmp/remote-asset.zip /tmp/release-notes.md
          if [ -e product ]; then echo PRIVATE_SOURCE_CLEANUP=FAIL; exit 1; fi
          echo PRIVATE_SOURCE_CLEANUP=PASS
