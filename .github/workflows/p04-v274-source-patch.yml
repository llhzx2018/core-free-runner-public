name: P04 V2.7.4 Source Patch

on:
  pull_request:
    branches: [main]
    paths:
      - 'p04-v274-patch-trigger.txt'

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout V2.7.4 working branch
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: feature/v2.7.4-ui-stability-performance
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: product

      - name: Apply V2.7.4 UI stability and performance patch
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Version
          Path('VERSION').write_text('2.7.4\n', encoding='utf-8')

          # Unified-shell route ownership + lazy section fetch.
          p = Path('public/assets/v271-unified-shell.js')
          s = p.read_text(encoding='utf-8')
          if "settings: null," not in s:
              raise SystemExit('V274_SENTINEL_SETTINGS_STATE_MISSING')
          s = s.replace("settings: null,", "settings: null,\n    settingsSection: '',", 1)

          old = "if (force || !state.settings) state.settings = await api('settings');\n    const payload = state.settings;"
          new = "if (force || !state.settings || state.settingsSection !== section) {\n      state.settings = await api('settings', { query: { section } });\n      state.settingsSection = section;\n    }\n    const payload = state.settings;"
          if old not in s:
              raise SystemExit('V274_SENTINEL_SETTINGS_FETCH_MISSING')
          s = s.replace(old, new, 1)

          # Ensure owned routes render immediately even when the legacy renderer correctly skips them.
          old = "const observer = new MutationObserver(schedule);\n  observer.observe(app, { childList: true, subtree: false });\n\n  ensureOverlayUi();"
          new = "const observer = new MutationObserver(schedule);\n  observer.observe(app, { childList: true, subtree: false });\n\n  ensureOverlayUi();\n  schedule();"
          if old not in s:
              raise SystemExit('V274_SENTINEL_INITIAL_SCHEDULE_MISSING')
          s = s.replace(old, new, 1)

          advanced = r'''  function renderAdvanced(payload) {
    const s = payload.settings || {};
    const cron = payload.system?.cron_status || {};
    return `<section class="v271-panel v274-advanced-panel"><div class="v271-panel-head"><div><h2>高级设置</h2><p class="v271-panel-sub">低频技术参数集中管理；日常使用保持推荐值即可。</p></div></div><form id="v271-advanced-form">
      <div class="v274-settings-block"><div class="v274-block-head"><h3>检查与 RDAP</h3><p>控制检查频率和 RDAP 容错，默认值适合个人使用。</p></div><div class="v271-form-grid"><div class="v271-field"><label>域名检查间隔</label><input type="number" name="check_interval_hours" min="1" max="168" value="${esc(s.check_interval_hours ?? 24)}"></div><div class="v271-field"><label>RDAP 超时</label><input type="number" name="rdap_timeout_seconds" min="3" max="60" value="${esc(s.rdap_timeout_seconds ?? 12)}"></div><div class="v271-field"><label>RDAP 重试次数</label><input type="number" name="rdap_retries" min="0" max="4" value="${esc(s.rdap_retries ?? 2)}"></div><div class="v271-field"><label>能力重查间隔</label><input type="number" name="capability_recheck_hours" min="24" max="720" value="${esc(s.capability_recheck_hours ?? 168)}"></div></div></div>
      <div class="v274-settings-block"><label class="v274-toggle-row"><span class="v274-toggle-copy"><strong>邮件通知</strong><small>关闭时不显示邮件服务器参数。</small></span><input type="checkbox" name="email_enabled" ${bool(s.email_enabled) ? 'checked' : ''}><span class="v274-toggle-ui" aria-hidden="true"></span></label><div class="v271-form-grid v274-email-fields"><div class="v271-field"><label>通知方式</label><select name="email_transport"><option value="php_mail" ${s.email_transport !== 'smtp' ? 'selected' : ''}>PHP Mail</option><option value="smtp" ${s.email_transport === 'smtp' ? 'selected' : ''}>SMTP</option></select></div><div class="v271-field"><label>收件邮箱</label><input type="email" name="email_to" value="${esc(s.email_to || '')}"></div><div class="v271-field"><label>发件邮箱</label><input type="email" name="email_from" value="${esc(s.email_from || '')}"></div><div class="v271-field v274-smtp-only"><label>SMTP Host</label><input name="smtp_host" value="${esc(s.smtp_host || '')}"></div><div class="v271-field v274-smtp-only"><label>SMTP Port</label><input type="number" name="smtp_port" value="${esc(s.smtp_port ?? 587)}"></div><div class="v271-field v274-smtp-only"><label>SMTP Username</label><input name="smtp_username" value="${esc(s.smtp_username || '')}"></div><div class="v271-field v274-smtp-only"><label>新 SMTP Password（可选）</label><input type="password" name="smtp_password" autocomplete="new-password"></div></div></div>
      <div class="v274-settings-block"><label class="v274-toggle-row"><span class="v274-toggle-copy"><strong>自动备份</strong><small>启用后按设定周期创建恢复点。</small></span><input type="checkbox" name="auto_backup_enabled" ${bool(s.auto_backup_enabled) ? 'checked' : ''}><span class="v274-toggle-ui" aria-hidden="true"></span></label><div class="v271-form-grid v274-backup-fields"><div class="v271-field"><label>备份间隔</label><input type="number" name="auto_backup_interval_hours" value="${esc(s.auto_backup_interval_hours ?? 24)}"></div><div class="v271-field"><label>备份保留天数</label><input type="number" name="backup_retention_days" value="${esc(s.backup_retention_days ?? 30)}"></div></div></div>
      <div class="v274-settings-block"><label class="v274-toggle-row"><span class="v274-toggle-copy"><strong>自动数据维护</strong><small>定期执行系统维护任务；没有特殊需求建议保持开启。</small></span><input type="checkbox" name="maintenance_enabled" ${bool(s.maintenance_enabled) ? 'checked' : ''}><span class="v274-toggle-ui" aria-hidden="true"></span></label></div>
      <div class="v271-form-actions"><button type="submit" class="v271-button primary">保存高级设置</button></div></form></section><section class="v271-panel"><div class="v271-panel-head"><div><h2>自动任务</h2><p class="v271-panel-sub">只显示运行状态，不暴露工程命令细节。</p></div></div><div class="v271-detail-list">${detail('最近运行', esc(date(cron.run?.finished_at || cron.run?.started_at)))}${detail('锁状态', esc(txt(cron.lock?.status, '无活动锁')))}${detail('自动任务入口', esc(payload.system?.cron_command ? '已配置' : '尚未检测到'), true)}</div></section>`;
  }
'''
          pattern = r"  function renderAdvanced\(payload\) \{.*?\n  \}\n\n  async function renderSettings"
          if not re.search(pattern, s, flags=re.S):
              raise SystemExit('V274_SENTINEL_ADVANCED_RENDER_MISSING')
          s = re.sub(pattern, advanced + "\n  async function renderSettings", s, count=1, flags=re.S)
          p.write_text(s, encoding='utf-8')

          # Legacy reference renderer must not fetch/render routes now owned by the unified shell.
          p = Path('public/assets/v270-reference-lock.js')
          s = p.read_text(encoding='utf-8')
          old = "async function render(){const{r,id}=route();app.innerHTML='<div class=\"v270-loading\">正在读取真实基础设施状态…</div>';try{const s=await snap();"
          new = "async function render(){const{r,id}=route();if(document.body.classList.contains('v271-unified-mode')&&['providers','provider','settings'].includes(r))return;app.innerHTML='<div class=\"v270-loading\">正在读取真实基础设施状态…</div>';try{const s=await snap();"
          if old not in s:
              raise SystemExit('V274_SENTINEL_LEGACY_RENDER_MISSING')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # Add a section-scoped lightweight settings read path while keeping the legacy full payload intact.
          p = Path('public/api.php')
          s = p.read_text(encoding='utf-8')
          marker = "        case 'settings':\n            $partialErrors = [];"
          if marker not in s:
              raise SystemExit('V274_SENTINEL_API_SETTINGS_MISSING')
          early = r'''        case 'settings':
            $section = strtolower(trim((string) ($input['section'] ?? '')));
            if ($section !== '') {
                $allowedSections = ['basic','reminders','data','backup','security','update','system','diagnostics','advanced'];
                if (!in_array($section, $allowedSections, true)) {
                    $section = 'basic';
                }
                $payload = [
                    'ok' => true,
                    'settings' => Settings::allPublic(),
                    'backups' => [],
                    'security_logs' => [],
                    'retention_preview' => ['counts' => [], 'protected_rules' => []],
                    'diagnostics' => ['checks' => [], 'summary' => ['ok' => 0, 'warning' => 0, 'blocked' => 0], 'status' => 'unknown'],
                    'update' => ['status' => 'not_checked', 'current_version' => VF_DOMAIN_VERSION, 'latest_version' => '', 'can_update' => false],
                    'update_history' => [],
                    'update_pending' => null,
                    'partial_errors' => [],
                    'system' => [
                        'version' => VF_DOMAIN_VERSION,
                        'schema_version' => Migrator::latestVersion(),
                        'cron_status' => [],
                    ],
                ];
                if ($section === 'backup') {
                    $payload['backups'] = (new BackupService())->list();
                } elseif ($section === 'security') {
                    $payload['security_logs'] = array_map(static function (array $row): array {
                        return [
                            'id' => (int) ($row['id'] ?? 0),
                            'event_type' => (string) ($row['event_type'] ?? ''),
                            'severity' => (string) ($row['severity'] ?? 'info'),
                            'success' => !empty($row['success']),
                            'created_at' => (string) ($row['created_at'] ?? ''),
                        ];
                    }, (new SecurityLogService())->list(12));
                } elseif ($section === 'update') {
                    $payload['update'] = (new \VFInfra\Core\Update\UpdateManifestService())->status();
                    $payload['update_history'] = (new \VFInfra\Core\Update\UpdateHistoryService())->list(12);
                    $payload['update_pending'] = \VFInfra\Core\Update\OnlineUpdateHandoff::publicPendingState();
                } elseif ($section === 'system') {
                    $payload['system'] += [
                        'php_version' => PHP_VERSION,
                        'sqlite_version' => (string) $pdo->query('SELECT sqlite_version()')->fetchColumn(),
                        'sqlite_quick_check' => (string) $pdo->query('PRAGMA quick_check')->fetchColumn(),
                        'base_url' => (string) Config::get('base_url'),
                        'current_host' => Support::requestHost(),
                        'cron_command' => 'php <SITE_ROOT>/cron.php',
                    ];
                } elseif ($section === 'diagnostics') {
                    $payload['diagnostics'] = (new SystemDiagnosticsService())->run(false);
                } elseif ($section === 'advanced') {
                    $payload['system']['cron_status'] = (new CronStatusService())->get();
                    $payload['system']['cron_command'] = 'configured';
                }
                Http::json($payload);
            }
            $partialErrors = [];'''
          s = s.replace(marker, early, 1)
          p.write_text(s, encoding='utf-8')

          # Load final V2.7.4 style layer.
          p = Path('public/index.php')
          s = p.read_text(encoding='utf-8')
          marker = '<link rel="stylesheet" href="assets/v273-readable-floor.css?build=<?=rawurlencode(VF_INFRA_VERSION)?>">'
          if marker not in s:
              raise SystemExit('V274_SENTINEL_INDEX_STYLE_MISSING')
          s = s.replace(marker, marker + '\n<link rel="stylesheet" href="assets/v274-ui-stability.css?build=<?=rawurlencode(VF_INFRA_VERSION)?>">', 1)
          p.write_text(s, encoding='utf-8')

          css = r'''/* VF Infra V2.7.4 · UI stability / advanced settings alignment */
.v274-advanced-panel .v271-panel-head{margin-bottom:6px}
.v274-settings-block{padding:18px 0;border-top:1px solid #edf2ef}
.v274-settings-block:first-of-type{border-top:0;padding-top:8px}
.v274-block-head{margin-bottom:12px}
.v274-block-head h3{font-size:15px;line-height:1.4;margin:0;color:#20332c}
.v274-block-head p{margin:4px 0 0;color:#73827b;font-size:12px;line-height:1.55}
.v274-settings-block .v271-form-grid{gap:14px 16px}

/* Checkbox inputs must never inherit full-width text-input geometry. */
.v274-toggle-row{display:flex!important;align-items:center!important;justify-content:space-between;gap:16px;width:100%;min-height:54px;padding:11px 13px;border:1px solid #dce7e2;border-radius:11px;background:#f9fbfa;color:#263d34;cursor:pointer;box-sizing:border-box}
.v274-toggle-copy{display:block;min-width:0;line-height:1.4}
.v274-toggle-copy strong{display:block;font-size:14px;font-weight:700;color:#243a32}
.v274-toggle-copy small{display:block;margin-top:3px;font-size:12px;line-height:1.5;font-weight:450;color:#73827b}
.v271-field .v274-toggle-row input[type="checkbox"],.v274-toggle-row input[type="checkbox"]{position:absolute!important;width:1px!important;height:1px!important;min-height:0!important;min-width:0!important;padding:0!important;margin:0!important;border:0!important;opacity:0;pointer-events:none}
.v274-toggle-ui{position:relative;display:block;flex:0 0 42px;width:42px;height:24px;border-radius:999px;background:#d7e2dd;box-shadow:inset 0 0 0 1px #c5d2cc;transition:background .16s ease,box-shadow .16s ease}
.v274-toggle-ui:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(20,40,32,.22);transition:transform .16s ease}
.v274-toggle-row input[type="checkbox"]:checked + .v274-toggle-ui{background:#0b956d;box-shadow:inset 0 0 0 1px #0b956d}
.v274-toggle-row input[type="checkbox"]:checked + .v274-toggle-ui:after{transform:translateX(18px)}
.v274-toggle-row:focus-within{outline:3px solid rgba(11,149,109,.12);border-color:#0b956d}
.v274-email-fields,.v274-backup-fields{margin-top:14px}
#v271-advanced-form:has(input[name="email_enabled"]:not(:checked)) .v274-email-fields{display:none}
#v271-advanced-form:has(select[name="email_transport"] option[value="php_mail"]:checked) .v274-smtp-only{display:none}
#v271-advanced-form:has(input[name="auto_backup_enabled"]:not(:checked)) .v274-backup-fields{display:none}

/* Keep settings columns stable and reduce accidental label wrapping. */
.v274-advanced-panel .v271-field label{white-space:normal;line-height:1.45}
.v274-advanced-panel .v271-form-actions{margin-top:4px;padding-top:14px;border-top:1px solid #edf2ef}
@media(max-width:760px){
  .v274-settings-block{padding:15px 0}
  .v274-toggle-row{min-height:52px;padding:10px 12px}
  .v274-toggle-copy strong{font-size:14px}
  .v274-settings-block .v271-form-grid{gap:12px}
}
'''
          Path('public/assets/v274-ui-stability.css').write_text(css, encoding='utf-8')
          PY

          php -l public/api.php
          php -l public/index.php
          node --check public/assets/v270-reference-lock.js
          node --check public/assets/v271-unified-shell.js
          test "$(tr -d '\r\n' < VERSION)" = '2.7.4'
          grep -F "query: { section }" public/assets/v271-unified-shell.js
          grep -F "['providers','provider','settings'].includes(r)" public/assets/v270-reference-lock.js
          grep -F "v274-ui-stability.css" public/index.php

          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add VERSION public/api.php public/index.php public/assets/v270-reference-lock.js public/assets/v271-unified-shell.js public/assets/v274-ui-stability.css
          git commit -m 'fix(P04): stabilize settings layout and lazy-load owned routes'
          git push origin HEAD:feature/v2.7.4-ui-stability-performance
