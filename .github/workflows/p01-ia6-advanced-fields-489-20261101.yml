name: P01 IA6 489 all-fields advanced cross-subsite native readback exact source proof
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p01-ia6-advanced-fields-489-20261101.yml
permissions:
  contents: read
jobs:
  advanced-native:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'test(P01):')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      PRODUCT_BRANCH: feat/ia-v6-frontstage-admin-parity-system-jobs-r1
      PRODUCT_SHA: 001c4be5dae2285231d04473a84f6ee20f2d235a
      PRODUCT_VERSION: 2.47.489
      VF_E2E_RUNTIME_ROOT: /tmp/p01-ia6-advanced-fields-20261101
      VF_IA6_DISPOSABLE_ACK: IA6-ADVANCED-ONLY
      P01_TEST_ORIGIN: http://127.0.0.1:19323
      P01_TEST_PASSWORD: IA6SyntheticAdvancedOwner2026!
    steps:
      - name: Checkout public-safe test-only Runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install disposable PHP SQLite and local Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd php-xml >/dev/null
          php -m | grep -Fx pdo_sqlite
          npm install --no-audit --no-fund --no-save playwright@1.57.0 >/dev/null
          npx playwright install chromium >/dev/null
      - name: Bind exact private candidate without publishing artifacts
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          actual="$(git ls-remote "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')"
          test "$actual" = "$PRODUCT_SHA"
          git clone -q --no-checkout "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" candidate
          git -C candidate fetch -q --depth 1 origin "$PRODUCT_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "$PRODUCT_VERSION"
          echo P01_IA6_ADVANCED_EXACT_SOURCE=PASS
      - name: Full advanced field and dormant-domain readback syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          node candidate/tests/unit/p01_ia6_advanced_field_readback_contract.cjs
          node candidate/tests/unit/p01_ia6_advanced_resource_governance_closure_contract.cjs
          node --check candidate/tests/integration/p01_ia6_advanced_fields_browser.mjs
          python3 -m py_compile candidate/tests/integration/p01_ia6_advanced_fields_disposable.py
          php -l candidate/src/app/FrontstageAdvancedResource.php
          php -l candidate/src/app/FunctionalWorkspaceShell.php
          php -l candidate/src/app/SurfaceRepository.php
          php -l candidate/src/api.php
          node --check candidate/src/assets/frontstage-advanced-resource.js
          echo P01_IA6_ADVANCED_NATIVE_CONTRACT_AND_SYNTAX=PASS
      - name: Real synthetic advanced cross-domain Owner HTTP and Chromium readback
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$VF_E2E_RUNTIME_ROOT"
          test "$root" = /tmp/p01-ia6-advanced-fields-20261101
          mkdir -p "$root"
          cp -a candidate/src/. "$root/"
          php -S 127.0.0.1:19323 -t "$root" >/tmp/p01-ia6-advanced-server.log 2>&1 &
          pid=$!
          cleanup() { kill "$pid" >/dev/null 2>&1 || true; rm -rf "$root"; rm -f /tmp/p01-ia6-advanced-cookie /tmp/p01-ia6-advanced-setup.html /tmp/p01-ia6-advanced-installed.html; }
          trap cleanup EXIT
          for i in $(seq 1 40); do
            if curl -fsS -c /tmp/p01-ia6-advanced-cookie -b /tmp/p01-ia6-advanced-cookie "$P01_TEST_ORIGIN/setup.php" -o /tmp/p01-ia6-advanced-setup.html; then break; fi
            sleep 1
          done
          csrf="$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-ia6-advanced-setup.html',encoding='utf-8').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s)
          assert m
          print(m.group(1))
          PY
          )"
          curl -fsS -c /tmp/p01-ia6-advanced-cookie -b /tmp/p01-ia6-advanced-cookie -X POST "$P01_TEST_ORIGIN/setup.php" \
            --data-urlencode "setup_csrf=$csrf" \
            --data-urlencode "site_title=IA6 Synthetic Advanced Field Readback" \
            --data-urlencode "admin_password=$P01_TEST_PASSWORD" \
            --data-urlencode "admin_password_confirm=$P01_TEST_PASSWORD" >/tmp/p01-ia6-advanced-installed.html
          (cd "$root" && php cli/verify.php) | grep -Fx VERIFY_PASS=YES
          python3 candidate/tests/integration/p01_ia6_advanced_fields_disposable.py
          node candidate/tests/integration/p01_ia6_advanced_fields_browser.mjs
          echo P01_IA6_ADVANCED_REAL_SQLITE_BROWSER=PASS
      - name: Remove synthetic source and site bytes
        if: always()
        shell: bash
        run: |
          rm -rf candidate /tmp/p01-ia6-advanced-fields-20261101
          rm -f /tmp/p01-ia6-advanced-server.log /tmp/p01-ia6-advanced-cookie /tmp/p01-ia6-advanced-setup.html /tmp/p01-ia6-advanced-installed.html
          echo P01_IA6_ADVANCED_DISPOSABLE_CLEANUP=PASS
