name: P01 V2.47.360 GOV-BOOK Owner Ready-Link Preview
# Draft creation is preparation only. The Owner authorized this precise preview,
# so only the deliberate Draft -> Ready transition launches the temporary tunnel.
on:
  pull_request:
    types: [ready_for_review]
    branches: [main]
    paths:
      - '.github/workflows/p01-v247360-govbook-owner-preview.yml'
      - '.github/scripts/p01_v247360_govbook_preview_proxy.py'
permissions:
  contents: read
  pull-requests: write
jobs:
  owner-preview:
    if: github.event.action == 'ready_for_review' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'preview/p01-v247360-govbook-owner-20261014'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Checkout exact product without credentials persistence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 131be42e296dadab13a3cc1b79baff42a5002efc
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: product
          persist-credentials: false
      - name: Checkout reviewed preview scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runner-preview
          persist-credentials: false
      - name: Install disposable PHP/SQLite environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,mbstring,zip,gd
          coverage: none
      - name: Exact source and isolated script gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = 131be42e296dadab13a3cc1b79baff42a5002efc
          test "$(tr -d '\r\n ' < product/VERSION)" = 2.47.360
          test "$(tr -d '\r\n ' < product/src/VERSION.txt)" = 2.47.360
          grep -Fq "define('VF_VERSION', '2.47.360');" product/src/app/bootstrap.php
          python3 -m py_compile runner-preview/.github/scripts/p01_v247360_govbook_preview_proxy.py
          test -f product/src/assets/course-library.css
          php -l product/src/app/GovBookSync.php
          php -l product/src/gov-book-sync.php
          echo P01_247360_PREVIEW_EXACT_SOURCE=PASS
      - name: Create fresh isolated install with synthetic administrator
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-v247360-preview
          chmod 700 /tmp/p01-v247360-preview
          python3 - <<'PY'
          import secrets,pathlib
          p=pathlib.Path('/tmp/p01-v247360-preview/admin-password')
          p.write_text('DisposableOnly!'+secrets.token_urlsafe(26),encoding='utf-8')
          p.chmod(0o600)
          PY
          VF_GOV_BOOK_READ_TOKEN="${{ secrets.VF_PRIVATE_READ_TOKEN }}" \
            php -S 127.0.0.1:18541 -t product/src >/tmp/p01-v247360-preview/php.log 2>&1 &
          echo $! >/tmp/p01-v247360-preview/server.pid
          for n in $(seq 1 35); do
            if curl -fsS --max-time 3 -c /tmp/p01-v247360-preview/admin-cookies.txt -b /tmp/p01-v247360-preview/admin-cookies.txt 'http://127.0.0.1:18541/setup.php' -o /tmp/p01-v247360-preview/setup.html; then break; fi
            sleep 1
          done
          python3 - <<'PY'
          import re,pathlib
          s=pathlib.Path('/tmp/p01-v247360-preview/setup.html').read_text(encoding='utf-8')
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s)
          assert m, 'Disposal setup CSRF unavailable'
          pathlib.Path('/tmp/p01-v247360-preview/setup-csrf').write_text(m.group(1))
          PY
          curl -fsS --max-time 20 \
            -c /tmp/p01-v247360-preview/admin-cookies.txt -b /tmp/p01-v247360-preview/admin-cookies.txt \
            -X POST 'http://127.0.0.1:18541/setup.php' \
            --data-urlencode "setup_csrf=$(cat /tmp/p01-v247360-preview/setup-csrf)" \
            --data-urlencode 'site_title=VF Start V2.47.360 SIMULATED PREVIEW' \
            --data-urlencode "admin_password=$(cat /tmp/p01-v247360-preview/admin-password)" \
            --data-urlencode "admin_password_confirm=$(cat /tmp/p01-v247360-preview/admin-password)" \
            -o /tmp/p01-v247360-preview/setup-response.html
          (cd product/src && php cli/verify.php) | grep -Fx 'VERIFY_PASS=YES'
          python3 - <<'PY'
          import json,pathlib
          password=pathlib.Path('/tmp/p01-v247360-preview/admin-password').read_text()
          pathlib.Path('/tmp/p01-v247360-preview/login.json').write_text(json.dumps({'password':password}))
          PY
          chmod 600 /tmp/p01-v247360-preview/login.json
          curl -fsS --max-time 20 \
            -H 'Content-Type: application/json' \
            -b /tmp/p01-v247360-preview/admin-cookies.txt -c /tmp/p01-v247360-preview/admin-cookies.txt \
            --data-binary @/tmp/p01-v247360-preview/login.json \
            'http://127.0.0.1:18541/api.php?action=login' \
            -o /tmp/p01-v247360-preview/login-result.json
          python3 - <<'PY'
          import json,pathlib
          result=json.loads(pathlib.Path('/tmp/p01-v247360-preview/login-result.json').read_text())
          assert result.get('ok') is True, 'Synthetic admin login did not succeed'
          cookie=pathlib.Path('/tmp/p01-v247360-preview/admin-cookies.txt').read_text()
          assert 'vfnav_session' in cookie, 'Synthetic PHP session cookie absent'
          PY
          curl -fsS --max-time 10 -b /tmp/p01-v247360-preview/admin-cookies.txt \
            'http://127.0.0.1:18541/courses.php' \
            -o /tmp/p01-v247360-preview/courses.html
          grep -Fq 'GOV-BOOK 书籍同步' /tmp/p01-v247360-preview/courses.html
          # Synthetic user-owned course, never GOV-BOOK managed, to visually prove
          # that automatic imports do not replace locally-created books.
          php -r '
            require "product/src/app/bootstrap.php";
            $r=new VfRepository(vf_db());
            $b=$r->saveLink(null,[
              "surface"=>"books",
              "title"=>"手工课程：不会被 GOV-BOOK 覆盖",
              "url"=>"https://example.test/manual-course",
              "description"=>"隔离预览模拟数据",
              "tags"=>["owner-created"],
              "is_private"=>1,
              "is_favorite"=>0,
              "force_duplicate"=>1,
            ],"manual");
            require_once "product/src/app/SurfaceRepository.php";
            (new VfSurfaceRepository(vf_db()))->upsertProfile((int)$b["id"],[
              "surface"=>"books","resource_kind"=>"私人课程",
            ]);
          '
          echo P01_247360_MANUAL_COURSE_SENTINEL=PASS
          echo P01_247360_DISPOSABLE_ADMIN_SQLITE=PASS
          echo P01_247360_NO_PRODUCTION_OR_USER_TOKENS=PASS
      - name: Exact Chromium GOV-BOOK private source UI and manual coexistence
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --quiet --break-system-packages 'playwright==1.55.0'
          python3 -m playwright install --with-deps chromium >/dev/null
          cat >/tmp/p01-v247360-preview/verify-ui.py <<'PY'
          import asyncio,pathlib
          from playwright.async_api import async_playwright
          home=pathlib.Path('/tmp/p01-v247360-preview')
          cookies={}
          for row in (home/'admin-cookies.txt').read_text().splitlines():
              if not row or (row.startswith('#') and not row.startswith('#HttpOnly_')):continue
              cols=row.replace('#HttpOnly_','',1).split('\t')
              if len(cols)>=7:cookies[cols[5]]=cols[6]
          assert cookies.get('vfnav_session'),'Synthetic admin session absent'
          async def main():
              async with async_playwright() as pw:
                  browser=await pw.chromium.launch(headless=True,args=['--no-sandbox'])
                  context=await browser.new_context(viewport={'width':1360,'height':900},device_scale_factor=1)
                  await context.add_cookies([{'name':'vfnav_session','value':cookies['vfnav_session'],'url':'http://127.0.0.1:18541'}])
                  page=await context.new_page()
                  await page.goto('http://127.0.0.1:18541/courses.php',wait_until='domcontentloaded')
                  await page.get_by_text('GOV-BOOK 书籍同步',exact=False).first.wait_for(timeout=15000)
                  assert await page.get_by_text('手工课程：不会被 GOV-BOOK 覆盖').count()>0
                  assert await page.get_by_role('button',name='检查书籍版本').count()>0
                  await page.get_by_role('button',name='检查书籍版本').click()
                  await page.wait_for_url('**/courses.php',timeout=45000)
                  await page.get_by_text('已检查 GOV-BOOK 当前书籍版本',exact=False).first.wait_for(timeout=45000)
                  text=await page.locator('body').inner_text()
                  assert '已检查 GOV-BOOK 当前书籍版本' in text, text[-650:]
                  assert '手工课程：不会被 GOV-BOOK 覆盖' in text
                  assert '同步可用版本' in text
                  await page.screenshot(path=str(home/'V247360_GOVBOOK_COURSES_SANITIZED.png'),full_page=True)
                  print('P01_247360_OWNER_PREVIEW_REAL_GITHUB_CATALOG_UI=PASS')
                  await context.close();await browser.close()
          asyncio.run(main())
          PY
          python3 /tmp/p01-v247360-preview/verify-ui.py
          echo P01_247360_COURSES_SCREENSHOT_TOKEN_FREE=PASS
      - name: Start password-hash-only restricted preview proxy
        shell: bash
        run: |
          set -Eeuo pipefail
          nohup python3 runner-preview/.github/scripts/p01_v247360_govbook_preview_proxy.py \
            >/tmp/p01-v247360-preview/proxy.log 2>&1 &
          echo $! >/tmp/p01-v247360-preview/proxy.pid
          for n in $(seq 1 35); do
            code=$(curl --max-time 3 -s -o /dev/null -w '%{http_code}' \
              http://127.0.0.1:18542/courses.php || true)
            [[ "$code" == "401" ]] && break
            sleep 1
          done
          test "$code" = "401"
          for deny in '/app/bootstrap.php' '/setup.php' '/login.php' '/.vfnav-data/' '/api.php?action=import_data' '/assets/../app/bootstrap.php' '/gov-book-sync.php'; do
            code=$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' "http://127.0.0.1:18542$deny")
            test "$code" = "401"
          done
          echo P01_247360_PROXY_REQUIRES_AUTH_AND_DENIES_PRIVATE_ROUTING=PASS
      - name: Confirm strict isolated Courses-only proxy routes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import importlib.util,pathlib
          p=pathlib.Path('runner-preview/.github/scripts/p01_v247360_govbook_preview_proxy.py')
          spec=importlib.util.spec_from_file_location('p01_govbook_proxy',str(p))
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          target=module.PreviewProxy.__new__(module.PreviewProxy)
          for method,url in [('GET','/courses.php'),
                             ('POST','/gov-book-sync.php'),
                             ('GET','/asset.php?file=course-library.css&v=2.47.360')]:
              target.command=method;target.path=url
              assert target.safe_target()==url, (method,url)
          for method,url in [('GET','/gov-book-sync.php'),
                             ('GET','/api.php?action=import_data'),
                             ('GET','/setup.php'),
                             ('GET','/asset.php?file=course-library.css&v=2.47.359'),
                             ('POST','/api.php?action=login')]:
              target.command=method;target.path=url
              assert target.safe_target() is None,(method,url)
          print('P01_247360_STRICT_COURSES_PROXY_POLICY=PASS')
          PY
      - name: Establish Owner-authorized authenticated HTTPS preview
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --location --max-time 90 \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            --output /tmp/p01-v247360-preview/cloudflared
          chmod 700 /tmp/p01-v247360-preview/cloudflared
          nohup /tmp/p01-v247360-preview/cloudflared tunnel \
            --url http://127.0.0.1:18542 --no-autoupdate \
            >/tmp/p01-v247360-preview/tunnel.log 2>&1 &
          echo $! >/tmp/p01-v247360-preview/tunnel.pid
          URL=''
          for n in $(seq 1 90); do
            URL=$(grep -oE 'https://[a-z0-9-]+[.]trycloudflare[.]com' \
              /tmp/p01-v247360-preview/tunnel.log | head -1 || true)
            [[ -n "$URL" ]] && break
            sleep 2
          done
          test -n "$URL"
          printf '%s' "$URL" >/tmp/p01-v247360-preview/preview-url
          for n in $(seq 1 40); do
            CODE=$(curl -s --max-time 15 -o /dev/null -w '%{http_code}' "$URL/courses.php" || true)
            [[ "$CODE" == "401" ]] && break
            sleep 2
          done
          test "$CODE" = "401"
          echo 'P01_247360_ISOLATED_HTTPS_BASIC_AUTH=PASS'
          echo "P01_247360_OWNER_PREVIEW_URL=$URL/courses.php"
          echo 'P01_247360_PREVIEW_LOGIN_USERNAME=preview'
          echo 'P01_247360_PREVIEW_PASSWORD=DELIVERED_IN_OWNER_PRIVATE_CHAT_NOT_GITHUB'
          echo 'P01_247360_PREVIEW_RUNTIME_LIMIT=75_MINUTES'
          echo 'P01_247360_OWNER_PREVIEW_RUNTIME=PENDING_OWNER'
          echo 'P01_247360_OWNER_REAL_USE=PENDING_OWNER'
          echo 'P01_247360_PRODUCTION=UNTOUCHED'
      - name: Publish verified preview entry to PR for immediate Owner delivery
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          URL="$(cat /tmp/p01-v247360-preview/preview-url)"
          test -n "$URL"
          MESSAGE="$(printf 'P01 V2.47.360 Owner preview READY.\n\nURL: %s/courses.php\nUser: preview\nPassword: delivered only in Owner ChatGPT conversation (never in GitHub).\n\nExpires around 75 minutes after this comment. This is disposable synthetic data, never Production. Machine PASS != Owner PASS.\n' "$URL")"
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/${{ github.event.pull_request.number }}/comments" \
            -f body="$MESSAGE" | jq -e '.html_url' >/dev/null
          echo P01_247360_OWNER_PREVIEW_ENTRY_POSTED_TO_PR=PASS
      - name: Keep disposable preview active while Owner reviews
        shell: bash
        timeout-minutes: 80
        env:
          VF_GOV_BOOK_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          for n in $(seq 1 450); do
            for role in server proxy tunnel; do
              kill -0 "$(cat "/tmp/p01-v247360-preview/$role.pid")"
            done
            # Queue-backed admin imports are processed by the existing worker.
            # All worker data and credentials remain inside this disposable VM.
            if (( n % 6 == 0 )); then
              (cd product/src && php cli/worker.php >/dev/null 2>&1) || true
            fi
            sleep 10
          done
          echo P01_247360_PREVIEW_REVIEW_WINDOW_EXPIRED=PASS
      - name: Kill temporary servers, tunnel and erase credentials
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          for role in tunnel proxy server; do
            f="/tmp/p01-v247360-preview/$role.pid"
            if test -f "$f"; then kill "$(cat "$f")" 2>/dev/null || true; fi
          done
          rm -f /tmp/p01-v247360-preview/admin-password \
            /tmp/p01-v247360-preview/admin-cookies.txt \
            /tmp/p01-v247360-preview/login.json \
            /tmp/p01-v247360-preview/login-result.json \
            /tmp/p01-v247360-preview/setup-csrf
          echo P01_247360_PREVIEW_STOPPED_AND_AUTH_ERASED=PASS
      - name: Save sanitized nonsecret preview screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: P01-V247360-GOVBOOK-Isolated-Owner-Preview
          path: /tmp/p01-v247360-preview/V247360_GOVBOOK_COURSES_SANITIZED.png
          if-no-files-found: warn
          retention-days: 2
