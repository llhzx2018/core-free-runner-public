name: P01 News v506 exact 505-to-506 package and BackupManager isolation
on:
  push:
    branches:
      - task/p01-news-v506-exact-release-gate-20261109
permissions:
  contents: read
concurrency:
  group: p01-news-v506-exact-proof-20261109
  cancel-in-progress: false
jobs:
  news-release-candidate:
    if: github.repository == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PRODUCT_SHA: 665a24645101096df9cb4b4800154cdf04167a67
      VF_NEWS_R5_SANDBOX: '1'
      VF_NEWS_R5_TARGET_VERSION: '2.47.506'
      GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Checkout registered public-safe runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up clean isolated PHP runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-curl php-xml php-mbstring php-sqlite3 php-zip php-gd unzip >/dev/null
          php -m | grep -Fxi pdo_sqlite
          php -m | grep -Fxi SimpleXML
          test -f scripts/p01-maintenance-release.py
          echo P01_NEWS_506_RUNNER_RUNTIME=PASS
      - name: Checkout exact P01 News candidate only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 665a24645101096df9cb4b4800154cdf04167a67
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p01-exact
          persist-credentials: false
      - name: Bound exact candidate identity and News scoped regression
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p01-exact rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(tr -d '\r\n ' < p01-exact/VERSION)" = "2.47.506"
          test "$(tr -d '\r\n ' < p01-exact/src/VERSION.txt)" = "2.47.506"
          grep -Fx "define('VF_VERSION', '2.47.506');" p01-exact/src/app/bootstrap.php
          test -z "$(git -C p01-exact status --porcelain)"
          php -l p01-exact/src/app/bootstrap.php >/dev/null
          php -l p01-exact/src/app/NewsFeedService.php >/dev/null
          php -l p01-exact/src/app/NewsFeedPage.php >/dev/null
          php -l p01-exact/src/app/NewsTopicDigest.php >/dev/null
          php p01-exact/tests/unit/p01_news_release_surface_contract.php
          php p01-exact/tests/unit/p01_news_topic_digest_contract.php
          php p01-exact/tests/unit/p01_news_feed_service_contract.php
          php p01-exact/tests/unit/p01_news_source_preferences_contract.php
          echo P01_NEWS_506_EXACT_SOURCE_SECURITY_UNITS=PASS
      - name: Actual exact-v506 isolated FULL Atomic private cache protected backup restore fault rollback
        shell: bash
        timeout-minutes: 22
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          bash p01-exact/tests/integration/p01_news_r5_atomic_package_gate.sh
          echo P01_NEWS_506_EXACT_PACKAGE_GATE=PASS
          echo P01_NEWS_506_UNTESTED_SECURITY_PR_IMPORT_DISASTER=NOT_RUN
          echo P01_NEWS_506_FORMAL_RELEASE=NOT_PUBLISHED
          echo P01_NEWS_506_PRODUCTION_WRITES=NONE
      - name: Cleanup transient private checkout
        if: always()
        shell: bash
        run: |
          rm -rf p01-exact
          echo P01_NEWS_506_PRIVATE_SOURCE_PERSISTED=NO
