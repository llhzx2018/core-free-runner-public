name: P01 V2.35.1 Docs Closure Harness Fix
on:
  push:
    branches: [release/p01-v2350-orchestrator-20260831]
    paths: [.github/workflows/p01-v2351-release-docs-closure-harness-fix-20260831.yml]
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout runner release branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: release/p01-v2350-orchestrator-20260831
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
      - name: Patch only jq precedence assertion
        shell: bash
        run: |
          set -Eeuo pipefail
          F=.github/workflows/p01-v2351-release-docs-closure-20260831.yml
          python3 - "$F" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          old='jq -e \' .published_release.version=="2.35.1"'
          # Exact literal replacement, with guards, avoids touching release logic.
          bad='jq -e \' .published_release.version=="2.35.1"'
          target='jq -e \' .published_release.version=="2.35.1"'
          literal='jq -e \' .published_release.version=="2.35.1"'
          old_line='          jq -e \' .published_release.version=="2.35.1"'
          # Work on the actual expression independent of indentation.
          before='.published_release.version=="2.35.1" and .production_version=="2.35.0" and .published_release.release_id==379424818 and .published_release.remote_online_update_gate==33342341412 and .formal_release_state|contains("OWNER PRODUCTION UPGRADE PENDING")'
          after='(.published_release.version=="2.35.1" and .production_version=="2.35.0" and .published_release.release_id==379424818 and .published_release.remote_online_update_gate==33342341412 and (.formal_release_state|contains("OWNER PRODUCTION UPGRADE PENDING")))'
          if s.count(before)!=1: raise SystemExit(f'expected exactly one bad expression, got {s.count(before)}')
          p.write_text(s.replace(before,after),encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --numstat -- "$F" | awk '{print $1":"$2}')" = 1:1
          grep -F 'and (.formal_release_state|contains("OWNER PRODUCTION UPGRADE PENDING")))' "$F" >/dev/null
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add "$F"
          git commit -m 'test(P01): fix V2.35.1 docs closure jq precedence'
          git push origin HEAD:release/p01-v2350-orchestrator-20260831
          echo P01_V2351_DOCS_CLOSURE_HARNESS_FIX=PASS
