name: S01-C01 exact channel isolated regression
on:
  push:
    branches: [task/s01-c01-eight-page-13596-channel-check]
permissions:
  contents: read
  actions: read
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_REPO: 'llhzx2018/core-updates'
      TARGET_VERSION: '1.3.0'
      TARGET_SHA: 'cf731be032ed2462c43fd17a7b9196a451f66240'
      TARGET_TREE: '3fa07f3d27dfeae7c8b3f91969ecf1cc0fb928dd'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runner
          persist-credentials: false
      - name: Exact spec identity
        run: |
          set -Eeuo pipefail
          mkdir -p proof
          python3 runner/scripts/ephemeral_lane_spec.py render --spec runner/lanes/s01-c01-eight-page-13596-channel/spec.json --template runner/lanes/s01-c01-eight-page-13596-channel/channel.template.yml --output /tmp/channel-check.yml >/dev/null
          cmp /tmp/channel-check.yml runner/.github/workflows/s01-c01-eight-page-13596-channel-check.yml
          python3 runner/scripts/ephemeral_lane_spec.py audit-rendered --spec runner/lanes/s01-c01-eight-page-13596-channel/spec.json --input runner/.github/workflows/s01-c01-eight-page-13596-channel-check.yml > proof/identity-audit.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: 'llhzx2018/core-updates'
          ref: 'cf731be032ed2462c43fd17a7b9196a451f66240'
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Unchanged native CI and exact manifest
        working-directory: target
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 'cf731be032ed2462c43fd17a7b9196a451f66240'
          test "$(git rev-parse HEAD^{tree})" = '3fa07f3d27dfeae7c8b3f91969ecf1cc0fb928dd'
          test "$(git diff --name-only '4b0c79b5e8d5462c99c19cfb6c2f85e5fb7b1aa3' HEAD)" = projects/S01-C01.json
          test "$(cat VERSION)" = '1.3.0'
          git diff --exit-code '4b0c79b5e8d5462c99c19cfb6c2f85e5fb7b1aa3' HEAD -- .github/workflows/update-core-ci.yml update-core/php scripts/check_manifest_contract.py schemas
          python3 scripts/check_manifest_contract.py
          php -v
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PY'
          import pathlib,json
          m=json.loads(pathlib.Path('projects/S01-C01.json').read_text())
          assert m['target_version']=='1.35.96' and m['asset_sha256']=='de56ac8a8dcfe1022ba60ab5df7f9d1db107a2b6b1037bdbfeafe06d5512e22b' and m['asset_bytes']==1784430
          assert m['from_versions'][-1]=='1.35.95' and len(m['from_versions'])==len(set(m['from_versions']))==88
          assert m['backup_required'] and m['rollback_supported'] and m['schema_from']==m['schema_to']=='N/A'
          print('VF_CHANNEL_NATIVE_BEGIN')
          r={'status':'PASS','repository':'llhzx2018/core-updates','source_sha':'cf731be032ed2462c43fd17a7b9196a451f66240','source_tree':'3fa07f3d27dfeae7c8b3f91969ecf1cc0fb928dd','native_ci_unmodified':'PASS','manifest_contract':'PASS','php_syntax':'PASS','update_core_regression':'PASS','scope_one_manifest':'PASS','production':'NOT_EXECUTED'}
          pathlib.Path('../proof/channel.json').write_text(json.dumps(r,indent=2));print(json.dumps(r))
          print('VF_CHANNEL_NATIVE_END')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c01-channel-${{ github.run_id }}
          path: proof/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Cleanup transient target
        if: always()
        run: rm -rf target

