name: P01 V2.47.236 Backend Discovery Proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v247236-backend-discovery.yml'
      - 'proof-triggers/p01-v247236-backend-discovery.json'

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout proof control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-curl >/dev/null
          php -m | grep -Fx curl
          echo P01_DISCOVERY_RUNTIME=PASS

      - name: Checkout exact P01 source
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" product
          git -C product fetch -q --depth 1 origin 7bf09755c748b220191fa701e036ecb997c89ebf
          git -C product checkout -q --detach FETCH_HEAD
          test "$(git -C product rev-parse HEAD)" = "7bf09755c748b220191fa701e036ecb997c89ebf"
          test "$(tr -d '\r\n ' < product/VERSION)" = "2.47.236"
          test "$(tr -d '\r\n ' < product/src/VERSION.txt)" = "2.47.236"
          echo P01_DISCOVERY_EXACT_SOURCE=PASS

      - name: Execute live backend discovery path
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          php <<'PHP'
          <?php
          declare(strict_types=1);
          require getcwd().'/product/src/app/CoreUpdates/GitHubClient.php';
          require getcwd().'/product/src/app/CoreUpdates/UpdateCore.php';

          $token=trim((string)getenv('VF_PRIVATE_READ_TOKEN'));
          if($token==='') throw new RuntimeException('missing read token');
          $client=new \CoreUpdates\GitHubClient($token,'vf-p01-v247236-discovery-proof');
          $manifest=$client->fetchProjectManifest('llhzx2018/core-updates','P01.json','main');

          $expect=[
            'project_id'=>'P01',
            'component_id'=>'APP',
            'current_version'=>'2.47.235',
            'target_version'=>'2.47.236',
            'schema_from'=>'2026090401',
            'schema_to'=>'2026090401',
            'repository'=>'llhzx2018/vf-start',
            'release_tag'=>'v2.47.236',
            'asset_name'=>'VF_Start_V2.47.236_UPDATE.zip',
            'product_identity'=>'7bf09755c748b220191fa701e036ecb997c89ebf',
            'asset_sha256'=>'2036a2af861bb870bcf658ae6613dc5aa205a7a2d466a0a103afec7d425e8f82',
          ];
          foreach($expect as $key=>$value){if(($manifest[$key]??null)!==$value)throw new RuntimeException('manifest mismatch: '.$key);}
          if(($manifest['release_id']??null)!==403082428)throw new RuntimeException('release id mismatch');
          if(($manifest['asset_bytes']??null)!==2270528)throw new RuntimeException('asset bytes mismatch');
          if(($manifest['from_versions']??null)!==['2.47.235'])throw new RuntimeException('from_versions mismatch');
          if(($manifest['enabled']??null)!==true||($manifest['update_type']??null)!=='ATOMIC')throw new RuntimeException('channel state mismatch');

          $core=new \CoreUpdates\UpdateCore('P01','APP');
          $availability=$core->check('2.47.235','2026090401',$manifest);
          if(($availability['status']??'')!=='AVAILABLE')throw new RuntimeException('not available');
          if(($availability['target_version']??'')!=='2.47.236')throw new RuntimeException('target mismatch');

          $dest='/tmp/VF_Start_V2.47.236_UPDATE.zip';@unlink($dest);
          $asset=$client->downloadReleaseAsset('llhzx2018/vf-start','v2.47.236','VF_Start_V2.47.236_UPDATE.zip',$dest);
          if((int)($asset['size']??0)!==2270528)throw new RuntimeException('asset size mismatch');
          $verified=$core->verifyPackage($dest,$manifest);
          if(($verified['status']??'')!=='VERIFIED')throw new RuntimeException('package verification failed');

          echo json_encode([
            'status'=>'PASS','current_version'=>'2.47.235','latest_version'=>'2.47.236',
            'available'=>true,'can_update'=>true,'release_id'=>403082428,'asset_bytes'=>2270528,
            'asset_sha256'=>'2036a2af861bb870bcf658ae6613dc5aa205a7a2d466a0a103afec7d425e8f82',
            'product_identity'=>'7bf09755c748b220191fa701e036ecb997c89ebf',
            'production_write'=>false,'update_prepare_called'=>false,'update_install_called'=>false
          ],JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE).PHP_EOL;
          echo "P01_BACKEND_DISCOVERY_V247236=PASS\n";
          PHP

      - name: Assert no Production mutation
        shell: bash
        run: |
          echo PRODUCTION_WRITE=0
          echo UPDATE_PREPARE_CALLED=NO
          echo UPDATE_INSTALL_CALLED=NO
