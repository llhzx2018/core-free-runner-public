name: S01 Dashboard De-dup R3 Gate

on:
  push:
    branches:
      - task/s01-dashboard-dedup-r3-gate
    paths:
      - .github/workflows/s01-dashboard-dedup-r3-gate.yml

permissions:
  contents: read

jobs:
  exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Credential
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"

      - name: Exact diff and source
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          REPO="llhzx2018/vf-tools-ops"
          BASE="1f2a0a1a9695146cd1b67be359e06dbeb4e3444b"
          HEAD="09dfbbe3d3cbdf76850f13e81a9c4d9c576738b2"
          curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/compare/$BASE...$HEAD" -o /tmp/compare.json
          test "$(jq -r '.status' /tmp/compare.json)" = "ahead"
          cat >/tmp/expected <<'EOF'
          CHANGELOG.md
          VERSION
          includes/admin-v13/views/dashboard.php
          tests/s01-c02-dashboard-domain-dedup-r3-contract.php
          vf-ops.php
          EOF
          jq -r '.files[].filename' /tmp/compare.json | sort >/tmp/actual
          sort /tmp/expected -o /tmp/expected
          diff -u /tmp/expected /tmp/actual

          mkdir -p /tmp/src
          curl -fsSL -L -H "Authorization: Bearer $READ_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/tarball/$HEAD" -o /tmp/src.tar.gz
          tar -xzf /tmp/src.tar.gz -C /tmp/src
          echo "SOURCE_DIR=$(find /tmp/src -mindepth 1 -maxdepth 1 -type d -print -quit)" >> "$GITHUB_ENV"

      - name: Required applicability and exact contracts
        run: |
          set -Eeuo pipefail
          echo "INSTALL=N_A"
          echo "SECURITY=REQUIRED"
          echo "TESTING=REQUIRED"
          echo "UPGRADE=REQUIRED"
          echo "GIT=REQUIRED"
          echo "UA_UI=REQUIRED"
          test "$(tr -d '\r\n' < "$SOURCE_DIR/VERSION")" = "1.21.949"
          grep -F "Version: 1.21.949" "$SOURCE_DIR/vf-ops.php"
          grep -F "VF_OPS_VERSION', '1.21.949'" "$SOURCE_DIR/vf-ops.php"
          php -l "$SOURCE_DIR/includes/admin-v13/views/dashboard.php"
          php -l "$SOURCE_DIR/tests/s01-c02-dashboard-domain-dedup-r3-contract.php"
          php "$SOURCE_DIR/tests/s01-c02-dashboard-domain-dedup-r3-contract.php"
          php "$SOURCE_DIR/tests/s01-c02-page-body-v2-production-realuse-r2-contract.php"
          php "$SOURCE_DIR/tests/s01-c02-page-body-system-v2-full-surface-contract.php"

      - name: Exact update package
        run: |
          set -Eeuo pipefail
          python3 "$SOURCE_DIR/.github/release/build-ops-package.py"             --source "$SOURCE_DIR"             --output /tmp/vf-tools-ops_V1.21.949.zip             >/tmp/meta.json
          jq -e '.asset_bytes>0 and (.asset_sha256|length)==64 and .runtime_files>0 and (.runtime_fingerprint|length)==64' /tmp/meta.json
          python3 - <<'PY'
          import zipfile
          p="/tmp/vf-tools-ops_V1.21.949.zip"
          with zipfile.ZipFile(p) as z:
              names=[n for n in z.namelist() if not n.endswith("/")]
          assert names and all(n.startswith("vf-ops/") for n in names)
          assert "vf-ops/vf-ops.php" in names
          assert not any(n.startswith("vf-ops/vf-ops/") for n in names)
          PY
          echo "DASHBOARD_DEDUP_R3_GATE=PASS"
