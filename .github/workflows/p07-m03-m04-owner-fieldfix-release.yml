name: P07 M03 M04 Owner fieldfix · formal public patch package
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-m03-m04-owner-fieldfix-release.yml'
      - 'packages/p07-system-care/0.1.0-ux3/**'
      - 'installers/p07-m03-release135-repair.sh'
      - 'installers/p07-system-care-ux3-isolated.sh'
      - 'installers/p07-toolbox.sh'
  push:
    branches: [main]
    paths: ['.github/workflows/p07-m03-m04-owner-fieldfix-release.yml']
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Exact public source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Recheck Owner's two repair source identities and M04 manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = llhzx2018/core-free-runner-public
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object installers/p07-m03-release135-repair.sh)" = ede84039edc66fdbb5f218b6b505b9edd00bb3a7
          test "$(git hash-object installers/p07-system-care-ux3-isolated.sh)" = b22bc0af418d84b4686aff665605afd8674f98e5
          test "$(git hash-object packages/p07-system-care/0.1.0-ux3/MANIFEST.gitblob)" = f597bb586dd29059210befea0e09d93d2d87cb41
          # This workflow audits immutable 2026-11-13 fieldfix source, not a
          # forever-fixed Current Toolbox version. UX4 has its own official
          # runtime-upgrade, negative and rollback gate.
          if grep -Fqx 'BUILD_ID="0.1.0-five-modules-ux3-fieldfix1"' installers/p07-toolbox.sh; then
            grep -Fqx 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release135"' installers/p07-toolbox.sh
            grep -Fqx 'M04_BUILD_EXPECTED="0.1.0-ux3"' installers/p07-toolbox.sh
            grep -Fqx 'M04_PREVIOUS_BUILD="0.1.0-ux2"' installers/p07-toolbox.sh
          elif grep -Fqx 'BUILD_ID="0.1.0-five-modules-ux4-m03-m05-20261114"' installers/p07-toolbox.sh; then
            grep -Fqx 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release136"' installers/p07-toolbox.sh
            grep -Fqx 'M04_BUILD_EXPECTED="0.1.0-ux3"' installers/p07-toolbox.sh
          else
            grep -Fqx 'BUILD_ID="0.1.0-owner-field-recovery-m03-m04-20261114"' installers/p07-toolbox.sh
            grep -Fqx 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release136"' installers/p07-toolbox.sh
            grep -Fqx 'M03_LEGACY115_BUILD="0.1.0-release115"' installers/p07-toolbox.sh
            grep -Fqx 'M04_BUILD_EXPECTED="0.1.0-ux4"' installers/p07-toolbox.sh
            grep -Fqx 'M04_PREVIOUS_BUILD="0.1.0-ux3"' installers/p07-toolbox.sh
          fi
          bash -n installers/p07-m03-release135-repair.sh
          bash -n installers/p07-system-care-ux3-isolated.sh
          python3 -B -m unittest discover -s tests -p 'test_p07_owner_fieldfix_m03_m04.py' -q
          python3 -B -m unittest discover -s tests -p 'test_p07_m04_terminal_ux_v3_ux3.py' -q
          (cd packages/p07-system-care/0.1.0-ux3
            while read -r sha name; do
              test -n "$sha" && test "$(git hash-object "$name")" = "$sha"
            done < MANIFEST.gitblob)
          echo P07_M03_M04_OWNER_FIELD_REPAIR_CURRENT_SOURCE_AND_REAL_UX=PASS
      - name: Build immutable M04 ZIP and record exact official patch SHA256
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/p07-hotfix"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,os,stat,zipfile
          source=Path("packages/p07-system-care/0.1.0-ux3")
          target=Path(os.environ["RUNNER_TEMP"])/"p07-hotfix"
          items=sorted(x for x in source.rglob("*") if x.is_file())
          assert len(items)==25
          def make_zip(path):
              with zipfile.ZipFile(path,"x",compression=zipfile.ZIP_DEFLATED,compresslevel=9,allowZip64=False) as z:
                  for file in items:
                      assert not file.is_symlink()
                      name="p07-m04/"+file.relative_to(source).as_posix()
                      info=zipfile.ZipInfo(name,(2026,1,1,0,0,0))
                      info.compress_type=zipfile.ZIP_DEFLATED
                      info.external_attr=(stat.S_IFREG|0o644)<<16
                      z.writestr(info,file.read_bytes())
              return hashlib.sha256(path.read_bytes()).hexdigest()
          package="P07-M04-0.1.0-ux3.zip"
          a=make_zip(target/package)
          b=make_zip(target/("repeat-"+package))
          assert a==b
          (target/("repeat-"+package)).unlink()
          with zipfile.ZipFile(target/package) as z:
              assert len(set(z.namelist()))==25
              assert z.read("p07-m04/VERSION")==b"0.1.0-ux3\n"
          (target/"P07-M03-release135-repair.sh").write_bytes(Path("installers/p07-m03-release135-repair.sh").read_bytes())
          (target/"P07-TOOLBOX-0.1.0-ux3-fieldfix1.sh").write_bytes(Path("installers/p07-toolbox.sh").read_bytes())
          names=[package,"P07-M03-release135-repair.sh","P07-TOOLBOX-0.1.0-ux3-fieldfix1.sh"]
          (target/"SHA256SUMS").write_text("".join(hashlib.sha256((target/name).read_bytes()).hexdigest()+"  "+name+"\n" for name in names))
          print("P07_M03_M04_PUBLIC_FIELD_REPAIR_DETERMINISTIC_ARTIFACTS=PASS")
          for name in names:
              print(name+" SHA256="+hashlib.sha256((target/name).read_bytes()).hexdigest())
          PY
          (cd "$RUNNER_TEMP/p07-hotfix" && sha256sum -c SHA256SUMS)
      - name: Publish immutable Owner-directed formal patch, exact main only
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'P07 M03 M04 owner fieldfix formal publish')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          [[ -n "$GH_TOKEN" ]] || { echo RELEASE_WRITE_CAPABILITY_MISSING; exit 78; }
          repo='llhzx2018/core-free-runner-public'
          tag='p07-m03-m04-owner-fieldfix1-20261114'
          test "$(gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          if gh release view "$tag" -R "$repo" >/dev/null 2>&1; then
            test "$(gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.sha')" = "$GITHUB_SHA" || exit 81
            test "$(gh api "repos/$repo/releases/tags/$tag" --jq '.assets|length')" = 4 || exit 81
          else
            if gh api "repos/$repo/git/ref/tags/$tag" >/dev/null 2>&1; then exit 81; fi
            gh release create "$tag" -R "$repo" --target "$GITHUB_SHA" \
              --title 'P07 现场修复：M03 网站与数据 / M04 服务器维护与安全' \
              --notes 'P07 M03 release135 继续沿用原不可变 ZIP；新增下载/哈希/清单分步安全诊断和同官方 GitHub Asset ID 备用下载。M04 0.1.0-ux3 修复真实菜单 ui_prompt 缺失，允许经验证的 ux2 旧版原子升级/回滚。保留 M01/M02/M05 不变。Owner VPS、网站、数据库、迁移、DNS 全部未操作。'
            gh release upload "$tag" -R "$repo" \
              "$RUNNER_TEMP/p07-hotfix/P07-M04-0.1.0-ux3.zip" \
              "$RUNNER_TEMP/p07-hotfix/P07-M03-release135-repair.sh" \
              "$RUNNER_TEMP/p07-hotfix/P07-TOOLBOX-0.1.0-ux3-fieldfix1.sh" \
              "$RUNNER_TEMP/p07-hotfix/SHA256SUMS"
          fi
          test "$(gh api "repos/$repo/releases/tags/$tag" --jq '.assets|length')" = 4
          tmp="$(mktemp -d)"
          trap 'rm -rf -- "$tmp"' EXIT
          gh release download "$tag" -R "$repo" --dir "$tmp"
          (cd "$tmp"; sha256sum -c SHA256SUMS)
          cmp "$tmp/P07-TOOLBOX-0.1.0-ux3-fieldfix1.sh" installers/p07-toolbox.sh
          echo P07_M03_M04_OWNER_HOTFIX_REMOTE_RELEASE_READBACK=PASS
          echo P07_PRODUCTION_MIGRATION_DNS=NOT_RUN
      - name: Always erase candidate binaries
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/p07-hotfix"
          echo P07_PRIVATE_SOURCE_OR_OWNER_DATA_PUBLICATION=NONE
