name: P04 Server Daily UX Exact-Source Gate

on:
  push:
    branches:
      - candidate/p04-server-daily-ux-gate-20260830
    paths:
      - '.github/workflows/p04-server-daily-ux-gate-20260830.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CANDIDATE: b4a9b57cff7b6d78e4aed059b000b2ebfa30f207
      BASE_DEVELOP: b4ecd5dd150165b43be9404ab7ceb18c53b36137
      TARGET_BRANCH: ui/p04-server-daily-ux-20260830
      EVIDENCE: ${{ github.workspace }}/evidence

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify registered private read capability
        shell: bash
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          if [ -z "$PRIVATE_READ_TOKEN" ]; then
            echo 'RUNNER_INFRASTRUCTURE_BLOCK=VF_PRIVATE_READ_TOKEN_MISSING'
            exit 78
          fi

      - name: Checkout exact P04 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-infra
          ref: ${{ env.CANDIDATE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, sodium, zip, mbstring, fileinfo
          coverage: none

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Exact source fence and static contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$CANDIDATE"
          test "$(git -C product rev-parse origin/$TARGET_BRANCH)" = "$CANDIDATE"
          test "$(git -C product merge-base "$BASE_DEVELOP" "$CANDIDATE")" = "$BASE_DEVELOP"
          test "$(tr -d '\r\n' < product/VERSION)" = '2.8.11'
          mapfile -t changed < <(git -C product diff --name-only "$BASE_DEVELOP" "$CANDIDATE")
          test "${#changed[@]}" -eq 4
          for file in \
            public/assets/daily-server-ux-polish.css \
            public/assets/daily-server-ux-polish.js \
            public/index.php \
            tests/unit/ui_daily_server_ux_polish_contract.php; do
            printf '%s\n' "${changed[@]}" | grep -Fxq "$file"
          done
          git -C product diff --quiet "$BASE_DEVELOP" "$CANDIDATE" -- database config src VERSION VF_PROJECT.json
          cd product
          python3 scripts/repository-health-gate.py
          python3 scripts/check-migrations.py
          find src public tests -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          node --check public/assets/daily-server-ux-polish.js
          php tests/unit/ui_daily_server_ux_polish_contract.php .
          php tests/unit/ui_contract_v280.php .
          php tests/unit/maintenance_ui_contract_v288.php .
          php tests/unit/domain_attention_group_management_ui_v289.php .
          echo P04_SERVER_DAILY_UX_STATIC_GATE=PASS

      - name: Install Chromium runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          npm init -y >/dev/null 2>&1
          npm install --no-save --no-package-lock playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Fresh-install server browser UX gate
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE"
          cd product
          WEB="$RUNNER_TEMP/p04-server-daily-ux-runtime"
          python3 scripts/build-release-tree.py "$WEB" >"$EVIDENCE/build.json"
          test -f "$WEB/assets/daily-server-ux-polish.css"
          test -f "$WEB/assets/daily-server-ux-polish.js"
          PORT=19043
          php -d opcache.jit=0 -S "127.0.0.1:$PORT" -t "$WEB" >"$EVIDENCE/php-server.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 120); do
            curl -fsS "http://127.0.0.1:$PORT/setup.php" >/dev/null 2>&1 && break
            sleep .1
          done
          cat > "$RUNNER_TEMP/p04-server-daily-ux.mjs" <<'JS'
          import { chromium } from 'playwright';
          import { execFileSync } from 'node:child_process';
          import fs from 'node:fs';
          const base='http://127.0.0.1:19043';
          const evidence=process.env.EVIDENCE;
          const candidate=process.env.CANDIDATE;
          const webRoot=process.env.WEB_ROOT;
          const password='Vf'+crypto.randomUUID().replaceAll('-','')+'Aa1';
          const report={status:'FAIL',source_sha:candidate,list:{},detail:{},mobile:{},page_errors:[],console_errors:[]};
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1365,height:900}});
          const page=await context.newPage();
          page.on('pageerror',e=>report.page_errors.push(String(e?.stack||e)));
          page.on('console',m=>{if(m.type()==='error') report.console_errors.push(m.text())});
          const assert=(value,message)=>{if(!value) throw new Error(message)};
          async function cold(hash){
            await page.goto('about:blank');
            await page.goto(`${base}/index.php#${hash}`,{waitUntil:'domcontentloaded'});
            await page.locator('#v270-app h1').waitFor({state:'visible',timeout:15000});
            await page.waitForTimeout(600);
          }
          try {
            await page.goto(`${base}/setup.php`,{waitUntil:'domcontentloaded'});
            await page.locator('#site_name').fill('VF Infra Server Daily UX Gate');
            await page.locator('#password').fill(password);
            await page.locator('#password_confirm').fill(password);
            await Promise.all([page.waitForURL(/login\.php\?installed=1/),page.getByRole('button',{name:'安装并进入系统'}).click()]);
            await page.locator('#admin-password').fill(password);
            await Promise.all([page.waitForURL(/index\.php(?:#.*)?$/),page.getByRole('button',{name:'登录'}).click()]);
            assert((await page.locator('meta[name="app-version"]').getAttribute('content'))==='2.8.11','version mismatch');

            const fixture=execFileSync('php',['tests/fixtures/v260-user-task-fixture.php',webRoot],{encoding:'utf8'});
            assert(fixture.includes('P04_V260_USER_TASK_FIXTURE_PASS'),'server fixture failed');
            execFileSync('php',['-r','require getenv("WEB_ROOT")."/bootstrap.php"; Database::connection()->exec("UPDATE compute_instances SET power_status=\'stopped\', external_status=\'stopped\' WHERE external_instance_id=\'v260-edge-01\'");'],{env:{...process.env,WEB_ROOT:webRoot},encoding:'utf8'});

            await cold('servers');
            assert(await page.locator('body.v2812-server-ux').count()===1,'server UX body class missing');
            const toolbar=page.locator('[data-v275-toolbar="servers"]');
            await toolbar.waitFor({state:'visible',timeout:10000});
            const brief=page.locator('.v2812-server-brief');
            await brief.waitFor({state:'visible',timeout:10000});
            const row=page.locator('table.server-table tbody tr').filter({hasText:'v260-edge-01'}).first();
            await row.waitFor({state:'visible'});
            assert((await row.getAttribute('data-v2812-server-risk'))==='attention','stopped server attention missing');
            assert((await row.locator('[data-v270-action="server"]').getAttribute('aria-label'))==='管理 v260-edge-01','server action aria missing');
            assert((await toolbar.locator('input[type="search"]').getAttribute('placeholder'))==='搜索服务器、服务商、区域或状态','server search placeholder missing');
            const initial=(await brief.innerText()).replace(/\s+/g,' ').trim();
            assert(initial.includes('本页 1 台服务器'),`initial brief ${initial}`);
            assert(initial.includes('需要优先处理'),`attention brief ${initial}`);
            report.list.attention='PASS';
            report.list.summary='PASS';

            const search=toolbar.locator('input[type="search"]');
            await search.fill('no-such-server');
            await page.waitForTimeout(150);
            const filtered=(await brief.innerText()).replace(/\s+/g,' ').trim();
            assert(filtered.includes('当前显示 0 / 1 台服务器'),`filtered brief ${filtered}`);
            await search.fill('v260-edge-01');
            await row.waitFor({state:'visible'});
            report.list.filter_summary='PASS';
            await page.screenshot({path:`${evidence}/01-servers-desktop.png`,fullPage:true,animations:'disabled'});

            await row.locator('[data-v270-action="server"]').click();
            await page.locator('.v270-ref-summary[data-ref-lock="server-summary"]').waitFor({state:'visible',timeout:10000});
            assert(await page.locator('.v270-ref-summary[data-ref-lock="server-summary"] .v270-ref-metric[data-v2812-server-priority]').count()>=1,'detail priority missing');
            assert((await page.locator('.v270-next h2').innerText()).trim()==='下一步','owner next copy not simplified');
            assert(await page.locator('.v270-side h2').filter({hasText:'高风险操作边界'}).count()===1,'risk boundary copy missing');
            report.detail.priority='PASS';
            report.detail.next_action='PASS';
            report.detail.risk_boundary='PASS';
            await page.screenshot({path:`${evidence}/02-server-detail-desktop.png`,fullPage:true,animations:'disabled'});

            await page.setViewportSize({width:390,height:844});
            await cold('servers');
            const card=page.locator('.server-card').filter({hasText:'v260-edge-01'}).first();
            await card.waitFor({state:'visible',timeout:10000});
            assert((await card.getAttribute('data-v2812-server-risk'))==='attention','mobile server risk missing');
            const overflow=await page.evaluate(()=>Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-window.innerWidth);
            assert(overflow<=1,`mobile horizontal overflow ${overflow}`);
            const action=card.locator('[data-v270-action="server"]');
            assert((await action.getAttribute('aria-label'))==='管理 v260-edge-01','mobile server aria missing');
            const box=await action.boundingBox();
            assert(box&&box.height>=40,`mobile action target ${JSON.stringify(box)}`);
            report.mobile.risk='PASS';
            report.mobile.no_overflow='PASS';
            report.mobile.action_target='PASS';
            await page.screenshot({path:`${evidence}/03-servers-mobile-390.png`,fullPage:true,animations:'disabled'});

            assert(report.page_errors.length===0,`page errors ${JSON.stringify(report.page_errors)}`);
            assert(report.console_errors.length===0,`console errors ${JSON.stringify(report.console_errors)}`);
            report.status='PASS';
          } finally {
            fs.writeFileSync(`${evidence}/P04_SERVER_DAILY_UX_REPORT.json`,JSON.stringify(report,null,2)+'\n');
            await browser.close();
          }
          if(report.status!=='PASS') process.exit(1);
          console.log('P04_SERVER_DAILY_UX_BROWSER=PASS');
          JS
          EVIDENCE="$EVIDENCE" CANDIDATE="$CANDIDATE" WEB_ROOT="$WEB" node "$RUNNER_TEMP/p04-server-daily-ux.mjs"
          grep -Fq '"status": "PASS"' "$EVIDENCE/P04_SERVER_DAILY_UX_REPORT.json"
          if grep -Ev 'JIT is incompatible with third party extensions that override zend_execute_ex\(\)\. JIT disabled\.' "$EVIDENCE/php-server.log" | grep -Eqi 'PHP (Fatal error|Parse error|Warning):|Uncaught (Error|Exception)'; then
            cat "$EVIDENCE/php-server.log"
            exit 1
          fi
          echo P04_SERVER_DAILY_UX_BROWSER_GATE=PASS

      - name: Seal public-safe synthetic evidence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['EVIDENCE'])
          report=root/'P04_SERVER_DAILY_UX_REPORT.json'
          payload={'schema':'p04-server-daily-ux-public-evidence/v1','source_sha':os.environ['CANDIDATE'],'private_source_persisted':False,'synthetic_test_data_only':True,'production_server_actions_executed':False}
          if report.exists():
              detail=json.loads(report.read_text(encoding='utf-8'))
              payload.update({'status':detail.get('status'),'list':detail.get('list'),'detail':detail.get('detail'),'mobile':detail.get('mobile'),'page_error_count':len(detail.get('page_errors',[])),'console_error_count':len(detail.get('console_errors',[]))})
          else:
              payload['status']='BLOCKED_BEFORE_BROWSER_REPORT'
          raw=json.dumps(payload,ensure_ascii=False,sort_keys=True).encode()
          payload['sha256']=hashlib.sha256(raw).hexdigest()
          (root/'PUBLIC_EVIDENCE.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY

      - name: Upload public-safe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: P04-SERVER-DAILY-UX-${{ env.CANDIDATE }}
          path: |
            evidence/PUBLIC_EVIDENCE.json
            evidence/P04_SERVER_DAILY_UX_REPORT.json
            evidence/01-servers-desktop.png
            evidence/02-server-detail-desktop.png
            evidence/03-servers-mobile-390.png
          if-no-files-found: warn
          retention-days: 14
