name: P01 D81 authentic legacy Owner upgrade read-only status (temporary)
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  d81-old-owner-major-status:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    steps:
      - name: Checkout exact private P01 source only in transient workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 5afa610b98850bb23bf4727e130bc05c811f2573
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - name: Verify exact product source/old Owner scope and native prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "test/p01-d71-real-native-major-migration-20261113"
          test "$(git -C candidate rev-parse HEAD)" = "5afa610b98850bb23bf4727e130bc05c811f2573"
          test "$(cat candidate/VERSION)" = "2.47.516"
          python3 -m py_compile candidate/tests/compatibility/laravel/http/p01_d81_authentic_old_owner_major_status.py
          sudo apt-get update -qq > "$RUNNER_TEMP/d81-apt.txt" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php8.3-cli php8.3-sqlite3 php8.3-curl php8.3-mbstring php8.3-zip >> "$RUNNER_TEMP/d81-apt.txt" 2>&1
          php8.3 -m | grep -Fxi pdo_sqlite
          php8.3 -l candidate/src/app/LegacyMajorMigrationReadiness.php
          php8.3 -l candidate/src/app/UpdateManager.php
          php8.3 -l candidate/src/app/CoreUpdates/UpdateCore.php
          php8.3 -l candidate/tests/unit/p01_d81_legacy_major_owner_gate_contract.php
          echo "P01_D81_EXACT_PRODUCT_SOURCE=5afa610b98850bb23bf4727e130bc05c811f2573"
      - name: Execute positive and negative purely read-only canonical source contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          php8.3 candidate/tests/unit/p01_d81_legacy_major_owner_gate_contract.php
          echo "P01_D81_LEGACY_OWNER_PREFLIGHT_ISOLATED_UNIT=PASS"
      - name: Fetch immutable official v2.47.515 FULL
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -m 700 -p "$RUNNER_TEMP/d81-official"
          gh release download v2.47.515 --repo llhzx2018/vf-start --pattern VF-Start-V2.47.515-FULL.zip --dir "$RUNNER_TEMP/d81-official" > "$RUNNER_TEMP/d81-fetch.txt" 2>&1
          file="$RUNNER_TEMP/d81-official/VF-Start-V2.47.515-FULL.zip"
          test "$(stat -c %s "$file")" = 1802482
          echo "5ee0c031dda82c53353929dc4519b0cc1b647b2af82a1bcd8a27a03ab7866778  $file" | sha256sum -c --status
          echo "P01_D81_OFFICIAL_OLD_V515_ASSET_PINNED=PASS"
      - name: Install genuine official old PHP site and prove Owner Guest login preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! python3 candidate/tests/compatibility/laravel/http/p01_d81_authentic_old_owner_major_status.py \
            --release-full "$RUNNER_TEMP/d81-official/VF-Start-V2.47.515-FULL.zip" \
            --candidate-root candidate > "$RUNNER_TEMP/d81-real-http.txt" 2>&1; then
            grep -E '^P01_D(65|81)_' "$RUNNER_TEMP/d81-real-http.txt" | tail -n 18 || true
            exit 1
          fi
          for key in \
             P01_D81_OFFICIAL_V515_OWNER_HTTP_MAJOR_PREFLIGHT \
             P01_D81_OFFICIAL_V515_GUEST_DENIED_AND_CSRF \
             P01_D81_OLD_OWNER_DB_CONFIG_NO_WRITE_AND_NO_ROOT_CHANGE; do
             grep -Fx "$key=PASS" "$RUNNER_TEMP/d81-real-http.txt"
          done
          grep -Fx 'P01_D81_EXECUTABLE_MAJOR_RELEASE=NO' "$RUNNER_TEMP/d81-real-http.txt"
          echo "P01_D81_GENUINE_OLD_INSTALLED_OWNER_AUTHORITY=PASS"
      - name: Always remove private source and synthetic installed site copies
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate "$RUNNER_TEMP/d81-official"
          rm -f -- "$RUNNER_TEMP"/d81-*.txt
          echo "P01_D81_PUBLIC_PRIVATE_SOURCE_PERSISTED=NO"
          echo "P01_D81_PUBLIC_ARTIFACTS=NONE"
