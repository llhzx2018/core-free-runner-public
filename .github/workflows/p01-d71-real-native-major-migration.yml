name: P01 D80 authentic legacy major migration developer envelope (one-off)
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  d80-synthetic-negative-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact temporary private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 15341a88071a94c224f9c212a484bd96e4bcde8d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - name: Confirm source identity and run bounded major-envelope negative matrix
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "test/p01-d71-real-native-major-migration-20261113"
          test "$(git -C candidate rev-parse HEAD)" = "15341a88071a94c224f9c212a484bd96e4bcde8d"
          test "$(cat candidate/VERSION)" = "2.47.516"
          python3 -m py_compile candidate/scripts/build_p01_next_major_migration_candidate.py
          python3 -m py_compile candidate/tests/architecture/test_p01_next_major_migration_candidate.py
          python3 candidate/tests/architecture/test_p01_next_major_migration_candidate.py > "$RUNNER_TEMP/d80-synthetic.txt" 2>&1 || {
            grep -E '^(FAIL|ERROR|test_|Ran |FAILED|OK)' "$RUNNER_TEMP/d80-synthetic.txt" | tail -n 18 || true
            exit 1
          }
          grep -Fx 'OK' "$RUNNER_TEMP/d80-synthetic.txt"
          echo "P01_D80_OFFLINE_NEGATIVE_MATRIX_AND_NO_OWNER_DATA=PASS"
          echo "P01_D80_EXACT_CANDIDATE_SOURCE=15341a88071a94c224f9c212a484bd96e4bcde8d"
      - name: Always clear private code and local synthetic testing
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate
          rm -f -- "$RUNNER_TEMP/d80-synthetic.txt"
          echo "P01_D80_SYNTHETIC_SOURCE_PERSISTED=NO"

  d80-official-full-major-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact private candidate only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 15341a88071a94c224f9c212a484bd96e4bcde8d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - name: Verify exact source and required developer tools
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "test/p01-d71-real-native-major-migration-20261113"
          test "$(git -C candidate rev-parse HEAD)" = "15341a88071a94c224f9c212a484bd96e4bcde8d"
          test "$(cat candidate/VERSION)" = "2.47.516"
          test "$(cat candidate/src/VERSION.txt)" = "2.47.516"
          python3 -m py_compile candidate/scripts/build_p01_next_major_migration_candidate.py
          sudo apt-get update -qq > "$RUNNER_TEMP/d80-apt.txt" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php8.3-cli php8.3-zip composer >> "$RUNNER_TEMP/d80-apt.txt" 2>&1
          command -v composer
          echo "P01_D80_NATIVE_PACKAGE_BUILD_TOOLS=PASS"
      - name: Fetch immutable authentic released PHP v515 FULL for input proof
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -m 700 -p "$RUNNER_TEMP/d80-official"
          gh release download v2.47.515 --repo llhzx2018/vf-start --pattern VF-Start-V2.47.515-FULL.zip --dir "$RUNNER_TEMP/d80-official" > "$RUNNER_TEMP/d80-download.txt" 2>&1
          old="$RUNNER_TEMP/d80-official/VF-Start-V2.47.515-FULL.zip"
          test "$(stat -c %s "$old")" = 1802482
          echo "5ee0c031dda82c53353929dc4519b0cc1b647b2af82a1bcd8a27a03ab7866778  $old" | sha256sum -c --status
          echo "P01_D80_OFFICIAL_GITHUB_V515_ASSET_VERIFIED=PASS"
      - name: Build one native exact-source Laravel v516 CloudPanel FULL
        shell: bash
        run: |
          set -Eeuo pipefail
          (cd candidate && python3 scripts/build_p01_next_clean_full.py build --source-sha 15341a88071a94c224f9c212a484bd96e4bcde8d --output "$RUNNER_TEMP/d80-clean-full.zip" --composer composer) > "$RUNNER_TEMP/d80-clean-build.txt" 2>&1
          (cd candidate && python3 scripts/build_p01_next_cloudpanel_full.py build --source-zip "$RUNNER_TEMP/d80-clean-full.zip" --output "$RUNNER_TEMP/d80-cloudpanel-full.zip") > "$RUNNER_TEMP/d80-cloudpanel-build.txt" 2>&1
          (cd candidate && python3 scripts/build_p01_next_cloudpanel_full.py verify --zip "$RUNNER_TEMP/d80-cloudpanel-full.zip") > "$RUNNER_TEMP/d80-cloudpanel-verify.txt" 2>&1
          test -s "$RUNNER_TEMP/d80-cloudpanel-full.zip"
          echo "P01_D80_LARAVEL_COMPLETE_VENDOR_AND_VITE_CLOUDPANEL_FULL=PASS"
      - name: Build and independently reverify official-old-bound MAJOR_DEV_ONLY envelope
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -m 700 -p "$RUNNER_TEMP/d80-envelope"
          new="$RUNNER_TEMP/d80-envelope/VF_Start_V2.47.515_to_V2.47.516_MAJOR_DEV_ONLY.zip"
          python3 candidate/scripts/build_p01_next_major_migration_candidate.py build --official-v515-full "$RUNNER_TEMP/d80-official/VF-Start-V2.47.515-FULL.zip" --laravel-v516-full "$RUNNER_TEMP/d80-cloudpanel-full.zip" --output "$new" > "$RUNNER_TEMP/d80-major-build.json"
          python3 candidate/scripts/build_p01_next_major_migration_candidate.py verify --zip "$new" > "$RUNNER_TEMP/d80-major-verify.json"
          cmp -s "$RUNNER_TEMP/d80-major-build.json" "$RUNNER_TEMP/d80-major-verify.json"
          python3 - "$RUNNER_TEMP/d80-major-verify.json" "15341a88071a94c224f9c212a484bd96e4bcde8d" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['status']=='MAJOR_MIGRATION_DEVELOPER_CANDIDATE_ONLY'
          assert d['from_version']=='2.47.515' and d['to_version']=='2.47.516'
          assert d['target_source_sha']==sys.argv[2]
          assert d['legacy_official_sha256']=='5ee0c031dda82c53353929dc4519b0cc1b647b2af82a1bcd8a27a03ab7866778'
          assert d['files']>=5900 and d['safe_failure_root']=='maintenance'
          assert d['signed_official_release'] is False
          assert d['production_apply_authorized'] is False
          assert d['data_migration_executable'] is False
          PY
          echo "P01_D80_AUTHENTIC_V515_AND_V516_MAJOR_BUNDLE_REBUILT_AND_REVERIFIED=PASS"
          echo "P01_D80_MAJOR_PACKAGE_EXPLICITLY_NONEXECUTABLE=PASS"
      - name: Real rebuilt major candidate refuses corrupted official FULL and tampered envelope
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -m 700 -p "$RUNNER_TEMP/d80-tampered"
          old="$RUNNER_TEMP/d80-tampered/untrusted-v515.zip"
          cp "$RUNNER_TEMP/d80-official/VF-Start-V2.47.515-FULL.zip" "$old"
          python3 - "$old" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]);d=bytearray(p.read_bytes());d[40]^=1;p.write_bytes(d)
          PY
          if python3 candidate/scripts/build_p01_next_major_migration_candidate.py build --official-v515-full "$old" --laravel-v516-full "$RUNNER_TEMP/d80-cloudpanel-full.zip" --output "$RUNNER_TEMP/d80-tampered/VF_Start_V2.47.515_to_V2.47.516_MAJOR_DEV_ONLY.zip" > /dev/null 2> "$RUNNER_TEMP/d80-corrupt-reject.txt"; then
            echo "P01_D80_MUTATED_OFFICIAL_OLD_SOURCE_ACCEPTED=FAIL"; exit 1
          fi
          grep -Fq 'P01_D80_UNVERIFIED_MAJOR_MIGRATION_ENVELOPE=BLOCKED' "$RUNNER_TEMP/d80-corrupt-reject.txt"
          echo "P01_D80_MUTATED_OFFICIAL_OLD_ASSET_REJECTED=PASS"
          python3 - "$RUNNER_TEMP/d80-envelope/VF_Start_V2.47.515_to_V2.47.516_MAJOR_DEV_ONLY.zip" "$RUNNER_TEMP/d80-tampered" <<'PY'
          import sys,json,zipfile
          from pathlib import Path
          src=Path(sys.argv[1]);out=Path(sys.argv[2])/src.name
          with zipfile.ZipFile(src) as base, zipfile.ZipFile(out,'x',compression=zipfile.ZIP_STORED) as dst:
              for item in base.infolist():
                  data=base.read(item)
                  if item.filename=='MAJOR-MIGRATION-MANIFEST.json':
                      doc=json.loads(data);doc['production_apply_authorized']=True
                      data=json.dumps(doc).encode()
                  dst.writestr(item,data)
          PY
          if python3 candidate/scripts/build_p01_next_major_migration_candidate.py verify --zip "$RUNNER_TEMP/d80-tampered/VF_Start_V2.47.515_to_V2.47.516_MAJOR_DEV_ONLY.zip" > /dev/null 2> "$RUNNER_TEMP/d80-fake-sign-reject.txt"; then
            echo "P01_D80_FORGED_RELEASE_READY_ACCEPTED=FAIL"; exit 1
          fi
          grep -Fq 'P01_D80_UNVERIFIED_MAJOR_MIGRATION_ENVELOPE=BLOCKED' "$RUNNER_TEMP/d80-fake-sign-reject.txt"
          echo "P01_D80_FORGED_OFFICIAL_MIGRATION_READY_REJECTED=PASS"
      - name: Always cleanup actual old and new program packages
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate "$RUNNER_TEMP/d80-official" "$RUNNER_TEMP/d80-envelope" "$RUNNER_TEMP/d80-tampered"
          rm -f -- "$RUNNER_TEMP"/d80-*.txt "$RUNNER_TEMP"/d80-*.zip "$RUNNER_TEMP"/d80-*.json
          echo "P01_D80_PRIVATE_SOURCE_AND_RELEASE_FIXTURE_PERSISTED=NO"
          echo "P01_D80_PUBLIC_RUNNER_ARTIFACTS=NONE"
