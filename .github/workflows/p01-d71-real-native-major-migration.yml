name: P01 D79 real same-runtime Atomic vs old major guard (temporary)
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  d79-cross-architecture-update-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact private candidate only with registered transient read capability
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 2e95f6b09f1deac75907def6b09d6d5a8a99c7de
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - name: Verify true 40-character candidate commit and immutable version identities
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "test/p01-d71-real-native-major-migration-20261113"
          test "$(git -C candidate rev-parse HEAD)" = "2e95f6b09f1deac75907def6b09d6d5a8a99c7de"
          test "$(cat candidate/VERSION)" = "2.47.516"
          test "$(cat candidate/src/VERSION.txt)" = "2.47.516"
          python3 -m py_compile candidate/scripts/build_p01_next_official_update_candidate.py candidate/tests/architecture/test_p01_next_official_update_candidate.py
          echo "P01_D79_EXACT_PRODUCT_SHA=2e95f6b09f1deac75907def6b09d6d5a8a99c7de"
      - name: Native PHP signed-channel tooling and Python archive safety prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq > "$RUNNER_TEMP/p01-d79-apt.txt" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php8.3-cli php8.3-zip php8.3-mbstring php8.3-sqlite3 >> "$RUNNER_TEMP/p01-d79-apt.txt" 2>&1
          php8.3 -m | grep -Fxi sodium
          php8.3 -m | grep -Fxi zip
          php8.3 -l candidate/src/app/next/runtime/OfficialChannelReadiness.php
          php8.3 -l candidate/tests/unit/p01_d36_owner_channel_contract.php
          php8.3 -l candidate/tests/unit/p01_d43_official_signed_release_gate_contract.php
          php8.3 -l candidate/tests/compatibility/laravel/http/p01_d43_signed_real_bundle_proof.php
          echo "P01_D79_NATIVE_SIGNED_GUARD_TOOLS=PASS"
      - name: Generate genuine format synthetic program and refuse old PHP source
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 candidate/tests/architecture/test_p01_next_official_update_candidate.py > "$RUNNER_TEMP/p01-d79-python.txt" 2>&1 || {
            grep -E '^(FAIL|ERROR|test_|Ran|FAILED|OK)' "$RUNNER_TEMP/p01-d79-python.txt" | tail -n 22 || true
            exit 1
          }
          grep -Fq 'OK' "$RUNNER_TEMP/p01-d79-python.txt"
          echo "P01_D79_LEGACY_V515_CODE_ONLY_BUILD_AND_TAMPER_REFUSED=PASS"
          echo "P01_D79_LARAVEL_V516_TO_V517_SYNTHETIC_CODE_ONLY_BUILD=PASS"
      - name: Live PHP legacy channel and synthetic Ed25519 signed outer contract for three engines
        shell: bash
        run: |
          set -Eeuo pipefail
          php8.3 candidate/tests/unit/p01_d36_owner_channel_contract.php
          php8.3 candidate/tests/unit/p01_d43_official_signed_release_gate_contract.php
          echo "P01_D79_SQLITE_MARIADB_MYSQL_MAJOR_VS_ATOMIC_GATE=PASS"
          echo "P01_D79_SYNTHETIC_ED25519_NO_REAL_RELEASE_SIGNER=YES"
      - name: Real Vite TypeScript Owner-only upgrade response behavior
        shell: bash
        run: |
          set -Eeuo pipefail
          node --version
          npm --version
          npm ci --prefix candidate/src/app/next/frontend --ignore-scripts --no-audit --no-fund > "$RUNNER_TEMP/p01-d79-npm.txt" 2>&1
          (cd candidate/src/app/next/frontend && npx --no-install vitest run tests/update.test.ts > "$RUNNER_TEMP/p01-d79-vitest.txt" 2>&1) || {
            grep -E '(FAIL|Error:|Test Files|Tests |failed)' "$RUNNER_TEMP/p01-d79-vitest.txt" | tail -n 15 || true
            exit 1
          }
          grep -Fq 'Test Files' "$RUNNER_TEMP/p01-d79-vitest.txt"
          echo "P01_D79_OWNER_UPDATE_CLIENT_CROSS_ARCH_STATUS_SAFE=PASS"
      - name: Always remove private candidate and transient test files
        shell: bash
        if: always()
        run: |
          rm -rf -- candidate
          rm -f -- "$RUNNER_TEMP"/p01-d79-*.txt
          echo "P01_D79_PRIVATE_SOURCE_OR_ARTIFACT_PERSISTED=NO"
          echo "P01_D79_PUBLIC_ARTIFACT_UPLOAD=NONE"
