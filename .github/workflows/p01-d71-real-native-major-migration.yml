name: P01 D71 actual v515 to Laravel native major migration durable rollback
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  official-to-next-native-https:
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    steps:
      - name: Checkout exact private source only into transient workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: b502e3d448f74acf0b0d46e0a7c84cf434a46c6c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - name: Exact candidate source and synthetic runtime scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "test/p01-d71-real-native-major-migration-20261113"
          test "$(git -C candidate rev-parse HEAD)" = "b502e3d448f74acf0b0d46e0a7c84cf434a46c6c"
          test "$(cat candidate/VERSION)" = "2.47.516"
          test -f candidate/tests/compatibility/laravel/run_d67_seal_official_old_clone.php
          python3 -m py_compile candidate/tests/compatibility/laravel/run_d65_official_v515_full_restore.py             candidate/tests/compatibility/laravel/http/run_d67_official_to_laravel_https.py
          echo "P01_D71_EXACT_PRODUCT_SOURCE=b502e3d448f74acf0b0d46e0a7c84cf434a46c6c"
          echo "P01_D71_OFFICIAL_OLD_INPUT_REAL_USER_DATA=NONE"
      - name: Isolated native Nginx TLS PHP FPM and framework build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq > "$RUNNER_TEMP/d71-apt.txt" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq             nginx php8.3-fpm php8.3-cli php8.3-sqlite3 php8.3-mysql             php8.3-mbstring php8.3-curl php8.3-xml php8.3-zip             composer openssl unzip >> "$RUNNER_TEMP/d71-apt.txt" 2>&1
          php8.3 -l candidate/tests/compatibility/laravel/run_d66_official_release_to_future_clone.php
          php8.3 -l candidate/tests/compatibility/laravel/run_d67_seal_official_old_clone.php
          php8.3 -l candidate/tests/compatibility/laravel/http/p01_d71_real_v515_to_next_migration_transaction.php
          php8.3 -l candidate/src/app/next/runtime/MajorMigrationTransaction.php
          php8.3 -l candidate/src/app/next/runtime/CloudPanelManualHandoff.php
          php8.3 -l candidate/src/app/next/runtime/SyntheticCloudPanelTreeRelocation.php
          php8.3 -l candidate/src/app/next/runtime/SyntheticLegacyFullSiteArchive.php
          php8.3 -l candidate/tests/compatibility/laravel/run_d70_major_migration_transaction.php
          command -v nginx
          command -v php-fpm8.3
          command -v composer
          echo "P01_D71_REAL_NATIVE_FPM_READY=PASS"
      - name: Download OFFICIAL v2.47.515 FULL and validate authentic asset SHA
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -m 700 -p "$RUNNER_TEMP/d71-official"
          gh release download v2.47.515 --repo llhzx2018/vf-start             --pattern VF-Start-V2.47.515-FULL.zip             --dir "$RUNNER_TEMP/d71-official"             > "$RUNNER_TEMP/d71-download.txt" 2>&1
          file="$RUNNER_TEMP/d71-official/VF-Start-V2.47.515-FULL.zip"
          test "$(stat -c '%s' "$file")" = "1802482"
          echo "5ee0c031dda82c53353929dc4519b0cc1b647b2af82a1bcd8a27a03ab7866778  $file" | sha256sum -c --status
          echo "P01_D71_AUTHENTIC_OLD_GITHUB_RELEASE=PASS"
      - name: Rebuild real complete native Laravel 13 CloudPanel FULL from exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 scripts/build_p01_next_clean_full.py build             --source-sha b502e3d448f74acf0b0d46e0a7c84cf434a46c6c             --output "$RUNNER_TEMP/d71-clean-full.zip" --composer composer             > "$RUNNER_TEMP/d71-build.txt" 2>&1
          python3 scripts/build_p01_next_clean_full.py verify             --zip "$RUNNER_TEMP/d71-clean-full.zip"             > "$RUNNER_TEMP/d71-verify.txt" 2>&1
          python3 scripts/build_p01_next_cloudpanel_full.py build             --source-zip "$RUNNER_TEMP/d71-clean-full.zip"             --output "$RUNNER_TEMP/d71-cloudpanel-full.zip"             > "$RUNNER_TEMP/d71-layout.txt" 2>&1
          python3 scripts/build_p01_next_cloudpanel_full.py verify             --zip "$RUNNER_TEMP/d71-cloudpanel-full.zip"             > "$RUNNER_TEMP/d71-layout-verify.txt" 2>&1
          test -s "$RUNNER_TEMP/d71-cloudpanel-full.zip"
          echo "P01_D71_LARAVEL_13_FULL_REAL_PACKAGED=PASS"
      - name: Prepare locked Laravel library for D66 offline old-source converter
        shell: bash
        run: |
          set -Eeuo pipefail
          composer install --working-dir=candidate/src/app/next --no-dev             --prefer-dist --no-interaction --no-progress --no-scripts --no-plugins             > "$RUNNER_TEMP/d71-converter-composer.txt" 2>&1
          test -f candidate/src/app/next/vendor/autoload.php
          echo "P01_D71_D66_NATIVE_LARAVEL_OFFLINE_CONVERTER=READY"
      - name: Native durable mutation matrix bound to the latest exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! P01_D70_ISOLATED_MIGRATION=YES php8.3               candidate/tests/compatibility/laravel/run_d70_major_migration_transaction.php               matrix 94df026d9bab668b15c9f5f75cd0c0fe57abbb48 b502e3d448f74acf0b0d46e0a7c84cf434a46c6c               > "$RUNNER_TEMP/d71-fsm.txt" 2>&1; then
            grep -E '^P01_D70_|D70_PROOF_[A-Z0-9_]+'               "$RUNNER_TEMP/d71-fsm.txt" | cut -c1-170 | tail -n 32 || true
            exit 1
          fi
          grep -Fx 'P01_D70_MAJOR_MIGRATION_TRANSACTION_NATIVE_MATRIX=PASS' "$RUNNER_TEMP/d71-fsm.txt"
          grep -Fx 'P01_D70_ACTUAL_PROCESS_EXIT_88_AND_OLD_RECOVERY=PASS' "$RUNNER_TEMP/d71-fsm.txt"
          echo 'P01_D71_NATIVE_JOURNAL_CRASH_RECOVERY=PASS'
      - name: Real old installer then native Next sealed session and failure recovery
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! P01_D65_OFFICIAL_ASSET_ISOLATED=YES             python3 candidate/tests/compatibility/laravel/run_d65_official_v515_full_restore.py               --release-full "$RUNNER_TEMP/d71-official/VF-Start-V2.47.515-FULL.zip"               --candidate-root candidate               --future-bundle "$RUNNER_TEMP/d71-cloudpanel-full.zip" --archive-full-old-site --major-migration-transactions               > "$RUNNER_TEMP/d71-results.txt" 2>&1; then
            grep '^P01_D[0-9][0-9]_' "$RUNNER_TEMP/d71-results.txt" | tail -n 60 || true
            exit 1
          fi
          grep '^P01_D[0-9][0-9]_' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D65_REAL_OLD_RELEASE_HTTP_CSRF_INSTALL_SETUP_LOCK=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D65_REAL_V515_WHOLE_TREE_D73_RELOCATION_AND_RESTORE=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D66_ACTUAL_INSTALLED_OLD_DATABASE_TO_NEW35_TABLE_CLONE=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D67_REAL_LARAVEL_INSTALLATION_SEALED_AFTER_REAL_OLD_CLONE=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D67_OLD_OWNER_NO_RESET_NATIVE_CREDENTIAL_STORE=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D67_OFFICIAL_OLD_OWNER_LOGIN_AND_PRIVATE_HTTP_READ=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D67_REAL_LARAVEL_AUTH_CSRF_AND_OLD_RECORD_NEW_WRITE=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D67_CORRUPT_SEAL_FAIL_CLOSED_EXACT_RESTORE=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D67_ORIGINAL_OFFICIAL_OLD_INSTALL_UNCHANGED=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D68_SAME_HOST_ACTUAL_OLD515_HTTPS_FPM=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D68_SAME_HOST_CUTOVER_TO_SEALED_NEXT=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D78_AFTER_NEW_OWNER_WRITE_FAIL_CLOSED_503=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D78_NEW_OWNER_ONLY_DATA_STILL_PRESERVED=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D78_PRIVATE_HEAD_FAIL_CLOSED=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D78_UNPATCHED_LEGACY_PUBLIC_ROLLBACK=NO' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D78_NEW_OWNER_WRITE_RECONCILIATION=RECOVERY_REQUIRED' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D68_SITE_ROOT_SWAP_TEST_IS_OWNER_ATOMIC=NO' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D67_COMPLETE_OLD_TO_NEXT_ISOLATED_HTTP_PHASE=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D71_REAL_NGINX_FAILED_NEW_HEALTH_RETURNS_OLD515=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D71_NATIVE_TX_FAULT_BACK_TO_REAL_OLD_HTTPS=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D71_LEGACY_PUBLIC_ROLLBACK_PROOF_PRIVATE_READY=NO' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D78_REAL_HTTPS_MAINTENANCE_BEFORE_CUTOVER=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D78_NATIVE_PRIVATE_FAILURE_MAINTENANCE_503=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D78_REAL_NGINX_HTTPS_MAINTENANCE_NO_LEGACY_LEAK=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D78_NATIVE_PRIVATE_SUCCESS_FROM_MAINTENANCE=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D78_PRIVATE_SAFE_TWO_SWITCHES_NATIVE_TX=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D71_REAL_NGINX_SAME_VHOST_DURABLE_COMMIT=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D71_NATIVE_TX_COMMITTED_TO_REAL_NEXT_HTTPS=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D71_V515_REAL_OLD_GLOBAL_WRITE_BARRIER=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D71_FULL_OLD_TREE_SNAPSHOT_BEFORE_CUTOVER=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D71_REAL_RESTORED_OLD_OWNER_DB_MEDIA_FROM_D69=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D71_REAL_LARAVEL_OWNER_DATA_MEDIA_SEALED_CHECK=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D71_OWNER_CLICK_UI=NOT_PROVEN' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D71_OFFICIAL_SIGNED_V516_ASSET=NOT_PROVEN' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D71_PRIVILEGED_CLOUDPANEL_ROOT_ADAPTER=NOT_PROVEN' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D67_INSTALLED_REAL_ATOMIC_UPDATE_WITH_CODE_POINTER=NOT_PROVEN' "$RUNNER_TEMP/d71-results.txt"
          echo 'P01_D78_REAL_NGINX_PRIVATE_FAILCLOSED_TWO_ROOT_GATE=PASS'
          echo 'P01_D71_REAL_MAJOR_MIGRATION_SAME_HOST_PHASE=PASS'
      - name: Always cleanup source, official asset, code package and synthetic state
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate "$RUNNER_TEMP/d71-official"
          rm -f -- "$RUNNER_TEMP"/d71-*.txt "$RUNNER_TEMP"/d71-*.zip
          echo "P01_D71_PRIVATE_SOURCE_ASSET_AND_USER_DATA_PERSISTED=NO"
          echo "P01_D71_PUBLIC_ARTIFACTS=NONE"
