name: P01 D84 verified developer major archive to physical isolated code stage (one-off)
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  d84-physical-stage-and-authentic-official-v515:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Exact private checkout; no persisted credentials or artifact
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 92e0968f5241c9ef092815b36449de6b66b47c45
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - name: Verify exact source and restricted stage scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GITHUB_REPOSITORY}" = "llhzx2018/core-free-runner-public"
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "test/p01-d71-real-native-major-migration-20261113"
          test "$(git -C candidate rev-parse HEAD)" = "92e0968f5241c9ef092815b36449de6b66b47c45"
          test "$(cat candidate/VERSION)" = "2.47.516"
          python3 -m py_compile candidate/scripts/stage_p01_next_major_migration_candidate.py
          python3 -m py_compile candidate/tests/architecture/test_p01_next_major_migration_staging.py
          echo "P01_D84_EXACT_PRODUCT_SOURCE=92e0968f5241c9ef092815b36449de6b66b47c45"
          echo "P01_D84_ONE_OFF_MACHINE_GATE=ACTIVE"
      - name: Synthetic 5901-file physical staging, fault and replay negatives
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 candidate/tests/architecture/test_p01_next_major_migration_staging.py \
            > "$RUNNER_TEMP/d84-unit-log.txt" 2>&1 || {
              grep -E '^FAIL:|^ERROR:|^AssertionError|^RuntimeError|^FileNotFoundError|^TypeError|^NameError|^AttributeError|^KeyError|^BuildError' \
                "$RUNNER_TEMP/d84-unit-log.txt" | sed -E 's#/tmp/[^ :]+#REDACTED_TMP#g' | cut -c1-180 | head -n 12 || true
              echo "P01_D84_REAL_PHYSICAL_STAGE_SOURCE_TEST=FAIL"
              exit 1
            }
          grep -E '^Ran [0-9]+ tests? in ' "$RUNNER_TEMP/d84-unit-log.txt"
          grep -Fx 'OK' "$RUNNER_TEMP/d84-unit-log.txt"
          echo "P01_D84_SYNTHETIC_STAGE_TAMPER_DIRTY_CRASH=PASS"
      - name: Prepare native clean FULL packager dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq > "$RUNNER_TEMP/d84-apt.txt" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            php8.3-cli php8.3-mbstring php8.3-xml php8.3-zip \
            composer unzip >> "$RUNNER_TEMP/d84-apt.txt" 2>&1
          echo "P01_D84_NATIVE_ARCHIVE_RUNTIME=PASS"
      - name: Read actual official legacy FULL with exact immutable SHA
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -m 700 "$RUNNER_TEMP/d84-official"
          gh release download v2.47.515 \
            --repo llhzx2018/vf-start \
            --pattern VF-Start-V2.47.515-FULL.zip \
            --dir "$RUNNER_TEMP/d84-official" \
            > "$RUNNER_TEMP/d84-download.txt" 2>&1
          f="$RUNNER_TEMP/d84-official/VF-Start-V2.47.515-FULL.zip"
          test "$(stat -c '%s' "$f")" = 1802482
          echo "5ee0c031dda82c53353929dc4519b0cc1b647b2af82a1bcd8a27a03ab7866778  $f" |
            sha256sum -c --status
          echo "P01_D84_AUTHENTIC_V515_OFFICIAL_FULL=PASS"
      - name: Build and verify actual Laravel 13 CloudPanel FULL and major envelope
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 scripts/build_p01_next_clean_full.py build \
            --source-sha 92e0968f5241c9ef092815b36449de6b66b47c45 \
            --output "$RUNNER_TEMP/d84-clean-full.zip" --composer composer \
            > "$RUNNER_TEMP/d84-build.txt" 2>&1
          python3 scripts/build_p01_next_clean_full.py verify \
            --zip "$RUNNER_TEMP/d84-clean-full.zip" \
            > "$RUNNER_TEMP/d84-verify.txt" 2>&1
          python3 scripts/build_p01_next_cloudpanel_full.py build \
            --source-zip "$RUNNER_TEMP/d84-clean-full.zip" \
            --output "$RUNNER_TEMP/d84-cloudpanel-full.zip" \
            > "$RUNNER_TEMP/d84-layout.txt" 2>&1
          python3 scripts/build_p01_next_cloudpanel_full.py verify \
            --zip "$RUNNER_TEMP/d84-cloudpanel-full.zip" \
            > "$RUNNER_TEMP/d84-layout-verify.txt" 2>&1
          python3 scripts/build_p01_next_major_migration_candidate.py build \
            --official-v515-full "$RUNNER_TEMP/d84-official/VF-Start-V2.47.515-FULL.zip" \
            --laravel-v516-full "$RUNNER_TEMP/d84-cloudpanel-full.zip" \
            --output "$RUNNER_TEMP/VF_Start_V2.47.515_to_V2.47.516_MAJOR_DEV_ONLY.zip" \
            > "$RUNNER_TEMP/d84-major.txt" 2>&1
          echo "P01_D84_FULL_VENDOR_VITE_MAJOR_PROVENANCE=PASS"
      - name: Physically extract exact Laravel FULL to an isolated private code root and verify bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          dest="$(python3 -c 'import secrets; print("/tmp/p01-d84-stage-"+secrets.token_hex(12))')"
          echo "$dest" > "$RUNNER_TEMP/d84-destination.txt"
          envelope="$RUNNER_TEMP/VF_Start_V2.47.515_to_V2.47.516_MAJOR_DEV_ONLY.zip"
          python3 candidate/scripts/stage_p01_next_major_migration_candidate.py stage \
            --envelope "$envelope" --destination "$dest" \
            > "$RUNNER_TEMP/d84-stage.txt" 2>&1
          python3 candidate/scripts/stage_p01_next_major_migration_candidate.py verify \
            --envelope "$envelope" --destination "$dest" \
            > "$RUNNER_TEMP/d84-readback.txt" 2>&1
          grep -Fq '"status": "DISPOSABLE_CODE_STAGED_VERIFIED"' "$RUNNER_TEMP/d84-stage.txt"
          grep -Fq '"official_major_migration_ready": false' "$RUNNER_TEMP/d84-readback.txt"
          test -f "$dest/app/vendor/autoload.php"
          test -f "$dest/app/public/index.php"
          test ! -e "$dest/private"
          echo "P01_D84_REAL_5900_PLUS_DEPENDENCIES_PHYSICAL_STAGE=PASS"
          echo "P01_D84_OLD_OWNER_DATA_OR_PRODUCTION_TOUCHED=NO"
          echo "P01_D84_OFFICIAL_MAJOR_UPGRADE_READY=NO"
      - name: Always clear private source, real old FULL, installed staging and synthetic fixtures
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if test -f "$RUNNER_TEMP/d84-destination.txt"; then
            dest="$(cat "$RUNNER_TEMP/d84-destination.txt")"
            if [[ "$dest" =~ ^/tmp/p01-d84-stage-[a-f0-9]{24}$ ]]; then
              rm -rf -- "$dest"
            fi
          fi
          rm -rf -- candidate "$RUNNER_TEMP/d84-official"
          rm -f -- "$RUNNER_TEMP"/d84-*.txt "$RUNNER_TEMP"/d84-*.zip \
            "$RUNNER_TEMP/VF_Start_V2.47.515_to_V2.47.516_MAJOR_DEV_ONLY.zip"
          echo "P01_D84_PRIVATE_SOURCE_AND_SYNTHETIC_STAGE_PERSISTED=NO"
          echo "P01_D84_PUBLIC_ARTIFACT=NONE"
