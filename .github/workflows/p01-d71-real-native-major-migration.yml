name: P01 D82 authentic legacy Owner-to-worker safe handoff (one-off)
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  d82-authenticated-old-owner-handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact private P01 source with registered runtime secret only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 2d2a2cd718e545d21bc2209375af7f6003dac92c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - name: Verify immutable private product SHA, PHP files and native runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "test/p01-d71-real-native-major-migration-20261113"
          test "$(git -C candidate rev-parse HEAD)" = "2d2a2cd718e545d21bc2209375af7f6003dac92c"
          test "$(cat candidate/VERSION)" = "2.47.516"
          test "$(cat candidate/src/VERSION.txt)" = "2.47.516"
          python3 -m py_compile candidate/tests/compatibility/laravel/http/p01_d81_authentic_old_owner_major_status.py
          python3 -m py_compile candidate/tests/compatibility/laravel/http/p01_d82_legacy_owner_major_intent_http.py
          sudo apt-get update -qq > "$RUNNER_TEMP/d82-apt.txt" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            php8.3-cli php8.3-sqlite3 php8.3-curl php8.3-mbstring php8.3-zip \
            >> "$RUNNER_TEMP/d82-apt.txt" 2>&1
          php8.3 -m | grep -Fxi pdo_sqlite
          php8.3 -l candidate/src/app/LegacyMajorOwnerHandoff.php
          php8.3 -l candidate/src/app/LegacyMajorMigrationReadiness.php
          php8.3 -l candidate/src/app/UpdateManager.php
          php8.3 -l candidate/src/app/CoreUpdates/UpdateCore.php
          php8.3 -l candidate/src/api.php
          echo "P01_D82_EXACT_PRODUCT_SHA=2d2a2cd718e545d21bc2209375af7f6003dac92c"
      - name: Fetch immutable official v515 installed old-site input
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -m 700 -p "$RUNNER_TEMP/d82-official"
          gh release download v2.47.515 \
            --repo llhzx2018/vf-start \
            --pattern VF-Start-V2.47.515-FULL.zip \
            --dir "$RUNNER_TEMP/d82-official" \
            > "$RUNNER_TEMP/d82-gh-download.txt" 2>&1
          file="$RUNNER_TEMP/d82-official/VF-Start-V2.47.515-FULL.zip"
          test "$(stat -c '%s' "$file")" = 1802482
          echo "5ee0c031dda82c53353929dc4519b0cc1b647b2af82a1bcd8a27a03ab7866778  $file" | sha256sum -c --status
          echo "P01_D82_AUTHENTIC_RELEASE_V515_BYTES=PASS"
      - name: Regress old Owner read-only migration status under new HMAC dependency
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! python3 candidate/tests/compatibility/laravel/http/p01_d81_authentic_old_owner_major_status.py \
             --release-full "$RUNNER_TEMP/d82-official/VF-Start-V2.47.515-FULL.zip" \
             --candidate-root candidate > "$RUNNER_TEMP/d82-d81-regression.txt" 2>&1; then
             grep -E '^P01_D(65|81)_' "$RUNNER_TEMP/d82-d81-regression.txt" | tail -n 12 || true
             exit 1
          fi
          grep -Fx 'P01_D81_OFFICIAL_V515_OWNER_HTTP_MAJOR_PREFLIGHT=PASS' "$RUNNER_TEMP/d82-d81-regression.txt"
          grep -Fx 'P01_D81_OFFICIAL_V515_GUEST_DENIED_AND_CSRF=PASS' "$RUNNER_TEMP/d82-d81-regression.txt"
          echo "P01_D82_PREVIOUS_OLD_OWNER_READONLY_STATUS_REGRESSION=PASS"
      - name: Real old Owner login, CSRF recent step-up, one-time intent, HMAC CLI and rollback negatives
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! python3 candidate/tests/compatibility/laravel/http/p01_d82_legacy_owner_major_intent_http.py \
             --official-full "$RUNNER_TEMP/d82-official/VF-Start-V2.47.515-FULL.zip" \
             --candidate-root candidate > "$RUNNER_TEMP/d82-auth-http.txt" 2>&1; then
             grep -E '^P01_D(65|82)_' "$RUNNER_TEMP/d82-auth-http.txt" | tail -n 20 || true
             exit 1
          fi
          for key in \
            P01_D82_ACTUAL_LEGACY_OWNER_ONE_CLICK_INTENT_AND_REPLAY \
            P01_D82_OWNER_GUEST_CSRF_AND_EXPLICIT_APPROVAL_NEGATIVES \
            P01_D82_SERVER_MAC_BOUND_NONEXECUTABLE_WORKER_READBACK \
            P01_D82_TAMPERED_OWNER_INTENT_MAC_REJECTED \
            P01_D82_OLD_OWNER_BUSINESS_CONFIG_AND_ROOT_UNCHANGED; do
            grep -Fx "$key=PASS" "$RUNNER_TEMP/d82-auth-http.txt"
          done
          grep -Fx 'P01_D82_OFFICIAL_SIGNED_RELEASE_AND_CLOUDPANEL_EXECUTION=NO' "$RUNNER_TEMP/d82-auth-http.txt"
          echo "P01_D82_OWNER_TO_SEALED_WORKER_INTENT_BRIDGE=PASS"
      - name: Always clear official release copy, synthetic Owner and private checkout
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate "$RUNNER_TEMP/d82-official"
          rm -f -- "$RUNNER_TEMP"/d82-*.txt
          echo "P01_D82_PRIVATE_SOURCE_OR_OWNER_FIXTURE_PERSISTED=NO"
          echo "P01_D82_PUBLIC_ARTIFACT_UPLOADS=NONE"
