name: P07 OneShot Bench v0.6 Gate

on:
  push:
    branches:
      - experiment/p07-oneshot-bench-v05
    paths:
      - .github/workflows/p07-v06-gate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load exact candidate
        shell: bash
        run: |
          set -euo pipefail
          git show 4629a1fbf1bbf6a6ba9761efa820f10dbe9e0374:experiments/p07-bench.sh > /tmp/p07-bench-v06.sh
          chmod +x /tmp/p07-bench-v06.sh
          grep -F 'VERSION="0.6.0"' /tmp/p07-bench-v06.sh
      - name: Syntax and lifecycle self-test
        shell: bash
        run: |
          set -euo pipefail
          bash -n /tmp/p07-bench-v06.sh
          /tmp/p07-bench-v06.sh --version | grep -F '0.6.0'
          /tmp/p07-bench-v06.sh --self-test | grep -F 'SELF_TEST=PASS'
      - name: One-shot demo contract
        shell: bash
        run: |
          set -euo pipefail
          /tmp/p07-bench-v06.sh --demo >/tmp/demo
          grep -F 'P07 Enhanced Bench' /tmp/demo
          grep -F 'Speedtest.net' /tmp/demo
          grep -F 'Evidence Quality' /tmp/demo
          ! grep -q '请选择\|Select option' /tmp/demo
      - name: Retry regression contract
        shell: bash
        run: |
          set -euo pipefail
          ! grep -F 'output="$(speed_node ' /tmp/p07-bench-v06.sh
          grep -F 'speed_node "$id" "$name" >"$out"' /tmp/p07-bench-v06.sh
          grep -F "state=\"\$(awk -F '\\t' 'END{print \$3}' \"\$tmp\")\"" /tmp/p07-bench-v06.sh
          grep -F 'Retry lifecycle regression' /tmp/p07-bench-v06.sh
      - name: Safety boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E 'curl .*--insecure|curl .* -k|wget .*--no-check-certificate' /tmp/p07-bench-v06.sh
          ! grep -E 'sysctl -w|systemctl restart|reboot|shutdown' /tmp/p07-bench-v06.sh
          grep -F 'sha256sum' /tmp/p07-bench-v06.sh
