name: P01 V2.46.3 Verified Bootstrap Blob

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p01-v2463-bootstrap-blob-20260905.yml

permissions:
  contents: read

jobs:
  blob:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      BASE_SHA: de967f5257c8dbf05018a0eac280a9f3f7d48b0a
      EXPECTED_BLOB: 92d36f1a47dbf2a8b37b6c1300c52336d36ff7fd
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.BASE_SHA }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Build exact one-line bootstrap blob
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "$(git hash-object src/app/bootstrap.php)" = '00bad940bf43ef5fdb9e468dac6fb2205aa366e0'
          grep -Fxq "define('VF_VERSION', '2.46.2');" src/app/bootstrap.php
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/bootstrap.php')
          s=p.read_text(encoding='utf-8')
          old="define('VF_VERSION', '2.46.2');"
          new="define('VF_VERSION', '2.46.3');"
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1),encoding='utf-8',newline='')
          PY
          test "$(git diff --name-only | tr -d '\n')" = 'src/app/bootstrap.php'
          test "$(git hash-object src/app/bootstrap.php)" = "$EXPECTED_BLOB"
          php -l src/app/bootstrap.php >/dev/null
          echo P01_V2463_BOOTSTRAP_LOCAL_BLOB=PASS

      - name: Store verified blob without moving any ref
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -n --rawfile content src/app/bootstrap.php '{content:$content,encoding:"utf-8"}' >/tmp/blob.json
          sha=$(gh api --method POST repos/llhzx2018/vf-start/git/blobs --input /tmp/blob.json --jq .sha)
          test "$sha" = "$EXPECTED_BLOB"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          echo "P01_V2463_BOOTSTRAP_REMOTE_BLOB=$sha"
          echo P01_V2463_BOOTSTRAP_BLOB=PASS
