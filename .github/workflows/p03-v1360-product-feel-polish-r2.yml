name: P03 V1.36.0 Integrated Product Feel Micro Polish R2
on:
  push:
    branches: [p03-v1360-runtime-integration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      EXPECTED_HEAD: b8bf788bc1e0b5771d7b03cda0c49c7d7c10b0d6
    steps:
      - name: Apply exact Chinese-first and mobile polish
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WRITE_TOKEN:-}"
          git clone --quiet --branch integration/v1.36.0-product-experience --single-branch "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/vf-forge.git" p03
          cd p03
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          from pathlib import Path

          def must_replace(path, old, new, count=None):
              p=Path(path); s=p.read_text(encoding='utf-8')
              n=s.count(old)
              if count is not None: assert n==count, f'{path}: expected {count}, got {n}: {old!r}'
              else: assert n>0, f'{path}: missing {old!r}'
              p.write_text(s.replace(old,new),encoding='utf-8')

          # Runtime service: turn internal event types into ordinary user language.
          must_replace('src/app/ExperienceService.php',
              "$t=strtoupper(trim($type));return match($t){'DECISION','APPROVAL','RULE','SEAL','GATE'=>'重要决定','RELEASE'=>'版本 / 发布变化','SYNC'=>'来源同步','OBSERVED'=>'项目观察',default=>$type!==''?$type:'项目变化'};",
              "$t=strtoupper(trim($type));return match($t){'DECISION','APPROVAL','RULE','SEAL','GATE'=>'重要决定','RELEASE'=>'版本 / 发布变化','VERSION'=>'版本变化','STATUS'=>'状态变化','BLOCK'=>'阻断变化','NEXT_ACTION'=>'下一步变化','MILESTONE'=>'里程碑','SYNC'=>'来源同步','OBSERVED'=>'项目观察',default=>$type!==''?$type:'项目变化'};",1)
          must_replace('src/app/ExperienceService.php',
              "'title'=>(string)($r['event_type']?:'项目变化')",
              "'title'=>$this->eventTitle((string)($r['event_type']??''))",1)

          # Integrated product UI: Chinese-first labels; real technical entity names remain untouched.
          js=Path('public/assets/experience.js'); s=js.read_text(encoding='utf-8')
          for old,new in [
              ('GLOBAL CONTEXT','全局上下文'),
              ('GLOBAL SEARCH','全局搜索'),
              ('Evidence / 正式来源','证据 / 正式来源'),
          ]:
              assert old in s, f'JS missing {old}'
              s=s.replace(old,new)
          safe="const safeHref=v=>{const s=String(v||'');return s.startsWith('https://')?esc(s):''};"
          human="const humanSource=v=>{const raw=String(v||'');const u=raw.toUpperCase();return esc(({GITHUB:'GitHub',READ_ONLY:'只读',VF_DOC:'vf-doc',CORE_UPDATES:'core-updates'}[u])||raw)};"
          assert safe in s
          if human not in s: s=s.replace(safe,safe+'\n'+human,1)
          assert '${text(r.authority_type)}' in s and '${text(r.read_mode)}' in s
          s=s.replace('${text(r.authority_type)}','${humanSource(r.authority_type)}')
          s=s.replace('${text(r.read_mode)}','${humanSource(r.read_mode)}')
          js.write_text(s,encoding='utf-8')

          # Mobile Today: redundant row action must not wrap into a broken two-line label.
          must_replace('public/assets/experience.css','.change-item>a{display:none}', '.change-item>a,.change-item>button{display:none}',1)

          # Disposable real-structure fixture: ordinary human-facing text stays Chinese-first.
          fixture=Path('tests/integration/v1360_experience_fixture.py'); f=fixture.read_text(encoding='utf-8')
          pairs=[
              ('V1.36.0 正式 Runtime Integration','V1.36.0 正式运行体验集成'),
              ('提交 Integrated Runtime 截图供主控评审','提交正式集成运行界面截图供主控评审'),
              ('Synthetic real-structure fixture','模拟真实结构测试数据'),
              ('Synthetic Formal Authority','模拟正式来源'),
              ('Historical Atomic managed scope omitted memory-api.php; Source Exact was later closed.','历史 Atomic 管理范围曾遗漏 memory-api.php；之后已完成 Source Exact 校正并封板。'),
              ('GitHub + Production Evidence','GitHub + 生产证据'),
          ]
          for old,new in pairs:
              assert old in f, f'fixture missing {old}'
              f=f.replace(old,new)
          fixture.write_text(f,encoding='utf-8')

          # Test expectations follow the corrected fixture/UI language, not old English presentation.
          for filename in ['tests/integration/v1360_formal_runtime_gate.sh','tests/e2e/v1360_integrated_experience.spec.js']:
              p=Path(filename); t=p.read_text(encoding='utf-8')
              t=t.replace('V1.36.0 正式 Runtime Integration','V1.36.0 正式运行体验集成')
              t=t.replace('提交 Integrated Runtime 截图供主控评审','提交正式集成运行界面截图供主控评审')
              t=t.replace("'Integrated Runtime'", "'正式集成运行界面'")
              t=t.replace("'Evidence'", "'证据'")
              p.write_text(t,encoding='utf-8')
          PY

          php -l src/app/ExperienceService.php >/dev/null
          node --check public/assets/experience.js
          python3 -m py_compile tests/integration/v1360_experience_fixture.py
          bash -n tests/integration/v1360_formal_runtime_gate.sh
          node --check tests/e2e/v1360_integrated_experience.spec.js
          python3 tests/integration/v1360_experience_static_gate.py
          grep -F '全局上下文' public/assets/experience.js >/dev/null
          grep -F '全局搜索' public/assets/experience.js >/dev/null
          grep -F "STATUS'=>'状态变化" src/app/ExperienceService.php >/dev/null
          grep -F '.change-item>a,.change-item>button{display:none}' public/assets/experience.css >/dev/null
          grep -F "GITHUB:'GitHub',READ_ONLY:'只读'" public/assets/experience.js >/dev/null
          test -n "$(git status --short)"
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add src/app/ExperienceService.php public/assets/experience.js public/assets/experience.css tests/integration/v1360_experience_fixture.py tests/integration/v1360_formal_runtime_gate.sh tests/e2e/v1360_integrated_experience.spec.js
          git commit -m 'fix(v1.36.0): polish Chinese-first integrated product experience'
          git push origin HEAD:integration/v1.36.0-product-experience
          echo "PATCHED_HEAD=$(git rev-parse HEAD)"
