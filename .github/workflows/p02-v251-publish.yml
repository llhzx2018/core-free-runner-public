name: P02 V2.5.1 Formal Release Publication
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p02-v251-publish.yml']
permissions: {contents: read}
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REPOSITORY: llhzx2018/vf-library
      PRODUCT_REF: 0c1abb08456a102517badf4f0d4b3da4eff3dd4a
      TAG: v2.5.1
      UPDATE_NAME: VF_Library_V2.5.1_UPDATE.zip
      UPDATE_BYTES: '307383'
      UPDATE_SHA256: 5486b00477ed4fff08d13fef856298a4c88f73fbd9ef4d8ab81ea282279259df
      FULL_NAME: VF_Library_V2.5.1_FULL.zip
      FULL_BYTES: '314546'
      FULL_SHA256: b847c54a748a6a873278158504cfee6ee255aa106ec7b4b97cfe78c8de212668
      ATOMIC_NAME: VF_Library_V2.5.1_ATOMIC.zip
      ATOMIC_BYTES: '449402'
      ATOMIC_SHA256: f1541bb6f7eec90dbe0b30c01724d82743c5097b7add1e9547d3cb004e96a50c
      SOURCE_NAME: VF_Library_V2.5.1_SOURCE.zip
      SOURCE_BYTES: '395128'
      SOURCE_SHA256: 873bed7d23adae02a0251f79204ea0afeda762f1d93666c46512dbf31f26c732
      REPAIR_NAME: repair-v2.5.1.php
      REPAIR_BYTES: '597551'
      REPAIR_SHA256: 25088c06d823b46cbcfc39c32f3dc3ec626c0a06f3fd4fbbe748bbd662f4cc8f
      NOTES_NAME: VF_Library_V2.5.1_RELEASE_NOTES.md
      NOTES_BYTES: '811'
      NOTES_SHA256: d20c5475a4a13197fe53f14c97b29f88f33bded997a684daf83a1deea058362c
      MANIFEST_NAME: VF_Library_V2.5.1_RELEASE_MANIFEST.json
      MANIFEST_BYTES: '2694'
      MANIFEST_SHA256: db843930772a35427da6b968aeed96fd5157ad53e4ddee70801f289c3e718183
      SUMS_NAME: SHA256SUMS.txt
      SUMS_BYTES: '669'
      SUMS_SHA256: 15933ce7b508148edcf4eca65180fc48db680fc17f2227c282fa77d807fbffe4
    steps:
      - name: Require registered release capabilities
        env:
          READ_TOKEN: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'
          WRITE_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN" || exit 78
          test -n "$WRITE_TOKEN" || exit 79
          echo REGISTERED_RELEASE_CAPABILITIES=PASS
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.PRODUCT_REPOSITORY }}
          ref: ${{ env.PRODUCT_REF }}
          token: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'
          fetch-depth: 0
          persist-credentials: false
          path: product
      - name: Rebuild and verify exact deterministic release set
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_REF"
          test "$(cat VERSION)" = 2.5.1
          TREE=$(git show -s --format=%T "$PRODUCT_REF")
          python3 scripts/build-release-v2.5.1.py --out build/release --source-commit "$PRODUCT_REF" --source-tree "$TREE" --source-ref release/v2.5.1 >/dev/null
          python3 - <<'PY'
          import hashlib,os
          from pathlib import Path
          root=Path('build/release')
          pairs=[('UPDATE_NAME','UPDATE_BYTES','UPDATE_SHA256'),('FULL_NAME','FULL_BYTES','FULL_SHA256'),('ATOMIC_NAME','ATOMIC_BYTES','ATOMIC_SHA256'),('SOURCE_NAME','SOURCE_BYTES','SOURCE_SHA256'),('REPAIR_NAME','REPAIR_BYTES','REPAIR_SHA256'),('NOTES_NAME','NOTES_BYTES','NOTES_SHA256'),('MANIFEST_NAME','MANIFEST_BYTES','MANIFEST_SHA256'),('SUMS_NAME','SUMS_BYTES','SUMS_SHA256')]
          for nk,bk,hk in pairs:
            p=root/os.environ[nk]; b=p.read_bytes(); assert len(b)==int(os.environ[bk]),(p,len(b)); assert hashlib.sha256(b).hexdigest()==os.environ[hk],p
          print('FORMAL_RELEASE_SET_IDENTITY=PASS')
          PY
      - name: Publish or verify exact private GitHub Release
        working-directory: product
        env: {GH_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'}
        run: |
          set -Eeuo pipefail
          if gh release view "$TAG" --repo "$PRODUCT_REPOSITORY" >/dev/null 2>&1; then
            echo RELEASE_ALREADY_EXISTS=YES
          else
            gh release create "$TAG" build/release/* --repo "$PRODUCT_REPOSITORY" --target "$PRODUCT_REF" --title 'VF Library V2.5.1' --notes-file "build/release/$NOTES_NAME"
            echo RELEASE_CREATED=YES
          fi
          gh release view "$TAG" --repo "$PRODUCT_REPOSITORY" --json databaseId,tagName,publishedAt,targetCommitish,isDraft,isPrerelease,assets > "$RUNNER_TEMP/release.json"
          python3 - "$RUNNER_TEMP/release.json" <<'PY'
          import json,os,sys
          x=json.load(open(sys.argv[1])); assert x['tagName']==os.environ['TAG'] and not x['isDraft'] and not x['isPrerelease']
          expected={os.environ['UPDATE_NAME']:int(os.environ['UPDATE_BYTES']),os.environ['FULL_NAME']:int(os.environ['FULL_BYTES']),os.environ['ATOMIC_NAME']:int(os.environ['ATOMIC_BYTES']),os.environ['SOURCE_NAME']:int(os.environ['SOURCE_BYTES']),os.environ['REPAIR_NAME']:int(os.environ['REPAIR_BYTES']),os.environ['NOTES_NAME']:int(os.environ['NOTES_BYTES']),os.environ['MANIFEST_NAME']:int(os.environ['MANIFEST_BYTES']),os.environ['SUMS_NAME']:int(os.environ['SUMS_BYTES'])}
          assets={a['name']:int(a['size']) for a in x.get('assets',[])}
          for n,s in expected.items(): assert assets.get(n)==s,(n,assets.get(n),s)
          print('RELEASE_ID='+str(x['databaseId'])); print('PUBLISHED_AT='+str(x['publishedAt'])); print('REMOTE_RELEASE_METADATA=PASS')
          PY
      - name: Remote UPDATE bytes and SHA-256 readback
        env: {GH_TOKEN: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/readback"
          gh release download "$TAG" --repo "$PRODUCT_REPOSITORY" --pattern "$UPDATE_NAME" --dir "$RUNNER_TEMP/readback"
          test "$(stat -c %s "$RUNNER_TEMP/readback/$UPDATE_NAME")" = "$UPDATE_BYTES"
          test "$(sha256sum "$RUNNER_TEMP/readback/$UPDATE_NAME" | awk '{print $1}')" = "$UPDATE_SHA256"
          echo REMOTE_UPDATE_BYTES_SHA256=PASS
      - name: Public-safe publication summary
        run: |
          echo P02=VF_LIBRARY
          echo TARGET=2.5.1
          echo FORMAL_SOURCE=$PRODUCT_REF
          echo UPDATE_BYTES=$UPDATE_BYTES
          echo UPDATE_SHA256=$UPDATE_SHA256
          echo PRODUCTION_WRITE=NO
          echo PRIVATE_SOURCE_PERSISTED=NO
