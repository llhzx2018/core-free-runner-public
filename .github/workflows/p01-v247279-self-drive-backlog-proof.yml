name: P01 V2.47.279 Self Drive Backlog Proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p01-v247279-self-drive-backlog-proof.yml"

permissions:
  contents: read

jobs:
  proof:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'proof(P01): V2.47.279 self drive backlog')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd nodejs >/dev/null

      - name: Clone exact candidate and stable
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" candidate
          git -C candidate fetch -q origin 33f39b87b80f7592de8fd96f40efcf0ad4e735a7
          git -C candidate checkout -q --detach 33f39b87b80f7592de8fd96f40efcf0ad4e735a7
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.279"
          git clone -q --depth 1 --branch v2.47.278 "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" stable
          echo P01_V247279_EXACT_SOURCE=PASS

      - name: Syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in             candidate/src/app/JobManager.php             candidate/src/assets/jobs.js             candidate/src/assets/auto-tasks.js             candidate/tests/unit/application_self_drive_backlog_v247279_contract.php             candidate/tests/unit/application_self_drive_backlog_v247279_runtime_proof.php; do
            case "$f" in
              *.php) php -l "$f" ;;
              *.js) node --check "$f" ;;
            esac
          done
          echo P01_V247279_SYNTAX=PASS

      - name: Focused self-drive proof
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          php tests/unit/application_self_drive_backlog_v247279_contract.php
          php tests/unit/application_self_drive_backlog_v247279_runtime_proof.php
          php tests/unit/application_self_drive_scheduler_v247278_contract.php
          php tests/unit/application_self_drive_scheduler_v247278_runtime_proof.php
          php tests/unit/admin_scheduled_tasks_center_contract.php
          php tests/unit/system_health_cron_diagnostic_contract.php
          php tests/unit/system_health_cron_runtime_proof.php
          php tests/unit/backend_ia_round5_system_v247273_contract.php
          echo P01_V247279_FOCUSED=PASS

      - name: Canonical regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate stable --require-zero-debt | tee /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/canonical.txt
          echo P01_V247279_CANONICAL=PASS

      - name: Bounded scope
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C candidate diff --name-only 3e367c082a28ede85d1ea61b105550893f5c2765..33f39b87b80f7592de8fd96f40efcf0ad4e735a7 | tee /tmp/changed.txt
          if grep -E '(^|/)(migrations|schema|update-manager|setup|install)' /tmp/changed.txt; then
            echo "Unexpected migration/installer/updater scope"; exit 1
          fi
          grep -Fx 'src/app/JobManager.php' /tmp/changed.txt
          grep -Fx 'src/assets/auto-tasks.js' /tmp/changed.txt
          grep -Fx 'src/assets/jobs.js' /tmp/changed.txt
          grep -Fx 'docs/authority/ACCEPTANCE_MATRIX.md' /tmp/changed.txt
          echo P01_V247279_BOUNDED_SCOPE=PASS
          echo PRODUCTION_WRITE=NO
