name: S01 converter exact distribution contract
on:
  push:
    branches: [task/s01-converter-i18n-proof-20261030]
    paths: ['.github/workflows/s01-converter-channel-20261030.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: 083af5f975d84a6c777b43a275c9bd4b47c3a758
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: source
      - name: Verify manifest, compatibility and native protocol
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = 083af5f975d84a6c777b43a275c9bd4b47c3a758
          git -C source diff --name-only 574e84c211d668d953473065571bdf052f7348ce HEAD | sort > /tmp/changed
          printf '%s\n' projects/S01-C01.json projects/S01-C03.json | sort > /tmp/expected
          diff -u /tmp/expected /tmp/changed
          python3 source/scripts/check_manifest_contract.py
          find source/update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php source/update-core/php/tests/run.php
          python3 - <<'PY'
          import json,subprocess
          for name,version,old,sha,size,count,repo in [
          ('S01-C01','1.35.220','1.35.219','0e9dbe597a8dcf7e2748f23558a18b5660f535f986773f06f46bdad9a7ba7bde',2027332,476,'vf-tools-theme'),
          ('S01-C03','1.25.96','1.25.95','c49b51b8d4f92acb88fe5b1f1f6a2dc9ce523a49a394425f2123d1e9bed24723',3794853,569,'vf-tools-m3u8')]:
              m=json.load(open('source/projects/'+name+'.json'))
              baseline=json.loads(subprocess.check_output(['git','-C','source','show','574e84c211d668d953473065571bdf052f7348ce:projects/'+name+'.json']))
              assert m['target_version']==version and m['from_versions']==baseline['from_versions']+[old]
              assert m['release_tag']=='v'+version and m['asset_name']==repo+'_V'+version+'.zip'
              assert (m['asset_sha256'],m['asset_bytes'],m['runtime_files'])==(sha,size,count)
              release=json.loads(subprocess.check_output(['gh','api','repos/llhzx2018/'+repo+'/releases/tags/v'+version]))
              assert not release['draft'] and not release['prerelease']
              asset=[a for a in release['assets'] if a['name']==m['asset_name']]
              assert len(asset)==1 and asset[0]['size']==size and asset[0]['digest']=='sha256:'+sha
          m=json.load(open('source/projects/S01-C03.json'))
          assert m['runtime_fingerprint']==m['runtime_fingerprint_sha256']=='52660f33e250b76da29098e56f6a4599f9a8b8666b1eefcf95f806b8352aed84'
          assert m['plugin_file']=='vf-tool-m3u8/vf-tool-m3u8.php' and m['physical_locator']==m['plugin_file']
          print('S01_CONVERTER_DISTRIBUTION_CONTRACT_PASS')
          PY
