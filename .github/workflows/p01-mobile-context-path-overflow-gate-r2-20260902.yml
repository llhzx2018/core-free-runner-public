name: P01 Mobile Context Path Overflow Gate R2
on:
  push:
    branches: [tmp/p01-cover-coverage-diagnostic-20260902]
    paths: [.github/workflows/p01-mobile-context-path-overflow-gate-r2-20260902.yml]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE: 839329a10b2dc036114a76ae8f7ca576664bfe02
      PRODUCT_BRANCH: fix/p01-mobile-context-path-overflow-20260902
      ROOT: ${{ github.workspace }}/product/src
      EVID: /tmp/p01-context-overflow-r2/evidence
      PW: /tmp/p01-context-overflow-r2/pw
      PORT: '18554'
      ADMIN_PASS: P01ContextOverflowR2
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - name: Checkout exact P01 develop
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Exact source concurrency and branch fence
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-context-overflow-r2; mkdir -p "$EVID" "$PW"
          test "$(git -C product rev-parse HEAD)" = "$SOURCE"
          REMOTE="$(git -C product ls-remote origin refs/heads/develop | awk '{print $1}')"; test "$REMOTE" = "$SOURCE"
          test -z "$(git -C product ls-remote --heads origin refs/heads/$PRODUCT_BRANCH)"
          grep -Fq '  .vf-context-chips{margin-top:5px}' product/src/assets/workspace-rebaseline.css
          if grep -Fq '  .vf-functional-head>div{min-width:0}' product/src/assets/workspace-rebaseline.css; then exit 2; fi
          sha256sum product/VERSION product/VF_PROJECT.json > "$EVID/authority-before.sha256"
          printf 'SOURCE=%s\nREMOTE_DEVELOP=%s\nPRODUCT_BRANCH_ABSENT=YES\n' "$SOURCE" "$REMOTE" | tee "$EVID/source.txt"
      - name: Fresh setup and long nested category fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          php -S 127.0.0.1:$PORT -t "$ROOT" >"$EVID/server.log" 2>&1 & echo $! >/tmp/p01-context-overflow-r2.pid
          COOKIE=/tmp/p01-context-overflow-r2.cookies
          for i in $(seq 1 60); do if curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:$PORT/setup.php" -o "$EVID/setup.html"; then break; fi; sleep .25; done
          CSRF=$(python3 - "$EVID/setup.html" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read(); m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s); assert m; print(m.group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:$PORT/setup.php" \
            --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=P01 Context Overflow R2' \
            --data-urlencode "admin_password=$ADMIN_PASS" --data-urlencode "admin_password_confirm=$ADMIN_PASS" -o "$EVID/setup-post.html"
          ROOT="$ROOT" php <<'PHP' | tee "$EVID/dataset.txt"
          <?php
          declare(strict_types=1);
          require getenv('ROOT').'/app/bootstrap.php';
          $db=vf_db(); $repo=new VfRepository($db); $count=0; $target=0;
          $roots=['工作与生产力工具集合','内容创作与媒体资源收藏','开发运维与基础设施服务','财务支付与网络业务资源'];
          foreach($roots as $ri=>$rootName){
            $root=$repo->createCategory(['name'=>$rootName.' · 长名称根分类 '.($ri+1),'parent_id'=>null,'description'=>'','icon'=>'','is_private'=>0,'sort_order'=>$ri]); $count++;
            for($ci=1;$ci<=3;$ci++){
              $child=$repo->createCategory(['name'=>'子分类 '.$ci.' · 跨平台服务与长期收藏资源','parent_id'=>$root,'description'=>'','icon'=>'','is_private'=>0,'sort_order'=>$ci]); $count++;
              for($gi=1;$gi<=2;$gi++){
                $name=($ri===3&&$ci===2&&$gi===2?'支付结算与虚拟卡长期资源':'深层分类 '.$gi.' · 真实工作流与参考资料').' · 超长分类名称';
                $grand=$repo->createCategory(['name'=>$name,'parent_id'=>$child,'description'=>'','icon'=>'','is_private'=>0,'sort_order'=>$gi]); $count++;
                $repo->saveLink(null,['category_id'=>$grand,'title'=>'分类样本 '.$count,'url'=>'https://example.com/context-r2-'.$count,'description'=>'','is_private'=>0],'manual');
                if($ri===3&&$ci===2&&$gi===2)$target=$grand;
              }
            }
          }
          for($i=1;$i<=12;$i++){ $id=$repo->createCategory(['name'=>'补充分类 '.$i.' · 很长的日常网址与工具收藏名称','parent_id'=>null,'description'=>'','icon'=>'','is_private'=>0,'sort_order'=>100+$i]); $count++; $repo->saveLink(null,['category_id'=>$id,'title'=>'补充样本 '.$i,'url'=>'https://example.com/context-r2-extra-'.$i,'description'=>'','is_private'=>0],'manual'); }
          $integrity=strtolower((string)$db->query('PRAGMA integrity_check')->fetchColumn()); $fk=count($db->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC));
          echo "CATEGORY_COUNT=$count\nTARGET=$target\nINTEGRITY=$integrity\nFK=$fk\n"; if($count!==52||$target<=0||$integrity!=='ok'||$fk!==0) exit(2);
          PHP
      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PW"; npm init -y >/dev/null 2>&1; npm install --silent playwright@1.55.0; npx playwright install chromium
      - name: Baseline must reproduce flex child overflow
        shell: bash
        run: |
          set -Eeuo pipefail
          TARGET=$(awk -F= '/^TARGET=/{print $2}' "$EVID/dataset.txt")
          cat > "$PW/baseline.mjs" <<'JS'
          import { chromium } from 'playwright'; import fs from 'fs';
          const base=`http://127.0.0.1:${process.env.PORT}`,target=process.env.TARGET,out=process.env.EVID;
          const browser=await chromium.launch({headless:true}); const page=await browser.newPage({viewport:{width:390,height:844}});
          const response=await page.goto(`${base}/start.php?category=${target}`,{waitUntil:'networkidle',timeout:30000});
          const r=await page.evaluate(()=>{const head=document.querySelector('.vf-functional-head'),inner=head?.firstElementChild,chip=document.querySelector('.vf-context-path-chip');const H=head.getBoundingClientRect(),I=inner.getBoundingClientRect(),C=chip.getBoundingClientRect(),s=getComputedStyle(inner);return {doc:document.documentElement.scrollWidth,vw:document.documentElement.clientWidth,head:{x:H.x,w:H.width,right:H.right},inner:{x:I.x,w:I.width,right:I.right,minWidth:s.minWidth},chip:{x:C.x,w:C.width,right:C.right}}});
          r.http=response?.status()||0; fs.writeFileSync(`${out}/baseline.json`,JSON.stringify(r,null,2)); console.log(JSON.stringify(r)); await page.screenshot({path:`${out}/baseline-390.png`,fullPage:false}); await browser.close();
          if(r.http!==200||r.doc<=r.vw||r.inner.right<=r.head.right+.5||r.inner.minWidth!=='auto') process.exit(3); console.log('BASELINE_FLEX_OVERFLOW=REPRODUCED');
          JS
          cd "$PW"; PORT="$PORT" TARGET="$TARGET" EVID="$EVID" node baseline.mjs | tee "$EVID/baseline.txt"
      - name: Apply and stage one-file flex shrink candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('product/src/assets/workspace-rebaseline.css'); s=p.read_text(encoding='utf-8')
          old='  .vf-context-chips{margin-top:5px}'
          new='  .vf-functional-head>div{min-width:0}\n  .vf-context-chips{margin-top:5px}'
          if s.count(old)!=1: raise SystemExit(f'ANCHOR_COUNT={s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git -C product diff --check
          git -C product diff -- src/assets/workspace-rebaseline.css | tee "$EVID/candidate.diff"
          sha256sum product/VERSION product/VF_PROJECT.json > "$EVID/authority-after.sha256"; diff -u "$EVID/authority-before.sha256" "$EVID/authority-after.sha256"
          git -C product add -- src/assets/workspace-rebaseline.css
          mapfile -t STAGED < <(git -C product diff --cached --name-only); test "${#STAGED[@]}" -eq 1; test "${STAGED[0]}" = 'src/assets/workspace-rebaseline.css'
          printf 'STAGED=%s\n' "${STAGED[0]}" | tee "$EVID/staged.txt"
      - name: Candidate 390 and 360 must eliminate overflow and preserve picker
        shell: bash
        run: |
          set -Eeuo pipefail
          TARGET=$(awk -F= '/^TARGET=/{print $2}' "$EVID/dataset.txt")
          cat > "$PW/candidate.mjs" <<'JS'
          import { chromium } from 'playwright'; import fs from 'fs';
          const base=`http://127.0.0.1:${process.env.PORT}`,target=process.env.TARGET,out=process.env.EVID;
          const browser=await chromium.launch({headless:true}); const reports=[];
          for(const width of [390,360]){
            const page=await browser.newPage({viewport:{width,height:844}}); const consoleErrors=[],pageErrors=[];
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())}); page.on('pageerror',e=>pageErrors.push(String(e)));
            const response=await page.goto(`${base}/start.php?category=${target}`,{waitUntil:'networkidle',timeout:30000});
            const selected=await page.evaluate(()=>{const head=document.querySelector('.vf-functional-head'),inner=head?.firstElementChild,chip=document.querySelector('.vf-context-path-chip');const H=head.getBoundingClientRect(),I=inner.getBoundingClientRect(),C=chip.getBoundingClientRect(),s=getComputedStyle(inner);return {doc:document.documentElement.scrollWidth,vw:document.documentElement.clientWidth,head:{right:H.right,w:H.width},inner:{right:I.right,w:I.width,minWidth:s.minWidth},chip:{right:C.right,w:C.width},triggerText:document.querySelector('.vf-mobile-category-trigger b')?.textContent||'',context:(chip?.textContent||'').trim()}});
            const trigger=page.locator('.vf-mobile-category-trigger:visible'); await trigger.click(); await page.locator('.vf-mobile-category-overlay.open').waitFor({state:'visible'});
            const search=page.locator('.vf-mobile-category-search input'); await search.fill('支付结算'); await page.waitForTimeout(80);
            const filtered=await page.evaluate(()=>[...document.querySelectorAll('[data-category-picker-item]')].filter(e=>!e.hidden).map(e=>(e.textContent||'').trim()));
            await page.keyboard.press('Escape'); await page.waitForTimeout(220);
            const closed=await page.evaluate(()=>({hidden:document.querySelector('.vf-mobile-category-overlay')?.hidden,expanded:document.querySelector('.vf-mobile-category-trigger')?.getAttribute('aria-expanded'),bodyOpen:document.body.classList.contains('vf-mobile-category-open')}));
            const report={width,http:response?.status()||0,selected,filtered,closed,consoleErrors,pageErrors}; reports.push(report); console.log(JSON.stringify(report)); await page.screenshot({path:`${out}/candidate-${width}.png`,fullPage:false}); await page.close();
            if(report.http!==200||selected.doc!==selected.vw||selected.inner.minWidth!=='0px'||selected.inner.right>selected.head.right+.5||selected.chip.right>selected.head.right+.5||!selected.triggerText.includes('支付结算')||!selected.context.includes('支付结算')||filtered.length!==1||!filtered[0].includes('支付结算')||closed.hidden!==true||closed.expanded!=='false'||closed.bodyOpen||pageErrors.length) process.exit(4);
            if(consoleErrors.some(x=>x.includes('MIME type'))) process.exit(5);
          }
          fs.writeFileSync(`${out}/candidate.json`,JSON.stringify(reports,null,2)); await browser.close(); console.log('P01_MOBILE_CONTEXT_PATH_OVERFLOW_GATE_R2=PASS');
          JS
          cd "$PW"; PORT="$PORT" TARGET="$TARGET" EVID="$EVID" node candidate.mjs | tee "$EVID/candidate.txt"
      - name: Commit and push isolated Product branch only after PASS
        shell: bash
        run: |
          set -Eeuo pipefail
          REMOTE="$(git -C product ls-remote origin refs/heads/develop | awk '{print $1}')"; test "$REMOTE" = "$SOURCE"
          test -z "$(git -C product ls-remote --heads origin refs/heads/$PRODUCT_BRANCH)"
          git -C product config user.name VictorForge; git -C product config user.email llhzx2018@gmail.com
          git -C product commit -m 'fix(P01): allow mobile context path to shrink'
          CANDIDATE=$(git -C product rev-parse HEAD); test "$(git -C product rev-parse HEAD^)" = "$SOURCE"
          mapfile -t FILES < <(git -C product diff-tree --no-commit-id --name-only -r "$CANDIDATE"); test "${#FILES[@]}" -eq 1; test "${FILES[0]}" = 'src/assets/workspace-rebaseline.css'
          git -C product push origin "HEAD:refs/heads/$PRODUCT_BRANCH"
          REMOTE_BRANCH="$(git -C product ls-remote origin refs/heads/$PRODUCT_BRANCH | awk '{print $1}')"; test "$REMOTE_BRANCH" = "$CANDIDATE"
          printf 'CANDIDATE=%s\nREMOTE_BRANCH=%s\nP01_REF_WRITE=PRODUCT_BRANCH_ONLY\nMAIN_WRITE=NO\nPRODUCTION_WRITE=NO\nRUNNER_MAIN_WRITE=NO\n' "$CANDIDATE" "$REMOTE_BRANCH" | tee "$EVID/push.txt"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-mobile-context-overflow-r2-${{ github.run_id }}
          path: ${{ env.EVID }}
          if-no-files-found: error
          retention-days: 30
      - name: Stop server
        if: always()
        shell: bash
        run: kill "$(cat /tmp/p01-context-overflow-r2.pid 2>/dev/null)" 2>/dev/null || true
