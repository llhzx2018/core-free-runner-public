name: S01 screenshot recheck exact WordPress validation
on:
  push:
    branches: [task/s01-screenshot171-20261022]
    paths: ['.github/workflows/s01-screenshot171-20261022.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.171
  TARGET_SHA: 5b1791d9529bf9e6b687e25eb6454a3e1869007d
  TARGET_TREE: fe26fc4ebff9c3bbb4152f4ad3f6ec7c002f8a58
  BASE_SHA: 5e54d38be3dca221438f28519b2faf5f2c77d241
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          ref: 02d4591eed025a3d3a67bc0a150b3ddc448c2ab8
          persist-credentials: false
          path: established
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 5b1791d9529bf9e6b687e25eb6454a3e1869007d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact package and fresh confirmation regression
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider baseline
          python3 control/lanes/s01-screenshot171-20261022/package.py
          php -l target/src/inc/runtime-constants.php
          node --check target/src/assets/js/admin/admin-recovery-v510.js
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -g -fsSL --retry 2 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC[wght].ttf' -o "$HOME/.local/share/fonts/NotoSansSC.ttf"
          fc-cache -f
          php -l target/src/inc/admin/views/preview.php
          php -l target/src/inc/admin/views/recovery-v510.php
          php -l target/src/inc/admin/views/partials/layout-home-tool-workspaces.php
          node --check target/src/assets/js/admin/admin-console.js
          gh release download v1.35.170 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.170.zip --dir provider
          echo 'd66a7f2522a0e69fe04aa6de6e5eed4e42d7ff096093853cc35cba25f4b9a2fa  provider/vf-tools-theme_V1.35.170.zip' | sha256sum -c
          gh release download v1.25.94 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.94.zip --dir provider
          echo '70b90d40da5d69fc7819bd7ada3f15fb0145e64822b788bd94956c7827b2df03  provider/vf-tools-m3u8_V1.25.94.zip' | sha256sum -c
      - name: Exact clean ZIP native upgrade rollback repeat and state protection
        run: |
          set -euo pipefail
          cp -a established/lanes/s01-frontend-design-20261017 lane
          cp control/lanes/s01-screenshot171-20261022/clean.cjs lane/warm-admin.cjs
          cp control/lanes/s01-screenshot171-20261022/seed.php lane/operations-seed.php
          cp control/lanes/s01-screenshot171-20261022/review-snapshot.php lane/review-snapshot.php
          python3 - <<'PYLANE'
          from pathlib import Path
          s=Path('lane/native.sh').read_text().replace('provider/vf-tools-m3u8_V1.25.91.zip','provider/vf-tools-m3u8_V1.25.94.zip')
          marker='docker cp target/src/. "$WP:/var/www/html/wp-content/themes/vf-tools-theme/"'
          assert s.count(marker)==1
          s=s.replace(marker,'docker exec "$WP" rmdir /var/www/html/wp-content/themes/vf-tools-theme\ndocker cp provider/vf-tools-theme_V1.35.171.zip "$WP:/tmp/clean-theme.zip"\ncli theme install /tmp/clean-theme.zip >/dev/null')
          installer='cli plugin install polylang --version=3.8.10 --activate >/dev/null'
          assert s.count(installer)==1
          s=s.replace(installer,'for attempt in 1 2 3; do '+installer+' && break; test "$attempt" -lt 3 || exit 1; sleep 3; done')
          marker='docker cp lane/snapshot.php "$WP:/tmp/snapshot.php"'
          assert s.count(marker)==1
          s=s.replace(marker,'docker cp lane/operations-seed.php "$WP:/tmp/operations-seed.php";cli eval-file /tmp/operations-seed.php >/dev/null\n'+marker)
          s=s.replace('cli eval-file /tmp/snapshot.php > proof/state-before.sha256','docker cp lane/review-snapshot.php "$WP:/tmp/review-snapshot.php";cli eval-file /tmp/review-snapshot.php > proof/review-before.sha256\ncli eval-file /tmp/snapshot.php > proof/state-before.sha256')
          marker='if [ "${VF_REVIEW_ONLY_STATE:-0}" = "1" ];then'
          assert s.count(marker)==1
          s=s.split(marker)[0]+"""
          docker cp provider/vf-tools-theme_V1.35.170.zip "$WP:/tmp/theme-old.zip"
          docker cp provider/vf-tools-theme_V1.35.171.zip "$WP:/tmp/theme-new.zip"
          version_check(){ test "$(cli theme get vf-tools-theme --field=version)" = "$1"; test "$(cli plugin get vf-tool-m3u8 --field=version)" = "1.25.94"; echo INSTALLED_VERSION_PASS="$1"; }
          version_check 1.35.171
          cli theme install /tmp/theme-old.zip --force >/dev/null
          version_check 1.35.170
          NODE_PATH="$PWD/node_modules" node control/lanes/s01-screenshot171-20261022/mounted.cjs --baseline
          cli theme install /tmp/theme-new.zip --force >/dev/null
          version_check 1.35.171
          cli theme install /tmp/theme-old.zip --force >/dev/null
          version_check 1.35.170
          cli theme install /tmp/theme-new.zip --force >/dev/null
          version_check 1.35.171
          cli theme install /tmp/theme-new.zip --force >/dev/null
          version_check 1.35.171
          NODE_PATH="$PWD/node_modules" node control/lanes/s01-screenshot171-20261022/mounted.cjs
          cli eval-file /tmp/snapshot.php > proof/state-after.sha256
          cmp proof/state-before.sha256 proof/state-after.sha256
          cli eval-file /tmp/review-snapshot.php > proof/review-after.sha256
          cmp proof/review-before.sha256 proof/review-after.sha256
          echo NATIVE_CLEAN_ZIP_UPGRADE_ROLLBACK_REPEAT_PROTECTED_DATA_PASS
          """
          Path('lane/preview.sh').write_text(s)
          PYLANE
          bash lane/preview.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-screenshot-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private runtime
        if: always()
        run: rm -rf target provider lane baseline
