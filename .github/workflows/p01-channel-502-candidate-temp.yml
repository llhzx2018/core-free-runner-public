name: p01-channel-502-candidate-clean-install-and-atomic
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-channel-502-candidate-temp.yml'
      - 'scripts/p01-channel-v247502-candidate-test-temp.py'
permissions:
  contents: read
jobs:
  p01-502-exact-development-candidate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      PRODUCT_SHA: 99136140ba4e126c233855f00a5c63a72591023e
      PRODUCT_TREE: 04b93a1eb6eeae66b2043dd99f0122e7f472066a
      PRODUCT_BASE: 89eedcf30e45791b8ee5aada11dc087a2862978b
      WORK: /tmp/p01-502-channel-${{ github.run_id }}
    steps:
      - name: Checkout registered public-safe Runner and builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare disposable PHP runtime and test harness
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$WORK/official"
          python3 -m py_compile scripts/p01-channel-v247502-candidate-test-temp.py
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-zip php-mbstring php-gd unzip >/dev/null
          echo P01_502_PUBLIC_SAFE_SYNTHETIC_TEST_ENV=PASS
      - name: Exact private product candidate and official baseline code checkout
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          test -n "$READ_TOKEN"
          remote="$(git ls-remote "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" refs/heads/release-candidate/p01-channels-2.47.502 | awk '{print $1}')"
          test "$remote" = "$PRODUCT_SHA"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" "$WORK/candidate"
          git -C "$WORK/candidate" fetch -q --depth 24 origin "$PRODUCT_SHA" "$PRODUCT_BASE" refs/tags/v2.47.501:refs/tags/v2.47.501
          git -C "$WORK/candidate" checkout -q --detach "$PRODUCT_SHA"
          git -C "$WORK/candidate" remote set-url origin https://github.com/llhzx2018/vf-start.git
          test "$(git -C "$WORK/candidate" rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git -C "$WORK/candidate" rev-parse HEAD^{tree})" = "$PRODUCT_TREE"
          test "$(git -C "$WORK/candidate" diff --name-only "$PRODUCT_BASE" "$PRODUCT_SHA")" = "$(printf 'VERSION\nsrc/VERSION.txt\nsrc/app/bootstrap.php')"
          git -C "$WORK/candidate" worktree add -q --detach "$WORK/baseline" v2.47.501
          test "$(tr -d '\r\n ' < "$WORK/candidate/VERSION")" = 2.47.502
          test "$(tr -d '\r\n ' < "$WORK/candidate/src/VERSION.txt")" = 2.47.502
          test "$(tr -d '\r\n ' < "$WORK/baseline/VERSION")" = 2.47.501
          echo P01_502_EXACT_THREE_FILE_VERSION_ONLY_DELTA=PASS
      - name: Canonical candidate versus official Stable release
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l "$WORK/candidate/src/app/bootstrap.php"
          bash "$WORK/candidate/tests/canonical_release_regression.sh" "$WORK/candidate" "$WORK/baseline"
          echo P01_502_CANONICAL_BASELINE_REGRESSION=PASS
      - name: Read official 2.47.501 bytes from GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          gh release download v2.47.501 -R llhzx2018/vf-start -D "$WORK/official" \
            -p VF-Start-V2.47.501-FULL.zip -p VF_Start_V2.47.501_UPDATE.zip
          printf '%s  %s\n' \
            387d48f9d94d479b71ffff4c28bef703a5c8ceed95f5ebee9498603006b75b5c \
            "$WORK/official/VF-Start-V2.47.501-FULL.zip" | sha256sum -c -
          printf '%s  %s\n' \
            658faa9c1e30b10ae7932f04a68f50a777e23a2115e0fd3d602c66ad64e02fa8 \
            "$WORK/official/VF_Start_V2.47.501_UPDATE.zip" | sha256sum -c -
          echo P01_502_OFFICIAL_501_SOURCE_TWO_DIGESTS=PASS
      - name: Deterministic test-only FULL and UPDATE clean install Atomic preserve rollback hard recovery
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/p01-channel-v247502-candidate-test-temp.py \
            --work "$WORK" --candidate "$WORK/candidate" \
            --old-full "$WORK/official/VF-Start-V2.47.501-FULL.zip" \
            --old-update "$WORK/official/VF_Start_V2.47.501_UPDATE.zip" \
            --candidate-sha "$PRODUCT_SHA" --candidate-tree "$PRODUCT_TREE"
          echo P01_502_PRE_FORMAL_RELEASE_TEST_ONLY_SOURCE_VERIFIED=PASS
      - name: Cleanup private source synthetic user state and test-only archives
        if: always()
        shell: bash
        run: |
          echo P01_502_PUBLIC_ARTIFACT=NONE
          echo P01_502_PRODUCTION_WRITE=NONE
          case "$WORK" in /tmp/p01-502-channel-*) rm -rf -- "$WORK";; *) exit 66;; esac
