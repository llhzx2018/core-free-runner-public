name: P02 V2.5.9 Scratch Tabs Browser V2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v259-scratch-tabs-browser-v2.yml'

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Require private capabilities
        env:
          READ_TOKEN: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'
          WRITE_TOKEN: '${{ secrets.VF_PRIVATE_WRITE_TOKEN }}'
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: feature/v2.5.9-scratch-tabs
          token: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'
          path: product
          fetch-depth: 1
          persist-credentials: false
      - name: Real browser scratch workflow
        working-directory: product
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/scratch-browser"; SITE="$ROOT/site"; NODE="$ROOT/node"; mkdir -p "$SITE" "$NODE"
          bash scripts/build-deploy-tree.sh "$SITE" >/dev/null
          test "$(cat "$SITE/VERSION.txt")" = 2.5.9
          PW='P02-V259-Scratch-Browser-V2!'; PORT=18293
          php -S 127.0.0.1:$PORT -t "$SITE" >"$ROOT/server.log" 2>&1 & PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for _ in $(seq 1 80); do curl -fsS "http://127.0.0.1:$PORT/setup.php" >/dev/null 2>&1 && break; sleep .25; done
          curl -fsS -c "$ROOT/c" "http://127.0.0.1:$PORT/setup.php" > "$ROOT/setup"
          TOKEN=$(python3 - "$ROOT/setup" <<'PY'
          import re,html,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf" value="([^"]+)"',s);assert m;print(html.unescape(m.group(1)))
          PY
          )
          test "$(curl -sS -o /dev/null -w '%{http_code}' -b "$ROOT/c" -c "$ROOT/c" -H "Origin: http://127.0.0.1:$PORT" --data-urlencode "setup_csrf=$TOKEN" --data-urlencode "password=$PW" --data-urlencode "password_confirm=$PW" "http://127.0.0.1:$PORT/setup.php")" = 303
          cd "$NODE"; npm init -y >/dev/null 2>&1; npm install --no-audit --no-fund puppeteer-core@24.16.0 >/dev/null 2>&1
          CHROME=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true); test -n "$CHROME"
          cat > "$NODE/test.mjs" <<'JS'
          import puppeteer from 'puppeteer-core';
          const [url,password,chrome]=process.argv.slice(2);
          const browser=await puppeteer.launch({headless:true,executablePath:chrome,args:['--no-sandbox','--disable-dev-shm-usage']});
          const page=await browser.newPage();await page.setViewport({width:1440,height:1000});
          await page.goto(url,{waitUntil:'networkidle0'});
          await page.evaluate(async password=>{const r=await fetch('/api.php?action=login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});if(!r.ok)throw new Error('login '+r.status);},password);
          await page.reload({waitUntil:'networkidle0'});
          await page.waitForSelector('#scratchLaunchV259',{visible:true,timeout:12000});
          await page.click('#scratchLaunchV259');
          await page.waitForSelector('#scratchWorkspaceV259 [data-scratch-editor]:not([disabled])',{timeout:10000});
          let editor=await page.$('[data-scratch-editor]');await editor.type('Chrome临时一\n第二行',{delay:12});
          await page.waitForFunction(()=>document.querySelector('[data-scratch-status]')?.textContent.includes('已自动保存'),{timeout:10000});
          await page.click('[data-scratch-add]');await page.waitForFunction(()=>document.querySelectorAll('[data-scratch-tab]').length===2,{timeout:8000});
          editor=await page.$('[data-scratch-editor]');await editor.type('第二个临时页',{delay:10});await page.waitForFunction(()=>document.querySelector('[data-scratch-status]')?.textContent.includes('已自动保存'),{timeout:10000});
          const tabs=await page.$$('[data-scratch-tab]');await tabs[0].click();await page.waitForFunction(()=>document.querySelector('[data-scratch-editor]').value.includes('Chrome临时一'));
          await page.reload({waitUntil:'networkidle0'});
          await page.waitForSelector('#scratchWorkspaceV259 [data-scratch-editor]:not([disabled])',{timeout:12000});
          if(await page.$$eval('[data-scratch-tab]',els=>els.length)!==2)throw new Error('tabs not restored');
          if(!(await page.$eval('[data-scratch-editor]',el=>el.value)).includes('Chrome临时一'))throw new Error('active content not restored');
          await page.$eval('[data-scratch-tab].active [data-scratch-close]',el=>el.click());await page.waitForFunction(()=>document.querySelectorAll('[data-scratch-tab]').length===1,{timeout:8000});
          await page.click('[data-scratch-recent]');await page.waitForSelector('[data-scratch-reopen]');await page.click('[data-scratch-reopen]');await page.waitForFunction(()=>document.querySelectorAll('[data-scratch-tab]').length===2,{timeout:8000});
          if(!(await page.$eval('[data-scratch-editor]',el=>el.value)).includes('Chrome临时一'))throw new Error('reopen lost content');
          await page.evaluate(async()=>{const s=await (await fetch('/api.php?action=session')).json();const b=await (await fetch('/api.php?action=app_bootstrap')).json();if(!(b.data.categories||[]).some(c=>String(c.name).includes('待整理'))){const r=await fetch('/api.php?action=category_save',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':s.csrf},body:JSON.stringify({name:'99 待整理',icon:'folder'})});if(!r.ok)throw new Error('category '+r.status);}});
          await page.click('[data-scratch-organize]');await page.waitForSelector('.scratch-organize-overlay-v259');await page.click('[data-organize-submit]');await page.waitForFunction(()=>document.querySelectorAll('[data-scratch-tab]').length===1,{timeout:10000});
          await page.setViewport({width:390,height:844});await new Promise(r=>setTimeout(r,300));
          const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+1);if(overflow)throw new Error('mobile horizontal overflow');
          await browser.close();
          console.log('BROWSER_SCRATCH_TABS=PASS');
          console.log('AUTOSAVE_RELOAD_RESTORE=PASS');
          console.log('CLOSE_REOPEN=PASS');
          console.log('ORGANIZE_UI=PASS');
          console.log('MOBILE_OVERFLOW=PASS');
          JS
          node "$NODE/test.mjs" "http://127.0.0.1:$PORT/" "$PW" "$CHROME"
          echo "PRODUCT_HEAD=$(git -C "$GITHUB_WORKSPACE/product" rev-parse HEAD)"
          echo P02_V259_BROWSER_GATE=PASS
      - name: Generate and push private candidate authority
        working-directory: product
        env:
          WRITE_TOKEN: '${{ secrets.VF_PRIVATE_WRITE_TOKEN }}'
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('CHANGELOG.md');s=p.read_text(encoding='utf-8')
          marker='# VF Library V2.5.9 · Scratch Tabs / 临时页签工作台 · Candidate · 2026-08-19'
          entry=(marker+'\n\n'
            '- 新增 Notepad 风格“临时页签工作台”：点击“临时”后直接用 `+` 连续创建空白 TAB，不要求标题、分类或手动保存。\n'
            '- 临时正文与打开/关闭状态持久化到现有私有 SQLite；浏览器刷新、重新打开或电脑重启后继续原现场。\n'
            '- 输入自动保存；关闭 TAB 只进入“最近关闭”，不会删除内容，可重新打开；永久删除需要显式确认。\n'
            '- “整理”可把临时页签转为正式便签或文章并选择分类，默认优先 `99 待整理`；整理成功后才移出临时工作台。\n'
            '- 临时页签与正式内容分层，不污染文章/便签列表；现有编辑器模板入口保持不变。\n'
            '- Scratch 状态复用现有 `system_settings` 与 SQLite 备份链，Schema 保持 2401，无 Migration。\n'
            '- Candidate API/Fresh Install Run `32220473904` PASS；真实 Chrome Run `32220814612` PASS：自动保存、多 TAB、刷新恢复、关闭/重开、整理与 390px Mobile 无横向溢出。\n\n')
          if marker not in s:p.write_text(entry+s,encoding='utf-8')
          PY
          python3 scripts/generate-source-manifest.py
          php -l src/app/ScratchTabsService.php >/dev/null
          php -l public/scratch-action.php >/dev/null
          node --check public/assets/scratch-tabs.js
          python3 scripts/repository-gates.py
          git diff --check
          grep -q '2.5.9' SOURCE_MANIFEST.json
          git config user.name 'VF Agent Runner'
          git config user.email 'actions@users.noreply.github.com'
          git add CHANGELOG.md SOURCE_MANIFEST.json SOURCE_MANIFEST.txt
          if ! git diff --cached --quiet; then git commit -m 'chore(v2.5.9): seal candidate authority'; fi
          git remote set-url origin "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/vf-library.git"
          git push origin HEAD:feature/v2.5.9-scratch-tabs
          echo "SEALED_PRODUCT_HEAD=$(git rev-parse HEAD)"
          echo P02_V259_CANDIDATE_SEAL=PASS
          echo PRODUCTION_WRITE=NO
