name: S01 C02 1211096 Update Offer Source Gate Regression
on:
  push:
    branches: [task/s01-c02-1211096-update-offer-order-regression-20261011]
permissions:
  contents: read
jobs:
  exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SOURCE_SHA: '35c4435bf9d7264335fa90142ed1654e4a0b2f6a'
    steps:
      - name: Checkout scoped public test recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch only private product test and dependencies
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          for p in \
            includes/wp-update/class-vf-ops-update-client-v1.php \
            includes/admin-v13/services/system_plugins.php \
            includes/admin-v13/views/system_plugins.php \
            assets/css/current/admin-s01-system-one-page-r1.css \
            tests/s01-c02-1211095-system-update-blocker-visibility.php \
            tests/s01-c02-1211096-current-update-offer-order.php; do
            mkdir -p "exact/$(dirname "$p")"
            gh api -H "Accept: application/vnd.github.raw+json" "repos/llhzx2018/vf-tools-ops/contents/$p?ref=$SOURCE_SHA" > "exact/$p"
            test -s "exact/$p"
          done
      - name: Lint and verify both false and genuine blockers
        run: |
          set -Eeuo pipefail
          cd exact
          for p in includes/wp-update/class-vf-ops-update-client-v1.php \
            includes/admin-v13/services/system_plugins.php \
            includes/admin-v13/views/system_plugins.php \
            tests/s01-c02-1211095-system-update-blocker-visibility.php \
            tests/s01-c02-1211096-current-update-offer-order.php; do
            php -l "$p"
          done
          php tests/s01-c02-1211095-system-update-blocker-visibility.php
          php tests/s01-c02-1211096-current-update-offer-order.php
          echo S01_C02_1211096_UPDATE_OFFER_GATE_PASS
