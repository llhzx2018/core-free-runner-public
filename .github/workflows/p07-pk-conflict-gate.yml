name: P07 PK conflict exact-source advisory safety gate
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-pk-conflict-gate.yml'
      - 'experiments/p07-pk-evidence/**'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact candidate source and immutable release108 baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          root=dist/p07/0.1.0/overlay
          test "$(cat "$root/BUILD_ID")" = 0.1.0-release108
          test "$(git hash-object experiments/p07-pk-evidence/sql_pk_conflict_evidence.py)" = 11fa32bbef352fe02b7d1b23218c709d5f99f18c
          test "$(git hash-object experiments/p07-pk-evidence/sql_diff_evidence.py)" = 02a377c90279b924b9d589525c5edcb098bed263
          test "$(git hash-object experiments/p07-pk-evidence/test_sql_pk_conflict_evidence.py)" = cb128e1fa213b61fb464997db18479a11970e6d8
          cp -a "$root" "$RUNNER_TEMP/p07-pk-sandbox"
          cp experiments/p07-pk-evidence/sql_pk_conflict_evidence.py "$RUNNER_TEMP/p07-pk-sandbox/lib/sql_pk_conflict_evidence.py"
          cp experiments/p07-pk-evidence/sql_diff_evidence.py "$RUNNER_TEMP/p07-pk-sandbox/lib/sql_diff_evidence.py"
          cp experiments/p07-pk-evidence/test_sql_pk_conflict_evidence.py "$RUNNER_TEMP/p07-pk-sandbox/tests/test_sql_pk_conflict_evidence.py"
          chmod +x "$RUNNER_TEMP/p07-pk-sandbox/bin/"*
          echo P07_PK_EXACT_BLOB_PASS
      - name: Run PK-key identity adversarial and prior SQL/migration regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/p07-pk-sandbox"
          python3 -m py_compile lib/sql_pk_conflict_evidence.py lib/sql_diff_evidence.py tests/test_sql_pk_conflict_evidence.py
          PYTHONPATH=lib python3 -m unittest -v \
            tests.test_sql_pk_conflict_evidence \
            tests.test_sql_multiset_evidence \
            tests.test_sql_readback_stability \
            tests.test_sql_row_evidence \
            tests.test_multiline_dml_integrity \
            tests.test_sql_diff_evidence \
            tests.test_sql_diff_command \
            tests.test_verify \
            tests.test_server_migration_pull
          echo P07_PK_SECURITY_REGRESSION_PASS
      - name: Verify migration write and guarded SQL verifier remain byte-for-byte untouched
        shell: bash
        run: |
          set -Eeuo pipefail
          root=dist/p07/0.1.0/overlay
          for p in lib/server_migration_pull.py lib/verify.py lib/server_migration.py lib/cloudpanel.py lib/transport.py bin/vfops BUILD_ID; do
            test "$(git hash-object "$root/$p")" = "$(git hash-object "$RUNNER_TEMP/p07-pk-sandbox/$p")"
          done
          echo P07_PK_NO_IMPORT_OR_SQL_GUARD_WRITE_CHANGE_PASS
