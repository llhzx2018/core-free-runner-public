name: P01 V2.31 Contextual Action Copy Gate
on:
  push:
    branches: [task/p01-v231-contextual-action-copy-20260829]
    paths: [.github/workflows/p01-v231-contextual-action-copy-20260829.yml]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ROOT: ${{ github.workspace }}/product/src
      PORT: '18633'
      ADMIN_PASS: 'P01V231!ActionCopy'
      EVID: /tmp/p01-v231-action-copy-evidence
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: b8d1ed568aef8191278c0197a6c51673242d360e
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Exact source and syntax fence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVID"
          test "$(git -C product rev-parse HEAD)" = b8d1ed568aef8191278c0197a6c51673242d360e
          test "$(tr -d '\r\n' < "$ROOT/VERSION.txt")" = 2.30.0
          test "$(git -C product diff --name-only 2f9e0999732608a21b7973bbb9cf5d3942d7792e...HEAD)" = src/assets/workspace-create-bundle.js
          node --check "$ROOT/assets/workspace-create-bundle.js"
          grep -F "start:'网址',channels:'频道',watch:'影视',topics:'专题'" "$ROOT/assets/workspace-create-bundle.js" >/dev/null
          echo P01_V231_ACTION_COPY_SOURCE=PASS | tee "$EVID/source.txt"
      - name: Fresh runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f /tmp/p01-v231-action.cookies
          php -S "127.0.0.1:${PORT}" -t "$ROOT" >"$EVID/server.log" 2>&1 & echo $! >/tmp/p01-v231-action.pid
          for i in $(seq 1 40); do curl -fsS -c /tmp/p01-v231-action.cookies -b /tmp/p01-v231-action.cookies "http://127.0.0.1:${PORT}/setup.php" -o /tmp/p01-v231-action-setup.html && break || sleep .25; done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-v231-action-setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c /tmp/p01-v231-action.cookies -b /tmp/p01-v231-action.cookies -X POST "http://127.0.0.1:${PORT}/setup.php" --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=P01 V231 Action Copy' --data-urlencode "admin_password=$ADMIN_PASS" --data-urlencode "admin_password_confirm=$ADMIN_PASS" -o "$EVID/setup-post.html"
          test -f "$ROOT/app/.runtime.php"
          php "$ROOT/cli/verify.php" | tee "$EVID/verify.txt" | grep -Fx VERIFY_PASS=YES
      - name: Desktop mobile contextual copy gate
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-v231-action-browser && cd /tmp/p01-v231-action-browser
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-save >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null 2>&1
          cat >gate.mjs <<'JS'
          import{chromium}from'playwright';
          const base='http://127.0.0.1:18633',pass='P01V231!ActionCopy',e='/tmp/p01-v231-action-copy-evidence';
          const cases=[['surfaces.php','资源'],['start.php','网址'],['channels.php','频道'],['watch.php','影视'],['topics.php','专题']];
          const b=await chromium.launch({headless:true});
          const make=async(viewport,isMobile=false)=>{const c=await b.newContext({viewport,isMobile});const r=await c.request.post(base+'/api.php?action=login',{data:{password:pass}});if(!r.ok())throw Error('login '+r.status());return c};
          const verify=async(c,path,noun,suffix)=>{const p=await c.newPage();await p.goto(base+'/'+path,{waitUntil:'networkidle'});const add=p.locator('[data-open-add]:visible').first();await add.waitFor();const buttonText=(await add.innerText()).replace(/\s+/g,' ').trim();if(!buttonText.includes('添加'+noun))throw Error(`${path} trigger ${buttonText}`);await add.click();const panel=p.locator('[data-panel="add"]:visible');await panel.waitFor();const aria=await panel.getAttribute('aria-label');const title=(await panel.locator('header strong').innerText()).trim();const primary=(await panel.locator('button[type="submit"]:not([data-add-continue])').innerText()).trim();for(const [k,v] of Object.entries({aria,title,primary})){if(v!=='添加'+noun)throw Error(`${path} ${k} ${v}`)}await p.screenshot({path:`${e}/${path.replace('.php','')}-${suffix}.png`,fullPage:true});await p.close()};
          const d=await make({width:1440,height:960});for(const [path,noun] of cases)await verify(d,path,noun,'desktop');await d.close();
          const m=await make({width:390,height:844},true);for(const [path,noun] of [['start.php','网址'],['watch.php','影视'],['topics.php','专题']])await verify(m,path,noun,'mobile');await m.close();
          await b.close();console.log('CONTEXTUAL_ACTION_COPY_PASS');
          JS
          node gate.mjs | tee "$EVID/browser.txt" | grep -Fx CONTEXTUAL_ACTION_COPY_PASS
      - name: Final verdict
        shell: bash
        run: |
          cat >"$EVID/verdict.txt" <<'EOF'
          P01_V231_CONTEXTUAL_ACTION_COPY=PASS
          P01_V231_ALL_RESOURCES_GENERIC_COPY=PASS
          P01_V231_DOMAIN_ACTION_COPY=PASS
          P01_V231_DESKTOP_COPY=PASS
          P01_V231_MOBILE_COPY=PASS
          P01_V231_SAVE_LOGIC_UNCHANGED=PASS
          P01_V231_SCHEMA_UNCHANGED=PASS
          P01_V231_VERSION_UNCHANGED_2.30.0=PASS
          OWNER_PRODUCTION_WRITE=NO
          EOF
          cat "$EVID/verdict.txt"
      - name: Upload action-copy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-v231-action-copy-evidence-${{ github.run_id }}
          path: /tmp/p01-v231-action-copy-evidence
          if-no-files-found: warn
          retention-days: 30
      - name: Cleanup server
        if: always()
        shell: bash
        run: if test -f /tmp/p01-v231-action.pid; then kill "$(cat /tmp/p01-v231-action.pid)" >/dev/null 2>&1 || true; fi
