name: P01 L2 Link Health Center
on:
  push:
    branches: [release/p01-v2365-candidate-20260902]
    paths: [.github/workflows/p01-l2-link-health-center-20260902.yml]
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: release/p01-v2365-candidate-20260902
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: product/p01-link-health-center-20260902
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Fresh source fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = b9c69eedec17979d2897e85f40d11cabfe1199e2
          test "$(git -C product rev-parse origin/develop)" = b9c69eedec17979d2897e85f40d11cabfe1199e2
      - name: Apply product patch
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          python3 ../runner/scripts/p01_link_health_center_patch.py
      - name: Verify exact product contract
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          php -l src/app/AdminShell.php >/dev/null
          php -l src/health.php >/dev/null
          php -l src/duplicates.php >/dev/null
          git diff --check
          test "$(grep -F "['href'=>'health.php','label'=>'网址健康']" src/app/AdminShell.php | wc -l | tr -d ' ')" = 1
          ! grep -F "['href'=>'duplicates.php','label'=>'重复网址']" src/app/AdminShell.php >/dev/null
          grep -F 'class="vf-health-center-tabs"' src/health.php >/dev/null
          grep -F 'class="vf-health-center-tabs"' src/duplicates.php >/dev/null
          grep -F '连接与失效' src/health.php >/dev/null
          grep -F '重复清理' src/duplicates.php >/dev/null
          grep -F '不自动合并' src/duplicates.php >/dev/null
          test "$(git diff --name-only -- src/VERSION.txt VF_PROJECT.json database src/migrations | wc -l | tr -d ' ')" = 0
          git diff --name-only | sort | tee /tmp/changed.txt
          expected=$(printf '%s\n' src/app/AdminShell.php src/assets/admin-pages.css src/duplicates.php src/health.php | sort)
          test "$(cat /tmp/changed.txt)" = "$expected"
          echo 'LINK HEALTH CENTER PASS'
      - name: Commit and push candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add src/app/AdminShell.php src/assets/admin-pages.css src/duplicates.php src/health.php
          git commit -m 'feat(P01): unify link health and duplicate cleanup'
          git push origin HEAD:product/p01-link-health-center-20260902
          echo "CANDIDATE=$(git rev-parse HEAD)"
          echo "TREE=$(git rev-parse HEAD^{tree})"
