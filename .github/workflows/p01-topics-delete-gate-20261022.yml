name: P01 Topics Delete Gate (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-topics-delete-gate-20261022.yml'
permissions:
  contents: read
jobs:
  focused:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install PHP
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-gd php-zip >/dev/null
          php -m | grep -iq pdo_sqlite
      - name: Exact P01 source and deletion contract
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          trap 'rm -rf "$GITHUB_WORKSPACE/product"' EXIT
          git clone -q --depth 1 --branch main \
            "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" product
          test "$(git -C product rev-parse HEAD)" = "b0c25c301e0e81d215e84b29b6ecf1ed73cc8044"
          unset READ_TOKEN
          cd product
          php -l src/app/TopicLibraryPage.php
          php -l tests/gov_topic_pdo_integration.php
          php tests/gov_topic_remote_contract.php
          php tests/gov_topic_pdo_integration.php
          echo P01_TOPIC_DELETE_FOCUSED=PASS
