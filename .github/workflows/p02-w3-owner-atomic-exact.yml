name: P02 W3 Owner Atomic package and three-engine exact-source proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-w3-owner-atomic-exact.yml'
permissions:
  contents: read
concurrency:
  group: p02-w3-owner-atomic-one-off
  cancel-in-progress: false
jobs:
  source-security:
    if: github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.ref == 'proof/p02-w3-owner-atomic-exact-20261116'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      P02_SHA: 68fd789ce5ce57dcb1efc05de91c1c297abd3b58
    steps:
      - name: Fetch exact private P02 source into transient workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 68fd789ce5ce57dcb1efc05de91c1c297abd3b58
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p02-source
          fetch-depth: 1
      - name: Exact identity and PHP/Python security tests
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p02-source rev-parse HEAD)" = "$P02_SHA"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php-cli python3
          cd p02-source
          test "$(cat VERSION)" = "2.5.131"
          php -l modern/laravel/P02W3OfficialUpdateSource.php
          php -l modern/laravel/P02W3OwnerUpdateToken.php
          php -l modern/laravel/P02W3LaravelPortal.php
          php -l modern/laravel/P02W3UpdateSettingsView.php
          php -l modern/laravel/P02W3InstalledSiteEntry.php
          php -l modern/laravel/routes/web.php
          php -l tests/unit/p02_w3_official_update_source.php
          php tests/unit/p02_w3_official_update_source.php
          php -l modern/laravel/P02W3OwnerAtomicUpdate.php
          php -l modern/laravel/P02W3UpdateAssetDownloader.php
          php -l tests/unit/p02_w3_update_asset_downloader.php
          php tests/unit/p02_w3_update_asset_downloader.php
          python3 -B -m unittest discover -s tests/unit -p test_p02_w3_build_atomic_candidate.py -v
          php -l tests/integration/p02_w3_installed_atomic_rehearsal.php
          php tests/unit/p02_w3_installed_site_entry.php
          python3 -B -m unittest discover -s tests/unit -p test_p02_w3_laravel_portal_source.py -v
          python3 -B scripts/p02_w3_source_gate.py
          echo P02_W3_OFFICIAL_RELEASE_IDENTITY_OWNER_CSRF_SOURCE=PASS
          echo P02_W3_EXACT_SOURCE_SHA="$P02_SHA"
          echo P02_W3_LEGACY_CHANNEL_NOT_W3_ATOMIC=PASS
          echo P02_W3_RELEASE_PRODUCTION=NOT_AUTHORIZED
      - name: Clean transient private source
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if test -d p02-source; then rm -rf -- p02-source; fi
          test ! -e p02-source
          echo P02_W3_PRIVATE_SOURCE_NOT_PERSISTED=YES



  exact-architecture:
    if: github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.ref == 'proof/p02-w3-owner-atomic-exact-20261116'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact private W3 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 68fd789ce5ce57dcb1efc05de91c1c297abd3b58
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p02-source
          fetch-depth: 0
      - name: Checkout exact P02 main base into a separate private temp tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: a5ca0f94e46542adb9ffce5413a6007c913f8810
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p02-base
          fetch-depth: 1
      - name: Checkout current GOV-DOC architecture authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p02-gov
          fetch-depth: 1
      - name: Exact real base to head architecture and negative test
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p02-source rev-parse HEAD)" = "68fd789ce5ce57dcb1efc05de91c1c297abd3b58"
          test "$(git -C p02-base rev-parse HEAD)" = "a5ca0f94e46542adb9ffce5413a6007c913f8810"
          git -C p02-source fetch --no-tags ../p02-base HEAD
          git -C p02-source cat-file -e a5ca0f94e46542adb9ffce5413a6007c913f8810^{commit}
          cd p02-source
          python3 -B -m unittest discover -s .github/checks -p test_architecture_gate.py -v
          python3 -B .github/checks/architecture_gate.py \
            --manifest .github/checks/code_architecture.json \
            --gov-root ../p02-gov \
            --base-sha a5ca0f94e46542adb9ffce5413a6007c913f8810 \
            --head-sha 68fd789ce5ce57dcb1efc05de91c1c297abd3b58 \
            --git-root .
          echo P02_W3_REAL_GIT_DIFF_NAMING_LAYER_GATE=PASS
      - name: Clean all transient private repositories
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- p02-source p02-base p02-gov
          test ! -e p02-source && test ! -e p02-base && test ! -e p02-gov
          echo PRIVATE_REPOSITORIES_NOT_PERSISTED=YES

  native-three-engines:
    if: github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.ref == 'proof/p02-w3-owner-atomic-exact-20261116'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      P02_SHA: 68fd789ce5ce57dcb1efc05de91c1c297abd3b58
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: p02_w3_disposable_only
          MYSQL_ROOT_HOST: '%'
        ports: ['33306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=25
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: p02_w3_disposable_only
          MARIADB_ROOT_HOST: '%'
        ports: ['33307:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=25
    steps:
      - name: Checkout exact private P02 source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 68fd789ce5ce57dcb1efc05de91c1c297abd3b58
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p02-source
          fetch-depth: 1
      - name: Bootstrap native PHP Laravel and frontend
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p02-source rev-parse HEAD)" = "$P02_SHA"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php-cli php-sqlite3 php-mysql php-mbstring php-xml php-curl php-zip composer
          php -r 'exit(PHP_VERSION_ID>=80300 && extension_loaded("pdo_sqlite") && extension_loaded("pdo_mysql") ? 0 : 1);'
          cd p02-source
          composer --working-dir=modern/laravel install --no-dev --no-scripts --no-plugins --prefer-dist --no-interaction --no-progress
          npm ci --prefix modern/inertia-page --no-audit --no-fund
          npm run build --prefix modern/inertia-page
          test -s public/assets/w2d/inertia-material.js
          echo P02_W3_NATIVE_VENDOR_VUE=PASS
      - name: Genuine SQLite install and private token lifecycle
        shell: bash
        env:
          P02_W3_SYNTHETIC_ONLY: '1'
          P02_W3_TRUE_2401_CLI: '1'
          P02_W3_ENGINE: sqlite
        run: |
          set -Eeuo pipefail
          cd p02-source
          php tests/integration/p02_w3_cloudpanel_fresh_install.php
          php tests/integration/p02_w3_private_runtime_vault.php
          echo P02_W3_SQLITE_FRESH_INSTALL_TOKEN_BACKUP=PASS
      - name: Genuine MySQL clean install backup and Atomic rehearsal
        shell: bash
        env:
          P02_W3_SYNTHETIC_ONLY: '1'
          P02_W3_ENGINE: mysql
          P02_W3_USER: root
          P02_W3_PASS: p02_w3_disposable_only
          P02_W3_DSN: mysql:host=127.0.0.1;port=33306;dbname=p02_w3_mysql;charset=utf8mb4
        run: |
          set -Eeuo pipefail
          cd p02-source
          php tests/integration/p02_w3_cloudpanel_fresh_sql.php
          echo P02_W3_MYSQL_FRESH_INSTALL_TOKEN_BACKUP_ATOMIC=PASS
      - name: Genuine MariaDB clean install backup and Atomic rehearsal
        shell: bash
        env:
          P02_W3_SYNTHETIC_ONLY: '1'
          P02_W3_ENGINE: mariadb
          P02_W3_USER: root
          P02_W3_PASS: p02_w3_disposable_only
          P02_W3_DSN: mysql:host=127.0.0.1;port=33307;dbname=p02_w3_mariadb;charset=utf8mb4
        run: |
          set -Eeuo pipefail
          cd p02-source
          php tests/integration/p02_w3_cloudpanel_fresh_sql.php
          echo P02_W3_MARIADB_FRESH_INSTALL_TOKEN_BACKUP_ATOMIC=PASS
      - name: Clean transient private source
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if test -d p02-source; then rm -rf -- p02-source; fi
          test ! -e p02-source
          echo P02_W3_PRIVATE_SOURCE_NOT_PERSISTED=YES
