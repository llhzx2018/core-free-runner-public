name: S01-C02 1.21.917 R28 Pre-Merge Gate

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CANDIDATE_SHA: 860ba4479eeec83ff10331986154818dbe123dac
      BASE_SHA: 24738c23fa69dcbef49b60031046ed45df982eeb

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 860ba4479eeec83ff10331986154818dbe123dac
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: ops
          persist-credentials: false

      - name: Verify exact scope and R28
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(tr -d '\r\n' < ops/VERSION)" = "1.21.917"
          grep -Fq 'Version: 1.21.917' ops/vf-ops.php
          grep -Fq "VF_OPS_VERSION', '1.21.917'" ops/vf-ops.php
          grep -Fq 'S01-PAGE-FAMILY-DEEP-POLISH-R28' ops/vf-ops.php
          php ops/tests/s01-c02-121917-page-family-deep-polish-r28-contract.php
          php -l ops/vf-ops.php >/dev/null
          php -l ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php >/dev/null

          actual="$(git -C ops diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" | sort)"
          expected="$(printf '%s\n'             CHANGELOG.md             VERSION             assets/css/current/admin-s01-subpages-r28.css             includes/views/admin-style-helpers/admin-s01-uiux-polish.php             tests/s01-c02-121917-page-family-deep-polish-r28-contract.php             vf-ops.php | sort)"
          test "$actual" = "$expected"

          python3 - <<'PY'
          from pathlib import Path
          r28=Path('ops/assets/css/current/admin-s01-subpages-r28.css').read_text(encoding='utf-8')
          assert r28.count('{')==r28.count('}')
          required=[
            '.vf-content-manager-filters',
            '.vf-keyword-filters',
            '.vf-source-filters',
            '.vf-plugin-section',
            '.vf-recovery-section',
            '.vf-content-manager-row',
            '.vf-review-row',
            '.vf-content-manager-pagination',
            '.vf-source-pagination',
            '.vf-source-modal-card',
            '.vf-recovery-dialog-body',
            '.vf-content-manager-danger-actions .button',
            '.vf-recovery-danger-button',
          ]
          for needle in required:
              assert needle in r28, needle
          print('PASS_R28_PAGE_FAMILY_COVERAGE')
          PY

          test "$(git -C ops diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" -- database config includes/v6 includes/wp-update docs/authority includes/admin-v13/route-contract.php | wc -l)" = "0"
          echo PASS_S01_C02_121917_R28_PREMERGE
