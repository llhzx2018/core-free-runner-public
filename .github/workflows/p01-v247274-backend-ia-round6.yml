name: P01 V2.47.274 Backend IA Round 6 Proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p01-v247274-backend-ia-round6.yml"

permissions:
  contents: read

jobs:
  proof:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'proof(P01): V2.47.274 backend IA round 6')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout proof control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd nodejs >/dev/null

      - name: Clone exact candidate and baseline
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" candidate
          git -C candidate fetch -q origin a4fa4eb9b9b5e172f3032f5e74e07cbaeb8216a3
          git -C candidate checkout -q --detach a4fa4eb9b9b5e172f3032f5e74e07cbaeb8216a3
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.274"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "2.47.274"
          grep -F "define('VF_VERSION', '2.47.274');" candidate/src/app/bootstrap.php

          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" baseline
          git -C baseline fetch -q origin 7541bbf2ad2d3d06646f4fd101bf53727ee7f471
          git -C baseline checkout -q --detach 7541bbf2ad2d3d06646f4fd101bf53727ee7f471
          test "$(tr -d '\r\n ' < baseline/VERSION)" = "2.47.273"
          echo P01_V247274_EXACT_SOURCE=PASS

      - name: Syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l candidate/src/settings.php
          php -l candidate/src/update.php
          php -l candidate/src/browser-helper.php
          php -l candidate/tests/unit/backend_ia_round6_special_settings_v247274_contract.php
          node --check candidate/src/assets/settings-admin.js
          node --check candidate/src/assets/update-core.js
          node --check candidate/src/assets/browser-helper.js
          echo P01_V247274_SYNTAX=PASS

      - name: Focused Round 6 contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          tests=(
            tests/unit/backend_ia_round6_special_settings_v247274_contract.php
            tests/unit/admin_browser_helper_r15_contract.php
            tests/unit/admin_browser_helper_page11_polish_contract.php
            tests/unit/browser_helper_v17_contract.php
            tests/unit/browser_helper_distribution_contract.php
            tests/unit/admin_update_r26_contract.php
            tests/unit/admin_update_page12_polish_contract.php
            tests/unit/admin_update_public_copy_r72_contract.php
            tests/unit/admin_update_credential_r27_contract.php
            tests/unit/update_csrf_recovery_contract.php
            tests/unit/update_notice_no_obstruction_contract.php
            tests/unit/update_recovery_contract.php
            tests/unit/admin_settings_nav_r19_contract.php
            tests/unit/admin_settings_focus_contract.php
            tests/unit/admin_settings_page13_polish_contract.php
            tests/unit/admin_settings_retired_route_r58_contract.php
            tests/unit/browser_state_settings_r78_contract.php
            tests/unit/display_visibility_settings_r77_contract.php
            tests/unit/global_display_settings_authority_contract.php
          )
          for t in "${tests[@]}"; do php "$t"; done
          echo P01_V247274_FOCUSED=PASS

      - name: Canonical regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate baseline --require-zero-debt | tee /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/canonical.txt
          echo P01_V247274_CANONICAL=PASS

      - name: Bounded scope
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C candidate diff --name-only 7541bbf2ad2d3d06646f4fd101bf53727ee7f471..a4fa4eb9b9b5e172f3032f5e74e07cbaeb8216a3 | tee /tmp/changed.txt
          if grep -E '(^|/)(migrations|schema|auth|security|provider|server|install|setup)' /tmp/changed.txt; then
            echo "Unexpected high-risk scope"
            exit 1
          fi
          echo BACKEND_IA_ROUND6=YES
          echo FORMAL_RELEASE_CALLED=NO
          echo DISTRIBUTION_WRITE=NO
          echo PRODUCTION_WRITE=NO
