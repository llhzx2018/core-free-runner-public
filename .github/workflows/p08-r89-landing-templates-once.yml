name: P08 R89 Landing layout editor exact-source proof (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p08-r89-landing-templates-once.yml'
permissions:
  contents: read
jobs:
  p08-r89:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout public-safe test harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Transient checkout exact P08 private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-adops
          ref: a1c0917b24736b4dbe80b77750ae9409419b8665
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-p08-r89
      - name: Reject wrong SHA or installed Owner state
        run: |
          set -euo pipefail
          test "$(git -C private-p08-r89 rev-parse HEAD)" = a1c0917b24736b4dbe80b77750ae9409419b8665
          test "$(cat private-p08-r89/VERSION)" = 0.1.1
          test ! -e private-p08-r89/.env
          test ! -e private-p08-r89/storage/app/private/adops/installation/installed.json
          echo P08_R89_EXACT_SOURCE=PASS
      - name: PHP 8.4 and pinned Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: zip, mbstring, dom, fileinfo, pdo_sqlite, sqlite3, pdo_mysql, intl, sodium
      - name: Node 22 for locked Vue build
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Genuine Laravel and Vite locked build, typecheck and unit tests
        run: |
          set -euo pipefail
          cd private-p08-r89
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          composer install --no-interaction --no-progress --prefer-dist --no-scripts > "$RUNNER_TEMP/p08-r89-composer.log" 2>&1 || { tail -n 25 "$RUNNER_TEMP/p08-r89-composer.log"; exit 1; }
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-r89-npm.log" 2>&1 || { tail -n 25 "$RUNNER_TEMP/p08-r89-npm.log"; exit 1; }
          npm run build
          npm run typecheck
          npm run test:unit
          python3 scripts/check_stack_contract.py --phase foundation
          echo P08_R89_VUE_LOCKED_BUILD_AND_TYPES=PASS
      - name: PHP syntax, three static templates and real Laravel Owner revisions
        run: |
          set -euo pipefail
          cd private-p08-r89
          php -l src/Landing/LandingBuilder.php
          php -l app/Http/Controllers/LandingController.php
          php -l app/Modules/Landing/Actions/CreateLanding.php
          php -l tests/Feature/LandingHistoryPreviewTest.php
          php tests/run.php
          ./vendor/bin/phpunit --no-progress tests/Feature/LandingHistoryPreviewTest.php
          echo P08_R89_STATIC_LAYOUTS_OWNER_REVISION_SQLITE=PASS
      - name: Always delete private checkout and temporary output
        if: always()
        run: |
          rm -rf private-p08-r89
          rm -f "$RUNNER_TEMP/p08-r89-composer.log" "$RUNNER_TEMP/p08-r89-npm.log"
