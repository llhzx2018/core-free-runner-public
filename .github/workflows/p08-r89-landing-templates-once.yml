name: P08 R89 Landing layout editor exact-source proof (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p08-r89-landing-templates-once.yml'
permissions:
  contents: read
jobs:
  p08-r89:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout public-safe test harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Transient checkout exact P08 private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-adops
          ref: a1c0917b24736b4dbe80b77750ae9409419b8665
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-p08-r89
      - name: Reject wrong SHA or installed Owner state
        run: |
          set -euo pipefail
          test "$(git -C private-p08-r89 rev-parse HEAD)" = a1c0917b24736b4dbe80b77750ae9409419b8665
          test "$(cat private-p08-r89/VERSION)" = 0.1.1
          test ! -e private-p08-r89/.env
          test ! -e private-p08-r89/storage/app/private/adops/installation/installed.json
          echo P08_R89_EXACT_SOURCE=PASS
      - name: Transient canonical GOV-DOC checkout for mandatory FULL gates
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/gov-doc
          ref: f84c0d22769520cea1becccd9e277b9753cc3912
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov-doc-r89
      - name: PHP 8.4 and pinned Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: zip, mbstring, dom, fileinfo, pdo_sqlite, sqlite3, pdo_mysql, intl, sodium
      - name: Node 22 for locked Vue build
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Genuine Laravel and Vite locked build, typecheck and unit tests
        run: |
          set -euo pipefail
          cd private-p08-r89
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          composer install --no-interaction --no-progress --prefer-dist --no-scripts > "$RUNNER_TEMP/p08-r89-composer.log" 2>&1 || { tail -n 25 "$RUNNER_TEMP/p08-r89-composer.log"; exit 1; }
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-r89-npm.log" 2>&1 || { tail -n 25 "$RUNNER_TEMP/p08-r89-npm.log"; exit 1; }
          npm run build
          npm run typecheck
          npm run test:unit
          python3 scripts/check_stack_contract.py --phase foundation
          echo P08_R89_VUE_LOCKED_BUILD_AND_TYPES=PASS
      - name: PHP syntax, three static templates and real Laravel Owner revisions
        run: |
          set -euo pipefail
          cd private-p08-r89
          php -l src/Landing/LandingBuilder.php
          php -l app/Http/Controllers/LandingController.php
          php -l app/Modules/Landing/Actions/CreateLanding.php
          php -l tests/Feature/LandingHistoryPreviewTest.php
          php tests/run.php
          ./vendor/bin/phpunit --no-progress tests/Feature/LandingHistoryPreviewTest.php
          echo P08_R89_STATIC_LAYOUTS_OWNER_REVISION_SQLITE=PASS
      - name: Real isolated Chromium Owner template edit and restore
        run: |
          set -euo pipefail
          cd private-p08-r89
          site="$PWD"
          db="$RUNNER_TEMP/p08-r89-browser.sqlite"
          test ! -e "$site/.env"
          test ! -e "$db"
          touch "$db"
          chmod 0600 "$db"
          key="$(php -r 'echo base64_encode(random_bytes(32));')"
          cat > "$site/.env" <<EOF
          APP_NAME=R89_Isolated_Browser
          APP_ENV=testing
          APP_DEBUG=false
          APP_KEY=base64:$key
          APP_URL=http://127.0.0.1:18989
          APP_LOCALE=zh_CN
          DB_CONNECTION=sqlite
          DB_DATABASE=$db
          DB_FOREIGN_KEYS=true
          SESSION_DRIVER=database
          SESSION_ENCRYPT=true
          SESSION_SECURE_COOKIE=false
          CACHE_STORE=database
          QUEUE_CONNECTION=sync
          LOG_CHANNEL=stack
          EOF
          chmod 0600 "$site/.env"
          php artisan migrate --force --no-interaction >/dev/null
          php -r '
            require "vendor/autoload.php";
            $app=require "bootstrap/app.php";
            $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            Illuminate\Support\Facades\DB::table("users")->insert([
              "name"=>"Synthetic Owner", "email"=>"owner@isolated.example",
              "password"=>Illuminate\Support\Facades\Hash::make("Synthetic-SQLite-Owner-12345!"),
              "created_at"=>now(), "updated_at"=>now()
            ]);
            echo "P08_R89_SYNTHETIC_SQLITE_OWNER_FIXTURE=PASS\n";
          '
          # Synthetic Owner fixture must include the same sealed install
          # marker that public/index.php correctly requires for all /app URLs.
          mkdir -p "$site/storage/app/private/adops/installation"
          printf '%s\n' '{"status":"INSTALLED","project_id":"P08","database_driver":"sqlite","owner_id":1,"domain":"127.0.0.1"}' > "$site/storage/app/private/adops/installation/installed.json"
          chmod 0600 "$site/storage/app/private/adops/installation/installed.json"
          cat > "$RUNNER_TEMP/p08-r89-router.php" <<'PHP'
          <?php
          $site=(string)getenv('P08_R89_BROWSER_SITE');
          $path=parse_url((string)($_SERVER['REQUEST_URI']??''),PHP_URL_PATH);
          if (!is_string($path) || !str_starts_with($path,'/') || str_contains($path,'..')) {
              http_response_code(404); return true;
          }
          $public=$site.'/public';
          $candidate=$public.$path;
          if (is_file($candidate) && str_starts_with((string)realpath($candidate),$public.'/')) return false;
          require $public.'/index.php';
          PHP
          export P08_R89_BROWSER_SITE="$site"
          php -S 127.0.0.1:18989 -t "$site/public" "$RUNNER_TEMP/p08-r89-router.php" > "$RUNNER_TEMP/p08-r89-php.log" 2>&1 &
          server_pid="$!"
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:18989/login -o /dev/null; then break; fi
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:18989/login -o /dev/null
          npx playwright install chromium > "$RUNNER_TEMP/p08-r89-playwright.log" 2>&1 || { tail -n 25 "$RUNNER_TEMP/p08-r89-playwright.log"; exit 1; }
          P08_TEST_BASE_URL=http://127.0.0.1:18989 npx playwright test tests/e2e/owner-workspace.spec.ts --grep 'Owner login, Landing create' --workers=1
          echo P08_R89_CHROMIUM_EDITOR_TEMPLATE_FLOW=PASS
          kill "$server_pid" >/dev/null 2>&1 || true
          trap - EXIT
          rm -f "$site/.env" "$db" "$RUNNER_TEMP/p08-r89-router.php" "$RUNNER_TEMP/p08-r89-php.log" "$RUNNER_TEMP/p08-r89-playwright.log"
      - name: Always delete private checkout and temporary output
        if: always()
        run: |
          rm -rf private-p08-r89 gov-doc-r89
          rm -f "$RUNNER_TEMP/p08-r89-composer.log" "$RUNNER_TEMP/p08-r89-npm.log"\n          rm -rf "$RUNNER_TEMP/p08-r89-local-browser-site"\n          rm -f "$RUNNER_TEMP/p08-r89-local-browser-full.zip" "$RUNNER_TEMP/p08-r89-router.php" "$RUNNER_TEMP/p08-r89-local-build.json" "$RUNNER_TEMP/p08-r89-php.log" "$RUNNER_TEMP/p08-r89-playwright.log"
