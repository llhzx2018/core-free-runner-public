name: P03 V1.36.0 CSRF Harness Contract Patch
on:
  push:
    branches: [p03-v1360-runtime-integration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      EXPECTED_HEAD: c7d803a8200718e2106394b7fb2281f7fd668dfe
    steps:
      - name: Align only missing-CSRF expected status with existing product contract
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WRITE_TOKEN:-}"
          git clone --quiet --branch integration/v1.36.0-product-experience --single-branch "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/vf-forge.git" p03
          cd p03
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/integration/v1360_formal_runtime_gate.sh')
          s=p.read_text(encoding='utf-8')
          old='test "$NO_CSRF" = \'403\''
          new='test "$NO_CSRF" = \'419\''
          assert s.count(old)==1, 'CSRF_STATUS_ANCHOR_MISMATCH'
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          bash -n tests/integration/v1360_formal_runtime_gate.sh
          test "$(git status --short | wc -l)" -eq 1
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add tests/integration/v1360_formal_runtime_gate.sh
          git commit -m 'test(v1.36.0): align missing CSRF gate with 419 contract'
          git push origin HEAD:integration/v1.36.0-product-experience
          echo "PATCHED_HEAD=$(git rev-parse HEAD)"
