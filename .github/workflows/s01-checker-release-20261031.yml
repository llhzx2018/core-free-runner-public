name: S01 checker theme formal release
on:
  push:
    branches: [task/s01-checker-current-proof-20261031]
    paths: ['.github/workflows/s01-checker-release-20261031.yml']
permissions:
  actions: read
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 2c89b3ee3fa09a8bce43d9ef3c2f0d605eb2944d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
      - uses: actions/download-artifact@v4
        with:
          name: checker-lifecycle-41185270815
          run-id: 41185270815
          github-token: ${{ github.token }}
          path: tested
      - name: Match tested bytes, publish, and verify remote asset
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = 2c89b3ee3fa09a8bce43d9ef3c2f0d605eb2944d
          test "$(git -C target rev-parse 'HEAD^{tree}')" = 7682d3e4115b12f7f0f13a114426303cb4f6672c
          test "$(gh api repos/llhzx2018/vf-tools-theme/branches/main --jq .commit.sha)" = 2c89b3ee3fa09a8bce43d9ef3c2f0d605eb2944d
          test "$(cat target/VERSION)" = 1.35.222
          if gh release view v1.35.222 --repo llhzx2018/vf-tools-theme >/dev/null 2>&1; then echo RELEASE_EXISTS; exit 1; fi
          if gh api repos/llhzx2018/vf-tools-theme/git/ref/tags/v1.35.222 >/dev/null 2>&1; then echo TAG_EXISTS; exit 1; fi
          mkdir -p candidate verify
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,zipfile,io,json
          proof=json.loads(Path('tested/candidate-package-proof.json').read_text())
          assert proof['source']=='34e13cac53888a8eb4c1dbe6fcd36ef9a68c86fd'
          assert proof['sha256']=='51c547d67a37e376b9eaf01b1d6e65cefb6c607a9541a66d1a2736b8d849d154'
          src=Path('target/src');b=io.BytesIO()
          with zipfile.ZipFile(b,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
            for p in sorted(x for x in src.rglob('*') if x.is_file()):
              assert not p.is_symlink()
              q=zipfile.ZipInfo('vf-tools-theme/'+p.relative_to(src).as_posix(),date_time=(1980,1,1,0,0,0));q.compress_type=zipfile.ZIP_DEFLATED;q.external_attr=0o100644<<16
              z.writestr(q,p.read_bytes())
          data=b.getvalue()
          assert hashlib.sha256(data).hexdigest()==proof['sha256'] and len(data)==proof['bytes']
          Path('candidate/vf-tools-theme_V1.35.222.zip').write_bytes(data)
          PY
          cat > /tmp/release-notes <<'NOTES'
          播放列表检测页优化输入、结果和帮助层级，保留自定义内容及插件功能；修正中英文页面 SEO 绑定并保留编辑者描述。后台记录开发进度；正式站人工验收待手工升级。手机测试暂缓。
          NOTES
          gh release create v1.35.222 candidate/vf-tools-theme_V1.35.222.zip --repo llhzx2018/vf-tools-theme --target 2c89b3ee3fa09a8bce43d9ef3c2f0d605eb2944d --title 'VF Tools Theme V1.35.222' --notes-file /tmp/release-notes
          gh release download v1.35.222 --repo llhzx2018/vf-tools-theme --pattern vf-tools-theme_V1.35.222.zip --dir verify
          cmp candidate/vf-tools-theme_V1.35.222.zip verify/vf-tools-theme_V1.35.222.zip
          echo CHECKER_RELEASE_REMOTE_BYTES_PASS
