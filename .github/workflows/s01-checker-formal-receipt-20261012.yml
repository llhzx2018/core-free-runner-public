name: S01 immutable formal release receipt recovery
on:
  push:
    branches: [task/s01-checker-formal-receipt-20261012]
permissions:
  contents: read
  actions: read
jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_REPO: 'llhzx2018/vf-tools-theme'
      TARGET_SHA: '1592daff1bfe86d7d3aba2ea3d9d860d961d4a46'
      TARGET_VERSION: '1.35.109'
      TARGET_TREE: '3ff304ed7e02be49a3f0f52a651f149eabacb843'
      FORMAL_RUN: '38245214776'
      FORMAL_SHA: '82e02e4d44793aee0f0a435dbd2279c4f437c779'
      FORMAL_ARTIFACT: '11745070722'
      FORMAL_DIGEST: 'sha256:58120eb9e94ac453e3e3119369c92e1011e7accd18108bbbf18a5df590c97b59'
      THEME_MAIN: 'be09c071b9e6d102fc9d0f83200680fd2b8ee221'
      M3_MAIN: 'edad6b8842b5928b2170e1d2e11e9a93c9102b5d'
      M3_TREE: '8b072f430807a74b5ee27692873fef6dabd2f110'
      M3_VERSION: '1.25.85'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Verify exact reader spec
        run: |
          mkdir -p proof
          python3 runner/scripts/ephemeral_lane_spec.py render --spec runner/lanes/s01-checker-formal-receipt-20261012/spec.json --template runner/lanes/s01-checker-formal-receipt-20261012/reader.template.yml --output /tmp/reader.yml
          cmp /tmp/reader.yml runner/.github/workflows/s01-checker-formal-receipt-20261012.yml
          python3 runner/scripts/ephemeral_lane_spec.py audit-rendered --spec runner/lanes/s01-checker-formal-receipt-20261012/spec.json --input runner/.github/workflows/s01-checker-formal-receipt-20261012.yml > proof/lane-audit.json
      - name: Independently read immutable private assets and public receipt
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: python3 runner/lanes/s01-checker-formal-receipt-20261012/receipt-reader.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: success()
        with:
          name: s01-checker-formal-receipt-recovery-${{ github.run_id }}
          path: proof/*.json
          if-no-files-found: error

