name: P08 R168 controlled failed-prepare rescue PHP machine test
on:
  pull_request:
    paths:
      - .github/workflows/p08-r168-rescue-temp.yml
permissions:
  contents: read
jobs:
  r168-rootless-rescue:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: PHP 8.4 runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip,curl,openssl,sqlite3,pdo_sqlite,pdo_mysql,mbstring,posix
          coverage: none
      - name: Exact private P08 candidate checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 773206b81e95a3baf836355fb4faa46f475d196e
          token: \${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p08
          fetch-depth: 0
          persist-credentials: false
      - name: Governance authority checkout for architecture gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: f9577f976eef884d76058372f7701275b8324d42
          token: \${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: gov
          persist-credentials: false
      - name: Validate changed source gate, parser, future FULL, safe recovery negatives
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(id -u)" -ne 0
          test "$(git -C p08 rev-parse HEAD)" = 773206b81e95a3baf836355fb4faa46f475d196e
          test "$(cat p08/VERSION)" = 0.1.7
          python3 -B p08/.github/checks/architecture_gate.py \
            --manifest p08/.github/checks/code_architecture.json \
            --gov-root "$GITHUB_WORKSPACE/gov" \
            --base-sha dfe477e7dab2760d4bb9c5b6eefb9e6ec893a43a \
            --head-sha 773206b81e95a3baf836355fb4faa46f475d196e \
            --git-root p08 > /dev/null
          echo P08_R168_ARCHITECTURE_AND_NAMING=PASS
          php -l p08/scripts/owner-first-update-recovery.php
          php -l p08/src/Installation/CleanFullVersionedBootstrap.php
          php -l p08/tests/test_owner_first_update_recovery.php
          GITHUB_ACTIONS=true P08_R168_ISOLATED_TEST=YES php \
            p08/tests/test_owner_first_update_recovery.php
          echo P08_R168_PINNED_V015_FAIL_CLOSED_JOURNAL_MACHINE=PASS
      - name: Clean temporary private checkout
        if: always()
        shell: bash
        run: |
          rm -rf p08 gov
          test ! -e p08 && test ! -e gov
