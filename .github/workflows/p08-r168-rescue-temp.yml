name: P08 R168 controlled failed-prepare rescue PHP machine test
on:
  pull_request:
    paths:
      - .github/workflows/p08-r168-rescue-temp.yml
permissions:
  contents: read
jobs:
  r168-rootless-rescue:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: PHP 8.4 runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip,curl,openssl,sqlite3,pdo_sqlite,pdo_mysql,mbstring,posix
          coverage: none
      - name: Fetch exact private source archive using registered GitHub API token
        shell: bash
        env:
          GH_TOKEN: \${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          test "$(gh api repos/llhzx2018/vf-adops/commits/773206b81e95a3baf836355fb4faa46f475d196e --jq '.sha')" = 773206b81e95a3baf836355fb4faa46f475d196e
          gh api repos/llhzx2018/vf-adops/zipball/773206b81e95a3baf836355fb4faa46f475d196e > "$RUNNER_TEMP/p08-r168-source.zip"
          mkdir p08-source
          unzip -q "$RUNNER_TEMP/p08-r168-source.zip" -d p08-source
          test "$(find p08-source -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1
          mv "$(find p08-source -mindepth 1 -maxdepth 1 -type d | head -1)" p08
          rmdir p08-source
          echo P08_R168_EXACT_API_COMMIT_AND_SOURCE=PASS
      - name: Validate changed source gate, parser, future FULL, safe recovery negatives
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(id -u)" -ne 0
          test "$(cat p08/VERSION)" = 0.1.7
          echo P08_R168_GIT_DIFF_GATE=NOT_PROVEN_CHECKOUT_UNAVAILABLE
          php -l p08/scripts/owner-first-update-recovery.php
          php -l p08/src/Installation/CleanFullVersionedBootstrap.php
          php -l p08/tests/test_owner_first_update_recovery.php
          GITHUB_ACTIONS=true P08_R168_ISOLATED_TEST=YES php \
            p08/tests/test_owner_first_update_recovery.php
          echo P08_R168_PINNED_V015_FAIL_CLOSED_JOURNAL_MACHINE=PASS
      - name: Clean temporary private checkout
        if: always()
        shell: bash
        run: |
          rm -rf p08 p08-source "$RUNNER_TEMP/p08-r168-source.zip"
          test ! -e p08 && test ! -e p08-source
