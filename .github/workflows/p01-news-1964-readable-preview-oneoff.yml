name: P01 News PR1964 mixed-card masonry and URL-only RSS exact proof
on:
  push:
    branches:
      - task/p01-news-1964-readable-preview-20261110
permissions:
  contents: read
jobs:
  news1964:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      P01_EXACT_SHA: 0cf84d9db1c1efd61c2a314db339ee7f3539ed1d
      TARGET_VERSION: 2.47.514
      TARGET_SHA: 0cf84d9db1c1efd61c2a314db339ee7f3539ed1d
      TARGET_TREE: bfafa2642e54bbca1a66a49b8feb6c81b50305ca
      VF_NEWS_BROWSER_MODULE: /tmp/p01-news-1964-playwright
      PLAYWRIGHT_BROWSERS_PATH: /tmp/p01-news-1964-browsers
    steps:
      - name: Checkout registered Public Runner controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Audit bounded layout-only exact source identity
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/p01-news-1964-lane.json <<EOF
          {
            "schema": "vf-ephemeral-lane-spec/v1",
            "lane_id": "p01-news-1964-readable-preview",
            "project_id": "P01",
            "repository": "llhzx2018/vf-start",
            "target_version": "$TARGET_VERSION",
            "target_sha": "$TARGET_SHA",
            "target_tree": "$TARGET_TREE",
            "source_versions": [],
            "schema_version": "2026102201",
            "candidate_run": "$GITHUB_RUN_ID",
            "previous_lane": {},
            "extra": {}
          }
          EOF
          # Current-version UI-only source proof; no Atomic upgrade transition.
          python3 scripts/ephemeral_lane_spec.py validate --spec /tmp/p01-news-1964-lane.json
          python3 scripts/ephemeral_lane_spec.py audit-rendered --spec /tmp/p01-news-1964-lane.json --input .github/workflows/p01-news-1964-readable-preview-oneoff.yml
          echo P01_NEWS_1964_LANE_IDENTITY=PASS
      - name: Transient private exact-source P01 checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.P01_EXACT_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p01-exact
          persist-credentials: false
      - name: Verify exact source and syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p01-exact rev-parse HEAD)" = "$P01_EXACT_SHA"
          test "$(tr -d '\r\n ' < p01-exact/VERSION)" = 2.47.514
          # Public ubuntu-24.04 image often already includes PHP and Node.
          # Avoid slow/unbounded apt network when exact tools are available.
          if command -v php >/dev/null && command -v node >/dev/null && command -v npm >/dev/null && php -r 'exit(extension_loaded("pdo_sqlite") && extension_loaded("simplexml") ? 0 : 1);'; then
            echo P01_NEWS_1964_HOSTED_RUNTIME_READY=YES
          else
            timeout 75 sudo apt-get update -qq
            timeout 120 sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-xml php-mbstring php-zip php-gd unzip nodejs npm
          fi
          php -v
          node --version
          for file in p01-exact/src/app/NewsFeedNormalizer.php p01-exact/src/app/NewsFeedService.php p01-exact/src/app/NewsFeedPage.php p01-exact/src/app/NewsSourcePreferences.php p01-exact/src/news-feed.php p01-exact/tests/unit/p01_news_rss_first_reader_contract.php; do php -l "$file"; done
          for file in p01-exact/src/assets/news-feed.js p01-exact/src/assets/news-preferences.js p01-exact/tests/browser/p01_news_r4_chromium.cjs; do node --check "$file"; done
          echo P01_NEWS_1964_EXACT_SYNTAX=PASS
      - name: Run focused News PHP and JS contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          php p01-exact/tests/unit/p01_news_rss_first_reader_contract.php
          php p01-exact/tests/unit/p01_news_feed_service_contract.php
          php p01-exact/tests/unit/p01_news_feed_normalizer_contract.php
          php p01-exact/tests/unit/p01_news_source_preferences_contract.php
          php p01-exact/tests/unit/p01_news_release_surface_contract.php
          php p01-exact/tests/unit/p01_news_read_state_contract.php
          node p01-exact/tests/browser/p01_news_r5_navigation_contract.cjs
          echo P01_NEWS_1964_SCOPED_CONTRACTS=PASS
      - name: Native Owner Guest Chromium and responsive reading
        shell: bash
        timeout-minutes: 14
        run: |
          set -Eeuo pipefail
          mkdir -p "$VF_NEWS_BROWSER_MODULE" "$PLAYWRIGHT_BROWSERS_PATH"
          npm install --no-audit --no-fund --silent --prefix "$VF_NEWS_BROWSER_MODULE" playwright@1.56.1
          "$VF_NEWS_BROWSER_MODULE/node_modules/.bin/playwright" install chromium-headless-shell
          node p01-exact/tests/browser/p01_news_r4_chromium.cjs | tee /tmp/p01-news-1964-browser.log
          grep -E '^P01_NEWS_R4_CHROMIUM=PASS checks=[0-9]+$' /tmp/p01-news-1964-browser.log
          echo P01_NEWS_1964_CHROMIUM=PASS
      - name: Cleanup transient private checkout and browser files
        if: always()
        shell: bash
        run: |
          rm -rf p01-exact "$VF_NEWS_BROWSER_MODULE" "$PLAYWRIGHT_BROWSERS_PATH" /tmp/p01-news-1964-browser.log /tmp/p01-news-1964-lane.json
          echo P01_NEWS_1964_CLEANUP=YES
