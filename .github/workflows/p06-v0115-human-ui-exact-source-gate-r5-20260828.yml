name: P06 V0.1.15 Human UI Exact Source Gate R5

on:
  push:
    paths:
      - '.github/workflows/p06-v0115-human-ui-exact-source-gate-r5-20260828.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact P06 candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-press
          ref: 561e59a82f035e2622c4567710bec06a1c50dab3
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: p06
      - name: Prepare PHP runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y php-cli php-sqlite3 php-mbstring php-zip php-curl composer sqlite3 >/dev/null
          php -m | grep -Fxq PDO
          php -m | grep -Fxq pdo_sqlite
          php -m | grep -Fxq sqlite3
          php -m | grep -Fxq mbstring
          php -m | grep -Fxq zip
          php -m | grep -Fxq curl
      - name: Execute corrected formal exact-source contract
        shell: bash
        run: |
          set -Eeuo pipefail
          cp scripts/p06-v0115-exact-gate.sh "$RUNNER_TEMP/gate-r5.sh"
          python3 - "$RUNNER_TEMP/gate-r5.sh" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          old='PORT=19059\n'
          new='''HTTP_ROOT="$RUNNER_TEMP/p06-v0115-http-clean"\nexport VF_PRESS_STORAGE_PATH="$HTTP_ROOT/storage"\nexport VF_PRESS_DB_PATH="$HTTP_ROOT/storage/app.db"\nrm -rf "$HTTP_ROOT"\nmkdir -p "$HTTP_ROOT/storage" "$HTTP_ROOT/sessions"\nphp bin/migrate.php\nphp bin/create-owner.php\nROOT="$HTTP_ROOT"\nPORT="$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()')"\n'''
          assert old in s
          s=s.replace(old,new,1)
          old_time="grep -Fq '旧后台时间显示尚未全部' \"$ROOT/baseline\""
          new_time="grep -Fq '少量旧后台时间仍直接显示 UTC' \"$ROOT/baseline\""
          assert old_time in s
          s=s.replace(old_time,new_time,1)
          p.write_text(s)
          PY
          bash "$RUNNER_TEMP/gate-r5.sh" p06
