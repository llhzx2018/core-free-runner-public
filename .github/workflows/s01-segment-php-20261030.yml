name: S01 segment viewer scoped PHP proof
on:
  push:
    branches: [task/s01-segment-php-20261030]
    paths: ['.github/workflows/s01-segment-php-20261030.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 0919ef183cf24908379acb11210120d6c63000f3
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact change and PHP behavior
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 0919ef183cf24908379acb11210120d6c63000f3
          test "$(git diff --name-only 25f956f608b18f6c61ef73ca861b3a984f02b8c7 HEAD)" = src/inc/seo-flow/seo-flow-content.php
          php -l src/inc/seo-flow/seo-flow-content.php
          cat > /tmp/s01-segment-check.php <<'PHP'
          <?php
          define('ABSPATH', '/');
          $lang = 'en';
          function vf_theme_seo_route_key(array $context = []): string { return $context['route'] ?? ''; }
          function vf_theme_seo_context_family(array $context = []): string { return 'playlist'; }
          function vf_theme_seo_pick(array $en, array $zh): array { global $lang; return $lang === 'zh' ? $zh : $en; }
          require getcwd().'/src/inc/seo-flow/seo-flow-content.php';
          function check(bool $ok, string $message): void { if (!$ok) { throw new RuntimeException($message); } }
          foreach (['en','zh'] as $lang) {
            $ctx = ['route'=>'m3u8-segment-viewer'];
            $steps = vf_theme_seo_route_step_cards($ctx, 'tool');
            $faqs = vf_theme_seo_route_faq_items($ctx, 'tool');
            check(count($steps)===3 && count($faqs)===3, 'segment count '.$lang);
            $joined = json_encode([$steps,$faqs], JSON_UNESCAPED_UNICODE);
            check(strpos($joined, $lang==='en'?'media playlist':'媒体播放清单')!==false, 'segment content '.$lang);
            check(strpos($joined, $lang==='en'?'channel':'频道')===false, 'wrong IPTV content '.$lang);
            $iptv = ['route'=>'iptv-manager'];
            $other = json_encode([vf_theme_seo_route_step_cards($iptv,'tool'),vf_theme_seo_route_faq_items($iptv,'tool')],JSON_UNESCAPED_UNICODE);
            check(strpos($other,$lang==='en'?'channel':'频道')!==false, 'IPTV regression '.$lang);
            $outside = json_encode(vf_theme_seo_route_faq_items($ctx,'content'),JSON_UNESCAPED_UNICODE);
            check(strpos($outside,$lang==='en'?'channel':'频道')!==false, 'scope regression '.$lang);
          }
          echo "Bilingual route guidance and IPTV regression PASS\n";
          PHP
          php /tmp/s01-segment-check.php
