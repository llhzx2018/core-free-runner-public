name: P01 V2.47.269 Core Updates Exact Proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p01-v247269-core-updates-exact.yml"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout proof control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli jq >/dev/null

      - name: Clone exact core-updates candidate
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/core-updates.git" candidate
          git -C candidate fetch -q origin a67c7916c6fd15299e35c645b837626dffa0b754
          git -C candidate checkout -q --detach a67c7916c6fd15299e35c645b837626dffa0b754
          test "$(git -C candidate rev-parse HEAD)" = "a67c7916c6fd15299e35c645b837626dffa0b754"
          echo CORE_UPDATES_EXACT_SOURCE=PASS

      - name: Run canonical core-updates CI commands
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          echo CORE_UPDATES_CANONICAL_CI_EQUIVALENT=PASS

      - name: Verify P01 manifest exact release identity
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -e '
            .project_id=="P01" and
            .current_version=="2.47.268" and
            .target_version=="2.47.269" and
            .update_type=="ATOMIC" and
            .from_versions==["2.47.268"] and
            .schema_from=="2026090401" and
            .schema_to=="2026090401" and
            .repository=="llhzx2018/vf-start" and
            .release_tag=="v2.47.269" and
            .release_id==404596897 and
            .product_identity=="36fafaeb210b9f1e07f21e9b3659368ac0ac26a8" and
            .asset_name=="VF_Start_V2.47.269_UPDATE.zip" and
            .asset_bytes==2356518 and
            .asset_sha256=="db792667088cb81defa0113b8e62c8730afacec66bb26d175afc2c96e8c24d48" and
            .backup_required==true and
            .rollback_supported==true and
            .minimum_php=="8.0.0"
          ' candidate/projects/P01.json >/dev/null
          echo P01_V247269_MANIFEST_IDENTITY=PASS

      - name: Verify bounded distribution delta
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C candidate fetch -q origin main
          git -C candidate diff --name-only 6ca0287c089daa9f2f2064413fe7b0086fd8aa09..a67c7916c6fd15299e35c645b837626dffa0b754 | tee /tmp/changed.txt
          test "$(wc -l < /tmp/changed.txt | tr -d ' ')" = "1"
          grep -Fx 'projects/P01.json' /tmp/changed.txt
          echo CORE_UPDATES_BOUNDED_DELTA=PASS
          echo PRODUCTION_WRITE=NO
