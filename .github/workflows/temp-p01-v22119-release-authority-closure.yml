name: TEMP P01 V2.21.19 Release Authority Closure
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-p01-v22119-release-authority-closure.yml']
permissions:
  contents: write
jobs:
  closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Update private P01 release authority only
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$WRITE_TOKEN"
          git clone -q --branch candidate/v2.21.19-20260819 "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/vf-start.git" product
          git -C product config user.name VictorForge
          git -C product config user.email llhzx2018@gmail.com
          before_src=$(git -C product rev-parse HEAD:src)
          tmp=$(mktemp)
          jq '
            .status="V2.21.18 PRODUCTION / V2.21.19 RELEASED / OWNER PRODUCTION UPGRADE GATE" |
            .production_version="2.21.18" |
            .working_version="2.21.19" |
            .candidate_version="2.21.19" |
            .candidate_state="RELEASED / ONLINE DISCOVERY PASS / PRODUCTION UPGRADE NOT EXECUTED" |
            .current_phase="RELEASED / ONLINE DISCOVERY PASS / OWNER PRODUCTION UPGRADE GATE" |
            .current_authority="V2.21.19 FORMAL RELEASE + ONLINE DISCOVERY CLOSURE" |
            .current_state="PRODUCTION 2.21.18 / RELEASED LATEST 2.21.19 / AVAILABLE=true / CAN_UPDATE=true / OWNER UPGRADE REQUIRED" |
            .lifecycle="MAINTENANCE / PRODUCTION_UPGRADE_GATE" |
            .release_ready="RELEASED / ONLINE DISCOVERY PASS" |
            .formal_artifact_gate="PASS" |
            .release_authorization="AUTHORIZED / EXECUTED / PRODUCTION NOT AUTHORIZED" |
            .vf_release_executed=true |
            .formal_release_complete=true |
            .formal_tag_created=true |
            .publication_completed=true |
            .v2_21_19_release_closure={
              "product_commit":"2784d8de583b016e78887b707e12ed0e89489a7d",
              "product_tree":"64626d98737f1efdddd2230a636d7b13e6a36032",
              "source_version":"2.21.18",
              "target_version":"2.21.19",
              "schema":"2026080902 / UNCHANGED",
              "browser_helper":"1.6.4 / UNCHANGED",
              "formal_artifact_gate":"PASS",
              "formal_release":"PASS",
              "tag":"v2.21.19",
              "release_id":372928279,
              "released_at":"2026-08-19T09:27:29Z",
              "update_asset":"VF_Start_V2.21.19_UPDATE.zip",
              "update_bytes":1072258,
              "update_sha256":"ba8eec70c9fc08208aa66a2a7c091772d1b460ad4ed05984e6390d5f413a82b7",
              "full_asset":"VF_Start_V2.21.19_FULL.zip",
              "full_bytes":490884,
              "full_sha256":"b95781a5de1943f823ff4a8deb9095e4596718b2a3fe5bc9e4748cfb7a1d191f",
              "core_updates":"2.21.19 / VERIFIED",
              "online_discovery":"PASS / SOURCE-EXACT READ-ONLY",
              "online_discovery_run_id":32238393749,
              "production_public_http":"200",
              "available":true,
              "can_update":true,
              "authenticated_production_backend_status_observed":false,
              "update_prepare_called":false,
              "update_install_called":false,
              "production_changed":false,
              "production_upgrade":"NOT EXECUTED / OWNER GATE"
            }
          ' product/VF_PROJECT.json > "$tmp"
          mv "$tmp" product/VF_PROJECT.json
          cat > product/docs/evidence/V2.21.19_FORMAL_RELEASE_AND_DISCOVERY_20260819.md <<'EOF'
          # P01 · VF Start · V2.21.19 Formal Release + Online Discovery

          Status: PASS / RELEASED / PRODUCTION UPGRADE NOT EXECUTED

          ## Formal Release

          - Product Commit: `2784d8de583b016e78887b707e12ed0e89489a7d`
          - Product Tree: `64626d98737f1efdddd2230a636d7b13e6a36032`
          - Tag: `v2.21.19`
          - Release ID: `372928279`
          - Released At: `2026-08-19T09:27:29Z`
          - UPDATE: `VF_Start_V2.21.19_UPDATE.zip` / 1072258 bytes / `ba8eec70c9fc08208aa66a2a7c091772d1b460ad4ed05984e6390d5f413a82b7`
          - FULL: `VF_Start_V2.21.19_FULL.zip` / 490884 bytes / `b95781a5de1943f823ff4a8deb9095e4596718b2a3fe5bc9e4748cfb7a1d191f`
          - Formal Release Runner: `32237681075`

          ## core-updates

          P01 current online authority:

          - Source: `2.21.18`
          - Target: `2.21.19`
          - Update Type: `ATOMIC`
          - Schema: `2026080902 -> 2026080902`
          - Release: `v2.21.19`
          - Release ID: `372928279`
          - UPDATE asset identity: exact match with formal GitHub Release
          - Backup required: YES
          - Rollback supported: YES

          ## Production Online Discovery

          Runner: `32238393749`

          Read-only method:

          `EXACT V2.21.18 PRODUCTION SOURCE + LIVE core-updates + LIVE GitHub Release`

          Result:

          - Production public GET: HTTP 200
          - Current Version: `2.21.18`
          - Latest Version: `2.21.19`
          - `available=true`
          - `can_update=true`
          - Credential: PASS
          - cURL: PASS
          - ZipArchive: PASS
          - Source Allowed: PASS
          - Schema: PASS
          - Reason: `可直接更新到 V2.21.19。`
          - `update_prepare`: NOT CALLED
          - `update_install`: NOT CALLED
          - Production changed: NO

          The authenticated Production backend `update_status` endpoint was not called because no administrator session was exposed to Runner. The exact source currently representing V2.21.18 Production executed its real `VfUpdateManager::check(true)` against live authority and returned `available=true / can_update=true`.

          ## Boundary

          Production remains V2.21.18. `main` must remain V2.21.18 Production Truth until OWNER authorizes the real Production upgrade and the upgrade is successfully read back.
          EOF
          sed -i 's/^          //' product/docs/evidence/V2.21.19_FORMAL_RELEASE_AND_DISCOVERY_20260819.md
          jq empty product/VF_PROJECT.json
          git -C product add VF_PROJECT.json docs/evidence/V2.21.19_FORMAL_RELEASE_AND_DISCOVERY_20260819.md
          git -C product commit -q -m 'docs(P01): record V2.21.19 formal release and discovery closure'
          after_src=$(git -C product rev-parse HEAD:src)
          test "$before_src" = "$after_src"
          git -C product push -q origin HEAD:candidate/v2.21.19-20260819
          git -C product rev-parse HEAD >/tmp/closure-sha
          printf '%s' "$before_src" >/tmp/src-tree
      - name: Publish closure evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          sha=$(cat /tmp/closure-sha);src=$(cat /tmp/src-tree)
          python3 - "$sha" "$src" <<'PY'
          import json,os,sys
          q={'schema':'vf-public-runner-result/v1','project_id':'P01','gate':'RELEASE_AUTHORITY_CLOSURE','status':'SUCCESS','pass':True,'target_version':'2.21.19','authority_commit':sys.argv[1],'src_tree_before_after':sys.argv[2],'runtime_source_changed':False,'formal_release':'PASS','core_updates':'PASS','online_discovery':'PASS','available':True,'can_update':True,'production_version':'2.21.18','production_upgrade_executed':False,'main_changed':False,'workflow_run_id':os.environ['GITHUB_RUN_ID']}
          open('/tmp/evidence.json','w').write(json.dumps(q,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          PY
          git clone -q --depth 1 --branch vf-agent-operations-v1 "https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/core-free-runner-public.git" out
          mkdir -p out/vf-agent/results;cp /tmp/evidence.json out/vf-agent/results/P01-V2.21.19-RELEASE-AUTHORITY-CLOSURE.json
          git -C out config user.name VictorForge;git -C out config user.email llhzx2018@gmail.com
          git -C out add vf-agent/results/P01-V2.21.19-RELEASE-AUTHORITY-CLOSURE.json
          git -C out commit -q -m 'evidence(P01): close V2.21.19 release authority'
          git -C out push -q origin HEAD:vf-agent-operations-v1
