name: P01 iyf mview canonical diagnostic
on:
  push:
    branches:
      - diag/p01-iyf-mview-canonical-20260902
    paths:
      - .github/workflows/p01-iyf-mview-canonical-20260902.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe mview and www with same token
        shell: bash
        run: |
          set -Eeuo pipefail
          TOKEN='27Qr2mVwuzJ'
          for BASE in 'https://mview.iyf.tv/play/' 'https://www.iyf.tv/play/'; do
            URL="${BASE}${TOKEN}"
            echo "=== ${URL} ==="
            curl -L --fail --silent --show-error --connect-timeout 5 --max-time 15 \
              -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36' \
              -H 'Accept-Language: zh-CN,zh;q=0.8,en;q=0.5' \
              -D /tmp/h.txt -o /tmp/b.html "$URL"
            printf 'BYTES='; wc -c < /tmp/b.html
            printf 'FINAL='; curl -L --silent --output /dev/null --write-out '%{url_effective}\n' "$URL"
            printf 'OG='; grep -oiE '<meta[^>]+(?:property|name)=["'"']og:image["'"'][^>]+>' /tmp/b.html | head -1 || true
            printf 'OG_COUNT='; grep -oiE '<meta[^>]+(?:property|name)=["'"']og:image["'"'][^>]+>' /tmp/b.html | wc -l
            printf 'TITLE='; grep -oiE '<title[^>]*>[^<]+' /tmp/b.html | head -1 || true
          done
          echo 'P01_IYF_MVIEW_CANONICAL_DIAGNOSTIC=COMPLETE'
