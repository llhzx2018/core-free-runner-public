name: TEMP P01 Post V2.21.20 Readback
on:
  push:
    branches: [vf-agent-operations-v1]
    paths: ['.github/workflows/temp-p01-post22120-readback.yml']
permissions:
  contents: write
jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read Production public runtime only
        shell: bash
        run: |
          set -Eeuo pipefail
          code=$(curl -LsS -o /tmp/home -w '%{http_code}' --max-time 20 https://start.kewaro.com/)
          test "$code" = 200
          python3 - <<'PY'
          import re,json
          s=open('/tmp/home',encoding='utf-8',errors='replace').read()
          m=re.findall(r'VF Start\s*·\s*V(2\.21\.\d+)',s)
          if not m:
              m=re.findall(r'(?i)(?:V|version[^0-9]{0,8})(2\.21\.\d+)',s)
          v=m[-1] if m else ''
          if v!='2.21.20': raise SystemExit('Production version='+repr(v))
          json.dump({'schema':'vf-public-runner-result/v1','project_id':'P01','gate':'PRODUCTION_POST_22120_READBACK','status':'SUCCESS','pass':True,'production_version':v,'production_http_status':200,'production_write_executed':False,'private_data_used':False},open('/tmp/e.json','w'),indent=2)
          PY
      - name: Publish evidence
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone -q --depth 1 --branch vf-agent-operations-v1 https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/core-free-runner-public.git out
          mkdir -p out/vf-agent/results
          cp /tmp/e.json out/vf-agent/results/P01-PRODUCTION-POST-V2.21.20-READBACK.json
          git -C out config user.name VictorForge
          git -C out config user.email llhzx2018@gmail.com
          git -C out add vf-agent/results/P01-PRODUCTION-POST-V2.21.20-READBACK.json
          git -C out commit -q -m 'evidence(P01): confirm Production V2.21.20 readback'
          git -C out pull -q --rebase origin vf-agent-operations-v1
          git -C out push -q origin HEAD:vf-agent-operations-v1
