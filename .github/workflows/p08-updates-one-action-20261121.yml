name: P08 update page 7-state real Chromium UX development gate
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p08-updates-one-action-20261121.yml
      - tests/p08_owner_one_action_ux_browser.mjs
permissions:
  contents: read
jobs:
  p08-one-action-browser:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-updates-one-action-20261121' && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout public ephemeral safe harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exactly authorized private P08 dev source, no persisted credential
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: ac1fbfb7997f6dfb9f8effdb66490c6c00e6ccc4
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p08-private
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Real Vue typecheck, targeted + full Vitest, Vite build
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p08-private rev-parse HEAD)" = ac1fbfb7997f6dfb9f8effdb66490c6c00e6ccc4
          test "$(cat p08-private/VERSION)" = 0.1.14
          cd p08-private
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npx vitest run tests/js/future-update-check-feedback.test.ts --reporter=dot
          npm run test:unit
          npm run build
          git diff --exit-code
          echo P08_UX_ONE_ACTION_TYPES_VITEST_BUILD=PASS
      - name: Real Chromium 390 768 1440 one-action and status scenario tests
        shell: bash
        run: |
          set -Eeuo pipefail
          ( cd p08-private && npx playwright install --with-deps chromium )
          cp tests/p08_owner_one_action_ux_browser.mjs p08-private/p08-owner-one-action-ux.test.mjs
          ( cd p08-private && node p08-owner-one-action-ux.test.mjs )
          rm -f p08-private/p08-owner-one-action-ux.test.mjs
          test "$(git -C p08-private rev-parse HEAD)" = ac1fbfb7997f6dfb9f8effdb66490c6c00e6ccc4
          git -C p08-private diff --exit-code
          echo P08_UX_ONE_ACTION_REAL_CHROMIUM_ALL_SCENARIOS=PASS
      - name: Final no passive install/HTTP mutation source guard
        shell: bash
        run: |
          set -Eeuo pipefail
          p=p08-private/resources/js/modules/updates/FutureOwnerUpdatePanel.vue
          grep -Fq 'updates-next-action--idle' "$p"
          grep -Fq 'updates-next-action--available' "$p"
          grep -Fq 'updates-next-action--warning' "$p"
          grep -Fq 'updates-next-action--danger' "$p"
          grep -Fq "api('one-click', true)" "$p"
          ! grep -Fq 'void oneClick()' "$p"
          ! grep -Fq 'onMounted(() => { void check()' "$p"
          test "$(cat p08-private/VERSION)" = 0.1.14
          echo P08_UX_ONE_ACTION_NO_AUTO_APPLY_NO_VERSION_BUMP=PASS
      - name: Remove private source and all ephemeral browser bits
        if: always()
        shell: bash
        run: |
          rm -rf -- p08-private
          test ! -e p08-private
          echo P08_UX_ONE_ACTION_PRIVATE_CLEANUP=PASS
