name: P01 V2.22.0 Publication

on:
  push:
    branches:
      - task/p01-v222-multi-surface-gate-20260828
    paths:
      - '.github/workflows/p01-v222-publication-20260828.yml'

permissions:
  contents: read

env:
  PRODUCT_REPO: llhzx2018/vf-start
  UPDATES_REPO: llhzx2018/core-updates
  RUNNER_REPO: llhzx2018/core-free-runner-public
  RUNNER_BRANCH: task/p01-v222-multi-surface-gate-20260828
  MAIN_COMMIT: 591efb7b1b15602fd9ce3c9a9a4c4620f29f33a9
  CANDIDATE: 2c159b4b7ecfc03e79eff2e6103f7e2c768ded08
  CANDIDATE_TREE: 9116fe6cfc24d9a5a0a7070fb6af3f31bb079392
  SOURCE_COMMIT: 6bc09cd152210183972dcb3f2c361eb65a4cadab
  VERSION: 2.22.0
  SOURCE_VERSION: 2.21.25
  SCHEMA: '2026082801'
  SOURCE_SCHEMA: '2026080902'
  TAG: v2.22.0
  RELEASE_GATE_RUN_ID: '33142464120'
  ARTIFACT_GATE_RUN_ID: '33142761396'
  ARTIFACT_GATE_HEAD: e7d559bc722586ecde2c7ab1a209886cf445956c
  ARTIFACT_ID: '9674573277'

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Exact main and release source readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          rm -rf product
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/${PRODUCT_REPO}.git" product
          test "$(git -C product rev-parse origin/main)" = "$MAIN_COMMIT"
          test "$(git -C product rev-parse "$MAIN_COMMIT^{tree}")" = "$CANDIDATE_TREE"
          git -C product cat-file -e "$CANDIDATE^{commit}"
          test "$(git -C product rev-parse "$CANDIDATE^{tree}")" = "$CANDIDATE_TREE"
          git -C product merge-base --is-ancestor "$CANDIDATE" "$MAIN_COMMIT"
          test "$(tr -d '\r\n' < <(git -C product show "$CANDIDATE:VERSION"))" = "$VERSION"
          test "$(tr -d '\r\n' < <(git -C product show "$CANDIDATE:src/VERSION.txt"))" = "$VERSION"
          python3 - <<'PY'
          import json,subprocess
          raw=subprocess.check_output(['git','-C','product','show','2c159b4b7ecfc03e79eff2e6103f7e2c768ded08:VF_PROJECT.json'])
          x=json.loads(raw)
          assert x['production_version']=='2.21.25',x
          assert x['working_version']=='2.22.0',x
          assert x['candidate_version']=='2.22.0',x
          assert str(x['candidate_schema_version'])=='2026082801',x
          assert x['component_versions']['browser_helper']=='1.6.4',x
          PY
          echo P01_V222_PUBLICATION_SOURCE_FENCE=PASS

      - name: Fetch exact PASS artifact and verify bytes
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/${RUNNER_REPO}/actions/runs/${RELEASE_GATE_RUN_ID}" >/tmp/p01-v222-release-gate.json
          test "$(jq -r '.status' /tmp/p01-v222-release-gate.json)" = completed
          test "$(jq -r '.conclusion' /tmp/p01-v222-release-gate.json)" = success
          gh api "repos/${RUNNER_REPO}/actions/runs/${ARTIFACT_GATE_RUN_ID}" >/tmp/p01-v222-artifact-gate.json
          test "$(jq -r '.status' /tmp/p01-v222-artifact-gate.json)" = completed
          test "$(jq -r '.conclusion' /tmp/p01-v222-artifact-gate.json)" = success
          test "$(jq -r '.head_sha' /tmp/p01-v222-artifact-gate.json)" = "$ARTIFACT_GATE_HEAD"
          gh api "repos/${RUNNER_REPO}/actions/artifacts/${ARTIFACT_ID}" >/tmp/p01-v222-artifact-meta.json
          test "$(jq -r '.name' /tmp/p01-v222-artifact-meta.json)" = 'P01-V2.22.0-FORMAL-ARTIFACTS'
          test "$(jq -r '.expired' /tmp/p01-v222-artifact-meta.json)" = false
          rm -rf /tmp/p01-v222-release /tmp/p01-v222-artifact.zip
          mkdir -p /tmp/p01-v222-release
          gh api --method GET "repos/${RUNNER_REPO}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/p01-v222-artifact.zip
          unzip -q /tmp/p01-v222-artifact.zip -d /tmp/p01-v222-release
          FULL="$(find /tmp/p01-v222-release -type f -name 'VF-Start-V2.22.0-FULL.zip' -print -quit)"
          UPDATE="$(find /tmp/p01-v222-release -type f -name 'VF-Start-V2.22.0-UPDATE.zip' -print -quit)"
          LEGACY="$(find /tmp/p01-v222-release -type f -name 'VF_Start_V2.22.0_UPDATE.zip' -print -quit)"
          REPAIR="$(find /tmp/p01-v222-release -type f -name 'server-update-v2.22.0-repair.php' -print -quit)"
          RESULT="$(find /tmp/p01-v222-release -type f -name 'P01-V2.22.0-ARTIFACT-GATE.json' -print -quit)"
          SUMS="$(find /tmp/p01-v222-release -type f -name 'SHA256SUMS.txt' -print -quit)"
          for f in "$FULL" "$UPDATE" "$LEGACY" "$REPAIR" "$RESULT" "$SUMS"; do test -f "$f"; done
          FULL_SHA="$(sha256sum "$FULL"|awk '{print $1}')"; UPDATE_SHA="$(sha256sum "$UPDATE"|awk '{print $1}')"; LEGACY_SHA="$(sha256sum "$LEGACY"|awk '{print $1}')"; REPAIR_SHA="$(sha256sum "$REPAIR"|awk '{print $1}')"
          test "$UPDATE_SHA" = "$LEGACY_SHA"
          jq -e --arg c "$CANDIDATE" --arg t "$CANDIDATE_TREE" --arg s "$SOURCE_COMMIT" '.status=="BUILD_PASS" and .version=="2.22.0" and .source_version=="2.21.25" and .candidate==$c and .candidate_tree==$t and .source_commit==$s and .source_schema=="2026080902" and .schema=="2026082801" and .schema_aware_atomic_update==true and .post_migration_rollback_injection==true' "$RESULT" >/dev/null
          FULL_BYTES="$(stat -c %s "$FULL")"; UPDATE_BYTES="$(stat -c %s "$UPDATE")"; LEGACY_BYTES="$(stat -c %s "$LEGACY")"; REPAIR_BYTES="$(stat -c %s "$REPAIR")"
          printf 'FULL_PATH=%s\nUPDATE_PATH=%s\nLEGACY_PATH=%s\nREPAIR_PATH=%s\nRESULT_PATH=%s\nSUMS_PATH=%s\nFULL_SHA=%s\nUPDATE_SHA=%s\nLEGACY_SHA=%s\nREPAIR_SHA=%s\nFULL_BYTES=%s\nUPDATE_BYTES=%s\nLEGACY_BYTES=%s\nREPAIR_BYTES=%s\n' "$FULL" "$UPDATE" "$LEGACY" "$REPAIR" "$RESULT" "$SUMS" "$FULL_SHA" "$UPDATE_SHA" "$LEGACY_SHA" "$REPAIR_SHA" "$FULL_BYTES" "$UPDATE_BYTES" "$LEGACY_BYTES" "$REPAIR_BYTES" >> "$GITHUB_ENV"
          echo P01_V222_EXACT_PASS_ARTIFACTS=PASS

      - name: Create exact tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh api "repos/${PRODUCT_REPO}/git/ref/tags/${TAG}" >/tmp/p01-v222-tag.json 2>/dev/null; then
            test "$(jq -r '.object.sha' /tmp/p01-v222-tag.json)" = "$CANDIDATE"
          else
            gh api --method POST "repos/${PRODUCT_REPO}/git/refs" -f ref="refs/tags/${TAG}" -f sha="$CANDIDATE" >/tmp/p01-v222-tag.json
            test "$(jq -r '.object.sha' /tmp/p01-v222-tag.json)" = "$CANDIDATE"
          fi
          cat >/tmp/p01-v222-notes.md <<'EOF'
          VF Start V2.22.0 正式发布 Multi-Surface：在同一个 P01 / 同一个 SQLite 数据权威上新增 Start、Channels、Watch 三个并行使用面。

          - Start：保留现有网址导航与 `/` 行为。
          - Channels：长期保存 YouTube / 创作者 / Podcast 等内容源，并支持反算法重发现。
          - Watch：电影、剧集、纪录片与视听内容索引；不是播放器或媒体服务器。
          - 旧网址不自动改分类；无 Surface Profile 的历史网址继续属于 Start。
          - Schema：2026080902 → 2026082801，新增稀疏 `resource_surface_profiles`。
          - Atomic UPDATE 已验证真实 V2.21.25 数据保留升级、幂等、SQLite/FK、以及 Migration 完成后的故障回滚。
          - Browser Helper 继续保持 1.6.4，本轮不做机械版本升级。
          - Release Exact Source Gate：33142464120 PASS。
          - Formal Artifact Gate V2：33142761396 PASS。
          - Main Promotion Gate：33142818275 PASS。
          - 本 Release 完成正式发布；实际服务器 Production Runtime 升级仍由 VF Start 后台更新流程执行。
          EOF
          if gh release view "$TAG" --repo "$PRODUCT_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FULL_PATH" "$UPDATE_PATH" "$LEGACY_PATH" "$REPAIR_PATH" "$RESULT_PATH" "$SUMS_PATH" --repo "$PRODUCT_REPO" --clobber
          else
            gh release create "$TAG" "$FULL_PATH" "$UPDATE_PATH" "$LEGACY_PATH" "$REPAIR_PATH" "$RESULT_PATH" "$SUMS_PATH" --repo "$PRODUCT_REPO" --title 'VF Start V2.22.0 · Multi-Surface' --notes-file /tmp/p01-v222-notes.md --verify-tag
          fi
          gh api "repos/${PRODUCT_REPO}/releases/tags/${TAG}" >/tmp/p01-v222-release.json
          RELEASE_ID="$(jq -r '.id' /tmp/p01-v222-release.json)"; RELEASED_AT="$(jq -r '.published_at' /tmp/p01-v222-release.json)"
          test "$(jq -r '.draft' /tmp/p01-v222-release.json)" = false; test "$(jq -r '.prerelease' /tmp/p01-v222-release.json)" = false
          for spec in "VF-Start-V2.22.0-FULL.zip:$FULL_BYTES" "VF-Start-V2.22.0-UPDATE.zip:$UPDATE_BYTES" "VF_Start_V2.22.0_UPDATE.zip:$LEGACY_BYTES" "server-update-v2.22.0-repair.php:$REPAIR_BYTES"; do n="${spec%%:*}"; b="${spec##*:}"; test "$(jq -r --arg n "$n" '.assets[]|select(.name==$n)|.size' /tmp/p01-v222-release.json)" = "$b"; done
          printf 'RELEASE_ID=%s\nRELEASED_AT=%s\n' "$RELEASE_ID" "$RELEASED_AT" >> "$GITHUB_ENV"
          echo P01_V222_GITHUB_RELEASE=PASS

      - name: Remote release asset byte readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-v222-remote && mkdir -p /tmp/p01-v222-remote
          gh release download "$TAG" --repo "$PRODUCT_REPO" --dir /tmp/p01-v222-remote --pattern 'VF-Start-V2.22.0-FULL.zip' --pattern 'VF-Start-V2.22.0-UPDATE.zip' --pattern 'VF_Start_V2.22.0_UPDATE.zip' --pattern 'server-update-v2.22.0-repair.php' --pattern 'P01-V2.22.0-ARTIFACT-GATE.json' --pattern 'SHA256SUMS.txt'
          test "$(sha256sum /tmp/p01-v222-remote/VF-Start-V2.22.0-FULL.zip|awk '{print $1}')" = "$FULL_SHA"
          test "$(sha256sum /tmp/p01-v222-remote/VF-Start-V2.22.0-UPDATE.zip|awk '{print $1}')" = "$UPDATE_SHA"
          test "$(sha256sum /tmp/p01-v222-remote/VF_Start_V2.22.0_UPDATE.zip|awk '{print $1}')" = "$LEGACY_SHA"
          test "$(sha256sum /tmp/p01-v222-remote/server-update-v2.22.0-repair.php|awk '{print $1}')" = "$REPAIR_SHA"
          jq -e '.status=="BUILD_PASS" and .schema_aware_atomic_update==true' /tmp/p01-v222-remote/P01-V2.22.0-ARTIFACT-GATE.json >/dev/null
          echo P01_V222_REMOTE_RELEASE_ASSETS=PASS

      - name: Publish core-updates P01 channel
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf updates
          git clone -q --depth 1 --branch main "https://x-access-token:${WRITE_TOKEN}@github.com/${UPDATES_REPO}.git" updates
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          p=Path('updates/projects/P01.json'); d=json.loads(p.read_text(encoding='utf-8'))
          if str(d.get('target_version')) not in {'2.21.25','2.22.0'}: raise SystemExit('unexpected current P01 update target')
          d.update({
            'target_version':'2.22.0','update_type':'ATOMIC','from_versions':['2.21.25'],
            'schema_from':'2026080902','schema_to':'2026082801','repository':'llhzx2018/vf-start','release_tag':'v2.22.0',
            'asset_name':'VF_Start_V2.22.0_UPDATE.zip','asset_bytes':int(os.environ['LEGACY_BYTES']),'asset_sha256':os.environ['LEGACY_SHA'],
            'release_id':int(os.environ['RELEASE_ID']),'release_identity':'v2.22.0@2c159b4b7ecfc03e79eff2e6103f7e2c768ded08',
            'backup_required':True,'rollback_supported':True,'released_at':os.environ['RELEASED_AT'],'minimum_php':'8.0.0'
          })
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8',newline='\n')
          PY
          git -C updates config user.name VictorForge; git -C updates config user.email llhzx2018@gmail.com
          git -C updates add projects/P01.json
          if ! git -C updates diff --cached --quiet; then git -C updates commit -m 'release(P01): publish VF Start V2.22.0 update channel'; fi
          for i in 1 2 3; do if git -C updates push origin main; then break; fi; git -C updates pull --rebase origin main; test "$i" -lt 3; done
          git -C updates pull --ff-only origin main
          jq -e --arg sha "$LEGACY_SHA" --argjson bytes "$LEGACY_BYTES" --argjson rid "$RELEASE_ID" '.target_version=="2.22.0" and .from_versions==["2.21.25"] and .schema_from=="2026080902" and .schema_to=="2026082801" and .release_tag=="v2.22.0" and .asset_name=="VF_Start_V2.22.0_UPDATE.zip" and .asset_bytes==$bytes and .asset_sha256==$sha and .release_id==$rid and .release_identity=="v2.22.0@2c159b4b7ecfc03e79eff2e6103f7e2c768ded08"' updates/projects/P01.json >/dev/null
          CORE_UPDATES_COMMIT="$(git -C updates rev-parse HEAD)"; echo CORE_UPDATES_COMMIT="$CORE_UPDATES_COMMIT" >> "$GITHUB_ENV"
          echo P01_V222_CORE_UPDATES=PASS

      - name: Persist publication evidence
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf evidence
          git clone -q --depth 1 --branch "$RUNNER_BRANCH" "https://x-access-token:${WRITE_TOKEN}@github.com/${RUNNER_REPO}.git" evidence
          mkdir -p evidence/vf-agent/results
          jq -n --argjson release_id "$RELEASE_ID" --arg released_at "$RELEASED_AT" --arg core_updates_commit "$CORE_UPDATES_COMMIT" --arg full_sha "$FULL_SHA" --arg update_sha "$UPDATE_SHA" --arg legacy_sha "$LEGACY_SHA" --arg repair_sha "$REPAIR_SHA" '{schema:"vf-public-runner-result/v1",project_id:"P01",gate:"V2.22.0_FORMAL_RELEASE",status:"PASS",release_source:"2c159b4b7ecfc03e79eff2e6103f7e2c768ded08",main_commit:"591efb7b1b15602fd9ce3c9a9a4c4620f29f33a9",tag:"v2.22.0",release_id:$release_id,released_at:$released_at,schema_version:"2026082801",source_schema_version:"2026080902",artifact_gate_run:33142761396,release_exact_source_gate:33142464120,main_promotion_gate:33142818275,full_sha256:$full_sha,update_sha256:$update_sha,legacy_update_sha256:$legacy_sha,repair_sha256:$repair_sha,core_updates_commit:$core_updates_commit,production_upgrade_executed:false}' > evidence/vf-agent/results/P01-V2.22.0-FORMAL-RELEASE.json
          git -C evidence config user.name VictorForge; git -C evidence config user.email llhzx2018@gmail.com
          git -C evidence add vf-agent/results/P01-V2.22.0-FORMAL-RELEASE.json
          git -C evidence commit -m 'evidence(P01): record V2.22.0 formal release'
          git -C evidence push origin "$RUNNER_BRANCH"
          echo P01_V222_PUBLICATION_EVIDENCE=PASS

      - name: Final publication verdict
        shell: bash
        run: |
          echo P01_V2_22_0_FORMAL_RELEASE=PASS
          echo RELEASE_SOURCE="$CANDIDATE"
          echo MAIN_COMMIT="$MAIN_COMMIT"
          echo TAG="$TAG"
          echo RELEASE_ID="$RELEASE_ID"
          echo CORE_UPDATES_COMMIT="$CORE_UPDATES_COMMIT"
          echo PRODUCTION_RUNTIME_UPGRADE=NO
