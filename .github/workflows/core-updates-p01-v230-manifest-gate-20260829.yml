name: Core Updates P01 V2.30 Manifest Gate
on:
  push:
    branches: [task/p01-v230-domain-nav-shell-20260829]
    paths: [.github/workflows/core-updates-p01-v230-manifest-gate-20260829.yml]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: 53fc02ebd99007793877a281e53238a591e7e485
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: updates
      - name: Verify manifest and published release identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C updates rev-parse HEAD)" = 53fc02ebd99007793877a281e53238a591e7e485
          test "$(git -C updates merge-base 5fe7b4c21952fd8aa367de960378764848b6e559 HEAD)" = 5fe7b4c21952fd8aa367de960378764848b6e559
          M=updates/projects/P01.json
          jq -e '
            .schema_version=="1.0" and
            .project_id=="P01" and .component_id=="APP" and .enabled==true and
            .current_version=="2.29.0" and .target_version=="2.30.0" and
            .update_type=="ATOMIC" and .from_versions==["2.29.0"] and
            .schema_from=="2026082901" and .schema_to=="2026082901" and
            .repository=="llhzx2018/vf-start" and .release_tag=="v2.30.0" and
            .release_id==378891859 and
            .product_identity=="40b2d5239c557ab6c7b9aaaa092acffa9fb926f9" and
            .asset_name=="VF_Start_V2.30.0_UPDATE.zip" and
            .asset_bytes==1328072 and
            .asset_sha256=="65869be49eb094d2be97609aa4fd588aeed737b97695882fc3b216eaf20edcb0" and
            .backup_required==true and .rollback_supported==true and
            .released_at=="2026-08-29T06:01:41Z" and .minimum_php=="8.0.0"
          ' "$M" >/dev/null
          TAG=$(curl -fsSL https://api.github.com/repos/llhzx2018/vf-start/git/ref/tags/v2.30.0)
          test "$(jq -r .object.sha <<<"$TAG")" = 40b2d5239c557ab6c7b9aaaa092acffa9fb926f9
          REL=$(curl -fsSL https://api.github.com/repos/llhzx2018/vf-start/releases/tags/v2.30.0)
          test "$(jq -r .id <<<"$REL")" = 378891859
          test "$(jq -r .draft <<<"$REL")" = false
          test "$(jq -r .prerelease <<<"$REL")" = false
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.30.0_UPDATE.zip")|.size' <<<"$REL")" = 1328072
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.30.0_UPDATE.zip")|.digest' <<<"$REL")" = sha256:65869be49eb094d2be97609aa4fd588aeed737b97695882fc3b216eaf20edcb0
          curl -fL --retry 3 --retry-all-errors -o /tmp/VF_Start_V2.30.0_UPDATE.zip https://github.com/llhzx2018/vf-start/releases/download/v2.30.0/VF_Start_V2.30.0_UPDATE.zip
          test "$(stat -c%s /tmp/VF_Start_V2.30.0_UPDATE.zip)" = 1328072
          echo '65869be49eb094d2be97609aa4fd588aeed737b97695882fc3b216eaf20edcb0  /tmp/VF_Start_V2.30.0_UPDATE.zip' | sha256sum -c -
          unzip -Z1 /tmp/VF_Start_V2.30.0_UPDATE.zip | grep -Fx repair-v2.30.0.php >/dev/null
          echo CORE_UPDATES_P01_V230_MANIFEST_GATE=PASS
          echo CORE_UPDATES_MAIN_WRITE=NO
          echo OWNER_PRODUCTION_WRITE=NO
