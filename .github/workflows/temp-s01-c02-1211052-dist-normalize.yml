name: S01-C02 1.21.1052 Discovery Verify
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: fixture-root
          MARIADB_DATABASE: vf_ops_discovery_1052
          MARIADB_USER: vf
          MARIADB_PASSWORD: vf-fixture-db
        ports: ["3306:3306"]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=30

    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, zip, sodium, mbstring

      - name: Verify WordPress update discovery
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/vf-ops-discovery-1052"
          WP="$ROOT/wordpress"
          mkdir -p "$WP" "$ROOT/release"

          gh release download v1.21.1051 --repo llhzx2018/vf-tools-ops --pattern vf-tools-ops_V1.21.1051.zip --dir "$ROOT/release" --clobber
          test "$(sha256sum "$ROOT/release/vf-tools-ops_V1.21.1051.zip" | awk '{print $1}')" = "3e2334cedacf8bab1d3b4c3d52ef6a3668b06a3448423af6b8ff4c18fb561e1b"

          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o "$ROOT/wp"
          chmod +x "$ROOT/wp"
          wp(){ php "$ROOT/wp" --path="$WP" "$@"; }

          wp core download --version=7.0.2 --force >/dev/null
          wp config create --dbname=vf_ops_discovery_1052 --dbuser=vf --dbpass=vf-fixture-db --dbhost=127.0.0.1:3306 --skip-check >/dev/null
          wp core install --url=http://127.0.0.1:18160 --title='Ops Discovery 1052' --admin_user=admin --admin_password='Fixture-Discovery-1052!' --admin_email=fixture@example.invalid --skip-email >/dev/null
          wp plugin install "$ROOT/release/vf-tools-ops_V1.21.1051.zip" --activate >/dev/null

          wp eval '$r=vf_ops_wp_update_manual_check_v1(); echo json_encode($r,JSON_UNESCAPED_SLASHES);' > "$ROOT/discovery.json"
          cat "$ROOT/discovery.json"

          jq -e '
            .ok==true
            and .status=="UPDATE_AVAILABLE"
            and .manifest.target_version=="1.21.1052"
            and .manifest.release_tag=="v1.21.1052"
            and .manifest.asset_name=="vf-tools-ops_V1.21.1052.zip"
            and .manifest.asset_bytes==3525797
            and .manifest.asset_sha256=="784438bb387213f22defa2ba5c4b59f9b5bb59010c1cfbc095986da43b537a37"
            and .release.target_version=="1.21.1052"
            and .release.asset_bytes==3525797
            and .release.asset_sha256=="784438bb387213f22defa2ba5c4b59f9b5bb59010c1cfbc095986da43b537a37"
          ' "$ROOT/discovery.json" >/dev/null

          echo WORDPRESS_DISCOVERY=PASS
