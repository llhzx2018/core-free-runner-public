name: P02 v2.5.131 release preflight exact-source oneoff
on:
  pull_request:
    paths:
      - '.github/workflows/p02-v25131-formal-preflight-oneoff.yml'
permissions:
  contents: read
jobs:
  p02-safe-preflight:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p02-v25131-formal-preflight-20261114' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout P02 exact private source without persisting credential
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: cc7185b8f6844fdb12f2f5d99791aa942fada126
          path: vf-library
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
      - name: Checkout official Update Core current authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: 732734d905e3c00c08ab2099c0f505ea9f0bdb6e
          path: core-updates
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Exact 2.5.130 direct source scope positive and denial tests
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd vf-library
          test "$(git rev-parse HEAD)" = "cc7185b8f6844fdb12f2f5d99791aa942fada126"
          test "$(cat VERSION)" = "2.5.131"
          python3 -B -m unittest tests.unit.test_p02_owner_v25131_source_scope -q
          python3 -B -m unittest tests.unit.test_p02_owner_v25130_source_scope -q
          python3 -B scripts/verify-release-source-set.py --channel-json ../core-updates/projects/P02.json --target-version 2.5.131 --source-version 2.5.130 --owner-decision config/p02-release-source-decision-2.5.131.json
          echo P02_25131_SOURCE_SCOPE_MACHINE=PASS
          echo P02_25131_SOURCE_EXCLUSIONS_MACHINE=PASS
      - name: Build real formal candidate artifacts in temporary workspace and inspect W2 delivery
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd vf-library
          export VF_RELEASE_FROM_VERSIONS="2.5.130"
          export VF_RELEASE_OWNER_DECISION="config/p02-release-source-decision-2.5.131.json"
          export VF_RELEASE_CHANNEL_JSON="../core-updates/projects/P02.json"
          export VF_RELEASE_SOURCE_SHA="cc7185b8f6844fdb12f2f5d99791aa942fada126"
          export VF_RELEASE_SOURCE_TREE="$(git rev-parse HEAD^{tree})"
          export VF_RELEASE_SOURCE_REF="release/p02-v25131-formal-gate-20261114"
          export OUT="$RUNNER_TEMP/p02-25131-formal-audit"
          export OUT2="$RUNNER_TEMP/p02-25131-formal-audit-repeat"
          logfile="$RUNNER_TEMP/p02-25131-formal-audit.log"
          if bash scripts/verify-release-artifacts.sh > "$logfile" 2>&1; then
            echo P02_25131_LEGACY_FORMAL_BUILDER=PASS
          else
            python3 - "$logfile" <<'SAFE_TAIL'
          import re,sys
          from pathlib import Path
          lines=Path(sys.argv[1]).read_text(errors='replace').splitlines()
          allow=re.compile(r'(FAIL|ERROR|Error|Traceback|AssertionError|ModuleNotFound|P02_|==|Source|manifest|asset|zip)',re.I)
          sensitive=re.compile(r'(authorization|cookie|bearer|password|token|secret|api.?key|credential)',re.I)
          matches=[re.sub(r'\x1b\[[0-9;]*m','',x)[:280] for x in lines if allow.search(x) and not sensitive.search(x)]
          print('P02_25131_FAILURE_STAGE_EVIDENCE_BEGIN')
          for line in matches[-20:]: print(line)
          print('P02_25131_FAILURE_STAGE_EVIDENCE_END')
          SAFE_TAIL
            echo P02_25131_LEGACY_FORMAL_BUILDER=NOT_PROVEN
            exit 1
          fi
          python3 - "$OUT" <<'INSPECT'
          from pathlib import Path
          import sys,zipfile
          out=Path(sys.argv[1])
          f=out/'VF_Library_V2.5.131_FULL.zip'
          u=out/'VF_Library_V2.5.131_UPDATE.zip'
          assert f.is_file() and u.is_file()
          with zipfile.ZipFile(f) as z:
              full=set(z.namelist())
          with zipfile.ZipFile(u) as z:
              update=set(z.namelist())
          required='app/w2-offline-vendor.php'
          if required in full and 'payload/'+required in update:
              print('P02_25131_FORMAL_W2_PRIVATE_VENDOR_DELIVERY=PASS')
          else:
              print('P02_25131_FORMAL_W2_PRIVATE_VENDOR_DELIVERY=BLOCKED_MISSING_BUNDLE')
          INSPECT
          echo P02_25131_RELEASE_PUBLICATION=NOT_EXECUTED
          echo P02_25131_OWNER_PRODUCTION=UNTOUCHED
      - name: Destroy temporary private sources and package bytes
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- vf-library core-updates
          rm -rf -- "$RUNNER_TEMP/p02-25131-formal-audit" "$RUNNER_TEMP/p02-25131-formal-audit-repeat"
          rm -f -- "$RUNNER_TEMP/p02-25131-formal-audit.log"
