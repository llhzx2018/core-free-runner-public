name: P04 V2.7.8 Release Readback V2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/p04-v278-release-readback-v2.yml']
  workflow_dispatch:
permissions:
  contents: write
env:
  TARGET_REPOSITORY: llhzx2018/vf-infra
  TARGET_TAG: v2.7.8
  SOURCE_COMMIT: ec133d34c1f27098a01aa7b5e9f8e77ba8e847a2
  UPDATE_ASSET: VF_Infra_V2.7.8_UPDATE.zip
jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout public evidence repository
        uses: actions/checkout@v4
      - name: Read back release and publish sanitized evidence
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN" || { echo VF_PRIVATE_READ_TOKEN_MISSING; exit 78; }
          TMP="$RUNNER_TEMP/p04-v278-readback"; mkdir -p "$TMP"
          gh api "repos/$TARGET_REPOSITORY/releases/tags/$TARGET_TAG" > "$TMP/release.json"
          jq -e --arg t "$TARGET_TAG" --arg c "$SOURCE_COMMIT" '.tag_name==$t and .target_commitish==$c and .draft==false and .prerelease==false' "$TMP/release.json" >/dev/null
          COUNT=$(jq --arg n "$UPDATE_ASSET" '[.assets[]|select(.name==$n)]|length' "$TMP/release.json"); test "$COUNT" = 1
          ASSET_ID=$(jq -r --arg n "$UPDATE_ASSET" '.assets[]|select(.name==$n)|.id' "$TMP/release.json")
          EXPECTED_BYTES=$(jq -r --arg n "$UPDATE_ASSET" '.assets[]|select(.name==$n)|.size' "$TMP/release.json")
          gh api -H 'Accept: application/octet-stream' "repos/$TARGET_REPOSITORY/releases/assets/$ASSET_ID" > "$TMP/$UPDATE_ASSET"
          ACTUAL_BYTES=$(wc -c < "$TMP/$UPDATE_ASSET" | tr -d ' '); test "$ACTUAL_BYTES" = "$EXPECTED_BYTES"
          unzip -t "$TMP/$UPDATE_ASSET" >/dev/null
          SHA=$(sha256sum "$TMP/$UPDATE_ASSET" | awk '{print $1}')
          mkdir -p evidence/p04
          python3 - "$TMP/release.json" "$SHA" evidence/p04/P04_V278_RELEASE_LATEST.json <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8')); sha=sys.argv[2]
          a=[x for x in r['assets'] if x['name']=='VF_Infra_V2.7.8_UPDATE.zip'][0]
          out={'status':'PASS','project':'P04','version':'2.7.8','schema':14,'repository':'llhzx2018/vf-infra','release_tag':'v2.7.8','release_name':r['name'],'release_id':r['id'],'release_product_commit':r['target_commitish'],'asset_name':a['name'],'asset_id':a['id'],'asset_bytes':a['size'],'asset_sha256':sha,'released_at':r.get('published_at') or r.get('created_at'),'draft':r['draft'],'prerelease':r['prerelease']}
          open(sys.argv[3],'w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print('P04_V278_RELEASE_READBACK=PASS')
          PY
      - name: Commit public-safe evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name vf-runner
          git config user.email vf-runner@users.noreply.github.com
          git add evidence/p04/P04_V278_RELEASE_LATEST.json
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(P04): V2.7.8 release readback'
          git push origin HEAD:main
