name: P01 Watch Cover Four Sites Diagnostic
on:
  push:
    branches: [diag/p01-watch-cover-four-sites-20260902]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: 0fdf3746d1b218b0781bac44bd3079ef5582e044
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          path: product
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: diag/p01-watch-cover-four-sites-20260902
          path: runner
      - name: Run four-site diagnostic
        shell: bash
        run: bash runner/scripts/p01-watch-cover-four-sites-20260902.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-watch-cover-four-sites-${{ github.run_id }}
          path: /tmp/p01-four-sites/
          if-no-files-found: warn
          retention-days: 30
