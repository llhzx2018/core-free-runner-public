name: P01 user-facing trial shell builder exact-script test (non-release)
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  exact-trial-shell:
    if: github.event_name == 'pull_request' && github.head_ref == 'test/p01-next-owner-trial-full-20261118' && github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SOURCE_SHA: 0e176a4f29e6f6445b6cc14d1db16c7ee05492a0
    steps:
      - name: Checkout public-safe exact user script, no retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify user script exact bytes and preflight failures
        shell: bash
        run: |
          set -Eeuo pipefail
          script="scripts/p01-v247517-trial-build.sh"
          test -f "$script" && ! test -L "$script"
          test "$(sha256sum "$script" | awk '{print $1}')" = a387170d4d17bdb43a405137579f96922cabf8d4ba45b55c201d9b69ecb2a340
          bash -n "$script"
          mkdir -p "$RUNNER_TEMP/p01-cli-preflight"
          if P01_TRIAL_OUTPUT_DIR=/ bash "$script" >"$RUNNER_TEMP/p01-cli-preflight/blocked-root.txt" 2>&1; then exit 1; fi
          grep -F 'BLOCKED: unsafe output directory.' "$RUNNER_TEMP/p01-cli-preflight/blocked-root.txt" >/dev/null
          mkdir -p "$RUNNER_TEMP/p01-cli-preflight/no-overwrite"
          touch "$RUNNER_TEMP/p01-cli-preflight/no-overwrite/P01-v2.47.517-NEW-SITE-TRIAL.zip"
          if P01_TRIAL_OUTPUT_DIR="$RUNNER_TEMP/p01-cli-preflight/no-overwrite" bash "$script" >"$RUNNER_TEMP/p01-cli-preflight/blocked-existing.txt" 2>&1; then exit 1; fi
          grep -F 'BLOCKED: trial ZIP already exists; refusing overwrite.' "$RUNNER_TEMP/p01-cli-preflight/blocked-existing.txt" >/dev/null
          test -e "$RUNNER_TEMP/p01-cli-preflight/no-overwrite/P01-v2.47.517-NEW-SITE-TRIAL.zip"
          echo P01_ORIGINAL_SCRIPT_SHA256_BASH_SYNTAX_AND_FAILCLOSED_NEGATIVES=PASS

      - name: Prepare disposable Github-hosted full-stack build toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq > "$RUNNER_TEMP/p01-cli-apt.log" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php8.3-cli php8.3-sqlite3 php8.3-mysql php8.3-mbstring php8.3-curl php8.3-xml php8.3-zip php8.3-gd php8.3-intl composer >> "$RUNNER_TEMP/p01-cli-apt.log" 2>&1
          command -v gh
          command -v node
          command -v npm
          command -v composer
          php -r 'if(PHP_VERSION_ID<80300)exit(1);foreach(["curl","mbstring","pdo","pdo_sqlite","pdo_mysql","zip","xml","gd","intl"] as $e)if(!extension_loaded($e))exit(1);'
          echo P01_ORIGINAL_SCRIPT_NATIVE_BUILD_TOOLCHAIN=PASS

      - name: Execute exact user-provided script against private GitHub original source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          test "$(gh repo view llhzx2018/vf-start --json name -q .name)" = vf-start
          mkdir -m 700 "$RUNNER_TEMP/p01-cli-output"
          if ! P01_TRIAL_OUTPUT_DIR="$RUNNER_TEMP/p01-cli-output" bash scripts/p01-v247517-trial-build.sh >"$RUNNER_TEMP/p01-cli-execution.log" 2>&1; then
            grep -E '^(BLOCKED:|P01_TRIAL_|FORMAL_RELEASE=|PRODUCTION_CHANGED=)' "$RUNNER_TEMP/p01-cli-execution.log" | tail -n 15 || true
            exit 1
          fi
          grep -Fx 'P01_TRIAL_HANDED_OFF=YES' "$RUNNER_TEMP/p01-cli-execution.log" >/dev/null
          grep -Fx 'FORMAL_RELEASE=NO' "$RUNNER_TEMP/p01-cli-execution.log" >/dev/null
          grep -Fx 'PRODUCTION_CHANGED=NO' "$RUNNER_TEMP/p01-cli-execution.log" >/dev/null
          echo P01_ORIGINAL_USER_SCRIPT_REAL_GITHUB_CLOUD_FULL_BUILD=PASS

      - name: Verify real non-release ZIP, SHA receipt, no private data and no overwrite
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B - <<'PY'
          import hashlib,json,os,stat,zipfile
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'p01-cli-output'
          z=p/'P01-v2.47.517-NEW-SITE-TRIAL.zip'
          receipt=z.with_name(z.name+'.receipt.json')
          assert z.is_file() and not z.is_symlink()
          assert receipt.is_file() and not receipt.is_symlink()
          assert (z.stat().st_mode & 0o777)==0o600
          assert (receipt.stat().st_mode & 0o777)==0o600
          data=json.loads(receipt.read_text())
          assert data['source_sha']==os.environ['SOURCE_SHA']
          assert data['version']=='2.47.517'
          assert data['status']=='OWNER_TRIAL_CANDIDATE_BUILT_AND_VERIFIED'
          assert data['formal_release'] is False
          assert data['production_modified'] is False
          assert data['bytes']==z.stat().st_size
          assert hashlib.sha256(z.read_bytes()).hexdigest()==data['sha256']
          with zipfile.ZipFile(z) as f:
              names=f.namelist()
              assert len(names)>5900 and len(names)==len(set(names))
              assert not any(n.startswith('private/') or n.startswith('.env') for n in names)
              manifest=json.loads(f.read('BUILD-MANIFEST.json'))
              assert manifest['source_sha']==os.environ['SOURCE_SHA']
              assert manifest['readiness']=='OWNER_TRIAL_CANDIDATE'
              assert manifest['trial_scope']=={
                'new_empty_site_only':True,
                'legacy_data_import_authorized':False,
                'old_site_cutover_authorized':False,
                'automatic_update_authorized':False,
                'formal_release_authorized':False
              }
          print('P01_ORIGINAL_USER_SCRIPT_OUTPUT_RECEIPT_HASH_PRIVATE_POLICY=PASS')
          PY
          source_hash="$(sha256sum "$RUNNER_TEMP/p01-cli-output/P01-v2.47.517-NEW-SITE-TRIAL.zip" | awk '{print $1}')"
          if P01_TRIAL_OUTPUT_DIR="$RUNNER_TEMP/p01-cli-output" bash scripts/p01-v247517-trial-build.sh > "$RUNNER_TEMP/p01-cli-overwrite.log" 2>&1; then exit 1; fi
          grep -F 'BLOCKED: trial ZIP already exists; refusing overwrite.' "$RUNNER_TEMP/p01-cli-overwrite.log" >/dev/null
          test "$(sha256sum "$RUNNER_TEMP/p01-cli-output/P01-v2.47.517-NEW-SITE-TRIAL.zip" | awk '{print $1}')" = "$source_hash"
          echo P01_ORIGINAL_USER_SCRIPT_REPEAT_REFUSED_BYTES_UNCHANGED=PASS

      - name: Securely remove built private ZIP and any source from public runner
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- "$RUNNER_TEMP/p01-cli-output" "$RUNNER_TEMP/p01-cli-preflight"
          rm -f -- "$RUNNER_TEMP/p01-cli-"*.log
          if ! test -e "$RUNNER_TEMP/p01-cli-output" && ! test -e "$RUNNER_TEMP/p01-cli-preflight"; then
            echo P01_ORIGINAL_USER_SCRIPT_PUBLIC_ARTIFACT_SOURCE_PERSISTED=NONE
          else
            exit 1
          fi
