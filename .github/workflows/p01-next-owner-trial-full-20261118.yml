name: P01 D87 first-install success-screen and no-replay exact source
on:
  pull_request:
    types: [reopened, synchronize]
    paths:
      - .github/workflows/p01-next-owner-trial-full-20261118.yml
permissions:
  contents: read
jobs:
  exact-first-install-ui:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.number == 4161 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - name: Fetch exact P01 Draft PR1973 source in disposable private workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: d56bdcdcd9c0c8c0ff8c9bf33b0571b476ad5853
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
          fetch-depth: 0
      - name: Node 22 for real shipped inline-JS DOM interaction test
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP 8.3 for bounded install route syntax and existing safety negative test
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring,openssl,pdo_sqlite,pdo_mysql,zip,fileinfo
          coverage: none
      - name: Run exact UI success / ambiguous result / recovery / password-clear and original protected first boot
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = d56bdcdcd9c0c8c0ff8c9bf33b0571b476ad5853
          test "$(cat candidate/VERSION)" = 2.47.517
          php -l candidate/src/app/next/http/InstallHttpRoutes.php
          php -l candidate/src/app/next/routes/web.php
          php -l candidate/src/app/next/public/setup.php
          node --check candidate/tests/unit/p01_next_install_completion_contract.cjs
          node candidate/tests/unit/p01_next_install_completion_contract.cjs
          php candidate/tests/unit/p01_protected_http_install_bootstrap_contract.php
          python3 -B candidate/scripts/check_p01_fullstack_contract.py
          echo P01_D87_FIRST_INSTALL_COMPLETION_AND_STRICT_REPLAY_MACHINE=PASS
          echo P01_D87_FORMAL_RELEASE=NO
          echo P01_D87_PRODUCTION_CHANGED=NO
      - name: Destroy private checkout and temporary source
        if: always()
        run: |
          rm -rf -- candidate
          test ! -e candidate
          echo P01_D87_PRIVATE_SOURCE_PERSISTED_IN_PUBLIC_GIT_OR_ARTIFACT=NONE
