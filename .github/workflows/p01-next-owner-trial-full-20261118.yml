name: P01 first-install without Basic Auth isolated HTTPS gate
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  no-basic-real-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PRODUCT_SHA: 6da191b53f20ecccbced230af8ad3921fc87d25b
    steps:
      - name: Checkout exact private P01 candidate with no persisted tokens
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 6da191b53f20ecccbced230af8ad3921fc87d25b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: candidate
      - name: Checkout current official naming and architecture rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov-doc
      - name: Exact source, PHP syntax, source architecture and negative contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(cat candidate/VERSION)" = "2.47.517"
          python3 -B candidate/.github/checks/test_architecture_gate.py >"$RUNNER_TEMP/p01-arch-neg.txt" 2>&1
          python3 -B candidate/.github/checks/architecture_gate.py --manifest candidate/.github/checks/code_architecture.json --gov-root gov-doc --base-sha c377dc3e0696585b207561081f6dc462108c904f --head-sha "$PRODUCT_SHA" --git-root candidate >"$RUNNER_TEMP/p01-arch.txt" 2>&1 || {
            grep -E 'PROJECT_ARCHITECTURE=|ERROR|FAIL' "$RUNNER_TEMP/p01-arch.txt" | head -n 14 || true
            exit 1
          }
          grep -F 'PROJECT_ARCHITECTURE=STRUCTURAL_PASS' "$RUNNER_TEMP/p01-arch.txt" >/dev/null
          for file in CloudPanelGitHubFirstClaim.php CloudPanelSiteActivation.php CloudPanelFrontControllerPreflight.php CloudPanelInstallAccess.php CloudPanelCleanFullPreflight.php; do
            php -l "candidate/src/app/next/runtime/$file" >/dev/null
          done
          php -l candidate/src/app/next/public/setup.php >/dev/null
          php -l candidate/src/app/next/http/InstallHttpRoutes.php >/dev/null
          python3 -B -m py_compile candidate/tests/compatibility/laravel/http/run_cloudpanel_github_first_claim.py
          python3 -B -m unittest discover -s candidate/tests/architecture -p test_p01_next_owner_trial.py >"$RUNNER_TEMP/p01-trial-unit.txt" 2>&1
          echo P01_NO_BASIC_SOURCE_ARCHITECTURE_AND_NEGATIVES=PASS
      - name: Provision isolated PHP FPM Nginx HTTPS Composer and Vite toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq >"$RUNNER_TEMP/p01-apt.txt" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nginx php8.3-fpm openssl php8.3-cli php8.3-sqlite3 php8.3-mysql php8.3-mbstring php8.3-curl php8.3-xml php8.3-zip php8.3-gd php8.3-intl composer >>"$RUNNER_TEMP/p01-apt.txt" 2>&1
          echo P01_NO_BASIC_REAL_FPM_NATIVE_DEPS=PASS
      - name: Build the same complete private Laravel FULL and scoped CloudPanel trial
        shell: bash
        run: |
          set -Eeuo pipefail
          (cd candidate && python3 -B scripts/build_p01_next_clean_full.py build --source-sha "$PRODUCT_SHA" --output "$RUNNER_TEMP/p01-clean.zip" --composer composer > "$RUNNER_TEMP/p01-build.log" 2>&1)
          python3 -B candidate/scripts/build_p01_next_clean_full.py verify --zip "$RUNNER_TEMP/p01-clean.zip" >"$RUNNER_TEMP/p01-clean-verify.json"
          python3 -B candidate/scripts/build_p01_next_cloudpanel_full.py build --source-zip "$RUNNER_TEMP/p01-clean.zip" --output "$RUNNER_TEMP/p01-cloudpanel.zip" > "$RUNNER_TEMP/p01-cloudpanel.json"
          python3 -B candidate/scripts/build_p01_next_cloudpanel_full.py verify --zip "$RUNNER_TEMP/p01-cloudpanel.zip" > "$RUNNER_TEMP/p01-cloudpanel-verify.json"
          hash="$(sha256sum "$RUNNER_TEMP/p01-cloudpanel.zip" | cut -d' ' -f1)"
          python3 -B candidate/scripts/build_p01_next_owner_trial.py build --developer-zip "$RUNNER_TEMP/p01-cloudpanel.zip" --output "$RUNNER_TEMP/p01-trial.zip" --source-sha "$PRODUCT_SHA" --developer-sha256 "$hash" > "$RUNNER_TEMP/p01-trial.json"
          python3 -B candidate/scripts/build_p01_next_owner_trial.py verify --zip "$RUNNER_TEMP/p01-trial.zip" --source-sha "$PRODUCT_SHA" --developer-sha256 "$hash" >"$RUNNER_TEMP/p01-trial-verify.json"
          echo P01_NO_BASIC_EXACT_BUILD_TRIAL_ZIP=PASS
      - name: Verify legacy Basic installed full still passes on exact changed runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! P01_OWNER_TRIAL_ISOLATED_HTTP=YES python3 -B candidate/tests/compatibility/laravel/http/run_cloudpanel_fpm_full_stage.py --bundle "$RUNNER_TEMP/p01-trial.zip" --engine sqlite > "$RUNNER_TEMP/p01-basic-legacy.txt" 2>&1; then
            grep -E '^P01_|^RuntimeError|^Traceback' "$RUNNER_TEMP/p01-basic-legacy.txt" | tail -n 24 || true
            exit 1
          fi
          grep -Fx 'P01_D14_ISOLATED_SITE_CLEANUP=PASS' "$RUNNER_TEMP/p01-basic-legacy.txt" >/dev/null
          echo P01_NO_BASIC_CHANGE_PRESERVES_LEGACY_BASIC_HTTPS_FLOW=PASS
      - name: Verify real no-Basic secure owner first claim and installed workbench
        shell: bash
        env:
          P01_REAL_OWNER_AUTH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$P01_REAL_OWNER_AUTH_TOKEN"
          if ! P01_OWNER_TRIAL_ISOLATED_HTTP=YES python3 -B candidate/tests/compatibility/laravel/http/run_cloudpanel_github_first_claim.py --bundle "$RUNNER_TEMP/p01-trial.zip" >"$RUNNER_TEMP/p01-no-basic.txt" 2>&1; then
            grep -E '^P01_|^RuntimeError|^Traceback' "$RUNNER_TEMP/p01-no-basic.txt" | tail -n 24 || true
            exit 1
          fi
          grep -Fx 'P01_NO_BASIC_REAL_HTTPS_GITHUB_OWNER_3DB_PAGE_AND_SQLITE_INSTALL=PASS' "$RUNNER_TEMP/p01-no-basic.txt" >/dev/null
          echo P01_NO_BASIC_REAL_OWNER_HTTPS_NO_CLOUDPANEL_PASSWORD=PASS
      - name: Purge all private source, tokens, packages and logs from public runner
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- candidate gov-doc
          rm -f -- "$RUNNER_TEMP"/p01-*.zip "$RUNNER_TEMP"/p01-*.json "$RUNNER_TEMP"/p01-*.txt "$RUNNER_TEMP"/p01-*.log
          if ! test -e candidate && ! test -e "$RUNNER_TEMP/p01-trial.zip"; then
            echo P01_NO_BASIC_SOURCE_TOKEN_BUNDLE_PERSISTED=NONE
          else
            exit 1
          fi
