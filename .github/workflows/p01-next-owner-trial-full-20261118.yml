name: P01 temporary private-handoff write capability preflight
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  private-sandbox-write-probe:
    if: github.event_name == 'pull_request' && github.head_ref == 'test/p01-next-owner-trial-full-20261118' && github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Check existing authorized private-sandbox capability without writing
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          if [ -z "$GH_TOKEN" ]; then
            echo P01_PRIVATE_DELIVERY_REGISTERED_WRITE_TOKEN=NOT_AVAILABLE
            exit 0
          fi
          if ! gh api repos/llhzx2018/core-free-runner-private -q '.full_name' 2>/dev/null | grep -Fx 'llhzx2018/core-free-runner-private' >/dev/null; then
            echo P01_PRIVATE_DELIVERY_REGISTERED_WRITE_TOKEN=NO_REPOSITORY_ACCESS
            exit 0
          fi
          push="$(gh api repos/llhzx2018/core-free-runner-private -q '.permissions.push' 2>/dev/null || true)"
          if [ "$push" = 'true' ]; then
            echo P01_PRIVATE_DELIVERY_GITHUB_REPO_WRITE=YES
          else
            echo P01_PRIVATE_DELIVERY_GITHUB_REPO_WRITE=NO_OR_UNVERIFIED
          fi
          echo P01_PRIVATE_DELIVERY_PERMISSION_PROBE=READ_ONLY
