name: P01 batch C UX navigation on-click + data-migration safety source verification
on:
  pull_request:
    types: [reopened, synchronize]
    paths:
      - .github/workflows/p01-next-owner-trial-full-20261118.yml
permissions:
  contents: read
jobs:
  exact-owner-ux:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.number == 4161 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact private P01 Draft candidate transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 4ce8e45ae5ee91fbbebb1ee0cbed5e8eabd7c892
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
          fetch-depth: 0
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate exact source identity and no production migration/writes
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = 4ce8e45ae5ee91fbbebb1ee0cbed5e8eabd7c892
          test "$(cat candidate/VERSION)" = 2.47.517
          test "$(cat candidate/src/VERSION.txt)" = 2.47.517
          test -f candidate/src/app/next/runtime/FreshFullOfflineConversion.php
          grep -q "'new_site_activated'=>false" candidate/src/app/next/runtime/FreshFullOfflineConversion.php
          grep -q "'production_migration_complete'=>false" candidate/src/app/next/runtime/FreshFullOfflineConversion.php
          grep -q "OFFLINE_ONLY_NOT_INSTALLED" candidate/src/app/next/runtime/FreshFullOfflineConversion.php
          echo P01_MIGRATION_REAL_OWNER_ONSITE_ACTIVATION=NOT_PROVEN
          echo P01_MIGRATION_ISOLATED_OFFLINE_CONVERSION_STILL_NONACTIVATING=VERIFIED
      - name: Frontend locked dependencies + TypeScript + real unit + build
        working-directory: candidate/src/app/next/frontend
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run test:unit
          npm run build
          echo P01_BATCH_C_REAL_FRONTEND_TYPECHECK_UNIT_VITE_BUILD=PASS
      - name: Install Chromium on registered disposable runner
        working-directory: candidate/src/app/next/frontend
        shell: bash
        run: |
          set -Eeuo pipefail
          npx playwright install --with-deps chromium
      - name: Browser 390/768/1440 navigation/inbox+subsite continuity + setup/updates
        working-directory: candidate/src/app/next/frontend
        shell: bash
        run: |
          set -Eeuo pipefail
          npx playwright test tests/resource-links.spec.ts tests/subsite-switcher.spec.ts tests/workbench.spec.ts --workers=1 --reporter=line
          echo P01_BATCH_C_CHROMIUM_RESPONSIVE_NO_AUTO_READ_DATA_CONTINUITY=PASS
          echo P01_BATCH_C_OWNER_REAL_SITE_VISUAL_ACCEPTANCE=NOT_PROVEN
          echo P01_BATCH_C_FORMAL_RELEASE=NO
          echo P01_BATCH_C_PRODUCTION_OR_DATA_MIGRATION=NO
      - name: Destroy private source and browser report
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate
          test ! -e candidate
          echo P01_BATCH_C_PRIVATE_SOURCE_ARTIFACT_PERSISTENCE=NONE
