name: P01 D86 exact safe package diagnosis and private new-site trial
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  new-no-basic-trial-handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PRODUCT_SHA: 4265a72869053e0890b05f9f2187c30dd9c3783c
      HANDOFF_BRANCH: trial/p01-v247517-0e176a4f-20261118
      ZIP_NAME: P01-v2.47.517-D86-SAFE-DIAG-NEW-SITE-TRIAL.zip
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      PRIVATE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Verify exact authorized candidate and temporary private destination
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "$GITHUB_HEAD_REF" = "test/p01-next-owner-trial-full-20261118"
          test -n "$PRIVATE_READ_TOKEN" && test -n "$PRIVATE_WRITE_TOKEN"
          GH_TOKEN="$PRIVATE_WRITE_TOKEN" gh api repos/llhzx2018/core-free-runner-private --jq .permissions.push | grep -Fx true >/dev/null
          echo P01_NO_BASIC_PRIVATE_ONLY_DELIVERY_SCOPE=PASS
      - name: Checkout verified exact product and existing private sandbox
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 4265a72869053e0890b05f9f2187c30dd9c3783c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: candidate
      - name: Checkout purpose-bound private branch only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-private
          ref: trial/p01-v247517-0e176a4f-20261118
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-sandbox
      - name: Install disposable Composer and Vite dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$PRODUCT_SHA"
          sudo apt-get update -qq >"$RUNNER_TEMP/p01-apt.log" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php8.3-cli php8.3-sqlite3 php8.3-mysql php8.3-mbstring php8.3-curl php8.3-xml php8.3-zip php8.3-gd php8.3-intl composer >>"$RUNNER_TEMP/p01-apt.log" 2>&1
          php8.3 -l candidate/src/app/next/public/setup.php >/dev/null
          php8.3 -l candidate/src/app/next/runtime/CloudPanelGitHubFirstClaim.php >/dev/null
          echo P01_NO_BASIC_PRIVATE_HANDOFF_EXACT_SOURCE_AND_NATIVE_PHP=PASS
      - name: Execute exact-source first setup failure UI and safe-negative fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          php8.3 -l candidate/src/app/next/public/setup.php
          php8.3 -l candidate/tests/unit/p01_first_setup_safe_feedback_contract.php
          php8.3 candidate/tests/unit/p01_first_setup_safe_feedback_contract.php
          php8.3 candidate/tests/unit/p01_protected_http_install_bootstrap_contract.php
          echo P01_D86_FOUR_DISTINCT_PACKAGE_IDENTITY_NEGATIVES_AND_FAIL_CLOSED=PASS
      - name: Build exact self-contained complete Laravel and CloudPanel trial ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          (cd candidate && python3 -B scripts/build_p01_next_clean_full.py build --source-sha "$PRODUCT_SHA" --output "$RUNNER_TEMP/p01-clean.zip" --composer composer >"$RUNNER_TEMP/p01-build.log" 2>&1)
          python3 -B candidate/scripts/build_p01_next_clean_full.py verify --zip "$RUNNER_TEMP/p01-clean.zip" >"$RUNNER_TEMP/p01-clean.json"
          python3 -B candidate/scripts/build_p01_next_cloudpanel_full.py build --source-zip "$RUNNER_TEMP/p01-clean.zip" --output "$RUNNER_TEMP/p01-cloudpanel.zip" >"$RUNNER_TEMP/p01-cloudpanel.json"
          python3 -B candidate/scripts/build_p01_next_cloudpanel_full.py verify --zip "$RUNNER_TEMP/p01-cloudpanel.zip" >"$RUNNER_TEMP/p01-cloudpanel-verify.json"
          cd candidate
          parent="$(sha256sum "$RUNNER_TEMP/p01-cloudpanel.zip" | cut -d' ' -f1)"
          python3 -B scripts/build_p01_next_owner_trial.py build --developer-zip "$RUNNER_TEMP/p01-cloudpanel.zip" --output "$RUNNER_TEMP/p01-new.zip" --source-sha "$PRODUCT_SHA" --developer-sha256 "$parent" >"$RUNNER_TEMP/p01-receipt.json"
          python3 -B scripts/build_p01_next_owner_trial.py verify --zip "$RUNNER_TEMP/p01-new.zip" --source-sha "$PRODUCT_SHA" --developer-sha256 "$parent" >"$RUNNER_TEMP/p01-verify.json"
          echo P01_NO_BASIC_PRIVATE_HANDOFF_BUILT_VENDOR_VITE_AND_TRIAL_ZIP=PASS
      - name: Strictly verify new trial file scope, hash and source identity before private upload
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          zip_file=root/'p01-new.zip'
          receipt=json.loads((root/'p01-receipt.json').read_text())
          doc=json.loads((root/'p01-verify.json').read_text().splitlines()[-1])
          assert receipt['source_sha']==os.environ['PRODUCT_SHA']
          assert doc['source_sha']==os.environ['PRODUCT_SHA']
          assert receipt['formal_release'] is False
          assert receipt['scope']['new_empty_site_only'] is True
          for forbidden in ('legacy_data_import_authorized','old_site_cutover_authorized',
                            'automatic_update_authorized','formal_release_authorized'):
              assert receipt['scope'][forbidden] is False
          assert 1000000 < zip_file.stat().st_size < 90000000
          assert hashlib.sha256(zip_file.read_bytes()).hexdigest()==receipt['sha256']
          with zipfile.ZipFile(zip_file) as archive:
              meta=json.loads(archive.read('BUILD-MANIFEST.json'))
              assert meta['readiness']=='OWNER_TRIAL_CANDIDATE'
              assert meta['source_sha']==os.environ['PRODUCT_SHA']
              assert 'app/runtime/CloudPanelGitHubFirstClaim.php' in archive.namelist()
              assert 'app/public/setup.php' in archive.namelist()
              assert 'app/vendor/autoload.php' in archive.namelist()
              assert len(archive.namelist())>5900
              assert not any(n.startswith('private/') or n.startswith('.env') for n in archive.namelist())
          out=Path('private-sandbox/trials')
          assert out.is_dir() and not out.is_symlink()
          name=os.environ['ZIP_NAME']
          dest=out/name
          r=out/(name+'.receipt.json')
          assert not dest.exists() and not r.exists()
          dest.write_bytes(zip_file.read_bytes())
          receipt['previous_real_machine_evidence']='https://github.com/llhzx2018/core-free-runner-public/actions/runs/44239489096'
          r.write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n')
          assert hashlib.sha256(dest.read_bytes()).hexdigest()==receipt['sha256']
          print('P01_NO_BASIC_PRIVATE_HANDOFF_EXACT_SHA_NONRELEASE_BYTES=PASS')
          print('P01_NO_BASIC_PRIVATE_HANDOFF_ZIP_SIZE='+str(dest.stat().st_size))
          print('P01_NO_BASIC_PRIVATE_HANDOFF_ZIP_SHA256='+receipt['sha256'])
          PY
      - name: Commit ONLY ZIP and receipt on temporary private handoff branch
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C private-sandbox config user.name "VF Isolated Test Runner"
          git -C private-sandbox config user.email "vf-test-runner@users.noreply.github.com"
          git -C private-sandbox add -- "trials/$ZIP_NAME" "trials/$ZIP_NAME.receipt.json"
          test "$(git -C private-sandbox diff --cached --name-only | wc -l)" -eq 2
          git -C private-sandbox commit -qm "test(P01): no-Basic first-install trial full private-only handoff"
          GH_TOKEN="$PRIVATE_WRITE_TOKEN" gh auth setup-git >/dev/null
          GH_TOKEN="$PRIVATE_WRITE_TOKEN" git -C private-sandbox push origin "HEAD:refs/heads/$HANDOFF_BRANCH" >"$RUNNER_TEMP/p01-push.log" 2>&1
          echo P01_NO_BASIC_PRIVATE_ONLY_GIT_WRITE=PASS
      - name: Independently verify remote private GitHub blob identity for ZIP and receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          for filename in "$ZIP_NAME" "$ZIP_NAME.receipt.json"; do
            expected="$(git -C private-sandbox hash-object "trials/$filename")"
            actual="$(GH_TOKEN="$PRIVATE_WRITE_TOKEN" gh api "repos/llhzx2018/core-free-runner-private/contents/trials/$filename?ref=$HANDOFF_BRANCH" --jq .sha)"
            test "$actual" = "$expected"
          done
          echo P01_NO_BASIC_PRIVATE_GITHUB_REMOTE_ZIP_SHA_READBACK=PASS
          echo P01_NO_BASIC_FORMAL_RELEASE=NO
          echo P01_NO_BASIC_PRODUCTION_CHANGED=NO
      - name: Remove private checkout and ZIP from public Runner, never upload public artifacts
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- candidate private-sandbox
          rm -f "$RUNNER_TEMP"/p01-*.zip "$RUNNER_TEMP"/p01-*.json "$RUNNER_TEMP"/p01-*.log
          if test ! -e candidate && test ! -e private-sandbox && test ! -e "$RUNNER_TEMP/p01-new.zip"; then
            echo P01_NO_BASIC_PUBLIC_PRIVATE_MATERIAL_PERSISTED=NONE
          else
            exit 1
          fi
