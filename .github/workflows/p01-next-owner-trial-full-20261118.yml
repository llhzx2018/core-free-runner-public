name: P01 exact non-release ZIP private sandbox handoff
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-private-delivery:
    if: github.event_name == 'pull_request' && github.head_ref == 'test/p01-next-owner-trial-full-20261118' && github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SOURCE_SHA: 0e176a4f29e6f6445b6cc14d1db16c7ee05492a0
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      PRIVATE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      HANDOFF_REF: trial/p01-v247517-0e176a4f-20261118
    steps:
      - name: Checkout public tested shell script with no persisted tokens
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: public-harness
      - name: Checkout authorized temporary private branch for file handoff
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-private
          ref: trial/p01-v247517-0e176a4f-20261118
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-sandbox
      - name: Check exact source identity, private path and existing write capability
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test -n "$PRIVATE_READ_TOKEN" && test -n "$PRIVATE_WRITE_TOKEN"
          test "$(sha256sum public-harness/scripts/p01-v247517-trial-build.sh | cut -d' ' -f1)" = "a387170d4d17bdb43a405137579f96922cabf8d4ba45b55c201d9b69ecb2a340"
          test "$(git -C private-sandbox branch --show-current)" = "$HANDOFF_REF"
          test -f private-sandbox/TRIAL_HANDOFF_README.md
          test ! -e "private-sandbox/trials/P01-v2.47.517-NEW-SITE-TRIAL.zip"
          GH_TOKEN="$PRIVATE_WRITE_TOKEN" gh api repos/llhzx2018/core-free-runner-private -q '.permissions.push' | grep -Fx 'true' >/dev/null
          bash -n public-harness/scripts/p01-v247517-trial-build.sh
          echo P01_PRIVATE_HANDOFF_EXACT_SCRIPT_REF_AND_WRITE_SCOPE=PASS
      - name: Provision disposable build dependencies, never on a live server
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq > "$RUNNER_TEMP/p01-deps.log" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php8.3-cli php8.3-sqlite3 php8.3-mysql php8.3-mbstring php8.3-curl php8.3-xml php8.3-zip php8.3-gd php8.3-intl composer >>"$RUNNER_TEMP/p01-deps.log" 2>&1
          command -v gh >/dev/null && command -v npm >/dev/null && command -v node >/dev/null
          echo P01_PRIVATE_HANDOFF_BUILD_DEPENDENCIES_READY=PASS
      - name: Run already-proven exact script, build real ZIP only in transient workspace
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -m 700 "$RUNNER_TEMP/p01-handoff"
          if ! GH_TOKEN="$PRIVATE_READ_TOKEN" P01_TRIAL_OUTPUT_DIR="$RUNNER_TEMP/p01-handoff" bash public-harness/scripts/p01-v247517-trial-build.sh > "$RUNNER_TEMP/p01-build.log" 2>&1; then
            grep -E '^BLOCKED:|^P01_TRIAL_|^PRODUCTION_CHANGED=' "$RUNNER_TEMP/p01-build.log" | tail -n 10 || true
            exit 1
          fi
          grep -Fx 'P01_TRIAL_HANDED_OFF=YES' "$RUNNER_TEMP/p01-build.log" >/dev/null
          test -f "$RUNNER_TEMP/p01-handoff/P01-v2.47.517-NEW-SITE-TRIAL.zip"
          test -f "$RUNNER_TEMP/p01-handoff/P01-v2.47.517-NEW-SITE-TRIAL.zip.receipt.json"
          echo P01_PRIVATE_HANDOFF_EXACT_SOURCE_REAL_VENDOR_VITE_ZIP=PASS
      - name: Verify package SHA and copy exactly two files to private-only branch
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'p01-handoff'
          z=root/'P01-v2.47.517-NEW-SITE-TRIAL.zip'
          r=z.with_name(z.name+'.receipt.json')
          receipt=json.loads(r.read_text())
          assert receipt['source_sha']==os.environ['SOURCE_SHA']
          assert receipt['formal_release'] is False and receipt['production_modified'] is False
          assert receipt['status']=='OWNER_TRIAL_CANDIDATE_BUILT_AND_VERIFIED'
          assert z.stat().st_size < 95*1024*1024
          assert hashlib.sha256(z.read_bytes()).hexdigest()==receipt['sha256']
          assert receipt['bytes']==z.stat().st_size
          with zipfile.ZipFile(z) as archive:
              doc=json.loads(archive.read('BUILD-MANIFEST.json'))
              assert doc['source_sha']==os.environ['SOURCE_SHA']
              assert doc['readiness']=='OWNER_TRIAL_CANDIDATE'
              assert doc['trial_scope']=={
                'new_empty_site_only':True,
                'legacy_data_import_authorized':False,
                'old_site_cutover_authorized':False,
                'automatic_update_authorized':False,
                'formal_release_authorized':False
              }
              assert len(archive.namelist())>5900
              assert not any(p.startswith('private/') or p.startswith('.env') for p in archive.namelist())
          private=Path('private-sandbox/trials')
          private.mkdir(mode=0o700)
          for src in (z,r):
              dest=private/src.name
              assert not dest.exists()
              dest.write_bytes(src.read_bytes())
              assert dest.read_bytes()==src.read_bytes()
          print('P01_PRIVATE_HANDOFF_COPY_SHA256_AND_SCOPE=PASS')
          print('P01_PRIVATE_HANDOFF_PACKAGE_BYTES='+str(z.stat().st_size))
          print('P01_PRIVATE_HANDOFF_PACKAGE_SHA256='+receipt['sha256'])
          PY
      - name: Commit and push into private sandbox branch only, never public Git or artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$HANDOFF_REF" = 'trial/p01-v247517-0e176a4f-20261118'
          git -C private-sandbox config user.name "VF Isolated Test Runner"
          git -C private-sandbox config user.email "vf-test-runner@users.noreply.github.com"
          git -C private-sandbox add -- trials/P01-v2.47.517-NEW-SITE-TRIAL.zip trials/P01-v2.47.517-NEW-SITE-TRIAL.zip.receipt.json
          test "$(git -C private-sandbox diff --cached --name-only | wc -l)" -eq 2
          git -C private-sandbox commit -qm "test(P01): purpose-bound private non-release owner trial zip and signed-by-hash receipt"
          GH_TOKEN="$PRIVATE_WRITE_TOKEN" gh auth setup-git >/dev/null
          GH_TOKEN="$PRIVATE_WRITE_TOKEN" git -C private-sandbox push origin "HEAD:refs/heads/$HANDOFF_REF" >"$RUNNER_TEMP/p01-private-push.log" 2>&1
          echo P01_PRIVATE_HANDOFF_COMMIT_PUSH_PRIVATE_BRANCH_ONLY=PASS
      - name: Independently read back private GitHub blobs and verify every byte
        shell: bash
        run: |
          set -Eeuo pipefail
          zip="private-sandbox/trials/P01-v2.47.517-NEW-SITE-TRIAL.zip"
          receipt="$zip.receipt.json"
          expected="$(git hash-object "$zip")"
          got="$(GH_TOKEN="$PRIVATE_WRITE_TOKEN" gh api "repos/llhzx2018/core-free-runner-private/contents/trials/P01-v2.47.517-NEW-SITE-TRIAL.zip?ref=$HANDOFF_REF" --jq .sha)"
          test "$got" = "$expected"
          expected_receipt="$(git hash-object "$receipt")"
          got_receipt="$(GH_TOKEN="$PRIVATE_WRITE_TOKEN" gh api "repos/llhzx2018/core-free-runner-private/contents/trials/P01-v2.47.517-NEW-SITE-TRIAL.zip.receipt.json?ref=$HANDOFF_REF" --jq .sha)"
          test "$got_receipt" = "$expected_receipt"
          echo P01_PRIVATE_HANDOFF_GITHUB_REMOTE_BLOB_READBACK=PASS
          echo P01_PRIVATE_HANDOFF_FORMAL_RELEASE=NO
          echo P01_PRIVATE_HANDOFF_PRODUCTION_DNS=UNCHANGED
      - name: Purge checkout, builder logs and ZIP from public machine
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- public-harness private-sandbox "$RUNNER_TEMP/p01-handoff"
          rm -f -- "$RUNNER_TEMP"/p01-*.log
          if test ! -e private-sandbox && ! -e "$RUNNER_TEMP/p01-handoff"; then
            echo P01_PRIVATE_HANDOFF_PUBLIC_PRIVATE_SOURCE_ARTIFACT_PERSISTED=NONE
          else
            exit 1
          fi
