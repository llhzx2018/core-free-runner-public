name: "TEMP P01 native specialist exact-source syntax and contract proof"
on:
  push:
    branches:
      - "task/p01-native-specialist-proof-20261026"
permissions:
  contents: read
jobs:
  native-specialist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact private P01 candidate without persisting credentials
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: "72747f2208db81349897f2622f4d520b998c103b"
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Assert exact candidate identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "72747f2208db81349897f2622f4d520b998c103b"
      - name: PHP syntax lint for changed server handlers
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            src/app/FunctionalWorkspaceShell.php \
            src/toolbox-manager.php \
            src/projects-source-manager.php \
            src/gov-book-manager.php \
            src/gov-book-sync.php; do
            php -l "$file"
          done
      - name: JS syntax and native frontstage security contract
        shell: bash
        run: |
          set -euo pipefail
          node --check src/assets/local-subsite-management.js
          node --check src/assets/full-governance.js
          node --test tests/unit/p01_frontstage_specialist_tasks_contract.cjs
      - name: Focused existing P01 frontstage and mutation regression
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' suites < <(find tests/unit -maxdepth 1 -type f \
            \( -iname '*frontstage*' -o -iname '*subsite*' -o -iname '*toolbox*' \
            -o -iname '*gov_book*' -o -iname '*project*' -o -iname '*governance*' \) \
            \( -name '*.cjs' -o -name '*.js' \) -print0)
          echo "Focused test files: ${#suites[@]}"
          test "${#suites[@]}" -gt 1
          node --test "${suites[@]}"
      - name: Verify already-merged native topic course project dialogs in final candidate
        shell: bash
        run: |
          set -euo pipefail
          for file in src/app/CourseLibraryPage.php \
            src/app/ProjectActionCenterPage.php src/app/TopicLibraryPage.php \
            src/projects-github-sync.php; do php -l "$file"; done
          for file in src/assets/course-experience.js \
            src/assets/project-git-source-dialog.js \
            src/assets/topic-git-sync.js; do node --check "$file"; done
          node --test tests/unit/p01_project_source_dialog_contract.cjs \
            tests/unit/p01_topic_source_dialog_contract.cjs
          php tests/unit/p01_frontstage_source_dialog_contract.php
          php tests/unit/topics_page_context_closure_contract.php
      - name: Verify candidate has no specialist back-navigation or credential echoes
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq "data-vf-specialist-link" src/app/FunctionalWorkspaceShell.php; then exit 1; fi
          if grep -Fq "<iframe" src/app/FunctionalWorkspaceShell.php; then exit 1; fi
          if grep -Eq "echo .*gov_book_read|echo .*gov_topic_read" src/gov-book-manager.php; then exit 1; fi

      - name: Diagnose legacy contracts affected by native frontstage conversion
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r suite; do
            [[ -z "$suite" ]] && continue
            set +e
            php "$suite" >/tmp/legacy-contract-output.txt 2>&1
            status=$?
            set -e
            if [[ "$status" -ne 0 ]]; then
              failed=$((failed+1))
              summary="$(grep -E 'RuntimeException|Fatal error|Missing |Assertion|Contract|Error:' /tmp/legacy-contract-output.txt | head -n 2 | cut -c 1-250 | tr '\n' ' ' || true)"
              echo "LEGACY_CONTRACT_FAILED: $suite :: $summary"
            fi
          done <<'SUITES'
          tests/unit/frontstage_daily_ops_r1_contract.php
          tests/unit/gov_book_backend_shell_contract.php
          tests/unit/gov_book_private_auth_isolation_native.php
          tests/unit/gov_book_sync_contract_native.php
          tests/unit/gov_book_sync_dialog_contract.php
          tests/unit/gov_book_sync_version_truth_contract.php
          tests/unit/gov_book_two_surface_visual_contract.php
          tests/unit/inbox_closeout_ux_r2_contract.php
          tests/unit/p01_frontstage_local_management_r3_contract.php
          tests/unit/p01_frontstage_local_management_r4_contract.php
          tests/unit/p01_frontstage_local_management_r5_contract.php
          tests/unit/p01_frontstage_local_management_r6_contract.php
          tests/unit/p01_frontstage_local_management_r7_contract.php
          tests/unit/p01_ia_v2_r3_frontstage_contract.php
          tests/unit/p01_ia_v2_r6_gov_source_ownership_contract.php
          tests/unit/p01_ia_v3_r4_frontstage_source_boundary_contract.php
          tests/unit/p01_local_management_r1_contract.php
          tests/unit/p01_local_management_r2_contract.php
          tests/unit/p01_r7_daily_detour_closure_contract.php
          tests/unit/p01_scalable_workspace_ia_v4_contract.php
          tests/unit/pending_ai_governance_return_contract.php
          tests/unit/pending_governance_context_contract.php
          tests/unit/project_github_sync_v247177_contract.php
          tests/unit/projects_guest_zero_public_scope_v247390_contract.php
          tests/unit/six_resource_frontend_admin_bridge_contract.php
          SUITES
          echo "LEGACY_CONTRACT_FAILED_COUNT=$failed"
          test "$failed" -eq 0
