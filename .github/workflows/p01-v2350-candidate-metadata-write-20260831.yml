name: P01 V2.35.0 Candidate Metadata Write

on:
  push:
    branches: [release/p01-v2350-orchestrator-20260831]
    paths: [.github/workflows/p01-v2350-candidate-metadata-write-20260831.yml]

permissions:
  contents: read

jobs:
  write:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact P01 candidate branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: release/v2.35.0-candidate-20260831
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product

      - name: Exact metadata base fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "34e85474b737cb4e95e3dc987d0324105095a080"
          test "$(cat product/VERSION)" = "2.35.0"
          test "$(git -C product rev-parse HEAD^)" = "cc2ee6e819e911021e7fb6e18b1f33e8a00443e0"
          echo P01_V2350_METADATA_BASE=PASS

      - name: Prepend V2.35.0 candidate changelog
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('product/CHANGELOG.md')
          old = p.read_text(encoding='utf-8')
          marker = '## V2.35.0 · Release Candidate · 2026-08-31'
          if old.startswith(marker):
              raise SystemExit('V2.35.0 section already exists; refusing duplicate prepend')
          section = (
              '## V2.35.0 · Release Candidate · 2026-08-31\n\n'
              '- 完成 V2.34 之后的五域 UX/UI 一致性收口：Home / 全局资源域导航 / Sidebar / Add/Edit Drawer / Feedback / Empty State / Private protected state / Mobile command row / Desktop bulkbar 统一到同一 Workspace 视觉与交互 Authority。\n'
              '- 中宽度与移动端进一步收敛：900–1100px 工具条采用受控换行，390px 保持既有移动布局；桌面批量操作恢复单行/分层组合，不再出现 shrink-to-fit、挤压或横向溢出。\n'
              '- Feedback 语义统一：Success 使用 status/polite，Error 使用 alert/assertive；真正的资源域空状态与搜索/筛选无结果分别给出上下文文案。\n'
              '- “私人”统一为受保护状态而不是 warning/error；Watch 私人标签恢复紧凑 pill；Dark Watch 清除硬编码浅色 poster / favorite state。\n'
              '- Topics 专题卡从旧 `--vf-*` 浅色 fallback 切换到当前 `--ws-*` theme tokens，Dark Mode 的 card / cover / selection surface 与其余四域完成一致性收口。\n'
              '- Product Complete Source=`cc2ee6e819e911021e7fb6e18b1f33e8a00443e0` / Tree=`fd722846bd280459466ab1650afc5f4958f6e934`；Schema 保持 `2026082901`，无 Migration。\n'
              '- 最终五域视觉 Sweep `33330543623` PASS：Home / Start / Channels / Watch / Topics × 1440/390 × Light/Dark 共 20 张稳定帧，Exact Source / Fresh Runtime / Chromium / overflow 检查与人眼复核均通过；Artifact=`9737517140` / Digest=`sha256:ea032cdc1e43a912f2d8058670de904c2f2c265d3fcdbf802aeea263770a773d`。\n'
              '- Candidate 版本推进为 `2.35.0`；当前仅进入 V2.35 Formal Release Gate，main / Tag / GitHub Release / core-updates / Owner Production 均尚未修改。\n\n'
          )
          p.write_text(section + old, encoding='utf-8')
          PY
          git -C product diff --check
          git -C product diff -- CHANGELOG.md VERSION

      - name: Commit candidate metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C product config user.name VictorForge
          git -C product config user.email llhzx2018@gmail.com
          git -C product add CHANGELOG.md
          git -C product commit -m 'chore(P01): record V2.35.0 release candidate'
          git -C product push origin HEAD:release/v2.35.0-candidate-20260831
          echo "P01_V2350_CANDIDATE_SOURCE=$(git -C product rev-parse HEAD)"
          echo "P01_V2350_CANDIDATE_TREE=$(git -C product rev-parse HEAD^{tree})"
          echo P01_V2350_METADATA_WRITE=PASS
