name: P01 V2.35.1 Formal Source Metadata Closure

on:
  push:
    branches: [release/p01-v2350-orchestrator-20260831]
    paths: [.github/workflows/p01-v2350-candidate-metadata-write-20260831.yml]

permissions:
  contents: read

jobs:
  write:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE: 24f415367108499560ac6989b5ac1ae460cc140e
      BRANCH: release/v2.35.1-formal-source-20260831
      RUNTIME_TREE: 3cdfa02d8c19ae5e771b7d4abff69a670ac4396c
      OLD_CHANGELOG_BLOB: 0c216a61752a2de8f2f612db08534522ee0a1a7c
    steps:
      - name: Checkout exact formal-source branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product

      - name: Exact formal metadata base fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$BASE"
          test "$(git -C product rev-parse HEAD:src)" = "$RUNTIME_TREE"
          test "$(cat product/VERSION)" = '2.35.1'
          test "$(cat product/src/VERSION.txt)" = '2.35.1'
          grep -Fx "define('VF_VERSION', '2.35.1');" product/src/app/bootstrap.php >/dev/null
          test "$(git -C product hash-object CHANGELOG.md)" = "$OLD_CHANGELOG_BLOB"
          echo P01_V2351_FORMAL_METADATA_BASE=PASS

      - name: Prepend V2.35.1 changelog without touching history
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('product/CHANGELOG.md')
          old=p.read_bytes()
          marker=b'## V2.35.1 \xc2\xb7 Patch Release Candidate \xc2\xb7 2026-08-31\n'
          if old.startswith(marker): raise SystemExit('duplicate V2.35.1 changelog')
          section=(
          '## V2.35.1 · Patch Release Candidate · 2026-08-31\n\n'
          '- 收口 V2.35.0 发布后的四批已验证 UX：Topic 无封面 fallback、Watch 无海报 fallback、Home 移动端 Recent=0 空态密度、Home 网址健康任务优先级。\n'
          '- Topic / Watch 只改变无真实封面/海报时的 fallback identity；已有图片路径保持不变。\n'
          '- Home 移动端仅在 Recent 真正为空时压缩空态；非空 Recent 与桌面原结构保持不变。\n'
          '- Home 任务优先级复用现有 VfLinkHealth Authority：存在 needsAction / restrictedReview 时首卡显示“网址健康”并前置 Health Rail；健康清零时恢复“归属建议”。\n'
          '- Home Action Priority Gate `33338635840` PASS；最终五域 Sweep `33338822193` PASS。\n'
          '- V2.35.1 Candidate Readiness `33339734236` PASS：真实 `2.35.0 → 2.35.1` Atomic Upgrade、40 条数据保留、幂等、repair self-test、Fresh Install、五域 HTTP、CLI / Surface / SQLite/FK 全部通过。\n'
          '- Schema 保持 `2026082901`，无 Migration；Owner Production 当前仍为 V2.35.0，本次 Metadata Closure 不写 Production。\n\n'
          ).encode('utf-8')
          new=section+old
          assert new[len(section):]==old
          p.write_bytes(new)
          Path('/tmp/p01-v2351-section.bin').write_bytes(section)
          PY
          python3 - <<'PY'
          from pathlib import Path
          new=Path('product/CHANGELOG.md').read_bytes(); sec=Path('/tmp/p01-v2351-section.bin').read_bytes()
          import subprocess
          tail=new[len(sec):]
          Path('/tmp/p01-v2351-old-tail').write_bytes(tail)
          got=subprocess.check_output(['git','-C','product','hash-object','/tmp/p01-v2351-old-tail'],text=True).strip()
          assert got=='0c216a61752a2de8f2f612db08534522ee0a1a7c', (got,'historical changelog drift')
          print('P01_V2351_CHANGELOG_PREPEND_ONLY=PASS')
          PY

      - name: Write Candidate Readiness evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >product/docs/evidence/P01_V2.35.1_CANDIDATE_READINESS_20260831.md <<'EOF'
          # P01 · V2.35.1 Candidate Readiness · 2026-08-31

          ```text
          Candidate Source: 0a0196358b2684dc1d542e78af9c6e04fe2c7c22
          Candidate Tree: db1d4c9b93184f25049a1fa6cf9262c1b872494c
          Candidate Runtime Tree: 3cdfa02d8c19ae5e771b7d4abff69a670ac4396c
          Source Version: 2.35.0
          Target Version: 2.35.1
          Schema: 2026082901
          Migration: NONE
          Candidate Readiness Run: 33339734236 / PASS
          Evidence Artifact: 9740156340
          Evidence Digest: sha256:14bbbaa03479e1b6e7fed1dda0627e6b3328b355f219674db210f3c89a22712f
          Unpublished Candidate Artifact: 9740156830
          Unpublished Artifact Digest: sha256:d293b64559eb2e68d57c2a3b03b63d88d850a126a164f08f19a2004b541ee084
          Actual Atomic Upgrade: 2.35.0 -> 2.35.1 / PASS
          Data Preservation: PASS
          Idempotence: PASS
          Repair Self-test: PASS
          Fresh Install: PASS
          Five-domain HTTP: PASS
          CLI / Surface / SQLite-FK: PASS
          Owner Production Write: NO
          ```

          Candidate Readiness authorizes Formal Artifact Gate only. It does not create main, Tag, GitHub Release, core-updates publication, or Owner Production mutation.
          EOF
          sed -i 's/^          //' product/docs/evidence/P01_V2.35.1_CANDIDATE_READINESS_20260831.md

      - name: Commit formal-source metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD:src)" = "$RUNTIME_TREE"
          mapfile -t files < <(git -C product status --porcelain | sed -E 's/^.. //')
          printf '%s\n' "${files[@]}" | sort > /tmp/actual
          printf '%s\n' CHANGELOG.md docs/evidence/P01_V2.35.1_CANDIDATE_READINESS_20260831.md | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          git -C product diff --check
          git -C product config user.name VictorForge
          git -C product config user.email llhzx2018@gmail.com
          git -C product add CHANGELOG.md docs/evidence/P01_V2.35.1_CANDIDATE_READINESS_20260831.md
          git -C product commit -m 'release(P01): close V2.35.1 candidate readiness metadata'
          git -C product push origin HEAD:$BRANCH
          test "$(git -C product rev-parse HEAD:src)" = "$RUNTIME_TREE"
          echo "P01_V2351_FORMAL_SOURCE=$(git -C product rev-parse HEAD)"
          echo "P01_V2351_FORMAL_TREE=$(git -C product rev-parse HEAD^{tree})"
          echo "P01_V2351_RUNTIME_TREE=$(git -C product rev-parse HEAD:src)"
          echo P01_V2351_FORMAL_METADATA_CLOSURE=PASS
