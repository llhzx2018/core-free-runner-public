name: R100 Final Closure

on:
  pull_request:
    paths:
      - '.github/workflows/r100-final-closure.yml'

permissions:
  contents: read

jobs:
  final-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SHA: 88f850650c0da1d3ade8ae5c5e74574b17bac8f3
    steps:
      - name: Checkout exact P01 main
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.EXPECTED_SHA }}
          path: vf-start
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_sqlite,sqlite3,curl
          coverage: none

      - name: Verify exact source and aggregate closure contracts
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git -C vf-start rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          test "$(tr -d '\r\n' < vf-start/VERSION)" = "2.47.0"

          php -l vf-start/src/app/SubjectPageChrome.php
          php -l vf-start/src/app/ChannelLibraryPage.php
          php -l vf-start/src/app/CourseLibraryPage.php
          php -l vf-start/src/app/ProjectActionCenterPage.php
          php -l vf-start/src/app/ToolProductPage.php
          php -l vf-start/src/app/SoftwareProductPage.php
          node --check vf-start/src/assets/workspace.js
          node --check vf-start/src/assets/course-experience.js

          TESTS=(
            consolidated_product_acceptance_contract.php
            topic_course_search_chip_count_contract.php
            watch_cross_filter_count_contract.php
            subject_filter_reset_contract.php
            subject_invalid_kind_query_contract.php
            course_continue_context_contract.php
            subject_domain_nav_shell_contract.php
            mobile_product_controls_contract.php
            workspace_atomic_form_routing_contract.php
            add_kind_context_continuity_contract.php
            favorite_add_context_contract.php
            primary_open_semantics_contract.php
            scope_context_count_contract.php
            full_surface_governance_privacy_monotonic_source_contract.php
            project_signals_contract.php
            project_signals_source_contract.php
            course_experience_source_contract.php
            tool_home_source_contract.php
            software_workspace_source_contract.php
            home_signal_quality_contract.php
            uxui_round8_visual_system_contract.php
            resource_image_delivery_contract.php
            attachment_error_visibility_contract.php
          )
          for t in "${TESTS[@]}"; do
            php -l "vf-start/tests/unit/$t"
            php "vf-start/tests/unit/$t"
          done

          echo R100_FINAL_CLOSURE_GATE_PASS
          echo R100_EXACT_MAIN_GATE_PASS

      - name: Cleanup private source
        if: always()
        shell: bash
        run: rm -rf vf-start
