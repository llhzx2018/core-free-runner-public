name: P06 VF Press V0.1.8 Temporary Formal Release

on:
  pull_request:
    paths:
      - .github/workflows/temp-p06-ai-book-slice2.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p06-v018-formal-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_REPO: llhzx2018/vf-press
      SOURCE_SHA: 1a17c8d7183e4e6f3cf8a8110361cb0f8a68b9cb
      VERSION: 0.1.8
      TAG: v0.1.8
      CORE_REPO: llhzx2018/core-updates
    steps:
      - name: Require registered release capabilities
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"
          echo PRIVATE_READ_CAPABILITY=PASS
          echo RELEASE_WRITE_CAPABILITY=PASS

      - name: Checkout exact release candidate source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Checkout core-updates channel
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.CORE_REPO }}
          ref: main
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: core-updates

      - name: Prepare release runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 php-mbstring php-zip php-curl sqlite3 composer >/dev/null
          php -v
          composer --version
          command -v gh
          echo MACHINE_RUNTIME=PASS

      - name: Exact source and authority release gate
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "$VERSION"
          test "$(jq -r .version VF_PROJECT.json)" = "$VERSION"
          test "$(jq -r .schema VF_PROJECT.json)" = '3'
          test "$(jq -r .current_phase VF_PROJECT.json)" = 'ADMIN_SHELL_UNIFICATION_VERIFIED_RELEASE_CANDIDATE'
          test "$(jq -r .next_gate VF_PROJECT.json)" = 'FORMAL_RELEASE_V0_1_8'
          test "$(jq -r .release_gates.owner_preview_runtime_applicability VF_PROJECT.json)" = 'N/A'
          test -n "$(jq -r .release_gates.owner_preview_runtime_reason VF_PROJECT.json)"
          test "$(jq -r .release_gates.owner_formal_release_approval VF_PROJECT.json)" = 'PASS'
          test "$(jq -r .release_gates.six_center_admin_shell)" = 'PASS_MACHINE_EXACT_SOURCE_RUN_32725409369'
          test "$(jq -r .product_gates.quality_center)" = 'PASS_MACHINE_EXACT_SOURCE'
          test "$(jq -r .product_gates.system_center_controller_split)" = 'PASS_MACHINE_EXACT_SOURCE'
          echo EXACT_RELEASE_SOURCE=PASS
          echo AUTHORITY_RELEASE_GATE=PASS
          echo PRE_RELEASE_AUTHORITY_DRIFT_GATE=PASS
          echo PRODUCTION_WRITE=0

      - name: Composer, PHP syntax and complete regression
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          composer validate --strict
          composer dump-autoload --no-dev --optimize --no-interaction
          find src bin public -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          rm -rf storage dist storage-restore-*
          php bin/migrate.php | grep -Fq MIGRATION_PASS
          test "$(sqlite3 storage/app.db 'SELECT MAX(version) FROM schema_migrations;')" = '3'
          php bin/self-test.php | grep -Fq FOUNDATION_SELF_TEST_PASS
          php bin/security-self-test.php | grep -Fq SECURITY_SELF_TEST_PASS
          php bin/research-self-test.php | grep -Fq RESEARCH_SELF_TEST_PASS
          php bin/publication-self-test.php | grep -Fq PUBLICATION_MANUSCRIPT_SELF_TEST=PASS
          php bin/markdown-import-self-test.php | grep -Fq MARKDOWN_IMPORT_SELF_TEST=PASS
          php bin/reader-self-test.php | grep -Fq PUBLISHER_READER_SELF_TEST=PASS
          php bin/edition-self-test.php | grep -Fq EDITION_SELF_TEST=PASS
          php bin/living-publishing-self-test.php | grep -Fq LIVING_PUBLISHING_SELF_TEST=PASS
          php bin/operations-self-test.php | grep -Fq OPERATIONS_SELF_TEST=PASS
          php bin/operations-ui-self-test.php | grep -Fq OPERATIONS_UI_SELF_TEST=PASS
          php bin/admin-shell-book-overview-self-test.php | grep -Fq ADMIN_SHELL_BOOK_OVERVIEW_SELF_TEST=PASS
          php bin/admin-shell-unification-self-test.php | grep -Fq ADMIN_SHELL_UNIFICATION_SELF_TEST=PASS
          php bin/book-outline-self-test.php | grep -Fq BOOK_OUTLINE_SELF_TEST=PASS
          php bin/public-asset-self-test.php | grep -Fq PUBLIC_ASSET_HTTP_SELF_TEST=PASS
          php bin/job-self-test.php | grep -Fq JOB_QUEUE_SELF_TEST=PASS
          php bin/update-self-test.php | grep -Fq UPDATE_SELF_TEST=PASS
          php -r '$pdo=new PDO("sqlite:storage/app.db"); if($pdo->query("PRAGMA integrity_check")->fetchColumn()!=="ok") exit(1); if($pdo->query("PRAGMA foreign_key_check")->fetchAll()!==[]) exit(2);'
          rm -rf storage dist storage-restore-*
          test -z "$(git status --short --untracked-files=all)"
          echo EXACT_SOURCE_FULL_REGRESSION=PASS
          echo SIX_CENTER_ADMIN_SHELL=PASS
          echo PRODUCT_REPOSITORY_CLEAN=PASS

      - name: Build exact formal assets
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT=/tmp/p06-v018-release
          rm -rf "$OUT"
          mkdir -p "$OUT"
          php bin/build-release.php "$OUT" | tee /tmp/p06-v018-release-build
          grep -Fq RELEASE_BUILD=PASS /tmp/p06-v018-release-build
          (cd "$OUT" && sha256sum -c SHA256SUMS.txt)
          FULL="$OUT/VF_Press_V0.1.8_FULL.zip"
          UPDATE="$OUT/VF_Press_V0.1.8_UPDATE.zip"
          test -s "$FULL" && test -s "$UPDATE"
          test "$(jq -r .version "$OUT/RELEASE_INFO.json")" = "$VERSION"
          test "$(jq -r .schema "$OUT/RELEASE_INFO.json")" = '3'
          unzip -p "$UPDATE" VF_UPDATE.json >/tmp/p06-v018-update.json
          test "$(jq -r .target_version /tmp/p06-v018-update.json)" = "$VERSION"
          unzip -l "$UPDATE" | grep -Fq 'payload/src/Http/Studio/QualityController.php'
          unzip -l "$UPDATE" | grep -Fq 'payload/src/Http/Studio/AdminShell.php'
          unzip -l "$UPDATE" | grep -Fq 'payload/bin/admin-shell-unification-self-test.php'
          echo "FULL_BYTES=$(stat -c%s "$FULL")" >> "$GITHUB_ENV"
          echo "FULL_SHA=$(sha256sum "$FULL" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "UPDATE_BYTES=$(stat -c%s "$UPDATE")" >> "$GITHUB_ENV"
          echo "UPDATE_SHA=$(sha256sum "$UPDATE" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo FORMAL_ASSET_BUILD=PASS

      - name: Publish and remote-readback formal GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          OUT=/tmp/p06-v018-release
          NOTES=/tmp/p06-v018-notes.md
          printf '%s\n' \
            '## VF Press V0.1.8 · 六中心统一后台' \
            '' \
            '- 总览、书籍、研究与素材、质量、出版、系统统一使用同一 AdminShell。' \
            '- 新增真实质量中心；系统中心改为 canonical 独立路由。' \
            '- 研究与出版保留完整工作流，但移除旧独立页面骨架。' \
            '- Reader 与专注写作 Studio 继续保留独立任务场景。' \
            '- Schema 保持 3；AI Candidate 不覆盖 Accepted Canonical Markdown。' \
            '' \
            '本发布不写入 Production；安装更新与 OWNER 运行时视觉验收是独立步骤。' > "$NOTES"

          if gh release view "$TAG" --repo "$SOURCE_REPO" >/dev/null 2>&1; then
            TAG_SHA=$(gh api "repos/$SOURCE_REPO/git/ref/tags/$TAG" --jq .object.sha)
            test "$TAG_SHA" = "$SOURCE_SHA"
            gh release upload "$TAG" "$OUT/VF_Press_V0.1.8_FULL.zip" "$OUT/VF_Press_V0.1.8_UPDATE.zip" "$OUT/SHA256SUMS.txt" "$OUT/RELEASE_INFO.json" --repo "$SOURCE_REPO" --clobber
          else
            gh release create "$TAG" "$OUT/VF_Press_V0.1.8_FULL.zip" "$OUT/VF_Press_V0.1.8_UPDATE.zip" "$OUT/SHA256SUMS.txt" "$OUT/RELEASE_INFO.json" --repo "$SOURCE_REPO" --target "$SOURCE_SHA" --title "VF Press V0.1.8 · Unified Six-Center AdminShell" --notes-file "$NOTES"
          fi

          RELEASE_JSON=$(gh api "repos/$SOURCE_REPO/releases/tags/$TAG")
          test "$(jq -r .draft <<<"$RELEASE_JSON")" = false
          test "$(jq -r .prerelease <<<"$RELEASE_JSON")" = false
          test "$(jq -r .tag_name <<<"$RELEASE_JSON")" = "$TAG"
          test "$(gh api "repos/$SOURCE_REPO/git/ref/tags/$TAG" --jq .object.sha)" = "$SOURCE_SHA"

          READBACK=/tmp/p06-v018-readback
          rm -rf "$READBACK"
          mkdir -p "$READBACK"
          gh release download "$TAG" --repo "$SOURCE_REPO" --dir "$READBACK"
          test "$(stat -c%s "$READBACK/VF_Press_V0.1.8_FULL.zip")" = "$FULL_BYTES"
          test "$(sha256sum "$READBACK/VF_Press_V0.1.8_FULL.zip" | awk '{print $1}')" = "$FULL_SHA"
          test "$(stat -c%s "$READBACK/VF_Press_V0.1.8_UPDATE.zip")" = "$UPDATE_BYTES"
          test "$(sha256sum "$READBACK/VF_Press_V0.1.8_UPDATE.zip" | awk '{print $1}')" = "$UPDATE_SHA"
          (cd "$READBACK" && sha256sum -c SHA256SUMS.txt)
          echo "RELEASE_URL=$(jq -r .html_url <<<"$RELEASE_JSON")" >> "$GITHUB_ENV"
          echo FORMAL_RELEASE_REMOTE_READBACK=PASS

      - name: Publish core-updates P06 manifest
        working-directory: core-updates
        shell: bash
        run: |
          set -Eeuo pipefail
          RELEASED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq -n --arg version "$VERSION" --arg tag "$TAG" --arg sha "$UPDATE_SHA" --arg released_at "$RELEASED_AT" --arg source_sha "$SOURCE_SHA" --argjson bytes "$UPDATE_BYTES" '{
            schema_version:"1.0",
            project_id:"P06",
            component_id:"APP",
            enabled:true,
            target_version:$version,
            update_type:"ATOMIC",
            from_versions:["0.1.7"],
            schema_from:"3",
            schema_to:"3",
            repository:"llhzx2018/vf-press",
            release_tag:$tag,
            asset_name:"VF_Press_V0.1.8_UPDATE.zip",
            asset_bytes:$bytes,
            asset_sha256:$sha,
            backup_required:true,
            rollback_supported:true,
            minimum_php:"8.2.0",
            released_at:$released_at,
            product_identity:"VF Press / P06",
            notes:("V0.1.8 unifies the six backend centers under one AdminShell and adds canonical Quality and System routes. Schema remains 3. Formal release and remote asset readback bind exact source SHA " + $source_sha + ".")
          }' > projects/P06.json
          jq -e '.project_id=="P06" and .target_version=="0.1.8" and .update_type=="ATOMIC" and .from_versions==["0.1.7"] and .schema_from=="3" and .schema_to=="3" and .backup_required==true and .rollback_supported==true and .asset_bytes>0 and (.asset_sha256|test("^[a-f0-9]{64}$"))' projects/P06.json >/dev/null
          git config user.name 'VF Public Runner'
          git config user.email 'vf-public-runner@users.noreply.github.com'
          git add projects/P06.json
          git commit -m "release(P06): publish V0.1.8 update manifest"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "MANIFEST_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo CORE_UPDATES_MANIFEST_PUBLISHED=PASS

      - name: Verify online discovery contract
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$CORE_REPO/contents/projects/P06.json?ref=main" --jq .content | tr -d '\n' | base64 -d >/tmp/P06-online.json
          jq -e --arg sha "$UPDATE_SHA" --argjson bytes "$UPDATE_BYTES" '.target_version=="0.1.8" and .update_type=="ATOMIC" and .from_versions==["0.1.7"] and .schema_from=="3" and .schema_to=="3" and .release_tag=="v0.1.8" and .asset_bytes==$bytes and .asset_sha256==$sha' /tmp/P06-online.json >/dev/null
          cd source
          php -r 'require "vendor/autoload.php"; $m=json_decode(file_get_contents("/tmp/P06-online.json"),true,512,JSON_THROW_ON_ERROR); $r=(new CoreUpdates\UpdateCore("P06"))->check("0.1.7","3",$m); if(($r["status"]??"")!=="AVAILABLE"){fwrite(STDERR,json_encode($r));exit(1);} echo "ONLINE_DISCOVERY=AVAILABLE\n";'
          echo ONLINE_UPDATE_DISCOVERY=PASS
          echo FORMAL_RELEASE=PASS
          echo OWNER_RUNTIME_VISUAL_REVIEW=PENDING
          echo PRODUCTION_WRITE=NO
