name: P06 VF Press V0.1.10 Temporary Exact Source Verification

on:
  pull_request:
    paths:
      - .github/workflows/temp-p06-ai-book-slice2.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p06-v0110-reader-studio-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_REPO: llhzx2018/vf-press
      SOURCE_SHA: a80858b263612aa108209183226d40f92de346ee
      VERSION: 0.1.10
    steps:
      - name: Require registered private-read capability
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo PRIVATE_READ_CAPABILITY=PASS

      - name: Checkout exact candidate source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Prepare PHP runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 php-mbstring php-zip php-curl sqlite3 composer >/dev/null
          php -v
          composer --version
          echo MACHINE_RUNTIME=PASS

      - name: Exact source and authority gate
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "$VERSION"
          test "$(jq -r .version VF_PROJECT.json)" = "$VERSION"
          test "$(jq -r .lifecycle VF_PROJECT.json)" = 'CANDIDATE'
          test "$(jq -r .schema VF_PROJECT.json)" = '3'
          test "$(jq -r .current_phase VF_PROJECT.json)" = 'V0_1_10_READER_STUDIO_UX_REMEDIATION_CANDIDATE'
          test "$(jq -r .next_gate VF_PROJECT.json)" = 'EXACT_SOURCE_RUNNER_THEN_FORMAL_RELEASE'
          test "$(jq -r .production_update_state.observed_runtime_version VF_PROJECT.json)" = '0.1.9'
          test "$(jq -r .release_gates.reader_studio_ux_v0_1_10 VF_PROJECT.json)" = 'CANDIDATE_EXACT_SOURCE_RUN_PENDING'
          echo EXACT_CANDIDATE_SOURCE=PASS
          echo AUTHORITY_DRIFT_GATE=PASS
          echo SCHEMA_MIGRATION=NO
          echo PRODUCTION_WRITE=NO

      - name: PHP syntax and complete regression
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          composer validate --strict
          composer dump-autoload --no-dev --optimize --no-interaction
          find src bin public -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          rm -rf storage dist storage-restore-*
          php bin/migrate.php | grep -Fq MIGRATION_PASS
          test "$(sqlite3 storage/app.db 'SELECT MAX(version) FROM schema_migrations;')" = '3'
          php bin/self-test.php | grep -Fq FOUNDATION_SELF_TEST_PASS
          php bin/security-self-test.php | grep -Fq SECURITY_SELF_TEST_PASS
          php bin/research-self-test.php | grep -Fq RESEARCH_SELF_TEST_PASS
          php bin/publication-self-test.php | grep -Fq PUBLICATION_MANUSCRIPT_SELF_TEST=PASS
          php bin/markdown-import-self-test.php | grep -Fq MARKDOWN_IMPORT_SELF_TEST=PASS
          php bin/reader-self-test.php | tee /tmp/p06-v0110-reader
          grep -Fq PUBLISHER_READER_SELF_TEST=PASS /tmp/p06-v0110-reader
          grep -Fq LEGACY_DEMO_MARKDOWN_REPAIR=PASS /tmp/p06-v0110-reader
          php bin/reader-ux-self-test.php | tee /tmp/p06-v0110-reader-ux
          grep -Fq READER_UX_SELF_TEST=PASS /tmp/p06-v0110-reader-ux
          grep -Fq DIRECT_PRIVATE_READING=PASS /tmp/p06-v0110-reader-ux
          grep -Fq FOCUSED_STUDIO=PASS /tmp/p06-v0110-reader-ux
          php bin/edition-self-test.php | grep -Fq EDITION_SELF_TEST=PASS
          php bin/living-publishing-self-test.php | grep -Fq LIVING_PUBLISHING_SELF_TEST=PASS
          php bin/operations-self-test.php | grep -Fq OPERATIONS_SELF_TEST=PASS
          php bin/operations-ui-self-test.php | grep -Fq OPERATIONS_UI_SELF_TEST=PASS
          php bin/admin-shell-book-overview-self-test.php | grep -Fq ADMIN_SHELL_BOOK_OVVIEW_SELF_TEST=PASS || php bin/admin-shell-book-overview-self-test.php | grep -Fq ADMIN_SHELL_BOOK_OVERVIEW_SELF_TEST=PASS
          php bin/admin-shell-unification-self-test.php | grep -Fq ADMIN_SHELL_UNIFICATION_SELF_TEST=PASS
          php bin/book-outline-self-test.php | grep -Fq BOOK_OUTLINE_SELF_TEST=PASS
          php bin/demo-data-self-test.php | tee /tmp/p06-v0110-demo
          grep -Fq DEMO_DATA_INSTALL=PASS /tmp/p06-v0110-demo
          grep -Fq DEMO_CANONICAL_MARKDOWN_READBACK=PASS /tmp/p06-v0110-demo
          grep -Fq DEMO_DATA_ISOLATED_REMOVE=PASS /tmp/p06-v0110-demo
          php bin/public-asset-self-test.php | grep -Fq PUBLIC_ASSET_HTTP_SELF_TEST=PASS
          php bin/job-self-test.php | grep -Fq JOB_QUEUE_SELF_TEST=PASS
          php bin/update-self-test.php | grep -Fq UPDATE_SELF_TEST=PASS
          php -r '$pdo=new PDO("sqlite:storage/app.db"); if($pdo->query("PRAGMA integrity_check")->fetchColumn()!=="ok") exit(1); if($pdo->query("PRAGMA foreign_key_check")->fetchAll()!==[]) exit(2);'
          rm -rf storage dist storage-restore-*
          test -z "$(git status --short --untracked-files=all)"
          echo EXACT_SOURCE_FULL_REGRESSION=PASS
          echo READER_STUDIO_UX_REMEDIATION=PASS
          echo PRODUCT_REPOSITORY_CLEAN=PASS

      - name: Build candidate assets without publishing
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT=/tmp/p06-v0110-candidate
          rm -rf "$OUT"
          mkdir -p "$OUT"
          php bin/build-release.php "$OUT" | tee /tmp/p06-v0110-build
          grep -Fq RELEASE_BUILD=PASS /tmp/p06-v0110-build
          (cd "$OUT" && sha256sum -c SHA256SUMS.txt)
          FULL="$OUT/VF_Press_V0.1.10_FULL.zip"
          UPDATE="$OUT/VF_Press_V0.1.10_UPDATE.zip"
          test -s "$FULL"
          test -s "$UPDATE"
          test "$(jq -r .version "$OUT/RELEASE_INFO.json")" = "$VERSION"
          test "$(jq -r .schema "$OUT/RELEASE_INFO.json")" = '3'
          unzip -l "$UPDATE" | grep -Fq 'payload/public/assets/reader.css'
          unzip -l "$UPDATE" | grep -Fq 'payload/public/assets/reader.js'
          unzip -l "$UPDATE" | grep -Fq 'payload/src/Support/MarkdownTextNormalizer.php'
          unzip -l "$UPDATE" | grep -Fq 'payload/bin/reader-ux-self-test.php'
          echo CANDIDATE_ASSET_BUILD=PASS
          echo FORMAL_RELEASE=NO
          echo PRODUCTION_WRITE=NO
