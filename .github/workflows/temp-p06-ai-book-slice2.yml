name: P06 Six-Center AdminShell Exact Source

on:
  pull_request:
    paths:
      - .github/workflows/temp-p06-ai-book-slice2.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p06-six-center-admin-shell
  cancel-in-progress: true

jobs:
  exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_REPO: llhzx2018/vf-press
      SOURCE_SHA: a792f6de1152c6740e1e26064b3f84f4d8f414f2
    steps:
      - name: Require private read capability
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo PRIVATE_READ_CAPABILITY=PASS

      - name: Checkout exact canonical source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Prepare PHP SQLite runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 php-mbstring php-zip php-curl sqlite3 composer >/dev/null
          php -v
          composer --version
          echo MACHINE_RUNTIME=PASS

      - name: Exact source identity and static gates
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' < VERSION)" = '0.1.7'
          test "$(jq -r .schema VF_PROJECT.json)" = '3'
          composer validate --strict
          composer dump-autoload --no-dev --optimize --no-interaction
          find src bin public -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php bin/operations-ui-self-test.php
          php bin/admin-shell-book-overview-self-test.php
          php bin/admin-shell-unification-self-test.php
          echo PHP_LINT=PASS
          echo ADMIN_SHELL_STATIC_CONTRACT=PASS

      - name: Fresh Schema 3 runtime regression
        working-directory: source
        shell: bash
        env:
          VF_PRESS_STORAGE_PATH: /tmp/p06-admin-shell-storage
          VF_PRESS_DB_PATH: /tmp/p06-admin-shell-storage/app.db
        run: |
          set -Eeuo pipefail
          rm -rf "$VF_PRESS_STORAGE_PATH"
          php bin/migrate.php | tee /tmp/p06-migrate.log
          grep -Fq MIGRATION_PASS /tmp/p06-migrate.log
          test "$(sqlite3 "$VF_PRESS_DB_PATH" 'SELECT MAX(version) FROM schema_migrations;')" = '3'
          test "$(sqlite3 "$VF_PRESS_DB_PATH" 'PRAGMA integrity_check;')" = 'ok'
          test -z "$(sqlite3 "$VF_PRESS_DB_PATH" 'PRAGMA foreign_key_check;')"
          php bin/self-test.php
          php bin/security-self-test.php
          php bin/research-self-test.php
          php bin/publication-self-test.php
          php bin/markdown-import-self-test.php
          php bin/reader-self-test.php
          php bin/edition-self-test.php
          php bin/living-publishing-self-test.php
          php bin/operations-self-test.php
          php bin/book-outline-self-test.php
          php bin/public-asset-self-test.php
          php bin/update-self-test.php
          test "$(sqlite3 "$VF_PRESS_DB_PATH" 'PRAGMA integrity_check;')" = 'ok'
          test -z "$(sqlite3 "$VF_PRESS_DB_PATH" 'PRAGMA foreign_key_check;')"
          echo FULL_PRODUCT_REGRESSION=PASS
          echo SCHEMA_3_INTEGRITY=PASS
          echo PRODUCTION_WRITE=NO
