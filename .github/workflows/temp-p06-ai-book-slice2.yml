name: P06 AI Book Slice 2 Schema 3 Exact Source Gate

on:
  pull_request:
    paths:
      - .github/workflows/temp-p06-ai-book-slice2.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p06-ai-book-slice2-schema3
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_REPO: llhzx2018/vf-press
      SOURCE_SHA: 5d12140bc39885c5f0001fba90debcf17ce60cc4
    steps:
      - name: Require private read capability
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo PRIVATE_READ_CAPABILITY=PASS

      - name: Checkout exact P06 source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Prepare PHP SQLite runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 php-mbstring php-zip php-curl sqlite3 composer >/dev/null
          php -v
          composer --version
          echo MACHINE_RUNTIME=PASS

      - name: Source and authority gate
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' < VERSION)" = '0.1.6'
          test "$(jq -r .version VF_PROJECT.json)" = '0.1.6'
          test "$(jq -r .schema VF_PROJECT.json)" = '3'
          test "$(jq -r .current_phase VF_PROJECT.json)" = 'AI_BOOK_PRODUCTION_SLICE_2_IMPLEMENTED_AWAITING_EXACT_SOURCE_VERIFICATION'
          test "$(jq -r .next_gate VF_PROJECT.json)" = 'SLICE_2_EXACT_SOURCE_REGRESSION'
          test "$(jq -r .release_gates.schema_migration VF_PROJECT.json)" = 'OWNER_AUTHORIZED_SCHEMA_3_REHEARSAL_PASS_IMPLEMENTED_AWAITING_EXACT_SOURCE'
          echo SOURCE_IDENTITY=PASS
          echo AUTHORITY_GATE=PASS
          echo VERSION_BUMP=0
          echo PRODUCTION_WRITE=0

      - name: Composer and PHP syntax
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          composer validate --strict
          composer dump-autoload --no-dev --optimize --no-interaction
          find src bin public -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          echo COMPOSER_VALIDATE=PASS
          echo PHP_SYNTAX=PASS

      - name: Schema 2 to 3 recovery rehearsal
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          UPGRADE_ROOT=/tmp/p06-schema-upgrade
          rm -rf "$UPGRADE_ROOT"
          mkdir -p "$UPGRADE_ROOT/storage"
          UPGRADE_DB="$UPGRADE_ROOT/storage/app.db"
          sqlite3 "$UPGRADE_DB" < database/schema/0001_initial.sql
          sqlite3 "$UPGRADE_DB" < database/schema/0002_security.sql
          sqlite3 "$UPGRADE_DB" "INSERT INTO schema_migrations(version,name,applied_at) VALUES(2,'0002_security','2026-08-24T00:00:00Z');"
          sqlite3 "$UPGRADE_DB" "INSERT INTO publications(id,publication_type,slug,title,lifecycle_status,created_at,updated_at) VALUES('11111111-1111-4111-8111-111111111111','BOOK','migration-sentinel','Schema 2 Sentinel','MANUSCRIPT','2026-08-24T00:00:01Z','2026-08-24T00:00:01Z');"
          sqlite3 "$UPGRADE_DB" "INSERT INTO publication_sections(id,publication_id,section_type,title,position,status,markdown_path,sha256,word_count,created_at,updated_at) VALUES('22222222-2222-4222-8222-222222222222','11111111-1111-4111-8111-111111111111','CHAPTER','Do Not Overwrite',1,'READY','manuscripts/sentinel.md','sentinel-hash',3,'2026-08-24T00:00:02Z','2026-08-24T00:00:02Z');"
          test "$(sqlite3 "$UPGRADE_DB" 'PRAGMA integrity_check;')" = 'ok'
          test -z "$(sqlite3 "$UPGRADE_DB" 'PRAGMA foreign_key_check;')"
          sqlite3 "$UPGRADE_DB" ".backup '$UPGRADE_ROOT/schema2-recovery.sqlite'"
          RECOVERY_SHA="$(sha256sum "$UPGRADE_ROOT/schema2-recovery.sqlite" | cut -d' ' -f1)"
          VF_PRESS_STORAGE_PATH="$UPGRADE_ROOT/storage" VF_PRESS_DB_PATH="$UPGRADE_DB" php bin/migrate.php | tee /tmp/p06-schema3-upgrade
          grep -Fq 'APPLY 0003_ai_book_brief_outline.sql' /tmp/p06-schema3-upgrade
          test "$(sqlite3 "$UPGRADE_DB" 'SELECT MAX(version) FROM schema_migrations;')" = '3'
          test "$(sqlite3 "$UPGRADE_DB" "SELECT title||':'||sha256 FROM publication_sections WHERE id='22222222-2222-4222-8222-222222222222';")" = 'Do Not Overwrite:sentinel-hash'
          test "$(sqlite3 "$UPGRADE_DB" 'PRAGMA integrity_check;')" = 'ok'
          test -z "$(sqlite3 "$UPGRADE_DB" 'PRAGMA foreign_key_check;')"
          VF_PRESS_STORAGE_PATH="$UPGRADE_ROOT/storage" VF_PRESS_DB_PATH="$UPGRADE_DB" php bin/migrate.php | tee /tmp/p06-schema3-repeat
          grep -Fq 'SKIP 0003_ai_book_brief_outline.sql' /tmp/p06-schema3-repeat
          cp "$UPGRADE_ROOT/schema2-recovery.sqlite" "$UPGRADE_ROOT/schema2-restored.sqlite"
          test "$(sha256sum "$UPGRADE_ROOT/schema2-restored.sqlite" | cut -d' ' -f1)" = "$RECOVERY_SHA"
          test "$(sqlite3 "$UPGRADE_ROOT/schema2-restored.sqlite" 'SELECT MAX(version) FROM schema_migrations;')" = '2'
          test "$(sqlite3 "$UPGRADE_ROOT/schema2-restored.sqlite" "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name IN ('book_briefs','book_outline_candidates');")" = '0'
          test "$(sqlite3 "$UPGRADE_ROOT/schema2-restored.sqlite" "SELECT title||':'||sha256 FROM publication_sections WHERE id='22222222-2222-4222-8222-222222222222';")" = 'Do Not Overwrite:sentinel-hash'
          echo RECOVERY_POINT=PASS
          echo SCHEMA_2_TO_3=PASS
          echo REPEAT_MIGRATE=PASS
          echo RESTORE_VERIFICATION=PASS

      - name: Fresh migration and full regression
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf storage dist storage-restore-*
          php bin/migrate.php | tee /tmp/p06-fresh-migration
          grep -Fq 'APPLY 0003_ai_book_brief_outline.sql' /tmp/p06-fresh-migration
          grep -Fq MIGRATION_PASS /tmp/p06-fresh-migration
          php bin/self-test.php | grep -Fq FOUNDATION_SELF_TEST_PASS
          php bin/security-self-test.php | grep -Fq SECURITY_SELF_TEST_PASS
          php bin/research-self-test.php | grep -Fq RESEARCH_SELF_TEST_PASS
          php bin/publication-self-test.php | grep -Fq PUBLICATION_MANUSCRIPT_SELF_TEST=PASS
          php bin/markdown-import-self-test.php | tee /tmp/p06-markdown-import
          grep -Fq MARKDOWN_IMPORT_SELF_TEST=PASS /tmp/p06-markdown-import
          grep -Fq CANONICAL_MARKDOWN_READBACK=PASS /tmp/p06-markdown-import
          grep -Fq OWNER_READER=PASS /tmp/p06-markdown-import
          grep -Fq SCHEMA=3 /tmp/p06-markdown-import
          php bin/reader-self-test.php | grep -Fq PUBLISHER_READER_SELF_TEST=PASS
          php bin/edition-self-test.php | grep -Fq EDITION_SELF_TEST=PASS
          php bin/living-publishing-self-test.php | grep -Fq LIVING_PUBLISHING_SELF_TEST=PASS
          php bin/operations-self-test.php | grep -Fq OPERATIONS_SELF_TEST=PASS
          php bin/operations-ui-self-test.php | grep -Fq OPERATIONS_UI_SELF_TEST=PASS
          php bin/admin-shell-book-overview-self-test.php | grep -Fq ADMIN_SHELL_BOOK_OVERVIEW_SELF_TEST=PASS
          php bin/book-outline-self-test.php | tee /tmp/p06-book-outline
          grep -Fq BOOK_OUTLINE_SELF_TEST=PASS /tmp/p06-book-outline
          grep -Fq OWNER_ACCEPT_REJECT=PASS /tmp/p06-book-outline
          grep -Fq CANONICAL_MARKDOWN_NO_OVERWRITE=PASS /tmp/p06-book-outline
          grep -Fq PROVIDER_OPTIONAL_DEGRADATION=PASS /tmp/p06-book-outline
          php bin/public-asset-self-test.php | grep -Fq PUBLIC_ASSET_HTTP_SELF_TEST=PASS
          php bin/job-self-test.php | grep -Fq JOB_QUEUE_SELF_TEST=PASS
          php bin/update-self-test.php | grep -Fq UPDATE_SELF_TEST=PASS
          php bin/migrate.php | grep -Fq MIGRATION_PASS
          php -r '$pdo=new PDO("sqlite:storage/app.db"); if($pdo->query("PRAGMA integrity_check")->fetchColumn()!=="ok") exit(1); if($pdo->query("PRAGMA foreign_key_check")->fetchAll()!==[]) exit(2); if((int)$pdo->query("SELECT MAX(version) FROM schema_migrations")->fetchColumn()!==3) exit(3); echo "SQLITE_INTEGRITY=PASS\nSCHEMA=3 PASS\n";'
          echo FULL_REGRESSION=PASS

      - name: Product and safety contract
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'class BookGenerationService' src/Application/Publication/BookGenerationService.php
          grep -Fq "['candidate_id' => \$candidateId]" src/Application/Publication/BookGenerationService.php
          grep -Fq "status='PLANNED'" src/Application/Publication/BookGenerationService.php
          grep -Fq 'OWNER Gate cannot overwrite existing Canonical Markdown sections' src/Application/Publication/BookGenerationService.php
          grep -Fq 'AI Provider 未配置' src/Http/Studio/BookController.php
          grep -Fq 'Markdown 导入、手工编辑和私人阅读' src/Http/Studio/BookController.php
          grep -Fq 'OWNER Gate' src/Http/Studio/BookController.php
          grep -Fq 'GENERATE_BOOK_OUTLINE' bin/worker.php
          test "$(tr -d '\r\n' < VERSION)" = '0.1.6'
          echo BRIEF_OUTLINE_OWNER_GATE=PASS
          echo PROVIDER_OPTIONAL=PASS
          echo CANONICAL_CANDIDATE_ISOLATION=PASS
          echo FORMAL_RELEASE=NOT_AUTHORIZED
          echo PRODUCTION_WRITE=NOT_AUTHORIZED

      - name: Product repository cleanliness
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf storage dist storage-restore-*
          test -z "$(git status --short --untracked-files=all)"
          echo PRODUCT_REPOSITORY_CLEAN=PASS
          echo PRIVATE_DATA_PERSISTED=NO
