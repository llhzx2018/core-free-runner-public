name: P06 VF Press V0.1.7 Temporary Formal Release

on:
  pull_request:
    paths:
      - .github/workflows/temp-p06-ai-book-slice2.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p06-v017-formal-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_REPO: llhzx2018/vf-press
      SOURCE_SHA: 28f480340b196c5dcb7c4b92cfcd548e31a15904
      VERSION: 0.1.7
      TAG: v0.1.7
      CORE_REPO: llhzx2018/core-updates
    steps:
      - name: Require registered release capabilities
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"
          echo PRIVATE_READ_CAPABILITY=PASS
          echo RELEASE_WRITE_CAPABILITY=PASS

      - name: Checkout exact release candidate source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Checkout core-updates channel
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.CORE_REPO }}
          ref: main
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: core-updates

      - name: Prepare release runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 php-mbstring php-zip php-curl sqlite3 composer >/dev/null
          php -v
          composer --version
          command -v gh
          echo MACHINE_RUNTIME=PASS

      - name: Exact source and authority release gate
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "$VERSION"
          test "$(jq -r .version VF_PROJECT.json)" = "$VERSION"
          test "$(jq -r .schema VF_PROJECT.json)" = '3'
          test "$(jq -r .current_phase VF_PROJECT.json)" = 'AI_BOOK_PRODUCTION_SLICE_2_VERIFIED_RELEASE_CANDIDATE'
          test "$(jq -r .next_gate VF_PROJECT.json)" = 'FORMAL_RELEASE_V0_1_7'
          test "$(jq -r .release_gates.owner_preview_runtime_applicability VF_PROJECT.json)" = 'N/A'
          test -n "$(jq -r .release_gates.owner_preview_runtime_reason VF_PROJECT.json)"
          test "$(jq -r .release_gates.owner_formal_release_approval VF_PROJECT.json)" = 'PASS'
          test "$(jq -r .release_gates.owner_real_use_after_production_update VF_PROJECT.json)" = 'REQUIRED'
          test "$(jq -r .release_gates.schema_migration VF_PROJECT.json)" = 'PASS_MACHINE_EXACT_SOURCE_RECOVERY_VERIFIED'
          test "$(jq -r .release_gates.ai_book_production_runtime VF_PROJECT.json)" = 'SLICE_2_PASS_MACHINE_EXACT_SOURCE'
          echo EXACT_RELEASE_SOURCE=PASS
          echo AUTHORITY_RELEASE_GATE=PASS
          echo PRODUCTION_WRITE=0

      - name: Composer and PHP syntax
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          composer validate --strict
          composer dump-autoload --no-dev --optimize --no-interaction
          find src bin public -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          echo COMPOSER_VALIDATE=PASS
          echo PHP_SYNTAX=PASS

      - name: Schema 2 to 3 recovery rehearsal
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          UPGRADE_ROOT=/tmp/p06-v017-schema-upgrade
          rm -rf "$UPGRADE_ROOT"
          mkdir -p "$UPGRADE_ROOT/storage"
          UPGRADE_DB="$UPGRADE_ROOT/storage/app.db"
          sqlite3 "$UPGRADE_DB" < database/schema/0001_initial.sql
          sqlite3 "$UPGRADE_DB" < database/schema/0002_security.sql
          sqlite3 "$UPGRADE_DB" "INSERT INTO schema_migrations(version,name,applied_at) VALUES(2,'0002_security','2026-08-24T00:00:00Z');"
          sqlite3 "$UPGRADE_DB" "INSERT INTO publications(id,publication_type,slug,title,lifecycle_status,created_at,updated_at) VALUES('11111111-1111-4111-8111-111111111111','BOOK','migration-sentinel','Schema 2 Sentinel','MANUSCRIPT','2026-08-24T00:00:01Z','2026-08-24T00:00:01Z');"
          sqlite3 "$UPGRADE_DB" "INSERT INTO publication_sections(id,publication_id,section_type,title,position,status,markdown_path,sha256,word_count,created_at,updated_at) VALUES('22222222-2222-4222-8222-222222222222','11111111-1111-4111-8111-111111111111','CHAPTER','Do Not Overwrite',1,'READY','manuscripts/sentinel.md','sentinel-hash',3,'2026-08-24T00:00:02Z','2026-08-24T00:00:02Z');"
          test "$(sqlite3 "$UPGRADE_DB" 'PRAGMA integrity_check;')" = 'ok'
          test -z "$(sqlite3 "$UPGRADE_DB" 'PRAGMA foreign_key_check;')"
          sqlite3 "$UPGRADE_DB" ".backup '$UPGRADE_ROOT/schema2-recovery.sqlite'"
          RECOVERY_SHA="$(sha256sum "$UPGRADE_ROOT/schema2-recovery.sqlite" | cut -d' ' -f1)"
          VF_PRESS_STORAGE_PATH="$UPGRADE_ROOT/storage" VF_PRESS_DB_PATH="$UPGRADE_DB" php bin/migrate.php | tee /tmp/p06-v017-schema3-upgrade
          grep -Fq 'APPLY 0003_ai_book_brief_outline.sql' /tmp/p06-v017-schema3-upgrade
          test "$(sqlite3 "$UPGRADE_DB" 'SELECT MAX(version) FROM schema_migrations;')" = '3'
          test "$(sqlite3 "$UPGRADE_DB" "SELECT title||':'||sha256 FROM publication_sections WHERE id='22222222-2222-4222-8222-222222222222';")" = 'Do Not Overwrite:sentinel-hash'
          test "$(sqlite3 "$UPGRADE_DB" 'PRAGMA integrity_check;')" = 'ok'
          test -z "$(sqlite3 "$UPGRADE_DB" 'PRAGMA foreign_key_check;')"
          VF_PRESS_STORAGE_PATH="$UPGRADE_ROOT/storage" VF_PRESS_DB_PATH="$UPGRADE_DB" php bin/migrate.php | grep -Fq MIGRATION_PASS
          cp "$UPGRADE_ROOT/schema2-recovery.sqlite" "$UPGRADE_ROOT/schema2-restored.sqlite"
          test "$(sha256sum "$UPGRADE_ROOT/schema2-restored.sqlite" | cut -d' ' -f1)" = "$RECOVERY_SHA"
          test "$(sqlite3 "$UPGRADE_ROOT/schema2-restored.sqlite" 'SELECT MAX(version) FROM schema_migrations;')" = '2'
          test "$(sqlite3 "$UPGRADE_ROOT/schema2-restored.sqlite" "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name IN ('book_briefs','book_outline_candidates');")" = '0'
          echo RECOVERY_POINT=PASS
          echo SCHEMA_2_TO_3=PASS
          echo RESTORE_VERIFICATION=PASS

      - name: Fresh migration and complete regression
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf storage dist storage-restore-*
          php bin/migrate.php | tee /tmp/p06-v017-fresh-migration
          grep -Fq 'APPLY 0003_ai_book_brief_outline.sql' /tmp/p06-v017-fresh-migration
          grep -Fq MIGRATION_PASS /tmp/p06-v017-fresh-migration
          php bin/self-test.php | grep -Fq FOUNDATION_SELF_TEST_PASS
          php bin/security-self-test.php | grep -Fq SECURITY_SELF_TEST_PASS
          php bin/research-self-test.php | grep -Fq RESEARCH_SELF_TEST_PASS
          php bin/publication-self-test.php | grep -Fq PUBLICATION_MANUSCRIPT_SELF_TEST=PASS
          php bin/markdown-import-self-test.php | tee /tmp/p06-v017-markdown-import
          grep -Fq MARKDOWN_IMPORT_SELF_TEST=PASS /tmp/p06-v017-markdown-import
          grep -Fq CANONICAL_MARKDOWN_READBACK=PASS /tmp/p06-v017-markdown-import
          grep -Fq OWNER_READER=PASS /tmp/p06-v017-markdown-import
          grep -Fq SCHEMA=3 /tmp/p06-v017-markdown-import
          php bin/reader-self-test.php | grep -Fq PUBLISHER_READER_SELF_TEST=PASS
          php bin/edition-self-test.php | grep -Fq EDITION_SELF_TEST=PASS
          php bin/living-publishing-self-test.php | grep -Fq LIVING_PUBLISHING_SELF_TEST=PASS
          php bin/operations-self-test.php | grep -Fq OPERATIONS_SELF_TEST=PASS
          php bin/operations-ui-self-test.php | grep -Fq OPERATIONS_UI_SELF_TEST=PASS
          php bin/admin-shell-book-overview-self-test.php | grep -Fq ADMIN_SHELL_BOOK_OVERVIEW_SELF_TEST=PASS
          php bin/book-outline-self-test.php | tee /tmp/p06-v017-book-outline
          grep -Fq BOOK_OUTLINE_SELF_TEST=PASS /tmp/p06-v017-book-outline
          grep -Fq OWNER_ACCEPT_REJECT=PASS /tmp/p06-v017-book-outline
          grep -Fq CANONICAL_MARKDOWN_NO_OVERWRITE=PASS /tmp/p06-v017-book-outline
          grep -Fq PROVIDER_OPTIONAL_DEGRADATION=PASS /tmp/p06-v017-book-outline
          php bin/public-asset-self-test.php | grep -Fq PUBLIC_ASSET_HTTP_SELF_TEST=PASS
          php bin/job-self-test.php | grep -Fq JOB_QUEUE_SELF_TEST=PASS
          php bin/update-self-test.php | grep -Fq UPDATE_SELF_TEST=PASS
          php -r '$pdo=new PDO("sqlite:storage/app.db"); if($pdo->query("PRAGMA integrity_check")->fetchColumn()!=="ok") exit(1); if($pdo->query("PRAGMA foreign_key_check")->fetchAll()!==[]) exit(2); if((int)$pdo->query("SELECT MAX(version) FROM schema_migrations")->fetchColumn()!==3) exit(3);'
          rm -rf storage dist storage-restore-*
          test -z "$(git status --short --untracked-files=all)"
          echo EXACT_SOURCE_FULL_REGRESSION=PASS
          echo PRODUCT_REPOSITORY_CLEAN=PASS

      - name: Build exact formal assets
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT=/tmp/p06-v017-release
          rm -rf "$OUT"
          mkdir -p "$OUT"
          php bin/build-release.php "$OUT" | tee /tmp/p06-v017-release-build
          grep -Fq RELEASE_BUILD=PASS /tmp/p06-v017-release-build
          (cd "$OUT" && sha256sum -c SHA256SUMS.txt)
          FULL="$OUT/VF_Press_V0.1.7_FULL.zip"
          UPDATE="$OUT/VF_Press_V0.1.7_UPDATE.zip"
          test -s "$FULL" && test -s "$UPDATE"
          test "$(jq -r .version "$OUT/RELEASE_INFO.json")" = "$VERSION"
          test "$(jq -r .schema "$OUT/RELEASE_INFO.json")" = '3'
          unzip -p "$UPDATE" VF_UPDATE.json >/tmp/p06-v017-update.json
          test "$(jq -r .target_version /tmp/p06-v017-update.json)" = "$VERSION"
          unzip -l "$UPDATE" | grep -Fq 'payload/database/schema/0003_ai_book_brief_outline.sql'
          unzip -l "$UPDATE" | grep -Fq 'payload/src/Application/Publication/BookGenerationService.php'
          unzip -l "$UPDATE" | grep -Fq 'payload/src/Infrastructure/AI/BookGenerationProviderInterface.php'
          unzip -l "$UPDATE" | grep -Fq 'payload/bin/book-outline-self-test.php'
          echo "FULL_BYTES=$(stat -c%s "$FULL")" >> "$GITHUB_ENV"
          echo "FULL_SHA=$(sha256sum "$FULL" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "UPDATE_BYTES=$(stat -c%s "$UPDATE")" >> "$GITHUB_ENV"
          echo "UPDATE_SHA=$(sha256sum "$UPDATE" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo FORMAL_ASSET_BUILD=PASS

      - name: Publish and remote-readback formal GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          OUT=/tmp/p06-v017-release
          NOTES=/tmp/p06-v017-notes.md
          printf '%s\n' \
            '## VF Press V0.1.7 · AI Book Brief 与 OWNER Outline Gate' \
            '' \
            '- 新增 AI Book Brief、Outline Candidate 与 OWNER Accept / Reject Gate。' \
            '- AI Candidate 与 Accepted Canonical Markdown 物理隔离，不直接覆盖已接受正文。' \
            '- 未配置 AI Provider 时，Markdown 导入、手工编辑和私人阅读仍然可用。' \
            '- Schema 从 2 升级到 3；更新前需要恢复点，支持回滚到 Schema 2。' \
            '- 出版、Edition、EPUB、PDF 与分发仍是可选后段能力。' \
            '' \
            'Production 升级和 OWNER 真实使用验收是正式发布后的独立授权步骤；本发布未写入 Production。' > "$NOTES"

          if gh release view "$TAG" --repo "$SOURCE_REPO" >/dev/null 2>&1; then
            TAG_SHA=$(gh api "repos/$SOURCE_REPO/git/ref/tags/$TAG" --jq .object.sha)
            test "$TAG_SHA" = "$SOURCE_SHA"
            gh release upload "$TAG" \
              "$OUT/VF_Press_V0.1.7_FULL.zip" \
              "$OUT/VF_Press_V0.1.7_UPDATE.zip" \
              "$OUT/SHA256SUMS.txt" \
              "$OUT/RELEASE_INFO.json" \
              --repo "$SOURCE_REPO" --clobber
          else
            gh release create "$TAG" \
              "$OUT/VF_Press_V0.1.7_FULL.zip" \
              "$OUT/VF_Press_V0.1.7_UPDATE.zip" \
              "$OUT/SHA256SUMS.txt" \
              "$OUT/RELEASE_INFO.json" \
              --repo "$SOURCE_REPO" \
              --target "$SOURCE_SHA" \
              --title "VF Press V0.1.7 · AI Book Brief and OWNER Outline Gate" \
              --notes-file "$NOTES"
          fi

          RELEASE_JSON=$(gh api "repos/$SOURCE_REPO/releases/tags/$TAG")
          test "$(jq -r .draft <<<"$RELEASE_JSON")" = false
          test "$(jq -r .prerelease <<<"$RELEASE_JSON")" = false
          test "$(jq -r .tag_name <<<"$RELEASE_JSON")" = "$TAG"
          TAG_SHA=$(gh api "repos/$SOURCE_REPO/git/ref/tags/$TAG" --jq .object.sha)
          test "$TAG_SHA" = "$SOURCE_SHA"

          READBACK=/tmp/p06-v017-readback
          rm -rf "$READBACK"
          mkdir -p "$READBACK"
          gh release download "$TAG" --repo "$SOURCE_REPO" --dir "$READBACK"
          test "$(stat -c%s "$READBACK/VF_Press_V0.1.7_FULL.zip")" = "$FULL_BYTES"
          test "$(sha256sum "$READBACK/VF_Press_V0.1.7_FULL.zip" | awk '{print $1}')" = "$FULL_SHA"
          test "$(stat -c%s "$READBACK/VF_Press_V0.1.7_UPDATE.zip")" = "$UPDATE_BYTES"
          test "$(sha256sum "$READBACK/VF_Press_V0.1.7_UPDATE.zip" | awk '{print $1}')" = "$UPDATE_SHA"
          (cd "$READBACK" && sha256sum -c SHA256SUMS.txt)
          echo "RELEASE_URL=$(jq -r .html_url <<<"$RELEASE_JSON")" >> "$GITHUB_ENV"
          echo FORMAL_RELEASE_REMOTE_READBACK=PASS

      - name: Publish core-updates P06 manifest
        working-directory: core-updates
        shell: bash
        run: |
          set -Eeuo pipefail
          RELEASED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq -n \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            --arg sha "$UPDATE_SHA" \
            --arg released_at "$RELEASED_AT" \
            --arg source_sha "$SOURCE_SHA" \
            --argjson bytes "$UPDATE_BYTES" \
            '{
              schema_version:"1.0",
              project_id:"P06",
              component_id:"APP",
              enabled:true,
              target_version:$version,
              update_type:"ATOMIC",
              from_versions:["0.1.6"],
              schema_from:"2",
              schema_to:"3",
              repository:"llhzx2018/vf-press",
              release_tag:$tag,
              asset_name:"VF_Press_V0.1.7_UPDATE.zip",
              asset_bytes:$bytes,
              asset_sha256:$sha,
              backup_required:true,
              rollback_supported:true,
              minimum_php:"8.2.0",
              released_at:$released_at,
              product_identity:"VF Press / P06",
              notes:("V0.1.7 adds AI Book Brief, Outline Candidate, and the OWNER Accept/Reject Gate. Candidate content cannot overwrite Accepted Canonical Markdown. Direct ATOMIC update from V0.1.6 Schema 2 to Schema 3; pre-update recovery and rollback required. Formal release and remote asset readback bind exact source SHA " + $source_sha + ".")
            }' > projects/P06.json
          jq -e '.project_id=="P06" and .target_version=="0.1.7" and .from_versions==["0.1.6"] and .schema_from=="2" and .schema_to=="3" and .backup_required==true and .rollback_supported==true and .asset_bytes>0 and (.asset_sha256|test("^[a-f0-9]{64}$"))' projects/P06.json >/dev/null
          git config user.name 'VF Public Runner'
          git config user.email 'vf-public-runner@users.noreply.github.com'
          git add projects/P06.json
          git commit -m "release(P06): publish V0.1.7 update manifest"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "MANIFEST_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo CORE_UPDATES_MANIFEST_PUBLISHED=PASS

      - name: Verify online discovery contract
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$CORE_REPO/contents/projects/P06.json?ref=main" --jq .content | tr -d '\n' | base64 -d >/tmp/P06-online.json
          jq -e \
            --arg sha "$UPDATE_SHA" \
            --argjson bytes "$UPDATE_BYTES" \
            '.target_version=="0.1.7" and .from_versions==["0.1.6"] and .schema_from=="2" and .schema_to=="3" and .release_tag=="v0.1.7" and .asset_bytes==$bytes and .asset_sha256==$sha' \
            /tmp/P06-online.json >/dev/null
          cd source
          php -r 'require "vendor/autoload.php"; $m=json_decode(file_get_contents("/tmp/P06-online.json"),true,512,JSON_THROW_ON_ERROR); $r=(new CoreUpdates\UpdateCore("P06"))->check("0.1.6","2",$m); if(($r["status"]??"")!=="AVAILABLE"){fwrite(STDERR,json_encode($r));exit(1);} echo "ONLINE_DISCOVERY=AVAILABLE\n";'
          echo ONLINE_UPDATE_DISCOVERY=PASS
          echo FORMAL_RELEASE=PASS
          echo OWNER_REAL_USE_AFTER_PRODUCTION_UPDATE=REQUIRED
          echo PRODUCTION_WRITE=NO
