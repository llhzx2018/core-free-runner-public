name: P06 V0.1.7 Migration Channel Replay

on:
  pull_request:
    paths:
      - .github/workflows/temp-p06-ai-book-slice2.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p06-v017-migration-channel-replay
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_REPO: llhzx2018/vf-press
      SOURCE_SHA: 58a425106946f801d486d0740bbc3465367fa516
      RELEASE_TAG: v0.1.7
      ASSET_NAME: VF_Press_V0.1.7_UPDATE.zip
      ASSET_BYTES: 186823
      ASSET_SHA256: 7e2de43524241f493a4c6a67bd571407ae4b59a2f6352a52982eb16cdd27a1ae
    steps:
      - name: Require private read capability
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo PRIVATE_READ_CAPABILITY=PASS

      - name: Checkout exact V0.1.6 updater source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Prepare PHP SQLite runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 php-mbstring php-zip php-curl sqlite3 composer >/dev/null
          php -v
          composer --version
          command -v gh
          echo MACHINE_RUNTIME=PASS

      - name: Exact source and clean Schema 2 fixture
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' < VERSION)" = '0.1.6'
          test "$(jq -r .schema VF_PROJECT.json)" = '2'
          composer validate --strict
          composer dump-autoload --no-dev --optimize --no-interaction
          rm -rf storage storage-restore-* dist
          php bin/migrate.php | grep -Fq MIGRATION_PASS
          test "$(sqlite3 storage/app.db 'SELECT MAX(version) FROM schema_migrations;')" = '2'
          sqlite3 storage/app.db "INSERT INTO publications(id,publication_type,slug,title,lifecycle_status,created_at,updated_at) VALUES('11111111-1111-4111-8111-111111111111','BOOK','production-replay-sentinel','Production Replay Sentinel','MANUSCRIPT','2026-08-24T00:00:01Z','2026-08-24T00:00:01Z');"
          sqlite3 storage/app.db "INSERT INTO publication_sections(id,publication_id,section_type,title,position,status,markdown_path,sha256,word_count,created_at,updated_at) VALUES('22222222-2222-4222-8222-222222222222','11111111-1111-4111-8111-111111111111','CHAPTER','Do Not Overwrite',1,'READY','manuscripts/replay-sentinel.md','sentinel-hash',3,'2026-08-24T00:00:02Z','2026-08-24T00:00:02Z');"
          test "$(sqlite3 storage/app.db 'PRAGMA integrity_check;')" = 'ok'
          test -z "$(sqlite3 storage/app.db 'PRAGMA foreign_key_check;')"
          echo EXACT_V016_UPDATER_SOURCE=PASS
          echo SCHEMA_2_FIXTURE=PASS

      - name: Download and verify exact V0.1.7 formal asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p06-v017-channel-replay
          mkdir -p /tmp/p06-v017-channel-replay
          gh release download "$RELEASE_TAG" --repo "$SOURCE_REPO" --pattern "$ASSET_NAME" --dir /tmp/p06-v017-channel-replay
          ASSET="/tmp/p06-v017-channel-replay/$ASSET_NAME"
          test "$(stat -c%s "$ASSET")" = "$ASSET_BYTES"
          test "$(sha256sum "$ASSET" | awk '{print $1}')" = "$ASSET_SHA256"
          unzip -p "$ASSET" VF_UPDATE.json | jq -e '.target_version=="0.1.7"' >/dev/null
          echo FORMAL_ASSET_REMOTE_READBACK=PASS

      - name: Build corrected migration channel contract
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -n \
            --arg sha "$ASSET_SHA256" \
            --argjson bytes "$ASSET_BYTES" \
            '{
              schema_version:"1.0",
              project_id:"P06",
              component_id:"APP",
              enabled:true,
              target_version:"0.1.7",
              update_type:"MIGRATION",
              from_versions:["0.1.6"],
              schema_from:"2",
              schema_to:"3",
              repository:"llhzx2018/vf-press",
              release_tag:"v0.1.7",
              asset_name:"VF_Press_V0.1.7_UPDATE.zip",
              asset_bytes:$bytes,
              asset_sha256:$sha,
              backup_required:true,
              rollback_supported:true,
              minimum_php:"8.2.0",
              released_at:"2026-08-24T11:21:54Z",
              product_identity:"VF Press / P06"
            }' > /tmp/p06-v017-proposed-manifest.json
          jq -e '.update_type=="MIGRATION" and .schema_from=="2" and .schema_to=="3"' /tmp/p06-v017-proposed-manifest.json >/dev/null
          echo CORRECTED_CHANNEL_CONTRACT=PASS

      - name: Replay V0.1.6 to V0.1.7 through production updater
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/p06-v017-replay.php <<'PHP'
          <?php
          declare(strict_types=1);
          use CoreUpdates\UpdateCore;
          use VF\Press\Infrastructure\Config\AppConfig;
          use VF\Press\Infrastructure\Database\ConnectionFactory;
          use VF\Press\Infrastructure\Recovery\RecoveryService;
          use VF\Press\Infrastructure\Security\AuditLogger;
          use VF\Press\Infrastructure\Update\VFPressUpdateAdapter;
          $base = getcwd();
          require $base . '/vendor/autoload.php';
          $config = AppConfig::fromEnvironment($base);
          $config->ensureRuntimeDirectories();
          $pdo = ConnectionFactory::create($config);
          $audit = new AuditLogger($pdo);
          $recovery = new RecoveryService($pdo, $audit, $config->storagePath, $config->databasePath);
          $adapter = new VFPressUpdateAdapter($pdo, $config, $audit, $recovery);
          $manifest = json_decode(file_get_contents('/tmp/p06-v017-proposed-manifest.json'), true, 512, JSON_THROW_ON_ERROR);
          $asset = '/tmp/p06-v017-channel-replay/VF_Press_V0.1.7_UPDATE.zip';
          $result = (new UpdateCore('P06'))->upgrade('0.1.6', '2', $adapter, $asset, $manifest);
          file_put_contents('/tmp/p06-v017-replay-result.json', json_encode($result, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . "\n");
          if (!in_array($result['status'] ?? '', ['COMMITTED', 'COMMITTED_WITH_CLEANUP_WARNING'], true)) {
              throw new RuntimeException('Migration replay failed: ' . json_encode($result));
          }
          if (($result['rollback_result'] ?? '') !== 'N/A') {
              throw new RuntimeException('Unexpected rollback result.');
          }
          $locator = $result['backup_locator'] ?? null;
          if (!is_array($locator) || !isset($locator['recovery_id'], $locator['source_backup'])) {
              throw new RuntimeException('Recovery locator missing.');
          }
          if (!$recovery->verifyRecoveryPoint((string)$locator['recovery_id'])) {
              throw new RuntimeException('Recovery point verification failed.');
          }
          echo "PRODUCTION_UPDATER_REPLAY=PASS\n";
          echo "RECOVERY_POINT_READBACK=PASS\n";
          PHP
          php /tmp/p06-v017-replay.php
          cat /tmp/p06-v017-replay-result.json
          echo PRODUCTION_WRITE=NO

      - name: Post-upgrade exact readback
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(tr -d '\r\n' < VERSION)" = '0.1.7'
          test "$(jq -r .schema VF_PROJECT.json)" = '3'
          test "$(sqlite3 storage/app.db 'SELECT MAX(version) FROM schema_migrations;')" = '3'
          test "$(sqlite3 storage/app.db "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name IN ('book_briefs','book_outline_candidates');")" = '2'
          test "$(sqlite3 storage/app.db "SELECT title||':'||sha256 FROM publication_sections WHERE id='22222222-2222-4222-8222-222222222222';")" = 'Do Not Overwrite:sentinel-hash'
          test "$(sqlite3 storage/app.db 'PRAGMA integrity_check;')" = 'ok'
          test -z "$(sqlite3 storage/app.db 'PRAGMA foreign_key_check;')"
          test -f src/Application/Publication/BookGenerationService.php
          test -f database/schema/0003_ai_book_brief_outline.sql
          composer validate --strict
          composer dump-autoload --no-dev --optimize --no-interaction
          find src bin public -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php bin/book-outline-self-test.php | grep -Fq BOOK_OUTLINE_SELF_TEST=PASS
          echo VERSION_0_1_7_READBACK=PASS
          echo SCHEMA_3_READBACK=PASS
          echo CANONICAL_SENTINEL_UNCHANGED=PASS
          echo POST_UPGRADE_RUNTIME=PASS
