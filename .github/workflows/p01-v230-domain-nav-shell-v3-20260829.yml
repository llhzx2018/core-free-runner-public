name: P01 V2.30 Domain Nav Shell V3
on:
  push:
    branches: [task/p01-v230-domain-nav-shell-20260829]
    paths:
      - .github/workflows/p01-v230-domain-nav-shell-v3-20260829.yml
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: 1872c1268a44239a63271af0207593b05be38f51
      PRODUCT_BRANCH: feature/p01-v230-domain-nav-shell-20260829
      PORT: '18573'
      ROOT: /tmp/p01-v230-domain-nav-v3
      ADMIN_PASS: 'P01V230!Nav'
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.PRODUCT_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: source
      - name: Exact source and patch
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          python3 - <<'PY'
          from pathlib import Path
          shell=Path('source/src/app/FunctionalWorkspaceShell.php')
          s=shell.read_text(encoding='utf-8')
          anchor="function vf_fw_render_sidebar(array $options): void\n{"
          assert anchor in s and 'function vf_fw_render_global_domain_nav' not in s
          fn=r'''function vf_fw_render_global_domain_nav(string $mode, bool $admin, string $scope): void
          {
              $items = [
                  ['all', '首页'],
                  ['start', '导航'],
                  ['channels', '频道'],
                  ['watch', '影视'],
                  ['topics', '专题'],
              ];
              ?>
          <nav class="vf-global-domain-nav" aria-label="VF Start 资源域">
            <div class="vf-global-domain-nav-inner">
              <?php foreach($items as [$key,$label]):
                  $href = vf_fw_route_link($key, $admin ? $scope : 'public', 0);
              ?><a class="<?=$mode===$key?'active':''?>" href="<?=$href?>" aria-current="<?=$mode===$key?'page':'false'?>"><?=vf_fw_h($label)?></a><?php endforeach; ?>
            </div>
          </nav>
          <?php
          }

          '''
          shell.write_text(s.replace(anchor,fn+anchor,1),encoding='utf-8')
          workspace=Path('source/src/app/FunctionalWorkspace.php')
          s=workspace.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="<?=vf_fw_h(vf_asset_url(\'assets/resource-media.css\'))?>">'
          assert css in s
          s=s.replace(css,css+'<link rel="stylesheet" href="<?=vf_fw_h(vf_asset_url(\'assets/workspace-domain-nav.css\'))?>">',1)
          stage='<section class="vf-app-stage"><header class="vf-app-topbar">'
          assert stage in s
          s=s.replace(stage,'<section class="vf-app-stage"><?php vf_fw_render_global_domain_nav($mode,$admin,$scope); ?><header class="vf-app-topbar vf-domain-subbar">',1)
          workspace.write_text(s,encoding='utf-8')
          bootstrap=Path('source/src/app/bootstrap.php')
          s=bootstrap.read_text(encoding='utf-8')
          assert "define('VF_VERSION', '2.29.0');" in s
          bootstrap.write_text(s.replace("define('VF_VERSION', '2.29.0');","define('VF_VERSION', '2.30.0');",1),encoding='utf-8')
          Path('source/VERSION').write_text('2.30.0\n',encoding='utf-8')
          Path('source/src/VERSION.txt').write_text('2.30.0\n',encoding='utf-8')
          PY
          cat > source/src/assets/workspace-domain-nav.css <<'CSS'
          /* V2.30 domain-first shell: stable global resource switch + domain-local controls. */
          :root{--ws-domain-nav:38px}
          .vf-global-domain-nav{height:var(--ws-domain-nav);position:sticky;top:0;z-index:38;background:#4b4e4a;border-bottom:1px solid rgba(0,0,0,.14);color:#e8ece9}
          .vf-global-domain-nav-inner{height:100%;padding:0 22px;display:flex;align-items:stretch;gap:2px;overflow-x:auto;scrollbar-width:none}
          .vf-global-domain-nav-inner::-webkit-scrollbar{display:none}
          .vf-global-domain-nav a{position:relative;min-width:max-content;padding:0 13px;display:inline-flex;align-items:center;text-decoration:none;color:#e0e5e1;font-size:12.5px;font-weight:520;letter-spacing:.01em}
          .vf-global-domain-nav a:hover{background:rgba(255,255,255,.07);color:#fff}
          .vf-global-domain-nav a.active{background:rgba(0,0,0,.11);color:#fff;font-weight:700}
          .vf-global-domain-nav a.active::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:2px;border-radius:2px 2px 0 0;background:#45c6b9}
          .vf-app-topbar.vf-domain-subbar{top:var(--ws-domain-nav)}
          .vf-functional-sidebar .vf-nav-section-first,.vf-functional-sidebar .vf-main-nav{display:none!important}
          .vf-functional-sidebar .vf-quick-nav{margin-top:2px}
          .vf-functional-workspace .vf-workspace-toolbar{top:calc(var(--ws-domain-nav) + var(--ws-topbar) + 8px)}
          @media(max-width:760px){:root{--ws-domain-nav:40px}.vf-global-domain-nav-inner{padding:0 8px;gap:0}.vf-global-domain-nav a{padding:0 12px;font-size:12.5px}.vf-global-domain-nav a.active::after{left:10px;right:10px}.vf-functional-workspace .vf-workspace-toolbar{top:calc(var(--ws-domain-nav) + 58px)}}
          CSS
          php -l source/src/app/FunctionalWorkspaceShell.php >/dev/null
          php -l source/src/app/FunctionalWorkspace.php >/dev/null
          php -l source/src/app/bootstrap.php >/dev/null
          git -C source diff --check
          echo P01_V230_DOMAIN_NAV_PATCH=PASS
      - name: Fresh runtime and authenticated navigation gate
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$ROOT" /tmp/p01-v230-v3.cookies
          cp -a source/src "$ROOT"
          php -S "127.0.0.1:${PORT}" -t "$ROOT" >/tmp/p01-v230-v3.log 2>&1 &
          COOKIE=/tmp/p01-v230-v3.cookies
          for i in $(seq 1 30); do curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:${PORT}/setup.php" -o /tmp/p01-v230-v3-setup.html && break || sleep 1; done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-v230-v3-setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:${PORT}/setup.php" --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=V230 Domain Nav' --data-urlencode "admin_password=$ADMIN_PASS" --data-urlencode "admin_password_confirm=$ADMIN_PASS" -o /tmp/p01-v230-v3-setup-post.html
          grep -F 'VF Start 安装完成' /tmp/p01-v230-v3-setup-post.html >/dev/null
          php "$ROOT/cli/verify.php" | tee /tmp/p01-v230-v3-verify.txt | grep -Fx VERIFY_PASS=YES
          curl -fsS -c "$COOKIE" -b "$COOKIE" -H 'Content-Type: application/json' -d "{\"password\":\"$ADMIN_PASS\"}" "http://127.0.0.1:${PORT}/api.php?action=login" -o /tmp/p01-v230-v3-login.json
          jq -e '.ok==true and (.csrf|type=="string")' /tmp/p01-v230-v3-login.json >/dev/null
          curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:${PORT}/api.php?action=bootstrap" -o /tmp/p01-v230-v3-bootstrap.json
          jq -e '.ok==true and .site.auth==true and .version=="2.30.0"' /tmp/p01-v230-v3-bootstrap.json >/dev/null
          for spec in 'surfaces.php|首页' 'start.php|导航' 'channels.php|频道' 'watch.php|影视' 'topics.php|专题'; do
            page=${spec%%|*}; label=${spec##*|}
            curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:${PORT}/${page}" -o "/tmp/${page}.html"
            grep -F 'vf-global-domain-nav' "/tmp/${page}.html" >/dev/null
            for item in 首页 导航 频道 影视 专题; do grep -F ">$item</a>" "/tmp/${page}.html" >/dev/null; done
            python3 - "$page" "$label" <<'PY'
          import re,sys
          page,label=sys.argv[1:]
          s=open('/tmp/'+page+'.html',encoding='utf-8').read()
          pat=r'<a class="active"[^>]*>'+re.escape(label)+r'</a>'
          assert re.search(pat,s), (page,label)
          PY
          done
          echo P01_V230_DOMAIN_NAV_AUTH_UI=PASS
      - name: Commit product branch
        shell: bash
        run: |
          set -Eeuo pipefail
          cd source
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VERSION src/VERSION.txt src/app/bootstrap.php src/app/FunctionalWorkspace.php src/app/FunctionalWorkspaceShell.php src/assets/workspace-domain-nav.css
          git commit -m 'feat(P01): add V2.30 global resource domain navigation'
          git push origin "HEAD:${PRODUCT_BRANCH}"
          echo "P01_V230_DOMAIN_NAV_SOURCE=$(git rev-parse HEAD)"
          echo "P01_V230_DOMAIN_NAV_TREE=$(git rev-parse HEAD^{tree})"
          echo P01_V230_DOMAIN_NAV_GATE=PASS
