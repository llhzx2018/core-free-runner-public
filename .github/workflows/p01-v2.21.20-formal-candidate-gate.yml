name: P01 V2.21.20 Formal Candidate Gate
on:
  push:
    branches: [vf-agent-operations-v1]
    paths: ['.github/workflows/p01-v2.21.20-formal-candidate-gate.yml']
permissions:
  contents: read
env:
  CANDIDATE: 393ac2fafa56cbde66767b7e1afed78742c12c9d
  CANDIDATE_TREE: 64cc4d21ab46d165599d59395ffcc99be6af39e0
  PRODUCTION: fbb869fd81f99cd4bb506f3f60bee4c007ef2db0
  VERSION: 2.21.20
  SOURCE_VERSION: 2.21.19
  ADMIN_PASS: FormalCandidate-P01-22120!Strong
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      W: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: vf-agent-operations-v1}
      - name: Prepare runtime
        run: sudo apt-get update -qq && sudo apt-get install -y -qq php-sqlite3 sqlite3 jq unzip >/dev/null
      - name: Checkout exact candidate and Production truth
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone -q --depth 1 --branch maintenance/sidebar-density-2.21.20-20260819 "https://x-access-token:${R}@github.com/llhzx2018/vf-start.git" candidate
          git clone -q --depth 1 --branch main "https://x-access-token:${R}@github.com/llhzx2018/vf-start.git" production
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test "$(git -C production rev-parse HEAD)" = "$PRODUCTION"
      - name: Execute formal artifact gate
        shell: bash
        run: bash scripts/temp-p01-v22120-formal-gate.sh | tee /tmp/formal.out
      - name: Publish sanitized evidence
        if: always()
        shell: bash
        env:
          S: ${{ job.status }}
          RID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os,json,base64,urllib.request,urllib.error,pathlib
          build={}
          if pathlib.Path('/tmp/build.json').exists():
            raw=json.load(open('/tmp/build.json'))
            build={k:raw.get(k) for k in ['status','version','source_version','candidate_commit','candidate_tree','production_commit','runtime_source_files','runtime_target_files','runtime_changed','runtime_added','runtime_removed','artifacts']}
          q={'schema':'vf-public-runner-result/v1','project_id':'P01','target_version':'2.21.20','source_version':'2.21.19','gate':'FORMAL_CANDIDATE_ARTIFACT_GATE','status':os.environ['S'].upper(),'pass':os.environ['S']=='success','source_sha':os.environ['CANDIDATE'],'source_tree':os.environ['CANDIDATE_TREE'],'production_sha':os.environ['PRODUCTION'],'schema_version':'2026080902','browser_helper':'1.6.4 / UNCHANGED','release_authorized':False,'production_changed':False,'workflow_run_id':os.environ['RID'],'build':build,'private_data_persisted_publicly':False};c=json.dumps(q,ensure_ascii=False,indent=2,sort_keys=True)+'\n';t=os.environ['W'];api='https://api.github.com/repos/llhzx2018/core-free-runner-public/contents/vf-agent/results/P01-V2.21.20-FORMAL-CANDIDATE-GATE.json';h={'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json'};sha=None
          try:
            with urllib.request.urlopen(urllib.request.Request(api+'?ref=vf-agent-operations-v1',headers=h)) as x:sha=json.load(x).get('sha')
          except urllib.error.HTTPError as e:
            if e.code!=404:raise
          b={'message':'evidence(P01): publish V2.21.20 formal candidate gate','content':base64.b64encode(c.encode()).decode(),'branch':'vf-agent-operations-v1'}
          if sha:b['sha']=sha
          urllib.request.urlopen(urllib.request.Request(api,data=json.dumps(b).encode(),method='PUT',headers={**h,'Content-Type':'application/json'})).read()
          PY
