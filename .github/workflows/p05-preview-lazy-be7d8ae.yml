name: P05 Preview Lazy Load Exact Source Gate
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  p05-preview-lazy:
    runs-on: ubuntu-24.04
    env:
      P05_EXACT_SOURCE: be7d8ae997caf4e824ed2a8f56e4fe1e35fbfd23
      P05_BASE_MAIN: 0f6bad2fa9f065c7cad705aa55374ac543f14aa0
      VF_MASTER_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NODE_ENV: test
      APP_ENV: test
      VF_DATABASE_PROVIDER: sqlite
      VF_SECURE_COOKIES: false
      VF_REQUIRE_HTTPS: false
    steps:
      - name: Checkout exact private P05 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.P05_EXACT_SOURCE }}
          token: ${{ secrets.VF_PRIVATE_REPO_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source and scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_EXACT_SOURCE"
          git cat-file -e "$P05_BASE_MAIN^{commit}"
          git diff --check "$P05_BASE_MAIN" "$P05_EXACT_SOURCE" -- '*.ts' '*.tsx' '*.css' '*.mjs' '*.php' '*.json' '*.yml' '*.yaml'
          test "$(git diff --name-only "$P05_BASE_MAIN" "$P05_EXACT_SOURCE" | wc -l)" -eq 2
          echo 'P05_PREVIEW_LAZY_EXACT_SOURCE_BINDING=PASS'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Engineering regression
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run lint
          npm run typecheck
          npm run migrate
          npm run verify:schema
          npm run test
          npm run build
          echo 'P05_PREVIEW_LAZY_ENGINEERING=PASS'
      - name: Verify lazy chunk boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          PREVIEW_CHUNK="$(find dist/client/assets -maxdepth 1 -type f -name 'ProductApp-*.js' -print -quit)"
          test -n "$PREVIEW_CHUNK"
          MAIN_CHUNK="$(find dist/client/assets -maxdepth 1 -type f -name 'index-*.js' -print -quit)"
          test -n "$MAIN_CHUNK"
          echo "P05_PREVIEW_CHUNK=$(basename "$PREVIEW_CHUNK")"
          echo "P05_PREVIEW_CHUNK_BYTES=$(stat -c%s "$PREVIEW_CHUNK")"
          echo "P05_CLASSIC_MAIN_CHUNK=$(basename "$MAIN_CHUNK")"
          echo "P05_CLASSIC_MAIN_CHUNK_BYTES=$(stat -c%s "$MAIN_CHUNK")"
          echo 'P05_PREVIEW_LAZY_CHUNK_BOUNDARY=PASS'
      - name: Formal PHP staging regression
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run build:php-release
          npm run php:release:gate
          test -n "$(find build/vf-seo-php-release/assets -maxdepth 1 -type f -name 'ProductApp-*.js' -print -quit)"
          echo 'P05_PREVIEW_LAZY_PHP_RELEASE_STAGING=PASS'
      - name: Source and security gates
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run source:gate
          npm run scope:gate
          npm run dependency:gate
          npm audit --audit-level=high
          npm run security:gate
          echo 'P05_PREVIEW_LAZY_SOURCE_SECURITY=PASS'
      - name: Seal exact source result
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_EXACT_SOURCE"
          echo 'P05_PREVIEW_LAZY_EXACT_SOURCE_GATE=PASS'
          echo "P05_EXACT_SOURCE=$P05_EXACT_SOURCE"
          echo 'P05_RELEASE_WRITE=0'
          echo 'P05_PRODUCTION_WRITE=0'
