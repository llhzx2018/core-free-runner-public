name: P02 V2.5.45 Mobile Shell Gate

on:
  push:
    branches:
      - run/p02-v2545-mobile-shell-20260920
    paths:
      - '.github/workflows/p02-v2545-mobile-shell.yml'

permissions:
  contents: read

jobs:
  ux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_SHA: 61f69baf0ed3325eba09b32f62da73593352c72f
      TARGET_VERSION: 2.5.45
    steps:
      - name: Checkout exact P02 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 61f69baf0ed3325eba09b32f62da73593352c72f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product

      - name: Install runtime and Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-zip sqlite3 curl
          cd product
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify source and mobile shell contracts
        shell: bash
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "$TARGET_VERSION"
          bash scripts/verify-repository.sh
          node tests/unit/p02_v2542_inkstone_reference_contract.mjs
          node tests/unit/p02_v2543_editor_list_continuity.mjs
          node tests/unit/p02_v2544_full_list_density.mjs
          node tests/unit/p02_v2545_mobile_shell.mjs
          node tests/unit/p02_v2540_final_ux_convergence.mjs
          node tests/unit/p02_runtime_style_single_entry.mjs
          node tests/unit/p02_candidate_version_identity_contract.mjs
          echo P02_V2545_MOBILE_SHELL_SOURCE_GATE=PASS

      - name: Real Chromium UX regression
        shell: bash
        working-directory: product
        run: |
          set -Eeuo pipefail
          bash scripts/ux-browser-reverify.sh
          echo P02_V2545_MOBILE_SHELL_BROWSER_GATE=PASS
