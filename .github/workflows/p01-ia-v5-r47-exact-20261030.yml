name: p01-ia-v5-r48-exact-source-gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-ia-v5-r47-exact-20261030.yml'

permissions:
  contents: read

concurrency:
  group: p01-ia-v5-r47-exact-20261030
  cancel-in-progress: false

jobs:
  exact-source:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'test(P01):')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      PRODUCT_BRANCH: fix/ia-v5-unified-management-shell-r44
      TARGET_SHA: 81acfb117dc3709bc93b919dfcb1de645b65bf5b
      PRODUCT_VERSION: 2.47.484
    steps:
      - name: Checkout registered runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install isolated PHP runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd php-xml >/dev/null
          php -m | grep -Fx pdo_sqlite
          php -m | grep -Fx sqlite3
          node --version
          echo P01_RUNTIME=PASS

      - name: Bind exact private product source without artifacts
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          expected="$(git ls-remote "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "refs/heads/${PRODUCT_BRANCH}" | awk '{print $1}')"
          test "$expected" = "$TARGET_SHA"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" candidate
          git -C candidate fetch -q --depth 1 origin "$TARGET_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "$PRODUCT_VERSION"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "$PRODUCT_VERSION"
          echo P01_EXACT_SOURCE=PASS

      - name: Syntax and canonical IA V5 management source contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          find candidate/src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find candidate/src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          (
            cd candidate
            count=0
            failed=0
            for file in tests/unit/p01_ia5_*.cjs; do
              test -f "$file"
              if node "$file" >/tmp/ia5-test-result.txt 2>&1; then
                echo "PASS_TEST=$file"
              else
                echo "FAIL_TEST=$file"
                grep -m1 -E 'AssertionError|SyntaxError|Error \[|Error:' /tmp/ia5-test-result.txt || true
                failed=$((failed+1))
              fi
              count=$((count+1))
            done
            test "$count" -ge 25
            for file in tests/unit/p01_music_advanced_native_contract.cjs tests/unit/p01_home_favorites_native_contract.cjs; do
              if node "$file" >/tmp/ia5-test-result.txt 2>&1; then
                echo "PASS_TEST=$file"
              else
                echo "FAIL_TEST=$file"
                grep -m1 -E 'AssertionError|SyntaxError|Error \[|Error:' /tmp/ia5-test-result.txt || true
                failed=$((failed+1))
              fi
            done
            echo "P01_IA5_CONTRACT_COUNT=$count"
            echo "P01_IA5_FAILURE_COUNT=$failed"
            test "$failed" -eq 0
          )
          echo P01_IA5_EXACT_SYNTAX_AND_CONTRACTS=PASS

      - name: Exact baseline canonical, FULL, Atomic, sentinel and rollback gate
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          VERSION: 2.47.484
          SOURCE: 2.47.483
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$GH_TOKEN"
          git clone -q --depth 1 --branch "v$SOURCE" "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" stable
          test "$(tr -d '\r\n ' < stable/VERSION)" = "$SOURCE"
          TARGET_TREE="$(git -C candidate rev-parse HEAD^{tree})"
          cat >/tmp/p01-r48-lane.json <<EOF
          {"schema":"vf-ephemeral-lane-spec/v1","lane_id":"p01-r48-exact","project_id":"P01","repository":"$PRODUCT_REPO","target_version":"$VERSION","target_sha":"$TARGET_SHA","target_tree":"$TARGET_TREE","source_versions":["$SOURCE"],"schema_version":"","candidate_run":"${{ github.run_id }}","previous_lane":{},"extra":{}}
          EOF
          python3 scripts/ephemeral_lane_spec.py validate --spec /tmp/p01-r48-lane.json >/dev/null
          python3 scripts/ephemeral_lane_worktree.py run-isolated --spec /tmp/p01-r48-lane.json --repo candidate --label r48-canonical -- bash tests/canonical_release_regression.sh . "$GITHUB_WORKSPACE/stable" --require-zero-debt | tee /tmp/p01-r48-canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/p01-r48-canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/p01-r48-canonical.txt
          echo P01_R48_EXACT_CANONICAL=PASS
          mkdir -p /tmp/p01-r48-base/full /tmp/p01-r48-base/update
          gh release download "v$SOURCE" -R "$PRODUCT_REPO" -D /tmp/p01-r48-base \
            -p "VF-Start-V${SOURCE}-FULL.zip" -p "VF_Start_V${SOURCE}_UPDATE.zip"
          unzip -q "/tmp/p01-r48-base/VF-Start-V${SOURCE}-FULL.zip" -d /tmp/p01-r48-base/full
          unzip -q "/tmp/p01-r48-base/VF_Start_V${SOURCE}_UPDATE.zip" -d /tmp/p01-r48-base/update
          test -f "/tmp/p01-r48-base/update/repair-v${SOURCE}.php"
          python3 scripts/p01-maintenance-release.py \
            --candidate candidate/src --baseline-full /tmp/p01-r48-base/full \
            --baseline-repair "/tmp/p01-r48-base/update/repair-v${SOURCE}.php" \
            --out /tmp/p01-r48-art --version "$VERSION" --source-version "$SOURCE" \
            --target-sha "$TARGET_SHA" --target-tree "$TARGET_TREE" >/tmp/p01-r48-build.txt
          FULL="/tmp/p01-r48-art/VF-Start-V${VERSION}-FULL.zip"
          UPDATE="/tmp/p01-r48-art/VF_Start_V${VERSION}_UPDATE.zip"
          test -s "$FULL" && test -s "$UPDATE"
          test "$(unzip -Z1 "$UPDATE")" = "repair-v${VERSION}.php"
          unzip -t "$FULL" >/dev/null
          unzip -t "$UPDATE" >/dev/null
          if unzip -Z1 "$FULL" | grep -Ei '(^|/)(\.runtime\.php|.*\.sqlite3?$|.*\.db$|private/|backups?/|sessions?/|tokens?/|staging/)'; then
            echo P01_PRIVATE_PAYLOAD_LEAK; exit 92
          fi
          if unzip -Z1 "$UPDATE" | grep -Ei '(^|/)(\.runtime\.php|.*\.sqlite3?$|.*\.db$|private/|backups?/|sessions?/|tokens?/|staging/)'; then
            echo P01_PRIVATE_PAYLOAD_LEAK; exit 92
          fi
          mkdir -p /tmp/p01-r48-atomic
          unzip -q "$UPDATE" -d /tmp/p01-r48-atomic
          REPAIR="/tmp/p01-r48-atomic/repair-v${VERSION}.php"
          php -l "$REPAIR"
          php "$REPAIR" --self-test | tee /tmp/p01-r48-selftest.txt
          grep -Fq '"ok":true' /tmp/p01-r48-selftest.txt
          echo P01_R48_EXACT_FULL_ATOMIC_BUILD=PASS
          install_site(){
            local zip="$1" root="$2" port="$3"
            rm -rf "$root"; mkdir -p "$root"; unzip -q "$zip" -d "$root"
            (cd "$root" && php -S 127.0.0.1:"$port" -t . >/tmp/p01-r48-install-"$port".log 2>&1) &
            local pid=$!
            for _ in $(seq 1 45); do
              if curl -fsS -c "/tmp/p01-r48-cookie-$port" -b "/tmp/p01-r48-cookie-$port" "http://127.0.0.1:$port/setup.php" -o /tmp/p01-r48-setup-"$port".html; then break; fi
              sleep 1
            done
            local csrf="$(python3 -c 'import re,sys; print(re.search(r"name=\"setup_csrf\"\s+value=\"([^\"]+)\"",open(sys.argv[1]).read()).group(1))' /tmp/p01-r48-setup-"$port".html)"
            curl -fsS -c "/tmp/p01-r48-cookie-$port" -b "/tmp/p01-r48-cookie-$port" -X POST "http://127.0.0.1:$port/setup.php" \
              --data-urlencode "setup_csrf=$csrf" \
              --data-urlencode "site_title=R48 Synthetic" \
              --data-urlencode "admin_password=ReleaseR48!$port" \
              --data-urlencode "admin_password_confirm=ReleaseR48!$port" \
              -o /tmp/p01-r48-installed-"$port".html
            test -f "$root/app/.runtime.php"
            (cd "$root" && php cli/verify.php) | grep -Fx 'VERIFY_PASS=YES'
            kill "$pid"; wait "$pid" || true
          }
          install_site "$FULL" /tmp/p01-r48-clean 18850
          test "$(tr -d '\r\n ' < /tmp/p01-r48-clean/VERSION.txt)" = "$VERSION"
          echo P01_R48_CLEAN_FULL_INSTALL=PASS
          install_site "/tmp/p01-r48-base/VF-Start-V${SOURCE}-FULL.zip" /tmp/p01-r48-upgrade 18851
          (cd /tmp/p01-r48-upgrade && php -r 'require "app/bootstrap.php"; $db=vf_db(); $db->exec("CREATE TABLE IF NOT EXISTS r48_sentinel (name TEXT NOT NULL)"); $db->exec("INSERT INTO r48_sentinel VALUES (\"private-owned\")");')
          cp "$REPAIR" /tmp/p01-r48-upgrade/
          php "/tmp/p01-r48-upgrade/repair-v${VERSION}.php" --verify-source=/tmp/p01-r48-upgrade | grep -F '"ok":true'
          php "/tmp/p01-r48-upgrade/repair-v${VERSION}.php" --run=/tmp/p01-r48-upgrade | tee /tmp/p01-r48-upgrade.txt
          grep -Fq '"ok":true' /tmp/p01-r48-upgrade.txt
          test "$(tr -d '\r\n ' < /tmp/p01-r48-upgrade/VERSION.txt)" = "$VERSION"
          (cd /tmp/p01-r48-upgrade && php cli/verify.php) | grep -Fx 'VERIFY_PASS=YES'
          (cd /tmp/p01-r48-upgrade && php -r 'require "app/bootstrap.php"; if(vf_db()->query("SELECT name FROM r48_sentinel")->fetchColumn()!=="private-owned")exit(3);')
          php "/tmp/p01-r48-upgrade/repair-v${VERSION}.php" --run=/tmp/p01-r48-upgrade | grep -F '"already_current":true'
          echo P01_R48_UPGRADE_DATA_PRESERVATION_AND_REPEAT=PASS
          install_site "/tmp/p01-r48-base/VF-Start-V${SOURCE}-FULL.zip" /tmp/p01-r48-rollback 18852
          cp "$REPAIR" /tmp/p01-r48-rollback/
          set +e
          VF_ATOMIC_TEST_FAIL_AFTER_APPLY=1 php "/tmp/p01-r48-rollback/repair-v${VERSION}.php" --run=/tmp/p01-r48-rollback >/tmp/p01-r48-rollback.txt 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          test "$(tr -d '\r\n ' < /tmp/p01-r48-rollback/VERSION.txt)" = "$SOURCE"
          (cd /tmp/p01-r48-rollback && php cli/verify.php) | grep -Fx 'VERIFY_PASS=YES'
          echo P01_R48_ATOMIC_FAILURE_ROLLBACK=PASS

      - name: Isolated Owner desktop 11+1 management geometry and task rail
        shell: bash
        run: |
          set -Eeuo pipefail
          root=/tmp/p01-ia5-r47-runtime
          rm -rf "$root" /tmp/p01-ia5-r47-browser
          mkdir -p "$root"
          cp -a candidate/src/. "$root/"
          (
            cd "$root"
            php -S 127.0.0.1:18760 -t . >/tmp/p01-ia5-r47-server.log 2>&1
          ) &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true; rm -rf "$root" /tmp/p01-ia5-r47-browser /tmp/p01-ia5-r47-browsers' EXIT
          for _ in $(seq 1 50); do
            if curl -fsS -c /tmp/p01-r47-cookie -b /tmp/p01-r47-cookie http://127.0.0.1:18760/setup.php -o /tmp/p01-r47-setup.html; then break; fi
            sleep 1
          done
          csrf="$(python3 - <<'PY'
          import re
          html=open('/tmp/p01-r47-setup.html',encoding='utf-8').read()
          hit=re.search(r'name="setup_csrf"\s+value="([^"]+)"',html)
          assert hit,'missing fresh setup csrf'
          print(hit.group(1))
          PY
          )"
          pass="IA5R47!18760"
          curl -fsS -c /tmp/p01-r47-cookie -b /tmp/p01-r47-cookie -X POST http://127.0.0.1:18760/setup.php \
            --data-urlencode "setup_csrf=$csrf" \
            --data-urlencode "site_title=IA V5 Isolated Synthetic" \
            --data-urlencode "admin_password=$pass" \
            --data-urlencode "admin_password_confirm=$pass" \
            -o /tmp/p01-r47-setup-post.html
          (cd "$root" && php cli/verify.php) | grep -Fx 'VERIFY_PASS=YES'
          npm install --prefix /tmp/p01-ia5-r47-browser --no-audit --no-fund playwright@1.56.1 >/tmp/p01-r47-npm.log
          PLAYWRIGHT_BROWSERS_PATH=/tmp/p01-ia5-r47-browsers /tmp/p01-ia5-r47-browser/node_modules/.bin/playwright install --with-deps chromium >/tmp/p01-r47-chromium.log
          export NODE_PATH=/tmp/p01-ia5-r47-browser/node_modules
          export PLAYWRIGHT_BROWSERS_PATH=/tmp/p01-ia5-r47-browsers
          node <<'JS'
          'use strict';
          const assert=require('node:assert/strict');
          const {chromium}=require('playwright');
          const origin='http://127.0.0.1:18760';
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            try{
              const context=await browser.newContext({viewport:{width:1440,height:900}});
              await context.route(/https?:\/\/(?!127\.0\.0\.1)/,route=>route.abort());
              const login=await context.request.post(origin+'/api.php?action=login',{data:{password:'IA5R47!18760'}});
              assert.equal(login.status(),200);
              assert.match(await login.text(),/"ok":true/);
              const page=await context.newPage();
              for (const width of [1440,768]){
                await page.setViewportSize({width,height:900});
                for(const route of ['index.php','channels.php','music-home.php']){
                  const res=await page.goto(origin+'/'+route,{waitUntil:'domcontentloaded'});
                  assert.ok(res&&res.status()===200,route+' Owner page 200');
                  const sourceUrl=page.url();
                  const currentMode=await page.locator('body').getAttribute('data-vf-mode');
                  const local=page.locator('[data-vf-local-manage-open]');
                  const global=page.locator('[data-vf-global-manage-open]');
                  assert.equal(await local.count(),1,route+' local trigger');
                  assert.equal(await global.count(),1,route+' global trigger');
                  await local.click();
                  const hub=page.locator('#vf-local-management');
                  assert.equal(await hub.evaluate(e=>e.open),true,route+' local dialog');
                  assert.equal(await hub.locator('[data-vf-management-tab]').count(),12,'11+1 domain tabs');
                  const localRail=hub.locator('.vf-local-management-sidebar');
                  assert.ok(await localRail.isVisible(),route+' local task rail visible');
                  const localGeometry=await hub.boundingBox();
                  assert.ok(localGeometry&&localGeometry.height>500,route+' local fixed tall geometry');
                  await hub.locator('[data-vf-local-manage-close]').first().click();
                  assert.equal(await hub.evaluate(e=>e.open),false);
                  await global.click();
                  assert.equal(await hub.evaluate(e=>e.open),true);
                  const initial=await hub.boundingBox();
                  assert.ok(initial&&initial.height>500,route+' global fixed tall geometry');
                  for(const domain of ['home','start','inbox','channels','watch','music','topics','courses','projects','tools','software']){
                    await hub.locator('[data-vf-management-tab="'+domain+'"]').click();
                    assert.equal(await hub.locator('[data-vf-management-tab="'+domain+'"]').getAttribute('aria-selected'),'true');
                    if(domain===currentMode){
                      assert.ok(await hub.locator('.vf-local-management-sidebar').isVisible(),domain+' canonical local rail');
                      assert.equal(await hub.locator('[data-vf-local-task][aria-pressed="true"]').count(),1,domain+' local selection');
                    }else{
                      const rail=hub.locator('[data-vf-remote-task-choices]');
                      assert.ok(await rail.isVisible(),domain+' remote task rail visible');
                      assert.equal(await rail.locator('button[aria-pressed="true"]').count(),1,domain+' single selected task');
                      assert.ok(await hub.locator('.vf-unified-global-groups').isVisible(),domain+' left groups visible');
                      if(domain==='music'){
                        const quick=hub.locator('[data-vf-remote-music-quick]');
                        await rail.locator('[data-vf-remote-task="music-quick"]').click();
                        assert.ok(await quick.isVisible(),'quick-add task visible');
                        assert.equal(await quick.locator('[data-vf-remote-music-quick-preview]').isDisabled(),true,'no auto preview or write');
                        if(route==='index.php'&&width===1440){
                          const csrf=await hub.locator('[data-vf-local-capture-form] input[name="csrf"]').inputValue();
                          assert.ok(csrf.length>10,'Owner csrf available');
                          const add=async(name)=>{
                            const resp=await context.request.post(origin+'/music-home.php',
                              {form:{csrf,action:'create_playlist',name}});
                            assert.equal(resp.status(),200,'create fixture playlist response');
                            const id=Number(new URL(resp.url()).searchParams.get('playlist'));
                            assert.ok(Number.isSafeInteger(id)&&id>0,'fixture playlist id');
                            return id;
                          };
                          const first=await add('R48 Fixture First');
                          const second=await add('R48 Fixture Second');
                          assert.notEqual(first,second,'two distinct playlist targets');
                          await quick.locator('[data-vf-remote-music-quick-load]').click();
                          await page.waitForFunction(()=>document.querySelector('[data-vf-remote-music-quick-choice]')?.options.length>=3);
                          await quick.locator('[data-vf-remote-music-quick-choice]').selectOption(String(second));
                          await quick.locator('[data-vf-remote-music-quick-content]').fill(
                            'R48 Test Song | Synthetic | https://upload.wikimedia.org/wikipedia/commons/a/a7/r48-demo.ogg');
                          await quick.locator('[data-vf-remote-music-quick-preview]').click();
                          await page.waitForFunction(()=>!document.querySelector('[data-vf-remote-music-quick-confirmation]')?.hidden,
                            null,{timeout:12000});
                          assert.match(await quick.locator('[data-vf-remote-music-quick-summary]').innerText(),/检查完成/);
                          assert.match(await quick.locator('[data-vf-remote-music-quick-status]').innerText(),/预览完成/);
                          await quick.locator('[data-vf-remote-music-quick-save]').click();
                          await page.waitForFunction(()=>document.querySelector('[data-vf-remote-music-quick-status]')?.textContent?.includes('服务器已确认处理'),
                            null,{timeout:15000});
                          const inv=await context.request.get(origin+'/api.php?action=music_playlist_inventory');
                          assert.equal(inv.status(),200,'music inventory Owner HTTP');
                          const body=await inv.json();
                          assert.equal(body.ok,true);
                          const p1=body.playlists.find(x=>Number(x.id)===first);
                          const p2=body.playlists.find(x=>Number(x.id)===second);
                          assert.ok(p1&&p2,'both fixture playlists available');
                          assert.equal(Number(p1.track_count),0,'untargeted playlist remains empty');
                          assert.equal(Number(p2.track_count),1,'exact selected playlist receives imported track');
                          const badToken=await context.request.post(origin+'/music-home.php?playlist='+second,
                            {form:{csrf:'incorrect-token',action:'quick_save',playlist_id:String(second),
                              content:'R48 Attack | Test | https://upload.wikimedia.org/wikipedia/commons/a/a7/denied.ogg'}});
                          assert.equal(badToken.status(),419,'reject wrong owner CSRF');
                          const guest=await browser.newContext({viewport:{width:1440,height:900}});
                          try{
                            const deniedRead=await guest.request.get(origin+'/api.php?action=music_playlist_inventory');
                            assert.ok([401,403].includes(deniedRead.status()),'guest cannot read private playlists');
                            const deniedWrite=await guest.request.post(origin+'/music-home.php?playlist='+second,
                              {form:{csrf,action:'quick_save',playlist_id:String(second),
                                content:'R48 Guest | Test | https://upload.wikimedia.org/wikipedia/commons/a/a7/guest.ogg'}});
                            assert.equal(deniedWrite.status(),403,'guest cannot submit music quick-save');
                          }finally{await guest.close();}
                          const still=await (await context.request.get(origin+'/api.php?action=music_playlist_inventory')).json();
                          assert.equal(Number(still.playlists.find(x=>Number(x.id)===second).track_count),1,
                            'bad CSRF and guest request did not modify private music');
                          console.log('P01_IA5_R48_OWNER_GUEST_CSRF=PASS');
                          console.log('P01_IA5_R48_MUSIC_SECOND_PLAYLIST_SAVE=PASS');
                        }
                        await rail.locator('[data-vf-remote-task="music"]').click();
                      }
                    }
                    const box=await hub.boundingBox();
                    assert.ok(Math.abs(box.width-initial.width)<=2 && Math.abs(box.height-initial.height)<=2,
                      route+'/'+width+'/'+domain+' fixed dialog geometry');
                    assert.equal(page.url(),sourceUrl,domain+' no page navigation');
                  }
                  await hub.locator('[data-vf-management-tab="global"]').click();
                  assert.equal(await hub.locator('[data-vf-management-tab="global"]').getAttribute('aria-selected'),'true');
                  assert.equal(await page.locator('dialog[open]').count(),1,'one native dialog');
                  assert.equal(await hub.locator('iframe').count(),0,'no iframe');
                  await hub.locator('[data-vf-local-manage-close]').last().click();
                  assert.equal(await hub.evaluate(e=>e.open),false);
                }
                console.log('P01_IA5_R48_OWNER_11PLUS1_'+width+'=PASS');
              }
              await context.close();
            }finally{await browser.close();}
          })().catch(e=>{console.error('P01_IA5_BROWSER_FAILURE='+String(e.message).slice(0,300));process.exit(1)});
          JS
          echo P01_IA5_R47_OWNER_DESKTOP_BROWSER=PASS

      - name: Report exact bounded verification
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git -C candidate status --porcelain)"
          echo P01_IA5_R48_EXACT_SOURCE_STATIC_GATE=PASS
          echo NOT_A_BROWSER_OWNER_HTTP_INSTALL_UPGRADE_OR_RELEASE_PROOF=YES
          echo NO_TAG_NO_RELEASE_NO_DISTRIBUTION_NO_PRODUCTION=YES

      - name: Remove transient private checkout
        if: always()
        shell: bash
        run: |
          rm -rf candidate
          echo PRIVATE_CHECKOUT_CLEANUP=PASS
