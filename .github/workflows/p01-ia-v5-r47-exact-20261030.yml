                  await ops.locator('[data-vf-ops-cancel]').click();
                  // Only in the isolated disposable Owner installation: exercise
                  // canonical schedule and job writes with actual server readback.
                  if(width===1440 && route==='index.php'){
                    const scheduleKey=await first.getAttribute('data-vf-ops-plan');
                    const toggle=ops.locator('[data-vf-ops-enabled="'+scheduleKey+'"]');
                    const original=await toggle.isChecked();
                    await toggle.setChecked(!original);
                    await first.click();
                    assert.equal(await ops.locator('[data-vf-ops-confirm]').isVisible(),true);
                    await ops.locator('[data-vf-ops-commit]').click();
                    await page.waitForFunction(()=>
                      document.querySelector('[data-vf-ops-status]')?.textContent?.includes('服务器已确认'),
                      null,{timeout:12000});
                    const checked=await (await context.request.get(origin+'/api.php?action=jobs_list&limit=1')).json();
                    assert.equal(checked.ok,true);
                    assert.equal(Number(checked.schedules.find(x=>x.schedule_key===scheduleKey).enabled),
                      Number(!original),'canonical schedule change readback');
                    await ops.locator('[data-vf-ops-read]').click();
                    await page.waitForFunction(()=>!document.querySelector('[data-vf-ops-readout]')?.hidden);
                    await ops.locator('[data-vf-ops-enqueue="integrity"]').click();
                    await ops.locator('[data-vf-ops-commit]').click();
                    await page.waitForFunction(()=>
                      document.querySelector('[data-vf-ops-status]')?.textContent?.includes('服务器已确认'),
                      null,{timeout:12000});
                    const after=await (await context.request.get(origin+'/api.php?action=jobs_list&limit=60')).json();
                    assert.ok(after.jobs.some(x=>x.job_type==='integrity'&&x.scope==='manual'),
                      'manual queue action uses original Worker authority');
                    const badCsrf=await context.request.post(origin+'/api.php?action=job_enqueue',{
                      headers:{'Content-Type':'application/json','X-CSRF-Token':'bad'},
                      data:JSON.stringify({job_type:'integrity',scope:'manual'})
                    });
                    assert.equal(badCsrf.status(),419,'CSRF invalid queue rejected');
                    console.log('P01_IA6_SCHEDULE_JOB_WRITE_READBACK_CSRF=PASS');
                  }
                  const baseline=hub.locator('[data-vf-baseline-root]');
                  await baseline.locator('summary').click();
                  await baseline.locator('[data-vf-baseline-read]').click();
                  await page.waitForFunction(()=>!document.querySelector('[data-vf-baseline-report]')?.hidden,null,{timeout:12000});
                  assert.ok(await baseline.locator('[data-vf-baseline-summary] dt').count()>=4,
                    'source-derived baseline report counts in native System tab');
                  assert.ok((await baseline.locator('[data-vf-baseline-state]').innerText()).includes('只读检查完成'),
                    'read-only no write baseline status');
                  console.log('P01_IA6_SYSTEM_BASELINE_NATIVE_'+width+'=PASS');
                  const pluginLifecycle=hub.locator('[data-vf-plugin-lifecycle]');
                  assert.equal(await pluginLifecycle.count(),1,'native advanced plugin lifecycle must exist');
                  await pluginLifecycle.locator('summary').click();
                  await pluginLifecycle.locator('[data-vf-plugin-lifecycle-read]').click();
                  await page.waitForFunction(()=>!document.querySelector('[data-vf-plugin-lifecycle-editor]')?.hidden,null,{timeout:12000});
                  const available=pluginLifecycle.locator('[data-vf-plugin-lifecycle-select] option');
                  assert.ok(await available.count()>=1,'plugin catalog read in same dialog');
                  if(await available.count()>1){
                    await pluginLifecycle.locator('[data-vf-plugin-lifecycle-select]').selectOption({index:1});
                    await pluginLifecycle.locator('[data-vf-plugin-lifecycle-backups]').click();
                    await page.waitForFunction(()=>!document.querySelector('[data-vf-plugin-lifecycle-status]')?.textContent?.includes('正在读取'),
                      null,{timeout:12000});
                    assert.ok(await pluginLifecycle.locator('[data-vf-plugin-lifecycle-backup-select]').count()===1);
                    const backup=pluginLifecycle.locator('[data-vf-plugin-lifecycle-action="backup"]');
                    if(await backup.isEnabled()){
                      await backup.click();
                      assert.equal(await pluginLifecycle.locator('[data-vf-plugin-lifecycle-confirm]').isVisible(),true,
                        'backup requires explicit final confirmation');
                      await pluginLifecycle.locator('[data-vf-plugin-lifecycle-cancel]').click();
                      assert.equal(await pluginLifecycle.locator('[data-vf-plugin-lifecycle-confirm]').isVisible(),false);
                    }
                  }
                  console.log('P01_IA6_PLUGIN_LIFECYCLE_NATIVE_'+width+'=PASS');
                  await hub.locator('[data-vf-global-group="data"]').click();
                  const files=hub.locator('[data-vf-recovery-files]');
                  assert.equal(await files.count(),1,'native recovery files panel exists');
                  await files.locator('summary').click();
                  await files.locator('[data-vf-recovery-read]').click();
                  await page.waitForFunction(()=>!document.querySelector('[data-vf-recovery-workspace]')?.hidden,null,{timeout:12000});
                  assert.equal(await files.locator('[data-vf-recovery-select]').count(),1);
                  assert.equal(await files.locator('[data-vf-recovery-confirm]').isVisible(),false,'no upload or restore without user');
                  await files.locator('[data-vf-recovery-kind="disaster"]').click();
                  assert.equal(await files.locator('[data-vf-recovery-action="restore"]').isDisabled(),true,
                    'no disaster restore before verified preview and typed phrase');
                  await files.locator('[data-vf-recovery-action="create"]').click();
                  assert.equal(await files.locator('[data-vf-recovery-confirm]').isVisible(),true,'recovery package create requires second confirmation');
                  await files.locator('[data-vf-recovery-cancel]').click();
                  assert.equal(await files.locator('[data-vf-recovery-confirm]').isVisible(),false,'cancel protected creation');
                  await hub.locator('[data-vf-global-group="settings"]').click();
                  const tmdb=hub.locator('[data-vf-tmdb-root]');
                  await tmdb.locator('summary').click();
                  await tmdb.locator('[data-vf-tmdb-load]').click();
                  await page.waitForFunction(()=>!document.querySelector('[data-vf-tmdb-form]')?.hidden,null,{timeout:12000});
                  assert.equal(await tmdb.locator('input[type=password]').count(),1,'provider never renders saved secret');
                  await hub.locator('[data-vf-global-group="update"]').click();
                  const uc=hub.locator('[data-vf-uc-root]');
                  await uc.locator('summary').click();
                  await uc.locator('[data-vf-uc-read]').click();
                  await page.waitForFunction(()=>!document.querySelector('[data-vf-uc-form]')?.hidden,null,{timeout:12000});
                  assert.equal(await uc.locator('input[type=password]').count(),1,'update token never echoed');
                  const badCredentials=await context.request.post(origin+'/api.php?action=update_credential_save',{
                    headers:{'Content-Type':'application/json','X-CSRF-Token':'invalid'},
                    data:JSON.stringify({token:'any-token-not-really-configured-12345'})
                  });
                  assert.equal(badCredentials.status(),419,'update auth write blocked on invalid CSRF');
                  console.log('P01_IA6_RECOVERY_CREDENTIAL_TMDb_NATIVE_'+width+'=PASS');
                  console.log('P01_IA6_SYSTEM_AND_JOBS_NATIVE_'+width+'=PASS');
                  assert.equal(await page.locator('dialog[open]').count(),1,'one native dialog');
                  assert.equal(await hub.locator('iframe').count(),0,'no iframe');
                  // R49: production-reported Update page was only a stale cache viewer.
                  await hub.locator('[data-vf-global-group="update"]').click();
                  const update=hub.locator('#updatePanel');
                  assert.ok(await update.isVisible(),'real inline updater is visible');
                  await page.waitForFunction(()=>window.vfUpdateMount!==undefined,{timeout:12000});
                  await page.waitForFunction(()=>document.querySelector('#updateCurrent')?.textContent?.includes('2.47.485'),null,{timeout:12000});
                  assert.equal(await update.locator('#checkUpdate').isVisible(),true,'Owner can check updates');
                  // Existing cache can legitimately show an eligible newer version.
                  // No installation API may be invoked by merely opening the task.
                  assert.equal(await update.locator('#installUpdate').count(),1,'canonical guarded installation control');
                  if(width===1440 && route==='index.php'){
                    let checks=0,prepares=0;
                    await page.route('**/api.php?action=update_check',r=>{
                      checks++;r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true,result:{}})});
                    });
                    await page.route('**/api.php?action=update_status',r=>{
                      r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true,status:{
                        project_id:'P01',current_version:'2.47.485',latest_version:'2.47.486',
                        available:true,can_update:true,credential_configured:true,
                        last_check_at:'2026-10-30T01:00:00Z',reason:'R49 synthetic',history:[]
                      }})});
                    });
                    await page.route('**/api.php?action=update_prepare',r=>{
                      prepares++;r.fulfill({status:403,contentType:'application/json',body:'{"ok":false,"error":"test blocked"}'});
                    });
                    await update.locator('#checkUpdate').click();
                    await page.waitForFunction(()=>!document.querySelector('#installUpdate')?.hidden,null,{timeout:12000});
                    assert.equal(checks,1,'only Owner check submits update_check');
                    await update.locator('#installUpdate').click();
                    assert.equal(await update.locator('[data-vf-update-confirm]').isVisible(),true,'in-dialog explicit install confirmation');
                    assert.equal(prepares,0,'first click never prepares/installs');
                    await update.locator('[data-vf-update-confirm-cancel]').click();
                    assert.equal(prepares,0,'cancel never prepares/installs');
                    assert.equal(await update.locator('[data-vf-update-confirm]').isVisible(),false);
                    console.log('P01_IA5_R49_INLINE_UPDATE_OWNER_CONFIRM=PASS');
                  }
                  await hub.locator('[data-vf-local-manage-close]').last().click();
                  assert.equal(await hub.evaluate(e=>e.open),false);
                }
                // Whole-product denominator: every *current page* management
                // entry must preserve the same native modal and left task rail.
                const allRoutes=[
                  'home.php','start.php','inbox.php','channels.php','watch.php',
                  'music-shell.php?view=home','topics.php','courses.php',
                  'projects.php','tools.php','software.php'
                ];
                let verified=0;
                for(const target of allRoutes){
                  const response=await page.goto(origin+'/'+target,{waitUntil:'domcontentloaded'});
                  assert.ok(response&&response.status()===200,target+' Owner route HTTP');
                  const manager=page.locator('[data-vf-local-manage-open]');
                  const allManager=page.locator('[data-vf-global-manage-open]');
                  assert.equal(await manager.count(),1,target+' local management entry');
                  assert.equal(await allManager.count(),1,target+' global management entry');
                  const beforeLocal=page.url();
                  await manager.click();
                  const dialog=page.locator('#vf-local-management');
                  assert.equal(await dialog.evaluate(e=>e.open),true,target+' native management modal');
                  assert.ok(await dialog.locator('.vf-local-management-sidebar').isVisible(),target+' local left task rail');
                  assert.equal(await dialog.locator('[data-vf-management-tab]').count(),12,target+' complete 11+1 tabs');
                  assert.equal(await dialog.locator('[data-vf-local-task][aria-pressed="true"]').count(),1,target+' one task');
                  const bounds=await dialog.boundingBox();
                  assert.ok(bounds&&bounds.height>=500,target+' no collapsing modal');
                  // Music's persistent dock legitimately uses replaceState to
                  // reflect its child panel route after iframe load. This is
                  // same-document URL synchronization, not a management hop.
                  const currentUrl=new URL(page.url());
                  const baselineUrl=new URL(beforeLocal);
                  assert.equal(currentUrl.pathname,baselineUrl.pathname,target+' remains in its original page');
                  if(target.startsWith('music-shell.php')){
                    assert.equal(currentUrl.searchParams.get('view'),'home','Music playback shell remains active');
                  }else{
                    assert.equal(page.url(),beforeLocal,target+' unchanged after management');
                  }
                  await dialog.locator('[data-vf-local-manage-close]').first().click();
                  assert.equal(await dialog.evaluate(e=>e.open),false,target+' safely closes modal');
                  verified++;
                }
                assert.equal(verified,11);
                console.log('P01_IA5_R48_ALL_11_LOCAL_OWNERS_'+width+'=PASS');
                console.log('P01_IA5_R48_OWNER_11PLUS1_'+width+'=PASS');
              }
              await context.close();
            }finally{await browser.close();}
          })().catch(e=>{console.error('P01_IA5_BROWSER_FAILURE='+String(e.message).slice(0,300));process.exit(1)});
          JS
          echo P01_IA5_R47_OWNER_DESKTOP_BROWSER=PASS

      - name: Report exact bounded verification
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git -C candidate status --porcelain)"
          echo P01_IA5_R48_EXACT_SOURCE_STATIC_GATE=PASS
          echo NOT_A_BROWSER_OWNER_HTTP_INSTALL_UPGRADE_OR_RELEASE_PROOF=YES
          echo NO_TAG_NO_RELEASE_NO_DISTRIBUTION_NO_PRODUCTION=YES

      - name: Remove transient private checkout
        if: always()
        shell: bash
        run: |
          rm -rf candidate
          echo PRIVATE_CHECKOUT_CLEANUP=PASS
