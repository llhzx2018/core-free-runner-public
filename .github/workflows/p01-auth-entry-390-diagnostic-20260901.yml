name: P01 Auth Entry 390 Diagnostic
on:
  push:
    branches: [temp/p01-auth-entry-fix-20260901]
    paths:
      - .github/workflows/p01-auth-entry-390-diagnostic-20260901.yml
      - scripts/p01-auth-entry-390-diagnostic.cjs
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SOURCE: 9b354d5db93b4c81930014331e055611decdbbf8
      ROOT: ${{ github.workspace }}/product/src
      EVID: /tmp/p01-auth-entry-390-diag
      PORT: '18572'
      ADMIN_PASS: P01AuthEntry2026
    steps:
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          path: product
      - name: Fresh runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVID"
          php -S 127.0.0.1:$PORT -t "$ROOT" >"$EVID/server.log" 2>&1 & echo $! >/tmp/p01-auth-entry-390.pid
          for i in $(seq 1 60); do curl -fsS "http://127.0.0.1:$PORT/setup.php" -o "$EVID/setup.html" && break; sleep .25; done
          CSRF=$(python3 - "$EVID/setup.html" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -X POST "http://127.0.0.1:$PORT/setup.php" --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=P01 Auth 390' --data-urlencode "admin_password=$ADMIN_PASS" --data-urlencode "admin_password_confirm=$ADMIN_PASS" -o "$EVID/setup-post.html"
      - name: Browser diagnostic
        shell: bash
        run: |
          set -Eeuo pipefail
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"; test -n "$CHROME"; export CHROME
          mkdir -p /tmp/p01-auth-entry-390-pw; cd /tmp/p01-auth-entry-390-pw; npm init -y >/dev/null 2>&1; npm install playwright-core@1.55.0 >/dev/null 2>&1
          NODE_PATH=/tmp/p01-auth-entry-390-pw/node_modules PORT="$PORT" EVID="$EVID" CHROME="$CHROME" node "$GITHUB_WORKSPACE/runner/scripts/p01-auth-entry-390-diagnostic.cjs" | tee "$EVID/stdout.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-auth-entry-390-diag-${{ github.run_id }}
          path: /tmp/p01-auth-entry-390-diag
          if-no-files-found: warn
          retention-days: 14
      - if: always()
        shell: bash
        run: kill "$(cat /tmp/p01-auth-entry-390.pid 2>/dev/null)" 2>/dev/null || true
