name: TEMP S01-C02 1.21.797 Core Updates Gate

on:
  push:
    branches:
      - temp/s01-c02-v121797-core-updates-gate-20260903
    paths:
      - '.github/workflows/temp-s01-c02-v121797-core-updates-gate.yml'

permissions:
  contents: read

jobs:
  update-channel-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: fa24418ea4bf1a4061f5376c9bce863cb8120761
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: updates

      - name: Verify candidate identity and UpdateCore regression
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C updates rev-parse HEAD)" = fa24418ea4bf1a4061f5376c9bce863cb8120761
          jq empty updates/projects/S01-C02.json
          find updates/update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php updates/update-core/php/tests/run.php
          echo 'UPDATE_CORE_REGRESSION=PASS'

      - name: Verify S01-C02 manifest and released asset readback
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          FILE=updates/projects/S01-C02.json
          jq -e '.schema_version=="wp-component-1.0" and .project_id=="S01" and .component_id=="S01-C02" and .target_version=="1.21.797" and .from_versions==["1.21.796"] and .release_tag=="v1.21.797" and .asset_name=="vf-tools-ops_V1.21.797.zip" and .asset_bytes==3193338 and .asset_sha256=="e9ce68864f3fa3c047dd6557de2b30e8e882f069e65a0a3f9db337e60110c559" and .runtime_files==892 and .runtime_fingerprint=="c4383bac28b99e5dc1d339cc8a3f45a54764cd4646f0c3ad409d97f622382395" and .runtime_file_count==892 and .runtime_fingerprint_sha256=="c4383bac28b99e5dc1d339cc8a3f45a54764cd4646f0c3ad409d97f622382395" and .schema_from=="6.0.0" and .schema_to=="6.0.0" and .backup_required==true and .rollback_supported==true and .physical_locator=="vf-ops/vf-ops.php" and .locator_cutover==false' "$FILE" >/dev/null
          REL="$(curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.797')"
          test "$(jq -r '.id' <<<"$REL")" = 382420194
          test "$(jq -r '.assets[]|select(.name=="vf-tools-ops_V1.21.797.zip")|.id' <<<"$REL")" = 543600167
          test "$(jq -r '.assets[]|select(.name=="vf-tools-ops_V1.21.797.zip")|.size' <<<"$REL")" = 3193338
          test "$(jq -r '.assets[]|select(.name=="vf-tools-ops_V1.21.797.zip")|.digest' <<<"$REL")" = 'sha256:e9ce68864f3fa3c047dd6557de2b30e8e882f069e65a0a3f9db337e60110c559'
          TAG="$(curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/llhzx2018/vf-tools-ops/git/ref/tags/v1.21.797')"
          test "$(jq -r '.object.sha' <<<"$TAG")" = ac7dc58d877473a8124f2478466470d3c59cd018
          echo 'S01_C02_1_21_797_CHANNEL_IDENTITY=PASS'
