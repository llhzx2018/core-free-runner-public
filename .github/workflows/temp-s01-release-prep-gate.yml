name: TEMP S01 Pre-Release WordPress Gate

on:
  push:
    branches:
      - temp/s01-release-prep-gate-20260902

permissions:
  contents: read

concurrency:
  group: temp-s01-release-prep-gate-20260902
  cancel-in-progress: true

jobs:
  release-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: vf_s01_owner
          MARIADB_USER: vf
          MARIADB_PASSWORD: vf
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      OPS_SHA: 9a486f5a3431bb0777b722e0c0bb2954a1278c46
      M3U8_SHA: a51bf0bfbd0cacf9479bf8ee734398d94fba9b4f
      M3U8_LEGACY_SHA: 2e636cf580b77116c02048b19b36894b0295851b
      THEME_SHA: a293009567c932310d19a310a8ea6361a2ef71c8
      WP_VERSION: 7.0.2
      WP_PATH: /tmp/vf-s01-owner-wp
      WP_URL: http://127.0.0.1:8080
      WP_ADMIN_USER: owner
      EVIDENCE_DIR: /tmp/vf-s01-pre-release-evidence

    steps:
      - name: Checkout exact temporary runner harness snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: runner

      - name: Checkout exact Ops release-prep source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 9a486f5a3431bb0777b722e0c0bb2954a1278c46
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: ops

      - name: Checkout exact M3U8 release-prep source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: a51bf0bfbd0cacf9479bf8ee734398d94fba9b4f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: m3u8

      - name: Checkout exact legacy M3U8 migration source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: 2e636cf580b77116c02048b19b36894b0295851b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: m3u8-legacy

      - name: Checkout exact Theme source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: a293009567c932310d19a310a8ea6361a2ef71c8
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: theme

      - name: Verify release candidate identity and build package audit
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR" /tmp/vf-s01-release-packages
          test "$(git -C ops rev-parse HEAD)" = "$OPS_SHA"
          test "$(git -C m3u8 rev-parse HEAD)" = "$M3U8_SHA"
          test "$(git -C m3u8-legacy rev-parse HEAD)" = "$M3U8_LEGACY_SHA"
          test "$(git -C theme rev-parse HEAD)" = "$THEME_SHA"
          test "$(tr -d '\r\n' < ops/VERSION)" = '1.21.792'
          grep -Fq ' * Version: 1.21.792' ops/vf-ops.php
          grep -Fq "define('VF_OPS_VERSION', '1.21.792')" ops/vf-ops.php
          test "$(tr -d '\r\n' < m3u8/VERSION)" = '1.25.4'
          grep -Fq ' * Version: 1.25.4' m3u8/src/vf-tool-m3u8.php
          grep -Fq "define('VF_TOOL_M3U8_VERSION', '1.25.4')" m3u8/src/vf-tool-m3u8.php
          grep -Fq "define('VF_TOOL_M3U8_ROUND', 'R228')" m3u8/src/vf-tool-m3u8.php
          grep -Fq "return 'R228_PROVIDER_SCHEMA_IDENTITY_RECOVERY';" m3u8/src/vf-tool-m3u8.php
          grep -Fq "return '1.3.0'" m3u8/src/includes/v6-provider-schema.php
          python3 - <<'PY'
          import hashlib,json,re,zipfile
          from pathlib import Path
          ev=Path('/tmp/vf-s01-pre-release-evidence'); out=Path('/tmp/vf-s01-release-packages'); ops=Path('ops'); m3=Path('m3u8')
          pp=json.load(open(m3/'src/PACKAGE_PROFILE.json')); pm=json.load(open(m3/'src/plugin-manifest.json'))
          assert (pp['pluginVersion'],pp['version'],pp['round'])==('1.25.4','1.25.4','R228')
          assert (pm['pluginVersion'],pm['version'],pm['round'])==('1.25.4','1.25.4','R228')
          assert pp['profile']=='R224 VF Tools M3U8 V7.1 Phase 2 security revalidated'
          assert pp['currentVerification']['version']=='1.25.0' and pp['currentVerification']['round']=='R222'
          def ops_runtime(rel):
              p=rel.as_posix().lstrip('/'); parts=p.split('/')
              if not p or '..' in parts:return False
              if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in parts):return False
              if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',p,re.I):return False
              if '/' not in p:return p in {'vf-ops.php','uninstall.php'}
              return parts[0] in {'includes','assets','languages','config'}
          of={p.relative_to(ops).as_posix():p.read_bytes() for p in ops.rglob('*') if p.is_file() and not p.is_symlink() and ops_runtime(p.relative_to(ops))}; of=dict(sorted(of.items()))
          root=m3/'src'; mf={p.relative_to(root).as_posix():p.read_bytes() for p in root.rglob('*') if p.is_file() and not p.is_symlink()}; mf=dict(sorted(mf.items()))
          assert 'vf-ops.php' in of and 'uninstall.php' in of and 'vf-tool-m3u8.php' in mf
          def pack(path,root,files):
              with zipfile.ZipFile(path,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
                  for rel,b in sorted(files.items()):
                      zi=zipfile.ZipInfo(f'{root}/{rel}',(2026,9,2,0,0,0));zi.compress_type=zipfile.ZIP_DEFLATED;zi.external_attr=0o100644<<16;z.writestr(zi,b)
              return hashlib.sha256(path.read_bytes()).hexdigest()
          opz=out/'vf-tools-ops_V1.21.792.zip'; m3z=out/'vf-tool-m3u8_V1.25.4.zip'; osha=pack(opz,'vf-ops',of); msha=pack(m3z,'vf-tool-m3u8',mf)
          with zipfile.ZipFile(opz) as z: assert z.read('vf-ops/vf-ops.php').decode().count(' * Version: 1.21.792')==1
          with zipfile.ZipFile(m3z) as z:
              main=z.read('vf-tool-m3u8/vf-tool-m3u8.php').decode(); assert main.count(' * Version: 1.25.4')==1; assert "define('VF_TOOL_M3U8_ROUND', 'R228')" in main
          data={'status':'PASS','release_write':False,'tag_write':False,'core_updates_write':False,'production_write':False,'ops':{'sha':'9a486f5a3431bb0777b722e0c0bb2954a1278c46','version':'1.21.792','zip_files':len(of),'zip_bytes':opz.stat().st_size,'zip_sha256':osha},'m3u8':{'sha':'a51bf0bfbd0cacf9479bf8ee734398d94fba9b4f','version':'1.25.4','round':'R228','provider_schema':'1.3.0','zip_files':len(mf),'zip_bytes':m3z.stat().st_size,'zip_sha256':msha},'theme':{'sha':'a293009567c932310d19a310a8ea6361a2ef71c8','version':'1.35.8','new_release_required':False}}
          (ev/'release-package-audit.json').write_text(json.dumps(data,indent=2)+'\n'); opz.unlink(); m3z.unlink()
          PY

      - name: Patch proven runtime and browser harness expectations in workspace only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          runtime=Path('runner/scripts/temp-s01-c02-owner-runtime-v2.sh')
          s=runtime.read_text()
          assert s.count('1.21.791')==3, s.count('1.21.791')
          assert s.count('1.25.3')==3, s.count('1.25.3')
          assert s.count(r'1\.21\.791')==1, s.count(r'1\.21\.791')
          assert s.count(r'1\.25\.3')==1, s.count(r'1\.25\.3')
          s=s.replace('1.21.791','1.21.792').replace('1.25.3','1.25.4')
          legacy="test \"$(tr -d '\\r\\n' < m3u8-legacy/VERSION)\" = '1.25.4'"
          assert s.count(legacy)==1
          s=s.replace(legacy,"test \"$(tr -d '\\r\\n' < m3u8-legacy/VERSION)\" = '1.25.3'",1)
          s=s.replace(r'1\.21\.791',r'1\.21\.792').replace(r'1\.25\.3',r'1\.25\.4')
          assert s.count('1.21.791')==0
          assert s.count('1.25.3')==1
          assert s.count(r'1\.21\.791')==0
          assert s.count(r'1\.25\.3')==0
          runtime.write_text(s)

          browser=Path('runner/scripts/temp-s01-c02-owner-browser-v2.js')
          b=browser.read_text()
          assert b.count("fresh.ops === '1.21.791'")==1
          assert b.count("fresh.m3u8 === '1.25.3'")==1
          b=b.replace("fresh.ops === '1.21.791'","fresh.ops === '1.21.792'")
          b=b.replace("fresh.m3u8 === '1.25.3'","fresh.m3u8 === '1.25.4'")
          browser.write_text(b)
          PY

      - name: Execute isolated WordPress release candidate gate
        shell: bash
        run: bash -x runner/scripts/temp-s01-c02-owner-runtime-v2.sh

      - name: Seal pre-release gate evidence
        if: success()
        shell: bash
        run: |
          jq -e '.ops=="1.21.792" and .m3u8=="1.25.4" and .theme=="1.35.8" and .schema=="1.3.0" and .migration.status=="PASS" and .readiness.status=="PASS" and .ownerState.status=="PASS"' "$EVIDENCE_DIR/final-runtime-readback.json" >/dev/null
          cat > "$EVIDENCE_DIR/S01_PRE_RELEASE_WORDPRESS_GATE.txt" <<EOF
          S01_PRE_RELEASE_WORDPRESS_GATE=PASS
          OPS_SHA=$OPS_SHA
          OPS_VERSION=1.21.792
          M3U8_SHA=$M3U8_SHA
          M3U8_VERSION=1.25.4
          M3U8_ROUND=R228
          M3U8_PROVIDER_SCHEMA=1.3.0
          THEME_SHA=$THEME_SHA
          THEME_VERSION=1.35.8
          WORDPRESS=$WP_VERSION
          MARIADB=11.4
          PACKAGE_AUDIT=PASS
          LEGACY_SCHEMA_MIGRATION=PASS
          OWNER_GOLDEN_PATH=PASS
          RELEASE_WRITE=NO
          TAG_WRITE=NO
          CORE_UPDATES_WRITE=NO
          PRODUCTION_WRITE=NO
          EOF

      - name: Upload public-safe pre-release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-pre-release-wordpress-gate-${{ github.run_id }}
          path: /tmp/vf-s01-pre-release-evidence/
          if-no-files-found: warn
          retention-days: 14
