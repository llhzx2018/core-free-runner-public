name: P07 current public product actual use (disposable)
on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - '.github/workflows/temp-p07-current-public-use-20261127.yml'
permissions:
  contents: read
jobs:
  actual-use:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.actor == 'llhzx2018' && github.event.pull_request.user.login == 'llhzx2018' && github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.ref == 'temp/p07-current-public-use-20261127'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        module: [m01, m02, m03, m04, m05]
    steps:
      - name: Actual anonymous current Toolbox install and bounded product operation
        shell: bash
        env:
          MODULE: ${{ matrix.module }}
        run: |
          set -Eeuo pipefail
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          test ! -e /opt/vfops-modules
          test ! -e /opt/vf-server-ops
          test ! -e /home/clp
          test ! -e /etc/cloudpanel
          work="$(mktemp -d)"
          trap 'sudo -n rm -rf -- "$work"' EXIT
          curl --proto '=https' --tlsv1.2 -fsSL --connect-timeout 15 --max-time 60 https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/p07-toolbox.sh -o "$work/public-toolbox.sh"
          python3 - "$work/public-toolbox.sh" <<'PY'
          import hashlib, pathlib, sys
          data=pathlib.Path(sys.argv[1]).read_bytes()
          assert hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()=="2b021ab7df93a339fd3cf9885a25ac9b91dc3768"
          print("ACTUAL_PUBLIC_TOOLBOX_BYTES=PASS")
          PY
          case "$MODULE" in
            m01) printf '1\n0\n0\n' > "$work/input";;
            m02) printf '2\n0\n\n0\n' > "$work/input";;
            m03) printf '3\n1\n0\n0\n' > "$work/input";;
            m04) printf '4\n0\n0\n' > "$work/input";;
            m05) printf '5\n0\n0\n' > "$work/input";;
            *) exit 13;;
          esac
          rc=0
          sudo -n timeout --kill-after=5s 240s script -qfec "env NO_COLOR=1 TERM=dumb bash $work/public-toolbox.sh" "$work/menu.log" < "$work/input" >/dev/null 2>&1 || rc=$?
          echo "PUBLIC_MENU_EXIT=$rc"
          if [ "$rc" -ne 0 ]; then
            if grep -Fq '身份不符' "$work/menu.log"; then echo PUBLIC_ERROR=IDENTITY_REFUSAL; fi
            if grep -Fq '下载失败' "$work/menu.log"; then echo PUBLIC_ERROR=DOWNLOAD_FAILURE; fi
          fi
          test "$rc" = 0
          case "$MODULE" in
            m01)
              test "$(readlink /opt/vfops-modules/m01/current)" = releases/0.1.0-ux3
              test "$(sudo -n bash /opt/vfops-modules/m01/current/vf-node.sh --version)" = 'VF Network Node 0.1.0-ux3'
              echo ACTUAL_CURRENT_INSTALL=PASS
              rc=0
              sudo -n env NO_COLOR=1 bash /opt/vfops-modules/m01/current/vf-node.sh status > "$work/action.log" 2>&1 || rc=$?
              echo "REAL_NODE_STATUS_EXIT=$rc"
              grep -Fq '网络代理节点状态' "$work/action.log"
              grep -Fq '未安装' "$work/action.log"
              echo ACTUAL_NODE_ABSENT_STATUS=PASS
              echo REAL_PROXY_CONNECTION=NOT_RUN
              ;;
            m02)
              test "$(readlink /opt/vfops-modules/m02/current)" = releases/2.1.1-ux3
              test "$(bash /opt/vfops-modules/m02/current/vps-audit.sh --build-id)" = 2.1.1-ux3
              echo ACTUAL_CURRENT_INSTALL=PASS
              mkdir -p "$work/bench" "$work/report"
              rc=0
              sudo -n env NO_COLOR=1 P07_BENCH_DIR="$work/bench" P07_REPORT_DIR="$work/report" timeout --kill-after=10s 720s bash /opt/vfops-modules/m02/current/vps-audit.sh > "$work/action.log" 2>&1 || rc=$?
              echo "REAL_FULL_AUDIT_EXIT=$rc"
              if [ "$rc" -ne 0 ]; then
                if grep -Fq '基础验机模块下载失败' "$work/action.log"; then echo REAL_AUDIT_BLOCK=BASE_DOWNLOAD; fi
                if grep -Fq '基础验机未正常完成' "$work/action.log"; then echo REAL_AUDIT_BLOCK=BASE_FAILURE; fi
                exit 1
              fi
              test -n "$(find "$work/report" -maxdepth 1 -name '*.md' -type f -print -quit)"
              echo ACTUAL_FULL_AUDIT_REPORT_CREATED=PASS
              ;;
            m03)
              test "$(cat /opt/vf-server-ops/BUILD_ID)" = 0.1.0-release146
              sudo -n bash "$work/public-toolbox.sh" --check-m03 >/dev/null
              echo ACTUAL_CURRENT_INSTALL=PASS
              rc=0
              sudo -n env NO_COLOR=1 /opt/vf-server-ops/bin/vfops inventory --compact > "$work/action.log" 2>&1 || rc=$?
              echo "REAL_EMPTY_HOST_INVENTORY_EXIT=$rc"
              test -s "$work/action.log"
              echo ACTUAL_EMPTY_HOST_INVENTORY_EXECUTED=YES
              echo REAL_CLOUDPANEL_BUSINESS_AND_DUAL_HOST=NOT_RUN
              ;;
            m04)
              test "$(readlink /opt/vfops-modules/m04/current)" = releases/0.1.0-ux5
              test "$(sudo -n bash /opt/vfops-modules/m04/current/vf-system-care.sh --version)" = '服务器维护与安全 0.1.0-ux5'
              echo ACTUAL_CURRENT_INSTALL=PASS
              rc=0
              sudo -n env NO_COLOR=1 timeout 180s bash /opt/vfops-modules/m04/current/vf-system-care.sh audit > "$work/action.log" 2>&1 || rc=$?
              echo "REAL_SYSTEM_AUDIT_EXIT=$rc"
              test "$rc" = 0
              grep -Fq '服务器健康检查' "$work/action.log"
              echo ACTUAL_SYSTEM_HEALTH_OPERATION=PASS
              echo SYSTEM_MUTATION=NOT_RUN
              ;;
            m05)
              test "$(readlink /opt/vfops-modules/m05/current)" = releases/0.1.0-m05-ux16-runtime-identity-catalog
              test "$(sudo -n bash /opt/vfops-modules/m05/current/bin/vfops-init-entry --version)" = 'P07-M05 新服务器初始化 0.1.0-m05-ux16-runtime-identity-catalog'
              echo ACTUAL_CURRENT_INSTALL=PASS
              rc=0
              sudo -n env NO_COLOR=1 timeout 120s bash /opt/vfops-modules/m05/current/bin/vfops-init-core server-migrate target-status --bootstrap-preflight > "$work/action.log" 2>&1 || rc=$?
              echo "REAL_INIT_PREFLIGHT_EXIT=$rc"
              test "$rc" = 0 -o "$rc" = 13
              test -s "$work/action.log"
              echo ACTUAL_HOST_PREFLIGHT_EXECUTED=YES
              echo CLOUDPANEL_INSTALLATION=NOT_RUN
              ;;
          esac
          for sibling in m01 m02 m03 m04 m05; do
            [ "$sibling" = "$MODULE" ] && continue
            if [ "$sibling" = m03 ]; then test ! -e /opt/vf-server-ops; else test ! -e "/opt/vfops-modules/$sibling"; fi
          done
          echo OTHER_FOUR_MODULES_NOT_INSTALLED=PASS
          echo ACTUAL_PRODUCT_USE_SCOPE=BOUNDED_NOT_FULL_PRODUCT_ACCEPTANCE
