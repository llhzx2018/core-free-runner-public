name: P02 Daily UX Micro Refinement R1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-daily-ux-micro-r1.yml'

permissions:
  contents: read

jobs:
  verify-and-sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PRODUCT_REF: deeb7e037bca9fe37b88cbfc4ef94849d59cefd9
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      DEVELOP_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Require registered capabilities
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN"
          test -n "$DEVELOP_WRITE_TOKEN"
          echo PRIVATE_READ_CAPABILITY=PASS
          echo DEVELOP_WRITE_CAPABILITY=PASS

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: develop
          token: ${{ env.DEVELOP_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
          path: product

      - name: Verify exact P02 develop UX checkpoint
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_REF"
          test "$(tr -d '\r\n' < VERSION)" = '2.5.30'
          python3 scripts/verify-source-manifest.py
          python3 scripts/repository-gates.py
          node tests/unit/p02_daily_ux_micro_refinement.mjs
          git diff --check
          cp SOURCE_MANIFEST.json /tmp/source-manifest.json
          python3 scripts/generate-source-manifest.py
          cmp /tmp/source-manifest.json SOURCE_MANIFEST.json
          test "$(git status --short | awk '{print $2}' | sort | tr '\n' ' ')" = 'SOURCE_MANIFEST.txt '
          echo SOURCE_MANIFEST_JSON_REGEN_IDENTITY=PASS
          echo P02_DAILY_UX_MICRO_REFINEMENT_GATE=PASS

      - name: Sync only the human-readable manifest to develop
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git diff --name-only | sort | tr '\n' ' ')" = 'SOURCE_MANIFEST.txt '
          git diff --check
          git config user.name 'VF Develop Runner'
          git config user.email 'vf-develop-runner@users.noreply.github.com'
          git add SOURCE_MANIFEST.txt
          git commit -m 'chore(P02): sync UX source manifest text'
          NEW_SHA="$(git rev-parse HEAD)"
          git push origin HEAD:develop
          echo "PRODUCT_DEVELOP_SHA=$NEW_SHA"
          echo SOURCE_MANIFEST_TXT_SYNC=PASS

      - name: Protected boundaries
        if: always()
        run: |
          echo PRIVATE_SOURCE_PERSISTED=NO
          echo PRODUCT_DEVELOP_WRITE=SOURCE_MANIFEST_TXT_ONLY
          echo MAIN_WRITE=NO
          echo RELEASE_WRITE=NO
          echo TAG_WRITE=NO
          echo PRODUCTION_WRITE=NO
