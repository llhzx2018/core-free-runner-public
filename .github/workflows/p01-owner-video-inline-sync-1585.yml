name: P01 Owner Video Inline Sync One-shot #1585
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-owner-video-inline-sync-1585.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_REPO: llhzx2018/vf-start
      EXACT_SHA: c8d2c662b1c97cc020c6f00ee52fea4cd6c1ee92
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl,mbstring,sqlite3,pdo_sqlite,SimpleXML,zip
          coverage: none
      - name: Bind exact private candidate
        shell: bash
        env:
          TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$TOKEN"
          ROOT="$RUNNER_TEMP/p01-inline-video-sync"
          mkdir -p "$ROOT"
          chmod 700 "$ROOT"
          echo "P01_WORK=$ROOT" >> "$GITHUB_ENV"
          git clone -q --no-checkout "https://x-access-token:${TOKEN}@github.com/$SOURCE_REPO.git" "$ROOT/candidate"
          git -C "$ROOT/candidate" checkout -q --detach "$EXACT_SHA"
          git -C "$ROOT/candidate" remote set-url origin "https://github.com/$SOURCE_REPO.git"
          test "$(git -C "$ROOT/candidate" rev-parse HEAD)" = "$EXACT_SHA"
          echo P01_VIDEO_INLINE_SYNC_EXACT_SOURCE=PASS
      - name: Focused video and directory manual sync regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$P01_WORK/candidate"
          php -l src/app/ChannelLibraryPage.php
          php -l tests/unit/channels_owner_video_manual_sync_native.php
          node --check src/assets/channel-youtube-updates.js
          node --check tests/integration/youtube_video_reader_sync_node.js
          php tests/unit/channels_owner_video_manual_sync_native.php
          php tests/unit/channels_reader_r4_single_toolbar_contract.php
          php tests/unit/channels_reader_shell_r2_contract.php
          php tests/unit/channels_owner_header_toolbar_r3_contract.php
          php tests/unit/channels_owner_default_video_view_native.php
          php tests/unit/channel_video_feed_owner_cache_native.php
          php tests/unit/youtube_manual_updates_cache_native.php
          php tests/unit/youtube_batch_server_contract_native.php
          php tests/unit/channels_guest_readonly_layout_v247390_contract.php
          node tests/integration/youtube_video_reader_sync_node.js
          node tests/integration/youtube_batch_sequential_node.js
          node tests/integration/youtube_modal_thumbnails_node.js
          node tests/integration/channel_video_feed_layout_node.js
          node tests/browser/channel_reader_responsive_owner_smoke.cjs
          echo P01_OWNER_VIDEO_INLINE_SYNC_FOCUSED=PASS
      - name: Remove private source
        if: always()
        shell: bash
        run: |
          if [ -n "${P01_WORK:-}" ]; then rm -rf -- "$P01_WORK"; fi
          echo P01_OWNER_VIDEO_INLINE_SYNC_EPHEMERAL=PASS
