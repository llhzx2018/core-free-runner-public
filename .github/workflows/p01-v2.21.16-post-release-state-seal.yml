name: P01 V2.21.16 Post-Release State Seal

on:
  push:
    branches: [main]
    paths:
      - state-triggers/P01_V2.21.16_POST_RELEASE_SEAL

permissions:
  contents: read

env:
  TESTED_CANDIDATE: c9ab60f2a15be1e15ba7e80ee935da2bc8d4f1fa
  TESTED_TREE: 30ec1dccdd0c57a4f158313fe0a7e4ac6f709a7c
  RELEASE_ID: '371187274'
  UPDATE_BYTES: '1049243'
  UPDATE_SHA: 3a7bfae9ff96f6caf5759be8db9fe2b57f9659d9532252ebdf5f617b03dbb648
  PRODUCTION_MAIN: 7c7ad1da3e8dcd49fa49313317c389948f40d4de

jobs:
  state-seal:
    runs-on: ubuntu-24.04
    env:
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Checkout P01 develop
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: develop
          token: ${{ env.WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: p01

      - name: Require exact tested Candidate parent and unchanged product source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p01 rev-parse HEAD)" = "$TESTED_CANDIDATE"
          test "$(git -C p01 rev-parse HEAD^{tree})" = "$TESTED_TREE"
          test "$(tr -d '\r\n' < p01/VERSION)" = '2.21.16'
          test "$(tr -d '\r\n' < p01/src/VERSION.txt)" = '2.21.16'
          echo 'TESTED_CANDIDATE_PARENT=PASS'

      - name: Seal docs-only current state
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,pathlib,os
          root=pathlib.Path('p01')
          p=root/'VF_PROJECT.json'
          d=json.loads(p.read_text(encoding='utf-8'))
          d['status']='V2.21.16 FORMAL RELEASE VERIFIED / CORE-UPDATES PUBLISHED / REAL PRODUCTION DISCOVERY PENDING'
          d['production_version']='2.21.14'
          d['working_version']='2.21.16'
          d['candidate_version']='2.21.16'
          d['candidate_state']='FORMAL RELEASE VERIFIED / NOT PRODUCTION'
          d['current_phase']='V2.21.16 FORMAL RELEASE COMPLETE / STOP BEFORE PRODUCTION UPGRADE'
          d['verified_release_ready']=True
          d['formal_artifact_gate']='PASS_FINAL_BYTES_EXACTLY_EQUAL_TESTED_CANDIDATE'
          d['release_gates']['rel_cg_ready']='PASS'
          d['release_gates']['rel_cg_promotion']='NOT_EXECUTED_PRODUCTION_NOT_UPGRADED'
          d['corrective_release']={
            'version':'2.21.16',
            'supersedes':'2.21.15',
            'root_cause_generator':'IDENTIFIED',
            'generator_fix':'PASS',
            'old_runtime_authority':'VERIFIED',
            'gate_only_files':'EXCLUDED_FROM_RUNTIME_GATE',
            'browser_extension_boundary':'FORMALLY_RESOLVED / 1.6.4 UNCHANGED',
            'v2_21_14_frozen_fixture':'VERIFIED',
            'original_v2_21_15_failure_replay':'PASS',
            'corrected_v2_21_16_fixture_upgrade':'PASS',
            'true_runtime_tamper_negative':'PASS',
            'tested_candidate_commit':os.environ['TESTED_CANDIDATE'],
            'tested_candidate_tree':os.environ['TESTED_TREE'],
            'release_id':int(os.environ['RELEASE_ID']),
            'release_tag':'v2.21.16',
            'update_asset':'VF_Start_V2.21.16_UPDATE.zip',
            'update_bytes':int(os.environ['UPDATE_BYTES']),
            'update_sha256':os.environ['UPDATE_SHA'],
            'core_updates':'2.21.16 / VERIFIED',
            'post_release_read_only_proof_run':31916004985,
            'post_release_read_only_proof':'PASS',
            'production_upgrade':'NOT EXECUTED',
            'production_write':0
          }
          d['next_action']='REAL PRODUCTION ONLINE DISCOVERY READBACK FOR 2.21.14 -> 2.21.16; DO NOT EXECUTE PRODUCTION UPGRADE WITHOUT MASTER AUTHORIZATION'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          ev=root/'docs/evidence/V2.21.16_FORMAL_RELEASE_CURRENT_STATE.md'
          ev.write_text(f'''# P01 · VF Start · V2.21.16 正式发布当前状态\n\n- Root Cause Generator：IDENTIFIED\n- Generator Fix：PASS\n- Prior Runtime Authority：V2.21.14 Frozen Runtime / VERIFIED\n- 7 Gate-only Files：EXCLUDED FROM APP RUNTIME GATE\n- Browser Extension Boundary：FORMALLY RESOLVED / V1.6.4 UNCHANGED\n- Original V2.21.15 Failure Replay：PASS\n- Corrected V2.21.16 Fixture Upgrade：PASS\n- True Runtime Tamper Negative：PASS\n- Candidate：`{os.environ['TESTED_CANDIDATE']}` / Tree `{os.environ['TESTED_TREE']}`\n- Release：`v2.21.16` / ID `{os.environ['RELEASE_ID']}`\n- UPDATE：`VF_Start_V2.21.16_UPDATE.zip` / `{os.environ['UPDATE_BYTES']}` bytes / `{os.environ['UPDATE_SHA']}`\n- core-updates：P01 → `2.21.16` / VERIFIED\n- Post-Release Read-Only Proof：Run `31916004985` / PASS\n- Production：`2.21.14`\n- Schema：`2026080902`\n- Production Upgrade：NOT EXECUTED\n- P01 main：`{os.environ['PRODUCTION_MAIN']}` / UNCHANGED\n\n下一步只有真实 Production 在线发现回读；未经主控授权不得执行 V2.21.16 Production Upgrade。\n''',encoding='utf-8')
          PY
          cd p01
          git config user.name 'VF Release Automation'
          git config user.email 'vf-release-automation@users.noreply.github.com'
          git add VF_PROJECT.json docs/evidence/V2.21.16_FORMAL_RELEASE_CURRENT_STATE.md
          test -z "$(git diff --cached --name-only -- src)"
          git commit -m 'docs(authority): seal P01 V2.21.16 formal release state'
          git push origin develop
          echo "SEALED_DEVELOP=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo 'DOCS_ONLY_STATE_SEAL=PASS'

      - name: Remote readback
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C p01 fetch origin develop
          test "$(git -C p01 rev-parse origin/develop)" = "$SEALED_DEVELOP"
          git -C p01 diff --name-only "$TESTED_CANDIDATE" "$SEALED_DEVELOP" | tee /tmp/seal-files.txt
          python3 - <<'PY'
          allowed={'VF_PROJECT.json','docs/evidence/V2.21.16_FORMAL_RELEASE_CURRENT_STATE.md'}
          got={x.strip() for x in open('/tmp/seal-files.txt',encoding='utf-8') if x.strip()}
          assert got==allowed,(got,allowed)
          print('REMOTE_DOCS_ONLY_SEAL=PASS')
          PY
