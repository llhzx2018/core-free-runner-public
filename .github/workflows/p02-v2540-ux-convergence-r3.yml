name: P02 V2.5.40 UX Convergence Gate R3

on:
  push:
    branches:
      - run/p02-v2540-ux-convergence-r3-20260919
    paths:
      - '.github/workflows/p02-v2540-ux-convergence-r3.yml'

permissions:
  contents: read

jobs:
  ux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_REPO: llhzx2018/vf-library
      TARGET_SHA: 855a8df74fcdfdf10586d04380ae63ab1020ef37
    steps:
      - name: Checkout exact private P02 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 855a8df74fcdfdf10586d04380ae63ab1020ef37
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product

      - name: Install runtime and Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-zip sqlite3 curl
          cd product
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify repository and UX contracts
        shell: bash
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          bash scripts/verify-repository.sh
          node tests/unit/p02_v2540_final_ux_convergence.mjs
          node tests/unit/p02_inkstone_shell_parity.mjs
          node tests/unit/p02_visible_shell_refactor.mjs
          echo P02_V2540_UX_SOURCE_GATE_R3=PASS

      - name: Real Chromium UX regression
        shell: bash
        working-directory: product
        run: |
          set -Eeuo pipefail
          bash scripts/ux-browser-reverify.sh
          echo P02_V2540_UX_BROWSER_GATE_R3=PASS
