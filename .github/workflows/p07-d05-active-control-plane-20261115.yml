name: P07 D05 final compatibility planner exact source QA
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  exact-source-qa:
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout public proof harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact P07 draft source with read-only runtime credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: bed3906a21ca9a3c27ac29ca2f3f12682b1ca616
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: .p07-private-final-d05
      - name: Regression, D05 isolation and seven-scenario UX from exact private SHA
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-private-final-d05 rev-parse HEAD)" = bed3906a21ca9a3c27ac29ca2f3f12682b1ca616
          cd .p07-private-final-d05
          export PYTHONPATH="$PWD/lib"
          for test_file in \
            test_p07_m03_db_conversion_plan.py \
            test_p07_m03_d05_readonly_discovery.py \
            test_p07_m03_d05_fresh_target.py \
            test_p07_m03_d05_cli_inspect.py \
            test_p07_m03_d05_cloudpanel_active.py \
            test_p07_m03_d05_sandbox_transaction.py \
            test_p07_m03_d05_site_sandbox.py \
            test_p07_m03_d04_matched_engine.py \
            test_p07_terminal_ux_contract.py; do
            python3 -B -m unittest discover -s tests -p "$test_file" -v
          done
          python3 -B scripts/check_p07_modules.py --module P07-M03-D05 \
            --pr-title 'P07-M03-D05 数据库引擎转换：兼容性路线与安全收口' \
            --changed-file lib/db_engine_conversion.py \
            --changed-file lib/db_engine_conversion_discovery.py \
            --changed-file lib/db_engine_conversion_fresh_target.py \
            --changed-file bin/vfops-db-convert-plan.py \
            --affected P07-M03-D05 \
            --shared-reason '独立D05只读规划器兼容状态'
          python3 -B scripts/check_p07_terminal_ux.py \
            --module P07-M03-D05 \
            --changed-file bin/vfops-db-convert-plan.py \
            --evidence-file docs/ux-reviews/p07-m03-d05-readonly-inspect-v1.json \
            --evidence-file docs/ux-reviews/p07-m03-d05-fresh-native-v1.json
          echo P07_D05_FINAL_EXACT_SOURCE_ROUTING_QA=PASS
      - name: Real MariaDB-to-native MySQL and Percona fresh target safety
        shell: bash
        timeout-minutes: 20
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          bash tests/p07_m03_d05_fresh_native_real_services_20261116.sh
      - name: Remove all private source and synthetic inputs
        if: always()
        shell: bash
        run: |
          rm -rf -- .p07-private-final-d05
          test ! -e .p07-private-final-d05
          echo P07_D05_PRIVATE_EXACT_SOURCE_CLEANED=PASS
