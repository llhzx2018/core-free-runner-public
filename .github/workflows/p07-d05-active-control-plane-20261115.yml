name: P07 D05 real CloudPanel Active control-plane proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-d05-active-control-plane-20261115.yml'
permissions:
  contents: read
jobs:
  active-probe:
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    strategy:
      fail-fast: false
      matrix:
        source_engine: [MYSQL_8.4, MARIADB_11.8]
    steps:
      - name: Public disposable CloudPanel lab harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Bind ephemeral private P07 source identity
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 0eac0ba1aa1c72a8d4f3282c9f14cdcba64b1625
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: .p07-private-d05active
      - name: Read actual installed CloudPanel admin routes and active DB registration
        shell: bash
        env:
          P07_D05_SOURCE_ENGINE: ${{ matrix.source_engine }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-private-d05active rev-parse HEAD)" = 0eac0ba1aa1c72a8d4f3282c9f14cdcba64b1625
          bash -n tests/p07_m03_d05_active_discovery_20261115.sh
          timeout --signal=TERM --kill-after=20s 2600s \
            bash tests/p07_m03_d05_active_discovery_20261115.sh
      - name: Destroy synthetic VM and private source
        if: always()
        shell: bash
        run: |
          set +e
          sudo ip link del p07tapold >/dev/null 2>&1
          sudo ip link del p07br0 >/dev/null 2>&1
          sudo iptables -t nat -D POSTROUTING -s 172.29.71.0/24 -j MASQUERADE >/dev/null 2>&1
          rm -rf -- .p07-private-d05active
          test ! -e .p07-private-d05active
          echo P07_D05_ACTIVE_LAB_PRIVATE_CODE_REMOVED=PASS
