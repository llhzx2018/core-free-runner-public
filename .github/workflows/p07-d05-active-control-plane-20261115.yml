name: P07 D05 real CloudPanel Active control-plane proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-d05-active-control-plane-20261115.yml'
permissions:
  contents: read
jobs:
  active-probe:
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    strategy:
      fail-fast: false
      matrix:
        source_engine: [MARIADB_11.8]
    steps:
      - name: Public disposable CloudPanel lab harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Bind ephemeral private P07 source identity
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: ee48366a31dfe9a08dd75cf563cbada4b288432f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: .p07-private-d05active
      - name: Read actual installed CloudPanel admin routes and active DB registration
        shell: bash
        env:
          P07_D05_SOURCE_ENGINE: ${{ matrix.source_engine }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-private-d05active rev-parse HEAD)" = ee48366a31dfe9a08dd75cf563cbada4b288432f
          (
            cd .p07-private-d05active
            export PYTHONPATH="$PWD/lib"
            python3 -B -m unittest discover -s tests -p test_p07_m03_d05_cloudpanel_active.py -v
            python3 -B scripts/check_p07_modules.py --module P07-M03-D05 \
              --pr-title 'P07-M03-D05 数据库引擎转换：隔离CloudPanel Active控制面只读与官方UI机器验证' \
              --changed-file lib/db_engine_conversion_cloudpanel_active.py \
              --affected P07-M03-D05 --shared-reason 'D05只读面板状态检查'
          )
          bash -n tests/p07_m03_d05_active_discovery_20261115.sh
          timeout --signal=TERM --kill-after=20s 2600s \
            bash tests/p07_m03_d05_active_discovery_20261115.sh
      - name: Destroy synthetic VM and private source
        if: always()
        shell: bash
        run: |
          set +e
          sudo ip link del p07tapold >/dev/null 2>&1
          sudo ip link del p07br0 >/dev/null 2>&1
          sudo iptables -t nat -D POSTROUTING -s 172.29.71.0/24 -j MASQUERADE >/dev/null 2>&1
          rm -rf -- .p07-private-d05active
          test ! -e .p07-private-d05active
          echo P07_D05_ACTIVE_LAB_PRIVATE_CODE_REMOVED=PASS
