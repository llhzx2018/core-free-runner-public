name: P01 508 private Owner package (NOT FORMAL)
on:
  push:
    branches:
      - task/p01-security-508-owner-candidate-20261109
permissions:
  contents: read
concurrency:
  group: p01-508-owner-package-20261109
  cancel-in-progress: false
jobs:
  owner-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WORK: /tmp/p01-security-507-package-20261109
      SHA: 15acb2c403ee5623b495130999aa3ff6431f683a
      PRODUCT: llhzx2018/vf-start
      TARGET: 2.47.508
      SOURCE: 2.47.507
      TAG: trial/p01-security-2.47.508-20261109
    steps:
      - name: Checkout registered public builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout private product transiently at exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 15acb2c403ee5623b495130999aa3ff6431f683a
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p01-exact
          persist-credentials: false
      - name: Build official-version-numbered FULL and Atomic trial payloads
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd unzip zip jq >/dev/null
          test "$(git -C p01-exact rev-parse HEAD)" = "$SHA"
          test -z "$(git -C p01-exact status --porcelain)"
          test "$(tr -d '\r\n ' < p01-exact/VERSION)" = "$TARGET"
          test "$(tr -d '\r\n ' < p01-exact/src/VERSION.txt)" = "$TARGET"
          grep -Fx "define('VF_VERSION', '2.47.508');" p01-exact/src/app/bootstrap.php
          mkdir -p "$WORK/baseline" "$WORK/previous" "$WORK/output"
          gh release download "v$SOURCE" -R "$PRODUCT" -D "$WORK" \
            -p "VF-Start-V2.47.507-FULL.zip" -p "VF_Start_V2.47.507_UPDATE.zip"
          echo "28c81494df3914e07ec3c932b08883aad7fa2dd159df76bc270a0345a9503611  $WORK/VF-Start-V2.47.507-FULL.zip" | sha256sum -c -
          echo "710c935a25dbf15d87928f3c33225a98c22a5a795aa71ee776da41f3dbe01d11  $WORK/VF_Start_V2.47.507_UPDATE.zip" | sha256sum -c -
          unzip -q "$WORK/VF-Start-V2.47.507-FULL.zip" -d "$WORK/baseline"
          unzip -q "$WORK/VF_Start_V2.47.507_UPDATE.zip" -d "$WORK/previous"
          test -f "$WORK/previous/repair-v2.47.507.php"
          tree="$(git -C p01-exact rev-parse HEAD^{tree})"
          python3 scripts/p01-maintenance-release.py \
            --candidate p01-exact/src --baseline-full "$WORK/baseline" \
            --baseline-repair "$WORK/previous/repair-v2.47.507.php" \
            --out "$WORK/output" --version "$TARGET" --source-version "$SOURCE" \
            --target-sha "$SHA" --target-tree "$tree" > "$WORK/receipt.json"
          jq -e --arg v "$TARGET" --arg source "$SOURCE" --arg sha "$SHA" \
            '.version==$v and .source_version==$source and .target_sha==$sha' "$WORK/receipt.json"
          full="$WORK/output/VF-Start-V2.47.508-FULL.zip"
          atomic="$WORK/output/VF_Start_V2.47.508_UPDATE.zip"
          test -s "$full" && test -s "$atomic"
          unzip -t "$full" >/dev/null
          unzip -t "$atomic" >/dev/null
          test "$(unzip -Z1 "$atomic")" = repair-v2.47.508.php
          if unzip -Z1 "$full" | grep -Ei '(^|/)(\.runtime\.php|.*\.sqlite3?$|.*\.db$|private/|backups?/|sessions?/|tokens?/|staging/|news-cache/)' >/dev/null; then
            echo PRIVATE_PAYLOAD_LEAK; exit 91
          fi
          echo P01_508_EXACT_FULL_ATOMIC_BUILT=PASS
      - name: Package one Chinese-labeled test bundle with SHA-256
        shell: bash
        run: |
          set -Eeuo pipefail
          dest="$WORK/bundle/VF_Start_2.47.508_OWNER_CANDIDATE"
          mkdir -p "$dest"
          cp "$WORK/output/VF-Start-V2.47.508-FULL.zip" "$dest/"
          cp "$WORK/output/VF_Start_V2.47.508_UPDATE.zip" "$dest/"
          (cd "$dest" && sha256sum *.zip > SHA256SUMS.txt)
          cat > "$dest/README_先看我.txt" <<'EOT'
          VF Start 2.47.508 OWNER CANDIDATE · 尚非正式 Release
          源码: 15acb2c403ee5623b495130999aa3ff6431f683a
          来源: 正式 2.47.507
          
          内容: FULL 全新安装包、Atomic 升级包、SHA256SUMS.txt
          此包尚未进入 core-updates，不能覆盖 start.kewaro.com 正式站。
          FULL 只用于可丢弃的独立测试网站。
          UPDATE 只用于可丢弃的 2.47.507 安装副本。
          请先备份站点文件、SQLite / WAL / SHM、私有数据、媒体、
          配置和恢复包；失败时从独立备份恢复测试站。
          
          已取得 506→507 隔离 FULL/Atomic、BackupManager 恢复、
          故障回滚、基础 Canonical 和静态安全合同 PASS。
          尚缺真实导入 UNKNOWN/428 浏览器与灾难重启/中断恢复安全证明。
          此前平台拒绝的等价安全测试未绕过、未执行。
          这不是正式安全版本；Production 不自动变更。
          EOT
          (cd "$WORK/bundle" && zip -q -r "$WORK/P01_VF_Start_2.47.508_OWNER_CANDIDATE_NOT_FORMAL.zip" VF_Start_2.47.508_OWNER_CANDIDATE)
          unzip -t "$WORK/P01_VF_Start_2.47.508_OWNER_CANDIDATE_NOT_FORMAL.zip" >/dev/null
          sha256sum "$WORK/P01_VF_Start_2.47.508_OWNER_CANDIDATE_NOT_FORMAL.zip"
          echo P01_508_OWNER_BUNDLE_READY=PASS
      - name: Upload only to private non-formal prerelease and byte-verify remote ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          test "$(gh api repos/llhzx2018/vf-start --jq '.private')" = true
          if gh api "repos/llhzx2018/vf-start/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo CANDIDATE_TAG_ALREADY_EXISTS; exit 48
          fi
          gh api --method POST repos/llhzx2018/vf-start/git/refs \
            -f "ref=refs/tags/$TAG" -f "sha=$SHA" >/dev/null
          test "$(gh api "repos/llhzx2018/vf-start/git/ref/tags/$TAG" --jq '.object.sha')" = "$SHA"
          cat > "$WORK/notes.md" <<'EOT'
          # P01 VF Start 2.47.508 OWNER CANDIDATE (NOT FORMAL)
          一个 ZIP：FULL、Atomic、SHA256SUMS 与中文说明。
          来源为安全 PR #1949 精确代码。仅供独立可丢弃测试站手工试用。
          **尚未完成高风险安全正式发布门禁，不得用于 Production。**
          不更新 core-updates；之前被拒的安全操作没有绕行测试。
          EOT
          gh release create "$TAG" "$WORK/P01_VF_Start_2.47.508_OWNER_CANDIDATE_NOT_FORMAL.zip" \
            -R "$PRODUCT" --title "VF Start 2.47.508 OWNER CANDIDATE — NOT FORMAL" \
            --notes-file "$WORK/notes.md" --prerelease --verify-tag
          gh api "repos/llhzx2018/vf-start/releases/tags/$TAG" > "$WORK/remote.json"
          test "$(jq -r '.prerelease' "$WORK/remote.json")" = true
          test "$(jq -r '.draft' "$WORK/remote.json")" = false
          test "$(jq -r '.tag_name' "$WORK/remote.json")" = "$TAG"
          test "$(jq '.assets|length' "$WORK/remote.json")" -eq 1
          mkdir -p "$WORK/remote"
          gh release download "$TAG" -R "$PRODUCT" -D "$WORK/remote" -p P01_VF_Start_2.47.508_OWNER_CANDIDATE_NOT_FORMAL.zip
          cmp "$WORK/P01_VF_Start_2.47.508_OWNER_CANDIDATE_NOT_FORMAL.zip" "$WORK/remote/P01_VF_Start_2.47.508_OWNER_CANDIDATE_NOT_FORMAL.zip"
          echo P01_508_OWNER_CANDIDATE_GITHUB_REMOTE_SHA=PASS
          echo P01_508_FORMAL_RELEASE=NO
          echo P01_508_DISTRIBUTION_CHANGED=NO
          echo P01_508_PRODUCTION_WRITES=NONE
      - name: Delete transient private product and scratch files
        if: always()
        shell: bash
        run: |
          rm -rf p01-exact "$WORK"
          echo P01_508_PRIVATE_SOURCE_CLEANED=YES
