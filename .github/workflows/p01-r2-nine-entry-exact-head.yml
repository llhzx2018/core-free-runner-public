name: P01 Round 2 Nine Entry Exact Head Gate
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  p01-round2-nine-entry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact P01 candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: a23ac074877f5a883bb04becbf3c852d533832b4
          path: vf-start
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring
          coverage: none
      - name: Syntax gate
        shell: bash
        run: |
          set -euo pipefail
          cd vf-start
          for file in \
            src/app/FunctionalWorkspace.php \
            src/app/FunctionalWorkspaceCore.php \
            src/app/FunctionalWorkspaceShell.php \
            src/app/ResourceSearch.php \
            src/app/SurfaceShell.php \
            src/app/WorkspaceViewCatalog.php \
            src/books.php \
            src/courses.php \
            src/software.php \
            src/surface.php \
            src/tools.php \
            tests/unit/resource_search_contract.php \
            tests/unit/workspace_nine_entry_source_contract.php \
            tests/unit/workspace_view_catalog_contract.php
          do
            php -l "$file"
          done
      - name: Focused contracts
        shell: bash
        run: |
          set -euo pipefail
          cd vf-start
          php tests/unit/workspace_view_catalog_contract.php
          php tests/unit/workspace_nine_entry_source_contract.php
          php tests/unit/resource_search_contract.php
          php tests/unit/quick_open_global_contract.php
