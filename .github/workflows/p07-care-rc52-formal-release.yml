name: P07 rc52 Formal Release and Remote Readback
on:
  push:
    branches: [main]
    paths:
      - 'packages/p07-system-care/0.1.0-rc52/**'
      - 'installers/p07-system-care.sh'
      - '.github/workflows/p07-care-rc52-formal-release.yml'

permissions:
  contents: read

concurrency:
  group: p07-rc52-formal-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_TAG: p07-v0.1.0-release84-care-rc52-wp-one-page-overview
      RELEASE_REPO: llhzx2018/core-free-runner-public
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Exact merged source and immutable distribution preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN" || { echo 'P07_RELEASE_TOKEN_MISSING'; exit 78; }
          test "$GITHUB_REPOSITORY" = "$RELEASE_REPO"
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_main="$(gh api "repos/$RELEASE_REPO/git/ref/heads/main" --jq '.object.sha')"
          test "$remote_main" = "$GITHUB_SHA"
          pkg='packages/p07-system-care/0.1.0-rc52'
          test "$(cat "$pkg/VERSION")" = '0.1.0-rc52'
          test "$(git hash-object "$pkg/MANIFEST.gitblob")" = 'd32c9dc5eba1e517e2cc5f7f3876d6bf694dcc4b'
          (cd "$pkg" && while read -r sha name; do test "$(git hash-object "$name")" = "$sha"; done < MANIFEST.gitblob)
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc52"' installers/p07-toolbox.sh
          grep -Fq "VERSION='0.1.0-rc52'" installers/p07-system-care.sh
          grep -Fq "MANIFEST_BLOB='d32c9dc5eba1e517e2cc5f7f3876d6bf694dcc4b'" installers/p07-system-care.sh
          bash -n "$pkg/intrusion-evidence.sh" installers/p07-system-care.sh installers/p07-toolbox.sh
          python3 -m unittest discover -s tests -p 'test_p07_wp_owner_baseline_rc50.py' -q
          python3 -m unittest discover -s tests -p 'test_p07_wp_owner_status_rc51.py' -q
          python3 -m unittest discover -s tests -p 'test_p07_wp_owner_overview_rc52.py' -q
          python3 -m unittest discover -s tests -p 'test_p07_wp_owner_triage_rc48.py' -q
          echo 'P07_RC52_MERGED_EXACT_SOURCE=PASS'

      - name: Formal Release through registered VF release credential
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! gh release view "$RELEASE_TAG" -R "$RELEASE_REPO" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" -R "$RELEASE_REPO" --target "$GITHUB_SHA" \
              --title 'P07 · rc52 WordPress 文件历史按网站合并单页展示' \
              --notes 'rc51 已正式发布且保持不可变。WordPress 安全历史从每页 7 条分页改为单次连续概览，按网站和完整文件路径分组，同名文件合并且保留每项历史记录计数；最多展示 120 个不同文件并公开剩余数量，全部原始证据保留且可只读查看。文件变化仅分类待核实，不会自动认定文件安全。安全基线更新仍有强制确认。其他菜单和安全逻辑不变，未写入生产服务器；OWNER 实机验收待完成。'
          fi
          tag_sha="$(gh api "repos/$RELEASE_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          test "$tag_sha" = "$GITHUB_SHA" || { echo 'P07_RC52_TAG_IDENTITY_MISMATCH'; exit 81; }
          release_data="$(gh api "repos/$RELEASE_REPO/releases/tags/$RELEASE_TAG")"
          test "$(jq -r '.tag_name' <<< "$release_data")" = "$RELEASE_TAG"
          test "$(jq -r '.target_commitish' <<< "$release_data")" = "$GITHUB_SHA"
          test "$(jq -r '.draft' <<< "$release_data")" = false
          test "$(jq -r '.prerelease' <<< "$release_data")" = false
          echo 'P07_RC52_FORMAL_RELEASE_REMOTE_READBACK=PASS'

      - name: Published public distribution and raw-byte readback
        shell: bash
        run: |
          set -Eeuo pipefail
          manifest_url="https://raw.githubusercontent.com/$RELEASE_REPO/$GITHUB_SHA/packages/p07-system-care/0.1.0-rc52/MANIFEST.gitblob"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 5 --retry-delay 2 "$manifest_url" -o /tmp/p07-rc52-manifest
          test "$(git hash-object /tmp/p07-rc52-manifest)" = 'd32c9dc5eba1e517e2cc5f7f3876d6bf694dcc4b'
          url="https://raw.githubusercontent.com/$RELEASE_REPO/main/installers/p07-system-care.sh"
          good=0
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL --proto '=https' --tlsv1.2 "$url" -o /tmp/p07-public-installer &&
              grep -Fq "VERSION='0.1.0-rc52'" /tmp/p07-public-installer &&
              grep -Fq "MANIFEST_BLOB='d32c9dc5eba1e517e2cc5f7f3876d6bf694dcc4b'" /tmp/p07-public-installer; then
              good=1
              break
            fi
            sleep 3
          done
          test "$good" = 1 || { echo P07_RC52_PUBLIC_INSTALLER_NOT_CURRENT; exit 85; }
          echo 'P07_RC52_PUBLIC_DISTRIBUTION_REMOTE_READBACK=PASS'
