name: P01 V2.32.0 Final Metadata Fence
on:
  push:
    branches: [task/p01-v2320-candidate-closure-20260830]
    paths:
      - .github/workflows/p01-v2320-final-metadata-fence-20260830.yml
permissions:
  contents: read
jobs:
  fence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact final candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: a842a79517ce89b216abbc514aa73395f7bac009
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Final docs-bound exact-source fence
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          EVID=/tmp/p01-v2320-final-metadata-fence
          rm -rf "$EVID" && mkdir -p "$EVID"
          test "$(git rev-parse HEAD)" = a842a79517ce89b216abbc514aa73395f7bac009
          test "$(git rev-parse HEAD^{tree})" = d0fa7c87ebefef083712ec0b7707a6c4273943f2
          test "$(git rev-parse HEAD:src)" = f348cb314623906acc851cb79d75b1c8f6637aff
          git diff --name-only 8b4f3483579bf2d286c551c1f33e876e4e7aec16...HEAD | sort > "$EVID/actual-docs-delta.txt"
          printf '%s\n' \
            VF_PROJECT.json \
            docs/authority/CURRENT.md \
            docs/evidence/P01_V2.32.0_CANDIDATE_READINESS_20260830.md \
            docs/handoff/CURRENT_STATE.md | sort > "$EVID/expected-docs-delta.txt"
          diff -u "$EVID/expected-docs-delta.txt" "$EVID/actual-docs-delta.txt"
          test -z "$(git diff --name-only 8b4f3483579bf2d286c551c1f33e876e4e7aec16...HEAD -- src)"
          test "$(cat VERSION)" = 2.32.0
          test "$(cat src/VERSION.txt)" = 2.32.0
          grep -Fx "define('VF_VERSION', '2.32.0');" src/app/bootstrap.php >/dev/null
          test "$(jq -r .candidate_version VF_PROJECT.json)" = 2.32.0
          test "$(jq -r .candidate_schema_version VF_PROJECT.json)" = 2026082901
          test "$(jq -r .candidate_state VF_PROJECT.json)" = READY_FOR_L3_RELEASE_GATE
          test "$(jq -r .current_change.gates.candidate_readiness VF_PROJECT.json)" = 33263475338
          test "$(jq -r .formal_release_state VF_PROJECT.json)" = 'NOT_STARTED / CANDIDATE ONLY'
          test "$(jq -r .v2_32_tag_state VF_PROJECT.json)" = NOT_CREATED
          test "$(jq -r .core_updates_v2_32_state VF_PROJECT.json)" = NOT_PUBLISHED
          grep -F 'PASS / READY_FOR_L3_RELEASE_GATE' docs/evidence/P01_V2.32.0_CANDIDATE_READINESS_20260830.md >/dev/null
          grep -F 'Unified Gate Run: 33263475338 / PASS' docs/evidence/P01_V2.32.0_CANDIDATE_READINESS_20260830.md >/dev/null
          test "$(git rev-parse refs/remotes/origin/main)" = f7c14b70dda991ac5fc8b25140eb558fd54009d6
          if git ls-remote --exit-code --tags origin refs/tags/v2.32.0 >/dev/null 2>&1; then echo 'UNEXPECTED_V232_TAG'; exit 1; fi
          HTTP=$(curl -sS -o "$EVID/release-v232.json" -w '%{http_code}' https://api.github.com/repos/llhzx2018/vf-start/releases/tags/v2.32.0)
          test "$HTTP" = 404
          cat > "$EVID/verdict.txt" <<'EOF'
          P01_V2320_FINAL_METADATA_FENCE=PASS
          FINAL_CANDIDATE_SOURCE=a842a79517ce89b216abbc514aa73395f7bac009
          FINAL_CANDIDATE_TREE=d0fa7c87ebefef083712ec0b7707a6c4273943f2
          RUNTIME_TREE=f348cb314623906acc851cb79d75b1c8f6637aff
          VERSION=2.32.0
          SCHEMA=2026082901
          CANDIDATE_STATE=READY_FOR_L3_RELEASE_GATE
          UNIFIED_CANDIDATE_GATE=33263475338 PASS
          MAIN=f7c14b70dda991ac5fc8b25140eb558fd54009d6
          V2_32_TAG=ABSENT
          V2_32_GITHUB_RELEASE=ABSENT
          CORE_UPDATES_V2_32=NOT_PUBLISHED
          OWNER_PRODUCTION_WRITE=NO
          FORMAL_RELEASE=NOT_STARTED
          EOF
          cat "$EVID/verdict.txt"
      - name: Upload final metadata fence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-v2320-final-metadata-fence-${{ github.run_id }}
          path: /tmp/p01-v2320-final-metadata-fence
          if-no-files-found: warn
          retention-days: 30
