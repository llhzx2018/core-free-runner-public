name: P05 Low-frequency Owner Language Browser

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p05-low-frequency-owner-language-browser.yml'

permissions:
  contents: read

jobs:
  exact-owner-language:
    if: github.event.pull_request.head.ref == 'test/p05-low-frequency-owner-language-browser-20260902'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vf_seo
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vf_seo
      VF_MASTER_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NODE_ENV: test
    steps:
      - name: Checkout exact P05 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: 5012311883f22436e6226fcc96c7a3279ccab4f6
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact source and presentation boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '5012311883f22436e6226fcc96c7a3279ccab4f6'
          test "$(git rev-parse HEAD^{tree})" = '05f5c0bf8d432864425a3af47bf9e1f00ce70e74'
          test "$(cat VERSION)" = '1.2.3'
          grep -Fq 'eyebrow="基础设置" title="网站设置"' src/client/ProductSiteViews.tsx
          grep -Fq '<option value="HIGH">高</option><option value="NORMAL">标准</option><option value="LOW">低</option>' src/client/ProductSiteViews.tsx
          grep -Fq 'placeholder="例如：工具站"' src/client/ProductSiteViews.tsx
          grep -Fq "if (kind === 'OBSERVED_QUERY') return '关键词';" src/client/ProductGlobalSearchLocator.tsx
          grep -Fq '<td>{kindLabel(kind)}</td>' src/client/ProductGlobalSearchLocator.tsx
          grep -Fq '正在读取当前系统的真实状态。' src/client/CommonSystemCenter.tsx
          grep -Fq 'Provider：{backups?.provider' src/client/CommonSystemCenter.tsx
          grep -Fq 'Production Ready：{yesNo(backups?.productionReady)}' src/client/CommonSystemCenter.tsx
          ! grep -Fq 'LOW-FREQUENCY' src/client/ProductSiteViews.tsx
          ! grep -Fq '<span>LOCATOR</span>' src/client/ProductGlobalSearchLocator.tsx
          ! grep -Fq '正在从当前 Runtime 读取真实状态。' src/client/CommonSystemCenter.tsx
          echo 'P05_LOW_FREQUENCY_EXACT_SOURCE=PASS'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm

      - name: Focused truth and build
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          node --import tsx --test --test-concurrency=1 \
            tests/unit/product-settings-truth.test.ts \
            tests/unit/product-global-search-object-locator-truth.test.ts \
            tests/contract/common-system-human-ui.test.ts
          npm run typecheck
          npm run build

      - name: Browser verify Settings Search Maintenance and mobile
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run migrate
          VF_ADMIN_USERNAME=owner VF_ADMIN_PASSWORD='OwnerLanguage-2026!' npm run bootstrap:admin
          PORT=18197 VF_SECURE_COOKIES=false VF_REQUIRE_HTTPS=false node dist/src/server/index.js >/tmp/p05-low-frequency-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import json, shutil, subprocess, sys, time, urllib.request, urllib.error
          BASE='http://127.0.0.1:18197'; DP=9524; PASSWORD='OwnerLanguage-2026!'
          def fail(msg): print('P05_LOW_FREQUENCY_BROWSER=FAIL '+msg,file=sys.stderr); raise SystemExit(1)
          def http(m,u,p=None,timeout=30):
              d=None if p is None else json.dumps(p).encode(); r=urllib.request.Request(u,data=d,method=m)
              if d is not None:r.add_header('Content-Type','application/json')
              try:
                  with urllib.request.urlopen(r,timeout=timeout) as x:
                      raw=x.read().decode(); return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e: fail(f'http {e.code} {u}: {e.read().decode(errors="replace")[:400]}')
          def wait_http(u):
              for _ in range(300):
                  try:
                      with urllib.request.urlopen(u,timeout=1) as r:
                          if r.status<500:return
                  except Exception:time.sleep(.1)
              fail('not ready '+u)
          def wd(m,p,d=None):
              r=http(m,f'http://127.0.0.1:{DP}{p}',d); v=r.get('value')
              if isinstance(v,dict) and v.get('error'):fail(f"webdriver {v.get('error')}: {v.get('message')}")
              return r
          driver=shutil.which('chromedriver'); chrome=shutil.which('google-chrome') or shutil.which('google-chrome-stable')
          if not driver or not chrome:fail('Chrome unavailable')
          proc=subprocess.Popen([driver,f'--port={DP}','--allowed-ips=127.0.0.1'],stdout=subprocess.DEVNULL,stderr=subprocess.STDOUT); s=''
          try:
              wait_http(BASE+'/api/health'); wait_http(f'http://127.0.0.1:{DP}/status')
              r=wd('POST','/session',{'capabilities':{'alwaysMatch':{'browserName':'chrome','goog:chromeOptions':{'binary':chrome,'args':['--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--window-size=1440,1000']}}}})
              s=str(r['value'].get('sessionId') or r.get('sessionId') or '')
              if not s:fail('missing webdriver session')
              def sv(m,p,d=None):return wd(m,f'/session/{s}{p}',d)['value']
              def js(code):return sv('POST','/execute/sync',{'script':code,'args':[]})
              def content():return str(js("return document.querySelector('.p05v2-content')?.innerText || ''"))
              def body():return str(js("return document.body?.innerText || ''"))
              def wait(fn,label,n=350):
                  last=None
                  for _ in range(n):
                      try:
                          last=fn()
                          if last:return last
                      except Exception as e:last=repr(e)
                      time.sleep(.1)
                  fail(f'timeout {label}: {last!r}')
              def find(css):return sv('POST','/element',{'using':'css selector','value':css})['element-6066-11e4-a52e-4f735466cecf']
              def send(e,v):sv('POST',f'/element/{e}/clear',{});sv('POST',f'/element/{e}/value',{'text':v,'value':list(v)})
              def click(label):return bool(js('''const x=%s;const b=[...document.querySelectorAll('button')].find(e=>e.textContent.trim()===x);if(!b||b.disabled)return false;b.click();return true;'''%json.dumps(label,ensure_ascii=False)))
              def require(t,items,where):
                  miss=[x for x in items if x not in t]
                  if miss:fail(where+' missing '+json.dumps(miss,ensure_ascii=False))
              def forbid(t,items,where):
                  leak=[x for x in items if x in t]
                  if leak:fail(where+' leaked '+json.dumps(leak,ensure_ascii=False))
              sv('POST','/url',{'url':BASE+'/'})
              wait(lambda:js("return !!document.querySelector(\"input[autocomplete='username']\")"),'login')
              send(find("input[autocomplete='username']"),'owner');send(find("input[autocomplete='current-password']"),PASSWORD);click('登录') or fail('login button')
              wait(lambda:content() if '载入演示数据 →' in content() else '', 'empty portfolio')
              click('载入演示数据 →') or fail('demo load click')
              wait(lambda:content() if all(x in content() for x in ['Kewaro Tools','Kewaro Start','Kewaro Guide','Kewaro AI','WordPress Lab']) else '', 'demo portfolio',450)
              ok=js('''const s=document.querySelector('.p05v2-site-context select');const o=[...s.options].find(x=>x.textContent.trim()==='Kewaro Tools');if(!o)return false;s.value=o.value;s.dispatchEvent(new Event('change',{bubbles:true}));return true;''')
              if not ok:fail('select Kewaro Tools')
              click('设置') or fail('Settings nav')
              settings=wait(lambda:content() if '网站设置' in content() and '网站地址 · 只读' in content() else '', 'Settings')
              require(settings,['基础设置','网站设置','网站地址 · 只读','业务价值','只修改网站名称、业务价值、语言、国家/地区和站点类型','数据源已单独放在“数据源”工作区'],'Settings')
              forbid(settings,['LOW-FREQUENCY','URL · 只读','Data Sources 已从 Settings 分离','正在保存低频元数据','TOOLS'],'Settings')
              opts=js("return [...document.querySelectorAll('.p05v2-settings-fields select option')].map(o=>[o.value,o.textContent.trim()]);")
              if opts != [['HIGH','高'],['NORMAL','标准'],['LOW','低']]:fail('business value options='+json.dumps(opts,ensure_ascii=False))
              print('P05_LOW_FREQUENCY_SETTINGS=PASS')
              click('全局搜索') or fail('Global Search nav')
              search=wait(lambda:content() if '全局搜索' in content() and '快速定位' in content() else '', 'Global Search')
              forbid(search,['LOCATOR','Project Workspace'],'Global Search')
              box=find('.p05v2-search input');send(box,'wordpress sitemap');click('搜索') or fail('Search button')
              results=wait(lambda:content() if 'wordpress sitemap' in content().lower() and '关键词' in content() else '', 'Global Search results',400)
              forbid(results,['OBSERVED_QUERY','WEBSITE','PAGE','PROJECT'],'Global Search results')
              click('打开关键词证据 →') or fail('canonical Query result click')
              q=wait(lambda:content() if '当前关键词' in content() and 'wordpress sitemap' in content().lower() else '', 'canonical Query drilldown',400)
              print('P05_LOW_FREQUENCY_CANONICAL_SEARCH=PASS')
              click('系统维护') or fail('System Maintenance nav')
              wait(lambda:body() if '系统维护' in body() and '系统信息' in body() else '', 'System Maintenance')
              click('系统基线') or fail('System baseline tab')
              baseline=wait(lambda:body() if '管理员结论' in body() and '系统关键规则' in body() else '', 'System baseline',400)
              forbid(baseline,['当前 Runtime','Runtime Resolver','真实 Provider 状态','独立 Worker','SSRF 安全边界'],'System baseline ordinary layer')
              click('备份与恢复') or fail('Backup tab')
              backup=wait(lambda:body() if '恢复方式' in body() and '独立后台任务' in body() else '', 'Backup tab',400)
              forbid(backup,['独立 Worker','真实 Provider 状态'],'Backup ordinary layer')
              opened=js("const d=document.querySelector('.vf-common-section details.vf-common-tech');if(!d)return false;d.open=true;return true;")
              if not opened:fail('technical details missing')
              tech=wait(lambda:body() if 'Provider：' in body() and 'Production Ready：' in body() else '', 'technical details')
              require(tech,['技术详情（给开发 / 排障使用）','Provider：','Production Ready：'],'technical layer')
              print('P05_LOW_FREQUENCY_MAINTENANCE=PASS')
              click('关闭') or fail('close maintenance')
              sv('POST','/window/rect',{'width':390,'height':844});time.sleep(.5)
              overflow=int(js("return Math.max(document.documentElement.scrollWidth,document.body?document.body.scrollWidth:0)-document.documentElement.clientWidth"))
              if overflow!=0:fail(f'mobile horizontal overflow={overflow}')
              print('P05_LOW_FREQUENCY_MOBILE_OVERFLOW=0')
              print('P05_LOW_FREQUENCY_BROWSER=PASS')
          finally:
              if s:
                  try:wd('DELETE',f'/session/{s}')
                  except Exception:pass
              proc.terminate()
          PY

      - name: Read-only exact boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '5012311883f22436e6226fcc96c7a3279ccab4f6'
          test "$(git rev-parse HEAD^{tree})" = '05f5c0bf8d432864425a3af47bf9e1f00ce70e74'
          test -z "$(git status --porcelain)"
          echo 'P05_PRODUCT_SOURCE_WRITE=0'
          echo 'P05_RELEASE_WRITE=0'
          echo 'P05_PRODUCTION_WRITE=0'
