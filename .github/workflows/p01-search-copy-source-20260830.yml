name: P01 Search Copy Source Snapshot

on:
  push:
    branches:
      - task/p01-search-copy-source-20260830

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact P01 source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: 6212ed3e020900bcea4124a1d72d352a4589045e
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: p01

      - name: Exact source fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p01 rev-parse HEAD)" = 6212ed3e020900bcea4124a1d72d352a4589045e
          test "$(git -C p01 rev-parse HEAD:src/app/FunctionalWorkspace.php)" = 679d5ac813cb42c443e40e246827c0d8fc57de54
          test "$(git -C p01 rev-parse HEAD:src/app/FunctionalWorkspaceShell.php)" = b0e5ef30ce41b3f2e4127d2348a168be023ff001
          test "$(git -C p01 rev-parse HEAD:src/assets/surface-home.js)" = d827d178ac3f83fc14e4b673bb94f1339fc88950

      - name: Prepare source snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-search-copy-source/src/app /tmp/p01-search-copy-source/src/assets
          cp p01/src/app/FunctionalWorkspace.php /tmp/p01-search-copy-source/src/app/
          cp p01/src/app/FunctionalWorkspaceShell.php /tmp/p01-search-copy-source/src/app/
          cp p01/src/assets/surface-home.js /tmp/p01-search-copy-source/src/assets/
          sha256sum /tmp/p01-search-copy-source/src/app/FunctionalWorkspace.php /tmp/p01-search-copy-source/src/app/FunctionalWorkspaceShell.php /tmp/p01-search-copy-source/src/assets/surface-home.js > /tmp/p01-search-copy-source/sha256.txt

      - name: Upload source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-search-copy-source-${{ github.run_id }}
          path: /tmp/p01-search-copy-source
          if-no-files-found: error
