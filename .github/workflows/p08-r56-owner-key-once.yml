name: P08 R56 Owner public key UI, pinning and standalone bridge (one-off)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p08-r56-owner-key-once.yml'
permissions:
  contents: read
jobs:
  owner-publisher-key:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout ephemeral public-safe validation workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout exact private P08 PR22 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-adops
          ref: 16386f2407bd43ca0406d33c425dd696e7c42696
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-p08
      - name: Prepare PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: none
          coverage: none
          extensions: sodium, zip, mbstring
      - name: Source-locked Owner trust and web transport tests
        run: |
          set -euo pipefail
          cd private-p08
          test "$(git rev-parse HEAD)" = "16386f2407bd43ca0406d33c425dd696e7c42696"
          test "$(cat VERSION)" = 0.1.1
          php -l src/Upgrade/OwnerPublisherTrust.php
          php -l src/Upgrade/UpdateAuthority.php
          php -l app/Http/Controllers/OwnerPublisherController.php
          php -l scripts/owner-publisher-bootstrap-once.php
          php tests/test_owner_publisher_trust.php
          php tests/test_owner_publisher_transport.php
          bash scripts/dev_check.sh > "$RUNNER_TEMP/p08-r56-dev.log" 2>&1 || { tail -n 60 "$RUNNER_TEMP/p08-r56-dev.log"; exit 1; }
          grep -F 'R1_LOCAL_SOURCE_TESTS=PASS' "$RUNNER_TEMP/p08-r56-dev.log"
          python3 scripts/check_stack_contract.py --phase mature
          echo P08_R56_EXACT_PHP_SOURCE_REGRESSION=PASS
          echo P08_R56_USER_CLOUDPANEL_FLAT_SITE=NOT_PROVEN
      - name: Real TypeScript Vue and Vite compilation
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies, typecheck, unit tests and Vite build
        run: |
          set -euo pipefail
          cd private-p08
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-r56-npm.log" 2>&1 || { tail -n 20 "$RUNNER_TEMP/p08-r56-npm.log"; exit 1; }
          npm run typecheck
          npm run test:unit
          npm run build
          test -f public/build/manifest.json
          echo P08_R56_PUBLISHER_ENTRY_VUE_TYPESCRIPT_VITEST_VITE=PASS
      - name: Always clean private source and ephemeral logs
        if: always()
        run: |
          rm -rf private-p08
          rm -f "$RUNNER_TEMP/p08-r56-dev.log" "$RUNNER_TEMP/p08-r56-npm.log"
          echo P08_R56_PUBLIC_RUNNER_CLEANUP=COMPLETE
