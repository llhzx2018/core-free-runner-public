name: P01 V2.36.1 Release Authority Closure Prep
on:
  push:
    branches: [release/p01-v2361-candidate-20260901]
    paths: [.github/workflows/p01-v2361-authority-closure-20260901.yml]
permissions:
  contents: read
jobs:
  close-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE: 23321270d79fc98d529c2c5a0ef07e0f1012835a
      BRANCH: docs/p01-v2361-release-closure-20260901
    steps:
      - name: Checkout exact Authority branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01
      - name: Build five-file release closure
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p01
          test "$(git rev-parse HEAD)" = "$BASE"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$BASE"
          test "$(git ls-remote origin refs/heads/develop | awk '{print $1}')" = "$BASE"
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          root=Path('.')
          evidence='''# P01 · VF Start · V2.36.1 Release Closure Evidence

## Verdict

**PASS / PUBLISHED / OWNER PRODUCTION UPGRADE READY**

Owner Production remains **V2.36.0** / Schema **2026082901**. This closure did **not** write Owner Production.

## Exact Release Identity

- Formal Source: `23321270d79fc98d529c2c5a0ef07e0f1012835a`
- Formal Tree: `889d7662cf7907cc93d958c5df31f7824faa050a`
- Runtime Tree: `91f92c5d3e7080469a7f5ab1497145454014c87a`
- Schema: `2026082901`
- Migration: `NONE`
- Tag: `v2.36.1`
- GitHub Release ID: `380234103`
- core-updates: `416cc8089b39349eb7ee62638b5267335d406320`

## Release Assets

- `VF-Start-V2.36.1-FULL.zip`: `646776` bytes / `sha256:ea8abae0f971ad34568626848f620e7dc8debf1241dc981dd3ebb76f4a16f492`
- `VF_Start_V2.36.1_UPDATE.zip`: `1391840` bytes / `sha256:ef9d772d1fec07ee81899a64bf2fd2fdce4ebed7cf8b2b45168301cc5c7fd2bf`
- `repair-v2.36.1.php`: `4011889` bytes / `sha256:b63904bfda876b97e63a899affc0d39845fe31d4e38b830ed9c5df2738cf2c74`

## Gate Chain

- Candidate Readiness `33472637909` — PASS
- Formal Bind `33472881503` — PASS
- Formal Artifact `33473351744` — PASS
- Strict Fresh R1 `33473521462` — HARNESS ONLY; incorrect DOM-absence assertion, no Product byte change
- Strict Fresh R2 `33473626306` — PASS
- Main Promotion `33473995889` — PASS
- Publication `33474094279` — PASS
- core-updates `33474210697` — PASS
- Final Remote Online Update `33474338364` — PASS

## Final Remote Online Update Evidence

Artifact `9787614802` / `sha256:7ca99492a81103d1bb19a3f1d1e8f58967e8b4a7b5ad4fa6c48ed1fef37796f6`.

An isolated immutable V2.36.0 runtime discovered V2.36.1 through the published core-updates manifest, downloaded the exact GitHub Release asset, executed the Atomic update, preserved representative links/categories/favorites/private state/domain profiles, retained Schema `2026082901`, passed SQLite integrity and foreign-key checks, matched the exact 10-file Runtime delta against tag `v2.36.1`, and converged to Current=Latest=V2.36.1.

The corrected product contract was also verified after the real remote update: anonymous users see public resources only; authenticated admins use the same frontend with public + private resources and management entry. Legacy `public_view` / `preview_return` query parameters no longer switch an authenticated admin into a second public-preview state.

## Production Boundary

- Owner Production before/after this closure: `V2.36.0`
- Published Latest: `V2.36.1`
- Assistant Owner Production write: `NO`
- Owner may now perform the backend online update from V2.36.0 to V2.36.1; Production Closure requires Owner readback after that update.
'''
          (root/'docs/evidence/P01_V2.36.1_RELEASE_CLOSURE_20260901.md').write_text(evidence,encoding='utf-8')

          current_section='''<!-- P01_V2361_RELEASE_CLOSURE -->
          ## V2.36.1 Release Closure · 2026-09-01

          - Owner Production：`V2.36.0` / Schema `2026082901` / previous Production Closure PASS。
          - Published Latest：`V2.36.1`。
          - Formal Source：`23321270d79fc98d529c2c5a0ef07e0f1012835a`；Runtime Tree：`91f92c5d3e7080469a7f5ab1497145454014c87a`。
          - Tag / Release：`v2.36.1` / `380234103`。
          - core-updates：`416cc8089b39349eb7ee62638b5267335d406320`。
          - Final Remote Online Update Gate：`33474338364` = **PASS**；Artifact `9787614802`；Digest `sha256:7ca99492a81103d1bb19a3f1d1e8f58967e8b4a7b5ad4fa6c48ed1fef37796f6`。
          - 真实远程升级：V2.36.0 → V2.36.1 发现、Release 下载、Atomic 安装、数据保留、SQLite/FK、五域 HTTP、10-file Runtime delta、Current=Latest 全 PASS。
          - 正式登录模型：**一个前台**；匿名只看公开；登录后同一前台看公开 + 私人并显示管理入口；旧 `public_view / preview_return` 参数不再改变登录状态。
          - Strict Fresh R1 `33473521462` = HARNESS ONLY；R2 `33473626306` = PASS；Product 字节未因 R1 修改。
          - Assistant Production Write：**NO**。
          - Next：Owner 可在 VF Start 后台执行 V2.36.0 → V2.36.1 在线更新；完成后再做 Owner Production Readback / Closure。

          > 以下旧段落保留历史证据；如与本段冲突，以本段为 Current Release Authority。

          '''.replace('          ','')
          for rel,title in [('docs/authority/CURRENT.md','# P01 · VF Start · Current Authority\n\n'),('docs/handoff/CURRENT_STATE.md','# CURRENT STATE · P01 VF Start\n\n')]:
              p=root/rel;s=p.read_text(encoding='utf-8');assert s.startswith(title);p.write_text(title+current_section+s[len(title):],encoding='utf-8')

          readme=root/'README.md';s=readme.read_text(encoding='utf-8')
          replacement='''## Current Truth

          ```text
          Owner Production: V2.36.0
          Owner Schema: 2026082901
          Published Latest: V2.36.1
          Formal Release Source: 23321270d79fc98d529c2c5a0ef07e0f1012835a
          Formal Release Tree: 889d7662cf7907cc93d958c5df31f7824faa050a
          Runtime src Tree: 91f92c5d3e7080469a7f5ab1497145454014c87a
          Tag: v2.36.1
          GitHub Release ID: 380234103
          core-updates: 416cc8089b39349eb7ee62638b5267335d406320
          Final Remote Online Update Gate: 33474338364 / PASS
          Owner Production Closure: V2.36.0 / PASS
          Assistant Production Write: NO
          ```

          V2.36.1 已正式发布并通过 V2.36.0 → V2.36.1 Remote Online Update Gate。该补丁撤销错误的管理员/公开预览双视角，恢复单一前台登录模型。真实 Owner Production 仍为 V2.36.0；下一步由 Owner 在后台执行在线更新，之后再做 Production Closure。
          '''.replace('          ','')
          s2,n=re.subn(r'## Current Truth\n.*?(?=## Product Structure)',replacement,s,flags=re.S);assert n==1
          s2=s2.replace('7. [`docs/evidence/P01_V2.33.0_PRODUCTION_CLOSURE_20260830.md`](docs/evidence/P01_V2.33.0_PRODUCTION_CLOSURE_20260830.md)。','7. [`docs/evidence/P01_V2.36.1_RELEASE_CLOSURE_20260901.md`](docs/evidence/P01_V2.36.1_RELEASE_CLOSURE_20260901.md)。')
          readme.write_text(s2,encoding='utf-8')

          p=root/'VF_PROJECT.json';d=json.loads(p.read_text(encoding='utf-8'))
          d['status']='V2.36.0 OWNER PRODUCTION / V2.36.1 PUBLISHED / REMOTE ONLINE UPDATE PASS'
          d['production_version']='2.36.0'
          d['working_version']='2.36.1';d['target_release_version']='2.36.1'
          d['current_phase']='V2.36.1 PUBLISHED / OWNER PRODUCTION UPGRADE READY'
          d['published_release']={
            'version':'2.36.1','tag':'v2.36.1','release_id':380234103,
            'release_source':'23321270d79fc98d529c2c5a0ef07e0f1012835a','release_tree':'889d7662cf7907cc93d958c5df31f7824faa050a','runtime_tree':'91f92c5d3e7080469a7f5ab1497145454014c87a','schema_version':'2026082901',
            'core_updates_commit':'416cc8089b39349eb7ee62638b5267335d406320',
            'online_asset':'VF_Start_V2.36.1_UPDATE.zip','online_asset_bytes':1391840,'online_asset_sha256':'ef9d772d1fec07ee81899a64bf2fd2fdce4ebed7cf8b2b45168301cc5c7fd2bf',
            'full_asset':'VF-Start-V2.36.1-FULL.zip','full_asset_bytes':646776,'full_asset_sha256':'ea8abae0f971ad34568626848f620e7dc8debf1241dc981dd3ebb76f4a16f492',
            'release_state':'PUBLISHED / OWNER PRODUCTION UPGRADE READY','assistant_production_write':False,
            'candidate_readiness_gate':33472637909,'formal_bind_gate':33472881503,'formal_artifact_gate':33473351744,'strict_fresh_install_gate':33473626306,'main_promotion_gate':33473995889,'publication_gate':33474094279,'core_updates_manifest_gate':33474210697,'remote_online_update_gate':33474338364,'remote_online_update_artifact':9787614802,'remote_online_update_artifact_sha256':'7ca99492a81103d1bb19a3f1d1e8f58967e8b4a7b5ad4fa6c48ed1fef37796f6'
          }
          cc=d.get('current_change',{});cc['result']='RELEASED AS V2.36.1 / OWNER PRODUCTION UPGRADE READY';cc['main_write']=True;cc['production_write']=False;cc['runner_main_write']=False;d['current_change']=cc
          d['formal_release_state']='V2.36.1 PUBLISHED / REMOTE ONLINE UPDATE PASS / OWNER PRODUCTION UPGRADE READY'
          d['develop_state']='V2.36.1 RELEASED / RELEASE AUTHORITY CLOSED'
          d['current_authority']='Owner Production V2.36.0 / Published Latest V2.36.1 / Remote Online Update PASS / Owner upgrade ready'
          d['next_action']='Owner may perform the VF Start backend online update V2.36.0 -> V2.36.1; then perform Owner Production readback and closure. Assistant must not write Owner Production.'
          d.setdefault('authority',{})['current_formal_release_evidence']='docs/evidence/P01_V2.36.1_RELEASE_CLOSURE_20260901.md'
          d['v2_36_1_release_chain']={'candidate_readiness_gate':33472637909,'formal_bind_gate':33472881503,'formal_artifact_gate':33473351744,'strict_fresh_r1':{'run':33473521462,'classification':'HARNESS ONLY / NO PRODUCT BYTE CHANGE'},'strict_fresh_gate':33473626306,'main_promotion_gate':33473995889,'publication_gate':33474094279,'core_updates_gate':33474210697,'remote_online_update_gate':33474338364,'remote_online_update_artifact':9787614802,'remote_online_update_artifact_sha256':'7ca99492a81103d1bb19a3f1d1e8f58967e8b4a7b5ad4fa6c48ed1fef37796f6','result':'PASS / PUBLISHED / OWNER PRODUCTION UPGRADE READY'}
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python3 -m json.tool VF_PROJECT.json >/dev/null
          ALLOWED=$'README.md\nVF_PROJECT.json\ndocs/authority/CURRENT.md\ndocs/evidence/P01_V2.36.1_RELEASE_CLOSURE_20260901.md\ndocs/handoff/CURRENT_STATE.md'
          ACTUAL=$(git status --short | sed 's/^...//' | sort)
          test "$ACTUAL" = "$ALLOWED"
          test -z "$(git diff --name-only -- src)"
          grep -F 'Owner Production: V2.36.0' README.md >/dev/null
          grep -F 'Published Latest: V2.36.1' README.md >/dev/null
          test "$(jq -r .production_version VF_PROJECT.json)" = 2.36.0
          test "$(jq -r .published_release.version VF_PROJECT.json)" = 2.36.1
          test "$(jq -r .published_release.release_id VF_PROJECT.json)" = 380234103
          test "$(jq -r .published_release.core_updates_commit VF_PROJECT.json)" = 416cc8089b39349eb7ee62638b5267335d406320
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add README.md VF_PROJECT.json docs/authority/CURRENT.md docs/handoff/CURRENT_STATE.md docs/evidence/P01_V2.36.1_RELEASE_CLOSURE_20260901.md
          git commit -m 'docs(P01): close V2.36.1 release chain'
          git push origin HEAD:"refs/heads/$BRANCH"
          echo P01_V2361_AUTHORITY_PREP=PASS
