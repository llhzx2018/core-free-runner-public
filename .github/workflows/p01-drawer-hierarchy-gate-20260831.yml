name: P01 Drawer Hierarchy Gate

on:
  push:
    branches: [task/p01-drawer-hierarchy-gate-20260831]
    paths:
      - .github/workflows/p01-drawer-hierarchy-gate-20260831.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE: 18f819e6077ea8cdc14d046a7a85140d165d6297
      TREE: c74c5121152e7c2c9d7effd772f0acff1dfbb412
      BASE_SOURCE: 6212ed3e020900bcea4124a1d72d352a4589045e
      CSS_BLOB: 19dc74d2fbdab88fe2ec94d1e56f668bb49f5194
      ROOT: /tmp/p01-drawer-hierarchy
      PORT: '18341'
      EVID: /tmp/p01-drawer-hierarchy-ui
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none

      - name: Checkout exact P01 source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: product

      - name: Exact source and one-file fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$SOURCE"
          test "$(git -C product rev-parse HEAD^{tree})" = "$TREE"
          test "$(git -C product rev-parse HEAD:src/assets/workspace-v228.css)" = "$CSS_BLOB"
          test "$(cat product/VERSION)" = '2.34.0'
          git -C product diff --name-only "$BASE_SOURCE"..HEAD | tee /tmp/p01-drawer-hierarchy-files.txt
          test "$(cat /tmp/p01-drawer-hierarchy-files.txt)" = 'src/assets/workspace-v228.css'
          git -C product diff --check "$BASE_SOURCE"..HEAD
          echo P01_DRAWER_HIERARCHY_SOURCE=PASS

      - name: Fresh runtime with representative data
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$ROOT" /tmp/p01-drawer-hierarchy.cookies
          cp -a product/src "$ROOT"
          php -S 127.0.0.1:$PORT -t "$ROOT" >/tmp/p01-drawer-hierarchy-server.log 2>&1 & echo $! >/tmp/p01-drawer-hierarchy.pid
          for i in $(seq 1 30); do curl -fsS -c /tmp/p01-drawer-hierarchy.cookies -b /tmp/p01-drawer-hierarchy.cookies "http://127.0.0.1:$PORT/setup.php" -o /tmp/p01-drawer-hierarchy-setup.html && break || sleep 1; done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-drawer-hierarchy-setup.html',encoding='utf-8').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s)
          assert m
          print(m.group(1))
          PY
          )
          curl -fsS -c /tmp/p01-drawer-hierarchy.cookies -b /tmp/p01-drawer-hierarchy.cookies -X POST "http://127.0.0.1:$PORT/setup.php" \
            --data-urlencode "setup_csrf=$CSRF" \
            --data-urlencode 'site_title=Drawer Hierarchy Gate' \
            --data-urlencode 'admin_password=P01Drawer!Hierarchy' \
            --data-urlencode 'admin_password_confirm=P01Drawer!Hierarchy' \
            -o /tmp/p01-drawer-hierarchy-setup-post.html
          cat >/tmp/p01-drawer-hierarchy-seed.php <<'PHP'
          <?php
          require '/tmp/p01-drawer-hierarchy/app/bootstrap.php';
          require_once '/tmp/p01-drawer-hierarchy/app/SurfaceRepository.php';
          $r=new VfRepository(vf_db());$s=new VfSurfaceRepository(vf_db());
          $dev=$r->createCategory(['name'=>'开发工具','description'=>'','is_private'=>false]);
          $channel=$r->createCategory(['name'=>'频道','description'=>'','is_private'=>false]);
          for($i=1;$i<=18;$i++)$r->saveLink(null,['category_id'=>$dev,'title'=>'Dev Tool '.str_pad((string)$i,2,'0',STR_PAD_LEFT),'url'=>'https://dev'.$i.'.example.com','description'=>'developer tool','tags'=>'工具','is_private'=>true],'manual');
          for($i=1;$i<=8;$i++){ $x=$r->saveLink(null,['category_id'=>$channel,'title'=>'Channel '.str_pad((string)$i,2,'0',STR_PAD_LEFT),'url'=>'https://youtube.com/@drawer-hierarchy-'.$i,'description'=>'channel description','tags'=>'频道, 后台听','is_private'=>true],'manual');$s->upsertProfile((int)$x['id'],['surface'=>'channels','resource_kind'=>'creator','surface_note'=>'private note','background_friendly'=>$i%2===0]); }
          echo "P01_DRAWER_HIERARCHY_SEED=PASS\n";
          PHP
          php /tmp/p01-drawer-hierarchy-seed.php | grep -Fx P01_DRAWER_HIERARCHY_SEED=PASS
          echo P01_DRAWER_HIERARCHY_RUNTIME=PASS

      - name: Chromium hierarchy and reachability gate
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVID" /tmp/p01-drawer-playwright
          cd /tmp/p01-drawer-playwright
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat >gate.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const base='http://127.0.0.1:18341';
          const evid=process.env.EVID;
          const near=(a,b,t=2)=>Math.abs(a-b)<=t;
          const visible=(r,vh)=>r.bottom>0&&r.top<vh;
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:1440,height:1000}});
            const login=await context.request.post(base+'/api.php?action=login',{data:{password:'P01Drawer!Hierarchy'}});
            if(!login.ok())throw new Error('login http '+login.status());
            const body=await login.json();if(!body.ok)throw new Error('login rejected');
            const page=await context.newPage();
            const errors=[];page.on('pageerror',e=>errors.push(String(e)));
            const openAdd=async()=>{await page.locator('[data-open-add]').first().click();await page.locator('[data-panel="add"]:not([hidden])').waitFor();};
            const closeAdd=async()=>{await page.locator('[data-panel="add"] header [data-close-panel]').click();await page.waitForTimeout(180);};
            const inspectSticky=async(panelSel,headSel,footerSel)=>page.evaluate(({panelSel,headSel,footerSel})=>{
              const panel=document.querySelector(panelSel),head=document.querySelector(headSel),foot=document.querySelector(footerSel);if(!panel||!head||!foot)throw new Error('missing sticky nodes');
              panel.scrollTop=panel.scrollHeight;const p=panel.getBoundingClientRect(),h=head.getBoundingClientRect(),f=foot.getBoundingClientRect();
              return {panel:{top:p.top,bottom:p.bottom,left:p.left,right:p.right,width:p.width,height:p.height,scrollTop:panel.scrollTop,scrollHeight:panel.scrollHeight,clientHeight:panel.clientHeight},head:{top:h.top,bottom:h.bottom,position:getComputedStyle(head).position},footer:{top:f.top,bottom:f.bottom,position:getComputedStyle(foot).position,clientWidth:foot.clientWidth,scrollWidth:foot.scrollWidth},overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth};
            },{panelSel,headSel,footerSel});

            await page.goto(base+'/channels.php',{waitUntil:'networkidle'});await openAdd();
            const add=page.locator('[data-panel="add"]');
            const desktop=await add.evaluate(el=>{const r=el.getBoundingClientRect(),url=el.querySelector('input[name="url"]'),title=el.querySelector('input[name="title"]'),cover=el.querySelector('.vf-cover-field'),open=getComputedStyle(el.querySelector('header'));return {rect:{left:r.left,right:r.right,top:r.top,bottom:r.bottom,width:r.width,height:r.height},urlH:url.getBoundingClientRect().height,titleH:title.getBoundingClientRect().height,coverBg:getComputedStyle(cover).backgroundColor,coverBorder:getComputedStyle(cover).borderTopStyle,headerPosition:open.position,footerButtons:[...el.querySelectorAll('footer button')].map(x=>(x.textContent||'').trim())}});
            if(desktop.rect.width<640||desktop.rect.width>680)throw new Error('desktop add width '+JSON.stringify(desktop));
            if(desktop.urlH<39||desktop.titleH<39)throw new Error('primary fields not emphasized '+JSON.stringify(desktop));
            if(desktop.coverBorder!=='solid')throw new Error('cover grouping absent '+JSON.stringify(desktop));
            if(desktop.headerPosition!=='sticky')throw new Error('add header not sticky '+JSON.stringify(desktop));
            if(desktop.footerButtons.join('|')!=='取消|添加并继续|添加资源')throw new Error('add action priority contract '+JSON.stringify(desktop));
            let sticky=await inspectSticky('[data-panel="add"]','[data-panel="add"]>header','[data-add-form]>footer');
            if(!near(sticky.head.top,sticky.panel.top,2)||sticky.footer.bottom>sticky.panel.bottom+2||sticky.footer.position!=='sticky')throw new Error('desktop add sticky '+JSON.stringify(sticky));
            await page.screenshot({path:evid+'/desktop-add-scrolled.png'});
            await closeAdd();

            await page.locator('[data-asset-row]').first().click();await page.locator('[data-panel="detail"]:not([hidden])').waitFor();
            const drawer=page.locator('[data-panel="detail"]');
            const drect=await drawer.evaluate(el=>{const r=el.getBoundingClientRect(),open=el.querySelector('[data-detail-open]');return {left:r.left,right:r.right,width:r.width,height:r.height,openBg:getComputedStyle(open).backgroundColor,openPad:getComputedStyle(open).paddingInline}});
            if(drect.width<475||drect.width>485)throw new Error('desktop drawer width '+JSON.stringify(drect));
            sticky=await inspectSticky('[data-panel="detail"]','[data-panel="detail"]>.vf-detail-head','[data-detail-form]>footer');
            if(!near(sticky.head.top,sticky.panel.top,2)||sticky.footer.bottom>sticky.panel.bottom+2||sticky.footer.position!=='sticky')throw new Error('desktop detail sticky '+JSON.stringify(sticky));
            await page.screenshot({path:evid+'/desktop-detail-scrolled.png'});
            await page.locator('[data-panel="detail"] header [data-close-panel]').click();await page.waitForTimeout(180);

            for(const [width,height] of [[390,844],[320,700]]){
              await page.setViewportSize({width,height});await page.goto(base+'/channels.php',{waitUntil:'networkidle'});await openAdd();
              const m=await add.evaluate(el=>{const r=el.getBoundingClientRect(),foot=el.querySelector('footer'),buttons=[...foot.querySelectorAll('button')].map(b=>{const x=b.getBoundingClientRect();return {text:(b.textContent||'').trim(),left:x.left,right:x.right,top:x.top,bottom:x.bottom}});return {rect:{left:r.left,right:r.right,top:r.top,bottom:r.bottom,width:r.width,height:r.height},viewport:{w:innerWidth,h:innerHeight},docOverflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,footerOverflow:foot.scrollWidth-foot.clientWidth,buttons};});
              if(!near(m.rect.left,0,1)||!near(m.rect.top,0,1)||!near(m.rect.width,width,2)||!near(m.rect.height,height,2))throw new Error('mobile add not full viewport '+width+' '+JSON.stringify(m));
              if(m.docOverflow>1||m.footerOverflow>1)throw new Error('mobile overflow '+width+' '+JSON.stringify(m));
              const tops=m.buttons.map(x=>x.top);if(Math.max(...tops)-Math.min(...tops)>2)throw new Error('mobile footer wraps '+width+' '+JSON.stringify(m));
              sticky=await inspectSticky('[data-panel="add"]','[data-panel="add"]>header','[data-add-form]>footer');
              if(!near(sticky.head.top,0,2)||sticky.footer.bottom>height+2||!visible(sticky.footer,height))throw new Error('mobile sticky '+width+' '+JSON.stringify(sticky));
              if(width===390){await page.screenshot({path:evid+'/mobile-add-390-light.png'});await page.evaluate(()=>document.documentElement.dataset.theme='dark');await page.waitForTimeout(80);await page.screenshot({path:evid+'/mobile-add-390-dark.png'});await page.evaluate(()=>document.documentElement.dataset.theme='light');}
              if(width===320)await page.screenshot({path:evid+'/mobile-add-320.png'});
              await closeAdd();
            }
            if(errors.length)throw new Error('page errors: '+errors.join(' | '));
            fs.writeFileSync(evid+'/geometry.json',JSON.stringify({desktop,drawer:drect,lastSticky:sticky},null,2));
            fs.writeFileSync(evid+'/verdict.txt','P01_DRAWER_HIERARCHY=PASS\nSOURCE=18f819e6077ea8cdc14d046a7a85140d165d6297\n');
            await browser.close();console.log('P01_DRAWER_HIERARCHY_UI=PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          EVID="$EVID" node gate.cjs | tee "$EVID/result.txt"
          grep -Fx P01_DRAWER_HIERARCHY_UI=PASS "$EVID/result.txt"

      - name: Regression baseline and data integrity
        shell: bash
        run: |
          set -Eeuo pipefail
          php "$ROOT/cli/verify.php" | grep -Fx VERIFY_PASS=YES
          php "$ROOT/cli/surface-verify.php" | grep -Fx MULTI_SURFACE_PASS=YES
          php "$ROOT/cli/baseline-verify.php" | tee /tmp/p01-drawer-hierarchy-baseline.txt
          grep -Fx BASELINE_CORE_PASS=YES /tmp/p01-drawer-hierarchy-baseline.txt
          grep -Fx DRIFT_COUNT=0 /tmp/p01-drawer-hierarchy-baseline.txt
          grep -Fx UNKNOWN_COUNT=0 /tmp/p01-drawer-hierarchy-baseline.txt
          php -r 'require "/tmp/p01-drawer-hierarchy/app/bootstrap.php";$db=vf_db();if(strtolower((string)$db->query("PRAGMA integrity_check")->fetchColumn())!=="ok")exit(1);if($db->query("PRAGMA foreign_key_check")->fetchAll(PDO::FETCH_ASSOC))exit(2);echo "P01_DRAWER_HIERARCHY_SQLITE=PASS\n";' | grep -Fx P01_DRAWER_HIERARCHY_SQLITE=PASS
          echo P01_DRAWER_HIERARCHY_REGRESSION=PASS

      - name: Upload evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-drawer-hierarchy-${{ github.run_id }}
          path: /tmp/p01-drawer-hierarchy-ui
          if-no-files-found: error
          retention-days: 30

      - name: Verdict
        run: |
          echo P01_DRAWER_HIERARCHY_SOURCE=$SOURCE
          echo P01_DRAWER_HIERARCHY_TREE=$TREE
          echo P01_DRAWER_HIERARCHY_GATE=PASS
          echo PRODUCT_FILES_CHANGED=1
          echo SCHEMA_CHANGE=NO
          echo PRODUCTION_WRITE=NO

      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/p01-drawer-hierarchy.pid 2>/dev/null)" 2>/dev/null || true
