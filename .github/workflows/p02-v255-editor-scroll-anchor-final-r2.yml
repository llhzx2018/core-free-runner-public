name: P02 V2.5.5 Editor Scroll Anchor Final R2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v255-editor-scroll-anchor-final-r2.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REF: 4b2a0c9a7bedc82ef92c5d32fa08dbc233f67368
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: '${{ env.PRODUCT_REF }}'
          token: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'
          path: p02
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare exact candidate
        working-directory: p02
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_REF"
          test "$(tr -d '\r\n' < VERSION)" = '2.5.5'
          node --check public/assets/app.js
          node --check public/assets/v255-hotfix.js
          php -l public/index.php >/dev/null
          python3 scripts/repository-gates.py
          google-chrome --version
          npm install --no-save playwright-core@1.55.0 >/dev/null

      - name: Browser regression with persisted long documents
        working-directory: p02
        env:
          AUDIT_PASSWORD: 'P02-V255-R2-${{ github.run_id }}!'
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/p02-v255-r2"; SITE="$ROOT/site"; mkdir -p "$SITE"
          bash scripts/build-deploy-tree.sh "$SITE" >/dev/null
          php -S 127.0.0.1:18258 -t "$SITE" >"$ROOT/server.log" 2>&1 & echo $! > "$ROOT/server.pid"
          for _ in $(seq 1 80); do curl -fsS http://127.0.0.1:18258/setup.php >/dev/null 2>&1 && break; sleep .25; done
          curl -fsS -c "$ROOT/cookie" http://127.0.0.1:18258/setup.php > "$ROOT/setup.html"
          TOKEN=$(python3 - "$ROOT/setup.html" <<'PY'
          import re,html,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf" value="([^"]+)"',s);assert m;print(html.unescape(m.group(1)))
          PY
          )
          test "$(curl -sS -o /dev/null -w '%{http_code}' -b "$ROOT/cookie" -c "$ROOT/cookie" -H 'Origin: http://127.0.0.1:18258' --data-urlencode "setup_csrf=$TOKEN" --data-urlencode "password=$AUDIT_PASSWORD" --data-urlencode "password_confirm=$AUDIT_PASSWORD" http://127.0.0.1:18258/setup.php)" = 303
          cat > .v255-r2.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({channel:'chrome',headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:900}});
          const pageErrors=[]; page.on('pageerror',e=>pageErrors.push(String(e)));
          await page.goto('http://127.0.0.1:18258/',{waitUntil:'networkidle'});
          let sess=await page.evaluate(async()=>await(await fetch('/api.php?action=session',{cache:'no-store'})).json());
          if(!sess?.site?.auth){await page.locator('[data-open-login]').click();await page.locator('#loginForm input[name="password"]').fill(process.env.AUDIT_PASSWORD);await page.locator('#loginSubmit').click();await page.waitForFunction(async()=>Boolean((await(await fetch('/api.php?action=session',{cache:'no-store'})).json())?.site?.auth));sess=await page.evaluate(async()=>await(await fetch('/api.php?action=session',{cache:'no-store'})).json());}
          const csrf=sess.csrf;
          const post=async(a,b)=>page.evaluate(async({a,b,csrf})=>await(await fetch('/api.php?action='+a,{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(b)})).json(),{a,b,csrf});
          const cat=await post('category_save',{name:'V255 Scroll Final R2',description:'',icon:'folder'}); const cid=Number(cat.id); if(!cid)throw new Error('category create failed');
          const longText=Array.from({length:120},(_,i)=>`第 ${i+1} 行：长内容输入稳定性验证，当前输入位置不能跳回顶部。`).join('\n');
          const quick=await post('content_save',{category_id:cid,title:'V255 Quick Long',description:'',content:longText,content_mode:'quick',content_format:'markdown',primary_action:'copy',status:'active'}); const qid=Number(quick.id); if(!qid)throw new Error('quick create failed');
          const article=await post('content_save',{category_id:cid,title:'V255 Article Long',description:'',content:'# 长文章\n\n'+longText,content_mode:'article',content_format:'markdown',primary_action:'read',status:'active'}); const aid=Number(article.id); if(!aid)throw new Error('article create failed');

          async function assertTyping(label,selector,rootSelector){
            const ta=page.locator(selector); await ta.waitFor({state:'visible',timeout:10000});
            await page.waitForTimeout(160);
            const initialLen=await ta.evaluate(t=>t.value.length);
            await page.evaluate(({selector,rootSelector})=>{const t=document.querySelector(selector),r=document.querySelector(rootSelector);if(!t||!r)throw new Error('missing editor/root '+selector+' '+rootSelector);r.scrollTop=Math.max(0,r.scrollHeight-r.clientHeight-24);t.focus({preventScroll:true});t.setSelectionRange(t.value.length,t.value.length);},{selector,rootSelector});
            await page.waitForTimeout(100);
            const before=await page.evaluate(({selector,rootSelector})=>{const t=document.querySelector(selector),r=document.querySelector(rootSelector);return{scroll:r.scrollTop,max:r.scrollHeight-r.clientHeight,start:t.selectionStart,end:t.selectionEnd,len:t.value.length};},{selector,rootSelector});
            if(before.scroll<150)throw new Error(label+' precondition '+JSON.stringify(before));
            const samples=[];
            for(const ch of ['A','B','C','1','2','3','上','下','文','字']){await page.keyboard.type(ch,{delay:20});await page.waitForTimeout(70);const s=await page.evaluate(({selector,rootSelector})=>{const t=document.querySelector(selector),r=document.querySelector(rootSelector);if(!t||!r)throw new Error('editor disappeared');return{scroll:r.scrollTop,start:t.selectionStart,end:t.selectionEnd,len:t.value.length};},{selector,rootSelector});samples.push(s);if(s.scroll<before.scroll-80)throw new Error(label+' VIEWPORT_JUMP '+JSON.stringify({before,samples}));if(s.start!==s.len||s.end!==s.len)throw new Error(label+' CARET_JUMP '+JSON.stringify(s));}
            const last=samples.at(-1); if(last.len<=initialLen)throw new Error(label+' typing not persisted in editor');
            console.log(label+'=PASS '+JSON.stringify({before,last}));
          }

          await page.evaluate(qid=>openEditor(qid,{reopen:true}),qid);
          await assertTyping('GENERIC_QUICK_EDITOR','.content-editor','#main');

          await page.reload({waitUntil:'networkidle'});
          await page.evaluate(async({cid,aid})=>{await setContentView('notebook');await selectCategory(cid);await openReader(aid,true);await state.workspaceController.setMode('edit',true)},{cid,aid});
          await page.waitForFunction(()=>state.articleMode==='edit');
          await assertTyping('ARTICLE_EDITOR','#articleSource','#notebookDetailScroll');

          if(pageErrors.length)throw new Error(pageErrors.join(' | '));
          console.log('P02_V255_EDITOR_SCROLL_ANCHOR_FINAL_R2=PASS');
          await browser.close();
          JS
          node .v255-r2.mjs

      - name: Final candidate sanity
        working-directory: p02
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          x=json.load(open('SOURCE_MANIFEST.json',encoding='utf-8'))
          assert x['version']=='2.5.5' and x['schema']==2401 and x['runtime_source_file_count']==68
          assert any(e['full_path']=='assets/v255-hotfix.js' for e in x['entries'])
          print('SOURCE_MANIFEST=PASS')
          PY
          echo P02_V255_CANDIDATE=PASS
          echo SCHEMA=2401
          echo MIGRATION=NONE
          echo PRODUCTION_WRITE=NO
