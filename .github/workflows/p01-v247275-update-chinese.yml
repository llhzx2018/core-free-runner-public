name: P01 V2.47.275 Update Chinese Proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p01-v247275-update-chinese.yml"

permissions:
  contents: read

jobs:
  proof:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'proof(P01): V2.47.275 update Chinese')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd nodejs >/dev/null

      - name: Clone exact candidate and stable
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" candidate
          git -C candidate fetch -q origin 9211b02c6c54153c49fac40f5e6517fd94f5d368
          git -C candidate checkout -q --detach 9211b02c6c54153c49fac40f5e6517fd94f5d368
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.275"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "2.47.275"

          git clone -q --depth 1 --branch v2.47.274 "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" stable
          test "$(tr -d '\r\n ' < stable/VERSION)" = "2.47.274"
          echo P01_V247275_EXACT_SOURCE=PASS

      - name: Syntax and focused update contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check candidate/src/assets/update-core.js
          php -l candidate/src/update.php
          php -l candidate/tests/unit/admin_update_chinese_consistency_v247275_contract.php
          cd candidate
          php tests/unit/admin_update_chinese_consistency_v247275_contract.php
          php tests/unit/admin_update_page12_polish_contract.php
          php tests/unit/admin_update_public_copy_r72_contract.php
          php tests/unit/admin_update_r26_contract.php
          php tests/unit/update_notice_no_obstruction_contract.php
          php tests/unit/update_recovery_contract.php
          php tests/unit/update_csrf_recovery_contract.php
          echo P01_V247275_FOCUSED=PASS

      - name: Canonical regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate stable --require-zero-debt | tee /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/canonical.txt
          echo P01_V247275_CANONICAL=PASS

      - name: Bounded scope
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C candidate diff --name-only 4679a5e5a1a154782b04eacfc5b94988ea856f27..9211b02c6c54153c49fac40f5e6517fd94f5d368 | tee /tmp/changed.txt
          if grep -E '(^|/)(migrations|schema|auth|security|provider|server|install|setup)' /tmp/changed.txt; then
            echo "Unexpected high-risk scope"
            exit 1
          fi
          echo UPDATE_CHINESE_ONLY=YES
          echo PRODUCTION_WRITE=NO
