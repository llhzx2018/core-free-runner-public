name: TEMP S01 1.21.798 Domain Authority Source Audit

on:
  push:
    branches:
      - temp/s01-c02-v121798-production-readback-20260903
    paths:
      - '.github/workflows/temp-s01-v121798-domain-authority-source-audit.yml'

permissions:
  contents: read

jobs:
  domain-authority-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: c22d766338245d5dfac49a485129614c85001ee7
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: ops
      - name: Enumerate all S01 final-domain literals and consumers
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== EXACT www.ilovem3u8.com ==='
          grep -RIn --exclude-dir=.git --exclude='*.min.js' 'www\.ilovem3u8\.com' ops || true
          echo '=== EXACT apex ilovem3u8.com ==='
          grep -RIn --exclude-dir=.git --exclude='*.min.js' 'https://ilovem3u8\.com' ops || true
          echo '=== pages.dev ==='
          grep -RIn --exclude-dir=.git --exclude='*.min.js' 'ilovem3u8\.pages\.dev' ops || true
          echo '=== publicBaseUrl writers ==='
          grep -RIn --exclude-dir=.git -E "publicBaseUrl.*(update_option|www\.ilovem3u8|ilovem3u8)|update_option\([^)]*vf_ops_site_release" ops/includes | head -250 || true
          echo DOMAIN_AUTHORITY_SOURCE_AUDIT=COMPLETE
