name: P07 V20 RC3 Source Probe

on:
  push:
    branches: [experiment/p07-vps-audit-v20]
    paths: ['.github/workflows/p07-v20-rc3-source-probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/p07-vps-audit-v20
      - name: Build through RC3 draft and inspect CPU source
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/p07_patch_v20_rc1.py
          python3 .github/scripts/p07_patch_v20_rc1_fixup.py
          python3 .github/scripts/p07_patch_v20_rc2.py
          python3 .github/scripts/p07_patch_v20_rc2_selftest.py
          python3 .github/scripts/p07_patch_v20_rc3.py
          echo '=== CPU BLOCK ==='
          grep -n -B 4 -A 8 'SHA256 多核' experiments/p07-bench.sh || true
          echo '=== PYTHON REPR ==='
          python3 - <<'PY'
          from pathlib import Path
          s=Path('experiments/p07-bench.sh').read_text(encoding='utf-8')
          i=s.find('SHA256 多核')
          print('INDEX',i)
          print(repr(s[max(0,i-140):i+260]))
          PY
