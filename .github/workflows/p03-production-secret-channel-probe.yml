name: P03 Production Secret Channel Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p03-production-secret-channel-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      VF_FORGE_ADMIN_PASSWORD: ${{ secrets.VF_FORGE_ADMIN_PASSWORD }}
      P03_ADMIN_PASSWORD: ${{ secrets.P03_ADMIN_PASSWORD }}
      P03_PRODUCTION_ADMIN_PASSWORD: ${{ secrets.P03_PRODUCTION_ADMIN_PASSWORD }}
      VF_PRODUCTION_ADMIN_PASSWORD: ${{ secrets.VF_PRODUCTION_ADMIN_PASSWORD }}
      VF_FORGE_PRODUCTION_PASSWORD: ${{ secrets.VF_FORGE_PRODUCTION_PASSWORD }}
      VF_FORGE_AI_READ_TOKEN: ${{ secrets.VF_FORGE_AI_READ_TOKEN }}
      P03_AI_READ_TOKEN: ${{ secrets.P03_AI_READ_TOKEN }}
      VF_AI_READ_TOKEN: ${{ secrets.VF_AI_READ_TOKEN }}
    steps:
      - name: Probe existing P03 credential channels without revealing values
        shell: bash
        run: |
          set -Eeuo pipefail
          admin=0
          ai=0
          for name in VF_FORGE_ADMIN_PASSWORD P03_ADMIN_PASSWORD P03_PRODUCTION_ADMIN_PASSWORD VF_PRODUCTION_ADMIN_PASSWORD VF_FORGE_PRODUCTION_PASSWORD; do
            if [ -n "${!name:-}" ]; then echo "$name=AVAILABLE"; admin=1; fi
          done
          for name in VF_FORGE_AI_READ_TOKEN P03_AI_READ_TOKEN VF_AI_READ_TOKEN; do
            if [ -n "${!name:-}" ]; then echo "$name=AVAILABLE"; ai=1; fi
          done
          if [ "$admin" -eq 1 ]; then echo 'P03_PRODUCTION_ADMIN_CHANNEL=AVAILABLE'; else echo 'P03_PRODUCTION_ADMIN_CHANNEL=NONE'; fi
          if [ "$ai" -eq 1 ]; then echo 'P03_AI_READ_CHANNEL=AVAILABLE'; else echo 'P03_AI_READ_CHANNEL=NONE'; fi
          echo 'NO_SECRET_VALUE_PRINTED=TRUE'
          echo 'NO_PRODUCTION_NETWORK_WRITE_EXECUTED=TRUE'
