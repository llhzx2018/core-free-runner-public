name: TEMP S01-C02 Ops 1.21.802 Public SEO Evidence

on:
  push:
    branches:
      - temp/s01-c02-v121802-production-readback-20260904
    paths:
      - '.github/workflows/temp-s01-c02-v121802-public-seo-evidence.yml'

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Inspect public target and Rank Math public contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          URL='https://www3.m3u8.one/faq/will-m3u8-to-mp4-lose-quality/'
          curl -fsSL --retry 3 "$URL" -o /tmp/page.html
          code="$(curl -sS -L --retry 3 -o /dev/null -w '%{http_code}' "$URL")"
          test "$code" = 200
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re,json
          html=Path('/tmp/page.html').read_text(errors='replace')
          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.title=False; self.title_text=[]; self.desc=[]; self.canonical=[]; self.hreflang=[]; self.schema=0; self.text=[]
              def handle_starttag(self,tag,attrs):
                  a={k.lower():(v or '') for k,v in attrs}; t=tag.lower()
                  if t=='title': self.title=True
                  if t=='meta' and a.get('name','').lower()=='description': self.desc.append(a.get('content',''))
                  if t=='link' and 'canonical' in a.get('rel','').lower().split(): self.canonical.append(a.get('href',''))
                  if t=='link' and 'alternate' in a.get('rel','').lower().split() and a.get('hreflang'): self.hreflang.append({'lang':a.get('hreflang'),'href':a.get('href','')})
                  if t=='script' and a.get('type','').lower()=='application/ld+json': self.schema+=1
              def handle_endtag(self,tag):
                  if tag.lower()=='title': self.title=False
              def handle_data(self,data):
                  if self.title: self.title_text.append(data)
                  self.text.append(data)
          p=P(); p.feed(html)
          out={'http':200,'titlePresent':bool(''.join(p.title_text).strip()),'descriptionPresent':any(x.strip() for x in p.desc),'canonicalPresent':any(x.strip() for x in p.canonical),'canonical':p.canonical[:3],'hreflangCount':len(p.hreflang),'hreflang':p.hreflang[:10],'jsonLdCount':p.schema,'htmlBytes':len(html.encode()),'visibleTextChars':len(re.sub(r'\s+',' ', ' '.join(p.text)).strip())}
          print(json.dumps(out,ensure_ascii=False,indent=2))
          Path('/tmp/public-safe.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
          curl -fsSL --retry 3 'https://www3.m3u8.one/wp-json/' -o /tmp/index.json
          jq -r '.routes | to_entries[] | select((.key|ascii_downcase|contains("rankmath")) or (.key|ascii_downcase|contains("rank-math"))) | [.key, ([.value.endpoints[]?.methods[]?] | unique | join(","))] | @tsv' /tmp/index.json | sort | tee /tmp/rankmath-routes.tsv || true
          echo PUBLIC_SEO_EVIDENCE=PASS
