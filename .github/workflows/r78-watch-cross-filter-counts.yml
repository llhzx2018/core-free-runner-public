name: R78 Focused Watch Cross Filter Count Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r78-watch-cross-filter-counts.yml'

permissions:
  contents: read

jobs:
  r78-focused-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: c066a0c9399b3521f3a87aef989ce56e0f3a06cd
    steps:
      - name: Checkout exact private P01 candidate transiently
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: c066a0c9399b3521f3a87aef989ce56e0f3a06cd
          path: vf-start
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_sqlite,sqlite3,curl
          coverage: none

      - name: Exact source and focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd vf-start
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(cat VERSION)" = '2.47.0'
          node --check src/assets/workspace-rebaseline.js
          php -l tests/unit/watch_cross_filter_count_contract.php
          php tests/unit/watch_cross_filter_count_contract.php
          php tests/unit/watch_status_context_badge_contract.php
          php tests/unit/mobile_filter_context_count_contract.php
          php tests/unit/scope_context_count_contract.php
          echo R78_WATCH_CROSS_FILTER_COUNT_PASS
          echo R78_EXACT_CANDIDATE_GATE_PASS

      - name: Cleanup transient private source
        if: always()
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/vf-start"
