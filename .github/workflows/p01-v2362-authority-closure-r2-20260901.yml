name: P01 V2.36.2 Release Authority Closure R2
on:
  push:
    branches:
      - release/p01-v2362-candidate-20260901
    paths:
      - .github/workflows/p01-v2362-authority-closure-r2-20260901.yml
permissions:
  contents: read
jobs:
  closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE: d3b6f4af92cbfab28df465938ea8348a35909052
      MAIN_SHA: 4fd25a5ce4383dc456e755fc2e031a861d6ff655
      BRANCH: docs/p01-v2362-release-closure-20260901
      RUNNER_REF: release/p01-v2362-candidate-20260901
    steps:
      - name: Checkout runner closure script
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: ${{ env.RUNNER_REF }}
          path: runner
      - name: Checkout P01 Authority branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01
      - name: Build and push exact five-file closure
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p01
          test "$(git rev-parse HEAD)" = "$BASE"
          test "$(git ls-remote origin refs/heads/develop | awk '{print $1}')" = "$BASE"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN_SHA"
          python3 ../runner/scripts/p01_v2362_authority_closure.py
          python3 -m json.tool VF_PROJECT.json >/dev/null
          actual="$(git status --short | sed 's/^...//' | sort | tr '\n' ' ')"
          expected='README.md VF_PROJECT.json docs/authority/CURRENT.md docs/evidence/P01_V2.36.2_RELEASE_CLOSURE_20260901.md docs/handoff/CURRENT_STATE.md '
          test "$actual" = "$expected"
          test -z "$(git diff --name-only -- src)"
          grep -F 'Published Latest: V2.36.2' README.md >/dev/null
          grep -F 'Live Online Next Hop: V2.36.1' README.md >/dev/null
          test "$(jq -r .production_version VF_PROJECT.json)" = 2.36.0
          test "$(jq -r .published_release.version VF_PROJECT.json)" = 2.36.2
          test "$(jq -r .published_release.release_id VF_PROJECT.json)" = 380317968
          test "$(jq -r .published_release.live_online_next_hop VF_PROJECT.json)" = 2.36.1
          git diff --check
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add README.md VF_PROJECT.json docs/authority/CURRENT.md docs/evidence/P01_V2.36.2_RELEASE_CLOSURE_20260901.md docs/handoff/CURRENT_STATE.md
          git commit -m 'docs(P01): close V2.36.2 release chain'
          git push origin HEAD:"refs/heads/$BRANCH"
          printf 'P01_V2362_AUTHORITY_CLOSURE_R2=PASS\nBASE=%s\nMAIN=%s\nOWNER_PRODUCTION=2.36.0\nPUBLISHED_LATEST=2.36.2\nLIVE_NEXT_HOP=2.36.1\nOWNER_PRODUCTION_WRITE=NO\n' "$BASE" "$MAIN_SHA" | tee /tmp/p01-v2362-authority-r2.txt
      - name: Upload closure evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-v2362-authority-r2-${{ github.run_id }}
          path: /tmp/p01-v2362-authority-r2.txt
          if-no-files-found: warn
          retention-days: 90
