name: P07 rc51 Formal Release and Remote Readback
on:
  push:
    branches: [main]
    paths:
      - 'packages/p07-system-care/0.1.0-rc51/**'
      - 'installers/p07-system-care.sh'
      - '.github/workflows/p07-care-rc51-formal-release.yml'

permissions:
  contents: read

concurrency:
  group: p07-rc51-formal-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_TAG: p07-v0.1.0-release84-care-rc51-wp-owner-state-clarity
      RELEASE_REPO: llhzx2018/core-free-runner-public
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Exact merged source and immutable distribution preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN" || { echo 'P07_RELEASE_TOKEN_MISSING'; exit 78; }
          test "$GITHUB_REPOSITORY" = "$RELEASE_REPO"
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_main="$(gh api "repos/$RELEASE_REPO/git/ref/heads/main" --jq '.object.sha')"
          test "$remote_main" = "$GITHUB_SHA"
          pkg='packages/p07-system-care/0.1.0-rc51'
          test "$(cat "$pkg/VERSION")" = '0.1.0-rc51'
          test "$(git hash-object "$pkg/MANIFEST.gitblob")" = '0795a001bda6bb7f4d917bb86cb2176a590f13d2'
          (cd "$pkg" && while read -r sha name; do test "$(git hash-object "$name")" = "$sha"; done < MANIFEST.gitblob)
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc51"' installers/p07-toolbox.sh
          grep -Fq "VERSION='0.1.0-rc51'" installers/p07-system-care.sh
          grep -Fq "MANIFEST_BLOB='0795a001bda6bb7f4d917bb86cb2176a590f13d2'" installers/p07-system-care.sh
          bash -n "$pkg/intrusion-evidence.sh" installers/p07-system-care.sh installers/p07-toolbox.sh
          python3 -m unittest discover -s tests -p 'test_p07_wp_owner_baseline_rc50.py' -q
          python3 -m unittest discover -s tests -p 'test_p07_wp_owner_status_rc51.py' -q
          python3 -m unittest discover -s tests -p 'test_p07_wp_owner_triage_rc48.py' -q
          echo 'P07_RC51_MERGED_EXACT_SOURCE=PASS'

      - name: Formal Release through registered VF release credential
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! gh release view "$RELEASE_TAG" -R "$RELEASE_REPO" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" -R "$RELEASE_REPO" --target "$GITHUB_SHA" \
              --title 'P07 · rc51 WordPress 本次检查和历史记录分开显示' \
              --notes 'rc50 已正式发布且保持不可变。修复 WordPress 网站安全状态页：本次仍有文件差异与只有未核实的历史记录使用不同文案；历史数量始终是累计值，不能当作本次新增或已确认入侵。未计算的安全建议不再显示 UNKNOWN 项。文件历史、强制确认、调度器、扫描及全部其他菜单逻辑不变。所有隔离回归与相关 CI 已通过，未进行生产服务器写入。OWNER 实机验收仍为 NOT_RUN。'
          fi
          tag_sha="$(gh api "repos/$RELEASE_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          test "$tag_sha" = "$GITHUB_SHA" || { echo 'P07_RC51_TAG_IDENTITY_MISMATCH'; exit 81; }
          release_data="$(gh api "repos/$RELEASE_REPO/releases/tags/$RELEASE_TAG")"
          test "$(jq -r '.tag_name' <<< "$release_data")" = "$RELEASE_TAG"
          test "$(jq -r '.target_commitish' <<< "$release_data")" = "$GITHUB_SHA"
          test "$(jq -r '.draft' <<< "$release_data")" = false
          test "$(jq -r '.prerelease' <<< "$release_data")" = false
          echo 'P07_RC51_FORMAL_RELEASE_REMOTE_READBACK=PASS'

      - name: Published public distribution and raw-byte readback
        shell: bash
        run: |
          set -Eeuo pipefail
          manifest_url="https://raw.githubusercontent.com/$RELEASE_REPO/$GITHUB_SHA/packages/p07-system-care/0.1.0-rc51/MANIFEST.gitblob"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 5 --retry-delay 2 "$manifest_url" -o /tmp/p07-rc51-manifest
          test "$(git hash-object /tmp/p07-rc51-manifest)" = '0795a001bda6bb7f4d917bb86cb2176a590f13d2'
          url="https://raw.githubusercontent.com/$RELEASE_REPO/main/installers/p07-system-care.sh"
          good=0
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL --proto '=https' --tlsv1.2 "$url" -o /tmp/p07-public-installer &&
              grep -Fq "VERSION='0.1.0-rc51'" /tmp/p07-public-installer &&
              grep -Fq "MANIFEST_BLOB='0795a001bda6bb7f4d917bb86cb2176a590f13d2'" /tmp/p07-public-installer; then
              good=1
              break
            fi
            sleep 3
          done
          test "$good" = 1 || { echo P07_RC51_PUBLIC_INSTALLER_NOT_CURRENT; exit 85; }
          echo 'P07_RC51_PUBLIC_DISTRIBUTION_REMOTE_READBACK=PASS'
