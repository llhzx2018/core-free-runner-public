name: P01 D36 Owner encrypted update token + legacy-channel rejection three-engine FPM
on:
  push:
    branches:
      - test/p01-d36-owner-channel-three-engine-20261112

permissions:
  contents: read

jobs:
  actual-full-three-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: p01-only-synthetic-test
          MYSQL_DATABASE: p01_d1_test_mysql_20261111
        ports:
          - 3306:3306
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: p01-only-synthetic-test
          MARIADB_DATABASE: p01_d1_test_maria_20261111
        ports:
          - 3307:3306
    steps:
      - name: Confirm exact test route and synthetic-only data
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "$GITHUB_REF_NAME" = "test/p01-d36-owner-channel-three-engine-20261112"
          echo "P01_D14_SCOPE=ISOLATED_EPHEMERAL_FULL_AND_LOCAL_SQL_CONTAINERS"
          echo "P01_D14_PRODUCTION_WRITES=NO"

      - name: Check registered private read capability
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          test -n "$READ_TOKEN"
          echo "P01_D14_PRIVATE_READ_CAPABILITY=PRESENT"

      - name: Read exact private candidate without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: d96e58ab98db36e6520791f08ed4087164055320
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false

      - name: Exact Git identity gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "d96e58ab98db36e6520791f08ed4087164055320"
          test "$(cat candidate/VERSION)" = "2.47.515"
          test -f candidate/tests/compatibility/laravel/http/run_cloudpanel_fpm_full_stage.py
          echo "P01_D14_EXACT_PRIVATE_HEAD=d96e58ab98db36e6520791f08ed4087164055320"

      - name: Prepare isolated actual PHP-FPM Nginx and composer build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq             nginx php8.3-fpm php8.3-cli php8.3-mysql php8.3-sqlite3             php8.3-mbstring php8.3-xml php8.3-curl php8.3-zip composer             openssl unzip >/dev/null
          command -v php-fpm8.3
          command -v nginx
          command -v openssl
          node --version
          npm --version
          php -r 'foreach(["sqlite","mysql"] as $d)if(!in_array($d,PDO::getAvailableDrivers(),true))exit(2);'
          echo "P01_D14_REAL_FPM_NGINX_PDO_AVAILABLE=PASS"

      - name: Validate Owner upgrade native PHP contract and no exec capability
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l candidate/src/app/next/http/OwnerUpgradeRoutes.php
          php -l candidate/src/app/next/routes/web.php
          php -l candidate/tests/unit/p01_d33_owner_update_routes_contract.php
          php candidate/tests/unit/p01_d33_owner_update_routes_contract.php
          php -l candidate/src/app/next/runtime/OwnerUpdateCredentialVault.php
          php -l candidate/src/app/next/runtime/OfficialChannelReadiness.php
          php -l candidate/tests/unit/p01_d36_owner_channel_contract.php
          php -l candidate/src/app/CoreUpdates/UpdateCore.php
          php -l candidate/src/app/CoreUpdates/GitHubClient.php
          php candidate/tests/unit/p01_d36_owner_channel_contract.php
          python3 -m py_compile candidate/tests/compatibility/laravel/http/run_cloudpanel_fpm_full_stage.py
          echo P01_D36_CANONICAL_COREUPDATES_READ_AND_ENCRYPTED_TOKEN_NEGATIVES=PASS
          echo P01_D33_OWNER_UPGRADE_SOURCE_AND_PHP_NEGATIVES=PASS

      - name: Build exact-source real self-contained future FULL once
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 scripts/build_p01_next_clean_full.py build             --source-sha d96e58ab98db36e6520791f08ed4087164055320             --output "$RUNNER_TEMP/p01-d14-full.zip" --composer composer
          python3 scripts/build_p01_next_clean_full.py verify             --zip "$RUNNER_TEMP/p01-d14-full.zip"
          echo "P01_D14_EXACT_SOURCE_REAL_ZIP=PASS"
          python3 -m py_compile scripts/build_p01_next_cloudpanel_full.py
          python3 tests/unit/p01_d35_cloudpanel_layout_contract.py
          python3 scripts/build_p01_next_cloudpanel_full.py build \
            --source-zip "$RUNNER_TEMP/p01-d14-full.zip" \
            --output "$RUNNER_TEMP/p01-d35-cloudpanel.zip"
          python3 scripts/build_p01_next_cloudpanel_full.py verify \
            --zip "$RUNNER_TEMP/p01-d35-cloudpanel.zip"
          echo "P01_D35_EXACT_SOURCE_SINGLE_CLOUDPANEL_SITE_ZIP_VERIFIED=PASS"

      - name: Actual Chromium Owner upgrade UI 390 768 1440 and failure display
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate/src/app/next/frontend
          npx playwright install --with-deps chromium >/dev/null
          npm run test:e2e
          echo P01_D33_CHROMIUM_390_768_1440_CLICK_ONLY_FAILURE_STATES=PASS

      - name: Validate real Nginx TLS and PHP-FPM SQLite clean FULL browser HTTP
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 tests/compatibility/laravel/http/run_cloudpanel_fpm_full_stage.py             --bundle "$RUNNER_TEMP/p01-d35-cloudpanel.zip" --engine sqlite
          echo "P01_D14_SQLITE_REAL_FPM_FULL=PASS"
          echo "P01_D35_CLOUDPANEL_NATIVE_SQLITE_SITE_INSTALL_AND_OWNER=PASS"

      - name: Validate real MariaDB 11.8 FPM clean FULL and Owner
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 tests/compatibility/laravel/http/run_cloudpanel_fpm_full_stage.py             --bundle "$RUNNER_TEMP/p01-d35-cloudpanel.zip" --engine mariadb
          echo "P01_D14_MARIADB_REAL_FPM_FULL=PASS"
          echo "P01_D35_CLOUDPANEL_NATIVE_MARIADB_SITE_INSTALL_AND_OWNER=PASS"

      - name: Validate real MySQL 8.4 FPM clean FULL and Owner
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 tests/compatibility/laravel/http/run_cloudpanel_fpm_full_stage.py             --bundle "$RUNNER_TEMP/p01-d35-cloudpanel.zip" --engine mysql
          echo "P01_D14_MYSQL_REAL_FPM_FULL=PASS"
          echo "P01_D35_CLOUDPANEL_NATIVE_MYSQL_SITE_INSTALL_AND_OWNER=PASS"
          echo "P01_D36_SQLITE_MARIADB_MYSQL_OWNER_CREDENTIAL_ISOLATION=PASS"

      - name: Private source and generated ZIP cleanup
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate
          rm -f -- "$RUNNER_TEMP/p01-d14-full.zip" "$RUNNER_TEMP/p01-d35-cloudpanel.zip"
          echo "P01_D14_PRIVATE_SOURCE_PERSISTED=NO"
          echo "P01_D14_TEST_ZIP_PERSISTED=NO"
