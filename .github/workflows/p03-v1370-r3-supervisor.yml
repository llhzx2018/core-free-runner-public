name: P03 V1.37.0 R3 Release Supervisor

on:
  workflow_run:
    workflows: ['P03 V1.37.0 Formal Release Direct R3']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

env:
  P03_REPOSITORY: llhzx2018/vf-forge
  CORE_UPDATES_REPOSITORY: llhzx2018/core-updates
  SOURCE_COMMIT: 11909e07b682765346d4ef890402b4ce00b91291
  RELEASE_TAG: v1.37.0
  ASSET_NAME: VF_Forge_V1.37.0_UPDATE.zip

jobs:
  supervise:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Determine upstream conclusion
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            echo 'UPSTREAM=MANUAL' >"$RUNNER_TEMP/upstream"
          else
            echo 'UPSTREAM=${{ github.event.workflow_run.conclusion }}' >"$RUNNER_TEMP/upstream"
          fi

      - name: Independent release readback
        id: readback
        continue-on-error: true
        shell: bash
        env:
          RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [ "${{ github.event_name }}" != 'workflow_dispatch' ]; then
            test "${{ github.event.workflow_run.conclusion }}" = 'success'
          fi
          test -n "$RELEASE_TOKEN"
          repo="https://x-access-token:${RELEASE_TOKEN}@github.com/${P03_REPOSITORY}.git"
          test "$(git ls-remote "$repo" refs/heads/main | awk '{print $1}')" = "$SOURCE_COMMIT"
          test "$(git ls-remote "$repo" "refs/tags/$RELEASE_TAG" | awk '{print $1}')" = "$SOURCE_COMMIT"
          rm -rf "$RUNNER_TEMP/release"; mkdir -p "$RUNNER_TEMP/release"
          gh release download "$RELEASE_TAG" --repo "$P03_REPOSITORY" --pattern "$ASSET_NAME" --dir "$RUNNER_TEMP/release"
          test -f "$RUNNER_TEMP/release/$ASSET_NAME"
          sha=$(sha256sum "$RUNNER_TEMP/release/$ASSET_NAME" | awk '{print $1}'); bytes=$(stat -c%s "$RUNNER_TEMP/release/$ASSET_NAME")
          git clone --depth=1 "https://x-access-token:${RELEASE_TOKEN}@github.com/${CORE_UPDATES_REPOSITORY}.git" "$RUNNER_TEMP/core" >/dev/null 2>&1
          python3 - "$RUNNER_TEMP/core/projects/P03.json" "$sha" "$bytes" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1])); sha=sys.argv[2]; b=int(sys.argv[3])
          assert d['version']=='1.37.0'
          assert d['source_commit']=='11909e07b682765346d4ef890402b4ce00b91291'
          assert d['tag']=='v1.37.0' and d['asset']=='VF_Forge_V1.37.0_UPDATE.zip'
          assert d['sha256']==sha and int(d['bytes'])==b
          assert d['schema_from']==30 and d['schema_to']==30 and d['from_versions']==['1.36.2']
          assert d['backup_required'] is True and d['rollback_supported'] is True
          PY
          echo "$sha" >"$RUNNER_TEMP/sha"; echo "$bytes" >"$RUNNER_TEMP/bytes"

      - name: Checkout public runner main
        if: always()
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-free-runner-public
          ref: main
          token: ${{ github.token }}
          persist-credentials: true
          path: runner

      - name: Publish unique release status
        if: always()
        shell: bash
        env:
          READBACK_OUTCOME: ${{ steps.readback.outcome }}
        run: |
          set -Eeuo pipefail
          mkdir -p runner/ops/p03/release
          rm -f runner/ops/p03/release/P03_V1370_RELEASE_READY.md runner/ops/p03/release/P03_V1370_RELEASE_BLOCKED.md
          if [ "$READBACK_OUTCOME" = 'success' ]; then
            {
              echo '# P03 V1.37.0 RELEASE READY'; echo; echo 'RESULT=PASS'; echo 'PROJECT=P03 · VF Forge'; echo 'PRODUCTION_INSTALLED=1.36.2'; echo 'AVAILABLE_VERSION=1.37.0'; echo 'SOURCE_COMMIT=11909e07b682765346d4ef890402b4ce00b91291'; echo 'TAG=v1.37.0'; echo 'ASSET=VF_Forge_V1.37.0_UPDATE.zip'; echo "ASSET_SHA256=$(cat "$RUNNER_TEMP/sha")"; echo "ASSET_BYTES=$(cat "$RUNNER_TEMP/bytes")"; echo 'SCHEMA_FROM=30'; echo 'SCHEMA_TO=30'; echo 'MIGRATION=NONE'; echo 'FROM_VERSIONS=1.36.2'; echo 'CORE_UPDATES=REMOTE_READBACK_PASS'; echo 'GITHUB_RELEASE=REMOTE_READBACK_PASS'; echo 'PRODUCTION_WRITE=NO';
            } > runner/ops/p03/release/P03_V1370_RELEASE_READY.md
          else
            {
              echo '# P03 V1.37.0 RELEASE BLOCKED'; echo; echo 'RESULT=BLOCKED'; cat "$RUNNER_TEMP/upstream"; echo "READBACK_OUTCOME=$READBACK_OUTCOME"; echo 'PRODUCTION_UPGRADE=NOT_AUTHORIZED'; echo 'PRODUCTION_WRITE=NO';
            } > runner/ops/p03/release/P03_V1370_RELEASE_BLOCKED.md
          fi
          cd runner
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A ops/p03/release
          if ! git diff --cached --quiet; then git commit -m 'evidence(P03): V1.37.0 supervised release status'; git push origin HEAD:main; fi
          test "$READBACK_OUTCOME" = 'success'
