name: P01 V2.35.2 Formal Source Prep

on:
  push:
    branches: [release/p01-v2352-formal-source-prep-20260831]
    paths: [.github/workflows/p01-v2352-formal-source-prep-20260831.yml]

permissions:
  contents: read

jobs:
  formal-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CANDIDATE: 07261e2209a6e1abb6b7d79279156f01da42283d
      EXPECTED_DEVELOP: e27e04f4cede748c3f7969d526fc390d8ffc6f6f
      FORMAL_BRANCH: release/v2.35.2-formal-source-20260831
      CANDIDATE_RUN: '33347168167'
      CANDIDATE_EVID_ARTIFACT: '9742368766'
      CANDIDATE_EVID_DIGEST: 'sha256:5e46d3cbfa7c751b6c09ded1ea56c67880341ab28bfc99dcd4f147fb92e6d1e2'
      MACHINE_RUN: '33344132874'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.CANDIDATE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01

      - name: Write candidate evidence and form formal source
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p01
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          DEVELOP=$(git ls-remote origin refs/heads/develop | awk '{print $1}')
          test "$DEVELOP" = "$EXPECTED_DEVELOP"
          if git ls-remote --exit-code origin "refs/heads/$FORMAL_BRANCH" >/dev/null 2>&1; then echo FORMAL_BRANCH_ALREADY_EXISTS; exit 20; fi
          if git ls-remote --exit-code --tags origin refs/tags/v2.35.2 >/dev/null 2>&1; then echo UNEXPECTED_V2352_TAG; exit 21; fi
          git switch -c "$FORMAL_BRANCH"
          cat > docs/evidence/P01_V2.35.2_RELEASE_START_20260831.md <<'EOF'
          # P01 · V2.35.2 Patch Release Start · 2026-08-31

          ## Boundary

          ```text
          Owner Production: V2.35.1 / Schema 2026082901 / CLOSED
          Published Latest: V2.35.1 / immutable
          Develop before release candidate: e27e04f4cede748c3f7969d526fc390d8ffc6f6f
          Hotfix Product Source: de9cd603c20227423093ce6f60f08b64aa4472f0
          Hotfix runtime file: src/assets/update-core.js
          PR #132: MERGED
          Authoritative Hotfix Machine Gate: 33344132874 / PASS
          Target: V2.35.2
          Schema change: NO
          Migration: NONE
          Assistant Owner Production write: NO
          ```

          V2.35.2 only publishes the already-verified Online Update terminal-state hotfix. It does not carry unrelated product or UI changes.
          EOF
          cat > docs/evidence/P01_V2.35.2_CANDIDATE_READINESS_20260831.md <<'EOF'
          # P01 · V2.35.2 Candidate Readiness · 2026-08-31

          ## Exact Candidate

          ```text
          Candidate Source: 07261e2209a6e1abb6b7d79279156f01da42283d
          Candidate Tree: 635f4d70b6e2ed6e7a378e525d40b257613581a4
          Candidate Runtime Tree: f000f39c1a2cf48296a4c165726323dabaf5e37c
          Predecessor Tag: v2.35.1
          Predecessor Source: eb36fd19d269aed4ef4246c2c18f172b2c761bde
          Schema: 2026082901
          Migration: NONE
          Candidate Readiness Run: 33347168167 / PASS
          Evidence Artifact: 9742368766
          Evidence Digest: sha256:5e46d3cbfa7c751b6c09ded1ea56c67880341ab28bfc99dcd4f147fb92e6d1e2
          Hotfix Machine Gate: 33344132874 / PASS
          Owner Production write: NO
          ```

          ## PASS coverage

          - Exact Source / tree / runtime tree and exact three-file runtime delta fence.
          - PHP and JavaScript syntax.
          - Schema unchanged / no migration.
          - Deterministic candidate artifact build and Atomic self-test.
          - Actual V2.35.1 → V2.35.2 Atomic Upgrade.
          - Seeded data preservation and idempotent second run.
          - Fresh Install, CLI verify, Surface verify and five-domain HTTP.
          - SQLite integrity_check and foreign_key_check.
          - Online Update terminal-state regression on Candidate runtime: stable/no-op/true-failure/available matrix.
          - Required 1440 / 390, Light / Dark screenshots.

          Candidate Readiness is PASS. Formal Artifact Gate and Strict Fresh Install Gate remain required before main promotion and publication.
          EOF
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('VF_PROJECT.json'); d=json.loads(p.read_text(encoding='utf-8'))
          assert d['production_version']=='2.35.1' and d['published_release']['version']=='2.35.1'
          assert d['candidate_version']=='2.35.2' and d['schema_version']=='2026082901'
          d['candidate_state']='CANDIDATE READINESS PASS / FORMAL GATES PENDING'
          d['current_phase']='V2.35.2 CANDIDATE PASS / FORMAL ARTIFACT + STRICT FRESH PENDING'
          d['current_authority']='Owner Production V2.35.1 / Published Latest V2.35.1 / V2.35.2 Candidate Readiness PASS'
          d['next_action']='Run V2.35.2 Formal Artifact Gate and Strict Fresh Install Gate; only after both PASS promote exact formal source to main and publish.'
          d['v2_35_2_candidate_gate']={'run':33347168167,'result':'PASS','evidence_artifact':9742368766,'evidence_digest':'sha256:5e46d3cbfa7c751b6c09ded1ea56c67880341ab28bfc99dcd4f147fb92e6d1e2','machine_gate':33344132874}
          d['authority']['current_candidate_evidence']='docs/evidence/P01_V2.35.2_CANDIDATE_READINESS_20260831.md'
          d['authority']['current_release_start_evidence']='docs/evidence/P01_V2.35.2_RELEASE_START_20260831.md'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python3 -m json.tool VF_PROJECT.json >/dev/null
          test "$(jq -r .production_version VF_PROJECT.json)" = '2.35.1'
          test "$(jq -r .published_release.version VF_PROJECT.json)" = '2.35.1'
          test "$(jq -r .candidate_version VF_PROJECT.json)" = '2.35.2'
          mapfile -t changed < <(git status --porcelain | sed 's/^...//' | sort)
          expected=$'VF_PROJECT.json\ndocs/evidence/P01_V2.35.2_CANDIDATE_READINESS_20260831.md\ndocs/evidence/P01_V2.35.2_RELEASE_START_20260831.md'
          test "$(printf '%s\n' "${changed[@]}")" = "$expected"
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VF_PROJECT.json docs/evidence/P01_V2.35.2_CANDIDATE_READINESS_20260831.md docs/evidence/P01_V2.35.2_RELEASE_START_20260831.md
          git commit -m 'release(P01): bind V2.35.2 candidate PASS'
          FORMAL=$(git rev-parse HEAD); TREE=$(git rev-parse HEAD^{tree}); RUNTIME=$(git rev-parse HEAD:src)
          git push origin "HEAD:refs/heads/$FORMAL_BRANCH"
          REMOTE_DEVELOP=$(git ls-remote origin refs/heads/develop | awk '{print $1}')
          test "$REMOTE_DEVELOP" = "$EXPECTED_DEVELOP"
          git push origin "$FORMAL:refs/heads/develop"
          printf 'P01_V2352_FORMAL_SOURCE_PREP=PASS\nFORMAL_SOURCE=%s\nFORMAL_TREE=%s\nRUNTIME_TREE=%s\nDEVELOP=%s\nOWNER_PRODUCTION_WRITE=NO\n' "$FORMAL" "$TREE" "$RUNTIME" "$FORMAL" | tee /tmp/p01-v2352-formal-source.txt

      - name: Upload formal source identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2352-formal-source-${{ github.run_id }}
          path: /tmp/p01-v2352-formal-source.txt
          if-no-files-found: error
          retention-days: 30
