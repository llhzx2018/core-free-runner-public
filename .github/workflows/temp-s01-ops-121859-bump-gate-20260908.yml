name: temp-s01-ops-121859-bump-gate-20260908
on:
  push:
    branches:
      - temp/s01-page-update-center-v4-20260907
    paths:
      - .github/workflows/temp-s01-ops-121859-bump-gate-20260908.yml
permissions:
  contents: read
jobs:
  bump:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      REPO: llhzx2018/vf-tools-ops
      BRANCH: work/s01-ops-dashboard-visible-ui-20260908
      BASE_SHA: 3b3efca0aa46f914fe4f7434a6acbad7724b06c6
    steps:
      - name: Bump and validate Ops 1.21.859
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'BUMP_GATE=WRITE_BRANCH_ONLY MAIN_WRITE_USED=NO RELEASE_USED=NO DISTRIBUTION_USED=NO PRODUCTION_WRITE_USED=NO STATIC_WRITE_USED=NO ONLINE_WRITE_USED=NO'
          rm -rf /tmp/ops
          git clone -q "https://x-access-token:${WRITE_TOKEN}@github.com/${REPO}.git" /tmp/ops
          cd /tmp/ops
          git checkout -q "$BRANCH"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          mapfile -t identity < <(git grep -l -E '1\.21\.858' -- ':!docs/**' ':!*.md' | sort)
          printf '%s\n' VERSION includes/admin-v13/views/dashboard.php tests/admin-human-language-contract.php tests/dashboard-visible-ui-contract.php tests/system-components-human-language-contract.php tests/update-refresh-policy-current-contract.php tests/visible-console-v2-contract.php vf-ops.php | sort >/tmp/expected_identity
          printf '%s\n' "${identity[@]}" >/tmp/identity
          diff -u /tmp/expected_identity /tmp/identity
          python3 - <<'PY'
          from pathlib import Path
          paths = [
            'VERSION',
            'includes/admin-v13/views/dashboard.php',
            'tests/admin-human-language-contract.php',
            'tests/dashboard-visible-ui-contract.php',
            'tests/system-components-human-language-contract.php',
            'tests/update-refresh-policy-current-contract.php',
            'tests/visible-console-v2-contract.php',
            'vf-ops.php',
          ]
          for p in paths:
              f=Path(p); s=f.read_text(); s=s.replace('1.21.858','1.21.859'); f.write_text(s)
          p=Path('vf-ops.php'); s=p.read_text(); s=s.replace("S01-ERROR-RECOVERY-UX-CLOSURE","S01-DEFAULT-WORKBENCH-VISIBLE-UI-CLOSURE"); p.write_text(s)
          PY
          test "$(tr -d '\r\n' < VERSION)" = '1.21.859'
          grep -F 'Version: 1.21.859' vf-ops.php >/dev/null
          grep -F "VF_OPS_VERSION', '1.21.859" vf-ops.php >/dev/null
          grep -F "VF_OPS_ROUND', 'S01-DEFAULT-WORKBENCH-VISIBLE-UI-CLOSURE" vf-ops.php >/dev/null
          if git grep -n -E '1\.21\.858' -- ':!docs/**' ':!*.md'; then echo FAIL_STALE_VERSION_IDENTITY; exit 1; fi
          find includes -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php -l vf-ops.php >/dev/null
          php tests/dashboard-visible-ui-contract.php
          php tests/dashboard-selector-hit-contract.php
          php tests/admin-human-language-contract.php
          php tests/error-recovery-human-language-contract.php
          php tests/pages-tools-human-closure-contract.php
          php tests/system-components-human-language-contract.php
          php tests/update-compat-human-language-contract.php
          php tests/update-refresh-policy-current-contract.php
          php tests/visible-console-v2-contract.php
          git diff --check "$BASE_SHA" --
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" -- | sort)
          printf '%s\n' VERSION includes/admin-v13/views/dashboard.php tests/admin-human-language-contract.php tests/dashboard-visible-ui-contract.php tests/system-components-human-language-contract.php tests/update-refresh-policy-current-contract.php tests/visible-console-v2-contract.php vf-ops.php | sort >/tmp/expected_changed
          printf '%s\n' "${changed[@]}" >/tmp/changed
          diff -u /tmp/expected_changed /tmp/changed
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VERSION includes/admin-v13/views/dashboard.php tests/admin-human-language-contract.php tests/dashboard-visible-ui-contract.php tests/system-components-human-language-contract.php tests/update-refresh-policy-current-contract.php tests/visible-console-v2-contract.php vf-ops.php
          git commit -m 'release(S01-C02): prepare visible workbench UX 1.21.859'
          git push -q origin "$BRANCH"
          echo "OPS_121859_BUMP_HEAD=$(git rev-parse HEAD)"
          echo 'PASS_S01_C02_121859_BUMP_GATE'
