name: P01 V2.36.4 Formal Bind Gate
on:
  push:
    branches: [release/p01-v2364-candidate-20260901]
    paths: [.github/workflows/p01-v2364-formal-bind-gate-20260901.yml]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: 6b321422bce5a834521786d8233149c7624aa014
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
      - name: Independent formal bind gate
        shell: bash
        run: |
          set -Eeuo pipefail
          E=/tmp/v2364-formal-bind; mkdir -p "$E"
          B=6b321422bce5a834521786d8233149c7624aa014
          C=2e5f09e1c75eeaaa6d3ab3d98edf2773d30e0062
          D=5615d19b07303132e8fc2e374de1236a37f3cb16
          RT=e1ee914a6d9e61bac7931b1f5363a8c7e24e925a
          P=718e043e3715ef7b21849bc08634fca89bf92c1f
          test "$(git rev-parse HEAD)" = "$B"
          test "$(git rev-parse HEAD^)" = "$C"
          test "$(git rev-parse HEAD:src)" = "$RT"
          test "$(git rev-parse "$C^")" = "$P"
          test "$(git diff --name-only "$C..$B" | tr '\n' ' ')" = 'VF_PROJECT.json '
          LIVE=$(git ls-remote origin refs/heads/develop | cut -f1); test "$LIVE" = "$D"
          git fetch -q origin "$LIVE"
          test "$(git rev-parse FETCH_HEAD:src/assets/workspace-domain-nav.css)" = "$(git rev-parse HEAD:src/assets/workspace-domain-nav.css)"
          test "$(cat VERSION)" = 2.36.4; test "$(cat src/VERSION.txt)" = 2.36.4
          grep -Fx "define('VF_VERSION', '2.36.4');" src/app/bootstrap.php >/dev/null
          python3 - <<'PY'
          import json,urllib.request
          d=json.load(open('VF_PROJECT.json')); g=d['v2_36_4_candidate_gate']; rc=d['v2_36_4_release_candidate']
          assert d['candidate_version']=='2.36.4' and d['production_version']=='2.36.3' and d['schema_version']=='2026082901'
          assert g['state']=='PASS' and g['candidate']=='2e5f09e1c75eeaaa6d3ab3d98edf2773d30e0062'
          assert g['runtime_tree']=='e1ee914a6d9e61bac7931b1f5363a8c7e24e925a' and g['runtime_delta_count']==3
          assert g['runtime_changed']==['VERSION.txt','app/bootstrap.php','assets/workspace-domain-nav.css']
          assert g['artifact']==9804570473 and g['artifact_sha256']=='d092acb2892308d3c481196e77c4edd0a2ed720bff3458067d6ad85acf7cdddb'
          assert g['full_zip_bytes']==587178 and g['full_zip_sha256']=='dd0d25e8eacb367305b14cc830363539b0819a055a3b01f1333b79a8104dbe83'
          assert g['update_zip_bytes']==1236989 and g['update_zip_sha256']=='3b0754d6c089baa0249064ba5683732a9784fc397b8971b97a30dda3c1ebde24'
          assert g['repair_php_bytes']==3592533 and g['repair_php_sha256']=='14b12da6d14d53aa5b3fc43b3578efb323da7736ecef861782d1d0dfce543385'
          assert g['atomic_upgrade']=='V2.36.3 -> V2.36.4 PASS' and g['anonymous_grid'].startswith('390 + 1319 + 1440')
          assert g['visual_readback'].startswith('PASS') and g['develop_exact_css_identity']=='PASS'
          assert not g['owner_production_write'] and not g['main_write'] and not g['core_updates_write']
          assert rc['candidate_readiness_state']=='PASS' and rc['candidate_source']==g['candidate']
          r=json.load(urllib.request.urlopen('https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/runs/33518274633'))
          assert r['conclusion']=='success'
          arts=json.load(urllib.request.urlopen('https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/runs/33518274633/artifacts'))['artifacts']
          a=[x for x in arts if x['id']==9804570473][0]
          assert a['digest']=='sha256:d092acb2892308d3c481196e77c4edd0a2ed720bff3458067d6ad85acf7cdddb' and not a['expired']
          PY
          git diff --name-only "$P..$B" -- src | sort | tee "$E/runtime-delta.txt"
          test "$(tr '\n' ' ' < "$E/runtime-delta.txt")" = 'src/VERSION.txt src/app/bootstrap.php src/assets/workspace-domain-nav.css '
          printf 'P01_V2364_FORMAL_BIND=PASS\nBOUND=%s\nCANDIDATE=%s\nRUNTIME_TREE=%s\nLIVE_DEVELOP=%s\nCSS_EXACT_IDENTITY=PASS\nREADINESS_RUN=33518274633\nREADINESS_ARTIFACT=9804570473\nOWNER_PRODUCTION_WRITE=NO\n' "$B" "$C" "$RT" "$LIVE" | tee "$E/verdict.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2364-formal-bind-${{ github.run_id }}
          path: /tmp/v2364-formal-bind
          retention-days: 90
