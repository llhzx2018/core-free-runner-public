name: P01 Auth Entry Fix
on:
  push:
    branches: [temp/p01-auth-entry-fix-20260901]
    paths:
      - .github/workflows/p01-auth-entry-fix-20260901.yml
      - scripts/p01-auth-entry-fix.py
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCT_BASE: e29e5f56ad74cb98841d01764d73b680bd8913ba
      PRODUCT_BRANCH: fix/p01-auth-entry-visibility-20260901
    steps:
      - name: Checkout runner
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: runner
      - name: Checkout exact Product branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.PRODUCT_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01
      - name: Apply exact auth-entry fix
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p01 rev-parse HEAD)" = "$PRODUCT_BASE"
          P01_ROOT="$GITHUB_WORKSPACE/p01" python3 runner/scripts/p01-auth-entry-fix.py
          php -l p01/src/app/FunctionalWorkspaceShell.php >/dev/null
          node --check p01/src/assets/auth-controls.js
          git -C p01 add -N src/assets/auth-controls.js
          git -C p01 diff --check
          mapfile -t changed < <(git -C p01 diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          expected=$(printf '%s\n' src/app/FunctionalWorkspaceShell.php src/assets/auth-controls.js src/assets/workspace-rebaseline.css | sort)
          actual=$(printf '%s\n' "${changed[@]}")
          test "$actual" = "$expected"
          grep -F 'data-vf-auth-login' p01/src/app/FunctionalWorkspaceShell.php >/dev/null
          grep -F 'data-vf-auth-logout' p01/src/app/FunctionalWorkspaceShell.php >/dev/null
          grep -F "apiJson('login'" p01/src/assets/auth-controls.js >/dev/null
          grep -F "apiJson('logout'" p01/src/assets/auth-controls.js >/dev/null
          ! grep -R -E '管理员视角|公开视角|查看公开版|返回管理|public_view|preview_return' p01/src/app/FunctionalWorkspaceShell.php p01/src/assets/auth-controls.js >/dev/null
      - name: Commit Product candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p01
          test "$(git rev-parse HEAD)" = "$PRODUCT_BASE"
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add src/app/FunctionalWorkspaceShell.php src/assets/auth-controls.js src/assets/workspace-rebaseline.css
          git commit -m 'fix(P01): restore visible login and logout entries'
          git push origin HEAD:"$PRODUCT_BRANCH"
          echo "P01_AUTH_ENTRY_FIX_SOURCE=$(git rev-parse HEAD)"
          echo 'P01_AUTH_ENTRY_FIX_PREP=PASS'
