name: S01 R8 backup strict recovery real Chromium WordPress MariaDB
on:
  push:
    branches: [task/s01-r8-exact-native-20261103]
    paths:
      - '.github/workflows/s01-r8-backup-failclosed-20261103.yml'
      - 'lanes/s01-r8-backup-failclosed-20261103/**'
permissions:
  contents: read
jobs:
  backup-real-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: synthetic-root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: synthetic-wp
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - name: Checkout disposable runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: control
      - name: Checkout exact M3U8 draft candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: 326fd22662500e6f37df997df1acbaa2931d3e70
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - name: Checkout Theme integration companion
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 3305e9447f936c3e2a63a15ac1fc9b2893f188e7
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: theme
      - name: Checkout Ops integration companion
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 3f22e61339f7c76eea2c4524885819b10ee59057
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: ops
      - name: Setup isolated PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli,mbstring,intl,zip
          coverage: none
      - name: Exact-head native Node safety and 14 asset seals
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "326fd22662500e6f37df997df1acbaa2931d3e70"
          node --version
          php -l candidate/src/vf-tool-m3u8.php
          node candidate/tests/r8-backup-default-snapshot-order.node.cjs
          node candidate/tests/r8-backup-rollback-failclosed.node.cjs
          node candidate/tests/r8-v6-runtime-asset-seal.node.cjs
          node candidate/tests/r8-production-bundle-parity.node.cjs
          echo S01_R8_EXACT_HEAD_NATIVE_NODE=PASS
      - name: Create real disposable WordPress and MariaDB
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSLo /tmp/s01-r8-backup-wpcli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          WP=/tmp/s01-r8-backup-wp
          mkdir -p "$WP"
          php /tmp/s01-r8-backup-wpcli.phar core download --path="$WP" --skip-content --quiet
          php /tmp/s01-r8-backup-wpcli.phar config create --path="$WP" --dbname=wordpress --dbuser=wordpress --dbpass=synthetic-wp --dbhost=127.0.0.1:3306 --skip-check
          php /tmp/s01-r8-backup-wpcli.phar core install --path="$WP" --url=http://127.0.0.1:18882 --title=S01-R8-Disposable --admin_user=synthetic --admin_password=synthetic-only-password --admin_email=synthetic@example.invalid --skip-email
          php /tmp/s01-r8-backup-wpcli.phar config set WP_CONTENT_URL http://127.0.0.1:18882/wp-content --path="$WP"
          php /tmp/s01-r8-backup-wpcli.phar config set WP_PLUGIN_URL http://127.0.0.1:18882/wp-content/plugins --path="$WP"
          php /tmp/s01-r8-backup-wpcli.phar config set WP_SITEURL http://127.0.0.1:18882 --path="$WP"
          php /tmp/s01-r8-backup-wpcli.phar config set WP_HOME http://127.0.0.1:18882 --path="$WP"
          mkdir -p "$WP/wp-content/themes/vf-tools-theme" "$WP/wp-content/plugins/vf-tools-ops" "$WP/wp-content/plugins/vf-tools-m3u8"
          cp -a theme/src/. "$WP/wp-content/themes/vf-tools-theme/"
          cp -a ops/. "$WP/wp-content/plugins/vf-tools-ops/"
          cp -a candidate/src/. "$WP/wp-content/plugins/vf-tools-m3u8/"
          php /tmp/s01-r8-backup-wpcli.phar theme activate vf-tools-theme --path="$WP"
          php /tmp/s01-r8-backup-wpcli.phar plugin activate vf-tools-ops/vf-ops.php vf-tools-m3u8/vf-tool-m3u8.php --path="$WP"
          php /tmp/s01-r8-backup-wpcli.phar rewrite structure '/%postname%/' --path="$WP" --hard
          php /tmp/s01-r8-backup-wpcli.phar eval '$s=vf_m3u8_first_run_tool_specs()["backup-restore"]??null;if(!$s)throw new Exception("BACKUP_SPEC_MISSING");$post=wp_insert_post(["post_type"=>"page","post_status"=>"publish","post_name"=>$s["route"],"post_title"=>"Synthetic R8 Backup","post_content"=>"[".$s["shortcode"]."]"]);if(is_wp_error($post)||!$post)throw new Exception("BACKUP_PAGE_CREATE_FAILED");' --path="$WP"
          cat > "$WP/.r8-router.php" <<'PHP'
          <?php
          $path=parse_url($_SERVER['REQUEST_URI'],PHP_URL_PATH);
          if(is_string($path)&&$path!=='/'&&is_file(__DIR__.$path))return false;
          require __DIR__.'/index.php';
          PHP
          php -S 127.0.0.1:18882 -t "$WP" "$WP/.r8-router.php" >/tmp/s01-r8-backup-http.log 2>&1 &
          for i in $(seq 1 30);do if curl -fsS http://127.0.0.1:18882/m3u8-backup-restore/ >/dev/null;then break;fi;sleep 2;done
          curl -fsSI http://127.0.0.1:18882/m3u8-backup-restore/
          echo S01_R8_EXACT_HEAD_ISOLATED_WP_MARIADB=PASS
      - name: Real Chromium IndexedDB failure rollback and readback
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-audit --no-fund --prefix /tmp/s01-r8-backup-playwright playwright@1.62.1
          /tmp/s01-r8-backup-playwright/node_modules/.bin/playwright install chromium
          NODE_PATH=/tmp/s01-r8-backup-playwright/node_modules node control/lanes/s01-r8-backup-failclosed-20261103/browser.cjs
      - name: Upload bounded synthetic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-r8-backup-failclosed-${{ github.run_id }}
          path: s01-r8-backup-failclosed-browser-evidence.json
          if-no-files-found: warn
          retention-days: 7
      - name: Destroy disposable test sources and credentials
        if: always()
        shell: bash
        run: rm -rf candidate theme ops /tmp/s01-r8-backup-wp /tmp/s01-r8-backup-playwright /tmp/s01-r8-backup-wpcli.phar
