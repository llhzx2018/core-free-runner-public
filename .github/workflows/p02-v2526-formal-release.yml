name: P02 V2.5.26 Formal Release

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v2526-formal-release.yml'
      - 'scripts/p02-v2526-formal-release.sh'

permissions:
  contents: read

jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      PRODUCT_REF: fc0fcb46077209004e12e19573bc3f726c6a0614
    steps:
      - name: Require registered release capability
        run: |
          set -Eeuo pipefail
          test -n "$RELEASE_TOKEN"
          echo RELEASE_CAPABILITY=PASS

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.PRODUCT_REF }}
          token: ${{ env.RELEASE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: product

      - name: Install runtime dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php8.3-cli php8.3-sqlite3 php8.3-zip curl

      - name: Rebuild verify publish and remote-readback V2.5.26
        run: bash scripts/p02-v2526-formal-release.sh

      - name: Record protected boundaries
        if: always()
        run: |
          echo CORE_UPDATES_WRITE=NO_IN_THIS_JOB
          echo PRODUCTION_WRITE=NO
