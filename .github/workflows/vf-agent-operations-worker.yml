name: VF Agent Operations Worker

on:
  push:
    branches: [vf-agent-operations-v1]
    paths:
      - 'vf-agent/triggers/**'

permissions:
  contents: read

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve sanitized trigger
        shell: bash
        run: |
          set -euo pipefail
          trigger="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^vf-agent/triggers/.*\.json$' | head -n1)"
          test -n "$trigger"
          python - "$trigger" <<'PY' >> "$GITHUB_ENV"
          import json, sys
          data=json.load(open(sys.argv[1], encoding='utf-8'))
          print('VF_AGENT_REQUEST_ID='+str(data['request_id']))
          print('VF_AGENT_REQUEST_HASH='+str(data['request_hash']))
          PY

      - name: Fetch exact operations source
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VF_PRIVATE_READ_TOKEN:-}"
          git clone --quiet --branch operations/v1-daily-use --single-branch "https://x-access-token:${VF_PRIVATE_READ_TOKEN}@github.com/llhzx2018/core-agent.git" core-agent
          cd core-agent
          git rev-parse HEAD | tee ../operations-source-sha.txt
          test "$(cat VERSION)" = '1.0.0'
          test -z "$(git status --porcelain)"

      - name: Activate durable VF Agent request
        id: worker
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd core-agent
          PYTHONPATH=src:operations python -m vf_agent.worker \
            --request-id "$VF_AGENT_REQUEST_ID" \
            --request-hash "$VF_AGENT_REQUEST_HASH" \
            --result .evidence/vf-agent-worker-result.json

      - name: Publish machine-readable worker result
        if: always()
        env:
          WORKER_OUTCOME: ${{ steps.worker.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, urllib.error, urllib.request
          token=os.environ['VF_RELEASE_WRITE_TOKEN']
          req_id=os.environ.get('VF_AGENT_REQUEST_ID','UNKNOWN')
          result_path='core-agent/.evidence/vf-agent-worker-result.json'
          result={}
          if os.path.exists(result_path):
              result=json.load(open(result_path,encoding='utf-8'))
          payload={
              'schema':'vf-agent-worker-result-marker/v1',
              'request_id':req_id,
              'trigger_sha':os.environ['GITHUB_SHA'],
              'workflow_run_id':os.environ['GITHUB_RUN_ID'],
              'outcome':os.environ.get('WORKER_OUTCOME','unknown'),
              'source_sha':open('operations-source-sha.txt').read().strip() if os.path.exists('operations-source-sha.txt') else None,
              'result':result,
          }
          content=json.dumps(payload,ensure_ascii=False,indent=2,sort_keys=True)+'\n'
          path=f"vf-agent/results/{req_id}.json"
          api=f"https://api.github.com/repos/llhzx2018/core-free-runner-public/contents/{path}"
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28'}
          sha=None
          try:
              req=urllib.request.Request(api+'?ref=vf-agent-operations-v1',headers=headers)
              with urllib.request.urlopen(req,timeout=20) as r:
                  sha=json.load(r).get('sha')
          except urllib.error.HTTPError as e:
              if e.code != 404: raise
          body={'message':f'vf-agent: publish worker result {req_id}','content':base64.b64encode(content.encode()).decode(),'branch':'vf-agent-operations-v1'}
          if sha: body['sha']=sha
          req=urllib.request.Request(api,data=json.dumps(body).encode(),method='PUT',headers={**headers,'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=20) as r: r.read()
          PY

      - name: Upload sanitized worker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VF_AGENT_OPERATIONS_WORKER_EVIDENCE
          path: |
            core-agent/.evidence/vf-agent-worker-result.json
            operations-source-sha.txt
          if-no-files-found: warn
          retention-days: 3

      - name: Enforce worker result
        if: steps.worker.outcome != 'success'
        run: exit 1
