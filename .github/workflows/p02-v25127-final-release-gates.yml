name: P02 2.5.127 final release restore media performance proof (no publish)
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p02-v25127-final-release-gates.yml', 'harness/p02_release_25127_recovery_perf.py']
permissions:
  contents: read
jobs:
  final-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact private P02 source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-library
          ref: c0cc9412a684aa463c3cbf3a63483ea0dacb25a2
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Prepare ephemeral real PHP SQLite ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = 'c0cc9412a684aa463c3cbf3a63483ea0dacb25a2'
          test "$(cat product/VERSION)" = '2.5.127'
          if ! php -r 'exit(PHP_VERSION_ID>=80300&&extension_loaded("pdo_sqlite")&&extension_loaded("sqlite3")&&extension_loaded("zip")?0:1);'; then
            timeout 180s sudo apt-get install -y php8.3-cli php8.3-sqlite3 php8.3-zip
          fi
          php -r 'exit(PHP_VERSION_ID>=80300&&extension_loaded("pdo_sqlite")&&extension_loaded("sqlite3")&&extension_loaded("zip")?0:1);'
          python3 -m py_compile harness/p02_release_25127_recovery_perf.py
      - name: Rebuild exact previously-proven target FULL and download last stable FULL
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "${GH_TOKEN:-}"
          mkdir -p "${RUNNER_TEMP}/p02-release-old"
          gh release download v2.5.124 -R llhzx2018/vf-library -p VF_Library_V2.5.124_FULL.zip -D "${RUNNER_TEMP}/p02-release-old"
          cd product
          python3 scripts/build-release.py --out build/release-final-restore --source-version 2.5.81 --source-version 2.5.82 --source-version 2.5.102 --source-version 2.5.103 --source-version 2.5.104 --source-version 2.5.105 --source-version 2.5.111 --source-version 2.5.112 --source-version 2.5.113 --source-version 2.5.114 --source-version 2.5.115 --source-version 2.5.116 --source-version 2.5.117 --source-version 2.5.118 --source-version 2.5.119 --source-version 2.5.120 --source-version 2.5.121 --source-version 2.5.122 --source-version 2.5.124 --source-commit 'c0cc9412a684aa463c3cbf3a63483ea0dacb25a2' --source-ref main > "${RUNNER_TEMP}/p02-recovery-build.json"
          python3 - <<'PY'
          import hashlib,os
          from pathlib import Path
          old=Path(os.environ['RUNNER_TEMP'],'p02-release-old','VF_Library_V2.5.124_FULL.zip')
          target=Path('build/release-final-restore/VF_Library_V2.5.127_FULL.zip')
          assert hashlib.sha256(old.read_bytes()).hexdigest()=='c30e9a5a5d8380443f564c0e56606c13edb31da3482c1704deecdcf9c1ff7a56'
          assert hashlib.sha256(target.read_bytes()).hexdigest()=='bd90624278e570d4b01013f84dffce31367c601eaf785051d12db9d3dbf4d596'
          print('P02_FORMAL_FINAL_TEST_REAL_OFFICIAL_AND_DRAFT_BYTES=PASS')
          PY
      - name: Actual clean installs, 2.5.124-vs-2.5.127 search latency, SQLite backup inspect restore media and injected rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 harness/p02_release_25127_recovery_perf.py             "${RUNNER_TEMP}/p02-release-old/VF_Library_V2.5.124_FULL.zip"             product/build/release-final-restore/VF_Library_V2.5.127_FULL.zip
      - name: Public read-only production identity probe (not authenticated)
        shell: bash
        run: |
          set -Eeuo pipefail
          file="${RUNNER_TEMP}/p02-public-version.txt"
          if curl --max-time 12 --connect-timeout 5 --retry 0 -fsSL --proto '=https' https://lib.kewaro.com/VERSION.txt -o "$file" 2>/dev/null; then
            if grep -Eq '^2\.5\.[0-9]+$' "$file"; then
              v="$(head -n1 "$file" | tr -d '\r\n')"
              echo "P02_PRODUCTION_UNAUTHENTICATED_VERSION_READBACK=$v"
              echo P02_PRODUCTION_AUTHENTICATED_READBACK=NOT_PROVEN
            else
              echo P02_PRODUCTION_PUBLIC_VERSION_NOT_AVAILABLE
            fi
          else
            echo P02_PRODUCTION_PUBLIC_VERSION_NOT_AVAILABLE
          fi
          echo P02_PRODUCTION_WRITE=NO
      - name: Purge private source, prior release and generated synthetic data
        shell: bash
        if: always()
        run: |
          rm -rf product "${RUNNER_TEMP}/p02-release-old"
          echo PRIVATE_SOURCE_OR_SYNTHETIC_DATABASE_PERSISTED_PUBLIC=NO
