name: P07 RC5 精确候选终检

on:
  push:
    branches:
      - experiment/p07-oneshot-bench-v05
    paths:
      - .github/workflows/p07-rc5-exact-gate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b1eb8c84eed46e8558d0be963bb9718a73c14ca4
      - name: 精确身份与字节 Gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "b1eb8c84eed46e8558d0be963bb9718a73c14ca4"
          echo '35e1e6fce1d3994fb48be62596ba9d229de8d53baaaad77ee1691f18adf779da  experiments/p07-bench.sh' | sha256sum -c -
          grep -Fq 'VERSION="1.0.0-rc5-zh"' experiments/p07-bench.sh
          bash -n experiments/p07-bench.sh
          experiments/p07-bench.sh --self-test
      - name: 中文排版与语义终检
        shell: bash
        run: |
          set -euo pipefail
          out="$(NO_COLOR=1 P07_BENCH_FORCE_FALLBACK=1 experiments/p07-bench.sh --demo)"
          printf '%s\n' "$out"
          grep -q '马来西亚 吉隆坡' <<<"$out"
          grep -q '泰国 曼谷' <<<"$out"
          grep -q '验机结论' <<<"$out"
          grep -q '中国大陆直连       : 未直接检测' <<<"$out"
          ! grep -q '中国大陆访问评估' <<<"$out"
          ! grep -q '中国联通' <<<"$out"
          ! grep -q '中国电信' <<<"$out"
          python3 - <<'PY'
          import os,subprocess,re,unicodedata
          env=dict(os.environ,NO_COLOR='1',P07_BENCH_FORCE_FALLBACK='1')
          out=subprocess.check_output(['bash','experiments/p07-bench.sh','--demo'],env=env,text=True)
          rows=[]
          keys=['美国西部','美国东部','欧洲','中国香港','新加坡','马来西亚 吉隆坡','泰国 曼谷','日本 东京','Cloudflare 边缘基准']
          for line in out.splitlines():
              if any(k in line for k in keys):
                  m=re.search(r'\d+(?:\.\d+)? Mbps',line)
                  if m:
                      width=lambda s: sum(2 if unicodedata.east_asian_width(c) in 'WF' else 1 for c in s)
                      rows.append(width(line[:m.start()]))
          assert len(rows) >= 8, rows
          assert len(set(rows)) == 1, rows
          print('RC5_EXACT_CJK_COLUMNS=', sorted(set(rows)))
          PY
