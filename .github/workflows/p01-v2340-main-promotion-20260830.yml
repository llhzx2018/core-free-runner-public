name: P01 V2.34 Main Promotion
on:
  push:
    branches: [task/p01-v2340-formal-release-20260830]
    paths: [.github/workflows/p01-v2340-main-promotion-20260830.yml]
permissions:
  contents: read
jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify exact gates and concurrent truth
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          FORMAL_GATE=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/runs/33315452296)
          test "$(jq -r .status <<<"$FORMAL_GATE")" = completed
          test "$(jq -r .conclusion <<<"$FORMAL_GATE")" = success
          test "$(jq -r .head_sha <<<"$FORMAL_GATE")" = 6b354358ddf96ba988128402d4c881a71c5835bd
          FRESH_GATE=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/runs/33315524945)
          test "$(jq -r .status <<<"$FRESH_GATE")" = completed
          test "$(jq -r .conclusion <<<"$FRESH_GATE")" = success
          test "$(jq -r .head_sha <<<"$FRESH_GATE")" = 46e8b96475c658ac3552eb7d574858023c8331a9
          rm -rf product
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/vf-start.git" product
          git -C product fetch -q origin main develop release/p01-v2.34.0-formal-20260830 --tags
          MAIN=$(git -C product rev-parse origin/main)
          DEVELOP=$(git -C product rev-parse origin/develop)
          FORMAL=$(git -C product rev-parse origin/release/p01-v2.34.0-formal-20260830)
          test "$MAIN" = 2733f9687a9f72d740b6289d938a9f0e01e62e4f
          test "$DEVELOP" = 25dd705582a6f2c0c06a3f52c32c780c2268b5fa
          test "$FORMAL" = 518d10f446ea85445d1110a3defafc5bcbece473
          test "$(git -C product rev-parse "$FORMAL^{tree}")" = 90ffab51a20640a4e3f6f07122a8e6e147592f64
          test "$(git -C product rev-parse "$FORMAL:src")" = f3eeb66fbce3949ef50483ac4c5a821edbd15d35
          test "$(git -C product merge-base "$MAIN" "$FORMAL")" = "$MAIN"
          test "$(git -C product merge-base "$DEVELOP" "$FORMAL")" = "$DEVELOP"
          ! git -C product show-ref --verify --quiet refs/tags/v2.34.0
          test "$(git -C product show "$FORMAL:VERSION" | tr -d '\r\n')" = 2.34.0
          test "$(git -C product show "$FORMAL:src/VERSION.txt" | tr -d '\r\n')" = 2.34.0
          git -C product show "$FORMAL:src/app/bootstrap.php" | grep -F "define('VF_VERSION', '2.34.0')" >/dev/null
          echo P01_V2340_FORMAL_GATE_33315452296=PASS
          echo P01_V2340_STRICT_FRESH_GATE_33315524945=PASS
          echo P01_V2340_PROMOTION_PRECHECK=PASS
      - name: Promote exact formal source to develop and main
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/vf-start.git"
          git -C product push "$REMOTE" 518d10f446ea85445d1110a3defafc5bcbece473:refs/heads/develop
          git -C product push "$REMOTE" 518d10f446ea85445d1110a3defafc5bcbece473:refs/heads/main
          git -C product fetch -q origin main develop
          test "$(git -C product rev-parse origin/main)" = 518d10f446ea85445d1110a3defafc5bcbece473
          test "$(git -C product rev-parse origin/develop)" = 518d10f446ea85445d1110a3defafc5bcbece473
          test "$(git -C product rev-parse origin/main^{tree})" = 90ffab51a20640a4e3f6f07122a8e6e147592f64
          test "$(git -C product rev-parse origin/main:src)" = f3eeb66fbce3949ef50483ac4c5a821edbd15d35
          echo P01_V2340_MAIN_PROMOTION=PASS
          echo P01_V2340_DEVELOP_SYNC=PASS
          echo TAG_CREATED=NO
          echo RELEASE_PUBLISHED=NO
          echo OWNER_PRODUCTION_WRITE=NO
