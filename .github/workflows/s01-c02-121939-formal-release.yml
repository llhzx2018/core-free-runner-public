name: S01-C02 1.21.939 Formal Release

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/s01-c02-121939-formal-release.yml'

permissions:
  contents: read

jobs:
  formal-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_REPOSITORY: llhzx2018/vf-tools-ops
      TARGET_SHA: 9e15e5ad0ebb127b146b50731eeeaaf726f895e5
      TARGET_VERSION: 1.21.939
      RELEASE_TAG: v1.21.939
      ASSET_NAME: vf-tools-ops_V1.21.939.zip
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}

    steps:
      - name: Verify credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN"
          test -n "$RELEASE_WRITE_TOKEN"
          echo "RELEASE_CREDENTIALS=PASS"

      - name: Checkout exact product main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target

      - name: Verify exact product source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n' < target/VERSION)" = "$TARGET_VERSION"
          grep -Fq "Version: $TARGET_VERSION" target/vf-ops.php
          grep -Fq "VF_OPS_VERSION', '$TARGET_VERSION'" target/vf-ops.php
          echo "EXACT_RELEASE_SOURCE=PASS"

      - name: Full PHP syntax gate
        shell: bash
        run: |
          set -Eeuo pipefail
          find target -type f -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 php -l > php-lint.log
          echo "PHP_FILES_LINTED=$(wc -l < php-lint.log | tr -d ' ')"
          echo "PHP_LINT=PASS"

      - name: Product-consolidation contract gate
        shell: bash
        run: |
          set -Eeuo pipefail
          php target/tests/s01-c02-121932-navigation-role-r43-contract.php
          php target/tests/s01-c02-121933-navigation-flyout-r44-contract.php
          php target/tests/s01-c02-121934-shell-header-visual-lock-r45-contract.php
          php target/tests/s01-c02-121935-product-surface-r46-contract.php
          php target/tests/s01-c02-121935-surface-capability-r47-contract.php
          php target/tests/s01-c02-121936-physical-surface-r48-contract.php
          php target/tests/s01-c02-121937-survivor-product-r49-contract.php
          php target/tests/s01-c02-121938-survivor-audit-truth-r50-contract.php
          php target/tests/s01-c02-121939-component-drilldown-r51-contract.php
          node --check target/assets/js/admin-s01-domain-shell-r1.js
          echo "R43_R51_PRODUCT_CONTRACTS=PASS"
          echo "JS_SYNTAX=PASS"

      - name: Build deterministic runtime-only package
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib, os, re, stat, zipfile
          from pathlib import Path

          root=Path("target")
          out=Path(os.environ["ASSET_NAME"])
          forbidden_dir=re.compile(r'(^|/)(?:\.git|\.github|tests?|docs?|evidence|private|tmp|temp|cache|logs?)(/|$)',re.I)
          forbidden_ext=re.compile(r'\.(?:sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',re.I)
          allowed_root={"vf-ops.php","uninstall.php"}
          allowed_prefix=("includes/","assets/","languages/","config/")

          files={}
          for p in root.rglob("*"):
              if not p.is_file():
                  continue
              rel=p.relative_to(root).as_posix()
              if forbidden_dir.search(rel) or forbidden_ext.search(rel):
                  continue
              if "/" not in rel and rel not in allowed_root:
                  continue
              if "/" in rel and not rel.startswith(allowed_prefix):
                  continue
              if p.is_symlink():
                  raise SystemExit("RUNTIME_SYMLINK_FORBIDDEN:"+rel)
              files[rel]=hashlib.sha256(p.read_bytes()).hexdigest()

          if "vf-ops.php" not in files:
              raise SystemExit("PLUGIN_MAIN_MISSING")

          canonical=b"".join(rel.encode()+b"\0"+files[rel].encode()+b"\n" for rel in sorted(files))
          runtime_fp=hashlib.sha256(canonical).hexdigest()

          with zipfile.ZipFile(out,"w",compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for rel in sorted(files):
                  data=(root/rel).read_bytes()
                  zi=zipfile.ZipInfo("vf-ops/"+rel,date_time=(1980,1,1,0,0,0))
                  zi.compress_type=zipfile.ZIP_DEFLATED
                  zi.external_attr=(stat.S_IFREG|0o644)<<16
                  z.writestr(zi,data)

          asset_sha=hashlib.sha256(out.read_bytes()).hexdigest()
          asset_bytes=out.stat().st_size

          Path("runtime-count.txt").write_text(str(len(files)))
          Path("runtime-fingerprint.txt").write_text(runtime_fp)
          Path("asset-sha.txt").write_text(asset_sha)
          Path("asset-bytes.txt").write_text(str(asset_bytes))

          print("PACKAGE_BUILD=PASS")
          print("RUNTIME_FILE_COUNT="+str(len(files)))
          print("RUNTIME_FINGERPRINT_SHA256="+runtime_fp)
          print("ASSET_BYTES="+str(asset_bytes))
          print("ASSET_SHA256="+asset_sha)
          PY

      - name: Create formal release
        shell: bash
        env:
          GH_TOKEN: ${{ env.RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail

          if gh api "repos/$TARGET_REPOSITORY/releases/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "RELEASE_CREATE=SKIPPED_ALREADY_EXISTS"
          else
            cat > release-notes.md <<'MD'
          S01-C02 · VF Tools Ops · V1.21.939

          Product Surface Consolidation R46-R51:
          - formal OWNER Routes reduced from 26 to 13
          - standalone Tools Workbench retained, OWNER Surface denominator = 14
          - absorbed content/SEO/quality/publish capabilities moved to page-local advanced capability partials
          - retired Ads OWNER surface removed; old URLs safely resolve to successor
          - product IA/audit truth aligned to the 14-survivor model
          - survivor product pages renamed and tightened into owner-facing workspaces
          - component status rows now expose generic owning-component manage_url drill-down
          - no duplicate component updater or parallel canonical component state introduced
          - Schema/Data/Permission/Updater ownership remains unchanged

          Exact source:
          9e15e5ad0ebb127b146b50731eeeaaf726f895e5
          MD

            gh release create "$RELEASE_TAG" "$ASSET_NAME"               --repo "$TARGET_REPOSITORY"               --target "$TARGET_SHA"               --title "VF Tools Ops V1.21.939"               --notes-file release-notes.md

            echo "RELEASE_CREATE=PASS"
          fi

      - name: Remote release readback
        shell: bash
        env:
          GH_TOKEN: ${{ env.RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail

          EXPECTED_SHA="$(cat asset-sha.txt)"
          EXPECTED_BYTES="$(cat asset-bytes.txt)"

          gh api "repos/$TARGET_REPOSITORY/releases/tags/$RELEASE_TAG" > release.json

          RELEASE_ID="$(jq -r '.id' release.json)"
          ASSET_ID="$(jq -r --arg n "$ASSET_NAME" '.assets[] | select(.name==$n) | .id' release.json)"
          ASSET_SIZE="$(jq -r --arg n "$ASSET_NAME" '.assets[] | select(.name==$n) | .size' release.json)"
          ASSET_DIGEST="$(jq -r --arg n "$ASSET_NAME" '.assets[] | select(.name==$n) | (.digest // "")' release.json)"
          PUBLISHED_AT="$(jq -r '.published_at' release.json)"
          TAG_SHA="$(gh api "repos/$TARGET_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"

          test "$TAG_SHA" = "$TARGET_SHA"
          test "$ASSET_SIZE" = "$EXPECTED_BYTES"

          if [ -n "$ASSET_DIGEST" ] && [ "$ASSET_DIGEST" != "null" ]; then
            test "$ASSET_DIGEST" = "sha256:$EXPECTED_SHA"
          fi

          rm -rf readback && mkdir readback
          gh release download "$RELEASE_TAG" --repo "$TARGET_REPOSITORY" --pattern "$ASSET_NAME" --dir readback --clobber

          READBACK_SHA="$(sha256sum "readback/$ASSET_NAME" | awk '{print $1}')"
          READBACK_BYTES="$(stat -c %s "readback/$ASSET_NAME")"

          test "$READBACK_SHA" = "$EXPECTED_SHA"
          test "$READBACK_BYTES" = "$EXPECTED_BYTES"

          printf '%s\n' "$RELEASE_ID" > release-id.txt
          printf '%s\n' "$ASSET_ID" > asset-id.txt
          printf '%s\n' "$PUBLISHED_AT" > published-at.txt

          echo "FORMAL_RELEASE_REMOTE_READBACK=PASS"
          echo "RELEASE_ID=$RELEASE_ID"
          echo "ASSET_ID=$ASSET_ID"
          echo "ASSET_BYTES=$READBACK_BYTES"
          echo "ASSET_SHA256=$READBACK_SHA"
          echo "PUBLISHED_AT=$PUBLISHED_AT"

      - name: Build sanitized release evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          p={
            "schema":"vf-release/s01-c02-formal-v3",
            "version":os.environ["TARGET_VERSION"],
            "tag":os.environ["RELEASE_TAG"],
            "target_sha":os.environ["TARGET_SHA"],
            "release_id":Path("release-id.txt").read_text().strip(),
            "asset_id":Path("asset-id.txt").read_text().strip(),
            "asset_name":os.environ["ASSET_NAME"],
            "asset_bytes":int(Path("asset-bytes.txt").read_text()),
            "asset_sha256":Path("asset-sha.txt").read_text().strip(),
            "runtime_file_count":int(Path("runtime-count.txt").read_text()),
            "runtime_fingerprint_sha256":Path("runtime-fingerprint.txt").read_text().strip(),
            "schema_from":"6.0.0",
            "schema_to":"6.0.0",
            "backup_required":True,
            "rollback_supported":True,
            "owner_direct_release_authorization":True,
            "production_update_authorized":True,
            "remote_readback_pass":True,
            "published_at":Path("published-at.txt").read_text().strip(),
            "private_source_persisted":False,
            "secret_values_persisted":False
          }

          raw=json.dumps(p,sort_keys=True).encode()
          p["evidence_sha256"]=hashlib.sha256(raw).hexdigest()

          Path("evidence").mkdir(exist_ok=True)
          Path("evidence/s01-c02-121939-formal-release.json").write_text(
              json.dumps(p,indent=2,sort_keys=True),encoding="utf-8"
          )
          print("FORMAL_RELEASE_EVIDENCE_SHA256="+p["evidence_sha256"])
          PY

      - name: Remove private product bytes
        if: always()
        shell: bash
        run: |
          rm -rf target readback "$ASSET_NAME"
          echo "PRIVATE_PRODUCT_BYTES_REMOVED=PASS"

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-121939-formal-release-${{ github.run_id }}
          path: evidence/s01-c02-121939-formal-release.json
          if-no-files-found: error
          retention-days: 14
