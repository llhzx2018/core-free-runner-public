name: TEMP S01-C02 Ops 1.21.849 Core Updates Gate

on:
  push:
    branches:
      - temp/s01-c02-v121849-core-updates-gate-20260906
    paths:
      - '.github/workflows/temp-s01-c02-v121849-core-updates-gate.yml'

permissions:
  contents: read

env:
  CORE_BASE: 96b48ef7020442a35fe35832c1f12347f11c99cf
  CORE_CANDIDATE: 37b12e9163b0c0cb5aa5ba4e5e90223bf7fcc75f
  OPS_COMMIT: ca87ee6a6dd1139dab6fe33f20b64d537b1a2b20
  OPS_TREE: 9ecefb081daf8a8563746601522678d8f93e67f8
  RELEASE_ID: '383563398'
  ASSET_ID: '547126901'
  ASSET_BYTES: '3325881'
  ASSET_SHA256: d4feb6bac88022a0abfc7fccf17471bdbedaa518e45821b8436ad17b514d2b67
  RUNTIME_FILES: '930'
  RUNTIME_FINGERPRINT: 02bc476b22d8664d4387c271cf354fc548d705468f2e0f6181177c16d6392372

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact core-updates base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CORE_BASE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: base

      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CORE_CANDIDATE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: candidate

      - name: Verify exact bounded manifest delta
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C base rev-parse HEAD)" = "$CORE_BASE"
          test "$(git -C candidate rev-parse HEAD)" = "$CORE_CANDIDATE"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          def files(root):
              out={}
              for p in Path(root).rglob('*'):
                  if p.is_file() and '.git' not in p.parts:
                      rel=p.relative_to(root).as_posix()
                      out[rel]=hashlib.sha256(p.read_bytes()).hexdigest()
              return out
          a,b=files('base'),files('candidate')
          changed=sorted(k for k in set(a)|set(b) if a.get(k)!=b.get(k))
          print('CHANGED_FILES=',changed)
          assert changed==['projects/S01-C02.json'], changed
          PY
          echo CORE_UPDATES_BOUNDED_DIFF=PASS

      - name: Verify manifest contract
        shell: bash
        run: |
          set -Eeuo pipefail
          f=candidate/projects/S01-C02.json
          jq -e . "$f" >/dev/null
          test "$(jq -r '.target_version' "$f")" = 1.21.849
          test "$(jq -r '.from_versions | join(",")' "$f")" = 1.21.848
          test "$(jq -r '.release_tag' "$f")" = v1.21.849
          test "$(jq -r '.asset_name' "$f")" = vf-tools-ops_V1.21.849.zip
          test "$(jq -r '.asset_bytes' "$f")" = "$ASSET_BYTES"
          test "$(jq -r '.asset_sha256' "$f")" = "$ASSET_SHA256"
          test "$(jq -r '.runtime_files' "$f")" = "$RUNTIME_FILES"
          test "$(jq -r '.runtime_fingerprint' "$f")" = "$RUNTIME_FINGERPRINT"
          test "$(jq -r '.runtime_fingerprint_sha256' "$f")" = "$RUNTIME_FINGERPRINT"
          jq -r '.notes' "$f" | grep -Fq 'Production WordPress Upgrade is NOT EXECUTED'
          jq -r '.notes' "$f" | grep -Fq 'Cloudflare Preview, Production promotion, DNS and finalOnlinePass remain NOT_RUN/NO'
          jq -r '.notes' "$f" | grep -Fq 'Static Source remains reusable and must not be re-uploaded'
          echo MANIFEST_CONTRACT=PASS

      - name: Verify formal release metadata and exact source
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          rel="$(curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.849)"
          test "$(jq -r '.id' <<<"$rel")" = "$RELEASE_ID"
          test "$(jq -r '.tag_name' <<<"$rel")" = v1.21.849
          test "$(jq -r '.draft' <<<"$rel")" = false
          test "$(jq -r '.prerelease' <<<"$rel")" = false
          asset="$(jq -c '.assets[] | select(.id == 547126901)' <<<"$rel")"
          test -n "$asset"
          test "$(jq -r '.name' <<<"$asset")" = vf-tools-ops_V1.21.849.zip
          test "$(jq -r '.size' <<<"$asset")" = "$ASSET_BYTES"
          test "$(jq -r '.digest' <<<"$asset")" = "sha256:$ASSET_SHA256"
          main="$(curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/vf-tools-ops/branches/main)"
          test "$(jq -r '.commit.sha' <<<"$main")" = "$OPS_COMMIT"
          commit="$(curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/vf-tools-ops/git/commits/$OPS_COMMIT)"
          test "$(jq -r '.tree.sha' <<<"$commit")" = "$OPS_TREE"
          echo RELEASE_METADATA=PASS

      - name: Download and verify exact release asset
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/octet-stream' \
            "https://api.github.com/repos/llhzx2018/vf-tools-ops/releases/assets/$ASSET_ID" -o /tmp/v849.zip
          test "$(stat -c %s /tmp/v849.zip)" = "$ASSET_BYTES"
          test "$(sha256sum /tmp/v849.zip | awk '{print $1}')" = "$ASSET_SHA256"
          unzip -tq /tmp/v849.zip >/dev/null
          unzip -p /tmp/v849.zip vf-ops/vf-ops.php | grep -Fq 'Version: 1.21.849'
          unzip -p /tmp/v849.zip vf-ops/vf-ops.php | grep -Fq "VF_OPS_VERSION', '1.21.849'"
          echo EXACT_RELEASE_ASSET=PASS
          echo PASS_V121849_CORE_UPDATES_GATE
