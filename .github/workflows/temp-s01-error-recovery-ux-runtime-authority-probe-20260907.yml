name: S01 Error Recovery UX Runtime Authority Probe
on:
  push:
    branches: [temp/s01-error-recovery-ux-code-gate-20260907]
    paths: [.github/workflows/temp-s01-error-recovery-ux-runtime-authority-probe-20260907.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Compute authorities from delivered release assets
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo 'MAIN_WRITE_USED=NO RELEASE_WRITE_USED=NO DISTRIBUTION_WRITE_USED=NO PRODUCTION_WRITE_USED=NO MIGRATION_USED=NO'
          export GH_TOKEN="$READ_TOKEN"
          mkdir -p /tmp/c02 /tmp/c03
          gh release download v1.21.858 --repo llhzx2018/vf-tools-ops --pattern vf-tools-ops_V1.21.858.zip --dir /tmp/c02
          gh release download v1.25.29 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.29.zip --dir /tmp/c03
          test "$(stat -c %s /tmp/c02/vf-tools-ops_V1.21.858.zip)" = '3340234'
          test "$(sha256sum /tmp/c02/vf-tools-ops_V1.21.858.zip | awk '{print $1}')" = '9a5000a0494e677e11c49edb415804566c54bbbca2d6c3442e4775121b73238a'
          test "$(stat -c %s /tmp/c03/vf-tools-m3u8_V1.25.29.zip)" = '3580803'
          test "$(sha256sum /tmp/c03/vf-tools-m3u8_V1.25.29.zip | awk '{print $1}')" = 'faa5137db1c3afdae9a23ed14365ad6af0497ae2281b1f555d967534876a1890'
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re,zipfile

          ops_zip=Path('/tmp/c02/vf-tools-ops_V1.21.858.zip')
          with zipfile.ZipFile(ops_zip) as z:
              assert z.testzip() is None
              rows=[]
              for n in z.namelist():
                  if n.endswith('/') or not n.startswith('vf-ops/'): continue
                  rel=n[len('vf-ops/'):]
                  parts=rel.split('/')
                  if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in parts): continue
                  if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',rel,re.I): continue
                  ok=(rel in {'vf-ops.php','uninstall.php'}) if '/' not in rel else parts[0] in {'includes','assets','languages','config'}
                  if ok: rows.append((rel,z.read(n)))
              rows.sort(); h=hashlib.sha256()
              for rel,b in rows: h.update((rel+'\0'+hashlib.sha256(b).hexdigest()+'\n').encode())
              print('C02_RUNTIME_FILES='+str(len(rows)))
              print('C02_RUNTIME_FP='+h.hexdigest())
              assert b'Version: 1.21.858' in z.read('vf-ops/vf-ops.php')

          m_zip=Path('/tmp/c03/vf-tools-m3u8_V1.25.29.zip')
          with zipfile.ZipFile(m_zip) as z:
              assert z.testzip() is None
              rows=[]
              for n in sorted(z.namelist()):
                  if n.endswith('/') or not n.startswith('vf-tool-m3u8/'): continue
                  rel=n[len('vf-tool-m3u8/'):]
                  parts=rel.split('/'); low=[x.lower() for x in parts]; bn=parts[-1].lower()
                  if any(x in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in low): continue
                  if bn in {'readme.md','changelog.md','license','license.txt','package_profile.json'} or bn.endswith(('.sql','.sqlite','.sqlite3','.db','.log','.zip','.tar','.gz','.bak','.tmp')): continue
                  ok=(rel in {'vf-tool-m3u8.php','uninstall.php','plugin-manifest.json','tool-settings.schema.json'}) if len(parts)==1 else parts[0] in {'admin','config','includes','public','templates','tools'}
                  if ok: rows.append((rel,z.read(n)))
              rows.sort(); h=hashlib.sha256()
              for rel,b in rows: h.update((rel+'\0'+hashlib.sha256(b).hexdigest()+'\n').encode())
              print('C03_RUNTIME_FILES='+str(len(rows)))
              print('C03_RUNTIME_FP='+h.hexdigest())
              d=z.read('vf-tool-m3u8/vf-tool-m3u8.php')
              assert b'Version: 1.25.29' in d and b'R253_S01_ERROR_RECOVERY_UX_CLOSURE' in d
          PY
          echo 'PASS_S01_ERROR_RECOVERY_UX_RUNTIME_AUTHORITY_PROBE'
