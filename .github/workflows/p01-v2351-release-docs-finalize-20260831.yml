name: P01 V2.35.1 Release Docs Finalize
on:
  push:
    branches: [release/p01-v2350-orchestrator-20260831]
    paths: [.github/workflows/p01-v2351-release-docs-finalize-20260831.yml]
permissions:
  contents: read
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE: b48b1071b5b56d37d35e97b61e13d055a3d2c852
      DOCS_HEAD: 19fae961c9bf48b920c2c688ffbb2f699c747c75
      BRANCH: release/v2.35.1-docs-closure-20260831
      RUNTIME_TREE: 3cdfa02d8c19ae5e771b7d4abff69a670ac4396c
      EVID: /tmp/p01-v2351-docs-finalize-evidence
    steps:
      - name: Release truth and concurrent refs fence
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVID"
          test "$(gh api repos/llhzx2018/vf-start/branches/main --jq .commit.sha)" = "$BASE"
          test "$(gh api repos/llhzx2018/vf-start/branches/develop --jq .commit.sha)" = "$BASE"
          test "$(gh api repos/llhzx2018/vf-start/branches/$BRANCH --jq .commit.sha)" = "$DOCS_HEAD"
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.35.1 --jq .object.sha)" = eb36fd19d269aed4ef4246c2c18f172b2c761bde
          test "$(gh api repos/llhzx2018/vf-start/releases/tags/v2.35.1 --jq .id)" = 379424818
          test "$(gh api repos/llhzx2018/core-updates/branches/main --jq .commit.sha)" = a7a601e0880becb78c9835648d06dcda2625b2dc
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33342341412 --jq .conclusion)" = success
          echo P01_V2351_DOCS_FINALIZE_TRUTH_FENCE=PASS | tee "$EVID/truth-fence.txt"
      - name: Checkout exact P01 docs closure head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: 19fae961c9bf48b920c2c688ffbb2f699c747c75
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Verify three-document pre-finalize boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$DOCS_HEAD"
          test "$(git -C product rev-parse HEAD:src)" = "$RUNTIME_TREE"
          test "$(git -C product show HEAD:VERSION | tr -d '\r\n')" = 2.35.1
          mapfile -t changed < <(git -C product diff --name-only "$BASE"...HEAD | sort)
          expected=(docs/authority/CURRENT.md docs/evidence/P01_V2.35.1_RELEASE_CLOSURE_20260831.md docs/handoff/CURRENT_STATE.md)
          test "${#changed[@]}" = "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done
          test -z "$(git -C product diff --name-only "$BASE"...HEAD -- src VERSION)"
          echo P01_V2351_THREE_DOC_PREBOUNDARY=PASS | tee "$EVID/preboundary.txt"
      - name: Update VF_PROJECT release truth
        shell: bash
        run: |
          set -Eeuo pipefail
          jq '
            .status = "V2.35.0 OWNER PRODUCTION / V2.35.1 RELEASED / REMOTE UPDATE VERIFIED / OWNER UPGRADE PENDING" |
            .production_version = "2.35.0" |
            .working_version = "2.35.1" |
            .target_release_version = "2.35.1" |
            .current_phase = "V2.35.1 FORMAL RELEASE PUBLISHED / OWNER PRODUCTION UPGRADE PENDING" |
            .published_release = {
              version:"2.35.1", tag:"v2.35.1", release_id:379424818,
              release_source:"eb36fd19d269aed4ef4246c2c18f172b2c761bde",
              release_tree:"00aca451804db5ebf9260d8101dfe829789c4f24",
              runtime_tree:"3cdfa02d8c19ae5e771b7d4abff69a670ac4396c",
              schema_version:"2026082901",
              candidate_readiness_gate:33339734236,
              formal_artifact_gate:33340105433,
              formal_artifact_id:9740268918,
              formal_artifact_sha256:"a51e413ada654307256bde4995dfea543c383e1b0e5989b0b9845db333a33ab0",
              strict_fresh_install_gate:33340185389,
              strict_fresh_artifact:9740302635,
              strict_fresh_artifact_sha256:"82abd013409b4fe7246c870118443f55a0fdd97792592fa7cb4655f878239070",
              main_promotion_gate:33340313941,
              publication_gate:33340348260,
              core_updates_commit:"a7a601e0880becb78c9835648d06dcda2625b2dc",
              core_updates_manifest_gate:33342185241,
              core_updates_manifest_artifact:9740879321,
              core_updates_manifest_artifact_sha256:"d7537596654e55aecf861acdc63d80366d44fd02ac7960e514302e92891703fc",
              core_updates_promotion_gate:33342219852,
              online_asset:"VF_Start_V2.35.1_UPDATE.zip",
              online_asset_bytes:1376805,
              online_asset_sha256:"e6e40b77d75319f24ea4e0e803863a1b5ffffcdf2f3405d62dc9399cbc7114af",
              full_asset:"VF-Start-V2.35.1-FULL.zip",
              full_asset_bytes:638265,
              full_asset_sha256:"7e6798dda14bbed004ae55c7679a2a6b6f6550b332ca9fdbf0c5d20984598e2a",
              remote_online_update_gate:33342341412,
              remote_online_update_artifact:9740926661,
              remote_online_update_artifact_sha256:"2f39e7e9a3df7efd34fdd1c9716bf490915adfbd74001ba800436931d2fbb146",
              remote_online_update:"2.35.0 -> 2.35.1 / PASS / ISOLATED OWNER-LIKE RUNTIME",
              owner_production_upgrade:"PENDING / Owner Production remains 2.35.0",
              assistant_production_write:false
            } |
            .current_change = {
              change_id:"P01-V2351-FORMAL-RELEASE-CLOSURE-20260831",
              base:"V2.35.0 OWNER PRODUCTION / V2.35.0 PUBLISHED",
              result:"V2.35.1 PUBLISHED / REMOTE ONLINE UPDATE VERIFIED / OWNER UPGRADE PENDING",
              released_version:"2.35.1",
              version_bytes:"2.35.1",
              schema_change:false,
              migration:null,
              post_release_prs:[122,123,124,128],
              final_visual_sweep:{run:33338822193,result:"PASS"},
              candidate_readiness:{run:33339734236,result:"PASS"},
              formal_artifact:{run:33340105433,artifact_id:9740268918,result:"PASS"},
              strict_fresh:{run:33340185389,artifact_id:9740302635,result:"PASS"},
              publication:{run:33340348260,release_id:379424818,result:"PASS"},
              core_updates:{commit:"a7a601e0880becb78c9835648d06dcda2625b2dc",manifest_gate:33342185241,promotion_gate:33342219852,result:"PASS"},
              remote_online_update:{run:33342341412,artifact_id:9740926661,result:"PASS"},
              owner_production_runtime:"2.35.0",
              owner_production_upgrade:"PENDING",
              assistant_production_write:false
            } |
            .authority.current_candidate_evidence = "docs/evidence/P01_V2.35.1_CANDIDATE_READINESS_20260831.md" |
            .authority.current_formal_release_evidence = "docs/evidence/P01_V2.35.1_RELEASE_CLOSURE_20260831.md" |
            .authority.current_develop_evidence = "docs/evidence/P01_V2.35.1_RELEASE_CLOSURE_20260831.md" |
            .candidate_version = "2.35.1" |
            .candidate_schema_version = "2026082901" |
            .candidate_state = "CLOSED / PUBLISHED AS V2.35.1" |
            .formal_release_state = "V2.35.1 PUBLISHED / REMOTE ONLINE UPDATE VERIFIED / OWNER PRODUCTION UPGRADE PENDING" |
            .develop_state = "SYNCED WITH MAIN / V2.35.1 RELEASE BYTES / NO NEW PRODUCT BATCH" |
            .current_authority = "Owner Production V2.35.0 / Published Latest V2.35.1 / Public Update Verified / Owner Upgrade Pending" |
            .next_action = "Owner performs the real V2.35.0 -> V2.35.1 online upgrade. After real runtime/UI readback, close V2.35.1 Owner Production. Assistant must not write Production." |
            .v2_35_1_tag_state = "PUBLISHED / IMMUTABLE" |
            .core_updates_v2_35_1_state = "PUBLISHED / REMOTE ONLINE UPDATE VERIFIED / OWNER PRODUCTION UPGRADE PENDING"
          ' product/VF_PROJECT.json > product/VF_PROJECT.json.tmp
          mv product/VF_PROJECT.json.tmp product/VF_PROJECT.json
          jq -e '(.published_release.version=="2.35.1" and .production_version=="2.35.0" and .published_release.release_id==379424818 and .published_release.remote_online_update_gate==33342341412 and (.formal_release_state|contains("OWNER PRODUCTION UPGRADE PENDING")))' product/VF_PROJECT.json >/dev/null
          git -C product diff --check
      - name: Commit VF_PROJECT and verify exact four-file closure
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C product config user.name VictorForge
          git -C product config user.email llhzx2018@gmail.com
          git -C product add VF_PROJECT.json
          git -C product commit -m 'docs(P01): close V2.35.1 formal release truth'
          FINAL=$(git -C product rev-parse HEAD)
          test "$(git -C product rev-parse HEAD:src)" = "$RUNTIME_TREE"
          test "$(git -C product show HEAD:VERSION | tr -d '\r\n')" = 2.35.1
          mapfile -t changed < <(git -C product diff --name-only "$BASE"...HEAD | sort)
          expected=(VF_PROJECT.json docs/authority/CURRENT.md docs/evidence/P01_V2.35.1_RELEASE_CLOSURE_20260831.md docs/handoff/CURRENT_STATE.md)
          test "${#changed[@]}" = "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done
          test -z "$(git -C product diff --name-only "$BASE"...HEAD -- src VERSION)"
          printf 'P01_V2351_EXACT_FOUR_FILE_CLOSURE=PASS\nFINAL=%s\nRUNTIME_TREE=%s\n' "$FINAL" "$RUNTIME_TREE" | tee "$EVID/exact-four-file.txt"
      - name: Push closure branch and atomically synchronize main/develop
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          FINAL=$(git -C product rev-parse HEAD)
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/vf-start.git"
          test "$(gh api repos/llhzx2018/vf-start/branches/main --jq .commit.sha)" = "$BASE"
          test "$(gh api repos/llhzx2018/vf-start/branches/develop --jq .commit.sha)" = "$BASE"
          test "$(gh api repos/llhzx2018/vf-start/branches/$BRANCH --jq .commit.sha)" = "$DOCS_HEAD"
          git -C product push "$REMOTE" "$FINAL:refs/heads/$BRANCH"
          git -C product push --atomic "$REMOTE" "$FINAL:refs/heads/main" "$FINAL:refs/heads/develop"
          test "$(gh api repos/llhzx2018/vf-start/branches/main --jq .commit.sha)" = "$FINAL"
          test "$(gh api repos/llhzx2018/vf-start/branches/develop --jq .commit.sha)" = "$FINAL"
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.35.1 --jq .object.sha)" = eb36fd19d269aed4ef4246c2c18f172b2c761bde
          test "$(gh api repos/llhzx2018/core-updates/branches/main --jq .commit.sha)" = a7a601e0880becb78c9835648d06dcda2625b2dc
          printf 'P01_V2351_RELEASE_DOCS_CLOSURE=PASS\nDOCS_SOURCE=%s\nRUNTIME_SRC_TREE=%s\nOWNER_PRODUCTION=2.35.0\nPUBLISHED_LATEST=2.35.1\nOWNER_UPGRADE=PENDING\nASSISTANT_PRODUCTION_WRITE=NO\n' "$FINAL" "$RUNTIME_TREE" | tee "$EVID/verdict.txt"
      - name: Upload release docs finalize evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-v2351-release-docs-finalize-${{ github.run_id }}
          path: /tmp/p01-v2351-docs-finalize-evidence
          if-no-files-found: warn
          retention-days: 90
