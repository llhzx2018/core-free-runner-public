name: P02 V2.5.7 UAUI Friction Reduction R2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v257-uaui-friction-reduction-r2.yml'

permissions:
  contents: read

jobs:
  implement-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: task/v2.5.7-uaui-friction-reduction
          token: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'
          path: p02
          fetch-depth: 0
          persist-credentials: false

      - name: Implement V2.5.7 UX simplification
        working-directory: p02
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/assets/app.js'); s=p.read_text(encoding='utf-8')
          start=s.index('function openPresetTemplatePicker(kind){')
          end=s.index('function escapeRegExp',start)
          block="""function presetBlankCardMarkup(kind){const label=kind==='article'?'文章':'便签';return '<button type=\"button\" class=\"preset-template-card is-blank\" data-preset-kind=\"'+kind+'\" data-preset-template=\"blank\"><strong>空白'+label+'</strong><span>不套结构，直接开始输入</span><small>直接进入编辑</small></button>';}
          function presetTemplateGroupMarkup(kind){const label=kind==='article'?'文章':'便签';const hint=kind==='article'?'资料整理与长期查阅':'快速记录与日常使用';const cards=presetBlankCardMarkup(kind)+PRESET_CONTENT_TEMPLATES[kind].map(template=>presetTemplateCardMarkup(kind,template)).join('');return '<section class=\"preset-template-section\"><div class=\"preset-template-section-head\"><strong>'+label+'</strong><span>'+hint+'</span></div><div class=\"preset-template-grid\">'+cards+'</div></section>';}
          function openPresetTemplatePicker(kind){const requested=(kind==='article'||kind==='quick')?kind:'all';const kinds=requested==='all'?['quick','article']:[requested];const body='<div class=\"preset-template-intro\"><p>直接选择要用的结构。空白和常用模板都在这一页，不再先选择类型再跳一次。</p></div><div class=\"preset-template-sections\">'+kinds.map(presetTemplateGroupMarkup).join('')+'</div>';const title=requested==='all'?'新建内容':'新建'+(requested==='article'?'文章':'便签');const root=modal(title,body,'<button class=\"btn secondary\" type=\"button\" data-close>取消</button>',{variant:'preset-template-dialog'});$$('[data-preset-template]',root).forEach(button=>button.onclick=()=>{const targetKind=button.dataset.presetKind==='article'?'article':'quick';const id=button.dataset.presetTemplate;const template=PRESET_CONTENT_TEMPLATES[targetKind].find(entry=>entry.id===id)||null;const close=$('[data-close]',root);if(close)close.click();openEditor(null,{forceContentMode:targetKind,forceContentFormat:template?'markdown':(targetKind==='article'?'markdown':null),initialContent:template?template.content:'',skipDraft:Boolean(template)});});}
          function openContentKindPicker(){openPresetTemplatePicker('all');}
          function openNewContent(kind){openPresetTemplatePicker(kind);}
          """
          s=s[:start]+block+s[end:]
          wire_start=s.index("$('#addContentBtn').onclick=()=>openNewContent('');const addMenuBtn=$('#addContentMenuBtn');")
          wire_end=s.index("$('#menuBtn').onclick=",wire_start)
          wire="""$('#addContentBtn').onclick=()=>openNewContent('');const addMenuBtn=$('#addContentMenuBtn');if(addMenuBtn)addMenuBtn.onclick=e=>{e.preventDefault();e.stopPropagation();closeContext();addMenuBtn.setAttribute('aria-expanded','false');openNewContent('');};"""
          s=s[:wire_start]+wire+s[wire_end:]
          nav_start=s.index('function settingsNavMarkup(nav){')
          nav_end=s.index('function selectOptions',nav_start)
          nav="""function settingsNavMarkup(nav){let group='';return nav.map(x=>{const label=x.group!==group?'<div class=\"settings-nav-label\">'+esc(x.group)+'</div>':'';group=x.group;return label+'<button data-settings-section=\"'+x.id+'\" class=\"'+(state.settingsSection===x.id?'active':'')+'\"><span>'+esc(x.label)+'</span></button>';}).join('');}
          """
          s=s[:nav_start]+nav+s[nav_end:]
          p.write_text(s,encoding='utf-8')
          PY
          cat >> public/assets/app.css <<'CSS'

          /* V2.5.7 · one-page create + quiet settings navigation */
          #addContentMenuBtn{display:none!important}
          .modal.preset-template-dialog{width:min(820px,calc(100vw - 32px))}
          .preset-template-sections{display:grid;gap:18px}
          .preset-template-section{display:grid;gap:8px}
          .preset-template-section+.preset-template-section{padding-top:16px;border-top:1px solid var(--border)}
          .preset-template-section-head{display:flex;align-items:baseline;gap:8px}
          .preset-template-section-head strong{color:var(--strong);font-size:14px}
          .preset-template-section-head span{color:var(--muted2);font-size:11px}
          .preset-template-card{min-height:84px;padding:11px 13px}
          .settings-nav button{min-height:40px!important;padding:6px 10px!important;gap:0!important}
          .settings-nav button small{display:none!important}
          @media(max-width:620px){.modal.preset-template-dialog{width:min(96vw,560px)}.preset-template-grid{grid-template-columns:1fr}.preset-template-card{min-height:70px}.preset-template-section-head{display:grid;gap:2px;align-items:start}}
          CSS
          printf '2.5.7\n' > VERSION
          python3 - <<'PY'
          from pathlib import Path
          p=Path('CHANGELOG.md'); s=p.read_text(encoding='utf-8')
          entry='''# VF Library V2.5.7 · UA/UI Friction Reduction · Candidate · 2026-08-19\n\n- 新建内容一页完成：便签与文章的空白/常用模板同时展示，取消“先选类型、再跳模板页”的二次跳转。\n- 顶栏新增入口统一为一页式选择器，冗余下拉按钮退场。\n- 设置中心菜单移除每项重复说明，只保留分组与名称，降低视觉噪音。\n- 保持现有 4 个便签预设 + 4 个文章预设，不增加凑数或过度专业模板。\n- Schema 2401，无 Migration。\n\n'''
          p.write_text(entry+s,encoding='utf-8')
          PY
          node --check public/assets/app.js

      - name: Regenerate SOURCE_MANIFEST
        working-directory: p02
        run: |
          set -Eeuo pipefail
          DEP="$RUNNER_TEMP/deploy257"; bash scripts/build-deploy-tree.sh "$DEP" >/dev/null
          python3 - "$DEP" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          dep=Path(sys.argv[1]); repo=Path.cwd(); old=json.loads((repo/'SOURCE_MANIFEST.json').read_text(encoding='utf-8')); mapping={e['full_path']:e['repo_path'] for e in old['entries']}; out=[]
          for f in sorted(x for x in dep.rglob('*') if x.is_file()):
              rel=f.relative_to(dep).as_posix(); assert rel in mapping,rel; rp=repo/mapping[rel]; b=f.read_bytes(); rb=rp.read_bytes(); h=lambda x:hashlib.sha256(x).hexdigest(); out.append({'full_path':rel,'repo_path':mapping[rel],'bytes':len(b),'sha256':h(b),'repo_sha256':h(rb)})
          data={'project':'P02 · VF Library','version':'2.5.7','schema':2401,'source_baseline_full_sha256':'PENDING_FORMAL_CANDIDATE_ARTIFACT','mapping_contract':'Each declared runtime source file must exist exactly once at repo_path; hashes bind the Git-native V2.5.7 candidate deploy tree. Formal release identity is not assigned by this candidate manifest.','runtime_source_file_count':len(out),'entries':out}; (repo/'SOURCE_MANIFEST.json').write_text(json.dumps(data,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8'); print('RUNTIME_FILES',len(out))
          PY

      - name: Fresh install and Chrome UX regression
        working-directory: p02
        env:
          AUDIT_PASSWORD: 'P02-V257-UAUI-R2!'
        run: |
          set -Eeuo pipefail
          python3 scripts/repository-gates.py
          ROOT="$RUNNER_TEMP/v257"; SITE="$ROOT/site"; mkdir -p "$SITE"; bash scripts/build-deploy-tree.sh "$SITE" >/dev/null
          php -S 127.0.0.1:18272 -t "$SITE" >"$ROOT/server.log" 2>&1 & echo $! > "$ROOT/pid"
          for _ in $(seq 1 80); do curl -fsS http://127.0.0.1:18272/setup.php >/dev/null 2>&1 && break; sleep .25; done
          curl -fsS -c "$ROOT/cookie" http://127.0.0.1:18272/setup.php > "$ROOT/setup.html"
          TOKEN=$(python3 - "$ROOT/setup.html" <<'PY'
          import re,html,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf" value="([^"]+)"',s);assert m;print(html.unescape(m.group(1)))
          PY
          )
          test "$(curl -sS -o /dev/null -w '%{http_code}' -b "$ROOT/cookie" -c "$ROOT/cookie" -H 'Origin: http://127.0.0.1:18272' --data-urlencode "setup_csrf=$TOKEN" --data-urlencode "password=$AUDIT_PASSWORD" --data-urlencode "password_confirm=$AUDIT_PASSWORD" http://127.0.0.1:18272/setup.php)" = 303
          npm install --no-save playwright-core@1.55.0 >/dev/null
          cat > .v257.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({channel:'chrome',headless:true});const page=await browser.newPage({viewport:{width:1440,height:900}});const errors=[];page.on('pageerror',e=>errors.push(String(e)));
          await page.goto('http://127.0.0.1:18272/',{waitUntil:'networkidle'});let sess=await page.evaluate(async()=>await(await fetch('/api.php?action=session',{cache:'no-store'})).json());if(!sess?.site?.auth){await page.locator('[data-open-login]').click();await page.locator('#loginForm input[name="password"]').fill(process.env.AUDIT_PASSWORD);await page.locator('#loginSubmit').click();await page.waitForFunction(async()=>Boolean((await(await fetch('/api.php?action=session',{cache:'no-store'})).json())?.site?.auth));}
          const assertUnified=async()=>{const modal=page.locator('.modal.preset-template-dialog');await modal.waitFor({state:'visible'});if(await page.locator('[data-preset-kind-choice]').count())throw new Error('legacy kind picker present');if(await modal.locator('.preset-template-section').count()!==2)throw new Error('need two template sections');if(await modal.locator('[data-preset-template]').count()!==10)throw new Error('need ten direct choices');};
          await page.locator('#addContentBtn').click();await assertUnified();await page.locator('[data-preset-kind="quick"][data-preset-template="todo"]').click();if(!(await page.locator('.content-editor').inputValue()).includes('- [ ]'))throw new Error('direct template failed');await page.locator('#editorCancel').click();if(await page.locator('#addContentMenuBtn').isVisible())throw new Error('redundant dropdown still visible');
          await page.locator('#settingsBtn').click();await page.waitForSelector('.settings-nav');if(await page.locator('.settings-nav small').count())throw new Error('settings descriptions still rendered');if(await page.locator('.settings-nav button').count()!==8)throw new Error('settings nav count changed');
          await page.setViewportSize({width:390,height:844});await page.goto('http://127.0.0.1:18272/',{waitUntil:'networkidle'});await page.locator('#addContentBtn').click();await assertUnified();if(errors.length)throw new Error(errors.join(' | '));console.log('V257_UAUI_BROWSER=PASS');await browser.close();
          JS
          node .v257.mjs
          php "$SITE/cli/verify.php" | jq -e '.ok==true and .version=="2.5.7" and .schema_version==2401 and .integrity=="ok" and .foreign_key_errors==0' >/dev/null
          kill "$(cat "$ROOT/pid")"
          echo FRESH_INSTALL=PASS
          echo ONE_PAGE_NEW_CONTENT=PASS
          echo SETTINGS_NAV_NOISE_REDUCTION=PASS
          echo PRODUCTION_WRITE=NO

      - name: Push verified candidate
        working-directory: p02
        env:
          GH_TOKEN: '${{ secrets.VF_PRIVATE_WRITE_TOKEN }}'
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"; git config user.name 'VF Release Bot'; git config user.email 'vf-release-bot@users.noreply.github.com'
          git add public/assets/app.js public/assets/app.css VERSION CHANGELOG.md SOURCE_MANIFEST.json; git diff --cached --check; git commit -m 'feat(v2.5.7): simplify creation and settings navigation'; gh auth setup-git; git push https://github.com/llhzx2018/vf-library.git HEAD:task/v2.5.7-uaui-friction-reduction
          echo PRODUCT_CANDIDATE_COMMIT=$(git rev-parse HEAD)
          echo PRODUCTION_WRITE=NO
