name: P02 W1 exact final Vue UI and PHP source proof (one-off)
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p02-w1-vue-build-20261112.yml']
permissions:
  contents: read
jobs:
  vue-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-library
          ref: c585023246bf5d525577e9c176c736cfd4b500ca
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Exact private P02 identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = 'c585023246bf5d525577e9c176c736cfd4b500ca'
          test "$(cat product/VERSION)" = '2.5.126'
          test -s product/frontend/w1-search/package-lock.json
          echo P02_W1_EXACT_SOURCE=PASS
      - name: Locked npm install and actual Vue tests
        working-directory: product/frontend/w1-search
        shell: bash
        run: |
          set -Eeuo pipefail
          node --version
          npm --version
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          original_js="$(sha256sum ../../public/assets/w1/w1-search.js | cut -d' ' -f1)"
          original_css="$(sha256sum ../../public/assets/w1/w1-search.css | cut -d' ' -f1)"
          npm run build
          test "$(sha256sum ../../public/assets/w1/w1-search.js | cut -d' ' -f1)" = "$original_js"
          test "$(sha256sum ../../public/assets/w1/w1-search.css | cut -d' ' -f1)" = "$original_css"
          echo P02_W1_REPRODUCIBLE_STATIC=PASS
          test "$(wc -c < ../../public/assets/w1/w1-search.js)" -gt 10000
          grep -q 'mountW1Search' ../../public/assets/w1/w1-search.js
          test -s ../../public/assets/w1/w1-search.css
          test ! -e ../../public/assets/w1/w1-search.js.map
          echo P02_W1_REAL_VUE_BUILD=PASS
      - name: Negative source contract and existing PHP baseline
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/p02-w1-search-source-check.mjs
          node --test tests/unit/p02_w1_vue_search_contract.test.mjs
          echo P02_W1_NEGATIVE_FIXTURES=PASS
          rm -rf frontend/w1-search/node_modules
          bash scripts/verify-repository.sh
          echo P02_W1_EXISTING_PHP_BASELINE=PASS
      - name: Remove transient private source and npm cache from workspace
        if: always()
        shell: bash
        run: |
          rm -rf product
          echo PRIVATE_SOURCE_PERSISTED_IN_PUBLIC_GIT_OR_ARTIFACT=NO
