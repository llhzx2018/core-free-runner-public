name: P02 W1 exact Vue build and private PR candidate assets (one-off)
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p02-w1-vue-build-20261112.yml']
permissions:
  contents: read
jobs:
  vue-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-library
          ref: 03492064c0b327bb3e052e786c3b9e1fff3e89ad
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Exact private P02 identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = '03492064c0b327bb3e052e786c3b9e1fff3e89ad'
          test "$(cat product/VERSION)" = '2.5.125'
          test ! -e product/frontend/w1-search/package-lock.json
          echo P02_W1_EXACT_SOURCE=PASS
      - name: Locked npm install and actual Vue tests
        working-directory: product/frontend/w1-search
        shell: bash
        run: |
          set -Eeuo pipefail
          node --version
          npm --version
          npm install --package-lock-only --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
          test -s ../../public/assets/w1/w1-search.js
          test -s ../../public/assets/w1/w1-search.css
          test ! -e ../../public/assets/w1/w1-search.js.map
          echo P02_W1_REAL_VUE_BUILD=PASS
      - name: Negative source contract and existing PHP baseline
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/p02-w1-search-source-check.mjs
          node --test tests/unit/p02_w1_vue_search_contract.test.mjs
          echo P02_W1_NEGATIVE_FIXTURES=PASS
          rm -rf frontend/w1-search/node_modules
          bash scripts/verify-repository.sh
          echo P02_W1_EXISTING_PHP_BASELINE=PASS
      - name: Write three generated files only to private development branch
        working-directory: product
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "${GH_TOKEN:-}" || { echo P02_W1_PRIVATE_DEV_WRITE_NOT_AVAILABLE; exit 78; }
          branch='p02/w1-vue-search-slice-20261112'
          repo='llhzx2018/vf-library'
          live="$(gh api "repos/$repo/git/ref/heads/$branch" --jq '.object.sha')"
          test "$live" = '03492064c0b327bb3e052e786c3b9e1fff3e89ad' || { echo P02_W1_SOURCE_DRIFT; exit 78; }
          for file in frontend/w1-search/package-lock.json public/assets/w1/w1-search.js public/assets/w1/w1-search.css; do
            test -s "$file" || exit 1
            content="$(base64 -w0 "$file")"
            gh api --method PUT "repos/$repo/contents/$file" -f branch="$branch" -f message="build(P02 W1): commit exact-source locked Vue output $(basename "$file")" -f content="$content" >/dev/null
            unset content
            echo "P02_W1_PRIVATE_SOURCE_OUTPUT_PATH=$file"
          done
          echo P02_W1_PRIVATE_DEV_OUTPUT_COMMITTED=PASS
      - name: Remove transient private source and npm cache from workspace
        if: always()
        shell: bash
        run: |
          rm -rf product
          echo PRIVATE_SOURCE_PERSISTED_IN_PUBLIC_GIT_OR_ARTIFACT=NO
