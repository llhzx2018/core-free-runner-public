name: P01 D59 Canonical Resource Direct Editor Exact-Source Proof
on:
  push:
    branches:
      - test/p01-resource-deep-edit-d59-20261113
permissions:
  contents: read
jobs:
  resource-direct-editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    steps:
      - name: Guard public-safe synthetic exact-source proof
        shell: bash
        env:
          PRIVATE_READ: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "$GITHUB_REF_NAME" = "test/p01-resource-deep-edit-d59-20261113"
          test -n "$PRIVATE_READ"
          echo "P01_D59_SCOPE=CANONICAL_3_DOMAIN_EXISTING_EDITOR_NO_NEW_WRITER"
          echo "P01_PRODUCTION=UNTOUCHED"
      - name: Transient private exact-source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: c65620f6394031d4ba85481264913b86ed3bf414
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
      - name: Exact final commit and original domain service identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "c65620f6394031d4ba85481264913b86ed3bf414"
          test "$(cat candidate/VERSION)" = "2.47.516"
          test "$(cat candidate/src/VERSION.txt)" = "2.47.516"
          test -f candidate/src/app/next/frontend/tests/resource-deep-edit.spec.ts
          test -f candidate/src/app/next/frontend/src/OwnerResourceCenter.vue
          test -f candidate/src/app/next/frontend/src/OwnerWatch.vue
          test -f candidate/src/app/next/frontend/src/OwnerTopics.vue
          test -f candidate/src/app/next/frontend/src/OwnerProjects.vue
          echo "P01_D59_EXACT_c65620f6394031d4ba85481264913b86ed3bf414=c65620f6394031d4ba85481264913b86ed3bf414"
      - name: Typecheck Vitest and production Vite build
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate/src/app/next/frontend
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/p01-npm.txt" 2>&1
          if ! npm run typecheck > "$RUNNER_TEMP/p01-ts.txt" 2>&1; then
            echo "P01_D59_VUE_TYPECHECK=FAIL"
            grep -E 'error TS[0-9]+|resource-deep-edit|resources-center|Owner.*vue|App.vue' "$RUNNER_TEMP/p01-ts.txt" | sed -E 's#/(home|tmp|mnt)/[^ :]+#<PRIVATE_PATH>#g' | tail -n 50 || true
            exit 1
          fi
          echo "P01_D59_VUE_TYPECHECK=PASS"
          if ! npm run test:unit > "$RUNNER_TEMP/p01-vitest.txt" 2>&1; then
            echo "P01_D59_VITEST=FAIL"
            grep -E ' FAIL |Test Files|Tests |AssertionError|Expected' "$RUNNER_TEMP/p01-vitest.txt" | tail -n 30 || true
            exit 1
          fi
          echo "P01_D59_VITEST=PASS"
          npm run build > "$RUNNER_TEMP/p01-build.txt" 2>&1
          test -f ../public/build/.vite/manifest.json
          echo "P01_D59_VITE_PRODUCTION=PASS"
      - name: Chromium focused Owner exact-record editor functional / negative
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate/src/app/next/frontend
          npx playwright install --with-deps chromium > "$RUNNER_TEMP/p01-chromium.txt" 2>&1
          if ! npx playwright test tests/resource-deep-edit.spec.ts > "$RUNNER_TEMP/p01-focused.txt" 2>&1; then
            echo "P01_D59_CHROMIUM_FOCUSED=FAIL"
            grep -E '^  [0-9]+\)|Error:|Locator:|Expected:|Received:|resource-deep-edit.spec.ts:[0-9]+|failed|passed|waiting for' "$RUNNER_TEMP/p01-focused.txt" | sed -E 's#/(home|tmp|mnt)/[^ :]+#<PRIVATE_PATH>#g' | tail -n 65 || true
            exit 1
          fi
          echo "P01_D59_CHROMIUM_FOCUSED=PASS"
      - name: Complete 390 768 1440 Chromium regression all other workspaces
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate/src/app/next/frontend
          if ! npm run test:e2e > "$RUNNER_TEMP/p01-e2e.txt" 2>&1; then
            echo "P01_D59_FULL_BROWSER=FAIL"
            grep -E '^  [0-9]+\)|Error:|Locator:|Expected:|Received:|failed|passed' "$RUNNER_TEMP/p01-e2e.txt" | sed -E 's#/(home|tmp|mnt)/[^ :]+#<PRIVATE_PATH>#g' | tail -n 48 || true
            exit 1
          fi
          echo "P01_D59_FULL_CHROMIUM_390_768_1440=PASS"
      - name: Always wipe private workspace, logs and credentials
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate
          rm -f -- "$RUNNER_TEMP"/p01-*.txt
          echo "P01_PRIVATE_c65620f6394031d4ba85481264913b86ed3bf414_PERSISTED=NO"
          echo "P01_PUBLIC_PRIVATE_ARTIFACTS=NONE"
