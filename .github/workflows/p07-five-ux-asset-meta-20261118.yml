name: P07 five UX official immutable asset metadata readback
on:
  pull_request:
    paths: ['.github/workflows/p07-five-ux-asset-meta-20261118.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify actual official ZIP and extract immutable meta digests
        shell: bash
        run: |
          set -Eeuo pipefail
          out="$RUNNER_TEMP/p07-five-meta"
          mkdir -p "$out"
          tag=p07-all-ux-v0.1.0-20261118
          for item in \
            'P07-M01-0.1.0-ux3.zip:13e79e7c7a4f1170c74da24e783804c3c2bda06fe6c46b768497694e826b3ed7' \
            'P07-M02-2.1.1-ux3.zip:88da5b8219fb7e04d606eb3de998d872747cb05153bdd93c7351b46f957164b4' \
            'P07-M04-0.1.0-ux5.zip:2ff45c263f930e258a3c323b6c009e0973531d3f90a2e432a66aed704c9baa7d'; do
              name="${item%%:*}"; sha="${item##*:}"
              curl -fLsS --retry 2 --max-time 120 \
                "https://github.com/llhzx2018/core-free-runner-public/releases/download/$tag/$name" -o "$out/$name"
              test "$(sha256sum "$out/$name" | cut -d' ' -f1)" = "$sha"
          done
          python3 -B - "$out" <<'PY'
          import hashlib,sys,pathlib,zipfile,json
          root=pathlib.Path(sys.argv[1])
          for m,name in (("M01","P07-M01-0.1.0-ux3.zip"),
                         ("M02","P07-M02-2.1.1-ux3.zip"),
                         ("M04","P07-M04-0.1.0-ux5.zip")):
              with zipfile.ZipFile(root/name) as z:
                  prefix="p07-"+m.lower()+"/"
                  data=z.read(prefix+"MODULE_MANIFEST.json")
                  record=json.loads(data)
                  entry=z.read(prefix+record["entrypoint"])
                  print(f"P07_{m}_OFFICIAL_META_SHA256="+hashlib.sha256(data).hexdigest())
                  print(f"P07_{m}_OFFICIAL_ENTRY_GIT_BLOB="+hashlib.sha1(b"blob "+str(len(entry)).encode()+b"\0"+entry).hexdigest())
                  print(f"P07_{m}_OFFICIAL_BUILD="+record["module_build_id"])
                  if m=="M01":
                      print("P07_M01_OFFICIAL_LEGACY_MANIFEST_SHA256="+hashlib.sha256(z.read(prefix+"MANIFEST.sha256")).hexdigest())
                  if m=="M04":
                      data2=z.read(prefix+"MANIFEST.gitblob")
                      print("P07_M04_OFFICIAL_MANIFEST_GIT_BLOB="+hashlib.sha1(b"blob "+str(len(data2)).encode()+b"\0"+data2).hexdigest())
          print("P07_ALL_UX_RELEASE_META_READBACK=PASS")
          PY
          gh api 'repos/llhzx2018/core-free-runner-public/releases/tags/p07-all-ux-v0.1.0-20261118' --jq '.assets[] | [.name, (.id|tostring)] | @tsv' | grep -E 'P07-M0[12345]-' | sed 's/^/P07_PUBLIC_ASSET_ID=/'
      - name: Private-free cleanup
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/p07-five-meta"
