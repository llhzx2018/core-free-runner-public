name: S01 Theme exact formal release
on:
  push:
    branches: [task/s01-encryption172-20261022]
    paths: ['.github/workflows/s01-encryption172-20261022-formal.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.172
  TARGET_SHA: f1d34513b1b870c24e593afba3b08222f97a97f2
  TARGET_TREE: 624db80065e9a5d6b3547faea741ee6ff61cca6c
  BASE_SHA: 901bf21866254912c6814df4b918f9641911570f
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: f1d34513b1b870c24e593afba3b08222f97a97f2
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact candidate, merged tree and required evidence readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider candidate-proof
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/39774758059 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/39774758059 --jq .head_sha)" = 22e6303428c22ffe96fb8d648ce2446a2d12bd05
          test "$(gh api repos/$TARGET_REPO/commits/main --jq .sha)" = "$TARGET_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$TARGET_SHA --jq .tree.sha)" = "$TARGET_TREE"
          gh run download 39774758059 --repo llhzx2018/core-free-runner-public --name s01-encryption-39774758059 --dir candidate-proof
          cmp candidate-proof/state-before.sha256 candidate-proof/state-after.sha256
          cmp candidate-proof/contracts-before.json candidate-proof/contracts-after.json
          python3 control/lanes/s01-encryption172-20261022/package.py
          python3 - <<'PYVERIFY'
          import json,pathlib
          r=pathlib.Path('candidate-proof')
          old=json.loads((r/'package.json').read_text());new=json.loads(pathlib.Path('proof/package.json').read_text())
          before=json.loads((r/'before-browser.json').read_text());after=json.loads((r/'after-browser.json').read_text())
          assert before['status']==after['status']=='PASS'
          assert after['write_requests']==0 and after['errors']==[]
          assert len(after['rows'])==6 and {r['width'] for r in after['rows']}=={1440,1319,1024}
          assert {r['language'] for r in after['rows']}=={'en','zh'}
          assert after['owner_visual']=='PENDING_AFTER_MANUAL_UPGRADE'
          assert json.loads((r/'clean-install.json').read_text())['status']=='PASS'
          for lang in ['en','zh']:
              a=json.loads((r/('before-guidance-'+lang+'.json')).read_text());b=json.loads((r/('after-guidance-'+lang+'.json')).read_text())
              assert [k for k in a if a[k]!=b[k]]==['m3u8-encryption-detector']
          for k in ['status','version','tree','sha256','bytes','files']:assert old[k]==new[k],k
          assert new['sha256']=='ba1d0f93624b1bc3572e92fc8d3df0bea02f695d5e63e784edc6f965c757867a' and new['bytes']==1973838
          print('MERGED_TREE_EQUALS_TESTED_TREE_AND_EXACT_PACKAGE_PASS')
          PYVERIFY
      - name: Publish only the exact verified package
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.35.172 --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create v1.35.172 provider/vf-tools-theme_V1.35.172.zip --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Theme V1.35.172' --notes '修复加密检测页误用IPTV步骤和FAQ：中英文内容聚焦Manifest、EXT-X-KEY、METHOD、URI、IV及元数据边界；推荐区与下一步入口对应当前任务。旧通用文案不再覆盖新默认值，自定义标题和说明保持。实际隔离WordPress三桌面宽度、FAQ键盘、真实推荐与下一步导航、Head保持、其它十个工具选择结果保持、干净ZIP安装及171→172升级/回退/重复安装与受保护数据一致性通过。M3U8保持1.25.94，Ops未修改。手机测试暂缓，Owner最终UX验收待手工升级；Production及五组翻译配对数据均未自动修改。' --latest
          fi
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/v1.35.172 --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh release view v1.35.172 --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - name: Authenticated remote ZIP byte comparison
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download v1.35.172 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.172.zip --dir remote
          cmp provider/vf-tools-theme_V1.35.172.zip remote/vf-tools-theme_V1.35.172.zip
          echo 'ba1d0f93624b1bc3572e92fc8d3df0bea02f695d5e63e784edc6f965c757867a  remote/vf-tools-theme_V1.35.172.zip' | sha256sum -c
          test "$(stat -c %s remote/vf-tools-theme_V1.35.172.zip)" = 1973838
          gh release view v1.35.172 --repo "$TARGET_REPO" --json url,publishedAt,tagName > proof/formal-release.json
          echo FORMAL_RELEASE_EXACT_REMOTE_ASSET_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-encryption-formal-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target provider remote candidate-proof
