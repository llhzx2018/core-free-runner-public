name: S01 native WP updater discovers released checker components
on:
  push:
    branches: [task/s01-checker-native-discovery-20261012]
permissions:
  contents: read
  actions: read
jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_REPO: 'llhzx2018/core-updates'
      TARGET_VERSION: '1.3.0'
      TARGET_SHA: '44889559b08594748d973b69c6a5460f6ee78b5c'
      TARGET_TREE: '414e305251ab9c662d873aa0f4ec21921816acd3'
      CHANNEL_SHA: '44889559b08594748d973b69c6a5460f6ee78b5c'
      THEME_SOURCE_VERSION: '1.35.108'
      THEME_LEGACY_SOURCE_VERSION: '1.35.107'
      THEME_VERSION: '1.35.109'
      THEME_SHA: '1592daff1bfe86d7d3aba2ea3d9d860d961d4a46'
      THEME_TREE: '3ff304ed7e02be49a3f0f52a651f149eabacb843'
      THEME_ASSET_SHA: '67af8f8feafaac4555aed8707d3befe206a72dc45ef4738c32a9c13618e6eda7'
      M3_SOURCE_VERSION: '1.25.84'
      M3_VERSION: '1.25.85'
      M3_SHA: 'a67e13de8362eeb1185d8d56302db575d2c065ae'
      M3_TREE: '8b072f430807a74b5ee27692873fef6dabd2f110'
      M3_ASSET_SHA: '6e9b1fa16a7d21fed25d272aec6a357267e339fdfe22bda7996b32056e8522c4'
      THEME_LEGACY_BYTES: '1790612'
      THEME_LEGACY_SHA256: '95dc01b84772e319700e091c80694422c442fceab34b5c9f81ae809afc738916'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Exact one-spec discovery audit
        run: |
          set -Eeuo pipefail
          mkdir -p proof
          python3 runner/scripts/ephemeral_lane_spec.py render --spec runner/lanes/s01-checker-native-discovery-20261012/spec.json --template runner/lanes/s01-checker-native-discovery-20261012/discovery.template.yml --output /tmp/discovery-render.yml >/dev/null
          cmp /tmp/discovery-render.yml runner/.github/workflows/s01-checker-native-discovery-20261012.yml
          python3 runner/scripts/ephemeral_lane_spec.py audit-rendered --spec runner/lanes/s01-checker-native-discovery-20261012/spec.json --input runner/.github/workflows/s01-checker-native-discovery-20261012.yml > proof/lane-identity.json
          cp -a runner/lanes/s01-checker-native-discovery-20261012 lane
          bash -n lane/native.sh
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: task/s01-c01-footer105-20261010-discovery
          persist-credentials: false
          path: historic-theme
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: task/s01-c03-embed78-20261010-discovery
          persist-credentials: false
          path: historic-m3
      - name: Real WordPress old-install native update discovery and exact asset download
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: bash lane/native.sh
      - name: Public-safe discovery receipts only
        if: always()
        id: receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-native-discovery-${{ github.run_id }}
          path: proof/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Uploaded public-safe receipt reverse readback
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.receipt.outputs.artifact-id }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > /tmp/native-meta.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/native-receipt.zip
          python3 - <<'PY'
          import os,json,pathlib,hashlib,zipfile
          m=json.loads(pathlib.Path('/tmp/native-meta.json').read_text());b=pathlib.Path('/tmp/native-receipt.zip').read_bytes()
          assert m['id']==int(os.environ['ARTIFACT_ID']) and m['workflow_run']['id']==int(os.environ['GITHUB_RUN_ID']) and m['workflow_run']['head_sha']==os.environ['GITHUB_SHA']
          assert m['size_in_bytes']==len(b) and m['digest']=='sha256:'+hashlib.sha256(b).hexdigest()
          with zipfile.ZipFile('/tmp/native-receipt.zip') as z:
           assert z.testzip() is None
           names={'lane-identity.json','native-theme-current.json','native-theme-legacy.json','native-m3.json','FINAL_DISCOVERY.json'}
           assert set(z.namelist())==names
           for n in names:
            assert json.loads(z.read(n))==json.loads((pathlib.Path('proof')/n).read_text())
           final=json.loads(z.read('FINAL_DISCOVERY.json'))
           assert final['status']=='PASS' and len(final['component_checks'])==2
          print('PUBLIC_SAFE_NATIVE_READBACK',json.dumps({'status':'PASS','artifact_id':m['id'],'digest':m['digest'],'bytes':len(b)}))
          PY
      - name: Remove private checkout and synthetic artifacts
        if: always()
        run: rm -rf target historic-theme historic-m3 /tmp/vf-s01-wpcli.phar /tmp/theme-source.zip /tmp/m3-source.zip /tmp/theme-channel.json /tmp/m3-channel.json

