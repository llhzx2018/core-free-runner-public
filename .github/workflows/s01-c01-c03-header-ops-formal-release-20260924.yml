name: S01 Theme 1.35.33 + M3U8 1.25.34 Formal Release

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  actions: read

jobs:
  theme-release:
    if: github.head_ref == 'task/s01-header-ops-release-20260924'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REPO: llhzx2018/vf-tools-theme
      SHA: 34d2c6d468a2ff647f73647f4e2e6d1ffc9efcc0
      VERSION: 1.35.33
      TAG: v1.35.33
      ASSET: vf-tools-theme_V1.35.33.zip
      PREVIOUS_TAG: v1.35.32
      PREVIOUS_ASSET: vf-tools-theme_V1.35.32.zip
      MAIN_GATE_RUN: '35945073039'
    steps:
      - name: Credential presence
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"
      - name: Checkout exact Theme main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 34d2c6d468a2ff647f73647f4e2e6d1ffc9efcc0
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: theme
          persist-credentials: false
      - name: Verify Theme exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C theme rev-parse HEAD)" = "$SHA"
          test "$(tr -d '\r\n' < theme/VERSION)" = "$VERSION"
          grep -Fq 'Version: 1.35.33' theme/src/style.css
          grep -Fq 'V1.35.33_S01_HEADER_OPS_ALIGNMENT_R6' theme/src/style.css
          grep -Fq "VF_THEME_VERSION', '1.35.33'" theme/src/inc/runtime-constants.php
          grep -Fq "VF_THEME_ROUND', 'V1.35.33_S01_HEADER_OPS_ALIGNMENT_R6'" theme/src/inc/runtime-constants.php
          php theme/tests/s01-c01-admin-shell-alignment-r1-contract.php
          php theme/tests/s01-c01-local-nav-alignment-r2-contract.php
          php theme/tests/s01-c01-content-alignment-r3-contract.php
          php theme/tests/s01-c01-special-surface-r4-contract.php
          php theme/tests/s01-c01-page-visual-closure-r5-contract.php
          python3 - <<'PY'
          import json
          d=json.load(open('theme/src/theme.json'))
          assert d['version']==3
          assert d['settings']['custom']['vfThemeVersion']=='1.35.33'
          assert d['settings']['custom']['vfPackageSyncRound']=='V1.35.33_S01_HEADER_OPS_ALIGNMENT_R6'
          PY
      - name: Build and verify Theme package
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf stage1 stage2 dist previous
          mkdir -p stage1/vf-tools-theme stage2/vf-tools-theme dist previous
          cp -a theme/src/. stage1/vf-tools-theme/
          cp -a theme/src/. stage2/vf-tools-theme/
          rm -f stage1/vf-tools-theme/README.md stage1/vf-tools-theme/CHANGELOG.md
          rm -f stage2/vf-tools-theme/README.md stage2/vf-tools-theme/CHANGELOG.md
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find stage1/vf-tools-theme -type f -name '*.php' -print0 | sort -z)
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re,os
          root=Path('stage1/vf-tools-theme')
          def runtime(rel):
              rel=rel.replace('\\','/').lstrip('/')
              if not rel or '../' in rel:return False
              if re.search(r'(^|/)(?:\.git|\.github|tests?|docs?|evidence|private|tmp|temp|cache|logs?)(/|$)',rel,re.I):return False
              base=Path(rel).name.lower()
              if base in {'readme.md','changelog.md','license','license.txt'}:return False
              if re.search(r'\.(?:sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',rel,re.I):return False
              if '/' not in rel:return rel=='style.css' or rel.lower().endswith('.php')
              return re.match(r'^(?:inc|assets|config|languages|template-parts|templates)/',rel) is not None
          rows=[]
          for p in sorted((x for x in root.rglob('*') if x.is_file()), key=lambda x:x.relative_to(root).as_posix()):
              rel=p.relative_to(root).as_posix()
              if runtime(rel):
                  rows.append((rel,hashlib.sha256(p.read_bytes()).hexdigest()))
          canonical=b''.join(rel.encode()+b'\0'+sha.encode()+b'\n' for rel,sha in rows)
          Path('/tmp/theme_runtime_count').write_text(str(len(rows)))
          Path('/tmp/theme_runtime_fp').write_text(hashlib.sha256(canonical).hexdigest())
          PY
          (cd stage1 && zip -X -q -r "../dist/$ASSET" vf-tools-theme)
          (cd stage2 && zip -X -q -r "../dist/rebuild-$ASSET" vf-tools-theme)
          cmp "dist/$ASSET" "dist/rebuild-$ASSET"
          unzip -tq "dist/$ASSET" >/dev/null
          test "$(unzip -Z1 "dist/$ASSET" | cut -d/ -f1 | sort -u)" = "vf-tools-theme"
          unzip -p "dist/$ASSET" vf-tools-theme/style.css | grep -Fq 'Version: 1.35.33'
          unzip -p "dist/$ASSET" vf-tools-theme/inc/runtime-constants.php | grep -Fq "VF_THEME_VERSION', '1.35.33'"
          unzip -Z1 "dist/$ASSET" | grep -Fxq 'vf-tools-theme/theme.json'
          unzip -Z1 "dist/$ASSET" | grep -Fxq 'vf-tools-theme/screenshot.png'
          sha256sum "dist/$ASSET" | awk '{print $1}' > /tmp/theme_sha
          stat -c '%s' "dist/$ASSET" > /tmp/theme_bytes
      - name: Previous Theme release rollback source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh release download "$PREVIOUS_TAG" --repo "$REPO" --pattern "$PREVIOUS_ASSET" --dir previous
          unzip -tq "previous/$PREVIOUS_ASSET" >/dev/null
          unzip -p "previous/$PREVIOUS_ASSET" vf-tools-theme/style.css | grep -Fq 'Version: 1.35.32'
      - name: Publish and read back Theme release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            j="$(gh api "repos/$REPO/releases/tags/$TAG")"
            test "$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')" = "$SHA"
          else
            cat > /tmp/theme-notes.md <<EOF
          # VF Tools Theme V1.35.33
          S01-C01 OPS Header Alignment R6.
          - Aligns the component header/shell geometry and active navigation language to VF Tools Ops.
          - Removes competing header subtitle/version chrome and uses compact VF identity.
          - 8 admin pages × 3 viewports final main Browser Gate $MAIN_GATE_RUN PASS.
          - Data/Schema migration: NONE.
          - Rollback source: $PREVIOUS_TAG.
          - OWNER explicitly authorized direct Formal Release + Production update; no Preview gate inserted.
          EOF
            gh release create "$TAG" "dist/$ASSET#VF Tools Theme $VERSION" --repo "$REPO" --target "$SHA" --title "VF Tools Theme V$VERSION" --notes-file /tmp/theme-notes.md
            j="$(gh api "repos/$REPO/releases/tags/$TAG")"
          fi
          aid="$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.id' <<<"$j")"
          rbytes="$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.size' <<<"$j")"
          rdigest="$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.digest' <<<"$j")"
          lbytes="$(cat /tmp/theme_bytes)"
          lsha="$(cat /tmp/theme_sha)"
          test -n "$aid" && test "$aid" != null
          test "$rbytes" = "$lbytes"
          test "$rdigest" = "sha256:$lsha"
          test "$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')" = "$SHA"
          rm -rf /tmp/theme-readback && mkdir -p /tmp/theme-readback
          gh release download "$TAG" --repo "$REPO" --pattern "$ASSET" --dir /tmp/theme-readback --clobber
          test "$(sha256sum "/tmp/theme-readback/$ASSET" | awk '{print $1}')" = "$lsha"
          cmp "dist/$ASSET" "/tmp/theme-readback/$ASSET"
          cat > /tmp/theme-release-receipt.json <<EOF
          {"component_id":"S01-C01","version":"$VERSION","source_sha":"$SHA","tag":"$TAG","asset":"$ASSET","asset_id":$aid,"asset_bytes":$lbytes,"asset_sha256":"$lsha","runtime_files":$(cat /tmp/theme_runtime_count),"runtime_fingerprint":"$(cat /tmp/theme_runtime_fp)","main_gate_run":$MAIN_GATE_RUN,"owner_authorization":"PASS_EXPLICIT_DIRECT_RELEASE","remote_readback":"PASS"}
          EOF
      - name: Upload Theme release receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c01-13532-formal-release-${{ github.run_id }}
          path: /tmp/theme-release-receipt.json
          if-no-files-found: error
          retention-days: 30

  m3u8-release:
    if: github.head_ref == 'task/s01-header-ops-release-20260924'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REPO: llhzx2018/vf-tools-m3u8
      SHA: 7606e009ba8423e7652b0e34f286163f4e0db2a6
      VERSION: 1.25.34
      TAG: v1.25.34
      ASSET: vf-tools-m3u8_V1.25.34.zip
      PREVIOUS_TAG: v1.25.33
      PREVIOUS_ASSET: vf-tools-m3u8_V1.25.33.zip
      MAIN_GATE_RUN: '35945073039'
    steps:
      - name: Credential presence
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"
      - name: Checkout exact M3U8 main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: 7606e009ba8423e7652b0e34f286163f4e0db2a6
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          path: m3u8
          persist-credentials: false
      - name: Verify M3U8 exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C m3u8 rev-parse HEAD)" = "$SHA"
          test "$(tr -d '\r\n' < m3u8/VERSION)" = "$VERSION"
          grep -Fq 'Version: 1.25.34' m3u8/src/vf-tool-m3u8.php
          grep -Fq "VF_TOOL_M3U8_VERSION', '1.25.34'" m3u8/src/vf-tool-m3u8.php
          php m3u8/tests/s01-c03-admin-shell-alignment-r1-contract.php
          php m3u8/tests/s01-c03-local-nav-alignment-r2-contract.php
          php m3u8/tests/s01-c03-content-alignment-r3-contract.php
          php m3u8/tests/s01-c03-special-surface-r4-contract.php
          php m3u8/tests/s01-c03-page-visual-closure-r5-contract.php
      - name: Build and verify M3U8 package
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf stage dist previous
          mkdir -p stage/vf-tool-m3u8 dist previous
          cp -a m3u8/src/. stage/vf-tool-m3u8/
          test "$(find stage/vf-tool-m3u8 -type l | wc -l)" = "0"
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find stage/vf-tool-m3u8 -type f -name '*.php' -print0 | sort -z)
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          root=Path('stage/vf-tool-m3u8')
          banned={'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'}
          def runtime(rel):
              parts=rel.split('/')
              if any(x.lower() in banned for x in parts):return False
              b=parts[-1].lower()
              if b in {'readme.md','changelog.md','license','license.txt','package_profile.json'}:return False
              if b.endswith(('.sql','.sqlite','.sqlite3','.db','.log','.zip','.tar','.gz','.bak','.tmp')):return False
              if len(parts)==1:return rel in {'vf-tool-m3u8.php','uninstall.php','plugin-manifest.json','tool-settings.schema.json'}
              return parts[0] in {'admin','config','includes','public','templates','tools'}
          rows=[]
          for p in sorted((x for x in root.rglob('*') if x.is_file()), key=lambda x:x.relative_to(root).as_posix()):
              rel=p.relative_to(root).as_posix()
              if runtime(rel):rows.append((rel,hashlib.sha256(p.read_bytes()).hexdigest()))
          canonical=b''.join(rel.encode()+b'\0'+sha.encode()+b'\n' for rel,sha in rows)
          Path('/tmp/m3_runtime_count').write_text(str(len(rows)))
          Path('/tmp/m3_runtime_fp').write_text(hashlib.sha256(canonical).hexdigest())
          PY
          (cd stage && zip -X -q -r "../dist/$ASSET" vf-tool-m3u8)
          unzip -tq "dist/$ASSET" >/dev/null
          test "$(unzip -Z1 "dist/$ASSET" | cut -d/ -f1 | sort -u)" = "vf-tool-m3u8"
          unzip -p "dist/$ASSET" vf-tool-m3u8/vf-tool-m3u8.php | grep -Fq 'Version: 1.25.34'
          sha256sum "dist/$ASSET" | awk '{print $1}' > /tmp/m3_sha
          stat -c '%s' "dist/$ASSET" > /tmp/m3_bytes
      - name: Previous M3U8 release rollback source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh release download "$PREVIOUS_TAG" --repo "$REPO" --pattern "$PREVIOUS_ASSET" --dir previous
          unzip -tq "previous/$PREVIOUS_ASSET" >/dev/null
          unzip -p "previous/$PREVIOUS_ASSET" vf-tool-m3u8/vf-tool-m3u8.php | grep -Fq 'Version: 1.25.33'
      - name: Publish and read back M3U8 release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            j="$(gh api "repos/$REPO/releases/tags/$TAG")"
            test "$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')" = "$SHA"
          else
            cat > /tmp/m3-notes.md <<EOF
          # VF Tools M3U8 V1.25.34
          S01-C03 OPS Header Alignment R6.
          - Unified shell/header/local navigation/content/special surfaces.
          - Flattens Compatibility/page identity and keeps quiet teal text + underline current navigation.
          - 14 canonical admin pages × 3 viewports final main Browser Gate $MAIN_GATE_RUN PASS.
          - Provider algorithm/domain state/schema migration: NONE.
          - Rollback source: $PREVIOUS_TAG.
          - OWNER explicitly authorized direct Formal Release + Production update.
          EOF
            gh release create "$TAG" "dist/$ASSET#VF Tools M3U8 $VERSION" --repo "$REPO" --target "$SHA" --title "VF Tools M3U8 V$VERSION" --notes-file /tmp/m3-notes.md
            j="$(gh api "repos/$REPO/releases/tags/$TAG")"
          fi
          aid="$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.id' <<<"$j")"
          rbytes="$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.size' <<<"$j")"
          rdigest="$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.digest' <<<"$j")"
          lbytes="$(cat /tmp/m3_bytes)"
          lsha="$(cat /tmp/m3_sha)"
          test -n "$aid" && test "$aid" != null
          test "$rbytes" = "$lbytes"
          test "$rdigest" = "sha256:$lsha"
          test "$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')" = "$SHA"
          rm -rf /tmp/m3-readback && mkdir -p /tmp/m3-readback
          gh release download "$TAG" --repo "$REPO" --pattern "$ASSET" --dir /tmp/m3-readback --clobber
          test "$(sha256sum "/tmp/m3-readback/$ASSET" | awk '{print $1}')" = "$lsha"
          cmp "dist/$ASSET" "/tmp/m3-readback/$ASSET"
          cat > /tmp/m3-release-receipt.json <<EOF
          {"component_id":"S01-C03","version":"$VERSION","source_sha":"$SHA","tag":"$TAG","asset":"$ASSET","asset_id":$aid,"asset_bytes":$lbytes,"asset_sha256":"$lsha","runtime_files":$(cat /tmp/m3_runtime_count),"runtime_fingerprint":"$(cat /tmp/m3_runtime_fp)","main_gate_run":$MAIN_GATE_RUN,"owner_authorization":"PASS","remote_readback":"PASS"}
          EOF
      - name: Upload M3U8 release receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c03-12533-formal-release-${{ github.run_id }}
          path: /tmp/m3-release-receipt.json
          if-no-files-found: error
          retention-days: 30
