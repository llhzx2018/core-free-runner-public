name: TEMP S01-C02 v1.21.820 Update Channel Gate
on:
  push:
    branches: [temp/s01-c02-v121820-preflight-authority-scan-20260905]
    paths: ['.github/workflows/temp-s01-c02-v121820-update-channel-gate.yml']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CORE_BASE: c177787de0dce6c300fb2e76085cb062fd7fc890
      CORE_SHA: a4945d2dbc514ec7d5d8c9ea80ffd5120bb19478
      OPS_SHA: 562827263f4d8fe93aee3ea6fb445164cfa5242a
      OPS_TREE: 9bee1ffdbec4321fab9bfe9570aa54968c8d1027
      ASSET_NAME: vf-tools-ops_V1.21.820.zip
      ASSET_BYTES: '3235541'
      ASSET_SHA: 3627eba025cd2b8b64b3a5ebf0e9b325f6f92103ad200aa064cb9bef42519317
      RUNTIME_FP: a991ecfba95317581ca90f65e5c4003b70558023a3f85cf5be7ec19e9189755c
      RELEASE_ID: '383208522'
      ASSET_ID: '545675309'
      RELEASED_AT: '2026-09-05T10:08:46Z'
    steps:
      - name: Checkout exact update candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CORE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: core
      - name: Gate update channel and live Production source
        shell: bash
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          main=$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/core-updates/branches/main | jq -r '.commit.sha')
          test "$main" = "$CORE_BASE"
          test "$(git -C core rev-list --count "$CORE_BASE..$CORE_SHA")" = 1
          test "$(git -C core rev-list --count "$CORE_SHA..$CORE_BASE")" = 0
          test "$(git -C core diff --name-only "$CORE_BASE" "$CORE_SHA" | wc -l)" = 1
          test "$(git -C core diff --name-only "$CORE_BASE" "$CORE_SHA")" = 'projects/S01-C02.json'
          j=$(cat core/projects/S01-C02.json)
          test "$(jq -r '.target_version' <<<"$j")" = '1.21.820'
          test "$(jq -c '.from_versions' <<<"$j")" = '["1.21.819"]'
          test "$(jq -r '.release_tag' <<<"$j")" = 'v1.21.820'
          test "$(jq -r '.asset_name' <<<"$j")" = "$ASSET_NAME"
          test "$(jq -r '.asset_bytes' <<<"$j")" = "$ASSET_BYTES"
          test "$(jq -r '.asset_sha256' <<<"$j")" = "$ASSET_SHA"
          test "$(jq -r '.schema_from' <<<"$j")" = '6.0.0'
          test "$(jq -r '.schema_to' <<<"$j")" = '6.0.0'
          test "$(jq -r '.physical_locator' <<<"$j")" = 'vf-ops/vf-ops.php'
          test "$(jq -r '.plugin_file' <<<"$j")" = 'vf-ops/vf-ops.php'
          test "$(jq -r '.runtime_files' <<<"$j")" = '905'
          test "$(jq -r '.runtime_file_count' <<<"$j")" = '905'
          test "$(jq -r '.runtime_fingerprint' <<<"$j")" = "$RUNTIME_FP"
          test "$(jq -r '.runtime_fingerprint_sha256' <<<"$j")" = "$RUNTIME_FP"
          test "$(jq -r '.released_at' <<<"$j")" = "$RELEASED_AT"
          grep -Fq "$OPS_SHA" core/projects/S01-C02.json
          grep -Fq "$OPS_TREE" core/projects/S01-C02.json
          grep -Fq 'Candidate Gate 33959769180 PASS' core/projects/S01-C02.json
          grep -Fq 'Formal Release 33959854423 PASS' core/projects/S01-C02.json
          grep -Fq "Release ID $RELEASE_ID" core/projects/S01-C02.json
          grep -Fq "asset ID $ASSET_ID" core/projects/S01-C02.json

          rel=$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.820)
          test "$(jq -r '.id' <<<"$rel")" = "$RELEASE_ID"
          test "$(jq -r '.target_commitish' <<<"$rel")" = "$OPS_SHA"
          test "$(jq -r '.published_at' <<<"$rel")" = "$RELEASED_AT"
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[] | select(.name==$n) | .id' <<<"$rel")" = "$ASSET_ID"
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[] | select(.name==$n) | .size' <<<"$rel")" = "$ASSET_BYTES"
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[] | select(.name==$n) | .digest' <<<"$rel")" = "sha256:$ASSET_SHA"
          opsmain=$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/vf-tools-ops/branches/main | jq -r '.commit.sha')
          opsdev=$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/vf-tools-ops/branches/develop | jq -r '.commit.sha')
          test "$opsmain" = "$OPS_SHA"
          test "$opsdev" = "$OPS_SHA"
          tree=$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/vf-tools-ops/git/commits/$OPS_SHA | jq -r '.tree.sha')
          test "$tree" = "$OPS_TREE"
          echo FORMAL_RELEASE_ASSET=PASS

          prod=$(curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-domain-authority')
          test "$(jq -r '.pluginVersion' <<<"$prod")" = '1.21.819'
          test "$(jq -r '.status' <<<"$prod")" = 'CURRENT'
          test "$(jq -r '.authorityFinalHost' <<<"$prod")" = 'https://ilovem3u8.com'
          test "$(jq -r '.configuredPublicBaseUrl' <<<"$prod")" = 'https://ilovem3u8.com'
          test "$(jq -r '.authorityMatch' <<<"$prod")" = 'true'
          echo DIRECT_PRODUCTION_1_21_819_ONLY=PASS
          echo PASS_V121820_UPDATE_CHANNEL_GATE
