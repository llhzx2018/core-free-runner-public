name: TEMP S01-C02 Ops 1.21.846 Readiness Key Index
on:
  push:
    paths:
      - '.github/workflows/temp-s01-c02-v121846-readiness-key-index.yml'
permissions:
  contents: read
jobs:
  index:
    runs-on: ubuntu-24.04
    steps:
      - name: Print matching field names only
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-static-candidate-readiness' -o /tmp/static.json
          test "$(jq -r '.pluginVersion // empty' /tmp/static.json)" = '1.21.846'
          jq -r 'keys[]' /tmp/static.json | grep -Ei 'failure|error|helper|build|candidate|structural|retry|stage|step|class' | sort -u
          echo PASS_V121846_READINESS_KEY_INDEX
