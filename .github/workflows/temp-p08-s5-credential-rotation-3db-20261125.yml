name: TEMP P08 S5 credential rotation three-engine regression
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p08-s5-credential-rotation-3db-20261125.yml'
permissions:
  contents: read
concurrency:
  group: p08-s5-rotation-3db-20261125
  cancel-in-progress: false
env:
  TARGET_REPO: llhzx2018/vf-adops
  TARGET_VERSION: '0.1.18'
  TARGET_SHA: c938c0d86e1a34b2d998543b0c49e7a1e03302f9
  TARGET_TREE: 529a404c0fbdfdcc1866554cfde92549a5ededb5
jobs:
  identity-preflight:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/p08-s5-credential-rotation-3db-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Audit exact source identity and one-off workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          python3 scripts/ephemeral_lane_spec.py audit-rendered --spec specs/ephemeral/p08-s5-credential-rotation-3db-20261125.json --input .github/workflows/temp-p08-s5-credential-rotation-3db-20261125.yml > "$RUNNER_TEMP/p08-s5-rotate-audit.log"
          echo P08_S5_ROTATION_SPEC_PREFLIGHT=PASS
  rotation-three-databases:
    needs: identity-preflight
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/p08-s5-credential-rotation-3db-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        engine: [sqlite, mysql, mariadb]
    services:
      database:
        image: ${{ matrix.engine == 'mariadb' && 'mariadb:11.8' || 'mysql:8.4' }}
        env:
          MYSQL_ROOT_PASSWORD: p08_s5_rotate_disposable_2026
          MYSQL_DATABASE: p08_ci_s5_rotate
        ports:
          - 3306:3306
        options: >-
          --health-cmd="sh -c 'mariadb-admin ping --silent || mysqladmin ping --silent'"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      GITHUB_ACTIONS: 'true'
      CI: 'true'
      P08_ISOLATED_INSTALL_TEST: 'YES'
      P08_ROTATE_TEST_ENGINE: ${{ matrix.engine }}
      APP_ENV: testing
      APP_KEY: 'base64:UVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVE='
      DB_HOST: '127.0.0.1'
      DB_PORT: '3306'
      DB_DATABASE: p08_ci_s5_rotate
      DB_USERNAME: root
      DB_PASSWORD: p08_s5_rotate_disposable_2026
      SESSION_DRIVER: array
      CACHE_STORE: array
    steps:
      - name: Exact transient private S9 candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: c938c0d86e1a34b2d998543b0c49e7a1e03302f9
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: transient-p08
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_mysql, pdo_sqlite, sqlite3, zip, mbstring, intl, bcmath, dom, fileinfo
      - uses: actions/setup-node@v4
        if: matrix.engine == 'sqlite'
        with:
          node-version: '22'
      - name: Build and validate same real S5 credential lifecycle
        shell: bash
        working-directory: transient-p08
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(cat VERSION)" = "$TARGET_VERSION"
          php -l app/Http/Controllers/TrackerCenterController.php > "$RUNNER_TEMP/p08-s5-rotate-php.log" 2>&1 || { echo P08_S5_ROTATION_PHP_LINT=FAIL; exit 1; }
          php -l routes/web.php > "$RUNNER_TEMP/p08-s5-rotate-route.log" 2>&1 || { echo P08_S5_ROTATION_ROUTE_LINT=FAIL; exit 1; }
          php -l tests/Feature/TrackerCredentialRotationTest.php > "$RUNNER_TEMP/p08-s5-rotate-test-lint.log" 2>&1 || { echo P08_S5_ROTATION_TEST_LINT=FAIL; exit 1; }
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          composer install --no-scripts --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/p08-s5-rotate-composer.log" 2>&1 || { echo P08_S5_ROTATION_COMPOSER=FAIL; exit 1; }
          echo P08_S5_ROTATION_LOCKED_COMPOSER=PASS
          if [[ "$P08_ROTATE_TEST_ENGINE" == sqlite ]]; then
            npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-s5-rotate-npm.log" 2>&1 || { echo P08_S5_ROTATION_NPM=FAIL; exit 1; }
            npm run typecheck > "$RUNNER_TEMP/p08-s5-rotate-ts.log" 2>&1 || { echo P08_S5_ROTATION_TYPECHECK=FAIL; exit 1; }
            npm run build > "$RUNNER_TEMP/p08-s5-rotate-vite.log" 2>&1 || { echo P08_S5_ROTATION_VITE=FAIL; exit 1; }
            echo P08_S5_ROTATION_VUE_TYPECHECK_VITE=PASS
          fi
          php vendor/bin/phpunit --no-coverage --colors=never --log-junit "$RUNNER_TEMP/p08-s5-rotate-junit.xml" tests/Feature/TrackerCredentialRotationTest.php > "$RUNNER_TEMP/p08-s5-rotate-feature.log" 2>&1 || {
            echo P08_S5_ROTATION_FEATURE=FAIL
            python3 -c 'import sys,re,xml.etree.ElementTree as E; r=E.parse(sys.argv[1]).getroot(); c=list(r.iter("testcase")); f=[(x.attrib.get("name","UNKNOWN"),next((y for y in x if y.tag in ("failure","error")),None)) for x in c if x.find("failure") is not None or x.find("error") is not None]; print("P08_S5_TEST_COUNTS="+str(len(c))+";failed="+str(len(f))); [print("P08_S5_FAILED_TEST="+n[:90]+";type="+v.attrib.get("type","UNKNOWN")[:90]+";source_line="+(m.group(1) if (m:=re.search(r"TrackerCredentialRotationTest\.php:(\d+)",v.text or "")) else "UNKNOWN")) for n,v in f[:8]]' "$RUNNER_TEMP/p08-s5-rotate-junit.xml" || echo P08_S5_TEST_DETAILS=NOT_CAPTURED
            exit 1
          }
          echo P08_S5_ROTATION_FEATURE=PASS
          if [[ "$P08_ROTATE_TEST_ENGINE" == sqlite ]]; then
            php vendor/bin/phpunit --no-coverage --colors=never tests/Feature/TrackerCenterWorkflowTest.php tests/Feature/BeMobTrackerWorkflowTest.php > "$RUNNER_TEMP/p08-s5-rotate-existing.log" 2>&1 || { echo P08_S5_EXISTING_TRACKER_REGRESSIONS=FAIL; exit 1; }
            echo P08_S5_EXISTING_TRACKER_REGRESSIONS=PASS
          fi
          echo P08_S5_ROTATION_NO_REAL_PROVIDER_OR_PRODUCTION=PASS
      - name: Remove private checkout and synthetic logs
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- transient-p08
          rm -f -- "$RUNNER_TEMP"/p08-s5-rotate-*.log "$RUNNER_TEMP/p08-s5-rotate-junit.xml"
          test ! -e transient-p08
          echo P08_S5_ROTATION_PRIVATE_CLEANUP=PASS
