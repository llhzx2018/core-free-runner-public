name: p01-v247497-coreupdates-distribution-preflight
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-v247497-coreupdates-temp.yml']
permissions:
  contents: read
jobs:
  p01-distribution-exact:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DIST_REPO: llhzx2018/core-updates
      DIST_BRANCH: release/p01-v247497-atomic-distribution-20261106
      DIST_SHA: 5c4ebe84aa435591f76f23e7f8382cde89d213ab
      DIST_BASE: a1c1d740de4eab1b5ff0ae4139556b35d86fab5f
    steps:
      - name: Checkout trusted public control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact distribution candidate, manifest schema and Update Core contract
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          test -n "$READ_TOKEN"
          ROOT="$(mktemp -d /tmp/p01-coreupdates-247497.XXXXXXXX)"
          trap 'rm -rf "$ROOT"' EXIT
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli >/dev/null
          git clone -q --depth 2 --branch "$DIST_BRANCH" "https://x-access-token:$READ_TOKEN@github.com/$DIST_REPO.git" "$ROOT/candidate"
          test "$(git -C "$ROOT/candidate" rev-parse HEAD)" = "$DIST_SHA"
          test "$(git -C "$ROOT/candidate" rev-parse HEAD^)" = "$DIST_BASE"
          git -C "$ROOT/candidate" remote set-url origin "https://github.com/$DIST_REPO.git"
          unset READ_TOKEN
          test "$(git -C "$ROOT/candidate" diff --name-only "$DIST_BASE" "$DIST_SHA")" = "projects/P01.json"
          cd "$ROOT/candidate"
          python3 scripts/check_manifest_contract.py >"$ROOT/manifest-audit.json"
          python3 - "$ROOT/manifest-audit.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf8'))
          assert d.get('status')=='PASS', 'manifest contract status FAIL'
          p=[x for x in d['results'] if x['path']=='projects/P01.json']
          assert len(p)==1 and not p[0]['failures'], 'P01 schema contract FAIL'
          print("P01_CORE_UPDATES_MANIFEST_CONTRACT=PASS")
          PY
          python3 - <<'PY'
          import json,re,pathlib
          m=json.loads(pathlib.Path('projects/P01.json').read_text())
          assert m['enabled'] is True
          assert m['project_id']=='P01' and m['component_id']=='APP'
          assert m['update_type']=='ATOMIC'
          assert m['current_version']=='2.47.496' and m['target_version']=='2.47.497'
          assert m['from_versions']==['2.47.496']
          assert m['schema_from']==m['schema_to']=='2026102201'
          assert m['release_tag']=='v2.47.497' and m['release_id']==436210582
          assert m['product_identity']=='061b60f9a8b5866b2cde11a1d4ce554398186434'
          assert m['asset_name']=='VF_Start_V2.47.497_UPDATE.zip'
          assert m['asset_bytes']==3776627
          assert m['asset_sha256']=='ddcc97b7406830f4850e10e5bd47283e78203c5b209f3bb5dd3a74767342dee8'
          assert m['backup_required'] is True and m['rollback_supported'] is True
          assert re.fullmatch(r'2026-11-06T07:21:29Z',m['released_at'])
          print("P01_CORE_UPDATES_EXACT_RELEASE_ASSET=PASS")
          print("P01_CORE_UPDATES_OWNER_MANUAL_UPGRADE=YES")
          PY
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          echo P01_CORE_UPDATES_PHP_SYNTAX=PASS
          php update-core/php/tests/run.php >"$ROOT/update-core-tests.log"
          tail -n 6 "$ROOT/update-core-tests.log"
          echo P01_CORE_UPDATES_ENGINE_TEST=PASS
          echo P01_CORE_UPDATES_EXACT_SHA=$DIST_SHA
      - name: No public source persistence or Production actions
        if: always()
        shell: bash
        run: |
          echo P01_CORE_UPDATES_RUNNER_PR_CLOSE_UNMERGED=YES
          echo P01_CORE_UPDATES_PRODUCTION_CHANGED=NO
          echo P01_CORE_UPDATES_PUBLIC_PRIVATE_SOURCE_ARTIFACT=NONE
