name: P01 real radio sources bounded provenance and browser-CORS probe
on:
  push:
    branches: [task/p01-radio-real-source-probe-20261028]
    paths:
      - '.github/workflows/p01-radio-real-source-probe-20261028.yml'
      - 'checks/p01-radio-real-source-20261028.py'
permissions:
  contents: read
jobs:
  radio:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout public probe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Public provider directory and audio CORS headers (no recording)
        run: |
          set -euo pipefail
          python3 checks/p01-radio-real-source-20261028.py
          python3 -m json.tool p01-radio-source-evidence.json >/dev/null
      - name: Play real candidate audio briefly in headless Chrome (no capture)
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix checks --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright-core@1.55.1 >/dev/null
          curl --proto '=https' --tlsv1.2 -fsSL --max-time 25 \
            'https://cdn.jsdelivr.net/npm/hls.js@1.7.3/dist/hls.light.min.js' -o /tmp/p01-radio-hls.min.js
          echo '0251332c00a216a35d7d6919044d60da82b78beb3bd50ac6c662ae74a2f5474b  /tmp/p01-radio-hls.min.js' | sha256sum -c -
          python3 -m http.server 18818 --bind 127.0.0.1 >/tmp/p01-radio-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; rm -f /tmp/p01-radio-hls.min.js' EXIT
          sleep 1
          node checks/p01-radio-live-chrome-20261028.cjs p01-radio-source-evidence.json /tmp/p01-radio-hls.min.js
      - name: Persist public metadata only
        uses: actions/upload-artifact@v4
        with:
          name: p01-radio-probe-${{ github.run_id }}
          path: |
            p01-radio-source-evidence.json
            p01-radio-chrome-evidence.json
          retention-days: 7
