name: P01 V2.31 Formal Artifact Gate
on:
  push:
    branches: [task/p01-v2310-formal-release-20260829]
    paths:
      - .github/workflows/p01-v2310-formal-artifact-gate-20260829.yml
      - scripts/p01-v2310-build-artifacts.py
      - scripts/p01-v2310-formal-gate.sh
permissions:
  contents: read
jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout gate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: runner
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - name: Checkout V2.31 release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: 0dfc6c7b1b76ca3cec750daed97f5c4ba51b47f4
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: candidate
      - name: Checkout V2.30 immutable production source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.30.0
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: production
      - name: Checkout proven Atomic builder
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: agent/p01-22121-formal-artifact-gate-20260819
          path: proven
      - name: Bind immutable source authority
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C production rev-parse HEAD)" = 40b2d5239c557ab6c7b9aaaa092acffa9fb926f9
          test "$(git -C production rev-parse HEAD^{tree})" = 771125988f07c01740e4b3dc3863ff90ebcdc5dd
          test "$(git -C production rev-parse HEAD:src)" = 500d485c5eda15f65cd59a61c5a6ad5a7c519f8b
          echo P01_V230_IMMUTABLE_TAG_AUTHORITY=PASS
          echo P01_V2310_REMOTE_HTTP_GATE=DEFERRED_UNTIL_PUBLISHED_UPDATE
      - name: Exact source and formal artifact gate
        shell: bash
        run: bash runner/scripts/p01-v2310-formal-gate.sh
      - name: Assemble immutable formal artifact contract
        shell: bash
        run: |
          set -Eeuo pipefail
          SRC=/tmp/p01-v2310-artifacts
          EVID=/tmp/p01-v2310-formal-evidence
          OUT=/tmp/p01-v2310-formal-contract
          rm -rf "$OUT" && mkdir -p "$OUT"
          cp "$SRC/VF-Start-V2.31.0-FULL.zip" "$OUT/"
          cp "$SRC/VF_Start_V2.31.0_UPDATE.zip" "$OUT/"
          cp "$SRC/VF_Start_V2.31.0_UPDATE.zip" "$OUT/VF-Start-V2.31.0-UPDATE.zip"
          cp "$SRC/repair-v2.31.0.php" "$OUT/"
          cp "$EVID/repair-self-test.json" "$OUT/atomic-self-test.json"
          cp "$SRC/P01-V2.31.0-FORMAL-GATE.json" "$OUT/P01-V2.31.0-ARTIFACT-GATE.json"
          FULL_SHA=$(sha256sum "$OUT/VF-Start-V2.31.0-FULL.zip" | awk '{print $1}')
          UPDATE_SHA=$(sha256sum "$OUT/VF_Start_V2.31.0_UPDATE.zip" | awk '{print $1}')
          REPAIR_SHA=$(sha256sum "$OUT/repair-v2.31.0.php" | awk '{print $1}')
          FULL_BYTES=$(stat -c%s "$OUT/VF-Start-V2.31.0-FULL.zip")
          UPDATE_BYTES=$(stat -c%s "$OUT/VF_Start_V2.31.0_UPDATE.zip")
          REPAIR_BYTES=$(stat -c%s "$OUT/repair-v2.31.0.php")
          jq -n \
            --arg project_id P01 --arg version 2.31.0 --arg source_version 2.30.0 \
            --arg release_source 0dfc6c7b1b76ca3cec750daed97f5c4ba51b47f4 \
            --arg release_tree f568820198afde57fe3c1522820f45bbbf6e0c96 \
            --arg product_source d541b7bb18d40705ec03f951fad3ed661aa11991 \
            --arg product_tree 7e5eaed15187f48686ae3eb67ff91a63085ca003 \
            --arg runtime_tree 772d51ebbc9f8cd6791c0601d29f6b3b2a95a086 \
            --arg source_commit 40b2d5239c557ab6c7b9aaaa092acffa9fb926f9 \
            --arg schema 2026082901 --arg full_sha "$FULL_SHA" --arg update_sha "$UPDATE_SHA" --arg repair_sha "$REPAIR_SHA" \
            --argjson full_bytes "$FULL_BYTES" --argjson update_bytes "$UPDATE_BYTES" --argjson repair_bytes "$REPAIR_BYTES" \
            '{project_id:$project_id,version:$version,source_version:$source_version,release_source:$release_source,release_tree:$release_tree,product_source:$product_source,product_tree:$product_tree,runtime_tree:$runtime_tree,source_commit:$source_commit,source_schema:$schema,schema:$schema,schema_change:false,schema_migrations:[],formal_artifact_gate:"PASS",actual_upgrade:"PASS",data_preservation:"PASS",public_private_db:"PASS",remote_online_update_http:"PENDING_AFTER_PUBLICATION",rollback:"PASS",interruption_recovery:"PASS",fresh_install:"PASS",release_published:false,owner_production_write:false,full:{name:"VF-Start-V2.31.0-FULL.zip",bytes:$full_bytes,sha256:$full_sha},update:{name:"VF_Start_V2.31.0_UPDATE.zip",bytes:$update_bytes,sha256:$update_sha,inner:"repair-v2.31.0.php"},repair:{name:"repair-v2.31.0.php",bytes:$repair_bytes,sha256:$repair_sha}}' > "$OUT/P01-V2.31.0-FORMAL-METADATA.json"
          (cd "$OUT" && sha256sum P01-V2.31.0-ARTIFACT-GATE.json P01-V2.31.0-FORMAL-METADATA.json VF-Start-V2.31.0-FULL.zip VF-Start-V2.31.0-UPDATE.zip VF_Start_V2.31.0_UPDATE.zip atomic-self-test.json repair-v2.31.0.php > SHA256SUMS.txt)
          test "$(find "$OUT" -maxdepth 1 -type f | wc -l)" = 8
          php -l "$OUT/repair-v2.31.0.php" >/dev/null
          unzip -Z1 "$OUT/VF_Start_V2.31.0_UPDATE.zip" | grep -Fx repair-v2.31.0.php >/dev/null
          echo "FORMAL_FULL_SHA256=$FULL_SHA"
          echo "FORMAL_UPDATE_SHA256=$UPDATE_SHA"
          echo "FORMAL_REPAIR_SHA256=$REPAIR_SHA"
          echo P01_V2310_FORMAL_ARTIFACT_CONTRACT=PASS
      - name: Upload formal artifacts
        uses: actions/upload-artifact@v4
        with:
          name: p01-v2310-formal-artifacts-0dfc6c7b1b76ca3cec750daed97f5c4ba51b47f4
          path: /tmp/p01-v2310-formal-contract
          if-no-files-found: error
          retention-days: 90
      - name: Upload upgrade evidence
        uses: actions/upload-artifact@v4
        with:
          name: p01-v2310-formal-evidence-0dfc6c7b1b76ca3cec750daed97f5c4ba51b47f4
          path: /tmp/p01-v2310-formal-evidence
          if-no-files-found: error
          retention-days: 30
      - name: Verdict
        shell: bash
        run: |
          echo P01_V2310_FORMAL_RELEASE_SOURCE=0dfc6c7b1b76ca3cec750daed97f5c4ba51b47f4
          echo P01_V2310_PRODUCT_SOURCE=d541b7bb18d40705ec03f951fad3ed661aa11991
          echo P01_V2310_FORMAL_ARTIFACT_GATE=PASS
          echo P01_V2310_READY_FOR_MAIN_PROMOTION=YES
          echo P01_V2310_REMOTE_HTTP_GATE=PENDING_AFTER_PUBLICATION
          echo RELEASE_PUBLISHED=NO
          echo OWNER_PRODUCTION_WRITE=NO
