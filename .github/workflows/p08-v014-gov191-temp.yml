name: P08 v0.1.4 GOV #191 exact machine governance (TEMP)
on:
  pull_request:
    paths: [.github/workflows/p08-v014-gov191-temp.yml]
permissions:
  contents: read
jobs:
  governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Transient exact private GOV-DOC PR 191 checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 9574e7a849c5a56cad4b7aef18b2b1f0cb4e0fcb
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: .gov-source
          persist-credentials: false
          fetch-depth: 0
      - name: Governance source and complete existing negative suite
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rm -rf -- "$GITHUB_WORKSPACE/.gov-source"' EXIT
          cd .gov-source
          test "$(git rev-parse HEAD)" = "9574e7a849c5a56cad4b7aef18b2b1f0cb4e0fcb"
          python3 -B governance/agent/takeover_context_budget_lint.py
          python3 -B governance/public-authority/tools/public_authority_router_lint.py
          python3 -B governance/public-authority/tools/public_authority_skill_bridge_lint.py
          python3 -B governance/catalog/tools/doc_structure_lint.py
          python3 -B governance/public-authority/tools/current_dependency_lint.py
          python3 -B governance/public-authority/tools/system_install_upgrade_contract_lint.py
          python3 -B governance/public-authority/tools/global_closure_lint.py
          python3 -B governance/public-authority/tools/global_closure_lint.py --resolve-trigger bootstrap
          PR_BODY='PUBLIC_AUTHORITY_IMPACT: UPDATED AFFECTED_DOMAINS: INSTALL, SECURITY, TESTING, UPGRADE, DATA_SCHEMA, API_PROVIDER, CRON_JOB, OBSERVABILITY, PERFORMANCE, GIT, UA_UI IMPACT_REASON: one scoped P08 human timing only'
          export PR_BODY
          python3 -B governance/public-authority/tools/current_dependency_lint.py --git-base d1f5d18a5efd475131d39bf83cfb17178af82da3 --git-head 9574e7a849c5a56cad4b7aef18b2b1f0cb4e0fcb
          python3 -B governance/public-authority/tools/global_closure_lint.py --git-base d1f5d18a5efd475131d39bf83cfb17178af82da3 --git-head 9574e7a849c5a56cad4b7aef18b2b1f0cb4e0fcb
          echo P08_GOV191_EXACT_GIT_IMPACT_REVIEW=PASS
          python3 -B -m unittest discover -s governance/agent -p 'test_*.py' -q
          python3 -B -m unittest discover -s governance/public-authority/tools -p 'test_*.py' -q
          python3 -B -m unittest discover -s governance/public-authority/tests -p 'test_*.py' -q
          python3 -B -m unittest discover -s governance/catalog/tools -p 'test_*.py' -q
          echo P08_GOV191_EXACT_SKILL_MODE_N_13DOMAIN_NEGATIVE_SUITE=PASS
      - name: No private GOV source in public artifact
        if: always()
        shell: bash
        run: rm -rf -- "$GITHUB_WORKSPACE/.gov-source"
