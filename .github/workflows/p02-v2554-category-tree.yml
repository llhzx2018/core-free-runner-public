name: P02 V2.5.54 Category Tree UX Gate

on:
  push:
    branches:
      - run/p02-v2554-category-tree-20260920
    paths:
      - '.github/workflows/p02-v2554-category-tree.yml'

permissions:
  contents: read

jobs:
  ux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_SHA: fce38f21db6632c90383cfbbaa12484c4f3d8d4f
      TARGET_VERSION: 2.5.54
    steps:
      - name: Checkout exact P02 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: fce38f21db6632c90383cfbbaa12484c4f3d8d4f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product

      - name: Install runtime and Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-zip sqlite3 curl
          cd product
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify source and category-tree contracts
        shell: bash
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "$TARGET_VERSION"
          bash scripts/verify-repository.sh
          node tests/unit/p02_v2554_category_tree_convergence.mjs
          node tests/unit/p02_v2542_inkstone_reference_contract.mjs
          node tests/unit/p02_v2540_final_ux_convergence.mjs
          node tests/unit/p02_runtime_style_single_entry.mjs
          node tests/unit/p02_candidate_version_identity_contract.mjs
          echo P02_V2554_CATEGORY_TREE_SOURCE_GATE=PASS

      - name: Real Chromium UX regression
        shell: bash
        working-directory: product
        run: |
          set -Eeuo pipefail
          bash scripts/ux-browser-reverify.sh | tee /tmp/p02-v2554-browser.log
          grep -Fx 'P02_V2554_CATEGORY_TREE_RHYTHM=PASS' /tmp/p02-v2554-browser.log
          echo P02_V2554_CATEGORY_TREE_BROWSER_GATE=PASS
