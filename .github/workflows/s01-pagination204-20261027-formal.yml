name: S01 Theme exact formal release
on:
  push:
    branches: [task/s01-pagination204-20261027]
    paths: ['.github/workflows/s01-pagination204-20261027-formal.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.204
  TARGET_SHA: f7acf35d7d4898afb4d45e672089636fa5172336
  TARGET_TREE: 3ca7d0881754bbdc51cee0b723bd0743d87dca31
  BASE_SHA: b890208623e6707834a3009931e35555f2b03250
  LANE_ID: s01-pagination204-20261027
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - name: Formal identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-pagination204-20261027/formal-spec.json --input control/.github/workflows/s01-pagination204-20261027-formal.yml
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: f7acf35d7d4898afb4d45e672089636fa5172336
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact candidate, merged tree and required evidence readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider candidate-proof
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40427654934 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40427654934 --jq .head_sha)" = 982129c5f2b261b3e66ccb0e26f901d8fa446b3f
          test "$(gh api repos/$TARGET_REPO/commits/main --jq .sha)" = "$TARGET_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$TARGET_SHA --jq .tree.sha)" = "$TARGET_TREE"
          gh run download 40427654934 --repo llhzx2018/core-free-runner-public --name s01-home-40427654934 --dir candidate-proof
          cmp candidate-proof/state-before.sha256 candidate-proof/state-after.sha256
          cmp candidate-proof/contracts-before.json candidate-proof/contracts-after.json
          python3 control/lanes/s01-pagination204-20261027/package.py
          python3 - <<'PYVERIFY'
          import json,pathlib,subprocess,urllib.parse
          r=pathlib.Path('candidate-proof')
          old=json.loads((r/'package.json').read_text());new=json.loads(pathlib.Path('proof/package.json').read_text())
          assert old['source']=='21212a0bda8134ee607b773701f89a62e4699021'
          for phase in ['before','after','smoke']:
              result=json.loads((r/('pagination-'+phase+'.json')).read_text())
              assert result['status']=='PASS' and len(result['rows'])==18 and result['errors']==[] and result['writes']==[]
          result=json.loads((r/'pagination-after.json').read_text())
          assert result['checks']>=400
          assert result['contentHeadURLs']=='BYTE_IDENTICAL'
          assert result['sharedControl']=='SAME_COMPUTED_STYLE_9_ROUTES_2_LANGUAGES_2_WIDTHS'
          assert result['legacy']=='CSS_CONSUMER_DOM_SHAPE_VERIFIED_NOT_PUBLIC_ROUTE'
          assert result['operationalAcceptance']=='OWNER_REVIEW_REQUIRED_AFTER_MANUAL_UPGRADE'
          for lang in ['zh','en']:
              for family in ['blog','guides','problems','glossary','category','tag','author','date','search']:
                  for width in [1440,1024]:
                      assert (r/f'pagination-{lang}-{family}-{width}.png').stat().st_size>500
                      corrected=json.loads((r/f'metrics-after-{lang}-{family}-{width}.json').read_text())
                      for k in ['root','container']:assert all(x==0 for x in corrected[k]['border'])
                      assert corrected['container']['background']=='rgba(0, 0, 0, 0)'
                      assert corrected['link']['radius']=='7px' and corrected['link']['font']=='14px'
                      assert corrected['current']['height']>=44
                  for kind in ['hover','focus']:assert (r/f'pagination-{kind}-{lang}-{family}.png').stat().st_size>500
          assert json.loads((r/'clean-install.json').read_text())['status']=='PASS'
          assert json.loads((r/'bootstrap.json').read_text())['status']=='PASS'
          for k in ['status','version','tree','sha256','bytes','files']: assert old[k]==new[k],k
          assert new['sha256']=='581c3142205e432d670438b92e34df678909408e92298348a018e2faaa0e1386' and new['bytes']==2009064
          coverage=json.loads(pathlib.Path('control/lanes/s01-pagination204-20261027/release-authority.json').read_text())
          assert set(coverage['required'])=={'TESTING','GIT','UA_UI','SEO','SECURITY','INSTALL','UPGRADE','DATA_SCHEMA','PERFORMANCE'}
          assert coverage['source']=='21212a0bda8134ee607b773701f89a62e4699021' and coverage['tree']=='3ca7d0881754bbdc51cee0b723bd0743d87dca31'
          assert coverage['owner_preview_runtime']=='N_A'
          assert coverage['release_mode']=='PROJECT_PREVIEW_N_A'
          assert coverage['owner_real_use']=='POST_PRODUCTION_REQUIRED'
          assert coverage['production_auto_apply'] is False
          for item in coverage['required'].values():
              assert item['sha'] and item['acceptance']
              endpoint='repos/llhzx2018/gov-doc/contents/'+urllib.parse.quote(item['path'],safe='/')+'?ref=main'
              live=json.loads(subprocess.check_output(['gh','api',endpoint]))
              assert live['sha']==item['sha'],item['path']
              item['evidence_status']='PASS_EXACT_CANDIDATE_MACHINE'
          coverage['candidate_status']='PASS_EXACT_CANDIDATE_MACHINE'
          coverage['candidate_run']='40427654934'
          coverage['merged_source']='f7acf35d7d4898afb4d45e672089636fa5172336'
          coverage['formal_release_gate']='PASS'
          coverage['production_effect']='NOT_PROVEN_POST_MANUAL_UPGRADE_READBACK_REQUIRED'
          pathlib.Path('proof/public-authority-coverage.json').write_text(json.dumps(coverage,ensure_ascii=False,indent=2))
          print('MERGED_TREE_EQUALS_TESTED_TREE_AND_EXACT_PACKAGE_PASS')
          PYVERIFY
      - name: Publish only the exact verified package
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.35.204 --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create v1.35.204 provider/vf-tools-theme_V1.35.204.zip --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Theme V1.35.204' --notes '统一Theme-owned前台分页：参照此前博客/指南独立页码按钮，把博客、指南、问题、术语表、原生分类/标签/作者/日期归档及搜索的样式收归一个现有公共owner，移除外层整圈边框与页型分叉。页码44px、7px圆角、当前页绿色、hover/focus一致、省略号无框。真实WordPress/Chromium九路由双语1440/1024，首尾翻页与代表性无脚本GET验证；203到204内容/Head/URL一致、干净安装/升级回退重复安装及受保护数据保持。旧data-renderer形状单独CSS消费者验证，不冒充真实公开路由。仅CSS与版本/历史进度，476运行文件，bundle净减少约9KB。正文、语言、SEO、查询及保存逻辑不变；保留203术语表搜索与分隔线修复。最终运营验收待Owner手工升级，Production未自动修改，手机测试继续暂缓。' --latest
          fi
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/v1.35.204 --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh release view v1.35.204 --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - name: Authenticated remote ZIP byte comparison
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download v1.35.204 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.204.zip --dir remote
          cmp provider/vf-tools-theme_V1.35.204.zip remote/vf-tools-theme_V1.35.204.zip
          echo '581c3142205e432d670438b92e34df678909408e92298348a018e2faaa0e1386  remote/vf-tools-theme_V1.35.204.zip' | sha256sum -c
          test "$(stat -c %s remote/vf-tools-theme_V1.35.204.zip)" = 2009064
          gh release view v1.35.204 --repo "$TARGET_REPO" --json url,publishedAt,tagName > proof/formal-release.json
          echo FORMAL_RELEASE_EXACT_REMOTE_ASSET_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-home-formal-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target provider remote candidate-proof
