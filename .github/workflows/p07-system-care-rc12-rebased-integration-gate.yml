name: P07 System Care RC12 Rebased Integration Gate

on:
  push:
    branches: [gate/p07-system-care-rc12-rebased-20260908]
    paths:
      - '.github/workflows/p07-system-care-rc12-rebased-integration-gate.yml'

permissions:
  contents: read

env:
  BRANCH: gate/p07-system-care-rc12-rebased-20260908
  RC11_MAIN: bce536f5e22e9509714ca16c7db12eed6f1ab048
  RC12_MANIFEST: 3c120333051561d7aa21c3a569d8a4d295593375
  SLOT3_BUILD: 0.1.0-rc3-guided-init6

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout overlay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: gate/p07-system-care-rc12-rebased-20260908
          persist-credentials: false
          fetch-depth: 1

      - name: Preserve latest Slot 3 identity while overlaying RC12
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-rc3-guided-init6"' installers/p07-toolbox.sh
          test "$(cat dist/p07/0.1.0-rc3/overlay/BUILD_ID)" = "$SLOT3_BUILD"
          grep -Fq 'EXPECTED_BUILD_ID="0.1.0-rc3-guided-init6"' installers/p07-rc3-candidate.sh
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc12"' installers/p07-toolbox.sh
          grep -Fq "VERSION='0.1.0-rc12'" installers/p07-system-care.sh
          grep -Fq "MANIFEST_BLOB='$RC12_MANIFEST'" installers/p07-system-care.sh
          test "$(git hash-object packages/p07-system-care/0.1.0-rc12/MANIFEST.gitblob)" = "$RC12_MANIFEST"
          bash -n installers/p07-toolbox.sh
          bash -n installers/p07-system-care.sh
          echo P07_RC12_REBASE_SLOT3_IDENTITY=PASS

      - name: Fresh install exact RC12 from rebased branch
        shell: bash
        run: |
          set -Eeuo pipefail
          cp installers/p07-system-care.sh /tmp/rc12.sh
          sed -i "s|raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/|raw.githubusercontent.com/llhzx2018/core-free-runner-public/${BRANCH}/|" /tmp/rc12.sh
          sudo bash /tmp/rc12.sh status >/dev/null
          test "$(NO_COLOR=1 /usr/local/bin/vf-system-care --version | awk '{print $NF}')" = 0.1.0-rc12
          sudo test -f /opt/vf-system-care/lib/intrusion_discovery.py
          echo P07_RC12_REBASE_FRESH_INSTALL=PASS

      - name: Advice split and classify-first smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          summary=/tmp/p07-system-care-summary-0.cache
          intrusion=/tmp/p07-system-care-intrusion-0.cache
          sudo bash -c "printf '%s\n' 'STATUS=HEALTHY' 'SECURITY_ADVISORIES=2' > '$summary'; printf '%s\n' 'STATUS=NOT_ENABLED' 'EVENTS=0' 'SCHEDULER=none' > '$intrusion'"
          printf '0\n' | sudo script -qec "env NO_COLOR=1 /usr/local/bin/vf-system-care menu" /dev/null > /tmp/menu.out 2>&1
          grep -Fq '服务器      正常' /tmp/menu.out
          grep -Fq '安全建议    2 项 · 按 6 查看' /tmp/menu.out
          ! grep -Fq '服务器      需检查' /tmp/menu.out

          tmp=/tmp/rc12-rebase-no-wp
          home="$tmp/home"; nginx="$tmp/nginx"; db="$tmp/db.sq3"; state="$tmp/state"
          mkdir -p "$home/alice/htdocs/a.test" "$home/bob/htdocs/b.test" "$nginx"
          printf '%s\n' '<?php echo "php";' > "$home/alice/htdocs/a.test/index.php"
          printf '%s\n' '<?php echo "php";' > "$home/bob/htdocs/b.test/index.php"
          python3 - "$db" <<'PY'
          import sqlite3,sys
          c=sqlite3.connect(sys.argv[1]); c.execute('CREATE TABLE site(id INTEGER PRIMARY KEY, domain_name TEXT, user TEXT, type TEXT)')
          c.executemany('INSERT INTO site(domain_name,user,type) VALUES(?,?,?)',[('a.test','alice','php'),('b.test','bob','php')]); c.commit(); c.close()
          PY
          printf '0\n' | sudo script -qec "env NO_COLOR=1 P07_IE_STATE_DIR='$state' P07_IE_DISCOVERY_HOME='$home' P07_IE_CLOUDPANEL_DB='$db' P07_IE_NGINX_SITES_DIR='$nginx' /usr/local/bin/vf-system-care evidence menu" /dev/null > /tmp/no-wp.out 2>&1
          grep -Fq 'CloudPanel   2 个网站' /tmp/no-wp.out
          grep -Fq 'WordPress    0 个' /tmp/no-wp.out
          grep -Fq '网站安全    当前不需要开启' /tmp/no-wp.out
          ! grep -Fq '1. 开启网站安全保护' /tmp/no-wp.out
          echo P07_RC12_REBASE_ZERO_ATTENTION_SMOKE=PASS

  state-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Create RC11 state then upgrade through rebased RC12
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --proto '=https' --tlsv1.2 "https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/${RC11_MAIN}/installers/p07-system-care.sh" -o /tmp/rc11.sh
          sudo bash /tmp/rc11.sh status >/dev/null
          sudo rm -rf /var/lib/vf-system-care/intrusion-evidence
          site=/tmp/valid-wp
          mkdir -p "$site/wp-content"
          printf '%s\n' '<?php // config' > "$site/wp-config.php"
          printf '%s\n' '<?php // core' > "$site/wp-settings.php"
          sudo python3 /opt/vf-system-care/lib/intrusion_evidence.py --state-dir /var/lib/vf-system-care/intrusion-evidence baseline --site-root "$site" >/dev/null
          printf '%s\n' '[Unit]' 'Description=P07 fixture' | sudo tee /etc/systemd/system/vf-system-care-intrusion-evidence.service >/dev/null
          printf '%s\n' '[Timer]' 'OnCalendar=daily' | sudo tee /etc/systemd/system/vf-system-care-intrusion-evidence.timer >/dev/null
          sudo sha256sum /var/lib/vf-system-care/intrusion-evidence/baseline.json /var/lib/vf-system-care/intrusion-evidence/scan_state.json /etc/systemd/system/vf-system-care-intrusion-evidence.service /etc/systemd/system/vf-system-care-intrusion-evidence.timer | sudo tee /tmp/before.sha >/dev/null

          curl -fsSL --proto '=https' --tlsv1.2 "https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/${BRANCH}/installers/p07-system-care.sh" -o /tmp/rc12.sh
          sed -i "s|raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/|raw.githubusercontent.com/llhzx2018/core-free-runner-public/${BRANCH}/|" /tmp/rc12.sh
          sudo bash /tmp/rc12.sh status >/dev/null
          test "$(NO_COLOR=1 /usr/local/bin/vf-system-care --version | awk '{print $NF}')" = 0.1.0-rc12
          sudo sha256sum -c /tmp/before.sha
          echo P07_RC12_REBASE_RC11_STATE_PRESERVED=PASS

  final:
    needs: [integration, state-upgrade]
    runs-on: ubuntu-24.04
    steps:
      - run: echo P07_SYSTEM_CARE_RC12_REBASED_INTEGRATION_GATE=PASS
