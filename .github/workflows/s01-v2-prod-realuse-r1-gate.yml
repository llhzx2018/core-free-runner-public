name: S01 V2 Production Real-use R1 Gate

on:
  push:
    branches:
      - task/s01-v2-prod-realuse-r1-gate
    paths:
      - .github/workflows/s01-v2-prod-realuse-r1-gate.yml

permissions:
  contents: read

jobs:
  exact:
    name: Real-use R1 Gate (${{ matrix.component }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: OPS
            repo: llhzx2018/vf-tools-ops
            base: a8bf9027b9ee7c0a31ba4947925c6659c5d4cbca
            head: c90775758ac02c711fc9ae23288e680f132d3de4
            test: tests/s01-c02-page-body-v2-production-realuse-r1-contract.php
            full: tests/s01-c02-page-body-system-v2-full-surface-contract.php
            allowed: includes/admin-v13/views/dashboard.php,assets/css/current/admin-s01-page-body-system-v2.css,tests/s01-c02-page-body-v2-production-realuse-r1-contract.php
            phpfiles: includes/admin-v13/views/dashboard.php,tests/s01-c02-page-body-v2-production-realuse-r1-contract.php
          - component: THEME
            repo: llhzx2018/vf-tools-theme
            base: 0cc5d54b7e9cc2eba676dbc208361456c4e14575
            head: 32e81b0ab6b863df415abd1dfc8d5fce905c1817
            test: tests/s01-c01-page-body-v2-production-realuse-r1-contract.php
            full: tests/s01-c01-page-body-system-v2-full-surface-contract.php
            allowed: src/inc/admin/views/seo.php,src/assets/css/admin/admin-s01-page-body-system-v2.css,tests/s01-c01-page-body-v2-production-realuse-r1-contract.php
            phpfiles: src/inc/admin/views/seo.php,tests/s01-c01-page-body-v2-production-realuse-r1-contract.php
          - component: M3U8
            repo: llhzx2018/vf-tools-m3u8
            base: 361fbdcb887041c69c7d35a3455cf9cd62d05311
            head: f0fc11102109692a399bef62a687b4def0b2387e
            test: tests/s01-c03-page-body-v2-production-realuse-r1-contract.php
            full: tests/s01-c03-page-body-system-v2-full-surface-contract.php
            allowed: src/admin/Controller/class-v6-provider-fixtures-controller.php,src/admin/ui-v4/admin-s01-page-body-system-v2.css,tests/s01-c03-page-body-v2-production-realuse-r1-contract.php
            phpfiles: src/admin/Controller/class-v6-provider-fixtures-controller.php,tests/s01-c03-page-body-v2-production-realuse-r1-contract.php

    steps:
      - name: Credential gate
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"

      - name: Exact source and bounded diff
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          REPO: ${{ matrix.repo }}
          BASE: ${{ matrix.base }}
          HEAD: ${{ matrix.head }}
          ALLOWED: ${{ matrix.allowed }}
        run: |
          set -Eeuo pipefail
          curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/commits/$HEAD" -o /tmp/head.json
          test "$(jq -r '.sha' /tmp/head.json)" = "$HEAD"
          curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/compare/$BASE...$HEAD" -o /tmp/compare.json
          test "$(jq -r '.status' /tmp/compare.json)" = "ahead"
          IFS=',' read -r -a EXPECTED <<< "$ALLOWED"
          mapfile -t ACTUAL < <(jq -r '.files[].filename' /tmp/compare.json | sort)
          mapfile -t WANT < <(printf '%s\n' "${EXPECTED[@]}" | sort)
          diff -u <(printf '%s\n' "${WANT[@]}") <(printf '%s\n' "${ACTUAL[@]}")
          echo "BOUNDED_DIFF=PASS"

      - name: Fetch exact candidate
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          REPO: ${{ matrix.repo }}
          HEAD: ${{ matrix.head }}
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/src /tmp/src.tar.gz
          mkdir -p /tmp/src
          curl -fsSL -L -H "Authorization: Bearer $READ_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/tarball/$HEAD" -o /tmp/src.tar.gz
          tar -xzf /tmp/src.tar.gz -C /tmp/src
          SOURCE_DIR="$(find /tmp/src -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$SOURCE_DIR"
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

      - name: PHP syntax
        env:
          PHPFILES: ${{ matrix.phpfiles }}
        run: |
          set -Eeuo pipefail
          IFS=',' read -r -a FILES <<< "$PHPFILES"
          for rel in "${FILES[@]}"; do php -l "$SOURCE_DIR/$rel"; done

      - name: Real-use R1 + V2 denominator contracts
        env:
          TEST: ${{ matrix.test }}
          FULL: ${{ matrix.full }}
        run: |
          set -Eeuo pipefail
          php "$SOURCE_DIR/$TEST"
          php "$SOURCE_DIR/$FULL"

      - name: Frozen boundary
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          set -Eeuo pipefail
          case "$COMPONENT" in
            OPS) css="$SOURCE_DIR/assets/css/current/admin-s01-page-body-system-v2.css";;
            THEME) css="$SOURCE_DIR/src/assets/css/admin/admin-s01-page-body-system-v2.css";;
            M3U8) css="$SOURCE_DIR/src/admin/ui-v4/admin-s01-page-body-system-v2.css";;
          esac
          ! grep -F '.vf-v6-shell-header' "$css"
          ! grep -F '.vf-v6-domain-nav' "$css"
          echo "FROZEN_BOUNDARY=PASS"

      - name: Summary
        run: |
          echo "V2_PRODUCTION_REALUSE_R1_GATE=PASS"
          echo "OWNER_REAL_USE=PARTIAL_EVIDENCE_CONSUMED"
          echo "MACRO_FREEZE=PENDING"
