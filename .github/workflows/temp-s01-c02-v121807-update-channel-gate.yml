name: TEMP S01-C02 Ops 1.21.807 Update Channel Gate
on:
  push:
    branches: [temp/s01-c02-v121807-update-channel-gate-20260904]
    paths: ['.github/workflows/temp-s01-c02-v121807-update-channel-gate.yml']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout update candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: 41376283a0c140638a8d6ddfc790b8dee1b169e0
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: updates
      - name: Verify manifest against formal release
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$R"
          M=updates/projects/S01-C02.json
          jq -e '.target_version=="1.21.807" and .from_versions==["1.21.806"] and .release_tag=="v1.21.807" and .asset_name=="vf-tools-ops_V1.21.807.zip" and .asset_bytes==3211761 and .asset_sha256=="311bb664b8b1cb5a93fdc96a137e906fda4d37d120444f77d9473bacb98d0b9e" and .runtime_files==898 and .runtime_fingerprint=="4b36091a33336d06413ee23f452fccfe7d646566143973e2b9cc1547bf5eb9b6" and .schema_from=="6.0.0" and .schema_to=="6.0.0" and .physical_locator=="vf-ops/vf-ops.php"' "$M" >/dev/null
          J="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.807')"
          test "$(jq -r .tag_name <<<"$J")" = v1.21.807
          test "$(jq -r .draft <<<"$J")" = false
          test "$(jq -r .prerelease <<<"$J")" = false
          test "$(jq -r '.assets[]|select(.name=="vf-tools-ops_V1.21.807.zip")|.size' <<<"$J")" = 3211761
          test "$(jq -r '.assets[]|select(.name=="vf-tools-ops_V1.21.807.zip")|.digest' <<<"$J")" = 'sha256:311bb664b8b1cb5a93fdc96a137e906fda4d37d120444f77d9473bacb98d0b9e'
          grep -Fq 'Production Upgrade is NOT EXECUTED' "$M"
          echo DIRECT_SOURCE_1_21_806_ONLY=PASS
          echo PASS_V121807_UPDATE_CHANNEL_GATE
