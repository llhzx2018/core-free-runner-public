name: S01 Theme 1.35.28 Distribution Gate

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  distribution-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      CORE_SHA: f85b310b4023452ca1b41c61d7530da1f34185fa
      BASE_SHA: bfca353d6d59cc4e64a7fd031cba3457f6f416bc
    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: f85b310b4023452ca1b41c61d7530da1f34185fa
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: core-updates
          persist-credentials: false

      - name: Exact distribution scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C core-updates rev-parse HEAD)" = "$CORE_SHA"
          test "$(git -C core-updates diff --name-only "$BASE_SHA" "$CORE_SHA")" = "projects/S01-C01.json"
          echo THEME_13528_DISTRIBUTION_SCOPE=PASS

      - name: Manifest and sibling identity
        shell: bash
        run: |
          set -Eeuo pipefail
          m=core-updates/projects/S01-C01.json
          jq -e '.target_version=="1.35.28"
            and .release_tag=="v1.35.28"
            and .asset_name=="vf-tools-theme_V1.35.28.zip"
            and .asset_bytes==1656690
            and .asset_sha256=="b2ecd9257ab51e5c5a7d0e863fd4e211341cd813538453cc90ea594b91751d62"
            and .runtime_files==456
            and .runtime_fingerprint=="c0906abdc9e37e75897b5aaa62d46fa93d35d90d325b30fec2e3994a045e5894"
            and .schema_from=="N/A"
            and .schema_to=="N/A"
            and .enabled==true' "$m" >/dev/null
          jq -e '.from_versions | index("1.35.24") != null and index("1.35.27") != null' "$m" >/dev/null
          test "$(jq -r '.from_versions | length' "$m")" = "20"
          test "$(jq -r '.from_versions | unique | length' "$m")" = "20"
          test "$(jq -r '.target_version' core-updates/projects/S01-C02.json)" = "1.21.872"
          test "$(jq -r '.target_version' core-updates/projects/S01-C03.json)" = "1.25.32"
          echo THEME_13528_MANIFEST=PASS

      - name: Core contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd core-updates
          python3 scripts/check_manifest_contract.py
          php update-core/php/tests/run.php
          echo CORE_UPDATE_CONTRACTS=PASS

      - name: Authenticated asset readback
        shell: bash
        run: |
          set -Eeuo pipefail
          m=core-updates/projects/S01-C01.json
          repo="$(jq -r '.repository' "$m")"
          tag="$(jq -r '.release_tag' "$m")"
          asset="$(jq -r '.asset_name' "$m")"
          bytes="$(jq -r '.asset_bytes' "$m")"
          sha="$(jq -r '.asset_sha256' "$m")"
          curl -fsSL -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $VF_PRIVATE_READ_TOKEN" "https://api.github.com/repos/$repo/releases/tags/$tag" > /tmp/release.json
          aid="$(jq -r --arg n "$asset" '.assets[] | select(.name==$n) | .id' /tmp/release.json | head -n1)"
          test -n "$aid" && test "$aid" != null
          curl -fsSL -L -H 'Accept: application/octet-stream' -H "Authorization: Bearer $VF_PRIVATE_READ_TOKEN" "https://api.github.com/repos/$repo/releases/assets/$aid" -o "/tmp/$asset"
          test "$(stat -c '%s' "/tmp/$asset")" = "$bytes"
          test "$(sha256sum "/tmp/$asset" | awk '{print $1}')" = "$sha"
          unzip -tq "/tmp/$asset" >/dev/null
          unzip -p "/tmp/$asset" vf-tools-theme/style.css | grep -Fq 'Version: 1.35.28'
          test -n "$(unzip -Z1 "/tmp/$asset" | grep '^vf-tools-theme/inc/update/class-vf-theme-private-update-option-override-v1.php$')"
          echo THEME_13528_PRIVATE_ASSET=PASS

      - name: Result
        run: echo PASS_S01_THEME_13528_DISTRIBUTION_GATE
