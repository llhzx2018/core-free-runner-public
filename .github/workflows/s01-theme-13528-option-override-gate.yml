name: S01 Theme 1.35.28 Bootstrap Locator

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  locator:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Resolve short-lived authenticated asset redirect
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${GH_TOKEN:-}"
          headers="$(mktemp)"
          curl -sS -D "$headers" -o /dev/null             -H 'Accept: application/octet-stream'             -H "Authorization: Bearer $GH_TOKEN"             'https://api.github.com/repos/llhzx2018/vf-tools-theme/releases/assets/572753617'
          code="$(awk 'toupper($1) ~ /^HTTP\// {c=$2} END{print c}' "$headers")"
          loc="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^location:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")"
          test "$code" = "302"
          test -n "$loc"
          printf '%s' "$loc" > /tmp/theme-asset-url.txt
          echo "SIGNED_ASSET_URL_BASE64=$(base64 -w0 /tmp/theme-asset-url.txt)"
          echo BOOTSTRAP_LOCATOR=PASS
