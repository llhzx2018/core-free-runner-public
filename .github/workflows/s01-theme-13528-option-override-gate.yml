name: S01 Theme 1.35.28 Option Override Gate

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CANDIDATE_SHA: 53b0ad21eecfaca66a904ba1c12f2be4a4dfd189
      BASE_SHA: d15bfdd95c875d5892a23a231ef110fd96f7b041
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Checkout exact Theme candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 53b0ad21eecfaca66a904ba1c12f2be4a4dfd189
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: theme
          persist-credentials: false

      - name: Exact identity and scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C theme rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(cat theme/VERSION)" = "1.35.28"
          grep -Fq 'Version: 1.35.28' theme/src/style.css
          grep -Fq 'V1.35.28_S01_UPDATE_OPTION_OVERRIDE' theme/src/style.css
          actual="$(git -C theme diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" | sort)"
          expected="$(printf '%s\n'             VERSION             src/inc/update/bootstrap.php             src/inc/update/class-vf-theme-private-update-option-override-v1.php             src/inc/update/class-vf-wp-update-admin-v1.php             src/style.css             tests/update-refresh-policy-contract.php | sort)"
          test "$actual" = "$expected"
          echo THEME_13528_SCOPE=PASS

      - name: Contracts and syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          php theme/tests/update-refresh-policy-contract.php
          php theme/tests/update-center-human-language-contract.php
          php theme/tests/update-center-credential-native-offer-runtime.php
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find theme/src -type f -name '*.php' -print0 | sort -z)
          echo THEME_13528_CONTRACTS=PASS

      - name: Scoped override security fence
        shell: bash
        run: |
          set -Eeuo pipefail
          f=theme/src/inc/update/class-vf-theme-private-update-option-override-v1.php
          grep -Fq "api.github.com" "$f"
          grep -Fq "/repos/llhzx2018/core-updates/" "$f"
          grep -Fq "/repos/llhzx2018/vf-tools-theme/" "$f"
          grep -Fq "/repos/llhzx2018/vf-tools-ops/" "$f"
          grep -Fq "/repos/llhzx2018/vf-tools-m3u8/" "$f"
          grep -Fq "Authorization" "$f"
          grep -Fq "get_option(self::OPTION" "$f"
          ! grep -RInE 'gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY' theme/src
          test "$(git -C theme diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" --             src/inc/update/class-vf-theme-update-source-v1.php             src/inc/update/class-vf-theme-update-client-v1.php             src/inc/update/class-vf-theme-update-package-v1.php             src/inc/update/class-vf-wp-update-credential-v1.php | wc -l)" = "0"
          echo THEME_13528_SECURITY_BOUNDARY=PASS

      - name: Result
        run: echo PASS_S01_THEME_13528_OPTION_OVERRIDE_GATE
