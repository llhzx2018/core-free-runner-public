name: P07 v1.0 多提供者全球备用测速 RC4

on:
  push:
    branches:
      - experiment/p07-oneshot-bench-v05
    paths:
      - .github/workflows/p07-v10-multiprovider-rc4.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/p07-oneshot-bench-v05

      - name: 生成 RC4 候选
        run: |
          set -euo pipefail
          python3 .github/scripts/p07_patch_rc4.py
          chmod +x experiments/p07-bench.sh
          bash -n experiments/p07-bench.sh
          experiments/p07-bench.sh --self-test

      - name: 中文显示 Gate
        run: |
          set -euo pipefail
          out="$(P07_BENCH_FORCE_FALLBACK=1 experiments/p07-bench.sh --demo)"
          printf '%s\n' "$out"
          grep -q '1.0.0-rc4-zh' <<<"$out"
          grep -q '全球备用测速' <<<"$out"
          grep -q '美国西部' <<<"$out"
          grep -q '美国东部' <<<"$out"
          grep -q '欧洲' <<<"$out"
          grep -q '中国香港' <<<"$out"
          grep -q '新加坡' <<<"$out"
          grep -q '日本·东京' <<<"$out"
          grep -q '全球备用覆盖' <<<"$out"
          ! grep -Eq '^[[:space:]]*(US West|US East|Europe|Hong Kong|Singapore|Tokyo)[[:space:]]' <<<"$out"
          ! grep -Eq '[[:space:]](PASS|FAIL|SPEEDTESTGO_FALLBACK|LIBRESPEED_FALLBACK)[[:space:]]' <<<"$out"

      - name: 真实全球备用测速 Gate
        run: |
          set -euo pipefail
          mkdir -p /tmp/p07-home
          HOME=/tmp/p07-home P07_BENCH_FORCE_FALLBACK=1 P07_BENCH_IO_MIB=64 experiments/p07-bench.sh | tee /tmp/p07-real.txt
          grep -q '全球备用覆盖' /tmp/p07-real.txt
          grep -q '中国大陆访问评估' /tmp/p07-real.txt
          REPORT="$(find /tmp/p07-home/.local/state/p07-bench/reports -name '*.json' -type f | sort | tail -n1)"
          test -n "$REPORT"
          python3 - "$REPORT" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          rows=d.get('network_nodes',[])
          ok=[r for r in rows if r.get('state')=='PASS' and r.get('reason') in ('SPEEDTESTGO_FALLBACK','LIBRESPEED_FALLBACK')]
          names={r.get('name') for r in ok}
          print('fallback pass:', len(ok), sorted(names))
          if len(names) < 5:
              raise SystemExit('GLOBAL_FALLBACK_REGION_COUNT_FAIL')
          if not ({'Hong Kong','Singapore','Asia South','Tokyo'} & names):
              raise SystemExit('GLOBAL_FALLBACK_ASIA_FAIL')
          if not ({'US West','US East','US Central'} & names):
              raise SystemExit('GLOBAL_FALLBACK_NA_FAIL')
          if 'Europe' not in names:
              raise SystemExit('GLOBAL_FALLBACK_EU_FAIL')
          PY

      - name: 提交 RC4
        run: |
          set -euo pipefail
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add experiments/p07-bench.sh
          git diff --cached --quiet && exit 0
          git commit -m 'feat(p07-bench): add verified multi-provider global fallback'
          git push origin HEAD:experiment/p07-oneshot-bench-v05
