name: P01 System Baseline Human UI Current Develop Gate

on:
  push:
    paths:
      - '.github/workflows/p01-system-baseline-human-ui-integration-gate-20260828.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CURRENT_DEVELOP: 4a064d7ea34998b4f8103d23e96b2e10be46267c
      FEATURE_HEAD: 50cb7f5ab672abfbbadbddf3395b605d2d6a383e
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, zip, curl, mbstring, openssl
          coverage: none

      - name: Materialize current develop plus feature
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" p01 >/dev/null 2>&1
          cd p01
          git checkout --detach "$CURRENT_DEVELOP"
          test "$(git rev-parse HEAD)" = "$CURRENT_DEVELOP"
          test "$(git rev-parse origin/develop)" = "$CURRENT_DEVELOP"
          git config user.name VF-Integration-Gate
          git config user.email gate@vf.invalid
          git merge --no-ff --no-commit "$FEATURE_HEAD"
          echo P01_CURRENT_DEVELOP_MERGE_CLEAN=PASS

      - name: Integration scope fence
        run: |
          set -Eeuo pipefail
          cd p01
          git diff --cached --name-only | sort > /tmp/p01-files.txt
          cat > /tmp/p01-expected.txt <<'EOF'
          CHANGELOG.md
          src/system-baseline.php
          tests/unit/system_baseline_human_ui_contract.php
          EOF
          diff -u /tmp/p01-expected.txt /tmp/p01-files.txt
          git diff --cached --check
          git diff --cached --quiet -- src/app/CommonBaseline.php
          echo P01_INTEGRATION_SCOPE=PASS
          echo P01_BASELINE_RUNTIME_LOGIC_UNCHANGED=PASS

      - name: Human UI and repository regression
        run: |
          set -Eeuo pipefail
          cd p01
          php -l src/system-baseline.php
          php -l tests/unit/system_baseline_human_ui_contract.php
          php tests/unit/system_baseline_human_ui_contract.php
          python3 - <<'PY'
          import json,pathlib,re
          root=pathlib.Path('.')
          version=(root/'VERSION').read_text(encoding='utf-8').strip()
          assert re.fullmatch(r'\d+\.\d+\.\d+',version)
          assert (root/'src/VERSION.txt').read_text(encoding='utf-8').strip()==version
          boot=(root/'src/app/bootstrap.php').read_text(encoding='utf-8')
          m=re.search(r"define\('VF_VERSION',\s*'([^']+)'\);",boot)
          assert m and m.group(1)==version
          project=json.loads((root/'VF_PROJECT.json').read_text(encoding='utf-8'))
          assert project.get('project_id')=='P01'
          assert str(project.get('schema_version',''))=='2026082801'
          print(f'P01_CURRENT_DEVELOP_REPOSITORY=PASS version={version} schema=2026082801')
          PY
          find src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          echo P01_CURRENT_DEVELOP_FULL_SYNTAX=PASS

      - name: Final verdict
        run: |
          echo P01_SYSTEM_BASELINE_HUMAN_UI_CURRENT_DEVELOP=PASS
          echo 'Release=NO Tag=NO Production=NO'
