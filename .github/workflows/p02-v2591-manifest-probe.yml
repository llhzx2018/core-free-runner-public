name: P02 V2.5.91 Manifest Probe

on:
  push:
    branches:
      - run/p02-v2591-manifest-probe-20260923
    paths:
      - '.github/workflows/p02-v2591-manifest-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 23b54f8e18b44990d985bf15aef30cca7b7fd64b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Print runtime digests
        shell: bash
        working-directory: product
        run: |
          set -Eeuo pipefail
          for f in VERSION public/assets/app.js public/assets/maintenance.js; do
            printf 'P02_V2591_DIGEST file=%s bytes=%s sha256=%s\n' "$f" "$(wc -c < "$f" | tr -d ' ')" "$(sha256sum "$f" | awk '{print $1}')"
          done
