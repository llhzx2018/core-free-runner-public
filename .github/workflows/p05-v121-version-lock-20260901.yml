name: P05 V1.2.1 Readiness Version Lock
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p05-v121-version-lock-20260901.yml']
permissions:
  contents: read
jobs:
  version-lock:
    if: github.event_name == 'pull_request' && github.head_ref == 'tmp/p05-v121-version-lock-20260901'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      P05_BASE_MAIN: 666c5b4d9371858ff8956d311043a18442e192d1
      TARGET_VERSION: 1.2.1
      PRODUCTION_VERSION: 1.1.12
      TARGET_BRANCH: release/p05-v121-version-lock-20260901
    steps:
      - name: Checkout exact private P05 main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.P05_BASE_MAIN }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p05
      - name: Verify frozen v1.2.1 readiness base
        working-directory: p05
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_BASE_MAIN"
          test "$(cat VERSION)" = '1.2.0'
          node - <<'NODE'
          const p=require('./package.json'); if(p.version!=='1.2.0') process.exit(1);
          NODE
          git ls-remote --exit-code origin refs/heads/main | grep -F "$P05_BASE_MAIN" >/dev/null
          if git ls-remote --exit-code origin "refs/heads/$TARGET_BRANCH" >/dev/null 2>&1; then
            echo 'TARGET_BRANCH_ALREADY_EXISTS' >&2; exit 1
          fi
          echo 'P05_V121_VERSION_LOCK_BASE=PASS'
      - name: Apply release-readiness-only version and authority lock
        working-directory: p05
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          target=os.environ['TARGET_VERSION']; prod=os.environ['PRODUCTION_VERSION']; base=os.environ['P05_BASE_MAIN']
          Path('VERSION').write_text(target+'\n', encoding='utf-8')
          pkg=json.loads(Path('package.json').read_text(encoding='utf-8'))
          pkg['version']=target
          Path('package.json').write_text(json.dumps(pkg, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          vf=json.loads(Path('VF_PROJECT.json').read_text(encoding='utf-8'))
          vf['status']='V1.2.1_RELEASE_CANDIDATE / FINAL_MACHINE_GATE_PENDING / RELEASE_AUTHORIZATION_PENDING / PRODUCTION_V1.1.12_OWNER_OBSERVED'
          vf['version']=target
          vf['production_version']=prod
          vf['target_version']=target
          vf['working_version']=target
          vf['version_change']=True
          vf['candidate_authorization']='READINESS_PREP_ONLY / OWNER_V1.2.1_RELEASE_AUTHORIZATION_PENDING'
          vf['release_authorization']='PENDING_OWNER_AUTHORIZATION_V1.2.1'
          vf['production_deployment_authorization']='PENDING_OWNER_AUTHORIZATION_V1.2.1'
          vf['next_action']='V1.2.1 FINAL EXACT SOURCE GATE; THEN STOP AT OWNER RELEASE/TAG/PRODUCTION AUTHORIZATION BOUNDARY'
          vf['deployment_readiness']='V1.2.1_CANDIDATE_FINAL_GATE_PENDING'
          Path('VF_PROJECT.json').write_text(json.dumps(vf, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          app=Path('src/client/ProductApp.tsx').read_text(encoding='utf-8')
          old='P05 · Product Optimization · v1.2.0'
          if old not in app: raise SystemExit('PRODUCT_VERSION_LABEL_ANCHOR_MISSING')
          Path('src/client/ProductApp.tsx').write_text(app.replace(old, 'P05 · Product Optimization · v1.2.1', 1), encoding='utf-8')
          cand=Path('docs/authority/RELEASE_V1.2.1_CANDIDATE.md')
          if cand.exists(): raise SystemExit('CANDIDATE_AUTHORITY_ALREADY_EXISTS')
          cand.write_text(f'''# P05 · VF SEO v1.2.1 Release Candidate\n\nStatus: `READINESS_PREPARED / FINAL_EXACT_SOURCE_GATE_PENDING / OWNER_RELEASE_AUTHORIZATION_PENDING`\n\n## Release basis\n\n- Frozen pre-release main: `{base}`\n- Current formal Product Release: `v1.2.0`\n- Owner-observed Production baseline: `v1.1.12`\n- Target candidate: `v1.2.1`\n- Schema: `VF-SEO-SCHEMA@1 / 1` (unchanged)\n- Default database: SQLite (unchanged)\n\n## Hotfix scope already merged and machine-verified\n\nThis candidate exists because the v1.2.0 Production rollout was intentionally paused after Owner review found the System Update experience exposed update-distribution infrastructure and credential setup.\n\nPR #133 replaces that owner experience with a mature product contract: current/latest/status, Check for updates, Update now, automatic backup/integrity/rollback messaging; GitHub/core-updates/token/runtime/Atomic/Schema internals remain server-side. It also aligns frontend state handling with the backend `AVAILABLE / UP_TO_DATE / FULL_ONLY / BLOCKED_*` contract and removes password step-up from update apply while preserving authenticated session + Same-Origin + CSRF boundaries.\n\nPR #133 was merged after native VF SEO CI Run `33524730752` attempt 2 PASS and disposable Public Runner #555 Run `33525228875` / Job `99914246122` PASS, including PHP/CloudPanel/browser fresh-install staging.\n\n## Version authority\n\n- `VERSION` is the product-version authority and is locked to `1.2.1` for this candidate.\n- `package.json` mirrors `VERSION`.\n- `package-lock.json` remains dependency-graph authority and is intentionally not rewritten for release-only version metadata churn.\n- Product UI release label is `v1.2.1`.\n\n## Release-readiness contract\n\n1. Run Final Exact Source Gate on this exact five-file version-lock candidate.\n2. Candidate may be promoted to `main` only by exact SHA after PASS.\n3. STOP before creating v1.2.1 Tag/Release, core-updates channel, or Production mutation until Owner explicitly authorizes v1.2.1.\n4. After authorization, publish deterministic FULL, build a direct v1.1.12 → v1.2.1 Atomic bridge from formal Release bytes, publish channel truth, then upgrade Production with backup/rollback and remote readback.\n\n## Authorization boundary\n\nThe Owner previously authorized v1.2.0 Release/Tag/Production. That authorization is not silently reused for v1.2.1. Current state is readiness preparation only; v1.2.1 formal publication and Production deployment require a new explicit Owner authorization.\n''', encoding='utf-8')
          PY
          test "$(cat VERSION)" = "$TARGET_VERSION"
          node - <<'NODE'
          const p=require('./package.json'), v=require('./VF_PROJECT.json');
          if(p.version!=='1.2.1'||v.version!=='1.2.1'||v.target_version!=='1.2.1'||v.working_version!=='1.2.1') process.exit(1);
          if(v.production_version!=='1.1.12') process.exit(1);
          if(!String(v.release_authorization||'').includes('PENDING_OWNER_AUTHORIZATION_V1.2.1')) process.exit(1);
          NODE
          git add VERSION VF_PROJECT.json docs/authority/RELEASE_V1.2.1_CANDIDATE.md package.json src/client/ProductApp.tsx
          git diff --cached --check
          git diff --cached --name-only | sort > /tmp/changed
          printf '%s\n' VERSION VF_PROJECT.json docs/authority/RELEASE_V1.2.1_CANDIDATE.md package.json src/client/ProductApp.tsx | sort > /tmp/expected
          diff -u /tmp/expected /tmp/changed
          echo 'P05_V121_VERSION_LOCK_SCOPE=PASS'
      - name: Validate v1.2.1 readiness metadata source
        working-directory: p05
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          npm run release:source:gate
          npm run typecheck
          node --import tsx --test tests/unit/product-simple-update-ux-truth.test.ts tests/unit/product-empty-portfolio-real-site-bootstrap-truth.test.ts tests/unit/demo-dataset.test.ts tests/unit/product-site-load-race-truth.test.ts
          node --import tsx --test tests/contract/backend-online-update-v2.test.ts
          npm run test:php-product-parity
          echo 'P05_V121_VERSION_LOCK_VALIDATION=PASS'
      - name: Commit and push private v1.2.1 release-readiness candidate
        working-directory: p05
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git switch -c "$TARGET_BRANCH"
          git commit -m 'chore(P05): lock v1.2.1 release readiness authority'
          test "$(git rev-list --count "$P05_BASE_MAIN"..HEAD)" = 1
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "P05_V121_CANDIDATE_SOURCE=$(git rev-parse HEAD)"
          echo "P05_V121_CANDIDATE_TREE=$(git rev-parse HEAD^{tree})"
          echo 'P05_RELEASE_WRITE=0'
          echo 'P05_TAG_WRITE=0'
          echo 'P05_CORE_UPDATES_WRITE=0'
          echo 'P05_PRODUCTION_WRITE=0'
