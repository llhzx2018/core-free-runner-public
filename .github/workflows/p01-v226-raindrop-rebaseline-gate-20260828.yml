name: P01 V2.26 Raindrop Rebaseline Gate
on:
  push:
    branches: [task/p01-v222-multi-surface-gate-20260828]
    paths: ['.github/workflows/p01-v226-raindrop-rebaseline-gate-20260828.yml']
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE: c6a889b5496a29d848f2d9c5ab5d333d501fad48
      TREE: b05ecd02b6ce571e8709c154cbfc1f377f2f4db5
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 1
          path: product
      - name: Exact source and syntax
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$SOURCE"
          test "$(git -C product rev-parse HEAD^{tree})" = "$TREE"
          test -f product/docs/authority/P01_RAINDROP_PROTOTYPE_BASELINE_20260828.md
          grep -F 'Raindrop.io Web App' product/docs/authority/P01_RAINDROP_PROTOTYPE_BASELINE_20260828.md >/dev/null
          find product/src -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.txt
          grep -F 'surface-workspace.css' product/src/app/SurfaceShell.php >/dev/null
          ! grep -F 'surface-vf-theme.css' product/src/app/SurfaceShell.php
          echo P01_V226_EXACT_SOURCE_SYNTAX=PASS
      - name: Fresh runtime and single-workspace contract
        run: |
          set -Eeuo pipefail
          ROOT=/tmp/p01-v226
          COOKIE=/tmp/p01-v226.cookies
          rm -rf "$ROOT" "$COOKIE"
          cp -a product/src "$ROOT"
          php -S 127.0.0.1:18310 -t "$ROOT" >/tmp/p01-v226.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 30); do if curl -fsS -c "$COOKIE" -b "$COOKIE" http://127.0.0.1:18310/setup.php -o /tmp/setup.html; then READY=1; break; fi; sleep 1; done
          test "$READY" = 1
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/setup.html',encoding='utf-8').read()
          print(re.search(r'name="setup_csrf"\s+value="([^"]+)"',s).group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST http://127.0.0.1:18310/setup.php \
            --data-urlencode "setup_csrf=$CSRF" \
            --data-urlencode 'site_title=V226 Gate' \
            --data-urlencode 'admin_password=P01V226!Gate' \
            --data-urlencode 'admin_password_confirm=P01V226!Gate' -o /tmp/setup-post.html
          test -f "$ROOT/app/.runtime.php"
          cat >/tmp/seed.php <<'PHP'
          <?php
          require '/tmp/p01-v226/app/bootstrap.php';
          require_once '/tmp/p01-v226/app/SurfaceRepository.php';
          $r=new VfRepository(vf_db());
          $s=new VfSurfaceRepository(vf_db());
          $c=$r->createCategory(['name'=>'开发工具','description'=>'','is_private'=>false]);
          $a=$r->saveLink(null,['category_id'=>$c,'title'=>'GitHub','url'=>'https://github.com','description'=>'代码托管','is_private'=>false],'manual');
          $b=$r->saveLink(null,['category_id'=>$c,'title'=>'硅谷101','url'=>'https://youtube.com/@sv101','description'=>'科技与商业频道','is_private'=>false],'manual');
          $d=$r->saveLink(null,['category_id'=>$c,'title'=>'奥本海默','url'=>'https://example.com/oppenheimer','description'=>'电影','is_private'=>false],'manual');
          $s->upsertProfile((int)$b['id'],['surface'=>'channels','resource_kind'=>'youtube','background_friendly'=>true,'note'=>'长期内容源']);
          $s->upsertProfile((int)$d['id'],['surface'=>'watch','resource_kind'=>'movie','media_year'=>'2023','media_status'=>'want','note'=>'想看']);
          PHP
          php /tmp/seed.php
          curl -fsS -c "$COOKIE" -b "$COOKIE" -H 'Content-Type: application/json' -X POST 'http://127.0.0.1:18310/api.php?action=login' --data '{"password":"P01V226!Gate"}' | jq -e '.ok==true' >/dev/null

          curl -fsS -c "$COOKIE" -b "$COOKIE" http://127.0.0.1:18310/surfaces.php -o /tmp/all.html
          grep -F '全部收藏' /tmp/all.html >/dev/null
          grep -F '智能视图' /tmp/all.html >/dev/null
          grep -F 'vf-workspace-list' /tmp/all.html >/dev/null
          ! grep -F '你的互联网，从这里继续。' /tmp/all.html
          ! grep -F 'vf-space-switcher' /tmp/all.html

          curl -fsS -c "$COOKIE" -b "$COOKIE" http://127.0.0.1:18310/start.php -o /tmp/start.html
          grep -F '<h1>Start</h1>' /tmp/start.html >/dev/null
          grep -F 'vf-workspace-toolbar' /tmp/start.html >/dev/null
          ! grep -F '经典导航' /tmp/start.html
          ! grep -F '管理网址</a><a' /tmp/start.html

          curl -fsS -c "$COOKIE" -b "$COOKIE" http://127.0.0.1:18310/channels.php -o /tmp/channels.html
          grep -F '<h1>Channels</h1>' /tmp/channels.html >/dev/null
          grep -F 'vf-channel-row' /tmp/channels.html >/dev/null
          ! grep -F '很久没看的频道' /tmp/channels.html

          curl -fsS -c "$COOKIE" -b "$COOKIE" http://127.0.0.1:18310/watch.php -o /tmp/watch.html
          grep -F '<h1>Watch</h1>' /tmp/watch.html >/dev/null
          grep -F 'vf-watch-grid' /tmp/watch.html >/dev/null

          curl -fsS -c "$COOKIE" -b "$COOKIE" http://127.0.0.1:18310/surface-manager.php -o /tmp/inbox.html
          grep -F '<h1>待整理</h1>' /tmp/inbox.html >/dev/null
          grep -F '系统认出的内容' /tmp/inbox.html >/dev/null
          grep -F '高级管理' /tmp/inbox.html >/dev/null
          ! grep -F 'vf-editor-row' /tmp/inbox.html

          curl -fsS -c /tmp/anon.cookies http://127.0.0.1:18310/ -o /tmp/public.html
          ! grep -F 'vf-app-sidebar' /tmp/public.html

          php "$ROOT/cli/verify.php" | grep -Fx 'VERIFY_PASS=YES'
          php "$ROOT/cli/surface-verify.php" | grep -Fx 'MULTI_SURFACE_PASS=YES'
          php "$ROOT/cli/baseline-verify.php" | tee /tmp/base.txt
          grep -Fx 'BASELINE_CORE_PASS=YES' /tmp/base.txt
          grep -Fx 'DRIFT_COUNT=0' /tmp/base.txt
          grep -Fx 'UNKNOWN_COUNT=0' /tmp/base.txt
          echo P01_V226_SINGLE_WORKSPACE_RUNTIME=PASS
      - name: Verdict
        run: |
          echo P01_V226_SOURCE=$SOURCE
          echo P01_V226_TREE=$TREE
          echo P01_V226_RAINDROP_REBASELINE=PASS
          echo SCHEMA_CHANGE=NO
          echo PRODUCTION_WRITE=NO
