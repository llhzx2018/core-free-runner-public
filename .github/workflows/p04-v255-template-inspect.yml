name: P04 V2.5.5 Template Inspect
on:
  push:
    branches: [main]
    paths: ['.github/workflows/p04-v255-template-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: hotfix/p04-v2.5.5-online-handoff-contract
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          path: p04
      - name: Inspect exact template sentinels
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('p04/scripts/build-v251-maintenance-release.py').read_text(encoding='utf-8')
          for key in ["$authReady=Auth::isAuthenticated();", "if((string)($_SERVER['REQUEST_METHOD']??'GET')==='POST'", "->commit", "$success=true", "catch(Throwable $e)", "vfi251_db_rollback"]:
              print('\n===',key,'===')
              start=0
              while True:
                  i=s.find(key,start)
                  if i<0: break
                  print(s[max(0,i-900):min(len(s),i+1800)].replace('\\n','\\n'))
                  start=i+len(key)
          PY
