name: P07 M03 release141 published asset read-only Git blob inspection
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-m03-141-limited-final-gates-20261119.yml'
permissions:
  contents: read
jobs:
  published-asset-identity:
    if: github.repository == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read only official published limited141 public ZIP and fixed Git blobs
        shell: bash
        run: |
          set -Eeuo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf -- "$tmp"' EXIT
          url='https://github.com/llhzx2018/core-free-runner-public/releases/download/p07-m03-v0.1.0-release141-limited-20261119/P07-M03-0.1.0-release141.zip'
          curl --proto '=https' --tlsv1.2 -fsSL --retry 2 --max-time 120 "$url" -o "$tmp/release.zip"
          echo '22c23818bc7268e6d3d95bc2552f42a5a3c12e97e387fdc542d59934c658b6d1  '"$tmp/release.zip" | sha256sum -c -
          python3 -B - "$tmp/release.zip" <<'PY'
          import hashlib,sys,zipfile
          def blob(raw):
              return hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          with zipfile.ZipFile(sys.argv[1]) as z:
              installer=z.read('installers/p07-final.sh')
              manifest=z.read('dist/p07/0.1.0/overlay/RUNTIME.gitblob')
              assert blob(manifest)=='6a3a949064ffb8fe1df56e7bc555173b5ca9cf3b'
              assert b'EXPECTED_BUILD_ID="0.1.0-release141"' in installer
              assert b'RUNTIME_MANIFEST_BLOB="6a3a949064ffb8fe1df56e7bc555173b5ca9cf3b"' in installer
              print('P07_M03_141_OFFICIAL_RELEASE_ZIP_SHA256=PASS')
              print('P07_M03_141_OFFICIAL_RUNTIME_BLOB='+blob(manifest))
              print('P07_M03_141_OFFICIAL_INSTALLER_BLOB='+blob(installer))
          PY
          echo P07_M03_141_PRIVATE_DATA_OR_SOURCE_PERSISTED=NO
