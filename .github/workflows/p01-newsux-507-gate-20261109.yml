name: P01 News UX v507 scoped final canonical and 506-to-507 Atomic
on:
  push:
    branches:
      - task/p01-newsux-507-release-gate-20261109
permissions:
  contents: read
concurrency:
  group: p01-newsux-507-final-20261109
  cancel-in-progress: false
jobs:
  p01-news-ux-final:
    if: github.repository == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 33
    env:
      PRODUCT_SHA: a6bbe43f7d24e6b0bcc306e4408e782aab31421f
      VF_NEWS_R5_SANDBOX: '1'
      VF_NEWS_R5_TARGET_VERSION: '2.47.507'
    steps:
      - name: Checkout registered public-safe builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare PHP and SQLite isolated runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-curl php-sqlite3 php-xml php-mbstring php-zip php-gd unzip >/dev/null
          php -m | grep -Fxi pdo_sqlite
          echo P01_UI507_LOCAL_RUNTIME=PASS
      - name: Checkout exact private UI-only P01 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: a6bbe43f7d24e6b0bcc306e4408e782aab31421f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p01-exact
          persist-credentials: false
      - name: Checkout v506 official source for scoped parity
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: v2.47.506
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p01-baseline
          persist-credentials: false
      - name: Verify only 4 News UX paths plus three VERSION identities changed
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p01-exact rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(tr -d '\r\n ' < p01-exact/VERSION)" = '2.47.507'
          test "$(tr -d '\r\n ' < p01-exact/src/VERSION.txt)" = '2.47.507'
          grep -Fx "define('VF_VERSION', '2.47.507');" p01-exact/src/app/bootstrap.php
          for f in src/app/DisasterRecovery.php src/app/ChannelLibraryPage.php src/assets/local-subsite-management.js src/app/UpdateManager.php src/app/BackupManager.php src/app/NewsFeedService.php src/app/NewsSourcePreferences.php; do
            cmp "p01-exact/$f" "p01-baseline/$f"
          done
          diff -u <(printf '%s\n' VERSION src/VERSION.txt src/app/NewsFeedPage.php src/app/bootstrap.php src/assets/news-feed.css src/assets/news-feed.js tests/browser/p01_news_r4_chromium.cjs) <(git -C p01-exact diff --name-only "$(git -C p01-baseline rev-parse HEAD)" HEAD | sort)
          php -l p01-exact/src/app/NewsFeedPage.php >/dev/null
          php -l p01-exact/src/app/bootstrap.php >/dev/null
          node --check p01-exact/src/assets/news-feed.js
          node --check p01-exact/tests/browser/p01_news_r4_chromium.cjs
          echo P01_NEWS_UX_507_RELEASED_506_SECURITY_BYTE_PARITY=PASS
          echo P01_NEWS_UX_507_EXACT_SEVEN_FILE_SCOPE=PASS
      - name: Exact source canonical 506 to 507 zero-regression
        shell: bash
        timeout-minutes: 15
        run: |
          set -Eeuo pipefail
          bash p01-exact/tests/canonical_release_regression.sh p01-exact p01-baseline --require-zero-debt | tee /tmp/p01-newsux507-canonical.log
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/p01-newsux507-canonical.log
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/p01-newsux507-canonical.log
          php p01-exact/tests/unit/p01_news_release_surface_contract.php | tee /tmp/p01-newsux507-rights.log
          grep -F 'P01_NEWS_R9_PUBLIC_SECURITY_API_SEO=PASS checks=114' /tmp/p01-newsux507-rights.log
          echo P01_NEWS_UX_507_CANONICAL_AND_RIGHTS=PASS
      - name: Adapt preexisting disposable News R5 fixture to released 506 baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          script=Path('p01-exact/tests/integration/p01_news_r5_atomic_package_gate.sh')
          s=script.read_text()
          for old,new in [
            ('FROM=2.47.505\nCANDIDATE_VERSION=2.47.506\n','FROM=2.47.506\nCANDIDATE_VERSION=2.47.507\n'),
            ('2.99.999|2.47.506)','2.99.999|2.47.507)'),
            ('P01_NEWS_R5_EXACT_505_TO_506_FULL_ATOMIC_BACKUP_RESTORE=PASS','P01_NEWS_UX_507_EXACT_506_TO_507_FULL_ATOMIC_BACKUP_RESTORE=PASS'),
          ]:
            assert s.count(old)==1,repr(old)
            s=s.replace(old,new)
          script.write_text(s)
          lifecycle=Path('p01-exact/tests/integration/p01_news_r5_lifecycle_native.php')
          old="news_r5_assert(!is_file($resolved.'/news.php'),'new-news-route-removed-after-failed-atomic');"
          new="news_r5_assert(is_file($resolved.'/news.php'),'existing-news-route-preserved-after-failed-atomic');"
          x=lifecycle.read_text()
          assert x.count(old)==1
          lifecycle.write_text(x.replace(old,new))
          print('P01_NEWS_UX_507_DISPOSABLE_FIXTURE_ONLY=PASS')
          PY
          diff -u <(printf '%s\n' tests/integration/p01_news_r5_atomic_package_gate.sh tests/integration/p01_news_r5_lifecycle_native.php) <(git -C p01-exact diff --name-only | sort)
          test -z "$(git -C p01-exact diff --name-only -- src)"
      - name: Real 506 FULL to 507 Atomic data restore and fault rollback
        shell: bash
        timeout-minutes: 14
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          bash p01-exact/tests/integration/p01_news_r5_atomic_package_gate.sh | tee /tmp/p01-newsux507-atomic.log
          grep -Fx 'P01_NEWS_UX_507_EXACT_506_TO_507_FULL_ATOMIC_BACKUP_RESTORE=PASS' /tmp/p01-newsux507-atomic.log
          echo P01_NEWS_UX_507_FRESH_FULL_ATOMIC_BACKUP_RESTORE_FAULT_ROLLBACK=PASS
          echo P01_NEWS_UX_507_PLATFORM_REJECTED_SECURITY_IMPORT_DISASTER=NOT_RUN
          echo P01_NEWS_UX_507_PRODUCTION_WRITES=NONE
      - name: Clean all private transient checkout and local data
        if: always()
        shell: bash
        run: |
          rm -rf p01-exact p01-baseline
          echo P01_NEWS_UX_507_PUBLIC_RUNNER_PRIVATE_CHECKOUT_CLEAN=YES
