name: P01 V2.37.0 Core Updates Manifest Gate
on:
  push:
    branches: [release/p01-v2365-candidate-20260902]
    paths: [.github/workflows/p01-v2370-core-updates-manifest-gate-20260902.yml]
permissions:
  actions: read
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      CORE_REPO: llhzx2018/core-updates
      CORE_BASE: 8960138873ee269d39d6c2825199b75a99af333f
      CORE_CANDIDATE: f9daa7a3f0aa020c9c57e60ee6e3dbb6bc9600cd
      FORMAL: 5172a497f7a2c9065880ae0d1257a15469917621
      TAG: v2.37.0
      RELEASE_ID: '380868714'
      ASSET: VF_Start_V2.37.0_UPDATE.zip
      ASSET_BYTES: '1270761'
      ASSET_SHA: c416486d5ea1d68b87c1bdfebcc7de42729f1ff7655e3ded49ebd5a88d1e3b29
      SCHEMA: '2026082901'
      RELEASE_GATE: '33568217603'
    steps:
      - name: Verify release gate PASS
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$RELEASE_GATE --jq .conclusion)" = success
          printf 'RELEASE_GATE=%s/PASS\n' "$RELEASE_GATE" > /tmp/p01-v2370-release-truth.txt
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CORE_CANDIDATE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: core
      - name: Exact one-file candidate and pre-promotion truth
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE_CANDIDATE"
          test "$(git -C core rev-parse HEAD^)" = "$CORE_BASE"
          test "$(git -C core diff --name-only "$CORE_BASE" "$CORE_CANDIDATE")" = projects/P01.json
          old=$(git -C core show "$CORE_BASE":projects/P01.json)
          test "$(jq -r .current_version <<<"$old")" = 2.36.4
          test "$(jq -r .target_version <<<"$old")" = 2.36.5
          test "$(jq -r '.from_versions|length' <<<"$old")" = 1
          test "$(jq -r '.from_versions[0]' <<<"$old")" = 2.36.4
          test "$(jq -r .release_tag <<<"$old")" = v2.36.5
          printf 'CORE_BASE=%s\nONE_FILE_BOUNDARY=PASS\nLIVE_PRE_PROMOTION=2.36.4_TO_2.36.5\n' "$CORE_BASE" | tee /tmp/p01-v2370-core-boundary.txt
      - name: Validate strict single-hop manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          f=core/projects/P01.json
          jq -e . "$f" >/dev/null
          test "$(jq -r .schema_version "$f")" = 1.0
          test "$(jq -r .project_id "$f")" = P01
          test "$(jq -r .component_id "$f")" = APP
          test "$(jq -r .enabled "$f")" = true
          test "$(jq -r .current_version "$f")" = 2.36.5
          test "$(jq -r .target_version "$f")" = 2.37.0
          test "$(jq -r .update_type "$f")" = ATOMIC
          test "$(jq -r '.from_versions|length' "$f")" = 1
          test "$(jq -r '.from_versions[0]' "$f")" = 2.36.5
          test "$(jq -r .schema_from "$f")" = "$SCHEMA"
          test "$(jq -r .schema_to "$f")" = "$SCHEMA"
          test "$(jq -r .repository "$f")" = "$PRODUCT_REPO"
          test "$(jq -r .release_tag "$f")" = "$TAG"
          test "$(jq -r .release_id "$f")" = "$RELEASE_ID"
          test "$(jq -r .product_identity "$f")" = "$FORMAL"
          test "$(jq -r .asset_name "$f")" = "$ASSET"
          test "$(jq -r .asset_bytes "$f")" = "$ASSET_BYTES"
          test "$(jq -r .asset_sha256 "$f")" = "$ASSET_SHA"
          test "$(jq -r .backup_required "$f")" = true
          test "$(jq -r .rollback_supported "$f")" = true
          test "$(jq -r .minimum_php "$f")" = 8.0.0
          printf 'STRICT_SINGLE_HOP_2365_TO_2370=PASS\nSCHEMA_CHANGE=NO\nMIGRATION=NONE\n' | tee /tmp/p01-v2370-manifest-contract.txt
      - name: Download exact published update asset
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-v2370-release-asset; mkdir -p /tmp/p01-v2370-release-asset
          gh release download "$TAG" --repo "$PRODUCT_REPO" --pattern "$ASSET" --dir /tmp/p01-v2370-release-asset
          f=/tmp/p01-v2370-release-asset/$ASSET
          test -f "$f"
          test "$(stat -c%s "$f")" = "$ASSET_BYTES"
          test "$(sha256sum "$f"|awk '{print $1}')" = "$ASSET_SHA"
          unzip -tqq "$f"
          printf 'RELEASE_ASSET_EXACT=PASS\nASSET=%s\nBYTES=%s\nSHA=%s\n' "$ASSET" "$ASSET_BYTES" "$ASSET_SHA" | tee /tmp/p01-v2370-release-asset.txt
      - name: Final manifest verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          printf 'P01_V2370_CORE_UPDATES_MANIFEST_GATE=PASS\nCORE_CANDIDATE=%s\nFORMAL=%s\nTAG=%s\nRELEASE_ID=%s\nSINGLE_HOP=2.36.5_TO_2.37.0\nASSET_SHA=%s\nSCHEMA=%s\nMIGRATION=NONE\nOWNER_PRODUCTION_WRITE=NO\n' "$CORE_CANDIDATE" "$FORMAL" "$TAG" "$RELEASE_ID" "$ASSET_SHA" "$SCHEMA" | tee /tmp/p01-v2370-manifest-verdict.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-v2370-core-updates-manifest-${{ github.run_id }}
          path: |
            /tmp/p01-v2370-release-truth.txt
            /tmp/p01-v2370-core-boundary.txt
            /tmp/p01-v2370-manifest-contract.txt
            /tmp/p01-v2370-release-asset.txt
            /tmp/p01-v2370-manifest-verdict.txt
          if-no-files-found: warn
          retention-days: 90
