name: P08 R52 exact-source Owner request acknowledgement checks (one-off)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p08-r52-owner-ack-once.yml'
permissions:
  contents: read
jobs:
  isolated-owner-ack:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout temporary public-safe validation lane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout exact private P08 PR 22 source (ephemeral only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-adops
          ref: e1f49b147050d282ae49a4de38492104a87863b6
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-p08
      - name: Lock source and verify release gates remain disabled
        run: |
          set -euo pipefail
          test "$(git -C private-p08 rev-parse HEAD)" = "e1f49b147050d282ae49a4de38492104a87863b6"
          test "$(cat private-p08/VERSION)" = "0.1.1"
          grep -Fq 'PUBLIC_KEY_HEX = null' private-p08/src/Upgrade/UpdateAuthority.php
          test ! -e private-p08/.env
          test -f private-p08/tests/test_owner_upgrade_transport.php
          test -f private-p08/tests/js/upgrade-acknowledgement.test.ts
          echo P08_R52_EXACT_SOURCE_AND_DISABLED_SIGNER=PASS
      - name: Install PHP 8.4 for exact source smoke
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: none
          coverage: none
          extensions: zip, mbstring, intl, pdo_sqlite, sqlite3, sodium
      - name: Install Node 22 for private Vue source tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run actual PHP controller transport and job regressions
        run: |
          set -euo pipefail
          cd private-p08
          php -l app/Http/Controllers/OwnerUpgradeController.php
          php -l src/Upgrade/UpgradeReadiness.php
          php -l src/Upgrade/OwnerUpgradeJob.php
          php tests/test_owner_upgrade_transport.php
          php tests/test_versioned_fpm_runtime_identity.php
          php tests/test_owner_upgrade_job.php
          php tests/test_owner_upgrade_worker_cron.php
          echo P08_R52_REAL_REPOSITORY_PHP_REGRESSION=PASS
      - name: Run vendor-free full source regression and stack contract
        run: |
          set -euo pipefail
          cd private-p08
          bash scripts/dev_check.sh > "$RUNNER_TEMP/p08-r52-dev-check.log" 2>&1 || { tail -n 45 "$RUNNER_TEMP/p08-r52-dev-check.log"; exit 1; }
          tail -n 7 "$RUNNER_TEMP/p08-r52-dev-check.log"
          python3 scripts/check_stack_contract.py --phase mature
          echo P08_R52_EXACT_SOURCE_DEV_CHECK=PASS
      - name: Build Vue/TS/Vite and execute real Vitest
        run: |
          set -euo pipefail
          cd private-p08
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-r52-npm.log" 2>&1 || { tail -n 18 "$RUNNER_TEMP/p08-r52-npm.log"; exit 1; }
          npm run typecheck
          npm run test:unit
          npm run build
          test -f public/build/manifest.json
          echo P08_R52_EXACT_VUE_TYPESCRIPT_VITEST_VITE=PASS
          echo P08_R52_OWNER_BROWSER_CRON_AND_PRODUCTION=NOT_PROVEN
      - name: Wipe ephemeral private source and test logs
        if: always()
        run: |
          rm -rf private-p08
          rm -f "$RUNNER_TEMP/p08-r52-dev-check.log" "$RUNNER_TEMP/p08-r52-npm.log"
