name: P01 V2.47.247 Course Reader Alignment Proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p01-v247247-course-reader-alignment.yml"
      - "proof-triggers/p01-v247247-course-reader-alignment.json"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout proof control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd >/dev/null
      - name: Clone exact candidate and baseline
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" candidate
          git -C candidate fetch -q origin 9476315c4da0652e4215b2139d4c0ed789ccacf1
          git -C candidate checkout -q --detach 9476315c4da0652e4215b2139d4c0ed789ccacf1
          test "$(git -C candidate rev-parse HEAD)" = "9476315c4da0652e4215b2139d4c0ed789ccacf1"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.247"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "2.47.247"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" baseline
          git -C baseline fetch -q origin 6a8a6c16ff4e2e5c7a1b61184995f7f81160f332
          git -C baseline checkout -q --detach 6a8a6c16ff4e2e5c7a1b61184995f7f81160f332
          echo P01_V247247_EXACT_SOURCE=PASS
      - name: Reader alignment contract
        shell: bash
        run: |
          set -Eeuo pipefail
          php candidate/tests/unit/course_markdown_reader_contract.php | tee /tmp/reader.txt
          grep -Fx 'P01_COURSE_MARKDOWN_READER=PASS' /tmp/reader.txt
          grep -Fq -- '--vf-course-reader-shell:1320px' candidate/src/assets/course-study.css
          test "$(grep -Fc 'width:min(var(--vf-course-reader-shell),calc(100% - var(--vf-course-reader-inset)))' candidate/src/assets/course-study.css)" -ge 3
          grep -Fq 'height:48px' candidate/src/assets/course-study.css
          grep -Fq 'min-height:48px' candidate/src/assets/course-study.css
          echo P01_V247247_SHARED_SHELL=PASS
          echo P01_V247247_TAB_ALIGNMENT=PASS
      - name: Preserve prior PASS surfaces
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'grid-column:1;' candidate/src/assets/course-study.css
          grep -Fq 'grid-column:2;' candidate/src/assets/course-study.css
          grep -Fq 'grid-row:1;' candidate/src/assets/course-study.css
          grep -Fq 'overflow:visible;' candidate/src/assets/course-study.css
          grep -Fq '更新课程 ZIP' candidate/src/app/CourseLibraryPage.php
          grep -Fq 'class="vf-course-upload-file"' candidate/src/app/CourseLibraryPage.php
          echo P01_V247247_PRIOR_READER_PASS_PRESERVED=PASS
      - name: Canonical regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate baseline --require-zero-debt | tee /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/canonical.txt
          echo P01_V247247_CANONICAL=PASS
      - name: No release write
        shell: bash
        run: |
          echo FORMAL_RELEASE_CALLED=NO
          echo DISTRIBUTION_WRITE=NO
          echo PRODUCTION_WRITE=NO
