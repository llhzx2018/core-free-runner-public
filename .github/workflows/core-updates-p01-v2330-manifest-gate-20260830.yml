name: Core Updates P01 V2.33 Manifest Gate
on:
  push:
    branches: [task/p01-v2330-formal-release-20260830]
    paths: [.github/workflows/core-updates-p01-v2330-manifest-gate-20260830.yml]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: d047561832887575ba71189e9d795705465d1046
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: updates
      - name: Verify manifest and published release identity
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C updates rev-parse HEAD)" = d047561832887575ba71189e9d795705465d1046
          test "$(git -C updates merge-base d7aa807b588fcdcc60f2f719895d9ae111a1a5d9 HEAD)" = d7aa807b588fcdcc60f2f719895d9ae111a1a5d9
          test "$(git -C updates diff --name-only d7aa807b588fcdcc60f2f719895d9ae111a1a5d9...HEAD)" = projects/P01.json
          test "$(gh api repos/llhzx2018/core-updates/branches/main --jq .commit.sha)" = d7aa807b588fcdcc60f2f719895d9ae111a1a5d9
          M=updates/projects/P01.json
          jq -e '
            .schema_version=="1.0" and
            .project_id=="P01" and .component_id=="APP" and .enabled==true and
            .current_version=="2.32.0" and .target_version=="2.33.0" and
            .update_type=="ATOMIC" and .from_versions==["2.32.0"] and
            .schema_from=="2026082901" and .schema_to=="2026082901" and
            .repository=="llhzx2018/vf-start" and .release_tag=="v2.33.0" and
            .release_id==379071259 and
            .product_identity=="8c819c8bfd055d16b3ac367cef15f723431d9a42" and
            .asset_name=="VF_Start_V2.33.0_UPDATE.zip" and
            .asset_bytes==1343451 and
            .asset_sha256=="9520e7f45b37341456fe9f1dba1f248fe02e84143c52230760fcddb307226a9c" and
            .backup_required==true and .rollback_supported==true and
            .released_at=="2026-08-29T18:45:44Z" and .minimum_php=="8.0.0"
          ' "$M" >/dev/null
          TAG=$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.33.0)
          test "$(jq -r .object.sha <<<"$TAG")" = 8c819c8bfd055d16b3ac367cef15f723431d9a42
          REL=$(gh api repos/llhzx2018/vf-start/releases/tags/v2.33.0)
          test "$(jq -r .id <<<"$REL")" = 379071259
          test "$(jq -r .draft <<<"$REL")" = false
          test "$(jq -r .prerelease <<<"$REL")" = false
          test "$(jq '.assets|length' <<<"$REL")" = 8
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.33.0_UPDATE.zip")|.size' <<<"$REL")" = 1343451
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.33.0_UPDATE.zip")|.digest' <<<"$REL")" = sha256:9520e7f45b37341456fe9f1dba1f248fe02e84143c52230760fcddb307226a9c
          rm -rf /tmp/p01-v2330-manifest-asset && mkdir -p /tmp/p01-v2330-manifest-asset
          gh release download v2.33.0 --repo llhzx2018/vf-start --pattern VF_Start_V2.33.0_UPDATE.zip --dir /tmp/p01-v2330-manifest-asset
          A=/tmp/p01-v2330-manifest-asset/VF_Start_V2.33.0_UPDATE.zip
          test "$(stat -c%s "$A")" = 1343451
          echo "9520e7f45b37341456fe9f1dba1f248fe02e84143c52230760fcddb307226a9c  $A" | sha256sum -c -
          unzip -Z1 "$A" | grep -Fx repair-v2.33.0.php >/dev/null
          cp "$M" /tmp/P01-V2.33.0-manifest.json
          jq -n --arg candidate d047561832887575ba71189e9d795705465d1046 --arg base d7aa807b588fcdcc60f2f719895d9ae111a1a5d9 --arg asset_sha 9520e7f45b37341456fe9f1dba1f248fe02e84143c52230760fcddb307226a9c '{candidate:$candidate,base:$base,manifest_gate:"PASS",release_id:379071259,tag:"v2.33.0",asset_bytes:1343451,asset_sha256:$asset_sha,owner_production_write:false}' >/tmp/P01-V2.33.0-manifest-gate.json
          echo CORE_UPDATES_P01_V2330_MANIFEST_GATE=PASS
          echo READY_FOR_CORE_UPDATES_MAIN_PROMOTION=YES
          echo OWNER_PRODUCTION_WRITE=NO
      - name: Upload manifest evidence
        uses: actions/upload-artifact@v4
        with:
          name: p01-v2330-core-updates-manifest-${{ github.run_id }}
          path: |
            /tmp/P01-V2.33.0-manifest.json
            /tmp/P01-V2.33.0-manifest-gate.json
          if-no-files-found: error
          retention-days: 90
