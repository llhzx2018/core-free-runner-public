name: S01 C02 Ops 1.21.1107 Published WordPress Native Update Discovery
on:
  push:
    branches: [task/s01-c02-1211106-real-wp-tools-css-20261012]
    paths: [.github/workflows/s01-c02-1211107-published-native.yml]
permissions:
  contents: read
  actions: read
jobs:
  published-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_DATABASE: vf_ops_discovery
          MARIADB_USER: vf
          MARIADB_PASSWORD: vf
          MARIADB_ROOT_PASSWORD: fixture-only-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mariadb-admin ping -h 127.0.0.1 -uroot -pfixture-only-root"
          --health-interval 10s --health-timeout 5s --health-retries 20
    env:
      TARGET_REPO: 'llhzx2018/vf-tools-ops'
      TARGET_SHA: 'b5a4227c765729bd74e032f8d8f246b06d125e81'
      SOURCE_VERSION: '1.21.1106'
      TARGET_VERSION: '1.21.1107'
      CHANNEL_SHA: 'e5c6dd94cd1ddf41af23801da610b60600bbed57'
      EXPECTED_BYTES: '3578929'
      EXPECTED_SHA: '3ee84c75a9877241ed911e1ceb5f3991faaeacb4804eb1082d936391f2452745'
    steps:
      - name: Checkout public isolated updater verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Prepare disposable WordPress 7.1.3 and MariaDB
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mariadb-client php8.3-mysql php8.3-zip php8.3-xml php8.3-mbstring php8.3-curl unzip curl
          curl --fail --silent --show-error --location 'https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar' -o /tmp/wp-cli.phar
          sudo install -m 0755 /tmp/wp-cli.phar /usr/local/bin/wp
          mysql --protocol=tcp -h127.0.0.1 -uvf -pvf -e 'SELECT 1' vf_ops_discovery
          bash -n runner/lanes/s01-c02-1211107/published-native.sh
      - name: Published channel and actual WordPress update offer, upgrade and readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: bash runner/lanes/s01-c02-1211107/published-native.sh
      - name: Upload redacted metadata proof only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-1107-native-update-${{ github.run_id }}
          path: |
            proof-native/stage.txt
            proof-native/published-channel.json
            proof-native/channel-commit.json
            proof-native/release.json
            proof-native/wordpress-native.txt
            proof-native/FINAL_DISCOVERY.json
          if-no-files-found: warn
          retention-days: 14
