name: P01 v517 packaged CloudPanel FULL real HTTPS Owner SQLite restoration
on:
  push:
    branches:
      - test/p01-v517-bundled-https-restore-20261119
permissions:
  contents: read
jobs:
  p01-v517-bundled-https-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Public-safe exact-source synthetic test only
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "$GITHUB_REF_NAME" = "test/p01-v517-bundled-https-restore-20261119"
          echo "P01_OWNER_TEST=ISOLATED_SYNTHETIC_BUNDLED_HTTPS_ONLY"
          echo "P01_REAL_BACKUP_TRANSFER=NONE"
          echo "P01_PRODUCTION_OR_CLOUDPANEL_WRITES=NO"
      - name: Checkout exact private source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 170130082d568efd7b6e41743eddba639852c5d7
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
      - name: Verify exact P01 source and version
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "170130082d568efd7b6e41743eddba639852c5d7"
          test "$(cat candidate/VERSION)" = "2.47.517"
          test "$(cat candidate/src/VERSION.txt)" = "2.47.517"
          echo "P01_V517_EXACT_SOURCE=PASS"
      - name: Install disposable Nginx PHP-FPM 8.3 SQLite and Composer runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            nginx openssl curl unzip composer php8.3-cli php8.3-fpm \
            php8.3-sqlite3 php8.3-mysql php8.3-mbstring php8.3-xml \
            php8.3-curl >/dev/null
          command -v nginx
          command -v php-fpm8.3
          command -v composer
          php -r 'if (PHP_VERSION_ID < 80300 || !in_array("sqlite", PDO::getAvailableDrivers(), true)) exit(1); echo "P01_NATIVE_PHP_SQLITE=PASS\n";'
      - name: Setup pinned Node22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Native full bundle build using source-pinned Composer/npm locks
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 scripts/build_p01_next_clean_full.py build \
            --source-sha 170130082d568efd7b6e41743eddba639852c5d7 \
            --output /tmp/p01-v517-owner-clean-developer.zip
          python3 scripts/build_p01_next_clean_full.py verify \
            --zip /tmp/p01-v517-owner-clean-developer.zip
          python3 scripts/build_p01_next_cloudpanel_full.py build \
            --source-zip /tmp/p01-v517-owner-clean-developer.zip \
            --output /tmp/p01-v517-owner-cloudpanel-developer.zip
          python3 scripts/build_p01_next_cloudpanel_full.py verify \
            --zip /tmp/p01-v517-owner-cloudpanel-developer.zip
          echo "P01_V517_BUNDLED_VENDOR_AND_VITE_FULL=PASS"
      - name: Real TLS Nginx PHP-FPM Owner chunk preview restore readback
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 tests/compatibility/laravel/http/run_cloudpanel_fpm_full_stage.py \
            --bundle /tmp/p01-v517-owner-cloudpanel-developer.zip \
            --engine sqlite --only-owner-sqlite-restore
          echo "P01_V517_REAL_BUNDLED_HTTPS_OWNER_SQLITE_RESTORE=PASS"
      - name: Delete all transient private source and developer packages
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate
          rm -f -- /tmp/p01-v517-owner-clean-developer.zip /tmp/p01-v517-owner-cloudpanel-developer.zip
          echo "P01_PRIVATE_SOURCE_AND_TEST_ZIP_PERSISTED=NO"
