name: TEMP S01-C02 Ops 1.21.844 Final Audit Storage Trace
on:
  push:
    branches:
      - temp/s01-c02-v121844-record-isolation-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121844-final-audit-storage-trace.yml'
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact Product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 38be815bd77ae62548fe763b106bfec0b937d2c7
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: ops
      - name: Trace helper and exact call
        shell: bash
        run: |
          set -Eeuo pipefail
          cd ops
          file='includes/release/async-job.php'
          line=$(grep -n -m1 'function final_audit_fail' "$file" | cut -d: -f1)
          test -n "$line"
          start=$((line-15)); [ "$start" -lt 1 ] && start=1
          end=$((line+55))
          echo '=== FINAL_AUDIT_FAIL_HELPER ==='
          sed -n "${start},${end}p" "$file"
          line2=$(grep -n -m1 -F "最终候选包无法打开，不能标记可上传。" "$file" | cut -d: -f1)
          start2=$((line2-16)); end2=$((line2+12))
          echo '=== REOPEN_CALL ==='
          sed -n "${start2},${end2}p" "$file"
          echo TRACE_V121844_FINAL_AUDIT_STORAGE=PASS
