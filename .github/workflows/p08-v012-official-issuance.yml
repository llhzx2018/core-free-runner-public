name: P08 v0.1.12 actual legacy v010 to final source official issuance
on:
  pull_request:
    paths:
      - .github/workflows/p08-v012-official-issuance.yml
      - scripts/p08_v012_official_release_once.py
      - scripts/p08_v012_issuance_native.sh
      - scripts/specs/p08-v012-final.json
permissions:
  contents: read
jobs:
  final-real-legacy-atomic-issue:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-v012-official-issuance-20261119' && github.event.pull_request.base.ref == 'main' && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    services:
      db:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: synthetic-only-p08-ci-pass
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=18
    env:
      P08_ISOLATED_INSTALL_TEST: YES
      P08_BASE010_SHA: ef78dcb21117c822e2756360280f2418f794704f
      P08_FINAL012_SHA: dac7bc1d5410c077f32e522eb5740537f618ef9d
      TARGET_VERSION: '0.1.12'
      TARGET_SHA: dac7bc1d5410c077f32e522eb5740537f618ef9d
      TARGET_TREE: 154c43365b84a85150c6af89770e2116275667c4
      P08_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Checkout exact transient public harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout final merged P08 main source from protected release candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: dac7bc1d5410c077f32e522eb5740537f618ef9d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
      - name: Checkout real issued v0.1.10 old PHP installed client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: ef78dcb21117c822e2756360280f2418f794704f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p08
      - name: Checkout effective Source Current Mode T/13 domains
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 883c92ce1a987b5f6e5729b7b73fd098ffaf14ae
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov
      - name: PHP 8.4 Composer and native SQL database modules
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: zip,curl,mbstring,pdo_mysql,pdo_sqlite,sqlite3,openssl,posix,dom,intl,fileinfo
          coverage: none
      - name: Node 22 exact locked web dependencies
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: target/package-lock.json
      - name: Native SQLite and MySQL/MariaDB dump tools
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 420 sudo apt-get -qq update
          timeout 420 sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y mariadb-client sqlite3
          command -v mariadb-dump
      - name: Reverify final merged main, effective one-case governance, old releases and all required real machine jobs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(id -u)" -ne 0
          python3 scripts/ephemeral_lane_spec.py validate --spec scripts/specs/p08-v012-final.json
          python3 scripts/ephemeral_lane_spec.py audit-rendered --spec scripts/specs/p08-v012-final.json --input .github/workflows/p08-v012-official-issuance.yml
          test "$(git -C target rev-parse HEAD)" = dac7bc1d5410c077f32e522eb5740537f618ef9d
          test "$(git -C target rev-parse HEAD^{tree})" = 154c43365b84a85150c6af89770e2116275667c4
          test "$(git -C p08 rev-parse HEAD)" = ef78dcb21117c822e2756360280f2418f794704f
          test "$(git -C gov rev-parse HEAD)" = 883c92ce1a987b5f6e5729b7b73fd098ffaf14ae
          test "$(cat target/VERSION)" = 0.1.12
          grep -q '| skill-release | V3.19 |' gov/CURRENT.md
          grep -q '### Mode T · ONE_CASE_P08_012_ATOMIC_LINEAGE_POST_RELEASE_OWNER_MANUAL' gov/skills/skill-release/V3.19/SKILL.md
          grep -q '## RP-07T ·' target/docs/authority/ACCEPTANCE_MATRIX.md
          test "$(gh api repos/llhzx2018/vf-adops/git/ref/heads/main --jq .object.sha)" = dac7bc1d5410c077f32e522eb5740537f618ef9d
          test "$(gh api repos/llhzx2018/gov-doc/git/ref/heads/main --jq .object.sha)" = 883c92ce1a987b5f6e5729b7b73fd098ffaf14ae
          test "$(gh api repos/llhzx2018/core-updates/contents/projects/P08-ADOPS.json --jq .sha)" = 368cc70658048bfe160d498b01f6a585fa0f15a5
          test "$(gh api repos/llhzx2018/vf-adops/releases/tags/v0.1.9 --jq .id)" = 449880979
          test "$(gh api repos/llhzx2018/vf-adops/releases/tags/v0.1.10 --jq .id)" = 450188625
          test "$(gh api repos/llhzx2018/vf-adops/releases/tags/v0.1.11 --jq .id)" = 450980192
          for run in 44486691759 44487155332 44487483553; do
            test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$run --jq .conclusion)" = success
          done
          for job in 135433356320 135433356837 135433356844 135434458074; do
            test "$(gh api repos/llhzx2018/core-free-runner-public/actions/jobs/$job --jq .conclusion)" = success
          done
          gh api repos/llhzx2018/core-free-runner-public/actions/jobs/135433356320 --jq .name | grep -q 'sqlite'
          gh api repos/llhzx2018/core-free-runner-public/actions/jobs/135433356837 --jq .name | grep -q 'mysql'
          gh api repos/llhzx2018/core-free-runner-public/actions/jobs/135433356844 --jq .name | grep -q 'mariadb'
          test -z "$(git -C target status --porcelain --untracked-files=all)"
          echo P08_R210_FINAL_RELEASE_MODE_T_3DB_BROWSER_AND_MAIN_SHA=PASS
      - name: Verify actual issued old v010 PHP previous successful cycle archive and replay refusal
        shell: bash
        run: |
          set -Eeuo pipefail
          P08_R145_ISOLATED=YES php p08/tests/test_owner_previous_cycle_archive.php
          php p08/tests/test_owner_future_repeat_cycle.php
          P08_R187_ISOLATED=YES php p08/tests/test_owner_future_one_click.php
          echo P08_R210_OLD_CLIENT_SUCCESS_ARCHIVE_AND_REPEAT_CYCLE=PASS
      - name: Rebuild genuinely issued v019 FULL and v010 Atomic into exact final v012 native Atomic and deterministic packages
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/p08_v012_issuance_native.sh sqlite
          # Composer/Vite legitimately create build outputs in the temporary
          # checked-out source. Audit executable tracked paths without
          # treating the package builder output as unauthorized source edits.
          test "$(git -C target rev-parse HEAD)" = dac7bc1d5410c077f32e522eb5740537f618ef9d
          test "$(git -C target rev-parse HEAD^{tree})" = 154c43365b84a85150c6af89770e2116275667c4
          git -C target diff --exit-code --quiet -- src app routes config
          echo P08_R210_EXACT_FINAL_LEGACY_NATIVE_3DB_REUSED_AND_SQLITE_REPRODUCED=PASS
      - name: Assemble canonical official FULL and legacy-safe Atomic only after real source machine tests
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -m 700 "$RUNNER_TEMP/p08-r210-final"
          cp "$RUNNER_TEMP/p08-r210-sqlite/012-full-A.zip" "$RUNNER_TEMP/p08-r210-final/VF_AdOps_V0.1.12_FULL.zip"
          cp "$RUNNER_TEMP/p08-r210-sqlite/012-update-A.zip" "$RUNNER_TEMP/p08-r210-final/VF_AdOps_V0.1.12_UPDATE.zip"
          cmp "$RUNNER_TEMP/p08-r210-final/VF_AdOps_V0.1.12_FULL.zip" "$RUNNER_TEMP/p08-r210-sqlite/012-full-B.zip"
          cmp "$RUNNER_TEMP/p08-r210-final/VF_AdOps_V0.1.12_UPDATE.zip" "$RUNNER_TEMP/p08-r210-sqlite/012-update-B.zip"
          test "$(sha256sum "$RUNNER_TEMP/p08-r210-final/VF_AdOps_V0.1.12_FULL.zip" | cut -d' ' -f1)" = 721aaad6ae41d1faedff80f06a78320d3bb86faf26ccd0f4917e5d4a2d94cca6
          sha256sum "$RUNNER_TEMP/p08-r210-final/"*.zip
          echo P08_R210_FINAL_DOUBLE_BUILD_FULL_ATOMIC_MATCH=PASS
      - name: Prepare immutable provenance, release notes and real artifact SHA256SUMS
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$RUNNER_TEMP/p08-r210-final" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          full="VF_AdOps_V0.1.12_FULL.zip"
          update="VF_AdOps_V0.1.12_UPDATE.zip"
          h=lambda n:hashlib.sha256((root/n).read_bytes()).hexdigest()
          assert h(full)=="721aaad6ae41d1faedff80f06a78320d3bb86faf26ccd0f4917e5d4a2d94cca6"
          prov={
            "schema_version":"1.0","product":"P08","repository":"llhzx2018/vf-adops",
            "target_version":"0.1.12",
            "target_sha":"dac7bc1d5410c077f32e522eb5740537f618ef9d","tree_sha":"154c43365b84a85150c6af89770e2116275667c4",
            "governance_sha":"883c92ce1a987b5f6e5729b7b73fd098ffaf14ae",
            "release_mode":"ONE_CASE_P08_012_ATOMIC_LINEAGE_POST_RELEASE_OWNER_MANUAL",
            "source_pr":75,"authority_pr":76,
            "asset_role":"CLEAN_FULL_AND_ATOMIC_010_LEGACY_TO_012",
            "source_version":"0.1.10",
            "source_sha":"ef78dcb21117c822e2756360280f2418f794704f",
            "source_full_manifest_sha256":"efebfefde3115864dba71c2e56fedae2f7ada8ad4064010473d716b689f67fe9",
            "unsupported_clean_v010_manifest":"ab7f6b6f5e484c8efdf96d1b0a531b114d2ac1b1a3b45e52a072345a2ea0f110",
            "data_included":False,"schema_changes":False,
            "backup_required":True,"rollback_supported":True,"production_auto_apply":False,
            "full_sha256":h(full),"full_bytes":(root/full).stat().st_size,
            "atomic_sha256":h(update),"atomic_bytes":(root/update).stat().st_size,
            "machine_3db_run":"44487155332","machine_https_run":"44487483553",
            "owner_preview":"POST_RELEASE_REQUIRED_NOT_PASS",
            "owner_real_use":"POST_OWNER_MANUAL_PRODUCTION_REQUIRED_NOT_PASS"
          }
          (root/"RELEASE_PROVENANCE.json").write_text(json.dumps(prov,sort_keys=True,indent=2)+"\n",encoding="utf-8")
          notes="""# VF AdOps v0.1.12 — 连续原生升级修复

          这是专为真实旧版连续升级链发行的安全兼容包：原始官方 v0.1.9 FULL → v0.1.10 Atomic 后，才可在旧版后台手工检查并一次点击完成到 v0.1.12 的安全升级。兼容源必须是源码 ef78dcb21117c822e2756360280f2418f794704f、已安装旧版 FULL_MANIFEST SHA256 efebfefde3115864dba71c2e56fedae2f7ada8ad4064010473d716b689f67fe9；这是安全验证过的具体源，不允许跳过哈希或改清单。

          另一个合法的全新 v0.1.10 FULL 安装具有不同清单 SHA256 ab7f6b6f5e484c8efdf96d1b0a531b114d2ac1b1a3b45e52a072345a2ea0f110，本次旧版单频道 Atomic **不声明**兼容该来源；校验失败会安全停下，不能覆盖文件。真正正式站若来源与此唯一许可不符，当前发行不保证可升级。

          此次修复彻底规范下一次 Atomic 的 metadata/full manifest 字节一致性，明确 GitHub 授权失败、安装来源不符等安全错误提示，避免历史成功消息冒充新任务。全程保留原生数据库/媒体完整备份、写锁、失败回滚、SIGKILL 后独立恢复；无新表、无数据库迁移、不自动升级/下载。升级时应由 Owner 在后台先检查官方更新再点一次安全升级，绝不使用 FULL 覆盖旧站。历史 v0.1.11 Release 资产不追改。

          所有开发和真实机器验证由开发者完成。本人 Preview/Real Use 只在此次真实正式分发完成及 Owner 手工 Production 升级后验收，不声称已 PASS。Production、CloudPanel、DNS 永不自动变动。
          """
          (root/"RELEASE_NOTES.md").write_text(notes,encoding="utf-8")
          names=[full,update,"RELEASE_PROVENANCE.json","RELEASE_NOTES.md"]
          (root/"SHA256SUMS").write_text("\n".join(h(n)+"  "+n for n in names)+"\n",encoding="utf-8")
          print("P08_R210_OFFICIAL_PROVENANCE_AND_CHECKSUMS=PASS")
          PY
      - name: Issue exactly once then independently compare real GitHub remote bytes and IDs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          P08_R210_ISOLATED: YES
        run: |
          set -Eeuo pipefail
          python3 scripts/p08_v012_official_release_once.py
      - name: Cleanup private transient checkout and all real packages even on failure
        if: always()
        shell: bash
        run: |
          rm -rf -- p08 target gov "$RUNNER_TEMP/p08-r210-final" "$RUNNER_TEMP/p08-r210-sqlite" "$RUNNER_TEMP/p08-r129-real-issued-r131-r155-sqlite-first" "$RUNNER_TEMP/p08-r129-real-issued-r131-r155-sqlite-fault" "$RUNNER_TEMP/p08-r129-real-issued-r131-r155-sqlite-kill"
          test ! -e p08 && test ! -e target && test ! -e gov
          echo P08_R210_PRIVATE_SOURCE_AND_RELEASE_BUFFER_CLEANED=PASS
