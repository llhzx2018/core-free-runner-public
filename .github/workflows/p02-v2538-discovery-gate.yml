name: P02 V2.5.38 Discovery Gate

on:
  push:
    branches:
      - run/p02-v2538-discovery-20260919
    paths:
      - '.github/workflows/p02-v2538-discovery-gate.yml'

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact P02 release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 8bf8471bc3e33613f26d0eddc0dfe11ab1ba9895
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product

      - name: Verify public stable discovery semantics
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/projects/P02.json' > /tmp/P02.json
          python3 - /tmp/P02.json <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1],encoding='utf-8'))
          assert x['project_id']=='P02'
          assert x['component_id']=='APP'
          assert x['enabled'] is True
          assert x['target_version']=='2.5.38'
          assert x['from_versions']==['2.5.35','2.5.36','2.5.37']
          assert x['schema_from']==x['schema_to']=='2401'
          assert x['repository']=='llhzx2018/vf-library'
          assert x['release_tag']=='v2.5.38'
          assert x['release_id']==392023011
          assert x['product_identity']=='8bf8471bc3e33613f26d0eddc0dfe11ab1ba9895'
          assert x['asset_name']=='VF_Library_V2.5.38_UPDATE.zip'
          assert x['asset_bytes']==380652
          assert x['asset_sha256']=='6eb60adb527525ae3a0fb8a1fcfde3f43b82de6948327b03a215919c834dca10'
          assert x['backup_required'] is True and x['rollback_supported'] is True
          print('P02_V2538_PUBLIC_MANIFEST_IDENTITY=PASS')
          PY
          php -r '
            require "product/src/app/CoreUpdates/UpdateAdapter.php";
            require "product/src/app/CoreUpdates/UpdateCore.php";
            $m=json_decode(file_get_contents("/tmp/P02.json"),true,512,JSON_THROW_ON_ERROR);
            $c=new \CoreUpdates\UpdateCore("P02","APP");
            foreach(["2.5.35","2.5.36","2.5.37"] as $v){
              $r=$c->check($v,"2401",$m);
              if(($r["status"]??"")!=="AVAILABLE"){fwrite(STDERR,$v.":".json_encode($r)."\n");exit(2);}
              echo "P02_V2538_DISCOVERY_".$v."=AVAILABLE\n";
            }
            $r=$c->check("2.5.38","2401",$m);
            if(($r["status"]??"")!=="UP_TO_DATE"){fwrite(STDERR,json_encode($r)."\n");exit(3);}
            echo "P02_V2538_DISCOVERY_2.5.38=UP_TO_DATE\n";
          '
          echo P02_V2538_DISCOVERY_GATE=PASS
