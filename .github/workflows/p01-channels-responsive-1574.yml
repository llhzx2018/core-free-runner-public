name: P01 Channels Responsive Reader One-shot #1574
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-channels-responsive-1574.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_REPO: llhzx2018/vf-start
      EXACT_SHA: e1a51cb92788f3d46e948c660fed85a7cb99cee3
      STABLE_TAG: v2.47.410
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl,mbstring,sqlite3,pdo_sqlite,SimpleXML,zip
          coverage: none
      - name: Checkout exact private candidate and formal baseline
        shell: bash
        env:
          TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$TOKEN"
          ROOT="$RUNNER_TEMP/p01-responsive-1574"
          mkdir -p "$ROOT"
          chmod 700 "$ROOT"
          echo "P01_WORK=$ROOT" >> "$GITHUB_ENV"
          git clone -q --no-checkout "https://x-access-token:${TOKEN}@github.com/$SOURCE_REPO.git" "$ROOT/candidate"
          git -C "$ROOT/candidate" checkout -q --detach "$EXACT_SHA"
          git -C "$ROOT/candidate" remote set-url origin "https://github.com/$SOURCE_REPO.git"
          test "$(git -C "$ROOT/candidate" rev-parse HEAD)" = "$EXACT_SHA"
          git clone -q --depth 1 --branch "$STABLE_TAG" "https://x-access-token:${TOKEN}@github.com/$SOURCE_REPO.git" "$ROOT/stable"
          git -C "$ROOT/stable" remote set-url origin "https://github.com/$SOURCE_REPO.git"
          echo P01_CHANNEL_RESPONSIVE_EXACT_SOURCE=PASS
      - name: Focused PHP JS and browser-mock regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$P01_WORK/candidate"
          php -l src/app/ChannelLibraryPage.php
          node --check src/assets/channel-video-feed.js
          node --check tests/browser/channel_reader_responsive_owner_smoke.cjs
          node --check tests/integration/channel_video_feed_layout_node.js
          php tests/unit/channels_reader_shell_r2_contract.php
          php tests/unit/channels_page_full_polish_contract.php
          php tests/unit/channels_v247125_mature_source_library_contract.php
          php tests/unit/channels_v247136_source_row_cascade_contract.php
          php tests/unit/channel_video_feed_owner_cache_native.php
          php tests/unit/youtube_manual_updates_cache_native.php
          php tests/unit/youtube_batch_server_contract_native.php
          node tests/browser/channel_reader_responsive_owner_smoke.cjs
          node tests/integration/channel_video_feed_layout_node.js
          node tests/integration/youtube_batch_sequential_node.js
          node tests/integration/youtube_modal_thumbnails_node.js
          echo P01_CHANNEL_RESPONSIVE_FOCUSED=PASS
      - name: Zero-debt canonical formal baseline regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash "$P01_WORK/candidate/tests/canonical_release_regression.sh" "$P01_WORK/candidate" "$P01_WORK/stable" --require-zero-debt | tee "$P01_WORK/canonical.log"
          grep -Fx P01_CANONICAL_UNIT_REGRESSION=PASS "$P01_WORK/canonical.log"
          grep -Fx P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS "$P01_WORK/canonical.log"
          echo P01_CHANNEL_RESPONSIVE_CANONICAL=PASS
      - name: Remove private candidate source
        if: always()
        shell: bash
        run: |
          if [ -n "${P01_WORK:-}" ]; then rm -rf -- "$P01_WORK"; fi
          echo P01_CHANNEL_RESPONSIVE_EPHEMERAL=PASS
