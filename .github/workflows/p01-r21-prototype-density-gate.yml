name: P01 R21 Prototype Density Gate

on:
  pull_request:
    paths:
      - '.github/workflows/p01-r21-prototype-density-gate.yml'

permissions:
  contents: read

concurrency:
  group: p01-r21-prototype-density-gate
  cancel-in-progress: false

jobs:
  gate:
    if: github.head_ref == 'temp/p01-r21-prototype-density-gate-20260910'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      BASE_SHA: 4a5d2a4ddccdfb0e3ea70d62af83c7a664563fb5
      CANDIDATE_SHA: 7a7a3a2d6c63002899ff8815ea2af685cbcc2955
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}

    steps:
      - name: Exact source authority
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/main" --jq '.object.sha')" = "$BASE_SHA"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/work/p01-r21-prototype-density-20260910" --jq '.object.sha')" = "$CANDIDATE_SHA"
          echo P01_R21_EXACT_SOURCE=PASS

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.CANDIDATE_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: vf-start

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd
          coverage: none

      - name: Bounded source and contract gate
        working-directory: vf-start
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l tests/unit/prototype_density_contract.php
          php tests/unit/prototype_density_contract.php | tee /tmp/p01-r21-contract.log
          grep -Fx 'P01_R21_PROTOTYPE_DENSITY_CONTRACT=PASS' /tmp/p01-r21-contract.log
          test "$(sha256sum src/assets/workspace-domain-nav-base.css | awk '{print $1}')" = "$(git show "$BASE_SHA:src/assets/workspace-domain-nav.css" | sha256sum | awk '{print $1}')"
          git diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" | sort >/tmp/r21-files
          printf '%s\n' src/assets/prototype-density.css src/assets/workspace-domain-nav-base.css src/assets/workspace-domain-nav.css tests/unit/prototype_density_contract.php | sort >/tmp/r21-expected
          diff -u /tmp/r21-expected /tmp/r21-files
          test -z "$(git diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" -- src/migrations VF_PROJECT.json src/app/UpdateManager.php src/update.php src/app/Auth.php src/app/SecurityManager.php src/app/Repository.php)"
          echo P01_R21_BOUNDED_SCOPE=PASS

      - name: Fresh install runtime
        working-directory: vf-start
        shell: bash
        run: |
          set -Eeuo pipefail
          RUNTIME=/tmp/p01-r21-runtime
          rm -rf "$RUNTIME"
          cp -a src "$RUNTIME"
          cd "$RUNTIME"
          php -S 127.0.0.1:18121 -t . >/tmp/p01-r21-server.log 2>&1 &
          SERVER_PID=$!
          echo "$SERVER_PID" >/tmp/p01-r21-server.pid
          for i in $(seq 1 30); do
            curl -fsS -c /tmp/p01-r21.cookies -b /tmp/p01-r21.cookies http://127.0.0.1:18121/setup.php -o /tmp/p01-r21-setup.html && break
            sleep 1
          done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-r21-setup.html',encoding='utf-8').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s)
          assert m
          print(m.group(1))
          PY
          )
          PASS="Gate${GITHUB_RUN_ID}R21x"
          curl -fsS -c /tmp/p01-r21.cookies -b /tmp/p01-r21.cookies -X POST http://127.0.0.1:18121/setup.php \
            --data-urlencode "setup_csrf=$CSRF" \
            --data-urlencode 'site_title=VF Start R21 Gate' \
            --data-urlencode "admin_password=$PASS" \
            --data-urlencode "admin_password_confirm=$PASS" \
            -o /tmp/p01-r21-post.html
          test -f app/.runtime.php
          php cli/verify.php | tee /tmp/p01-r21-verify.txt
          grep -Fx 'VERIFY_PASS=YES' /tmp/p01-r21-verify.txt
          for p in /start.php /channels.php /watch.php /topics.php /courses.php /projects.php /tools.php /software.php; do
            test "$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:18121$p")" = 200
          done
          echo P01_R21_FRESH_RUNTIME=PASS

      - name: Chromium desktop and mobile geometry
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-r21-playwright
          cd /tmp/p01-r21-playwright
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > verify.mjs <<'JS'
          import { chromium } from 'playwright';
          const base='http://127.0.0.1:18121/';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1000}});
          const noOverflow=async(label)=>{
            const v=await page.evaluate(()=>({scroll:document.documentElement.scrollWidth,client:document.documentElement.clientWidth}));
            if(v.scroll-v.client>1)throw new Error(label+' horizontal overflow '+JSON.stringify(v));
            return v;
          };
          await page.goto(base+'start.php',{waitUntil:'networkidle'});
          const nav=await page.evaluate(()=>{
            const side=document.querySelector('.vf-app-sidebar');
            const stage=document.querySelector('.vf-app-stage');
            const row=document.createElement('article');row.className='vf-asset-row';
            const copy=document.createElement('span');copy.className='vf-asset-copy';copy.innerHTML='<strong>Readable title</strong><small>domain · category</small>';
            row.append(copy);document.querySelector('.vf-shell-main').append(row);
            return {sidebar:getComputedStyle(side).display,sideWidth:side.getBoundingClientRect().width,stageLeft:stage.getBoundingClientRect().left,rowHeight:row.getBoundingClientRect().height,titleSize:parseFloat(getComputedStyle(copy.querySelector('strong')).fontSize),metaSize:parseFloat(getComputedStyle(copy.querySelector('small')).fontSize)};
          });
          if(nav.sidebar==='none'||nav.sideWidth<200||nav.stageLeft<200||nav.rowHeight<54||nav.titleSize<13||nav.metaSize<11)throw new Error('navigation density '+JSON.stringify(nav));
          await noOverflow('navigation');

          const cases=[
            ['watch.php','vf-watch-library-grid','6','<article class="vf-watch-library-card"><div class="vf-watch-copy"><strong>Movie title</strong><small>2026 · 8.6</small></div></article>','.vf-watch-copy strong',13],
            ['topics.php','vf-topic-library-grid','4','<article class="vf-topic-library-card"><a class="vf-topic-library-cover"></a><div class="vf-topic-library-body"><h3>Topic title</h3><p>Knowledge summary</p></div></article>','.vf-topic-library-body h3',14],
            ['courses.php','vf-course-grid','2','<article class="vf-course-card"><a class="vf-course-cover"><span class="vf-course-cover-art"></span></a><div class="vf-course-card-body"><h3>Course title</h3></div></article>','.vf-course-card h3',14],
            ['channels.php','vf-channel-grid','3','<article class="vf-channel-card"><span class="vf-channel-avatar"></span><div class="vf-channel-copy"><h3>Channel title</h3><p>Source summary</p></div></article>','.vf-channel-copy h3',13.5],
            ['projects.php','vf-project-action-grid','2','<article class="vf-project-action-card"><h3>Project title</h3></article>','.vf-project-action-card h3',13.5],
            ['tools.php','vf-tool-scene-grid','4','<a class="vf-tool-scene-card"><span class="vf-tool-scene-icon"></span><span class="vf-tool-scene-copy"><strong>Task scene</strong><small>12 tools</small><em>What it solves</em></span></a>','.vf-tool-scene-copy strong',13.5],
            ['software.php','vf-software-common-grid','6','<a class="vf-software-common-card"><span class="vf-software-common-icon"></span><strong>App name</strong><small>Windows</small></a>','.vf-software-common-card strong',12]
          ];
          const results={navigation:nav,subjects:{}};
          for(const [path,klass,columns,html,textSelector,minText] of cases){
            await page.goto(base+path,{waitUntil:'networkidle'});
            const r=await page.evaluate(({klass,html,textSelector})=>{
              const side=document.querySelector('.vf-app-sidebar');
              const stage=document.querySelector('.vf-app-stage');
              const grid=document.createElement('div');grid.className=klass;grid.innerHTML=html.repeat(8);document.querySelector('.vf-shell-main').append(grid);
              const style=getComputedStyle(grid);const cols=style.gridTemplateColumns.split(' ').filter(Boolean).length;
              const text=grid.querySelector(textSelector);
              return {sidebar:getComputedStyle(side).display,stageLeft:stage.getBoundingClientRect().left,mainWidth:document.querySelector('.vf-shell-main').getBoundingClientRect().width,display:style.display,cols,textSize:text?parseFloat(getComputedStyle(text).fontSize):0};
            },{klass,html,textSelector});
            if(r.sidebar!=='none'||Math.abs(r.stageLeft)>1||r.mainWidth<1100||r.display!=='grid'||r.cols!==Number(columns)||r.textSize<minText)throw new Error(path+' geometry '+JSON.stringify(r));
            await noOverflow(path);
            results.subjects[path]=r;
          }
          const mobile=await browser.newPage({viewport:{width:390,height:844}});
          for(const path of ['start.php','watch.php','topics.php','courses.php','channels.php','projects.php','tools.php','software.php']){
            await mobile.goto(base+path,{waitUntil:'networkidle'});
            const r=await mobile.evaluate(()=>({scroll:document.documentElement.scrollWidth,client:document.documentElement.clientWidth,side:document.querySelector('.vf-app-sidebar')?getComputedStyle(document.querySelector('.vf-app-sidebar')).display:'missing'}));
            if(r.scroll-r.client>1)throw new Error(path+' mobile overflow '+JSON.stringify(r));
          }
          console.log('P01_R21_BROWSER_GEOMETRY='+JSON.stringify(results));
          await browser.close();
          JS
          node verify.mjs | tee /tmp/p01-r21-browser.log
          grep -F 'P01_R21_BROWSER_GEOMETRY=' /tmp/p01-r21-browser.log
          echo P01_R21_CHROMIUM=PASS

      - name: Final verdict
        run: |
          echo P01_R21_PROTOTYPE_DENSITY=PASS
          echo DATA_SCHEMA_CHANGE=false
          echo UPDATER_CHANGE=false
          echo RELEASE=false
          echo PRODUCTION=false

      - name: Cleanup
        if: always()
        run: |
          if test -f /tmp/p01-r21-server.pid; then kill "$(cat /tmp/p01-r21-server.pid)" 2>/dev/null || true; fi
          rm -rf vf-start /tmp/p01-r21-*
