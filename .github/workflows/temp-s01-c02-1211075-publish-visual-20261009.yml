name: S01-C02 1075 Publish UI Actual Asset Gate
on:
  push:
    branches: [test/s01-c02-1211075-publish-visual-20261009]
jobs:
  publish-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      db:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: fixture-root
          MARIADB_DATABASE: ops_1075_ui
          MARIADB_USER: vf
          MARIADB_PASSWORD: fixture-pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - name: Exact Ops source checkout
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: b37f63ef030d8df257919d9ef8e9ffc7bd2e5166
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: PHP and browser packages
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, pdo_mysql, zip, curl, mbstring
          coverage: none
      - name: Playwright environment
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Syntax and version
        run: |
          test "$(cat VERSION)" = "1.21.1075"
          php -l includes/admin-v13/views/publish_zip_v6.php
          php -l includes/views/admin-style-helpers/admin-s01-uiux-polish.php
          php -l tests/s01-c02-1211075-publish-asset-wordpress.php
          node --check tests/s01-c02-1211075-publish-visual-realview-browser.js
          node --check assets/js/admin-publish-zip.js
      - name: Actual PHP view and loaded CSS geometry 1440/1024/390
        run: node tests/s01-c02-1211075-publish-visual-realview-browser.js
      - name: Existing publish preflight browser regression
        run: node tests/s01-c02-1211073-publish-preflight-browser.js
      - name: Existing ZIP upload retry fail-closed regression
        run: node tests/s01-c02-1211067-zip-input-browser-e2e.js
      - name: Existing job pause resume regression
        run: node tests/s01-c02-1211066-publish-zip-operator-resume-browser.js
      - name: Isolated real WordPress final CSS enqueue
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/wp1075"; mkdir -p "$ROOT"; WP="$ROOT/site"; mkdir -p "$WP"
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o "$ROOT/wp"
          wpqa(){ php "$ROOT/wp" --path="$WP" "$@"; }
          wpqa core download --version=7.0.2 --force
          wpqa config create --dbname=ops_1075_ui --dbuser=vf --dbpass=fixture-pass --dbhost=127.0.0.1 --skip-check
          wpqa core install --url=https://fixture.invalid --title=Isolated --admin_user=admin --admin_password=fixture-admin --admin_email=qa@example.invalid --skip-email
          mkdir -p "$WP/wp-content/plugins/vf-ops"
          rsync -a --exclude='.git' --exclude='node_modules' ./ "$WP/wp-content/plugins/vf-ops/"
          wpqa plugin activate vf-ops
          wpqa eval-file "$WP/wp-content/plugins/vf-ops/tests/s01-c02-1211075-publish-asset-wordpress.php" publish
          wpqa eval-file "$WP/wp-content/plugins/vf-ops/tests/s01-c02-1211075-publish-asset-wordpress.php" system
      - name: Exact runtime ZIP from visually verified source
        run: |
          mkdir -p /tmp/s01-1075
          python3 .github/release/build-ops-package.py --output /tmp/s01-1075/vf-tools-ops_V1.21.1075.zip > /tmp/s01-1075/manifest.json
          unzip -tq /tmp/s01-1075/vf-tools-ops_V1.21.1075.zip
          cat /tmp/s01-1075/manifest.json
      - name: Save tested binary evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-v1.21.1075-real-css-owner-candidate
          path: /tmp/s01-1075/
          retention-days: 30
