name: GOV Common Baseline V2 P01-P06 Closure Gate V2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gov-common-baseline-v2-p01-p06-closure-gate-v2-20260828.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOV_EXACT_SOURCE: 76db25f21f2b475e7d1aec352de77bbf326139f2
      GOV_BASE: 827318198e26a4b8bae06b7e8570a14f54678c84
      GOV_BRANCH: governance/common-product-baseline-v2-cross-project-closure-20260828
      P01_SHA: 6b774b6f46c26b94ea83f5de8754f4db556447a5
      P02_SHA: a3e42bfecd1214f68e59eb20eba498f0e8ae0dca
      P03_SHA: cc9a6da445240534016d08e148aa8a28c11be241
      P04_SHA: 45f35274284071649f6a3103d3a9e4383da90083
      P05_SHA: ec613be42f18bd0456a7e5f5d9c0bbbe25a6e22c
      P06_SHA: 44def40930019b1c597e404fa49c98d4ceb2ac42
    steps:
      - name: Checkout exact GOV-DOC closure candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/gov-doc
          ref: ${{ env.GOV_EXACT_SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: gov
      - name: GOV source fence and immutable V2 authority
        shell: bash
        run: |
          set -Eeuo pipefail
          cd gov
          test "$(git rev-parse HEAD)" = "$GOV_EXACT_SOURCE"
          test "$(git rev-parse origin/$GOV_BRANCH)" = "$GOV_EXACT_SOURCE"
          test "$(git rev-parse origin/main)" = "$GOV_BASE"
          test -z "$(git diff --name-only "$GOV_BASE" "$GOV_EXACT_SOURCE" -- governance/agent/VF_COMMON_PRODUCT_BASELINE_AUTHORITY.json governance/agent/VF_COMMON_PRODUCT_BASELINE_V2_REMEDIATION_SET_P01_P06.json)"
          mapfile -t changed < <(git diff --name-only "$GOV_BASE" "$GOV_EXACT_SOURCE")
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fxq 'governance/agent/evidence/VF_COMMON_PRODUCT_BASELINE_V2_P01_P06_RUNTIME_CLOSURE_20260828.json'
          printf '%s\n' "${changed[@]}" | grep -Fxq 'governance/agent/evidence/VF_COMMON_PRODUCT_BASELINE_V2_P01_P06_RUNTIME_CLOSURE_20260828.md'
          python3 - <<'PY'
          import json
          domains=['TIME','AUTH','UPDATE','BACKUP','DATA','API','JOB','NOTIFICATION','LOGGING','UI_COMMON_STATES','FILE_UPLOAD','HEALTH','VERSION','CACHE','LOCALE']
          a=json.load(open('governance/agent/VF_COMMON_PRODUCT_BASELINE_AUTHORITY.json'))
          assert a['capability_id']=='VF-COMMON-PRODUCT-BASELINE@2.0'
          assert a['version']=='2.0' and a['status']=='CURRENT'
          assert a['domain_order']==domains
          assert a['runtime_resolution']['no_shadow_truth'] is True
          assert a['runtime_resolution']['unknown_is_not_pass'] is True
          assert a['machine_gate']['machine_pass_requires_real_execution'] is True
          assert a['release'] is False and a['production'] is False
          plan=json.load(open('governance/agent/VF_COMMON_PRODUCT_BASELINE_V2_REMEDIATION_SET_P01_P06.json'))
          assert plan['status']=='CANDIDATE_READ_ONLY_PLAN_NOT_EXECUTED'
          assert plan['runtime_write_performed'] is False
          assert plan['scope']==['P01','P02','P03','P04','P05','P06']
          print('GOV_V2_AUTHORITY_IMMUTABLE=PASS')
          PY
      - name: Validate closure candidate matrix contract
        shell: bash
        run: |
          set -Eeuo pipefail
          cd gov
          python3 - <<'PY'
          import json,os
          p='governance/agent/evidence/VF_COMMON_PRODUCT_BASELINE_V2_P01_P06_RUNTIME_CLOSURE_20260828.json'
          x=json.load(open(p))
          domains=['TIME','AUTH','UPDATE','BACKUP','DATA','API','JOB','NOTIFICATION','LOGGING','UI_COMMON_STATES','FILE_UPLOAD','HEALTH','VERSION','CACHE','LOCALE']
          expected={
            'P01':['PASS','PASS','PASS','PASS','PASS','PASS','PASS','PASS','PASS','PASS','EXCEPTION','PASS','PASS','PASS','PASS'],
            'P02':['PASS']*15,
            'P03':['PASS','PASS','PASS','PASS','PASS','PASS','PASS','EXCEPTION','PASS','PASS','EXCEPTION','PASS','PASS','EXCEPTION','PASS'],
            'P04':['PASS','PASS','PASS','PASS','PASS','EXCEPTION','PASS','PASS','PASS','PASS','N_A','PASS','PASS','EXCEPTION','PASS'],
            'P05':['PASS','PASS','PASS','PASS','PASS','PASS','PASS','N_A','PASS','PASS','PASS','PASS','PASS','PASS','PASS'],
            'P06':['EXCEPTION','PASS','PASS','PASS','PASS','EXCEPTION','PASS','N_A','PASS','PASS','PASS','PASS','PASS','PASS','PASS'],
          }
          shas={'P01':os.environ['P01_SHA'],'P02':os.environ['P02_SHA'],'P03':os.environ['P03_SHA'],'P04':os.environ['P04_SHA'],'P05':os.environ['P05_SHA'],'P06':os.environ['P06_SHA']}
          assert x['status']=='MACHINE_VERIFICATION_PENDING'
          assert x['baseline_id']=='VF-COMMON-PRODUCT-BASELINE@2.0'
          assert x['scope']==list(expected)
          assert x['domain_order']==domains
          req=x['closure_requirements']
          assert req['project_count']==6 and req['required_domain_count_per_project']==15
          assert req['all_v2_adoptions_current'] is True and req['all_projects_have_machine_pass'] is True
          assert req['unexplained_drift']==0 and req['required_unknown']==0
          assert req['exceptions_must_be_traceable'] is True and req['n_a_must_be_reasoned'] is True and req['no_shadow_truth'] is True
          assert req['baseline_v2_release_executed'] is False and req['baseline_v2_tag_created'] is False and req['baseline_v2_production_changed'] is False
          rows=x['matrix']; assert len(rows)==6
          seen=set()
          for row in rows:
            pid=row['Project']; assert pid in expected and pid not in seen; seen.add(pid)
            assert row['Profile']=='PERSONAL_SINGLE_ADMIN'
            assert row['Current_main']==shas[pid]
            states=[row[d] for d in domains]
            assert states==expected[pid],(pid,states,expected[pid])
            assert all(s in {'PASS','EXCEPTION','N_A'} for s in states)
            for e in row['Exceptions']:
              assert e.get('id') and e.get('domain') in domains and e.get('reason') and isinstance(e.get('active'),bool)
            for n in row['N_A']:
              assert n.get('domain') in domains and n.get('reason')
            assert row['Machine_Evidence']['result']=='PASS'
          assert seen==set(expected)
          ms=x['maintenance_semantics']
          assert ms['required']==['SYSTEM_INFO','SYSTEM_BASELINE','ONLINE_UPDATE','BACKUP_RESTORE','RUNTIME_HEALTH']
          assert all(ms[p]=='PASS' for p in expected)
          assert ms['operation_state_security_semantics_consistent'] is True
          rem=x['remediation_execution']
          assert rem['plan_snapshot_preserved_unchanged'] is True and rem['project_runtime_adoption_complete'] is True
          assert len(rem['cross_project_live_readback_remediation'])==1
          r=rem['cross_project_live_readback_remediation'][0]
          assert r['project']=='P04' and r['id']=='P04-LOGGING-DOMAIN-COVERAGE' and r['machine_result']=='PASS' and r['merged_main']==shas['P04']
          assert x['machine_verification']['state']=='PENDING'
          assert x['closure_result']=='PENDING_MACHINE_VERIFICATION'
          assert x['release'] is False and x['tag'] is False and x['production'] is False
          print('GOV_P01_P06_CLOSURE_MATRIX_CANDIDATE=PASS')
          PY
          grep -Fq 'Status: **MACHINE_VERIFICATION_PENDING**' governance/agent/evidence/VF_COMMON_PRODUCT_BASELINE_V2_P01_P06_RUNTIME_CLOSURE_20260828.md
      - name: Checkout P01 current main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {repository: llhzx2018/vf-start, ref: '${{ env.P01_SHA }}', token: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}', fetch-depth: 1, persist-credentials: false, path: p01}
      - name: Checkout P02 current main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {repository: llhzx2018/vf-library, ref: '${{ env.P02_SHA }}', token: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}', fetch-depth: 1, persist-credentials: false, path: p02}
      - name: Checkout P03 current main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {repository: llhzx2018/vf-forge, ref: '${{ env.P03_SHA }}', token: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}', fetch-depth: 1, persist-credentials: false, path: p03}
      - name: Checkout P04 current main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {repository: llhzx2018/vf-infra, ref: '${{ env.P04_SHA }}', token: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}', fetch-depth: 1, persist-credentials: false, path: p04}
      - name: Checkout P05 current main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {repository: llhzx2018/vf-seo, ref: '${{ env.P05_SHA }}', token: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}', fetch-depth: 1, persist-credentials: false, path: p05}
      - name: Checkout P06 current main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {repository: llhzx2018/vf-press, ref: '${{ env.P06_SHA }}', token: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}', fetch-depth: 1, persist-credentials: false, path: p06}
      - name: Verify six live Current Adoptions
        shell: bash
        run: |
          set -Eeuo pipefail
          for spec in "p01:$P01_SHA" "p02:$P02_SHA" "p03:$P03_SHA" "p04:$P04_SHA" "p05:$P05_SHA" "p06:$P06_SHA"; do
            dir="${spec%%:*}"; sha="${spec#*:}"
            test "$(git -C "$dir" rev-parse HEAD)" = "$sha"
            test -f "$dir/docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION.json"
          done
          python3 - <<'PY'
          import json,os,pathlib
          expected={'p01':os.environ['P01_SHA'],'p02':os.environ['P02_SHA'],'p03':os.environ['P03_SHA'],'p04':os.environ['P04_SHA'],'p05':os.environ['P05_SHA'],'p06':os.environ['P06_SHA']}
          for d,sha in expected.items():
            a=json.loads((pathlib.Path(d)/'docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION.json').read_text())
            assert a['state']=='CURRENT',(d,a.get('state'))
            assert a['baseline_id']=='VF-COMMON-PRODUCT-BASELINE@2.0',(d,a.get('baseline_id'))
            assert a['profile']=='PERSONAL_SINGLE_ADMIN',(d,a.get('profile'))
            mv=a.get('machine_verification',{})
            machine_state=mv.get('state',mv.get('status'))
            assert machine_state=='PASS',(d,mv)
            for key in ('release','release_executed','tag','tag_created','production','production_changed'):
              if key in a: assert a[key] is False,(d,key,a[key])
            resolver=a.get('runtime_resolver')
            if resolver: assert (pathlib.Path(d)/resolver).exists(),(d,resolver)
          p04=json.loads((pathlib.Path('p04')/'docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION.json').read_text())
          assert p04['runtime_resolver']=='src/app/CommonBaselineV2Closure.php'
          m=p04['machine_verification']
          assert m['required_domain_count']==15 and m['covered_domain_count']==15 and m['missing_domains']==[] and m['logging_domain']=='PASS'
          assert m['resolver']['drift_count']==0 and m['resolver']['unknown_count']==0
          p06=json.loads((pathlib.Path('p06')/'docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION.json').read_text())
          assert p06['historical_gap'] is True and p06['first_formal_common_product_baseline_adoption'] is True
          print('P01_P06_LIVE_CURRENT_ADOPTIONS=PASS')
          PY
      - name: Cross-project closure verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          cd gov
          test "$(git rev-parse HEAD)" = "$GOV_EXACT_SOURCE"
          test "$(git rev-parse origin/$GOV_BRANCH)" = "$GOV_EXACT_SOURCE"
          test "$(git rev-parse origin/main)" = "$GOV_BASE"
          echo VF_COMMON_BASELINE_V2_P01_P06_CLOSURE_EXACT_SOURCE="$GOV_EXACT_SOURCE"
          echo VF_COMMON_BASELINE_V2_P01_P06_CLOSURE_MACHINE=PASS
          echo PROJECTS_CURRENT=6
          echo REQUIRED_DOMAINS_PER_PROJECT=15
          echo UNEXPLAINED_DRIFT=0
          echo REQUIRED_UNKNOWN=0
          echo COMMON_BASELINE_V2_AUTHORITY=CURRENT
          echo RELEASE=NO
          echo TAG=NO
          echo PRODUCTION=NO
