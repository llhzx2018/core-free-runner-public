name: S01 Theme 1.35.45 Page Body V1 Phase4 Formal Release

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/s01-c01-13545-page-body-v1-formal-release.yml'

permissions:
  contents: read
  actions: read

jobs:
  release:
    if: github.head_ref == 'task/s01-page-body-v1-phase4-formal-release-20260926'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      REPO: llhzx2018/vf-tools-theme
      SHA: 0a1a4f3c1b72b8e1a9b3e21884f9b2fa2aa8a512
      VERSION: 1.35.45
      TAG: v1.35.45
      ASSET: vf-tools-theme_V1.35.45.zip
      PREVIOUS_TAG: v1.35.44
      PREVIOUS_ASSET: vf-tools-theme_V1.35.44.zip
      ROUND: V1.35.45_S01_PAGE_BODY_V1_PHASE4
    steps:
      - name: Credential presence
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"

      - name: Checkout exact Theme main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 0a1a4f3c1b72b8e1a9b3e21884f9b2fa2aa8a512
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: theme
          persist-credentials: false

      - name: Exact source and Page Body contracts
        run: |
          set -Eeuo pipefail
          test "$(git -C theme rev-parse HEAD)" = "$SHA"
          test "$(tr -d '\r\n' < theme/VERSION)" = "$VERSION"
          grep -Fq 'Version: 1.35.45' theme/src/style.css
          grep -Fq "VF Build Round: $ROUND" theme/src/style.css
          grep -Fq "VF_THEME_VERSION', '1.35.45'" theme/src/inc/runtime-constants.php
          for t in theme/tests/s01-c01-page-body-system-v1-*.php; do php -l "$t" >/dev/null; php "$t"; done
          php theme/tests/s01-c01-admin-shell-alignment-r1-contract.php

      - name: PHP syntax and security fence
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find theme/src -type f -name '*.php' -print0 | sort -z)
          test "$(find theme/src -type l | wc -l)" = "0"
          ! find theme/src -type f | grep -E '/(?:\.env|wp-config\.php)$'
          ! find theme/src -type f | grep -Ei '\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$'

      - name: Build deterministic package and Runtime Authority
        run: |
          set -Eeuo pipefail
          rm -rf stage1 stage2 dist previous
          mkdir -p stage1/vf-tools-theme stage2/vf-tools-theme dist previous
          cp -a theme/src/. stage1/vf-tools-theme/
          cp -a theme/src/. stage2/vf-tools-theme/
          rm -f stage1/vf-tools-theme/README.md stage1/vf-tools-theme/CHANGELOG.md
          rm -f stage2/vf-tools-theme/README.md stage2/vf-tools-theme/CHANGELOG.md
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          root=Path('stage1/vf-tools-theme')
          def runtime(rel):
              rel=rel.replace('\\','/').lstrip('/')
              if not rel or '../' in rel:return False
              if re.search(r'(^|/)(?:\.git|\.github|tests?|docs?|evidence|private|tmp|temp|cache|logs?)(/|$)',rel,re.I):return False
              base=Path(rel).name.lower()
              if base in {'readme.md','changelog.md','license','license.txt'}:return False
              if re.search(r'\.(?:sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',rel,re.I):return False
              if '/' not in rel:return rel=='style.css' or rel.lower().endswith('.php')
              return re.match(r'^(?:inc|assets|config|languages|template-parts|templates)/',rel) is not None
          rows=[]
          for p in sorted((x for x in root.rglob('*') if x.is_file()), key=lambda x:x.relative_to(root).as_posix()):
              rel=p.relative_to(root).as_posix()
              if runtime(rel):rows.append((rel,hashlib.sha256(p.read_bytes()).hexdigest()))
          canonical=b''.join(rel.encode()+b'\0'+sha.encode()+b'\n' for rel,sha in rows)
          Path('/tmp/count').write_text(str(len(rows)))
          Path('/tmp/fp').write_text(hashlib.sha256(canonical).hexdigest())
          PY
          (cd stage1 && zip -X -q -r "../dist/$ASSET" vf-tools-theme)
          (cd stage2 && zip -X -q -r "../dist/rebuild-$ASSET" vf-tools-theme)
          cmp "dist/$ASSET" "dist/rebuild-$ASSET"
          unzip -tq "dist/$ASSET" >/dev/null
          unzip -p "dist/$ASSET" vf-tools-theme/style.css | grep -Fq 'Version: 1.35.45'
          sha256sum "dist/$ASSET" | awk '{print $1}' > /tmp/sha
          stat -c '%s' "dist/$ASSET" > /tmp/bytes

      - name: Previous release rollback source
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh release download "$PREVIOUS_TAG" --repo "$REPO" --pattern "$PREVIOUS_ASSET" --dir previous
          unzip -p "previous/$PREVIOUS_ASSET" vf-tools-theme/style.css | grep -Fq 'Version: 1.35.44'

      - name: Publish and remote-readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            j="$(gh api "repos/$REPO/releases/tags/$TAG")"
          else
            cat > /tmp/notes.md <<EOF
          # VF Tools Theme V1.35.45
          S01 Page Body System V1 · Phase 4 macro visual candidate.
          - Shared Page Body macro system across all eight canonical Theme workspaces.
          - Phase 3 responsive/accessibility/legacy-residue closure included.
          - Frozen Shell / Header / Header Menu IA unchanged.
          - Theme settings, Theme Mods, renderer, schema and updater semantics unchanged.
          - OWNER Production macro visual acceptance remains required before page-by-page fine polish.
          EOF
            gh release create "$TAG" "dist/$ASSET#VF Tools Theme $VERSION" --repo "$REPO" --target "$SHA" --title "VF Tools Theme V$VERSION" --notes-file /tmp/notes.md
            j="$(gh api "repos/$REPO/releases/tags/$TAG")"
          fi
          aid="$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.id' <<<"$j")"
          rbytes="$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.size' <<<"$j")"
          rdigest="$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.digest' <<<"$j")"
          lbytes="$(cat /tmp/bytes)"; lsha="$(cat /tmp/sha)"
          test "$rbytes" = "$lbytes"
          test "$rdigest" = "sha256:$lsha"
          test "$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')" = "$SHA"
          mkdir -p /tmp/readback
          gh release download "$TAG" --repo "$REPO" --pattern "$ASSET" --dir /tmp/readback --clobber
          test "$(sha256sum "/tmp/readback/$ASSET" | awk '{print $1}')" = "$lsha"
          cmp "dist/$ASSET" "/tmp/readback/$ASSET"
          cat > /tmp/receipt.json <<EOF
          {"component_id":"S01-C01","version":"$VERSION","source_sha":"$SHA","tag":"$TAG","asset":"$ASSET","asset_id":$aid,"asset_bytes":$lbytes,"asset_sha256":"$lsha","runtime_files":$(cat /tmp/count),"runtime_fingerprint":"$(cat /tmp/fp)","remote_readback":"PASS"}
          EOF

      - name: Upload receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c01-13545-formal-release-${{ github.run_id }}
          path: /tmp/receipt.json
          if-no-files-found: error
          retention-days: 30
