name: P07 menu 2 V2.2.5 one-shot formal release
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-menu2-v225-one-shot.yml'
permissions:
  contents: read
jobs:
  release:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      github.event.pull_request.title == 'release(P07): menu2 VPS V2.2.5 hotfix'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout canonical public distribution main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Exact release gate and readback
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '76a82e839ca97203ecb016d0d312d774db745210'
          test "$(cat dist/p07/0.1.0/overlay/BUILD_ID)" = '0.1.0-release84'
          file='experiments/p07-vps-audit-v225-r1.sh'
          bash -n "$file"
          test "$(NO_COLOR=1 bash "$file" --version | awk '{print $NF}')" = 'V2.2.5'
          test "$(NO_COLOR=1 bash "$file" --build-id)" = '2.2.5-rc1-bounded-quick'
          test "$(sha256sum "$file" | awk '{print $1}')" = '3748b3b5b85527c57f23ff563bb926f96d0ac002a326a53f3459ff77d365048a'
          grep -Fq 'VPS_AUDIT_EXPECTED="V2.2.5"' installers/p07-toolbox.sh
          grep -Fq 'VPS_AUDIT_BUILD_EXPECTED="2.2.5-rc1-bounded-quick"' installers/p07-toolbox.sh
          grep -Fq 'VPS_AUDIT_SHA256="3748b3b5b85527c57f23ff563bb926f96d0ac002a326a53f3459ff77d365048a"' installers/p07-toolbox.sh
          grep -Fq 'VPS_AUDIT_URL="https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/3d05e25adca486085362782c26758014b8f04bcf/experiments/p07-vps-audit-v225-r1.sh"' installers/p07-toolbox.sh
          for id in 37739860625 37739860563 37739860568 37739860551 37739860549 37739860661 37739860573; do
            test "$(gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$id" --jq .head_sha)" = '25eae7d3bde5808dfefc240dd0dfd56ddb724c76'
            test "$(gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$id" --jq .conclusion)" = success
          done
          echo P07_MENU2_V225_EXACT_GATE=PASS
      - name: Publish formal verified menu 2 hotfix
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          repo='llhzx2018/core-free-runner-public'
          tag='p07-v0.1.0-release84-menu2-v225'
          target='76a82e839ca97203ecb016d0d312d774db745210'
          if gh release view "$tag" -R "$repo" >/dev/null 2>&1; then
            test "$(gh release view "$tag" -R "$repo" --json targetCommitish --jq .targetCommitish)" = "$target"
          else
            gh release create "$tag" -R "$repo" --target "$target" \
              --title 'P07 · 菜单 2 服务器性能检测 V2.2.5 修复' \
              --notes '修复 V2.2.4 隐藏检测进度、嵌套网络及磁盘压力测试导致长时间无响应的问题。V2.2.5 改为 CPU / 4K 同步写 / CPU 争抢三阶段快速检测；12/15/4 秒的独立超时；磁盘写入不超过 256 KiB；繁忙时安全跳过、证据不足不虚构 PASS。Public Distribution Source: 76a82e839ca97203ecb016d0d312d774db745210。既有 Source 0.1.0-release84 不变；菜单 1/3/4/5 不变。公共隔离 Machine Gates 7/7 PASS。真实 Production OWNER 验收仍待用户确认。' \
              --latest=false
          fi
          test "$(gh release view "$tag" -R "$repo" --json tagName --jq .tagName)" = "$tag"
          echo P07_MENU2_V225_FORMAL_RELEASE=PASS
