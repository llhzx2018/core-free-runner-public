name: P05 Single Product Phase 3 Exact Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p05-single-product-phase3-exact-20260902.yml'
      - 'scripts/p05_phase3_browser_journey.py'

permissions:
  contents: read

jobs:
  gate:
    if: github.event.pull_request.head.ref == 'test/p05-single-product-phase3-exact-20260902'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vf_seo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vf_seo
      VF_DATABASE_PROVIDER: postgresql
      VF_MASTER_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NODE_ENV: test
      VF_SECURE_COOKIES: 'false'
      VF_REQUIRE_HTTPS: 'false'

    steps:
      - name: Checkout disposable runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify private read capability
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"

      - name: Checkout exact P05 Phase 3 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: 675cd9cd753a8420a50a81724d048e4d77a5b3ee
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: p05

      - name: Exact source and single-product seal
        working-directory: p05
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '675cd9cd753a8420a50a81724d048e4d77a5b3ee'
          test "$(git rev-parse HEAD^{tree})" = '24cefc7f77a9d853a9c5e5c38e6557e0681c185c'
          test "$(cat VERSION)" = '1.2.3'
          for file in src/client/App.tsx src/client/ProductWorkspaceShortcut.tsx src/client/DemoDatasetShortcut.tsx src/client/GlobalSearchSurface.tsx; do
            test ! -e "$file"
          done
          grep -q '<ProductApp />' src/client/main.tsx
          ! grep -RIn -E "#/product-v2|返回经典工作区|新版工作区 Preview|Product Optimization Preview" src/client/main.tsx src/client/ProductApp.tsx
          test "$(grep -RIl '/api/system/update/apply' src/client --include='*.tsx' | wc -l | tr -d ' ')" = '1'
          grep -q '/api/system/update/apply' src/client/UpdateShortcut.tsx
          ! grep -q '/api/system/update/apply' src/client/CommonSystemCenter.tsx
          ! grep -q "tab === 'update'" src/client/CommonSystemCenter.tsx
          echo 'P05_PHASE3_EXACT_SOURCE=PASS'
          echo 'P05_PHASE3_SINGLE_RUNTIME_ROOT=PASS'
          echo 'P05_PHASE3_SINGLE_UPDATE_SURFACE=PASS'

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: p05/package-lock.json

      - name: Full engineering and security regression
        working-directory: p05
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          npm run lint
          npm run typecheck
          npm run migrate
          npm run verify:schema
          npm test
          npm run build
          npm run source:gate
          npm run scope:gate
          npm run dependency:gate
          npm audit --audit-level=high
          npm run security:gate

      - name: Exact Product contracts and Demo authority seal
        working-directory: p05
        shell: bash
        run: |
          set -Eeuo pipefail
          node --import tsx --test \
            tests/contract/single-product-shell.test.ts \
            tests/contract/common-system-human-ui.test.ts \
            tests/unit/product-simple-update-ux-truth.test.ts \
            tests/unit/demo-dataset.test.ts \
            tests/unit/product-metric-truth.test.ts
          grep -q "P05_DEMO_V1" src/client/ProductApp.tsx
          grep -q "f9722556109118edc8fe94471ebecd0679fafc10de7e2096423c8b69e8e83e06" src/client/ProductApp.tsx
          grep -q "不自动宣称因果" src/client/ProductApp.tsx
          grep -q "没有 Observation 时明确显示未知" src/client/ProductApp.tsx
          echo 'P05_PHASE3_DEMO_AUTHORITY=PASS'
          echo 'P05_PHASE3_UNKNOWN_NOT_ZERO_CONTRACT=PASS'
          echo 'P05_PHASE3_CORRELATION_NOT_CAUSATION_CONTRACT=PASS'

      - name: Real-use Chrome Product Journey with P05_DEMO_V1
        working-directory: p05
        shell: bash
        env:
          VF_DATABASE_PROVIDER: sqlite
          VF_SQLITE_PATH: /tmp/p05-phase3-browser.sqlite3
          VF_BACKUP_DIR: /tmp/p05-phase3-browser-backups
          VF_MASTER_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          VF_ADMIN_USERNAME: phase3-owner
          VF_ADMIN_PASSWORD: Phase3BrowserPass-2026!
          PORT: '18189'
          NODE_ENV: test
          VF_SECURE_COOKIES: 'false'
          VF_REQUIRE_HTTPS: 'false'
          P05_BASE_URL: http://127.0.0.1:18189
          P05_BROWSER_USERNAME: phase3-owner
          P05_BROWSER_PASSWORD: Phase3BrowserPass-2026!
        run: |
          set -Eeuo pipefail
          rm -f "$VF_SQLITE_PATH"
          rm -rf "$VF_BACKUP_DIR"
          npm run migrate
          npm run bootstrap:admin
          npm start >/tmp/p05-phase3-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          python3 ../scripts/p05_phase3_browser_journey.py
          test "$(git rev-parse HEAD)" = '675cd9cd753a8420a50a81724d048e4d77a5b3ee'
          test "$(git rev-parse HEAD^{tree})" = '24cefc7f77a9d853a9c5e5c38e6557e0681c185c'
          echo 'P05_PHASE3_REAL_USE_BROWSER=PASS'

      - name: Terminal exact seal
        working-directory: p05
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '675cd9cd753a8420a50a81724d048e4d77a5b3ee'
          test "$(git rev-parse HEAD^{tree})" = '24cefc7f77a9d853a9c5e5c38e6557e0681c185c'
          test "$(cat VERSION)" = '1.2.3'
          echo 'P05_PHASE3_EXACT_SEAL=PASS'
          echo 'P05_PHASE3_RELEASE_WRITE=0'
          echo 'P05_PHASE3_PRODUCTION_WRITE=0'
