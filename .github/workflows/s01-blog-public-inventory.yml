name: S01-C01 Blog public inventory read only
on:
  push:
    branches: [task/s01-blog-article-audit-20261019]
    paths: ['.github/workflows/s01-blog-public-inventory.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.141
  TARGET_SHA: 127d9b7d7431f3ceab167318db44f4fb4b719907
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Read public Blog articles without credentials or mutations
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json,re
          base='https://www3.m3u8.one'
          for suffix in ['/wp-content/themes/vf-tools-theme/style.css','/blog/?s01_readonly=202610191859', '/blog/','/wp-json/wp/v2/posts?per_page=100&_fields=id,slug,link,title,categories&lang=en','/wp-json/wp/v2/posts?per_page=100&_fields=id,slug,link,title,categories&lang=zh','/feed/']:
            try:
              req=urllib.request.Request(base+suffix,headers={'User-Agent':'Mozilla/5.0 S01-ReadOnly-Diagnostic'})
              with urllib.request.urlopen(req,timeout=25) as r:
                body=r.read(1000000).decode('utf-8','replace')
                if suffix.endswith('/style.css'):
                  print(json.dumps({'path':suffix,'http':r.status,'header_version':re.findall(r'^Version: (.+)$',body,re.M)},ensure_ascii=False))
                elif '/wp-json/' in suffix:
                  data=json.loads(body)
                  print(json.dumps({'path':suffix,'http':r.status,'total':r.headers.get('X-WP-Total'),'posts':data},ensure_ascii=False))
                elif suffix.startswith('/blog/'):
                  print(json.dumps({'path':suffix,'http':r.status,'theme_versions':sorted(set(re.findall(r'1[.]35[.][0-9]+',body))),'empty':'No matching content' in body},ensure_ascii=False))
                else:
                  print(json.dumps({'path':suffix,'http':r.status,'feed_titles':re.findall(r'<title>(.*?)</title>',body)[:30],'feed_links':re.findall(r'<link>(.*?)</link>',body)[:30]},ensure_ascii=False))
            except Exception as e:
              print(json.dumps({'path':suffix,'error':str(e)},ensure_ascii=False))
          PY
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 127d9b7d7431f3ceab167318db44f4fb4b719907
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
      - name: Locate owning route registry without emitting private source
        run: |
          grep -rlE 'function vf_theme_official_(guide|problem)_detail_routes' target/src
      - name: Remove private temporary checkout
        if: always()
        run: rm -rf target
