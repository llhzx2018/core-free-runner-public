name: P01 V2.47.268 Core Updates Exact Proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p01-v247268-core-updates-exact.yml"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout proof control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli jq >/dev/null

      - name: Clone exact core-updates candidate
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/core-updates.git" candidate
          git -C candidate fetch -q origin 31dca79fc8400e341570c5ab6906bd3e8e746819
          git -C candidate checkout -q --detach 31dca79fc8400e341570c5ab6906bd3e8e746819
          test "$(git -C candidate rev-parse HEAD)" = "31dca79fc8400e341570c5ab6906bd3e8e746819"
          echo CORE_UPDATES_EXACT_SOURCE=PASS

      - name: Run canonical core-updates CI commands
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          echo CORE_UPDATES_CANONICAL_CI_EQUIVALENT=PASS

      - name: Verify P01 manifest exact release identity
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -e '
            .project_id=="P01" and
            .current_version=="2.47.267" and
            .target_version=="2.47.268" and
            .update_type=="ATOMIC" and
            .from_versions==["2.47.267"] and
            .schema_from=="2026090401" and
            .schema_to=="2026090401" and
            .repository=="llhzx2018/vf-start" and
            .release_tag=="v2.47.268" and
            .release_id==404527295 and
            .product_identity=="d5734fb44e38dd14809de50660fdee88c9dc39dc" and
            .asset_name=="VF_Start_V2.47.268_UPDATE.zip" and
            .asset_bytes==2348224 and
            .asset_sha256=="f8ed8f6edd7330a87bdc32e9870595e8e01feb3517a0506bd8666a610adfe1e1" and
            .backup_required==true and
            .rollback_supported==true and
            .minimum_php=="8.0.0"
          ' candidate/projects/P01.json >/dev/null
          echo P01_V247268_MANIFEST_IDENTITY=PASS
          echo PRODUCTION_WRITE=NO
