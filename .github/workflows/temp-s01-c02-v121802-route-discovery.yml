name: TEMP S01-C02 Ops 1.21.802 Route Discovery

on:
  push:
    branches:
      - temp/s01-c02-v121802-production-readback-20260904
    paths:
      - '.github/workflows/temp-s01-c02-v121802-route-discovery.yml'

permissions:
  contents: read

jobs:
  routes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enumerate VF public route contracts only
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 3 'https://www3.m3u8.one/wp-json/' -o /tmp/index.json
          jq -r '.routes | to_entries[] | select(.key|contains("vf-ops")) | [.key, ([.value.endpoints[]?.methods[]?] | unique | join(","))] | @tsv' /tmp/index.json | sort | tee /tmp/vf-routes.tsv
          test -s /tmp/vf-routes.tsv
          echo ROUTE_DISCOVERY=PASS
