name: TEMP P01 V2.21.19 Regression Observer Main
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-p01-v2.21.19-regression-observer-main.yml']
permissions:
  contents: write
  actions: read
jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api repos/llhzx2018/core-free-runner-public/actions/workflows/temp-p01-v2.21.19-reference-ui-regression.yml/runs -f per_page=5 >/tmp/runs.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/runs.json'));runs=[{k:r.get(k) for k in ['id','status','conclusion','run_attempt','head_sha','created_at','updated_at']} for r in x.get('workflow_runs',[])[:5]]
          open('/tmp/out.json','w').write(json.dumps({'schema':'vf-public-runner-observation/v1','project_id':'P01','target_version':'2.21.19','gate':'REFERENCE_UI_REGRESSION_OBSERVER_MAIN','runs':runs},indent=2)+'\n')
          PY
          git clone -q --depth 1 --branch vf-agent-operations-v1 https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/core-free-runner-public.git out
          mkdir -p out/vf-agent/results;cp /tmp/out.json out/vf-agent/results/P01-V2.21.19-REGRESSION-OBSERVER-MAIN.json
          git -C out config user.name VictorForge;git -C out config user.email llhzx2018@gmail.com;git -C out add vf-agent/results/P01-V2.21.19-REGRESSION-OBSERVER-MAIN.json;git -C out commit -q -m 'evidence(P01): observe V2.21.19 regression';git -C out push -q origin HEAD:vf-agent-operations-v1
