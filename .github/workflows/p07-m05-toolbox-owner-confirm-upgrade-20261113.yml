name: P07-M05 新服务器初始化 · 公共工具箱确认升级与独立模块保护
on:
  push:
    branches: [feat/p07-m05-existing-safe-release-20261113]
    paths: [.github/workflows/p07-m05-toolbox-owner-confirm-upgrade-20261113.yml]
permissions:
  contents: read
jobs:
  manual-upgrade-from-official-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout toolbox distribution candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Assert other modules unchanged and shell syntax correct
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n installers/p07-toolbox.sh
          git diff --exit-code c159f1361f15a0613228c4a4cb703cba9ffbfd70 HEAD -- \
            installers/p07.sh installers/p07-final.sh installers/p07-m05-atomic.py \
            installers/p07-system-care.sh installers/vf-node.sh experiments/ lib/
          grep -Fq 'M05_BUILD_EXPECTED="0.1.0-m05-existing-safe1"' installers/p07-toolbox.sh
          grep -Fq 'M05_UPGRADE_FROM="0.1.0-m05-candidate2"' installers/p07-toolbox.sh
          echo P07_M05_TOOLBOX_OTHER_MODULE_SOURCE_UNCHANGED=PASS
      - name: Seed previous official M05 release in temporary test host
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 2 --max-time 90 \
            'https://github.com/llhzx2018/core-free-runner-public/releases/download/p07-v0.1.0-five-modules-20261113/P07-M05-0.1.0-m05-candidate2.zip' \
            -o "$RUNNER_TEMP/m05-old.zip"
          echo "835356e2af2f89877e79d904f47b1ad38602983aa760978657ac4bb3c7593adb  $RUNNER_TEMP/m05-old.zip" | sha256sum -c --status
          sudo python3 -B installers/p07-m05-atomic.py install "$RUNNER_TEMP/m05-old.zip" \
            835356e2af2f89877e79d904f47b1ad38602983aa760978657ac4bb3c7593adb
          test "$(readlink /opt/vfops-modules/m05/current)" = releases/0.1.0-m05-candidate2
          test ! -e /home/clp
      - name: Exercise actual M05 Toolbox upgrade guard in a synthetic PTY
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os,pty,select,signal,sys,tempfile,time
          from pathlib import Path
          source=Path('installers/p07-toolbox.sh').read_text()
          marker='\ncase "${1:-}" in'
          assert source.count(marker)==1
          segment=source[source.index('run_server_init() {'):source.index('\n}',source.index('run_server_init() {'))]
          assert 'ensure_m05_current' in segment
          with tempfile.TemporaryDirectory(prefix='p07-m05-pty-') as tmp:
            text=source.split(marker)[0]
            script=Path(tmp)/'ensure.sh'
            script.write_text(text+'\nensure_m05_current\n')
            bad=Path(tmp)/'bad-sha.sh'
            bad.write_text(text+'\nM05_BUNDLE_SHA256='+'0'*64+'\nensure_m05_current\n')
            prompt='确认仅升级 P07-M05 新服务器初始化？[y/N]：'.encode()
            def test(answer=None,corrupt=False):
              pid,root=pty.fork()
              if pid==0:
                os.execvp('sudo',['sudo','bash',str(bad if corrupt else script)])
              output=b'';responded=False;deadline=time.monotonic()+90
              while time.monotonic()<deadline:
                r,_,_=select.select([root],[],[],0.2)
                if r:
                  try: chunk=os.read(root,8192)
                  except OSError:
                    gone,status=os.waitpid(pid,0)
                    os.close(root)
                    return os.waitstatus_to_exitcode(status),output.decode(errors='replace'),responded
                  if not chunk:
                    gone,status=os.waitpid(pid,0)
                    os.close(root)
                    return os.waitstatus_to_exitcode(status),output.decode(errors='replace'),responded
                  output+=chunk
                  if answer is not None and not responded and prompt in output:
                    os.write(root,(answer+'\n').encode())
                    responded=True
                gone,code=os.waitpid(pid,os.WNOHANG)
                if gone:
                  os.close(root)
                  return os.waitstatus_to_exitcode(code),output.decode(errors='replace'),responded
              try: os.kill(pid,signal.SIGKILL)
              except ProcessLookupError: pass
              os.waitpid(pid,0)
              os.close(root)
              raise RuntimeError('PTY timeout: '+output[-750:].decode(errors='replace'))
            current=lambda:os.readlink('/opt/vfops-modules/m05/current')
            result,output,prompted=test('n')
            assert result!=0 and prompted and current()=='releases/0.1.0-m05-candidate2',(result,output[-1200:])
            assert '未确认 M05 升级' in output
            print('P07_M05_OWNER_DECLINES_UPGRADE=PASS')
            result,output,prompted=test('y',corrupt=True)
            assert result!=0 and prompted and current()=='releases/0.1.0-m05-candidate2',(result,output[-1200:])
            print('P07_M05_MISMATCH_PIN_KEEPS_OLD_RELEASE=PASS')
            result,output,prompted=test('y')
            assert result==0 and prompted and current()=='releases/0.1.0-m05-existing-safe1',(result,output[-1400:])
            print('P07_M05_OWNER_APPROVED_OLD_TO_NEW=PASS')
            result,output,prompted=test()
            assert result==0 and not prompted and current()=='releases/0.1.0-m05-existing-safe1',(result,output[-1200:])
            print('P07_M05_REPEAT_CURRENT_VERSION_NOOP=PASS')
            assert Path('/opt/vfops-modules/m05/releases/0.1.0-m05-candidate2').is_dir()
            assert not Path('/home/clp').exists()
            for m in ['m01','m02','m03','m04']:
              assert not Path('/opt/vfops-modules',m).exists(),m
            print('P07_M05_OTHER_MODULES_NOT_INSTALLED_OR_CHANGED=YES')
            print('P07_M05_CLOUDPANEL_NOT_INSTALLED=YES')
          PY
      - name: Public Release bytes and final installed version readback
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 2 --max-time 90 \
            'https://github.com/llhzx2018/core-free-runner-public/releases/download/p07-m05-v0.1.0-existing-safe1-20261113/P07-M05-0.1.0-m05-existing-safe1.zip' \
            -o "$RUNNER_TEMP/m05-new.zip"
          echo "ff67f7563baf197892b698fe978eab6deafd6c8d432c5c7c20eaf18d4fcb48ad  $RUNNER_TEMP/m05-new.zip" | sha256sum -c --status
          test "$(bash /opt/vfops-modules/m05/current/bin/vfops-init-entry --version)" = \
            "P07-M05 新服务器初始化 0.1.0-m05-existing-safe1"
          test ! -e /home/clp
          echo P07_M05_PUBLIC_FORMAL_BUNDLE_INSTALLED=PASS
          echo P07_OWNER_VPS=NOT_TOUCHED
