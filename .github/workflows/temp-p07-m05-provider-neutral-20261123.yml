name: TEMP P07 M05 exact-source UX13 real package verification
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p07-m05-provider-neutral-20261123.yml'
      - 'harness/p07-m05-provider-neutral-20261123/**'
permissions:
  contents: read
jobs:
  init-guard:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'test/p07-m05-provider-neutral-proof-20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      TARGET_VERSION: '0.1.0'
      TARGET_REPO: 'llhzx2018/vf-server-ops'
      TARGET_SHA: '74cc793557943b910d57e384d30cc55dcf6773ca'
      TARGET_TREE: 'ed1e70436702de66fc632d26824864f9b9d530f1'
      NO_COLOR: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Audit exact source binding
        run: python3 -B scripts/ephemeral_lane_spec.py audit-rendered --spec harness/p07-m05-provider-neutral-20261123/lane.json --input .github/workflows/temp-p07-m05-provider-neutral-20261123.yml
      - name: Transient private exact-source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: ${{ env.TARGET_SHA }}
          path: private-src
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C private-src rev-parse HEAD)" == "$TARGET_SHA" ]]
          [[ "$(git -C private-src rev-parse HEAD^{tree})" == "$TARGET_TREE" ]]
          echo 'P07_M05_EXACT_SOURCE_BINDING=PASS'
      - name: Build exact-source UX13 package and prove official UX12 upgrade with real bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          cd private-src
          python3 -B -m unittest -q tests.test_p07_m05_isolated_module
          mkdir -p "$RUNNER_TEMP/p07-m05-package-proof"
          python3 -B scripts/build_p07_m05_bundle.py --output "$RUNNER_TEMP/p07-m05-package-proof/ux13.zip"
          python3 -B scripts/build_p07_m05_bundle.py --output "$RUNNER_TEMP/p07-m05-package-proof/ux13-repeat.zip"
          sha256sum "$RUNNER_TEMP/p07-m05-package-proof/ux13.zip" | cut -d ' ' -f1 > "$RUNNER_TEMP/p07-m05-package-proof/ux13.sha"
          cmp "$RUNNER_TEMP/p07-m05-package-proof/ux13.zip" "$RUNNER_TEMP/p07-m05-package-proof/ux13-repeat.zip"
          echo "P07_M05_PACKAGE_BIT_REPRODUCIBLE=PASS"
          curl --fail --location --silent --show-error --max-time 95 --retry 2 \
            'https://github.com/llhzx2018/core-free-runner-public/releases/download/p07-m05-v0.1.0-ux12-apt-failstop-20261122/P07-M05-0.1.0-m05-ux12-apt-failstop.zip' \
            --output "$RUNNER_TEMP/p07-m05-package-proof/ux12-official.zip"
          echo '424ff9b90d9ce1c5d2b8de9773fb3350d959d8a5f030580e568918a7bc66d279  '"$RUNNER_TEMP/p07-m05-package-proof/ux12-official.zip" | sha256sum -c -
          echo "P07_M05_GENUINE_UX12_SOURCE=PASS"
          python3 -B - "$RUNNER_TEMP/p07-m05-package-proof/ux12-official.zip" "$RUNNER_TEMP/p07-m05-package-proof/ux13.zip" "$RUNNER_TEMP/p07-m05-package-proof" <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import sys
          import zipfile
          sys.path.insert(0,"scripts")
          import install_p07_m05_bundle as install
          from build_p07_m05_bundle import BUILD_ID
          original, candidate, tmp=map(pathlib.Path,sys.argv[1:])
          old_id="0.1.0-m05-ux12-apt-failstop"
          new_id="0.1.0-m05-ux13-provider-neutral"
          assert BUILD_ID==new_id
          digest=lambda path:hashlib.sha256(path.read_bytes()).hexdigest()
          old_sha=digest(original)
          new_sha=digest(candidate)
          old_build,old_files=install.verified_payload(original,old_sha)
          new_build,new_files=install.verified_payload(candidate,new_sha)
          assert old_build==old_id and new_build==new_id
          assert all(k.startswith(("bin/","lib/")) or k in ("VERSION","BUILD_ID","MODULE_ID","MODULE_BUILD_ID","MODULE_MANIFEST.json") for k in new_files)
          assert not any(k=="bin/vfops" for k in new_files)
          manifest=json.loads(new_files["MODULE_MANIFEST.json"])
          assert manifest["module_build_id"]==new_id
          assert manifest["installation_isolation"]=="P07-M05_ONLY"
          test_root=tmp/"installed"
          before={}
          for module in ("m01","m02","m03","m04"):
              p=test_root/module
              p.mkdir(parents=True,exist_ok=True)
              marker=p/"sentinel"
              marker.write_text("immutable-"+module)
              before[module]=marker.read_bytes()
          os.environ["P07_M05_DISPOSABLE_TEST"]="1"
          first=install.install(original,old_sha,test_root,test_mode=True)
          assert first["installed_build"]==old_id
          second=install.install(candidate,new_sha,test_root,test_mode=True)
          assert second["installed_build"]==new_id
          current=test_root/"m05/current"
          assert os.readlink(current)=="releases/"+new_id
          assert (test_root/"m05/releases"/old_id).is_dir()
          again=install.install(candidate,new_sha,test_root,test_mode=True)
          assert again["already_current"] is True
          try:
              install.install(candidate,"0"*64,test_root,test_mode=True)
          except install.IsolatedInstallError:
              pass
          else:
              raise AssertionError("wrong SHA not rejected")
          assert os.readlink(current)=="releases/"+new_id
          tampered=tmp/"tampered.zip"
          with zipfile.ZipFile(candidate) as zsrc, zipfile.ZipFile(tampered,"w") as zdst:
              for info in zsrc.infolist():
                  data=zsrc.read(info)
                  if info.filename=="p07-m05/MODULE_BUILD_ID":
                      data=b"0.1.0-m05-forged-entry\\n"
                  zdst.writestr(info,data)
          try:
              install.install(tampered,digest(tampered),test_root,test_mode=True)
          except install.IsolatedInstallError:
              pass
          else:
              raise AssertionError("internal manifest tamper not rejected")
          assert os.readlink(current)=="releases/"+new_id
          restored=install.rollback(old_id,test_root,test_mode=True)
          assert restored["restored_build"]==old_id
          assert os.readlink(current)=="releases/"+old_id
          for module,contents in before.items():
              assert (test_root/module/"sentinel").read_bytes()==contents
          print("P07_M05_OFFICIAL_UX12_TO_EXACT_UX13_UPGRADE=PASS")
          print("P07_M05_BAD_HASH_AND_BAD_MANIFEST_REJECT=PASS")
          print("P07_M05_IMMUTABLE_ROLLBACK=PASS")
          print("P07_M05_OTHER_FOUR_MODULES_UNCHANGED=PASS")
          print("P07_M05_UX13_SHA256="+new_sha)
          print("P07_M05_PACKAGE_FORMAL_RELEASE=NOT_RUN")
          PY
      - name: Remove transient private source and candidate
        if: always()
        shell: bash
        run: |
          rm -rf -- private-src
          rm -rf -- "$RUNNER_TEMP/p07-m05-package-proof"
          echo "TARGETED_PACKAGE_DIAGNOSTIC_CLEANUP=COMPLETE"
          echo 'EPHEMERAL_PRIVATE_CLEANUP=COMPLETE'
