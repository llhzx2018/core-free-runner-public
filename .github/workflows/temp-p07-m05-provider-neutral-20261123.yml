name: TEMP P07 M05 native architecture PR base context proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p07-m05-provider-neutral-20261123.yml'
      - 'harness/p07-m05-provider-neutral-20261123/**'
permissions:
  contents: read
jobs:
  init-guard:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'test/p07-m05-provider-neutral-proof-20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      TARGET_VERSION: '0.1.0'
      TARGET_REPO: 'llhzx2018/vf-server-ops'
      TARGET_SHA: '262b6f5cf35dd008b8c284b8d61a35832e9d8a53'
      TARGET_TREE: 'd1a405ce935cc5640fe1af56335e6e4e77fadcb9'
      NO_COLOR: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Audit exact source binding
        run: python3 -B scripts/ephemeral_lane_spec.py audit-rendered --spec harness/p07-m05-provider-neutral-20261123/lane.json --input .github/workflows/temp-p07-m05-provider-neutral-20261123.yml
      - name: Transient private exact-source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: ${{ env.TARGET_SHA }}
          path: private-src
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C private-src rev-parse HEAD)" == "$TARGET_SHA" ]]
          [[ "$(git -C private-src rev-parse HEAD^{tree})" == "$TARGET_TREE" ]]
          echo 'P07_M05_EXACT_SOURCE_BINDING=PASS'
      - name: Execute real GOV-DOC checkout and PR architecture gate with no ambient GITHUB_BASE_REF
        shell: bash
        env:
          GOV_DOC_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          ARCH_EVENT_NAME: pull_request
          ARCH_PR_BASE_REF: main
        run: |
          set -Eeuo pipefail
          [[ "$(git -C private-src rev-parse HEAD)" == "$TARGET_SHA" ]]
          [[ "$(git -C private-src rev-parse HEAD^{tree})" == "$TARGET_TREE" ]]
          mkdir -p "$RUNNER_TEMP/p07-m05-ci-proof"
          python3 -B - "$RUNNER_TEMP/p07-m05-ci-proof" <<'PY'
          import pathlib
          import sys
          path=pathlib.Path("private-src/.github/workflows/ci.yml")
          source=path.read_text()
          assert "ARCH_PR_BASE_REF: ${{ github.base_ref }}" in source
          assert "ARCH_EVENT_NAME: ${{ github.event_name }}" in source
          assert 'if [[ -n "$GITHUB_BASE_REF" ]]' not in source
          lines=source.splitlines()
          for name,slug in (
              ("Checkout canonical GOV-DOC (read-only; trusted refs only)","checkout"),
              ("Verify current shared domains against P07 project scope","arch"),
          ):
              starts=[i for i,line in enumerate(lines) if line.startswith("      - name: "+name)]
              assert len(starts)==1,(name,starts)
              start=starts[0]
              tail=next((i for i in range(start+1,len(lines)) if lines[i].startswith("      - name: ")),len(lines))
              run=next(i for i in range(start+1,tail) if lines[i].strip()=="run: |")
              body=lines[run+1:tail]
              assert body and all(not x.strip() or x.startswith("          ") for x in body)
              command="\n".join(x[10:] if x.startswith("          ") else "" for x in body)+"\n"
              out=pathlib.Path(sys.argv[1])/(slug+".sh")
              out.write_text(command)
              print("P07_M05_ORIGINAL_CI_STEP_EXTRACTED="+slug)
          PY
          bash -n "$RUNNER_TEMP/p07-m05-ci-proof/checkout.sh" "$RUNNER_TEMP/p07-m05-ci-proof/arch.sh"
          cd private-src
          # Runtime secret remains private to this job, with no shell tracing.
          env -u GITHUB_BASE_REF bash "$RUNNER_TEMP/p07-m05-ci-proof/checkout.sh"
          env -u GITHUB_BASE_REF ARCH_EVENT_NAME=pull_request ARCH_PR_BASE_REF=main \
            bash "$RUNNER_TEMP/p07-m05-ci-proof/arch.sh"
          echo 'P07_M05_EXACT_NATIVE_ARCH_PR_BASE_EXPLICIT_CONTEXT=PASS'
          echo 'P07_M05_AMBIENT_GITHUB_BASE_REF=NOT_REQUIRED'
          echo 'P07_M05_BUILDKITE_NATIVE_REQUIRED_CHECK=NOT_INFERRED'
      - name: Remove transient private source and candidate
        if: always()
        shell: bash
        run: |
          rm -rf -- private-src
          rm -rf -- "$RUNNER_TEMP/p07-m05-ci-proof"
          echo "TARGETED_CI_PR_BASE_PROOF_CLEANUP=COMPLETE"
          echo 'EPHEMERAL_PRIVATE_CLEANUP=COMPLETE'
