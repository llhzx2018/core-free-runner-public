name: TEMP P07 M05 actual UX13 ZIP delivery structural gate
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p07-m05-provider-neutral-20261123.yml'
      - 'harness/p07-m05-provider-neutral-20261123/**'
permissions:
  contents: read
jobs:
  init-guard:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'test/p07-m05-provider-neutral-proof-20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      TARGET_VERSION: '0.1.0'
      TARGET_REPO: 'llhzx2018/vf-server-ops'
      TARGET_SHA: '74cc793557943b910d57e384d30cc55dcf6773ca'
      TARGET_TREE: 'ed1e70436702de66fc632d26824864f9b9d530f1'
      NO_COLOR: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Audit exact source binding
        run: python3 -B scripts/ephemeral_lane_spec.py audit-rendered --spec harness/p07-m05-provider-neutral-20261123/lane.json --input .github/workflows/temp-p07-m05-provider-neutral-20261123.yml
      - name: Transient private exact-source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: ${{ env.TARGET_SHA }}
          path: private-src
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C private-src rev-parse HEAD)" == "$TARGET_SHA" ]]
          [[ "$(git -C private-src rev-parse HEAD^{tree})" == "$TARGET_TREE" ]]
          echo 'P07_M05_EXACT_SOURCE_BINDING=PASS'
      - name: Transient exact GOV-DOC Public Authority checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          path: gov-src
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Exact UX13 module ZIP delivery structural contract gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C private-src rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C private-src rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test -f gov-src/governance/public-authority/tools/task_delivery_contract_lint.py
          test -f gov-src/governance/public-authority/VF_PUBLIC_AUTHORITY_APPLICABILITY_ROUTER_V1.0.json
          work="$RUNNER_TEMP/p07-m05-delivery-proof"
          mkdir -p "$work"
          python3 -B private-src/scripts/build_p07_m05_bundle.py --output "$work/ux13.zip"
          echo "3b6754eb31127ae67dd9eecd9c8c96d6e843c278a8dd1114c41693ad8cfcfb1f  $work/ux13.zip" | sha256sum -c -
          python3 -B - "$work" "$TARGET_SHA" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys
          work=Path(sys.argv[1])
          source=sys.argv[2]
          package=work/"ux13.zip"
          receipt={
            "schema":"vf.public-authority.task-delivery-check.v1",
            "project":"P07",
            "source":source,
            "project_authority":{
              "agents":"AGENTS.md",
              "current":"docs/authority/CURRENT.md",
              "acceptance":"docs/authority/ACCEPTANCE_MATRIX.md",
              "applicability":"docs/authority/PUBLIC_AUTHORITY_APPLICABILITY.md"
            },
            "acceptance_markers":[
              "P07-PUBLIC-03 精确制品",
              "M05 脏主机识别开发验收"
            ],
            "delivery":{
              "profile":"web_atomic_zip",
              "artifact":"p07-m05-delivery-proof/ux13.zip",
              "sha256":hashlib.sha256(package.read_bytes()).hexdigest(),
              "entrypoint":"p07-m05/bin/vfops-init-entry",
              "requires_git":False,
              "requires_manual_source_copy":False
            },
            "required_domains":[
              "INSTALL","UPGRADE","SECURITY","TESTING","DATA_SCHEMA","GIT","UA_UI"
            ],
            "task_capabilities":[
              "installer","atomic","rollback","candidate",
              "release","database","ui_change","source_change"
            ]
          }
          (work/"receipt.json").write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+"\n")
          print("P07_M05_DELIVERY_RECEIPT_SOURCE="+source)
          PY
          python3 -B gov-src/governance/public-authority/tools/task_delivery_contract_lint.py \
            --phase delivery \
            --receipt "$work/receipt.json" \
            --project-root private-src \
            --artifact-root "$RUNNER_TEMP" \
            --public-router gov-src/governance/public-authority/VF_PUBLIC_AUTHORITY_APPLICABILITY_ROUTER_V1.0.json
          echo 'P07_M05_ACTUAL_ZIP_DELIVERY_STRUCTURE=PASS'
          echo 'P07_M05_FORMAL_RELEASE=NOT_RUN'
      - name: Remove transient private source and candidate
        if: always()
        shell: bash
        run: |
          rm -rf -- private-src gov-src
          rm -rf -- "$RUNNER_TEMP/p07-m05-delivery-proof"
          echo "TARGETED_DELIVERY_PROOF_CLEANUP=COMPLETE"
          echo 'EPHEMERAL_PRIVATE_CLEANUP=COMPLETE'
