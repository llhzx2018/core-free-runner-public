name: TEMP P07 M05 provider-neutral exact-source test
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p07-m05-provider-neutral-20261123.yml'
      - 'harness/p07-m05-provider-neutral-20261123/**'
permissions:
  contents: read
jobs:
  init-guard:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'test/p07-m05-provider-neutral-proof-20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_VERSION: '0.1.0'
      TARGET_REPO: 'llhzx2018/vf-server-ops'
      TARGET_SHA: '82e5598bb39888081c12b0819d4da8ce58f4ec54'
      TARGET_TREE: '787520c4d6e14c1ebc5aad970d7c70017231aef7'
      NO_COLOR: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Audit exact source binding
        run: python3 -B scripts/ephemeral_lane_spec.py audit-rendered --spec harness/p07-m05-provider-neutral-20261123/lane.json --input .github/workflows/temp-p07-m05-provider-neutral-20261123.yml
      - name: Transient private exact-source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: ${{ env.TARGET_SHA }}
          path: private-src
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C private-src rev-parse HEAD)" == "$TARGET_SHA" ]]
          [[ "$(git -C private-src rev-parse HEAD^{tree})" == "$TARGET_TREE" ]]
          echo 'P07_M05_EXACT_SOURCE_BINDING=PASS'
      - name: Genuine official UX12 to isolated UX13 Atomic and rollback
        shell: bash
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/p07-m05-official-ux12.zip"
          candidate="$RUNNER_TEMP/p07-m05-dev-ux13.zip"
          curl -fL --retry 2 --connect-timeout 15 --max-time 120 \
            'https://github.com/llhzx2018/core-free-runner-public/releases/download/p07-m05-v0.1.0-ux12-apt-failstop-20261122/P07-M05-0.1.0-m05-ux12-apt-failstop.zip' -o "$base"
          printf '%s  %s\n' '424ff9b90d9ce1c5d2b8de9773fb3350d959d8a5f030580e568918a7bc66d279' "$base" | sha256sum -c -
          python3 -B harness/p07-m05-provider-neutral-20261123/build_from_official_ux12.py \
            "$base" private-src "$candidate" installers/p07-m05-atomic.py
          sudo python3 -B harness/p07-m05-provider-neutral-20261123/verify_atomic_ux12.py \
            installers/p07-m05-atomic.py "$base" "$candidate" private-src/tests/test_p07_m05_dirty_host_guard.py
      - name: Remove transient private source and candidate
        if: always()
        shell: bash
        run: |
          rm -rf -- private-src
          rm -f -- "$RUNNER_TEMP/p07-m05-official-ux12.zip" "$RUNNER_TEMP/p07-m05-dev-ux13.zip"
          echo 'EPHEMERAL_PRIVATE_CLEANUP=COMPLETE'
