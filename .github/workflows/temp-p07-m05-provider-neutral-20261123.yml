name: TEMP P07 M05 MariaDB exact-source diagnostic
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p07-m05-provider-neutral-20261123.yml'
      - 'harness/p07-m05-provider-neutral-20261123/**'
permissions:
  contents: read
jobs:
  init-guard:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'test/p07-m05-provider-neutral-proof-20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      TARGET_VERSION: '0.1.0'
      TARGET_REPO: 'llhzx2018/vf-server-ops'
      TARGET_SHA: '62411277688755269418c79cec51d5a5b3bf01fe'
      TARGET_TREE: 'de86cc3f3eeadd556de2193464595b838f54bd26'
      NO_COLOR: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Audit exact source binding
        run: python3 -B scripts/ephemeral_lane_spec.py audit-rendered --spec harness/p07-m05-provider-neutral-20261123/lane.json --input .github/workflows/temp-p07-m05-provider-neutral-20261123.yml
      - name: Transient private exact-source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: ${{ env.TARGET_SHA }}
          path: private-src
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C private-src rev-parse HEAD)" == "$TARGET_SHA" ]]
          [[ "$(git -C private-src rev-parse HEAD^{tree})" == "$TARGET_TREE" ]]
          echo 'P07_M05_EXACT_SOURCE_BINDING=PASS'
      - name: Exact MariaDB policy and server migration tests; diagnostics only
        shell: bash
        run: |
          set -euo pipefail
          cd private-src
          bash -n bin/vfops-init-ui
          python3 -B -m unittest -v tests.test_mariadb_owner_policy
          python3 -B -m unittest -v tests.test_server_migration
          grep -Fq 'CLOUDPANEL_BOOTSTRAP_DB_ENGINE = "MARIADB_10.11"' lib/server_migration.py
          ! grep -Fq 'CLOUDPANEL_BOOTSTRAP_DB_ENGINE = "MYSQL_8.4"' lib/server_migration.py
          echo 'M05_MARIADB_EXACT_NATIVE_COMMAND_REPRO=PASS'
      - name: Remove transient private source and candidate
        if: always()
        shell: bash
        run: |
          rm -rf -- private-src
          echo "TARGETED_MARIADB_DIAGNOSTIC_CLEANUP=COMPLETE"
          echo 'EPHEMERAL_PRIVATE_CLEANUP=COMPLETE'
