name: TEMP P07 M05 provider-neutral exact-source test
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p07-m05-provider-neutral-20261123.yml'
      - 'harness/p07-m05-provider-neutral-20261123/**'
permissions:
  contents: read
jobs:
  init-guard:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'test/p07-m05-provider-neutral-proof-20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_VERSION: '0.1.0'
      TARGET_REPO: 'llhzx2018/vf-server-ops'
      TARGET_SHA: '82e5598bb39888081c12b0819d4da8ce58f4ec54'
      TARGET_TREE: '787520c4d6e14c1ebc5aad970d7c70017231aef7'
      NO_COLOR: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Audit exact source binding
        run: python3 -B scripts/ephemeral_lane_spec.py audit-rendered --spec harness/p07-m05-provider-neutral-20261123/lane.json --input .github/workflows/temp-p07-m05-provider-neutral-20261123.yml
      - name: Transient private exact-source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: ${{ env.TARGET_SHA }}
          path: private-src
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C private-src rev-parse HEAD)" == "$TARGET_SHA" ]]
          [[ "$(git -C private-src rev-parse HEAD^{tree})" == "$TARGET_TREE" ]]
          echo 'P07_M05_EXACT_SOURCE_BINDING=PASS'
      - name: M05 full affected guards and independent install rollback
        shell: bash
        run: |
          set -euo pipefail
          cd private-src
          python3 -B -m unittest -q tests.test_p07_m05_dirty_host_guard tests.test_p07_m05_host_write_gate tests.test_p07_m05_isolated_module tests.test_p07_m05_vultr_terminal_ux tests.test_p07_m05_first_install_order
          echo 'M05_GENERIC_GUARDS_AND_INSTALL_ROLLBACK=PASS'
      - name: M05 module boundaries, UX evidence and real isolated candidate bundle
        shell: bash
        run: |
          set -euo pipefail
          cd private-src
          python3 -B scripts/check_p07_modules.py
          python3 -B scripts/check_p07_terminal_ux.py --module P07-M05 --changed-file bin/vfops-init-ui --changed-file lib/m05_environment_guard.py --evidence-file docs/ux-reviews/p07-m05-provider-neutral-clean-host-20261123.json
          python3 -B scripts/build_p07_m05_bundle.py --output "$RUNNER_TEMP/p07-m05-generic-init-dev.zip"
          python3 -B scripts/install_p07_m05_bundle.py --help >/dev/null
          echo 'M05_EXACT_PACKAGE_BUILD_AND_ISOLATION=PASS'
      - name: Remove transient private source and candidate
        if: always()
        shell: bash
        run: |
          rm -rf -- private-src
          rm -f -- "$RUNNER_TEMP/p07-m05-generic-init-dev.zip"
          echo 'EPHEMERAL_PRIVATE_CLEANUP=COMPLETE'
