name: P01 Final Five Domain Visual Sweep
on:
  push:
    branches: [task/p01-final-visual-sweep-20260831]
    paths: [.github/workflows/p01-final-visual-sweep-20260831.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE: cc2ee6e819e911021e7fb6e18b1f33e8a00443e0
      TREE: fd722846bd280459466ab1650afc5f4958f6e934
      ROOT: /tmp/p01-final-visual
      EVID: /tmp/p01-final-visual-evid
      PORT: '18391'
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Exact source
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$SOURCE"
          test "$(git -C product rev-parse HEAD^{tree})" = "$TREE"
          test "$(cat product/VERSION)" = '2.34.0'
          echo P01_FINAL_VISUAL_SOURCE=PASS
      - name: Fresh runtime fixture
        run: |
          set -Eeuo pipefail
          rm -rf "$ROOT" "$EVID"
          cp -a product/src "$ROOT"
          php -S 127.0.0.1:$PORT -t "$ROOT" >/tmp/p01-final-visual-server.log 2>&1 & echo $! >/tmp/p01-final-visual.pid
          sleep 1
          curl -fsS -c /tmp/p01-final-visual.cookies -b /tmp/p01-final-visual.cookies "http://127.0.0.1:$PORT/setup.php" -o /tmp/p01-final-visual-setup.html
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-final-visual-setup.html',encoding='utf-8').read()
          print(re.search(r'name="setup_csrf"\s+value="([^"]+)"',s).group(1))
          PY
          )
          curl -fsS -c /tmp/p01-final-visual.cookies -b /tmp/p01-final-visual.cookies -X POST "http://127.0.0.1:$PORT/setup.php" --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=Final Visual Sweep' --data-urlencode 'admin_password=FinalVisual2026' --data-urlencode 'admin_password_confirm=FinalVisual2026' -o /tmp/p01-final-visual-post.html
          cat >/tmp/p01-final-visual-seed.php <<'PHP'
          <?php
          require '/tmp/p01-final-visual/app/bootstrap.php';
          require_once '/tmp/p01-final-visual/app/SurfaceRepository.php';
          $r=new VfRepository(vf_db());$s=new VfSurfaceRepository(vf_db());
          $ca=$r->createCategory(['name'=>'开发工具','description'=>'','is_private'=>false]);
          $cb=$r->createCategory(['name'=>'常用服务','description'=>'','is_private'=>false]);
          for($i=1;$i<=8;$i++)$r->saveLink(null,['category_id'=>$i%2?$ca:$cb,'title'=>'导航资源 '.$i,'url'=>'https://example.com/start-final-'.$i,'description'=>'日常使用的导航资源','tags'=>'工具,验证','is_private'=>$i===8,'is_favorite'=>$i<=2],'manual');
          foreach(['技术频道','商业频道','效率频道','设计频道','叙事频道','研究频道'] as $i=>$title){$x=$r->saveLink(null,['category_id'=>$ca,'title'=>$title,'url'=>'https://example.com/channel-final-'.$i,'description'=>'长期订阅频道','tags'=>'频道','is_private'=>$i===5,'is_favorite'=>$i===0],'manual');$s->upsertProfile((int)$x['id'],['surface'=>'channels','resource_kind'=>$i<3?'技术':'知识','surface_note'=>'适合持续关注','background_friendly'=>$i%2===0]);}
          foreach(['山海剧集','城市电影','历史纪录片','科幻剧集','喜剧电影','人物纪录片'] as $i=>$title){$x=$r->saveLink(null,['category_id'=>$cb,'title'=>$title,'url'=>'https://example.com/watch-final-'.$i,'description'=>'影视条目','tags'=>'影视','is_private'=>$i===5,'is_favorite'=>$i===1],'manual');$s->upsertProfile((int)$x['id'],['surface'=>'watch','resource_kind'=>$i%3===2?'纪录片':($i%2?'电影':'剧集'),'media_year'=>2021+$i,'media_status'=>$i%2?'watched':'watching','surface_note'=>'视觉验证条目']);}
          foreach(['独立网站出海指南','VPS 迁移专题','Web 安全学习路线','SEO 赚钱完整指南'] as $i=>$title){$x=$r->saveLink(null,['category_id'=>$ca,'title'=>$title,'url'=>'https://example.com/topic-final-'.$i,'description'=>'长期专题知识页','tags'=>'专题,指南','is_private'=>$i===3,'is_favorite'=>$i===0],'manual');$s->upsertProfile((int)$x['id'],['surface'=>'topics','resource_kind'=>$i%2?'学习路线':'指南','surface_note'=>'长期维护']);}
          echo "P01_FINAL_VISUAL_SEED=PASS\n";
          PHP
          php /tmp/p01-final-visual-seed.php | grep -Fx P01_FINAL_VISUAL_SEED=PASS
      - name: Capture 20 stable frames
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVID" /tmp/p01-final-visual-pw
          cd /tmp/p01-final-visual-pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat >audit.cjs <<'JS'
          const {chromium}=require('playwright'),fs=require('fs');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const c=await b.newContext({viewport:{width:1440,height:1000}});
            const login=await c.request.post('http://127.0.0.1:18391/api.php?action=login',{data:{password:'FinalVisual2026'}});if(!login.ok()||!(await login.json()).ok)throw Error('login');
            const p=await c.newPage(),routes=[['home','home.php'],['start','start.php'],['channels','channels.php'],['watch','watch.php'],['topics','topics.php']],metrics={};
            const read=()=>p.evaluate(()=>({overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,nav:!!document.querySelector('.vf-global-domain-nav'),bodyBg:getComputedStyle(document.body).backgroundColor,stage:document.querySelector('.vf-app-stage')?.getBoundingClientRect().width||0}));
            for(const [name,route] of routes){
              metrics[name]={};
              for(const [w,h,size] of [[1440,1000,'1440'],[390,844,'390']]){
                await p.setViewportSize({width:w,height:h});await p.goto('http://127.0.0.1:18391/'+route,{waitUntil:'networkidle'});await p.waitForTimeout(140);
                const light=await read();if(light.overflow>1||!light.nav)throw Error(`${name}-${size}-light ${JSON.stringify(light)}`);metrics[name][size+'Light']=light;await p.screenshot({path:`${process.env.EVID}/${name}-${size}-light.png`});
                await p.evaluate(()=>document.documentElement.setAttribute('data-theme','dark'));await p.waitForTimeout(100);
                const dark=await read();if(dark.overflow>1||!dark.nav)throw Error(`${name}-${size}-dark ${JSON.stringify(dark)}`);metrics[name][size+'Dark']=dark;await p.screenshot({path:`${process.env.EVID}/${name}-${size}-dark.png`});
              }
            }
            fs.writeFileSync(process.env.EVID+'/metrics.json',JSON.stringify(metrics,null,2));fs.writeFileSync(process.env.EVID+'/verdict.txt',`P01_FINAL_VISUAL_SWEEP=PASS\nSOURCE=${process.env.SOURCE}\n`);await b.close();console.log('P01_FINAL_VISUAL_SWEEP=PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          EVID="$EVID" SOURCE="$SOURCE" node audit.cjs 2>&1 | tee "$EVID/result.txt"
          grep -Fx P01_FINAL_VISUAL_SWEEP=PASS "$EVID/result.txt"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-final-visual-sweep-${{ github.run_id }}
          path: ${{ env.EVID }}
          if-no-files-found: error
          retention-days: 30
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/p01-final-visual.pid 2>/dev/null)" 2>/dev/null || true
