name: P01 V2.47.280 Core Updates Proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p01-v247280-core-updates-proof.yml"

permissions:
  contents: read

jobs:
  proof:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'proof(P01): V2.47.280 core-updates')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli jq >/dev/null
      - name: Clone exact candidate
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/core-updates.git" candidate
          git -C candidate fetch -q origin fa28f9fa505e159e8068cd49ec014cd20f676496
          git -C candidate checkout -q --detach fa28f9fa505e159e8068cd49ec014cd20f676496
          echo CORE_UPDATES_EXACT_SOURCE=PASS
      - name: Canonical CI equivalent
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 scripts/check_manifest_contract.py
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find update-core/php -type f -name '*.php' -print0)
          php update-core/php/tests/run.php
          echo CORE_UPDATES_CANONICAL_CI_EQUIVALENT=PASS
      - name: Verify identity
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          jq -e '
            .current_version=="2.47.279" and
            .target_version=="2.47.280" and
            .from_versions==["2.47.279"] and
            .release_id==406319874 and
            .product_identity=="ba86dd9279890751b68a6d57edb508c90c153e7e" and
            .asset_name=="VF_Start_V2.47.280_UPDATE.zip" and
            .asset_bytes==2361564 and
            .asset_sha256=="f47e05c5ba4013542ea5a9ef998b8af49c9ae9e44baf177a7547743220fe7f2f" and
            (.notes|contains("浏览器本地时区")) and
            (.notes|contains("默认折叠"))
          ' projects/P01.json >/dev/null
          echo P01_V247280_MANIFEST_IDENTITY=PASS
      - name: Verify bounded delta
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          git fetch -q origin main
          mapfile -t changed < <(git diff --name-only origin/main...HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "projects/P01.json"
          echo CORE_UPDATES_BOUNDED_DELTA=PASS
          echo PRODUCTION_WRITE=NO
