name: P01 508 exact channel-only formal source preflight
on:
  push:
    branches:
      - task/p01-508-channel-formal-preflight-20261109
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      PRODUCT_SHA: d6aa03319f6c76f0f1e96fb330be7313337ad729
      BASE_SHA: c33d03af2f1bd1bed60ba6e250e597011d2aabbb
      GH_REPO: llhzx2018/vf-start
      VF_NEWS_R5_SANDBOX: "1"
      VF_NEWS_R5_TARGET_VERSION: "2.47.508"
    steps:
      - name: Checkout registered public release builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact 508 private source without persistence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.PRODUCT_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p01-exact
      - name: Checkout official 507 exact baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.BASE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p01-baseline
      - name: Install minimum isolated PHP tools
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-xml php-mbstring php-zip php-gd unzip zip jq >/dev/null
          test "$(git -C p01-exact rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git -C p01-baseline rev-parse HEAD)" = "$BASE_SHA"
          test "$(cat p01-exact/VERSION)" = 2.47.508
          test "$(cat p01-exact/src/VERSION.txt)" = 2.47.508
          grep -Fx "define('VF_VERSION', '2.47.508');" p01-exact/src/app/bootstrap.php
          php -l p01-exact/src/app/ChannelLibraryPage.php >/dev/null
          php p01-exact/tests/unit/p01_channels_video_independent_pagination_native.php
          php p01-exact/tests/unit/channels_guest_readonly_layout_v247390_contract.php
          echo P01_508_SCOPED_SOURCE=PASS
      - name: Exact 508 canonical regression against formal 507
        timeout-minutes: 10
        run: |
          set -Eeuo pipefail
          bash p01-exact/tests/canonical_release_regression.sh p01-exact p01-baseline --require-zero-debt | tee /tmp/p01-508-canonical.txt
          grep -Fx 'P01_CANONICAL_NEW_REGRESSION_COUNT=0' /tmp/p01-508-canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/p01-508-canonical.txt
          echo P01_508_CANONICAL_ZERO_REGRESSION=PASS
      - name: Adapt old 505-era package test only in disposable test workspace
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path("p01-exact/tests/integration/p01_news_r5_atomic_package_gate.sh").read_text()
          assert src.count("FROM=2.47.505")==1 and src.count("CANDIDATE_VERSION=2.47.506")==1
          src=src.replace("FROM=2.47.505","FROM=2.47.507")
          src=src.replace("CANDIDATE_VERSION=2.47.506","CANDIDATE_VERSION=2.47.508")
          src=src.replace('case "$TO" in 2.99.999|2.47.506)', 'case "$TO" in 2.47.508)')
          src=src.replace("P01_NEWS_R5_EXACT_505_TO_506_FULL_ATOMIC_BACKUP_RESTORE", "P01_508_EXACT_507_TO_508_FULL_ATOMIC_BACKUP_RESTORE")
          Path("/tmp/p01-508-atomic-gate.sh").write_text(src)
          path=Path("p01-exact/tests/integration/p01_news_r5_lifecycle_native.php")
          s=path.read_text()
          old="!is_file($resolved.'/news.php')"
          assert s.count(old)==1
          path.write_text(s.replace(old,"is_file($resolved.'/news.php')"))
          print("P01_508_OLD_FIXTURE_ADAPTED_IN_TEST_ONLY=PASS")
          PY
      - name: Build exact 508 FULL Atomic and test official 507→508 install data restore forced rollback
        timeout-minutes: 16
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          bash /tmp/p01-508-atomic-gate.sh | tee /tmp/p01-508-lifecycle.txt
          grep -Fx 'P01_508_EXACT_507_TO_508_FULL_ATOMIC_BACKUP_RESTORE=PASS' /tmp/p01-508-lifecycle.txt
          echo P01_508_FORMAL_SOURCE_INSTALL_UPGRADE_BACKUP_ROLLBACK=PASS
      - name: Delete transient source, private artifacts and scripts
        if: always()
        run: |
          rm -rf p01-exact p01-baseline /tmp/p01-508-atomic-gate.sh /tmp/p01-508-lifecycle.txt /tmp/p01-508-canonical.txt
          echo P01_508_PRIVATE_CLEANUP=YES
