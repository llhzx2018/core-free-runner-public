name: P06 VF Press V0.1.0 Formal Private Release Publisher

on:
  pull_request:
    branches: [main]
    paths:
      - triggers/p06-v010-formal-release-publisher-v2.txt

permissions:
  contents: read

env:
  SOURCE_SHA: cea083cf04c74ae5bff2c6f2c92299b01fc3ad30
  TAG: v0.1.0

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Require registered capabilities
        shell: bash
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$VF_PRIVATE_READ_TOKEN"
          test -n "$VF_RELEASE_WRITE_TOKEN"
          echo REGISTERED_RELEASE_CAPABILITIES=PASS

      - name: Checkout exact private formal source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-press
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Build and verify formal assets
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 php-mbstring php-zip php-curl composer >/dev/null
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' < VERSION)" = '0.1.0'
          grep -Fq '"lifecycle": "RELEASE_READY"' VF_PROJECT.json
          composer validate --strict >/dev/null
          composer dump-autoload --no-dev --optimize --no-interaction >/dev/null
          rm -rf dist
          php bin/build-release.php dist | tee /tmp/build
          grep -Fq 'RELEASE_BUILD=PASS' /tmp/build
          (cd dist && sha256sum -c SHA256SUMS.txt)
          FULL_SHA="$(sha256sum dist/VF_Press_V0.1.0_FULL.zip | awk '{print $1}')"
          UPDATE_SHA="$(sha256sum dist/VF_Press_V0.1.0_UPDATE.zip | awk '{print $1}')"
          FULL_BYTES="$(stat -c%s dist/VF_Press_V0.1.0_FULL.zip)"
          UPDATE_BYTES="$(stat -c%s dist/VF_Press_V0.1.0_UPDATE.zip)"
          test "$FULL_BYTES" -gt 100000
          test "$UPDATE_BYTES" -gt 100000
          unzip -l dist/VF_Press_V0.1.0_FULL.zip >/tmp/full-list
          grep -Fq 'vendor/autoload.php' /tmp/full-list
          grep -Fq 'public/index.php' /tmp/full-list
          grep -Fq 'INSTALL_VPS.md' /tmp/full-list
          ! grep -Eq '(^|[[:space:]])storage/' /tmp/full-list
          ! grep -Fq '.git/' /tmp/full-list
          ! unzip -p dist/VF_Press_V0.1.0_FULL.zip .env.example | grep -Eq 'VF_PRIVATE_READ_TOKEN=.+$'
          echo "FORMAL_FULL_SHA=$FULL_SHA" >> "$GITHUB_ENV"
          echo "FORMAL_UPDATE_SHA=$UPDATE_SHA" >> "$GITHUB_ENV"
          echo "FORMAL_FULL_BYTES=$FULL_BYTES" >> "$GITHUB_ENV"
          echo "FORMAL_UPDATE_BYTES=$UPDATE_BYTES" >> "$GITHUB_ENV"
          echo FORMAL_ASSET_BUILD=PASS
          echo "BUILD_FULL_BYTES=$FULL_BYTES"
          echo "BUILD_FULL_SHA256=$FULL_SHA"
          echo "BUILD_UPDATE_BYTES=$UPDATE_BYTES"
          echo "BUILD_UPDATE_SHA256=$UPDATE_SHA"

      - name: Publish exact private GitHub Release
        working-directory: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          cat >/tmp/release-notes.md <<'EOF'
          VF Press / 科瓦罗出版首个正式版本。

          - Research → Canonical Manuscript → Revision → immutable Edition
          - Published Publisher / Reader
          - Web / EPUB / PDF
          - AI Editorial isolation
          - SQLite Recovery / Staging Restore
          - Operations Center
          - core-updates 后台在线更新
          - 升级前自动 Recovery + Runtime Source Backup
          - Asset bytes / SHA-256 校验
          - 失败自动 Rollback
          - Logo / Favicon / 品牌设置
          EOF
          if gh release view "$TAG" --repo llhzx2018/vf-press --json targetCommitish >/tmp/existing.json 2>/dev/null; then
            EXISTING="$(jq -r '.targetCommitish' /tmp/existing.json)"
            test "$EXISTING" = "$SOURCE_SHA"
            gh release upload "$TAG" --repo llhzx2018/vf-press \
              dist/VF_Press_V0.1.0_FULL.zip \
              dist/VF_Press_V0.1.0_UPDATE.zip \
              dist/SHA256SUMS.txt \
              dist/RELEASE_INFO.json --clobber
          else
            gh release create "$TAG" --repo llhzx2018/vf-press \
              dist/VF_Press_V0.1.0_FULL.zip \
              dist/VF_Press_V0.1.0_UPDATE.zip \
              dist/SHA256SUMS.txt \
              dist/RELEASE_INFO.json \
              --target "$SOURCE_SHA" \
              --title 'VF Press V0.1.0' \
              --notes-file /tmp/release-notes.md
          fi
          gh release view "$TAG" --repo llhzx2018/vf-press --json tagName,targetCommitish,isDraft,isPrerelease > /tmp/release-readback.json
          test "$(jq -r '.tagName' /tmp/release-readback.json)" = "$TAG"
          test "$(jq -r '.targetCommitish' /tmp/release-readback.json)" = "$SOURCE_SHA"
          test "$(jq -r '.isDraft' /tmp/release-readback.json)" = 'false'
          test "$(jq -r '.isPrerelease' /tmp/release-readback.json)" = 'false'
          echo FORMAL_PRIVATE_RELEASE=PASS

      - name: Remote asset readback establishes authority
        working-directory: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/release-readback && mkdir /tmp/release-readback
          gh release download "$TAG" --repo llhzx2018/vf-press --dir /tmp/release-readback \
            -p 'VF_Press_V0.1.0_FULL.zip' \
            -p 'VF_Press_V0.1.0_UPDATE.zip' \
            -p 'SHA256SUMS.txt' \
            -p 'RELEASE_INFO.json'
          (cd /tmp/release-readback && sha256sum -c SHA256SUMS.txt)
          REMOTE_FULL_SHA="$(sha256sum /tmp/release-readback/VF_Press_V0.1.0_FULL.zip | awk '{print $1}')"
          REMOTE_UPDATE_SHA="$(sha256sum /tmp/release-readback/VF_Press_V0.1.0_UPDATE.zip | awk '{print $1}')"
          REMOTE_FULL_BYTES="$(stat -c%s /tmp/release-readback/VF_Press_V0.1.0_FULL.zip)"
          REMOTE_UPDATE_BYTES="$(stat -c%s /tmp/release-readback/VF_Press_V0.1.0_UPDATE.zip)"
          test "$REMOTE_FULL_SHA" = "$FORMAL_FULL_SHA"
          test "$REMOTE_UPDATE_SHA" = "$FORMAL_UPDATE_SHA"
          test "$REMOTE_FULL_BYTES" = "$FORMAL_FULL_BYTES"
          test "$REMOTE_UPDATE_BYTES" = "$FORMAL_UPDATE_BYTES"
          echo FORMAL_REMOTE_READBACK=PASS
          echo "OFFICIAL_FULL_BYTES=$REMOTE_FULL_BYTES"
          echo "OFFICIAL_FULL_SHA256=$REMOTE_FULL_SHA"
          echo "OFFICIAL_UPDATE_BYTES=$REMOTE_UPDATE_BYTES"
          echo "OFFICIAL_UPDATE_SHA256=$REMOTE_UPDATE_SHA"
          rm -rf /tmp/release-readback source
