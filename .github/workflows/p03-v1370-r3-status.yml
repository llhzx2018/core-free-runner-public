name: P03 V1.37.0 R3 Status Beacon

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p03-v1370-r3-status.yml'
  workflow_run:
    workflows: ['P03 V1.37.0 Formal Release Bridge R3']
    types: [completed]

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  beacon:
    runs-on: ubuntu-latest
    steps:
      - name: Publish latest R3 gate state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          gh api "repos/$repo/actions/workflows/p03-v1370-formal-release-r3.yml/runs?per_page=10" > "$RUNNER_TEMP/runs.json"
          python3 - "$RUNNER_TEMP/runs.json" > "$RUNNER_TEMP/state.env" <<'PY'
import json,sys
runs=json.load(open(sys.argv[1])).get('workflow_runs',[])
if not runs:
    print('STATE=MISSING'); print('RUN_ID='); print('RUN_URL='); print('HEAD_SHA='); raise SystemExit
r=sorted(runs,key=lambda x:x.get('id',0),reverse=True)[0]
state=(r.get('conclusion') or r.get('status') or 'unknown').upper()
print('STATE='+state); print('RUN_ID='+str(r.get('id',''))); print('RUN_URL='+str(r.get('html_url',''))); print('HEAD_SHA='+str(r.get('head_sha','')))
PY
          . "$RUNNER_TEMP/state.env"
          title="P03 V1.37.0 R3 ${STATE}"
          body=$(cat <<EOF
P03 V1.37.0 canonical Atomic release R3 gate.

- State: $STATE
- Run ID: $RUN_ID
- Head SHA: $HEAD_SHA
- Run URL: $RUN_URL
EOF
)
          number=$(gh issue list --repo "$repo" --state open --search 'P03 V1.37.0 R3 in:title' --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$repo" --title "$title" --body "$body"
          else
            gh issue create --repo "$repo" --title "$title" --body "$body"
          fi
          echo "$body"
