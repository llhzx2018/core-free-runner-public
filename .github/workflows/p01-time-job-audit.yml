name: P01 Time Job Audit

on:
  push:
    branches: [vf-agent-operations-v1]
    paths:
      - '.github/workflows/p01-time-job-audit.yml'
      - 'requests/p01-time-job-audit-*.txt'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: c612156c3d5dace070c492ecc1bc80d4491f1366
    steps:
      - name: Checkout exact P01 source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.EXPECTED_HEAD }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: p01

      - name: Time persistence audit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C p01 rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo '=== PHP non-gmdate date() candidates ==='
          grep -RInE --include='*.php' "(^|[^A-Za-z_])date[[:space:]]*\(" p01/src || true
          echo '=== PHP gmdate() count/sample ==='
          COUNT=$(grep -RhoE --include='*.php' "gmdate[[:space:]]*\(" p01/src | wc -l | tr -d ' ')
          echo "GMDATE_CALLS=$COUNT"
          grep -RInE --include='*.php' "gmdate[[:space:]]*\(" p01/src | head -80 || true
          echo '=== PHP DateTime candidates ==='
          grep -RInE --include='*.php' "DateTime(Immutable)?|date_default_timezone_set|setTimezone" p01/src | head -120 || true
          echo '=== SQL time function candidates ==='
          grep -RInE --include='*.php' "CURRENT_TIMESTAMP|datetime\(|strftime\(|unixepoch\(|localtime" p01/src || true

      - name: Time display audit
        shell: bash
        run: |
          set -euo pipefail
          echo '=== browser-local date rendering ==='
          grep -RInE --include='*.js' "toLocale(String|DateString|TimeString)|new Date\(|Intl\.DateTimeFormat" p01/src/assets p01/src/plugins || true
          echo '=== canonical formatter usage ==='
          grep -RIn "formatInstant" p01/src || true

      - name: Job execution audit
        shell: bash
        run: |
          set -euo pipefail
          echo '=== job types and dispatch ==='
          grep -nE "CORE_TYPES|executeClaimed|dispatch\(|set_time_limit|max_execution_time|timeout" p01/src/app/JobManager.php || true
          echo '=== worker entry ==='
          sed -n '1,220p' p01/src/cli/worker.php
          echo "EXACT_SOURCE=$EXPECTED_HEAD"
          echo 'AUDIT_COMPLETE'
