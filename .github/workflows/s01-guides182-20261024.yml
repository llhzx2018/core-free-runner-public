name: S01 Guides directory desktop and authored-fact proof
on:
  push:
    branches: [task/s01-guides182-20261024]
    paths: ['.github/workflows/s01-guides182-20261024.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.182
  TARGET_SHA: 9c73372b34c32bbe67368f437d3b8c9dfc365689
  TARGET_TREE: b93eb54408763b975ce84f2c1cfb4dbdc62b2d31
  BASE_SHA: 1f4e8f1917226e255724e185876459ee46e829db
  SOURCE_VERSION: 1.35.181
  LANE_ID: s01-guides182-20261024
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          ref: 02d4591eed025a3d3a67bc0a150b3ddc448c2ab8
          persist-credentials: false
          path: established
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 9c73372b34c32bbe67368f437d3b8c9dfc365689
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact package and focused syntax checks
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider baseline
          python3 control/lanes/s01-guides182-20261024/package.py
          php -l target/src/inc/services/frontend-page-progress-service.php
          php -l target/src/inc/modules/module-post-list.php
          php -l target/tests/guides-directory-facts-check.php
          php -l target/src/inc/public-css-owner-registry.php
          node --check target/tests/guides-directory-desktop-browser-check.cjs
          node --check control/lanes/s01-guides182-20261024/clean.cjs
          gh release download v1.35.181 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.181.zip --dir provider
          echo '54c4886e13ea90ca07ab67d388a595fe2eb9e8f027cca8e327b2254f64a8f876  provider/vf-tools-theme_V1.35.181.zip' | sha256sum -c
          gh release download v1.25.94 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.94.zip --dir provider
          echo '70b90d40da5d69fc7819bd7ada3f15fb0145e64822b788bd94956c7827b2df03  provider/vf-tools-m3u8_V1.25.94.zip' | sha256sum -c
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -g -fsSL --retry 2 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC[wght].ttf' -o "$HOME/.local/share/fonts/NotoSansSC.ttf"
          fc-cache -f
      - name: Native WordPress tools directory and upgrade rollback data protection
        run: |
          set -euo pipefail
          cp -a established/lanes/s01-frontend-design-20261017 lane
          cp control/lanes/s01-guides182-20261024/clean.cjs lane/warm-admin.cjs
          bash control/lanes/s01-guides182-20261024/native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-home-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target baseline provider
