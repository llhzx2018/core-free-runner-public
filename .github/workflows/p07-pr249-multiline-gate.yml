name: P07 PR249 strict multiline SQL true-and-false guard
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-pr249-multiline-gate.yml'
      - 'experiments/p07-pr249/**'
permissions:
  contents: read
jobs:
  exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact candidate and baseline blob identities
        shell: bash
        run: |
          set -Eeuo pipefail
          root=dist/p07/0.1.0/overlay
          test "$(cat "$root/BUILD_ID")" = "0.1.0-release105"
          test "$(git hash-object experiments/p07-pr249/verify.py)" = f3f4ff63d4cfbeb27ab5c971d07ea72c9bf20bf8
          test "$(git hash-object experiments/p07-pr249/test_multiline_dml_integrity.py)" = b693e7660b1578425bdc6ce86e6010095104c8ea
          test "$(git hash-object experiments/p07-pr249/test_cross_engine_sql_format.py)" = 40bd64f0a4603448eca8691bc69addd4a0597418
          test "$(git hash-object experiments/p07-pr249/test_verify.py)" = 415a37a9825d42614f9ef973381e84d9786fb440
          test "$(git hash-object "$root/lib/sql_diff_evidence.py")" = 08cd0d4309eab3622c6701c313f9a6ba5743fc08
          cp -a "$root" "$RUNNER_TEMP/p07-sql249"
          cp experiments/p07-pr249/verify.py "$RUNNER_TEMP/p07-sql249/lib/verify.py"
          cp experiments/p07-pr249/test_multiline_dml_integrity.py "$RUNNER_TEMP/p07-sql249/tests/test_multiline_dml_integrity.py"
          cp experiments/p07-pr249/test_cross_engine_sql_format.py "$RUNNER_TEMP/p07-sql249/tests/test_cross_engine_sql_format.py"
          cp experiments/p07-pr249/test_verify.py "$RUNNER_TEMP/p07-sql249/tests/test_verify.py"
          chmod +x "$RUNNER_TEMP/p07-sql249/bin/"*
          echo P07_PR249_EXACT_SOURCE_STAGING_PASS
      - name: Strict multiline DML and previous negative safety regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/p07-sql249"
          python3 -m py_compile lib/verify.py lib/sql_diff_evidence.py tests/test_multiline_dml_integrity.py tests/test_cross_engine_sql_format.py
          PYTHONPATH=lib python3 -m unittest -v \
            tests.test_multiline_dml_integrity \
            tests.test_cross_engine_sql_format \
            tests.test_sql_diff_evidence \
            tests.test_sql_diff_command \
            tests.test_verify \
            tests.test_server_migration_pull
          echo P07_PR249_MULTILINE_AND_TRUE_POSITIVE_GATES_PASS
      - name: Assert engine and migration import state unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          root=dist/p07/0.1.0/overlay
          for p in lib/server_migration_pull.py lib/server_migration.py lib/cloudpanel.py; do
            test "$(git hash-object "$root/$p")" = "$(git hash-object "$RUNNER_TEMP/p07-sql249/$p")"
          done
          echo P07_PR249_NO_MIGRATION_OR_IMPORT_CHANGE_PASS
