name: P01 V2.28 Final Candidate Readiness Gate
on:
  push:
    branches: [task/p01-v2280-final-candidate-gate-20260829]
    paths:
      - .github/workflows/p01-v2280-final-candidate-gate-20260829.yml
      - scripts/p01-v228-build-artifacts.py
      - scripts/p01-v228-candidate-core-gate.sh
      - scripts/p01-v228-candidate-ui-gate.sh
      - scripts/p01-v228-candidate-ui-gate.js
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: 85e450ef146987fd6a950fd948ad58e81f5d3c95
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: candidate
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.27.0
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: production
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: task/p01-v2280-final-candidate-gate-20260829
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: agent/p01-22121-formal-artifact-gate-20260819
          path: proven
      - name: Exact source, artifact, updater and rollback gate
        run: bash runner/scripts/p01-v228-candidate-core-gate.sh
      - name: Fresh install and browser UI regression
        run: bash runner/scripts/p01-v228-candidate-ui-gate.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P01-v2.28.0-candidate-readiness-evidence
          path: |
            /tmp/p01-v228-artifacts
            /tmp/p01-v228-final-ui
            /tmp/p01-v228-update.json
            /tmp/p01-v228-int-recover.json
          if-no-files-found: error
          retention-days: 30
      - name: Verdict
        run: |
          echo P01_V228_CANDIDATE_SOURCE=85e450ef146987fd6a950fd948ad58e81f5d3c95
          echo P01_V228_CANDIDATE_TREE=d7238aec239fd8288ba47eb382ea65340f570e96
          echo P01_V228_SOURCE_VERSION=2.27.0
          echo P01_V228_TARGET_VERSION=2.28.0
          echo P01_V228_SCHEMA=2026082801
          echo P01_V228_READY_FOR_L3_RELEASE_GATE=YES
          echo RELEASE_PUBLISHED=NO
          echo PRODUCTION_WRITE=NO
