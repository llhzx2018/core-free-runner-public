name: P04 V2.7 Integrated 15 Task Gate
on:
  push:
    branches: [p04-v270-integration-gate]
    paths: [.github/workflows/p04-v270-integrated-flow.yml]
permissions:
  contents: write
jobs:
  flow:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: p04-v270-integration-gate}
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: integration/v2.7.0-personal-infra
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: private
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Run project-native sanitized fixture + V2.7 browser gate
        shell: bash
        run: |
          set +e
          result=/tmp/p04-v270-flow-result.json
          cd private
          src=$(grep -rl --include='*.sh' 'v260-user-task-fixture.php' scripts tests 2>/dev/null | head -n1)
          if [ -z "$src" ] && [ -f scripts/run-v258-browser-gate.sh ]; then src=scripts/run-v258-browser-gate.sh; fi
          if [ -z "$src" ]; then printf '{"status":"FAIL","failed_gate":"NO_PROJECT_NATIVE_BROWSER_HARNESS"}\n' > "$result"; exit 0; fi
          tmp="$(dirname "$src")/.v270-integration-run.sh"
          cp "$src" "$tmp"
          chmod +x "$tmp"
          # Keep the proven fixture/server/auth setup, replace only the browser assertion module.
          python3 - "$tmp" <<'PY'
          import re,sys
          p=sys.argv[1]
          s=open(p,encoding='utf-8').read()
          s=re.sub(r'tests/e2e/[A-Za-z0-9._/-]+\.mjs','tests/e2e/v270-integrated-ua.mjs',s)
          open(p,'w',encoding='utf-8').write(s)
          PY
          VF_V270_RESULT="$result" bash "$tmp" >/tmp/v270-harness.log 2>&1
          rc=$?
          rm -f "$tmp"
          if [ ! -s "$result" ]; then
            if [ $rc -eq 0 ]; then printf '{"status":"FAIL","failed_gate":"E2E_RESULT_MISSING"}\n' > "$result"; else printf '{"status":"FAIL","failed_gate":"PROJECT_NATIVE_HARNESS"}\n' > "$result"; fi
          fi
          exit 0
      - name: Publish public-safe flow evidence
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          cp /tmp/p04-v270-flow-result.json evidence/p04-v270-integrated-flow.json || printf '{"status":"FAIL","failed_gate":"RUNNER_SETUP"}\n' > evidence/p04-v270-integrated-flow.json
          rm -rf private /tmp/v270-harness.log /tmp/p04-v270-flow-result.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/p04-v270-integrated-flow.json
          git commit -m 'evidence(P04): V2.7 integrated flow result' || exit 0
          git push origin HEAD:p04-v270-integration-gate
