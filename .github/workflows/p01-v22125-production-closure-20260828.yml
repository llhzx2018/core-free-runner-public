          cat > docs/authority/CURRENT.md <<'EOF'
          # P01 · VF Start · Current Authority Overlay

          > 更新时间：2026-08-28
          > 状态：CURRENT / V2.21.25 FORMAL RELEASE / PRODUCTION V2.21.25 OWNER-EVIDENCED

