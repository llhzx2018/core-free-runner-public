          x['production_version_evidence']='OWNER SCREENSHOT / BACKEND ONLINE UPDATE / CURRENT=LATEST=V2.21.25 / 2.21.24 -> 2.21.25 SUCCESS / 2026-08-28 06:08:52 Asia/Shanghai'
          x['working_version']='2.21.25'; x['candidate_version']='2.21.25'
          x['candidate_state']='FORMAL RELEASED / PRODUCTION UPGRADED / COMMON PRODUCT BASELINE V2'
          x['current_phase']='V2.21.25 PRODUCTION CLOSURE COMPLETE'
          x['current_authority']='v2.21.25@6bc09cd152210183972dcb3f2c361eb65a4cadab / Release 378146285 / Production owner-evidenced V2.21.25'
          x['git_governance']='V2.21.25 formal release published from exact verified source; Production upgraded by owner through verified backend Atomic channel; no force'
          x['formal_release']={'version':'2.21.25','tag':'v2.21.25','release_id':378146285,'release_commit':'6bc09cd152210183972dcb3f2c361eb65a4cadab','release_tree':'56ab66918e394477faad175e5ce9656eb0bc7b3f','released_at':'2026-08-27T21:54:51Z','core_updates':'PASS / TARGET 2.21.25 / FROM [2.21.24] / COMPAT ASSET VERIFIED','exact_source_machine_gate_run_id':33119783158,'artifact_gate_run_id':33119946804,'publication_run_id':33120263975,'compatibility_gate_run_id':33121118563,'compatibility_publication_run_id':33121207273,'production_upgrade':'PASS / OWNER-EVIDENCED'}
