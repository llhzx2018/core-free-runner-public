name: P01 V2.21.25 Production Closure
on:
  push:
    branches: [task/p01-v22125-update-channel-compat-20260828]
    paths: ['.github/workflows/p01-v22125-production-closure-20260828.yml']
permissions:
  contents: read
jobs:
  close:
    runs-on: ubuntu-24.04
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      CLOSURE_BRANCH: closure/p01-v2.21.25-production-20260828
      EXPECTED_BASE: 9fa7e86307f79d9535a9d522c7a6bff7a11fd4ed
    steps:
      - name: Clone exact closure branch
        env: { WRITE_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}' }
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone -q --branch "$CLOSURE_BRANCH" "https://x-access-token:${WRITE_TOKEN}@github.com/${PRODUCT_REPO}.git" p01
          cd p01
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_BASE"
      - name: Record owner production evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p01
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('VF_PROJECT.json'); x=json.loads(p.read_text())
