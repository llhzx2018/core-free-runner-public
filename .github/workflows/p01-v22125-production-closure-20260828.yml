          python3 -m json.tool VF_PROJECT.json >/dev/null
          git diff --check
          mapfile -t f < <(git diff --name-only)
          test "${#f[@]}" -eq 2
          printf '%s\n' "${f[@]}" | grep -Fxq VF_PROJECT.json
          printf '%s\n' "${f[@]}" | grep -Fxq docs/authority/CURRENT.md
      - name: Commit and push
        env: { WRITE_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}' }
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p01
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VF_PROJECT.json docs/authority/CURRENT.md
          git commit -m 'docs(P01): close V2.21.25 production promotion'
          git remote set-url origin "https://x-access-token:${WRITE_TOKEN}@github.com/${PRODUCT_REPO}.git"
          git push origin HEAD:"$CLOSURE_BRANCH"
          echo P01_PRODUCTION_AUTHORITY_CLOSURE=PASS