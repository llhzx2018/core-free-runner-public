name: S01-C02 Ops 1.21.1071 Formal Release exact gate
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TARGET_REPOSITORY: llhzx2018/vf-tools-ops
      TARGET_SHA: 6359a142702ca4cd512dc7468e51cb5f97e5e4dc
      TARGET_TREE: 810157a7f5815cd57a48c7a71c90c0b4f101cbde
      TESTED_SOURCE_SHA: 369492c3280a46cbe23540f9b032bbd8321b64da
      TESTED_RUN_ID: 37789714930
      TESTED_ARTIFACT: s01-c02-zip-operator-20261008
      TARGET_VERSION: 1.21.1071
      RELEASE_TAG: v1.21.1071
      ASSET_NAME: vf-tools-ops_V1.21.1071.zip
      EXPECTED_BYTES: 3533078
      EXPECTED_SHA256: 423375df5e90d0b76a1ba7f5983f482ad84c8d17e421230d9f5aa502b7b463ad
      EXPECTED_RUNTIME_FILES: 987
      EXPECTED_RUNTIME_FP: a052247d9bc7ea3fc1c86b6ca16470ebe9697127b07e4d1c6e39465b7bfc4572
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 6359a142702ca4cd512dc7468e51cb5f97e5e4dc
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, sodium, mbstring
      - name: Verify main tree and sealed Candidate gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p tested evidence
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(tr -d '\r\n' < target/VERSION)" = "$TARGET_VERSION"
          grep -F '* Version: 1.21.1071' target/vf-ops.php >/dev/null
          grep -F "## V1.21.1071" target/CHANGELOG.md >/dev/null
          grep -F "S01-V10-QUALITY-NATIVE-ISSUE-DISCLOSURE-CLOSURE" target/vf-ops.php >/dev/null
          test "$(GH_TOKEN="$READ_TOKEN" gh api "repos/$TARGET_REPOSITORY/branches/main" --jq '.commit.sha')" = "$TARGET_SHA"
          test "$(gh run view "$TESTED_RUN_ID" --repo llhzx2018/core-free-runner-public --json conclusion --jq '.conclusion')" = success
          gh run download "$TESTED_RUN_ID" --repo llhzx2018/core-free-runner-public --name "$TESTED_ARTIFACT" --dir tested
          jq -e --arg sha "$TESTED_SOURCE_SHA" '.status=="PASS" and .source_sha==$sha and .production=="NOT_TOUCHED" and .owner_pass==false' tested/FINAL_EVIDENCE.json
          grep -Fx BROWSER_CODE_EQUIVALENT=PASS tested/browser-equivalence.txt
          grep -Fx INSTALL_UPGRADE_ROLLBACK=PASS tested/install-upgrade-rollback.txt
          jq -e '.pass==true' tested/zip-gates.json
          php -l target/includes/admin-v13/views/publish_zip_v6.php
          node --check target/assets/js/admin-publish-zip.js
          node --check target/tests/s01-c02-1211066-publish-zip-operator-resume-browser.js
          node --check target/tests/s01-c02-1211067-zip-input-browser-e2e.js
          echo SOURCE_CANDIDATE_GATE=PASS | tee evidence/candidate-gate.txt
      - name: Reproduce exact WordPress installation asset and verify rollback base
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          python3 target/.github/release/build-ops-package.py --source target --output "$RUNNER_TEMP/$ASSET_NAME" | tee evidence/package.json
          jq -e --arg n "$ASSET_NAME" --arg h "$EXPECTED_SHA256" --arg f "$EXPECTED_RUNTIME_FP" --argjson size "$EXPECTED_BYTES" --argjson count "$EXPECTED_RUNTIME_FILES" '.asset_name==$n and .asset_sha256==$h and .asset_bytes==$size and .runtime_files==$count and .runtime_fingerprint==$f and .root_contract=="PASS_SINGLE_VF_OPS_ROOT"' evidence/package.json
          echo "$EXPECTED_SHA256  $RUNNER_TEMP/$ASSET_NAME" | sha256sum -c -
          unzip -tq "$RUNNER_TEMP/$ASSET_NAME" >/dev/null
          mkdir -p previous
          gh release download v1.21.1070 --repo "$TARGET_REPOSITORY" --pattern vf-tools-ops_V1.21.1070.zip --dir previous --clobber
          echo "9bc122a1923c5ebc0c7b59fcb355dbca22a0045942e8ee60b15d1c9ce69cbb65  previous/vf-tools-ops_V1.21.1070.zip" | sha256sum -c -
          echo PACKAGE_AND_ROLLBACK_ASSET=PASS | tee evidence/package-gate.txt
      - name: Publish immutable formal release
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          if gh release view "$RELEASE_TAG" --repo "$TARGET_REPOSITORY" >/dev/null 2>&1; then echo 'RELEASE_TAG_ALREADY_PUBLISHED'; exit 1; fi
          cat > notes.md <<'EOF'
          # VF Tools Ops 1.21.1071 · 02 发布包门禁与操作反馈修复
          发布日期：2026-10-08
          - 上传静态 ZIP 的操作现在清楚说明为「上传并检查 ZIP」，不会在发布门禁通过前承诺生成候选包。
          - 完成原包检查后，需要再检查发布前门禁；候选包仅在门禁放行后生成。
          - 暂停信息区分原包检查与候选包生成；意外中断后明确要求点击「继续当前任务」，普通重开页面不自动推进。
          - 质量中心「问题明细」及「高级信息」继续保留 1070 浏览器原生展开/收起实现；冻结 Shell/Header/01 Source 保持不变。
          - Schema 6.0.0 不变；无 Migration，未改认证、安全边界、WordPress 更新机制或任何 Production 数据。
          - WordPress 插件完整安装 ZIP：vf-tools-ops_V1.21.1071.zip；适用于全新安装和已有受支持版本升级，符合现有物理插件目录 vf-ops/vf-ops.php。
          - 1.21.1070 到 1.21.1071 的安装、升级、状态保留与回滚：隔离 WordPress Gate PASS；升级前依现有机制备份，失败按正式 1070 ZIP 回滚。
          - 新版本 ZIP SHA-256：423375df5e90d0b76a1ba7f5983f482ad84c8d17e421230d9f5aa502b7b463ad；字节 3533078。
          - 候选 37789714930：PASS；精确测试树 810157a7f5815cd57a48c7a71c90c0b4f101cbde。
          - 限制：没有在 Production 运行 ZIP 上传、扫描、清理、候选包或 WordPress 升级；完整已登录 AJAX 与候选包下载的 OWNER 复验仍待最终验收。Machine PASS 不等于 OWNER PASS。
          - Production 仅由 OWNER 手工升级；发布和分发不代表已安装，也不代表后台已发现版本。
          EOF
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/$ASSET_NAME" --repo "$TARGET_REPOSITORY" --target "$TARGET_SHA" --title "VF Tools Ops V1.21.1071" --notes-file notes.md
          echo FORMAL_RELEASE_CREATED=PASS | tee evidence/release-created.txt
      - name: Remote Release and immutable asset readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          J="$(gh api "repos/$TARGET_REPOSITORY/releases/tags/$RELEASE_TAG")"
          RID="$(jq -r '.id' <<<"$J")"
          AID="$(jq -r --arg n "$ASSET_NAME" '.assets[] | select(.name==$n) | .id' <<<"$J")"
          SIZE="$(jq -r --arg n "$ASSET_NAME" '.assets[] | select(.name==$n) | .size' <<<"$J")"
          test -n "$RID"; test -n "$AID"; test "$SIZE" = "$EXPECTED_BYTES"
          TAG_SHA="$(gh api "repos/$TARGET_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          test "$TAG_SHA" = "$TARGET_SHA"
          mkdir -p readback
          gh release download "$RELEASE_TAG" --repo "$TARGET_REPOSITORY" --pattern "$ASSET_NAME" --dir readback --clobber
          echo "$EXPECTED_SHA256  readback/$ASSET_NAME" | sha256sum -c -
          jq -n --arg release_id "$RID" --arg asset_id "$AID" --arg sha "$EXPECTED_SHA256" --arg tag_sha "$TAG_SHA" --argjson bytes "$EXPECTED_BYTES" '{status:"PASS",release_id:$release_id,asset_id:$asset_id,asset_sha256:$sha,asset_bytes:$bytes,tag_sha:$tag_sha,production:"NOT_TOUCHED",owner_pass:false}' | tee evidence/FINAL_RELEASE_EVIDENCE.json
          echo REMOTE_RELEASE_READBACK=PASS | tee evidence/remote-readback.txt
      - name: Seal Final Formal gate
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          e=Path('evidence')
          keys={'candidate-gate.txt':'SOURCE_CANDIDATE_GATE=PASS','package-gate.txt':'PACKAGE_AND_ROLLBACK_ASSET=PASS','release-created.txt':'FORMAL_RELEASE_CREATED=PASS','remote-readback.txt':'REMOTE_RELEASE_READBACK=PASS'}
          ok=all((e/k).is_file() and v in (e/k).read_text() for k,v in keys.items())
          try: ok=ok and json.loads((e/'FINAL_RELEASE_EVIDENCE.json').read_text())['status']=='PASS'
          except Exception: ok=False
          result={'schema':'vf-s01-c02-1211071-formal-release/v1','status':'PASS' if ok else 'FAIL','source_tree':'810157a7f5815cd57a48c7a71c90c0b4f101cbde','main_sha':'6359a142702ca4cd512dc7468e51cb5f97e5e4dc','candidate_run':37789714930,'production':'NOT_TOUCHED','owner_pass':False}
          (e/'FINAL_EVIDENCE.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(result,ensure_ascii=False))
          if not ok: raise SystemExit(1)
          PY
      - name: Upload formal release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s01-c02-1211071-formal-evidence
          path: evidence/
          retention-days: 30
