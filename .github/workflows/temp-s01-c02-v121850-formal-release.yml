name: S01-C02 V1.21.850 Formal Release

on:
  push:
    branches: [temp/s01-c02-v121850-formal-release]
    paths:
      - '.github/workflows/temp-s01-c02-v121850-formal-release.yml'

permissions:
  contents: read

concurrency:
  group: s01-c02-v121850-formal-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      REPO: llhzx2018/vf-tools-ops
      PRODUCT_COMMIT: 0e6fb809748a3c2b392c13b1c787490ebbeb390d
      TAG: v1.21.850
      VERSION: 1.21.850
      ASSET_NAME: vf-tools-ops_V1.21.850.zip
      EXPECTED_FILES: '943'
      EXPECTED_BYTES: '3422610'
      EXPECTED_SHA: 7a3eb58d5255f27222baf0605f8f95f05a19f188b81997fbcddfeefbfe67ee0d
      EXPECTED_FP: 682e5939fc4f87ce0213c23f28bb2f5e6ce94eb73ef97e2893bf72fcb6428cbb
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Credential authority gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"
          echo 'CREDENTIAL_MODEL=READ_WRITE_SEPARATED'

      - name: Checkout exact Ops source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.PRODUCT_COMMIT }}
          token: ${{ env.READ_TOKEN }}
          path: ops
          fetch-depth: 0
          persist-credentials: false

      - name: Re-run Ops release gates
        working-directory: ops
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_COMMIT"
          grep -Eq '^ \* Version: 1\.21\.850$' vf-ops.php
          grep -Fq "VF_OPS_VERSION', '1.21.850'" vf-ops.php
          find . -type f -name '*.php' -not -path './.git/*' -not -path './tests/*' -not -path './docs/*' -print0 | xargs -0 -n1 php -l >/dev/null
          echo 'OPS_RELEASE_GATE=PASS'

      - name: Rebuild byte-identical Ops candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/ops-release"
          python3 - <<'PY'
          from pathlib import Path
          import fnmatch, hashlib, os, zipfile
          src=Path('ops'); dest=Path(os.environ['RUNNER_TEMP'])/'ops-release'/os.environ['ASSET_NAME']
          def include(rel):
              rel=rel.replace('\\','/'); parts=rel.split('/'); base=parts[-1]
              if any(p in {'.git','.github','_tools','tests','docs','handoff_out'} for p in parts): return False
              if fnmatch.fnmatch(base,'*.zip') or fnmatch.fnmatch(base,'*_repo.tar') or fnmatch.fnmatch(base,'*.tar') or fnmatch.fnmatch(base,'*.download'): return False
              if base in {'query','nul','VF_TASK.json','VF_PROJECT.json','VF_GIT.json','VF_LINKS.json'}: return False
              if fnmatch.fnmatch(base,'P7_*.md') or fnmatch.fnmatch(base,'VF_HANDOFF*') or fnmatch.fnmatch(base,'VF_PROMPT*'): return False
              return True
          rows=[]
          for p in sorted(src.rglob('*'),key=lambda x:x.relative_to(src).as_posix()):
              if not p.is_file(): continue
              rel=p.relative_to(src).as_posix()
              if include(rel): rows.append((rel,p))
          dirs={'vf-tools-ops/'}
          for rel,_ in rows:
              cur='vf-tools-ops'
              for part in rel.split('/')[:-1]: cur += '/' + part; dirs.add(cur + '/')
          with zipfile.ZipFile(dest,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for d in sorted(dirs):
                  zi=zipfile.ZipInfo(d); zi.date_time=(1980,1,1,0,0,0); zi.external_attr=(0o40755<<16)|0x10; z.writestr(zi,b'')
              for rel,p in rows:
                  zi=zipfile.ZipInfo('vf-tools-ops/'+rel); zi.date_time=(1980,1,1,0,0,0); zi.compress_type=zipfile.ZIP_DEFLATED; zi.external_attr=0o100644<<16; z.writestr(zi,p.read_bytes())
          canon=''.join(f'{rel}\0{hashlib.sha256(p.read_bytes()).hexdigest()}\n' for rel,p in rows).encode()
          assert len(rows)==int(os.environ['EXPECTED_FILES'])
          assert dest.stat().st_size==int(os.environ['EXPECTED_BYTES'])
          assert hashlib.sha256(dest.read_bytes()).hexdigest()==os.environ['EXPECTED_SHA']
          assert hashlib.sha256(canon).hexdigest()==os.environ['EXPECTED_FP']
          with zipfile.ZipFile(dest) as z:
              assert z.testzip() is None
              files=[i for i in z.infolist() if not i.is_dir()]
              assert len(files)==943
              assert sorted({i.filename.split('/')[0] for i in files})==['vf-tools-ops']
              assert b'Version: 1.21.850' in z.read('vf-tools-ops/vf-ops.php')
          print('TESTED_ARTIFACT_BYTE_IDENTITY=PASS')
          PY

      - name: Tag-first draft Release transaction, exact readback, publish
        shell: bash
        run: |
          set -Eeuo pipefail
          API="https://api.github.com/repos/$REPO"
          AUTH_READ=(-H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          AUTH_WRITE=(-H "Authorization: Bearer $WRITE_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          ASSET="$RUNNER_TEMP/ops-release/$ASSET_NAME"; RELEASE_ID=''; TAG_CREATED=0
          cleanup_failure(){ rc=$?; if [ "$rc" -ne 0 ]; then [ -z "$RELEASE_ID" ] || curl -sS -X DELETE "${AUTH_WRITE[@]}" "$API/releases/$RELEASE_ID" >/dev/null || true; [ "$TAG_CREATED" != 1 ] || curl -sS -X DELETE "${AUTH_WRITE[@]}" "$API/git/refs/tags/$TAG" >/dev/null || true; fi; exit "$rc"; }
          trap cleanup_failure EXIT
          curl --fail-with-body -sS "${AUTH_WRITE[@]}" "$API/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          python3 - "$RUNNER_TEMP/releases.json" "$TAG" > "$RUNNER_TEMP/stale-drafts.txt" <<'PY'
          import json,sys
          hits=[r for r in json.load(open(sys.argv[1])) if r.get('tag_name')==sys.argv[2]]
          if any(not r.get('draft',False) for r in hits): raise SystemExit('PUBLISHED_RELEASE_ALREADY_EXISTS')
          for r in hits:
              if r.get('draft',False): print(r['id'])
          PY
          while read -r rid; do [ -z "$rid" ] || curl --fail-with-body -sS -X DELETE "${AUTH_WRITE[@]}" "$API/releases/$rid" >/dev/null; done < "$RUNNER_TEMP/stale-drafts.txt"
          TAG_CODE="$(curl -sS -o "$RUNNER_TEMP/tag-preflight.json" -w '%{http_code}' "${AUTH_WRITE[@]}" "$API/git/ref/tags/$TAG")"
          if [ "$TAG_CODE" = 200 ]; then EXISTING_SHA="$(python3 -c 'import json;print(json.load(open("'$RUNNER_TEMP/tag-preflight.json'"))["object"]["sha"])')"; test "$EXISTING_SHA" = "$PRODUCT_COMMIT"; curl --fail-with-body -sS -X DELETE "${AUTH_WRITE[@]}" "$API/git/refs/tags/$TAG" >/dev/null; else test "$TAG_CODE" = 404; fi
          echo 'REMOTE_RELEASE_PREFLIGHT=PASS'
          python3 - "$TAG" "$PRODUCT_COMMIT" > "$RUNNER_TEMP/tag.json" <<'PY'
          import json,sys; print(json.dumps({'ref':'refs/tags/'+sys.argv[1],'sha':sys.argv[2]}))
          PY
          curl --fail-with-body -sS -X POST "${AUTH_WRITE[@]}" -H 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/tag.json" "$API/git/refs" > "$RUNNER_TEMP/tag-response.json"
          TAG_CREATED=1
          test "$(python3 -c 'import json;print(json.load(open("'$RUNNER_TEMP/tag-response.json'"))["object"]["sha"])')" = "$PRODUCT_COMMIT"
          python3 - "$TAG" "$PRODUCT_COMMIT" > "$RUNNER_TEMP/release.json" <<'PY'
          import json,sys
          print(json.dumps({'tag_name':sys.argv[1],'target_commitish':sys.argv[2],'name':'VF Tools Ops V1.21.850','body':'S01-C02 · VF Tools Ops 1.21.850 UI/UX closure. Git/Release PASS does not claim Production, Static, Online or FINAL_ONLINE_PASS.','draft':True,'prerelease':False}))
          PY
          curl --fail-with-body -sS -X POST "${AUTH_WRITE[@]}" -H 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/release.json" "$API/releases" > "$RUNNER_TEMP/release-response.json"
          RELEASE_ID="$(python3 -c 'import json;print(json.load(open("'$RUNNER_TEMP/release-response.json'"))["id"])')"; test -n "$RELEASE_ID"
          UPLOAD_URL="https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=$ASSET_NAME"
          curl --fail-with-body -sS -X POST "${AUTH_WRITE[@]}" -H 'Content-Type: application/zip' --data-binary @"$ASSET" "$UPLOAD_URL" > "$RUNNER_TEMP/asset-response.json"
          ASSET_ID="$(python3 -c 'import json;print(json.load(open("'$RUNNER_TEMP/asset-response.json'"))["id"])')"; test -n "$ASSET_ID"
          test "$(python3 -c 'import json;print(json.load(open("'$RUNNER_TEMP/asset-response.json'"))["size"])')" = "$EXPECTED_BYTES"
          curl --fail-with-body -sS -L -H "Authorization: Bearer $WRITE_TOKEN" -H 'Accept: application/octet-stream' -H 'X-GitHub-Api-Version: 2022-11-28' "$API/releases/assets/$ASSET_ID" -o "$RUNNER_TEMP/remote-$ASSET_NAME"
          REMOTE="$RUNNER_TEMP/remote-$ASSET_NAME"; test "$(stat -c %s "$REMOTE")" = "$EXPECTED_BYTES"; test "$(sha256sum "$REMOTE" | awk '{print $1}')" = "$EXPECTED_SHA"
          python3 - "$REMOTE" <<'PY'
          import sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              assert z.testzip() is None
              files=[i for i in z.infolist() if not i.is_dir()]
              assert len(files)==943
              assert sorted({i.filename.split('/')[0] for i in files})==['vf-tools-ops']
              assert b'Version: 1.21.850' in z.read('vf-tools-ops/vf-ops.php')
          PY
          echo '{"draft":false,"prerelease":false}' > "$RUNNER_TEMP/publish.json"
          curl --fail-with-body -sS -X PATCH "${AUTH_WRITE[@]}" -H 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/publish.json" "$API/releases/$RELEASE_ID" > "$RUNNER_TEMP/published.json"
          python3 - "$RUNNER_TEMP/published.json" "$TAG" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1])); assert x['tag_name']==sys.argv[2] and x['draft'] is False and x['prerelease'] is False
          PY
          test "$(curl --fail-with-body -sS "${AUTH_READ[@]}" "$API/git/ref/tags/$TAG" | python3 -c 'import json,sys;print(json.load(sys.stdin)["object"]["sha"])')" = "$PRODUCT_COMMIT"
          test "$(curl --fail-with-body -sS "${AUTH_READ[@]}" "$API/branches/main" | python3 -c 'import json,sys;print(json.load(sys.stdin)["commit"]["sha"])')" = "$PRODUCT_COMMIT"
          trap - EXIT
          echo "FORMAL_RELEASE_ID=$RELEASE_ID"
          echo "FORMAL_ASSET_ID=$ASSET_ID"
          echo 'FORMAL_RELEASE=PASS'
          echo 'REMOTE_ASSET_EXACT_READBACK=PASS'
          echo 'TESTED_ARTIFACT_EQUALS_DELIVERED_ARTIFACT=PASS'
