name: P02 V2.5.83 Navigation Safety R1

on:
  push:
    branches:
      - run/p02-v2583-navigation-safety-r1-20260922
    paths:
      - '.github/workflows/p02-v2583-navigation-safety-r1.yml'

permissions:
  contents: read

jobs:
  navigation-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact P02 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: ed335f9d11215abeff1e95bddeadc89f7febc119
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product

      - name: Install runtime and Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-zip sqlite3 unzip curl
          cd product
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Focused source and unit gate
        shell: bash
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "ed335f9d11215abeff1e95bddeadc89f7febc119"
          test "$(cat VERSION)" = "2.5.83"
          python3 scripts/generate-source-manifest.py
          git diff --exit-code -- SOURCE_MANIFEST.json SOURCE_MANIFEST.txt
          node --check public/assets/app.js
          node tests/unit/p02_v2583_navigation_safety.mjs
          while IFS= read -r cmd; do
            test -n "$cmd"
            eval "$cmd"
          done < <(awk '/run: node tests\/unit\//{sub(/^.*run: /,""); print}' .github/workflows/repository-health.yml)
          bash scripts/verify-repository.sh
          echo P02_V2583_NAVIGATION_SAFETY_SOURCE=PASS

      - name: Real runtime and focused Chromium regression
        shell: bash
        working-directory: product
        env:
          TEST_PASSWORD: VF-P02-V2583-${{ github.run_id }}!
          EVIDENCE_DIR: ${{ runner.temp }}/p02-v2583-navigation-safety
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          bash scripts/maintenance-reverify.sh

          RUN_ROOT="${RUNNER_TEMP}/p02-v2583-focused-${GITHUB_RUN_ID}"
          SITE="$RUN_ROOT/site"
          COOKIE="$RUN_ROOT/cookies.txt"
          PORT=18083
          BASE_URL="http://127.0.0.1:$PORT"
          mkdir -p "$RUN_ROOT"
          bash scripts/build-deploy-tree.sh "$SITE"
          [[ "$(tr -d '\r\n' < "$SITE/VERSION.txt")" == "2.5.83" ]]

          php -d display_errors=0 -S "127.0.0.1:$PORT" -t "$SITE" >"$RUN_ROOT/php-server.log" 2>&1 &
          SERVER_PID=$!
          cleanup(){ kill "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for _ in $(seq 1 80); do
            curl -fsS "$BASE_URL/setup.php" >/dev/null 2>&1 && break
            sleep 0.25
          done
          kill -0 "$SERVER_PID"

          curl -fsS -c "$COOKIE" "$BASE_URL/setup.php" > "$RUN_ROOT/setup.html"
          SETUP_CSRF="$(python3 -c 'import html,re,sys; text=open(sys.argv[1],encoding="utf-8").read(); match=re.search(r"name=\"setup_csrf\" value=\"([^\"]+)\"",text); assert match, "setup csrf missing"; print(html.unescape(match.group(1)))' "$RUN_ROOT/setup.html")"
          STATUS="$(curl -sS -o "$RUN_ROOT/setup-post.html" -w '%{http_code}' -b "$COOKIE" -c "$COOKIE" -H "Origin: $BASE_URL" --data-urlencode "setup_csrf=$SETUP_CSRF" --data-urlencode "password=$TEST_PASSWORD" --data-urlencode "password_confirm=$TEST_PASSWORD" "$BASE_URL/setup.php")"
          [[ "$STATUS" == "303" ]]

          export VF_UX_E2E_BASE_URL="$BASE_URL"
          export VF_UX_E2E_PASSWORD="$TEST_PASSWORD"
          export VF_UX_E2E_VERSION="2.5.83"
          node tests/e2e/p02_v2583_navigation_safety.mjs | tee "$EVIDENCE_DIR/browser-v2583-navigation-safety.log"
          grep -Fx 'P02_V2583_NAVIGATION_SAFETY_BROWSER=PASS' "$EVIDENCE_DIR/browser-v2583-navigation-safety.log"
          echo P02_V2583_NAVIGATION_SAFETY_BROWSER_GATE=PASS

      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p02-v2583-navigation-safety-r1
          path: ${{ runner.temp }}/p02-v2583-navigation-safety
          if-no-files-found: ignore
          retention-days: 7
