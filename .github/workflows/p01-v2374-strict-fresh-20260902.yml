name: P01 V2.37.4 Strict Fresh
on:
  push:
    branches: [release/p01-v2374-hotfix-20260902]
    paths: [.github/workflows/p01-v2374-strict-fresh-20260902.yml]
permissions:
  actions: read
  contents: read
jobs:
  strict-fresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.11'}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: release/p01-v2374-hotfix-20260902, path: runner}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: release/p01-v2373-strict-publish-20260902
          path: prior
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.37.3
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: production
      - name: Build V2.37.4 strict script from proven V2.37.3 strict harness
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('prior/scripts/p01_v2373_strict_fresh.sh').read_text(encoding='utf-8')
          s=s.replace('ARTIFACT_ID=9835093365','ARTIFACT_ID=9836483545')
          s=s.replace('ARTIFACT_RUN=33600796537','ARTIFACT_RUN=33604600209')
          s=s.replace('FORMAL_SOURCE=cec95e310771feb6813a51c7ee3340884295ee38','FORMAL_SOURCE=4532e6443805cefe141efc1f70f1689e532450b9')
          s=s.replace('RUNTIME_TREE=e56459ebadc120c749cc5336821d762001db5218','RUNTIME_TREE=369f24a5320b9c7ebbb950a06c2711b8ca3b4f93')
          s=s.replace('ARTIFACT_SHA=1ea846d2d30b6be3daf46f9cc0cfb9185d5fd6d22bd63569547a8d203c67be1d','ARTIFACT_SHA=0d63e00ac8b57b3b1a9ab7bfe8cdab1d419b59a5e3382039ce2809954995e80d')
          s=s.replace('2.37.2','__SRC__').replace('2.37.3','2.37.4').replace('__SRC__','2.37.3')
          s=s.replace('V2.37.3','V2.37.4').replace('v2373','v2374').replace('V2373','V2374')
          s=s.replace('mkdir -p candidate\ncp -a "$FRESH" candidate/src\n','mkdir -p candidate/src\nunzip -q "$FULL" -d candidate/src\n')
          s=s.replace('runner/scripts/p01_v2374_candidate_iyf_e2e.sh','prior/scripts/p01_v2373_candidate_iyf_e2e.sh')
          s=s.replace("assert any(x['record']['mime']=='image/gif' for x in rows), rows\n",'')
          s=s.replace('vf-cover-retry:v4:','vf-cover-retry:v5:')
          marker="grep -F \"'image/gif'=>'gif'\" \"$FRESH/app/ResourceCoverCache.php\" >/dev/null\n"
          extra="grep -F 'image/webp,image/png,image/jpeg,image/gif,image/*;q=0.8,*/*;q=0.1' \"$FRESH/app/ResourceCoverCache.php\" >/dev/null\n! grep -F 'image/avif,image/webp,image/png,image/jpeg,image/*;q=0.8,*/*;q=0.1' \"$FRESH/app/ResourceCoverCache.php\" >/dev/null\n"
          assert marker in s
          s=s.replace(marker,marker+extra)
          Path('/tmp/p01_v2374_strict_fresh.sh').write_text(s,encoding='utf-8')
          PY
      - name: Frozen Artifact Strict Fresh
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: bash /tmp/p01_v2374_strict_fresh.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-v2374-strict-fresh-${{ github.run_id }}
          path: /tmp/p01-v2374-strict-fresh-evidence
          if-no-files-found: warn
          retention-days: 90
