name: TEMP P01 StartNew locked dependencies into private dev branch
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p01-startnew-lockfiles-temporary.yml

permissions:
  contents: read
  actions: read

jobs:
  pin-exact-locks:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/p01-startnew-lockfiles-20261122'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      SESSION_DRIVER: array
      CACHE_STORE: array
    steps:
      - name: Checkout temporary public orchestration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact private development source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-startnew
          ref: f472617bd1d99a20b83f5974b564d27aa580f9bd
          path: target
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Retrieve only exact known successful machine dependency locks
        uses: actions/download-artifact@v4
        with:
          name: p01-startnew-r02-locks-mysql
          repository: llhzx2018/core-free-runner-public
          run-id: 44983856053
          github-token: ${{ github.token }}
          path: target
      - name: PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_mysql, dom, xml, curl, zip, openssl
          coverage: none
      - name: Node22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Regenerate and verify exact dependency locks (no write credentials)
        shell: bash
        working-directory: target
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = f472617bd1d99a20b83f5974b564d27aa580f9bd
          test "$(sha256sum composer.lock | cut -d' ' -f1)" = c0c95088c16d30a099b6fc41c435b59a7415d635ba3390ada885cdfd4431037e
          test "$(sha256sum package-lock.json | cut -d' ' -f1)" = ad33a20da97b629c069ce6e0525db8b9ed228ec613164ec2bc3fd0504f74c58f
          if ! composer install --no-interaction --no-audit --no-progress --prefer-dist >"$RUNNER_TEMP/p01-lock-build.log" 2>&1; then
            echo P01_LOCK_COMPOSER_INSTALL=FAIL
            grep -Ei 'error|problem|failed|cannot|could not' "$RUNNER_TEMP/p01-lock-build.log" | tail -n 12 || true
            exit 1
          fi
          if ! npm ci --no-audit --no-fund >>"$RUNNER_TEMP/p01-lock-build.log" 2>&1; then
            echo P01_LOCK_NPM_CI=FAIL
            grep -Ei 'npm err|error|failed|cannot|could not' "$RUNNER_TEMP/p01-lock-build.log" | tail -n 12 || true
            exit 1
          fi
          npm run typecheck >>"$RUNNER_TEMP/p01-lock-build.log" 2>&1
          npm run build >>"$RUNNER_TEMP/p01-lock-build.log" 2>&1
          cp .env.example .env
          php artisan key:generate --force >>"$RUNNER_TEMP/p01-lock-build.log" 2>&1
          if ! php artisan test >>"$RUNNER_TEMP/p01-lock-build.log" 2>&1; then
            echo P01_LOCK_LARAVEL_TEST=FAIL
            grep -Ei 'error|failed|exception|sqlstate' "$RUNNER_TEMP/p01-lock-build.log" | tail -n 14 || true
            exit 1
          fi
          test -s composer.lock
          test -s package-lock.json
          sha256sum composer.lock package-lock.json
          echo P01_LOCKFILES_REPEATABLE_DEPENDENCY_TEST=PASS
      - name: Commit only two verified lockfiles to existing dev branch
        working-directory: target
        shell: bash
        env:
          WF_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          if [ -z "$WF_WRITE_TOKEN" ]; then
            echo LOCKFILE_BRANCH_WRITE=BLOCKED_MISSING_REGISTERED_WRITE_CAPABILITY
            exit 1
          fi
          cat >"$RUNNER_TEMP/p01-askpass.sh" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf 'x-access-token';;
            *Password*) printf '%s' "$WF_WRITE_TOKEN";;
            *) exit 1;;
          esac
          ASKPASS
          chmod 700 "$RUNNER_TEMP/p01-askpass.sh"
          export GIT_ASKPASS="$RUNNER_TEMP/p01-askpass.sh"
          export GIT_TERMINAL_PROMPT=0
          ACTUAL="$(git ls-remote origin refs/heads/feat/p01-new-laravel-foundation | cut -f1)"
          test "$ACTUAL" = f472617bd1d99a20b83f5974b564d27aa580f9bd || {
            echo LOCKFILE_BRANCH_WRITE=STOP_HEAD_CHANGED_OR_PERMISSION
            exit 1
          }
          git add -- composer.lock package-lock.json
          EXPECTED="$(printf 'composer.lock\npackage-lock.json')"
          ACTUAL_FILES="$(git diff --cached --name-only)"
          test "$ACTUAL_FILES" = "$EXPECTED" || {
            echo LOCKFILE_BRANCH_WRITE=STOP_UNEXPECTED_FILES
            exit 1
          }
          git -c user.name='VF Dependency Lock Validation' -c user.email='github-actions[bot]@users.noreply.github.com' commit -m 'build(S1-R02): add real verified Composer and npm lockfiles'
          NEW_SHA="$(git rev-parse HEAD)"
          git push origin HEAD:refs/heads/feat/p01-new-laravel-foundation >"$RUNNER_TEMP/p01-write.log" 2>&1 || {
            echo LOCKFILE_BRANCH_WRITE=BLOCKED_SCOPE_OR_FAST_FORWARD
            exit 1
          }
          test -n "$NEW_SHA"
          echo "P01_LOCKFILES_COMMITTED_SHA=$NEW_SHA"
          echo LOCKFILE_BRANCH_WRITE=PASS
      - name: Always erase private checkout and transient credentials
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- target
          rm -f "$RUNNER_TEMP/p01-lock-build.log" "$RUNNER_TEMP/p01-write.log" "$RUNNER_TEMP/p01-askpass.sh"
          test ! -e target
          echo P01_LOCKFILE_PRIVATE_CLEANUP=PASS
