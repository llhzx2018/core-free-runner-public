name: TEMP P01 StartNew locked source & UX inventory three-engine gate
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p01-startnew-lockfiles-temporary.yml
permissions:
  contents: read
jobs:
  s1-exact-source:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/p01-startnew-lockfiles-20261122'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [sqlite, mysql, mariadb]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: synthetic_startnew
          MYSQL_DATABASE: p01_startnew
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping --silent -h 127.0.0.1 -uroot -psynthetic_startnew"
          --health-interval=10s --health-timeout=5s --health-retries=20
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: synthetic_startnew
          MARIADB_DATABASE: p01_startnew
        ports: [3307:3306]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      DB_CONNECTION: ${{ matrix.engine == 'sqlite' && 'sqlite' || 'mysql' }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.engine == 'mariadb' && '3307' || '3306' }}
      DB_DATABASE: ${{ matrix.engine == 'sqlite' && ':memory:' || 'p01_startnew' }}
      DB_USERNAME: root
      DB_PASSWORD: synthetic_startnew
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    steps:
      - name: Checkout public orchestration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact private development SHA transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-startnew
          ref: fe5221862e3ae497233372a5468b28712efebcc1
          path: target
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Prepare PHP8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_mysql, dom, xml, curl, zip, openssl
          coverage: none
      - name: Prepare Node22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: All S1 source and negative guards bound to exact Git SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = fe5221862e3ae497233372a5468b28712efebcc1
          (
            cd target
            test "$(cat VERSION)" = 0.1.0-dev
            python3 scripts/check_bootstrap.py
            python3 scripts/check_visual_identity.py
            python3 scripts/check_delivery_plan.py
            python3 scripts/check_dependency_lock.py
            python3 scripts/check_legacy_ui_inventory.py
            python3 -m unittest discover -s tests -p 'test_*.py' -v
            php tests/evolution/test_second_module.php
            find app bootstrap config database routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          ) > "$RUNNER_TEMP/p01-s1-static.log" 2>&1 || {
            echo P01_S1_SOURCE_AND_DENIAL=FAIL
            grep -E 'FAIL|Error|Exception|AssertionError' "$RUNNER_TEMP/p01-s1-static.log" | tail -n 18 || true
            exit 1
          }
          echo P01_S1_SOURCE_AND_DENIAL=PASS
      - name: Install pinned Composer and npm assets without version resolution
        shell: bash
        working-directory: target
        run: |
          set -Eeuo pipefail
          (
            composer install --no-interaction --no-progress --prefer-dist
            npm ci --no-audit --no-fund
            npm run typecheck
            npm run build
          ) > "$RUNNER_TEMP/p01-s1-build.log" 2>&1 || {
            echo P01_S1_PINNED_STACK=FAIL
            grep -Ei 'error|failed|cannot|could not|problem' "$RUNNER_TEMP/p01-s1-build.log" | tail -n 18 || true
            exit 1
          }
          echo P01_S1_PINNED_STACK=PASS
      - name: Native independent engine migration and synthetic M01 writes
        shell: bash
        working-directory: target
        run: |
          set -Eeuo pipefail
          (
            cp .env.example .env
            php artisan key:generate --force
            if [ "$DB_CONNECTION" = sqlite ]; then
              touch database/runner.sqlite
              export DB_DATABASE="$(pwd)/database/runner.sqlite"
            fi
            php artisan migrate:fresh --force
            php artisan tinker --execute='
              $cat = \App\Modules\Navigation\Domain\Category::query()->create(["title"=>"Synthetic"]);
              $url = "https://example.org/a?ref=A%2FB&b=Z%2B1";
              $link = \App\Modules\Navigation\Domain\Link::query()->create(["title"=>"Synthetic","url"=>$url,"category_id"=>$cat->id]);
              if ($link->fresh()->url !== $url) throw new \RuntimeException("changed URL");
              if ($link->fresh()->visibility !== "private") throw new \RuntimeException("private default");
              $link->delete();
              if (! $link->trashed()) throw new \RuntimeException("soft delete");
            '
            php artisan test
          ) > "$RUNNER_TEMP/p01-s1-native.log" 2>&1 || {
            echo P01_S1_NATIVE=FAIL
            grep -Ei 'error|failed|exception|sqlstate|not found' "$RUNNER_TEMP/p01-s1-native.log" | tail -n 18 || true
            exit 1
          }
          echo "P01_S1_NATIVE=PASS ENGINE=${{ matrix.engine }}"
      - name: Always clean transient private files and logs
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- target
          rm -f "$RUNNER_TEMP/p01-s1-static.log" "$RUNNER_TEMP/p01-s1-build.log" "$RUNNER_TEMP/p01-s1-native.log"
          test ! -e target
          echo P01_S1_PRIVATE_CLEANUP=PASS
