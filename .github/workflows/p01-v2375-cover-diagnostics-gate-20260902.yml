name: P01 V2.37.5 Cover Diagnostics Candidate
on:
  push:
    branches: [release/p01-v2375-cover-diagnostics-20260902]
    paths:
      - .github/workflows/p01-v2375-cover-diagnostics-gate-20260902.yml
      - scripts/p01_v2375_cover_diagnostics_apply.py
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_BRANCH: hotfix/p01-v2375-cover-diagnostics-20260902
      BASE: 58ed50f2d56afc04cfff467075fc7025306afeb5
    steps:
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: release/p01-v2375-cover-diagnostics-20260902
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.PRODUCT_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Fresh fence
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          test "$(git rev-parse HEAD)" = "$BASE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(cat VERSION)" = 2.37.4
          grep -F "define('VF_VERSION', '2.37.4')" src/app/bootstrap.php >/dev/null
          test -z "$(git status --porcelain)"
      - name: Apply scoped candidate
        run: python3 runner/scripts/p01_v2375_cover_diagnostics_apply.py
      - name: Runtime validation
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l product/src/app/FunctionalWorkspaceShell.php
          node --check product/src/assets/workspace.js
          cd product
          git diff --check
          actual=$(git diff --name-only | sort)
          expected=$(printf '%s\n' src/app/FunctionalWorkspaceShell.php src/assets/surface-workspace.css src/assets/workspace.js | sort)
          test "$actual" = "$expected"
          test "$(cat VERSION)" = 2.37.4
          grep -F 'data-cover-refresh-id' src/app/FunctionalWorkspaceShell.php >/dev/null
          grep -F 'data-cover-diagnostic' src/app/FunctionalWorkspaceShell.php >/dev/null
          grep -F 'vf-cover-retry:v6:${id}' src/assets/workspace.js >/dev/null
          grep -F "const refreshCoverBatch=async(batch,manual=false)=>" src/assets/workspace.js >/dev/null
          grep -F "button=e.target.closest?.('[data-cover-refresh-id]')" src/assets/workspace.js >/dev/null
          grep -F "coverDiagnostic(id,item.success?'':error)" src/assets/workspace.js >/dev/null
          grep -F '.vf-cover-diagnostic[hidden]{display:none}' src/assets/surface-workspace.css >/dev/null
          ! git diff --name-only | grep -Eq '(^|/)(VERSION|VERSION.txt|migrations|schema)'
      - name: Commit candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add src/app/FunctionalWorkspaceShell.php src/assets/workspace.js src/assets/surface-workspace.css
          git commit -m 'fix(P01): expose automatic cover failures'
          git push origin "HEAD:$PRODUCT_BRANCH"
          printf 'P01_V2375_COVER_DIAGNOSTICS_CANDIDATE=PASS\nCANDIDATE=%s\nSCOPE=3_FILES\nVERSION_UNCHANGED=2.37.4\nOWNER_PRODUCTION_WRITE=NO\n' "$(git rev-parse HEAD)"
