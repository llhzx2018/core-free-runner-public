name: S01-C01 layout formal release
on:
  push:
    branches: [task/s01-c01-layout-13585-formal]
permissions:
  contents: read
  actions: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_REPO: 'llhzx2018/vf-tools-theme'
      TARGET_VERSION: '1.35.85'
      TARGET_SHA: 'f68064aa655eb17ab2fa5daf162ecc30016f7156'
      TARGET_TREE: '8b61c3061c92e77a3723580194b396949a87b0f5'
      SOURCE_VERSION: '1.35.84'
      BASE_SHA: 'a3a446775488963556c90dd75801bc6b72d05d70'
      CANDIDATE_RUN: '37225394426'
      CANDIDATE_SHA: 'fc483276c4f6c0b3877d4b5e7436a359ac68cb88'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runner
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Reverse verify exact tested tree and rebuilt bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$CANDIDATE_RUN --jq .conclusion)" = success
          gh run download "$CANDIDATE_RUN" --repo llhzx2018/core-free-runner-public --name "s01-c01-layout-candidate-$CANDIDATE_RUN" --dir tested
          python3 - <<'PYREVERSE'
          import json,pathlib,os
          t=json.loads(pathlib.Path('tested/FINAL_EVIDENCE.json').read_text())
          assert t['status']=='PASS' and t['source_sha']==os.environ['CANDIDATE_SHA'] and t['source_tree']==os.environ['TARGET_TREE'] and t['version']==os.environ['TARGET_VERSION']
          for k in ['upgrade','source_rollback','wordpress_browser','security_boundary','frozen_shell_header_menu','recovery_data','baseline_reproduced']:assert t[k]=='PASS',k
          assert t['layout_viewports']==6 and t['recovery_data_check_count']==42
          live=json.loads(pathlib.Path('tested/live-browser.json').read_text());data=json.loads(pathlib.Path('tested/recovery-data.json').read_text());baseline=json.loads(pathlib.Path('tested/baseline.json').read_text())
          required=['all_20_context_fields_save_reload','hidden_inactive_fields_preserved','all_20_frontend_consumers','module_disable_enable_preserves_fields','module_mouse_keyboard_sort_save','busy_controls_navigation_structure_isolated','network_input_retained_retry','invalid_json_input_retained_retry','incomplete_input_retained_retry','http_input_retained_retry','timeout_input_retained_retry','repeated_conflict_no_overwrite','nonce_guest_rejected','native_post_canonical_save','context_switch_cancel_keeps_draft','context_picker_groups_search_escape','recommended_order_save','locked_system_structure']
          assert set(t['layout_functional_checks'])==set(required) and t['layout_functional_checks']==live['functional'] and all(live['functional'][k]=='PASS' for k in required)
          assert all(baseline[k]=='REPRODUCED' for k in ['title_extra_indent','incomplete_response_false_success','busy_edit_marked_saved'])
          assert len(live['checks'])==6 and all(c['control_interactions']=='PASS' and c['frozen_header_parity']=='PASS' for c in live['checks']) and not live['errors']
          contexts=['home','basic_page','about_page','contact_page','tool_hub','tool','blog_index','article_detail','guide_index','guide_detail','problem_index','problem_detail','faq_page','glossary_index','glossary_detail','archive_list','search','html_sitemap','not_found','legal']
          assert t['layout_contexts']==live['contexts'] and {c['context'] for c in live['contexts']}==set(contexts) and all(c['status']=='PASS' and c['editable_controls']>0 and c['consumers']==20 for c in live['contexts'])
          assert data['status']=='PASS' and len(data['checks'])==42 and all(v=='PASS' for v in data['checks'].values())
          assert t['owner_preview_runtime']=='N_A' and t['owner_real_use']=='POST_PRODUCTION_REQUIRED' and t['production']=='NOT_EXECUTED'
          PYREVERSE
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          cp -a runner/lanes/s01-c01-layout-13585 lane
          python3 lane/build.py
          python3 - <<'PY'
          import json,pathlib
          tested=json.loads(pathlib.Path('tested/FINAL_EVIDENCE.json').read_text()); built=json.loads(pathlib.Path('proof/identity.json').read_text())
          for key in ['asset','asset_bytes','asset_sha256','source_tree','version']: assert tested[key]==built[key],key
          PY
      - name: Publish private formal Release and exact remote readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          ASSET="vf-tools-theme_V${TARGET_VERSION}.zip"; TAG="v$TARGET_VERSION"
          cat > /tmp/release-notes.md <<EOF
          VF Tools Theme V$TARGET_VERSION

          页面布局：标题与正文统一对齐导航内容宽度；修正重复内缩、表单留白、字号及手机排版。模块支持上移、下移、停用和 Alt+方向键排序；停用保留字段设置。
          保存期间锁定编辑、页型切换和结构修改，防止未保存输入被误标成功。必须取得完整权威回读与消费者验证才显示保存成功；网络、超时、残缺响应保留输入和原 revision，允许重试。
          仅布局view/CSS/JS、版本三文件及验收矩阵，共7文件；壳/头部/主菜单、持久化服务、权限与升级机制保持原字节。
          Exact candidate Run: $CANDIDATE_RUN。三个旧版问题复现；20种页型字段保存与重载、18项实际功能流程及六宽度检查通过。隔离真实WordPress42项数据回归与$SOURCE_VERSION→$TARGET_VERSION原生升级/回退/再应用通过。
          Production由OWNER手工升级；独立Preview Runtime按SSOT为N_A，机器与Assistant检查不代表OWNER真实使用PASS。
          Exact promoted source: $TARGET_SHA; tree: $TARGET_TREE。
          EOF
          if gh release view "$TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            test "$(gh api repos/$TARGET_REPO/git/ref/tags/$TAG --jq .object.sha)" = "$TARGET_SHA"
          else
            gh release create "$TAG" "proof/$ASSET" --repo "$TARGET_REPO" --target "$TARGET_SHA" --title "VF Tools Theme V$TARGET_VERSION" --notes-file /tmp/release-notes.md
          fi
          gh api "repos/$TARGET_REPO/releases/tags/$TAG" > proof/remote-release.json
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/$TAG --jq .object.sha)" = "$TARGET_SHA"
          mkdir readback
          gh release download "$TAG" --repo "$TARGET_REPO" --pattern "$ASSET" --dir readback
          cmp "proof/$ASSET" "readback/$ASSET"
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('proof'); m=json.loads((p/'identity.json').read_text());r=json.loads((p/'remote-release.json').read_text());t=json.loads(pathlib.Path('tested/FINAL_EVIDENCE.json').read_text());assert not r['draft'] and not r['prerelease'];a=[a for a in r['assets'] if a['name']==m['asset']];assert len(a)==1 and a[0]['size']==m['asset_bytes'] and a[0]['digest']=='sha256:'+m['asset_sha256'];m.update(release_id=r['id'],asset_id=a[0]['id'],released_at=r['published_at'],runtime_files=t['runtime_files'],runtime_fingerprint=t['runtime_fingerprint'],candidate_run=t['candidate_run'],formal_release='PASS',remote_readback='PASS',distribution='NOT_EXECUTED',production='NOT_EXECUTED');(p/'RELEASE_RECEIPT.json').write_text(json.dumps(m,indent=2));print(json.dumps(m))
          PY
      - name: Public-safe receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c01-layout-release-${{ github.run_id }}
          path: proof/RELEASE_RECEIPT.json
          retention-days: 30
          if-no-files-found: error
      - name: Private workspace cleanup
        if: always()
        run: rm -rf target readback proof/*.zip
