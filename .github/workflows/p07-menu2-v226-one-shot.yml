name: P07 menu 2 V2.2.6 one-shot formal release
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-menu2-v226-one-shot.yml'
permissions:
  contents: read
jobs:
  release:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      github.event.pull_request.title == 'release(P07): restore full menu2 VPS V2.2.6'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout canonical public distribution main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Exact release gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '642dd67d452fea48f857fa020328431ec9b96521'
          test "$(cat dist/p07/0.1.0/overlay/BUILD_ID)" = '0.1.0-release84'
          f='experiments/p07-vps-audit-v226-r1.sh'
          bash -n "$f"
          test "$(NO_COLOR=1 bash "$f" --version | awk '{print $NF}')" = 'V2.2.6'
          test "$(NO_COLOR=1 bash "$f" --build-id)" = '2.2.6-rc1-full-bounded'
          test "$(sha256sum "$f" | awk '{print $1}')" = 'f40a1ac0ee22087fcc200ae63afd75960dd7c8b8d6775babb90d52f8c365824d'
          grep -Fq 'VPS_AUDIT_EXPECTED="V2.2.6"' installers/p07-toolbox.sh
          grep -Fq 'VPS_AUDIT_BUILD_EXPECTED="2.2.6-rc1-full-bounded"' installers/p07-toolbox.sh
          grep -Fq 'VPS_AUDIT_SHA256="f40a1ac0ee22087fcc200ae63afd75960dd7c8b8d6775babb90d52f8c365824d"' installers/p07-toolbox.sh
          grep -Fq 'VPS_AUDIT_URL="https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/affb2b86acda5104dfec67dd75870021fbfa458b/experiments/p07-vps-audit-v226-r1.sh"' installers/p07-toolbox.sh
          bash "$f" --help | grep -Fq '全球节点及中国大陆网络测速'
          bash "$f" --help | grep -Fq '三网回程'
          bash "$f" --help | grep -Fq '增强 fio'
          for id in 37741674528 37741674610 37741674590 37741674582 37741674467 37741674552 37741674595 37741674589; do
            test "$(gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$id" --jq .head_sha)" = '5a40b0648d5a36511fc6177f9f1da71dd8b88b78'
            test "$(gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$id" --jq .conclusion)" = success
          done
          echo P07_MENU2_FULL_RESTORATION_EXACT_GATE=PASS
      - name: Publish formal verified menu 2 full-test restoration
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          repo='llhzx2018/core-free-runner-public'
          tag='p07-v0.1.0-release84-menu2-v226'
          target='642dd67d452fea48f857fa020328431ec9b96521'
          if gh release view "$tag" -R "$repo" >/dev/null 2>&1; then
            test "$(gh release view "$tag" -R "$repo" --json targetCommitish --jq .targetCommitish)" = "$target"
          else
            gh release create "$tag" -R "$repo" --target "$target" \
              --title 'P07 · 菜单 2 完整测速恢复 V2.2.6' \
              --notes '恢复原版完整 VPS 验机：全球及大陆网络测速、三网回程、增强 fio 磁盘、CPU、4K 同步写、资源限制及中文报告。默认完整检测，不增加二级菜单；快速模式仅 --quick 可选。新增每 10 秒可见进度、12 分钟整体保护、退出清理、CPU/IO 数据缺失时拒绝虚假 PASS。线上其他菜单和 Source build release84 均未更改。公共独立 Machine Gate 8/8 PASS。Production OWNERSHIP 仍待用户验收。' \
              --latest=false
          fi
          test "$(gh release view "$tag" -R "$repo" --json tagName --jq .tagName)" = "$tag"
          echo P07_MENU2_FULL_V226_FORMAL_RELEASE=PASS
