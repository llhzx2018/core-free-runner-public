name: P07 #293 Existing Imported Laravel DB No-Reimport Recovery Exact Source
on:
  pull_request:
    paths: ['.github/workflows/p07-pr293-existing-import-recovery.yml']
permissions:
  contents: read
jobs:
  p07-one-shot-recovery:
    if: ${{ github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact P07 candidate private source ephemerally
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 56ae62524e6cac88e9e382c5216f358c43829d5f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p07-exact
          fetch-depth: 1
      - name: Execute one-pass bounded synthetic failed-import recovery
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd p07-exact
          test "$(git rev-parse HEAD)" = 56ae62524e6cac88e9e382c5216f358c43829d5f
          export PYTHONDONTWRITEBYTECODE=1
          bash -n bin/vfops-migrate-ui
          python3 -B - <<'PY'
          import ast
          from pathlib import Path
          for file in ('lib/migration_failed_laravel_recovery.py', 'lib/server_migration_pull.py', 'tests/test_migration_failed_laravel_recovery.py'):
              ast.parse(Path(file).read_text(encoding='utf-8'), filename=file)
          print('P07_ONE_SHOT_RECOVERY_SYNTAX_PASS')
          PY
          python3 -B -m unittest -q tests.test_migration_failed_laravel_recovery tests.test_migration_failed_prepare_audit
          python3 -B lib/server_migration_pull.py recover-failed-laravel-import --help | grep -F -- '--migration-id'
          echo 'P07_NO_SQL_REIMPORT_FAILED_LARAVEL_RECOVERY_SYNTHETIC_PASS'
      - name: Always clean temporary private checkout
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- p07-exact
          echo 'P07_SOURCE_WORKSPACE_CLEANUP_DONE'
