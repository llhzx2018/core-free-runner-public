name: P01 V2.24 Candidate Authority Closure
on:
  push:
    branches: [task/p01-v222-multi-surface-gate-20260828]
    paths:
      - '.github/workflows/p01-v224-candidate-authority-closure-20260828.yml'
      - 'scripts/p01_v224_candidate_docs.py'
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: task/p01-v222-multi-surface-gate-20260828
          path: runner
      - name: Clone exact docs branch
        env:
          TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone --branch docs/p01-v224-ux-candidate-closure-20260828 "https://x-access-token:${TOKEN}@github.com/llhzx2018/vf-start.git" p01
          test "$(git -C p01 rev-parse HEAD)" = "4a064d7ea34998b4f8103d23e96b2e10be46267c"
      - name: Apply authority closure
        run: |
          set -Eeuo pipefail
          cd p01
          python3 ../runner/scripts/p01_v224_candidate_docs.py
          for f in CHANGELOG.md README.md docs/README.md docs/authority/CURRENT.md docs/authority/RPD.md docs/authority/SSOT.md docs/authority/ACCEPTANCE_MATRIX.md docs/architecture/P01_MULTI_SURFACE_ARCHITECTURE.md docs/evidence/P01_V2.24.0_UX_UI_CANDIDATE_20260828.md; do sed -i 's/[[:blank:]]\+$//' "$f"; done
          python3 -m json.tool VF_PROJECT.json >/dev/null
          grep -F 'Owner Production Runtime: V2.23.0' docs/authority/CURRENT.md
          grep -F 'UI Audit Fix Machine + Screenshots: 33153514954 / PASS' docs/authority/CURRENT.md
          grep -F 'V2.24.0 UX/UI Candidate Evidence' README.md docs/README.md
          test -f docs/evidence/P01_V2.24.0_UX_UI_CANDIDATE_20260828.md
      - name: Commit and push docs closure
        env:
          TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          cd p01
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add CHANGELOG.md README.md VF_PROJECT.json docs/README.md docs/authority/CURRENT.md docs/authority/RPD.md docs/authority/SSOT.md docs/authority/ACCEPTANCE_MATRIX.md docs/architecture/P01_MULTI_SURFACE_ARCHITECTURE.md docs/evidence/P01_V2.24.0_UX_UI_CANDIDATE_20260828.md
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'docs: close P01 V2.24 UX UI candidate authority'
          git push "https://x-access-token:${TOKEN}@github.com/llhzx2018/vf-start.git" HEAD:docs/p01-v224-ux-candidate-closure-20260828
