name: S01 Theme exact formal release
on:
  push:
    branches: [task/s01-theme210-progress-20261027]
    paths: ['.github/workflows/s01-theme210-progress-20261027-formal.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.210
  TARGET_SHA: adfe34a08c2ec2a541da3cf5f77248b6a40d1bdf
  TARGET_TREE: 69b185f53efce77c37e470e30553ab5178a6f6b3
  BASE_SHA: f7e8fae20319f73d75214612442eef9f5a936c00
  LANE_ID: s01-theme210-progress-20261027
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: control
      - name: Formal identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-theme210-progress-20261027/formal-spec.json --input control/.github/workflows/s01-theme210-progress-20261027-formal.yml
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: adfe34a08c2ec2a541da3cf5f77248b6a40d1bdf
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact candidate, merged tree and required evidence readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider candidate-proof
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40510779325 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40510779325 --jq .head_sha)" = eb1cf5937f8ad50b42edd05c31984c9ee4a8b9ae
          test "$(gh api repos/$TARGET_REPO/commits/main --jq .sha)" = "$TARGET_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$TARGET_SHA --jq .tree.sha)" = "$TARGET_TREE"
          gh run download 40510779325 --repo llhzx2018/core-free-runner-public --name s01-home-40510779325 --dir candidate-proof
          cmp candidate-proof/state-before.sha256 candidate-proof/state-after.sha256
          cmp candidate-proof/contracts-before.json candidate-proof/contracts-after.json
          python3 control/lanes/s01-theme210-progress-20261027/package.py
          python3 - <<'PYVERIFY'
          import json,pathlib,subprocess,urllib.parse
          r=pathlib.Path('candidate-proof')
          old=json.loads((r/'package.json').read_text());new=json.loads(pathlib.Path('proof/package.json').read_text())
          assert old['source']=='9bbe1896c602c5fc479e00b7ca2e7638adeafd1f'
          assert json.loads((r/'current-main-baseline.json').read_text())['source']=='f7e8fae20319f73d75214612442eef9f5a936c00'
          for name in ['upstream-coverage.json','upstream-policy.json']:
              assert json.loads((r/name).read_text())['status']=='PASS'
          for phase,count in [('before',9),('after',12)]:
              d=json.loads((r/(phase+'-summary.json')).read_text());assert d['status']=='PASS' and d['cases']==count
          before=json.loads((r/'before-results.json').read_text());after=json.loads((r/'after-results.json').read_text())
          assert before['status']=='PASS' and before['cases']==4
          assert after['status']=='PASS' and after['cases']==7 and after['frontendParity']=='PASS' and after['writes']==0
          for name in ['clean-install.json','bootstrap.json','native-lifecycle.json','progress-navigation.json']:
              assert json.loads((r/name).read_text())['status']=='PASS'
          for lang in ['en','zh']:
              for width in [1440,1024]:
                  assert (r/f'overview-{lang}-{width}.png').stat().st_size>500
          for k in ['status','version','tree','sha256','bytes','files']: assert old[k]==new[k],k
          assert new['sha256']=='600842d8d6ef315d479b8576fd23ae13e6a0148afbb31959f65dcf30d5146ee9' and new['bytes']==2012576
          coverage=json.loads(pathlib.Path('control/lanes/s01-theme210-progress-20261027/release-authority.json').read_text())
          assert set(coverage['required'])=={'TESTING','GIT','UA_UI','SEO','SECURITY','INSTALL','UPGRADE','DATA_SCHEMA','PERFORMANCE'}
          assert coverage['source']=='9bbe1896c602c5fc479e00b7ca2e7638adeafd1f' and coverage['tree']=='69b185f53efce77c37e470e30553ab5178a6f6b3'
          assert coverage['owner_preview_runtime']=='N_A'
          assert coverage['release_mode']=='PROJECT_PREVIEW_N_A'
          assert coverage['owner_real_use']=='POST_PRODUCTION_REQUIRED'
          assert coverage['production_auto_apply'] is False
          for item in coverage['required'].values():
              assert item['sha'] and item['acceptance']
              endpoint='repos/llhzx2018/gov-doc/contents/'+urllib.parse.quote(item['path'],safe='/')+'?ref=main'
              live=json.loads(subprocess.check_output(['gh','api',endpoint]))
              assert live['sha']==item['sha'],item['path']
              item['evidence_status']='PASS_EXACT_CANDIDATE_MACHINE'
          coverage['candidate_status']='PASS_EXACT_CANDIDATE_MACHINE'
          coverage['candidate_run']='40510779325'
          coverage['merged_source']='adfe34a08c2ec2a541da3cf5f77248b6a40d1bdf'
          coverage['formal_release_gate']='PASS'
          coverage['production_effect']='NOT_PROVEN_POST_MANUAL_UPGRADE_READBACK_REQUIRED'
          pathlib.Path('proof/public-authority-coverage.json').write_text(json.dumps(coverage,ensure_ascii=False,indent=2))
          print('MERGED_TREE_EQUALS_TESTED_TREE_AND_EXACT_PACKAGE_PASS')
          PYVERIFY
      - name: Publish only the exact verified package
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.35.210 --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create v1.35.210 provider/vf-tools-theme_V1.35.210.zip --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Theme V1.35.210' --notes '修复前台页面总览只显示后台人工签核0/20导致历史精修看起来未登记的问题。在原总览及逐页记录中分别展示已有桌面精修历史、当前语言桌面截图复核记录和本版后台人工签核，逐项显示历史版本及复核摘要；历史数量不冒充已完成页数，手机暂缓。登记209中英文19:34站点地图截图可见范围，不自动写入人工确认。保留原保存权限、nonce、并发保护及原生记录，六个有界后台/版本文件，无新增CSS/JS/运行文件。承接main已合并PR340的站点地图索引过滤、退役路由过滤及分类型采样修正，两项既有合同用例在本精确候选重新通过。精确候选通过纯PHP12项投影隔离、双语1440/1024原生后台及筛选/刷新/手机状态7项、六页前台输出严格保持；干净安装和209升级回退重复安装及数据保护PASS。476运行文件，远端正式ZIP字节核验。Production由Owner手工升级后复验。' --latest
          fi
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/v1.35.210 --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh release view v1.35.210 --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - name: Authenticated remote ZIP byte comparison
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download v1.35.210 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.210.zip --dir remote
          cmp provider/vf-tools-theme_V1.35.210.zip remote/vf-tools-theme_V1.35.210.zip
          echo '600842d8d6ef315d479b8576fd23ae13e6a0148afbb31959f65dcf30d5146ee9  remote/vf-tools-theme_V1.35.210.zip' | sha256sum -c
          test "$(stat -c %s remote/vf-tools-theme_V1.35.210.zip)" = 2012576
          gh release view v1.35.210 --repo "$TARGET_REPO" --json url,publishedAt,tagName > proof/formal-release.json
          echo FORMAL_RELEASE_EXACT_REMOTE_ASSET_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-home-formal-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target provider remote candidate-proof
