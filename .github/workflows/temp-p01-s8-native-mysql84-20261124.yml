name: TEMP P01 S8 MySQL8.4 native encrypted restore and Laravel DDL verification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p01-s8-native-mysql84-20261124.yml'

permissions:
  contents: read

concurrency:
  group: temp-p01-s8-mysql84-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  isolated-mysql84:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'test/p01-s8-native-mysql84-')
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      mysql84:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: synthetic-ci-root-only-20261124
        ports:
          - 3308:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot --password=synthetic-ci-root-only-20261124"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Checkout exact P01 private source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-startnew
          ref: 86c5766adc8cd70893c4bb555fc1cd7b4ed5d596
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
          fetch-depth: 1

      - name: Verify bound source SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C private-src rev-parse HEAD)" = "86c5766adc8cd70893c4bb555fc1cd7b4ed5d596"
          echo 'P01_S8_MYSQL84_EXACT_SOURCE=PASS'

      - name: Set up real PHP native driver and Laravel
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, pdo_sqlite, sqlite3, dom, xml, fileinfo, curl, openssl, zip, sodium
          tools: composer:v2
          coverage: none

      - name: Ensure a true MySQL client with GTID dump support
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          if ! command -v mysqldump >/dev/null 2>&1 || ! mysqldump --help 2>/dev/null | grep -q -- '--set-gtid-purged'; then
            sudo apt-get update -qq >"$RUNNER_TEMP/p01-s8-mysql-apt.log" 2>&1
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mysql-client-8.0 >>"$RUNNER_TEMP/p01-s8-mysql-apt.log" 2>&1 || {
              echo 'P01_S8_MYSQL84_NATIVE_CLIENT=UNAVAILABLE'
              exit 1
            }
          fi
          command -v mysql >/dev/null
          command -v mysqldump >/dev/null
          mysqldump --help 2>/dev/null | grep -q -- '--set-gtid-purged'
          echo 'P01_S8_MYSQL84_NATIVE_CLIENT=PASS'

      - name: Verify v2 encrypted source backup -> empty DB restore -> real Laravel migration and separate old-generation recovery
        shell: bash
        working-directory: private-src
        run: |
          set -Eeuo pipefail
          set +x
          python3 scripts/check_php_syntax.py >"$RUNNER_TEMP/p01-mysql84-lint.log" 2>&1
          echo 'P01_S8_MYSQL84_PHP_LINT=PASS'
          composer install --no-interaction --prefer-dist --no-progress --quiet >"$RUNNER_TEMP/p01-mysql84-composer.log" 2>&1
          echo 'P01_S8_MYSQL84_COMPOSER=PASS'
          export APP_ENV=testing DB_CONNECTION=sqlite DB_DATABASE=:memory:
          export APP_KEY="base64:$(openssl rand -base64 32)"
          export MYSQL_PWD=synthetic-ci-root-only-20261124
          export P01_S8_LARAVEL_MYSQL_SOURCE_JSON='{"driver":"mysql","host":"127.0.0.1","port":3308,"database":"vfstartnew_test_source_ciqa","username":"vfstartnew_test_source_ciqa","password":"synthetic-source-ci-only"}'
          export P01_S8_DISPOSABLE_MYSQL_JSON='{"driver":"mysql","host":"127.0.0.1","port":3308,"database":"vfstartnew_test_restore_ciqa","username":"vfstartnew_test_restore_ciqa","password":"synthetic-restore-ci-only"}'
          export P01_S8_RECOVERY_MYSQL_JSON='{"driver":"mysql","host":"127.0.0.1","port":3308,"database":"vfstartnew_test_restore_rbqa","username":"vfstartnew_test_restore_rbqa","password":"synthetic-rollback-ci-only"}'
          for method in \
            test_native_mysql_v2_restore_then_real_laravel_migration_only_with_isolated_credentials \
            test_mysql_encrypted_preupgrade_generation_rebuilds_without_reusing_dirty_ddl_database; do
            if ! mysql -h 127.0.0.1 -P 3308 -u root <<'SQL' >"$RUNNER_TEMP/p01-mysql84-init.log" 2>&1; then
          DROP DATABASE IF EXISTS vfstartnew_test_source_ciqa;
          DROP DATABASE IF EXISTS vfstartnew_test_restore_ciqa;
          DROP DATABASE IF EXISTS vfstartnew_test_restore_rbqa;
          CREATE DATABASE vfstartnew_test_source_ciqa;
          CREATE DATABASE vfstartnew_test_restore_ciqa;
          CREATE DATABASE vfstartnew_test_restore_rbqa;
          CREATE USER IF NOT EXISTS 'vfstartnew_test_source_ciqa'@'%' IDENTIFIED BY 'synthetic-source-ci-only';
          CREATE USER IF NOT EXISTS 'vfstartnew_test_restore_ciqa'@'%' IDENTIFIED BY 'synthetic-restore-ci-only';
          CREATE USER IF NOT EXISTS 'vfstartnew_test_restore_rbqa'@'%' IDENTIFIED BY 'synthetic-rollback-ci-only';
          GRANT ALL PRIVILEGES ON vfstartnew_test_source_ciqa.* TO 'vfstartnew_test_source_ciqa'@'%';
          GRANT ALL PRIVILEGES ON vfstartnew_test_restore_ciqa.* TO 'vfstartnew_test_restore_ciqa'@'%';
          GRANT ALL PRIVILEGES ON vfstartnew_test_restore_rbqa.* TO 'vfstartnew_test_restore_rbqa'@'%';
          CREATE TABLE vfstartnew_test_source_ciqa.probe (id INT NOT NULL PRIMARY KEY, label VARCHAR(100) NOT NULL) ENGINE=InnoDB;
          INSERT INTO vfstartnew_test_source_ciqa.probe VALUES (1,'old-row-a'),(2,'old-row-b');
          SQL
              python3 - "$RUNNER_TEMP/p01-mysql84-init.log" <<'PY'
          import pathlib,re,sys
          text=pathlib.Path(sys.argv[1]).read_text(errors='replace')
          codes=sorted(set(re.findall(r'(?:ERROR|Error)\s*(\d{3,5})',text)))[:5]
          print('P01_S8_MYSQL84_SQL_INIT_ERROR_CODES='+(','.join(codes) if codes else 'UNKNOWN'))
          PY
              echo 'P01_S8_MYSQL84_SQL_FIXTURE=FAIL'
              exit 1
            fi
            echo 'P01_S8_MYSQL84_SYNTHETIC_DB=PASS'
            set +e
            ./vendor/bin/phpunit --filter="$method" tests/Unit/IsolatedSqlLaravelMigrationRehearsalTest.php >"$RUNNER_TEMP/p01-mysql84-method.log" 2>&1
            result=$?
            set -e
            if [ "$result" -ne 0 ]; then
              python3 - "$RUNNER_TEMP/p01-mysql84-method.log" <<'PY'
          import sys,re,pathlib
          t=pathlib.Path(sys.argv[1]).read_text(errors='replace')
          codes=sorted(set(re.findall(r'\b(?:BACKUP|RESTORE|S8_SQL|SQL_CONTENT|ISOLATED_DB|RECOVERY_REVIEW)_[A-Z0-9_]{3,96}\b',t)))[:6]
          print('P01_S8_MYSQL84_ERROR_CATEGORY='+(','.join(codes) if codes else 'UNKNOWN'))
          PY
              echo 'P01_S8_MYSQL84_NATIVE_TEST=FAIL'
              exit "$result"
            fi
            # Avoid a false green when the native PHPUnit method is skipped:
            # one real test and nonzero assertions, not zero/unknown/skipped.
            if ! grep -Eq '^OK \(1 test, [1-9][0-9]* assertions?\)' "$RUNNER_TEMP/p01-mysql84-method.log"; then
              echo 'P01_S8_MYSQL84_METHOD_NOT_PROVEN'
              exit 1
            fi
            echo "P01_S8_MYSQL84_NATIVE_TEST=PASS:$method"
          done
          echo 'P01_S8_MYSQL84_TWO_NATIVE_CASES=PASS'

      - name: Clean private checkout and test logs in all outcomes
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- private-src
          rm -f -- "$RUNNER_TEMP"/p01-s8-mysql-* "$RUNNER_TEMP"/p01-mysql84-*
          test ! -e private-src
          echo 'P01_S8_MYSQL84_CLEANUP=PASS'
