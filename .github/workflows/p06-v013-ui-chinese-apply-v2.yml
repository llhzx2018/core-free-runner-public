name: P06 VF Press V0.1.3 Chinese UI Apply V2

on:
  pull_request:
    branches: [main]
    paths:
      - triggers/p06-v013-ui-chinese-apply-v2.txt

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout private working branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-press
          ref: fix/v013-chinese-ui
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: source

      - name: Reuse sealed Chinese presentation patch
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/.github/workflows/p06-v013-ui-chinese-apply.yml -o /tmp/v013-v1.yml
          python3 - <<'PY'
          from pathlib import Path
          text=Path('/tmp/v013-v1.yml').read_text(encoding='utf-8')
          start=text.index("          python3 - <<'PY'\n") + len("          python3 - <<'PY'\n")
          end=text.index("\n          PY\n", start)
          body=text[start:end]
          lines=[]
          for line in body.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/v013-patch.py').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          python3 /tmp/v013-patch.py
          test "$(cat VERSION)" = '0.1.3'

      - name: Syntax and full regression with migration baseline
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 php-mbstring php-zip php-curl sqlite3 composer >/dev/null
          composer validate --strict >/dev/null
          composer dump-autoload --no-dev --optimize --no-interaction >/dev/null
          find public src -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          rm -rf storage dist storage-restore-*
          php bin/migrate.php | grep -Fq MIGRATION_PASS
          php bin/self-test.php
          php bin/security-self-test.php
          php bin/research-self-test.php
          php bin/publication-self-test.php
          php bin/reader-self-test.php
          php bin/edition-self-test.php
          php bin/living-publishing-self-test.php
          php bin/operations-self-test.php
          php bin/update-self-test.php
          rm -rf storage dist storage-restore-*
          echo FULL_PRODUCT_REGRESSION=PASS

      - name: Chinese-first visible UI gate
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq '出版工作台' public/index.php
          grep -Fq '研究工作区' public/index.php
          grep -Fq '作品与母稿' public/index.php
          grep -Fq '出版台' public/index.php
          grep -Fq '资料来源' src/Http/Studio/ResearchController.php
          grep -Fq '母稿结构' src/Http/Studio/PublicationController.php
          grep -Fq 'AI 编辑审校' src/Http/Studio/PublishingController.php
          grep -Fq '备份与恢复' src/Http/Studio/OperationsController.php
          grep -Fq '正式版本' src/Http/Publisher/PublishedPublisherController.php
          grep -Fq '内部预览' src/Http/Preview/PublisherReaderPreviewController.php
          if grep -R -nE 'Research Workspace|Publication & Manuscript|Publishing Desk|Working Publisher / Reader Preview|PUBLISHING STUDIO|RESEARCH FIRST|MANUSCRIPT MAP|WORK HISTORY|LIVING PUBLISHING|CURRENT STATE|AI Editorial|OPERATIONS CENTER|SYSTEM HEALTH|ONLINE UPDATE|OWNER PREVIEW · WORKING PUBLICATION|WORKING PREVIEW|WHY THIS BOOK|FOR WHOM|CURRENT EDITION|Published Snapshot|[0-9]+ words' public/index.php src/Http; then
            echo VISIBLE_ENGLISH_UI_GATE=FAIL
            exit 1
          fi
          echo CHINESE_FIRST_UI_GATE=PASS

      - name: Seal candidate state and commit private working truth
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('VF_PROJECT.json'); d=json.loads(p.read_text(encoding='utf-8'))
          d['lifecycle']='RELEASE_CANDIDATE'
          d['version']='0.1.3'
          d['current_phase']='V0.1.3_CHINESE_UI_CANDIDATE'
          d['next_gate']='HTTP_UI_VISUAL_AND_RELEASE_GATE'
          d.setdefault('product_gates',{})['chinese_first_ui']='PASS'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'VF Agent'
          git config user.email 'vf-agent@users.noreply.github.com'
          git add VERSION VF_PROJECT.json public/index.php src/Support/UiText.php src/Http
          git commit -m 'feat(ui): make VF Press Chinese-first across product surfaces'
          git push origin HEAD:fix/v013-chinese-ui
          echo P06_V013_PRIVATE_COMMIT=PASS
