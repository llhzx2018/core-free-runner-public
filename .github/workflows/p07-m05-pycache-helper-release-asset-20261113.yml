name: P07-M05 新服务器初始化 · 缓存恢复助手正式发行附件
on:
  push:
    branches: [fix/p07-m05-cache-recovery-20261113]
    paths:
      - .github/workflows/p07-m05-pycache-helper-release-asset-20261113.yml
permissions:
  contents: read
jobs:
  formal-helper-asset:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Attach exact reviewed M05 helper to already-published immutable official releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN" || exit 13
          src=installers/p07-m05-cache-recovery.py
          expected=ab185d13f3db07b76bd2ccc5da80263acbeffa3c
          test "$(git hash-object "$src")" = "$expected"
          item="$RUNNER_TEMP/P07-M05-CACHE-RECOVERY.py"
          cp -- "$src" "$item"
          chmod 0600 "$item"
          expected_sha="$(sha256sum "$item" | cut -d' ' -f1)"
          tag=p07-m05-v0.1.0-pycache-safe1-20261113
          for repo in llhzx2018/vf-server-ops llhzx2018/core-free-runner-public; do
            gh release view "$tag" --repo "$repo" >/dev/null
            if gh api "repos/$repo/releases/tags/$tag" \
                --jq '.assets[].name' | grep -Fxq P07-M05-CACHE-RECOVERY.py; then
              echo "P07_M05_HELPER_ASSET_ALREADY_EXISTS_REFUSE:$repo"; exit 13
            fi
            gh release upload "$tag" "$item" --repo "$repo"
            dir="$RUNNER_TEMP/helper-$(basename "$repo")"
            mkdir -p "$dir"
            gh release download "$tag" --repo "$repo" \
              --pattern 'P07-M05-CACHE-RECOVERY.py' --dir "$dir" --clobber
            actual="$dir/P07-M05-CACHE-RECOVERY.py"
            test "$(sha256sum "$actual" | cut -d' ' -f1)" = "$expected_sha"
            test "$(git hash-object "$actual")" = "$expected"
            cmp "$item" "$actual"
            echo "P07_M05_FORMAL_HELPER_REMOTE_BYTES=PASS:$repo"
          done
          echo "P07_M05_HELPER_SHA256=$expected_sha"
          echo P07_M05_NO_PRIVATE_PRODUCTION_WRITE=YES
          rm -f "$item"
