name: TEMP skill-book V4.8 Governance Reconcile

on:
  push:
    branches:
      - release/skill-book-v48-candidate-asset-20260827
    paths:
      - '.github/workflows/temp-skill-book-v48-governance-reconcile.yml'

permissions:
  contents: read

concurrency:
  group: temp-skill-book-v48-governance-reconcile
  cancel-in-progress: false

env:
  GOV_REPOSITORY: llhzx2018/gov-doc
  TAG: skill-book-v4.8-candidate-20260827
  RELEASE_ID: '378052388'
  ASSET_ID: '532735275'
  SHA_ASSET_ID: '532735276'
  ASSET_NAME: skill-book_V4.8_CANDIDATE_20260827.zip
  ASSET_BYTES: '156008'
  ASSET_SHA256: df933b799e7e56a662f055abfe9825d15a4470c86cf9b41a34e30cbb98bf4c4b
  SOURCE_COMMIT: d5d809172f23b31212cf6b66551f775b2e07e35f

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Checkout temporary Runner branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Verify immutable published Release authority
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RELEASE_TOKEN"
          j="$(gh api "repos/$GOV_REPOSITORY/releases/tags/$TAG")"
          test "$(jq -r '.id' <<<"$j")" = "$RELEASE_ID"
          test "$(jq -r '.prerelease' <<<"$j")" = 'true'
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.id' <<<"$j")" = "$ASSET_ID"
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.size' <<<"$j")" = "$ASSET_BYTES"
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.digest' <<<"$j")" = "sha256:$ASSET_SHA256"
          test "$(jq -r --arg n "$ASSET_NAME.sha256" '.assets[]|select(.name==$n)|.id' <<<"$j")" = "$SHA_ASSET_ID"
          echo 'V48_PUBLISHED_RELEASE_AUTHORITY_READBACK=PASS'

      - name: Re-read live GOV-DOC main and reconcile
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone -q "https://x-access-token:${RELEASE_TOKEN}@github.com/${GOV_REPOSITORY}.git" gov
          cd gov
          git config user.name 'VF Candidate Reconcile'
          git config user.email 'release@kewaro.com'
          live="$(git rev-parse origin/main)"
          remote_live="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$live" = "$remote_live"
          echo "GOV_MAIN_LIVE_BEFORE_RECONCILE=$live"
          git checkout -q -B v48-reconcile origin/main
          git merge-base --is-ancestor "$SOURCE_COMMIT" HEAD
          cd ..
          python3 .github/scripts/temp_v48_governance_reconcile.py
          cd gov
          git diff --check
          git add CURRENT.md distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md distribution/skills/candidates/skill-book/V4.8/README.md distribution/skills/candidates/skill-book/V4.8/RUNTIME_ZIP_MIRROR_STATUS.md
          git diff --cached --check
          git diff --cached --quiet && { echo 'V48_GOVERNANCE_ALREADY_RECONCILED=PASS'; exit 0; }
          git commit -q -m 'skill-book: reconcile V4.8 published candidate authority'
          commit="$(git rev-parse HEAD)"
          before_push="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$before_push" = "$live"
          git push -q origin HEAD:main
          echo "V48_GOV_RECONCILIATION_COMMIT=$commit"
          echo 'V48_GOV_RECONCILIATION_WRITE=PASS'

      - name: Final GOV-DOC remote readback
        shell: bash
        run: |
          set -Eeuo pipefail
          cd gov
          git fetch -q origin main
          git reset -q --hard origin/main
          test "$(cat skills/skill-book/V4.8/VERSION)" = '4.8'
          test "$(sha256sum skills/skill-book/V4.8/SKILL.md | awk '{print $1}')" = 'e046eb73a400c690d524ec889fa33252c2bc9b2af1ab2aa9fe598b10e21401de'
          grep -Fq '| skill-book | V3.5 | V4.7 CANDIDATE（非 Current） |' CURRENT.md
          grep -Fq '`V4.8` 为最新 Candidate' CURRENT.md
          grep -Fq '状态：`PUBLISHED_REMOTE_VERIFIED`' distribution/skills/candidates/skill-book/V4.8/RUNTIME_ZIP_MIRROR_STATUS.md
          grep -Fq "$ASSET_SHA256" distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md
          grep -Fq "$RELEASE_ID" distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md
          grep -Fq "$ASSET_ID" distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md
          grep -Fq "$SHA_ASSET_ID" distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md
          grep -Fq "$SOURCE_COMMIT" distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md
          grep -Fq 'Current Promotion：`NOT_AUTHORIZED`' distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md
          echo "V48_FINAL_GOV_MAIN=$(git rev-parse HEAD)"
          echo 'LATEST_CANDIDATE=V4.8'
          echo 'SOURCE_CURRENT=V3.5'
          echo 'INSTALLED_RUNTIME_OBSERVATION=V4.7'
          echo 'CURRENT_PROMOTION=NOT_AUTHORIZED'
          echo 'V48_MIRROR=PUBLISHED_REMOTE_VERIFIED'
          echo 'V48_FINAL_GOV_REMOTE_READBACK=PASS'
