name: P01 Large Library Navigation UI Evidence
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p01-large-library-navigation-ui-evidence-20260828.yml
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE: 107b8205e7cd2aa53935aa70298235316b260438
      TREE: 0d30e4d60d4f5194cd8e477ac6f4e98cf8dac04d
      ROOT: /tmp/p01-large-library
      COOKIE: /tmp/p01-large-library.cookies
      PORT: '18332'
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Prepare exact seeded runtime
        run: bash runner/.github/scripts/p01-large-library-navigation-gate-20260828.sh
      - name: Capture responsive UI evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-ui /tmp/p01-ui-evidence
          cd /tmp/p01-ui
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          cat >evidence.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const ids=JSON.parse(fs.readFileSync('/tmp/p01-large-library-ids.json','utf8'));
            const base='http://127.0.0.1:18332';
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:1440,height:1000}});
            const login=await context.request.post(base+'/api.php?action=login',{data:{password:'P01Large!Library'}});
            if(!login.ok()) throw new Error('login http '+login.status());
            const body=await login.json(); if(!body.ok) throw new Error('login rejected');
            const page=await context.newPage();
            const noViewportOverflow=async(label)=>{
              const m=await page.evaluate(()=>({doc:document.documentElement.scrollWidth,win:window.innerWidth,toolbar:(()=>{const e=document.querySelector('.vf-workspace-toolbar');return e?{left:e.getBoundingClientRect().left,right:e.getBoundingClientRect().right,width:e.getBoundingClientRect().width}:null})()}));
              if(m.doc>m.win+2) throw new Error(label+' viewport overflow '+JSON.stringify(m));
              if(!m.toolbar || m.toolbar.left < -1 || m.toolbar.right > m.win+2) throw new Error(label+' toolbar out of viewport '+JSON.stringify(m));
            };
            await page.goto(base+'/surfaces.php?per=30&page=5',{waitUntil:'networkidle'});
            await page.locator('select[aria-label="分类筛选"]').waitFor();
            await page.locator('select[aria-label="资源模式筛选"]').waitFor();
            await page.locator('select[aria-label="每页数量"]').waitFor();
            await noViewportOverflow('desktop-all');
            await page.screenshot({path:'/tmp/p01-ui-evidence/desktop-all-page5.png',fullPage:true});
            await page.goto(base+'/start.php?per=30&page=3',{waitUntil:'networkidle'});
            await page.locator('select[aria-label="每页数量"]').waitFor();
            await noViewportOverflow('desktop-start');
            await page.screenshot({path:'/tmp/p01-ui-evidence/desktop-start-page3.png',fullPage:true});
            await page.setViewportSize({width:900,height:900});
            await page.goto(base+'/surfaces.php?per=30&page=5',{waitUntil:'networkidle'});
            await noViewportOverflow('narrow-all');
            await page.screenshot({path:'/tmp/p01-ui-evidence/narrow-all-page5.png',fullPage:true});
            await page.setViewportSize({width:390,height:844});
            await page.goto(base+'/surfaces.php?category='+ids.dev+'&per=30',{waitUntil:'networkidle'});
            await noViewportOverflow('mobile-all');
            await page.screenshot({path:'/tmp/p01-ui-evidence/mobile-all-filtered.png',fullPage:true});
            await browser.close();
            console.log('P01_LARGE_LIBRARY_UI_EVIDENCE=PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node evidence.js | tee /tmp/p01-ui-evidence/result.txt
          grep -Fx P01_LARGE_LIBRARY_UI_EVIDENCE=PASS /tmp/p01-ui-evidence/result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P01-large-library-navigation-ui-evidence
          path: /tmp/p01-ui-evidence
          if-no-files-found: error
          retention-days: 30
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/p01-large-library.pid 2>/dev/null)" 2>/dev/null || true
