name: P01 Admin Hidden Branding Sync Gate R2
on:
  push:
    branches: [gate/p01-admin-hidden-branding-sync-r2-20260831]
    paths: [.github/workflows/p01-admin-hidden-branding-sync-gate-r2-20260831.yml]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE: 1e88ef2e949fcb1fb51e809ba4bd5465975debb4
      BASE: 9e7a79114490fff7fbb6f6058bd89b4cc021adca
      ROOT: ${{ github.workspace }}/product/src
      EVID: /tmp/p01-admin-hidden-brand-r2/evidence
      PORT: '18499'
      ADMIN_PASS: P01HiddenBrandR2Pass
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Exact source and file fence
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-admin-hidden-brand-r2; mkdir -p "$EVID"
          test "$(git -C product rev-parse HEAD)" = "$SOURCE"
          test "$(git -C product diff --name-only "$BASE" "$SOURCE")" = 'src/assets/admin-consolidation.css'
          git -C product diff "$BASE" "$SOURCE" -- src/assets/admin-consolidation.css | tee "$EVID/source.patch"
          test "$(git -C product diff --numstat "$BASE" "$SOURCE" -- src/assets/admin-consolidation.css)" = $'1\t0\tsrc/assets/admin-consolidation.css'
          grep -Fx 'body[data-vf-admin-shell="server"] [hidden]{display:none!important}' product/src/assets/admin-consolidation.css
          test -z "$(git -C product status --porcelain)"
      - name: Fresh runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import struct,zlib,binascii
          w,h=64,32; raw=b''.join(b'\x00'+bytes([15,118,110])*w for _ in range(h))
          def c(t,d): return struct.pack('>I',len(d))+t+d+struct.pack('>I',binascii.crc32(t+d)&0xffffffff)
          open('/tmp/p01-admin-hidden-brand-r2/logo.png','wb').write(b'\x89PNG\r\n\x1a\n'+c(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))+c(b'IDAT',zlib.compress(raw,9))+c(b'IEND',b''))
          PY
          php -S 127.0.0.1:$PORT -t "$ROOT" >"$EVID/server.log" 2>&1 & echo $! >/tmp/p01-admin-hidden-brand-r2.pid
          COOKIE=/tmp/p01-admin-hidden-brand-r2.cookies
          for i in $(seq 1 60); do curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:$PORT/setup.php" -o "$EVID/setup.html" && break; sleep .25; done
          CSRF=$(python3 - "$EVID/setup.html" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:$PORT/setup.php" --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=P01 Hidden Brand R2' --data-urlencode "admin_password=$ADMIN_PASS" --data-urlencode "admin_password_confirm=$ADMIN_PASS" -o "$EVID/setup-post.html"
      - name: Browser gate with system Chrome
        shell: bash
        run: |
          set -Eeuo pipefail
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME"
          "$CHROME" --version | tee "$EVID/chrome.txt"
          mkdir -p /tmp/p01-admin-hidden-brand-r2/pw; cd /tmp/p01-admin-hidden-brand-r2/pw
          npm init -y >/dev/null 2>&1
          npm install playwright-core@1.55.0 >/dev/null 2>&1
          cat >gate.cjs <<'JS'
          const {chromium}=require('playwright-core'),fs=require('fs');
          const base='http://127.0.0.1:18499/',A=(v,m)=>{if(!v)throw Error(m)},abs=u=>new URL(u,base).href;
          const chrome=process.env.CHROME;
          async function overflow(p,l){const n=await p.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);A(n===0,l+' overflow='+n);return n}
          (async()=>{const b=await chromium.launch({headless:true,executablePath:chrome,args:['--no-sandbox']});const admin=await b.newContext({viewport:{width:390,height:844}});const login=await admin.request.post(base+'api.php?action=login',{data:{password:'P01HiddenBrandR2Pass'}});A(login.ok(),'login status');A((await login.json()).ok,'login body');const p=await admin.newPage();p.setDefaultTimeout(10000);const out={source:process.env.SOURCE,base:process.env.BASE};
          await p.goto(base+'settings.php#brand',{waitUntil:'domcontentloaded'});await p.waitForFunction(()=>document.querySelector('#settingsRoot')?.getAttribute('aria-busy')==='false');const initial=await p.evaluate(()=>['deleteLogo','deleteFavicon'].map(id=>{const e=document.getElementById(id),r=e.getBoundingClientRect(),s=getComputedStyle(e);return{id,hidden:e.hidden,display:s.display,w:r.width,h:r.height}}));for(const x of initial){A(x.hidden,'initial hidden '+x.id);A(x.display==='none','initial display '+JSON.stringify(x));A(x.w===0&&x.h===0,'initial geometry '+JSON.stringify(x))}out.initial={buttons:initial,overflow:await overflow(p,'initial')};
          await p.locator('#logoFile').setInputFiles('/tmp/p01-admin-hidden-brand-r2/logo.png');await p.waitForFunction(()=>document.querySelector('#settingsState')?.textContent.includes('品牌素材已更新'));A(await p.locator('#logoPreview img').count()===1,'settings preview');A(!(await p.locator('#deleteLogo').isHidden()),'delete visible');const preview=await p.locator('#logoPreview img').getAttribute('src');out.settings={preview,overflow:await overflow(p,'settings')};
          const ar=await admin.request.get(base+'api.php?action=bootstrap');const a=await ar.json();A(a.ok&&a.site.branding.hasLogo===true,'admin bootstrap logo');A(abs(a.site.branding.logoUrl)===abs(preview),'bootstrap preview mismatch');
          await p.setViewportSize({width:1440,height:900});await p.goto(base+'links-admin.php',{waitUntil:'domcontentloaded'});const rail=p.locator('.vf-rail-mark img');A(await rail.count()===1,'admin shell logo');A(abs(await rail.getAttribute('src'))===abs(a.site.branding.logoUrl),'admin logo mismatch');out.admin={overflow:await overflow(p,'admin')};
          const pub=await b.newContext({viewport:{width:390,height:844}}),q=await pub.newPage();q.setDefaultTimeout(10000);await q.goto(base+'index.php',{waitUntil:'domcontentloaded'});await q.waitForSelector('#brandMark img');A(abs(await q.locator('#brandMark img').getAttribute('src'))===abs(a.site.branding.logoUrl),'public logo mismatch');out.public={overflow:await overflow(q,'public')};
          await p.setViewportSize({width:390,height:844});await p.goto(base+'settings.php#brand',{waitUntil:'domcontentloaded'});await p.waitForFunction(()=>document.querySelector('#settingsRoot')?.getAttribute('aria-busy')==='false');await p.locator('#deleteLogo').click();await p.waitForFunction(()=>document.querySelector('#settingsState')?.textContent.includes('已恢复默认品牌素材'));A(await p.locator('#logoPreview img').count()===0,'preview reset');A(await p.locator('#deleteLogo').isHidden(),'delete hidden reset');const br=await admin.request.get(base+'api.php?action=bootstrap'),z=await br.json();A(z.ok&&z.site.branding.hasLogo===false&&!z.site.branding.logoUrl,'bootstrap reset');
          await p.setViewportSize({width:1440,height:900});await p.goto(base+'links-admin.php',{waitUntil:'domcontentloaded'});A(await p.locator('.vf-rail-mark img').count()===0,'admin logo persisted');A((await p.locator('.vf-rail-mark').textContent()).trim()==='VF','admin fallback');await q.reload({waitUntil:'domcontentloaded'});await q.waitForFunction(()=>document.querySelector('#brandMark')?.textContent.trim()==='VF'&&!document.querySelector('#brandMark img'));out.reset={admin:'PASS',public:'PASS',publicOverflow:await overflow(q,'public reset')};out.verdict='PASS';fs.writeFileSync(process.env.EVID+'/gate.json',JSON.stringify(out,null,2));console.log('P01_ADMIN_HIDDEN_BRANDING_R2=PASS');console.log(JSON.stringify(out));await pub.close();await admin.close();await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          JS
          CHROME="$CHROME" SOURCE="$SOURCE" BASE="$BASE" EVID="$EVID" node gate.cjs | tee "$EVID/browser.txt"
      - name: SQLite and brand cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$ROOT" php <<'PHP' | tee "$EVID/db.txt"
          <?php require getenv('ROOT').'/app/bootstrap.php';$db=vf_db();$b=(new VfRepository($db))->getBranding();$i=strtolower((string)$db->query('PRAGMA integrity_check')->fetchColumn());$fk=count($db->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC));$files=is_dir(VF_BRAND_DIR)?array_values(array_filter(scandir(VF_BRAND_DIR),fn($x)=>!in_array($x,['.','..','.htaccess','index.php','web.config'],true))):[];echo 'INTEGRITY='.$i."\nFK=".$fk."\nHAS_LOGO=".(!empty($b['hasLogo'])?'1':'0')."\nUSER_BRAND_FILES=".count($files)."\n";if($i!=='ok'||$fk!==0||!empty($b['hasLogo'])||count($files)!==0)exit(1);
          PHP
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-admin-hidden-branding-r2-${{ github.run_id }}
          path: ${{ env.EVID }}
          if-no-files-found: error
          retention-days: 30
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/p01-admin-hidden-brand-r2.pid 2>/dev/null)" 2>/dev/null || true
