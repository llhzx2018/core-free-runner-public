name: P01 V2.39 PR226 Public Machine Gate

on:
  push:
    branches:
      - gate/p01-v2390-pr226-20260902
    paths:
      - .github/workflows/p01-v2390-pr226-machine-gate.yml

permissions:
  contents: write

jobs:
  machine-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none

      - name: P01 V2.39 exact source / fresh runtime / real repository gate
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: bash .github/scripts/p01-v2390-pr226-machine-gate.sh

      - name: Clean disposable gate branch payload
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "VictorForge"
          git config user.email "llhzx2018@gmail.com"
          git rm .github/workflows/p01-v2390-pr226-machine-gate.yml
          git rm .github/scripts/p01-v2390-pr226-machine-gate.sh
          git commit -m "test(P01): close V2.39 PR226 public machine gate [skip ci]"
          git push origin HEAD:gate/p01-v2390-pr226-20260902
