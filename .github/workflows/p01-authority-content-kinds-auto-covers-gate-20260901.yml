name: P01 Authority Content Kinds Auto Covers Gate
on:
  push:
    branches: [temp/p01-authority-content-kinds-auto-covers-20260901]
    paths: [.github/workflows/p01-authority-content-kinds-auto-covers-gate-20260901.yml]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      AUTHORITY_SOURCE: 4fe925274515b2b9d7bc82f9720886d136b3c1f2
      PRODUCT_BASE: 92169989e3b813328e85133ab9e05bafb8593d0c
      PRODUCT_TREE: b61812e83e2572ebe42f36991e40521b44e2447f
      PRODUCT_CANDIDATE: ccaf71e4c44d09f7f8c0e4d5ed28a405309aa3e9
      PRODUCT_GATE: '33413843464'
      PRODUCT_ARTIFACT: '9766202398'
      PRODUCT_DIGEST: ba1d96ca54d38b0e25cf7486fdba4dd3a30c975f6920dfd7e4fcd5031c03935a
      PRODUCTION_MAIN: 3a60430c3c74688f2db81f2fd08e7e8ecd986fc9
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.AUTHORITY_SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Authority exact-source and scope gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$AUTHORITY_SOURCE"
          test "$(git -C product rev-parse HEAD^)" = "$PRODUCT_BASE"
          git -C product diff --name-only "$PRODUCT_BASE" "$AUTHORITY_SOURCE" | sort > /tmp/changed.txt
          cat >/tmp/expected.txt <<'EOF'
          VF_PROJECT.json
          docs/authority/CURRENT.md
          docs/evidence/P01_L2_PRODUCT_WAVE_DEVELOP_MERGE_20260831.md
          docs/handoff/CURRENT_STATE.md
          EOF
          diff -u /tmp/expected.txt /tmp/changed.txt
          test -z "$(grep '^src/' /tmp/changed.txt || true)"
          git -C product diff --check "$PRODUCT_BASE" "$AUTHORITY_SOURCE"
          python3 -m json.tool product/VF_PROJECT.json >/dev/null
          grep -F "$PRODUCT_BASE" product/VF_PROJECT.json >/dev/null
          grep -F "$PRODUCT_TREE" product/VF_PROJECT.json >/dev/null
          grep -F "$PRODUCT_CANDIDATE" product/VF_PROJECT.json >/dev/null
          grep -F "$PRODUCT_GATE" product/VF_PROJECT.json >/dev/null
          grep -F "$PRODUCT_ARTIFACT" product/VF_PROJECT.json >/dev/null
          grep -F "$PRODUCT_DIGEST" product/VF_PROJECT.json >/dev/null
          grep -F 'latest_merge_pr": 157' product/VF_PROJECT.json >/dev/null
          grep -F 'L2 CONTENT KINDS + AUTO COVERS PASS' product/VF_PROJECT.json >/dev/null
          for f in docs/authority/CURRENT.md docs/handoff/CURRENT_STATE.md docs/evidence/P01_L2_PRODUCT_WAVE_DEVELOP_MERGE_20260831.md; do
            grep -F "$PRODUCT_BASE" "product/$f" >/dev/null
            grep -F "$PRODUCT_TREE" "product/$f" >/dev/null
            grep -F "$PRODUCT_GATE" "product/$f" >/dev/null
            grep -F "$PRODUCT_ARTIFACT" "product/$f" >/dev/null
            grep -F "$PRODUCT_DIGEST" "product/$f" >/dev/null
          done
          test "$(git -C product rev-parse origin/main)" = "$PRODUCTION_MAIN"
          echo 'P01_AUTHORITY_SCOPE=PASS'
          echo 'P01_AUTHORITY_CURRENT_TRUTH=PASS'
          echo 'P01_MAIN_UNCHANGED=PASS'
          echo 'P01_AUTHORITY_CONTENT_KINDS_AUTO_COVERS=PASS'
