name: S01 Theme Credential-First UX Candidate V2
on:
  push:
    branches:
      - temp/s01-update-center-id-closure-20260907
    paths:
      - .github/workflows/temp-s01-theme-credential-first-candidate-v2-20260907.yml
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      REPO: llhzx2018/vf-tools-theme
      BRANCH: work/s01-update-center-credential-first-20260907
      BASE_SHA: 1447c67febf1d3d456ca0e51d2c7c78063f79ae7
    steps:
      - name: Checkout runner definition
        uses: actions/checkout@v4
      - name: Apply and gate bounded credential-first UX
        env:
          GH_TOKEN: ${{ env.WRITE_TOKEN }}
        run: bash scripts/temp_s01_theme_credential_first_candidate_20260907.sh
