name: P03 V1.37.4 Final Exact Source Gate
on:
  push:
    branches: [task/p03-v1374-common-baseline-release-20260828]
    paths: ['.github/workflows/p03-v1374-final-exact-gate-20260828.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Checkout final P03 exact source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-forge
          ref: f57de357f6b536d2bed3579a0abe09aeead54d58
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product
      - name: Verify final exact source and evidence binding
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          FINAL=f57de357f6b536d2bed3579a0abe09aeead54d58
          VERIFIED=b215f510a543ca5cf85af9e87257e2acb63d74ab
          BASE=cc9a6da445240534016d08e148aa8a28c11be241
          test "$(git rev-parse HEAD)" = "$FINAL"
          test "$(git rev-parse HEAD^)" = "$VERIFIED"
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git show -s --format=%T "$VERIFIED")" = 75b65d094f3f487faefe5680ae4cc5162fc26552
          git diff --name-only "$VERIFIED".."$FINAL" | sort > "$RUNNER_TEMP/final-diff"
          printf 'VF_PROJECT.json\n' > "$RUNNER_TEMP/final-expected"
          diff -u "$RUNNER_TEMP/final-expected" "$RUNNER_TEMP/final-diff"
          git diff --name-only "$BASE".."$FINAL" | sort > "$RUNNER_TEMP/main-diff"
          printf '%s\n' CHANGELOG.md VERSION VF_PROJECT.json scripts/build_atomic.py src/app/bootstrap.php | sort > "$RUNNER_TEMP/main-expected"
          diff -u "$RUNNER_TEMP/main-expected" "$RUNNER_TEMP/main-diff"
          test "$(cat VERSION)" = 1.37.4
          test "$(cat database/schema/SCHEMA_VERSION)" = 30
          grep -Fq "define('VFAB_VERSION', '1.37.4');" src/app/bootstrap.php
          grep -Fq "define('VFAB_SCHEMA_VERSION', 30);" src/app/bootstrap.php
          grep -Fq "TARGET_VERSION='1.37.4'" scripts/build_atomic.py
          grep -Fq "ALLOWED_SOURCES=['1.37.3']" scripts/build_atomic.py
          test -z "$(git tag -l v1.37.4)"
          python3 - <<'PY'
          import json
          d=json.load(open('VF_PROJECT.json',encoding='utf-8'))
          v=d['verification']; r=d['release']
          assert d['project_id']=='P03' and d['candidate_version']=='1.37.4' and d['schema_version']==30
          assert d['production_version']=='1.37.3' and d['production_write']=='NO'
          assert v['formal_gate_result']=='PASS'
          assert v['formal_gate_run_id']==33124160111 and v['formal_gate_job_id']==98698131192
          assert v['formal_gate_artifact_id']==9667684606
          assert v['formal_gate_exact_source']=='b215f510a543ca5cf85af9e87257e2acb63d74ab'
          assert v['formal_gate_exact_tree']=='75b65d094f3f487faefe5680ae4cc5162fc26552'
          assert v['common_product_baseline_v2']=='PASS / DRIFT 0 / UNKNOWN 0 / EXCEPTION 3 / N_A 1'
          assert v['atomic_upgrade']=='1.37.3 -> 1.37.4 PASS' and v['atomic_rollback']=='PASS / SOURCE AND DATABASE'
          assert v['browser_e2e'].startswith('PASS') and v['deterministic_artifacts']=='PASS'
          assert v['formal_release']=='READY_NOT_PUBLISHED' and v['core_updates']=='NOT_STARTED'
          assert r['release_ready']=='YES / FORMAL MACHINE GATE PASS' and r['release_tag'] is None and r['production_write'] is False
          print('P03_V1374_FINAL_AUTHORITY=PASS')
          PY
          curl -fsSL https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/runs/33124160111 > "$RUNNER_TEMP/formal-run.json"
          python3 - "$RUNNER_TEMP/formal-run.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d['id']==33124160111 and d['status']=='completed' and d['conclusion']=='success'
          assert d['head_sha']=='891c54772f4c6e40ed83dc205cc7f8f3cbc51664'
          PY
          curl -fsSL https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/runs/33124160111/artifacts > "$RUNNER_TEMP/formal-artifacts.json"
          python3 - "$RUNNER_TEMP/formal-artifacts.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          a=next(x for x in d['artifacts'] if x['id']==9667684606)
          assert a['name']=='P03-V1.37.4-FORMAL-RELEASE-SET' and a['expired'] is False
          PY
          echo P03_V1374_FINAL_EXACT_SOURCE=$FINAL
          echo P03_V1374_FINAL_EXACT_GATE=PASS
          echo RELEASE=NO
          echo PRODUCTION=NO
