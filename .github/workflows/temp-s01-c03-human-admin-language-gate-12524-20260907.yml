name: S01-C03 Human Admin Language 1.25.24 Gate

on:
  push:
    branches: [temp/s01-c03-human-admin-language-gate-12524-20260907]
    paths:
      - '.github/workflows/temp-s01-c03-human-admin-language-gate-12524-20260907.yml'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      M3U8_BASE: fda320e63e135489a3d46aed1c107aa48114ee86
      M3U8_HEAD: 18c2e61327bac1cbe51ca2e9e7fa3d263de9f325
    steps:
      - name: Credential boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo 'RELEASE_WRITE_USED=NO'
          echo 'PRODUCTION_WRITE_USED=NO'

      - name: Checkout exact M3U8 candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: ${{ env.M3U8_HEAD }}
          token: ${{ env.READ_TOKEN }}
          path: m3u8
          fetch-depth: 0
          persist-credentials: false

      - name: Exact changed-file and frozen-boundary gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C m3u8 rev-parse HEAD)" = "$M3U8_HEAD"
          git -C m3u8 cat-file -e "$M3U8_BASE^{commit}"
          python3 - <<'PY'
          import os, subprocess
          got=set(subprocess.check_output(['git','-C','m3u8','diff','--name-only',os.environ['M3U8_BASE']+'..'+os.environ['M3U8_HEAD']],text=True).splitlines())
          expected={
            'VERSION',
            'src/admin/admin-ia-contract.php',
            'src/vf-tool-m3u8.php',
            'tests/unit/admin-human-language-contract.php',
            'tests/unit/update-refresh-policy-contract.php',
            'tests/unit/visible-console-v2-contract.php',
          }
          assert got==expected,(got,expected)
          assert not any('schema' in p.lower() or 'migration' in p.lower() or 'provider' in p.lower() or p.endswith('.css') for p in got),got
          print('EXACT_SIX_FILE_SCOPE=PASS')
          print('NO_SCHEMA_MIGRATION_PROVIDER_CSS_DELTA=PASS')
          PY

      - name: Version and route identity gate
        working-directory: m3u8
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(tr -d '\r\n' < VERSION)" = '1.25.24'
          grep -Fq 'Version: 1.25.24' src/vf-tool-m3u8.php
          grep -Fq "VF_TOOL_M3U8_VERSION', '1.25.24'" src/vf-tool-m3u8.php
          grep -Fq "VF_TOOL_M3U8_ROUND', 'R248'" src/vf-tool-m3u8.php
          php tests/unit/admin-human-language-contract.php
          echo 'ADMIN_HUMAN_LANGUAGE_ROUTE_IDENTITY=PASS'

      - name: Regression contracts
        working-directory: m3u8
        shell: bash
        run: |
          set -Eeuo pipefail
          php tests/unit/visible-console-v2-contract.php
          php tests/unit/update-refresh-policy-contract.php
          php tests/unit/update-schema-authority-contract.php
          php tests/unit/package-physical-locator-contract.php
          php tests/frontend-s01-uiux-final-owner-contract.php
          echo 'CURRENT_UI_UPDATE_SCHEMA_LOCATOR_CONTRACTS=PASS'

      - name: Full PHP syntax gate
        working-directory: m3u8
        shell: bash
        run: |
          set -Eeuo pipefail
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l >/dev/null
          echo 'ALL_PHP_LINT=PASS'
          echo 'M3U8_MIGRATION_REMAINS_CLOSED=PASS'
          echo 'S01_C03_HUMAN_ADMIN_LANGUAGE_GATE=PASS'
