name: P05 Decision Audit Retarget

on:
  push:
    branches:
      - test/p05-decision-consistency-audit-20260902

permissions:
  contents: write

jobs:
  retarget:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Retarget same matrix to exact Product candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/p05-product-decision-consistency-audit.yml')
          s=p.read_text()
          old='1e251008b7c9708bee2ac297b592409bdc019bf8'
          new='b8654995f27a317bd6a2ac657c62ed0ce5016b9c'
          if s.count(old) < 3: raise SystemExit('old exact SHA occurrences missing')
          s=s.replace(old,new)
          old_paths="""    paths:\n      - '.github/workflows/p05-product-decision-consistency-audit.yml'\n"""
          new_paths="""    paths:\n      - '.github/workflows/p05-product-decision-consistency-audit.yml'\n      - '.p05-decision-audit-trigger'\n"""
          if old_paths not in s: raise SystemExit('paths block missing')
          s=s.replace(old_paths,new_paths,1)
          old_gate='''          grep -q "const nextActions: Json\\[\\] = growthOpportunities.slice(0, 5)" src/server/product-optimization.ts\n'''
          new_gate='''          grep -q "const blockerFirst = status.code === 'DATA_PROBLEM' || status.code === 'NEEDS_ATTENTION';" src/server/product-optimization.ts\n          grep -q "\\$blockerFirst = in_array" php/src/ProductOptimizationService.php\n          test "$(git rev-parse HEAD^{tree})" = '9ddf49af2a2c26ee3aee29b3a9d316887d69cc63'\n'''
          if old_gate not in s: raise SystemExit('old source gate missing')
          s=s.replace(old_gate,new_gate,1)
          old_assert="""                  if code=='NEEDS_ATTENTION':\n                      if not attention:\n                          violations.append(f'{name}: NEEDS_ATTENTION but attention empty')\n                      if str(first.get('kind'))!='FIX':\n                          violations.append(f\"{name}: NEEDS_ATTENTION but nextBest={first.get('kind')} / {first.get('title')}\")\n                  if code=='DATA_PROBLEM':\n                      if not attention or str((attention[0] or {}).get('kind'))!='DATA':\n                          violations.append(f'{name}: DATA_PROBLEM but first attention is not DATA')\n                      if str(first.get('kind'))!='FIX':\n                          violations.append(f\"{name}: DATA_PROBLEM but nextBest={first.get('kind')} / {first.get('title')}\")\n"""
          new_assert="""                  if code in ('NEEDS_ATTENTION','DATA_PROBLEM'):\n                      if not attention:\n                          violations.append(f'{name}: {code} but attention empty')\n                      else:\n                          expected=attention[0]\n                          if first.get('title') != expected.get('title') or first.get('kind') != expected.get('kind'):\n                              violations.append(f\"{name}: {code} first next action diverges from blocker; expected={expected.get('kind')} / {expected.get('title')} got={first.get('kind')} / {first.get('title')}\")\n                  if code=='NEEDS_ATTENTION' and str(first.get('kind')) not in ('ERROR','WARNING'):\n                      violations.append(f\"{name}: NEEDS_ATTENTION first next kind={first.get('kind')}\")\n                  if code=='DATA_PROBLEM' and str(first.get('kind'))!='DATA':\n                      violations.append(f\"{name}: DATA_PROBLEM first next kind={first.get('kind')}\")\n"""
          if old_assert not in s: raise SystemExit('old matrix assertion block missing')
          s=s.replace(old_assert,new_assert,1)
          p.write_text(s)
          PY
          grep -q 'b8654995f27a317bd6a2ac657c62ed0ce5016b9c' .github/workflows/p05-product-decision-consistency-audit.yml
          grep -q '9ddf49af2a2c26ee3aee29b3a9d316887d69cc63' .github/workflows/p05-product-decision-consistency-audit.yml
          grep -q '.p05-decision-audit-trigger' .github/workflows/p05-product-decision-consistency-audit.yml
          git diff --check
      - name: Commit retargeted disposable audit
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/p05-decision-audit-retarget.yml
          git config user.name 'VF Runtime'
          git config user.email 'vf-runtime@users.noreply.github.com'
          git add .github/workflows/p05-product-decision-consistency-audit.yml .github/workflows/p05-decision-audit-retarget.yml
          git diff --cached --check
          git commit -m 'test(P05): retarget decision matrix to fixed candidate'
          git push origin HEAD:${GITHUB_REF_NAME}
