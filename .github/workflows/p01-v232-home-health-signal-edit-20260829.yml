name: P01 V2.32 Home Health Signal Edit
on:
  push:
    branches: [task/p01-v232-home-command-center-20260829]
    paths:
      - .github/workflows/p01-v232-home-health-signal-edit-20260829.yml
permissions:
  contents: read
jobs:
  edit:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_SOURCE: d1f09550b35b7f1f5b8023bb28538889d5e85111
      PRODUCT_BRANCH: feature/p01-v2.32-home-health-signal-20260829
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: feature/p01-v2.32-home-health-signal-20260829
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Exact-source fenced Home health signal edit
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$EXPECTED_SOURCE"
          python3 - <<'PY'
          from pathlib import Path

          php = Path('product/src/app/FunctionalHome.php')
          s = php.read_text(encoding='utf-8')

          context_anchor = "    $operationCategoryTitles = (array)($context['operation_category_titles'] ?? []);\n"
          context_extra = context_anchor + "    $healthStatus = (array)($context['health_status'] ?? []);\n    $healthProblems = max(0, (int)($healthStatus['problems'] ?? 0));\n"
          if s.count(context_anchor) != 1:
              raise SystemExit('health context anchor drift')
          s = s.replace(context_anchor, context_extra, 1)

          rail_anchor = """      <?php if($pending>0): ?>
    <section class=\"vf-home-section vf-home-action-section\">"""
          health_block = """      <?php if($healthProblems>0): ?>
      <section class=\"vf-home-section vf-home-health-section\">
        <header><div><span>异常</span><h2>有 <?=number_format($healthProblems)?> 个网址需要检查</h2><p>只统计已检查后进入异常状态的网址；未检查与已跳转不算异常。</p></div></header>
        <div class=\"vf-home-health-breakdown\" aria-label=\"网址异常状态\">
          <?php foreach([['confirmed','确认失效'],['suspected','疑似失效'],['temporary','暂时异常'],['restricted','访问受限']] as [$key,$label]): $count=max(0,(int)($healthStatus[$key]??0)); if($count<=0)continue; ?>
            <span><b><?=number_format($count)?></b><small><?=vf_fw_h($label)?></small></span>
          <?php endforeach; ?>
        </div>
        <a class=\"vf-home-health-link\" href=\"health.php\">查看网址健康 →</a>
      </section>
      <?php endif; ?>

      <?php if($pending>0): ?>
    <section class=\"vf-home-section vf-home-action-section\">"""
          if s.count(rail_anchor) != 1:
              raise SystemExit('health rail anchor drift')
          s = s.replace(rail_anchor, health_block, 1)

          data_anchor = "    $operations = [];\n    try { $operations = (new VfOperationHistory($db))->recent(5, 0); } catch (Throwable $ignored) {}\n"
          data_extra = data_anchor + "    $healthStatus = [];\n    try { $healthStatus = (new VfLinkHealth($db))->status(); } catch (Throwable $ignored) {}\n"
          if s.count(data_anchor) != 1:
              raise SystemExit('health data anchor drift')
          s = s.replace(data_anchor, data_extra, 1)

          render_anchor = "'operation_category_titles'=>$operationCategoryTitles]); ?>"
          render_new = "'operation_category_titles'=>$operationCategoryTitles,'health_status'=>$healthStatus]); ?>"
          if s.count(render_anchor) != 1:
              raise SystemExit('health render anchor drift')
          s = s.replace(render_anchor, render_new, 1)
          php.write_text(s, encoding='utf-8')

          css = Path('product/src/assets/workspace-home.css')
          c = css.read_text(encoding='utf-8')
          css_anchor = ".vf-home-action-section{background:color-mix(in srgb,var(--ws-teal-soft) 32%,var(--ws-panel))}\n"
          css_extra = """.vf-home-health-section{border-color:color-mix(in srgb,#b45309 28%,var(--ws-line));background:color-mix(in srgb,#f59e0b 5%,var(--ws-panel))}
          .vf-home-health-section>header>div>span{color:#b45309}
          .vf-home-health-breakdown{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-bottom:10px}
          .vf-home-health-breakdown span{min-width:0;padding:7px 8px;border:1px solid color-mix(in srgb,#b45309 18%,var(--ws-line));border-radius:7px;background:var(--ws-panel)}
          .vf-home-health-breakdown b,.vf-home-health-breakdown small{display:block}
          .vf-home-health-breakdown b{color:var(--ws-text);font-size:14px;line-height:1.1}
          .vf-home-health-breakdown small{margin-top:2px;color:var(--ws-muted-2);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          .vf-home-health-link{display:flex;align-items:center;justify-content:center;min-height:34px;padding:7px 10px;border:1px solid color-mix(in srgb,#b45309 24%,var(--ws-line));border-radius:8px;background:var(--ws-panel);color:#92400e!important;font-size:10.5px;font-weight:750}
          .vf-home-health-link:hover{border-color:color-mix(in srgb,#b45309 40%,var(--ws-line));background:color-mix(in srgb,#f59e0b 8%,var(--ws-panel))}
          """
          if c.count(css_anchor) != 1:
              raise SystemExit('health css anchor drift')
          c = c.replace(css_anchor, css_extra + css_anchor, 1)
          css.write_text(c, encoding='utf-8')
          PY
          php -l product/src/app/FunctionalHome.php
          test "$(git -C product diff --name-only | sort | tr '\n' ' ')" = "src/app/FunctionalHome.php src/assets/workspace-home.css "
          git -C product diff --check
          test "$(tr -d '\r\n' < product/src/VERSION.txt)" = "2.31.0"
          git -C product config user.name VictorForge
          git -C product config user.email llhzx2018@gmail.com
          git -C product add src/app/FunctionalHome.php src/assets/workspace-home.css
          git -C product commit -m "refine(P01): surface real health anomalies on Home"
          git -C product push origin "HEAD:${PRODUCT_BRANCH}"
          echo "NEW_SOURCE=$(git -C product rev-parse HEAD)"
          echo "NEW_TREE=$(git -C product rev-parse HEAD^{tree})"
          echo "VERSION=$(tr -d '\r\n' < product/src/VERSION.txt)"
          echo "OWNER_PRODUCTION_WRITE=NO"
          echo "RELEASE=NO"
