name: S01-C02 1065 public Head read-only verification
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  public-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: d3b98c05f4bdc621be311164072e7b7ee55517f2
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: target
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Exact release and public GET only
        run: |
          set -Eeuo pipefail
          mkdir -p evidence /tmp/vf-public
          test "$(git -C target rev-parse HEAD)" = d3b98c05f4bdc621be311164072e7b7ee55517f2
          test "$(cat target/VERSION)" = 1.21.1065
          curl --fail --silent --show-error --location --compressed --retry 1 --max-time 25 \
            --user-agent 'Mozilla/5.0 (compatible; VFSourcePublicReadOnly/1.0)' \
            --output /tmp/vf-public/home.html https://www3.m3u8.one/
          curl --fail --silent --show-error --location --compressed --retry 1 --max-time 25 \
            --user-agent 'Mozilla/5.0 (compatible; VFSourcePublicReadOnly/1.0)' \
            --output /tmp/vf-public/zh.html https://www3.m3u8.one/zh/
          php -l tests/temp-s01-c02-1065-public-head-readback.php
          php tests/temp-s01-c02-1065-public-head-readback.php /tmp/vf-public/home.html /tmp/vf-public/zh.html | tee evidence/public-head-proof.txt
          grep -F '"pass":true' evidence/public-head-proof.txt >/dev/null
          printf '%s\n' 'PUBLIC_READ_ONLY=PASS' > evidence/STATUS.txt
      - name: Upload audit evidence only, not captured page HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s01-c02-1065-public-head-proof
          path: evidence/
          retention-days: 14
