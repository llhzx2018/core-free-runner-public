name: TEMP P07 RC4 final exact candidate authority identity audit
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temp-p07-rc4-final-identity-authority-proof-20261126.yml
permissions:
  contents: read
jobs:
  paired-authority-and-archive:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.actor == 'llhzx2018' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'temp/p07-rc4-final-identity-authority-proof-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GOV_BASE: 'bc3d253fd146a1c9461e606de39f0c4ba7cc74c7'
      GOV_HEAD: 'f1360a911c8ce57a5de1b6e0e403692636440241'
      PRODUCT_SHA: '54c46dfa862a5c4a39020c1bd80a129bd992077b'
      ADOPTION_SHA: '05e485539a020cee2e6940386458ef5bd5ffbf2c'
    steps:
      - name: Checkout exact GOV proposal transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: f1360a911c8ce57a5de1b6e0e403692636440241
          fetch-depth: 0
          path: transient-gov
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Checkout exact product adoption transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 05e485539a020cee2e6940386458ef5bd5ffbf2c
          fetch-depth: 0
          path: transient-p07
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Exact identity and sealed authority diff
        shell: bash
        env:
          PR_BODY: |
            PUBLIC_AUTHORITY_IMPACT: UPDATED
            AFFECTED_DOMAINS: GIT,INSTALL,UPGRADE,TESTING,SECURITY,DATA_SCHEMA,UA_UI
            IMPACT_REASON: Owner-authorized Mode AC candidate source and byte identity correction only; every existing issuance, actual public-entry, package, rollback, recovery, security, Git and terminal UX gate retained. No sealed public body or distributed Skill change.
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C transient-gov rev-parse HEAD)" = "$GOV_HEAD"
          test "$(git -C transient-p07 rev-parse HEAD)" = "$ADOPTION_SHA"
          git -C transient-p07 merge-base --is-ancestor "$PRODUCT_SHA" b1cc11c5de22ce428d7ecefeec6bca2733a4c5af
          git -C transient-p07 diff --quiet "$PRODUCT_SHA" b1cc11c5de22ce428d7ecefeec6bca2733a4c5af
          test "$(git -C transient-p07 diff --name-only b1cc11c5de22ce428d7ecefeec6bca2733a4c5af "$ADOPTION_SHA")" = "docs/authority/ACCEPTANCE_MATRIX.md"
          python3 -B - <<'PY'
          import os,pathlib,subprocess
          g=pathlib.Path("transient-gov")
          p=pathlib.Path("transient-p07")
          paths=subprocess.check_output(["git","-C",str(g),"diff","--name-only",os.environ["GOV_BASE"],os.environ["GOV_HEAD"]],text=True).splitlines()
          assert set(paths)=={"CURRENT.md","skills/README.md","skills/skill-release/V3.29/SKILL.md","governance/release/cases/P07_M03_RC4_INDEPENDENT_RC3_MAINTENANCE_20261125.md"}
          old=(g/"skills/skill-release/V3.28/SKILL.md").read_bytes()
          new=(g/"skills/skill-release/V3.29/SKILL.md").read_bytes()
          assert new.endswith(old)
          case=(g/"governance/release/cases/P07_M03_RC4_INDEPENDENT_RC3_MAINTENANCE_20261125.md").read_text()
          current=(g/"CURRENT.md").read_text()
          matrix=(p/"docs/authority/ACCEPTANCE_MATRIX.md").read_text()
          rule=matrix.split("## RP-07AC",1)[1].split("\n## ",1)[0]
          assert "| skill-release | V3.29 |" in current
          assert "| skill-release | V3.29 | V2.6 |" in (g/"skills/README.md").read_text()
          assert os.environ["PRODUCT_SHA"] in current
          for text in (case,rule,new.decode()):
              for token in (os.environ["PRODUCT_SHA"],"85570da2d135e39ae3634e511298e50dede81015019e305c7de068e04ca93238","719295","3ab5b43f6f9e3431872f96bbfbffc83733f5b6a4","309e32a0acd3903b05b84f3204db07fb6f55d638"):
                  assert token in text
          before=subprocess.check_output(["git","-C",str(g),"show",os.environ["GOV_BASE"]+":governance/release/cases/P07_M03_RC4_INDEPENDENT_RC3_MAINTENANCE_20261125.md"],text=True)
          assert before.split("## Hard gates",1)[1]==case.split("## Hard gates",1)[1]
          previous=subprocess.check_output(["git","-C",str(p),"show","b1cc11c5de22ce428d7ecefeec6bca2733a4c5af:docs/authority/ACCEPTANCE_MATRIX.md"],text=True)
          assert previous.split("\n## P07 全模块终端 UX/UI 硬验收",1)[1]==matrix.split("\n## P07 全模块终端 UX/UI 硬验收",1)[1]
          print("P07_RC4_FINAL_PAIRED_IDENTITY_SCOPE=PASS")
          PY
          cd transient-gov
          python3 -B governance/public-authority/tools/global_closure_lint.py --git-base "$GOV_BASE" --git-head "$GOV_HEAD" >"$RUNNER_TEMP/gov-closure.log" 2>&1 || { echo GOV_CLOSURE=FAIL; exit 21; }
          python3 -B governance/public-authority/tools/current_dependency_lint.py --git-base "$GOV_BASE" --git-head "$GOV_HEAD" >"$RUNNER_TEMP/gov-dependency.log" 2>&1 || { echo GOV_DEPENDENCY=FAIL; exit 22; }
          echo P07_RC4_FINAL_GOV_CLOSURE_AND_DEPENDENCY=PASS
          cd ../transient-p07
          python3 -B scripts/check_p07_modules.py >"$RUNNER_TEMP/p07-modules.log" 2>&1 || { echo P07_MODULES=FAIL; exit 23; }
          echo P07_RC4_PRODUCT_STATIC_AUTHORITY=PASS
      - name: Erase transient private source
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          rm -rf -- "$GITHUB_WORKSPACE/transient-gov" "$GITHUB_WORKSPACE/transient-p07"
          rm -f -- "$RUNNER_TEMP/gov-closure.log" "$RUNNER_TEMP/gov-dependency.log" "$RUNNER_TEMP/p07-modules.log"
          test ! -e "$GITHUB_WORKSPACE/transient-gov"
          test ! -e "$GITHUB_WORKSPACE/transient-p07"
          echo P07_RC4_TRANSIENT_BYTES_REMOVED=PASS
