name: p01-category-two-level-native-oneoff
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-jobs-owner-audit-oneoff.yml']
permissions:
  contents: read
concurrency:
  group: p01-jobs-owner-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  source-and-jobs-ui:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      P01_SHA: e653de20af36334e5dab7af81999ccc55d1f1b09
    steps:
      - name: Checkout public disposable control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Provision native PHP and SQLite
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd >/dev/null
          php -m | grep -i -Fx pdo_sqlite
          echo P01_JOBS_NATIVE_PHP_SQLITE=PASS
      - name: Checkout exact private P01 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: e653de20af36334e5dab7af81999ccc55d1f1b09
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout stable formal P01 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: v2.47.388
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: stable
          persist-credentials: false
          fetch-depth: 1
      - name: Navigation category strict depth and existing editor regression
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$P01_SHA"
          php -l candidate/src/app/Repository.php
          php -l candidate/tests/unit/category_two_level_depth_native.php
          node --check candidate/src/assets/category-admin.js
          php candidate/tests/unit/category_two_level_depth_native.php
          php candidate/tests/unit/navigation_category_sort_v247263_contract.php
          php candidate/tests/unit/category_search_accordion_keyboard_v247326_contract.php
          php candidate/tests/unit/navigation_category_editor_v247265_contract.php
          php candidate/tests/unit/navigation_category_runtime_binding_v247264_contract.php
          php candidate/tests/unit/admin_navigation_categories_page4_polish_contract.php
          echo P01_CATEGORY_TWO_LEVEL_FOCUSED=PASS
      - name: Canonical stable to candidate no-debt regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate stable --require-zero-debt | tee /tmp/p01-jobs-canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/p01-jobs-canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/p01-jobs-canonical.txt
          echo P01_CATEGORY_CANONICAL_ZERO_DEBT=PASS
      - name: Destroy temporary private source
        if: always()
        shell: bash
        run: rm -rf candidate stable
