name: p01-all-resources-privacy-confirm-oneoff
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-jobs-owner-audit-oneoff.yml']
permissions:
  contents: read
concurrency:
  group: p01-jobs-owner-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  source-and-jobs-ui:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      P01_SHA: fb23e191787cafadb43027a1a3fb6094c221a4d5
    steps:
      - name: Checkout public disposable control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Provision native PHP and SQLite
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd >/dev/null
          php -m | grep -i -Fx pdo_sqlite
          echo P01_JOBS_NATIVE_PHP_SQLITE=PASS
      - name: Checkout exact private P01 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: fb23e191787cafadb43027a1a3fb6094c221a4d5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout stable formal P01 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: v2.47.388
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: stable
          persist-credentials: false
          fetch-depth: 1
      - name: All Resources batch-public permission and UI contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$P01_SHA"
          php -l candidate/src/surface-manager.php
          php -l candidate/tests/unit/all_resources_public_confirm_native.php
          node --check candidate/src/assets/admin-resource-manager-core.js
          node --check candidate/tests/unit/all_resources_public_confirm_native.cjs
          php candidate/tests/unit/all_resources_public_confirm_native.php
          php candidate/tests/unit/all_resources_editor_state_contract.php
          php candidate/tests/unit/all_resources_page_visual_closure_contract.php
          php candidate/tests/unit/all_resources_v247261_closure_contract.php
          php candidate/tests/unit/admin_all_resources_mature_list_contract.php
          php candidate/tests/unit/admin_all_resources_page3_polish_contract.php
          echo P01_ALL_RESOURCES_PUBLIC_CONFIRM_FOCUSED=PASS
      - name: Canonical stable to candidate no-debt regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate stable --require-zero-debt | tee /tmp/p01-jobs-canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/p01-jobs-canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/p01-jobs-canonical.txt
          echo P01_ALL_RESOURCES_CANONICAL_ZERO_DEBT=PASS
      - name: Destroy temporary private source
        if: always()
        shell: bash
        run: rm -rf candidate stable
