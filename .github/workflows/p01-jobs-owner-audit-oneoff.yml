name: p01-online-update-owner-audit-oneoff
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-jobs-owner-audit-oneoff.yml']
permissions:
  contents: read
concurrency:
  group: p01-jobs-owner-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  source-and-jobs-ui:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      P01_SHA: 9407903e9511b80e6ad540fde70c0e7baaeff63d
    steps:
      - name: Checkout public disposable control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Provision native PHP and SQLite
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd >/dev/null
          php -m | grep -i -Fx pdo_sqlite
          echo P01_JOBS_NATIVE_PHP_SQLITE=PASS
      - name: Checkout exact private P01 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 9407903e9511b80e6ad540fde70c0e7baaeff63d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout stable formal P01 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: v2.47.387
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: stable
          persist-credentials: false
          fetch-depth: 1
      - name: Online Update owner release notes, readback and safety contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$P01_SHA"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = 2.47.387
          php -l candidate/src/update.php
          php -l candidate/tests/unit/update_release_notes_progressive_native.php
          node --check candidate/src/assets/update-core.js
          node --check candidate/tests/unit/update_release_notes_progressive_native.cjs
          php candidate/tests/unit/update_release_notes_progressive_native.php
          node candidate/tests/unit/update_check_stale_install_native.cjs
          php candidate/tests/unit/admin_update_page12_polish_contract.php
          php candidate/tests/unit/admin_update_chinese_consistency_v247275_contract.php
          php candidate/tests/unit/admin_update_owner_facing_chinese_v247276_contract.php
          php candidate/tests/unit/admin_update_public_copy_r72_contract.php
          echo P01_UPDATE_HUMAN_RELEASE_NOTES_FOCUSED=PASS
      - name: Canonical stable to candidate no-debt regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate stable --require-zero-debt | tee /tmp/p01-jobs-canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/p01-jobs-canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/p01-jobs-canonical.txt
          echo P01_UPDATE_CANONICAL_ZERO_DEBT=PASS
      - name: Destroy temporary private source
        if: always()
        shell: bash
        run: rm -rf candidate stable
