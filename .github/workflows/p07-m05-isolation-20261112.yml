name: P07 independent M05 candidate runtime
on:
  push:
    branches:
      - task/p07-m05-isolation-20261112
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  exact-source-m05:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      P07_SOURCE_SHA: b5c97037e427a6a514eabed3a463a630c2798441
    steps:
      - name: Checkout private P07 exact commit transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: b5c97037e427a6a514eabed3a463a630c2798441
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product
      - name: Isolated module M05 build, version, negative scope and rollback regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C product rev-parse HEAD)" = "$P07_SOURCE_SHA"
          python3 -B -m compileall -q product/scripts/build_p07_m05_bundle.py product/scripts/install_p07_m05_bundle.py product/tests/test_p07_m05_isolated_module.py
          bash -n product/bin/vfops-init-entry product/bin/vfops-init-core product/bin/vfops-init-ui
          (cd product && python3 -B -m unittest -v tests.test_p07_module_contract tests.test_p07_m05_isolated_module)
          echo P07_M05_INDEPENDENT_PACKAGE_TEST=PASS
          echo P07_OTHER_MODULES_TOUCH=NONE_SYNTHETIC
          echo P07_FORMAL_RELEASE=NO
          echo P07_VPS_MIGRATION=NOT_RUN
      - name: Always delete transient private checkout and bundles
        if: always()
        shell: bash
        run: |
          rm -rf -- product
          echo P07_M05_TEST_PRIVATE_CLEANUP=YES
