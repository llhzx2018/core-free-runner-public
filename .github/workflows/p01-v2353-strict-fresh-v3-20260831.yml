name: P01 V2.35.3 Strict Fresh V3
on:
  push:
    branches: [release/p01-v2353-strict-fresh-20260831]
    paths: [.github/workflows/p01-v2353-strict-fresh-v3-20260831.yml]
permissions:
  contents: read
  actions: read
jobs:
  strict-fresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      FORMAL_RUN: '33359124042'
      FORMAL_ARTIFACT: p01-v2353-formal-artifacts-33359124042
      FORMAL: 8f1073120f8096fc23554906615601752feb036d
      FORMAL_TREE: ece02ef928ad5b119e2b0237e7963a607865ddbb
      FORMAL_RUNTIME_TREE: 7f181909c7ccd3179491f21cfca426008de4295f
      SCHEMA: '2026082901'
      DOWNLOAD: /tmp/p01-v2353-strict-v3-download
      FRESH: /tmp/p01-v2353-strict-v3-fresh
      EVID: /tmp/p01-v2353-strict-v3-evidence
      COOKIE: /tmp/p01-v2353-strict-v3.cookies
      PORT: '18462'
      ADMIN_PASS: V2353StrictFreshV3
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - name: Exact Formal bytes and package identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf "$DOWNLOAD" "$FRESH" "$EVID" "$COOKIE"; mkdir -p "$DOWNLOAD" "$FRESH" "$EVID"
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$FORMAL_RUN --jq .conclusion)" = success
          gh run download "$FORMAL_RUN" -R llhzx2018/core-free-runner-public -n "$FORMAL_ARTIFACT" -D "$DOWNLOAD"
          FULL=$(find "$DOWNLOAD" -type f -name 'VF-Start-V2.35.3-FULL.zip' -print -quit); test -n "$FULL"; ART_DIR=$(dirname "$FULL")
          test "$(sha256sum "$ART_DIR/VF-Start-V2.35.3-FULL.zip"|awk '{print $1}')" = e0197da4a4d3ca3d9e1fd1fec97712340c4045ed94ba33e22be64e4281d72aaf
          test "$(sha256sum "$ART_DIR/VF_Start_V2.35.3_UPDATE.zip"|awk '{print $1}')" = ca128a49c56901fe4ea7c108b7b78bde25584973362bf22e6fdc874782b390c9
          (cd "$ART_DIR" && sha256sum -c SHA256SUMS.txt) | tee "$EVID/sha256.txt"
          jq -e '.status=="FORMAL_ARTIFACT_GATE_PASS" and .formal_source=="8f1073120f8096fc23554906615601752feb036d" and .formal_tree=="ece02ef928ad5b119e2b0237e7963a607865ddbb" and .runtime_tree=="7f181909c7ccd3179491f21cfca426008de4295f" and .schema=="2026082901" and .migration==null' "$ART_DIR/P01-V2.35.3-ARTIFACT-GATE.json" >/dev/null
          unzip -q "$FULL" -d "$FRESH"
          test "$(cat "$FRESH/VERSION.txt")" = 2.35.3
          grep -Fx "define('VF_VERSION', '2.35.3');" "$FRESH/app/bootstrap.php" >/dev/null
          find "$FRESH" -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/p01-v2353-v3-php.txt
          find "$FRESH/assets" -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          grep -F '#installUpdate[hidden]' "$FRESH/assets/admin-consolidation.css" >/dev/null
          grep -F 'syncShellVersion' "$FRESH/assets/update-core.js" >/dev/null
          grep -F 'vfUpdateHardReloadScheduled' "$FRESH/assets/update-reload.js" >/dev/null
          echo P01_V2353_STRICT_V3_FORMAL_BYTES=PASS | tee "$EVID/formal.txt"
      - name: Fresh install, zero data, routing
        shell: bash
        run: |
          set -Eeuo pipefail
          php -S 127.0.0.1:$PORT -t "$FRESH" >"$EVID/server.log" 2>&1 & echo $! >/tmp/p01-v2353-strict-v3.pid
          for i in $(seq 1 60); do curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:$PORT/setup.php" -o "$EVID/setup.html" && break; sleep .25; done
          CSRF=$(python3 - "$EVID/setup.html" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:$PORT/setup.php" --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=V2353 Strict V3' --data-urlencode "admin_password=$ADMIN_PASS" --data-urlencode "admin_password_confirm=$ADMIN_PASS" -o "$EVID/setup-post.html"
          php "$FRESH/cli/verify.php" | tee "$EVID/verify.txt" | grep -Fx VERIFY_PASS=YES
          php "$FRESH/cli/surface-verify.php" | tee "$EVID/surface.txt" | grep -Fx CURRENT_DOMAIN_PASS=YES
          ROOT="$FRESH" php <<'PHP' | tee "$EVID/database.txt"
          <?php require getenv('ROOT').'/app/bootstrap.php';$d=vf_db();foreach(['categories','links','import_batches','backup_records','operation_history'] as $t){$n=(int)$d->query("SELECT COUNT(*) FROM $t")->fetchColumn();echo "$t=$n\n";if($n!==0)exit(10);}if(strtolower((string)$d->query('PRAGMA integrity_check')->fetchColumn())!=='ok')exit(11);if($d->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC))exit(12);echo "P01_V2353_STRICT_V3_ZERO_DATA=PASS\nP01_V2353_STRICT_V3_SQLITE=PASS\n";
          PHP
          rm -f "$COOKIE"
          curl -fsS -c "$COOKIE" -b "$COOKIE" -H 'Content-Type: application/json' -H 'Accept: application/json' -X POST "http://127.0.0.1:$PORT/api.php?action=login" --data "{\"password\":\"$ADMIN_PASS\"}" | tee "$EVID/login.json" | jq -e '.ok==true' >/dev/null
          curl -sS -D "$EVID/root.headers" -o /dev/null -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:$PORT/"
          tr -d '\r' < "$EVID/root.headers" > "$EVID/root.headers.normalized"
          test "$(awk 'NR==1{print $2}' "$EVID/root.headers.normalized")" = 302
          grep -Fqx 'Location: home.php' "$EVID/root.headers.normalized"
          : > "$EVID/http-codes.txt"
          for page in home.php start.php channels.php watch.php topics.php update.php; do code=$(curl -sS -o "$EVID/${page%.php}.html" -w '%{http_code}' -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:$PORT/$page"); echo "$page=$code" | tee -a "$EVID/http-codes.txt"; test "$code" = 200; done
          printf 'P01_V2353_STRICT_V3_ROOT_REDIRECT=PASS\nP01_V2353_STRICT_V3_FIVE_DOMAIN_HTTP=PASS\nP01_V2353_STRICT_V3_UPDATE_HTTP=PASS\n' | tee "$EVID/http.txt"
      - name: Packaged Chromium terminal state
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-v2353-strict-v3-pw; cd /tmp/p01-v2353-strict-v3-pw
          npm init -y >/dev/null 2>&1; npm install playwright@1.55.0 >/dev/null 2>&1; npx playwright install --with-deps chromium >/dev/null 2>&1
          cat >gate.cjs <<'JS'
          const {chromium}=require('playwright');const base='http://127.0.0.1:18462/';const status={ok:true,status:{current_version:'2.35.3',latest_version:'2.35.3',available:false,can_update:false,current_withdrawn:false,reason:'当前已经是最新版本。',update_priority:'normal',last_check_at:'2026-08-31T05:30:00Z',history:[],release_notes:{summary:'V2.35.3'}}};(async()=>{const b=await chromium.launch({headless:true});const c=await b.newContext({viewport:{width:1440,height:900}});let q=await c.request.post(base+'api.php?action=login',{data:{password:'V2353StrictFreshV3'}});if(!q.ok()||!(await q.json()).ok)throw Error('login');const p=await c.newPage();await p.route('**/api.php?action=update_status',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify(status)}));await p.goto(base+'update.php',{waitUntil:'networkidle'});await p.waitForTimeout(150);const read=()=>p.evaluate(()=>{const x=document.getElementById('installUpdate'),s=document.getElementById('updateSteps'),e=document.getElementById('updateError');return{current:document.getElementById('updateCurrent')?.textContent||'',latest:document.getElementById('updateLatest')?.textContent||'',state:document.getElementById('updateState')?.textContent||'',footer:document.querySelector('.vf-rail-footer')?.textContent||'',hidden:!!x?.hidden,disabled:!!x?.disabled,display:x?getComputedStyle(x).display:'',stepsHidden:!!s?.hidden,stepsDisplay:s?getComputedStyle(s).display:'',errorShown:!!e?.classList.contains('show'),overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}});let m=await read();if(m.current!=='V2.35.3'||m.latest!=='V2.35.3'||m.footer!=='VF Start · V2.35.3'||!m.hidden||!m.disabled||m.display!=='none'||!m.stepsHidden||m.stepsDisplay!=='none'||m.errorShown||!m.state.includes('最新')||m.overflow>1)throw Error('desktop '+JSON.stringify(m));await p.evaluate(()=>{document.getElementById('installUpdate').style.display='flex';document.getElementById('updateSteps').style.display='grid'});m=await read();if(m.display!=='none'||m.stepsDisplay!=='none')throw Error('legacy '+JSON.stringify(m));await p.screenshot({path:process.env.EVID+'/terminal-1440.png',fullPage:true});await p.setViewportSize({width:390,height:844});await p.waitForTimeout(100);m=await read();if(m.display!=='none'||m.footer!=='VF Start · V2.35.3'||m.overflow>1)throw Error('mobile '+JSON.stringify(m));await p.screenshot({path:process.env.EVID+'/terminal-390.png',fullPage:true});await b.close();console.log('P01_V2353_STRICT_V3_CHROMIUM=PASS')})().catch(e=>{console.error(e);process.exit(1)});
          JS
          EVID="$EVID" node gate.cjs | tee "$EVID/chromium.txt"
          grep -Fx P01_V2353_STRICT_V3_CHROMIUM=PASS "$EVID/chromium.txt"
      - name: Final verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fx P01_V2353_STRICT_V3_FORMAL_BYTES=PASS "$EVID/formal.txt"
          grep -Fx P01_V2353_STRICT_V3_ZERO_DATA=PASS "$EVID/database.txt"
          grep -Fx P01_V2353_STRICT_V3_SQLITE=PASS "$EVID/database.txt"
          grep -Fx P01_V2353_STRICT_V3_FIVE_DOMAIN_HTTP=PASS "$EVID/http.txt"
          grep -Fx P01_V2353_STRICT_V3_CHROMIUM=PASS "$EVID/chromium.txt"
          printf 'P01_V2353_STRICT_FRESH_GATE=PASS\nFORMAL=%s\nTREE=%s\nRUNTIME_TREE=%s\nSCHEMA=%s\nOWNER_PRODUCTION_WRITE=NO\n' "$FORMAL" "$FORMAL_TREE" "$FORMAL_RUNTIME_TREE" "$SCHEMA" | tee "$EVID/verdict.txt"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2353-strict-fresh-v3-${{ github.run_id }}
          path: /tmp/p01-v2353-strict-v3-evidence
          if-no-files-found: error
          retention-days: 90
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/p01-v2353-strict-v3.pid 2>/dev/null)" 2>/dev/null || true
