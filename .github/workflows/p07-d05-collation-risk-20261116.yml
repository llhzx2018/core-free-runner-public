name: P07 D05 visible collation risk native evidence TEMP
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-d05-collation-risk-20261116.yml'
permissions:
  contents: read
jobs:
  d05-collation-audit:
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - name: Checkout public runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact P07 private source (transient)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: a654447b459d1e61786a38d59c112494e3ab8fef
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: .private-p07-d05-audit
      - name: GOV-DOC current architecture checker (transient)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: .private-gov-d05-audit
      - name: Exact-source unit, module and architecture
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          test "$(git -C .private-p07-d05-audit rev-parse HEAD)" = a654447b459d1e61786a38d59c112494e3ab8fef
          cd .private-p07-d05-audit
          export PYTHONPATH="$PWD/lib"
          python3 -B -m unittest discover -s tests -p test_p07_m03_d05_collation_audit.py -v
          python3 -B .github/checks/test_architecture_gate.py
          python3 -B .github/checks/architecture_gate.py \
            --manifest .github/checks/code_architecture.json \
            --gov-root ../.private-gov-d05-audit --git-root . \
            --base-sha 88ccd02d79b017e35bcac8c5e9322864a569666e --head-sha a654447b459d1e61786a38d59c112494e3ab8fef
          python3 -B scripts/check_p07_modules.py --module P07-M03-D05 \
            --pr-title 'P07-M03-D05 数据库引擎转换：排序规则只读兼容审计' \
            --changed-file lib/db_engine_conversion_collation_audit.py \
            --changed-file bin/vfops-db-convert-plan.py \
            --affected P07-M03-D05 --shared-reason 'D05 本模块只读风险统计'
          python3 -B scripts/check_p07_terminal_ux.py \
            --module P07-M03-D05 \
            --changed-file bin/vfops-db-convert-plan.py \
            --evidence-file docs/ux-reviews/p07-m03-d05-collation-audit-v1.json
          echo P07_D05_COLLATION_SOURCE_GATES=PASS
      - name: Real MariaDB 11.8 to MySQL 8.4 synthetic collation metadata
        shell: bash
        env:
          P07_ALLOW_SYNTHETIC_D05: '1'
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          cd .private-p07-d05-audit
          export PYTHONPATH="$PWD/lib"
          timeout --signal=TERM --kill-after=10s 420s \
            python3 -B -m unittest discover -s tests -p test_p07_m03_d05_collation_native.py -v
          echo P07_D05_COLLATION_NATIVE_SYNTHETIC=PASS
      - name: Full cumulative PR base architecture gate (must remain enforced)
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -Eeuo pipefail
          cd .private-p07-d05-audit
          python3 -B .github/checks/architecture_gate.py \
            --manifest .github/checks/code_architecture.json \
            --gov-root ../.private-gov-d05-audit --git-root . \
            --base-sha 905599e8ca6ac6fd766856c35301328388b3eb81 --head-sha a654447b459d1e61786a38d59c112494e3ab8fef
      - name: Always clean private source, GOV and owned synthetic containers
        if: always()
        shell: bash
        run: |
          set +e
          docker ps -aq --filter 'label=org.kewaro.p07.d05.synthetic' | xargs -r docker rm -f >/dev/null 2>&1
          rm -rf -- .private-p07-d05-audit .private-gov-d05-audit
          test ! -e .private-p07-d05-audit
          test ! -e .private-gov-d05-audit
          echo P07_D05_TEMP_PRIVATE_CLEAN=PASS
