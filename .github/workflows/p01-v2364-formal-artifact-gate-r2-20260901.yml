name: P01 V2.36.4 Formal Artifact Gate R2
on:
  push:
    branches: [release/p01-v2364-candidate-20260901]
    paths: [.github/workflows/p01-v2364-formal-artifact-gate-r2-20260901.yml]
permissions:
  contents: read
jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      FORMAL: 6b321422bce5a834521786d8233149c7624aa014
      FORMAL_TREE: 86c01bf1b5ee7c3ad3954e6ab9485734cb744d05
      FORMAL_RUNTIME_TREE: e1ee914a6d9e61bac7931b1f5363a8c7e24e925a
      MAIN_EXPECTED: d35038c32b5a287636ee92d9fe074ea12c1469ef
      DEVELOP_EXPECTED: 5615d19b07303132e8fc2e374de1236a37f3cb16
      SOURCE: 718e043e3715ef7b21849bc08634fca89bf92c1f
      SOURCE_TREE: 32e8afdd6d7cdd338c62fdafaedb200b127ca881
      SOURCE_RUNTIME_TREE: 820724b585cb59864211f77c4fb33537b2345029
      VERSION: 2.36.4
      SOURCE_VERSION: 2.36.3
      SCHEMA: '2026082901'
      CANDIDATE_GATE: '33518274633'
      CANDIDATE_ARTIFACT: '9804570473'
      CANDIDATE_DIGEST: d092acb2892308d3c481196e77c4edd0a2ed720bff3458067d6ad85acf7cdddb
      FORMAL_R1_RUN: '33519392124'
      FORMAL_R1_FULL_BYTES: '587272'
      FORMAL_R1_FULL_SHA: 552e3a0dc4de3e782de27dfa71943ca69a28ee5169b4aed33a221a45704c6a24
      FORMAL_R1_UPDATE_BYTES: '1237066'
      FORMAL_R1_UPDATE_SHA: ebb746554c95abb9f2fa77ce8ac6f41c280016c66e03f331149fd1d93370958b
      FORMAL_R1_REPAIR_BYTES: '3592809'
      FORMAL_R1_REPAIR_SHA: cdd7cefb0a4361f7e65fc2849156355e9b5a78401a862e9f74a9c64f817c44ee
      OUT: /tmp/p01-v2364-formal-artifacts
      EVID: /tmp/p01-v2364-formal-evidence
      UPGRADE: /tmp/p01-v2364-formal-upgrade
    steps:
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: release/p01-v2364-candidate-20260901
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 71c0ddf946974a6d6ac75bc629ffc07256eb9e4f
          path: template
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.FORMAL }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: formal
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.36.3
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: production
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: agent/p01-22121-formal-artifact-gate-20260819
          path: proven
      - name: Verify prior candidate and classify R1 harness-only failure
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, urllib.request
          c=json.load(urllib.request.urlopen('https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/runs/33518274633'))
          if c.get('conclusion')!='success': raise SystemExit('candidate readiness is not PASS')
          arts=json.load(urllib.request.urlopen('https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/runs/33518274633/artifacts'))
          a=[x for x in arts.get('artifacts',[]) if x.get('id')==9804570473]
          if len(a)!=1 or a[0].get('digest')!='sha256:d092acb2892308d3c481196e77c4edd0a2ed720bff3458067d6ad85acf7cdddb' or a[0].get('expired'):
              raise SystemExit('candidate artifact evidence drift')
          r1=json.load(urllib.request.urlopen('https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/runs/33519392124'))
          if r1.get('conclusion')!='failure': raise SystemExit('formal R1 classification source drift')
          print('PRIOR_EVIDENCE=PASS')
          print('R1_CLASSIFICATION=HARNESS_ONLY_STAGE_IDENTITY_POLICY')
          PY
      - name: Generate fenced formal gates
        run: python3 runner/scripts/p01_v2364_formal_gate_generate.py
      - name: Exact formal fence
        run: bash /tmp/p01-v2364-formal-generated/01-exact.sh
      - name: Build deterministic formal release artifacts
        run: bash /tmp/p01-v2364-formal-generated/02-build.sh
      - name: Formal stage transition and cross-run determinism fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(stat -c%s "$OUT/VF-Start-V2.36.4-FULL.zip")" = "$FORMAL_R1_FULL_BYTES"
          test "$(sha256sum "$OUT/VF-Start-V2.36.4-FULL.zip" | awk '{print $1}')" = "$FORMAL_R1_FULL_SHA"
          test "$(stat -c%s "$OUT/VF_Start_V2.36.4_UPDATE.zip")" = "$FORMAL_R1_UPDATE_BYTES"
          test "$(sha256sum "$OUT/VF_Start_V2.36.4_UPDATE.zip" | awk '{print $1}')" = "$FORMAL_R1_UPDATE_SHA"
          test "$(stat -c%s "$OUT/repair-v2.36.4.php")" = "$FORMAL_R1_REPAIR_BYTES"
          test "$(sha256sum "$OUT/repair-v2.36.4.php" | awk '{print $1}')" = "$FORMAL_R1_REPAIR_SHA"
          rm -rf /tmp/p01-v2364-formal-full-check
          mkdir -p /tmp/p01-v2364-formal-full-check
          unzip -qq "$OUT/VF-Start-V2.36.4-FULL.zip" -d /tmp/p01-v2364-formal-full-check
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          root=pathlib.Path('/tmp/p01-v2364-formal-full-check')
          m=json.loads((root/'release-manifest.json').read_text(encoding='utf-8'))
          expected={
            'project_id':'P01','version':'2.36.4','source_version':'2.36.3',
            'schema_version':'2026082901','source_schema_version':'2026082901',
            'release_type':'formal','stage':'FORMAL_ARTIFACT_GATE',
            'deployable':True,'release_authorized':True,
            'formal_source_commit':'6b321422bce5a834521786d8233149c7624aa014',
            'formal_source_tree':'86c01bf1b5ee7c3ad3954e6ab9485734cb744d05',
            'runtime_source_tree':'e1ee914a6d9e61bac7931b1f5363a8c7e24e925a',
            'production_source_commit':'718e043e3715ef7b21849bc08634fca89bf92c1f',
            'production_source_tree':'32e8afdd6d7cdd338c62fdafaedb200b127ca881',
            'production_runtime_tree':'820724b585cb59864211f77c4fb33537b2345029',
            'candidate_gate':33518274633,'candidate_artifact':9804570473,
            'candidate_digest':'d092acb2892308d3c481196e77c4edd0a2ed720bff3458067d6ad85acf7cdddb',
            'schema_change':False,'runtime_data_included':False,
          }
          for k,v in expected.items():
              if m.get(k)!=v: raise SystemExit(f'formal manifest drift {k}: {m.get(k)!r}')
          if m.get('schema_migrations')!=[]: raise SystemExit('unexpected migration')
          if 'candidate_source_commit' in m: raise SystemExit('candidate source leaked into formal manifest')
          runtime=m.get('runtime_files') or {}
          if not runtime: raise SystemExit('runtime_files empty')
          for rel,want in runtime.items():
              p=root/rel
              if not p.is_file(): raise SystemExit('formal package missing runtime file '+rel)
              got=hashlib.sha256(p.read_bytes()).hexdigest()
              if got!=want: raise SystemExit('formal package runtime hash mismatch '+rel)
          src=pathlib.Path('formal/src')
          for rel,want in runtime.items():
              p=src/rel
              if not p.is_file(): raise SystemExit('formal source missing runtime file '+rel)
              got=hashlib.sha256(p.read_bytes()).hexdigest()
              if got!=want: raise SystemExit('formal source/package identity mismatch '+rel)
          repair=pathlib.Path(os.environ['OUT'])/'repair-v2.36.4.php'
          s=repair.read_text(encoding='utf-8')
          for needle in ["SOURCE_VERSION = '2.36.3'","TARGET_VERSION = '2.36.4'","SOURCE_SCHEMA = '2026082901'","TARGET_SCHEMA = '2026082901'"]:
              if needle not in s: raise SystemExit('repair contract drift: '+needle)
          print('FORMAL_STAGE_TRANSITION_IDENTITY=PASS')
          print('FORMAL_CROSS_RUN_DETERMINISM=PASS')
          print('FORMAL_RUNTIME_PAYLOAD_EXACT=PASS')
          PY
          printf 'FORMAL_STAGE_TRANSITION_IDENTITY=PASS\nFORMAL_CROSS_RUN_DETERMINISM=PASS\nFORMAL_RUNTIME_PAYLOAD_EXACT=PASS\nR1_FAILURE_CLASSIFICATION=HARNESS_ONLY\n' | tee "$EVID/stage-transition-identity.txt"
      - name: Actual formal V2.36.3 to V2.36.4 upgrade
        run: bash /tmp/p01-v2364-formal-generated/03-atomic.sh
      - name: Final formal verdict
        shell: bash
        run: |
          printf 'P01_V2364_FORMAL_ARTIFACT_GATE_R2=PASS\nFORMAL=%s\nTREE=%s\nRUNTIME_TREE=%s\nSCHEMA=%s\nMIGRATION=NONE\nCANDIDATE_GATE=%s/PASS\nFORMAL_CROSS_RUN_DETERMINISM=PASS\nFORMAL_RUNTIME_PAYLOAD_EXACT=PASS\nFORMAL_STAGE_TRANSITION_IDENTITY=PASS\nATOMIC_2363_TO_2364=PASS\nR1_FAILURE=HARNESS_ONLY_STAGE_IDENTITY_POLICY\nOWNER_PRODUCTION_WRITE=NO\n' "$FORMAL" "$FORMAL_TREE" "$FORMAL_RUNTIME_TREE" "$SCHEMA" "$CANDIDATE_GATE" | tee "$EVID/verdict.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-v2364-formal-artifacts-r2-${{ github.run_id }}
          path: |
            /tmp/p01-v2364-formal-artifacts
            /tmp/p01-v2364-formal-evidence
          if-no-files-found: error
          retention-days: 90
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/p01-v2364-formal.pid 2>/dev/null)" 2>/dev/null || true
