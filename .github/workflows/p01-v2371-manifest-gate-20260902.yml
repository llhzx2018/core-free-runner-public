name: P01 V2.37.1 Manifest Gate R3
on:
  push:
    branches: [release/p01-v2371-hotfix-20260902]
    paths: [.github/workflows/p01-v2371-manifest-gate-20260902.yml]
permissions:
  actions: read
  contents: read
jobs:
  manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CORE_MAIN: 7a365c1aacb2c8047aa5f47127b02c1a3cca7072
      CORE_CANDIDATE: 6cf4dbbd8e61af1988d401f98a6c451331c9c786
      RELEASE_ID: '380993116'
      UPDATE_ASSET_ID: '540667167'
      UPDATE_BYTES: '1270892'
      UPDATE_SHA: 9422135d4f91e937f5fa93ae1aef9a991ae858aa304150a81719547a78cdbd09
      FORMAL_SOURCE: 0838e47ec49bb961131da81b0b314ebf77f1e126
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: main
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: live
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: release/p01-v2371-update-channel-20260902
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: candidate
      - name: Exact channel boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C live rev-parse HEAD)" = "$CORE_MAIN"
          test "$(git -C candidate rev-parse HEAD)" = "$CORE_CANDIDATE"
          test "$(git -C candidate rev-parse HEAD^)" = "$CORE_MAIN"
          test "$(git -C candidate diff --name-only "$CORE_MAIN" HEAD)" = projects/P01.json
          jq -e '.current_version=="2.36.5" and .target_version=="2.37.0" and .from_versions==["2.36.5"] and .schema_from=="2026082901" and .schema_to=="2026082901"' live/projects/P01.json >/dev/null
          jq -e '.current_version=="2.37.0" and .target_version=="2.37.1" and .from_versions==["2.37.0"] and .update_type=="ATOMIC" and .schema_from=="2026082901" and .schema_to=="2026082901" and .release_tag=="v2.37.1" and .release_id==380993116 and .product_identity=="0838e47ec49bb961131da81b0b314ebf77f1e126" and .asset_name=="VF_Start_V2.37.1_UPDATE.zip" and .asset_bytes==1270892 and .asset_sha256=="9422135d4f91e937f5fa93ae1aef9a991ae858aa304150a81719547a78cdbd09"' candidate/projects/P01.json >/dev/null
          if jq -e '.from_versions|index("2.36.5")' candidate/projects/P01.json >/dev/null; then echo 'cross-grade path detected' >&2; exit 21; fi
          printf 'MANIFEST_R1=HARNESS_ONLY_CORE_UPDATES_AUTH\nMANIFEST_R2=HARNESS_ONLY_VF_START_RELEASE_AUTH\nEXACT_SINGLE_FILE=PASS\nOLD_LIVE_2365_TO_2370=PASS\nNEW_STRICT_2370_TO_2371=PASS\nNO_CROSS_GRADE=PASS\nSCHEMA_CHANGE=NO\nMIGRATION=NONE\n' | tee /tmp/p01-v2371-manifest-boundary.txt
      - name: Release and frozen asset readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          REL="$(gh api repos/llhzx2018/vf-start/releases/$RELEASE_ID)"
          test "$(jq -r .tag_name <<<"$REL")" = v2.37.1
          test "$(jq -r .draft <<<"$REL")" = false
          test "$(jq -r .prerelease <<<"$REL")" = false
          A="$(jq -c '.assets[]|select(.id==540667167)' <<<"$REL")"
          test "$(jq -r .name <<<"$A")" = VF_Start_V2.37.1_UPDATE.zip
          test "$(jq -r .size <<<"$A")" = "$UPDATE_BYTES"
          test "$(jq -r .digest <<<"$A")" = "sha256:$UPDATE_SHA"
          gh api -H 'Accept: application/octet-stream' repos/llhzx2018/vf-start/releases/assets/$UPDATE_ASSET_ID > /tmp/v2371-update.zip
          test "$(stat -c%s /tmp/v2371-update.zip)" = "$UPDATE_BYTES"
          test "$(sha256sum /tmp/v2371-update.zip | cut -d' ' -f1)" = "$UPDATE_SHA"
          unzip -t /tmp/v2371-update.zip >/dev/null
          printf 'RELEASE_READBACK=PASS\nUPDATE_DOWNLOAD=PASS\nUPDATE_BYTES=%s\nUPDATE_SHA=%s\nFORMAL_SOURCE=%s\nOWNER_PRODUCTION_WRITE=NO\n' "$UPDATE_BYTES" "$UPDATE_SHA" "$FORMAL_SOURCE" | tee /tmp/p01-v2371-manifest-release.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-v2371-manifest-gate-r3-${{ github.run_id }}
          path: |
            /tmp/p01-v2371-manifest-boundary.txt
            /tmp/p01-v2371-manifest-release.txt
          if-no-files-found: warn
          retention-days: 90
