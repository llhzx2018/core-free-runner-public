name: P05 Post-v1.2.2 Current Truth Writer

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p05-post-v122-current-truth-writer.yml'

permissions:
  contents: read

jobs:
  write-current-truth:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      P05_BASE: 5f1deb37a7f8b3828bd9617b6a0a14f045a3e096
      P05_BASE_TREE: a467ab0a90656312bd297dfd5ecb51da396990b6
      P05_BRANCH: docs/p05-post-v122-update-bootstrap-current-truth-20260902
      P05_REPO: llhzx2018/vf-seo
      P05_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Checkout exact private P05 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: docs/p05-post-v122-update-bootstrap-current-truth-20260902
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact starting truth
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_BASE"
          test "$(git rev-parse HEAD^{tree})" = "$P05_BASE_TREE"
          test "$(cat VERSION)" = '1.2.2'
          node -e "const p=require('./package.json'); if(p.version!=='1.2.2') process.exit(1)"
          git hash-object docs/authority/RELEASE_V1.2.2_PRODUCTION_CLOSURE.md > /tmp/closure.hash
          git hash-object docs/authority/RELEASE_V1.2.2_CANDIDATE.md > /tmp/candidate.hash
          echo P05_POST_V122_CURRENT_TRUTH_BASE=PASS

      - name: Write exact current truth only
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          MAIN='5f1deb37a7f8b3828bd9617b6a0a14f045a3e096'
          TREE='a467ab0a90656312bd297dfd5ecb51da396990b6'

          vf_path=Path('VF_PROJECT.json')
          data=json.loads(vf_path.read_text())
          data['status']='V1.2.2_RELEASED / PRODUCTION_OWNER_OBSERVED_SCREENSHOT_VERIFIED / POST_RELEASE_L2_UPDATE_SERVICE_FIXES_MERGED / V1.2.3_RELEASE_AUTH_PENDING'
          data['version']='1.2.2'
          data['production_version']='1.2.2'
          data['target_version']='1.2.2'
          data['working_version']='1.2.2'
          data['version_change']=False
          data['working_branch']='main'
          data['post_release_main_commit']=MAIN
          data['post_release_main_tree']=TREE
          data['post_v1_2_2_update_service']={
              'state':'MERGED_MAIN_MACHINE_VERIFIED_NOT_RELEASED',
              'formal_release_remains':'v1.2.2',
              'production_remains':'v1.2.2_OWNER_OBSERVED_SCREENSHOT_VERIFIED',
              'recommended_patch_release':'v1.2.3',
              'release_authorization':'PENDING_OWNER',
              'truthful_uninitialized_ui_pr':138,
              'truthful_uninitialized_ui_merge':'bfd6ffb2f69069a0a7c8da13b30cca1e03a5af31',
              'truthful_uninitialized_ui_exact_gate_run':33540256003,
              'truthful_uninitialized_ui_exact_gate_job':99964446091,
              'server_side_bootstrap_pr':139,
              'server_side_bootstrap_merge':MAIN,
              'server_side_bootstrap_native_ci_run':33541470290,
              'server_side_bootstrap_native_ci_job':99968501815,
              'server_side_bootstrap_exact_gate_run':33541894604,
              'server_side_bootstrap_exact_gate_job':99969918142,
              'server_side_bootstrap_exact_candidate':'4e3cb98c3dfa297078d2549418b12d35b3adb4f9',
              'server_side_bootstrap_exact_tree':TREE,
              'browser_secret_collection':'FORBIDDEN_LOCKED',
              'update_read_token':'GLOBAL_VF_PRIVATE_READ_TOKEN_SERVER_SIDE_ONLY',
              'third_project_token':'FORBIDDEN_BY_CURRENT_GOVERNANCE',
              'production_adoption':'PENDING_FUTURE_PATCH_RELEASE_AND_OWNER_SERVER_SIDE_INITIALIZATION',
              'machine_production_readback':'NOT_CLAIMED'
          }
          data['next_action']='V1.2.3_PATCH_RELEASE_RECOMMENDED / OWNER_RELEASE_AUTHORIZATION_REQUIRED / THEN_OWNER_VPS_DEPLOYMENT_AND_ONE_TIME_SERVER_SIDE_GLOBAL_READ_TOKEN_BOOTSTRAP'
          data['deployment_readiness']='V1.2.2_PRODUCTION_CLOSED_OWNER_OBSERVED / POST_RELEASE_MAIN_AHEAD_OF_FORMAL_RELEASE'
          vf_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          readme=Path('README.md')
          text=readme.read_text()
          marker='## Current Truth\n'
          section='''## Post-release Working Main（未发布）\n\n```text\nCurrent main: 5f1deb37a7f8b3828bd9617b6a0a14f045a3e096\nCurrent main tree: a467ab0a90656312bd297dfd5ecb51da396990b6\nFormal Release: v1.2.2（保持不变）\nProduction: v1.2.2 · OWNER_OBSERVED / SCREENSHOT_VERIFIED（保持不变）\nPost-release fixes: PR #138 + PR #139\nRecommended patch: v1.2.3 · OWNER RELEASE AUTHORIZATION PENDING\n```\n\n当前 `main` 已领先正式 `v1.2.2` Release，但这不等于 Production 已部署这些 post-release 代码。PR #138 把缺少更新凭据的 Product 状态改为真实的“更新服务尚未初始化”，并继续禁止浏览器收集 GitHub Secret / 管理员密码。PR #139 新增 CLI-only、server-side-only 初始化器：只从服务器进程环境读取全局 `VF_PRIVATE_READ_TOKEN`，复用正式 `PhpUpdater::saveCredential()` 验证 private `core-updates` 与 P05 Release 后，写入 Runtime Pointer 绑定的私有 `runtime.env`。\n\nCurrent GOV-DOC 仍固定 `READ = VF_PRIVATE_READ_TOKEN`、`UPDATE = llhzx2018/core-updates`，默认禁止再造第三枚项目专用 Token。历史 Public Distribution Mirror 仅是匿名分发镜像，不替代 Update Authority。当前 Production v1.2.2 尚未包含 #138/#139，因此不得声明线上更新服务已初始化。\n\n'''
          if '## Post-release Working Main（未发布）' not in text:
              if marker not in text:
                  raise SystemExit('README_CURRENT_TRUTH_MARKER_MISSING')
              text=text.replace(marker, section+marker, 1)
          readme.write_text(text)

          changelog=Path('CHANGELOG.md')
          c=changelog.read_text()
          heading='# 变更记录\n\n'
          entry='''## Unreleased · Post-v1.2.2 Update Service Bootstrap\n\n- PR #138 已把 Product v2 的 `CREDENTIAL_REQUIRED` 翻译修正为真实“更新服务尚未初始化”，不再让浏览器收集或持久化 GitHub Secret / 管理员密码；routine update/apply 的 authenticated Session + Same-Origin + CSRF 边界保持不变。\n- PR #139 新增 `php/bin/init-update-service.php`：CLI-only、server-side-only，仅从进程环境读取全局 `VF_PRIVATE_READ_TOKEN`，复用正式 `PhpUpdater::saveCredential()` 验证 private `core-updates` 与 P05 Release 后写入 Runtime Pointer 绑定的私有 `runtime.env`。\n- Native CI `33541470290 / 99968501815` PASS；Exact Source R2 `33541894604 / 99969918142` PASS，真实验证 live private update authority、0600 pointer-bound persistence、Secret 不回显、browser-secret prohibition，`production_write=0`。\n- 当前 formal Release / Production 仍是 `v1.2.2`；post-release `main=5f1deb37a7f8b3828bd9617b6a0a14f045a3e096` / tree `a467ab0a90656312bd297dfd5ecb51da396990b6`。推荐下一 patch 为 `v1.2.3`，但 Release 尚未获得 Owner 授权。\n\n'''
          if '## Unreleased · Post-v1.2.2 Update Service Bootstrap' not in c:
              if heading not in c:
                  raise SystemExit('CHANGELOG_HEADING_MISSING')
              c=c.replace(heading, heading+entry, 1)
          changelog.write_text(c)

          handoff=Path('docs/handoff/CURRENT_STATE.md')
          handoff.write_text('''# P05 · VF SEO · Current State\n\n```text\nCurrent Formal Release: v1.2.2 · RELEASED\nRelease / Tag Source: 04e4b8546357301e90b6ab7d9b50907369ea58eb\nRelease Tree: 0822f722244724c666d7aa660634e247436f1c12\nProduction: v1.2.2 · OWNER_OBSERVED / SCREENSHOT_VERIFIED\nProduction Machine Readback: NOT CLAIMED\nCurrent Working Main: 5f1deb37a7f8b3828bd9617b6a0a14f045a3e096\nCurrent Working Tree: a467ab0a90656312bd297dfd5ecb51da396990b6\nWorking Main vs Formal Release: AHEAD / POST-RELEASE L2 FIXES\nSchema: VF-SEO-SCHEMA@1 / 1\nRecommended Next Patch: v1.2.3\nRelease Authorization: PENDING OWNER\nProduction Write This Window: 0\n```\n\n## Post-v1.2.2 Update Service Root Cause\n\nProduction v1.2.2 的“系统与更新”入口已经由 Owner 截图证明可见，但更新服务缺少 server-side `VF_PRIVATE_READ_TOKEN` 时会落入 `CREDENTIAL_REQUIRED`。Product 不应通过浏览器索取这枚 Secret；这是 server-side deployment capability，而不是普通用户设置项。\n\nPR #138 已合并：\n\n- 缺凭据状态改为真实“更新服务尚未初始化”；\n- Product browser 不调用 `/api/system/update/credential`；\n- 不收集 GitHub Secret、管理员密码，不写 localStorage/sessionStorage；\n- Exact Source R4 Run `33540256003` / Job `99964446091` PASS。\n\nPR #139 已合并：\n\n- 新增 `php/bin/init-update-service.php`，仅允许 CLI；\n- Secret 只能来自服务器进程环境 `VF_PRIVATE_READ_TOKEN`；\n- 复用正式 `PhpUpdater::saveCredential()`，先验证 private `core-updates` + P05 Release identity，再写 pointer-bound private `runtime.env`；\n- Native CI `33541470290 / 99968501815` PASS；\n- Exact Source R2 `33541894604 / 99969918142` PASS，真实验证 live private authority、0600 persistence、Secret 不回显、`production_write=0`。\n\n## Governance Boundary\n\nCurrent GOV-DOC 固定公共基础设施：\n\n```text\nREAD   = VF_PRIVATE_READ_TOKEN\nWRITE  = VF_RELEASE_WRITE_TOKEN\nPUBLIC = llhzx2018/core-free-runner-public\nUPDATE = llhzx2018/core-updates\n```\n\n默认禁止第三枚同类 Token 或项目专用 Token。`core-updates` 仍是 private Online Update Manifest Authority。历史 `core-free-runner-public` P05 Public Distribution Mirror 只属于匿名分发镜像，不自动替代 private Update Authority。\n\n## Production Execution Boundary\n\n历史 v1.2.2 Production 由 Owner 在 VPS 执行 canonical `repair-v1.2.2.php` 后提供截图闭环；Public Runner 记录明确为 `Production write=0`，没有被证明存在 Runner→VPS、SSH 或 CloudPanel 自动执行通道。当前会话也没有可连接的 SSH / CloudPanel 插件。\n\n因此当前可以成立的真相只有：Product main 已具备 server-side bootstrap；Production v1.2.2 尚未部署 #138/#139，也尚未证明 `VF_PRIVATE_READ_TOKEN` 已初始化。\n\n## Next Action\n\n`v1.2.3` 是当前合理 patch 候选，内容基于已合并且 Machine-verified 的 #138 + #139。Version Lock / Release / Tag / Atomic / core-updates / Production 仍需新的 Owner Release Authorization 后才能进入。批准后应继续：\n\n```text\nv1.2.3 Version Lock\n→ Final Exact Source Gate\n→ Formal FULL / Tag / Release\n→ v1.2.2 → v1.2.3 Atomic Gate + Assets\n→ core-updates Manifest\n→ Owner VPS Production Upgrade\n→ one-time server-side global VF_PRIVATE_READ_TOKEN bootstrap\n→ authenticated System Update readback\n```\n''')
          PY

          test "$(cat VERSION)" = '1.2.2'
          node -e "const p=require('./package.json'); if(p.version!=='1.2.2') process.exit(1)"
          test "$(git hash-object docs/authority/RELEASE_V1.2.2_PRODUCTION_CLOSURE.md)" = "$(cat /tmp/closure.hash)"
          test "$(git hash-object docs/authority/RELEASE_V1.2.2_CANDIDATE.md)" = "$(cat /tmp/candidate.hash)"
          python3 - <<'PY'
          import json
          p=json.load(open('VF_PROJECT.json'))
          assert p['version']=='1.2.2'
          assert p['production_version']=='1.2.2'
          assert p['formal_release']=='v1.2.2'
          assert p['post_release_main_commit']=='5f1deb37a7f8b3828bd9617b6a0a14f045a3e096'
          q=p['post_v1_2_2_update_service']
          assert q['recommended_patch_release']=='v1.2.3'
          assert q['release_authorization']=='PENDING_OWNER'
          assert q['browser_secret_collection']=='FORBIDDEN_LOCKED'
          assert q['third_project_token']=='FORBIDDEN_BY_CURRENT_GOVERNANCE'
          PY
          test "$(git diff --name-only | sort | tr '\n' ' ')" = 'CHANGELOG.md README.md VF_PROJECT.json docs/handoff/CURRENT_STATE.md '
          git diff --check
          echo P05_POST_V122_CURRENT_TRUTH_MUTATION=PASS

      - name: Commit and push exact private candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add CHANGELOG.md README.md VF_PROJECT.json docs/handoff/CURRENT_STATE.md
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = 'CHANGELOG.md README.md VF_PROJECT.json docs/handoff/CURRENT_STATE.md '
          git commit -m 'docs(P05): sync post-v1.2.2 current truth'
          git push origin "HEAD:${P05_BRANCH}"
          echo "P05_POST_V122_CURRENT_TRUTH_SHA=$(git rev-parse HEAD)"
          echo "P05_POST_V122_CURRENT_TRUTH_TREE=$(git rev-parse HEAD^{tree})"
          echo P05_POST_V122_CURRENT_TRUTH_WRITER=PASS
          echo P05_RELEASE_WRITE=0
          echo P05_PRODUCTION_WRITE=0
