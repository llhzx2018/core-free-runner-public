# P07-M05 新服务器初始化 UX14 Formal Release, Owner-approved VF测试 equivalent proof.
# Only the Owner-controlled merge of this exact workflow to public main can publish.
# Existing P07 private native checks remain BLOCKED_INFRA; never overwrite them.
name: P07-M05 UX14 VFTest exact Formal Release
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-m05-ux14-vftest-formal-release.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/p07-m05-ux14-vftest-formal-release.yml'
permissions:
  contents: read
jobs:
  ux14-exact-release:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.user.login == 'llhzx2018' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        startsWith(github.event.head_commit.message, 'P07 M05 UX14 formal publish')))
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      NO_COLOR: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      TARGET_VERSION: '0.1.0'
      TARGET_SHA: 'b6b7f1b631f18367898540404961fd72d39b327a'
      TARGET_TREE: '767a1c6ae28c8337d99599e903d775821822ceb8'
      BUILD: '0.1.0-m05-ux14-verified-pycache'
      EXPECTED_SHA: '8cca47f0a7bfed619daefe3074697f3837fc92c50103d218a12ca9149cd9d11d'
      RELEASE_TAG: 'p07-m05-v0.1.0-ux14-verified-pycache-20261125'
      ASSET: 'P07-M05-0.1.0-m05-ux14-verified-pycache.zip'
      RECEIPT: 'P07-M05-UX14-FORMAL-RELEASE.json'
    steps:
      - name: Checkout exact public installer and release workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout merged P07 product source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 'b6b7f1b631f18367898540404961fd72d39b327a'
          path: private-src
          fetch-depth: 0
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Verify exact merged source and preserved case-only machine evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C private-src rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C private-src rev-parse 'HEAD^{tree}')" = "$TARGET_TREE"
          test "$(cat private-src/VERSION)" = "$TARGET_VERSION"
          grep -Fqx "BUILD_ID = \"$BUILD\"" private-src/scripts/build_p07_m05_bundle.py
          test -f private-src/lib/m05_python_cache_guard.py
          test -f private-src/lib/m05_installed_p07_guard.py
          echo P07_M05_FORMAL_MERGED_PRODUCT_IDENTITY=PASS
      - name: Full M05 security, first-install, database and isolation regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          mkdir -p "$RUNNER_TEMP/p07-m05-package-proof"
          for test in test_p07_m05_trial_cache_guard.py test_p07_m05_installed_root_guard.py test_p07_m05_dirty_host_guard.py test_p07_m05_isolated_module.py test_p07_m05_host_write_gate.py test_p07_m05_db_engine_boundary.py test_p07_m05_first_install_order.py; do
            if ! (cd private-src && python3 -B -m unittest discover -s tests -p "$test" -q) >"$RUNNER_TEMP/p07-m05-package-proof/$test.log" 2>&1; then
              echo "P07_M05_FINAL_SOURCE_TEST=FAIL:$test"
              grep -E '^(FAIL|ERROR): test_[A-Za-z0-9_]+ ' "$RUNNER_TEMP/p07-m05-package-proof/$test.log" | head -10 || true
              exit 13
            fi
            grep -E '^Ran [0-9]+ tests?' "$RUNNER_TEMP/p07-m05-package-proof/$test.log" || true
            echo "P07_M05_FINAL_SOURCE_TEST=PASS:$test"
          done
          echo P07_M05_FORMAL_TARGETED_MACHINE_TESTS=PASS
      - name: Verify exact public M05 atomic installer on genuine official UX13 and new fixed-root candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git hash-object installers/p07-m05-atomic.py)" = "17e47121ac27f31162d93a72aa0b1dbea602ea01"
          echo 'PUBLIC_M05_INSTALLER_EXACT_PUBLISHED_BLOB=PASS'
          mkdir -p "$RUNNER_TEMP/p07-m05-package-proof"
          cd private-src
          python3 -B scripts/build_p07_m05_bundle.py --output "$RUNNER_TEMP/p07-m05-package-proof/ux14.zip"
          python3 -B scripts/build_p07_m05_bundle.py --output "$RUNNER_TEMP/p07-m05-package-proof/ux14-repeat.zip" >/dev/null
          cmp "$RUNNER_TEMP/p07-m05-package-proof/ux14.zip" "$RUNNER_TEMP/p07-m05-package-proof/ux14-repeat.zip"
          echo P07_M05_NEW_SOURCE_CANDIDATE_REPRODUCIBLE=PASS
          printf '%s  %s\n' "$EXPECTED_SHA" "$RUNNER_TEMP/p07-m05-package-proof/ux14.zip" | sha256sum -c - >/dev/null
          echo P07_M05_UX14_EXACT_RELEASE_ZIP_SHA=PASS
          echo "P07_M05_NEW_SOURCE_ZIP_SHA256=$(sha256sum "$RUNNER_TEMP/p07-m05-package-proof/ux14.zip" | cut -d ' ' -f1)"
          curl --fail --location --silent --show-error --retry 2 --max-time 95 \
            'https://github.com/llhzx2018/core-free-runner-public/releases/download/p07-m05-v0.1.0-ux13-provider-neutral-20261125/P07-M05-0.1.0-m05-ux13-provider-neutral.zip' \
            --output "$RUNNER_TEMP/p07-m05-package-proof/ux13-official.zip"
          echo '969e0a61177f0ef85b4b06524579c506f0506d545c9e2acfc6b272ab5522142d  '"$RUNNER_TEMP/p07-m05-package-proof/ux13-official.zip" | sha256sum -c -
          python3 -B - "$RUNNER_TEMP/p07-m05-package-proof" <<'PY'
          import hashlib
          import importlib.util
          import os
          from pathlib import Path
          import sys
          from unittest.mock import patch
          import zipfile
          tmp=Path(sys.argv[1])
          script=Path.cwd().parent/"installers/p07-m05-atomic.py"
          assert script.is_file()
          spec=importlib.util.spec_from_file_location("public_m05_exact",script)
          public=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(public)
          # Explicitly confine all writes to the ephemeral runner tempdir.
          public.BASE=tmp/"vfops-modules"
          assert str(public.BASE).startswith(str(tmp))
          old=tmp/"ux13-official.zip"
          new=tmp/"ux14.zip"
          sha=lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          old_id="0.1.0-m05-ux13-provider-neutral"
          new_id="0.1.0-m05-ux14-verified-pycache"
          old_build,_=public.read_verified_archive(old,sha(old))
          new_build,_=public.read_verified_archive(new,sha(new))
          assert (old_build,new_build)==(old_id,new_id)
          markers={}
          for slot in ("m01","m02","m03","m04"):
              folder=public.BASE/slot
              folder.mkdir(parents=True,exist_ok=True)
              marker=folder/"sentinel"
              marker.write_bytes(("unchanged-"+slot).encode())
              markers[slot]=marker.read_bytes()
          with patch.object(public.os,"geteuid",return_value=0):
              assert public.install(old,sha(old))==old_id
              assert public.install(new,sha(new))==new_id
              current=public.BASE/"m05/current"
              assert os.readlink(current)=="releases/"+new_id
              assert public.install(new,sha(new))==new_id
              try:
                  public.install(new,"0"*64)
              except public.Unsafe:
                  pass
              else:
                  raise AssertionError("wrong zip SHA accepted")
              assert os.readlink(current)=="releases/"+new_id
              tampered=tmp/"modified-inner.zip"
              with zipfile.ZipFile(new) as original,zipfile.ZipFile(tampered,"w") as forged:
                  for info in original.infolist():
                      data=original.read(info)
                      if info.filename=="p07-m05/MODULE_BUILD_ID":
                          data=b"0.1.0-m05-tampered\\n"
                      forged.writestr(info,data)
              try:
                  public.install(tampered,sha(tampered))
              except public.Unsafe:
                  pass
              else:
                  raise AssertionError("valid outer SHA with tampered manifest accepted")
              assert os.readlink(current)=="releases/"+new_id
              assert public.rollback(old_id,"P07-M05:"+old_id)==old_id
              assert os.readlink(current)=="releases/"+old_id
          for slot,data in markers.items():
              assert (public.BASE/slot/"sentinel").read_bytes()==data
          public.verify_saved_release(public.BASE/"m05/releases"/new_id,new_id)
          print("P07_M05_PUBLIC_INSTALLER_REAL_ZIP_UX13_TO_UX14=PASS")
          print("P07_M05_PUBLIC_INSTALLER_BAD_SHA_AND_MANIFEST_REJECT=PASS")
          print("P07_M05_PUBLIC_INSTALLER_ROLLBACK=PASS")
          print("P07_M05_PUBLIC_INSTALLER_OTHER_FOUR_UNCHANGED=PASS")
          print("P07_M05_RELEASE_PREVIEW_VERIFICATION=PASS")
          PY
      - name: Build immutable release receipt and SHA256SUMS
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          export RELEASE_HOME="$RUNNER_TEMP/p07-m05-package-proof"
          cp "$RELEASE_HOME/ux14.zip" "$RELEASE_HOME/$ASSET"
          python3 -B - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ["RELEASE_HOME"])
          target=root/os.environ["ASSET"]
          digest=hashlib.sha256(target.read_bytes()).hexdigest()
          assert digest==os.environ["EXPECTED_SHA"]
          receipt={
            "schema":"vf.p07.m05.ux14.release/v1",
            "module_id":"P07-M05",
            "module_name":"新服务器初始化",
            "build_id":os.environ["BUILD"],
            "source_commit":os.environ["TARGET_SHA"],
            "source_tree":os.environ["TARGET_TREE"],
            "formal_tag":os.environ["RELEASE_TAG"],
            "archive_name":target.name,
            "archive_sha256":digest,
            "previous_formal_build":"0.1.0-m05-ux13-provider-neutral",
            "previous_formal_sha256":"969e0a61177f0ef85b4b06524579c506f0506d545c9e2acfc6b272ab5522142d",
            "proofs":{
              "native_52_isolated":"https://github.com/llhzx2018/core-free-runner-public/actions/runs/45529961938",
              "native_terminal_mariadb_124":"https://github.com/llhzx2018/core-free-runner-public/actions/runs/45532493968",
              "final_source_and_zip":"https://github.com/llhzx2018/core-free-runner-public/actions/runs/45563580895",
              "old_to_new_atomic_and_rollback":"https://github.com/llhzx2018/core-free-runner-public/actions/runs/45563580895"
            },
            "native_product_checks":"BLOCKED_INFRA_NOT_RELABELED_PASS",
            "owner_vps":"NOT_TOUCHED",
            "production":"MANUAL_ONLY",
          }
          manifest=root/os.environ["RECEIPT"]
          manifest.write_text(json.dumps(receipt,ensure_ascii=False,indent=2,sort_keys=True)+"\n",encoding="utf8")
          rows=[(target,digest),(manifest,hashlib.sha256(manifest.read_bytes()).hexdigest())]
          (root/"SHA256SUMS").write_text("".join(f"{h}  {f.name}\n" for f,h in rows),encoding="ascii")
          print("P07_M05_UX14_RELEASE_RECEIPT=PASS")
          PY
          (cd "$RELEASE_HOME" && sha256sum -c SHA256SUMS)
      - name: Publish exact immutable product and public GitHub releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          test -n "$GH_TOKEN" || { echo P07_M05_RELEASE_WRITE_CAPABILITY_MISSING; exit 78; }
          p=llhzx2018/vf-server-ops
          r=llhzx2018/core-free-runner-public
          root="$RUNNER_TEMP/p07-m05-package-proof"
          test "$(gh api "repos/$p/branches/main" --jq '.commit.sha')" = "$TARGET_SHA" || {
            echo P07_M05_PRODUCT_MAIN_MOVED_STOP; exit 13; }
          if gh release view "$RELEASE_TAG" -R "$p" >/dev/null 2>&1; then
            test "$(gh api "repos/$p/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$TARGET_SHA" || exit 13
          else
            if gh api "repos/$p/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then exit 13; fi
            gh release create "$RELEASE_TAG" -R "$p" --target "$TARGET_SHA" \
              --title "P07-M05 新服务器初始化 UX14" \
              --notes "Only P07-M05. VF测试 exact-source gate and immutable SHA256. Source merge is separate from Production; Owner manually upgrades VPS."
          fi
          if gh release view "$RELEASE_TAG" -R "$r" >/dev/null 2>&1; then
            test "$(gh api "repos/$r/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$GITHUB_SHA" || exit 13
            test "$(gh api "repos/$r/releases/tags/$RELEASE_TAG" --jq '.assets|length')" = 3 || exit 13
          else
            if gh api "repos/$r/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then exit 13; fi
            gh release create "$RELEASE_TAG" -R "$r" --target "$GITHUB_SHA" \
              --title "P07-M05 UX14 verified module release" \
              --notes "Only the new server initialization module. Current public toolbox pin remains UX12 until separate artifact-readback and upgrade gate."
            gh release upload "$RELEASE_TAG" -R "$r" \
              "$root/$ASSET" "$root/$RECEIPT" "$root/SHA256SUMS"
          fi
          dest="$RUNNER_TEMP/p07-m05-remote-proof"
          mkdir -p "$dest"
          gh release download "$RELEASE_TAG" -R "$r" --dir "$dest"
          (cd "$dest" && sha256sum -c SHA256SUMS)
          cmp "$root/$RECEIPT" "$dest/$RECEIPT"
          test "$(gh api "repos/$p/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$TARGET_SHA"
          test "$(gh api "repos/$r/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$GITHUB_SHA"
          echo P07_M05_UX14_BOTH_RELEASES_REMOTE_READBACK=PASS
          echo P07_M05_PUBLIC_TOOLBOX_PIN=UX13_UNCHANGED
      - name: Always erase private source and transient test/archive bytes
        if: always()
        shell: bash
        run: |
          set +e
          set +x
          rm -rf -- "$GITHUB_WORKSPACE/private-src" "$RUNNER_TEMP/p07-m05-package-proof" "$RUNNER_TEMP/p07-m05-remote-proof"
          test ! -e "$GITHUB_WORKSPACE/private-src"
          echo P07_M05_PRIVATE_SOURCE_AND_ARCHIVE_CLEANUP=PASS
