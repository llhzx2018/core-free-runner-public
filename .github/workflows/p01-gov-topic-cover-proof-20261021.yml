name: P01 GOV-TOPIC verified cover candidate (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-gov-topic-cover-proof-20261021.yml'
permissions:
  contents: read
jobs:
  p01-cover-import:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_SHA: 88f9db08710a5936289bb18f644b0d6455efa803
    steps:
      - name: Prepare PHP runtime
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-gd unzip >/dev/null
          php -m | grep -iq 'pdo_sqlite'
      - name: Checkout exact private P01 source, then focused gates
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          trap 'rm -rf "${GITHUB_WORKSPACE}/product"' EXIT
          git clone -q --depth 1 --branch fix/p01-gov-topic-cover-sync-v247409-20261021 \
            "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" product
          test "$(git -C product rev-parse HEAD)" = "$TARGET_SHA"
          cd product
          for f in src/app/ResourceAssetStore.php src/app/GovTopicSync.php \
                   src/app/GovTopicRemote.php tests/gov_topic_pdo_integration.php \
                   tests/gov_topic_remote_contract.php; do
            php -l "$f" >/dev/null
          done
          php tests/gov_topic_remote_contract.php
          php tests/gov_topic_pdo_integration.php
          echo P01_GOV_TOPIC_COVER_FOCUSED=PASS
  gov-topic-catalog:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      TOPIC_SHA: b4294fd48275f39001177900e63a12762893d06d
    steps:
      - name: Checkout exact private GOV-TOPIC source and validate candidate
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          trap 'rm -rf "${GITHUB_WORKSPACE}/topic"' EXIT
          git clone -q --depth 1 --branch feat/gov-topic-cover-v101-20261021 \
            "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/gov-topic.git" topic
          test "$(git -C topic rev-parse HEAD)" = "$TOPIC_SHA"
          cd topic
          python3 -m unittest discover -s tests -v
          python3 tools/build_catalog.py --check
          echo GOV_TOPIC_V101_CATALOG=PASS
