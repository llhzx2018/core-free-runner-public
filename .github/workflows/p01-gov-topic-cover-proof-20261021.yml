name: GOV-TOPIC new article cover content validation (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-gov-topic-cover-proof-20261021.yml'
permissions:
  contents: read
jobs:
  gov-topic-catalog:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      TOPIC_SHA: c6049d70c869a6a4d7b8ed5be55aac0a9c6355c0
    steps:
      - name: Checkout exact private GOV-TOPIC source and validate candidate
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          trap 'rm -rf "${GITHUB_WORKSPACE}/topic"' EXIT
          git clone -q --depth 1 --branch topic/website-speed-diagnosis-v100-20261022 \
            "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/gov-topic.git" topic
          test "$(git -C topic rev-parse HEAD)" = "$TOPIC_SHA"
          cd topic
          python3 -m unittest discover -s tests -v
          python3 tools/build_catalog.py --check
          echo GOV_TOPIC_NEW_ARTICLE_CATALOG=PASS
