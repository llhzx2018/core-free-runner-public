name: P01 V2.27 Develop Exact Gate
on:
  push:
    branches: [task/p01-v222-multi-surface-gate-20260828]
    paths: ['.github/workflows/p01-v227-develop-exact-gate-20260828.yml']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE: d26f9f0e03b49365ffd0b6307d8071c122e79904
      TREE: 00a3567663d92e71292c2ab3fc0d4f8635a68454
      ROOT: /tmp/p01-v227-develop
      PORT: '18331'
      COOKIE: /tmp/p01-v227-develop.cookies
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: product
      - name: Exact develop identity and syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$SOURCE"
          test "$(git -C product rev-parse HEAD^{tree})" = "$TREE"
          test "$(cat product/VERSION)" = '2.27.0'
          test "$(cat product/src/VERSION.txt)" = '2.27.0'
          grep -F "define('VF_VERSION', '2.27.0');" product/src/app/bootstrap.php >/dev/null
          find product/src -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/p01-v227-develop-php.txt
          find product/src -name '*.js' -print0 | xargs -0 -n1 node --check >/tmp/p01-v227-develop-js.txt
          python3 -m json.tool product/VF_PROJECT.json >/dev/null
          echo P01_V227_DEVELOP_IDENTITY_SYNTAX=PASS
      - name: Fresh install runtime mutation and baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$ROOT" "$COOKIE"
          cp -a product/src "$ROOT"
          php -S 127.0.0.1:$PORT -t "$ROOT" >/tmp/p01-v227-develop-server.log 2>&1 & echo $! >/tmp/p01-v227-develop.pid
          READY=0
          for i in $(seq 1 30); do if curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:$PORT/setup.php" -o /tmp/p01-v227-develop-setup.html; then READY=1; break; fi; sleep 1; done
          test "$READY" = 1
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-v227-develop-setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:$PORT/setup.php" --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=V227 Develop Gate' --data-urlencode 'admin_password=P01V227!Develop' --data-urlencode 'admin_password_confirm=P01V227!Develop' -o /tmp/p01-v227-develop-setup-post.html
          cat >/tmp/p01-v227-develop-seed.php <<'PHP'
          <?php
          require '/tmp/p01-v227-develop/app/bootstrap.php'; require_once '/tmp/p01-v227-develop/app/SurfaceRepository.php';
          $r=new VfRepository(vf_db());$s=new VfSurfaceRepository(vf_db());
          $c=$r->createCategory(['name'=>'开发','description'=>'','is_private'=>false]);
          $saved=$r->saveLink(null,['category_id'=>$c,'title'=>'Develop Tool','url'=>'https://develop-tool.example.com','description'=>'工具','tags'=>'工具','is_private'=>true],'manual');
          file_put_contents('/tmp/p01-v227-develop-cat',(string)$c);
          PHP
          php /tmp/p01-v227-develop-seed.php
          curl -fsS -c "$COOKIE" -b "$COOKIE" -H 'Content-Type: application/json' -X POST "http://127.0.0.1:$PORT/api.php?action=login" --data '{"password":"P01V227!Develop"}' | jq -e '.ok==true' >/dev/null
          curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:$PORT/surfaces.php" -o /tmp/p01-v227-develop-all.html
          grep -F '<h1>全部收藏</h1>' /tmp/p01-v227-develop-all.html >/dev/null
          CSRF2=$(python3 - <<'PY'
          import re,json,html
          s=open('/tmp/p01-v227-develop-all.html',encoding='utf-8').read();m=re.search(r'<script type="application/json" id="vf-workspace-data">(.*?)</script>',s,re.S);assert m;print(json.loads(html.unescape(m.group(1)))['csrf'])
          PY
          )
          CAT=$(cat /tmp/p01-v227-develop-cat)
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:$PORT/workspace-action.php" --data-urlencode "csrf=$CSRF2" --data-urlencode 'action=create' --data-urlencode "category_id=$CAT" --data-urlencode 'title=Develop Added' --data-urlencode 'url=https://develop-added.example.com' --data-urlencode 'surface=channels' --data-urlencode 'resource_kind=creator' --data-urlencode 'background_friendly=1' | jq -e '.ok==true and .duplicate==false' >/dev/null
          php "$ROOT/cli/verify.php" | grep -Fx 'VERIFY_PASS=YES'
          php "$ROOT/cli/surface-verify.php" | grep -Fx 'MULTI_SURFACE_PASS=YES'
          php "$ROOT/cli/baseline-verify.php" | tee /tmp/p01-v227-develop-baseline.txt
          grep -Fx 'BASELINE_CORE_PASS=YES' /tmp/p01-v227-develop-baseline.txt
          grep -Fx 'DRIFT_COUNT=0' /tmp/p01-v227-develop-baseline.txt
          grep -Fx 'UNKNOWN_COUNT=0' /tmp/p01-v227-develop-baseline.txt
          php -r 'require "/tmp/p01-v227-develop/app/bootstrap.php"; $db=vf_db(); if(strtolower((string)$db->query("PRAGMA integrity_check")->fetchColumn())!=="ok")exit(1); if($db->query("PRAGMA foreign_key_check")->fetchAll(PDO::FETCH_ASSOC))exit(2); echo "P01_V227_DEVELOP_SQLITE=PASS\n";'
          echo P01_V227_DEVELOP_RUNTIME=PASS
      - name: Verdict
        shell: bash
        run: |
          echo P01_V227_DEVELOP_SOURCE=$SOURCE
          echo P01_V227_DEVELOP_TREE=$TREE
          echo P01_V227_DEVELOP_EXACT_GATE=PASS
          echo SCHEMA_CHANGE=NO
          echo RELEASE=NO
          echo PRODUCTION=NO
      - name: Stop server
        if: always()
        shell: bash
        run: kill "$(cat /tmp/p01-v227-develop.pid 2>/dev/null)" 2>/dev/null || true
