name: S01 C02 1211098 Formal Release
on:
  push:
    branches: [task/s01-c02-1211098-formal-release-20261012]
permissions:
  contents: read
  actions: read
jobs:
  formal-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_VERSION: '1.21.1098'
      TARGET_SHA: '16047ed5d7d8f9fb6b3ec1dbd3d7e03b44adf3a4'
      MAIN_SHA: 'bd85b7eb57a0fc84ee262fe27d08a826b5d7a409'
      TARGET_TREE: '817fdd177ad7724d2c2e71b3f569f1bdd1ce0306'
      RELEASE_TAG: 'v1.21.1098'
      RUN_ID: '38190593110'
      ARTIFACT_ID: '11721408118'
    steps:
      - name: Checkout public scoped release harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Checkout exact machine-proven private product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 16047ed5d7d8f9fb6b3ec1dbd3d7e03b44adf3a4
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Perform verified formal release and remote asset readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          bash -n runner/lanes/s01-c02-1211098/formal-release.sh
          bash runner/lanes/s01-c02-1211098/formal-release.sh
      - name: Upload only public-safe release receipt (never binary)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-1211098-formal-${{ github.run_id }}
          path: |
            proof-formal/stage.txt
            proof-formal/build.json
            proof-formal/gate-readback.json
            proof-formal/promoted-main.json
            proof-formal/release.json
            proof-formal/FINAL_FORMAL_RELEASE.json
          if-no-files-found: warn
          retention-days: 30
