name: S01-C02 1.21.916 R27 Full Surface Pre-Merge Gate

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CANDIDATE_SHA: 6a41fc87d310fa42c347a9185bd6efc167f32d4e
      BASE_SHA: df698988ff194fe2d39d27205e137123f2c3e670

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 6a41fc87d310fa42c347a9185bd6efc167f32d4e
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: ops
          persist-credentials: false

      - name: Verify R27 full-surface contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(tr -d '\r\n' < ops/VERSION)" = "1.21.916"
          grep -Fq 'Version: 1.21.916' ops/vf-ops.php
          grep -Fq "VF_OPS_VERSION', '1.21.916'" ops/vf-ops.php
          grep -Fq 'S01-FULL-SURFACE-UXUI-R27' ops/vf-ops.php

          php ops/tests/s01-c02-121916-full-surface-uxui-r27-contract.php

          php -l ops/vf-ops.php >/dev/null
          php -l ops/includes/s01/v6-landing-shell.php >/dev/null
          php -l ops/includes/views/admin-shell-tabs-parts/02-shell-navigation.php >/dev/null
          php -l ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php >/dev/null
          php -l ops/includes/admin-v13/views/content_workflow_v6.php >/dev/null
          php -l ops/includes/admin-v13/views/seo_today_v6.php >/dev/null
          php -l ops/includes/admin-v13/views/publish_zip_v6.php >/dev/null

          actual="$(git -C ops diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" | sort)"
          expected="$(printf '%s\n'             CHANGELOG.md             VERSION             assets/css/current/admin-s01-subpages-r27.css             assets/css/current/admin-s01-system-publish-r13.css             assets/css/current/admin-s01-v6-shell-r1.css             includes/admin-v13/views/content_workflow_v6.php             includes/admin-v13/views/publish_zip_v6.php             includes/admin-v13/views/seo_today_v6.php             includes/s01/v6-landing-shell.php             includes/views/admin-shell-tabs-parts/02-shell-navigation.php             includes/views/admin-style-helpers/admin-s01-uiux-polish.php             tests/s01-c02-121916-full-surface-uxui-r27-contract.php             vf-ops.php | sort)"
          test "$actual" = "$expected"

          python3 - <<'PY'
          from pathlib import Path
          shell=Path('ops/assets/css/current/admin-s01-v6-shell-r1.css').read_text(encoding='utf-8')
          sub=Path('ops/assets/css/current/admin-s01-subpages-r27.css').read_text(encoding='utf-8')
          pub=Path('ops/assets/css/current/admin-s01-system-publish-r13.css').read_text(encoding='utf-8')
          for text,name in [(shell,'shell'),(sub,'subpages'),(pub,'publish')]:
              assert text.count('{') == text.count('}'), name
          assert '.vf-v13-domain-split' in shell
          assert '.vf-v13-section-menu .vf-v13-route-tabs' in shell
          assert 'display:flex!important' in shell
          assert 'Canonical child-workspace visual authority' in sub
          assert 'Publish absorbed capability navigation' in pub

          nav=Path('ops/includes/views/admin-shell-tabs-parts/02-shell-navigation.php').read_text(encoding='utf-8')
          landing=Path('ops/includes/s01/v6-landing-shell.php').read_text(encoding='utf-8')
          uiux=Path('ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php').read_text(encoding='utf-8')
          assert "routeKey !== 'acceptance_overview'" not in nav
          assert 'vf_ops_v13_render_domain_workspace_switch_v121916' in nav
          assert 'vf_ops_v13_render_route_tabs_v121391();' in landing
          assert "$routeKey === 'content_workflow'" in uiux
          assert "$routeKey === 'seo_planner'" in uiux
          assert 'admin-s01-subpages-r27.css' in uiux
          print('PASS_R27_SOURCE_INVARIANTS')
          PY

          # No schema/data/update/runtime ownership drift.
          test "$(git -C ops diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" -- database config includes/v6 includes/wp-update docs/authority | wc -l)" = "0"

          ! grep -RInE 'gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY'             ops/vf-ops.php             ops/includes/s01/v6-landing-shell.php             ops/includes/views/admin-shell-tabs-parts/02-shell-navigation.php             ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php             ops/assets/css/current/admin-s01-v6-shell-r1.css             ops/assets/css/current/admin-s01-subpages-r27.css

          echo PASS_S01_C02_121916_R27_PREMERGE
