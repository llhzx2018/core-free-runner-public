name: P07 release84 one-shot formal gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-r84-one-shot-formal-gate.yml'

permissions:
  contents: read

jobs:
  formal-release:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      github.event.pull_request.title == 'release(P07): one-shot formal release84'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Read canonical public main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      - name: Strict read-only identity and machine gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 'f8f923093a7e3a1c56c2b3c2a7a2e5a0ed91d49f'
          test "$(cat dist/p07/0.1.0/overlay/BUILD_ID)" = '0.1.0-release84'
          grep -Fq 'EXPECTED_BUILD_ID="0.1.0-release84"' installers/p07-final.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release84"' installers/p07-toolbox.sh
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc42"' installers/p07-toolbox.sh
          test "$(git hash-object installers/p07-final.sh)" = '9760c352ac71629902e2e317f39b71b323a02a79'
          test "$(git hash-object installers/p07.sh)" = '502b679955e1fadaf8a062de2ca1820c693a9ee2'
          test "$(git hash-object dist/p07/0.1.0/overlay/RUNTIME.gitblob)" = '928e5c216915c30f11ac6e128a7bd63041e1be40'
          test "$(git hash-object packages/p07-system-care/0.1.0-rc42/MANIFEST.gitblob)" = '80fdb57b28e37a5cd707d1f32028a479cff9525e'
          bash -n installers/p07.sh
          bash -n installers/p07-final.sh
          bash -n installers/p07-toolbox.sh
          bash -n installers/p07-system-care.sh
          for id in 37719182717 37719182862 37719182841 37719182757 37719182797 37719182753 37719182781; do
            test "$(gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$id" --jq .head_sha)" = '559258c0af7cc516e18004a721b668daf1420dda'
            test "$(gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$id" --jq .conclusion)" = 'success'
          done
          echo 'P07_R84_FORMAL_PRECONDITIONS=PASS'

      - name: Create tagged formal release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          tag='p07-v0.1.0-release84'
          repo='llhzx2018/core-free-runner-public'
          if gh release view "$tag" -R "$repo" >/dev/null 2>&1; then
            actual="$(gh release view "$tag" -R "$repo" --json targetCommitish --jq .targetCommitish)"
            test "$actual" = 'f8f923093a7e3a1c56c2b3c2a7a2e5a0ed91d49f'
          else
            gh release create "$tag" -R "$repo" \
              --target 'f8f923093a7e3a1c56c2b3c2a7a2e5a0ed91d49f' \
              --title 'P07 · VF Server Ops · release84' \
              --notes 'Source main: 46f309a583a23a330542220caf38ff167f46ad8c. Public Distribution main: f8f923093a7e3a1c56c2b3c2a7a2e5a0ed91d49f. Build: 0.1.0-release84. System Care: rc42. Public Machine Gates: 7/7 PASS. Real Production operations: NOT RUN. OWNER PASS: PENDING.' \
              --latest=false
          fi
          test "$(gh release view "$tag" -R "$repo" --json tagName --jq .tagName)" = "$tag"
          echo 'P07_R84_FORMAL_RELEASE=PASS'
