name: P05 V1.2.2 Production Closure Writer

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p05-v122-production-closure-writer-20260902.yml']

permissions:
  contents: read
  actions: read

jobs:
  write-closure:
    if: github.event_name == 'pull_request' && github.head_ref == 'tmp/p05-v122-production-closure-writer-20260902'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCT_SOURCE: 04e4b8546357301e90b6ab7d9b50907369ea58eb
      PRODUCT_TREE: 0822f722244724c666d7aa660634e247436f1c12
      PRODUCT_BRANCH: governance/p05-v122-production-closure-20260902
      RELEASE_ID: '380671190'
      RELEASE_TAG: v1.2.2
      FULL_ID: '539843543'
      FULL_BYTES: '512336'
      FULL_SHA256: fb2bdcd4efb6edd408fb81635b488415d756622f031897acb89021747bf6b297
      REPAIR_ID: '539856093'
      REPAIR_BYTES: '3651613'
      REPAIR_SHA256: 5ad86463cafc28642f8782069393d9464308aada75617a053c58d51983f12901
      UPDATE_ID: '539856092'
      UPDATE_BYTES: '1162103'
      UPDATE_SHA256: 078fccae7e3097d842b15233d5325c174abc711d891fe1c9e3952325738a09a2
      CORE_UPDATES_MAIN: e93f07c5ee84e114e0829ea65f217e768b21ce44
      NATIVE_RUN: '33532595870'
      NATIVE_JOB: '99939127603'
      FINAL_RUN: '33532743356'
      FINAL_JOB: '99939619178'
      FORMAL_RUN: '33533485831'
      FORMAL_JOB: '99942039835'
      ATOMIC_RUN: '33533825437'
      ATOMIC_JOB: '99943145098'
      SUPPLEMENT_RUN: '33534562135'
      SUPPLEMENT_JOB: '99945575241'
      MANIFEST_RUN: '33534786090'
      MANIFEST_JOB: '99946331208'
    steps:
      - name: Bind exact live Release and core-updates truth
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api repos/llhzx2018/vf-seo/releases/tags/$RELEASE_TAG > /tmp/release.json
          gh api repos/llhzx2018/core-updates/branches/main > /tmp/core-main.json
          gh api repos/llhzx2018/core-updates/contents/projects/P05.json?ref=$CORE_UPDATES_MAIN > /tmp/core-file.json
          python3 - <<'PY'
          import json,os,base64
          r=json.load(open('/tmp/release.json')); a={x['name']:x for x in r['assets']}
          assert r['id']==int(os.environ['RELEASE_ID']) and r['tag_name']==os.environ['RELEASE_TAG'] and r['target_commitish']==os.environ['PRODUCT_SOURCE']
          assert a['VF_SEO_V1.2.2_FULL.zip']['id']==int(os.environ['FULL_ID']) and a['VF_SEO_V1.2.2_FULL.zip']['size']==int(os.environ['FULL_BYTES']) and a['VF_SEO_V1.2.2_FULL.zip']['digest']=='sha256:'+os.environ['FULL_SHA256']
          assert a['repair-v1.2.2.php']['id']==int(os.environ['REPAIR_ID']) and a['repair-v1.2.2.php']['size']==int(os.environ['REPAIR_BYTES']) and a['repair-v1.2.2.php']['digest']=='sha256:'+os.environ['REPAIR_SHA256']
          assert a['VF_SEO_V1.2.2_UPDATE.zip']['id']==int(os.environ['UPDATE_ID']) and a['VF_SEO_V1.2.2_UPDATE.zip']['size']==int(os.environ['UPDATE_BYTES']) and a['VF_SEO_V1.2.2_UPDATE.zip']['digest']=='sha256:'+os.environ['UPDATE_SHA256']
          cm=json.load(open('/tmp/core-main.json')); assert cm['commit']['sha']==os.environ['CORE_UPDATES_MAIN']
          cf=json.load(open('/tmp/core-file.json')); m=json.loads(base64.b64decode(cf['content']).decode())
          assert m['current_version']=='1.2.1' and m['target_version']=='1.2.2' and m['release_id']==int(os.environ['RELEASE_ID']) and m['product_identity']==os.environ['PRODUCT_SOURCE'] and m['asset_sha256']==os.environ['UPDATE_SHA256']
          print('P05_V122_CLOSURE_LIVE_TRUTH=PASS')
          PY

      - name: Bind terminal machine evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          for pair in "$FINAL_RUN:$FINAL_JOB" "$FORMAL_RUN:$FORMAL_JOB" "$ATOMIC_RUN:$ATOMIC_JOB" "$SUPPLEMENT_RUN:$SUPPLEMENT_JOB" "$MANIFEST_RUN:$MANIFEST_JOB"; do
            run=${pair%%:*}; job=${pair##*:}
            gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$run" > /tmp/run.json
            gh api "repos/llhzx2018/core-free-runner-public/actions/jobs/$job" > /tmp/job.json
            python3 - <<'PY'
          import json
          r=json.load(open('/tmp/run.json')); j=json.load(open('/tmp/job.json'))
          assert r['conclusion']=='success' and j['conclusion']=='success' and j['run_id']==r['id']
          PY
          done
          echo P05_V122_CLOSURE_MACHINE_EVIDENCE=PASS

      - name: Checkout exact P05 release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.PRODUCT_SOURCE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: p05

      - name: Verify closure branch base
        working-directory: p05
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$PRODUCT_TREE"
          git fetch origin "$PRODUCT_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$PRODUCT_SOURCE"
          echo P05_V122_CLOSURE_BASE=PASS

      - name: Write exact four-file Production Closure authority
        working-directory: p05
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re,os
          p=Path('VF_PROJECT.json'); v=json.loads(p.read_text())
          v.update({
            'status':'V1.2.2_RELEASED / PRODUCTION_OWNER_OBSERVED_SCREENSHOT_VERIFIED / CLOSED',
            'version':'1.2.2','production_version':'1.2.2','target_version':'1.2.2','working_version':'1.2.2','version_change':False,
            'formal_release':'v1.2.2','formal_release_state':'RELEASED_CURRENT_MACHINE_PASS_PRODUCTION_OWNER_OBSERVED',
            'formal_release_candidate_commit':'5885cc37147ea9450cd648e408c9b2e1ffb4b848','formal_release_candidate_tree':os.environ['PRODUCT_TREE'],
            'formal_release_asset':'VF_SEO_V1.2.2_FULL.zip','formal_release_asset_files':73,'formal_release_asset_bytes':int(os.environ['FULL_BYTES']),'formal_release_asset_sha256':os.environ['FULL_SHA256'],
            'runtime_recovery_candidate':'V1.2.2_ATOMIC_R2_PASS_CLOSED','runtime_recovery_release':'RELEASED_V1.2.2',
            'production_source_upload':'EXECUTED_BY_OWNER_VPS_SINGLE_PHP','production_runtime_acceptance':'OWNER_OBSERVED_SCREENSHOT_V1.2.2_RUNNING / SYSTEM_UPDATE_ENTRY_VISIBLE',
            'production_deployment':'DEPLOYED_OWNER_OBSERVED_SCREENSHOT_VERIFIED','production_main_promotion':'NOT_APPLICABLE_OWNER_VPS_SINGLE_PHP',
            'owner_real_use_review':'V1.2.2_OWNER_OBSERVED_RUNNING / SYSTEM_UPDATE_ENTRY_RESTORED','owner_real_use_pass':'PASS / OWNER_OBSERVED_SCREENSHOT_VERIFIED',
            'candidate_authorization':'V1.2.2_RELEASE_READINESS_COMPLETED','release_authorization':'OWNER_AUTHORIZED_V1.2.2 / CONSUMED',
            'production_deployment_authorization':'OWNER_EXECUTED_VPS_SINGLE_PHP / CONSUMED',
            'next_action':'POST_V1.2.2_L2_PRODUCT_OPTIMIZATION','deployment_readiness':'V1.2.2_PRODUCTION_CLOSED_OWNER_OBSERVED',
            'formal_release_id':int(os.environ['RELEASE_ID']),'formal_release_asset_id':int(os.environ['FULL_ID']),
            'runtime_evidence':'docs/authority/RELEASE_V1.2.2_PRODUCTION_CLOSURE.md'
          })
          v['release_publication']={
            'tag':'v1.2.2','release_id':int(os.environ['RELEASE_ID']),'release_name':'P05 · VF SEO v1.2.2 · Product v2 Update Entry Hotfix',
            'target_commit':os.environ['PRODUCT_SOURCE'],'target_tree':os.environ['PRODUCT_TREE'],'published_at':'2026-09-01T16:44:49Z',
            'full_asset':'VF_SEO_V1.2.2_FULL.zip','full_asset_id':int(os.environ['FULL_ID']),'full_files':73,'full_bytes':int(os.environ['FULL_BYTES']),'full_sha256':os.environ['FULL_SHA256'],
            'receipt_asset':'VF_SEO_V1.2.2_RELEASE_RECEIPT.txt','exact_candidate_source':'5885cc37147ea9450cd648e408c9b2e1ffb4b848',
            'exact_candidate_run':int(os.environ['FINAL_RUN']),'exact_candidate_job':int(os.environ['FINAL_JOB']),'publication_run':int(os.environ['FORMAL_RUN']),'publication_job':int(os.environ['FORMAL_JOB']),
            'state':'PASS_CLOSED','real_endpoint':'OWNER_OBSERVED_SCREENSHOT_V1.2.2','production':'DEPLOYED_OWNER_OBSERVED'
          }
          v['atomic_distribution_v1_2_2']={
            'source_version':'1.2.1','target_version':'1.2.2','update_asset':'VF_SEO_V1.2.2_UPDATE.zip','update_asset_id':int(os.environ['UPDATE_ID']),'update_bytes':int(os.environ['UPDATE_BYTES']),'update_sha256':os.environ['UPDATE_SHA256'],
            'repair_asset':'repair-v1.2.2.php','repair_asset_id':int(os.environ['REPAIR_ID']),'repair_bytes':int(os.environ['REPAIR_BYTES']),'repair_sha256':os.environ['REPAIR_SHA256'],
            'atomic_run':int(os.environ['ATOMIC_RUN']),'atomic_job':int(os.environ['ATOMIC_JOB']),'supplement_run':int(os.environ['SUPPLEMENT_RUN']),'supplement_job':int(os.environ['SUPPLEMENT_JOB']),
            'core_updates_main':os.environ['CORE_UPDATES_MAIN'],'manifest_run':int(os.environ['MANIFEST_RUN']),'manifest_job':int(os.environ['MANIFEST_JOB']),
            'schema':'VF-SEO-SCHEMA@1 / 1','backup_required':True,'rollback_supported':True,'state':'PASS_CLOSED'
          }
          v['production_closure_v1_2_2']={
            'state':'CLOSED','evidence_class':'OWNER_OBSERVED_SCREENSHOT_VERIFIED','machine_production_readback':False,
            'observed_version':'1.2.2','observed_system_update_entry':True,'deployment_method':'OWNER_VPS_SINGLE_PHP_REPAIR_V1.2.2',
            'release_target':os.environ['PRODUCT_SOURCE'],'core_updates_main':os.environ['CORE_UPDATES_MAIN'],
            'note':'Owner-provided Production UI screenshot confirms v1.2.2 and the restored 系统与更新 entry. This is not represented as machine Production readback.'
          }
          v.setdefault('authority',{})['release']='docs/authority/RELEASE_V1.2.2_PRODUCTION_CLOSURE.md'
          v['authority']['release_candidate']='docs/authority/RELEASE_V1.2.2_CANDIDATE.md'
          p.write_text(json.dumps(v,ensure_ascii=False,indent=2)+'\n')

          c=Path('CHANGELOG.md'); s=c.read_text()
          entry='''## 1.2.2 · Product v2 更新入口 Hotfix（正式发布 / Production Owner-observed · 2026-09-02）\n\n- 修复 Product v2 左侧导航未挂载“系统与更新”入口的问题：更新快捷入口同时支持 classic `.secondary-nav` 与 Product v2 `.p05v2-secondary`。\n- 保持 v1.2.1 简化后的更新体验：Owner 只看到当前版本、最新版本、检查更新、立即更新、自动备份与回滚；GitHub Token / core-updates / runtime.env 等基础设施不再暴露给普通更新页面。\n- 正式 Release：`v1.2.2` / Release ID `380671190` / source `04e4b8546357301e90b6ab7d9b50907369ea58eb` / FULL Asset `539843543` / 512336 bytes / SHA-256 `fb2bdcd4efb6edd408fb81635b488415d756622f031897acb89021747bf6b297`。\n- Direct Atomic Bridge `v1.2.1 → v1.2.2`：Run `33533825437` / Job `99943145098` PASS；`repair-v1.2.2.php` Asset `539856093` / SHA-256 `5ad86463cafc28642f8782069393d9464308aada75617a053c58d51983f12901`；UPDATE Asset `539856092` / SHA-256 `078fccae7e3097d842b15233d5325c174abc711d891fe1c9e3952325738a09a2`。\n- core-updates `main=e93f07c5ee84e114e0829ea65f217e768b21ce44` 已发布 `1.2.1 → 1.2.2 / ATOMIC` Channel；Schema 保持 `VF-SEO-SCHEMA@1 / 1`，backup required / rollback supported。\n- Owner 已在 VPS 使用正式 single-PHP repair 完成升级；Owner 提供的 Production 后台截图显示 `P05 · Product Optimization · v1.2.2`，且左侧 GLOBAL 中“系统与更新”入口可见。证据等级为 `OWNER_OBSERVED / SCREENSHOT_VERIFIED`，不冒充 Machine Production Readback。\n\n'''
          assert s.startswith('# 变更记录\n') and '## 1.2.2 · Product v2 更新入口 Hotfix' not in s
          c.write_text('# 变更记录\n\n'+entry+s[len('# 变更记录\n\n'):])

          r=Path('README.md'); s=r.read_text()
          start=s.index('## Current Truth')
          hist=s.index('## V1.1.10 → V1.1.11 Canonical Atomic Bridge')
          current='''## Current Truth\n\n```text\nProject: P05 · VF SEO\nRepository: llhzx2018/vf-seo\nCurrent Formal Release: v1.2.2 · RELEASED\nRelease Main / Tag Target: 04e4b8546357301e90b6ab7d9b50907369ea58eb\nVerified Tree: 0822f722244724c666d7aa660634e247436f1c12\nFinal Exact Source Gate: 33532743356 / 99939619178 · PASS\nFormal Publication: 33533485831 / 99942039835 · PASS\nFULL: Asset 539843543 · 512336 bytes\nFULL SHA-256: fb2bdcd4efb6edd408fb81635b488415d756622f031897acb89021747bf6b297\nAtomic Bridge: 1.2.1 → 1.2.2 · PASS\nAtomic Gate: 33533825437 / 99943145098 · PASS\nCanonical Repair: repair-v1.2.2.php · Asset 539856093\nRepair SHA-256: 5ad86463cafc28642f8782069393d9464308aada75617a053c58d51983f12901\nCanonical UPDATE: VF_SEO_V1.2.2_UPDATE.zip · Asset 539856092\nUPDATE SHA-256: 078fccae7e3097d842b15233d5325c174abc711d891fe1c9e3952325738a09a2\ncore-updates Manifest Gate: 33534786090 / 99946331208 · PASS\ncore-updates Main: e93f07c5ee84e114e0829ea65f217e768b21ce44\nDistribution Channel: 1.2.1 → 1.2.2 · ATOMIC\nProduction: v1.2.2 · OWNER_OBSERVED / SCREENSHOT_VERIFIED\nProduction Machine Readback: NOT CLAIMED\nSchema: VF-SEO-SCHEMA@1 / 1\nDefault Database: SQLite\n```\n\nOwner 已使用正式 `repair-v1.2.2.php` 在 VPS 完成升级。Owner 提供的 Production 后台截图明确显示运行版本 `v1.2.2`，并确认 Product v2 左侧 GLOBAL 区域恢复“系统与更新”入口。本仓将该证据记录为 `OWNER_OBSERVED / SCREENSHOT_VERIFIED`，不升级为未实际执行的 Machine Production Readback。\n\n## V1.2.1 → V1.2.2 Current Atomic Bridge\n\n当前正式升级桥为单 PHP Atomic：`v1.2.1 → repair-v1.2.2.php → v1.2.2`。Machine Gate 已覆盖正式 Release bytes、Recovery Point、私有数据与 Runtime Pointer 保留、幂等、失败回滚、硬中断恢复、浏览器 single-PHP 与 reverse-proxy HTTPS same-origin。Canonical Distribution Authority 为 `core-updates/main/projects/P05.json`。\n\n## 历史：V1.1.10 → V1.1.11 Canonical Atomic Bridge\n'''
          # Preserve the historical section body but relabel its heading.
          old=s[hist:]
          old=old.replace('## V1.1.10 → V1.1.11 Canonical Atomic Bridge','',1).lstrip('\n')
          r.write_text(s[:start]+current+'\n'+old)

          d=Path('docs/authority/RELEASE_V1.2.2_PRODUCTION_CLOSURE.md')
          d.write_text('''# P05 · VF SEO v1.2.2 Production Closure\n\nStatus: **PASS / CLOSED**  \nEvidence class: **OWNER_OBSERVED / SCREENSHOT_VERIFIED**  \nMachine Production Readback: **NOT CLAIMED**\n\n## 1. Release Authority\n\n- Tag: `v1.2.2`\n- Release ID: `380671190`\n- Release / Tag target: `04e4b8546357301e90b6ab7d9b50907369ea58eb`\n- Release tree: `0822f722244724c666d7aa660634e247436f1c12`\n- FULL Asset ID: `539843543`\n- FULL bytes: `512336`\n- FULL SHA-256: `fb2bdcd4efb6edd408fb81635b488415d756622f031897acb89021747bf6b297`\n- Final Exact Source Gate: Run `33532743356` / Job `99939619178` · PASS\n- Formal Publication: Run `33533485831` / Job `99942039835` · PASS\n\nThe v1.2.2 Tag remains fixed to the release source above. This post-release closure document does not repoint the Tag.\n\n## 2. Atomic Distribution Authority\n\nDirect bridge: `v1.2.1 → v1.2.2`\n\n- Atomic Gate: Run `33533825437` / Job `99943145098` · PASS\n- `repair-v1.2.2.php`: Asset `539856093`, `3651613` bytes, SHA-256 `5ad86463cafc28642f8782069393d9464308aada75617a053c58d51983f12901`\n- `VF_SEO_V1.2.2_UPDATE.zip`: Asset `539856092`, `1162103` bytes, SHA-256 `078fccae7e3097d842b15233d5325c174abc711d891fe1c9e3952325738a09a2`\n- Supplemental Release publication: Run `33534562135` / Job `99945575241` · PASS\n- Atomic gate coverage: actual upgrade, private data preservation, Runtime Pointer preservation, idempotence, rollback, hard interruption recovery, browser single-PHP, reverse-proxy HTTPS same-origin · PASS\n- Schema: `VF-SEO-SCHEMA@1 / 1` · unchanged\n\n## 3. core-updates Authority\n\n- `core-updates` main: `e93f07c5ee84e114e0829ea65f217e768b21ce44`\n- Manifest: `projects/P05.json`\n- Channel: `1.2.1 → 1.2.2 / ATOMIC`\n- Manifest Gate: Run `33534786090` / Job `99946331208` · PASS\n- Runtime contract: `1.2.1 = AVAILABLE`, `1.2.2 = UP_TO_DATE`, unsupported source = `BLOCKED_SOURCE_VERSION`\n- `backup_required=true`; `rollback_supported=true`\n\n## 4. Production Evidence\n\nThe Owner executed the canonical `repair-v1.2.2.php` on the P05 VPS. After the upgrade, the Owner supplied a Production backend screenshot showing:\n\n- header `P05 · Product Optimization · v1.2.2`;\n- Product v2 sidebar rendered normally;\n- GLOBAL section includes the restored `系统与更新` entry.\n\nTherefore Production is recorded as **v1.2.2 OWNER_OBSERVED / SCREENSHOT_VERIFIED**. No automated browser/API/SSH Production readback was performed by this closure window, so this record must not be interpreted as `MACHINE_VERIFIED_PRODUCTION`.\n\n## 5. Product Closure\n\nThe v1.2.2 hotfix closes the Product v2 update-entry regression without changing backend update semantics, database schema, Demo Dataset semantics, authentication model, or provider truth model. Normal post-release work returns to L2 Product Optimization / maintenance.\n''')
          PY

          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = 'CHANGELOG.md README.md VF_PROJECT.json docs/authority/RELEASE_V1.2.2_PRODUCTION_CLOSURE.md '
          python3 - <<'PY'
          import json
          v=json.load(open('VF_PROJECT.json'))
          assert v['version']==v['production_version']==v['target_version']==v['working_version']=='1.2.2'
          assert v['version_change'] is False
          assert 'OWNER_OBSERVED_SCREENSHOT_VERIFIED' in v['status']
          assert v['production_closure_v1_2_2']['machine_production_readback'] is False
          assert v['formal_release_id']==380671190 and v['formal_release_asset_id']==539843543
          assert v['atomic_distribution_v1_2_2']['core_updates_main']=='e93f07c5ee84e114e0829ea65f217e768b21ce44'
          for f in ['README.md','CHANGELOG.md','docs/authority/RELEASE_V1.2.2_PRODUCTION_CLOSURE.md']:
              s=open(f).read(); assert 'v1.2.2' in s or '1.2.2' in s
          closure=open('docs/authority/RELEASE_V1.2.2_PRODUCTION_CLOSURE.md').read()
          assert 'Machine Production Readback: **NOT CLAIMED**' in closure
          assert 'MACHINE_VERIFIED_PRODUCTION' in closure
          print('P05_V122_CLOSURE_AUTHORITY_CONTENT=PASS')
          PY

      - name: Commit and push closure candidate to private P05 branch
        working-directory: p05
        env:
          PUSH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add VF_PROJECT.json CHANGELOG.md README.md docs/authority/RELEASE_V1.2.2_PRODUCTION_CLOSURE.md
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = 'CHANGELOG.md README.md VF_PROJECT.json docs/authority/RELEASE_V1.2.2_PRODUCTION_CLOSURE.md '
          git commit -m 'docs(P05): close v1.2.2 Production authority'
          candidate=$(git rev-parse HEAD); tree=$(git rev-parse HEAD^{tree})
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/llhzx2018/vf-seo.git" HEAD:refs/heads/$PRODUCT_BRANCH
          echo "P05_V122_CLOSURE_CANDIDATE=$candidate"
          echo "P05_V122_CLOSURE_TREE=$tree"
          echo P05_V122_CLOSURE_WRITER=PASS
          echo P05_PRODUCT_CODE_WRITE=0
          echo P05_TAG_WRITE=0
          echo P05_PRODUCTION_WRITE=0
