name: p01-r3-batch-b-temp

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-r3-batch-b-temp.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      BASE_SHA: 581a4939b6fe64d96f278f886d716d5fde451df8
      TARGET_SHA: 417867670d2caa34d552fcc5a340a5c9b302dc07
    steps:
      - name: Checkout runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout exact P01 sources
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          for name in baseline current; do
            git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "$name"
          done
          git -C baseline fetch -q --depth 1 origin "$BASE_SHA"
          git -C baseline checkout -q --detach FETCH_HEAD
          git -C current fetch -q --depth 1 origin "$TARGET_SHA"
          git -C current checkout -q --detach FETCH_HEAD
          test "$(git -C baseline rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C current rev-parse HEAD)" = "$TARGET_SHA"
          echo P01_R3_B_EXACT_SOURCES=PASS

      - name: Focused supersession guards
        shell: bash
        run: |
          set -Eeuo pipefail
          cd current
          tests=(
            tests/unit/course_experience_source_contract.php
            tests/unit/hifi_product_pages_contract.php
            tests/unit/home_action_center_source_contract.php
            tests/unit/home_action_only_contract.php
            tests/unit/home_attention_deeplink_contract.php
            tests/unit/home_readability_contract.php
            tests/unit/home_signal_quality_contract.php
            tests/unit/pending_batch_secondary_mode_contract.php
            tests/unit/pending_first_screen_focus_contract.php
            tests/unit/pending_focus_primary_alignment_contract.php
            tests/unit/pending_next_focus_primary_action_contract.php
            tests/unit/pending_single_action_prg_contract.php
            tests/unit/post_hifi_continuity_contract.php
            tests/unit/project_action_context_accessibility_contract.php
            tests/unit/project_add_status_context_contract.php
            tests/unit/project_attention_continuity_contract.php
            tests/unit/project_chip_context_count_contract.php
            tests/unit/project_drawer_focus_return_contract.php
            tests/unit/project_empty_current_state_context_contract.php
            tests/unit/project_entry_source_semantics_contract.php
            tests/unit/project_filtered_focus_contract.php
            tests/unit/project_more_accessibility_contract.php
            tests/unit/project_overview_action_first_contract.php
            tests/unit/project_primary_action_click_contract.php
            tests/unit/project_signal_failure_degradation_contract.php
            tests/unit/project_signals_contract.php
            tests/unit/project_state_context_count_contract.php
            tests/unit/project_supplement_entry_focus_contract.php
            tests/unit/software_group_explainability_contract.php
            tests/unit/software_workspace_source_contract.php
            tests/unit/tool_home_source_contract.php
            tests/unit/tool_scene_detail_source_contract.php
            tests/unit/topic_project_approved_contract.php
            tests/unit/uxui_round1_home_root_contract.php
            tests/unit/uxui_round2_subject_identity_contract.php
            tests/unit/uxui_round3_course_identity_contract.php
            tests/unit/uxui_round4_tools_identity_contract.php
            tests/unit/uxui_round5_software_identity_contract.php
            tests/unit/uxui_round6_channels_watch_identity_contract.php
            tests/unit/uxui_round7_navigation_home_identity_contract.php
            tests/unit/uxui_round8_visual_system_contract.php
          )
          test "${#tests[@]}" -eq 41
          for t in "${tests[@]}"; do php "$t"; done
          echo P01_R3_B_SUPERSESSION_GUARDS=PASS

      - name: Canonical debt comparison
        shell: bash
        run: |
          set -Eeuo pipefail
          bash current/tests/canonical_release_regression.sh current baseline | tee /tmp/canonical.txt
          grep -q '^P01_CANONICAL_BASELINE_FAILURE_COUNT=101$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_CURRENT_FAILURE_COUNT=60$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_CHANGED_TEST_COUNT=41$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_RESOLVED_DEBT_COUNT=41$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_CHANGED_FAILURE_COUNT=0$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_NEW_REGRESSION_COUNT=0$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_UNIT_REGRESSION=PASS$' /tmp/canonical.txt
          echo P01_R3_B_CANONICAL=PASS

      - name: Runtime source unchanged by batch
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C current fetch -q --depth 1 origin "$BASE_SHA"
          git -C current diff --exit-code "$BASE_SHA" "$TARGET_SHA" -- src
          test "$(cat current/VERSION)" = "2.47.41"
          test -z "$(git -C current status --porcelain --untracked-files=no)"
          echo P01_R3_B_RUNTIME_UNCHANGED=PASS
