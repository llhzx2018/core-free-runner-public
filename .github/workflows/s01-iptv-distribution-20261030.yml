name: S01 theme distribution independent verification
on:
  push:
    branches: [task/s01-iptv-proof-20261030]
    paths: ['.github/workflows/s01-iptv-distribution-20261030.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ab5ec4b5dbd53e286a18b910704c860f81d2bd94
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Exact distribution contract and native CI tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = ab5ec4b5dbd53e286a18b910704c860f81d2bd94
          python3 scripts/check_manifest_contract.py
          php -v
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PY'
          import json
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']=='1.35.219' and m['release_tag']=='v1.35.219'
          assert m['asset_name']=='vf-tools-theme_V1.35.219.zip'
          assert m['asset_sha256']=='63168488e5f91b845469847cc6eb2c69534532c816ed5087e653ceeeb5aed64c'
          assert m['asset_bytes']==2027084 and m['runtime_files']==476
          assert all(x in m['from_versions'] for x in ['1.35.216','1.35.218'])
          print('S01_THEME_MANIFEST_EXACT_PASS')
          PY

# Read the private distribution repository with the established read credential.
