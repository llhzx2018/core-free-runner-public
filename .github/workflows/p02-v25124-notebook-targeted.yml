name: P02 V2.5.124 Notebook Targeted Probe
on:
  push:
    branches: [run/p02-v25124-full-product-ui-closure-20260926]
    paths:
      - '.github/workflows/p02-v25124-notebook-targeted.yml'
      - 'requests/p02-v25124-notebook-targeted.sh'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 2811b8a0f18e0e21097e5b34b0b79ee35059e7f2
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-zip sqlite3 unzip curl
          cd product
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: bash runner/requests/p02-v25124-notebook-targeted.sh
