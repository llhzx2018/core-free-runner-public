name: P08 R76 official four-asset wire fixture + real MySQL MariaDB native Atomic rollback
on:
  push:
    branches: [test/p08-r76-official-sql-20261113]

permissions:
  contents: read

jobs:
  r76-real-sql-owner-preparation-to-atomic:
    strategy:
      fail-fast: false
      matrix:
        include:
          - driver: mysql
            image: mysql:8.4
            health: mysqladmin ping --silent
          - driver: mariadb
            image: mariadb:11.8
            health: healthcheck.sh --connect --innodb_initialized
    runs-on: ubuntu-24.04
    timeout-minutes: 34
    services:
      sql:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: synthetic-only-p08-ci-pass
          MARIADB_ROOT_PASSWORD: synthetic-only-p08-ci-pass
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      P08_ISOLATED_INSTALL_TEST: YES
      P08_TEST_DB_DRIVER: ${{ matrix.driver }}
      P08_TEST_DB_HOST: 127.0.0.1
      P08_TEST_DB_CLEAN: p08_ci_clean
      P08_TEST_DB_DIRTY: p08_ci_dirty
      P08_TEST_DB_RESTORE: p08_ci_restore
      P08_TEST_DB_FULL_RESTORE: p08_ci_full_restore
      P08_TEST_DB_USER: root
      P08_TEST_DB_PASSWORD: synthetic-only-p08-ci-pass
      P08_R71_REAL_ZIP_TEST: YES
    steps:
      - name: Check independent machine/test-site scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = llhzx2018/core-free-runner-public
          test "$GITHUB_REF_NAME" = test/p08-r76-official-sql-20261113
          echo 'P08_R71_PUBLIC_SAFE_SYNTHETIC_FIXTURE=YES'
          echo 'P08_R71_PRODUCTION_AND_FORMAL_RELEASE=NO'
      - name: Read the EXACT P08 PR22 private commit and both predecessor source commits
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: a289904c8e993245745b1c363bb7945c71d1cd79
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Native PHP 8.4 Composer/SQLite/ZIP/sodium
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: sqlite3,pdo_sqlite,pdo_mysql,zip,curl,sodium,mbstring,dom,xml,intl,bcmath,fileinfo
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact source identities and test script syntax
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = a289904c8e993245745b1c363bb7945c71d1cd79
          test "$(cat VERSION)" = 0.1.1
          git cat-file -e a68c2cc79e88dcf67c50d02851c26c003cc35d4b^{commit}
          git cat-file -e 55ecbc8461a4d90fe7241a00caffa55e557cde1c^{commit}
          php -l tests/compatibility/p08_r71_real_flat_bridge_atomic.php
          php -l tests/compatibility/p08_r71_real_atomic_post_bridge.php
          php -l tests/compatibility/p08_r76_real_official_prepare.php
          echo 'P08_R71_EXACT_P08_SOURCE_AND_OLD_BRIDGE_HISTORY=PASS'
      - name: Actual two FULL + Atomic from locked Composer/Vite Git sources
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail
          python3 scripts/build_owner_atomic_pair.py \
            --repo "$PWD" \
            --target-sha a289904c8e993245745b1c363bb7945c71d1cd79 \
            --output-dir "$RUNNER_TEMP/p08-r71-real-artifacts"
          python3 scripts/verify_owner_atomic_pair.py \
            "$RUNNER_TEMP/p08-r71-real-artifacts" \
            a68c2cc79e88dcf67c50d02851c26c003cc35d4b a289904c8e993245745b1c363bb7945c71d1cd79
          echo 'P08_R71_REAL_BRIDGE_TARGET_UPDATE_PACKAGE_PAIR=PASS'
      - name: Independently build true historical flat 0.1.0 Owner FULL
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail
          mkdir "$RUNNER_TEMP/p08-r71-flat-src"
          git archive --format=tar 55ecbc8461a4d90fe7241a00caffa55e557cde1c | \
            tar -xf - -C "$RUNNER_TEMP/p08-r71-flat-src"
          test "$(cat "$RUNNER_TEMP/p08-r71-flat-src/VERSION")" = 0.1.0
          cd "$RUNNER_TEMP/p08-r71-flat-src"
          composer install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress --classmap-authoritative >/dev/null
          npm ci --no-audit --no-fund >/dev/null
          npm run build >/dev/null
          cd "$GITHUB_WORKSPACE/source"
          # Use the immutable legacy 0.1.0 builder, not the newer 0.1.1
          # builder whose added runtime cache member did not yet exist in 0.1.0.
          # This is a true old-source FULL, not a fabricated metadata patch.
          python3 "$RUNNER_TEMP/p08-r71-flat-src/scripts/build_full.py" \
            --source "$RUNNER_TEMP/p08-r71-flat-src" \
            --output "$RUNNER_TEMP/p08-r71-old-flat-full.zip" \
            --version 0.1.0 \
            --source-sha 55ecbc8461a4d90fe7241a00caffa55e557cde1c
          echo 'P08_R71_GENUINE_PRE_BRIDGE_FLAT_0_1_0_FULL=PASS'
      - name: Install actual old and Bridge FULL bytes in two disposable root instances
        shell: bash
        run: |
          set -Eeuo pipefail
          for x in p08-r71-site-success p08-r71-site-fault p08-r71-bridge; do
            mkdir "$RUNNER_TEMP/$x"
          done
          unzip -q "$RUNNER_TEMP/p08-r71-old-flat-full.zip" -d "$RUNNER_TEMP/p08-r71-site-success"
          unzip -q "$RUNNER_TEMP/p08-r71-old-flat-full.zip" -d "$RUNNER_TEMP/p08-r71-site-fault"
          unzip -q "$RUNNER_TEMP/p08-r71-real-artifacts/VF_AdOps_V0.1.0_BRIDGE_FULL.zip" -d "$RUNNER_TEMP/p08-r71-bridge"
          echo 'P08_R71_OLD_SITE_AND_BRIDGE_REAL_FULL_EXTRACTED=PASS'
      - name: Prepare exact disposable SQL databases and server-native CLI client
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail
          if [ "$P08_TEST_DB_DRIVER" = mariadb ]; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mariadb-client >/dev/null
            command -v mariadb-dump
          else
            command -v mysqldump
          fi
          php tests/fixtures/create_ci_databases.php
          echo 'P08_R72_DISPOSABLE_REAL_SQL_FIXTURE=PASS'
      - name: Real old installed SQL Owner Bridge signed synthetic offer and independent native CLI worker
        shell: bash
        run: |
          set -Eeuo pipefail
          php source/tests/compatibility/p08_r71_real_flat_bridge_atomic.php \
            "$RUNNER_TEMP/p08-r71-site-success" \
            "$RUNNER_TEMP/p08-r71-bridge" \
            "$RUNNER_TEMP/p08-r71-real-artifacts/VF_AdOps_V0.1.1_UPDATE.zip" \
            55ecbc8461a4d90fe7241a00caffa55e557cde1c \
            a68c2cc79e88dcf67c50d02851c26c003cc35d4b \
            a289904c8e993245745b1c363bb7945c71d1cd79 success | tee "$RUNNER_TEMP/p08-r71-success-output.txt"
          P08_R76_OFFICIAL_FIXTURE=YES php source/tests/compatibility/p08_r76_real_official_prepare.php \
            "$RUNNER_TEMP/p08-r71-site-success" \
            "$RUNNER_TEMP/p08-r71-real-artifacts/VF_AdOps_V0.1.1_UPDATE.zip" \
            "$RUNNER_TEMP/p08-r71-real-artifacts/VF_AdOps_V0.1.1_FULL.zip" \
            a68c2cc79e88dcf67c50d02851c26c003cc35d4b \
            a289904c8e993245745b1c363bb7945c71d1cd79 prepare-and-apply | tee -a "$RUNNER_TEMP/p08-r71-success-output.txt"
          grep -Fxq 'P08_R71_ACTUAL_FLAT_TO_COMPATIBLE_BRIDGE_AND_PRIVATE_DATA=PASS' "$RUNNER_TEMP/p08-r71-success-output.txt"
          grep -Fxq 'P08_R76_REAL_FOUR_ASSET_DOWNLOAD_ED25519_NATIVE_BACKUP_PREPARED=PASS' "$RUNNER_TEMP/p08-r71-success-output.txt"
          grep -Fxq 'P08_R76_REAL_OWNER_TWO_CLICKS_PREPARATION_THEN_SEPARATE_CLI_ATOMIC=PASS' "$RUNNER_TEMP/p08-r71-success-output.txt"
          grep -Fq "P08_R76_${P08_TEST_DB_DRIVER}_NATIVE_OWNER_DB_AND_LANDING_PRESERVED=PASS" "$RUNNER_TEMP/p08-r71-success-output.txt"
          echo 'P08_R76_REAL_SQL_FOUR_ASSET_PREPARATION_AND_NATIVE_ATOMIC=PASS'
      - name: Actual HTTP request to upgraded stable Laravel 0.1.1 gateway, setup must stay locked
        shell: bash
        run: |
          set -Eeuo pipefail
          php -S 127.0.0.1:18871 \
            -t "$RUNNER_TEMP/p08-r71-site-success/public" \
            "$RUNNER_TEMP/p08-r71-site-success/public/index.php" \
            > "$RUNNER_TEMP/p08-r71-http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          status="$(curl -sS -o "$RUNNER_TEMP/p08-r71-health-body" -w '%{http_code}' http://127.0.0.1:18871/up)"
          test "$status" = 200 || { echo "P08_R71_HTTP_HEALTH_BLOCKED=$status"; exit 8; }
          status="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18871/setup.php)"
          test "$status" = 503 || { echo "P08_R71_SETUP_LOCK_BLOCKED=$status"; exit 8; }
          echo 'P08_R71_REAL_STABLE_HTTP_0_1_1_HEALTH_AND_SETUP_LOCK=PASS'
      - name: Separate actual SQL old Owner instance with after-swap rollback preserving DB and private files
        shell: bash
        run: |
          set -Eeuo pipefail
          # Each test instance uses a DISTINCT clean disposable SQL schema.
          # The first Owner success used p08_ci_clean; the fault scenario
          # starts from the separate fixture p08_ci_full_restore.
          P08_TEST_DB_CLEAN="$P08_TEST_DB_FULL_RESTORE" php source/tests/compatibility/p08_r71_real_flat_bridge_atomic.php \
            "$RUNNER_TEMP/p08-r71-site-fault" \
            "$RUNNER_TEMP/p08-r71-bridge" \
            "$RUNNER_TEMP/p08-r71-real-artifacts/VF_AdOps_V0.1.1_UPDATE.zip" \
            55ecbc8461a4d90fe7241a00caffa55e557cde1c \
            a68c2cc79e88dcf67c50d02851c26c003cc35d4b \
            a289904c8e993245745b1c363bb7945c71d1cd79 fault-after-swap | tee "$RUNNER_TEMP/p08-r71-fault-output.txt"
          P08_TEST_DB_CLEAN="$P08_TEST_DB_FULL_RESTORE" php source/tests/compatibility/p08_r71_real_atomic_post_bridge.php \
            "$RUNNER_TEMP/p08-r71-site-fault" \
            "$RUNNER_TEMP/p08-r71-bridge" \
            "$RUNNER_TEMP/p08-r71-real-artifacts/VF_AdOps_V0.1.1_UPDATE.zip" \
            a68c2cc79e88dcf67c50d02851c26c003cc35d4b \
            a289904c8e993245745b1c363bb7945c71d1cd79 fault-after-swap | tee -a "$RUNNER_TEMP/p08-r71-fault-output.txt"
          grep -Fxq 'P08_R71_ACTUAL_FLAT_TO_COMPATIBLE_BRIDGE_AND_PRIVATE_DATA=PASS' "$RUNNER_TEMP/p08-r71-fault-output.txt"
          grep -Fxq 'P08_R71_REAL_ATOMIC_STAGED_SIGNED_EPHEMERAL_TEST_KEY_NO_SWITCH=PASS' "$RUNNER_TEMP/p08-r71-fault-output.txt"
          grep -Fxq 'P08_R71_REAL_TARGET_POINTER_FAULT_AND_AUTOMATIC_CODE_ROLLBACK=PASS' "$RUNNER_TEMP/p08-r71-fault-output.txt"
          grep -Fq 'P08_R71_NATIVE_OWNER_LANDING_ENV_AND_PRIVATE_HTML_PRESERVED=PASS engine=' "$RUNNER_TEMP/p08-r71-fault-output.txt"
          echo 'P08_R71_ACTUAL_NATIVE_SQLITE_BACKUP_FRESH_AND_FAULT_ROLLBACK=PASS'
      - name: Remove all unshipped private code, credentials and transient ZIPs
        if: always()
        shell: bash
        run: |
          rm -rf source \
            "$RUNNER_TEMP/p08-r71-flat-src" \
            "$RUNNER_TEMP/p08-r71-real-artifacts" \
            "$RUNNER_TEMP/p08-r71-site-success" \
            "$RUNNER_TEMP/p08-r71-site-fault" \
            "$RUNNER_TEMP/p08-r71-bridge"
          rm -f "$RUNNER_TEMP/p08-r71-old-flat-full.zip" \
            "$RUNNER_TEMP/r71-offer-success.json" "$RUNNER_TEMP/r71-sig-success.txt" \
            "$RUNNER_TEMP/r71-offer-fault-after-swap.json" "$RUNNER_TEMP/r71-sig-fault-after-swap.txt" \
            "$RUNNER_TEMP/p08-r71-http.log" "$RUNNER_TEMP/p08-r71-health-body" \
            "$RUNNER_TEMP/p08-r71-success-output.txt" "$RUNNER_TEMP/p08-r71-fault-output.txt"
          echo 'P08_R71_PUBLIC_PRIVATE_SOURCE_AND_SITE_DATA_PERSISTED=NO'
