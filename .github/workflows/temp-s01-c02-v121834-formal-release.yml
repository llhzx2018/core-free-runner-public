name: TEMP S01-C02 Ops 1.21.834 Formal Release
on:
  push:
    branches:
      - temp/s01-c02-v121834-formal-release-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121834-formal-release.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PRODUCT_REPO: llhzx2018/vf-tools-ops
      COMMIT: 3f2fd2b83062bab477408feb2ff36ff2d832be8c
      TREE: 6be3c3bbd3e26cc947bab8e88af89ea39d840957
      TAG: v1.21.834
      ASSET: vf-tools-ops_V1.21.834.zip
      BYTES: '3267351'
      SHA256: a3f45a74d9bbc9e9d45d6edd9ad6c4fd394fb9f2f1c84e4484a47bc483985eaf
      FILES: '916'
      FP: 76e80015f6f639f48bf7f323e9412fb1e5571aea5c462e5f60e39a3825527cf0
    steps:
      - name: Verify authority gates and release absence
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for b in main develop; do
            B="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$PRODUCT_REPO/branches/$b")"
            test "$(jq -r .commit.sha <<<"$B")" = "$COMMIT"
            test "$(jq -r .commit.commit.tree.sha <<<"$B")" = "$TREE"
          done
          release_code="$(curl -sS -o /tmp/release.json -w '%{http_code}' -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$PRODUCT_REPO/releases/tags/$TAG")"
          test "$release_code" = 404
          tag_code="$(curl -sS -o /tmp/ref.json -w '%{http_code}' -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$PRODUCT_REPO/git/ref/tags/$TAG")"
          test "$tag_code" = 404
          J="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/core-free-runner-public/git/ref/heads/main)"
          test "$(jq -r .object.sha <<<"$J")" = '0160b557ad4ae0e8c6acd97e7551285bc05870bd'
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.COMMIT }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops
      - name: Rebuild exact artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$COMMIT"
          test "$(git -C ops rev-parse HEAD^{tree})" = "$TREE"
          test "$(tr -d '\r\n' < ops/VERSION)" = 1.21.834
          test "$(head -c 5 ops/includes/site-release/s01-static-zero-write-batch-retry-v121834.php)" = '<?php'
          python3 - <<'PY'
          import re,hashlib,zipfile,os
          from pathlib import Path
          root=Path('ops'); files={}
          def ok(r):
            p=r.as_posix(); q=p.split('/')
            if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in q): return False
            if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',p,re.I): return False
            if '/' not in p: return p in {'vf-ops.php','uninstall.php'}
            return q[0] in {'includes','assets','languages','config'}
          for s in root.rglob('*'):
            if s.is_file() and not s.is_symlink():
              r=s.relative_to(root)
              if ok(r): files[r.as_posix()]=s.read_bytes()
          files=dict(sorted(files.items())); fp=hashlib.sha256()
          for r,b in files.items(): fp.update((r+'\0'+hashlib.sha256(b).hexdigest()+'\n').encode())
          z=Path('/tmp/'+os.environ['ASSET'])
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as out:
            for r,b in files.items():
              info=zipfile.ZipInfo('vf-ops/'+r,(2026,9,5,0,0,0)); info.compress_type=zipfile.ZIP_DEFLATED; info.external_attr=0o100644<<16; out.writestr(info,b)
          assert z.stat().st_size == int(os.environ['BYTES'])
          assert hashlib.sha256(z.read_bytes()).hexdigest() == os.environ['SHA256']
          assert len(files) == int(os.environ['FILES'])
          assert fp.hexdigest() == os.environ['FP']
          PY
          unzip -tq "/tmp/$ASSET" >/dev/null
      - name: Create formal tag release and asset
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          VF Tools Ops V1.21.834 closes the recovered Static Candidate zero-write tail-batch boundary and adds one bounded fail-closed fresh Candidate retry from the already-trusted inspect-only Source.

          - Focused Gate 33989678423 PASS on exact source 3f2fd2b83062bab477408feb2ff36ff2d832be8c / tree 6be3c3bbd3e26cc947bab8e88af89ea39d840957; deterministic Artifact Identity 33989793315 PASS.
          - Production V1.21.833 proved the remaining 6 Source entries pass the real Candidate Entry Processor, produce zero new writes, and pass completeness; Stage 4 nevertheless remained terminal before the persisted offset advanced from 225/231.
          - V1.21.834 lazily opens the Candidate ZIP only after a real new output write is known, so a legitimate zero-write tail batch no longer performs an unnecessary append/close cycle.
          - Candidate ZIP close failure is normalized to a privacy-safe machine class instead of remaining unclassified.
          - The one-time retry requires the exact V1.21.833 zero-write probe signature, revalidates the trusted DONE inspect-only Source and durable SHA, creates a distinct fresh Candidate through the existing authoritative prepare path, and runs it with bounded WP-Cron continuation.
          - The old terminal Candidate is never reset or reused; Source is not uploaded or mutated; Final Audit and Candidate/package/finalOnline gates are not relaxed or forced.
          - M3U8 migration/data, Seed HOLD, JD.gg, WPvivid, schema, content governance and DNS are untouched.
          - Asset vf-tools-ops_V1.21.834.zip; 3267351 bytes; SHA256 a3f45a74d9bbc9e9d45d6edd9ad6c4fd394fb9f2f1c84e4484a47bc483985eaf; runtime files 916; fingerprint 76e80015f6f639f48bf7f323e9412fb1e5571aea5c462e5f60e39a3825527cf0.
          - Production upgrade is NOT executed by this GitHub Release.
          EOF
          gh release create "$TAG" "/tmp/$ASSET" --repo "$PRODUCT_REPO" --target "$COMMIT" --title 'VF Tools Ops v1.21.834' --notes-file /tmp/release-notes.md
