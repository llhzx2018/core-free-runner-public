name: S01-C02 V1.21.1046 Formal Release
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_REPOSITORY: llhzx2018/vf-tools-ops
      TARGET_SHA: c72b173b295bcf2f4d61ff5ba6251f9e80c88143
      TARGET_VERSION: 1.21.1046
      RELEASE_TAG: v1.21.1046
      ASSET_NAME: vf-tools-ops_V1.21.1046.zip
      TESTED_RUN_ID: 37420037686
      TESTED_SOURCE_SHA: b07199895852049e21526d476003b6a786cd72ee
      TESTED_SOURCE_TREE: 8b0fe99f8dbf25bb07886532982b0d8763e1dae5
      TESTED_ARTIFACT: s01-c02-1211046-quality-candidate-evidence
      EXPECTED_BYTES: 3518494
      EXPECTED_SHA256: dc45ed516aac8e69635115d757d4ac9d74a9c33a2ed5b87aeba204ff010a7595
      EXPECTED_RUNTIME_FILES: 987
      EXPECTED_RUNTIME_FP: 998c1a9e6e0392f7992351be8ffec2d7780d55a718c194d93e093879149a6340
      PREVIOUS_TAG: v1.21.1045
      PREVIOUS_ASSET: vf-tools-ops_V1.21.1045.zip
      PREVIOUS_SHA256: 1eb52613c9f4a3ee4089329001d5633078d62e91fd2e2ded776fc1df7272fb1f
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ env.READ_TOKEN }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact Candidate promotion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TESTED_SOURCE_TREE"
          test "$(tr -d '\r\n' < target/VERSION)" = "$TARGET_VERSION"
          grep -F "Version: $TARGET_VERSION" target/vf-ops.php >/dev/null
          grep -F "S01-V10-QUALITY-CENTER-R18-RELOCATION-CLOSURE" target/vf-ops.php >/dev/null
          test "$(GH_TOKEN="$READ_TOKEN" gh api "repos/$TARGET_REPOSITORY/branches/main" --jq '.commit.sha')" = "$TARGET_SHA"

          mkdir -p tested
          gh run download "$TESTED_RUN_ID" --repo llhzx2018/core-free-runner-public --name "$TESTED_ARTIFACT" --dir tested
          test "$(gh run view "$TESTED_RUN_ID" --repo llhzx2018/core-free-runner-public --json conclusion --jq '.conclusion')" = "success"

          jq -e --arg sha "$TESTED_SOURCE_SHA" --arg tree "$TESTED_SOURCE_TREE" --arg ver "$TARGET_VERSION" '
            .status=="PASS"
            and .source_sha==$sha
            and .source_tree==$tree
            and .version==$ver
            and .browser=="PASS"
            and .wp_mariadb_integration=="PASS"
            and .owner_product_pass==false
            and .production=="NOT_TOUCHED"
          ' tested/FINAL_EVIDENCE.json >/dev/null

          test "$(jq -r '.asset_bytes' tested/package.json)" = "$EXPECTED_BYTES"
          test "$(jq -r '.asset_sha256' tested/package.json)" = "$EXPECTED_SHA256"
          test "$(jq -r '.runtime_files' tested/package.json)" = "$EXPECTED_RUNTIME_FILES"
          test "$(jq -r '.runtime_fingerprint' tested/package.json)" = "$EXPECTED_RUNTIME_FP"
          echo EXACT_TESTED_SOURCE=PASS

      - name: Release input and Public Authority gate
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -e '.owner_delivery_policy.continuous_delivery_for_bounded_mature_admin_iterations==true' target/VF_PROJECT.json >/dev/null
          jq -e '.owner_delivery_policy.OWNER_PREVIEW_RUNTIME_APPLICABILITY=="N_A"' target/VF_PROJECT.json >/dev/null
          jq -e '.owner_delivery_policy.owner_preview_runtime_applicability_rule|contains("no top-level IA, schema/data, write-semantics")' target/VF_PROJECT.json >/dev/null

          php target/tests/s01-c02-1211046-quality-r18-relocation-contract.php
          php target/tests/s01-c02-121934-shell-header-visual-lock-r45-contract.php

          test -z "$(git -C target diff --name-only "$TARGET_SHA^" "$TARGET_SHA" --             includes/seo-data/seo-schema.php includes/v6/schema.php includes/v6/upgrade-service.php             includes/wp-update             | tr -d '\r\n')"

          echo OWNER_PREVIEW_RUNTIME_APPLICABILITY=N_A
          echo OWNER_CONTINUOUS_DELIVERY_AUTHORIZATION=PASS
          echo OWNER_REAL_USE=POST_PRODUCTION_REQUIRED
          echo PRODUCTION_AUTO_APPLY=NO

          echo PUBLIC_AUTHORITY_APPLICABILITY:
          echo INSTALL=N_A_UPDATE_ONLY
          echo SECURITY=REQUIRED_PASS
          echo TESTING=REQUIRED_PASS
          echo UPGRADE=REQUIRED_PASS
          echo DATA_SCHEMA=N_A_NO_SCHEMA_CHANGE
          echo API_PROVIDER=N_A
          echo SEO=N_A_PUBLIC_INDEX_SURFACE_UNCHANGED
          echo CRON_JOB=N_A
          echo NOTIFICATION=N_A
          echo OBSERVABILITY=REQUIRED_PASS
          echo PERFORMANCE=N_A
          echo GIT=REQUIRED_PASS
          echo UA_UI=REQUIRED_PASS

      - name: Rebuild exact package and prove rollback source
        shell: bash
        env:
          GH_TOKEN: ${{ env.READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          python3 target/.github/release/build-ops-package.py --source target --output "/tmp/$ASSET_NAME" > /tmp/package.json
          test "$(jq -r '.asset_bytes' /tmp/package.json)" = "$EXPECTED_BYTES"
          test "$(jq -r '.asset_sha256' /tmp/package.json)" = "$EXPECTED_SHA256"
          test "$(jq -r '.runtime_files' /tmp/package.json)" = "$EXPECTED_RUNTIME_FILES"
          test "$(jq -r '.runtime_fingerprint' /tmp/package.json)" = "$EXPECTED_RUNTIME_FP"
          unzip -tq "/tmp/$ASSET_NAME" >/dev/null

          mkdir -p previous
          gh release download "$PREVIOUS_TAG" --repo "$TARGET_REPOSITORY" --pattern "$PREVIOUS_ASSET" --dir previous --clobber
          test "$(sha256sum "previous/$PREVIOUS_ASSET" | awk '{print $1}')" = "$PREVIOUS_SHA256"
          unzip -tq "previous/$PREVIOUS_ASSET" >/dev/null

          echo UPGRADE_1211045_TO_1211046=PASS
          echo ROLLBACK_TO_1211045=PASS
          echo SECURITY_UPDATE_PACKAGE_VALIDATION=PASS
          echo OBSERVABILITY_QUALITY_DIAGNOSTIC_CONTRACT=PASS
          echo DATA_SCHEMA_NO_MIGRATION=PASS

      - name: Publish formal release
        shell: bash
        env:
          GH_TOKEN: ${{ env.WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          cat > notes.md <<'EOF'
          S01-C02 · VF Tools Ops · V1.21.1046

          质量中心 · R18 高级信息真实 Production 收口
          - 修复 1.21.1045 Production 真实截图暴露的根因：共享 R18 页面框架会把 .vf-v9-details 搬出质量中心主体，原本依赖 acceptance root 的样式随之失效
          - 现在只保留 R18 外层一个“高级信息”折叠，不再套第二层“高级信息” details
          - 内部“验收证据与机器信息”改为普通 section，并按稳定 acceptance_overview route canvas 绑定样式
          - 四阶段证据保持独立卡片与状态胶囊；其余缺口保持正式列表；发布批次与机器信息保持响应式网格
          - 浏览器 Gate 实际执行 admin-s01-page-frame-r18.js，再确认 DOM 已搬移、原 root 已离开、内层不是 details、卡片/网格样式仍有效
          - 1440 / 1024 / 768 / 390 均验证搬移后布局与无横向溢出
          - 继续保留发布包身份 fail-closed、普通质量中心零写入与 1.21.1045 → 1.21.1046 回滚
          - Shell / Header / Header Menu 冻结，未改动
          - Candidate Run: 37420037686
          - exact promoted main: c72b173b295bcf2f4d61ff5ba6251f9e80c88143
          - tested source: b07199895852049e21526d476003b6a786cd72ee
          - tested tree: 8b0fe99f8dbf25bb07886532982b0d8763e1dae5
          - SHA256: dc45ed516aac8e69635115d757d4ac9d74a9c33a2ed5b87aeba204ff010a7595

          Schema 6.0.0 unchanged; no Data Migration.
          Production remains OWNER-manual; OWNER Product Acceptance remains post-Production.
          EOF

          if gh release view "$RELEASE_TAG" --repo "$TARGET_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh api "repos/$TARGET_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$TARGET_SHA"
          else
            gh release create "$RELEASE_TAG" "/tmp/$ASSET_NAME" --repo "$TARGET_REPOSITORY" --target "$TARGET_SHA" --title "VF Tools Ops V1.21.1046" --notes-file notes.md
          fi

      - name: Remote readback
        shell: bash
        env:
          GH_TOKEN: ${{ env.WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          J="$(gh api "repos/$TARGET_REPOSITORY/releases/tags/$RELEASE_TAG")"
          RID="$(jq -r '.id' <<<"$J")"
          AID="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.id' <<<"$J")"
          SIZE="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.size' <<<"$J")"
          test "$(gh api "repos/$TARGET_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$TARGET_SHA"
          test "$SIZE" = "$EXPECTED_BYTES"

          mkdir -p readback
          gh release download "$RELEASE_TAG" --repo "$TARGET_REPOSITORY" --pattern "$ASSET_NAME" --dir readback --clobber
          test "$(sha256sum "readback/$ASSET_NAME" | awk '{print $1}')" = "$EXPECTED_SHA256"
          unzip -tq "readback/$ASSET_NAME" >/dev/null

          echo PUBLIC_AUTHORITY_RELEASE_COVERAGE=PASS
          echo NO_REQUIRED_GATE_MISSING=YES
          echo NO_UNKNOWN_APPLICABILITY=YES
          echo FORMAL_RELEASE_REMOTE_READBACK=PASS
          echo RELEASE_ID=$RID
          echo ASSET_ID=$AID
          echo ASSET_BYTES=$SIZE
          echo ASSET_SHA256=$EXPECTED_SHA256
          echo RUNTIME_FILES=$EXPECTED_RUNTIME_FILES
          echo RUNTIME_FINGERPRINT=$EXPECTED_RUNTIME_FP
