name: P03 V1.37.4 Publication
on:
  push:
    branches: [task/p03-v1374-common-baseline-release-20260828]
    paths:
      - '.github/workflows/p03-v1374-publication-20260828.yml'
      - 'scripts/p03-v1374-publication.sh'
permissions: {contents: read}
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Publish exact verified release and update channel
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: bash scripts/p03-v1374-publication.sh
      - name: Upload publication evidence
        uses: actions/upload-artifact@v4
        with:
          name: P03-V1.37.4-PUBLICATION-EVIDENCE
          path: ${{ runner.temp }}/p03-v1374-publication/publication-evidence/P03-V1.37.4-FORMAL-RELEASE.json
          if-no-files-found: error
          retention-days: 30
