name: P05 V1.0.2 Updater Version Identity Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p05-v102-updater-version-identity-fix-20260828.yml'

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SOURCE: b1d3bf5f84f17887e23378c3ec9c631a04fe6956
      TARGET_BRANCH: fix/p05-updater-version-identity-v102-20260828
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact P05 fix branch
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.EXPECTED_SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
          path: p05
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Replace hard-coded updater version with canonical VERSION read
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p05
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$EXPECTED_SOURCE"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('bin/vf-seo-updater.mjs')
          s=p.read_text(encoding='utf-8')
          old="const CURRENT_VERSION = '1.0.1';"
          new="const CURRENT_VERSION = readFileSync(new URL('../VERSION', import.meta.url), 'utf8').trim();"
          assert s.count(old)==1, 'expected one hard-coded version line'
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          test "$(git status --porcelain | wc -l)" -eq 1
          test "$(git status --porcelain | sed -E 's/^.. //')" = 'bin/vf-seo-updater.mjs'
          grep -Fq "const CURRENT_VERSION = readFileSync(new URL('../VERSION', import.meta.url), 'utf8').trim();" bin/vf-seo-updater.mjs
          ! grep -Eq "const CURRENT_VERSION = ['\"][0-9]+\.[0-9]+\.[0-9]+['\"]" bin/vf-seo-updater.mjs
          npm ci
          npm run test:contract
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add bin/vf-seo-updater.mjs
          git commit -m 'fix(P05): derive updater version from VERSION'
          NEW_SOURCE="$(git rev-parse HEAD)"
          git push origin "HEAD:$TARGET_BRANCH"
          echo P05_V102_UPDATER_IDENTITY_FIX=PASS
          echo P05_V102_UPDATER_FIX_SOURCE="$NEW_SOURCE"
