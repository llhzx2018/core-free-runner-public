name: P01 v517 exact-source three-engine full recovery and rollback
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  actual-full-three-engine:
    if: github.head_ref == 'test/p01-v517-final-3db-recovery-20261120' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: p01-only-synthetic-test
          MYSQL_DATABASE: p01_d1_test_mysql_20261111
        ports:
          - 3306:3306
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: p01-only-synthetic-test
          MARIADB_DATABASE: p01_d1_test_maria_20261111
        ports:
          - 3307:3306
    steps:
      - name: Confirm exact test route and synthetic-only data
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "$GITHUB_HEAD_REF" = "test/p01-v517-final-3db-recovery-20261120"
          echo "P01_D14_SCOPE=ISOLATED_EPHEMERAL_FULL_AND_LOCAL_SQL_CONTAINERS"
          echo "P01_D14_PRODUCTION_WRITES=NO"

      - name: Check registered private read capability
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          test -n "$READ_TOKEN"
          echo "P01_D14_PRIVATE_READ_CAPABILITY=PRESENT"

      - name: Read exact private candidate without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: fe8082b49cf9583332934ec268d716fef5081601
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
          fetch-depth: 0

      - name: Fetch verified previous P01 source for true cross-commit upgrade
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 4d7e7b7f13db2cf462f8efb7dd0c6f4081b6658b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: previous
          persist-credentials: false

      - name: Checkout current shared architecture naming rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov-doc

      - name: Verify true source diff architecture and naming
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B candidate/.github/checks/test_architecture_gate.py > "$RUNNER_TEMP/p01-final-arch-tests.log" 2>&1
          if ! python3 -B candidate/.github/checks/architecture_gate.py --manifest candidate/.github/checks/code_architecture.json --gov-root gov-doc --base-sha ab49e83c4715cc9246c4333679fc5388e554cc98 --head-sha fe8082b49cf9583332934ec268d716fef5081601 --git-root candidate > "$RUNNER_TEMP/p01-final-architecture.log" 2>&1; then
            python3 - <<'PY'
          import re,os
          from pathlib import Path
          s=(Path(os.environ['RUNNER_TEMP'])/'p01-final-architecture.log').read_text()
          m=re.search(r'PROJECT_ARCHITECTURE=BLOCKED:([A-Z0-9_]+)',s)
          print('P01_ARCH_GATE_SAFE_REASON='+(m.group(1) if m else 'UNCLASSIFIED'),flush=True)
          PY
            exit 1
          fi
          grep -F "PROJECT_ARCHITECTURE=STRUCTURAL_PASS" "$RUNNER_TEMP/p01-final-architecture.log"
          echo P01_V517_TRUE_DIFF_ARCHITECTURE_NAMING_NEGATIVES=PASS

      - name: Exact Git identity gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "fe8082b49cf9583332934ec268d716fef5081601"
          test "$(cat candidate/VERSION)" = "2.47.517"
          test "$(git -C previous rev-parse HEAD)" = "4d7e7b7f13db2cf462f8efb7dd0c6f4081b6658b"
          test "$(cat previous/VERSION)" = "2.47.517"
          test -f candidate/tests/compatibility/laravel/http/p01_d38_installed_code_swap_cli.php
          test -f candidate/tests/compatibility/laravel/http/run_cloudpanel_fpm_full_stage.py
          echo "P01_D14_EXACT_PRIVATE_HEAD=fe8082b49cf9583332934ec268d716fef5081601"

      - name: Prepare isolated actual PHP-FPM Nginx and composer build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq             nginx php8.3-fpm php8.3-cli php8.3-mysql php8.3-sqlite3             php8.3-mbstring php8.3-xml php8.3-curl php8.3-zip php8.3-gd php8.3-intl composer             openssl unzip >/dev/null
          command -v php-fpm8.3
          command -v nginx
          command -v openssl
          node --version
          npm --version
          php -r 'foreach(["sqlite","mysql"] as $d)if(!in_array($d,PDO::getAvailableDrivers(),true))exit(2);'
          echo "P01_D14_REAL_FPM_NGINX_PDO_AVAILABLE=PASS"

      - name: Validate Owner upgrade native PHP contract and no exec capability
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l candidate/src/api.php
          php -l candidate/src/app/next/runtime/OwnerSqliteRecovery.php
          php -l candidate/src/app/next/runtime/OwnerSqliteRecoveryReadback.php
          php -l candidate/src/app/next/runtime/OwnerSqliteRecoveryColumnDigests.php
          php -l candidate/src/app/next/http/OwnerUpgradeRoutes.php
          php -l candidate/src/app/next/routes/web.php
          php -l candidate/tests/unit/p01_d33_owner_update_routes_contract.php
          php candidate/tests/unit/p01_d33_owner_update_routes_contract.php
          php -l candidate/src/app/next/runtime/OwnerUpdateCredentialVault.php
          php -l candidate/src/app/next/runtime/OfficialChannelReadiness.php
          php -l candidate/tests/unit/p01_d36_owner_channel_contract.php
          php -l candidate/src/app/CoreUpdates/UpdateCore.php
          php -l candidate/src/app/CoreUpdates/GitHubClient.php
          php candidate/tests/unit/p01_d36_owner_channel_contract.php
          php -l candidate/src/app/next/runtime/ImmutableReleasePrivateLayout.php
          php -l candidate/src/app/next/public/setup.php
          php -l candidate/tests/unit/p01_d37_site_private_outside_code_contract.php
          php candidate/tests/unit/p01_d37_site_private_outside_code_contract.php
          php -l candidate/src/app/next/runtime/CloudPanelCodeSwap.php
          php -l candidate/src/app/next/runtime/IsolatedRecoverySnapshot.php
          php -l candidate/tests/compatibility/laravel/http/p01_d38_installed_code_swap_cli.php
          python3 -m py_compile candidate/tests/compatibility/laravel/http/run_d38_cross_source_upgrade.py
          echo P01_D38_CLI_AND_REAL_CLONE_TEST_SYNTAX=PASS
          echo P01_D37_EXTERNAL_PRIVATE_ROOT_NEGATIVE_CONTRACT=PASS
          python3 -m py_compile candidate/tests/compatibility/laravel/http/run_cloudpanel_fpm_full_stage.py
          echo P01_D36_CANONICAL_COREUPDATES_READ_AND_ENCRYPTED_TOKEN_NEGATIVES=PASS
          echo P01_D33_OWNER_UPGRADE_SOURCE_AND_PHP_NEGATIVES=PASS

      - name: Pinned Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Build exact-source real self-contained future FULL once
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 scripts/build_p01_next_clean_full.py build             --source-sha fe8082b49cf9583332934ec268d716fef5081601             --output "$RUNNER_TEMP/p01-d14-full.zip" --composer composer
          python3 scripts/build_p01_next_clean_full.py verify             --zip "$RUNNER_TEMP/p01-d14-full.zip"
          echo "P01_D14_EXACT_SOURCE_REAL_ZIP=PASS"
          python3 -m py_compile scripts/build_p01_next_cloudpanel_full.py
          python3 tests/unit/p01_d35_cloudpanel_layout_contract.py
          python3 scripts/build_p01_next_cloudpanel_full.py build \
            --source-zip "$RUNNER_TEMP/p01-d14-full.zip" \
            --output "$RUNNER_TEMP/p01-d35-cloudpanel.zip"
          python3 scripts/build_p01_next_cloudpanel_full.py verify \
            --zip "$RUNNER_TEMP/p01-d35-cloudpanel.zip"
          echo "P01_D35_EXACT_SOURCE_SINGLE_CLOUDPANEL_SITE_ZIP_VERIFIED=PASS"

      - name: Build PREVIOUS real self-contained FULL and CloudPanel source package
        shell: bash
        run: |
          set -Eeuo pipefail
          cd previous
          python3 scripts/build_p01_next_clean_full.py build \
            --source-sha 4d7e7b7f13db2cf462f8efb7dd0c6f4081b6658b \
            --output "$RUNNER_TEMP/p01-d38-old-full.zip" --composer composer
          python3 scripts/build_p01_next_clean_full.py verify \
            --zip "$RUNNER_TEMP/p01-d38-old-full.zip"
          python3 scripts/build_p01_next_cloudpanel_full.py build \
            --source-zip "$RUNNER_TEMP/p01-d38-old-full.zip" \
            --output "$RUNNER_TEMP/p01-d38-old-cloudpanel.zip"
          python3 scripts/build_p01_next_cloudpanel_full.py verify \
            --zip "$RUNNER_TEMP/p01-d38-old-cloudpanel.zip"
          echo "P01_D38_TWO_DISTINCT_REAL_GIT_SOURCE_PACKAGES_OLD=PASS"

      - name: Verify split Owner recovery Vue component on exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate/src/app/next/frontend
          npm ci --no-audit --no-fund
          npm run typecheck
          echo P01_V517_OWNER_MEDIA_SQLITE_COMPONENT_TYPES=PASS

      - name: Actual Chromium Owner upgrade UI 390 768 1440 and failure display
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate/src/app/next/frontend
          npx playwright install --with-deps chromium >/dev/null
          npm run test:e2e
          echo P01_D33_CHROMIUM_390_768_1440_CLICK_ONLY_FAILURE_STATES=PASS

      - name: Validate real Nginx TLS and PHP-FPM SQLite clean FULL browser HTTP
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 tests/compatibility/laravel/http/run_cloudpanel_fpm_full_stage.py             --bundle "$RUNNER_TEMP/p01-d35-cloudpanel.zip" --engine sqlite
          echo "P01_D14_SQLITE_REAL_FPM_FULL=PASS"
          echo "P01_D35_CLOUDPANEL_NATIVE_SQLITE_SITE_INSTALL_AND_OWNER=PASS"

      # MySQL/MariaDB services begin empty once: D38's *real old-version*
      # FULL install must own that clean database. Do not pre-install a
      # separate D35 fixture into the same live SQL service beforehand.
      - name: Preserve SQL clean-first-install identity for D38 real upgrade
        shell: bash
        run: |
          echo P01_D38_MARIADB_MYSQL_EMPTY_SOURCE_DATABASES_RESERVED_FOR_REAL_UPGRADE=PASS

      - name: D38 REAL SQLite code swap and encrypted backup clone restore
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 candidate/tests/compatibility/laravel/http/run_d38_cross_source_upgrade.py \
            --candidate candidate --previous-zip "$RUNNER_TEMP/p01-d38-old-cloudpanel.zip" \
            --candidate-zip "$RUNNER_TEMP/p01-d35-cloudpanel.zip" --engine sqlite

      - name: D38 REAL MariaDB 11.8 code swap and encrypted backup clone restore
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 candidate/tests/compatibility/laravel/http/run_d38_cross_source_upgrade.py \
            --candidate candidate --previous-zip "$RUNNER_TEMP/p01-d38-old-cloudpanel.zip" \
            --candidate-zip "$RUNNER_TEMP/p01-d35-cloudpanel.zip" --engine mariadb

      - name: D38 REAL MySQL 8.4 code swap and encrypted backup clone restore
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 candidate/tests/compatibility/laravel/http/run_d38_cross_source_upgrade.py \
            --candidate candidate --previous-zip "$RUNNER_TEMP/p01-d38-old-cloudpanel.zip" \
            --candidate-zip "$RUNNER_TEMP/p01-d35-cloudpanel.zip" --engine mysql

      - name: Reset only two named disposable SQL databases between independent test phases
        shell: bash
        run: |
          set -Eeuo pipefail
          php8.3 -r '
            foreach([3306=>"p01_d1_test_mysql_20261111",3307=>"p01_d1_test_maria_20261111"] as $port=>$name){
              if(!preg_match("/^p01_d1_test_(?:mysql|maria)_20261111$/D",$name))exit(2);
              $db=new PDO("mysql:host=127.0.0.1;port=".$port,"root","p01-only-synthetic-test",[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);
              $quoted=chr(96).$name.chr(96);
              $db->exec("DROP DATABASE IF EXISTS ".$quoted);
              $db->exec("CREATE DATABASE ".$quoted." CHARACTER SET utf8mb4 COLLATE utf8mb4_bin");
            }'
          echo P01_V517_DIFFERENT_CODE_UPGRADE_AND_OFFSITE_SQL_FIXTURES_ISOLATED=PASS

      - name: Entire one-file Owner backup real offsite restoration three engines
        shell: bash
        run: |
          set -Eeuo pipefail
          export P01_OFFSITE_EXACT_PACKAGE_ZIP="$RUNNER_TEMP/p01-d35-cloudpanel.zip"
          PYTHONDONTWRITEBYTECODE=1 python3 -B - <<'PY'
          import sys,os,tempfile
          from pathlib import Path
          sys.path.insert(0,"candidate/tests/compatibility/laravel/http")
          from run_cloudpanel_fpm_full_stage import Site
          bundle=Path(os.environ["P01_OFFSITE_EXACT_PACKAGE_ZIP"])
          for engine in ("sqlite","mariadb","mysql"):
              with tempfile.TemporaryDirectory(prefix="p01-d14-stage-") as temporary:
                  site=Site(Path(temporary),engine,bundle)
                  try:
                      site.start()
                      site.run(only_personal_offsite_full_restore=True)
                      print("P01_V517_FINAL_"+engine.upper()+"_INDEPENDENT_HTTPS_OFFSITE_RESTORED=PASS",flush=True)
                  finally:
                      site.stop()
          print("P01_V517_FINAL_ALL_THREE_SQL_ENGINES_FULL_BACKUP_RECOVERY=PASS",flush=True)
          PY

      - name: Private source and generated ZIP cleanup
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate previous gov-doc
          rm -f -- "$RUNNER_TEMP/p01-d14-full.zip" "$RUNNER_TEMP/p01-d35-cloudpanel.zip" "$RUNNER_TEMP/p01-d38-old-full.zip" "$RUNNER_TEMP/p01-d38-old-cloudpanel.zip"
          echo "P01_D14_PRIVATE_SOURCE_PERSISTED=NO"
          echo "P01_D14_TEST_ZIP_PERSISTED=NO"
          echo P01_V517_FINAL_PUBLIC_ARTIFACT_OR_OWNER_PRODUCTION_WRITE=NONE
