name: temp-s01-ops-121858-identity-inventory-20260908
on:
  push:
    branches:
      - temp/s01-page-update-center-v4-20260907
    paths:
      - .github/workflows/temp-s01-ops-121858-identity-inventory-20260908.yml
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      REPO: llhzx2018/vf-tools-ops
      BRANCH: work/s01-ops-dashboard-visible-ui-20260908
      HEAD_SHA: 3b3efca0aa46f914fe4f7434a6acbad7724b06c6
    steps:
      - name: Inventory version identity paths
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'INVENTORY_MODE=READ_ONLY MAIN_WRITE_USED=NO RELEASE_USED=NO DISTRIBUTION_USED=NO PRODUCTION_WRITE_USED=NO'
          rm -rf /tmp/ops
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/${REPO}.git" /tmp/ops
          cd /tmp/ops
          git checkout -q "$BRANCH"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          echo VERSION_IDENTITY_PATHS_BEGIN
          git grep -l -E '1\.21\.858|V1\.21\.858' -- ':!docs/**' ':!*.md' | sort || true
          echo VERSION_IDENTITY_PATHS_END
          echo VERSION_IDENTITY_MATCHES_BEGIN
          git grep -n -E '1\.21\.858|V1\.21\.858' -- ':!docs/**' ':!*.md' || true
          echo VERSION_IDENTITY_MATCHES_END
          echo PASS_S01_C02_121858_IDENTITY_INVENTORY
