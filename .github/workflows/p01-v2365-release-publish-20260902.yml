name: P01 V2.36.5 Release Publish
on:
  push:
    branches: [release/p01-v2365-candidate-20260902]
    paths: [.github/workflows/p01-v2365-release-publish-20260902.yml]
permissions:
  actions: read
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      FORMAL: ef86eba16aec71c1d0dabc16ad23089a78ee5057
      FORMAL_TREE: 926504354eaf4354e852e78b19c0fde69513a133
      FORMAL_RUNTIME_TREE: a7f472ec1f449ada1152d271f2723c52e7b58144
      TAG: v2.36.5
      VERSION: 2.36.5
      SOURCE_VERSION: 2.36.4
      SCHEMA: '2026082901'
      ARTIFACT_ID: '9816176949'
      ARTIFACT_DIGEST: 170b6aca563a93a625cb77e1bc6f7918bf9772177da9adcc1fe6bde91d2c8b37
      FULL_BYTES: '587547'
      FULL_SHA: 6718216489852bd4f326f05371b590d8089a63e5ee76f56fc992afa58f8c33cf
      UPDATE_BYTES: '1238610'
      UPDATE_SHA: bb28284f15e8e94673f604c43f1b89692134dc92fdce8343cefc90431e52f6b6
      REPAIR_BYTES: '3595293'
      REPAIR_SHA: b3a3e1a4cc9c6133ea0579430e2bbd900e4bd3a4126ad66abf0d89fecc34a2ee
      GATE_SHA: d4a523464a77a545674c90a2e2b938c4554df8558d8610f62e0f7c6b34013d5c
      META_SHA: 66749279903b0b99d52912fa88a21c8d8ffd8ed9012631d40f2243a9d90b518c
      SELFTEST_SHA: 07586dcd15f3a56de963d087103b5a82ee4f642d9fc021e33655ad8355e038bc
      SUMS_SHA: 5a9faf17c96756b93cea941b495b7dc87cb6d5acdd71547d306bf26ab0993b51
    steps:
      - name: Fresh promotion readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          main=$(gh api repos/$PRODUCT_REPO/branches/main --jq .commit.sha)
          test "$main" = "$FORMAL"
          tree=$(gh api repos/$PRODUCT_REPO/commits/$FORMAL --jq .commit.tree.sha)
          test "$tree" = "$FORMAL_TREE"
          runtime_tree=$(gh api repos/$PRODUCT_REPO/git/trees/$FORMAL_TREE --jq '.tree[]|select(.path=="src")|.sha')
          test "$runtime_tree" = "$FORMAL_RUNTIME_TREE"
          printf 'MAIN=%s\nFORMAL_TREE=%s\nFORMAL_RUNTIME_TREE=%s\n' "$main" "$tree" "$runtime_tree" | tee /tmp/promotion-readback.txt
      - name: Download frozen Formal Artifact only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/frozen
          curl --fail --silent --show-error --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/artifacts/$ARTIFACT_ID/zip" \
            -o /tmp/formal-artifact.zip
          test "$(sha256sum /tmp/formal-artifact.zip|awk '{print $1}')" = "$ARTIFACT_DIGEST"
          unzip -qq /tmp/formal-artifact.zip -d /tmp/frozen
          test -d /tmp/frozen/p01-v2365-formal-artifacts
      - name: Verify frozen release bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          d=/tmp/frozen/p01-v2365-formal-artifacts
          test "$(stat -c%s "$d/VF-Start-V2.36.5-FULL.zip")" = "$FULL_BYTES"
          test "$(sha256sum "$d/VF-Start-V2.36.5-FULL.zip"|awk '{print $1}')" = "$FULL_SHA"
          test "$(stat -c%s "$d/VF-Start-V2.36.5-UPDATE.zip")" = "$UPDATE_BYTES"
          test "$(sha256sum "$d/VF-Start-V2.36.5-UPDATE.zip"|awk '{print $1}')" = "$UPDATE_SHA"
          test "$(stat -c%s "$d/VF_Start_V2.36.5_UPDATE.zip")" = "$UPDATE_BYTES"
          test "$(sha256sum "$d/VF_Start_V2.36.5_UPDATE.zip"|awk '{print $1}')" = "$UPDATE_SHA"
          test "$(stat -c%s "$d/repair-v2.36.5.php")" = "$REPAIR_BYTES"
          test "$(sha256sum "$d/repair-v2.36.5.php"|awk '{print $1}')" = "$REPAIR_SHA"
          test "$(sha256sum "$d/P01-V2.36.5-ARTIFACT-GATE.json"|awk '{print $1}')" = "$GATE_SHA"
          test "$(sha256sum "$d/P01-V2.36.5-FORMAL-METADATA.json"|awk '{print $1}')" = "$META_SHA"
          test "$(sha256sum "$d/atomic-self-test.json"|awk '{print $1}')" = "$SELFTEST_SHA"
          test "$(sha256sum "$d/SHA256SUMS.txt"|awk '{print $1}')" = "$SUMS_SHA"
          (cd "$d" && sha256sum -c SHA256SUMS.txt)
      - name: Create exact immutable tag and draft release
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if tag_sha=$(gh api repos/$PRODUCT_REPO/git/ref/tags/$TAG --jq .object.sha 2>/dev/null); then
            test "$tag_sha" = "$FORMAL"
          else
            gh api --method POST repos/$PRODUCT_REPO/git/refs -f ref="refs/tags/$TAG" -f sha="$FORMAL" >/tmp/tag-create.json
            tag_sha=$(gh api repos/$PRODUCT_REPO/git/ref/tags/$TAG --jq .object.sha)
            test "$tag_sha" = "$FORMAL"
          fi
          cat >/tmp/release-notes.md <<'EOF'
          V2.36.5 是基于 V2.36.4 的单跳补丁发布，集中收口 5 个已验证的产品问题：

          - 在线升级 Atomic 成功后，等待服务端 Runtime 确认目标版本再刷新，避免首次刷新仍显示旧版本。
          - 修复 YouTube 频道 / @handle 页面封面元数据位于 512 KiB 之后时被过早放弃。
          - 修复 Apple Podcasts 大页面中已有 artwork 元数据被通用 512 KiB 上限丢弃。
          - 修复 `resource-actions.css` 相对 `@import` 路径错误，改由 Asset Authority 显式加载。
          - 修复 390 / 360 手机端超长三级分类路径导致横向溢出。

          Runtime Delta 已由 PR #192 / #195 / #196 / #197 / #198 与 Fresh Runtime / Browser Gate 验证；Schema 保持 `2026082901`，无 Migration。Formal Artifact 与 Strict Fresh Formal R3 均已 PASS；本 Release 直接发布冻结 Formal Artifact 原字节，未重建。
          EOF
          if gh api repos/$PRODUCT_REPO/releases/tags/$TAG >/tmp/existing-release.json 2>/dev/null; then
            test "$(jq -r .draft /tmp/existing-release.json)" = true
          else
            gh release create "$TAG" --repo "$PRODUCT_REPO" --verify-tag --draft --title "VF Start V2.36.5" --notes-file /tmp/release-notes.md
          fi
      - name: Upload exact frozen assets
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          d=/tmp/frozen/p01-v2365-formal-artifacts
          gh release upload "$TAG" --repo "$PRODUCT_REPO" --clobber \
            "$d/atomic-self-test.json" \
            "$d/P01-V2.36.5-ARTIFACT-GATE.json" \
            "$d/P01-V2.36.5-FORMAL-METADATA.json" \
            "$d/repair-v2.36.5.php" \
            "$d/SHA256SUMS.txt" \
            "$d/VF-Start-V2.36.5-FULL.zip" \
            "$d/VF-Start-V2.36.5-UPDATE.zip" \
            "$d/VF_Start_V2.36.5_UPDATE.zip"
      - name: Release asset byte-for-byte readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/release-readback
          gh release download "$TAG" --repo "$PRODUCT_REPO" --dir /tmp/release-readback
          d=/tmp/release-readback
          test "$(sha256sum "$d/VF-Start-V2.36.5-FULL.zip"|awk '{print $1}')" = "$FULL_SHA"
          test "$(stat -c%s "$d/VF-Start-V2.36.5-FULL.zip")" = "$FULL_BYTES"
          test "$(sha256sum "$d/VF-Start-V2.36.5-UPDATE.zip"|awk '{print $1}')" = "$UPDATE_SHA"
          test "$(sha256sum "$d/VF_Start_V2.36.5_UPDATE.zip"|awk '{print $1}')" = "$UPDATE_SHA"
          test "$(stat -c%s "$d/VF-Start-V2.36.5-UPDATE.zip")" = "$UPDATE_BYTES"
          test "$(sha256sum "$d/repair-v2.36.5.php"|awk '{print $1}')" = "$REPAIR_SHA"
          test "$(stat -c%s "$d/repair-v2.36.5.php")" = "$REPAIR_BYTES"
          test "$(sha256sum "$d/P01-V2.36.5-ARTIFACT-GATE.json"|awk '{print $1}')" = "$GATE_SHA"
          test "$(sha256sum "$d/P01-V2.36.5-FORMAL-METADATA.json"|awk '{print $1}')" = "$META_SHA"
          test "$(sha256sum "$d/atomic-self-test.json"|awk '{print $1}')" = "$SELFTEST_SHA"
          test "$(sha256sum "$d/SHA256SUMS.txt"|awk '{print $1}')" = "$SUMS_SHA"
          printf 'RELEASE_ASSET_READBACK=PASS\n' | tee /tmp/release-asset-readback.txt
      - name: Publish stable release and final readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh release edit "$TAG" --repo "$PRODUCT_REPO" --draft=false --prerelease=false --latest
          tag_sha=$(gh api repos/$PRODUCT_REPO/git/ref/tags/$TAG --jq .object.sha)
          test "$tag_sha" = "$FORMAL"
          rel=$(gh api repos/$PRODUCT_REPO/releases/tags/$TAG)
          test "$(jq -r .draft <<<"$rel")" = false
          test "$(jq -r .prerelease <<<"$rel")" = false
          test "$(jq '.assets|length' <<<"$rel")" = 8
          printf 'P01_V2365_RELEASE_PUBLISH=PASS\nTAG=%s\nFORMAL=%s\nFULL_SHA=%s\nUPDATE_SHA=%s\nREPAIR_SHA=%s\nOWNER_PRODUCTION_WRITE=NO\n' "$TAG" "$FORMAL" "$FULL_SHA" "$UPDATE_SHA" "$REPAIR_SHA" | tee /tmp/release-verdict.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-v2365-release-publish-${{ github.run_id }}
          path: |
            /tmp/promotion-readback.txt
            /tmp/release-asset-readback.txt
            /tmp/release-verdict.txt
          if-no-files-found: warn
          retention-days: 90
