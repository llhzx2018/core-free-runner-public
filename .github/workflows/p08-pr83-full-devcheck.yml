name: P08 PR83 exact source FULL dev_check gate
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p08-pr83-full-devcheck.yml
permissions:
  contents: read
jobs:
  exact-private-p08-full-dev-check:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-pr83-full-devcheck-final-20261120'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout disposable public validation harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact private P08 PR83 source ephemerally
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 3cebfb6d810ff407dc3bc3f94a38f856d342b488
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
      - name: Install normal PHP8.4 test execution modules
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: zip,curl,mbstring,pdo_mysql,pdo_sqlite,sqlite3,openssl,posix,dom,intl,fileinfo
          coverage: none
      - name: Confirm exact unchanged candidate SHA and run WHOLE native developer smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(id -u)" -ne 0
          test "$(git -C target rev-parse HEAD)" = 3cebfb6d810ff407dc3bc3f94a38f856d342b488
          test "$(cat target/VERSION)" = 0.1.13
          test -z "$(git -C target status --porcelain --untracked-files=all)"
          log="$RUNNER_TEMP/p08-pr83-whole-devcheck-local-private.log"
          test ! -e "$log"
          umask 077
          if bash target/scripts/dev_check.sh > "$log" 2>&1; then
            for marker in PHP_SYNTAX_CHECKED P08_OWNER_HISTORY_AND_SINGLE_CLICK_LOCAL_REGRESSIONS R1_LOCAL_SOURCE_TESTS; do
              grep -Eq "^$marker=[0-9]+$|^$marker=PASS$" "$log" || { echo "P08_PR83_MISSING_REQUIRED_MARKER=$marker"; exit 12; }
            done
            grep -Fq 'FULL_RELEASE_READY=NO' "$log"
            test -z "$(git -C target status --porcelain --untracked-files=all)"
            echo P08_PR83_EXACT_SOURCE_FULL_DEV_CHECK=PASS
            echo P08_PR83_FOUR_REQUIRED_TESTS_IN_WHOLE_DEV_CHECK=PASS
            echo P08_PR83_RELEASE_NOT_AUTHORIZED=CONFIRMED
          else
            echo P08_PR83_EXACT_SOURCE_FULL_DEV_CHECK=FAIL
            # Only known non-sensitive booleans/counters; no private raw logs.
            for marker in PHP_SYNTAX_CHECKED P08_OWNER_HISTORY_AND_SINGLE_CLICK_LOCAL_REGRESSIONS R1_LOCAL_SOURCE_TESTS; do
              if grep -Eq "^$marker=[0-9]+$|^$marker=PASS$" "$log"; then
                echo "P08_PR83_STAGE_REACHED=$marker"
              fi
            done
            exit 1
          fi
      - name: Always erase private source, transient smoke fixture and log
        if: always()
        shell: bash
        run: |
          rm -rf -- target "$RUNNER_TEMP/p08-pr83-whole-devcheck-local-private.log"
          test ! -e target
          test ! -e "$RUNNER_TEMP/p08-pr83-whole-devcheck-local-private.log"
          echo P08_PR83_PRIVATE_FULL_SMOKE_CLEANUP=PASS
