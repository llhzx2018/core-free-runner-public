# One-shot P02 PR #5 unittest evidence. TEMP branch/PR: close without merge.
# Private source is transient; public logs carry only count/status.
name: TEMP P02 PR5 exact-source full Python unittest
on:
  pull_request:
    branches: [main]
    types: [opened]
    paths:
      - '.github/workflows/p02-pr5-full-unittest-once.yml'
permissions:
  contents: read
concurrency:
  group: p02-pr5-full-unittest-once
  cancel-in-progress: false
jobs:
  exact-python:
    if: >-
      github.actor == 'llhzx2018' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public' &&
      github.event.pull_request.head.ref == 'test/p02-pr5-full-python-05939666' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.state == 'open'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Admit single scoped transient checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_REPOSITORY" = llhzx2018/core-free-runner-public
          test "$GITHUB_ACTOR" = llhzx2018
          scope="p02-pr5-${GITHUB_RUN_ID}"
          test ! -e "$scope" && test ! -L "$scope" || { echo P02_PR5_STALE_SCOPE=FAIL; exit 2; }
      - name: Transient checkout pinned private P02 PR5 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-doc
          ref: 05939666d01f0b9384acd68e75bc79918a03fdb2
          path: p02-pr5-${{ github.run_id }}/source
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Execute full unittest with source and tree identity
        shell: bash
        working-directory: p02-pr5-${{ github.run_id }}/source
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          test "$(git rev-parse HEAD)" = 05939666d01f0b9384acd68e75bc79918a03fdb2
          test "$(git rev-parse HEAD^{tree})" = 8f610897cb0806f037599cd99ee45f493bf6e58a
          test -z "$(git status --porcelain)"
          echo P02_PR5_EXACT_SOURCE=05939666d01f0b9384acd68e75bc79918a03fdb2
          echo P02_PR5_EXACT_TREE=8f610897cb0806f037599cd99ee45f493bf6e58a
          output="$(mktemp)"
          trap 'rm -f -- "$output"' EXIT
          status=0
          python3 -B -m unittest discover -s tests -p 'test_*.py' -q >"$output" 2>&1 || status=$?
          summary="$(grep -E '^Ran [0-9]+ tests? in [0-9.]+s$' "$output" | tail -n 1 || true)"
          count="$(printf '%s' "$summary" | awk '{print $2}')"
          if [[ "$count" =~ ^[0-9]+$ ]]; then
            echo "P02_PR5_UNITTEST_TESTS=$count"
          else
            echo P02_PR5_UNITTEST_TESTS=NOT_PROVEN
          fi
          if [ "$status" -ne 0 ]; then
            echo P02_PR5_FULL_PYTHON_UNITTEST=FAIL
            exit 1
          fi
          test "$count" -ge 1
          grep -qx 'OK' "$output" || { echo P02_PR5_UNITTEST_SUMMARY_UNEXPECTED; exit 1; }
          echo P02_PR5_FULL_PYTHON_UNITTEST=PASS
      - name: Delete all transient private data and verify cleanup
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          scope="p02-pr5-${GITHUB_RUN_ID}"
          test ! -L "$scope" || { echo P02_PR5_UNTRUSTED_SCOPE=FAIL; exit 2; }
          rm -rf -- "$scope"
          test ! -e "$scope"
          echo P02_PR5_PRIVATE_SOURCE_CLEANUP=PASS
          echo P02_PR5_PRIVATE_ARTIFACT_UPLOADED=NO
