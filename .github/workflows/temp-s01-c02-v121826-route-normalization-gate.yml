name: TEMP S01-C02 Ops 1.21.826 Route Normalization Gate
on:
  push:
    branches: [temp/s01-c02-v121826-route-normalization-gate-20260905]
    paths: ['.github/workflows/temp-s01-c02-v121826-route-normalization-gate.yml']
permissions:
  contents: read
jobs:
  focused-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      REPO: llhzx2018/vf-tools-ops
      BASE: 28e979580704fb9f6936a0f02d478cf8871ad15d
      HEAD: eb41c358d106ec5deea36d88ee426bd63aee973d
    steps:
      - name: Checkout exact Ops candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.HEAD }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops
      - name: Verify exact identity and syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$HEAD"
          test "$(tr -d '\r\n' < ops/VERSION)" = '1.21.826'
          grep -Fq 'Version: 1.21.826' ops/vf-ops.php
          grep -Fq "VF_OPS_VERSION', '1.21.826'" ops/vf-ops.php
          grep -Fq 'STATIC-CANDIDATE-ROUTE-NORMALIZATION-V1' ops/vf-ops.php
          php -l ops/includes/release/builders/class-candidate-route-normalizer.php
          php -l ops/includes/release/builders/class-candidate-entry-processor.php
          php -l ops/includes/release/builders/class-candidate-zip-builder.php
          php -l ops/includes/release/builders/class-candidate-batch-builder.php
          php -l ops/includes/release-pipeline.php
          php -l ops/vf-ops.php
          echo IDENTITY_SYNTAX=PASS
      - name: Run route contract and adjacent regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          php ops/.github/phase3/v121826-candidate-route-normalization.php | grep -Fxq PASS_V121826_CANDIDATE_ROUTE_NORMALIZATION
          php ops/.github/phase3/v121825-internal-link-target-family-readback.php | grep -Fxq PASS_V121825_INTERNAL_LINK_TARGET_FAMILY_READBACK
          php ops/.github/phase3/v121824-candidate-failure-subtype-readback.php | grep -Fxq PASS_V121824_CANDIDATE_FAILURE_SUBTYPE_READBACK
          echo ROUTE_AND_REGRESSION=PASS
      - name: Verify bounded fail-closed integration
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t files < <(git -C ops diff --name-only "$BASE..$HEAD" | sort)
          printf '%s\n' "${files[@]}"
          expected=(
            .github/phase3/v121826-candidate-route-normalization.php
            VERSION
            includes/release-pipeline.php
            includes/release/builders/class-candidate-batch-builder.php
            includes/release/builders/class-candidate-entry-processor.php
            includes/release/builders/class-candidate-route-normalizer.php
            includes/release/builders/class-candidate-zip-builder.php
            vf-ops.php
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "$(printf '%s\n' "${files[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"
          ! git -C ops diff "$BASE..$HEAD" -- includes/release/audits includes/cf-static-downloads/repair-parts/final-audit-records-parts | grep -q '^[-+]'
          ! grep -REn 'update_option|add_option|delete_option|wp_insert_post|wp_update_post|update_post_meta|delete_post_meta' ops/includes/release/builders/class-candidate-route-normalizer.php
          grep -Fq 'class-candidate-route-normalizer.php' ops/includes/release-pipeline.php
          grep -Fq 'route_inventory' ops/includes/release/builders/class-candidate-zip-builder.php
          grep -Fq 'route_inventory_path' ops/includes/release/builders/class-candidate-batch-builder.php
          grep -Fq 'route_inventory' ops/includes/release/builders/class-candidate-entry-processor.php
          grep -Fq 'CORE_TOOL_SLUGS' ops/includes/release/builders/class-candidate-route-normalizer.php
          grep -Fq 'missing_archive_link_unlinked' ops/includes/release/builders/class-candidate-route-normalizer.php
          grep -Fq 'count($matches) === 1' ops/includes/release/builders/class-candidate-route-normalizer.php
          echo BOUNDED_FAIL_CLOSED=PASS
      - name: Verify runner main untouched
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          J="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/core-free-runner-public/git/ref/heads/main)"
          test "$(jq -r .object.sha <<<"$J")" = '0160b557ad4ae0e8c6acd97e7551285bc05870bd'
          echo RUNNER_MAIN_UNTOUCHED=PASS
      - name: Seal result
        run: echo PASS_V121826_ROUTE_NORMALIZATION_GATE
