name: P01 V2.30 Release Format Inspect
on:
  push:
    branches: [task/p01-v230-domain-nav-shell-20260829]
    paths: [.github/workflows/p01-v230-release-format-inspect-20260829.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env: {GH_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'}
    steps:
      - name: Download V2.29 formal update and inspect
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir inspect
          gh release download v2.29.0 --repo llhzx2018/vf-start --pattern 'VF_Start_V2.29.0_UPDATE.zip' --dir inspect
          unzip -l inspect/VF_Start_V2.29.0_UPDATE.zip | tee inspect/update-list.txt
          mkdir inspect/update && unzip -q inspect/VF_Start_V2.29.0_UPDATE.zip -d inspect/update
          find inspect/update -maxdepth 2 -type f -printf '%P\n' | sort | tee inspect/update-files.txt
          REPAIR=$(find inspect/update -maxdepth 1 -type f -name 'repair-v2.29.0.php' -print -quit)
          test -n "$REPAIR"
          cp "$REPAIR" inspect/repair-v2.29.0.php.txt
          sed -n '1,220p' "$REPAIR" > inspect/repair-head.txt
          sha256sum inspect/VF_Start_V2.29.0_UPDATE.zip "$REPAIR" | tee inspect/hashes.txt
          echo P01_V229_RELEASE_FORMAT_INSPECT=PASS
      - uses: actions/upload-artifact@v4
        with: {name: P01-v229-release-format-inspect, path: inspect, retention-days: 2}
