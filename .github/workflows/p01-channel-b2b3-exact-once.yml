name: p01-channel-b2b3-exact-once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-channel-b2b3-exact-once.yml'

permissions:
  contents: read

jobs:
  exact-source:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/p01-channels-b2b3-exact-20261025'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      TARGET_REPO: llhzx2018/vf-start
      TARGET_VERSION: 2.47.453
      TARGET_SHA: e585460f9b47cfd81e36918208b79a0bdee16b80
    steps:
      - name: Audit temporary lane identity
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify rendered exact-source binding before checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ephemeral_lane_spec.py audit-rendered --spec validation/p01-channels-b2b3-exact-spec.json --input .github/workflows/p01-channel-b2b3-exact-once.yml
      - name: Prepare PHP runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y php-cli php-curl php-xml php-mbstring php-sqlite3 >/dev/null
          php -v
          node --version
      - name: Checkout P01 exact unreleased current source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: e585460f9b47cfd81e36918208b79a0bdee16b80
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: product
          persist-credentials: false
      - name: Bind source and run Channels contracts
        shell: bash
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "$TARGET_VERSION"
          test "$(tr -d '\r\n' < src/VERSION.txt)" = "$TARGET_VERSION"
          php -l src/app/ChannelLibraryPage.php
          php -l tests/unit/channel_owner_direct_edit_unclipped_contract.php
          php -l tests/unit/channels_guest_readonly_layout_v247390_contract.php
          php tests/unit/channel_owner_direct_edit_unclipped_contract.php
          php tests/unit/channels_guest_readonly_layout_v247390_contract.php
          php tests/unit/channel_card_action_hierarchy_contract.php
          php tests/unit/channels_v247140_source_manager_contract.php
          php tests/unit/channels_v247141_source_manager_r2_contract.php
          php tests/unit/channels_v247143_adaptive_density_contract.php
          node --check src/assets/workspace.js
          node tests/browser/channel_reader_responsive_owner_smoke.cjs
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const css=fs.readFileSync('src/assets/channel-library.css','utf8');
          assert.match(css,/body\.surface-channels \.vf-channel-copy p\{[^}]*-webkit-line-clamp:2;[^}]*font-size:13px;/s);
          assert.match(css,/body\.surface-channels \.vf-channel-direct-edit\{[^}]*font-size:13px;/s);
          assert.match(css,/body\.surface-channels \.vf-channel-actions\{[^}]*opacity:1!important;/s);
          assert.match(css,/body\.surface-channels \.vf-channel-source-table\{\s*\/\* Native per-row details panels must escape the list's rounded border\. \*\/\s*overflow:visible;/);
          assert.equal((css.match(/\{/g)||[]).length,(css.match(/\}/g)||[]).length);
          console.log('P01_CHANNEL_B3_READABILITY=PASS');
          NODE
          echo P01_CHANNEL_B2B3_EXACT_SOURCE=PASS
