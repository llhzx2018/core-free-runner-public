name: TEMP P01 exact-source synthetic Inertia Chromium smoke

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p01-synthetic-browser-20261125.yml'

permissions:
  contents: read

concurrency:
  group: temp-p01-browser-20261125-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compiled-inertia-browser:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'test/p01-synthetic-browser-')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout only exact private P01 development source into temporary workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-startnew
          ref: 013ccd2d0c5d71a3ddb9005c7c7cb2bf3ef42309
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
          fetch-depth: 1

      - name: Bind exact private source identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C private-src rev-parse HEAD)" = "013ccd2d0c5d71a3ddb9005c7c7cb2bf3ef42309"
          echo 'P01_BROWSER_EXACT_SOURCE=PASS'

      - name: Run locked Vue compilation and local-only synthetic Chromium smoke
        working-directory: private-src
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          if ! npm ci --no-audit --no-fund >"$RUNNER_TEMP/p01-npm.log" 2>&1; then echo 'P01_BROWSER_NPM_CI=FAIL'; exit 1; fi
          echo 'P01_BROWSER_NPM_CI=PASS'
          if ! npm run typecheck >"$RUNNER_TEMP/p01-typecheck.log" 2>&1; then echo 'P01_BROWSER_TYPECHECK=FAIL'; exit 1; fi
          echo 'P01_BROWSER_TYPECHECK=PASS'
          if ! npm run build >"$RUNNER_TEMP/p01-vite.log" 2>&1; then echo 'P01_BROWSER_VITE=FAIL'; exit 1; fi
          echo 'P01_BROWSER_VITE=PASS'
          if ! npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.55.0 >"$RUNNER_TEMP/p01-playwright-npm.log" 2>&1; then echo 'P01_BROWSER_PLAYWRIGHT_DEP=FAIL'; exit 1; fi
          if ! npx playwright install --with-deps chromium >"$RUNNER_TEMP/p01-chromium.log" 2>&1; then echo 'P01_BROWSER_CHROMIUM_INSTALL=FAIL'; exit 1; fi
          echo 'P01_BROWSER_CHROMIUM_INSTALL=PASS'
          if node tests/browser/p01_synthetic_inertia_browser.mjs >"$RUNNER_TEMP/p01-browser-result.log" 2>&1; then
            grep '^P01_BROWSER_' "$RUNNER_TEMP/p01-browser-result.log" || true
            grep -q '^P01_BROWSER_SYNTHETIC_COMPILED_SOURCE=PASS$' "$RUNNER_TEMP/p01-browser-result.log"
            grep -q '^P01_BROWSER_ROUTE_WIDTHS=45 ' "$RUNNER_TEMP/p01-browser-result.log"
          else
            grep '^P01_BROWSER_' "$RUNNER_TEMP/p01-browser-result.log" || true
            echo 'P01_BROWSER_SYNTHETIC_RUN=FAIL'
            exit 1
          fi
          echo 'P01_BROWSER_SYNTHETIC_RUN=PASS'

      - name: Delete all private checkout and temporary logs
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- private-src
          rm -f -- "$RUNNER_TEMP/p01-npm.log" "$RUNNER_TEMP/p01-typecheck.log" "$RUNNER_TEMP/p01-vite.log" "$RUNNER_TEMP/p01-playwright-npm.log" "$RUNNER_TEMP/p01-chromium.log" "$RUNNER_TEMP/p01-browser-result.log"
          test ! -e private-src
          echo 'P01_BROWSER_PRIVATE_CLEANUP=PASS'
