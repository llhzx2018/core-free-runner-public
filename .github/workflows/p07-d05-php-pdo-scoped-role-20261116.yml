name: P07 D05 isolated PHP PDO scoped grants machine TEMP
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p07-d05-php-pdo-scoped-role-20261116.yml']
permissions:
  contents: read
jobs:
  p07-d05-php-grants:
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout public ephemeral harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact private P07 source transient
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 695c10524a5c4531a8e2a9a5f5dce6e612bf5b75
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: .p07-d05-private
      - name: GOV-DOC architecture authority transient
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: .p07-d05-gov
      - name: Full D05 architecture, naming, module ownership and scoped security tests
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-d05-private rev-parse HEAD)" = 695c10524a5c4531a8e2a9a5f5dce6e612bf5b75
          cd .p07-d05-private
          export PYTHONPATH="$PWD/lib"
          python3 -B .github/checks/test_architecture_gate.py
          python3 -B .github/checks/architecture_gate.py \
            --manifest .github/checks/code_architecture.json \
            --gov-root ../.p07-d05-gov --git-root . \
            --base-sha a6da82f35fdbd06020a7e65c8cbd5717f617f2f3 --head-sha 695c10524a5c4531a8e2a9a5f5dce6e612bf5b75
          python3 -B scripts/check_p07_modules.py \
            --module P07-M03-D05 \
            --pr-title 'P07-M03-D05 数据库引擎转换：隔离 PHP PDO 账号权限读写与回切' \
            --changed-file lib/db_engine_conversion_app_role_sandbox.py \
            --affected P07-M03-D05 \
            --shared-reason '仅 D05 生成的容器与账号，不改 D04 迁移执行器'
          python3 - <<'PY'
          import subprocess
          files=subprocess.check_output([
              "git","diff","--name-only","a6da82f35fdbd06020a7e65c8cbd5717f617f2f3","695c10524a5c4531a8e2a9a5f5dce6e612bf5b75"
          ],text=True).splitlines()
          assert not any(
              x.startswith(("lib/server_migration", "lib/migration_",
                            "installers/", "public/")) for x in files
          ), "D04 or installed runtime modified"
          print("P07_D05_PHP_GRANTS_D04_UNCHANGED=PASS")
          PY
          python3 -B -m unittest discover -s tests -p test_p07_m03_d05_app_role_sandbox.py -v
          echo P07_D05_PHP_ROLE_SECURITY_AND_ARCH=PASS
      - name: Real MariaDB and MySQL PHP PDO scoped roles and source fallback
        shell: bash
        env:
          P07_ALLOW_SYNTHETIC_D05: '1'
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          cd .p07-d05-private
          export PYTHONPATH="$PWD/lib"
          timeout --signal=TERM --kill-after=15s 1100s \
            python3 -B -m unittest discover -s tests -p test_p07_m03_d05_app_role_native.py -v
          echo P07_D05_PHP_ROLE_NATIVE_TWO_WAY_AND_FAULT=PASS
      - name: Always remove transient private sources and generated containers
        if: always()
        shell: bash
        run: |
          set +e
          docker ps -aq --filter 'label=org.kewaro.p07.d05.synthetic' | xargs -r docker rm -f >/dev/null 2>&1
          docker images --format '{{.Repository}}:{{.Tag}}' | grep '^p07-d05-php-app:' | xargs -r docker image rm -f >/dev/null 2>&1
          rm -rf -- .p07-d05-private .p07-d05-gov
          test ! -e .p07-d05-private
          test ! -e .p07-d05-gov
          echo P07_D05_PHP_PRIVATE_CLEANUP=PASS
