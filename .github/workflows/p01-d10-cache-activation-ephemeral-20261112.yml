name: P01 D10 protected FULL cache and activation isolated exact-source proof (temporary)
on:
  push:
    branches:
      - test/p01-d10-cache-activation-20261112

permissions:
  contents: read

jobs:
  p01-d10-cache-activation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Confirm bounded public-safe synthetic test
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "$GITHUB_REF_NAME" = "test/p01-d10-cache-activation-20261112"
          echo "P01_D10_MODE=ISOLATED_PHP_SYNTHETIC_ONLY"
          echo "P01_D10_PRODUCTION_WRITES=NO"

      - name: Verify temporary private source read capability
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo "P01_D10_PRIVATE_CHECKOUT_CAPABILITY=PRESENT"

      - name: Checkout exact private P01 candidate transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: d2ad212374aefdacfd19384f60c6dacd46f38fef
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false

      - name: Verify source SHA, version and target fixtures
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "d2ad212374aefdacfd19384f60c6dacd46f38fef"
          test "$(cat candidate/VERSION)" = "2.47.515"
          test -f candidate/src/app/next/runtime/CloudPanelCleanFullPreflight.php
          test -f candidate/tests/unit/p01_clean_full_preflight_contract.php
          test -f candidate/tests/unit/p01_d10_cli_activation_contract.php
          echo "P01_D10_EXACT_SOURCE_SHA=d2ad212374aefdacfd19384f60c6dacd46f38fef"
          echo "P01_D10_EXACT_SOURCE=PASS"

      - name: PHP lint and actual negative/positive activation tests
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! command -v php >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php-cli >/dev/null
          fi
          cd candidate
          php -v | head -n 2
          for file in \
            src/app/next/runtime/CloudPanelCleanFullPreflight.php \
            src/app/next/runtime/CloudPanelSiteActivation.php \
            src/app/next/public/setup.php \
            tests/unit/p01_clean_full_preflight_contract.php \
            tests/unit/p01_d10_cli_activation_contract.php \
            tests/unit/p01_protected_http_install_bootstrap_contract.php; do
            php -l "$file"
          done
          php tests/unit/p01_clean_full_preflight_contract.php
          php tests/unit/p01_d10_cli_activation_contract.php
          php tests/unit/p01_protected_http_install_bootstrap_contract.php
          echo "P01_D10_CACHE_GUARD_ACTUAL_PHP_UNIT=PASS"
          echo "P01_D10_REAL_CLOUDPANEL_FPM_PROOF=NOT_IN_SCOPE"

      - name: Always delete transient private source
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate
          test ! -e candidate
          echo "P01_D10_PRIVATE_SOURCE_PERSISTED=NO"
