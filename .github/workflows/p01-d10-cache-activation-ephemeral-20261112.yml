name: P01 D10 protected FULL cache and activation isolated exact-source proof (temporary)
on:
  push:
    branches:
      - test/p01-d10-cache-activation-20261112

permissions:
  contents: read

jobs:
  p01-d10-cache-activation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Confirm bounded public-safe synthetic test
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "$GITHUB_REF_NAME" = "test/p01-d10-cache-activation-20261112"
          echo "P01_D10_MODE=ISOLATED_PHP_SYNTHETIC_ONLY"
          echo "P01_D10_PRODUCTION_WRITES=NO"

      - name: Verify temporary private source read capability
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo "P01_D10_PRIVATE_CHECKOUT_CAPABILITY=PRESENT"

      - name: Checkout exact private P01 candidate transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: b45c5b5967340fe4aaf623b5b50993ae4aad57bf
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false

      - name: Verify source SHA, version and target fixtures
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "b45c5b5967340fe4aaf623b5b50993ae4aad57bf"
          test "$(cat candidate/VERSION)" = "2.47.515"
          test -f candidate/src/app/next/runtime/CloudPanelCleanFullPreflight.php
          test -f candidate/tests/unit/p01_clean_full_preflight_contract.php
          test -f candidate/tests/unit/p01_d10_cli_activation_contract.php
          echo "P01_D10_EXACT_SOURCE_SHA=b45c5b5967340fe4aaf623b5b50993ae4aad57bf"
          echo "P01_D10_EXACT_SOURCE=PASS"

      - name: PHP lint and actual negative/positive activation tests
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! command -v php >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php-cli >/dev/null
          fi
          cd candidate
          php -v | head -n 2
          for file in \
            src/app/next/runtime/CloudPanelCleanFullPreflight.php \
            src/app/next/runtime/CloudPanelSiteActivation.php \
            src/app/next/public/setup.php \
            tests/unit/p01_clean_full_preflight_contract.php \
            tests/unit/p01_d10_cli_activation_contract.php \
            tests/unit/p01_protected_http_install_bootstrap_contract.php; do
            php -l "$file"
          done
          php tests/unit/p01_clean_full_preflight_contract.php
          php tests/unit/p01_d10_cli_activation_contract.php
          php tests/unit/p01_protected_http_install_bootstrap_contract.php
          echo "P01_D10_CACHE_GUARD_ACTUAL_PHP_UNIT=PASS"
          echo "P01_D10_REAL_CLOUDPANEL_FPM_PROOF=NOT_IN_SCOPE"

      - name: Exercise clean FULL source and ZIP integrity negatives
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 tests/architecture/test_p01_next_full_bundle.py
          echo "P01_D13_CLEAN_FULL_ARCHIVE_NEGATIVE_CONTRACT=PASS"

      - name: Build actual self-contained future Laravel FULL in temporary isolated path
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! command -v composer >/dev/null || ! php -r 'exit(extension_loaded("mbstring") && extension_loaded("dom") && extension_loaded("curl") && extension_loaded("zip") ? 0 : 1);'; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq composer php-cli php-mbstring php-xml php-curl php-zip unzip >/dev/null
          fi
          command -v node
          command -v npm
          command -v composer
          node -v
          npm -v
          composer -V
          cd candidate
          output="$RUNNER_TEMP/p01-next-isolated-clean-full.zip"
          test ! -e "$output"
          python3 scripts/build_p01_next_clean_full.py build \
            --source-sha b45c5b5967340fe4aaf623b5b50993ae4aad57bf \
            --output "$output" --composer composer
          python3 scripts/build_p01_next_clean_full.py verify --zip "$output"
          echo "P01_D13_SELF_CONTAINED_EXACT_SOURCE_DEV_BUNDLE=PASS"
          rm -f -- "$output"
          echo "P01_D13_NO_PACKAGE_OR_OWNER_DATA_PERSISTED=YES"

      - name: Always delete transient private source
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate
          test ! -e candidate
          echo "P01_D10_PRIVATE_SOURCE_PERSISTED=NO"
