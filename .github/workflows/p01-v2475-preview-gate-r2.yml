name: P01 V2.47.5 Exact Candidate Gate R2

on:
  pull_request:
    paths:
      - '.github/workflows/p01-v2475-preview-gate-r2.yml'

permissions:
  contents: read

concurrency:
  group: p01-v2475-exact-candidate-r2
  cancel-in-progress: false

jobs:
  gate:
    if: github.head_ref == 'temp/p01-v2475-preview-gate-20260910'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      BASE_SHA: caf6994d2689fc30d52cd12d71f82310f4fb2d2b
      CANDIDATE_SHA: 55be083da7263fef21b850ca11e7c167cb6b5cf4
      TARGET_BRANCH: release/v2.47.5-preview-20260910
      SOURCE_TAG: v2.47.4
      SOURCE_SHA: f24b01af34b173aef3ae6a7ecb5489aa6df19cc8
      SOURCE_VERSION: 2.47.4
      TARGET_VERSION: 2.47.5
      EXPECTED_SCHEMA: '2026090401'
      PREVIEW_TAG: v2.47.5-preview.1
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}

    steps:
      - name: Exact authority and applicability
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN"
          test -n "$RELEASE_TOKEN"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/main" --jq '.object.sha')" = "$BASE_SHA"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/tags/${SOURCE_TAG}" --jq '.object.sha')" = "$SOURCE_SHA"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/${TARGET_BRANCH}" --jq '.object.sha')" = "$CANDIDATE_SHA"
          if GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/tags/${PREVIEW_TAG}" >/dev/null 2>&1; then
            echo PREVIEW_BLOCK=TAG_ALREADY_EXISTS
            exit 81
          fi
          cat <<'EOF'
          INSTALL=REQUIRED
          SECURITY=REQUIRED
          TESTING=REQUIRED
          UPGRADE=REQUIRED
          DATA_SCHEMA=REQUIRED
          GIT=REQUIRED
          UA_UI=REQUIRED
          API_PROVIDER=N_A
          SEO=N_A
          CRON_JOB=N_A
          NOTIFICATION=N_A
          OBSERVABILITY=N_A
          PERFORMANCE=N_A
          EOF
          echo P01_V2475_R2_EXACT_AUTHORITY=PASS

      - name: Checkout exact persisted candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.CANDIDATE_SHA }}
          token: ${{ env.RELEASE_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          path: vf-start

      - name: Checkout proven artifact helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 1dd635d8e8d4485736458672fb7a5be397d94f89
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: helper

      - name: Checkout proven artifact template
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 0439b0df027ae0bc6c21a8dbf91b066a564130f9
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: template

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd
          coverage: none

      - name: Exact candidate identity and scope
        working-directory: vf-start
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(tr -d '\r\n ' < VERSION)" = "$TARGET_VERSION"
          test "$(tr -d '\r\n ' < src/VERSION.txt)" = "$TARGET_VERSION"
          grep -Fq "define('VF_VERSION', '$TARGET_VERSION');" src/app/bootstrap.php
          test "$(php -r '$p=json_decode(file_get_contents("VF_PROJECT.json"),true); echo $p["working_schema_version"];')" = "$EXPECTED_SCHEMA"
          git diff --name-only "$SOURCE_SHA" "$BASE_SHA" | sort >/tmp/product-files
          printf '%s\n' src/assets/workspace-domain-nav.css tests/integration/p01_content_first_shell_acceptance.php | sort >/tmp/product-expected
          diff -u /tmp/product-expected /tmp/product-files
          git diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" | sort >/tmp/bind-files
          printf '%s\n' VERSION src/VERSION.txt src/app/bootstrap.php | sort >/tmp/bind-expected
          diff -u /tmp/bind-expected /tmp/bind-files
          test "$(git diff --numstat "$BASE_SHA" "$CANDIDATE_SHA" | awk '{a+=$1;d+=$2} END{print a":"d}')" = '3:3'
          test -z "$(git diff --name-only "$SOURCE_SHA" "$BASE_SHA" -- src/migrations VF_PROJECT.json src/app/UpdateManager.php src/update.php src/app/Auth.php src/app/SecurityManager.php src/app/Repository.php)"
          echo P01_V2475_R2_CANDIDATE_IDENTITY=PASS

      - name: Syntax contracts and canonical regression
        working-directory: vf-start
        shell: bash
        run: |
          set -Eeuo pipefail
          find src -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
          while IFS= read -r -d '' f; do node --check "$f" >/dev/null; done < <(find src -type f -name '*.js' -print0)
          php tests/integration/p01_content_first_shell_acceptance.php | tee /tmp/shell.txt
          grep -Fx 'P01_CONTENT_FIRST_SHELL_ACCEPTANCE=PASS' /tmp/shell.txt
          php tests/integration/p01_v2391_resource_groups_acceptance.php
          php tests/integration/p01_books_catalog_acceptance.php
          php tests/integration/p01_six_surface_authority_acceptance.php
          php tests/integration/p01_start_category_return_acceptance.php
          echo P01_V2475_R2_REGRESSION=PASS

      - name: Fresh install and nine-surface runtime
        working-directory: vf-start
        shell: bash
        run: |
          set -Eeuo pipefail
          RUNTIME=/tmp/p01-v2475-r2-runtime
          rm -rf "$RUNTIME"
          cp -a src "$RUNTIME"
          cd "$RUNTIME"
          php -S 127.0.0.1:18125 -t . >/tmp/p01-v2475-r2-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS -c /tmp/p01r2.cookies -b /tmp/p01r2.cookies http://127.0.0.1:18125/setup.php -o /tmp/setup.html && break || sleep 1; done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/setup.html',encoding='utf-8').read(); m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s); assert m; print(m.group(1))
          PY
          )
          PASS="Gate${GITHUB_RUN_ID}V2475r2x"
          curl -fsS -c /tmp/p01r2.cookies -b /tmp/p01r2.cookies -X POST http://127.0.0.1:18125/setup.php --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=VF Start V2.47.5 R2' --data-urlencode "admin_password=$PASS" --data-urlencode "admin_password_confirm=$PASS" -o /tmp/post.html
          test -f app/.runtime.php
          php cli/verify.php | tee /tmp/verify.txt; grep -Fx 'VERIFY_PASS=YES' /tmp/verify.txt
          php cli/surface-verify.php | tee /tmp/surface.txt; grep -Fx 'MULTI_SURFACE_PASS=YES' /tmp/surface.txt
          for p in / /start.php /channels.php /watch.php /topics.php /courses.php /projects.php /tools.php /software.php; do test "$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:18125$p")" = 200; done
          echo "$SERVER_PID" >/tmp/p01-v2475-r2-server.pid
          trap - EXIT
          echo P01_V2475_R2_FRESH_RUNTIME=PASS

      - name: Chromium content-first geometry
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-v2475-r2-evidence /tmp/p01-v2475-r2-pw
          cd /tmp/p01-v2475-r2-pw
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > verify.mjs <<'JS'
          import { chromium } from 'playwright'; import fs from 'node:fs';
          const b=await chromium.launch({headless:true}); const d=await b.newPage({viewport:{width:1440,height:1000}});
          await d.goto('http://127.0.0.1:18125/start.php',{waitUntil:'networkidle'});
          const nav=await d.evaluate(()=>({display:getComputedStyle(document.querySelector('.vf-app-sidebar')).display,w:document.querySelector('.vf-app-sidebar').getBoundingClientRect().width,left:document.querySelector('.vf-app-stage').getBoundingClientRect().left,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}));
          if(nav.display==='none'||nav.w<150||nav.left<150||nav.overflow>1) throw new Error('navigation '+JSON.stringify(nav));
          await d.screenshot({path:'/tmp/p01-v2475-r2-evidence/navigation-desktop.png',fullPage:true});
          const paths=['channels.php','watch.php','topics.php','courses.php','projects.php','tools.php','software.php']; const out={navigation:nav,subjects:{}};
          for(const p of paths){await d.goto('http://127.0.0.1:18125/'+p,{waitUntil:'networkidle'});const r=await d.evaluate(()=>({display:getComputedStyle(document.querySelector('.vf-app-sidebar')).display,left:document.querySelector('.vf-app-stage').getBoundingClientRect().left,w:document.querySelector('.vf-shell-main').getBoundingClientRect().width,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}));if(r.display!=='none'||Math.abs(r.left)>1||r.w<1100||r.overflow>1)throw new Error(p+' '+JSON.stringify(r));out.subjects[p]=r;}
          await d.goto('http://127.0.0.1:18125/software.php',{waitUntil:'networkidle'}); await d.screenshot({path:'/tmp/p01-v2475-r2-evidence/software-desktop.png',fullPage:true});
          const m=await b.newPage({viewport:{width:390,height:844}});for(const p of paths){await m.goto('http://127.0.0.1:18125/'+p,{waitUntil:'networkidle'});const r=await m.evaluate(()=>({display:getComputedStyle(document.querySelector('.vf-app-sidebar')).display,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}));if(r.display!=='none'||r.overflow>1)throw new Error('mobile '+p+' '+JSON.stringify(r));}
          await m.goto('http://127.0.0.1:18125/courses.php',{waitUntil:'networkidle'}); await m.screenshot({path:'/tmp/p01-v2475-r2-evidence/courses-mobile.png',fullPage:true}); fs.writeFileSync('/tmp/p01-v2475-r2-evidence/geometry.json',JSON.stringify(out,null,2)); await b.close(); console.log('P01_V2475_R2_UA_UI=PASS');
          JS
          node verify.mjs
          kill "$(cat /tmp/p01-v2475-r2-server.pid)" 2>/dev/null || true

      - name: Deterministic FULL and ATOMIC UPDATE gate
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf formal candidate proven
          cp -a vf-start formal
          cp -a vf-start candidate
          cp -a template proven
          cp helper/scripts/_tmp_p01_v2470_formal_artifact_gate.sh /tmp/p01-v2475-r2-artifact-gate.sh
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path('/tmp/p01-v2475-r2-artifact-gate.sh'); s=p.read_text(encoding='utf-8')
          repl=[('7f3492f70276d83efed371296d69709c1e991350',os.environ['CANDIDATE_SHA']),('b70971514ccf1c6b8f3793bfc5a2200cad47dfe9',os.environ['CANDIDATE_SHA']),('1bd95e8777e72f6cd89206ddb9daf934ad4e6b9e',os.environ['SOURCE_SHA']),('33993725218',os.environ['GITHUB_RUN_ID']),('BIND_PR=416','BIND_PR=0'),('OWNER_AUTHORIZED_V2470_RELEASE_CHAIN_20260906','OWNER_AUTHORIZED_V2475_CONTENT_FIRST_RELEASE_20260910'),('V2470','V2475'),('v2470','v2475')]
          for a,b in repl:
              if a not in s: raise SystemExit('missing helper anchor '+a)
              s=s.replace(a,b)
          s=s.replace('2.47.0','__TARGET__').replace('2.46.4','2.47.4').replace('__TARGET__','2.47.5')
          old="src=src.replace(\"'release_type':'patch'\",\"'release_type':'minor'\")"
          if old not in s: raise SystemExit('release-type helper anchor missing')
          s=s.replace(old,"src=src.replace('V2.46.1 之后 Consolidated L2 Product Optimization 的正式发布版本。','V2.47.4 之后 content-first shell / Navigation-only taxonomy rail 的维护版本。')",1)
          p.write_text(s,encoding='utf-8')
          PY
          chmod +x /tmp/p01-v2475-r2-artifact-gate.sh
          bash /tmp/p01-v2475-r2-artifact-gate.sh
          ASSETS=/tmp/p01-v2475-formal-artifacts
          for f in VF-Start-V2.47.5-FULL.zip VF-Start-V2.47.5-FULL.zip.sha256 VF_Start_V2.47.5_UPDATE.zip VF_Start_V2.47.5_UPDATE.zip.sha256; do test -f "$ASSETS/$f"; done
          (cd "$ASSETS" && sha256sum -c VF-Start-V2.47.5-FULL.zip.sha256 && sha256sum -c VF_Start_V2.47.5_UPDATE.zip.sha256)
          ! unzip -Z1 "$ASSETS/VF-Start-V2.47.5-FULL.zip" | grep -Eq '(^|/)(private|backups|uploads|runtime-data)(/|$)'
          echo P01_V2475_R2_INSTALL_UPGRADE_DATA_SECURITY=PASS

      - name: Publish preview prerelease
        env:
          GH_TOKEN: ${{ env.RELEASE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ASSETS=/tmp/p01-v2475-formal-artifacts
          gh api --method POST "repos/${PRODUCT_REPO}/git/refs" -f ref="refs/tags/${PREVIEW_TAG}" -f sha="$CANDIDATE_SHA" >/dev/null
          test "$(gh api "repos/${PRODUCT_REPO}/git/ref/tags/${PREVIEW_TAG}" --jq '.object.sha')" = "$CANDIDATE_SHA"
          cat >/tmp/notes.md <<EOF
          P01 · VF Start V2.47.5 Preview 1

          Exact candidate: ${CANDIDATE_SHA}
          Base main: ${BASE_SHA}
          Previous release: ${SOURCE_TAG} / ${SOURCE_SHA}
          Navigation keeps its taxonomy rail; Home and subject product pages are content-first/full-width.
          Schema ${EXPECTED_SCHEMA}; migration NONE.
          Exact candidate fresh-install, Chromium desktop/mobile UX, deterministic package, atomic update/data preservation/security gates PASS on Runner ${GITHUB_RUN_ID}.
          Stable distribution NOT UPDATED. Production NOT WRITTEN / NOT VERIFIED.
          EOF
          gh release create "$PREVIEW_TAG" "$ASSETS/VF-Start-V2.47.5-FULL.zip" "$ASSETS/VF-Start-V2.47.5-FULL.zip.sha256" "$ASSETS/VF_Start_V2.47.5_UPDATE.zip" "$ASSETS/VF_Start_V2.47.5_UPDATE.zip.sha256" --repo "$PRODUCT_REPO" --title 'VF Start V2.47.5 Preview 1' --notes-file /tmp/notes.md --prerelease --verify-tag
          echo P01_V2475_R2_PREVIEW_PUBLISHED=PASS

      - name: Independent preview byte readback
        env:
          GH_TOKEN: ${{ env.PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api "repos/${PRODUCT_REPO}/git/ref/tags/${PREVIEW_TAG}" --jq '.object.sha')" = "$CANDIDATE_SHA"
          test "$(gh api "repos/${PRODUCT_REPO}/releases/tags/${PREVIEW_TAG}" --jq '.prerelease')" = true
          rm -rf /tmp/remote; mkdir /tmp/remote
          gh release download "$PREVIEW_TAG" --repo "$PRODUCT_REPO" --dir /tmp/remote
          LOCAL=/tmp/p01-v2475-formal-artifacts REMOTE=/tmp/remote python3 - <<'PY'
          from pathlib import Path
          import hashlib,os
          l=Path(os.environ['LOCAL']); r=Path(os.environ['REMOTE']); names=['VF-Start-V2.47.5-FULL.zip','VF-Start-V2.47.5-FULL.zip.sha256','VF_Start_V2.47.5_UPDATE.zip','VF_Start_V2.47.5_UPDATE.zip.sha256']
          assert sorted(p.name for p in r.iterdir() if p.is_file())==sorted(names)
          for n in names:
              a,b=l/n,r/n; assert a.stat().st_size==b.stat().st_size; assert hashlib.sha256(a.read_bytes()).digest()==hashlib.sha256(b.read_bytes()).digest(); print(f'REMOTE_ASSET={n}|{a.stat().st_size}|{hashlib.sha256(a.read_bytes()).hexdigest()}')
          print('P01_V2475_R2_REMOTE_BYTES=PASS')
          PY

      - name: Evidence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/evidence
          cp -a /tmp/p01-v2475-r2-evidence/. /tmp/evidence/ 2>/dev/null || true
          jq -n --arg base "$BASE_SHA" --arg candidate "$CANDIDATE_SHA" --arg run "$GITHUB_RUN_ID" '{project:"P01",version:"2.47.5",base:$base,candidate:$candidate,run_id:$run,schema:"2026090401",migration:"NONE",stable_distribution:false,production:false}' >/tmp/evidence/P01-V2.47.5-R2.json

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: P01-V2.47.5-EXACT-CANDIDATE-R2-${{ github.run_id }}
          path: /tmp/evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Final verdict
        run: |
          echo P01_V2475_EXACT_CANDIDATE_GATE=PASS
          echo INSTALL_GATE=PASS
          echo UPGRADE_GATE=PASS
          echo DATA_PRESERVATION_GATE=PASS
          echo SECURITY_GATE=PASS
          echo UA_UI_GATE=PASS
          echo STABLE_DISTRIBUTION_UPDATED=false
          echo PRODUCTION_WRITE=false

      - name: Cleanup
        if: always()
        run: |
          kill "$(cat /tmp/p01-v2475-r2-server.pid 2>/dev/null)" 2>/dev/null || true
          rm -rf vf-start helper template formal candidate proven /tmp/p01-v2475-* /tmp/remote