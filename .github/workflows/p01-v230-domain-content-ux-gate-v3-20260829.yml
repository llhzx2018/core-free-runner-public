name: P01 V2.30 Domain Content UX Gate V3
on:
  push:
    branches: [task/p01-v230-domain-nav-shell-20260829]
    paths: [.github/workflows/p01-v230-domain-content-ux-gate-v3-20260829.yml]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_SHA: 426740ee3e36d207581dddf9b3fe5d62fd8d1808
      PORT: '18588'
      ROOT: /tmp/p01-v230-domain-v3
      ADMIN_PASS: 'P01V230!DomainUX'
    steps:
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.4', extensions: 'pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo', coverage: none}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {repository: llhzx2018/vf-start, ref: '${{ env.SOURCE_SHA }}', token: '${{ secrets.VF_PRIVATE_READ_TOKEN }}', fetch-depth: 0, path: source}
      - name: Fresh runtime and representative seed
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"; test "$(tr -d '\r\n' < source/VERSION)" = 2.30.0
          php -l source/src/app/FunctionalWorkspaceShell.php >/dev/null; node --check source/src/assets/workspace-rebaseline.js
          rm -rf "$ROOT" evidence /tmp/v3.cookies; mkdir -p evidence; cp -a source/src "$ROOT"; php -S "127.0.0.1:${PORT}" -t "$ROOT" >/tmp/v3-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS -c /tmp/v3.cookies -b /tmp/v3.cookies "http://127.0.0.1:${PORT}/setup.php" -o /tmp/v3-setup.html && break || sleep 1; done
          S=$(python3 -c "import re;s=open('/tmp/v3-setup.html').read();m=re.search(r'name=\"setup_csrf\"\\s+value=\"([^\"]+)\"',s);assert m;print(m.group(1))")
          curl -fsS -c /tmp/v3.cookies -b /tmp/v3.cookies -X POST "http://127.0.0.1:${PORT}/setup.php" --data-urlencode "setup_csrf=$S" --data-urlencode 'site_title=VF Start V2.30 UX Gate' --data-urlencode "admin_password=$ADMIN_PASS" --data-urlencode "admin_password_confirm=$ADMIN_PASS" >/dev/null
          LOGIN=$(curl -fsS -c /tmp/v3.cookies -b /tmp/v3.cookies -H 'Content-Type: application/json' -d "{\"password\":\"$ADMIN_PASS\"}" "http://127.0.0.1:${PORT}/api.php?action=login"); T=$(echo "$LOGIN"|jq -r '.csrf'); test "$T" != null
          postcat(){ curl -fsS -c /tmp/v3.cookies -b /tmp/v3.cookies -H 'Content-Type: application/json' -H "X-CSRF-Token: $T" -d "$1" "http://127.0.0.1:${PORT}/api.php?action=category_save"; }
          R=$(postcat '{"name":"互联网","description":"根","is_private":false,"sort_order":100}'); RID=$(echo "$R"|jq -r '.id'); D=$(postcat "{\"name\":\"开发工具\",\"parent_id\":$RID,\"is_private\":false,\"sort_order\":90}"); DID=$(echo "$D"|jq -r '.id'); G=$(postcat "{\"name\":\"设计灵感\",\"parent_id\":$RID,\"is_private\":false,\"sort_order\":80}"); GID=$(echo "$G"|jq -r '.id'); P=$(postcat "{\"name\":\"私人收藏\",\"parent_id\":$RID,\"is_private\":true,\"sort_order\":70}"); PID=$(echo "$P"|jq -r '.id')
          create(){ local label="$1" surface="$2" cid="$3" title="$4" url="$5" kind="$6" tags="$7" priv="$8" bg="${9:-0}" year="${10:-}" status="${11:-}"; local out statuscode body; out=$(curl -sS -w '\n%{http_code}' -c /tmp/v3.cookies -b /tmp/v3.cookies -X POST "http://127.0.0.1:${PORT}/workspace-create.php" -F "csrf=$T" -F "category_id=$cid" -F "surface=$surface" -F "title=$title" -F "url=$url" -F "resource_kind=$kind" -F "tags=$tags" -F "is_private=$priv" -F "background_friendly=$bg" -F "media_year=$year" -F "media_status=$status" -F 'source_kind=remote_url'); statuscode=$(printf '%s' "$out"|tail -1); body=$(printf '%s' "$out"|sed '$d'); echo "$label HTTP=$statuscode $body"; test "$statuscode" = 200; echo "$body"|jq -e '.ok==true' >/dev/null; }
          create nav1 start "$DID" 'GitHub' 'https://github.com/' '' '开发,代码' 0
          create nav2 start "$DID" 'MDN' 'https://developer.mozilla.org/' '' '开发,文档' 0
          create nav3 start "$GID" 'Figma' 'https://figma.com/' '' '设计,灵感' 0
          create nav4 start "$GID" 'Awwwards' 'https://awwwards.com/' '' '设计,灵感' 0
          create nav5 start "$PID" '私人控制台' 'https://private.example.net/' '' '私人' 0
          create ch1 channels "$RID" 'AI 长谈' 'https://channel-ai.example.org/' '科技' 'AI,科技' 0 1
          create ch2 channels "$RID" '开发者频道' 'https://channel-dev.example.org/' '科技' '开发,科技' 0 1
          create ch3 channels "$RID" '产品播客' 'https://podcast-product.example.org/' '播客' '播客,产品' 0 1
          create ch4 channels "$RID" '旅行频道' 'https://channel-travel.example.org/' '旅行' '旅行' 0 0
          create w1 watch "$RID" '电影一' 'https://movie-one.example.org/' '电影' '电影' 0 0 2026 want
          create w2 watch "$RID" '电影二' 'https://movie-two.example.org/' '电影' '电影' 0 0 2025 want
          create w3 watch "$RID" '电影三' 'https://movie-three.example.org/' '电影' '电影' 0 0 2024 watched
          create w4 watch "$RID" '电视剧一' 'https://tv-one.example.org/' '电视剧' '电视剧' 0 0 2026 watching
          create w5 watch "$RID" '电视剧二' 'https://tv-two.example.org/' '电视剧' '电视剧' 0 0 2025 watching
          create w6 watch "$RID" '纪录片一' 'https://doc-one.example.org/' '纪录片' '纪录片' 0 0 2026 watched
          create t1 topics "$RID" 'AI 编程工具指南' 'https://topic-ai.example.org/' 'AI' 'AI,专题' 0
          create t2 topics "$RID" '独立开发成本账本' 'https://topic-cost.example.org/' '建站' '建站,专题' 0
          create t3 topics "$RID" '网站失败模式图鉴' 'https://topic-fail.example.org/' '产品' '产品,专题' 0
          create t4 topics "$RID" 'VPS 迁移指南' 'https://topic-vps.example.org/' '运维' '运维,专题' 0
          php "$ROOT/cli/verify.php"|grep -Fx VERIFY_PASS=YES
          echo P01_V230_DOMAIN_V3_SEED=PASS
      - name: Install Playwright
        shell: bash
        run: |
          mkdir -p /tmp/pw-v3 && cd /tmp/pw-v3 && npm init -y >/dev/null 2>&1 && npm install playwright@1.55.0 >/dev/null 2>&1 && npx playwright install chromium --with-deps >/dev/null 2>&1
      - name: Desktop and mobile UX assertions
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/pw-v3/gate.js <<'JS'
          const {chromium}=require('playwright'); const fs=require('fs');
          (async()=>{const base='http://127.0.0.1:18588',password='P01V230!DomainUX',browser=await chromium.launch({headless:true}); async function login(c){let r=await c.request.post(base+'/api.php?action=login',{data:{password}});if(!r.ok())throw Error('login')}; const pages=[['start.php','start'],['channels.php','channels'],['watch.php','watch'],['topics.php','topics']];
          const d=await browser.newContext({viewport:{width:1440,height:960}});await login(d);const p=await d.newPage();for(const [route,m] of pages){await p.goto(base+'/'+route,{waitUntil:'networkidle'});let nav=p.locator('.vf-global-domain-nav');await nav.waitFor({state:'visible'});if(await nav.locator('a').count()!=5||await nav.locator('a.active').count()!=1)throw Error(m+' nav');if(await p.locator('.vf-workspace-toolbar').count()!=1)throw Error(m+' toolbar');let ov=await p.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);if(ov>1)throw Error(m+' d overflow '+ov);if(m==='start'){let rows=p.locator('.vf-asset-row');if(await rows.count()<5)throw Error('start rows');let b=await rows.first().boundingBox();if(b.height>62)throw Error('start density '+b.height);if(await p.locator('.vf-category-tree').count()!=1)throw Error('tree')}if(m==='channels'){let r=p.locator('.vf-asset-row');if(await r.count()!=4)throw Error('channel count');let a=await r.nth(0).boundingBox(),b=await r.nth(1).boundingBox();if(Math.abs(a.y-b.y)>2||b.x<=a.x)throw Error('channel 2col');let i=await r.first().locator('.vf-asset-icon').boundingBox();if(i.width<48)throw Error('channel visual')}if(m==='watch'){let c=await p.locator('.vf-watch-grid').evaluate(e=>getComputedStyle(e).gridTemplateColumns.split(' ').length);if(c<5)throw Error('watch cols '+c)}if(m==='topics'){let c=await p.locator('.vf-topic-grid').evaluate(e=>getComputedStyle(e).gridTemplateColumns.split(' ').length);if(c<3)throw Error('topic cols '+c)}await p.screenshot({path:`/home/runner/work/core-free-runner-public/core-free-runner-public/evidence/desktop-${m}.png`,fullPage:true})}await d.close();
          const mob=await browser.newContext({viewport:{width:390,height:844}});await login(mob);const q=await mob.newPage();for(const [route,m] of pages){await q.goto(base+'/'+route,{waitUntil:'networkidle'});await q.locator('.vf-global-domain-nav').waitFor({state:'visible'});await q.locator('.vf-mobile-command-row').waitFor({state:'visible'});if(await q.locator('.vf-app-sidebar:visible').count())throw Error(m+' sidebar');let ov=await q.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);if(ov>1)throw Error(m+' m overflow '+ov);if(m==='channels'){let r=q.locator('.vf-asset-row'),a=await r.nth(0).boundingBox(),b=await r.nth(1).boundingBox();if(b.y<=a.y+20)throw Error('channel mobile')}if(m==='watch'){let c=await q.locator('.vf-watch-grid').evaluate(e=>getComputedStyle(e).gridTemplateColumns.split(' ').length);if(c!==2)throw Error('watch mobile '+c)}if(m==='topics'){let c=await q.locator('.vf-topic-grid').evaluate(e=>getComputedStyle(e).gridTemplateColumns.split(' ').length);if(c!==2)throw Error('topic mobile '+c)}await q.screenshot({path:`/home/runner/work/core-free-runner-public/core-free-runner-public/evidence/mobile-${m}.png`,fullPage:true})}await mob.close();await browser.close();fs.writeFileSync('/home/runner/work/core-free-runner-public/core-free-runner-public/evidence/verdict.txt','P01_V230_DOMAIN_CONTENT_UX_V3=PASS\n')})().catch(e=>{console.error(e);process.exit(1)});
          JS
          cd /tmp/pw-v3 && node gate.js
          echo P01_V230_DOMAIN_V3_BROWSER=PASS
      - uses: actions/upload-artifact@v4
        with: {name: P01-v230-domain-content-ux-v3-evidence, path: evidence, retention-days: 7}
      - name: Final verdict
        run: |
          echo "SOURCE=$SOURCE_SHA"; echo "TREE=$(git -C source rev-parse HEAD^{tree})"; echo P01_V230_DOMAIN_CONTENT_UX_V3_GATE=PASS
