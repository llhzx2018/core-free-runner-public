name: S01 public test-page hreflang scoped WordPress validation
on:
  push:
    branches: [task/s01-hreflang173-20261022]
    paths: ['.github/workflows/s01-hreflang173-20261022.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.173
  TARGET_SHA: 1bcfa46d0e1e67e949a81ef0546f9ec3f5bc0477
  TARGET_TREE: 6149fb8010f6f2010e9210fdccde3d664c323f78
  BASE_SHA: f1d34513b1b870c24e593afba3b08222f97a97f2
  SOURCE_VERSION: 1.35.172
  LANE_ID: s01-hreflang173-20261022
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          ref: 02d4591eed025a3d3a67bc0a150b3ddc448c2ab8
          persist-credentials: false
          path: established
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 1bcfa46d0e1e67e949a81ef0546f9ec3f5bc0477
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact package and old/new final-head counterfactual
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider baseline
          python3 control/lanes/s01-hreflang173-20261022/package.py
          git -C target archive "$BASE_SHA" src | tar -x -C baseline
          php -l target/src/inc/services/page-family-technical-state.php
          php -l target/tests/public-test-page-hreflang-contract.php
          php -l control/lanes/s01-hreflang173-20261022/probe.php
          VF_TEST_THEME_ROOT="$PWD/baseline/src" VF_EXPECT_BASELINE_BUG=1 php target/tests/public-test-page-hreflang-contract.php | tee proof/counterfactual-before.txt
          php target/tests/public-test-page-hreflang-contract.php | tee proof/counterfactual-after.txt
          gh release download v1.35.172 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.172.zip --dir provider
          echo 'ba1d0f93624b1bc3572e92fc8d3df0bea02f695d5e63e784edc6f965c757867a  provider/vf-tools-theme_V1.35.172.zip' | sha256sum -c
          gh release download v1.25.94 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.94.zip --dir provider
          echo '70b90d40da5d69fc7819bd7ada3f15fb0145e64822b788bd94956c7827b2df03  provider/vf-tools-m3u8_V1.25.94.zip' | sha256sum -c
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          node --check control/lanes/s01-hreflang173-20261022/browser.cjs
          node --check control/lanes/s01-hreflang173-20261022/clean.cjs
      - name: Real WordPress public heads, preview exclusion and native lifecycle
        run: |
          set -euo pipefail
          cp -a established/lanes/s01-frontend-design-20261017 lane
          cp control/lanes/s01-hreflang173-20261022/clean.cjs lane/warm-admin.cjs
          bash control/lanes/s01-hreflang173-20261022/native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-hreflang-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target baseline provider
