name: TEMP P07 lifecycle inventory preflight exact-source test
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-site-lifecycle-preflight-temporary.yml'
permissions:
  contents: read
concurrency:
  group: temp-p07-lifecycle-preflight-20261017
  cancel-in-progress: false
jobs:
  focused-regression:
    if: github.repository == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require registered private read capability
        shell: bash
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          test -n "$PRIVATE_READ_TOKEN" || exit 78
      - name: Checkout exact P07 source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 3b79ac2c3af038a2b1ced5a795ece201cabae922
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: p07-private
      - name: Check lifecycle and adjacent restore/backup regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p07-private rev-parse HEAD)" = '3b79ac2c3af038a2b1ced5a795ece201cabae922'
          test "$(cat p07-private/BUILD_ID)" = '0.1.0-release87'
          cd p07-private
          export PYTHONPATH="$PWD/lib"
          python3 -m py_compile lib/site_lifecycle.py lib/restore.py tests/test_site_lifecycle.py
          log="$RUNNER_TEMP/p07-lifecycle-preflight-regression.log"
          if timeout --signal=TERM --kill-after=5s 750 python3 -m unittest -q tests.test_site_lifecycle tests.test_restore_as tests.test_restore tests.test_restore_new tests.test_backup >"$log" 2>&1; then
            echo 'P07_LIFECYCLE_INVENTORY_PREFLIGHT=PASS'
            grep -E '^Ran [0-9]+ tests? in ' "$log" | tail -n1 || true
          else
            rc=$?
            echo "P07_LIFECYCLE_INVENTORY_PREFLIGHT=FAIL_$rc"
            grep -E '^Ran [0-9]+ tests? in |^FAILED \(' "$log" | tail -n2 || true
            exit "$rc"
          fi
      - name: Erase private checkout and logs
        if: always()
        shell: bash
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/p07-private"
          rm -f -- "$RUNNER_TEMP/p07-lifecycle-preflight-regression.log"
          echo 'P07_PRIVATE_SOURCE_PERSISTED=NO'
          echo 'P07_PRIVATE_LOG_PERSISTED=NO'
