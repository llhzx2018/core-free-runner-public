name: P04 V2.8.12 Publication

on:
  push:
    branches:
      - release/p04-v2812-publication-20260831
    paths:
      - '.github/workflows/p04-v2812-publication-20260831.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PRODUCT_REPO: llhzx2018/vf-infra
  VERIFIED_SOURCE: 5e628a932d5bbd7393bf8e8d4008785a4f04bed2
  OLD_GATE_SOURCE: 3b87a1ffea5fe2caafceef4ca9db87c871ff2882
  RELEASE_SOURCE: 9bf4500c2dea214386bc2a6dd81893cafed0947c
  RELEASE_TREE: d74cf7b76f0e4941bbe09cd839dbf9d70a72b516
  FORMAL_RUN: '33409138217'
  FORMAL_ARTIFACT: P04-V2.8.12-FINAL-3b87a1ffea5fe2caafceef4ca9db87c871ff2882
  FORMAL_ARTIFACT_ID: '9764418835'
  FORMAL_ARTIFACT_DIGEST: sha256:de030adf90743691e8c598a27f069602ce79e210d7646a6531563ced4c2adcae
  DELTA_RUN: '33413081262'
  DELTA_ARTIFACT_ID: '9765907330'
  DELTA_ARTIFACT_DIGEST: sha256:1d6826d38509f514b4d8239f785a3a1bd704f96cccd784bc45e7cddf9a6aed8a
  CORE_UPDATES_EXPECTED: 208943844166663328811da775c8af2de755b96f
  TAG: v2.8.12
  EXPECTED_FULL_SHA256: a8144f46c78fea31e3c2508a1e34f2d122835e4fcf66a63d50ac95f861500634
  EXPECTED_FULL_BYTES: '624374'
  EXPECTED_UPDATE_SHA256: 89e43645b1b434ce86f575c835517a15f29711ccbd586311ac5957d2e8ba4246
  EXPECTED_UPDATE_BYTES: '1338985'

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Publish exact gated release and update channel
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          ROOT="$RUNNER_TEMP/p04-v2812-publish"
          mkdir -p "$ROOT/artifact" "$ROOT/assets" "$ROOT/remote"

          # Gate provenance must still be live and immutable enough to publish.
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$FORMAL_RUN --jq '.conclusion')" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$DELTA_RUN --jq '.conclusion')" = success
          FORMAL_META="$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$FORMAL_RUN/artifacts)"
          test "$(jq -r --arg n "$FORMAL_ARTIFACT" '.artifacts[]|select(.name==$n)|.id' <<<"$FORMAL_META")" = "$FORMAL_ARTIFACT_ID"
          test "$(jq -r --arg n "$FORMAL_ARTIFACT" '.artifacts[]|select(.name==$n)|.digest' <<<"$FORMAL_META")" = "$FORMAL_ARTIFACT_DIGEST"
          test "$(jq -r --arg n "$FORMAL_ARTIFACT" '.artifacts[]|select(.name==$n)|.expired' <<<"$FORMAL_META")" = false
          DELTA_META="$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$DELTA_RUN/artifacts)"
          test "$(jq -r --argjson id "$DELTA_ARTIFACT_ID" '.artifacts[]|select(.id==$id)|.digest' <<<"$DELTA_META")" = "$DELTA_ARTIFACT_DIGEST"
          test "$(jq -r --argjson id "$DELTA_ARTIFACT_ID" '.artifacts[]|select(.id==$id)|.expired' <<<"$DELTA_META")" = false

          gh run download "$FORMAL_RUN" -R llhzx2018/core-free-runner-public -n "$FORMAL_ARTIFACT" --dir "$ROOT/artifact"
          FULL_SRC="$(find "$ROOT/artifact" -type f -name 'VF_Infra_V2.8.12_FULL.zip' -print -quit)"
          UPDATE_SRC="$(find "$ROOT/artifact" -type f -name 'VF_Infra_V2.8.12_UPDATE.zip' -print -quit)"
          REPORT_SRC="$(find "$ROOT/artifact" -type f -name 'browser-report.json' -print -quit)"
          SUMMARY_SRC="$(find "$ROOT/artifact" -type f -name 'FINAL_GATE_SUMMARY.json' -print -quit)"
          test -n "$FULL_SRC" -a -n "$UPDATE_SRC" -a -n "$REPORT_SRC" -a -n "$SUMMARY_SRC"
          cp "$FULL_SRC" "$ROOT/assets/VF_Infra_V2.8.12_FULL.zip"
          cp "$UPDATE_SRC" "$ROOT/assets/VF_Infra_V2.8.12_UPDATE.zip"
          cp "$REPORT_SRC" "$ROOT/assets/browser-report.json"
          cp "$SUMMARY_SRC" "$ROOT/assets/FINAL_GATE_SUMMARY.json"
          test "$(jq -r '.status' "$ROOT/assets/browser-report.json")" = PASS
          test "$(jq -r '.status' "$ROOT/assets/FINAL_GATE_SUMMARY.json")" = PASS
          test "$(jq -r '.version' "$ROOT/assets/FINAL_GATE_SUMMARY.json")" = '2.8.12'

          cd "$ROOT/assets"
          FULL_SHA="$(sha256sum VF_Infra_V2.8.12_FULL.zip | awk '{print $1}')"
          UPDATE_SHA="$(sha256sum VF_Infra_V2.8.12_UPDATE.zip | awk '{print $1}')"
          FULL_BYTES="$(stat -c %s VF_Infra_V2.8.12_FULL.zip)"
          UPDATE_BYTES="$(stat -c %s VF_Infra_V2.8.12_UPDATE.zip)"
          test "$FULL_SHA" = "$EXPECTED_FULL_SHA256"
          test "$UPDATE_SHA" = "$EXPECTED_UPDATE_SHA256"
          test "$FULL_BYTES" = "$EXPECTED_FULL_BYTES"
          test "$UPDATE_BYTES" = "$EXPECTED_UPDATE_BYTES"
          sha256sum VF_Infra_V2.8.12_FULL.zip VF_Infra_V2.8.12_UPDATE.zip > RELEASE_SHA256SUMS.txt

          # Product main must still be the exact signed Promotion source.
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${PRODUCT_REPO}.git" "$ROOT/product" >/dev/null 2>&1
          cd "$ROOT/product"
          test "$(git rev-parse origin/main)" = "$RELEASE_SOURCE"
          git cat-file -e "$OLD_GATE_SOURCE^{commit}"
          git cat-file -e "$VERIFIED_SOURCE^{commit}"
          git cat-file -e "$RELEASE_SOURCE^{commit}"
          test "$(git show "$OLD_GATE_SOURCE:VERSION" | tr -d '\r\n')" = '2.8.12'
          test "$(git show "$VERIFIED_SOURCE:VERSION" | tr -d '\r\n')" = '2.8.12'
          test "$(git show "$RELEASE_SOURCE:VERSION" | tr -d '\r\n')" = '2.8.12'
          VERIFIED_TREE="$(git show -s --format=%T "$VERIFIED_SOURCE")"
          PRODUCT_TREE="$(git show -s --format=%T "$RELEASE_SOURCE")"
          test "$VERIFIED_TREE" = "$RELEASE_TREE"
          test "$PRODUCT_TREE" = "$RELEASE_TREE"
          git diff --quiet "$VERIFIED_SOURCE" "$RELEASE_SOURCE" -- .
          mapfile -t post_gate_delta < <(git diff --name-only "$OLD_GATE_SOURCE" "$VERIFIED_SOURCE")
          test "${#post_gate_delta[@]}" -eq 1
          test "${post_gate_delta[0]}" = '.github/workflows/ci.yml'
          test "$(gh api repos/${PRODUCT_REPO}/commits/$RELEASE_SOURCE --jq '.commit.verification.verified')" = true
          test "$(gh api repos/${PRODUCT_REPO}/commits/$RELEASE_SOURCE --jq '.commit.verification.reason')" = valid

          # Tag is recoverable/idempotent only if it already points to the exact source.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            test "$(gh api repos/${PRODUCT_REPO}/git/ref/tags/$TAG --jq '.object.sha')" = "$RELEASE_SOURCE"
          else
            git config user.name VictorForge
            git config user.email llhzx2018@gmail.com
            git tag "$TAG" "$RELEASE_SOURCE"
            git push origin "refs/tags/$TAG"
          fi

          cd "$ROOT/assets"
          cat > release-notes.md <<'MD'
          # P04 · VF Infra V2.8.12

          Daily UX maintenance release，面向 VF Infra 日常使用、空数据首次使用与后台维护体验收口。

          - 空数据时，概览 / 域名 / 服务器提供明确第一步，并统一进入既有服务商连接与同步 Owner Flow。
          - 已连接数据出现后，空状态引导会自动退出，不残留 stale onboarding。
          - 概览需要处理事项去重，同一资源不会因同一原因重复生成多个 Owner Action。
          - 服务商连接、全部资产同步、全部费用同步补齐长操作反馈与移动端触控下限；不改变 Provider Authority。
          - 5 个主路由完成空状态 / 加载 / 错误恢复收口；数据错误保留当前页面上下文并提供 GET-only 重试。
          - 移动端优化后完成桌面回归，未把 40px touch floor 错误放大到桌面布局。
          - Schema 14 不变，Migration NONE，Provider Authority 继续 READ_ONLY_FIRST。
          - 仅支持 V2.8.11 → V2.8.12 Atomic；pre-update backup、rollback boundary、protected data preservation 已真实隔离升级验证。
          - Production 实例不会由发布动作自动升级；Owner 在 VF Infra 后台发现 V2.8.12 后自行执行在线升级。

          Final Exact Source Gate: Run 33409138217 = PASS.
          Private CI parity: Run 33412661438 = PASS.
          Promotion Delta Gate: Run 33413081262 = PASS.
          Verified Final Candidate: 5e628a932d5bbd7393bf8e8d4008785a4f04bed2
          Release Source (tree-identical signed merge): 9bf4500c2dea214386bc2a6dd81893cafed0947c
          MD

          if gh release view "$TAG" -R "$PRODUCT_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" VF_Infra_V2.8.12_FULL.zip VF_Infra_V2.8.12_UPDATE.zip RELEASE_SHA256SUMS.txt -R "$PRODUCT_REPO" --clobber
          else
            gh release create "$TAG" VF_Infra_V2.8.12_FULL.zip VF_Infra_V2.8.12_UPDATE.zip RELEASE_SHA256SUMS.txt \
              -R "$PRODUCT_REPO" --title 'VF Infra V2.8.12' --notes-file release-notes.md
          fi

          RELEASE_JSON="$(gh api "repos/${PRODUCT_REPO}/releases/tags/${TAG}")"
          RELEASE_ID="$(jq -r '.id' <<<"$RELEASE_JSON")"
          RELEASED_AT="$(jq -r '.published_at' <<<"$RELEASE_JSON")"
          FULL_ID="$(jq -r '.assets[]|select(.name=="VF_Infra_V2.8.12_FULL.zip")|.id' <<<"$RELEASE_JSON")"
          UPDATE_ID="$(jq -r '.assets[]|select(.name=="VF_Infra_V2.8.12_UPDATE.zip")|.id' <<<"$RELEASE_JSON")"
          test "$(jq -r '.draft' <<<"$RELEASE_JSON")" = false
          test "$(jq -r '.prerelease' <<<"$RELEASE_JSON")" = false
          test "$(jq -r '.name' <<<"$RELEASE_JSON")" = 'VF Infra V2.8.12'
          test "$(jq -r '.assets[]|select(.name=="VF_Infra_V2.8.12_FULL.zip")|.size' <<<"$RELEASE_JSON")" = "$EXPECTED_FULL_BYTES"
          test "$(jq -r '.assets[]|select(.name=="VF_Infra_V2.8.12_FULL.zip")|.digest' <<<"$RELEASE_JSON")" = "sha256:$EXPECTED_FULL_SHA256"
          test "$(jq -r '.assets[]|select(.name=="VF_Infra_V2.8.12_UPDATE.zip")|.size' <<<"$RELEASE_JSON")" = "$EXPECTED_UPDATE_BYTES"
          test "$(jq -r '.assets[]|select(.name=="VF_Infra_V2.8.12_UPDATE.zip")|.digest' <<<"$RELEASE_JSON")" = "sha256:$EXPECTED_UPDATE_SHA256"
          test "$(gh api "repos/${PRODUCT_REPO}/git/ref/tags/${TAG}" --jq '.object.sha')" = "$RELEASE_SOURCE"

          gh release download "$TAG" -R "$PRODUCT_REPO" -p 'VF_Infra_V2.8.12_FULL.zip' -p 'VF_Infra_V2.8.12_UPDATE.zip' -D "$ROOT/remote"
          test "$(stat -c %s "$ROOT/remote/VF_Infra_V2.8.12_FULL.zip")" = "$EXPECTED_FULL_BYTES"
          test "$(sha256sum "$ROOT/remote/VF_Infra_V2.8.12_FULL.zip" | awk '{print $1}')" = "$EXPECTED_FULL_SHA256"
          test "$(stat -c %s "$ROOT/remote/VF_Infra_V2.8.12_UPDATE.zip")" = "$EXPECTED_UPDATE_BYTES"
          test "$(sha256sum "$ROOT/remote/VF_Infra_V2.8.12_UPDATE.zip" | awk '{print $1}')" = "$EXPECTED_UPDATE_SHA256"

          # Publish the backend discovery manifest, fail-closed on any concurrent drift.
          git clone "https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/core-updates.git" "$ROOT/core-updates" >/dev/null 2>&1
          cd "$ROOT/core-updates"
          test "$(git rev-parse origin/main)" = "$CORE_UPDATES_EXPECTED"
          python3 - "$RELEASE_ID" "$RELEASED_AT" "$UPDATE_ID" "$EXPECTED_UPDATE_BYTES" "$EXPECTED_UPDATE_SHA256" "$RELEASE_SOURCE" "$RELEASE_TREE" <<'PY'
          import json,sys
          from pathlib import Path
          release_id=int(sys.argv[1]); released_at=sys.argv[2]; asset_id=int(sys.argv[3]); asset_bytes=int(sys.argv[4]); asset_sha=sys.argv[5]; commit=sys.argv[6]; tree=sys.argv[7]
          p=Path('projects/P04.json')
          old=json.loads(p.read_text(encoding='utf-8'))
          assert old['schema_version']=='1.0'
          assert old['project_id']=='P04' and old['component_id']=='APP' and old['enabled'] is True
          assert old['target_version']=='2.8.11' and old['release_tag']=='v2.8.11'
          assert old['from_versions']==['2.8.10']
          d={
            'schema_version':'1.0','project_id':'P04','component_id':'APP','enabled':True,
            'target_version':'2.8.12','update_type':'ATOMIC','from_versions':['2.8.11'],
            'schema_from':'14','schema_to':'14','repository':'llhzx2018/vf-infra',
            'release_tag':'v2.8.12','release_name':'VF Infra V2.8.12','release_id':release_id,
            'release_product_commit':commit,'release_product_tree':tree,
            'asset_name':'VF_Infra_V2.8.12_UPDATE.zip','asset_id':asset_id,'asset_bytes':asset_bytes,'asset_sha256':asset_sha,
            'backup_required':True,'rollback_supported':True,'released_at':released_at,'minimum_php':'8.0.0',
            'notes':'V2.8.12 正式发布 Daily UX maintenance：空数据第一步、connected-data transition、Owner Action 去重、Provider 安全连接/同步反馈、主路由错误恢复与移动/桌面回归。Schema 14，无 Migration；仅支持 V2.8.11 → V2.8.12 Atomic；Provider Authority 继续 READ_ONLY_FIRST。'
          }
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python3 -m json.tool projects/P04.json >/dev/null
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add projects/P04.json
          git commit -m 'release(P04): publish V2.8.12 backend update'
          CORE_UPDATES_NEW="$(git rev-parse HEAD)"
          git push origin main
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$CORE_UPDATES_NEW"
          git fetch -q origin main
          git show origin/main:projects/P04.json > "$ROOT/assets/P04-core-updates-readback.json"
          test "$(jq -r '.target_version' "$ROOT/assets/P04-core-updates-readback.json")" = '2.8.12'
          test "$(jq -r '.from_versions[0]' "$ROOT/assets/P04-core-updates-readback.json")" = '2.8.11'
          test "$(jq -r '.release_product_commit' "$ROOT/assets/P04-core-updates-readback.json")" = "$RELEASE_SOURCE"
          test "$(jq -r '.asset_sha256' "$ROOT/assets/P04-core-updates-readback.json")" = "$EXPECTED_UPDATE_SHA256"

          cat > "$ROOT/assets/PUBLICATION_SUMMARY.json" <<JSON
          {
            "project":"P04",
            "version":"2.8.12",
            "release_source":"$RELEASE_SOURCE",
            "release_tree":"$RELEASE_TREE",
            "release_id":$RELEASE_ID,
            "full_asset_id":$FULL_ID,
            "update_asset_id":$UPDATE_ID,
            "full_sha256":"$EXPECTED_FULL_SHA256",
            "update_sha256":"$EXPECTED_UPDATE_SHA256",
            "core_updates_commit":"$CORE_UPDATES_NEW",
            "from_versions":["2.8.11"],
            "schema_from":"14",
            "schema_to":"14",
            "backup_required":true,
            "rollback_supported":true,
            "provider_authority":"READ_ONLY_FIRST",
            "status":"PASS"
          }
          JSON

          echo "P04_V2812_RELEASE_ID=$RELEASE_ID"
          echo "P04_V2812_FULL_ASSET_ID=$FULL_ID"
          echo "P04_V2812_UPDATE_ASSET_ID=$UPDATE_ID"
          echo "P04_V2812_CORE_UPDATES_COMMIT=$CORE_UPDATES_NEW"
          echo "P04_V2812_FULL_SHA256=$EXPECTED_FULL_SHA256"
          echo "P04_V2812_UPDATE_SHA256=$EXPECTED_UPDATE_SHA256"
          echo P04_V2812_PUBLICATION=PASS

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: P04-V2.8.12-PUBLICATION-EVIDENCE
          path: |
            ${{ runner.temp }}/p04-v2812-publish/assets/RELEASE_SHA256SUMS.txt
            ${{ runner.temp }}/p04-v2812-publish/assets/release-notes.md
            ${{ runner.temp }}/p04-v2812-publish/assets/browser-report.json
            ${{ runner.temp }}/p04-v2812-publish/assets/FINAL_GATE_SUMMARY.json
            ${{ runner.temp }}/p04-v2812-publish/assets/P04-core-updates-readback.json
            ${{ runner.temp }}/p04-v2812-publish/assets/PUBLICATION_SUMMARY.json
          if-no-files-found: warn
          retention-days: 30
