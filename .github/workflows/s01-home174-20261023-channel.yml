name: S01 exact Theme channel contract
on:
  push:
    branches: [task/s01-home174-20261023]
    paths: ['.github/workflows/s01-home174-20261023-channel.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.174
  TARGET_SHA: 79de071c0afb48c60abad6b6c5ec71cdea7a4cc5
  UPDATE_SHA: 4a7a2a19cbddf6d73092337d07a0d17ef16c87ee
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: 4a7a2a19cbddf6d73092337d07a0d17ef16c87ee
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Exact changed manifest and native protocol tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PYCHANNEL'
          import json,os
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']==os.environ['TARGET_VERSION']
          assert m['asset_sha256']=='b5c3a1e3a72635c21aaa40ab88e67d9796e44063fc58b7fc40adc8d3d9a2d45a' and m['asset_bytes']==1974083
          assert m['runtime_files']==476 and '1.35.173' in m['from_versions']
          assert m['release_tag']=='v'+os.environ['TARGET_VERSION']
          print('EXACT_CHANNEL_CONTRACT_PASS')
          PYCHANNEL
      - name: Cleanup
        if: always()
        run: rm -rf source
