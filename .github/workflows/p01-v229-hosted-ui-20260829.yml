name: P01 Hosted Topic UI Patch

on:
  push:
    branches:
      - task/p01-v229-hosted-ui-20260829

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: feature/p01-domain-taxonomy-20260829
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
      - name: Patch workspace UI
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "e06b198bb4cc544c8ce27ce736bf08985283e911"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/assets/workspace.js');s=p.read_text(encoding='utf-8')
          def once(old,new,label):
              global s
              n=s.count(old)
              assert n==1, f'{label}: {n}'
              s=s.replace(old,new,1)
          s=s.replace('封面服务返回了无效响应。','资源附件服务返回了无效响应。',1).replace('封面操作失败。','资源附件操作失败。',1)
          marker="  const kindConfig=(surface)=>({channels:['频道分类','例如：旅行生活 / 科技 / 音乐'],watch:['内容类型','例如：电影 / 剧集 / 纪录片 / 综艺 / 动漫'],topics:['专题分类','例如：学习 / 赚钱 / AI / 工具']}[surface]||['主分类','输入主分类']);"
          helper="  const syncSourceFields=(form,surface)=>{if(!form)return;const source=form.elements.namedItem('source_kind');if(source&&surface!=='topics')source.value='remote_url';const hosted=surface==='topics'&&source?.value==='hosted_html';const urlField=$('[data-url-field]',form),url=form.elements.namedItem('url');if(urlField)urlField.hidden=hosted;if(url)url.required=!hosted;const htmlField=$('[data-html-field]',form);if(htmlField)htmlField.hidden=!hosted;if(!hosted&&url&&url.value.includes('local.vf.invalid/topic/'))url.value=''};"
          once(marker,marker+'\n'+helper,'source helper')
          once("    const kind=form.elements.namedItem('resource_kind');const label=$('[data-kind-label]',form);const cfg=kindConfig(surface);if(label)label.textContent=cfg[0];if(kind)kind.placeholder=cfg[1];","    const kind=form.elements.namedItem('resource_kind');const label=$('[data-kind-label]',form);const cfg=kindConfig(surface);if(label)label.textContent=cfg[0];if(kind)kind.placeholder=cfg[1];syncSourceFields(form,surface);",'source sync')
          marker="  const removeCover=async(id)=>{const body=new FormData();body.set('action','cover_delete');body.set('id',String(id));return await postMedia(body)};"
          helper="  const uploadHtml=async(id,file)=>{if(!file)return null;if(file.size>2*1024*1024)throw new Error('HTML 文件需小于 2 MB。');if(!/\\.html?$/i.test(file.name||''))throw new Error('专题文件仅支持 .html 或 .htm。');const body=new FormData();body.set('action','html_upload');body.set('id',String(id));body.set('html',file,file.name);return await postMedia(body)};"
          once(marker,marker+'\n'+helper,'html upload helper')
          old="    const defaults=contextDefaults();addDirty=false;addForm.reset();clearCoverPreview(addForm);setField(addForm,'category_id',defaults.categoryId);setField(addForm,'surface',defaults.surface);setField(addForm,'is_private',1);fillSurfaceFields(addForm,defaults.surface);openPanel(addPanel);setTimeout(()=>addForm.elements.namedItem('url')?.focus(),30);"
          new="    const defaults=contextDefaults();addDirty=false;addForm.reset();clearCoverPreview(addForm);setField(addForm,'category_id',defaults.categoryId);setField(addForm,'surface',defaults.surface);setField(addForm,'source_kind','remote_url');setField(addForm,'is_private',1);fillSurfaceFields(addForm,defaults.surface);openPanel(addPanel);setTimeout(()=>{const target=defaults.surface==='topics'?addForm.elements.namedItem('title'):addForm.elements.namedItem('url');target?.focus()},30);"
          once(old,new,'show add')
          old="    setField(detailForm,'surface',a.surface||'start');setField(detailForm,'resource_kind',a.resource_kind||'');setField(detailForm,'surface_note',a.surface_note||'');setField(detailForm,'background_friendly',!!a.background_friendly);setField(detailForm,'media_year',a.media_year||'');setField(detailForm,'media_status',a.media_status||'');setField(detailForm,'is_private',!!a.is_private);setField(detailForm,'is_favorite',!!a.is_favorite);"
          new="    setField(detailForm,'surface',a.surface||'start');setField(detailForm,'source_kind',a.source_kind||'remote_url');setField(detailForm,'resource_kind',a.resource_kind||'');setField(detailForm,'surface_note',a.surface_note||'');setField(detailForm,'background_friendly',!!a.background_friendly);setField(detailForm,'media_year',a.media_year||'');setField(detailForm,'media_status',a.media_status||'');setField(detailForm,'is_private',!!a.is_private);setField(detailForm,'is_favorite',!!a.is_favorite);"
          once(old,new,'detail source')
          once("if(domain)domain.textContent=a.domain||'';","if(domain)domain.textContent=a.source_kind==='hosted_html'?'托管 HTML':(a.domain||'');",'detail domain')
          old="    showCoverPreview(detailForm,a.cover_url||'');fillSurfaceFields(detailForm,a.surface||'start');openPanel(drawer);"
          new="    const htmlStatus=$('[data-html-status]',detailForm);if(htmlStatus)htmlStatus.textContent=a.html_name?`当前：${a.html_name} · ${Math.max(1,Math.round(Number(a.html_bytes||0)/1024))} KB`:'';showCoverPreview(detailForm,a.cover_url||'');fillSurfaceFields(detailForm,a.surface||'start');openPanel(drawer);"
          once(old,new,'html status')
          marker="  detailForm?.elements.namedItem('surface')?.addEventListener('change',e=>fillSurfaceFields(detailForm,e.target.value));"
          extra="  addForm?.elements.namedItem('source_kind')?.addEventListener('change',()=>syncSourceFields(addForm,addForm.elements.namedItem('surface')?.value||'start'));\n  detailForm?.elements.namedItem('source_kind')?.addEventListener('change',()=>syncSourceFields(detailForm,detailForm.elements.namedItem('surface')?.value||'start'));"
          once(marker,marker+'\n'+extra,'source listeners')
          old="      const coverFile=addForm.elements.namedItem('cover')?.files?.[0]||null;const fd=new FormData(addForm);const payload=Object.fromEntries(fd.entries());delete payload.cover;payload.action='create';payload.is_private=addForm.elements.namedItem('is_private')?.checked?'1':'0';payload.is_favorite=addForm.elements.namedItem('is_favorite')?.checked?'1':'0';payload.background_friendly=addForm.elements.namedItem('background_friendly')?.checked?'1':'0';const res=await post(payload);"
          new="      const coverFile=addForm.elements.namedItem('cover')?.files?.[0]||null;const htmlFile=addForm.elements.namedItem('html')?.files?.[0]||null;const requestedSource=addForm.elements.namedItem('source_kind')?.value||'remote_url';if(requestedSource==='hosted_html'&&!htmlFile)throw new Error('请选择要上传的 HTML 文件。');const fd=new FormData(addForm);const payload=Object.fromEntries(fd.entries());delete payload.cover;delete payload.html;payload.action='create';payload.is_private=addForm.elements.namedItem('is_private')?.checked?'1':'0';payload.is_favorite=addForm.elements.namedItem('is_favorite')?.checked?'1':'0';payload.background_friendly=addForm.elements.namedItem('background_friendly')?.checked?'1':'0';const res=await post(payload);"
          once(old,new,'add payload')
          old="      if(coverFile&&!res.duplicate){try{await uploadCover(res.id,coverFile)}catch(err){toast(`资源已创建，但封面未保存：${err.message}`,'error')}}\n      else toast(res.duplicate?'已有相同资源，未重复添加。':res.message);"
          new="      let attachmentError='';if(coverFile&&!res.duplicate){try{await uploadCover(res.id,coverFile)}catch(err){attachmentError=`封面未保存：${err.message}`}}if(htmlFile&&!res.duplicate){try{await uploadHtml(res.id,htmlFile)}catch(err){attachmentError=`${attachmentError?attachmentError+'；':''}HTML 未保存：${err.message}`}}if(attachmentError)toast(`资源已创建，但${attachmentError}`,'error');else toast(res.duplicate?'已有相同资源，未重复添加。':res.message);"
          once(old,new,'add attachment upload')
          old="const keep={category_id:addForm.elements.namedItem('category_id')?.value||'',surface:addForm.elements.namedItem('surface')?.value||'start',tags:addForm.elements.namedItem('tags')?.value||'',resource_kind:addForm.elements.namedItem('resource_kind')?.value||'',media_status:addForm.elements.namedItem('media_status')?.value||'',is_private:!!addForm.elements.namedItem('is_private')?.checked,is_favorite:!!addForm.elements.namedItem('is_favorite')?.checked,background_friendly:!!addForm.elements.namedItem('background_friendly')?.checked};"
          new="const keep={category_id:addForm.elements.namedItem('category_id')?.value||'',surface:addForm.elements.namedItem('surface')?.value||'start',source_kind:addForm.elements.namedItem('source_kind')?.value||'remote_url',tags:addForm.elements.namedItem('tags')?.value||'',resource_kind:addForm.elements.namedItem('resource_kind')?.value||'',media_status:addForm.elements.namedItem('media_status')?.value||'',is_private:!!addForm.elements.namedItem('is_private')?.checked,is_favorite:!!addForm.elements.namedItem('is_favorite')?.checked,background_friendly:!!addForm.elements.namedItem('background_friendly')?.checked};"
          once(old,new,'continue source')
          old="  detailForm?.addEventListener('submit',async e=>{e.preventDefault();const btn=$('button[type=\"submit\"]',detailForm);btn.disabled=true;try{const coverFile=detailForm.elements.namedItem('cover')?.files?.[0]||null;const fd=new FormData(detailForm);const payload=Object.fromEntries(fd.entries());delete payload.cover;payload.action='save';payload.is_private=detailForm.elements.namedItem('is_private')?.checked?'1':'0';payload.is_favorite=detailForm.elements.namedItem('is_favorite')?.checked?'1':'0';payload.background_friendly=detailForm.elements.namedItem('background_friendly')?.checked?'1':'0';const res=await post(payload);if(coverFile){try{await uploadCover(payload.id,coverFile)}catch(err){toast(`修改已保存，但封面未保存：${err.message}`,'error')}}else toast(res.message);reloadSoon(520)}catch(err){toast(err.message,'error');btn.disabled=false}});"
          new="  detailForm?.addEventListener('submit',async e=>{e.preventDefault();const btn=$('button[type=\"submit\"]',detailForm);btn.disabled=true;try{const coverFile=detailForm.elements.namedItem('cover')?.files?.[0]||null;const htmlFile=detailForm.elements.namedItem('html')?.files?.[0]||null;const fd=new FormData(detailForm);const payload=Object.fromEntries(fd.entries());delete payload.cover;delete payload.html;const existing=state.assets[String(payload.id)]||{};if(payload.source_kind==='hosted_html'&&!htmlFile&&!existing.html_url)throw new Error('请选择要上传的 HTML 文件。');payload.action='save';payload.is_private=detailForm.elements.namedItem('is_private')?.checked?'1':'0';payload.is_favorite=detailForm.elements.namedItem('is_favorite')?.checked?'1':'0';payload.background_friendly=detailForm.elements.namedItem('background_friendly')?.checked?'1':'0';const res=await post(payload);let attachmentError='';if(coverFile){try{await uploadCover(payload.id,coverFile)}catch(err){attachmentError=`封面未保存：${err.message}`}}if(htmlFile&&payload.source_kind==='hosted_html'){try{await uploadHtml(payload.id,htmlFile)}catch(err){attachmentError=`${attachmentError?attachmentError+'；':''}HTML 未保存：${err.message}`}}if(attachmentError)toast(`修改已保存，但${attachmentError}`,'error');else toast(res.message);reloadSoon(520)}catch(err){toast(err.message,'error');btn.disabled=false}});"
          once(old,new,'detail upload')
          p.write_text(s,encoding='utf-8')
          PY
          node --check src/assets/workspace.js
          git diff --check
          test "$(git diff --name-only)" = "src/assets/workspace.js"
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add src/assets/workspace.js
          git commit -m 'P01 V2.29 · Add hosted HTML Topic workflow'
          git push origin HEAD:feature/p01-domain-taxonomy-20260829
          echo P01_HOSTED_TOPIC_UI_PATCH=PASS
