name: P08 R167 exact issued-downloader parser and builder gate
on:
  pull_request:
    paths:
      - .github/workflows/p08-r167-release-php-parse-temp.yml
permissions:
  contents: read
jobs:
  p08-parse-and-package-gate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: PHP 8.4 and ZIP runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip,curl,openssl,mbstring,sqlite3,pdo_mysql
          coverage: none
      - name: Transient exact P08 private source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: bc5861a587ec4d07dfe872374b482d8e3bab2c4f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p08
          persist-credentials: false
          fetch-depth: 1
      - name: Exact PHP linter and FULL plus Atomic negative regression
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p08 rev-parse HEAD)" = bc5861a587ec4d07dfe872374b482d8e3bab2c4f
          test "$(cat p08/VERSION)" = 0.1.6
          php -l p08/src/Upgrade/GitHubStableAssetDownloader.php > /dev/null
          python3 -B -m unittest discover -s p08/tests -p 'test_full_builder.py' > /dev/null
          echo 'P08_R167_FULL_BUILDER_PHP_PARSE_GATE=PASS'
          python3 -B -m unittest discover -s p08/tests -p 'test_atomic_builder.py' > /dev/null
          echo 'P08_R167_ATOMIC_BUILDER_PHP_PARSE_GATE=PASS'
          php p08/tests/test_github_stable_asset_downloader.php > /dev/null
          echo 'P08_R167_DOWNLOADER_RUNTIME_NEGATIVE_TEST=PASS'
          python3 -B -m py_compile p08/scripts/build_full.py p08/scripts/build_atomic.py
          echo 'P08_R167_EXACT_SOURCE_PHP_AND_BUILDER_TESTS=PASS'
      - name: Private source cleanup
        if: always()
        shell: bash
        run: |
          rm -rf p08
          test ! -e p08
