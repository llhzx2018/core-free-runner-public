name: P01 V2.35.3 Formal Source Bind
on:
  push:
    branches: [release/p01-v2353-formal-bind-20260831]
    paths: [.github/workflows/p01-v2353-formal-bind-20260831.yml]
permissions:
  contents: read
jobs:
  bind:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: release/v2.35.3-formal-source-20260831
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Bind Candidate PASS and safe-fast-forward develop
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          CANDIDATE=e5ca8771409062995533c10fc6de423cda275990
          EXPECTED_DEVELOP=c9ca6d6f0052bd1a0c61d07fc6b1042708e74b93
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git rev-parse origin/develop)" = "$EXPECTED_DEVELOP"
          test "$(git rev-parse origin/main)" = 3c9239be8bba34637411110f7fdb43f6e494c880
          test "$(git merge-base "$EXPECTED_DEVELOP" HEAD)" = "$EXPECTED_DEVELOP"
          test "$(cat VERSION)" = 2.35.3
          test "$(cat src/VERSION.txt)" = 2.35.3
          jq '
            .candidate_state="PASS" |
            .current_phase="V2.35.3 CANDIDATE PASS / FORMAL ARTIFACT PENDING" |
            .formal_release_state="V2.35.2 PUBLISHED / V2.35.3 FORMAL ARTIFACT PENDING" |
            .develop_state="V2.35.3 FORMAL SOURCE BIND PENDING" |
            .current_authority="Owner Production V2.35.2 / Published Latest V2.35.2 / V2.35.3 Candidate PASS" |
            .next_action="Run V2.35.3 Formal Artifact Gate on this exact formal source; only after PASS continue Strict Fresh, main promotion, publication, core-updates and remote online update gates." |
            .v2_35_3_candidate_gate={
              run:33358914290,
              result:"PASS",
              source:"e5ca8771409062995533c10fc6de423cda275990",
              tree:"e412c37bb7f6c960d9232fd63efbd008455ddd2b",
              runtime_tree:"7f181909c7ccd3179491f21cfca426008de4295f",
              artifact:9746042709,
              digest:"sha256:807dd803e4831ca8a60b860eb28699b5241bad3e870bcc3d2e3ecaf8337278e2",
              schema:"2026082901",
              migration:null,
              owner_production_write:false
            }
          ' VF_PROJECT.json > VF_PROJECT.json.tmp
          mv VF_PROJECT.json.tmp VF_PROJECT.json
          jq -e '.candidate_state=="PASS" and .v2_35_3_candidate_gate.run==33358914290 and .v2_35_3_candidate_gate.result=="PASS" and .schema_version=="2026082901"' VF_PROJECT.json >/dev/null
          test "$(git diff --name-only)" = VF_PROJECT.json
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VF_PROJECT.json
          git commit -m 'release(P01): bind V2.35.3 candidate PASS'
          FORMAL=$(git rev-parse HEAD)
          git push origin HEAD:release/v2.35.3-formal-source-20260831
          git fetch origin develop main --quiet
          test "$(git rev-parse origin/develop)" = "$EXPECTED_DEVELOP"
          test "$(git rev-parse origin/main)" = 3c9239be8bba34637411110f7fdb43f6e494c880
          test "$(git merge-base "$EXPECTED_DEVELOP" "$FORMAL")" = "$EXPECTED_DEVELOP"
          git push origin "$FORMAL":develop
          printf 'P01_V2353_FORMAL_SOURCE_BIND=PASS\nFORMAL_SOURCE=%s\nFORMAL_TREE=%s\nFORMAL_RUNTIME_TREE=%s\nOWNER_PRODUCTION_WRITE=NO\n' "$FORMAL" "$(git rev-parse HEAD^{tree})" "$(git rev-parse HEAD:src)"
