name: P07 Release5 Global Chinese Exact-source Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-release5-global-chinese-gate.yml'

permissions:
  contents: read

jobs:
  exact-source-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Verify private read capability
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN"

      - name: Checkout exact private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: e9b3d150e4f4bd9e1aeeef8c773d0d32cb984535
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Verify identity
        working-directory: source
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "e9b3d150e4f4bd9e1aeeef8c773d0d32cb984535"
          test "$(cat VERSION)" = "0.1.0"
          test "$(cat BUILD_ID)" = "0.1.0-release5"

      - name: Syntax and Python compile
        working-directory: source
        run: |
          set -Eeuo pipefail
          for f in bin/vfops bin/vfops-user bin/vfops-site-ui bin/vfops-migrate-ui bin/vfops-auto-backup bin/vfops-cloudpanel-ui bin/vfops-storage-setup lib/terminal_ui.sh lib/cloudpanel_ui_common.sh lib/cloudpanel_ui_sites.sh lib/cloudpanel_ui_ops.sh lib/cloudpanel_ui_admin.sh tests/smoke.sh; do
            bash -n "$f"
          done
          python3 - <<'PY'
          from pathlib import Path
          import py_compile
          for root in (Path("lib"), Path("tests"), Path("scripts")):
              if not root.exists(): continue
              for p in sorted(root.rglob("*.py")):
                  py_compile.compile(str(p), doraise=True)
          PY

      - name: Chinese-first ordinary surface contract
        working-directory: source
        run: |
          set -Eeuo pipefail
          grep -Fq 'P07 · 服务器运维' bin/vfops-user
          grep -Fq 'P07 · 服务器运维' bin/vfops
          grep -Fq '用法：' bin/vfops
          grep -Fq '基础交互菜单：' bin/vfops
          grep -Fq '项目：P07 · 服务器运维' bin/vfops
          grep -Fq '用法：vfops-site-ui' bin/vfops-site-ui
          grep -Fq '资源清单：' lib/cloudpanel_ui_admin.sh
          grep -Fq '网站数量：' lib/cloudpanel_ui_admin.sh
          grep -Fq 'P07 **整个项目**面向普通用户' docs/authority/RPD.md
          ! grep -Fq 'Usage:' bin/vfops
          ! grep -Fq 'ERROR: unknown command:' bin/vfops
          ! grep -Fq 'Project: P07' bin/vfops

      - name: Terminal UI and focused contracts
        working-directory: source
        run: |
          set -Eeuo pipefail
          export PYTHONPATH="$PWD/lib"
          python3 -m unittest -v             tests.test_terminal_ui_color_contract             tests.test_cli_menu             tests.test_cli_diagnostics             tests.test_user_entry             tests.test_auto_backup

      - name: Full Slot3 regressions
        working-directory: source
        run: |
          set -Eeuo pipefail
          export PYTHONPATH="$PWD/lib"
          bash tests/smoke.sh >/tmp/p07-smoke.log 2>&1
          python3 -m unittest discover -s tests -p 'test_*.py' -q

      - name: Machine and secret boundary
        working-directory: source
        run: |
          set -Eeuo pipefail
          NO_COLOR=1 bash bin/vfops-user --version | grep -Fx 'VF Server Ops 0.1.0'
          NO_COLOR=1 bash bin/vfops-user --build-id | grep -Fx '0.1.0-release5'
          ! NO_COLOR=1 bash bin/vfops-user --version | grep -q $'\033'
          python3 scripts/secret_scan.py --root . >/tmp/p07-secret-scan.log 2>&1

      - name: Result
        if: always()
        run: |
          echo "P07_RELEASE5_SOURCE=e9b3d150e4f4bd9e1aeeef8c773d0d32cb984535"
          echo "P07_PRIVATE_SOURCE_PERSISTED=NO"
          echo "P07_PRODUCTION_DESTRUCTIVE_ACTION=NOT_RUN"
