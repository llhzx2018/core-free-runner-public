name: P01 V2.47.390 exact distribution proof (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v247390-distribution-proof.yml'
permissions:
  contents: read
jobs:
  verify-distribution:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact core-updates HEAD into transient runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/core-updates
          ref: 768465779c83c6eb8bd6a27f5a6fbea0a33fce34
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false

      - name: Setup PHP and required extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, curl, zip, mbstring
          coverage: none

      - name: Exact source and all manifest contract validation
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "768465779c83c6eb8bd6a27f5a6fbea0a33fce34"
          python3 scripts/check_manifest_contract.py >/tmp/p01-manifest-audit.json
          python3 - <<'PY'
          import json
          audit=json.load(open('/tmp/p01-manifest-audit.json'))
          assert audit['status']=='PASS', audit
          assert any(row['path']=='projects/P01.json' and not row['failures'] for row in audit['results'])
          m=json.load(open('projects/P01.json',encoding='utf-8'))
          assert m['project_id']=='P01' and m['component_id']=='APP'
          assert m['current_version']=='2.47.389' and m['target_version']=='2.47.390'
          assert m['from_versions']==['2.47.389'] and m['update_type']=='ATOMIC'
          assert m['schema_from']==m['schema_to']=='2026090401'
          assert m['product_identity']=='9d2052dbef7d5cf567f05425b5905459609739b9'
          assert m['release_id']==417060131 and m['release_tag']=='v2.47.390'
          assert m['asset_name']=='VF_Start_V2.47.390_UPDATE.zip'
          assert m['asset_bytes']==2583213
          assert m['asset_sha256']=='412bc3a5c9e853342f02e136d5fe3b30ad028e2e09e5366b5544dfa86575ab63'
          assert m['backup_required'] is True and m['rollback_supported'] is True
          print('P01_DISTRIBUTION_MANIFEST_CONTRACT=PASS')
          PY

      - name: Native PHP Update Core and exact discovery allowlist
        shell: bash
        run: |
          set -Eeuo pipefail
          find update-core/php -name '*.php' -type f -print0 | xargs -0 -n1 php -l >/dev/null
          php update-core/php/tests/run.php >/tmp/p01-update-core-tests.log
          php -r '
            require "update-core/php/src/UpdateCore.php";
            $m=json_decode(file_get_contents("projects/P01.json"),true,512,JSON_THROW_ON_ERROR);
            $c=new \CoreUpdates\UpdateCore("P01","APP");
            $tests=[
              ["2.47.389","2026090401","AVAILABLE"],
              ["2.47.388","2026090401","BLOCKED_SOURCE_VERSION"],
              ["2.47.389","2026090400","BLOCKED_SCHEMA"],
              ["2.47.390","2026090401","UP_TO_DATE"],
            ];
            foreach($tests as [$version,$schema,$expected]){
              $r=$c->check($version,$schema,$m);
              if(($r["status"]??"")!==$expected){fwrite(STDERR,"Update Core result mismatch for $version/$schema\n");exit(1);}
            }
            echo "P01_V247389_TO_V247390_DISCOVERY_CONTRACT=PASS\n";
          '
          echo 'P01_UPDATE_CORE_NATIVE_REGRESSION=PASS'

      - name: Cross-check exact GitHub Release and downloaded asset bytes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          gh api repos/llhzx2018/vf-start/releases/tags/v2.47.390 > /tmp/p01-release.json
          mkdir -p "$RUNNER_TEMP/p01-asset"
          gh release download v2.47.390 -R llhzx2018/vf-start -D "$RUNNER_TEMP/p01-asset" -p VF_Start_V2.47.390_UPDATE.zip
          python3 - <<'PY'
          import json,hashlib,os,pathlib
          m=json.load(open('projects/P01.json',encoding='utf-8'))
          r=json.load(open('/tmp/p01-release.json'))
          assert r['id']==m['release_id'] and r['tag_name']==m['release_tag']
          assert not r['draft'] and not r['prerelease']
          matches=[a for a in r['assets'] if a['name']==m['asset_name']]
          assert len(matches)==1
          a=matches[0]
          assert a['size']==m['asset_bytes']
          assert a['digest']=='sha256:'+m['asset_sha256']
          f=pathlib.Path(os.environ['RUNNER_TEMP'])/'p01-asset'/m['asset_name']
          assert f.stat().st_size==m['asset_bytes']
          assert hashlib.sha256(f.read_bytes()).hexdigest()==m['asset_sha256']
          print('P01_V247390_RELEASE_ASSET_FINAL_BYTES_SHA256=PASS')
          PY
          rm -f "$RUNNER_TEMP/p01-asset/VF_Start_V2.47.390_UPDATE.zip"
          echo 'P01_V247390_PUBLIC_RUNNER_DISTRIBUTION_PROOF=PASS'
