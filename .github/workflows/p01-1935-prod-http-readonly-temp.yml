name: p01-1935-production-public-http-readonly
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-1935-prod-http-readonly-temp.yml'
permissions:
  contents: read
jobs:
  public-http-readonly:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Read-only public endpoint probe (never authenticated; never writes)
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import urllib.request,urllib.error,socket,time
          base="https://start.kewaro.com"
          headers={"User-Agent":"Mozilla/5.0 (compatible; VF-P01-PublicReadOnly/1.0)",
                   "Cache-Control":"no-cache"}
          results={}
          for path in ("/VERSION.txt","/home.php"):
              url=base+path
              request=urllib.request.Request(url,headers=headers,method="GET")
              start=time.monotonic()
              try:
                  with urllib.request.urlopen(request,timeout=12) as response:
                      code=response.status
                      typ=response.headers.get("Content-Type","").split(";")[0]
                      body=response.read(8192)
                      final=response.geturl()
                  state="OK"
              except urllib.error.HTTPError as e:
                  code=e.code
                  typ=e.headers.get("Content-Type","").split(";")[0]
                  body=b""
                  final=url
                  state="HTTP_ERROR"
              except Exception as e:
                  code=0;typ="";body=b"";final=url
                  state=type(e).__name__
              elapsed=round(time.monotonic()-start,2)
              print("P01_PROD_READONLY_ENDPOINT=%s HTTP=%s TYPE=%s SECONDS=%.2f STATE=%s"%(path,code,typ,elapsed,state),flush=True)
              results[path]=(code,body,final)
          version=results["/VERSION.txt"]
          if version[0]==200 and version[1].strip()==b"2.47.500":
              print("P01_PRODUCTION_PUBLIC_VERSION_247500=PASS",flush=True)
          elif version[0]==200:
              print("P01_PRODUCTION_PUBLIC_VERSION_247500=MISMATCH",flush=True)
              raise SystemExit(7)
          else:
              print("P01_PRODUCTION_PUBLIC_VERSION_247500=UNVERIFIED_EXTERNAL_HTTP",flush=True)
          home=results["/home.php"]
          if home[0]==200 and (b"VF Start" in home[1] or b"VF START" in home[1]):
              print("P01_PRODUCTION_GUEST_HOME_HTTP=PASS",flush=True)
          else:
              print("P01_PRODUCTION_GUEST_HOME_HTTP=UNVERIFIED_EXTERNAL_HTTP",flush=True)
          print("P01_PRODUCTION_SQLITE_INTEGRITY=NOT_TESTED",flush=True)
          print("P01_PRODUCTION_OLD_INCIDENT_JOURNAL=NOT_TESTED",flush=True)
          print("P01_PRODUCTION_FILES_INTEGRITY=NOT_TESTED",flush=True)
          print("P01_PRODUCTION_AUTHENTICATED_FUNCTIONS=NOT_TESTED",flush=True)
          print("P01_PRODUCTION_WRITE=NONE",flush=True)
          PY
