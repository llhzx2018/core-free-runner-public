name: P02 V2.5.9 Candidate Seal V2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v259-candidate-seal-v2.yml'

permissions:
  contents: read

jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require private capabilities
        env:
          READ_TOKEN: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'
          WRITE_TOKEN: '${{ secrets.VF_PRIVATE_WRITE_TOKEN }}'
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: feature/v2.5.9-scratch-tabs
          token: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'
          path: product
          fetch-depth: 0
          persist-credentials: false
      - name: Generate candidate authority
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(tr -d '\r\n' < VERSION)" = 2.5.9
          python3 - <<'PY'
          from pathlib import Path
          p=Path('CHANGELOG.md');s=p.read_text(encoding='utf-8')
          marker='# VF Library V2.5.9 · Scratch Tabs / 临时页签工作台 · Candidate · 2026-08-19'
          entry='''# VF Library V2.5.9 · Scratch Tabs / 临时页签工作台 · Candidate · 2026-08-19

- 新增 Notepad 风格“临时页签工作台”：点击“临时”后直接用 `+` 连续创建空白 TAB，不要求标题、分类或手动保存。
- 临时正文与打开/关闭状态持久化到现有私有 SQLite；浏览器刷新、重新打开或电脑重启后继续原现场。
- 输入自动保存；关闭 TAB 只进入“最近关闭”，不会删除内容，可重新打开；永久删除需要显式确认。
- “整理”可把临时页签转为正式便签或文章并选择分类，默认优先 `99 待整理`；整理成功后才移出临时工作台。
- 临时页签与正式内容分层，不污染文章/便签列表；现有编辑器模板入口保持不变。
- Scratch 状态复用现有 `system_settings` 与 SQLite 备份链，Schema 保持 2401，无 Migration。
- Candidate API/Fresh Install Run `32220473904` PASS；真实 Chrome Run `32220814612` PASS：自动保存、多 TAB、刷新恢复、关闭/重开、整理与 390px Mobile 无横向溢出。

'''
          if marker not in s:p.write_text(entry+s,encoding='utf-8')
          PY
          python3 scripts/generate-source-manifest.py
          php -l src/app/ScratchTabsService.php >/dev/null
          php -l public/scratch-action.php >/dev/null
          node --check public/assets/scratch-tabs.js
          python3 scripts/repository-gates.py
          git diff --check
          grep -q '2.5.9' SOURCE_MANIFEST.json
          echo CANDIDATE_AUTHORITY_GENERATION=PASS
      - name: Push authority files to private feature branch
        working-directory: product
        env:
          WRITE_TOKEN: '${{ secrets.VF_PRIVATE_WRITE_TOKEN }}'
        run: |
          set -Eeuo pipefail
          git config user.name 'VF Agent Runner'
          git config user.email 'actions@users.noreply.github.com'
          git add CHANGELOG.md SOURCE_MANIFEST.json SOURCE_MANIFEST.txt
          if ! git diff --cached --quiet; then git commit -m 'chore(v2.5.9): seal candidate authority'; fi
          git remote set-url origin "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/vf-library.git"
          git push origin HEAD:feature/v2.5.9-scratch-tabs
          echo "SEALED_PRODUCT_HEAD=$(git rev-parse HEAD)"
          echo P02_V259_CANDIDATE_SEAL=PASS
          echo PRODUCTION_WRITE=NO
