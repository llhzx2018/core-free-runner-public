name: P01 IA V2 R9 Resource Center exact merge proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-ia-v2-r9-resource-center-exact.yml'
permissions:
  contents: read
jobs:
  p01-r9-resource-center:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      REPO: llhzx2018/vf-start
      CANDIDATE_SHA: 92e42e60e2cc0e9020b52aeb638b5d3b8a75cdc8
      BASELINE_SHA: 16891aa19925b4b6e3cfada8e2e1f9802bbc0aac
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, mbstring, curl, zip, openssl
          coverage: none
      - name: Fetch exact private source then drop credential remote
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          for pair in "candidate refs/pull/1680/merge" "stable $BASELINE_SHA"; do
            set -- $pair
            git init -q "$1"
            git -C "$1" remote add origin "https://x-access-token:$READ_TOKEN@github.com/$REPO.git"
            git -C "$1" -c advice.detachedHead=false fetch -q --depth 1 origin "$2"
            git -C "$1" checkout -q --detach FETCH_HEAD
            if [ "$1" = candidate ]; then
              test "$(git -C "$1" rev-parse HEAD)" = "$CANDIDATE_SHA"
            else
              test "$(git -C "$1" rev-parse HEAD)" = "$BASELINE_SHA"
            fi
            git -C "$1" remote remove origin
          done
          echo P01_R9_EXACT_MERGE_SOURCE_PIN=PASS
      - name: R9 resource ownership compatibility and data-preservation contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          test "$(tr -d '\r\n ' < VERSION)" = '2.47.444'
          test "$(tr -d '\r\n ' < src/VERSION.txt)" = '2.47.444'
          for file in src/app/AdminShell.php src/app/SubsiteAdminCatalog.php src/surface-manager.php src/resources.php src/full-governance.php tests/unit/p01_ia_v2_r9_resource_center_17_task_contract.php; do
            php -l "$file" >/dev/null
          done
          node --check src/assets/admin-shell.js
          php tests/unit/p01_ia_v2_r9_resource_center_17_task_contract.php
          php tests/unit/admin_ia_v247253_contract.php
          php tests/unit/admin_plain_language_17_tasks_v247287_contract.php
          php tests/unit/admin_navigation_task_separation_contract.php
          php tests/unit/pending_entry_unification_r4_contract.php
          php tests/unit/legacy_entrypoint_convergence_r6_contract.php
          php tests/unit/pending_ai_governance_return_contract.php
          php tests/unit/resource_manager_pagination_context_contract.php
          php tests/unit/recycle_bin_safe_selection_v247291_contract.php
          php tests/unit/admin_backend_closure_contract.php
          echo P01_R9_RESOURCE_FOCUSED=PASS
      - name: Canonical regression against latest exact main
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate stable --require-zero-debt
          echo P01_R9_CANONICAL_ZERO_DEBT=PASS
      - name: Remove transient private source
        if: always()
        shell: bash
        run: |
          rm -rf candidate stable
          echo P01_R9_PRIVATE_SOURCE_CLEANUP=PASS
