name: P07 V20 CPU Benchmark Probe

on:
  push:
    branches: [experiment/p07-vps-audit-v20]
    paths: [.github/workflows/p07-v20-cpu-probe.yml]

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe OpenSSL output
        run: |
          set -u
          command -v openssl || true
          openssl version -a || true
          echo '=== EVP ==='
          timeout 8s openssl speed -seconds 1 -evp sha256 2>&1 || true
          echo '=== SHA256 ==='
          timeout 8s openssl speed -seconds 1 sha256 2>&1 || true
