name: S01-C02 1.21.962 Formal Release

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/s01-c02-121962-formal-release.yml'

permissions:
  actions: read
  contents: read

jobs:
  formal-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_REPOSITORY: llhzx2018/vf-tools-ops
      TARGET_SHA: 43db95431fea35888b2b3fc1d8eb8ec00ac66549
      TARGET_VERSION: 1.21.962
      RELEASE_TAG: v1.21.962
      ASSET_NAME: vf-tools-ops_V1.21.962.zip
      TESTED_RUN_ID: '36650728177'
      TESTED_ARTIFACT_NAME: s01-c02-v1.21.962-r13-candidate
      EXPECTED_BYTES: '3422474'
      EXPECTED_SHA256: 9aa3e29cda023757ba7ad77d72d28e4fd241324f30b0de3536f1217214f41214
      EXPECTED_RUNTIME_FILES: '962'
      EXPECTED_RUNTIME_FP: 217e476a6e1d8a10c1105111da1904092a37e7390b52e2af1b2ebe20656c7525
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}

    steps:
      - name: Verify credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN"
          test -n "$RELEASE_WRITE_TOKEN"

      - name: Checkout exact promoted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target

      - name: Verify exact tested candidate artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n' < target/VERSION)" = "$TARGET_VERSION"
          mkdir tested
          gh run download "$TESTED_RUN_ID" --repo llhzx2018/core-free-runner-public --name "$TESTED_ARTIFACT_NAME" --dir tested
          test -f "tested/FINAL_EVIDENCE.json"
          test -f "tested/$ASSET_NAME"
          jq -e --arg sha "$TARGET_SHA" --arg ver "$TARGET_VERSION" '.status=="PASS" and .candidate_sha==$sha and .candidate_version==$ver and .upgrade=="PASS" and .security=="PASS" and .r13_contract=="PASS" and .browser.result=="PASS" and .browser.blocking_errors==0 and .browser.responsive_failures==0 and .pageframe.result=="PASS"' tested/FINAL_EVIDENCE.json >/dev/null
          test "$(stat -c %s "tested/$ASSET_NAME")" = "$EXPECTED_BYTES"
          test "$(sha256sum "tested/$ASSET_NAME"|awk '{print $1}')" = "$EXPECTED_SHA256"
          unzip -tq "tested/$ASSET_NAME" >/dev/null

      - name: Create formal release
        shell: bash
        env:
          GH_TOKEN: ${{ env.RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          if gh api "repos/$TARGET_REPOSITORY/releases/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh api "repos/$TARGET_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$TARGET_SHA"
          else
            cat > release-notes.md <<'MD'
          S01-C02 · VF Tools Ops · V1.21.962

          Production Real-use R13 · Final Page Frame Authority:
          - 修复 V1.21.961 肉眼变化很小的根因：Fine Polish 早于 Structural Pagehead 加载，后者重新取得可见页头权威
          - 新增最后加载的 Page Frame Authority，明确位于 Structural Pagehead 之后
          - O01–O14 共享页头统一为 26px 标题 + 简洁页面说明，首屏紧凑进入真实任务
          - 页面与关键词地图、单页精修、内容集群与链接、技术与索引统一“摘要 + 当前任务”结构
          - 质量中心、组件与系统、备份与恢复统一状态 / 摘要 / 主动作层级
          - 专业能力、运行边界、责任边界、审计等低频信息统一为安静页尾
          - 专门浏览器 Authority Proof 已验证代表页面 Page Frame 最后加载、H1=26px、Canvas padding-top=0、无横向溢出
          - Shell / Header / Header Menu IA 保持冻结
          - 无 route / data / schema / permission / business logic / updater semantic 变化
          - Exact Candidate Gate Run: 36650728177
          - exact source: 43db95431fea35888b2b3fc1d8eb8ec00ac66549

          Production installation and OWNER visual acceptance remain separate gates.
          MD
            gh release create "$RELEASE_TAG" "tested/$ASSET_NAME" --repo "$TARGET_REPOSITORY" --target "$TARGET_SHA" --title "VF Tools Ops V1.21.962" --notes-file release-notes.md
          fi

      - name: Remote exact readback
        shell: bash
        env:
          GH_TOKEN: ${{ env.RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          JSON="$(gh api "repos/$TARGET_REPOSITORY/releases/tags/$RELEASE_TAG")"
          RID="$(jq -r '.id' <<<"$JSON")"
          AID="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.id' <<<"$JSON")"
          SIZE="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.size' <<<"$JSON")"
          PUB="$(jq -r '.published_at' <<<"$JSON")"
          TAG_SHA="$(gh api "repos/$TARGET_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          test "$TAG_SHA" = "$TARGET_SHA"
          test "$SIZE" = "$EXPECTED_BYTES"
          rm -rf readback; mkdir readback
          gh release download "$RELEASE_TAG" --repo "$TARGET_REPOSITORY" --pattern "$ASSET_NAME" --dir readback --clobber
          test "$(stat -c %s "readback/$ASSET_NAME")" = "$EXPECTED_BYTES"
          test "$(sha256sum "readback/$ASSET_NAME"|awk '{print $1}')" = "$EXPECTED_SHA256"
          echo "FORMAL_RELEASE_REMOTE_READBACK=PASS"
          echo "RELEASE_ID=$RID"
          echo "ASSET_ID=$AID"
          echo "PUBLISHED_AT=$PUB"
          echo "ASSET_BYTES=$SIZE"
          echo "ASSET_SHA256=$EXPECTED_SHA256"
          echo "RUNTIME_FILES=$EXPECTED_RUNTIME_FILES"
          echo "RUNTIME_FINGERPRINT=$EXPECTED_RUNTIME_FP"

      - name: Cleanup
        if: always()
        run: rm -rf target tested readback
