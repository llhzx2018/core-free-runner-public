name: P01 Music unified workspace usability verification (one-shot)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-music-unified-workspace-20261023.yml'
permissions:
  contents: read
jobs:
  focused-music:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout runner request only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare bounded PHP and Node test tools
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd nodejs curl python3 >/dev/null
          php -m | grep -i -F pdo_sqlite
          node --version
      - name: Fetch exact P01 Music candidate
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --depth 1 --branch feat/p01-music-unified-listening-workspace-20261023 "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" candidate
          test "$(git -C candidate rev-parse HEAD)" = a3a8c029c159540196e36cfaa6332e6ffee40420
          test "$(cat candidate/VERSION)" = 2.47.434
      - name: PHP and JavaScript syntax checks
        run: |
          set -Eeuo pipefail
          for f in music-shell.php music-home.php music-discover.php music-radio.php; do php -l "candidate/src/$f"; done
          node --check candidate/src/assets/music-dock.js
          node --check candidate/src/assets/music-shell-route.js
          node --check candidate/tests/unit/music_dock_contract.js
      - name: Run focused audio persistence and security tests
        run: |
          set -Eeuo pipefail
          cd candidate
          node tests/unit/music_dock_contract.js
          node tests/unit/music_shell_route_contract.js
          node tests/unit/music_radio_directory_contract.js
          node tests/unit/music_audius_directory_contract.js
          php tests/unit/music_security_contract.php
          echo P01_MUSIC_UNIFIED_WORKSPACE_UNIT_PASS
      - name: Real authenticated shell and child HTTP integration
        run: |
          set -Eeuo pipefail
          bash candidate/tests/integration/music_fresh_http.sh candidate
          echo P01_MUSIC_UNIFIED_WORKSPACE_HTTP_PASS
      - name: Cleanup synthetic installation
        if: always()
        run: rm -rf candidate
