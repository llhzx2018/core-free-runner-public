name: VF shared rules GOV/P01/S01/P02 exact proof (temporary)
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/vf-public-authority-20261112-proof.yml]

permissions:
  contents: read

jobs:
  shared-rule-routing:
    if: >-
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'maintenance/public-authority-gov-p01-s01-20261112'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      GOV_SHA: b72efbe5500949219e1187fbe0b3a6f446c25893
      P01_SHA: c4ecce7130f42e2b9780d965a3f15f583f75e2d8
      S01_SHA: 897518941ab9c9612f4f62f09f9c29eecc24f137
      P02_SHA: ca58235dbbac5ee32fe95cc85ac74a0f234fd4d8
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Exact GOV proposed shared checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: ${{ env.GOV_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov

      - name: Exact P01 candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.P01_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p01

      - name: Exact S01 Theme candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: ${{ env.S01_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: s01

      - name: Exact P02 existing shared-rule style
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.P02_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p02

      - name: Source identities and existing source gates
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C gov rev-parse HEAD)" = "$GOV_SHA"
          test "$(git -C p01 rev-parse HEAD)" = "$P01_SHA"
          test "$(git -C s01 rev-parse HEAD)" = "$S01_SHA"
          test "$(git -C p02 rev-parse HEAD)" = "$P02_SHA"
          echo VF_EXACT_SOURCES=PASS
          if python3 -B p01/scripts/check_p01_fullstack_contract.py --root p01 \
             > "$RUNNER_TEMP/p01-source.log" 2>&1; then
            echo P01_EXISTING_ARCHITECTURE_GUARD=PASS
          else
            echo P01_EXISTING_ARCHITECTURE_GUARD=FAIL
            exit 1
          fi
          if python3 -B s01/scripts/check_s01_static_modernization.py \
             --root s01 --phase auto > "$RUNNER_TEMP/s01-source.log" 2>&1; then
            echo S01_EXISTING_STATIC_FIRST_GUARD=PASS
          else
            echo S01_EXISTING_STATIC_FIRST_GUARD=FAIL
            exit 1
          fi

      - name: Run exact-source positive and negative tests
        shell: bash
        run: |
          set -Eeuo pipefail
          if (cd gov && python3 -B -m unittest discover \
             -s governance/public-authority/tests \
             -p test_task_delivery_contract_lint.py -v) \
             > "$RUNNER_TEMP/gov-tests.log" 2>&1; then
            echo GOV_PLAIN_REQUIRED_FIXTURE_TESTS=PASS
          else
            echo GOV_PLAIN_REQUIRED_FIXTURE_TESTS=FAIL
            exit 1
          fi
          if (cd p01 && python3 -B -m unittest discover \
             -s tests -p test_p01_public_authority_source.py -v) \
             > "$RUNNER_TEMP/p01-tests.log" 2>&1; then
            echo P01_AUTHORITY_NEGATIVE_FIXTURES=PASS
          else
            echo P01_AUTHORITY_NEGATIVE_FIXTURES=FAIL
            exit 1
          fi
          if (cd s01 && python3 -B -m unittest discover \
             -s tests/unit -p test_s01_static_modernization.py -v) \
             > "$RUNNER_TEMP/s01-tests.log" 2>&1; then
            echo S01_THEME_AUTHORITY_NEGATIVE_FIXTURES=PASS
          else
            echo S01_THEME_AUTHORITY_NEGATIVE_FIXTURES=FAIL
            exit 1
          fi

      - name: Resolve the real P02 unbolded REQUIRED matrix and prove fail-closed omission
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$RUNNER_TEMP/p02-receipt.json" "$P02_SHA" <<'PY'
          import json, sys
          receipt = {
            "schema": "vf.public-authority.task-delivery-check.v1",
            "project": "P02",
            "source": sys.argv[2],
            "project_authority": {
              "agents": "AGENTS.md",
              "current": "docs/authority/CURRENT.md",
              "acceptance": "docs/authority/RPD.md",
              "applicability": "docs/authority/PUBLIC_AUTHORITY_APPLICABILITY.md"
            },
            "acceptance_markers": ["单管理员、私人优先", "长期维护与恢复"],
            "required_domains": [
              "INSTALL", "UPGRADE", "SECURITY", "TESTING",
              "DATA_SCHEMA", "API_PROVIDER", "CRON_JOB",
              "NOTIFICATION", "OBSERVABILITY", "GIT", "UA_UI"
            ],
            "task_capabilities": ["formal_development", "source_change"],
            "delivery": {
              "profile": "web_full_zip",
              "entrypoint": "public/setup.php",
              "requires_git": False,
              "requires_manual_source_copy": False
            }
          }
          with open(sys.argv[1], "w", encoding="utf-8") as f:
              json.dump(receipt, f, ensure_ascii=False)
          PY
          python3 -B gov/governance/public-authority/tools/task_delivery_contract_lint.py \
            --phase resolve --receipt "$RUNNER_TEMP/p02-receipt.json" \
            --project-root p02 --artifact-root "$RUNNER_TEMP" \
            --public-router gov/governance/public-authority/VF_PUBLIC_AUTHORITY_APPLICABILITY_ROUTER_V1.0.json \
            > "$RUNNER_TEMP/p02-positive.log" 2>&1
          grep -q '^CONTRACT_CHECK=RULES_RESOLVED$' "$RUNNER_TEMP/p02-positive.log"
          echo P02_REAL_PLAIN_REQUIRED_RULES_RESOLVED=PASS

          python3 - "$RUNNER_TEMP/p02-receipt.json" "$RUNNER_TEMP/p02-negative.json" <<'PY'
          import json,sys
          with open(sys.argv[1], encoding="utf-8") as f:
              doc = json.load(f)
          doc["required_domains"].remove("NOTIFICATION")
          with open(sys.argv[2], "w", encoding="utf-8") as f:
              json.dump(doc, f, ensure_ascii=False)
          PY
          if python3 -B gov/governance/public-authority/tools/task_delivery_contract_lint.py \
            --phase resolve --receipt "$RUNNER_TEMP/p02-negative.json" \
            --project-root p02 --artifact-root "$RUNNER_TEMP" \
            --public-router gov/governance/public-authority/VF_PUBLIC_AUTHORITY_APPLICABILITY_ROUTER_V1.0.json \
            > "$RUNNER_TEMP/p02-negative.log" 2>&1; then
            echo P02_MISSING_REQUIRED_NOTIFICATIONS=UNSAFE
            exit 1
          fi
          grep -q '^CONTRACT_REASON=PROJECT_REQUIRED_DOMAIN_OMITTED$' "$RUNNER_TEMP/p02-negative.log"
          echo P02_REQUIRED_OMISSION_NEGATIVE=PASS
          echo VF_RULES_ONLY_NOT_RELEASE_OR_PRODUCTION=YES

      - name: Remove transient private source and logs
        if: always()
        shell: bash
        run: |
          rm -rf gov p01 s01 p02
          rm -f "$RUNNER_TEMP"/{p01-source,s01-source,gov-tests,p01-tests,s01-tests,p02-positive,p02-negative}.log
          rm -f "$RUNNER_TEMP"/{p02-receipt,p02-negative}.json
          echo VF_TRANSIENT_PRIVATE_SOURCE_CLEANUP=ATTEMPTED
