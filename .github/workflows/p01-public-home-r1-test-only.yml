name: P01 Public Home R1 exact source test-only
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-public-home-r1-test-only.yml'
permissions:
  contents: read
jobs:
  frontend-home:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout runner scope
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact private product checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: d2e85dec4787ee415c42dcef9d904511f30f9073
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Prepare PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,curl,zip,mbstring
          coverage: none
      - name: Exact identity and focused public/owner home tests
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "d2e85dec4787ee415c42dcef9d904511f30f9073"
          php -l product/src/index.php
          php -l product/src/app/FunctionalHome.php
          for testfile in \
            public_home_visitor_discovery_v247390_contract.php \
            public_brand_route_contract.php \
            frontend_home_navigation_r2_contract.php \
            frontend_home_portal_contract.php \
            home_page_full_polish_contract.php \
            full_product_public_shared_rhythm_r1_contract.php \
            frontend_global_shell_r1_contract.php; do
            php "product/tests/unit/$testfile"
          done
          python3 - <<'PY'
          from pathlib import Path
          css=Path("product/src/assets/uxui-home-root.css").read_text()
          assert css.count("{")==css.count("}")
          for selector in (".vf-public-home-discover{",".vf-public-home-paths{",
                           ".vf-public-home-path:focus-visible","@media(max-width:600px)",
                           "@media(prefers-reduced-motion:reduce)"):
              assert selector in css,selector
          print("P01_PUBLIC_HOME_CSS_RESPONSIVE=PASS")
          PY
          echo P01_PUBLIC_HOME_EXACT_SOURCE_TEST=PASS
      - name: Remove transient source
        if: always()
        shell: bash
        run: rm -rf product
