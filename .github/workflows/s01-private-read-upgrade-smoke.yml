name: S01 Final Live Upgrade Smoke

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  upgrade-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Checkout carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify repaired private-read token
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${VF_PRIVATE_READ_TOKEN:-}"
          for repo in core-updates vf-tools-theme vf-tools-ops vf-tools-m3u8; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $VF_PRIVATE_READ_TOKEN" "https://api.github.com/repos/llhzx2018/$repo" || true)"
            echo "CHECK $repo HTTP $code"
            test "$code" = "200"
          done
          echo PRIVATE_READ_TOKEN=PASS

      - name: Read live distribution manifests
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/manifests
          for c in S01-C01 S01-C02 S01-C03; do
            curl -fsSL -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $VF_PRIVATE_READ_TOKEN" "https://api.github.com/repos/llhzx2018/core-updates/contents/projects/$c.json?ref=main" | jq -r '.content' | tr -d '\n' | base64 -d > "/tmp/manifests/$c.json"
          done
          test "$(jq -r '.target_version' /tmp/manifests/S01-C01.json)" = "1.35.26"
          test "$(jq -r '.target_version' /tmp/manifests/S01-C02.json)" = "1.21.872"
          test "$(jq -r '.target_version' /tmp/manifests/S01-C03.json)" = "1.25.32"
          jq -e '.from_versions | index("1.35.24") != null' /tmp/manifests/S01-C01.json >/dev/null
          jq -e '.from_versions | index("1.21.871") != null' /tmp/manifests/S01-C02.json >/dev/null
          jq -e '.from_versions | index("1.25.31") != null' /tmp/manifests/S01-C03.json >/dev/null
          echo LIVE_MANIFESTS=PASS

      - name: Download and verify all live update assets
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/assets
          verify() {
            manifest="$1"; root="$2"; identity="$3"; needle="$4"
            repo="$(jq -r '.repository' "$manifest")"
            tag="$(jq -r '.release_tag' "$manifest")"
            asset="$(jq -r '.asset_name' "$manifest")"
            bytes="$(jq -r '.asset_bytes' "$manifest")"
            sha="$(jq -r '.asset_sha256' "$manifest")"
            curl -fsSL -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $VF_PRIVATE_READ_TOKEN" "https://api.github.com/repos/$repo/releases/tags/$tag" > /tmp/release.json
            aid="$(jq -r --arg n "$asset" '.assets[] | select(.name==$n) | .id' /tmp/release.json | head -n1)"
            test -n "$aid" && test "$aid" != null
            curl -fsSL -L -H 'Accept: application/octet-stream' -H "Authorization: Bearer $VF_PRIVATE_READ_TOKEN" "https://api.github.com/repos/$repo/releases/assets/$aid" -o "/tmp/assets/$asset"
            test "$(stat -c '%s' "/tmp/assets/$asset")" = "$bytes"
            test "$(sha256sum "/tmp/assets/$asset" | awk '{print $1}')" = "$sha"
            unzip -tq "/tmp/assets/$asset" >/dev/null
            test "$(unzip -Z1 "/tmp/assets/$asset" | cut -d/ -f1 | sort -u)" = "$root"
            unzip -p "/tmp/assets/$asset" "$identity" | grep -Fq "$needle"
            echo "PASS $asset"
          }
          verify /tmp/manifests/S01-C01.json vf-tools-theme vf-tools-theme/style.css 'Version: 1.35.26'
          verify /tmp/manifests/S01-C02.json vf-ops vf-ops/vf-ops.php 'Version: 1.21.872'
          verify /tmp/manifests/S01-C03.json vf-tool-m3u8 vf-tool-m3u8/vf-tool-m3u8.php 'Version: 1.25.32'
          echo ALL_LIVE_UPDATE_ASSETS=PASS

      - name: Final result
        shell: bash
        run: |
          echo PASS_S01_FINAL_LIVE_UPGRADE_ACQUISITION
          echo "Validated live manifest discovery and authenticated release-asset acquisition; Production WordPress installation is not claimed."
