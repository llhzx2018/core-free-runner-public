name: S01 C02 C03 Distribution Gate

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  distribution-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      CORE_SHA: f31dfdee345e0c3785d1047bc960e1b7fe7eb037
      BASE_SHA: 525e6dbf11355714b00ce7c39bd4c94288792382
    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: f31dfdee345e0c3785d1047bc960e1b7fe7eb037
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: core-updates
          persist-credentials: false

      - name: Exact distribution scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${VF_RELEASE_WRITE_TOKEN:-}"
          test -n "${VF_PRIVATE_READ_TOKEN:-}"
          test "$(git -C core-updates rev-parse HEAD)" = "$CORE_SHA"
          actual="$(git -C core-updates diff --name-only "$BASE_SHA" "$CORE_SHA" | sort)"
          expected="$(printf '%s\n' projects/S01-C02.json projects/S01-C03.json | sort)"
          test "$actual" = "$expected"
          echo DISTRIBUTION_SCOPE=PASS

      - name: Manifest identity and upgrade eligibility
        shell: bash
        run: |
          set -Eeuo pipefail
          cd core-updates
          jq -e '.target_version=="1.35.26"' projects/S01-C01.json >/dev/null
          jq -e '.target_version=="1.21.872" and .release_tag=="v1.21.872" and .asset_name=="vf-tools-ops_V1.21.872.zip" and .asset_bytes==3413910 and .asset_sha256=="100f538a7fb180e003098f3a2f282509bc228af507a50272bb3d2b13ef1cbe1e" and .runtime_files==950 and .runtime_fingerprint=="5052cdca708104b212e56f153f05175c8a02684526031a1c2fb6df7b2b57704a" and .physical_locator=="vf-ops/vf-ops.php" and .locator_cutover==false and .schema_from=="6.0.0" and .schema_to=="6.0.0"' projects/S01-C02.json >/dev/null
          jq -e '.from_versions | index("1.21.871") != null and index("1.21.861") == null' projects/S01-C02.json >/dev/null
          jq -e '.target_version=="1.25.32" and .release_tag=="v1.25.32" and .asset_name=="vf-tools-m3u8_V1.25.32.zip" and .asset_bytes==3586839 and .asset_sha256=="8925f950bdd6d7624601053eb40e2fc426d980292a5ebbf07914b8403a3c1fa6" and .runtime_files==560 and .runtime_fingerprint=="d66c78cf51c7bd74b61024e7ac440417b9d8833b09fcdf39ffd55c0926951db8" and .physical_locator=="vf-tool-m3u8/vf-tool-m3u8.php" and .locator_cutover==false and .schema_from=="1.3.0" and .schema_to=="1.3.0"' projects/S01-C03.json >/dev/null
          jq -e '.from_versions | index("1.25.31") != null' projects/S01-C03.json >/dev/null
          grep -Fq 'migration remains CLOSED' projects/S01-C03.json
          echo MANIFEST_IDENTITY=PASS

      - name: Core update contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd core-updates
          python3 scripts/check_manifest_contract.py
          php update-core/php/tests/run.php
          find update-core/php -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          echo CORE_UPDATE_CONTRACTS=PASS

      - name: Verify published assets with private-read token
        shell: bash
        run: |
          set -Eeuo pipefail
          cd core-updates
          mkdir -p /tmp/s01-assets
          verify_asset() {
            manifest="$1"
            root="$2"
            identity="$3"
            needle="$4"
            repo="$(jq -r '.repository' "$manifest")"
            tag="$(jq -r '.release_tag' "$manifest")"
            asset="$(jq -r '.asset_name' "$manifest")"
            bytes="$(jq -r '.asset_bytes' "$manifest")"
            sha="$(jq -r '.asset_sha256' "$manifest")"
            curl -fsSL -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $VF_PRIVATE_READ_TOKEN" "https://api.github.com/repos/$repo/releases/tags/$tag" > /tmp/release.json
            aid="$(jq -r --arg n "$asset" '.assets[] | select(.name==$n) | .id' /tmp/release.json | head -n1)"
            test -n "$aid" && test "$aid" != null
            curl -fsSL -L -H 'Accept: application/octet-stream' -H "Authorization: Bearer $VF_PRIVATE_READ_TOKEN" "https://api.github.com/repos/$repo/releases/assets/$aid" -o "/tmp/s01-assets/$asset"
            test "$(stat -c '%s' "/tmp/s01-assets/$asset")" = "$bytes"
            test "$(sha256sum "/tmp/s01-assets/$asset" | awk '{print $1}')" = "$sha"
            unzip -tq "/tmp/s01-assets/$asset" >/dev/null
            test "$(unzip -Z1 "/tmp/s01-assets/$asset" | cut -d/ -f1 | sort -u)" = "$root"
            unzip -p "/tmp/s01-assets/$asset" "$identity" | grep -Fq "$needle"
          }
          verify_asset projects/S01-C02.json vf-ops vf-ops/vf-ops.php 'Version: 1.21.872'
          verify_asset projects/S01-C03.json vf-tool-m3u8 vf-tool-m3u8/vf-tool-m3u8.php 'Version: 1.25.32'
          echo PRIVATE_READ_NEW_RELEASE_ASSETS=PASS

      - name: Secret fence and result
        shell: bash
        run: |
          set -Eeuo pipefail
          ! git -C core-updates diff "$BASE_SHA" "$CORE_SHA" -- projects/S01-C02.json projects/S01-C03.json | grep -E '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)'
          echo PASS_S01_C02_C03_DISTRIBUTION_GATE
