name: P01 V2.22.1 Hotfix Source Patch

on:
  push:
    branches:
      - task/p01-v222-multi-surface-gate-20260828
    paths:
      - '.github/workflows/p01-v221-hotfix-source-patch-20260828.yml'

permissions:
  contents: read

env:
  PRODUCT_REPO: llhzx2018/vf-start
  PRODUCT_BRANCH: hotfix/p01-v2.22.1-online-updater-20260828
  VERSION: 2.22.1

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout P01 hotfix branch with write token
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.PRODUCT_REPO }}
          ref: ${{ env.PRODUCT_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 1
          persist-credentials: true

      - name: Apply exact bootstrap version-only patch
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "$VERSION"
          test "$(tr -d '\r\n' < src/VERSION.txt)" = "$VERSION"
          grep -Fxq "define('VF_VERSION', '2.22.0');" src/app/bootstrap.php
          BEFORE_LINES="$(wc -l < src/app/bootstrap.php)"
          BEFORE_BYTES="$(stat -c %s src/app/bootstrap.php)"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/bootstrap.php')
          s=p.read_text(encoding='utf-8')
          old="define('VF_VERSION', '2.22.0');"
          new="define('VF_VERSION', '2.22.1');"
          if s.count(old) != 1:
              raise SystemExit('bootstrap version anchor mismatch')
          p.write_text(s.replace(old,new,1),encoding='utf-8',newline='\n')
          PY
          test "$(wc -l < src/app/bootstrap.php)" = "$BEFORE_LINES"
          AFTER_BYTES="$(stat -c %s src/app/bootstrap.php)"
          test "$AFTER_BYTES" -ge "$((BEFORE_BYTES-8))"
          test "$AFTER_BYTES" -le "$((BEFORE_BYTES+8))"
          grep -Fxq "define('VF_VERSION', '2.22.1');" src/app/bootstrap.php
          php -l src/app/bootstrap.php
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = 'src/app/bootstrap.php'
          echo P01_V221_BOOTSTRAP_PATCH=PASS

      - name: Commit exact patch to hotfix branch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add src/app/bootstrap.php
          git commit -m 'hotfix(P01): align bootstrap runtime version to V2.22.1'
          git push origin HEAD:"$PRODUCT_BRANCH"
          echo P01_V221_SOURCE_PATCH_PUSH=PASS
