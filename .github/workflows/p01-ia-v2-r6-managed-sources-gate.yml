name: P01 IA V2 R6 source-managed frontstage/backstage gate
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-ia-v2-r6-managed-sources-gate.yml'
permissions:
  contents: read
jobs:
  p01-r6-source-gate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REPO: llhzx2018/vf-start
      CANDIDATE_SHA: 8032b433522f89bd5741e87180fcf7fa47d70df2
      BASELINE_SHA: f7478c40e97fb8bd1562f6631061aa7f06fa89cd
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, mbstring, curl, zip, openssl
          coverage: none
      - name: Transient exact private source checkout
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          for pair in "candidate $CANDIDATE_SHA" "stable $BASELINE_SHA"; do
            set -- $pair
            git init -q "$1"
            git -C "$1" remote add origin "https://x-access-token:$READ_TOKEN@github.com/$REPO.git"
            git -C "$1" -c advice.detachedHead=false fetch -q --depth 1 origin "$2"
            git -C "$1" checkout -q --detach FETCH_HEAD
            test "$(git -C "$1" rev-parse HEAD)" = "$2"
            git -C "$1" remote remove origin
          done
          echo P01_R6_EXACT_PRIVATE_SOURCE_PIN=PASS
      - name: R6 PHP syntax, source boundary and synthetic HTTP
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          test "$(tr -d '\r\n ' < VERSION)" = '2.47.444'
          test "$(tr -d '\r\n ' < src/VERSION.txt)" = '2.47.444'
          for file in src/gov-topic-manager.php src/gov-book-manager.php src/gov-topic-sync.php src/gov-book-sync.php src/app/TopicLibraryPage.php src/app/CourseLibraryPage.php src/app/SubsiteAdminCatalog.php tests/unit/p01_ia_v2_r6_sources_contract.php; do
            php -l "$file"
          done
          php tests/unit/p01_ia_v2_r6_sources_contract.php
          bash tests/integration/p01_ia_v2_r6_sources_http_roundtrip.sh .
          echo P01_R6_SOURCE_AUTH_CSRF_FRONTSTAGE_BACKSTAGE=PASS
      - name: R6 canonical zero-debt regression vs exact merged base
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate stable --require-zero-debt
          echo P01_R6_CANONICAL_ZERO_DEBT=PASS
      - name: Cleanup private source
        if: always()
        shell: bash
        run: |
          rm -rf candidate stable
          echo P01_R6_PRIVATE_SOURCE_CLEANUP=PASS
