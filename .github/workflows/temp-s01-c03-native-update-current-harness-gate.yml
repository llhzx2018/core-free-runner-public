name: TEMP S01-C03 Native Update Current Harness Gate

on:
  push:
    branches:
      - temp/s01-release-prep-gate-20260902
    paths:
      - '.github/workflows/temp-s01-c03-native-update-current-harness-gate.yml'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PRODUCT_SHA: 4f516d48cadd93b7143f201f196d923ad112f34a
      BASE_SHA: 595f5b65ee1eb4ad75ed3a880a733e1f765060ed
      VF_UPDATE_EVIDENCE_DIR: ${{ github.workspace }}/evidence/wp-update-current-formal
    steps:
      - name: Checkout exact current-harness Candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: ${{ env.PRODUCT_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: product
          persist-credentials: false
          fetch-depth: 4

      - name: Assert exact Candidate identity and test-only scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git -C product rev-parse HEAD~3)" = "$BASE_SHA"
          mapfile -t files < <(git -C product diff --name-only "$BASE_SHA" "$PRODUCT_SHA")
          test "${#files[@]}" -eq 3
          printf '%s\n' "${files[@]}" | sort > /tmp/files.txt
          cat >/tmp/expected.txt <<'EOF'
          tests/wp-update/build_packages_current.py
          tests/wp-update/run_current.sh
          tests/wp-update/wp_fixture_current.php
          EOF
          diff -u /tmp/expected.txt /tmp/files.txt
          test -z "$(git -C product diff --name-only "$BASE_SHA" "$PRODUCT_SHA" -- src)"
          echo 'CURRENT_HARNESS_SCOPE=PASS'

      - name: Run formal current Native Update E2E
        shell: bash
        env:
          GITHUB_WORKSPACE_PRIVATE: ${{ github.workspace }}/product
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          RUNNER_TEMP: ${{ runner.temp }}
          PRODUCT_SHA: ${{ env.PRODUCT_SHA }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$VF_UPDATE_EVIDENCE_DIR"
          bash product/tests/wp-update/run_current.sh

      - name: Seal formal current harness result
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$VF_UPDATE_EVIDENCE_DIR"
          {
            echo "S01_C03_NATIVE_UPDATE_CURRENT_HARNESS_GATE=${{ job.status }}"
            echo "BASE_SHA=$BASE_SHA"
            echo "PRODUCT_SHA=$PRODUCT_SHA"
            echo 'SOURCE_VERSION=1.25.6'
            echo 'TARGET_FIXTURE=1.25.7'
            echo 'PROVIDER_SCHEMA=1.3.0'
            echo 'WORDPRESS=7.1'
            echo 'MARIADB=11.4'
            echo 'PRODUCTION_WRITE=NO'
          } > "$VF_UPDATE_EVIDENCE_DIR/GATE_SEAL.txt"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s01-c03-native-update-current-harness-gate-${{ github.run_id }}
          path: evidence/wp-update-current-formal/
          if-no-files-found: error
          retention-days: 7
