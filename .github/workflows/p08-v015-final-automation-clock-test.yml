name: P08 v015 final acceptance automation clock fixture regression
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p08-v015-final-automation-clock-test.yml
      - lanes/p08-v015-automation-clock-20261121.json
permissions:
  contents: read
jobs:
  p08-automation-final:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-v015-automation-clock-20261121' && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_REPO: llhzx2018/vf-adops
      TARGET_VERSION: '0.1.15'
      TARGET_SHA: ffc87a80496cc12900e2d3e4b58d359c699d2e79
      TARGET_TREE: a1f72fceb9b57d5a1deb186018e161372820286c
      P08_ISOLATED_INSTALL_TEST: 'YES'
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout temporary public-safe Runner harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Audit source-bound ephemeral lane
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B runner/scripts/ephemeral_lane_spec.py validate --spec runner/lanes/p08-v015-automation-clock-20261121.json
          python3 -B runner/scripts/ephemeral_lane_spec.py audit-rendered --spec runner/lanes/p08-v015-automation-clock-20261121.json --input runner/.github/workflows/p08-v015-final-automation-clock-test.yml
      - name: Checkout private test-only P08 branch to temporary workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: ffc87a80496cc12900e2d3e4b58d359c699d2e79
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 2
          persist-credentials: false
          path: target
      - name: Install isolated PHP 8.4 + Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip,curl,mbstring,pdo_sqlite,sqlite3,pdo_mysql,openssl,posix,dom,intl,fileinfo,gd
          tools: composer:v2
          coverage: none
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exactly one synthetic test changed from already issued v015
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse 'HEAD^{tree}')" = "$TARGET_TREE"
          test "$(git -C target rev-parse HEAD^)" = '369fcb0aa8fef71b0a2b79c2b7a6c473d2527c3e'
          test "$(git -C target diff --name-only HEAD^ HEAD)" = 'tests/Feature/AutomationRuleWorkflowTest.php'
          test "$(cat target/VERSION)" = '0.1.15'
          test "$APP_URL" = 'http://localhost'
          echo P08_V015_TEST_ONLY_NO_RELEASED_RUNTIME_CODE_CHANGED=PASS
      - name: Install exact Composer and npm lock dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p target/storage/framework/cache/data target/storage/framework/sessions target/storage/framework/views target/storage/logs target/bootstrap/cache
          composer --working-dir=target install --no-scripts --no-interaction --no-progress --prefer-dist --optimize-autoloader
          npm ci --prefix target --ignore-scripts --no-audit --no-fund
          npm run build --prefix target
          test -s target/public/build/manifest.json
          echo P08_V015_SYNTHETIC_LARAVEL_INERTIA_VITE_ASSETS=PASS
      - name: Repeat exact formerly failing v015 automation daily cap case
        shell: bash
        run: |
          set -Eeuo pipefail
          cd target
          php -l tests/Feature/AutomationRuleWorkflowTest.php
          php vendor/bin/phpunit --no-configuration --bootstrap vendor/autoload.php --colors=never --filter daily_limit_and_cooldown_use_same_day_fixtures_without_provider_writes tests/Feature/AutomationRuleWorkflowTest.php
          echo P08_V015_CLOCK_FIXTURE_DAILY_LIMIT_COOLDOWN=PASS
      - name: Execute all applicable v015 PHP business feature cases
        shell: bash
        run: |
          set -Eeuo pipefail
          cd target
          # R102 tests and one legacy automation case assert VERSION=0.1.2.
          # These v0.1.2-specific tests are NOT claimed as v015 pass.
          php vendor/bin/phpunit --no-configuration --bootstrap vendor/autoload.php --colors=never --filter '/^(?!.*(?:R102AdditiveSchemaPlanTest|owner_explicitly_enables_and_previews_saved_popads_without_ad_writes)).*$/' tests/Feature
          echo P08_V015_CURRENT_BUSINESS_FEATURE_53_CASES=PASS
          echo P08_V015_LEGACY_V012_PINNED_TESTS=NOT_APPLICABLE_NOT_PASS
      - name: Repeat core PHP + Vue TS and Unit acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          cd target
          php tests/run.php
          npm run typecheck
          npm run test:unit
          echo P08_V015_TEST_ONLY_FINAL_ACCEPTANCE_CORE_AND_UNIT=PASS
      - name: Dispose private source test fixtures and any local logs
        if: always()
        shell: bash
        run: |
          rm -rf -- target runner
          test ! -e target && test ! -e runner
          echo P08_V015_TEMPORARY_RUNNER_PRIVATE_CLEANUP=PASS
