name: S01 embed channel verification
on:
  push:
    branches: [task/s01-embed-recheck-20261031]
    paths: ['.github/workflows/s01-embed-channel-proof-20261031.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: e157675cc3b8c3d5c4b9daec00a67eeff7cb5bb9
          persist-credentials: false
          path: channel
      - name: Verify channel manifest and exact remote packages
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p assets
          gh release download v1.35.221 --repo llhzx2018/vf-tools-theme --pattern vf-tools-theme_V1.35.221.zip --dir assets
          gh release download v1.25.97 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.97.zip --dir assets
          python3 - <<'PY'
          import json,zipfile,hashlib,pathlib
          for component,prev,version in [('S01-C01','1.35.220','1.35.221'),('S01-C03','1.25.96','1.25.97')]:
              p=json.loads((pathlib.Path('channel/projects')/(component+'.json')).read_text())
              assert p['target_version']==version and prev in p['from_versions']
              data=(pathlib.Path('assets')/p['asset_name']).read_bytes()
              assert len(data)==p['asset_bytes'] and hashlib.sha256(data).hexdigest()==p['asset_sha256']
              with zipfile.ZipFile(pathlib.Path('assets')/p['asset_name']) as z:
                  assert z.testzip() is None
                  if component=='S01-C01':
                      assert sum(not i.is_dir() for i in z.infolist())==p['runtime_files']
                      assert b'Version: 1.35.221' in z.read('vf-tools-theme/style.css')
                  else:
                      rows=[]
                      def included(r):
                          parts=r.split('/'); low=[x.lower() for x in parts]; b=parts[-1].lower()
                          if any(x in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in low): return False
                          if b in {'readme.md','changelog.md','license','license.txt','package_profile.json'} or b.endswith(('.sql','.sqlite','.sqlite3','.db','.log','.zip','.tar','.gz','.bak','.tmp')): return False
                          return r in {'vf-tool-m3u8.php','uninstall.php','plugin-manifest.json','tool-settings.schema.json'} if len(parts)==1 else parts[0] in {'admin','config','includes','public','templates','tools'}
                      for n in z.namelist():
                          assert n.startswith('vf-tool-m3u8/')
                          rel=n[len('vf-tool-m3u8/'):]
                          if not n.endswith('/') and included(rel): rows.append((rel,hashlib.sha256(z.read(n)).hexdigest()))
                      rows.sort(); digest=hashlib.sha256(''.join(f'{n}\\0{v}\\n' for n,v in rows).encode()).hexdigest()
                      assert len(rows)==p['runtime_files']==p['runtime_file_count']
                      assert digest==p['runtime_fingerprint']==p['runtime_fingerprint_sha256']
              print(component,version,'CHANNEL_ASSET_PASS')
          PY
