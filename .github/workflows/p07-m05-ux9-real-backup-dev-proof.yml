# One-shot synthetic test for PR366 ONLY, close without merge.
# Real immutable public M03 release ZIPs, sandbox paths, no real VPS or data.
name: P07 M05 UX9 real M03 previous backup guard PR366 development proof
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/p07-m05-ux9-real-backup-dev-proof.yml]
permissions:
  contents: read
jobs:
  ux9-real-layout:
    if: github.repository == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NO_COLOR: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PRODUCT_SHA: 1a7ca7b7635ea99f156f4f6df6267ed28069c27c
      EXPECTED_BUILD: 0.1.0-m05-ux9-real-backup-identity
    steps:
      - name: Checkout public official M03 installer wrappers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout pinned exact product PR366 source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 1a7ca7b7635ea99f156f4f6df6267ed28069c27c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Run new regression negative tests and root mixed-uid fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(grep -E '^BUILD_ID = ' product/scripts/build_p07_m05_bundle.py)" = "BUILD_ID = \"$EXPECTED_BUILD\""
          python3 -B -m unittest discover -s product/tests -p 'test_p07_m05_dirty_host_guard.py' -q
          sudo -n env PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s product/tests -p 'test_p07_m05_dirty_host_guard.py' -q
          python3 -B -m unittest discover -s product/tests -p 'test_p07_m05_host_write_gate.py' -q
          python3 -B -m unittest discover -s product/tests -p 'test_p07_m05_isolated_module.py' -q
          python3 -B product/scripts/check_p07_modules.py
          python3 -B product/scripts/check_p07_terminal_ux.py
          echo P07_M05_UX9_SYNTHETIC_AND_MIXED_UID_NEGATIVES=PASS
      - name: Create actual isolated M03 release139 predecessor and release140 current through official public installers
        shell: bash
        run: |
          set -Eeuo pipefail
          p="$RUNNER_TEMP/p07-real-m03-sandbox"
          mkdir -p "$p"
          export P07_ALLOW_NONROOT=1 P07_NO_EXEC=1
          export P07_INSTALL_DIR="$p/vf-server-ops"
          export P07_PREVIOUS_DIR="$p/vf-server-ops.previous"
          export P07_BIN_LINK="$p/vfops"
          bash installers/p07-m03-release139-atomic.sh install > "$p/old-install.log"
          bash installers/p07-m03-release140-atomic.sh install > "$p/new-install.log"
          test "$(cat "$P07_PREVIOUS_DIR/BUILD_ID")" = 0.1.0-release139
          test "$(cat "$P07_INSTALL_DIR/BUILD_ID")" = 0.1.0-release140
          PYTHONPATH=product/lib python3 -B - "$P07_PREVIOUS_DIR" "$P07_INSTALL_DIR" <<'PY'
          import os, pathlib, sys
          from m05_toolbox_backup_guard import verified_p07_toolbox_backup
          prev,cur=map(pathlib.Path,sys.argv[1:])
          print('P07_REAL_M03_139_140_MANIFEST_BYTES=',prev.joinpath('.runtime-manifest.gitblob').stat().st_size,cur.joinpath('.runtime-manifest.gitblob').stat().st_size)
          assert prev.joinpath('.runtime-manifest.gitblob').stat().st_size>4096
          assert cur.joinpath('.runtime-manifest.gitblob').stat().st_size>4096
          from m05_toolbox_backup_guard import (
              REQUIRED_DIRS,REQUIRED_FILES,MANIFEST_ROW,_safe_meta,_verify_runtime_manifest)
          import hashlib,stat
          for x in (prev,cur):
              uid=x.lstat().st_uid
              print('BACKUP_TOP_LEVEL',x.name,[(e.name,e.lstat().st_uid,oct(e.lstat().st_mode & 0o777)) for e in x.iterdir()])
              print('TOP_LEVEL_MATCH',set(z.name for z in x.iterdir())==REQUIRED_DIRS|REQUIRED_FILES)
              for name in sorted(REQUIRED_DIRS|REQUIRED_FILES):
                  print('REQUIRED_META',x.name,name,_safe_meta(x/name,directory=name in REQUIRED_DIRS,owner_uid=uid))
              rows=(x/'.runtime-manifest.gitblob').read_text().splitlines()
              print('MANIFEST_LINES',len(rows),'ROW_MATCHES',sum(bool(MANIFEST_ROW.fullmatch(q)) for q in rows))
              print('BAD_MANIFEST_ROWS', [repr(q[:150]) for q in rows if not MANIFEST_ROW.fullmatch(q)])
              print('MANIFEST_VALID',_verify_runtime_manifest(x,uid))
              if not _verify_runtime_manifest(x,uid):
                  for line in rows:
                      m=MANIFEST_ROW.fullmatch(line)
                      if not m:
                          print('FIRST_BAD_MANIFEST_ROW',repr(line[:120]));break
                      sha,name=m.groups()
                      p=x/name
                      try:
                          info=p.lstat()
                          if not _safe_meta(p,directory=False,owner_uid=uid):
                              print('FIRST_BAD_FILE_META',name,oct(info.st_mode & 0o777),info.st_uid);break
                          data=p.read_bytes()
                          actual=hashlib.sha1(b'blob '+str(len(data)).encode()+bytes([0])+data).hexdigest()
                          if actual!=sha or len(data)==0:
                              print('FIRST_BAD_FILE_HASH_SIZE',name,'size',len(data),'expected',sha,'actual',actual);break
                      except Exception as exc:
                          print('FIRST_BAD_FILE_EXCEPTION',name,type(exc).__name__);break
          assert verified_p07_toolbox_backup(str(prev),str(cur)), 'REAL_PREVIOUS_NOT_RECOGNIZED'
          p=prev/'lib'/'m05_toolbox_backup_guard.py'
          # The previous M03 packages are allowed to differ; check accidental
          # modification to the actual owner-origin manifest is always denied.
          manifest=prev/'.runtime-manifest.gitblob'
          valid=manifest.read_bytes()
          try:
              manifest.write_bytes((b'f' if valid[0:1]!=b'f' else b'0')+valid[1:])
              assert not verified_p07_toolbox_backup(str(prev),str(cur))
          finally:
              manifest.write_bytes(valid)
          assert verified_p07_toolbox_backup(str(prev),str(cur))
          (prev/'foreign_app').mkdir()
          assert not verified_p07_toolbox_backup(str(prev),str(cur))
          print('P07_M05_UX9_REAL_OFFICIAL_M03_139_140_BACKUP_RECOGNITION=PASS')
          print('P07_M05_UX9_TAMPER_FOREIGN_APP_REJECT=PASS')
          PY
          echo P07_USER_CP2_PRODUCTION_DB_DNS_MIGRATION=NOT_RUN
      - name: Build two identical M05 UX9 standalone ZIP archives
        shell: bash
        run: |
          set -Eeuo pipefail
          m="$RUNNER_TEMP/p07-ux9-bundle"
          mkdir -p "$m"
          python3 -B product/scripts/build_p07_m05_bundle.py --output "$m/a.zip"
          python3 -B product/scripts/build_p07_m05_bundle.py --output "$m/b.zip"
          cmp "$m/a.zip" "$m/b.zip"
          python3 - "$m/a.zip" <<'PY'
          import json,sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              manifest=json.loads(z.read('p07-m05/MODULE_MANIFEST.json'))
              assert manifest['module_id']=='P07-M05'
              assert manifest['module_build_id']=='0.1.0-m05-ux9-real-backup-identity'
              assert 'p07-m05/lib/m05_toolbox_backup_guard.py' in z.namelist()
          print('P07_M05_UX9_REPRODUCIBLE_STANDALONE_CANDIDATE=PASS')
          PY
          echo P07_M01_M02_M03_M04_WRITES=NONE
      - name: Destroy private checkout and synthetic server
        if: always()
        shell: bash
        run: |
          rm -rf -- product "$RUNNER_TEMP/p07-real-m03-sandbox" "$RUNNER_TEMP/p07-ux9-bundle"
          echo P07_M05_UX9_EPHEMERAL_CLEANUP=PASS
