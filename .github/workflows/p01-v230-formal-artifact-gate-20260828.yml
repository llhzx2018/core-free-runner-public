name: P01 V2.23.0 Formal Artifact Gate
on:
  push:
    branches: [task/p01-v222-multi-surface-gate-20260828]
    paths: ['.github/workflows/p01-v230-formal-artifact-gate-20260828.yml']
permissions:
  contents: read
env:
  CANDIDATE: 6e7d30e6ea0c8f5f70076a69b0d1e6fb9be620b2
  CANDIDATE_TREE: 8bc7b4c2f643566d3688ecdeda74a47c320cbc2f
  SOURCE_TAG: v2.22.1
  SOURCE_COMMIT: a31bafac5efc97efa537b645f03bc99ed0ea5b43
  VERSION: 2.23.0
  SOURCE_VERSION: 2.22.1
  SCHEMA: '2026082801'
  SOURCE_SCHEMA: '2026082801'
  OUT: /tmp/p01-v230-artifacts
  BUILD_OUT: /tmp/p01-v222-artifacts
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.CANDIDATE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: candidate
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE_TAG }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: production
      - name: Build deterministic same-schema artifacts
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test "$(git -C production rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(tr -d '\r\n' < candidate/VERSION)" = "$VERSION"
          test "$(tr -d '\r\n' < production/VERSION)" = "$SOURCE_VERSION"
          find candidate/src -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          find candidate/src -type f -name '*.js' -print0 | xargs -0 -n1 node --check >/dev/null
          rm -rf runner proven "$OUT" "$BUILD_OUT"
          git clone -q --depth 1 --branch task/p01-v222-multi-surface-gate-20260828 https://github.com/llhzx2018/core-free-runner-public.git runner
          git clone -q --depth 1 --branch agent/p01-22121-formal-artifact-gate-20260819 https://github.com/llhzx2018/core-free-runner-public.git proven
          cp runner/scripts/p01-build-v222-schema-release.py /tmp/p01-v230-builder.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/p01-v230-builder.py'); s=p.read_text(encoding='utf-8')
          pairs=[
            ("VERSION='2.22.0'; SOURCE_VERSION='2.21.25'; SCHEMA='2026082801'; SOURCE_SCHEMA='2026080902'","VERSION='2.23.0'; SOURCE_VERSION='2.22.1'; SCHEMA='2026082801'; SOURCE_SCHEMA='2026082801'"),
            ("CANDIDATE='2c159b4b7ecfc03e79eff2e6103f7e2c768ded08'","CANDIDATE='6e7d30e6ea0c8f5f70076a69b0d1e6fb9be620b2'"),
            ("CANDIDATE_TREE='9116fe6cfc24d9a5a0a7070fb6af3f31bb079392'","CANDIDATE_TREE='8bc7b4c2f643566d3688ecdeda74a47c320cbc2f'"),
            ("SOURCE='6bc09cd152210183972dcb3f2c361eb65a4cadab'","SOURCE='a31bafac5efc97efa537b645f03bc99ed0ea5b43'"),
            ("'schema_change':True,'schema_migrations':['2026082801_v222_multi_surface.php']","'schema_change':False,'schema_migrations':[]"),
            ("public const SOURCE_VERSION='2.21.25';\\n    public const TARGET_VERSION='2.22.0';\\n    public const SOURCE_SCHEMA='2026080902';\\n    public const TARGET_SCHEMA='2026082801';","public const SOURCE_VERSION='2.22.1';\\n    public const TARGET_VERSION='2.23.0';\\n    public const SOURCE_SCHEMA='2026082801';\\n    public const TARGET_SCHEMA='2026082801';"),
            ("public const SOURCE_SCHEMA='2026080902';","public const SOURCE_SCHEMA='2026082801';"),
            ("'schema_migration':'2026082801_v222_multi_surface.php'","'schema_migration':None"),
            ("P01-V2.22.0-ARTIFACT-GATE.json","P01-V2.23.0-ARTIFACT-GATE.json")
          ]
          for old,new in pairs:
              if old not in s: raise SystemExit('missing builder anchor: '+old[:80])
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8',newline='\n')
          PY
          python3 /tmp/p01-v230-builder.py | tee /tmp/p01-v230-build.log
          mkdir -p "$OUT"
          cp "$BUILD_OUT/VF-Start-V2.23.0-FULL.zip" "$OUT/"
          cp "$BUILD_OUT/VF-Start-V2.23.0-UPDATE.zip" "$OUT/"
          cp "$BUILD_OUT/server-update-v2.23.0-repair.php" "$OUT/"
          cp "$BUILD_OUT/P01-V2.23.0-ARTIFACT-GATE.json" "$OUT/"
          cp "$BUILD_OUT/SHA256SUMS.txt" "$OUT/"
          php -l "$OUT/server-update-v2.23.0-repair.php" >/dev/null
          php "$OUT/server-update-v2.23.0-repair.php" --self-test | tee "$OUT/atomic-self-test.json"
          jq -e '.ok==true and .global_barrier==true and .interruption_recovery==true' "$OUT/atomic-self-test.json" >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZipInfo,ZIP_DEFLATED
          src=Path('/tmp/p01-v230-artifacts/server-update-v2.23.0-repair.php')
          out=Path('/tmp/p01-v230-artifacts/VF_Start_V2.23.0_UPDATE.zip')
          info=ZipInfo('repair-v2.23.0.php',(1980,1,1,0,0,0));info.compress_type=ZIP_DEFLATED;info.create_system=3;info.external_attr=(0o100640<<16)
          with ZipFile(out,'w',compression=ZIP_DEFLATED,compresslevel=9) as z:z.writestr(info,src.read_bytes())
          PY
          unzip -t "$OUT/VF_Start_V2.23.0_UPDATE.zip" >/dev/null
          test "$(unzip -Z1 "$OUT/VF_Start_V2.23.0_UPDATE.zip" | wc -l)" -eq 1
          unzip -Z1 "$OUT/VF_Start_V2.23.0_UPDATE.zip" | grep -Fxq 'repair-v2.23.0.php'
          ASSET_SHA=$(sha256sum "$OUT/VF_Start_V2.23.0_UPDATE.zip"|awk '{print $1}'); ASSET_BYTES=$(stat -c %s "$OUT/VF_Start_V2.23.0_UPDATE.zip")
          printf 'ASSET_SHA=%s\nASSET_BYTES=%s\n' "$ASSET_SHA" "$ASSET_BYTES" >> "$GITHUB_ENV"
          jq -e '.version=="2.23.0" and .source_version=="2.22.1" and .source_schema=="2026082801" and .schema=="2026082801" and .status=="BUILD_PASS"' "$OUT/P01-V2.23.0-ARTIFACT-GATE.json" >/dev/null
          echo P01_V230_BUILD=PASS
      - name: FULL fresh install and unified UI
        run: |
          set -Eeuo pipefail
          ROOT=/tmp/p01-v230-full; COOKIE=/tmp/p01-v230-full.cookies; ADMIN=/tmp/p01-v230-full-admin.cookies
          rm -rf "$ROOT" "$COOKIE" "$ADMIN"; mkdir -p "$ROOT"; unzip -q "$OUT/VF-Start-V2.23.0-FULL.zip" -d "$ROOT"
          test "$(tr -d '\r\n' < "$ROOT/VERSION.txt")" = "$VERSION"
          php -S 127.0.0.1:18290 -t "$ROOT" >/tmp/p01-v230-full.log 2>&1 & PID=$!
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18290/setup.php -o /tmp/setup.html && break; sleep 1; done
          curl -fsS -c "$COOKIE" -b "$COOKIE" http://127.0.0.1:18290/setup.php -o /tmp/setup.html
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/setup.html',encoding='utf-8').read();print(re.search(r'name="setup_csrf"\s+value="([^"]+)"',s).group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST http://127.0.0.1:18290/setup.php --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=V230 Full' --data-urlencode 'admin_password=P01V230!Full' --data-urlencode 'admin_password_confirm=P01V230!Full' >/tmp/post.html
          php "$ROOT/cli/verify.php" | grep -Fx 'VERIFY_PASS=YES'
          php "$ROOT/cli/surface-verify.php" | grep -Fx 'MULTI_SURFACE_PASS=YES'
          php "$ROOT/cli/baseline-verify.php" | tee /tmp/base.txt; grep -Fx 'BASELINE_CORE_PASS=YES' /tmp/base.txt; grep -Fx 'DRIFT_COUNT=0' /tmp/base.txt; grep -Fx 'UNKNOWN_COUNT=0' /tmp/base.txt
          curl -fsS -c "$ADMIN" -b "$ADMIN" -H 'Content-Type: application/json' -X POST 'http://127.0.0.1:18290/api.php?action=login' --data '{"password":"P01V230!Full"}' | jq -e '.ok==true' >/dev/null
          test "$(curl -sS -c "$ADMIN" -b "$ADMIN" -o /dev/null -w '%{http_code}' http://127.0.0.1:18290/)" = 302
          curl -fsS -c "$ADMIN" -b "$ADMIN" http://127.0.0.1:18290/surfaces.php | grep -F 'vf-dashboard-columns' >/dev/null
          curl -fsS -c "$ADMIN" -b "$ADMIN" http://127.0.0.1:18290/channels.php | grep -F 'vf-app-sidebar' >/dev/null
          curl -fsS -c "$ADMIN" -b "$ADMIN" http://127.0.0.1:18290/watch.php | grep -F 'vf-app-sidebar' >/dev/null
          kill "$PID" 2>/dev/null || true
          echo P01_V230_FULL_UI=PASS
      - name: Actual V2.22.1 updater to V2.23.0
        run: |
          set -Eeuo pipefail
          ROOT=/tmp/p01-v230-owner; COOKIE=/tmp/p01-v230-owner.cookies; ADMIN=/tmp/p01-v230-owner-admin.cookies
          rm -rf "$ROOT" "$COOKIE" "$ADMIN"; cp -a production/src "$ROOT"
          php -S 127.0.0.1:18291 -t "$ROOT" >/tmp/p01-v230-owner.log 2>&1 & PID=$!
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18291/setup.php -o /tmp/owner-setup.html && break; sleep 1; done
          curl -fsS -c "$COOKIE" -b "$COOKIE" http://127.0.0.1:18291/setup.php -o /tmp/owner-setup.html
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/owner-setup.html',encoding='utf-8').read();print(re.search(r'name="setup_csrf"\s+value="([^"]+)"',s).group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST http://127.0.0.1:18291/setup.php --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=V230 Owner' --data-urlencode 'admin_password=P01V230!Owner' --data-urlencode 'admin_password_confirm=P01V230!Owner' >/tmp/owner-post.html
          kill "$PID" 2>/dev/null || true
          cat >/tmp/p01-v230-seed.php <<'PHP'
          <?php require '/tmp/p01-v230-owner/app/bootstrap.php'; require_once '/tmp/p01-v230-owner/app/SurfaceRepository.php'; $r=new VfRepository(vf_db());$s=new VfSurfaceRepository(vf_db());$c=$r->createCategory(['name'=>'Keep','description'=>'','is_private'=>false]);$a=$r->saveLink(null,['category_id'=>$c,'title'=>'Keep Start','url'=>'https://example.com/start','description'=>'keep','is_private'=>false],'manual');$b=$r->saveLink(null,['category_id'=>$c,'title'=>'Keep Channel','url'=>'https://youtube.com/@keep','description'=>'keep','is_private'=>false],'manual');$s->upsertProfile((int)$b['id'],['surface'=>'channels','resource_kind'=>'youtube','background_friendly'=>true]);file_put_contents('/tmp/p01-v230-start',(string)$a['id']);file_put_contents('/tmp/p01-v230-channel',(string)$b['id']);
          PHP
          php /tmp/p01-v230-seed.php
          cat > "$OUT/manifest.json" <<JSON
          {"schema_version":"1.0","project_id":"P01","component_id":"APP","enabled":true,"target_version":"2.23.0","update_type":"ATOMIC","from_versions":["2.22.1"],"schema_from":"2026082801","schema_to":"2026082801","repository":"llhzx2018/vf-start","release_tag":"v2.23.0","asset_name":"VF_Start_V2.23.0_UPDATE.zip","asset_bytes":${ASSET_BYTES},"asset_sha256":"${ASSET_SHA}","release_id":378275999,"release_identity":"v2.23.0@6e7d30e6ea0c8f5f70076a69b0d1e6fb9be620b2","backup_required":true,"rollback_supported":true,"released_at":"2026-08-28T06:00:00Z","minimum_php":"8.0.0"}
          JSON
          cat >/tmp/p01-v230-update.php <<'PHP'
          <?php require '/tmp/p01-v230-owner/app/bootstrap.php'; $m=json_decode(file_get_contents('/tmp/p01-v230-artifacts/manifest.json'),true,512,JSON_THROW_ON_ERROR);$asset='/tmp/p01-v230-artifacts/VF_Start_V2.23.0_UPDATE.zip';$u=new VfUpdateManager(vf_db(),['manifest_fetcher'=>fn()=>$m,'asset_downloader'=>function(array $x,string $dest)use($asset){if(!copy($asset,$dest))throw new RuntimeException('copy failed');return ['size'=>filesize($dest)];},'backup_creator'=>fn(string $f,string $t)=>['backup_key'=>'v230-'.$f.'-'.$t]]);$c=$u->check(true);if(empty($c['ok'])||empty($c['can_update'])||($c['latest_version']??'')!=='2.23.0')throw new RuntimeException('check');echo "CHECK=PASS\n";$p=$u->prepare();if(empty($p['ok']))throw new RuntimeException('prepare');echo "PREPARE=PASS\n";$i=$u->install((string)$p['operation_id']);if(empty($i['ok']))throw new RuntimeException('install');echo "INSTALL=PASS\n";
          PHP
          php /tmp/p01-v230-update.php
          test "$(tr -d '\r\n' < "$ROOT/VERSION.txt")" = "$VERSION"
          php "$ROOT/cli/verify.php" | grep -Fx 'VERIFY_PASS=YES'
          php "$ROOT/cli/surface-verify.php" | grep -Fx 'MULTI_SURFACE_PASS=YES'
          php "$ROOT/cli/baseline-verify.php" | tee /tmp/owner-base.txt; grep -Fx 'BASELINE_CORE_PASS=YES' /tmp/owner-base.txt; grep -Fx 'DRIFT_COUNT=0' /tmp/owner-base.txt; grep -Fx 'UNKNOWN_COUNT=0' /tmp/owner-base.txt
          cat >/tmp/p01-v230-assert.php <<'PHP'
          <?php require '/tmp/p01-v230-owner/app/bootstrap.php';require_once '/tmp/p01-v230-owner/app/SurfaceRepository.php';$db=vf_db();$a=(int)trim(file_get_contents('/tmp/p01-v230-start'));$b=(int)trim(file_get_contents('/tmp/p01-v230-channel'));if(!$db->query('SELECT id FROM links WHERE id='.$a)->fetchColumn()||!$db->query('SELECT id FROM links WHERE id='.$b)->fetchColumn())throw new RuntimeException('lost');$s=new VfSurfaceRepository($db);if(!array_filter($s->collection('start',true)['links'],fn($x)=>(int)$x['id']===$a))throw new RuntimeException('start');if(!array_filter($s->collection('channels',true)['links'],fn($x)=>(int)$x['id']===$b))throw new RuntimeException('channel');echo "DATA=PASS\n";
          PHP
          php /tmp/p01-v230-assert.php
          php -S 127.0.0.1:18292 -t "$ROOT" >/tmp/p01-v230-post.log 2>&1 & PID=$!
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18292/ -o /tmp/public.html && break; sleep 1; done
          curl -fsS -c "$ADMIN" -b "$ADMIN" -H 'Content-Type: application/json' -X POST 'http://127.0.0.1:18292/api.php?action=login' --data '{"password":"P01V230!Owner"}' | jq -e '.ok==true' >/dev/null
          code=$(curl -sS -c "$ADMIN" -b "$ADMIN" -D /tmp/root.headers -o /dev/null -w '%{http_code}' http://127.0.0.1:18292/); test "$code" = 302; grep -iE '^location: *surfaces\.php' /tmp/root.headers >/dev/null
          curl -fsS -c "$ADMIN" -b "$ADMIN" http://127.0.0.1:18292/surfaces.php -o /tmp/home.html; grep -F 'vf-dashboard-columns' /tmp/home.html >/dev/null; grep -F 'Keep Start' /tmp/home.html >/dev/null; grep -F 'Keep Channel' /tmp/home.html >/dev/null
          test "$(php -r "require '$ROOT/app/bootstrap.php'; echo strtolower((string)vf_db()->query('PRAGMA integrity_check')->fetchColumn());")" = ok
          kill "$PID" 2>/dev/null || true
          echo P01_V230_ONLINE_UPGRADE_UI=PASS
      - name: Artifact verdict
        run: |
          set -Eeuo pipefail
          FULL_SHA=$(sha256sum "$OUT/VF-Start-V2.23.0-FULL.zip"|awk '{print $1}')
          UPDATE_SHA=$(sha256sum "$OUT/VF-Start-V2.23.0-UPDATE.zip"|awk '{print $1}')
          LEGACY_SHA=$(sha256sum "$OUT/VF_Start_V2.23.0_UPDATE.zip"|awk '{print $1}')
          REPAIR_SHA=$(sha256sum "$OUT/server-update-v2.23.0-repair.php"|awk '{print $1}')
          printf '%s  %s\n' "$FULL_SHA" VF-Start-V2.23.0-FULL.zip "$UPDATE_SHA" VF-Start-V2.23.0-UPDATE.zip "$LEGACY_SHA" VF_Start_V2.23.0_UPDATE.zip "$REPAIR_SHA" server-update-v2.23.0-repair.php > "$OUT/SHA256SUMS.txt"
          cat > "$OUT/P01-V2.23.0-RELEASE-GATE.json" <<JSON
          {"project_id":"P01","version":"2.23.0","source_version":"2.22.1","candidate":"$CANDIDATE","candidate_tree":"$CANDIDATE_TREE","schema":"2026082801","schema_change":false,"release_exact_source_gate":33147285602,"full_sha256":"$FULL_SHA","update_sha256":"$UPDATE_SHA","legacy_sha256":"$LEGACY_SHA","legacy_bytes":${ASSET_BYTES},"legacy_inner":"repair-v2.23.0.php","online_upgrade":"PASS","unified_ui":"PASS","status":"PASS"}
          JSON
          echo P01_V230_FORMAL_ARTIFACT=PASS
          echo LEGACY_SHA=$LEGACY_SHA
          echo LEGACY_BYTES=$ASSET_BYTES
          echo PRODUCTION=NO
      - name: Upload formal artifacts
        uses: actions/upload-artifact@v4
        with:
          name: P01-V2.23.0-FORMAL-ARTIFACTS
          path: |
            /tmp/p01-v230-artifacts/VF-Start-V2.23.0-FULL.zip
            /tmp/p01-v230-artifacts/VF-Start-V2.23.0-UPDATE.zip
            /tmp/p01-v230-artifacts/VF_Start_V2.23.0_UPDATE.zip
            /tmp/p01-v230-artifacts/server-update-v2.23.0-repair.php
            /tmp/p01-v230-artifacts/P01-V2.23.0-ARTIFACT-GATE.json
            /tmp/p01-v230-artifacts/P01-V2.23.0-RELEASE-GATE.json
            /tmp/p01-v230-artifacts/SHA256SUMS.txt
            /tmp/p01-v230-artifacts/atomic-self-test.json
          if-no-files-found: error
          retention-days: 7
