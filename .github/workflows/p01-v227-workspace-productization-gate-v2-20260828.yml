name: P01 V2.27 Workspace Productization Gate V2
on:
  push:
    branches: [task/p01-v222-multi-surface-gate-20260828]
    paths: ['.github/workflows/p01-v227-workspace-productization-gate-v2-20260828.yml']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE: 91e0153fc08161aca1c96b598cfb15d0b12f0df6
      TREE: 7a1f37b45cdaa818ce470cdd02a264b90202ce49
      ROOT: /tmp/p01-v227-v2
      PORT: '18328'
      COOKIE: /tmp/p01-v227-v2.cookies
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 1
          path: product
      - name: Exact source syntax and contract fence
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$SOURCE"
          test "$(git -C product rev-parse HEAD^{tree})" = "$TREE"
          test "$(cat product/src/VERSION.txt)" = '2.26.0'
          find product/src -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/php-lint-v2.txt
          find product/src -name '*.js' -print0 | xargs -0 -n1 node --check >/tmp/js-lint-v2.txt
          for f in src/workspace-action.php src/assets/workspace.js src/app/SurfaceShell.php src/assets/surface-workspace.css src/surfaces.php src/start.php src/surface.php src/surface-manager.php; do test -e "product/$f"; done
          grep -F 'data-open-add' product/src/app/SurfaceShell.php >/dev/null
          grep -F 'data-detail-form' product/src/app/SurfaceShell.php >/dev/null
          grep -F 'data-bulkbar' product/src/app/SurfaceShell.php >/dev/null
          echo P01_V227_V2_EXACT=PASS
      - name: Fresh install representative data and login
        run: |
          set -Eeuo pipefail
          rm -rf "$ROOT" "$COOKIE" /tmp/p01-v227-v2-anon.cookies
          cp -a product/src "$ROOT"
          php -S 127.0.0.1:$PORT -t "$ROOT" >/tmp/p01-v227-v2-server.log 2>&1 & echo $! >/tmp/p01-v227-v2.pid
          for i in $(seq 1 30); do curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:$PORT/setup.php" -o /tmp/v2-setup.html && break; sleep 1; done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/v2-setup.html',encoding='utf-8').read(); m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s); assert m; print(m.group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:$PORT/setup.php" --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=V227 V2' --data-urlencode 'admin_password=P01V227!Workspace' --data-urlencode 'admin_password_confirm=P01V227!Workspace' -o /tmp/v2-setup-post.html
          cat >/tmp/v2-seed.php <<'PHP'
          <?php
          require '/tmp/p01-v227-v2/app/bootstrap.php'; require_once '/tmp/p01-v227-v2/app/SurfaceRepository.php';
          $r=new VfRepository(vf_db());$s=new VfSurfaceRepository(vf_db());$cats=[];
          foreach(['开发','AI','影视','稍后整理'] as $name)$cats[$name]=$r->createCategory(['name'=>$name,'description'=>'','is_private'=>false]);
          for($i=1;$i<=120;$i++)$r->saveLink(null,['category_id'=>$i%3===0?$cats['AI']:$cats['开发'],'title'=>'Start Tool '.$i,'url'=>'https://tool'.$i.'.example.com','description'=>'工具描述 '.$i,'tags'=>$i%5===0?'AI,工具':'工具','is_private'=>false,'is_favorite'=>$i%11===0],'manual');
          for($i=1;$i<=8;$i++){ $a=$r->saveLink(null,['category_id'=>$cats['AI'],'title'=>'Channel Creator '.$i,'url'=>'https://www.youtube.com/@creator'.$i,'description'=>'长期内容源 '.$i,'tags'=>'频道,科技','is_private'=>false],'manual');$s->upsertProfile((int)$a['id'],['surface'=>'channels','resource_kind'=>'creator','background_friendly'=>$i%2===0,'note'=>'频道备注']); }
          for($i=1;$i<=8;$i++){ $a=$r->saveLink(null,['category_id'=>$cats['影视'],'title'=>'Movie '.$i,'url'=>'https://movie'.$i.'.example.com','description'=>'影视索引','tags'=>'电影','is_private'=>false],'manual');$s->upsertProfile((int)$a['id'],['surface'=>'watch','resource_kind'=>'movie','media_year'=>(string)(2018+$i),'media_status'=>$i%2===0?'want':'watched','note'=>'电影备注']); }
          for($i=1;$i<=6;$i++)$r->saveLink(null,['category_id'=>$cats['稍后整理'],'title'=>'YouTube Pending '.$i,'url'=>'https://youtube.com/@pending'.$i,'description'=>'','is_private'=>false],'manual');
          file_put_contents('/tmp/v2-dev-cat',(string)$cats['开发']);
          PHP
          php /tmp/v2-seed.php
          curl -fsS -c "$COOKIE" -b "$COOKIE" -H 'Content-Type: application/json' -X POST "http://127.0.0.1:$PORT/api.php?action=login" --data '{"password":"P01V227!Workspace"}' | jq -e '.ok==true' >/dev/null
          curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:$PORT/surfaces.php" -o /tmp/v2-all.html
          grep -F '142 项' /tmp/v2-all.html >/dev/null
          grep -F 'data-workspace-overlay' /tmp/v2-all.html >/dev/null
          echo P01_V227_V2_FRESH=PASS
      - name: Real add edit favorite surface and bulk actions
        run: |
          set -Eeuo pipefail
          BASE="http://127.0.0.1:$PORT"
          CSRF=$(python3 - <<'PY'
          import re,json,html
          s=open('/tmp/v2-all.html',encoding='utf-8').read();m=re.search(r'<script type="application/json" id="vf-workspace-data">(.*?)</script>',s,re.S);assert m;print(json.loads(html.unescape(m.group(1)))['csrf'])
          PY
          )
          CAT=$(cat /tmp/v2-dev-cat)
          test "$(curl -sS -o /tmp/v2-u.json -w '%{http_code}' -X POST "$BASE/workspace-action.php" --data 'action=favorite&id=1')" = 403
          test "$(curl -sS -o /tmp/v2-c.json -w '%{http_code}' -b "$COOKIE" -X POST "$BASE/workspace-action.php" --data 'csrf=nope&action=favorite&id=1')" = 403
          curl -fsS -b "$COOKIE" -c "$COOKIE" -X POST "$BASE/workspace-action.php" --data-urlencode "csrf=$CSRF" --data-urlencode action=create --data-urlencode "category_id=$CAT" --data-urlencode 'title=Workspace Added' --data-urlencode 'url=https://workspace-added.example.com' --data-urlencode 'tags=新增,工具' --data-urlencode surface=start --data-urlencode is_private=1 | tee /tmp/v2-create.json | jq -e '.ok==true and .duplicate==false' >/dev/null
          ID=$(jq -r .id /tmp/v2-create.json)
          curl -fsS -b "$COOKIE" -c "$COOKIE" -X POST "$BASE/workspace-action.php" --data-urlencode "csrf=$CSRF" --data-urlencode action=create --data-urlencode "category_id=$CAT" --data-urlencode 'title=Duplicate' --data-urlencode 'url=https://workspace-added.example.com' --data-urlencode surface=watch | jq -e '.ok==true and .duplicate==true' >/dev/null
          curl -fsS -b "$COOKIE" -c "$COOKIE" -X POST "$BASE/workspace-action.php" --data-urlencode "csrf=$CSRF" --data-urlencode action=favorite --data-urlencode "id=$ID" --data-urlencode favorite=1 | jq -e '.ok==true' >/dev/null
          curl -fsS -b "$COOKIE" -c "$COOKIE" -X POST "$BASE/workspace-action.php" --data-urlencode "csrf=$CSRF" --data-urlencode action=save --data-urlencode "id=$ID" --data-urlencode "category_id=$CAT" --data-urlencode 'title=Workspace Edited' --data-urlencode 'url=https://workspace-added.example.com' --data-urlencode 'tags=编辑,工具' --data-urlencode surface=channels --data-urlencode resource_kind=creator --data-urlencode background_friendly=1 --data-urlencode is_private=1 --data-urlencode is_favorite=1 | jq -e '.ok==true' >/dev/null
          IDS=$(php -r 'require "/tmp/p01-v227-v2/app/bootstrap.php"; $rows=(new VfRepository(vf_db()))->bootstrap(true)["links"]; echo json_encode([(int)$rows[0]["id"],(int)$rows[1]["id"]]);')
          curl -fsS -b "$COOKIE" -c "$COOKIE" -X POST "$BASE/workspace-action.php" --data-urlencode "csrf=$CSRF" --data-urlencode action=bulk_surface --data-urlencode "ids=$IDS" --data-urlencode surface=channels | jq -e '.ok==true' >/dev/null
          curl -fsS -b "$COOKIE" -c "$COOKIE" -X POST "$BASE/workspace-action.php" --data-urlencode "csrf=$CSRF" --data-urlencode action=bulk_favorite --data-urlencode "ids=$IDS" --data-urlencode favorite=1 | jq -e '.ok==true' >/dev/null
          cat >/tmp/v2-assert.php <<'PHP'
          <?php
          require '/tmp/p01-v227-v2/app/bootstrap.php';
          $db=vf_db();$stmt=$db->prepare('SELECT id,title,is_favorite FROM links WHERE url=? LIMIT 1');$stmt->execute(['https://workspace-added.example.com']);$row=$stmt->fetch(PDO::FETCH_ASSOC);
          if(!$row||$row['title']!=='Workspace Edited'||(int)$row['is_favorite']!==1)throw new RuntimeException('workspace mutation failed');
          $p=$db->query('SELECT surface,resource_kind,background_friendly FROM resource_surface_profiles WHERE link_id='.(int)$row['id'])->fetch(PDO::FETCH_ASSOC);
          if(!$p||$p['surface']!=='channels'||$p['resource_kind']!=='creator'||(int)$p['background_friendly']!==1)throw new RuntimeException('surface mutation failed');
          echo "P01_V227_V2_MUTATION_DB=PASS\n";
          PHP
          php /tmp/v2-assert.php
          echo P01_V227_V2_MUTATIONS=PASS
      - name: Routes regression baseline integrity
        run: |
          set -Eeuo pipefail
          BASE="http://127.0.0.1:$PORT"
          for page in start.php channels.php watch.php surface-manager.php; do curl -fsS -b "$COOKIE" "$BASE/$page" -o "/tmp/v2-${page//./-}.html"; done
          grep -F '<h1>Start</h1>' /tmp/v2-start-php.html >/dev/null
          grep -F '<h1>Channels</h1>' /tmp/v2-channels-php.html >/dev/null
          grep -F '<h1>Watch</h1>' /tmp/v2-watch-php.html >/dev/null
          grep -F '<h1>待整理</h1>' /tmp/v2-surface-manager-php.html >/dev/null
          curl -fsS "$BASE/" -o /tmp/v2-public.html; ! grep -F 'vf-app-sidebar' /tmp/v2-public.html
          php "$ROOT/cli/verify.php" | tee /tmp/v2-verify.txt; grep -Fx 'VERIFY_PASS=YES' /tmp/v2-verify.txt
          php "$ROOT/cli/surface-verify.php" | tee /tmp/v2-surface.txt; grep -Fx 'MULTI_SURFACE_PASS=YES' /tmp/v2-surface.txt
          php "$ROOT/cli/baseline-verify.php" | tee /tmp/v2-baseline.txt; grep -Fx 'BASELINE_CORE_PASS=YES' /tmp/v2-baseline.txt; grep -Fx 'DRIFT_COUNT=0' /tmp/v2-baseline.txt; grep -Fx 'UNKNOWN_COUNT=0' /tmp/v2-baseline.txt
          php -r 'require "/tmp/p01-v227-v2/app/bootstrap.php";$db=vf_db();if(strtolower((string)$db->query("PRAGMA integrity_check")->fetchColumn())!=="ok")exit(1);if($db->query("PRAGMA foreign_key_check")->fetchAll(PDO::FETCH_ASSOC))exit(2);echo "P01_V227_V2_SQLITE=PASS\n";'
          echo P01_V227_V2_REGRESSION=PASS
      - name: Verdict
        run: |
          echo P01_V227_SOURCE=$SOURCE
          echo P01_V227_TREE=$TREE
          echo P01_V227_WORKSPACE_PRODUCTIZATION_V2=PASS
          echo SCHEMA_CHANGE=NO
          echo PRODUCTION_WRITE=NO
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/p01-v227-v2.pid 2>/dev/null)" 2>/dev/null || true
