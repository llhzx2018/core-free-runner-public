name: TEMP P01 V2.47.282 Distribution Discovery
on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/temp-p01-v247282-discovery.yml"]
permissions:
  contents: read
jobs:
  proof:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'proof(P01): V2.47.282 discovery')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-curl jq >/dev/null
      - name: Installed source updater discovery
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone -q --depth 1 --branch v2.47.281 "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" source
          READ_TOKEN="$READ_TOKEN" php -r '
            require "source/src/app/CoreUpdates/UpdateCore.php";
            require "source/src/app/CoreUpdates/GitHubClient.php";
            $client=new \CoreUpdates\GitHubClient((string)getenv("READ_TOKEN"),"p01-v247282-discovery-proof");
            $m=$client->fetchProjectManifest("llhzx2018/core-updates","P01.json","main");
            $core=new \CoreUpdates\UpdateCore("P01","APP");
            $result=$core->check("2.47.281","2026090401",$m);
            if(($result["status"]??"")!=="AVAILABLE"||($result["target_version"]??"")!=="2.47.282")exit(12);
            if(($m["release_id"]??0)!==406352795||($m["product_identity"]??"")!=="860a7cf9d92542c5a4f9c25d2cc4d0c6411ab56c")exit(13);
            if(($m["asset_sha256"]??"")!=="fbe840c7db61ab73059728c140d6b9fc263ab27a2cd39000141111a0f8b00c09")exit(14);
            if(strpos((string)($m["notes"]??""),"重新检查")===false)exit(15);
            echo "P01_UPDATER_DISCOVERY=PASS\nP01_UPDATER_STATUS=AVAILABLE\nP01_UPDATER_TARGET=2.47.282\n";
          '
      - name: Remote Release and ZIP readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api repos/llhzx2018/vf-start/releases/tags/v2.47.282 >/tmp/rel.json
          jq -e '.id==406352795 and .tag_name=="v2.47.282" and .draft==false and .prerelease==false' /tmp/rel.json >/dev/null
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.47.282 --jq '.object.sha')" = "860a7cf9d92542c5a4f9c25d2cc4d0c6411ab56c"
          jq -e '.assets[]|select(.name=="VF_Start_V2.47.282_UPDATE.zip")|(.size==2361869 and .digest=="sha256:fbe840c7db61ab73059728c140d6b9fc263ab27a2cd39000141111a0f8b00c09")' /tmp/rel.json >/dev/null
          mkdir -p /tmp/p01
          gh release download v2.47.282 -R llhzx2018/vf-start -D /tmp/p01 -p VF_Start_V2.47.282_UPDATE.zip
          test "$(stat -c %s /tmp/p01/VF_Start_V2.47.282_UPDATE.zip)" = 2361869
          echo 'fbe840c7db61ab73059728c140d6b9fc263ab27a2cd39000141111a0f8b00c09  /tmp/p01/VF_Start_V2.47.282_UPDATE.zip' | sha256sum -c -
          echo P01_RELEASE_ASSET_REMOTE_READBACK=PASS
          echo P01_V247282_DISTRIBUTION_DISCOVERY=PASS
          echo PRODUCTION_WRITE=NO
