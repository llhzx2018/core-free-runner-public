name: P07 D04 five-file functional extraction architecture final regression
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-m03-d04-five-file-architecture-20261116.yml'
permissions:
  contents: read
jobs:
  p07-d04-exact-source-guard-review:
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout temporary public harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Transient exact source with main diff
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: a279b91e9381264e542b96a9f2519affd208656a
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: .p07-private-integrated
      - name: Transient canonical governance checks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: .gov-rules
      - name: Prepare isolated local TLS tests
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq >/dev/null
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nginx openssl curl >/dev/null
      - name: Full current D04 safe-unit and local Nginx sweep
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-private-integrated rev-parse HEAD)" = "a279b91e9381264e542b96a9f2519affd208656a"
          cd .p07-private-integrated
          export PYTHONPATH="$PWD/lib"
          python3 -B -m unittest discover -s tests -p 'test_p07_m03_d04_*.py' -v
          python3 -B -m unittest discover -s tests -p 'test_p07_m03_dynamic_sqlite_scope.py' -v
          python3 -B -m unittest discover -s tests -p 'test_p07_m03_mysql84_receiver_preflight.py' -v
          python3 -B -m unittest discover -s tests -p 'test_migration_failed_prepare_audit.py' -v
          python3 -B -m unittest discover -s tests -p 'test_p07_m03_gtid_safe_reexport.py' -v
          python3 -B -m unittest discover -s tests -p 'test_p07_m03_source_sql_safety_preimport.py' -v
          python3 -B -m unittest discover -s tests -p 'test_p07_m03_mysql84_receiver_preflight.py' -v
          echo P07_D04_EXACT_SOURCE_CONSOLIDATED_REFACTOR_REGRESSION=PASS
      - name: Full module ownership and canonical real diff architecture
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          cd .p07-private-integrated
          # fetch-depth: 0 already includes origin/main; avoid a second
          # authenticated remote fetch with persist-credentials disabled.
          git rev-parse --verify refs/remotes/origin/main >/dev/null
          BASE="$(git merge-base refs/remotes/origin/main HEAD)"
          test -n "$BASE"
          python3 -B scripts/check_p07_modules.py \
            --module P07-M03-D04 --pr-title 'P07-M03-D04 服务器迁移：合并前一次性全集成验收' \
            --base-ref origin/main --affected P07-M03-D04 \
            --shared-reason '仅 D04 迁移及其旧 D04 迁移 helper'
          python3 -B scripts/check_p07_terminal_ux.py
          # Diagnose ALL existing oversized production files in one pass.
          # Only paths and counts are emitted, never private source content.
          python3 -B - "$BASE" "a279b91e9381264e542b96a9f2519affd208656a" <<'PY'
          import json,subprocess,sys
          base,head=sys.argv[1:]
          config=json.load(open(".github/checks/code_architecture.json"))
          m=config["gov_manifest"]
          changed=subprocess.check_output(
              ["git","diff","--name-only",base,head,"--","lib/"],text=True
          ).splitlines()
          blocked=[]
          for path in changed:
              try:
                  older=subprocess.check_output(
                      ["git","show",f"{base}:{path}"],text=True,stderr=subprocess.DEVNULL
                  )
              except subprocess.CalledProcessError:
                  older=None
              current=subprocess.check_output(
                  ["git","show",f"{head}:{path}"],text=True,stderr=subprocess.DEVNULL
              )
              old_lines=len(older.splitlines()) if older is not None else None
              new_lines=len(current.splitlines())
              if older is None:
                  invalid=new_lines>m["max_new_file_lines"]
                  gate="NEW_GOD_FILE"
              elif old_lines>m["max_new_file_lines"]:
                  invalid=new_lines-old_lines>m["max_legacy_file_growth"]
                  gate="LEGACY_GOD_FILE_GROWTH"
              else:
                  invalid=new_lines>m["max_new_file_lines"]
                  gate="EXISTING_FILE_CROSSES_BUDGET"
              if invalid:
                  blocked.append((path,old_lines,new_lines,gate))
          for path,old_lines,new_lines,gate in blocked:
              print(f"P07_D04_ARCH_BLOCKED {path} before={old_lines} after={new_lines} gate={gate}")
          print(f"P07_D04_ARCH_GROWTH_BLOCKER_COUNT={len(blocked)}")
          assert not blocked, "real main..HEAD architecture growth still blocked"
          PY
          python3 -B .github/checks/architecture_gate.py \
            --manifest .github/checks/code_architecture.json \
            --gov-root ../.gov-rules --git-root . --base-sha "$BASE" \
            --head-sha "a279b91e9381264e542b96a9f2519affd208656a"
          echo P07_D04_EXACT_DIFF_MODULE_AND_ARCHITECTURE=PASS
      - name: Remove transient private source and governance checkout
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- .p07-private-integrated .gov-rules
          test ! -e .p07-private-integrated
          test ! -e .gov-rules
          echo P07_D04_INTEGRATED_PRIVATE_WORKSPACES_CLEAN=PASS
