name: P07 Speedtest Checksum Probe

on:
  push:
    branches:
      - experiment/p07-oneshot-bench-v01
    paths:
      - .github/workflows/p07-speedtest-checksum.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checksum:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: experiment/p07-oneshot-bench-v01

      - name: Fetch official Ookla archives
        run: |
          set -euo pipefail
          mkdir -p experiments
          : > experiments/p07-speedtest-sha256.txt
          echo "source=https://install.speedtest.net/app/cli/" >> experiments/p07-speedtest-sha256.txt
          echo "version=1.2.0" >> experiments/p07-speedtest-sha256.txt
          for arch in x86_64 i386 aarch64 armhf armel; do
            file="/tmp/ookla-${arch}.tgz"
            curl -fL --retry 2 --connect-timeout 8 --max-time 60 \
              "https://install.speedtest.net/app/cli/ookla-speedtest-1.2.0-linux-${arch}.tgz" \
              -o "$file"
            tar -tzf "$file" | grep -x 'speedtest'
            printf '%s_sha256=%s\n' "$arch" "$(sha256sum "$file" | awk '{print $1}')" >> experiments/p07-speedtest-sha256.txt
          done
          cat experiments/p07-speedtest-sha256.txt

      - name: Commit checksum evidence
        run: |
          set -euo pipefail
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add experiments/p07-speedtest-sha256.txt
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(p07-bench): pin all official Ookla architecture SHA256'
          git push origin HEAD:experiment/p07-oneshot-bench-v01
