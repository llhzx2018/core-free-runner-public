name: P07 Speedtest Checksum Probe

on:
  push:
    branches:
      - experiment/p07-oneshot-bench-v01
    paths:
      - .github/workflows/p07-speedtest-checksum.yml
  workflow_dispatch:

permissions:
  contents: write

# Probe official archives before the one-shot bench pins them.
jobs:
  checksum:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: experiment/p07-oneshot-bench-v01

      - name: Fetch official Ookla archives
        run: |
          set -euo pipefail
          curl -fL --retry 2 --connect-timeout 8 --max-time 60 \
            https://install.speedtest.net/app/cli/ookla-speedtest-1.2.0-linux-x86_64.tgz \
            -o /tmp/ookla-x86_64.tgz
          curl -fL --retry 2 --connect-timeout 8 --max-time 60 \
            https://install.speedtest.net/app/cli/ookla-speedtest-1.2.0-linux-aarch64.tgz \
            -o /tmp/ookla-aarch64.tgz
          tar -tzf /tmp/ookla-x86_64.tgz | grep -x 'speedtest'
          tar -tzf /tmp/ookla-aarch64.tgz | grep -x 'speedtest'
          mkdir -p experiments
          {
            echo "source=https://install.speedtest.net/app/cli/"
            echo "version=1.2.0"
            echo "x86_64_sha256=$(sha256sum /tmp/ookla-x86_64.tgz | awk '{print $1}')"
            echo "aarch64_sha256=$(sha256sum /tmp/ookla-aarch64.tgz | awk '{print $1}')"
          } > experiments/p07-speedtest-sha256.txt
          cat experiments/p07-speedtest-sha256.txt

      - name: Commit checksum evidence
        run: |
          set -euo pipefail
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add experiments/p07-speedtest-sha256.txt
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(p07-bench): pin official Ookla SHA256'
          git push origin HEAD:experiment/p07-oneshot-bench-v01
