name: S01 Theme exact formal release
on:
  push:
    branches: [task/s01-glossary201-formal-20261026]
    paths: ['.github/workflows/s01-glossary201-20261026-formal.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.201
  TARGET_SHA: 1e958b1a0bcab74c97a46f0fd1938a645dcd0159
  TARGET_TREE: fda96616b688112d174246929825d8d725ac23c5
  BASE_SHA: 24d48f2b403df78d2610dc84aa19f49c198d6292
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - name: Formal identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-glossary201-20261026/formal-spec.json --input control/.github/workflows/s01-glossary201-20261026-formal.yml
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 1e958b1a0bcab74c97a46f0fd1938a645dcd0159
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact candidate, merged tree and required evidence readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider candidate-proof
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40319299376 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40319299376 --jq .head_sha)" = 16a2aee34a31533d882497bc4deccf34740ab173
          test "$(gh api repos/$TARGET_REPO/commits/main --jq .sha)" = "$TARGET_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$TARGET_SHA --jq .tree.sha)" = "$TARGET_TREE"
          gh run download 40319299376 --repo llhzx2018/core-free-runner-public --name s01-home-40319299376 --dir candidate-proof
          cmp candidate-proof/state-before.sha256 candidate-proof/state-after.sha256
          cmp candidate-proof/contracts-before.json candidate-proof/contracts-after.json
          python3 control/lanes/s01-glossary201-20261026/package.py
          python3 - <<'PYVERIFY'
          import json,pathlib,subprocess,urllib.parse
          r=pathlib.Path('candidate-proof')
          old=json.loads((r/'package.json').read_text());new=json.loads(pathlib.Path('proof/package.json').read_text())
          assert old['source']=='f03991a7afab989d6ff0cb105b26daf50f4a0509'
          for phase in ['before','after','smoke']:
              result=json.loads((r/('glossary-'+phase+'.json')).read_text())
              assert result['status']=='PASS' and result['rows']==2 and result['errors']==[]
          result=json.loads((r/'glossary-after.json').read_text())
          assert result['checks']>=60
          assert result['ownerContentSEO']=='BYTE_IDENTICAL'
          assert result['layout']=='SINGLE_RAIL_ZH_EN_1440_1024'
          assert result['customAndHeroOff']=='PRESERVED'
          assert result['interaction']=='NATIVE_SEARCH_ALIAS_PAGINATION_CATEGORY_HASH_RESET_NOJS'
          for lang in ['zh','en']:
              for width in [1440,1024]:
                  assert (r/f'glossary-{lang}-{width}.png').stat().st_size>1000
                  assert (r/f'glossary-empty-{lang}-{width}.png').stat().st_size>1000
          assert json.loads((r/'clean-install.json').read_text())['status']=='PASS'
          assert json.loads((r/'bootstrap.json').read_text())['status']=='PASS'
          for k in ['status','version','tree','sha256','bytes','files']: assert old[k]==new[k],k
          assert new['sha256']=='847cfb08e0650e1cafa16256bb0c337ac3c4f5eb25ee7aa4ebad42889854c456' and new['bytes']==2006638
          coverage=json.loads(pathlib.Path('control/lanes/s01-glossary201-20261026/release-authority.json').read_text())
          assert set(coverage['required'])=={'TESTING','GIT','UA_UI','SEO','SECURITY','INSTALL','UPGRADE','DATA_SCHEMA','PERFORMANCE'}
          assert coverage['source']=='f03991a7afab989d6ff0cb105b26daf50f4a0509' and coverage['tree']=='fda96616b688112d174246929825d8d725ac23c5'
          assert coverage['owner_preview_runtime']=='N_A'
          assert coverage['release_mode']=='PROJECT_PREVIEW_N_A'
          assert coverage['owner_real_use']=='POST_PRODUCTION_REQUIRED'
          assert coverage['production_auto_apply'] is False
          for item in coverage['required'].values():
              assert item['sha'] and item['acceptance']
              endpoint='repos/llhzx2018/gov-doc/contents/'+urllib.parse.quote(item['path'],safe='/')+'?ref=main'
              live=json.loads(subprocess.check_output(['gh','api',endpoint]))
              assert live['sha']==item['sha'],item['path']
              item['evidence_status']='PASS_EXACT_CANDIDATE_MACHINE'
          coverage['candidate_run']='40319299376'
          coverage['merged_source']='1e958b1a0bcab74c97a46f0fd1938a645dcd0159'
          coverage['formal_release_gate']='PASS'
          coverage['production_effect']='NOT_PROVEN_POST_MANUAL_UPGRADE_READBACK_REQUIRED'
          pathlib.Path('proof/public-authority-coverage.json').write_text(json.dumps(coverage,ensure_ascii=False,indent=2))
          print('MERGED_TREE_EQUALS_TESTED_TREE_AND_EXACT_PACKAGE_PASS')
          PYVERIFY
      - name: Publish only the exact verified package
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.35.201 --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create v1.35.201 provider/vf-tools-theme_V1.35.201.zip --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Theme V1.35.201' --notes '术语表目录参照实际查看的MDN Glossary收敛标题、查找和列表基线，区分真实空目录与筛选无匹配，去除精确默认重复宣传并保留自定义文案和入口。修复#首字母在原生请求、URL、导航和服务端匹配中的丢失。实际隔离WordPress/Chromium中英文1440/1024、别名全目录搜索、分类与#交集、重置、分页、无脚本及自定义/隐藏或后置首屏通过；200升级201、回退、重复安装及保护数据通过。476运行文件；内容、SEO Owner、保存、广告和其它组件不改。正式站由Owner手工升级后验收，手机及文章内容暂缓。' --latest
          fi
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/v1.35.201 --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh release view v1.35.201 --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - name: Authenticated remote ZIP byte comparison
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download v1.35.201 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.201.zip --dir remote
          cmp provider/vf-tools-theme_V1.35.201.zip remote/vf-tools-theme_V1.35.201.zip
          echo '847cfb08e0650e1cafa16256bb0c337ac3c4f5eb25ee7aa4ebad42889854c456  remote/vf-tools-theme_V1.35.201.zip' | sha256sum -c
          test "$(stat -c %s remote/vf-tools-theme_V1.35.201.zip)" = 2006638
          gh release view v1.35.201 --repo "$TARGET_REPO" --json url,publishedAt,tagName > proof/formal-release.json
          echo FORMAL_RELEASE_EXACT_REMOTE_ASSET_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-home-formal-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target provider remote candidate-proof
