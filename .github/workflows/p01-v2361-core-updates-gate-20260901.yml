name: P01 V2.36.1 Core Updates Manifest Gate
on:
  push:
    branches: [release/p01-v2361-candidate-20260901]
    paths: [.github/workflows/p01-v2361-core-updates-gate-20260901.yml]
permissions:
  contents: read
  actions: read
jobs:
  gate-promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CORE_BASE: 391df9fe685042644c64b56a4a545352bc8c2797
      MANIFEST_SOURCE: 416cc8089b39349eb7ee62638b5267335d406320
      PRODUCT_SOURCE: 23321270d79fc98d529c2c5a0ef07e0f1012835a
      PUBLICATION_RUN: '33474094279'
      RELEASE_ID: '380234103'
      ASSET_NAME: VF_Start_V2.36.1_UPDATE.zip
      ASSET_BYTES: '1391840'
      ASSET_SHA256: ef9d772d1fec07ee81899a64bf2fd2fdce4ebed7cf8b2b45168301cc5c7fd2bf
      EVID: /tmp/p01-v2361-core-updates-evidence
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip
          coverage: none
      - name: Checkout exact core-updates P01 manifest candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.MANIFEST_SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: updates
      - name: Validate exact manifest against published Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVID/download"
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$PUBLICATION_RUN --jq .conclusion)" = success
          cd updates
          test "$(git rev-parse HEAD)" = "$MANIFEST_SOURCE"
          test "$(git rev-parse HEAD^)" = "$CORE_BASE"
          test "$(git diff --name-only "$CORE_BASE" "$MANIFEST_SOURCE")" = projects/P01.json
          M=projects/P01.json
          jq -e . "$M" >/dev/null
          test "$(jq -r .project_id "$M")" = P01
          test "$(jq -r .component_id "$M")" = APP
          test "$(jq -r .enabled "$M")" = true
          test "$(jq -r .current_version "$M")" = 2.36.0
          test "$(jq -r .target_version "$M")" = 2.36.1
          test "$(jq -r '.from_versions|join(",")' "$M")" = 2.36.0
          test "$(jq -r .schema_from "$M")" = 2026082901
          test "$(jq -r .schema_to "$M")" = 2026082901
          test "$(jq -r .repository "$M")" = llhzx2018/vf-start
          test "$(jq -r .release_tag "$M")" = v2.36.1
          test "$(jq -r .release_id "$M")" = "$RELEASE_ID"
          test "$(jq -r .product_identity "$M")" = "$PRODUCT_SOURCE"
          test "$(jq -r .asset_name "$M")" = "$ASSET_NAME"
          test "$(jq -r .asset_bytes "$M")" = "$ASSET_BYTES"
          test "$(jq -r .asset_sha256 "$M")" = "$ASSET_SHA256"
          test "$(jq -r .backup_required "$M")" = true
          test "$(jq -r .rollback_supported "$M")" = true
          TAG=$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.36.1 --jq .object.sha)
          test "$TAG" = "$PRODUCT_SOURCE"
          gh api repos/llhzx2018/vf-start/releases/tags/v2.36.1 > "$EVID/release.json"
          test "$(jq -r .id "$EVID/release.json")" = "$RELEASE_ID"
          test "$(jq -r .tag_name "$EVID/release.json")" = v2.36.1
          test "$(jq -r .draft "$EVID/release.json")" = false
          test "$(jq -r .prerelease "$EVID/release.json")" = false
          jq -e --arg n "$ASSET_NAME" --argjson b "$ASSET_BYTES" --arg d "sha256:$ASSET_SHA256" '.assets[]|select(.name==$n and .size==$b and .digest==$d and .state=="uploaded")' "$EVID/release.json" >/dev/null
          gh release download v2.36.1 --repo llhzx2018/vf-start --pattern "$ASSET_NAME" --dir "$EVID/download"
          A="$EVID/download/$ASSET_NAME"
          test -f "$A"
          test "$(stat -c %s "$A")" = "$ASSET_BYTES"
          test "$(sha256sum "$A"|awk '{print $1}')" = "$ASSET_SHA256"
          unzip -Z1 "$A" | grep -Fx repair-v2.36.1.php >/dev/null
          unzip -p "$A" repair-v2.36.1.php > "$EVID/repair-v2.36.1.php"
          php -l "$EVID/repair-v2.36.1.php" >/dev/null
          php "$EVID/repair-v2.36.1.php" --self-test | tee "$EVID/atomic-self-test.json" | jq -e '.ok==true and .global_barrier==true and .interruption_recovery==true' >/dev/null
          printf 'P01_V2361_CORE_UPDATES_MANIFEST_GATE=PASS\nMANIFEST_SOURCE=%s\nPRODUCT_SOURCE=%s\nRELEASE_ID=%s\nASSET_BYTES=%s\nASSET_SHA256=%s\n' "$MANIFEST_SOURCE" "$PRODUCT_SOURCE" "$RELEASE_ID" "$ASSET_BYTES" "$ASSET_SHA256" | tee "$EVID/gate.txt"
      - name: Safe fast-forward core-updates main
        shell: bash
        run: |
          set -Eeuo pipefail
          cd updates
          BEFORE=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          test "$BEFORE" = "$CORE_BASE"
          git merge-base --is-ancestor "$CORE_BASE" "$MANIFEST_SOURCE"
          git push origin "$MANIFEST_SOURCE:refs/heads/main"
          AFTER=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          test "$AFTER" = "$MANIFEST_SOURCE"
          printf 'P01_V2361_CORE_UPDATES_PROMOTION=PASS\nCORE_UPDATES_MAIN=%s\nOWNER_PRODUCTION_WRITE=NO\n' "$AFTER" | tee "$EVID/promotion.txt"
      - name: Upload core-updates evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2361-core-updates-${{ github.run_id }}
          path: ${{ env.EVID }}
          if-no-files-found: error
          retention-days: 90
