name: TEMP P08 R43 authentic issued v016 SQLite old-client Atomic proof
on:
  pull_request:
    paths:
      - .github/workflows/temp-p08-r43-issued016-sqlite-20261124.yml
permissions:
  contents: read
concurrency:
  group: temp-p08-r43-issued-sqlite-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  issued-v016-sqlite:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/p08-r43-issued016-oldphp-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      P08_ISOLATED_INSTALL_TEST: 'YES'
      P08_R43_ISSUED_016_TEST: 'YES'
      P08_R43_ISSUED_ENGINE: sqlite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 089c3d6c0b5a20611065d630f206a60f07476796
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-p08-bridge
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_sqlite, sqlite3, pdo_mysql, zip, mbstring, intl, bcmath, dom, fileinfo
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read original issued FULL asset with immutable source, bytes and digest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C private-p08-bridge rev-parse HEAD)" = '089c3d6c0b5a20611065d630f206a60f07476796'
          mkdir -m 700 "$RUNNER_TEMP/p08-r43-issued-private"
          gh release download v0.1.16 -R llhzx2018/vf-adops -p VF_AdOps_V0.1.16_FULL.zip --dir "$RUNNER_TEMP/p08-r43-issued-private" > "$RUNNER_TEMP/p08-r43-issued-download.log" 2>&1 || { echo P08_R43_SQLITE_ISSUED_DOWNLOAD=BLOCKED; exit 1; }
          oldzip="$RUNNER_TEMP/p08-r43-issued-private/VF_AdOps_V0.1.16_FULL.zip"
          test "$(stat -c %s "$oldzip")" = '8378356'
          test "$(sha256sum "$oldzip" | cut -d' ' -f1)" = '7f6a3050db060448df391f0dc5a8a3a2de45c9f28a704cb76606694b82bd084f'
          unzip -p "$oldzip" FULL_MANIFEST.json > "$RUNNER_TEMP/p08-r43-issued-manifest.json"
          php -r '$m=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR); if(($m["source_sha"]??"")!=="ed96b18627cd0a63b1da20a1fd8c9b6c1808f159"||($m["target_version"]??"")!=="0.1.16")exit(2);' "$RUNNER_TEMP/p08-r43-issued-manifest.json"
          echo P08_R43_REAL_IMMUTABLE_V016_SQLITE_SOURCE=PASS
      - name: Make genuine issued-origin code-only v017 development Atomic using real old manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          d=private-p08-bridge
          mkdir -p "$d/bootstrap/cache" "$d/storage/framework/cache/data" "$d/storage/framework/sessions" "$d/storage/framework/views" "$d/storage/logs"
          (cd "$d" && composer install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/p08-r43-issued-composer.log" 2>&1) || { echo P08_R43_SQLITE_DEPS=FAIL; exit 1; }
          (cd "$d" && npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-r43-issued-npm.log" 2>&1 && npm run build > "$RUNNER_TEMP/p08-r43-issued-vite.log" 2>&1) || { echo P08_R43_SQLITE_BUILD=FAIL; exit 1; }
          h="$(sha256sum "$RUNNER_TEMP/p08-r43-issued-manifest.json" | awk '{print $1}')"
          python3 "$d/scripts/build_atomic.py" --source "$d" --output "$RUNNER_TEMP/p08-r43-dev-v017-update.zip" --source-version 0.1.16 --source-sha 'ed96b18627cd0a63b1da20a1fd8c9b6c1808f159' --source-full-manifest-sha256 "$h" --previous-full-manifest "$RUNNER_TEMP/p08-r43-issued-manifest.json" --target-version 0.1.17 --target-sha '089c3d6c0b5a20611065d630f206a60f07476796' > "$RUNNER_TEMP/p08-r43-issued-atomic.log" 2>&1 || { echo P08_R43_SQLITE_ORIGIN_ATOMIC=FAIL; grep -E 'ATOMIC_REJECTED' "$RUNNER_TEMP/p08-r43-issued-atomic.log" | head -n 4 || true; exit 1; }
          echo P08_R43_SQLITE_REAL_ISSUED_FULL_SCHEMA_PARITY=PASS
      - name: Use unchanged genuine issued v016 runtime stage, backup and atomically activate v017
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          site="$RUNNER_TEMP/p08-r43-issued-site-sqlite"
          mkdir -m 700 "$site"
          unzip -q "$RUNNER_TEMP/p08-r43-issued-private/VF_AdOps_V0.1.16_FULL.zip" -d "$site"
          t=private-p08-bridge/tests/compatibility/r43_issued016_native_codeonly.php
          update="$RUNNER_TEMP/p08-r43-dev-v017-update.zip"
          for phase in setup bad-archive apply verify; do
            php "$t" "$phase" "$site" "$update" '089c3d6c0b5a20611065d630f206a60f07476796' > "$RUNNER_TEMP/p08-r43-issued-$phase.log" 2>&1 || { echo "P08_R43_SQLITE_OLD_CLIENT_PHASE_FAIL=$phase"; grep -E 'R43_|ATOMIC_|R26_|R25_|Fatal error|Error:' "$RUNNER_TEMP/p08-r43-issued-$phase.log" | tail -n 10 || true; exit 1; }
          done
          grep -q '^P08_R43_ACTUAL_OFFICIAL_V016_FULL_OWNER_INSTALL=PASS' "$RUNNER_TEMP/p08-r43-issued-setup.log"
          grep -q '^P08_R43_ISSUED_CLIENT_BAD_ZIP_SHA_AND_TARGET_REFUSED=PASS' "$RUNNER_TEMP/p08-r43-issued-bad-archive.log"
          grep -q '^P08_R43_UNMODIFIED_ISSUED_016_NATIVE_CODEONLY_STAGE_BACKUP_POINTER=PASS' "$RUNNER_TEMP/p08-r43-issued-apply.log"
          grep -q '^P08_R43_ISSUED_016_TO_DEV_017_NATIVE_ATOMIC_READBACK=PASS' "$RUNNER_TEMP/p08-r43-issued-verify.log"
          echo P08_R43_AUTHENTIC_ISSUED_V016_SQLITE_OLD_CLIENT_CODEONLY=PASS
      - name: Delete original private installed site and source
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- private-p08-bridge "$RUNNER_TEMP/p08-r43-issued-site-sqlite" "$RUNNER_TEMP/p08-r43-issued-private"
          rm -f -- "$RUNNER_TEMP"/p08-r43-issued-*.log "$RUNNER_TEMP"/p08-r43-issued-manifest.json "$RUNNER_TEMP"/p08-r43-dev-v017-update.zip
          test ! -e private-p08-bridge && test ! -e "$RUNNER_TEMP/p08-r43-issued-site-sqlite"
          echo P08_R43_ORIGINAL_SQLITE_PRIVATE_CLEANUP=PASS
