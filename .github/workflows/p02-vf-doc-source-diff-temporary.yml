name: TEMP P02 new-only real source-diff architecture quality (never Release)
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p02-vf-doc-source-diff-temporary.yml
permissions:
  contents: read
jobs:
  real-pr-diff:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/p02-vf-doc-source-diff-20261122'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-doc
          ref: 25e9589a00347310bd78ab9cfaf9b5636e5842f5
          path: target
          fetch-depth: 160 # exact commit + its 139 ancestors; no all-branch/tag fetch
          token: \${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/gov-doc
          ref: main
          path: shared-gov-doc
          token: \${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Validate entire PR actual Git base and exact-source lint
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = 25e9589a00347310bd78ab9cfaf9b5636e5842f5
          git -C target cat-file -e f91c2e4ae282030152e6a2f217807faa2000c469^{commit}
          echo P02_PR_BASE_AND_HEAD_REAL_GIT=PASS
          if python3 -B shared-gov-doc/governance/agent/code_architecture_lint.py \
            --manifest target/docs/architecture/architecture.json \
            --git-root target \
            --base-sha f91c2e4ae282030152e6a2f217807faa2000c469 \
            --head-sha 25e9589a00347310bd78ab9cfaf9b5636e5842f5 \
            >"$RUNNER_TEMP/p02-source-diff.log" 2>&1; then
            echo P02_PR_CODE_ARCHITECTURE_GIT_ACTUAL=STRUCTURAL_PASS
          else
            echo P02_PR_CODE_ARCHITECTURE_GIT_ACTUAL=FAIL
            python3 - "$RUNNER_TEMP/p02-source-diff.log" <<'PY'
          import re,sys
          report=open(sys.argv[1],encoding='utf8',errors='replace').read()
          names=re.findall(r'(?:BLOCKED:|CODE_ARCHITECTURE=BLOCKED:)([A-Z_]+)',report)
          print("P02_ARCH_ERROR_CLASS="+(",".join(names[:4]) or "UNKNOWN"))
          PY
            exit 1
          fi
          echo P02_PRIVATE_SOURCE_GIT_DIFF_CHECK_CLEAN=PASS
      - name: Erase private source and GOV worktree
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- target shared-gov-doc
          rm -f "$RUNNER_TEMP/p02-source-diff.log"
          test ! -e target && test ! -e shared-gov-doc
          echo P02_PRIVATE_SOURCE_CLEAN=PASS
