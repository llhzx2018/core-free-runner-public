name: TEMP P02 current candidate source/frontend/Clean FULL proof (not Release)
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p02-vf-doc-source-diff-temporary.yml
permissions:
  contents: read
jobs:
  candidate-build:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/p02-vf-doc-source-diff-20261122'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-doc
          ref: 3eada39eae651ac62f958c2d01ae26b72186a733
          path: target
          fetch-depth: 1
          token: \${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/gov-doc
          ref: main
          path: shared-gov-doc
          token: \${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_sqlite,sqlite3,pdo_mysql,dom,xml,zip,curl,fileinfo
          tools: composer:v2
          coverage: none
      - uses: pnpm/action-setup@v4
        with:
          version: '10.20.0'
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate current source and installed-system admission
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = 3eada39eae651ac62f958c2d01ae26b72186a733
          python3 -B target/scripts/check_bootstrap.py
          python3 -B target/scripts/check_source_contract.py
          python3 -B target/tests/evolution/test_second_module.py
          if python3 -B shared-gov-doc/governance/agent/validate_repository_entry.py \
            --gov-root shared-gov-doc --new-web-root target >"$RUNNER_TEMP/p02-gov.log" 2>&1; then
            echo P02_NEW_WEB_ROOT=STRUCTURAL_PASS
          else
            echo P02_NEW_WEB_ROOT=FAIL
            exit 1
          fi
          if python3 -B shared-gov-doc/governance/agent/code_architecture_lint.py \
            --manifest target/docs/architecture/architecture.json >"$RUNNER_TEMP/p02-arch.log" 2>&1; then
            echo P02_ARCH_MANIFEST=STRUCTURAL_PASS
          else
            echo P02_ARCH_MANIFEST=FAIL
            exit 1
          fi
      - name: Frozen TypeScript/Vitest and real Clean FULL assembly on updated frontend tools
        shell: bash
        run: |
          set -Eeuo pipefail
          if (cd target && pnpm install --frozen-lockfile && pnpm run typecheck && pnpm run test:frontend) >"$RUNNER_TEMP/p02-front.log" 2>&1; then
            echo P02_CHANGED_FRONTEND_TYPECHECK_VITEST=PASS
          else
            echo P02_CHANGED_FRONTEND_TYPECHECK_VITEST=FAIL
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/p02-bundle"
          if bash target/scripts/build-clean-full.sh "$RUNNER_TEMP/p02-bundle/full.zip" >"$RUNNER_TEMP/p02-build.log" 2>&1; then
            unzip -tqq "$RUNNER_TEMP/p02-bundle/full.zip"
            unzip -Z1 "$RUNNER_TEMP/p02-bundle/full.zip" | grep -qx 'public/setup.php'
            echo P02_CHANGED_TOOLING_REAL_FULL_BUILT=PASS
            echo "P02_CHANGED_TOOLING_FULL_SHA256=$(sha256sum "$RUNNER_TEMP/p02-bundle/full.zip" | cut -d' ' -f1)"
          else
            echo P02_CHANGED_TOOLING_REAL_FULL_BUILT=FAIL
            grep -Eo 'COMPOSER_FROZEN_BUILD_FAIL|PNPM_FROZEN_BUILD_FAIL|VITE_BUILD_FAIL|MISSING_REQUIRED_SOURCE|P02_FULL_[A-Z_]+=(PASS|FAIL)' "$RUNNER_TEMP/p02-build.log" | tail -5 || true
            exit 1
          fi
          echo P02_CURRENT_CANDIDATE_BUILD_AND_PACKAGE=PASS
      - name: Erase exact private source and ZIP without public artifact
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- target shared-gov-doc "$RUNNER_TEMP/p02-bundle"
          rm -f "$RUNNER_TEMP/p02-gov.log" "$RUNNER_TEMP/p02-arch.log" "$RUNNER_TEMP/p02-front.log" "$RUNNER_TEMP/p02-build.log"
          test ! -e target && test ! -e "$RUNNER_TEMP/p02-bundle"
          echo P02_PRIVATE_SOURCE_AND_ZIP_CLEAN=PASS
