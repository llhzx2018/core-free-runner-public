name: P01 Radio 2.47.430 exact gate
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-music-radio-v247430-20261023.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: shivammathur/setup-php@2.35.5
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,mbstring,curl,zip
          coverage: none
      - name: Fetch private exact P01 source
        env:
          PRIVATE_READ: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ"
          git clone -q --depth 1 --no-checkout "https://x-access-token:${PRIVATE_READ}@github.com/llhzx2018/vf-start.git" candidate
          git -C candidate fetch -q --depth 1 origin e0ad9ef6b81a945e8a270909341dd40ed2a4f9ae
          git -C candidate checkout -q --detach FETCH_HEAD
          git -C candidate remote set-url origin https://github.com/llhzx2018/vf-start.git
          test "$(git -C candidate rev-parse HEAD)" = e0ad9ef6b81a945e8a270909341dd40ed2a4f9ae
      - name: Unit and real HTTP
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(cat candidate/VERSION)" = 2.47.430
          php -l candidate/src/music-radio.php
          php -l candidate/src/app/MusicSource.php
          php -l candidate/src/app/bootstrap.php
          (cd candidate && php tests/unit/music_radio_source_contract.php)
          node candidate/tests/unit/music_radio_directory_contract.js
          bash candidate/tests/integration/music_fresh_http.sh candidate
          echo P01_MUSIC_RADIO_MACHINE=PASS
      - name: Cleanup
        if: always()
        run: rm -rf candidate
