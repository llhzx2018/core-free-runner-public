name: P04 V2.5.4 E2E Empty Selector Patch

on:
  push:
    paths:
      - '.github/workflows/p04-v254-e2e-empty-selector-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix provider empty-state selector
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/p04-v254-browser-e2e.mjs')
          s=p.read_text(encoding='utf-8')
          old='#view-providers .empty-state, #view-providers .compact-empty, #view-providers .notice'
          new='#view-providers .empty-state, #view-providers .infra-empty.compact, #view-providers .notice'
          if s.count(old)!=1: raise SystemExit('empty selector sentinel mismatch')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          node --check scripts/p04-v254-browser-e2e.mjs
          git diff --check
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add scripts/p04-v254-browser-e2e.mjs
          git commit -m 'runner(P04): match real provider empty-state component'
          git push origin HEAD:main
