name: P01 UXUI Round4 Tools First Class

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p01-uxui-round4-tools-first-class-20260905.yml

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_SHA: ef7b1c7fe46f1be3369ef08a350e3cdd141e60f8
      BASE_SHA: ed72a63b8a4083beea47c43e66e765b6e13b3fc6
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: feature/p01-uxui-round4-tools-first-class-20260905
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_sqlite,sqlite3
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exact source and no-release boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(cat VERSION)" = '2.46.3'
          test "$(cat src/VERSION.txt)" = '2.46.3'
          changed="$(git diff --name-only "$BASE_SHA"..HEAD | sort)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | wc -l)" -eq 9
          ! printf '%s\n' "$changed" | grep -Eq '(^VERSION$|^src/VERSION.txt$|^src/migrations/|^src/app/bootstrap.php$)'
          ! grep -Fq 'surface.php' src/tools.php
      - name: Syntax and Round 4 identity
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in src/tools.php src/app/SubjectPageChrome.php src/app/ToolProductPage.php src/app/ToolWorkspaceHome.php src/app/ToolSceneDetail.php tests/unit/uxui_round4_tools_identity_contract.php tests/unit/tool_home_source_contract.php tests/unit/tool_scene_detail_contract.php tests/unit/tool_scene_detail_source_contract.php tests/unit/tool_task_intent_contract.php tests/unit/consolidated_product_acceptance_contract.php; do php -l "$f"; done
          php tests/unit/uxui_round4_tools_identity_contract.php
          php tests/unit/tool_home_source_contract.php
          php tests/unit/tool_scene_detail_contract.php
          php tests/unit/tool_scene_detail_source_contract.php
          php tests/unit/tool_task_intent_contract.php
          find src -name '*.php' -type f -print0 | xargs -0 -n1 php -l >/dev/null
      - name: Product regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in tests/unit/consolidated_product_acceptance_contract.php tests/unit/consolidated_product_model_contract.php tests/unit/workspace_view_catalog_contract.php tests/unit/workspace_nine_entry_source_contract.php tests/unit/global_page_size_authority_contract.php tests/unit/uxui_round1_home_root_contract.php tests/unit/uxui_round2_subject_identity_contract.php tests/unit/uxui_round3_course_identity_contract.php; do
            [ -f "$f" ] && php "$f"
          done
      - name: Static first-class Tools assertions
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'VfToolProductPage::render()' src/tools.php
          grep -Fq "VfSubjectPageChrome::context('tools')" src/app/ToolProductPage.php
          for scene in '做网站' '上线 / 服务器' 'SEO / 竞品' '图片 / 页面素材' '视频下载 / M3U8' '联盟投流 / 追踪' '代理 / 账号环境' '内容生产'; do
            grep -Fq "$scene" src/app/ToolWorkspaceHome.php src/app/ToolSceneDetail.php
          done
          grep -Fq 'vf-tool-row-hit' src/app/ToolSceneDetail.php
          grep -Fq 'vf-tool-row-hit' src/app/ToolProductPage.php
          ! grep -Fq '.vf-workspace-list' src/assets/tool-home.css
          ! grep -Fq '.vf-functional-head' src/assets/tool-home.css
          ! grep -Fq '.vf-workspace-list' src/assets/tool-scene-detail.css
          ! grep -Fq '.vf-functional-head' src/assets/tool-scene-detail.css
          ! grep -Fq 'overflow-x:auto' src/assets/tool-home.css
          ! grep -Fq 'overflow-x:auto' src/assets/tool-scene-detail.css
          grep -Fq '@media(max-width:430px)' src/assets/tool-home.css
          grep -Fq '@media(max-width:700px)' src/assets/tool-scene-detail.css
          echo P01_UXUI_ROUND4_TOOLS_FIRST_CLASS=PASS
