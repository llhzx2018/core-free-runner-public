name: P08 update UX source-exact TypeScript Vue and PHP tests
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p08-update-ux-source-tests.yml
permissions:
  contents: read
jobs:
  p08-update-ux:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-update-ux-ci-20261119' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout exact private P08 source without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: c57fbfe721b11c0dac69184a49a8de6001462d7b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p08
      - name: Setup Node 22 for source-only test
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup PHP 8.4 syntax check
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Actual package source and Vue/TS/Unit tests
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p08 rev-parse HEAD)" = c57fbfe721b11c0dac69184a49a8de6001462d7b
          test "$(cat p08/VERSION)" = 0.1.12
          cd p08
          php -l app/Http/Controllers/OwnerFutureUpdateController.php
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run test:unit
          npm run build
          test -z "$(git diff --name-only)"
          echo P08_UPDATE_UX_SOURCE_TESTS=PASS
      - name: Remove temporary private working copy
        if: always()
        shell: bash
        run: |
          rm -rf -- p08
          test ! -e p08
          echo P08_PRIVATE_SOURCE_CLEANUP=PASS
