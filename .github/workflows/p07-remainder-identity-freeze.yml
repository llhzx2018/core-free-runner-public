name: P07 fail-closed remainder site identity scope exact-source
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-remainder-identity-freeze.yml'
      - 'experiments/p07-remainder-identity-freeze/**'
permissions:
  contents: read
jobs:
  synthetic-remainder-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact product blob proof and isolated overlay
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(cat dist/p07/0.1.0/overlay/BUILD_ID)" = 0.1.0-release112
          test "$(git hash-object experiments/p07-remainder-identity-freeze/lib/server_migration_pull.py)" = 71fb59ad7d005b88e39cbeed4b3302c7f313bd06
          test "$(git hash-object experiments/p07-remainder-identity-freeze/lib/migration_remainder.py)" = 36c4166d5b06c0ef2491d60ae9c5ed134352d351
          test "$(git hash-object experiments/p07-remainder-identity-freeze/tests/test_migration_remainder.py)" = 67f245fc83bca0af81ac8d5ffbe68e8e1f25ae70
          test "$(git hash-object experiments/p07-remainder-identity-freeze/tests/test_migration_remainder_exact_scope.py)" = de67ab17a6cb994d9e65a24eb5b3f82db55a32f5
          test "$(git hash-object experiments/p07-remainder-identity-freeze/tests/test_migration_no_overwrite_resume.py)" = b8477422097f60e1fc5eca579ec27f7bdf1ad1ec
          test "$(git hash-object experiments/p07-remainder-identity-freeze/tests/test_server_migration_pull.py)" = 04403482be20e46ed1752637c573119ea43d099e
          test "$(git hash-object experiments/p07-remainder-identity-freeze/lib/private_sql_literal_reconcile.py)" = 19ddfab465e27767c56e7abf6a853fddd4684cdd
          test "$(git hash-object experiments/p07-remainder-identity-freeze/lib/private_conflict_preservation.py)" = 8ab17d9d8bb1ca66f3574acc1f056c675c405a81
          test "$(git hash-object experiments/p07-remainder-identity-freeze/lib/migration_recovery_rehearsal.py)" = 4726bdfb7ad4e2e2f9691f89a53c30c15acff138
          cp -a dist/p07/0.1.0/overlay "$RUNNER_TEMP/p07-remainder-scope"
          for p in lib/server_migration_pull.py lib/migration_remainder.py tests/test_migration_remainder.py tests/test_migration_remainder_exact_scope.py tests/test_migration_no_overwrite_resume.py tests/test_server_migration_pull.py lib/private_sql_literal_reconcile.py lib/private_conflict_preservation.py lib/migration_recovery_rehearsal.py; do
            cp "experiments/p07-remainder-identity-freeze/$p" "$RUNNER_TEMP/p07-remainder-scope/$p"
          done
          cd "$RUNNER_TEMP/p07-remainder-scope"
          python3 -m py_compile lib/server_migration_pull.py lib/migration_remainder.py tests/test_migration_remainder_exact_scope.py
          echo P07_REMAINDER_EXACT_SOURCE_PASS
      - name: Test local remainder identity, safe suffix and no overwrite
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/p07-remainder-scope"
          PYTHONPATH=lib python3 -m unittest -v \
            tests.test_migration_remainder \
            tests.test_migration_remainder_exact_scope \
            tests.test_migration_no_overwrite_resume \
            tests.test_server_migration_pull
          echo P07_REMAINDER_SCOPE_SYNTHETIC_PASS
      - name: Preserve original SQL guard and DB writer safety
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/p07-remainder-scope"
          PYTHONPATH=lib python3 -m unittest -q \
            tests.test_private_recovery_gate \
            tests.test_restore_sql_preflight \
            tests.test_scratch_guard_quarantine
          for p in lib/cloudpanel.py lib/server_migration.py lib/restore_apply_core.py lib/package_core.py BUILD_ID; do
            test "$(git hash-object "$GITHUB_WORKSPACE/dist/p07/0.1.0/overlay/$p")" = "$(git hash-object "$p")"
          done
          echo P07_REMAINDER_DB_WRITERS_UNCHANGED_PASS
