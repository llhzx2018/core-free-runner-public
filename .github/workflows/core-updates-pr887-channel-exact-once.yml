name: core-updates-pr887-channel-exact-once

# One-off exact machine validation of channel PR #887; do not merge this workflow.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/core-updates-pr887-channel-exact-once.yml'

permissions:
  contents: read

jobs:
  channel-contract:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/core-updates-pr887-channel-20261025'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact public channel source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: 215ea321c290c1ba346a8d5324f83a697e33386e
          persist-credentials: false
      - name: Exact source identity and distribution manifest contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 215ea321c290c1ba346a8d5324f83a697e33386e
          python3 scripts/check_manifest_contract.py
          python3 - <<'PY'
          import json
          p=json.load(open('projects/P01.json', encoding='utf-8'))
          assert p['current_version']=='2.47.455'
          assert p['target_version']=='2.47.456'
          assert p['from_versions']==['2.47.455']
          assert p['release_tag']=='v2.47.456'
          assert p['release_id']==423271656
          assert p['product_identity']=='933f0edd9bb7e530c5e95bf21f7025e4a94ef2e7'
          assert p['asset_name']=='VF_Start_V2.47.456_UPDATE.zip'
          assert p['asset_bytes']==3013224
          assert p['asset_sha256']=='9818dd514cc3f791149f3a59db60afca82859925441df0ba4b7ae29db7175cd3'
          assert p['backup_required'] is True and p['rollback_supported'] is True
          assert p['schema_from']==p['schema_to']=='2026102201'
          print('P01_CORE_UPDATES_PR887_IDENTITY_INTEGRITY=PASS')
          PY
      - name: PHP lint and canonical Update Core regression
        shell: bash
        run: |
          set -Eeuo pipefail
          php -v
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php update-core/php/tests/run.php
          echo 'P01_CORE_UPDATES_PR887_MACHINE=PASS'
