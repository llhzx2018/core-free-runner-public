name: P07 Target Pull Exact-source Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-target-pull-exact-gate.yml'

permissions:
  contents: read

jobs:
  exact-source-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Verify private read capability
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN"

      - name: Checkout exact private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: a5def78402191e73591b6004687a8f63c1d55ac3
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Verify identity and no destructive Production action
        working-directory: source
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "a5def78402191e73591b6004687a8f63c1d55ac3"
          test "$(cat VERSION)" = "0.1.0"
          test "$(cat BUILD_ID)" = "0.1.0-release6"

      - name: Syntax and compile
        working-directory: source
        run: |
          set -Eeuo pipefail
          for f in bin/vfops bin/vfops-user bin/vfops-site-ui bin/vfops-migrate-ui bin/vfops-auto-backup bin/vfops-cloudpanel-ui bin/vfops-storage-setup lib/terminal_ui.sh lib/cloudpanel_ui_common.sh lib/cloudpanel_ui_sites.sh lib/cloudpanel_ui_ops.sh lib/cloudpanel_ui_admin.sh tests/smoke.sh; do
            bash -n "$f"
          done
          python3 - <<'PY'
          from pathlib import Path
          import py_compile
          for root in (Path("lib"), Path("tests"), Path("scripts")):
              for p in sorted(root.rglob("*.py")):
                  py_compile.compile(str(p), doraise=True)
          PY

      - name: Target-owned Pull contract
        working-directory: source
        run: |
          set -Eeuo pipefail
          grep -Fq 'python3 "$ROOT_DIR/lib/server_migration_pull.py"' bin/vfops
          grep -Fq -- '--source-ip OLD_IP' bin/vfops
          grep -Fq '当前服务器：' bin/vfops-migrate-ui
          grep -Fq '新服务器 / 接收端' bin/vfops-migrate-ui
          grep -Fq '旧服务器 IP' bin/vfops-migrate-ui
          grep -Fq '整机迁入' bin/vfops-migrate-ui
          grep -Fq '单站迁入' bin/vfops-migrate-ui
          grep -Fq '继续未完成迁移' bin/vfops-migrate-ui
          grep -Fq '新服务器开始主动拉取旧服务器数据' bin/vfops-migrate-ui
          grep -Fq 'DNS 不自动修改' bin/vfops-migrate-ui
          grep -Fq '旧服务器永不自动删除' bin/vfops-migrate-ui
          grep -Fq 'Target-owned Pull Model' docs/authority/RPD.md
          grep -Fq '| B32 | Target-owned Pull Migration |' docs/authority/ACCEPTANCE_MATRIX.md
          ! grep -Fq '目标服务器 IP' bin/vfops-migrate-ui
          ! grep -Fq 'server-migrate plan --target-ip' bin/vfops

      - name: Focused migration tests
        working-directory: source
        run: |
          set -Eeuo pipefail
          export PYTHONPATH="$PWD/lib"
          python3 -m unittest -v tests.test_server_migration_pull tests.test_menu3_modular tests.test_server_migration tests.test_transport tests.test_cli_transport tests.test_cutover tests.test_app_config

      - name: Full Slot3 regressions
        working-directory: source
        run: |
          set -Eeuo pipefail
          export PYTHONPATH="$PWD/lib"
          bash tests/smoke.sh >/tmp/p07-smoke.log 2>&1
          python3 -m unittest discover -s tests -p 'test_*.py' -q

      - name: Machine and secret boundary
        working-directory: source
        run: |
          set -Eeuo pipefail
          NO_COLOR=1 bash bin/vfops-user --version | grep -Fx 'VF Server Ops 0.1.0'
          NO_COLOR=1 bash bin/vfops-user --build-id | grep -Fx '0.1.0-release6'
          ! NO_COLOR=1 bash bin/vfops-user --version | grep -q $'\033'
          python3 scripts/secret_scan.py --root . >/tmp/p07-secret-scan.log 2>&1

      - name: Result
        if: always()
        run: |
          echo "P07_TARGET_PULL_SOURCE=a5def78402191e73591b6004687a8f63c1d55ac3"
          echo "P07_PRIVATE_SOURCE_PERSISTED=NO"
          echo "P07_PRODUCTION_MIGRATION=NOT_RUN"
          echo "P07_DNS_WRITE=NOT_RUN"
          echo "P07_SOURCE_DELETE=NOT_RUN"
