name: P08 R120 exact release intake 13-domain real ZIP preflight
on:
  pull_request:
    paths: [.github/workflows/p08-r120-final-v013-preflight.yml]
permissions:
  contents: read
jobs:
  release-preflight:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      P08_EXACT: 1bb9f0457a1146bc952c2c2a1209694bd95450ed
      P08_TESTED_EXECUTABLE: ff5f3383cd217ff34491c7c515918ec3e3d3c3ad
      P08_CURRENT_MAIN: 66d0bd5929f208c9bef0d31bb4654b083ac2d732
      P08_BRIDGE_SOURCE: da36b736e075ea0908aa38f896162cac8651f289
      GOV_EXACT: d1f5d18a5efd475131d39bf83cfb17178af82da3
    steps:
      - name: Fetch exact private v013 integrated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 1bb9f0457a1146bc952c2c2a1209694bd95450ed
          path: p08-next
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Fetch exact previously-tested site-owned v012 bridge source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: da36b736e075ea0908aa38f896162cac8651f289
          path: p08-bridge
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Fetch current GOV skill release and package hard gates
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: d1f5d18a5efd475131d39bf83cfb17178af82da3
          path: gov
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: PHP 8.4 locked Laravel packaging environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mbstring, zip, sqlite3, pdo_sqlite, pdo_mysql, fileinfo, curl, sodium
          tools: composer:v2
      - name: Node 22 locked Vite build environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Final PR source exact executable and effective Mode M proof
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C p08-next rev-parse HEAD)" = "$P08_EXACT"
          test "$(git -C p08-bridge rev-parse HEAD)" = "$P08_BRIDGE_SOURCE"
          test "$(git -C gov rev-parse HEAD)" = "$GOV_EXACT"
          test "$(cat p08-next/VERSION)" = 0.1.3
          git -C p08-next merge-base --is-ancestor "$P08_CURRENT_MAIN" "$P08_EXACT"
          python3 -B - <<'PY'
          import os,subprocess
          from pathlib import Path
          repo=Path('p08-next')
          expected=os.environ['P08_TESTED_EXECUTABLE']
          actual=os.environ['P08_EXACT']
          diff=subprocess.check_output(['git','-C',str(repo),'diff','--name-only',expected,actual],text=True).splitlines()
          assert diff and all(f.startswith('docs/') or f=='AGENTS.md' for f in diff),'R120_EXECUTABLE_DRIFT_NOT_TESTED'
          for f in ('composer.json','composer.lock','package.json','package-lock.json','VERSION',
                    'scripts/build_full.py','scripts/build_atomic.py',
                    'scripts/r110_owner_atomic_once.php','scripts/R110OwnerWorkerFragment.php',
                    'src/Upgrade/R109AppLocal012Activation.php','src/Upgrade/R109AppLocal012Recovery.php'):
              x=subprocess.check_output(['git','-C',str(repo),'rev-parse',expected+':'+f],text=True).strip()
              y=subprocess.check_output(['git','-C',str(repo),'rev-parse',actual+':'+f],text=True).strip()
              assert x==y,'R120_PINNED_RUNTIME_BLOB_DRIFT'
          current=Path('gov/CURRENT.md').read_text()
          assert '| skill-release | V3.12 |' in current
          assert '### Mode M · ONE_CASE_P08_ADOPS_013_' in Path('gov/skills/skill-release/V3.12/SKILL.md').read_text()
          matrix=Path('p08-next/docs/authority/ACCEPTANCE_MATRIX.md').read_text()
          assert '## RP-07M' in matrix
          assert 'OWNER_PREVIEW_RUNTIME_APPLICABILITY=REQUIRED' in matrix
          print('R120_EXACT_MACHINE_SOURCE_BLOB_EQUALS_R117_AND_EFFECTIVE_RP07M=PASS')
          PY
      - name: Real official previous v012 GitHub Release and prior machine result readback
        shell: bash
        env:
          P08_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          python3 -B - <<'PY'
          import json,os,urllib.request
          tok=os.environ['P08_PRIVATE_READ_TOKEN']
          def get(url):
              assert url.startswith('https://api.github.com/repos/llhzx2018/')
              with urllib.request.urlopen(urllib.request.Request(url,headers={
                  'Authorization':'Bearer '+tok,'Accept':'application/vnd.github+json',
                  'User-Agent':'P08-R120-Released-Source-Gate'}),timeout=30) as response:
                  return json.load(response)
          prior=get('https://api.github.com/repos/llhzx2018/vf-adops/releases/tags/v0.1.2')
          assert prior['tag_name']=='v0.1.2' and prior['id']==445241918
          full=[z for z in prior['assets'] if z['name']=='VF_AdOps_V0.1.2_FULL.zip']
          assert len(full)==1 and full[0]['id']==747260263
          assert full[0]['size']==10390070
          assert full[0].get('digest')=='sha256:1b3d7fc3743fb44af12c0b50905a65ea68d47c80f0e1e2ddc5e03c08d534b081'
          for run in (43801680986,43801842033,43801862168,43802129134,43803855546):
              meta=get('https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/runs/'+str(run))
              assert meta.get('conclusion')=='success','R117_SOURCE_RUN_NOT_SUCCESS'
              jobs=get('https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/runs/'+str(run)+'/jobs?per_page=100')['jobs']
              assert jobs and all(j['conclusion']=='success' for j in jobs if j['status']=='completed' and j['name']!='skip')
          print('R120_REAL_OLD_V012_RELEASE_AND_R117_FIVE_MACHINE_RUNS_READBACK=PASS')
          PY
      - name: Compute all 13 Public Authority applicability and resolve before builds
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          python3 -B - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          router=Path('gov/governance/public-authority/VF_PUBLIC_AUTHORITY_APPLICABILITY_ROUTER_V1.0.json')
          j=json.loads(router.read_text())
          required=[
            'INSTALL','SECURITY','TESTING','UPGRADE','DATA_SCHEMA','API_PROVIDER',
            'CRON_JOB','OBSERVABILITY','PERFORMANCE','GIT','UA_UI'
          ]
          capabilities=[
            'formal_development','release','source_change','full_package',
            'clean_install','first_run','admin_initialization','auth','session',
            'secret','upload','write_api','admin','recovery','external_input',
            'update','atomic','rollback','online_upgrade','existing_install_transition',
            'database','backup','restore','persistent_user_data',
            'external_api','credentials','background_job','diagnostics',
            'release_visibility','upgrade_visibility','performance_sensitive_release',
            'ui_change','installer_ui','admin_surface'
          ]
          seen={name for name,spec in j['domains'].items()
                if set(capabilities).intersection(spec['triggers'])}
          assert seen==set(required),'R120_REAL_DOMAIN_TRIGGER_OMITTED'
          assert set(j['domains'])-seen=={'SEO','NOTIFICATION'}
          project=Path('p08-next')
          assert all((Path('gov')/j['domains'][name]['authority']).is_file()
                     for name in required)
          base={
            'schema':'vf.public-authority.task-delivery-check.v1',
            'project':'P08','source':os.environ['P08_EXACT'],
            'project_authority':{
              'agents':'AGENTS.md','current':'docs/authority/CURRENT.md',
              'acceptance':'docs/authority/ACCEPTANCE_MATRIX.md',
              'applicability':'docs/authority/PUBLIC_AUTHORITY_APPLICABILITY.md'
            },
            'acceptance_markers':['## RP-07M','OWNER_PREVIEW_RUNTIME_APPLICABILITY=REQUIRED'],
            'required_domains':required,'task_capabilities':capabilities,
            'delivery':{
              'requires_git':False,'requires_manual_source_copy':False
            }
          }
          for kind,entry,profile in (('FULL','public/setup.php','web_full_zip'),
                                      ('UPDATE','public/index.php','web_atomic_zip')):
              receipt=base.copy()
              receipt['delivery']={**base['delivery'],'profile':profile,'entrypoint':entry}
              path=Path(os.environ['RUNNER_TEMP'])/('r120-'+kind.lower()+'-receipt.json')
              path.write_text(json.dumps(receipt,sort_keys=True))
              cmd=['python3','-B','gov/governance/public-authority/tools/task_delivery_contract_lint.py',
                   '--phase','resolve','--receipt',str(path),
                   '--project-root',str(project.resolve()),'--artifact-root',str(project.resolve()),
                   '--public-router',str(router.resolve())]
              run=subprocess.run(cmd,capture_output=True,text=True)
              assert run.returncode==0 and 'CONTRACT_CHECK=RULES_RESOLVED' in run.stdout,'R120_13_DOMAIN_RESOLVE'
          print('R120_ALL_13_DOMAINS_RESOLVED_11_REQUIRED_SEO_NOTIFICATION_NA=PASS')
          PY
      - name: Build real v012 bridge and actual v013 locked FULL and Atomic ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          for mode in bridge next; do
            if test "$mode" = bridge; then repo=p08-bridge; else repo=p08-next; fi
            mkdir -m 0700 "$RUNNER_TEMP/r120-$mode-runtime"
            git -C "$repo" archive HEAD | tar -x -C "$RUNNER_TEMP/r120-$mode-runtime"
            (
              cd "$RUNNER_TEMP/r120-$mode-runtime"
              composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress > "$RUNNER_TEMP/r120-$mode-composer.log" 2>&1 || exit 91
              npm ci --no-audit --no-fund > "$RUNNER_TEMP/r120-$mode-node.log" 2>&1 || exit 92
              npm run build >> "$RUNNER_TEMP/r120-$mode-node.log" 2>&1 || exit 93
            ) || {
              echo R120_LOCKED_RUNTIME_BUILD=BLOCKED
              exit 1
            }
          done
          python3 -B - <<'PY' > "$RUNNER_TEMP/r120-build.log" 2>&1 || {
          import hashlib,json,os,sys,zipfile
          from pathlib import Path
          sys.path.insert(0,str(Path('p08-next/scripts').resolve()))
          from build_full import write_full,verify_canonical_full_contract
          from build_atomic import write_atomic
          root=Path(os.environ['RUNNER_TEMP'])
          bridge_sha=os.environ['P08_BRIDGE_SOURCE']
          new_sha=os.environ['P08_EXACT']
          bridge=Path('p08-bridge').resolve()
          nxt=Path('p08-next').resolve()
          gov=Path('gov').resolve()
          full=root/'VF_AdOps_V0.1.3_FULL.zip'
          atomic=root/'VF_AdOps_V0.1.3_UPDATE.zip'
          bfull=root/'r120-site-owned-bridge-internal.zip'
          b=write_full(root/'r120-bridge-runtime',bfull,'0.1.2',bridge_sha)
          with zipfile.ZipFile(bfull) as z:
              bridge_manifest=hashlib.sha256(z.read('FULL_MANIFEST.json')).hexdigest()
          verify_canonical_full_contract(nxt,full,new_sha,gov,'resolve')
          fi=write_full(root/'r120-next-runtime',full,'0.1.3',new_sha)
          verify_canonical_full_contract(nxt,full,new_sha,gov,'delivery')
          ai=write_atomic(root/'r120-next-runtime',atomic,
              source_version='0.1.2',source_sha=bridge_sha,
              source_full_manifest_sha256=bridge_manifest,
              target_version='0.1.3',target_sha=new_sha)
          with zipfile.ZipFile(full) as z:
              m=json.loads(z.read('FULL_MANIFEST.json'))
              assert m['source_sha']==new_sha and m['target_version']=='0.1.3'
              assert m['data_included'] is False and z.testzip() is None
          with zipfile.ZipFile(atomic) as z:
              m=json.loads(z.read('ATOMIC_MANIFEST.json'))
              assert m['source_sha']==bridge_sha and m['target_sha']==new_sha
              assert m['source_full_manifest_sha256']==bridge_manifest
              assert m['schema_changes'] is False and z.testzip() is None
          assert fi['sha256']==hashlib.sha256(full.read_bytes()).hexdigest()
          assert ai['sha256']==hashlib.sha256(atomic.read_bytes()).hexdigest()
          print('R120_REAL_SOURCE_FULL_AND_ATOMIC_ARCHIVES_BUILT=PASS')
          PY
            echo R120_SOURCE_PINNED_FULL_AND_ATOMIC=BLOCKED
            grep -E '^(R120_[A-Z0-9_]+|FULL_BLOCKED|ATOMIC_REJECTED)=' "$RUNNER_TEMP/r120-build.log" | tail -5 || true
            exit 1
          }
          grep -Fxq 'R120_REAL_SOURCE_FULL_AND_ATOMIC_ARCHIVES_BUILT=PASS' "$RUNNER_TEMP/r120-build.log"
          echo R120_LOCKED_FULL_ATOMIC_BUILT=PASS
      - name: Genuine FULL+Atomic 11 required Public Authority delivery gates and corrupt hash denial
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          python3 -B - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          temp=Path(os.environ['RUNNER_TEMP'])
          project=Path('p08-next').resolve()
          router=Path('gov/governance/public-authority/VF_PUBLIC_AUTHORITY_APPLICABILITY_ROUTER_V1.0.json').resolve()
          tool=Path('gov/governance/public-authority/tools/task_delivery_contract_lint.py').resolve()
          for kind in ('FULL','UPDATE'):
              archive=temp/('VF_AdOps_V0.1.3_'+kind+'.zip')
              receipt_path=temp/('r120-'+kind.lower()+'-receipt.json')
              receipt=json.loads(receipt_path.read_text())
              receipt['delivery']['artifact']=archive.name
              receipt['delivery']['sha256']=hashlib.sha256(archive.read_bytes()).hexdigest()
              receipt_path.write_text(json.dumps(receipt))
              cmd=['python3','-B',str(tool),'--phase','delivery','--receipt',str(receipt_path),
                   '--project-root',str(project),'--artifact-root',str(temp),'--public-router',str(router)]
              r=subprocess.run(cmd,capture_output=True,text=True)
              assert r.returncode==0 and 'CONTRACT_CHECK=STRUCTURAL_PASS' in r.stdout,'R120_REAL_ZIP_DELIVERY_BLOCK'
              receipt['delivery']['sha256']='0'*64
              receipt_path.write_text(json.dumps(receipt))
              negative=subprocess.run(cmd,capture_output=True,text=True)
              assert negative.returncode!=0 and 'ARTIFACT_SHA256_MISMATCH' in negative.stdout,'R120_BAD_DIGEST_ACCEPTED'
          print('R120_FULL_UPDATE_13_DOMAIN_REAL_DELIVERY_AND_BAD_SHA_FAIL_CLOSED=PASS')
          PY
      - name: Cleanup all private source, packages and working logs
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- p08-next p08-bridge gov
          rm -rf -- "$RUNNER_TEMP"/r120-next-runtime "$RUNNER_TEMP"/r120-bridge-runtime
          rm -f -- "$RUNNER_TEMP"/r120-*.log "$RUNNER_TEMP"/r120-*.json
          rm -f -- "$RUNNER_TEMP"/VF_AdOps_V0.1.3_*.zip "$RUNNER_TEMP"/r120-site-owned-bridge-internal.zip
          echo R120_PRIVATE_SOURCE_AND_BUILD_ZIPS_PURGED=YES
