name: S01-C02 1.21.936 R48 Focused Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/s01-c02-121936-r48-focused.yml'

permissions:
  contents: read

jobs:
  focused-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      TARGET_REPOSITORY: llhzx2018/vf-tools-ops
      TARGET_SHA: 53a5f342a82766b1a2bb295b4e015680e95a9c10
      EXPECTED_VERSION: 1.21.936
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}

    steps:
      - name: Verify private read
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN"
          echo "PRIVATE_READ=PASS"

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target

      - name: Verify exact identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n' < target/VERSION)" = "$EXPECTED_VERSION"
          grep -Fq "Version: $EXPECTED_VERSION" target/vf-ops.php
          grep -Fq "S01-PHYSICAL-SURFACE-CLEANUP-R48" target/vf-ops.php
          echo "CANDIDATE_IDENTITY=PASS"

      - name: Full PHP syntax gate
        shell: bash
        run: |
          set -Eeuo pipefail
          find target -type f -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 php -l > php-lint.log
          echo "PHP_FILES_LINTED=$(wc -l < php-lint.log | tr -d ' ')"
          echo "PHP_LINT=PASS"

      - name: Product surface contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          php target/tests/s01-c02-121935-product-surface-r46-contract.php
          php target/tests/s01-c02-121935-surface-capability-r47-contract.php
          php target/tests/s01-c02-121936-physical-surface-r48-contract.php
          echo "R46_R48_SURFACE_LINEAGE=PASS"

      - name: Shell/navigation regression
        shell: bash
        run: |
          set -Eeuo pipefail
          php target/tests/s01-c02-121932-navigation-role-r43-contract.php
          php target/tests/s01-c02-121933-navigation-flyout-r44-contract.php
          php target/tests/s01-c02-121934-shell-header-visual-lock-r45-contract.php
          node --check target/assets/js/admin-s01-domain-shell-r1.js
          echo "R43_R45_UI_LINEAGE=PASS"

      - name: Physical cleanup proof
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(find target/includes/admin-v13/capabilities -maxdepth 1 -type f -name '*.php' | wc -l | tr -d ' ')" = "12"
          for f in \
            content_core.php content_briefs.php content_ai.php content_status.php content_media.php \
            seo_today_v6.php seo_languages.php \
            acceptance_source.php acceptance_online.php acceptance_components.php acceptance_export.php \
            system_site_release_v6.php ads.php
          do
            test ! -f "target/includes/admin-v13/views/$f"
          done
          ! grep -Fq "['ads']" target/includes/admin-v13/views/integrations.php
          echo "PHYSICAL_OWNER_PAGE_CLEANUP=PASS"
          echo "ADS_OWNER_UI_RETIRED=PASS"

      - name: Build sanitized evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p={
            "schema":"vf-runner/s01-c02-r48-focused-v1",
            "target_repository":os.environ["TARGET_REPOSITORY"],
            "target_sha":os.environ["TARGET_SHA"],
            "version":os.environ["EXPECTED_VERSION"],
            "formal_owner_routes":13,
            "standalone_tools":1,
            "owner_surface_denominator":14,
            "page_local_capabilities":12,
            "retired_ads_owner_ui":True,
            "unknown_canonical_view_authority":0,
            "unknown_capability_partial_authority":0,
            "private_source_persisted":False,
            "secret_values_persisted":False
          }
          raw=json.dumps(p,sort_keys=True).encode()
          p["evidence_sha256"]=hashlib.sha256(raw).hexdigest()
          Path("evidence").mkdir(exist_ok=True)
          Path("evidence/s01-c02-121936-r48-focused.json").write_text(json.dumps(p,indent=2,sort_keys=True))
          print("R48_EVIDENCE_SHA256="+p["evidence_sha256"])
          PY

      - name: Upload sanitized evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-121936-r48-focused-${{ github.run_id }}
          path: evidence/s01-c02-121936-r48-focused.json
          if-no-files-found: error
          retention-days: 7
