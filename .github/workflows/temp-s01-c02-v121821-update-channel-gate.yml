name: TEMP S01-C02 v1.21.821 Update Channel Gate
on:
  push:
    branches: [temp/s01-c02-production-readback-20260904-current]
    paths: ['.github/workflows/temp-s01-c02-v121821-update-channel-gate.yml']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CORE_BASE: a4945d2dbc514ec7d5d8c9ea80ffd5120bb19478
      CORE_SHA: b1f552b4bfaad878ca5953d6c3f5539a78cb5327
      OPS_SHA: 696fb2d936210a2a179dec5fea4a2c6594d65df6
      OPS_TREE: 28c459d52596108c942d92e04c182b32dbdb3969
      ASSET_NAME: vf-tools-ops_V1.21.821.zip
      ASSET_BYTES: '3235879'
      ASSET_SHA: 01b008a263d4b718053c8bfde46349b89682c1bd0b501c269ea7caa6e10b9192
      RUNTIME_FP: 275304bc29c0f595bf605deb58ca12c80cb51434a7c72114231b2e6993a2c311
    steps:
      - name: Checkout exact update candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CORE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: core
      - name: Gate manifest release source and live Production
        shell: bash
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          current=$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/core-updates/branches/main | jq -r '.commit.sha')
          test "$current" = "$CORE_BASE"
          test "$(git -C core rev-list --count "$CORE_BASE..$CORE_SHA")" = 1
          test "$(git -C core rev-list --count "$CORE_SHA..$CORE_BASE")" = 0
          test "$(git -C core diff --name-only "$CORE_BASE" "$CORE_SHA" | wc -l)" = 1
          test "$(git -C core diff --name-only "$CORE_BASE" "$CORE_SHA")" = 'projects/S01-C02.json'
          j=$(cat core/projects/S01-C02.json)
          test "$(jq -r '.target_version' <<<"$j")" = '1.21.821'
          test "$(jq -c '.from_versions' <<<"$j")" = '["1.21.820"]'
          test "$(jq -r '.release_tag' <<<"$j")" = 'v1.21.821'
          test "$(jq -r '.asset_name' <<<"$j")" = "$ASSET_NAME"
          test "$(jq -r '.asset_bytes' <<<"$j")" = "$ASSET_BYTES"
          test "$(jq -r '.asset_sha256' <<<"$j")" = "$ASSET_SHA"
          test "$(jq -r '.schema_from' <<<"$j")" = '6.0.0'
          test "$(jq -r '.schema_to' <<<"$j")" = '6.0.0'
          test "$(jq -r '.physical_locator' <<<"$j")" = 'vf-ops/vf-ops.php'
          test "$(jq -r '.runtime_files' <<<"$j")" = '905'
          test "$(jq -r '.runtime_file_count' <<<"$j")" = '905'
          test "$(jq -r '.runtime_fingerprint' <<<"$j")" = "$RUNTIME_FP"
          test "$(jq -r '.runtime_fingerprint_sha256' <<<"$j")" = "$RUNTIME_FP"
          rel=$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.821)
          test "$(jq -r '.target_commitish' <<<"$rel")" = "$OPS_SHA"
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[] | select(.name==$n) | .size' <<<"$rel")" = "$ASSET_BYTES"
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[] | select(.name==$n) | .digest' <<<"$rel")" = "sha256:$ASSET_SHA"
          opsmain=$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/vf-tools-ops/branches/main | jq -r '.commit.sha')
          opsdev=$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/vf-tools-ops/branches/develop | jq -r '.commit.sha')
          test "$opsmain" = "$OPS_SHA"
          test "$opsdev" = "$OPS_SHA"
          tree=$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/vf-tools-ops/git/commits/$OPS_SHA | jq -r '.tree.sha')
          test "$tree" = "$OPS_TREE"
          prod=$(curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-domain-authority')
          test "$(jq -r '.pluginVersion' <<<"$prod")" = '1.21.820'
          test "$(jq -r '.status' <<<"$prod")" = 'CURRENT'
          test "$(jq -r '.authorityFinalHost' <<<"$prod")" = 'https://ilovem3u8.com'
          test "$(jq -r '.configuredPublicBaseUrl' <<<"$prod")" = 'https://ilovem3u8.com'
          test "$(jq -r '.authorityMatch' <<<"$prod")" = 'true'
          static=$(curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-static-candidate-readiness')
          test "$(jq -r '.pluginVersion' <<<"$static")" = '1.21.820'
          test "$(jq -r '.activeStaticJobStatus' <<<"$static")" = 'RUNNING'
          test "$(jq -r '.activeStaticJobMode' <<<"$static")" = 'candidate'
          test "$(jq -r '.sourceArtifactAvailable' <<<"$static")" = 'true'
          test "$(jq -r '.sourceInspectionComplete' <<<"$static")" = 'true'
          test "$(jq -r '.manualSourceUploadRequired' <<<"$static")" = 'false'
          test "$(jq -r '.finalOnlinePass' <<<"$static")" = 'NO'
          echo FORMAL_RELEASE_ASSET=PASS
          echo DIRECT_PRODUCTION_1_21_820_RUNNING_CANDIDATE=PASS
          echo PASS_V121821_UPDATE_CHANNEL_GATE
