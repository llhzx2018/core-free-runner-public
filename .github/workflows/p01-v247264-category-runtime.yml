name: P01 V2.47.264 Category Runtime Proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p01-v247264-category-runtime.yml"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout proof control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd nodejs >/dev/null

      - name: Clone exact candidate and stable Owner source
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" candidate
          git -C candidate fetch -q origin 1c905c6e18cd43c9747dec4a3bbc357c0a277731
          git -C candidate checkout -q --detach 1c905c6e18cd43c9747dec4a3bbc357c0a277731
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.264"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "2.47.264"

          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" baseline
          git -C baseline fetch -q origin a3c286e7e2b571dda1aaa1577acd694fe816f76c
          git -C baseline checkout -q --detach a3c286e7e2b571dda1aaa1577acd694fe816f76c
          echo P01_V247264_EXACT_SOURCE=PASS

      - name: Syntax and category runtime contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check candidate/src/assets/links-admin.js
          php -l candidate/src/links-admin.php
          php -l candidate/src/api.php
          php -l candidate/src/app/Repository.php
          php -l candidate/src/app/bootstrap.php
          php candidate/tests/unit/navigation_category_runtime_binding_v247264_contract.php
          php candidate/tests/unit/navigation_category_sort_v247263_contract.php
          php candidate/tests/unit/navigation_category_workspace_tabs_contract.php
          php candidate/tests/unit/admin_navigation_categories_page4_polish_contract.php
          php candidate/tests/unit/admin_navigation_task_separation_contract.php
          php candidate/tests/unit/admin_navigation_category_route_runtime_contract.php
          php candidate/tests/unit/navigation_url_table_production_r1_contract.php
          php candidate/tests/unit/links_dialog_cancel_save_guard_contract.php
          php candidate/tests/unit/links_filter_empty_state_clarity_contract.php
          echo P01_V247264_FOCUSED=PASS

      - name: Static runtime misuse guard
        shell: bash
        run: |
          set -Eeuo pipefail
          ! grep -F "$('[data-edit-cat]').forEach" candidate/src/assets/links-admin.js
          ! grep -F "$('[data-category-toggle]').forEach" candidate/src/assets/links-admin.js
          ! grep -F "$('[data-cat-shift]').forEach" candidate/src/assets/links-admin.js
          grep -F "$$('[data-edit-cat]').forEach" candidate/src/assets/links-admin.js
          grep -F "$$('[data-category-toggle]').forEach" candidate/src/assets/links-admin.js
          grep -F "$$('[data-cat-shift]').forEach" candidate/src/assets/links-admin.js
          echo P01_V247264_RUNTIME_BINDING_GUARD=PASS

      - name: Canonical regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate baseline --require-zero-debt | tee /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/canonical.txt
          echo P01_V247264_CANONICAL=PASS

      - name: Bounded scope
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C candidate diff --name-only a3c286e7e2b571dda1aaa1577acd694fe816f76c..1c905c6e18cd43c9747dec4a3bbc357c0a277731 | tee /tmp/changed.txt
          if grep -E '(^|/)(migrations|schema|auth|security|update|install|setup)' /tmp/changed.txt; then
            echo "Unexpected high-risk scope"
            exit 1
          fi
          echo FORMAL_RELEASE_CALLED=NO
          echo DISTRIBUTION_WRITE=NO
          echo PRODUCTION_WRITE=NO
