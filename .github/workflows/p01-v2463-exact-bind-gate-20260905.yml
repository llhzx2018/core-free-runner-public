name: P01 V2.46.3 Exact Bind Gate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p01-v2463-exact-bind-gate-20260905.yml

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_SHA: de967f5257c8dbf05018a0eac280a9f3f7d48b0a
      CANDIDATE_SHA: 9bbb4f8a301a241d3c2f333debc0c45824d2c192
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.CANDIDATE_SHA }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo, gd
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Exact three-file release boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch origin "$BASE_SHA"
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          test "$(cat VERSION)" = '2.46.3'
          test "$(cat src/VERSION.txt)" = '2.46.3'
          grep -Fxq "define('VF_VERSION', '2.46.3');" src/app/bootstrap.php
          test "$(git hash-object src/app/bootstrap.php)" = '92d36f1a47dbf2a8b37b6c1300c52336d36ff7fd'
          mapfile -t changed < <(git diff --name-only "$BASE_SHA"...HEAD | sort)
          test "${#changed[@]}" = '3'
          test "${changed[0]}" = 'VERSION'
          test "${changed[1]}" = 'src/VERSION.txt'
          test "${changed[2]}" = 'src/app/bootstrap.php'
          test "$(git diff --numstat "$BASE_SHA"...HEAD -- src/app/bootstrap.php | awk '{print $1":"$2}')" = '1:1'
          echo P01_V2463_EXACT_RELEASE_BOUNDARY=PASS

      - name: Frozen contracts and syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          tests=(
            tests/unit/consolidated_product_acceptance_contract.php
            tests/unit/public_global_nav_contract.php
            tests/unit/workspace_nine_entry_source_contract.php
            tests/unit/workspace_view_catalog_contract.php
            tests/unit/course_experience_source_contract.php
            tests/unit/tool_home_source_contract.php
            tests/unit/tool_task_intent_contract.php
            tests/unit/tool_scene_detail_contract.php
            tests/unit/tool_scene_detail_source_contract.php
            tests/unit/software_workspace_contract.php
            tests/unit/software_workspace_source_contract.php
            tests/unit/topic_project_approved_contract.php
            tests/unit/topic_project_approved_source_contract.php
            tests/unit/project_signals_contract.php
            tests/unit/project_signals_source_contract.php
            tests/unit/quick_open_global_contract.php
            tests/unit/primary_open_semantics_contract.php
          )
          for t in "${tests[@]}"; do php "$t"; done
          find src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          echo P01_V2463_EXACT_CONTRACTS=PASS

      - name: Exact Bind PASS
        run: echo P01_V2463_EXACT_BIND_GATE=PASS
