name: P01 IA6 R3 exact disposable highrisk 20261101 (test-only)
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-ia6-r3-disposable-current-20261101.yml']
permissions:
  contents: read
jobs:
  disposable-security:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'test(P01):')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      PRODUCT_BRANCH: feat/ia-v6-frontstage-admin-parity-system-jobs-r1
      PRODUCT_SHA: 389b27ca662acd51509a24d404a252ad380397b6
      PRODUCT_VERSION: 2.47.487
    steps:
      - name: Checkout public runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare clean PHP SQLite environment
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd php-xml >/dev/null
          php -r 'exit(in_array("sqlite",PDO::getAvailableDrivers(),true)?0:1);'
          echo P01_R3_DISPOSABLE_RUNTIME=PASS
      - name: Resolve exact private product candidate
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          actual="$(git ls-remote "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')"
          test "$actual" = "$PRODUCT_SHA"
          git clone -q --no-checkout "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" candidate
          git -C candidate fetch -q --depth 1 origin "$PRODUCT_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "$PRODUCT_VERSION"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "$PRODUCT_VERSION"
          echo P01_R3_EXACT_PRIVATE_SOURCE=PASS
      - name: Refuse non-disposable runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          if VF_E2E_RUNTIME_ROOT=/opt/real-site VF_IA6_DISPOSABLE_ACK=IA6-R3-SYNTHETIC-ONLY php candidate/tests/integration/p01_ia6_r3_highrisk_resource_purge_disposable.php >/tmp/p01-r3-refusal.log 2>&1; then
            echo P01_R3_NONDISPOSABLE_REFUSAL=FAIL;exit 1
          fi
          grep -F 'Refusing non-disposable IA V6 R3 environment' /tmp/p01-r3-refusal.log
          echo P01_R3_NONDISPOSABLE_REFUSAL=PASS
      - name: Real disposable SQLite mutation and Owner Guest HTTP gates
        shell: bash
        run: |
          set -Eeuo pipefail
          (cd candidate && bash tests/integration/run_p01_ia6_r3_highrisk_disposable.sh)
          echo P01_R3_EXACT_SQLITE_HTTP_GATES=PASS
      - name: Clean private source and temporary traces
        if: always()
        shell: bash
        run: |
          rm -rf candidate /tmp/p01-r3-refusal.log
          echo P01_R3_PRIVATE_SOURCE_CLEANUP=PASS
