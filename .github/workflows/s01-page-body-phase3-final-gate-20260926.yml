name: S01 Page Body Phase 3 Final Closure Gate

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/s01-page-body-phase3-final-gate-20260926.yml'

permissions:
  contents: read

jobs:
  gate:
    if: github.head_ref == 'task/s01-page-body-phase3-final-gate-20260926'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPS_SHA: dbbb23db87eaec4920f772484a732c88fd83fa3d
      THEME_SHA: b8de9700e7e58503c46a07a16cafa8e4e1e2b799
      M3U8_SHA: 16040c1d85f93e017b7918da6d82838b7097ed1b
    steps:
      - name: Credential presence
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: test -n "$READ_TOKEN"

      - name: Checkout exact OPS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.OPS_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: ops

      - name: Checkout exact Theme
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: ${{ env.THEME_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: theme

      - name: Checkout exact M3U8
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: ${{ env.M3U8_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: m3u8

      - name: OPS Page Body full contract set
        working-directory: ops
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$OPS_SHA"
          for f in tests/s01-c02-page-body-system-v1-*.php; do php -l "$f" >/dev/null; php "$f"; done
          php tests/s01-c02-121935-surface-capability-r47-contract.php
          ! grep -Eq '\.vf-v6-shell-header|\.vf-v6-domain-nav' assets/css/current/admin-s01-page-body-system-v1.css

      - name: Theme Page Body full contract set
        working-directory: theme
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$THEME_SHA"
          for f in tests/s01-c01-page-body-system-v1-*.php; do php -l "$f" >/dev/null; php "$f"; done
          php tests/s01-c01-page-visual-closure-r5-contract.php
          php tests/s01-c01-admin-shell-alignment-r1-contract.php
          ! grep -Eq '\.vf-v6-shell-header|\.vf-v6-domain-nav|\.vf-theme-maintenance-menu|\.vf-theme-admin-header' src/assets/css/admin/admin-s01-page-body-system-v1.css

      - name: M3U8 Page Body full contract set
        working-directory: m3u8
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$M3U8_SHA"
          for f in tests/s01-c03-page-body-system-v1-*.php; do php -l "$f" >/dev/null; php "$f"; done
          php tests/s01-c03-page-visual-closure-r5-contract.php
          php tests/s01-c03-admin-shell-alignment-r1-contract.php
          ! grep -Eq '\.vf-v6-shell-header|\.vf-v6-domain-nav|\.vf-v6-domain-menu|\.vf-m3u8-console-head|\.vf-m3u8-primary-nav' src/admin/ui-v4/admin-s01-page-body-system-v1.css

      - name: Page Body CSS safety
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          files=[
              Path('ops/assets/css/current/admin-s01-page-body-system-v1.css'),
              Path('theme/src/assets/css/admin/admin-s01-page-body-system-v1.css'),
              Path('m3u8/src/admin/ui-v4/admin-s01-page-body-system-v1.css'),
          ]
          for p in files:
              c=p.read_text()
              assert c.count('{')==c.count('}'), p
              assert 'linear-gradient(' not in c
              assert 'radial-gradient(' not in c
              assert 'conic-gradient(' not in c
              assert 'position:fixed' not in c.replace(' ','')
          print('PASS_PAGE_BODY_CSS_SAFETY')
          PY

      - name: PHP syntax touched presentation files
        run: |
          set -Eeuo pipefail
          find ops/includes ops/tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          find theme/src/inc/admin theme/tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          find m3u8/src/admin m3u8/tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
