name: P02 V2.5.5 Root Scroll Anchor Fix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v255-root-fix.yml'

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: maintenance/v2.5.5-editor-scroll-anchor-hotfix
          token: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'
          path: p02
          fetch-depth: 0
          persist-credentials: false

      - name: Patch auto-resize at root cause
        working-directory: p02
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/assets/app.js'); s=p.read_text(encoding='utf-8')
          old_generic="function syncGenericEditorSurface(){const source=$('.content-editor',root);if(!source||editorMode==='preview')return;source.style.height='auto';source.style.overflowY='hidden';source.style.resize='none';const base=editorMode==='split'?340:420;source.style.height=Math.max(base,source.scrollHeight+4)+'px';}"
          new_generic="function syncGenericEditorSurface(){const source=$('.content-editor',root);if(!source||editorMode==='preview')return;const scrollRoot=$('#main'),scrollTop=scrollRoot?scrollRoot.scrollTop:0;source.style.height='auto';source.style.overflowY='hidden';source.style.resize='none';const base=editorMode==='split'?340:420;source.style.height=Math.max(base,source.scrollHeight+4)+'px';if(scrollRoot&&scrollRoot.scrollTop<scrollTop)scrollRoot.scrollTop=scrollTop;}"
          old_article="function syncEditorSurface(){const source=$('#articleSource',root);if(!source)return;if(mode==='edit'||mode==='split'){source.style.height='auto';source.style.overflowY='hidden';source.style.resize='none';const base=mode==='split'?420:520;const viewportFloor=Math.max(base,(detail?detail.clientHeight:innerHeight)-(mode==='split'?210:185));source.style.height=Math.max(viewportFloor,source.scrollHeight+6)+'px';return;}source.style.height='';source.style.overflowY='';source.style.resize='';}"
          new_article="function syncEditorSurface(){const source=$('#articleSource',root);if(!source)return;if(mode==='edit'||mode==='split'){const scrollTop=detail?detail.scrollTop:0;source.style.height='auto';source.style.overflowY='hidden';source.style.resize='none';const base=mode==='split'?420:520;const viewportFloor=Math.max(base,(detail?detail.clientHeight:innerHeight)-(mode==='split'?210:185));source.style.height=Math.max(viewportFloor,source.scrollHeight+6)+'px';if(detail&&detail.scrollTop<scrollTop)detail.scrollTop=scrollTop;return;}source.style.height='';source.style.overflowY='';source.style.resize='';}"
          assert s.count(old_generic)==1, s.count(old_generic)
          assert s.count(old_article)==1, s.count(old_article)
          s=s.replace(old_generic,new_generic).replace(old_article,new_article)
          p.write_text(s,encoding='utf-8')
          PY
          node --check public/assets/app.js
          grep -Fq "scrollRoot=$('#main'),scrollTop" public/assets/app.js
          grep -Fq "const scrollTop=detail?detail.scrollTop:0" public/assets/app.js

      - name: Regenerate source manifest after root fix
        working-directory: p02
        run: |
          set -Eeuo pipefail
          DEP="$RUNNER_TEMP/deploy"; bash scripts/build-deploy-tree.sh "$DEP" >/dev/null
          python3 - "$DEP" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          dep=Path(sys.argv[1]); repo=Path.cwd(); old=json.loads((repo/'SOURCE_MANIFEST.json').read_text(encoding='utf-8'))
          mapping={e['full_path']:e['repo_path'] for e in old['entries']}; mapping['assets/v255-hotfix.js']='public/assets/v255-hotfix.js'
          out=[]
          for p in sorted(x for x in dep.rglob('*') if x.is_file()):
              rel=p.relative_to(dep).as_posix(); rp=repo/mapping[rel]; b=p.read_bytes(); rb=rp.read_bytes(); h=lambda x:hashlib.sha256(x).hexdigest()
              out.append({'full_path':rel,'repo_path':mapping[rel],'bytes':len(b),'sha256':h(b),'repo_sha256':h(rb)})
          data={'project':'P02 · VF Library','version':'2.5.5','schema':2401,'source_baseline_full_sha256':'PENDING_FORMAL_CANDIDATE_ARTIFACT','mapping_contract':'Each declared runtime source file must exist exactly once at repo_path; hashes bind the Git-native V2.5.5 candidate deploy tree. Formal release identity is not assigned by this candidate manifest.','runtime_source_file_count':len(out),'entries':out}
          (repo/'SOURCE_MANIFEST.json').write_text(json.dumps(data,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          assert len(out)==68
          PY

      - name: Commit root fix and manifest to product branch
        working-directory: p02
        env:
          GH_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          for PATHNAME in public/assets/app.js SOURCE_MANIFEST.json; do
            SHA=$(gh api "repos/llhzx2018/vf-library/contents/$PATHNAME?ref=maintenance/v2.5.5-editor-scroll-anchor-hotfix" --jq .sha)
            CONTENT=$(base64 -w0 "$PATHNAME")
            gh api -X PUT "repos/llhzx2018/vf-library/contents/$PATHNAME" \
              -f message='fix(v2.5.5): preserve scroll position during editor autoresize' \
              -f content="$CONTENT" -f sha="$SHA" -f branch='maintenance/v2.5.5-editor-scroll-anchor-hotfix' >/tmp/result.json
            test -n "$(jq -r '.commit.sha' /tmp/result.json)"
          done
          echo PRODUCT_ROOT_FIX_COMMIT=$(jq -r '.commit.sha' /tmp/result.json)
          echo PRODUCTION_WRITE=NO
