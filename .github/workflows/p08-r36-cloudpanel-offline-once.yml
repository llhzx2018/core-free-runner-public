name: P08 R36 exact-source CloudPanel offline and installed DB guard (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p08-r36-cloudpanel-offline-once.yml'
permissions:
  contents: read
jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      P08_SOURCE_SHA: cbba54efc1ef4e52cd618dc8dbb9a4caaa2e203a
    steps:
      - name: Checkout one exact P08 private source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-adops
          ref: cbba54efc1ef4e52cd618dc8dbb9a4caaa2e203a
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-product
      - name: Prove source identity before test
        run: |
          set -euo pipefail
          test "$(git -C private-product rev-parse HEAD)" = "$P08_SOURCE_SHA"
          test "$(cat private-product/VERSION)" = 0.1.1
          test ! -e private-product/.env
          echo "P08_R36_EXACT_SOURCE_SHA=$P08_SOURCE_SHA"
      - name: PHP 8.4 + pinned Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: pdo_mysql, pdo_sqlite, sqlite3, zip, mbstring, intl, bcmath, dom, fileinfo, sodium, posix
      - name: Node.js 22 for real target FULL build
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native fixture for stopped service and 3-engine real dotenv parsing
        working-directory: private-product
        run: |
          set -euo pipefail
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          composer install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/p08-r36-composer.log" 2>&1
          php -l src/Upgrade/CloudPanelOfflineGuard.php
          php -l src/Upgrade/InstalledDatabaseConfig.php
          php -l src/Upgrade/offline-bridge-cli.php
          php -l src/Upgrade/OfflineBridgeCoordinator.php
          bash -n scripts/cloudpanel_bridge_offline_once.sh
          if bash scripts/cloudpanel_bridge_offline_once.sh >/dev/null 2>&1; then
            echo 'P08_R36_ROOT_APPLY_GATE_BYPASSED'
            exit 1
          fi
          echo 'P08_R36_DORMANT_ROOT_SUPERVISOR_SYNTAX_AND_NO_ARGS_REFUSAL=PASS'
          php -l tests/test_cloudpanel_offline_contract.php
          php tests/test_cloudpanel_offline_contract.php
          php -l tests/test_owner_upgrade_worker_cron.php
          php tests/test_owner_upgrade_worker_cron.php
          echo "P08_R36_NEW_EXACT_PHP_MACHINE_PASS=YES"
      - name: Verify no web path or root service modification surface
        working-directory: private-product
        run: |
          set -euo pipefail
          test ! -e public/offline-bridge-cli.php
          test ! -e public/owner-upgrade-worker.php
          if grep -E '(systemctl (stop|start|restart|reload)|system\(|shell_exec\()' src/Upgrade/CloudPanelOfflineGuard.php src/Upgrade/offline-bridge-cli.php; then
            echo 'P08_R36_FORBIDDEN_SERVICE_WRITE=YES'
            exit 1
          fi
          echo 'P08_R36_SERVICE_MODIFICATION=NONE'
          echo 'P08_R36_REAL_CLOUDPANEL_STOP_DRAIN=NOT_PROVEN'
      - name: Build genuine self-contained 0.1.1 FULL with verified R36 site CLI/worker
        working-directory: private-product
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-r36-npm.log" 2>&1
          npm run build
          npm run typecheck
          python3 scripts/check_stack_contract.py --phase full
          python3 scripts/build_full.py --source "$PWD" --output "$RUNNER_TEMP/p08-r36-target-full.zip" --version 0.1.1 --source-sha "$P08_SOURCE_SHA"
          mkdir "$RUNNER_TEMP/p08-r36-extract"
          unzip -qq "$RUNNER_TEMP/p08-r36-target-full.zip" -d "$RUNNER_TEMP/p08-r36-extract"
          php -r 'require "src/Installation/SetupGuard.php"; VF\AdOps\Installation\SetupGuard::package($argv[1]); echo "P08_R36_REAL_EXTRACTED_TARGET_FULL=PASS\n";' "$RUNNER_TEMP/p08-r36-extract"
          test -f "$RUNNER_TEMP/p08-r36-extract/src/Upgrade/offline-bridge-cli.php"
          test -f "$RUNNER_TEMP/p08-r36-extract/src/Upgrade/CloudPanelOfflineGuard.php"
          test -f "$RUNNER_TEMP/p08-r36-extract/src/Upgrade/owner-upgrade-worker.php"
          test ! -e "$RUNNER_TEMP/p08-r36-extract/.env"
          echo "P08_R36_FULL_SHA256=$(sha256sum "$RUNNER_TEMP/p08-r36-target-full.zip" | cut -d' ' -f1)"
          echo "P08_R36_FULL_BYTES=$(stat -c%s "$RUNNER_TEMP/p08-r36-target-full.zip")"
          echo 'P08_R36_BRIDGE_CLI_INCLUDED_IN_REAL_FULL=PASS'
      - name: Erase temporary private checkout and logs
        if: always()
        run: |
          rm -rf private-product "$RUNNER_TEMP/p08-r36-extract"
          rm -f "$RUNNER_TEMP/p08-r36-composer.log" "$RUNNER_TEMP/p08-r36-npm.log" "$RUNNER_TEMP/p08-r36-target-full.zip"
