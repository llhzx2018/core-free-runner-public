name: S01 C02 1.21.1109 tools advanced-only formal release
on:
  push:
    branches: [task/s01-c02-1211106-real-wp-tools-css-20261012]
    paths: [.github/workflows/s01-c02-1211109-formal-20261013.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_SHA: 04da145cb79b87a1abc77edff4f7ec7ed8fa8bff
      CANDIDATE_SHA: 7b58592732f8e4d47d473c2b2d71e1bffcd6232a
      VERSION: '1.21.1109'
      ASSET_SHA: e6e2c0dbf566afc52b80709b53afb381827b2c2a824722006a6f97855b08e200
      TARGET_REPO: llhzx2018/vf-tools-ops
    steps:
      - name: Checkout exact promoted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 04da145cb79b87a1abc77edff4f7ec7ed8fa8bff
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product
      - name: Revalidate immutable merge, machine proof, and deterministic package
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$TARGET_SHA"
          test "$(cat product/VERSION)" = "$VERSION"
          git -C product merge-base --is-ancestor "$CANDIDATE_SHA" HEAD
          mkdir -p proof
          python3 product/.github/release/build-ops-package.py --source product --output "proof/vf-tools-ops_V1.21.1109.zip" > proof/package.json
          python3 product/.github/release/build-ops-package.py --source product --output "proof/rebuild.zip" > proof/rebuild.json
          cmp proof/vf-tools-ops_V1.21.1109.zip proof/rebuild.zip
          echo "$ASSET_SHA  proof/vf-tools-ops_V1.21.1109.zip" | sha256sum -c -
          python3 - <<'PY'
          import json,zipfile
          p=json.load(open('proof/package.json'))
          assert p['version']=='1.21.1109' and p['runtime_files']==990
          assert p['asset_sha256']=='e6e2c0dbf566afc52b80709b53afb381827b2c2a824722006a6f97855b08e200'
          with zipfile.ZipFile('proof/vf-tools-ops_V1.21.1109.zip') as z:
              assert z.testzip() is None
              assert all(x.startswith('vf-ops/') and '..' not in x.split('/') for x in z.namelist())
          print('EXACT_MERGED_FORMAL_PACKAGE_PASS')
          PY
      - name: Verify public source-candidate WordPress machine run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          proof=$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/38332852913 --jq '.conclusion')
          test "$proof" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/38332852913 --jq '.head_sha')" = 5dc1ffcd9a419023fdf4336c8631f33b716e6b40
          echo EXACT_PUBLIC_CANDIDATE_MACHINE_PROOF=PASS
      - name: Publish one immutable formal GitHub release
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          # Match the exact private commit-read endpoint proven by formal 1.21.1106.
          # A live main check is still required; do not skip authorization failures.
          live_main=$(gh api "repos/$TARGET_REPO/commits/main" --jq '.sha')
          test "$live_main" = "$TARGET_SHA"
          remote_commit=$(gh api "repos/$TARGET_REPO/commits/$TARGET_SHA" --jq '.sha')
          test "$remote_commit" = "$TARGET_SHA"
          if gh release view "v$VERSION" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            echo 'Existing release version cannot be overwritten'; exit 1
          fi
          if gh api "repos/$TARGET_REPO/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo 'Existing tag version cannot be moved'; exit 1
          fi
          cat > proof/release-notes.md <<'NOTES'
          # VF Tools Ops 1.21.1109 · M3U8 Downloader 高级工具信息展开区布局
          
          OWNER 在 1.21.1108 的实际 WordPress 页面截图发现：收起摘要已经改善，但展开后三项指标和操作按钮仍为未分组文字。本版仅在 Ops Tools route-only CSS 中修复真实高级信息展开区。
          
          - 代码 PR #406；正式合并提交 04da145cb79b87a1abc77edff4f7ec7ed8fa8bff。
          - 展开区三个字段分成清晰数据格、保留原始阻断诊断容器、两个动作独立排列，窄屏单列布局。冻结公共 R18 Page Frame / Shell / Header / Header Menu 未修改，VF 青绿勾选延续 1.21.1108。
          - 精确运行包仅两文件变化：assets/css/current/admin-s01-tools-r17.css、vf-ops.php。Provider canonical 数据、Auth、Nonce、Revision、Schema 6.0.0、更新协议均不变。
          - 隔离 Runner #38332852913 SUCCESS：真实 WordPress 7.1.3/MariaDB/Provider 1.25.84、1.21.1108→1109→1108→1109、整份 Provider 配置指纹保全、四宽度真实浏览器现有交互 + 8 组合成 UI 通过。展开区真实生产视觉需 OWNER 升级后最后截图复验。
          - 安装 ZIP vf-tools-ops_V1.21.1109.zip；990 运行文件、3,580,162 bytes、SHA-256 e6e2c0dbf566afc52b80709b53afb381827b2c2a824722006a6f97855b08e200。
          - 六项设置的实际 POST 保存/权限、Nonce、Revision 拒绝独立专项仍 UNVERIFIED，不宣告通过。Production 仅 OWNER 手工升级。
          NOTES
          gh release create "v$VERSION" "proof/vf-tools-ops_V1.21.1109.zip" --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Ops 1.21.1109 · 高级工具信息展开区修复' --notes-file proof/release-notes.md --latest
          echo FORMAL_RELEASE_CREATED=PASS
      - name: Verify remote release tag and exact asset bytes
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(gh api "repos/$TARGET_REPO/git/ref/tags/v$VERSION" --jq '.object.sha')" = "$TARGET_SHA"
          test "$(gh api "repos/$TARGET_REPO/releases/tags/v$VERSION" --jq '.draft')" = false
          mkdir -p proof/remote
          gh release download "v$VERSION" --repo "$TARGET_REPO" --pattern 'vf-tools-ops_V1.21.1109.zip' --dir proof/remote
          cmp proof/vf-tools-ops_V1.21.1109.zip proof/remote/vf-tools-ops_V1.21.1109.zip
          echo "$ASSET_SHA  proof/remote/vf-tools-ops_V1.21.1109.zip" | sha256sum -c -
          echo REMOTE_ASSET_IMMUTABLE_SHA_READBACK_PASS
      - name: Upload nonsecret proof only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-1107-formal-proof-${{ github.run_id }}
          path: |
            proof/package.json
            proof/rebuild.json
            proof/release-notes.md
          if-no-files-found: warn
          retention-days: 10
