name: P01 V2.24 UX Authority Sync V2

on:
  push:
    branches:
      - task/p01-v222-multi-surface-gate-20260828
    paths:
      - '.github/workflows/p01-v224-ux-authority-sync-v2-20260828.yml'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      FEATURE_BRANCH: feature/p01-ux-rebaseline-v224-20260828
      EXACT_SOURCE: c96178b1112dca20af0b15b557a54abcb4211bed
      GATE_RUN: '33151873413'
    steps:
      - name: Checkout runner scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: task/p01-v222-multi-surface-gate-20260828
          persist-credentials: false
      - name: Clone exact P01 branch
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone -q --branch "$FEATURE_BRANCH" "https://x-access-token:${WRITE_TOKEN}@github.com/${PRODUCT_REPO}.git" p01
          test "$(git -C p01 rev-parse HEAD)" = "$EXACT_SOURCE"
      - name: Apply current authority sync
        run: |
          set -Eeuo pipefail
          cd p01
          python3 ../.github/scripts/p01_v224_authority_sync.py
          git status --short
      - name: Commit and push docs-only sync
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          cd p01
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add README.md CHANGELOG.md VF_PROJECT.json docs/README.md docs/authority/CURRENT.md docs/authority/RPD.md docs/authority/SSOT.md docs/authority/ACCEPTANCE_MATRIX.md docs/architecture/P01_MULTI_SURFACE_ARCHITECTURE.md docs/evidence/P01_V2.24.0_UX_REBASELINE_MACHINE_20260828.md
          git diff --cached --quiet && { echo P01_V224_AUTHORITY_ALREADY_SYNCED=YES; exit 0; }
          git commit -m 'docs: sync P01 V2.24 UX rebaseline authority'
          git push origin "$FEATURE_BRANCH"
          echo P01_V224_AUTHORITY_SYNC=PASS
          echo NEW_HEAD=$(git rev-parse HEAD)
