name: P05 Site Instance Fresh Install Exact Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  exact-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      P05_EXACT_SOURCE: c01b1ccbbb0f220b84241ba60fbf7472c1d5db52
    steps:
      - name: Checkout runner source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout exact private P05 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: c01b1ccbbb0f220b84241ba60fbf7472c1d5db52
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: p05

      - name: Verify exact source
        working-directory: p05
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$P05_EXACT_SOURCE"
          test "$(cat VERSION)" = '1.1.8'
          node -e "const p=require('./package.json'); if(p.version!=='1.1.8') process.exit(1)"
          node -e "const p=require('./VF_PROJECT.json'); if(p.version!=='1.1.8'||p.target_version!=='1.1.8'||p.working_version!=='1.1.8') process.exit(1)"
          echo "P05_EXACT_SOURCE=$P05_EXACT_SOURCE"
          echo "VERSION=1.1.8"

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: p05/package-lock.json

      - name: Install dependencies
        working-directory: p05
        run: npm ci

      - name: Source and static quality gates
        working-directory: p05
        run: |
          set -euo pipefail
          npm run release:source:gate
          npm run lint
          npm run typecheck
          php -v
          php -l php/src/RuntimePaths.php
          php -l php/src/SiteInstance.php
          php -l php/src/FreshInstallRecovery.php
          php -l php/src/setup-bootstrap.php
          php -l php/src/LegacyBrowserTakeover.php
          php -l php/src/Installer.php

      - name: Build application and formal FULL staging
        working-directory: p05
        run: |
          set -euo pipefail
          npm run build
          npm run build:php-release
          npm run php:release:gate

      - name: CloudPanel HOME and no-store contract
        working-directory: p05
        run: |
          set -euo pipefail
          bash php/tests/cloudpanel-fpm-home-cache-smoke.sh

      - name: Formal FULL same-version reinstall real environment closure
        working-directory: p05
        run: |
          set -euo pipefail
          VF_INSTALL_ROOT=build/vf-seo-php-release bash php/tests/cloudpanel-fpm-real-install-smoke.sh

      - name: Browser-first regression
        working-directory: p05
        run: |
          set -euo pipefail
          VF_INSTALL_ROOT=build/vf-seo-php-release bash php/tests/browser-install-smoke.sh

      - name: Real Chrome regression
        working-directory: p05
        run: |
          set -euo pipefail
          google-chrome --version
          "$CHROMEWEBDRIVER/chromedriver" --version
          VF_INSTALL_ROOT=build/vf-seo-php-release python3 php/tests/browser-install-e2e.py

      - name: Machine receipt
        run: |
          echo 'P05_V118_SITE_INSTANCE_FRESH_INSTALL_MACHINE=PASS'
          echo 'P05_EXACT_SOURCE=c01b1ccbbb0f220b84241ba60fbf7472c1d5db52'
          echo 'VERSION=1.1.8'
          echo 'SITE_INSTANCE_IDENTITY=PASS'
          echo 'SAME_VERSION_WEBROOT_REINSTALL=PASS'
          echo 'LOGIN_HISTORY_REINSTALL=PASS'
          echo 'HOME_UNSET_POSIX_FALLBACKS=PASS'
          echo 'CLOUDFLARE_LIKE_NOSTORE=PASS'
          echo 'RUNTIME_IDENTITY_HEADERS=PASS'
          echo 'EXISTING_DATA_PROTECTION=PASS'
          echo 'BROWSER_FIRST_INSTALL=PASS'
          echo 'CHROME_E2E=PASS'
          echo 'RELEASE_WRITE=0'
          echo 'PRODUCTION_WRITE=0'
