name: P01 V2.24 Branding Cohesion Gate

on:
  push:
    branches:
      - task/p01-v222-multi-surface-gate-20260828
    paths:
      - '.github/workflows/p01-v224-branding-cohesion-gate-20260828.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      FEATURE_BRANCH: feature/p01-v224-branding-cohesion-20260828
      EXACT_SOURCE: 5941e62717b9fa5509df24175a1676e1127b6926
      BASE_DEVELOP: 537c96c569203b09bfdec563aef8daf7b105e424
    steps:
      - name: Checkout exact branding source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.EXACT_SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: p01
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - name: Exact identity and scope
        env:
          READ_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p01
          test "$(git rev-parse HEAD)" = "$EXACT_SOURCE"
          test "$(git ls-remote "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "refs/heads/${FEATURE_BRANCH}" | awk '{print $1}')" = "$EXACT_SOURCE"
          test "$(git ls-remote "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" refs/heads/develop | awk '{print $1}')" = "$BASE_DEVELOP"
          mapfile -t files < <(git diff --name-only "$BASE_DEVELOP...$EXACT_SOURCE")
          printf '%s\n' "${files[@]}"
          test "${#files[@]}" -eq 2
          printf '%s\n' "${files[@]}" | grep -Fx 'src/app/SurfaceShell.php'
          printf '%s\n' "${files[@]}" | grep -Fx 'src/assets/surface-branding.css'
          echo P01_V224_BRANDING_SCOPE=PASS
      - name: Syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          find p01/src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find p01/src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          echo P01_V224_BRANDING_SYNTAX=PASS
      - name: Fresh install and branding authority contract
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-v224-brand /tmp/p01-v224-brand.cookies
          cp -a p01/src /tmp/p01-v224-brand
          cd /tmp/p01-v224-brand
          php -S 127.0.0.1:18240 -t . >/tmp/p01-v224-brand-server.log 2>&1 & echo $! >/tmp/p01-v224-brand.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18240/setup.php -o /tmp/p01-v224-setup.html && break; sleep 1; done
          curl -fsS -c /tmp/p01-v224-brand.cookies -b /tmp/p01-v224-brand.cookies http://127.0.0.1:18240/setup.php -o /tmp/p01-v224-setup.html
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-v224-setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c /tmp/p01-v224-brand.cookies -b /tmp/p01-v224-brand.cookies -X POST http://127.0.0.1:18240/setup.php --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=VF Start Branding Gate' --data-urlencode 'admin_password=P01V224!Branding' --data-urlencode 'admin_password_confirm=P01V224!Branding' -o /tmp/p01-v224-setup-post.html
          curl -fsS -c /tmp/p01-v224-brand.cookies -b /tmp/p01-v224-brand.cookies -H 'Content-Type: application/json' -X POST 'http://127.0.0.1:18240/api.php?action=login' --data '{"password":"P01V224!Branding"}' -o /tmp/p01-v224-login.json
          jq -e '.ok==true and (.csrf|length)>10' /tmp/p01-v224-login.json >/dev/null
          AUTH_CSRF=$(jq -r '.csrf' /tmp/p01-v224-login.json)
          curl -fsS -c /tmp/p01-v224-brand.cookies -b /tmp/p01-v224-brand.cookies http://127.0.0.1:18240/surfaces.php -o /tmp/p01-v224-default.html
          grep -F '<span class="vf-brand-mark">VF</span>' /tmp/p01-v224-default.html >/dev/null
          grep -F 'surface-branding.css' /tmp/p01-v224-default.html >/dev/null
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9Z1ZkAAAAASUVORK5CYII=' | base64 -d >/tmp/p01-v224-logo.png
          curl -fsS -c /tmp/p01-v224-brand.cookies -b /tmp/p01-v224-brand.cookies -H "X-CSRF-Token: $AUTH_CSRF" -X POST 'http://127.0.0.1:18240/api.php?action=brand_upload&type=logo' -F 'asset=@/tmp/p01-v224-logo.png;type=image/png' -o /tmp/p01-v224-upload.json
          jq -e '.ok==true and .branding.hasLogo==true and (.branding.logoUrl|length)>0' /tmp/p01-v224-upload.json >/dev/null
          curl -fsS -c /tmp/p01-v224-brand.cookies -b /tmp/p01-v224-brand.cookies http://127.0.0.1:18240/surfaces.php -o /tmp/p01-v224-custom.html
          grep -F 'vf-brand-mark has-custom-logo' /tmp/p01-v224-custom.html >/dev/null
          grep -F '<img src=' /tmp/p01-v224-custom.html >/dev/null
          grep -F 'P01 · 个人互联网入口' /tmp/p01-v224-custom.html >/dev/null
          grep -F '管理设置' /tmp/p01-v224-custom.html >/dev/null
          curl -fsS -c /tmp/p01-v224-brand.cookies -b /tmp/p01-v224-brand.cookies -H "X-CSRF-Token: $AUTH_CSRF" -H 'Content-Type: application/json' -X POST 'http://127.0.0.1:18240/api.php?action=brand_delete' --data '{"type":"logo"}' -o /tmp/p01-v224-delete.json
          jq -e '.ok==true and .branding.hasLogo==false' /tmp/p01-v224-delete.json >/dev/null
          curl -fsS -c /tmp/p01-v224-brand.cookies -b /tmp/p01-v224-brand.cookies http://127.0.0.1:18240/start.php -o /tmp/p01-v224-start.html
          grep -F '<span class="vf-brand-mark">VF</span>' /tmp/p01-v224-start.html >/dev/null
          php cli/verify.php | grep -Fx 'VERIFY_PASS=YES'
          php cli/surface-verify.php | grep -Fx 'MULTI_SURFACE_PASS=YES'
          php cli/baseline-verify.php | tee /tmp/p01-v224-baseline.txt
          grep -Fx 'BASELINE_CORE_PASS=YES' /tmp/p01-v224-baseline.txt
          grep -Fx 'DRIFT_COUNT=0' /tmp/p01-v224-baseline.txt
          grep -Fx 'UNKNOWN_COUNT=0' /tmp/p01-v224-baseline.txt
          test "$(php -r "require 'app/bootstrap.php'; echo strtolower((string)vf_db()->query('PRAGMA integrity_check')->fetchColumn());")" = ok
          test "$(php -r "require 'app/bootstrap.php'; echo count(vf_db()->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC));")" = 0
          kill "$(cat /tmp/p01-v224-brand.pid)" 2>/dev/null || true
          echo P01_V224_BRANDING_RUNTIME=PASS
      - name: Verdict
        shell: bash
        run: |
          echo P01_V224_BRANDING_EXACT_SOURCE="$EXACT_SOURCE"
          echo P01_V224_BRANDING_MACHINE=PASS
          echo RELEASE=NO
          echo PRODUCTION=NO
