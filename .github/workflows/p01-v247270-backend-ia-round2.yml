name: P01 V2.47.270 Backend IA Round 2 Proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p01-v247270-backend-ia-round2.yml"

permissions:
  contents: read

# One-off exact-source proof lane; close PR without merge after evidence readback.

jobs:
  proof:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'proof(P01): V2.47.270 backend IA round 2')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout proof control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd nodejs >/dev/null

      - name: Clone exact candidate and baseline
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" candidate
          git -C candidate fetch -q origin 1022171f6c1e9e63e5c779eafc6cb90038d884e7
          git -C candidate checkout -q --detach 1022171f6c1e9e63e5c779eafc6cb90038d884e7
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.270"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "2.47.270"
          grep -F "define('VF_VERSION', '2.47.270');" candidate/src/app/bootstrap.php

          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" baseline
          git -C baseline fetch -q origin 36fafaeb210b9f1e07f21e9b3659368ac0ac26a8
          git -C baseline checkout -q --detach 36fafaeb210b9f1e07f21e9b3659368ac0ac26a8
          echo P01_V247270_EXACT_SOURCE=PASS

      - name: Syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l candidate/src/manage.php
          php -l candidate/src/surface-manager.php
          php -l candidate/src/app/Repository.php
          php -l candidate/src/app/bootstrap.php
          node --check candidate/src/assets/admin-resource-manager-core.js
          node --check candidate/src/assets/pending-delete-undo.js
          node --check candidate/src/assets/pending-inbox-ux.js
          echo P01_V247270_SYNTAX=PASS

      - name: Focused Round 2 contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          tests=(
            tests/unit/backend_ia_round2_overview_v247270_contract.php
            tests/unit/backend_ia_round2_pending_v247270_contract.php
            tests/unit/backend_ia_round2_all_resources_v247270_contract.php
            tests/unit/backend_ia_round1_v247269_contract.php
            tests/unit/admin_overview_actionable_health_contract.php
            tests/unit/admin_overview_ia_contract.php
            tests/unit/admin_overview_page1_polish_contract.php
            tests/unit/pending_page_visual_closure_contract.php
            tests/unit/pending_inbox_presentation_contract.php
            tests/unit/pending_category_picker_v247254_contract.php
            tests/unit/pending_category_hierarchy_v247255_contract.php
            tests/unit/pending_category_picker_freeze_v247256_contract.php
            tests/unit/pending_action_input_guard_v247258_contract.php
            tests/unit/pending_duplicate_hints_source_contract.php
            tests/unit/pending_one_pass_triage_contract.php
            tests/unit/pending_one_pass_triage_source_contract.php
            tests/unit/pending_pagination_authority_contract.php
            tests/unit/pending_delete_contract.php
            tests/unit/pending_list_action_continuity_contract.php
            tests/unit/pending_focus_isolation_contract.php
            tests/unit/pending_focus_manual_domain_contract.php
            tests/unit/pending_focus_primary_alignment_contract.php
            tests/unit/pending_focus_skip_continuity_contract.php
            tests/unit/all_resources_v247261_closure_contract.php
            tests/unit/all_resources_page_visual_closure_contract.php
            tests/unit/all_resources_editor_state_contract.php
            tests/unit/admin_all_resources_mature_list_contract.php
            tests/unit/admin_all_resources_page3_polish_contract.php
            tests/unit/admin_resource_browse_edit_r5_contract.php
            tests/unit/resource_manager_pagination_context_contract.php
            tests/unit/resource_manager_save_continuity_contract.php
            tests/unit/resource_search_contract.php
            tests/unit/six_resource_admin_manager_contract.php
          )
          for t in "${tests[@]}"; do php "$t"; done
          echo P01_V247270_FOCUSED=PASS

      - name: Canonical regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate baseline --require-zero-debt | tee /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/canonical.txt
          echo P01_V247270_CANONICAL=PASS

      - name: Bounded scope
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C candidate diff --name-only 36fafaeb210b9f1e07f21e9b3659368ac0ac26a8..1022171f6c1e9e63e5c779eafc6cb90038d884e7 | tee /tmp/changed.txt
          if grep -E '(^|/)(migrations|schema|auth|security|update|install|setup)' /tmp/changed.txt; then
            echo "Unexpected high-risk scope"
            exit 1
          fi
          echo BACKEND_IA_ROUND2=YES
          echo FORMAL_RELEASE_CALLED=NO
          echo DISTRIBUTION_WRITE=NO
          echo PRODUCTION_WRITE=NO
