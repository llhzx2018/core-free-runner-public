name: P07 Care rc47 WordPress status first and safe evidence summary
on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/p07-system-care/0.1.0-rc47/**'
      - 'tests/test_p07_wp_summary_rc47.py'
      - 'installers/p07-toolbox.sh'
      - 'installers/p07-system-care.sh'
      - '.github/workflows/p07-care-rc47-wp-summary-gate.yml'
permissions:
  contents: read
jobs:
  evidence-ux:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Read-only summary keeps complete source evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          pkg='packages/p07-system-care/0.1.0-rc47'
          test "$(cat "$pkg/VERSION")" = '0.1.0-rc47'
          test "$(git hash-object "$pkg/MANIFEST.gitblob")" = '44e39f47baf34f4d49feefcac0e95acf58854402'
          (cd "$pkg" && while read -r digest path; do test "$(git hash-object "$path")" = "$digest"; done < MANIFEST.gitblob)
          bash -n "$pkg/vf-system-care.sh" "$pkg/intrusion-evidence.sh" "$pkg/intrusion-evidence-entry.sh"
          python3 -m py_compile "$pkg/lib/intrusion_evidence.py"
          python3 -m unittest discover -s tests -p test_p07_wp_summary_rc47.py -v
          grep -Fq 'run_action intrusion-evidence-entry.sh menu' "$pkg/vf-system-care.sh"
          ! grep -Fq 'run_action intrusion-evidence-entry.sh direct' "$pkg/vf-system-care.sh"
          grep -Fq 'helper report --summary' "$pkg/intrusion-evidence.sh"
          grep -Fq 'helper report --limit 20' "$pkg/intrusion-evidence.sh"
          grep -Fq '5. 查看完整异常记录' "$pkg/intrusion-evidence.sh"
          grep -Fq 'confirm_numeric' "$pkg/intrusion-evidence.sh"
          grep -Fq 'show_summary' "$pkg/intrusion-evidence.sh"
          grep -Fq 'load_events_consistent' "$pkg/lib/intrusion_evidence.py"
          grep -Fq "p.add_argument(\"--summary\", action=\"store_true\")" "$pkg/lib/intrusion_evidence.py"
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc52"' installers/p07-toolbox.sh
          grep -Fq "VERSION='0.1.0-rc52'" installers/p07-system-care.sh
          grep -Fq "MANIFEST_BLOB='d32c9dc5eba1e517e2cc5f7f3876d6bf694dcc4b'" installers/p07-system-care.sh
          grep -Fq 'VF_NODE_EXPECTED="0.1.0-rc13"' installers/p07-toolbox.sh
          grep -Fq 'VPS_AUDIT_EXPECTED="V2.1.0"' installers/p07-toolbox.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release84"' installers/p07-toolbox.sh
          echo P07_RC47_WORDPRESS_SAFE_ONE_SCREEN=PASS
