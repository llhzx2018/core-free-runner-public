name: P07 Issue287 isolated release116 RC1 install and rollback
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p07-issue287-release116-rc1-install-rollback.yml']
permissions:
  contents: read
jobs:
  candidate_rollback:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact private P07 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: e1126625213bd3a759a17e219e5ff23e036cd31e
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: _p07_issue287
      - name: Checkout published release115 public installer baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 54aa79ae4556bf9957fbddf60b4fdd52ad841b79
          persist-credentials: false
          path: _p07_public114
      - name: Exact-source release116-rc1 candidate manifests and real local 114-to-115 upgrade rollback
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          P07_ALLOW_NONROOT: "1"
          P07_NO_EXEC: "1"
        run: |
          set -Eeuo pipefail
          test "$(git -C _p07_issue287 rev-parse HEAD)" = e1126625213bd3a759a17e219e5ff23e036cd31e
          test "$(git -C _p07_public114 rev-parse HEAD)" = 54aa79ae4556bf9957fbddf60b4fdd52ad841b79
          python3 -B _p07_issue287/scripts/p07_candidate_bundle.py \
            --product-root _p07_issue287 \
            --public-root _p07_public114 \
            --output _p07_candidate116 \
            --product-sha e1126625213bd3a759a17e219e5ff23e036cd31e \
            --build 0.1.0-release116-rc1 \
            --care 0.1.0-rc83
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('_p07_candidate116')
          data=json.loads((root/'candidate_attestation.json').read_text())
          assert data['status']=='CANDIDATE_ONLY_NOT_PUBLISHED'
          assert data['product_source_sha']=='e1126625213bd3a759a17e219e5ff23e036cd31e'
          assert data['product_build']=='0.1.0-release116-rc1'
          assert data['system_care_build']=='0.1.0-rc83'
          assert not any(data['negative'].values())
          base=root/'dist/p07/0.1.0/overlay'
          def blob(path):
            b=path.read_bytes()
            return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          def check_manifest(name):
            entries=set()
            for row in (base/name).read_text().splitlines():
              digest,rel=row.split('  ',1)
              assert rel not in entries
              entries.add(rel)
              f=base/rel
              assert f.is_file() and not f.is_symlink() and blob(f)==digest,rel
            return entries
          runtime=check_manifest('RUNTIME.gitblob')
          complete=check_manifest('MANIFEST.gitblob')
          assert runtime<=complete
          assert 'lib/migration_private_sql_repro.py' in runtime
          assert 'lib/migration_private_sql_semantics.py' in runtime
          assert 'tests/test_issue287_private_repro.py' in complete
          assert 'tests/test_issue287_existing_private_semantics.py' in complete
          assert data['runtime_manifest_blob']==blob(base/'RUNTIME.gitblob')
          assert data['overlay_manifest_blob']==blob(base/'MANIFEST.gitblob')
          assert data['final_installer_blob']==blob(root/'installers/p07-final.sh')
          assert (base/'BUILD_ID').read_text().strip()=='0.1.0-release116-rc1'
          assert 'inspect-existing-private-sql' in (base/'bin/vfops-migrate-ui').read_text()
          assert 'PRIVATE_MINIMAL_REPRO_CAPTURED_NOT_VERIFIED' in (base/'lib/migration_private_sql_repro.py').read_text()
          assert "VFOPS_BUILD_EXPECTED='0.1.0-release116-rc1'" in (root/'packages/p07-system-care/0.1.0-rc83/vf-system-care.sh').read_text()
          print('P07_116_RC1_PRIVATE_DIAGNOSTIC_CANDIDATE_RUNTIME_AND_MANIFESTS_PASS')
          PY
          bash -n _p07_candidate116/installers/p07-final.sh \
            _p07_candidate116/installers/p07.sh \
            _p07_candidate116/installers/p07-toolbox.sh \
            _p07_candidate116/installers/p07-system-care.sh
          sandbox="$(mktemp -d -t p07-issue287-upgrade.XXXXXX)"
          trap 'rm -rf -- "$sandbox"' EXIT
          export P07_INSTALL_DIR="$sandbox/installed"
          export P07_PREVIOUS_DIR="$sandbox/previous"
          export P07_BIN_LINK="$sandbox/vfops"
          export P07_PUBLIC_ROOT="file://$GITHUB_WORKSPACE/_p07_public114"
          bash _p07_public114/installers/p07-final.sh >"$sandbox/install115.log" 2>&1
          test "$(NO_COLOR=1 "$P07_BIN_LINK" --build-id)" = 0.1.0-release115
          mkdir "$sandbox/invalid-bin-link"
          export P07_PUBLIC_ROOT="file://$GITHUB_WORKSPACE/_p07_candidate116"
          if P07_BIN_LINK="$sandbox/invalid-bin-link" \
            bash _p07_candidate116/installers/p07-final.sh >"$sandbox/rejected-upgrade.log" 2>&1; then
            echo P07_116_RC1_FAILURE_INJECTION_SHOULD_BLOCK >&2
            exit 1
          fi
          test "$(NO_COLOR=1 "$P07_BIN_LINK" --build-id)" = 0.1.0-release115
          bash _p07_candidate116/installers/p07-final.sh >"$sandbox/upgrade116.log" 2>&1
          test "$(NO_COLOR=1 "$P07_BIN_LINK" --build-id)" = 0.1.0-release116-rc1
          test "$(NO_COLOR=1 bash "$P07_PREVIOUS_DIR/bin/vfops-user" --build-id)" = 0.1.0-release115
          test -f "$P07_INSTALL_DIR/lib/migration_private_sql_repro.py"
          test -f "$P07_INSTALL_DIR/lib/migration_private_sql_semantics.py"
          grep -Fq -- "inspect-existing-private-sql" "$P07_INSTALL_DIR/bin/vfops-migrate-ui"
          NO_COLOR=1 "$P07_BIN_LINK" server-migrate inspect-existing-private-sql --help >"$sandbox/diagnostic-help.log"
          grep -Fq -- '--migration-id' "$sandbox/diagnostic-help.log"
          digest="$(sha256sum "$P07_INSTALL_DIR/.runtime-manifest.gitblob")"
          bash _p07_candidate116/installers/p07-final.sh >"$sandbox/noop.log" 2>&1
          test "$(sha256sum "$P07_INSTALL_DIR/.runtime-manifest.gitblob")" = "$digest"
          echo P07_116_RC1_LOCAL_REAL_INSTALL_UPGRADE_ROLLBACK_IDEMPOTENT_PASS
          echo P07_116_RC1_CP2_AND_SOURCE_BUSINESS_WRITES=NONE
      - name: Cleanup private source unconditionally
        if: always()
        shell: bash
        run: |
          rm -rf -- _p07_issue287 _p07_public114 _p07_candidate116
          echo P07_ISSUE287_PRIVATE_SOURCE_CLEANED
