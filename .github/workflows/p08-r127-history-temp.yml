name: P08 R127 exact-source Owner history handoff rootless fault tests (TEMP)
on:
  pull_request:
    paths: [.github/workflows/p08-r127-history-temp.yml]
permissions:
  contents: read
jobs:
  rootless-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - name: Isolated PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: posix,sqlite3,pdo_sqlite
      - name: Exact temporary private source checkout (no credential persisted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 783cb924717426a99107f93777214d9e148f275e
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p08-source
          persist-credentials: false
      - name: Verify historical upgrade handoff, abort and crash recovery
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rm -rf -- "$GITHUB_WORKSPACE/p08-source"' EXIT
          cd p08-source
          test "$(git rev-parse HEAD)" = 783cb924717426a99107f93777214d9e148f275e
          php -l src/Upgrade/R127OwnerArchiveIntegrity.php
          php -l src/Upgrade/R127OwnerCycleHandoff.php
          php -l src/Upgrade/R126Installed013Source.php
          php -l tests/test_r127_owner_cycle_handoff.php
          php tests/test_r127_owner_cycle_handoff.php
          php tests/test_r126_installed_013_source.php
          php tests/test_owner_site_worker_dispatcher.php
          php tests/test_owner_upgrade_transport.php
          php tests/test_owner_release_discovery_controller.php
          echo P08_R127_ROOTLESS_HISTORY_LOSSLESS_REPLAY_AND_INTERRUPT=PASS
      - name: Always remove transient private checkout
        if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/p08-source"
