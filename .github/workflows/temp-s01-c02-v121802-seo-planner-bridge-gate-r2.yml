name: TEMP S01-C02 Ops 1.21.802 SEO Planner Bridge Gate R2

on:
  push:
    branches:
      - temp/s01-c02-v121802-seo-planner-bridge-gate-20260904
    paths:
      - '.github/workflows/temp-s01-c02-v121802-seo-planner-bridge-gate-r2.yml'

permissions:
  contents: read

jobs:
  planner-bridge-gate-r2:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: vf_ops_gate
          MARIADB_USER: vf
          MARIADB_PASSWORD: vf
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      OPS_BASE_SHA: 897d34c3153ca2a6d7cfa289cca7fd9966062f17
      OPS_CANDIDATE_SHA: 11163b7833ec4908b9593ddf424c9bfe39db4975
      OPS_CANDIDATE_TREE: 3d569e4f0e13e357b09947153e1b59e20d34a9eb
      BASE_RELEASE_ASSET_ID: '544086359'
      BASE_RELEASE_BYTES: '3203056'
      BASE_RELEASE_SHA256: e0491a69ddcd794821d8a95ca3760e7a32d1fcc1cd8fd100e0e3b5d9609c598f
      WP_PATH: /tmp/vf-ops-v121802-r2-wp
      EVIDENCE_DIR: /tmp/vf-ops-v121802-r2-evidence
      CANDIDATE_ZIP: /tmp/vf-tools-ops_V1.21.802-r2.zip
    steps:
      - name: Checkout exact Production base source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.OPS_BASE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: ops-base

      - name: Checkout exact Candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.OPS_CANDIDATE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: ops-candidate

      - name: Verify exact source scope and runtime wiring
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          test "$(git -C ops-base rev-parse HEAD)" = "$OPS_BASE_SHA"
          test "$(git -C ops-candidate rev-parse HEAD)" = "$OPS_CANDIDATE_SHA"
          test "$(git -C ops-candidate rev-parse HEAD^{tree})" = "$OPS_CANDIDATE_TREE"
          test "$(tr -d '\r\n' < ops-base/VERSION)" = 1.21.801
          test "$(tr -d '\r\n' < ops-candidate/VERSION)" = 1.21.802
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os
          def tree(root):
              out={}
              for p in Path(root).rglob('*'):
                  if p.is_file() and '.git' not in p.parts:
                      out[p.relative_to(root).as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
              return out
          a,b=tree('ops-base'),tree('ops-candidate')
          changed=sorted(k for k in set(a)|set(b) if a.get(k)!=b.get(k))
          expected=sorted([
              '.github/phase3/v121802-seo-planner-family-authority-union.php',
              'VERSION','includes/seo-planner/contract.php',
              'includes/seo-data/planner-family-authority-bootstrap-v121802.php','vf-ops.php'
          ])
          Path(os.environ['EVIDENCE_DIR']+'/changed-files.txt').write_text('\n'.join(changed)+'\n')
          assert changed==expected,(changed,expected)
          PY
          cmp ops-base/includes/seo-data/keyword-planner-bridge-service.php ops-candidate/includes/seo-data/keyword-planner-bridge-service.php
          cmp ops-base/includes/seo-data/keyword-authority-closure-service.php ops-candidate/includes/seo-data/keyword-authority-closure-service.php
          cmp ops-base/includes/seo-data/page-family-service.php ops-candidate/includes/seo-data/page-family-service.php
          cmp ops-base/includes/seo-planner/validation.php ops-candidate/includes/seo-planner/validation.php
          cmp ops-base/includes/seo-planner/repository.php ops-candidate/includes/seo-planner/repository.php
          cmp ops-base/includes/seo-planner/gate.php ops-candidate/includes/seo-planner/gate.php
          cmp ops-base/includes/site-release/final-domain-authority.php ops-candidate/includes/site-release/final-domain-authority.php
          cmp ops-base/includes/plugins-governance/inventory-readback-compat-v121794.php ops-candidate/includes/plugins-governance/inventory-readback-compat-v121794.php
          grep -Fq "planner-family-authority-bootstrap-v121802.php" ops-candidate/vf-ops.php
          php -l ops-candidate/vf-ops.php
          php -l ops-candidate/includes/seo-planner/contract.php
          php -l ops-candidate/includes/seo-data/planner-family-authority-bootstrap-v121802.php
          php -l ops-candidate/.github/phase3/v121802-seo-planner-family-authority-union.php
          php ops-candidate/.github/phase3/v121802-seo-planner-family-authority-union.php | tee "$EVIDENCE_DIR/source-contract.txt"
          grep -Fxq PASS_V121802_SEO_PLANNER_FAMILY_AUTHORITY_UNION "$EVIDENCE_DIR/source-contract.txt"
          echo SOURCE_SCOPE_RUNTIME_WIRING_AND_FOCUSED_CONTRACT=PASS

      - name: Build exact Candidate runtime artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import re, hashlib, zipfile, json, os
          from pathlib import Path
          root=Path('ops-candidate'); files={}
          def ok(rel):
              p=rel.as_posix(); parts=p.split('/')
              if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in parts): return False
              if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',p,re.I): return False
              if '/' not in p: return p in {'vf-ops.php','uninstall.php'}
              return parts[0] in {'includes','assets','languages','config'}
          for src in root.rglob('*'):
              if src.is_file() and not src.is_symlink():
                  rel=src.relative_to(root)
                  if ok(rel): files[rel.as_posix()]=src.read_bytes()
          files=dict(sorted(files.items()))
          assert len(files)==896,len(files)
          assert 'includes/seo-data/planner-family-authority-bootstrap-v121802.php' in files
          fp=hashlib.sha256()
          for rel,b in files.items(): fp.update((rel+'\0'+hashlib.sha256(b).hexdigest()+'\n').encode())
          zpath=Path(os.environ['CANDIDATE_ZIP'])
          with zipfile.ZipFile(zpath,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for rel,b in files.items():
                  zi=zipfile.ZipInfo('vf-ops/'+rel,(2026,9,4,0,0,0)); zi.compress_type=zipfile.ZIP_DEFLATED; zi.external_attr=0o100644<<16; z.writestr(zi,b)
          meta={'target_commit':os.environ['OPS_CANDIDATE_SHA'],'target_tree':os.environ['OPS_CANDIDATE_TREE'],'version':'1.21.802','asset_name':'vf-tools-ops_V1.21.802.zip','asset_bytes':zpath.stat().st_size,'asset_sha256':hashlib.sha256(zpath.read_bytes()).hexdigest(),'runtime_files':len(files),'runtime_fingerprint':fp.hexdigest()}
          Path(os.environ['EVIDENCE_DIR']+'/candidate-artifact.json').write_text(json.dumps(meta,indent=2)+'\n')
          print(json.dumps(meta,indent=2))
          PY
          unzip -tq "$CANDIDATE_ZIP" >/dev/null
          echo EXACT_PACKAGED_CANDIDATE=PASS

      - name: Download exact current Production 1.21.801 release asset
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          curl -fsSL -L --retry 3 -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/octet-stream' \
            "https://api.github.com/repos/llhzx2018/vf-tools-ops/releases/assets/${BASE_RELEASE_ASSET_ID}" \
            -o /tmp/vf-tools-ops_V1.21.801.zip
          test "$(stat -c '%s' /tmp/vf-tools-ops_V1.21.801.zip)" = "$BASE_RELEASE_BYTES"
          test "$(sha256sum /tmp/vf-tools-ops_V1.21.801.zip | awk '{print $1}')" = "$BASE_RELEASE_SHA256"
          unzip -tq /tmp/vf-tools-ops_V1.21.801.zip >/dev/null
          echo EXACT_PRODUCTION_BASE_ARTIFACT=PASS

      - name: Install WordPress 7.1 and MariaDB 11.4
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y php-cli php-mysql php-curl php-zip php-mbstring php-xml php-gd unzip curl jq mariadb-client rsync >/dev/null
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp
          chmod +x /tmp/wp && sudo mv /tmp/wp /usr/local/bin/wp
          mkdir -p "$WP_PATH"
          wp core download --path="$WP_PATH" --version=7.1 --force
          wp config create --path="$WP_PATH" --dbname=vf_ops_gate --dbuser=vf --dbpass=vf --dbhost=127.0.0.1:3306 --skip-check
          wp core install --path="$WP_PATH" --url=http://127.0.0.1:8080 --title='VF Gate' --admin_user=owner --admin_password='gate-only-not-production' --admin_email=owner@example.invalid --skip-email
          test "$(wp core version --path="$WP_PATH")" = 7.1
          mariadb -h127.0.0.1 -P3306 -uvf -pvf -Nse 'SELECT VERSION()' vf_ops_gate | tee "$EVIDENCE_DIR/mariadb.txt"
          grep -q '^11\.4\.' "$EVIDENCE_DIR/mariadb.txt"

      - name: Seed exact 1.21.801 Production-shaped blocked state
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/base-unzip "$WP_PATH/wp-content/plugins/vf-ops"
          mkdir -p /tmp/base-unzip "$WP_PATH/wp-content/plugins"
          unzip -q /tmp/vf-tools-ops_V1.21.801.zip -d /tmp/base-unzip
          mv /tmp/base-unzip/vf-ops "$WP_PATH/wp-content/plugins/vf-ops"
          wp plugin activate vf-ops --path="$WP_PATH"
          wp eval --path="$WP_PATH" '
            global $wpdb; $now=current_time("mysql");
            $life=vf_ops_lifecycle_apply_version_v121377("v121802-r2-base"); if(empty($life["ok"])) exit(2);
            $faq=wp_insert_post(["post_title"=>"FAQ","post_status"=>"publish","post_type"=>"page","post_name"=>"faq"]); if(is_wp_error($faq)||$faq<1) exit(3);
            $post=wp_insert_post(["post_title"=>"Will M3U8 to MP4 lose quality?","post_content"=>str_repeat("m3u8 quality faq content ",220),"post_status"=>"publish","post_type"=>"page","post_name"=>"will-m3u8-to-mp4-lose-quality","post_parent"=>$faq]); if(is_wp_error($post)||$post<1) exit(4);
            update_post_meta($post,"rank_math_title","M3U8 Player Quality FAQ"); update_post_meta($post,"rank_math_description","M3U8 player quality FAQ description"); update_post_meta($post,"rank_math_rich_snippet","article");
            $family=vf_ops_seo_table_name_v121439("page_family"); $member=vf_ops_seo_table_name_v121439("page_member"); $assign=vf_ops_seo_table_name_v121439("keyword_assignment");
            $wpdb->insert($family,["family_key"=>"faq-m3u8-quality","family_name"=>"FAQ M3U8 Quality","family_type"=>"language_specific","core_task"=>"Explain M3U8 quality","family_status"=>"active","owner_id"=>1,"created_at"=>$now,"updated_at"=>$now]); $fid=(int)$wpdb->insert_id; if($fid<1) exit(5);
            $wpdb->insert($member,["family_id"=>$fid,"post_id"=>$post,"language"=>"en","locale"=>"en_US","url"=>home_url("/faq/will-m3u8-to-mp4-lose-quality/"),"url_path"=>"/faq/will-m3u8-to-mp4-lose-quality/","page_type"=>"page","user_task"=>"Understand M3U8 quality","primary_search_intent"=>"informational","primary_keyword"=>"m3u8 player","content_status"=>"publish","member_status"=>"active","created_at"=>$now,"updated_at"=>$now]); $mid=(int)$wpdb->insert_id; if($mid<1) exit(6);
            $assignment=wp_generate_uuid4();
            $wpdb->insert($assign,["assignment_id"=>$assignment,"research_job_id"=>0,"keyword"=>"m3u8 player","normalized_keyword"=>"m3u8 player","query_language"=>"en","target_language"=>"en","locale"=>"en_US","country"=>"US","source"=>"manual_entry","source_date"=>"2026-09-04","source_reference"=>"production-shaped runner fixture","cluster_id"=>"faq-m3u8-quality","page_family_id"=>$fid,"page_member_id"=>$mid,"search_intent"=>"informational","page_type"=>"page","target_url"=>home_url("/faq/will-m3u8-to-mp4-lose-quality/"),"role"=>"primary","candidate_status"=>"accepted","confidence"=>"medium","owner_id"=>1,"status"=>"active","notes"=>"formal OWNER-confirmed fixture","created_at"=>$now,"updated_at"=>$now]); if($wpdb->last_error!=="") exit(7);
            update_option("vf_gate_assignment",$assignment,false); update_option("vf_gate_post",$post,false);
            $known=array_keys(vf_ops_seo_planner_known_families_v121458());
            echo json_encode(["installed"=>$life["state"]["installed_version"]??"","familyId"=>$fid,"memberId"=>$mid,"assignment"=>$assignment,"knownFamilies"=>$known,"planner"=>vf_ops_seo_plan_readback()]);' > "$EVIDENCE_DIR/base-seed.json"
          jq -e '.installed=="1.21.801" and (.planner.keywordMap|length)==0 and (.knownFamilies|index("faq-m3u8-quality"))==null' "$EVIDENCE_DIR/base-seed.json" >/dev/null
          wp eval --path="$WP_PATH" '$s=vf_ops_s01_seo_closure_run_v121798("v121802_r2_base"); echo json_encode(["closure"=>$s["closureStatus"]??"","bridge"=>$s["bridgeStatus"]??"","failure"=>$s["bridgeFailure"]??"","formal"=>(int)($s["formalPrimaryCount"]??0),"plannerRows"=>(int)($s["plannerRows"]??0)]);' > "$EVIDENCE_DIR/base-repro.json"
          cat "$EVIDENCE_DIR/base-repro.json"
          jq -e '.closure=="BRIDGE_BLOCKED" and .failure=="PLANNER_VALIDATION_FAILED" and .formal==1 and .plannerRows==0' "$EVIDENCE_DIR/base-repro.json" >/dev/null
          wp eval --path="$WP_PATH" '$post=(int)get_option("vf_gate_post",0); echo json_encode(["plugins"=>get_option("vf_ops_plugins",null),"seedHold"=>get_option("vf_ops_seed_hold",null),"postContentHash"=>hash("sha256",(string)get_post_field("post_content",$post)),"assignment"=>get_option("vf_gate_assignment","")]);' > "$EVIDENCE_DIR/protected-before.json"
          echo EXACT_1_21_801_PRODUCTION_SHAPE_REPRO=PASS

      - name: Direct upgrade packaged 1.21.801 to packaged 1.21.802
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/candidate-unzip; mkdir -p /tmp/candidate-unzip
          unzip -q "$CANDIDATE_ZIP" -d /tmp/candidate-unzip
          rsync -a --delete /tmp/candidate-unzip/vf-ops/ "$WP_PATH/wp-content/plugins/vf-ops/"
          wp eval --path="$WP_PATH" '$life=vf_ops_lifecycle_apply_version_v121377("v121802-r2-direct"); $known=array_keys(vf_ops_seo_planner_known_families_v121458()); echo json_encode(["version"=>defined("VF_OPS_VERSION")?VF_OPS_VERSION:"","installed"=>$life["state"]["installed_version"]??"","familyReader"=>function_exists("vf_ops_page_family_list_v121439"),"knownFamilies"=>$known]);' > "$EVIDENCE_DIR/upgrade.json"
          cat "$EVIDENCE_DIR/upgrade.json"
          jq -e '.version=="1.21.802" and .installed=="1.21.802" and .familyReader==true and (.knownFamilies|index("faq-m3u8-quality"))!=null' "$EVIDENCE_DIR/upgrade.json" >/dev/null
          echo FORMAL_FAMILY_AUTHORITY_BOOTSTRAP=PASS

      - name: Verify bridge closure and idempotence
        shell: bash
        run: |
          set -Eeuo pipefail
          wp eval --path="$WP_PATH" '
            global $wpdb;
            $before=vf_ops_seo_plan_readback(); $authority=vf_ops_s01_seo_closure_authority_summary_v121798();
            $first=vf_ops_s01_seo_closure_run_v121798("v121802_r2_after_upgrade"); $after=vf_ops_seo_plan_readback();
            $assignment=(string)get_option("vf_gate_assignment",""); $table=vf_ops_seo_table_name_v121439("keyword_assignment");
            $row=$wpdb->get_row($wpdb->prepare("SELECT assignment_id,keyword,query_language,role,candidate_status,status,target_url,page_family_id,page_member_id FROM {$table} WHERE assignment_id=%s LIMIT 1",$assignment),ARRAY_A);
            echo json_encode(["beforeRevision"=>(int)($before["revision"]??0),"beforeRows"=>count((array)($before["keywordMap"]??[])),"formalBefore"=>(int)($authority["formalPrimaryCount"]??0),"closure"=>$first["closureStatus"]??"","bridge"=>$first["bridgeStatus"]??"","bridgeFailure"=>$first["bridgeFailure"]??"","plannerRows"=>(int)($first["plannerRows"]??0),"afterRevision"=>(int)($after["revision"]??0),"keywordMap"=>$after["keywordMap"]??[],"assignment"=>$row]);' > "$EVIDENCE_DIR/after-first.json"
          cat "$EVIDENCE_DIR/after-first.json"
          jq -e '
            .beforeRows==0 and .formalBefore==1 and .closure!="BRIDGE_BLOCKED" and .bridgeFailure!="PLANNER_VALIDATION_FAILED" and
            .plannerRows==1 and .afterRevision==(.beforeRevision+1) and (.keywordMap|length)==1 and
            .keywordMap[0].pageFamilyId=="faq-m3u8-quality" and .keywordMap[0].language=="en" and
            .keywordMap[0].primaryKeyword=="m3u8 player" and .keywordMap[0].targetUrl=="/faq/will-m3u8-to-mp4-lose-quality/" and .keywordMap[0].status=="active" and
            .assignment.keyword=="m3u8 player" and .assignment.role=="primary" and .assignment.candidate_status=="accepted" and .assignment.status=="active"
          ' "$EVIDENCE_DIR/after-first.json" >/dev/null
          REV="$(jq -r '.afterRevision' "$EVIDENCE_DIR/after-first.json")"
          wp eval --path="$WP_PATH" '$s=vf_ops_s01_seo_closure_run_v121798("v121802_r2_idempotent"); $p=vf_ops_seo_plan_readback(); echo json_encode(["closure"=>$s["closureStatus"]??"","bridge"=>$s["bridgeStatus"]??"","plannerRows"=>(int)($s["plannerRows"]??0),"revision"=>(int)($p["revision"]??0),"rows"=>count((array)($p["keywordMap"]??[]))]);' > "$EVIDENCE_DIR/after-second.json"
          cat "$EVIDENCE_DIR/after-second.json"
          test "$(jq -r '.revision' "$EVIDENCE_DIR/after-second.json")" = "$REV"
          jq -e '.closure!="BRIDGE_BLOCKED" and .plannerRows==1 and .rows==1' "$EVIDENCE_DIR/after-second.json" >/dev/null
          echo FORMAL_PRIMARY_TO_PLANNER_BRIDGE=PASS
          echo IDEMPOTENT_SECOND_RECONCILE=PASS

      - name: Verify protected boundaries
        shell: bash
        run: |
          set -Eeuo pipefail
          ! grep -Eq 'update_post_meta\(|delete_post_meta\(|wp_update_post\(|wp_insert_post\(|vf_m3u8_|m3u8Writes' ops-candidate/includes/seo-planner/contract.php
          ! grep -Eq 'update_post_meta\(|delete_post_meta\(|wp_update_post\(|wp_insert_post\(|vf_m3u8_|m3u8Writes' ops-candidate/includes/seo-data/planner-family-authority-bootstrap-v121802.php
          wp eval --path="$WP_PATH" '$post=(int)get_option("vf_gate_post",0); $a=(string)get_option("vf_gate_assignment",""); global $wpdb; $t=vf_ops_seo_table_name_v121439("keyword_assignment"); $r=$wpdb->get_row($wpdb->prepare("SELECT keyword,role,candidate_status,status FROM {$t} WHERE assignment_id=%s",$a),ARRAY_A); echo json_encode(["plugins"=>get_option("vf_ops_plugins",null),"seedHold"=>get_option("vf_ops_seed_hold",null),"postContentHash"=>hash("sha256",(string)get_post_field("post_content",$post)),"assignment"=>$r]);' > "$EVIDENCE_DIR/protected-after.json"
          test "$(jq -r '.postContentHash' "$EVIDENCE_DIR/protected-before.json")" = "$(jq -r '.postContentHash' "$EVIDENCE_DIR/protected-after.json")"
          test "$(jq -cS '.plugins' "$EVIDENCE_DIR/protected-before.json")" = "$(jq -cS '.plugins' "$EVIDENCE_DIR/protected-after.json")"
          test "$(jq -cS '.seedHold' "$EVIDENCE_DIR/protected-before.json")" = "$(jq -cS '.seedHold' "$EVIDENCE_DIR/protected-after.json")"
          jq -e '.assignment.keyword=="m3u8 player" and .assignment.role=="primary" and .assignment.candidate_status=="accepted" and .assignment.status=="active"' "$EVIDENCE_DIR/protected-after.json" >/dev/null
          echo M3U8_SEED_POST_PLUGIN_GOVERNANCE_BOUNDARY=PASS

      - name: Final Candidate Gate R2 summary
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -n --arg target "$OPS_CANDIDATE_SHA" --arg tree "$OPS_CANDIDATE_TREE" \
            --slurpfile artifact "$EVIDENCE_DIR/candidate-artifact.json" --slurpfile base "$EVIDENCE_DIR/base-repro.json" \
            --slurpfile first "$EVIDENCE_DIR/after-first.json" --slurpfile second "$EVIDENCE_DIR/after-second.json" \
            '{status:"PASS",target_commit:$target,target_tree:$tree,artifact:$artifact[0],production_shape_before:$base[0],after_first:$first[0],after_second:$second[0],marker:"PASS_V121802_WORDPRESS_DIRECT_1_21_801_TO_1_21_802_PLANNER_BRIDGE_GATE_R2"}' > "$EVIDENCE_DIR/summary.json"
          cat "$EVIDENCE_DIR/summary.json"
          echo PASS_V121802_WORDPRESS_DIRECT_1_21_801_TO_1_21_802_PLANNER_BRIDGE_GATE_R2

      - name: Upload Candidate Gate R2 evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-v121802-planner-bridge-gate-r2
          path: ${{ env.EVIDENCE_DIR }}/
          retention-days: 14
