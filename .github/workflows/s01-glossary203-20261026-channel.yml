name: S01 exact Theme channel contract
on:
  push:
    branches: [task/s01-glossary203-20261026]
    paths: ['.github/workflows/s01-glossary203-20261026-channel.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.203
  TARGET_SHA: b890208623e6707834a3009931e35555f2b03250
  UPDATE_SHA: 633ffcd97b2df1432221f7348711186242b7fcb2
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: 633ffcd97b2df1432221f7348711186242b7fcb2
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: source
      - name: Channel identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-glossary203-20261026/channel-spec.json --input control/.github/workflows/s01-glossary203-20261026-channel.yml
      - name: Exact changed manifest and native protocol tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          test "$(git -C source diff --name-only 3afe13a165c63af7e33f6a0db12945a6e04d4888 633ffcd97b2df1432221f7348711186242b7fcb2)" = projects/S01-C01.json
          git -C source diff --exit-code 3afe13a165c63af7e33f6a0db12945a6e04d4888 633ffcd97b2df1432221f7348711186242b7fcb2 -- projects/S01-C03.json
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PYCHANNEL'
          import json,os
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']==os.environ['TARGET_VERSION']
          assert m['asset_sha256']=='3aa491e7892954d01b4029c09ba23b4b8d507451121275a50c1e87404eb7ee50' and m['asset_bytes']==2010061
          assert m['runtime_files']==476 and '1.35.202' in m['from_versions']
          assert m['release_tag']=='v'+os.environ['TARGET_VERSION']
          print('EXACT_CHANNEL_CONTRACT_PASS')
          PYCHANNEL
      - name: Cleanup
        if: always()
        run: rm -rf source
