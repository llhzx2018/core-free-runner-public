name: P01 V2.47.357 Preview Proxy Policy Test (No Deployment)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v247357-proxy-policy-test.yml'
      - '.github/scripts/p01_v247357_preview_proxy_policy_test.py'
      - '.github/scripts/p01_v247357_preview_proxy.py'
permissions:
  contents: read
jobs:
  proxy-policy:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout non-deploying policy fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Assert exact repaired preview proxy source
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "$(git diff cf668ca72557fe0970470b2f41a023daf651c910 HEAD -- .github/scripts/p01_v247357_preview_proxy.py)"
          python3 -m py_compile .github/scripts/p01_v247357_preview_proxy.py .github/scripts/p01_v247357_preview_proxy_policy_test.py
          echo P01_PREVIEW_PROXY_EXACT_REPAIRED_SOURCE=PASS
      - name: Run synthetic asset route and safety assertions
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .github/scripts/p01_v247357_preview_proxy_policy_test.py | tee /tmp/p01-v247357-preview-proxy-policy.log
          grep -Fx P01_PREVIEW_CANONICAL_ASSET_ROUTE=PASS /tmp/p01-v247357-preview-proxy-policy.log
          grep -Fx P01_PREVIEW_ALLOWED_SCOPED_TOKEN_ENDPOINTS=PASS /tmp/p01-v247357-preview-proxy-policy.log
          grep -Fx P01_PREVIEW_PRIVATE_ROUTE_AND_QUERY_FAIL_CLOSED=PASS /tmp/p01-v247357-preview-proxy-policy.log
          grep -Fx P01_PREVIEW_PROXY_NO_DEPLOYMENT_POLICY=PASS /tmp/p01-v247357-preview-proxy-policy.log
          echo P01_PREVIEW_PROXY_NONDEPLOYING_REGRESSION=PASS
