name: p01-v247458-channel-exact-once

# One-off isolated public verification for core-updates PR #889. Close unmerged.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v247458-channel-exact-once.yml'

permissions:
  contents: read

jobs:
  channel-contract:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/p01-v247458-channel-20261025'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact public distribution candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ecca2e78ab07e47f01b4bbce6985bb1994dc01b7
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false

      - name: Exact source and distribution manifest contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = ecca2e78ab07e47f01b4bbce6985bb1994dc01b7
          python3 scripts/check_manifest_contract.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('projects/P01.json').read_text(encoding='utf-8'))
          assert m['project_id']=='P01' and m['enabled'] is True
          assert m['current_version']=='2.47.457'
          assert m['target_version']=='2.47.458'
          assert m['from_versions']==['2.47.457']
          assert m['update_type']=='ATOMIC'
          assert m['release_tag']=='v2.47.458'
          assert m['release_id']==423361467
          assert m['product_identity']=='79935fc3ddc5731665c8e2dab4365c20c1b25a24'
          assert m['asset_name']=='VF_Start_V2.47.458_UPDATE.zip'
          assert m['asset_bytes']==3039388
          assert m['asset_sha256']=='0ff733b03d881eec1091a23b8b8341bc35cf5dbbe92603a2303fa24ae6e2ebfa'
          assert m['schema_from']==m['schema_to']=='2026102201'
          assert m['backup_required'] is True and m['rollback_supported'] is True
          print('P01_V247458_CHANNEL_IDENTITY=PASS')
          PY

      - name: PHP lint and canonical Update Core regression
        shell: bash
        run: |
          set -Eeuo pipefail
          php -v
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php update-core/php/tests/run.php
          echo P01_V247458_CHANNEL_MACHINE=PASS
