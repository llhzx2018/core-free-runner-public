name: P04 VF Infra V2.7.6 Responsive Gate PR

on:
  pull_request:
    branches: [main]
    paths:
      - 'requests/p04-v276-responsive-*.txt'

permissions:
  contents: read

concurrency:
  group: p04-v276-responsive-gate-pr
  cancel-in-progress: true

env:
  SOURCE_REPOSITORY: llhzx2018/vf-infra
  SOURCE_COMMIT: '5b44eda92513c01380bd6e6468c1d91c95dcbecd'
  PRODUCTION_COMMIT: '35cf27b310a84e621c37429538034f9734c76f49'
  PRODUCTION_VERSION: '2.7.5'
  TARGET_VERSION: '2.7.6'
  SCHEMA: '14'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Credential gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN" || { echo 'VF_PRIVATE_READ_TOKEN_MISSING' >&2; exit 78; }
          echo 'PRIVATE_SOURCE_CREDENTIAL=PASS'

      - name: Checkout exact P04 V2.7.6 source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_COMMIT }}
          token: ${{ env.READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: candidate

      - name: Exact source and ancestry
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(tr -d '\r\n' < candidate/VERSION)" = "$TARGET_VERSION"
          git -C candidate merge-base --is-ancestor "$PRODUCTION_COMMIT" "$SOURCE_COMMIT"
          test ! -e candidate/database/migrations/015_
          grep -Fq -- '--v276-cyan:#0f766e' candidate/public/assets/v276-responsive-loading.css
          grep -Fq 'VFInfraProgress' candidate/public/assets/v276-responsive-loading.js
          echo 'SOURCE_IDENTITY=PASS'
          echo 'PRODUCTION_V275_ANCESTRY=PASS'

      - name: Prepare PHP runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, fileinfo, sodium, zip, curl, mbstring

      - name: Prepare Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install browser runtime
        shell: bash
        working-directory: candidate
        run: |
          set -Eeuo pipefail
          npm install --no-save --silent playwright
          npx playwright install --with-deps chromium >/dev/null

      - name: Run V2.7.6 responsive gate
        shell: bash
        working-directory: candidate
        env:
          VF_V276_TESTED_RUNTIME_COMMIT: ${{ env.SOURCE_COMMIT }}
          VF_V276_EVIDENCE_DIR: ${{ runner.temp }}/p04-v276-evidence
        run: |
          set -Eeuo pipefail
          bash scripts/run-v276-responsive-loading-gate.sh | tee "$RUNNER_TEMP/p04-v276.log"
          grep -Fxq 'P04_V276_RESPONSIVE_LOADING_GATE_PASS' "$RUNNER_TEMP/p04-v276.log"
          grep -Fxq 'V276_ALL_VIEWPORTS=PASS' "$RUNNER_TEMP/p04-v276.log"
          grep -Fxq 'V276_PAGE_HORIZONTAL_OVERFLOW=0' "$RUNNER_TEMP/p04-v276.log"
          grep -Fxq 'V276_LOADING_PROGRESS=PASS' "$RUNNER_TEMP/p04-v276.log"

      - name: Verify report contract
        shell: bash
        env:
          EVIDENCE: ${{ runner.temp }}/p04-v276-evidence
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json,os,pathlib
          p=json.loads((pathlib.Path(os.environ['EVIDENCE'])/'V276_RESPONSIVE_LOADING_REPORT.json').read_text(encoding='utf-8'))
          assert p['status']=='PASS',p
          assert p['version']=='2.7.6' and p['schema']==14 and p['migration']=='NONE',p
          assert set(p['viewport'])=={'1440','1280','1024','768','390'},p['viewport']
          assert all(v=='PASS' for v in p['viewport'].values()),p['viewport']
          assert p['loading']['progress']=='PASS' and p['loading']['skeleton']=='PASS',p
          assert p['routes']['fullscreen']=='PASS',p
          assert p['routes']['settings_responsive']=='PASS',p
          assert p['visual']['vf_cyan']=='PASS',p
          assert p['page_errors']==[] and p['console_errors']==[],p
          assert p['tested_runtime_commit']==os.environ['SOURCE_COMMIT'],p
          print('P04_V276_REPORT_CONTRACT=PASS')
          PY

      - name: Upload synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P04-V2.7.6-RESPONSIVE-GATE
          path: |
            ${{ runner.temp }}/p04-v276-evidence/*.png
            ${{ runner.temp }}/p04-v276-evidence/V276_RESPONSIVE_LOADING_REPORT.json
            ${{ runner.temp }}/p04-v276-evidence/SHA256SUMS
          if-no-files-found: warn
          retention-days: 7
