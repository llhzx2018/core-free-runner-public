name: P01 V2.36.2 Stage Candidate
on:
  push:
    branches: [release/p01-v2362-candidate-20260901]
    paths: [.github/workflows/p01-v2362-stage-candidate-20260901.yml]
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: release/v2.36.2-formal-source-20260901
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
      - name: Stage exact V2.36.2 versioned candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '0fd80ff3996e31abec24e85199f171769460fa3d'
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          Path('VERSION').write_text('2.36.2\n')
          Path('src/VERSION.txt').write_text('2.36.2\n')
          b=Path('src/app/bootstrap.php')
          t=b.read_text()
          t2=t.replace("define('VF_VERSION', '2.36.1');","define('VF_VERSION', '2.36.2');",1)
          if t2==t: raise SystemExit('VF_VERSION source drift')
          b.write_text(t2)
          c=Path('CHANGELOG.md')
          old=c.read_text()
          block='''## V2.36.2 · Patch Release Candidate · 2026-09-01\n\n- 修复 V2.36.1 单一前台登录模型恢复后遗留的可见入口缺口：未登录用户必须能明确看到“登录”，登录用户必须能明确看到“退出”。\n- 移动端公开导航不再把匿名登录入口标成“管理”；登录后仍按原行为显示“管理”。\n- 频道 / 影视 / 专题等 Functional Workspace 在桌面和移动端统一提供登录 / 退出入口，并继续复用现有 `api.php?action=login/logout`，没有第二套认证系统。\n- 真实 390 / 1440 浏览器 Gate 已执行：点击登录 → 输入密码 → 私人内容出现 → 资源管理 / 系统设置 / 退出出现 → 点击退出 → 私人内容消失 → 登录重新出现。\n- 匿名私人内容隔离、无横向溢出、SQLite integrity / FK 全 PASS；Product PR #170、Authority PR #171 已收口。\n- Schema 保持 `2026082901`，无 Migration；不引入其他产品功能。\n- Candidate 版本推进为 `2.36.2`；当前仍未修改 `main` / Tag / GitHub Release / core-updates / Owner Production。\n\n'''
          if not old.startswith('## V2.36.2 · Patch Release Candidate'):
              c.write_text(block+old)
          p=Path('VF_PROJECT.json')
          d=json.loads(p.read_text())
          if d.get('production_version')!='2.36.0': raise SystemExit('production version drift')
          if d.get('schema_version')!='2026082901': raise SystemExit('schema drift')
          d['status']='V2.36.0 OWNER PRODUCTION / V2.36.1 PUBLISHED / V2.36.2 CANDIDATE PREP'
          d['working_version']='2.36.2'
          d['target_release_version']='2.36.2'
          d['current_phase']='V2.36.2 VERSIONED PATCH CANDIDATE / READINESS PENDING'
          d['candidate_version']='2.36.2'
          d['candidate_schema_version']='2026082901'
          d['candidate_state']='VERSIONED PATCH CANDIDATE / READINESS PENDING'
          d['formal_release_state']='V2.36.1 PUBLISHED / V2.36.2 NOT YET RELEASED'
          d['develop_state']='V2.36.2 FORMAL PATCH SOURCE PREPARED / READINESS PENDING / NOT RELEASED'
          d['current_authority']='Owner Production V2.36.0 / Published Latest V2.36.1 / V2.36.2 versioned auth-entry patch candidate prepared'
          d['next_action']='Run V2.36.2 Candidate Readiness on the exact versioned source. Do not promote main, publish Tag/Release, mutate core-updates or write Owner Production before subsequent gates pass.'
          d['v2_36_2_release_candidate']={
            'base_develop':'0fd80ff3996e31abec24e85199f171769460fa3d',
            'product_fix_merge':'cd87a40e8e7d445b36c77f670a8a2e1a50257c05',
            'runtime_product_tree':'88785e65b25f12db176ed58a2a5cdb688e23d599',
            'version':'2.36.2',
            'production_version':'2.36.0',
            'published_predecessor_version':'2.36.1',
            'schema_version':'2026082901',
            'schema_change':False,
            'migration':None,
            'scope':'PATCH / VISIBLE LOGIN + LOGOUT ENTRY CONTRACT ONLY',
            'product_pr':170,
            'authority_pr':171,
            'product_gate':33477309212,
            'product_artifact':9788634718,
            'product_artifact_sha256':'a6f2c0188601de958a533b1f63d941c83873277880dc5ff932d934a6045966ec',
            'state':'VERSIONED PATCH CANDIDATE PREPARATION / NOT RELEASED',
            'main_write':False,
            'production_write':False
          }
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          python3 -m json.tool VF_PROJECT.json >/dev/null
          php -l src/app/bootstrap.php
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 5
          printf '%s\n' "${changed[@]}" | sort >/tmp/actual
          printf '%s\n' CHANGELOG.md VERSION VF_PROJECT.json src/VERSION.txt src/app/bootstrap.php | sort >/tmp/expected
          diff -u /tmp/expected /tmp/actual
          test "$(cat VERSION)" = '2.36.2'
          test "$(cat src/VERSION.txt)" = '2.36.2'
          grep -Fx "define('VF_VERSION', '2.36.2');" src/app/bootstrap.php >/dev/null
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add CHANGELOG.md VERSION VF_PROJECT.json src/VERSION.txt src/app/bootstrap.php
          git commit -m 'release(P01): prepare V2.36.2 patch candidate'
          echo "CANDIDATE=$(git rev-parse HEAD)"
          echo "CANDIDATE_TREE=$(git rev-parse HEAD^{tree})"
          echo "CANDIDATE_RUNTIME_TREE=$(git rev-parse HEAD:src)"
          git push origin HEAD:release/v2.36.2-formal-source-20260901
