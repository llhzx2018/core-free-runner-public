name: TEMP S01-C02 v1.21.820 Preflight Authority Scan
on:
  push:
    branches: [temp/s01-c02-v121820-preflight-authority-scan-20260905]
    paths: ['.github/workflows/temp-s01-c02-v121820-preflight-authority-scan.yml']
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact Ops 1.21.819
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 00bc49b070485c6095a3b5bd3337b3fcc23d42f5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: ops
      - name: Prove publish autostart behavior
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== AUTOSTART REFERENCES ==='
          grep -Rni -E 'publish-autostart|vf_publish_autorun|release_job_run|zip-job-control|autostart' ops/assets ops/includes | head -n 350 || true
          echo '=== JS RUN LOOP CONTEXT ==='
          while IFS=: read -r f n rest; do
            echo "--- $f:$n ---"
            sed -n "$((n>40?n-40:1)),$((n+120))p" "$f"
          done < <(grep -Rni --include='*.js' -E 'vf_ops_release_job_run|publish-autostart|vf_publish_autorun' ops/assets ops/includes | head -n 20 || true)
          echo PASS_V121820_PUBLISH_AUTOSTART_SCAN
