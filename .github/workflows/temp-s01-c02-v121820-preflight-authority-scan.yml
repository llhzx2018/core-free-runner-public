name: TEMP S01-C02 v1.21.820 Batch Readback Contract Scan
on:
  push:
    branches: [temp/s01-c02-v121820-preflight-authority-scan-20260905]
    paths: ['.github/workflows/temp-s01-c02-v121820-preflight-authority-scan.yml']
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact Ops 1.21.819
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 00bc49b070485c6095a3b5bd3337b3fcc23d42f5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: ops
      - name: Prove batch create readback contract and transitions
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== CREATE BATCH FUNCTION ==='
          grep -Rni --include='*.php' 'function vf_ops_release_batch_create_v121363' ops/includes || true
          f="$(grep -RIl --include='*.php' 'function vf_ops_release_batch_create_v121363' ops/includes | head -n1 || true)"
          if [ -n "$f" ]; then n="$(grep -n 'function vf_ops_release_batch_create_v121363' "$f" | head -n1 | cut -d: -f1)"; sed -n "$((n-25)),$((n+220))p" "$f"; fi
          echo '=== LOCK BATCH FUNCTION ==='
          f="$(grep -RIl --include='*.php' 'function vf_ops_release_batch_lock_v121363' ops/includes | head -n1 || true)"
          if [ -n "$f" ]; then n="$(grep -n 'function vf_ops_release_batch_lock_v121363' "$f" | head -n1 | cut -d: -f1)"; sed -n "$((n-25)),$((n+220))p" "$f"; fi
          echo '=== ORCHESTRATOR CREATE/ENSURE CONTEXT ==='
          f='ops/includes/publish-o10/publish-release-orchestrator.php'
          n="$(grep -n 'function vf_ops_publish_release_create_batch_v121762' "$f" | head -n1 | cut -d: -f1)"; sed -n "$((n-25)),$((n+190))p" "$f"
          echo '=== CREATE/LOCK CALL SITES ==='
          grep -Rni --include='*.php' -E 'vf_ops_release_batch_create_v121363\(|vf_ops_release_batch_lock_v121363\(' ops/includes | head -n 250 || true
          echo '=== BATCH STATE WRITES/HARD TRANSITIONS ==='
          grep -Rni --include='*.php' -E "status.?=>.?['\"]locked['\"]|['\"]status['\"].*=.?['\"]locked['\"]|active.*batch|release_batch_active" ops/includes/release-batch ops/includes/publish-o10 ops/includes/site-release | head -n 350 || true
          echo PASS_V121820_BATCH_READBACK_CONTRACT_SCAN
