name: TEMP S01-C02 v1.21.820 Preflight Authority Scan
on:
  push:
    branches: [temp/s01-c02-v121820-preflight-authority-scan-20260905]
    paths: ['.github/workflows/temp-s01-c02-v121820-preflight-authority-scan.yml']
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact Ops 1.21.819
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 00bc49b070485c6095a3b5bd3337b3fcc23d42f5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: ops
      - name: Print candidate and async paths
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== CANDIDATE / PROMOTION SYMBOLS ==='
          grep -Rni --include='*.php' -E 'create_candidate|candidate_from_inspection|canPromoteInspection|promote.*inspection|生成 Cloudflare 候选包' ops/includes | head -n 250 || true
          echo '=== ZIP MODEL OLD GATE CONTEXT ==='
          f='ops/includes/publish-o10/publish-zip-product.php'
          n="$(grep -n 'vf_ops_publish_preflight_gate_v121422' "$f" | head -n1 | cut -d: -f1)"
          test -n "$n"
          sed -n "$((n-60)),$((n+120))p" "$f"
          echo '=== ALL OLD GATE CALL SITES ==='
          grep -Rni --include='*.php' 'vf_ops_publish_preflight_gate_v121422(' ops/includes || true
          echo '=== ASYNC SYMBOLS ==='
          grep -Rni --include='*.php' -E 'class VF_Ops_Release_Async_Job|run_next_stage|create_job_from_source_file|inspect_only|candidate_async|release_async_job' ops/includes | head -n 400 || true
          echo '=== AJAX/CRON/ADMIN ASYNC HOOKS ==='
          grep -Rni --include='*.php' -E "add_action\('(wp_ajax|admin_init|wp_loaded|init|.*cron).*'|wp_schedule|spawn_cron|run_next_stage|worker" ops/includes | grep -E 'release|publish|async|job|worker' | head -n 350 || true
          echo PASS_V121820_CANDIDATE_ASYNC_SOURCE_SCAN
