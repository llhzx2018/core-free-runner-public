name: TEMP S01-C02 v1.21.820 Preflight Authority Scan
on:
  push:
    branches: [temp/s01-c02-v121820-preflight-authority-scan-20260905]
    paths: ['.github/workflows/temp-s01-c02-v121820-preflight-authority-scan.yml']
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact Ops 1.21.819
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 00bc49b070485c6095a3b5bd3337b3fcc23d42f5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: ops
      - name: Print preflight and async authority paths
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== OLD PREFLIGHT GATE DEFINITION ==='
          f="$(grep -RIl 'function vf_ops_publish_preflight_gate_v121422' ops/includes | head -n1)"
          test -n "$f"
          n="$(grep -n 'function vf_ops_publish_preflight_gate_v121422' "$f" | head -n1 | cut -d: -f1)"
          sed -n "$((n-5)),$((n+120))p" "$f"
          echo '=== PREFLIGHT GATE CALL SITES ==='
          grep -Rni --include='*.php' 'vf_ops_publish_preflight_gate_v121422(' ops/includes || true
          echo '=== SAVED VIEW STATE / VIEW CONTEXT ==='
          for fn in vf_ops_publish_preflight_saved_view_state_v121708 vf_ops_publish_preflight_view_context_v121708; do
            f="$(grep -RIl "function $fn" ops/includes | head -n1)"; test -n "$f"
            n="$(grep -n "function $fn" "$f" | head -n1 | cut -d: -f1)"
            echo "--- $fn @ $f:$n ---"
            sed -n "$((n-5)),$((n+130))p" "$f"
          done
          echo '=== CANDIDATE PROMOTION CALL SITE ==='
          f="$(grep -RIl 'function vf_ops_publish_zip_create_candidate_from_inspection_v121761' ops/includes | head -n1)"; test -n "$f"
          n="$(grep -n 'function vf_ops_publish_zip_create_candidate_from_inspection_v121761' "$f" | head -n1 | cut -d: -f1)"
          sed -n "$((n-20)),$((n+180))p" "$f"
          echo '=== ASYNC JOB CLASS / RUN NEXT STAGE ==='
          grep -Rni --include='*.php' -E 'class VF_Ops_Release_Async_Job|function run_next_stage|run_next_stage\(' ops/includes | head -n 100 || true
          for pat in 'class VF_Ops_Release_Async_Job' 'function run_next_stage'; do
            f="$(grep -RIl "$pat" ops/includes | head -n1 || true)"
            if [ -n "$f" ]; then n="$(grep -n "$pat" "$f" | head -n1 | cut -d: -f1)"; echo "--- $pat @ $f:$n ---"; sed -n "$((n-20)),$((n+220))p" "$f"; fi
          done
          echo '=== ASYNC HOOK REGISTRATION ==='
          grep -Rni --include='*.php' -E 'wp_ajax_.*release|admin_init.*release|cron.*release|schedule.*release|run_next_stage|continue.*job|worker' ops/includes/publish-o10 ops/includes | head -n 250 || true
          echo PASS_V121820_PREFLIGHT_AUTHORITY_SOURCE_SCAN
