name: TEMP S01-C02 v1.21.820 Governance Cache Scan
on:
  push:
    branches: [temp/s01-c02-v121820-preflight-authority-scan-20260905]
    paths: ['.github/workflows/temp-s01-c02-v121820-preflight-authority-scan.yml']
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact Ops 1.21.819
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 00bc49b070485c6095a3b5bd3337b3fcc23d42f5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: ops
      - name: Inspect governance read/write caches
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== GOVERNANCE READ/SAVE SYMBOLS ==='
          grep -Rni --include='*.php' -E 'function vf_ops_release_governance_(read_batches|save_batches)_v121449|release_governance.*runtime|runtime.*governance' ops/includes | head -n 250 || true
          for fn in vf_ops_release_governance_read_batches_v121449 vf_ops_release_governance_save_batches_v121449; do
            f="$(grep -RIl --include='*.php' "function $fn" ops/includes | head -n1 || true)"
            if [ -n "$f" ]; then n="$(grep -n "function $fn" "$f" | head -n1 | cut -d: -f1)"; echo "--- $fn @ $f:$n ---"; sed -n "$((n-35)),$((n+180))p" "$f"; fi
          done
          echo '=== GLOBAL/RUNTIME CACHE REFERENCES ==='
          grep -Rni --include='*.php' -E '\$GLOBALS\[.*governance|static .*batch|wp_cache_(get|set|delete)|release_governance.*cache' ops/includes/seo-data ops/includes/release-batch ops/includes | head -n 350 || true
          echo PASS_V121820_GOVERNANCE_CACHE_SCAN
