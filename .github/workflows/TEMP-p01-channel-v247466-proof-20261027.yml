name: "TEMP P01 V2.47.466 exact-channel independent CI proof"
on:
  push:
    branches:
      - "task/p01-channel-v247466-proof-20261027"
permissions:
  contents: read
jobs:
  verify-channel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact proposed core-updates PR 915 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: "feb6a3d9df14624ac47c33e05ee48301c0c4b070"
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Confirm exact core-updates source identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "feb6a3d9df14624ac47c33e05ee48301c0c4b070"
      - name: Manifest Contract Audit
        run: python3 scripts/check_manifest_contract.py
      - name: PHP environment
        run: php -v
      - name: Update Core V1 PHP syntax check
        run: find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Update Core V1 regression tests
        run: php update-core/php/tests/run.php
      - name: Verify exact P01 release channel and atomic rollback identity
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('projects/P01.json').read_text())
          expected = {
              'project_id': 'P01',
              'current_version': '2.47.465',
              'target_version': '2.47.466',
              'update_type': 'ATOMIC',
              'release_tag': 'v2.47.466',
              'release_id': 425159416,
              'product_identity': '03ea17d4c8e106b1f2f641c038868a57a0875f5e',
              'asset_name': 'VF_Start_V2.47.466_UPDATE.zip',
              'asset_bytes': 3121651,
              'asset_sha256': 'c4b1b63b2915109ea5d478d6af3c62c0b6d20461538ede5f402f7872cc6dbdc9',
              'backup_required': True,
              'rollback_supported': True,
          }
          for k,v in expected.items():
              assert p.get(k) == v, (k,p.get(k),v)
          assert p['from_versions'] == ['2.47.465']
          assert p['schema_from'] == p['schema_to'] == '2026102201'
          print('P01_EXACT_CHANNEL_MANIFEST=PASS')
          PY
