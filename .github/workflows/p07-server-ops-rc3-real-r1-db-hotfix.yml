name: P07 Server Ops RC3 Real R1 DB Compatibility

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'installers/p07.sh'
      - 'installers/p07-toolbox.sh'
      - 'installers/p07-rc3-admin-simple.sh'
      - 'installers/p07-rc3-nav-flat.sh'
      - 'installers/p07-rc3-real-r1-dbadd-hotfix.sh'
      - 'dist/p07/0.1.0-rc3/overlay/BUILD_ID'
      - 'dist/p07/0.1.0-rc3/overlay/bin/vfops-user'
      - 'dist/p07/0.1.0-rc3/overlay/bin/vfops-cloudpanel-ui'
      - 'dist/p07/0.1.0-rc3/overlay/lib/cloudpanel_ui_common.sh'
      - 'dist/p07/0.1.0-rc3/overlay/lib/cloudpanel_ui_admin.sh'
      - 'dist/p07/0.1.0-rc3/overlay/lib/site_lifecycle.py'
      - 'dist/p07/0.1.0-rc3/overlay/lib/restore_as_verified.py'
      - 'dist/p07/0.1.0-rc3/tests/test_site_lifecycle.py'
      - 'dist/p07/0.1.0-rc3/tests/test_restore_as_real_db_compat.py'
      - '.github/workflows/p07-server-ops-rc3-real-r1-db-hotfix.yml'
  pull_request:
    paths:
      - 'installers/p07.sh'
      - 'installers/p07-toolbox.sh'
      - 'installers/p07-rc3-admin-simple.sh'
      - 'installers/p07-rc3-nav-flat.sh'
      - 'installers/p07-rc3-real-r1-dbadd-hotfix.sh'
      - 'dist/p07/0.1.0-rc3/overlay/BUILD_ID'
      - 'dist/p07/0.1.0-rc3/overlay/bin/vfops-user'
      - 'dist/p07/0.1.0-rc3/overlay/bin/vfops-cloudpanel-ui'
      - 'dist/p07/0.1.0-rc3/overlay/lib/cloudpanel_ui_common.sh'
      - 'dist/p07/0.1.0-rc3/overlay/lib/cloudpanel_ui_admin.sh'
      - 'dist/p07/0.1.0-rc3/overlay/lib/site_lifecycle.py'
      - 'dist/p07/0.1.0-rc3/overlay/lib/restore_as_verified.py'
      - 'dist/p07/0.1.0-rc3/tests/test_site_lifecycle.py'
      - 'dist/p07/0.1.0-rc3/tests/test_restore_as_real_db_compat.py'
      - '.github/workflows/p07-server-ops-rc3-real-r1-db-hotfix.yml'

permissions:
  contents: read

jobs:
  real-r1-db-compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify source-exact init14 and retained R1 identities
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          expected={
            'dist/p07/0.1.0-rc3/overlay/BUILD_ID':'1e07e5b18f89058da04cd2dddaf8e7f7414bb6d2',
            'dist/p07/0.1.0-rc3/overlay/bin/vfops-user':'1028b939ecd4c52377c846ab8e12ff136667981c',
            'dist/p07/0.1.0-rc3/overlay/bin/vfops-cloudpanel-ui':'5b0fa75d6951586c82404e361b88ab5e10661212',
            'dist/p07/0.1.0-rc3/overlay/lib/cloudpanel_ui_common.sh':'b591cd9b7e1ab9e715cf60cd702fee44f448e7ff',
            'dist/p07/0.1.0-rc3/overlay/lib/cloudpanel_ui_admin.sh':'eeae6b514b27e15e20ea596f5cd363e7779e461b',
            'dist/p07/0.1.0-rc3/overlay/lib/site_lifecycle.py':'3e84dfa74b4df8413c3228322b8dc1c22d901761',
            'dist/p07/0.1.0-rc3/overlay/lib/restore_as_verified.py':'c0df2750e0cb79e16bf46cad88e85cacacfc2415',
            'dist/p07/0.1.0-rc3/tests/test_site_lifecycle.py':'2edb3b76e2f2a044afa7fba0f274ef0e54c644b0',
            'dist/p07/0.1.0-rc3/tests/test_restore_as_real_db_compat.py':'250b2613dc98dd5d14bf0ac4b5c0918966219789',
          }
          for path, want in expected.items():
              data=Path(path).read_bytes()
              got=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert got == want, (path, got, want)
          PY
          test "$(cat dist/p07/0.1.0-rc3/overlay/BUILD_ID)" = '0.1.0-rc3-guided-init14'
          python3 -m py_compile \
            dist/p07/0.1.0-rc3/overlay/lib/site_lifecycle.py \
            dist/p07/0.1.0-rc3/overlay/lib/restore_as_verified.py \
            dist/p07/0.1.0-rc3/tests/test_site_lifecycle.py \
            dist/p07/0.1.0-rc3/tests/test_restore_as_real_db_compat.py

      - name: Install fixed guided-init12 baseline
        run: |
          set -euo pipefail
          BASE_ROOT='https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/8ed82495a80f2b11a2d47dc8f33648d87e291da5'
          curl -fsSL "$BASE_ROOT/installers/p07.sh" -o /tmp/p07-init12.sh
          sudo env P07_PUBLIC_ROOT="$BASE_ROOT" P07_NO_EXEC=1 bash /tmp/p07-init12.sh
          test "$(vfops --build-id)" = '0.1.0-rc3-guided-init12'
          test "$(git hash-object /opt/vf-server-ops/lib/site_lifecycle.py)" = '3e84dfa74b4df8413c3228322b8dc1c22d901761'
          test "$(git hash-object /opt/vf-server-ops/lib/restore_as_verified.py)" = 'c0df2750e0cb79e16bf46cad88e85cacacfc2415'

      - name: Prove failed init14 restores exact pre-run init12
        run: |
          set -euo pipefail
          before_lifecycle="$(git hash-object /opt/vf-server-ops/lib/site_lifecycle.py)"
          before_verified="$(git hash-object /opt/vf-server-ops/lib/restore_as_verified.py)"
          before_user="$(git hash-object /opt/vf-server-ops/bin/vfops-user)"
          set +e
          sudo env \
            P07_PUBLIC_ROOT="https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/${{ github.event.pull_request.head.sha || github.sha }}" \
            P07_NO_EXEC=1 \
            P07_INIT14_TEST_FAIL=1 \
            bash installers/p07.sh >/tmp/p07-init14-fail.log 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          test "$(vfops --build-id)" = '0.1.0-rc3-guided-init12'
          test "$(git hash-object /opt/vf-server-ops/lib/site_lifecycle.py)" = "$before_lifecycle"
          test "$(git hash-object /opt/vf-server-ops/lib/restore_as_verified.py)" = "$before_verified"
          test "$(git hash-object /opt/vf-server-ops/bin/vfops-user)" = "$before_user"
          grep -F '已恢复执行前版本' /tmp/p07-init14-fail.log

      - name: Install guided-init14 through stable wrapper
        run: |
          set -euo pipefail
          sudo env \
            P07_PUBLIC_ROOT="https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/${{ github.event.pull_request.head.sha || github.sha }}" \
            P07_NO_EXEC=1 \
            bash installers/p07.sh 2>&1 | tee /tmp/p07-init14.log
          test "$(vfops --version)" = 'VF Server Ops 0.1.0 RC3'
          test "$(vfops --build-id)" = '0.1.0-rc3-guided-init14'
          grep -F 'CloudPanel 简化 UX guided-init14 安装完成 ✓' /tmp/p07-init14.log
          test "$(git hash-object /opt/vf-server-ops/lib/site_lifecycle.py)" = '3e84dfa74b4df8413c3228322b8dc1c22d901761'
          grep -Fq 'database = cloudpanel.validate_name(f"p07{token}{index}"' /opt/vf-server-ops/lib/site_lifecycle.py
          grep -Fq 'username = cloudpanel.validate_name(f"p07u{token[:8]}{index}"' /opt/vf-server-ops/lib/site_lifecycle.py
          ! grep -Fq 'p07_{token}' /opt/vf-server-ops/lib/site_lifecycle.py
          test "$(git hash-object /opt/vf-server-ops/lib/restore_as_verified.py)" = 'c0df2750e0cb79e16bf46cad88e85cacacfc2415'
          grep -Fq '_database_compat_context' /opt/vf-server-ops/lib/restore_as_verified.py
          grep -Fq 'P07_CLOUDPANEL_OPERATION=' /opt/vf-server-ops/lib/restore_as_verified.py
          ! grep -Fq 'REAL_PASS' /opt/vf-server-ops/lib/restore_as_verified.py
          grep -Fq '6. 网站管理' /opt/vf-server-ops/bin/vfops-user
          grep -Fq '7. CloudPanel 管理' /opt/vf-server-ops/bin/vfops-user
          grep -Fq '98. 更换网站' /opt/vf-server-ops/bin/vfops-cloudpanel-ui
          printf '0\n' | bash /opt/vf-server-ops/bin/vfops-cloudpanel-ui admin > /tmp/p07-r1-admin.txt
          ! grep -Fq 'Vhost 模板' /tmp/p07-r1-admin.txt

      - name: Run DB identity staging and Restore-As regressions
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/vf-server-ops/tests
          sudo cp dist/p07/0.1.0-rc3/tests/test_site_lifecycle.py /opt/vf-server-ops/tests/
          sudo cp dist/p07/0.1.0-rc3/tests/test_restore_as_real_db_compat.py /opt/vf-server-ops/tests/
          sudo cp dist/p07/0.1.0-rc3/tests/test_restore_as.py /opt/vf-server-ops/tests/
          sudo cp dist/p07/0.1.0-rc3/tests/test_restore_as_verified.py /opt/vf-server-ops/tests/
          sudo cp dist/p07/0.1.0-rc3/tests/test_restore_as_machine_e2e.py /opt/vf-server-ops/tests/
          cd /opt/vf-server-ops
          sudo python3 -m unittest -v \
            tests.test_site_lifecycle \
            tests.test_restore_as_real_db_compat \
            tests.test_restore_as \
            tests.test_restore_as_verified \
            tests.test_restore_as_machine_e2e

      - name: Verify Toolbox and System Care boundary
        run: |
          set -euo pipefail
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-rc3-guided-init14"' installers/p07-toolbox.sh
          grep -Fq 'CloudPanel 备份 / 恢复 / 迁移' installers/p07-toolbox.sh
          grep -Fq '测试中' installers/p07-toolbox.sh
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc12"' installers/p07-toolbox.sh
          echo 'P07_REAL_R1_DB_COMPATIBILITY_MACHINE=PASS'
