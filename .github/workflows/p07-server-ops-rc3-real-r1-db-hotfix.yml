name: P07 Server Ops RC3 Real R1 DB Hotfix

on:
  workflow_dispatch:
  push:
    branches: [main, work/p07-real-r1-mysql-import-fix, work/p07-real-r1-hotfix-main-gate-fix]
    paths:
      - 'installers/p07.sh'
      - 'installers/p07-toolbox.sh'
      - 'installers/p07-rc3-real-r1-db-hotfix.sh'
      - 'dist/p07/0.1.0-rc3/overlay/BUILD_ID'
      - 'dist/p07/0.1.0-rc3/overlay/lib/restore_as_verified.py'
      - 'dist/p07/0.1.0-rc3/tests/test_restore_as_real_db_compat.py'
      - '.github/workflows/p07-server-ops-rc3-real-r1-db-hotfix.yml'
  pull_request:
    paths:
      - 'installers/p07.sh'
      - 'installers/p07-toolbox.sh'
      - 'installers/p07-rc3-real-r1-db-hotfix.sh'
      - 'dist/p07/0.1.0-rc3/overlay/BUILD_ID'
      - 'dist/p07/0.1.0-rc3/overlay/lib/restore_as_verified.py'
      - 'dist/p07/0.1.0-rc3/tests/test_restore_as_real_db_compat.py'
      - '.github/workflows/p07-server-ops-rc3-real-r1-db-hotfix.yml'

permissions:
  contents: read

jobs:
  real-r1-db-hotfix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify source-exact hotfix identities
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          expected={
            'dist/p07/0.1.0-rc3/overlay/BUILD_ID':'de0c6ef3893299c02257dd878a5c36b2d19cb2c8',
            'dist/p07/0.1.0-rc3/overlay/lib/restore_as_verified.py':'c0df2750e0cb79e16bf46cad88e85cacacfc2415',
            'dist/p07/0.1.0-rc3/tests/test_restore_as_real_db_compat.py':'250b2613dc98dd5d14bf0ac4b5c0918966219789',
          }
          for path, want in expected.items():
              data=Path(path).read_bytes()
              got=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert got == want, (path, got, want)
          PY
          test "$(cat dist/p07/0.1.0-rc3/overlay/BUILD_ID)" = '0.1.0-rc3-guided-init11'
          python3 -m py_compile dist/p07/0.1.0-rc3/overlay/lib/restore_as_verified.py dist/p07/0.1.0-rc3/tests/test_restore_as_real_db_compat.py

      - name: Install fixed guided-init10 baseline
        run: |
          set -euo pipefail
          BASE_ROOT='https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/3effb6a7554d8da33955df52f8707df71b13f204'
          curl -fsSL "$BASE_ROOT/installers/p07.sh" -o /tmp/p07-init10.sh
          sudo env P07_PUBLIC_ROOT="$BASE_ROOT" P07_NO_EXEC=1 bash /tmp/p07-init10.sh
          test "$(vfops --build-id)" = '0.1.0-rc3-guided-init10'

      - name: Prove failed init11 restores exact pre-run init10
        run: |
          set -euo pipefail
          set +e
          sudo env \
            P07_PUBLIC_ROOT="https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/${{ github.sha }}" \
            P07_NO_EXEC=1 \
            P07_INIT11_TEST_FAIL=1 \
            bash installers/p07.sh >/tmp/p07-init11-fail.log 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          test "$(vfops --build-id)" = '0.1.0-rc3-guided-init10'
          grep -F '已恢复执行前版本' /tmp/p07-init11-fail.log

      - name: Install guided-init11 through stable wrapper
        run: |
          set -euo pipefail
          sudo env \
            P07_PUBLIC_ROOT="https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/${{ github.sha }}" \
            P07_NO_EXEC=1 \
            bash installers/p07.sh 2>&1 | tee /tmp/p07-init11.log
          test "$(vfops --version)" = 'VF Server Ops 0.1.0 RC3'
          test "$(vfops --build-id)" = '0.1.0-rc3-guided-init11'
          grep -F 'Restore-As Real R1 guided-init11 安装完成 ✓' /tmp/p07-init11.log
          grep -F 'TARGET Site User 私有 staging' /tmp/p07-init11.log
          grep -Fq '_database_compat_context' /opt/vf-server-ops/lib/restore_as_verified.py
          grep -Fq 'P07_CLOUDPANEL_OPERATION=' /opt/vf-server-ops/lib/restore_as_verified.py
          ! grep -Fq 'REAL_PASS' /opt/vf-server-ops/lib/restore_as_verified.py

      - name: Run Real R1 compatibility and Restore-As regressions
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/vf-server-ops/tests
          sudo cp dist/p07/0.1.0-rc3/tests/test_restore_as_real_db_compat.py /opt/vf-server-ops/tests/
          sudo cp dist/p07/0.1.0-rc3/tests/test_restore_as.py /opt/vf-server-ops/tests/
          sudo cp dist/p07/0.1.0-rc3/tests/test_restore_as_verified.py /opt/vf-server-ops/tests/
          sudo cp dist/p07/0.1.0-rc3/tests/test_restore_as_machine_e2e.py /opt/vf-server-ops/tests/
          cd /opt/vf-server-ops
          sudo python3 -m unittest -v \
            tests.test_restore_as_real_db_compat \
            tests.test_restore_as \
            tests.test_restore_as_verified \
            tests.test_restore_as_machine_e2e

      - name: Verify Toolbox and System Care boundary
        run: |
          set -euo pipefail
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-rc3-guided-init11"' installers/p07-toolbox.sh
          grep -Fq 'CloudPanel 备份 / 恢复 / 迁移' installers/p07-toolbox.sh
          grep -Fq '测试中' installers/p07-toolbox.sh
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc12"' installers/p07-toolbox.sh
          echo 'P07_REAL_R1_DB_HOTFIX_MACHINE=PASS'
