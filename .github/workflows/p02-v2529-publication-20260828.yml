name: P02 V2.5.29 Publication
on:
  push:
    branches: [task/p02-v2529-common-baseline-release-20260828]
    paths:
      - '.github/workflows/p02-v2529-publication-20260828.yml'
      - 'scripts/p02-v2529-publication.sh'
permissions: {contents: read}
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Publish exact verified release and update channel
        env:
          WRITE_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
          GH_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
        shell: bash
        run: bash scripts/p02-v2529-publication.sh
      - name: Persist publication evidence
        if: success()
        env:
          WRITE_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f vf-agent/results/P02-V2.5.29-FORMAL-RELEASE.json
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add vf-agent/results/P02-V2.5.29-FORMAL-RELEASE.json
          git commit -m 'evidence(P02): record V2.5.29 formal publication'
          git remote set-url origin "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/core-free-runner-public.git"
          git push origin HEAD:task/p02-v2529-common-baseline-release-20260828
