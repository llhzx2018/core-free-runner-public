name: P07 Release10 Beginner Chinese Exact-source Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-release10-beginner-exact-gate.yml'

permissions:
  contents: read

jobs:
  exact-source-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Verify private read capability
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN"

      - name: Checkout exact private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 6c6b250f3f14a5e39d14c167b2f4ca8ce6883abb
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Identity and syntax
        working-directory: source
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '6c6b250f3f14a5e39d14c167b2f4ca8ce6883abb'
          test "$(cat BUILD_ID)" = '0.1.0-release10'
          for f in bin/vfops-user bin/vfops-auto-backup bin/vfops-cloudpanel-ui bin/vfops-migrate-ui bin/vfops-storage-setup bin/vfops-init-ui lib/cloudpanel_ui_admin.sh lib/cloudpanel_ui_sites.sh lib/cloudpanel_ui_ops.sh; do bash -n "$f"; done

      - name: Beginner Chinese menu contract
        working-directory: source
        run: |
          set -Eeuo pipefail
          grep -Fq '服务器与网站概况' bin/vfops-user
          grep -Fq '自动备份 / 异地备份' bin/vfops-user
          grep -Fq '面板管理（CloudPanel）' bin/vfops-user
          grep -Fq '新服务器初始化' bin/vfops-user
          grep -Fq '设置 / 检查异地备份' bin/vfops-auto-backup
          grep -Fq 'HTTPS 证书状态' bin/vfops-cloudpanel-ui
          grep -Fq '申请免费 HTTPS 证书（Let’s Encrypt）' bin/vfops-cloudpanel-ui
          grep -Fq '清理网站加速缓存（Varnish）' bin/vfops-cloudpanel-ui
          grep -Fq '面板登录安全' bin/vfops-cloudpanel-ui
          grep -Fq '两步验证（2FA）' lib/cloudpanel_ui_admin.sh
          grep -Fq '网站配置模板（Vhost）' lib/cloudpanel_ui_admin.sh
          grep -Fq '远程连接与文件同步组件（SSH / rsync）' bin/vfops-migrate-ui
          grep -Fq '新服务器主动从旧服务器复制数据' bin/vfops-migrate-ui
          grep -Fq 'P07 · 异地备份设置' bin/vfops-storage-setup
          grep -Fq '授权客户端（OAuth）的 ID + 密钥' bin/vfops-storage-setup
          grep -Fq '虚拟内存（Swap）' bin/vfops-init-ui
          grep -Fq 'Beginner Chinese Menu Contract' docs/authority/RPD.md

      - name: Full Slot3 regressions
        working-directory: source
        run: |
          set -Eeuo pipefail
          export PYTHONPATH="$PWD/lib"
          bash tests/smoke.sh >/tmp/p07-smoke.log 2>&1
          python3 -m unittest discover -s tests -p 'test_*.py' -q

      - name: Machine and secret boundary
        working-directory: source
        run: |
          set -Eeuo pipefail
          NO_COLOR=1 bash bin/vfops-user --version | grep -Fx 'VF Server Ops 0.1.0'
          NO_COLOR=1 bash bin/vfops-user --build-id | grep -Fx '0.1.0-release10'
          ! NO_COLOR=1 bash bin/vfops-user --version | grep -q $'\033'
          python3 scripts/secret_scan.py --root . >/tmp/p07-secret-scan.log 2>&1

      - name: Result
        if: always()
        run: |
          echo 'P07_RELEASE10_BEGINNER_SOURCE=6c6b250f3f14a5e39d14c167b2f4ca8ce6883abb'
          echo 'P07_PRODUCTION_WRITE=NOT_RUN'
          echo 'P07_DNS_WRITE=NOT_RUN'
