name: P01 V2.37.5 Stage Formal Candidate
on:
  push:
    branches: [release/p01-v2375-hotfix-20260902]
    paths:
      - .github/workflows/p01-v2375-stage-formal-candidate-20260902.yml
      - scripts/p01-v2375-stage-formal-candidate-20260902.sh
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: release/v2375-formal-candidate-20260902
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: release/p01-v2375-hotfix-20260902
          path: runner
      - name: Stage candidate
        shell: bash
        run: bash runner/scripts/p01-v2375-stage-formal-candidate-20260902.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-v2375-stage-${{ github.run_id }}
          path: |
            /tmp/p01-v2375-stage-verdict.txt
            /tmp/p01-v2375-stage-files.txt
          if-no-files-found: warn
          retention-days: 90
