name: P01 IYF GIF Cover Hotfix Gate R3
on:
  push:
    branches:
      - diag/p01-v2372-iyf-e2e-20260902
    paths:
      - .github/workflows/p01-iyf-gif-hotfix-gate-20260902.yml
      - scripts/p01_iyf_gif_hotfix_gate_r3.sh
permissions:
  contents: read
jobs:
  hotfix:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: diag/p01-v2372-iyf-e2e-20260902
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: hotfix/p01-iyf-gif-cover-20260902
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Run corrected IYF GIF hotfix gate
        shell: bash
        env:
          PRODUCT_DIR: product
        run: bash runner/scripts/p01_iyf_gif_hotfix_gate_r3.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-iyf-gif-hotfix-r3-${{ github.run_id }}
          path: /tmp/p01-iyf-gif-hotfix-r3-evidence
          if-no-files-found: warn
          retention-days: 90
