name: P01 IYF GIF Cover Hotfix Gate
on:
  push:
    branches: [diag/p01-v2372-iyf-e2e-20260902]
    paths: [.github/workflows/p01-iyf-gif-hotfix-gate-20260902.yml]
permissions:
  contents: read
jobs:
  hotfix:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BASE: 6f09d59e3ecc0ed54b9a3ae6e3fc6ba22b109ea1
      PRODUCT_BRANCH: hotfix/p01-iyf-gif-cover-20260902
    steps:
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.PRODUCT_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Exact source fence and apply minimal hotfix
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          test "$(git rev-parse HEAD)" = "$BASE"
          test "$(cat VERSION)" = 2.37.2
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/ResourceCoverCache.php')
          s=p.read_text(encoding='utf-8')
          old="""        elseif (substr($bytes, 0, 4) === 'RIFF' && substr($bytes, 8, 4) === 'WEBP') $mime = 'image/webp';
        $exts = ['image/png'=>'png','image/jpeg'=>'jpg','image/webp'=>'webp'];
        if (!isset($exts[$mime])) throw new RuntimeException('自动封面仅接受 PNG、JPG、WebP。');"""
          new="""        elseif (substr($bytes, 0, 4) === 'RIFF' && substr($bytes, 8, 4) === 'WEBP') $mime = 'image/webp';
        elseif (substr($bytes, 0, 6) === 'GIF87a' || substr($bytes, 0, 6) === 'GIF89a') $mime = 'image/gif';
        $exts = ['image/png'=>'png','image/jpeg'=>'jpg','image/webp'=>'webp','image/gif'=>'gif'];
        if (!isset($exts[$mime])) throw new RuntimeException('自动封面仅接受 PNG、JPG、WebP、GIF。');"""
          if s.count(old)!=1: raise SystemExit('ResourceCoverCache anchor mismatch')
          p.write_text(s.replace(old,new),encoding='utf-8')
          p=Path('src/assets/workspace.js')
          s=p.read_text(encoding='utf-8')
          old='const coverRetryKey=(id)=>`vf-cover-retry:v3:${id}`;'
          new='const coverRetryKey=(id)=>`vf-cover-retry:v4:${id}`;'
          if s.count(old)!=1: raise SystemExit('workspace retry anchor mismatch')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          test "$(git diff --name-only | sort)" = $'src/app/ResourceCoverCache.php\nsrc/assets/workspace.js'
          test "$(cat VERSION)" = 2.37.2
          git diff --check
          php -l src/app/ResourceCoverCache.php
          node --check src/assets/workspace.js
          grep -F "'image/gif'=>'gif'" src/app/ResourceCoverCache.php >/dev/null
          grep -F 'vf-cover-retry:v4:' src/assets/workspace.js >/dev/null
      - name: True first-attempt IYF E2E through save and serving
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-iyf-hotfix && cp -a product/src /tmp/p01-iyf-hotfix
          php -S 127.0.0.1:18511 -t /tmp/p01-iyf-hotfix >/tmp/p01-iyf-hotfix-server.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          COOKIE=/tmp/p01-iyf-hotfix.cookies
          for i in $(seq 1 80); do curl -fsS -c "$COOKIE" -b "$COOKIE" http://127.0.0.1:18511/setup.php -o /tmp/p01-iyf-hotfix-setup.html && break; sleep .25; done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-iyf-hotfix-setup.html',encoding='utf-8').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s); assert m
          print(m.group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST http://127.0.0.1:18511/setup.php \
            --data-urlencode "setup_csrf=$CSRF" \
            --data-urlencode 'site_title=IYF GIF Hotfix' \
            --data-urlencode 'admin_password=IYFGIF!2026' \
            --data-urlencode 'admin_password_confirm=IYFGIF!2026' >/tmp/p01-iyf-hotfix-setup-post.html
          ROOT=/tmp/p01-iyf-hotfix php <<'PHP' | tee /tmp/p01-iyf-hotfix-e2e.jsonl
          <?php
          require getenv('ROOT').'/app/bootstrap.php';
          require getenv('ROOT').'/app/SurfaceRepository.php';
          require getenv('ROOT').'/app/ResourceCoverCache.php';
          $db=vf_db(); $repo=new VfRepository($db); $surface=new VfSurfaceRepository($db);
          $cat=$repo->createCategory(['name'=>'IYF HOTFIX','description'=>'','is_private'=>false]);
          $urls=['https://www.iyf.tv/play/kr8SspeNzb3','https://www.iyf.tv/play/MRcWYmJRueF','https://mview.iyf.tv/play/27Qr2mVwuzJ'];
          foreach($urls as $i=>$url){
            $saved=$repo->saveLink(null,['category_id'=>$cat,'title'=>'IYF '.($i+1),'url'=>$url,'description'=>'','tags'=>'iyf','is_private'=>true,'is_favorite'=>false],'manual');
            $id=(int)($saved['id']??0); if($id<=0) throw new RuntimeException('seed id missing');
            $surface->upsertProfile($id,['surface'=>'watch','resource_kind'=>'电影']);
            $result=(new VfResourceCoverCache($db))->refreshOne($id,true);
            $stmt=$db->prepare("SELECT link_id,file_name,mime_type,byte_size,width,height,file_hash FROM resource_asset_files WHERE link_id=? AND asset_kind='cover'");$stmt->execute([$id]);$cover=$stmt->fetch(PDO::FETCH_ASSOC)?:null;
            echo json_encode(['id'=>$id,'url'=>$url,'result'=>$result,'cover'=>$cover],JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE),"\n";
          }
          PHP
          python3 - <<'PY'
          import json,os
          rows=[json.loads(x) for x in open('/tmp/p01-iyf-hotfix-e2e.jsonl',encoding='utf-8') if x.strip().startswith('{')]
          assert len(rows)==3 and len({x['id'] for x in rows})==3
          for x in rows:
              assert x['result'].get('success') is True, x
              c=x.get('cover'); assert c, x
              assert c['mime_type'] in ('image/gif','image/webp','image/jpeg','image/png'), c
              assert int(c['byte_size'])>64 and int(c['width'])>=32 and int(c['height'])>=32, c
              path='/tmp/p01-iyf-hotfix/private/resource-assets/covers/'+c['file_name']
              assert os.path.isfile(path), path
          print('P01_IYF_FIRST_ATTEMPT_SAVE=3/3 PASS')
          PY
          for id in 1 2 3; do
            curl -fsS -D "/tmp/cover-$id.headers" -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:18511/resource-cover.php?id=$id" -o "/tmp/cover-$id.bin"
            grep -Eiq '^Content-Type: image/(gif|webp|jpeg|png)' "/tmp/cover-$id.headers"
            test "$(stat -c%s "/tmp/cover-$id.bin")" -gt 64
          done
          printf 'P01_IYF_RESOURCE_COVER_SERVE=3/3 PASS\n' | tee /tmp/p01-iyf-hotfix-verdict.txt
          kill "$PID"; trap - EXIT
      - name: Safety boundary and commit candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          test "$(git diff --name-only | sort)" = $'src/app/ResourceCoverCache.php\nsrc/assets/workspace.js'
          test "$(cat VERSION)" = 2.37.2
          test "$(git rev-parse HEAD:database)" = "$(git rev-parse "$BASE":database)"
          git diff --check
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add src/app/ResourceCoverCache.php src/assets/workspace.js
          git commit -m 'fix(P01): support IYF GIF auto covers'
          test "$(git diff --name-only "$BASE" HEAD | sort)" = $'src/app/ResourceCoverCache.php\nsrc/assets/workspace.js'
          git push origin HEAD:$PRODUCT_BRANCH
          printf 'P01_IYF_GIF_HOTFIX_GATE=PASS\nBASE=%s\nCANDIDATE=%s\nFILES=2\nVERSION_UNCHANGED=2.37.2\nSCHEMA_CHANGE=NO\nMIGRATION=NONE\nOWNER_PRODUCTION_WRITE=NO\n' "$BASE" "$(git rev-parse HEAD)" | tee -a /tmp/p01-iyf-hotfix-verdict.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-iyf-gif-hotfix-${{ github.run_id }}
          path: |
            /tmp/p01-iyf-hotfix-e2e.jsonl
            /tmp/p01-iyf-hotfix-verdict.txt
            /tmp/p01-iyf-hotfix-server.log
            /tmp/cover-*.headers
          if-no-files-found: warn
          retention-days: 90
