name: P01 L2 Wave 1-10 Current Truth Docs
on:
  push:
    branches: [run/p01-l2-wave10-docs-20260902]
    paths: [.github/workflows/p01-l2-wave10-docs-20260902.yml]
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: run/p01-l2-wave10-docs-20260902
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: docs/p01-l2-wave10-current-truth-20260902
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Fresh authority fence
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C product fetch origin main develop
          test "$(git -C product rev-parse HEAD)" = 923368dc7152b6063c0e4d1aeec3afc849bfff18
          test "$(git -C product rev-parse origin/develop)" = 923368dc7152b6063c0e4d1aeec3afc849bfff18
          test "$(git -C product rev-parse origin/main)" = 4a41d3533fe8450c3f491d5aaf28417536012ba0
      - name: Apply docs-only patch
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          python3 ../runner/scripts/p01_l2_wave10_docs_patch.py
      - name: Verify exact Current Truth contract
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          git diff --check
          python3 -m json.tool VF_PROJECT.json >/dev/null
          test "$(cat VERSION)" = 2.36.4
          test "$(cat src/VERSION.txt)" = 2.36.4
          test -z "$(git diff --name-only -- src database VERSION)"
          python3 - <<'PY'
          import json
          d=json.load(open('VF_PROJECT.json',encoding='utf-8'))
          assert d['production_version']=='2.36.5'
          assert d['production_release']['version']=='2.36.5'
          assert d['production_release']['release_source']=='ef86eba16aec71c1d0dabc16ad23089a78ee5057'
          assert d['production_release']['runtime_tree']=='a7f472ec1f449ada1152d271f2723c52e7b58144'
          assert d['component_versions']['browser_helper']=='1.6.5'
          assert d['working_version']=='2.36.4'
          assert d['current_change']['product_prs']==list(range(202,212))
          assert len(d['l2_product_wave_20260902']['waves'])==10
          assert d['l2_product_wave_20260902']['state'].endswith('UNRELEASED')
          PY
          grep -F 'Owner Production: V2.36.5' README.md >/dev/null
          grep -F 'Current develop before docs checkpoint: 923368dc7152b6063c0e4d1aeec3afc849bfff18' README.md >/dev/null
          grep -F 'UNRELEASED / DEVELOP ONLY' README.md >/dev/null
          grep -F 'P01_L2_WAVE10_CURRENT_TRUTH' docs/authority/CURRENT.md >/dev/null
          grep -F 'P01_L2_WAVE10_HANDOFF_CURRENT' docs/handoff/CURRENT_STATE.md >/dev/null
          grep -F 'P01_CURRENT_TRUTH_OVERLAY_20260902' docs/authority/SSOT.md >/dev/null
          grep -F 'P01_CURRENT_TRUTH_OVERLAY_20260902' docs/authority/RPD.md >/dev/null
          grep -F 'P01_CURRENT_TRUTH_OVERLAY_20260902' docs/authority/ACCEPTANCE_MATRIX.md >/dev/null
          grep -F 'P01_L2_FUNCTIONAL_OVERLAY_20260902' docs/authority/P01_FUNCTIONAL_CONTRACT_20260829.md >/dev/null
          grep -F '| 10 | #211 | `33561344420` PASS |' docs/evidence/P01_L2_PRODUCT_OPT_WAVE_1_10_CHECKPOINT_20260902.md >/dev/null
          changed=$(git diff --name-only | sort)
          expected=$(printf '%s\n' CHANGELOG.md README.md VF_PROJECT.json docs/README.md docs/authority/ACCEPTANCE_MATRIX.md docs/authority/CURRENT.md docs/authority/P01_FUNCTIONAL_CONTRACT_20260829.md docs/authority/P01_L2_PRODUCT_OPT_CHECKPOINT_20260902.md docs/authority/RPD.md docs/authority/SSOT.md docs/evidence/P01_L2_PRODUCT_OPT_WAVE_1_10_CHECKPOINT_20260902.md docs/handoff/CURRENT_STATE.md docs/handoff/P01_L2_CURRENT_CHECKPOINT_20260902.md | sort)
          printf '%s\n' "$changed"
          test "$changed" = "$expected"
          echo 'P01 L2 WAVE 1-10 CURRENT TRUTH DOCS PASS'
      - name: Commit and push docs candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add CHANGELOG.md README.md VF_PROJECT.json docs
          git commit -m 'docs(P01): sync V2.36.5 production and L2 Wave 1-10 truth'
          git push origin HEAD:docs/p01-l2-wave10-current-truth-20260902
          echo "CANDIDATE=$(git rev-parse HEAD)"
          echo "TREE=$(git rev-parse HEAD^{tree})"
