name: P08 R88 Landing history owner-only feature proof (one-off)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p08-r88-landing-history-once.yml'
permissions:
  contents: read
jobs:
  p08-r88:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout transient public harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout exact private VF AdOps source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-adops
          ref: f759ac18f2b65ebcd8a9de961c502b807e925f5b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-p08-r88
      - name: Refuse incorrect private source or on-disk Owner state
        run: |
          set -euo pipefail
          test "$(git -C private-p08-r88 rev-parse HEAD)" = f759ac18f2b65ebcd8a9de961c502b807e925f5b
          test "$(cat private-p08-r88/VERSION)" = 0.1.1
          test ! -e private-p08-r88/.env
          test ! -e private-p08-r88/storage/app/private/adops/installation/installed.json
          echo P08_R88_EXACT_SOURCE=PASS
      - name: Install PHP 8.4 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: zip, mbstring, dom, fileinfo, pdo_sqlite, sqlite3, pdo_mysql, intl, sodium
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build isolated locked Laravel and Vite dependencies
        run: |
          set -euo pipefail
          cd private-p08-r88
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          composer install --no-interaction --no-progress --prefer-dist --no-scripts > "$RUNNER_TEMP/p08-r88-composer.log" 2>&1 || { tail -n 25 "$RUNNER_TEMP/p08-r88-composer.log"; exit 1; }
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-r88-npm.log" 2>&1 || { tail -n 25 "$RUNNER_TEMP/p08-r88-npm.log"; exit 1; }
          npm run build
          npm run typecheck
          npm run test:unit
          # Task-level source/foundation + genuine Vue build are required here.\n          # The unrelated historical R22 update-screen mature text marker is\n          # currently stale; classify that existing gate separately, not as a\n          # Landing R88 product failure. Do not waive PHP/HTTP/ZIP tests.\n          python3 scripts/check_stack_contract.py --phase foundation
          echo P08_R88_LOCKED_LARAVEL_VITE_TYPES=PASS
      - name: Run real owner-only Laravel SQLite HTTP and legacy Landing regressions
        run: |
          set -euo pipefail
          cd private-p08-r88
          php -l app/Http/Controllers/LandingController.php
          php -l app/Http/Middleware/SecurityHeaders.php
          php -l routes/web.php
          php -l tests/Feature/LandingHistoryPreviewTest.php
          ./vendor/bin/phpunit --no-progress tests/Feature/LandingHistoryPreviewTest.php
          php tests/run.php
          echo P08_R88_LANDING_REVISIONS_OWNER_HTTP_SECURITY=PASS
      - name: Secure cleanup of private source and generated tests
        if: always()
        run: |
          rm -rf private-p08-r88
          rm -f "$RUNNER_TEMP/p08-r88-composer.log" "$RUNNER_TEMP/p08-r88-npm.log"
