name: P07 one-time synthetic cross-engine SQL schema difference proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-synthetic-schema-difference-proof.yml'
permissions:
  contents: read
jobs:
  probe:
    if: ${{ github.repository == 'llhzx2018/core-free-runner-public' && github.head_ref == 'test/p07-sql-schema-cosmetic-proof-20261030' && github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Generate synthetic MySQL and MariaDB CREATE TABLE metadata only
        shell: bash
        run: |
          set -Eeuo pipefail
          scratch="$(mktemp -d -p "$RUNNER_TEMP" p07-schema-XXXXXX)"
          trap 'docker rm -f p07-testmysql84 p07-testmaria118 >/dev/null 2>&1 || true; rm -rf -- "$scratch"' EXIT
          docker run --rm -d --network none --name p07-testmysql84 -e MYSQL_ALLOW_EMPTY_PASSWORD=yes mysql:8.4 >/dev/null
          docker run --rm -d --network none --name p07-testmaria118 -e MARIADB_ALLOW_EMPTY_ROOT_PASSWORD=yes mariadb:11.8 >/dev/null
          for i in $(seq 1 90); do
            if docker exec p07-testmysql84 mysql -uroot -N -e 'SELECT 1' >/dev/null 2>&1 && docker exec p07-testmaria118 mariadb -uroot -N -e 'SELECT 1' >/dev/null 2>&1; then break; fi
            sleep 2
          done
          for engine in mysql84 mariadb118; do
            if [[ "$engine" == mysql84 ]]; then server=p07-testmysql84; cli=mysql; else server=p07-testmaria118; cli=mariadb; fi
            docker exec "$server" "$cli" -uroot -e "CREATE DATABASE vfops_fixture CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci; USE vfops_fixture; CREATE TABLE sample (id INT NOT NULL PRIMARY KEY, payload VARCHAR(64) NOT NULL); INSERT INTO sample VALUES (1, 'alpha'), (2, 'beta');"
          done
          docker exec p07-testmysql84 mysqldump -uroot --single-transaction --skip-comments --skip-dump-date --set-gtid-purged=OFF vfops_fixture > "$scratch/mysql.sql"
          docker exec p07-testmaria118 mariadb-dump -uroot --single-transaction --skip-comments --skip-dump-date vfops_fixture > "$scratch/maria.sql"
          python3 - "$scratch/mysql.sql" "$scratch/maria.sql" <<'PY'
          import difflib,re,sys
          def get(path):
              raw=open(path,encoding='utf8').read()
              m=re.search(r'CREATE TABLE `sample`\s*\((.*?)\) ENGINE=.*?;',raw,re.S)
              if not m: raise SystemExit("SYNTHETIC_SCHEMA_PARSE_FAILED")
              # Only the two explicitly created synthetic columns and table options.
              create=m.group()
              guarded=re.findall(r'/\*!40000 ALTER TABLE .*? (?:ENABLE|DISABLE) KEYS \*/;',raw)
              return create,guarded
          mysql,mg=get(sys.argv[1]);maria,rg=get(sys.argv[2])
          print('SYNTHETIC_MYSQL_CREATE='+mysql.replace(chr(10),' '))
          print('SYNTHETIC_MARIA_CREATE='+maria.replace(chr(10),' '))
          print('SYNTHETIC_GUARDED_DDL_COUNTS='+str((len(mg),len(rg))))
          print('SYNTHETIC_COLUMNS_EQUAL='+str(mysql==maria))
          print('SYNTHETIC_SCHEMA_DIFF_TOKENS=')
          for line in difflib.ndiff(mysql.splitlines(),maria.splitlines()):
              if line.startswith(('+ ','- ')): print(line)
          PY
          echo P07_SYNTHETIC_SQL_SCHEMA_DIFF_CAPTURED
