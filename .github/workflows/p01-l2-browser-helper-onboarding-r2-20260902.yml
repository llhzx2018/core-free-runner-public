name: P01 L2 Browser Helper Onboarding R3
on:
  push:
    branches: [release/p01-v2365-candidate-20260902]
    paths: [.github/workflows/p01-l2-browser-helper-onboarding-r2-20260902.yml]
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: release/p01-v2365-candidate-20260902
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: product/p01-browser-helper-onboarding-20260902
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Fresh source fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = 65abfb77eb66202c61f13940ec188b99b6c9b125
          test "$(git -C product rev-parse origin/develop)" = 65abfb77eb66202c61f13940ec188b99b6c9b125
      - name: Apply onboarding patch
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          python3 ../runner/scripts/p01_browser_helper_onboarding_patch.py
      - name: Verify exact product contract
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          php -l src/browser-helper.php >/dev/null
          git diff --check
          grep -F '3 步完成浏览器助手' src/browser-helper.php >/dev/null
          grep -F '安装浏览器助手' src/browser-helper.php >/dev/null
          grep -F '连接这个 VF Start' src/browser-helper.php >/dev/null
          grep -F '保存任意网页完成验证' src/browser-helper.php >/dev/null
          grep -F 'data-copy="#helperSiteUrlModal"' src/browser-helper.php >/dev/null
          grep -F '打开扩展设置 → 粘贴站点地址和令牌 → 连接并保存' src/browser-helper.php >/dev/null
          grep -F '<summary>连接管理</summary>' src/browser-helper.php >/dev/null
          test "$(cat src/VERSION.txt)" = 2.36.4
          git diff --name-only | sort | tee /tmp/changed.txt
          expected=$(printf '%s\n' src/assets/admin-pages.css src/browser-helper.php | sort)
          test "$(cat /tmp/changed.txt)" = "$expected"
          test "$(git diff --name-only -- database src/migrations | wc -l | tr -d ' ')" = 0
          echo 'BROWSER HELPER ONBOARDING PASS'
      - name: Commit and push candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add src/browser-helper.php src/assets/admin-pages.css
          git commit -m 'feat(P01): turn browser helper setup into three steps'
          git push origin HEAD:product/p01-browser-helper-onboarding-20260902
          echo "CANDIDATE=$(git rev-parse HEAD)"
          echo "TREE=$(git rev-parse HEAD^{tree})"
