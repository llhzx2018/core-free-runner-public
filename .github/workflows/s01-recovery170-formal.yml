name: S01 Theme exact formal release
on:
  push:
    branches: [task/s01-recovery170-20261022]
    paths: ['.github/workflows/s01-recovery170-formal.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.170
  TARGET_SHA: 5e54d38be3dca221438f28519b2faf5f2c77d241
  TARGET_TREE: e4b6aa075ba6b86ecb52ee020d5eb59ad42c4ff8
  BASE_SHA: ee888dcb308cbc687ae52d33c258cc61a43ee4ee
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 5e54d38be3dca221438f28519b2faf5f2c77d241
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact verified candidate and merged source readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider candidate-proof
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/39743402161 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/39743402161 --jq .head_sha)" = 117df444d75c0d5f3dc312c7cc0e2792694b33b6
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/39743402161 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/39743402161 --jq .head_sha)" = 117df444d75c0d5f3dc312c7cc0e2792694b33b6
          test "$(gh api repos/$TARGET_REPO/commits/main --jq .sha)" = "$TARGET_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$TARGET_SHA --jq .tree.sha)" = "$TARGET_TREE"
          gh run download 39743402161 --repo llhzx2018/core-free-runner-public --name s01-recovery-39743402161 --dir candidate-proof
          cmp candidate-proof/state-before.sha256 candidate-proof/state-after.sha256
          cmp candidate-proof/review-before.sha256 candidate-proof/review-after.sha256
          python3 control/lanes/s01-recovery170-20261022/package.py
          python3 - <<'PYVERIFY'
          import json,pathlib
          old=json.loads(pathlib.Path('candidate-proof/package.json').read_text())
          new=json.loads(pathlib.Path('proof/package.json').read_text())
          assert pathlib.Path('candidate-proof/baseline-regression.txt').read_text().strip()=='BASELINE169_CANCEL_RETAINS_DEFAULT_CONFIRMATION_REPRODUCED'
          assert pathlib.Path('candidate-proof/confirmation-regression.txt').read_text().strip()=='RECOVERY_FRESH_CONFIRM_ALL_DISMISS_PATHS_NO_WRITES_PASS'
          mounted=json.loads(pathlib.Path('candidate-proof/mounted-results.json').read_text())
          assert mounted['status']=='PASS' and mounted['recovery_action_requests']==0 and mounted['revision_unchanged'] is True
          clean=json.loads(pathlib.Path('candidate-proof/clean-install.json').read_text())
          assert clean['status']=='PASS' and clean['admin_login']=='PASS'
          for k in ['status','version','tree','sha256','bytes','files']:assert old[k]==new[k],k
          assert new['sha256']=='d66a7f2522a0e69fe04aa6de6e5eed4e42d7ff096093853cc35cba25f4b9a2fa' and new['bytes']==1971834
          print('MERGED_TREE_EQUALS_TESTED_TREE_AND_EXACT_PACKAGE_PASS')
          PYVERIFY
      - name: Formal release only exact verified bytes
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.35.170 --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create v1.35.170 provider/vf-tools-theme_V1.35.170.zip --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Theme V1.35.170' --notes '主题备份与恢复：每次打开恢复默认配置弹窗都清空旧确认词并重新锁定按钮，取消后不沿用上次确认。Chromium旧版复现与修复、四种关闭后重开、焦点恢复、实际WordPress桌面交互且零恢复写请求、真实ZIP安装与169→170升级回退重复安装及数据保护通过。恢复事务、服务端校验、保护点和历史逻辑保持。M3U8维持1.25.94；Production由Owner手工升级，页面视觉以升级后截图核对。' --latest
          fi
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/v1.35.170 --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh release view v1.35.170 --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - name: Authenticated formal asset remote bytes readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download v1.35.170 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.170.zip --dir remote
          cmp provider/vf-tools-theme_V1.35.170.zip remote/vf-tools-theme_V1.35.170.zip
          echo 'd66a7f2522a0e69fe04aa6de6e5eed4e42d7ff096093853cc35cba25f4b9a2fa  remote/vf-tools-theme_V1.35.170.zip' | sha256sum -c
          test "$(stat -c %s remote/vf-tools-theme_V1.35.170.zip)" = 1971834
          gh release view v1.35.170 --repo "$TARGET_REPO" --json url,publishedAt,tagName > proof/formal-release.json
          echo FORMAL_RELEASE_EXACT_REMOTE_ASSET_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-operations-formal-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources packages
        if: always()
        run: rm -rf target provider remote candidate-proof
