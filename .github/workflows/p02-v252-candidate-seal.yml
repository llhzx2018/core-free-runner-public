name: P02 V2.5.2 Candidate Seal
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p02-v252-candidate-seal.yml']
permissions: {contents: read}
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require registered capabilities
        env:
          READ_TOKEN: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'
          WRITE_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"; test -n "$WRITE_TOKEN"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: maintenance/v2.5.2-editor-responsive-hotfix
          token: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
          fetch-depth: 0
          persist-credentials: true
          path: p02
      - name: Seal manifest changelog and release builder
        working-directory: p02
        run: |
          set -Eeuo pipefail
          test "$(cat VERSION)" = 2.5.2
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('.')
          manifest_path=root/'SOURCE_MANIFEST.json'
          m=json.loads(manifest_path.read_text(encoding='utf-8'))
          m['version']='2.5.2'
          m['mapping_contract']='Each declared runtime source file must exist exactly once at repo_path; hashes bind the Git-native V2.5.2 Production Hotfix derived from formal V2.5.0. Formal release identity is not assigned by this candidate manifest.'
          entries=m['entries']
          if not any(e['full_path']=='assets/v252-hotfix.css' for e in entries):
              # Keep runtime paths sorted consistently with existing assets block.
              insert_at=next((i+1 for i,e in enumerate(entries) if e['full_path']=='assets/v251-preboot.js'),len(entries))
              entries.insert(insert_at,{'full_path':'assets/v252-hotfix.css','repo_path':'public/assets/v252-hotfix.css'})
          for e in entries:
              p=root/e['repo_path']; b=p.read_bytes(); h=hashlib.sha256(b).hexdigest()
              e['bytes']=len(b); e['sha256']=h; e['repo_sha256']=h
          m['runtime_source_file_count']=len(entries)
          manifest_path.write_text(json.dumps(m,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')

          ch=root/'CHANGELOG.md'; old=ch.read_text(encoding='utf-8')
          if not old.startswith('# VF Library V2.5.2'):
              head='''# VF Library V2.5.2 · V2.5.0 Production UA/UI Hotfix · 2026-08-18\n\n- 合并 V2.5.1 尚未上线的 Production Hotfix：修复新浏览器会话继承 Document List 折叠状态导致中间栏消失、恢复入口被裁切/遮挡，以及编辑器 A-/A+ 数值变化但正文视觉字号不变化的问题。\n- 修复 V2.5.0 编辑模式宽度被历史 `920px / 1120px` 上限限制的问题：Desktop Edit / Split 改为使用当前可用工作区宽度；Reader 继续保持适合长文阅读的受控版心。\n- 修复编辑模式进入后 Document List 实体被隐藏但 Grid 轨道仍占位形成大块空白的问题；除非用户主动折叠或进入 Focus，Document List 与唯一边界控制始终可见。\n- 浏览器内部回归覆盖 1920 / 1600 / 1440 / 1319 / 1024 Desktop、900 / 768 PAD、430 / 390 Mobile，以及 Sidebar / Document List 折叠空间回收、字号变化、新会话列表恢复和横向溢出。\n- V2.5.1 在 OWNER 升级前被 V2.5.2 supersede，不作为 Production Upgrade Target。\n- Schema 保持 `2401`，无 Migration；Production 当前仍为 V2.5.0。\n\n'''
              ch.write_text(head+old,encoding='utf-8')

          src=root/'scripts/build-release-v2.5.1.py'; dst=root/'scripts/build-release-v2.5.2.py'
          s=src.read_text(encoding='utf-8')
          s=s.replace("VER='2.5.1'","VER='2.5.2'")
          s=s.replace('release-v2.5.1','release-v2.5.2').replace('release/v2.5.1','release/v2.5.2')
          s=s.replace('PASS_RUN_32132527045','PASS_RUN_32134169497')
          s=s.replace('V2.5.1 is a scoped Production hotfix for V2.5.0. It restores reliable Document List visibility across browser sessions and restores the editor A-/A+ visual font-size control.','V2.5.2 is the consolidated Production hotfix for V2.5.0. It fixes Document List visibility/recovery, restores the editor A-/A+ visual font-size control, and makes Edit/Split use the available workspace width.')
          s=s.replace('- All V2.5.0 workspace, Reader, Editor and Stable Core behavior is otherwise retained.','- Edit/Split now expand with the available workspace, while Reader keeps a bounded readable line length.\n- The Document List remains visible in edit mode unless the user explicitly collapses it or enters Focus.\n- All V2.5.0 Stable Core behavior is otherwise retained.')
          dst.write_text(s,encoding='utf-8')
          dst.chmod(0o755)
          PY
          rm -rf "$RUNNER_TEMP/deploy"; mkdir -p "$RUNNER_TEMP/deploy"
          bash scripts/build-deploy-tree.sh "$RUNNER_TEMP/deploy" >/dev/null
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          m=json.loads(Path('SOURCE_MANIFEST.json').read_text())
          dep=Path(os.environ['RUNNER_TEMP'])/'deploy'
          actual={p.relative_to(dep).as_posix():(p.stat().st_size,hashlib.sha256(p.read_bytes()).hexdigest()) for p in dep.rglob('*') if p.is_file()}
          declared={e['full_path']:(int(e['bytes']),e['sha256']) for e in m['entries']}
          assert m['version']=='2.5.2' and m['runtime_source_file_count']==61
          assert actual==declared,(set(actual)-set(declared),set(declared)-set(actual))
          print('SOURCE_MANIFEST_61_OF_61=PASS')
          PY
          python3 scripts/repository-gates.py
          python3 -m py_compile scripts/build-release-v2.5.2.py
          git status --short
          git config user.name 'VF Release Automation'
          git config user.email 'vf-release@users.noreply.github.com'
          git add VERSION CHANGELOG.md SOURCE_MANIFEST.json public/index.php public/assets/v251-hotfix.css public/assets/v251-preboot.js public/assets/v252-hotfix.css scripts/build-release-v2.5.2.py
          git diff --cached --check
          if ! git diff --cached --quiet; then git commit -m 'chore(v2.5.2): seal responsive hotfix candidate'; fi
          git push origin HEAD:maintenance/v2.5.2-editor-responsive-hotfix
          echo SEALED_COMMIT=$(git rev-parse HEAD)
