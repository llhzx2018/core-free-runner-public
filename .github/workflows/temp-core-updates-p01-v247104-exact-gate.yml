name: TEMP core-updates P01 V2.47.104 exact gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-core-updates-p01-v247104-exact-gate.yml'

permissions:
  contents: read

jobs:
  exact-private-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_REPO: llhzx2018/core-updates
      TARGET_SHA: ed20839242cd59587e5a21a7ecd6d5b87dddd2d6
      PRODUCT_REPO: llhzx2018/vf-start
      VERSION: 2.47.104
      SOURCE_VERSION: 2.47.103
      RELEASE_ID: "398722413"
      PRODUCT_SHA: 2915164400a17538dd8c266a1c6f5a4a71f6f44f
      UPDATE_ASSET: VF_Start_V2.47.104_UPDATE.zip
      UPDATE_BYTES: "2008853"
      UPDATE_SHA256: d51f3b6e55cf221229e10580c2bc5c10350e63ec483f73e278e28c49b5979ef7
    steps:
      - name: Checkout public verification control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Resolve exact private core-updates source
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          rm -rf /tmp/core-updates-exact
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${TARGET_REPO}.git" /tmp/core-updates-exact
          git -C /tmp/core-updates-exact fetch -q --depth 1 origin "$TARGET_SHA"
          git -C /tmp/core-updates-exact checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/core-updates-exact rev-parse HEAD)" = "$TARGET_SHA"
          echo CORE_UPDATES_EXACT_SOURCE_BOUND=PASS

      - name: Manifest contract and Update Core regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/core-updates-exact
          python3 scripts/check_manifest_contract.py | tee /tmp/core-updates-manifest-audit.json
          grep -F '"status": "PASS"' /tmp/core-updates-manifest-audit.json >/dev/null
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php update-core/php/tests/run.php | tee /tmp/core-updates-regression.txt
          echo CORE_UPDATES_CANONICAL_REGRESSION=PASS

      - name: Verify P01 distribution binding
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          p=json.loads(pathlib.Path('/tmp/core-updates-exact/projects/P01.json').read_text(encoding='utf-8'))
          assert p['schema_version']=='1.0'
          assert p['project_id']=='P01'
          assert p['component_id']=='APP'
          assert p['enabled'] is True
          assert p['current_version']==os.environ['SOURCE_VERSION']
          assert p['target_version']==os.environ['VERSION']
          assert p['update_type']=='ATOMIC'
          assert p['from_versions']==[os.environ['SOURCE_VERSION']]
          assert p['schema_from']==p['schema_to']=='2026090401'
          assert p['repository']==os.environ['PRODUCT_REPO']
          assert p['release_tag']=='v'+os.environ['VERSION']
          assert p['release_id']==int(os.environ['RELEASE_ID'])
          assert p['product_identity']==os.environ['PRODUCT_SHA']
          assert p['asset_name']==os.environ['UPDATE_ASSET']
          assert p['asset_bytes']==int(os.environ['UPDATE_BYTES'])
          assert p['asset_sha256']==os.environ['UPDATE_SHA256']
          assert p['backup_required'] is True
          assert p['rollback_supported'] is True
          print('P01_DISTRIBUTION_MANIFEST_BINDING=PASS')
          PY

      - name: Verify formal Release remote identity
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          curl -fsS             -H "Authorization: Bearer $READ_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${PRODUCT_REPO}/releases/tags/v${VERSION}"             -o /tmp/p01-release.json
          test "$(jq -r '.id' /tmp/p01-release.json)" = "$RELEASE_ID"
          test "$(jq -r '.tag_name' /tmp/p01-release.json)" = "v$VERSION"
          test "$(jq -r '.draft' /tmp/p01-release.json)" = false
          test "$(jq -r '.prerelease' /tmp/p01-release.json)" = false
          test "$(jq -r --arg n "$UPDATE_ASSET" '.assets[]|select(.name==$n)|.size' /tmp/p01-release.json)" = "$UPDATE_BYTES"
          test "$(jq -r --arg n "$UPDATE_ASSET" '.assets[]|select(.name==$n)|.digest' /tmp/p01-release.json)" = "sha256:$UPDATE_SHA256"
          curl -fsS             -H "Authorization: Bearer $READ_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${PRODUCT_REPO}/git/ref/tags/v${VERSION}"             -o /tmp/p01-tag.json
          test "$(jq -r '.object.sha' /tmp/p01-tag.json)" = "$PRODUCT_SHA"
          echo P01_FORMAL_RELEASE_REMOTE_BINDING=PASS

      - name: Final exact-source gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f /tmp/core-updates-manifest-audit.json
          test -f /tmp/core-updates-regression.txt
          echo P01_CORE_UPDATES_EXACT_PRIVATE_SOURCE=PASS

      - name: Cleanup private checkout
        if: always()
        shell: bash
        run: rm -rf /tmp/core-updates-exact /tmp/core-updates-manifest-audit.json /tmp/core-updates-regression.txt /tmp/p01-release.json /tmp/p01-tag.json
