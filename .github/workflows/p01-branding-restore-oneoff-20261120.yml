name: P01 private branding restore no-loss synthetic verification
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  p01-branding-restore-proof:
    if: github.head_ref == 'test/p01-branding-restore-20261120' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Confirm public-safe scope
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = llhzx2018/core-free-runner-public
          echo P01_REAL_OWNER_SQLITE_OR_IMAGES_ON_RUNNER=NO
      - name: Transient exact P01 checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 66a90c3417f3c58a1830eb07b0626f8db9a977aa
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: candidate
      - name: Read authoritative shared architecture rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov-doc
      - name: Exact source architecture gate and syntax
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = 66a90c3417f3c58a1830eb07b0626f8db9a977aa
          test "$(cat candidate/VERSION)" = 2.47.517
          python3 -B candidate/.github/checks/test_architecture_gate.py
          python3 -B candidate/.github/checks/architecture_gate.py \
            --manifest candidate/.github/checks/code_architecture.json \
            --gov-root gov-doc --git-root candidate \
            --base-sha ab49e83c4715cc9246c4333679fc5388e554cc98 \
            --head-sha 66a90c3417f3c58a1830eb07b0626f8db9a977aa > "$RUNNER_TEMP/p01-brand-architecture.log" 2>&1
          grep -F 'PROJECT_ARCHITECTURE=STRUCTURAL_PASS' "$RUNNER_TEMP/p01-brand-architecture.log"
          python3 -m py_compile candidate/scripts/build_p01_legacy_owner_media_archive.py candidate/tests/architecture/test_p01_owner_media_export.py
          echo P01_EXACT_SOURCE_BRAND_ARCHITECTURE_AND_PYTHON=PASS
      - name: Install real native PHP SQLite and ZIP
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php8.3-cli php8.3-sqlite3 php8.3-zip php8.3-mbstring >/dev/null
          php -r 'if(!extension_loaded("pdo_sqlite")||!class_exists(ZipArchive::class)||!extension_loaded("fileinfo"))exit(2);'
          php -l candidate/src/app/next/runtime/OwnerLegacyBrandAssets.php
          php -l candidate/src/app/next/runtime/OwnerLegacyMediaArchive.php
          php -l candidate/src/app/next/http/OwnerSqliteRecoveryRoutes.php
          php -l candidate/tests/integration/owner_legacy_media_archive.php
          echo P01_BRAND_NATIVE_PHP_LINT=PASS
      - name: Synthetic old media plus branding full ZIP and native importer
        run: |
          set -Eeuo pipefail
          cd candidate
          PYTHONDONTWRITEBYTECODE=1 python3 -B tests/architecture/test_p01_owner_media_export.py
          php tests/integration/owner_legacy_media_archive.php
          echo P01_BRAND_PHP_PYTHON_COMPLETE_PRIVATE_ZIP_SYNTHETIC=PASS
      - name: Actual Vue TypeScript check
        run: |
          set -Eeuo pipefail
          cd candidate/src/app/next/frontend
          npm ci --no-audit --no-fund --silent
          npm run typecheck
          echo P01_BRAND_OWNER_RESTORE_VUE_TYPES=PASS
      - name: Always clean private source and machine evidence
        if: always()
        run: |
          rm -rf -- candidate gov-doc
          rm -f -- "$RUNNER_TEMP/p01-brand-architecture.log"
          echo P01_PUBLIC_ARTIFACTS=NONE
          echo P01_PRIVATE_INPUTS_PERSISTED=NONE
