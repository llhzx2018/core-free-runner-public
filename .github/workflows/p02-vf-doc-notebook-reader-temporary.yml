name: TEMP P02 vf-doc notebook reader safe inline PNG and three databases
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p02-vf-doc-notebook-reader-temporary.yml
permissions:
  contents: read
jobs:
  frozen-frontend:
    if: false # previous exact frontend PASS in run 45032168565; browser test-only change
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-doc
          ref: 9f72a3e77e235e30a4ea7174bff9578f43edce52
          path: target
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with: {version: '10.20.0', run_install: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - name: Validate exact source and machine-issued locks
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = 9f72a3e77e235e30a4ea7174bff9578f43edce52
          test "$(sha256sum target/composer.lock | cut -d' ' -f1)" = 875e0f095c3fd70c878c0b5835eee6f7ba460f44a0267773faf2b3e605ddf9b1
          test "$(sha256sum target/pnpm-lock.yaml | cut -d' ' -f1)" = 28e02cba708e0ec4dd9769a8dd68ee4bc0cc28533a247c6b711b5e435e4cc585
          echo P02_EXACT_LOCK_IDENTITY=PASS
      - name: Strict frozen pnpm / TypeScript / Vitest / Vite build
        shell: bash
        run: |
          set -Eeuo pipefail
          if (cd target && pnpm install --frozen-lockfile && pnpm run typecheck && pnpm run test:frontend && pnpm run build && git diff --exit-code -- pnpm-lock.yaml) >"$RUNNER_TEMP/p02-frontend.log" 2>&1; then
            echo P02_FROZEN_FRONTEND=PASS
          else
            echo P02_STAGE6_FRONTEND=FAIL
            grep -Eo 'error TS[0-9]{4}' "$RUNNER_TEMP/p02-frontend.log" | sort -u | head -8 || true
            exit 1
          fi
      - name: Always clear private source and logs
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- target
          rm -f -- "$RUNNER_TEMP/p02-frontend.log"
          test ! -e target && echo P02_PRIVATE_CLEAN=PASS

  frozen-php-three-db:
    if: false # previous exact functional backend six-engine tests PASS in run 45032168565; browser test-only change
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        db: [sqlite, mysql, mariadb]
    services:
      mysql:
        image: mysql:8.4
        env: {MYSQL_ROOT_PASSWORD: vfdoc_lock_synthetic_only, MYSQL_DATABASE: vfdoc_ci}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pvfdoc_lock_synthetic_only" --health-interval=10s --health-timeout=5s --health-retries=18
      mariadb:
        image: mariadb:11.8
        env: {MARIADB_ROOT_PASSWORD: vfdoc_lock_synthetic_only, MARIADB_DATABASE: vfdoc_ci}
        ports: ['3307:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=18
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      APP_ALLOWED_HOSTS: localhost
      DB_CONNECTION: ${{ matrix.db }}
      DB_DATABASE: ${{ matrix.db == 'sqlite' && ':memory:' || 'vfdoc_ci' }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.db == 'mariadb' && '3307' || '3306' }}
      DB_USERNAME: root
      DB_PASSWORD: vfdoc_lock_synthetic_only
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-doc
          ref: 9f72a3e77e235e30a4ea7174bff9578f43edce52
          path: target
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring,pdo_sqlite,sqlite3,pdo_mysql,dom,xml,zip
          tools: composer:v2
          coverage: none
      - name: Check exact product + real Composer lock identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = 9f72a3e77e235e30a4ea7174bff9578f43edce52
          test "$(sha256sum target/composer.lock | cut -d' ' -f1)" = 875e0f095c3fd70c878c0b5835eee6f7ba460f44a0267773faf2b3e605ddf9b1
          echo P02_COMPOSER_LOCK_IDENTITY=PASS
      - name: Strict frozen Composer install, M01 guards, new DB migrations and tests
        shell: bash
        run: |
          set -Eeuo pipefail
          if (
            cd target
            composer install --no-interaction --prefer-dist --no-progress --no-audit
            composer validate --strict
            python3 -B scripts/check_bootstrap.py
            python3 -B scripts/check_source_contract.py
            python3 -m unittest discover -s tests -p test_bootstrap.py
            python3 -m unittest discover -s tests/guards -p 'test_*.py'
            python3 -m unittest discover -s tests/evolution -p test_second_module.py
            cp .env.example .env
            php artisan key:generate --force
            php artisan migrate --force
            find app routes database/migrations -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
            composer test
            git diff --exit-code -- composer.lock
          ) >"$RUNNER_TEMP/p02-frozen-php.log" 2>&1; then
            echo P02_STAGE6_NATIVE_UI=PASS
          else
            echo P02_STAGE6_NATIVE_UI=FAIL
            grep -Eo 'Tests: [0-9]+ failed, [0-9]+ passed' "$RUNNER_TEMP/p02-frozen-php.log" | tail -1 || true
            grep -Eo '(MaterialEditorAndHistoryTest|MaterialAttachmentSecurityTest|MaterialNewFormatTransferTest|WorkspaceOrganizationTest)\.php:[0-9]+' "$RUNNER_TEMP/p02-frozen-php.log" | sort -u | head -10 || true
            if grep -q 'SQLSTATE' "$RUNNER_TEMP/p02-frozen-php.log"; then echo P02_STAGE3_SQLSTATE_FAILURE=YES; fi
            if grep -q 'SQLSTATE' "$RUNNER_TEMP/p02-frozen-php.log"; then echo P02_DB_SQLSTATE=FAIL; fi
            exit 1
          fi
      - name: Always clear private source and logs
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- target
          rm -f -- "$RUNNER_TEMP/p02-frozen-php.log"
          test ! -e target && echo P02_PRIVATE_CLEAN=PASS

  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_URL: http://127.0.0.1:8000
      APP_ALLOWED_HOSTS: 127.0.0.1,localhost
      DB_CONNECTION: sqlite
      CACHE_STORE: file
      SESSION_DRIVER: file
      E2E_EMAIL: browser@example.test
      E2E_PASSWORD: synthetic-browser-only-passphrase
      PLAYWRIGHT_BROWSERS_PATH: /tmp/p02-stage3-browser-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-doc
          ref: 9f72a3e77e235e30a4ea7174bff9578f43edce52
          path: target
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_sqlite,sqlite3,pdo_mysql,dom,xml,zip
          tools: composer:v2
          coverage: none
      - uses: pnpm/action-setup@v4
        with: {version: '10.20.0', run_install: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - name: Locked app and Chromium runner dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = 9f72a3e77e235e30a4ea7174bff9578f43edce52
          cd target
          if composer install --no-scripts --no-interaction --prefer-dist --no-progress >"$RUNNER_TEMP/p02-browser-composer.log" 2>&1; then
            echo P02_BROWSER_COMPOSER=PASS
          else
            echo P02_BROWSER_COMPOSER=FAIL
            if test -f composer.json; then echo P02_BROWSER_COMPOSER_JSON_PRESENT=YES; else echo P02_BROWSER_COMPOSER_JSON_PRESENT=NO; fi
            if command -v composer >/dev/null; then echo P02_BROWSER_COMPOSER_BINARY_PRESENT=YES; else echo P02_BROWSER_COMPOSER_BINARY_PRESENT=NO; fi
            for pattern in \
              "The lock file is not up to date" \
              "Your lock file does not contain" \
              "does not satisfy" \
              "Could not find a composer.json file" \
              "requires ext-" \
              "Failed to download" \
              "curl error" \
              "Permission denied" \
              "allowed memory size" \
              "No such file or directory" \
              "is not a valid JSON file" \
              "file_put_contents" \
              "Killed" \
              "Could not delete" \
              "Nothing to install"; do
              if grep -Fqi "$pattern" "$RUNNER_TEMP/p02-browser-composer.log"; then
                echo "P02_BROWSER_COMPOSER_CATEGORY=$(printf '%s' "$pattern" | tr ' ' '_' | tr -cd 'A-Za-z0-9_-')"
              fi
            done
            echo "P02_BROWSER_COMPOSER_LOG_BYTES=$(wc -c <"$RUNNER_TEMP/p02-browser-composer.log")"
            python3 - <<'PY'
          import os,re
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"p02-browser-composer.log"
          lines=p.read_text(errors="replace").splitlines()
          safe=[]
          for line in lines:
              line=re.sub(r'https?://\S+', '[URL]', line)
              line=re.sub(r'/(?:home|mnt|tmp|opt|var|workspace)/\S+', '[PATH]', line)
              line=re.sub(r'[A-Za-z0-9_.+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}', '[EMAIL]', line)
              if re.search(r'llhzx2018|kewaro|vf-doc|secret|token|password|pat_|ghp_',line,re.I):
                  continue
              if len(line)>135 or len(line)<2: continue
              if re.search(r'(?i)(fatal|error|failed|problem|unable|cannot|could not|requires|warning|install|package)',line):
                  safe.append(line)
          print('P02_SAFE_COMPOSER_DIAG='+repr(safe[-7:])[:1000])
          PY
            if grep -qi 'lock file does not contain a compatible' "$RUNNER_TEMP/p02-browser-composer.log"; then echo P02_BROWSER_COMPOSER_LOCK_PLATFORM=FAIL; fi
            if grep -qi 'curl error\|Failed to download' "$RUNNER_TEMP/p02-browser-composer.log"; then echo P02_BROWSER_COMPOSER_NETWORK=FAIL; fi
            if grep -qi 'error.*script\|package:discover' "$RUNNER_TEMP/p02-browser-composer.log"; then echo P02_BROWSER_COMPOSER_SCRIPT=FAIL; fi
            exit 1
          fi
          if pnpm install --frozen-lockfile >"$RUNNER_TEMP/p02-browser-pnpm.log" 2>&1; then
            echo P02_BROWSER_PNPM=PASS
          else
            echo P02_BROWSER_PNPM=FAIL
            exit 1
          fi
          if pnpm run build >"$RUNNER_TEMP/p02-browser-vite.log" 2>&1; then
            echo P02_BROWSER_VITE=PASS
          else
            echo P02_BROWSER_VITE=FAIL
            exit 1
          fi
          cp .env.example .env
          if php artisan key:generate --force >"$RUNNER_TEMP/p02-browser-key.log" 2>&1; then
            echo P02_BROWSER_KEY=PASS
          else
            echo P02_BROWSER_KEY=FAIL
            exit 1
          fi
          touch database/database.sqlite
          export DB_DATABASE="$PWD/database/database.sqlite"
          if php artisan package:discover >"$RUNNER_TEMP/p02-browser-discover.log" 2>&1 && php artisan migrate --force >"$RUNNER_TEMP/p02-browser-migrate.log" 2>&1; then
            echo P02_BROWSER_MIGRATE=PASS
          else
            echo P02_BROWSER_MIGRATE=FAIL
            exit 1
          fi
          cd ..
          if (
            npm install --prefix "$RUNNER_TEMP/p02-playwright" --no-save --no-fund --no-audit playwright@1.55.1
            "$RUNNER_TEMP/p02-playwright/node_modules/.bin/playwright" install chromium --with-deps
          ) >"$RUNNER_TEMP/p02-playwright-install.log" 2>&1; then
            echo P02_STAGE3_BROWSER_ENGINE=PASS
          else
            echo P02_STAGE3_BROWSER_ENGINE=FAIL
            exit 1
          fi
      - name: Synthetic owner recent/category actions (existing Ctrl+S regression separate)
        shell: bash
        run: |
          set -Eeuo pipefail
          cd target
          export DB_DATABASE="$PWD/database/database.sqlite"
          php -r '
            require "vendor/autoload.php";
            $app = require "bootstrap/app.php";
            $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            App\Models\User::query()->create([
              "name" => "Synthetic Browser Owner",
              "email" => getenv("E2E_EMAIL"),
              "password" => getenv("E2E_PASSWORD")
            ]);
          ' >"$RUNNER_TEMP/p02-browser-user.log" 2>&1 || {
            echo P02_STAGE3_BROWSER_FIXTURE=FAIL
            exit 1
          }
          php artisan serve --host=127.0.0.1 --port=8000 >"$RUNNER_TEMP/p02-laravel-server.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8000/login; then ready=1; break; fi
            sleep 1
          done
          if test "$ready" != 1; then echo P02_STAGE3_BROWSER_HTTP_READY=FAIL; exit 1; fi
          export PLAYWRIGHT_MODULE_PATH="$RUNNER_TEMP/p02-playwright/node_modules/playwright"
          if node tests/e2e/recent_category.browser.cjs >"$RUNNER_TEMP/p02-recent-category.log" 2>&1; then
            echo P02_RECENT_CATEGORY_CHROMIUM=PASS
          else
            echo P02_RECENT_CATEGORY_CHROMIUM=FAIL
            grep -Eo 'P02_RECENT_CATEGORY_BROWSER=FAIL checkpoint=[a-z0-9-]+' "$RUNNER_TEMP/p02-recent-category.log" | tail -1 || true
            exit 1
          fi
          echo P02_STAGE6_OLD_NEW_AUTH_VISUAL=NOT_PROVEN
      - name: Always erase private browser state, fixtures and source
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- target "$RUNNER_TEMP/p02-playwright" "/tmp/p02-stage3-browser-cache"
          rm -f "$RUNNER_TEMP/p02-rich-reader-template.log" "$RUNNER_TEMP/p02-notebook-reader.log" "$RUNNER_TEMP/p02-browser-setup.log" "$RUNNER_TEMP/p02-playwright-install.log" "$RUNNER_TEMP/p02-browser-composer.log" "$RUNNER_TEMP/p02-browser-pnpm.log" "$RUNNER_TEMP/p02-browser-vite.log" "$RUNNER_TEMP/p02-browser-key.log" "$RUNNER_TEMP/p02-browser-migrate.log" "$RUNNER_TEMP/p02-browser-discover.log" "$RUNNER_TEMP/p02-browser-user.log" "$RUNNER_TEMP/p02-laravel-server.log" "$RUNNER_TEMP/p02-browser-test.log" "$RUNNER_TEMP/p02-stage6-browser.log" "$RUNNER_TEMP/p02-settings-nine.log"
          test ! -e target && echo P02_STAGE6_BROWSER_PRIVATE_CLEAN=PASS
