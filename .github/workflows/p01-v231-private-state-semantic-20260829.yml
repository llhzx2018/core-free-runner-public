name: P01 V2.31 Private State Semantic Gate
on:
  push:
    branches: [task/p01-v231-private-state-semantic-20260829]
    paths: [.github/workflows/p01-v231-private-state-semantic-20260829.yml]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ROOT: ${{ github.workspace }}/product/src
      PORT: '18632'
      ADMIN_PASS: 'P01V231!PrivateSemantic'
      EVID: /tmp/p01-v231-private-semantic-evidence
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: f0afdff4df69c872831a35516eed58e03c688ccf
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Exact source and scope fence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVID"
          test "$(git -C product rev-parse HEAD)" = f0afdff4df69c872831a35516eed58e03c688ccf
          test "$(tr -d '\r\n' < "$ROOT/VERSION.txt")" = 2.30.0
          test "$(git -C product diff --name-only f9b9c4585cc8fe89f422090ab35e6df44278d917...HEAD)" = src/assets/workspace-domain-nav.css
          grep -F '.vf-workspace-form .vf-privacy-hint.private{background:var(--ws-teal-soft);color:var(--ws-teal)}' "$ROOT/assets/workspace-domain-nav.css" >/dev/null
          echo P01_V231_PRIVATE_SEMANTIC_SCOPE=PASS | tee "$EVID/source.txt"
      - name: Fresh runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          php -S "127.0.0.1:${PORT}" -t "$ROOT" >"$EVID/server.log" 2>&1 & echo $! >/tmp/p01-v231-private.pid
          for i in $(seq 1 40); do curl -fsS "http://127.0.0.1:${PORT}/setup.php" -o /tmp/p01-v231-private-setup.html && break || sleep .25; done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-v231-private-setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c /tmp/p01-v231-private.cookies -b /tmp/p01-v231-private.cookies -X POST "http://127.0.0.1:${PORT}/setup.php" --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=P01 V231 Private Semantic' --data-urlencode "admin_password=$ADMIN_PASS" --data-urlencode "admin_password_confirm=$ADMIN_PASS" >/dev/null
          php "$ROOT/cli/verify.php" | tee "$EVID/verify.txt" | grep -Fx VERIFY_PASS=YES
      - name: Desktop mobile semantic browser gate
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-v231-private-browser && cd /tmp/p01-v231-private-browser
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-save >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null 2>&1
          cat >gate.mjs <<'JS'
          import{chromium}from'playwright';
          const base='http://127.0.0.1:18632',pass='P01V231!PrivateSemantic',e='/tmp/p01-v231-private-semantic-evidence';
          const b=await chromium.launch({headless:true});
          const run=async(viewport,name,isMobile=false)=>{const c=await b.newContext({viewport,isMobile});const r=await c.request.post(base+'/api.php?action=login',{data:{password:pass}});if(!r.ok())throw Error('login');const p=await c.newPage();await p.goto(base+'/start.php',{waitUntil:'networkidle'});await p.locator('[data-open-add]:visible').first().click();const hint=p.locator('[data-add-form] [data-privacy-hint]');await hint.waitFor();const truth=await hint.evaluate(el=>{const probe=document.createElement('span');probe.style.color='var(--ws-teal)';probe.style.backgroundColor='var(--ws-teal-soft)';document.body.appendChild(probe);const a=getComputedStyle(el),q=getComputedStyle(probe);const out={text:el.textContent||'',private:el.classList.contains('private'),color:a.color,bg:a.backgroundColor,expectedColor:q.color,expectedBg:q.backgroundColor};probe.remove();return out});if(!truth.private||!truth.text.includes('有效可见：私人')||truth.color!==truth.expectedColor||truth.bg!==truth.expectedBg)throw Error('private semantic '+JSON.stringify(truth));await p.screenshot({path:`${e}/${name}.png`,fullPage:true});const box=p.locator('[data-add-form] input[name="is_private"]');await box.uncheck();const publicTruth=await hint.evaluate(el=>({text:el.textContent||'',private:el.classList.contains('private')}));if(publicTruth.private||!publicTruth.text.includes('有效可见：公开'))throw Error('public semantic '+JSON.stringify(publicTruth));await c.close();return truth};
          const desktop=await run({width:1440,height:960},'private-desktop');const mobile=await run({width:390,height:844},'private-mobile',true);console.log(JSON.stringify({desktop,mobile}));await b.close();console.log('PRIVATE_STATE_SEMANTIC_PASS');
          JS
          node gate.mjs | tee "$EVID/browser.txt" | grep -Fx PRIVATE_STATE_SEMANTIC_PASS
      - name: Final verdict
        shell: bash
        run: |
          cat >"$EVID/verdict.txt" <<'EOF'
          P01_V231_PRIVATE_IS_PROTECTED_STATE=PASS
          P01_V231_PUBLIC_PRIVATE_BEHAVIOR_UNCHANGED=PASS
          P01_V231_DESKTOP_PRIVATE_SEMANTIC=PASS
          P01_V231_MOBILE_PRIVATE_SEMANTIC=PASS
          P01_V231_SCHEMA_UNCHANGED=PASS
          P01_V231_VERSION_UNCHANGED_2.30.0=PASS
          OWNER_PRODUCTION_WRITE=NO
          EOF
          cat "$EVID/verdict.txt"
      - name: Upload private semantic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-v231-private-semantic-evidence-${{ github.run_id }}
          path: /tmp/p01-v231-private-semantic-evidence
          if-no-files-found: warn
          retention-days: 30
      - name: Cleanup server
        if: always()
        shell: bash
        run: if test -f /tmp/p01-v231-private.pid; then kill "$(cat /tmp/p01-v231-private.pid)" >/dev/null 2>&1 || true; fi
