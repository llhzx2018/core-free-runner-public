name: P03 V1.36.0 Fixture Version Dedup Patch
on:
  push:
    branches: [p03-v1360-runtime-integration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      EXPECTED_HEAD: e2bfabbe7fa5cff63a956191694c44d567a0ebd3
    steps:
      - name: Deduplicate identical production/working fixture versions
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WRITE_TOKEN:-}"
          git clone --quiet --branch integration/v1.36.0-product-experience --single-branch "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/vf-forge.git" p03
          cd p03
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/integration/v1360_experience_fixture.py')
          s=p.read_text(encoding='utf-8')
          old="for ver,stable in [(prod,1),(working,0 if working!=prod else 1)]:"
          new="for ver,stable in {prod:1,working:(0 if working!=prod else 1)}.items():"
          assert s.count(old)==1, 'VERSION_FIXTURE_ANCHOR_MISMATCH'
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python3 -m py_compile tests/integration/v1360_experience_fixture.py
          test "$(git status --short | wc -l)" -eq 1
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add tests/integration/v1360_experience_fixture.py
          git commit -m 'test(v1.36.0): deduplicate identical fixture versions'
          git push origin HEAD:integration/v1.36.0-product-experience
          echo "PATCHED_HEAD=$(git rev-parse HEAD)"
