name: P08 R114 real commit 0.1.3 onefile-to-Atomic Owner HTTPS
on:
  pull_request:
    paths: [.github/workflows/p08-r114-real-candidate-onefile-chromium.yml]
permissions:
  contents: read
jobs:
  site-owned-012-atomic:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GITHUB_ACTIONS: "true"
      P08_ISOLATED_INSTALL_TEST: "YES"
      P08_R105_DISPOSABLE: "YES"
      P08_R105_REAL_FULL_ISOLATED: "YES"
      P08_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      P08_R110_EXACT_SOURCE: da36b736e075ea0908aa38f896162cac8651f289
      P08_R114_TARGET_SHA: 9ea4bbf18b5fe6dd32afbc4b682e132d544518da
    steps:
      - name: Exact temporary private source from registered read capability
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: da36b736e075ea0908aa38f896162cac8651f289
          path: p08-private
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Exact immutable candidate v0.1.3 source in private temporary workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 9ea4bbf18b5fe6dd32afbc4b682e132d544518da
          path: p08-candidate
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Canonical shared delivery source exact governance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 64c8a874210f2fa89fee07c7283ffce2bbe6b36c
          path: gov-current
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Native PHP 8.4 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mbstring, zip, sqlite3, pdo_sqlite, pdo_mysql, fileinfo, curl
          tools: composer:v2
      - name: Locked Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: R110 exact PHP and build script lint plus negative source scope
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C p08-private rev-parse HEAD)" = "$P08_R110_EXACT_SOURCE"
          test "$(git -C p08-candidate rev-parse HEAD)" = "$P08_R114_TARGET_SHA"
          test "$(cat p08-candidate/VERSION)" = "0.1.3"
          php -l p08-candidate/src/Upgrade/OwnerReleaseDiscovery.php >/dev/null
          php p08-candidate/tests/compatibility/r105_official_next_release.php \
            > "$RUNNER_TEMP/r114-next-unit.log" 2>&1 || {
              echo R114_POST_SWITCH_SOURCE_UNIT=FAIL; exit 1;
            }
          grep -Fxq 'R114_POST_UPGRADE_013_CHANNEL_SOURCE_NEGATIVE=PASS' "$RUNNER_TEMP/r114-next-unit.log"
          echo R114_POST_SWITCH_SOURCE_UNIT=PASS
          php -l p08-private/scripts/r110_owner_atomic_once.php
          php -l p08-private/tests/compatibility/r110_official012_onefile_worker.php
          php -l p08-private/src/Upgrade/R109AppLocal012Activation.php
          php -l p08-private/src/Upgrade/R111NativeDatabaseWriteFence.php
          php -l p08-private/tests/compatibility/r111_native_sqlite_write_fence.php
          bash -n p08-private/tests/compatibility/run_r107_next_owner_https_two_clicks.sh
          P08_R111_ISOLATED=YES php p08-private/tests/compatibility/r111_native_sqlite_write_fence.php
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s p08-private/tests/compatibility -p 'test_r110_*.py' -v
          test -z "$(git -C p08-private status --porcelain)"
          python3 - <<'PY'
          from pathlib import Path
          path=Path('p08-private/scripts/build_r110_onefile.py')
          compile(path.read_text(),str(path),'exec')
          print('R110_BUILDER_PYTHON_PARSE=PASS')
          PY
          python3 - <<'PY'
          from pathlib import Path
          code=Path('p08-private/scripts/r110_owner_atomic_once.php').read_text()
          assert '__halt_compiler();' in code
          assert 'password_verify' in code and 'session.use_strict_mode' in code
          assert 'proc_open(' in code and "'--worker'" in code
          assert 'R110_EMBEDDED_ZIP_SHA256' in code
          assert '/etc/nginx' not in code and 'systemctl(' not in code
          print('R110_OWNER_AUTH_AND_SITE_CLI_ONLY_SOURCE_SCOPE=PASS')
          PY
      - name: Independently build genuine indexed updater bridge runtime from exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          build="$RUNNER_TEMP/p08-r106-onefile-build-tree"
          mkdir -m 0700 "$build"
          git -C p08-private archive HEAD | tar -x -C "$build"
          cd "$build"
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress > "$RUNNER_TEMP/r106-composer.log" 2>&1 || {
            echo R106_ONEFILE_COMPOSER_LOCKED_BUILD=FAIL; exit 1;
          }
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/r106-node.log" 2>&1 || {
            echo R106_ONEFILE_NPM_LOCKED_BUILD=FAIL; exit 1;
          }
          npm run build >> "$RUNNER_TEMP/r106-node.log" 2>&1 || {
            echo R106_ONEFILE_VITE_BUILD=FAIL; exit 1;
          }
          cd "$GITHUB_WORKSPACE"
          python3 -B - <<'PY' > "$RUNNER_TEMP/r106-full.log" 2>&1 || {
          import os,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('p08-private/scripts').resolve()))
          from build_full import write_full,verify_canonical_full_contract
          source=Path('p08-private').resolve()
          built=Path(os.environ['RUNNER_TEMP'])/'p08-r106-onefile-build-tree'
          full=Path(os.environ['RUNNER_TEMP'])/'r106-onefile-bridge-full.zip'
          gov=Path('gov-current').resolve()
          sha=os.environ['P08_R110_EXACT_SOURCE']
          verify_canonical_full_contract(source,full,sha,gov,'resolve')
          write_full(built,full,'0.1.2',sha)
          verify_canonical_full_contract(source,full,sha,gov,'delivery')
          PY
            echo R106_ONEFILE_CANONICAL_FULL_GATE=FAIL
            python3 - <<'PY'
          import os,re
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'r106-full.log'
          raw=p.read_text(errors='replace') if p.exists() else ''
          codes=sorted(set(re.findall(r'\b(?:FULL|CONTRACT|P08|R106)_[A-Z0-9_]{4,90}\b',raw)))
          print("R106_ONEFILE_SAFE_CODES="+",".join(codes[-12:]))
          reasons=re.findall(r'CONTRACT_REASON=([A-Z][A-Z0-9_]{2,100})',raw)
          print("R106_ONEFILE_GATE_REASON="+(reasons[-1] if reasons else "NOT_PROVEN"))
          if not codes:
              print("R106_ONEFILE_EXEC_EXCEPTION="+("PYTHON_EXCEPTION" if 'Traceback' in raw else 'OTHER'))
          PY
            exit 1;
          }
          mkdir -m 0700 "$RUNNER_TEMP/p08-r106-updater-bridge-onefile"
          unzip -q "$RUNNER_TEMP/r106-onefile-bridge-full.zip" -d "$RUNNER_TEMP/p08-r106-updater-bridge-onefile"
          echo R106_ONEFILE_DISTINCT_BRIDGE_CANONICAL_FULL=PASS
      - name: Two deterministic sealed single-PHP packages and PHP syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --max-time 90 \
            --header "Authorization: Bearer $P08_PRIVATE_READ_TOKEN" \
            --header "Accept: application/octet-stream" \
            https://api.github.com/repos/llhzx2018/vf-adops/releases/assets/747260263 \
            --output "$RUNNER_TEMP/r110-official-012.zip"
          test "$(wc -c < "$RUNNER_TEMP/r110-official-012.zip")" = 10390070
          echo "1b3d7fc3743fb44af12c0b50905a65ea68d47c80f0e1e2ddc5e03c08d534b081  $RUNNER_TEMP/r110-official-012.zip" | sha256sum --check --status
          mkdir -m 0700 "$RUNNER_TEMP/r110-one-a" "$RUNNER_TEMP/r110-one-b"
          for n in a b; do
            python3 p08-private/scripts/build_r110_onefile.py \
              --source p08-private/scripts/r110_owner_atomic_once.php \
              --full "$RUNNER_TEMP/r106-onefile-bridge-full.zip" \
              --official-full "$RUNNER_TEMP/r110-official-012.zip" \
              --source-sha "$P08_R110_EXACT_SOURCE" \
              --output "$RUNNER_TEMP/r110-one-$n/p08-owner-atomic-once.php" \
              > "$RUNNER_TEMP/r110-builder-$n.log" 2>&1 || {
                echo R110_DETERMINISTIC_BUILD=FAIL
                exit 1
              }
          done
          cmp -s "$RUNNER_TEMP/r110-one-a/p08-owner-atomic-once.php" \
            "$RUNNER_TEMP/r110-one-b/p08-owner-atomic-once.php"
          php -l "$RUNNER_TEMP/r110-one-a/p08-owner-atomic-once.php" \
            > "$RUNNER_TEMP/r110-php-lint.log"
          python3 - <<'PY'
          import os,hashlib
          from pathlib import Path
          t=Path(os.environ['RUNNER_TEMP'])
          b=(t/'r110-one-a/p08-owner-atomic-once.php').read_bytes()
          original=(t/'r106-onefile-bridge-full.zip').read_bytes()
          pos=b.index(b'__halt_compiler();')+len(b'__halt_compiler();')
          assert b[pos:]==original, 'R110_EMBEDDED_ZIP_OFFSET_OR_BYTES_INVALID'
          assert b'@@' not in b[:pos], 'R110_TEMPLATE_UNRESOLVED'
          assert b[:pos].count(b'__halt_compiler();')==1
          print('R110_ONEFILE_FULL_ZIP_BYTES_PINNED_AND_DETERMINISTIC=PASS')
          PY
          echo R110_SITE_OWNER_ONEFILE_PHP_SYNTAX=PASS
      - name: Official v0.1.2 real FULL to onefile separate site-UID worker native backup
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test -n "$P08_PRIVATE_READ_TOKEN"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --max-time 90 \
            --header "Authorization: Bearer $P08_PRIVATE_READ_TOKEN" \
            --header "Accept: application/octet-stream" \
            https://api.github.com/repos/llhzx2018/vf-adops/releases/assets/747260263 \
            --output "$RUNNER_TEMP/r110-official-012.zip"
          test "$(wc -c < "$RUNNER_TEMP/r110-official-012.zip")" = 10390070
          echo "1b3d7fc3743fb44af12c0b50905a65ea68d47c80f0e1e2ddc5e03c08d534b081  $RUNNER_TEMP/r110-official-012.zip" | sha256sum --check --status
          site="$RUNNER_TEMP/p08-r110-official-012-site-success"
          bridge="$RUNNER_TEMP/p08-r110-updater-bridge-success"
          mkdir -m 0700 "$site" "$bridge"
          unzip -q "$RUNNER_TEMP/r110-official-012.zip" -d "$site"
          unzip -q "$RUNNER_TEMP/r106-onefile-bridge-full.zip" -d "$bridge"
          php p08-private/tests/compatibility/r110_official012_onefile_worker.php \
            success "$site" "$bridge" "$P08_R110_EXACT_SOURCE" \
            "$RUNNER_TEMP/r110-one-a/p08-owner-atomic-once.php" \
            > "$RUNNER_TEMP/r110-worker-acceptance.log" 2>&1 || {
              grep -E '^R110_BRIDGE_FAILURE=' "$RUNNER_TEMP/r110-worker-acceptance.log" | tail -1 || true
              echo R110_REAL_ONEFILE_WORKER_FULL_TEST=FAIL
              exit 1
            }
          grep -Fxq 'R110_REAL_ISSUED_012_ONEFILE_TO_SITE_ACCOUNT_ATOMIC_BRIDGE=PASS' "$RUNNER_TEMP/r110-worker-acceptance.log"
          grep -Fxq 'R110_OWNER_PASSWORD_HTML_AUTH=NOT_PROVEN_IN_THIS_WORKER_TEST' "$RUNNER_TEMP/r110-worker-acceptance.log"
          echo R110_SEPARATE_PHP_CLI_ONEFILE_NATIVE_SQLITE_WORKER=PASS
          echo R110_REAL_OWNER_BROWSER_AND_NATIVE_SQL_3DB=NOT_PROVEN
      - name: Genuine localhost HTTPS Chromium Owner login and one-PHP app-only activation
        shell: bash
        env:
          P08_R110_BROWSER: "YES"
        run: |
          set -Eeuo pipefail
          set +x
          cd p08-private
          npm ci --ignore-scripts --no-audit --no-fund > "$RUNNER_TEMP/r110-browser-node.log" 2>&1 || {
            echo R110_BROWSER_NODE_INSTALL=FAIL; exit 1;
          }
          npx playwright install chromium > "$RUNNER_TEMP/r110-browser-install.log" 2>&1 || {
            echo R110_BROWSER_CHROMIUM_INSTALL=FAIL; exit 1;
          }
          cd "$GITHUB_WORKSPACE"
          site="$RUNNER_TEMP/p08-r110-official-012-site-browser"
          bridge="$RUNNER_TEMP/p08-r110-updater-bridge-browser"
          mkdir -m 0700 "$site" "$bridge"
          unzip -q "$RUNNER_TEMP/r110-official-012.zip" -d "$site"
          unzip -q "$RUNNER_TEMP/r106-onefile-bridge-full.zip" -d "$bridge"
          php p08-private/tests/compatibility/r110_official012_onefile_worker.php \
            browser-setup "$site" "$bridge" "$P08_R110_EXACT_SOURCE" \
            "$RUNNER_TEMP/r110-one-a/p08-owner-atomic-once.php" \
            > "$RUNNER_TEMP/r110-browser-fixture.log" 2>&1 || {
              grep -E '^R110_BRIDGE_FAILURE=' "$RUNNER_TEMP/r110-browser-fixture.log" | tail -1 || true
              echo R110_REAL_ISSUED_BROWSER_FIXTURE=FAIL
              exit 1
            }
          grep -Fxq 'R110_BROWSER_REAL_ISSUED_012_OWNER_PASSWORD_FIXTURE_READY=PASS' \
            "$RUNNER_TEMP/r110-browser-fixture.log"
          bash p08-private/tests/compatibility/run_r110_owner_onefile_https_browser.sh "$site" \
            > "$RUNNER_TEMP/r110-browser-e2e.log" 2>&1 || {
              grep -E '^R110_(BROWSER|HTTPS|REAL)[A-Z0-9_]*(=|:)' "$RUNNER_TEMP/r110-browser-e2e.log" | tail -18 || true
              echo R110_REAL_HTTPS_BROWSER_TEST=FAIL
              exit 1
            }
          grep -Fxq 'R110_REAL_HTTPS_OWNER_ONEFILE_CLI_AUTO_EXECUTED=PASS' \
            "$RUNNER_TEMP/r110-browser-e2e.log"
          echo R110_REAL_HTTPS_CHROMIUM_OWNER_FIRST_ACTIVATION=PASS
      - name: Real candidate 0.1.3 source from Owner onefile HTTPS two clicks and current
        shell: bash
        env:
          P08_R110_BROWSER: "YES"
          P08_R106_BROWSER: "YES"
          P08_R107_BROWSER: "YES"
          P08_R112_ONEFILE: "YES"
        run: |
          set -Eeuo pipefail
          set +x
          test -f "$RUNNER_TEMP/r110-official-012.zip"
          test "$(readlink "$RUNNER_TEMP/p08-r110-official-012-site-browser/current")" = "releases/$P08_R110_EXACT_SOURCE"
          PYTHONDONTWRITEBYTECODE=1 python3 -B p08-private/tests/compatibility/r112_issued_onefile_to_next_fixture.py "$P08_R110_EXACT_SOURCE"
          target="$RUNNER_TEMP/p08-r114-target-runtime"
          mkdir -m 0700 "$target"
          git -C p08-candidate archive HEAD | tar -x -C "$target"
          test "$(cat "$target/VERSION")" = 0.1.3
          cd "$target"
          composer install --no-dev --no-interaction --prefer-dist \
            --optimize-autoloader --no-progress > "$RUNNER_TEMP/r114-browser-composer.log" 2>&1 || {
            echo R114_CANDIDATE_COMPOSER_LOCK=FAIL; exit 1;
          }
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/r114-browser-node.log" 2>&1 || {
            echo R114_CANDIDATE_NODE_LOCK=FAIL; exit 1;
          }
          npm run build >> "$RUNNER_TEMP/r114-browser-node.log" 2>&1 || {
            echo R114_CANDIDATE_VITE_BUILD=FAIL; exit 1;
          }
          cd "$GITHUB_WORKSPACE"
          # Old-issued real one-PHP bridge, actual committed 0.1.3 FULL/Atomic
          # bytes; ONLY remote GitHub channel/Release metadata stays fake on
          # the isolated loopback HTTPS API. No real publication.
          python3 -B - <<'PY'
          import os
          from pathlib import Path
          p=Path('p08-private/tests/compatibility/r107_synthetic_next_browser_fixture.py')
          code=p.read_text()
          patches={
            'target_sha="1313131313131313131313131313131313131313"':
              'target_sha=os.environ["P08_R114_TARGET_SHA"]',
            'shutil.copytree(src,target,symlinks=False)':
              'shutil.copytree(temp/"p08-r114-target-runtime",target,symlinks=False)',
            'R107_SYNTHETIC_NEXT_SOURCE_COMMIT=NONE':
              'R114_NEXT_REAL_COMMIT="+target_sha+"',
          }
          for a,b in patches.items():
              if code.count(a)!=1:raise SystemExit('R114_CANDIDATE_FIXTURE_SOURCE_MISMATCH')
              code=code.replace(a,b)
          q=p.with_name('r114_actual_candidate_fixture.py')
          q.write_text(code)
          compile(code,str(q),'exec')
          print('R114_CANDIDATE_FIXTURE_SOURCE_SAFE=PASS')
          PY
          python3 -B p08-private/tests/compatibility/r114_actual_candidate_fixture.py \
            --bridge "$RUNNER_TEMP/p08-r106-updater-bridge-browser" \
            --out "$RUNNER_TEMP/p08-r107-next-browser-fixture" \
            --source-sha "$P08_R110_EXACT_SOURCE" \
            > "$RUNNER_TEMP/r114-next-fixture.log" 2>&1 || {
              echo R114_ACTUAL_CANDIDATE_FAKE_CHANNEL=FAIL; exit 1;
            }
          grep -Fxq "R114_NEXT_REAL_COMMIT=$P08_R114_TARGET_SHA" "$RUNNER_TEMP/r114-next-fixture.log"
          python3 -B - <<'PY'
          import os,json,zipfile
          from pathlib import Path
          f=Path(os.environ['RUNNER_TEMP'])/'p08-r107-next-browser-fixture'
          sha=os.environ['P08_R114_TARGET_SHA']
          with zipfile.ZipFile(f/'VF_AdOps_V0.1.3_FULL.zip') as z:
              x=json.loads(z.read('FULL_MANIFEST.json'))
              assert x['target_version']=='0.1.3' and x['source_sha']==sha
              assert x['data_included'] is False
          with zipfile.ZipFile(f/'VF_AdOps_V0.1.3_UPDATE.zip') as z:
              x=json.loads(z.read('ATOMIC_MANIFEST.json'))
              assert x['target_sha']==sha and x['source_version']=='0.1.2'
              assert x['source_sha']==os.environ['P08_R110_EXACT_SOURCE']
              assert x['schema_changes'] is False
          print('R114_REAL_COMMITTED_FULL_AND_ATOMIC_BROWSER_ZIPS=PASS')
          PY
          python3 -B - <<'PY'
          from pathlib import Path
          import os
          root=Path('p08-private/tests/compatibility')
          p=root/'run_r107_next_owner_https_two_clicks.sh'
          body=p.read_text()
          old='NEXT_SHA=1313131313131313131313131313131313131313'
          if body.count(old)!=1:raise SystemExit('R114_SHA_PIN_NOT_PRESENT')
          body=body.replace(old,'NEXT_SHA='+os.environ['P08_R114_TARGET_SHA'])
          script=root/'run_r114_candidate_https.sh'
          script.write_text(body)
          script.chmod(0o700)
          test=Path('p08-private/tests/e2e/r107-synthetic-next-owner-two-clicks.spec.ts')
          text=test.read_text()
          hook='  expect(errors).toEqual([])'
          if text.count(hook)!=1:raise SystemExit('R114_POST_CHECK_HOOK_MISSING')
          post="""  const postCheck=page.waitForResponse(r=>r.url().endsWith('/app/system/update/check')
            && r.request().method()==='POST')
          await page.getByRole('button',{name:'检查官方更新'}).click()
          const checked=await postCheck
          expect(checked.status()).toBe(200)
          expect(await checked.json()).toMatchObject({
            status:'CURRENT_VERSION_NO_NEWER_RELEASE',
            target_version:'0.1.3',can_install:false,
          })
          console.log('R114_POST_SWITCH_OFFICIAL_TARGET_CURRENT_READBACK=PASS')
          """
          test.write_text(text.replace(hook,post+'\n'+hook))
          print('R114_POST_UPGRADE_BROWSER_ASSERTION_ARMED=PASS')
          PY
          bash -n p08-private/tests/compatibility/run_r114_candidate_https.sh
          sudo apt-get update -qq > "$RUNNER_TEMP/r112-nginx.log" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nginx >> "$RUNNER_TEMP/r112-nginx.log" 2>&1
          cd p08-private
          npx playwright install --with-deps chromium > "$RUNNER_TEMP/r112-playwright.log" 2>&1
          cd "$GITHUB_WORKSPACE"
          bash p08-private/tests/compatibility/run_r114_candidate_https.sh \
            "$RUNNER_TEMP/p08-r106-browser-site-current" "$P08_R110_EXACT_SOURCE" \
            > "$RUNNER_TEMP/r112-two-click.log" 2>&1 || {
              # Print ONLY bounded alphabetic machine codes. No URLs,
              # paths, credentials, HTTP bodies or Playwright fixture data.
              python3 - <<'PY'
          import os,re
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'r112-two-click.log'
          raw=path.read_text(errors='replace') if path.is_file() else ''
          codes=list(dict.fromkeys(re.findall(r'R107_[A-Z0-9_]{5,95}',raw)))
          print('R112_SAFE_DIAGNOSTIC_CODES='+(','.join(codes[-12:]) if codes else 'NONE'))
          print('R112_SAFE_FAILURE_KIND='+('TIMEOUT' if 'TimeoutError' in raw else 'ASSERTION' if 'expect(' in raw else 'SHELL_OR_SETUP'))
          # Only show test source line numbers; no response bodies or secrets.
          locations=re.findall(r'r107-synthetic-next-owner-two-clicks[.]spec[.]ts:([0-9]{1,3}):([0-9]{1,3})',raw)
          print('R112_SAFE_PLAYWRIGHT_LINES='+(','.join(v[0] for v in locations[-6:]) if locations else 'NONE'))
          PY
              echo R112_REAL_ONEFILE_TO_SYNTHETIC_NEXT_HTTPS=FAIL
              exit 1
            }
          grep -Fxq 'R107_BROWSER_OWNER_TWO_CLICKS_NATIVE_BACKUP_AND_REAL_SYNTHETIC_ATOMIC=PASS' "$RUNNER_TEMP/r112-two-click.log"
          test "$(readlink "$RUNNER_TEMP/p08-r106-browser-site-current/current")" = "releases/$P08_R114_TARGET_SHA"
          grep -Fxq 'R114_POST_SWITCH_OFFICIAL_TARGET_CURRENT_READBACK=PASS' "$RUNNER_TEMP/r112-two-click.log"
          echo R114_REAL_CANDIDATE_OWNER_HTTPS_TWO_CLICKS_AND_CURRENT=PASS
          echo R112_NEXT_OFFICIAL_GITHUB_RELEASE=NOT_PUBLISHED
      - name: Always purge all transient private source, binaries and Owner fixtures
        if: always()
        shell: bash
        run: |
          set +e
