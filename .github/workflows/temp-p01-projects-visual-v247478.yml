name: TEMP P01 V2.47.478 Projects visual geometry proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p01-projects-visual-v247478.yml'

permissions:
  contents: read

jobs:
  visual:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout isolated proof workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Exact sealed P01 source identity
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:$READ_TOKEN@github.com/llhzx2018/vf-start.git" product
          git -C product fetch -q --depth 1 origin ba49736a15595ae56c5e112736350c7af57e97f3
          git -C product checkout -q --detach FETCH_HEAD
          test "$(git -C product rev-parse HEAD)" = ba49736a15595ae56c5e112736350c7af57e97f3
          test "$(tr -d '\r\n ' < product/VERSION)" = 2.47.478
          test "$(tr -d '\r\n ' < product/src/VERSION.txt)" = 2.47.478
          echo P01_VISUAL_EXACT_SEALED_SOURCE=PASS

      - name: Real Chrome geometry and alignment contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          command -v google-chrome || command -v chromium || command -v chromium-browser
          node --check product/tests/unit/project_visual_geometry_browser_contract.cjs
          node product/tests/unit/project_visual_alignment_closure_contract.cjs | tee /tmp/p01-static.txt
          grep -Fx P01_PROJECT_VISUAL_ALIGNMENT_CLOSURE=PASS /tmp/p01-static.txt
          (
            cd product
            node tests/unit/project_visual_geometry_browser_contract.cjs
          ) | tee /tmp/p01-browser.txt
          for marker in \
            P01_PROJECT_VISUAL_BROWSER_1440_CARD=PASS \
            P01_PROJECT_VISUAL_BROWSER_900_CARD=PASS \
            P01_PROJECT_VISUAL_BROWSER_600_CARD=PASS \
            P01_PROJECT_VISUAL_BROWSER_1440_LIST=PASS \
            P01_PROJECT_VISUAL_BROWSER=PASS; do
            grep -Fx "$marker" /tmp/p01-browser.txt
          done
          echo P01_VISUAL_GEOMETRY_EXACT_SOURCE=PASS
