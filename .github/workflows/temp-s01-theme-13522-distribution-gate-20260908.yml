name: temp-s01-theme-13522-distribution-gate-20260908
on:
  push:
    branches:
      - temp/s01-page-update-center-v4-20260907
    paths:
      - .github/workflows/temp-s01-theme-13522-distribution-gate-20260908.yml
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      CORE_REPO: llhzx2018/core-updates
      CORE_BRANCH: work/s01-c01-13522-distribution-20260908
      CORE_HEAD: bdfbbb2c8597d3b88d92e7ca38232a252b864126
      CORE_BASE: 91838f74b685dfa6361e57f996901919126d2e67
    steps:
      - name: Validate exact Theme distribution candidate
        env:
          GH_TOKEN: ${{ env.READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'GATE_MODE=READ_ONLY MAIN_WRITE_USED=NO RELEASE_WRITE_USED=NO PRODUCTION_WRITE_USED=NO STATIC_WRITE_USED=NO ONLINE_WRITE_USED=NO'
          rm -rf /tmp/core /tmp/release
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/${CORE_REPO}.git" /tmp/core
          cd /tmp/core
          git checkout -q "$CORE_BRANCH"
          test "$(git rev-parse HEAD)" = "$CORE_HEAD"
          mapfile -t changed < <(git diff --name-only "$CORE_BASE" "$CORE_HEAD" | sort)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'projects/S01-C01.json'
          jq -e '.component_id=="S01-C01" and .target_version=="1.35.22" and .release_tag=="v1.35.22" and .asset_name=="vf-tools-theme_V1.35.22.zip" and .asset_bytes==1811370 and .asset_sha256=="b33625475f315fc93efda893969cf38b0b6425865fd33277eccbea316a3f4e5d" and .runtime_contract=="VF_WP_COMPONENT_RUNTIME_AUTHORITY_V1" and .runtime_files==446 and .runtime_fingerprint=="cd2bfa8d48f11f22c27a81f6945776adbcac81479832fce963ce46e8540694ee"' projects/S01-C01.json >/dev/null
          jq -e '.from_versions | index("1.35.21") != null' projects/S01-C01.json >/dev/null
          test "$(git rev-parse "$CORE_BASE:projects/S01-C02.json")" = "$(git rev-parse "$CORE_HEAD:projects/S01-C02.json")"
          test "$(git rev-parse "$CORE_BASE:projects/S01-C03.json")" = "$(git rev-parse "$CORE_HEAD:projects/S01-C03.json")"
          jq -e '.target_version=="1.21.858"' projects/S01-C02.json >/dev/null
          jq -e '.target_version=="1.25.29" and .locator_cutover==false' projects/S01-C03.json >/dev/null
          mkdir -p /tmp/release
          gh release download v1.35.22 --repo llhzx2018/vf-tools-theme --pattern vf-tools-theme_V1.35.22.zip --dir /tmp/release
          test "$(stat -c %s /tmp/release/vf-tools-theme_V1.35.22.zip)" = '1811370'
          test "$(sha256sum /tmp/release/vf-tools-theme_V1.35.22.zip | awk '{print $1}')" = 'b33625475f315fc93efda893969cf38b0b6425865fd33277eccbea316a3f4e5d'
          echo 'PASS_S01_C01_13522_DISTRIBUTION_GATE'
