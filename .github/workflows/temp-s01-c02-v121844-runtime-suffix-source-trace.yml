name: TEMP S01-C02 Ops 1.21.844 Runtime Suffix Source Trace
on:
  push:
    branches:
      - temp/s01-c02-v121844-record-isolation-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121844-runtime-suffix-source-trace.yml'
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact Product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 38be815bd77ae62548fe763b106bfec0b937d2c7
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: ops
      - name: Trace exact suffix emitter
        shell: bash
        run: |
          set -Eeuo pipefail
          cd ops
          echo '=== error_get_last ==='
          git grep -n -C 12 -F 'error_get_last()' -- '*.php' || true
          echo '=== lastMessage ==='
          git grep -n -C 12 -F '$lastMessage' -- '*.php' || true
          echo '=== fullwidth suffix concatenation ==='
          git grep -n -C 12 -F "'；'" -- '*.php' || true
          echo TRACE_V121844_RUNTIME_SUFFIX_SOURCE=PASS
