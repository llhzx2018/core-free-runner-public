name: S01-C02 Ops 1.21.853 Human Admin Language Gate

on:
  push:
    branches: [temp/s01-c02-human-admin-language-gate-121853-20260907]
    paths:
      - '.github/workflows/temp-s01-c02-human-admin-language-gate-121853-20260907.yml'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      OPS_BASE: 0956117c8d56aa82e13b5f658c8d51ba41eaee55
      OPS_HEAD: 1b76dddf29c8d12d970a3b72e4cd9f2601413016
    steps:
      - name: Credential boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo 'RELEASE_WRITE_USED=NO'
          echo 'PRODUCTION_WRITE_USED=NO'

      - name: Checkout exact Ops candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.OPS_HEAD }}
          token: ${{ env.READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops

      - name: Exact source and seven-file fence
        shell: bash
        run: |
          set -Eeuo pipefail
          cd ops
          test "$(git rev-parse HEAD)" = "$OPS_HEAD"
          git cat-file -e "$OPS_BASE^{commit}"
          git diff --name-only "$OPS_BASE..$OPS_HEAD" | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          VERSION
          includes/views/admin-online-acceptance.php
          includes/views/admin-operations-console-pages.php
          tests/admin-human-language-contract.php
          tests/update-refresh-policy-current-contract.php
          tests/visible-console-v2-contract.php
          vf-ops.php
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          echo 'EXACT_SEVEN_FILE_FENCE=PASS'

      - name: Full PHP syntax gate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd ops
          find . -type f -name '*.php' -not -path '*/.git/*' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
          tail -n 20 /tmp/php-lint.log
          echo 'FULL_PHP_LINT=PASS'

      - name: Human admin language contract
        shell: bash
        run: |
          set -Eeuo pipefail
          cd ops
          php tests/admin-human-language-contract.php

      - name: Update policy regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd ops
          php tests/update-refresh-policy-current-contract.php

      - name: Visible Console V2 regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd ops
          php tests/visible-console-v2-contract.php

      - name: Behavior and schema boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          cd ops
          ! git diff --name-only "$OPS_BASE..$OPS_HEAD" | grep -E '(^|/)(assets/css|includes/wp-update|includes/site-release|schema|migration|database)'
          git diff --unified=0 "$OPS_BASE..$OPS_HEAD" -- includes/views/admin-online-acceptance.php includes/views/admin-operations-console-pages.php > /tmp/views.diff
          ! grep -E '^[-+].*(wp_nonce_field\(|name=\\"vf_ops_online_acceptance_action|value=\\"finalize_batch|value=\\"save_evidence|vf_ops_online_acceptance_context_v121371|vf_ops_v11_pages_tools_rows_v121368|vf_ops_v11_dependency_rows)' /tmp/views.diff
          echo 'NO_SCHEMA_MIGRATION_UPDATE_PROTOCOL_DELTA=PASS'
          echo 'BEHAVIOR_BOUNDARY=PASS'
          echo 'S01_C02_121853_HUMAN_ADMIN_LANGUAGE_GATE=PASS'
