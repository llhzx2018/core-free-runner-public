name: P07 Release13 Distribution Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'installers/p07.sh'
      - 'installers/p07-final.sh'
      - 'installers/p07-toolbox.sh'
      - 'dist/p07/0.1.0/overlay/**'
      - '.github/workflows/p07-release13-distribution-gate.yml'

permissions:
  contents: read

jobs:
  distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Release13 identity
        run: |
          set -Eeuo pipefail
          root='dist/p07/0.1.0/overlay'
          test "$(cat "$root/BUILD_ID")" = '0.1.0-release13'
          grep -Fq 'EXPECTED_BUILD_ID="0.1.0-release13"' installers/p07-final.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release13"' installers/p07-toolbox.sh
          grep -Fq 'RUNTIME_MANIFEST_BLOB="2a3bb3dee14e6236138a86e271dac74df81f17eb"' installers/p07-final.sh
          grep -Fq 'EXPECTED_BLOB="e62cbde514c77270fc75ed9c72d6752776092a36"' installers/p07.sh
          grep -Fq '## External Database Export Snapshot Contract' "$root/docs/authority/RPD.md"
          grep -Fq '| B45 | Package-owned MySQL Snapshot |' "$root/docs/authority/ACCEPTANCE_MATRIX.md"
          grep -Fq 'OWNER_REAL_RELEASE12_FAIL' "$root/docs/authority/ACCEPTANCE_MATRIX.md"

      - name: Exact overlay and runtime manifests
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          root=Path('dist/p07/0.1.0/overlay')
          def blob(path: Path) -> str:
              data=path.read_bytes()
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()

          for name in ('RUNTIME.gitblob','MANIFEST.gitblob'):
              manifest=root/name
              for line in manifest.read_text(encoding='utf-8').splitlines():
                  if not line.strip():
                      continue
                  expected, rel=line.split('  ',1)
                  path=root/rel
                  assert path.is_file(), (name, rel)
                  actual=blob(path)
                  assert actual==expected, (name, rel, actual, expected)

          runtime=(root/'RUNTIME.gitblob').read_text(encoding='utf-8')
          assert 'b6c03354700b4939aeeb64d677a93bca453105bc  BUILD_ID' in runtime
          assert '563f1941285f735d6e3b40666ae5283e70d275c4  lib/package.py' in runtime
          assert 'dcde43110dd905fb85364559d04d6dac58c338da  lib/diagnostics.py' in runtime
          assert '5b7a6308320d6d4d295663df44879e38f79a6a48  lib/terminal_ui.sh' in runtime

          full=(root/'MANIFEST.gitblob').read_text(encoding='utf-8')
          assert 'd6b7d7c63f5624f175844050eda229a41838f17e  tests/test_release13_mysql_snapshot.py' in full
          PY

      - name: Release13 immutable-export contract
        run: |
          set -Eeuo pipefail
          root='dist/p07/0.1.0/overlay'
          grep -Fq 'TemporaryDirectory(prefix=".vfops-mysql-export-"' "$root/lib/package.py"
          grep -Fq '_snapshot_quiescent_gzip(export_source, target, database)' "$root/lib/package.py"
          grep -Fq 'source_digest != snapshot_digest' "$root/lib/package.py"
          grep -Fq 'os.replace(snapshot, target)' "$root/lib/package.py"
          grep -Fq 'MYSQL_SNAPSHOT_CHANGED' "$root/lib/diagnostics.py"
          grep -Fq "blocker_text='MySQL 数据库导出在封存时仍发生变化" "$root/lib/terminal_ui.sh"

      - name: Focused overlay regressions
        run: |
          set -Eeuo pipefail
          cd dist/p07/0.1.0/overlay
          export PYTHONPATH="$PWD/lib"
          bash -n bin/vfops
          bash -n bin/vfops-site-ui
          bash -n lib/terminal_ui.sh
          python3 -m py_compile lib/package.py lib/package_core.py lib/diagnostics.py
          python3 -m unittest -q             tests.test_release13_mysql_snapshot             tests.test_release12_backup_freshness             tests.test_backup             tests.test_backup_frontend             tests.test_terminal_ui_color_contract             tests.test_user_entry

      - name: Isolated current-runtime install
        run: |
          set -Eeuo pipefail
          root="$PWD"
          tmp="$(mktemp -d)"
          export P07_PUBLIC_ROOT="file://$root"
          export P07_INSTALL_DIR="$tmp/install"
          export P07_PREVIOUS_DIR="$tmp/previous"
          export P07_BIN_LINK="$tmp/vfops"
          export P07_ALLOW_NONROOT=1
          export P07_NO_EXEC=1

          bash installers/p07-final.sh >"$tmp/install.log"
          test "$("$tmp/vfops" --version)" = 'VF Server Ops 0.1.0'
          test "$("$tmp/vfops" --build-id)" = '0.1.0-release13'
          grep -Fq 'lib/package.py' "$tmp/install/.runtime-manifest.gitblob"
          grep -Fq 'lib/diagnostics.py' "$tmp/install/.runtime-manifest.gitblob"
          grep -Fq 'lib/terminal_ui.sh' "$tmp/install/.runtime-manifest.gitblob"

          NO_COLOR=1 bash -c "source '$tmp/install/lib/terminal_ui.sh'; ui_safe_diagnostic 'VFOPS_DIAGNOSTIC_V1 stage=BACKUP error_class=BACKUP_ERROR blocker=MYSQL_SNAPSHOT_CHANGED cleanup=NOT_REPORTED exit_code=4'" >"$tmp/diag.txt"
          grep -Fq '阶段：备份' "$tmp/diag.txt"
          grep -Fq '原因：MySQL 数据库导出在封存时仍发生变化' "$tmp/diag.txt"
          ! grep -Fq 'FRESH_VERIFY_NOT_PASS' "$tmp/diag.txt"
          ! grep -Fq 'MYSQL_SNAPSHOT_CHANGED' "$tmp/diag.txt"
          ! grep -Fq '原因代码' "$tmp/diag.txt"

          bash installers/p07-final.sh >"$tmp/second.log"
          grep -Fq '已是当前版本，无需下载或重复安装' "$tmp/second.log"

      - name: Safety boundary
        run: |
          set -Eeuo pipefail
          root='dist/p07/0.1.0/overlay'
          ! grep -R -n -E '(PRIVATE KEY|BEGIN OPENSSH|ghp_[A-Za-z0-9]|github_pat_)' "$root/bin" "$root/lib" installers/p07*.sh
          ! grep -R -n -E '(^|[^A-Za-z])(rm[[:space:]]+-rf[[:space:]]+/($|[[:space:]]))' installers/p07*.sh "$root/bin" "$root/lib"
          ! grep -R -n -E '(ghp_[A-Za-z0-9]|github_pat_|BEGIN OPENSSH PRIVATE KEY)' "$root/bin" "$root/lib" installers/p07*.sh
          grep -Fq 'DNS：未修改' "$root/bin/vfops-site-ui"

      - name: Result
        if: always()
        run: |
          echo 'P07_RELEASE13_DISTRIBUTION_GATE=COMPLETE'
          echo 'P07_PRODUCTION_WRITE=NOT_RUN'
