name: P05 V1.2.3 Closure Authority Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/p05-v123-closure-authority-gate.yml'

permissions:
  contents: read

jobs:
  gate:
    if: github.head_ref == 'test/p05-v123-closure-authority-20260902'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      PRODUCT_SHA: f9247a2532a38d98105657e2c813bd1aba93cca4
      PRODUCT_TREE: d409c18052d2f4f72051043227acc7170aa3bfc4
      PRODUCT_BASE: 66a56dafdfba2ca7243d1984791ecbe0fd7382ae
    steps:
      - name: Verify private read capability
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VF_PRIVATE_READ_TOKEN"
          echo 'P05_CLOSURE_PRIVATE_READ=PASS'

      - name: Checkout exact Product closure candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          repository: llhzx2018/vf-seo
          ref: f9247a2532a38d98105657e2c813bd1aba93cca4
          token: ${{ env.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 2
          path: p05

      - name: Verify exact five-file closure source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p05 rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git -C p05 rev-parse HEAD^{tree})" = "$PRODUCT_TREE"
          test "$(git -C p05 rev-parse HEAD^)" = "$PRODUCT_BASE"
          mapfile -t changed < <(git -C p05 diff --name-only HEAD^ HEAD | sort)
          expected=(
            'CHANGELOG.md'
            'README.md'
            'VF_PROJECT.json'
            'docs/authority/RELEASE_V1.2.3_PRODUCTION_CLOSURE.md'
            'docs/handoff/CURRENT_STATE.md'
          )
          test "${#changed[@]}" -eq 5
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done
          git -C p05 diff --check HEAD^ HEAD
          test "$(cat p05/VERSION)" = '1.2.3'
          echo 'P05_CLOSURE_EXACT_FIVE_FILE_SCOPE=PASS'

      - name: Verify closure content and JSON authority
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('p05/VF_PROJECT.json').read_text())
          assert p['version']=='1.2.3'
          assert p['production_version']=='1.2.3'
          assert p['formal_release']=='v1.2.3'
          assert p['deployment_readiness']=='V1.2.3_PRODUCTION_CLOSED'
          assert p['release_publication']['target_commit']=='66a56dafdfba2ca7243d1984791ecbe0fd7382ae'
          assert p['release_publication']['release_id']==380755611
          c=p['v1_2_3_production_closure']
          assert c['atomic_gate']['run']==33548178743 and c['atomic_gate']['state']=='PASS'
          assert c['sealed_relay']['run']==33562194685 and c['sealed_relay']['browser_secret'] is False
          assert c['production_readback']['run']==33562813196 and c['production_readback']['version']=='1.2.3'
          assert c['production_readback']['bridge_cleaned'] is True
          assert p['authority']['release']=='docs/authority/RELEASE_V1.2.3_PRODUCTION_CLOSURE.md'
          PY
          grep -q 'OWNER_OBSERVED / SCREENSHOT_VERIFIED + MACHINE_RUNTIME_READBACK_PASS' p05/docs/authority/RELEASE_V1.2.3_PRODUCTION_CLOSURE.md
          grep -q 'repair-v\*.php.*disaster-recovery fallback' p05/docs/authority/RELEASE_V1.2.3_PRODUCTION_CLOSURE.md
          echo 'P05_CLOSURE_CONTENT=PASS'

      - name: Verify live v1.2.3 Release authority
        shell: bash
        env:
          GH_TOKEN: ${{ env.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api repos/llhzx2018/vf-seo/releases/tags/v1.2.3 > /tmp/release.json
          php -r '$v=json_decode(file_get_contents($argv[1]),true,64,JSON_THROW_ON_ERROR); if(($v["id"]??0)!==380755611)exit(1); if(($v["target_commitish"]??"")!=="66a56dafdfba2ca7243d1984791ecbe0fd7382ae")exit(2); $a=[]; foreach(($v["assets"]??[]) as $x){$a[$x["name"]]=$x;} foreach([["VF_SEO_V1.2.3_FULL.zip",540005215,516457,"sha256:66621da7ed5d426cc7c1367a37ac5bbf463617daa5e71745a462f2c3ced44112"],["VF_SEO_V1.2.3_UPDATE.zip",540017020,1173998,"sha256:0de26614f5269ba5d1f6ace343b6853a82a4fb3e3bcbe5be85e3ad683f48588d"],["repair-v1.2.3.php",540017025,3671457,"sha256:378c1ed64e86eb2ac79a8e40ca5feaa3bd7f3cd2ff41b05bf1daedead0e5ff63"]] as $e){[$n,$id,$bytes,$d]=$e;if(($a[$n]["id"]??0)!==$id||($a[$n]["size"]??0)!==$bytes||($a[$n]["digest"]??"")!==$d)exit(3);}' /tmp/release.json
          echo 'P05_CLOSURE_LIVE_RELEASE=PASS'

      - name: Verify live core-updates P05 channel
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          repository: llhzx2018/core-updates
          ref: main
          token: ${{ env.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: updates

      - name: Verify P05 manifest semantics
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('updates/projects/P05.json').read_text())
          assert v['current_version']=='1.2.2'
          assert v['target_version']=='1.2.3'
          assert v['update_type']=='ATOMIC'
          assert v['from_versions']==['1.2.2']
          assert v['schema_from']=='1' and v['schema_to']=='1'
          assert v['release_id']==380755611
          assert v['product_identity']=='66a56dafdfba2ca7243d1984791ecbe0fd7382ae'
          assert v['asset_name']=='VF_SEO_V1.2.3_UPDATE.zip'
          assert v['asset_bytes']==1173998
          assert v['asset_sha256']=='0de26614f5269ba5d1f6ace343b6853a82a4fb3e3bcbe5be85e3ad683f48588d'
          assert v['backup_required'] is True and v['rollback_supported'] is True
          PY
          echo 'P05_CLOSURE_LIVE_CORE_UPDATES=PASS'

      - name: Verify terminal Bridge Relay Production evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          for id in 33561682259 33562194685 33562813196; do
            curl -fsS --connect-timeout 10 --max-time 20 "https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/runs/$id" > "/tmp/run-$id.json"
            php -r '$v=json_decode(file_get_contents($argv[1]),true,32,JSON_THROW_ON_ERROR); if(($v["status"]??"")!=="completed"||($v["conclusion"]??"")!=="success")exit(1);' "/tmp/run-$id.json"
          done
          echo 'P05_CLOSURE_TERMINAL_EVIDENCE=PASS'
          echo 'P05_CLOSURE_PRODUCT_CODE_WRITE=0'
          echo 'P05_CLOSURE_TAG_WRITE=0'
          echo 'P05_CLOSURE_PRODUCTION_WRITE=0'
