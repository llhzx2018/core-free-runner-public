name: TEMP P08 R43 genuine SQLite guardian, native shadow six DDL, two independent SIGKILL
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p08-r43-sqlite-guardian-shadow-20261124.yml'
permissions:
  contents: read
concurrency:
  group: p08-r43-schema-archive-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  TARGET_REPO: llhzx2018/vf-adops
  TARGET_VERSION: '0.1.18'
  TARGET_SHA: 3fe0acb3eed6bf8171246bb82e5e963c0e292345
  BRIDGE_VERSION: '0.1.17'
  BRIDGE_SHA: 42d082c23d05ca182f78b4ffb1bebe43a3ad2215
jobs:
  identity-preflight:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/p08-r43-sqlite-guardian-shadow-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 scripts/ephemeral_lane_spec.py audit-rendered --spec specs/ephemeral/p08-r43-sqlite-guardian-shadow-20261124.json --input .github/workflows/temp-p08-r43-sqlite-guardian-shadow-20261124.yml
  sqlite-independent-guardian:
    needs: identity-preflight
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/p08-r43-sqlite-guardian-shadow-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GITHUB_ACTIONS: 'true'
      P08_ISOLATED_INSTALL_TEST: 'YES'
      P08_R43_DISPOSABLE_SCHEMA: 'YES'
    steps:
      - name: Checkout exact v017 bridge candidate (private transient checkout)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.BRIDGE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-p08-bridge
      - name: Checkout exact v018 integrated target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-p08-target
      - name: Checkout current GOV-doc delivery contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: gov-proof
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_mysql, pdo_sqlite, sqlite3, zip, mbstring, intl, bcmath, dom, fileinfo, posix
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source, vendor and Vite build + real source-locked dev Clean FULL archives
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C private-p08-bridge rev-parse HEAD)" = "$BRIDGE_SHA"
          test "$(git -C private-p08-target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(cat private-p08-bridge/VERSION)" = "$BRIDGE_VERSION"
          test "$(cat private-p08-target/VERSION)" = "$TARGET_VERSION"
          php -l private-p08-bridge/tests/compatibility/r43_isolated_installed_native_transaction.php > "$RUNNER_TEMP/p08-r43-native-lint.log" 2>&1 || { echo P08_R43_NATIVE_DRIVER_TEST_SYNTAX=FAIL; exit 1; }
          php -l private-p08-bridge/src/Upgrade/R43IsolatedSchemaTransaction.php >> "$RUNNER_TEMP/p08-r43-native-lint.log" 2>&1 || { echo P08_R43_NATIVE_TRANSACTION_SYNTAX=FAIL; exit 1; }
          for d in private-p08-bridge private-p08-target; do
            mkdir -p "$d/bootstrap/cache" "$d/storage/framework/cache/data" "$d/storage/framework/sessions" "$d/storage/framework/views" "$d/storage/logs"
            (cd "$d" && composer install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/p08-r43-$d-composer.log" 2>&1) || { echo P08_R43_NATIVE_LOCKED_COMPOSER=FAIL; exit 1; }
            (cd "$d" && npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-r43-$d-npm.log" 2>&1 && npm run build > "$RUNNER_TEMP/p08-r43-$d-vite.log" 2>&1) || { echo P08_R43_NATIVE_LOCKED_VITE=FAIL; exit 1; }
          done
          python3 private-p08-bridge/scripts/build_full.py --source private-p08-bridge --output "$RUNNER_TEMP/p08-r43-bridge.zip" --version "$BRIDGE_VERSION" --source-sha "$BRIDGE_SHA" --governance-root gov-proof > "$RUNNER_TEMP/p08-r43-bridge-builder.log" 2>&1 || { echo P08_R43_NATIVE_BRIDGE_FULL=FAIL; exit 1; }
          python3 private-p08-target/scripts/build_full.py --source private-p08-target --output "$RUNNER_TEMP/p08-r43-target.zip" --version "$TARGET_VERSION" --source-sha "$TARGET_SHA" --governance-root gov-proof > "$RUNNER_TEMP/p08-r43-target-builder.log" 2>&1 || { echo P08_R43_NATIVE_TARGET_FULL=FAIL; exit 1; }
          mkdir -m 700 "$RUNNER_TEMP/p08-r43-target-extract"
          unzip -q "$RUNNER_TEMP/p08-r43-target.zip" -d "$RUNNER_TEMP/p08-r43-target-extract"
          echo P08_R43_NATIVE_TWO_CANONICAL_DEV_FULLS=PASS
      - name: Install genuine v017 SQLite Owner from verified FULL and verify dev-only PHP syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          for f in src/Upgrade/R43SqliteIndependentGuardianDrill.php tests/compatibility/r43_sqlite_independent_guardian_drill.php tests/compatibility/r43_isolated_installed_transaction.php; do
            php -l "private-p08-bridge/$f" >> "$RUNNER_TEMP/p08-r43-guardian-lint.log" 2>&1 || { echo P08_R43_GUARDIAN_PHP_SYNTAX=FAIL; exit 1; }
          done
          site="$RUNNER_TEMP/p08-r43-site-app-gate"
          test ! -e "$site"
          mkdir -m 700 "$site"
          unzip -q "$RUNNER_TEMP/p08-r43-bridge.zip" -d "$site"
          php private-p08-bridge/tests/compatibility/r43_isolated_installed_transaction.php setup "$site" "$RUNNER_TEMP/p08-r43-target-extract" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/p08-r43-guardian-owner.log" 2>&1 || { echo P08_R43_GUARDIAN_OLD_OWNER_INSTALL=FAIL; exit 1; }
          grep -qx 'P08_R43_REAL_EXTRACTED_FULL_017_OWNER_INSTALL_AND_PRIVATE_FIXTURE=PASS' "$RUNNER_TEMP/p08-r43-guardian-owner.log"
          test "$(readlink "$site/current")" = "releases/$BRIDGE_SHA"
          test "$(find "$site/database" -maxdepth 1 -type f -name '*.sqlite' | wc -l)" -eq 1
          echo P08_R43_SQLITE_GUARDIAN_REAL_V017_FULL_OWNER=PASS
      - name: Independent SQLite transaction guard vs worker and guardian SIGKILL native DDL on disposable shadow
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          t="private-p08-bridge/tests/compatibility/r43_sqlite_independent_guardian_drill.php"
          site="$RUNNER_TEMP/p08-r43-site-app-gate"
          target="$RUNNER_TEMP/p08-r43-target-extract"
          run_phase() {
            local phase="$1"
            if ! php "$t" "$phase" "$site" "$target" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/p08-r43-guardian-$phase.log" 2>&1; then
              echo "P08_R43_SQLITE_GUARDIAN_PHASE_FAILED=$phase"
              local reason
              reason="$(grep -oE 'R43_[A-Z][A-Z0-9_]+' "$RUNNER_TEMP/p08-r43-guardian-$phase.log" | tail -1 || true)"
              if [[ "$reason" =~ ^R43_[A-Z][A-Z0-9_]+$ ]]; then echo "P08_R43_GUARDIAN_SAFE_REASON=$reason"; else echo P08_R43_GUARDIAN_SAFE_REASON=UNCLASSIFIED; fi
              return 1
            fi
          }
          run_phase arm
          grep -qx 'P08_R43_SQLITE_GUARDIAN_DURABLE_HTTP_CLOSED_JOURNAL_NOT_SQL_LOCK=PASS' "$RUNNER_TEMP/p08-r43-guardian-arm.log"
          port=41732
          php -S "127.0.0.1:$port" -t "$site/public" > "$RUNNER_TEMP/p08-r43-guardian-web.log" 2>&1 &
          web_pid=$!
          guardian_pid=''
          cleanup_child() {
            kill "$web_pid" >/dev/null 2>&1 || true
            if test -n "$guardian_pid"; then kill -9 "$guardian_pid" >/dev/null 2>&1 || true; fi
          }
          trap cleanup_child EXIT
          for i in $(seq 1 30); do curl -s -o /dev/null --max-time 2 "http://127.0.0.1:$port/up" && break; sleep .2; done
          assert_http_closed() {
            local ordinary wake
            ordinary="$(curl --noproxy '*' -s -o /dev/null -w '%{http_code}' --max-time 5 "http://127.0.0.1:$port/up")"
            wake="$(curl --noproxy '*' -s -o /dev/null -w '%{http_code}' --max-time 5 -X POST -d phase=recover "http://127.0.0.1:$port/app/system/update/next/wake")"
            if test "$ordinary" != 503 || test "$wake" != 503; then echo "P08_R43_SQLITE_HTTP_FAIL_CLOSED=FAIL $ordinary/$wake"; return 1; fi
          }
          assert_http_closed
          echo P08_R43_SQLITE_GUARDIAN_APP_HTTP_AND_EMERGENCY_POST_503=PASS
          php "$t" guardian-hold "$site" "$target" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/p08-r43-guardian-holder.log" 2>&1 &
          guardian_pid=$!
          ready="$site/storage/app/private/adops/upgrade/r43-sqlite-guardian-ready"
          for i in $(seq 1 50); do
            if test -f "$ready" && kill -0 "$guardian_pid" 2>/dev/null; then break; fi
            sleep .2
          done
          test -f "$ready" && kill -0 "$guardian_pid" || { echo P08_R43_SQLITE_INDEPENDENT_GUARDIAN_START=FAIL; exit 1; }
          run_phase shadow
          grep -qx 'P08_R43_SQLITE_GUARDIAN_NATIVE_BACKUP_SIX_REAL_DDL_ON_SHADOW_OLD_SAFE=PASS' "$RUNNER_TEMP/p08-r43-guardian-shadow.log"
          echo P08_R43_SQLITE_REAL_SNAPSHOT_SHADOW_SIX_DDL_WHILE_GUARDED=PASS
          set +e
          php "$t" kill-worker "$site" "$target" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/p08-r43-guardian-worker-kill.log" 2>&1
          code=$?
          set -e
          test "$code" -eq 137 || { echo "P08_R43_SQLITE_WORKER_KILL_NOT_137=$code"; exit 1; }
          grep -qx 'P08_R43_SQLITE_GUARDIAN_WORKER_REAL_SIGKILL_PREPARED=PASS' "$RUNNER_TEMP/p08-r43-guardian-worker-kill.log"
          run_phase audit-locked
          grep -qx 'P08_R43_SQLITE_GUARDIAN_INDEPENDENT_POST_WORKER_SIGKILL_NATIVE_LOCK_AND_SHADOW_INTACT=PASS' "$RUNNER_TEMP/p08-r43-guardian-audit-locked.log"
          grep -qx 'P08_R43_SQLITE_GUARDIAN_UNRELATED_SQLITE_SITE_WRITABLE_WHILE_TARGET_GUARDIAN_HELD=PASS' "$RUNNER_TEMP/p08-r43-guardian-audit-locked.log"
          assert_http_closed
          echo P08_R43_SQLITE_WORKER_SIGKILL_OLD_SOURCE_NATIVE_LOCK_SURVIVED=PASS
          kill -9 "$guardian_pid"
          set +e
          wait "$guardian_pid" > /dev/null 2>&1
          code=$?
          set -e
          test "$code" -eq 137 || { echo "P08_R43_SQLITE_GUARDIAN_SIGKILL_NOT_137=$code"; exit 1; }
          guardian_pid=''
          run_phase audit-guardian-dead
          grep -qx 'P08_R43_SQLITE_GUARDIAN_GUARDIAN_SIGKILL_RELEASES_NATIVE_WRITE_LOCK_BUT_HTTP_503_REMAINS=PASS' "$RUNNER_TEMP/p08-r43-guardian-audit-guardian-dead.log"
          assert_http_closed
          run_phase outside-write
          grep -qx 'P08_R43_SQLITE_GUARDIAN_DIRECT_SQL_AFTER_GUARDIAN_SIGKILL_BYPASSES_HTTP_MAINTENANCE=PASS' "$RUNNER_TEMP/p08-r43-guardian-outside-write.log"
          run_phase audit-stale
          grep -qx 'P08_R43_SQLITE_GUARDIAN_INDEPENDENT_DIRECT_SQL_DRIFT_REJECTS_STALE_SHADOW_AND_CUTOVER=PASS' "$RUNNER_TEMP/p08-r43-guardian-audit-stale.log"
          assert_http_closed
          echo P08_R43_SQLITE_GUARDIAN_SIGKILL_NATIVE_LOCK_DROPS_RAW_SQL_BYPASSES_HTTP_NEGATIVE=PASS
          echo P08_R43_SHIPPING_SQLITE_UNMANAGED_WRITER_STOP=BLOCKED
      - name: Remove disposable SQLite Owner, private material and temporary source
        if: always()
        shell: bash
        run: |
          set +e
          set +x
          rm -rf -- private-p08-bridge private-p08-target gov-proof
          rm -rf -- "$RUNNER_TEMP/p08-r43-site-app-gate" "$RUNNER_TEMP/p08-r43-target-extract"
          rm -f -- "$RUNNER_TEMP"/p08-r43-*.zip "$RUNNER_TEMP"/p08-r43-*.log "$RUNNER_TEMP/p08-r43-unrelated-owner.sqlite"
          if test ! -e private-p08-bridge && test ! -e private-p08-target && test ! -e "$RUNNER_TEMP/p08-r43-site-app-gate"; then
            echo P08_R43_SQLITE_GUARDIAN_PRIVATE_SOURCE_FIXTURE_CLEANUP=PASS
          else
            echo P08_R43_SQLITE_GUARDIAN_CLEANUP=FAIL
            exit 1
          fi
