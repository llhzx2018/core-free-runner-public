name: P01 V2.37.0 Stage Composite Candidate R2
on:
  push:
    branches:
      - release/p01-v2365-candidate-20260902
    paths:
      - .github/workflows/p01-v2370-stage-candidate-r2-20260902.yml
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: release/v2.37.0-formal-candidate-20260902
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: candidate
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: 6442c4b40a029ff359539d4adb509260c1ecf496
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: develop
      - name: Build exact V2.37.0 composite candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          MAIN=4a41d3533fe8450c3f491d5aaf28417536012ba0
          DEVELOP=6442c4b40a029ff359539d4adb509260c1ecf496
          test "$(git -C candidate rev-parse HEAD)" = "$MAIN"
          test "$(git -C develop rev-parse HEAD)" = "$DEVELOP"
          grep -F "assets/resource-actions.css" develop/src/app/FunctionalWorkspace.php >/dev/null
          grep -F ".vf-functional-head>div{min-width:0}" develop/src/assets/workspace-rebaseline.css >/dev/null
          files=(src/app/FunctionalHome.php src/app/FunctionalWorkspace.php src/app/FunctionalWorkspaceShell.php src/assets/workspace-home.css src/assets/workspace-rebaseline.css src/assets/workspace-rebaseline.js src/assets/admin-pages.css src/browser-helper.php src/browser-extension/README.md src/browser-extension/background.js src/browser-extension/manifest.json src/browser-extension/options.html src/browser-extension/popup.js src/app/AdminShell.php src/duplicates.php src/health.php src/assets/resource-actions.css src/assets/workspace-create-bundle.js src/workspace-create.php src/assets/transfer.js src/transfer.php src/assets/links-admin.js src/links-admin.php src/app/SurfaceRepository.php src/assets/surface-workspace.css src/surface-manager.php src/app/Repository.php src/quick-save.php)
          for f in "${files[@]}"; do mkdir -p "candidate/$(dirname "$f")"; cp "develop/$f" "candidate/$f"; done
          cd candidate
          python3 - <<'PY'
          from pathlib import Path
          import json
          Path('VERSION').write_text('2.37.0\n')
          Path('src/VERSION.txt').write_text('2.37.0\n')
          p=Path('src/app/bootstrap.php')
          s=p.read_text()
          n=s.replace("define('VF_VERSION', '2.36.5');", "define('VF_VERSION', '2.37.0');", 1)
          if n == s: raise SystemExit('VF_VERSION source drift')
          p.write_text(n)
          c=Path('CHANGELOG.md')
          old=c.read_text()
          block='''## V2.37.0 · Personal Internet Journey Release Candidate · 2026-09-02\n\n- 浏览器书签导入成为首次使用主路径：导入优先、预览确认、默认安全策略不变。\n- 全局搜索升级为跨资源 Personal Search，支持 Ctrl/Cmd+K、相关性排序、Web fallback 与 URL 零结果直接保存。\n- Browser Helper 升级到 1.6.5，首次连接与失效重连路径收敛。\n- 网址健康与重复网址收束为统一健康入口；首页增加数据安全状态与最多 6 条最近使用。\n- 导航新增收敛为 URL-first；删除网址后提供 30 秒页面内撤销。\n- 待整理严格以 is_pending 为准，并提供只建议、不自动迁移的现有分类建议。\n- 新增跨平台 quick-save.php，始终保存为私人待整理。\n- Personal Internet Journey R3 33565412715 PASS；Wave 1–13 Product Gate 全部 PASS。\n- Schema 保持 `2026082901`，无 Migration；正式在线升级路径仅允许 V2.36.5 → V2.37.0。\n\n'''
          if old.startswith('## V2.37.0'): raise SystemExit('duplicate candidate changelog')
          c.write_text(block + old)
          q=Path('VF_PROJECT.json')
          d=json.loads(q.read_text())
          if d.get('production_version') != '2.36.5' or d.get('schema_version') != '2026082901': raise SystemExit('production/schema drift')
          if d.get('production_release',{}).get('version') != '2.36.5' or d.get('published_release',{}).get('version') != '2.36.5': raise SystemExit('release authority drift')
          d['status']='V2.36.5 OWNER PRODUCTION / PUBLISHED / V2.37.0 RELEASE CANDIDATE'
          d['working_version']='2.37.0'
          d['target_release_version']='2.37.0'
          d['current_phase']='V2.37.0 PERSONAL INTERNET JOURNEY RELEASE / CANDIDATE READINESS PENDING'
          d['candidate_version']='2.37.0'
          d['candidate_schema_version']='2026082901'
          d['candidate_state']='V2.37.0 OWNER-AUTHORIZED RELEASE CANDIDATE / READINESS PENDING'
          d['formal_release_state']='V2.36.5 PUBLISHED + OWNER PRODUCTION / V2.37.0 NOT YET RELEASED'
          d.setdefault('component_versions',{})['browser_helper']='1.6.5'
          prs=[202,203,204,205,206,207,208,209,210,211,213,214,215]
          gates=[33555093483,33555366786,33556060719,33556510987,33556702984,33559741011,33560626141,33560836974,33561083446,33561344420,33563667758,33563991791,33564224738]
          d['current_change']={'change_id':'P01-V2370-PERSONAL-INTERNET-JOURNEY-20260902','type':'MINOR RELEASE / L2 PRODUCT OPTIMIZATION WAVE 1-13','production_base':'4a41d3533fe8450c3f491d5aaf28417536012ba0','develop_authority':'6442c4b40a029ff359539d4adb509260c1ecf496','product_prs':prs,'product_gates':gates,'journey_gate':33565412715,'schema_change':False,'migration':None,'version_change':True,'release_authorized_by_owner':True,'main_write':False,'production_write':False,'runner_main_write':False}
          d['v2_37_0_release_candidate']={'version':'2.37.0','production_version':'2.36.5','published_predecessor_version':'2.36.5','predecessor_tag':'v2.36.5','predecessor_source':'ef86eba16aec71c1d0dabc16ad23089a78ee5057','production_main':'4a41d3533fe8450c3f491d5aaf28417536012ba0','develop_authority':'6442c4b40a029ff359539d4adb509260c1ecf496','schema_version':'2026082901','schema_change':False,'migration':None,'scope':'L2 PRODUCT OPTIMIZATION WAVE 1-13 / PERSONAL INTERNET JOURNEY','product_prs':prs,'product_gates':gates,'journey_gate':33565412715,'unknown_runtime_bytes':0,'state':'CANDIDATE READINESS PENDING','main_write':False,'core_updates_write':False,'owner_production_write':False}
          d['current_authority']='Owner Production V2.36.5 / Published Latest V2.36.5 / V2.37.0 owner-authorized candidate prepared'
          d['next_action']='Run V2.37.0 Candidate Readiness and formal release gates. No main/Tag/Release/core-updates/Owner Production write before gates pass.'
          q.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          python3 -m json.tool VF_PROJECT.json >/dev/null
          find src -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.txt
          find src/assets src/browser-extension -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/tmp/js-check.txt
          git diff --check
          test "$(cat VERSION)" = 2.37.0
          test "$(cat src/VERSION.txt)" = 2.37.0
          grep -Fx "define('VF_VERSION', '2.37.0');" src/app/bootstrap.php >/dev/null
          grep -F "assets/resource-actions.css" src/app/FunctionalWorkspace.php >/dev/null
          grep -F ".vf-functional-head>div{min-width:0}" src/assets/workspace-rebaseline.css >/dev/null
          test "$(git rev-parse HEAD:database)" = "$(git rev-parse "$MAIN":database)"
          git diff --name-only "$MAIN" -- src | sort >/tmp/runtime-delta.txt
          printf '%s\n' "${files[@]}" src/VERSION.txt src/app/bootstrap.php | sort >/tmp/expected-runtime.txt
          diff -u /tmp/expected-runtime.txt /tmp/runtime-delta.txt
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add CHANGELOG.md VERSION VF_PROJECT.json src
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 33
          git commit -m 'release(P01): prepare V2.37.0 composite candidate'
          printf 'P01_V2370_STAGE=PASS\nCANDIDATE=%s\nTREE=%s\nRUNTIME_TREE=%s\nPARENT=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" "$(git rev-parse HEAD:src)" "$(git rev-parse HEAD^)" | tee /tmp/p01-v2370-stage.txt
          git push origin HEAD:release/v2.37.0-formal-candidate-20260902
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-v2370-stage-${{ github.run_id }}
          path: /tmp/p01-v2370-stage.txt
          if-no-files-found: warn
          retention-days: 90
