name: S01 Blog content public link and slug preflight
on:
  push:
    branches: [task/s01-blog-content-preflight-20261019]
    paths: ['.github/workflows/s01-blog-content-preflight.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.141
  TARGET_SHA: 127d9b7d7431f3ceab167318db44f4fb4b719907
jobs:
  content-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Verify existing article links and public slug collisions read only
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,json,concurrent.futures,re
          base='https://www3.m3u8.one'
          paths=["/m3u8-browser-stream-test/","/m3u8-player/","/m3u8-playlist-checker/","/privacy-policy/","/problems/","/problems/m3u8-403-forbidden-fix/","/problems/m3u8-cors-error-explained/","/zh/m3u8-browser-stream-test/","/zh/m3u8-player/","/zh/m3u8-playlist-checker/","/zh/privacy-policy/","/zh/problems/","/zh/problems/m3u8-403-forbidden-fix/","/zh/problems/m3u8-cors-error-explained/"]
          slugs=["hls-playback-preflight-for-publishers","browser-or-native-hls-player","hls-link-sharing-checklist","hls-playback-evidence-report","safe-hls-test-sample-selection","cross-browser-hls-comparison","hls-url-privacy-before-support"]
          def get(path):
            req=urllib.request.Request(base+path,headers={'User-Agent':'Mozilla/5.0 S01-Content-Preflight'})
            with urllib.request.urlopen(req,timeout=25) as r:
              b=r.read(1500000).decode('utf-8','replace')
              return r.status,r.url,b
          def check(path):
            status,url,body=get(path)
            assert status==200,(path,status)
            assert urllib.parse.urlsplit(url).netloc=='www3.m3u8.one'
            assert '<title>' in body.lower()
            assert 'vf-page-family-context--not_found' not in body
            return {'path':path,'status':status,'final_url':url}
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
            links=list(pool.map(check,paths))
          print('EXISTING_INTERNAL_LINKS='+json.dumps(links,ensure_ascii=False))
          collisions=[]
          for lang in ['en','zh']:
            route='/wp-json/wp/v2/posts?'+urllib.parse.urlencode({'per_page':100,'slug':','.join(slugs),'lang':lang,'_fields':'id,slug,link,title'})
            status,url,body=get(route);data=json.loads(body)
            assert isinstance(data,list)
            collisions.extend({'language':lang,'id':x['id'],'slug':x['slug']} for x in data)
          assert not collisions,collisions
          receipt={'existing_links':'PASS','count':len(links),'public_published_slug_collisions':collisions,'private_draft_collision_check':'PENDING_AUTHENTICATED_SITE_ACCESS','publication':'NOT_RUN','production_write':False}
          open('content-preflight.json','w').write(json.dumps(receipt,ensure_ascii=False,indent=2))
          print('CONTENT_PUBLIC_PREFLIGHT='+json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: s01-blog-content-preflight-${{ github.run_id }}
          path: content-preflight.json
          retention-days: 14
