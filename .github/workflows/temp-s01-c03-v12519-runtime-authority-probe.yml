name: TEMP S01-C03 v1.25.19 Runtime Authority Probe
on:
  push:
    branches: [temp/s01-c03-v12519-runtime-authority-probe-20260905]
    paths: ['.github/workflows/temp-s01-c03-v12519-runtime-authority-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: v1.25.19
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: m3u8
      - name: Compute exact v1.25.19 Runtime Authority
        run: |
          set -Eeuo pipefail
          cat >/tmp/probe.php <<'PHP'
          <?php
          define('ABSPATH','/');
          class WP_Error { public function __construct(...$x){} }
          final class VF_M3U8_Update_Contract_V1 {
              public const COMPONENT_ID='S01-C03';
              public const RUNTIME_CONTRACT='VF_WP_COMPONENT_RUNTIME_AUTHORITY_V1';
          }
          require 'm3u8/src/includes/update/class-vf-m3u8-runtime-authority-v1.php';
          $s=VF_M3U8_Runtime_Authority_V1::snapshot('m3u8/src');
          if ($s instanceof WP_Error) { exit(2); }
          unset($s['files']);
          echo json_encode($s, JSON_UNESCAPED_SLASHES), "\n";
          PHP
          result="$(php /tmp/probe.php)"
          echo "M3U8_V12519_RUNTIME=$result"
          test "$(jq -r '.component_id' <<<"$result")" = 'S01-C03'
          test "$(jq -r '.runtime_contract' <<<"$result")" = 'VF_WP_COMPONENT_RUNTIME_AUTHORITY_V1'
          echo PASS_M3U8_V12519_RUNTIME_AUTHORITY_PROBE
