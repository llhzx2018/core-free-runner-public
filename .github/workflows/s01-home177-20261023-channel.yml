name: S01 exact Theme channel contract
on:
  push:
    branches: [task/s01-home177-20261023]
    paths: ['.github/workflows/s01-home177-20261023-channel.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.177
  TARGET_SHA: b8e944681ae263a585d03748dbf4d111e08d899a
  UPDATE_SHA: 65bfa7ae48aa14972fae61ebc77b1ca15873c8d9
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: 65bfa7ae48aa14972fae61ebc77b1ca15873c8d9
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Exact changed manifest and native protocol tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PYCHANNEL'
          import json,os
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']==os.environ['TARGET_VERSION']
          assert m['asset_sha256']=='a549a718c8a05b2e6825128ea3c263693fc4e2e4d165c5e7693a5043a6dbe984' and m['asset_bytes']==1976857
          assert m['runtime_files']==476 and '1.35.176' in m['from_versions']
          assert m['release_tag']=='v'+os.environ['TARGET_VERSION']
          print('EXACT_CHANNEL_CONTRACT_PASS')
          PYCHANNEL
      - name: Cleanup
        if: always()
        run: rm -rf source
