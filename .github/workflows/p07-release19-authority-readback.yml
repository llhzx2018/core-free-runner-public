name: P07 Release19 Authority Readback Exact-source Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-release19-authority-readback.yml'

permissions:
  contents: read

jobs:
  exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Verify private read token
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: test -n "$PRIVATE_READ_TOKEN"

      - name: Checkout exact private authority candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 46d6773a9408850c1b9a04b96b6b39ed6f7e136a
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Release19 authority readback
        working-directory: source
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '46d6773a9408850c1b9a04b96b6b39ed6f7e136a'
          test "$(cat BUILD_ID)" = '0.1.0-release19'
          python3 -m json.tool docs/authority/P07_INTEGRATION_MANIFEST.json >/dev/null

          grep -Fq 'Slot 3 CloudPanel Ops                = 0.1.0-release19' docs/authority/CURRENT.md
          grep -Fq 'Public Distribution                   = 1c218b5dd2ed5c1ef1193ce664c8de42180a51cf' docs/authority/CURRENT.md
          grep -Fq 'Release19 Distribution Gate           36816117494 PASS' docs/authority/CURRENT.md
          grep -Fq 'release19 Production install                    NOT_YET_OWNER_VERIFIED' docs/authority/CURRENT.md

          grep -Fq '| B51 | Restore-As Guarded Nginx Reload / Transport Diagnosis |' docs/authority/ACCEPTANCE_MATRIX.md
          grep -Fq 'PUBLIC_DISTRIBUTED' docs/authority/ACCEPTANCE_MATRIX.md
          grep -Fq 'RELEASE19_OWNER_REAL_USE_PENDING' docs/authority/ACCEPTANCE_MATRIX.md

          python3 - <<'PY'
          import json
          p=json.load(open('docs/authority/P07_INTEGRATION_MANIFEST.json',encoding='utf-8'))
          slot3=next(x for x in p['slots'] if x['slot']==3)
          assert slot3['internal_version']=='0.1.0-release19'
          assert slot3['source_main_commit']=='728568b00505a206f7e6b66740bede0ad25034ed'
          assert slot3['nginx_reload_contract']=='NGINX_T_THEN_SIGNAL_RELOAD_V1'
          assert slot3['transport_diagnosis_contract']=='SAFE_CURL_TRANSPORT_CLASS_V1'

          release=p['release']
          assert release['slot3_build']=='0.1.0-release19'
          assert release['slot3_source_main_commit']=='728568b00505a206f7e6b66740bede0ad25034ed'
          assert release['public_distribution_commit']=='1c218b5dd2ed5c1ef1193ce664c8de42180a51cf'
          assert release['current_public_main_commit']=='1c218b5dd2ed5c1ef1193ce664c8de42180a51cf'
          assert release['runtime_manifest_blob']=='67f40e615003d8c302ec391c73c836f05113db57'
          assert release['overlay_manifest_blob']=='07a4ba0aa2a4679cb80324bfcd11e6cc785ba6b6'
          assert release['final_installer_blob']=='ab42d2d1b84669372b8615819de63f0c19619067'
          assert release['stable_installer_blob']=='3a1853e4fdf30c0327a1e6d4390fb8b6de57ca35'
          assert release['toolbox_blob']=='83a7b38e69c6db1d30a16f1f648172163f693b5e'

          prod=p['production']
          assert prod['slot3_build']=='0.1.0-release14'
          assert prod['release18_restore_evidence']['status']=='REAL_FAIL_LOCAL_HTTP_UNREACHABLE'
          assert prod['release19_install_status']=='NOT_YET_OWNER_VERIFIED'
          assert prod['release19_owner_real_use']=='PENDING'
          assert prod['migration_executed'] is False
          assert prod['dns_write'] is False
          assert prod['source_delete'] is False
          assert prod['resource_safe_apply_run'] is False
          assert 'source_candidate' not in p
          PY

      - name: Secret boundary
        working-directory: source
        run: |
          set -Eeuo pipefail
          python3 scripts/secret_scan.py --root docs

      - name: Result
        if: always()
        run: |
          echo 'P07_RELEASE19_AUTHORITY_SOURCE=46d6773a9408850c1b9a04b96b6b39ed6f7e136a'
          echo 'P07_PRODUCTION_WRITE=NOT_RUN'
