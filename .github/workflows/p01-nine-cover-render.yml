name: One-time P01 nine SVG-to-PNG cover rendering

on:
  push:
    branches: [artifact/p01-nine-cover-render-20261016]
    paths:
      - '.cover-render/READY.json'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Render and verify nine 640x960 covers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin fonts-noto-cjk
          python -m pip install --quiet --user Pillow
          python - <<'PY'
          import hashlib,json,subprocess,pathlib
          from PIL import Image
          root=pathlib.Path('.')
          req=root/'.cover-render/READY.json'
          ids=['A1','A2','A3','A4','A5','B1','B2','B3','C1']
          if not req.exists():raise SystemExit('no explicit marker')
          if json.loads(req.read_text())!=ids:raise SystemExit('unexpected book IDs')
          dest=root/'cover-render-output'
          dest.mkdir(exist_ok=True)
          out={}
          for bid in ids:
              src=root/f'cover-render-input/{bid}.svg'
              dst=dest/f'{bid}.png'
              subprocess.run(['rsvg-convert','--width','640','--height','960','--output',str(dst),str(src)],check=True)
              with Image.open(dst) as image:
                  image.verify()
              with Image.open(dst) as image:
                  if image.size!=(640,960) or image.format!='PNG':raise SystemExit('invalid image '+bid)
              raw=dst.read_bytes()
              if len(raw)>1200*1024 or len(raw)<4096:raise SystemExit('bad cover size '+bid)
              out[bid]={'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw),'width':640,'height':960,'mime':'image/png'}
          (dest/'manifest.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print('P01_NINE_COVER_RENDER=PASS',sum(x['bytes'] for x in out.values()))
          PY
      - name: Commit rendered PNG and SHA256 receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'P01 one-time art renderer'
          git config user.email 'actions@users.noreply.github.com'
          git add -f cover-render-output/*.png cover-render-output/manifest.json
          rm -f .cover-render/READY.json
          git add -A .cover-render
          git commit -m 'artifact(P01): nine real book PNG covers and SHA receipt [skip ci]'
          git push origin HEAD:artifact/p01-nine-cover-render-20261016
