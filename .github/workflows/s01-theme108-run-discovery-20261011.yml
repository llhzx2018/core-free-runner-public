name: S01 Theme108 Ephemeral Run Discovery
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  find-push-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Report public-safe exact candidate run identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api "repos/${{ github.repository }}/actions/runs?branch=task%2Fs01-theme108-embed-mount-20261011-e2e&per_page=40" --jq '.workflow_runs[] | select(.event=="push") | select(.name=="S01 Theme108 Embed Mount exact WordPress route + tools regression") | [.id,.status,.conclusion,.head_sha,.html_url] | @tsv'
