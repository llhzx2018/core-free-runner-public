name: P01 V2.33 Main Promotion
on:
  push:
    branches: [task/p01-v2330-formal-release-20260830]
    paths: [.github/workflows/p01-v2330-main-promotion-20260830.yml]
permissions:
  contents: read
jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify exact gates and concurrent truth
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          FORMAL_GATE=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/runs/33268865316)
          test "$(jq -r .status <<<"$FORMAL_GATE")" = completed
          test "$(jq -r .conclusion <<<"$FORMAL_GATE")" = success
          test "$(jq -r .head_sha <<<"$FORMAL_GATE")" = a9534dd32dbf7723e85d8e9c96d6079fb2b675eb
          FRESH_GATE=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/runs/33269044619)
          test "$(jq -r .status <<<"$FRESH_GATE")" = completed
          test "$(jq -r .conclusion <<<"$FRESH_GATE")" = success
          test "$(jq -r .head_sha <<<"$FRESH_GATE")" = 342e3cd43cd707cf06375386e71a93abac7b05c5
          rm -rf product
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/vf-start.git" product
          git -C product fetch -q origin main develop --tags
          MAIN=$(git -C product rev-parse origin/main)
          DEVELOP=$(git -C product rev-parse origin/develop)
          test "$MAIN" = b63b6605a723e4e8d34dfb3368e0e7dd993558a6
          test "$DEVELOP" = 8c819c8bfd055d16b3ac367cef15f723431d9a42
          test "$(git -C product rev-parse "$DEVELOP^{tree}")" = db5a6e2b6a852e6925727b974fb7130359e3cdf8
          test "$(git -C product rev-parse "$DEVELOP:src")" = febc1b01a5b59963bc974cdc6455cfa824c0adc3
          test "$(git -C product merge-base "$MAIN" "$DEVELOP")" = "$MAIN"
          ! git -C product show-ref --verify --quiet refs/tags/v2.33.0
          test "$(git -C product show "$DEVELOP:VERSION" | tr -d '\r\n')" = 2.33.0
          test "$(git -C product show "$DEVELOP:src/VERSION.txt" | tr -d '\r\n')" = 2.33.0
          git -C product show "$DEVELOP:src/app/bootstrap.php" | grep -F "define('VF_VERSION', '2.33.0')" >/dev/null
          echo P01_V2330_FORMAL_GATE_33268865316=PASS
          echo P01_V2330_STRICT_FRESH_GATE_33269044619=PASS
          echo P01_V2330_PROMOTION_PRECHECK=PASS
      - name: Promote exact develop to main
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C product push "https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/vf-start.git" 8c819c8bfd055d16b3ac367cef15f723431d9a42:refs/heads/main
          git -C product fetch -q origin main
          test "$(git -C product rev-parse origin/main)" = 8c819c8bfd055d16b3ac367cef15f723431d9a42
          test "$(git -C product rev-parse origin/main^{tree})" = db5a6e2b6a852e6925727b974fb7130359e3cdf8
          test "$(git -C product rev-parse origin/main:src)" = febc1b01a5b59963bc974cdc6455cfa824c0adc3
          echo P01_V2330_MAIN_PROMOTION=PASS
          echo TAG_CREATED=NO
          echo RELEASE_PUBLISHED=NO
          echo OWNER_PRODUCTION_WRITE=NO
