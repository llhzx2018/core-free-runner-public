name: P02 V2.5.39 Discovery Gate

on:
  push:
    branches:
      - run/p02-v2539-discovery-20260919
    paths:
      - '.github/workflows/p02-v2539-discovery-gate.yml'

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact P02 release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 65a988761b9f398b7031ea889c51a8a054844099
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product

      - name: Checkout canonical core-updates manifest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: 697d10c0f5a85849e12d341114c0f7037fe28ed8
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: updates

      - name: Verify public stable discovery semantics
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/projects/P02.json' > /tmp/P02.json
          cmp updates/projects/P02.json /tmp/P02.json
          echo P02_V2539_CANONICAL_MIRROR_MATCH=PASS
          python3 - /tmp/P02.json <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1],encoding='utf-8'))
          assert x['project_id']=='P02'
          assert x['component_id']=='APP'
          assert x['enabled'] is True
          assert x['target_version']=='2.5.39'
          assert x['from_versions']==['2.5.35','2.5.36','2.5.37','2.5.38']
          assert x['schema_from']==x['schema_to']=='2401'
          assert x['repository']=='llhzx2018/vf-library'
          assert x['release_tag']=='v2.5.39'
          assert x['release_id']==392047351
          assert x['product_identity']=='65a988761b9f398b7031ea889c51a8a054844099'
          assert x['asset_name']=='VF_Library_V2.5.39_UPDATE.zip'
          assert x['asset_bytes']==381016
          assert x['asset_sha256']=='d995f6f5df039ee26a335f11b77d308c188a5edd0ca24eedc80fecb67336e9e9'
          assert x['backup_required'] is True and x['rollback_supported'] is True
          print('P02_V2539_PUBLIC_MANIFEST_IDENTITY=PASS')
          PY
          php -r '
            require "product/src/app/CoreUpdates/UpdateAdapter.php";
            require "product/src/app/CoreUpdates/UpdateCore.php";
            $m=json_decode(file_get_contents("/tmp/P02.json"),true,512,JSON_THROW_ON_ERROR);
            $c=new \CoreUpdates\UpdateCore("P02","APP");
            foreach(["2.5.35","2.5.36","2.5.37","2.5.38"] as $v){
              $r=$c->check($v,"2401",$m);
              if(($r["status"]??"")!=="AVAILABLE"){fwrite(STDERR,$v.":".json_encode($r)."\n");exit(2);}
              echo "P02_V2539_DISCOVERY_".$v."=AVAILABLE\n";
            }
            $r=$c->check("2.5.39","2401",$m);
            if(($r["status"]??"")!=="UP_TO_DATE"){fwrite(STDERR,json_encode($r)."\n");exit(3);}
            echo "P02_V2539_DISCOVERY_2.5.39=UP_TO_DATE\n";
          '
          echo P02_V2539_DISCOVERY_GATE=PASS
