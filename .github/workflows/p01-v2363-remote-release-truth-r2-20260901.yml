name: P01 V2.36.3 Remote Release Truth R2
on:
  push:
    branches: [release/p01-v2363-candidate-20260901]
    paths: [.github/workflows/p01-v2363-remote-release-truth-r2-20260901.yml]
permissions:
  contents: read
  actions: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FORMAL: 718e043e3715ef7b21849bc08634fca89bf92c1f
      FORMAL_TREE: 32e8afdd6d7cdd338c62fdafaedb200b127ca881
      RUNTIME_TREE: 820724b585cb59864211f77c4fb33537b2345029
      PRODUCT_MAIN: 21ac0ff14f17237212d288f71e95bde6eae503ec
      DEVELOP: bcecac5d3a9c103bfc37863a8870ec15285dcc5c
      CORE_LIVE: 650935cc9d71570a7ab7a0dd1c615ea5e3bf74bf
      RELEASE_ID: '380449563'
      ASSET_NAME: VF_Start_V2.36.3_UPDATE.zip
      ASSET_BYTES: '1236976'
      ASSET_SHA256: 7110d0e232ce7dec521b4e76148441d06376a02124249d68237b774f2d33447d
      REMOTE_R1: '33504735412'
      EVID: /tmp/p01-v2363-remote-release-truth-r2
    steps:
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: zip
          coverage: none
      - name: Checkout exact v2.36.3 tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.36.3
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: target
      - name: Checkout exact live core-updates
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CORE_LIVE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: updates
      - name: Authenticated remote truth fence
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVID/download"
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$REMOTE_R1 --jq .conclusion)" = failure
          test "$(git -C target rev-parse HEAD)" = "$FORMAL"
          test "$(git -C target rev-parse HEAD^{tree})" = "$FORMAL_TREE"
          test "$(git -C target rev-parse HEAD:src)" = "$RUNTIME_TREE"
          MAIN=$(gh api repos/llhzx2018/vf-start/branches/main --jq .commit.sha)
          DEV=$(gh api repos/llhzx2018/vf-start/branches/develop --jq .commit.sha)
          test "$MAIN" = "$PRODUCT_MAIN"
          test "$DEV" = "$DEVELOP"
          git -C target fetch origin "$MAIN" "$DEV" --quiet
          test "$(git -C target rev-parse "$MAIN^{tree}")" = "$FORMAL_TREE"
          test "$(git -C target rev-parse "$MAIN:src")" = "$RUNTIME_TREE"
          git -C target merge-base --is-ancestor "$FORMAL" "$MAIN"
          test "$(git -C target rev-parse "$DEV^{tree}")" = "$FORMAL_TREE"
          test "$(git -C target rev-parse "$DEV:src")" = "$RUNTIME_TREE"
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.36.3 --jq .object.sha)" = "$FORMAL"
          gh api repos/llhzx2018/vf-start/releases/tags/v2.36.3 > "$EVID/release.json"
          test "$(jq -r .id "$EVID/release.json")" = "$RELEASE_ID"
          test "$(jq -r .tag_name "$EVID/release.json")" = v2.36.3
          test "$(jq -r .draft "$EVID/release.json")" = false
          test "$(jq -r .prerelease "$EVID/release.json")" = false
          test "$(jq '.assets|length' "$EVID/release.json")" = 8
          jq -e '.assets[]|select(.name=="VF-Start-V2.36.3-FULL.zip" and .size==587176 and .digest=="sha256:6580700355c8a0127b030f6217a106260f0d8867fd3c3fd6db04fbd048fe46df")' "$EVID/release.json" >/dev/null
          jq -e --arg n "$ASSET_NAME" --argjson b "$ASSET_BYTES" --arg d "sha256:$ASSET_SHA256" '.assets[]|select(.name==$n and .size==$b and .digest==$d and .state=="uploaded")' "$EVID/release.json" >/dev/null
          jq -e '.assets[]|select(.name=="repair-v2.36.3.php" and .size==3591557 and .digest=="sha256:b76504cd122ab333815d44140ac7a1420451ed03cf63ced7013fc879044be231")' "$EVID/release.json" >/dev/null
          gh release download v2.36.3 --repo llhzx2018/vf-start --pattern "$ASSET_NAME" --dir "$EVID/download"
          A="$EVID/download/$ASSET_NAME"; test -f "$A"
          test "$(stat -c %s "$A")" = "$ASSET_BYTES"
          test "$(sha256sum "$A"|awk '{print $1}')" = "$ASSET_SHA256"
          unzip -p "$A" repair-v2.36.3.php > "$EVID/repair-v2.36.3.php"
          php -l "$EVID/repair-v2.36.3.php" >/dev/null
          grep -F "public const SOURCE_VERSION='2.36.2';" "$EVID/repair-v2.36.3.php" >/dev/null
          grep -F "public const TARGET_VERSION='2.36.3';" "$EVID/repair-v2.36.3.php" >/dev/null
          php "$EVID/repair-v2.36.3.php" --self-test | tee "$EVID/atomic-self-test.json" | jq -e '.ok==true and .global_barrier==true and .interruption_recovery==true' >/dev/null
          test "$(git -C updates rev-parse HEAD)" = "$CORE_LIVE"
          test "$(gh api repos/llhzx2018/core-updates/branches/main --jq .commit.sha)" = "$CORE_LIVE"
          jq -e '.current_version=="2.36.2" and .target_version=="2.36.3" and .from_versions==["2.36.2"] and .release_tag=="v2.36.3" and .release_id==380449563 and .product_identity=="718e043e3715ef7b21849bc08634fca89bf92c1f" and .asset_name=="VF_Start_V2.36.3_UPDATE.zip" and .asset_bytes==1236976 and .asset_sha256=="7110d0e232ce7dec521b4e76148441d06376a02124249d68237b774f2d33447d"' updates/projects/P01.json >/dev/null
          gh api -H 'Accept: application/vnd.github.raw+json' 'repos/llhzx2018/core-updates/contents/projects/P01.json?ref=main' > "$EVID/api-P01.json"
          jq -e '.current_version=="2.36.2" and .target_version=="2.36.3" and .from_versions==["2.36.2"] and .release_tag=="v2.36.3" and .release_id==380449563 and .product_identity=="718e043e3715ef7b21849bc08634fca89bf92c1f" and .asset_name=="VF_Start_V2.36.3_UPDATE.zip" and .asset_bytes==1236976 and .asset_sha256=="7110d0e232ce7dec521b4e76148441d06376a02124249d68237b774f2d33447d"' "$EVID/api-P01.json" >/dev/null
          for run in 33501907010 33502414744 33502799058 33503664704 33504020301 33504341771 33504575042 33504635827; do test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$run --jq .conclusion)" = success; done
          test "$(gh api repos/llhzx2018/core-free-runner-public/branches/main --jq .commit.sha)" = e569c491506e2a367d01a18cfa89a234a22abb79
          printf 'P01_V2363_REMOTE_RELEASE_TRUTH_R2=PASS\nPUBLISHED_LATEST=2.36.3\nRELEASE_ID=380449563\nFORMAL_SOURCE=%s\nPRODUCT_MAIN=%s\nFORMAL_TREE=%s\nRUNTIME_TREE=%s\nCORE_UPDATES_MAIN=%s\nLIVE_ONLINE_FROM=2.36.2\nLIVE_ONLINE_NEXT_HOP=2.36.3\nUPDATE_BYTES=%s\nUPDATE_SHA256=%s\nMANIFEST_TRANSPORT=AUTHENTICATED_GITHUB_CONTENTS_API\nR1_CLASSIFICATION=HARNESS_ONLY_ANONYMOUS_RAW_PRIVATE_REPO\nRUNNER_MAIN_UNCHANGED=YES\nOWNER_PRODUCTION_WRITE=NO\nOWNER_ACTION=ONLINE_UPDATE_FROM_2.36.2_TO_2.36.3\n' "$FORMAL" "$MAIN" "$FORMAL_TREE" "$RUNTIME_TREE" "$CORE_LIVE" "$ASSET_BYTES" "$ASSET_SHA256" | tee "$EVID/verdict.txt"
      - name: Upload remote truth R2 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2363-remote-release-truth-r2-${{ github.run_id }}
          path: ${{ env.EVID }}
          if-no-files-found: error
          retention-days: 90
