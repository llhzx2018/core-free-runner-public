name: P08 PR99 exact final onefile official v015 to v016 release hard gates
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p08-v016-legacy-bridge-3db.yml
      - scripts/p08_pr99_onefile_package.py
      - scripts/p08_pr99_13_domain_gate.py
      - scripts/p08_v015_empty_maintenance_official.sh
permissions:
  contents: read
jobs:
  native-real-full-three-db:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'release/p08-pr99-onefile-final-proof-20261122'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: mysql
            scenario: maintenance
            image: mysql:8.4
            health: mysqladmin ping --silent
    services:
      db:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: p08-v016-only-synthetic
          MYSQL_ROOT_HOST: '%'
          MARIADB_ROOT_PASSWORD: p08-v016-only-synthetic
          MARIADB_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=10s
          --health-timeout=6s
          --health-retries=20
    env:
      P08_ISOLATED_INSTALL_TEST: 'YES'
      CI: 'true'
      P08_TEST_DB_DRIVER: ${{ matrix.kind }}
      P08_TEST_DB_HOST: 127.0.0.1
      P08_TEST_DB_USER: root
      P08_TEST_DB_PASSWORD: p08-v016-only-synthetic
      P08_TEST_DB_CLEAN: p08_ci_016_clean
      P08_TEST_DB_DIRTY: p08_ci_016_dirty
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout temporary public-safe Runner harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact private P08 candidate without persisted credential
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 349f4c0d46a8350c18cb36b6c8b0c60d2c096c6b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
      - name: Checkout newly effective GOV-DOC release mode X source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: e57edc475b44df7d682c857703dabc3d75fc8193
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov
      - name: Install native PHP8.4 Composer and Node22
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: zip,curl,mbstring,pdo_mysql,pdo_sqlite,sqlite3,openssl,posix,dom,intl,fileinfo,bcmath
          coverage: none
      - name: Node 22 build toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Native SQL client and disposable empty and dirty fixtures
        if: matrix.kind != 'sqlite'
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 420 sudo apt-get -qq update
          timeout 420 sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y mariadb-client
          mariadb -h127.0.0.1 -uroot -p"$P08_TEST_DB_PASSWORD" -e 'CREATE DATABASE p08_ci_016_clean; CREATE DATABASE p08_ci_016_dirty; CREATE TABLE p08_ci_016_dirty.synthetic_dirty(id integer primary key);'
      - name: Exact candidate source fail-closed version and media regression
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(id -u)" -ne 0
          test "$(git -C target rev-parse HEAD)" = 349f4c0d46a8350c18cb36b6c8b0c60d2c096c6b
          test "$(cat target/VERSION)" = 0.1.16
          test "$(git -C gov rev-parse HEAD)" = e57edc475b44df7d682c857703dabc3d75fc8193
          grep -Fq '| skill-release | V3.26 |' gov/CURRENT.md
          php -l target/src/Upgrade/LegacyMediaUpgradeBridgeCli.php
          php target/tests/test_atomic_upgrade_arm.php
          ( cd target
            # Earlier exact functional source passed the full dev_check.
            # This revision only adds isolated diagnostic output; run scoped tests.
            php -l src/Upgrade/LegacyMediaUpgradeBridgeCli.php
            php tests/test_recovery_landing_assets_snapshot.php
            php tests/test_atomic_upgrade_arm.php
            php tests/test_atomic_release_materializer.php
          )
          echo P08_V016_LEGACY_SOURCE_REGRESSION=PASS
      - name: Final extracted one-file ZIP genuine original v015 to original immutable v016 MySQL proof
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          bash scripts/p08_v015_empty_maintenance_official.sh
      - name: Verify all 13 domains, original real HTTPS evidence, source and safe online channel
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          python3 -B scripts/p08_pr99_13_domain_gate.py
      - name: Always erase private source, DB fixtures and generated packages
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          site="$RUNNER_TEMP/p08-v016-legacy-oldsite-${{ matrix.kind }}"
          scope="$(printf '%s' "$site" | sha256sum | cut -c1-16)"
          [[ "$scope" =~ ^[a-f0-9]{16}$ ]]
          scratch="$HOME/.p08-v016-legacy-media-bridge-$scope"
          rm -rf -- "$scratch" "$HOME/.p08-v015-empty-media-once"
          rm -rf -- "$RUNNER_TEMP/p08-v016-official-maintenance"
          rm -rf -- target gov "$RUNNER_TEMP/p08-v016-legacy-full-${{ matrix.kind }}" "$RUNNER_TEMP/p08-v016-legacy-site-${{ matrix.kind }}" "$RUNNER_TEMP/p08-v016-legacy-issued-${{ matrix.kind }}" "$RUNNER_TEMP/p08-v016-legacy-oldsite-${{ matrix.kind }}"
          test ! -e target && test ! -e gov
          echo "P08_V016_LEGACY_PRIVATE_CLEANUP_${{ matrix.kind }}=PASS"
