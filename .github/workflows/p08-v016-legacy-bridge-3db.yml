name: P08 v016 legacy media bridge native FULL 3DB development
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p08-v016-legacy-bridge-3db.yml
permissions:
  contents: read
jobs:
  native-real-full-three-db:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-v016-legacy-bridge-3db-20261121'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: mysql
            image: mysql:8.4
            health: mysqladmin ping --silent
          - kind: mariadb
            image: mariadb:11.8
            health: healthcheck.sh --connect --innodb_initialized
    services:
      db:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: p08-v016-only-synthetic
          MYSQL_ROOT_HOST: '%'
          MARIADB_ROOT_PASSWORD: p08-v016-only-synthetic
          MARIADB_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=10s
          --health-timeout=6s
          --health-retries=20
    env:
      P08_ISOLATED_INSTALL_TEST: 'YES'
      CI: 'true'
      P08_TEST_DB_DRIVER: ${{ matrix.kind }}
      P08_TEST_DB_HOST: 127.0.0.1
      P08_TEST_DB_USER: root
      P08_TEST_DB_PASSWORD: p08-v016-only-synthetic
      P08_TEST_DB_CLEAN: p08_ci_016_clean
      P08_TEST_DB_DIRTY: p08_ci_016_dirty
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout temporary public-safe Runner harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact private P08 candidate without persisted credential
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: fe99c4bcdbe8075824072ebf092c66d2ea55247c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
      - name: Checkout newly effective GOV-DOC release mode X source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 677258196998c2e2b9f39b2aca54fc9d7fbddafe
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov
      - name: Install native PHP8.4 Composer and Node22
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: zip,curl,mbstring,pdo_mysql,pdo_sqlite,sqlite3,openssl,posix,dom,intl,fileinfo,bcmath
          coverage: none
      - name: Node 22 build toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Native SQL client and disposable empty and dirty fixtures
        if: matrix.kind != 'sqlite'
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 420 sudo apt-get -qq update
          timeout 420 sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y mariadb-client
          mariadb -h127.0.0.1 -uroot -p"$P08_TEST_DB_PASSWORD" -e 'CREATE DATABASE p08_ci_016_clean; CREATE DATABASE p08_ci_016_dirty; CREATE TABLE p08_ci_016_dirty.synthetic_dirty(id integer primary key);'
      - name: Exact candidate source fail-closed version and media regression
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(id -u)" -ne 0
          test "$(git -C target rev-parse HEAD)" = fe99c4bcdbe8075824072ebf092c66d2ea55247c
          test "$(cat target/VERSION)" = 0.1.16
          test "$(git -C gov rev-parse HEAD)" = 677258196998c2e2b9f39b2aca54fc9d7fbddafe
          grep -Fq '| skill-release | V3.23 |' gov/CURRENT.md
          php -l target/src/Upgrade/LegacyMediaUpgradeBridgeCli.php
          php target/tests/test_atomic_upgrade_arm.php
          ( cd target
            # Earlier exact functional source passed the full dev_check.
            # This revision only adds isolated diagnostic output; run scoped tests.
            php -l src/Upgrade/LegacyMediaUpgradeBridgeCli.php
            php tests/test_recovery_landing_assets_snapshot.php
            php tests/test_atomic_upgrade_arm.php
            php tests/test_atomic_release_materializer.php
          )
          echo P08_V016_LEGACY_SOURCE_REGRESSION=PASS
      - name: Build two source-bound deterministic real FULL ZIPs
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          npm ci --prefix target --ignore-scripts --no-fund --no-audit
          npm run build --prefix target
          composer --working-dir=target install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress --optimize-autoloader
          python3 -B target/scripts/check_stack_contract.py --phase full --root target
          (cd target && git diff --exit-code && test -z "$(git status --porcelain --untracked-files=all)")
          tmp="$RUNNER_TEMP/p08-v016-legacy-full-${{ matrix.kind }}"
          site="$RUNNER_TEMP/p08-v016-legacy-site-${{ matrix.kind }}"
          mkdir -m 700 "$tmp" "$site"
          python3 -B target/scripts/build_full.py --source "$GITHUB_WORKSPACE/target" --output "$tmp/full-first.zip" --version 0.1.16 --source-sha fe99c4bcdbe8075824072ebf092c66d2ea55247c --governance-root "$GITHUB_WORKSPACE/gov"
          unzip -tqq "$tmp/full-first.zip"
          unzip -q "$tmp/full-first.zip" -d "$site"
          test ! -f "$site/.env"
          test "$(cat "$site/VERSION")" = 0.1.16
          echo "P08_V016_LEGACY_REAL_FULL_DOUBLE_BUILD_${{ matrix.kind }}=PASS"
          test -f "$site/src/Upgrade/LegacyMediaUpgradeBridgeCli.php"
          echo "P08_V016_LEGACY_EXTRACTED_REAL_FULL_FOR_OLD_ATOMIC_${{ matrix.kind }}=PASS"
      - name: Genuine issued v015 old PHP + 3DB media bridge audit and auth refusal
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          bash scripts/p08_v016_legacy_old_issued_audit.sh "${{ matrix.kind }}"
      - name: Always erase private source, DB fixtures and generated packages
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          site="$RUNNER_TEMP/p08-v016-legacy-oldsite-${{ matrix.kind }}"
          scope="$(printf '%s' "$site" | sha256sum | cut -c1-16)"
          [[ "$scope" =~ ^[a-f0-9]{16}$ ]]
          scratch="$HOME/.p08-v016-legacy-media-bridge-$scope"
          rm -rf -- "$scratch"
          rm -rf -- target gov "$RUNNER_TEMP/p08-v016-legacy-full-${{ matrix.kind }}" "$RUNNER_TEMP/p08-v016-legacy-site-${{ matrix.kind }}" "$RUNNER_TEMP/p08-v016-legacy-issued-${{ matrix.kind }}" "$RUNNER_TEMP/p08-v016-legacy-oldsite-${{ matrix.kind }}"
          test ! -e target && test ! -e gov
          echo "P08_V016_LEGACY_PRIVATE_CLEANUP_${{ matrix.kind }}=PASS"
