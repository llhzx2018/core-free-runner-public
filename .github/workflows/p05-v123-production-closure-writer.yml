name: P05 V1.2.3 Production Closure Writer

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/p05-v123-production-closure-writer.yml'
      - 'scripts/p05-v123-production-closure-writer.py'

permissions:
  contents: read

jobs:
  write:
    if: github.head_ref == 'write/p05-v123-production-closure-20260902'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify private write capability
        shell: bash
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$WRITE_TOKEN"
          echo 'P05_CLOSURE_WRITE_CAPABILITY=PASS'

      - name: Checkout disposable writer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact P05 closure branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          repository: llhzx2018/vf-seo
          ref: closure/p05-v123-production-20260902
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 1
          path: p05

      - name: Bind exact release main base
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p05 rev-parse HEAD)" = '66a56dafdfba2ca7243d1984791ecbe0fd7382ae'
          test "$(cat p05/VERSION)" = '1.2.3'
          test -f p05/docs/authority/RELEASE_V1.2.2_PRODUCTION_CLOSURE.md
          BEFORE="$(sha256sum p05/docs/authority/RELEASE_V1.2.2_PRODUCTION_CLOSURE.md | awk '{print $1}')"
          echo "V122_CLOSURE_BEFORE=$BEFORE" >> "$GITHUB_ENV"
          echo 'P05_CLOSURE_BASE=PASS'

      - name: Generate five-file Production Closure candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/p05-v123-production-closure-writer.py
          git -C p05 diff --check
          test "$(sha256sum p05/docs/authority/RELEASE_V1.2.2_PRODUCTION_CLOSURE.md | awk '{print $1}')" = "$V122_CLOSURE_BEFORE"
          mapfile -t changed < <(git -C p05 status --porcelain | sed -E 's/^.. //' | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 5
          expected=(
            'CHANGELOG.md'
            'README.md'
            'VF_PROJECT.json'
            'docs/authority/RELEASE_V1.2.3_PRODUCTION_CLOSURE.md'
            'docs/handoff/CURRENT_STATE.md'
          )
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done
          test "$(cat p05/VERSION)" = '1.2.3'
          grep -q 'Production: v1.2.3' p05/docs/handoff/CURRENT_STATE.md
          grep -q '33562813196 / 100039050036' p05/docs/handoff/CURRENT_STATE.md
          grep -q 'OWNER_OBSERVED / SCREENSHOT_VERIFIED + MACHINE_RUNTIME_READBACK_PASS' p05/docs/authority/RELEASE_V1.2.3_PRODUCTION_CLOSURE.md
          grep -q 'Legacy Update Bridge' p05/docs/authority/RELEASE_V1.2.3_PRODUCTION_CLOSURE.md
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('p05/VF_PROJECT.json').read_text())
          assert p['version']=='1.2.3' and p['production_version']=='1.2.3'
          assert p['formal_release']=='v1.2.3'
          assert p['deployment_readiness']=='V1.2.3_PRODUCTION_CLOSED'
          assert p['v1_2_3_production_closure']['production_readback']['version']=='1.2.3'
          assert p['v1_2_3_production_closure']['production_readback']['run']==33562813196
          assert p['authority']['release']=='docs/authority/RELEASE_V1.2.3_PRODUCTION_CLOSURE.md'
          PY
          echo 'P05_CLOSURE_SCOPE_AND_CONTENT=PASS'

      - name: Commit and push private closure candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C p05 config user.name 'VictorForge'
          git -C p05 config user.email 'llhzx2018@gmail.com'
          git -C p05 add VF_PROJECT.json README.md CHANGELOG.md docs/handoff/CURRENT_STATE.md docs/authority/RELEASE_V1.2.3_PRODUCTION_CLOSURE.md
          git -C p05 commit -m 'docs(P05): close v1.2.3 Production'
          git -C p05 push origin HEAD:closure/p05-v123-production-20260902
          echo "P05_CLOSURE_CANDIDATE_SHA=$(git -C p05 rev-parse HEAD)"
          echo "P05_CLOSURE_CANDIDATE_TREE=$(git -C p05 rev-parse HEAD^{tree})"
          echo 'P05_CLOSURE_PRODUCT_CODE_WRITE=0'
          echo 'P05_CLOSURE_TAG_WRITE=0'
          echo 'P05_CLOSURE_PRODUCTION_WRITE=0'
