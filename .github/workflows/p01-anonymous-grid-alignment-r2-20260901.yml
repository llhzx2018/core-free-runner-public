name: P01 Anonymous Grid Alignment Fix Gate R2
on:
  push:
    branches:
      - tmp/p01-anonymous-grid-alignment-20260901
    paths:
      - .github/workflows/p01-anonymous-grid-alignment-r2-20260901.yml
permissions:
  contents: read
  actions: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE: c7a1c6e9ab6321ec07bc00a3e778661faaefb4ae
      PRODUCT_BRANCH: product/p01-anonymous-grid-alignment-20260901
      PORT: '18631'
      ADMIN_PASS: P01AnonymousGridAlignmentGate
      EVID: /tmp/p01-anonymous-grid-evidence
    steps:
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Checkout exact runner harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: ${{ github.sha }}
          path: runner
      - name: Checkout exact product branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: product/p01-anonymous-grid-alignment-20260901
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Apply exact one-file correction
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$BASE"
          test "$(git -C product ls-remote origin refs/heads/develop | awk '{print $1}')" = "$BASE"
          python runner/scripts/p01_anonymous_grid_prepare.py product
          test "$(git -C product diff --name-only)" = "src/assets/workspace-domain-nav.css"
          git -C product config user.name VictorForge
          git -C product config user.email llhzx2018@gmail.com
          git -C product add src/assets/workspace-domain-nav.css
          git -C product commit -m 'fix(P01): align anonymous resource grids'
          CANDIDATE=$(git -C product rev-parse HEAD)
          test "$(git -C product rev-parse HEAD^)" = "$BASE"
          test "$(git -C product diff --name-only "$BASE"..HEAD)" = "src/assets/workspace-domain-nav.css"
          git -C product push origin HEAD:"$PRODUCT_BRANCH"
          echo "CANDIDATE=$CANDIDATE" >> "$GITHUB_ENV"
      - name: Exact-source and syntax gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$CANDIDATE"
          test "$(git -C product rev-parse HEAD^)" = "$BASE"
          test "$(git -C product diff --name-only "$BASE"..HEAD)" = "src/assets/workspace-domain-nav.css"
          test "$(git -C product ls-remote origin refs/heads/$PRODUCT_BRANCH | awk '{print $1}')" = "$CANDIDATE"
          test "$(git -C product ls-remote origin refs/heads/develop | awk '{print $1}')" = "$BASE"
          grep -F 'vf-asset-row:not(:has(> .vf-asset-select))' product/src/assets/workspace-domain-nav.css >/dev/null
          grep -F 'vf-asset-card:not(:has(> .vf-asset-select))' product/src/assets/workspace-domain-nav.css >/dev/null
          find product/src -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/p01-anonymous-grid-php.txt
      - name: Fresh install and seed
        shell: bash
        run: bash runner/scripts/p01_anonymous_grid_setup.sh
      - name: Install browser harness
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet playwright==1.55.0
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v google-chrome-stable >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1; then python -m playwright install chromium; fi
          python -m py_compile runner/scripts/p01_anonymous_grid_gate.py
      - name: Anonymous vs authenticated browser gate
        shell: bash
        run: |
          set -Eeuo pipefail
          python runner/scripts/p01_anonymous_grid_gate.py | tee "$EVID/browser.txt"
          grep -Fx P01_ANONYMOUS_GRID_BROWSER=PASS "$EVID/browser.txt"
      - name: Final verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$CANDIDATE"
          test "$(git -C product diff --name-only "$BASE"..HEAD)" = "src/assets/workspace-domain-nav.css"
          test "$(git -C product ls-remote origin refs/heads/develop | awk '{print $1}')" = "$BASE"
          printf 'P01_ANONYMOUS_GRID_ALIGNMENT=PASS\nBASE=%s\nCANDIDATE=%s\nSCOPE=src/assets/workspace-domain-nav.css\nWIDTHS=390,1319,1440\nANONYMOUS_START_LIST=PASS\nANONYMOUS_START_CARDS=PASS\nANONYMOUS_CHANNELS=PASS\nAUTHENTICATED_GRID=PASS\nLOGOUT_RECHECK=PASS\nWATCH_TOPICS_OVERFLOW=PASS\nSQLITE=PASS\nMAIN_WRITE=NO\nPRODUCTION_WRITE=NO\n' "$BASE" "$CANDIDATE" | tee "$EVID/verdict.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-anonymous-grid-alignment-r2-${{ github.run_id }}
          path: /tmp/p01-anonymous-grid-evidence
          if-no-files-found: error
          retention-days: 90
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/p01-anonymous-grid.pid 2>/dev/null)" 2>/dev/null || true
