name: TEMP P08 R43 source-preserving six-DDL native shadow + kill/recovery
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p08-r43-native-shadow-six-ddl-sigkill-20261124.yml'
permissions:
  contents: read
concurrency:
  group: p08-r43-schema-archive-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  TARGET_REPO: llhzx2018/vf-adops
  TARGET_VERSION: '0.1.18'
  TARGET_SHA: 3fe0acb3eed6bf8171246bb82e5e963c0e292345
  BRIDGE_VERSION: '0.1.17'
  BRIDGE_SHA: 22b8eb1deb5d6e857141ef6c9aa81719e75f65cb
jobs:
  identity-preflight:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/p08-r43-native-shadow-six-ddl-sigkill-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 scripts/ephemeral_lane_spec.py audit-rendered --spec specs/ephemeral/p08-r43-native-shadow-six-ddl-sigkill-20261124.json --input .github/workflows/temp-p08-r43-native-shadow-six-ddl-sigkill-20261124.yml
  native-shadow-migration:
    needs: identity-preflight
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/p08-r43-native-shadow-six-ddl-sigkill-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        engine: [mysql, mariadb]
    services:
      db:
        image: ${{ matrix.engine == 'mysql' && 'mysql:8.4' || 'mariadb:11.8' }}
        env:
          MYSQL_ROOT_PASSWORD: isolated-p08-r43-native-db
          MYSQL_ROOT_HOST: '%'
          MARIADB_ROOT_PASSWORD: isolated-p08-r43-native-db
          MARIADB_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="sh -c 'mariadb-admin ping --silent || mysqladmin ping --silent'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=25
    env:
      GITHUB_ACTIONS: 'true'
      P08_ISOLATED_INSTALL_TEST: 'YES'
      P08_R43_DISPOSABLE_SCHEMA: 'YES'
      P08_R43_NATIVE_ENGINE: ${{ matrix.engine }}
      P08_R43_NATIVE_DB_PASSWORD: isolated-p08-r43-native-db
    steps:
      - name: Checkout exact v017 bridge candidate (private transient checkout)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.BRIDGE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-p08-bridge
      - name: Checkout exact v018 integrated target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-p08-target
      - name: Checkout current GOV-doc delivery contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: gov-proof
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_mysql, pdo_sqlite, sqlite3, zip, mbstring, intl, bcmath, dom, fileinfo, posix
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native SQL backup client on disposable runner
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          if command -v mysqldump >/dev/null && command -v mysql >/dev/null; then
            echo P08_R43_NATIVE_PREINSTALLED_MYSQL_CLIENT=PASS
          elif command -v mariadb-dump >/dev/null && command -v mariadb >/dev/null; then
            echo P08_R43_NATIVE_PREINSTALLED_MARIADB_CLIENT=PASS
          else
            timeout 75s sudo apt-get -o Acquire::Retries=0 update -qq > "$RUNNER_TEMP/p08-r43-apt.log" 2>&1 || { echo P08_R43_NATIVE_CLIENT_APT_NETWORK=BLOCKED; exit 1; }
            timeout 85s sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mariadb-client >> "$RUNNER_TEMP/p08-r43-apt.log" 2>&1 || { echo P08_R43_NATIVE_CLIENT_INSTALL=FAIL; exit 1; }
          fi
          (command -v mariadb-dump || command -v mysqldump) >/dev/null || { echo P08_R43_NATIVE_DUMP_CLIENT_MISSING; exit 1; }
          (command -v mariadb || command -v mysql) >/dev/null || { echo P08_R43_NATIVE_RESTORE_CLIENT_MISSING; exit 1; }
          echo P08_R43_NATIVE_BACKUP_CLIENT_PRESENT=PASS
      - name: Exact source, vendor and Vite build + real source-locked dev Clean FULL archives
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C private-p08-bridge rev-parse HEAD)" = "$BRIDGE_SHA"
          test "$(git -C private-p08-target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(cat private-p08-bridge/VERSION)" = "$BRIDGE_VERSION"
          test "$(cat private-p08-target/VERSION)" = "$TARGET_VERSION"
          php -l private-p08-bridge/tests/compatibility/r43_isolated_installed_native_transaction.php > "$RUNNER_TEMP/p08-r43-native-lint.log" 2>&1 || { echo P08_R43_NATIVE_DRIVER_TEST_SYNTAX=FAIL; exit 1; }
          php -l private-p08-bridge/src/Upgrade/R43IsolatedSchemaTransaction.php >> "$RUNNER_TEMP/p08-r43-native-lint.log" 2>&1 || { echo P08_R43_NATIVE_TRANSACTION_SYNTAX=FAIL; exit 1; }
          for d in private-p08-bridge private-p08-target; do
            mkdir -p "$d/bootstrap/cache" "$d/storage/framework/cache/data" "$d/storage/framework/sessions" "$d/storage/framework/views" "$d/storage/logs"
            (cd "$d" && composer install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/p08-r43-$d-composer.log" 2>&1) || { echo P08_R43_NATIVE_LOCKED_COMPOSER=FAIL; exit 1; }
            (cd "$d" && npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-r43-$d-npm.log" 2>&1 && npm run build > "$RUNNER_TEMP/p08-r43-$d-vite.log" 2>&1) || { echo P08_R43_NATIVE_LOCKED_VITE=FAIL; exit 1; }
          done
          python3 private-p08-bridge/scripts/build_full.py --source private-p08-bridge --output "$RUNNER_TEMP/p08-r43-bridge.zip" --version "$BRIDGE_VERSION" --source-sha "$BRIDGE_SHA" --governance-root gov-proof > "$RUNNER_TEMP/p08-r43-bridge-builder.log" 2>&1 || { echo P08_R43_NATIVE_BRIDGE_FULL=FAIL; exit 1; }
          python3 private-p08-target/scripts/build_full.py --source private-p08-target --output "$RUNNER_TEMP/p08-r43-target.zip" --version "$TARGET_VERSION" --source-sha "$TARGET_SHA" --governance-root gov-proof > "$RUNNER_TEMP/p08-r43-target-builder.log" 2>&1 || { echo P08_R43_NATIVE_TARGET_FULL=FAIL; exit 1; }
          mkdir -m 700 "$RUNNER_TEMP/p08-r43-target-extract"
          unzip -q "$RUNNER_TEMP/p08-r43-target.zip" -d "$RUNNER_TEMP/p08-r43-target-extract"
          echo P08_R43_NATIVE_TWO_CANONICAL_DEV_FULLS=PASS
      - name: Create only four isolated synthetic DBs and two real installed native Owners
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          php -r '$p=new PDO("mysql:host=127.0.0.1;port=3306","root",getenv("P08_R43_NATIVE_DB_PASSWORD"),[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);foreach(["native","shadow"] as $kind)foreach(["success","kill"] as $case){$n="p08_ci_r43_".$kind."_".$case;$p->exec("CREATE DATABASE ".$n." CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci");}' > "$RUNNER_TEMP/p08-r43-create-shadow-db.log" 2>&1 || { echo P08_R43_SHADOW_DB_CREATE=FAIL; exit 1; }
          t="private-p08-bridge/tests/compatibility/r43_isolated_installed_native_transaction.php"
          php -l private-p08-bridge/src/Upgrade/R43NativeShadowSchemaStage.php > "$RUNNER_TEMP/p08-r43-shadow-php-lint.log" 2>&1 || { echo P08_R43_SHADOW_CLASS_PHP_LINT=FAIL; exit 1; }
          php -l private-p08-bridge/tests/compatibility/r43_native_shadow_schema_stage.php >> "$RUNNER_TEMP/p08-r43-shadow-php-lint.log" 2>&1 || { echo P08_R43_SHADOW_DRIVER_PHP_LINT=FAIL; exit 1; }
          for mode in success kill; do
            site="$RUNNER_TEMP/p08-r43-site-$P08_R43_NATIVE_ENGINE-$mode"
            mkdir -m 700 "$site"
            unzip -q "$RUNNER_TEMP/p08-r43-bridge.zip" -d "$site"
            php "$t" setup "$site" "$RUNNER_TEMP/p08-r43-target-extract" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/p08-r43-native-installed-$mode.log" 2>&1 || { echo "P08_R43_SHADOW_REAL_OWNER_INSTALL=FAIL_$mode"; exit 1; }
            grep -qx 'P08_R43_NATIVE_REAL_FULL_017_OWNER_FIRST_INSTALL=PASS' "$RUNNER_TEMP/p08-r43-native-installed-$mode.log"
            grep -qx 'P08_R43_NATIVE_NONEMPTY_LANDING_ASSET_AUTOMATION_SEEDED=PASS' "$RUNNER_TEMP/p08-r43-native-installed-$mode.log"
          done
          echo "P08_R43_SHADOW_REAL_TWO_NONEMPTY_OWNER_INSTALLS=PASS engine=$P08_R43_NATIVE_ENGINE"
      - name: Genuine 6 DDL only on restored shadow; outsider source divergence refuses cutover
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          t="private-p08-bridge/tests/compatibility/r43_native_shadow_schema_stage.php"
          site="$RUNNER_TEMP/p08-r43-site-$P08_R43_NATIVE_ENGINE-success"
          export P08_R43_SHADOW_SCENARIO=success
          if ! php "$t" stage "$site" "$RUNNER_TEMP/p08-r43-target-extract" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/p08-r43-shadow-success.log" 2>&1; then
            echo P08_R43_NATIVE_SHADOW_STAGE=FAIL
            grep -E '^P08_R43_NATIVE_SHADOW_[A-Z0-9_]+=PASS$' "$RUNNER_TEMP/p08-r43-shadow-success.log" | tail -12 || true
            code="$(grep -oE 'R43_[A-Z][A-Z0-9_]+' "$RUNNER_TEMP/p08-r43-shadow-success.log" | tail -1 || true)"
            if [[ "$code" =~ ^R43_[A-Z][A-Z0-9_]+$ ]]; then echo "P08_R43_SAFE_ERROR=$code"; else echo P08_R43_SAFE_ERROR=UNCLASSIFIED; fi
            exit 1
          fi
          grep -qx 'P08_R43_NATIVE_SHADOW_SUCCESS_NO_SOURCE_WRITE=PASS' "$RUNNER_TEMP/p08-r43-shadow-success.log"
          php "$t" verify "$site" "$RUNNER_TEMP/p08-r43-target-extract" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/p08-r43-shadow-verify.log" 2>&1 || { echo P08_R43_SHADOW_NEW_PROCESS_VERIFY=FAIL; exit 1; }
          grep -qx 'P08_R43_NATIVE_SHADOW_FRESH_PROCESS_success_READ_ONLY=PASS' "$RUNNER_TEMP/p08-r43-shadow-verify.log"
          php "$t" external-write "$site" "$RUNNER_TEMP/p08-r43-target-extract" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/p08-r43-shadow-unmanaged.log" 2>&1 || { echo P08_R43_SHADOW_NATIVE_EXTERNAL_WRITE=FAIL; exit 1; }
          php "$t" verify-diverged "$site" "$RUNNER_TEMP/p08-r43-target-extract" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/p08-r43-shadow-diverged.log" 2>&1 || { echo P08_R43_SHADOW_SOURCE_DIVERGENCE_NOT_BLOCKED; exit 1; }
          grep -qx 'P08_R43_NATIVE_SHADOW_NO_AUTOCUTOVER_AFTER_SOURCE_DIVERGENCE=PASS' "$RUNNER_TEMP/p08-r43-shadow-diverged.log"
          echo "P08_R43_NATIVE_SHADOW_SIX_DDL_AND_SOURCE_DIVERGENCE=PASS engine=$P08_R43_NATIVE_ENGINE"
      - name: Actual SIGKILL137 after third real native shadow DDL and fresh process source readback
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          t="private-p08-bridge/tests/compatibility/r43_native_shadow_schema_stage.php"
          site="$RUNNER_TEMP/p08-r43-site-$P08_R43_NATIVE_ENGINE-kill"
          export P08_R43_SHADOW_SCENARIO=kill
          set +e
          php "$t" stage "$site" "$RUNNER_TEMP/p08-r43-target-extract" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/p08-r43-shadow-kill.log" 2>&1
          result=$?
          set -e
          if [[ "$result" != 137 ]]; then echo "P08_R43_NATIVE_SHADOW_SIGKILL_EXIT_NOT_137=$result"; exit 1; fi
          grep -qx 'P08_R43_SHADOW_THREE_NATIVE_DDL_COMMITTED_BEFORE_SIGKILL=PASS' "$RUNNER_TEMP/p08-r43-shadow-kill.log"
          php "$t" verify "$site" "$RUNNER_TEMP/p08-r43-target-extract" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/p08-r43-shadow-newprocess.log" 2>&1 || { echo P08_R43_SHADOW_RECOVERY_NEWPROCESS=FAIL; exit 1; }
          grep -qx 'P08_R43_NATIVE_SHADOW_REAL_SIGKILL_THIRD_DDL_PARTIAL_SHADOW_OLD_DB_STILL_INTACT=PASS' "$RUNNER_TEMP/p08-r43-shadow-newprocess.log"
          grep -qx 'P08_R43_NATIVE_SHADOW_FRESH_PROCESS_kill_READ_ONLY=PASS' "$RUNNER_TEMP/p08-r43-shadow-newprocess.log"
          test "$(readlink "$site/current")" = "releases/$BRIDGE_SHA"
          echo "P08_R43_NATIVE_SHADOW_REAL_SIGKILL137_OLD_DB_PRESERVED=PASS engine=$P08_R43_NATIVE_ENGINE"
          echo P08_R43_SHADOW_PRODUCTION_SCHEMA_CUTOVER=BLOCKED
      - name: Clean synthetic SQL copies, private snapshots and source
        if: always()
        shell: bash
        run: |
          set +e
          set +x
          php -r '$p=new PDO("mysql:host=127.0.0.1;port=3306","root",getenv("P08_R43_NATIVE_DB_PASSWORD"),[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);foreach(["native","shadow"] as $kind)foreach(["success","kill"] as $mode){$p->exec("DROP DATABASE IF EXISTS p08_ci_r43_".$kind."_".$mode);}' > "$RUNNER_TEMP/p08-r43-shadow-clean-db.log" 2>&1
          rm -rf -- private-p08-bridge private-p08-target gov-proof
          rm -rf -- "$RUNNER_TEMP/p08-r43-site-$P08_R43_NATIVE_ENGINE-success" "$RUNNER_TEMP/p08-r43-site-$P08_R43_NATIVE_ENGINE-kill" "$RUNNER_TEMP/p08-r43-target-extract"
          rm -f -- "$RUNNER_TEMP"/p08-r43-*.zip "$RUNNER_TEMP"/p08-r43-*.log
          if test ! -e private-p08-bridge && test ! -e private-p08-target && test ! -e gov-proof && test ! -e "$RUNNER_TEMP/p08-r43-site-$P08_R43_NATIVE_ENGINE-success" && test ! -e "$RUNNER_TEMP/p08-r43-site-$P08_R43_NATIVE_ENGINE-kill"; then
            echo P08_R43_PRIVATE_SOURCE_AND_SYNTHETIC_SHADOW_DB_CLEANUP=PASS
          else
            echo P08_R43_SHADOW_CLEANUP=FAIL
            exit 1
          fi
