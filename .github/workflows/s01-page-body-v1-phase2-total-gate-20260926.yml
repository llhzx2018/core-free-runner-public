name: S01 Page Body V1 Phase 2 Total Gate

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/s01-page-body-v1-phase2-total-gate-20260926.yml'

permissions:
  contents: read

jobs:
  gate:
    if: github.head_ref == 'task/s01-page-body-v1-phase2-total-gate-20260926'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPS_SHA: dbbb23db87eaec4920f772484a732c88fd83fa3d
      THEME_SHA: b8de9700e7e58503c46a07a16cafa8e4e1e2b799
      M3U8_SHA: 16040c1d85f93e017b7918da6d82838b7097ed1b
    steps:
      - name: Credential presence
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: test -n "$READ_TOKEN"

      - name: Checkout exact OPS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.OPS_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: ops

      - name: Checkout exact Theme
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: ${{ env.THEME_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: theme

      - name: Checkout exact M3U8
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: ${{ env.M3U8_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: m3u8

      - name: OPS Phase 2 contracts
        working-directory: ops
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$OPS_SHA"
          for f in             tests/s01-c02-page-body-system-v1-a1-baseline-contract.php             tests/s01-c02-page-body-system-v1-a2-baseline-contract.php             tests/s01-c02-page-body-system-v1-a3-contract.php             tests/s01-c02-page-body-system-v1-a4-contract.php             tests/s01-c02-page-body-system-v1-a5-baseline-contract.php             tests/s01-c02-page-body-system-v1-a6-contract.php             tests/s01-c02-page-body-system-v1-a7-contract.php
          do
            php -l "$f"
            php "$f"
          done

      - name: Theme Phase 2 contracts
        working-directory: theme
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$THEME_SHA"
          for f in             tests/s01-c01-page-body-system-v1-a1-contract.php             tests/s01-c01-page-body-system-v1-a2-contract.php             tests/s01-c01-page-body-system-v1-a5-contract.php             tests/s01-c01-page-body-system-v1-a6-contract.php             tests/s01-c01-page-body-system-v1-a7-contract.php
          do
            php -l "$f"
            php "$f"
          done
          php tests/s01-c01-page-visual-closure-r5-contract.php
          ! grep -Eq '\.vf-v6-shell-header|\.vf-v6-domain-nav|\.vf-theme-maintenance-menu|\.vf-theme-admin-header' src/assets/css/admin/admin-s01-page-body-system-v1.css

      - name: M3U8 Phase 2 contracts
        working-directory: m3u8
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$M3U8_SHA"
          for f in             tests/s01-c03-page-body-system-v1-a1-contract.php             tests/s01-c03-page-body-system-v1-a2-contract.php             tests/s01-c03-page-body-system-v1-a3-contract.php             tests/s01-c03-page-body-system-v1-a4-contract.php             tests/s01-c03-page-body-system-v1-a5-contract.php             tests/s01-c03-page-body-system-v1-a6-contract.php             tests/s01-c03-page-body-system-v1-a7-contract.php
          do
            php -l "$f"
            php "$f"
          done
          php tests/s01-c03-page-visual-closure-r5-contract.php
          ! grep -Eq '\.vf-v6-shell-header|\.vf-v6-domain-nav|\.vf-v6-domain-menu|\.vf-m3u8-console-head|\.vf-m3u8-primary-nav' src/admin/ui-v4/admin-s01-page-body-system-v1.css

      - name: CSS balance and PHP syntax boundary
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          css_files=[
            Path('ops/assets/css/current/admin-s01-page-body-system-v1.css'),
            Path('theme/src/assets/css/admin/admin-s01-page-body-system-v1.css'),
            Path('m3u8/src/admin/ui-v4/admin-s01-page-body-system-v1.css'),
          ]
          for p in css_files:
              c=p.read_text()
              assert c.count('{')==c.count('}'), p
          print('PASS_CSS_BALANCE')
          PY
          find theme/src/inc/admin -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          find m3u8/src/admin -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
