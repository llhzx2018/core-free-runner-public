name: S01 Page Body V1 A2 Candidate Gate

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/s01-page-body-v1-a2-gate-20260926.yml'

permissions:
  contents: read

jobs:
  gate:
    if: github.head_ref == 'task/s01-page-body-v1-a2-gate-20260926'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      OPS_SHA: dd95bfb1713119d8501abebe526a82b19ea2ca45
      THEME_SHA: 6af78d3a6444424737d4254c70c3dccb155148bb
      M3U8_SHA: 151ace5890770c4606f2be24cc3334e1658615c6
    steps:
      - name: Credential presence
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: test -n "$READ_TOKEN"

      - name: Checkout exact OPS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.OPS_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: ops

      - name: Checkout exact Theme
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: ${{ env.THEME_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: theme

      - name: Checkout exact M3U8
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: ${{ env.M3U8_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: m3u8

      - name: OPS A2 baseline
        working-directory: ops
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$OPS_SHA"
          php -l tests/s01-c02-page-body-system-v1-a2-baseline-contract.php
          php tests/s01-c02-page-body-system-v1-a2-baseline-contract.php

      - name: Theme A1 + A2 contracts
        working-directory: theme
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$THEME_SHA"
          php -l src/inc/admin/views/render.php
          php -l tests/s01-c01-page-body-system-v1-a1-contract.php
          php -l tests/s01-c01-page-body-system-v1-a2-contract.php
          php tests/s01-c01-page-body-system-v1-a1-contract.php
          php tests/s01-c01-page-body-system-v1-a2-contract.php
          php tests/s01-c01-page-visual-closure-r5-contract.php
          ! grep -Eq '\.vf-v6-shell-header|\.vf-v6-domain-nav|\.vf-theme-maintenance-menu|\.vf-theme-admin-header' src/assets/css/admin/admin-s01-page-body-system-v1.css

      - name: M3U8 A1 + A2 contracts
        working-directory: m3u8
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$M3U8_SHA"
          php -l src/admin/Controller/class-v6-provider-fixtures-controller.php
          php -l tests/s01-c03-page-body-system-v1-a1-contract.php
          php -l tests/s01-c03-page-body-system-v1-a2-contract.php
          php tests/s01-c03-page-body-system-v1-a1-contract.php
          php tests/s01-c03-page-body-system-v1-a2-contract.php
          php tests/s01-c03-page-visual-closure-r5-contract.php
          grep -Fq 'data-vf-page-archetype="a2"' src/admin/Controller/class-v6-provider-fixtures-controller.php
          grep -Fq 'vf-m3u8-a2-actions' src/admin/Controller/class-v6-provider-fixtures-controller.php
          grep -Fq '</select> <button class="button">加载 exact Revision</button></form></section>' src/admin/Controller/class-v6-provider-fixtures-controller.php
          ! grep -Eq '\.vf-v6-shell-header|\.vf-v6-domain-nav|\.vf-v6-domain-menu|\.vf-m3u8-console-head|\.vf-m3u8-primary-nav' src/admin/ui-v4/admin-s01-page-body-system-v1.css

      - name: CSS balance
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for path in [
              Path('theme/src/assets/css/admin/admin-s01-page-body-system-v1.css'),
              Path('m3u8/src/admin/ui-v4/admin-s01-page-body-system-v1.css'),
          ]:
              c=path.read_text()
              assert c.count('{')==c.count('}'), path
          print('PASS_CSS_BALANCE')
          PY
