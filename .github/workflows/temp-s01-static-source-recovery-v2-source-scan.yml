name: TEMP S01 Static Source Recovery V2 Source Scan
on:
  push:
    branches: [temp/s01-c03-v12519-runtime-authority-probe-20260905]
    paths: ['.github/workflows/temp-s01-static-source-recovery-v2-source-scan.yml']
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: bd2fb0f84a39cbbbdc0c4d999397c4c7c0f82f44
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
      - name: Locate async job implementation and persistence fields
        run: |
          set -Eeuo pipefail
          echo '=== CLASS LOCATIONS ==='
          grep -RIl --exclude-dir=.git 'class VF_Ops_Release_Async_Job' . || true
          echo '=== METHOD LOCATIONS ==='
          grep -RIl --exclude-dir=.git 'create_candidate_from_inspection_v121761' . || true
          echo '=== LINEAGE/HASH FIELD LOCATIONS ==='
          grep -RIn --exclude-dir=.git -E 'promoted_from_inspection_job|source_inspection_sha256|expectedSourceSha256|source_sha256|source_package_sha256|inspection_complete|source_path|job_mode' . | head -n 400
          echo '=== JOB OPTION / TTL LOCATIONS ==='
          grep -RIn --exclude-dir=.git -E 'vf_ops_release_async_job_|retention|ttl|cleanup|expires|expiration|delete_option' . | head -n 400
          echo PASS_STATIC_SOURCE_RECOVERY_V2_SOURCE_SCAN
