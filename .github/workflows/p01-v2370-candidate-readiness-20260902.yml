name: P01 V2.37.0 Candidate Readiness
on:
  push:
    branches:
      - release/p01-v2365-candidate-20260902
    paths:
      - .github/workflows/p01-v2370-candidate-readiness-20260902.yml
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CANDIDATE: 0020ddc866f888a5d9485d3abfd3ae664a15cb7d
      CANDIDATE_TREE: 04b5833614997afe51e542720ec6e1d5e5196592
      CANDIDATE_RUNTIME_TREE: 057fbba8822950f163aa322d99b889ed3ab24842
      MAIN: 4a41d3533fe8450c3f491d5aaf28417536012ba0
      SOURCE: ef86eba16aec71c1d0dabc16ad23089a78ee5057
      SOURCE_TREE: 926504354eaf4354e852e78b19c0fde69513a133
      SOURCE_RUNTIME_TREE: a7f472ec1f449ada1152d271f2723c52e7b58144
      VERSION: 2.37.0
      SOURCE_VERSION: 2.36.5
      SCHEMA: '2026082901'
      OUT: /tmp/p01-v2370-candidate-artifacts
      EVID: /tmp/p01-v2370-candidate-evidence
      UPGRADE: /tmp/p01-v2370-upgrade
      FRESH: /tmp/p01-v2370-fresh
    steps:
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: release/p01-v2365-candidate-20260902
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 0fe72c7981f5f2b6ddd51bf4cfa5d6c014c9b0d3
          path: template
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: agent/p01-22121-formal-artifact-gate-20260819
          path: proven
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.CANDIDATE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: candidate
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.36.5
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: production
      - name: Generate fenced gates
        run: python3 runner/scripts/p01_v2370_candidate_readiness_generate.py
      - name: Exact source and V2.36.5 preservation fence
        run: bash /tmp/p01-v2370-generated/01-exact.sh
      - name: Build deterministic candidate artifacts
        run: bash /tmp/p01-v2370-generated/02-build.sh
      - name: Actual V2.36.5 to V2.37.0 Atomic upgrade
        run: bash /tmp/p01-v2370-generated/03-atomic.sh
      - name: Strict fresh candidate runtime
        run: bash /tmp/p01-v2370-generated/04-fresh.sh
      - name: Final candidate boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(cat candidate/VERSION)" = 2.37.0
          jq -e '.production_version=="2.36.5" and .published_release.version=="2.36.5" and .production_release.version=="2.36.5" and .candidate_version=="2.37.0" and .current_change.release_authorized_by_owner==true and .component_versions.browser_helper=="1.6.5"' candidate/VF_PROJECT.json >/dev/null
          printf 'P01_V2370_CANDIDATE_READINESS=PASS\nCANDIDATE=%s\nTREE=%s\nRUNTIME_TREE=%s\nPRODUCTION_FORMAL_SOURCE=%s\nPRODUCTION_MAIN_PARENT=%s\nSCHEMA=%s\nATOMIC_2365_TO_2370=PASS\nFRESH_INSTALL=PASS\nWAVE_1_13_JOURNEY=PASS\nV2365_FIX_PRESERVATION=PASS\nUNKNOWN_RUNTIME_BYTES=0\nOWNER_PRODUCTION_WRITE=NO\n' "$CANDIDATE" "$CANDIDATE_TREE" "$CANDIDATE_RUNTIME_TREE" "$SOURCE" "$MAIN" "$SCHEMA" | tee "$EVID/verdict.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-v2370-candidate-readiness-${{ github.run_id }}
          path: |
            /tmp/p01-v2370-candidate-artifacts
            /tmp/p01-v2370-candidate-evidence
          if-no-files-found: error
          retention-days: 90
