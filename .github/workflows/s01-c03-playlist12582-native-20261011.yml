name: S01 C03 M3U8 12582 Native WordPress Update Discovery
on:
  push:
    branches: [task/s01-c03-playlist12582-native-20261011]
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CHANNEL_SHA: '9d79bfea9ae2fddf079fcf772bdeb94b80d96144'
      PRODUCT_SHA: '4ccdd7b5eaacd3f4c4ff11b50c589af3439e7271'
      PRODUCT_TREE: '4a7fc187d4b6fef975ff855d79646ad5dad47572'
      PRODUCT_FP: '83186f0f0890d866c79794702fcf6491e97f874a53e84beece7240e36194f7ec'
      SOURCE_VERSION: '1.25.81'
      TARGET_VERSION: '1.25.82'
      ASSET_SHA: 'a1dbd5942cd35b58f8e17c3df7570752616c838f169e71e4825cbe7aaa484b05'
    steps:
      - name: Checkout public test scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Checkout exact distributed channel
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CHANNEL_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: channel
      - name: Checkout formally released product main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: ${{ env.PRODUCT_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Validate published channel and native WordPress install
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p proof
          cp -a runner/lanes/s01-c03-playlist12582-native lane
          bash -n lane/native.sh
          php -l lane/discovery.php
          bash lane/native.sh
      - name: Upload public-safe native receipts
        if: success()
        id: receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c03-native12582-${{ github.run_id }}
          path: |
            proof/channel.json
            proof/native.json
            proof/installed.json
            proof/FINAL_DISCOVERY.json
          if-no-files-found: error
          retention-days: 30
      - name: Remote readback native receipts
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.receipt.outputs.artifact-id }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" >/tmp/native-meta.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" >/tmp/native-archive.zip
          python3 - <<'PY'
          import pathlib,json,os,hashlib,zipfile
          m=json.loads(pathlib.Path('/tmp/native-meta.json').read_text())
          blob=pathlib.Path('/tmp/native-archive.zip').read_bytes()
          assert m['id']==int(os.environ['ARTIFACT_ID']) and m['workflow_run']['id']==int(os.environ['GITHUB_RUN_ID'])
          assert m['digest']=='sha256:'+hashlib.sha256(blob).hexdigest() and m['size_in_bytes']==len(blob)
          with zipfile.ZipFile('/tmp/native-archive.zip') as z:
           assert z.testzip() is None
           names={'channel.json','native.json','installed.json','FINAL_DISCOVERY.json'}
           assert set(z.namelist())==names
           for n in names:assert json.loads(z.read(n))==json.loads((pathlib.Path('proof')/n).read_text())
           assert json.loads(z.read('FINAL_DISCOVERY.json'))['status']=='PASS'
          print('S01_C03_PUBLIC_NATIVE_READBACK_PASS',m['id'],m['digest'])
          PY
      - name: Destroy transient private source
        if: always()
        run: rm -rf channel product lane /tmp/source-12581.zip /tmp/target-12582.zip /tmp/channel-12582.json /tmp/s01-wp-cli.phar
