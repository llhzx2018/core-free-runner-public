name: P01 IA6 489 browser-helper token stale and secret safety exact-source proof
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p01-ia6-helper-token-489-20261101.yml
permissions:
  contents: read
jobs:
  helper-native:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'test(P01):')
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      PRODUCT_BRANCH: feat/ia-v6-frontstage-admin-parity-system-jobs-r1
      PRODUCT_SHA: 722fd482c68e0b268921b9367391b90c19b713da
      PRODUCT_VERSION: 2.47.489
      VF_E2E_RUNTIME_ROOT: /tmp/p01-ia6-helper-native-20261101
      VF_IA6_DISPOSABLE_ACK: IA6-HELPER-NATIVE-ONLY
      P01_TEST_ORIGIN: http://127.0.0.1:19319
      P01_TEST_PASSWORD: IA6SyntheticHelperOwner2026!
    steps:
      - name: Checkout only public-safe Runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install disposable PHP SQLite and local Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd php-xml >/dev/null
          php -m | grep -Fx pdo_sqlite
          npm install --no-audit --no-fund --no-save playwright@1.57.0 >/dev/null
          npx playwright install chromium >/dev/null
      - name: Bind private candidate exactly without public artifacts
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          actual="$(git ls-remote "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')"
          test "$actual" = "$PRODUCT_SHA"
          git clone -q --no-checkout "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" candidate
          git -C candidate fetch -q --depth 1 origin "$PRODUCT_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "$PRODUCT_VERSION"
          echo P01_IA6_HELPER_EXACT_SOURCE_BOUND=PASS
      - name: Run only focused native plugin contract and PHP syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          node candidate/tests/unit/p01_ia6_browser_helper_stale_and_secret_contract.cjs
          node candidate/tests/unit/p01_ia5_global_helper_token_r10_contract.cjs
          node --check candidate/tests/integration/p01_ia6_browser_helper_token_preflight_browser.mjs
          php -l candidate/src/api.php
          php -l candidate/src/app/SecurityManager.php
          php -l candidate/src/app/FunctionalWorkspaceShell.php
          echo P01_IA6_HELPER_SCOPE_CONTRACT=PASS
      - name: Real Owner Guest CSRF plugin enable disable, stale review and lost receipt in fresh localhost
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$VF_E2E_RUNTIME_ROOT"
          test "$root" = /tmp/p01-ia6-helper-native-20261101
          mkdir -p "$root"
          cp -a candidate/src/. "$root/"
          php -S 127.0.0.1:19319 -t "$root" >/tmp/p01-ia6-helper-local.log 2>&1 &
          pid=$!
          cleanup() { kill "$pid" >/dev/null 2>&1 || true; rm -rf "$root"; rm -f /tmp/p01-ia6-helper-cookie /tmp/p01-ia6-helper-setup.html /tmp/p01-ia6-helper-installed.html; }
          trap cleanup EXIT
          for i in $(seq 1 40); do
            if curl -fsS -c /tmp/p01-ia6-helper-cookie -b /tmp/p01-ia6-helper-cookie "$P01_TEST_ORIGIN/setup.php" -o /tmp/p01-ia6-helper-setup.html; then break; fi
            sleep 1
          done
          csrf="$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-ia6-helper-setup.html',encoding='utf-8').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s)
          assert m
          print(m.group(1))
          PY
          )"
          curl -fsS -c /tmp/p01-ia6-helper-cookie -b /tmp/p01-ia6-helper-cookie -X POST "$P01_TEST_ORIGIN/setup.php" \
            --data-urlencode "setup_csrf=$csrf" \
            --data-urlencode "site_title=IA6 Synthetic Helper Test" \
            --data-urlencode "admin_password=$P01_TEST_PASSWORD" \
            --data-urlencode "admin_password_confirm=$P01_TEST_PASSWORD" > /tmp/p01-ia6-helper-installed.html
          (cd "$root" && php cli/verify.php) | grep -Fx VERIFY_PASS=YES
          node candidate/tests/integration/p01_ia6_browser_helper_token_preflight_browser.mjs
          echo P01_IA6_HELPER_NATIVE_REAL_OWNER_BROWSER=PASS
      - name: Erase candidate and synthetic artifacts
        if: always()
        shell: bash
        run: |
          rm -rf candidate /tmp/p01-ia6-helper-native-20261101
          rm -f /tmp/p01-ia6-helper-local.log /tmp/p01-ia6-helper-cookie /tmp/p01-ia6-helper-setup.html /tmp/p01-ia6-helper-installed.html
          echo P01_IA6_HELPER_DISPOSABLE_CLEANUP=PASS
