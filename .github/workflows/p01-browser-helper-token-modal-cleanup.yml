name: P01 Browser Helper Token Modal Cleanup Native Proof (Nonpublishing)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-browser-helper-token-modal-cleanup.yml'
permissions:
  contents: read
jobs:
  token-modal:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact P01 safety patch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: c1e49ed21babc429028b3133e0097ba92754c43e
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: product
          persist-credentials: false
      - name: Checkout unchanged P01 stable baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 6330ffcd368b41ad808505ef57f1faca56785a10
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: stable
          persist-credentials: false
      - name: Prepare PHP and SQLite
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,mbstring,zip,gd
          coverage: none
      - name: Assert exact patch identity and lint
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = c1e49ed21babc429028b3133e0097ba92754c43e
          test "$(tr -d '\r\n ' < product/VERSION)" = 2.47.356
          node --check product/src/assets/browser-helper.js
          node --check product/tests/unit/browser_helper_modal_cleanup_runtime.cjs
          php -l product/tests/unit/browser_helper_modal_cleanup_native.php
          echo P01_HELPER_MODAL_PATCH_IDENTITY_AND_SYNTAX=PASS
      - name: Browser helper one-time token modal native regression
        shell: bash
        run: |
          set -Eeuo pipefail
          php product/tests/unit/browser_helper_modal_cleanup_native.php | tee /tmp/helper-modal-proof.txt
          grep -Fx P01_BROWSER_HELPER_TOKEN_MODAL_CLEANUP_UNIT=PASS /tmp/helper-modal-proof.txt
          node product/tests/unit/browser_helper_bundle_copy_runtime.cjs | tee /tmp/helper-bundle-proof.txt
          grep -Fx P01_BROWSER_HELPER_FULL_BUNDLE_COPY_RUNTIME=PASS /tmp/helper-bundle-proof.txt
      - name: Full canonical exact-patch regression with zero debt
        shell: bash
        run: |
          set -Eeuo pipefail
          bash product/tests/canonical_release_regression.sh product stable --require-zero-debt | tee /tmp/p01-browser-helper-canonical.txt
          grep -Fx P01_CANONICAL_UNIT_REGRESSION=PASS /tmp/p01-browser-helper-canonical.txt
          grep -Fx P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS /tmp/p01-browser-helper-canonical.txt
