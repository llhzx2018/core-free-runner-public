name: P01 V2.30 Domain Child Seed Diagnostic
on:
  push:
    branches: [task/p01-v230-domain-nav-shell-20260829]
    paths: [.github/workflows/p01-v230-domain-child-seed-diagnostic-20260829.yml]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_SHA: 426740ee3e36d207581dddf9b3fe5d62fd8d1808
      PORT: '18587'
      ROOT: /tmp/p01-v230-child-diag
      ADMIN_PASS: 'P01V230!DomainUX'
    steps:
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.4', extensions: 'pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo', coverage: none}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {repository: llhzx2018/vf-start, ref: '${{ env.SOURCE_SHA }}', token: '${{ secrets.VF_PRIVATE_READ_TOKEN }}', path: source}
      - name: Child category and domain creates
        shell: bash
        run: |
          set -Eeuo pipefail
          cp -a source/src "$ROOT"; php -S "127.0.0.1:${PORT}" -t "$ROOT" >/tmp/child-diag-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS -c /tmp/child.cookies -b /tmp/child.cookies "http://127.0.0.1:${PORT}/setup.php" -o /tmp/child-setup.html && break || sleep 1; done
          S=$(python3 -c "import re;s=open('/tmp/child-setup.html').read();m=re.search(r'name=\"setup_csrf\"\\s+value=\"([^\"]+)\"',s);assert m;print(m.group(1))")
          curl -fsS -c /tmp/child.cookies -b /tmp/child.cookies -X POST "http://127.0.0.1:${PORT}/setup.php" --data-urlencode "setup_csrf=$S" --data-urlencode 'site_title=Child Diagnostic' --data-urlencode "admin_password=$ADMIN_PASS" --data-urlencode "admin_password_confirm=$ADMIN_PASS" >/dev/null
          LOGIN=$(curl -fsS -c /tmp/child.cookies -b /tmp/child.cookies -H 'Content-Type: application/json' -d "{\"password\":\"$ADMIN_PASS\"}" "http://127.0.0.1:${PORT}/api.php?action=login"); T=$(echo "$LOGIN"|jq -r '.csrf')
          postcat(){ curl -fsS -c /tmp/child.cookies -b /tmp/child.cookies -H 'Content-Type: application/json' -H "X-CSRF-Token: $T" -d "$1" "http://127.0.0.1:${PORT}/api.php?action=category_save"; }
          ROOTJSON=$(postcat '{"name":"互联网","description":"根分类","is_private":false,"sort_order":100}'); echo ROOT=$ROOTJSON; RID=$(echo "$ROOTJSON"|jq -r '.id')
          DEVJSON=$(postcat "{\"name\":\"开发工具\",\"description\":\"开发\",\"parent_id\":$RID,\"is_private\":false,\"sort_order\":90}"); echo DEV=$DEVJSON; DID=$(echo "$DEVJSON"|jq -r '.id')
          test "$DID" != null
          attempt(){
            local label="$1"; shift; echo "--- $label ---"; set +e; OUT=$(curl -sS -w '\nHTTP=%{http_code}\n' -c /tmp/child.cookies -b /tmp/child.cookies -X POST "http://127.0.0.1:${PORT}/workspace-create.php" -F "csrf=$T" "$@"); RC=$?; set -e; echo "$OUT"; test $RC -eq 0; echo "$OUT"|grep -F '"ok":true';
          }
          attempt start-child -F "category_id=$DID" -F 'surface=start' -F 'title=开发网址 1' -F 'url=https://example.com/dev-1' -F 'resource_kind=' -F 'tags=开发,工具' -F 'is_private=0' -F 'source_kind=remote_url'
          attempt channel -F "category_id=$RID" -F 'surface=channels' -F 'title=科技频道 1' -F 'url=https://example.com/channel-1' -F 'resource_kind=科技' -F 'tags=科技,AI' -F 'is_private=0' -F 'background_friendly=1' -F 'source_kind=remote_url'
          attempt watch -F "category_id=$RID" -F 'surface=watch' -F 'title=电影作品 1' -F 'url=https://example.com/movie-1' -F 'resource_kind=电影' -F 'tags=电影' -F 'is_private=0' -F 'media_year=2026' -F 'media_status=want' -F 'source_kind=remote_url'
          attempt topic -F "category_id=$RID" -F 'surface=topics' -F 'title=AI 专题 1' -F 'url=https://example.com/topic-1' -F 'resource_kind=AI' -F 'tags=AI,专题' -F 'is_private=0' -F 'source_kind=remote_url'
          php "$ROOT/cli/verify.php"|grep -Fx VERIFY_PASS=YES
          echo P01_V230_CHILD_SEED_DIAGNOSTIC=PASS
