name: P01 V2.47.274 Core Updates Proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p01-v247274-core-updates-proof.yml"

permissions:
  contents: read

jobs:
  proof:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'proof(P01): V2.47.274 core-updates')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli jq >/dev/null

      - name: Clone exact core-updates candidate
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/core-updates.git" candidate
          git -C candidate fetch -q origin 11d180dc2a7dbac66e7d7b3e1435dc1516520ea0
          git -C candidate checkout -q --detach 11d180dc2a7dbac66e7d7b3e1435dc1516520ea0
          test "$(git -C candidate rev-parse HEAD)" = "11d180dc2a7dbac66e7d7b3e1435dc1516520ea0"
          echo CORE_UPDATES_EXACT_SOURCE=PASS

      - name: Canonical CI equivalent
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 scripts/check_manifest_contract.py
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find update-core/php -type f -name '*.php' -print0)
          php update-core/php/tests/run.php
          echo CORE_UPDATES_CANONICAL_CI_EQUIVALENT=PASS

      - name: Verify P01 V2.47.274 identity
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          jq -e '
            .schema_version=="1.0" and
            .project_id=="P01" and
            .component_id=="APP" and
            .enabled==true and
            .current_version=="2.47.271" and
            .target_version=="2.47.274" and
            .update_type=="ATOMIC" and
            .from_versions==["2.47.271"] and
            .schema_from=="2026090401" and
            .schema_to=="2026090401" and
            .repository=="llhzx2018/vf-start" and
            .release_tag=="v2.47.274" and
            .release_id==405465543 and
            .product_identity=="4679a5e5a1a154782b04eacfc5b94988ea856f27" and
            .asset_name=="VF_Start_V2.47.274_UPDATE.zip" and
            .asset_bytes==2353572 and
            .asset_sha256=="84a568b38defd3652975d249b4e2ed133f04ff6f03f64a4b02b38f60951947c2" and
            .backup_required==true and
            .rollback_supported==true and
            .minimum_php=="8.0.0"
          ' projects/P01.json >/dev/null
          echo P01_V247274_MANIFEST_IDENTITY=PASS

      - name: Verify bounded delta
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          git fetch -q origin main
          mapfile -t changed < <(git diff --name-only origin/main...HEAD)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "projects/P01.json"
          echo CORE_UPDATES_BOUNDED_DELTA=PASS
          echo PRODUCTION_WRITE=NO
