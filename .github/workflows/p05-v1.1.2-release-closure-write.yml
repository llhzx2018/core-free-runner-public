name: P05 V1.1.2 Release Closure Write

on:
  push:
    branches:
      - release/p05-v1.1.2-orchestrator-20260830
    paths:
      - '.github/workflows/p05-v1.1.2-release-closure-write.yml'

permissions:
  contents: read

jobs:
  write:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      TARGET_BRANCH: governance/p05-v1.1.2-release-closure-20260830
      RELEASE_SOURCE: 37c2f50b178c18feed26cbb82a6abc5bb9fc576b
      RELEASE_TREE: 644136d1c486d67f1b3f4bde87b0e4e4b7cee9f4
      RELEASE_ID: '379237052'
      FULL_ASSET_ID: '536415428'
      RECEIPT_ASSET_ID: '536415445'
      FULL_BYTES: '231699'
      FULL_SHA256: 34c9a88e01197eb6f4ee8943c33d38f832246e72e965e574c9766dbf5ace15fa
      RELEASED_AT: 2026-08-30T09:36:08Z
      EXACT_MAIN_RUN: '33304335080'
      EXACT_MAIN_JOB: '99238071726'
      PUBLICATION_RUN: '33304456790'
      PUBLICATION_JOB: '99238394225'
      MANIFEST_RUN: '33304530041'
      MANIFEST_JOB: '99238585984'
      CORE_UPDATES_MAIN: 377549c35aef8f78a76a9b6bec09376aff6ce4e9
    steps:
      - name: Checkout closure branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: governance/p05-v1.1.2-release-closure-20260830
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply release closure authority
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE"
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          source=os.environ['RELEASE_SOURCE']; tree=os.environ['RELEASE_TREE']
          rid=int(os.environ['RELEASE_ID']); aid=int(os.environ['FULL_ASSET_ID']); receipt_id=int(os.environ['RECEIPT_ASSET_ID'])
          full_bytes=int(os.environ['FULL_BYTES']); sha=os.environ['FULL_SHA256']; released=os.environ['RELEASED_AT']
          main_run=int(os.environ['EXACT_MAIN_RUN']); main_job=int(os.environ['EXACT_MAIN_JOB'])
          pub_run=int(os.environ['PUBLICATION_RUN']); pub_job=int(os.environ['PUBLICATION_JOB'])
          manifest_run=int(os.environ['MANIFEST_RUN']); manifest_job=int(os.environ['MANIFEST_JOB'])
          core_main=os.environ['CORE_UPDATES_MAIN']

          p=Path('VF_PROJECT.json'); data=json.loads(p.read_text(encoding='utf-8'))
          data.update({
            'status':'V1.1.2_RELEASED / DEPLOYMENT_READY / PRODUCTION_NOT_DEPLOYED',
            'version':'1.1.2','target_version':'1.1.2','working_version':'1.1.2','version_change':False,
            'formal_release':'v1.1.2','formal_release_state':'RELEASED_CURRENT',
            'formal_release_source':source,'formal_release_tree':tree,'formal_release_id':rid,
            'formal_release_asset':'VF_SEO_V1.1.2_FULL.zip','formal_release_asset_id':aid,
            'formal_release_asset_files':41,'formal_release_asset_bytes':full_bytes,'formal_release_asset_sha256':sha,
            'release_authorization':'PASS_RELEASED_V1.1.2',
            'deployment_readiness':'PASS_V1.1.2_RELEASED',
            'production_deployment':'NOT_DEPLOYED','production_write':0,
            'next_action':'V1.1.2 FORMAL RELEASE CLOSED; PRODUCTION REMAINS SEPARATE OWNER GATE'
          })
          data['release_publication']={
            'tag':'v1.1.2','release_id':rid,'release_name':'P05 · VF SEO v1.1.2 · Browser-first Zero-SSH Install',
            'target_commit':source,'target_tree':tree,'published_at':released,
            'full_asset':'VF_SEO_V1.1.2_FULL.zip','full_asset_id':aid,'full_bytes':full_bytes,'full_sha256':sha,
            'receipt_asset':'VF_SEO_V1.1.2_RELEASE_RECEIPT.txt','receipt_asset_id':receipt_id,
            'exact_main_run':main_run,'exact_main_job':main_job,'publication_run':pub_run,'publication_job':pub_job,
            'core_updates_main':core_main,'manifest_run':manifest_run,'manifest_job':manifest_job,
            'state':'PASS_CLOSED','production':'NOT_DEPLOYED'
          }
          b=data.get('v1_1_2_browser_first_install') or {}
          b.update({'state':'RELEASED','formal_release':'v1.1.2','release_id':rid,'full_asset_id':aid,'full_sha256':sha,'production_state':'NOT_DEPLOYED'})
          data['v1_1_2_browser_first_install']=b
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          r=Path('README.md'); text=r.read_text(encoding='utf-8')
          text=text.replace('Current Formal Release: v1.1.1 · CloudPanel Direct-Extract Fix','Current Formal Release: v1.1.2 · Browser-first Zero-SSH Install')
          text=text.replace('Formal Release Source: ac8c3f2bedf3b1fe16f38ed079ffbe2f29e54cbc',f'Formal Release Source: {source}')
          text=text.replace('Current main: 0d68b7c95e24d0a4abe3bf8e71f9914de9091130',f'Formal Release Tree: {tree}')
          text=text.replace('Repository VERSION: 1.1.2 · RELEASE CANDIDATE / BROWSER-FIRST MACHINE PASS','Repository VERSION: 1.1.2 · RELEASED / DEPLOYMENT_READY')
          text=text.replace('Browser-first Install: RELEASE CANDIDATE / MACHINE PASS / PRODUCTION NOT DEPLOYED','Browser-first Install: RELEASED IN v1.1.2 / MACHINE PASS / PRODUCTION NOT DEPLOYED')
          old='`v1.1.1` 的正式 Tag / GitHub Release / FULL 资产保持不可变；仓库现已进入 `v1.1.2` Browser-first Zero-SSH Release Candidate。正式发布前 `v1.1.1` 仍是 Current Formal Release；Production 继续 `NOT_DEPLOYED`。'
          new=f'`v1.1.2` 已正式发布 Browser-first Zero-SSH 首次安装能力；正式 Tag / GitHub Release / FULL 资产绑定 Exact Main `{source}` 与 Tree `{tree}`。Production 继续 `NOT_DEPLOYED`，正式发布与线上部署仍是两个独立 Gate。'
          text=text.replace(old,new)
          r.write_text(text,encoding='utf-8')

          d=Path('docs/README.md'); text=d.read_text(encoding='utf-8')
          text=text.replace('Current Formal Release: v1.1.1 · CloudPanel Direct-Extract Fix','Current Formal Release: v1.1.2 · Browser-first Zero-SSH Install')
          text=text.replace('Formal Release Source: ac8c3f2bedf3b1fe16f38ed079ffbe2f29e54cbc',f'Formal Release Source: {source}')
          text=text.replace('Current main: 0d68b7c95e24d0a4abe3bf8e71f9914de9091130',f'Formal Release Tree: {tree}')
          text=text.replace('Browser-first Install: MERGED TO MAIN / MACHINE PASS / NOT YET FORMALLY RELEASED','Browser-first Install: RELEASED IN v1.1.2 / MACHINE PASS')
          text=text.replace('当前正式 Release 仍是 `v1.1.1`。其后，Browser-first Zero-SSH 首次安装能力已经通过 Exact Source Machine Gate 并合入 `main`，但尚未形成新的 Formal Release，也没有部署 Production。','当前正式 Release 已晋级 `v1.1.2`。Browser-first Zero-SSH 首次安装已完成 Exact Main、正式 FULL、GitHub Release 与 core-updates Distribution 收口；Production 仍未部署。')
          text=text.replace('2. [V1.1.1 Current Release Authority](authority/RELEASE_V1.1.1_CURRENT.md)','2. [V1.1.2 Current Release Authority](authority/RELEASE_V1.1.2_CURRENT.md)')
          d.write_text(text,encoding='utf-8')

          c=Path('CHANGELOG.md'); text=c.read_text(encoding='utf-8')
          text=text.replace('## 1.1.2 · Browser-first Zero-SSH Install（Release Candidate · 2026-08-30）','## 1.1.2 · Browser-first Zero-SSH Install（正式发布 · 2026-08-30）',1)
          marker='- Production 继续 `NOT_DEPLOYED`，本 Patch 只发布 Browser-first 首次安装能力。\n'
          publication=(f'- Formal Publication：`v1.1.2` / Release `{rid}` / `VF_SEO_V1.1.2_FULL.zip` / 41 files / {full_bytes} bytes / SHA-256 `{sha}`。\n'
                       f'- Exact Main `{source}` / Tree `{tree}` 已通过 Public Runner Run `{main_run}` / Job `{main_job}` 全链 Machine PASS；Publication Run `{pub_run}` / Job `{pub_job}` = PASS。\n'
                       f'- `core-updates/projects/P05.json` 已晋级 v1.1.2，main `{core_main}`；Manifest Gate Run `{manifest_run}` / Job `{manifest_job}` = PASS。\n')
          if publication not in text:
              text=text.replace(marker,marker+publication,1)
          c.write_text(text,encoding='utf-8')

          bpath=Path('docs/authority/BROWSER_FIRST_INSTALL_MAIN_CURRENT.md'); text=bpath.read_text(encoding='utf-8')
          text=text.replace('Formal Release State: NOT YET RELEASED','Formal Release State: RELEASED IN v1.1.2')
          old='Browser-first 能力虽然已经进入 `main`，但 **尚未发布新的 Formal Release**。不得把当前 main 新能力描述成已经存在于旧 `v1.1.1` Release 资产中。'
          text=text.replace(old,'Browser-first 能力已随 `v1.1.2` 正式发布。旧 `v1.1.1` Release 资产保持不可变，不包含该能力。')
          bpath.write_text(text,encoding='utf-8')

          authority=Path('docs/authority/RELEASE_V1.1.2_CURRENT.md')
          authority.write_text(f'''# P05 · VF SEO · Release V1.1.2 Current Authority\n\n## Current State\n\n```text\nFormal Release: v1.1.2 · Browser-first Zero-SSH Install\nState: RELEASED / DEPLOYMENT_READY / PRODUCTION_NOT_DEPLOYED\nFormal Release Source: {source}\nFormal Release Tree: {tree}\nSchema: VF-SEO-SCHEMA@1 / 1\nDistribution: FULL_ONLY / from_versions=[]\nProduction: NOT_DEPLOYED\n```\n\n## Formal Artifact\n\n```text\nRelease ID: {rid}\nFULL: VF_SEO_V1.1.2_FULL.zip\nFULL Asset ID: {aid}\nFiles: 41\nBytes: {full_bytes}\nSHA-256: {sha}\nPublished At: {released}\nReceipt Asset ID: {receipt_id}\n```\n\n## Machine Evidence\n\n- Browser-first feature Gate: Run `33295759635` / Job `99215017153` = PASS.\n- V1.1.2 Candidate Gate: Run `33304235775` / Job `99237809438` = PASS.\n- Exact Main Release Gate: Run `{main_run}` / Job `{main_job}` = PASS.\n- GitHub Release Publication: Run `{pub_run}` / Job `{pub_job}` = PASS.\n- core-updates Manifest Gate: Run `{manifest_run}` / Job `{manifest_job}` = PASS.\n- core-updates main: `{core_main}`.\n\n## Normal Install Contract\n\n```text\n上传 FULL ZIP\n→ 解压\n→ 打开域名\n→ /setup\n→ 环境检查\n→ 管理员账号 / 密码\n→ 一键初始化\n→ Setup Lock\n→ 进入系统\n```\n\n正常首次安装不要求 SSH、Shell、手工 `.env`、手工 Migration 或 CLI Admin Bootstrap。\n\n## Closure\n\n```text\nP05 V1.1.2 RELEASE = PASS / CLOSED\nP05 Production = NOT_DEPLOYED\n```\n\nProduction Deployment 仍是后续独立 Owner Gate，本 Release Closure 没有 Production 写入。\n''',encoding='utf-8')
          PY
          git diff --check
          test "$(jq -r .formal_release VF_PROJECT.json)" = 'v1.1.2'
          test "$(jq -r .formal_release_state VF_PROJECT.json)" = 'RELEASED_CURRENT'
          test "$(jq -r .production_deployment VF_PROJECT.json)" = 'NOT_DEPLOYED'
          test -f docs/authority/RELEASE_V1.1.2_CURRENT.md

      - name: Commit and push closure
        run: |
          set -euo pipefail
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VF_PROJECT.json README.md docs/README.md CHANGELOG.md docs/authority/BROWSER_FIRST_INSTALL_MAIN_CURRENT.md docs/authority/RELEASE_V1.1.2_CURRENT.md
          git diff --cached --quiet && { echo NO_CHANGES; exit 1; }
          git commit -m 'governance(P05): close V1.1.2 formal release'
          git push origin HEAD:$TARGET_BRANCH
          echo "P05_V112_CLOSURE_SHA=$(git rev-parse HEAD)"
          echo P05_V112_RELEASE_CLOSURE_WRITE=PASS
