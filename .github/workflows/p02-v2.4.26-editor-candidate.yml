name: P02 V2.4.26 Editor Candidate Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v2.4.26-editor-candidate.yml'
      - 'requests/p02-v2.4.26-editor-verify.txt'

permissions:
  contents: read

concurrency:
  group: p02-v2.4.26-editor-candidate-public
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PRODUCT_REPOSITORY: llhzx2018/vf-library
      PRODUCT_REF: 0a78b5c5c3d99fe2634fbdcedd654d1614f652d7
      TARGET_VERSION: 2.4.26
      TARGET_SCHEMA: '2401'
      TEST_PASSWORD: VF-Editor-${{ github.run_id }}!
    steps:
      - name: Require registered read capability
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN" || { echo 'REGISTERED_CAPABILITY_BLOCK=VF_PRIVATE_READ_TOKEN_MISSING'; exit 78; }
          echo 'REGISTERED_PRIVATE_READ=PASS'

      - name: Checkout exact private P02 candidate transiently
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.PRODUCT_REPOSITORY }}
          ref: ${{ env.PRODUCT_REF }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: product

      - name: Guard candidate identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$PRODUCT_REF"
          test "$(tr -d '\r\n' < product/VERSION)" = "$TARGET_VERSION"
          python3 - <<'PY'
          import json
          m=json.load(open('product/SOURCE_MANIFEST.json',encoding='utf-8'))
          assert m['version']=='2.4.26'
          assert int(m['schema'])==2401
          assert int(m['runtime_source_file_count'])==55
          print('P02_SOURCE_IDENTITY=PASS')
          PY

      - name: Install runtime and browser harness
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 php-zip sqlite3 unzip curl >/dev/null
          cd product
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Repository source privacy and syntax gates
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check public/assets/editor-enhancements.js
          php -l public/index.php >/dev/null
          bash scripts/verify-repository.sh
          grep -Fq -- '--vf-editor-font-size:16px' public/assets/editor-enhancements.css
          grep -Fq "action === 'paragraph'" public/assets/editor-enhancements.js
          grep -Fq "action === 'align-center'" public/assets/editor-enhancements.js
          grep -Fq "action === 'font-larger'" public/assets/editor-enhancements.js
          echo 'P02_EDITOR_STATIC_GATES=PASS'

      - name: Fresh install and targeted editor browser E2E
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          SITE="$RUNNER_TEMP/p02-editor-site"
          COOKIE="$RUNNER_TEMP/p02-editor-cookie"
          bash scripts/build-deploy-tree.sh "$SITE" >/dev/null
          test "$(tr -d '\r\n' < "$SITE/VERSION.txt")" = '2.4.26'
          php -d display_errors=0 -S 127.0.0.1:18132 -t "$SITE" >"$RUNNER_TEMP/p02-editor-php.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 80); do curl -fsS http://127.0.0.1:18132/setup.php >/dev/null 2>&1 && break; sleep .25; done
          kill -0 "$SERVER_PID"

          curl -fsS -c "$COOKIE" http://127.0.0.1:18132/setup.php > "$RUNNER_TEMP/setup.html"
          SETUP_CSRF=$(python3 - "$RUNNER_TEMP/setup.html" <<'PY'
          import html,re,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf" value="([^"]+)"',s)
          if not m: raise SystemExit('setup csrf missing')
          print(html.unescape(m.group(1)))
          PY
          )
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' -b "$COOKIE" -c "$COOKIE" -H 'Origin: http://127.0.0.1:18132' --data-urlencode "setup_csrf=$SETUP_CSRF" --data-urlencode "password=$TEST_PASSWORD" --data-urlencode "password_confirm=$TEST_PASSWORD" http://127.0.0.1:18132/setup.php)
          test "$STATUS" = 303
          curl -fsS -b "$COOKIE" http://127.0.0.1:18132/api.php?action=session > "$RUNNER_TEMP/session.json"
          python3 - "$RUNNER_TEMP/session.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1])); assert x['ok'] and x['site']['auth'] and x['version']=='2.4.26'
          print('P02_FRESH_INSTALL_AUTH=PASS')
          PY

          VF_EDITOR_BASE_URL=http://127.0.0.1:18132 VF_EDITOR_COOKIE_PATH="$COOKIE" node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('assert');
          const fs = require('fs');
          function readCurlCookies(path) {
            return fs.readFileSync(path, 'utf8').split(/\r?\n/).filter(line => line && (!line.startsWith('#') || line.startsWith('#HttpOnly_'))).map(line => {
              const parts=line.split('\t');
              let domain=parts[0], httpOnly=false;
              if (domain.startsWith('#HttpOnly_')) { httpOnly=true; domain=domain.slice('#HttpOnly_'.length); }
              return {name:parts[5], value:parts[6], domain, path:parts[2] || '/', secure:parts[3]==='TRUE', httpOnly};
            });
          }
          (async () => {
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({viewport:{width:1365,height:768}});
            await context.addCookies(readCurlCookies(process.env.VF_EDITOR_COOKIE_PATH));
            const page = await context.newPage();
            const base = process.env.VF_EDITOR_BASE_URL;
            await page.goto(base + '/', {waitUntil:'domcontentloaded'});
            await page.waitForSelector('#addContentBtn:not(.hidden)', {timeout:15000});

            await page.locator('#addContentBtn').click();
            const editor = page.locator('.content-editor').first();
            await editor.waitFor({state:'visible'});
            const toolbar = page.locator('.vf-editor-toolbar').first();
            await toolbar.waitFor({state:'visible'});
            assert.strictEqual(await page.locator('[data-vf-editor-size-value]').first().textContent(), '16px');
            assert.strictEqual(await editor.evaluate(el => getComputedStyle(el).fontSize), '16px');

            await editor.fill('正文测试');
            await editor.evaluate(el => el.setSelectionRange(0, el.value.length));
            await toolbar.locator('[data-vf-editor-action="bold"]').click();
            assert.strictEqual(await editor.inputValue(), '**正文测试**');

            await editor.fill('### 标题');
            await editor.evaluate(el => el.setSelectionRange(0, el.value.length));
            await toolbar.locator('[data-vf-editor-action="paragraph"]').click();
            assert.strictEqual(await editor.inputValue(), '标题');

            await editor.fill('- 列表项');
            await editor.evaluate(el => el.setSelectionRange(0, el.value.length));
            await toolbar.locator('[data-vf-editor-action="align-center"]').click();
            assert.strictEqual(await editor.inputValue(), '- ::center:: 列表项');

            for (let i=0;i<10;i++) await toolbar.locator('[data-vf-editor-action="font-larger"]').click();
            assert.strictEqual(await editor.evaluate(el => getComputedStyle(el).fontSize), '22px');
            assert.strictEqual(await toolbar.locator('[data-vf-editor-action="font-larger"]').isDisabled(), true);
            for (let i=0;i<20;i++) await toolbar.locator('[data-vf-editor-action="font-smaller"]').click();
            assert.strictEqual(await editor.evaluate(el => getComputedStyle(el).fontSize), '14px');
            assert.strictEqual(await toolbar.locator('[data-vf-editor-action="font-smaller"]').isDisabled(), true);

            await page.evaluate(() => {
              const box=document.createElement('div'); box.className='markdown-body';
              box.innerHTML='<p id="vf-align-fixture">::center:: 预览居中</p>'; document.body.appendChild(box);
            });
            await page.waitForFunction(() => document.querySelector('#vf-align-fixture')?.classList.contains('vf-align-center'));
            assert.strictEqual(await page.locator('#vf-align-fixture').textContent(), '预览居中');
            assert.strictEqual(await page.locator('#vf-align-fixture').evaluate(el => getComputedStyle(el).textAlign), 'center');

            await page.evaluate(() => {
              const form=document.createElement('form');
              form.id='vf-article-editor-fixture';
              form.innerHTML='<select name="content_format"><option value="markdown" selected>Markdown</option><option value="code">Code</option></select><div class="article-source-pane"><textarea id="articleSource">文章工作台正文</textarea></div>';
              document.body.appendChild(form);
            });
            const articleEditor = page.locator('#vf-article-editor-fixture #articleSource');
            await page.waitForFunction(() => document.querySelector('#vf-article-editor-fixture #articleSource')?.dataset.vfEditorEnhanced === '1');
            const articleToolbar = page.locator('#vf-article-editor-fixture .vf-editor-toolbar');
            await articleToolbar.waitFor({state:'visible'});
            assert.strictEqual(await articleEditor.evaluate(el => getComputedStyle(el).fontSize), '14px');
            await articleEditor.evaluate(el => el.setSelectionRange(0, el.value.length));
            await articleToolbar.locator('[data-vf-editor-action="h2"]').click();
            assert.strictEqual(await articleEditor.inputValue(), '## 文章工作台正文');

            const format = page.locator('[name="content_format"]').first();
            if (await format.count()) {
              await format.selectOption('code');
              assert.strictEqual(await toolbar.locator('[data-vf-editor-action="bold"]').isHidden(), true);
              assert.strictEqual(await toolbar.locator('[data-vf-editor-action="font-larger"]').isVisible(), true);
            }

            await page.setViewportSize({width:390,height:844});
            const overflow = await page.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth);
            assert.ok(overflow <= 1, 'mobile horizontal page overflow=' + overflow);
            assert.strictEqual(await toolbar.evaluate(el => getComputedStyle(el).overflowX), 'auto');

            await toolbar.locator('[data-vf-editor-action="font-larger"]').click();
            await page.reload({waitUntil:'domcontentloaded'});
            await page.locator('#addContentBtn').click();
            const persisted = page.locator('.content-editor').first();
            await persisted.waitFor({state:'visible'});
            assert.strictEqual(await persisted.evaluate(el => getComputedStyle(el).fontSize), '15px');
            console.log('P02_EDITOR_BROWSER_E2E=PASS');
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Public-safe evidence summary
        if: always()
        shell: bash
        run: |
          echo 'P02=VF Library'
          echo 'TARGET=V2.4.26 / Schema 2401'
          echo 'PRIVATE_SOURCE_PERSISTED=NO'
          echo 'PRIVATE_DATA_USED=NO'
          echo 'PRODUCTION_WRITE=NO'
          echo 'MAIN_WRITE=NO'
          echo 'FORMAL_RELEASE=NO'
