name: P02 V2.4.26 Editor Candidate Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v2.4.26-editor-candidate.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PRODUCT_REF: 0a78b5c5c3d99fe2634fbdcedd654d1614f652d7
      TEST_PASSWORD: VF-Editor-${{ github.run_id }}!
    steps:
      - name: Require registered read capability
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo REGISTERED_PRIVATE_READ=PASS

      - name: Checkout exact private P02 candidate transiently
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.PRODUCT_REF }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: product

      - name: Install runtime and browser harness
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$PRODUCT_REF"
          test "$(tr -d '\r\n' < product/VERSION)" = '2.4.26'
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 php-zip sqlite3 unzip curl >/dev/null
          cd product
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Source privacy and syntax gates
        working-directory: product
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          m=json.load(open('SOURCE_MANIFEST.json',encoding='utf-8'))
          assert m['version']=='2.4.26' and int(m['schema'])==2401 and int(m['runtime_source_file_count'])==55
          PY
          node --check public/assets/editor-enhancements.js
          php -l public/index.php >/dev/null
          bash scripts/verify-repository.sh
          grep -Fq -- '--vf-editor-font-size:16px' public/assets/editor-enhancements.css
          grep -Fq "action === 'paragraph'" public/assets/editor-enhancements.js
          grep -Fq "action === 'align-center'" public/assets/editor-enhancements.js
          echo P02_EDITOR_STATIC_GATES=PASS

      - name: Fresh install and editor E2E
        working-directory: product
        run: |
          set -Eeuo pipefail
          SITE="$RUNNER_TEMP/p02-editor-site"
          COOKIE="$RUNNER_TEMP/p02-editor-cookie"
          bash scripts/build-deploy-tree.sh "$SITE" >/dev/null
          test "$(tr -d '\r\n' < "$SITE/VERSION.txt")" = '2.4.26'
          php -d display_errors=0 -S 127.0.0.1:18132 -t "$SITE" >"$RUNNER_TEMP/php.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 80); do curl -fsS http://127.0.0.1:18132/setup.php >/dev/null 2>&1 && break; sleep .25; done
          curl -fsS -c "$COOKIE" http://127.0.0.1:18132/setup.php > "$RUNNER_TEMP/setup.html"
          SETUP_CSRF=$(python3 - "$RUNNER_TEMP/setup.html" <<'PY'
          import html,re,sys
          m=re.search(r'name="setup_csrf" value="([^"]+)"',open(sys.argv[1],encoding='utf-8').read()); assert m
          print(html.unescape(m.group(1)))
          PY
          )
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' -b "$COOKIE" -c "$COOKIE" -H 'Origin: http://127.0.0.1:18132' --data-urlencode "setup_csrf=$SETUP_CSRF" --data-urlencode "password=$TEST_PASSWORD" --data-urlencode "password_confirm=$TEST_PASSWORD" http://127.0.0.1:18132/setup.php)
          test "$STATUS" = 303
          curl -fsS -b "$COOKIE" http://127.0.0.1:18132/api.php?action=session > "$RUNNER_TEMP/session.json"
          python3 - "$RUNNER_TEMP/session.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1])); assert x['ok'] and x['site']['auth'] and x['version']=='2.4.26'
          print('P02_FRESH_INSTALL_AUTH=PASS')
          PY

          VF_EDITOR_COOKIE_PATH="$COOKIE" node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('assert');
          const fs = require('fs');
          const base='http://127.0.0.1:18132';
          function cookies(path){return fs.readFileSync(path,'utf8').split(/\r?\n/).filter(x=>x&&(!x.startsWith('#')||x.startsWith('#HttpOnly_'))).map(x=>{const p=x.split('\t');let d=p[0],h=false;if(d.startsWith('#HttpOnly_')){h=true;d=d.slice(10);}return{name:p[5],value:p[6],domain:d,path:p[2]||'/',secure:p[3]==='TRUE',httpOnly:h};});}
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:1365,height:768}});
            await context.addCookies(cookies(process.env.VF_EDITOR_COOKIE_PATH));
            const page=await context.newPage();
            await page.goto(base+'/',{waitUntil:'domcontentloaded'});
            await page.waitForSelector('#addContentBtn:not(.hidden)');
            await page.locator('#addContentBtn').click();
            const editor=page.locator('.content-editor').first(), toolbar=page.locator('.vf-editor-toolbar').first();
            await editor.waitFor({state:'visible'}); await toolbar.waitFor({state:'visible'});
            assert.strictEqual(await editor.evaluate(el=>getComputedStyle(el).fontSize),'16px');
            assert.strictEqual(await page.locator('[data-vf-editor-size-value]').first().textContent(),'16px');

            await editor.fill('正文测试'); await editor.evaluate(el=>el.setSelectionRange(0,el.value.length));
            await toolbar.locator('[data-vf-editor-action="bold"]').click(); assert.strictEqual(await editor.inputValue(),'**正文测试**');
            await editor.fill('### 标题'); await editor.evaluate(el=>el.setSelectionRange(0,el.value.length));
            await toolbar.locator('[data-vf-editor-action="paragraph"]').click(); assert.strictEqual(await editor.inputValue(),'标题');
            await editor.fill('- 列表项'); await editor.evaluate(el=>el.setSelectionRange(0,el.value.length));
            await toolbar.locator('[data-vf-editor-action="align-center"]').click(); assert.strictEqual(await editor.inputValue(),'- ::center:: 列表项');

            for(let i=0;i<6;i++) await toolbar.locator('[data-vf-editor-action="font-larger"]').click();
            assert.strictEqual(await editor.evaluate(el=>getComputedStyle(el).fontSize),'22px');
            assert.strictEqual(await toolbar.locator('[data-vf-editor-action="font-larger"]').isDisabled(),true);
            for(let i=0;i<8;i++) await toolbar.locator('[data-vf-editor-action="font-smaller"]').click();
            assert.strictEqual(await editor.evaluate(el=>getComputedStyle(el).fontSize),'14px');

            await page.evaluate(()=>{const b=document.createElement('div');b.className='markdown-body';b.innerHTML='<p id="vf-align-fixture">::center:: 预览居中</p>';document.body.appendChild(b);});
            await page.waitForFunction(()=>document.querySelector('#vf-align-fixture')?.classList.contains('vf-align-center'));
            assert.strictEqual(await page.locator('#vf-align-fixture').textContent(),'预览居中');
            assert.strictEqual(await page.locator('#vf-align-fixture').evaluate(el=>getComputedStyle(el).textAlign),'center');

            await page.evaluate(()=>{const f=document.createElement('form');f.id='vf-article-editor-fixture';f.innerHTML='<select name="content_format"><option value="markdown">Markdown</option><option value="code">Code</option></select><div class="article-source-pane"><textarea id="articleSource">文章工作台正文</textarea></div>';document.body.appendChild(f);});
            await page.waitForFunction(()=>document.querySelector('#vf-article-editor-fixture #articleSource')?.dataset.vfEditorEnhanced==='1');
            const ae=page.locator('#vf-article-editor-fixture #articleSource'), at=page.locator('#vf-article-editor-fixture .vf-editor-toolbar');
            assert.strictEqual(await ae.evaluate(el=>getComputedStyle(el).fontSize),'14px');
            await ae.evaluate(el=>el.setSelectionRange(0,el.value.length)); await at.locator('[data-vf-editor-action="h2"]').click();
            assert.strictEqual(await ae.inputValue(),'## 文章工作台正文');

            const format=page.locator('[name="content_format"]').first();
            if(await format.count()){
              await format.evaluate(el=>{el.value='code';el.dispatchEvent(new Event('change',{bubbles:true}));});
              assert.strictEqual(await toolbar.locator('[data-vf-editor-action="bold"]').isHidden(),true);
              assert.strictEqual(await toolbar.locator('[data-vf-editor-action="font-larger"]').isVisible(),true);
            }

            await page.setViewportSize({width:390,height:844});
            assert.ok(await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth)<=1);
            assert.strictEqual(await toolbar.evaluate(el=>getComputedStyle(el).overflowX),'auto');
            await toolbar.locator('[data-vf-editor-action="font-larger"]').click();
            await page.reload({waitUntil:'domcontentloaded'}); await page.locator('#addContentBtn').click();
            const persisted=page.locator('.content-editor').first(); await persisted.waitFor({state:'visible'});
            assert.strictEqual(await persisted.evaluate(el=>getComputedStyle(el).fontSize),'15px');
            console.log('P02_EDITOR_BROWSER_E2E=PASS'); await browser.close();
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE

      - name: Public-safe evidence summary
        if: always()
        run: |
          echo 'P02=VF Library'
          echo 'TARGET=V2.4.26 / Schema 2401'
          echo 'PRIVATE_SOURCE_PERSISTED=NO'
          echo 'PRIVATE_DATA_USED=NO'
          echo 'PRODUCTION_WRITE=NO'
          echo 'MAIN_WRITE=NO'
          echo 'FORMAL_RELEASE=NO'
