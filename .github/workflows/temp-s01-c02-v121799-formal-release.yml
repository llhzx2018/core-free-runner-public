name: TEMP S01-C02 Ops 1.21.799 Formal Release

on:
  push:
    branches:
      - temp/s01-c02-v121799-formal-release-20260903
    paths:
      - '.github/workflows/temp-s01-c02-v121799-formal-release.yml'

permissions:
  contents: read
  actions: read

env:
  TARGET_REPOSITORY: llhzx2018/vf-tools-ops
  TARGET_COMMIT: 4a04c70ba20ba7407230c8121aa6e5f11ac29743
  TARGET_TREE: 05107a744a61c1566ce783c5135192ad2b07e6e2
  BASE_RELEASE_COMMIT: c22d766338245d5dfac49a485129614c85001ee7
  BASE_RUNTIME_FILES: '893'
  BASE_RUNTIME_FP: f68542afb8588c69a84c3bd3a59131a876628d3abd8784e78e8d6d50bcafd1b8
  BASE_ASSET_BYTES: '3198663'
  BASE_ASSET_SHA256: 7f00a1d75289c7e7221ec41bb84aa193c78234f4130752b54d95721340a956a6
  CANDIDATE_GATE_RUN: '33838092039'
  CANDIDATE_GATE_RUNNER_SHA: 8106b3e34f707977c175630f373b9a30f0484902
  VERSION: 1.21.799
  TAG: v1.21.799
  RELEASE_NAME: VF Tools Ops V1.21.799
  ASSET_NAME: vf-tools-ops_V1.21.799.zip
  EVIDENCE_DIR: /tmp/s01-c02-v121799-formal-release

jobs:
  formal-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Credential presence gate
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"
          echo RELEASE_CREDENTIALS=PASS

      - name: Verify exact Candidate Gate PASS
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          JSON="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/runs/${CANDIDATE_GATE_RUN}")"
          test "$(jq -r '.status' <<<"$JSON")" = completed
          test "$(jq -r '.conclusion' <<<"$JSON")" = success
          test "$(jq -r '.head_sha' <<<"$JSON")" = "$CANDIDATE_GATE_RUNNER_SHA"
          printf '%s\n' "$JSON" > "$EVIDENCE_DIR/candidate-gate-run.json"
          echo DOMAIN_AUTHORITY_CANDIDATE_GATE=PASS

      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.TARGET_COMMIT }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops

      - name: Verify source identity tested tree and bounded scope
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$TARGET_COMMIT"
          test "$(git -C ops rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(tr -d '\r\n' < ops/VERSION)" = "$VERSION"
          grep -Fq 'Version: 1.21.799' ops/vf-ops.php
          MAIN_JSON="$(curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${TARGET_REPOSITORY}/branches/main")"
          DEV_JSON="$(curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${TARGET_REPOSITORY}/branches/develop")"
          test "$(jq -r '.commit.sha' <<<"$MAIN_JSON")" = "$TARGET_COMMIT"
          test "$(jq -r '.commit.sha' <<<"$DEV_JSON")" = "$TARGET_COMMIT"
          git -C ops diff --name-only "$BASE_RELEASE_COMMIT" "$TARGET_COMMIT" | sort > "$EVIDENCE_DIR/changed-files.txt"
          cat > /tmp/expected-files.txt <<'EOF'
          .github/phase3/v121799-final-domain-authority.php
          VERSION
          includes/cf-static-downloads/inspect.php
          includes/site-release/final-domain-authority.php
          vf-ops.php
          EOF
          diff -u /tmp/expected-files.txt "$EVIDENCE_DIR/changed-files.txt"
          echo SOURCE_IDENTITY_TESTED_TREE_AND_SCOPE=PASS

      - name: Run focused source contract
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l ops/includes/site-release/final-domain-authority.php
          php -l ops/includes/cf-static-downloads/inspect.php
          php -l ops/vf-ops.php
          php ops/.github/phase3/v121799-final-domain-authority.php | tee "$EVIDENCE_DIR/domain-authority-contract.txt"
          grep -Fxq PASS_V121799_FINAL_DOMAIN_AUTHORITY "$EVIDENCE_DIR/domain-authority-contract.txt"
          echo FOCUSED_SOURCE_CONTRACT=PASS

      - name: Calibrate 1.21.798 package and build exact 1.21.799 artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/base-source /tmp/candidate-source /tmp/base-runtime /tmp/candidate-runtime /tmp/release
          mkdir -p /tmp/base-source /tmp/candidate-source /tmp/base-runtime /tmp/candidate-runtime /tmp/release
          git -C ops archive "$BASE_RELEASE_COMMIT" | tar -x -C /tmp/base-source
          git -C ops archive "$TARGET_COMMIT" | tar -x -C /tmp/candidate-source
          python3 - <<'PY'
          import re, shutil, hashlib, zipfile, json, os
          from pathlib import Path
          def runtime_files(root_path,out_path):
              root=Path(root_path); out=Path(out_path); files={}
              def ok(rel):
                  p=rel.as_posix(); parts=p.split('/')
                  if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in parts): return False
                  if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',p,re.I): return False
                  if '/' not in p: return p in {'vf-ops.php','uninstall.php'}
                  return parts[0] in {'includes','assets','languages','config'}
              for src in root.rglob('*'):
                  if src.is_file() and not src.is_symlink():
                      rel=src.relative_to(root)
                      if ok(rel):
                          dst=out/rel; dst.parent.mkdir(parents=True,exist_ok=True); shutil.copyfile(src,dst)
                          files[rel.as_posix()]=src.read_bytes()
              return dict(sorted(files.items()))
          def identity(files):
              fp=hashlib.sha256()
              for rel,b in files.items(): fp.update((rel+'\0'+hashlib.sha256(b).hexdigest()+'\n').encode())
              return len(files),fp.hexdigest()
          def build_zip(files,zpath):
              zpath=Path(zpath)
              with zipfile.ZipFile(zpath,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
                  for rel,b in files.items():
                      zi=zipfile.ZipInfo('vf-ops/'+rel,(2026,9,3,0,0,0)); zi.compress_type=zipfile.ZIP_DEFLATED; zi.external_attr=0o100644<<16; z.writestr(zi,b)
              return zpath.stat().st_size,hashlib.sha256(zpath.read_bytes()).hexdigest()
          base=runtime_files('/tmp/base-source','/tmp/base-runtime'); bc,bfp=identity(base); bbytes,bsha=build_zip(base,'/tmp/base-release.zip')
          assert bc==int(os.environ['BASE_RUNTIME_FILES']), (bc,os.environ['BASE_RUNTIME_FILES'])
          assert bfp==os.environ['BASE_RUNTIME_FP'], (bfp,os.environ['BASE_RUNTIME_FP'])
          assert bbytes==int(os.environ['BASE_ASSET_BYTES']), (bbytes,os.environ['BASE_ASSET_BYTES'])
          assert bsha==os.environ['BASE_ASSET_SHA256'], (bsha,os.environ['BASE_ASSET_SHA256'])
          cand=runtime_files('/tmp/candidate-source','/tmp/candidate-runtime'); count,fp=identity(cand)
          added=sorted(set(cand)-set(base)); removed=sorted(set(base)-set(cand))
          assert added==['includes/site-release/final-domain-authority.php'], added
          assert removed==[], removed
          zpath='/tmp/release/'+os.environ['ASSET_NAME']; asset_bytes,asset_sha=build_zip(cand,zpath)
          meta={'target_commit':os.environ['TARGET_COMMIT'],'target_tree':os.environ['TARGET_TREE'],'version':os.environ['VERSION'],'asset_name':os.environ['ASSET_NAME'],'asset_bytes':asset_bytes,'asset_sha256':asset_sha,'runtime_files':count,'runtime_fingerprint':fp,'runtime_added':added,'candidate_gate_run':int(os.environ['CANDIDATE_GATE_RUN']),'packaging_calibration':'PASS'}
          Path(os.environ['EVIDENCE_DIR']+'/artifact-identity.json').write_text(json.dumps(meta,indent=2)+'\n')
          print(json.dumps(meta,indent=2))
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'ASSET_BYTES={asset_bytes}\nASSET_SHA256={asset_sha}\nRUNTIME_FILES={count}\nRUNTIME_FP={fp}\n')
          PY
          unzip -tq "/tmp/release/$ASSET_NAME" >/dev/null
          echo PACKAGING_CALIBRATION_1_21_798=PASS
          echo EXACT_RELEASE_ARTIFACT=PASS

      - name: Verify release absence
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(curl -sS -o /tmp/tag.json -w '%{http_code}' -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${TARGET_REPOSITORY}/git/ref/tags/${TAG}")" = 404
          test "$(curl -sS -o /tmp/release.json -w '%{http_code}' -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${TARGET_REPOSITORY}/releases/tags/${TAG}")" = 404

      - name: Create exact tag and release
        shell: bash
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          jq -n --arg ref "refs/tags/${TAG}" --arg sha "$TARGET_COMMIT" '{ref:$ref,sha:$sha}' >/tmp/tag-create.json
          curl -fsSL -X POST -H "Authorization: Bearer $WRITE_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' "https://api.github.com/repos/${TARGET_REPOSITORY}/git/refs" --data-binary @/tmp/tag-create.json >/tmp/tag-created.json
          test "$(jq -r '.object.sha' /tmp/tag-created.json)" = "$TARGET_COMMIT"
          cat > /tmp/release-body.md <<EOF
          VF Tools Ops V1.21.799 reconciles S01 final-domain authority before Production static closure.

          - Current final public host authority is read from VF_PROJECT.json: https://ilovem3u8.com (apex, no www).
          - Known historical www.ilovem3u8.com / ilovem3u8.pages.dev release configuration is reconciled to the apex authority; unexpected third-party hosts fail closed and are never overwritten.
          - The repair lazy-loads Site Release transaction runtime only when a known legacy value is pending, so the first administrator request after upgrade can close the authority regardless of which admin screen opens first.
          - Legacy static/online PASS and freeze evidence bound to the old host is invalidated and must be regenerated.
          - Static ZIP inspection preview fallback now derives the target from project authority instead of the retired www literal.
          - WordPress 7.1 / MariaDB 11.4 Candidate Gate ${CANDIDATE_GATE_RUN}: PASS, including direct 1.21.797 -> 1.21.799 upgrade.
          - No post-content write, M3U8 write/migration, Seed HOLD release, JD.gg removal, WPvivid removal, or plugin-governance mutation.
          - Exact release tree: ${TARGET_TREE}.
          - Release source commit: ${TARGET_COMMIT}.
          - Asset SHA256: ${ASSET_SHA256}.
          - Runtime files: ${RUNTIME_FILES}.
          - Runtime fingerprint: ${RUNTIME_FP}.
          - Production upgrade is NOT executed by this GitHub Release.
          EOF
          jq -n --arg tag "$TAG" --arg name "$RELEASE_NAME" --rawfile body /tmp/release-body.md '{tag_name:$tag,name:$name,body:$body,draft:false,prerelease:false}' >/tmp/release-create.json
          curl -fsSL -X POST -H "Authorization: Bearer $WRITE_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' "https://api.github.com/repos/${TARGET_REPOSITORY}/releases" --data-binary @/tmp/release-create.json >/tmp/release-created.json
          RID="$(jq -r '.id' /tmp/release-created.json)"; test -n "$RID"; test "$RID" != null; echo "RELEASE_ID=$RID" >> "$GITHUB_ENV"

      - name: Upload exact artifact
        shell: bash
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          curl -fsSL -X POST -H "Authorization: Bearer $WRITE_TOKEN" -H 'Content-Type: application/zip' "https://uploads.github.com/repos/${TARGET_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${ASSET_NAME}" --data-binary "@/tmp/release/$ASSET_NAME" >/tmp/asset-created.json
          AID="$(jq -r '.id' /tmp/asset-created.json)"; test -n "$AID"; test "$AID" != null
          test "$(jq -r '.name' /tmp/asset-created.json)" = "$ASSET_NAME"
          test "$(jq -r '.size' /tmp/asset-created.json)" = "$ASSET_BYTES"
          echo "ASSET_ID=$AID" >> "$GITHUB_ENV"

      - name: Remote exact readback
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          TAG_JSON="$(curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${TARGET_REPOSITORY}/git/ref/tags/${TAG}")"
          REL_JSON="$(curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${TARGET_REPOSITORY}/releases/tags/${TAG}")"
          test "$(jq -r '.object.sha' <<<"$TAG_JSON")" = "$TARGET_COMMIT"
          test "$(jq -r '.id' <<<"$REL_JSON")" = "$RELEASE_ID"
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.id' <<<"$REL_JSON")" = "$ASSET_ID"
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.size' <<<"$REL_JSON")" = "$ASSET_BYTES"
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.digest' <<<"$REL_JSON")" = "sha256:${ASSET_SHA256}"
          printf '%s\n' "$TAG_JSON" > "$EVIDENCE_DIR/tag-readback.json"
          printf '%s\n' "$REL_JSON" > "$EVIDENCE_DIR/release-readback.json"
          jq -n --arg version "$VERSION" --arg target "$TARGET_COMMIT" --arg tree "$TARGET_TREE" --arg asset "$ASSET_NAME" --arg sha "$ASSET_SHA256" --argjson bytes "$ASSET_BYTES" --argjson files "$RUNTIME_FILES" --arg fp "$RUNTIME_FP" --argjson release_id "$RELEASE_ID" --argjson asset_id "$ASSET_ID" --argjson gate "$CANDIDATE_GATE_RUN" '{version:$version,target_commit:$target,target_tree:$tree,candidate_gate_run:$gate,release_id:$release_id,asset_id:$asset_id,asset_name:$asset,asset_bytes:$bytes,asset_sha256:$sha,runtime_files:$files,runtime_fingerprint:$fp,status:"PASS"}' > "$EVIDENCE_DIR/release-summary.json"
          cat "$EVIDENCE_DIR/release-summary.json"

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-v121799-formal-release
          path: /tmp/s01-c02-v121799-formal-release/
          if-no-files-found: warn
          retention-days: 14
