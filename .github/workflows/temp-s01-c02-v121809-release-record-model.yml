name: TEMP S01-C02 Ops Release Record Model
on:
  push:
    branches: [temp/s01-c02-v121809-production-readback-20260904]
    paths: ['.github/workflows/temp-s01-c02-v121809-release-record-model.yml']
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Extract release record and history authority
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone -q --branch main "https://x-access-token:${R}@github.com/llhzx2018/vf-tools-ops.git" ops
          cd ops
          test "$(git rev-parse HEAD)" = 'e4c5fc3dece349ca23f0fea361d55709d4b3f82c'
          echo '=== LOCATORS ==='
          grep -RIn --include='*.php' -E 'function[[:space:]]+vf_toolsite_cf_release_(record|history|option_key)|vf_toolsite_cf_release_history\(|vf_toolsite_cf_release_record\(' . | sed -n '1,300p'
          echo '=== CONTEXTS ==='
          while IFS=: read -r f n rest; do start=$(( n>30 ? n-30 : 1 )); end=$((n+110)); echo "--- $f:$n ---"; sed -n "${start},${end}p" "$f"; done < <(grep -RIn --include='*.php' -E 'function[[:space:]]+vf_toolsite_cf_release_(record|history|option_key)' . | head -n 20)
          echo '=== ACTIVE RELEASE JOB WRITES ==='
          grep -RIn --include='*.php' -E "active_release_job|candidate_async_job|inspection_job|promoted_from_inspection_job|upload_mode" . | sed -n '1,500p'
          echo 'PASS_RELEASE_RECORD_MODEL'
