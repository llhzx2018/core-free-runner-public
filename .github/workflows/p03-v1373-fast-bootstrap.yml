name: P03 V1.37.3 Portfolio Bootstrap Fast Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p03-v1373-fast-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  P03_REPOSITORY: llhzx2018/vf-forge
  P03_COMMIT: 06604154b3ae8b26b222a14b7961a6fc4709c7c3

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact private P03 bootstrap work
        uses: actions/checkout@v4
        with:
          repository: ${{ env.P03_REPOSITORY }}
          ref: ${{ env.P03_COMMIT }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: p03

      - name: Verify Schema 30 bootstrap contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 sqlite3 >/dev/null
          cd p03
          test "$(git rev-parse HEAD)" = "$P03_COMMIT"
          test "$(cat database/schema/SCHEMA_VERSION)" = '30'
          php -l src/app/PortfolioIntelligenceBootstrapService.php >/dev/null
          php -l public/intelligence-api.php >/dev/null
          php -l public/index.php >/dev/null
          node --check public/assets/project-intelligence-v1373.js
          php tests/integration/portfolio_intelligence_bootstrap_test.php
          rm -rf "$RUNNER_TEMP/runtime"
          python3 scripts/build_runtime.py "$RUNNER_TEMP/runtime" >/dev/null
          test -f "$RUNNER_TEMP/runtime/app/PortfolioIntelligenceBootstrapService.php"
          test -f "$RUNNER_TEMP/runtime/assets/project-intelligence-v1373.js"
          test -f "$RUNNER_TEMP/runtime/intelligence-api.php"
          ! find "$RUNNER_TEMP/runtime" -type f | grep -E '(/database/|\.sqlite3?$|\.db$|/PRIVATE_DATA/|/uploads/|/session/|/logs/|/tmp/)'
          echo 'P03_V1373_FAST_BOOTSTRAP=PASS'
          echo 'SCHEMA=30'
          echo 'MIGRATION=NONE'
          echo 'PROJECT_ASSET_STORAGE=NONE'
          echo 'PRODUCTION_WRITE=NO'
