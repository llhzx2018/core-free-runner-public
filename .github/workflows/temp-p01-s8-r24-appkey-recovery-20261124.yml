name: TEMP P01 S8 R24 encrypted recovery application-key integrity
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temp-p01-s8-r24-appkey-recovery-20261124.yml
permissions:
  contents: read
concurrency:
  group: p01-s8-r24-appkey-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  appkey-recovery:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'test/p01-s8-r24-appkey-recovery-')
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - name: Exact private source in disposable test worktree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-startnew
          ref: a5f95c5164eda416c402f85d642b8235870530d5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
          fetch-depth: 1
      - name: Exact source identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C private-src rev-parse HEAD)" = "a5f95c5164eda416c402f85d642b8235870530d5"
          echo P01_R24_KEY_EXACT_SOURCE=PASS
      - name: PHP 8.4 native encrypted snapshot test runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, sodium, zip, dom, xml, fileinfo, curl, openssl
          tools: composer:v2
          coverage: none
      - name: Verify key format, offline recovery, and isolated SQLite negative
        working-directory: private-src
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          python3 scripts/check_php_syntax.py > "$RUNNER_TEMP/p01-r24-key-lint.log" 2>&1
          echo P01_R24_KEY_PHP_LINT=PASS
          composer install --no-interaction --prefer-dist --no-progress --quiet > "$RUNNER_TEMP/p01-r24-key-composer.log" 2>&1
          echo P01_R24_KEY_COMPOSER=PASS
          export APP_ENV=testing DB_CONNECTION=sqlite DB_DATABASE=:memory:
          export APP_KEY="base64:$(openssl rand -base64 32)"
          export CACHE_STORE=array SESSION_DRIVER=array QUEUE_CONNECTION=sync
          set +e
          ./vendor/bin/phpunit --log-junit "$RUNNER_TEMP/p01-r24-key-junit.xml" \
            tests/Unit/InstallationRuntimeApplicationKeyTest.php \
            tests/Unit/InstalledBackupRecoveryReviewTest.php \
            tests/Unit/InstalledSqliteIsolatedRecoveryTest.php > "$RUNNER_TEMP/p01-r24-key-phpunit.log" 2>&1
          rc=$?
          set -e
          python3 - "$RUNNER_TEMP/p01-r24-key-junit.xml" <<'PY'
          import pathlib,sys,re,xml.etree.ElementTree as ET
          p=pathlib.Path(sys.argv[1])
          if not p.is_file():
              print('P01_R24_KEY_JUNIT=MISSING')
              sys.exit(1)
          cases=list(ET.parse(p).getroot().iter('testcase'))
          skipped=sum(c.find('skipped') is not None for c in cases)
          failed=sum(c.find('failure') is not None or c.find('error') is not None for c in cases)
          assertions=sum(int(c.get('assertions','0')) for c in cases)
          print('P01_R24_KEY_JUNIT='+','.join(map(str,(len(cases),assertions,skipped,failed))))
          for c in cases:
              if c.find('failure') is None and c.find('error') is None: continue
              print('P01_R24_KEY_FAILED_METHOD='+re.sub('[^A-Za-z0-9_]', '',c.get('name',''))[:118])
          if len(cases)<25 or assertions<80 or skipped or failed: sys.exit(1)
          PY
          if [ "$rc" -ne 0 ]; then echo P01_R24_KEY_NATIVE_TEST=FAIL; exit "$rc"; fi
          echo P01_R24_KEY_NATIVE_TEST=PASS
      - name: Always scrub private source and synthetic plaintext
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- private-src
          rm -f -- "$RUNNER_TEMP"/p01-r24-key-*
          test ! -e private-src
          echo P01_R24_KEY_PRIVATE_CLEANUP=PASS
