name: TEMP S01-C03 1.25.6 Core Updates Publication Gate

on:
  push:
    branches:
      - temp/s01-release-prep-gate-20260902
    paths:
      - .github/workflows/temp-s01-c03-1.25.6-core-updates-publication-gate.yml

permissions:
  contents: read

jobs:
  publication-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CORE_BASE_SHA: 3a866418c2c9dcef1a99f3196e0609bb04d498db
      CORE_CANDIDATE_SHA: 91ca3c387809bc2ef52627b69485a871cfc85924
      M3U8_SHA: 595f5b65ee1eb4ad75ed3a880a733e1f765060ed
      RELEASE_TAG: v1.25.6
      ASSET_NAME: vf-tools-m3u8_V1.25.6.zip
      ASSET_BYTES: '3529423'
      ASSET_SHA256: 9debe63077c3b8b939795d29e5cab9649149247c13feb99f3d96f1f6a3ea2106
      RUNTIME_FILES: '548'
      RUNTIME_FP: 55430edf5059b424e717197162a526999a9b8532e9ea6789440141bd5fed2d86
      RELEASED_AT: '2026-09-02T17:24:49Z'
      EVIDENCE_DIR: /tmp/s01-c03-1.25.6-core-updates-publication-evidence
    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CORE_CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
          path: core-updates

      - name: Checkout exact M3U8 release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: ${{ env.M3U8_SHA }}
          fetch-depth: 1
          persist-credentials: false
          path: m3u8

      - name: Gate exact shared-main boundary and manifest identity
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          test "$(git -C core-updates rev-parse HEAD)" = "$CORE_CANDIDATE_SHA"
          live_main="$(git ls-remote https://github.com/llhzx2018/core-updates.git refs/heads/main | awk '{print $1}')"
          test "$live_main" = "$CORE_BASE_SHA"
          test "$(git -C core-updates merge-base "$CORE_BASE_SHA" "$CORE_CANDIDATE_SHA")" = "$CORE_BASE_SHA"
          test "$(git -C core-updates rev-parse "$CORE_CANDIDATE_SHA^")" = "$CORE_BASE_SHA"
          git -C core-updates diff --name-only "$CORE_BASE_SHA" "$CORE_CANDIDATE_SHA" > /tmp/core-files.txt
          test "$(wc -l < /tmp/core-files.txt | tr -d ' ')" = '1'
          grep -Fxq 'projects/S01-C03.json' /tmp/core-files.txt
          test "$(git -C core-updates diff --numstat "$CORE_BASE_SHA" "$CORE_CANDIDATE_SHA" | awk '{a+=$1;d+=$2} END{print a ":" d}')" = '12:12'
          git -C core-updates diff --check "$CORE_BASE_SHA" "$CORE_CANDIDATE_SHA"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          m=json.loads(Path('core-updates/projects/S01-C03.json').read_text())
          assert m['schema_version']=='wp-component-1.0'
          assert m['project_id']=='S01' and m['component_id']=='S01-C03' and m['component_type']=='PLUGIN'
          assert m['package_id']=='vf-tools-m3u8' and m['package_slug']=='vf-tool-m3u8' and m['product_slug']=='vf-tools-m3u8'
          assert m['plugin_file']=='vf-tool-m3u8/vf-tool-m3u8.php' and m['physical_locator']==m['plugin_file']
          assert m['canonical_locator']=='vf-tools-m3u8/vf-tools-m3u8.php' and m['locator_cutover'] is False
          assert m['enabled'] is True
          assert m['target_version']=='1.25.6'
          assert m['from_versions']==['1.25.6']
          assert '1.25.4' not in m['from_versions'] and '1.25.5' not in m['from_versions']
          assert m['repository']=='llhzx2018/vf-tools-m3u8' and m['release_tag']==os.environ['RELEASE_TAG']
          assert m['asset_name']==os.environ['ASSET_NAME'] and m['asset_bytes']==int(os.environ['ASSET_BYTES']) and m['asset_sha256']==os.environ['ASSET_SHA256']
          assert m['schema_from']=='1.3.0' and m['schema_to']=='1.3.0'
          assert m['backup_required'] is True and m['rollback_supported'] is True
          assert m['runtime_contract']=='VF_WP_COMPONENT_RUNTIME_AUTHORITY_V1'
          assert m['runtime_files']==int(os.environ['RUNTIME_FILES']) and m['runtime_file_count']==int(os.environ['RUNTIME_FILES'])
          assert m['runtime_fingerprint']==os.environ['RUNTIME_FP'] and m['runtime_fingerprint_sha256']==os.environ['RUNTIME_FP']
          assert m['released_at']==os.environ['RELEASED_AT']
          notes=m['notes']
          for needle in ['33660475727','9858539976','33658155154','9857593707','33661407367','Production Upgrade is NOT EXECUTED','1.25.4','1.25.5','WP-CLI']:
              assert needle in notes, needle
          print('S01-C03 1.25.6 manifest exact identity PASS')
          PY

      - name: Gate fail-closed Native Update source semantics
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq "in_array(\$this->current_version,array_map('strval',\$m['from_versions']),true)" m3u8/src/includes/update/class-vf-m3u8-update-client-v1.php
          grep -Fq "version_compare((string)\$m['target_version'],\$this->current_version,'<=')" m3u8/src/includes/update/class-vf-m3u8-update-client-v1.php
          python3 - <<'PY'
          allowed=['1.25.6']; target='1.25.6'
          assert '1.25.4' not in allowed
          assert '1.25.5' not in allowed
          assert '1.25.6' in allowed and target=='1.25.6'
          print('S01-C03 legacy Native Update sources fail-closed PASS')
          PY

      - name: Gate exact Runtime Authority identity
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib, os, re
          from pathlib import Path
          root=Path('m3u8/src')
          files={}
          for p in root.rglob('*'):
              if not p.is_file() or p.is_symlink():
                  continue
              rel=p.relative_to(root).as_posix()
              if rel=='' or '../' in rel:
                  continue
              if re.search(r'(^|/)(?:\.git|\.github|tests?|docs?|evidence|private|tmp|temp|cache|logs?)(/|$)', rel, re.I):
                  continue
              base=p.name.lower()
              if base in {'readme.md','changelog.md','license','license.txt','package_profile.json'}:
                  continue
              if re.search(r'\.(?:sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$', rel, re.I):
                  continue
              if '/' not in rel:
                  ok=rel in {'vf-tool-m3u8.php','uninstall.php','plugin-manifest.json','tool-settings.schema.json'}
              else:
                  ok=re.match(r'^(?:admin|config|includes|public|templates|tools)/', rel) is not None
              if ok:
                  files[rel]=hashlib.sha256(p.read_bytes()).hexdigest()
          canonical=''.join(path+'\0'+files[path]+'\n' for path in sorted(files)).encode()
          fp=hashlib.sha256(canonical).hexdigest()
          assert len(files)==int(os.environ['RUNTIME_FILES']), (len(files), fp)
          assert fp==os.environ['RUNTIME_FP'], fp
          print(f'S01-C03 Runtime Authority PASS files={len(files)} fp={fp}')
          PY

      - name: Gate formal GitHub Release and deterministic asset
        shell: bash
        run: |
          set -Eeuo pipefail
          tag_sha="$(git ls-remote https://github.com/llhzx2018/vf-tools-m3u8.git "refs/tags/$RELEASE_TAG" | awk '{print $1}')"
          test "$tag_sha" = "$M3U8_SHA"
          curl -fsSL -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' -H 'User-Agent: S01-C03-Publication-Gate' \
            "https://api.github.com/repos/llhzx2018/vf-tools-m3u8/releases/tags/$RELEASE_TAG" > /tmp/release.json
          jq -e --arg sha "$M3U8_SHA" --arg name "$ASSET_NAME" --argjson bytes "$ASSET_BYTES" --arg digest "sha256:$ASSET_SHA256" --arg published "$RELEASED_AT" \
            '.draft==false and .prerelease==false and .tag_name=="v1.25.6" and .target_commitish==$sha and .published_at==$published and (.assets|length)==1 and .assets[0].name==$name and .assets[0].size==$bytes and .assets[0].digest==$digest' /tmp/release.json >/dev/null
          url="$(jq -r '.assets[0].browser_download_url' /tmp/release.json)"
          curl -fsSL "$url" -o /tmp/asset.zip
          test "$(stat -c%s /tmp/asset.zip)" = "$ASSET_BYTES"
          test "$(sha256sum /tmp/asset.zip | awk '{print $1}')" = "$ASSET_SHA256"
          unzip -tq /tmp/asset.zip >/dev/null
          echo 'S01-C03 formal Release asset PASS'

      - name: Seal publication evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$EVIDENCE_DIR/S01_C03_1_25_6_CORE_UPDATES_PUBLICATION_GATE.txt" <<EOF
          S01_C03_1_25_6_CORE_UPDATES_PUBLICATION_GATE=PASS
          CORE_BASE_SHA=$CORE_BASE_SHA
          CORE_CANDIDATE_SHA=$CORE_CANDIDATE_SHA
          CORE_DIFF_ONLY=projects/S01-C03.json
          CORE_DIFF_NUMSTAT=12:12
          M3U8_SHA=$M3U8_SHA
          M3U8_VERSION=1.25.6
          M3U8_ROUND=R230
          RELEASE_TAG=$RELEASE_TAG
          ASSET_NAME=$ASSET_NAME
          ASSET_BYTES=$ASSET_BYTES
          ASSET_SHA256=$ASSET_SHA256
          RUNTIME_FILES=$RUNTIME_FILES
          RUNTIME_FINGERPRINT_SHA256=$RUNTIME_FP
          FROM_VERSIONS_FAIL_CLOSED=1.25.6_ONLY
          LEGACY_1_25_4_NATIVE_UPDATE=BLOCKED
          LEGACY_1_25_5_NATIVE_UPDATE=BLOCKED
          PRODUCTION_BOOTSTRAP_PATH=WP_CLI_SOURCE_ONLY_GATED
          PROVIDER_SCHEMA_REPAIR=SEPARATE_EXPLICIT_ACTION
          PRODUCTION_WRITE=NO
          FORCE_PUSH=NO
          NEW_RUNNER=NO
          NEW_SECRET=NO
          NEW_SSH=NO
          EOF
          cat "$EVIDENCE_DIR/S01_C03_1_25_6_CORE_UPDATES_PUBLICATION_GATE.txt"

      - name: Upload exact publication evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c03-1.25.6-core-updates-publication-gate-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}/
          if-no-files-found: error
          retention-days: 14
