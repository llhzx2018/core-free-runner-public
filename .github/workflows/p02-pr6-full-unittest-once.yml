# One-shot P02 PR #6 unittest evidence. TEMP branch/PR: close without merge.
# Private source is transient; public logs carry only count/status.
name: TEMP P02 PR6 exact-source full Python unittest
on:
  pull_request:
    branches: [main]
    types: [opened]
    paths:
      - '.github/workflows/p02-pr6-full-unittest-once.yml'
permissions:
  contents: read
concurrency:
  group: p02-pr6-full-unittest-once
  cancel-in-progress: false
jobs:
  exact-python:
    if: >-
      github.actor == 'llhzx2018' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public' &&
      github.event.pull_request.head.ref == 'test/p02-pr6-full-python-6868bd59' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.state == 'open'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Admit single scoped transient checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_REPOSITORY" = llhzx2018/core-free-runner-public
          test "$GITHUB_ACTOR" = llhzx2018
          scope="p02-pr6-${GITHUB_RUN_ID}"
          test ! -e "$scope" && test ! -L "$scope" || { echo P02_PR6_STALE_SCOPE=FAIL; exit 2; }
      - name: Transient checkout pinned private P02 PR6 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-doc
          ref: 6868bd59f9c54be72299fb6f6f9ab5221234c97b
          path: p02-pr6-${{ github.run_id }}/source
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Execute full unittest with source and tree identity
        shell: bash
        working-directory: p02-pr6-${{ github.run_id }}/source
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          test "$(git rev-parse HEAD)" = 6868bd59f9c54be72299fb6f6f9ab5221234c97b
          test "$(git rev-parse HEAD^{tree})" = 4f28c4db30dced8be8233791f9964c0ea8471f3e
          test -z "$(git status --porcelain)"
          echo P02_PR6_EXACT_SOURCE=6868bd59f9c54be72299fb6f6f9ab5221234c97b
          echo P02_PR6_EXACT_TREE=4f28c4db30dced8be8233791f9964c0ea8471f3e
          output="$(mktemp)"
          trap 'rm -f -- "$output"' EXIT
          status=0
          python3 -B -m unittest discover -s tests -p 'test_*.py' -v >"$output" 2>&1 || status=$?
          summary="$(grep -E '^Ran [0-9]+ tests? in [0-9.]+s$' "$output" | tail -n 1 || true)"
          count="$(printf '%s' "$summary" | awk '{print $2}')"
          if [[ "$count" =~ ^[0-9]+$ ]]; then
            echo "P02_PR6_UNITTEST_TESTS=$count"
          else
            echo P02_PR6_UNITTEST_TESTS=NOT_PROVEN
          fi
          newcases="$(grep -Ec '^test_[^ ]+ \(test_p02_hyperv_git_https_transport\.' "$output" || true)"
          echo "P02_PR6_NEW_TRANSPORT_TESTS=$newcases"
          if [ "$status" -ne 0 ]; then
            echo P02_PR6_FULL_PYTHON_UNITTEST=FAIL
            exit 1
          fi
          test "$count" -ge 46
          test "$newcases" -eq 11
          grep -qx 'OK' "$output" || { echo P02_PR6_UNITTEST_SUMMARY_UNEXPECTED; exit 1; }
          echo P02_PR6_FULL_PYTHON_UNITTEST=PASS
      - name: Delete all transient private data and verify cleanup
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          scope="p02-pr6-${GITHUB_RUN_ID}"
          test ! -L "$scope" || { echo P02_PR6_UNTRUSTED_SCOPE=FAIL; exit 2; }
          rm -rf -- "$scope"
          test ! -e "$scope"
          echo P02_PR6_PRIVATE_SOURCE_CLEANUP=PASS
          echo P02_PR6_PRIVATE_ARTIFACT_UPLOADED=NO
