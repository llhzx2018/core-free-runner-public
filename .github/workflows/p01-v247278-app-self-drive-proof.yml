name: P01 V2.47.278 Application Self Drive Proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p01-v247278-app-self-drive-proof.yml"

permissions:
  contents: read

jobs:
  proof:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'proof(P01): V2.47.278 application self drive')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd nodejs >/dev/null

      - name: Clone exact candidate and stable
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" candidate
          git -C candidate fetch -q origin 2b7af7092b7de37185e4eaf42c69084702806df9
          git -C candidate checkout -q --detach 2b7af7092b7de37185e4eaf42c69084702806df9
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.278"
          git clone -q --depth 1 --branch v2.47.277 "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" stable
          echo P01_V247278_EXACT_SOURCE=PASS

      - name: Syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in             candidate/src/app/JobManager.php             candidate/src/app/SystemHealth.php             candidate/src/app/AdminShell.php             candidate/src/app/FunctionalWorkspaceShell.php             candidate/src/api.php             candidate/src/jobs.php             candidate/src/system-health.php             candidate/src/cli/worker.php             candidate/tests/unit/application_self_drive_scheduler_v247278_contract.php             candidate/tests/unit/application_self_drive_scheduler_v247278_runtime_proof.php             candidate/tests/unit/system_health_cron_runtime_proof.php; do
            php -l "$f"
          done
          node --check candidate/src/assets/auto-tasks.js
          node --check candidate/src/assets/jobs.js
          node --check candidate/src/assets/system.js
          echo P01_V247278_SYNTAX=PASS

      - name: Focused contracts and runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          php tests/unit/application_self_drive_scheduler_v247278_contract.php
          php tests/unit/application_self_drive_scheduler_v247278_runtime_proof.php
          php tests/unit/system_health_cron_diagnostic_contract.php
          php tests/unit/system_health_cron_runtime_proof.php
          php tests/unit/admin_scheduled_tasks_center_contract.php
          php tests/unit/backend_ia_round5_system_v247273_contract.php
          php tests/unit/admin_system_group_readability_r82_contract.php
          php tests/unit/admin_system_closure_contract.php
          php tests/unit/admin_backend_closure_contract.php
          echo P01_V247278_FOCUSED=PASS

      - name: Canonical regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate stable --require-zero-debt | tee /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/canonical.txt
          echo P01_V247278_CANONICAL=PASS

      - name: Bounded scope
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C candidate diff --name-only cae8f65c21ab9041ef1ad5c1a96482347c726f0e..2b7af7092b7de37185e4eaf42c69084702806df9 | tee /tmp/changed.txt
          if grep -E '(^|/)(migrations|schema|update-manager|setup|install)' /tmp/changed.txt; then
            echo "Unexpected migration/installer/updater scope"; exit 1
          fi
          grep -Fx 'src/app/JobManager.php' /tmp/changed.txt
          grep -Fx 'src/app/SystemHealth.php' /tmp/changed.txt
          grep -Fx 'src/assets/auto-tasks.js' /tmp/changed.txt
          grep -Fx 'docs/authority/ACCEPTANCE_MATRIX.md' /tmp/changed.txt
          echo P01_V247278_BOUNDED_SCOPE=PASS
          echo PRODUCTION_WRITE=NO
