name: P01 V2.21.18 System Chrome Observer
on:
  push:
    branches: [vf-agent-operations-v1]
    paths: ['.github/workflows/p01-v2.21.18-system-chrome-observer.yml']
permissions:
  actions: read
  contents: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    env:
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,os,urllib.request,base64,urllib.error
          token=os.environ['GH_TOKEN'];w='p01-v2.21.18-system-chrome-regression.yml';repo=os.environ['GITHUB_REPOSITORY'];h={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28'}
          u=f'https://api.github.com/repos/{repo}/actions/workflows/{w}/runs?branch=vf-agent-operations-v1&per_page=5'
          with urllib.request.urlopen(urllib.request.Request(u,headers=h),timeout=20) as r:d=json.load(r)
          runs=[{k:x.get(k) for k in ['id','status','conclusion','head_sha','run_attempt','created_at','updated_at']} for x in d.get('workflow_runs',[])]
          p={'schema':'vf-public-runner-observation/v1','project_id':'P01','target_version':'2.21.18','gate':'SYSTEM_CHROME_OBSERVER','runs':runs}
          out=json.dumps(p,indent=2,sort_keys=True)+'\n';wt=os.environ['VF_RELEASE_WRITE_TOKEN'];path='vf-agent/results/P01-V2.21.18-SYSTEM-CHROME-OBSERVER.json';api=f'https://api.github.com/repos/{repo}/contents/{path}';hw={'Accept':'application/vnd.github+json','Authorization':f'Bearer {wt}','X-GitHub-Api-Version':'2022-11-28'};sha=None
          try:
            with urllib.request.urlopen(urllib.request.Request(api+'?ref=vf-agent-operations-v1',headers=hw),timeout=20) as r:sha=json.load(r).get('sha')
          except urllib.error.HTTPError as e:
            if e.code!=404:raise
          body={'message':'evidence(P01): observe system Chrome regression','content':base64.b64encode(out.encode()).decode(),'branch':'vf-agent-operations-v1'}
          if sha:body['sha']=sha
          urllib.request.urlopen(urllib.request.Request(api,data=json.dumps(body).encode(),method='PUT',headers={**hw,'Content-Type':'application/json'}),timeout=20).read()
          PY
