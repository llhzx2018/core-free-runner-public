name: S01 Guides reference prototype render
on:
  push:
    branches: [design/s01-guides-reference-20261024]
    paths: ['.github/workflows/s01-guides-reference-20261024.yml']
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 32abd064c75d64c143be689046f2cfab61a0b4a2
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: theme
      - name: Render exact offline prototype without a server
        run: |
          set -euo pipefail
          test "$(git -C theme rev-parse HEAD)" = "32abd064c75d64c143be689046f2cfab61a0b4a2"
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -g -fsSL --retry 2 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC[wght].ttf' -o "$HOME/.local/share/fonts/NotoSansSC.ttf"
          fc-cache -f
          NODE_PATH="$PWD/node_modules" node theme/docs/prototypes/2026-10-24-guides-directory/render-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-guides-reference-${{ github.run_id }}
          path: |
            theme/docs/prototypes/2026-10-24-guides-directory/*.png
            theme/docs/prototypes/2026-10-24-guides-directory/prototype-checks.json
          retention-days: 14
      - name: Cleanup private source
        if: always()
        run: rm -rf theme
