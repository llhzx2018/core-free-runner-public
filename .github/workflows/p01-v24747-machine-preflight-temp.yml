name: p01-v24747-machine-preflight-temp

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v24747-machine-preflight-temp.yml'
      - 'requests/p01-v24747-machine-preflight-20260924.json'
      - 'scripts/p01_build_v24747_formal.py'
      - 'scripts/p01_v24747_formal_gate.sh'

permissions:
  contents: read

jobs:
  machine-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LANE_SPEC: requests/p01-v24747-machine-preflight-20260924.json
    steps:
      - name: Checkout runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate lane
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ephemeral_lane_spec.py validate --spec "$LANE_SPEC" >/tmp/lane.json
          python3 scripts/ephemeral_lane_spec.py github-output --spec "$LANE_SPEC" >> "$GITHUB_ENV"
          grep -F '"status": "PASS"' /tmp/lane.json >/dev/null

      - name: Checkout exact V2.47.47 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 3e4ffd768a29d82aeb439bf97cc1e690ad0ddc10
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: candidate

      - name: Verify exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$target_sha"
          test "$(git -C candidate rev-parse 'HEAD^{tree}')" = "$target_tree"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "$target_version"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "$target_version"
          echo P01_V24747_RELEASE_SOURCE=PASS

      - name: Download V2.47.46 formal baseline assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-rel46
          gh release download v2.47.46 -R llhzx2018/vf-start -D /tmp/p01-rel46             -p 'VF-Start-V2.47.46-FULL.zip'             -p 'VF_Start_V2.47.46_UPDATE.zip'
          sha256sum /tmp/p01-rel46/*.zip
          mkdir -p /tmp/p01-rel46/update /tmp/p01-rel46/full
          unzip -q /tmp/p01-rel46/VF_Start_V2.47.46_UPDATE.zip -d /tmp/p01-rel46/update
          unzip -q /tmp/p01-rel46/VF-Start-V2.47.46-FULL.zip -d /tmp/p01-rel46/full
          test -f /tmp/p01-rel46/update/repair-v2.47.46.php
          test "$(tr -d '\r\n ' </tmp/p01-rel46/full/VERSION.txt)" = "2.47.46"
          echo P01_V24746_FORMAL_BASELINE_READBACK=PASS

      - name: Prepare formal runtime dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd unzip jq >/dev/null
          php -m | grep -Fx pdo_sqlite
          php -m | grep -Fx sqlite3
          php -m | grep -Fx curl
          php -m | grep -Fx gd

      - name: Checkout exact V2.47.46 stable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: v2.47.46
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: stable

      - name: Canonical release regression in isolated worktree
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C stable rev-parse HEAD)" = "2e31cf1b78fc4fc1958138e99a7fd1fd1c57efa1"
          stable_abs="$(realpath stable)"
          python3 scripts/ephemeral_lane_worktree.py run-isolated             --spec "$LANE_SPEC"             --repo candidate             --label "p01-v24747-formal-canonical"             -- bash tests/canonical_release_regression.sh . "$stable_abs"             | tee /tmp/p01-v24747-canonical-isolated.txt
          grep -F '"status": "PASS"' /tmp/p01-v24747-canonical-isolated.txt >/dev/null
          grep -F '"source_unchanged": true' /tmp/p01-v24747-canonical-isolated.txt >/dev/null
          echo P01_V24747_CANONICAL_RELEASE_REGRESSION=PASS

      - name: Focused UI security and data-safety contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ephemeral_lane_worktree.py run-isolated             --spec "$LANE_SPEC"             --repo candidate             --label "p01-v24747-release-focused"             -- bash -lc '
              set -Eeuo pipefail
              php tests/unit/admin_all_resources_column_lock_r4_contract.php
              php tests/unit/admin_all_resources_visual_alignment_r3_contract.php
              php tests/unit/admin_all_resources_alignment_r2_contract.php
              php tests/unit/admin_all_resources_page3_polish_contract.php
              php tests/unit/admin_resource_browse_edit_r5_contract.php
              php tests/unit/resource_manager_pagination_context_contract.php
              php tests/unit/engineering_consistency_r80_contract.php
              php tests/unit/session_csrf_contract.php
              php tests/unit/update_csrf_recovery_contract.php
              php tests/unit/navigation_owner_behavior_privacy_contract.php
              php tests/unit/privacy_cache_performance_r2_contract.php
              php tests/integration/resource_asset_disaster_recovery_contract.php
            ' | tee /tmp/p01-v24747-focused.txt
          grep -F '"status": "PASS"' /tmp/p01-v24747-focused.txt >/dev/null
          grep -F '"source_unchanged": true' /tmp/p01-v24747-focused.txt >/dev/null
          echo P01_V24747_FOCUSED=PASS

      - name: Build and verify formal FULL and ATOMIC
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/p01_v24747_formal_gate.sh

      - name: Upload V2.47.47 formal candidate artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p01-v24747-machine-preflight
          path: /tmp/p01-v24747-artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Machine preflight artifact receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          cat /tmp/p01-v24747-artifacts/P01_V24747_ARTIFACT_RECEIPT.json
          echo P01_V24747_MACHINE_PREFLIGHT_READY=PASS
