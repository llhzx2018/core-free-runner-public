name: P01 V247291 core-updates exact discovery integrity gate
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v247291-distribution-proof.yml'
permissions:
  contents: read
jobs:
  verify-distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact core-updates P01 manifest candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: 5e86a91844d6e73c10f636e825dd52fbed0bf073
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Setup PHP and SQLite
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,curl,zip,mbstring
          coverage: none
      - name: Validate all update manifests and P01 asset identity
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          python3 scripts/check_manifest_contract.py
          python3 - <<'PY'
          import json,subprocess
          m=json.load(open('projects/P01.json',encoding='utf-8'))
          assert m['project_id']=='P01'
          assert m['current_version']=='2.47.289' and m['target_version']=='2.47.290'
          assert m['from_versions']==['2.47.290'] and m['update_type']=='ATOMIC'
          assert m['schema_from']==m['schema_to']=='2026090401'
          assert m['product_identity']=='bc568d6bbf3a45d93961184ce9ef6d2497a68856'
          assert m['backup_required'] and m['rollback_supported']
          assert m['release_id']==406735997 and m['release_tag']=='v2.47.291'
          assert __import__('os').environ.get('GH_TOKEN'), 'Registered read-only GitHub release metadata token required'
          release=json.loads(subprocess.check_output(['gh','api','repos/llhzx2018/vf-start/releases/tags/v2.47.291'],text=True))
          assert release['id']==m['release_id'] and release['tag_name']==m['release_tag']
          assert not release['draft'] and not release['prerelease']
          assets=[a for a in release['assets'] if a['name']==m['asset_name']]
          assert len(assets)==1
          a=assets[0]
          assert a['size']==m['asset_bytes']
          assert a['digest']=='sha256:'+m['asset_sha256']
          print('P01_V247291_DIST_RELEASE_EXACT_MATCH=PASS')
          PY
      - name: Run update core native regression
        shell: bash
        run: |
          set -Eeuo pipefail
          find update-core/php -name '*.php' -type f -print0 | xargs -0 -n1 php -l >/dev/null
          php update-core/php/tests/run.php
          echo P01_V247291_CORE_UPDATES_NATIVE=PASS
