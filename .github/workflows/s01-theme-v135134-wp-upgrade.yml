name: S01-C01 134 WordPress upgrade rollback smoke
on:
  push:
    branches: [task/s01-frontend-design-20261017]
    paths: ['.github/workflows/s01-theme-v135134-wp-upgrade.yml']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Retrieve private Theme formal release assets
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p old new
          gh release download v1.35.133 --repo llhzx2018/vf-tools-theme --pattern 'vf-tools-theme_V1.35.133.zip' --dir old
          gh release download v1.35.134 --repo llhzx2018/vf-tools-theme --pattern 'vf-tools-theme_V1.35.134.zip' --dir new
          echo '8a36ef59971316b7aa69c4f1df78f9305ee25097cc10f379156025ff151c8f3f  old/vf-tools-theme_V1.35.133.zip' | sha256sum -c
          echo '0ac191879cdb88f95350b29e3539a6f9bbb165b06867d25169c44c355b2472de  new/vf-tools-theme_V1.35.134.zip' | sha256sum -c
      - name: Real ephemeral WordPress install upgrade rollback
        run: |
          set -Eeuo pipefail
          docker run -d --name s01db -e MARIADB_ROOT_PASSWORD=synthetic -e MARIADB_DATABASE=wordpress -e MARIADB_USER=wp -e MARIADB_PASSWORD=synthetic mariadb:11.8.8
          docker run -d --name s01wp --link s01db:db -e WORDPRESS_DB_HOST=db -e WORDPRESS_DB_USER=wp -e WORDPRESS_DB_PASSWORD=synthetic -e WORDPRESS_DB_NAME=wordpress wordpress:7.1.2-php8.3-apache
          for i in $(seq 1 80); do docker exec s01db mariadb-admin ping -uroot -psynthetic --silent >/dev/null 2>&1 && break; sleep 2; done
          docker exec s01wp mkdir -p /var/www/html/wp-content/themes
          curl -fsSLo wp.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          docker cp wp.phar s01wp:/usr/local/bin/wp
          docker cp old/vf-tools-theme_V1.35.133.zip s01wp:/tmp/old.zip
          docker cp new/vf-tools-theme_V1.35.134.zip s01wp:/tmp/new.zip
          wp(){ docker exec --user www-data s01wp php /usr/local/bin/wp "$@" --path=/var/www/html; }
          for i in $(seq 1 80); do docker exec s01wp test -f /var/www/html/wp-settings.php && break; sleep 2; done
          wp core install --url=http://example.test --title=Synthetic --admin_user=admin --admin_password=synthetic-test-only --admin_email=synthetic@example.invalid --skip-email
          wp theme install /tmp/old.zip --activate
          test "$(wp theme get vf-tools-theme --field=version)" = '1.35.133'
          wp option update s01_upgrade_preserve 'original synthetic data'
          wp theme install /tmp/new.zip --force
          test "$(wp theme get vf-tools-theme --field=version)" = '1.35.134'
          test "$(wp option get s01_upgrade_preserve)" = 'original synthetic data'
          wp theme install /tmp/old.zip --force
          test "$(wp theme get vf-tools-theme --field=version)" = '1.35.133'
          test "$(wp option get s01_upgrade_preserve)" = 'original synthetic data'
          wp theme install /tmp/new.zip --force
          test "$(wp theme get vf-tools-theme --field=version)" = '1.35.134'
          echo 'REAL_WP_CLEAN_133_UPGRADE_134_ROLLBACK_133_REAPPLY_134=PASS'
      - name: Remove containers and private files
        if: always()
        run: |
          docker rm -f s01wp s01db >/dev/null 2>&1 || true
          rm -rf old new wp.phar
