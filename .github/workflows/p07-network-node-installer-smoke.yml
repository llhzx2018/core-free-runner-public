name: P07 Network Node Installer Smoke

on:
  push:
    paths:
      - 'installers/vf-node.sh'
      - 'packages/p07-network-node/0.1.0-rc8/**'
      - '.github/workflows/p07-network-node-installer-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-one-click-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Verify RC8 health UX contract and no user token dependency
        run: |
          set -euo pipefail
          bash -n installers/vf-node.sh
          if grep -nE '(VF_PRIVATE_READ_TOKEN|github_pat_|ghp_|read .*TOKEN|read .*PAT)' installers/vf-node.sh; then exit 30; fi
          grep -Fq "VERSION='0.1.0-rc8'" installers/vf-node.sh
          grep -Fq "MANIFEST_SHA256='2f9eff4af9da9f01bee9dc83e54d467d457669b3b5e1ef826e919372a04c1d8f'" installers/vf-node.sh
          grep -Fq 'p07_healthy()' installers/vf-node.sh
          grep -Fq 'repair_if_needed()' installers/vf-node.sh
          grep -Fq '安装异常 · 可自动修复' installers/vf-node.sh
          grep -Fq '安装 / 自动修复稳定节点' installers/vf-node.sh
          if grep -Fq '节点已就绪 · 下一步' installers/vf-node.sh; then exit 34; fi
          if grep -R -nF 'UNINSTALL_VF_NODE' installers/vf-node.sh packages/p07-network-node/0.1.0-rc8/uninstall.sh; then exit 36; fi
          echo 'P07_VF_NODE_RC8_HEALTH_AWARE_INSTALLER=PASS_STATIC'

      - name: Wait for exact raw RC8 installer
        run: |
          set -euo pipefail
          RAW='https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/vf-node.sh'
          matched=0
          for _ in $(seq 1 12); do
            curl -fsSL "$RAW" -o /tmp/vf-node-raw-installer.sh
            if cmp -s installers/vf-node.sh /tmp/vf-node-raw-installer.sh; then matched=1; break; fi
            sleep 5
          done
          test "$matched" = '1'
          echo 'P07_VF_NODE_RAW_BYTES_MATCH_CHECKOUT=PASS'

      - name: Run exact raw one-click fresh install in real TTY
        run: |
          set -euo pipefail
          RAW='https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/vf-node.sh'
          LOG=/tmp/vf-node-real-tty-install.log
          if ! printf '1\n\n0\n' | sudo script -qfec "env NO_COLOR=1 bash -c \"bash <(curl -fsSL '$RAW')\"" "$LOG" >/dev/null 2>&1; then
            sed -E -e 's#[0-9a-fA-F]{8}-[0-9a-fA-F-]{27,}#[REDACTED_UUID]#g' -e 's#vmess://[^[:space:]]+#vmess://[REDACTED]#g' "$LOG" | tail -n 180
            exit 1
          fi
          grep -Fq '状态   ● 未安装' "$LOG"
          grep -Fq '服务与 UDP 检查通过' "$LOG"
          grep -Fq '✓ 节点安装完成' "$LOG"
          grep -Fq 'vmess://' "$LOG"
          grep -Fq '按 Enter 返回菜单' "$LOG"
          grep -Fq '状态   ● 已安装 · 运行正常 · 0.1.0-rc8' "$LOG"
          if grep -Fq '节点已就绪 · 下一步' "$LOG"; then exit 31; fi
          if grep -Eq 'Source Identity|xyz690/v2ray @|Core Source Identity|固定 Profile 兼容层' "$LOG"; then exit 32; fi
          echo 'P07_VF_NODE_RC8_EXACT_ONE_CLICK_TTY=PASS'
          echo 'P07_VF_NODE_RC8_SINGLE_LAYER_UX=PASS'

      - name: Verify RC8 live state and healthy share
        run: |
          set -euo pipefail
          test "$(sudo env NO_COLOR=1 /usr/local/bin/vf-node --version)" = 'VF Network Node 0.1.0-rc8'
          sudo grep -Fq 'INSTALL_STATUS=HEALTHY' /etc/vf-node/state.env
          sudo systemctl is-active --quiet v2ray.service
          sudo env NO_COLOR=1 /usr/local/bin/vf-node check
          PORT="$(sudo sed -n 's/^PORT=//p' /etc/vf-node/state.env)"
          sudo ss -H -lun | awk '{print $4}' | grep -Eq "(^|[:.])${PORT}$"
          sudo env NO_COLOR=1 /usr/local/bin/vf-node url >/tmp/vf-node-url.txt 2>&1
          grep -Fq 'vmess://' /tmp/vf-node-url.txt
          chmod 0600 /tmp/vf-node-url.txt
          echo 'P07_VF_NODE_RC8_STATE_HEALTHY=PASS'
          echo 'P07_VF_NODE_RC8_SHARE_AFTER_HEALTH=PASS_REDACTED'

      - name: Verify guarded RC8 uninstall
        run: |
          set -euo pipefail
          LOG=/tmp/vf-node-public-uninstall.log
          printf '1\n' | sudo env NO_COLOR=1 bash installers/vf-node.sh uninstall >"$LOG" 2>&1
          grep -Fq '请选择 [0-1]：' "$LOG"
          ! sudo systemctl is-active --quiet v2ray.service
          test ! -e /etc/v2ray/config.json
          sudo test ! -e /etc/vf-node/state.env
          backup="$(sudo find /root/vf-node-backups -maxdepth 1 -type f -name 'vf-node-*.tar.gz' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          test -n "$backup"
          sudo test -f "$backup.sha256"
          sudo sha256sum -c "$backup.sha256" >/dev/null
          echo 'P07_VF_NODE_RC8_GUARDED_UNINSTALL=PASS'

  rc7-field-failure-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install historical RC7 managed node
        run: |
          set -euo pipefail
          PKG="$PWD/packages/p07-network-node/0.1.0-rc7"
          sudo mkdir -p /opt/vf-network-node/lib
          sudo cp "$PKG"/VERSION "$PKG"/vf-node.sh "$PKG"/install.sh "$PKG"/status.sh "$PKG"/share.sh "$PKG"/backup.sh "$PKG"/uninstall.sh /opt/vf-network-node/
          sudo cp "$PKG"/lib/common.sh "$PKG"/lib/core-pin.env "$PKG"/lib/patch_upstream_core.py /opt/vf-network-node/lib/
          sudo chmod 0755 /opt/vf-network-node/*.sh /opt/vf-network-node/lib/patch_upstream_core.py
          sudo tee /usr/local/bin/vf-node >/dev/null <<'EOF'
          #!/usr/bin/env bash
          exec "/opt/vf-network-node/vf-node.sh" "$@"
          EOF
          sudo chmod 0755 /usr/local/bin/vf-node
          sudo env VF_NODE_INSTALLER_NO_SHARE=1 NO_COLOR=1 /usr/local/bin/vf-node install --port 31536 >/tmp/rc7-install.log 2>&1
          sudo env NO_COLOR=1 /usr/local/bin/vf-node check
          sudo sha256sum /etc/v2ray/config.json | awk '{print $1}' >/tmp/config-before.sha
          sudo sed -n 's/^PORT=//p' /etc/vf-node/state.env >/tmp/port-before.txt
          echo 'P07_VF_NODE_RC7_BASELINE_SETUP=PASS'

      - name: Reproduce managed-but-unhealthy RC7 field state
        run: |
          set -euo pipefail
          sudo systemctl stop v2ray.service
          ! sudo env NO_COLOR=1 /usr/local/bin/vf-node check
          sudo test -s /etc/vf-node/state.env
          sudo test -s /etc/v2ray/config.json
          echo 'P07_VF_NODE_RC7_MANAGED_UNHEALTHY_STATE=REPRODUCED'

      - name: Upgrade manager to RC8 without repairing yet
        run: |
          set -euo pipefail
          RAW='https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/vf-node.sh'
          LOG=/tmp/rc7-to-rc8-refresh.log
          printf '0\n' | sudo script -qfec "env NO_COLOR=1 bash -c \"bash <(curl -fsSL '$RAW')\"" "$LOG" >/dev/null 2>&1
          grep -Fq '自动更新到 0.1.0-rc8' "$LOG"
          grep -Fq '状态   ● 安装异常 · 可自动修复 · 0.1.0-rc8' "$LOG"
          test "$(sudo env NO_COLOR=1 /usr/local/bin/vf-node --version)" = 'VF Network Node 0.1.0-rc8'
          ! sudo env NO_COLOR=1 /usr/local/bin/vf-node check
          echo 'P07_VF_NODE_RC8_DETECTS_UNHEALTHY_MANAGED_STATE=PASS'

      - name: Verify unhealthy RC8 refuses share output
        run: |
          set -euo pipefail
          rc=0
          if sudo env NO_COLOR=1 /usr/local/bin/vf-node url >/tmp/unhealthy-share.log 2>&1; then rc=0; else rc=$?; fi
          test "$rc" = '2'
          grep -Fq '当前节点没有通过健康检查，暂不显示分享链接' /tmp/unhealthy-share.log
          if grep -Fq 'vmess://' /tmp/unhealthy-share.log; then exit 51; fi
          echo 'P07_VF_NODE_RC8_UNHEALTHY_SHARE_BLOCKED=PASS'

      - name: Run same one-click and auto-repair RC7 field failure
        run: |
          set -euo pipefail
          RAW='https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/vf-node.sh'
          LOG=/tmp/rc8-auto-repair.log
          printf '1\n\n0\n' | sudo script -qfec "env NO_COLOR=1 bash -c \"bash <(curl -fsSL '$RAW')\"" "$LOG" >/dev/null 2>&1
          grep -Fq '检测到 P07 节点安装异常，正在自动修复' "$LOG"
          grep -Fq '自动修复完成' "$LOG"
          grep -Fq '节点健康检查 PASS' "$LOG"
          grep -Fq '状态   ● 已安装 · 运行正常 · 0.1.0-rc8' "$LOG"
          sudo env NO_COLOR=1 /usr/local/bin/vf-node check
          before="$(cat /tmp/config-before.sha)"
          after="$(sudo sha256sum /etc/v2ray/config.json | awk '{print $1}')"
          test "$before" = "$after"
          test "$(cat /tmp/port-before.txt)" = "$(sudo sed -n 's/^PORT=//p' /etc/vf-node/state.env)"
          sudo grep -Fq 'INSTALL_STATUS=HEALTHY' /etc/vf-node/state.env
          echo 'P07_VF_NODE_RC8_FIELD_FAILURE_AUTO_REPAIR=PASS'
          echo 'P07_VF_NODE_RC8_CONFIG_UNCHANGED=PASS'
          echo 'P07_VF_NODE_RC8_PORT_UNCHANGED=PASS'

      - name: Cleanup repaired node safely
        run: |
          set -euo pipefail
          printf '1\n' | sudo env NO_COLOR=1 bash installers/vf-node.sh uninstall >/tmp/rc8-recovery-cleanup.log 2>&1
          ! sudo systemctl is-active --quiet v2ray.service
          test ! -e /etc/v2ray/config.json
          echo 'P07_VF_NODE_RC8_RECOVERY_CLEANUP=PASS'
