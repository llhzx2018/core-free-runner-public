name: P07 Network Node Installer Smoke

on:
  push:
    paths:
      - 'installers/vf-node.sh'
      - 'packages/p07-network-node/0.1.0-rc2/**'
      - '.github/workflows/p07-network-node-installer-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-one-click-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify installer menu and no user token dependency
        run: |
          set -euo pipefail
          bash -n installers/vf-node.sh
          if grep -nE '(VF_PRIVATE_READ_TOKEN|github_pat_|ghp_|read .*TOKEN|read .*PAT)' installers/vf-node.sh; then
            exit 30
          fi
          grep -Fq "VERSION='0.1.0-rc2'" installers/vf-node.sh
          grep -Fq "MANIFEST_SHA256='819634dc645652899039e73ffc9569715f270b5a80a808d3cf1d450b1e164f68'" installers/vf-node.sh
          grep -Fq '1.${R} 安装稳定节点' installers/vf-node.sh
          grep -Fq '2.${R} 进入节点管理' installers/vf-node.sh
          grep -Fq '3.${R} 卸载节点' installers/vf-node.sh
          grep -Fq 'if [[ -t 0 ]]' installers/vf-node.sh
          grep -Fq 'uninstall_node()' installers/vf-node.sh
          grep -Fq 'write_entry' installers/vf-node.sh
          echo 'P07_VF_NODE_INSTALLER_NO_TOKEN=PASS'
          echo 'P07_VF_NODE_ONE_CLICK_MENU=PASS_STATIC'
          echo 'P07_VF_NODE_UNINSTALL_MENU=PASS_STATIC'

      - name: Wait for exact raw installer and verify menu can open and exit
        run: |
          set -euo pipefail
          RAW='https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/vf-node.sh'
          matched=0
          for _ in $(seq 1 12); do
            curl -fsSL "$RAW" -o /tmp/vf-node-raw-installer.sh
            if cmp -s installers/vf-node.sh /tmp/vf-node-raw-installer.sh; then
              matched=1
              break
            fi
            sleep 5
          done
          test "$matched" = '1'
          cmp installers/vf-node.sh /tmp/vf-node-raw-installer.sh
          printf '0\n' | sudo env NO_COLOR=1 bash /tmp/vf-node-raw-installer.sh menu > /tmp/vf-node-menu.log
          grep -Fq 'P07 · VF Network Node' /tmp/vf-node-menu.log
          grep -Fq '安装稳定节点' /tmp/vf-node-menu.log
          grep -Fq '进入节点管理' /tmp/vf-node-menu.log
          grep -Fq '卸载节点' /tmp/vf-node-menu.log
          echo 'P07_VF_NODE_RAW_BYTES_MATCH_CHECKOUT=PASS'
          echo 'P07_VF_NODE_RAW_MENU_OPEN_EXIT=PASS'

      - name: Run exact public raw one-click noninteractive install on fresh Ubuntu 24.04
        run: |
          set -euo pipefail
          LOG=/tmp/vf-node-public-installer.log
          RAW='https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/vf-node.sh'
          redact() {
            sed -E \
              -e 's#[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}#[REDACTED_UUID]#g' \
              -e 's#vmess://[^[:space:]]+#vmess://[REDACTED]#g'
          }
          if ! sudo env VF_NODE_INSTALLER_NO_SHARE=1 NO_COLOR=1 bash -c "bash <(curl -fsSL '$RAW')" </dev/null >"$LOG" 2>&1; then
            echo 'P07_VF_NODE_INSTALLER_SMOKE=FAIL'
            redact < "$LOG" | tail -n 120
            exit 1
          fi
          if grep -Fq 'vmess://' "$LOG"; then
            echo 'Installer smoke unexpectedly printed a share link.' >&2
            exit 31
          fi
          if grep -Eqi '(搭建教程|233v2|Telegram|QQ群|捐赠|赞助)' "$LOG"; then
            echo 'Upstream promotional output leaked into public installer.' >&2
            redact < "$LOG" | tail -n 120
            exit 32
          fi
          echo 'P07_VF_NODE_EXACT_ONE_CLICK_EXECUTION=PASS'
          echo 'P07_VF_NODE_AD_FREE_INSTALL_OUTPUT=PASS'

      - name: Verify installed product, installed-state menu and stable entry
        run: |
          set -euo pipefail
          test -x /usr/local/bin/vf-node
          test ! -L /usr/local/bin/vf-node
          grep -Fq 'exec "/opt/vf-network-node/vf-node.sh" "$@"' /usr/local/bin/vf-node
          test -d /opt/vf-network-node
          ACTUAL_VERSION="$(sudo env NO_COLOR=1 /usr/local/bin/vf-node --version)"
          test "$ACTUAL_VERSION" = 'VF Network Node 0.1.0-rc2'

          CONFIG=/etc/v2ray/config.json
          test -s "$CONFIG"
          grep -Fq '"protocol": "vmess"' "$CONFIG"
          grep -Fq '"network": "kcp"' "$CONFIG"
          grep -Fq '"type": "dtls"' "$CONFIG"

          CORE_LINE="$(/usr/bin/v2ray/v2ray version 2>/dev/null | sed -n '1p')"
          grep -Fq '5.53.0' <<<"$CORE_LINE"
          sudo systemctl is-active --quiet v2ray.service

          STATE=/etc/vf-node/state.env
          sudo test -s "$STATE"
          test "$(sudo stat -c '%a' "$STATE")" = '600'
          sudo grep -Fq 'PROFILE=VMESS_MKCP_DTLS' "$STATE"
          sudo grep -Fq 'CORE_VERSION=v5.53.0' "$STATE"
          PORT="$(sudo sed -n 's/^PORT=//p' "$STATE")"
          test -n "$PORT"
          UDP_LISTENERS="$(sudo ss -H -lun | awk '{print $4}')"
          grep -Eq "(^|[:.])${PORT}$" <<<"$UDP_LISTENERS"
          sudo env NO_COLOR=1 /usr/local/bin/vf-node check

          printf '0\n' | sudo env NO_COLOR=1 bash installers/vf-node.sh menu > /tmp/vf-node-installed-menu.log
          grep -Fq '状态：● 已安装' /tmp/vf-node-installed-menu.log
          grep -Fq '3. 卸载节点' /tmp/vf-node-installed-menu.log

          echo 'P07_VF_NODE_INSTALLED_VERSION=0.1.0-rc2'
          echo 'P07_VF_NODE_PROFILE=VMESS_MKCP_DTLS'
          echo 'P07_VF_NODE_CORE=v5.53.0'
          echo 'P07_VF_NODE_STABLE_ENTRY=PASS'
          echo 'P07_VF_NODE_SYSTEMD=PASS'
          echo 'P07_VF_NODE_UDP_LISTENER=PASS'
          echo 'P07_VF_NODE_INSTALLED_MENU=PASS'
          echo 'P07_VF_NODE_INSTALLER_SMOKE=PASS'
