name: P07 Network Node Installer Smoke

on:
  push:
    paths:
      - 'installers/vf-node.sh'
      - 'packages/p07-network-node/0.1.0-rc3/**'
      - '.github/workflows/p07-network-node-installer-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-one-click-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify RC3 installer menu and no user token dependency
        run: |
          set -euo pipefail
          bash -n installers/vf-node.sh
          if grep -nE '(VF_PRIVATE_READ_TOKEN|github_pat_|ghp_|read .*TOKEN|read .*PAT)' installers/vf-node.sh; then exit 30; fi
          grep -Fq "VERSION='0.1.0-rc3'" installers/vf-node.sh
          grep -Fq "MANIFEST_SHA256='a2b79313ae066b3948239fcc46863ce99667a1b8c821aae564f6190f9c2886d0'" installers/vf-node.sh
          grep -Fq '1.${R} 安装稳定节点' installers/vf-node.sh
          grep -Fq '2.${R} 进入节点管理' installers/vf-node.sh
          grep -Fq '3.${R} 卸载节点' installers/vf-node.sh
          grep -Fq 'install_runtime_files || return $?' installers/vf-node.sh
          echo 'P07_VF_NODE_INSTALLER_NO_TOKEN=PASS'
          echo 'P07_VF_NODE_ONE_CLICK_MENU=PASS_STATIC'
          echo 'P07_VF_NODE_RC2_REFRESH_PATH=PASS_STATIC'

      - name: Wait for exact raw RC3 installer and verify menu open exit
        run: |
          set -euo pipefail
          RAW='https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/vf-node.sh'
          matched=0
          for _ in $(seq 1 12); do
            curl -fsSL "$RAW" -o /tmp/vf-node-raw-installer.sh
            if cmp -s installers/vf-node.sh /tmp/vf-node-raw-installer.sh; then matched=1; break; fi
            sleep 5
          done
          test "$matched" = '1'
          printf '0\n' | sudo env NO_COLOR=1 bash /tmp/vf-node-raw-installer.sh menu > /tmp/vf-node-menu.log
          grep -Fq 'P07 · VF Network Node' /tmp/vf-node-menu.log
          grep -Fq '安装稳定节点' /tmp/vf-node-menu.log
          grep -Fq '进入节点管理' /tmp/vf-node-menu.log
          grep -Fq '卸载节点' /tmp/vf-node-menu.log
          echo 'P07_VF_NODE_RAW_BYTES_MATCH_CHECKOUT=PASS'
          echo 'P07_VF_NODE_RAW_MENU_OPEN_EXIT=PASS'

      - name: Run exact public raw RC3 noninteractive install
        run: |
          set -euo pipefail
          LOG=/tmp/vf-node-public-installer.log
          RAW='https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/vf-node.sh'
          if ! sudo env VF_NODE_INSTALLER_NO_SHARE=1 NO_COLOR=1 bash -c "bash <(curl -fsSL '$RAW')" </dev/null >"$LOG" 2>&1; then
            sed -E -e 's#[0-9a-fA-F]{8}-[0-9a-fA-F-]{27,}#[REDACTED_UUID]#g' -e 's#vmess://[^[:space:]]+#vmess://[REDACTED]#g' "$LOG" | tail -n 120
            exit 1
          fi
          if grep -Fq 'vmess://' "$LOG"; then exit 31; fi
          if grep -Eqi '(搭建教程|233v2|Telegram|QQ群|捐赠|赞助|JMS CN2)' "$LOG"; then exit 32; fi
          echo 'P07_VF_NODE_EXACT_ONE_CLICK_EXECUTION=PASS'
          echo 'P07_VF_NODE_AD_FREE_INSTALL_OUTPUT=PASS'

      - name: Verify RC3 installed product and menu state
        run: |
          set -euo pipefail
          test "$(sudo env NO_COLOR=1 /usr/local/bin/vf-node --version)" = 'VF Network Node 0.1.0-rc3'
          grep -Fq '"protocol": "vmess"' /etc/v2ray/config.json
          grep -Fq '"network": "kcp"' /etc/v2ray/config.json
          grep -Fq '"type": "dtls"' /etc/v2ray/config.json
          /usr/bin/v2ray/v2ray version 2>/dev/null | head -n1 | grep -Fq '5.53.0'
          sudo systemctl is-active --quiet v2ray.service
          sudo env NO_COLOR=1 /usr/local/bin/vf-node check
          PORT="$(sudo sed -n 's/^PORT=//p' /etc/vf-node/state.env)"
          sudo ss -H -lun | awk '{print $4}' | grep -Eq "(^|[:.])${PORT}$"
          printf '0\n' | sudo env NO_COLOR=1 bash installers/vf-node.sh menu > /tmp/vf-node-installed-menu.log
          grep -Fq '状态：● 已安装' /tmp/vf-node-installed-menu.log
          grep -Fq '3. 卸载节点' /tmp/vf-node-installed-menu.log
          echo 'P07_VF_NODE_RC3_INSTALLED_MENU=PASS'

      - name: Verify successful guarded RC3 uninstall
        run: |
          set -euo pipefail
          LOG=/tmp/vf-node-public-uninstall.log
          printf 'UNINSTALL_VF_NODE\n' | sudo env NO_COLOR=1 bash installers/vf-node.sh uninstall >"$LOG" 2>&1
          if grep -Eqi '(搭建教程|233v2|Telegram|QQ群|捐赠|赞助|JMS CN2)' "$LOG"; then exit 39; fi
          ! sudo systemctl is-active --quiet v2ray.service
          test ! -e /etc/v2ray/config.json
          test ! -e /etc/vf-node/state.env
          backup="$(sudo find /root/vf-node-backups -maxdepth 1 -type f -name 'vf-node-*.tar.gz' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          test -n "$backup"
          sudo test -f "$backup.sha256"
          sudo sha256sum -c "$backup.sha256" >/dev/null
          printf '0\n' | sudo env NO_COLOR=1 bash installers/vf-node.sh menu > /tmp/vf-node-after-uninstall-menu.log
          grep -Fq '状态：● 未安装' /tmp/vf-node-after-uninstall-menu.log
          echo 'P07_VF_NODE_BACKUP_BEFORE_UNINSTALL=PASS'
          echo 'P07_VF_NODE_SUCCESSFUL_UNINSTALL=PASS'
          echo 'P07_VF_NODE_UNINSTALL_OUTPUT_AD_FREE=PASS'
          echo 'P07_VF_NODE_AFTER_UNINSTALL_MENU=PASS'
          echo 'P07_VF_NODE_INSTALLER_SMOKE=PASS'

  rc2-upgrade-uninstall:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install historical public RC2 package as existing managed node
        run: |
          set -euo pipefail
          PKG="$PWD/packages/p07-network-node/0.1.0-rc2"
          sudo mkdir -p /opt/vf-network-node/lib
          sudo cp "$PKG"/VERSION "$PKG"/vf-node.sh "$PKG"/install.sh "$PKG"/status.sh "$PKG"/share.sh "$PKG"/backup.sh "$PKG"/uninstall.sh /opt/vf-network-node/
          sudo cp "$PKG"/lib/common.sh "$PKG"/lib/core-pin.env "$PKG"/lib/patch_upstream_core.py /opt/vf-network-node/lib/
          sudo chmod 0755 /opt/vf-network-node/*.sh /opt/vf-network-node/lib/patch_upstream_core.py
          sudo tee /usr/local/bin/vf-node >/dev/null <<'EOF'
          #!/usr/bin/env bash
          exec "/opt/vf-network-node/vf-node.sh" "$@"
          EOF
          sudo chmod 0755 /usr/local/bin/vf-node
          sudo env NO_COLOR=1 /usr/local/bin/vf-node install --port 31536 >/tmp/rc2-install.log 2>&1
          test "$(sudo env NO_COLOR=1 /usr/local/bin/vf-node --version)" = 'VF Network Node 0.1.0-rc2'
          sudo systemctl is-active --quiet v2ray.service
          echo 'P07_VF_NODE_EXISTING_RC2_SETUP=PASS'

      - name: Use current public one-click entry to refresh RC2 manager and uninstall
        run: |
          set -euo pipefail
          RAW='https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/vf-node.sh'
          LOG=/tmp/rc2-to-rc3-uninstall.log
          printf 'UNINSTALL_VF_NODE\n' | sudo env NO_COLOR=1 bash -c "bash <(curl -fsSL '$RAW') uninstall" >"$LOG" 2>&1
          grep -Fq 'VF Network Node 0.1.0-rc3 管理模块已就绪' "$LOG"
          if grep -Eqi '(搭建教程|233v2|Telegram|QQ群|捐赠|赞助|JMS CN2)' "$LOG"; then exit 50; fi
          ! sudo systemctl is-active --quiet v2ray.service
          test ! -e /etc/v2ray/config.json
          test ! -e /etc/vf-node/state.env
          test "$(sudo env NO_COLOR=1 /usr/local/bin/vf-node --version)" = 'VF Network Node 0.1.0-rc3'
          backup="$(sudo find /root/vf-node-backups -maxdepth 1 -type f -name 'vf-node-*.tar.gz' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          test -n "$backup"
          sudo sha256sum -c "$backup.sha256" >/dev/null
          echo 'P07_VF_NODE_RC2_MANAGER_REFRESH=PASS'
          echo 'P07_VF_NODE_RC2_TO_RC3_UNINSTALL=PASS'
