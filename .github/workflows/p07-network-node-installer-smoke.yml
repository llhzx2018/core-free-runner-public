name: P07 Network Node Installer Smoke

on:
  push:
    branches: [main]
    paths:
      - 'installers/vf-node.sh'
      - 'packages/p07-network-node/**'
      - '.github/workflows/p07-network-node-installer-smoke.yml'
  pull_request:
    paths:
      - 'installers/vf-node.sh'
      - 'packages/p07-network-node/**'
      - '.github/workflows/p07-network-node-installer-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-route-static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify current route and public-safety contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n installers/vf-node.sh
          VERSION="$(sed -n "s/^VERSION='\([^']*\)'/\1/p" installers/vf-node.sh | head -n1)"
          test -n "$VERSION"
          PKG="packages/p07-network-node/$VERSION"
          test -f "$PKG/VERSION"
          test "$(tr -d '\r\n' < "$PKG/VERSION")" = "$VERSION"
          manifest_expected="$(sed -n "s/^MANIFEST_SHA256='\([^']*\)'/\1/p" installers/vf-node.sh | head -n1)"
          test "$(sha256sum "$PKG/MANIFEST.sha256" | awk '{print $1}')" = "$manifest_expected"
          if grep -nE '(VF_PRIVATE_READ_TOKEN|github_pat_|ghp_|read .*TOKEN|read .*PAT)' installers/vf-node.sh; then exit 30; fi
          if grep -R -nF 'UNINSTALL_VF_NODE' installers/vf-node.sh "$PKG/uninstall.sh"; then exit 36; fi
          grep -Fq '安装异常 · 可自动修复' "$PKG/vf-node.sh"
          grep -Fq '请选择 [0-5]：' "$PKG/vf-node.sh"
          grep -Fq '请选择 [0-1]：' "$PKG/uninstall.sh"
          echo "P07_VF_NODE_CURRENT_VERSION=$VERSION"
          echo 'P07_VF_NODE_CURRENT_ROUTE_STATIC=PASS'

  public-one-click-smoke:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Resolve current version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n "s/^VERSION='\([^']*\)'/\1/p" installers/vf-node.sh | head -n1)"
          test -n "$VERSION"
          echo "P07_NODE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Wait for exact raw current installer
        shell: bash
        run: |
          set -euo pipefail
          RAW='https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/vf-node.sh'
          matched=0
          for _ in $(seq 1 12); do
            curl -fsSL "$RAW" -o /tmp/vf-node-raw-installer.sh
            if cmp -s installers/vf-node.sh /tmp/vf-node-raw-installer.sh; then matched=1; break; fi
            sleep 5
          done
          test "$matched" = '1'
          echo 'P07_VF_NODE_RAW_BYTES_MATCH_CHECKOUT=PASS'

      - name: Run exact raw one-click fresh install in real TTY
        shell: bash
        run: |
          set -euo pipefail
          RAW='https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/vf-node.sh'
          LOG=/tmp/vf-node-real-tty-install.log
          if ! printf '1\n\n0\n' | sudo script -qfec "env NO_COLOR=1 bash -c \"bash <(curl -fsSL '$RAW')\"" "$LOG" >/dev/null 2>&1; then
            sed -E -e 's#[0-9a-fA-F]{8}-[0-9a-fA-F-]{27,}#[REDACTED_UUID]#g' -e 's#vmess://[^[:space:]]+#vmess://[REDACTED]#g' "$LOG" | tail -n 180
            exit 1
          fi
          grep -Fq '状态   ● 未安装' "$LOG"
          grep -Fq '服务与 UDP 检查通过' "$LOG"
          grep -Fq '✓ 节点安装完成' "$LOG"
          grep -Fq 'vmess://' "$LOG"
          grep -Fq '按 Enter 返回主菜单' "$LOG"
          test "$(sudo env NO_COLOR=1 /usr/local/bin/vf-node --version)" = "VF Network Node $P07_NODE_VERSION"
          echo 'P07_VF_NODE_CURRENT_ONE_CLICK_TTY=PASS'

      - name: Verify current live state and healthy share
        shell: bash
        run: |
          set -euo pipefail
          sudo grep -Fq 'INSTALL_STATUS=HEALTHY' /etc/vf-node/state.env
          sudo systemctl is-active --quiet v2ray.service
          sudo env NO_COLOR=1 /usr/local/bin/vf-node check
          PORT="$(sudo sed -n 's/^PORT=//p' /etc/vf-node/state.env)"
          sudo ss -H -lun | awk '{print $4}' | grep -Eq "(^|[:.])${PORT}$"
          sudo env NO_COLOR=1 /usr/local/bin/vf-node url >/tmp/vf-node-url.txt 2>&1
          grep -Fq 'vmess://' /tmp/vf-node-url.txt
          chmod 0600 /tmp/vf-node-url.txt
          echo 'P07_VF_NODE_CURRENT_STATE_HEALTHY=PASS'
          echo 'P07_VF_NODE_CURRENT_SHARE_AFTER_HEALTH=PASS_REDACTED'

      - name: Verify guarded current uninstall
        shell: bash
        run: |
          set -euo pipefail
          LOG=/tmp/vf-node-public-uninstall.log
          printf '1\n' | sudo env NO_COLOR=1 bash installers/vf-node.sh uninstall >"$LOG" 2>&1
          grep -Fq '请选择 [0-1]：' "$LOG"
          ! sudo systemctl is-active --quiet v2ray.service
          test ! -e /etc/v2ray/config.json
          sudo test ! -e /etc/vf-node/state.env
          backup="$(sudo find /root/vf-node-backups -maxdepth 1 -type f -name 'vf-node-*.tar.gz' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          test -n "$backup"
          sudo test -f "$backup.sha256"
          sudo sha256sum -c "$backup.sha256" >/dev/null
          echo 'P07_VF_NODE_CURRENT_GUARDED_UNINSTALL=PASS'
