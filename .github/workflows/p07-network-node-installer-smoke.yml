name: P07 Network Node Installer Smoke

on:
  push:
    paths:
      - 'installers/vf-node.sh'
      - 'packages/p07-network-node/0.1.0-rc6/**'
      - '.github/workflows/p07-network-node-installer-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-one-click-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify RC6 UX contract and no user token dependency
        run: |
          set -euo pipefail
          bash -n installers/vf-node.sh
          if grep -nE '(VF_PRIVATE_READ_TOKEN|github_pat_|ghp_|read .*TOKEN|read .*PAT)' installers/vf-node.sh; then exit 30; fi
          grep -Fq "VERSION='0.1.0-rc6'" installers/vf-node.sh
          grep -Fq "MANIFEST_SHA256='94855a3f9208ac939b0f73a5ce392dc41f1f1e850ebd4b1f142489eaae480603'" installers/vf-node.sh
          grep -Fq '[安装]' installers/vf-node.sh
          grep -Fq '[管理]' installers/vf-node.sh
          grep -Fq '[分享]' installers/vf-node.sh
          grep -Fq '[危险]' installers/vf-node.sh
          grep -Fq '节点已就绪 · 下一步' installers/vf-node.sh
          grep -Fq '再次显示干净分享链接' installers/vf-node.sh
          grep -Fq 'refresh_manager_if_needed' installers/vf-node.sh
          grep -Fq 'UUID、端口保持不变' installers/vf-node.sh
          if grep -R -nF 'UNINSTALL_VF_NODE' installers/vf-node.sh packages/p07-network-node/0.1.0-rc6/uninstall.sh; then exit 35; fi
          grep -Fq '请选择 [0-1]：' packages/p07-network-node/0.1.0-rc6/uninstall.sh
          echo 'P07_VF_NODE_INSTALLER_NO_TOKEN=PASS'
          echo 'P07_VF_NODE_SEMANTIC_COLOR_UX=PASS_STATIC'
          echo 'P07_VF_NODE_ZERO_MEMORY_POST_INSTALL=PASS_STATIC'
          echo 'P07_VF_NODE_RC5_SAFE_MANAGER_UPGRADE=PASS_STATIC'
          echo 'P07_VF_NODE_NUMERIC_UNINSTALL_UX=PASS_STATIC'

      - name: Wait for exact raw RC6 installer
        run: |
          set -euo pipefail
          RAW='https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/vf-node.sh'
          matched=0
          for _ in $(seq 1 12); do
            curl -fsSL "$RAW" -o /tmp/vf-node-raw-installer.sh
            if cmp -s installers/vf-node.sh /tmp/vf-node-raw-installer.sh; then matched=1; break; fi
            sleep 5
          done
          test "$matched" = '1'
          echo 'P07_VF_NODE_RAW_BYTES_MATCH_CHECKOUT=PASS'

      - name: Run exact raw one-click in a real TTY user flow
        run: |
          set -euo pipefail
          RAW='https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/vf-node.sh'
          LOG=/tmp/vf-node-real-tty-install.log
          # User flow: 1=install, 0=return from post-install actions, 0=exit main menu.
          if ! printf '1\n0\n0\n' | sudo script -qfec "env NO_COLOR=1 bash -c \"bash <(curl -fsSL '$RAW')\"" "$LOG" >/dev/null 2>&1; then
            sed -E -e 's#[0-9a-fA-F]{8}-[0-9a-fA-F-]{27,}#[REDACTED_UUID]#g' -e 's#vmess://[^[:space:]]+#vmess://[REDACTED]#g' "$LOG" | tail -n 160
            exit 1
          fi
          grep -Fq 'P07 · VF Network Node' "$LOG"
          grep -Fq '状态   ● 未安装' "$LOG"
          grep -Fq '节点已经安装完成并运行' "$LOG"
          grep -Fq 'vmess://' "$LOG"
          grep -Fq '接下来可以直接用：' "$LOG"
          grep -Fq '节点已就绪 · 下一步' "$LOG"
          grep -Fq '再次显示干净分享链接' "$LOG"
          grep -Fq '状态   ● 已安装 · 0.1.0-rc6' "$LOG"
          if grep -Eqi '(搭建教程|233v2|Telegram|QQ群|捐赠|赞助|JMS CN2|itblogcn\.com/article)' "$LOG"; then exit 32; fi
          echo 'P07_VF_NODE_EXACT_ONE_CLICK_TTY_FLOW=PASS'
          echo 'P07_VF_NODE_INSTALL_COMPLETION_VISIBLE=PASS'
          echo 'P07_VF_NODE_INSTALL_SHARE_VISIBLE=PASS_REDACTED'
          echo 'P07_VF_NODE_POST_INSTALL_MENU_VISIBLE=PASS'
          echo 'P07_VF_NODE_RETURN_TO_MAIN_MENU=PASS'
          echo 'P07_VF_NODE_AD_FREE_INSTALL_OUTPUT=PASS'

      - name: Verify RC6 installed product and vf-node semantic menu
        run: |
          set -euo pipefail
          test "$(sudo env NO_COLOR=1 /usr/local/bin/vf-node --version)" = 'VF Network Node 0.1.0-rc6'
          grep -Fq '"protocol": "vmess"' /etc/v2ray/config.json
          grep -Fq '"network": "kcp"' /etc/v2ray/config.json
          grep -Fq '"type": "dtls"' /etc/v2ray/config.json
          /usr/bin/v2ray/v2ray version 2>/dev/null | head -n1 | grep -Fq '5.53.0'
          sudo systemctl is-active --quiet v2ray.service
          sudo env NO_COLOR=1 /usr/local/bin/vf-node check
          PORT="$(sudo sed -n 's/^PORT=//p' /etc/vf-node/state.env)"
          sudo ss -H -lun | awk '{print $4}' | grep -Eq "(^|[:.])${PORT}$"
          printf '0\n' | sudo script -qfec 'env NO_COLOR=1 /usr/local/bin/vf-node' /tmp/vf-node-menu.log >/dev/null 2>&1
          grep -Fq '状态   ● 已安装 · 运行中' /tmp/vf-node-menu.log
          grep -Fq '[稳定] 安装稳定节点' /tmp/vf-node-menu.log
          grep -Fq '[检查] 查看节点状态' /tmp/vf-node-menu.log
          grep -Fq '[分享] 生成分享链接' /tmp/vf-node-menu.log
          grep -Fq '[备份] 备份节点配置' /tmp/vf-node-menu.log
          grep -Fq '[实验] 高速实验 Profile' /tmp/vf-node-menu.log
          grep -Fq '[危险] 卸载节点' /tmp/vf-node-menu.log
          echo 'P07_VF_NODE_RC6_INSTALLED_MENU=PASS'
          echo 'P07_VF_NODE_LIVE_STATUS_SUMMARY=PASS'

      - name: Verify clean vf-node url and legacy v2ray url compatibility
        run: |
          set -euo pipefail
          sudo env NO_COLOR=1 /usr/local/bin/vf-node url >/tmp/vf-node-url.txt 2>&1
          grep -Fq 'vmess://' /tmp/vf-node-url.txt
          if grep -Eqi '(搭建教程|233v2|Telegram|QQ群|捐赠|赞助|JMS CN2|itblogcn\.com/article)' /tmp/vf-node-url.txt; then exit 41; fi
          sudo /usr/local/sbin/v2ray url >/tmp/v2ray-url.txt 2>&1
          grep -Fq 'vmess://' /tmp/v2ray-url.txt
          chmod 0600 /tmp/vf-node-url.txt /tmp/v2ray-url.txt
          echo 'P07_VF_NODE_URL_CLEAN=PASS_REDACTED'
          echo 'P07_LEGACY_V2RAY_URL=PASS_REDACTED'

      - name: Verify numeric cancel keeps live node
        run: |
          set -euo pipefail
          LOG=/tmp/vf-node-public-uninstall-cancel.log
          rc=0
          if printf '0\n' | sudo env NO_COLOR=1 bash installers/vf-node.sh uninstall >"$LOG" 2>&1; then rc=0; else rc=$?; fi
          test "$rc" = '2'
          grep -Fq '请选择 [0-1]：' "$LOG"
          grep -Fq '已取消卸载。节点没有任何变化。' "$LOG"
          if grep -Fq 'UNINSTALL_VF_NODE' "$LOG"; then exit 36; fi
          sudo systemctl is-active --quiet v2ray.service
          sudo test -s /etc/v2ray/config.json
          sudo test -s /etc/vf-node/state.env
          echo 'P07_VF_NODE_NUMERIC_UNINSTALL_CANCEL=PASS'

      - name: Verify numeric confirm performs guarded RC6 uninstall
        run: |
          set -euo pipefail
          LOG=/tmp/vf-node-public-uninstall.log
          printf '1\n' | sudo env NO_COLOR=1 bash installers/vf-node.sh uninstall >"$LOG" 2>&1
          grep -Fq '请选择 [0-1]：' "$LOG"
          if grep -Fq 'UNINSTALL_VF_NODE' "$LOG"; then exit 37; fi
          if grep -Eqi '(搭建教程|233v2|Telegram|QQ群|捐赠|赞助|JMS CN2)' "$LOG"; then exit 39; fi
          ! sudo systemctl is-active --quiet v2ray.service
          test ! -e /etc/v2ray/config.json
          sudo test ! -e /etc/vf-node/state.env
          backup="$(sudo find /root/vf-node-backups -maxdepth 1 -type f -name 'vf-node-*.tar.gz' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          test -n "$backup"
          sudo test -f "$backup.sha256"
          sudo sha256sum -c "$backup.sha256" >/dev/null
          printf '0\n' | sudo env NO_COLOR=1 bash installers/vf-node.sh menu > /tmp/vf-node-after-uninstall-menu.log
          grep -Fq '状态   ● 未安装' /tmp/vf-node-after-uninstall-menu.log
          echo 'P07_VF_NODE_BACKUP_BEFORE_UNINSTALL=PASS'
          echo 'P07_VF_NODE_NUMERIC_UNINSTALL_CONFIRM=PASS'
          echo 'P07_VF_NODE_AFTER_UNINSTALL_MENU=PASS'
          echo 'P07_VF_NODE_INSTALLER_SMOKE=PASS'

  rc5-manager-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install historical public RC5 as an existing managed node
        run: |
          set -euo pipefail
          PKG="$PWD/packages/p07-network-node/0.1.0-rc5"
          sudo mkdir -p /opt/vf-network-node/lib
          sudo cp "$PKG"/VERSION "$PKG"/vf-node.sh "$PKG"/install.sh "$PKG"/status.sh "$PKG"/share.sh "$PKG"/backup.sh "$PKG"/uninstall.sh /opt/vf-network-node/
          sudo cp "$PKG"/lib/common.sh "$PKG"/lib/core-pin.env "$PKG"/lib/patch_upstream_core.py /opt/vf-network-node/lib/
          sudo chmod 0755 /opt/vf-network-node/*.sh /opt/vf-network-node/lib/patch_upstream_core.py
          sudo tee /usr/local/bin/vf-node >/dev/null <<'EOF'
          #!/usr/bin/env bash
          exec "/opt/vf-network-node/vf-node.sh" "$@"
          EOF
          sudo chmod 0755 /usr/local/bin/vf-node
          sudo env VF_NODE_INSTALLER_NO_SHARE=1 NO_COLOR=1 /usr/local/bin/vf-node install --port 31536 >/tmp/rc5-install.log 2>&1
          test "$(sudo env NO_COLOR=1 /usr/local/bin/vf-node --version)" = 'VF Network Node 0.1.0-rc5'
          sudo systemctl is-active --quiet v2ray.service
          sudo sha256sum /etc/v2ray/config.json | awk '{print $1}' >/tmp/config-before.sha
          echo 'P07_VF_NODE_EXISTING_RC5_SETUP=PASS'

      - name: Re-run the same public one-click and auto-refresh only the manager
        run: |
          set -euo pipefail
          RAW='https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/vf-node.sh'
          LOG=/tmp/rc5-to-rc6-manager-upgrade.log
          printf '0\n' | sudo script -qfec "env NO_COLOR=1 bash -c \"bash <(curl -fsSL '$RAW')\"" "$LOG" >/dev/null 2>&1
          grep -Fq '自动更新到 0.1.0-rc6' "$LOG"
          grep -Fq '现有节点配置、UUID、端口保持不变' "$LOG"
          test "$(sudo env NO_COLOR=1 /usr/local/bin/vf-node --version)" = 'VF Network Node 0.1.0-rc6'
          before="$(cat /tmp/config-before.sha)"
          after="$(sudo sha256sum /etc/v2ray/config.json | awk '{print $1}')"
          test "$before" = "$after"
          sudo systemctl is-active --quiet v2ray.service
          sudo env NO_COLOR=1 /usr/local/bin/vf-node check
          echo 'P07_VF_NODE_RC5_TO_RC6_MANAGER_REFRESH=PASS'
          echo 'P07_VF_NODE_RC5_NODE_CONFIG_UNCHANGED=PASS'

      - name: Cleanup upgraded test node safely
        run: |
          set -euo pipefail
          printf '1\n' | sudo env NO_COLOR=1 bash installers/vf-node.sh uninstall >/tmp/rc5-upgrade-cleanup.log 2>&1
          ! sudo systemctl is-active --quiet v2ray.service
          test ! -e /etc/v2ray/config.json
          echo 'P07_VF_NODE_RC5_UPGRADE_CLEANUP=PASS'
