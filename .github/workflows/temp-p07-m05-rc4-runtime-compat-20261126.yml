name: TEMP P07 M05 real RC4 retained-root compatibility
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temp-p07-m05-rc4-runtime-compat-20261126.yml
permissions:
  contents: read
jobs:
  exact-m05-compat:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.actor == 'llhzx2018' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'temp/p07-m05-rc4-runtime-compat-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PRODUCT_SHA: 'df33592537de14ad8fb324eebe398620e62d2047'
      PRODUCT_BASE: '5c0cc6009725ecbb3b0f244183ccb78bbd52faf1'
    steps:
      - name: Exact public installer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 'c1bf042751f64acb61996f45c7f5eb5e3569b1dd'
          persist-credentials: false
      - name: CPython 3.13 actual Debian cache compatibility
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - name: Exact transient M05 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 'df33592537de14ad8fb324eebe398620e62d2047'
          path: transient-p07
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Exact scope and affected host guards
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          mkdir -m 700 "$RUNNER_TEMP/m05-compat"
          cd transient-p07
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          python3 -B - <<'PY'
          import ast,os,pathlib,subprocess
          paths=subprocess.check_output(["git","diff","--name-only",os.environ["PRODUCT_BASE"],os.environ["PRODUCT_SHA"]],text=True).splitlines()
          assert set(paths)=={"lib/m05_owner_trial_guard.py","scripts/build_p07_m05_bundle.py","tests/test_p07_m05_trial_cache_guard.py","tests/test_p07_m05_isolated_module.py"}
          for p in paths: ast.parse(pathlib.Path(p).read_text(),filename=p)
          PY
          for suite in test_p07_m05_isolated_module.py; do
            log="$RUNNER_TEMP/m05-compat/$suite.log"
            if ! python3 -B -m unittest discover -s tests -p "$suite" -v >"$log" 2>&1; then
              grep -E '^(FAIL|ERROR):|^Ran [0-9]+ tests|^FAILED' "$log" | cut -c1-180
              echo "M05_COMPAT_SUITE=FAIL:$suite"
              exit 21
            fi
            grep -Fxq OK "$log"
            grep -E '^Ran [1-9][0-9]* tests?' "$log"
            echo "M05_COMPAT_SUITE=PASS:$suite"
          done
      - name: Issued genuine RC3 RC4 and M05 UX14 bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          unset GH_TOKEN GITHUB_TOKEN
          root="$RUNNER_TEMP/m05-compat"
          base=https://github.com/llhzx2018/core-free-runner-public/releases/download
          api=https://api.github.com/repos/llhzx2018/core-free-runner-public/releases/assets
          fetch() { curl -q --proto '=https' --tlsv1.2 -fsSL --retry 1 --connect-timeout 10 --max-time 100 "$@"; }
          asset() {
            if ! fetch "$base/$1/$2" -o "$root/$3"; then fetch -H 'Accept: application/octet-stream' "$api/$4" -o "$root/$3"; fi
            printf '%s  %s\n' "$5" "$root/$3" | sha256sum -c -
          }
          asset p07-m03-v0.1.0-release147-rc3-ownertrial-20261123 P07-M03-0.1.0-release147-rc3-OWNER-TRIAL.zip old.zip 781359770 3646285a2732c8249d0296a72c7ce6fae83be1e9564d76849e65bc396642672d
          asset p07-m03-v0.1.0-release147-rc4-maintenance-20261125 P07-M03-0.1.0-release147-rc4-MAINTENANCE.zip new.zip 793699101 85570da2d135e39ae3634e511298e50dede81015019e305c7de068e04ca93238
          asset p07-m05-v0.1.0-ux14-verified-pycache-20261125 P07-M05-0.1.0-m05-ux14-verified-pycache.zip ux14.zip 790455651 8cca47f0a7bfed619daefe3074697f3837fc92c50103d218a12ca9149cd9d11d
          echo P07_M05_GENUINE_ISSUED_INPUTS=PASS
      - name: Real RC3 to RC4 installed pair and M05 module actual upgrade
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          root="$RUNNER_TEMP/m05-compat"
          cat >"$root/proof.py" <<'PY'
          import hashlib,importlib.util,os,pathlib,py_compile,shutil,stat,subprocess,sys,zipfile
          from unittest import mock
          root=pathlib.Path(sys.argv[1]); repo=pathlib.Path.cwd()
          product=repo/"transient-p07"
          sys.path[:0]=[str(product/"lib"),str(product/"tests"),str(product/"scripts")]
          import m05_owner_trial_guard as owner
          import m05_environment_guard as envguard
          from test_p07_m05_dirty_host_guard import FakeProbe
          from p07_m03_rc3_recovery_bundle import _issuer_base_config_pins,_official_files
          blob=lambda b:hashlib.sha1(b"blob "+str(len(b)).encode()+b"\0"+b).hexdigest()
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          # Derive exact pinned configs from the already verified historical issuer tar.
          with zipfile.ZipFile(root/"old.zip") as z:
              historical={n:z.read(n) for n in z.namelist()}
          pins=_issuer_base_config_pins(historical)
          if pins!=owner.ISSUED_CONFIG_BLOBS:
              for name,pin in sorted(pins.items()): print("ISSUED_CONFIG_PIN="+name+":"+pin,flush=True)
              raise AssertionError("M05_ISSUER_CONFIG_PINS_MISMATCH")
          print("P07_M05_EXACT_ISSUER_CONFIG_PINS=PASS",flush=True)
          for kind in ("old","new"):
              dst=root/kind; dst.mkdir()
              with zipfile.ZipFile(root/(kind+".zip")) as z:
                  assert z.testzip() is None
                  z.extractall(dst)
          current=root/"opt/vf-server-ops-ownertrial147rc3"
          previous=current.with_name(current.name+".previous")
          link=root/"bin/vfops"
          current.parent.mkdir()
          link.parent.mkdir()
          env={**os.environ,"P07_ALLOW_NONROOT":"1","P07_NO_EXEC":"1","P07_INSTALL_DIR":str(current),"P07_PREVIOUS_DIR":str(previous),"P07_BIN_LINK":str(link)}
          def apply(kind):
              call=subprocess.run(["bash",str(root/kind/"installers/p07-final.sh")],env={**env,"P07_PUBLIC_ROOT":(root/kind).as_uri()},cwd=root,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=120)
              if call.returncode: raise AssertionError("ACTUAL_ISSUED_INSTALLER_FAILED_"+kind)
          apply("old")
          for name in ("policy.py","ux.py"):
              content=(root/"new/dist/p07/0.1.0/overlay/lib"/name).read_bytes()
              assert blob(content)==owner.RC3_EXTRA_SOURCE_BLOBS["lib/"+name]
              (current/"lib"/name).write_bytes(content)
          signed={row.split("  ",1)[1] for row in (current/".runtime-manifest.gitblob").read_text().splitlines()}
          sources=[p for p in sorted((current/"lib").glob("*.py")) if p.relative_to(current).as_posix() in signed]
          options=[(p,k) for k in (0,1) for p in sources]
          assert len(options)>=66
          (current/"lib/__pycache__").mkdir(mode=0o755)
          for p,k in options[:66]: py_compile.compile(str(p),doraise=True,optimize=k)
          def fingerprint(d):
              return {p.relative_to(d).as_posix():(p.lstat().st_mode,p.lstat().st_uid,sha(p) if p.is_file() else None) for p in d.rglob("*")}
          old_snapshot=fingerprint(current)
          apply("new")
          assert fingerprint(previous)==old_snapshot
          assert (current/"BUILD_ID").read_text().strip()=="0.1.0-release147-rc4"
          assert (previous/"BUILD_ID").read_text().strip()=="0.1.0-release147-rc3"
          before=(fingerprint(current),fingerprint(previous))
          for p in (current,previous):
              if not owner.verified_p07_trial_runtime(p):
                  print("M05_ACTUAL_REJECTED="+p.name,flush=True)
                  raise AssertionError("ACTUAL_PAIR_GUARD_FAILED")
          entries=[current.name,previous.name]
          # Real verifier on genuine files, synthetic host inventory, never bootstrap.
          with mock.patch.object(envguard,"verified_toolbox_entry",side_effect=lambda base,entry: base=="/opt" and owner.verified_p07_trial_runtime(current.parent/entry)):
              assert envguard.inspect(FakeProbe(children={"/opt":entries})).status=="CLEAN"
              assert envguard.inspect(FakeProbe(children={"/opt":entries},paths=("/var/lib/mysql",))).status=="OCCUPIED"
              assert envguard.inspect(FakeProbe(children={"/opt":entries},paths=("/home/clp",))).status=="OCCUPIED"
              assert envguard.inspect(FakeProbe(children={"/opt":entries+["unknown-app"]})).status=="OCCUPIED"
              for runtime in (current,previous):
                  bad=runtime/"lib/foreign.py"
                  bad.write_bytes(b"foreign code")
                  assert envguard.inspect(FakeProbe(children={"/opt":entries})).status=="OCCUPIED"
                  bad.unlink()
              assert envguard.inspect(FakeProbe(children={"/opt":entries})).status=="CLEAN"
          assert (fingerprint(current),fingerprint(previous))==before
          print("P07_M05_REAL_RC4_PREVIOUS_PAIR_CLEAN_AND_BUSINESS_DENIAL=PASS",flush=True)
          # Build isolated M05 candidate twice; use the real public atomic installer.
          from build_p07_m05_bundle import build_bundle, BUILD_ID
          a=root/"ux15.zip"; b=root/"ux15-repeat.zip"
          build_bundle(a,product); build_bundle(b,product)
          assert a.read_bytes()==b.read_bytes()
          spec=importlib.util.spec_from_file_location("public_m05",repo/"installers/p07-m05-atomic.py")
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          m.BASE=root/"vfops-modules"
          old="0.1.0-m05-ux14-verified-pycache"
          markers={}
          for slot in ("m01","m02","m03","m04"):
              folder=m.BASE/slot
              folder.mkdir(parents=True)
              marker=folder/"sentinel"
              marker.write_bytes(("unchanged-"+slot).encode())
              markers[marker]=marker.read_bytes()
          with mock.patch.object(m.os,"geteuid",return_value=0):
              assert m.install(root/"ux14.zip",sha(root/"ux14.zip"))==old
              assert m.install(a,sha(a))==BUILD_ID
              assert m.install(a,sha(a))==BUILD_ID
              try: m.install(a,"0"*64)
              except m.Unsafe: pass
              else: raise AssertionError("BAD_PACKAGE_ACCEPTED")
              assert os.readlink(m.BASE/"m05/current")=="releases/"+BUILD_ID
              assert m.rollback(old,"P07-M05:"+old)==old
          assert all(p.read_bytes()==data for p,data in markers.items())
          assert (fingerprint(current),fingerprint(previous))==before
          print("P07_M05_ACTUAL_PACKAGE_ATOMIC_ROLLBACK_AND_OTHER_MODULES=PASS",flush=True)
          print("P07_M05_DEV_CANDIDATE_BUILD="+BUILD_ID,flush=True)
          print("P07_M05_DEV_CANDIDATE_SHA256="+sha(a),flush=True)
          PY
          # _issuer_base_config_pins consumes the ZIP member mapping, no private source logging.
          sed -i 's/from p07_m03_rc3_recovery_bundle import _issuer_base_config_pins,_official_files/from p07_m03_rc3_recovery_bundle import _issuer_base_config_pins/' "$root/proof.py"
          if ! python3 -B "$root/proof.py" "$root" >"$root/proof.log" 2>&1; then
            grep -E '^(P07_M05_|ISSUED_CONFIG_PIN=|M05_ACTUAL_REJECTED=|AssertionError:|ImportError:|NameError:)' "$root/proof.log" | cut -c1-250 || true
            exit 22
          fi
          grep -E '^P07_M05_' "$root/proof.log"
      - name: Always erase transient private source and sandbox
        if: always()
        shell: bash
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/transient-p07" "$RUNNER_TEMP/m05-compat"
          test ! -e "$GITHUB_WORKSPACE/transient-p07"
          echo P07_M05_TRANSIENT_CLEAN=PASS
