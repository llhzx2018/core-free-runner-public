name: P02 V2.5.128 W1 Reader FULL Atomic candidate exact-source preflight

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v25128-reader-candidate-oneoff.yml'

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact private P02 source transiently
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-library
          ref: b4846fae51571a8a5b0204c76e99da166084da13
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product

      - name: Checkout current GOV-DOC for actual public delivery format gate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/gov-doc
          ref: 7dd6815d1bb8de481ac74be21f4e68359aa15407
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: governance

      - name: Check version manifest source and existing regression
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = 'b4846fae51571a8a5b0204c76e99da166084da13'
          test "$(git -C product show -s --format=%T HEAD)" = 'b44d97332282a128a438ee767467cad73d91a1a2'
          test "$(cat product/VERSION)" = '2.5.128'
          php -r 'exit(PHP_VERSION_ID>=80300&&extension_loaded("pdo_sqlite")&&extension_loaded("sqlite3")?0:1);'
          if ! php -r 'exit(extension_loaded("zip")?0:1);'; then
            timeout 150s sudo apt-get install -y php8.3-zip
          fi
          cd product
          python3 scripts/generate-source-manifest.py
          git diff --exit-code -- SOURCE_MANIFEST.json SOURCE_MANIFEST.txt
          bash scripts/verify-repository.sh
          node tests/unit/p02_candidate_version_identity_contract.mjs
          echo P02_V25128_EXACT_SOURCE_AND_MANIFEST=PASS

      - name: Build candidate FULL SOURCE UPDATE ATOMIC repair twice
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          opts=(--source-version 2.5.124 --source-version 2.5.127
            --source-commit 'b4846fae51571a8a5b0204c76e99da166084da13' --source-tree 'b44d97332282a128a438ee767467cad73d91a1a2'
            --source-ref candidate/p02-w1-reader-v25128-20261112)
          python3 scripts/build-candidate.py --out build/candidate "${opts[@]}"
          python3 scripts/build-candidate.py --out build/candidate-repeat "${opts[@]}"
          (cd build/candidate && sha256sum -c SHA256SUMS.txt)
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,hashlib,json
          a=Path('build/candidate');b=Path('build/candidate-repeat')
          def state(root):
              return {p.name:(p.stat().st_size,hashlib.sha256(p.read_bytes()).hexdigest())
                      for p in root.iterdir() if p.is_file()}
          assert state(a)==state(b), 'candidate two-pass bytes differ'
          expected={
              'VF_Library_V2.5.128_SOURCE_CANDIDATE.zip',
              'VF_Library_V2.5.128_FULL_CANDIDATE.zip',
              'VF_Library_V2.5.128_UPDATE_CANDIDATE.zip',
              'VF_Library_V2.5.128_ATOMIC_CANDIDATE.zip',
              'repair-v2.5.128-candidate.php',
              'VF_Library_V2.5.128_CANDIDATE_NOTES.md',
              'VF_Library_V2.5.128_CANDIDATE_MANIFEST.json',
              'SHA256SUMS.txt',
          }
          assert set(state(a))==expected,(set(state(a)),expected)
          for path in a.glob('*.zip'):
              with zipfile.ZipFile(path) as z:
                  assert z.testzip() is None
                  assert not any('.env' in x or 'PRIVATE_DATA' in x or x.endswith(('.db','.sqlite','.sqlite3')) for x in z.namelist())
          with zipfile.ZipFile(a/'VF_Library_V2.5.128_UPDATE_CANDIDATE.zip') as z:
              pkg=json.loads(z.read('atomic-manifest.json'))
              assert pkg['target_version']=='2.5.128'
              assert pkg['source_versions']==['2.5.124','2.5.127']
              assert pkg['source_schema']==pkg['target_schema']==2401
          with zipfile.ZipFile(a/'VF_Library_V2.5.128_FULL_CANDIDATE.zip') as z:
              assert 'setup.php' in z.namelist()
              assert 'VERSION.txt' in z.namelist()
              assert z.read('VERSION.txt').strip()==b'2.5.128'
          print('P02_V25128_CANDIDATE_8_ASSETS_DETERMINISTIC=PASS')
          for name,(size,sha) in sorted(state(a).items()):
              print('P02_CANDIDATE_ASSET='+json.dumps({'name':name,'bytes':size,'sha256':sha},sort_keys=True))
          PY

      - name: Public Authority real-package structural FULL and Atomic checks
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,subprocess
          root=Path('product');out=root/'build/candidate'
          sha=subprocess.check_output(['git','-C',str(root),'rev-parse','HEAD'],text=True).strip()
          required=['INSTALL','SECURITY','TESTING','UPGRADE','DATA_SCHEMA','API_PROVIDER','CRON_JOB','NOTIFICATION','OBSERVABILITY','GIT','UA_UI']
          for profile,name,entry in [
              ('web_full_zip','VF_Library_V2.5.128_FULL_CANDIDATE.zip','setup.php'),
              ('web_atomic_zip','VF_Library_V2.5.128_UPDATE_CANDIDATE.zip','atomic-manifest.json')]:
              asset=out/name
              rec={'schema':'vf.public-authority.task-delivery-check.v1',
                'project':'P02','source':sha,
                'project_authority':{'agents':'AGENTS.md','current':'docs/authority/CURRENT.md',
                  'acceptance':'docs/authority/ACCEPTANCE_MATRIX.md',
                  'applicability':'docs/authority/PUBLIC_AUTHORITY_APPLICABILITY.md'},
                'acceptance_markers':['Exact Candidate','Source-set Matrix','Fresh Install','Rollback'],
                'required_domains':required,
                'task_capabilities':['candidate','source_change','full_package','admin','atomic','database','ui_change','release_visibility'],
                'delivery':{'profile':profile,'artifact':name,'entrypoint':entry,
                  'sha256':hashlib.sha256(asset.read_bytes()).hexdigest(),
                  'requires_git':False,'requires_manual_source_copy':False}}
              receipt=Path('/tmp')/(name+'.receipt.json')
              receipt.write_text(json.dumps(rec),encoding='utf-8')
              cmd=['python3','-B','governance/governance/public-authority/tools/task_delivery_contract_lint.py',
                '--phase','delivery','--receipt',str(receipt),
                '--project-root',str(root),'--artifact-root',str(out),
                '--public-router','governance/governance/public-authority/VF_PUBLIC_AUTHORITY_APPLICABILITY_ROUTER_V1.0.json']
              subprocess.run(cmd,check=True)
              receipt.unlink()
          print('P02_V25128_PUBLIC_DELIVERY_STRUCTURE=PASS')
          PY

      - name: Formal-format artifact preflight without Formal Release or publication
        shell: bash
        env:
          VF_RELEASE_SOURCE_SHA: b4846fae51571a8a5b0204c76e99da166084da13
          VF_RELEASE_SOURCE_TREE: b44d97332282a128a438ee767467cad73d91a1a2
          VF_RELEASE_SOURCE_REF: candidate/p02-w1-reader-v25128-20261112
          VF_RELEASE_FROM_VERSIONS: '2.5.124 2.5.127'
        run: |
          set -Eeuo pipefail
          cd product
          bash scripts/verify-release-artifacts.sh
          echo P02_V25128_CLEAN_FULL_AND_FORMAT_PREFLIGHT=PASS

      - name: Clean transient private checkouts and candidate bytes
        if: always()
        shell: bash
        run: |
          rm -rf product governance
          echo P02_PRIVATE_SOURCE_PACKAGE_NOT_PERSISTED_IN_PUBLIC=YES
