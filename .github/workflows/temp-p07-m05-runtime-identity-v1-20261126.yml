name: TEMP P07 runtime identity protocol v1 exact proof
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temp-p07-m05-runtime-identity-v1-20261126.yml
permissions:
  contents: read
jobs:
  identity-v1:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.actor == 'llhzx2018' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'temp/p07-m05-runtime-identity-v1-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PRODUCT_SHA: 'fe93bcf3cdcc8e5fcc74b53207d2c58456a7a250'
      PRODUCT_BASE: '51520a4422c87888f79e349b79914ca1f64826ef'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 'ceefc3cec3725916a0d9d482a150a3c7c3733bf0'
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 'fe93bcf3cdcc8e5fcc74b53207d2c58456a7a250'
          path: transient-p07
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: '20631614c585aab137c7be89828f21408697491f'
          path: transient-gov
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Exact scope and architecture gate
        run: |
          set -Eeuo pipefail
          set +x
          mkdir -m 700 "$RUNNER_TEMP/p07-identity"
          cd transient-p07
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          python3 -B .github/checks/architecture_gate.py --manifest .github/checks/code_architecture.json --gov-root ../transient-gov --git-root . --base-sha "$PRODUCT_BASE" --head-sha "$PRODUCT_SHA" >"$RUNNER_TEMP/p07-identity/arch.log" 2>&1 || { echo P07_IDENTITY_ARCH=FAIL; exit 21; }
          echo P07_IDENTITY_ARCH=PASS
      - name: All affected safety and package suites once
        if: ${{ !cancelled() }}
        run: |
          set -Eeuo pipefail
          set +x
          cd transient-p07
          status=0
          for suite in test_p07_m05_runtime_identity.py test_p07_m05_trial_cache_guard.py test_p07_m05_dirty_host_guard.py test_p07_m05_installed_root_guard.py test_p07_m05_host_write_gate.py test_p07_m05_isolated_module.py; do
            log="$RUNNER_TEMP/p07-identity/$suite.log"
            if python3 -B -m unittest discover -s tests -p "$suite" -v >"$log" 2>&1 && grep -Fxq OK "$log"; then
              echo "P07_IDENTITY_SUITE=PASS:$suite"
            else
              echo "P07_IDENTITY_SUITE=FAIL:$suite"
              grep -E '^(FAIL|ERROR):' "$log" | cut -c1-180 || true
              status=1
            fi
            grep -E '^Ran [0-9]+ tests?' "$log" || true
          done
          exit "$status"
      - name: Nine genuine issued assets and isolated installed runtime proof
        if: ${{ !cancelled() }}
        run: |
          set -Eeuo pipefail
          set +x
          umask 022
          unset GH_TOKEN GITHUB_TOKEN
          root="$RUNNER_TEMP/p07-identity"
          base=https://github.com/llhzx2018/core-free-runner-public/releases/download
          api=https://api.github.com/repos/llhzx2018/core-free-runner-public/releases/assets
          fetch() { curl -q --proto '=https' --tlsv1.2 -fsSL --retry 1 --connect-timeout 10 --max-time 90 "$@"; }
          asset() {
            if ! fetch "$base/$1/$2" -o "$root/$3.zip"; then fetch -H 'Accept: application/octet-stream' "$api/$4" -o "$root/$3.zip"; fi
            printf '%s  %s\n' "$5" "$root/$3.zip" | sha256sum -c -
          }
          asset p07-all-ux-v0.1.0-20261118 P07-M01-0.1.0-ux3.zip m01 762749017 13e79e7c7a4f1170c74da24e783804c3c2bda06fe6c46b768497694e826b3ed7
          asset p07-all-ux-v0.1.0-20261118 P07-M02-2.1.1-ux3.zip m02 762749018 88da5b8219fb7e04d606eb3de998d872747cb05153bdd93c7351b46f957164b4
          asset p07-all-ux-v0.1.0-20261118 P07-M04-0.1.0-ux5.zip m04 762749019 2ff45c263f930e258a3c323b6c009e0973531d3f90a2e432a66aed704c9baa7d
          asset p07-m03-v0.1.0-release145-20261122 P07-M03-0.1.0-release145.zip stable145 778717435 e694d294711d36b970a1e49afd7f57e4400b7df29527576ac2329724b38a54b8
          asset p07-m03-v0.1.0-release146-20261122 P07-M03-0.1.0-release146.zip stable146 779298830 7b3e46c651c5ce3597e4ab535fbdc734023fc1b706fe85189a344ee600514321
          asset p07-m03-v0.1.0-release147-rc3-ownertrial-20261123 P07-M03-0.1.0-release147-rc3-OWNER-TRIAL.zip rc3 781359770 3646285a2732c8249d0296a72c7ce6fae83be1e9564d76849e65bc396642672d
          asset p07-m03-v0.1.0-release147-rc4-maintenance-20261125 P07-M03-0.1.0-release147-rc4-MAINTENANCE.zip rc4 793699101 85570da2d135e39ae3634e511298e50dede81015019e305c7de068e04ca93238
          asset p07-m05-v0.1.0-ux14-verified-pycache-20261125 P07-M05-0.1.0-m05-ux14-verified-pycache.zip ux14 790455651 8cca47f0a7bfed619daefe3074697f3837fc92c50103d218a12ca9149cd9d11d
          asset p07-m05-v0.1.0-ux15-rc4-runtime-compat-20261126 P07-M05-0.1.0-m05-ux15-rc4-runtime-compat.zip ux15 793988269 fa67235dbc9fc7d132b057da7095d5064d1b72f7308a781aa7d616e942d27d99
          fetch https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/cadbe0b84b9d39a70df7f6863ef6967449f90886/installers/p07-three-ux-atomic.py -o installers/p07-three-ux-atomic.py
          test "$(git hash-object installers/p07-three-ux-atomic.py)" = 9fc4ecfab8bca665ccde238f0e40631657205f82
          test "$(git hash-object installers/p07-m05-atomic.py)" = 17e47121ac27f31162d93a72aa0b1dbea602ea01
          cat >"$root/assets.json" <<'JSON'
          [["m01","p07-all-ux-v0.1.0-20261118","P07-M01-0.1.0-ux3.zip",762749017,"13e79e7c7a4f1170c74da24e783804c3c2bda06fe6c46b768497694e826b3ed7","cadbe0b84b9d39a70df7f6863ef6967449f90886","0.1.0-ux3"],["m02","p07-all-ux-v0.1.0-20261118","P07-M02-2.1.1-ux3.zip",762749018,"88da5b8219fb7e04d606eb3de998d872747cb05153bdd93c7351b46f957164b4","cadbe0b84b9d39a70df7f6863ef6967449f90886","2.1.1-ux3"],["m04","p07-all-ux-v0.1.0-20261118","P07-M04-0.1.0-ux5.zip",762749019,"2ff45c263f930e258a3c323b6c009e0973531d3f90a2e432a66aed704c9baa7d","cadbe0b84b9d39a70df7f6863ef6967449f90886","0.1.0-ux5"],["stable145","p07-m03-v0.1.0-release145-20261122","P07-M03-0.1.0-release145.zip",778717435,"e694d294711d36b970a1e49afd7f57e4400b7df29527576ac2329724b38a54b8","7b4969fd4922a51fc2a31f8a44a1774ab157ce60","0.1.0-release145"],["stable146","p07-m03-v0.1.0-release146-20261122","P07-M03-0.1.0-release146.zip",779298830,"7b3e46c651c5ce3597e4ab535fbdc734023fc1b706fe85189a344ee600514321","e77ed2fb85e325959b37dab5f0a5ec846817dc5d","0.1.0-release146"],["rc3","p07-m03-v0.1.0-release147-rc3-ownertrial-20261123","P07-M03-0.1.0-release147-rc3-OWNER-TRIAL.zip",781359770,"3646285a2732c8249d0296a72c7ce6fae83be1e9564d76849e65bc396642672d","63758a0eb5424d321ca413831d1115514989f5c0","0.1.0-release147-rc3"],["rc4","p07-m03-v0.1.0-release147-rc4-maintenance-20261125","P07-M03-0.1.0-release147-rc4-MAINTENANCE.zip",793699101,"85570da2d135e39ae3634e511298e50dede81015019e305c7de068e04ca93238","66ad1af3da009988d84e7dc4cd4badb5b1f4b650","0.1.0-release147-rc4"],["ux14","p07-m05-v0.1.0-ux14-verified-pycache-20261125","P07-M05-0.1.0-m05-ux14-verified-pycache.zip",790455651,"8cca47f0a7bfed619daefe3074697f3837fc92c50103d218a12ca9149cd9d11d","b581c35589bb5b4af21116e6d4cc4735da50db0c","0.1.0-m05-ux14-verified-pycache"],["ux15","p07-m05-v0.1.0-ux15-rc4-runtime-compat-20261126","P07-M05-0.1.0-m05-ux15-rc4-runtime-compat.zip",793988269,"fa67235dbc9fc7d132b057da7095d5064d1b72f7308a781aa7d616e942d27d99","f85c0f45f33632efee48b982087091346b7736f5","0.1.0-m05-ux15-rc4-runtime-compat"]]
          JSON
          cat >"$root/proof.py" <<'PY'
          import hashlib,importlib.util,json,os,pathlib,py_compile,subprocess,sys,zipfile
          from unittest import mock
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"p07-identity"
          repo=pathlib.Path.cwd()
          product=repo/"transient-p07"
          sys.path[:0]=[str(product/"lib"),str(product/"scripts"),str(product/"tests")]
          from build_p07_runtime_identity import build_record,_checked_zip
          from m05_runtime_identity import CatalogSession,parse_catalog
          from m05_environment_guard import inspect
          from test_p07_m05_dirty_host_guard import FakeProbe
          from m05_owner_trial_guard import RC3_EXTRA_SOURCE_BLOBS
          from build_p07_m05_bundle import build_bundle, BUILD_ID
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          blob=lambda b:hashlib.sha1(b"blob "+str(len(b)).encode()+b"\0"+b).hexdigest()
          rows=json.loads((root/"assets.json").read_text())
          data={r[0]:r for r in rows}
          records=[]
          def record(key):
              _,_,_,_,digest,source,build=data[key]
              z=root/(key+".zip")
              if key in ("m01","m02","m04","ux14","ux15"):
                  slot=key if key.startswith("m") else "m05"
                  return build_record(z,digest,path="vfops-modules/"+slot+"/releases/"+build,build=build,
                      version="0.1.0" if slot=="m05" else build,marker="MODULE_MANIFEST.json",
                      archive_marker="p07-"+slot+"/MODULE_MANIFEST.json",roles=["current"],source_sha=source)
              path="vf-server-ops" if key.startswith("stable") else "vf-server-ops-ownertrial147rc3"
              pred={"stable146":"stable145","rc4":"rc3"}.get(key)
              return build_record(z,digest,path=path,build=build,version="0.1.0",
                  marker=".runtime-manifest.gitblob",archive_marker="dist/p07/0.1.0/overlay/RUNTIME.gitblob",
                  base_tar="dist/p07/0.1.0-rc2/P07_VF_SERVER_OPS_0.1.0-rc2.tar.gz",
                  roles=["current","previous"],source_sha=source,predecessors=[data[pred][-1]] if pred else [])
          for key in data:
              rec=record(key)
              if key=="rc3":
                  with zipfile.ZipFile(root/"rc4.zip") as z:
                      for name,expected in RC3_EXTRA_SOURCE_BLOBS.items():
                          raw=z.read("dist/p07/0.1.0/overlay/"+name)
                          assert blob(raw)==expected
                          rec["optional"][name]=hashlib.sha256(raw).hexdigest()
              records.append(rec)
              print("P07_IDENTITY_RECORD="+json.dumps(rec,sort_keys=True,separators=(",",":")),flush=True)
          def session():
              return CatalogSession(loader=lambda:parse_catalog(json.dumps({"schema":"vf.p07.runtime-identities.v1","records":records}).encode()),base=root/"opt")
          def mod(name,path):
              spec=importlib.util.spec_from_file_location(name,path)
              m=importlib.util.module_from_spec(spec)
              spec.loader.exec_module(m)
              return m
          base=root/"opt";base.mkdir()
          three=mod("three",repo/"installers/p07-three-ux-atomic.py")
          m=mod("m05",repo/"installers/p07-m05-atomic.py")
          three.BASE=m.BASE=base/"vfops-modules"
          with mock.patch.object(os,"geteuid",return_value=0):
              for key in ("m01","m02","m04"):
                  three.install("P07-"+key.upper(),root/(key+".zip"),data[key][4])
              for key in ("ux14","ux15"):
                  assert m.install(root/(key+".zip"),data[key][4])==data[key][-1]
          assert session().classify("vfops-modules") is True
          print("P07_IDENTITY_REAL_M01_M02_M04_M05=PASS",flush=True)
          def fingerprint(d):
              return {p.relative_to(d).as_posix():(p.lstat().st_mode,os.readlink(p) if p.is_symlink() else sha(p) if p.is_file() else None) for p in d.rglob("*")}
          def apply(key,current):
              dst=root/key;dst.mkdir()
              with _checked_zip((root/(key+".zip")).read_bytes()) as z:z.extractall(dst)
              link=root/(current.name+"-link")
              env={**os.environ,"P07_ALLOW_NONROOT":"1","P07_NO_EXEC":"1","P07_INSTALL_DIR":str(current),
                  "P07_PREVIOUS_DIR":str(current.with_name(current.name+".previous")),"P07_BIN_LINK":str(link),"P07_PUBLIC_ROOT":dst.as_uri()}
              call=subprocess.run(["bash",str(dst/"installers/p07-final.sh")],env=env,cwd=root,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=120)
              assert call.returncode==0,"ISSUED_INSTALL_FAILED_"+key
          stable=base/"vf-server-ops"
          apply("stable145",stable); old=fingerprint(stable);apply("stable146",stable)
          assert fingerprint(stable.with_name(stable.name+".previous"))==old
          trial=base/"vf-server-ops-ownertrial147rc3"
          apply("rc3",trial)
          for name in RC3_EXTRA_SOURCE_BLOBS:
              with zipfile.ZipFile(root/"rc4.zip") as z:
                  (trial/name).write_bytes(z.read("dist/p07/0.1.0/overlay/"+name))
          signed={r.split("  ",1)[1] for r in (trial/".runtime-manifest.gitblob").read_text().splitlines()}
          sources=[p for p in sorted((trial/"lib").glob("*.py")) if p.relative_to(trial).as_posix() in signed]
          options=[(p,k) for k in (0,1) for p in sources];assert len(options)>=66
          (trial/"lib/__pycache__").mkdir(mode=0o755)
          for p,k in options[:66]:py_compile.compile(str(p),doraise=True,optimize=k)
          old=fingerprint(trial);apply("rc4",trial)
          assert fingerprint(trial.with_name(trial.name+".previous"))==old
          entries=["vfops-modules",stable.name,stable.name+".previous",trial.name,trial.name+".previous"]
          for entry in entries:
              assert session().classify(entry) is True,"ACTUAL_IDENTITY_REJECTED_"+entry
          assert inspect(FakeProbe(children={"/opt":entries}),identity_session=session()).status=="CLEAN"
          for path in ("/var/lib/mysql","/home/clp"):
              assert inspect(FakeProbe(children={"/opt":entries},paths=(path,)),identity_session=session()).status=="OCCUPIED"
          before=fingerprint(base)
          for d in (trial,trial.with_name(trial.name+".previous"),stable):
              bad=d/"lib/foreign.py";bad.write_bytes(b"foreign\n")
              assert session().classify(d.name) is False
              bad.unlink()
          assert fingerprint(base)==before
          print("P07_IDENTITY_REAL_M03_BOTH_PAIRS_AND_BUSINESS_DENIAL=PASS",flush=True)
          a=root/"candidate.zip";b=root/"candidate-repeat.zip"
          build_bundle(a,product);build_bundle(b,product);assert a.read_bytes()==b.read_bytes()
          rec=build_record(a,sha(a),path="vfops-modules/m05/releases/"+BUILD_ID,build=BUILD_ID,version="0.1.0",marker="MODULE_MANIFEST.json",archive_marker="p07-m05/MODULE_MANIFEST.json",roles=["current"],source_sha=os.environ["PRODUCT_SHA"])
          records.append(rec)
          others={key:fingerprint(three.BASE/key) for key in ("m01","m02","m04")}
          with mock.patch.object(os,"geteuid",return_value=0):
              assert m.install(a,sha(a))==BUILD_ID
              assert session().classify("vfops-modules") is True
              assert m.install(a,sha(a))==BUILD_ID
              try:m.install(a,"0"*64)
              except m.Unsafe:pass
              else:raise AssertionError("BAD_PACKAGE_ACCEPTED")
              assert m.rollback(data["ux15"][-1],"P07-M05:"+data["ux15"][-1])==data["ux15"][-1]
          assert all(fingerprint(three.BASE/key)==v for key,v in others.items())
          assert session().classify("vfops-modules") is True
          print("P07_IDENTITY_UX16_UPGRADE_ROLLBACK_ISOLATION=PASS",flush=True)
          print("P07_IDENTITY_CANDIDATE_SHA256="+sha(a),flush=True)
          PY
          if ! python3 -B "$root/proof.py" >"$root/proof.log" 2>&1; then
            grep -E '^(P07_IDENTITY_|AssertionError:|ValueError:|KeyError:|TypeError:|ImportError:)' "$root/proof.log" | cut -c1-2500 || true
            exit 22
          fi
          grep '^P07_IDENTITY_' "$root/proof.log"
      - name: Erase transient private source and sandbox
        if: always()
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/transient-p07" "$GITHUB_WORKSPACE/transient-gov" "$RUNNER_TEMP/p07-identity"
          test ! -e "$GITHUB_WORKSPACE/transient-p07"
          test ! -e "$GITHUB_WORKSPACE/transient-gov"
          echo P07_IDENTITY_TRANSIENT_CLEAN=PASS
