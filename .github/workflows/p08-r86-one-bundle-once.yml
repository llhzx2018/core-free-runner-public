name: P08 R86 verified single Owner R21 ZIP candidate build and safety negatives
on:
  push:
    branches: [test/p08-r86-owner-bundle-20261113]
permissions:
  contents: read
jobs:
  exact-r21-recovery-package:
    if: ${{ github.repository == 'llhzx2018/core-free-runner-public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: f8496c916c296907550c7ce3c7098de00e8ca61a
          path: source
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl,zip
          coverage: none
      - name: Exact SHA, runtime source, first Owner refusal and shell syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = f8496c916c296907550c7ce3c7098de00e8ca61a
          php -l source/scripts/p08-r21-official-atomic-once.php
          bash -n source/scripts/p08-r21-cloudpanel-one-time.sh
          python3 -B -m py_compile source/scripts/build_p08_r21_owner_bundle.py
          if bash source/scripts/p08-r21-cloudpanel-one-time.sh --apply /tmp/wrong-site /tmp/fake-bundle >/dev/null 2>&1; then echo BAD_SITE_WAS_ACCEPTED; exit 11; fi
          if php source/scripts/p08-r21-official-atomic-once.php --apply-from-bridge /tmp/wrong-site /tmp/fake-archive >/dev/null 2>&1; then echo BAD_PHP_INPUT_ACCEPTED; exit 12; fi
          echo P08_R86_UNTRUSTED_SITE_REFUSAL_AND_BASH_PHP_SYNTAX=PASS
      - name: Download official three assets with scoped runtime credential
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          mkdir -m 0700 "$RUNNER_TEMP/p08-r86-official"
          for item in             743175524:VF_AdOps_V0.1.0_BRIDGE_FULL.zip             743175534:VF_AdOps_V0.1.1_FULL.zip             743175523:VF_AdOps_V0.1.1_UPDATE.zip
          do
            id="${item%%:*}"
            name="${item#*:}"
            curl --fail --silent --show-error --location --retry 2               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/octet-stream"               -H 'X-GitHub-Api-Version: 2022-11-28'               "https://api.github.com/repos/llhzx2018/vf-adops/releases/assets/$id"               -o "$RUNNER_TEMP/p08-r86-official/$name"
            test -s "$RUNNER_TEMP/p08-r86-official/$name"
          done
          echo P08_R86_OFFICIAL_PRIVATE_ASSET_FETCHED_WITH_NO_PUBLIC_ARTIFACT=PASS
      - name: Build exactly one Owner bundle with embedded immutability checks
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B source/scripts/build_p08_r21_owner_bundle.py             --repo source --official-assets "$RUNNER_TEMP/p08-r86-official"             --output "$RUNNER_TEMP/VF_AdOps_R21_OWNER_RECOVERY_ONCE.zip"             | tee "$RUNNER_TEMP/p08-r86-build-result.json"
          test "$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["status"])' "$RUNNER_TEMP/p08-r86-build-result.json")" = OWNER_TRIAL_RECOVERY_BUNDLE_BUILT
          test "$(unzip -Z -1 "$RUNNER_TEMP/VF_AdOps_R21_OWNER_RECOVERY_ONCE.zip" | wc -l)" -eq 9
          unzip -tqq "$RUNNER_TEMP/VF_AdOps_R21_OWNER_RECOVERY_ONCE.zip"
          mkdir -m 0700 "$RUNNER_TEMP/p08-r86-extracted"
          unzip -q "$RUNNER_TEMP/VF_AdOps_R21_OWNER_RECOVERY_ONCE.zip" -d "$RUNNER_TEMP/p08-r86-extracted"
          (cd "$RUNNER_TEMP/p08-r86-extracted" && sha256sum -c SHA256SUMS)
          echo P08_R86_ONE_PACKAGE_NINE_PARTS_ALL_OFFICIAL_SHA256=PASS
      - name: Deliberate tamper and wrong Owner refusal, no destructive apply
        shell: bash
        run: |
          set -Eeuo pipefail
          cp -a source "$RUNNER_TEMP/p08-r86-tamper"
          printf '\n# test-only tamper\n' >> "$RUNNER_TEMP/p08-r86-tamper/scripts/p08-r21-official-atomic-once.php"
          if python3 -B "$RUNNER_TEMP/p08-r86-tamper/scripts/build_p08_r21_owner_bundle.py"               --repo "$RUNNER_TEMP/p08-r86-tamper"               --official-assets "$RUNNER_TEMP/p08-r86-official"               --output "$RUNNER_TEMP/p08-r86-mutated-bundle.zip" > /dev/null 2>&1; then
            echo P08_R86_TAMPERED_PHP_ACCEPTED; exit 20
          fi
          printf '\ncorrupt\n' >> "$RUNNER_TEMP/p08-r86-official/VF_AdOps_V0.1.1_UPDATE.zip"
          if python3 -B source/scripts/build_p08_r21_owner_bundle.py               --repo source               --official-assets "$RUNNER_TEMP/p08-r86-official"               --output "$RUNNER_TEMP/p08-r86-wrong-asset.zip" > /dev/null 2>&1; then
            echo P08_R86_TAMPERED_OFFICIAL_UPDATE_ACCEPTED; exit 21
          fi
          echo P08_R86_HELPER_TAMPER_AND_OFFICIAL_ASSET_TAMPER_REFUSED=PASS
      - name: Delete all private source and ZIPs, no artifact upload
        if: always()
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          rm -rf source "$RUNNER_TEMP/p08-r86-official" "$RUNNER_TEMP/p08-r86-extracted" "$RUNNER_TEMP/p08-r86-tamper"
          rm -f "$RUNNER_TEMP/VF_AdOps_R21_OWNER_RECOVERY_ONCE.zip" "$RUNNER_TEMP/p08-r86-build-result.json" "$RUNNER_TEMP/p08-r86-mutated-bundle.zip" "$RUNNER_TEMP/p08-r86-wrong-asset.zip"
          echo P08_R86_PUBLIC_RUNNER_PRIVATE_SRC_AND_ARTIFACT_PERSISTENCE=NO
