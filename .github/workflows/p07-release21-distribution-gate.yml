name: P07 Release21 Distribution Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'installers/p07.sh'
      - 'installers/p07-final.sh'
      - 'installers/p07-toolbox.sh'
      - 'dist/p07/0.1.0/overlay/**'
      - '.github/workflows/p07-release21-distribution-gate.yml'

permissions:
  contents: read

jobs:
  distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Release21 identity
        run: |
          set -Eeuo pipefail
          root='dist/p07/0.1.0/overlay'
          test "$(cat "$root/BUILD_ID")" = '0.1.0-release21'
          grep -Fq 'EXPECTED_BUILD_ID="0.1.0-release21"' installers/p07-final.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release21"' installers/p07-toolbox.sh
          grep -Fq 'RUNTIME_MANIFEST_BLOB="32583b097d33c32b68e3bca7d9dce2fd08c0c778"' installers/p07-final.sh
          grep -Fq 'EXPECTED_BLOB="8da9b42cc4e2d6d5a6c649812a8fe074fd71cf28"' installers/p07.sh
          grep -Fq '| B53 | Restore-As Systemd Main-process HUP Fallback |' "$root/docs/authority/ACCEPTANCE_MATRIX.md"

      - name: Exact overlay and runtime manifests
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('dist/p07/0.1.0/overlay')
          def blob(path: Path) -> str:
              data=path.read_bytes()
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          for name in ('RUNTIME.gitblob','MANIFEST.gitblob'):
              seen=set()
              for line in (root/name).read_text(encoding='utf-8').splitlines():
                  if not line.strip():
                      continue
                  expected, rel=line.split('  ',1)
                  assert rel not in seen, (name, rel)
                  seen.add(rel)
                  path=root/rel
                  assert path.is_file(), (name, rel)
                  assert blob(path)==expected, (name, rel, blob(path), expected)
          runtime=(root/'RUNTIME.gitblob').read_text(encoding='utf-8')
          required={
              'BUILD_ID':'f26f9236ca03d0c75df19ac41d869e530cf9fcb3',
              'lib/restore_as_verified.py':'606ccacdb67d740f27badb4652485dbcb728b9ba',
              'lib/restore_failure_ui.sh':'e7eb4c4b411fc4186bdb670bb7c7ef0d5ce1e252',
          }
          for rel, expected in required.items():
              assert f'{expected}  {rel}' in runtime, rel
          PY

      - name: Release21 managed HUP contract
        run: |
          set -Eeuo pipefail
          root='dist/p07/0.1.0/overlay'
          grep -Fq 'def _systemd_main_hup_reload' "$root/lib/restore_as_verified.py"
          grep -Fq '[systemctl, "reload", "nginx"]' "$root/lib/restore_as_verified.py"
          grep -Fq '"--kill-whom=main"' "$root/lib/restore_as_verified.py"
          grep -Fq '"--signal=HUP"' "$root/lib/restore_as_verified.py"
          grep -Fq 'SYSTEMD_MAIN_HUP' "$root/lib/restore_as_verified.py"
          grep -Fq 'SERVICE_NOT_ACTIVE' "$root/lib/restore_as_verified.py"
          grep -Fq '常规重载和备用优雅重载都没有完成' "$root/lib/restore_failure_ui.sh"

      - name: Syntax and compile
        run: |
          set -Eeuo pipefail
          root='dist/p07/0.1.0/overlay'
          bash -n "$root/bin/vfops-site-ui"
          bash -n "$root/lib/restore_failure_ui.sh"
          python3 -m py_compile             "$root/lib/restore_as_verified.py"             "$root/lib/restore_as.py"             "$root/lib/restore_apply_core.py"             "$root/lib/verify.py"

      - name: Public overlay release21 regressions
        run: |
          set -Eeuo pipefail
          cd dist/p07/0.1.0/overlay
          export PYTHONPATH="$PWD/lib"
          python3 -m unittest -q             tests.test_restore_as_verified             tests.test_release16_restore_as_sqlite             tests.test_restore_as             tests.test_p07_integration_manifest             tests.test_terminal_ui_color_contract             tests.test_user_entry

      - name: Managed HUP behavior
        run: |
          set -Eeuo pipefail
          root='dist/p07/0.1.0/overlay'
          export PYTHONPATH="$PWD/$root/lib"
          python3 - <<'PY'
          import subprocess
          from unittest import mock
          import restore_as_verified as r

          calls=[
              subprocess.CompletedProcess([],0,stdout='',stderr=''),
              subprocess.CompletedProcess([],0,stdout='active\n',stderr=''),
              subprocess.CompletedProcess([],1,stdout='',stderr='Job type reload is not applicable for unit nginx.service.'),
              subprocess.CompletedProcess([],0,stdout='active\n',stderr=''),
              subprocess.CompletedProcess([],0,stdout='',stderr=''),
              subprocess.CompletedProcess([],0,stdout='active\n',stderr=''),
          ]
          with mock.patch.object(r,'_run',side_effect=calls) as run, mock.patch.object(r.time,'sleep'):
              mode=r._reload_nginx('/usr/sbin/nginx',systemctl='/usr/bin/systemctl')
          assert mode=='SYSTEMD_MAIN_HUP'
          assert run.call_args_list[4].args[0]==[
              '/usr/bin/systemctl','kill','--kill-whom=main','--signal=HUP','nginx'
          ]

          denied=[
              subprocess.CompletedProcess([],0,stdout='',stderr=''),
              subprocess.CompletedProcess([],0,stdout='active\n',stderr=''),
              subprocess.CompletedProcess([],1,stdout='',stderr='Access denied SECRET'),
          ]
          with mock.patch.object(r,'_run',side_effect=denied) as run:
              try:
                  r._reload_nginx('/usr/sbin/nginx',systemctl='/usr/bin/systemctl')
              except r.RestoreAsVerificationError as exc:
                  assert 'PERMISSION_DENIED' in str(exc)
                  assert 'SECRET' not in str(exc)
              else:
                  raise AssertionError('permission failure must fail closed')
          assert len(run.call_args_list)==3
          PY

      - name: Isolated current-runtime install
        run: |
          set -Eeuo pipefail
          root="$PWD"
          tmp="$(mktemp -d)"
          export P07_PUBLIC_ROOT="file://$root"
          export P07_INSTALL_DIR="$tmp/install"
          export P07_PREVIOUS_DIR="$tmp/previous"
          export P07_BIN_LINK="$tmp/vfops"
          export P07_ALLOW_NONROOT=1
          export P07_NO_EXEC=1

          bash installers/p07-final.sh >"$tmp/install.log"
          test "$("$tmp/vfops" --version)" = 'VF Server Ops 0.1.0'
          test "$("$tmp/vfops" --build-id)" = '0.1.0-release21'
          grep -Fq 'lib/restore_as_verified.py' "$tmp/install/.runtime-manifest.gitblob"
          grep -Fq 'lib/restore_failure_ui.sh' "$tmp/install/.runtime-manifest.gitblob"

          bash installers/p07-final.sh >"$tmp/second.log"
          grep -Fq '已是当前版本，无需下载或重复安装' "$tmp/second.log"

      - name: Safety boundary
        run: |
          set -Eeuo pipefail
          root='dist/p07/0.1.0/overlay'
          ! grep -R -n -E '(PRIVATE KEY|BEGIN OPENSSH|ghp_[A-Za-z0-9]|github_pat_)' "$root/bin" "$root/lib" installers/p07*.sh
          ! grep -R -n -E 'systemctl[[:space:]]+restart[[:space:]]+nginx' "$root/bin" "$root/lib"
          ! grep -R -n -E '(^|[^A-Za-z])(rm[[:space:]]+-rf[[:space:]]+/($|[[:space:]]))' installers/p07*.sh "$root/bin" "$root/lib"
          grep -Fq 'cleanup_database' "$root/lib/restore_as_verified.py"
          grep -Fq 'cleanup_site' "$root/lib/restore_as_verified.py"
          grep -Fq 'DNS 没有修改，原网站没有修改。' "$root/lib/restore_failure_ui.sh"

      - name: Result
        if: always()
        run: |
          echo 'P07_RELEASE21_DISTRIBUTION_GATE=COMPLETE'
          echo 'P07_PRODUCTION_WRITE=NOT_RUN'
