name: p01-506-governance-modei-static-review
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-506-governance-modei-static-review.yml'

permissions:
  contents: read

jobs:
  single-case-governance-proof:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout GOV-DOC exact owner-approved case
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 30757ee9f47d976396c5a556ec12bc4ad2f1ed8b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov

      - name: Checkout P01 authority-only exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 61ea5bd8c2d3e93966ef91a96e65d9c771a5afa2
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product

      - name: Validate only scoped Mode I adoption with sealed previous mode
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C gov rev-parse HEAD)" = 30757ee9f47d976396c5a556ec12bc4ad2f1ed8b
          test "$(git -C product rev-parse HEAD)" = 61ea5bd8c2d3e93966ef91a96e65d9c771a5afa2
          test "$(git -C gov hash-object skills/skill-release/V3.4/SKILL.md)" = e4aff1fd3ee135cab6a11dc5b4612fb81ec90569
          test "$(cat product/VERSION)" = 2.47.505
          test "$(cat product/src/VERSION.txt)" = 2.47.505
          python3 - <<'PY'
          from pathlib import Path
          import re
          base=Path('gov')
          main=(base/'CURRENT.md').read_text()
          old=(base/'skills/skill-release/V3.4/SKILL.md').read_text()
          new=(base/'skills/skill-release/V3.5/SKILL.md').read_text()
          case=(base/'governance/release/cases/P01_START247506_SECURITY_RELEASE_FIRST_REVIEW_20261108.md').read_text()
          p=(Path('product')/'docs/authority/ACCEPTANCE_MATRIX.md').read_text()
          assert '| skill-release | V3.5 |' in main
          assert 'version: "3.5"' in new and 'previous_version: "3.4"' in new
          assert len([ln for ln in new.splitlines() if ln.startswith('### Mode ')])==9
          for mode in 'ABCDEFGH':
              assert ('### Mode '+mode+' ') in old and ('### Mode '+mode+' ') in new
          assert new.count('### Mode I · ONE_CASE_P01_V247506_PROTECTION_GUARD_POST_RELEASE_REAL_USE')==1
          for original in ('### Mode F · OWNER_SECURITY_GATED_POST_RELEASE_REAL_USE',
                           '### Mode G · ONE_CASE_S01_EXISTING_RUNTIME_POST_RELEASE_REAL_USE',
                           '### Mode H · ONE_CASE_P01_ATOMIC524_POST_RELEASE_OWNER_REAL_USE'):
              assert original in new
          for text in ('NO_AUTOMATIC_PRODUCTION_APPLY', 'BACKUP_DISASTER_DELETE_AND_RETENTION_HOLD_NOT_WEAKENED',
                       'IMPORT_428_AND_UNKNOWN_POST_NO_REPLAY_NO_DISCARD_NO_ESCAPE_NO_TAB_SWITCH_REAL_CHROMIUM',
                       'ACTUAL_DISASTER_CREATE_VERIFY_RESTORE_AND_INTERRUPTED_RESTORE_RECOVERY_MACHINE',
                       'ALL_REQUIRED_DOMAINS_LOADED_MAPPED_EXACT_EVIDENCE_PASS',
                       'SUPPORTED_ONLINE_ATOMIC_SOURCE = [2.47.505]',
                       'FORMAL_RELEASE_INPUT=BLOCKED',
                       'Do not re-attempt an equivalent operation'):
              assert text in new, text
          assert 'OWNER_GOVERNANCE_ADOPTION_APPROVED' in case
          assert 'RULE_EFFECTIVE=NO' in case
          assert p.count('| RP-07I |')==1
          for key in ('| RP-07F |','| RP-07H |','| RP-08 |','| RP-09 |'):
              assert key in p
          for hard in ('Production','NOT_PROVEN','安全拒绝','删除继续停用'):
              assert hard in p
          assert '| gov-doc Current 生效 V3.5' in p
          assert 'OWNER_PREVIEW_RUNTIME=POST_RELEASE_REQUIRED' in p
          assert 'OWNER_REAL_USE=POST_PRODUCTION_REQUIRED' in p
          print('P01_MODEI_GOVERNANCE_9_MODES_PRESERVED=PASS')
          print('P01_MODEI_ONLY_506_CASE_AND_V505_BASELINE=PASS')
          print('P01_MODEI_ALL_HARD_MACHINE_GATES_RETAINED=PASS')
          print('P01_MODEI_OWNER_ADOPTION_AND_NOT_EFFECTIVE_UNTIL_MERGE=PASS')
          print('P01_MODEI_NO_PUBLICATION_PRODUCTION_OR_DELETE_AUTHORIZATION=PASS')
          PY

      - name: Remove transient private checkouts
        if: always()
        shell: bash
        run: |
          rm -rf gov product
          echo P01_MODEI_PRIVATE_SOURCE_PUBLIC_PERSISTENCE=NONE
