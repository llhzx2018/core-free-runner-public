name: P02 V2.5.39 PR105 Exact Regression

on:
  push:
    branches:
      - run/p02-v2539-pr105-20260919
    paths:
      - '.github/workflows/p02-v2539-pr105-exact-regression.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TARGET_REPO: llhzx2018/vf-library
      TARGET_SHA: 51961e1f2feb7bbb4df007869e96301bc94e9961
      TARGET_VERSION: 2.5.39
    steps:
      - name: Checkout exact private candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 51961e1f2feb7bbb4df007869e96301bc94e9961
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product

      - name: Install runtime and Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-zip sqlite3 unzip curl
          cd product
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify exact source and focused unit regression
        shell: bash
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "$TARGET_VERSION"
          bash scripts/verify-repository.sh
          node tests/unit/p02_inkstone_shell_parity.mjs
          node tests/unit/p02_ux_browser_harness_contract.mjs
          echo P02_V2539_PR105_SOURCE_UNIT=PASS

      - name: Real Chromium regression
        shell: bash
        working-directory: product
        run: |
          set -Eeuo pipefail
          bash scripts/ux-browser-reverify.sh
          echo P02_V2539_PR105_BROWSER=PASS
