name: P01 V2.32 Remote Fixture Fix
on:
  push:
    branches: [task/p01-v2320-formal-release-20260830]
    paths: [.github/workflows/p01-v2320-remote-fixture-fix-20260830.yml]
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact runner branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: task/p01-v2320-formal-release-20260830
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
      - name: Correct fixture-only count expectations
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/p01-v2320-remote-final.sh')
          s=p.read_text(encoding='utf-8')
          old1="if($b['links']!==17||$b['categories']!==2||$b['favorites']!==2||$b['profiles']!==9||$b['schema']!=='2026082901')throw new RuntimeException('seed '.json_encode($b));"
          new1="if($b['links']!==19||$b['categories']!==2||$b['favorites']!==2||$b['profiles']!==9||$b['schema']!=='2026082901')throw new RuntimeException('seed '.json_encode($b));"
          old2="foreach(['start'=>10,'channels'=>3,'watch'=>2,'topics'=>2,'total'=>17] as $k=>$v)if((int)($c[$k]??-1)!==$v)throw new RuntimeException('surface '.$k.' '.json_encode($c));"
          new2="foreach(['start'=>10,'channels'=>3,'watch'=>3,'topics'=>3,'total'=>19] as $k=>$v)if((int)($c[$k]??-1)!==$v)throw new RuntimeException('surface '.$k.' '.json_encode($c));"
          if s.count(old1)!=1 or s.count(old2)!=1:
              raise SystemExit('fixture anchors do not match exactly')
          s=s.replace(old1,new1,1).replace(old2,new2,1)
          p.write_text(s,encoding='utf-8',newline='\n')
          PY
          git diff --check
          test "$(git diff --name-only)" = scripts/p01-v2320-remote-final.sh
          git diff -- scripts/p01-v2320-remote-final.sh | tee /tmp/fixture-fix.diff
          grep -F "links']!==19" scripts/p01-v2320-remote-final.sh >/dev/null
          grep -F "'watch'=>3,'topics'=>3,'total'=>19" scripts/p01-v2320-remote-final.sh >/dev/null
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add scripts/p01-v2320-remote-final.sh
          git commit -m 'test(P01): correct V2.32 remote fixture counts'
          git push origin HEAD:task/p01-v2320-formal-release-20260830
          echo P01_V2320_REMOTE_FIXTURE_FIX=PASS
          echo PRODUCT_CHANGE=NO
          echo RELEASE_CHANGE=NO
          echo CORE_UPDATES_CHANGE=NO
          echo OWNER_PRODUCTION_WRITE=NO
