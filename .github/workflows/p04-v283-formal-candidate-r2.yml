name: P04 V2.8.3 Formal Candidate R2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p04-v283-formal-candidate-r2.yml'
      - 'requests/p04-v283-formal-candidate-r2.txt'

permissions:
  contents: read

env:
  SOURCE_REPOSITORY: llhzx2018/vf-infra
  SOURCE_COMMIT: '6180307a393783b3ee61dd2f5a65c6516a0d406d'

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_COMMIT }}
          token: ${{ env.READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: candidate
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, fileinfo, sodium, zip, curl, mbstring
      - name: Rebuild and close failed harness gap
        shell: bash
        run: |
          set -Eeuo pipefail
          R="$RUNNER_TEMP/runtime"; O="$RUNNER_TEMP/update"
          python3 candidate/scripts/build-release-tree.py "$R" --source-root candidate
          python3 - "$R" "$RUNNER_TEMP/VF_Infra_V2.8.3_FULL.zip" <<'PY'
          import pathlib,sys,zipfile
          root=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9,strict_timestamps=True) as z:
            for p in sorted(x for x in root.rglob('*') if x.is_file()):
              i=zipfile.ZipInfo(p.relative_to(root).as_posix(),date_time=(1980,1,1,0,0,0)); i.compress_type=zipfile.ZIP_DEFLATED; i.create_system=3; i.external_attr=(0o100644<<16); z.writestr(i,p.read_bytes())
          PY
          python3 candidate/scripts/build-v283-update-release.py --target-runtime "$R" --output "$O"
          cp "$O/VF_Infra_V2.8.3_UPDATE.zip" "$RUNNER_TEMP/VF_Infra_V2.8.3_UPDATE.zip"
          php "$O/repair-v2.8.3.php" --self-test | grep -F 'ATOMIC_SELF_TEST_PASS target=2.8.3 schema=14'
          php candidate/tests/integration/v283_release_manifest_integrity_contract.php candidate | grep -F 'P04_V283_RELEASE_MANIFEST_INTEGRITY_CONTRACT_PASS'
          mkdir -p "$RUNNER_TEMP/private"; chmod 700 "$RUNNER_TEMP/private"
          cat > "$R/config.php" <<PHP
          <?php
          return ['app_name'=>'VF Infra Candidate','base_url'=>'http://localhost','allowed_hosts'=>['localhost'],'host_mode'=>'serve_all','trusted_proxy_ips'=>[],'rdap_allow_http'=>false,'data_path'=>'$RUNNER_TEMP/private','timezone'=>'Asia/Shanghai','app_key'=>'0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef','session_name'=>'vf283'];
          PHP
          chmod 600 "$R/config.php"
          php candidate/tests/integration/common_branding_contract_v279.php "$R" 2.8.3 | tee "$RUNNER_TEMP/branding.log"
          grep -Fxq 'PASS logo_1024_square_accepted' "$RUNNER_TEMP/branding.log"
          grep -Fxq 'PASS favicon_1024_square_accepted' "$RUNNER_TEMP/branding.log"
          grep -Fxq 'P04_COMMON_BRANDING_CONTRACT_PASS version=2.8.3' "$RUNNER_TEMP/branding.log"
          python3 - <<'PY'
          import hashlib,os,pathlib
          t=pathlib.Path(os.environ['RUNNER_TEMP']); f=t/'VF_Infra_V2.8.3_FULL.zip'; u=t/'VF_Infra_V2.8.3_UPDATE.zip'; sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          print('P04_V283_FORMAL_CANDIDATE_R2=PASS')
          print('SOURCE_SHA='+os.environ['SOURCE_COMMIT'])
          print('FULL_BYTES='+str(f.stat().st_size)); print('FULL_SHA256='+sha(f))
          print('UPDATE_BYTES='+str(u.stat().st_size)); print('UPDATE_SHA256='+sha(u))
          print('PRODUCTION_WRITE=0'); print('RELEASE_WRITE=0')
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P04-V2.8.3-FORMAL-CANDIDATE-R2
          path: |
            ${{ runner.temp }}/VF_Infra_V2.8.3_FULL.zip
            ${{ runner.temp }}/VF_Infra_V2.8.3_UPDATE.zip
            ${{ runner.temp }}/branding.log
          if-no-files-found: warn
          retention-days: 14
