name: S01 Error Recovery UX Post-Push Readback
on:
  push:
    branches: [temp/s01-error-recovery-ux-code-gate-20260907]
    paths: [.github/workflows/temp-s01-error-recovery-ux-postpush-readback-20260907.yml]
permissions:
  contents: read
jobs:
  ops:
    runs-on: ubuntu-24.04
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      REPO: llhzx2018/vf-tools-ops
      BRANCH: work/s01-c02-error-recovery-ux-20260907
      EXPECTED_HEAD: b535fa499aa808ff9806d532251f4604691d1aa2
      EXPECTED_MAIN: 3e873a80ff6d3defdc31a3d7b4f9574e8b84cfcb
    steps:
      - name: Read back Ops 1.21.858 candidate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$READ_TOKEN"
          echo 'MAIN_WRITE_USED=NO RELEASE_USED=NO DISTRIBUTION_USED=NO PRODUCTION_WRITE_USED=NO MIGRATION_USED=NO'
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/${REPO}.git" repo
          cd repo
          git checkout -q "$BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(cat VERSION)" = '1.21.858'
          grep -Fq 'Version: 1.21.858' vf-ops.php
          grep -Fq "VF_OPS_VERSION', '1.21.858'" vf-ops.php
          grep -Fq "VF_OPS_ROUND', 'S01-ERROR-RECOVERY-UX-CLOSURE'" vf-ops.php
          find includes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php tests/error-recovery-human-language-contract.php
          php tests/admin-human-language-contract.php
          php tests/dashboard-selector-hit-contract.php
          php tests/pages-tools-human-closure-contract.php
          php tests/system-components-human-language-contract.php
          php tests/update-compat-human-language-contract.php
          php tests/update-refresh-policy-current-contract.php
          php tests/visible-console-v2-contract.php
          python3 - <<'PY'
          import subprocess
          expected={
            'VERSION','vf-ops.php','includes/admin-runtime-support.php',
            'includes/admin-v13/views/dashboard.php',
            'tests/admin-human-language-contract.php','tests/error-recovery-human-language-contract.php',
            'tests/system-components-human-language-contract.php','tests/update-refresh-policy-current-contract.php',
            'tests/visible-console-v2-contract.php',
          }
          actual=set(subprocess.check_output(['git','diff','--name-only','origin/main...HEAD']).decode().splitlines())
          if actual != expected:
              print('EXPECTED',sorted(expected)); print('ACTUAL',sorted(actual)); raise SystemExit('FAIL_OPS_POSTPUSH_FILE_FENCE')
          PY
          git diff --exit-code origin/main...HEAD -- includes/v6
          echo "OPS_READBACK_HEAD=$(git rev-parse HEAD)"
          echo 'PASS_S01_C02_121858_POSTPUSH_READBACK'

  m3u8:
    runs-on: ubuntu-24.04
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      REPO: llhzx2018/vf-tools-m3u8
      BRANCH: work/s01-c03-error-recovery-ux-20260907
      EXPECTED_HEAD: 30759b5ae9a70cf7049df2d0b2bb35e40c809829
      EXPECTED_MAIN: 3a50a8557fbdb634f56ab6fd14a3d9072bd927c5
    steps:
      - name: Read back M3U8 1.25.29 candidate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$READ_TOKEN"
          echo 'MAIN_WRITE_USED=NO RELEASE_USED=NO DISTRIBUTION_USED=NO PRODUCTION_WRITE_USED=NO MIGRATION_USED=NO'
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/${REPO}.git" repo
          cd repo
          git checkout -q "$BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(cat VERSION)" = '1.25.29'
          grep -Fq 'Version: 1.25.29' src/vf-tool-m3u8.php
          grep -Fq "VF_TOOL_M3U8_VERSION', '1.25.29'" src/vf-tool-m3u8.php
          grep -Fq "VF_TOOL_M3U8_ROUND', 'R253'" src/vf-tool-m3u8.php
          grep -Fq 'R253_S01_ERROR_RECOVERY_UX_CLOSURE' src/vf-tool-m3u8.php
          find src tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php tests/unit/error-recovery-final-owner-contract.php
          php tests/unit/admin-human-language-contract.php
          php tests/unit/dashboard-human-language-contract.php
          php tests/unit/host-recovery-human-language-contract.php
          php tests/unit/recovery-runtime-human-language-followup-contract.php
          php tests/unit/settings-human-language-followup-contract.php
          php tests/unit/package-physical-locator-contract.php
          php tests/unit/update-refresh-policy-contract.php
          php tests/unit/visible-console-v2-contract.php
          php tests/unit/bootstrap-upgrade-contract.php
          php tests/frontend-s01-uiux-final-owner-contract.php
          python3 - <<'PY'
          import subprocess
          expected={
            'VERSION','src/vf-tool-m3u8.php','src/admin/admin-loader.php','src/admin/admin-console.php',
            'tests/unit/dashboard-human-language-contract.php','tests/unit/error-recovery-final-owner-contract.php',
            'tests/unit/host-recovery-human-language-contract.php','tests/unit/package-physical-locator-contract.php',
            'tests/unit/recovery-runtime-human-language-followup-contract.php','tests/unit/settings-human-language-followup-contract.php',
            'tests/unit/update-refresh-policy-contract.php','tests/unit/visible-console-v2-contract.php',
          }
          actual=set(subprocess.check_output(['git','diff','--name-only','origin/main...HEAD']).decode().splitlines())
          if actual != expected:
              print('EXPECTED',sorted(expected)); print('ACTUAL',sorted(actual)); raise SystemExit('FAIL_M3U8_POSTPUSH_FILE_FENCE')
          PY
          git diff --exit-code origin/main...HEAD -- src/includes/v6-provider-schema.php src/includes/v6-provider-post-migration-readonly.php src/includes/v6-provider-controlled-migration-admin.php src/includes/update
          echo "M3U8_READBACK_HEAD=$(git rev-parse HEAD)"
          echo 'PASS_S01_C03_12529_POSTPUSH_READBACK'
