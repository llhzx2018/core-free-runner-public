name: P01 V2.47.452 independent channel readback (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v247452-channel-once.yml'

permissions:
  contents: read

jobs:
  channel-proof:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/p01-v247452-channel-readback-20261025'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout public runner controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout exact core-updates manifest candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: 42efabb7c4527ec6894cae49dedcef0d1c320ba9
          path: channel
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false

      - name: Exact immutable manifest and upgrade-safety assertions
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C channel rev-parse HEAD)" = 42efabb7c4527ec6894cae49dedcef0d1c320ba9
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('channel/projects/P01.json').read_text())
          expected={
            'project_id':'P01','component_id':'APP','enabled':True,
            'current_version':'2.47.451','target_version':'2.47.452',
            'update_type':'ATOMIC','from_versions':['2.47.451'],
            'schema_from':'2026102201','schema_to':'2026102201',
            'repository':'llhzx2018/vf-start','release_tag':'v2.47.452',
            'release_id':423166444,
            'product_identity':'15eb3916790a2a211a60613b2f1a252c441002e9',
            'asset_name':'VF_Start_V2.47.452_UPDATE.zip',
            'asset_bytes':2986927,
            'asset_sha256':'1737ed389c1d525cb1cb0278613187ba78706c35d71caa0235eb778363be3c06',
            'backup_required':True,'rollback_supported':True,
            'minimum_php':'8.0.0'
          }
          for k,v in expected.items():
              assert m[k]==v,(k,m[k],v)
          print('P01_CHANNEL_EXACT_MANIFEST_AND_SAFETY=PASS')
          PY

      - name: Independent remote Tag Release and Asset SHA download readback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          gh api repos/llhzx2018/vf-start/releases/tags/v2.47.452 >/tmp/p01-release452.json
          gh api repos/llhzx2018/vf-start/git/ref/tags/v2.47.452 >/tmp/p01-tag452.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/p01-release452.json'))
          tag=json.load(open('/tmp/p01-tag452.json'))
          assert r['tag_name']=='v2.47.452' and r['draft'] is False and r['prerelease'] is False
          assert r['id']==423166444
          assert tag['object']['sha']=='15eb3916790a2a211a60613b2f1a252c441002e9'
          a={x['name']:x for x in r['assets']}
          assert a['VF_Start_V2.47.452_UPDATE.zip']['size']==2986927
          assert a['VF_Start_V2.47.452_UPDATE.zip']['digest']=='sha256:1737ed389c1d525cb1cb0278613187ba78706c35d71caa0235eb778363be3c06'
          assert a['VF-Start-V2.47.452-FULL.zip']['size']==1370137
          assert a['VF-Start-V2.47.452-FULL.zip']['digest']=='sha256:f1023aec973fc95ea910600d0eef785966bcc2400d033312cff88cdbb6d2b58c'
          print('P01_CHANNEL_REMOTE_RELEASE_IDENTITY=PASS')
          PY
          mkdir -p /tmp/p01-channel-readback
          gh release download v2.47.452 -R llhzx2018/vf-start -D /tmp/p01-channel-readback -p VF_Start_V2.47.452_UPDATE.zip
          test "$(stat -c %s /tmp/p01-channel-readback/VF_Start_V2.47.452_UPDATE.zip)" = 2986927
          test "$(sha256sum /tmp/p01-channel-readback/VF_Start_V2.47.452_UPDATE.zip | awk '{print $1}')" = 1737ed389c1d525cb1cb0278613187ba78706c35d71caa0235eb778363be3c06
          unzip -t /tmp/p01-channel-readback/VF_Start_V2.47.452_UPDATE.zip >/dev/null
          echo P01_CHANNEL_REMOTE_UPDATE_BYTES_SHA=PASS
