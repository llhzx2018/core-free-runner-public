name: P07 OneShot v0.4 Patch

on:
  push:
    branches:
      - experiment/p07-oneshot-bench-v04
    paths:
      - .github/workflows/p07-oneshot-v04-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/p07-oneshot-bench-v04

      - name: Apply v0.4 patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('experiments/p07-bench.sh')
          s=p.read_text()
          s=s.replace('VERSION="0.3.0"','VERSION="0.4.0"',1)

          start=s.index('parse_speed_text(){')
          end=s.index('\nprint_network(){', start)
          new=r'''parse_speed_text(){
  local text="$1" up down lat
  up="$(awk '/Upload:/{print $2;exit}' <<<"$text")"
  down="$(awk '/Download:/{print $2;exit}' <<<"$text")"
  lat="$(awk '/Latency:/{print $2;exit}' <<<"$text")"
  [[ -n "$up" && -n "$down" && -n "$lat" ]] && printf '%s|%s|%s' "$up" "$down" "$lat"
}
parse_speed_json_file(){
  local file="$1"
  command -v python3 >/dev/null 2>&1 || return 1
  python3 - "$file" <<'PYJSON' 2>/dev/null
import json,sys
from pathlib import Path
text=Path(sys.argv[1]).read_text(errors='replace').lstrip('\ufeff').strip()
if not text:
    raise SystemExit(1)
objs=[]
for candidate in [text] + [x.strip() for x in reversed(text.splitlines()) if x.strip().startswith('{')]:
    try:
        objs.append(json.loads(candidate))
        break
    except Exception:
        pass
if not objs:
    dec=json.JSONDecoder()
    for i,ch in enumerate(text):
        if ch!='{':
            continue
        try:
            obj,_=dec.raw_decode(text[i:])
            objs.append(obj); break
        except Exception:
            pass
if not objs:
    raise SystemExit(1)
d=objs[0]
try:
    up=float(d['upload']['bandwidth'])*8/1e6
    down=float(d['download']['bandwidth'])*8/1e6
    lat=float(d['ping']['latency'])
except Exception:
    raise SystemExit(1)
print(f"{up:.2f}|{down:.2f}|{lat:.2f}")
PYJSON
}
measure_speed_node(){
  local id="$1" name="$2" key out_file err_file rc=1 parsed="" raw=""
  MEASURE_STATE="FAIL"; MEASURE_REASON="UNKNOWN"; MEASURE_UP='-'; MEASURE_DOWN='-'; MEASURE_LAT='-'; MEASURE_ID="$id"
  if (( DEMO )); then
    case "$id:$name" in
      ':Speedtest.net') MEASURE_STATE=PASS; MEASURE_REASON=NONE; MEASURE_UP=1180.2; MEASURE_DOWN=1260.4; MEASURE_LAT=1.1 ;;
      '24447:'*) MEASURE_STATE=FAIL; MEASURE_REASON=NODE_UNAVAILABLE ;;
      '43752:'*) MEASURE_STATE=PASS; MEASURE_REASON=NONE; MEASURE_UP=820.4; MEASURE_DOWN=910.2; MEASURE_LAT=188.1 ;;
      '36663:'*) MEASURE_STATE=FAIL; MEASURE_REASON=NODE_UNAVAILABLE ;;
      '5396:'*) MEASURE_STATE=FAIL; MEASURE_REASON=NODE_UNAVAILABLE ;;
      '59387:'*) MEASURE_STATE=PASS; MEASURE_REASON=NONE; MEASURE_UP=760.2; MEASURE_DOWN=845.8; MEASURE_LAT=202.4 ;;
      '16204:'*|'30852:'*) MEASURE_STATE=PASS; MEASURE_REASON=NONE; MEASURE_UP=700.1; MEASURE_DOWN=780.5; MEASURE_LAT=210.0 ;;
      *)
        case "$name" in
          'Los Angeles, US') MEASURE_STATE=PASS; MEASURE_REASON=NONE; MEASURE_UP=1120.1; MEASURE_DOWN=1202.3; MEASURE_LAT=1.3 ;;
          'Dallas, US') MEASURE_STATE=PASS; MEASURE_REASON=NONE; MEASURE_UP=930.4; MEASURE_DOWN=1010.6; MEASURE_LAT=32.1 ;;
          'Montreal, CA') MEASURE_STATE=PASS; MEASURE_REASON=NONE; MEASURE_UP=760.3; MEASURE_DOWN=830.2; MEASURE_LAT=72.4 ;;
          'Paris, FR') MEASURE_STATE=PASS; MEASURE_REASON=NONE; MEASURE_UP=720.1; MEASURE_DOWN=840.7; MEASURE_LAT=142.3 ;;
          'Amsterdam, NL') MEASURE_STATE=PASS; MEASURE_REASON=NONE; MEASURE_UP=760.2; MEASURE_DOWN=810.4; MEASURE_LAT=150.4 ;;
          'Hong Kong, CN') MEASURE_STATE=PASS; MEASURE_REASON=NONE; MEASURE_UP=690.1; MEASURE_DOWN=720.4; MEASURE_LAT=151.1 ;;
          'Singapore, SG') MEASURE_STATE=PASS; MEASURE_REASON=NONE; MEASURE_UP=720.8; MEASURE_DOWN=760.2; MEASURE_LAT=168.4 ;;
          'Taipei, CN') MEASURE_STATE=PASS; MEASURE_REASON=NONE; MEASURE_UP=700.5; MEASURE_DOWN=735.4; MEASURE_LAT=142.0 ;;
          'Tokyo, JP') MEASURE_STATE=PASS; MEASURE_REASON=NONE; MEASURE_UP=810.7; MEASURE_DOWN=850.2; MEASURE_LAT=112.2 ;;
          *) MEASURE_STATE=FAIL; MEASURE_REASON=UNKNOWN ;;
        esac
        ;;
    esac
    return 0
  fi
  if [[ -z "$SPEEDTEST_BIN" ]]; then MEASURE_STATE=UNAVAILABLE; MEASURE_REASON=SPEEDTEST_UNAVAILABLE; return 0; fi
  if ! command -v timeout >/dev/null 2>&1; then MEASURE_STATE=UNAVAILABLE; MEASURE_REASON=TIMEOUT_COMMAND_MISSING; return 0; fi

  local args=(--progress=no --accept-license --accept-gdpr)
  [[ -n "$id" ]] && args+=(--server-id="$id")
  key="${id:-auto}"
  out_file="$TMP_DIR/speed-${key}.out"; err_file="$TMP_DIR/speed-${key}.err"
  : >"$out_file"; : >"$err_file"
  if command -v python3 >/dev/null 2>&1; then
    timeout 65s "$SPEEDTEST_BIN" "${args[@]}" --format=json >"$out_file" 2>"$err_file"; rc=$?
    if (( rc == 0 )); then
      parsed="$(parse_speed_json_file "$out_file" || true)"
      [[ -n "$parsed" ]] || parsed="$(parse_speed_json_file "$err_file" || true)"
    fi
  else
    timeout 65s "$SPEEDTEST_BIN" "${args[@]}" >"$out_file" 2>"$err_file"; rc=$?
  fi
  raw="$(cat "$out_file" 2>/dev/null; cat "$err_file" 2>/dev/null)"
  [[ -n "$parsed" ]] || { (( rc == 0 )) && parsed="$(parse_speed_text "$raw" || true)"; }
  if [[ -n "$parsed" ]]; then
    IFS='|' read -r MEASURE_UP MEASURE_DOWN MEASURE_LAT <<<"$parsed"
    MEASURE_STATE=PASS; MEASURE_REASON=NONE
  else
    MEASURE_STATE=FAIL; MEASURE_REASON="$(network_reason "${rc:-1}" "$raw")"
  fi
}
render_speed_result(){
  local id="$1" name="$2"
  printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$id" "$name" "$MEASURE_STATE" "$MEASURE_REASON" "$MEASURE_UP" "$MEASURE_DOWN" "$MEASURE_LAT" >>"$NETWORK_TSV"
  tty_clean_line
  if [[ "$MEASURE_STATE" == PASS ]]; then
    printf ' %s%-17s%s %s%-13s%s %s%-15s%s %s%-9s%s %s%-7s%s %-18s\n' \
      "$YELLOW" "$name" "$RESET" "$GREEN" "$MEASURE_UP Mbps" "$RESET" "$RED" "$MEASURE_DOWN Mbps" "$RESET" "$BLUE" "$MEASURE_LAT ms" "$RESET" "$GREEN" "PASS" "$RESET" '-'
  else
    printf ' %s%-17s%s %-13s %-15s %-9s %s%-7s%s %s%-18s%s\n' \
      "$YELLOW" "$name" "$RESET" '-' '-' '-' "$RED" "$MEASURE_STATE" "$RESET" "$YELLOW" "$MEASURE_REASON" "$RESET"
  fi
}
speed_node(){
  local id="$1" name="$2"
  measure_speed_node "$id" "$name"
  render_speed_result "$id" "$name"
  [[ "$MEASURE_STATE" == PASS ]]
}
speed_node_pool(){
  local display="$1"; shift
  local spec id label best_reason=NODE_UNAVAILABLE best_id=''
  for spec in "$@"; do
    IFS='|' read -r id label <<<"$spec"
    measure_speed_node "$id" "$label"
    if [[ "$MEASURE_STATE" == PASS ]]; then
      render_speed_result "$id" "$display"
      return 0
    fi
    if [[ "$MEASURE_REASON" != NODE_UNAVAILABLE ]]; then best_reason="$MEASURE_REASON"; best_id="$id"; fi
  done
  MEASURE_STATE=FAIL; MEASURE_REASON="$best_reason"; MEASURE_UP='-'; MEASURE_DOWN='-'; MEASURE_LAT='-'
  render_speed_result "${best_id:-0}" "$display"
  return 1
}
'''
          s=s[:start]+new+s[end:]

          start=s.index('print_network(){')
          end=s.index('\n\nhttp_probe(){', start)
          new=r'''print_network(){
  rule
  printf '%s Node Name         Upload        Download        Latency   State   Reason%s\n' "$BOLD$YELLOW" "$RESET"
  : >"$NETWORK_TSV"
  if ! prepare_speedtest; then SPEEDTEST_BIN=""; fi

  speed_node ''      'Speedtest.net' || true
  speed_node 7190    'Los Angeles, US' || true
  speed_node 22288   'Dallas, US' || true
  speed_node 64420   'Montreal, CA' || true
  speed_node 61933   'Paris, FR' || true
  speed_node 41423   'Amsterdam, NL' || true

  local cn_primary_pass=0
  speed_node_pool 'China Unicom, CN' \
    '24447|China Unicom 5G' \
    '43752|BJ Unicom' && cn_primary_pass=$((cn_primary_pass+1)) || true
  speed_node_pool 'China Telecom, CN' \
    '36663|China Telecom JiangSu 5G' \
    '5396|China Telecom JiangSu 5G' \
    '59387|Zhejiang Telecom' && cn_primary_pass=$((cn_primary_pass+1)) || true
  if (( cn_primary_pass == 0 )); then
    speed_node_pool 'China Backup, CN' \
      '16204|JSQY' \
      '30852|Duke Kunshan University' || true
  fi

  speed_node 32155   'Hong Kong, CN' || true
  speed_node 13623   'Singapore, SG' || true
  speed_node 65092   'Taipei, CN' || true
  speed_node 48463   'Tokyo, JP' || true
}'''
          s=s[:start]+new+s[end:]

          start=s.index('china_assessment(){')
          end=s.index('\n\n\nwrite_reports(){', start)
          new=r'''china_assessment(){
  local overseas_http=0 mainland_http=0 mainland_fail=0 u cn_speed_pass cn_speed_fail cn_speed_total cn_path_fail cn_node_unavailable overseas_speed_pass
  local cn_pattern='China Unicom, CN|China Telecom, CN|China Backup, CN'
  for u in https://www.cloudflare.com/ https://github.com/ https://www.google.com/; do http_probe "$u" && overseas_http=$((overseas_http+1)); done
  for u in https://www.baidu.com/ https://www.qq.com/ https://www.taobao.com/ https://www.189.cn/ https://www.10010.com/ https://www.10086.cn/; do
    if http_probe "$u"; then mainland_http=$((mainland_http+1)); else mainland_fail=$((mainland_fail+1)); fi
  done
  cn_speed_pass="$(count_speed "$cn_pattern" PASS)"
  cn_speed_fail="$(count_speed "$cn_pattern" FAIL)"
  cn_speed_total=$((cn_speed_pass+cn_speed_fail))
  cn_path_fail="$(count_speed_reason "$cn_pattern" '^(TIMEOUT|CONNECTION_FAILED|DNS_FAILURE|TLS_FAILURE)$')"
  cn_node_unavailable="$(count_speed_reason "$cn_pattern" '^NODE_UNAVAILABLE$')"
  overseas_speed_pass="$(awk -F '\t' '$2 !~ /China Unicom, CN|China Telecom, CN|China Backup, CN/ && $3=="PASS"{n++} END{print n+0}' "$NETWORK_TSV")"
  CHINA_VERDICT="$(china_verdict_from_counts "$cn_speed_pass" "$cn_path_fail" "$cn_node_unavailable" "$overseas_speed_pass" "$mainland_http" "$mainland_fail" "$overseas_http")"
  case "$CHINA_VERDICT" in
    NORMAL) CHINA_RECOMMENDATION="OUTBOUND OK; VERIFY MAINLAND -> VPS BEFORE CUTOVER" ;;
    HIGH_RISK) CHINA_RECOMMENDATION="CHANGE IP BEFORE MIGRATION" ;;
    RISK) CHINA_RECOMMENDATION="VERIFY FROM MAINLAND BEFORE MIGRATION" ;;
    *) CHINA_RECOMMENDATION="MAINLAND SIGNAL INCONCLUSIVE" ;;
  esac
  rule
  printf '%s%s China Access Assessment%s\n' "$BOLD" "$BLUE" "$RESET"
  printf ' Outbound HTTPS      : Overseas %s/3 | Mainland %s/6\n' "$overseas_http" "$mainland_http"
  printf ' Mainland Speed      : %s/%s PASS | PathFail %s | NodeOff %s\n' "$cn_speed_pass" "$cn_speed_total" "$cn_path_fail" "$cn_node_unavailable"
  printf ' Mainland -> VPS     : %sNOT_RUN%s\n' "$YELLOW" "$RESET"
  printf ' Outbound Verdict    : '; color_state "$CHINA_VERDICT"; printf '\n'
  printf ' Advice              : %s%s%s\n' "$YELLOW" "$CHINA_RECOMMENDATION" "$RESET"
  printf ' %sNote: outbound-only; NODE_UNAVAILABLE is not IP-block evidence.%s\n' "$GRAY" "$RESET"
}'''
          s=s[:start]+new+s[end:]

          start=s.index('self_test(){')
          end=s.index('\n\nif (( SELF_TEST ));', start)
          new=r'''self_test(){
  local f=0 jf
  [[ "$(rate_to_mb '1.20 GB/s')" == "1200.00" ]] || f=1
  [[ "$(rate_to_mb '577 MB/s')" == "577.00" ]] || f=1
  [[ "$(format_mb_rate '1500.00')" == "1.50 GB/s" ]] || f=1
  [[ "$(china_verdict_from_counts 0 0 2 9 6 0 3)" == "INCONCLUSIVE" ]] || f=1
  [[ "$(china_verdict_from_counts 0 2 0 9 2 4 3)" == "HIGH_RISK" ]] || f=1
  jf="$TMP_DIR/self-json.txt"
  cat >"$jf" <<'EOFJ'
warning on stderr-like prefix
{"ping":{"latency":1.23},"download":{"bandwidth":4000000},"upload":{"bandwidth":2000000}}
EOFJ
  [[ "$(parse_speed_json_file "$jf")" == "16.00|32.00|1.23" ]] || f=1
  [[ ${#OOKLA_X86_64_SHA256} -eq 64 ]] || f=1
  [[ ${#OOKLA_I386_SHA256} -eq 64 ]] || f=1
  [[ ${#OOKLA_AARCH64_SHA256} -eq 64 ]] || f=1
  [[ ${#OOKLA_ARMHF_SHA256} -eq 64 ]] || f=1
  [[ ${#OOKLA_ARMEL_SHA256} -eq 64 ]] || f=1
  local old_demo="$DEMO"; DEMO=1
  : >"$NETWORK_TSV"
  speed_node '' 'Speedtest.net' >/dev/null || f=1
  speed_node_pool 'China Unicom, CN' '24447|China Unicom 5G' '43752|BJ Unicom' >/dev/null || f=1
  [[ "$(awk -F '\t' '$2=="China Unicom, CN"{print $1":"$3}' "$NETWORK_TSV")" == "43752:PASS" ]] || f=1
  DEMO="$old_demo"
  if (( f )); then printf 'SELF_TEST=FAIL\n'; return 1; else printf 'SELF_TEST=PASS\n'; fi
}'''
