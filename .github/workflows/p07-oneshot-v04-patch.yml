name: P07 OneShot v0.4 Patch

on:
  push:
    branches:
      - experiment/p07-oneshot-bench-v04
    paths:
      - .github/workflows/p07-oneshot-v04-patch.yml
      - experiments/p07-v04-patch.py
      - experiments/p07-v04-demo-fix.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/p07-oneshot-bench-v04

      - name: Apply patch
        run: |
          python3 experiments/p07-v04-patch.py
          python3 experiments/p07-v04-demo-fix.py

      - name: Validate v0.4
        env:
          NO_COLOR: "1"
          XDG_STATE_HOME: /tmp/p07-v04-state
        run: |
          set -euo pipefail
          bash -n experiments/p07-bench.sh
          chmod +x experiments/p07-bench.sh
          ./experiments/p07-bench.sh --version | grep -F 'P07 Enhanced Bench 0.4.0'
          ./experiments/p07-bench.sh --self-test | grep -F 'SELF_TEST=PASS'
          ./experiments/p07-bench.sh --demo | tee /tmp/p07-v04-demo.txt
          grep -F 'Speedtest.net' /tmp/p07-v04-demo.txt | grep -F 'PASS'
          grep -F 'China Unicom, CN' /tmp/p07-v04-demo.txt | grep -F 'PASS'
          grep -F 'China Telecom, CN' /tmp/p07-v04-demo.txt | grep -F 'PASS'
          grep -F 'Outbound Verdict' /tmp/p07-v04-demo.txt | grep -F 'NORMAL'
          grep -F 'Mainland -> VPS' /tmp/p07-v04-demo.txt | grep -F 'NOT_RUN'
          ! grep -F 'PARSE_ERROR' /tmp/p07-v04-demo.txt

      - name: Commit v0.4 candidate
        run: |
          set -euo pipefail
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add experiments/p07-bench.sh
          git diff --cached --quiet && exit 0
          git commit -m 'fix(p07-bench): robust parser and mainland fallback v0.4'
          git push origin HEAD:experiment/p07-oneshot-bench-v04
