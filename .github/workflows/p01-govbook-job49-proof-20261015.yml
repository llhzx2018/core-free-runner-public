name: P01 one-off GOV-BOOK queued job self-drive
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-govbook-job49-proof-20261015.yml']
permissions:
  contents: read
jobs:
  exact-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout pinned private candidate
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          umask 077
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" p01
          git -C p01 checkout -q 9a95892a7ad213343b5fcd2482bc04205c7bc250
          test "$(git -C p01 rev-parse HEAD)" = 9a95892a7ad213343b5fcd2482bc04205c7bc250
          test "$(tr -d '\r\n ' < p01/VERSION)" = 2.47.377
          echo P01_EXACT_SOURCE=PASS
      - name: PHP syntax and course bridge unit simulation
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p01
          php -l src/app/CourseLibraryPage.php
          php -l src/app/SubjectPageChrome.php
          node --check src/assets/course-govbook-progress.js
          node --check tests/unit/gov_book_course_progress_runtime.js
          node tests/unit/gov_book_course_progress_runtime.js
          php tests/integration/gov_book_internal_reader_revision_native.php
          echo P01_GOVBOOK_JOB49_NATIVE=PASS
      - name: Public-safe exact-source result
        run: |
          echo P01_GOVBOOK_CANDIDATE_SHA=9a95892a7ad213343b5fcd2482bc04205c7bc250
          echo P01_GOVBOOK_JOB49_PROOF=PASS
      - name: Destroy ephemeral private checkout
        if: always()
        run: rm -rf p01
