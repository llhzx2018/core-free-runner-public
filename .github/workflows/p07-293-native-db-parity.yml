name: P07 PR293 One-shot Native Read-only Laravel Parity Exact Source
on:
  pull_request:
    paths: ['.github/workflows/p07-293-native-db-parity.yml']
permissions:
  contents: read
jobs:
  p07-native-mariadb-proof:
    if: ${{ github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: p07-synthetic-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mariadb-admin ping --host=127.0.0.1 --user=root --password=p07-synthetic-only --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: MariaDB native CLI
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          if ! command -v mariadb >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mariadb-client
          fi
          MYSQL_PWD=p07-synthetic-only mariadb --no-defaults --protocol=tcp -h127.0.0.1 -P3306 -uroot -N -e 'SELECT VERSION()' | grep -E '^11[.]8[.]'
      - name: Ephemeral checkout exact P07 private HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 22e008b97bf876aa8a27f35c8013fce6f5d4aa65
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p07-exact
          fetch-depth: 1
      - name: All one-shot native schema/row tests and previous recovery safety
        shell: bash
        env:
          P07_SYNTHETIC_MARIADB: '1'
          P07_DB_TEST_PASSWORD: p07-synthetic-only
        run: |
          set -Eeuo pipefail
          set +x
          cd p07-exact
          test "$(git rev-parse HEAD)" = 22e008b97bf876aa8a27f35c8013fce6f5d4aa65
          export PYTHONDONTWRITEBYTECODE=1
          bash -n bin/vfops bin/vfops-migrate-ui
          python3 -B lib/server_migration_pull.py laravel-live-parity --help | grep -F -- '--domain'
          python3 -B -m unittest -q \
            tests.test_migration_laravel_live_parity \
            tests.test_migration_laravel_readonly_engine \
            tests.test_migration_failed_laravel_recovery \
            tests.test_migration_failed_prepare_audit
          echo 'P07_293_ONE_SHOT_NATIVE_DB_CONTENT_PARITY_EXACT_SOURCE_PASS'
      - name: Remove temporary private files
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- p07-exact
          echo 'P07_PRIVATE_CHECKOUT_CLEANUP_DONE'
  p07-native-mysql84-proof:
    if: ${{ github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: p07-synthetic-only
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h127.0.0.1 -uroot -pp07-synthetic-only --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: MySQL 8 native CLI
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          if ! command -v mysql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mysql-client
          fi
          MYSQL_PWD=p07-synthetic-only mysql --no-defaults --protocol=tcp -h127.0.0.1 -P3306 -uroot -N -e 'SELECT VERSION()' | grep -E '^8[.]4[.]'
      - name: Ephemeral private P07 exact commit checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 22e008b97bf876aa8a27f35c8013fce6f5d4aa65
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p07-exact
          fetch-depth: 1
      - name: Test identical native read-only evidence on MySQL 8.4
        env:
          P07_SYNTHETIC_MARIADB: '1'
          P07_DB_TEST_PASSWORD: p07-synthetic-only
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd p07-exact
          test "$(git rev-parse HEAD)" = 22e008b97bf876aa8a27f35c8013fce6f5d4aa65
          export PYTHONDONTWRITEBYTECODE=1
          python3 -B -m unittest -q \
            tests.test_migration_laravel_live_parity \
            tests.test_migration_laravel_readonly_engine
          echo 'P07_293_NATIVE_MYSQL84_TABLE_AND_ROW_PARITY_EXACT_SOURCE_PASS'
      - name: Always clean transient private checkout
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- p07-exact
          echo 'P07_MYSQL84_PRIVATE_CLEANUP_DONE'
