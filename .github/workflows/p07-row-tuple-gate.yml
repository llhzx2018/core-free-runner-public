name: P07 row-tuple exact-source safety gate
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-row-tuple-gate.yml'
      - 'experiments/p07-row-tuple/**'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check released baseline and exact source blob identities
        shell: bash
        run: |
          set -Eeuo pipefail
          root=dist/p07/0.1.0/overlay
          test "$(cat "$root/BUILD_ID")" = 0.1.0-release106
          test "$(git hash-object experiments/p07-row-tuple/sql_row_evidence.py)" = b5c31d31f3ca43a87dc88b5c92a161ee90fecdf0
          test "$(git hash-object experiments/p07-row-tuple/sql_diff_evidence.py)" = 46e47cb3d6ebf78f2f39d9d5a8d5fcd685412388
          test "$(git hash-object experiments/p07-row-tuple/test_sql_row_evidence.py)" = 7154eac7f851f22a9d67f8b4497f8dab9913f109
          test "$(git hash-object experiments/p07-row-tuple/test_cross_engine_sql_format.py)" = 40bd64f0a4603448eca8691bc69addd4a0597418
          cp -a "$root" "$RUNNER_TEMP/p07-row-test"
          cp experiments/p07-row-tuple/sql_row_evidence.py "$RUNNER_TEMP/p07-row-test/lib/sql_row_evidence.py"
          cp experiments/p07-row-tuple/sql_diff_evidence.py "$RUNNER_TEMP/p07-row-test/lib/sql_diff_evidence.py"
          cp experiments/p07-row-tuple/test_sql_row_evidence.py "$RUNNER_TEMP/p07-row-test/tests/test_sql_row_evidence.py"
          cp experiments/p07-row-tuple/test_cross_engine_sql_format.py "$RUNNER_TEMP/p07-row-test/tests/test_cross_engine_sql_format.py"
          chmod +x "$RUNNER_TEMP/p07-row-test/bin/"*
          echo P07_ROW_EXACT_BLOB_PASS
      - name: Run row-trace safety and prior cross-engine true-positive gates
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/p07-row-test"
          python3 -m py_compile lib/sql_row_evidence.py lib/sql_diff_evidence.py tests/test_sql_row_evidence.py
          PYTHONPATH=lib python3 -m unittest -v \
            tests.test_sql_row_evidence \
            tests.test_multiline_dml_integrity \
            tests.test_sql_diff_evidence \
            tests.test_sql_diff_command \
            tests.test_cross_engine_sql_format \
            tests.test_verify \
            tests.test_server_migration_pull
          echo P07_ROW_REGRESSION_PASS
      - name: Prove migration writes, SQL admission and package boundary unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          root=dist/p07/0.1.0/overlay
          for p in lib/verify.py lib/server_migration_pull.py lib/server_migration.py lib/cloudpanel.py bin/vfops BUILD_ID; do
            test "$(git hash-object "$root/$p")" = "$(git hash-object "$RUNNER_TEMP/p07-row-test/$p")"
          done
          echo P07_ROW_NO_SQL_WHITELIST_OR_MIGRATION_WRITE_CHANGE_PASS
