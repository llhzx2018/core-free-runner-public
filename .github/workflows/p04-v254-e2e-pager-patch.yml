name: P04 V2.5.4 E2E Pager Patch

on:
  push:
    paths:
      - '.github/workflows/p04-v254-e2e-pager-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match actual pager semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/p04-v254-browser-e2e.mjs')
          s=p.read_text(encoding='utf-8')
          old="assert(/第\\s*1\\s*\\/\\s*2/.test(pagerText), `unexpected domain pager: ${pagerText}`);"
          new="assert(/(?:第\\s*)?1\\s*\\/\\s*2/.test(pagerText), `unexpected domain pager: ${pagerText}`);"
          if s.count(old)!=1: raise SystemExit('pager assertion sentinel mismatch')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          node --check scripts/p04-v254-browser-e2e.mjs
          git diff --check
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add scripts/p04-v254-browser-e2e.mjs
          git commit -m 'runner(P04): align V2.5.4 pager assertion with actual UI'
          git push origin HEAD:main
