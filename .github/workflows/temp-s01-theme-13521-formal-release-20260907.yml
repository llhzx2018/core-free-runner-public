name: S01 Theme 1.35.21 Formal Release
on:
  push:
    branches:
      - temp/s01-update-center-id-closure-20260907
    paths:
      - .github/workflows/temp-s01-theme-13521-formal-release-20260907.yml
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      SHA: e27aebdc3d1674711a2ec6e9e113119bf2d9071a
      BASE_SHA: 1447c67febf1d3d456ca0e51d2c7c78063f79ae7
      TAG: v1.35.21
      ASSET: vf-tools-theme_V1.35.21.zip
    steps:
      - uses: actions/checkout@v4
      - name: Deterministic Theme build, publish and readback
        env:
          GH_TOKEN: ${{ env.WRITE_TOKEN }}
        run: bash scripts/temp_s01_theme_13521_formal_release_20260907.sh
