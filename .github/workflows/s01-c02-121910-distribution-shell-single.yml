name: S01-C02 1.21.910 Distribution + Shell Single Authority Gate

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CORE_UPDATES_SHA: 8e09994c52a5e3846322a411ff1c59d7beb870f9
      PRODUCT_SHA: f96cc7d82fddc25e3925f4ed178b285da538c591
      VERSION: 1.21.910
      TAG: v1.21.910
      ASSET: vf-tools-ops_V1.21.910.zip
      ASSET_BYTES: "3479429"
      ASSET_SHA256: 262c55857a77deb7972605507cd45d291b4f8d5c687b21b734f3d7490a1f98a8
      RUNTIME_FILES: "972"
      RUNTIME_FINGERPRINT: 07d912968b79553c99bafcb122e1c0d395c905fe8799afb107d0001a18b1ba3d

    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: 8e09994c52a5e3846322a411ff1c59d7beb870f9
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: dist

      - name: Checkout exact Ops source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: f96cc7d82fddc25e3925f4ed178b285da538c591
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops

      - name: Verify distribution manifest and Update Core
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C dist rev-parse HEAD)" = "$CORE_UPDATES_SHA"
          python3 dist/scripts/check_manifest_contract.py >/tmp/manifest-audit.json
          grep -Fq '"status": "PASS"' /tmp/manifest-audit.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          m=json.loads(Path('dist/projects/S01-C02.json').read_text())
          assert m['target_version']==os.environ['VERSION']
          assert m['release_tag']==os.environ['TAG']
          assert m['asset_name']==os.environ['ASSET']
          assert m['asset_bytes']==int(os.environ['ASSET_BYTES'])
          assert m['asset_sha256']==os.environ['ASSET_SHA256']
          assert m['runtime_files']==int(os.environ['RUNTIME_FILES'])
          assert m['runtime_file_count']==int(os.environ['RUNTIME_FILES'])
          assert m['runtime_fingerprint']==os.environ['RUNTIME_FINGERPRINT']
          assert m['runtime_fingerprint_sha256']==os.environ['RUNTIME_FINGERPRINT']
          assert '1.21.909' in m['from_versions']
          assert m['schema_from']=='6.0.0' and m['schema_to']=='6.0.0'
          print('PASS_MANIFEST')
          PY
          find dist/update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php dist/update-core/php/tests/run.php

      - name: Verify one shell owner
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$PRODUCT_SHA"
          php ops/tests/s01-c02-121910-shell-single-authority-r21-contract.php
          python3 - <<'PY'
          from pathlib import Path
          page_files=[
            'admin-s01-dashboard-r14.css',
            'admin-s01-tools-r15.css',
            'admin-s01-content-seo-r16.css',
            'admin-s01-quality-r17.css',
            'admin-s01-system-publish-r13.css',
          ]
          forbidden=[
            '.vf-ops-v6-shell','.vf-v6-shell-header','.vf-v6-domain-nav',
            '.vf-v6-domain-mobile','.vf-v6-brand-mark','.vf-v6-brand-copy',
            '.vf-v8-current-domain',
          ]
          for name in page_files:
              s=(Path('ops/assets/css/current')/name).read_text(encoding='utf-8')
              for needle in forbidden:
                  assert needle not in s, f'{name} owns {needle}'
          shell=Path('ops/assets/css/current/admin-s01-v6-shell-r1.css').read_text(encoding='utf-8')
          for needle in [
              '--vf-v6-shell-header-min-height:82px',
              '--vf-v6-shell-logo-size:42px',
              '--vf-v6-shell-brand-font:15px',
              '--vf-v6-shell-nav-font:13px',
              '--vf-v6-shell-nav-min-height:54px',
          ]:
              assert needle in shell
          print('PASS_SINGLE_SHELL_OWNER')
          PY

      - name: Verify Formal Release binding
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          JSON="$(gh api "repos/llhzx2018/vf-tools-ops/releases/tags/$TAG")"
          test "$(jq -r '.target_commitish' <<<"$JSON")" = "$PRODUCT_SHA"
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.size' <<<"$JSON")" = "$ASSET_BYTES"
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.digest' <<<"$JSON")" = "sha256:$ASSET_SHA256"
          mkdir -p /tmp/release
          gh release download "$TAG" --repo llhzx2018/vf-tools-ops --pattern "$ASSET" --dir /tmp/release
          test "$(stat -c '%s' "/tmp/release/$ASSET")" = "$ASSET_BYTES"
          test "$(sha256sum "/tmp/release/$ASSET" | awk '{print $1}')" = "$ASSET_SHA256"
          echo PASS_FORMAL_RELEASE_BINDING
