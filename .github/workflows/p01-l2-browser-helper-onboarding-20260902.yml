name: P01 L2 Browser Helper Onboarding
on:
  push:
    branches: [release/p01-v2365-candidate-20260902]
    paths: [.github/workflows/p01-l2-browser-helper-onboarding-20260902.yml]
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: product/p01-browser-helper-onboarding-20260902
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Fresh source fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = 65abfb77eb66202c61f13940ec188b99b6c9b125
          test "$(git -C product rev-parse origin/develop)" = 65abfb77eb66202c61f13940ec188b99b6c9b125
      - name: Apply onboarding patch
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('src/browser-helper.php'); s=p.read_text()
          anchor="$csrf=vf_csrf_token();\n"
          insert="$csrf=vf_csrf_token();\n$configured=!empty($state['configured']);\n$lastUsedAt=trim((string)($state['lastUsedAt']??''));\n$used=$lastUsedAt!=='';\n$connectionLabel=$used?'已可日常使用':($configured?'等待第一次保存':'尚未连接');\n"
          if s.count(anchor)!=1: raise SystemExit('browser helper state anchor drift')
          s=s.replace(anchor,insert,1)

          pattern=r'<section class="panel vf-browser-helper-panel">.*?</section>\n<section class="panel">.*?</section>\n(?=<dialog class="vf-helper-token-dialog")'
          replacement='''<section class="panel vf-browser-helper-panel">
  <div class="vf-helper-overview">
    <div><span class="vf-helper-overview-kicker">一次连接，之后只管保存</span><h2>3 步完成浏览器助手</h2><p>不需要在扩展里维护分类。连接完成后，右键或点击扩展图标都会直接保存到私密待整理。</p></div>
    <span class="vf-helper-connection-badge<?= $used?' is-ready':($configured?' is-waiting':'') ?>"><?=htmlspecialchars($connectionLabel,ENT_QUOTES,'UTF-8')?></span>
  </div>

  <ol class="vf-helper-setup-steps">
    <li class="vf-helper-step">
      <span class="vf-helper-step-index">1</span>
      <div class="vf-helper-step-copy"><strong>安装浏览器助手</strong><p>下载扩展 ZIP，在 Chrome / Edge 的扩展管理页加载一次。</p></div>
      <a class="btn" href="VF-Start-Browser-Extension.zip" download>下载扩展</a>
    </li>
    <li class="vf-helper-step<?= $configured?' is-done':'' ?>">
      <span class="vf-helper-step-index">2</span>
      <div class="vf-helper-step-copy">
        <strong>连接这个 VF Start</strong>
        <p>生成连接令牌。弹窗会把“站点地址 + 令牌”放在一起，按顺序复制到扩展设置即可。</p>
        <div class="vf-helper-inline-status"><span>站点</span><b><?=htmlspecialchars($siteUrl,ENT_QUOTES,'UTF-8')?></b></div>
        <div class="vf-helper-inline-status"><span>令牌</span><b id="helperTokenState"><?= $configured?'已生成 · 尾号 '.htmlspecialchars((string)$state['last4'],ENT_QUOTES,'UTF-8'):'尚未生成' ?></b></div>
      </div>
      <button class="btn primary" id="generateHelperToken" type="button"><?= $configured?'生成新令牌':'生成连接令牌' ?></button>
    </li>
    <li class="vf-helper-step<?= $used?' is-done':'' ?>">
      <span class="vf-helper-step-index">3</span>
      <div class="vf-helper-step-copy"><strong>保存任意网页完成验证</strong><p>连接保存后，打开任意网页点一次扩展图标。成功后这里会记录最近使用时间。</p><?php if($used): ?><div class="vf-helper-verified">已验证 · 最近使用 <?=htmlspecialchars($lastUsedAt,ENT_QUOTES,'UTF-8')?></div><?php elseif($configured): ?><div class="vf-helper-next-hint">连接信息已准备好，现在去扩展设置粘贴并保存。</div><?php else: ?><div class="vf-helper-next-hint">先完成第 2 步。</div><?php endif; ?></div>
      <a class="btn" href="links-admin.php?view=pending">打开待整理</a>
    </li>
  </ol>
</section>
<section class="panel vf-helper-state-panel">
  <div class="panel-head"><div><h2>日常使用状态</h2><p>浏览器助手只保存网址，不读取你的分类列表或网址清单。</p></div></div>
  <div class="vf-helper-status-list">
    <div><span>最近使用</span><strong id="helperLastUsed"><?=htmlspecialchars($lastUsedAt!==''?$lastUsedAt:'从未使用',ENT_QUOTES,'UTF-8')?></strong></div>
    <div><span>保存目标</span><strong>私密待整理</strong></div>
    <div><span>扩展权限</span><strong>仅保存网址</strong></div>
  </div>
  <?php if($configured): ?><details class="vf-helper-connection-manage"><summary>连接管理</summary><div><p>只有更换设备、令牌泄露或连接失效时才需要操作。</p><button class="btn danger" id="revokeHelperToken" type="button">撤销当前令牌</button></div></details><?php endif; ?>
</section>
'''
          s2,n=re.subn(pattern,replacement,s,flags=re.S)
          if n!=1: raise SystemExit(f'browser helper main block drift: {n}')
          s=s2

          token_anchor='''      <section class="vf-helper-token-card" aria-label="浏览器助手令牌">'''
          site_card='''      <section class="vf-helper-token-card vf-helper-site-card" aria-label="VF Start 站点地址">
        <div class="vf-helper-token-card-head">
          <label for="helperSiteUrlModal">1. 站点地址</label>
          <span>扩展设置中的“VF Start 地址”</span>
        </div>
        <div class="vf-helper-token-copy-row">
          <input id="helperSiteUrlModal" type="text" readonly spellcheck="false" value="<?=htmlspecialchars($siteUrl,ENT_QUOTES,'UTF-8')?>">
          <button class="btn vf-helper-token-copy" type="button" data-copy="#helperSiteUrlModal">复制地址</button>
        </div>
      </section>

      <section class="vf-helper-token-card" aria-label="浏览器助手令牌">'''
          if s.count(token_anchor)!=1: raise SystemExit('token card anchor drift')
          s=s.replace(token_anchor,site_card,1)
          s=s.replace('<label for="newHelperToken">浏览器助手令牌</label>','<label for="newHelperToken">2. 浏览器助手令牌</label>',1)
          s=s.replace('<strong>打开浏览器助手 → 粘贴令牌 → 保存连接设置</strong>','<strong>打开扩展设置 → 粘贴站点地址和令牌 → 连接并保存</strong>',1)
          p.write_text(s)

          p=Path('src/assets/admin-pages.css'); css=p.read_text()
          addition='''
/* browser-helper.php: onboarding is a single install → connect → verify path. */
body[data-vf-page="browser-helper"] .vf-browser-helper-panel{display:grid;gap:18px}
body[data-vf-page="browser-helper"] .vf-helper-overview{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding-bottom:16px;border-bottom:1px solid var(--vf-admin-line)}
body[data-vf-page="browser-helper"] .vf-helper-overview-kicker{display:block;margin-bottom:5px;color:var(--vf-admin-primary);font-size:10.5px;font-weight:800;letter-spacing:.04em}
body[data-vf-page="browser-helper"] .vf-helper-overview h2{margin:0;color:var(--vf-admin-strong);font-size:18px}
body[data-vf-page="browser-helper"] .vf-helper-overview p{max-width:720px;margin:5px 0 0;color:var(--vf-admin-muted);font-size:12px;line-height:1.6}
body[data-vf-page="browser-helper"] .vf-helper-connection-badge{flex:0 0 auto;padding:6px 9px;border-radius:999px;background:var(--vf-admin-surface-soft);color:var(--vf-admin-muted);font-size:10.5px;font-weight:760}
body[data-vf-page="browser-helper"] .vf-helper-connection-badge.is-waiting{background:#fff7e8;color:#9a5b00}
body[data-vf-page="browser-helper"] .vf-helper-connection-badge.is-ready{background:#eaf8f3;color:#08755f}
body[data-vf-page="browser-helper"] .vf-helper-setup-steps{display:grid;gap:0;margin:0;padding:0;list-style:none;border:1px solid var(--vf-admin-border);border-radius:11px;overflow:hidden}
body[data-vf-page="browser-helper"] .vf-helper-step{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:12px;padding:14px;background:var(--vf-admin-surface);border-bottom:1px solid var(--vf-admin-line)}
body[data-vf-page="browser-helper"] .vf-helper-step:last-child{border-bottom:0}
body[data-vf-page="browser-helper"] .vf-helper-step-index{width:26px;height:26px;display:grid;place-items:center;border-radius:50%;background:var(--vf-admin-surface-soft);color:var(--vf-admin-muted);font-size:11px;font-weight:800}
body[data-vf-page="browser-helper"] .vf-helper-step.is-done .vf-helper-step-index{background:#eaf8f3;color:#08755f}
body[data-vf-page="browser-helper"] .vf-helper-step.is-done .vf-helper-step-index::after{content:'✓'}
body[data-vf-page="browser-helper"] .vf-helper-step.is-done .vf-helper-step-index{font-size:0}
body[data-vf-page="browser-helper"] .vf-helper-step-copy{min-width:0}
body[data-vf-page="browser-helper"] .vf-helper-step-copy>strong{display:block;color:var(--vf-admin-strong);font-size:12.5px}
body[data-vf-page="browser-helper"] .vf-helper-step-copy>p{margin:3px 0 0;color:var(--vf-admin-muted);font-size:11.5px;line-height:1.55}
body[data-vf-page="browser-helper"] .vf-helper-inline-status{display:flex;gap:7px;min-width:0;margin-top:5px;font-size:10.5px}
body[data-vf-page="browser-helper"] .vf-helper-inline-status span{color:var(--vf-admin-muted)}
body[data-vf-page="browser-helper"] .vf-helper-inline-status b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--vf-admin-text);font-weight:650}
body[data-vf-page="browser-helper"] .vf-helper-verified,body[data-vf-page="browser-helper"] .vf-helper-next-hint{margin-top:6px;font-size:10.5px;font-weight:700}
body[data-vf-page="browser-helper"] .vf-helper-verified{color:#08755f}
body[data-vf-page="browser-helper"] .vf-helper-next-hint{color:var(--vf-admin-muted)}
body[data-vf-page="browser-helper"] .vf-helper-state-panel{display:grid;gap:12px}
body[data-vf-page="browser-helper"] .vf-helper-status-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--vf-admin-border);border-radius:10px;overflow:hidden}
body[data-vf-page="browser-helper"] .vf-helper-status-list>div{padding:12px;border-right:1px solid var(--vf-admin-line)}
body[data-vf-page="browser-helper"] .vf-helper-status-list>div:last-child{border-right:0}
body[data-vf-page="browser-helper"] .vf-helper-status-list span{display:block;color:var(--vf-admin-muted);font-size:10px}
body[data-vf-page="browser-helper"] .vf-helper-status-list strong{display:block;margin-top:3px;color:var(--vf-admin-strong);font-size:12px;overflow-wrap:anywhere}
body[data-vf-page="browser-helper"] .vf-helper-connection-manage{border-top:1px solid var(--vf-admin-line);padding-top:10px}
body[data-vf-page="browser-helper"] .vf-helper-connection-manage summary{cursor:pointer;color:var(--vf-admin-muted);font-size:11px;font-weight:700}
body[data-vf-page="browser-helper"] .vf-helper-connection-manage>div{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px}
body[data-vf-page="browser-helper"] .vf-helper-connection-manage p{margin:0;color:var(--vf-admin-muted);font-size:11px}
body[data-vf-page="browser-helper"] .vf-helper-site-card{margin-bottom:10px}
@media(max-width:760px){body[data-vf-page="browser-helper"] .vf-helper-overview{display:grid}body[data-vf-page="browser-helper"] .vf-helper-connection-badge{justify-self:start}body[data-vf-page="browser-helper"] .vf-helper-step{grid-template-columns:28px minmax(0,1fr)}body[data-vf-page="browser-helper"] .vf-helper-step>.btn{grid-column:2;width:100%}body[data-vf-page="browser-helper"] .vf-helper-status-list{grid-template-columns:1fr}body[data-vf-page="browser-helper"] .vf-helper-status-list>div{border-right:0;border-bottom:1px solid var(--vf-admin-line)}body[data-vf-page="browser-helper"] .vf-helper-status-list>div:last-child{border-bottom:0}body[data-vf-page="browser-helper"] .vf-helper-connection-manage>div{align-items:stretch;flex-direction:column}}
'''
          if 'browser-helper.php: onboarding is a single' in css: raise SystemExit('browser helper css duplicate')
          p.write_text(css.rstrip()+addition+'\n')
          PY
      - name: Verify exact product contract
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          php -l src/browser-helper.php >/dev/null
          git diff --check
          grep -F '3 步完成浏览器助手' src/browser-helper.php >/dev/null
          grep -F '安装浏览器助手' src/browser-helper.php >/dev/null
          grep -F '连接这个 VF Start' src/browser-helper.php >/dev/null
          grep -F '保存任意网页完成验证' src/browser-helper.php >/dev/null
          grep -F 'data-copy="#helperSiteUrlModal"' src/browser-helper.php >/dev/null
          grep -F '打开扩展设置 → 粘贴站点地址和令牌 → 连接并保存' src/browser-helper.php >/dev/null
          grep -F '<summary>连接管理</summary>' src/browser-helper.php >/dev/null
          test "$(cat src/VERSION.txt)" = 2.36.4
          git diff --name-only | sort | tee /tmp/changed.txt
          expected=$(printf '%s\n' src/assets/admin-pages.css src/browser-helper.php | sort)
          test "$(cat /tmp/changed.txt)" = "$expected"
          test "$(git diff --name-only -- database src/migrations | wc -l | tr -d ' ')" = 0
          echo 'BROWSER HELPER ONBOARDING PASS'
      - name: Commit and push candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add src/browser-helper.php src/assets/admin-pages.css
          git commit -m 'feat(P01): turn browser helper setup into three steps'
          git push origin HEAD:product/p01-browser-helper-onboarding-20260902
          echo "CANDIDATE=$(git rev-parse HEAD)"
          echo "TREE=$(git rev-parse HEAD^{tree})"
