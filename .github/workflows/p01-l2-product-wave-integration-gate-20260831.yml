name: P01 L2 Product Wave Integration Gate
on:
  push:
    branches: [product/p01-l2-wave-integration-gate-20260831]
    paths: [.github/workflows/p01-l2-product-wave-integration-gate-20260831.yml]
permissions:
  contents: read
  actions: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE: 23926f86548df999d8a1f2f8ca70ae518b557690
      BASE: fa77d516957058b3a60fa6cc839326c91c5329fa
      TREE: 1810d19b719ccf7c7a37b6a7ba32f473d902727a
      HOME_SOURCE: 353a9037cfc5e16d5e4d282ce4e658511d9558b4
      IA_SOURCE: a48f8f53462a04fb222f2ba9df67d96ddec77d52
      BROWSER_SOURCE: 32ff23a1f580a8e4a8857860420ea4e035f3ef18
      ROOT: ${{ github.workspace }}/product/src
      EVID: /tmp/p01-l2-wave/evidence
      COOKIE: /tmp/p01-l2-wave.cookies
      PORT: '18473'
      ADMIN_PASS: P01L2WaveGate
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - name: Checkout exact integration source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Exact source scope and candidate blob fence
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-l2-wave "$COOKIE"; mkdir -p "$EVID"
          test "$(git -C product rev-parse HEAD)" = "$SOURCE"
          test "$(git -C product rev-parse HEAD^{tree})" = "$TREE"
          test "$(git -C product merge-base "$BASE" HEAD)" = "$BASE"
          mapfile -t changed < <(git -C product diff --name-only "$BASE"...HEAD | sort)
          expected=$'src/app/AdminShell.php\nsrc/app/FunctionalHome.php\nsrc/assets/workspace-home.css\nsrc/browser-helper.php\nsrc/settings.php\nsrc/system.php'
          test "$(printf '%s\n' "${changed[@]}")" = "$expected"
          test "$(cat product/VERSION)" = 2.35.3
          test "$(cat product/src/VERSION.txt)" = 2.35.3
          grep -Fx "define('VF_VERSION', '2.35.3');" product/src/app/bootstrap.php >/dev/null
          jq -e '.production_version=="2.35.3" and .schema_version=="2026082901"' product/VF_PROJECT.json >/dev/null

          # Every product file must be byte-identical to its individually Machine-Gated candidate.
          test "$(git -C product rev-parse "HEAD:src/app/FunctionalHome.php")" = "$(git -C product rev-parse "$HOME_SOURCE:src/app/FunctionalHome.php")"
          test "$(git -C product rev-parse "HEAD:src/assets/workspace-home.css")" = "$(git -C product rev-parse "$HOME_SOURCE:src/assets/workspace-home.css")"
          test "$(git -C product rev-parse "HEAD:src/app/AdminShell.php")" = "$(git -C product rev-parse "$IA_SOURCE:src/app/AdminShell.php")"
          test "$(git -C product rev-parse "HEAD:src/settings.php")" = "$(git -C product rev-parse "$IA_SOURCE:src/settings.php")"
          test "$(git -C product rev-parse "HEAD:src/system.php")" = "$(git -C product rev-parse "$IA_SOURCE:src/system.php")"
          test "$(git -C product rev-parse "HEAD:src/browser-helper.php")" = "$(git -C product rev-parse "$BROWSER_SOURCE:src/browser-helper.php")"

          # Critical untouched runtime areas remain byte-identical to the baseline.
          for path in src/assets/update-core.js src/assets/browser-helper.js src/browser-gateway.php src/browser-extension; do
            test "$(git -C product rev-parse "$BASE:$path")" = "$(git -C product rev-parse "HEAD:$path")"
          done

          grep -F '现在需要关注什么' product/src/app/FunctionalHome.php >/dev/null
          grep -F '最近 8 条' product/src/app/FunctionalHome.php >/dev/null
          ! grep -F 'vf-home-status-grid' product/src/app/FunctionalHome.php
          ! grep -F 'vf-home-recent-list' product/src/app/FunctionalHome.php
          ! grep -F 'vf-home-domain-list' product/src/app/FunctionalHome.php
          grep -F "['key'=>'recovery','label'=>'备份与恢复'" product/src/app/AdminShell.php >/dev/null
          grep -F "['key'=>'update','label'=>'更新'" product/src/app/AdminShell.php >/dev/null
          ! grep -F "['key'=>'system','label'=>'系统'" product/src/app/AdminShell.php
          grep -F '公开首页常用入口' product/src/settings.php >/dev/null
          grep -F '不控制管理员工作台首页' product/src/settings.php >/dev/null
          grep -F '高级诊断信息' product/src/system.php >/dev/null
          grep -F '私密待整理' product/src/browser-helper.php >/dev/null
          grep -F '仅保存网址' product/src/browser-helper.php >/dev/null
          grep -F 'links-admin.php?view=pending' product/src/browser-helper.php >/dev/null
          ! grep -F '系统 → 安全' product/src/browser-helper.php
          ! grep -F '<span>最近 IP</span>' product/src/browser-helper.php

          find product/src -type f -name '*.php' -print0 | xargs -0 -n1 php -l >"$EVID/php-lint.txt"
          find product/src/assets product/src/browser-extension -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          printf 'P01_L2_WAVE_SCOPE=PASS\nP01_L2_WAVE_BLOB_IDENTITY=PASS\n' | tee "$EVID/scope.txt"
      - name: Fresh install and combined runtime verification
        shell: bash
        run: |
          set -Eeuo pipefail
          php -S 127.0.0.1:$PORT -t "$ROOT" >"$EVID/server.log" 2>&1 & echo $! >/tmp/p01-l2-wave.pid
          for i in $(seq 1 60); do curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:$PORT/setup.php" -o "$EVID/setup.html" && break; sleep .25; done
          CSRF=$(python3 - "$EVID/setup.html" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:$PORT/setup.php" --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=P01 L2 Wave Gate' --data-urlencode "admin_password=$ADMIN_PASS" --data-urlencode "admin_password_confirm=$ADMIN_PASS" -o "$EVID/setup-post.html"
          php "$ROOT/cli/verify.php" | tee "$EVID/verify.txt" | grep -Fx VERIFY_PASS=YES
          php "$ROOT/cli/surface-verify.php" | tee "$EVID/surface.txt" | grep -Fx CURRENT_DOMAIN_PASS=YES
          ROOT="$ROOT" php <<'PHP' | tee "$EVID/database.txt"
          <?php require getenv('ROOT').'/app/bootstrap.php';$d=vf_db();if(strtolower((string)$d->query('PRAGMA integrity_check')->fetchColumn())!=='ok')exit(11);if($d->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC))exit(12);$schema=(string)$d->query("SELECT setting_value FROM settings WHERE setting_key='schema_version'")->fetchColumn();if($schema!==''&&$schema!=='2026082901')exit(13);echo "P01_L2_WAVE_SQLITE=PASS\n";
          PHP
          rm -f "$COOKIE"
          curl -fsS -c "$COOKIE" -b "$COOKIE" -H 'Content-Type: application/json' -H 'Accept: application/json' -X POST "http://127.0.0.1:$PORT/api.php?action=login" --data "{\"password\":\"$ADMIN_PASS\"}" | tee "$EVID/login.json" | jq -e '.ok==true' >/dev/null
          : > "$EVID/http.txt"
          for page in home.php surfaces.php start.php channels.php watch.php topics.php links-admin.php browser-helper.php data-safety.php settings.php update.php system.php system-info.php system-baseline.php plugins.php; do
            code=$(curl -sS -o "$EVID/${page//\//-}.html" -w '%{http_code}' -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:$PORT/$page")
            echo "$page=$code" | tee -a "$EVID/http.txt"; test "$code" = 200
          done
          curl -sS -D "$EVID/security.headers" -o /dev/null -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:$PORT/security.php"
          tr -d '\r' < "$EVID/security.headers" > "$EVID/security.normalized"
          test "$(awk 'NR==1{print $2}' "$EVID/security.normalized")" = 302
          grep -Fqx 'Location: settings.php#account' "$EVID/security.normalized"
          echo P01_L2_WAVE_FRESH_RUNTIME=PASS | tee "$EVID/runtime.txt"
      - name: Chromium combined responsibility hierarchy and responsive gate
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-l2-wave/pw; cd /tmp/p01-l2-wave/pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat >gate.cjs <<'JS'
          const {chromium}=require('playwright');
          const base='http://127.0.0.1:18473/';
          const expectedTop=['网址','浏览器助手','备份与恢复','设置','更新'];
          (async()=>{
            const b=await chromium.launch({headless:true});
            const c=await b.newContext({viewport:{width:1440,height:900}});
            let q=await c.request.post(base+'api.php?action=login',{data:{password:'P01L2WaveGate'}});
            if(!q.ok()||!(await q.json()).ok)throw Error('login');
            const p=await c.newPage();

            // Home: attention/activity only; navigation/favorites/recent remain in the existing shell.
            await p.goto(base+'home.php',{waitUntil:'networkidle'});
            const homeRead=()=>p.evaluate(()=>({
              title:document.querySelector('.vf-home-command-head h1')?.textContent?.trim()||'',
              focus:document.querySelector('#vfHomeFocusTitle')?.textContent?.trim()||'',
              activity:document.querySelector('#vfHomeActivityTitle')?.textContent?.trim()||'',
              calm:!!document.querySelector('.vf-home-calm'),
              statusGrid:!!document.querySelector('.vf-home-status-grid'),
              recentList:!!document.querySelector('.vf-home-recent-list'),
              domainList:!!document.querySelector('.vf-home-domain-list'),
              duplicateQuickLinks:[...document.querySelectorAll('main a')].filter(a=>/view=(favorite|recent)/.test(a.getAttribute('href')||'')).length,
              sidebarFavorite:[...document.querySelectorAll('.vf-functional-sidebar a')].some(a=>a.textContent.includes('我的收藏')),
              sidebarRecent:[...document.querySelectorAll('.vf-functional-sidebar a')].some(a=>a.textContent.includes('最近使用')),
              domainNav:[...document.querySelectorAll('.vf-global-domain-nav a')].map(a=>a.textContent.trim()),
              mobileCommand:getComputedStyle(document.querySelector('.vf-home-mobile-command')).display,
              overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
            }));
            let h=await homeRead();
            if(h.title!=='首页'||h.focus!=='现在需要关注什么'||h.activity!=='最近操作'||!h.calm||h.statusGrid||h.recentList||h.domainList||h.duplicateQuickLinks!==0||!h.sidebarFavorite||!h.sidebarRecent||!h.domainNav.includes('导航')||!h.domainNav.includes('频道')||!h.domainNav.includes('影视')||!h.domainNav.includes('专题')||h.overflow>1)throw Error('home desktop '+JSON.stringify(h));
            await p.screenshot({path:process.env.EVID+'/home-1440.png',fullPage:true});
            await p.setViewportSize({width:390,height:844}); await p.waitForTimeout(120);
            h=await homeRead();
            if(h.mobileCommand==='none'||h.overflow>1||h.statusGrid||h.recentList||h.domainList)throw Error('home mobile '+JSON.stringify(h));
            await p.screenshot({path:process.env.EVID+'/home-390.png',fullPage:true});

            // Backend IA: five permanent tasks only; diagnostics stay low-frequency under Settings.
            await p.setViewportSize({width:1440,height:900});
            const adminRead=()=>p.evaluate(()=>({
              group:document.body.dataset.vfGroup||'',
              top:[...document.querySelectorAll('.vf-rail-section>.vf-rail-item>span')].map(x=>x.textContent.trim()),
              active:document.querySelector('.vf-rail-section.active>.vf-rail-item>span')?.textContent?.trim()||'',
              sub:[...document.querySelectorAll('.vf-rail-subitem')].map(x=>x.textContent.trim()),
              overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
              railOpen:document.body.classList.contains('vf-rail-open')
            }));
            async function go(path,group,active){await p.goto(base+path,{waitUntil:'networkidle'});let m=await adminRead();if(JSON.stringify(m.top)!==JSON.stringify(expectedTop)||m.top.includes('系统')||m.group!==group||m.active!==active||m.overflow>1)throw Error(path+' '+JSON.stringify(m));return m;}
            let m=await go('settings.php','settings','设置');
            for(const x of ['站点与品牌','阅读与列表','公开首页与现场','公开展示与 SEO','管理员账号','RSS 订阅','系统状态'])if(!m.sub.includes(x))throw Error('settings sub '+x+' '+JSON.stringify(m));
            if(!await p.locator('text=公开首页常用入口').count()||!await p.locator('text=不控制管理员工作台首页').count())throw Error('settings public home copy');
            await p.screenshot({path:process.env.EVID+'/settings-1440.png',fullPage:true});
            m=await go('data-safety.php','recovery','备份与恢复');
            for(const x of ['SQLite 备份','完整恢复','旧站迁移'])if(!m.sub.includes(x))throw Error('recovery sub '+x+' '+JSON.stringify(m));
            await go('update.php','update','更新');
            await go('system.php','settings','设置');
            if(!await p.locator('a[href="system-info.php"]').count()||!await p.locator('a[href="system-baseline.php"]').count())throw Error('advanced diagnostics missing');
            await go('system-info.php','settings','设置');
            await go('system-baseline.php','settings','设置');
            await go('plugins.php','settings','设置');

            // Browser Helper inside the new backend shell must still be a simple capture workflow.
            await p.goto(base+'browser-helper.php',{waitUntil:'networkidle'});
            const helperRead=()=>p.evaluate(()=>({
              title:document.querySelector('.vf-admin-titleblock h1')?.textContent?.trim()||'',
              body:document.body.innerText,
              top:[...document.querySelectorAll('.vf-rail-section>.vf-rail-item>span')].map(x=>x.textContent.trim()),
              active:document.querySelector('.vf-rail-section.active>.vf-rail-item>span')?.textContent?.trim()||'',
              pendingHref:document.querySelector('a[href="links-admin.php?view=pending"]')?.getAttribute('href')||'',
              downloadHref:document.querySelector('a[download]')?.getAttribute('href')||'',
              generate:!!document.getElementById('generateHelperToken'),
              overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
            }));
            let bh=await helperRead();
            if(bh.title!=='浏览器助手'||JSON.stringify(bh.top)!==JSON.stringify(expectedTop)||bh.active!=='浏览器助手'||!bh.body.includes('私密待整理')||!bh.body.includes('仅保存网址')||bh.body.includes('系统 → 安全')||bh.body.includes('最近 IP')||bh.body.includes('link.save')||bh.pendingHref!=='links-admin.php?view=pending'||bh.downloadHref!=='VF-Start-Browser-Extension.zip'||!bh.generate||bh.overflow>1)throw Error('helper desktop '+JSON.stringify(bh));
            await p.screenshot({path:process.env.EVID+'/browser-helper-1440.png',fullPage:true});
            await p.locator('a[href="links-admin.php?view=pending"]').click(); await p.waitForLoadState('networkidle');
            if(!p.url().includes('links-admin.php?view=pending'))throw Error('pending navigation '+p.url());

            // Mobile backend drawer + Browser Helper responsive state.
            await p.goto(base+'settings.php',{waitUntil:'networkidle'}); await p.setViewportSize({width:390,height:844}); await p.waitForTimeout(100);
            await p.locator('.vf-admin-menu-button').click(); await p.waitForTimeout(100);
            m=await adminRead();
            if(!m.railOpen||JSON.stringify(m.top)!==JSON.stringify(expectedTop)||m.overflow>1)throw Error('settings mobile '+JSON.stringify(m));
            const box=await p.locator('#vfAdminRail').boundingBox();if(!box||box.x>1||box.width<220)throw Error('mobile rail '+JSON.stringify(box));
            await p.screenshot({path:process.env.EVID+'/settings-390.png',fullPage:true});
            await p.goto(base+'browser-helper.php',{waitUntil:'networkidle'}); await p.waitForTimeout(100); bh=await helperRead();
            if(bh.overflow>1||!bh.body.includes('私密待整理')||!bh.body.includes('仅保存网址'))throw Error('helper mobile '+JSON.stringify(bh));
            await p.screenshot({path:process.env.EVID+'/browser-helper-390.png',fullPage:true});
            await b.close();
            console.log('P01_L2_WAVE_CHROMIUM=PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          EVID="$EVID" node gate.cjs | tee "$EVID/chromium.txt"
          grep -Fx P01_L2_WAVE_CHROMIUM=PASS "$EVID/chromium.txt"
      - name: Final verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fx P01_L2_WAVE_SCOPE=PASS "$EVID/scope.txt"
          grep -Fx P01_L2_WAVE_BLOB_IDENTITY=PASS "$EVID/scope.txt"
          grep -Fx P01_L2_WAVE_FRESH_RUNTIME=PASS "$EVID/runtime.txt"
          grep -Fx P01_L2_WAVE_SQLITE=PASS "$EVID/database.txt"
          grep -Fx P01_L2_WAVE_CHROMIUM=PASS "$EVID/chromium.txt"
          printf 'P01_L2_PRODUCT_WAVE_INTEGRATION_GATE=PASS\nSOURCE=%s\nBASE=%s\nTREE=%s\nHOME_SOURCE=%s\nIA_SOURCE=%s\nBROWSER_SOURCE=%s\nOWNER_PRODUCTION_WRITE=NO\nMAIN_DEVELOP_PRODUCT_WRITE=NO\nRUNNER_MAIN_WRITE=NO\n' "$SOURCE" "$BASE" "$TREE" "$HOME_SOURCE" "$IA_SOURCE" "$BROWSER_SOURCE" | tee "$EVID/verdict.txt"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-l2-product-wave-integration-${{ github.run_id }}
          path: /tmp/p01-l2-wave/evidence
          if-no-files-found: error
          retention-days: 90
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/p01-l2-wave.pid 2>/dev/null)" 2>/dev/null || true
