name: P02 R52 Scratch Ownership V3

on:
  push:
    branches: [run/p02-r52-scratch-ownership]

permissions:
  contents: read

jobs:
  converge:
    runs-on: ubuntu-24.04
    env:
      BASE_REF: 72a78edbce44a9f9bd4ee18c58bc99387cbd485d
      EXPECTED_VERSION: 2.5.32
      PORT: '18120'
      POST_PORT: '18121'
    steps:
      - name: Checkout exact current develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.BASE_REF }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product

      - name: Apply R52 ownership convergence
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_REF"
          test "$(tr -d '\r\n' < VERSION)" = "$EXPECTED_VERSION"
          python3 - <<'PY'
          from pathlib import Path
          import json
          common=Path('public/assets/v254-common-branding.js'); text=common.read_text(encoding='utf-8')
          loader="\n\n(function(){\n  function loadScratchAssets(){"; model="\n\n/* V2.5.17_LIBRARY_MODEL_CONVERGENCE */"; overflow="\n\n/* V2.5.18_SCRATCH_TAB_OVERFLOW_UX */"
          if any(text.count(x)!=1 for x in (loader,model,overflow)): raise SystemExit('R52 source markers drifted')
          head,rest=text.split(loader,1); _,tail=rest.split(model,1); no_loader=head+model+tail; common_part,overflow_body=no_loader.split(overflow,1)
          common.write_text(common_part.rstrip()+'\n',encoding='utf-8')
          scratch=Path('public/assets/scratch-tabs.js'); scratch.write_text(scratch.read_text(encoding='utf-8').rstrip()+"\n\n/* P02 V2.5.32 R52 · Scratch tab overflow native domain ownership */\n/* V2.5.18_SCRATCH_TAB_OVERFLOW_UX */"+overflow_body.rstrip()+'\n',encoding='utf-8')
          index=Path('public/index.php'); lines=index.read_text(encoding='utf-8').splitlines(); out=[]; inserted=False
          if any('/assets/scratch-tabs.js' in x for x in lines): raise SystemExit('scratch static entry already exists')
          for line in lines:
              out.append(line)
              if '/assets/app.js' in line:
                  out.append('<script src="/assets/scratch-tabs.js?v=<?=rawurlencode(VFTB_VERSION)?>" defer></script>'); inserted=True
          if not inserted: raise SystemExit('app runtime entry missing')
          index.write_text('\n'.join(out)+'\n',encoding='utf-8')
          auth=Path('docs/authority/P02_DEVELOP_CANDIDATE_IDENTITY.json'); data=json.loads(auth.read_text(encoding='utf-8'))
          if data.get('runtime_source_file_count')!=67: raise SystemExit('unexpected runtime count')
          conv=data.setdefault('convergence',{}); conv.update({'scratch_runtime_static_entry':True,'scratch_dynamic_loader_retired':True,'scratch_tab_overflow_domain_owned':True}); data['next_gate']='POST_SCRATCH_OWNERSHIP_REVIEW'; auth.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          stylep=Path('tests/unit/p02_runtime_style_single_entry.mjs'); style=stylep.read_text(encoding='utf-8')
          old="const js=fs.readFileSync('public/assets/v254-common-branding.js','utf8');"; oldb="assert.ok(js.includes('/assets/scratch-tabs.js'));\nassert.ok(!js.includes('/assets/scratch-tabs.css'));\nassert.ok(!js.includes('scratchTabOverflowUxV2518'));\nassert.ok(!js.includes('ensureStyle()'));"
          newb="assert.equal((index.match(/\\/assets\\/scratch-tabs\\.js/g)||[]).length,1);\nassert.ok(index.indexOf('/assets/scratch-tabs.js')>index.indexOf('/assets/app.js'));\nassert.ok(!common.includes('/assets/scratch-tabs.js'));\nassert.ok(!common.includes('/assets/scratch-tabs.css'));\nassert.ok(!common.includes('scratchTabOverflowUxV2518'));\nassert.ok(!common.includes('ensureStyle()'));"
          if style.count(old)!=1 or style.count(oldb)!=1: raise SystemExit('runtime style contract drifted')
          stylep.write_text(style.replace(old,"const common=fs.readFileSync('public/assets/v254-common-branding.js','utf8');").replace(oldb,newb),encoding='utf-8')
          Path('tests/unit/p02_scratch_runtime_ownership_contract.mjs').write_text("""import fs from 'node:fs';\nimport assert from 'node:assert/strict';\nconst read=p=>fs.readFileSync(new URL('../../'+p,import.meta.url),'utf8');\nconst index=read('public/index.php');assert.equal((index.match(/\\/assets\\/scratch-tabs\\.js/g)||[]).length,1);assert(index.indexOf('/assets/scratch-tabs.js')>index.indexOf('/assets/app.js'));\nconst common=read('public/assets/v254-common-branding.js');for(const t of ['loadScratchAssets','data-scratch-v259','tabOverflowUxV2518','V2.5.18_SCRATCH_TAB_OVERFLOW_UX'])assert.equal(common.includes(t),false,t);\nconst scratch=read('public/assets/scratch-tabs.js');for(const t of ['tabOverflowUxV2518','scratch-tab-scroll-v2518','EDGE_DRAG_ZONE','leaveScratchThenActivate'])assert(scratch.includes(t),t);\nconst c=JSON.parse(read('docs/authority/P02_DEVELOP_CANDIDATE_IDENTITY.json'));assert.equal(c.runtime_source_file_count,67);for(const k of ['scratch_runtime_static_entry','scratch_dynamic_loader_retired','scratch_tab_overflow_domain_owned'])assert.equal(c.convergence[k],true,k);\nconsole.log('P02_SCRATCH_RUNTIME_OWNERSHIP_CONTRACT=PASS');\n""",encoding='utf-8')
          Path('docs/evidence/P02_SCRATCH_RUNTIME_OWNERSHIP_CONVERGENCE_20260831.md').write_text("""# P02 Scratch Runtime Ownership Convergence · 2026-08-31\n\nScratch remains a cohesive domain module. R52 makes `scratch-tabs.js` a static runtime entry after `app.js`, retires the historical dynamic loader from `v254-common-branding.js`, and moves Scratch tab-overflow behavior intact into `scratch-tabs.js`. Runtime source count remains 67. The single-stylesheet contract is preserved and rebound to the new runtime ownership. Favicon and Library Model behavior remain untouched for separate review.\n\nBoundary: no schema, main, tag, release, update-channel, or production write.\n""",encoding='utf-8')
          PY
          python3 scripts/generate-source-manifest.py
          python3 scripts/verify-source-manifest.py
          echo P02_R52_TRANSFORM=PASS

      - name: Full contracts and repository gates
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check public/assets/scratch-tabs.js
          node --check public/assets/v254-common-branding.js
          bash scripts/verify-repository.sh
          for t in tests/unit/p02_*.mjs tests/unit/v2523_unified_content_workspace_contract.mjs; do node "$t"; done
          test "$(node -e "console.log(JSON.parse(require('fs').readFileSync('SOURCE_MANIFEST.json','utf8')).runtime_source_file_count)")" = 67
          ! grep -F 'loadScratchAssets' public/assets/v254-common-branding.js
          git diff --check
          cp SOURCE_MANIFEST.json "$RUNNER_TEMP/r52-manifest.json";cp SOURCE_MANIFEST.txt "$RUNNER_TEMP/r52-manifest.txt"
          python3 scripts/generate-source-manifest.py
          cmp -s SOURCE_MANIFEST.json "$RUNNER_TEMP/r52-manifest.json";cmp -s SOURCE_MANIFEST.txt "$RUNNER_TEMP/r52-manifest.txt"
          python3 scripts/verify-source-manifest.py
          echo P02_R52_STATIC_AND_MANIFEST=PASS

      - name: Install browser runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 sqlite3 curl >/dev/null
          cd product
          npm install --no-save --package-lock=false playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Boot prewrite site
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          RUN_ROOT="$RUNNER_TEMP/p02-r52v3";SITE="$RUN_ROOT/site";mkdir -p "$RUN_ROOT";bash scripts/build-deploy-tree.sh "$SITE"
          php -d display_errors=0 -S "127.0.0.1:$PORT" -t "$SITE" >"$RUN_ROOT/php.log" 2>&1 & echo $! > "$RUN_ROOT/php.pid"
          BASE="http://127.0.0.1:$PORT";for _ in $(seq 1 80);do curl -fsS "$BASE/setup.php" >/dev/null 2>&1&&break;sleep .25;done
          PW="VF-R52V3-${GITHUB_RUN_ID}!";printf '%s' "$PW" > "$RUN_ROOT/password";curl -fsS -c "$RUN_ROOT/cookie" "$BASE/setup.php" > "$RUN_ROOT/setup.html"
          CSRF="$(python3 - "$RUN_ROOT/setup.html" <<'PY'
          import html,re,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf" value="([^"]+)"',s);assert m;print(html.unescape(m.group(1)))
          PY
          )"
          test "$(curl -sS -o /dev/null -w '%{http_code}' -b "$RUN_ROOT/cookie" -c "$RUN_ROOT/cookie" -H "Origin: $BASE" --data-urlencode "setup_csrf=$CSRF" --data-urlencode "password=$PW" --data-urlencode "password_confirm=$PW" "$BASE/setup.php")" = 303

      - name: Standard Chromium regression
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          RUN_ROOT="$RUNNER_TEMP/p02-r52v3";VF_UX_E2E_BASE_URL="http://127.0.0.1:$PORT" VF_UX_E2E_PASSWORD="$(cat "$RUN_ROOT/password")" VF_UX_E2E_VERSION="$EXPECTED_VERSION" node tests/e2e/p02_ux_task_flow.mjs
          echo P02_R52_STANDARD_CHROMIUM=PASS

      - name: Scratch specialized Chromium
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > r52-proof.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});const page=await browser.newPage({viewport:{width:390,height:844}});const base=process.env.BASE_URL,password=process.env.PASSWORD;const ok=(v,m)=>{if(!v)throw new Error(m)};
          await page.goto(base+'/',{waitUntil:'networkidle'});if(await page.locator('[data-open-login]').count()){await page.locator('[data-open-login]').click();await page.locator('#loginForm input[name="password"]').fill(password);await page.locator('#loginSubmit').click();await page.waitForFunction(async()=>Boolean((await(await fetch('/api.php?action=session')).json())?.site?.auth));}
          await page.waitForSelector('#scratchLaunchV259',{timeout:10000});const load=await page.evaluate(()=>({scripts:[...document.scripts].filter(x=>x.src.includes('/assets/scratch-tabs.js')).map(x=>x.dataset.scratchV259||''),resources:performance.getEntriesByType('resource').filter(x=>x.name.includes('/assets/scratch-tabs.js')).length}));ok(load.scripts.length===1&&load.scripts[0]==='','scratch must be one static script');ok(load.resources===1,'scratch must be requested once');
          await page.locator('#scratchLaunchV259').click();await page.waitForSelector('#scratchWorkspaceV259');await page.evaluate(()=>{const s=document.querySelector('#scratchWorkspaceV259 .scratch-tabs-scroll-v259'),tabs=document.querySelector('#scratchWorkspaceV259 [data-scratch-tabs]');s.style.width='220px';s.style.maxWidth='220px';const seed=tabs.querySelector('.scratch-tab-v259')||document.createElement('button');for(let i=0;i<18;i++){const c=seed.cloneNode(true);c.className='scratch-tab-v259'+(i===17?' active':'');c.dataset.scratchTab=String(9700+i);c.textContent='R52 overflow '+i;tabs.appendChild(c);}});
          await page.waitForSelector('#scratchWorkspaceV259 .scratch-tab-scroll-v2518.next',{timeout:10000});await page.waitForFunction(()=>{const s=document.querySelector('#scratchWorkspaceV259 .scratch-tabs-scroll-v259'),w=document.querySelector('#scratchWorkspaceV259');return w?.dataset.tabOverflowUxV2518==='1'&&s.scrollWidth>s.clientWidth;});const before=await page.locator('#scratchWorkspaceV259 .scratch-tabs-scroll-v259').evaluate(n=>n.scrollLeft);await page.locator('#scratchWorkspaceV259 .scratch-tab-scroll-v2518.next').click();await page.waitForTimeout(500);const after=await page.locator('#scratchWorkspaceV259 .scratch-tabs-scroll-v259').evaluate(n=>n.scrollLeft);ok(after>before,'overflow control did not scroll');
          await page.locator('#scratchWorkspaceV259 [data-scratch-exit]').click();await page.waitForFunction(()=>!document.querySelector('#scratchWorkspaceV259'));await page.waitForSelector('#scratchLaunchV259',{timeout:10000});ok(await page.locator('#scratchLaunchV259').count()===1,'library return lost');console.log('P02_R52_SCRATCH_SPECIALIZED_BROWSER=PASS');await browser.close();
          JS
          RUN_ROOT="$RUNNER_TEMP/p02-r52v3";BASE_URL="http://127.0.0.1:$PORT" PASSWORD="$(cat "$RUN_ROOT/password")" node r52-proof.mjs;rm r52-proof.mjs

      - name: Final prewrite gate and develop write
        id: write
        working-directory: product
        shell: bash
        env:
          VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_REF"
          bash scripts/verify-repository.sh
          for t in tests/unit/p02_*.mjs tests/unit/v2523_unified_content_workspace_contract.mjs;do node "$t" >/dev/null;done
          git diff --check
          git config user.name VictorForge;git config user.email llhzx2018@gmail.com;git add -A;git commit -m 'refactor(P02): converge scratch runtime ownership';NEW_SHA="$(git rev-parse HEAD)"
          git remote set-url origin "https://x-access-token:${VF_RELEASE_WRITE_TOKEN}@github.com/llhzx2018/vf-library.git";git fetch origin develop --depth=1;test "$(git rev-parse origin/develop)" = "$BASE_REF";git push origin HEAD:refs/heads/develop;git remote set-url origin https://github.com/llhzx2018/vf-library.git
          echo "sha=$NEW_SHA" >> "$GITHUB_OUTPUT";echo "P02_R52_NEW_SHA=$NEW_SHA"

      - name: Stop prewrite site
        if: always()
        shell: bash
        run: |
          R="$RUNNER_TEMP/p02-r52v3";test ! -f "$R/php.pid"||kill "$(cat "$R/php.pid")" 2>/dev/null||true

      - name: Checkout exact postwrite SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: ${{ steps.write.outputs.sha }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: post

      - name: Exact-SHA static closure
        working-directory: post
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.write.outputs.sha }}";cp SOURCE_MANIFEST.json "$RUNNER_TEMP/post.json";cp SOURCE_MANIFEST.txt "$RUNNER_TEMP/post.txt";bash scripts/verify-repository.sh
          for t in tests/unit/p02_*.mjs tests/unit/v2523_unified_content_workspace_contract.mjs;do node "$t";done
          python3 scripts/generate-source-manifest.py;cmp -s SOURCE_MANIFEST.json "$RUNNER_TEMP/post.json";cmp -s SOURCE_MANIFEST.txt "$RUNNER_TEMP/post.txt";python3 scripts/verify-source-manifest.py;git diff --exit-code
          echo P02_R52_EXACT_SHA_STATIC=PASS

      - name: Boot exact-SHA site
        working-directory: post
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0 >/dev/null
          R="$RUNNER_TEMP/p02-r52post";SITE="$R/site";mkdir -p "$R";bash scripts/build-deploy-tree.sh "$SITE";php -d display_errors=0 -S "127.0.0.1:$POST_PORT" -t "$SITE" >"$R/php.log" 2>&1 & echo $! > "$R/php.pid";BASE="http://127.0.0.1:$POST_PORT";for _ in $(seq 1 80);do curl -fsS "$BASE/setup.php" >/dev/null 2>&1&&break;sleep .25;done;PW="VF-R52POST-${GITHUB_RUN_ID}!";printf '%s' "$PW" > "$R/password";curl -fsS -c "$R/cookie" "$BASE/setup.php" > "$R/setup.html";CSRF="$(python3 - "$R/setup.html" <<'PY'
          import html,re,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf" value="([^"]+)"',s);assert m;print(html.unescape(m.group(1)))
          PY
          )";test "$(curl -sS -o /dev/null -w '%{http_code}' -b "$R/cookie" -c "$R/cookie" -H "Origin: $BASE" --data-urlencode "setup_csrf=$CSRF" --data-urlencode "password=$PW" --data-urlencode "password_confirm=$PW" "$BASE/setup.php")" = 303

      - name: Exact-SHA standard Chromium
        working-directory: post
        shell: bash
        run: |
          R="$RUNNER_TEMP/p02-r52post";VF_UX_E2E_BASE_URL="http://127.0.0.1:$POST_PORT" VF_UX_E2E_PASSWORD="$(cat "$R/password")" VF_UX_E2E_VERSION="$EXPECTED_VERSION" node tests/e2e/p02_ux_task_flow.mjs

      - name: Exact-SHA Scratch Chromium
        working-directory: post
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > r52-post-proof.mjs <<'JS'
          import { chromium } from 'playwright';const browser=await chromium.launch({headless:true});const page=await browser.newPage({viewport:{width:390,height:844}});const base=process.env.BASE_URL,password=process.env.PASSWORD,ok=(v,m)=>{if(!v)throw new Error(m)};await page.goto(base+'/',{waitUntil:'networkidle'});if(await page.locator('[data-open-login]').count()){await page.locator('[data-open-login]').click();await page.locator('#loginForm input[name="password"]').fill(password);await page.locator('#loginSubmit').click();await page.waitForFunction(async()=>Boolean((await(await fetch('/api.php?action=session')).json())?.site?.auth));}await page.waitForSelector('#scratchLaunchV259',{timeout:10000});const load=await page.evaluate(()=>({s:[...document.scripts].filter(x=>x.src.includes('/assets/scratch-tabs.js')).map(x=>x.dataset.scratchV259||''),r:performance.getEntriesByType('resource').filter(x=>x.name.includes('/assets/scratch-tabs.js')).length}));ok(load.s.length===1&&load.s[0]===''&&load.r===1,'post static scratch load invalid');await page.locator('#scratchLaunchV259').click();await page.waitForSelector('#scratchWorkspaceV259');await page.evaluate(()=>{const s=document.querySelector('#scratchWorkspaceV259 .scratch-tabs-scroll-v259'),tabs=document.querySelector('#scratchWorkspaceV259 [data-scratch-tabs]');s.style.width='220px';s.style.maxWidth='220px';const seed=tabs.querySelector('.scratch-tab-v259')||document.createElement('button');for(let i=0;i<18;i++){const c=seed.cloneNode(true);c.className='scratch-tab-v259'+(i===17?' active':'');c.dataset.scratchTab=String(9900+i);c.textContent='post overflow '+i;tabs.appendChild(c);}});await page.waitForSelector('#scratchWorkspaceV259 .scratch-tab-scroll-v2518.next',{timeout:10000});await page.waitForFunction(()=>{const s=document.querySelector('#scratchWorkspaceV259 .scratch-tabs-scroll-v259'),w=document.querySelector('#scratchWorkspaceV259');return w?.dataset.tabOverflowUxV2518==='1'&&s.scrollWidth>s.clientWidth;});const before=await page.locator('#scratchWorkspaceV259 .scratch-tabs-scroll-v259').evaluate(n=>n.scrollLeft);await page.locator('#scratchWorkspaceV259 .scratch-tab-scroll-v2518.next').click();await page.waitForTimeout(500);const after=await page.locator('#scratchWorkspaceV259 .scratch-tabs-scroll-v259').evaluate(n=>n.scrollLeft);ok(after>before,'post overflow control failed');await page.locator('#scratchWorkspaceV259 [data-scratch-exit]').click();await page.waitForFunction(()=>!document.querySelector('#scratchWorkspaceV259'));await page.waitForSelector('#scratchLaunchV259');console.log('P02_R52_EXACT_SHA_SCRATCH=PASS');await browser.close();
          JS
          R="$RUNNER_TEMP/p02-r52post";BASE_URL="http://127.0.0.1:$POST_PORT" PASSWORD="$(cat "$R/password")" node r52-post-proof.mjs;rm r52-post-proof.mjs;git diff --exit-code
          echo P02_R52_EXACT_SHA_READONLY_CLOSURE=PASS

      - name: Boundaries
        if: always()
        shell: bash
        run: |
          R="$RUNNER_TEMP/p02-r52post";test ! -f "$R/php.pid"||kill "$(cat "$R/php.pid")" 2>/dev/null||true
          echo PRIVATE_SOURCE_PERSISTED=NO;echo MAIN_WRITE=NO;echo RELEASE_WRITE=NO;echo TAG_WRITE=NO;echo UPDATE_CHANNEL_WRITE=NO;echo PRODUCTION_WRITE=NO
