name: P03 V1.35.3 Release Token Capability
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p03-v1353-release-token-capability.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      T: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Check vf-forge token capability without exposing secret
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$T"
          R=$(curl -fsS -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $T" -H 'X-GitHub-Api-Version: 2022-11-28' https://api.github.com/repos/llhzx2018/vf-forge)
          python3 -c 'import json,sys; d=json.load(sys.stdin); p=d.get("permissions") or {}; print("VF_FORGE_TOKEN_PULL="+str(bool(p.get("pull"))).upper()); print("VF_FORGE_TOKEN_PUSH="+str(bool(p.get("push"))).upper()); print("VF_FORGE_TOKEN_ADMIN="+str(bool(p.get("admin"))).upper())' <<<"$R"
