name: P06 V0.1.15 Human UI Exact Source Gate R2

on:
  push:
    paths:
      - '.github/workflows/p06-v0115-human-ui-exact-source-gate-r2-20260828.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact P06 candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-press
          ref: 561e59a82f035e2622c4567710bec06a1c50dab3
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: p06

      - name: Prepare PHP runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y php-cli php-sqlite3 php-mbstring php-zip php-curl composer sqlite3 >/dev/null
          php -m | grep -Fxq PDO
          php -m | grep -Fxq pdo_sqlite
          php -m | grep -Fxq sqlite3
          php -m | grep -Fxq mbstring
          php -m | grep -Fxq zip
          php -m | grep -Fxq curl

      - name: Execute formal exact-source contract with isolated HTTP port
        shell: bash
        run: |
          set -Eeuo pipefail
          cp scripts/p06-v0115-exact-gate.sh "$RUNNER_TEMP/p06-v0115-exact-gate-r2.sh"
          python3 - "$RUNNER_TEMP/p06-v0115-exact-gate-r2.sh" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          s=p.read_text()
          old='PORT=19059\n'
          new='PORT="$(python3 -c \'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()\')"\n'
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY
          bash "$RUNNER_TEMP/p06-v0115-exact-gate-r2.sh" p06
