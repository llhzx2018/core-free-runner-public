name: P01 V2.31.0 Candidate Changelog Bind
on:
  push:
    branches: [task/p01-v2310-final-candidate-gate-20260829]
    paths: [.github/workflows/p01-v2310-changelog-bind-20260829.yml]
permissions:
  contents: read
jobs:
  bind:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: release/p01-v2.31.0-candidate-20260829
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Exact docs-only changelog prepend
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          test "$(git rev-parse HEAD)" = 1e9fa6a68755b2c840dde391bbeff098e46e9c6c
          python3 - <<'PY'
          from pathlib import Path
          p=Path('CHANGELOG.md')
          s=p.read_text()
          assert s.startswith('## V2.29.0 · Functional + Resource Domain Rebaseline Candidate · 2026-08-29')
          assert '## V2.31.0 · Candidate / Not Released · 2026-08-29' not in s
          prefix='''## V2.31.0 · Candidate / Not Released · 2026-08-29

- 在 V2.30 五域 IA 基线上收口日常添加体验：导航 / 频道 / 影视 / 专题只显示当前域有意义字段；具体域 Add 继承当前域，All Resources 继续保留跨域添加。
- `workspace-create.php` / `workspace-save.php` 增加服务端域字段归一化，防止 UI 切换后把无关字段残留进其他资源域；Schema 继续为 `2026082901`，无 Migration。
- “私人”恢复为正常受保护状态的 VF 青色语义，不改变 Public / Private 判定、继承、匿名隔离或保存合同。
- 添加动作按资源域命名：全部资源=`添加资源`、导航=`添加网址`、频道=`添加频道`、影视=`添加影视`、专题=`添加专题`。
- Product PR #55 / #56 / #57 已合并到 develop；Contextual Form `33238841830`、Private Semantic `33239081728`、Contextual Action Copy `33239249456` PASS。
- Candidate Product Exact Source=`d541b7bb18d40705ec03f951fad3ed661aa11991` / Tree=`7e5eaed15187f48686ae3eb67ff91a63085ca003`；root `VERSION` / `src/VERSION.txt` / runtime `VF_VERSION` 均为 `2.31.0`。
- Final Candidate Readiness Gate V2 `33239989166` PASS；Artifact=`9711050672` / Digest=`sha256:be176b3f5f1cb6e34743da5964687c9fc32bae9d46694f881c10c36a83ba31c2`。
- 当前仅 `READY_FOR_L3_RELEASE_GATE`；未创建 `v2.31.0` Tag、未发布 GitHub Release / core-updates 2.31.0、未写 Owner Production。

## V2.30.0 · Formal Release · 2026-08-29

- 完成固定五域 `首页 / 导航 / 频道 / 影视 / 专题` 的 UX / IA 重构；Sidebar 只承担当前域 Scope / Taxonomy，Mobile 使用顶部五域导航 + 搜索/添加命令行。
- 导航恢复完整层级分类、0-count Category、Mobile searchable picker 与分类/隐私继承；频道、影视、专题使用各自内容形态。
- Schema 保持 `2026082901`；URL Identity、Atomic Add/Edit、Hosted HTML sandbox、Public/Private、Backup/Recovery/Atomic Update 边界不变。
- Formal Source / main=`40b2d5239c557ab6c7b9aaaa092acffa9fb926f9`；Tag=`v2.30.0`；GitHub Release ID=`378891859`；core-updates main=`53fc02ebd99007793877a281e53238a591e7e485`。
- Owner Production 已确认 V2.30.0；后续 V2.31 工作不自动修改 Owner Production。

'''
          p.write_text(prefix+s)
          PY
          test "$(git diff --name-only)" = CHANGELOG.md
          grep -F '## V2.31.0 · Candidate / Not Released · 2026-08-29' CHANGELOG.md >/dev/null
          grep -F '## V2.30.0 · Formal Release · 2026-08-29' CHANGELOG.md >/dev/null
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add CHANGELOG.md
          git commit -m 'docs(P01): record V2.30 release and V2.31 candidate'
          git push origin HEAD:release/p01-v2.31.0-candidate-20260829
