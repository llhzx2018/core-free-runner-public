name: P08 PR22 any-HTTPS-host clean FULL integrated one-off
on:
  push:
    branches: [test/p08-pr22-any-host-full-20261113]
permissions:
  contents: read
jobs:
  first-install:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.ref == 'refs/heads/test/p08-pr22-any-host-full-20261113'
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    env:
      P08_ISOLATED_INSTALL_TEST: YES
      P08_R71_REAL_ZIP_TEST: YES
      P08_R73_ISOLATED_BROWSER: YES
      P08_R77_BROWSER: YES
      P08_R79_INSTALL_BROWSER: YES
      P08_R78_DIAG: NO
      PRODUCT_REPO: llhzx2018/vf-adops
      TARGET_SHA: f4393f0d77a085ece7b21a348c5f6203a5187387
      BRIDGE_SHA: 956c4d2144915e392d745f6ddbbad3c7e1c21442
      TEST_TAG: p08-pr22-0.1.1-any-host-test-full-20261113
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Verify registered private checkout and private destination
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = llhzx2018/core-free-runner-public
          test "$GITHUB_REF_NAME" = test/p08-pr22-any-host-full-20261113
          test -n "$GH_TOKEN" || { echo 'P08_PRIVATE_TEST_DELIVERY_TOKEN_MISSING'; exit 78; }
          test "$(gh api "repos/$PRODUCT_REPO" --jq '.private')" = true || exit 78
          test "$(gh api "repos/$PRODUCT_REPO/git/ref/heads/feature/p08-r23-verified-backup-first-upgrade-arm" --jq '.object.sha')" = "$TARGET_SHA" || exit 78
          echo 'P08_NONPRODUCTION_AND_LEGACY_P08_PROTECTED=YES'
      - name: Exact private PR22 checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: f4393f0d77a085ece7b21a348c5f6203a5187387
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: source
          persist-credentials: false
      - name: PHP 8.4 real native runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: sqlite3,pdo_sqlite,pdo_mysql,zip,curl,sodium,mbstring,dom,xml,intl,bcmath,fileinfo
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source and security negative tests for arbitrary HTTPS test host
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(cat VERSION)" = 0.1.1
          php -l src/Installation/SetupGuard.php
          php -l src/Installation/OwnerWebInstaller.php
          php -l public/setup.php
          php -l tests/test_setup_guard.php
          php -l tests/test_install_sqlite_e2e.php
          bash -n tests/compatibility/run_r79_first_install_browser.sh
          php tests/test_setup_guard.php
          php tests/test_setup_experience_contract.php
          python3 scripts/check_stack_contract.py --phase foundation
          python3 scripts/check_bridge_runtime_parity.py
          composer validate --strict --no-check-publish
          echo 'P08_TEST_DOMAIN_VALIDATION_ORIGIN_REINSTALL_NEGATIVES=PASS'
      - name: Locked Composer and Vite source-bound FULL build and byte audit
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail
          python3 scripts/build_owner_atomic_pair.py --repo "$PWD" --target-sha "$TARGET_SHA" --output-dir "$RUNNER_TEMP/p08-r71-real-artifacts"
          python3 scripts/verify_owner_atomic_pair.py "$RUNNER_TEMP/p08-r71-real-artifacts" "$BRIDGE_SHA" "$TARGET_SHA"
          unzip -tq "$RUNNER_TEMP/p08-r71-real-artifacts/VF_AdOps_V0.1.1_FULL.zip" > /dev/null
          echo 'P08_ANY_HOST_EXACT_SOURCE_FULL_ZIP_BYTE_AUDIT=PASS'
      - name: Real SQLite first install on explicit lander test domain
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -m 0700 "$RUNNER_TEMP/p08-anyhost-sqlite"
          unzip -q "$RUNNER_TEMP/p08-r71-real-artifacts/VF_AdOps_V0.1.1_FULL.zip" -d "$RUNNER_TEMP/p08-anyhost-sqlite"
          mkdir "$RUNNER_TEMP/p08-anyhost-sqlite/tests"
          cp source/tests/test_install_sqlite_e2e.php "$RUNNER_TEMP/p08-anyhost-sqlite/tests/"
          cd "$RUNNER_TEMP/p08-anyhost-sqlite"
          php tests/test_install_sqlite_e2e.php
          echo 'P08_REAL_SQLITE_ANYHOST_FIRST_INSTALL_AND_APP_URL=PASS'
      - name: Chromium actual HTTPS Nginx alternate-host first install and login
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nginx > /dev/null
          cd source
          npm ci --no-audit --no-fund > /dev/null
          npx playwright install --with-deps chromium > /dev/null
          cd "$GITHUB_WORKSPACE"
          bash source/tests/compatibility/run_r79_first_install_browser.sh
          echo 'P08_NGINX_HTTPS_CHROMIUM_LANDER_ALTERNATE_HOST_INSTALL_LOGIN=PASS'
      - name: Publish ONE private test FULL and verify remote SHA (no official Release)
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api "repos/$PRODUCT_REPO" --jq '.private')" = true
          test "$(gh api "repos/$PRODUCT_REPO/git/ref/heads/feature/p08-r23-verified-backup-first-upgrade-arm" --jq '.object.sha')" = "$TARGET_SHA"
          if gh api "repos/$PRODUCT_REPO/git/ref/tags/$TEST_TAG" > /dev/null 2>&1; then
            echo 'P08_TEST_TAG_ALREADY_EXISTS_NO_OVERWRITE'; exit 81
          fi
          mkdir -m 0700 "$RUNNER_TEMP/p08-anyhost-test-delivery"
          cp "$RUNNER_TEMP/p08-r71-real-artifacts/VF_AdOps_V0.1.1_FULL.zip" \
            "$RUNNER_TEMP/p08-anyhost-test-delivery/VF_AdOps_0.1.1_PR22_ANY_HOST_TEST_FULL.zip"
          (
            cd "$RUNNER_TEMP/p08-anyhost-test-delivery"
            sha256sum VF_AdOps_0.1.1_PR22_ANY_HOST_TEST_FULL.zip > SHA256SUMS.txt
          )
          cat > "$RUNNER_TEMP/p08-anyhost-test-delivery/README_TEST.txt" <<EOF
          VF AdOps 0.1.1 / PR22 alternate-domain clean FULL test
          Exact source: $TARGET_SHA
          Intended use: clean disposable HTTPS test site (e.g. lander.kewaro.com)
          Fix: first installation binds APP_URL, install state and status text to current HTTPS Host.
          No hardcoded adops.kewaro.com install gate.
          Guard still rejects off-origin POST, insecure HTTP, invalid Host, dirty database,
          existing .env, installed and partial installation.
          Requires PHP >= 8.4.1, CloudPanel document root public/, fresh empty DB.
          This is non-production, unsigned, first-install FULL only.
          Not an official Atomic/UPDATE package or Production overwrite.
          Never delete existing .env or databases to bypass an installed-state lock.
          EOF
          gh release create "$TEST_TAG" -R "$PRODUCT_REPO" --target "$TARGET_SHA" \
            --prerelease --title 'VF AdOps 0.1.1 PR22 - alternate HTTPS domain TEST FULL (not official)' \
            --notes 'One-time nonproduction Clean FULL test after fixing hardcoded setup domain. Source-bound native SQLite + real HTTPS Chromium alternate-host installer tests. No official Atomic signer/channel and no production modification.' \
            "$RUNNER_TEMP/p08-anyhost-test-delivery/VF_AdOps_0.1.1_PR22_ANY_HOST_TEST_FULL.zip" \
            "$RUNNER_TEMP/p08-anyhost-test-delivery/SHA256SUMS.txt" \
            "$RUNNER_TEMP/p08-anyhost-test-delivery/README_TEST.txt"
          test "$(gh api "repos/$PRODUCT_REPO/git/ref/tags/$TEST_TAG" --jq '.object.sha')" = "$TARGET_SHA"
          test "$(gh api "repos/$PRODUCT_REPO/releases/tags/$TEST_TAG" --jq '.prerelease')" = true
          test "$(gh api "repos/$PRODUCT_REPO/releases/tags/$TEST_TAG" --jq '.assets | length')" -eq 3
          mkdir -m 0700 "$RUNNER_TEMP/p08-anyhost-test-readback"
          gh release download "$TEST_TAG" -R "$PRODUCT_REPO" --dir "$RUNNER_TEMP/p08-anyhost-test-readback"
          (cd "$RUNNER_TEMP/p08-anyhost-test-readback"; sha256sum -c SHA256SUMS.txt)
          cmp "$RUNNER_TEMP/p08-anyhost-test-delivery/VF_AdOps_0.1.1_PR22_ANY_HOST_TEST_FULL.zip" \
            "$RUNNER_TEMP/p08-anyhost-test-readback/VF_AdOps_0.1.1_PR22_ANY_HOST_TEST_FULL.zip"
          echo 'P08_PRIVATE_ANYHOST_TEST_FULL_REMOTE_SHA256=PASS'
      - name: Cleanup all transient private code and installer databases
        if: always()
        shell: bash
        run: |
          rm -rf source "$RUNNER_TEMP/p08-r71-real-artifacts" \
            "$RUNNER_TEMP/p08-anyhost-sqlite" "$RUNNER_TEMP/p08-r79-first-install" \
            "$RUNNER_TEMP/p08-r79-install-browser" \
            "$RUNNER_TEMP/p08-anyhost-test-delivery" "$RUNNER_TEMP/p08-anyhost-test-readback"
          echo 'P08_PUBLIC_RUNNER_PRIVATE_CODE_TEST_DB_ARTIFACT_PERSISTENCE=NO'
