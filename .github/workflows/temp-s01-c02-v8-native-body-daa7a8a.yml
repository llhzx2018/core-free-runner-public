name: S01-C02 V8 native body source-render Candidate
on:
  push:
    branches: ['task/s01-c02-v8-native-body-daa7a8a']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_REPO: 'llhzx2018/vf-tools-ops'
      TARGET_VERSION: '1.21.969'
      TARGET_SHA: 'daa7a8a85b89ac106a981000394de9199c31245c'
      BASE_SHA: '5f15f8de9fc86a5cdb91c3cdee28d65c31c284db'
    steps:
      - name: Checkout public control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Transient exact-source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - name: Exact identity and frozen scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n' < target/VERSION)" = "$TARGET_VERSION"
          mkdir -p /tmp/v8-proof
          python3 - <<'PY'
          import json,os,subprocess,pathlib
          allowed={'assets/css/v13/seo/keywords.css','assets/css/v13/system/plugins.css','assets/js/v13/system/plugins.js','includes/admin-v13/views/seo_keywords.php','includes/admin-v13/views/system_plugins.php','tests/s01-c02-v8-reference-body-contract.php','tests/s01-c02-v8-render-fixture.php','tests/s01-c02-v8-browser-proof.js'}
          actual=set(subprocess.check_output(['git','-C','target','diff','--name-only',os.environ['BASE_SHA'],os.environ['TARGET_SHA']]).decode().splitlines())
          assert actual==allowed, 'candidate changed-file set differs from frozen scope'
          tree=subprocess.check_output(['git','-C','target','rev-parse','HEAD^{tree}']).decode().strip()
          receipt={'repository':os.environ['TARGET_REPO'],'source_sha':os.environ['TARGET_SHA'],'base_sha':os.environ['BASE_SHA'],'source_tree':tree,'version':os.environ['TARGET_VERSION'],'changed_files':sorted(actual),'frozen_shell_header_menu':'UNCHANGED','owner_product_pass':False,'wordpress_integration':'NOT_PROVEN'}
          pathlib.Path('/tmp/v8-proof/identity.json').write_text(json.dumps(receipt,indent=2))
          print(json.dumps(receipt))
          PY
      - name: Syntax and focused plus frozen contracts
        shell: bash
        run: |
          set -euo pipefail
          cd target
          php -n -l includes/admin-v13/views/system_plugins.php
          php -n -l includes/admin-v13/views/seo_keywords.php
          php -n -l tests/s01-c02-v8-render-fixture.php
          node --check assets/js/v13/system/plugins.js
          node --check assets/js/admin-s01-page-frame-r18.js
          node --check tests/s01-c02-v8-browser-proof.js
          php tests/s01-c02-v8-reference-body-contract.php
          php tests/s01-c02-121934-shell-header-visual-lock-r45-contract.php
          php tests/s01-c02-prod-realuse-r18-unified-page-frame-contract.php
          php tests/s01-c02-prod-realuse-r20-production-screenshot-closure-contract.php
          php tests/s01-c02-page-body-system-v2-full-surface-contract.php
      - name: Install transient browser and parser drivers
        run: |
          set -euo pipefail
          npm install --prefix /tmp/v8-driver playwright@1.62.1 --no-audit --no-fund
          python3 -m venv /tmp/v8-parser
          /tmp/v8-parser/bin/python -m pip install html5lib
          command -v google-chrome
          mkdir -p "$HOME/.local/share/fonts"
          curl -fsSL 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC%5Bwght%5D.ttf' -o "$HOME/.local/share/fonts/NotoSansSC.ttf"
          fc-cache -f
      - name: Parse actual PHP-rendered HTML structure
        run: |
          set -euo pipefail
          /tmp/v8-parser/bin/python - <<'PY'
          import subprocess,json,pathlib,html5lib
          cases=['system','system-empty','system-attention','map','map-empty','research','legacy','legacy-loaded'];checks=[]
          for case in cases:
              html=subprocess.check_output(['php','-n','target/tests/s01-c02-v8-render-fixture.php',case]).decode();parser=html5lib.HTMLParser();parser.parse(html);checks.append({'fixture':case,'errors':parser.errors})
          report={'kind':'SOURCE_RENDER_FIXTURE','pass':all(not c['errors'] for c in checks),'checks':checks}
          pathlib.Path('/tmp/v8-proof/html-structure.json').write_text(json.dumps(report,indent=2));print(json.dumps(report));assert report['pass']
          PY
      - name: Full route cascade and responsive interaction proof
        env:
          NODE_PATH: /tmp/v8-driver/node_modules
          V8_CHROME: /usr/bin/google-chrome
          V8_PROOF_DIR: /tmp/v8-proof
        run: node target/tests/s01-c02-v8-browser-proof.js
      - name: Upload public-safe synthetic evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-v8-source-render-proof
          path: /tmp/v8-proof/
          if-no-files-found: warn
          retention-days: 14
      - name: Remove transient private checkout
        if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/target"
