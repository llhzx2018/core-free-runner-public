name: P02 V2.5.20 Formal Verify And Publish

on:
  pull_request:
    branches: [main]
    paths: ['triggers/p02-v2520-formal-release.txt']

permissions:
  contents: read

jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Require registered capabilities
        env:
          RELEASE_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
        run: test -n "$RELEASE_TOKEN"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: 1bcb964478adc270673bcfb21d6d1abee5411bdd
          token: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
          path: product
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize sealed formal pipeline for V2.5.20
        env:
          PRODUCT_REF: 1bcb964478adc270673bcfb21d6d1abee5411bdd
          RELEASE_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
        run: |
          set -Eeuo pipefail
          git fetch origin task/p02-v2511-formal-release
          git show FETCH_HEAD:scripts/p02-v2510-formal-release.sh > "$RUNNER_TEMP/p02-v2520-formal.sh"
          python3 - "$RUNNER_TEMP/p02-v2520-formal.sh" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]);s=p.read_text(encoding='utf-8')
          s=s.replace('2.5.10','2.5.20')
          s=s.replace('2.5.9','2.5.19')
          s=s.replace('32225789953','32286147306')
          s=s.replace('test "$(jq -r .runtime_source_file_count SOURCE_MANIFEST.json)" = 72','test "$(jq -r .runtime_source_file_count SOURCE_MANIFEST.json)" = 75')
          marker="notes=out/f'VF_Library_V{VER}_RELEASE_NOTES.md'; notes.write_text(f'''";end="''')\n arts=[sz,fz,uz,az,rf,notes]"
          if marker in s and end in s:
              i=s.index(marker);j=s.index(end,i)
              notes="""notes=out/f'VF_Library_V{VER}_RELEASE_NOTES.md'; notes.write_text(f'''# VF Library V{VER}\n\nV2.5.20 retires the redundant formal Draft user concept while preserving existing edit safety and legacy data compatibility.\n\n- Primary Draft navigation is retired.\n- Generic Editor and Article Workspace no longer expose “保存为草稿”.\n- Existing browser-local edit recovery remains the safety mechanism and its core implementation is byte-identical to authenticated Production V2.5.19.\n- The setting is clarified as “编辑恢复保护”; recovery points are local safety data, not Library content.\n- Existing historical status=draft rows are not migrated or deleted; when such rows exist, an explicit Legacy Compatibility entry remains available from settings.\n- Old empty draft-view browser state safely falls back to active/all.\n- Candidate Chromium Run 32286147306 PASS: Draft retirement, Local Edit Recovery semantics, Legacy Draft compatibility and 390px no horizontal overflow.\n- Runtime Source Manifest is 75 / 75.\n- Direct Atomic source is authenticated Production {SRCVER}; Schema remains {SCHEMA}; no migration.\n''')\n arts=[sz,fz,uz,az,rf,notes]"""
              s=s[:i]+notes+s[j+len(end):]
          p.write_text(s,encoding='utf-8')
          PY
          cd product
          bash "$RUNNER_TEMP/p02-v2520-formal.sh"
