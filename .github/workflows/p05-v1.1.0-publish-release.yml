name: P05 V1.1.0 Publish Release

on:
  push:
    branches:
      - verify/p05-v1.1.0-release-source-20260830
    paths:
      - '.github/workflows/p05-v1.1.0-publish-release.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_REPO: llhzx2018/vf-seo
      P05_SOURCE_SHA: e3455704cf5fc7254b86fbe84cc3941f585a15ac
      P05_EXPECTED_TREE: 46b4fca0b04ecae1653ca9d75228c3b949c5267c
      RELEASE_TAG: v1.1.0
      RELEASE_ASSET: VF_SEO_V1.1.0_FULL.zip
      RECEIPT_ASSET: VF_SEO_V1.1.0_RELEASE_RECEIPT.txt
      EXPECTED_SHA256: 86d889030ba4029f5b4d7cc4b2de352233d2c81b569765b58b36573f0941c3d6
      EXPECTED_BYTES: '190082'
      PRIVATE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Verify release write token
        shell: bash
        run: test -n "$PRIVATE_WRITE_TOKEN" || { echo 'VF_RELEASE_WRITE_TOKEN_MISSING'; exit 78; }
      - name: Download exact main release artifact R4
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf payload
          mkdir payload
          gh run download 33267042400 --repo llhzx2018/core-free-runner-public --name P05_V1.1.0_MAIN_RELEASE_R4 --dir payload
          test -f "payload/$RELEASE_ASSET"
          test -f "payload/$RECEIPT_ASSET"
          test "$(sha256sum "payload/$RELEASE_ASSET" | awk '{print $1}')" = "$EXPECTED_SHA256"
          test "$(stat -c %s "payload/$RELEASE_ASSET")" = "$EXPECTED_BYTES"
          grep -F "P05_V110_MAIN_RELEASE_MACHINE=PASS" "payload/$RECEIPT_ASSET"
          grep -F "P05_EXACT_MAIN=$P05_SOURCE_SHA" "payload/$RECEIPT_ASSET"
          grep -F "P05_TREE=$P05_EXPECTED_TREE" "payload/$RECEIPT_ASSET"
          grep -F "P05_FORMAL_FULL_SHA256=$EXPECTED_SHA256" "payload/$RECEIPT_ASSET"
          grep -F "P05_PRODUCTION=NOT_DEPLOYED" "payload/$RECEIPT_ASSET"
      - name: Verify target main and publish tag/release
        env:
          GH_TOKEN: ${{ env.PRIVATE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api "repos/$TARGET_REPO/branches/main" --jq '.commit.sha')"
          test "$MAIN_SHA" = "$P05_SOURCE_SHA"
          if gh api "repos/$TARGET_REPO/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'TAG_ALREADY_EXISTS'
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            echo 'RELEASE_ALREADY_EXISTS'
            exit 1
          fi
          gh api "repos/$TARGET_REPO/git/refs" -X POST -f ref="refs/tags/$RELEASE_TAG" -f sha="$P05_SOURCE_SHA" >/tmp/p05-tag.json
          cat > /tmp/p05-release-notes.md <<EOF
          # P05 · VF SEO · v1.1.0

          PHP-first Web Runtime formal release.

          - Exact main source: \`$P05_SOURCE_SHA\`
          - Exact tree: \`$P05_EXPECTED_TREE\`
          - Main Exact Source Machine: Run \`33267042400\` / Job \`99138826274\` = PASS
          - Web Runtime: CloudPanel + PHP 8.2+ + PDO_SQLite + SQLite
          - Node: optional worker / advanced runtime only
          - Distribution: \`FULL_ONLY\`
          - from_versions: \`[]\`
          - Production: \`NOT_DEPLOYED\`
          - Asset: \`$RELEASE_ASSET\`
          - Asset bytes: \`$EXPECTED_BYTES\`
          - Asset SHA-256: \`$EXPECTED_SHA256\`

          Production deployment remains a separate owner-authorized gate.
          EOF
          gh release create "$RELEASE_TAG" \
            "payload/$RELEASE_ASSET" \
            "payload/$RECEIPT_ASSET" \
            --repo "$TARGET_REPO" \
            --target "$P05_SOURCE_SHA" \
            --title "P05 · VF SEO v1.1.0 · PHP-first Runtime" \
            --notes-file /tmp/p05-release-notes.md \
            --latest
      - name: Final release readback
        env:
          GH_TOKEN: ${{ env.PRIVATE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG_SHA="$(gh api "repos/$TARGET_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          test "$TAG_SHA" = "$P05_SOURCE_SHA"
          gh release view "$RELEASE_TAG" --repo "$TARGET_REPO" --json tagName,isDraft,isPrerelease,url,assets,targetCommitish > /tmp/p05-release-readback.json
          cat /tmp/p05-release-readback.json
          test "$(jq -r '.tagName' /tmp/p05-release-readback.json)" = "$RELEASE_TAG"
          test "$(jq -r '.isDraft' /tmp/p05-release-readback.json)" = 'false'
          test "$(jq -r '.isPrerelease' /tmp/p05-release-readback.json)" = 'false'
          test "$(jq '.assets | length' /tmp/p05-release-readback.json)" -eq 2
          echo "P05_V1.1.0_RELEASE_PUBLICATION=PASS"
