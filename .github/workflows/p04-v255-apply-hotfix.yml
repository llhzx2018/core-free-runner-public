name: P04 V2.5.5 Apply Hotfix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p04-v255-apply-hotfix.yml'
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: hotfix/p04-v2.5.5-online-handoff-contract
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p04
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-free-runner-public
          ref: main
          path: runner
      - name: Apply exact hotfix patch
        run: |
          set -Eeuo pipefail
          python3 runner/scripts/p04-v255-apply-hotfix-v2.py p04
          cd p04
          python3 -m py_compile scripts/build-release-tree.py scripts/build-v251-maintenance-release.py scripts/build-v255-update-release.py scripts/validate-online-atomic-package.py
          php -l src/app/Core/Update/UpdateContract.php >/dev/null
          test "$(cat VERSION)" = '2.5.5'
          grep -Fq 'OnlineUpdateHandoff::authorize' scripts/build-v251-maintenance-release.py
          grep -Fq 'OnlineUpdateHandoff::recordRepairResult' scripts/build-v251-maintenance-release.py
          git diff --check
      - name: Commit and push hotfix source
        run: |
          set -Eeuo pipefail
          cd p04
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add VERSION scripts/build-release-tree.py scripts/build-v251-maintenance-release.py scripts/build-v255-update-release.py scripts/validate-online-atomic-package.py
          git commit -m 'fix(P04): make Atomic builder honor online handoff contract'
          git push origin HEAD:hotfix/p04-v2.5.5-online-handoff-contract
          echo "HOTFIX_COMMIT=$(git rev-parse HEAD)"
          echo "HOTFIX_TREE=$(git rev-parse HEAD^{tree})"
