name: P08 PR83 exact R26 materializer isolated diagnostic
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p08-pr83-r26-diagnostic.yml
permissions:
  contents: read
jobs:
  r26-origin:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-pr83-r26-exact-failure-20261120'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout ephemeral runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact P08 PR83 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 57ec59e3a19b30e29798feb67b388a4f84dcd6df
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
      - name: PHP84 isolated runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl,openssl,sqlite3,posix,fileinfo
          coverage: none
      - name: Run unchanged R26 test and emit only safe failure code
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -Eeuo pipefail
          set +x
          test "$(id -u)" -ne 0
          test "$(git -C target rev-parse HEAD)" = 57ec59e3a19b30e29798feb67b388a4f84dcd6df
          log="$RUNNER_TEMP/p08-pr83-r26-private.log"
          umask 077
          php target/tests/test_atomic_release_materializer.php >"$log" 2>&1 && rc=0 || rc=$?
          python3 - "$log" "$rc" <<'PY'
          import re,sys
          from pathlib import Path
          ls=Path(sys.argv[1]).read_text(errors='replace').splitlines()
          print('P08_R26_EXACT_SOURCE_TEST_RC='+sys.argv[2])
          for line in ls:
              for marker in re.findall(r'\b(?:R26|R87)_[A-Z0-9_]{4,95}\b',line):
                  print('P08_R26_FAILURE_CODE='+marker)
              if re.match(r'^(?:PHP Fatal error: )?Uncaught [A-Za-z\\]+Exception',line):
                  print('P08_R26_UNCAUGHT_EXCEPTION=YES')
          PY
          test "$(git -C target rev-parse HEAD)" = 57ec59e3a19b30e29798feb67b388a4f84dcd6df
          if [ "$rc" -eq 0 ]; then echo P08_R26_EXACT_SOURCE=PASS; else echo P08_R26_EXACT_SOURCE=FAIL; fi
      - name: Always wipe private source and logs
        if: always()
        shell: bash
        run: |
          rm -rf -- target "$RUNNER_TEMP/p08-pr83-r26-private.log"
          test ! -e target
          test ! -e "$RUNNER_TEMP/p08-pr83-r26-private.log"
          echo P08_R26_EPHEMERAL_CLEANUP=PASS
