name: P02 V2.5.82 Owner UX R1

on:
  push:
    branches:
      - run/p02-v2582-owner-ux-r1-20260922
    paths:
      - '.github/workflows/p02-v2582-owner-ux-r1.yml'

permissions:
  contents: read

jobs:
  ux-r1:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact P02 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: cce5ae72c3ff0b9575fc085499f4bcb63788e590
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product

      - name: Install runtime and Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-zip sqlite3 unzip curl
          cd product
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Focused source and unit gate
        shell: bash
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "cce5ae72c3ff0b9575fc085499f4bcb63788e590"
          python3 scripts/generate-source-manifest.py
          git diff --exit-code -- SOURCE_MANIFEST.json SOURCE_MANIFEST.txt
          mkdir -p "${{ runner.temp }}/p02-v2582-owner-ux"
          cp SOURCE_MANIFEST.json SOURCE_MANIFEST.txt "${{ runner.temp }}/p02-v2582-owner-ux/"
          node --check public/assets/app.js
          node tests/unit/p02_v2582_content_view_persistence.mjs
          node tests/unit/p02_v2582_owner_ux_bug_batch.mjs
          bash scripts/verify-repository.sh
          echo "APP_JS $(stat -c %s public/assets/app.js) $(sha256sum public/assets/app.js | awk '{print $1}')"
          echo "APP_CSS $(stat -c %s public/assets/app.css) $(sha256sum public/assets/app.css | awk '{print $1}')"
          echo "INDEX_PHP $(stat -c %s public/index.php) $(sha256sum public/index.php | awk '{print $1}')"
          echo P02_V2582_OWNER_UX_FOCUSED_SOURCE=PASS

      - name: Real runtime and browser regression
        shell: bash
        working-directory: product
        env:
          TEST_PASSWORD: VF-P02-V2582-${{ github.run_id }}!
          EVIDENCE_DIR: ${{ runner.temp }}/p02-v2582-owner-ux
        run: |
          set -Eeuo pipefail
          bash scripts/maintenance-reverify.sh
          echo P02_V2582_OWNER_UX_BROWSER=PASS

      - name: Upload focused UX evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p02-v2582-owner-ux-r1
          path: ${{ runner.temp }}/p02-v2582-owner-ux
          if-no-files-found: ignore
          retention-days: 7
