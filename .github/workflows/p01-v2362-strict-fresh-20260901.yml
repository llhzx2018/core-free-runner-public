name: P01 V2.36.2 Strict Fresh
on:
  push:
    branches: [release/p01-v2362-candidate-20260901]
    paths: [.github/workflows/p01-v2362-strict-fresh-20260901.yml]
permissions:
  contents: read
  actions: read
jobs:
  strict-fresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      FORMAL_RUN: '33485021418'
      FORMAL_ARTIFACT: p01-v2362-formal-artifacts-33485021418
      FORMAL: 4fd25a5ce4383dc456e755fc2e031a861d6ff655
      FORMAL_TREE: 0f0e5329098ad5a87a4a72dbd368c88d7a44b339
      FORMAL_RUNTIME_TREE: 55bc3143df6ca4e8e66b3e8d3e0f01b3ec343424
      SCHEMA: '2026082901'
      FULL_SHA: 4a2defd88b5e25d8a5a431dfa00a23cea9370d9ea4f0f68255e483b25f2ff90c
      UPDATE_SHA: 1718db148ea91987a8b3dee2474892b3df84b4b93cd8298e2e261153fa99c3ea
      REPAIR_SHA: 70f1221555b2d318081bead944ff1912f6e5ec9b919a2e340fb490614e33e797
      DOWNLOAD: /tmp/p01-v2362-strict-download
      FRESH: /tmp/p01-v2362-strict-fresh
      EVID: /tmp/p01-v2362-strict-evidence
      COOKIE: /tmp/p01-v2362-strict.cookies
      PORT: '18473'
      ADMIN_PASS: V2362StrictFresh
    steps:
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - name: Checkout proven visible auth gate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 948e83dacef37a4ada98f69d7793f5f5ea1c9f0a
          path: auth
      - name: Formal bytes fresh install zero data and seed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf "$DOWNLOAD" "$FRESH" "$EVID" "$COOKIE"; mkdir -p "$DOWNLOAD" "$FRESH" "$EVID"
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$FORMAL_RUN --jq .conclusion)" = success
          gh run download "$FORMAL_RUN" -R llhzx2018/core-free-runner-public -n "$FORMAL_ARTIFACT" -D "$DOWNLOAD"
          FULL=$(find "$DOWNLOAD" -type f -name 'VF-Start-V2.36.2-FULL.zip' -print -quit); test -n "$FULL"; ART_DIR=$(dirname "$FULL")
          (cd "$ART_DIR" && sha256sum -c SHA256SUMS.txt) | tee "$EVID/sha256.txt"
          test "$(sha256sum "$ART_DIR/VF-Start-V2.36.2-FULL.zip"|awk '{print $1}')" = "$FULL_SHA"
          test "$(sha256sum "$ART_DIR/VF_Start_V2.36.2_UPDATE.zip"|awk '{print $1}')" = "$UPDATE_SHA"
          test "$(sha256sum "$ART_DIR/repair-v2.36.2.php"|awk '{print $1}')" = "$REPAIR_SHA"
          jq -e '.status=="FORMAL_ARTIFACT_GATE_PASS" and .formal_source=="4fd25a5ce4383dc456e755fc2e031a861d6ff655" and .formal_tree=="0f0e5329098ad5a87a4a72dbd368c88d7a44b339" and .runtime_tree=="55bc3143df6ca4e8e66b3e8d3e0f01b3ec343424" and .schema=="2026082901" and .migration==null and .added==["assets/auth-controls.js"] and .removed==[] and (.changed|length)==5' "$ART_DIR/P01-V2.36.2-ARTIFACT-GATE.json" >/dev/null
          unzip -q "$FULL" -d "$FRESH"
          test "$(cat "$FRESH/VERSION.txt")" = 2.36.2
          grep -Fx "define('VF_VERSION', '2.36.2');" "$FRESH/app/bootstrap.php" >/dev/null
          grep -F 'data-vf-auth-login' "$FRESH/app/FunctionalWorkspaceShell.php" >/dev/null
          grep -F 'data-vf-auth-logout' "$FRESH/app/FunctionalWorkspaceShell.php" >/dev/null
          find "$FRESH" -type f -name '*.php' -print0 | xargs -0 -n1 php -l >"$EVID/php-syntax.txt"
          find "$FRESH/assets" -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          php -S 127.0.0.1:$PORT -t "$FRESH" >"$EVID/server.log" 2>&1 & echo $! >/tmp/p01-v2362-strict.pid
          for i in $(seq 1 60); do curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:$PORT/setup.php" -o "$EVID/setup.html" && break; sleep .25; done
          CSRF=$(python3 - "$EVID/setup.html" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:$PORT/setup.php" --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=V2362 Strict Fresh' --data-urlencode "admin_password=$ADMIN_PASS" --data-urlencode "admin_password_confirm=$ADMIN_PASS" -o "$EVID/setup-post.html"
          php "$FRESH/cli/verify.php" | tee "$EVID/verify.txt" | grep -Fx VERIFY_PASS=YES
          php "$FRESH/cli/surface-verify.php" | tee "$EVID/surface.txt" | grep -Fx CURRENT_DOMAIN_PASS=YES
          ROOT="$FRESH" php <<'PHP' | tee "$EVID/zero-data.txt"
          <?php require getenv('ROOT').'/app/bootstrap.php';$d=vf_db();foreach(['categories','links','import_batches','backup_records','operation_history'] as $t){$n=(int)$d->query("SELECT COUNT(*) FROM $t")->fetchColumn();echo "$t=$n\n";if($n!==0)exit(10);}if(strtolower((string)$d->query('PRAGMA integrity_check')->fetchColumn())!=='ok')exit(11);if($d->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC))exit(12);echo "P01_V2362_STRICT_ZERO_DATA=PASS\nP01_V2362_STRICT_SQLITE=PASS\n";
          PHP
          ROOT="$FRESH" php <<'PHP' | tee "$EVID/seed.txt"
          <?php
          require getenv('ROOT').'/app/bootstrap.php'; require getenv('ROOT').'/app/SurfaceRepository.php';
          $db=vf_db();$r=new VfRepository($db);$s=new VfSurfaceRepository($db);$cat=$r->createCategory(['name'=>'认证入口门禁','description'=>'','icon'=>'','is_private'=>0,'sort_order'=>0]);
          $save=function($t,$u,$p)use($r,$cat){return (int)$r->saveLink(null,['category_id'=>$cat,'title'=>$t,'url'=>$u,'description'=>'','is_private'=>$p],'manual')['id'];};
          $save('门禁公开导航','https://example.com/public-start',0);$save('门禁私人导航','https://example.com/private-start',1);
          $c1=$save('门禁公开频道','https://www.youtube.com/@public-channel',0);$c2=$save('门禁私人频道','https://www.youtube.com/@private-channel',1);
          $w1=$save('门禁公开电影','https://example.com/public-watch',0);$w2=$save('门禁私人电影','https://example.com/private-watch',1);
          $s->upsertProfile($c1,['surface'=>'channels','resource_kind'=>'频道']);$s->upsertProfile($c2,['surface'=>'channels','resource_kind'=>'频道']);
          $s->upsertProfile($w1,['surface'=>'watch','resource_kind'=>'电影','media_year'=>'2026']);$s->upsertProfile($w2,['surface'=>'watch','resource_kind'=>'电影','media_year'=>'2025']);
          echo "SEED=PASS\n";
          PHP
      - name: Packaged Chromium visible login logout contract
        shell: bash
        run: |
          set -Eeuo pipefail
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"; test -n "$CHROME"; export CHROME
          mkdir -p /tmp/p01-v2362-strict-pw; cd /tmp/p01-v2362-strict-pw
          npm init -y >/dev/null 2>&1; npm install playwright-core@1.55.0 >/dev/null 2>&1
          NODE_PATH=/tmp/p01-v2362-strict-pw/node_modules SOURCE="$FORMAL" PORT="$PORT" EVID="$EVID" ADMIN_PASS="$ADMIN_PASS" CHROME="$CHROME" node "$GITHUB_WORKSPACE/auth/scripts/p01-auth-entry-browser-gate.cjs" | tee "$EVID/chromium.txt"
          grep -Fx P01_AUTH_ENTRY_BROWSER_GATE=PASS "$EVID/chromium.txt"
      - name: Final SQLite and verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$FRESH" EVID="$EVID" php <<'PHP'
          <?php require getenv('ROOT').'/app/bootstrap.php';$db=vf_db();$i=(string)$db->query('PRAGMA integrity_check')->fetchColumn();$fk=$db->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC);if($i!=='ok'||count($fk)!==0)exit(1);file_put_contents(getenv('EVID').'/db-final.txt',"INTEGRITY=ok\nFK=0\n");
          PHP
          grep -Fx P01_V2362_STRICT_ZERO_DATA=PASS "$EVID/zero-data.txt"
          grep -Fx P01_V2362_STRICT_SQLITE=PASS "$EVID/zero-data.txt"
          grep -Fx P01_AUTH_ENTRY_BROWSER_GATE=PASS "$EVID/chromium.txt"
          printf 'P01_V2362_STRICT_FRESH_GATE=PASS\nFORMAL=%s\nTREE=%s\nRUNTIME_TREE=%s\nSCHEMA=%s\nLOGIN_LOGOUT_390_1440=PASS\nOWNER_PRODUCTION_WRITE=NO\n' "$FORMAL" "$FORMAL_TREE" "$FORMAL_RUNTIME_TREE" "$SCHEMA" | tee "$EVID/verdict.txt"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2362-strict-fresh-${{ github.run_id }}
          path: /tmp/p01-v2362-strict-evidence
          if-no-files-found: error
          retention-days: 90
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/p01-v2362-strict.pid 2>/dev/null)" 2>/dev/null || true
