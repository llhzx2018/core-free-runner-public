name: P01 2.47.516 full 843-unit plus architecture Canonical release regression (one-off)
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  exact-canonical-security-merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    env:
      TARGET_VERSION: 2.47.516
      TARGET_SHA: 12eeed8c27f8708ab270291a9f0f2822108aea0d
      STABLE_SHA: ddd9d5dd0325772e2741d7a9e498b043e964c310
    steps:
      - name: Checkout registered public ephemeral lane audit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Audit exact product target before any private checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ephemeral_lane_spec.py validate \
            --spec scripts/ephemeral/p01-247516-d86-exact.json >"$RUNNER_TEMP/p01-canonical-spec.json"
          python3 scripts/ephemeral_lane_spec.py audit-rendered \
            --spec scripts/ephemeral/p01-247516-d86-exact.json \
            --input .github/workflows/p01-247516-major-handoff-oneoff.yml >"$RUNNER_TEMP/p01-canonical-audit.json"
          grep -F '"status": "PASS"' "$RUNNER_TEMP/p01-canonical-audit.json" >/dev/null
          echo 'P01_CANONICAL_EXACT_TARGET_AUDIT=PASS'
      - name: Checkout exact P01 private 2.47.516 candidate transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - name: Checkout immutable released P01 2.47.515 source for debt comparison
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.STABLE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: stable
      - name: Native PHP 8.3 exact source and baseline identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C stable rev-parse HEAD)" = "$STABLE_SHA"
          test "$(cat candidate/VERSION)" = "$TARGET_VERSION"
          test "$(cat stable/VERSION)" = "2.47.515"
          sudo apt-get update -qq >"$RUNNER_TEMP/p01-canonical-apt.txt" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            php8.3-cli php8.3-sqlite3 php8.3-mbstring php8.3-xml \
            php8.3-curl php8.3-zip >>"$RUNNER_TEMP/p01-canonical-apt.txt" 2>&1
          php8.3 -m | grep -Fx pdo_sqlite >/dev/null || php8.3 -m | grep -Fx PDO
          echo 'P01_CANONICAL_NATIVE_PHP_8_3=PASS'
      - name: Exact 515 baseline to current 516 canonical and fullstack architecture regression
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! bash candidate/tests/canonical_release_regression.sh \
            candidate stable >"$RUNNER_TEMP/p01-canonical-results.txt" 2>&1; then
            grep -E '^P01_CANONICAL_(BASELINE_TEST_COUNT|CURRENT_TEST_COUNT|BASELINE_FAILURE_COUNT|CURRENT_FAILURE_COUNT|NEW_REGRESSION_COUNT|CHANGED_FAILURE_COUNT|REMOVED_BASELINE_TEST_COUNT|UNIT_REGRESSION)=' \
              "$RUNNER_TEMP/p01-canonical-results.txt" | tail -n 15 || true
            # Only test-unit filenames may enter public diagnostics.
            grep -E '^(NEW_UNIT_REGRESSION|CHANGED_TEST_FAILURE|REMOVED_BASELINE_TEST)=tests/unit/[A-Za-z0-9_./-]+[.]php
            exit 1
          fi
          grep -Fx 'P01_CANONICAL_NEW_REGRESSION_COUNT=0' "$RUNNER_TEMP/p01-canonical-results.txt"
          grep -Fx 'P01_CANONICAL_CHANGED_FAILURE_COUNT=0' "$RUNNER_TEMP/p01-canonical-results.txt"
          grep -Fx 'P01_CANONICAL_REMOVED_BASELINE_TEST_COUNT=0' "$RUNNER_TEMP/p01-canonical-results.txt"
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' "$RUNNER_TEMP/p01-canonical-results.txt"
          grep -Fx 'P01_STACK_CANONICAL_SOURCE_GATE=PASS' "$RUNNER_TEMP/p01-canonical-results.txt"
          echo 'P01_CANONICAL_PRIVATE_INTEGRATION_ZERO_NEW_DEBT=PASS'
      - name: Always purge private source, logs and temp regression material
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate stable
          rm -f -- "$RUNNER_TEMP"/p01-canonical-*.txt "$RUNNER_TEMP"/p01-canonical-*.json
          echo 'P01_CANONICAL_PRIVATE_SOURCE_AND_LOG_PERSISTED=NO'
          echo 'P01_CANONICAL_PUBLIC_ARTIFACTS=NONE'
 "$RUNNER_TEMP/p01-canonical-results.txt" | sort -u | head -n 50 || true
            echo 'P01_CANONICAL_EXACT_PRODUCT_SOURCE=FAIL'
            exit 1
          fi
          grep -Fx 'P01_CANONICAL_NEW_REGRESSION_COUNT=0' "$RUNNER_TEMP/p01-canonical-results.txt"
          grep -Fx 'P01_CANONICAL_CHANGED_FAILURE_COUNT=0' "$RUNNER_TEMP/p01-canonical-results.txt"
          grep -Fx 'P01_CANONICAL_REMOVED_BASELINE_TEST_COUNT=0' "$RUNNER_TEMP/p01-canonical-results.txt"
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' "$RUNNER_TEMP/p01-canonical-results.txt"
          grep -Fx 'P01_STACK_CANONICAL_SOURCE_GATE=PASS' "$RUNNER_TEMP/p01-canonical-results.txt"
          echo 'P01_CANONICAL_PRIVATE_INTEGRATION_ZERO_NEW_DEBT=PASS'
      - name: Always purge private source, logs and temp regression material
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate stable
          rm -f -- "$RUNNER_TEMP"/p01-canonical-*.txt "$RUNNER_TEMP"/p01-canonical-*.json
          echo 'P01_CANONICAL_PRIVATE_SOURCE_AND_LOG_PERSISTED=NO'
          echo 'P01_CANONICAL_PUBLIC_ARTIFACTS=NONE'
