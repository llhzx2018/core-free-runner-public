name: P01 2.47.516 true 3-engine Atomic terminal recovery (one-off)
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  native-installed-atomic-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    env:
      TARGET_VERSION: 2.47.516
      TARGET_SHA: d0cb7e8a4e5ef569a97cbc264b9562b0a0bef774
      PREVIOUS_SHA: 1b553230eb0392897420a2af93bb6763adc36dfe
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: p01-only-synthetic-test
          MYSQL_DATABASE: p01_d1_test_mysql_20261111
        ports:
          - 3306:3306
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: p01-only-synthetic-test
          MARIADB_DATABASE: p01_d1_test_maria_20261111
        ports:
          - 3307:3306
    steps:
      - name: Checkout registered ephemeral lane auditor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact product identity before private checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "test/p01-247516-major-integrated-20261114"
          python3 scripts/ephemeral_lane_spec.py validate \
            --spec scripts/ephemeral/p01-247516-d86-exact.json >"$RUNNER_TEMP/p01-terminal-spec.json"
          python3 scripts/ephemeral_lane_spec.py audit-rendered \
            --spec scripts/ephemeral/p01-247516-d86-exact.json \
            --input .github/workflows/p01-247516-major-handoff-oneoff.yml >"$RUNNER_TEMP/p01-terminal-audit.json"
          grep -F '"status": "PASS"' "$RUNNER_TEMP/p01-terminal-audit.json" >/dev/null
          echo P01_D38_TERMINAL_EXACT_SOURCE_LANE_AUDIT=PASS
      - name: Checkout candidate exact private product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - name: Checkout prior exact private Laravel source package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.PREVIOUS_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: previous
      - name: Bind two immutable source identities and target version
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C previous rev-parse HEAD)" = "$PREVIOUS_SHA"
          test "$(cat candidate/VERSION)" = "$TARGET_VERSION"
          test "$(cat candidate/src/VERSION.txt)" = "$TARGET_VERSION"
          test "$(cat previous/VERSION)" = "$TARGET_VERSION"
          test "$TARGET_SHA" != "$PREVIOUS_SHA"
          echo "P01_D38_TERMINAL_TEST_SOURCE=$TARGET_SHA"
      - name: Set up native Nginx PHP-FPM and three DB drivers
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq >"$RUNNER_TEMP/p01-terminal-apt.txt" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            nginx php8.3-fpm php8.3-cli php8.3-mysql php8.3-sqlite3 \
            php8.3-mbstring php8.3-xml php8.3-curl php8.3-zip composer \
            openssl unzip >>"$RUNNER_TEMP/p01-terminal-apt.txt" 2>&1
          command -v nginx
          command -v php-fpm8.3
          php -r 'foreach(["sqlite","mysql"] as $p){if(!in_array($p,PDO::getAvailableDrivers(),true))exit(2);}'
          echo P01_D38_NATIVE_NGINX_PHPFPM_AND_SQL=PASS
      - name: Syntax and exact protected Atomic source gates
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l candidate/src/app/next/runtime/CloudPanelCodeSwap.php
          php -l candidate/src/app/next/runtime/IsolatedRecoverySnapshot.php
          php -l candidate/src/app/next/runtime/InstalledHttpMaintenanceGate.php
          php -l candidate/tests/compatibility/laravel/http/p01_d38_installed_code_swap_cli.php
          python3 -m py_compile candidate/tests/compatibility/laravel/http/run_d38_cross_source_upgrade.py
          echo P01_D38_TERMINAL_SOURCE_SYNTAX=PASS
      - name: Build two true complete CloudPanel Laravel sources
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 scripts/build_p01_next_clean_full.py build \
            --source-sha "$TARGET_SHA" --composer composer \
            --output "$RUNNER_TEMP/p01-terminal-current-full.zip" >"$RUNNER_TEMP/p01-terminal-build.txt" 2>&1
          python3 scripts/build_p01_next_clean_full.py verify \
            --zip "$RUNNER_TEMP/p01-terminal-current-full.zip" >>"$RUNNER_TEMP/p01-terminal-build.txt" 2>&1
          python3 scripts/build_p01_next_cloudpanel_full.py build \
            --source-zip "$RUNNER_TEMP/p01-terminal-current-full.zip" \
            --output "$RUNNER_TEMP/p01-terminal-current-cloudpanel.zip" >>"$RUNNER_TEMP/p01-terminal-build.txt" 2>&1
          python3 scripts/build_p01_next_cloudpanel_full.py verify \
            --zip "$RUNNER_TEMP/p01-terminal-current-cloudpanel.zip" >>"$RUNNER_TEMP/p01-terminal-build.txt" 2>&1
          cd ../previous
          python3 scripts/build_p01_next_clean_full.py build \
            --source-sha "$PREVIOUS_SHA" --composer composer \
            --output "$RUNNER_TEMP/p01-terminal-previous-full.zip" >>"$RUNNER_TEMP/p01-terminal-build.txt" 2>&1
          python3 scripts/build_p01_next_clean_full.py verify \
            --zip "$RUNNER_TEMP/p01-terminal-previous-full.zip" >>"$RUNNER_TEMP/p01-terminal-build.txt" 2>&1
          python3 scripts/build_p01_next_cloudpanel_full.py build \
            --source-zip "$RUNNER_TEMP/p01-terminal-previous-full.zip" \
            --output "$RUNNER_TEMP/p01-terminal-previous-cloudpanel.zip" >>"$RUNNER_TEMP/p01-terminal-build.txt" 2>&1
          python3 scripts/build_p01_next_cloudpanel_full.py verify \
            --zip "$RUNNER_TEMP/p01-terminal-previous-cloudpanel.zip" >>"$RUNNER_TEMP/p01-terminal-build.txt" 2>&1
          echo P01_D38_TWO_NATIVE_CLOUDPANEL_SOURCE_FULLS=PASS
      - name: Real SQLite installed Atomic terminal COMMITTED/ROLLED_BACK crash + recovery
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 candidate/tests/compatibility/laravel/http/run_d38_cross_source_upgrade.py \
            --candidate candidate --previous-zip "$RUNNER_TEMP/p01-terminal-previous-cloudpanel.zip" \
            --candidate-zip "$RUNNER_TEMP/p01-terminal-current-cloudpanel.zip" --engine sqlite \
            >"$RUNNER_TEMP/p01-terminal-sqlite.txt" 2>&1 || { grep -Eo 'P01_D38_[A-Z0-9_]+=PASS|D38_[A-Z0-9_]{5,100}' "$RUNNER_TEMP/p01-terminal-sqlite.txt" | tail -n 23 || true; exit 1; }
          grep -F 'P01_D38_SQLITE_COMMITTED_TERMINAL_CRASH_RECOVERED=PASS' "$RUNNER_TEMP/p01-terminal-sqlite.txt"
          grep -F 'P01_D38_SQLITE_ROLLED_BACK_TERMINAL_CRASH_RECOVERED=PASS' "$RUNNER_TEMP/p01-terminal-sqlite.txt"
      - name: Real MariaDB 11.8 installed Atomic terminal COMMITTED/ROLLED_BACK crash + recovery
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 candidate/tests/compatibility/laravel/http/run_d38_cross_source_upgrade.py \
            --candidate candidate --previous-zip "$RUNNER_TEMP/p01-terminal-previous-cloudpanel.zip" \
            --candidate-zip "$RUNNER_TEMP/p01-terminal-current-cloudpanel.zip" --engine mariadb \
            >"$RUNNER_TEMP/p01-terminal-mariadb.txt" 2>&1 || { grep -Eo 'P01_D38_[A-Z0-9_]+=PASS|D38_[A-Z0-9_]{5,100}' "$RUNNER_TEMP/p01-terminal-mariadb.txt" | tail -n 23 || true; exit 1; }
          grep -F 'P01_D38_MARIADB_COMMITTED_TERMINAL_CRASH_RECOVERED=PASS' "$RUNNER_TEMP/p01-terminal-mariadb.txt"
          grep -F 'P01_D38_MARIADB_ROLLED_BACK_TERMINAL_CRASH_RECOVERED=PASS' "$RUNNER_TEMP/p01-terminal-mariadb.txt"
      - name: Real MySQL 8.4 installed Atomic terminal COMMITTED/ROLLED_BACK crash + recovery
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 candidate/tests/compatibility/laravel/http/run_d38_cross_source_upgrade.py \
            --candidate candidate --previous-zip "$RUNNER_TEMP/p01-terminal-previous-cloudpanel.zip" \
            --candidate-zip "$RUNNER_TEMP/p01-terminal-current-cloudpanel.zip" --engine mysql \
            >"$RUNNER_TEMP/p01-terminal-mysql.txt" 2>&1 || { grep -Eo 'P01_D38_[A-Z0-9_]+=PASS|D38_[A-Z0-9_]{5,100}' "$RUNNER_TEMP/p01-terminal-mysql.txt" | tail -n 23 || true; exit 1; }
          grep -F 'P01_D38_MYSQL_COMMITTED_TERMINAL_CRASH_RECOVERED=PASS' "$RUNNER_TEMP/p01-terminal-mysql.txt"
          grep -F 'P01_D38_MYSQL_ROLLED_BACK_TERMINAL_CRASH_RECOVERED=PASS' "$RUNNER_TEMP/p01-terminal-mysql.txt"
          echo P01_D38_REAL_THREE_ENGINE_TERMINAL_ATOMIC_CRASH_RECOVERY=PASS
          echo P01_D38_OFFICIAL_RELEASE_OR_PRODUCTION_ATOMIC=NOT_PROVEN
      - name: Purge private checkouts and all synthetic database artifacts
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate previous
          rm -f -- "$RUNNER_TEMP"/p01-terminal-*.txt "$RUNNER_TEMP"/p01-terminal-*.json "$RUNNER_TEMP"/p01-terminal-*.zip
          echo P01_D38_PRIVATE_SOURCE_AND_PACKAGE_PERSISTED=NO
          echo P01_D38_PUBLIC_ARTIFACTS=NONE
