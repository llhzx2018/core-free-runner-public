name: P01 2.47.516 exact major handoff safety (one-off)
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  bounded-major-handoff-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Exact private candidate checkout (temporary and secret-scoped)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 6c3c3e03d06fb1449925f7eaf4f2bdd38302f423
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - name: Source identity, bounds, and fixture scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "test/p01-247516-major-integrated-20261114"
          test "$(git -C candidate rev-parse HEAD)" = "6c3c3e03d06fb1449925f7eaf4f2bdd38302f423"
          test "$(cat candidate/VERSION)" = "2.47.516"
          test "$(cat candidate/src/VERSION.txt)" = "2.47.516"
          test -f candidate/src/app/next/runtime/MajorSignedReleasePreflight.php
          test -f candidate/src/app/next/runtime/MajorOfflineReleaseSigner.php
          test -f candidate/src/app/next/runtime/MajorCloudPanelMaintenanceProbe.php
          test -f candidate/src/app/next/runtime/MajorOwnerOneUseClaim.php
          echo "P01_MAJOR_EXACT_SOURCE=6c3c3e03d06fb1449925f7eaf4f2bdd38302f423"
      - name: Native PHP 8.3 sodium, curl, SQLite, ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq >"$RUNNER_TEMP/p01-major-apt.log" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            php8.3-cli php8.3-curl php8.3-zip php8.3-sqlite3 \
            >>"$RUNNER_TEMP/p01-major-apt.log" 2>&1
          php8.3 -m | grep -Fx 'sodium'
          php8.3 -m | grep -Fx 'zip'
          php8.3 -m | grep -Fx 'curl'
          php8.3 -m | grep -Fx 'pdo_sqlite'
          echo 'P01_MAJOR_NATIVE_PHP_EXTENSIONS=PASS'
      - name: PHP syntax and stable 2.47.515-to-516 guard contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          for file in \
            src/app/LegacyMajorOwnerHandoff.php \
            src/app/next/runtime/MajorOwnerOneUseClaim.php \
            src/app/next/runtime/MajorCloudPanelMaintenanceProbe.php \
            src/app/next/runtime/MajorSignedReleasePreflight.php \
            src/app/next/runtime/MajorOfflineReleaseSigner.php \
            tests/compatibility/laravel/http/p01_major_owner_one_use_claim.php \
            tests/compatibility/laravel/http/p01_major_maintenance_probe.php \
            tests/compatibility/laravel/http/p01_major_offline_signer.php \
            tests/compatibility/laravel/run_major_signed_release_preflight.php; do
              php8.3 -l "candidate/$file" >/dev/null
          done
          echo 'P01_MAJOR_PHP_SYNTAX_EXACT_SOURCE=PASS'
      - name: Run real old-intent HMAC, one-use claim and negative fixtures
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! php8.3 candidate/tests/compatibility/laravel/http/p01_major_owner_one_use_claim.php \
            >"$RUNNER_TEMP/p01-major-claim.log" 2>&1; then
            echo 'P01_MAJOR_OWNER_CLAIM_EXACT_MACHINE=FAIL'
            exit 1
          fi
          grep -Fx 'P01_MAJOR_OWNER_ONE_USE_CLAIM_LOCAL_CONTRACT=PASS' "$RUNNER_TEMP/p01-major-claim.log"
          echo 'P01_MAJOR_OWNER_CLAIM_EXACT_MACHINE=PASS'
      - name: Real PHP HTTP maintenance response parser rejection matrix
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! php8.3 candidate/tests/compatibility/laravel/http/p01_major_maintenance_probe.php \
            >"$RUNNER_TEMP/p01-major-probe.log" 2>&1; then
            echo 'P01_MAJOR_MAINTENANCE_GUARD_EXACT_MACHINE=FAIL'
            exit 1
          fi
          grep -Fx 'P01_MAJOR_MAINTENANCE_HTTP_PROBE_LOCAL_CONTRACT=PASS' "$RUNNER_TEMP/p01-major-probe.log"
          echo 'P01_MAJOR_MAINTENANCE_GUARD_EXACT_MACHINE=PASS'
      - name: Isolated Ed25519 signer, tamper, official-envelope consumer tests
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! php8.3 candidate/tests/compatibility/laravel/http/p01_major_offline_signer.php \
            >"$RUNNER_TEMP/p01-major-signer.log" 2>&1; then
            grep -Eo '(MAJOR_[A-Z0-9_]{3,90}|TEST_[A-Z0-9_]{3,90}|ACCEPTED_[A-Z0-9_]{3,90}|FAKE_[A-Z0-9_]{3,90})' "$RUNNER_TEMP/p01-major-signer.log" | sort -u | head -n 8 || true
            echo 'P01_MAJOR_OFFLINE_SIGNER_EXACT_MACHINE=FAIL'
            exit 1
          fi
          grep -Fx 'MAJOR_OFFLINE_SIGNER_SYNTHETIC=PASS' "$RUNNER_TEMP/p01-major-signer.log"
          if ! P01_MAJOR_SIGNED_ISOLATED_TEST=YES php8.3 \
            candidate/tests/compatibility/laravel/run_major_signed_release_preflight.php \
            >"$RUNNER_TEMP/p01-major-envelope.log" 2>&1; then
            echo 'P01_MAJOR_SIGNED_RELEASE_CONSUMER_EXACT_MACHINE=FAIL'
            exit 1
          fi
          grep -Fx 'P01_MAJOR_OUTER_EPHEMERAL_SIGNED_AUTHENTICITY=PASS' "$RUNNER_TEMP/p01-major-envelope.log"
          grep -Fx 'P01_MAJOR_INVALID_SIGNATURE_RELEASE_PATH_AND_DEV_ASSET_REFUSED=PASS' "$RUNNER_TEMP/p01-major-envelope.log"
          grep -Fx 'P01_MAJOR_REAL_RELEASE_SIGNER_CONNECTED=NO' "$RUNNER_TEMP/p01-major-envelope.log"
          grep -Fx 'P01_MAJOR_OWNER_INSTALL_OR_CLOUDPANEL_APPLY=NO' "$RUNNER_TEMP/p01-major-envelope.log"
          echo 'P01_MAJOR_SYNTHETIC_SIGNING_AND_CONSUMER_EXACT_MACHINE=PASS'
      - name: Always remove transient private checkout and test logs
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate
          rm -f -- "$RUNNER_TEMP"/p01-major-*.log
          echo 'P01_MAJOR_PRIVATE_SOURCE_PERSISTED=NO'
          echo 'P01_MAJOR_PUBLIC_TEST_ARTIFACTS=NONE'
