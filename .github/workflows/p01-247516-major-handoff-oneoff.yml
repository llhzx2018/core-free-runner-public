name: P01 2.47.516 real FULL signed nested integrity (one-off)
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  signed-nested-full-machine:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    env:
      TARGET_VERSION: 2.47.516
      TARGET_SHA: 1b553230eb0392897420a2af93bb6763adc36dfe
    steps:
      - name: Checkout registered ephemeral lane auditor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify source identity ownership before private checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "test/p01-247516-major-integrated-20261114"
          python3 scripts/ephemeral_lane_spec.py validate \
            --spec scripts/ephemeral/p01-247516-d86-exact.json > "$RUNNER_TEMP/p01-integrity-spec.txt"
          python3 scripts/ephemeral_lane_spec.py audit-rendered \
            --spec scripts/ephemeral/p01-247516-d86-exact.json \
            --input .github/workflows/p01-247516-major-handoff-oneoff.yml > "$RUNNER_TEMP/p01-integrity-audit.txt"
          grep -F '"status": "PASS"' "$RUNNER_TEMP/p01-integrity-audit.txt" >/dev/null
          echo 'P01_MAJOR_SIGNED_FULL_EXACT_LANE_AUDIT=PASS'
      - name: Checkout exact private source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - name: Exact source and PHP security prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(cat candidate/VERSION)" = "$TARGET_VERSION"
          test "$(cat candidate/src/VERSION.txt)" = "$TARGET_VERSION"
          sudo apt-get update -qq >"$RUNNER_TEMP/p01-integrity-apt.txt" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            php8.3-cli php8.3-zip php8.3-curl php8.3-sqlite3 php8.3-mbstring php8.3-xml composer unzip \
            >>"$RUNNER_TEMP/p01-integrity-apt.txt" 2>&1
          php8.3 -m | grep -Fx zip
          php8.3 -m | grep -Fx sodium
          echo "P01_MAJOR_SIGNED_FULL_EXACT_PRODUCT_SHA=$TARGET_SHA"
      - name: New signed FULL verifier and tests PHP syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          for file in \
            src/app/next/runtime/MajorInnerFullIntegrity.php \
            src/app/next/runtime/MajorSignedReleasePreflight.php \
            src/app/next/runtime/MajorOfflineReleaseSigner.php \
            tests/compatibility/laravel/run_major_signed_release_preflight.php \
            tests/compatibility/laravel/run_major_signed_real_full_contract.php \
            tests/compatibility/laravel/http/p01_major_offline_signer.php; do
              php8.3 -l "candidate/$file" >"$RUNNER_TEMP/p01-integrity-lint.txt" 2>&1
          done
          echo 'P01_MAJOR_SIGNED_FULL_PHP_SYNTAX=PASS'
      - name: Synthetic offline signer and complete inner FULL ledger adversarial matrix
        shell: bash
        run: |
          set -Eeuo pipefail
          php8.3 candidate/tests/compatibility/laravel/http/p01_major_offline_signer.php \
            >"$RUNNER_TEMP/p01-integrity-signer.txt" 2>&1
          grep -Fx 'MAJOR_OFFLINE_SIGNER_SYNTHETIC=PASS' "$RUNNER_TEMP/p01-integrity-signer.txt"
          P01_MAJOR_SIGNED_ISOLATED_TEST=YES php8.3 \
            candidate/tests/compatibility/laravel/run_major_signed_release_preflight.php \
            >"$RUNNER_TEMP/p01-integrity-synthetic.txt" 2>&1
          grep -Fx 'P01_MAJOR_OUTER_EPHEMERAL_SIGNED_AUTHENTICITY=PASS' "$RUNNER_TEMP/p01-integrity-synthetic.txt"
          grep -Fx 'P01_MAJOR_SIGNED_DEVELOPER_INNER_FULL_REFUSED=PASS' "$RUNNER_TEMP/p01-integrity-synthetic.txt"
          grep -Fx 'P01_MAJOR_SIGNED_FULL_LEDGER_TAMPER_REFUSED=PASS' "$RUNNER_TEMP/p01-integrity-synthetic.txt"
          grep -Fx 'P01_MAJOR_INVALID_SIGNATURE_RELEASE_PATH_AND_DEV_ASSET_REFUSED=PASS' "$RUNNER_TEMP/p01-integrity-synthetic.txt"
          grep -Fx 'P01_MAJOR_REAL_RELEASE_SIGNER_CONNECTED=NO' "$RUNNER_TEMP/p01-integrity-synthetic.txt"
          echo 'P01_MAJOR_INNER_FULL_POSITIVE_AND_NEGATIVE_MACHINE=PASS'
      - name: Build exact source actual complete CloudPanel Laravel FULL
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 scripts/build_p01_next_clean_full.py build \
            --source-sha "$TARGET_SHA" \
            --output "$RUNNER_TEMP/p01-integrity-clean-full.zip" --composer composer \
            >"$RUNNER_TEMP/p01-integrity-build.txt" 2>&1
          python3 scripts/build_p01_next_clean_full.py verify \
            --zip "$RUNNER_TEMP/p01-integrity-clean-full.zip" \
            >>"$RUNNER_TEMP/p01-integrity-build.txt" 2>&1
          python3 scripts/build_p01_next_cloudpanel_full.py build \
            --source-zip "$RUNNER_TEMP/p01-integrity-clean-full.zip" \
            --output "$RUNNER_TEMP/p01-integrity-cloudpanel-full.zip" \
            >>"$RUNNER_TEMP/p01-integrity-build.txt" 2>&1
          python3 scripts/build_p01_next_cloudpanel_full.py verify \
            --zip "$RUNNER_TEMP/p01-integrity-cloudpanel-full.zip" \
            >>"$RUNNER_TEMP/p01-integrity-build.txt" 2>&1
          echo 'P01_MAJOR_REAL_LARAVEL_FULL_EXACT_BUILT=PASS'
      - name: Genuine Laravel FULL in synthetic release envelope signed end-to-end
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! P01_MAJOR_REAL_FULL_ISOLATED_TEST=YES php8.3 \
            candidate/tests/compatibility/laravel/run_major_signed_real_full_contract.php \
            --developer-full "$RUNNER_TEMP/p01-integrity-cloudpanel-full.zip" \
            >"$RUNNER_TEMP/p01-integrity-real-full.txt" 2>&1; then
            # Only safe error-class / hard-coded status tokens leave the job.
            grep -Eo '(MAJOR_[A-Z0-9_]{6,100}|P01_MAJOR_REAL_FULL_[A-Z0-9_]{6,100}|Allowed memory size|ValueError|TypeError|ZipArchive)' \
              "$RUNNER_TEMP/p01-integrity-real-full.txt" | sort -u | head -n 12 || true
            echo 'P01_MAJOR_REAL_FULL_MACHINE_STAGE=FAIL'
            exit 1
          fi
          grep -Fx 'P01_MAJOR_REAL_CLOUDPANEL_FULL_SYNTHETIC_SIGNED_CONSUMER=PASS' "$RUNNER_TEMP/p01-integrity-real-full.txt"
          grep -Fx 'P01_MAJOR_REAL_RELEASE_SIGNING_KEY_AND_GITHUB_ASSET=NOT_PROVEN' "$RUNNER_TEMP/p01-integrity-real-full.txt"
          grep -Fx 'P01_MAJOR_OWNER_APPLY_OR_PRODUCTION_WRITE=NO' "$RUNNER_TEMP/p01-integrity-real-full.txt"
          echo 'P01_MAJOR_REAL_FULL_INNER_MANIFEST_HASH_LEDGER_SIGNED_MACHINE=PASS'
      - name: Cleanup exact private candidate and all temporary ZIP/records
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate
          rm -f -- "$RUNNER_TEMP"/p01-integrity-*.txt "$RUNNER_TEMP"/p01-integrity-*.zip
          echo 'P01_MAJOR_PRIVATE_SOURCE_AND_TEST_PACKAGE_PERSISTED=NO'
          echo 'P01_MAJOR_PUBLIC_TEST_ARTIFACTS=NONE'
