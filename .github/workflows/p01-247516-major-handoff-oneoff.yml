name: P01 2.47.516 post-unit architecture exact source proof (one-off)
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  exact-canonical-security-merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    env:
      TARGET_VERSION: 2.47.516
      TARGET_SHA: 12eeed8c27f8708ab270291a9f0f2822108aea0d
      STABLE_SHA: ddd9d5dd0325772e2741d7a9e498b043e964c310
    steps:
      - name: Checkout registered public ephemeral lane audit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Audit exact product target before any private checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ephemeral_lane_spec.py validate \
            --spec scripts/ephemeral/p01-247516-d86-exact.json >"$RUNNER_TEMP/p01-canonical-spec.json"
          python3 scripts/ephemeral_lane_spec.py audit-rendered \
            --spec scripts/ephemeral/p01-247516-d86-exact.json \
            --input .github/workflows/p01-247516-major-handoff-oneoff.yml >"$RUNNER_TEMP/p01-canonical-audit.json"
          grep -F '"status": "PASS"' "$RUNNER_TEMP/p01-canonical-audit.json" >/dev/null
          echo 'P01_CANONICAL_EXACT_TARGET_AUDIT=PASS'
      - name: Checkout exact P01 private 2.47.516 candidate transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - name: Checkout immutable released P01 2.47.515 source for debt comparison
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.STABLE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: stable
      - name: Native PHP 8.3 exact source and baseline identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C stable rev-parse HEAD)" = "$STABLE_SHA"
          test "$(cat candidate/VERSION)" = "$TARGET_VERSION"
          test "$(cat stable/VERSION)" = "2.47.515"
          sudo apt-get update -qq >"$RUNNER_TEMP/p01-canonical-apt.txt" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            php8.3-cli php8.3-sqlite3 php8.3-mbstring php8.3-xml \
            php8.3-curl php8.3-zip >>"$RUNNER_TEMP/p01-canonical-apt.txt" 2>&1
          php8.3 -m | grep -Fx pdo_sqlite >/dev/null || php8.3 -m | grep -Fx PDO
          echo 'P01_CANONICAL_NATIVE_PHP_8_3=PASS'
      - name: Exact source post-unit architectural tests without repeating 843 passing unit cases
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('candidate/tests/canonical_release_regression.sh').read_text()
          start=root.index('# Full-stack target and new framework code')
          end=root.index('echo "P01_CANONICAL_UNIT_REGRESSION=PASS"',start)
          tail=root[start:end]
          stages=0
          out=[]
          for line in tail.splitlines():
              if line.startswith(('PYTHONDONTWRITEBYTECODE=1 python3','php -l ','php "$CURRENT_ROOT')):
                  stages+=1
                  out.append('echo P01_CANONICAL_ARCH_STAGE_%02d=START'%stages)
              out.append(line)
          out.append('echo P01_CANONICAL_ARCH_ALL_SOURCE_GATES=PASS')
          Path('p01-arch-only.sh').write_text('\n'.join(out)+'\n')
          PY
          export CURRENT_ROOT="$(cd candidate && pwd)"
          export BASELINE_ROOT="$(cd stable && pwd)"
          export TMP_DIR="$RUNNER_TEMP/p01-arch-only"
          mkdir -m 700 -p "$TMP_DIR"
          if ! bash -e p01-arch-only.sh > "$RUNNER_TEMP/p01-architecture-results.txt" 2>&1; then
            grep -E '^P01_CANONICAL_ARCH_STAGE_[0-9]{2}=START' "$RUNNER_TEMP/p01-architecture-results.txt" | tail -n 3 || true
            grep -E '^P01_(STACK|D[0-9]{1,3}|MAJOR|CANONICAL)_[A-Z0-9_]+=(FAIL|BLOCKED|NOT_PROVEN)' "$RUNNER_TEMP/p01-architecture-results.txt" | tail -n 8 || true
            echo 'P01_CANONICAL_ARCH_ONLY=FAIL'
            exit 1
          fi
          grep -Fx 'P01_CANONICAL_ARCH_ALL_SOURCE_GATES=PASS' "$RUNNER_TEMP/p01-architecture-results.txt"
          echo 'P01_CANONICAL_ARCH_ONLY=PASS'
      - name: Always purge private source, logs and temp regression material
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate stable p01-arch-only.sh "$RUNNER_TEMP/p01-arch-only"
          rm -f -- "$RUNNER_TEMP"/p01-canonical-*.txt "$RUNNER_TEMP"/p01-canonical-*.json "$RUNNER_TEMP"/p01-architecture-results.txt
          echo 'P01_CANONICAL_PRIVATE_SOURCE_AND_LOG_PERSISTED=NO'
          echo 'P01_CANONICAL_PUBLIC_ARTIFACTS=NONE'
