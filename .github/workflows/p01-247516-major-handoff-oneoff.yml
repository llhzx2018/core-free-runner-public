name: P01 2.47.516 exact-source 18 canonical test regression classification (one-off)
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  classify-canonical-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      TARGET_VERSION: 2.47.516
      TARGET_SHA: 12eeed8c27f8708ab270291a9f0f2822108aea0d
    steps:
      - name: Checkout public one-off lane identity
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Audit exact P01 source binding before checkout
        run: |
          set -Eeuo pipefail
          python3 scripts/ephemeral_lane_spec.py validate --spec scripts/ephemeral/p01-247516-d86-exact.json >"$RUNNER_TEMP/p01-diagnostic-spec.json"
          python3 scripts/ephemeral_lane_spec.py audit-rendered --spec scripts/ephemeral/p01-247516-d86-exact.json --input .github/workflows/p01-247516-major-handoff-oneoff.yml >"$RUNNER_TEMP/p01-diagnostic-audit.json"
          grep -F '"status": "PASS"' "$RUNNER_TEMP/p01-diagnostic-audit.json" >/dev/null
          echo P01_CANONICAL_EXACT_SHA_AUDIT=PASS
      - name: Checkout exact temporary private product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - name: Native isolated PHP 8.3 SQLite diagnostics
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(cat candidate/VERSION)" = "$TARGET_VERSION"
          sudo apt-get update -qq >"$RUNNER_TEMP/p01-diagnostic-apt.txt" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php8.3-cli php8.3-sqlite3 php8.3-mbstring php8.3-curl php8.3-xml php8.3-zip >>"$RUNNER_TEMP/p01-diagnostic-apt.txt" 2>&1
          python3 - <<'PY'
          import os, subprocess, re, hashlib
          from pathlib import Path
          src=Path('candidate/tests/unit')
          names=[
            "consolidated_product_acceptance_contract.php",
            "frontend_mature_product_v247104_contract.php",
            "frontend_surface_inventory_v247102_contract.php",
            "p01_fullstack_technology_target_contract.php",
            "p01_local_management_r1_contract.php",
            "p01_update_interrupted_install_fail_closed.php",
            "p01_update_superseded_interrupted_journal_guard.php",
            "privacy_cache_performance_r2_contract.php",
            "public_brand_route_contract.php",
            "public_global_nav_contract.php",
            "public_home_owner_shell_unified_v247390_contract.php",
            "public_home_shared_interaction_v247390_contract.php",
            "public_home_visitor_discovery_v247390_contract.php",
            "tool_scene_facet_context_contract.php",
            "tools_fine_polish_v247196_contract.php",
            "tools_specialist_boxes_v247193_contract.php",
            "tools_subsite_ux_v247200_contract.php",
            "workspace_view_catalog_contract.php",
          ]
          failed=[]
          for name in names:
              path=src/name
              p=subprocess.run(['php8.3',str(path)],capture_output=True,text=True,timeout=45,check=False)
              if p.returncode==0:
                  print('P01_CANONICAL_TARGET_UNIT=PASS '+name,flush=True)
                  continue
              failed.append(name)
              output=(p.stderr+'\n'+p.stdout)[:8000]
              patterns=[
                  r'Uncaught RuntimeException: ([^\r\n]{1,170})',
                  r'Uncaught (PDOException|Error|TypeError|ValueError): ([^\r\n]{1,170})',
                  r'P01_FULLSTACK_(DOC_DRIFT|TARGET_POLICY)=FAIL[^\r\n]{0,130}',
                  r'(?:^|\n)FAIL: ([^\r\n]{1,120})',
              ]
              diagnostics=[]
              if name=='p01_fullstack_technology_target_contract.php':
                  m=re.search(r'P01_FULLSTACK_DOC_DRIFT=FAIL ([A-Za-z0-9_.\\/-]+) missing',output)
                  if m: diagnostics.append('DOC_TOKEN_MISSING_'+m.group(1).replace('/','_'))
                  elif 'P01_FULLSTACK_TARGET_POLICY=FAIL' in output:
                      diagnostics.append('TARGET_POLICY_MISMATCH')
              for pattern in patterns:
                  match=re.search(pattern,output)
                  if match:
                      msg=match.group(0).split(' in /home/')[0].split(' in /tmp/')[0]
                      if re.fullmatch(r"[\w\u4e00-\u9fff\s,.:'()=+!_-]{1,160}",msg) and not re.search(r'secret|password|token|credential|private.?data',msg,re.I):
                          diagnostics.append(msg[:145])
                          break
              print('P01_CANONICAL_TARGET_UNIT=FAIL '+name+' reason='+(diagnostics[0] if diagnostics else 'UNCLASSIFIED_'+hashlib.sha256(output.encode()).hexdigest()[:12]),flush=True)
          print('P01_CANONICAL_DIAGNOSTIC_FAIL_COUNT='+str(len(failed)),flush=True)
          # The known 18 are intentionally red: diagnostics alone do not waive them.
          if failed: raise SystemExit(1)
          PY
      - name: Always purge private transient source and test inputs
        if: always()
        run: |
          rm -rf -- candidate
          rm -f -- "$RUNNER_TEMP"/p01-diagnostic-*.txt "$RUNNER_TEMP"/p01-diagnostic-*.json
          echo P01_PRIVATE_PRODUCT_SOURCE_PERSISTED=NO
          echo P01_PUBLIC_ARTIFACTS=NONE
