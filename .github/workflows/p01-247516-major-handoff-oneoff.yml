name: P01 2.47.516 private Owner security on installed official 515 (one-off)
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  native-owner-private-legacy-compat:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    env:
      TARGET_VERSION: 2.47.516
      TARGET_SHA: a88af0293acb7500d3b586d3110e8d072b6c4d1b
    steps:
      - name: Checkout registered ephemeral target auditor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Audit exact P01 product source identity before checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "test/p01-247516-major-integrated-20261114"
          python3 scripts/ephemeral_lane_spec.py validate \
            --spec scripts/ephemeral/p01-247516-d86-exact.json >"$RUNNER_TEMP/p01-private-lane.json"
          python3 scripts/ephemeral_lane_spec.py audit-rendered \
            --spec scripts/ephemeral/p01-247516-d86-exact.json \
            --input .github/workflows/p01-247516-major-handoff-oneoff.yml >"$RUNNER_TEMP/p01-private-audit.json"
          grep -F '"status": "PASS"' "$RUNNER_TEMP/p01-private-audit.json" >/dev/null
          echo 'P01_PRIVATE_EXACT_SOURCE_AUDIT=PASS'
      - name: Checkout exact P01 Draft source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - name: Real PHP FPM Nginx SQLite TLS and exact P01 source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(cat candidate/VERSION)" = "$TARGET_VERSION"
          test "$(cat candidate/src/VERSION.txt)" = "$TARGET_VERSION"
          sudo apt-get update -qq >"$RUNNER_TEMP/p01-private-apt.log" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            nginx curl php8.3-cli php8.3-fpm php8.3-sqlite3 php8.3-mbstring \
            php8.3-curl php8.3-xml php8.3-zip openssl unzip \
            >>"$RUNNER_TEMP/p01-private-apt.log" 2>&1
          command -v php-fpm8.3
          command -v nginx
          python3 -m py_compile candidate/tests/integration/p01_private_legacy_full_http.py
          for src in \
            src/api.php src/app/PrivateAccess.php src/app/bootstrap.php \
            src/app/Seo.php src/app/WorkspaceViewCatalog.php \
            src/asset.php src/index.php \
            tests/unit/p01_private_owner_gate_contract.php \
            tests/integration/p01_nine_entry_auth_shell_contract.php; do
              php8.3 -l "candidate/$src" >/dev/null
          done
          echo "P01_PRIVATE_REAL_PHP_FPM_EXACT_SOURCE=$TARGET_SHA"
      - name: Private owner protocol source and 91 root-entry semantics
        shell: bash
        run: |
          set -Eeuo pipefail
          php8.3 candidate/tests/unit/p01_private_owner_gate_contract.php > "$RUNNER_TEMP/p01-private-php.txt" 2>&1
          php8.3 candidate/tests/integration/p01_nine_entry_auth_shell_contract.php >> "$RUNNER_TEMP/p01-private-php.txt" 2>&1
          php8.3 candidate/tests/unit/public_navigation_seo_route_v247390_contract.php >> "$RUNNER_TEMP/p01-private-php.txt" 2>&1
          grep -F 'P01_PRIVATE_OWNER_GATE_CONTRACT=PASS' "$RUNNER_TEMP/p01-private-php.txt"
          grep -F 'P01_OWNER_ONLY_SUBSITE_CONTRACT=PASS owner_entries=12' "$RUNNER_TEMP/p01-private-php.txt"
          echo 'P01_PRIVATE_SOURCE_ROOT_AND_TWELVE_SUBSITES=PASS'
      - name: Real Nginx static historical SEO and randomized private storage denials
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/integration/p01_private_nginx_static_contract.sh \
            > "$RUNNER_TEMP/p01-private-nginx.txt" 2>&1
          grep -F 'P01_PRIVATE_NGINX_STATIC=PASS' "$RUNNER_TEMP/p01-private-nginx.txt"
      - name: Download authentic immutable official v515 FULL via protected read token
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -m 700 -p "$RUNNER_TEMP/p01-private-old-release"
          gh release download v2.47.515 --repo llhzx2018/vf-start \
            --pattern VF-Start-V2.47.515-FULL.zip \
            --dir "$RUNNER_TEMP/p01-private-old-release" \
            > "$RUNNER_TEMP/p01-private-download.txt" 2>&1
          package="$RUNNER_TEMP/p01-private-old-release/VF-Start-V2.47.515-FULL.zip"
          test "$(stat -c '%s' "$package")" = "1802482"
          echo "5ee0c031dda82c53353929dc4519b0cc1b647b2af82a1bcd8a27a03ab7866778  $package" | sha256sum -c --status
          echo 'P01_PRIVATE_REAL_OFFICIAL_V515_FULL=PASS'
      - name: Install disposable pinned Playwright Chromium runner
        shell: bash
        run: |
          set -Eeuo pipefail
          node --version
          npm --version
          npm --prefix candidate install --no-save --no-package-lock --ignore-scripts \
            playwright@1.56.1 >"$RUNNER_TEMP/p01-private-playwright-install.txt" 2>&1
          test -x candidate/node_modules/.bin/playwright
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/p01-playwright-browsers" \
            candidate/node_modules/.bin/playwright install chromium \
            >>"$RUNNER_TEMP/p01-private-playwright-install.txt" 2>&1
          echo 'P01_PRIVATE_CHROMIUM_BROWSER_INSTALLED=PASS'
      - name: Native installed official v515 Owner business, Nginx TLS and new 516 private/major intent guards
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! P01_PRIVATE_BROWSER_E2E=YES \
            PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/p01-playwright-browsers" \
            P01_PRIVATE_LEGACY_ISOLATED=YES python3 \
            candidate/tests/integration/p01_private_legacy_full_http.py \
            --release-full "$RUNNER_TEMP/p01-private-old-release/VF-Start-V2.47.515-FULL.zip" \
            --candidate-root candidate >"$RUNNER_TEMP/p01-private-http.txt" 2>&1; then
            # The user/data is entirely synthetic. Only allowlisted fixed
            # test-owned failure classes may leave the temporary log.
            grep -Eo 'P01_PRIVATE_REAL_HTTP=FAIL:[A-Z0-9_]+' "$RUNNER_TEMP/p01-private-http.txt" | tail -n 4 || true
            exit 1
          fi
          for marker in \
            P01_P0_AUTHENTIC_515_FULL_SYNTHETIC_OWNER_INSTALLED=PASS \
            P01_P0_LEGACY_RELEASE_PRIVATE_OVERLAY_NO_OWNER_DATA_WRITE=PASS \
            P01_P0_12_GUEST_DENIED_12_OWNER_WORKSPACES_REAL_HTTPS=PASS \
            P01_P0_STATIC_ARCHIVE_PRIVATE_DENY_REAL_NGINX_FPM=PASS \
            P01_P0_CANONICAL_OWNER_LOGIN_AND_API_SEPARATION=PASS \
            P01_P0_OWNER_GUEST_CHROMIUM_THREE_VIEWPORTS=PASS \
            P01_P0_ROLLBACK_UNPATCHED_515_PUBLIC_READY=NO \
            P01_P0_OFFICIAL_RELEASE_ISOLATED_REHEARSAL=PASS; do
            grep -Fx "$marker" "$RUNNER_TEMP/p01-private-http.txt"
          done
          echo 'P01_PRIVATE_P0_V516_API_AND_V515_INSTALL_REAL_HTTP=PASS'
          echo 'P01_OWNER_MAJOR_UPGRADE_EXECUTABLE=NO'
      - name: Always purge private exact source and synthetic state
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate "$RUNNER_TEMP/p01-private-old-release" "$RUNNER_TEMP/p01-playwright-browsers"
          rm -f -- "$RUNNER_TEMP"/p01-private-*.txt "$RUNNER_TEMP"/p01-private-*.json "$RUNNER_TEMP"/p01-private-*.log
          echo 'P01_PRIVATE_SOURCE_AND_TEST_DATA_PERSISTED=NO'
          echo 'P01_PUBLIC_ARTIFACTS=NONE'
