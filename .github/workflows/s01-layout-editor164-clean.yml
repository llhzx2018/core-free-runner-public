name: S01 layout editor exact clean ZIP install
on:
  push:
    branches: [task/s01-layout-editor164-20261022]
    paths: ['.github/workflows/s01-layout-editor164-clean.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.164
  TARGET_SHA: 93fbf29f63beb46f8d6d390f3fe25e5365fe4d88
  TARGET_TREE: 72d60750ea28bb4668b7e13a69c495ce1b32b9bb
  BASE_SHA: c111556c137865d5d523fff2fbd52b57f9f77db3
jobs:
  clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          ref: 02d4591eed025a3d3a67bc0a150b3ddc448c2ab8
          persist-credentials: false
          path: established
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 93fbf29f63beb46f8d6d390f3fe25e5365fe4d88
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Native clean ZIP install and initial login
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p provider proof
          python3 control/lanes/s01-layout-editor164-20261022/package.py
          gh release download v1.25.94 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.94.zip --dir provider
          echo '70b90d40da5d69fc7819bd7ada3f15fb0145e64822b788bd94956c7827b2df03  provider/vf-tools-m3u8_V1.25.94.zip' | sha256sum -c
          cp -a established/lanes/s01-frontend-design-20261017 lane
          cp control/lanes/s01-layout-editor164-20261022/clean.cjs lane/clean.cjs
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          python3 - <<'PYCLEAN'
          from pathlib import Path
          s=Path('lane/native.sh').read_text().replace('provider/vf-tools-m3u8_V1.25.91.zip','provider/vf-tools-m3u8_V1.25.94.zip')
          s=s.split('docker cp lane/fixture.php')[0]
          marker='docker cp target/src/. "$WP:/var/www/html/wp-content/themes/vf-tools-theme/"'
          assert s.count(marker)==1
          s=s.replace(marker,'docker exec "$WP" rmdir /var/www/html/wp-content/themes/vf-tools-theme\ndocker cp provider/vf-tools-theme_V1.35.164.zip "$WP:/tmp/clean-theme.zip"\ncli theme install /tmp/clean-theme.zip >/dev/null')
          s+='\ncli theme activate vf-tools-theme >/dev/null\ntest "$(cli theme get vf-tools-theme --field=version)" = "1.35.164"\nnode lane/clean.cjs\necho EXACT_CLEAN_ZIP_INSTALL_PASS\n'
          Path('lane/clean.sh').write_text(s)
          PYCLEAN
          bash lane/clean.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-layout-editor-clean-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private runtime
        if: always()
        run: rm -rf target provider lane
