name: P01 V2.23 Unified Surface UI Authority Sync V2

on:
  push:
    branches:
      - task/p01-v222-multi-surface-gate-20260828
    paths:
      - '.github/workflows/p01-v223-ui-authority-sync-v2-20260828.yml'

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout runner scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: task/p01-v222-multi-surface-gate-20260828
          persist-credentials: false
      - name: Clone P01 feature and sync docs
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf product
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/vf-start.git" product
          git -C product checkout -q feature/p01-unified-surface-ui-v223-20260828
          test "$(git -C product rev-parse HEAD)" = 35926810f1f59738b3b47f7dff690253f4da0e1b
          python3 .github/scripts/p01-v223-ui-authority-sync.py
          python3 -m json.tool product/VF_PROJECT.json >/dev/null
          git -C product config user.name VictorForge
          git -C product config user.email llhzx2018@gmail.com
          git -C product add README.md CHANGELOG.md VF_PROJECT.json docs/README.md docs/authority/CURRENT.md docs/authority/RPD.md docs/authority/SSOT.md docs/authority/ACCEPTANCE_MATRIX.md docs/architecture/P01_MULTI_SURFACE_ARCHITECTURE.md docs/evidence/P01_V2.23.0_UNIFIED_SURFACE_UI_MACHINE_20260828.md src/README.md
          git -C product commit -m 'docs(P01): align V2.23 unified surface UI current authority'
          git -C product push origin feature/p01-unified-surface-ui-v223-20260828
          echo P01_V223_UI_AUTHORITY_SYNC=PASS
      - name: Remote branch readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C product fetch origin feature/p01-unified-surface-ui-v223-20260828
          test "$(git -C product rev-parse HEAD)" = "$(git -C product rev-parse origin/feature/p01-unified-surface-ui-v223-20260828)"
          git -C product diff HEAD^ --name-only
