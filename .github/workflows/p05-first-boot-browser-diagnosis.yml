name: P05 First Boot Browser Diagnosis

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p05-first-boot-browser-diagnosis.yml'

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Headless browser read-only diagnosis
        shell: bash
        run: |
          set -Eeuo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          echo "BROWSER_BIN=$(basename "$CHROME")"
          "$CHROME" --version
          rm -rf /tmp/p05chrome && mkdir -p /tmp/p05chrome
          set +e
          timeout 20s "$CHROME" \
            --headless=new --no-sandbox --disable-gpu \
            --user-data-dir=/tmp/p05chrome/profile \
            --enable-logging=stderr --log-level=0 \
            --dump-dom https://seo.kewaro.com/ \
            >/tmp/p05chrome/dom.html 2>/tmp/p05chrome/browser.stderr
          RC=$?
          set -e
          echo "BROWSER_COMMAND_RC=$RC"
          echo "DOM_ROOT_CHILDREN=$(python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/p05chrome/dom.html').read_text(errors='replace')
          m=re.search(r'<div id="root">(.*?)</div>',s,re.S)
          print('NONEMPTY' if m and m.group(1).strip() else 'EMPTY')
          PY
          )"
          echo '--- BROWSER_ERRORS ---'
          grep -Ei 'module|mime|javascript|tsx|failed|error|refused' /tmp/p05chrome/browser.stderr | tail -80 || true
          echo '--- DOM_PREFIX ---'
          sed -n '1,60p' /tmp/p05chrome/dom.html
          echo 'PRODUCTION_WRITE=0'
          echo 'PRODUCTION_NETWORK_WRITE_EXECUTED=NO'
