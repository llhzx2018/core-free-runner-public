name: P01 frontend canonical and maintenance preflight test-only
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-frontend-canonical-preflight-test-only.yml']
permissions:
  contents: read
jobs:
  p01-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - name: Checkout registered public Runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact current P01 main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 38cec870bce622d25b1cda806e5f7e55664cd95a
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - name: Checkout exact last stable release baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: v2.47.389
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: stable
      - name: Setup PHP 8.3, SQLite, Node
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,curl,mbstring,zip,gd,openssl
          coverage: none
      - name: Exact-source Canonical baseline, zero debt and maintenance boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "38cec870bce622d25b1cda806e5f7e55664cd95a"
          test "$(cat candidate/VERSION)" = 2.47.389
          test "$(cat candidate/src/VERSION.txt)" = 2.47.389
          test "$(cat stable/VERSION)" = 2.47.389
          test "$(cat stable/src/VERSION.txt)" = 2.47.389
          node --version
          php --version | head -n 2
          test -z "$(git -C candidate status --porcelain)"
          echo P01_EXACT_SOURCE_PRECHECK=PASS
          bash candidate/tests/canonical_release_regression.sh candidate stable --require-zero-debt | tee /tmp/p01-canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/p01-canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/p01-canonical.txt
          for file in src/app/UpdateManager.php src/app/CoreUpdates/UpdateCore.php src/app/CoreUpdates/GitHubClient.php; do
            cmp "stable/$file" "candidate/$file"
          done
          diff -qr stable/src/migrations candidate/src/migrations >/tmp/p01-migrations-diff.txt
          echo P01_MAINTENANCE_SCHEMA_UPDATER_UNCHANGED=PASS
          test -z "$(git -C candidate status --porcelain)"
          echo P01_FRONTEND_PRE_RELEASE_CANONICAL=PASS
      - name: Remove private source from runner workspace
        if: always()
        shell: bash
        run: rm -rf candidate stable
