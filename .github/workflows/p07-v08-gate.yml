name: P07 OneShot Bench v0.8 Gate

on:
  push:
    branches:
      - experiment/p07-oneshot-bench-v05
    paths:
      - .github/workflows/p07-v08-gate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load exact candidate
        shell: bash
        run: |
          set -euo pipefail
          git show c0f359a7dff7e5b7cbcdff5052cef0549316e349:experiments/p07-bench.sh > /tmp/p07-bench-v08.sh
          chmod +x /tmp/p07-bench-v08.sh
          grep -F 'VERSION="0.8.0"' /tmp/p07-bench-v08.sh
      - name: Syntax and self-test
        shell: bash
        run: |
          set -euo pipefail
          bash -n /tmp/p07-bench-v08.sh
          /tmp/p07-bench-v08.sh --version | grep -F '0.8.0'
          /tmp/p07-bench-v08.sh --self-test | grep -F 'SELF_TEST=PASS'
      - name: One-shot demo contract
        shell: bash
        run: |
          set -euo pipefail
          /tmp/p07-bench-v08.sh --demo >/tmp/demo
          grep -F 'P07 Enhanced Bench' /tmp/demo
          grep -F 'Evidence Quality' /tmp/demo
          ! grep -q '请选择\|Select option' /tmp/demo
      - name: Backend fail-fast and fallback contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'RATE_LIMITED' /tmp/p07-bench-v08.sh
          grep -F 'BACKEND_UNAVAILABLE' /tmp/p07-bench-v08.sh
          grep -F 'Remaining Ookla nodes skipped' /tmp/p07-bench-v08.sh
          grep -F 'Cloudflare Edge' /tmp/p07-bench-v08.sh
          grep -F 'speed.cloudflare.com/__down' /tmp/p07-bench-v08.sh
          grep -F 'speed.cloudflare.com/__up' /tmp/p07-bench-v08.sh
      - name: Real Cloudflare fallback endpoint smoke
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -fLsS --connect-timeout 5 --max-time 20 -o /tmp/cf-down.bin -w '%{http_code}' 'https://speed.cloudflare.com/__down?bytes=1000000')"
          test "$code" = 200
          test "$(wc -c </tmp/cf-down.bin)" -eq 1000000
          head -c 262144 /dev/zero >/tmp/cf-up.bin
          ucode="$(curl -fLsS --connect-timeout 5 --max-time 20 -X POST --data-binary @/tmp/cf-up.bin -o /dev/null -w '%{http_code}' 'https://speed.cloudflare.com/__up')"
          [[ "$ucode" =~ ^2[0-9][0-9]$ ]]
      - name: Same-shell wrapper contract
        shell: bash
        run: |
          set -euo pipefail
          ! grep -F 'output="$(speed_node ' /tmp/p07-bench-v08.sh
          grep -F 'speed_node "$id" "$name" >"$out"' /tmp/p07-bench-v08.sh
          grep -F 'speed_node "$id" "$label" >"$out"' /tmp/p07-bench-v08.sh
      - name: Safety boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E 'curl .*--insecure|curl .* -k|wget .*--no-check-certificate' /tmp/p07-bench-v08.sh
          ! grep -E 'sysctl -w|systemctl restart|reboot|shutdown' /tmp/p07-bench-v08.sh
          grep -F 'sha256sum' /tmp/p07-bench-v08.sh
