name: TEMP S01-C01 Theme 1.35.18 Product Gate

on:
  push:
    branches:
      - temp/s01-c01-theme-13518-gate-20260907

permissions:
  contents: read

concurrency:
  group: temp-s01-c01-theme-13518-gate
  cancel-in-progress: false

jobs:
  product-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact Theme candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 3956ce5e50b89978a42b404110acb4a61f029f8a
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact candidate identity and scope
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          test "$(git rev-parse HEAD)" = "3956ce5e50b89978a42b404110acb4a61f029f8a"
          git cat-file -e 4c89a0b78b0ab767ab0b80c702a65d2ccc0f84f0^{commit}
          git diff --name-only 4c89a0b78b0ab767ab0b80c702a65d2ccc0f84f0...3956ce5e50b89978a42b404110acb4a61f029f8a | sort > /tmp/actual-scope.txt
          cat > /tmp/expected-scope.txt <<'EOF'
          VERSION
          src/inc/admin/views/brand.php
          src/inc/admin/views/navigation.php
          src/style.css
          tests/deep-admin-human-language-contract.php
          tests/update-refresh-policy-contract.php
          tests/visible-console-v2-contract.php
          tests/workbench-primary-action-contract.php
          EOF
          sort -o /tmp/expected-scope.txt /tmp/expected-scope.txt
          diff -u /tmp/expected-scope.txt /tmp/actual-scope.txt
          echo 'EXACT_SCOPE=PASS'

      - name: PHP syntax gate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          php -l src/inc/admin/views/brand.php
          php -l src/inc/admin/views/navigation.php
          php -l tests/deep-admin-human-language-contract.php
          php -l tests/update-refresh-policy-contract.php
          php -l tests/visible-console-v2-contract.php
          php -l tests/workbench-primary-action-contract.php
          echo 'PHP_LINT=PASS'

      - name: Human language and regression contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          php tests/deep-admin-human-language-contract.php
          php tests/update-refresh-policy-contract.php
          php tests/visible-console-v2-contract.php
          php tests/workbench-primary-action-contract.php
          echo 'THEME_CONTRACTS=PASS'

      - name: Boundary checks
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          test "$(tr -d '\r\n' < VERSION)" = '1.35.18'
          grep -Fq 'Version: 1.35.18' src/style.css
          grep -Fq 'V1.35.18_S01_DEEP_HUMAN_LANGUAGE' src/style.css
          ! git diff 4c89a0b78b0ab767ab0b80c702a65d2ccc0f84f0...3956ce5e50b89978a42b404110acb4a61f029f8a -- src/assets/css src/inc/update src/inc/seo src/inc/recovery src/functions.php | grep -q '^[-+]'
          echo 'BOUNDARY=PASS'

      - name: Build public-safe receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/s01
          cat > evidence/s01/S01_C01_THEME_13518_PRODUCT_GATE.txt <<'EOF'
          PROJECT=S01-C01
          COMPONENT=VF_TOOLS_THEME
          CANDIDATE_VERSION=1.35.18
          CANDIDATE_SHA=3956ce5e50b89978a42b404110acb4a61f029f8a
          BASE_SHA=4c89a0b78b0ab767ab0b80c702a65d2ccc0f84f0
          EXACT_SCOPE=PASS
          PHP_LINT=PASS
          THEME_CONTRACTS=PASS
          BOUNDARY=PASS
          PRODUCT_GATE=PASS
          PRODUCTION_GATE=NOT_RUN
          PRODUCTION_WRITE=NO
          USER_MANUAL_EXECUTION_REQUIRED=NO
          EOF

      - name: Upload public-safe receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 Node24
        with:
          name: s01-c01-theme-13518-product-gate-${{ github.run_id }}
          path: evidence/s01/S01_C01_THEME_13518_PRODUCT_GATE.txt
          if-no-files-found: error
          retention-days: 14
