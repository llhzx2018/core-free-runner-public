name: S01 Theme exact formal release
on:
  push:
    branches: [task/s01-page-coverage160-20261021]
    paths: ['.github/workflows/s01-page-coverage-formal.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.160
  TARGET_SHA: 5eace6a0f761ddd7d6736591782b24d3c2bd4b2f
  TARGET_TREE: df7fe192e742dfbbb4ac029e90eb84ea3ccb90da
  BASE_SHA: 81338ba905c3b57b62e9531a2f7d906cfbb778ed
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 5eace6a0f761ddd7d6736591782b24d3c2bd4b2f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact verified candidate and merged source readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider candidate-proof
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/39577933256 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/39577933256 --jq .head_sha)" = b4ef1fd72e0cfe95be4efc6d683b037862955125
          test "$(gh api repos/$TARGET_REPO/commits/main --jq .sha)" = "$TARGET_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$TARGET_SHA --jq .tree.sha)" = "$TARGET_TREE"
          gh run download 39577933256 --repo llhzx2018/core-free-runner-public --name s01-page-coverage-39577933256 --dir candidate-proof
          python3 control/lanes/s01-page-coverage160-20261021/package.py
          python3 - <<'PYVERIFY'
          import json,pathlib
          old=json.loads(pathlib.Path('candidate-proof/package.json').read_text())
          new=json.loads(pathlib.Path('proof/package.json').read_text())
          browser=json.loads(pathlib.Path('candidate-proof/browser-results.json').read_text())
          assert browser['status']=='PASS' and browser['passed']==browser['count']
          for k in ['status','version','tree','sha256','bytes','files']:assert old[k]==new[k],k
          assert new['sha256']=='dea04c41d3e054f59b19c9ad952f1e2d242b2e79313e5656eee5376f2423c1f8' and new['bytes']==1974621
          print('MERGED_TREE_EQUALS_TESTED_TREE_AND_EXACT_PACKAGE_PASS')
          PYVERIFY
      - name: Formal release only exact verified bytes
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.35.160 --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create v1.35.160 provider/vf-tools-theme_V1.35.160.zip --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Theme V1.35.160' --notes '前台页面总览明确20种页型与实际页面数量的区别，各行常显包含页面、子类和状态范围，工具名读取现有目录配置，归档包含分类/标签/作者/日期，说明中英文、分页及公共布局归属。保留路由、内容、权限与验收记录。定向后台浏览器及159→160原生升级回退/重复安装、数据保护PASS；M3U8保持1.25.94。Owner手工升级Production后验收，手机暂缓。' --latest
          fi
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/v1.35.160 --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh release view v1.35.160 --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - name: Authenticated formal asset remote bytes readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download v1.35.160 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.160.zip --dir remote
          cmp provider/vf-tools-theme_V1.35.160.zip remote/vf-tools-theme_V1.35.160.zip
          echo 'dea04c41d3e054f59b19c9ad952f1e2d242b2e79313e5656eee5376f2423c1f8  remote/vf-tools-theme_V1.35.160.zip' | sha256sum -c
          test "$(stat -c %s remote/vf-tools-theme_V1.35.160.zip)" = 1974621
          gh release view v1.35.160 --repo "$TARGET_REPO" --json url,publishedAt,tagName > proof/formal-release.json
          echo FORMAL_RELEASE_EXACT_REMOTE_ASSET_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-coverage-formal-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources packages
        if: always()
        run: rm -rf target provider remote candidate-proof
