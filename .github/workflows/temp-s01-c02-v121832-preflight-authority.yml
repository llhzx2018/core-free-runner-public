name: TEMP S01-C02 Ops 1.21.832 Preflight Authority
on:
  push:
    branches:
      - temp/s01-c02-v121831-tail-replay-probe-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121832-preflight-authority.yml'
jobs:
  authority:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify Product and runner authority
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for b in main develop; do
            J="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/llhzx2018/vf-tools-ops/branches/$b")"
            test "$(jq -r .commit.sha <<<"$J")" = 'b0ef670e5a9564ad33329cfee8d5902bfe6a0d47'
          done
          J="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/core-free-runner-public/git/ref/heads/main)"
          test "$(jq -r .object.sha <<<"$J")" = '0160b557ad4ae0e8c6acd97e7551285bc05870bd'
          echo PASS_V121832_PREFLIGHT_AUTHORITY
