name: TEMP P01 S8 isolated Atomic and recovery unit proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p01-s8-isolated-20261124.yml'

permissions:
  contents: read

concurrency:
  group: temp-p01-s8-isolated-20261124-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  isolated-s8:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'test/p01-s8-isolated-')
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Read exact private P01 source into transient workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-startnew
          ref: f3f932a6853d0258f89b7a5f7884e48afb6f9b25
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
          fetch-depth: 1

      - name: Confirm source binding without printing private files
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C private-src rev-parse HEAD)" = "f3f932a6853d0258f89b7a5f7884e48afb6f9b25"
          echo 'P01_S8_EXACT_SOURCE=PASS'

      - name: Prepare Laravel 13 PHP 8.4 native extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, dom, xml, fileinfo, curl, openssl, zip, sodium
          tools: composer:v2
          coverage: none

      - name: Run only isolated S8 R23/R24 regression with sanitized summary
        working-directory: private-src
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          python3 scripts/check_php_syntax.py >"$RUNNER_TEMP/p01-s8-lint.log" 2>&1 || { echo 'P01_S8_PHP_LINT=FAIL'; exit 1; }
          echo 'P01_S8_PHP_LINT=PASS'
          composer install --no-interaction --prefer-dist --no-progress --quiet >"$RUNNER_TEMP/p01-s8-composer.log" 2>&1 || { echo 'P01_S8_COMPOSER=FAIL'; exit 1; }
          echo 'P01_S8_COMPOSER=PASS'
          export APP_ENV=testing
          export APP_KEY="base64:$(openssl rand -base64 32)"
          export DB_CONNECTION=sqlite
          export DB_DATABASE=:memory:
          set +e
          ./vendor/bin/phpunit --filter='(IsolatedAtomicUpgradeCycleTest|IsolatedAtomicInterruptedRecoveryTest|InstalledSqliteIsolatedRecoveryTest|InstalledSqlIsolatedRestoreCycleTest|InstalledBackupRecoveryReviewTest|InstalledFullGenerationInventoryPathTest|InstalledSqlSourceWitnessTest|InstalledLocalStorageCoverageTest|InstalledUploadSourceInventoryTest|EncryptedSnapshotTest|NewAtomicPackageInspectorTest|InstalledAtomicReadOnlyPreflightTest|InstalledBackupWriteFenceTest|InstalledBackupLaravelEventBoundaryTest)' >"$RUNNER_TEMP/p01-s8-phpunit.log" 2>&1
          RESULT=$?
          set -e
          python3 - "$RUNNER_TEMP/p01-s8-phpunit.log" <<'PY'
          import pathlib,re,sys
          t=pathlib.Path(sys.argv[1]).read_text(errors='replace')
          x=re.search(r'OK \((\d+) tests?, (\d+) assertions?\)',t)
          if x: print('P01_S8_COUNTS='+','.join(x.groups())+',0')
          else:
              x=re.search(r'Tests:\s*(\d+), Assertions:\s*(\d+)(?:, Failures:\s*(\d+))?(?:, Errors:\s*(\d+))?',t)
              print('P01_S8_COUNTS='+(','.join(y or '0' for y in x.groups()) if x else 'UNKNOWN'))
          for line in t.splitlines():
              m=re.match(r'^\d+\)\s+Tests\\Unit\\([A-Za-z0-9_]+)::(test_[A-Za-z0-9_]+)',line)
              if m: print('P01_S8_FAIL='+m.group(1)+'::'+m.group(2))
          PY
          if [ "$RESULT" -ne 0 ]; then echo 'P01_S8_ISOLATED_UNIT=FAIL'; exit "$RESULT"; fi
          echo 'P01_S8_ISOLATED_UNIT=PASS'

      - name: Always scrub private checkout and private test logs
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- private-src
          rm -f -- "$RUNNER_TEMP/p01-s8-lint.log" "$RUNNER_TEMP/p01-s8-composer.log" "$RUNNER_TEMP/p01-s8-phpunit.log"
          test ! -e private-src
