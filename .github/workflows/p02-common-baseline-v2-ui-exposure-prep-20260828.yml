name: P02 Common Baseline V2 UI Exposure Prep

on:
  push:
    paths:
      - '.github/workflows/p02-common-baseline-v2-ui-exposure-prep-20260828.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prep:
    runs-on: ubuntu-24.04
    env:
      BASE_SHA: 49c2bac2497ccc454c2134d3e491d76b2ff63d79
      PRODUCT_BRANCH: ui/common-baseline-v2-exposure-p02-20260828
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, zip
      - name: Checkout exact P02 branch
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/vf-library.git" p02 >/dev/null 2>&1
          cd p02
          git checkout "$PRODUCT_BRANCH"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git remote set-url origin https://github.com/llhzx2018/vf-library.git
          echo P02_UI_EXPOSURE_SOURCE_FENCE=PASS
      - name: Apply narrow UI exposure patch
        run: |
          set -Eeuo pipefail
          cd p02
          python3 - <<'PY'
          from pathlib import Path

          app = Path('public/assets/app.js')
          text = app.read_text(encoding='utf-8')
          start = text.index('function settingsNav(){return [')
          end = text.index('\nfunction settingsNavMarkup', start)
          new_nav = "function settingsNav(){return [{id:'basic',group:'日常偏好',label:'基础设置',desc:'品牌、主题与常用偏好'},{id:'content',group:'日常偏好',label:'内容与分类',desc:'目录和内容规则'},{id:'display',group:'日常偏好',label:'显示与排序',desc:'密度、排序与阅读呈现'},{id:'search',group:'日常偏好',label:'搜索与使用',desc:'搜索范围与使用行为'},{id:'transfer',group:'数据与迁移',label:'导入与导出',desc:'迁入、治理与搬出'},{id:'system-info',group:'系统维护',label:'系统信息',desc:'查看当前运行事实',href:'/system-info.php'},{id:'system-baseline',group:'系统维护',label:'系统基线',desc:'查看 Common Product Baseline V2 运行结果',href:'/system-baseline.php'},{id:'updates',group:'系统维护',label:'在线升级',desc:'检查并安装正式版本'},{id:'backup',group:'系统维护',label:'备份与恢复',desc:'自动备份、快照与恢复'},{id:'runtime-health',group:'系统维护',label:'运行健康',desc:'查看环境、数据库与存储健康',href:'/diagnose.php'},{id:'security',group:'系统维护',label:'安全与隐私',desc:'隐私合同和安全维护'}];}"
          text = text[:start] + new_nav + text[end:]

          start = text.index('function settingsNavMarkup(nav){')
          end = text.index('\nfunction selectOptions', start)
          new_markup = "function settingsNavMarkup(nav){let group='';return nav.map(x=>{const label=x.group!==group?'<div class=\\\"settings-nav-label\\\">'+esc(x.group)+'</div>':'';group=x.group;const action=x.href?' data-settings-href=\\\"'+attr(x.href)+'\\\"':' data-settings-section=\\\"'+x.id+'\\\"';return label+'<button'+action+' class=\\\"'+(!x.href&&state.settingsSection===x.id?'active':'')+'\\\"><span>'+esc(x.label)+'</span></button>';}).join('');}"
          text = text[:start] + new_markup + text[end:]

          old = "$$('[data-settings-section]').forEach(button=>button.onclick=()=>{state.settingsSection=button.dataset.settingsSection;renderSettings({scrollTop:0});});const back=$('#settingsBack');"
          new = "$$('[data-settings-section]').forEach(button=>button.onclick=()=>{state.settingsSection=button.dataset.settingsSection;renderSettings({scrollTop:0});});$$('[data-settings-href]').forEach(button=>button.onclick=()=>window.location.assign(button.dataset.settingsHref));const back=$('#settingsBack');"
          if old not in text:
              raise SystemExit('settings link wiring anchor missing')
          text = text.replace(old, new, 1)
          app.write_text(text, encoding='utf-8')

          diagnose = Path('public/diagnose.php')
          d = diagnose.read_text(encoding='utf-8')
          d = d.replace('<title>VF Library 环境诊断</title>', '<title>运行健康 · VF Library</title>', 1)
          d = d.replace('<h1>VF Library 环境诊断</h1>', '<h1>运行健康</h1>', 1)
          d = d.replace('<div class="ok">诊断信息仅对已登录管理员显示。</div>', '<div class="ok">只读显示当前运行环境、数据库与存储健康事实；仅对已登录管理员显示。</div>', 1)
          diagnose.write_text(d, encoding='utf-8')

          for name in ['public/system-info.php','public/system-baseline.php']:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              s = s.replace('href="/#settings=security">运行健康', 'href="/diagnose.php">运行健康')
              s = s.replace('href="/#settings=update">在线升级', 'href="/">在线升级')
              p.write_text(s, encoding='utf-8')

          test = Path('tests/unit/common_baseline_ui_exposure_contract.mjs')
          test.write_text(r'''import fs from 'node:fs';
import assert from 'node:assert/strict';

const app = fs.readFileSync('public/assets/app.js','utf8');
const diagnose = fs.readFileSync('public/diagnose.php','utf8');
const info = fs.readFileSync('public/system-info.php','utf8');
const baseline = fs.readFileSync('public/system-baseline.php','utf8');

for (const label of ['系统信息','系统基线','在线升级','备份与恢复','运行健康']) {
  assert.ok(app.includes(`label:'${label}'`), `missing visible maintenance label: ${label}`);
}
assert.ok(app.includes("href:'/system-info.php'"));
assert.ok(app.includes("href:'/system-baseline.php'"));
assert.ok(app.includes("href:'/diagnose.php'"));
assert.ok(app.includes("data-settings-href"));
assert.ok(app.includes("window.location.assign(button.dataset.settingsHref)"));
assert.ok(diagnose.includes('<title>运行健康 · VF Library</title>'));
assert.ok(diagnose.includes('<h1>运行健康</h1>'));
assert.ok(info.includes('href="/diagnose.php">运行健康'));
assert.ok(baseline.includes('href="/diagnose.php">运行健康'));
assert.ok(!app.includes("label:'公共规范'"), 'do not create a duplicate public-spec center');
console.log('COMMON_BASELINE_UI_EXPOSURE_CONTRACT=PASS');
''', encoding='utf-8')
          PY
      - name: Validate patch and regression contract
        run: |
          set -Eeuo pipefail
          cd p02
          node --check public/assets/app.js
          php -l public/diagnose.php
          php -l public/system-info.php
          php -l public/system-baseline.php
          node tests/unit/common_baseline_ui_exposure_contract.mjs
          php src/cli/baseline-verify.php
          python3 scripts/repository-gates.py
          git diff --check
          mapfile -t changed < <(git diff --name-only "$BASE_SHA"...HEAD; git diff --name-only)
          printf '%s\n' "${changed[@]}" | sed '/^$/d' | sort -u > /tmp/changed.txt
          cat /tmp/changed.txt
          allowed='^(public/assets/app\.js|public/diagnose\.php|public/system-info\.php|public/system-baseline\.php|tests/unit/common_baseline_ui_exposure_contract\.mjs)$'
          if grep -Ev "$allowed" /tmp/changed.txt; then echo 'Scope violation'; exit 41; fi
          echo P02_UI_EXPOSURE_PATCH_GATE=PASS
      - name: Commit and push exact patch
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          cd p02
          git add public/assets/app.js public/diagnose.php public/system-info.php public/system-baseline.php tests/unit/common_baseline_ui_exposure_contract.mjs
          git commit -m 'ui(P02): expose Common Baseline system surfaces'
          git remote set-url origin "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/vf-library.git"
          git push origin HEAD:"$PRODUCT_BRANCH"
          git remote set-url origin https://github.com/llhzx2018/vf-library.git
          echo P02_UI_EXPOSURE_PATCH_PUSH=PASS
