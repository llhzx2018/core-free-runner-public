name: P08 v013 real HTTPS Owner update UI Chromium responsive proof
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/p08-v013-real-https-owner.yml]
permissions:
  contents: read
jobs:
  real-https-owner:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.ref == 'proof/p08-v013-candidate-source-20261119' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      P08_ISOLATED_INSTALL_TEST: 'YES'
      P08_CANDIDATE_SOURCE_SHA: f0865a5ecfb399ea1297c157d605f17240ff9ab2
      P08_CANDIDATE_VERSION: '0.1.13'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Exact private P08 candidate checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: f0865a5ecfb399ea1297c157d605f17240ff9ab2
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p08
      - name: Exact GOV-DOC Mode U candidate checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: a6e476ccc54fec29cf5264177cf65675b282d4da
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov
      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: zip,curl,mbstring,pdo_mysql,pdo_sqlite,sqlite3,openssl,posix,dom,intl,fileinfo
          coverage: none
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and strictly verify genuine FULL candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p08 rev-parse HEAD)" = "$P08_CANDIDATE_SOURCE_SHA"
          cd p08
          npm ci --no-audit --no-fund
          npm run build
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          git diff --exit-code
          git diff --cached --exit-code
          mapfile -t generated < <(git ls-files --others --exclude-standard)
          for f in "${generated[@]}"; do
            case "$f" in
              bootstrap/cache/packages.php|bootstrap/cache/services.php)
                test -f "$f" && ! test -L "$f" && rm -- "$f"
                ;;
              *) echo "P08_BROWSER_UNEXPECTED_UNTRACKED=$f"; exit 28 ;;
            esac
          done
          test -z "$(git status --porcelain --untracked-files=all)"
          python3 scripts/build_full.py --source "$PWD" \
            --output "$RUNNER_TEMP/p08-v013-https-full.zip" \
            --version 0.1.13 --source-sha "$P08_CANDIDATE_SOURCE_SHA" \
            --governance-root "$GITHUB_WORKSPACE/gov"
          sha256sum "$RUNNER_TEMP/p08-v013-https-full.zip" | cut -d' ' -f1 | sed 's/^/P08_V013_BROWSER_FULL_SHA256=/'
          site="$RUNNER_TEMP/p08-v013-https-site"
          mkdir -p "$site"
          unzip -q "$RUNNER_TEMP/p08-v013-https-full.zip" -d "$site"
          mkdir -p "$site/database"
          touch "$site/database/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.sqlite"
          chmod 0600 "$site/database/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.sqlite"
          echo P08_V013_HTTPS_EXACT_FINAL_FULL=PASS
      - name: Real HTTPS session and responsive Chromium run against extracted ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          site="$RUNNER_TEMP/p08-v013-https-site"
          cat > "$RUNNER_TEMP/p08-v013-router.php" <<'PHP'
          <?php
          $_SERVER['HTTPS']='on';
          $_SERVER['SERVER_PORT']=443;
          $_SERVER['HTTP_HOST']='127.0.0.1:18479';
          $_SERVER['SERVER_NAME']='127.0.0.1';
          $root=getenv('P08_V013_HTTPS_SITE');
          $path=parse_url((string)($_SERVER['REQUEST_URI']??'/'),PHP_URL_PATH);
          $static=is_string($path)?realpath($root.'/public'.$path):false;
          if ($static!==false && is_string($static) && $path!=='/'
              && str_starts_with($static,$root.'/public/')
              && is_file($static) && !str_ends_with($static,'.php')) return false;
          if ($path==='/setup.php') {
            if (strtoupper((string)($_SERVER['REQUEST_METHOD']??''))==='POST') {
              $origin=(string)($_SERVER['HTTP_ORIGIN']??'');
              $expected='https://'.(string)($_SERVER['HTTP_HOST']??'');
              $class=$origin===$expected?'EXACT':($origin==='null'?'OPAQUE_NULL':($origin===''?'MISSING':'OTHER_REDACTED'));
              error_log('P08_SETUP_SERVER_ORIGIN_CLASS='.$class);
            }
            $_SERVER['SCRIPT_NAME']='/setup.php';
            $_SERVER['PHP_SELF']='/setup.php';
            require $root.'/public/setup.php';
          } else {
            $_SERVER['SCRIPT_NAME']='/index.php';
            $_SERVER['PHP_SELF']='/index.php';
            require $root.'/public/index.php';
          }
          PHP
          cat > "$RUNNER_TEMP/p08-v013-tls.py" <<'PY'
          import http.client,http.server,ssl,sys
          cert,key=sys.argv[1:3]
          class Handler(http.server.BaseHTTPRequestHandler):
              protocol_version='HTTP/1.1'
              def relay(self):
                  n=int(self.headers.get('Content-Length','0'))
                  body=self.rfile.read(n) if n else None
                  upstream=http.client.HTTPConnection('127.0.0.1',18079,timeout=120)
                  headers={k:v for k,v in self.headers.items() if k.lower() not in ('connection','transfer-encoding','proxy-connection')}
                  upstream.request(self.command,self.path,body=body,headers=headers)
                  r=upstream.getresponse();data=r.read()
                  self.send_response(r.status)
                  for k,v in r.getheaders():
                      if k.lower() not in ('connection','content-length','transfer-encoding','date','server'):
                          self.send_header(k,v)
                  self.send_header('Content-Length',str(len(data)))
                  self.end_headers();self.wfile.write(data);upstream.close()
              do_GET=do_POST=do_PUT=do_DELETE=relay
              def log_message(self,*a):pass
          server=http.server.ThreadingHTTPServer(('127.0.0.1',18479),Handler)
          ctx=ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
          ctx.load_cert_chain(cert,key)
          server.socket=ctx.wrap_socket(server.socket,server_side=True)
          server.serve_forever()
          PY
          openssl req -x509 -nodes -newkey rsa:2048 -keyout "$RUNNER_TEMP/p08-v013-key.pem" -out "$RUNNER_TEMP/p08-v013-cert.pem" -subj /CN=127.0.0.1 -days 1 >/dev/null 2>&1
          P08_V013_HTTPS_SITE="$site" php -S 127.0.0.1:18079 -t "$site/public" "$RUNNER_TEMP/p08-v013-router.php" > "$RUNNER_TEMP/p08-v013-php.log" 2>&1 &
          php_pid=$!
          python3 "$RUNNER_TEMP/p08-v013-tls.py" "$RUNNER_TEMP/p08-v013-cert.pem" "$RUNNER_TEMP/p08-v013-key.pem" > "$RUNNER_TEMP/p08-v013-edge.log" 2>&1 &
          tls_pid=$!
          trap 'grep -o "P08_SETUP_SERVER_ORIGIN_CLASS=[A-Z_]*" "$RUNNER_TEMP/p08-v013-php.log" 2>/dev/null | tail -3 || true; kill "$php_pid" "$tls_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 35); do
            if curl -kfsS --max-time 4 https://127.0.0.1:18479/setup.php -o "$RUNNER_TEMP/p08-v013-setup.html"; then break; fi
            sleep 1
          done
          grep -q '第一次安装' "$RUNNER_TEMP/p08-v013-setup.html"
          cat > p08/tests/e2e/v013-release-https-owner.spec.ts <<'TEST'
          import { test, expect } from '@playwright/test'
          import { mkdirSync, existsSync, chmodSync, rmdirSync } from 'node:fs'
          import { join } from 'node:path'
          test.use({ ignoreHTTPSErrors: true })
          test('real HTTPS pre-install guard, Owner login and verified status with exact live 503 fail-closed', async ({ page, request }) => {
            test.setTimeout(110_000)
            const site = process.env.P08_V013_HTTPS_SITE || ''
            const temp = process.env.RUNNER_TEMP || ''
            expect(process.env.GITHUB_ACTIONS).toBe('true')
            expect(site).toBe(join(temp,'p08-v013-https-site'))
            const jsErrors: string[] = []
            const unintendedUpdatePosts: string[] = []
            page.on('pageerror', e => jsErrors.push(e.message))
            page.on('request', r => {
              if (r.method() === 'POST' && r.url().includes('/app/system/update/next/')) {
                unintendedUpdatePosts.push(r.url())
              }
            })
            // Before FIRST installation, public/index.php intentionally
            // returns a plain 503 on all non-setup paths. Verify this protection,
            // then verify guest redirect AFTER setup. Do not broaden the status allowlist.
            const before = await request.get('/app/system/update/next/status', {
              failOnStatusCode: false, maxRedirects: 0
            })
            expect(before.status()).toBe(503)
            expect(await before.text()).toContain('has not completed secure first installation')
            console.log('P08_V013_PREINSTALL_503_GUARD=PASS')
            await page.goto('/setup.php')
            await expect(page.getByRole('heading', { name: '第一次安装' })).toBeVisible()
            await page.locator('#site_name').fill('P08 isolated v013')
            await page.locator('#owner_username').fill('owner013')
            await page.locator('#owner_email').fill('owner013@isolated.example')
            await page.locator('#owner_password').fill('P08-Only-Synthetic-v013!12345')
            await page.locator('#owner_confirm').fill('P08-Only-Synthetic-v013!12345')
            await page.locator('#db_driver').selectOption('sqlite')
            await page.locator('#db_database').fill('a'.repeat(32) + '.sqlite')
            await page.locator('#github_token_later').check()
            // One explicit POST only. The earlier test guessed from a missing
            // heading; capture the actual HTTP result and a fixed, secret-free
            // validation category before making any source-defect claim.
            const installResponse = page.waitForResponse(r =>
              r.url().endsWith('/setup.php') && r.request().method() === 'POST',
              { timeout: 65000 })
            await page.getByRole('button', { name: '开始安装' }).click()
            const observed = await installResponse
            const httpCode = observed.status()
            const sentOrigin = await observed.request().headerValue('origin')
            const expectedOrigin = 'https://127.0.0.1:18479'
            const clientOriginClass = sentOrigin === expectedOrigin ? 'EXACT'
              : sentOrigin === 'null' ? 'OPAQUE_NULL'
              : !sentOrigin ? 'MISSING' : 'OTHER_REDACTED'
            console.log('P08_V013_BROWSER_POST_ORIGIN_CLASS=' + clientOriginClass)
            const html = await observed.text()
            console.log('P08_V013_REAL_HTTPS_INSTALL_POST_STATUS=' + httpCode)
            if (httpCode !== 200 || !html.includes('<h1>安装成功</h1>')) {
              const messages: Array<[string,string]> = [
                ['SQLite 必须先在本站私有 database/', 'SQLITE_PRIVATE_PROOF_MISSING'],
                ['安装表单已过期或来源不正确', 'SETUP_CSRF_REJECTED'],
                ['安装表单来源与当前 HTTPS', 'SETUP_ORIGIN_REJECTED'],
                ['安装已开始但未完成', 'POST_INTENT_COMMITTED_BUT_UNFINISHED'],
                ['安装包尚未通过正式 FULL', 'FULL_PACKAGE_UNVERIFIED'],
                ['安装会话无法恢复', 'SETUP_SESSION_FAILURE'],
                ['首次安装私密会话目录不可写', 'SETUP_SESSION_UNWRITABLE'],
                ['数据库连接检查未通过', 'DB_PREFLIGHT_FAILED'],
                ['当前网站 PHP 版本过低', 'PHP_RUNTIME_UNSUPPORTED'],
                ['检测到已安装或正在安装', 'INSTALLED_GUARD'],
              ]
              const klass = messages.find(([message]) => html.includes(message))?.[1] || 'OTHER_REDACTED'
              console.log('P08_V013_REAL_HTTPS_INSTALL_SAFE_CLASS=' + klass)
              console.log('P08_V013_REAL_HTTPS_INSTALL_ENV_PRESENT=' + existsSync(join(site,'.env')))
              console.log('P08_V013_REAL_HTTPS_INSTALL_INTENT_PRESENT='
                + existsSync(join(site,'storage/app/private/adops/installation/install-state.json')))
            }
            expect(httpCode).toBe(200)
            expect(html).toContain('<h1>安装成功</h1>')
            await expect(page.getByRole('heading', { name: '安装成功' })).toBeVisible()
            const guest = await request.get('/app/system/update/next/status', {
              failOnStatusCode: false, maxRedirects: 0
            })
            expect([302,401,403]).toContain(guest.status())
            console.log('P08_V013_INSTALLED_GUEST_AUTH_GUARD=PASS')
            await page.goto('/login')
            await page.getByLabel('邮箱或管理员账号').fill('owner013')
            await page.getByLabel('密码').fill('P08-Only-Synthetic-v013!12345')
            await page.getByRole('button', { name: '登录', exact: true }).click()
            await expect(page).toHaveURL(/\/app(?:\?.*)?$/, { timeout: 20000 })
            await page.getByRole('button', { name: '系统更新' }).click()
            await expect(page.getByText('当前安装版本')).toBeVisible()
            await expect(page.getByText('0.1.13', { exact: true }).first()).toBeVisible()
            for (const width of [390,768,1440]) {
              await page.setViewportSize({ width, height: 830 })
              const overflow = await page.evaluate(() =>
                document.documentElement.scrollWidth > document.documentElement.clientWidth + 1)
              expect(overflow, 'horizontal overflow at '+width).toBe(false)
            }
            const normal = await page.request.get('/app/system/update/next/status', {
              failOnStatusCode: false, headers: { Accept: 'application/json' }
            })
            expect(normal.status()).toBe(200)
            expect(await normal.json()).toMatchObject({ status: 'NONE', can_upgrade: false })
            // Recreate a malformed site-user directory ONLY inside this
            // disposable Runner FULL. The controller must actively return 503
            // JSON rather than leak an exception or invent NEEDS_RECOVERY.
            const unsafeDir = join(site,'storage/app/private/adops/owner-next-update')
            expect(existsSync(unsafeDir)).toBe(false)
            mkdirSync(unsafeDir, { mode: 0o755 })
            chmodSync(unsafeDir, 0o755)
            try {
              const denied = await page.request.get('/app/system/update/next/status', {
                failOnStatusCode: false, headers: { Accept: 'application/json' }
              })
              expect(denied.status()).toBe(503)
              const value = await denied.json()
              expect(value).toMatchObject({ status: 'STATE_UNAVAILABLE', can_upgrade: false })
              expect(JSON.stringify(value)).not.toContain('P08_FUTURE_PRIVATE')
              console.log('P08_V013_CONTROLLER_EXECUTABLE_SAFE_READ_503=PASS')
            } finally {
              chmodSync(unsafeDir,0o700)
              rmdirSync(unsafeDir)
            }
            const recovered = await page.request.get('/app/system/update/next/status', {
              failOnStatusCode: false, headers: { Accept: 'application/json' }
            })
            expect(recovered.status()).toBe(200)
            expect((await recovered.json()).status).toBe('NONE')
            const csrf = await page.request.post('/app/system/update/next/one-click', {
              failOnStatusCode: false, headers: { Accept: 'application/json' },
              form: { _token: 'deliberately-invalid-token' }
            })
            expect(csrf.status()).toBe(419)
            expect(unintendedUpdatePosts).toEqual([])
            expect(jsErrors).toEqual([])
            console.log('P08_V013_REAL_HTTPS_OWNER_STATUS_AND_CSRF=PASS')
            console.log('P08_V013_REAL_HTTPS_UPDATES_RESPONSIVE_390_768_1440=PASS')
            console.log('P08_V013_NO_PASSIVE_ATOMIC_POST=PASS')
          })
          TEST
          ( cd p08
            npx playwright install chromium >/dev/null
            P08_V013_HTTPS_SITE="$site" P08_TEST_BASE_URL=https://127.0.0.1:18479 \
              npx playwright test tests/e2e/v013-release-https-owner.spec.ts \
              --config playwright.config.ts --workers=1 --reporter=line
          )
          echo P08_V013_CANDIDATE_HTTPS_BROWSER=PASS
      - name: Destroy all private code browser sites and TLS keys
        if: always()
        shell: bash
        run: |
          rm -rf -- p08 gov "$RUNNER_TEMP/p08-v013-https-site" "$RUNNER_TEMP/p08-v013-https-full.zip"
          rm -f -- "$RUNNER_TEMP"/p08-v013-{router.php,tls.py,php.log,edge.log,key.pem,cert.pem,setup.html}
          test ! -e p08 && test ! -e gov
          echo P08_V013_HTTPS_PRIVATE_SOURCE_CLEANUP=PASS
