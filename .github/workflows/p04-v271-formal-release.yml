name: P04 VF Infra V2.7.1 Formal Release Readback

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/p04-v271-formal-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify exact tag release and update asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          gh api repos/llhzx2018/vf-infra/git/ref/tags/v2.7.1 > evidence/tag.json
          gh api repos/llhzx2018/vf-infra/releases/tags/v2.7.1 > evidence/release.json
          python3 - <<'PY'
          import json
          tag=json.load(open('evidence/tag.json'))
          rel=json.load(open('evidence/release.json'))
          assert tag['object']['sha']=='f14deef2748935069e17781d4a79214a2d8b8b5f',tag['object']['sha']
          assert rel['tag_name']=='v2.7.1'
          assert rel['name']=='VF Infra V2.7.1'
          assert rel['draft'] is False and rel['prerelease'] is False
          names={a['name'] for a in rel.get('assets',[])}
          required={
            'VF_Infra_V2.7.1_FULL.zip','VF_Infra_V2.7.1_UPDATE.zip','VF_Infra_V2.7.1_ATOMIC.zip',
            'repair-v2.7.1.php','PACKAGE_MANIFEST.json','PRODUCTION_SOURCE_MANIFEST_EXPECTED.txt',
            'SHA256SUMS.txt','FORMAL_ARTIFACT_MANIFEST.json','RELEASE_MANIFEST.json','RELEASE_NOTES.md'
          }
          missing=sorted(required-names)
          assert not missing,missing
          update=next(a for a in rel['assets'] if a['name']=='VF_Infra_V2.7.1_UPDATE.zip')
          manifest=next(a for a in rel['assets'] if a['name']=='RELEASE_MANIFEST.json')
          open('evidence/update_asset_id','w').write(str(update['id']))
          open('evidence/manifest_asset_id','w').write(str(manifest['id']))
          print('P04_V271_RELEASE_ASSET_SET_PASS')
          print('P04_V271_RELEASE_ID='+str(rel['id']))
          print('P04_V271_RELEASED_AT='+str(rel.get('published_at') or rel.get('created_at')))
          print('P04_V271_UPDATE_ASSET_ID='+str(update['id']))
          print('P04_V271_UPDATE_ASSET_BYTES='+str(update['size']))
          print('P04_V271_UPDATE_ASSET_DIGEST='+str(update.get('digest')))
          PY
          UPDATE_ID=$(cat evidence/update_asset_id)
          MANIFEST_ID=$(cat evidence/manifest_asset_id)
          gh api -H 'Accept: application/octet-stream' repos/llhzx2018/vf-infra/releases/assets/$UPDATE_ID > evidence/VF_Infra_V2.7.1_UPDATE.zip
          gh api -H 'Accept: application/octet-stream' repos/llhzx2018/vf-infra/releases/assets/$MANIFEST_ID > evidence/RELEASE_MANIFEST.json
          SHA=$(sha256sum evidence/VF_Infra_V2.7.1_UPDATE.zip | awk '{print $1}')
          BYTES=$(stat -c %s evidence/VF_Infra_V2.7.1_UPDATE.zip)
          python3 - "$SHA" "$BYTES" <<'PY'
          import json,sys
          sha=sys.argv[1]; n=int(sys.argv[2])
          rel=json.load(open('evidence/release.json'))
          man=json.load(open('evidence/RELEASE_MANIFEST.json'))
          update=next(a for a in rel['assets'] if a['name']=='VF_Infra_V2.7.1_UPDATE.zip')
          assert update['size']==n,(update['size'],n)
          digest=update.get('digest') or ''
          if digest.startswith('sha256:'): assert digest.split(':',1)[1]==sha,(digest,sha)
          assert man['version']=='2.7.1',man
          assert man['source_version']=='2.7.0',man
          assert int(man['schema'])==14,man
          assert man['migration']=='NONE',man
          assert man['product_commit']=='f14deef2748935069e17781d4a79214a2d8b8b5f',man
          assert man['product_tree']=='e0b1ed2c63584a477e65e0dae30cdc22dff60262',man
          a=man['artifacts']['VF_Infra_V2.7.1_UPDATE.zip']
          assert a['bytes']==n,(a['bytes'],n)
          assert a['sha256']==sha,(a['sha256'],sha)
          summary={
            'status':'PASS','tag':'v2.7.1','tag_target':'f14deef2748935069e17781d4a79214a2d8b8b5f',
            'release_id':rel['id'],'released_at':rel.get('published_at') or rel.get('created_at'),
            'asset_name':'VF_Infra_V2.7.1_UPDATE.zip','asset_id':update['id'],'asset_bytes':n,'asset_sha256':sha,
            'source_version':'2.7.0','target_version':'2.7.1','schema_from':'14','schema_to':'14','migration':'NONE',
            'release_product_tree':'e0b1ed2c63584a477e65e0dae30cdc22dff60262'
          }
          open('evidence/RELEASE_READBACK.json','w').write(json.dumps(summary,ensure_ascii=False,indent=2)+'\n')
          print('P04_V271_RELEASE_REMOTE_READBACK_PASS')
          print('P04_V271_UPDATE_SHA256='+sha)
          print('P04_V271_UPDATE_BYTES='+str(n))
          PY
          rm -f evidence/VF_Infra_V2.7.1_UPDATE.zip
      - name: Upload safe readback evidence
        uses: actions/upload-artifact@v4
        with:
          name: P04-V2.7.1-Release-Remote-Readback
          path: |
            evidence/RELEASE_READBACK.json
            evidence/RELEASE_MANIFEST.json
          if-no-files-found: error
          retention-days: 14
