name: P04 VF Infra V2.7.1 Formal Release

on:
  push:
    branches:
      - p04-v271-formal-release-tmp
    paths:
      - '.github/workflows/p04-v271-formal-release.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/p04-v271-formal-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p04-v271-formal-release
  cancel-in-progress: false

jobs:
  formal-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout release harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout exact V2.7.1 candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: f14deef2748935069e17781d4a79214a2d8b8b5f
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
          fetch-depth: 2
          path: private-vf-infra-target

      - name: Checkout exact V2.7.0 production source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: f52427359f24c7944f6c7f5c8d2401dd28ebee05
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-vf-infra-source

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, fileinfo, sodium, zip, curl, mbstring
          coverage: none

      - name: Derive V2.7.1 formal release harness from proven V2.7.0 contract
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/d02df7406a5eb3eb106e32754fac76f89a2dc897/.github/scripts/p04-v270-formal-release.sh' -o "$RUNNER_TEMP/p04-v271-formal-release.sh"
          python3 - "$RUNNER_TEMP/p04-v271-formal-release.sh" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          s=p.read_text(encoding='utf-8')
          s=s.replace('TARGET_COMMIT="e2fd12cce0518333d7aa15e9d5babc5db0c9043b"','TARGET_COMMIT="f14deef2748935069e17781d4a79214a2d8b8b5f"')
          s=s.replace('TARGET_PARENT="f86d79b871cf05c90af922afeb9fca851faf7c54"','TARGET_PARENT="f95446940bf533d3f39d468a09d3a1b9157abac3"')
          s=s.replace('TARGET_TREE="0395a8b8b702faee2f7d2bbab7a3b65ee98915e9"','TARGET_TREE="e0b1ed2c63584a477e65e0dae30cdc22dff60262"')
          s=s.replace('SOURCE_COMMIT="b8d080e432ba811f6689372636022774e558ffc1"','SOURCE_COMMIT="f52427359f24c7944f6c7f5c8d2401dd28ebee05"')
          s=s.replace('SOURCE_TREE="181cb02c1305500006f8cfe70a0e05bdf3ad7225"','SOURCE_TREE="4b1bde5322509c7e3e7fdee3090d2e6eec17d593"')
          s=s.replace('EXPECTED_RUNTIME_FILES="185"','EXPECTED_RUNTIME_FILES="187"')
          s=s.replace('EXPECTED_RUNTIME_FINGERPRINT="996165dcadb5100fc68cd47515b28a6bc71e6e6f8b2fe7e7fe7713dcbe765401"','EXPECTED_RUNTIME_FINGERPRINT="650afb4e5464b8f80ac8b959ce206d39da9bc27c077bc635086a2e14f865f7b5"')
          s=s.replace("'tested_runtime_parent':'f86d79b871cf05c90af922afeb9fca851faf7c54'","'tested_runtime_source':'f14deef2748935069e17781d4a79214a2d8b8b5f'")
          s=s.replace('vfi270','vfi271').replace('atomic_270','atomic_271')
          s=s.replace('P04_V270','P04_V271').replace('p04-v270','p04-v271')
          s=s.replace('V270_','V271_')
          s=s.replace('V2.7.0','__TARGET_UPPER__').replace('V2.6.0','__SOURCE_UPPER__')
          s=s.replace('2.7.0','__TARGET__').replace('2.6.0','__SOURCE__')
          s=s.replace('v2.7.0','__TAG__')
          s=s.replace('__TARGET_UPPER__','V2.7.1').replace('__SOURCE_UPPER__','V2.7.0')
          s=s.replace('__TARGET__','2.7.1').replace('__SOURCE__','2.7.0').replace('__TAG__','v2.7.1')
          s=s.replace('Reference-Locked Personal Infrastructure Runtime 与最终 UI 精修','One Product / One Shell / One Information Architecture 统一修复')
          s=s.replace('完成 Reference-Locked Personal Infrastructure Runtime 与最终 UI 精修','完成 Split Shell / Split IA / Function Ownership 统一修复')
          p.write_text(s,encoding='utf-8')
          PY
          chmod +x "$RUNNER_TEMP/p04-v271-formal-release.sh"
          grep -F 'TARGET_VERSION="2.7.1"' "$RUNNER_TEMP/p04-v271-formal-release.sh"
          grep -F 'SOURCE_VERSION="2.7.0"' "$RUNNER_TEMP/p04-v271-formal-release.sh"
          grep -F 'TAG="v2.7.1"' "$RUNNER_TEMP/p04-v271-formal-release.sh"

      - name: Build verify publish and remote-readback V2.7.1
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: bash "$RUNNER_TEMP/p04-v271-formal-release.sh"

      - name: Remove all private source and package bytes
        if: always()
        shell: bash
        run: |
          rm -rf private-vf-infra-target private-vf-infra-source
          rm -rf "$RUNNER_TEMP/p04-v271-formal" "$RUNNER_TEMP/p04-v271-assets"
          rm -f "$RUNNER_TEMP/p04-v271-formal-release.sh"

      - name: Upload public-safe release evidence only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: P04-VF-Infra-V2.7.1-Formal-Release-Evidence
          path: p04-v271-release-evidence
          if-no-files-found: error
          retention-days: 14
