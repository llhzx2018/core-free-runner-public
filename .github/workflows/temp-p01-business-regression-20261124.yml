name: TEMP P01 three-case retest then 25-class S3-S7 scope

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p01-business-regression-20261124.yml'

permissions:
  contents: read

concurrency:
  group: temp-p01-business-regression-20261124-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  laravel-feature:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'test/p01-business-regression-')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact private development source only in transient workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-startnew
          ref: c756440eb23a97345b214405105233fede5cbbda
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
          fetch-depth: 1

      - name: Bind exact source without exposing source content
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C private-src rev-parse HEAD)" = "c756440eb23a97345b214405105233fede5cbbda"
          echo 'P01_EXACT_SOURCE_BINDING=PASS'

      - name: Prepare Laravel PHP 8.4 with real SQLite and XML extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, dom, xml, fileinfo, curl, openssl, zip
          tools: composer:v2
          coverage: none

      - name: Diagnose only three remaining synthetic business assertions
        working-directory: private-src
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          if ! composer install --no-interaction --prefer-dist --no-progress --quiet >"$RUNNER_TEMP/p01-composer.log" 2>&1; then
            echo 'P01_COMPOSER=FAIL'
            exit 1
          fi
          echo 'P01_COMPOSER=PASS'
          export APP_ENV=testing
          export APP_KEY="base64:$(openssl rand -base64 32)"
          export DB_CONNECTION=sqlite
          export DB_DATABASE=:memory:
          set +e
          ./vendor/bin/phpunit --filter='(test_bad_csv_duplicate_rows_and_unsafe_urls_fail_before_any_write|test_password_login_needs_one_time_second_step_and_recovery_code_is_consumed|test_owner_downloads_true_roadmap_rows_without_changing_tasks_or_completion)$' >"$RUNNER_TEMP/p01-rest.log" 2>&1
          TEST_STATUS=$?
          set -e
          python3 - "$RUNNER_TEMP/p01-rest.log" <<'PY'
          import pathlib,re,sys
          content=pathlib.Path(sys.argv[1]).read_text(errors='replace')
          content=re.sub(r'\x1b\[[0-9;]*m','',content)
          lines=content.splitlines()
          for i,line in enumerate(lines):
              match=re.match(r'^\d+\)\s+Tests\\Feature\\([A-Za-z0-9_]+)::(test_[A-Za-z0-9_]+)',line)
              if not match: continue
              context=lines[i+1:i+24]
              raw=next((x.strip() for x in context
                  if x.strip() and not x.strip().startswith(('#','>','at ','->'))),'')
              raw=re.sub(r'https?://\S+','<url>',raw,flags=re.I)
              raw=re.sub(r"""['"][^'"]{1,300}['"]""",'<quoted>',raw)
              raw=re.sub(r'\[[^\]]{1,120}\]','[value]',raw)
              raw=re.sub(r'/(?:[^\s/]+/)+[^\s/]+','<path>',raw)
              raw=re.sub(r'base64:[A-Za-z0-9+/=]+','<key>',raw)
              raw=re.sub(r'(?i)(token|password|secret|key)\s*[=:]\s*\S+','<sensitive>',raw)
              loc=''
              for x in context:
                  m=re.search(r'([A-Za-z_]+Test\.php):(\d+)',x)
                  if m:loc=m.group(1)+':'+m.group(2);break
              print('P01_FAIL_THREE='+match.group(1)+'::'+match.group(2)+' @ '+loc+' '+raw[:130])
          summary=re.search(r'Tests:\s*(\d+), Assertions:\s*(\d+), Failures:\s*(\d+)',content)
          if summary: print('P01_THREE_COUNTS='+','.join(summary.groups()))
          PY
          echo "P01_THREE_EXIT=$TEST_STATUS"
          if [ "$TEST_STATUS" -ne 0 ]; then exit "$TEST_STATUS"; fi
          echo 'P01_THREE_FOCUSED=PASS'
          set +e
          ./vendor/bin/phpunit --filter='(BookmarkDuplicatesPreviewTest|ChannelSourceCsvWorkflowTest|CourseNotesMarkdownExportTest|CourseProgressWorkflowTest|HomeActionCenterWorkflowTest|InboxBatchCrossModuleRoutingTest|InboxBatchReviewWorkflowTest|InboxCrossModuleRoutingTest|InboxCsvExchangeTest|MusicPlaylistM3uWorkflowTest|MusicPlaylistOrderTest|NewsBulkReadWorkflowTest|OwnerSecondFactorFlowTest|ProjectActionBulkStatusTest|ProjectActionCsvWorkflowTest|ProjectMilestoneCsvReportTest|SavedVideoCsvTransferTest|SoftwareWingetPlanImportTest|SubsiteBulkVisibilityTest|ToolDirectoryCsvWorkflowTest|ToolTaskCsvWorkflowTest|TopicMarkdownWorkflowTest|TopicReadingMarkdownExportTest|WatchBulkStatusWorkflowTest|WatchlistCsvWorkflowTest)' >"$RUNNER_TEMP/p01-rest-wide.log" 2>&1
          WIDE_STATUS=$?
          set -e
          python3 - "$RUNNER_TEMP/p01-rest-wide.log" <<'PY'
          import pathlib,re,sys
          t=pathlib.Path(sys.argv[1]).read_text(errors='replace')
          m=re.search(r'Tests:\s*(\d+), Assertions:\s*(\d+)(?:, Failures:\s*(\d+))?',t)
          print('P01_REMAINING_25_COUNTS='+(','.join(x or '0' for x in m.groups()) if m else 'NOT_EXTRACTED'))
          for line in t.splitlines():
              match=re.match(r'^\d+\)\s+Tests\\Feature\\([A-Za-z0-9_]+)::(test_[A-Za-z0-9_]+)',line)
              if match: print('P01_REMAINING_25_FAIL='+match.group(1)+'::'+match.group(2))
          PY
          if [ "$WIDE_STATUS" -ne 0 ]; then
            echo 'P01_REMAINING_25_CLASSES=FAIL'
            exit "$WIDE_STATUS"
          fi
          echo 'P01_REMAINING_25_CLASSES=PASS'

      - name: Remove all private checked-out content and temporary output
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- private-src
          rm -f -- "$RUNNER_TEMP/p01-composer.log" "$RUNNER_TEMP/p01-rest.log" "$RUNNER_TEMP/p01-rest-wide.log"
          test ! -e private-src
