name: TEMP P01 five-case Laravel assertion classification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p01-business-regression-20261124.yml'

permissions:
  contents: read

concurrency:
  group: temp-p01-business-regression-20261124-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  laravel-feature:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'test/p01-business-regression-')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact private development source only in transient workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-startnew
          ref: d1b63119a0606d9bf8906c7c198b3e57626d0099
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
          fetch-depth: 1

      - name: Bind exact source without exposing source content
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C private-src rev-parse HEAD)" = "d1b63119a0606d9bf8906c7c198b3e57626d0099"
          echo 'P01_EXACT_SOURCE_BINDING=PASS'

      - name: Prepare Laravel PHP 8.4 with real SQLite and XML extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, dom, xml, fileinfo, curl, openssl, zip
          tools: composer:v2
          coverage: none

      - name: Bounded five-method Laravel assertion diagnostics on synthetic SQLite
        working-directory: private-src
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          if ! composer install --no-interaction --prefer-dist --no-progress --quiet >"$RUNNER_TEMP/p01-composer.log" 2>&1; then
            echo 'P01_COMPOSER=FAIL'
            exit 1
          fi
          echo 'P01_COMPOSER=PASS'
          export APP_ENV=testing
          export APP_KEY="base64:$(openssl rand -base64 32)"
          export DB_CONNECTION=sqlite
          export DB_DATABASE=:memory:
          set +e
          ./vendor/bin/phpunit --filter='(test_owner_can_manage_directory_subscription_and_manually_saved_video|test_home_action_center_reads_real_owner_counts_and_recent_saved_links|test_owner_can_create_and_filter_real_projects_without_fake_remote_checks|test_explicit_public_category_and_url_are_publicly_readable|test_owner_can_save_filter_and_update_media_watchlists)$' >"$RUNNER_TEMP/p01-focused.log" 2>&1
          TEST_STATUS=$?
          set -e
          python3 - "$RUNNER_TEMP/p01-focused.log" <<'PY'
          import pathlib, re, sys
          text=pathlib.Path(sys.argv[1]).read_text(errors='replace')
          text=re.sub(r'\x1b\[[0-9;]*m','',text)
          samples=[]
          lines=text.splitlines()
          for i,line in enumerate(lines):
              test=re.match(r'^\d+\)\s+Tests\\Feature\\([A-Za-z0-9_]+)::(test_[A-Za-z0-9_]+)',line)
              if test is None: continue
              summary='UNCLASSIFIED'
              lineno=''
              for entry in lines[i+1:i+26]:
                  if re.match(r'^\d+\)\s+Tests\\Feature\\',entry) or entry.startswith('FAILURES!'): break
                  prop=re.search(r'Property \[([A-Za-z_][A-Za-z0-9_.-]{0,90})\] (?:does not exist|is not)',entry)
                  if prop:
                      summary='INERTIA_PROPERTY:'+prop.group(1)
                      break
                  if re.search(r'Failed asserting that (?:true|false|null|-?\d+(?:\.\d+)?) is (?:identical|equal) to (?:true|false|null|-?\d+(?:\.\d+)?)',entry):
                      summary='SCALAR_MISMATCH'
                      break
                  if 'Failed asserting that two strings are identical' in entry or 'Failed asserting that two strings are equal' in entry:
                      summary='STRING_MISMATCH'
                      break
                  if 'Failed asserting' in entry or 'Expected response status code' in entry:
                      summary='ASSERTION_MISMATCH'
                      break
              for entry in lines[i+1:i+50]:
                  found=re.search(r'(?:tests/Feature/)?([A-Za-z_]+Test\.php):(\d+)',entry)
                  if found:
                      lineno=found.group(1)+':'+found.group(2)
                      break
              samples.append((test.group(1),test.group(2),summary,lineno))
          print('P01_DIAG_TOTAL='+str(len(samples)))
          for cls,method,status,location in samples:
              print('P01_DIAG='+cls+'::'+method+':'+status+':'+location)
          for entry in lines:
              m=re.search(r'^Tests:\s*(\d+), Assertions:\s*(\d+), Failures:\s*(\d+)',entry)
              if m: print('P01_DIAG_COUNTS='+','.join(m.groups()))
          PY
          exit "$TEST_STATUS"

      - name: Remove all private checked-out content and temporary output
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- private-src
          rm -f -- "$RUNNER_TEMP/p01-composer.log" "$RUNNER_TEMP/p01-focused.log"
          test ! -e private-src
