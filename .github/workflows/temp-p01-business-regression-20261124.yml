name: TEMP P01 S3-S7 business exact-source regression / Vue

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p01-business-regression-20261124.yml'

permissions:
  contents: read

concurrency:
  group: temp-p01-business-regression-20261124-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  laravel-feature:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'test/p01-business-regression-')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact private development source only in transient workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-startnew
          ref: bf85dd1e589c9f1086eba867aa46ca6f30569534
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
          fetch-depth: 1

      - name: Bind exact source without exposing source content
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C private-src rev-parse HEAD)" = "bf85dd1e589c9f1086eba867aa46ca6f30569534"
          echo 'P01_EXACT_SOURCE_BINDING=PASS'

      - name: Prepare Laravel PHP 8.4 with real SQLite and XML extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, dom, xml, fileinfo, curl, openssl, zip
          tools: composer:v2
          coverage: none

      - name: Run source syntax, real Laravel and in-memory SQLite feature tests
        working-directory: private-src
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          php -l app/Modules/Navigation/Infrastructure/BookmarkFormats.php >/dev/null
          php -l app/Modules/News/Application/NewsOpmlExchange.php >/dev/null
          php -l app/Modules/News/Presentation/NewsController.php >/dev/null
          php -l app/Modules/Software/Application/SoftwarePlanCsvTransfer.php >/dev/null
          php -l app/Modules/Subsites/Application/SubsiteCsvTransfer.php >/dev/null
          python3 scripts/check_php_syntax.py
          echo 'P01_FIRST_PARTY_PHP_SYNTAX=PASS'
          if ! composer install --no-interaction --prefer-dist --no-progress --quiet >"$RUNNER_TEMP/p01-composer.log" 2>&1; then
            echo 'P01_COMPOSER_DEPENDENCIES=FAIL'
            exit 1
          fi
          echo 'P01_COMPOSER_DEPENDENCIES=PASS'
          export APP_ENV=testing
          export APP_KEY="base64:$(openssl rand -base64 32)"
          export DB_CONNECTION=sqlite
          export DB_DATABASE=:memory:
          if ./vendor/bin/phpunit --log-junit "$RUNNER_TEMP/p01-results.xml" --filter='(ChannelsModuleTest|NavigationTest|ProjectsModuleTest|PublicNavigationTest|WatchModuleTest)' >"$RUNNER_TEMP/p01-tests.log" 2>&1; then
            echo 'P01_S3_S7_BUSINESS_LARAVEL_FEATURE=PASS'
            grep -E '^OK \(|^Tests:|^  Tests:' "$RUNNER_TEMP/p01-tests.log" | tail -1 || true
          else
            echo 'P01_S3_S7_BUSINESS_LARAVEL_FEATURE=FAIL'
            python3 - "$RUNNER_TEMP/p01-tests.log" <<'PY'
          import pathlib, re, sys
          t = pathlib.Path(sys.argv[1]).read_text(errors='replace')
          t = re.sub(r'\x1b\[[0-9;]*m', '', t)
          print('P01_LARAVEL_TEST_LOG_LINES=' + str(len(t.splitlines())))
          for line in t.splitlines():
              line = line.strip()
              if re.match(r'^(FAIL|ERROR|FAILED|Tests:|PHP Fatal error:|PHP Parse error:|No tests executed|Configuration file:)', line):
                  line = re.sub(r'https?://\S+', '<url>', line)
                  line = re.sub(r'base64:[A-Za-z0-9+/=]+', '<key>', line)
                  print('P01_TEST_DIAGNOSTIC=' + line[:200])
                  if len(line) > 200: print('P01_TEST_DIAGNOSTIC_TRUNCATED=true')
              elif re.match(r'^([A-Za-z0-9_.\\]+(?:Error|Exception|Failure)|In [^ ]+\.php line [0-9]+):', line):
                  print('P01_TEST_EXCEPTION_CLASS=' + line.split(':', 1)[0][:160])
          PY
            python3 - "$RUNNER_TEMP/p01-tests.log" <<'PY'
          import pathlib, re, sys
          t = pathlib.Path(sys.argv[1]).read_text(errors='replace')
          t = re.sub(r'\x1b\[[0-9;]*m', '', t)
          print('P01_PHP_BOOT_ERROR_BEGIN')
          for line in t.splitlines()[:12]:
              line = line.strip()
              if not line or line.startswith(('# ', 'at ', '->', '>')): continue
              line = re.sub(r'https?://\S+', '<url>', line)
              line = re.sub(r'/home/runner/work/\S+', '<source-path>', line)
              line = re.sub(r'base64:[A-Za-z0-9+/=]+', '<key>', line)
              line = re.sub(r'(["\x27])[^"\x27]{1,240}\1', '<text>', line)
              print('P01_PHP_BOOT=' + line[:180])
          print('P01_PHP_BOOT_ERROR_END')
          for line in t.splitlines():
              line = line.strip()
              if re.match(r'^\d+\) Tests\\Feature\\[A-Za-z0-9_]+::[A-Za-z0-9_]+', line):
                  print('P01_FAIL_TEST=' + line[:180])
              elif ('Failed asserting' in line or 'Expected response status code' in line) and not line.startswith(('#', '>', '/')):
                  line = re.sub(r'([\x27"])[^\x27"]{1,240}\1', '<synthetic-text>', line)
                  print('P01_FAIL_ASSERTION=' + line[:180])
          PY
            # Only emit test method identifiers and coarse error classes;
            # never upload JUnit XML or print private/source assertion values.
            python3 - "$RUNNER_TEMP/p01-results.xml" <<'PY'
          import collections, pathlib, re, sys
          import xml.etree.ElementTree as ET
          source=pathlib.Path(sys.argv[1])
          if not source.is_file():
              print('P01_JUNIT_SUMMARY=NOT_AVAILABLE')
              raise SystemExit(0)
          root=ET.parse(source).getroot()
          counts=collections.Counter()
          samples=[]
          for case in root.iter('testcase'):
              for failure in case:
                  if failure.tag not in ('failure','error'): continue
                  m=failure.attrib.get('message') or failure.text or ''
                  # Only the first nonempty assertion line may be used for
                  # classification; the rest is a stack trace containing
                  # Inertia class names, never a proof of projection failure.
                  first=next((x.strip() for x in m.splitlines() if x.strip()), '')
                  m=first
                  bucket='OTHER_ASSERTION'
                  detail=''
                  st=re.search(r'Expected response status code\s*\[?(\d{3})\]?.*?(?:received|got)\s*\[?(\d{3})',m,re.I|re.S)
                  if st:
                      bucket='HTTP_STATUS_MISMATCH'
                      detail=' '+st.group(1)+'_to_'+st.group(2)
                  elif 'Failed asserting that two strings are equal' in m or 'Failed asserting that two strings are identical' in m:
                      bucket='STRING_EQUALITY'
                  elif 'Failed asserting that' in m:
                      bucket='ASSERTION_VALUE'
                  elif 'Inertia' in m or 'assertInertia' in m:
                      bucket='INERTIA_PROJECTION'
                  elif failure.tag=='error':
                      bucket='RUNTIME_ERROR'
                  name=case.attrib.get('name','')
                  if not re.fullmatch(r'[A-Za-z_][A-Za-z_0-9]*',name):name='<method>'
                  counts[bucket+detail]+=1
                  if len(samples)<28:
                      first=re.sub(r'https?://[^\\s]+','<url>',first)
                      first=re.sub(r'[\\x27\\x22][^\\x27\\x22]{1,250}[\\x27\\x22]','<value>',first)
                      first=re.sub(r'base64:[A-Za-z0-9+/=]+','<key>',first)
                      first=re.sub(r'(/[A-Za-z0-9_.-]+){2,}','<path>',first)
                      first=re.sub(r'[^A-Za-z0-9_ .,\\[\\]:=<>/()-]+','?',first)
                      samples.append((name,bucket+detail,first[:130]))
          print('P01_JUNIT_RECORDED_FAILS='+str(sum(counts.values())))
          for key,n in counts.most_common():
              print('P01_JUNIT_BUCKET='+key+':'+str(n))
          for name,key,first in samples:print('P01_JUNIT_TEST='+name+':'+key+':'+first)
          PY
            exit 1
          fi

      - name: Remove all private checked-out content and temporary output
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- private-src
          rm -f -- "$RUNNER_TEMP/p01-composer.log" "$RUNNER_TEMP/p01-tests.log" "$RUNNER_TEMP/p01-results.xml"
          test ! -e private-src

  vue-vite:
    if: false # already succeeded on the exact unchanged product SHA; diagnostic-only run
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact private development source only in transient workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-startnew
          ref: bf85dd1e589c9f1086eba867aa46ca6f30569534
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact source identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C private-src rev-parse HEAD)" = "bf85dd1e589c9f1086eba867aa46ca6f30569534"
          echo 'P01_EXACT_SOURCE_BINDING=PASS'

      - name: Configure Node.js 22 from public runner
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Run real Vue typecheck and production-mode Vite compilation
        working-directory: private-src
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          if ! npm ci --no-audit --no-fund --silent >"$RUNNER_TEMP/p01-npm.log" 2>&1; then
            echo 'P01_NPM_DEPENDENCIES=FAIL'
            exit 1
          fi
          echo 'P01_NPM_DEPENDENCIES=PASS'
          TYPE_STATUS=0
          BUILD_STATUS=0
          if npm run typecheck >"$RUNNER_TEMP/p01-typecheck.log" 2>&1; then
            echo 'P01_VUE_TYPECHECK=PASS'
          else
            echo 'P01_VUE_TYPECHECK=FAIL'
            TYPE_STATUS=1
            python3 - "$RUNNER_TEMP/p01-typecheck.log" <<'PY'
          import pathlib, re, sys
          t = pathlib.Path(sys.argv[1]).read_text(errors='replace')
          for line in t.splitlines():
              m = re.search(r'^(\S+)\((\d+),(\d+)\): error (TS\d+):', line)
              if m:
                  print('P01_TS_DIAGNOSTIC=' + m.group(1)[:100] + ':' + m.group(2) + ' ' + m.group(4))
          PY
          fi
          if npm run build >"$RUNNER_TEMP/p01-vite.log" 2>&1; then
            echo 'P01_VITE_BUILD=PASS'
          else
            echo 'P01_VITE_BUILD=FAIL'
            BUILD_STATUS=1
          fi
          test "$TYPE_STATUS" -eq 0 && test "$BUILD_STATUS" -eq 0

      - name: Remove all private checked-out content and temporary output
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- private-src
          rm -f -- "$RUNNER_TEMP/p01-npm.log" "$RUNNER_TEMP/p01-typecheck.log" "$RUNNER_TEMP/p01-vite.log"
          test ! -e private-src
