name: TEMP P01 original 25 S3-S7 classes same-head final proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p01-business-regression-20261124.yml'

permissions:
  contents: read

concurrency:
  group: temp-p01-business-regression-20261124-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  laravel-feature:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'test/p01-business-regression-')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact private development source only in transient workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-startnew
          ref: c756440eb23a97345b214405105233fede5cbbda
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
          fetch-depth: 1

      - name: Bind exact source without exposing source content
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C private-src rev-parse HEAD)" = "c756440eb23a97345b214405105233fede5cbbda"
          echo 'P01_EXACT_SOURCE_BINDING=PASS'

      - name: Prepare Laravel PHP 8.4 with real SQLite and XML extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, dom, xml, fileinfo, curl, openssl, zip
          tools: composer:v2
          coverage: none

      - name: Reverify original S3-S7 classes after global raw-payload middleware change
        working-directory: private-src
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          python3 scripts/check_php_syntax.py
          if ! composer install --no-interaction --prefer-dist --no-progress --quiet >"$RUNNER_TEMP/p01-composer.log" 2>&1; then
            echo 'P01_COMPOSER=FAIL'
            exit 1
          fi
          echo 'P01_COMPOSER=PASS'
          export APP_ENV=testing
          export APP_KEY="base64:$(openssl rand -base64 32)"
          export DB_CONNECTION=sqlite
          export DB_DATABASE=:memory:
          set +e
          ./vendor/bin/phpunit --filter='(ChannelsModuleTest|CoursesModuleTest|GlobalSearchModuleTest|InboxWorkspaceTest|MatureBookmarkExchangeTest|MusicModuleTest|NavigationManagementTest|NavigationTest|NewsOpmlExchangeTest|NewsSourceManagementTest|NewsWorkspaceTest|OwnerAccountModuleTest|OwnerOperationsModuleTest|ProjectsModuleTest|PublicNavigationTest|SoftwareModuleTest|SoftwarePlanCsvExchangeTest|SoftwarePlanWorkflowTest|SubsiteCsvExchangeTest|SubsiteDirectoryTransferTest|SubsitesModuleTest|ToolTaskChecklistTest|ToolsModuleTest|TopicsModuleTest|WatchModuleTest|InertiaPagePathContractTest)' >"$RUNNER_TEMP/p01-rest.log" 2>&1
          RESULT=$?
          set -e
          python3 - "$RUNNER_TEMP/p01-rest.log" <<'PY'
          import pathlib,re,sys
          t=pathlib.Path(sys.argv[1]).read_text(errors='replace')
          x=re.search(r'OK \((\d+) tests?, (\d+) assertions?\)',t)
          if x: print('P01_ORIGINAL_25_COUNTS='+','.join(x.groups())+',0')
          else:
              x=re.search(r'Tests:\s*(\d+), Assertions:\s*(\d+)(?:, Failures:\s*(\d+))?',t)
              print('P01_ORIGINAL_25_COUNTS='+(','.join(y or '0' for y in x.groups()) if x else 'UNKNOWN'))
          for line in t.splitlines():
              m=re.match(r'^\d+\)\s+Tests\\Feature\\([A-Za-z0-9_]+)::(test_[A-Za-z0-9_]+)',line)
              if m: print('P01_ORIGINAL_FAIL='+m.group(1)+'::'+m.group(2))
          PY
          if [ "$RESULT" -ne 0 ]; then
            echo 'P01_ORIGINAL_25_CLASSES=FAIL'
            exit "$RESULT"
          fi
          echo 'P01_ORIGINAL_25_CLASSES=PASS'

      - name: Remove all private checked-out content and temporary output
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- private-src
          rm -f -- "$RUNNER_TEMP/p01-composer.log" "$RUNNER_TEMP/p01-rest.log"
          test ! -e private-src
