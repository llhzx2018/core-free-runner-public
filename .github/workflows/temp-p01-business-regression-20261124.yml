name: TEMP P01 five-case Laravel assertion classification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p01-business-regression-20261124.yml'

permissions:
  contents: read

concurrency:
  group: temp-p01-business-regression-20261124-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  laravel-feature:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'test/p01-business-regression-')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact private development source only in transient workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-startnew
          ref: ffc9d0238880be448f7d466cba4bb719c6355492
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
          fetch-depth: 1

      - name: Bind exact source without exposing source content
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C private-src rev-parse HEAD)" = "ffc9d0238880be448f7d466cba4bb719c6355492"
          echo 'P01_EXACT_SOURCE_BINDING=PASS'

      - name: Prepare Laravel PHP 8.4 with real SQLite and XML extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, dom, xml, fileinfo, curl, openssl, zip
          tools: composer:v2
          coverage: none

      - name: Bounded five-method Laravel assertion diagnostics on synthetic SQLite
        working-directory: private-src
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          python3 scripts/check_php_syntax.py
          if ! composer install --no-interaction --prefer-dist --no-progress --quiet >"$RUNNER_TEMP/p01-composer.log" 2>&1; then
            echo 'P01_COMPOSER=FAIL'
            exit 1
          fi
          echo 'P01_COMPOSER=PASS'
          export APP_ENV=testing
          export APP_KEY="base64:$(openssl rand -base64 32)"
          export DB_CONNECTION=sqlite
          export DB_DATABASE=:memory:
          set +e
          ./vendor/bin/phpunit --filter='(test_filtered_export_uses_applied_scope_and_preserves_only_matching_folder_ancestry|test_batch_is_all_or_nothing_for_missing_or_mixed_state|test_home_route_registers_password_hash_and_invalidates_a_stale_owner_session|test_resume_queue_uses_saved_minutes_not_last_opened|test_continue_watch_includes_unknown_duration_and_updates_after_reset|test_resume_queue_rejects_invalid_view_and_denies_nonowner)$' >"$RUNNER_TEMP/p01-focused.log" 2>&1
          TEST_STATUS=$?
          set -e
          python3 - "$RUNNER_TEMP/p01-focused.log" <<'PY'
          import pathlib, re, sys
          text=pathlib.Path(sys.argv[1]).read_text(errors='replace')
          text=re.sub(r'\x1b\[[0-9;]*m','',text)
          samples=[]
          lines=text.splitlines()
          for i,line in enumerate(lines):
              test=re.match(r'^\d+\)\s+Tests\\Feature\\([A-Za-z0-9_]+)::(test_[A-Za-z0-9_]+)',line)
              if test is None: continue
              summary='UNCLASSIFIED'
              lineno=''
              for entry in lines[i+1:i+26]:
                  if re.match(r'^\d+\)\s+Tests\\Feature\\',entry) or entry.startswith('FAILURES!'): break
                  prop=re.search(r'Property \[([A-Za-z_][A-Za-z0-9_.-]{0,90})\] (?:does not exist|is not)',entry)
                  if prop:
                      summary='INERTIA_PROPERTY:'+prop.group(1)
                      break
                  if re.search(r'Failed asserting that (?:true|false|null|-?\d+(?:\.\d+)?) is (?:identical|equal) to (?:true|false|null|-?\d+(?:\.\d+)?)',entry):
                      summary='SCALAR_MISMATCH'
                      break
                  if 'Failed asserting that two strings are identical' in entry or 'Failed asserting that two strings are equal' in entry:
                      summary='STRING_MISMATCH'
                      break
                  if 'Failed asserting' in entry or 'Expected response status code' in entry:
                      summary='ASSERTION_MISMATCH'
                      break
              for entry in lines[i+1:i+50]:
                  found=re.search(r'(?:tests/Feature/)?([A-Za-z_]+Test\.php):(\d+)',entry)
                  if found:
                      lineno=found.group(1)+':'+found.group(2)
                      break
              first=next((entry.strip() for entry in lines[i+1:i+12]
                          if entry.strip() and not entry.strip().startswith(('#', '>', 'at ', '->'))), '')
              # No private source, URLs, tokens, paths or quoted values ever leave temp files.
              first=re.sub(r'https?://\S+', '<url>', first, flags=re.I)
              first=re.sub(r"""['"][^'"]{1,300}['"]""", '<quoted>', first)
              first=re.sub(r'\[[^\]]{1,120}\]', '[value]', first)
              first=re.sub(r'/(?:[^\s/]+/)+[^\s/]+', '<path>', first)
              first=re.sub(r'base64:[A-Za-z0-9+/=]+', '<key>', first)
              first=re.sub(r'(?i)(token|password|secret|key)\s*[=:]\s*\S+', '<sensitive>', first)
              first=first[:160]
              samples.append((test.group(1),test.group(2),summary,lineno,first))
          print('P01_DIAG_TOTAL='+str(len(samples)))
          for cls,method,status,location,head in samples:
              print('P01_DIAG='+cls+'::'+method+':'+status+':'+location)
              print('P01_DIAG_FIRST='+cls+':'+head)
          for entry in lines:
              m=re.search(r'^Tests:\s*(\d+), Assertions:\s*(\d+), Failures:\s*(\d+)',entry)
              if m: print('P01_DIAG_COUNTS='+','.join(m.groups()))
          PY
          if [ "$TEST_STATUS" -ne 0 ]; then
            echo 'P01_SIX_CASE_FOCUSED=FAIL'
            exit "$TEST_STATUS"
          fi
          echo 'P01_SIX_CASE_FOCUSED=PASS'
          if ./vendor/bin/phpunit --filter='(ChannelsModuleTest|CoursesModuleTest|GlobalSearchModuleTest|InboxWorkspaceTest|MatureBookmarkExchangeTest|MusicModuleTest|NavigationManagementTest|NavigationTest|NewsOpmlExchangeTest|NewsSourceManagementTest|NewsWorkspaceTest|OwnerAccountModuleTest|OwnerOperationsModuleTest|ProjectsModuleTest|PublicNavigationTest|SoftwareModuleTest|SoftwarePlanCsvExchangeTest|SoftwarePlanWorkflowTest|SubsiteCsvExchangeTest|SubsiteDirectoryTransferTest|SubsitesModuleTest|ToolTaskChecklistTest|ToolsModuleTest|TopicsModuleTest|WatchModuleTest)' >"$RUNNER_TEMP/p01-wide.log" 2>&1; then
            echo 'P01_S3_S7_25_CLASS_FEATURE=PASS'
            grep -E '^OK \(|^Tests:' "$RUNNER_TEMP/p01-wide.log" | tail -1 || true
          else
            echo 'P01_S3_S7_25_CLASS_FEATURE=FAIL'
            grep -E '^Tests:' "$RUNNER_TEMP/p01-wide.log" | tail -1 || true
            python3 - "$RUNNER_TEMP/p01-wide.log" <<'PY'
          import pathlib,re,sys
          content=pathlib.Path(sys.argv[1]).read_text(errors='replace')
          for line in content.splitlines():
              match=re.match(r'^\d+\)\s+Tests\\Feature\\([A-Za-z0-9_]+)::(test_[A-Za-z0-9_]+)',line)
              if match:print('P01_WIDE_FAIL='+match.group(1)+'::'+match.group(2))
          PY
            exit 1
          fi

      - name: Remove all private checked-out content and temporary output
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- private-src
          rm -f -- "$RUNNER_TEMP/p01-composer.log" "$RUNNER_TEMP/p01-focused.log" "$RUNNER_TEMP/p01-wide.log"
          test ! -e private-src
