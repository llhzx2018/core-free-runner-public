name: TEMP P01 previously untested 25-class S3-S7 feature proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p01-business-regression-20261124.yml'

permissions:
  contents: read

concurrency:
  group: temp-p01-business-regression-20261124-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  laravel-feature:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'test/p01-business-regression-')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact private development source only in transient workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-startnew
          ref: ffc9d0238880be448f7d466cba4bb719c6355492
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
          fetch-depth: 1

      - name: Bind exact source without exposing source content
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C private-src rev-parse HEAD)" = "ffc9d0238880be448f7d466cba4bb719c6355492"
          echo 'P01_EXACT_SOURCE_BINDING=PASS'

      - name: Prepare Laravel PHP 8.4 with real SQLite and XML extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, dom, xml, fileinfo, curl, openssl, zip
          tools: composer:v2
          coverage: none

      - name: Test 25 previously untested S3-S7 business Feature classes
        working-directory: private-src
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          if ! composer install --no-interaction --prefer-dist --no-progress --quiet >"$RUNNER_TEMP/p01-composer.log" 2>&1; then
            echo 'P01_COMPOSER=FAIL'
            exit 1
          fi
          echo 'P01_COMPOSER=PASS'
          export APP_ENV=testing
          export APP_KEY="base64:$(openssl rand -base64 32)"
          export DB_CONNECTION=sqlite
          export DB_DATABASE=:memory:
          set +e
          ./vendor/bin/phpunit --filter='(BookmarkDuplicatesPreviewTest|ChannelSourceCsvWorkflowTest|CourseNotesMarkdownExportTest|CourseProgressWorkflowTest|HomeActionCenterWorkflowTest|InboxBatchCrossModuleRoutingTest|InboxBatchReviewWorkflowTest|InboxCrossModuleRoutingTest|InboxCsvExchangeTest|MusicPlaylistM3uWorkflowTest|MusicPlaylistOrderTest|NewsBulkReadWorkflowTest|OwnerSecondFactorFlowTest|ProjectActionBulkStatusTest|ProjectActionCsvWorkflowTest|ProjectMilestoneCsvReportTest|SavedVideoCsvTransferTest|SoftwareWingetPlanImportTest|SubsiteBulkVisibilityTest|ToolDirectoryCsvWorkflowTest|ToolTaskCsvWorkflowTest|TopicMarkdownWorkflowTest|TopicReadingMarkdownExportTest|WatchBulkStatusWorkflowTest|WatchlistCsvWorkflowTest)' >"$RUNNER_TEMP/p01-rest.log" 2>&1
          TEST_STATUS=$?
          set -e
          python3 - "$RUNNER_TEMP/p01-rest.log" <<'PY'
          import pathlib,re,sys
          content=pathlib.Path(sys.argv[1]).read_text(errors='replace')
          content=re.sub(r'\x1b\[[0-9;]*m','',content)
          summary=re.search(r'Tests:\s*(\d+), Assertions:\s*(\d+)(?:, Failures:\s*(\d+))?',content)
          if summary:
              print('P01_REMAINING_TEST_COUNTS='+','.join(v or '0' for v in summary.groups()))
          else:
              print('P01_REMAINING_SUMMARY_NOT_EXTRACTED')
          for line in content.splitlines():
              match=re.match(r'^\d+\)\s+Tests\\Feature\\([A-Za-z0-9_]+)::(test_[A-Za-z0-9_]+)',line)
              if match:print('P01_REMAINING_FAIL='+match.group(1)+'::'+match.group(2))
          PY
          if [ "$TEST_STATUS" -ne 0 ]; then
            echo 'P01_S3_S7_OTHER_25_CLASSES=FAIL'
            exit "$TEST_STATUS"
          fi
          echo 'P01_S3_S7_OTHER_25_CLASSES=PASS'

      - name: Remove all private checked-out content and temporary output
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- private-src
          rm -f -- "$RUNNER_TEMP/p01-composer.log" "$RUNNER_TEMP/p01-rest.log" "$RUNNER_TEMP/p01-rest.log"
          test ! -e private-src
