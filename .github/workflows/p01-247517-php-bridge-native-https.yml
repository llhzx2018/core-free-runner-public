name: P01 v517 native HTTPS migration from real installed PHP bridge v516
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  official-to-next-native-https:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      TARGET_VERSION: 2.47.517
      TARGET_SHA: 6e86db565fc080458730ef6c694405c0f2df0773
    steps:
      - name: Checkout registered runner lane audit script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Audit rendered exact product identity BEFORE private checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          python3 scripts/ephemeral_lane_spec.py validate \
            --spec scripts/ephemeral/p01-247517-php-bridge-native-https.json > "$RUNNER_TEMP/p01-lane-validated.json"
          python3 scripts/ephemeral_lane_spec.py audit-rendered \
            --spec scripts/ephemeral/p01-247517-php-bridge-native-https.json \
            --input .github/workflows/p01-247517-php-bridge-native-https.yml > "$RUNNER_TEMP/p01-lane-audited.json"
          grep -F '"status": "PASS"' "$RUNNER_TEMP/p01-lane-audited.json" >/dev/null
          echo 'P01_D86_TARGET_OWNED_IDENTITY_AUDIT=PASS'
      - name: Checkout exact private source only into transient workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - name: Checkout exact PHP v516 bridge from immutable developer SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: bdc1e068e4cabec2e9129d750b8f6ba159c74fd5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: bridge-src
      - name: Exact candidate source and synthetic runtime scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "test/p01-247517-native-https-major-20261115"
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(cat candidate/VERSION)" = "$TARGET_VERSION"
          test -f candidate/tests/compatibility/laravel/run_d67_seal_official_old_clone.php
          python3 -m py_compile candidate/tests/compatibility/laravel/run_p01_v516_to_v517_official_bridge.py             candidate/tests/compatibility/laravel/http/run_p01_v516_to_v517_https.py
          test -f candidate/tests/compatibility/laravel/http/p01_d71_real_v516_to_v517_transaction.php
          python3 -B candidate/tests/compatibility/laravel/run_p01_v516_to_v517_official_bridge.py --help >/dev/null
          python3 -m py_compile candidate/tests/compatibility/laravel/http/p01_d82_legacy_owner_major_intent_http.py
          echo "P01_D71_EXACT_PRODUCT_SOURCE=$TARGET_SHA"
          echo "P01_D71_OFFICIAL_OLD_INPUT_REAL_USER_DATA=NONE"
          echo "P01_D86_DEV_ENVELOPE_BINDING=ACTIVE"
          echo "P01_SHARED_35_TABLE_TRANSFER_SOURCE=$TARGET_SHA"
          echo "P01_D86_REAL_PACKAGE_BINDING_EXACT_SOURCE=$TARGET_SHA"
          echo "P01_D83_EXACT_SOURCE_CHECKOUT=$TARGET_SHA"
      - name: Isolated native Nginx TLS PHP FPM and framework build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq > "$RUNNER_TEMP/d71-apt.txt" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq             nginx php8.3-fpm php8.3-cli php8.3-sqlite3 php8.3-mysql             php8.3-mbstring php8.3-curl php8.3-xml php8.3-zip             composer openssl unzip >> "$RUNNER_TEMP/d71-apt.txt" 2>&1
          php8.3 -l candidate/tests/compatibility/laravel/run_d66_official_release_to_future_clone.php
          php8.3 -l candidate/tests/compatibility/laravel/run_d67_seal_official_old_clone.php
          php8.3 -l candidate/tests/compatibility/laravel/http/p01_d71_real_v516_to_v517_transaction.php
          php8.3 -l candidate/src/app/next/runtime/MajorMigrationTransaction.php
          php8.3 -l candidate/src/app/next/runtime/CloudPanelManualHandoff.php
          php8.3 -l candidate/src/app/next/runtime/SyntheticCloudPanelTreeRelocation.php
          php8.3 -l candidate/src/app/next/runtime/SyntheticLegacyFullSiteArchive.php
          php8.3 -l candidate/src/app/next/runtime/LegacyMajorOfflineRestore.php
          php8.3 -l candidate/src/app/next/runtime/LegacyCanonicalSQLiteTransfer.php
          php8.3 -l candidate/src/app/next/runtime/LegacyV247515SnapshotAudit.php
          php8.3 -l candidate/src/app/next/runtime/LegacyV247515SchemaParity.php
          php8.3 -l candidate/src/app/next/runtime/MajorOfflineSQLiteConversion.php
          php8.3 -l candidate/src/app/next/runtime/MajorOfflineNextInstall.php
          php8.3 -l candidate/src/app/LegacyMajorOwnerHandoff.php
          php8.3 -l candidate/src/app/next/runtime/SyntheticLegacySQLiteDataCopy.php
          php8.3 -l candidate/tests/compatibility/laravel/run_d70_major_migration_transaction.php
          command -v nginx
          command -v php-fpm8.3
          command -v composer
          echo "P01_D71_REAL_NATIVE_FPM_READY=PASS"
      - name: Download OFFICIAL v2.47.515 FULL and validate authentic asset SHA
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -m 700 -p "$RUNNER_TEMP/d71-official"
          gh release download v2.47.515 --repo llhzx2018/vf-start             --pattern VF-Start-V2.47.515-FULL.zip             --dir "$RUNNER_TEMP/d71-official"             > "$RUNNER_TEMP/d71-download.txt" 2>&1
          file="$RUNNER_TEMP/d71-official/VF-Start-V2.47.515-FULL.zip"
          test "$(stat -c '%s' "$file")" = "1802482"
          echo "5ee0c031dda82c53353929dc4519b0cc1b647b2af82a1bcd8a27a03ab7866778  $file" | sha256sum -c --status
          echo "P01_D71_AUTHENTIC_OLD_GITHUB_RELEASE=PASS"
      - name: Build actual PHP v516 Atomic bridge using immutable v515 official FULL and UPDATE
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git -C bridge-src rev-parse HEAD)" = "bdc1e068e4cabec2e9129d750b8f6ba159c74fd5"
          test "$(cat bridge-src/VERSION)" = "2.47.516"
          OLD="$RUNNER_TEMP/d71-official"
          mkdir -p "$OLD/site" "$OLD/update"
          gh release download v2.47.515 --repo llhzx2018/vf-start --pattern VF_Start_V2.47.515_UPDATE.zip --dir "$OLD" >"$RUNNER_TEMP/p01-bridge-download.txt" 2>&1
          test "$(sha256sum "$OLD/VF_Start_V2.47.515_UPDATE.zip" | cut -d' ' -f1)" = "3a5e6528e8ef1204ef1fc4f6d4568aad0634dced649200f5744df5cb9c082556"
          unzip -q "$OLD/VF-Start-V2.47.515-FULL.zip" -d "$OLD/site"
          unzip -q "$OLD/VF_Start_V2.47.515_UPDATE.zip" -d "$OLD/update"
          python3 -B bridge-src/scripts/build_p01_247516_legacy_atomic.py --candidate bridge-src/src --baseline-full-dir "$OLD/site" --baseline-repair "$OLD/update/repair-v2.47.515.php" --runner-atomic-engine scripts/p01-build-release-v2.py --target-sha "bdc1e068e4cabec2e9129d750b8f6ba159c74fd5" --output-dir "$RUNNER_TEMP/p01-bridge-developer" >"$RUNNER_TEMP/p01-bridge-artifact.txt" 2>&1 || {
            grep -Eo '(P01_247516_BRIDGE_[A-Z0-9_]{4,85}|BridgeError)' "$RUNNER_TEMP/p01-bridge-artifact.txt" | sort -u | head -n 12 || true
            exit 1
          }
          unzip -q "$RUNNER_TEMP/p01-bridge-developer/VF_Start_V2.47.516_UPDATE-DEV-ONLY.zip" -d "$RUNNER_TEMP/p01-bridge-developer"
          test -f "$RUNNER_TEMP/p01-bridge-developer/repair-v2.47.516.php"
          php8.3 -l "$RUNNER_TEMP/p01-bridge-developer/repair-v2.47.516.php" >/dev/null
          echo P01_REAL_V515_ATOMIC_BRIDGE_516_FROM_OFFICIAL_PACKAGES=PASS
      - name: Rebuild real complete native Laravel 13 CloudPanel FULL from exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 scripts/build_p01_next_clean_full.py build             --source-sha $TARGET_SHA             --output "$RUNNER_TEMP/d71-clean-full.zip" --composer composer             > "$RUNNER_TEMP/d71-build.txt" 2>&1
          python3 scripts/build_p01_next_clean_full.py verify             --zip "$RUNNER_TEMP/d71-clean-full.zip"             > "$RUNNER_TEMP/d71-verify.txt" 2>&1
          python3 scripts/build_p01_next_cloudpanel_full.py build             --source-zip "$RUNNER_TEMP/d71-clean-full.zip"             --output "$RUNNER_TEMP/d71-cloudpanel-full.zip"             > "$RUNNER_TEMP/d71-layout.txt" 2>&1
          python3 scripts/build_p01_next_cloudpanel_full.py verify             --zip "$RUNNER_TEMP/d71-cloudpanel-full.zip"             > "$RUNNER_TEMP/d71-layout-verify.txt" 2>&1
          test -s "$RUNNER_TEMP/d71-cloudpanel-full.zip"
          echo "P01_D71_LARAVEL_13_FULL_REAL_PACKAGED=PASS"
      - name: D86 real unsigned major envelope plus executable package byte identity and adversarial suite
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 -m py_compile scripts/verify_p01_major_runtime_binding.py tests/architecture/test_p01_major_runtime_binding.py
          if ! python3 tests/architecture/test_p01_major_runtime_binding.py > "$RUNNER_TEMP/d71-d86-unit.txt" 2>&1; then
            grep -E '^(FAIL|ERROR): test_' "$RUNNER_TEMP/d71-d86-unit.txt" | cut -c1-120 | head -n 12 || true
            echo 'P01_D86_ISOLATED_NEGATIVE_MATRIX=FAIL'
            exit 1
          fi
          grep -Fx 'OK' "$RUNNER_TEMP/d71-d86-unit.txt"
          echo 'P01_D86_WRONG_PACKAGE_SOURCE_MISSING_EXTRA_SYMLINK_REFUSED=PASS'
          python3 scripts/build_p01_next_major_migration_candidate.py build \
            --bridge-v516-full "$RUNNER_TEMP/p01-bridge-developer/VF-Start-V2.47.516-FULL-DEV-ONLY.zip" \
            --laravel-v517-full "$RUNNER_TEMP/d71-cloudpanel-full.zip" \
            --output "$RUNNER_TEMP/VF_Start_V2.47.516_to_V2.47.517_MAJOR_DEV_ONLY.zip" \
            > "$RUNNER_TEMP/d71-d86-build.txt" 2>&1
          python3 scripts/build_p01_next_major_migration_candidate.py verify \
            --zip "$RUNNER_TEMP/VF_Start_V2.47.516_to_V2.47.517_MAJOR_DEV_ONLY.zip" \
            > "$RUNNER_TEMP/d71-d86-verify.txt" 2>&1
          echo 'P01_D86_REAL_OFFICIAL_V515_PLUS_EXACT_V516_DEV_ASSET=PASS'
      - name: Prepare locked Laravel library for D66 offline old-source converter
        shell: bash
        run: |
          set -Eeuo pipefail
          composer install --working-dir=candidate/src/app/next --no-dev             --prefer-dist --no-interaction --no-progress --no-scripts --no-plugins             > "$RUNNER_TEMP/d71-converter-composer.txt" 2>&1
          test -f candidate/src/app/next/vendor/autoload.php
          echo "P01_D71_D66_NATIVE_LARAVEL_OFFLINE_CONVERTER=READY"
      - name: Real old installer then native Next sealed session and failure recovery
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! P01_D65_OFFICIAL_ASSET_ISOLATED=YES             python3 candidate/tests/compatibility/laravel/run_p01_v516_to_v517_official_bridge.py               --release-full "$RUNNER_TEMP/d71-official/VF-Start-V2.47.515-FULL.zip"               --candidate-root candidate               --future-bundle "$RUNNER_TEMP/d71-cloudpanel-full.zip" \
              --major-envelope "$RUNNER_TEMP/VF_Start_V2.47.516_to_V2.47.517_MAJOR_DEV_ONLY.zip" \
              --bridge-atomic "$RUNNER_TEMP/p01-bridge-developer/repair-v2.47.516.php" \
              --archive-full-old-site --major-migration-transactions               > "$RUNNER_TEMP/d71-results.txt" 2>&1; then
            grep '^P01_D[0-9][0-9]_' "$RUNNER_TEMP/d71-results.txt" | tail -n 60 || true
            exit 1
          fi
          grep '^P01_D[0-9][0-9]_' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D65_ACTUAL_OLD515_ATOMIC_PHP516_BRIDGE_INSTALLED=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D65_REAL_OLD_RELEASE_HTTP_CSRF_INSTALL_SETUP_LOCK=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D65_REAL_V515_WHOLE_TREE_D73_RELOCATION_AND_RESTORE=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D66_ACTUAL_INSTALLED_OLD_DATABASE_TO_NEW35_TABLE_CLONE=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_MAJOR_OFFLINE_REAL_V515_TO_V516_DATA_STAGE=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_MAJOR_OFFLINE_ABORT_BAD_SHA_AND_REPLAY_REFUSED=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_MAJOR_OFFLINE_SIGNED_RELEASE_OWNER_APPLY_CLOUDPANEL=NO' "$RUNNER_TEMP/d71-results.txt"
          echo 'P01_CANONICAL_SQLITE_TRANSFER_NEW_RUNTIME_IN_REAL_V515_TO_LARAVEL_CHAIN=PASS'
          grep -Fx 'P01_D67_REAL_LARAVEL_INSTALLATION_SEALED_AFTER_REAL_OLD_CLONE=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_MAJOR_OFFLINE_DATA_IN_REAL_LARAVEL_SEALED_RUNTIME=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_MAJOR_REUSABLE_OFFLINE_OWNER_DATA_MEDIA_SEALED=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_MAJOR_OWNER_STAGE_BAD_SOURCE_AND_MEDIA_REFUSED=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D67_OLD_OWNER_NO_RESET_NATIVE_CREDENTIAL_STORE=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D67_OFFICIAL_OLD_OWNER_LOGIN_AND_PRIVATE_HTTP_READ=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D67_REAL_LARAVEL_AUTH_CSRF_AND_OLD_RECORD_NEW_WRITE=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D67_CORRUPT_SEAL_FAIL_CLOSED_EXACT_RESTORE=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D67_ORIGINAL_OFFICIAL_OLD_INSTALL_UNCHANGED=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D68_SAME_HOST_ACTUAL_OLD516_HTTPS_FPM=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D68_SAME_HOST_CUTOVER_TO_SEALED_NEXT=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D78_AFTER_NEW_OWNER_WRITE_FAIL_CLOSED_503=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D78_NEW_OWNER_ONLY_DATA_STILL_PRESERVED=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D78_PRIVATE_HEAD_FAIL_CLOSED=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D78_UNPATCHED_LEGACY_PUBLIC_ROLLBACK=NO' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D78_NEW_OWNER_WRITE_RECONCILIATION=RECOVERY_REQUIRED' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D68_SITE_ROOT_SWAP_TEST_IS_OWNER_ATOMIC=NO' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D67_COMPLETE_OLD_TO_NEXT_ISOLATED_HTTP_PHASE=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D71_REAL_NGINX_FAILED_NEW_HEALTH_RETURNS_OLD516=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D71_NATIVE_TX_FAULT_BACK_TO_REAL_OLD_HTTPS=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D71_LEGACY_PUBLIC_ROLLBACK_PROOF_PRIVATE_READY=NO' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D78_REAL_HTTPS_MAINTENANCE_BEFORE_CUTOVER=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D78_NATIVE_PRIVATE_FAILURE_MAINTENANCE_503=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D78_REAL_NGINX_HTTPS_MAINTENANCE_NO_LEGACY_LEAK=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D78_NATIVE_PRIVATE_SUCCESS_FROM_MAINTENANCE=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D78_PRIVATE_SAFE_TWO_SWITCHES_NATIVE_TX=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D71_NATIVE_TX_COMMITTED_TO_REAL_NEXT_HTTPS=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D71_V516_REAL_OLD_GLOBAL_WRITE_BARRIER=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D71_FULL_OLD_TREE_SNAPSHOT_BEFORE_CUTOVER=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D71_REAL_RESTORED_OLD_OWNER_DB_MEDIA_FROM_D69=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D86_EXACT_DEV_PACKAGE_TO_ACTUAL_NATIVE_RUNTIME=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D85_REAL_OFFLINE_RESTORED_OWNER_DB_MEDIA_FULL_TREE=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D85_CORRUPT_UNCLASSIFIED_ASSET_AND_CRASH_REPLAY_REFUSED=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D71_REAL_LARAVEL_OWNER_DATA_MEDIA_SEALED_CHECK=PASS' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D71_OWNER_CLICK_UI=NOT_PROVEN' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D71_OFFICIAL_GITHUB_SHA256_V517_ASSET=NOT_PROVEN' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D71_PRIVILEGED_CLOUDPANEL_ROOT_ADAPTER=NOT_PROVEN' "$RUNNER_TEMP/d71-results.txt"
          grep -Fx 'P01_D67_INSTALLED_REAL_ATOMIC_UPDATE_WITH_CODE_POINTER=NOT_PROVEN' "$RUNNER_TEMP/d71-results.txt"
          echo 'P01_D78_REAL_NGINX_PRIVATE_FAILCLOSED_TWO_ROOT_GATE=PASS'
          echo 'P01_D71_REAL_MAJOR_MIGRATION_SAME_HOST_PHASE=PASS'
      - name: Always cleanup source and synthetic state
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate bridge-src "$RUNNER_TEMP/d71-official" "$RUNNER_TEMP/p01-bridge-developer"
          rm -f -- "$RUNNER_TEMP/p01-lane-validated.json" "$RUNNER_TEMP/p01-lane-audited.json"
          rm -f -- "$RUNNER_TEMP/d82-results.txt"
          rm -f -- "$RUNNER_TEMP"/d71-*.txt "$RUNNER_TEMP"/d71-*.zip "$RUNNER_TEMP"/p01-bridge-*.txt
          rm -f -- "$RUNNER_TEMP/VF_Start_V2.47.516_to_V2.47.517_MAJOR_DEV_ONLY.zip"
          echo "P01_D71_PRIVATE_SOURCE_ASSET_AND_USER_DATA_PERSISTED=NO"
          echo "P01_D71_PUBLIC_ARTIFACTS=NONE"
