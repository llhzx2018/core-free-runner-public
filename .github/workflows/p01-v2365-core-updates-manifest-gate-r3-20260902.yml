name: P01 V2.36.5 Core Updates Manifest Gate R3
on:
  push:
    branches: [release/p01-v2365-candidate-20260902]
    paths: [.github/workflows/p01-v2365-core-updates-manifest-gate-r3-20260902.yml]
permissions:
  actions: read
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      CORE_REPO: llhzx2018/core-updates
      CORE_BASE: 71a9e1d2103db16d5bbf5c023396eaa35c7e9d2a
      CORE_CANDIDATE: 79314e9d43b8ec587262e7fe48bcdcc3b2f03407
      CORE_BRANCH: release/p01-v2365-core-updates-20260902
      FORMAL: ef86eba16aec71c1d0dabc16ad23089a78ee5057
      TAG: v2.36.5
      RELEASE_ID: '380771266'
      ASSET: VF_Start_V2.36.5_UPDATE.zip
      ASSET_BYTES: '1238610'
      ASSET_SHA: bb28284f15e8e94673f604c43f1b89692134dc92fdce8343cefc90431e52f6b6
      SCHEMA: '2026082901'
      RELEASE_GATE: '33550328295'
      MANIFEST_GATE_R1: '33550481109'
      MANIFEST_GATE_R2: '33550561059'
    steps:
      - name: Prior gate classification and release truth
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(GH_TOKEN='${{ github.token }}' gh api repos/llhzx2018/core-free-runner-public/actions/runs/$MANIFEST_GATE_R1 --jq .conclusion)" = failure
          test "$(GH_TOKEN='${{ github.token }}' gh api repos/llhzx2018/core-free-runner-public/actions/runs/$MANIFEST_GATE_R2 --jq .conclusion)" = failure
          test "$(GH_TOKEN='${{ github.token }}' gh api repos/llhzx2018/core-free-runner-public/actions/runs/33547781563 --jq .conclusion)" = success
          test "$(GH_TOKEN='${{ github.token }}' gh api repos/llhzx2018/core-free-runner-public/actions/runs/33548565663 --jq .conclusion)" = success
          test "$(GH_TOKEN='${{ github.token }}' gh api repos/llhzx2018/core-free-runner-public/actions/runs/$RELEASE_GATE --jq .conclusion)" = success
          test "$(gh api repos/$PRODUCT_REPO/branches/main --jq .commit.sha)" = "$FORMAL"
          test "$(gh api repos/$PRODUCT_REPO/git/ref/tags/$TAG --jq .object.sha)" = "$FORMAL"
          rel=$(gh api repos/$PRODUCT_REPO/releases/tags/$TAG)
          test "$(jq -r .id <<<"$rel")" = "$RELEASE_ID"
          test "$(jq -r .draft <<<"$rel")" = false
          test "$(jq -r .prerelease <<<"$rel")" = false
          printf 'MANIFEST_GATE_R1=HARNESS_ONLY_CROSS_REPO_TOKEN_404\nMANIFEST_GATE_R2=HARNESS_ONLY_BROWSER_DOWNLOAD_404_AFTER_METADATA_PASS\nRELEASE_TRUTH=PASS\n' | tee /tmp/prior-truth.txt
      - name: Exact candidate one-file boundary
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          head=$(gh api repos/$CORE_REPO/branches/$CORE_BRANCH --jq .commit.sha)
          test "$head" = "$CORE_CANDIDATE"
          commit=$(gh api repos/$CORE_REPO/commits/$CORE_CANDIDATE)
          test "$(jq -r '.parents|length' <<<"$commit")" = 1
          test "$(jq -r '.parents[0].sha' <<<"$commit")" = "$CORE_BASE"
          test "$(jq -r '.files|length' <<<"$commit")" = 1
          test "$(jq -r '.files[0].filename' <<<"$commit")" = projects/P01.json
          test "$(jq -r '.files[0].status' <<<"$commit")" = modified
          printf 'CORE_CANDIDATE=%s\nONE_FILE_BOUNDARY=PASS\n' "$head" | tee /tmp/core-candidate.txt
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CORE_CANDIDATE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          path: core
      - name: Validate single-hop manifest contract
        shell: bash
        run: |
          set -Eeuo pipefail
          f=core/projects/P01.json
          jq -e . "$f" >/dev/null
          test "$(jq -r .schema_version "$f")" = 1.0
          test "$(jq -r .project_id "$f")" = P01
          test "$(jq -r .component_id "$f")" = APP
          test "$(jq -r .enabled "$f")" = true
          test "$(jq -r .current_version "$f")" = 2.36.4
          test "$(jq -r .target_version "$f")" = 2.36.5
          test "$(jq -r .update_type "$f")" = ATOMIC
          test "$(jq -r '.from_versions|length' "$f")" = 1
          test "$(jq -r '.from_versions[0]' "$f")" = 2.36.4
          test "$(jq -r .schema_from "$f")" = "$SCHEMA"
          test "$(jq -r .schema_to "$f")" = "$SCHEMA"
          test "$(jq -r .repository "$f")" = "$PRODUCT_REPO"
          test "$(jq -r .release_tag "$f")" = "$TAG"
          test "$(jq -r .release_id "$f")" = "$RELEASE_ID"
          test "$(jq -r .product_identity "$f")" = "$FORMAL"
          test "$(jq -r .asset_name "$f")" = "$ASSET"
          test "$(jq -r .asset_bytes "$f")" = "$ASSET_BYTES"
          test "$(jq -r .asset_sha256 "$f")" = "$ASSET_SHA"
          test "$(jq -r .backup_required "$f")" = true
          test "$(jq -r .rollback_supported "$f")" = true
          test "$(jq -r .minimum_php "$f")" = 8.0.0
          printf 'SINGLE_HOP_2364_TO_2365=PASS\nSCHEMA_CHANGE=NO\nMIGRATION=NONE\n' | tee /tmp/manifest-contract.txt
      - name: Release asset exact authenticated readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          asset=$(gh api repos/$PRODUCT_REPO/releases/$RELEASE_ID/assets --paginate --jq '.[]|select(.name=="'"$ASSET"'")')
          test -n "$asset"
          test "$(jq -r .size <<<"$asset")" = "$ASSET_BYTES"
          test "$(jq -r .digest <<<"$asset")" = "sha256:$ASSET_SHA"
          asset_id=$(jq -r .id <<<"$asset")
          test -n "$asset_id"
          curl --fail --silent --show-error --location \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$PRODUCT_REPO/releases/assets/$asset_id" \
            -o /tmp/update.zip
          test "$(stat -c%s /tmp/update.zip)" = "$ASSET_BYTES"
          test "$(sha256sum /tmp/update.zip|awk '{print $1}')" = "$ASSET_SHA"
          unzip -tqq /tmp/update.zip
          printf 'RELEASE_ASSET_EXACT=PASS\nASSET_ID=%s\n' "$asset_id" | tee /tmp/release-asset.txt
      - name: Pre-promotion live channel readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          live=$(gh api "repos/$CORE_REPO/contents/projects/P01.json?ref=main" --jq .content | tr -d '\n' | base64 -d)
          test "$(jq -r .current_version <<<"$live")" = 2.36.3
          test "$(jq -r .target_version <<<"$live")" = 2.36.4
          test "$(jq -r .release_tag <<<"$live")" = v2.36.4
          printf 'LIVE_PRE_PROMOTION=2.36.3_TO_2.36.4\n' | tee /tmp/live-prepromotion.txt
      - name: Final manifest gate verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          printf 'P01_V2365_CORE_UPDATES_MANIFEST_GATE_R3=PASS\nR1=HARNESS_ONLY_CROSS_REPO_TOKEN_404\nR2=HARNESS_ONLY_BROWSER_DOWNLOAD_404_AFTER_METADATA_PASS\nCORE_CANDIDATE=%s\nFORMAL=%s\nTAG=%s\nRELEASE_ID=%s\nSINGLE_HOP=2.36.4_TO_2.36.5\nASSET_SHA=%s\nOWNER_PRODUCTION_WRITE=NO\n' "$CORE_CANDIDATE" "$FORMAL" "$TAG" "$RELEASE_ID" "$ASSET_SHA" | tee /tmp/verdict.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-v2365-core-updates-manifest-gate-r3-${{ github.run_id }}
          path: |
            /tmp/prior-truth.txt
            /tmp/core-candidate.txt
            /tmp/manifest-contract.txt
            /tmp/release-asset.txt
            /tmp/live-prepromotion.txt
            /tmp/verdict.txt
          if-no-files-found: warn
          retention-days: 90
