name: TEMP P01 V22119 Mobile Search Fix V2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-p01-v22119-mobile-search-fix-v2.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - shell: bash
        run: |
          set -Eeuo pipefail;test -n "$WRITE_TOKEN";git clone -q --branch maintenance/reference-driven-ui-2.21.19-20260819 "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/vf-start.git" product;test "$(git -C product rev-parse HEAD)" = '52c0ffa6e6ef668d9a6de3ace26379f590642844'
          python3 - <<'PY'
          p='product/src/assets/reference-ui.css';s=open(p,encoding='utf-8').read();old='body:not([data-vf-admin-shell]) .top-search{width:40px;min-width:40px;max-width:40px;height:38px;flex:0 0 40px;box-sizing:border-box;padding-inline:0!important;border-radius:9px}';new='body:not([data-vf-admin-shell]) .top-search{width:40px!important;min-width:40px!important;max-width:40px!important;inline-size:40px!important;min-inline-size:40px!important;max-inline-size:40px!important;height:38px;flex:0 0 40px!important;box-sizing:border-box!important;padding:0!important;overflow:hidden;border-radius:9px}\n  body:not([data-vf-admin-shell]) .top-search .top-search-label,\n  body:not([data-vf-admin-shell]) .top-search kbd{display:none!important}\n  body:not([data-vf-admin-shell]) .top-search svg{margin:0!important;flex:0 0 auto}'
          assert s.count(old)==1,s.count(old);s=s.replace(old,new,1);open(p,'w',encoding='utf-8',newline='\n').write(s)
          PY
          git -C product config user.name VictorForge;git -C product config user.email llhzx2018@gmail.com;git -C product add src/assets/reference-ui.css;git -C product commit -q -m 'fix(P01): enforce compact mobile search control';git -C product push -q origin HEAD:maintenance/reference-driven-ui-2.21.19-20260819;git -C product rev-parse HEAD >/tmp/newsha;git -C product rev-parse HEAD^{tree} >/tmp/newtree
      - env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -Eeuo pipefail;python3 - <<'PY'
          import json,os
          q={'schema':'vf-public-runner-result/v1','project_id':'P01','target_version':'2.21.19','gate':'MOBILE_SEARCH_WIDTH_FIX_V2','status':'SUCCESS','pass':True,'source_sha':open('/tmp/newsha').read().strip(),'source_tree':open('/tmp/newtree').read().strip(),'fix':'hard 40px inline sizing plus icon-only child visibility on mobile','private_data_persisted_publicly':False,'workflow_run_id':os.environ['GITHUB_RUN_ID']};open('/tmp/e.json','w').write(json.dumps(q,indent=2)+'\n')
          PY
          git clone -q --depth 1 --branch vf-agent-operations-v1 https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/core-free-runner-public.git out;mkdir -p out/vf-agent/results;cp /tmp/e.json out/vf-agent/results/P01-V2.21.19-MOBILE-SEARCH-FIX-V2.json;git -C out config user.name VictorForge;git -C out config user.email llhzx2018@gmail.com;git -C out add vf-agent/results/P01-V2.21.19-MOBILE-SEARCH-FIX-V2.json;git -C out commit -q -m 'evidence(P01): seal V2.21.19 mobile search sizing fix';git -C out pull -q --rebase origin vf-agent-operations-v1;git -C out push -q origin HEAD:vf-agent-operations-v1
