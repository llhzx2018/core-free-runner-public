name: P01 V2.21.18 PHP80 Probe
on:
  push:
    branches: [vf-agent-operations-v1]
    paths: ['.github/workflows/p01-v2.21.18-php80-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Rebuild and lint verbosely
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone -q --depth 1 --branch vf-agent-operations-v1 https://github.com/llhzx2018/core-free-runner-public.git runner
          git clone -q --depth 1 --branch candidate/v2.21.18-20260819 "https://x-access-token:${R}@github.com/llhzx2018/vf-start.git" candidate
          git clone -q --depth 1 --branch main "https://x-access-token:${R}@github.com/llhzx2018/vf-start.git" production
          test "$(git -C candidate rev-parse HEAD)" = 'a501d2394502319b0af9caaf1c171bdf94940a9d'
          OUT="$RUNNER_TEMP/p01-probe";mkdir -p "$OUT"
          python3 runner/scripts/p01-build-maintenance-candidate-v22118.py --candidate candidate/src --production production/src --out "$OUT" --candidate-commit a501d2394502319b0af9caaf1c171bdf94940a9d --candidate-tree 6188bb34ed5f5175b2d96468f8f495ea0bd1b5ca --production-commit 24c91ac9d76ac10780403bc2b326793c7c67c2ed
          php -l "$OUT/repair-v2.21.18.php"
          docker run --rm -v "$OUT:/work:ro" -w /work php:8.0-cli php -d display_errors=1 -l repair-v2.21.18.php
