name: P01 V2.21.19 Wire Reference UI
on:
  push:
    branches: [vf-agent-operations-v1]
    paths: ['.github/workflows/p01-v2.21.19-wire-reference-ui.yml']
permissions:
  contents: read
jobs:
  wire:
    runs-on: ubuntu-latest
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      REPO: llhzx2018/vf-start
      BRANCH: maintenance/reference-driven-ui-2.21.19-20260819
      EXPECTED: 5e581a69bd1d0d0c3f1686142ac8b106bccb92e8
    steps:
      - name: Wire shared reference assets into frontend and AdminShell
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"; test -n "$WRITE_TOKEN"
          git clone -q --branch "$BRANCH" "https://x-access-token:${READ_TOKEN}@github.com/${REPO}.git" product
          test "$(git -C product rev-parse HEAD)" = "$EXPECTED"
          python3 - <<'PY'
          from pathlib import Path
          root=Path('product')
          p=root/'src/index.php'
          s=p.read_text(encoding='utf-8')
          old='  <link rel="stylesheet" href="assets/frontend.css?v=22114">\n<script src="assets/update.js?v=22118" defer></script>'
          new='  <link rel="stylesheet" href="assets/frontend.css?v=22114">\n  <link rel="stylesheet" href="assets/reference-ui.css?v=22119">\n<script src="assets/reference-ui.js?v=22119" defer></script>\n<script src="assets/update.js?v=22118" defer></script>'
          if s.count(old)!=1: raise SystemExit('INDEX_ASSET_ANCHOR_DRIFT')
          s=s.replace(old,new)
          s=s.replace('data-ua-model="v2.21.14-front-shell"','data-ua-model="v2.21.19-reference-driven"')
          p.write_text(s,encoding='utf-8')

          p=root/'src/app/AdminShell.php'
          s=p.read_text(encoding='utf-8')
          old='<link rel="stylesheet" href="<?=htmlspecialchars(vf_admin_asset_url(\'assets/admin-shell.css\'),ENT_QUOTES,\'UTF-8\')?>">\n<?= $headHtml ?>\n<script src="<?=htmlspecialchars(vf_admin_asset_url(\'assets/admin-shell.js\'),ENT_QUOTES,\'UTF-8\')?>" defer></script>'
          new='<link rel="stylesheet" href="<?=htmlspecialchars(vf_admin_asset_url(\'assets/admin-shell.css\'),ENT_QUOTES,\'UTF-8\')?>">\n<link rel="stylesheet" href="<?=htmlspecialchars(vf_admin_asset_url(\'assets/reference-ui.css\'),ENT_QUOTES,\'UTF-8\')?>">\n<?= $headHtml ?>\n<script src="<?=htmlspecialchars(vf_admin_asset_url(\'assets/admin-shell.js\'),ENT_QUOTES,\'UTF-8\')?>" defer></script>\n<script src="<?=htmlspecialchars(vf_admin_asset_url(\'assets/reference-ui.js\'),ENT_QUOTES,\'UTF-8\')?>" defer></script>'
          if s.count(old)!=1: raise SystemExit('ADMIN_ASSET_ANCHOR_DRIFT')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          php -l product/src/index.php >/dev/null
          php -l product/src/app/AdminShell.php >/dev/null
          node --check product/src/assets/reference-ui.js
          test -s product/src/assets/reference-ui.css
          git -C product config user.name VictorForge
          git -C product config user.email llhzx2018@gmail.com
          git -C product add src/index.php src/app/AdminShell.php
          git -C product commit -q -m 'feat(P01): wire reference-driven UI into frontend and admin shell'
          newsha=$(git -C product rev-parse HEAD)
          git -C product remote set-url origin "https://x-access-token:${WRITE_TOKEN}@github.com/${REPO}.git"
          git -C product push -q origin "HEAD:refs/heads/${BRANCH}"
          echo "$newsha" > /tmp/newsha
      - name: Publish sanitized evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          sha=$(cat /tmp/newsha)
          git clone -q --depth 1 --branch vf-agent-operations-v1 "https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/core-free-runner-public.git" runner
          mkdir -p runner/vf-agent/results
          printf '{"schema":"vf-public-runner-result/v1","project_id":"P01","target_version":"2.21.19","gate":"REFERENCE_UI_WIRED","status":"SUCCESS","pass":true,"source_sha":"%s","private_data_persisted_publicly":false}\n' "$sha" > runner/vf-agent/results/P01-V2.21.19-REFERENCE-UI-WIRED.json
          git -C runner config user.name VictorForge; git -C runner config user.email llhzx2018@gmail.com
          git -C runner add vf-agent/results/P01-V2.21.19-REFERENCE-UI-WIRED.json
          git -C runner commit -q -m 'evidence(P01): wire V2.21.19 reference UI'
          git -C runner push -q origin HEAD:vf-agent-operations-v1
