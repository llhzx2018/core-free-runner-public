name: P08 R118 genuine private GitHub blob API rootless handoff probe
on:
  pull_request:
    paths:
      - .github/workflows/p08-r118-private-github-blob-real-get.yml
permissions:
  contents: read
jobs:
  pinned-private-blob:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Exact private source short-lived checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: ff5f3383cd217ff34491c7c515918ec3e3d3c3ad
          path: p08
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Real HTTPS private GitHub REST immutable object and pinned site-UID helper loader
        shell: bash
        env:
          P08_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          test -n "$P08_PRIVATE_READ_TOKEN"
          test "$(git -C p08 rev-parse HEAD)" = ff5f3383cd217ff34491c7c515918ec3e3d3c3ad
          test "$(git -C p08 hash-object scripts/p08_owner_site_build_helpers.py)" = e60029c44ca16fc99a74ed943077d6659278b8c0
          python3 -B - <<'PY'
          import os,runpy
          from pathlib import Path
          p=Path('p08/scripts/p08_prepare_owner_onefile_on_site.py')
          handlers=runpy.run_path(str(p))
          assert handlers['HELPER_BLOB_SHA1']=='e60029c44ca16fc99a74ed943077d6659278b8c0'
          funcs=handlers['verified_build_helpers'](os.environ['P08_PRIVATE_READ_TOKEN'])
          assert set(funcs)=={'run','php_cli','unzip_checked','temporary_node_env'}
          assert all(callable(x) for x in funcs.values())
          print('R118_GENUINE_PRIVATE_GITHUB_BLOB_JSON_SHA_AND_OWNER_SITE_HELPER=PASS')
          PY
      - name: Always erase private source checkout and credentials from workspace
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- p08
          echo R118_PRIVATE_CHECKOUT_PURGED=YES
