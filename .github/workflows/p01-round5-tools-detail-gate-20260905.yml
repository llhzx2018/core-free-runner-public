name: P01 Round 5 Tools Detail Gate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p01-round5-tools-detail-gate-20260905.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_REF: feature/p01-tools-scene-detail-20260905
      EXPECTED_SHA: 8f3e45b2ba5863b8a458ef694b5412c9bb38e76b
      BASE_SHA: 537c8f1c74731591f497e31594682eeaf3f4f0ac
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product

      - name: Verify exact source and no-schema boundary
        shell: bash
        run: |
          set -euo pipefail
          cd product
          tested="$(git rev-parse HEAD)"
          echo "TESTED_SHA=${tested}"
          test "${tested}" = "${EXPECTED_SHA}"
          test "$(cat VERSION)" = "2.46.1"
          changed="$(git diff --name-only "${BASE_SHA}..HEAD")"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(VERSION|src/VERSION\.txt|src/migrations/|src/app/bootstrap\.php)$'; then
            echo "Version, schema, migration or runtime bootstrap changed unexpectedly." >&2
            exit 1
          fi

      - name: PHP and JS syntax
        shell: bash
        run: |
          set -euo pipefail
          cd product
          for file in \
            src/tools.php \
            src/app/ToolSceneDetail.php \
            tests/unit/tool_scene_detail_contract.php \
            tests/unit/tool_scene_detail_source_contract.php
          do
            php -l "$file"
          done
          node --check src/assets/tool-scene-detail.js

      - name: Focused contracts
        shell: bash
        run: |
          set -euo pipefail
          cd product
          php tests/unit/tool_scene_detail_contract.php
          php tests/unit/tool_scene_detail_source_contract.php
          php tests/unit/tool_task_intent_contract.php
          php tests/unit/tool_home_source_contract.php
          php tests/unit/workspace_view_catalog_contract.php
          php tests/unit/workspace_nine_entry_source_contract.php
          php tests/unit/resource_search_contract.php
          php tests/unit/quick_open_global_contract.php
