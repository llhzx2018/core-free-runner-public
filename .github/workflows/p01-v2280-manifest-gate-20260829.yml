name: P01 V2.28 Manifest Gate
on:
  push:
    branches: [task/p01-v2280-manifest-gate-20260829]
    paths:
      - .github/workflows/p01-v2280-manifest-gate-20260829.yml
permissions:
  contents: read
jobs:
  manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MANIFEST_HEAD: a1a4a3d369c71b1602ea61dfb508d7b1524c685b
      MANIFEST_BASE: 0e834d734a0a1ed6b2173feee3435eb8f6015d96
      FORMAL_SOURCE: e010d484c8879737503a02612d0ba8cff1d2fd7d
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: a1a4a3d369c71b1602ea61dfb508d7b1524c685b
          fetch-depth: 0
          path: updates
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: e010d484c8879737503a02612d0ba8cff1d2fd7d
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Exact manifest and remote Release Gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C updates rev-parse HEAD)" = "$MANIFEST_HEAD"
          test "$(git -C updates merge-base "$MANIFEST_BASE" "$MANIFEST_HEAD")" = "$MANIFEST_BASE"
          test "$(git -C updates diff --name-only "$MANIFEST_BASE" "$MANIFEST_HEAD")" = 'projects/P01.json'
          M=updates/projects/P01.json
          jq -e '
            .schema_version=="1.0" and
            .project_id=="P01" and .component_id=="APP" and .enabled==true and
            .target_version=="2.28.0" and .update_type=="ATOMIC" and
            .from_versions==["2.27.0"] and
            .schema_from=="2026082801" and .schema_to=="2026082801" and
            .repository=="llhzx2018/vf-start" and .release_tag=="v2.28.0" and
            .asset_name=="VF_Start_V2.28.0_UPDATE.zip" and
            .asset_bytes==1255387 and
            .asset_sha256=="7a8f8ad9417edd6305494f1228b7953791b91afd539b31d9bac16490f089581f" and
            .release_id==378625381 and
            .release_identity=="v2.28.0@e010d484c8879737503a02612d0ba8cff1d2fd7d" and
            .backup_required==true and .rollback_supported==true and
            .released_at=="2026-08-28T16:45:22Z" and .minimum_php=="8.0.0"
          ' "$M" >/dev/null
          test "$(git -C product rev-parse HEAD)" = "$FORMAL_SOURCE"
          test "$(git -C product ls-remote --tags origin refs/tags/v2.28.0 | awk '{print $1}')" = "$FORMAL_SOURCE"
          R=$(gh api repos/llhzx2018/vf-start/releases/tags/v2.28.0)
          test "$(jq -r .id <<<"$R")" = 378625381
          test "$(jq -r .tag_name <<<"$R")" = v2.28.0
          test "$(jq -r .draft <<<"$R")" = false
          test "$(jq -r .prerelease <<<"$R")" = false
          test "$(jq -r .published_at <<<"$R")" = '2026-08-28T16:45:22Z'
          A=$(jq -c '.assets[]|select(.name=="VF_Start_V2.28.0_UPDATE.zip")' <<<"$R")
          test -n "$A"
          test "$(jq -r .size <<<"$A")" = 1255387
          test "$(jq -r .digest <<<"$A")" = 'sha256:7a8f8ad9417edd6305494f1228b7953791b91afd539b31d9bac16490f089581f'
          rm -rf /tmp/remote && mkdir -p /tmp/remote
          gh release download v2.28.0 -R llhzx2018/vf-start -p VF_Start_V2.28.0_UPDATE.zip -D /tmp/remote
          test "$(stat -c%s /tmp/remote/VF_Start_V2.28.0_UPDATE.zip)" = 1255387
          test "$(sha256sum /tmp/remote/VF_Start_V2.28.0_UPDATE.zip | awk '{print $1}')" = 7a8f8ad9417edd6305494f1228b7953791b91afd539b31d9bac16490f089581f
          test "$(unzip -Z1 /tmp/remote/VF_Start_V2.28.0_UPDATE.zip | wc -l)" = 1
          unzip -Z1 /tmp/remote/VF_Start_V2.28.0_UPDATE.zip | grep -Fx repair-v2.28.0.php >/dev/null
          unzip -p /tmp/remote/VF_Start_V2.28.0_UPDATE.zip repair-v2.28.0.php >/tmp/repair-v2.28.0.php
          php -l /tmp/repair-v2.28.0.php >/dev/null
          echo P01_V228_MANIFEST_EXACT=PASS
          echo P01_V228_REMOTE_RELEASE_ASSET=PASS
          echo P01_V228_MANIFEST_READY_TO_MERGE=YES
          echo OWNER_PRODUCTION_WRITE=NO
