name: GOV-DOC P189 exact-source isolated test-install receipt proof
on:
  pull_request:
    paths:
      - '.github/workflows/governance-p189-proof.yml'
permissions:
  contents: read
jobs:
  exact-governance-proof:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout public workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact private GOV-DOC source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: cc25c85913689a112c8fc8adab99c969ff36c1fe
          path: .gov-private
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact private source identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C .gov-private rev-parse HEAD)" = "cc25c85913689a112c8fc8adab99c969ff36c1fe"
          echo 'GOV_SOURCE=cc25c85913689a112c8fc8adab99c969ff36c1fe'
      - name: Verify test-install receipt negatives on exact private source
        shell: bash
        run: |
          set -Eeuo pipefail
          cd .gov-private
          python3 -B -m unittest discover -s governance/agent -p 'test_project_test_install_receipt_gate.py' -q
          echo 'PROJECT_TEST_INSTALL_RECEIPT_NEGATIVE_FIXTURES=PASS'
      - name: Re-run GOV-DOC applicable current and closure regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          cd .gov-private
          python3 -B -m unittest discover -s governance/public-authority/tools -p 'test_global_closure_lint.py' -q
          python3 -B -m unittest discover -s governance/public-authority/tools -p 'test_current_dependency_lint.py' -q
          python3 -B -m unittest discover -s governance/agent -p 'test_repository_source_adoption_gate.py' -q
          echo 'GOV_GATES_SOURCE_TESTS=PASS'
      - name: Cleanup transient private checkout
        if: always()
        shell: bash
        run: |
          rm -rf -- .gov-private
          echo 'PRIVATE_CHECKOUT_REMOVED=YES'
