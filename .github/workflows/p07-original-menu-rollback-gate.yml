name: P07 restore original menu1 and menu2 regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'installers/p07-toolbox.sh'
      - '.github/workflows/p07-original-menu-rollback-gate.yml'
permissions:
  contents: read
jobs:
  historical-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check original menu 1 exact code and unchanged 3–5 routing
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n installers/p07-toolbox.sh
          python3 - <<'PY'
          import pathlib, urllib.request
          current=pathlib.Path('installers/p07-toolbox.sh').read_text()
          url=('https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/'
               'f8f923093a7e3a1c56c2b3c2a7a2e5a0ed91d49f/installers/p07-toolbox.sh')
          with urllib.request.urlopen(url,timeout=20) as response:
              previous=response.read().decode()
          def node_block(s):
              return (s[s.index('VF_NODE_PUBLIC='):s.index('VPS_AUDIT_PUBLIC=')]
                      +s[s.index('local_node_version() {'):s.index('sha256_file() {')])
          assert node_block(current.replace('VF_NODE_EXPECTED="0.1.0-rc13"','VF_NODE_EXPECTED="0.1.0-rc12"'))==node_block(previous), 'Menu 1 changed beyond authorized rc13 version pin'
          assert 'VF_NODE_EXPECTED="0.1.0-rc13"' in current
          for label in ('网络代理节点','服务器性能检测','网站与数据','服务器维护与安全','新服务器初始化'):
              assert label in current
          assert 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release84"' in current
          assert 'SYSTEM_CARE_EXPECTED="0.1.0-rc49"' in current
          assert 'VPS_AUDIT_EXPECTED="V2.1.0"' in current
          assert 'VPS_AUDIT_BUILD_EXPECTED="2.1.0-rc7-field"' in current
          assert 'VPS_AUDIT_SHA256="d1846e751bba5c860c623e3db26641908e27ca43b39cf37016758853b65a952d"' in current
          assert '  bash "$tmp"' in current
          audit=current[current.index('run_vps_audit() {'):current.index('local_server_ops_version() {')]
          assert 'NO_COLOR=1 bash "$tmp"\n' not in audit
          assert 'render_vps_audit_output' not in current
          print('P07_ORIGINAL_MENU1_EXACT=PASS')
          print('P07_ORIGINAL_MENU2_PIN=PASS')
          PY
      - name: Historical V2.1.0 identity and original full-test coverage
        shell: bash
        run: |
          set -Eeuo pipefail
          tmp="$(mktemp -d -t p07-rollback-ci.XXXXXX)"
          trap 'rm -rf -- "$tmp"' EXIT
          original="$tmp/original-v21.sh"
          curl -fsSL --retry 2 --connect-timeout 10 --max-time 45 \
            'https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/0a851b9fe1819c7970ed5bb8e3633f2fc8e73166/experiments/p07-vps-audit-v21.sh' -o "$original"
          test "$(sha256sum "$original" | awk '{print $1}')" = d1846e751bba5c860c623e3db26641908e27ca43b39cf37016758853b65a952d
          bash -n "$original"
          test "$(NO_COLOR=1 bash "$original" --version | awk '{print $NF}')" = V2.1.0
          test "$(NO_COLOR=1 bash "$original" --build-id)" = 2.1.0-rc7-field
          grep -Fq 'run_base' "$original"
          grep -Fq 'print_fio' "$original"
          grep -Fq 'print_three_carrier_route' "$original"
          grep -Fq 'write_markdown' "$original"
          grep -Fq 'script -qec' "$original"
          # Only isolated rendering: no CPU load, disk I/O, network probing or real server test.
          mkdir -p "$tmp/reports"
          env -u NO_COLOR P07_V21_SKIP_BASE=1 P07_V21_SKIP_FIO=1 P07_V21_SKIP_ROUTE=1 \
            P07_REPORT_DIR="$tmp/reports" \
            script -qec "bash '$original'" /dev/null > "$tmp/output"
          python3 - "$tmp/output" <<'PY'
          import pathlib,sys
          buf=pathlib.Path(sys.argv[1]).read_bytes()
          assert b'\x1b[' in buf, 'Original TTY ANSI colors not visible'
          text=buf.decode('utf-8','replace')
          assert '增强磁盘低负载测试' in text
          assert '中国三网回程' in text
          assert text.index('增强磁盘低负载测试') < text.index('中国三网回程')
          print('P07_ORIGINAL_ANSI_COLOR=PASS')
          print('P07_ORIGINAL_FULL_TEST_CATEGORIES=PASS')
          PY
