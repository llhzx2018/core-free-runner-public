name: P06 V3 Actions Intake Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p06-v3-actions-intake-probe.yml'
      - 'requests/p06-v3-actions-intake-probe-*.txt'

permissions:
  contents: write

concurrency:
  group: p06-v3-actions-intake-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
      - name: Persist intake receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/p06/infra
          cat > evidence/p06/infra/ACTIONS_INTAKE_CURRENT.txt <<'EOF'
          P06_ACTIONS_INTAKE=PASS
          RUNNER=ubuntu-24.04
          PRIVATE_SOURCE_USED=NO
          SECRET_USED=NO
          USER_MANUAL_EXECUTION_REQUIRED=NO
          EOF
          git config user.name 'VF Public Runner'
          git config user.email 'vf-public-runner@users.noreply.github.com'
          git add evidence/p06/infra/ACTIONS_INTAKE_CURRENT.txt
          if ! git diff --cached --quiet; then
            git commit -m 'evidence(P06): Actions intake PASS'
            git push origin HEAD:main
          fi
          echo 'P06_ACTIONS_INTAKE=PASS'
