name: P07 Stable Installer Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'installers/p07.sh'
      - 'installers/p07-final.sh'
      - 'dist/p07/0.1.0/**'
      - '.github/workflows/p07-stable-installer-smoke.yml'
  pull_request:
    paths:
      - 'installers/p07.sh'
      - 'installers/p07-final.sh'
      - 'dist/p07/0.1.0/**'
      - '.github/workflows/p07-stable-installer-smoke.yml'

permissions:
  contents: read

jobs:
  stable-install-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Resolve current direct-runtime identity
        run: |
          set -Eeuo pipefail
          bash -n installers/p07.sh
          bash -n installers/p07-final.sh
          ! grep -Fq 'guided-init' installers/p07-final.sh
          ! grep -Fq 'BASE_INSTALLER_URL' installers/p07-final.sh
          ! grep -Eq 'apt-get install.*(rclone|openssh-client)' installers/p07-final.sh
          grep -Fq 'RUNTIME.gitblob' installers/p07-final.sh
          grep -Fq '0.1.0-release4' installers/p07-final.sh
          grep -Fq '0.1.0-release4' installers/p07-toolbox.sh

          python3 - <<'PY' >> "$GITHUB_ENV"
          import re
          from pathlib import Path
          text=Path("installers/p07-final.sh").read_text(encoding="utf-8")
          for key,pattern in {
              "P07_EXPECTED_VERSION": r'^EXPECTED_VERSION="([^"]+)"$',
              "P07_EXPECTED_BUILD": r'^EXPECTED_BUILD_ID="([^"]+)"$',
              "P07_RUNTIME_MANIFEST_BLOB": r'^RUNTIME_MANIFEST_BLOB="([0-9a-f]{40})"$',
          }.items():
              m=re.search(pattern,text,re.M); assert m,(key,pattern); print(f"{key}={m.group(1)}")
          PY

      - name: Install exact current runtime in isolated path
        run: |
          set -Eeuo pipefail
          ROOT=/tmp/p07-stable-current
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          REF="${{ github.event.pull_request.head.sha || github.sha }}"
          sudo env             P07_PUBLIC_ROOT="https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/$REF"             P07_ALLOW_NONROOT=1 P07_NO_EXEC=1 P07_TOOLBOX_PARENT=1             P07_INSTALL_DIR="$ROOT/install" P07_PREVIOUS_DIR="$ROOT/previous" P07_BIN_LINK="$ROOT/vfops"             bash installers/p07.sh 2>&1 | tee /tmp/p07-current-install-output.txt

          test "$("$ROOT/vfops" --version)" = "$P07_EXPECTED_VERSION"
          test "$("$ROOT/vfops" --build-id)" = "$P07_EXPECTED_BUILD"
          test "$("$ROOT/vfops" --build-id)" = '0.1.0-release4'
          test "$(git hash-object "$ROOT/install/.runtime-manifest.gitblob")" = "$P07_RUNTIME_MANIFEST_BLOB"
          grep -Fq 'ensure_rclone' "$ROOT/install/bin/vfops-storage-setup"
          grep -Fq 'ensure_migration_dependencies' "$ROOT/install/bin/vfops-migrate-ui"
          grep -Fq '现在才按需安装' "$ROOT/install/bin/vfops-storage-setup"
          grep -Fq '现在才按需安装' "$ROOT/install/bin/vfops-migrate-ui"
          ! grep -Fq 'guided-init' /tmp/p07-current-install-output.txt
          ! grep -Eq '^Ran [0-9]+ tests' /tmp/p07-current-install-output.txt
          grep -Fq '只安装 Slot 3 当前运行时，不回放历史 RC / guided-init 安装链' /tmp/p07-current-install-output.txt

      - name: Current install short-circuits
        run: |
          set -Eeuo pipefail
          ROOT=/tmp/p07-stable-current
          REF="${{ github.event.pull_request.head.sha || github.sha }}"
          sudo env             P07_PUBLIC_ROOT="https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/$REF"             P07_ALLOW_NONROOT=1 P07_NO_EXEC=1 P07_TOOLBOX_PARENT=1             P07_INSTALL_DIR="$ROOT/install" P07_PREVIOUS_DIR="$ROOT/previous" P07_BIN_LINK="$ROOT/vfops"             bash installers/p07-final.sh 2>&1 | tee /tmp/p07-current-second-run.txt
          grep -Fq '已是当前版本，无需下载或重复安装' /tmp/p07-current-second-run.txt

      - name: Result
        run: echo 'P07_STABLE_INSTALLER_RELEASE4_LAZY_RUNTIME=PASS'
