name: P07 Stable Installer Smoke

on:
  workflow_dispatch:
  push:
    paths:
      - 'release-triggers/p07-stable-installer-smoke.json'
      - 'installers/p07.sh'
      - 'installers/p07-rc3-candidate.sh'
      - '.github/workflows/p07-stable-installer-smoke.yml'

permissions:
  contents: read

jobs:
  stable-install-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Verify RC2 immutable base identity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          trigger=json.loads(Path('release-triggers/p07-stable-installer-smoke.json').read_text())
          identity={}
          for line in Path('dist/p07/0.1.0-rc2/SOURCE_IDENTITY.txt').read_text().splitlines():
              if '=' in line:
                  k,v=line.split('=',1); identity[k]=v
          checksum=Path('dist/p07/0.1.0-rc2/SHA256SUMS.txt').read_text().split()[0]
          assert identity['source_commit'] == trigger['source_commit']
          assert checksum == trigger['package_sha256']
          assert identity['channel'] == 'RC2'
          PY

      - name: Verify stable wrapper and exact RC3 candidate identity
        run: |
          set -euo pipefail
          cp installers/p07.sh /tmp/p07.sh
          cp installers/p07-rc3-candidate.sh /tmp/p07-candidate.sh
          bash -n /tmp/p07.sh
          bash -n /tmp/p07-candidate.sh
          python3 - <<'PY'
          import hashlib,re
          stable=open('/tmp/p07.sh','r',encoding='utf-8').read()
          candidate=open('/tmp/p07-candidate.sh','rb').read()
          m=re.search(r'^EXPECTED_BLOB="([0-9a-f]{40})"$', stable, re.M)
          assert m, 'stable wrapper missing EXPECTED_BLOB'
          actual=hashlib.sha1(b'blob '+str(len(candidate)).encode()+b'\0'+candidate).hexdigest()
          assert actual == m.group(1), (actual,m.group(1))
          PY
          grep -F 'rollback_install()' /tmp/p07-candidate.sh
          grep -F 'mv "$PREVIOUS_DIR" "$INSTALL_DIR"' /tmp/p07-candidate.sh
          grep -F 'ssh-copy-id' /tmp/p07-candidate.sh
          grep -F 'ssh-keygen' /tmp/p07-candidate.sh
          grep -F 'openssh-client' /tmp/p07-candidate.sh
          grep -F 'rclone' /tmp/p07-candidate.sh
          grep -F '一键从已有 P07 服务器导入' /tmp/p07-candidate.sh

      - name: Run exact public stable installer
        run: |
          set -euo pipefail
          sudo env P07_NO_EXEC=1 bash /tmp/p07.sh 2>&1 | tee /tmp/p07-install-output.txt
          ! grep -F '% Total' /tmp/p07-install-output.txt
          grep -F '[P07] 安装完成 ✓' /tmp/p07-install-output.txt
          grep -F '版本：VF Server Ops 0.1.0 RC3' /tmp/p07-install-output.txt
          grep -F '远程初始化：支持从已有 P07 服务器一键导入' /tmp/p07-install-output.txt

      - name: Verify installed prerequisites
        run: |
          set -euo pipefail
          command -v ssh
          command -v ssh-copy-id
          command -v ssh-keygen
          command -v rclone

      - name: Verify installed RC3 user entry
        run: |
          set -euo pipefail
          test "$(vfops --version)" = 'VF Server Ops 0.1.0 RC3'
          test "$(readlink -f /usr/local/bin/vfops)" = '/opt/vf-server-ops/bin/vfops-user'
          vfops inventory --compact > /tmp/p07-inventory.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/p07-inventory.json'))
          assert p.get('schema') == 'vf-server-ops.inventory.v1'
          PY
          printf '0\n' | vfops > /tmp/p07-menu.txt
          grep -F 'P07 · VF Server Ops  0.1.0 RC3' /tmp/p07-menu.txt
          grep -F '1. 查看这台服务器' /tmp/p07-menu.txt
          grep -F '2. 备份网站' /tmp/p07-menu.txt
          grep -F '3. 迁移网站到新服务器' /tmp/p07-menu.txt
          grep -F '4. 恢复备份' /tmp/p07-menu.txt
          grep -F '5. 自动备份（本地 + Google + B2）' /tmp/p07-menu.txt
          test -x /opt/vf-server-ops/bin/vfops-storage-setup
          grep -Fq '1. 一键从已有 P07 服务器导入' /opt/vf-server-ops/bin/vfops-storage-setup
          ! grep -F 'UNKNOWN' <(vfops --version)

      - name: Result
        run: echo 'P07_STABLE_INSTALLER_RC3_SMOKE=PASS'
