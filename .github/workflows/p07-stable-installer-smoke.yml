name: P07 Stable Installer Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'release-triggers/p07-stable-installer-smoke.json'
      - 'installers/p07.sh'
      - 'installers/p07-rc3-nav-flat.sh'
      - 'installers/p07-rc3-real-r1-dbadd-hotfix.sh'
      - 'installers/p07-rc3-real-r1-db-hotfix.sh'
      - 'installers/p07-rc3-cloudpanel-complete.sh'
      - 'installers/p07-rc3-candidate.sh'
      - 'dist/p07/0.1.0-rc3/**'
      - '.github/workflows/p07-stable-installer-smoke.yml'
  pull_request:
    paths:
      - 'release-triggers/p07-stable-installer-smoke.json'
      - 'installers/p07.sh'
      - 'installers/p07-rc3-nav-flat.sh'
      - 'installers/p07-rc3-real-r1-dbadd-hotfix.sh'
      - 'installers/p07-rc3-real-r1-db-hotfix.sh'
      - 'installers/p07-rc3-cloudpanel-complete.sh'
      - 'installers/p07-rc3-candidate.sh'
      - 'dist/p07/0.1.0-rc3/**'
      - '.github/workflows/p07-stable-installer-smoke.yml'

permissions:
  contents: read

jobs:
  stable-install-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify immutable base and layered installer identities
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          trigger=json.loads(Path('release-triggers/p07-stable-installer-smoke.json').read_text())
          identity={}
          for line in Path('dist/p07/0.1.0-rc2/SOURCE_IDENTITY.txt').read_text().splitlines():
              if '=' in line:
                  k,v=line.split('=',1); identity[k]=v
          checksum=Path('dist/p07/0.1.0-rc2/SHA256SUMS.txt').read_text().split()[0]
          assert identity['source_commit'] == trigger['source_commit']
          assert checksum == trigger['package_sha256']
          assert identity['channel'] == 'RC2'

          stable=Path('installers/p07.sh').read_text()
          init13=Path('installers/p07-rc3-nav-flat.sh').read_bytes()
          init12=Path('installers/p07-rc3-real-r1-dbadd-hotfix.sh').read_bytes()
          init11=Path('installers/p07-rc3-real-r1-db-hotfix.sh').read_bytes()
          complete=Path('installers/p07-rc3-cloudpanel-complete.sh').read_bytes()
          candidate=Path('installers/p07-rc3-candidate.sh').read_bytes()

          m=re.search(r'^EXPECTED_BLOB="([0-9a-f]{40})"$', stable, re.M); assert m
          init13_blob=hashlib.sha1(b'blob '+str(len(init13)).encode()+b'\0'+init13).hexdigest()
          assert init13_blob == m.group(1), (init13_blob,m.group(1))
          init13_text=init13.decode()
          assert 'EXPECTED_BUILD_ID="0.1.0-rc3-guided-init13"' in init13_text
          assert 'BASE_INSTALLER_BLOB="a16e4889128bdc2575b8f5e174e332e7a5b76700"' in init13_text
          assert 'BASE_PUBLIC_ROOT="https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/8ed82495a80f2b11a2d47dc8f33648d87e291da5"' in init13_text
          assert 'USER_UI_BLOB="1028b939ecd4c52377c846ab8e12ff136667981c"' in init13_text
          assert 'CLOUDPANEL_UI_BLOB="378412db5abba18dd6bc8f6f7125fa1098d765d8"' in init13_text
          assert 'COMMON_UI_BLOB="b591cd9b7e1ab9e715cf60cd702fee44f448e7ff"' in init13_text

          init12_blob=hashlib.sha1(b'blob '+str(len(init12)).encode()+b'\0'+init12).hexdigest()
          assert init12_blob == 'd733c7bc7b62e6ed81103855dc7f4f74619618a9'
          init12_text=init12.decode()
          assert 'EXPECTED_BUILD_ID="0.1.0-rc3-guided-init12"' in init12_text
          assert 'BASE_INSTALLER_BLOB="843fece49262dd030462273d0b188bdab75d8234"' in init12_text

          init11_blob=hashlib.sha1(b'blob '+str(len(init11)).encode()+b'\0'+init11).hexdigest()
          assert init11_blob == '7fb9667b0c0d2d07f3b9bcce3f50cede844f2219'
          complete_blob=hashlib.sha1(b'blob '+str(len(complete)).encode()+b'\0'+complete).hexdigest()
          assert complete_blob == 'a98aa0a79d9ca3c5c5050e1505184c5b86208aa0'
          complete_text=complete.decode()
          m3=re.search(r'^BASE_INSTALLER_BLOB="([0-9a-f]{40})"$', complete_text, re.M); assert m3
          candidate_blob=hashlib.sha1(b'blob '+str(len(candidate)).encode()+b'\0'+candidate).hexdigest()
          assert candidate_blob == m3.group(1), (candidate_blob,m3.group(1))
          PY
          bash -n installers/p07.sh
          bash -n installers/p07-rc3-nav-flat.sh
          bash -n installers/p07-rc3-real-r1-dbadd-hotfix.sh
          bash -n installers/p07-rc3-real-r1-db-hotfix.sh
          bash -n installers/p07-rc3-cloudpanel-complete.sh
          bash -n installers/p07-rc3-candidate.sh

      - name: Run exact stable installer
        run: |
          set -euo pipefail
          sudo env \
            P07_PUBLIC_ROOT="https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/${{ github.sha }}" \
            P07_NO_EXEC=1 \
            bash installers/p07.sh 2>&1 | tee /tmp/p07-install-output.txt
          ! grep -F '% Total' /tmp/p07-install-output.txt
          grep -F '[P07] CloudPanel 导航 guided-init13 安装完成 ✓' /tmp/p07-install-output.txt
          grep -F '版本：VF Server Ops 0.1.0 RC3' /tmp/p07-install-output.txt
          grep -F '选择一次网站后连续操作' /tmp/p07-install-output.txt

      - name: Verify installed guided-init13 runtime
        run: |
          set -euo pipefail
          test "$(vfops --version)" = 'VF Server Ops 0.1.0 RC3'
          test "$(vfops --build-id)" = '0.1.0-rc3-guided-init13'
          test "$(readlink -f /usr/local/bin/vfops)" = '/opt/vf-server-ops/bin/vfops-user'
          test "$(git hash-object /opt/vf-server-ops/bin/vfops-user)" = '1028b939ecd4c52377c846ab8e12ff136667981c'
          test "$(git hash-object /opt/vf-server-ops/bin/vfops-cloudpanel-ui)" = '378412db5abba18dd6bc8f6f7125fa1098d765d8'
          test "$(git hash-object /opt/vf-server-ops/lib/cloudpanel_ui_common.sh)" = 'b591cd9b7e1ab9e715cf60cd702fee44f448e7ff'
          test "$(git hash-object /opt/vf-server-ops/lib/site_lifecycle.py)" = '3e84dfa74b4df8413c3228322b8dc1c22d901761'
          test "$(git hash-object /opt/vf-server-ops/lib/restore_as_verified.py)" = 'c0df2750e0cb79e16bf46cad88e85cacacfc2415'
          ! grep -Fq 'REAL_PASS' /opt/vf-server-ops/lib/restore_as_verified.py
          printf '0\n' | vfops > /tmp/p07-menu.txt
          grep -F '6. 网站管理' /tmp/p07-menu.txt
          grep -F '7. CloudPanel 管理' /tmp/p07-menu.txt
          printf '0\n' | bash /opt/vf-server-ops/bin/vfops-cloudpanel-ui > /tmp/p07-cp-menu.txt
          grep -F '1. 网站管理' /tmp/p07-cp-menu.txt
          grep -F '2. CloudPanel 管理' /tmp/p07-cp-menu.txt
          ! grep -Eiq '^[[:space:]]*[0-9]+\.[[:space:]]*(删除网站|删除数据库|删除用户)' /tmp/p07-cp-menu.txt

      - name: Result
        run: echo 'P07_STABLE_INSTALLER_RC3_GUIDED_INIT13_SMOKE=PASS'
