name: P07 Stable Installer Smoke

on:
  workflow_dispatch:
  push:
    paths:
      - 'release-triggers/p07-stable-installer-smoke.json'
      - 'installers/p07.sh'

jobs:
  stable-install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify exact public package identity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          trigger=json.loads(Path('release-triggers/p07-stable-installer-smoke.json').read_text())
          identity={}
          for line in Path('dist/p07/0.1.0-rc2/SOURCE_IDENTITY.txt').read_text().splitlines():
              if '=' in line:
                  k,v=line.split('=',1); identity[k]=v
          checksum=Path('dist/p07/0.1.0-rc2/SHA256SUMS.txt').read_text().split()[0]
          assert identity['source_commit'] == trigger['source_commit']
          assert checksum == trigger['package_sha256']
          assert identity['channel'] == 'RC2'
          PY

      - name: Verify installer safety contract
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/p07.sh -o /tmp/p07.sh
          grep -F 'rollback_install()' /tmp/p07.sh
          grep -F 'mv "$PREVIOUS_DIR" "$INSTALL_DIR"' /tmp/p07.sh
          grep -F 'curl -fsSL' /tmp/p07.sh
          grep -F 'ssh-copy-id' /tmp/p07.sh
          grep -F 'ssh-keygen' /tmp/p07.sh
          grep -F 'openssh-client' /tmp/p07.sh

      - name: Run exact public installer
        run: |
          set -euo pipefail
          sudo bash /tmp/p07.sh 2>&1 | tee /tmp/p07-install-output.txt
          ! grep -F '% Total' /tmp/p07-install-output.txt
          grep -F '[P07] 安装完成 ✓' /tmp/p07-install-output.txt

      - name: Verify installed migration prerequisites
        run: |
          set -euo pipefail
          command -v ssh
          command -v ssh-copy-id
          command -v ssh-keygen

      - name: Verify installed user entry
        run: |
          set -euo pipefail
          test "$(vfops --version)" = 'VF Server Ops 0.1.0 RC2'
          test "$(readlink -f /usr/local/bin/vfops)" = '/opt/vf-server-ops/bin/vfops-user'
          vfops inventory --compact > /tmp/p07-inventory.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/p07-inventory.json'))
          assert p.get('schema') == 'vf-server-ops.inventory.v1'
          PY
          printf '1\n\n0\n' | vfops > /tmp/p07-menu.txt
          grep -F 'P07 · VF Server Ops  0.1.0 RC2' /tmp/p07-menu.txt
          grep -F '1. 查看这台服务器' /tmp/p07-menu.txt
          grep -F '2. 备份网站' /tmp/p07-menu.txt
          grep -F '3. 迁移网站到新服务器' /tmp/p07-menu.txt
          grep -F '4. 恢复备份' /tmp/p07-menu.txt
          grep -F '网站数量：' /tmp/p07-menu.txt
          ! grep -F 'UNKNOWN' <(vfops --version)
          ! grep -F '/usr/local/lib/inventory.py' /tmp/p07-menu.txt
