name: P07 Stable Installer Smoke

on:
  workflow_dispatch:
  push:
    branches: [main, work/p07-cloudpanel-foundation-complete]
    paths:
      - 'release-triggers/p07-stable-installer-smoke.json'
      - 'installers/p07.sh'
      - 'installers/p07-rc3-cloudpanel-complete.sh'
      - 'installers/p07-rc3-candidate.sh'
      - 'dist/p07/0.1.0-rc3/**'
      - '.github/workflows/p07-stable-installer-smoke.yml'
  pull_request:
    paths:
      - 'release-triggers/p07-stable-installer-smoke.json'
      - 'installers/p07.sh'
      - 'installers/p07-rc3-cloudpanel-complete.sh'
      - 'installers/p07-rc3-candidate.sh'
      - 'dist/p07/0.1.0-rc3/**'
      - '.github/workflows/p07-stable-installer-smoke.yml'

permissions:
  contents: read

jobs:
  stable-install-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify immutable base and layered installer identities
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          trigger=json.loads(Path('release-triggers/p07-stable-installer-smoke.json').read_text())
          identity={}
          for line in Path('dist/p07/0.1.0-rc2/SOURCE_IDENTITY.txt').read_text().splitlines():
              if '=' in line:
                  k,v=line.split('=',1); identity[k]=v
          checksum=Path('dist/p07/0.1.0-rc2/SHA256SUMS.txt').read_text().split()[0]
          assert identity['source_commit'] == trigger['source_commit']
          assert checksum == trigger['package_sha256']
          assert identity['channel'] == 'RC2'

          stable=Path('installers/p07.sh').read_text()
          complete=Path('installers/p07-rc3-cloudpanel-complete.sh').read_bytes()
          candidate=Path('installers/p07-rc3-candidate.sh').read_bytes()
          m=re.search(r'^EXPECTED_BLOB="([0-9a-f]{40})"$', stable, re.M)
          assert m
          complete_blob=hashlib.sha1(b'blob '+str(len(complete)).encode()+b'\0'+complete).hexdigest()
          assert complete_blob == m.group(1), (complete_blob,m.group(1))
          complete_text=complete.decode()
          m2=re.search(r'^BASE_INSTALLER_BLOB="([0-9a-f]{40})"$', complete_text, re.M)
          assert m2
          candidate_blob=hashlib.sha1(b'blob '+str(len(candidate)).encode()+b'\0'+candidate).hexdigest()
          assert candidate_blob == m2.group(1), (candidate_blob,m2.group(1))
          assert 'EXPECTED_BUILD_ID="0.1.0-rc3-guided-init10"' in complete_text
          assert 'BASE_PUBLIC_ROOT="https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/2ed5905103621693a8e8428229b501f1110be381"' in complete_text
          PY
          bash -n installers/p07.sh
          bash -n installers/p07-rc3-cloudpanel-complete.sh
          bash -n installers/p07-rc3-candidate.sh

      - name: Run exact stable installer
        run: |
          set -euo pipefail
          sudo env \
            P07_PUBLIC_ROOT="https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/${{ github.sha }}" \
            P07_NO_EXEC=1 \
            bash installers/p07.sh 2>&1 | tee /tmp/p07-install-output.txt
          ! grep -F '% Total' /tmp/p07-install-output.txt
          grep -F '[P07] 安装完成 ✓' /tmp/p07-install-output.txt
          grep -F '版本：VF Server Ops 0.1.0 RC3' /tmp/p07-install-output.txt

      - name: Verify installed guided-init10 runtime
        run: |
          set -euo pipefail
          test "$(vfops --version)" = 'VF Server Ops 0.1.0 RC3'
          test "$(vfops --build-id)" = '0.1.0-rc3-guided-init10'
          test "$(readlink -f /usr/local/bin/vfops)" = '/opt/vf-server-ops/bin/vfops-user'
          for path in \
            bin/vfops-cloudpanel-ui \
            lib/cloudpanel_ui_common.sh \
            lib/cloudpanel_ui_sites.sh \
            lib/cloudpanel_ui_ops.sh \
            lib/cloudpanel_ui_admin.sh \
            lib/cloudpanel.py \
            lib/cloudpanel_site.py \
            lib/site_lifecycle.py \
            lib/restore_as.py \
            lib/restore_as_verified.py; do
            test -f "/opt/vf-server-ops/$path"
          done
          printf '0\n' | vfops > /tmp/p07-menu.txt
          grep -F '6. CloudPanel 网站工具' /tmp/p07-menu.txt
          printf '0\n' | bash /opt/vf-server-ops/bin/vfops-cloudpanel-ui > /tmp/p07-cp-menu.txt
          grep -F '3. 创建网站' /tmp/p07-cp-menu.txt
          grep -F '4. 数据库工具' /tmp/p07-cp-menu.txt
          grep -F '5. SSL / HTTPS' /tmp/p07-cp-menu.txt
          grep -F '7. CloudPanel 安全' /tmp/p07-cp-menu.txt
          grep -F '8. CloudPanel 用户' /tmp/p07-cp-menu.txt
          grep -F '9. Vhost 模板' /tmp/p07-cp-menu.txt
          grep -F '10. 平台基础能力检查' /tmp/p07-cp-menu.txt
          ! grep -Eiq '删除网站|删除数据库|删除用户' /tmp/p07-cp-menu.txt

      - name: Result
        run: echo 'P07_STABLE_INSTALLER_RC3_GUIDED_INIT10_SMOKE=PASS'
