name: P01 V2.36.0 Final Remote Online Update Gate
on:
  push:
    branches: [temp/p01-v2360-release-gate-20260901]
    paths:
      - .github/workflows/p01-v2360-remote-online-final-20260901.yml
      - scripts/p01-v2360-remote-online-final.sh
permissions:
  contents: read
  actions: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      ROOT: /tmp/p01-v2360-final-owner
      PORT: '18760'
      ADMIN_PASS: 'P01V2360!FinalRemote'
      EVID: /tmp/p01-v2360-final-evidence
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - name: Checkout gate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: runner
      - name: Checkout immutable V2.35.3 source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.35.3
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: source
      - name: Checkout immutable V2.36.0 target
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.36.0
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: target
      - name: Checkout published V2.36.0 core-updates authority
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: 447e5f97bfaef078c31b752126f3b5bd0284a5ee
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: updates
      - name: Exact publication and discovery fence
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVID"
          test "$(git -C source rev-parse HEAD)" = 8f1073120f8096fc23554906615601752feb036d
          test "$(git -C source rev-parse HEAD^{tree})" = ece02ef928ad5b119e2b0237e7963a607865ddbb
          test "$(git -C source rev-parse HEAD:src)" = 7f181909c7ccd3179491f21cfca426008de4295f
          test "$(git -C target rev-parse HEAD)" = 225780b1ed56bbcc8e62ba465b1129e1c22ee60a
          test "$(git -C target rev-parse HEAD^{tree})" = 8af6d8ea6168fae52988cae8272a19073a0a7a2e
          test "$(git -C target rev-parse HEAD:src)" = ad3f96345ead330adffb20c7ecb3cdf6537036b6
          test "$(git -C updates rev-parse HEAD)" = 447e5f97bfaef078c31b752126f3b5bd0284a5ee
          test "$(gh api repos/llhzx2018/core-updates/branches/main --jq .commit.sha)" = 447e5f97bfaef078c31b752126f3b5bd0284a5ee
          test "$(gh api repos/llhzx2018/vf-start/branches/main --jq .commit.sha)" = 225780b1ed56bbcc8e62ba465b1129e1c22ee60a
          test "$(gh api repos/llhzx2018/vf-start/branches/develop --jq .commit.sha)" = 225780b1ed56bbcc8e62ba465b1129e1c22ee60a
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.35.3 --jq .object.sha)" = 8f1073120f8096fc23554906615601752feb036d
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.36.0 --jq .object.sha)" = 225780b1ed56bbcc8e62ba465b1129e1c22ee60a
          test "$(gh api repos/llhzx2018/vf-start/releases/tags/v2.36.0 --jq .id)" = 380209550
          for run in 33420047480 33420558251 33420751341 33420959848 33469243080 33469318027 33469427557; do
            test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$run --jq .conclusion)" = success
          done
          jq -e '.current_version=="2.35.3" and .target_version=="2.36.0" and .from_versions==["2.35.3"] and .schema_from=="2026082901" and .schema_to=="2026082901" and .release_tag=="v2.36.0" and .release_id==380209550 and .product_identity=="225780b1ed56bbcc8e62ba465b1129e1c22ee60a" and .asset_name=="VF_Start_V2.36.0_UPDATE.zip" and .asset_bytes==1404941 and .asset_sha256=="26daa0fefff8a867a554750fbd4a92106fb2f9b1f68014cf8dd214d837fe0ee6"' updates/projects/P01.json >/dev/null
          REL=$(gh api repos/llhzx2018/vf-start/releases/tags/v2.36.0)
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.36.0_UPDATE.zip")|.size' <<<"$REL")" = 1404941
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.36.0_UPDATE.zip")|.digest' <<<"$REL")" = sha256:26daa0fefff8a867a554750fbd4a92106fb2f9b1f68014cf8dd214d837fe0ee6
          echo P01_V2360_FINAL_REMOTE_TRUTH_FENCE=PASS | tee "$EVID/truth-fence.txt"
      - name: Real remote online update and V2.36.0 runtime gate
        shell: bash
        run: bash runner/scripts/p01-v2360-remote-online-final.sh
      - name: Final verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fx P01_V2353_TO_V2360_REMOTE_ONLINE_UPDATE=PASS "$EVID/runtime-verdict.txt"
          grep -Fx P01_V2360_REMOTE_DISCOVERY=PASS "$EVID/runtime-verdict.txt"
          grep -Fx P01_V2360_REMOTE_RELEASE_DOWNLOAD=PASS "$EVID/runtime-verdict.txt"
          grep -Fx P01_V2360_DATA_PRESERVATION=PASS "$EVID/runtime-verdict.txt"
          grep -Fx P01_V2360_SQLITE_INTEGRITY=PASS "$EVID/runtime-verdict.txt"
          grep -Fx P01_V2360_PUBLIC_PRIVATE_HTTP=PASS "$EVID/runtime-verdict.txt"
          grep -Fx P01_V2360_FIVE_DOMAIN_HTTP=PASS "$EVID/runtime-verdict.txt"
          grep -Fx P01_V2360_RUNTIME_FEATURE_BYTES=PASS "$EVID/runtime-verdict.txt"
          grep -Fx P01_V2360_LATEST_TERMINAL_STATE=PASS "$EVID/runtime-verdict.txt"
          cat > "$EVID/verdict.txt" <<'EOF'
          P01_V2353_TO_V2360_REMOTE_ONLINE_UPDATE_GATE=PASS
          P01_V2360_SCHEMA_UNCHANGED_2026082901=PASS
          P01_V2360_DATA_PRESERVATION=PASS
          P01_V2360_SQLITE_INTEGRITY=PASS
          P01_V2360_PUBLIC_PRIVATE_HTTP=PASS
          P01_V2360_FIVE_DOMAIN_HTTP=PASS
          P01_V2360_RUNTIME_FEATURE_BYTES=PASS
          P01_V2360_LATEST_TERMINAL_STATE=PASS
          P01_V2360_READY_FOR_OWNER_PRODUCTION_UPGRADE=YES
          OWNER_PRODUCTION_WRITE=NO
          EOF
          cat "$EVID/verdict.txt"
      - name: Upload final remote evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-v2360-final-remote-evidence-${{ github.run_id }}
          path: /tmp/p01-v2360-final-evidence
          if-no-files-found: warn
          retention-days: 90
