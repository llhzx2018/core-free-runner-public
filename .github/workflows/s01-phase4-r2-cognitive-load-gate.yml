name: S01 Phase 4 R2 Cognitive Load Gate

on:
  push:
    branches:
      - task/s01-phase4-r2-cognitive-load-gate
    paths:
      - .github/workflows/s01-phase4-r2-cognitive-load-gate.yml

permissions:
  contents: read

jobs:
  exact:
    name: R2 Gate (${{ matrix.component }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: OPS
            repo: llhzx2018/vf-tools-ops
            base: 8c2fb1f4037f87d674a0cfc16a02805cf7b2f569
            head: 89a8c3847527ac4be74d8db47da201deed09c2fe
            test: tests/s01-c02-page-body-system-v1-phase4-r2-cognitive-load-contract.php
            allowed: assets/css/current/admin-s01-dashboard-r14.css,tests/s01-c02-page-body-system-v1-phase4-r2-cognitive-load-contract.php
          - component: THEME
            repo: llhzx2018/vf-tools-theme
            base: 7fac7f5dcee3deb9c2fc4e8666adb3774f4bd202
            head: f362fadb922642fcf58699507930f39e614067dd
            test: tests/s01-c01-page-body-system-v1-phase4-r2-cognitive-load-contract.php
            allowed: src/assets/css/admin/pages/brand/admin-page-brand-refinement-v1.css,src/assets/css/admin/pages/page-structure/admin-page-layout-refinement-v1.css,src/assets/css/admin/pages/navigation/admin-page-navigation-refinement-v1.css,src/assets/css/admin/pages/seo/admin-page-seo-reference-v3.css,tests/s01-c01-page-body-system-v1-phase4-r2-cognitive-load-contract.php
          - component: M3U8
            repo: llhzx2018/vf-tools-m3u8
            base: 7ede1009c1c0a5c7a0b1d33f27fa6b7a655bc17c
            head: 4f7ca2c3ef4ad82d204f48f301a88dcaf534dcf8
            test: tests/s01-c03-page-body-system-v1-phase4-r2-cognitive-load-contract.php
            allowed: src/admin/ui-v4/admin-s01-page-body-system-v1.css,tests/s01-c03-page-body-system-v1-phase4-r2-cognitive-load-contract.php

    steps:
      - name: Credential gate
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo "PRIVATE_READ_CREDENTIAL=PASS"

      - name: Exact-source bounded diff gate
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          REPO: ${{ matrix.repo }}
          BASE: ${{ matrix.base }}
          HEAD: ${{ matrix.head }}
          ALLOWED: ${{ matrix.allowed }}
        run: |
          set -Eeuo pipefail
          curl -fsSL             -H "Authorization: Bearer $READ_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/commits/$HEAD" -o /tmp/head.json
          test "$(jq -r '.sha' /tmp/head.json)" = "$HEAD"
          curl -fsSL             -H "Authorization: Bearer $READ_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/compare/$BASE...$HEAD" -o /tmp/compare.json
          test "$(jq -r '.status' /tmp/compare.json)" = "ahead"
          IFS=',' read -r -a EXPECTED <<< "$ALLOWED"
          mapfile -t ACTUAL < <(jq -r '.files[].filename' /tmp/compare.json | sort)
          mapfile -t WANT < <(printf '%s\n' "${EXPECTED[@]}" | sort)
          diff -u <(printf '%s\n' "${WANT[@]}") <(printf '%s\n' "${ACTUAL[@]}")
          echo "BOUNDED_DIFF=PASS"

      - name: Fetch exact candidate
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          REPO: ${{ matrix.repo }}
          HEAD: ${{ matrix.head }}
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/src
          curl -fsSL -L             -H "Authorization: Bearer $READ_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/tarball/$HEAD" -o /tmp/src.tar.gz
          tar -xzf /tmp/src.tar.gz -C /tmp/src
          SOURCE_DIR="$(find /tmp/src -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$SOURCE_DIR"
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          echo "EXACT_SOURCE_FETCH=PASS"

      - name: R2 and legacy contracts
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
          TEST_FILE: ${{ matrix.test }}
        run: |
          set -Eeuo pipefail
          php "$SOURCE_DIR/$TEST_FILE"
          case "$COMPONENT" in
            OPS)
              php "$SOURCE_DIR/tests/s01-c02-page-body-system-v1-phase3-contract.php"
              php "$SOURCE_DIR/tests/s01-c02-page-body-system-v1-phase3-residue-contract.php"
              ;;
            THEME)
              php "$SOURCE_DIR/tests/s01-c01-page-body-system-v1-phase3-contract.php"
              php "$SOURCE_DIR/tests/s01-c01-page-body-system-v1-phase3-residue-contract.php"
              ;;
            M3U8)
              php "$SOURCE_DIR/tests/s01-c03-page-body-system-v1-phase3-contract.php"
              php "$SOURCE_DIR/tests/s01-c03-page-body-system-v1-phase3-residue-contract.php"
              ;;
          esac
          echo "R2_AND_LEGACY_CONTRACTS=PASS"

      - name: Frozen boundary gate
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          set -Eeuo pipefail
          case "$COMPONENT" in
            OPS)
              ! grep -R -F '.vf-v6-shell-header' "$SOURCE_DIR/assets/css/current/admin-s01-dashboard-r14.css"
              ! grep -R -F '.vf-v6-domain-nav' "$SOURCE_DIR/assets/css/current/admin-s01-dashboard-r14.css"
              ;;
            THEME)
              for f in                 "$SOURCE_DIR/src/assets/css/admin/pages/brand/admin-page-brand-refinement-v1.css"                 "$SOURCE_DIR/src/assets/css/admin/pages/page-structure/admin-page-layout-refinement-v1.css"                 "$SOURCE_DIR/src/assets/css/admin/pages/navigation/admin-page-navigation-refinement-v1.css"                 "$SOURCE_DIR/src/assets/css/admin/pages/seo/admin-page-seo-reference-v3.css"; do
                ! grep -F '.vf-v6-shell-header' "$f"
                ! grep -F '.vf-v6-domain-nav' "$f"
                ! grep -F '.vf-theme-admin-header' "$f"
              done
              ;;
            M3U8)
              f="$SOURCE_DIR/src/admin/ui-v4/admin-s01-page-body-system-v1.css"
              ! grep -F '.vf-v6-shell-header' "$f"
              ! grep -F '.vf-v6-domain-nav' "$f"
              ! grep -F '.vf-m3u8-console-head' "$f"
              ! grep -F '.vf-m3u8-primary-nav' "$f"
              ;;
          esac
          echo "FROZEN_BOUNDARY=PASS"

      - name: Gate summary
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "OWNER_REAL_USE=FAIL_EVIDENCE_CONSUMED"
          echo "PHASE4_MACRO_FREEZE=BLOCKED_PENDING_NEW_PRODUCTION"
          echo "R2_CANDIDATE_GATE=PASS"
