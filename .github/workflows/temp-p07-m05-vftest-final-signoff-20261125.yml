name: TEMP P07-M05 Owner-approved VFTest final signoff
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temp-p07-m05-vftest-final-signoff-20261125.yml
permissions:
  contents: read
jobs:
  p07-m05-signoff:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.actor == 'llhzx2018' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'temp/p07-m05-vftest-final-signoff-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_SHA: '192113575a4548e1adc473895317df4b99ff6cc8'
      SOURCE_TREE: '84e12e0da19765028bc69f7d6c9df563026987f9'
      VERIFIED_RUNTIME_SHA: '425e894bdb484ba23cb70c777f78e83986201639'
      P07_PR_BASE: 'fd113376cf8e44c6a3bc00fbe47f34c2a354726a'
      EXPECTED_ZIP_SHA: '969e0a61177f0ef85b4b06524579c506f0506d545c9e2acfc6b272ab5522142d'
      PYTHONDONTWRITEBYTECODE: '1'
      NO_COLOR: '1'
    steps:
      - name: Checkout exact product source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-server-ops
          ref: '192113575a4548e1adc473895317df4b99ff6cc8'
          path: product
          fetch-depth: 0
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Verify unchanged runtime code and original release package bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd product
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          git cat-file -e "$VERIFIED_RUNTIME_SHA^{commit}"
          test "$(cat VERSION)" = '0.1.0'
          python3 -B - <<'PY'
          import subprocess
          paths=set(subprocess.check_output(['git','diff','--name-only','425e894bdb484ba23cb70c777f78e83986201639','HEAD'],text=True).splitlines())
          expected={'docs/authority/P07_M05_UX13_VFTEST_RELEASE_ADOPTION.md','tests/test_p07_m05_db_engine_boundary.py'}
          assert paths==expected, 'P07_M05_UNREVIEWED_RUNTIME_SOURCE_DIFF'
          print('P07_M05_RUNTIME_IDENTICAL_TO_VERIFIED_FULL_BOOTSTRAP=PASS')
          PY
          p="$RUNNER_TEMP/P07-M05-UX13-verify.zip"
          q="$RUNNER_TEMP/P07-M05-UX13-second.zip"
          python3 -B scripts/build_p07_m05_bundle.py --output "$p" >/dev/null
          python3 -B scripts/build_p07_m05_bundle.py --output "$q" >/dev/null
          cmp "$p" "$q"
          printf '%s  %s\n' "$EXPECTED_ZIP_SHA" "$p" | sha256sum -c - >/dev/null
          echo P07_M05_RELEASE_EXACT_PACKAGE_REPRODUCIBLE=PASS
      - name: Revalidate real PR scope and corrected M05 database tests
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd product
          scratch="$RUNNER_TEMP/p07-m05-final"
          mkdir -p "$scratch"
          if ! python3 -B scripts/check_p07_terminal_ux.py --base-ref "$P07_PR_BASE" >"$scratch/ux.log" 2>&1; then
            echo P07_M05_FINAL_UX_PR_SCOPE=FAIL
            exit 13
          fi
          if ! python3 -B scripts/check_p07_modules.py >"$scratch/modules.log" 2>&1; then
            echo P07_M05_FINAL_MODULE_SCOPE=FAIL
            exit 13
          fi
          if ! python3 -B -m unittest discover -s tests -p test_p07_m05_db_engine_boundary.py -q >"$scratch/db.log" 2>&1; then
            echo P07_M05_FINAL_DB_ENGINE_BOUNDARY=FAIL
            grep -E '^(FAIL|ERROR): test_[A-Za-z0-9_]+ ' "$scratch/db.log" | head -10 || true
            exit 13
          fi
          echo P07_M05_FINAL_UX_PR_SCOPE=PASS
          echo P07_M05_FINAL_MODULE_SCOPE=PASS
          grep -E '^Ran [0-9]+ tests?' "$scratch/db.log" || true
          echo P07_M05_FINAL_DB_ENGINE_BOUNDARY=PASS
      - name: Delete transient private source and candidate archives
        if: always()
        shell: bash
        run: |
          set +e
          set +x
          rm -rf -- "$GITHUB_WORKSPACE/product" "$RUNNER_TEMP/p07-m05-final"
          rm -f -- "$RUNNER_TEMP/P07-M05-UX13-verify.zip" "$RUNNER_TEMP/P07-M05-UX13-second.zip"
          test ! -e "$GITHUB_WORKSPACE/product"
          echo P07_M05_VFTEST_PRIVATE_CLEANUP=PASS
