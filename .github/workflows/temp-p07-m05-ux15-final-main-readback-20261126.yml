name: TEMP P07-M05 UX15 final anonymous main readback
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temp-p07-m05-ux15-final-main-readback-20261126.yml
permissions:
  contents: read
jobs:
  final-readback:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.actor == 'llhzx2018' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'temp/p07-m05-ux15-final-main-readback-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Anonymous exact main bytes and reviewed installed-build pin
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          unset GH_TOKEN GITHUB_TOKEN GH_ENTERPRISE_TOKEN
          root="$RUNNER_TEMP/m05-ux15-final-main"
          mkdir -m 700 "$root"
          curl -q --proto '=https' --tlsv1.2 -fsSL --connect-timeout 10 --max-time 60 'https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/p07-toolbox.sh' -o "$root/toolbox.sh"
          test "$(git hash-object "$root/toolbox.sh")" = 44e582d516b84bf81215c8416c58c7b8f75af720
          bash -n "$root/toolbox.sh"
          grep -Fqx 'M05_BUILD_EXPECTED="0.1.0-m05-ux15-rc4-runtime-compat"' "$root/toolbox.sh"
          grep -Fqx 'M05_PREVIOUS_OFFICIAL_BUILD="0.1.0-m05-ux14-verified-pycache"' "$root/toolbox.sh"
          grep -Fqx 'M05_BUNDLE_SHA256="fa67235dbc9fc7d132b057da7095d5064d1b72f7308a781aa7d616e942d27d99"' "$root/toolbox.sh"
          grep -Fqx 'M03_OWNER_TRIAL_BUILD="0.1.0-release147-rc4"' "$root/toolbox.sh"
          grep -Fqx 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release146"' "$root/toolbox.sh"
          echo P07_M05_FINAL_ANONYMOUS_MAIN_EXACT_TESTED_BYTES=PASS
      - name: Clean readback bytes
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/m05-ux15-final-main"
          test ! -e "$RUNNER_TEMP/m05-ux15-final-main"
          echo P07_M05_FINAL_READBACK_CLEAN=PASS
