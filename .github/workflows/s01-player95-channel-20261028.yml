name: S01 player 95 distribution contract
on:
  push:
    branches: [task/s01-player95-20261028]
    paths: ['.github/workflows/s01-player95-channel-20261028.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-m3u8
  TARGET_VERSION: 1.25.95
  TARGET_SHA: a63479b5fb519ff8bf661c4ca94a338089a6e4f1
  TARGET_TREE: 85c487262037857115369f279b7fb261adb58a85
  UPDATE_SHA: 03c04dee8de6913675c7ae1aa54bedb95652031a
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: 03c04dee8de6913675c7ae1aa54bedb95652031a
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: source
      - name: Identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-player95-20261028/spec.json --input control/.github/workflows/s01-player95-channel-20261028.yml
      - name: Exact manifest and native update protocol
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          test "$(git -C source diff --name-only dbb76739a4dbe0e806fe443253166c7ad0e20e57 "$UPDATE_SHA")" = projects/S01-C03.json
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PY'
          import json,subprocess,pathlib
          m=json.load(open('projects/S01-C03.json'))
          b=json.loads(subprocess.check_output(['git','show','dbb76739a4dbe0e806fe443253166c7ad0e20e57:projects/S01-C03.json']))
          assert m['target_version']=='1.25.95' and m['release_tag']=='v1.25.95'
          assert m['asset_name']=='vf-tools-m3u8_V1.25.95.zip' and m['asset_bytes']==3794844
          assert m['asset_sha256']=='030f28066417802dc973cb17be05bd33d182da282dc459f98e096043ddd4fd92'
          assert m['runtime_files']==m['runtime_file_count']==569
          assert m['runtime_fingerprint']==m['runtime_fingerprint_sha256']=='59e08e1b0cfa0f8b0edf2e0d50709f029ff782e06f53ae76ea19eb86d5f94194'
          assert m['from_versions']==b['from_versions']+['1.25.94']
          assert m['plugin_file']=='vf-tool-m3u8/vf-tool-m3u8.php' and m['physical_locator']==b['physical_locator']
          changed={k for k in set(b)|set(m) if b.get(k)!=m.get(k)}
          assert changed=={'target_version','from_versions','release_tag','asset_name','asset_bytes','asset_sha256','runtime_files','runtime_file_count','runtime_fingerprint','runtime_fingerprint_sha256','released_at','notes'},changed
          pathlib.Path('../proof').mkdir(exist_ok=True);pathlib.Path('../proof/channel.json').write_text(json.dumps({'status':'PASS','source':'03c04dee8de6913675c7ae1aa54bedb95652031a','version':'1.25.95','protocol':'PASS','production':'UNTOUCHED'}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-player95-channel-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup
        if: always()
        run: rm -rf source
