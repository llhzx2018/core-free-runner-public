name: TEMP P07 PR200 base-versus-candidate private diagnostic
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-pr200-private-sanitized-diagnostic.yml'

permissions:
  contents: read

jobs:
  compare:
    if: github.repository == 'llhzx2018/core-free-runner-public'
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: BASE
            source_sha: a274d22259d7e88e24f7c360869fdffae16375fb
          - lane: FIX
            source_sha: 7fa7a76c3afc0227345f7c44f8e74e16b413c1af
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Validate private read capability
        shell: bash
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          test -n "$PRIVATE_READ_TOKEN" || exit 78
      - name: Checkout immutable private source into temporary workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: ${{ matrix.source_sha }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: p07-private
      - name: Compare failing module cases with public-safe metadata only
        shell: bash
        env:
          LANE: ${{ matrix.lane }}
          SOURCE_SHA: ${{ matrix.source_sha }}
        run: |
          set -Eeuo pipefail
          test "$(git -C p07-private rev-parse HEAD)" = "$SOURCE_SHA"
          cd p07-private
          export PYTHONPATH="$PWD/lib"
          log="$RUNNER_TEMP/p07-private-compare.log"
          if timeout --signal=TERM --kill-after=5s 570 python3 - "$LANE" >"$log" 2>&1 <<'PY'
          import contextlib, io, re, sys, unittest
          lane=sys.argv[1]
          modules=(
              "test_backup_frontend",
              "test_release15_sqlite_wal",
              "test_user_entry",
              "test_user_remote_backup",
          )
          def flatten(suite):
              for item in suite:
                  if isinstance(item, unittest.TestSuite):
                      yield from flatten(item)
                  else: yield item
          failed=0
          for slot, module in enumerate(modules):
              suite=unittest.defaultTestLoader.loadTestsFromName("tests."+module)
              cases=[t.id() for t in flatten(suite)]
              sink=io.StringIO()
              with contextlib.redirect_stdout(sink), contextlib.redirect_stderr(sink):
                  result=unittest.TextTestRunner(stream=sink,verbosity=0).run(suite)
              status="PASS" if result.wasSuccessful() else "FAIL"
              failed+=not result.wasSuccessful()
              print(f"P07_COMPARE_LANE={lane} MODULE_SLOT={slot} TESTS={result.testsRun} STATUS={status}",flush=True)
              for typ,group in (("FAILURE",result.failures),("ERROR",result.errors)):
                  for testcase,trace in group:
                      key=testcase.id()
                      case_slot=cases.index(key) if key in cases else -1
                      tail=next((line for line in reversed(trace.splitlines()) if line.strip()),"")
                      match=re.search(r"([A-Za-z_][A-Za-z0-9_]*(?:Error|Exception))(?=[: ]|$)",tail)
                      category=match.group(1) if match else "ASSERTION_OR_UNKNOWN"
                      print(f"P07_COMPARE_LANE={lane} MODULE_SLOT={slot} CASE_SLOT={case_slot} ISSUE={typ} CLASS={category}",flush=True)
          print(f"P07_COMPARE_LANE={lane} FAILING_MODULES={failed}",flush=True)
          PY
          then
            grep '^P07_COMPARE_' "$log" || true
          else
            rc=$?
            grep '^P07_COMPARE_' "$log" || true
            echo "P07_COMPARE_PROCESS_EXIT=$rc"
            exit "$rc"
          fi
      - name: Cleanup private workspace and diagnostic output
        if: always()
        shell: bash
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/p07-private"
          rm -f -- "$RUNNER_TEMP/p07-private-compare.log"
          echo 'P07_PRIVATE_SOURCE_PERSISTED=NO'
          echo 'P07_PRIVATE_TRACE_PERSISTED=NO'
