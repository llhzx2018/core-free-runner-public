name: P01 one-off public-safe artifact transfer capability
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  artifact-bridge:
    if: github.head_ref == 'probe/p01-local-artifact-bridge-20261120' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Generate harmless known bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-artifact-probe
          printf 'P01_ARTIFACT_BRIDGE_PUBLIC_SAFE_20261120\n' > /tmp/p01-artifact-probe/marker.txt
          sha256sum /tmp/p01-artifact-probe/marker.txt
      - name: Upload harmless artifact
        uses: actions/upload-artifact@v4
        with:
          name: p01-public-safe-bridge-probe
          path: /tmp/p01-artifact-probe/marker.txt
          retention-days: 1
