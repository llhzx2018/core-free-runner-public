name: S01 converter current WordPress browser proof
on:
  push:
    branches: [task/s01-converter-i18n-proof-20261030]
    paths: ['.github/workflows/s01-converter-i18n-20261030.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 02d4591eed025a3d3a67bc0a150b3ddc448c2ab8
          persist-credentials: false
          path: established
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 0bf518b3a456cd2d5a31e42d6efb144889a8c570
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: 95bbc06e776c067d2d86ee1970b6cb7f981e1a93
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: candidate_plugin
      - name: Verify exact source and setup
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider
          test "$(git -C target rev-parse HEAD)" = 0bf518b3a456cd2d5a31e42d6efb144889a8c570
          test "$(git -C target rev-parse 'HEAD^{tree}')" = 1a5ae780690820d22846d65885a33cbfec16a757
          git -C target diff --name-only 391b891045885fb192cabd344c5e85872abb765a HEAD | sort > /tmp/changed
          printf '%s\n' src/assets/css/public/pages/families/public-family-02-tool-directory-detail-operations-closure.css src/assets/css/public/vf-theme-public-runtime.css src/inc/bootstrap/public-runtime.php src/inc/frontend-seo-context.php src/inc/modules/module-faq.php src/inc/public-css-owner-registry.php | sort > /tmp/expected
          diff -u /tmp/expected /tmp/changed
          php -l target/src/inc/modules/module-faq.php
          node --check control/lanes/s01-converter-i18n-proof/check.cjs
          test "$(git -C candidate_plugin rev-parse HEAD)" = 95bbc06e776c067d2d86ee1970b6cb7f981e1a93
          test "$(git -C candidate_plugin rev-parse 'HEAD^{tree}')" = 6f1a26f2ced92ac553416bc3f6175fa9280093cd
          php -l candidate_plugin/src/includes/i18n.php
          php candidate_plugin/tests/converter-i18n-markup-contract.php
          php candidate_plugin/tests/browser-stream-i18n-markup-contract.php
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -fsSL https://github.com/googlefonts/noto-cjk/raw/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf -o "$HOME/.local/share/fonts/NotoSansCJKsc-Regular.otf"
          fc-cache -f
          cp -a established/lanes/s01-frontend-design-20261017 lane
      - name: Bilingual WordPress workflow
        run: bash control/lanes/s01-converter-i18n-proof/native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-iptv-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Remove private sources
        if: always()
        run: rm -rf target candidate_plugin provider lane

