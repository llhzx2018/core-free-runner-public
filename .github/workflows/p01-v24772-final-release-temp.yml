name: p01-v24772-final-release-temp

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v24772-final-release-temp.yml'
      - 'scripts/p01_build_v24772_final.py'
      - 'scripts/p01_v24772_final_gate.sh'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      UPDATES_REPO: llhzx2018/core-updates
      TARGET_SHA: cd176611a24be2dd90155ce84b6b89fab2915150
      TARGET_TREE: 755ec90d9af490b5cd177aaf17d55e217fe49d33
      GOV_SHA: f83697fa3cf648ababfd279996a37bcb5b40eede
      VERSION: 2.47.72
      SOURCE_VERSION: 2.47.71
      SCHEMA: '2026090401'
      TAG: v2.47.72
    steps:
      - name: Checkout runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Exact source and Current Authority readback
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          remote_main="$(git ls-remote "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" refs/heads/main | awk '{print $1}')"
          remote_gov="$(git ls-remote "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/gov-doc.git" refs/heads/main | awk '{print $1}')"
          test "$remote_main" = "$TARGET_SHA"
          test "$remote_gov" = "$GOV_SHA"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" candidate
          git -C candidate fetch -q --depth 1 origin "$TARGET_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "$VERSION"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "$VERSION"
          git clone -q --depth 1 --branch main "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/gov-doc.git" gov
          test "$(git -C gov rev-parse HEAD)" = "$GOV_SHA"
          grep -Fq '| skill-release | V2.9 |' gov/CURRENT.md
          grep -Fq 'Mode C · OWNER_DIRECT_DIAGNOSTIC_RELEASE' gov/skills/skill-release/V2.9/SKILL.md
          grep -Fq 'OWNER_DIRECT_DIAGNOSTIC_RELEASE_AUTHORIZATION = PASS' candidate/docs/authority/ACCEPTANCE_MATRIX.md
          echo P01_V24772_RELEASE_AUTHORITY=PASS
          echo P01_V24772_FINAL_EXACT_SOURCE=PASS

      - name: Download exact V2.47.71 formal baseline
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-rel71/full /tmp/p01-rel71/update
          gh release download v2.47.71 -R "$PRODUCT_REPO" -D /tmp/p01-rel71             -p 'VF-Start-V2.47.71-FULL.zip'             -p 'VF_Start_V2.47.71_UPDATE.zip'
          unzip -q /tmp/p01-rel71/VF-Start-V2.47.71-FULL.zip -d /tmp/p01-rel71/full
          unzip -q /tmp/p01-rel71/VF_Start_V2.47.71_UPDATE.zip -d /tmp/p01-rel71/update
          test "$(tr -d '\r\n ' </tmp/p01-rel71/full/VERSION.txt)" = "$SOURCE_VERSION"
          test -f /tmp/p01-rel71/update/repair-v2.47.71.php
          echo P01_V24772_FORMAL_BASELINE=PASS

      - name: Prepare runtime dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd unzip jq >/dev/null
          php -m | grep -Fx pdo_sqlite
          php -m | grep -Fx sqlite3
          php -m | grep -Fx curl
          php -m | grep -Fx gd

      - name: Build and verify final FULL + Atomic UPDATE
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/p01_v24772_final_gate.sh
          RECEIPT=/tmp/p01-v24772-artifacts/P01_V24772_ARTIFACT_RECEIPT.json
          jq -e --arg s "$TARGET_SHA" --arg t "$TARGET_TREE" '.version=="2.47.72" and .source_version=="2.47.71" and .source_sha==$s and .source_tree==$t and .schema=="2026090401"' "$RECEIPT" >/dev/null
          echo "FULL_SHA=$(jq -r '.full_sha256' "$RECEIPT")" >> "$GITHUB_ENV"
          echo "FULL_BYTES=$(jq -r '.full_bytes' "$RECEIPT")" >> "$GITHUB_ENV"
          echo "UPDATE_SHA=$(jq -r '.update_sha256' "$RECEIPT")" >> "$GITHUB_ENV"
          echo "UPDATE_BYTES=$(jq -r '.update_bytes' "$RECEIPT")" >> "$GITHUB_ENV"
          echo P01_V24772_FINAL_ARTIFACT_GATE=PASS

      - name: Checkout V2.47.71 stable source
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone -q --depth 1 --branch v2.47.71 "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" stable
          test "$(git -C stable rev-parse HEAD)" = "2562291f03177d6970fedc337c728fde10168bdc"

      - name: Canonical zero-debt regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate stable --require-zero-debt | tee /tmp/p01-v24772-canonical.txt
          grep -Fx 'P01_CANONICAL_CURRENT_FAILURE_COUNT=0' /tmp/p01-v24772-canonical.txt
          grep -Fx 'P01_CANONICAL_NEW_REGRESSION_COUNT=0' /tmp/p01-v24772-canonical.txt
          grep -Fx 'P01_CANONICAL_LEGACY_TEST_DEBT_COUNT=0' /tmp/p01-v24772-canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/p01-v24772-canonical.txt
          echo P01_V24772_FINAL_CANONICAL=PASS

      - name: Focused UI security and data contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-v24772-focused-source
          cp -a candidate /tmp/p01-v24772-focused-source
          focused=/tmp/p01-v24772-focused-source
          tests=(
            tests/unit/navigation_category_workspace_tabs_contract.php
            tests/unit/navigation_header_spacing_r1_contract.php
            tests/unit/admin_url_health_page5_polish_contract.php
            tests/unit/admin_duplicates_r21_contract.php
            tests/unit/health_desktop_action_hierarchy_contract.php
            tests/unit/health_row_action_hierarchy_contract.php
            tests/unit/admin_overview_page1_polish_contract.php
            tests/unit/admin_overview_ia_contract.php
            tests/unit/pending_inbox_presentation_contract.php
            tests/unit/pending_desktop_workspace_hierarchy_contract.php
            tests/unit/pending_page_visual_closure_contract.php
            tests/unit/shared_dialog_foundation_r1_contract.php
            tests/unit/links_dialog_cancel_save_guard_contract.php
            tests/unit/navigation_url_table_production_r1_contract.php
            tests/unit/navigation_page_visual_closure_contract.php
            tests/unit/navigation_row_action_hierarchy_contract.php
            tests/unit/links_admin_visible_selection_contract.php
            tests/unit/admin_all_resources_final_polish_r7_contract.php
            tests/unit/admin_all_resources_readability_r6_contract.php
            tests/unit/admin_all_resources_scanability_r5_contract.php
            tests/unit/admin_all_resources_column_lock_r4_contract.php
            tests/unit/admin_all_resources_visual_alignment_r3_contract.php
            tests/unit/admin_all_resources_alignment_r2_contract.php
            tests/unit/admin_all_resources_page3_polish_contract.php
            tests/unit/admin_resource_browse_edit_r5_contract.php
            tests/unit/resource_manager_pagination_context_contract.php
            tests/unit/backup_policy_desktop_disclosure_contract.php
            tests/unit/admin_data_safety_page8_polish_contract.php
            tests/unit/admin_data_safety_r13_contract.php
            tests/unit/admin_recycle_bin_page6_polish_contract.php
            tests/unit/admin_recycle_bin_r11_contract.php
            tests/unit/admin_recycle_bin_r12_pagination_contract.php
            tests/unit/recycle_bin_admin_return_contract.php
            tests/unit/recycle_bin_direct_open_contract.php
            tests/unit/recycle_mobile_card_labels_contract.php
            tests/unit/engineering_consistency_r80_contract.php
            tests/unit/admin_typography_readability_contract.php
            tests/unit/admin_backend_coverage_r60_contract.php
            tests/unit/admin_system_health_page9_polish_contract.php
            tests/unit/admin_system_health_r18_contract.php
            tests/unit/system_health_runtime_r7_contract.php
            tests/unit/system_health_cron_diagnostic_contract.php
            tests/unit/system_health_cron_runtime_proof.php
          tests/unit/admin_data_safety_r14_runtime_retention_contract.php
          tests/unit/operation_history_reachability_contract.php
            tests/unit/session_csrf_contract.php
            tests/unit/update_csrf_recovery_contract.php
            tests/unit/navigation_owner_behavior_privacy_contract.php
            tests/unit/privacy_cache_performance_r2_contract.php
          )
          for t in "${tests[@]}"; do php "$focused/$t"; done
          php "$focused/tests/integration/resource_asset_disaster_recovery_contract.php"
          test "$(git -C candidate status --porcelain)" = ""
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          php "$focused/tests/unit/system_health_cron_runtime_proof.php" | tee /tmp/p01-v24772-cron-runtime.txt
          grep -Fx 'P01_SYSTEM_HEALTH_CRON_RUNTIME_PROOF=PASS' /tmp/p01-v24772-cron-runtime.txt
          echo P01_V24772_DIAGNOSTIC_CORRECTION=PASS
          echo P01_V24772_TRUE_POSITIVE_WARNING_PRESERVED=PASS
          echo P01_V24772_FINAL_FOCUSED=PASS
          echo P01_V24772_CANDIDATE_UNCHANGED=PASS
          echo PUBLIC_AUTHORITY_RELEASE_COVERAGE=PASS
          echo NO_REQUIRED_GATE_MISSING=YES
          echo NO_UNKNOWN_APPLICABILITY=YES

      - name: Record OWNER Diagnostic Direct Release input
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C candidate fetch -q --depth 1 origin 2562291f03177d6970fedc337c728fde10168bdc
          git -C candidate diff --name-only 2562291f03177d6970fedc337c728fde10168bdc "$TARGET_SHA" | sort >/tmp/p01-v24772-release-diff.txt
          cat >/tmp/p01-v24772-release-allowed.txt <<'EOF'
          VERSION
          src/VERSION.txt
          src/app/SystemHealth.php
          src/app/bootstrap.php
          src/assets/admin-consolidation.css
          src/assets/system.js
          src/system-health.php
          tests/unit/engineering_consistency_r80_contract.php
          tests/unit/system_health_cron_diagnostic_contract.php
          tests/unit/system_health_cron_runtime_proof.php
          EOF
          sort -o /tmp/p01-v24772-release-allowed.txt /tmp/p01-v24772-release-allowed.txt
          diff -u /tmp/p01-v24772-release-allowed.txt /tmp/p01-v24772-release-diff.txt
          ! git -C candidate diff 2562291f03177d6970fedc337c728fde10168bdc "$TARGET_SHA" -- src/api.php src/app/Auth.php src/app/Repository.php src/app/Seo.php src/app/DataSafety.php src/app/Database.php src/app/JobManager.php src/cli/worker.php src/migrations | grep -q .
          cat >/tmp/P01_V24772_OWNER_DIRECT_DIAGNOSTIC_RELEASE.txt <<'EOF'
          OWNER_PREVIEW_RUNTIME_APPLICABILITY=REQUIRED
          OWNER_RELEASE_INPUT_MODE=OWNER_DIRECT_DIAGNOSTIC_RELEASE
          OWNER_DIRECT_DIAGNOSTIC_RELEASE_AUTHORIZATION=PASS
          OWNER_PREVIEW_RUNTIME=POST_RELEASE_REQUIRED
          OWNER_REAL_USE=POST_PRODUCTION_REQUIRED
          FORMAL_RELEASE_INPUT=PASS
          scope=bounded low-risk diagnostic correction for Cron worker health state precision and actionable guidance
          owner_authorization=owner explicitly authorized VERSION change and V2.47.72 publication after delegating continuous fix-and-release
          diagnostic_observability_only=YES
          stable_public_invariant=enabled schedules or running jobs define whether Cron heartbeat is expected
          true_positive_fail_closed_proof=REQUIRED; runtime proof preserves never/stale warnings and removes only inactive false warnings
          diagnostic_security_boundary_change=NO
          material_product_shape_or_ia=NO
          schema_or_migration=NO
          data_model_or_canonical_data_semantic_change=NO
          auth_access_enforcement_change=NO
          installer_updater_mechanism_change=NO
          provider_server_write=NO
          destructive_or_irreversible_action=NO
          production_included=NO
          product_acceptance=NOT_CLAIMED
          post_production_owner_real_use=REQUIRED
          EOF
          cat /tmp/P01_V24772_OWNER_DIRECT_DIAGNOSTIC_RELEASE.txt
          echo P01_V24772_OWNER_DIRECT_DIAGNOSTIC_RELEASE=PASS

      - name: Publish tag and GitHub Formal Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          remote_tag="$(git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${PRODUCT_REPO}.git" "refs/tags/${TAG}" | awk '{print $1}')"
          if [ -z "$remote_tag" ]; then
            git -C candidate config user.name VictorForge
            git -C candidate config user.email llhzx2018@gmail.com
            git -C candidate tag "$TAG" "$TARGET_SHA"
            git -C candidate push "https://x-access-token:${GH_TOKEN}@github.com/${PRODUCT_REPO}.git" "refs/tags/${TAG}"
          else
            test "$remote_tag" = "$TARGET_SHA"
          fi
          cat >/tmp/p01-v24772-notes.md <<EOF
          # VF Start V2.47.72

          P01 · VF Start V2.47.72 Cron 运行健康诊断收口。

          - Exact Source: $TARGET_SHA
          - Exact Tree: $TARGET_TREE
          - Source Version: V2.47.71
          - Target Version: V2.47.72
          - Schema: $SCHEMA（不变）
          - 区分 Cron 从未运行、心跳中断、健康、无启用计划四种状态
          - 有启用计划或运行任务但无/旧心跳时仍保持真实提醒；无启用计划时不制造假告警
          - 不改变任务调度器、Worker 执行、备份、Auth、Schema、Updater 或 Production 语义
          - 新增 exact-source runtime proof 同时证明 never/stale 真提醒保留、healthy/inactive 不误报
          - VERSION 2.47.72；Schema / Data Model / Auth / Installer / Updater mechanism 均不改变
          - Exact-source diagnostic diff / Focused Security / Canonical zero-debt / Clean FULL / Atomic / Idempotency / Rollback / Data Sentinel: PASS
          - Release Input: OWNER_DIRECT_DIAGNOSTIC_RELEASE（skill-release V2.9）；False-positive correction + preserved true-positive fail-closed proof=PASS；Preview=POST_RELEASE_REQUIRED，Real Use=POST_PRODUCTION_REQUIRED，均未伪装为 PASS
          - Production upgrade: NOT INCLUDED；仍由 OWNER 在 P01 后台手动执行
          EOF
          FULL=/tmp/p01-v24772-artifacts/VF-Start-V2.47.72-FULL.zip
          UPDATE=/tmp/p01-v24772-artifacts/VF_Start_V2.47.72_UPDATE.zip
          if gh release view "$TAG" --repo "$PRODUCT_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FULL" "$UPDATE" --repo "$PRODUCT_REPO" --clobber
          else
            gh release create "$TAG" "$FULL" "$UPDATE" --repo "$PRODUCT_REPO" --title 'VF Start V2.47.72' --notes-file /tmp/p01-v24772-notes.md --verify-tag
          fi
          gh api "repos/${PRODUCT_REPO}/releases/tags/${TAG}" >/tmp/p01-v24772-release.json
          RELEASE_ID="$(jq -r '.id' /tmp/p01-v24772-release.json)"
          RELEASED_AT="$(jq -r '.published_at' /tmp/p01-v24772-release.json)"
          test -n "$RELEASE_ID" && test "$RELEASE_ID" != null
          test "$(jq -r '.assets[]|select(.name=="VF-Start-V2.47.72-FULL.zip")|.size' /tmp/p01-v24772-release.json)" = "$FULL_BYTES"
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.47.72_UPDATE.zip")|.size' /tmp/p01-v24772-release.json)" = "$UPDATE_BYTES"
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"
          echo "RELEASED_AT=$RELEASED_AT" >> "$GITHUB_ENV"
          echo P01_V24772_FORMAL_RELEASE=PASS

      - name: Remote Tag and Asset readback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          remote_tag="$(git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${PRODUCT_REPO}.git" "refs/tags/${TAG}" | awk '{print $1}')"
          test "$remote_tag" = "$TARGET_SHA"
          for i in 1 2 3; do
            rm -rf /tmp/p01-v24772-remote && mkdir -p /tmp/p01-v24772-remote
            if gh release download "$TAG" --repo "$PRODUCT_REPO" --dir /tmp/p01-v24772-remote               --pattern 'VF-Start-V2.47.72-FULL.zip'               --pattern 'VF_Start_V2.47.72_UPDATE.zip'; then
              break
            fi
            test "$i" -lt 3
            sleep 2
          done
          test "$(sha256sum /tmp/p01-v24772-remote/VF-Start-V2.47.72-FULL.zip | awk '{print $1}')" = "$FULL_SHA"
          test "$(sha256sum /tmp/p01-v24772-remote/VF_Start_V2.47.72_UPDATE.zip | awk '{print $1}')" = "$UPDATE_SHA"
          echo P01_V24772_REMOTE_RELEASE_READBACK=PASS

      - name: Publish Stable core-updates P01
        shell: bash
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone -q --depth 1 --branch main "https://x-access-token:${WRITE_TOKEN}@github.com/${UPDATES_REPO}.git" updates
          python3 - <<'PY'
          from pathlib import Path
          import json, os
          p=Path('updates/projects/P01.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          if str(d.get('target_version','')) != '2.47.71':
              raise SystemExit('unexpected P01 stable target: '+str(d.get('target_version')))
          d.update({
            'current_version':'2.47.71',
            'target_version':'2.47.72',
            'update_type':'ATOMIC',
            'from_versions':['2.47.71'],
            'schema_from':'2026090401',
            'schema_to':'2026090401',
            'repository':'llhzx2018/vf-start',
            'release_tag':'v2.47.72',
            'release_id':int(os.environ['RELEASE_ID']),
            'product_identity':os.environ['TARGET_SHA'],
            'asset_name':'VF_Start_V2.47.72_UPDATE.zip',
            'asset_bytes':int(os.environ['UPDATE_BYTES']),
            'asset_sha256':os.environ['UPDATE_SHA'],
            'backup_required':True,
            'rollback_supported':True,
            'released_at':os.environ['RELEASED_AT'],
            'minimum_php':'8.0.0',
            'notes':'P01 · VF Start V2.47.72 Cron 运行健康诊断收口。Exact Source '+os.environ['TARGET_SHA']+'；Schema 2026090401 不变；never/stale/healthy/inactive 四态运行证明 PASS；有计划但无/旧心跳仍提醒，无启用计划不误报；Canonical/Focused/Clean FULL/Atomic/Idempotency/Rollback/Data Sentinel 均 PASS；没有改变任务调度器、Worker 执行、备份、Schema、数据、Auth、Updater 或 Production 语义。Release Input=OWNER_DIRECT_DIAGNOSTIC_RELEASE（skill-release V2.9）；Production 仍由 OWNER 手动升级并做真实使用验收。'
          })
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git -C updates config user.name VictorForge
          git -C updates config user.email llhzx2018@gmail.com
          git -C updates add projects/P01.json
          if ! git -C updates diff --cached --quiet; then
            git -C updates commit -m 'release(P01): publish VF Start V2.47.72 stable update'
          fi
          for i in 1 2 3; do
            if git -C updates push origin main; then break; fi
            git -C updates pull --rebase origin main
            test "$i" -lt 3
          done
          echo P01_V24772_CORE_UPDATES_PUBLISHED=PASS

      - name: Stable channel remote readback
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/core-updates-readback
          git clone -q --depth 1 --branch main "https://x-access-token:${READ_TOKEN}@github.com/${UPDATES_REPO}.git" /tmp/core-updates-readback
          jq -e             --arg sha "$UPDATE_SHA"             --arg product "$TARGET_SHA"             --argjson rid "$RELEASE_ID"             --argjson bytes "$UPDATE_BYTES"             '.current_version=="2.47.71" and .target_version=="2.47.72" and .from_versions==["2.47.71"] and .release_tag=="v2.47.72" and .release_id==$rid and .product_identity==$product and .asset_name=="VF_Start_V2.47.72_UPDATE.zip" and .asset_bytes==$bytes and .asset_sha256==$sha'             /tmp/core-updates-readback/projects/P01.json >/dev/null
          cat /tmp/core-updates-readback/projects/P01.json
          echo P01_V24772_STABLE_CHANNEL_READBACK=PASS
          echo P01_V24772_FORMAL_RELEASE_DISTRIBUTION=PASS
          echo P01_V24772_PRODUCTION_CHANGED=NO

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p01-v24772-final-release
          path: |
            /tmp/p01-v24772-artifacts/P01_V24772_ARTIFACT_RECEIPT.json
            /tmp/p01-v24772-release.json
            /tmp/P01_V24772_OWNER_DIRECT_DIAGNOSTIC_RELEASE.txt
            /tmp/p01-v24772-canonical.txt
          if-no-files-found: warn
          retention-days: 14
