name: p01-ia6-legacy-gui-candidate

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p01-ia6-legacy-gui-candidate.yml

permissions:
  contents: read

jobs:
  source-parity:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'test(P01):')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_SHA: 8b32dc255c8c28f64381b7f2875a8ccf2960d713
    steps:
      - name: Prepare PHP and Node
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd >/dev/null
          php -m | grep -Fxi pdo_sqlite >/dev/null
          node --version >/dev/null
          echo P01_LEGACY_TEST_RUNTIME=PASS

      - name: Transient exact-source private checkout
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" candidate
          git -C candidate fetch -q --depth 1 origin "$TARGET_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.492"
          echo P01_LEGACY_CANDIDATE_EXACT_SHA=PASS

      - name: Focused native/legacy parity unit tests
        if: false # Canonical diagnostic run: enumerate remaining retired-HTML assertions in one pass
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          for src in src/browser-helper.php src/gov-topic-manager.php src/gov-book-manager.php src/music.php src/music-import.php src/system-baseline.php src/full-governance.php src/jobs.php src/system-health.php; do
            php -l "$src" >/dev/null
          done
          for testfile in \
            tests/unit/admin_backend_closure_contract.php \
            tests/unit/backend_ia_round6_special_settings_v247274_contract.php \
            tests/unit/gov_book_backend_shell_contract.php \
            tests/unit/p01_ia_v2_r6_gov_source_ownership_contract.php \
            tests/unit/p01_ia_v3_r4_frontstage_source_boundary_contract.php \
            tests/unit/music_import_private_route_contract.php \
            tests/unit/music_security_contract.php \
            tests/unit/p01_ia_v2_r5_music_frontstage_contract.php \
            tests/unit/admin_system_baseline_r25_contract.php \
            tests/unit/system_baseline_human_ui_contract.php \
            tests/unit/full_governance_r10_ux_contract.php \
            tests/unit/pending_governance_context_contract.php \
            tests/unit/pending_ai_governance_entry_contract.php \
            tests/unit/full_surface_governance_contract.php \
            tests/unit/full_governance_complete_review_gate_contract.php \
            tests/unit/full_governance_invalid_overflow_clarity_contract.php; do
            php -l "$testfile" >/dev/null
            php "$testfile"
          done
          node tests/unit/p01_ia6_legacy_route_retirement_inventory.cjs | tail -n 2
          node tests/unit/p01_ia6_source_review_legacy_detail_parity_contract.cjs
          node tests/unit/p01_ia6_browser_helper_stale_and_secret_contract.cjs
          node tests/unit/p01_ia6_sources_governance_native_closure_contract.cjs
          node tests/unit/p01_ia6_legacy_bookmark_native_contract.cjs
          node tests/unit/p01_ia6_music_import_candidate_json_parity.cjs
          node tests/unit/p01_ia6_music_native_r15_contract.cjs
          node tests/unit/p01_music_advanced_native_contract.cjs
          node tests/unit/p01_ia6_system_baseline_diagnostic_detail_parity_contract.cjs
          node tests/unit/p01_ia6_system_baseline_r5_contract.cjs
          node tests/unit/p01_ia6_legacy_bookmark_native_contract.cjs
          node --check src/assets/frontstage-system-operations.js
          for testfile in \
            tests/unit/admin_plain_language_17_tasks_v247287_contract.php \
            tests/unit/admin_scheduled_tasks_center_contract.php \
            tests/unit/admin_system_group_polish_r69_contract.php \
            tests/unit/application_self_drive_scheduler_v247278_contract.php \
            tests/unit/backend_ia_round5_system_v247273_contract.php \
            tests/unit/job_schedule_execution_truth_native.php \
            tests/unit/p01_ia_v2_r10_admin_closure_contract.php \
            tests/unit/system_health_cron_diagnostic_contract.php; do
            php -l "$testfile" >/dev/null
            php "$testfile"
          done
          node --check src/assets/frontstage-system-operations.js
          for testfile in \
            tests/unit/admin_system_health_r18_contract.php \
            tests/unit/admin_system_health_page9_polish_contract.php \
            tests/unit/system_health_manual_refresh_v247282_contract.php \
            tests/unit/system_health_maintenance_flat_v247283_contract.php \
            tests/unit/admin_system_capabilities_r62_contract.php \
            tests/unit/admin_group_single_authority_r39_contract.php \
            tests/unit/p01_ia_v2_r10_admin_closure_contract.php; do
            php -l "$testfile" >/dev/null
            php "$testfile"
          done
          node tests/unit/p01_ia6_system_jobs_r1_contract.cjs
          node tests/unit/p01_ia6_worker_history_operation_parity.cjs
          node tests/unit/p01_ia6_worker_manual_step_native_contract.cjs
          echo P01_LEGACY_GUI_FOCUSED_EXACT_SOURCE=PASS

      - name: Canonical full-unit baseline comparison
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --depth 1 --branch v2.47.492 "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" stable
          test "$(tr -d '\r\n ' < stable/VERSION)" = "2.47.492"
          (cd candidate && bash tests/canonical_release_regression.sh . "$GITHUB_WORKSPACE/stable" --require-zero-debt) | tee /tmp/p01-ia6-canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/p01-ia6-canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/p01-ia6-canonical.txt
          echo P01_LEGACY_GUI_CANONICAL_FULL_UNIT=PASS

      - name: Disposable Music legacy Owner Guest HTTP gate
        if: false # Canonical diagnostic run: enumerate remaining retired-HTML assertions in one pass
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$(mktemp -d)"
          port=18617
          cookie="$work/session.txt"
          trap 'test -z "${server_pid:-}" || kill "$server_pid" >/dev/null 2>&1 || true; rm -rf "$work"' EXIT
          cp -a candidate/src/. "$work/"
          (
            cd "$work"
            php -S 127.0.0.1:"$port" -t . >/dev/null 2>&1 &
            echo $! >"$work/pid"
          )
          server_pid="$(cat "$work/pid")"
          origin="http://127.0.0.1:$port"
          for n in $(seq 1 30); do
            if curl -fsS -c "$cookie" -b "$cookie" "$origin/setup.php" -o "$work/setup.html"; then break; fi
            sleep 1
          done
          csrf="$(python3 - "$work/setup.html" <<'PY'
          import re,sys
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',open(sys.argv[1]).read())
          if not m: raise SystemExit('missing setup token')
          print(m.group(1))
          PY
          )"
          pass='SandboxMusic-2026!Safe'
          curl -fsS -c "$cookie" -b "$cookie" -X POST "$origin/setup.php" \
            --data-urlencode "setup_csrf=$csrf" \
            --data-urlencode 'site_title=VF Music Ephemeral' \
            --data-urlencode "admin_password=$pass" \
            --data-urlencode "admin_password_confirm=$pass" -o /dev/null
          (cd "$work" && php cli/verify.php) | grep -Fx VERIFY_PASS=YES
          login="$(php -r 'echo json_encode(["password"=>$argv[1]]);' "$pass")"
          curl -fsS -c "$cookie" -b "$cookie" -H 'Content-Type: application/json' \
            -d "$login" "$origin/api.php?action=login" -o "$work/login.json"
          python3 - "$work/login.json" <<'PY'
          import json,sys
          assert json.load(open(sys.argv[1]))['ok'] is True
          PY
          # GET old GUI is only a safe, exact native Owner deep link.
          for pair in "music.php|music-shell.php?view=home&vf_manage=1&vf_tab=music" \
              "music-import.php|music-shell.php?view=home&vf_manage=1&vf_tab=music&vf_task=music-advanced"; do
            route="${pair%%|*}"; target="${pair#*|}"
            curl -sS -D "$work/headers" -c "$cookie" -b "$cookie" \
              "$origin/$route" -o /dev/null
            grep -Eq '^HTTP/1.1 302' "$work/headers"
            grep -Fq "Location: $target" "$work/headers"
          done
          echo P01_MUSIC_OWNER_OLD_GET_TO_NATIVE=PASS
          # Guests cannot access private Music or its preview adapter.
          for route in music.php music-import.php; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' "$origin/$route")"
            test "$code" = 403
          done
          echo P01_MUSIC_GUEST_OLD_GUI_BLOCKED=PASS
          code="$(curl -sS -o /dev/null -w '%{http_code}' -c "$cookie" -b "$cookie" \
            --data-urlencode 'format=links' "$origin/music-import.php")"
          test "$code" = 405
          code="$(curl -sS -o "$work/invalid.json" -w '%{http_code}' \
            -c "$cookie" -b "$cookie" --data-urlencode 'vf_frontstage_json=1' \
            --data-urlencode 'csrf=invalid' "$origin/music-import.php")"
          test "$code" = 419
          echo P01_MUSIC_LEGACY_NONJSON_AND_BAD_CSRF_DENY=PASS
          curl -fsS -c "$cookie" -b "$cookie" "$origin/start.php" -o "$work/start.html"
          user_csrf="$(python3 - "$work/start.html" <<'PY'
          import re,sys
          html=open(sys.argv[1]).read()
          m=re.search(r'data-vf-local-music-advanced-csrf\s+value="([^"]+)"',html)
          if not m: raise SystemExit('missing live Music CSRF')
          print(m.group(1))
          PY
          )"
          curl -fsS -c "$cookie" -b "$cookie" -X POST "$origin/music-import.php" \
            --data-urlencode 'vf_frontstage_json=1' \
            --data-urlencode "csrf=$user_csrf" \
            --data-urlencode 'format=links' \
            --data-urlencode 'content=https://youtu.be/dQw4w9WgXcQ' \
            -o "$work/preview.json"
          python3 - "$work/preview.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r.get('ok') is True and 'summary' in r and 'plan_summary' in r
          assert 'payload' in r and 'issues' in r and 'metadata_conflicts' in r
          PY
          curl -fsS -c "$cookie" -b "$cookie" "$origin/music.php?vf_frontstage=tracks" \
            -o "$work/tracks.json"
          python3 - "$work/tracks.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r.get('ok') is True and isinstance(r.get('playlists'),list) and isinstance(r.get('tracks'),list)
          PY
          echo P01_MUSIC_LEGACY_READ_JSON_AND_CSRF_PREVIEW=PASS
          echo P01_MUSIC_EPHEMERAL_HTTP_PROOF=PASS
          for pair in "full-governance.php|start.php?vf_manage=1&vf_tab=global&vf_group=resources&vf_section=governance" \
                      "full-governance.php?from=pending|inbox.php?vf_manage=1&vf_tab=inbox&vf_task=governance"; do
            route="${pair%%|*}"; target="${pair#*|}"
            curl -sS -D "$work/governance-headers" -c "$cookie" -b "$cookie" \
              "$origin/$route" -o /dev/null
            echo "P01_GOVERNANCE_ROUTE=$route"
            grep -Ei '^(HTTP/|Location:|Cache-Control:|X-Robots-Tag:)' "$work/governance-headers" || true
            grep -Eq '^HTTP/1.1 302' "$work/governance-headers"
            grep -Fq "Location: $target" "$work/governance-headers"
            grep -Eiq '^Cache-Control:.*no-store' "$work/governance-headers"
            grep -Eiq '^X-Robots-Tag:.*noindex' "$work/governance-headers"
            echo P01_GOVERNANCE_ROUTED_OWNER=PASS
          done
          code="$(curl -sS -o /dev/null -w '%{http_code}' "$origin/full-governance.php")"
          echo "P01_GOVERNANCE_GUEST_HTTP=$code"
          test "$code" = 403
          code="$(curl -sS -o /dev/null -w '%{http_code}' -c "$cookie" -b "$cookie" \
            -X POST "$origin/full-governance.php?from=pending")"
          echo "P01_GOVERNANCE_OWNER_POST_HTTP=$code"
          test "$code" = 405
          curl -fsS -c "$cookie" -b "$cookie" "$origin/inbox.php" -o "$work/inbox.html"
          echo "P01_GOV_INBOX_MOUNT_COUNT=$(grep -Fc 'data-vf-local-governance-area' "$work/inbox.html" || true)"
          grep -Fq 'data-vf-local-governance-area' "$work/inbox.html"
          curl -fsS -c "$cookie" -b "$cookie" "$origin/start.php" -o "$work/global-governance.html"
          echo "P01_GOV_GLOBAL_ROOT_COUNT=$(grep -Fc 'data-vf-global-governance-root' "$work/global-governance.html" || true)"
          echo "P01_GOV_GLOBAL_CSS_COUNT=$(grep -Fc 'asset.php?file=full-governance.css' "$work/global-governance.html" || true)"
          echo "P01_GOV_GLOBAL_JS_COUNT=$(grep -Fc 'asset.php?file=full-governance.js' "$work/global-governance.html" || true)"
          grep -Fq 'data-vf-global-governance-root' "$work/global-governance.html"
          grep -Fq 'asset.php?file=full-governance.css' "$work/global-governance.html"
          grep -Fq 'asset.php?file=full-governance.js' "$work/global-governance.html"
          echo P01_GOVERNANCE_OWNER_PENDING_GLOBAL_GET_NATIVE=PASS
          echo P01_GOVERNANCE_GUEST_POST_DENIAL=PASS
          curl -sS -D "$work/jobs-headers" -c "$cookie" -b "$cookie" \
            "$origin/jobs.php" -o /dev/null
          grep -Eq '^HTTP/1.1 302' "$work/jobs-headers"
          grep -Fq 'Location: start.php?vf_manage=1&vf_tab=global&vf_group=system&vf_section=operations' "$work/jobs-headers"
          grep -Eiq '^Cache-Control:.*no-store' "$work/jobs-headers"
          grep -Eiq '^X-Robots-Tag:.*noindex' "$work/jobs-headers"
          code="$(curl -sS -o /dev/null -w '%{http_code}' "$origin/jobs.php")"
          test "$code" = 403
          code="$(curl -sS -o /dev/null -w '%{http_code}' -c "$cookie" -b "$cookie" \
            -X POST "$origin/jobs.php")"
          test "$code" = 405
          curl -fsS -c "$cookie" -b "$cookie" "$origin/start.php" -o "$work/jobs-native.html"
          grep -Fq 'data-vf-ops-root' "$work/jobs-native.html"
          grep -Fq 'data-vf-ops-enqueue="backup"' "$work/jobs-native.html"
          grep -Fq 'data-vf-ops-history-read' "$work/jobs-native.html"
          echo P01_JOBS_OLD_GUI_OWNER_GET_NATIVE_GUEST_POST_DENY=PASS
          curl -sS -D "$work/health-headers" -c "$cookie" -b "$cookie" \
            "$origin/system-health.php" -o /dev/null
          grep -Eq '^HTTP/1.1 302' "$work/health-headers"
          grep -Fq 'Location: start.php?vf_manage=1&vf_tab=global&vf_group=system&vf_section=operations' "$work/health-headers"
          grep -Eiq '^Cache-Control:.*no-store' "$work/health-headers"
          grep -Eiq '^X-Robots-Tag:.*noindex' "$work/health-headers"
          code="$(curl -sS -o /dev/null -w '%{http_code}' "$origin/system-health.php")"
          test "$code" = 403
          code="$(curl -sS -o /dev/null -w '%{http_code}' -c "$cookie" -b "$cookie" \
            -X POST "$origin/system-health.php")"
          test "$code" = 405
          curl -fsS -c "$cookie" -b "$cookie" "$origin/start.php" -o "$work/health-native.html"
          grep -Fq 'data-vf-ops-health-verdict' "$work/health-native.html"
          grep -Fq 'data-vf-ops-health-plugins' "$work/health-native.html"
          echo P01_SYSTEM_HEALTH_NATIVE_OWNER_GUEST_METHOD=PASS
          code="$(curl -sS -o "$work/system-read.json" -w '%{http_code}' -c "$cookie" -b "$cookie" \
            "$origin/api.php?action=system_status")"
          test "$code" = 200
          python3 - "$work/system-read.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d.get('ok') is True, d.get('error','system_status failed')
          s=d.get('status',{})
          assert isinstance(s.get('summary',{}).get('blockers'),list)
          assert isinstance(s.get('summary',{}).get('warnings'),list)
          assert isinstance(s.get('directories'),dict)
          assert isinstance(s.get('privacy'),dict)
          assert isinstance(s.get('backup'),dict)
          assert isinstance(s.get('sqlite'),dict)
          PY
          code="$(curl -sS -o /dev/null -w '%{http_code}' "$origin/api.php?action=system_status")"
          test "$code" != 200
          code="$(curl -sS -o "$work/platform-read.json" -w '%{http_code}' -c "$cookie" -b "$cookie" \
            "$origin/platform-api.php?action=status")"
          test "$code" = 200
          python3 - "$work/platform-read.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d.get('ok') is True and isinstance(d.get('plugins'),list),d.get('error','platform read invalid')
          PY
          code="$(curl -sS -o /dev/null -w '%{http_code}' "$origin/platform-api.php?action=status")"
          test "$code" != 200
          echo P01_HEALTH_CANONICAL_STATUS_AND_PLATFORM_OWNER_READ_GUEST_DENY=PASS



          # Read-only retired System Baseline: old GET is a guarded native link.
          curl -sS -D "$work/baseline-headers" -c "$cookie" -b "$cookie" \
            "$origin/system-baseline.php" -o /dev/null
          grep -Eq '^HTTP/1.1 302' "$work/baseline-headers"
          grep -Fq 'Location: start.php?vf_manage=1&vf_tab=global&vf_group=system&vf_section=baseline' "$work/baseline-headers"
          grep -Fiq 'Cache-Control: no-store' "$work/baseline-headers"
          code="$(curl -sS -o /dev/null -w '%{http_code}' "$origin/system-baseline.php")"
          test "$code" = 403
          code="$(curl -sS -o /dev/null -w '%{http_code}' -c "$cookie" -b "$cookie" \
            -X POST "$origin/system-baseline.php")"
          test "$code" = 405
          echo P01_BASELINE_LEGACY_OWNER_REDIRECT_GUEST_POST_DENIAL=PASS
          code="$(curl -sS -o "$work/baseline.json" -w '%{http_code}' -c "$cookie" -b "$cookie" \
            "$origin/api.php?action=system_baseline_report")"
          test "$code" = 200
          python3 - "$work/baseline.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d.get('ok') is True
          r=d.get('report',{})
          assert r.get('overall') in ('PASS','ATTENTION','UNKNOWN')
          assert len(r.get('rows',[]))>60
          assert all(all(k in row for k in ('domain','parameter','result','expected','effective','source')) for row in r['rows'])
          assert len(d.get('environment',{}).get('rows',[]))==12
          PY
          code="$(curl -sS -o /dev/null -w '%{http_code}' "$origin/api.php?action=system_baseline_report")"
          test "$code" != 200
          code="$(curl -sS -o /dev/null -w '%{http_code}' -c "$cookie" -b "$cookie" \
            -X POST "$origin/api.php?action=system_baseline_report")"
          test "$code" = 405
          echo P01_BASELINE_NATIVE_READONLY_API_OWNER_ONLY=PASS

      - name: Clean transient checkout
        if: always()
        shell: bash
        run: |
          rm -rf candidate stable
          echo P01_LEGACY_TEST_WORKSPACE_CLEAN=YES
