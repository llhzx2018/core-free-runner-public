name: p01-ia6-legacy-gui-candidate

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p01-ia6-legacy-gui-candidate.yml

permissions:
  contents: read

jobs:
  source-parity:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'test(P01):')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_SHA: 885a6239539c104682bc3404daaba9499561087d
    steps:
      - name: Prepare PHP and Node
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd >/dev/null
          php -m | grep -Fxi pdo_sqlite >/dev/null
          node --version >/dev/null
          echo P01_LEGACY_TEST_RUNTIME=PASS

      - name: Transient exact-source private checkout
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" candidate
          git -C candidate fetch -q --depth 1 origin "$TARGET_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.492"
          echo P01_LEGACY_CANDIDATE_EXACT_SHA=PASS

      - name: Focused native/legacy parity unit tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          for src in src/browser-helper.php src/gov-topic-manager.php src/gov-book-manager.php; do
            php -l "$src" >/dev/null
          done
          for testfile in \
            tests/unit/admin_backend_closure_contract.php \
            tests/unit/backend_ia_round6_special_settings_v247274_contract.php \
            tests/unit/gov_book_backend_shell_contract.php \
            tests/unit/p01_ia_v2_r6_gov_source_ownership_contract.php \
            tests/unit/p01_ia_v3_r4_frontstage_source_boundary_contract.php; do
            php -l "$testfile" >/dev/null
            php "$testfile"
          done
          node tests/unit/p01_ia6_legacy_route_retirement_inventory.cjs | tail -n 2
          node tests/unit/p01_ia6_source_review_legacy_detail_parity_contract.cjs
          node tests/unit/p01_ia6_browser_helper_stale_and_secret_contract.cjs
          node tests/unit/p01_ia6_sources_governance_native_closure_contract.cjs
          node tests/unit/p01_ia6_legacy_bookmark_native_contract.cjs
          echo P01_LEGACY_GUI_FOCUSED_EXACT_SOURCE=PASS

      - name: Canonical full-unit baseline comparison
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --depth 1 --branch v2.47.492 "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" stable
          test "$(tr -d '\r\n ' < stable/VERSION)" = "2.47.492"
          (cd candidate && bash tests/canonical_release_regression.sh . "$GITHUB_WORKSPACE/stable" --require-zero-debt) | tee /tmp/p01-ia6-canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/p01-ia6-canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/p01-ia6-canonical.txt
          echo P01_LEGACY_GUI_CANONICAL_FULL_UNIT=PASS

      - name: Clean transient checkout
        if: always()
        shell: bash
        run: |
          rm -rf candidate stable
          echo P01_LEGACY_TEST_WORKSPACE_CLEAN=YES
