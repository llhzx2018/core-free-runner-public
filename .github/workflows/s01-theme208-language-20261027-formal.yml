name: S01 Theme exact formal release
on:
  push:
    branches: [task/s01-theme208-language-20261027]
    paths: ['.github/workflows/s01-theme208-language-20261027-formal.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.208
  TARGET_SHA: afa7c7b3fc9ef9ee4a7a1036c20c26c38a070e18
  TARGET_TREE: 0be55fa94cd07cf6d57e29562328912c5c7ef1c5
  BASE_SHA: 19d47c311d8d85c6b9e6fbc1cdd38781c736c55b
  LANE_ID: s01-theme208-language-20261027
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: control
      - name: Formal identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-theme208-language-20261027/formal-spec.json --input control/.github/workflows/s01-theme208-language-20261027-formal.yml
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: afa7c7b3fc9ef9ee4a7a1036c20c26c38a070e18
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact candidate, merged tree and required evidence readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider candidate-proof
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40468636974 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40468636974 --jq .head_sha)" = 427c2b58438e54179cb7a7f40095f2b3acb216be
          test "$(gh api repos/$TARGET_REPO/commits/main --jq .sha)" = "$TARGET_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$TARGET_SHA --jq .tree.sha)" = "$TARGET_TREE"
          gh run download 40468636974 --repo llhzx2018/core-free-runner-public --name s01-home-40468636974 --dir candidate-proof
          cmp candidate-proof/state-before.sha256 candidate-proof/state-after.sha256
          cmp candidate-proof/contracts-before.json candidate-proof/contracts-after.json
          python3 control/lanes/s01-theme208-language-20261027/package.py
          python3 - <<'PYVERIFY'
          import json,pathlib,subprocess,urllib.parse
          r=pathlib.Path('candidate-proof')
          old=json.loads((r/'package.json').read_text());new=json.loads(pathlib.Path('proof/package.json').read_text())
          assert old['source']=='1d70bd4bd427be70871da2067cebe0cea3063662'
          cases=[json.loads(line) for line in (r/'current-label.jsonl').read_text().splitlines()]
          assert len(cases)==8 and all(x['status']=='PASS' for x in cases)
          assert sum(x['phase']=='before' and x['guard'] and not x['canonical'] for x in cases)==2
          for phase in ['before','after']:
              d=json.loads((r/f'{phase}-results.json').read_text());assert d['status']=='PASS' and d['cases']==16
          d=json.loads((r/'after-results.json').read_text());assert d['noJavaScript']=='PASS' and d['bodyHeadMenuParity']=='PASS'
          assert json.loads((r/'clean-install.json').read_text())['status']=='PASS'
          assert json.loads((r/'bootstrap.json').read_text())['status']=='PASS'
          assert json.loads((r/'native-lifecycle.json').read_text())['status']=='PASS'
          for lang in ['en','zh']:
              for width in [1440,1024]:
                  assert (r/f'404-{lang}-{width}.png').stat().st_size>500
                  assert (r/f'language-open-{lang}-{width}.png').stat().st_size>500
          for k in ['status','version','tree','sha256','bytes','files']: assert old[k]==new[k],k
          assert new['sha256']=='526af72e467888f6a2bddea7383fe52ebfcea8161bc4bee4f736f7050f5a28fe' and new['bytes']==2010876
          coverage=json.loads(pathlib.Path('control/lanes/s01-theme208-language-20261027/release-authority.json').read_text())
          assert set(coverage['required'])=={'TESTING','GIT','UA_UI','SEO','SECURITY','INSTALL','UPGRADE','DATA_SCHEMA','PERFORMANCE'}
          assert coverage['source']=='1d70bd4bd427be70871da2067cebe0cea3063662' and coverage['tree']=='0be55fa94cd07cf6d57e29562328912c5c7ef1c5'
          assert coverage['owner_preview_runtime']=='N_A'
          assert coverage['release_mode']=='PROJECT_PREVIEW_N_A'
          assert coverage['owner_real_use']=='POST_PRODUCTION_REQUIRED'
          assert coverage['production_auto_apply'] is False
          for item in coverage['required'].values():
              assert item['sha'] and item['acceptance']
              endpoint='repos/llhzx2018/gov-doc/contents/'+urllib.parse.quote(item['path'],safe='/')+'?ref=main'
              live=json.loads(subprocess.check_output(['gh','api',endpoint]))
              assert live['sha']==item['sha'],item['path']
              item['evidence_status']='PASS_EXACT_CANDIDATE_MACHINE'
          coverage['candidate_status']='PASS_EXACT_CANDIDATE_MACHINE'
          coverage['candidate_run']='40468636974'
          coverage['merged_source']='afa7c7b3fc9ef9ee4a7a1036c20c26c38a070e18'
          coverage['formal_release_gate']='PASS'
          coverage['production_effect']='NOT_PROVEN_POST_MANUAL_UPGRADE_READBACK_REQUIRED'
          pathlib.Path('proof/public-authority-coverage.json').write_text(json.dumps(coverage,ensure_ascii=False,indent=2))
          print('MERGED_TREE_EQUALS_TESTED_TREE_AND_EXACT_PACKAGE_PASS')
          PYVERIFY
      - name: Publish only the exact verified package
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.35.208 --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create v1.35.208 provider/vf-tools-theme_V1.35.208.zip --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Theme V1.35.208' --notes '修复404语言控件退回普通文字链接：没有内容翻译家族时，统一下拉使用原守卫已有的实际语言首页目标；保留无跳转地址的当前语言文字项，其他目标仍须通过既有URL校验；不改菜单、翻译关系、内容、SEO、CSS/JS或持久化。精确208候选完成207旧行为复现、缺失当前/目标地址回归、中英文1440/1024页头及键盘/鼠标/Esc/无脚本验证；404、首页和配对工具正文/Head/菜单保持。干净安装、207升级208/回退/重复安装及保护数据检查通过；476运行文件，远端ZIP字节校验。后台历史明确207正文截图可见范围及英文页头未结案，不自动写入人工通过。手机暂缓，Production由Owner手工升级后复验。' --latest
          fi
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/v1.35.208 --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh release view v1.35.208 --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - name: Authenticated remote ZIP byte comparison
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download v1.35.208 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.208.zip --dir remote
          cmp provider/vf-tools-theme_V1.35.208.zip remote/vf-tools-theme_V1.35.208.zip
          echo '526af72e467888f6a2bddea7383fe52ebfcea8161bc4bee4f736f7050f5a28fe  remote/vf-tools-theme_V1.35.208.zip' | sha256sum -c
          test "$(stat -c %s remote/vf-tools-theme_V1.35.208.zip)" = 2010876
          gh release view v1.35.208 --repo "$TARGET_REPO" --json url,publishedAt,tagName > proof/formal-release.json
          echo FORMAL_RELEASE_EXACT_REMOTE_ASSET_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-home-formal-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target provider remote candidate-proof
