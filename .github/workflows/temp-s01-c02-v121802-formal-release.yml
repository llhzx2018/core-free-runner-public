name: TEMP S01-C02 Ops 1.21.802 Formal Release
on:
  push:
    branches: [temp/s01-c02-v121802-formal-release-20260904]
    paths: ['.github/workflows/temp-s01-c02-v121802-formal-release.yml']
permissions:
  contents: read
jobs:
  formal-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_REPOSITORY: llhzx2018/vf-tools-ops
      TARGET_COMMIT: 11163b7833ec4908b9593ddf424c9bfe39db4975
      TARGET_TREE: 3d569e4f0e13e357b09947153e1b59e20d34a9eb
      BASE_RELEASE_COMMIT: 897d34c3153ca2a6d7cfa289cca7fd9966062f17
      CANDIDATE_GATE_RUN: '33863948691'
      CANDIDATE_GATE_RUNNER_SHA: 155e1b71f9cbc1af5a09f691a433877d62fc94b7
      VERSION: 1.21.802
      TAG: v1.21.802
      RELEASE_NAME: VF Tools Ops V1.21.802
      ASSET_NAME: vf-tools-ops_V1.21.802.zip
      EXPECTED_ASSET_BYTES: '3204127'
      EXPECTED_ASSET_SHA256: a03549a39a7eceaf90a4c3e7d53d9fa942d945ef456e6df97c05f2db0ab79cea
      EXPECTED_RUNTIME_FILES: '896'
      EXPECTED_RUNTIME_FP: 3ed9689e23cac892118dedfbc78745f90fa81e0c4f17aaa1aa2c0ba407f4a053
      EVIDENCE_DIR: /tmp/s01-c02-v121802-formal-release
    steps:
      - name: Credential and Candidate Gate
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail; test -n "$READ_TOKEN"; test -n "$WRITE_TOKEN"; mkdir -p "$EVIDENCE_DIR"
          J="$(curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/runs/${CANDIDATE_GATE_RUN}")"
          test "$(jq -r .status <<<"$J")" = completed; test "$(jq -r .conclusion <<<"$J")" = success; test "$(jq -r .head_sha <<<"$J")" = "$CANDIDATE_GATE_RUNNER_SHA"
          echo CANDIDATE_GATE=PASS
      - name: Checkout exact tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.TARGET_COMMIT }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops
      - name: Verify source identity scope and focused contract
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$TARGET_COMMIT"; test "$(git -C ops rev-parse HEAD^{tree})" = "$TARGET_TREE"; test "$(tr -d '\r\n' < ops/VERSION)" = "$VERSION"
          for b in main develop; do J="$(curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${TARGET_REPOSITORY}/branches/$b")"; test "$(jq -r .commit.sha <<<"$J")" = "$TARGET_COMMIT"; done
          git -C ops diff --name-only "$BASE_RELEASE_COMMIT" "$TARGET_COMMIT" | sort > "$EVIDENCE_DIR/changed-files.txt"
          printf '%s\n' '.github/phase3/v121802-seo-planner-family-authority-union.php' 'VERSION' 'includes/seo-data/planner-family-authority-bootstrap-v121802.php' 'includes/seo-planner/contract.php' 'vf-ops.php' | sort > /tmp/expected
          diff -u /tmp/expected "$EVIDENCE_DIR/changed-files.txt"
          php -l ops/vf-ops.php; php -l ops/includes/seo-planner/contract.php; php -l ops/includes/seo-data/planner-family-authority-bootstrap-v121802.php
          php ops/.github/phase3/v121802-seo-planner-family-authority-union.php | tee "$EVIDENCE_DIR/focused.txt"; grep -Fxq PASS_V121802_SEO_PLANNER_FAMILY_AUTHORITY_UNION "$EVIDENCE_DIR/focused.txt"
          echo SOURCE_IDENTITY_SCOPE_CONTRACT=PASS
      - name: Build exact locked artifact
        run: |
          set -Eeuo pipefail; mkdir -p /tmp/release
          python3 - <<'PY'
          import re,hashlib,zipfile,json,os
          from pathlib import Path
          root=Path('ops'); files={}
          def ok(rel):
            p=rel.as_posix(); parts=p.split('/')
            if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in parts): return False
            if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',p,re.I): return False
            if '/' not in p: return p in {'vf-ops.php','uninstall.php'}
            return parts[0] in {'includes','assets','languages','config'}
          for s in root.rglob('*'):
            if s.is_file() and not s.is_symlink():
              r=s.relative_to(root)
              if ok(r): files[r.as_posix()]=s.read_bytes()
          files=dict(sorted(files.items())); fp=hashlib.sha256()
          for r,b in files.items(): fp.update((r+'\0'+hashlib.sha256(b).hexdigest()+'\n').encode())
          z=Path('/tmp/release/'+os.environ['ASSET_NAME'])
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as out:
            for r,b in files.items():
              i=zipfile.ZipInfo('vf-ops/'+r,(2026,9,4,0,0,0)); i.compress_type=zipfile.ZIP_DEFLATED; i.external_attr=0o100644<<16; out.writestr(i,b)
          m={'asset_bytes':z.stat().st_size,'asset_sha256':hashlib.sha256(z.read_bytes()).hexdigest(),'runtime_files':len(files),'runtime_fingerprint':fp.hexdigest()}
          assert m['asset_bytes']==int(os.environ['EXPECTED_ASSET_BYTES']),m; assert m['asset_sha256']==os.environ['EXPECTED_ASSET_SHA256'],m; assert m['runtime_files']==int(os.environ['EXPECTED_RUNTIME_FILES']),m; assert m['runtime_fingerprint']==os.environ['EXPECTED_RUNTIME_FP'],m
          Path(os.environ['EVIDENCE_DIR']+'/artifact.json').write_text(json.dumps(m,indent=2)+'\n'); print(json.dumps(m))
          PY
          unzip -tq "/tmp/release/$ASSET_NAME" >/dev/null; echo EXACT_RELEASE_ARTIFACT=PASS
      - name: Create exact tag release and upload
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(curl -sS -o /tmp/x -w '%{http_code}' -H "Authorization: Bearer $READ_TOKEN" "https://api.github.com/repos/${TARGET_REPOSITORY}/releases/tags/${TAG}")" = 404
          jq -n --arg ref "refs/tags/${TAG}" --arg sha "$TARGET_COMMIT" '{ref:$ref,sha:$sha}' >/tmp/tag.json
          curl -fsSL -X POST -H "Authorization: Bearer $WRITE_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' "https://api.github.com/repos/${TARGET_REPOSITORY}/git/refs" --data-binary @/tmp/tag.json >/tmp/tag-created.json
          test "$(jq -r .object.sha /tmp/tag-created.json)" = "$TARGET_COMMIT"
          cat >/tmp/body.md <<EOF
          VF Tools Ops V1.21.802 closes the Production SEO Planner bridge family-authority/startup-order defect after the OWNER-confirmed formal Primary was already persisted.

          - Candidate Gate ${CANDIDATE_GATE_RUN} reproduced exact 1.21.801 state: formalPrimaryCount=1, Planner=0, PLANNER_VALIDATION_FAILED.
          - Exact packaged 1.21.801 -> 1.21.802 on WordPress 7.1 / MariaDB 11.4 reconciled the formal Primary to one Planner row and remained idempotent on the second closure run.
          - Formal SEO Page Family authority is unioned with core family authority without allowing arbitrary unregistered family IDs.
          - Page-family read authority is loaded before the Planner bridge on closure/REST runtime paths.
          - Existing OWNER-confirmed Primary remains unchanged; no semantic candidate selection is automated.
          - M3U8, Seed HOLD, post content and plugin-governance protected scopes are untouched by this fix.
          - Exact source ${TARGET_COMMIT}; tree ${TARGET_TREE}.
          - Asset ${ASSET_NAME}; ${EXPECTED_ASSET_BYTES} bytes; SHA256 ${EXPECTED_ASSET_SHA256}; runtime files ${EXPECTED_RUNTIME_FILES}; fingerprint ${EXPECTED_RUNTIME_FP}.
          - Production upgrade is NOT executed by this GitHub Release.
          EOF
          sed -i 's/^          //' /tmp/body.md
          jq -n --arg tag "$TAG" --arg name "$RELEASE_NAME" --rawfile body /tmp/body.md '{tag_name:$tag,name:$name,body:$body,draft:false,prerelease:false}' >/tmp/rel.json
          curl -fsSL -X POST -H "Authorization: Bearer $WRITE_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' "https://api.github.com/repos/${TARGET_REPOSITORY}/releases" --data-binary @/tmp/rel.json >/tmp/rel-created.json
          RID="$(jq -r .id /tmp/rel-created.json)"; test -n "$RID"; test "$RID" != null
          curl -fsSL -X POST -H "Authorization: Bearer $WRITE_TOKEN" -H 'Content-Type: application/zip' "https://uploads.github.com/repos/${TARGET_REPOSITORY}/releases/${RID}/assets?name=${ASSET_NAME}" --data-binary "@/tmp/release/$ASSET_NAME" >/tmp/asset.json
          AID="$(jq -r .id /tmp/asset.json)"; test "$(jq -r .size /tmp/asset.json)" = "$EXPECTED_ASSET_BYTES"
          R="$(curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${TARGET_REPOSITORY}/releases/tags/${TAG}")"
          test "$(jq -r .id <<<"$R")" = "$RID"; test "$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.id' <<<"$R")" = "$AID"; test "$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.digest' <<<"$R")" = "sha256:${EXPECTED_ASSET_SHA256}"
          jq -n --argjson release_id "$RID" --argjson asset_id "$AID" --arg sha "$EXPECTED_ASSET_SHA256" --arg fp "$EXPECTED_RUNTIME_FP" '{status:"PASS",release_id:$release_id,asset_id:$asset_id,asset_sha256:$sha,runtime_fingerprint:$fp}' | tee "$EVIDENCE_DIR/release-summary.json"
          echo FORMAL_RELEASE_V121802=PASS
      - name: Upload evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-v121802-formal-release
          path: ${{ env.EVIDENCE_DIR }}/
          retention-days: 14
