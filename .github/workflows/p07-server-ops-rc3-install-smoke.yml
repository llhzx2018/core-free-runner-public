name: P07 Server Ops RC3 Install Smoke

on:
  push:
    branches: [main, work/p07-real-r1-dbadd-identifier-fix]
    paths:
      - 'installers/p07.sh'
      - 'installers/p07-rc3-candidate.sh'
      - 'installers/p07-rc3-cloudpanel-complete.sh'
      - 'installers/p07-rc3-real-r1-db-hotfix.sh'
      - 'installers/p07-rc3-real-r1-dbadd-hotfix.sh'
      - 'dist/p07/0.1.0-rc3/**'
      - '.github/workflows/p07-server-ops-rc3-install-smoke.yml'
  pull_request:
    paths:
      - 'installers/p07.sh'
      - 'installers/p07-rc3-candidate.sh'
      - 'installers/p07-rc3-cloudpanel-complete.sh'
      - 'installers/p07-rc3-real-r1-db-hotfix.sh'
      - 'installers/p07-rc3-real-r1-dbadd-hotfix.sh'
      - 'dist/p07/0.1.0-rc3/**'
      - '.github/workflows/p07-server-ops-rc3-install-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare isolated install environment
        run: |
          set -euo pipefail
          rm -rf /tmp/p07-rc3-smoke
          mkdir -p /tmp/p07-rc3-smoke/fakebin
          cat >/tmp/p07-rc3-smoke/fakebin/rclone <<'SH'
          #!/usr/bin/env bash
          exit 0
          SH
          chmod +x /tmp/p07-rc3-smoke/fakebin/rclone
          bash -n installers/p07.sh
          bash -n installers/p07-rc3-candidate.sh
          bash -n installers/p07-rc3-cloudpanel-complete.sh
          bash -n installers/p07-rc3-real-r1-db-hotfix.sh
          bash -n installers/p07-rc3-real-r1-dbadd-hotfix.sh
          grep -Fq 'EXPECTED_BLOB="d733c7bc7b62e6ed81103855dc7f4f74619618a9"' installers/p07.sh
          grep -Fq 'BASE_INSTALLER_BLOB="843fece49262dd030462273d0b188bdab75d8234"' installers/p07-rc3-real-r1-dbadd-hotfix.sh
          grep -Fq 'EXPECTED_BUILD_ID="0.1.0-rc3-guided-init12"' installers/p07-rc3-real-r1-dbadd-hotfix.sh
          grep -Fq 'P07_INIT12_TEST_FAIL' installers/p07-rc3-real-r1-dbadd-hotfix.sh

      - name: Fresh install complete guided-init12 runtime
        env:
          P07_PUBLIC_ROOT: https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/${{ github.event.pull_request.head.sha || github.sha }}
          P07_ALLOW_NONROOT: '1'
          P07_SKIP_APT: '1'
          P07_SKIP_INVENTORY_SELFTEST: '1'
          P07_NO_EXEC: '1'
          P07_INSTALL_DIR: /tmp/p07-rc3-smoke/fresh/opt/vf-server-ops
          P07_PREVIOUS_DIR: /tmp/p07-rc3-smoke/fresh/opt/vf-server-ops.previous
          P07_BIN_LINK: /tmp/p07-rc3-smoke/fresh/bin/vfops
        run: |
          set -euo pipefail
          export PATH="/tmp/p07-rc3-smoke/fakebin:$PATH"
          bash installers/p07.sh
          ROOT=/tmp/p07-rc3-smoke/fresh/opt/vf-server-ops
          test "$(/tmp/p07-rc3-smoke/fresh/bin/vfops --version)" = 'VF Server Ops 0.1.0 RC3'
          test "$(/tmp/p07-rc3-smoke/fresh/bin/vfops --build-id)" = '0.1.0-rc3-guided-init12'
          test "$(cat "$ROOT/BUILD_ID")" = '0.1.0-rc3-guided-init12'
          test "$(git hash-object "$ROOT/lib/site_lifecycle.py")" = '3e84dfa74b4df8413c3228322b8dc1c22d901761'
          grep -Fq 'database = cloudpanel.validate_name(f"p07{token}{index}"' "$ROOT/lib/site_lifecycle.py"
          grep -Fq 'username = cloudpanel.validate_name(f"p07u{token[:8]}{index}"' "$ROOT/lib/site_lifecycle.py"
          ! grep -Fq 'p07_{token}' "$ROOT/lib/site_lifecycle.py"
          test "$(git hash-object "$ROOT/lib/restore_as_verified.py")" = 'c0df2750e0cb79e16bf46cad88e85cacacfc2415'
          grep -Fq '_database_compat_context' "$ROOT/lib/restore_as_verified.py"
          grep -Fq 'P07_CLOUDPANEL_OPERATION=' "$ROOT/lib/restore_as_verified.py"
          grep -Fq '9. Vhost 模板' "$ROOT/bin/vfops-cloudpanel-ui"
          grep -Fq '10. 平台基础能力检查' "$ROOT/bin/vfops-cloudpanel-ui"
          grep -Fq 'P07_RESTORE_AS_VERIFIED=' "$ROOT/bin/vfops-site-ui"
          ! grep -Fq 'REAL_PASS' "$ROOT/lib/restore_as_verified.py"

      - name: RC2 to guided-init12 upgrade preserves RC2 previous tree
        env:
          P07_PUBLIC_ROOT: https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/${{ github.event.pull_request.head.sha || github.sha }}
          P07_ALLOW_NONROOT: '1'
          P07_SKIP_APT: '1'
          P07_SKIP_INVENTORY_SELFTEST: '1'
          P07_NO_EXEC: '1'
          P07_INSTALL_DIR: /tmp/p07-rc3-smoke/upgrade/opt/vf-server-ops
          P07_PREVIOUS_DIR: /tmp/p07-rc3-smoke/upgrade/opt/vf-server-ops.previous
          P07_BIN_LINK: /tmp/p07-rc3-smoke/upgrade/bin/vfops
        run: |
          set -euo pipefail
          export PATH="/tmp/p07-rc3-smoke/fakebin:$PATH"
          mkdir -p /tmp/p07-rc3-smoke/upgrade/opt /tmp/p07-rc3-smoke/upgrade/bin
          cp -a dist/p07/0.1.0-rc2/vf-server-ops /tmp/p07-rc3-smoke/upgrade/opt/vf-server-ops
          chmod +x /tmp/p07-rc3-smoke/upgrade/opt/vf-server-ops/bin/vfops-user
          ln -s /tmp/p07-rc3-smoke/upgrade/opt/vf-server-ops/bin/vfops-user /tmp/p07-rc3-smoke/upgrade/bin/vfops
          bash installers/p07.sh
          test "$(/tmp/p07-rc3-smoke/upgrade/bin/vfops --build-id)" = '0.1.0-rc3-guided-init12'
          test "$(git hash-object /tmp/p07-rc3-smoke/upgrade/opt/vf-server-ops/lib/site_lifecycle.py)" = '3e84dfa74b4df8413c3228322b8dc1c22d901761'
          test -d /tmp/p07-rc3-smoke/upgrade/opt/vf-server-ops.previous
          test "$(/tmp/p07-rc3-smoke/upgrade/opt/vf-server-ops.previous/bin/vfops-user --version)" = 'VF Server Ops 0.1.0 RC2'

      - name: Injected init12 failure restores exact pre-run RC2 and previous state
        env:
          P07_PUBLIC_ROOT: https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/${{ github.event.pull_request.head.sha || github.sha }}
          P07_ALLOW_NONROOT: '1'
          P07_SKIP_APT: '1'
          P07_SKIP_INVENTORY_SELFTEST: '1'
          P07_NO_EXEC: '1'
          P07_INIT12_TEST_FAIL: '1'
          P07_INSTALL_DIR: /tmp/p07-rc3-smoke/rollback/opt/vf-server-ops
          P07_PREVIOUS_DIR: /tmp/p07-rc3-smoke/rollback/opt/vf-server-ops.previous
          P07_BIN_LINK: /tmp/p07-rc3-smoke/rollback/bin/vfops
        run: |
          set -euo pipefail
          export PATH="/tmp/p07-rc3-smoke/fakebin:$PATH"
          mkdir -p /tmp/p07-rc3-smoke/rollback/opt /tmp/p07-rc3-smoke/rollback/bin
          cp -a dist/p07/0.1.0-rc2/vf-server-ops /tmp/p07-rc3-smoke/rollback/opt/vf-server-ops
          chmod +x /tmp/p07-rc3-smoke/rollback/opt/vf-server-ops/bin/vfops-user
          ln -s /tmp/p07-rc3-smoke/rollback/opt/vf-server-ops/bin/vfops-user /tmp/p07-rc3-smoke/rollback/bin/vfops
          before="$(git hash-object /tmp/p07-rc3-smoke/rollback/opt/vf-server-ops/bin/vfops-user)"
          set +e
          bash installers/p07.sh >/tmp/p07-rc3-smoke/injected-fail.log 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          test "$(/tmp/p07-rc3-smoke/rollback/bin/vfops --version)" = 'VF Server Ops 0.1.0 RC2'
          after="$(git hash-object /tmp/p07-rc3-smoke/rollback/opt/vf-server-ops/bin/vfops-user)"
          test "$before" = "$after"
          test ! -e /tmp/p07-rc3-smoke/rollback/opt/vf-server-ops.previous
          grep -Fq '已恢复执行前版本' /tmp/p07-rc3-smoke/injected-fail.log

      - name: Result
        run: echo 'P07_SERVER_OPS_RC3_INSTALL_UPGRADE_ROLLBACK_SMOKE=PASS'
