name: P07 Server Ops RC3 Install Smoke

on:
  push:
    branches: [main, work/p07-guided-init9-cloudpanel-foundation]
    paths:
      - 'installers/p07.sh'
      - 'installers/p07-rc3-candidate.sh'
      - 'dist/p07/0.1.0-rc3/**'
      - '.github/workflows/p07-server-ops-rc3-install-smoke.yml'
  pull_request:
    paths:
      - 'installers/p07.sh'
      - 'installers/p07-rc3-candidate.sh'
      - 'dist/p07/0.1.0-rc3/**'
      - '.github/workflows/p07-server-ops-rc3-install-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Prepare isolated install environment
        run: |
          set -euo pipefail
          rm -rf /tmp/p07-rc3-smoke
          mkdir -p /tmp/p07-rc3-smoke/fakebin
          cat >/tmp/p07-rc3-smoke/fakebin/rclone <<'SH'
          #!/usr/bin/env bash
          exit 0
          SH
          chmod +x /tmp/p07-rc3-smoke/fakebin/rclone
          bash -n installers/p07.sh
          bash -n installers/p07-rc3-candidate.sh
          grep -Fq 'EXPECTED_BUILD_ID="0.1.0-rc3-guided-init9"' installers/p07-rc3-candidate.sh
          grep -Fq 'EXPECTED_BLOB="b14a040590942605712f2b172ce5789042b3772c"' installers/p07.sh
          test "$(git hash-object installers/p07-rc3-candidate.sh)" = 'b14a040590942605712f2b172ce5789042b3772c'

      - name: Fresh install complete guided-init9 runtime
        env:
          P07_PUBLIC_ROOT: https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/${{ github.sha }}
          P07_ALLOW_NONROOT: '1'
          P07_SKIP_APT: '1'
          P07_SKIP_INVENTORY_SELFTEST: '1'
          P07_NO_EXEC: '1'
          P07_INSTALL_DIR: /tmp/p07-rc3-smoke/fresh/opt/vf-server-ops
          P07_PREVIOUS_DIR: /tmp/p07-rc3-smoke/fresh/opt/vf-server-ops.previous
          P07_BIN_LINK: /tmp/p07-rc3-smoke/fresh/bin/vfops
        run: |
          set -euo pipefail
          export PATH="/tmp/p07-rc3-smoke/fakebin:$PATH"
          bash installers/p07.sh
          ROOT=/tmp/p07-rc3-smoke/fresh/opt/vf-server-ops
          test "$(/tmp/p07-rc3-smoke/fresh/bin/vfops --version)" = 'VF Server Ops 0.1.0 RC3'
          test "$(/tmp/p07-rc3-smoke/fresh/bin/vfops --build-id)" = '0.1.0-rc3-guided-init9'
          test "$(cat "$ROOT/BUILD_ID")" = '0.1.0-rc3-guided-init9'
          for path in \
            bin/vfops-user \
            bin/vfops-site-ui \
            bin/vfops-migrate-ui \
            bin/vfops-cloudpanel-ui \
            bin/vfops-auto-backup \
            bin/vfops-storage-setup \
            lib/cloudpanel.py \
            lib/cloudpanel_site.py \
            lib/site_lifecycle.py \
            lib/restore.py \
            lib/restore_as.py \
            lib/restore_as_verified.py \
            lib/package.py \
            lib/backup_frontend.py; do
            test -f "$ROOT/$path"
          done
          grep -Fq '1. 服务器 / 网站概览' "$ROOT/bin/vfops-user"
          grep -Fq '2. 备份网站' "$ROOT/bin/vfops-user"
          grep -Fq '3. 恢复网站' "$ROOT/bin/vfops-user"
          grep -Fq '4. 迁移网站到新服务器' "$ROOT/bin/vfops-user"
          grep -Fq '5. 自动备份 / 远程灾备' "$ROOT/bin/vfops-user"
          grep -Fq '6. CloudPanel 网站工具' "$ROOT/bin/vfops-user"
          grep -Fq 'restore_as_verified.py' "$ROOT/bin/vfops-site-ui"
          grep -Fq 'TARGET_SITE_CONFLICT' "$ROOT/bin/vfops-migrate-ui"
          grep -Fq 'LOCAL_HTTPS_SNI' "$ROOT/lib/restore_as_verified.py"
          grep -Fq 'existing_site_overwrite_allowed' "$ROOT/lib/restore_as.py"
          grep -Fq 'Google 实时：' "$ROOT/bin/vfops-auto-backup"
          grep -Fq '旧 PASS 不会覆盖新站点' "$ROOT/bin/vfops-auto-backup"

      - name: RC2 to guided-init9 upgrade preserves previous tree
        env:
          P07_PUBLIC_ROOT: https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/${{ github.sha }}
          P07_ALLOW_NONROOT: '1'
          P07_SKIP_APT: '1'
          P07_SKIP_INVENTORY_SELFTEST: '1'
          P07_NO_EXEC: '1'
          P07_INSTALL_DIR: /tmp/p07-rc3-smoke/upgrade/opt/vf-server-ops
          P07_PREVIOUS_DIR: /tmp/p07-rc3-smoke/upgrade/opt/vf-server-ops.previous
          P07_BIN_LINK: /tmp/p07-rc3-smoke/upgrade/bin/vfops
        run: |
          set -euo pipefail
          export PATH="/tmp/p07-rc3-smoke/fakebin:$PATH"
          mkdir -p /tmp/p07-rc3-smoke/upgrade/opt /tmp/p07-rc3-smoke/upgrade/bin
          cp -a dist/p07/0.1.0-rc2/vf-server-ops /tmp/p07-rc3-smoke/upgrade/opt/vf-server-ops
          chmod +x /tmp/p07-rc3-smoke/upgrade/opt/vf-server-ops/bin/vfops-user
          ln -s /tmp/p07-rc3-smoke/upgrade/opt/vf-server-ops/bin/vfops-user /tmp/p07-rc3-smoke/upgrade/bin/vfops
          test "$(/tmp/p07-rc3-smoke/upgrade/bin/vfops --version)" = 'VF Server Ops 0.1.0 RC2'
          bash installers/p07.sh
          test "$(/tmp/p07-rc3-smoke/upgrade/bin/vfops --version)" = 'VF Server Ops 0.1.0 RC3'
          test "$(/tmp/p07-rc3-smoke/upgrade/bin/vfops --build-id)" = '0.1.0-rc3-guided-init9'
          test "$(cat /tmp/p07-rc3-smoke/upgrade/opt/vf-server-ops/BUILD_ID)" = '0.1.0-rc3-guided-init9'
          test -f /tmp/p07-rc3-smoke/upgrade/opt/vf-server-ops/lib/restore_as_verified.py
          test -d /tmp/p07-rc3-smoke/upgrade/opt/vf-server-ops.previous
          test "$(/tmp/p07-rc3-smoke/upgrade/opt/vf-server-ops.previous/bin/vfops-user --version)" = 'VF Server Ops 0.1.0 RC2'

      - name: Failed install automatically rolls back
        env:
          P07_PUBLIC_ROOT: https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/${{ github.sha }}
          P07_ALLOW_NONROOT: '1'
          P07_SKIP_APT: '1'
          P07_SKIP_INVENTORY_SELFTEST: '1'
          P07_NO_EXEC: '1'
          P07_INSTALL_DIR: /tmp/p07-rc3-smoke/rollback/opt/vf-server-ops
          P07_PREVIOUS_DIR: /tmp/p07-rc3-smoke/rollback/opt/vf-server-ops.previous
          P07_BIN_LINK: /tmp/p07-rc3-smoke/rollback/bin/vfops
        run: |
          set -euo pipefail
          export PATH="/tmp/p07-rc3-smoke/fakebin:$PATH"
          mkdir -p /tmp/p07-rc3-smoke/rollback/opt /tmp/p07-rc3-smoke/rollback/bin
          cp -a dist/p07/0.1.0-rc2/vf-server-ops /tmp/p07-rc3-smoke/rollback/opt/vf-server-ops
          chmod +x /tmp/p07-rc3-smoke/rollback/opt/vf-server-ops/bin/vfops-user
          ln -s /tmp/p07-rc3-smoke/rollback/opt/vf-server-ops/bin/vfops-user /tmp/p07-rc3-smoke/rollback/bin/vfops
          cp installers/p07-rc3-candidate.sh /tmp/p07-rc3-smoke/forced-fail-installer.sh
          sed -i 's/EXPECTED_VERSION="VF Server Ops 0.1.0 RC3"/EXPECTED_VERSION="VF Server Ops 9.9.9 FORCED_FAIL"/' /tmp/p07-rc3-smoke/forced-fail-installer.sh
          set +e
          bash /tmp/p07-rc3-smoke/forced-fail-installer.sh
          rc=$?
          set -e
          test "$rc" -ne 0
          test "$(/tmp/p07-rc3-smoke/rollback/bin/vfops --version)" = 'VF Server Ops 0.1.0 RC2'
          test ! -e /tmp/p07-rc3-smoke/rollback/opt/vf-server-ops.previous

      - name: Result
        run: echo 'P07_SERVER_OPS_RC3_INSTALL_UPGRADE_ROLLBACK_SMOKE=PASS'
