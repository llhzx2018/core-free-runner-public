name: S01-C01 Guide Detail V1.35.138 exact-source isolated gate
on:
  push:
    branches: [task/s01-guide-detail-v135138-20261019]
    paths: ['.github/workflows/s01-guide-detail-v135138-20261019.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_SHA: 3dfed6124c5942460167d567783df0fcef06e816
      BASE_SHA: c50ee8c5c24bbe75f2eeb67f04632f517f7ce86f
      VF_REVIEW_ONLY_STATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: runner
      - name: Load previously validated isolated WordPress lane
        run: |
          mkdir -p proof
          cp -a runner/lanes/s01-frontend-design-20261017 lane
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 3dfed6124c5942460167d567783df0fcef06e816
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Verify exact candidate, ownership, CSS bundle and syntax
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(cat target/VERSION)" = 1.35.138
          grep -q '^Version: 1.35.138$' target/src/style.css
          python3 - <<'PY'
          import pathlib,subprocess,json
          p=pathlib.Path('target')
          base='c50ee8c5c24bbe75f2eeb67f04632f517f7ce86f'
          src='src/assets/css/public/pages/families/public-family-04-content-detail-reading-closure.css'
          bundle='src/assets/css/public/vf-theme-public-runtime.css'
          changed=subprocess.check_output(['git','-C','target','diff','--name-only',base,'HEAD'],text=True).splitlines()
          expected=['VERSION','src/style.css',src,bundle,'tests/guide-detail-readability-contract.php']
          assert sorted(changed)==sorted(expected),changed
          old_src=subprocess.check_output(['git','-C','target','show',base+':'+src])
          old_bundle=subprocess.check_output(['git','-C','target','show',base+':'+bundle])
          now_src=(p/src).read_bytes(); now_bundle=(p/bundle).read_bytes()
          assert old_bundle.count(old_src)==1
          assert now_bundle==old_bundle.replace(old_src,now_src,1),'unowned bundle mutation'
          assert now_src.count(b'.vf-reading-hero--guide .vf-family-eyebrow{')==1
          pathlib.Path('proof/guide-source.json').write_text(json.dumps({'status':'PASS','candidate':'3dfed6124c5942460167d567783df0fcef06e816','files':changed,'source_bundle':'BYTE_EXACT','unrelated_css':'BYTE_IDENTICAL'}))
          print('EXACT_SOURCE_BUNDLE_SCOPE=PASS')
          PY
          php -l target/tests/guide-detail-readability-contract.php
          php target/tests/guide-detail-readability-contract.php
          # The legacy synthetic hero stub lacks wp_strip_all_tags on current main.
          # Real hero semantics are tested below in full WordPress/Chromium, not falsely PASSed here.
          php target/tests/public-reading-final-owner-contract.php
          php -l lane/guide-detail-fixture.php
          node --check lane/r16-guide-detail.cjs
          find target/src -name '*.php' -print0 | xargs -0 -n1 php -l > /tmp/guide-php-lint.txt
      - name: Exact M3U8 plugin fixture read-only
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          mkdir -p provider
          gh release download v1.25.91 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.91.zip --dir provider
          echo 'fcb56d605550c5b04a3ff8b3b78b8bf86ca11b77e0aa22334fa67e675b01d6df  provider/vf-tools-m3u8_V1.25.91.zip' | sha256sum -c
      - name: Install browser runner
        run: |
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -g -fsSL --retry 2 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC[wght].ttf' -o "$HOME/.local/share/fonts/NotoSansSC.ttf"
          fc-cache -f
      - name: Isolated WordPress MariaDB bilingual Chromium functional and SEO verification
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          script=Path('lane/native.sh').read_text()
          seed='docker cp lane/snapshot.php "$WP:/tmp/snapshot.php"'
          assert script.count(seed)==1
          script=script.replace(seed,'docker cp lane/guide-detail-fixture.php "$WP:/tmp/guide-detail-fixture.php";cli eval-file /tmp/guide-detail-fixture.php > proof/guide-fixture.txt\n'+seed)
          end='cli eval-file /tmp/snapshot.php > proof/state-after.sha256'
          assert script.count(end)==1
          script=script.replace(end,'node lane/r16-guide-detail.cjs\nnode lane/r10-technical-head.cjs\n'+end)
          Path('lane/native-guide-detail.sh').write_text(script)
          PY
          bash lane/native-guide-detail.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guide-detail-v135138-proof-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Remove transient private theme and provider
        if: always()
        run: rm -rf target provider
