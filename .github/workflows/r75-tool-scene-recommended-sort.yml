name: R75 Focused Tool Scene Recommended Sort Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r75-tool-scene-recommended-sort.yml'

permissions:
  contents: read

jobs:
  r75-focused-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: 63de9cd5f0eccafb633b1573ea5fd84c3a8d1e7d
    steps:
      - name: Checkout exact private P01 candidate transiently
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: 63de9cd5f0eccafb633b1573ea5fd84c3a8d1e7d
          path: vf-start
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_sqlite,sqlite3,curl
          coverage: none

      - name: Exact source and focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd vf-start
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(cat VERSION)" = '2.47.0'
          php -l src/app/ToolSceneDetail.php
          php -l tests/unit/tool_scene_recommended_sort_contract.php
          php tests/unit/tool_scene_recommended_sort_contract.php
          php tests/unit/tool_scene_context_total_contract.php
          php tests/unit/tool_scene_facet_context_contract.php
          php tests/unit/default_sort_result_route_contract.php
          echo R75_TOOL_SCENE_RECOMMENDED_SORT_PASS
          echo R75_EXACT_CANDIDATE_GATE_PASS

      - name: Cleanup transient private source
        if: always()
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/vf-start"
