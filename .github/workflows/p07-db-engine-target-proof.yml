name: P07 DB engine target and migration pair exact-source proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-db-engine-target-proof.yml'
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.repository == 'llhzx2018/core-free-runner-public' && github.head_ref == 'test/p07-db-engine-target-20261029' && github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PRODUCT_SHA: 230c551e62a64f480cc5139dcdfad11b78e0eb81
    steps:
      - name: Check private read capability
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          test -n "$VF_PRIVATE_READ_TOKEN" || { echo P07_PRIVATE_READ_UNAVAILABLE; exit 78; }
      - name: Checkout exact private product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 230c551e62a64f480cc5139dcdfad11b78e0eb81
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p07-private
      - name: Proof of target endpoint, engine pair, conservative SQL and secrecy
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p07-private
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(cat BUILD_ID)" = "0.1.0-release103"
          bash -n bin/vfops-init-ui
          python3 -B -m py_compile lib/server_migration.py lib/server_migration_pull.py
          export PYTHONPATH="$PWD/lib:$PWD"
          for pattern in test_mariadb_owner_policy.py test_server_migration_pull.py test_sql_diff_command.py test_sql_diff_evidence.py test_cross_engine_sql_format.py test_secret_scan.py; do
            python3 -B -m unittest discover -s tests -p "$pattern" -v
          done
          python3 -B scripts/secret_scan.py --root .
          git diff --exit-code
          echo P07_DB_ENGINE_TARGET_EXACT_SOURCE_PASS
      - name: Real ephemeral MySQL 8.4 and MariaDB 11.8 round-trip (no VPS)
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p07-private
          fixture_dir="$(mktemp -d -p "$RUNNER_TEMP" p07-sql-fixture-XXXXXX)"
          trap 'docker rm -f p07-fixture-mysql84 p07-fixture-mariadb118 >/dev/null 2>&1 || true; rm -rf -- "$fixture_dir"' EXIT
          docker run --rm -d --network none --name p07-fixture-mysql84 -e MYSQL_ALLOW_EMPTY_PASSWORD=yes mysql:8.4 >/dev/null
          docker run --rm -d --network none --name p07-fixture-mariadb118 -e MARIADB_ALLOW_EMPTY_ROOT_PASSWORD=yes mariadb:11.8 >/dev/null
          for i in $(seq 1 90); do
            if docker exec p07-fixture-mysql84 mysql -uroot -N -e 'SELECT 1' >/dev/null 2>&1 && docker exec p07-fixture-mariadb118 mariadb -uroot -N -e 'SELECT 1' >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec p07-fixture-mysql84 mysql -uroot -N -e 'SELECT 1' >/dev/null
          docker exec p07-fixture-mariadb118 mariadb -uroot -N -e 'SELECT 1' >/dev/null
          for engine in mysql84 mariadb118; do
            if [[ "$engine" == mysql84 ]]; then server=p07-fixture-mysql84; cli=mysql; else server=p07-fixture-mariadb118; cli=mariadb; fi
            docker exec "$server" "$cli" -uroot -e "CREATE DATABASE vfops_fixture CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci; USE vfops_fixture; CREATE TABLE sample (id INT NOT NULL PRIMARY KEY, payload VARCHAR(64) NOT NULL); INSERT INTO sample VALUES (1, 'alpha'), (2, 'beta');"
          done
          docker exec p07-fixture-mysql84 mysqldump -uroot --single-transaction --skip-comments --skip-dump-date --set-gtid-purged=OFF vfops_fixture > "$fixture_dir/mysql-source.sql"
          docker exec p07-fixture-mariadb118 mariadb -uroot -e 'DROP DATABASE vfops_fixture; CREATE DATABASE vfops_fixture CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci'
          if ! docker exec -i p07-fixture-mariadb118 mariadb -uroot vfops_fixture < "$fixture_dir/mysql-source.sql" > "$fixture_dir/import-out" 2> "$fixture_dir/import-err"; then echo MYSQL_TO_MARIADB_IMPORT_BLOCKED; exit 31; fi
          docker exec p07-fixture-mariadb118 mariadb-dump -uroot --single-transaction --skip-comments --skip-dump-date vfops_fixture > "$fixture_dir/mariadb-result.sql"
          gzip -n -c "$fixture_dir/mysql-source.sql" > "$fixture_dir/mysql-source.sql.gz"
          gzip -n -c "$fixture_dir/mariadb-result.sql" > "$fixture_dir/mariadb-result.sql.gz"
          PYTHONPATH="$PWD/lib:$PWD" python3 -B -c 'import sys; from pathlib import Path; from server_migration_pull import compare_database_dumps; print("MYSQL_TO_MARIADB=" + compare_database_dumps(Path(sys.argv[1]), Path(sys.argv[2])))' "$fixture_dir/mysql-source.sql.gz" "$fixture_dir/mariadb-result.sql.gz"
          docker exec p07-fixture-mysql84 mysql -uroot -e 'DROP DATABASE vfops_fixture; CREATE DATABASE vfops_fixture CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci'
          if ! docker exec -i p07-fixture-mysql84 mysql -uroot vfops_fixture < "$fixture_dir/mariadb-result.sql" > "$fixture_dir/import-out" 2> "$fixture_dir/import-err"; then echo MARIADB_TO_MYSQL_IMPORT_BLOCKED; exit 32; fi
          docker exec p07-fixture-mysql84 mysqldump -uroot --single-transaction --skip-comments --skip-dump-date --set-gtid-purged=OFF vfops_fixture > "$fixture_dir/mysql-result.sql"
          gzip -n -c "$fixture_dir/mysql-result.sql" > "$fixture_dir/mysql-result.sql.gz"
          PYTHONPATH="$PWD/lib:$PWD" python3 -B -c 'import sys; from pathlib import Path; from server_migration_pull import compare_database_dumps; print("MARIADB_TO_MYSQL=" + compare_database_dumps(Path(sys.argv[1]), Path(sys.argv[2])))' "$fixture_dir/mariadb-result.sql.gz" "$fixture_dir/mysql-result.sql.gz"
          test "$(docker exec p07-fixture-mysql84 mysql -uroot -N -e 'SELECT COUNT(*), SUM(id) FROM vfops_fixture.sample')" =         if: always()
        shell: bash
        run: |
          rm -rf -- p07-private
          echo P07_PRIVATE_SOURCE_CLEANUP_PASS
2\t3'
          test "$(docker exec p07-fixture-mariadb118 mariadb -uroot -N -e 'SELECT COUNT(*), SUM(id) FROM vfops_fixture.sample')" =         if: always()
        shell: bash
        run: |
          rm -rf -- p07-private
          echo P07_PRIVATE_SOURCE_CLEANUP_PASS
2\t3'
          echo P07_REAL_ENGINES_BIDIRECTIONAL_FIXTURE_PASS

      - name: Remove private checkout
        if: always()
        shell: bash
        run: |
          rm -rf -- p07-private
          echo P07_PRIVATE_SOURCE_CLEANUP_PASS
