name: P07 DB engine target and migration pair exact-source proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-db-engine-target-proof.yml'
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.repository == 'llhzx2018/core-free-runner-public' && github.head_ref == 'test/p07-db-engine-target-20261029' && github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PRODUCT_SHA: 851b2921239fd302e70fa7a6d1d000098ffef7ff
    steps:
      - name: Check private read capability
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          test -n "$VF_PRIVATE_READ_TOKEN" || { echo P07_PRIVATE_READ_UNAVAILABLE; exit 78; }
      - name: Checkout exact private product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 851b2921239fd302e70fa7a6d1d000098ffef7ff
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p07-private
      - name: Proof of target endpoint, engine pair, conservative SQL and secrecy
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p07-private
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(cat BUILD_ID)" = "0.1.0-release103"
          bash -n bin/vfops-init-ui
          python3 -B -m py_compile lib/server_migration.py lib/server_migration_pull.py
          export PYTHONPATH="$PWD/lib:$PWD"
          for pattern in test_mariadb_owner_policy.py test_server_migration_pull.py test_sql_diff_command.py test_sql_diff_evidence.py test_cross_engine_sql_format.py test_secret_scan.py; do
            python3 -B -m unittest discover -s tests -p "$pattern" -v
          done
          python3 -B scripts/secret_scan.py --root .
          git diff --exit-code
          echo P07_DB_ENGINE_TARGET_EXACT_SOURCE_PASS
      - name: Remove private checkout
        if: always()
        shell: bash
        run: |
          rm -rf -- p07-private
          echo P07_PRIVATE_SOURCE_CLEANUP_PASS
