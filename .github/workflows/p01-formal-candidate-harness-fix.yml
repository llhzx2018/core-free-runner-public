name: P01 Formal Candidate Harness Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p01-formal-candidate-harness-fix.yml'
      - 'requests/p01-formal-candidate-harness-fix-*.txt'

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Require unified write credential
        shell: bash
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$WRITE_TOKEN" || exit 79
          echo 'VF_RELEASE_WRITE_TOKEN_PRESENT=YES'

      - name: Checkout runner repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: main
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply two exact harness fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/p01-v2.21.15-formal-candidate.yml')
          s=p.read_text(encoding='utf-8')
          old1='''          test "$(git -C candidate diff --name-only "$PRODUCTION"...HEAD | grep -c '^src/browser-extension/' || true)" = '0'\n'''
          new1='''          diff -qr candidate/src/browser-extension production/src/browser-extension >/dev/null\n'''
          old2='''          sha256sum -c dist/SHA256SUMS.txt\n'''
          new2='''          (cd dist && sha256sum -c SHA256SUMS.txt)\n'''
          for old,new,label in [(old1,new1,'extension-proof'),(old2,new2,'sha-working-directory')]:
              count=s.count(old)
              if count!=1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8',newline='\n')
          PY
          git diff --check -- .github/workflows/p01-v2.21.15-formal-candidate.yml
          grep -Fq 'diff -qr candidate/src/browser-extension production/src/browser-extension' .github/workflows/p01-v2.21.15-formal-candidate.yml
          grep -Fq '(cd dist && sha256sum -c SHA256SUMS.txt)' .github/workflows/p01-v2.21.15-formal-candidate.yml
          echo 'FORMAL_CANDIDATE_HARNESS_FIX=PASS'

      - name: Commit harness fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'VF Release Automation'
          git config user.email 'vf-release-automation@users.noreply.github.com'
          git add .github/workflows/p01-v2.21.15-formal-candidate.yml
          git commit -m 'ci(p01): fix formal candidate harness paths'
          git push origin HEAD:main
          echo "HARNESS_FIX_COMMIT=$(git rev-parse HEAD)"
