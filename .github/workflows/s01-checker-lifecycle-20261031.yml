name: S01 checker candidate native upgrade and rollback
on:
  push:
    branches: [task/s01-checker-current-proof-20261031]
    paths: ['.github/workflows/s01-checker-lifecycle-20261031.yml']
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 02d4591eed025a3d3a67bc0a150b3ddc448c2ab8
          persist-credentials: false
          path: established
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7a0fe3c12137bdeab82ddcd79d2deffed96c35dd
          persist-credentials: false
          path: prior
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 34e13cac53888a8eb4c1dbe6fcd36ef9a68c86fd
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
      - name: Build candidate and verify native lifecycle
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider
          test "$(git -C target rev-parse HEAD)" = 34e13cac53888a8eb4c1dbe6fcd36ef9a68c86fd
          test "$(git -C target rev-parse 'HEAD^{tree}')" = 7682d3e4115b12f7f0f13a114426303cb4f6672c
          test "$(cat target/VERSION)" = 1.35.222
          gh release download v1.35.221 --repo llhzx2018/vf-tools-theme --pattern vf-tools-theme_V1.35.221.zip --dir provider
          echo '3df90085f637b76fab0bc831ec66dc4779656a8b4e85180e5d9ec06f4a3b1503  provider/vf-tools-theme_V1.35.221.zip' | sha256sum -c
          gh release download v1.25.97 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.97.zip --dir provider
          echo 'd84279b9527f5da7ae43f05759dfb8288f5a07e63e481c84253e507458ad485f  provider/vf-tools-m3u8_V1.25.97.zip' | sha256sum -c
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          cp -a established/lanes/s01-frontend-design-20261017 lane
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,zipfile,io,json
          src=Path('target/src')
          def build():
            b=io.BytesIO()
            with zipfile.ZipFile(b,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(x for x in src.rglob('*') if x.is_file()):
                assert not p.is_symlink()
                q=zipfile.ZipInfo('vf-tools-theme/'+p.relative_to(src).as_posix(),date_time=(1980,1,1,0,0,0));q.compress_type=zipfile.ZIP_DEFLATED;q.external_attr=0o100644<<16
                z.writestr(q,p.read_bytes())
            return b.getvalue()
          b=build();assert b==build()
          p=Path('provider/vf-tools-theme_V1.35.222.zip');p.write_bytes(b)
          with zipfile.ZipFile(p) as z:
            assert z.testzip() is None
            files=sum(not x.is_dir() for x in z.infolist())
          Path('proof/candidate-package-proof.json').write_text(json.dumps({'version':'1.35.222','sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b),'files':files,'source':'34e13cac53888a8eb4c1dbe6fcd36ef9a68c86fd'},indent=2))
          print(Path('proof/candidate-package-proof.json').read_text())
          s=Path('prior/lanes/s01-converter-i18n-proof/converter-only-lifecycle.sh').read_text()
          s=s.replace('control/lanes/s01-converter-i18n-proof/plugin-snapshot.php','prior/lanes/s01-converter-i18n-proof/plugin-snapshot.php')
          s=s.replace('node control/lanes/s01-converter-i18n-proof/check.cjs','echo BROWSER_TEST_SEPARATE_EXACT_SOURCE')
          s=s.replace('1.35.220','1.35.222').replace('1.25.96','1.25.97')
          s=s.replace('cli theme install /tmp/vf-tools-theme_V1.35.222.zip >/dev/null','cli theme install /tmp/vf-tools-theme_V1.35.221.zip >/dev/null',1)
          s=s.replace('tv 1.35.222; pv 1.25.97','tv 1.35.221; pv 1.25.97\ncli theme install /tmp/vf-tools-theme_V1.35.222.zip --force >/dev/null; tv 1.35.222',1)
          s=s.replace('for old in 1.35.219 1.35.216;', 'for old in 1.35.221;')
          s=s.replace('for old in 1.25.95 1.25.94;', 'for old in;')
          Path('/tmp/checker-lifecycle.sh').write_text(s)
          PY
          bash /tmp/checker-lifecycle.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checker-lifecycle-${{ github.run_id }}
          path: proof/
          retention-days: 7
