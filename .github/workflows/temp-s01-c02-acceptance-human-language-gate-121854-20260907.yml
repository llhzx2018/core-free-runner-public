name: S01-C02 Ops 1.21.854 Acceptance Human Language Gate

on:
  push:
    branches: [temp/s01-c02-acceptance-human-language-gate-121854-20260907]
    paths:
      - '.github/workflows/temp-s01-c02-acceptance-human-language-gate-121854-20260907.yml'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      OPS_BASE: c20aaaa0d80a20d103c337babe50bd65d110d154
      OPS_HEAD: 9f9b8889d2e8067f4113b49462b0c1a5d4124554
    steps:
      - name: Credential boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo 'RELEASE_WRITE_USED=NO'
          echo 'PRODUCTION_WRITE_USED=NO'

      - name: Checkout exact Ops candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.OPS_HEAD }}
          token: ${{ env.READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops

      - name: Exact source and six-file fence
        shell: bash
        run: |
          set -Eeuo pipefail
          cd ops
          test "$(git rev-parse HEAD)" = "$OPS_HEAD"
          git cat-file -e "$OPS_BASE^{commit}"
          git diff --name-only "$OPS_BASE..$OPS_HEAD" | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          VERSION
          includes/views/admin-ai-report-shell.php
          tests/admin-human-language-contract.php
          tests/update-refresh-policy-current-contract.php
          tests/visible-console-v2-contract.php
          vf-ops.php
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          echo 'EXACT_SIX_FILE_FENCE=PASS'

      - name: Full PHP syntax gate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd ops
          find . -type f -name '*.php' -not -path '*/.git/*' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
          tail -n 20 /tmp/php-lint.log
          echo 'FULL_PHP_LINT=PASS'

      - name: Human admin language contract
        shell: bash
        run: |
          set -Eeuo pipefail
          cd ops
          php tests/admin-human-language-contract.php

      - name: Update policy regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd ops
          php tests/update-refresh-policy-current-contract.php

      - name: Visible Console V2 regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd ops
          php tests/visible-console-v2-contract.php

      - name: Acceptance behavior boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          cd ops
          test "$(tr -d '\r\n' < VERSION)" = '1.21.854'
          grep -Fq "VF_OPS_ROUND', 'S01-ACCEPTANCE-HUMAN-LANGUAGE'" vf-ops.php
          f='includes/views/admin-ai-report-shell.php'
          grep -Fq "['RUNNING', 'CANCEL_REQUESTED']" "$f"
          grep -Fq "vf_ops_one_click_acceptance" "$f"
          grep -Fq "vf_ops_reset_acceptance_report" "$f"
          grep -Fq "vf_ops_source_scan_mode" "$f"
          grep -Fq "vf_source_view" "$f"
          grep -Fq "'quick'" "$f"
          grep -Fq "'deep'" "$f"
          grep -Fq "function_exists('vf_ops_render_online_acceptance_workspace_v121371')" "$f"
          ! git diff --name-only "$OPS_BASE..$OPS_HEAD" | grep -E '(^|/)(assets/css|includes/wp-update|includes/site-release|schema|migration|database)'
          echo 'ACCEPTANCE_BEHAVIOR_BOUNDARY=PASS'
          echo 'NO_SCHEMA_MIGRATION_UPDATE_PROTOCOL_DELTA=PASS'
          echo 'S01_C02_121854_ACCEPTANCE_HUMAN_LANGUAGE_GATE=PASS'
