name: P07 System Care RC12 Zero Attention Gate

on:
  push:
    branches: [gate/p07-system-care-rc12-zero-attention-20260908]
    paths:
      - '.github/workflows/p07-system-care-rc12-zero-attention-gate.yml'

permissions:
  contents: read

jobs:
  rc12:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact RC12 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 30d7e55582fa94f419c2d74bface117896751c9e
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: product
          persist-credentials: false
          fetch-depth: 1

      - name: Exact identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = 30d7e55582fa94f419c2d74bface117896751c9e
          test "$(cat product/modules/system-care/VERSION)" = 0.1.0-rc12
          echo P07_SYSTEM_CARE_RC12_EXACT_SOURCE=PASS

      - name: Syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n product/modules/system-care/vf-system-care.sh
          bash -n product/modules/system-care/audit.sh
          bash -n product/modules/system-care/security-audit.sh
          bash -n product/modules/system-care/intrusion-evidence-entry.sh
          bash -n product/modules/system-care/tests/rc12_zero_attention_gate.sh
          python3 -m py_compile \
            product/modules/system-care/lib/intrusion_scan.py \
            product/modules/system-care/lib/intrusion_discovery.py \
            product/modules/system-care/lib/intrusion_evidence.py \
            product/modules/system-care/lib/intrusion_state.py \
            product/modules/system-care/lib/intrusion_logs.py
          echo P07_SYSTEM_CARE_RC12_SYNTAX=PASS

      - name: Static gate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          bash modules/system-care/tests/static_gate.sh

      - name: Full functional regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          bash modules/system-care/tests/functional_gate.sh

      - name: Final
        shell: bash
        run: echo P07_SYSTEM_CARE_RC12_ZERO_ATTENTION_MACHINE_GATE=PASS
