name: TEMP S01-C02 1.21.924 Distribution Proof

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  exact-distribution-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UPDATES_SHA: de34faaa7d1c51b45f68e24fe7eca4c06aaf5bcb
      PRODUCT_REPO: llhzx2018/vf-tools-ops
      TAG: v1.21.924
      ASSET: vf-tools-ops_V1.21.924.zip

    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: de34faaa7d1c51b45f68e24fe7eca4c06aaf5bcb
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: updates
          persist-credentials: false

      - name: Assert exact distribution source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C updates rev-parse HEAD)" = "$UPDATES_SHA"
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("updates/projects/S01-C02.json").read_text())
          assert m["target_version"]=="1.21.924"
          assert m["release_tag"]=="v1.21.924"
          assert m["asset_name"]=="vf-tools-ops_V1.21.924.zip"
          assert m["asset_bytes"]==3496097
          assert m["asset_sha256"]=="ed6d16015284e402cd3972425125d4a07f35d893fb47e94fdea7511a894b200f"
          assert m["runtime_files"]==976
          assert m["runtime_fingerprint"]=="41ad6ce14b917fe06de15ae802f3c82d8dc959922b222ea5fabb4215dce575eb"
          assert "1.21.923" in m["from_versions"]
          assert m["schema_from"]=="6.0.0" and m["schema_to"]=="6.0.0"
          assert m["backup_required"] is True and m["rollback_supported"] is True
          print("S01-C02 1.21.924 manifest identity PASS")
          PY

      - name: Manifest contract audit
        shell: bash
        working-directory: updates
        run: python3 scripts/check_manifest_contract.py

      - name: PHP syntax and Update Core regression
        shell: bash
        working-directory: updates
        run: |
          set -euo pipefail
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php

      - name: Formal release remote readback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          JSON="$(gh api "repos/$PRODUCT_REPO/releases/tags/$TAG")"
          test "$(jq -r '.target_commitish' <<<"$JSON")" = "f3e4cdd9203a300e910040a6607f645c011a4373"
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.size' <<<"$JSON")" = "3496097"
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.digest' <<<"$JSON")" = "sha256:ed6d16015284e402cd3972425125d4a07f35d893fb47e94fdea7511a894b200f"
          echo "S01-C02 1.21.924 Distribution exact-source proof PASS"

      - name: Remove transient checkout
        if: always()
        shell: bash
        run: rm -rf updates

# synchronize distribution proof
