name: P08 v015 final business modules post-release isolated acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p08-v015-final-business-acceptance.yml
      - tests/p08_v015_business_nine_tabs_browser.spec.ts
      - lanes/p08-v015-final-business-acceptance-20261121.json
permissions:
  contents: read
jobs:
  p08-final-business-acceptance:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-v015-final-business-acceptance-20261121' && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TARGET_REPO: llhzx2018/vf-adops
      TARGET_VERSION: '0.1.15'
      TARGET_SHA: 369fcb0aa8fef71b0a2b79c2b7a6c473d2527c3e
      TARGET_TREE: 5d3fa9d901a699815e826065f3f27a83afb9ad9f
      P08_ISOLATED_INSTALL_TEST: 'YES'
      P08_TEST_BASE_URL: http://127.0.0.1:18080
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      DB_CONNECTION: sqlite
      SESSION_DRIVER: file
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout ephemeral public-safe harness (no tokens)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Audit exact source against immutable one-off lane spec
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B runner/scripts/ephemeral_lane_spec.py validate --spec runner/lanes/p08-v015-final-business-acceptance-20261121.json
          python3 -B runner/scripts/ephemeral_lane_spec.py audit-rendered --spec runner/lanes/p08-v015-final-business-acceptance-20261121.json --input runner/.github/workflows/p08-v015-final-business-acceptance.yml
      - name: Checkout immutable officially issued P08 v015 private source (transient)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 369fcb0aa8fef71b0a2b79c2b7a6c473d2527c3e
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
      - name: PHP 8.4 and Composer with browser dependencies
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip,curl,mbstring,pdo_sqlite,sqlite3,pdo_mysql,openssl,posix,dom,intl,fileinfo,gd
          tools: composer:v2
          coverage: none
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked synthetic source dependencies and validate no Production endpoints
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse 'HEAD^{tree}')" = "$TARGET_TREE"
          test "$(cat target/VERSION)" = '0.1.15'
          test "$APP_URL" = 'http://localhost'
          mkdir -p target/storage/framework/cache/data target/storage/framework/sessions target/storage/framework/views target/storage/logs target/bootstrap/cache
          ! env | grep -E '^P08_TEST_BASE_URL=https?://adops\.' >/dev/null
          composer --working-dir=target install --no-scripts --no-interaction --no-progress --prefer-dist --optimize-autoloader
          npm ci --prefix target --ignore-scripts --no-audit --no-fund
          npm run typecheck --prefix target
          npm run build --prefix target
          echo P08_V015_ISOLATED_EXACT_SOURCE_LOCKED_BUILD=PASS
      - name: Reuse exact-source prior Feature/core/Vitest results with honest FAIL classification
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          echo P08_V015_PHP_CURRENT_FEATURE_53_TESTS_ONE_AUTOMATION_CLOCK_FIXTURE_FAIL=NOT_PASS
          echo P08_V015_PHP_CORE_62_AND_VITEST_33=PASS_PRIOR_RUN_44875973911
          echo P08_V015_LEGACY_VERSION_012_FEATURE_TESTS=EXCLUDED_NOT_PASS
      - name: Create disposable local-only Laravel owner and native SQLite runtime (never Production)
        shell: bash
        run: |
          set -Eeuo pipefail
          export APP_ENV=local
          export APP_URL=http://127.0.0.1:18080
          echo 'APP_ENV=local' >> "$GITHUB_ENV"
          echo 'APP_URL=http://127.0.0.1:18080' >> "$GITHUB_ENV"
          tmp="$RUNNER_TEMP/p08-business-closure"
          mkdir -m 700 "$tmp"
          touch "$tmp/workspace.sqlite"
          export DB_DATABASE="$tmp/workspace.sqlite"
          export APP_KEY="base64:$(python3 - <<'PY'
          import base64
          print(base64.b64encode(b'P08_Final_Closure_Synthetic_Key_').decode())
          PY
          )"
          echo "DB_DATABASE=$DB_DATABASE" >> "$GITHUB_ENV"
          echo "APP_KEY=$APP_KEY" >> "$GITHUB_ENV"
          cd target
          mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
          php artisan migrate --force
          php -r 'require "vendor/autoload.php";$app=require "bootstrap/app.php";$app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();\App\Models\User::query()->create(["name"=>"P08 Synthetic Owner","email"=>"owner@isolated.example","password"=>"Synthetic-SQLite-Owner-12345!"]);'
          php artisan serve --host=127.0.0.1 --port=18080 > "$tmp/server.log" 2>&1 &
          echo $! > "$tmp/server.pid"
          for i in $(seq 1 50); do
            if curl -fsS -o /dev/null http://127.0.0.1:18080/login; then break; fi
            sleep 0.4
          done
          curl -fsS -o /dev/null http://127.0.0.1:18080/login
          echo P08_V015_ISOLATED_OWNER_DB_BOOT_AND_LOCAL_LOGIN=PASS
      - name: Real Chromium login and all 9 navigation sections at 390 768 1440
        shell: bash
        run: |
          set -Eeuo pipefail
          cd target
          npx playwright install --with-deps chromium
          cp ../runner/tests/p08_v015_business_nine_tabs_browser.spec.ts tests/e2e/p08_v015_business_nine_tabs_browser.spec.ts
          npx playwright test tests/e2e/p08_v015_business_nine_tabs_browser.spec.ts --workers=1 --reporter=line
          rm -f tests/e2e/p08_v015_business_nine_tabs_browser.spec.ts
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          echo P08_V015_BUSINESS_9_SECTION_CHROMIUM_RESPONSIVE_GATE=PASS
      - name: Verify synthetic business rows were not created by passive navigation
        shell: bash
        run: |
          set -Eeuo pipefail
          cd target
          php -r 'require "vendor/autoload.php";$app=require "bootstrap/app.php";$app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();foreach(["landing_pages","static_bundles","domain_records","tracker_connections","ad_channel_connections","automation_rules"] as $t){if(\Illuminate\Support\Facades\DB::table($t)->count()!==0){fwrite(STDERR,"P08_SYNTHETIC_UNEXPECTED_PASSIVE_BUSINESS_WRITE\n");exit(21);}}echo "P08_V015_NO_PASSIVE_BUSINESS_DB_WRITES=PASS\n";'
      - name: Strictly label browser acceptance without hiding prior Feature failure
        shell: bash
        run: |
          set -Eeuo pipefail
          echo P08_V015_BUSINESS_9_TAB_BROWSER_AND_PASSIVE_DB=PASS
          echo P08_V015_FULL_BUSINESS_ACCEPTANCE=NOT_CLOSED_FEATURE_CLOCK_FIXTURE_AND_PRODUCTION_EVIDENCE
      - name: Destroy disposable isolated source DB sessions and logs
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/p08-business-closure/server.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/p08-business-closure/server.pid")" 2>/dev/null || true
          fi
          rm -rf -- target runner "$RUNNER_TEMP/p08-business-closure"
          test ! -e target && test ! -e runner
          echo P08_V015_FINAL_BUSINESS_PRIVATE_CLEANUP=PASS
