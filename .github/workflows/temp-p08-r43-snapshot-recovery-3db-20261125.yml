name: TEMP P08 R43 three DB interrupted snapshot independent recovery
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p08-r43-snapshot-recovery-3db-20261125.yml'
permissions:
  contents: read
concurrency:
  group: p08-r43-snapshot-recovery-3db-20261125
  cancel-in-progress: false
env:
  TARGET_REPO: llhzx2018/vf-adops
  TARGET_VERSION: '0.1.18'
  TARGET_SHA: 06008137bdb58f901af8c2c3574455c6f03f2d76
jobs:
  identity-preflight:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/p08-r43-snapshot-recovery-3db-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Pin one exact candidate to this public machine probe
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ephemeral_lane_spec.py audit-rendered --spec specs/ephemeral/p08-r43-snapshot-recovery-3db-20261125.json --input .github/workflows/temp-p08-r43-snapshot-recovery-3db-20261125.yml
          echo P08_R43_CLEAN_FULL_EXACT_SOURCE_PREFLIGHT=PASS
  real-v018-clean-full:
    needs: identity-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        engine: [sqlite, mysql, mariadb]
    services:
      sql:
        image: ${{ matrix.engine == 'mariadb' && 'mariadb:11.8' || 'mysql:8.4' }}
        env:
          MYSQL_ROOT_PASSWORD: p08_r43_disposable_only_2026
          MYSQL_DATABASE: p08_r43_new_main
        ports:
          - 3306:3306
        options: >-
          --health-cmd="sh -c 'mariadb-admin ping --silent || mysqladmin ping --silent'"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      GITHUB_ACTIONS: 'true'
      CI: 'true'
      P08_R43_DISPOSABLE_SCHEMA: 'YES'
      P08_ISOLATED_INSTALL_TEST: 'YES'
      P08_R43_ENGINE: ${{ matrix.engine }}
      P08_R43_DB_HOST: '127.0.0.1'
      P08_R43_DB_NAME: p08_r43_new_main
      P08_R43_DB_USER: root
      P08_R43_DB_PASSWORD: p08_r43_disposable_only_2026
      P08_TEST_BASE_URL: https://127.0.0.1:18443
      APP_URL: https://127.0.0.1:18443
    steps:
      - name: Temporary checkout exact private P08 commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 06008137bdb58f901af8c2c3574455c6f03f2d76
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-p08
      - name: Temporary canonical GOV public applicability
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: gov-proof
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: pdo_sqlite, sqlite3, pdo_mysql, zip, mbstring, intl, bcmath, dom, fileinfo
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build exact-source PHP and Vue production dependencies
        shell: bash
        working-directory: private-p08
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git rev-parse HEAD)" = "$TARGET_SHA" && test "$(cat VERSION)" = "$TARGET_VERSION"
          php -l tests/native/r43_clean_full_three_engines.php > /dev/null
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          composer install --no-scripts --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/p08-r43-clean-composer.log" 2>&1 || { echo P08_R43_CLEAN_FULL_COMPOSER=FAIL; exit 1; }
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-r43-clean-npm.log" 2>&1 || { echo P08_R43_CLEAN_FULL_NPM=FAIL; exit 1; }
          npm run build > "$RUNNER_TEMP/p08-r43-clean-vite.log" 2>&1 || { echo P08_R43_CLEAN_FULL_VITE=FAIL; exit 1; }
          composer install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/p08-r43-clean-prod.log" 2>&1 || { echo P08_R43_CLEAN_FULL_VENDOR=FAIL; exit 1; }
          test -z "$(git status --porcelain --untracked-files=all)" || { echo P08_R43_CLEAN_FULL_GIT_DIRTY=STOP; exit 1; }
          echo P08_R43_CLEAN_FULL_PHP_VUE_GIT_SOURCE_CLEAN=PASS
      - name: Build true complete schema-v018 DEV FULL under canonical GOV rules
        shell: bash
        working-directory: private-p08
        run: |
          set -Eeuo pipefail
          set +x
          PYTHONDONTWRITEBYTECODE=1 python3 -B scripts/build_full.py --source . --output "$RUNNER_TEMP/p08-r43-clean-full.zip" --version "$TARGET_VERSION" --source-sha "$TARGET_SHA" --governance-root "$GITHUB_WORKSPACE/gov-proof" > "$RUNNER_TEMP/p08-r43-clean-full-build.log" 2>&1 || {
            grep -oE 'CONTRACT_REASON=[A-Z0-9_]+' "$RUNNER_TEMP/p08-r43-clean-full-build.log" | head -1 || true
            echo P08_R43_CLEAN_FULL_CANONICAL_GATE=FAIL
            exit 1
          }
          unzip -p "$RUNNER_TEMP/p08-r43-clean-full.zip" FULL_MANIFEST.json | python3 -B -c 'import json,sys,os;m=json.load(sys.stdin); assert m["source_sha"]==os.environ["TARGET_SHA"] and m["target_version"]=="0.1.18" and m["type"]=="CLEAN_FULL_ONLY" and m["data_included"] is False'
          echo P08_R43_DEV_FULL_STRUCTURAL_AND_SHA=PASS
      - name: Extract complete FULL to a pristine disposable Owner installation directory
        shell: bash
        working-directory: private-p08
        run: |
          set -Eeuo pipefail
          set +x
          site="$RUNNER_TEMP/p08-r43-clean-full-$P08_R43_ENGINE"
          test ! -e "$site"
          mkdir -m 700 "$site"
          unzip -q "$RUNNER_TEMP/p08-r43-clean-full.zip" -d "$site"
          test -f "$site/vendor/autoload.php"
          php -r 'require $argv[1]."/vendor/autoload.php"; VF\AdOps\Installation\SetupGuard::package($argv[1]);' "$site" > "$RUNNER_TEMP/p08-r43-clean-full-extracted-verify.log" 2>&1 || { echo P08_R43_CLEAN_FULL_EXTRACT_VERIFICATION=FAIL; exit 1; }
          echo P08_R43_REAL_UNPACKED_018_FULL=PASS
      - name: Actual v0.1.18 Owner first install, 23 migrations, genuine 3DB, reinstall refusal
        shell: bash
        working-directory: private-p08
        run: |
          set -Eeuo pipefail
          set +x
          if php tests/native/r43_clean_full_three_engines.php > "$RUNNER_TEMP/p08-r43-clean-full-owner.log" 2>&1; then
            grep -E '^P08_R43_REAL_018_[A-Za-z_0-9]+=(PASS|PASS_NOT_INSTALLABLE)$' "$RUNNER_TEMP/p08-r43-clean-full-owner.log" | tail -5
            echo P08_R43_REAL_CLEAN_FULL_NATIVE_OWNER=PASS
          else
            grep -oE 'R43_CLEAN_FULL_[A-Z0-9_]+|Uncaught [A-Za-z_]+|Fatal error' "$RUNNER_TEMP/p08-r43-clean-full-owner.log" | head -6 || true
            echo P08_R43_REAL_CLEAN_FULL_NATIVE_OWNER=FAIL
            exit 1
          fi
      - name: Native three-engine backup and restore clients
        if: matrix.engine != 'sqlite'
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq > "$RUNNER_TEMP/p08-r43-native-apt.log" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mariadb-client >> "$RUNNER_TEMP/p08-r43-native-apt.log" 2>&1
          command -v mariadb-dump
          command -v mariadb
          echo P08_R43_NEW_FULL_NATIVE_SQL_CLIENT_READY=PASS
      - name: Genuine installed-site backup through canonical native and private snapshot services
        shell: bash
        working-directory: private-p08
        run: |
          set -Eeuo pipefail
          set +x
          php -l tests/native/r43_clean_full_snapshot_restore.php >/dev/null
          if php tests/native/r43_clean_full_snapshot_restore.php > "$RUNNER_TEMP/p08-r43-new-full-restore.log" 2>&1; then
            grep -E '^P08_R43_REAL_018_[A-Za-z0-9_]+=(PASS|PASS_NOT_INSTALLABLE)$' "$RUNNER_TEMP/p08-r43-new-full-restore.log" | tail -8
            echo P08_R43_NEW_FULL_NATIVE_PRIVATE_RESTORE=PASS
          else
            grep -oE 'R43_FRESH_BACKUP_[A-Z0-9_]+|RECOVERY_[A-Z0-9_]+|R38_[A-Z0-9_]+|ADOPS_[A-Z0-9_]+' "$RUNNER_TEMP/p08-r43-new-full-restore.log" | head -6 || true
            echo P08_R43_NEW_FULL_NATIVE_PRIVATE_RESTORE=FAIL
            exit 1
          fi
      - name: Real corrupt native backups plus SIGKILL child fail-closed on native installed FULL
        shell: bash
        working-directory: private-p08
        run: |
          set -Eeuo pipefail
          set +x
          php -l tests/native/r43_clean_full_fault_matrix.php > /dev/null
          if php tests/native/r43_clean_full_fault_matrix.php > "$RUNNER_TEMP/p08-r43-fault-matrix.log" 2>&1; then
            grep '^P08_R43_NEW_FULL_' "$RUNNER_TEMP/p08-r43-fault-matrix.log" | tail -8
            echo P08_R43_REAL_018_3DB_SIGKILL_AND_CORRUPTION_FAIL_CLOSED=PASS
          else
            grep -oE 'R43_FAULT_[A-Z0-9_]+|RECOVERY_[A-Z0-9_]+|ADOPS_[A-Z0-9_]+' "$RUNNER_TEMP/p08-r43-fault-matrix.log" | head -8 || true
            echo P08_R43_REAL_018_3DB_SIGKILL_AND_CORRUPTION_FAIL_CLOSED=FAIL
            exit 1
          fi
      - name: Separate PHP process explicitly recovers ONLY verified snapshot-only crash
        shell: bash
        working-directory: private-p08
        env:
          P08_R43_SNAPSHOT_RECOVERY_AUTH: 'YES'
        run: |
          set -Eeuo pipefail
          set +x
          php -l src/Recovery/InterruptedSnapshotOnlyRecovery.php > /dev/null
          php -l tests/native/r43_snapshot_only_independent_recovery.php > /dev/null
          if php -d display_errors=Off -r 'try { require $argv[1]; } catch (Throwable $e) { $m=$e->getMessage(); if (!preg_match("/^(R43_|P08_|ADOPS_|RECOVERY_)[A-Z0-9_]+$/D",$m)) $m="OTHER"; echo "P08_R43_RECOVERY_ERROR_CODE=".$m.PHP_EOL; exit(1); }' tests/native/r43_snapshot_only_independent_recovery.php > "$RUNNER_TEMP/p08-r43-recovery-result.log" 2>&1; then
            grep '^P08_R43_SNAPSHOT_RECOVERY_' "$RUNNER_TEMP/p08-r43-recovery-result.log" | tail -9
            echo P08_R43_SNAPSHOT_ONLY_FRESH_PROCESS_RECOVERY_3DB=PASS
          else
            grep -E '^P08_R43_RECOVERY_ERROR_CODE=(R43_|P08_|ADOPS_|RECOVERY_)[A-Z0-9_]+
            echo P08_R43_SNAPSHOT_ONLY_FRESH_PROCESS_RECOVERY_3DB=FAIL
            exit 1
          fi
      - name: Destroy private source and every extracted synthetic install
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- private-p08 gov-proof
          rm -rf -- "$RUNNER_TEMP"/p08-r43-clean-* "$RUNNER_TEMP"/p08-r43-independent-private-* "$RUNNER_TEMP"/p08-r43-bad-private-* "$RUNNER_TEMP"/p08-r43-snapshot-recovery-* "$RUNNER_TEMP"/p08-r43-recovery-result.log
          test ! -e private-p08 && test ! -e gov-proof
          echo P08_R43_CLEAN_FULL_PRIVATE_AND_OWNER_CLEANUP=PASS
 "$RUNNER_TEMP/p08-r43-recovery-result.log" | head -3 || true
            echo P08_R43_SNAPSHOT_ONLY_FRESH_PROCESS_RECOVERY_3DB=FAIL
            exit 1
          fi
      - name: Destroy private source and every extracted synthetic install
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- private-p08 gov-proof
          rm -rf -- "$RUNNER_TEMP"/p08-r43-clean-* "$RUNNER_TEMP"/p08-r43-independent-private-* "$RUNNER_TEMP"/p08-r43-bad-private-* "$RUNNER_TEMP"/p08-r43-snapshot-recovery-* "$RUNNER_TEMP"/p08-r43-recovery-result.log
          test ! -e private-p08 && test ! -e gov-proof
          echo P08_R43_CLEAN_FULL_PRIVATE_AND_OWNER_CLEANUP=PASS
