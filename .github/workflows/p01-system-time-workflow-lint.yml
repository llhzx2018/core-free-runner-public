name: P01 System Time Workflow Lint

on:
  push:
    branches:
      - vf-agent-operations-v1
    paths:
      - '.github/workflows/p01-system-time-workflow-lint.yml'
      - '.github/workflows/p01-system-time-display-patch.yml'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout runner repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
      - name: Lint target workflow
        shell: bash
        run: |
          set -euo pipefail
          ./actionlint -color .github/workflows/p01-system-time-display-patch.yml
          echo WORKFLOW_LINT_PASS
