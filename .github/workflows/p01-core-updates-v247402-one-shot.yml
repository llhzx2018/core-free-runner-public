name: P01 Core Updates V2.47.402 One-Time Manifest Verification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-core-updates-v247402-one-shot.yml'

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Bind private distribution exact source without publishing
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          WORK="$RUNNER_TEMP/p01-core-updates-v247402"
          mkdir -p "$WORK"
          chmod 700 "$WORK"
          echo "P01_DIST_WORK=$WORK" >> "$GITHUB_ENV"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/core-updates.git" "$WORK/source"
          git -C "$WORK/source" checkout -q --detach 0f59ee66151b7942d8ab9d6acc9a5aa3728b598d
          git -C "$WORK/source" remote set-url origin https://github.com/llhzx2018/core-updates.git
          test "$(git -C "$WORK/source" rev-parse HEAD)" = "0f59ee66151b7942d8ab9d6acc9a5aa3728b598d"
          echo P01_CORE_UPDATES_EXACT_SOURCE=PASS

      - name: Full existing distribution contract and PHP native tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$P01_DIST_WORK/source"
          python3 scripts/check_manifest_contract.py
          php -v
          find update-core/php -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          php update-core/php/tests/run.php
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('projects/P01.json').read_text())
          assert x['schema_version']=='1.0'
          assert x['project_id']=='P01'
          assert x['current_version']=='2.47.401'
          assert x['target_version']=='2.47.402'
          assert x['from_versions']==['2.47.401']
          assert x['release_tag']=='v2.47.402'
          assert x['release_id']==419262570
          assert x['product_identity']=='545406b1d7179e699c2d4210e0dcba6a086355e4'
          assert x['asset_name']=='VF_Start_V2.47.402_UPDATE.zip'
          assert x['asset_bytes']==2615715
          assert x['asset_sha256']=='70382c590632a467f1e36ec131c8f84347a68857e8527eff6904641ee08b8364'
          assert x['schema_from']==x['schema_to']=='2026090401'
          assert x['update_type']=='ATOMIC'
          print('P01_V247402_PUBLIC_MANIFEST_IDENTITY=PASS')
          PY
          echo P01_CORE_UPDATES_COMPLETE_NATIVE=PASS

      - name: No private code or data persists
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -n "${P01_DIST_WORK:-}" ]; then rm -rf -- "$P01_DIST_WORK"; fi
          echo P01_CORE_UPDATES_PRIVATE_CLEANUP=PASS
