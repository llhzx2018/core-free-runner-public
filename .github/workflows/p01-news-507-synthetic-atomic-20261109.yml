name: P01 News from actual official 507 to synthetic install Atomic rollback
on:
  push:
    branches:
      - task/p01-news-507-to-synthetic-atomic-20261109
permissions:
  contents: read
jobs:
  news-package-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    env:
      PRODUCT_SHA: 7964fa76724605f86fc9a3a36c8791891c7147dc
      VF_NEWS_R5_SANDBOX: "1"
      VF_NEWS_R5_TARGET_VERSION: "2.99.999"
    steps:
      - name: Read registered public builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Transient checkout exact private News source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.PRODUCT_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p01-exact
          persist-credentials: false
          fetch-depth: 1

      - name: Restore minimum PHP SQLite and packaging dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-xml php-mbstring php-zip php-gd unzip zip jq >/dev/null
          test "$(git -C p01-exact rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(cat p01-exact/VERSION)" = "2.47.507"
          test "$(cat p01-exact/src/VERSION.txt)" = "2.47.507"
          php -l p01-exact/tests/integration/p01_news_r5_lifecycle_native.php >/dev/null
          echo P01_NEWS_507_SOURCE_IDENTITY=PASS

      - name: Actual official 507 FULL to disposable synthetic News build and Atomic recovery rollback
        shell: bash
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN" && test "$VF_NEWS_R5_TARGET_VERSION" = "2.99.999"
          test "$(git -C p01-exact rev-parse HEAD)" = "$PRODUCT_SHA"
          # The existing historical 505→506 fixture is adapted *only* in this
          # transient workspace: 507 already contains news.php; a rollback to
          # official 507 must preserve that preexisting route, not delete it.
          # No production or product Git source is edited or committed.
          python3 - <<'PY'
          from pathlib import Path
          src=Path("p01-exact/tests/integration/p01_news_r5_atomic_package_gate.sh").read_text()
          assert src.count("FROM=2.47.505")==1
          assert src.count("CANDIDATE_VERSION=2.47.506")==1
          src=src.replace("FROM=2.47.505","FROM=2.47.507").replace("CANDIDATE_VERSION=2.47.506","CANDIDATE_VERSION=2.47.507")
          Path("/tmp/p01-news-507-atomic-gate.sh").write_text(src)
          path=Path("p01-exact/tests/integration/p01_news_r5_lifecycle_native.php")
          helper=path.read_text()
          old="!is_file($resolved.'/news.php')"
          assert helper.count(old)==1
          path.write_text(helper.replace(old,"is_file($resolved.'/news.php')"))
          PY
          bash /tmp/p01-news-507-atomic-gate.sh
          echo P01_NEWS_507_SYNTHETIC_FULL_ATOMIC_BACKUP_ROLLBACK=PASS
          echo P01_NEWS_507_NOT_A_FORMAL_RELEASE=YES

      - name: Clean private checkout and disposable adaptation
        if: always()
        shell: bash
        run: |
          rm -rf p01-exact /tmp/p01-news-507-atomic-gate.sh
          echo P01_NEWS_PRIVATE_CHECKOUT_CLEANED=YES
