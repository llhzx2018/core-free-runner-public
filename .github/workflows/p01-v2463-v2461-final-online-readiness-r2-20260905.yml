name: P01 V2.46.1 Final V2.46.3 Online Readiness R2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p01-v2463-v2461-final-online-readiness-r2-20260905.yml

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      CORE_REF: 28ce4d7cd86bcfeaf905880f08e067bce88fa421
      OWNER_REF: 87edfd46ad61afba23b6998f4d0ccd9a8eabc5ad
      FORMAL_SOURCE: 494b7a9a497fed050885f27ccad3a280ba53b0ce
      CANONICAL_ASSET: VF_Start_V2.46.3_UPDATE.zip
      CANONICAL_ID: '545327284'
      CANONICAL_BYTES: '1609058'
      CANONICAL_SHA: b17da14ff7b0a0b598d55b0fc968a3cf1137e2e62fa73a3e99d109965c86a5ff
      RELEASE_ID: '383126819'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, mbstring, openssl, fileinfo
          coverage: none

      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CORE_REF }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          path: core
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.OWNER_REF }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          path: owner
          fetch-depth: 1
          persist-credentials: false

      - name: Exact candidate identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE_REF"
          test "$(git -C owner rev-parse HEAD)" = "$OWNER_REF"
          test "$(cat owner/VERSION)" = '2.46.1'
          python3 - <<'PY'
          import json,os
          p=json.load(open('core/projects/P01.json',encoding='utf-8'))
          expected={
            'schema_version':'1.0','project_id':'P01','component_id':'APP','enabled':True,
            'current_version':'2.46.1','target_version':'2.46.3','update_type':'ATOMIC',
            'from_versions':['2.46.1'],'schema_from':'2026090401','schema_to':'2026090401',
            'repository':'llhzx2018/vf-start','release_tag':'v2.46.3','release_id':int(os.environ['RELEASE_ID']),
            'product_identity':os.environ['FORMAL_SOURCE'],'asset_name':os.environ['CANONICAL_ASSET'],
            'asset_bytes':int(os.environ['CANONICAL_BYTES']),'asset_sha256':os.environ['CANONICAL_SHA'],
            'backup_required':True,'rollback_supported':True,'minimum_php':'8.0.0'
          }
          for k,v in expected.items(): assert p.get(k)==v,(k,p.get(k),v)
          print('P01_V2463_R2_MANIFEST_IDENTITY=PASS')
          PY
          grep -Fq "同一正式版本的 Core Update Manifest 内容发生变化，已拒绝静默替换。" owner/src/app/UpdateManager.php
          echo P01_V2463_R2_SOURCE=PASS

      - name: Exact anti-replay behavior and strictly newer transition
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/p01-v2463-replay-r2.php <<'PHP'
          <?php
          declare(strict_types=1);
          define('VF_ROOT','/tmp/p01-r2-root');
          define('VF_PRIVATE_ROOT','/tmp/p01-r2-private');
          if(!function_exists('vf_write_storage_guards')){function vf_write_storage_guards(string $dir):void{}}
          if(!function_exists('vf_clean_text')){function vf_clean_text(string $value,int $max=600):string{return mb_substr(trim($value),0,$max);}}
          final class VfMigrationRunner{public function __construct(private PDO $db){} public function schemaState():array{return ['current_head'=>'2026090401'];}}
          require getcwd().'/owner/src/app/UpdateManager.php';
          $new=json_decode(file_get_contents(getcwd().'/core/projects/P01.json'),true,512,JSON_THROW_ON_ERROR);
          $pdo=new PDO('sqlite::memory:');
          $pdo->setAttribute(PDO::ATTR_ERRMODE,PDO::ERRMODE_EXCEPTION);
          $pdo->exec('CREATE TABLE update_state(state_key TEXT PRIMARY KEY,state_value TEXT NOT NULL DEFAULT "",updated_at TEXT NOT NULL DEFAULT "")');
          $put=$pdo->prepare('INSERT INTO update_state(state_key,state_value,updated_at) VALUES(?,?,?)');
          $put->execute(['highest_verified_release_version','2.46.2',gmdate('c')]);
          $put->execute(['highest_verified_release_manifest_sha256',str_repeat('a',64),gmdate('c')]);

          $same=$new;
          $same['target_version']='2.46.2';
          $same['release_tag']='v2.46.2';
          $same['release_id']=383023846;
          $same['product_identity']='aba9c59fb8b759a3b6e41e820c5fc0e093207004';
          $same['asset_name']='VF_Start_V2.46.2_UPDATE.zip';
          $same['asset_bytes']=1609621;
          $same['asset_sha256']='64e652d1688eab4a1737a10cd30376d4b463cf101e8b31677ff1859e1625c9d0';
          $blocked=false;
          try {
              $m=new VfUpdateManager($pdo,[
                  'root'=>'/tmp/p01-r2-root','private_root'=>'/tmp/p01-r2-private','current_version'=>'2.46.1',
                  'manifest_fetcher'=>static fn(string $repo,string $path,string $ref):array=>$same,
                  'capabilities'=>['curl'=>true,'zip'=>true],'randomizer'=>static fn(int $a,int $b):int=>0,
              ]);
              $m->check(true);
          } catch (RuntimeException $e) {
              if(!str_contains($e->getMessage(),'同一正式版本')) throw $e;
              $blocked=true;
          }
          if(!$blocked) throw new RuntimeException('same-version changed manifest was not blocked');
          echo "P01_V2462_REPLAY_PROTECTION_INTACT=PASS\n";

          $m=new VfUpdateManager($pdo,[
              'root'=>'/tmp/p01-r2-root','private_root'=>'/tmp/p01-r2-private','current_version'=>'2.46.1',
              'manifest_fetcher'=>static fn(string $repo,string $path,string $ref):array=>$new,
              'capabilities'=>['curl'=>true,'zip'=>true],'randomizer'=>static fn(int $a,int $b):int=>0,
          ]);
          $r=$m->check(true);
          if(($r['ok']??false)!==true||($r['current_version']??'')!=='2.46.1'||($r['latest_version']??'')!=='2.46.3'||($r['available']??false)!==true||($r['can_update']??false)!==true){throw new RuntimeException(json_encode($r,JSON_UNESCAPED_UNICODE));}
          if(($r['requirements']['source_allowed']??false)!==true||($r['requirements']['schema']['ok']??false)!==true){throw new RuntimeException('requirements blocked');}
          $q=$pdo->prepare('SELECT state_value FROM update_state WHERE state_key=?');$q->execute(['highest_verified_release_version']);
          if((string)$q->fetchColumn()!=='2.46.3') throw new RuntimeException('verified version did not advance');
          echo "P01_V2461_TO_V2463_ANTI_REPLAY_TRANSITION=PASS\n";
          PHP
          php /tmp/p01-v2463-replay-r2.php

      - name: Exact release asset and repair bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api repos/llhzx2018/vf-start/releases/tags/v2.46.3 >/tmp/release.json
          jq -e --arg s "$FORMAL_SOURCE" --argjson rid "$RELEASE_ID" '.id==$rid and .tag_name=="v2.46.3" and .target_commitish==$s and .draft==false and .prerelease==false and (.assets|length)==8' /tmp/release.json >/dev/null
          jq -e --argjson id "$CANONICAL_ID" --arg n "$CANONICAL_ASSET" --argjson b "$CANONICAL_BYTES" --arg d "sha256:$CANONICAL_SHA" '.assets[]|select(.id==$id)|.name==$n and .size==$b and .digest==$d' /tmp/release.json >/dev/null
          rm -rf /tmp/p01-r2-asset; mkdir -p /tmp/p01-r2-asset
          gh release download v2.46.3 --repo llhzx2018/vf-start --pattern "$CANONICAL_ASSET" --dir /tmp/p01-r2-asset
          test "$(stat -c %s /tmp/p01-r2-asset/$CANONICAL_ASSET)" = "$CANONICAL_BYTES"
          test "$(sha256sum /tmp/p01-r2-asset/$CANONICAL_ASSET | awk '{print $1}')" = "$CANONICAL_SHA"
          test "$(unzip -Z1 /tmp/p01-r2-asset/$CANONICAL_ASSET)" = 'repair-v2.46.3.php'
          unzip -p /tmp/p01-r2-asset/$CANONICAL_ASSET repair-v2.46.3.php >/tmp/repair-v2.46.3.php
          grep -Fq "public const SOURCE_VERSION='2.46.1';" /tmp/repair-v2.46.3.php
          grep -Fq "public const TARGET_VERSION='2.46.3';" /tmp/repair-v2.46.3.php
          php /tmp/repair-v2.46.3.php --self-test | jq -e '.ok==true and .global_barrier==true and .interruption_recovery==true' >/dev/null
          echo P01_V2463_R2_RELEASE_ASSET=PASS

      - name: Update Core regression and routing
        shell: bash
        run: |
          set -Eeuo pipefail
          find core/update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php core/update-core/php/tests/run.php
          cat >/tmp/p01-v2463-core-r2.php <<'PHP'
          <?php
          require 'core/update-core/php/src/UpdateAdapter.php';
          require 'core/update-core/php/src/UpdateCore.php';
          $m=json_decode(file_get_contents('core/projects/P01.json'),true,512,JSON_THROW_ON_ERROR);
          $c=new CoreUpdates\UpdateCore('P01','APP');
          $cases=[['2.46.1','2026090401','AVAILABLE'],['2.46.0','2026090401','BLOCKED_SOURCE_VERSION'],['2.46.2','2026090401','BLOCKED_SOURCE_VERSION'],['2.46.1','2026090301','BLOCKED_SCHEMA'],['2.46.3','2026090401','UP_TO_DATE']];
          foreach($cases as [$v,$s,$want]){ $got=$c->check($v,$s,$m)['status']; if($got!==$want) throw new RuntimeException("$v/$s expected $want got $got"); }
          echo "P01_V2463_R2_UPDATE_CORE=PASS\n";
          PHP
          php /tmp/p01-v2463-core-r2.php

      - name: Final online readiness R2 PASS
        run: echo P01_V2461_TO_V2463_FINAL_ONLINE_READINESS_R2=PASS
