name: P01 V2.35 Final Remote Online Update Gate
on:
  push:
    branches: [release/p01-v2350-orchestrator-20260831]
    paths:
      - .github/workflows/p01-v2350-remote-online-update-final-20260831.yml
      - scripts/p01-v2350-remote-final.sh
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      ROOT: /tmp/p01-v2350-final-owner
      PORT: '18735'
      ADMIN_PASS: 'P01V2350!FinalRemote'
      EVID: /tmp/p01-v2350-final-evidence
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - name: Checkout gate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {path: runner}
      - name: Checkout immutable V2.34 source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.34.0
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: source
      - name: Checkout immutable V2.35 target
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.35.0
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: target
      - name: Checkout published V2.35 core-updates authority
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: 2b04f8fbcc0424f10d073c7382a3df52dd9d5e09
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: updates
      - name: Exact publication and discovery fence
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVID"
          test "$(git -C source rev-parse HEAD)" = 518d10f446ea85445d1110a3defafc5bcbece473
          test "$(git -C source rev-parse HEAD^{tree})" = 90ffab51a20640a4e3f6f07122a8e6e147592f64
          test "$(git -C source rev-parse HEAD:src)" = f3eeb66fbce3949ef50483ac4c5a821edbd15d35
          test "$(git -C target rev-parse HEAD)" = d20f8e964455c7238b66c6ff6ab2e7d732d315e2
          test "$(git -C target rev-parse HEAD^{tree})" = 1d9c8a11f1e8ddb7bb775b28592459f754c2c59b
          test "$(git -C target rev-parse HEAD:src)" = 24953b64762b2d17076e4149a2aa49a492316477
          test "$(git -C updates rev-parse HEAD)" = 2b04f8fbcc0424f10d073c7382a3df52dd9d5e09
          test "$(gh api repos/llhzx2018/core-updates/branches/main --jq .commit.sha)" = 2b04f8fbcc0424f10d073c7382a3df52dd9d5e09
          test "$(gh api repos/llhzx2018/vf-start/branches/main --jq .commit.sha)" = d20f8e964455c7238b66c6ff6ab2e7d732d315e2
          test "$(gh api repos/llhzx2018/vf-start/branches/develop --jq .commit.sha)" = d20f8e964455c7238b66c6ff6ab2e7d732d315e2
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.35.0 --jq .object.sha)" = d20f8e964455c7238b66c6ff6ab2e7d732d315e2
          test "$(gh api repos/llhzx2018/vf-start/releases/tags/v2.35.0 --jq .id)" = 379388775
          for run in 33330543623 33331921219 33332314263 33332398277 33332677330 33332740514 33332828443 33332898868; do test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$run --jq .conclusion)" = success; done
          jq -e '.current_version=="2.34.0" and .target_version=="2.35.0" and .from_versions==["2.34.0"] and .schema_from=="2026082901" and .schema_to=="2026082901" and .release_tag=="v2.35.0" and .release_id==379388775 and .product_identity=="d20f8e964455c7238b66c6ff6ab2e7d732d315e2" and .asset_name=="VF_Start_V2.35.0_UPDATE.zip" and .asset_bytes==1381982 and .asset_sha256=="73cbfabf9968c6366491a7f3caa6b70916432c638ac3e7df87479ccc2051e68a"' updates/projects/P01.json >/dev/null
          REL=$(gh api repos/llhzx2018/vf-start/releases/tags/v2.35.0)
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.35.0_UPDATE.zip")|.size' <<<"$REL")" = 1381982
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.35.0_UPDATE.zip")|.digest' <<<"$REL")" = sha256:73cbfabf9968c6366491a7f3caa6b70916432c638ac3e7df87479ccc2051e68a
          echo P01_V2350_FINAL_REMOTE_TRUTH_FENCE=PASS | tee "$EVID/truth-fence.txt"
      - name: Real remote online update and V2.35 runtime gate
        shell: bash
        run: bash runner/scripts/p01-v2350-remote-final.sh
      - name: Final verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fx P01_V2340_TO_V2350_REMOTE_ONLINE_UPDATE=PASS "$EVID/runtime-verdict.txt"
          grep -Fx P01_V2350_REMOTE_DISCOVERY=PASS "$EVID/runtime-verdict.txt"
          grep -Fx P01_V2350_REMOTE_RELEASE_DOWNLOAD=PASS "$EVID/runtime-verdict.txt"
          grep -Fx P01_V2350_DATA_PRESERVATION=PASS "$EVID/runtime-verdict.txt"
          grep -Fx P01_V2350_PUBLIC_PRIVATE_HTTP=PASS "$EVID/runtime-verdict.txt"
          grep -Fx P01_V2350_FIVE_DOMAIN_HTTP=PASS "$EVID/runtime-verdict.txt"
          cat > "$EVID/verdict.txt" <<'EOF'
          P01_V2340_TO_V2350_REMOTE_ONLINE_UPDATE_GATE=PASS
          P01_V2350_SCHEMA_UNCHANGED_2026082901=PASS
          P01_V2350_DATA_PRESERVATION=PASS
          P01_V2350_SQLITE_INTEGRITY=PASS
          P01_V2350_PUBLIC_PRIVATE_HTTP=PASS
          P01_V2350_FIVE_DOMAIN_HTTP=PASS
          P01_V2350_RUNTIME_FEATURE_BYTES=PASS
          P01_V2350_READY_FOR_OWNER_PRODUCTION_UPGRADE=YES
          OWNER_PRODUCTION_WRITE=NO
          EOF
          cat "$EVID/verdict.txt"
      - name: Upload final remote evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-v2350-final-remote-evidence-${{ github.run_id }}
          path: /tmp/p01-v2350-final-evidence
          if-no-files-found: warn
          retention-days: 90
