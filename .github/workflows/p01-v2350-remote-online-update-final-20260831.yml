name: P01 V2.35.1 Final Remote Online Update Gate
on:
  push:
    branches: [release/p01-v2350-orchestrator-20260831]
    paths:
      - .github/workflows/p01-v2350-remote-online-update-final-20260831.yml
      - scripts/p01-v2350-remote-final.sh
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      ROOT: /tmp/p01-v2351-final-owner
      PORT: '18736'
      ADMIN_PASS: 'P01V2351!FinalRemote'
      EVID: /tmp/p01-v2351-final-evidence
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - name: Checkout gate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {path: runner}
      - name: Checkout immutable V2.35.0 source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.35.0
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: source
      - name: Checkout immutable V2.35.1 target
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.35.1
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: target
      - name: Checkout published V2.35.1 core-updates authority
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: a7a601e0880becb78c9835648d06dcda2625b2dc
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: updates
      - name: Exact publication and discovery fence
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVID"
          test "$(git -C source rev-parse HEAD)" = d20f8e964455c7238b66c6ff6ab2e7d732d315e2
          test "$(git -C source rev-parse HEAD^{tree})" = 1d9c8a11f1e8ddb7bb775b28592459f754c2c59b
          test "$(git -C source rev-parse HEAD:src)" = 24953b64762b2d17076e4149a2aa49a492316477
          test "$(git -C target rev-parse HEAD)" = eb36fd19d269aed4ef4246c2c18f172b2c761bde
          test "$(git -C target rev-parse HEAD^{tree})" = 00aca451804db5ebf9260d8101dfe829789c4f24
          test "$(git -C target rev-parse HEAD:src)" = 3cdfa02d8c19ae5e771b7d4abff69a670ac4396c
          test "$(git -C updates rev-parse HEAD)" = a7a601e0880becb78c9835648d06dcda2625b2dc
          test "$(gh api repos/llhzx2018/core-updates/branches/main --jq .commit.sha)" = a7a601e0880becb78c9835648d06dcda2625b2dc
          test "$(gh api repos/llhzx2018/vf-start/branches/main --jq .commit.sha)" = b48b1071b5b56d37d35e97b61e13d055a3d2c852
          test "$(gh api repos/llhzx2018/vf-start/branches/develop --jq .commit.sha)" = b48b1071b5b56d37d35e97b61e13d055a3d2c852
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.35.0 --jq .object.sha)" = d20f8e964455c7238b66c6ff6ab2e7d732d315e2
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.35.1 --jq .object.sha)" = eb36fd19d269aed4ef4246c2c18f172b2c761bde
          test "$(gh api repos/llhzx2018/vf-start/releases/tags/v2.35.1 --jq .id)" = 379424818
          for run in 33338822193 33339734236 33340105433 33340185389 33340313941 33340348260 33342185241 33342219852; do test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$run --jq .conclusion)" = success; done
          jq -e '.current_version=="2.35.0" and .target_version=="2.35.1" and .from_versions==["2.35.0"] and .schema_from=="2026082901" and .schema_to=="2026082901" and .release_tag=="v2.35.1" and .release_id==379424818 and .product_identity=="eb36fd19d269aed4ef4246c2c18f172b2c761bde" and .asset_name=="VF_Start_V2.35.1_UPDATE.zip" and .asset_bytes==1376805 and .asset_sha256=="e6e40b77d75319f24ea4e0e803863a1b5ffffcdf2f3405d62dc9399cbc7114af"' updates/projects/P01.json >/dev/null
          REL=$(gh api repos/llhzx2018/vf-start/releases/tags/v2.35.1)
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.35.1_UPDATE.zip")|.size' <<<"$REL")" = 1376805
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.35.1_UPDATE.zip")|.digest' <<<"$REL")" = sha256:e6e40b77d75319f24ea4e0e803863a1b5ffffcdf2f3405d62dc9399cbc7114af
          echo P01_V2351_FINAL_REMOTE_TRUTH_FENCE=PASS | tee "$EVID/truth-fence.txt"
      - name: Real remote online update and V2.35.1 runtime gate
        shell: bash
        run: bash runner/scripts/p01-v2350-remote-final.sh
      - name: Final verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fx P01_V2350_TO_V2351_REMOTE_ONLINE_UPDATE=PASS "$EVID/runtime-verdict.txt"
          grep -Fx P01_V2351_REMOTE_DISCOVERY=PASS "$EVID/runtime-verdict.txt"
          grep -Fx P01_V2351_REMOTE_RELEASE_DOWNLOAD=PASS "$EVID/runtime-verdict.txt"
          grep -Fx P01_V2351_DATA_PRESERVATION=PASS "$EVID/runtime-verdict.txt"
          grep -Fx P01_V2351_PUBLIC_PRIVATE_HTTP=PASS "$EVID/runtime-verdict.txt"
          grep -Fx P01_V2351_FIVE_DOMAIN_HTTP=PASS "$EVID/runtime-verdict.txt"
          cat > "$EVID/verdict.txt" <<'EOF'
          P01_V2350_TO_V2351_REMOTE_ONLINE_UPDATE_GATE=PASS
          P01_V2351_SCHEMA_UNCHANGED_2026082901=PASS
          P01_V2351_DATA_PRESERVATION=PASS
          P01_V2351_SQLITE_INTEGRITY=PASS
          P01_V2351_PUBLIC_PRIVATE_HTTP=PASS
          P01_V2351_FIVE_DOMAIN_HTTP=PASS
          P01_V2351_RUNTIME_FEATURE_BYTES=PASS
          P01_V2351_READY_FOR_OWNER_PRODUCTION_UPGRADE=YES
          OWNER_PRODUCTION_WRITE=NO
          EOF
          cat "$EVID/verdict.txt"
      - name: Upload final remote evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-v2351-final-remote-evidence-${{ github.run_id }}
          path: /tmp/p01-v2351-final-evidence
          if-no-files-found: warn
          retention-days: 90
