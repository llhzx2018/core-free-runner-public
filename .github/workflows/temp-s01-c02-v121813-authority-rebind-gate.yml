name: TEMP S01-C02 v1.21.813 Authority Rebind Gate
on:
  push:
    branches: [temp/s01-c03-v12519-runtime-authority-probe-20260905]
    paths: ['.github/workflows/temp-s01-c02-v121813-authority-rebind-gate.yml']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE: b32ea5d6012aa25305ed23b3aaadc4bf048e8c3c
      CANDIDATE: bd2fb0f84a39cbbbdc0c4d999397c4c7c0f82f44
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.CANDIDATE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops
      - name: Verify live base and exact scope
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          live(){ curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/llhzx2018/vf-tools-ops/branches/$1" | jq -r '.commit.sha'; }
          test "$(live main)" = "$BASE"
          test "$(live develop)" = "$BASE"
          printf '%s\n' \
            '.github/phase3/v121813-m3u8-authority-rebind-guard.php' \
            'VERSION' \
            'includes/wp-update/class-vf-ops-shared-private-asset-bootstrap-v1.php' \
            'includes/wp-update/class-vf-ops-update-admin-v1.php' \
            'vf-ops.php' | sort >/tmp/expected
          git -C ops diff --name-only "$BASE" "$CANDIDATE" | sort >/tmp/actual
          diff -u /tmp/expected /tmp/actual
          test "$(cat ops/VERSION)" = '1.21.813'
          grep -Fq 'Version: 1.21.813' ops/vf-ops.php
          grep -Fq "VF_OPS_ROUND', 'M3U8-AUTHORITY-REBIND-GUARD-V1'" ops/vf-ops.php
          echo EXACT_SCOPE_AND_VERSION=PASS
      - name: Safety and focused contract
        run: |
          set -Eeuo pipefail
          changed='ops/includes/wp-update/class-vf-ops-shared-private-asset-bootstrap-v1.php'
          ! grep -E '\$wpdb|dbDelta\(|vf_tools_m3u8_v6_|controlled_migration|schema_repair|DROP[[:space:]]+TABLE|TRUNCATE[[:space:]]+TABLE' "$changed"
          grep -Fq "M3U8_REBIND_VERSION = '1.25.19'" "$changed"
          grep -Fq 'M3U8_REBIND_FILE_COUNT = 551' "$changed"
          grep -Fq '361eb3263b689bbe7a117d1628e51f069358697a3d85fd7e3c1faf2e7afcf113' "$changed"
          grep -Fq "'preflight_m3u8_authority_rebind'], 9, 4" "$changed"
          find ops -path 'ops/.git' -prune -o -type f -name '*.php' -print0 | xargs -0 -n 1 php -l >/tmp/lint
          php ops/.github/phase3/v121813-m3u8-authority-rebind-guard.php
          echo PHP_SAFETY_AND_FOCUSED_CONTRACT=PASS
      - name: Build deterministic candidate and runtime authority
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,re,zipfile
          files=[]
          for p in Path('ops').rglob('*'):
              if not p.is_file() or p.is_symlink(): continue
              rel=p.relative_to('ops').as_posix(); parts=rel.split('/')
              if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in parts): continue
              if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',rel,re.I): continue
              if '/' not in rel:
                  if rel not in {'vf-ops.php','uninstall.php'}: continue
              elif parts[0] not in {'includes','assets','languages','config'}: continue
              files.append((rel,p.read_bytes()))
          files.sort(key=lambda x:x[0])
          canonical=''.join(rel+'\0'+hashlib.sha256(b).hexdigest()+'\n' for rel,b in files)
          fp=hashlib.sha256(canonical.encode()).hexdigest()
          z=Path('/tmp/vf-tools-ops_V1.21.813.zip')
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as out:
              for rel,b in files:
                  i=zipfile.ZipInfo('vf-ops/'+rel,(2026,9,5,0,0,0)); i.compress_type=zipfile.ZIP_DEFLATED; i.external_attr=0o100644<<16; out.writestr(i,b)
          auth={'bytes':z.stat().st_size,'sha256':hashlib.sha256(z.read_bytes()).hexdigest(),'runtime_files':len(files),'runtime_fingerprint':fp}
          print('CANDIDATE_AUTHORITY='+json.dumps(auth,separators=(',',':')))
          assert len(files)==900
          PY
          unzip -tq /tmp/vf-tools-ops_V1.21.813.zip >/dev/null
          unzip -p /tmp/vf-tools-ops_V1.21.813.zip vf-ops/vf-ops.php | grep -Fq 'Version: 1.21.813'
          echo PASS_V121813_CANDIDATE_GATE
