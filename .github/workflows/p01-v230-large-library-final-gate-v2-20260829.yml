name: P01 V2.30 Large Library Final Gate V2
on:
  push:
    branches: [task/p01-v230-domain-nav-shell-20260829]
    paths: [.github/workflows/p01-v230-large-library-final-gate-v2-20260829.yml]
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env: {SOURCE_SHA: '426740ee3e36d207581dddf9b3fe5d62fd8d1808', PORT: '18592', ROOT: '/tmp/p01-v230-lgv2', ADMIN_PASS: 'P01V230!Large'}
    steps:
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.4', extensions: 'pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo', coverage: none}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {repository: llhzx2018/vf-start, ref: '${{ env.SOURCE_SHA }}', token: '${{ secrets.VF_PRIVATE_READ_TOKEN }}', path: source}
      - name: Fresh runtime 450 seed
        shell: bash
        run: |
          set -Eeuo pipefail; test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"; rm -rf "$ROOT" evidence /tmp/lgv2.cookies; mkdir evidence; cp -a source/src "$ROOT"; php -S "127.0.0.1:${PORT}" -t "$ROOT" >/tmp/lgv2-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS -c /tmp/lgv2.cookies -b /tmp/lgv2.cookies "http://127.0.0.1:${PORT}/setup.php" -o /tmp/lgv2-setup.html && break || sleep 1; done
          S=$(python3 -c "import re;s=open('/tmp/lgv2-setup.html').read();m=re.search(r'name=\"setup_csrf\"\\s+value=\"([^\"]+)\"',s);assert m;print(m.group(1))"); curl -fsS -c /tmp/lgv2.cookies -b /tmp/lgv2.cookies -X POST "http://127.0.0.1:${PORT}/setup.php" --data-urlencode "setup_csrf=$S" --data-urlencode 'site_title=Large Gate' --data-urlencode "admin_password=$ADMIN_PASS" --data-urlencode "admin_password_confirm=$ADMIN_PASS" >/dev/null
          L=$(curl -fsS -c /tmp/lgv2.cookies -b /tmp/lgv2.cookies -H 'Content-Type: application/json' -d "{\"password\":\"$ADMIN_PASS\"}" "http://127.0.0.1:${PORT}/api.php?action=login"); T=$(echo "$L"|jq -r '.csrf'); test "$T" != null
          postcat(){ curl -fsS -c /tmp/lgv2.cookies -b /tmp/lgv2.cookies -H 'Content-Type: application/json' -H "X-CSRF-Token: $T" -d "$1" "http://127.0.0.1:${PORT}/api.php?action=category_save"; }
          R=$(postcat '{"name":"资源库","is_private":false,"sort_order":100}'); RID=$(echo "$R"|jq -r '.id'); D=$(postcat "{\"name\":\"开发\",\"parent_id\":$RID,\"is_private\":false,\"sort_order\":90}"); DID=$(echo "$D"|jq -r '.id'); P=$(postcat "{\"name\":\"私人\",\"parent_id\":$RID,\"is_private\":true,\"sort_order\":80}"); PID=$(echo "$P"|jq -r '.id'); E=$(postcat "{\"name\":\"待拓展\",\"parent_id\":$RID,\"is_private\":false,\"sort_order\":70}"); EID=$(echo "$E"|jq -r '.id')
          create(){ local cid="$1" title="$2" url="$3"; local o c b; o=$(curl -sS -w '\n%{http_code}' -c /tmp/lgv2.cookies -b /tmp/lgv2.cookies -X POST "http://127.0.0.1:${PORT}/workspace-create.php" -F "csrf=$T" -F "category_id=$cid" -F 'surface=start' -F "title=$title" -F "url=$url" -F 'tags=Gate' -F 'is_private=0' -F 'source_kind=remote_url'); c=$(printf '%s' "$o"|tail -1); b=$(printf '%s' "$o"|sed '$d'); test "$c" = 200 || { echo "$b"; exit 1; }; }
          for i in $(seq 1 450); do create "$DID" "导航资源 $i" "https://largev2-$i.example.org/"; done; create "$PID" '私人资源' 'https://largev2-private.example.org/'; php "$ROOT/cli/verify.php"|grep -Fx VERIFY_PASS=YES; echo P01_V230_LGV2_SEED=PASS
      - name: Install Playwright
        run: mkdir -p /tmp/pw-lgv2 && cd /tmp/pw-lgv2 && npm init -y >/dev/null 2>&1 && npm install playwright@1.55.0 >/dev/null 2>&1 && npx playwright install chromium --with-deps >/dev/null 2>&1
      - name: Browser gate
        shell: bash
        run: |
          cat >/tmp/pw-lgv2/gate.js <<'JS'
          const{chromium}=require('playwright'),fs=require('fs');(async()=>{let b='http://127.0.0.1:18592',pw='P01V230!Large',x=await chromium.launch({headless:true});let d=await x.newContext({viewport:{width:1440,height:960}});let r=await d.request.post(b+'/api.php?action=login',{data:{password:pw}});if(!r.ok())throw Error('login');let p=await d.newPage();await p.goto(b+'/start.php?per=50',{waitUntil:'networkidle'});if(await p.locator('.vf-asset-row').count()!=50)throw Error('rows');let txt=await p.locator('.vf-workspace-count').innerText();if(!txt.includes('451'))throw Error('count '+txt);if(await p.locator('.vf-global-domain-nav a').count()!=5)throw Error('nav');let zero=p.locator('[data-category-node]',{hasText:'待拓展'});if(await zero.count()!=1)throw Error('zero');await p.locator('.vf-global-search input[name=q]').fill('导航资源 449');await p.locator('.vf-global-search').evaluate(f=>f.submit());await p.waitForLoadState('networkidle');if(await p.locator('.vf-asset-row').count()!=1)throw Error('search');await p.screenshot({path:'/home/runner/work/core-free-runner-public/core-free-runner-public/evidence/desktop-large.png',fullPage:true});await d.close();let m=await x.newContext({viewport:{width:390,height:844}});r=await m.request.post(b+'/api.php?action=login',{data:{password:pw}});if(!r.ok())throw Error('mlogin');let q=await m.newPage();await q.goto(b+'/start.php',{waitUntil:'networkidle'});await q.locator('.vf-mobile-command-row').waitFor({state:'visible'});let t=q.locator('.vf-mobile-category-trigger');await t.click();let o=q.locator('.vf-mobile-category-overlay');await o.waitFor({state:'visible'});await o.locator('input[type=search]').fill('待拓展');if(await o.locator('[data-category-picker-item]',{hasText:'待拓展'}).count()!=1)throw Error('picker');if(await q.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth)>1)throw Error('overflow');await q.screenshot({path:'/home/runner/work/core-free-runner-public/core-free-runner-public/evidence/mobile-large.png',fullPage:true});await m.close();let a=await x.newContext();let z=await a.newPage();await z.goto(b+'/start.php',{waitUntil:'networkidle'});let h=await z.content();if(h.includes('私人资源'))throw Error('leak');if(!h.includes('导航资源 1'))throw Error('public missing');await a.close();await x.close();fs.writeFileSync('/home/runner/work/core-free-runner-public/core-free-runner-public/evidence/verdict.txt','P01_V230_LARGE_LIBRARY_FINAL_V2=PASS\n')})().catch(e=>{console.error(e);process.exit(1)});
          JS
          cd /tmp/pw-lgv2 && node gate.js
      - uses: actions/upload-artifact@v4
        with: {name: P01-v230-large-library-final-v2-evidence, path: evidence, retention-days: 7}
      - name: Final
        run: echo "SOURCE=$SOURCE_SHA" && echo P01_V230_LARGE_LIBRARY_FINAL_V2_GATE=PASS
