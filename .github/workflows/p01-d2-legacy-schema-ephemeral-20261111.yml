name: P01 D2 historical SQLite lineage and Owner read regression (temporary)
on:
  push:
    branches:
      - test/p01-d2-legacy-schema-20261111
permissions:
  contents: read
jobs:
  p01-d2-legacy-disposable:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Prove bounded test scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "$GITHUB_REF_NAME" = "test/p01-d2-legacy-schema-20261111"
          echo "P01_D2_LEGACY_TEST_SOURCE=ONLY_SYNTHETIC_SEED"
          echo "P01_D2_PRODUCTION_WRITES=NO"
      - name: Checkout exact private P01 source without credential persistence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: b60e233c4bb4164cc32339672bb780368cf3e663
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
      - name: Verify exact source identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "b60e233c4bb4164cc32339672bb780368cf3e663"
          test "$(cat candidate/VERSION)" = "2.47.515"
          test "$(cat candidate/src/VERSION.txt)" = "2.47.515"
          echo "P01_D2_LEGACY_EXACT_SHA=b60e233c4bb4164cc32339672bb780368cf3e663"
      - name: Prepare isolated PHP SQLite and pinned Laravel dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php-cli php-sqlite3 php-mbstring php-xml php-curl unzip composer >/dev/null
          php -r 'if (!in_array("sqlite",PDO::getAvailableDrivers(),true)) exit(1); echo "P01_D2_LEGACY_PDO_SQLITE=PASS\n";'
          composer install --working-dir=candidate/tests/compatibility/laravel --no-interaction --no-progress --no-scripts --prefer-dist --optimize-autoloader
          echo "P01_D2_LEGACY_DEPENDENCIES=PASS"
      - name: Lint and replay 20 production historical migration definitions on clean disposable SQLite
        id: legacy
        shell: bash
        env:
          P01_ISOLATED_DB_TEST: "YES"
          P01_DB_TEST_ENGINE: sqlite
        run: |
          set -Eeuo pipefail
          cd candidate
          php -l tests/compatibility/laravel/run_legacy_sqlite_lineage.php
          php tests/compatibility/laravel/run_legacy_sqlite_lineage.php
      - name: Deny historical replay without isolated authorization
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          set +e
          output=$(env -u P01_ISOLATED_DB_TEST P01_DB_TEST_ENGINE=sqlite php tests/compatibility/laravel/run_legacy_sqlite_lineage.php 2>&1)
          result=$?
          set -e
          test "$result" = "2"
          case "$output" in *P01_D2_LEGACY_SCOPE=BLOCKED_ISOLATED_SQLITE_ONLY*) ;; *) exit 1;; esac
          echo "P01_D2_LEGACY_NO_AUTH_NEGATIVE=PASS"
      - name: Assert focused result
        if: always()
        shell: bash
        env:
          LEGACY: ${{ steps.legacy.outcome }}
        run: |
          test "$LEGACY" = success
          echo "P01_D2_LEGACY_SQLITE_EXACT_SOURCE_MACHINE=PASS"
      - name: Erase private checkout and all temporary test files
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate
          echo "P01_D2_PRIVATE_SOURCE_PERSISTED=NO"
