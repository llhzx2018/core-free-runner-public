name: S01 exact core channel private CI registered fallback
on:
  push:
    branches: [task/s01-theme126-help-catalogue-finish-channel-20261016]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      TARGET_REPO: 'llhzx2018/core-updates'
      TARGET_SHA: 'b87088096e997549f15d9ee5b42eebf9953c096a'
      TARGET_TREE: 'afb4e941fb9100c55245a73d8f441bdb4c54e5df'
      TARGET_VERSION: '1.3.0'
      M3_VERSION: '1.25.91'
      THEME_VERSION: '1.35.126'
      THEME_SOURCE_VERSION: '1.35.125'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Exact fallback spec audit
        run: |
          set -Eeuo pipefail
          mkdir -p proof
          python3 runner/scripts/ephemeral_lane_spec.py render --spec runner/lanes/s01-theme126-help-catalogue-finish-channel-20261016/spec.json --template runner/lanes/s01-theme126-help-catalogue-finish-channel-20261016/verify.template.yml --output /tmp/channel.yml
          cmp /tmp/channel.yml runner/.github/workflows/s01-theme126-help-catalogue-finish-channel-20261016.yml
          python3 runner/scripts/ephemeral_lane_spec.py audit-rendered --spec runner/lanes/s01-theme126-help-catalogue-finish-channel-20261016/spec.json --input runner/.github/workflows/s01-theme126-help-catalogue-finish-channel-20261016.yml > proof/lane-audit.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
      - name: Original CI commands on exact private source
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          cd target
          python3 scripts/check_manifest_contract.py
          php -v
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PY'
          import json,os,pathlib
          m=json.loads(pathlib.Path('projects/S01-C03.json').read_text())
          t=json.loads(pathlib.Path('projects/S01-C01.json').read_text())
          assert t['target_version']==os.environ['THEME_VERSION']
          assert os.environ['THEME_SOURCE_VERSION'] in t['from_versions']
          result={'status':'PASS','source_sha':os.environ['TARGET_SHA'],'source_tree':os.environ['TARGET_TREE'],'commands':['manifest audit','php environment','all update-core PHP syntax','original regression suite'],'versions':{'m3u8':m['target_version'],'theme':t['target_version']},'private_native_ci':'PRIVATE_HOSTED_STATUS_RECORDED_SEPARATELY','production':'NOT_EXECUTED'}
          pathlib.Path('../proof/FINAL_CHANNEL.json').write_text(json.dumps(result,indent=2))
          print('PUBLIC_SAFE_CHANNEL',json.dumps(result))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: success()
        id: receipt
        with:
          name: s01-tools-channel-proof-${{ github.run_id }}
          path: proof/*.json
          if-no-files-found: error
      - name: Exact uploaded receipt readback
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.receipt.outputs.artifact-id }}
        run: |
          set -Eeuo pipefail
          for attempt in 1 2 3 4 5 6; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > /tmp/channel-meta.json; then break; fi
            if [ "$attempt" = 6 ]; then exit 1; fi
            sleep 2
          done
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/channel-receipt.zip
          python3 - <<'PYRECEIPT'
          import pathlib,zipfile,hashlib,json,os
          m=json.loads(pathlib.Path('/tmp/channel-meta.json').read_text());b=pathlib.Path('/tmp/channel-receipt.zip').read_bytes()
          assert m['workflow_run']['head_sha']==os.environ['GITHUB_SHA'] and m['size_in_bytes']==len(b)
          assert m['digest']=='sha256:'+hashlib.sha256(b).hexdigest()
          with zipfile.ZipFile('/tmp/channel-receipt.zip') as z:
           assert z.testzip() is None and set(z.namelist())=={'lane-audit.json','FINAL_CHANNEL.json'}
           for n in z.namelist(): assert json.loads(z.read(n))==json.loads((pathlib.Path('proof')/n).read_text())
          print('PUBLIC_SAFE_CHANNEL_RECEIPT',json.dumps({'status':'PASS','id':m['id'],'bytes':len(b),'digest':m['digest']}))
          PYRECEIPT
      - name: Remove transient private source
        if: always()
        run: rm -rf target
