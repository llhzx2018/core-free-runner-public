name: P07 release113 formal publication (exact-gated, owner-directed)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p07-release113-formal-publish.yml'
      - 'experiments/p07-release113-attestation.json'
      - 'dist/p07/0.1.0/overlay/**'
      - 'installers/p07.sh'
      - 'installers/p07-final.sh'
permissions:
  contents: read
concurrency:
  group: p07-release113-formal-publish
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      ${{ github.repository == 'llhzx2018/core-free-runner-public' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'P07 release113 exact gated formal publish') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_REPO: llhzx2018/core-free-runner-public
      RELEASE_TAG: p07-v0.1.0-release113
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Recheck exact candidate and authorization boundary on public main
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN" || { echo P07_RELEASE113_WRITE_TOKEN_MISSING; exit 78; }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$RELEASE_REPO/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          a=json.loads(Path('experiments/p07-release113-attestation.json').read_text())
          assert a['schema']=='p07.release-candidate.offline.v1'
          assert a['status']=='FORMAL_STAGING_NOT_PUBLISHED'
          assert a['product_build']=='0.1.0-release113'
          assert a['product_source_sha']=='cf4e0f32da4eb545248f5f5b614013a711cfc140'
          assert a['runtime_file_count']==59 and a['overlay_file_count']==138
          assert a['candidate_machine_evidence']=='PASS_RUN_41187348599'
          for field in ('verified_private_original_sql_restore','verified_site8_conflicts_resolved','migration_resume_allowed','cutover_allowed','production_install_verified','owner_preview_verified'):
              assert a[field] is False,field
          assert not any(a['negative'].values())
          def blob(f):
              data=f.read_bytes()
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          def manifest(root,name):
              used=set()
              for line in (root/name).read_text().splitlines():
                  sha,relative=line.split('  ',1)
                  path=Path(relative)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert relative not in used
                  used.add(relative)
                  f=root/path
                  assert f.is_file() and not f.is_symlink()
                  assert blob(f)==sha,relative
              return used
          root=Path('dist/p07/0.1.0/overlay')
          runtime=manifest(root,'RUNTIME.gitblob')
          full=manifest(root,'MANIFEST.gitblob')
          assert len(runtime)==59 and len(full)==138 and runtime<=full
          assert (root/'BUILD_ID').read_text().strip()=='0.1.0-release113'
          for item,actual in (('runtime_manifest_blob',root/'RUNTIME.gitblob'),
                              ('overlay_manifest_blob',root/'MANIFEST.gitblob'),
                              ('final_installer_blob',Path('installers/p07-final.sh')),
                              ('loader_blob',Path('installers/p07.sh')),
                              ('toolbox_blob',Path('installers/p07-toolbox.sh'))):
              assert blob(actual)==a[item]
          assert a['final_installer_blob'] in Path('installers/p07.sh').read_text()
          assert a['runtime_manifest_blob'] in Path('installers/p07-final.sh').read_text()
          assert 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release113"' in Path('installers/p07-toolbox.sh').read_text()
          print('P07_RELEASE113_FULL_BYTE_IDENTITY_AND_NON_MIGRATION_SCOPE_PASS')
          PY
          bash -n installers/p07.sh installers/p07-final.sh installers/p07-toolbox.sh installers/p07-system-care.sh
      - name: Reconfirm exact product source and independent integrated machine run
        shell: bash
        run: |
          set -Eeuo pipefail
          product_repo=llhzx2018/vf-server-ops
          test "$(gh api "repos/$product_repo/git/ref/heads/main" --jq '.object.sha')" = cf4e0f32da4eb545248f5f5b614013a711cfc140
          root=dist/p07/0.1.0/overlay
          for rel in lib/isolated_db_restore.py lib/native_scratch_restore.py lib/private_conflict_preservation.py lib/private_sql_literal_reconcile.py lib/migration_recovery_rehearsal.py lib/scratch_sql_host_policy.py lib/server_migration_pull.py tests/test_private_conflict_preservation.py tests/test_private_sql_literal_reconcile.py tests/test_private_verified_sql_snapshot.py tests/test_migration_remainder_exact_scope.py tests/test_scratch_multiline_host_gate.py tests/test_scratch_sealed_input.py; do
            expected="$(git hash-object "$root/$rel")"
            actual="$(gh api "repos/$product_repo/contents/$rel?ref=main" --jq '.sha')"
            test "$actual" = "$expected" || { echo P07_RELEASE113_PRODUCT_EXACT_SOURCE_DRIFT; exit 78; }
          done
          state="$(gh api "repos/$RELEASE_REPO/actions/runs/41187348599" --jq '.conclusion')"
          test "$state" = success || { echo P07_RELEASE113_MACHINE_RUN_NOT_PASS; exit 78; }
          echo P07_RELEASE113_PRODUCT_AND_INDEPENDENT_MACHINE_PASS
      - name: Create immutable release and recheck tag identity
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view "$RELEASE_TAG" -R "$RELEASE_REPO" >/dev/null 2>&1; then
            test "$(gh api "repos/$RELEASE_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$GITHUB_SHA" || { echo P07_RELEASE113_TAG_COLLISION; exit 81; }
          else
            gh release create "$RELEASE_TAG" -R "$RELEASE_REPO" --target "$GITHUB_SHA" \
              --title 'P07 · release113 · SQL 恢复证据保护与未迁移站点独立预备' \
              --notes 'release113 / System Care rc80: merged P07 changes through cf4e0f32. Full 59-runtime/138-file exact manifest, independent 112→113 install, reinstall, rollback and data-sentinel safety PASS in Runner #41187348599. Migration is NOT resumed or approved. Actual private original SQL dual restore NOT verified, site8 six conflicting PK records unresolved, target overwrite forbidden, no DNS or source deletion. Owner manually upgrades production and explicitly controls any later migration.'
          fi
          test "$(gh api "repos/$RELEASE_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$GITHUB_SHA"
          test "$(gh api "repos/$RELEASE_REPO/releases/tags/$RELEASE_TAG" --jq '.draft')" = false
          test "$(gh api "repos/$RELEASE_REPO/releases/tags/$RELEASE_TAG" --jq '.prerelease')" = false
          echo P07_RELEASE113_FORMAL_TAG_PUBLISHED_PASS
      - name: Upload and independent exact-asset readback
        shell: bash
        run: |
          set -Eeuo pipefail
          gh release upload "$RELEASE_TAG" -R "$RELEASE_REPO" --clobber installers/p07.sh installers/p07-final.sh installers/p07-toolbox.sh installers/p07-system-care.sh
          tmp="$(mktemp -d -t p07-release113-remote.XXXXXX)"
          trap 'rm -rf "$tmp"' EXIT
          gh release download "$RELEASE_TAG" -R "$RELEASE_REPO" --dir "$tmp"
          for rel in p07.sh p07-final.sh p07-toolbox.sh p07-system-care.sh; do
            test -f "$tmp/$rel"
            test "$(git hash-object "$tmp/$rel")" = "$(git hash-object "installers/$rel")"
          done
          echo P07_RELEASE113_RELEASE_ASSETS_READBACK_PASS
      - name: Verify public installer latest and immutable bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          tmp="$(mktemp -t p07-release113-public.XXXXXX)"
          trap 'rm -f "$tmp"' EXIT
          for rel in installers/p07.sh installers/p07-final.sh installers/p07-toolbox.sh dist/p07/0.1.0/overlay/BUILD_ID dist/p07/0.1.0/overlay/RUNTIME.gitblob dist/p07/0.1.0/overlay/MANIFEST.gitblob dist/p07/0.1.0/overlay/lib/server_migration_pull.py; do
            for ref in "$GITHUB_SHA" main; do
              curl -fsSL --retry 5 --proto '=https' --tlsv1.2 "https://raw.githubusercontent.com/$RELEASE_REPO/$ref/$rel" -o "$tmp"
              test "$(git hash-object "$tmp")" = "$(git hash-object "$rel")" || { echo P07_RELEASE113_PUBLIC_BYTES_MISMATCH; exit 78; }
            done
          done
          echo P07_RELEASE113_PUBLIC_DISTRIBUTION_READBACK_PASS
