name: P05 V1.2.4 Online Discovery Readback

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p05-v124-online-discovery-readback-20260903.yml']

permissions:
  contents: read

jobs:
  discovery:
    if: github.event_name == 'pull_request' && github.head_ref == 'tmp/p05-v124-online-discovery-readback-20260903'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PROD_SOURCE: 66a56dafdfba2ca7243d1984791ecbe0fd7382ae
      PROD_GITHUB_CLIENT_BLOB: dde68d59c366ba229f6642d4b0dec8b32d3eea42
      PROD_UPDATE_CORE_BLOB: 23827722462a4d4f3b24d516ff52bcb1b7274658
      CURRENT_VERSION: 1.2.3
      CURRENT_SCHEMA: '1'
      TARGET_VERSION: 1.2.4
      RELEASE_ID: '381599672'
      UPDATE_ASSET_ID: '541819551'
      UPDATE_BYTES: '789778'
      UPDATE_SHA256: 78ef2f2682958769604b999f8edc7ac5bd9091697e2abe8645cf31621182fedd
      CORE_UPDATES_MAIN: 163bf1a88439167f597da4c0de2671b25412ac96
    steps:
      - name: Install exact runtime prerequisites
        run: |
          set -Eeuo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y php-cli php-curl >/dev/null
          php -r 'if (!extension_loaded("curl")) exit(1);'

      - name: Restore exact v1.2.3 update client blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p05/VfSeo/PhpRuntime/CoreUpdates
          gh api "repos/llhzx2018/vf-seo/git/blobs/$PROD_GITHUB_CLIENT_BLOB" --jq .content | base64 -d > /tmp/p05/VfSeo/PhpRuntime/CoreUpdates/GitHubClient.php
          gh api "repos/llhzx2018/vf-seo/git/blobs/$PROD_UPDATE_CORE_BLOB" --jq .content | base64 -d > /tmp/p05/VfSeo/PhpRuntime/CoreUpdates/UpdateCore.php
          test -s /tmp/p05/VfSeo/PhpRuntime/CoreUpdates/GitHubClient.php
          test -s /tmp/p05/VfSeo/PhpRuntime/CoreUpdates/UpdateCore.php
          test "$(git hash-object /tmp/p05/VfSeo/PhpRuntime/CoreUpdates/GitHubClient.php)" = "$PROD_GITHUB_CLIENT_BLOB"
          test "$(git hash-object /tmp/p05/VfSeo/PhpRuntime/CoreUpdates/UpdateCore.php)" = "$PROD_UPDATE_CORE_BLOB"
          php -l /tmp/p05/VfSeo/PhpRuntime/CoreUpdates/GitHubClient.php >/dev/null
          php -l /tmp/p05/VfSeo/PhpRuntime/CoreUpdates/UpdateCore.php >/dev/null
          echo P05_V123_EXACT_UPDATE_CLIENT_BLOBS=PASS

      - name: Execute real discovery and package verification path
        run: |
          set -Eeuo pipefail
          cat > /tmp/p05/check.php <<'PHP'
          <?php
          declare(strict_types=1);
          require '/tmp/p05/VfSeo/PhpRuntime/CoreUpdates/GitHubClient.php';
          require '/tmp/p05/VfSeo/PhpRuntime/CoreUpdates/UpdateCore.php';
          use VfSeo\PhpRuntime\CoreUpdates\GitHubClient;
          use VfSeo\PhpRuntime\CoreUpdates\UpdateCore;

          $client = new GitHubClient('');
          $manifest = $client->fetchProjectManifest('llhzx2018/core-updates', 'P05.json', 'main');
          $core = new UpdateCore('P05', 'APP');
          $status = $core->check(getenv('CURRENT_VERSION'), getenv('CURRENT_SCHEMA'), $manifest);
          if (($status['status'] ?? '') !== 'AVAILABLE') {
              fwrite(STDERR, json_encode(['status'=>$status,'manifest'=>$manifest], JSON_UNESCAPED_UNICODE|JSON_PRETTY_PRINT) . "\n");
              exit(2);
          }
          foreach ([
              'current_version' => getenv('CURRENT_VERSION'),
              'target_version' => getenv('TARGET_VERSION'),
              'release_id' => (int) getenv('RELEASE_ID'),
              'asset_name' => 'VF_SEO_V1.2.4_UPDATE.zip',
              'asset_bytes' => (int) getenv('UPDATE_BYTES'),
              'asset_sha256' => getenv('UPDATE_SHA256'),
              'release_tag' => 'v1.2.4',
              'repository' => 'llhzx2018/vf-seo',
          ] as $k => $v) {
              if (($manifest[$k] ?? null) !== $v) {
                  fwrite(STDERR, "manifest mismatch $k\n");
                  exit(3);
              }
          }
          if (($manifest['from_versions'] ?? null) !== ['1.2.3'] || ($manifest['schema_from'] ?? null) !== '1' || ($manifest['schema_to'] ?? null) !== '1' || ($manifest['update_type'] ?? null) !== 'ATOMIC') exit(4);

          $found = $client->fetchReleaseAsset('llhzx2018/vf-seo', 'v1.2.4', 'VF_SEO_V1.2.4_UPDATE.zip');
          $release = $found['release'] ?? null; $asset = $found['asset'] ?? null;
          if (!is_array($release) || !is_array($asset)) exit(5);
          if ((int)($release['id'] ?? 0) !== (int)getenv('RELEASE_ID') || ($release['target_commitish'] ?? '') !== 'f752c13b44fb624924926a49197ebe9519ec3f28') exit(6);
          if ((int)($asset['id'] ?? 0) !== (int)getenv('UPDATE_ASSET_ID') || (int)($asset['size'] ?? 0) !== (int)getenv('UPDATE_BYTES') || ($asset['digest'] ?? '') !== 'sha256:' . getenv('UPDATE_SHA256')) exit(7);

          $dest = '/tmp/p05/VF_SEO_V1.2.4_UPDATE.zip';
          $client->downloadReleaseAsset('llhzx2018/vf-seo', 'v1.2.4', 'VF_SEO_V1.2.4_UPDATE.zip', $dest);
          $verified = $core->verifyPackage($dest, $manifest);
          if (($verified['status'] ?? '') !== 'VERIFIED') {
              fwrite(STDERR, json_encode($verified, JSON_UNESCAPED_UNICODE|JSON_PRETTY_PRINT) . "\n");
              exit(8);
          }
          echo json_encode([
              'project_id'=>'P05',
              'production_client_source'=>getenv('PROD_SOURCE'),
              'core_updates_main'=>getenv('CORE_UPDATES_MAIN'),
              'current_version'=>getenv('CURRENT_VERSION'),
              'target_version'=>$manifest['target_version'],
              'discovery_status'=>$status['status'],
              'package_status'=>$verified['status'],
              'asset_id'=>(int)$asset['id'],
              'asset_bytes'=>(int)$asset['size'],
              'asset_sha256'=>$manifest['asset_sha256'],
              'production_write'=>0,
              'result'=>'PASS'
          ], JSON_UNESCAPED_UNICODE|JSON_PRETTY_PRINT) . "\n";
          PHP
          php /tmp/p05/check.php | tee /tmp/p05/P05-V1.2.4-ONLINE-DISCOVERY-READBACK.json
          grep -F '"discovery_status": "AVAILABLE"' /tmp/p05/P05-V1.2.4-ONLINE-DISCOVERY-READBACK.json >/dev/null
          grep -F '"package_status": "VERIFIED"' /tmp/p05/P05-V1.2.4-ONLINE-DISCOVERY-READBACK.json >/dev/null
          echo P05_V124_ONLINE_DISCOVERY_READBACK=PASS
          echo P05_PRODUCTION_WRITE=0
