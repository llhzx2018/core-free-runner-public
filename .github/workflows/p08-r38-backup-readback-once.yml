name: P08 R38 exact-source backup readback smoke (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p08-r38-backup-readback-once.yml'
permissions:
  contents: read
jobs:
  backup-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout public-safe ephemeral test workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout exact private P08 source (runtime secret only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-adops
          ref: 452264ea53f7679ad5cf9410f89e9f164c40f5bd
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-p08
      - name: Validate source identity before any execution
        run: |
          set -euo pipefail
          test "$(git -C private-p08 rev-parse HEAD)" = '452264ea53f7679ad5cf9410f89e9f164c40f5bd'
          test "$(cat private-p08/VERSION)" = '0.1.1'
          test ! -e private-p08/.env
          test ! -e private-p08/vendor
          echo 'P08_R38_EXACT_SOURCE_IDENTITY=PASS'
      - name: PHP 8.4 native Linux runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: sodium, zip, mbstring
      - name: Read-only R38 native backup receipt, mutation refusal and real Linux UID process
        run: |
          set -euo pipefail
          cd private-p08
          php -l src/Upgrade/AtomicUpgradeArm.php
          php -l src/Upgrade/OfflineBridgeCoordinator.php
          php -l tests/test_atomic_upgrade_arm.php
          php tests/test_atomic_upgrade_arm.php
          php tests/test_cloudpanel_uid_writers.php
          python3 scripts/check_stack_contract.py --phase foundation
          echo 'P08_R38_ISOLATED_PHP84_FOCUSED_SOURCE_TEST=PASS'
          echo 'P08_R38_REAL_MARIADB_MYSQL_FULL_CONVERSION=NOT_PROVEN'
          echo 'P08_R38_REAL_CLOUDPANEL_FPM_STOP_RESTART=NOT_PROVEN'
      - name: Remove private checkout and any synthetic artifacts
        if: always()
        run: |
          rm -rf private-p08
