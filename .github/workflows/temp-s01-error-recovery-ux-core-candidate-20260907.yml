name: S01 Error Recovery UX Core Candidate
on:
  push:
    branches: [temp/s01-error-recovery-ux-code-gate-20260907]
    paths: [.github/workflows/temp-s01-error-recovery-ux-core-candidate-20260907.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      CORE_REPO: llhzx2018/core-updates
      CORE_BRANCH: work/s01-error-recovery-ux-distribution-20260907
      CORE_BASE: 36c7538c1c67bf05f6989deac4be2c64c6b6b1f8
      OPS_SHA: e00281249697d6acf4383833d800eec424fdc60c
      M3U8_SHA: f806ad64447cdd84c664dcfa19ad52ab4fd45e17
    steps:
      - name: Prepare exact two-manifest distribution candidate
        env:
          GH_TOKEN: ${{ env.READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN" && test -n "$WRITE_TOKEN"
          echo 'PRODUCT_WRITE_USED=NO RELEASE_WRITE_USED=NO PRODUCTION_WRITE_USED=NO STATIC_WRITE_USED=NO ONLINE_WRITE_USED=NO MIGRATION_USED=NO'
          git clone -q "https://x-access-token:${WRITE_TOKEN}@github.com/${CORE_REPO}.git" core
          cd core
          git checkout -q "$CORE_BRANCH"
          test "$(git rev-parse HEAD)" = "$CORE_BASE"
          test "$(git rev-parse origin/main)" = "$CORE_BASE"
          test "$(git hash-object projects/S01-C01.json)" = '356ab3d7deaeed9c55886ec8e3f6e2d82e87aa60'
          python3 - <<'PY'
          import json
          c2=json.load(open('projects/S01-C02.json')); c3=json.load(open('projects/S01-C03.json'))
          assert c2['target_version']=='1.21.857' and c2['release_tag']=='v1.21.857'
          assert c3['target_version']=='1.25.28' and c3['release_tag']=='v1.25.28'
          assert c2['physical_locator']=='vf-ops/vf-ops.php' and c2['locator_cutover'] is False
          assert c3['physical_locator']=='vf-tool-m3u8/vf-tool-m3u8.php' and c3['locator_cutover'] is False
          assert c2['schema_from']==c2['schema_to']=='6.0.0'
          assert c3['schema_from']==c3['schema_to']=='1.3.0'
          PY
          test "$(gh api repos/llhzx2018/vf-tools-ops/branches/main --jq '.commit.sha')" = "$OPS_SHA"
          test "$(gh api repos/llhzx2018/vf-tools-m3u8/branches/main --jq '.commit.sha')" = "$M3U8_SHA"
          gh api repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.858 > /tmp/ops-release.json
          gh api repos/llhzx2018/vf-tools-m3u8/releases/tags/v1.25.29 > /tmp/m3u8-release.json
          test "$(jq -r '.draft' /tmp/ops-release.json)" = false
          test "$(jq -r '.draft' /tmp/m3u8-release.json)" = false
          test "$(jq -r '.assets[]|select(.name=="vf-tools-ops_V1.21.858.zip")|.size' /tmp/ops-release.json)" = '3340234'
          test "$(jq -r '.assets[]|select(.name=="vf-tools-ops_V1.21.858.zip")|.digest' /tmp/ops-release.json)" = 'sha256:9a5000a0494e677e11c49edb415804566c54bbbca2d6c3442e4775121b73238a'
          test "$(jq -r '.assets[]|select(.name=="vf-tools-m3u8_V1.25.29.zip")|.size' /tmp/m3u8-release.json)" = '3580803'
          test "$(jq -r '.assets[]|select(.name=="vf-tools-m3u8_V1.25.29.zip")|.digest' /tmp/m3u8-release.json)" = 'sha256:faa5137db1c3afdae9a23ed14365ad6af0497ae2281b1f555d967534876a1890'
          python3 - <<'PY'
          import json
          from pathlib import Path
          def dump(path,data): Path(path).write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          p2='projects/S01-C02.json'; c2=json.load(open(p2))
          old2=c2['target_version']; assert old2=='1.21.857'
          if old2 not in c2['from_versions']: c2['from_versions'].append(old2)
          c2.update({
            'target_version':'1.21.858',
            'release_tag':'v1.21.858',
            'asset_name':'vf-tools-ops_V1.21.858.zip',
            'asset_bytes':3340234,
            'asset_sha256':'9a5000a0494e677e11c49edb415804566c54bbbca2d6c3442e4775121b73238a',
            'runtime_files':934,
            'runtime_fingerprint':'e5818323f80bb1ac37b34b1ec7e56d1615474f128eba104b59f4fcd17d4ede0a',
            'runtime_file_count':934,
            'runtime_fingerprint_sha256':'e5818323f80bb1ac37b34b1ec7e56d1615474f128eba104b59f4fcd17d4ede0a',
            'released_at':'2026-09-08T05:29:23Z',
            'notes':'S01-C02 1.21.858 ERROR RECOVERY UX CLOSURE. Exact released source e00281249697d6acf4383833d800eec424fdc60c. Recoverable admin errors now lead with administrator-facing guidance, a stable error ID and a clear return-to-workbench action; full technical diagnostics remain available only in a collapsed detail region with plugin/ABSPATH path redaction. Dashboard final selector owner, routes, updater mechanics, physical locator and schema semantics remain unchanged. Code Gate 34190295048 PASS; Bump Gate 34190403579 PASS; Post-Push Readback 34190558822 PASS; Formal Release 34190758638 PASS. Release ID 384466662; asset ID 549926581; delivered asset 3340234 bytes / SHA256 9a5000a0494e677e11c49edb415804566c54bbbca2d6c3442e4775121b73238a. Runtime Authority probe 34190893335 PASS: 934 files / e5818323f80bb1ac37b34b1ec7e56d1615474f128eba104b59f4fcd17d4ede0a. Canonical WordPress physical locator remains vf-ops/vf-ops.php with locator_cutover=false. Schema remains 6.0.0 -> 6.0.0; no migration semantics change. Direct upgrade eligibility from 1.21.849 through 1.21.857 is preserved. Publication does not claim Production, Static, Online or FINAL_ONLINE_PASS.'
          })
          assert c2['from_versions']==['1.21.849','1.21.850','1.21.851','1.21.852','1.21.853','1.21.854','1.21.855','1.21.856','1.21.857']
          dump(p2,c2)
          p3='projects/S01-C03.json'; c3=json.load(open(p3))
          old3=c3['target_version']; assert old3=='1.25.28'
          if old3 not in c3['from_versions']: c3['from_versions'].append(old3)
          c3.update({
            'target_version':'1.25.29',
            'release_tag':'v1.25.29',
            'asset_name':'vf-tools-m3u8_V1.25.29.zip',
            'asset_bytes':3580803,
            'asset_sha256':'faa5137db1c3afdae9a23ed14365ad6af0497ae2281b1f555d967534876a1890',
            'runtime_files':559,
            'runtime_fingerprint':'f9f78b4c655052482a1a806936c3f5e5d511ce7af894a5ac112eb220155f5946',
            'runtime_file_count':559,
            'runtime_fingerprint_sha256':'f9f78b4c655052482a1a806936c3f5e5d511ce7af894a5ac112eb220155f5946',
            'released_at':'2026-09-08T05:29:24Z',
            'notes':'S01-C03 1.25.29 ERROR RECOVERY UX CLOSURE. Exact released source f806ad64447cdd84c664dcfa19ad52ab4fd45e17; release round R253. Admin boot and runtime failures now reuse the final S01 Workbench recovery shell instead of a raw inline-style technical box, showing a stable error ID and safe next actions while internal logging remains intact. Provider schema remains 1.3.0 -> 1.3.0, physical locator remains vf-tool-m3u8/vf-tool-m3u8.php with locator_cutover=false, and M3U8 migration remains CLOSED. Code Gate 34190295048 PASS; Bump Gate 34190403579 PASS; Post-Push Readback 34190558822 PASS; Formal Release 34190758638 PASS. Release ID 384466668; asset ID 549926596; delivered asset 3580803 bytes / SHA256 faa5137db1c3afdae9a23ed14365ad6af0497ae2281b1f555d967534876a1890. Runtime Authority probe 34190893335 PASS: 559 files / f9f78b4c655052482a1a806936c3f5e5d511ce7af894a5ac112eb220155f5946. Direct upgrade eligibility from 1.25.20 through 1.25.28 is preserved. Publication does not claim Production, Static, Online or FINAL_ONLINE_PASS.'
          })
          assert c3['from_versions']==['1.25.20','1.25.21','1.25.22','1.25.23','1.25.24','1.25.25','1.25.26','1.25.27','1.25.28']
          dump(p3,c3)
          PY
          for f in projects/S01-C01.json projects/S01-C02.json projects/S01-C03.json; do jq -e . "$f" >/dev/null; done
          python3 scripts/check_manifest_contract.py > /tmp/contract.json
          jq -e '.status=="PASS"' /tmp/contract.json >/dev/null
          find update-core/php -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php update-core/php/tests/run.php
          test "$(git hash-object projects/S01-C01.json)" = '356ab3d7deaeed9c55886ec8e3f6e2d82e87aa60'
          git diff --name-only "$CORE_BASE" | sort > /tmp/actual
          printf '%s\n' projects/S01-C02.json projects/S01-C03.json | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          python3 - <<'PY'
          import json
          c2=json.load(open('projects/S01-C02.json'));c3=json.load(open('projects/S01-C03.json'))
          assert c2['target_version']=='1.21.858' and c2['runtime_fingerprint']=='e5818323f80bb1ac37b34b1ec7e56d1615474f128eba104b59f4fcd17d4ede0a'
          assert c3['target_version']=='1.25.29' and c3['runtime_fingerprint']=='f9f78b4c655052482a1a806936c3f5e5d511ce7af894a5ac112eb220155f5946'
          assert c2['schema_from']==c2['schema_to']=='6.0.0' and c2['locator_cutover'] is False
          assert c3['schema_from']==c3['schema_to']=='1.3.0' and c3['locator_cutover'] is False and 'migration remains CLOSED' in c3['notes']
          for c in (c2,c3): assert 'does not claim Production' in c['notes']
          PY
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add projects/S01-C02.json projects/S01-C03.json
          git commit -m 'S01: stage 1.21.858 and 1.25.29 update channel'
          git push -q origin HEAD:"$CORE_BRANCH"
          echo "CORE_CANDIDATE_HEAD=$(git rev-parse HEAD)"
          echo 'PASS_S01_ERROR_RECOVERY_CORE_CANDIDATE'
