name: S01 Theme 1.35.40 M3U8 1.25.43 Release Preflight

on:
  push:
    branches: [task/s01-theme13540-m3u812543-formal-release-20260925]
    paths:
      - '.github/workflows/s01-theme13540-m3u812543-release-preflight-20260925.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout exact Theme
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: f8b0cbc60570f01839aba238dedc0a02a3355402
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: theme

      - name: Checkout exact M3U8
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: 4b2f306fcc987e8ba133859bfc4b0a1448243167
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: m3u8

      - name: Exact source contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C theme rev-parse HEAD)" = "f8b0cbc60570f01839aba238dedc0a02a3355402"
          test "$(git -C m3u8 rev-parse HEAD)" = "4b2f306fcc987e8ba133859bfc4b0a1448243167"
          test "$(tr -d '\r\n' < theme/VERSION)" = "1.35.40"
          test "$(tr -d '\r\n' < m3u8/VERSION)" = "1.25.43"
          php theme/tests/s01-c01-admin-shell-alignment-r1-contract.php
          php theme/tests/final-admin-human-closure-contract.php
          php theme/tests/recovery-workflow-v4-contract.php
          php m3u8/tests/s01-c03-admin-shell-alignment-r1-contract.php
          php m3u8/tests/unit/admin-human-language-contract.php
          php m3u8/tests/unit/update-schema-authority-contract.php
          php m3u8/tests/unit/package-physical-locator-contract.php
          find theme/src m3u8/src -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l >/dev/null

      - name: Build deterministic exact packages
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          cat > "$RUNNER_TEMP/build.py" <<'PY'
          import hashlib,json,pathlib,re,sys,zipfile
          kind,src_s,out_s,root_name=sys.argv[1:]
          src=pathlib.Path(src_s); out=pathlib.Path(out_s)
          files=sorted((p for p in src.rglob('*') if p.is_file()),key=lambda p:p.relative_to(src).as_posix())
          def make(path):
              with zipfile.ZipFile(path,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
                  if kind=='m3u8':
                      d=zipfile.ZipInfo(root_name+'/',date_time=(1980,1,1,0,0,0)); d.external_attr=(0o40755<<16)|0x10
                      z.writestr(d,b'')
                  for p in files:
                      rel=p.relative_to(src).as_posix()
                      zi=zipfile.ZipInfo(root_name+'/'+rel,date_time=(1980,1,1,0,0,0))
                      zi.compress_type=zipfile.ZIP_DEFLATED; zi.create_system=3; zi.external_attr=0o100644<<16
                      z.writestr(zi,p.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          a=out.with_suffix('.a.zip'); b=out.with_suffix('.b.zip')
          make(a); make(b)
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          assert sha(a)==sha(b)
          out.write_bytes(a.read_bytes())
          def runtime(rel):
              if re.search(r'(^|/)(?:\.git|\.github|tests?|docs?|evidence|private|tmp|temp|cache|logs?)(/|$)',rel,re.I): return False
              base=pathlib.PurePosixPath(rel).name.lower()
              excluded={'readme.md','changelog.md','license','license.txt'}
              if kind=='m3u8': excluded.add('package_profile.json')
              if base in excluded: return False
              if re.search(r'\.(?:sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',rel,re.I): return False
              if '/' not in rel:
                  if kind=='theme': return rel=='style.css' or rel.lower().endswith('.php')
                  return rel in {'vf-tool-m3u8.php','uninstall.php','plugin-manifest.json','tool-settings.schema.json'}
              prefixes={'inc','assets','config','languages','template-parts','templates'} if kind=='theme' else {'admin','config','includes','public','templates','tools'}
              return rel.split('/',1)[0] in prefixes
          rows=[]
          for p in files:
              rel=p.relative_to(src).as_posix()
              if runtime(rel): rows.append((rel,hashlib.sha256(p.read_bytes()).hexdigest()))
          canon=''.join(rel+'\0'+h+'\n' for rel,h in rows).encode()
          meta={'kind':kind,'asset_name':out.name,'asset_bytes':out.stat().st_size,'asset_sha256':sha(out),'package_files':len(files),'runtime_files':len(rows),'runtime_fingerprint':hashlib.sha256(canon).hexdigest()}
          json.dump(meta,open(str(out)+'.json','w'),indent=2); print(json.dumps(meta))
          PY
          python3 "$RUNNER_TEMP/build.py" theme theme/src evidence/vf-tools-theme_V1.35.40.zip vf-tools-theme
          python3 "$RUNNER_TEMP/build.py" m3u8 m3u8/src evidence/vf-tools-m3u8_V1.25.43.zip vf-tool-m3u8
          unzip -t evidence/vf-tools-theme_V1.35.40.zip >/dev/null
          unzip -t evidence/vf-tools-m3u8_V1.25.43.zip >/dev/null
          unzip -p evidence/vf-tools-theme_V1.35.40.zip vf-tools-theme/style.css | grep -Fq "Version: 1.35.40"
          unzip -p evidence/vf-tools-m3u8_V1.25.43.zip vf-tool-m3u8/vf-tool-m3u8.php | grep -Fq "Version: 1.25.43"
          cat evidence/vf-tools-theme_V1.35.40.zip.json
          cat evidence/vf-tools-m3u8_V1.25.43.zip.json
          echo RELEASE_PREFLIGHT=PASS

      - name: Upload exact preflight packages
        uses: actions/upload-artifact@v4
        with:
          name: s01-13540-12543-release-preflight
          path: evidence
          retention-days: 14
