name: P01 1959 exact-source News and global modal scoped Chromium proof
on:
  push:
    branches:
      - task/p01-1959-ui-proof-20261109
permissions:
  contents: read
jobs:
  scoped-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      P01_EXACT_SHA: dbb1fcc215a1b9c789f59195c5717ddeca35fd21
      VF_NEWS_TEST_ROOT: p01-exact
      VF_NEWS_BROWSER_MODULE: /tmp/p01-1959-playwright
      PLAYWRIGHT_BROWSERS_PATH: /tmp/p01-1959-browsers
    steps:
      - name: Checkout registered public runner controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Transient exact P01 pull request source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.P01_EXACT_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p01-exact
          persist-credentials: false
          fetch-depth: 1
      - name: Prepare bounded PHP Node test runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p01-exact rev-parse HEAD)" = "$P01_EXACT_SHA"
          test "$(tr -d '\r\n ' < p01-exact/VERSION)" = 2.47.509
          test "$(tr -d '\r\n ' < p01-exact/src/VERSION.txt)" = 2.47.509
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-xml php-mbstring php-zip php-gd unzip nodejs npm >/dev/null
          php -l p01-exact/src/app/NewsFeedPage.php
          node --check p01-exact/src/assets/news-feed.js
          node --check p01-exact/src/assets/local-subsite-management.js
          node --check p01-exact/tests/browser/p01_news_r4_chromium.cjs
          echo P01_1959_EXACT_SOURCE_AND_SYNTAX=PASS
      - name: Run exact source targeted code and API regression
        shell: bash
        run: |
          set -Eeuo pipefail
          node p01-exact/tests/unit/p01_ia6_update_oneclick_modal_return_native.cjs
          node p01-exact/tests/browser/p01_news_r5_navigation_contract.cjs
          php p01-exact/tests/unit/p01_news_feed_service_contract.php
          php p01-exact/tests/unit/p01_news_source_preferences_contract.php
          php p01-exact/tests/unit/p01_news_release_surface_contract.php
          php p01-exact/tests/unit/p01_news_cross_source_dedup_native.php
          echo P01_1959_SCOPED_CODE_REGRESSION=PASS
      - name: Actual owner and guest Chromium News and modal UI
        shell: bash
        timeout-minutes: 14
        run: |
          set -Eeuo pipefail
          mkdir -p "$VF_NEWS_BROWSER_MODULE" "$PLAYWRIGHT_BROWSERS_PATH"
          npm install --no-audit --no-fund --silent --prefix "$VF_NEWS_BROWSER_MODULE" playwright@1.56.1
          "$VF_NEWS_BROWSER_MODULE/node_modules/.bin/playwright" install chromium-headless-shell
          node p01-exact/tests/browser/p01_news_r4_chromium.cjs | tee /tmp/p01-1959-browser.log
          grep -E '^P01_NEWS_R4_CHROMIUM=PASS checks=[0-9]+$' /tmp/p01-1959-browser.log
          echo P01_1959_NEWS_AND_MODAL_CHROMIUM=PASS
      - name: Clean transient private checkout
        if: always()
        shell: bash
        run: |
          rm -rf p01-exact "$VF_NEWS_BROWSER_MODULE" "$PLAYWRIGHT_BROWSERS_PATH" /tmp/p01-1959-browser.log
          echo P01_1959_PRIVATE_CHECKOUT_CLEANED=YES
