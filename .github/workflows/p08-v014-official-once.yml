name: P08 v014 final once-only official GitHub Release after verified native gates
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p08-v014-official-once.yml
permissions:
  contents: read
jobs:
  issue-official-once:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'release/p08-v014-official-one-shot-20261120' && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact final P08 main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 6fae792864a594465e4b3224bd6d73abde976f12
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
      - name: Checkout exact effective GOV Mode V
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: ec0af1f62f9056e3159c0c1fb2cb65fbc6576683
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov
      - name: PHP 8.4 and locked source builder
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: zip,curl,mbstring,pdo_mysql,pdo_sqlite,sqlite3,openssl,posix,dom,intl,fileinfo
          coverage: none
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all existing required real machine runs and live publishing safety
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,subprocess,os
          def require(ok,code):
              if not ok: raise RuntimeError('P08_V014_ISSUE_STOP_'+code)
          def api(path):
              p=subprocess.run(['gh','api',path],text=True,capture_output=True,timeout=90)
              require(p.returncode==0,'REMOTE_READ_'+path.rsplit('/',1)[-1])
              try: return json.loads(p.stdout)
              except ValueError: raise RuntimeError('P08_V014_ISSUE_STOP_INVALID_REMOTE_JSON')
          require(os.environ.get('GITHUB_ACTIONS')=='true' and len(os.environ.get('GH_TOKEN',''))>=20,'MISSING_APPROVED_RUNTIME_CREDENTIAL')
          runmap={
            44759432559:('ff5cda6b378f9159654c447bd01b5f247ecf7250',3),
            44759788077:('db1df8dc42f6cc91899db57c2717e8f7e27a12e5',3),
            44760621232:('16f4ad39a786af525e95b44b9bd240d62b99da29',3),
            44765877427:('c25abc90c96e9137be74510ea984e62cc104f956',3),
            44767300353:('da17c85a4d19a065b245575cb2f4cf092137b062',1),
          }
          for n,(sha,count) in runmap.items():
              url='repos/llhzx2018/core-free-runner-public/actions/runs/'+str(n)
              run=api(url)
              require(run.get('head_sha')==sha and run.get('conclusion')=='success','PROOF_IDENTITY_'+str(n))
              jobs=api(url+'/jobs?per_page=100').get('jobs',[])
              require(len(jobs)==count and all(j.get('conclusion')=='success' for j in jobs),'PROOF_JOB_FAIL_'+str(n))
          prod='repos/llhzx2018/vf-adops'
          gov='repos/llhzx2018/gov-doc'
          upd='repos/llhzx2018/core-updates'
          require(api(prod+'/git/ref/heads/main')['object']['sha']=='6fae792864a594465e4b3224bd6d73abde976f12','PRODUCT_MAIN_MOVED')
          require(api(gov+'/git/ref/heads/main')['object']['sha']=='ec0af1f62f9056e3159c0c1fb2cb65fbc6576683','GOV_MAIN_MOVED')
          require(api(upd+'/contents/projects/P08-ADOPS.json?ref=main')['sha']=='288f2692060601c2493864de4b1323bbafeb6ce5','OLD_CHANNEL_CHANGED')
          old=api(prod+'/releases/tags/v0.1.13')
          require(old.get('id')==452233612 and old.get('draft') is False and old.get('prerelease') is False,'ISSUED_OLD_RELEASE_CHANGED')
          assets={a.get('name'):a for a in old.get('assets',[])}
          require(assets.get('VF_AdOps_V0.1.13_FULL.zip',{}).get('id')==770296940,'ISSUED_OLD_FULL_ID_CHANGED')
          require(api(prod+'/git/ref/tags/v0.1.13')['object']['sha']=='8b385fecd132a02ac79f5b67e670783e98997c3e','ISSUED_OLD_TAG_CHANGED')
          for path in (prod+'/git/ref/tags/v0.1.14',prod+'/releases/tags/v0.1.14'):
              r=subprocess.run(['gh','api',path],capture_output=True,text=True,timeout=40)
              require(r.returncode!=0 and ('HTTP 404' in r.stderr or 'Not Found' in r.stderr),'TARGET_TAG_OR_RELEASE_ALREADY_EXISTS_OR_UNVERIFIED')
          print('P08_V014_ISSUE_PREPUBLICATION_ALL_3DB_BROWSER_FAULT_13DOMAIN_FINAL_PACKAGE=PASS')
          print('P08_V014_ISSUE_MAIN_GOV_PREVIOUS_TAG_CHANNEL_ABSENCE=PASS')
          PY
      - name: Build immutable true FULL UPDATE twice and provenance from exact final source
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(id -u)" -ne 0
          test "$(git -C target rev-parse HEAD)" = 6fae792864a594465e4b3224bd6d73abde976f12
          test "$(git -C target rev-parse HEAD^{tree})" = 52c5efd04dfa895bff56fc4d7467dd4fca21f952
          test "$(git -C gov rev-parse HEAD)" = ec0af1f62f9056e3159c0c1fb2cb65fbc6576683
          test "$(cat target/VERSION)" = 0.1.14
          grep -Fq '| skill-release | V3.21 |' gov/CURRENT.md
          grep -Fq '## RP-07V' target/docs/authority/ACCEPTANCE_MATRIX.md
          tmp="$RUNNER_TEMP/p08-v014-immutable-issue"
          test ! -e "$tmp" && ! -L "$tmp"
          mkdir -m 700 "$tmp"
          curl -fsSL --retry 2 --max-time 100 \
            -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/octet-stream' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/llhzx2018/vf-adops/releases/assets/770296940 \
            -o "$tmp/previous-full.zip"
          test "$(sha256sum "$tmp/previous-full.zip" | cut -d' ' -f1)" = f8075f065d1413c984f80ef7531242cfc894bf272e90f6d89282074f6617c1ec
          unzip -p "$tmp/previous-full.zip" FULL_MANIFEST.json > "$tmp/previous-manifest.json"
          test "$(sha256sum "$tmp/previous-manifest.json" | cut -d' ' -f1)" = c7ea39bba377507c335031801a7f1d193de0ddd04715547abdb067928ef7cd5d
          npm ci --prefix target --ignore-scripts --no-fund --no-audit > "$tmp/node.log" 2>&1
          npm run build --prefix target >> "$tmp/node.log" 2>&1
          composer --working-dir=target install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress --optimize-autoloader > "$tmp/composer.log" 2>&1
          python3 -B target/scripts/check_stack_contract.py --phase full --root target
          (
            cd target
            git diff --exit-code && git diff --cached --exit-code
            for f in $(git ls-files --others --exclude-standard); do
              case "$f" in
                bootstrap/cache/packages.php|bootstrap/cache/services.php)
                  test -f "$f" && ! test -L "$f" && rm -- "$f";;
                *) echo P08_V014_ISSUE_UNEXPECTED_SOURCE; exit 27;;
              esac
            done
            test -z "$(git status --porcelain --untracked-files=all)"
          )
          for part in first second; do
            python3 -B target/scripts/build_full.py \
              --source "$GITHUB_WORKSPACE/target" --output "$tmp/full-$part.zip" \
              --version 0.1.14 --source-sha 6fae792864a594465e4b3224bd6d73abde976f12 \
              --governance-root "$GITHUB_WORKSPACE/gov"
            python3 -B target/scripts/build_atomic.py \
              --source "$GITHUB_WORKSPACE/target" --output "$tmp/update-$part.zip" \
              --source-version 0.1.13 --source-sha 8b385fecd132a02ac79f5b67e670783e98997c3e \
              --source-full-manifest-sha256 c7ea39bba377507c335031801a7f1d193de0ddd04715547abdb067928ef7cd5d \
              --previous-full-manifest "$tmp/previous-manifest.json" \
              --target-version 0.1.14 --target-sha 6fae792864a594465e4b3224bd6d73abde976f12
          done
          cmp "$tmp/full-first.zip" "$tmp/full-second.zip"
          cmp "$tmp/update-first.zip" "$tmp/update-second.zip"
          test "$(sha256sum "$tmp/full-first.zip" | cut -d' ' -f1)" = 2b8023a1c67213dbebb8f7047f27debbccc0f00fb210d10aeb3dc703076a811b
          test "$(sha256sum "$tmp/update-first.zip" | cut -d' ' -f1)" = 7177496dc9322ded6c3fa53aa2c0a7eb5ac1f015531516b829d7c4d71e6e80af
          mv "$tmp/full-first.zip" "$tmp/VF_AdOps_V0.1.14_FULL.zip"
          mv "$tmp/update-first.zip" "$tmp/VF_AdOps_V0.1.14_UPDATE.zip"
          rm "$tmp/full-second.zip" "$tmp/update-second.zip"
          unzip -tqq "$tmp/VF_AdOps_V0.1.14_FULL.zip"
          unzip -tqq "$tmp/VF_AdOps_V0.1.14_UPDATE.zip"
          cat > "$tmp/RELEASE_NOTES.md" <<'NOTES'
          # VF AdOps v0.1.14 — 原生后台一键 Atomic 与历史升级来源

          全新空站使用 FULL；真实已发行 v0.1.13 通过原有后台「检查官方更新」与「一键安全升级」主动触发备份优先的 code-only Atomic。页面打开不自动检查/下载/安装。

          本次 Atomic 唯一允许的旧版为 v0.1.13，源码 SHA 8b385fecd132a02ac79f5b67e670783e98997c3e，当前实际 FULL_MANIFEST SHA-256 c7ea39bba377507c335031801a7f1d193de0ddd04715547abdb067928ef7cd5d，Schema 1.1；真实旧版 FULL、v0.1.9→v0.1.10→v0.1.12→v0.1.13 的已验证历史 Atomic 来源最终使用同一清单。其它旧版、未知来源、私改清单不受支持，不得用 FULL 覆盖已有数据。

          原生 SQLite WAL、MySQL 8.4、MariaDB 11.8、原始旧客户端 HTTPS Chromium 一键升级、备份恢复/失败回滚/SIGKILL137、数据/Token/媒体保留及 13 域适用门禁已通过精确源码隔离机验。Owner 本人 Preview/Real Use 按 Mode V 后置，尚未亲自验收。Production、CloudPanel、DNS、SSL 由 Owner 手动操作。
          NOTES
          python3 - "$tmp" <<'PY'
          import hashlib,json,sys,zipfile
          from pathlib import Path
          root=Path(sys.argv[1])
          full='VF_AdOps_V0.1.14_FULL.zip'
          update='VF_AdOps_V0.1.14_UPDATE.zip'
          sha=lambda s:hashlib.sha256((root/s).read_bytes()).hexdigest()
          with zipfile.ZipFile(root/full) as z:
            m=json.loads(z.read('FULL_MANIFEST.json'))
            assert m['type']=='CLEAN_FULL_ONLY' and m['data_included'] is False
            assert m['source_sha']=='6fae792864a594465e4b3224bd6d73abde976f12'
            assert m['target_version']=='0.1.14' and len(m['files'])>6100 and z.testzip() is None
          with zipfile.ZipFile(root/update) as z:
            m=json.loads(z.read('ATOMIC_MANIFEST.json'))
            assert m['type']=='P08_ATOMIC_CODE_ONLY_V1'
            assert m['source_version']=='0.1.13' and m['source_sha']=='8b385fecd132a02ac79f5b67e670783e98997c3e'
            assert m['source_full_manifest_sha256']=='c7ea39bba377507c335031801a7f1d193de0ddd04715547abdb067928ef7cd5d'
            assert m['target_version']=='0.1.14' and m['target_sha']=='6fae792864a594465e4b3224bd6d73abde976f12'
            assert m['schema_changes'] is False and len(m['files'])>6100 and z.testzip() is None
          assert sha(full)=='2b8023a1c67213dbebb8f7047f27debbccc0f00fb210d10aeb3dc703076a811b'
          assert sha(update)=='7177496dc9322ded6c3fa53aa2c0a7eb5ac1f015531516b829d7c4d71e6e80af'
          provenance=dict(project_id='P08',repository='llhzx2018/vf-adops',
            source_version='0.1.13',source_sha='8b385fecd132a02ac79f5b67e670783e98997c3e',
            source_full_manifest_sha256='c7ea39bba377507c335031801a7f1d193de0ddd04715547abdb067928ef7cd5d',
            target_version='0.1.14',target_sha='6fae792864a594465e4b3224bd6d73abde976f12',
            target_tree_sha='52c5efd04dfa895bff56fc4d7467dd4fca21f952',
            governance_sha='ec0af1f62f9056e3159c0c1fb2cb65fbc6576683',
            full_sha256=sha(full),atomic_sha256=sha(update),
            schema_changes=False,data_included=False,schema_from='1.1',schema_to='1.1',
            backup_required=True,rollback_supported=True,production_auto_apply=False,
            native_three_db_run=44765877427,final_source_package_run=44767300353,
            owner_preview='POST_RELEASE_REQUIRED_NOT_PASS',
            owner_real_use='POST_OWNER_MANUAL_PRODUCTION_REQUIRED_NOT_PASS')
          (root/'RELEASE_PROVENANCE.json').write_text(json.dumps(provenance,sort_keys=True,indent=2)+'\n')
          names=[full,update,'RELEASE_PROVENANCE.json','RELEASE_NOTES.md']
          (root/'SHA256SUMS').write_text(''.join(sha(n)+'  '+n+'\n' for n in names))
          print('P08_V014_FINAL_OFFICIAL_BUILD_INPUTS=VERIFIED')
          PY
      - name: Official one-time GitHub Release followed by immutable remote bytes readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          P08_V014_RELEASE_ONCE: YES
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          python3 - <<'PY'
          import json,hashlib,subprocess,os,sys
          from pathlib import Path
          def die(code):raise RuntimeError('P08_V014_ISSUE_STOP_'+code)
          def req(ok,code):
            if not ok:die(code)
          def cmd(*args):
            p=subprocess.run(args,capture_output=True,text=True,timeout=200)
            if p.returncode!=0:die('COMMAND_FAILED_'+args[0].upper().replace('-','_'))
            return p.stdout.strip()
          def api(path):return json.loads(cmd('gh','api',path))
          req(os.getenv('GITHUB_ACTIONS')=='true' and os.getenv('P08_V014_RELEASE_ONCE')=='YES','UNAUTHORIZED')
          root=Path(os.environ['RUNNER_TEMP'])/'p08-v014-immutable-issue'
          names=['VF_AdOps_V0.1.14_FULL.zip','VF_AdOps_V0.1.14_UPDATE.zip','RELEASE_PROVENANCE.json','RELEASE_NOTES.md','SHA256SUMS']
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          req(all((root/n).is_file() and not (root/n).is_symlink() for n in names),'FILES_MISSING')
          sums=set((root/'SHA256SUMS').read_text().splitlines())
          req(sums=={sha(root/n)+'  '+n for n in names[:-1]},'CHECKSUM_LIST')
          req(sha(root/names[0])=='2b8023a1c67213dbebb8f7047f27debbccc0f00fb210d10aeb3dc703076a811b','FINAL_FULL_SHA')
          req(sha(root/names[1])=='7177496dc9322ded6c3fa53aa2c0a7eb5ac1f015531516b829d7c4d71e6e80af','FINAL_ATOMIC_SHA')
          req(api('repos/llhzx2018/vf-adops/git/ref/heads/main')['object']['sha']=='6fae792864a594465e4b3224bd6d73abde976f12','MAIN_MOVED')
          req(api('repos/llhzx2018/gov-doc/git/ref/heads/main')['object']['sha']=='ec0af1f62f9056e3159c0c1fb2cb65fbc6576683','GOV_MOVED')
          req(api('repos/llhzx2018/core-updates/contents/projects/P08-ADOPS.json?ref=main')['sha']=='288f2692060601c2493864de4b1323bbafeb6ce5','CHANNEL_MOVED')
          for url in ('repos/llhzx2018/vf-adops/git/ref/tags/v0.1.14','repos/llhzx2018/vf-adops/releases/tags/v0.1.14'):
            p=subprocess.run(['gh','api',url],capture_output=True,text=True,timeout=30)
            req(p.returncode!=0 and ('HTTP 404' in p.stderr or 'Not Found' in p.stderr),'TAG_ALREADY_EXISTS_OR_ACCESS_PROBLEM')
          cmd('gh','release','create','v0.1.14',*(str(root/n) for n in names),
            '-R','llhzx2018/vf-adops','--target','6fae792864a594465e4b3224bd6d73abde976f12',
            '--title','VF AdOps v0.1.14 — Native Owner Atomic',
            '--notes-file',str(root/'RELEASE_NOTES.md'))
          product='repos/llhzx2018/vf-adops'
          release=api(product+'/releases/tags/v0.1.14')
          req(release.get('tag_name')=='v0.1.14' and release.get('id',0)>0
              and release.get('draft') is False and release.get('prerelease') is False,
              'REMOTE_RELEASE_IDENTITY')
          req(api(product+'/git/ref/tags/v0.1.14')['object']['sha']=='6fae792864a594465e4b3224bd6d73abde976f12','REMOTE_TAG_SHA')
          assets={a.get('name'):a for a in release.get('assets',[])}
          req(set(assets)==set(names),'REMOTE_ASSET_SET')
          for name in names:
            a=assets[name];p=root/name
            req(isinstance(a.get('id'),int) and a['id']>0 and a.get('size')==p.stat().st_size,'REMOTE_SIZE_OR_ID')
            req(a.get('digest') in (None,'sha256:'+sha(p)),'REMOTE_DIGEST')
          dest=root/'remote';dest.mkdir(mode=0o700)
          cmd('gh','release','download','v0.1.14','-R','llhzx2018/vf-adops','-D',str(dest))
          req({p.name for p in dest.iterdir()}==set(names),'REMOTE_DOWNLOAD_SET')
          for name in names:req(sha(dest/name)==sha(root/name),'REMOTE_ASSET_BYTES')
          req(api('repos/llhzx2018/core-updates/contents/projects/P08-ADOPS.json?ref=main')['sha']=='288f2692060601c2493864de4b1323bbafeb6ce5','CHANNEL_PREMATURE_WRITE')
          print('P08_V014_OFFICIAL_RELEASE_ASSETS_REMOTE_REDOWNLOAD=PASS')
          print('P08_V014_RELEASE_ID='+str(release['id']))
          print('P08_V014_FULL_ASSET_ID='+str(assets[names[0]]['id']))
          print('P08_V014_FULL_BYTES='+str((root/names[0]).stat().st_size))
          print('P08_V014_UPDATE_ASSET_ID='+str(assets[names[1]]['id']))
          print('P08_V014_UPDATE_BYTES='+str((root/names[1]).stat().st_size))
          print('P08_V014_PRODUCTION_CLOUDPANEL_DNS=UNTOUCHED')
          PY
      - name: Always erase all source, secrets-bearing private test inputs and packages
        if: always()
        shell: bash
        run: |
          rm -rf -- target gov "$RUNNER_TEMP/p08-v014-immutable-issue"
          test ! -e target && test ! -e gov
          echo P08_V014_ISSUANCE_PRIVATE_CLEANUP=PASS
