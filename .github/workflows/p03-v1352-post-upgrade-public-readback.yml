name: P03 V1.35.2 Post-Upgrade Public Readback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p03-v1352-post-upgrade-public-readback.yml'

permissions:
  contents: read

concurrency:
  group: p03-v1352-post-upgrade-public-readback
  cancel-in-progress: false

jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Public root and anonymous session boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT='https://forge.kewaro.com'
          curl --fail --silent --show-error --location --max-time 20 -D "$RUNNER_TEMP/root.headers" "$ROOT/" -o "$RUNNER_TEMP/root.html"
          test -s "$RUNNER_TEMP/root.html"
          SESSION="$(curl --fail --silent --show-error --max-time 20 "$ROOT/api.php?action=session")"
          printf '%s' "$SESSION" | jq -e '.ok==true and .installed==true and .authenticated==false' >/dev/null
          echo 'APPLICATION_ROOT_HTTP=PASS'
          echo 'ANONYMOUS_SESSION_BOUNDARY=PASS'

      - name: Actual Production MCP runtime identity
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT='https://forge.kewaro.com'
          BODY="$RUNNER_TEMP/mcp-initialize.json"
          CODE="$(curl --silent --show-error --max-time 20 -o "$BODY" -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"p03-post-upgrade-readback","version":"1"}}}' \
            "$ROOT/mcp/index.php")"
          test "$CODE" = '200'
          jq -e '.jsonrpc=="2.0" and .result.serverInfo.name=="VF Forge" and .result.serverInfo.version=="1.35.2"' "$BODY" >/dev/null
          echo 'PRODUCTION_VERSION=1.35.2'
          echo 'MCP_RUNTIME_BOOT=PASS'
          echo 'PRODUCTION_DATABASE_OPEN=PASS'

      - name: Anonymous business access remains fail-closed
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT='https://forge.kewaro.com'
          BODY="$RUNNER_TEMP/mcp-tools-list.json"
          CODE="$(curl --silent --show-error --max-time 20 -o "$BODY" -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            "$ROOT/mcp/index.php")"
          test "$CODE" = '401'
          jq -e '.jsonrpc=="2.0" and .error.code==-32001' "$BODY" >/dev/null
          echo 'ANONYMOUS_BUSINESS_READ=DENIED_AS_REQUIRED'
          echo 'PRIVATE_BUSINESS_BOUNDARY=PASS'

      - name: Maintenance source manifest remains admin-protected
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT='https://forge.kewaro.com'
          CODE="$(curl --silent --show-error --max-time 20 -o "$RUNNER_TEMP/manifest-anon.out" -w '%{http_code}' "$ROOT/maintenance.php?action=source-manifest")"
          test "$CODE" != '200'
          echo 'PRODUCTION_SOURCE_MANIFEST_ANON=DENIED_AS_REQUIRED'
          echo 'ADMIN_BOUNDARY=PASS'

      - name: Publish privacy-safe summary
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo '### P03 V1.35.2 Post-Upgrade Public Readback'
            echo '- Application Root HTTP: PASS'
            echo '- Production Version via MCP Runtime: 1.35.2'
            echo '- MCP Runtime Boot: PASS'
            echo '- Production DB Open: PASS'
            echo '- Anonymous Session Boundary: PASS'
            echo '- Anonymous Business Read: DENIED / PASS'
            echo '- Production Source Manifest Anonymous Access: DENIED / PASS'
            echo '- Production Write: 0'
            echo '- Private Data Read: 0'
          } >> "$GITHUB_STEP_SUMMARY"
          echo 'P03_POST_UPGRADE_PUBLIC_READBACK=PASS'
          echo 'PRODUCTION_WRITE=0'
          echo 'PRIVATE_DATA_READ=0'
