name: S01 C03 playlist checker result copy 20261012
on:
  pull_request:
    paths:
      - '.github/workflows/s01-c03-checker-result-copy-20261012.yml'
permissions:
  contents: read
jobs:
  checker:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SOURCE_SHA: 48ace4aca992024dc7f32cca7884aaef3744ad1d
      SOURCE_TREE: 86e36f8441cf1101b24eff9b7feda5bfb7ee7e59
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: 48ace4aca992024dc7f32cca7884aaef3744ad1d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: private-source
          persist-credentials: false
      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C private-source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C private-source rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          mkdir -p proof
          python - <<'PY'
          import json,os
          with open('proof/IDENTITY.json','w') as f:
              json.dump({'sourceSha':os.environ['SOURCE_SHA'],'sourceTree':os.environ['SOURCE_TREE'],'scope':'isolated public checker copy only','productionWrites':False},f,indent=2)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tooling
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/checker-browser" playwright@1.58.2
          node "$RUNNER_TEMP/checker-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Execute syntax parser and actual renderer browser regressions
        shell: bash
        run: |
          set -euo pipefail
          cd private-source
          php -n -l src/includes/renderers/raw-playlist-checker.php
          php -n -l tests/fixtures/playlist-checker-result-copy.php
          node --check src/public/js/modules/playlist-checker.js
          node --check src/public/dist/playlist-checker.js
          node tests/playlist-checker-diagnostic-safety.node.cjs | tee ../proof/DIAGNOSTICS.txt
          NODE_PATH="$RUNNER_TEMP/checker-browser/node_modules" node tests/playlist-checker-result-copy.browser.cjs > ../proof/BROWSER.json
          python - <<'PY'
          import json
          p=json.load(open('../proof/BROWSER.json'))
          assert len(p['cases'])==12 and all(c['state']=='PASS' for c in p['cases'])
          print('PASS 12 bilingual source/dist browser cases')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-c03-checker-result-copy-20261012
          path: proof/
          if-no-files-found: error
      - name: Remove transient private checkout
        if: always()
        shell: bash
        run: rm -rf private-source
