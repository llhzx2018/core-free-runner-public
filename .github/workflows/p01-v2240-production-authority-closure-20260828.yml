name: P01 V2.24.0 Production Authority Closure
on:
  push:
    paths: ['.github/workflows/p01-v2240-production-authority-closure-20260828.yml']
permissions:
  contents: read
jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: closure/p01-v2.24.0-production-20260828
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
      - name: Exact main and production evidence fence
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = c299c313559bbb4f58d9a7180fb482fae7ced67a
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = c299c313559bbb4f58d9a7180fb482fae7ced67a
          gh api repos/llhzx2018/vf-start/releases/378353376 | jq -e '.tag_name=="v2.24.0" and .draft==false and .prerelease==false and .target_commitish=="867e3387b8efb70398287d05fd3652540efa77c8"' >/dev/null
          gh api repos/llhzx2018/vf-start/git/ref/tags/v2.24.0 | jq -e '.object.sha=="867e3387b8efb70398287d05fd3652540efa77c8"' >/dev/null
          echo P01_V2240_PRODUCTION_EVIDENCE_FENCE=PASS
      - name: Update authority only
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('VF_PROJECT.json')
          d=json.loads(p.read_text())
          d['status']='V2.24.0 OWNER PRODUCTION / FORMAL RELEASE CURRENT'
          d['production_version']='2.24.0'
          d['working_version']='2.24.0'
          d['target_release_version']='2.24.0'
          d['current_phase']='V2.24.0 RELEASE + OWNER PRODUCTION CLOSED'
          d['production_release']={
            'version':'2.24.0','tag':'v2.24.0','release_id':378353376,
            'release_source':'867e3387b8efb70398287d05fd3652540efa77c8',
            'release_tree':'5985dab8ee071c881fd1e425864ed363e3bdc905',
            'runtime_merge':'c299c313559bbb4f58d9a7180fb482fae7ced67a',
            'schema_version':'2026082801',
            'production_upgrade':'PASS / OWNER UI 2026-08-28 16:43:11 +08:00',
            'production_baseline':'PASS / 88 checks / DRIFT 0 / UNKNOWN 0 / OWNER UI 2026-08-28 16:44 +08:00'
          }
          d['formal_release']={
            'version':'2.24.0','tag':'v2.24.0','release_id':378353376,
            'release_source':'867e3387b8efb70398287d05fd3652540efa77c8',
            'release_tree':'5985dab8ee071c881fd1e425864ed363e3bdc905',
            'main_merge':'c299c313559bbb4f58d9a7180fb482fae7ced67a',
            'schema_version':'2026082801','source_schema_version':'2026082801',
            'release_exact_source_gate':33155395660,
            'formal_artifact_gate':33155651293,
            'main_promotion_gate':33155726629,
            'publication_closure':33156042717,
            'core_updates_target':'2.24.0',
            'core_updates_commit':'8cbf4386c481e7fd658c0326cdaefa057da0b49e',
            'online_updater':{
              'status':'PASS / PUBLISHED / OWNER UPGRADE PASS','from_version':'2.23.0',
              'asset_name':'VF_Start_V2.24.0_UPDATE.zip','asset_bytes':1210247,
              'asset_sha256':'7a8125cbb52fa7693db39dde686f0ae2250c7eb87d08942e3022c209bec8c3ca',
              'inner_repair_name':'repair-v2.24.0.php','schema_change':False,
              'actual_updater_upgrade_gate':'PASS','remote_asset_readback':'PASS'
            },'status':'PASS'
          }
          d['candidate_version']='2.24.0'
          d['candidate_schema_version']='2026082801'
          d['candidate_state']='PROMOTED / RELEASED / OWNER PRODUCTION PASS'
          d['current_authority']='Owner Production V2.24.0 / Schema 2026082801; formal Release v2.24.0 PASS; online upgrade 2.23.0 -> 2.24.0 SUCCESS; System Baseline V2.0 owner UI PASS / 88 checks / DRIFT 0 / UNKNOWN 0.'
          d['next_action']='P01 closed; no further P01 action unless a real regression is observed.'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          Path('docs/authority/CURRENT.md').write_text('''# P01 · VF Start · Current Authority\n\n> 更新时间：2026-08-28\n> 状态：`CURRENT / V2.24.0 OWNER PRODUCTION / FORMAL RELEASE PASS`\n\n## 1. Current Truth\n\n```text\nOwner Production Runtime: V2.24.0\nOwner Production Schema: 2026082801\nOwner Upgrade: 2.23.0 -> 2.24.0 / SUCCESS / 2026-08-28 16:43:11 +08:00\nOwner Online Update UI: Current V2.24.0 / Latest V2.24.0 / UP TO DATE\nOwner System Baseline UI: V2.0 / 88 checks / DRIFT 0 / UNKNOWN 0 / CURRENT NORMAL\nFormal Release: V2.24.0 / PASS\nRelease ID: 378353376\nRelease Exact Source: 867e3387b8efb70398287d05fd3652540efa77c8\nRelease Tree: 5985dab8ee071c881fd1e425864ed363e3bdc905\nCurrent main: c299c313559bbb4f58d9a7180fb482fae7ced67a\nSchema Change: NO\nProduction: PASS / OWNER CONFIRMED\n```\n\nP01 当前产品裁决保持不变：**一个系统、一个数据 Authority、多个资源模式**。Home / Start / Channels / Watch / 资源整理共用统一产品壳；历史 URL 不静默迁移，归属建议必须由管理员显式确认。\n\n## 2. Formal Release / Publication Evidence\n\n```text\nTag: v2.24.0\nRelease ID: 378353376\nRelease Source Gate: 33155395660 / PASS\nFormal Artifact Gate: 33155651293 / PASS\nMain Promotion Gate: 33155726629 / PASS\nPublication Closure: 33156042717 / PASS\nOnline Asset: VF_Start_V2.24.0_UPDATE.zip\nOnline Asset Bytes: 1210247\nOnline Asset SHA-256: 7a8125cbb52fa7693db39dde686f0ae2250c7eb87d08942e3022c209bec8c3ca\ncore-updates target: 2.24.0\ncore-updates commit: 8cbf4386c481e7fd658c0326cdaefa057da0b49e\n```\n\n## 3. Owner Production Evidence\n\nOwner 于 2026-08-28 提供真实 Production 后台截图：\n\n- 在线升级页面显示当前版本 `V2.24.0`；\n- 最新版本 `V2.24.0`；\n- 更新记录 `2.23.0 -> 2.24.0 / success / 2026-08-28 16:43:11`；\n- 页面状态为“已是最新版本”；\n- System Baseline 页面显示统一规范 `V2.0`、个人单管理员模式、正常项目 `88`、需要处理 `0`、暂时无法确认 `0`；\n- 总状态为“系统关键规则正常 / 当前正常”。\n\n该截图为 Owner Production Evidence，不替代机器 Gate；机器 Gate 与 Owner Runtime Evidence 均已成立。\n\n## 4. Closure\n\nV2.24.0 已完成：Source Gate → Artifact Gate → Main Promotion → GitHub Release / Tag / core-updates → Owner Online Upgrade → Owner System Baseline Readback。\n\n**P01 V2.24.0 Release + Production + Authority = COMPLETE.**\n\n除非出现真实回归，不再继续修改 P01。\n''')
          PY
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx 'VF_PROJECT.json' >/dev/null
          printf '%s\n' "${changed[@]}" | grep -Fx 'docs/authority/CURRENT.md' >/dev/null
          git diff --check
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VF_PROJECT.json docs/authority/CURRENT.md
          git commit -m 'docs(P01): close V2.24.0 production promotion'
          git push origin HEAD:closure/p01-v2.24.0-production-20260828
          echo P01_V2240_AUTHORITY_DOCS_ONLY=PASS
      - name: Readback
        run: |
          set -Eeuo pipefail
          git fetch origin closure/p01-v2.24.0-production-20260828 main
          test "$(git diff --name-only origin/main..origin/closure/p01-v2.24.0-production-20260828 | wc -l)" -eq 2
          grep -F 'V2.24.0 OWNER PRODUCTION' docs/authority/CURRENT.md >/dev/null
          grep -F 'P01 V2.24.0 Release + Production + Authority = COMPLETE' docs/authority/CURRENT.md >/dev/null
          python3 - <<'PY'
          import json
          d=json.load(open('VF_PROJECT.json'))
          assert d['production_version']=='2.24.0'
          assert d['formal_release']['release_id']==378353376
          assert d['production_release']['production_upgrade'].startswith('PASS')
          PY
          echo P01_V2240_PRODUCTION_AUTHORITY_CLOSURE=PASS
