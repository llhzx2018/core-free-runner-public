name: P01 V2.33 Post Release Develop Sync
on:
  push:
    branches: [task/p01-v2330-formal-release-20260830]
    paths: [.github/workflows/p01-v2330-post-release-develop-sync-20260830.yml]
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fast-forward develop to release-closed main
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf product
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/vf-start.git" product
          git -C product fetch -q origin main develop --tags
          MAIN=$(git -C product rev-parse origin/main)
          DEVELOP=$(git -C product rev-parse origin/develop)
          test "$MAIN" = f10a2deabf203b1f99db28251314268b3be89b44
          test "$DEVELOP" = 8c819c8bfd055d16b3ac367cef15f723431d9a42
          test "$(git -C product merge-base "$MAIN" "$DEVELOP")" = "$DEVELOP"
          test "$(git -C product rev-parse "$MAIN:src")" = febc1b01a5b59963bc974cdc6455cfa824c0adc3
          test "$(git -C product rev-parse "$DEVELOP:src")" = febc1b01a5b59963bc974cdc6455cfa824c0adc3
          test "$(git -C product rev-parse refs/tags/v2.33.0)" = 8c819c8bfd055d16b3ac367cef15f723431d9a42
          git -C product push "https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/vf-start.git" "$MAIN":refs/heads/develop
          git -C product fetch -q origin develop
          test "$(git -C product rev-parse origin/develop)" = "$MAIN"
          test "$(git -C product rev-parse origin/develop:src)" = febc1b01a5b59963bc974cdc6455cfa824c0adc3
          echo P01_V2330_MAIN_DEVELOP_SYNC=PASS
          echo MAIN_DEVELOP=f10a2deabf203b1f99db28251314268b3be89b44
          echo RUNTIME_TREE=febc1b01a5b59963bc974cdc6455cfa824c0adc3
          echo TAG_SOURCE=8c819c8bfd055d16b3ac367cef15f723431d9a42
          echo OWNER_PRODUCTION_WRITE=NO
