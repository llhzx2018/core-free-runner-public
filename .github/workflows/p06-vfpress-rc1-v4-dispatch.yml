name: P06 VF Press RC1 V4 Dispatcher

on:
  push:
    branches: [main]
    paths:
      - 'requests/p06-vfpress-rc1-v4-dispatch-*.txt'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch isolated final V4 workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run p06-vfpress-mvp-rc1-final-v4.yml --repo llhzx2018/core-free-runner-public --ref main
