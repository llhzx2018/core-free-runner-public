name: S01 Error Recovery UX Formal Release
on:
  push:
    branches: [temp/s01-error-recovery-ux-code-gate-20260907]
    paths: [.github/workflows/temp-s01-error-recovery-ux-formal-release-20260907.yml]
permissions:
  contents: read
concurrency:
  group: s01-error-recovery-ux-formal-release-20260907
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      C02_SHA: e00281249697d6acf4383833d800eec424fdc60c
      C02_BASE: 3e873a80ff6d3defdc31a3d7b4f9574e8b84cfcb
      C03_SHA: f806ad64447cdd84c664dcfa19ad52ab4fd45e17
      C03_BASE: 3a50a8557fbdb634f56ab6fd14a3d9072bd927c5
    steps:
      - name: Exact main source and release preflight
        env:
          GH_TOKEN: ${{ env.WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN" && test -n "$WRITE_TOKEN"
          echo 'CREDENTIAL_MODEL=READ_WRITE_SEPARATED'
          echo 'PRODUCTION_WRITE_USED=NO STATIC_WRITE_USED=NO ONLINE_WRITE_USED=NO MIGRATION_USED=NO SCHEMA_WRITE_USED=NO LOCATOR_CUTOVER_USED=NO'
          for spec in \
            'llhzx2018/vf-tools-ops|v1.21.858|e00281249697d6acf4383833d800eec424fdc60c' \
            'llhzx2018/vf-tools-m3u8|v1.25.29|f806ad64447cdd84c664dcfa19ad52ab4fd45e17'; do
            IFS='|' read -r repo tag sha <<< "$spec"
            test "$(gh api "repos/$repo/branches/main" --jq '.commit.sha')" = "$sha"
            ! gh release view "$tag" --repo "$repo" >/dev/null 2>&1
            ! gh api "repos/$repo/git/ref/tags/$tag" >/dev/null 2>&1
          done

          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-tools-ops.git" c02
          git -C c02 checkout -q "$C02_SHA"
          test "$(tr -d '\r\n' < c02/VERSION)" = '1.21.858'
          grep -Fq 'Version: 1.21.858' c02/vf-ops.php
          grep -Fq "VF_OPS_VERSION', '1.21.858'" c02/vf-ops.php
          grep -Fq "VF_OPS_ROUND', 'S01-ERROR-RECOVERY-UX-CLOSURE'" c02/vf-ops.php
          find c02/includes c02/tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php -l c02/vf-ops.php >/dev/null
          for t in error-recovery-human-language-contract admin-human-language-contract dashboard-selector-hit-contract pages-tools-human-closure-contract system-components-human-language-contract update-compat-human-language-contract update-refresh-policy-current-contract visible-console-v2-contract; do php "c02/tests/$t.php"; done
          python3 - <<'PY'
          import os,subprocess
          got=set(subprocess.check_output(['git','-C','c02','diff','--name-only',os.environ['C02_BASE']+'..'+os.environ['C02_SHA']],text=True).splitlines())
          exp={'VERSION','vf-ops.php','includes/admin-runtime-support.php','includes/admin-v13/views/dashboard.php','tests/admin-human-language-contract.php','tests/error-recovery-human-language-contract.php','tests/system-components-human-language-contract.php','tests/update-refresh-policy-current-contract.php','tests/visible-console-v2-contract.php'}
          assert got==exp,(got,exp)
          PY
          git -C c02 diff --exit-code "$C02_BASE".."$C02_SHA" -- includes/v6

          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-tools-m3u8.git" c03
          git -C c03 checkout -q "$C03_SHA"
          test "$(tr -d '\r\n' < c03/VERSION)" = '1.25.29'
          grep -Fq 'Version: 1.25.29' c03/src/vf-tool-m3u8.php
          grep -Fq "VF_TOOL_M3U8_VERSION', '1.25.29'" c03/src/vf-tool-m3u8.php
          grep -Fq "VF_TOOL_M3U8_ROUND', 'R253'" c03/src/vf-tool-m3u8.php
          grep -Fq 'R253_S01_ERROR_RECOVERY_UX_CLOSURE' c03/src/vf-tool-m3u8.php
          find c03/src c03/tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          for t in error-recovery-final-owner-contract admin-human-language-contract dashboard-human-language-contract host-recovery-human-language-contract recovery-runtime-human-language-followup-contract settings-human-language-followup-contract package-physical-locator-contract update-refresh-policy-contract visible-console-v2-contract bootstrap-upgrade-contract; do php "c03/tests/unit/$t.php"; done
          php c03/tests/frontend-s01-uiux-final-owner-contract.php
          python3 - <<'PY'
          import os,subprocess
          got=set(subprocess.check_output(['git','-C','c03','diff','--name-only',os.environ['C03_BASE']+'..'+os.environ['C03_SHA']],text=True).splitlines())
          exp={'VERSION','src/vf-tool-m3u8.php','src/admin/admin-loader.php','src/admin/admin-console.php','tests/unit/dashboard-human-language-contract.php','tests/unit/error-recovery-final-owner-contract.php','tests/unit/host-recovery-human-language-contract.php','tests/unit/package-physical-locator-contract.php','tests/unit/recovery-runtime-human-language-followup-contract.php','tests/unit/settings-human-language-followup-contract.php','tests/unit/update-refresh-policy-contract.php','tests/unit/visible-console-v2-contract.php'}
          assert got==exp,(got,exp)
          PY
          git -C c03 diff --exit-code "$C03_BASE".."$C03_SHA" -- src/includes/v6-provider-schema.php src/includes/v6-provider-post-migration-readonly.php src/includes/v6-provider-controlled-migration-admin.php src/includes/update
          echo 'S01_C02_C03_FORMAL_SOURCE_PREFLIGHT=PASS'

  release-c02:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      SHA: e00281249697d6acf4383833d800eec424fdc60c
      TAG: v1.21.858
      ASSET: vf-tools-ops_V1.21.858.zip
    steps:
      - name: Deterministic Ops build and publish
        env:
          GH_TOKEN: ${{ env.WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'PRODUCTION_WRITE_USED=NO STATIC_WRITE_USED=NO ONLINE_WRITE_USED=NO MIGRATION_USED=NO'
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-tools-ops.git" repo
          git -C repo checkout -q "$SHA"
          mkdir -p "$RUNNER_TEMP/a" "$RUNNER_TEMP/b"
          python3 - <<'PY' > "$RUNNER_TEMP/metrics.env"
          from pathlib import Path
          import hashlib,os,re,zipfile
          root=Path('repo');rows=[]
          for p in root.rglob('*'):
            if not p.is_file() or p.is_symlink():continue
            rel=p.relative_to(root).as_posix();parts=rel.split('/')
            if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in parts):continue
            if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',rel,re.I):continue
            ok=(rel in {'vf-ops.php','uninstall.php'}) if '/' not in rel else parts[0] in {'includes','assets','languages','config'}
            if ok:rows.append((rel,p.read_bytes()))
          rows.sort();assert len(rows)>=900
          def build(path):
            with zipfile.ZipFile(path,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for rel,b in rows:
                zi=zipfile.ZipInfo('vf-ops/'+rel,(2026,9,8,0,0,0));zi.compress_type=zipfile.ZIP_DEFLATED;zi.external_attr=0o100644<<16;z.writestr(zi,b)
            data=Path(path).read_bytes();return len(rows),len(data),hashlib.sha256(data).hexdigest()
          a=build(Path(os.environ['RUNNER_TEMP'])/'a'/os.environ['ASSET']);b=build(Path(os.environ['RUNNER_TEMP'])/'b'/os.environ['ASSET']);assert a==b
          print(f'FILES={a[0]}');print(f'BYTES={a[1]}');print(f'SHA256={a[2]}')
          PY
          cat "$RUNNER_TEMP/metrics.env" >> "$GITHUB_ENV";set -a;source "$RUNNER_TEMP/metrics.env";set +a
          cmp "$RUNNER_TEMP/a/$ASSET" "$RUNNER_TEMP/b/$ASSET"
          python3 - <<'PY'
          import os,zipfile
          with zipfile.ZipFile(os.environ['RUNNER_TEMP']+'/a/'+os.environ['ASSET']) as z:
            assert z.testzip() is None
            d=z.read('vf-ops/vf-ops.php')
            assert b'Version: 1.21.858' in d
            assert b'S01-ERROR-RECOVERY-UX-CLOSURE' in d
          PY
          repo='llhzx2018/vf-tools-ops';created_tag=0;created_release=0
          cleanup(){ rc=$?;if [ "$rc" -ne 0 ];then if [ "$created_release" -eq 1 ];then gh release delete "$TAG" --repo "$repo" --cleanup-tag --yes >/dev/null 2>&1||true;fi;if [ "$created_tag" -eq 1 ];then gh api --method DELETE "repos/$repo/git/refs/tags/$TAG" >/dev/null 2>&1||true;fi;fi;exit "$rc";};trap cleanup EXIT
          test "$(gh api "repos/$repo/branches/main" --jq '.commit.sha')" = "$SHA"
          gh api --method POST "repos/$repo/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" >/dev/null;created_tag=1
          test "$(gh api "repos/$repo/git/ref/tags/$TAG" --jq '.object.sha')" = "$SHA"
          printf 'S01-C02 Error Recovery UX Closure. Exact main source: %s\nCode Gate: 34190295048 PASS\nBump Gate: 34190403579 PASS\nPost-Push Readback: 34190558822 PASS\nSchema: 6.0.0 unchanged\nProduction: NOT_RUN\n' "$SHA" > "$RUNNER_TEMP/notes"
          gh release create "$TAG" "$RUNNER_TEMP/a/$ASSET" --repo "$repo" --title 'VF Tools Ops V1.21.858' --notes-file "$RUNNER_TEMP/notes" --draft --verify-tag;created_release=1
          mkdir "$RUNNER_TEMP/r"
          gh release download "$TAG" --repo "$repo" --pattern "$ASSET" --dir "$RUNNER_TEMP/r"
          test "$(stat -c %s "$RUNNER_TEMP/r/$ASSET")" = "$BYTES"
          test "$(sha256sum "$RUNNER_TEMP/r/$ASSET"|awk '{print $1}')" = "$SHA256"
          gh release edit "$TAG" --repo "$repo" --draft=false
          gh api "repos/$repo/releases/tags/$TAG" > "$RUNNER_TEMP/final.json"
          test "$(jq -r --arg a "$ASSET" '.assets[]|select(.name==$a)|.digest' "$RUNNER_TEMP/final.json")" = "sha256:$SHA256"
          trap - EXIT
          echo "TAG_TARGET=$(gh api "repos/$repo/git/ref/tags/$TAG" --jq '.object.sha')"
          echo "RELEASE_ID=$(jq -r '.id' "$RUNNER_TEMP/final.json")"
          echo "ASSET_ID=$(jq -r --arg a "$ASSET" '.assets[]|select(.name==$a)|.id' "$RUNNER_TEMP/final.json")"
          echo "REMOTE_BYTES=$BYTES"
          echo "ASSET_SHA256=$SHA256"
          echo "RUNTIME_FILES=$FILES"
          echo 'TESTED_ARTIFACT_EQUALS_DELIVERED_ARTIFACT=PASS'
          echo 'C02_121858_FORMAL_RELEASE=PASS'

  release-c03:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      SHA: f806ad64447cdd84c664dcfa19ad52ab4fd45e17
      TAG: v1.25.29
      ASSET: vf-tools-m3u8_V1.25.29.zip
    steps:
      - name: Deterministic M3U8 build and publish
        env:
          GH_TOKEN: ${{ env.WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'PRODUCTION_WRITE_USED=NO STATIC_WRITE_USED=NO ONLINE_WRITE_USED=NO MIGRATION_USED=NO SCHEMA_WRITE_USED=NO LOCATOR_CUTOVER_USED=NO'
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-tools-m3u8.git" repo
          git -C repo checkout -q "$SHA"
          mkdir -p "$RUNNER_TEMP/a" "$RUNNER_TEMP/b"
          python3 - <<'PY' > "$RUNNER_TEMP/metrics.env"
          from pathlib import Path
          import hashlib,os,zipfile
          src=Path('repo/src');rows=[(p.relative_to(src).as_posix(),p.read_bytes()) for p in sorted(src.rglob('*'),key=lambda x:x.relative_to(src).as_posix()) if p.is_file()]
          def build(path):
            dirs={'vf-tool-m3u8/'}
            for rel,_ in rows:
              cur='vf-tool-m3u8'
              for part in rel.split('/')[:-1]:cur+='/'+part;dirs.add(cur+'/')
            with zipfile.ZipFile(path,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for d in sorted(dirs):zi=zipfile.ZipInfo(d);zi.date_time=(1980,1,1,0,0,0);zi.external_attr=(0o40755<<16)|0x10;z.writestr(zi,b'')
              for rel,b in rows:zi=zipfile.ZipInfo('vf-tool-m3u8/'+rel);zi.date_time=(1980,1,1,0,0,0);zi.compress_type=zipfile.ZIP_DEFLATED;zi.external_attr=0o100644<<16;z.writestr(zi,b)
            data=Path(path).read_bytes();return len(rows),len(data),hashlib.sha256(data).hexdigest()
          a=build(Path(os.environ['RUNNER_TEMP'])/'a'/os.environ['ASSET']);b=build(Path(os.environ['RUNNER_TEMP'])/'b'/os.environ['ASSET']);assert a==b
          print(f'FILES={a[0]}');print(f'BYTES={a[1]}');print(f'SHA256={a[2]}')
          PY
          cat "$RUNNER_TEMP/metrics.env" >> "$GITHUB_ENV";set -a;source "$RUNNER_TEMP/metrics.env";set +a
          cmp "$RUNNER_TEMP/a/$ASSET" "$RUNNER_TEMP/b/$ASSET"
          python3 - <<'PY'
          import os,zipfile
          with zipfile.ZipFile(os.environ['RUNNER_TEMP']+'/a/'+os.environ['ASSET']) as z:
            assert z.testzip() is None
            d=z.read('vf-tool-m3u8/vf-tool-m3u8.php')
            assert b'Version: 1.25.29' in d
            assert b'R253_S01_ERROR_RECOVERY_UX_CLOSURE' in d
          PY
          repo='llhzx2018/vf-tools-m3u8';created_tag=0;created_release=0
          cleanup(){ rc=$?;if [ "$rc" -ne 0 ];then if [ "$created_release" -eq 1 ];then gh release delete "$TAG" --repo "$repo" --cleanup-tag --yes >/dev/null 2>&1||true;fi;if [ "$created_tag" -eq 1 ];then gh api --method DELETE "repos/$repo/git/refs/tags/$TAG" >/dev/null 2>&1||true;fi;fi;exit "$rc";};trap cleanup EXIT
          test "$(gh api "repos/$repo/branches/main" --jq '.commit.sha')" = "$SHA"
          gh api --method POST "repos/$repo/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" >/dev/null;created_tag=1
          test "$(gh api "repos/$repo/git/ref/tags/$TAG" --jq '.object.sha')" = "$SHA"
          printf 'S01-C03 Error Recovery UX Closure. Exact main source: %s\nCode Gate: 34190295048 PASS\nBump Gate: 34190403579 PASS\nPost-Push Readback: 34190558822 PASS\nProvider schema: 1.3.0 unchanged\nPhysical locator: vf-tool-m3u8/vf-tool-m3u8.php\nLocator cutover: false\nMigration: CLOSED\nProduction: NOT_RUN\n' "$SHA" > "$RUNNER_TEMP/notes"
          gh release create "$TAG" "$RUNNER_TEMP/a/$ASSET" --repo "$repo" --title 'VF Tools M3U8 V1.25.29' --notes-file "$RUNNER_TEMP/notes" --draft --verify-tag;created_release=1
          mkdir "$RUNNER_TEMP/r"
          gh release download "$TAG" --repo "$repo" --pattern "$ASSET" --dir "$RUNNER_TEMP/r"
          test "$(stat -c %s "$RUNNER_TEMP/r/$ASSET")" = "$BYTES"
          test "$(sha256sum "$RUNNER_TEMP/r/$ASSET"|awk '{print $1}')" = "$SHA256"
          gh release edit "$TAG" --repo "$repo" --draft=false
          gh api "repos/$repo/releases/tags/$TAG" > "$RUNNER_TEMP/final.json"
          test "$(jq -r --arg a "$ASSET" '.assets[]|select(.name==$a)|.digest' "$RUNNER_TEMP/final.json")" = "sha256:$SHA256"
          trap - EXIT
          echo "TAG_TARGET=$(gh api "repos/$repo/git/ref/tags/$TAG" --jq '.object.sha')"
          echo "RELEASE_ID=$(jq -r '.id' "$RUNNER_TEMP/final.json")"
          echo "ASSET_ID=$(jq -r --arg a "$ASSET" '.assets[]|select(.name==$a)|.id' "$RUNNER_TEMP/final.json")"
          echo "REMOTE_BYTES=$BYTES"
          echo "ASSET_SHA256=$SHA256"
          echo "RUNTIME_FILES=$FILES"
          echo 'TESTED_ARTIFACT_EQUALS_DELIVERED_ARTIFACT=PASS'
          echo 'C03_12529_FORMAL_RELEASE=PASS'
