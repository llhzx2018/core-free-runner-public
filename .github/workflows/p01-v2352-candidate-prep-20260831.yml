name: P01 V2.35.2 Candidate Prep
on:
  push:
    branches: [release/p01-v2352-orchestrator-20260831]
    paths: [.github/workflows/p01-v2352-candidate-prep-20260831.yml]
permissions:
  contents: read
jobs:
  prep:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE: e27e04f4cede748c3f7969d526fc390d8ffc6f6f
      BRANCH: release/v2.35.2-candidate-20260831
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
      - name: Exact candidate metadata prep
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$BASE"
          test "$(cat VERSION)" = 2.35.1
          test "$(cat src/VERSION.txt)" = 2.35.1
          grep -Fx "define('VF_VERSION', '2.35.1');" src/app/bootstrap.php >/dev/null
          cp CHANGELOG.md /tmp/P01-CHANGELOG.before
          printf '2.35.2\n' > VERSION
          printf '2.35.2\n' > src/VERSION.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/bootstrap.php'); s=p.read_text()
          old="define('VF_VERSION', '2.35.1');"; new="define('VF_VERSION', '2.35.2');"
          assert s.count(old)==1 and new not in s
          p.write_text(s.replace(old,new),encoding='utf-8')
          oldc=Path('/tmp/P01-CHANGELOG.before').read_bytes()
          prefix=("## V2.35.2 — 2026-08-31\n\n"
                  "- Hotfix: reconcile Online Update terminal-state semantics after Owner V2.35.1 production evidence.\n"
                  "- When Current >= Latest, the install action is hidden/disabled and stale failure/step UI is cleared.\n"
                  "- The no-op `当前已经是最新版本。` result now settles to a stable latest state instead of a destructive failure/rollback message.\n"
                  "- Real prepare/download/SHA/Atomic failures remain visible as failures. Schema remains 2026082901; no migration.\n\n").encode()
          Path('CHANGELOG.md').write_bytes(prefix+oldc)
          assert Path('CHANGELOG.md').read_bytes().endswith(oldc)
          PY
          test "$(cat VERSION)" = 2.35.2
          test "$(cat src/VERSION.txt)" = 2.35.2
          grep -Fx "define('VF_VERSION', '2.35.2');" src/app/bootstrap.php >/dev/null
          git diff --check
          mapfile -t files < <(git diff --name-only)
          printf '%s\n' "${files[@]}"
          test "$(printf '%s\n' "${files[@]}" | sort | paste -sd, -)" = "CHANGELOG.md,VERSION,src/VERSION.txt,src/app/bootstrap.php"
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add CHANGELOG.md VERSION src/VERSION.txt src/app/bootstrap.php
          git commit -m 'release(P01): prepare V2.35.2 hotfix candidate'
          git push origin HEAD:"$BRANCH"
          echo P01_V2352_CANDIDATE_PREP=PASS
