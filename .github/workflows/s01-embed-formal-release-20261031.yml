name: S01 embed formal releases
on:
  push:
    branches: [task/s01-embed-recheck-20261031]
    paths: ['.github/workflows/s01-embed-formal-release-20261031.yml']
permissions:
  actions: read
  contents: read
jobs:
  releases:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: embed-exact-candidates-41180960566
          run-id: 41180960566
          github-token: ${{ github.token }}
          path: candidate
      - name: Verify bytes and publish formal releases
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          echo '3df90085f637b76fab0bc831ec66dc4779656a8b4e85180e5d9ec06f4a3b1503  candidate/vf-tools-theme_V1.35.221.zip' | sha256sum -c
          echo 'd84279b9527f5da7ae43f05759dfb8288f5a07e63e481c84253e507458ad485f  candidate/vf-tools-m3u8_V1.25.97.zip' | sha256sum -c
          test "$(gh api repos/llhzx2018/vf-tools-theme/branches/main --jq .commit.sha)" = 4c3482d6644487ddf799d0efac3c5af22b82df51
          test "$(gh api repos/llhzx2018/vf-tools-m3u8/branches/main --jq .commit.sha)" = 2c678f4a7ade326039cc8222db226d607138bc66
          for entry in 'llhzx2018/vf-tools-theme v1.35.221' 'llhzx2018/vf-tools-m3u8 v1.25.97'; do
            read -r repo tag <<< "$entry"
            if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then echo "ALREADY_EXISTS: $repo $tag"; exit 1; fi
            if gh api "repos/$repo/git/ref/tags/$tag" >/dev/null 2>&1; then echo "TAG_EXISTS: $repo $tag"; exit 1; fi
          done
          cat > /tmp/theme-notes <<'NOTES'
          M3U8 嵌入代码生成器页面参考配置、预览、复制的任务流程精修；修正说明文字排列，并记录开发进度。正式站体验与 SEO 仍待手工升级后验收。回退旧插件可能改写皮肤迁移记录，升级前请先完成数据库与文件的完整备份。
          NOTES
          cat > /tmp/plugin-notes <<'NOTES'
          修正嵌入代码复制按钮文案，并保护无变化的空旧皮肤迁移快照。回退旧版可能改写皮肤迁移记录；升级前请完成数据库与文件的完整备份，必要时恢复备份。正式站由站点所有者手工升级。
          NOTES
          gh release create v1.35.221 candidate/vf-tools-theme_V1.35.221.zip --repo llhzx2018/vf-tools-theme --target 4c3482d6644487ddf799d0efac3c5af22b82df51 --title 'VF Tools Theme V1.35.221' --notes-file /tmp/theme-notes
          gh release create v1.25.97 candidate/vf-tools-m3u8_V1.25.97.zip --repo llhzx2018/vf-tools-m3u8 --target 2c678f4a7ade326039cc8222db226d607138bc66 --title 'VF Tools M3U8 V1.25.97' --notes-file /tmp/plugin-notes
          mkdir -p verify
          gh release download v1.35.221 --repo llhzx2018/vf-tools-theme --pattern vf-tools-theme_V1.35.221.zip --dir verify
          gh release download v1.25.97 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.97.zip --dir verify
          cmp candidate/vf-tools-theme_V1.35.221.zip verify/vf-tools-theme_V1.35.221.zip
          cmp candidate/vf-tools-m3u8_V1.25.97.zip verify/vf-tools-m3u8_V1.25.97.zip
          echo FORMAL_RELEASE_REMOTE_BYTES_PASS
