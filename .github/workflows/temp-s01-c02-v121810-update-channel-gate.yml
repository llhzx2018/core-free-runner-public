name: TEMP S01-C02 Ops 1.21.810 Update Channel Gate
on:
  push:
    branches: [temp/s01-c02-v121809-production-readback-20260904]
    paths: ['.github/workflows/temp-s01-c02-v121810-update-channel-gate.yml']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CU_REPO: llhzx2018/core-updates
      CU_BASE: af06b70045ad3a542f981693740fd84b7cabf31b
      CU_BRANCH: release/s01-c02-v121810-update-channel-20260904
      CU_CANDIDATE: 18455f2e88a5635541786aa7fd42018b80c18a04
      OPS_REPO: llhzx2018/vf-tools-ops
      OPS_SHA: f07006b4314f77365994a1cb34f8fa5009ed9205
      TAG: v1.21.810
      ASSET: vf-tools-ops_V1.21.810.zip
      ASSET_BYTES: '3215361'
      ASSET_SHA: a66784f6c0a95c102932a0d42344a38f585ac14b4eca68d75015ec8161b7ae70
    steps:
      - name: Checkout update channel candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: 18455f2e88a5635541786aa7fd42018b80c18a04
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: cu
      - name: Verify manifest release and Production source
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git -C cu rev-parse HEAD)" = "$CU_CANDIDATE"
          live="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$CU_REPO/branches/main" | jq -r '.commit.sha')"
          test "$live" = "$CU_BASE"
          git -C cu diff --name-only "$CU_BASE" "$CU_CANDIDATE" | grep -Fxq 'projects/S01-C02.json'
          test "$(git -C cu diff --name-only "$CU_BASE" "$CU_CANDIDATE" | wc -l)" = '1'
          m=cu/projects/S01-C02.json
          jq -e '.schema_version=="wp-component-1.0" and .project_id=="S01" and .component_id=="S01-C02" and .target_version=="1.21.810" and .from_versions==["1.21.809"] and .release_tag=="v1.21.810" and .asset_name=="vf-tools-ops_V1.21.810.zip" and .asset_bytes==3215361 and .asset_sha256=="a66784f6c0a95c102932a0d42344a38f585ac14b4eca68d75015ec8161b7ae70" and .schema_from=="6.0.0" and .schema_to=="6.0.0" and .runtime_files==898 and .runtime_fingerprint=="582eed3cca6391cfb3a38c5a02e8969fedefcde1dc5fb8373ec6f47bb7574755"' "$m" >/dev/null
          for b in main develop; do
            s="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$OPS_REPO/branches/$b" | jq -r '.commit.sha')"
            test "$s" = "$OPS_SHA"
          done
          curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$OPS_REPO/releases/tags/$TAG" >/tmp/release.json
          test "$(jq -r '.target_commitish' /tmp/release.json)" = "$OPS_SHA"
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.size' /tmp/release.json)" = "$ASSET_BYTES"
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.digest' /tmp/release.json)" = "sha256:$ASSET_SHA"
          prod="$(curl -fsSL --retry 2 --max-time 20 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-domain-authority')"
          echo "$prod" | jq -e '.pluginVersion=="1.21.809" and .status=="CURRENT" and .authorityFinalHost=="https://ilovem3u8.com"' >/dev/null
          echo UPDATE_CHANNEL_GATE_V121810=PASS
