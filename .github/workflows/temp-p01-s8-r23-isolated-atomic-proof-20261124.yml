name: TEMP P01 S8 R23 isolated Atomic crash recovery and FULL inventory
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/temp-p01-s8-r23-isolated-atomic-proof-20261124.yml]
permissions:
  contents: read
concurrency:
  group: p01-r23-isolated-atomic-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  isolated-r23-regression:
    name: P01-S8-R23-EXACT-SYNTHETIC-ATOMIC
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'test/p01-s8-r23-isolated-atomic-proof-')
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Fetch precise P01 private source for transient tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-startnew
          ref: a37927c5b2ecb0372816adfb53aef17d0d575611
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-src
      - name: Exact source and non-publishable version
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C private-src rev-parse HEAD)" = "a37927c5b2ecb0372816adfb53aef17d0d575611"
          test "$(cat private-src/VERSION)" = "0.1.0-dev"
          echo P01_R23_EXACT_SOURCE=PASS
      - name: Set up PHP 8.4 extensions for local-only ZIP and native process fault tests
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, zip, sodium, pcntl, posix, dom, xml, fileinfo
          tools: composer:v2
          coverage: none
      - name: Install locked PHP dependencies without external app operations
        working-directory: private-src
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          composer install --no-interaction --prefer-dist --no-progress --quiet >"$RUNNER_TEMP/p01-r23-composer.log" 2>&1 || {
            echo P01_R23_COMPOSER=FAIL
            exit 1
          }
          php -r 'exit((extension_loaded("pcntl") && extension_loaded("posix") && extension_loaded("sqlite3") && extension_loaded("zip") && extension_loaded("sodium")) ? 0 : 1);' || {
            echo P01_R23_PROCESS_EXTENSIONS=FAIL
            exit 1
          }
          echo P01_R23_COMPOSER_AND_NATIVE_EXTENSIONS=PASS
      - name: Real synthetic Python Atomic builder and dependency-path contract
        shell: bash
        working-directory: private-src
        run: |
          set -Eeuo pipefail
          set +x
          python3 -m unittest discover -s tests -p 'test_new_atomic*.py' >"$RUNNER_TEMP/p01-r23-python.log" 2>&1 || {
            echo P01_R23_PYTHON_UNIT=FAIL
            exit 1
          }
          echo P01_R23_PYTHON_UNIT=PASS
      - name: Existing isolated recovery, Clean FULL inventory, and SIGKILL regressions
        shell: bash
        working-directory: private-src
        run: |
          set -Eeuo pipefail
          set +x
          export APP_ENV=testing DB_CONNECTION=sqlite DB_DATABASE=:memory:
          export APP_KEY="base64:$(openssl rand -base64 32)"
          export CACHE_STORE=array SESSION_DRIVER=array QUEUE_CONNECTION=sync
          export VF_INSTALL_DEV_CLAIM_ENABLED=false
          set +e
          ./vendor/bin/phpunit --log-junit "$RUNNER_TEMP/p01-r23-interrupt.xml" tests/Unit/IsolatedAtomicInterruptedRecoveryTest.php >"$RUNNER_TEMP/p01-r23-interrupt.log" 2>&1
          rc_interrupt=$?
          ./vendor/bin/phpunit --log-junit "$RUNNER_TEMP/p01-r23-inventory.xml" tests/Unit/InstalledFullGenerationInventoryPathTest.php >"$RUNNER_TEMP/p01-r23-inventory.log" 2>&1
          rc_inventory=$?
          ./vendor/bin/phpunit --filter 'test_(actual_atomic_stager|stager_|real_stager_|isolated_code_swap|real_sigkill_|old_full_integrity|pinned_previous_full|failed_pinned_full|full_bound_recovery|wrong_previous_full|paired_review_cannot|unrelated_old_code|changed_prior_full|previous_full_exact|verified_encrypted_snapshot|atomic_refuses_changed_prior|atomic_refuses_deleted|atomic_refuses_symlinked)' --log-junit "$RUNNER_TEMP/p01-r23-cycle.xml" tests/Unit/IsolatedAtomicUpgradeCycleTest.php >"$RUNNER_TEMP/p01-r23-cycle.log" 2>&1
          rc_cycle=$?
          set -e
          python3 - "$RUNNER_TEMP/p01-r23-interrupt.xml" "$RUNNER_TEMP/p01-r23-inventory.xml" "$RUNNER_TEMP/p01-r23-cycle.xml" <<'PY'
          import sys, pathlib, xml.etree.ElementTree as ET, re
          groups=[]
          total=ass=skipped=failed=0
          for p in map(pathlib.Path, sys.argv[1:]):
              if not p.is_file():
                  print('P01_R23_JUNIT_MISSING='+p.stem)
                  sys.exit(1)
              cases=list(ET.parse(p).getroot().iter('testcase'))
              n=len(cases); a=sum(int(c.get('assertions','0')) for c in cases)
              sk=sum(c.find('skipped') is not None for c in cases)
              fl=sum(c.find('failure') is not None or c.find('error') is not None for c in cases)
              groups.append((p.stem,n,a,sk,fl))
              total+=n; ass+=a; skipped+=sk; failed+=fl
              for c in cases:
                  if c.find('error') is not None or c.find('failure') is not None:
                      print('P01_R23_FAILED_METHOD='+re.sub('[^A-Za-z0-9_]', '',c.get('name',''))[:120])
          for tag,n,a,sk,fl in groups:
              print('P01_R23_JUNIT_GROUP='+tag+':'+','.join(map(str,(n,a,sk,fl))))
          print('P01_R23_JUNIT_TOTAL='+','.join(map(str,(total,ass,skipped,failed))))
          if total<22 or ass<100 or skipped>0 or failed>0:
              sys.exit(1)
          PY
          rc_junit=$?
          if [ "$rc_interrupt" -ne 0 ] || [ "$rc_inventory" -ne 0 ] || [ "$rc_cycle" -ne 0 ] || [ "$rc_junit" -ne 0 ]; then
            echo P01_R23_ATOMIC_MACHINE=FAIL
            exit 1
          fi
          echo P01_R23_ATOMIC_MACHINE=PASS
      - name: Private source and transient log cleanup
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- private-src
          rm -f -- "$RUNNER_TEMP"/p01-r23-*
          test ! -e private-src
          echo P01_R23_PRIVATE_CLEANUP=PASS
