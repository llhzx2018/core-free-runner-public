name: P06 VF Press V0.1.3 Chinese HTTP Gate V2

on:
  pull_request:
    branches: [main]
    paths:
      - triggers/p06-v013-chinese-http-gate-v2.txt

permissions:
  contents: read

env:
  SOURCE_SHA: 50d00d615197254e7c669a117ff875e9190303e4

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact private candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-press
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Prepare runtime and owner
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 php-mbstring php-zip php-curl sqlite3 composer >/dev/null
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(cat VERSION)" = '0.1.3'
          composer dump-autoload --no-dev --optimize --no-interaction >/dev/null
          rm -rf storage storage-restore-* dist
          php bin/migrate.php | grep -Fq MIGRATION_PASS
          VF_PRESS_OWNER_USERNAME=ui-owner VF_PRESS_OWNER_PASSWORD='synthetic-ui-owner-2026!' VF_PRESS_OWNER_DISPLAY_NAME='界面验证管理员' php bin/create-owner.php >/tmp/owner.log
          grep -Fq OWNER_PROVISION=PASS /tmp/owner.log

      - name: Render real HTTP product surfaces
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/v013-router.php <<'PHP'
          <?php
          $path=parse_url($_SERVER['REQUEST_URI']??'/',PHP_URL_PATH)?:'/';
          $file=getcwd().'/public'.$path;
          if($path!=='/'&&(is_file($file)||is_link($file))) return false;
          require getcwd().'/public/index.php';
          PHP
          php -S 127.0.0.1:18785 -t public /tmp/v013-router.php >/tmp/v013-server.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18785/ >/tmp/public.html; then READY=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then cat /tmp/v013-server.log; exit 1; fi
            sleep 1
          done
          test "$READY" = 1
          curl -fsS -c /tmp/cookies http://127.0.0.1:18785/login >/tmp/login.html
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/login.html',encoding='utf-8').read(); m=re.search(r'name="_csrf" value="([^"]+)"',s); assert m; print(m.group(1))
          PY
          )
          curl -sS -D /tmp/login.headers -o /tmp/login.post -c /tmp/cookies -b /tmp/cookies -X POST http://127.0.0.1:18785/login \
            --data-urlencode "_csrf=$CSRF" --data-urlencode 'username=ui-owner' --data-urlencode 'password=synthetic-ui-owner-2026!'
          grep -Eq '^HTTP/1.1 303' /tmp/login.headers
          grep -Fiq 'Location: /studio' /tmp/login.headers
          for spec in 'studio:/studio' 'research:/studio/research' 'publications:/studio/publications' 'publishing:/studio/publishing' 'operations:/studio/operations' 'preview:/preview/publisher'; do
            name=${spec%%:*}; path=${spec#*:}; curl -fsS -b /tmp/cookies "http://127.0.0.1:18785$path" >"/tmp/$name.html"
          done
          grep -Fq '出版工作台' /tmp/studio.html
          grep -Fq '研究工作区' /tmp/studio.html
          grep -Fq '作品与母稿' /tmp/studio.html
          grep -Fq '出版台' /tmp/studio.html
          grep -Fq '出版社与阅读器预览' /tmp/studio.html
          grep -Fq '先研究，再写作' /tmp/research.html
          grep -Fq '作品与母稿' /tmp/publications.html
          grep -Fq '出版台' /tmp/publishing.html
          grep -Fq '运维中心' /tmp/operations.html
          grep -Fq '内部预览' /tmp/preview.html
          grep -Fq '把真正值得留下的东西，做成作品' /tmp/public.html
          cat /tmp/studio.html /tmp/research.html /tmp/publications.html /tmp/publishing.html /tmp/operations.html /tmp/preview.html /tmp/public.html >/tmp/all-visible.html
          if grep -E 'Research Workspace|Publication & Manuscript|Publishing Desk|Working Publisher / Reader Preview|PUBLISHING STUDIO|RESEARCH FIRST|MANUSCRIPT MAP|WORK HISTORY|LIVING PUBLISHING|CURRENT STATE|AI Editorial|OPERATIONS CENTER|SYSTEM HEALTH|ONLINE UPDATE|OWNER PREVIEW · WORKING PUBLICATION|WORKING PREVIEW|WHY THIS BOOK|FOR WHOM|CURRENT EDITION|Published Snapshot' /tmp/all-visible.html; then exit 1; fi
          curl -fsS http://127.0.0.1:18785/health | grep -Fq '"version":"0.1.3"'
          echo REAL_HTTP_CHINESE_UI=PASS

      - name: Cleanup
        if: always()
        working-directory: source
        shell: bash
        run: |
          rm -rf storage storage-restore-* dist
          echo PRIVATE_SOURCE_PERSISTED=NO
          echo PRODUCTION_WRITE=NO
