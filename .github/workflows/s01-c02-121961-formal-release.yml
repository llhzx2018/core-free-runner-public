name: S01-C02 1.21.961 Formal Release

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/s01-c02-121961-formal-release.yml'

permissions:
  actions: read
  contents: read

jobs:
  formal-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_REPOSITORY: llhzx2018/vf-tools-ops
      TARGET_SHA: f239fe0495fb86fb836167a88482c9d7f010cf7c
      TARGET_VERSION: 1.21.961
      RELEASE_TAG: v1.21.961
      ASSET_NAME: vf-tools-ops_V1.21.961.zip
      TESTED_RUN_ID: '36580414131'
      TESTED_ARTIFACT_NAME: s01-c02-v1.21.961-r12-candidate
      EXPECTED_BYTES: '3419095'
      EXPECTED_SHA256: 137fc24c4fe6f4d7bc0c805b0467389b43e0b7049a2b553f0ea7d30bf02be175
      EXPECTED_RUNTIME_FILES: '961'
      EXPECTED_RUNTIME_FP: f93248b400cc05f5f9d8a01a2d7d6dfe6bf50976493eac1f0f4d7aa7e7e34273
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}

    steps:
      - name: Verify credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN"
          test -n "$RELEASE_WRITE_TOKEN"

      - name: Checkout exact promoted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target

      - name: Verify exact tested candidate artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n' < target/VERSION)" = "$TARGET_VERSION"
          mkdir tested
          gh run download "$TESTED_RUN_ID" --repo llhzx2018/core-free-runner-public --name "$TESTED_ARTIFACT_NAME" --dir tested
          test -f "tested/FINAL_EVIDENCE.json"
          test -f "tested/$ASSET_NAME"
          jq -e --arg sha "$TARGET_SHA" --arg ver "$TARGET_VERSION" '.status=="PASS" and .candidate_sha==$sha and .candidate_version==$ver and .upgrade=="PASS" and .security=="PASS" and .r12_contract=="PASS" and .browser.result=="PASS" and .browser.blocking_errors==0 and .browser.responsive_failures==0' tested/FINAL_EVIDENCE.json >/dev/null
          test "$(stat -c %s "tested/$ASSET_NAME")" = "$EXPECTED_BYTES"
          test "$(sha256sum "tested/$ASSET_NAME"|awk '{print $1}')" = "$EXPECTED_SHA256"
          unzip -tq "tested/$ASSET_NAME" >/dev/null

      - name: Create formal release
        shell: bash
        env:
          GH_TOKEN: ${{ env.RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          if gh api "repos/$TARGET_REPOSITORY/releases/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh api "repos/$TARGET_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$TARGET_SHA"
          else
            cat > release-notes.md <<'MD'
          S01-C02 · VF Tools Ops · V1.21.961

          Production Real-use R12 · Unified Page Frame:
          - 基于 OWNER Production 截图，直接收口 O01–O14 页面框架而不是继续逐页补丁
          - 页面标题下立即进入摘要 / 当前任务，移除页面 Body 内残余的大面积 Hero 留白
          - 页面与关键词地图、单页精修、内容集群与链接、技术与索引统一为同一种紧凑任务条
          - 质量中心、组件与系统、备份与恢复顶部统一状态 / 摘要 / 主动作层级
          - 运行边界、责任边界、专业信息与审计统一为低噪音页尾语言
          - 保持 Shell / Header / Header Menu IA 冻结
          - 不改变 route / data / schema / permission / business logic / updater semantics
          - Exact Candidate Gate Run: 36580414131
          - exact source: f239fe0495fb86fb836167a88482c9d7f010cf7c

          Production installation and OWNER visual acceptance remain separate gates.
          MD
            gh release create "$RELEASE_TAG" "tested/$ASSET_NAME" --repo "$TARGET_REPOSITORY" --target "$TARGET_SHA" --title "VF Tools Ops V1.21.961" --notes-file release-notes.md
          fi

      - name: Remote exact readback
        shell: bash
        env:
          GH_TOKEN: ${{ env.RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          JSON="$(gh api "repos/$TARGET_REPOSITORY/releases/tags/$RELEASE_TAG")"
          RID="$(jq -r '.id' <<<"$JSON")"
          AID="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.id' <<<"$JSON")"
          SIZE="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.size' <<<"$JSON")"
          PUB="$(jq -r '.published_at' <<<"$JSON")"
          TAG_SHA="$(gh api "repos/$TARGET_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          test "$TAG_SHA" = "$TARGET_SHA"
          test "$SIZE" = "$EXPECTED_BYTES"
          rm -rf readback; mkdir readback
          gh release download "$RELEASE_TAG" --repo "$TARGET_REPOSITORY" --pattern "$ASSET_NAME" --dir readback --clobber
          test "$(stat -c %s "readback/$ASSET_NAME")" = "$EXPECTED_BYTES"
          test "$(sha256sum "readback/$ASSET_NAME"|awk '{print $1}')" = "$EXPECTED_SHA256"
          echo "FORMAL_RELEASE_REMOTE_READBACK=PASS"
          echo "RELEASE_ID=$RID"
          echo "ASSET_ID=$AID"
          echo "PUBLISHED_AT=$PUB"
          echo "ASSET_BYTES=$SIZE"
          echo "ASSET_SHA256=$EXPECTED_SHA256"
          echo "RUNTIME_FILES=$EXPECTED_RUNTIME_FILES"
          echo "RUNTIME_FINGERPRINT=$EXPECTED_RUNTIME_FP"

      - name: Cleanup
        if: always()
        run: rm -rf target tested readback
