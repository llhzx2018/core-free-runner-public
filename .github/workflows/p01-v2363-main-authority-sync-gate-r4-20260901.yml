name: P01 V2.36.3 Main Authority Sync Gate R4
on:
  push:
    branches: [release/p01-v2363-candidate-20260901]
    paths: [.github/workflows/p01-v2363-main-authority-sync-gate-r4-20260901.yml]
permissions:
  contents: read
  actions: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE_MAIN: 21ac0ff14f17237212d288f71e95bde6eae503ec
      HEAD: a419017dd68caa16a90ac14b95a91d840c0e44fe
      HEAD_TREE: aae7f815d35a738354a885746936e2b902b38bc2
      DEVELOP_CLOSURE: f0a54a43af8614426995dc3894ccedfd919be8ac
      RUNTIME_TREE: 820724b585cb59864211f77c4fb33537b2345029
      FORMAL: 718e043e3715ef7b21849bc08634fca89bf92c1f
      CORE_LIVE: 650935cc9d71570a7ab7a0dd1c615ea5e3bf74bf
      SYNC_BRANCH: docs/p01-v2363-main-authority-sync-20260901
      REMOTE_TRUTH_R2: '33504969865'
      DEVELOP_AUTHORITY_GATE: '33505729408'
      PREP_R2: '33506063170'
      EVID: /tmp/p01-v2363-main-authority-sync-gate-r4
    steps:
      - name: Checkout exact product authority candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.HEAD }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Checkout exact live core-updates
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CORE_LIVE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: core
      - name: Validate exact main authority candidate R4
        shell: bash
        env:
          RUNNER_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVID"
          exec > >(tee "$EVID/log.txt") 2>&1
          expected=$'VF_PROJECT.json\ndocs/authority/CURRENT.md\ndocs/evidence/P01_V2.36.3_RELEASE_CLOSURE_20260901.md\ndocs/handoff/CURRENT_STATE.md'

          echo 'phase=product-local-identity'
          cd product
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git rev-parse HEAD^)" = "$BASE_MAIN"
          test "$(git rev-parse HEAD^{tree})" = "$HEAD_TREE"
          test "$(git diff --name-only "$BASE_MAIN" "$HEAD" | sort)" = "$expected"
          test -z "$(git diff --name-only "$BASE_MAIN" "$HEAD" -- src)"
          test "$(git rev-parse "$BASE_MAIN:src")" = "$RUNTIME_TREE"
          test "$(git rev-parse "$HEAD:src")" = "$RUNTIME_TREE"

          echo 'phase=product-remote-git-fence'
          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          remote_dev="$(git ls-remote origin refs/heads/develop | awk '{print $1}')"
          remote_sync="$(git ls-remote origin "refs/heads/$SYNC_BRANCH" | awk '{print $1}')"
          remote_tag="$(git ls-remote origin refs/tags/v2.36.3 | awk '{print $1}')"
          printf 'remote-main=%s\nremote-develop=%s\nremote-sync=%s\nremote-tag=%s\n' "$remote_main" "$remote_dev" "$remote_sync" "$remote_tag"
          test "$remote_main" = "$BASE_MAIN"
          test "$remote_dev" = "$DEVELOP_CLOSURE"
          test "$remote_sync" = "$HEAD"
          test "$remote_tag" = "$FORMAL"

          echo 'phase=develop-snapshot-identity'
          git fetch origin "$DEVELOP_CLOSURE" --quiet
          test "$(git rev-parse "$DEVELOP_CLOSURE^{tree}")" = "$HEAD_TREE"
          for f in VF_PROJECT.json docs/authority/CURRENT.md docs/evidence/P01_V2.36.3_RELEASE_CLOSURE_20260901.md docs/handoff/CURRENT_STATE.md; do
            test "$(git rev-parse "$HEAD:$f")" = "$(git rev-parse "$DEVELOP_CLOSURE:$f")"
          done

          echo 'phase=authority-content'
          python3 -m json.tool VF_PROJECT.json >/dev/null
          jq -e '.production_version=="2.36.2" and .working_version=="2.36.3" and .target_release_version=="2.36.3"' VF_PROJECT.json >/dev/null
          jq -e '.published_release.version=="2.36.3" and .published_release.tag=="v2.36.3" and .published_release.release_id==380449563' VF_PROJECT.json >/dev/null
          jq -e '.published_release.release_source=="718e043e3715ef7b21849bc08634fca89bf92c1f" and .published_release.runtime_tree=="820724b585cb59864211f77c4fb33537b2345029"' VF_PROJECT.json >/dev/null
          jq -e '.published_release.live_core_updates_commit=="650935cc9d71570a7ab7a0dd1c615ea5e3bf74bf" and .published_release.online_asset_sha256=="7110d0e232ce7dec521b4e76148441d06376a02124249d68237b774f2d33447d"' VF_PROJECT.json >/dev/null
          jq -e '.current_change.production_write==false and .current_change.runner_main_write==false' VF_PROJECT.json >/dev/null
          grep -F '<!-- P01_V2363_RELEASE_CLOSURE -->' docs/authority/CURRENT.md >/dev/null
          grep -F '<!-- P01_V2363_RELEASE_CLOSURE -->' docs/handoff/CURRENT_STATE.md >/dev/null
          grep -F 'Owner Production remains **V2.36.2**' docs/evidence/P01_V2.36.3_RELEASE_CLOSURE_20260901.md >/dev/null

          echo 'phase=core-updates-git-fence'
          cd ../core
          test "$(git rev-parse HEAD)" = "$CORE_LIVE"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$CORE_LIVE"
          jq -e '.current_version=="2.36.2" and .target_version=="2.36.3" and .from_versions==["2.36.2"] and .release_tag=="v2.36.3" and .release_id==380449563 and .product_identity=="718e043e3715ef7b21849bc08634fca89bf92c1f" and .asset_name=="VF_Start_V2.36.3_UPDATE.zip" and .asset_bytes==1236976 and .asset_sha256=="7110d0e232ce7dec521b4e76148441d06376a02124249d68237b774f2d33447d"' projects/P01.json >/dev/null

          echo 'phase=runner-self-readback'
          export GH_TOKEN="$RUNNER_TOKEN"
          for run in "$REMOTE_TRUTH_R2" "$DEVELOP_AUTHORITY_GATE" "$PREP_R2"; do
            conclusion="$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$run --jq .conclusion)"
            echo "runner-run=$run conclusion=$conclusion"
            test "$conclusion" = success
          done
          test "$(gh api repos/llhzx2018/core-free-runner-public/branches/main --jq .commit.sha)" = e569c491506e2a367d01a18cfa89a234a22abb79

          printf 'P01_V2363_MAIN_AUTHORITY_SYNC_GATE_R4=PASS\nBASE_MAIN=%s\nHEAD=%s\nHEAD_TREE=%s\nDEVELOP_CLOSURE=%s\nSRC_TREE=%s\nPUBLISHED_LATEST=2.36.3\nOWNER_PRODUCTION=2.36.2\nCORE_UPDATES_MAIN=%s\nOWNER_PRODUCTION_WRITE=NO\n' "$BASE_MAIN" "$HEAD" "$HEAD_TREE" "$DEVELOP_CLOSURE" "$RUNTIME_TREE" "$CORE_LIVE" | tee "$EVID/verdict.txt"
      - name: Upload main authority gate R4 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2363-main-authority-sync-gate-r4-${{ github.run_id }}
          path: ${{ env.EVID }}
          if-no-files-found: error
          retention-days: 90
