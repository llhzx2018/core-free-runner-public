name: P02 V2.4.24 Live Category Count Candidate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p02-v2424-live-count-fix-main.yml'

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout public runner shell
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Require unified release write token
        shell: bash
        env:
          TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$TOKEN"

      - name: Checkout exact P02 maintenance branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: task/v2.4.24-live-category-counts
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          path: p02
          fetch-depth: 0
          persist-credentials: true

      - name: Guard Production base
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p02 rev-parse HEAD)" = '333d4fd52150f1c15e9911bce312bb2b6775f856'
          test "$(tr -d '\r\n' < p02/VERSION)" = '2.4.23'

      - name: Apply focused V2.4.24 maintenance patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/p02-v2424-live-count-fix.py p02

      - name: Static patch guards
        shell: bash
        working-directory: p02
        run: |
          set -Eeuo pipefail
          test "$(grep -c 'async function refreshNavigationMetadata' public/assets/app.js)" = 1
          test "$(grep -c 'await refreshNavigationMetadata' public/assets/app.js)" = 2
          test "$(tr -d '\r\n' < VERSION)" = '2.4.24'
          node --check public/assets/app.js
          node --check tests/e2e/maintenance_reverify.mjs
          python3 -m py_compile scripts/build-release.py
          git diff --check

      - name: Commit and push exact Candidate
        shell: bash
        working-directory: p02
        run: |
          set -Eeuo pipefail
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add public/assets/app.js tests/e2e/maintenance_reverify.mjs scripts/maintenance-reverify.sh scripts/build-release.py scripts/verify-release-artifacts.sh VERSION README.md CHANGELOG.md VF_PROJECT.json SOURCE_MANIFEST.json SOURCE_MANIFEST.txt
          git diff --cached --check
          git commit -m 'fix(library): refresh category counts after content save' -m 'V2.4.24 maintenance candidate. Browser regression covers create +1, trash -1 and restore +1. Schema remains 2401.'
          git push origin HEAD:task/v2.4.24-live-category-counts
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)"

      - name: Install runtime dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-zip php-curl sqlite3 curl unzip
          cd p02
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Full maintenance and browser regression
        shell: bash
        working-directory: p02
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/p02-v2424-maintenance
          TEST_PASSWORD: P02-V2424-${{ github.run_id }}-${{ github.run_attempt }}!
        run: |
          set -Eeuo pipefail
          bash scripts/maintenance-reverify.sh
          python3 - "$EVIDENCE_DIR/summary.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1],encoding='utf-8'))
          assert x.get('result')=='PASS',x
          assert x.get('version')=='2.4.24',x
          assert int(x.get('schema',0))==2401,x
          print('V2.4.24 MAINTENANCE + BROWSER E2E PASS')
          PY

      - name: Formal V2.4.23 to V2.4.24 release artifact verification
        shell: bash
        working-directory: p02
        env:
          VF_RELEASE_OLD_COMMIT: 333d4fd52150f1c15e9911bce312bb2b6775f856
          VF_RELEASE_SOURCE_REF: task/v2.4.24-live-category-counts
        run: |
          set -Eeuo pipefail
          export VF_RELEASE_SOURCE_SHA="$(git rev-parse HEAD)"
          bash scripts/verify-release-artifacts.sh
          test -f build/release/VF_Library_V2.4.24_UPDATE.zip
          test -f build/release/VF_Library_V2.4.24_RELEASE_MANIFEST.json
          echo "UPDATE_BYTES=$(stat -c '%s' build/release/VF_Library_V2.4.24_UPDATE.zip)"
          echo "UPDATE_SHA256=$(sha256sum build/release/VF_Library_V2.4.24_UPDATE.zip | awk '{print $1}')"
          echo 'V2.4.24 FORMAL RELEASE ARTIFACT GATES PASS'

      - name: Upload verified Candidate Release Set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: P02-V2.4.24-CANDIDATE-RELEASE-SET-${{ github.run_id }}
          path: p02/build/release/
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup private source and raw evidence
        if: always()
        shell: bash
        run: |
          rm -rf p02 "$RUNNER_TEMP"/p02-v2424-maintenance "$RUNNER_TEMP"/vf-library-release-* || true
