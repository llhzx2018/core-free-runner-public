name: P07 System Care RC11 Inventory Discovery Gate

on:
  push:
    branches: [gate/p07-system-care-rc11-inventory-discovery-20260908]
    paths:
      - '.github/workflows/p07-system-care-rc11-inventory-discovery-gate.yml'

permissions:
  contents: read

jobs:
  rc11:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact RC11 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: e07c0f2b39617d62b7eb28c79b68c07bbad4bcf1
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: product
          persist-credentials: false
          fetch-depth: 1

      - name: Exact identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = e07c0f2b39617d62b7eb28c79b68c07bbad4bcf1
          test "$(cat product/modules/system-care/VERSION)" = 0.1.0-rc11
          echo P07_SYSTEM_CARE_RC11_EXACT_SOURCE=PASS

      - name: Bash and Python syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n product/modules/system-care/vf-system-care.sh
          bash -n product/modules/system-care/intrusion-evidence.sh
          bash -n product/modules/system-care/intrusion-evidence-entry.sh
          python3 -m py_compile \
            product/modules/system-care/lib/intrusion_scan.py \
            product/modules/system-care/lib/intrusion_discovery.py \
            product/modules/system-care/lib/intrusion_evidence.py \
            product/modules/system-care/lib/intrusion_state.py \
            product/modules/system-care/lib/intrusion_logs.py
          echo P07_SYSTEM_CARE_RC11_SYNTAX=PASS

      - name: Static gate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          bash modules/system-care/tests/static_gate.sh

      - name: Full functional regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          bash modules/system-care/tests/functional_gate.sh

      - name: RC11 contract markers
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product/modules/system-care
          grep -Fq 'WordPress enrollment first reuses CloudPanel inventory facts' vf-system-care.sh
          grep -Fq '不用重复按开启' intrusion-evidence-entry.sh
          grep -Fq '_cloudpanel_inventory' lib/intrusion_scan.py
          grep -Fq '_nginx_inventory' lib/intrusion_scan.py
          grep -Fq 'NoWordPressSitesError' lib/intrusion_scan.py
          grep -Fq 'P07_WP_DISCOVERY_CLOUDPANEL_SITES' lib/intrusion_discovery.py
          echo P07_SYSTEM_CARE_RC11_INVENTORY_CONTRACT=PASS

      - name: Final
        shell: bash
        run: echo P07_SYSTEM_CARE_RC11_INVENTORY_DISCOVERY_MACHINE_GATE=PASS
