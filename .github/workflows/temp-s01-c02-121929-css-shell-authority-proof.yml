name: TEMP S01-C02 1.21.929 CSS Shell Authority Proof

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  exact-source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: 8bfa04f4690c968475a853b8467359afcea085ba
      BASE_SHA: 94165c3685dcbaa14949225a3d40d580a74a52cc

    steps:
      - name: Checkout exact product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 8bfa04f4690c968475a853b8467359afcea085ba
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: product
          persist-credentials: false

      - name: Exact bounded diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C product rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' < product/VERSION)" = "1.21.929"
          actual="$(git -C product diff --name-only "$BASE_SHA" "$SOURCE_SHA" | sort)"
          expected="$(printf '%s\n' \
            CHANGELOG.md \
            VERSION \
            assets/css/current/admin-s01-cloudflare-golden-tools-r1.css \
            assets/css/current/admin-s01-cloudflare-operations-r4.css \
            assets/css/current/admin-s01-compat-r30.css \
            assets/css/current/admin-s01-console-v2.css \
            assets/css/current/admin-s01-owner-visual-r6.css \
            assets/css/current/admin-s01-saas-product-r7.css \
            assets/css/current/admin-s01-uiux-polish.css \
            assets/css/current/admin-s01-v7-product-system-r1.css \
            tests/s01-c02-121929-css-shell-authority-r40-contract.php \
            vf-ops.php | sort)"
          test "$actual" = "$expected"
          test "$(git -C product diff --name-only "$BASE_SHA" "$SOURCE_SHA" -- database config includes/wp-update includes/admin-v13/route-contract.php includes/admin-v13/tab-controller.php includes/admin-v13/services docs/authority | wc -l)" = "0"

      - name: PHP syntax and R40 contract
        shell: bash
        run: |
          set -euo pipefail
          php -l product/vf-ops.php
          php -l product/tests/s01-c02-121929-css-shell-authority-r40-contract.php
          php product/tests/s01-c02-121929-css-shell-authority-r40-contract.php

      - name: Independent CSS shell ownership proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root=Path("product")
          loader=(root/"includes/views/admin-style-helpers/admin-s01-uiux-polish.php").read_text(encoding="utf-8")
          loaded=sorted(set(re.findall(r"""['"](assets/css/[^'"]+\.css)['"]""",loader)))
          assert len(loaded)==35, len(loaded)

          authority="assets/css/current/admin-s01-v6-shell-r1.css"
          pagehead="assets/css/current/admin-s01-structural-pagehead-r38.css"
          assert authority in loaded
          assert pagehead in loaded

          forbidden=[
            ".vf-v6-shell-header",
            ".vf-v6-brand",
            ".vf-v6-domain",
            ".vf-v6-shell-main",
            ".vf-v7-appbar",
            ".vf-v7-brand",
            ".vf-v7-domain",
            ".vf-v7-workspace-context",
            ".vf-v8-product-shell",
            ".vf-v8-current-domain",
            ".vf-console-brand",
            ".vf-console-logo",
            ".vf-console-domain-nav",
            ".vf-v13-domain-split",
            ".vf-v13-section-menu",
            ".vf-v13-route-tabs",
            ".vf-v13-local-task",
            ".vf-v13-product-taskbar",
            ".vf-v13-compat-directory",
            ".vf-v13-compat-route-banner",
          ]

          offenders={}
          for rel in loaded:
              css=(root/rel).read_text(encoding="utf-8",errors="ignore")
              assert css.count("{")==css.count("}"), rel
              if rel==authority:
                  continue
              hits=[token for token in forbidden if token in css]
              if hits:
                  offenders[rel]=hits
          assert not offenders, offenders

          shell=(root/authority).read_text(encoding="utf-8")
          for token in [
              "--vf-v6-shell-header-min-height:82px",
              "--vf-v6-shell-logo-size:42px",
              "--vf-v6-shell-brand-font:15px",
              "--vf-v6-shell-nav-font:13px",
              "--vf-v6-shell-nav-min-height:54px",
          ]:
              assert token in shell, token

          php=(root/"includes/views/admin-shell-tabs-parts/02-shell-navigation.php").read_text(encoding="utf-8")
          for fn in (
              "vf_ops_v13_render_shell_header_v121928",
              "vf_ops_v13_render_shell_navigation_v121928",
              "vf_ops_v13_render_shell_open_v121928",
              "vf_ops_v13_render_shell_close_v121928",
          ):
              assert ("function "+fn) in php, fn

          route=(root/"includes/admin-v13/route-contract.php").read_text(encoding="utf-8")
          rows=[]
          for line in route.splitlines():
              m=re.match(r"^\s*'([^']+)'\s*=>\s*\[(.*)\],?\s*$",line)
              if not m: continue
              body=m.group(2)
              if "'view'=>'admin-v13/views/" in body and "'status'=>'" in body:
                  rows.append(m.group(1))
          assert len(rows)==39, len(rows)

          declared=set(re.findall(r"admin-v13/views/[A-Za-z0-9_-]+\.php",route))
          physical=set(p.relative_to(root/"includes").as_posix() for p in (root/"includes/admin-v13/views").rglob("*.php"))
          assert physical==declared, (sorted(physical-declared),sorted(declared-physical))

          print("LOADED_CSS=35")
          print("PHP_GLOBAL_SHELL_AUTHORITY=1")
          print("CSS_GLOBAL_SHELL_AUTHORITY=1")
          print("LOADED_LEGACY_CSS_SHELL_OWNERS=0")
          print("FORMAL_ROUTES=39")
          print("OWNER_VISIBLE_SURFACES=40")
          print("UNKNOWN_VIEW_AUTHORITY=0")
          print("RESULT=PASS")
          PY

      - name: Cleanup
        if: always()
        run: rm -rf product

# synchronize CSS shell authority proof
