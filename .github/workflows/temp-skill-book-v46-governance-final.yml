name: TEMP skill-book V4.6 Governance Final

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-skill-book-v46-governance-final.yml'
      - '.github/scripts/temp_v46_governance_reconcile.py'

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Checkout temporary runner branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          path: runner
      - name: Reconcile V4.6 governance pointers
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$RELEASE_TOKEN"
          python3 runner/.github/scripts/temp_v46_governance_reconcile.py
