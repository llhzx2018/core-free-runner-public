name: P01 510 core-updates exact PR 975 manifest and official asset proof
on:
  push:
    branches:
      - task/p01-510-channel-975-proof-20261109
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      MANIFEST_COMMIT: e25cad5c9413ab72e48882cb8bc52b1ca250bcb0
      TARGET_VERSION: '2.47.510'
      FROM_VERSION: '2.47.509'
      PRODUCT_COMMIT: 2856343e4a4b40ea1bcc1c3e408a726e4056bf0c
      RELEASE_ID: '439193515'
      UPDATE_SHA256: 742603574889e4dfd00972ed5c8da91ab2718a605d27990e7099ef30332c2bdc
      UPDATE_BYTES: '3870897'
    steps:
      - name: Checkout registered Public Runner controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Transient checkout exact core-updates PR 975 commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.MANIFEST_COMMIT }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: core-updates-exact
          persist-credentials: false
      - name: Validate manifest contract and Update Core regression
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C core-updates-exact rev-parse HEAD)" = "$MANIFEST_COMMIT"
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-xml php-mbstring php-sqlite3 python3 >/dev/null
          cd core-updates-exact
          python3 scripts/check_manifest_contract.py >/tmp/p01-510-channel-manifest-audit.json
          python3 - <<'PY'
          import json, os
          a=json.load(open('/tmp/p01-510-channel-manifest-audit.json'))
          assert a.get('status')=='PASS', a
          m=json.load(open('projects/P01.json'))
          e=os.environ
          assert m['current_version']==e['FROM_VERSION'],m
          assert m['from_versions']==[e['FROM_VERSION']],m
          assert m['target_version']==e['TARGET_VERSION'],m
          assert m['release_id']==int(e['RELEASE_ID']),m
          assert m['product_identity']==e['PRODUCT_COMMIT'],m
          assert m['asset_bytes']==int(e['UPDATE_BYTES']),m
          assert m['asset_sha256']==e['UPDATE_SHA256'],m
          assert m['asset_name']=='VF_Start_V2.47.510_UPDATE.zip',m
          assert m['schema_from']==m['schema_to'],m
          assert m['backup_required'] is True and m['rollback_supported'] is True,m
          print('P01_510_CHANNEL_MANIFEST_EXACT=PASS')
          PY
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find update-core/php -name '*.php' -print0)
          php update-core/php/tests/run.php
          echo P01_510_UPDATE_CORE_NATIVE_CONTRACT=PASS
      - name: Independently download and hash actual official Atomic asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          mkdir -p /tmp/p01-510-official-asset
          gh release download v2.47.510 -R llhzx2018/vf-start -D /tmp/p01-510-official-asset -p VF_Start_V2.47.510_UPDATE.zip
          f=/tmp/p01-510-official-asset/VF_Start_V2.47.510_UPDATE.zip
          test "$(stat -c %s "$f")" = "$UPDATE_BYTES"
          test "$(sha256sum "$f" | awk '{print $1}')" = "$UPDATE_SHA256"
          unzip -t "$f" >/dev/null
          echo P01_510_REMOTE_RELEASE_ASSET_SHA256=PASS
      - name: Cleanup private checkout and temporary bytes
        if: always()
        shell: bash
        run: |
          rm -rf core-updates-exact /tmp/p01-510-channel-manifest-audit.json /tmp/p01-510-official-asset
          echo P01_510_CHANNEL_PRIVATE_CLEANUP=YES
