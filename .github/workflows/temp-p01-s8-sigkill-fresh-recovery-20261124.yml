name: TEMP P01 S8 exact-source SIGKILL fresh-process Atomic recovery proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p01-s8-sigkill-fresh-recovery-20261124.yml'

permissions:
  contents: read

concurrency:
  group: p01-s8-sigkill-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  synthetic-crash-recovery:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'test/p01-s8-sigkill-fresh-recovery-')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Read exact private candidate code transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-startnew
          ref: e5ca7c24fd8586529df65029416d221365ddfee0
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
          fetch-depth: 1

      - name: Prove exact P01 source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C private-src rev-parse HEAD)" = "e5ca7c24fd8586529df65029416d221365ddfee0"
          echo 'P01_S8_KILL_EXACT_SOURCE=PASS'

      - name: Prepare real Linux PHP8.4 process signals and SQLite recovery libraries
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pcntl, posix, mbstring, pdo_sqlite, sqlite3, dom, xml, fileinfo, curl, openssl, zip, sodium
          tools: composer:v2
          coverage: none

      - name: Run actual forked SIGKILL and two fresh-process recovery tests
        working-directory: private-src
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          php -r 'exit(extension_loaded("pcntl") && extension_loaded("posix") && extension_loaded("sodium") && extension_loaded("sqlite3") && extension_loaded("zip") ? 0 : 1);'
          echo 'P01_S8_KILL_NATIVE_EXTENSIONS=PASS'
          python3 scripts/check_php_syntax.py > "$RUNNER_TEMP/p01-kill-lint.log" 2>&1 || { echo 'P01_S8_KILL_PHP_LINT=FAIL'; exit 1; }
          echo 'P01_S8_KILL_PHP_LINT=PASS'
          composer install --no-interaction --prefer-dist --no-progress --quiet > "$RUNNER_TEMP/p01-kill-composer.log" 2>&1 || { echo 'P01_S8_KILL_COMPOSER=FAIL'; exit 1; }
          echo 'P01_S8_KILL_COMPOSER=PASS'
          export APP_ENV=testing DB_CONNECTION=sqlite DB_DATABASE=:memory:
          export APP_KEY="base64:$(openssl rand -base64 32)"
          set +e
          ./vendor/bin/phpunit --log-junit "$RUNNER_TEMP/p01-kill-junit.xml" --filter='test_real_sigkill_' tests/Unit/IsolatedAtomicUpgradeCycleTest.php > "$RUNNER_TEMP/p01-kill-phpunit.log" 2>&1
          result=$?
          set -e
          python3 - "$RUNNER_TEMP/p01-kill-junit.xml" <<'PY'
          import pathlib,sys,re,xml.etree.ElementTree as ET
          path=pathlib.Path(sys.argv[1])
          if not path.is_file():
              print('P01_S8_KILL_JUNIT=MISSING')
              sys.exit(1)
          root=ET.parse(path).getroot()
          cases=list(root.iter('testcase'))
          skipped=sum(c.find('skipped') is not None for c in cases)
          failures=sum(c.find('failure') is not None or c.find('error') is not None for c in cases)
          assertions=sum(int(c.get('assertions','0')) for c in cases)
          print('P01_S8_KILL_JUNIT='+','.join(map(str,(len(cases),assertions,skipped,failures))))
          if len(cases)!=2 or assertions<25 or skipped or failures:
              for c in cases:
                  if c.find('error') is None and c.find('failure') is None: continue
                  method=re.sub(r'[^A-Za-z0-9_]', '',c.get('name',''))[:110]
                  print('P01_S8_KILL_FAILED_METHOD='+method)
              sys.exit(1)
          PY
          if [ "$result" -ne 0 ]; then echo 'P01_S8_KILL_NEW_PROCESS_RECOVERY=FAIL'; exit "$result"; fi
          echo 'P01_S8_KILL_NEW_PROCESS_RECOVERY=PASS'
          echo 'P01_S8_KILL_FRESH_PROCESS_AND_TAMPER_DENIAL=PASS'

      - name: Always remove private checkout and all test evidence bytes
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- private-src
          rm -f -- "$RUNNER_TEMP"/p01-kill-*
          test ! -e private-src
          echo 'P01_S8_KILL_PRIVATE_CLEANUP=PASS'
