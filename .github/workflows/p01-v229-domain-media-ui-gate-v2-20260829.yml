name: P01 V2.29 Domain Media UI Gate V2

on:
  push:
    branches:
      - task/p01-v229-domain-media-gate-v2-20260829

permissions:
  contents: read

env:
  SOURCE_SHA: 03244e101fdc037954e7f7bc8054066439d53ba0
  ROOT: /tmp/p01-v229-domain-ui
  PORT: '18430'
  ADMIN_PASS: 'P01Domain!2026'

jobs:
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none

      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: source

      - name: Fresh runtime and fixtures
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          rm -rf "$ROOT" /tmp/p01-domain-ui-* || true
          cp -a source/src "$ROOT"
          php -S "127.0.0.1:${PORT}" -t "$ROOT" >/tmp/p01-domain-ui-server.log 2>&1 &
          COOKIE=/tmp/p01-domain-ui-setup.cookies
          for i in $(seq 1 30); do curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:${PORT}/setup.php" -o /tmp/p01-domain-ui-setup.html && break || sleep 1; done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-domain-ui-setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:${PORT}/setup.php" --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=P01 Domain UI Gate' --data-urlencode "admin_password=$ADMIN_PASS" --data-urlencode "admin_password_confirm=$ADMIN_PASS" -o /tmp/p01-domain-ui-setup-post.html
          php "$ROOT/cli/verify.php" | grep -Fx VERIFY_PASS=YES
          cat >/tmp/p01-domain-ui-seed.php <<'PHP'
          <?php
          declare(strict_types=1);$root=getenv('ROOT');require $root.'/app/bootstrap.php';require_once $root.'/app/SurfaceRepository.php';$r=new VfRepository(vf_db());$s=new VfSurfaceRepository(vf_db());$pub=$r->createCategory(['name'=>'公开网址','is_private'=>false]);$pri=$r->createCategory(['name'=>'私人网址','is_private'=>true]);$id=(int)$r->saveLink(null,['category_id'=>$pri,'title'=>'频道 旅行生活','url'=>'https://channel.example.com','is_private'=>false],'manual')['id'];$s->upsertProfile($id,['surface'=>'channels','resource_kind'=>'旅行生活']);echo 'UI_SEED=PASS'.PHP_EOL;
          PHP
          ROOT="$ROOT" php /tmp/p01-domain-ui-seed.php | grep -Fx UI_SEED=PASS

      - name: Browser compression and visible taxonomy
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os,struct,zlib
          w,h=1600,1000;raw=bytearray()
          for _ in range(h):raw.extend(b'\x00'+os.urandom(w*3))
          def c(t,d):return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
          p=b'\x89PNG\r\n\x1a\n'+c(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))+c(b'IDAT',zlib.compress(bytes(raw),6))+c(b'IEND',b'');open('/tmp/p01-domain-ui-large.png','wb').write(p)
          PY
          mkdir -p /tmp/p01-domain-ui-browser && cd /tmp/p01-domain-ui-browser
          npm init -y >/dev/null 2>&1;npm install playwright@1.55.0 --no-save >/dev/null 2>&1;npx playwright install chromium >/dev/null 2>&1
          cat >gate.mjs <<'JS'
          import { chromium } from 'playwright';
          const base='http://127.0.0.1:18430';const browser=await chromium.launch({headless:true});const ctx=await browser.newContext({viewport:{width:1440,height:900}});const login=await ctx.request.post(base+'/api.php?action=login',{data:{password:'P01Domain!2026'}});if(!login.ok())throw new Error('login');const p=await ctx.newPage();
          await p.goto(base+'/topics.php?scope=public',{waitUntil:'networkidle'});const topicHeading=await p.locator('.vf-category-title>span').textContent();if(topicHeading?.trim()!=='专题分类')throw new Error('visible topic taxonomy '+topicHeading);if(await p.locator('.vf-category-section[aria-label="网址分类导航"]:visible').count())throw new Error('visible Start taxonomy leaked');
          await p.locator('[data-open-add]').click();const f=p.locator('[data-add-form]');if(await f.locator('select[name="surface"]').inputValue()!=='topics')throw new Error('topic context');await f.locator('input[name="url"]').fill('https://generated-topic.example.com');await f.locator('input[name="title"]').fill('浏览器压缩专题');await f.locator('input[name="resource_kind"]').fill('学习决策');await f.locator('input[name="tags"]').fill('AI, 对比');await f.locator('input[name="cover"]').setInputFiles('/tmp/p01-domain-ui-large.png');await f.locator('button[type="submit"]:not([data-add-continue])').click();await p.waitForLoadState('networkidle');const card=p.locator('.vf-topic-card').filter({hasText:'浏览器压缩专题'});await card.waitFor();const src=await card.locator('.vf-topic-cover img').getAttribute('src');if(!src?.includes('resource-cover.php'))throw new Error('cover not rendered');await p.screenshot({path:'/tmp/p01-domain-ui-topics.png',fullPage:true});
          await p.setViewportSize({width:390,height:844});await p.goto(base+'/channels.php?scope=public',{waitUntil:'networkidle'});const channelHeading=await p.locator('.vf-category-title>span').textContent();if(channelHeading?.trim()!=='频道分类')throw new Error('visible channel taxonomy '+channelHeading);if(await p.locator('.vf-category-section[aria-label="网址分类导航"]:visible').count())throw new Error('mobile Start taxonomy leaked');const overflow=await p.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);if(overflow>1)throw new Error('mobile overflow '+overflow);await p.screenshot({path:'/tmp/p01-domain-ui-channel-mobile.png',fullPage:true});await browser.close();console.log('P01_DOMAIN_UI=PASS');
          JS
          node gate.mjs | grep -Fx P01_DOMAIN_UI=PASS
          cat >/tmp/p01-domain-ui-cover.php <<'PHP'
          <?php
          declare(strict_types=1);$r=getenv('ROOT');require $r.'/app/bootstrap.php';$db=vf_db();$row=$db->query("SELECT raf.* FROM resource_asset_files raf JOIN links l ON l.id=raf.link_id WHERE l.title='浏览器压缩专题' AND raf.asset_kind='cover'")->fetch(PDO::FETCH_ASSOC);if(!$row)throw new RuntimeException('cover missing');if((int)$row['byte_size']>1200*1024)throw new RuntimeException('cover bytes');if((int)$row['width']>960||(int)$row['height']>960)throw new RuntimeException('cover dimensions');if(!in_array($row['mime_type'],['image/webp','image/jpeg'],true))throw new RuntimeException('cover mime');if((string)$db->query('PRAGMA integrity_check')->fetchColumn()!=='ok')throw new RuntimeException('sqlite');if($db->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC))throw new RuntimeException('fk');echo 'P01_DOMAIN_UI_COVER=PASS'.PHP_EOL;
          PHP
          ROOT="$ROOT" php /tmp/p01-domain-ui-cover.php | grep -Fx P01_DOMAIN_UI_COVER=PASS

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: p01-v229-domain-media-ui-v2
          path: |
            /tmp/p01-domain-ui-topics.png
            /tmp/p01-domain-ui-channel-mobile.png
          if-no-files-found: error
          retention-days: 14
