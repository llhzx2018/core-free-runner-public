name: R70 Focused Default Sort Route Gate

on:
  pull_request:
    paths:
      - '.github/workflows/r70-default-sort-route.yml'

permissions:
  contents: read

jobs:
  r70-focused-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: dc5532540de83a2ad594458b70b5df6bc0007918
    steps:
      - name: Checkout exact private P01 candidate transiently
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.EXPECTED_SHA }}
          path: vf-start
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_sqlite,sqlite3,curl
          coverage: none

      - name: Exact source and focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd vf-start
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(cat VERSION)" = '2.47.0'
          php -l src/app/ToolProductPage.php
          php -l src/app/SoftwareWorkspaceDetail.php
          php -l tests/unit/default_sort_result_route_contract.php
          php tests/unit/default_sort_result_route_contract.php
          php tests/unit/derived_sort_route_continuity_contract.php
          php tests/unit/smart_view_sort_reset_contract.php
          php tests/unit/watch_status_context_badge_contract.php
          echo R70_DEFAULT_SORT_RESULT_ROUTE_PASS
          echo R70_EXACT_CANDIDATE_GATE_PASS

      - name: Cleanup transient private source
        if: always()
        shell: bash
        run: rm -rf "$GITHUB_WORKSPACE/vf-start"
