name: S01 C02 1211097 Official Package Preflight
on:
  push:
    branches: [task/s01-c02-1211097-formal-release-20261012]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact proven source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: fa3417b7555f540877a29cb993d52ed89c53f088
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Compute official ZIP identity from exact proven tree
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "fa3417b7555f540877a29cb993d52ed89c53f088"
          test "$(git -C product rev-parse HEAD^{tree})" = "5d1b53748d18d7b3ed777563d99e26d0f435db66"
          python3 product/.github/release/build-ops-package.py --source product --output /tmp/vf-tools-ops_V1.21.1097.zip > /tmp/package.json
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile
          p=pathlib.Path('/tmp/vf-tools-ops_V1.21.1097.zip')
          r=json.loads(pathlib.Path('/tmp/package.json').read_text()); b=p.read_bytes()
          assert r['version']=='1.21.1097'
          assert r['asset_bytes']==len(b) and r['asset_sha256']==hashlib.sha256(b).hexdigest()
          with zipfile.ZipFile(p) as z: assert len(z.namelist())==r['runtime_files'] and 'vf-ops/vf-ops.php' in z.namelist()
          print('OFFICIAL_1097_PACKAGE_IDENTITY='+json.dumps(r,sort_keys=True),flush=True)
          print('OFFICIAL_1097_PRE_RELEASE_BUILD_PASS')
          PY
