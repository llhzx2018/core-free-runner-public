name: P01 Favicon Stale Success Gate

on:
  push:
    branches:
      - test-p01-favicon-stale-success-20260930
    paths:
      - '.github/workflows/temp-p01-favicon-stale-success.yml'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact P01 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 1c18e4960fba5b6fa2b069f936cc0e0a65745564
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product

      - name: Syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l product/src/app/IconCache.php
          php -l product/src/app/FunctionalWorkspace.php
          php -l product/tests/unit/navigation_v247131_favicon_stale_success_selfheal_contract.php
          node --check product/src/assets/workspace.js
          echo P01_FAVICON_STALE_SUCCESS_SYNTAX=PASS

      - name: Focused favicon contracts
        shell: bash
        run: |
          set -euo pipefail
          cd product
          php tests/unit/navigation_v247127_favicon_reliability_contract.php
          php tests/unit/navigation_v247128_favicon_recovery_queue_contract.php
          php tests/unit/navigation_v247130_favicon_provider_generation_contract.php
          php tests/unit/navigation_v247131_favicon_stale_success_selfheal_contract.php
          echo P01_FAVICON_STALE_SUCCESS_FOCUSED=PASS
