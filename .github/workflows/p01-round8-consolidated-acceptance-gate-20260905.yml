name: P01 Round 8 Consolidated Acceptance Gate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p01-round8-consolidated-acceptance-gate-20260905.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_REF: verify/p01-consolidated-product-acceptance-20260905
      EXPECTED_SHA: 2ca9dbe01a73ab9b2529a81accf2d51d34959435
      BASE_SHA: e9c6549c046e9f934ac8113fc686bb096eef78f3
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Verify exact source and L2 boundary
        shell: bash
        run: |
          set -euo pipefail
          cd product
          tested="$(git rev-parse HEAD)"
          echo "TESTED_SHA=${tested}"
          test "${tested}" = "${EXPECTED_SHA}"
          test "$(cat VERSION)" = "2.46.1"
          changed="$(git diff --name-only "${BASE_SHA}..HEAD")"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 2
          printf '%s\n' "$changed" | grep -Fxq 'tests/unit/consolidated_product_acceptance_contract.php'
          printf '%s\n' "$changed" | grep -Fxq 'tests/unit/public_global_nav_contract.php'
          if printf '%s\n' "$changed" | grep -Eq '^(VERSION|src/VERSION\.txt|src/migrations/|src/app/bootstrap\.php)$'; then exit 1; fi
      - name: Syntax
        shell: bash
        run: |
          set -euo pipefail
          cd product
          php -l tests/unit/consolidated_product_acceptance_contract.php
          php -l tests/unit/public_global_nav_contract.php
          for file in src/courses.php src/books.php src/topics.php src/projects.php src/tools.php src/software.php; do php -l "$file"; done
          for file in src/assets/course-experience.js src/assets/tool-scene-detail.js src/assets/software-workspace.js src/assets/topic-project-approved.js src/assets/project-signals.js; do node --check "$file"; done
      - name: Consolidated product contract
        shell: bash
        run: |
          set -euo pipefail
          cd product
          php tests/unit/consolidated_product_acceptance_contract.php
      - name: Cross-surface product regressions
        shell: bash
        run: |
          set -euo pipefail
          cd product
          php tests/unit/workspace_view_catalog_contract.php
          php tests/unit/workspace_nine_entry_source_contract.php
          php tests/unit/course_experience_source_contract.php
          php tests/unit/books_mobile_touch_contract.php
          php tests/unit/books_reader_source_ux_contract.php
          php tests/unit/tool_home_source_contract.php
          php tests/unit/tool_task_intent_contract.php
          php tests/unit/tool_scene_detail_contract.php
          php tests/unit/tool_scene_detail_source_contract.php
          php tests/unit/software_workspace_contract.php
          php tests/unit/software_workspace_source_contract.php
          php tests/unit/topic_project_approved_contract.php
          php tests/unit/topic_project_approved_source_contract.php
          php tests/unit/project_signals_contract.php
          php tests/unit/project_signals_source_contract.php
          php tests/unit/home_project_attention_contract.php
      - name: Shared navigation and action regressions
        shell: bash
        run: |
          set -euo pipefail
          cd product
          php tests/unit/resource_search_contract.php
          php tests/unit/quick_open_global_contract.php
          php tests/unit/primary_open_semantics_contract.php
          php tests/unit/resource_action_semantics_contract.php
          php tests/unit/global_page_size_authority_contract.php
          php tests/unit/public_global_nav_contract.php
