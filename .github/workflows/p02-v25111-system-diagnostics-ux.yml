name: P02 V2.5.111 System Diagnostics UX

on:
  push:
    branches:
      - run/p02-v25111-system-diagnostics-ux-20260924
    paths:
      - '.github/workflows/p02-v25111-system-diagnostics-ux.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact P02 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 8ddaff5f8acc3fe85060bcfb536bc186c77e5a5a
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product

      - name: Install runtime and Chromium
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-zip sqlite3 curl
          cd product
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Exact-source contracts
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "8ddaff5f8acc3fe85060bcfb536bc186c77e5a5a"
          test "$(cat VERSION)" = "2.5.111"
          node tests/unit/p02_v25110_transfer_ux.mjs
          node tests/unit/p02_v25111_system_diagnostics_ux.mjs
          python3 scripts/generate-source-manifest.py
          git diff --exit-code -- SOURCE_MANIFEST.json SOURCE_MANIFEST.txt
          python3 scripts/verify-source-manifest.py
          bash scripts/verify-repository.sh
          echo P02_V25111_EXACT_SOURCE=PASS

      - name: Canonical repository-health unit suite
        working-directory: product
        run: |
          set -Eeuo pipefail
          grep -oE 'node tests/unit/[^[:space:]]+\.mjs' .github/workflows/repository-health.yml | sort -u | while read -r cmd; do
            file="${cmd#node }"
            node "$file"
          done
          echo P02_V25111_CANONICAL_UNIT_SUITE=PASS

      - name: Launch clean V2.5.111 site
        working-directory: product
        env:
          TEST_PASSWORD: "VF-P02-V25111-UX-${{ github.run_id }}!"
        run: |
          set -Eeuo pipefail
          SITE="${RUNNER_TEMP}/p02-v25111-site"
          COOKIE="${RUNNER_TEMP}/p02-v25111-cookie.txt"
          BASE="http://127.0.0.1:18121"
          bash scripts/build-deploy-tree.sh "$SITE"
          test "$(cat "$SITE/VERSION.txt")" = "2.5.111"
          php -d display_errors=0 -S 127.0.0.1:18121 -t "$SITE" >"${RUNNER_TEMP}/p02-v25111-server.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/p02-v25111-server.pid"
          for _ in $(seq 1 80); do curl -fsS "$BASE/setup.php" >/dev/null 2>&1 && break; sleep .25; done
          curl -fsS -c "$COOKIE" "$BASE/setup.php" > "${RUNNER_TEMP}/p02-v25111-setup.html"
          SETUP_CSRF="$(python3 -c 'import re,html,sys;s=open(sys.argv[1],encoding="utf-8").read();m=re.search(r"name=\"setup_csrf\" value=\"([^\"]+)\"",s);assert m;print(html.unescape(m.group(1)))' "${RUNNER_TEMP}/p02-v25111-setup.html")"
          STATUS="$(curl -sS -o /dev/null -w '%{http_code}' -b "$COOKIE" -c "$COOKIE" -H "Origin: $BASE" --data-urlencode "setup_csrf=$SETUP_CSRF" --data-urlencode "password=$TEST_PASSWORD" --data-urlencode "password_confirm=$TEST_PASSWORD" "$BASE/setup.php")"
          test "$STATUS" = "303"

      - name: Real Chromium System Diagnostics navigation regression
        working-directory: product
        env:
          VF_UX_E2E_BASE_URL: http://127.0.0.1:18121
          VF_UX_E2E_PASSWORD: "VF-P02-V25111-UX-${{ github.run_id }}!"
        run: |
          set -Eeuo pipefail
          node tests/e2e/p02_v25111_system_diagnostics_ux.mjs
          echo P02_V25111_SYSTEM_DIAGNOSTICS_BROWSER=PASS

      - name: Stop clean site
        if: always()
        run: |
          if test -f "${RUNNER_TEMP}/p02-v25111-server.pid"; then
            kill "$(cat "${RUNNER_TEMP}/p02-v25111-server.pid")" 2>/dev/null || true
          fi
