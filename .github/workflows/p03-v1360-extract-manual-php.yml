name: P03 V1.36.0 Extract Manual PHP

on:
  pull_request:
    branches: [main]
    paths:
      - 'evidence/p03-v1360-release/manual-php-trigger.txt'
      - '.github/workflows/p03-v1360-extract-manual-php.yml'

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download exact V1.36.0 release asset and extract manual PHP
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p out
          gh release download v1.36.0 --repo llhzx2018/vf-forge -p 'VF_Forge_V1.36.0_Atomic_Upgrade.zip' -D out
          echo 'ef12ef447afd7230acf0736ca8bcf2200da34368abf1004d3333dd84d55cfe02  out/VF_Forge_V1.36.0_Atomic_Upgrade.zip' | sha256sum -c -
          unzip -p out/VF_Forge_V1.36.0_Atomic_Upgrade.zip repair-v1.36.0.php > out/VF_Forge_V1.36.0_MANUAL_UPGRADE.php
          test -s out/VF_Forge_V1.36.0_MANUAL_UPGRADE.php
          grep -Fq "const VFF_ATOMIC_TARGET='1.36.0';" out/VF_Forge_V1.36.0_MANUAL_UPGRADE.php
          grep -Fq 'const VFF_ATOMIC_SCHEMA=30;' out/VF_Forge_V1.36.0_MANUAL_UPGRADE.php
          grep -Fq 'const VFF_ATOMIC_ALLOWED=["1.35.4"];' out/VF_Forge_V1.36.0_MANUAL_UPGRADE.php
          sha256sum out/VF_Forge_V1.36.0_MANUAL_UPGRADE.php > out/VF_Forge_V1.36.0_MANUAL_UPGRADE.php.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: P03-V1.36.0-MANUAL-PHP
          path: |
            out/VF_Forge_V1.36.0_MANUAL_UPGRADE.php
            out/VF_Forge_V1.36.0_MANUAL_UPGRADE.php.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
