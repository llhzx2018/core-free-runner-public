name: P01 V2.33 Owner Production Closure
on:
  push:
    branches: [task/p01-v2330-formal-release-20260830]
    paths:
      - .github/workflows/p01-v2330-production-closure-20260830.yml
      - scripts/p01-v2330-close-production.py
permissions:
  contents: read
jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout gate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: runner
      - name: Checkout exact production-closure branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: closure/p01-v2.33.0-production-20260830
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Write and verify Owner Production closure
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          test "$(git rev-parse HEAD)" = f10a2deabf203b1f99db28251314268b3be89b44
          test "$(git rev-parse HEAD^{tree})" = 0c73c0706eb3e931c120cdd23df11b3086f5e92d
          test "$(git rev-parse HEAD:src)" = febc1b01a5b59963bc974cdc6455cfa824c0adc3
          test "$(cat VERSION)" = 2.33.0
          python3 ../runner/scripts/p01-v2330-close-production.py
          python3 -m json.tool VF_PROJECT.json >/dev/null
          test "$(jq -r .production_version VF_PROJECT.json)" = 2.33.0
          test "$(jq -r .schema_version VF_PROJECT.json)" = 2026082901
          test "$(jq -r .production_release.owner_production_runtime VF_PROJECT.json)" = 2.33.0
          test "$(jq -r .production_release.owner_version_readback VF_PROJECT.json)" = 'CURRENT 2.33.0 = LATEST 2.33.0 / PASS'
          test "$(jq -r .production_release.owner_last_check_readback VF_PROJECT.json)" = '2026-08-30 03:08:21 / PASS'
          test "$(jq -r .production_release.assistant_production_write VF_PROJECT.json)" = false
          test "$(jq -r .production_release.production_closure_gate VF_PROJECT.json)" = "$GITHUB_RUN_ID"
          test "$(jq -r .formal_release_state VF_PROJECT.json)" = 'PUBLISHED / REMOTE_GATE_PASS / OWNER_PRODUCTION_CLOSED'
          test -z "$(git status --porcelain -- src)"
          { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u > /tmp/actual.txt
          printf '%s\n' CHANGELOG.md README.md VF_PROJECT.json docs/README.md docs/authority/ACCEPTANCE_MATRIX.md docs/authority/CURRENT.md docs/authority/P01_FUNCTIONAL_CONTRACT_20260829.md docs/authority/RPD.md docs/authority/SSOT.md docs/evidence/P01_V2.33.0_PRODUCTION_CLOSURE_20260830.md docs/handoff/CURRENT_STATE.md | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          git diff --check
          grep -F 'Current Version: V2.33.0' docs/evidence/P01_V2.33.0_PRODUCTION_CLOSURE_20260830.md >/dev/null
          grep -F 'Latest Version: V2.33.0' docs/evidence/P01_V2.33.0_PRODUCTION_CLOSURE_20260830.md >/dev/null
          grep -F '2.32.0 -> 2.33.0 / success / 2026-08-30 03:08:16' docs/evidence/P01_V2.33.0_PRODUCTION_CLOSURE_20260830.md >/dev/null
          grep -F 'Owner Production Runtime: V2.33.0' docs/authority/CURRENT.md >/dev/null
          grep -F 'OWNER PRODUCTION / PRODUCTION CLOSED' docs/authority/ACCEPTANCE_MATRIX.md >/dev/null
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add CHANGELOG.md README.md VF_PROJECT.json docs/README.md docs/authority/ACCEPTANCE_MATRIX.md docs/authority/CURRENT.md docs/authority/P01_FUNCTIONAL_CONTRACT_20260829.md docs/authority/RPD.md docs/authority/SSOT.md docs/evidence/P01_V2.33.0_PRODUCTION_CLOSURE_20260830.md docs/handoff/CURRENT_STATE.md
          git commit -m 'docs(P01): close V2.33.0 Owner Production'
          git push origin HEAD:closure/p01-v2.33.0-production-20260830
          echo "PRODUCTION_CLOSURE_SOURCE=$(git rev-parse HEAD)"
          echo "PRODUCTION_CLOSURE_TREE=$(git rev-parse HEAD^{tree})"
          echo "RUNTIME_TREE=$(git rev-parse HEAD:src)"
          echo "PRODUCTION_CLOSURE_GATE=$GITHUB_RUN_ID"
          echo OWNER_PRODUCTION_WRITE_BY_ASSISTANT=NO
