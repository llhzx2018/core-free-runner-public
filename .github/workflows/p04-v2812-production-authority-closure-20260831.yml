name: P04 V2.8.12 Production Authority Closure

on:
  push:
    paths:
      - '.github/workflows/p04-v2812-production-authority-closure-20260831.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AUTHORITY_SOURCE: 9a8ea95ff78caf7688d6b2f8eda878d161e15b60
      BASE_MAIN: 9bf4500c2dea214386bc2a6dd81893cafed0947c
      AUTHORITY_BRANCH: governance/p04-v2812-release-authority-closure-20260831
      RELEASE_SOURCE: 9bf4500c2dea214386bc2a6dd81893cafed0947c
      PRODUCT_TREE: d74cf7b76f0e4941bbe09cd839dbf9d70a72b516
      CORE_UPDATES_SOURCE: 99af2c7a323d7a07db0979bf071d9c891dffe51e
      RELEASE_ID: '379896011'
      FULL_ASSET_ID: '538235898'
      UPDATE_ASSET_ID: '538235899'
      FULL_BYTES: '624374'
      UPDATE_BYTES: '1338985'
      FULL_SHA256: a8144f46c78fea31e3c2508a1e34f2d122835e4fcf66a63d50ac95f861500634
      UPDATE_SHA256: 89e43645b1b434ce86f575c835517a15f29711ccbd586311ac5957d2e8ba4246
      PUBLICATION_RUN: '33413768617'
      ONLINE_DISCOVERY_RUN: '33414036836'
      ONLINE_DISCOVERY_ARTIFACT: '9766273247'
      ONLINE_DISCOVERY_DIGEST: sha256:e9ec30c24e77794859d670c9e755ce60b2040cd9c0853a464732e23652d4e6d3
      TAG: v2.8.12

    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact authority candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: ${{ env.AUTHORITY_SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: product

      - name: Checkout exact update manifest source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CORE_UPDATES_SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: updates

      - name: Verify authority-only production closure
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$AUTHORITY_SOURCE"
          test "$(git -C product rev-parse origin/main)" = "$BASE_MAIN"
          test "$(git -C product rev-parse origin/$AUTHORITY_BRANCH)" = "$AUTHORITY_SOURCE"
          test "$(git -C updates rev-parse HEAD)" = "$CORE_UPDATES_SOURCE"

          mapfile -t changed < <(git -C product diff --name-only "$BASE_MAIN" "$AUTHORITY_SOURCE")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'VF_PROJECT.json'
          test "$(git -C product show "$AUTHORITY_SOURCE:VERSION" | tr -d '\r\n')" = '2.8.12'

          python3 - <<'PY'
          import json
          p=json.load(open('product/VF_PROJECT.json',encoding='utf-8'))
          assert p['project_id']=='P04'
          assert p['version']=='2.8.12'
          assert p['status']=='V2.8.12 RELEASE CURRENT / V2.8.12 PRODUCTION'
          assert p['lifecycle']=='PRODUCTION_CURRENT'
          assert p['production_version']=='2.8.12'
          assert p['schema']==14 and p['schema_version_contract']==14
          c=p['release_source_contract']
          assert c['candidate_source']=='5e628a932d5bbd7393bf8e8d4008785a4f04bed2'
          assert c['release_source']=='9bf4500c2dea214386bc2a6dd81893cafed0947c'
          assert c['release_product_tree']=='d74cf7b76f0e4941bbe09cd839dbf9d70a72b516'
          assert c['migration']=='NONE' and c['provider_authority']=='READ_ONLY_FIRST'
          assert c['provider_authority_change'] is False and c['runtime_resolver_change'] is False
          e=c['candidate_evidence']
          assert e['status']=='PASS'
          assert e['final_exact_source_run']==33409138217
          assert e['private_ci_parity_run']==33412661438
          assert e['promotion_delta_run']==33413081262
          assert e['runtime_bytes_identical_after_ci_contract_repair'] is True
          r=p['release']
          assert r['current_release']=='2.8.12' and r['formal_gate']=='PASS'
          assert r['published'] is True and r['tag']=='v2.8.12'
          assert r['release_id']==379896011
          assert r['release_source']=='9bf4500c2dea214386bc2a6dd81893cafed0947c'
          assert r['release_product_tree']=='d74cf7b76f0e4941bbe09cd839dbf9d70a72b516'
          assert r['publication_run']==33413768617
          assert r['full_asset']['id']==538235898
          assert r['full_asset']['bytes']==624374
          assert r['full_asset']['sha256']=='a8144f46c78fea31e3c2508a1e34f2d122835e4fcf66a63d50ac95f861500634'
          assert r['update_asset']['id']==538235899
          assert r['update_asset']['bytes']==1338985
          assert r['update_asset']['sha256']=='89e43645b1b434ce86f575c835517a15f29711ccbd586311ac5957d2e8ba4246'
          assert r['core_updates']['status']=='PUBLISHED_VERIFIED'
          assert r['core_updates']['source']=='99af2c7a323d7a07db0979bf071d9c891dffe51e'
          assert r['core_updates']['target_version']=='2.8.12'
          assert r['core_updates']['from_versions']==['2.8.11']
          assert r['core_updates']['online_discovery_run']==33414036836
          assert r['core_updates']['v2811_client_status']=='update_available'
          assert r['core_updates']['v2811_client_can_update'] is True
          assert r['production_write'] is False
          prod=p['production_truth']
          assert prod['installed_version']=='2.8.12'
          assert prod['installed_schema']==14
          assert prod['previous_installed_version']=='2.8.11'
          assert prod['release_production_parity'] is True
          assert prod['owner_evidence']=='AUTHENTICATED_RUNTIME_OVERVIEW_SCREENSHOT_VERIFIED_2026-08-31'
          assert prod['production_write']=='OWNER_COMPLETED_OUTSIDE_GIT'
          assert p['next_action']=='NONE_V2.8.12_PRODUCTION_CLOSED'

          u=json.load(open('updates/projects/P04.json',encoding='utf-8'))
          assert u['project_id']=='P04' and u['target_version']=='2.8.12'
          assert u['from_versions']==['2.8.11']
          assert u['schema_from']=='14' and u['schema_to']=='14'
          assert u['release_id']==r['release_id']
          assert u['release_product_commit']==r['release_source']
          assert u['release_product_tree']==r['release_product_tree']
          assert u['asset_id']==r['update_asset']['id']
          assert u['asset_bytes']==r['update_asset']['bytes']
          assert u['asset_sha256']==r['update_asset']['sha256']
          PY

          RELEASE_JSON="$(gh api repos/llhzx2018/vf-infra/releases/tags/$TAG)"
          test "$(jq -r '.id' <<<"$RELEASE_JSON")" = "$RELEASE_ID"
          test "$(jq -r '.draft' <<<"$RELEASE_JSON")" = false
          test "$(jq -r '.prerelease' <<<"$RELEASE_JSON")" = false
          test "$(jq -r '.assets[]|select(.id=='"$FULL_ASSET_ID"')|.size' <<<"$RELEASE_JSON")" = "$FULL_BYTES"
          test "$(jq -r '.assets[]|select(.id=='"$FULL_ASSET_ID"')|.digest' <<<"$RELEASE_JSON")" = "sha256:$FULL_SHA256"
          test "$(jq -r '.assets[]|select(.id=='"$UPDATE_ASSET_ID"')|.size' <<<"$RELEASE_JSON")" = "$UPDATE_BYTES"
          test "$(jq -r '.assets[]|select(.id=='"$UPDATE_ASSET_ID"')|.digest' <<<"$RELEASE_JSON")" = "sha256:$UPDATE_SHA256"
          test "$(gh api repos/llhzx2018/vf-infra/git/ref/tags/$TAG --jq '.object.sha')" = "$RELEASE_SOURCE"
          test "$(gh api repos/llhzx2018/vf-infra/git/commits/$RELEASE_SOURCE --jq '.tree.sha')" = "$PRODUCT_TREE"
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$PUBLICATION_RUN --jq '.conclusion')" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$ONLINE_DISCOVERY_RUN --jq '.conclusion')" = success
          ART="$(gh api repos/llhzx2018/core-free-runner-public/actions/artifacts/$ONLINE_DISCOVERY_ARTIFACT)"
          test "$(jq -r '.digest' <<<"$ART")" = "$ONLINE_DISCOVERY_DIGEST"

          echo P04_V2812_PRODUCTION_AUTHORITY_CLOSURE_GATE=PASS
          echo AUTHORITY_SOURCE="$AUTHORITY_SOURCE"
          echo RELEASE_SOURCE="$RELEASE_SOURCE"
          echo PRODUCTION_VERSION=2.8.12
          echo PRODUCTION_SCHEMA=14
