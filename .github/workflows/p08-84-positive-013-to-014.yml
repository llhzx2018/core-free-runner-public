name: P08 PR84 issued v013 genuine Owner-click and synthetic unissued 014 native switch
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p08-84-positive-013-to-014.yml
      - scripts/p08_pr84_positive_once.sh
      - scripts/p08_pr84_positive_owner.spec.ts
      - scripts/p08_pr84_positive_tls_proxy.py
permissions:
  contents: read
jobs:
  real-first-forward-positive-3db:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-84-positive-013-to-014-20261120' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: sqlite
            image: mysql:8.4
            health: mysqladmin ping --silent
          - kind: mysql
            image: mysql:8.4
            health: mysqladmin ping --silent
          - kind: mariadb
            image: mariadb:11.8
            health: healthcheck.sh --connect --innodb_initialized
    services:
      db:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: p08-pr84-isolated-only
          MYSQL_ROOT_HOST: '%'
          MARIADB_ROOT_PASSWORD: p08-pr84-isolated-only
          MARIADB_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=10s
          --health-timeout=6s
          --health-retries=20
    env:
      P08_ISOLATED_INSTALL_TEST: 'YES'
      P08_PR84_UNISSUED_POSITIVE: 'YES'
      P08_TEST_DB_DRIVER: ${{ matrix.kind }}
      P08_TEST_DB_HOST: 127.0.0.1
      P08_TEST_DB_CLEAN: p08_ci_clean
      P08_TEST_DB_DIRTY: p08_ci_dirty
      P08_TEST_DB_USER: root
      P08_TEST_DB_PASSWORD: p08-pr84-isolated-only
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout disposable public-safe Runner workflow only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact P08 PR84 private source, credentials never persisted
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 159291e947b46b6320228aed14f1ea02517be896
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p08
      - name: Checkout canonical GOV-DOC for immutable full builder gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov
      - name: Install native PHP 8.4 and Composer for genuine v013
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: pdo_mysql,pdo_sqlite,sqlite3,zip,curl,mbstring,openssl,posix,dom,intl,bcmath,fileinfo
          coverage: none
      - name: Node22 Chromium isolated browser
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install disposable nginx TLS frontend and native DB clients
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 420 sudo apt-get -qq update
          timeout 420 sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y nginx openssl mariadb-client sqlite3
          command -v nginx
          command -v mariadb-dump
      - name: Real issued v013 first-forward one-click to isolated non-issued 014 and native backup/readback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          test "$(id -u)" -ne 0
          test "$(git -C p08 rev-parse HEAD)" = 159291e947b46b6320228aed14f1ea02517be896
          bash scripts/p08_pr84_positive_once.sh "${{ matrix.kind }}"
      - name: Always erase private source, installed database fixture and test logs
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- p08 gov "$RUNNER_TEMP/p08-84-browser-${{ matrix.kind }}" "$RUNNER_TEMP/p08-84-site-${{ matrix.kind }}" "$RUNNER_TEMP/p08-pr84-positive-fixture" "$RUNNER_TEMP/p08-pr84-positive-events.log"
          test ! -e p08 && test ! -e gov
          test ! -e "$RUNNER_TEMP/p08-84-site-${{ matrix.kind }}"
          echo "P08_PR84_${{ matrix.kind }}_PRIVATE_CLEANUP=PASS"
