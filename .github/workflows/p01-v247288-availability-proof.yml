name: P01 V247288 URL availability source proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v247288-availability-proof.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: df2184a35d8a7be9a1dd80df8f1dbaa4d89406d6
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: v2.47.287
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: stable
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,curl,zip,mbstring
          coverage: none
      - name: Source lint + auto-vs-human PDO SQLite check
        run: |
          set -Eeuo pipefail
          find src -name '*.php' -type f -print0 | xargs -0 -n1 php -l >/dev/null
          find src -name '*.js' -type f -print0 | xargs -0 -n1 node --check >/dev/null
          php tests/unit/url_availability_human_verdict_v247288_contract.php
          echo P01_V247288_PHP_JS_SQLITE=PASS
      - name: Canonical exact source regression
        run: |
          set -Eeuo pipefail
          bash tests/canonical_release_regression.sh . stable --require-zero-debt
          echo P01_V247288_CANONICAL=PASS
      - name: Isolated installed URL availability smoke
        run: |
          set -Eeuo pipefail
          cp -a src /tmp/p01-288
          cd /tmp/p01-288
          php -S 127.0.0.1:18588 -t . >/tmp/p01-288-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" >/dev/null 2>&1 || true; rm -rf /tmp/p01-288 /tmp/p01-288-cookies /tmp/p01-288-setup.html /tmp/p01-288-health.html' EXIT
          for i in $(seq 1 30); do
            if curl -fsS -c /tmp/p01-288-cookies -b /tmp/p01-288-cookies http://127.0.0.1:18588/setup.php -o /tmp/p01-288-setup.html; then break; fi
            sleep 1
          done
          csrf=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-288-setup.html',encoding='utf-8').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s)
          assert m
          print(m.group(1))
          PY
          )
          curl -fsS -c /tmp/p01-288-cookies -b /tmp/p01-288-cookies -X POST http://127.0.0.1:18588/setup.php \
            --data-urlencode "setup_csrf=$csrf" \
            --data-urlencode 'site_title=Isolated P01 Availability' \
            --data-urlencode 'admin_password=IsolatedVf2026!' \
            --data-urlencode 'admin_password_confirm=IsolatedVf2026!' >/dev/null
          php cli/verify.php | grep -Fx VERIFY_PASS=YES
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18588/health.php)" = 302
          curl -fsS -c /tmp/p01-288-cookies -b /tmp/p01-288-cookies \
            -H 'Content-Type: application/json' -d '{"password":"IsolatedVf2026!"}' \
            'http://127.0.0.1:18588/api.php?action=login' | grep -Fq '"ok":true'
          curl -fsS -c /tmp/p01-288-cookies -b /tmp/p01-288-cookies http://127.0.0.1:18588/health.php -o /tmp/p01-288-health.html
          grep -Fq '<h1>网址可用性</h1>' /tmp/p01-288-health.html
          grep -Fq '检查收藏的网址能否打开' /tmp/p01-288-health.html
          grep -Fq '需要人工查看' /tmp/p01-288-health.html
          test "$(curl -sS -b /tmp/p01-288-cookies -H 'Content-Type: application/json' -d '{}' -o /dev/null -w '%{http_code}' 'http://127.0.0.1:18588/api.php?action=link_health_job_stop')" = 419
          echo P01_V247288_ISOLATED_HTTP_CSRF=PASS
