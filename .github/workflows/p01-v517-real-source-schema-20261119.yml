name: P01 real original backup schema fingerprint vs clean Laravel
on:
  push:
    branches: [test/p01-v517-actual-source-schema-20261119]
permissions:
  contents: read
jobs:
  native-laravel-actual-source-columns:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    steps:
      - name: Private backup stays in Owner environment
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "$GITHUB_REF_NAME" = "test/p01-v517-actual-source-schema-20261119"
          echo "P01_PRIVATE_OWNER_SOURCE_VALUES=NOT_COPIED"
          echo "P01_MACHINE_INPUT=NONPERSONAL_SCHEMA_SHA256_ONLY"
          echo "P01_PRODUCTION_WRITES=NO"
      - name: Transient exact-source checkout without credential persistence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 0aa61ebb77be2c16fccb1ae60eeb8a028bb9a124
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
      - name: Check exact source identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "0aa61ebb77be2c16fccb1ae60eeb8a028bb9a124"
          test "$(cat candidate/VERSION)" = "2.47.517"
          test "$(cat candidate/src/VERSION.txt)" = "2.47.517"
          echo "P01_REAL_SOURCE_PARITY_TARGET=0aa61ebb77be2c16fccb1ae60eeb8a028bb9a124"
      - name: Install native PHP SQLite and isolated Composer lock
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! command -v composer >/dev/null || ! php -r 'exit(PHP_VERSION_ID>=80300 && extension_loaded("pdo_sqlite") && extension_loaded("pdo_mysql") && extension_loaded("mbstring") && extension_loaded("dom") && extension_loaded("curl") ? 0 : 1);'; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php-cli php-sqlite3 php-mysql php-mbstring php-xml php-curl unzip composer >/dev/null
          fi
          php -r 'if(!in_array("sqlite",PDO::getAvailableDrivers(),true))exit(1);'
          composer install --working-dir=candidate/tests/compatibility/laravel --no-interaction --no-progress --no-scripts --prefer-dist --optimize-autoloader
      - name: Real Laravel 13 installed 35-table schema vs Owner source fingerprints
        shell: bash
        env:
          P01_ISOLATED_DB_TEST: "YES"
          P01_DB_TEST_ENGINE: sqlite
        run: |
          set -Eeuo pipefail
          cd candidate
          php -l tests/compatibility/laravel/run_owner_sqlite_restore.php
          php tests/compatibility/laravel/run_owner_sqlite_restore.php
          echo "P01_ORIGINAL_PRIVATE_SOURCE_VS_LARAVEL_19_COLUMN_SETS=PASS"
      - name: Remove ephemeral source and test files
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate
          echo "P01_PRIVATE_SOURCE_PERSISTENCE=NONE"
