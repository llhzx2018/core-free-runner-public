name: P04 V2.5.3 Post Atomic Diagnose

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p04-v253-post-atomic-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Prepare runtime
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-zip sqlite3 >/dev/null
      - name: Capture each post-Atomic assertion
        env:
          VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone -q https://github.com/llhzx2018/core-free-runner-public.git runner-tools
          python3 - runner-tools/ops/p04/v253_hotfix_execute_v2.sh <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]);s=p.read_text()
          old='''test "$UP_CODE" = 200\ngrep -Fq '升级完成' "$WORK/repair-post.html"\ntest "$(cat "$SITE/VERSION.txt")" = 2.5.3\ntest "$(sqlite3 "$DB" "select coalesce(max(version),0) from schema_migrations where status='success';")" = 14\ntest "$(sqlite3 "$DB" 'pragma integrity_check;')" = ok\ntest -z "$(sqlite3 "$DB" 'pragma foreign_key_check;')"\nDOMAIN_AFTER=$(sqlite3 -batch -noheader "$DB" "select id,domain,project_name,registrar,currency,auto_renew,tags_json,notes,created_at,updated_at from domains where domain='preserve-v253.example';" | sha256sum | awk '{print $1}')\ntest "$DOMAIN_BEFORE" = "$DOMAIN_AFTER"\nPROVIDER_TABLES_AFTER=$(sqlite3 -batch -noheader "$DB" "select (select count(*) from providers),(select count(*) from provider_accounts),(select count(*) from credentials);" | sha256sum | awk '{print $1}')\ntest "$PROVIDER_TABLES_BEFORE" = "$PROVIDER_TABLES_AFTER"\ntest ! -e "$SITE/repair-v2.5.3.php"\necho 'ATOMIC_DATA_SCHEMA_CLEANUP=PASS' '''.rstrip()
          new='''echo "ATOMIC_HTTP=$UP_CODE SUCCESS_TEXT=$(grep -Fq '升级完成' "$WORK/repair-post.html" && echo YES || echo NO)"\necho "VERSION=$(cat "$SITE/VERSION.txt")"\necho "SCHEMA=$(sqlite3 "$DB" "select coalesce(max(version),0) from schema_migrations where status='success';")"\necho "INTEGRITY=$(sqlite3 "$DB" 'pragma integrity_check;')"\necho "FK_ROWS=$(sqlite3 "$DB" 'pragma foreign_key_check;' | wc -l)"\nDOMAIN_AFTER=$(sqlite3 -batch -noheader "$DB" "select id,domain,project_name,registrar,currency,auto_renew,tags_json,notes,created_at,updated_at from domains where domain='preserve-v253.example';" | sha256sum | awk '{print $1}')\necho "DOMAIN_PRESERVED=$([[ \"$DOMAIN_BEFORE\" == \"$DOMAIN_AFTER\" ]] && echo YES || echo NO)"\nPROVIDER_TABLES_AFTER=$(sqlite3 -batch -noheader "$DB" "select (select count(*) from providers),(select count(*) from provider_accounts),(select count(*) from credentials);" | sha256sum | awk '{print $1}')\necho "PROVIDER_TABLE_COUNTS_PRESERVED=$([[ \"$PROVIDER_TABLES_BEFORE\" == \"$PROVIDER_TABLES_AFTER\" ]] && echo YES || echo NO)"\necho "REPAIR_PRESENT=$([[ -e \"$SITE/repair-v2.5.3.php\" ]] && echo YES || echo NO)"\necho 'POST_ATOMIC_DIAG_COMPLETE=PASS'\nexit 0'''
          if s.count(old)!=1:
              raise SystemExit(f'post-atomic block sentinel count={s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          bash runner-tools/ops/p04/v253_hotfix_execute_v2.sh
      - name: Cleanup
        if: always()
        run: rm -rf runner-tools
