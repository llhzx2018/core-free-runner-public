name: TEMP P08 R43 official schema-preview security checks
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p08-r43-schema-official-preview-20261124.yml'
permissions:
  contents: read
concurrency:
  group: p08-r43-schema-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  TARGET_REPO: llhzx2018/vf-adops
  TARGET_VERSION: '0.1.17'
  TARGET_SHA: dadb5457b8534957cc7356b2d8a9874514f93973
jobs:
  identity-preflight:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/p08-r43-schema-official-preview-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact candidate identity audit
        run: python3 scripts/ephemeral_lane_spec.py audit-rendered --spec specs/ephemeral/p08-r43-schema-official-preview-20261124.json --input .github/workflows/temp-p08-r43-schema-official-preview-20261124.yml
  read-only-official-schema:
    needs: identity-preflight
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/p08-r43-schema-official-preview-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact private development candidate transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-p08
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_sqlite, sqlite3, pdo_mysql, zip, mbstring
      - name: PHP syntax and locked exact-source test identity
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C private-p08 rev-parse HEAD)" = "$TARGET_SHA"
          test "$(cat private-p08/VERSION)" = "$TARGET_VERSION"
          php -l private-p08/src/Upgrade/OwnerNextReleaseGateway.php >/dev/null
          php -l private-p08/app/Http/Controllers/OwnerFutureUpdateController.php >/dev/null
          php -l private-p08/tests/compatibility/r43_official_schema_metadata_readonly.php >/dev/null
          echo P08_R43_GATEWAY_CONTROLLER_TEST_SYNTAX=PASS
      - name: Synthetic fixed-official-source metadata positive and negative matrix
        shell: bash
        env:
          P08_R145_ISOLATED: 'YES'
          P08_R43_DISPOSABLE: 'YES'
        run: |
          set -Eeuo pipefail
          set +x
          php private-p08/tests/compatibility/r43_official_schema_metadata_readonly.php > "$RUNNER_TEMP/p08-r43-metadata.log" 2>&1 || {
            echo P08_R43_SCHEMA_METADATA_MATRIX=FAIL
            exit 1
          }
          grep -qx 'P08_R43_SCHEMA_METADATA_ONLY_NO_DB_OR_FILE_WRITES=PASS' "$RUNNER_TEMP/p08-r43-metadata.log"
          grep -qx 'P08_R43_OFFICIAL_SCHEMA_READ_ONLY_NEGATIVE_MATRIX=PASS' "$RUNNER_TEMP/p08-r43-metadata.log"
          echo P08_R43_OFFICIAL_SCHEMA_READ_ONLY_NEGATIVE_MATRIX=PASS
      - name: Disallow fixture outside isolated environment
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          if env -u P08_R145_ISOLATED -u P08_R43_DISPOSABLE php private-p08/tests/compatibility/r43_official_schema_metadata_readonly.php >/dev/null 2>&1; then
            echo P08_R43_NONISOLATED_TEST_EXECUTION_REFUSAL=FAIL
            exit 1
          fi
          echo P08_R43_NONISOLATED_TEST_EXECUTION_REFUSAL=PASS
      - name: Clean private source and synthetic logs
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- private-p08
          rm -f -- "$RUNNER_TEMP/p08-r43-metadata.log"
          test ! -e private-p08 && test ! -e "$RUNNER_TEMP/p08-r43-metadata.log"
          echo P08_R43_PRIVATE_SOURCE_CLEANUP=PASS
