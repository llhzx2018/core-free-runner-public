name: TEMP S01-C02 Ops 1.21.846 Structural Retry Gate
on:
  push:
    branches:
      - temp/s01-c02-v121845-runtime-suffix-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121846-structural-retry-gate.yml'
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      COMMIT: b6745c09ecaa7a27deed3c970f683d86425fcc35
      TREE: c7338359ba9db173e57749ba6bbbc94ec7ef0491
      BASE: b2e54350130866ac569b379473773d281c6d04f2
      CORE_UPDATES: 29ca1491efbaf33501c4849a94dd2ce4a6600324
      RUNNER_MAIN: 0160b557ad4ae0e8c6acd97e7551285bc05870bd
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.COMMIT }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops
      - name: Verify source and Phase3
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$COMMIT"
          test "$(git -C ops rev-parse HEAD^{tree})" = "$TREE"
          test "$(tr -d '\r\n' < ops/VERSION)" = '1.21.846'
          php -l ops/includes/site-release/s01-static-final-audit-structural-retry-v121846.php >/dev/null
          php -l ops/vf-ops.php >/dev/null
          php -l ops/.github/phase3/v121846-structural-final-audit-retry.php >/dev/null
          php ops/.github/phase3/v121846-structural-final-audit-retry.php | grep -Fxq 'PASS_V121846_STRUCTURAL_FINAL_AUDIT_RETRY'
      - name: Verify narrow diff
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t files < <(git -C ops diff --name-only "$BASE" "$COMMIT")
          test "${#files[@]}" = 4
          printf '%s\n' "${files[@]}" | grep -Fxq '.github/phase3/v121846-structural-final-audit-retry.php'
          printf '%s\n' "${files[@]}" | grep -Fxq 'VERSION'
          printf '%s\n' "${files[@]}" | grep -Fxq 'includes/site-release/s01-static-final-audit-structural-retry-v121846.php'
          printf '%s\n' "${files[@]}" | grep -Fxq 'vf-ops.php'
      - name: Verify Engineering authority
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/main --jq .object.sha)" = "$BASE"
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/develop --jq .object.sha)" = "$BASE"
          test "$(gh api repos/llhzx2018/core-updates/git/ref/heads/main --jq .object.sha)" = "$CORE_UPDATES"
          test "$(gh api repos/llhzx2018/core-updates/git/ref/heads/develop --jq .object.sha)" = "$CORE_UPDATES"
      - name: Verify Production 1.21.845 structural boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-domain-authority' -o /tmp/domain.json
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-static-candidate-readiness' -o /tmp/static.json
          jq -e '.pluginVersion=="1.21.845" and .status=="CURRENT" and .authorityFinalHost=="https://ilovem3u8.com" and .configuredPublicBaseUrl=="https://ilovem3u8.com" and .authorityMatch==true' /tmp/domain.json >/dev/null
          jq -e '.pluginVersion=="1.21.845" and .sourceArtifactAvailable==true and .manualSourceUploadRequired==false and .candidatePackageReady==false and .finalOnlinePass=="NO"' /tmp/static.json >/dev/null
          jq -e '.activeStaticJobStatus=="FAIL" and .activeStaticJobMode=="candidate" and .activeStaticJobFirstFailedStep=="final_decision" and .activeStaticJobAuditFailureCount==1 and .activeStaticJobInternalLinkFailureLeafCount==0' /tmp/static.json >/dev/null
          jq -e '.sourceRecoveryRuntimeSuffixRetryStatus=="blocked" and .sourceRecoveryRuntimeSuffixRetryCode=="runtime_suffix_final_audit_boundary_changed"' /tmp/static.json >/dev/null
          jq -e '.sourceRecoveryFinalAuditOtherLeafCount==1 and .sourceRecoveryFinalAuditOtherClassifiedCount==1 and .sourceRecoveryFinalAuditOtherUnclassifiedCount==0 and .sourceRecoveryFinalAuditOtherPrimaryClass=="candidate_package_contract"' /tmp/static.json >/dev/null
          jq -e '.sourceRecoveryFinalAuditPackageContractLeafCount==1 and .sourceRecoveryFinalAuditPackageContractClassifiedCount==0 and .sourceRecoveryFinalAuditPackageContractUnclassifiedCount==1 and .sourceRecoveryFinalAuditPackageContractPrimaryClass=="candidate_package_contract_unclassified"' /tmp/static.json >/dev/null
          jq -e '[.sourceRecoveryFinalAuditPackageContractClassCounts[]] | add == 1' /tmp/static.json >/dev/null
      - name: Verify runner main unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git ls-remote https://github.com/llhzx2018/core-free-runner-public.git refs/heads/main | awk '{print $1}')" = "$RUNNER_MAIN"
          echo PASS_V121846_FOCUSED_GATE
