name: TEMP S01-C02 Ops 1.21.823 Formal Release
on:
  push:
    branches: [temp/s01-c02-v121823-formal-release-20260905]
    paths: ['.github/workflows/temp-s01-c02-v121823-formal-release.yml']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      REPO: llhzx2018/vf-tools-ops
      COMMIT: e4bf4735f881fe733b04f309f9db517ebae71a34
      TREE: ce5818b23b5c1ba81959a4029c1b48647ec70fa7
      GATE_RUN: '33965881707'
      GATE_SHA: ca596e7ed829cfcc15f7b748ba531567228d3684
      TAG: v1.21.823
      ASSET: vf-tools-ops_V1.21.823.zip
      BYTES: '3236216'
      SHA256: e3676c52243ba7f4d90972313ff12e8648221dadc821f1bb5ebd5b0d9577faca
      FILES: '905'
      FP: 2d28c59c35ae8257e1f29e7718f85076e70ffef259b9b22eb3cee0a0d8feb01a
    steps:
      - name: Verify authority and Candidate Gate
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          W: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$R"; test -n "$W"
          J="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/runs/$GATE_RUN")"
          test "$(jq -r .status <<<"$J")" = completed
          test "$(jq -r .conclusion <<<"$J")" = success
          test "$(jq -r .head_sha <<<"$J")" = "$GATE_SHA"
          L="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$REPO/releases/latest")"
          test "$(jq -r .tag_name <<<"$L")" = v1.21.822
          for b in main develop; do
            B="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$REPO/branches/$b")"
            test "$(jq -r .commit.sha <<<"$B")" = "$COMMIT"
            test "$(jq -r .commit.commit.tree.sha <<<"$B")" = "$TREE"
          done
          code="$(curl -sS -o /tmp/existing -w '%{http_code}' -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$REPO/releases/tags/$TAG")"
          test "$code" = 404
          code="$(curl -sS -o /tmp/tag-existing -w '%{http_code}' -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$REPO/git/ref/tags/$TAG")"
          test "$code" = 404
          echo RELEASE_AUTHORITY=PASS

      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.COMMIT }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: ops

      - name: Rebuild exact artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$COMMIT"
          test "$(git -C ops rev-parse HEAD^{tree})" = "$TREE"
          test "$(tr -d '\r\n' < ops/VERSION)" = 1.21.823
          grep -Fq 'Version: 1.21.823' ops/vf-ops.php
          php ops/.github/phase3/v121823-candidate-failure-segment-readback.php | grep -Fxq PASS_V121823_CANDIDATE_FAILURE_SEGMENT_READBACK
          mkdir -p /tmp/release
          python3 - <<'PY'
          import re,hashlib,zipfile,os
          from pathlib import Path
          root=Path('ops'); files={}
          def ok(r):
            p=r.as_posix(); q=p.split('/')
            if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in q): return False
            if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',p,re.I): return False
            if '/' not in p: return p in {'vf-ops.php','uninstall.php'}
            return q[0] in {'includes','assets','languages','config'}
          for s in root.rglob('*'):
            if s.is_file() and not s.is_symlink():
              r=s.relative_to(root)
              if ok(r): files[r.as_posix()]=s.read_bytes()
          files=dict(sorted(files.items())); fp=hashlib.sha256()
          for r,b in files.items(): fp.update((r+'\0'+hashlib.sha256(b).hexdigest()+'\n').encode())
          z=Path('/tmp/release/'+os.environ['ASSET'])
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as out:
            for r,b in files.items():
              info=zipfile.ZipInfo('vf-ops/'+r,(2026,9,5,0,0,0)); info.compress_type=zipfile.ZIP_DEFLATED; info.external_attr=0o100644<<16; out.writestr(info,b)
          assert z.stat().st_size==int(os.environ['BYTES'])
          assert hashlib.sha256(z.read_bytes()).hexdigest()==os.environ['SHA256']
          assert len(files)==int(os.environ['FILES'])
          assert fp.hexdigest()==os.environ['FP']
          PY
          unzip -tq "/tmp/release/$ASSET" >/dev/null
          unzip -p "/tmp/release/$ASSET" vf-ops/includes/site-release/s01-static-inspection-failure-segment-runtime-v121818.php | grep -Fq "['inspect_only','candidate']"
          echo EXACT_ARTIFACT=PASS

      - name: Create formal tag release and asset
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          W: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -n --arg ref "refs/tags/$TAG" --arg sha "$COMMIT" '{ref:$ref,sha:$sha}' >/tmp/tag.json
          curl -fsSL -X POST -H "Authorization: Bearer $W" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' "https://api.github.com/repos/$REPO/git/refs" --data-binary @/tmp/tag.json >/tmp/tag-out.json
          test "$(jq -r .object.sha /tmp/tag-out.json)" = "$COMMIT"

          cat >/tmp/body.md <<EOF
          VF Tools Ops V1.21.823 repairs the S01 Static Candidate terminal-failure readback boundary without relaxing any release gate.

          - Exact focused Gate $GATE_RUN PASS on source $COMMIT / tree $TREE.
          - Terminal candidate jobs now classify their existing candidate_audit leaf failures into aggregate failure segments, matching inspect_only observability.
          - V1.21.822 incorrectly treated candidate-mode terminal failures as NOT_APPLICABLE, forcing audit count and segment counts to zero and mechanically presenting the full scalar remainder as non-audit.
          - This change is read-only: Candidate verdict, package readiness, final decision and fail-closed behavior are unchanged.
          - A terminal candidate with scalar failures but no candidate_audit remains non-audit/unknown rather than being converted to PASS.
          - No failure text, URL/path, filename, package identity, SHA or job identity is added to public readback.
          - Existing Production Candidate job and recovered Static Source are preserved; no Candidate recreation and no repeat Source ZIP upload are authorized.
          - M3U8 migration/data, Seed HOLD, JD.gg, WPvivid, content, schema and DNS are untouched.
          - Asset $ASSET; $BYTES bytes; SHA256 $SHA256; runtime files $FILES; fingerprint $FP.
          - Production upgrade is NOT executed by this GitHub Release.
          EOF
          sed -i 's/^          //' /tmp/body.md
          jq -n --arg tag "$TAG" --arg name 'VF Tools Ops v1.21.823' --rawfile body /tmp/body.md '{tag_name:$tag,name:$name,body:$body,draft:false,prerelease:false}' >/tmp/rel.json
          curl -fsSL -X POST -H "Authorization: Bearer $W" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' "https://api.github.com/repos/$REPO/releases" --data-binary @/tmp/rel.json >/tmp/rel-out.json
          RID="$(jq -r .id /tmp/rel-out.json)"; test -n "$RID"; test "$RID" != null
          curl -fsSL -X POST -H "Authorization: Bearer $W" -H 'Content-Type: application/zip' "https://uploads.github.com/repos/$REPO/releases/$RID/assets?name=$ASSET" --data-binary "@/tmp/release/$ASSET" >/tmp/asset-out.json
          test "$(jq -r .size /tmp/asset-out.json)" = "$BYTES"

          L="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$REPO/releases/tags/$TAG")"
          test "$(jq -r .tag_name <<<"$L")" = "$TAG"
          test "$(jq -r .draft <<<"$L")" = false
          test "$(jq -r .prerelease <<<"$L")" = false
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.size' <<<"$L")" = "$BYTES"
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.digest' <<<"$L")" = "sha256:$SHA256"
          T="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$REPO/git/ref/tags/$TAG")"
          test "$(jq -r .object.sha <<<"$T")" = "$COMMIT"
          echo FORMAL_RELEASE_V121823=PASS
