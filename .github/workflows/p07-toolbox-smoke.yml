name: P07 Toolbox Smoke

on:
  push:
    branches: [main]
    paths:
      - 'installers/p07-toolbox.sh'
      - 'installers/vf-node.sh'
      - 'installers/p07.sh'
      - 'installers/p07-final.sh'
      - 'installers/p07-rc3-r2-oauth-contract.sh'
      - 'installers/p07-system-care.sh'
      - '.github/workflows/p07-toolbox-smoke.yml'
  pull_request:
    paths:
      - 'installers/p07-toolbox.sh'
      - 'installers/vf-node.sh'
      - 'installers/p07.sh'
      - 'installers/p07-final.sh'
      - 'installers/p07-rc3-r2-oauth-contract.sh'
      - 'installers/p07-system-care.sh'
      - '.github/workflows/p07-toolbox-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Toolbox syntax and public version surface
        run: |
          set -euo pipefail
          bash -n installers/p07-toolbox.sh
          bash -n installers/vf-node.sh
          bash -n installers/p07.sh
          bash -n installers/p07-final.sh
          bash -n installers/p07-rc3-r2-oauth-contract.sh
          bash -n installers/p07-system-care.sh
          NO_COLOR=1 bash installers/p07-toolbox.sh --version | tee /tmp/version.txt
          NO_COLOR=1 bash installers/p07-toolbox.sh --help | tee /tmp/help.txt
          grep -q '服务器工具箱 V0.1.0' /tmp/version.txt
          grep -q '1. 网络代理节点.*V2Ray代理.*V0.1.0' /tmp/help.txt
          vps_public="$(sed -n 's/^VPS_AUDIT_PUBLIC="\([^"]*\)"/\1/p' installers/p07-toolbox.sh | head -n1)"
          test -n "$vps_public"
          grep -q "2. 服务器性能检测.*VPS验机.*${vps_public}" /tmp/help.txt
          grep -q '3. 网站与数据.*网站/数据库/备份.*V0.1.0' /tmp/help.txt
          grep -q '4. 服务器维护与安全.*更新/清理/安全.*V0.1.0' /tmp/help.txt
          grep -q '5. 新服务器初始化.*系统更新/CloudPanel/数据库选择.*V0.1.0（独立模块）' /tmp/help.txt
          grep -q '五模块独立安装和升级' /tmp/help.txt
          NO_COLOR=1 bash installers/p07-toolbox.sh --modules | tee /tmp/modules.txt
          grep -Fq 'P07-M01 网络代理节点（V2Ray）：' /tmp/modules.txt
          grep -Fq 'P07-M02 服务器性能检测（VPS 验机）：' /tmp/modules.txt
          grep -Fq 'P07-M03 网站与数据：' /tmp/modules.txt
          grep -Fq 'P07-M04 服务器维护与安全：' /tmp/modules.txt
          grep -Fq 'P07-M05 新服务器初始化：' /tmp/modules.txt
          python3 -B -m unittest discover -s tests -p 'test_p07_*_isolation.py' -q



      - name: Resolve current routed identities
        id: current
        shell: bash
        run: |
          set -euo pipefail
          node_version="$(cat packages/p07-network-node/0.1.0-ux1/VERSION)"
          system_care_version="$(sed -n "s/^VERSION='\([^']*\)'/\1/p" installers/p07-system-care.sh | head -n1)"
          test -n "$node_version"
          test -n "$system_care_version"

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib
          import re
          from pathlib import Path

          stable = Path("installers/p07.sh").read_text()
          ref = re.search(r'^INSTALLER_SOURCE_REF="([0-9a-f]{40})"$', stable, re.M)
          route = re.search(r'^INSTALLER_URL="([^"]+)"$', stable, re.M)
          expected_blob = re.search(r'^EXPECTED_BLOB="([0-9a-f]{40})"$', stable, re.M)
          assert ref and route and expected_blob, "immutable nested M03 installer required"
          pinned = "https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/" + "$" + "{INSTALLER_SOURCE_REF}/installers/p07-final.sh"
          assert route.group(1) == pinned, "M03 final source must be immutable"
          current_path = Path("installers/p07-final.sh")
          assert current_path.is_file(), current_path
          data = current_path.read_bytes()
          actual_blob = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
          assert actual_blob == expected_blob.group(1), (actual_blob, expected_blob.group(1))
          current = data.decode()
          expected_version = re.search(r'^EXPECTED_VERSION="([^"]+)"$', current, re.M)
          expected_build = re.search(r'^EXPECTED_BUILD_ID="([^"]+)"$', current, re.M)
          assert expected_version and expected_build
          print(f"server_ops_installer={route.group(1)}")
          print(f"server_ops_installer_blob={actual_blob}")
          print(f"server_ops_version={expected_version.group(1)}")
          print(f"server_ops_build={expected_build.group(1)}")
          PY

          echo "node_version=$node_version" >> "$GITHUB_OUTPUT"
          echo "system_care_version=$system_care_version" >> "$GITHUB_OUTPUT"
      - name: Current route contract
        run: |
          set -euo pipefail
          grep -Fq 'VERSION="V0.1.0"' installers/p07-toolbox.sh
          # Module-only promotions must have a new immutable Toolbox routing
          # build identity; don't pin all future M05 releases to release1.
          grep -Eq '^BUILD_ID="0[.]1[.]0-five-modules-(release[1-9][0-9]*(-m05)?|ux3-(release135|fieldfix1)|ux4-m03-m05-20261114)"$' installers/p07-toolbox.sh

          grep -Fq 'VF_NODE_PUBLIC="V0.1.0"' installers/p07-toolbox.sh
          grep -Fq 'VF_NODE_EXPECTED="${{ steps.current.outputs.node_version }}"' installers/p07-toolbox.sh
          grep -Fq 'VF_NODE_INSTALLER="https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/vf-node.sh"' installers/p07-toolbox.sh

          vps_public="$(sed -n 's/^VPS_AUDIT_PUBLIC="\([^"]*\)"/\1/p' installers/p07-toolbox.sh | head -n1)"
          vps_expected="$(sed -n 's/^VPS_AUDIT_EXPECTED="\([^"]*\)"/\1/p' installers/p07-toolbox.sh | head -n1)"
          vps_build="$(sed -n 's/^VPS_AUDIT_BUILD_EXPECTED="\([^"]*\)"/\1/p' installers/p07-toolbox.sh | head -n1)"
          vps_url="$(sed -n 's/^VPS_AUDIT_URL="\([^"]*\)"/\1/p' installers/p07-toolbox.sh | head -n1)"
          vps_sha="$(sed -n 's/^VPS_AUDIT_SHA256="\([^"]*\)"/\1/p' installers/p07-toolbox.sh | head -n1)"
          test -n "$vps_public"
          test "$vps_expected" = "$vps_public"
          test -n "$vps_build"
          test -n "$vps_url"
          test "${#vps_sha}" -eq 64
          grep -Fq 'run_vps_audit' installers/p07-toolbox.sh

          grep -Fq 'VF_SERVER_OPS_PUBLIC="V0.1.0"' installers/p07-toolbox.sh
          grep -Fq 'VF_SERVER_OPS_EXPECTED="${{ steps.current.outputs.server_ops_version }}"' installers/p07-toolbox.sh
          grep -Fq 'M03_BOOTSTRAP_BUILD="0.1.0-release135"' installers/p07-toolbox.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release136"' installers/p07-toolbox.sh
          grep -Fq 'VF_SERVER_OPS_MANIFEST_BLOB="59153685ef834114e01e0330c78ae174a042c1fa"' installers/p07-toolbox.sh
          grep -Fxq 'VF_SERVER_OPS_INSTALLER_REF="main"' installers/p07-toolbox.sh
          grep -Eq '^VF_SERVER_OPS_INSTALLER_BLOB="[a-f0-9]{40}"$' installers/p07-toolbox.sh
          grep -Fq 'installers/p07-m03-release136-atomic.sh' installers/p07-toolbox.sh
          grep -Eq '^INSTALLER_SOURCE_REF="[a-f0-9]{40}"$' installers/p07.sh
          grep -Fq 'INSTALLER_URL="https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/${INSTALLER_SOURCE_REF}/installers/p07-final.sh"' installers/p07.sh
          grep -Fq 'EXPECTED_BLOB="${{ steps.current.outputs.server_ops_installer_blob }}"' installers/p07.sh

          grep -Fq 'SYSTEM_CARE_PUBLIC="V0.1.0"' installers/p07-toolbox.sh
          grep -Fq 'SYSTEM_CARE_EXPECTED="${{ steps.current.outputs.system_care_version }}"' installers/p07-toolbox.sh
          grep -Fq 'SYSTEM_CARE_INSTALLER="https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/p07-system-care.sh"' installers/p07-toolbox.sh

          test "$(grep -Fc '${C_YELLOW}测试中${C_RESET}' installers/p07-toolbox.sh)" -eq 0
          grep -Fq '功能：5 项' installers/p07-toolbox.sh
          ! grep -Eq '^[[:space:]]*clear([[:space:]]|$)' installers/p07-toolbox.sh
      - name: Single public entry contract
        run: |
          set -euo pipefail
          grep -q 'run_network_node' installers/p07-toolbox.sh
          grep -q 'run_vps_audit' installers/p07-toolbox.sh
          grep -q 'run_server_ops' installers/p07-toolbox.sh
          grep -q 'run_system_care' installers/p07-toolbox.sh
          grep -q 'run_server_init' installers/p07-toolbox.sh
          grep -q "printf '请选择 \[0-5\]：'" installers/p07-toolbox.sh
          ! grep -Fq '功能模块 C（待接入）' installers/p07-toolbox.sh
          # P07-M03 网站与数据: the regular Toolbox is the CURRENT stable
          # module only. Never make the old original-18-site trial a required
          # menu choice or CI blocker for normal independent upgrades.
          grep -Fxq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release136"' installers/p07-toolbox.sh
          python3 -B - <<'PY'
          import pathlib,re
          src=pathlib.Path("installers/p07-toolbox.sh").read_text(encoding="utf-8")
          assert src.count("run_server_ops() {")==1
          body=src.split("run_server_ops() {",1)[1].split("\n}\n",1)[0]
          assert "ensure_server_ops_current || return $?" in body
          assert re.search(r"(?m)^  vfops$",body)
          assert not any(x in body for x in (
              "run_server_ops_owner124_trial",
              "run_server_ops_owner143_trial",
              "release124", "release143", "read -r", "请选择 [0-3]"))
          print("P07_M03_STABLE_ONLY_DEFAULT_ROUTE=PASS")
          print("P07_M03_LEGACY_18_SITE_DEFAULT_REENTRY=DENIED")
          PY
          echo 'P07_TOOLBOX_CURRENT_ROUTE_SMOKE=PASS'
