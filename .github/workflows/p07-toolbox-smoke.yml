name: P07 Toolbox Smoke

on:
  push:
    branches: [main, feature/p07-toolbox-show-audit-version]
    paths:
      - 'installers/p07-toolbox.sh'
      - 'installers/p07.sh'
      - 'installers/p07-system-care.sh'
      - 'packages/p07-system-care/**'
      - '.github/workflows/p07-toolbox-smoke.yml'
  pull_request:
    paths:
      - 'installers/p07-toolbox.sh'
      - 'installers/p07.sh'
      - 'installers/p07-system-care.sh'
      - 'packages/p07-system-care/**'
      - '.github/workflows/p07-toolbox-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Toolbox syntax and public version surface
        shell: bash
        run: |
          set -euo pipefail
          bash -n installers/p07-toolbox.sh
          bash -n installers/p07.sh
          bash -n installers/p07-system-care.sh
          NO_COLOR=1 bash installers/p07-toolbox.sh --version | tee /tmp/version.txt
          NO_COLOR=1 bash installers/p07-toolbox.sh --help | tee /tmp/help.txt
          grep -q 'P07 Toolbox V0.1.0' /tmp/version.txt
          grep -q '1. 网络节点 / V2Ray.*V0.1.0' /tmp/help.txt
          grep -q '2. VPS 一键验机.*V2.1.0.*测试中' /tmp/help.txt
          grep -q '3. CloudPanel 备份 / 恢复 / 迁移.*V0.1.0' /tmp/help.txt
          grep -q '4. 系统维护 / 安全.*V0.1.0.*测试中' /tmp/help.txt
          grep -q '用户界面仅显示 Vx.x.x 公共版本' /tmp/help.txt

      - name: VPS audit internal pin stays exact
        shell: bash
        run: |
          set -euo pipefail
          url='https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/0a851b9fe1819c7970ed5bb8e3633f2fc8e73166/experiments/p07-vps-audit-v21.sh'
          expected_sha='d1846e751bba5c860c623e3db26641908e27ca43b39cf37016758853b65a952d'
          curl -fsSL "$url" -o /tmp/p07-vps-audit.sh
          actual_sha="$(sha256sum /tmp/p07-vps-audit.sh | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"
          bash -n /tmp/p07-vps-audit.sh
          test "$(NO_COLOR=1 bash /tmp/p07-vps-audit.sh --version | awk '{print $NF}')" = 'V2.1.0'
          test "$(NO_COLOR=1 bash /tmp/p07-vps-audit.sh --build-id)" = '2.1.0-rc7-field'
          NO_COLOR=1 bash /tmp/p07-vps-audit.sh --help | grep -q '低负载 4K / 64K / 512K / 1M'
          NO_COLOR=1 bash /tmp/p07-vps-audit.sh --help | grep -q '中国电信 / 联通 / 移动三网回程'

      - name: Public version normalization contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'VERSION="V0.1.0"' installers/p07-toolbox.sh
          grep -Fq 'BUILD_ID="0.1.0-preview9"' installers/p07-toolbox.sh
          grep -Fq 'VPS_AUDIT_PUBLIC="V2.1.0"' installers/p07-toolbox.sh
          grep -Fq 'VPS_AUDIT_EXPECTED="V2.1.0"' installers/p07-toolbox.sh
          grep -Fq 'VPS_AUDIT_BUILD_EXPECTED="2.1.0-rc7-field"' installers/p07-toolbox.sh
          grep -Fq 'VPS_AUDIT_SHA256="d1846e751bba5c860c623e3db26641908e27ca43b39cf37016758853b65a952d"' installers/p07-toolbox.sh
          grep -Fq 'SYSTEM_CARE_PUBLIC="V0.1.0"' installers/p07-toolbox.sh
          grep -Fq '正在启动 VPS 一键验机 ${VPS_AUDIT_PUBLIC}' installers/p07-toolbox.sh
          grep -Fq '${C_CYAN}2.${C_RESET} VPS 一键验机' installers/p07-toolbox.sh
          grep -Fq '${C_YELLOW}测试中${C_RESET}' installers/p07-toolbox.sh
          grep -Fq 's/2\.0\.0-rc3-zh/${VPS_AUDIT_PUBLIC}/g' installers/p07-toolbox.sh
          grep -Fq 's/2\.0\.0-rc4-zh/${VPS_AUDIT_PUBLIC}/g' installers/p07-toolbox.sh

      - name: Server Ops slot wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'VF_SERVER_OPS_EXPECTED="VF Server Ops 0.1.0 RC2"' installers/p07-toolbox.sh
          grep -Fq 'VF_SERVER_OPS_INSTALLER="https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/p07.sh"' installers/p07-toolbox.sh
          grep -Fq 'run_server_ops' installers/p07-toolbox.sh
          grep -Fq 'P07_TOOLBOX_PARENT=1 bash "$tmp"' installers/p07-toolbox.sh
          grep -Fq '普通用户请从统一 P07 Toolbox 入口进入。' installers/p07.sh
          grep -Fq '退出模块后会返回 P07 Toolbox。' installers/p07.sh

      - name: System Care slot wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc2"' installers/p07-toolbox.sh
          grep -Fq 'SYSTEM_CARE_INSTALLER="https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/p07-system-care.sh"' installers/p07-toolbox.sh
          grep -Fq 'run_system_care' installers/p07-toolbox.sh
          grep -Fq 'vf-system-care menu' installers/p07-toolbox.sh
          grep -Fq '普通用户继续使用唯一 P07 Toolbox 主入口。' installers/p07-system-care.sh
          grep -Fq 'RC2_FAST_MENU=YES' packages/p07-system-care/0.1.0-rc2/SOURCE_IDENTITY
          grep -Fq 'REAL_CLOUDPANEL_GATE=NOT_RUN' packages/p07-system-care/0.1.0-rc2/SOURCE_IDENTITY

      - name: System Care exact public package
        shell: bash
        run: |
          set -euo pipefail
          pkg='packages/p07-system-care/0.1.0-rc2'
          while read -r expected path; do
            test "$(git hash-object "$pkg/$path")" = "$expected"
          done < "$pkg/MANIFEST.gitblob"
          test "$(NO_COLOR=1 bash "$pkg/vf-system-care.sh" --version)" = 'P07 System Care 0.1.0-rc2'
          NO_COLOR=1 bash "$pkg/status.sh" quick | grep -q '^P07_SYSTEM_CARE_STATUS='

      - name: Single public entry contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'VPS_AUDIT_URL=' installers/p07-toolbox.sh
          grep -q 'VPS_AUDIT_SHA256=' installers/p07-toolbox.sh
          grep -q 'VPS_AUDIT_BUILD_EXPECTED=' installers/p07-toolbox.sh
          grep -q 'run_vps_audit' installers/p07-toolbox.sh
          grep -q 'run_system_care' installers/p07-toolbox.sh
          grep -q "printf '请选择 \[0-4\]：'" installers/p07-toolbox.sh
          grep -q 'pause_menu' installers/p07-toolbox.sh
          ! grep -Fq '功能模块 C（待接入）' installers/p07-toolbox.sh
