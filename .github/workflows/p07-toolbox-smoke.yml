name: P07 Toolbox Smoke

on:
  push:
    branches: [main, feature/p07-toolbox-show-audit-version]
    paths:
      - 'installers/p07-toolbox.sh'
      - 'installers/p07.sh'
      - '.github/workflows/p07-toolbox-smoke.yml'
  pull_request:
    paths:
      - 'installers/p07-toolbox.sh'
      - 'installers/p07.sh'
      - '.github/workflows/p07-toolbox-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Toolbox syntax and public version surface
        shell: bash
        run: |
          set -euo pipefail
          bash -n installers/p07-toolbox.sh
          bash -n installers/p07.sh
          NO_COLOR=1 bash installers/p07-toolbox.sh --version | tee /tmp/version.txt
          NO_COLOR=1 bash installers/p07-toolbox.sh --help | tee /tmp/help.txt
          grep -q 'P07 Toolbox V0.1.0' /tmp/version.txt
          grep -q '1. 网络节点 / V2Ray.*V0.1.0' /tmp/help.txt
          grep -q '2. VPS 一键验机.*V2.0.0' /tmp/help.txt
          grep -q '3. CloudPanel 备份 / 恢复 / 迁移.*V0.1.0' /tmp/help.txt
          grep -q '用户界面仅显示 Vx.x.x 公共版本' /tmp/help.txt

      - name: VPS audit internal pin stays exact
        shell: bash
        run: |
          set -euo pipefail
          url='https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/1197372f0b32b7cc9a8b35736c30563cb36633c9/experiments/p07-vps-audit-v20-rc4.sh'
          expected_sha='54325e92bdf78a90c74b5fed73be9d0633b402659fdfa2848dc751ff23efaecd'
          curl -fsSL "$url" -o /tmp/p07-vps-audit.sh
          actual_sha="$(sha256sum /tmp/p07-vps-audit.sh | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"
          bash -n /tmp/p07-vps-audit.sh
          test "$(NO_COLOR=1 bash /tmp/p07-vps-audit.sh --version | awk '{print $NF}')" = '2.0.0-rc4-zh'
          NO_COLOR=1 bash /tmp/p07-vps-audit.sh --help | grep -q '真实中国大陆区域线路参考'

      - name: Public version normalization contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'VERSION="V0.1.0"' installers/p07-toolbox.sh
          grep -Fq 'VPS_AUDIT_PUBLIC="V2.0.0"' installers/p07-toolbox.sh
          grep -Fq '正在启动 VPS 一键验机 ${VPS_AUDIT_PUBLIC}' installers/p07-toolbox.sh
          grep -Fq 's/2\\.0\\.0-rc3-zh/${VPS_AUDIT_PUBLIC}/g' installers/p07-toolbox.sh
          grep -Fq 's/2\\.0\\.0-rc4-zh/${VPS_AUDIT_PUBLIC}/g' installers/p07-toolbox.sh
          grep -Fq 'VPS 一键验机                  ${C_GRAY}${VPS_AUDIT_PUBLIC}' installers/p07-toolbox.sh

      - name: Server Ops slot wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'VF_SERVER_OPS_EXPECTED="VF Server Ops 0.1.0 RC2"' installers/p07-toolbox.sh
          grep -Fq 'VF_SERVER_OPS_INSTALLER="https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/p07.sh"' installers/p07-toolbox.sh
          grep -Fq 'run_server_ops' installers/p07-toolbox.sh
          grep -Fq 'P07_TOOLBOX_PARENT=1 bash "$tmp"' installers/p07-toolbox.sh
          grep -Fq '普通用户请从统一 P07 Toolbox 入口进入。' installers/p07.sh
          grep -Fq '退出模块后会返回 P07 Toolbox。' installers/p07.sh

      - name: Single public entry contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'VPS_AUDIT_URL=' installers/p07-toolbox.sh
          grep -q 'VPS_AUDIT_SHA256=' installers/p07-toolbox.sh
          grep -q 'run_vps_audit' installers/p07-toolbox.sh
          grep -q 'pause_menu' installers/p07-toolbox.sh
          ! grep -Fq '功能模块 C（待接入）' installers/p07-toolbox.sh
