name: P07 Toolbox Smoke

on:
  push:
    branches: [main]
    paths:
      - 'installers/p07-toolbox.sh'
      - 'installers/vf-node.sh'
      - 'packages/p07-network-node/**'
      - 'installers/p07.sh'
      - 'installers/p07-rc3-r2-oauth-contract.sh'
      - 'dist/p07/0.1.0-rc3/**'
      - 'installers/p07-system-care.sh'
      - 'packages/p07-system-care/**'
      - '.github/workflows/p07-toolbox-smoke.yml'
  pull_request:
    paths:
      - 'installers/p07-toolbox.sh'
      - 'installers/vf-node.sh'
      - 'packages/p07-network-node/**'
      - 'installers/p07.sh'
      - 'installers/p07-rc3-r2-oauth-contract.sh'
      - 'dist/p07/0.1.0-rc3/**'
      - 'installers/p07-system-care.sh'
      - 'packages/p07-system-care/**'
      - '.github/workflows/p07-toolbox-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Toolbox syntax and public version surface
        run: |
          set -euo pipefail
          bash -n installers/p07-toolbox.sh
          bash -n installers/vf-node.sh
          bash -n installers/p07.sh
          bash -n installers/p07-rc3-r2-oauth-contract.sh
          bash -n installers/p07-system-care.sh
          NO_COLOR=1 bash installers/p07-toolbox.sh --version | tee /tmp/version.txt
          NO_COLOR=1 bash installers/p07-toolbox.sh --help | tee /tmp/help.txt
          grep -q 'P07 Toolbox V0.1.0' /tmp/version.txt
          grep -q '1. 网络节点 / V2Ray.*V0.1.0' /tmp/help.txt
          grep -q '2. VPS 一键验机.*V2.1.0.*可用' /tmp/help.txt
          grep -q '3. CloudPanel 备份 / 恢复 / 迁移.*V0.1.0.*测试中' /tmp/help.txt
          grep -q '4. 系统维护 / 安全.*V0.1.0.*可用' /tmp/help.txt
          grep -q '用户界面仅显示 Vx.x.x 公共版本' /tmp/help.txt

      - name: Resolve current routed identities
        id: current
        shell: bash
        run: |
          set -euo pipefail
          node_version="$(sed -n "s/^VERSION='\([^']*\)'/\1/p" installers/vf-node.sh | head -n1)"
          system_care_version="$(sed -n "s/^VERSION='\([^']*\)'/\1/p" installers/p07-system-care.sh | head -n1)"
          test -n "$node_version"
          test -n "$system_care_version"
          test -f "packages/p07-network-node/$node_version/VERSION"
          test -f "packages/p07-system-care/$system_care_version/VERSION"
          echo "node_version=$node_version" >> "$GITHUB_OUTPUT"
          echo "system_care_version=$system_care_version" >> "$GITHUB_OUTPUT"

      - name: Current route contract
        run: |
          set -euo pipefail
          grep -Fq 'VERSION="V0.1.0"' installers/p07-toolbox.sh
          grep -Fq 'BUILD_ID="0.1.0-preview16"' installers/p07-toolbox.sh

          grep -Fq 'VF_NODE_PUBLIC="V0.1.0"' installers/p07-toolbox.sh
          grep -Fq 'VF_NODE_EXPECTED="${{ steps.current.outputs.node_version }}"' installers/p07-toolbox.sh
          grep -Fq 'VF_NODE_INSTALLER="https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/vf-node.sh"' installers/p07-toolbox.sh

          grep -Fq 'VPS_AUDIT_PUBLIC="V2.1.0"' installers/p07-toolbox.sh
          grep -Fq 'VPS_AUDIT_BUILD_EXPECTED="2.1.0-rc7-field"' installers/p07-toolbox.sh
          grep -Fq 'run_vps_audit' installers/p07-toolbox.sh

          grep -Fq 'VF_SERVER_OPS_PUBLIC="V0.1.0"' installers/p07-toolbox.sh
          grep -Fq 'VF_SERVER_OPS_EXPECTED="VF Server Ops 0.1.0 RC3"' installers/p07-toolbox.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-rc3-guided-init16"' installers/p07-toolbox.sh
          grep -Fq 'installers/p07-rc3-r2-oauth-contract.sh' installers/p07.sh
          grep -Fq 'EXPECTED_BLOB="4a7889ea606fa2353f194abbb2c6b27345f35050"' installers/p07.sh
          grep -Fq 'EXPECTED_BUILD_ID="0.1.0-rc3-guided-init16"' installers/p07-rc3-r2-oauth-contract.sh
          grep -Fq '0.1.0-rc3-guided-init15' installers/p07-rc3-r2-oauth-contract.sh

          grep -Fq 'SYSTEM_CARE_PUBLIC="V0.1.0"' installers/p07-toolbox.sh
          grep -Fq 'SYSTEM_CARE_EXPECTED="${{ steps.current.outputs.system_care_version }}"' installers/p07-toolbox.sh
          grep -Fq 'SYSTEM_CARE_INSTALLER="https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/p07-system-care.sh"' installers/p07-toolbox.sh

          test "$(grep -Fc '${C_YELLOW}测试中${C_RESET}' installers/p07-toolbox.sh)" -eq 1
          test "$(grep -Fc '${C_GREEN}可用${C_RESET}' installers/p07-toolbox.sh)" -ge 3
          ! grep -Eq '^[[:space:]]*clear([[:space:]]|$)' installers/p07-toolbox.sh

      - name: Current package identities
        shell: bash
        run: |
          set -euo pipefail
          node_pkg="packages/p07-network-node/${{ steps.current.outputs.node_version }}"
          test "$(tr -d '\r\n' < "$node_pkg/VERSION")" = "${{ steps.current.outputs.node_version }}"
          manifest_expected="$(sed -n "s/^MANIFEST_SHA256='\([^']*\)'/\1/p" installers/vf-node.sh | head -n1)"
          test -n "$manifest_expected"
          test "$(sha256sum "$node_pkg/MANIFEST.sha256" | awk '{print $1}')" = "$manifest_expected"

          test "$(cat dist/p07/0.1.0-rc3/overlay/BUILD_ID)" = '0.1.0-rc3-guided-init16'
          test "$(git hash-object dist/p07/0.1.0-rc3/overlay/BUILD_ID)" = '622b752887d46c17a8a5d05046037a2dc6a35475'
          test "$(git hash-object dist/p07/0.1.0-rc3/overlay/bin/vfops-storage-setup)" = 'b279677ae561f9feb689964bd8f09be98c9211c9'
          test "$(git hash-object dist/p07/0.1.0-rc3/overlay/lib/google_device_oauth.py)" = '3b023f307bf744650a351e19bde01b3597469992'

          care_pkg="packages/p07-system-care/${{ steps.current.outputs.system_care_version }}"
          test "$(tr -d '\r\n' < "$care_pkg/VERSION")" = "${{ steps.current.outputs.system_care_version }}"

      - name: Single public entry contract
        run: |
          set -euo pipefail
          grep -q 'run_network_node' installers/p07-toolbox.sh
          grep -q 'run_vps_audit' installers/p07-toolbox.sh
          grep -q 'run_server_ops' installers/p07-toolbox.sh
          grep -q 'run_system_care' installers/p07-toolbox.sh
          grep -q "printf '请选择 \[0-4\]：'" installers/p07-toolbox.sh
          ! grep -Fq '功能模块 C（待接入）' installers/p07-toolbox.sh
          echo 'P07_TOOLBOX_CURRENT_ROUTE_SMOKE=PASS'
