name: P07 Toolbox Smoke

on:
  push:
    branches: [main, work/p07-guided-init9-cloudpanel-foundation, work/p07-guided-init9-real-gate-ux]
    paths:
      - 'installers/p07-toolbox.sh'
      - 'installers/p07.sh'
      - 'installers/p07-rc3-candidate.sh'
      - 'dist/p07/0.1.0-rc3/**'
      - 'installers/p07-system-care.sh'
      - 'packages/p07-system-care/**'
      - '.github/workflows/p07-toolbox-smoke.yml'
  pull_request:
    paths:
      - 'installers/p07-toolbox.sh'
      - 'installers/p07.sh'
      - 'installers/p07-rc3-candidate.sh'
      - 'dist/p07/0.1.0-rc3/**'
      - 'installers/p07-system-care.sh'
      - 'packages/p07-system-care/**'
      - '.github/workflows/p07-toolbox-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Toolbox syntax and public version surface
        shell: bash
        run: |
          set -euo pipefail
          bash -n installers/p07-toolbox.sh
          bash -n installers/p07.sh
          bash -n installers/p07-rc3-candidate.sh
          bash -n installers/p07-system-care.sh
          NO_COLOR=1 bash installers/p07-toolbox.sh --version | tee /tmp/version.txt
          NO_COLOR=1 bash installers/p07-toolbox.sh --help | tee /tmp/help.txt
          grep -q 'P07 Toolbox V0.1.0' /tmp/version.txt
          grep -q '1. 网络节点 / V2Ray.*V0.1.0' /tmp/help.txt
          grep -q '2. VPS 一键验机.*V2.1.0.*可用' /tmp/help.txt
          ! grep -q '2. VPS 一键验机.*测试中' /tmp/help.txt
          grep -q '3. CloudPanel 备份 / 恢复 / 迁移.*V0.1.0.*测试中' /tmp/help.txt
          ! grep -q '3. CloudPanel 备份 / 恢复 / 迁移.*可用' /tmp/help.txt
          grep -q '4. 系统维护 / 安全.*V0.1.0.*可用' /tmp/help.txt
          ! grep -q '4. 系统维护 / 安全.*测试中' /tmp/help.txt
          grep -q '用户界面仅显示 Vx.x.x 公共版本' /tmp/help.txt

      - name: Public version normalization contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'VERSION="V0.1.0"' installers/p07-toolbox.sh
          grep -Fq 'BUILD_ID="0.1.0-preview15"' installers/p07-toolbox.sh
          grep -Fq 'VPS_AUDIT_PUBLIC="V2.1.0"' installers/p07-toolbox.sh
          grep -Fq 'VPS_AUDIT_EXPECTED="V2.1.0"' installers/p07-toolbox.sh
          grep -Fq 'VF_SERVER_OPS_PUBLIC="V0.1.0"' installers/p07-toolbox.sh
          grep -Fq 'VF_SERVER_OPS_EXPECTED="VF Server Ops 0.1.0 RC3"' installers/p07-toolbox.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-rc3-guided-init9"' installers/p07-toolbox.sh
          grep -Fq 'SYSTEM_CARE_PUBLIC="V0.1.0"' installers/p07-toolbox.sh
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc12"' installers/p07-toolbox.sh
          grep -Fq '${C_GREEN}2.${C_RESET} VPS 一键验机' installers/p07-toolbox.sh
          grep -Fq '${C_CYAN}3.${C_RESET} CloudPanel 备份 / 恢复 / 迁移' installers/p07-toolbox.sh
          grep -Fq '${C_GREEN}4.${C_RESET} 系统维护 / 安全' installers/p07-toolbox.sh
          test "$(grep -Fc '${C_YELLOW}测试中${C_RESET}' installers/p07-toolbox.sh)" -eq 1
          test "$(grep -Fc '${C_GREEN}可用${C_RESET}' installers/p07-toolbox.sh)" -ge 3
          ! grep -Eq '^[[:space:]]*clear([[:space:]]|$)' installers/p07-toolbox.sh

      - name: Server Ops guided-init9 slot wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-rc3-guided-init9"' installers/p07-toolbox.sh
          grep -Fq 'run_server_ops' installers/p07-toolbox.sh
          grep -Fq 'P07_TOOLBOX_PARENT=1 bash "$tmp"' installers/p07-toolbox.sh
          grep -Fq 'p07-rc3-candidate.sh' installers/p07.sh
          grep -Fq 'EXPECTED_BLOB="92e5f0079294ca22bc77b7e7f48d64d779de263d"' installers/p07.sh
          test "$(git hash-object installers/p07-rc3-candidate.sh)" = '92e5f0079294ca22bc77b7e7f48d64d779de263d'
          test "$(cat dist/p07/0.1.0-rc3/overlay/BUILD_ID)" = '0.1.0-rc3-guided-init9'

          rm -rf /tmp/p07-toolbox-combined
          mkdir -p /tmp/p07-toolbox-combined
          cp -a dist/p07/0.1.0-rc2/vf-server-ops/. /tmp/p07-toolbox-combined/
          cp -a dist/p07/0.1.0-rc3/overlay/. /tmp/p07-toolbox-combined/
          test "$(NO_COLOR=1 bash /tmp/p07-toolbox-combined/bin/vfops-user --version)" = 'VF Server Ops 0.1.0 RC3'
          test "$(NO_COLOR=1 bash /tmp/p07-toolbox-combined/bin/vfops-user --build-id)" = '0.1.0-rc3-guided-init9'

          for path in \
            bin/vfops-user \
            bin/vfops-site-ui \
            bin/vfops-migrate-ui \
            bin/vfops-cloudpanel-ui \
            bin/vfops-auto-backup \
            bin/vfops-storage-setup \
            lib/cloudpanel.py \
            lib/cloudpanel_site.py \
            lib/site_lifecycle.py \
            lib/restore.py \
            lib/restore_as.py \
            lib/restore_as_verified.py \
            lib/package.py \
            lib/package_core.py \
            lib/backup_frontend.py \
            lib/diagnostics.py; do
            test -f "dist/p07/0.1.0-rc3/overlay/$path"
            grep -Fq "$path" installers/p07-rc3-candidate.sh
          done

          grep -Fq '1. 服务器 / 网站概览' dist/p07/0.1.0-rc3/overlay/bin/vfops-user
          grep -Fq '2. 备份网站' dist/p07/0.1.0-rc3/overlay/bin/vfops-user
          grep -Fq '3. 恢复网站' dist/p07/0.1.0-rc3/overlay/bin/vfops-user
          grep -Fq '4. 迁移网站到新服务器' dist/p07/0.1.0-rc3/overlay/bin/vfops-user
          grep -Fq '5. 自动备份 / 远程灾备' dist/p07/0.1.0-rc3/overlay/bin/vfops-user
          grep -Fq '6. CloudPanel 网站工具' dist/p07/0.1.0-rc3/overlay/bin/vfops-user
          grep -Fq 'restore_as_verified.py' dist/p07/0.1.0-rc3/overlay/bin/vfops-site-ui
          grep -Fq 'P07_RESTORE_AS_VERIFIED=' dist/p07/0.1.0-rc3/overlay/bin/vfops-site-ui
          grep -Fq 'P07_RESTORE_EVIDENCE=' dist/p07/0.1.0-rc3/overlay/bin/vfops-site-ui
          grep -Fq '/var/lib/vf-server-ops/evidence/restore-as' dist/p07/0.1.0-rc3/overlay/bin/vfops-site-ui
          ! grep -Fq 'REAL_PASS' dist/p07/0.1.0-rc3/overlay/bin/vfops-site-ui
          grep -Fq 'TARGET_SITE_CONFLICT' dist/p07/0.1.0-rc3/overlay/bin/vfops-migrate-ui
          grep -Fq 'TARGET_SITE_ALREADY_EXISTS' dist/p07/0.1.0-rc3/overlay/lib/restore.py
          grep -Fq 'existing_site_overwrite_allowed' dist/p07/0.1.0-rc3/overlay/lib/restore_as.py
          grep -Fq 'LOCAL_HTTPS_SNI' dist/p07/0.1.0-rc3/overlay/lib/restore_as_verified.py
          grep -Fq 'O_NOFOLLOW' dist/p07/0.1.0-rc3/overlay/lib/backup_frontend.py
          grep -Fq 'DB_EXPORT_FAILED' dist/p07/0.1.0-rc3/overlay/lib/diagnostics.py
          grep -Fq 'GUIDED_DEVICE_OAUTH_FRESH' dist/p07/0.1.0-rc3/overlay/lib/storage_setup.py
          grep -Fq '当前网站：已重新读取 CloudPanel 全部站点' dist/p07/0.1.0-rc3/overlay/bin/vfops-auto-backup
          grep -Fq '旧 PASS 不会覆盖新站点' dist/p07/0.1.0-rc3/overlay/bin/vfops-auto-backup

      - name: System Care RC12 slot wiring remains closed
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc12"' installers/p07-toolbox.sh
          grep -Fq 'SYSTEM_CARE_INSTALLER="https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/p07-system-care.sh"' installers/p07-toolbox.sh
          grep -Fq "VERSION='0.1.0-rc12'" installers/p07-system-care.sh
          grep -Fq "MANIFEST_BLOB='3c120333051561d7aa21c3a569d8a4d295593375'" installers/p07-system-care.sh
          grep -Fq 'run_system_care' installers/p07-toolbox.sh
          grep -Fq 'vf-system-care menu' installers/p07-toolbox.sh

      - name: System Care RC12 exact package
        shell: bash
        run: |
          set -euo pipefail
          pkg='packages/p07-system-care/0.1.0-rc12'
          test "$(git hash-object "$pkg/MANIFEST.gitblob")" = '3c120333051561d7aa21c3a569d8a4d295593375'
          while read -r expected path; do
            test "$(git hash-object "$pkg/$path")" = "$expected"
          done < "$pkg/MANIFEST.gitblob"
          test "$(cat "$pkg/VERSION")" = '0.1.0-rc12'

      - name: Single public entry contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'run_vps_audit' installers/p07-toolbox.sh
          grep -q 'run_server_ops' installers/p07-toolbox.sh
          grep -q 'run_system_care' installers/p07-toolbox.sh
          grep -q "printf '请选择 \[0-4\]：'" installers/p07-toolbox.sh
          ! grep -Fq '功能模块 C（待接入）' installers/p07-toolbox.sh

      - name: Result
        run: echo 'P07_TOOLBOX_SMOKE=PASS'
