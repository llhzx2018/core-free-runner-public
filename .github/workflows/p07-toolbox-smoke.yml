name: P07 Toolbox Smoke

on:
  push:
    branches: [main]
    paths:
      - 'installers/p07-toolbox.sh'
      - '.github/workflows/p07-toolbox-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Toolbox syntax and surface
        shell: bash
        run: |
          set -euo pipefail
          bash -n installers/p07-toolbox.sh
          NO_COLOR=1 bash installers/p07-toolbox.sh --version | tee /tmp/version.txt
          NO_COLOR=1 bash installers/p07-toolbox.sh --help | tee /tmp/help.txt
          grep -q 'P07 Toolbox 0.1.0-preview5' /tmp/version.txt
          grep -q '1. 网络节点 / V2Ray' /tmp/help.txt
          grep -q '2. VPS 一键验机' /tmp/help.txt
          grep -q '3. 功能模块 C（待接入）' /tmp/help.txt

      - name: Frozen VPS audit integrity
        shell: bash
        run: |
          set -euo pipefail
          url='https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/e765c5547a4a92972428042c8594f9359346d3e6/experiments/p07-vps-audit-v20-rc3.sh'
          expected_sha='53b30d3616d40f8e64780e97486e36227afb5c07b651923f9205f2906c860951'
          curl -fsSL "$url" -o /tmp/p07-vps-audit.sh
          actual_sha="$(sha256sum /tmp/p07-vps-audit.sh | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"
          bash -n /tmp/p07-vps-audit.sh
          test "$(NO_COLOR=1 bash /tmp/p07-vps-audit.sh --version | awk '{print $NF}')" = '2.0.0-rc3-zh'

      - name: Single public entry contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'VPS_AUDIT_URL=' installers/p07-toolbox.sh
          grep -q 'VPS_AUDIT_SHA256=' installers/p07-toolbox.sh
          grep -q 'run_vps_audit' installers/p07-toolbox.sh
          grep -q 'pause_menu' installers/p07-toolbox.sh
