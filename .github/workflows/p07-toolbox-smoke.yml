name: P07 Toolbox Smoke

on:
  push:
    branches: [main]
    paths:
      - 'installers/p07-toolbox.sh'
      - 'installers/p07.sh'
      - 'installers/p07-rc3-admin-simple.sh'
      - 'installers/p07-rc3-nav-flat.sh'
      - 'dist/p07/0.1.0-rc3/**'
      - 'installers/p07-system-care.sh'
      - 'packages/p07-system-care/**'
      - '.github/workflows/p07-toolbox-smoke.yml'
  pull_request:
    paths:
      - 'installers/p07-toolbox.sh'
      - 'installers/p07.sh'
      - 'installers/p07-rc3-admin-simple.sh'
      - 'installers/p07-rc3-nav-flat.sh'
      - 'dist/p07/0.1.0-rc3/**'
      - 'installers/p07-system-care.sh'
      - 'packages/p07-system-care/**'
      - '.github/workflows/p07-toolbox-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Toolbox syntax and public version surface
        run: |
          set -euo pipefail
          bash -n installers/p07-toolbox.sh
          bash -n installers/p07.sh
          bash -n installers/p07-rc3-admin-simple.sh
          bash -n installers/p07-rc3-nav-flat.sh
          bash -n installers/p07-system-care.sh
          NO_COLOR=1 bash installers/p07-toolbox.sh --version | tee /tmp/version.txt
          NO_COLOR=1 bash installers/p07-toolbox.sh --help | tee /tmp/help.txt
          grep -q 'P07 Toolbox V0.1.0' /tmp/version.txt
          grep -q '1. 网络节点 / V2Ray.*V0.1.0' /tmp/help.txt
          grep -q '2. VPS 一键验机.*V2.1.0.*可用' /tmp/help.txt
          grep -q '3. CloudPanel 备份 / 恢复 / 迁移.*V0.1.0.*测试中' /tmp/help.txt
          grep -q '4. 系统维护 / 安全.*V0.1.0.*可用' /tmp/help.txt
          grep -q '用户界面仅显示 Vx.x.x 公共版本' /tmp/help.txt

      - name: Public version normalization contract
        run: |
          set -euo pipefail
          grep -Fq 'VERSION="V0.1.0"' installers/p07-toolbox.sh
          grep -Fq 'BUILD_ID="0.1.0-preview15"' installers/p07-toolbox.sh
          grep -Fq 'VPS_AUDIT_PUBLIC="V2.1.0"' installers/p07-toolbox.sh
          grep -Fq 'VF_SERVER_OPS_PUBLIC="V0.1.0"' installers/p07-toolbox.sh
          grep -Fq 'VF_SERVER_OPS_EXPECTED="VF Server Ops 0.1.0 RC3"' installers/p07-toolbox.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-rc3-guided-init14"' installers/p07-toolbox.sh
          grep -Fq 'SYSTEM_CARE_PUBLIC="V0.1.0"' installers/p07-toolbox.sh
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc12"' installers/p07-toolbox.sh
          test "$(grep -Fc '${C_YELLOW}测试中${C_RESET}' installers/p07-toolbox.sh)" -eq 1
          test "$(grep -Fc '${C_GREEN}可用${C_RESET}' installers/p07-toolbox.sh)" -ge 3
          ! grep -Eq '^[[:space:]]*clear([[:space:]]|$)' installers/p07-toolbox.sh

      - name: Server Ops guided-init14 slot wiring
        run: |
          set -euo pipefail
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-rc3-guided-init14"' installers/p07-toolbox.sh
          grep -Fq 'run_server_ops' installers/p07-toolbox.sh
          grep -Fq 'P07_TOOLBOX_PARENT=1 bash "$tmp"' installers/p07-toolbox.sh
          grep -Fq 'p07-rc3-admin-simple.sh' installers/p07.sh
          grep -Fq 'EXPECTED_BLOB="8043a1c8edf538028eb0df6482481f78ca3999c9"' installers/p07.sh
          grep -Fq 'BASE_INSTALLER_BLOB="e3f91a6d0aacff4fe7c7ba0a2e861b7170dad03d"' installers/p07-rc3-admin-simple.sh
          grep -Fq 'EXPECTED_BUILD_ID="0.1.0-rc3-guided-init14"' installers/p07-rc3-admin-simple.sh
          test "$(cat dist/p07/0.1.0-rc3/overlay/BUILD_ID)" = '0.1.0-rc3-guided-init14'

          rm -rf /tmp/p07-toolbox-combined
          mkdir -p /tmp/p07-toolbox-combined
          cp -a dist/p07/0.1.0-rc2/vf-server-ops/. /tmp/p07-toolbox-combined/
          cp -a dist/p07/0.1.0-rc3/overlay/. /tmp/p07-toolbox-combined/
          test "$(NO_COLOR=1 bash /tmp/p07-toolbox-combined/bin/vfops-user --version)" = 'VF Server Ops 0.1.0 RC3'
          test "$(NO_COLOR=1 bash /tmp/p07-toolbox-combined/bin/vfops-user --build-id)" = '0.1.0-rc3-guided-init14'
          test "$(git hash-object /tmp/p07-toolbox-combined/bin/vfops-user)" = '1028b939ecd4c52377c846ab8e12ff136667981c'
          test "$(git hash-object /tmp/p07-toolbox-combined/bin/vfops-cloudpanel-ui)" = '5b0fa75d6951586c82404e361b88ab5e10661212'
          test "$(git hash-object /tmp/p07-toolbox-combined/lib/cloudpanel_ui_common.sh)" = 'b591cd9b7e1ab9e715cf60cd702fee44f448e7ff'
          test "$(git hash-object /tmp/p07-toolbox-combined/lib/cloudpanel_ui_admin.sh)" = 'eeae6b514b27e15e20ea596f5cd363e7779e461b'
          test "$(git hash-object /tmp/p07-toolbox-combined/lib/site_lifecycle.py)" = '3e84dfa74b4df8413c3228322b8dc1c22d901761'
          test "$(git hash-object /tmp/p07-toolbox-combined/lib/restore_as_verified.py)" = 'c0df2750e0cb79e16bf46cad88e85cacacfc2415'

          printf '0\n' | bash /tmp/p07-toolbox-combined/bin/vfops-user > /tmp/p07-slot3.txt
          grep -Fq '6. 网站管理' /tmp/p07-slot3.txt
          grep -Fq '7. CloudPanel 管理' /tmp/p07-slot3.txt
          printf '0\n' | bash /tmp/p07-toolbox-combined/bin/vfops-cloudpanel-ui admin > /tmp/p07-cp-menu.txt
          grep -Fq '1. 创建网站' /tmp/p07-cp-menu.txt
          grep -Fq '2. CloudPanel 安全' /tmp/p07-cp-menu.txt
          grep -Fq '3. CloudPanel 用户' /tmp/p07-cp-menu.txt
          grep -Fq '4. 平台基础能力检查' /tmp/p07-cp-menu.txt
          ! grep -Fq 'Vhost 模板' /tmp/p07-cp-menu.txt
          grep -Fq 'Vhost Templates（高级）' /tmp/p07-toolbox-combined/lib/cloudpanel_ui_admin.sh
          ! grep -Eiq '^[[:space:]]*[0-9]+\.[[:space:]]*(删除网站|删除数据库|删除用户)' /tmp/p07-cp-menu.txt

      - name: System Care RC12 slot wiring remains closed
        run: |
          set -euo pipefail
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc12"' installers/p07-toolbox.sh
          grep -Fq 'SYSTEM_CARE_INSTALLER="https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/p07-system-care.sh"' installers/p07-toolbox.sh
          grep -Fq "VERSION='0.1.0-rc12'" installers/p07-system-care.sh
          grep -Fq "MANIFEST_BLOB='3c120333051561d7aa21c3a569d8a4d295593375'" installers/p07-system-care.sh
          grep -Fq 'run_system_care' installers/p07-toolbox.sh
          grep -Fq 'vf-system-care menu' installers/p07-toolbox.sh

      - name: System Care RC12 exact package
        run: |
          set -euo pipefail
          pkg='packages/p07-system-care/0.1.0-rc12'
          test "$(git hash-object "$pkg/MANIFEST.gitblob")" = '3c120333051561d7aa21c3a569d8a4d295593375'
          while read -r expected path; do
            test "$(git hash-object "$pkg/$path")" = "$expected"
          done < "$pkg/MANIFEST.gitblob"
          test "$(cat "$pkg/VERSION")" = '0.1.0-rc12'

      - name: Single public entry contract
        run: |
          set -euo pipefail
          grep -q 'run_vps_audit' installers/p07-toolbox.sh
          grep -q 'run_server_ops' installers/p07-toolbox.sh
          grep -q 'run_system_care' installers/p07-toolbox.sh
          grep -q "printf '请选择 \[0-4\]：'" installers/p07-toolbox.sh
          ! grep -Fq '功能模块 C（待接入）' installers/p07-toolbox.sh

      - name: Result
        run: echo 'P07_TOOLBOX_SMOKE=PASS'
