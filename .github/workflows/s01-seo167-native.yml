name: S01 Theme SEO167 native exact upgrade gate
on:
  push:
    branches: [task/s01-render-verify-20261022]
    paths: ['.github/workflows/s01-seo167-native.yml']
permissions:
  contents: read
env:
  TARGET_VERSION: 1.35.167
  TARGET_SHA: 4ed20edecb66d5c928ce8baa07c0d8eb355cc736
  TARGET_TREE: d283bb1cf8c7a64fab0a6a620edd9190060265ac
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          ref: 02d4591eed025a3d3a67bc0a150b3ddc448c2ab8
          persist-credentials: false
          path: established
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 4ed20edecb66d5c928ce8baa07c0d8eb355cc736
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Verify candidate and deterministic package
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          php -l target/src/inc/admin/admin-seo-actions.php
          php -l target/src/inc/runtime-constants.php
          node --check target/src/assets/js/admin/admin-seo.js
          php target/tests/seo-workflow-v4-contract.php
          php target/tests/seo-reference-prototype-v3-contract.php
          gh release download v1.25.94 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.94.zip --dir provider
          echo '70b90d40da5d69fc7819bd7ada3f15fb0145e64822b788bd94956c7827b2df03  provider/vf-tools-m3u8_V1.25.94.zip' | sha256sum -c
          gh release download v1.35.165 --repo llhzx2018/vf-tools-theme --pattern vf-tools-theme_V1.35.165.zip --dir provider
          echo 'f617fdfccd6fef7999bc17878c923bfad800fae714ec50fedce4f7fb343101e8  provider/vf-tools-theme_V1.35.165.zip' | sha256sum -c
          gh release download v1.35.166 --repo llhzx2018/vf-tools-theme --pattern vf-tools-theme_V1.35.166.zip --dir provider
          echo '7137becd6745016296979977daced6cb0b457c06f1eaf3c4b135da7cebbd1d5a  provider/vf-tools-theme_V1.35.166.zip' | sha256sum -c
          python3 control/lanes/s01-render166/package.py
      - name: Native WordPress isolated 165 and 166 upgrade / rollback / read-only check
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          cp -a established/lanes/s01-frontend-design-20261017 lane
          cp control/lanes/s01-seo-readonly-20261022/native-browser167.cjs lane/seo167-browser.cjs
          python3 -m py_compile control/lanes/s01-seo-readonly-20261022/prepare-native167.py
          python3 control/lanes/s01-seo-readonly-20261022/prepare-native167.py
          bash lane/native-seo167.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-seo167-native
          path: proof/
          retention-days: 14
      - name: Cleanup
        if: always()
        run: rm -rf target provider lane
