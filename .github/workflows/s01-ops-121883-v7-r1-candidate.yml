name: S01 Ops 1.21.883 V7 R1 Formal Release

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  actions: read

jobs:
  formal-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_REPO: llhzx2018/vf-tools-ops
      SOURCE_SHA: 37fc175d892e4f137d396334e6ed913071af9cde
      VERSION: 1.21.883
      TAG: v1.21.883
      ASSET: vf-tools-ops_V1.21.883.zip
      CANDIDATE_RUN_ID: '35436317811'
      CANDIDATE_ARTIFACT_ID: '10582750266'
      EXPECTED_BYTES: '3420051'
      EXPECTED_SHA256: c188e84b8b7f782db7c986f73ca57deffc3a4b3edab4e5fbcaa01f21d5fd4e9b
      EXPECTED_RUNTIME_FILES: '955'
      EXPECTED_RUNTIME_FP: ab885325ace5a7ed0e866397e131184fdaa9b97938f31f552e55cf77e92c7ebf

    steps:
      - name: Credential presence gate
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"
          echo PASS_RELEASE_CREDENTIAL_PRESENCE

      - name: Checkout exact Ops source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 37fc175d892e4f137d396334e6ed913071af9cde
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: ops
          persist-credentials: false

      - name: Exact source identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' < ops/VERSION)" = "$VERSION"
          grep -Fq 'Version: 1.21.883' ops/vf-ops.php
          grep -Fq 'S01-MATURE-ADMIN-V7-R1-PRODUCT-SYSTEM-REBUILD' ops/vf-ops.php
          php ops/tests/s01-c02-121883-v7-r1-product-system-contract.php
          echo PASS_EXACT_RELEASE_SOURCE

      - name: Fetch exact tested candidate artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/tested && mkdir -p /tmp/tested
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/artifacts/$CANDIDATE_ARTIFACT_ID/zip" \
            -o /tmp/tested-artifact.zip
          unzip -q /tmp/tested-artifact.zip -d /tmp/tested
          ZIP="$(find /tmp/tested -type f -name "$ASSET" -print -quit)"
          test -n "$ZIP"
          cp "$ZIP" "/tmp/$ASSET"
          test "$(stat -c %s "/tmp/$ASSET")" = "$EXPECTED_BYTES"
          test "$(sha256sum "/tmp/$ASSET" | awk '{print $1}')" = "$EXPECTED_SHA256"
          unzip -tq "/tmp/$ASSET" >/dev/null
          echo PASS_EXACT_TESTED_ARTIFACT_FETCH

      - name: Runtime Authority exact verification
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib, os, re, zipfile
          p='/tmp/'+os.environ['ASSET']
          rows=[]
          with zipfile.ZipFile(p) as z:
              names=[n for n in z.namelist() if not n.endswith('/')]
              assert names and all(n.startswith('vf-ops/') for n in names)
              for n in names:
                  rel=n[len('vf-ops/'):]
                  if re.search(r'(^|/)(?:\.git|\.github|tests?|docs?|evidence|private|tmp|temp|cache|logs?)(/|$)',rel,re.I): continue
                  if re.search(r'\.(?:sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',rel,re.I): continue
                  ok=(('/' not in rel and rel in ('vf-ops.php','uninstall.php')) or re.match(r'^(?:includes|assets|languages|config)/',rel))
                  if not ok: raise SystemExit('non-runtime package file: '+rel)
                  b=z.read(n)
                  rows.append((rel,hashlib.sha256(b).hexdigest()))
              main=z.read('vf-ops/vf-ops.php')
              assert b'Version: 1.21.883' in main
              assert 'vf-ops/assets/css/current/admin-s01-v7-product-system-r1.css' in names
          rows.sort()
          canonical=b''.join(rel.encode()+b'\0'+sha.encode()+b'\n' for rel,sha in rows)
          assert len(rows)==int(os.environ['EXPECTED_RUNTIME_FILES'])
          assert hashlib.sha256(canonical).hexdigest()==os.environ['EXPECTED_RUNTIME_FP']
          print('PASS_RUNTIME_AUTHORITY_EXACT')
          PY

      - name: Verify tag and release absence
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          if gh release view "$TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then exit 31; fi
          if gh api "repos/$TARGET_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then exit 32; fi
          test "$(gh api "repos/$TARGET_REPO/commits/$SOURCE_SHA" --jq '.sha')" = "$SOURCE_SHA"
          echo PASS_RELEASE_ABSENCE_AND_TARGET

      - name: Create exact formal release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          cat > /tmp/release-notes.md <<EOF
          # VF Tools Ops V1.21.883

          **S01-C02 · Mature Admin V7 R1 Product System Rebuild**

          This release starts the full VF Tools Ops UX/UI rebuild with a shared product-system contract instead of another page-specific polish layer.

          R1 establishes:
          - a two-level product App Bar with explicit current-workspace context;
          - one stable six-domain navigation contract;
          - unified page rhythm, controls, data tables, status, details and feedback;
          - reduced card-wall/shadow treatment;
          - desktop/mobile/touch/focus/high-contrast behavior;
          - a documented V7 contract for the remaining Ops domains and later M3U8/Theme admin convergence.

          Safety:
          - Schema 6.0.0 -> 6.0.0
          - Data Migration NONE
          - Six-domain IA UNCHANGED
          - Routes/controllers/services UNCHANGED
          - M3U8/Theme ownership UNCHANGED
          - Shared updater protocol UNCHANGED
          - Candidate Gate $CANDIDATE_RUN_ID PASS
          - Rollback v1.21.882
          - Production installation NOT YET CLAIMED
          - OWNER Real-use POST_RELEASE_NOT_RUN

          Exact asset:
          - $ASSET
          - Bytes $EXPECTED_BYTES
          - SHA-256 $EXPECTED_SHA256
          - Runtime files $EXPECTED_RUNTIME_FILES
          - Runtime Fingerprint $EXPECTED_RUNTIME_FP
          EOF
          created=0
          cleanup(){ rc=$?; if [ "$rc" -ne 0 ] && [ "$created" -eq 1 ]; then gh release delete "$TAG" --repo "$TARGET_REPO" --cleanup-tag -y >/dev/null 2>&1 || true; fi; exit "$rc"; }
          trap cleanup EXIT
          gh release create "$TAG" "/tmp/$ASSET#VF Tools Ops $VERSION" \
            --repo "$TARGET_REPO" --target "$SOURCE_SHA" --title "VF Tools Ops V$VERSION" --notes-file /tmp/release-notes.md
          created=1
          trap - EXIT
          echo PASS_FORMAL_RELEASE_CREATED

      - name: Independent remote release readback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          JSON="$(gh api "repos/$TARGET_REPO/releases/tags/$TAG")"
          RID="$(jq -r '.id' <<<"$JSON")"
          AID="$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.id' <<<"$JSON")"
          PUBLISHED="$(jq -r '.published_at' <<<"$JSON")"
          test -n "$RID" && test "$RID" != null
          test -n "$AID" && test "$AID" != null
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.size' <<<"$JSON")" = "$EXPECTED_BYTES"
          test "$(gh api "repos/$TARGET_REPO/git/ref/tags/$TAG" --jq '.object.sha')" = "$SOURCE_SHA"
          rm -rf /tmp/release-readback && mkdir -p /tmp/release-readback
          gh release download "$TAG" --repo "$TARGET_REPO" --pattern "$ASSET" --dir /tmp/release-readback
          test "$(stat -c %s "/tmp/release-readback/$ASSET")" = "$EXPECTED_BYTES"
          test "$(sha256sum "/tmp/release-readback/$ASSET" | awk '{print $1}')" = "$EXPECTED_SHA256"
          cmp "/tmp/$ASSET" "/tmp/release-readback/$ASSET"
          unzip -tq "/tmp/release-readback/$ASSET" >/dev/null
          cat > /tmp/formal-release-receipt.txt <<EOF
          COMPONENT=S01-C02
          VERSION=$VERSION
          SOURCE_SHA=$SOURCE_SHA
          CANDIDATE_RUN=$CANDIDATE_RUN_ID
          CANDIDATE_ARTIFACT_ID=$CANDIDATE_ARTIFACT_ID
          TAG=$TAG
          RELEASE_ID=$RID
          ASSET=$ASSET
          ASSET_ID=$AID
          BYTES=$EXPECTED_BYTES
          SHA256=$EXPECTED_SHA256
          RUNTIME_FILES=$EXPECTED_RUNTIME_FILES
          RUNTIME_FINGERPRINT=$EXPECTED_RUNTIME_FP
          V7_PRODUCT_APP_BAR=PASS
          SIX_DOMAIN_NAVIGATION=PASS
          WORKSPACE_CONTEXT=PASS
          SHARED_PRODUCT_SYSTEM=PASS
          MOBILE_TOUCH_CONTRACT=PASS
          PUBLISHED_AT=$PUBLISHED
          REMOTE_ZIP_INTEGRITY=PASS
          TESTED_ARTIFACT_EQUALS_DELIVERED_ARTIFACT=PASS
          PRODUCTION=NOT_CLAIMED
          OWNER_REAL_USE=POST_RELEASE_NOT_RUN
          RESULT=PASS
          EOF
          cat /tmp/formal-release-receipt.txt
          echo PASS_S01_OPS_121883_FORMAL_RELEASE

      - name: Upload formal release receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-121883-formal-release-${{ github.run_id }}
          path: /tmp/formal-release-receipt.txt
          if-no-files-found: error
          retention-days: 30
