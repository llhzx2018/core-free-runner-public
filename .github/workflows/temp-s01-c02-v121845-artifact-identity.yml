name: TEMP S01-C02 Ops 1.21.845 Artifact Identity
on:
  push:
    branches:
      - temp/s01-c02-v121845-runtime-suffix-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121845-artifact-identity.yml'
jobs:
  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      COMMIT: b2e54350130866ac569b379473773d281c6d04f2
      TREE: 27f7ba81b227c6d2e93c55311aef7f041a081d61
      ASSET: vf-tools-ops_V1.21.845.zip
      RUNNER_MAIN: 0160b557ad4ae0e8c6acd97e7551285bc05870bd
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.COMMIT }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: ops
      - name: Build deterministic release identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$COMMIT"
          test "$(git -C ops rev-parse HEAD^{tree})" = "$TREE"
          test "$(tr -d '\r\n' < ops/VERSION)" = 1.21.845
          php ops/.github/phase3/v121845-final-audit-runtime-suffix-retry.php | grep -Fxq PASS_V121845_FINAL_AUDIT_RUNTIME_SUFFIX_RETRY
          mkdir -p /tmp/release
          python3 - <<'PY'
          import re, hashlib, zipfile, os
          from pathlib import Path
          root=Path('ops'); files={}
          def ok(r):
              p=r.as_posix(); q=p.split('/')
              if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in q): return False
              if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',p,re.I): return False
              if '/' not in p: return p in {'vf-ops.php','uninstall.php'}
              return q[0] in {'includes','assets','languages','config'}
          for s in root.rglob('*'):
              if s.is_file() and not s.is_symlink():
                  r=s.relative_to(root)
                  if ok(r): files[r.as_posix()]=s.read_bytes()
          files=dict(sorted(files.items())); fp=hashlib.sha256()
          for r,b in files.items(): fp.update((r+'\0'+hashlib.sha256(b).hexdigest()+'\n').encode())
          z=Path('/tmp/release/'+os.environ['ASSET'])
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as out:
              for r,b in files.items():
                  info=zipfile.ZipInfo('vf-ops/'+r,(2026,9,6,0,0,0)); info.compress_type=zipfile.ZIP_DEFLATED; info.external_attr=0o100644<<16; out.writestr(info,b)
          print('RELEASE_COMMIT='+os.environ['COMMIT'])
          print('RELEASE_TREE='+os.environ['TREE'])
          print('RELEASE_ASSET='+os.environ['ASSET'])
          print('RELEASE_BYTES='+str(z.stat().st_size))
          print('RELEASE_SHA256='+hashlib.sha256(z.read_bytes()).hexdigest())
          print('RELEASE_FILES='+str(len(files)))
          print('RELEASE_FP='+fp.hexdigest())
          PY
          unzip -tq "/tmp/release/$ASSET" >/dev/null
          unzip -p "/tmp/release/$ASSET" vf-ops/includes/site-release/s01-static-final-audit-runtime-suffix-retry-v121845.php | grep -Fq 'vf_ops_s01_static_runtime_suffix_failure_matches_v121845'
          unzip -p "/tmp/release/$ASSET" vf-ops/includes/site-release/s01-static-final-audit-runtime-suffix-retry-v121845.php | grep -Fq 'RUNTIME_SUFFIX_EARLY_FINAL_AUDIT_PROVEN'
          unzip -p "/tmp/release/$ASSET" vf-ops/vf-ops.php | grep -Fq 'Version: 1.21.845'
          test "$(git ls-remote https://github.com/llhzx2018/core-free-runner-public.git refs/heads/main | awk '{print $1}')" = "$RUNNER_MAIN"
          echo ARTIFACT_IDENTITY_V121845=PASS
