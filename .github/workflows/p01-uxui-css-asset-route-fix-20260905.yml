name: P01 UXUI Visual CSS Asset Route Fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p01-uxui-css-asset-route-fix-20260905.yml

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_SHA: 1e1ef3337753956add86c80613476506064378ca
      BASE_SHA: c6b6a7d7c8766a3e5db1be8965b67cab1fa7fee8
      APP_URL: http://127.0.0.1:8091
      TEST_PASSWORD: VF-CSS-Route-2026!
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: 1e1ef3337753956add86c80613476506064378ca
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 8
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_sqlite,sqlite3,curl

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Exact candidate boundary and regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          changed="$(git diff --name-only "$BASE_SHA"..HEAD | sort)"
          printf '%s\n' "$changed"
          test "$changed" = $'src/assets/quick-open.css\ntests/unit/uxui_round8_visual_system_contract.php'
          test "$(cat VERSION)" = '2.46.3'
          test "$(cat src/VERSION.txt)" = '2.46.3'
          ! git diff --name-only "$BASE_SHA"..HEAD | grep -Eq '(^VERSION$|^src/VERSION.txt$|^src/app/bootstrap.php$|^src/migrations/)'
          grep -Fq '@import url("asset.php?file=visual-system-final.css");' src/assets/quick-open.css
          ! grep -Fq '@import url("visual-system-final.css");' src/assets/quick-open.css
          php -l tests/unit/uxui_round8_visual_system_contract.php
          php tests/unit/uxui_round8_visual_system_contract.php
          php tests/unit/consolidated_product_acceptance_contract.php
          for f in tests/unit/uxui_round1_home_root_contract.php tests/unit/uxui_round2_subject_identity_contract.php tests/unit/uxui_round3_course_identity_contract.php tests/unit/uxui_round4_tools_identity_contract.php tests/unit/uxui_round5_software_identity_contract.php tests/unit/uxui_round6_channels_watch_identity_contract.php tests/unit/uxui_round7_navigation_home_identity_contract.php; do php "$f"; done

      - name: Install Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP"
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Clean install runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          php -S 127.0.0.1:8091 -t "$GITHUB_WORKSPACE/src" >"$RUNNER_TEMP/p01-css-route-server.log" 2>&1 &
          for i in $(seq 1 40); do curl -fsS "$APP_URL/setup.php" >/dev/null && break; sleep 0.5; done
          COOKIE="$RUNNER_TEMP/setup.cookies"
          curl -fsS -c "$COOKIE" "$APP_URL/setup.php" > "$RUNNER_TEMP/setup.html"
          CSRF="$(python3 - <<'PY'
          import re,os
          p=open(os.environ['RUNNER_TEMP']+'/setup.html',encoding='utf-8').read()
          m=re.search(r'name="setup_csrf" value="([^"]+)"',p)
          if not m: raise SystemExit('setup csrf missing')
          print(m.group(1))
          PY
          )"
          curl -fsS -b "$COOKIE" -c "$COOKIE" \
            --data-urlencode "setup_csrf=$CSRF" \
            --data-urlencode "site_title=VF CSS Route Gate" \
            --data-urlencode "admin_password=$TEST_PASSWORD" \
            --data-urlencode "admin_password_confirm=$TEST_PASSWORD" \
            "$APP_URL/setup.php" > "$RUNNER_TEMP/setup-post.html"
          grep -Fq 'VF Start 安装完成' "$RUNNER_TEMP/setup-post.html"
          curl -fsSI "$APP_URL/asset.php?file=visual-system-final.css" | tee "$RUNNER_TEMP/asset-head.txt"
          grep -Eiq '^Content-Type: text/css' "$RUNNER_TEMP/asset-head.txt"

      - name: Real browser CSS routing smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$RUNNER_TEMP/css-route-smoke.mjs" <<'JS'
          import { chromium } from 'playwright';
          const base=process.env.APP_URL;
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1280,height:900}});
          const page=await context.newPage();
          const errors=[];
          let visualResponse=null;
          page.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text())});
          page.on('pageerror',e=>errors.push('pageerror:'+e.message));
          page.on('response',r=>{if(r.url().includes('asset.php?file=visual-system-final.css'))visualResponse={status:r.status(),type:r.headers()['content-type']||'',url:r.url()}});
          await page.goto(base+'/',{waitUntil:'networkidle'});
          await page.locator('[data-vf-auth-login]').first().click();
          const dialog=page.locator('[data-vf-auth-dialog]');
          await dialog.locator('input[name="password"]').fill(process.env.TEST_PASSWORD);
          await dialog.locator('[data-vf-auth-submit]').click();
          await page.waitForLoadState('networkidle');
          if(await page.locator('body').getAttribute('data-vf-mode')!=='home')throw new Error('owner home identity missing');
          if(!visualResponse)throw new Error('visual-system-final.css was not requested through asset.php');
          if(visualResponse.status!==200||!visualResponse.type.toLowerCase().startsWith('text/css'))throw new Error('bad visual CSS response '+JSON.stringify(visualResponse));
          if(errors.length)throw new Error(errors.join(' | '));
          await page.goto(base+'/start.php',{waitUntil:'networkidle'});
          if(errors.length)throw new Error(errors.join(' | '));
          console.log('P01_UXUI_CSS_ASSET_ROUTE_BROWSER=PASS');
          console.log(JSON.stringify(visualResponse));
          await browser.close();
          JS
          cd "$RUNNER_TEMP"
          node css-route-smoke.mjs

      - name: Final receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'P01_UXUI_CSS_ASSET_ROUTE_FIX=PASS'
          echo "EXACT_CANDIDATE=$EXPECTED_SHA"
          echo 'VERSION=2.46.3'
          echo 'SCHEMA=2026090401'
          echo 'MIGRATION=NONE'
          echo 'RELEASE_MUTATION=NO'
          echo 'PRODUCTION_MUTATION=NO'
