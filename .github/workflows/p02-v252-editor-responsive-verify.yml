name: P02 V2.5.2 Editor Responsive Verify
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p02-v252-editor-responsive-verify.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: maintenance/v2.5.2-editor-responsive-hotfix
          token: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'
          path: p02
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare runtime
        working-directory: p02
        run: |
          set -Eeuo pipefail
          test -n '${{ secrets.VF_PRIVATE_READ_TOKEN }}'
          test "$(cat VERSION)" = 2.5.2
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-zip php-curl sqlite3 curl
          php -l public/index.php >/dev/null
          node --check public/assets/app.js
          node --check public/assets/editor-enhancements.js
          node --check public/assets/v251-preboot.js
          test -s public/assets/v251-hotfix.css
          test -s public/assets/v252-hotfix.css
          grep -q 'v252-hotfix.css' public/index.php
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Multi-viewport editor and prior-hotfix regression
        working-directory: p02
        env: {AUDIT_PASSWORD: 'P02-V252-${{ github.run_id }}-${{ github.run_attempt }}!'}
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/p02-v252"; SITE="$ROOT/site"; mkdir -p "$SITE"
          bash scripts/build-deploy-tree.sh "$SITE" >/dev/null
          test "$(cat "$SITE/VERSION.txt")" = 2.5.2
          test -s "$SITE/assets/v251-hotfix.css"; test -s "$SITE/assets/v252-hotfix.css"; test -s "$SITE/assets/v251-preboot.js"
          php -d display_errors=0 -S 127.0.0.1:18172 -t "$SITE" >"$ROOT/server.log" 2>&1 & echo $! > "$ROOT/server.pid"
          for _ in $(seq 1 80); do curl -fsS http://127.0.0.1:18172/setup.php >/dev/null 2>&1 && break; sleep .25; done
          curl -fsS -c "$ROOT/cookie.txt" http://127.0.0.1:18172/setup.php > "$ROOT/setup.html"
          TOKEN=$(python3 - "$ROOT/setup.html" <<'PY'
          import re,html,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf" value="([^"]+)"',s);assert m;print(html.unescape(m.group(1)))
          PY
          )
          test "$(curl -sS -o /dev/null -w '%{http_code}' -b "$ROOT/cookie.txt" -c "$ROOT/cookie.txt" -H 'Origin: http://127.0.0.1:18172' --data-urlencode "setup_csrf=$TOKEN" --data-urlencode "password=$AUDIT_PASSWORD" --data-urlencode "password_confirm=$AUDIT_PASSWORD" http://127.0.0.1:18172/setup.php)" = 303
          cat > .v252-responsive.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1920,height:1080}});
          let page=await context.newPage();const errors=[];page.on('pageerror',e=>errors.push(String(e)));
          const url='http://127.0.0.1:18172/';
          await page.goto(url,{waitUntil:'networkidle'});
          let sess=await page.evaluate(async()=>await(await fetch('/api.php?action=session',{cache:'no-store'})).json());
          if(!sess?.site?.auth){await page.locator('[data-open-login]').click();await page.locator('#loginForm input[name="password"]').fill(process.env.AUDIT_PASSWORD);await page.locator('#loginSubmit').click();await page.waitForFunction(async()=>Boolean((await(await fetch('/api.php?action=session',{cache:'no-store'})).json())?.site?.auth));sess=await page.evaluate(async()=>await(await fetch('/api.php?action=session',{cache:'no-store'})).json());}
          const csrf=sess.csrf;const post=async(a,b)=>page.evaluate(async({a,b,csrf})=>await(await fetch('/api.php?action='+a,{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(b)})).json(),{a,b,csrf});
          const c=await post('category_save',{name:'V252 Responsive Audit',description:'',icon:'folder'});const cid=Number(c.id);if(!cid)throw new Error('category');
          const i=await post('content_save',{category_id:cid,title:'V2.5.2 编辑模式全屏自适应验证',description:'responsive',content:'# V2.5.2\n\n这是一段用于编辑器宽度、字号和折叠恢复验证的正文。\n\n## 第二节\n\n编辑模式必须使用当前可用工作区，而不是被 920px / 1120px 固定上限限制。',content_mode:'article',content_format:'markdown',primary_action:'read',status:'active'});const iid=Number(i.id);if(!iid)throw new Error('item');
          async function openEdit(){await page.evaluate(async({cid,iid})=>{await setContentView('notebook');await selectCategory(cid);await openReader(iid,true);await state.workspaceController.setMode('edit',true)},{cid,iid});await page.waitForFunction(iid=>Number(state.readerItem?.id)===iid&&state.articleMode==='edit',iid,{timeout:10000});await page.locator('#articleSource').waitFor({state:'visible'});}
          await openEdit();
          async function measure(label){return await page.evaluate(label=>{const detail=document.querySelector('#notebookDetailScroll'),form=document.querySelector('#articleForm'),canvas=document.querySelector('.article-workspace.mode-edit .article-canvas'),ta=document.querySelector('#articleSource');const d=detail.getBoundingClientRect(),f=form.getBoundingClientRect(),c=canvas.getBoundingClientRect(),t=ta.getBoundingClientRect();return {label,viewport:innerWidth,detail:d.width,form:f.width,canvas:c.width,textarea:t.width,scrollW:document.documentElement.scrollWidth,clientW:document.documentElement.clientWidth};},label)}
          const results=[];
          for(const vp of [{w:1920,h:1080},{w:1600,h:900},{w:1440,h:900},{w:1319,h:666},{w:1024,h:768}]){await page.setViewportSize({width:vp.w,height:vp.h});await page.waitForTimeout(80);const m=await measure('normal-'+vp.w);results.push(m);if(m.form<m.detail*.96)throw new Error('editor form not adaptive '+JSON.stringify(m));if(m.canvas<m.detail*.86)throw new Error('editor canvas too narrow '+JSON.stringify(m));if(m.textarea<m.canvas*.84)throw new Error('textarea too narrow '+JSON.stringify(m));if(m.scrollW>m.clientW+1)throw new Error('horizontal overflow '+JSON.stringify(m));}
          // User-reported state: hide the middle document list and verify editor expands into the recovered space.
          await page.setViewportSize({width:1440,height:900});await page.evaluate(()=>toggleNotebookListCollapsed(true));await page.waitForFunction(()=>state.notebookListCollapsed===true);const hidden=await measure('list-hidden');results.push(hidden);if(hidden.form<hidden.detail*.96||hidden.canvas<hidden.detail*.88)throw new Error('editor did not expand after list collapse '+JSON.stringify(hidden));
          // Collapse outer sidebar as well: editor should keep growing rather than stay capped.
          await page.evaluate(()=>toggleSidebarCollapsed(true));await page.waitForTimeout(80);const both=await measure('sidebar-and-list-hidden');results.push(both);if(both.form<both.detail*.96||both.canvas<hidden.canvas)throw new Error('editor did not use reclaimed sidebar space '+JSON.stringify({hidden,both}));
          // Previous V2.5.1 font-size fix must remain effective.
          const ta=page.locator('#articleSource');const before=await ta.evaluate(el=>parseFloat(getComputedStyle(el).fontSize));await page.locator('[data-vf-editor-action="font-larger"]').first().click();const after=await ta.evaluate(el=>parseFloat(getComputedStyle(el).fontSize));if(!(after>before))throw new Error('editor font did not grow '+JSON.stringify({before,after}));
          // Restore list and confirm the prior hotfix still works.
          await page.evaluate(()=>toggleNotebookListCollapsed(false));await page.waitForFunction(()=>state.notebookListCollapsed===false);if(!await page.locator('#notebookListPane').isVisible())throw new Error('list restore failed');
          // Mobile/PAD: no horizontal overflow and editor remains visible.
          for(const vp of [{w:900,h:900},{w:768,h:1024},{w:430,h:932},{w:390,h:844}]){await page.setViewportSize({width:vp.w,height:vp.h});await page.waitForTimeout(100);await openEdit();const m=await page.evaluate(()=>({scrollW:document.documentElement.scrollWidth,clientW:document.documentElement.clientWidth,ta:document.querySelector('#articleSource')?.getBoundingClientRect().width||0}));if(m.scrollW>m.clientW+1)throw new Error('mobile horizontal overflow '+JSON.stringify({vp,m}));if(m.ta<Math.min(280,vp.w*.65))throw new Error('mobile editor too narrow '+JSON.stringify({vp,m}));}
          // New browser page/session must not inherit a mysteriously hidden Document List.
          await page.close();page=await context.newPage();await page.goto(url,{waitUntil:'networkidle'});await page.waitForFunction(()=>typeof state!=='undefined'&&state.site?.auth===true);const reset=await page.evaluate(()=>({local:localStorage.getItem('vftb-notebook-list-collapsed'),session:sessionStorage.getItem('vftb-notebook-list-collapsed-session'),state:state.notebookListCollapsed}));if(reset.local!=='0'||reset.session!=='0'||reset.state!==false)throw new Error('new-session list reset failed '+JSON.stringify(reset));
          if(errors.length)throw new Error(errors.join(' | '));console.log('P02_V252_EDITOR_RESPONSIVE_PASS='+JSON.stringify({results,before,after,reset}));await browser.close();
          JS
          node .v252-responsive.mjs
      - name: Changed runtime identity
        working-directory: p02
        run: |
          set -Eeuo pipefail
          for f in VERSION public/index.php public/assets/v251-hotfix.css public/assets/v251-preboot.js public/assets/v252-hotfix.css; do printf '%s  ' "$f"; wc -c < "$f" | tr -d '\n'; printf '  '; sha256sum "$f" | awk '{print $1}'; done
      - name: Cleanup
        if: always()
        working-directory: p02
        run: |
          if test -f "$RUNNER_TEMP/p02-v252/server.pid"; then kill "$(cat "$RUNNER_TEMP/p02-v252/server.pid")" 2>/dev/null || true; fi
          rm -rf "$RUNNER_TEMP/p02-v252" .v252-responsive.mjs node_modules package.json package-lock.json || true
