name: runner-harness-convergence-r1-temp

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-harness-convergence-r1-temp.yml'
      - 'scripts/ephemeral_lane_worktree.py'
      - 'scripts/ephemeral_lane_spec.py'
      - 'tests/test_ephemeral_lane_worktree.py'
      - 'tests/test_ephemeral_lane_spec.py'
      - 'docs/authority/SSOT.md'
      - 'docs/authority/ACCEPTANCE_MATRIX.md'

permissions:
  contents: read

jobs:
  helper-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact feature source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/runner-harness-convergence-r1
          persist-credentials: false
          fetch-depth: 1

      - name: Python syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/ephemeral_lane_spec.py scripts/ephemeral_lane_worktree.py

      - name: Existing lane spec regression
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tests/test_ephemeral_lane_spec.py

      - name: Exact and isolated worktree regression
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tests/test_ephemeral_lane_worktree.py

      - name: Shared harness summary
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'VF_RUNNER_EXACT_WORKTREE=PASS'
          echo 'VF_RUNNER_ISOLATED_WORKTREE=PASS'
          echo 'VF_RUNNER_FAILURE_CLASSIFICATION_BOUNDARY=PASS'
