name: TEMP skill-book V4.7 Candidate Governance Reconcile

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-skill-book-v47-candidate-release.yml'
      - '.github/scripts/temp_v47_governance_reconcile.py'

permissions:
  contents: read

concurrency:
  group: temp-skill-book-v47-governance-reconcile
  cancel-in-progress: false

env:
  GOV_REPOSITORY: llhzx2018/gov-doc
  TAG: skill-book-v4.7-candidate-20260827
  RELEASE_ID: '377914101'
  ASSET_ID: '532456078'
  ASSET_NAME: skill-book_V4.7_CANDIDATE_20260827.zip
  ASSET_BYTES: '141495'
  ASSET_SHA256: '0dc273200d3237a9292ff7a8d5d21275ac4dc39daf9cd144dc9818f12d525896'

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Checkout temporary runner branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Verify published V4.7 Release authority
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RELEASE_TOKEN"
          release_json="$(gh api "repos/$GOV_REPOSITORY/releases/tags/$TAG")"
          test "$(jq -r '.id' <<<"$release_json")" = "$RELEASE_ID"
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.id' <<<"$release_json")" = "$ASSET_ID"
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.size' <<<"$release_json")" = "$ASSET_BYTES"
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.digest' <<<"$release_json")" = "sha256:$ASSET_SHA256"
          echo 'V47_RELEASE_AUTHORITY_READBACK=PASS'

      - name: Reconcile GOV-DOC candidate pointers
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone "https://x-access-token:${RELEASE_TOKEN}@github.com/${GOV_REPOSITORY}.git" gov
          python3 .github/scripts/temp_v47_governance_reconcile.py gov
          sed -i 's/[[:space:]]\+$//' gov/distribution/skills/candidates/skill-book/V4.7/README.md
          cd gov
          git config user.name 'VF Governance Reconcile'
          git config user.email 'release@kewaro.com'
          git diff --check
          git add CURRENT.md distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md distribution/skills/candidates/skill-book/V4.7/README.md distribution/skills/candidates/skill-book/V4.7/RUNTIME_ZIP_MIRROR_STATUS.md
          git diff --cached --quiet && { echo 'V47_GOVERNANCE_NOOP_ALREADY_RECONCILED=PASS'; exit 0; }
          git commit -m 'skill-book: reconcile V4.7 published candidate authority'
          git push origin main
          echo 'V47_GOVERNANCE_RECONCILE_WRITE=PASS'

      - name: Remote governance readback
        shell: bash
        run: |
          set -Eeuo pipefail
          cd gov
          git fetch origin main
          git reset --hard origin/main
          grep -Fq '`skill-book V4.7` 为最新 Candidate' CURRENT.md
          grep -Fq '| skill-book | V3.5 | V4.6 CANDIDATE（非 Current） |' CURRENT.md
          grep -Fq '状态：`PUBLISHED_REMOTE_VERIFIED`' distribution/skills/candidates/skill-book/V4.7/RUNTIME_ZIP_MIRROR_STATUS.md
          grep -Fq '0dc273200d3237a9292ff7a8d5d21275ac4dc39daf9cd144dc9818f12d525896' distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md
          grep -Fq '532456078' distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md
          grep -Fq 'Source Current仍为V3.5' distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md
          echo 'V47_GOVERNANCE_REMOTE_READBACK=PASS'
          echo 'SOURCE_CURRENT=V3.5'
          echo 'LATEST_CANDIDATE=V4.7'
          echo 'INSTALLED_RUNTIME_OBSERVATION=V4.6'
          echo 'CURRENT_PROMOTION=NOT_AUTHORIZED'
