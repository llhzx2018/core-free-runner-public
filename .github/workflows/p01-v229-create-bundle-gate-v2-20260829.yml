name: P01 V2.29 Atomic Create Bundle Gate V2

on:
  push:
    branches:
      - task/p01-v229-create-bundle-gate-v2-20260829

permissions:
  contents: read

env:
  SOURCE_SHA: b017e64bb2f74639142725aa245cf6c53f056534
  ROOT: /tmp/p01-v229-create-bundle-v2
  PORT: '18452'
  ADMIN_PASS: 'P01BundleGateV2!2026'

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none

      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: source

      - name: Fresh runtime fixture and test files
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find source/src -type f -name '*.php' -print0)
          node --check source/src/assets/workspace.js
          node --check source/src/assets/workspace-rebaseline.js
          node --check source/src/assets/workspace-create-bundle.js
          rm -rf "$ROOT" /tmp/p01-bundle-v2-* || true
          cp -a source/src "$ROOT"
          php -d display_errors=1 -d log_errors=1 -d error_reporting=E_ALL -S "127.0.0.1:${PORT}" -t "$ROOT" >/tmp/p01-bundle-v2-server.log 2>&1 &
          echo $! >/tmp/p01-bundle-v2-server.pid
          COOKIE=/tmp/p01-bundle-v2-setup.cookies
          for i in $(seq 1 30); do curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:${PORT}/setup.php" -o /tmp/p01-bundle-v2-setup.html && break || sleep 1; done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-bundle-v2-setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:${PORT}/setup.php" --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=P01 Bundle Gate V2' --data-urlencode "admin_password=$ADMIN_PASS" --data-urlencode "admin_password_confirm=$ADMIN_PASS" -o /tmp/p01-bundle-v2-setup-post.html
          cat >/tmp/p01-bundle-v2-seed.php <<'PHP'
          <?php declare(strict_types=1);$root=getenv('ROOT');require $root.'/app/bootstrap.php';$r=new VfRepository(vf_db());$id=$r->createCategory(['name'=>'Bundle兼容归属','is_private'=>false,'sort_order'=>10]);if($id<=0)throw new RuntimeException('category');echo "CATEGORY_ID=$id\n";
          PHP
          ROOT="$ROOT" php /tmp/p01-bundle-v2-seed.php
          php "$ROOT/cli/verify.php" | grep -Fx VERIFY_PASS=YES
          python3 - <<'PY'
          import os,struct,zlib
          w,h=1600,1000;raw=bytearray()
          for _ in range(h):raw.extend(b'\x00'+os.urandom(w*3))
          def chunk(t,d):return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
          png=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(bytes(raw),6))+chunk(b'IEND',b'')
          open('/tmp/p01-bundle-v2-large.png','wb').write(png)
          open('/tmp/p01-bundle-v2-invalid.html','wb').write(b'<!doctype html><h1>BAD</h1>\x00<script>1</script>')
          open('/tmp/p01-bundle-v2-valid.html','wb').write(b'<!doctype html><meta charset="utf-8"><h1>ATOMIC_BUNDLE_V2_OK</h1><script>document.body.dataset.ok="1"</script>')
          print('PNG_BYTES',len(png))
          PY
          echo P01_BUNDLE_V2_FRESH=PASS

      - name: Install Playwright
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-bundle-v2-browser && cd /tmp/p01-bundle-v2-browser
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-save >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1

      - name: Browser failure injection
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/p01-bundle-v2-browser
          cat >failure.mjs <<'JS'
          import { chromium } from 'playwright';
          const base='http://127.0.0.1:18452';
          const browser=await chromium.launch({headless:true});const ctx=await browser.newContext({viewport:{width:1440,height:900}});
          const login=await ctx.request.post(base+'/api.php?action=login',{data:{password:'P01BundleGateV2!2026'}});if(!login.ok())throw new Error('login');
          const p=await ctx.newPage();await p.goto(base+'/topics.php',{waitUntil:'networkidle'});await p.locator('script[src*="workspace-create-bundle.js"]').waitFor({state:'attached',timeout:10000});await p.waitForTimeout(500);
          await p.locator('[data-open-add]').click();const f=p.locator('[data-add-form]');await f.locator('select[name="source_kind"]').selectOption('hosted_html');await f.locator('input[name="title"]').fill('原子失败专题');await f.locator('input[name="resource_kind"]').fill('一致性测试');await f.locator('input[name="is_private"]').uncheck();await f.locator('input[name="cover"]').setInputFiles('/tmp/p01-bundle-v2-large.png');await f.locator('input[name="html"]').setInputFiles('/tmp/p01-bundle-v2-invalid.html');await f.locator('button[type="submit"]:not([data-add-continue])').click();
          await p.getByText(/创建失败，未写入任何资源/).waitFor({timeout:30000});if(!(await f.isVisible()))throw new Error('add panel closed');if(await f.locator('button[type="submit"]:not([data-add-continue])').isDisabled())throw new Error('submit disabled');await p.screenshot({path:'/tmp/p01-bundle-v2-rollback.png',fullPage:true});await browser.close();console.log('P01_BUNDLE_V2_BROWSER_ROLLBACK=PASS');
          JS
          node failure.mjs | grep -Fx P01_BUNDLE_V2_BROWSER_ROLLBACK=PASS

      - name: Verify rollback truth
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/p01-bundle-v2-rollback.php <<'PHP'
          <?php declare(strict_types=1);$root=getenv('ROOT');require $root.'/app/bootstrap.php';$db=vf_db();$q=$db->prepare("SELECT COUNT(*) FROM links WHERE title='原子失败专题'");$q->execute();if((int)$q->fetchColumn()!==0)throw new RuntimeException('link survived');if((int)$db->query('SELECT COUNT(*) FROM resource_domain_profiles')->fetchColumn()!==0)throw new RuntimeException('profile survived');if((int)$db->query('SELECT COUNT(*) FROM resource_asset_files')->fetchColumn()!==0)throw new RuntimeException('asset row survived');$base=rtrim(VF_PRIVATE_ROOT,'/\\').'/resource-assets';foreach([$base.'/covers/cover-*',$base.'/html/topic-*'] as $pattern){if(glob($pattern)?:[])throw new RuntimeException('orphan '.$pattern);}if((string)$db->query('PRAGMA integrity_check')->fetchColumn()!=='ok')throw new RuntimeException('integrity');if($db->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC))throw new RuntimeException('fk');echo "P01_BUNDLE_V2_ROLLBACK=PASS\n";
          PHP
          ROOT="$ROOT" php /tmp/p01-bundle-v2-rollback.php | grep -Fx P01_BUNDLE_V2_ROLLBACK=PASS

      - name: Browser successful bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/p01-bundle-v2-browser
          cat >success.mjs <<'JS'
          import { chromium } from 'playwright';
          const base='http://127.0.0.1:18452';const browser=await chromium.launch({headless:true});const ctx=await browser.newContext({viewport:{width:1440,height:900}});const login=await ctx.request.post(base+'/api.php?action=login',{data:{password:'P01BundleGateV2!2026'}});if(!login.ok())throw new Error('login');const p=await ctx.newPage();await p.goto(base+'/topics.php?scope=public',{waitUntil:'networkidle'});await p.locator('script[src*="workspace-create-bundle.js"]').waitFor({state:'attached',timeout:10000});await p.waitForTimeout(500);await p.locator('[data-open-add]').click();const f=p.locator('[data-add-form]');await f.locator('select[name="source_kind"]').selectOption('hosted_html');await f.locator('input[name="title"]').fill('原子成功专题');await f.locator('input[name="resource_kind"]').fill('AI研究');await f.locator('input[name="is_private"]').uncheck();await f.locator('input[name="cover"]').setInputFiles('/tmp/p01-bundle-v2-large.png');await f.locator('input[name="html"]').setInputFiles('/tmp/p01-bundle-v2-valid.html');await f.locator('button[type="submit"]:not([data-add-continue])').click();await p.getByText('原子成功专题',{exact:true}).waitFor({timeout:30000});const card=p.locator('.vf-topic-card').filter({hasText:'原子成功专题'});if(!(await card.count()))throw new Error('card');if(!String(await card.locator('.vf-topic-cover img').getAttribute('src')).includes('resource-cover.php'))throw new Error('cover');await p.screenshot({path:'/tmp/p01-bundle-v2-success.png',fullPage:true});await browser.close();console.log('P01_BUNDLE_V2_BROWSER_SUCCESS=PASS');
          JS
          node success.mjs | grep -Fx P01_BUNDLE_V2_BROWSER_SUCCESS=PASS

      - name: Final database HTTP and regression truth
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/p01-bundle-v2-success.php <<'PHP'
          <?php declare(strict_types=1);$root=getenv('ROOT');require $root.'/app/bootstrap.php';$db=vf_db();$q=$db->prepare("SELECT id FROM links WHERE title='原子成功专题' AND lifecycle_state='active'");$q->execute();$id=(int)$q->fetchColumn();if($id<=0)throw new RuntimeException('link');$p=$db->prepare('SELECT * FROM resource_domain_profiles WHERE link_id=?');$p->execute([$id]);$profile=$p->fetch(PDO::FETCH_ASSOC);if(!$profile||(string)$profile['domain_key']!=='topics'||(string)$profile['source_kind']!=='hosted_html')throw new RuntimeException('profile');$a=$db->prepare('SELECT * FROM resource_asset_files WHERE link_id=?');$a->execute([$id]);$rows=$a->fetchAll(PDO::FETCH_ASSOC);if(count($rows)!==2)throw new RuntimeException('assets');$cover=null;$html=null;foreach($rows as $row){if($row['asset_kind']==='cover')$cover=$row;if($row['asset_kind']==='html')$html=$row;}if(!$cover||!$html)throw new RuntimeException('asset kinds');if((int)$cover['byte_size']>1200*1024||(int)$cover['width']>960||(int)$cover['height']>960)throw new RuntimeException('cover compression');if((string)$db->query('PRAGMA integrity_check')->fetchColumn()!=='ok')throw new RuntimeException('integrity');if($db->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC))throw new RuntimeException('fk');echo "SUCCESS_ID=$id\nP01_BUNDLE_V2_DB=PASS\n";
          PHP
          ROOT="$ROOT" php /tmp/p01-bundle-v2-success.php | tee /tmp/p01-bundle-v2-success.txt
          ID=$(sed -n 's/^SUCCESS_ID=//p' /tmp/p01-bundle-v2-success.txt); test -n "$ID"
          CODE=$(curl -sS -o /tmp/p01-bundle-v2-html.out -w '%{http_code}' "http://127.0.0.1:${PORT}/resource-html.php?id=${ID}"); test "$CODE" = 200
          grep -F ATOMIC_BUNDLE_V2_OK /tmp/p01-bundle-v2-html.out
          grep -F 'POST /workspace-create.php' /tmp/p01-bundle-v2-server.log
          if grep -F 'POST /resource-media.php' /tmp/p01-bundle-v2-server.log; then echo 'unexpected split create media call'; exit 1; fi
          php "$ROOT/cli/verify.php" | grep -Fx VERIFY_PASS=YES
          echo P01_V229_ATOMIC_CREATE_BUNDLE_V2=PASS

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: p01-v229-atomic-create-bundle-v2
          path: |
            /tmp/p01-bundle-v2-rollback.png
            /tmp/p01-bundle-v2-success.png
            /tmp/p01-bundle-v2-server.log
            /tmp/p01-bundle-v2-success.txt
          retention-days: 14
