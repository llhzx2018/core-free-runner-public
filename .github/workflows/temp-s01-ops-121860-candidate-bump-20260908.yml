name: temp-s01-ops-121860-candidate-bump-20260908
on:
  push:
    branches: [temp/s01-page-update-center-v4-20260907]
    paths: [.github/workflows/temp-s01-ops-121860-candidate-bump-20260908.yml]
permissions:
  contents: read
jobs:
  bump:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      REPO: llhzx2018/vf-tools-ops
      BRANCH: work/s01-ops-top-domains-visible-refinement-20260908
      EXPECTED_HEAD: 63ca3d9094ca13d3eead74cf28aa470827b5831d
    steps:
      - name: Exact candidate version bump
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/ops-bump
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/${REPO}.git" /tmp/ops-bump
          cd /tmp/ops-bump
          git checkout -q "$BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(tr -d '\r\n' < VERSION)" = '1.21.859'
          files=(
            VERSION
            includes/admin-v13/views/dashboard.php
            tests/admin-human-language-contract.php
            tests/dashboard-visible-ui-contract.php
            tests/system-components-human-language-contract.php
            tests/update-refresh-policy-current-contract.php
            tests/visible-console-v2-contract.php
            vf-ops.php
          )
          for f in "${files[@]}"; do
            grep -q '1\.21\.859' "$f"
            sed -i 's/1\.21\.859/1.21.860/g' "$f"
            ! grep -q '1\.21\.859' "$f"
          done
          test "$(tr -d '\r\n' < VERSION)" = '1.21.860'
          grep -F 'Version: 1.21.860' vf-ops.php >/dev/null
          grep -F "VF_OPS_VERSION', '1.21.860" vf-ops.php >/dev/null
          mapfile -t changed < <(git diff --name-only | sort)
          mapfile -t expected < <(printf '%s\n' "${files[@]}" | sort)
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected[@]}")"
          php -l vf-ops.php >/dev/null
          php -l includes/admin-v13/views/dashboard.php >/dev/null
          for f in tests/admin-human-language-contract.php tests/dashboard-visible-ui-contract.php tests/system-components-human-language-contract.php tests/update-refresh-policy-current-contract.php tests/visible-console-v2-contract.php; do php -l "$f" >/dev/null; done
          php tests/top-domains-visible-ui-contract.php
          php tests/dashboard-visible-ui-contract.php
          php tests/admin-human-language-contract.php
          php tests/system-components-human-language-contract.php
          php tests/update-refresh-policy-current-contract.php
          php tests/visible-console-v2-contract.php
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add -- "${files[@]}"
          git commit -m 'S01-C02: bump visible top-domain closure to 1.21.860'
          new_head="$(git rev-parse HEAD)"
          git remote set-url origin "https://x-access-token:${WRITE_TOKEN}@github.com/${REPO}.git"
          git push -q origin "HEAD:refs/heads/${BRANCH}"
          test "$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')" = "$new_head"
          echo "NEW_HEAD=$new_head"
          echo 'PASS_S01_C02_121860_CANDIDATE_BUMP'
