name: P02 V2.4.26 Existing Data Upgrade Retry

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v2.4.26-upgrade-retry.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCT_REF: 9c62b0f348958777fdaba251316cd76a867358af
      TEST_PASSWORD: VF-Upgrade-${{ github.run_id }}!
      EXPECTED_UPDATE_BYTES: '299595'
      EXPECTED_UPDATE_SHA256: ccd4b1fbcfdff07feb69caa72c51bc3a3e8fe17e897325aab43cdaefbaac91b8
    steps:
      - name: Require registered read capability
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo REGISTERED_PRIVATE_READ=PASS

      - name: Checkout exact P02 release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.PRODUCT_REF }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: product

      - name: Install runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 php-zip sqlite3 unzip curl >/dev/null

      - name: Rebuild and bind exact UPDATE identity
        working-directory: product
        run: |
          set -Eeuo pipefail
          TREE=$(git show -s --format=%T "$PRODUCT_REF")
          python3 scripts/build-release.py --out build/release --source-commit "$PRODUCT_REF" --source-tree "$TREE" --source-ref release/v2.4.26 >/dev/null
          UPDATE=build/release/VF_Library_V2.4.26_UPDATE.zip
          test "$(stat -c %s "$UPDATE")" = "$EXPECTED_UPDATE_BYTES"
          test "$(sha256sum "$UPDATE" | awk '{print $1}')" = "$EXPECTED_UPDATE_SHA256"
          echo UPDATE_IDENTITY=PASS

      - name: Actual 2.4.25 to 2.4.26 Update Core upgrade
        working-directory: product
        run: |
          set -Eeuo pipefail
          UPDATE="$PWD/build/release/VF_Library_V2.4.26_UPDATE.zip"
          git worktree add --detach "$RUNNER_TEMP/p02-old-src" v2.4.25 >/dev/null
          OLDSITE="$RUNNER_TEMP/p02-old-site"
          bash "$RUNNER_TEMP/p02-old-src/scripts/build-deploy-tree.sh" "$OLDSITE" >/dev/null
          COOKIE="$RUNNER_TEMP/p02-old-cookie"
          php -d display_errors=0 -S 127.0.0.1:18143 -t "$OLDSITE" >"$RUNNER_TEMP/old-server.log" 2>&1 & OLD_PID=$!
          trap 'kill "$OLD_PID" 2>/dev/null || true; git worktree remove --force "$RUNNER_TEMP/p02-old-src" 2>/dev/null || true' EXIT
          for _ in $(seq 1 80); do curl -fsS http://127.0.0.1:18143/setup.php >/dev/null 2>&1 && break; sleep .25; done
          curl -fsS -c "$COOKIE" http://127.0.0.1:18143/setup.php > "$RUNNER_TEMP/setup.html"
          CSRF=$(python3 - "$RUNNER_TEMP/setup.html" <<'PY'
          import html,re,sys
          m=re.search(r'name="setup_csrf" value="([^"]+)"',open(sys.argv[1],encoding='utf-8').read()); assert m
          print(html.unescape(m.group(1)))
          PY
          )
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' -b "$COOKIE" -c "$COOKIE" -H 'Origin: http://127.0.0.1:18143' --data-urlencode "setup_csrf=$CSRF" --data-urlencode "password=$TEST_PASSWORD" --data-urlencode "password_confirm=$TEST_PASSWORD" http://127.0.0.1:18143/setup.php)
          test "$CODE" = 303
          test "$(tr -d '\r\n' < "$OLDSITE/VERSION.txt")" = '2.4.25'

          php -r 'require $argv[1]."/app/bootstrap.php";$d=vftb_db();$n=gmdate("c");$q=$d->prepare("INSERT INTO text_categories(parent_id,name,description,icon,sort_order,created_at,updated_at) VALUES(NULL,?,?,?,?,?,?)");$q->execute(["Upgrade Fixture","formal gate","folder",100,$n,$n]);$c=(int)$d->lastInsertId();$q=$d->prepare("INSERT INTO text_items(category_id,title,description,content,content_mode,content_format,primary_action,status,aliases,tags,created_at,updated_at) VALUES(?,?,?,?,?,?,?,?,?,?,?,?)");$q->execute([$c,"V2425_SENTINEL","formal gate","preserve me","quick","plain","copy","active","[]","[]",$n,$n]);' "$OLDSITE"

          python3 - "$RUNNER_TEMP/update-manifest.json" <<'PY'
          import json,os,sys,datetime
          m={'schema_version':'1.0','project_id':'P02','component_id':'APP','enabled':True,'target_version':'2.4.26','update_type':'ATOMIC','from_versions':['2.4.25'],'schema_from':'2401','schema_to':'2401','repository':'llhzx2018/vf-library','release_tag':'v2.4.26','asset_name':'VF_Library_V2.4.26_UPDATE.zip','asset_bytes':int(os.environ['EXPECTED_UPDATE_BYTES']),'asset_sha256':os.environ['EXPECTED_UPDATE_SHA256'],'backup_required':True,'rollback_supported':True,'released_at':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          json.dump(m,open(sys.argv[1],'w'),indent=2)
          PY

          cat > "$RUNNER_TEMP/run-update.php" <<'PHP'
          <?php
          $site=$argv[1];$package=$argv[2];$manifest=json_decode(file_get_contents($argv[3]),true);
          chdir($site);require $site.'/app/bootstrap.php';
          $core=new \CoreUpdates\UpdateCore('P02','APP');$adapter=new VfLibraryCoreUpdateAdapter();
          $result=$core->upgrade(VFTB_VERSION,(string)VfLibrarySchemaMigration::currentVersion(vftb_db()),$adapter,$package,$manifest);
          if(!in_array($result['status']??'', ['COMMITTED','COMMITTED_WITH_CLEANUP_WARNING'], true)){fwrite(STDERR,json_encode($result,JSON_UNESCAPED_UNICODE|JSON_PRETTY_PRINT));exit(2);}
          if(empty($result['backup_locator'])){fwrite(STDERR,"backup locator missing\n");exit(3);}
          echo json_encode($result,JSON_UNESCAPED_UNICODE|JSON_PRETTY_PRINT),"\n";
          PHP
          php "$RUNNER_TEMP/run-update.php" "$OLDSITE" "$UPDATE" "$RUNNER_TEMP/update-manifest.json"

          test "$(tr -d '\r\n' < "$OLDSITE/VERSION.txt")" = '2.4.26'
          php -r 'require $argv[1]."/app/bootstrap.php";$d=vftb_db();if(VFTB_VERSION!=="2.4.26")exit(2);if(VfLibrarySchemaMigration::currentVersion($d)!==2401)exit(3);if($d->query("SELECT content FROM text_items WHERE title=\"V2425_SENTINEL\"")->fetchColumn()!=="preserve me")exit(4);if($d->query("PRAGMA integrity_check")->fetchColumn()!=="ok")exit(5);if(count($d->query("PRAGMA foreign_key_check")->fetchAll())!==0)exit(6);$n=gmdate("c");$c=(int)$d->query("SELECT id FROM text_categories WHERE name=\"Upgrade Fixture\"")->fetchColumn();$q=$d->prepare("INSERT INTO text_items(category_id,title,description,content,content_mode,content_format,primary_action,status,aliases,tags,created_at,updated_at) VALUES(?,?,?,?,?,?,?,?,?,?,?,?)");$q->execute([$c,"POST_UPGRADE_WRITE","formal gate","write pass","quick","plain","copy","active","[]","[]",$n,$n]);' "$OLDSITE"
          ( cd "$OLDSITE" && php cli/verify.php ) > "$RUNNER_TEMP/verify.json"
          python3 - "$RUNNER_TEMP/verify.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1])); assert x['ok'] is True and int(x['schema_version'])==2401
          PY
          echo EXISTING_DATA_UPDATE_CORE_2_4_25_TO_2_4_26=PASS

      - name: Public-safe evidence
        if: always()
        run: |
          echo P02=VF_Library
          echo SOURCE=2.4.25
          echo TARGET=2.4.26
          echo UPDATE_BYTES=299595
          echo UPDATE_SHA256=ccd4b1fbcfdff07feb69caa72c51bc3a3e8fe17e897325aab43cdaefbaac91b8
          echo PRODUCTION_WRITE=NO
          echo PRIVATE_SOURCE_PERSISTED=NO
