name: S01 Page Body V1 A1 Candidate Gate

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/s01-page-body-v1-a1-gate-20260926.yml'

permissions:
  contents: read

jobs:
  gate:
    if: github.head_ref == 'task/s01-page-body-v1-a1-gate-20260926'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      OPS_SHA: 9d4fb73d1dea8a7d74a555c5cb97cd1581df9046
      THEME_SHA: 8cd063ef5cbf40f762da9b8b982c72b42754ea01
      M3U8_SHA: 52c575d687da769b64cb7b1261467d00ad3d835a
    steps:
      - name: Credential presence
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: test -n "$READ_TOKEN"

      - name: Checkout exact OPS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.OPS_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: ops

      - name: Checkout exact Theme
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: ${{ env.THEME_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: theme

      - name: Checkout exact M3U8
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: ${{ env.M3U8_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: m3u8

      - name: OPS A1 baseline contract
        working-directory: ops
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$OPS_SHA"
          php -l tests/s01-c02-page-body-system-v1-a1-baseline-contract.php
          php tests/s01-c02-page-body-system-v1-a1-baseline-contract.php

      - name: Theme A1 Page Body contract
        working-directory: theme
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$THEME_SHA"
          php -l tests/s01-c01-page-body-system-v1-a1-contract.php
          php tests/s01-c01-page-body-system-v1-a1-contract.php
          php tests/s01-c01-page-visual-closure-r5-contract.php
          grep -Fq 'data-vf-page-archetype="a1"' src/inc/admin/views/tabs/overview.php
          grep -Fq 'vf-theme-s01-page-body-system-v1' src/inc/admin/admin-s01-uiux-polish.php
          ! grep -Eq '\.vf-v6-shell-header|\.vf-v6-domain-nav|\.vf-theme-maintenance-menu|\.vf-theme-admin-header' src/assets/css/admin/admin-s01-page-body-system-v1.css
          test "$(python3 - <<'PY'
          from pathlib import Path
          c=Path('src/assets/css/admin/admin-s01-page-body-system-v1.css').read_text()
          print(int(c.count('{')==c.count('}')))
          PY
          )" = "1"

      - name: M3U8 A1 Page Body contract
        working-directory: m3u8
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$M3U8_SHA"
          php -l tests/s01-c03-page-body-system-v1-a1-contract.php
          php tests/s01-c03-page-body-system-v1-a1-contract.php
          php tests/s01-c03-page-visual-closure-r5-contract.php
          grep -Fq 'data-vf-page-archetype="a1"' src/admin/pages/dashboard.php
          grep -Fq 'vf_tool_m3u8_admin_ui_v4_enqueue_page_body_system_v1' src/admin/ui-v4/admin-ui-assets.php
          ! grep -Eq '\.vf-v6-shell-header|\.vf-v6-domain-nav|\.vf-v6-domain-menu|\.vf-m3u8-console-head|\.vf-m3u8-primary-nav' src/admin/ui-v4/admin-s01-page-body-system-v1.css
          test "$(python3 - <<'PY'
          from pathlib import Path
          c=Path('src/admin/ui-v4/admin-s01-page-body-system-v1.css').read_text()
          print(int(c.count('{')==c.count('}')))
          PY
          )" = "1"

      - name: PHP syntax boundary
        run: |
          set -Eeuo pipefail
          php -l theme/src/inc/admin/views/tabs/overview.php
          php -l theme/src/inc/admin/admin-s01-uiux-polish.php
          php -l m3u8/src/admin/pages/dashboard.php
          php -l m3u8/src/admin/ui-v4/admin-ui-assets.php
