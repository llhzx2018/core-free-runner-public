name: P02 R36 Grid Ownership Diagnosis
on:
  push:
    branches: [run/p02-r36-grid-owner-diagnosis]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact P02 develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 61a46e5d704139ffdf5c1f0f0886a10a02983a9a
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Inventory notebook grid ownership
        working-directory: product
        run: |
          set -Eeuo pipefail
          echo '=== NOTEBOOK GRID TEMPLATE RULES ==='
          grep -RInE 'notebook-layout.*grid-template-columns|grid-template-columns.*notebook' public/assets --include='*.css' --include='*.js' || true
          echo '=== DETAIL GRID PLACEMENT ==='
          grep -RInE 'notebook-detail-scroll.*grid-(column|area)|grid-(column|area).*notebook-detail-scroll' public/assets --include='*.css' --include='*.js' || true
          echo '=== LIST / RESIZER GRID PLACEMENT ==='
          grep -RInE 'notebook-(list-pane|resizer).*grid-(column|area)|grid-(column|area).*notebook-(list-pane|resizer)' public/assets --include='*.css' --include='*.js' || true
          echo '=== NOTEBOOK LIST WIDTH REFERENCES ==='
          grep -RIn 'notebook-list-width' public/assets --include='*.css' --include='*.js' || true
          echo '=== GRID AUTO COLUMNS ==='
          grep -RInE 'grid-auto-columns|grid-auto-flow' public/assets --include='*.css' --include='*.js' || true
          echo '=== NOTEBOOK EDITING RULES ==='
          grep -n 'notebook-editing' public/assets/app.css || true
          echo P02_R36_GRID_OWNER_DIAGNOSIS=PASS
