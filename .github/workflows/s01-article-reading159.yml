name: S01 article reading focused exact Theme
on:
  push:
    branches: [task/s01-article-reading159-20261021]
    paths: ['.github/workflows/s01-article-reading159.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.159
  TARGET_SHA: 6b558d97bc34207d8f75a253a79ec94247a24e01
  TARGET_TREE: 86304fb1234a33379f030ac0a25024027cb7c5d4
  BASE_SHA: d126c8b7b3a142456df2050ded051fa3d3b70e58
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          ref: 02d4591eed025a3d3a67bc0a150b3ddc448c2ab8
          persist-credentials: false
          path: established
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 6b558d97bc34207d8f75a253a79ec94247a24e01
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Prepare bounded harness and exact formal predecessors
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider
          cp -a established/lanes/s01-frontend-design-20261017 lane
          cp control/lanes/s01-article-reading159-20261021/browser.cjs lane/article-reading.cjs
          cp control/lanes/s01-article-reading159-20261021/fixture.php lane/article-fixture.php
          cp control/lanes/s01-article-reading159-20261021/article-body-*.html lane/
          node --check lane/article-reading.cjs
          php -l lane/article-fixture.php
          git -C target diff --name-only "$BASE_SHA" "$TARGET_SHA" -- '*.php' | while IFS= read -r p; do php -l "target/$p"; done
          gh release download v1.25.94 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.94.zip --dir provider
          echo '70b90d40da5d69fc7819bd7ada3f15fb0145e64822b788bd94956c7827b2df03  provider/vf-tools-m3u8_V1.25.94.zip' | sha256sum -c
          gh release download v1.35.158 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.158.zip --dir provider
          echo 'f9866ee9178fef0df40c3bb520fcc422667a306f74d1324f2db6560820d9bafa  provider/vf-tools-theme_V1.35.158.zip' | sha256sum -c
          python3 control/lanes/s01-article-reading159-20261021/package.py
      - name: Chromium and Chinese font
        run: |
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -g -fsSL --retry 2 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC[wght].ttf' -o "$HOME/.local/share/fonts/NotoSansSC.ttf"
          fc-cache -f
      - name: Isolated WP native upgrade focused browser rollback repeat
        run: |
          set -euo pipefail
          python3 - <<'PYLANE'
          from pathlib import Path
          s=Path('lane/native.sh').read_text()
          s=s.replace('provider/vf-tools-m3u8_V1.25.91.zip','provider/vf-tools-m3u8_V1.25.94.zip')
          installer='cli plugin install polylang --version=3.8.10 --activate >/dev/null'
          assert s.count(installer)==1
          s=s.replace(installer,'for attempt in 1 2 3; do '+installer+' && break; test "$attempt" -lt 3 || exit 1; sleep 3; done')
          fixture='docker cp lane/fixture.php "$WP:/var/www/html/wp-content/mu-plugins/progress-fixture.php"'
          assert s.count(fixture)==1
          s=s.replace(fixture,fixture+'\ndocker cp lane/article-fixture.php "$WP:/var/www/html/wp-content/mu-plugins/article-fixture.php"\ndocker cp lane/article-body-en.html "$WP:/var/www/html/wp-content/mu-plugins/article-body-en.html"\ndocker cp lane/article-body-zh.html "$WP:/var/www/html/wp-content/mu-plugins/article-body-zh.html"')
          s=s.replace('node lane/warm-admin.cjs','true')
          marker='if [ "${VF_REVIEW_ONLY_STATE:-0}" = "1" ];then'
          assert s.count(marker)==1
          s=s.split(marker)[0]+"""
          docker cp provider/vf-tools-theme_V1.35.158.zip "$WP:/tmp/theme-old.zip"
          docker cp provider/vf-tools-theme_V1.35.159.zip "$WP:/tmp/theme-new.zip"
          version_check(){ test "$(cli theme get vf-tools-theme --field=version)" = "$1"; test "$(cli plugin get vf-tool-m3u8 --field=version)" = "1.25.94"; echo INSTALLED_VERSION_PASS="$1"; }
          cli theme install /tmp/theme-old.zip --force >/dev/null
          version_check 1.35.158
          node lane/article-reading.cjs baseline
          cli theme install /tmp/theme-new.zip --force >/dev/null
          version_check 1.35.159
          node lane/article-reading.cjs
          cli theme install /tmp/theme-old.zip --force >/dev/null
          version_check 1.35.158
          cli theme install /tmp/theme-new.zip --force >/dev/null
          version_check 1.35.159
          cli theme install /tmp/theme-new.zip --force >/dev/null
          version_check 1.35.159
          cli eval-file /tmp/snapshot.php > proof/state-after.sha256
          cmp proof/state-before.sha256 proof/state-after.sha256
          echo THEME_NATIVE_UPGRADE_ROLLBACK_REPEAT_PROTECTED_STATE_PASS
          """
          Path('lane/article-reading.sh').write_text(s)
          PYLANE
          bash lane/article-reading.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-article-reading-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target provider
