name: P01 V2.29 Hosted Browser Security V3

on:
  push:
    branches:
      - task/p01-v229-hosted-browser-security-v3-20260829

permissions:
  contents: read

env:
  SOURCE_SHA: a6b8d47064ce06fa2cf8b8003ba15e25a83666d2
  ROOT: /tmp/p01-v229-v3
  PORT: '18441'
  ADMIN_PASS: 'P01V3!2026'

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none

      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: source

      - name: Exact source and fresh runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' < source/VERSION)" = '2.29.0'
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find source/src -type f -name '*.php' -print0)
          node --check source/src/assets/workspace.js
          rm -rf "$ROOT" /tmp/p01-v3-* || true;cp -a source/src "$ROOT"
          php -d display_errors=1 -d log_errors=1 -d error_reporting=E_ALL -S "127.0.0.1:${PORT}" -t "$ROOT" >/tmp/p01-v3-server.log 2>&1 &
          COOKIE=/tmp/p01-v3-setup.cookies
          for i in $(seq 1 30); do curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:${PORT}/setup.php" -o /tmp/p01-v3-setup.html && break || sleep 1; done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-v3-setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:${PORT}/setup.php" --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=P01 V3' --data-urlencode "admin_password=$ADMIN_PASS" --data-urlencode "admin_password_confirm=$ADMIN_PASS" -o /tmp/p01-v3-setup-post.html
          php "$ROOT/cli/verify.php" | tee /tmp/p01-v3-verify.txt | grep -Fx VERIFY_PASS=YES
          cat >/tmp/p01-v3-seed.php <<'PHP'
          <?php
          declare(strict_types=1);$root=getenv('ROOT');require $root.'/app/bootstrap.php';require_once $root.'/app/SurfaceRepository.php';$r=new VfRepository(vf_db());$s=new VfSurfaceRepository(vf_db());$pub=$r->createCategory(['name'=>'公开网址','is_private'=>false]);$priv=$r->createCategory(['name'=>'私人网址','is_private'=>true]);$x=$r->saveLink(null,['category_id'=>$priv,'title'=>'专题 远程研究','url'=>'https://remote-v3.example.com','is_private'=>false],'manual');$s->upsertProfile((int)$x['id'],['surface'=>'topics','resource_kind'=>'研究','source_kind'=>'remote_url']);$a=$s->allAssets(true);foreach($a as $v)if((int)$v['id']===(int)$x['id']&&(int)$v['effective_private']!==0)throw new RuntimeException('effective');echo "P01_V3_SEED=PASS\n";
          PHP
          ROOT="$ROOT" php /tmp/p01-v3-seed.php | grep -Fx P01_V3_SEED=PASS
          echo P01_V3_FRESH=PASS

      - name: Browser hosted cover sandbox and mobile
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os,struct,zlib
          w,h=1600,1000;raw=bytearray()
          for _ in range(h):raw.extend(b'\x00'+os.urandom(w*3))
          def chunk(t,d):return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
          png=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(bytes(raw),6))+chunk(b'IEND',b'');open('/tmp/p01-v3-large.png','wb').write(png);print(len(png))
          PY
          cat >/tmp/p01-v3-public.html <<'HTML'
          <!doctype html><meta charset="utf-8"><h1>HOSTED_V3_MARKER</h1><script>document.body.dataset.ran='yes';try{localStorage.setItem('x','1');document.body.dataset.storage='allowed'}catch(e){document.body.dataset.storage='blocked'};fetch('/api.php?action=health').then(()=>document.body.dataset.fetch='allowed').catch(()=>document.body.dataset.fetch='blocked');</script>
          HTML
          cat >/tmp/p01-v3-private.html <<'HTML'
          <!doctype html><meta charset="utf-8"><h1>PRIVATE_V3_MARKER</h1>
          HTML
          mkdir -p /tmp/p01-v3-browser && cd /tmp/p01-v3-browser;npm init -y >/dev/null 2>&1;npm install playwright@1.55.0 --no-save >/dev/null 2>&1;npx playwright install chromium >/dev/null 2>&1
          cat >gate.mjs <<'JS'
          import { chromium } from 'playwright';
          const base='http://127.0.0.1:18441',browser=await chromium.launch({headless:true}),ctx=await browser.newContext({viewport:{width:1440,height:900}});const login=await ctx.request.post(base+'/api.php?action=login',{data:{password:'P01V3!2026'}});if(!login.ok())throw new Error('login');const p=await ctx.newPage();
          await p.goto(base+'/topics.php?scope=public',{waitUntil:'networkidle'});if(await p.getByText('专题 远程研究',{exact:true}).count()<1)throw new Error('public scope');await p.locator('[data-open-add]').click();let f=p.locator('[data-add-form]');await f.locator('select[name="source_kind"]').selectOption('hosted_html');if(await f.locator('[data-url-field]').isVisible()||!(await f.locator('[data-html-field]').isVisible()))throw new Error('source visibility');await f.locator('input[name="title"]').fill('专题 托管公开');await f.locator('input[name="resource_kind"]').fill('AI学习');await f.locator('input[name="is_private"]').uncheck();await f.locator('input[name="cover"]').setInputFiles('/tmp/p01-v3-large.png');await f.locator('input[name="html"]').setInputFiles('/tmp/p01-v3-public.html');await f.locator('button[type="submit"]:not([data-add-continue])').click();await p.getByText('专题 托管公开',{exact:true}).waitFor({timeout:15000});
          const card=p.locator('.vf-topic-card').filter({hasText:'专题 托管公开'}),id=await card.getAttribute('data-asset-row');if(!id||!String(await card.locator('.vf-topic-cover img').getAttribute('src')).includes('resource-cover.php'))throw new Error('card cover');await card.locator('[data-edit-id]').first().click();const d=p.locator('[data-detail-form]');if(await d.locator('select[name="source_kind"]').inputValue()!=='hosted_html'||await d.locator('[data-url-field]').isVisible())throw new Error('detail source');if(!(await d.locator('[data-html-status]').textContent()).includes('p01-v3-public.html'))throw new Error('detail html');await p.screenshot({path:'/tmp/p01-v229-v3-topics.png',fullPage:true});await p.locator('[data-panel="detail"] [data-close-panel]').click();
          const hp=await ctx.newPage();await hp.goto(base+'/resource-html.php?id='+id,{waitUntil:'load'});await hp.getByText('HOSTED_V3_MARKER',{exact:true}).waitFor();await hp.waitForTimeout(250);if(await hp.locator('body').getAttribute('data-ran')!=='yes')throw new Error('script');if(await hp.locator('body').getAttribute('data-storage')!=='blocked')throw new Error('storage');if(await hp.locator('body').getAttribute('data-fetch')!=='blocked')throw new Error('fetch');await hp.screenshot({path:'/tmp/p01-v229-v3-hosted.png'});await hp.close();
          await p.goto(base+'/topics.php',{waitUntil:'networkidle'});await p.locator('[data-open-add]').click();f=p.locator('[data-add-form]');await f.locator('select[name="source_kind"]').selectOption('hosted_html');await f.locator('input[name="title"]').fill('专题 托管私人');await f.locator('input[name="resource_kind"]').fill('私人');await f.locator('input[name="html"]').setInputFiles('/tmp/p01-v3-private.html');await f.locator('button[type="submit"]:not([data-add-continue])').click();await p.getByText('专题 托管私人',{exact:true}).waitFor({timeout:15000});
          await p.setViewportSize({width:390,height:844});await p.goto(base+'/topics.php?scope=public',{waitUntil:'networkidle'});await p.locator('[data-open-add]').click();f=p.locator('[data-add-form]');await f.locator('select[name="source_kind"]').selectOption('hosted_html');if(await f.locator('[data-url-field]').isVisible()||!(await f.locator('[data-html-field]').isVisible()))throw new Error('mobile fields');const overflow=await p.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);if(overflow>1)throw new Error('overflow '+overflow);await p.screenshot({path:'/tmp/p01-v229-v3-mobile.png',fullPage:true});await browser.close();console.log('P01_V3_BROWSER=PASS');
          JS
          node gate.mjs | grep -Fx P01_V3_BROWSER=PASS

      - name: Storage and security verification
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/p01-v3-db.php <<'PHP'
          <?php
          declare(strict_types=1);$root=getenv('ROOT');require $root.'/app/bootstrap.php';$db=vf_db();$pub=$db->query("SELECT l.id,p.source_kind,p.source_ref FROM links l JOIN resource_domain_profiles p ON p.link_id=l.id WHERE l.title='专题 托管公开'")->fetch(PDO::FETCH_ASSOC);$priv=$db->query("SELECT l.id FROM links l JOIN resource_domain_profiles p ON p.link_id=l.id WHERE l.title='专题 托管私人' AND p.source_kind='hosted_html'")->fetch(PDO::FETCH_ASSOC);if(!$pub||!$priv||$pub['source_kind']!=='hosted_html'||$pub['source_ref']!=='p01-v3-public.html')throw new RuntimeException('profile');$c=$db->query("SELECT r.* FROM resource_asset_files r JOIN links l ON l.id=r.link_id WHERE l.title='专题 托管公开' AND r.asset_kind='cover'")->fetch(PDO::FETCH_ASSOC);if(!$c||(int)$c['byte_size']>1200*1024||(int)$c['width']>960||(int)$c['height']>960||!in_array($c['mime_type'],['image/webp','image/jpeg'],true))throw new RuntimeException('cover');$h=$db->query("SELECT r.* FROM resource_asset_files r JOIN links l ON l.id=r.link_id WHERE l.title='专题 托管公开' AND r.asset_kind='html'")->fetch(PDO::FETCH_ASSOC);if(!$h||$h['original_name']!=='p01-v3-public.html'||(int)$h['byte_size']>2*1024*1024)throw new RuntimeException('html');$path='';foreach($db->query('PRAGMA database_list')->fetchAll(PDO::FETCH_ASSOC) as $x)if($x['name']==='main')$path=$x['file'];if($path===''||str_contains((string)file_get_contents($path),'HOSTED_V3_MARKER'))throw new RuntimeException('raw html');if((string)$db->query('PRAGMA integrity_check')->fetchColumn()!=='ok'||$db->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC))throw new RuntimeException('db');file_put_contents('/tmp/p01-v3-ids.json',json_encode(['pub'=>(int)$pub['id'],'priv'=>(int)$priv['id']]));echo "P01_V3_DB=PASS\n";
          PHP
          ROOT="$ROOT" php /tmp/p01-v3-db.php | grep -Fx P01_V3_DB=PASS
          PUB=$(jq -r '.pub' /tmp/p01-v3-ids.json);PRIV=$(jq -r '.priv' /tmp/p01-v3-ids.json);CODE=$(curl -sS -D /tmp/p01-v3-hosted.headers -o /tmp/p01-v3-hosted.html -w '%{http_code}' "http://127.0.0.1:${PORT}/resource-html.php?id=${PUB}");test "$CODE" = 200;grep -F HOSTED_V3_MARKER /tmp/p01-v3-hosted.html;CSP=$(grep -i '^Content-Security-Policy:' /tmp/p01-v3-hosted.headers);grep -F 'sandbox allow-scripts' <<<"$CSP";grep -F "connect-src 'none'" <<<"$CSP";grep -F "form-action 'none'" <<<"$CSP";! grep -Fq 'allow-same-origin' <<<"$CSP";CODE=$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:${PORT}/resource-html.php?id=${PRIV}");test "$CODE" = 404
          COOKIE=/tmp/p01-v3-admin.cookies;LOGIN=$(curl -fsS -c "$COOKIE" -b "$COOKIE" -H 'Content-Type: application/json' -X POST "http://127.0.0.1:${PORT}/api.php?action=login" --data "{\"password\":\"$ADMIN_PASS\"}");CSRF=$(jq -r '.csrf' <<<"$LOGIN");CODE=$(curl -sS -D /tmp/p01-v3-open.headers -o /dev/null -w '%{http_code}' -b "$COOKIE" "http://127.0.0.1:${PORT}/surface-open.php?id=${PUB}");test "$CODE" = 302;grep -Fi "Location: resource-html.php?id=${PUB}" /tmp/p01-v3-open.headers
          python3 - <<'PY'
          open('/tmp/p01-v3-big.html','wb').write(b'<html>'+b'x'*(2*1024*1024+100)+b'</html>')
          PY
          CODE=$(curl -sS -o /tmp/p01-v3-big.json -w '%{http_code}' -b "$COOKIE" -X POST "http://127.0.0.1:${PORT}/resource-media.php" -F "csrf=$CSRF" -F 'action=html_upload' -F "id=$PUB" -F 'html=@/tmp/p01-v3-big.html;type=text/html');test "$CODE" = 422;jq -e '.ok==false and (.error|contains("2 MB"))' /tmp/p01-v3-big.json >/dev/null
          php "$ROOT/cli/verify.php" | tee /tmp/p01-v3-verify-end.txt | grep -Fx VERIFY_PASS=YES
          echo P01_V3_SECURITY=PASS

      - name: Verdict
        shell: bash
        run: |
          echo "SOURCE_SHA=$SOURCE_SHA"
          echo 'CORE_GATE_RUN=33204133400'
          echo 'BROWSER_SECURITY=PASS'
          echo 'HOSTED_HTML_SANDBOX=PASS'
          echo 'COVER_COMPRESSION=PASS'
          echo 'MOBILE=PASS'
          echo 'VERIFY_PASS=YES'
          echo 'P01_V229_FINAL_EVIDENCE=PASS'

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: p01-v229-final-evidence-v3
          path: |
            /tmp/p01-v229-v3-topics.png
            /tmp/p01-v229-v3-hosted.png
            /tmp/p01-v229-v3-mobile.png
            /tmp/p01-v3-hosted.headers
            /tmp/p01-v3-verify.txt
            /tmp/p01-v3-verify-end.txt
          retention-days: 30
