name: TEMP P07-M05 Fixed Root Guard Exact Source
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p07-m05-fixed-root-guard-20261125.yml'
permissions:
  contents: read
concurrency:
  group: temp-p07-m05-fixed-root-guard-20261125-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  fixed-root-guard:
    if: >-
      github.actor == 'llhzx2018' &&
      github.triggering_actor == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact private P07 source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-server-ops
          ref: b4b8f193544475df2e9fcbaa02c1159b332209f6
          path: transient-private-source
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact private source and tree
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          [[ "$(git -C transient-private-source rev-parse HEAD)" == 'b4b8f193544475df2e9fcbaa02c1159b332209f6' ]]
          [[ "$(git -C transient-private-source rev-parse HEAD^{tree})" == '67ff29bfa8ac65448cf038ab03e686f20e854208' ]]
          echo P07_M05_EXACT_SOURCE=PASS
      - name: Run actual installed-root and host refusal regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          export PYTHONDONTWRITEBYTECODE=1
          cd transient-private-source
          for test in test_p07_m05_installed_root_guard.py test_p07_m05_dirty_host_guard.py test_p07_m05_isolated_module.py; do
            report="${RUNNER_TEMP}/${test}.log"
            if ! python3 -B -m unittest discover -s tests -p "$test" -q >"$report" 2>&1; then
              echo "P07_M05_TARGETED_TEST=FAIL:${test}"
              grep -E "^(FAIL|ERROR): test_[A-Za-z0-9_]+ \\(" "$report" | head -12 || true
              exit 1
            fi
            grep -E '^Ran [0-9]+ tests?' "$report" || true
            echo "P07_M05_TARGETED_TEST=PASS:${test}"
          done
      - name: Build and verify current changed-source module ZIP identity
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          export PYTHONDONTWRITEBYTECODE=1
          cd transient-private-source
          output="${RUNNER_TEMP}/p07-m05-fixed-root-20261125.zip"
          python3 -B scripts/build_p07_m05_bundle.py --output "$output" > "${RUNNER_TEMP}/m05-bundle.json"
          python3 -B - "$output" <<'PY'
          import hashlib, pathlib, sys, zipfile
          archive=pathlib.Path(sys.argv[1])
          with zipfile.ZipFile(archive) as z:
              names=set(z.namelist())
              assert 'p07-m05/lib/m05_installed_p07_guard.py' in names
              assert 'p07-m05/lib/m05_environment_guard.py' in names
              assert len(names)==len(z.infolist())
          print('P07_M05_NEW_GUARD_IN_EXACT_BUNDLE=PASS')
          print('P07_M05_CANDIDATE_SHA256='+hashlib.sha256(archive.read_bytes()).hexdigest())
          PY
      - name: Remove transient private checkout and temporary reports
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          rm -rf -- "$GITHUB_WORKSPACE/transient-private-source"
          rm -f -- "$RUNNER_TEMP"/test_p07_m05_*.py.log "$RUNNER_TEMP"/m05-bundle.json "$RUNNER_TEMP"/p07-m05-fixed-root-20261125.zip
          test ! -e "$GITHUB_WORKSPACE/transient-private-source"
          echo P07_M05_TRANSIENT_PRIVATE_CHECKOUT_CLEANUP=PASS
