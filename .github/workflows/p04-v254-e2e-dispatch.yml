name: P04 V2.5.4 E2E Dispatch

on:
  push:
    paths:
      - '.github/workflows/p04-v254-e2e-dispatch.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch full browser E2E
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run p04-v254-full-backend-e2e.yml --repo llhzx2018/core-free-runner-public
