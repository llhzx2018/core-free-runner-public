name: P04 V2.5.4 Hygiene Fix

on:
  push:
    paths:
      - '.github/workflows/p04-v254-hygiene-fix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: maintenance/p04-v2.5.4-full-backend-ui-20260816
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
      - name: Trim docs and stabilize derived history timestamp
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in [
            'docs/ua-ui/V254_DESIGN_SYSTEM.md',
            'docs/ua-ui/V254_FULL_BACKEND_UA_UI_AUDIT.md',
            'docs/ua-ui/V254_UA_UI_ACCEPTANCE_MATRIX.md',
          ]:
            p=Path(name); lines=p.read_text(encoding='utf-8').splitlines()
            p.write_text('\n'.join(line.rstrip() for line in lines)+'\n',encoding='utf-8')
          p=Path('src/app/Core/Update/UpdateHistoryService.php')
          s=p.read_text(encoding='utf-8')
          old="""                'completed_at' => $finalResult === 'success'\n                    ? (string) ($latest['completed_at'] ?: \\Support::now())\n                    : (string) ($latest['completed_at'] ?? ''),"""
          new="""                'completed_at' => $finalResult === 'success'\n                    ? (string) (($latest['completed_at'] ?? '') ?: ($latest['started_at'] ?? ''))\n                    : (string) ($latest['completed_at'] ?? ''),"""
          if s.count(old)!=1: raise SystemExit('history timestamp sentinel mismatch')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          php -l src/app/Core/Update/UpdateHistoryService.php
          git diff --check
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add docs/ua-ui src/app/Core/Update/UpdateHistoryService.php
          git commit -m 'chore(P04): stabilize V2.5.4 audit and history evidence'
          git push origin HEAD:maintenance/p04-v2.5.4-full-backend-ui-20260816
