name: P01 V2.36.0 Main Promotion Readiness
on:
  push:
    branches: [temp/p01-v2360-release-gate-20260901]
    paths: [.github/workflows/p01-v2360-main-promotion-readiness-20260901.yml]
permissions:
  contents: read
  actions: read
jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FORMAL_SOURCE: 225780b1ed56bbcc8e62ba465b1129e1c22ee60a
      FORMAL_TREE: 8af6d8ea6168fae52988cae8272a19073a0a7a2e
      FORMAL_RUNTIME_TREE: ad3f96345ead330adffb20c7ecb3cdf6537036b6
      EXPECTED_MAIN: 3a60430c3c74688f2db81f2fd08e7e8ecd986fc9
      CANDIDATE_RUN: '33420047480'
      FORMAL_RUN: '33420558251'
      STRICT_RUN: '33420751341'
      SCHEMA: '2026082901'
    steps:
      - name: Checkout exact formal source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.FORMAL_SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01
      - name: Read-only main promotion readiness
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          for run in "$CANDIDATE_RUN" "$FORMAL_RUN" "$STRICT_RUN"; do test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$run --jq .conclusion)" = success; done
          cd p01
          test "$(git rev-parse HEAD)" = "$FORMAL_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$FORMAL_TREE"
          test "$(git rev-parse HEAD:src)" = "$FORMAL_RUNTIME_TREE"
          MAIN=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          DEVELOP=$(git ls-remote origin refs/heads/develop | awk '{print $1}')
          test "$MAIN" = "$EXPECTED_MAIN"
          test "$DEVELOP" = "$FORMAL_SOURCE"
          if git ls-remote --exit-code --tags origin refs/tags/v2.36.0 >/dev/null 2>&1; then echo UNEXPECTED_V2360_TAG; exit 20; fi
          git fetch origin "$EXPECTED_MAIN" --quiet
          git merge-base --is-ancestor "$EXPECTED_MAIN" "$FORMAL_SOURCE"
          test "$(cat VERSION)" = 2.36.0
          test "$(cat src/VERSION.txt)" = 2.36.0
          grep -Fx "define('VF_VERSION', '2.36.0');" src/app/bootstrap.php >/dev/null
          test "$(jq -r .schema_version VF_PROJECT.json)" = "$SCHEMA"
          test "$(jq -r .production_version VF_PROJECT.json)" = 2.35.3
          test "$(jq -r .candidate_state VF_PROJECT.json)" = PASS
          test "$(jq -r .v2_36_0_candidate_gate.result VF_PROJECT.json)" = PASS
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN"
          printf 'P01_V2360_MAIN_PROMOTION_READINESS=PASS\nFORMAL=%s\nMAIN_CURRENT=%s\nDEVELOP=%s\nCANDIDATE_RUN=%s\nFORMAL_RUN=%s\nSTRICT_FRESH_RUN=%s\nTAG_V2360=ABSENT\nMAIN_WRITE=NO\nOWNER_PRODUCTION_WRITE=NO\n' "$FORMAL_SOURCE" "$MAIN" "$DEVELOP" "$CANDIDATE_RUN" "$FORMAL_RUN" "$STRICT_RUN" | tee /tmp/p01-v2360-main-readiness.txt
      - name: Upload readiness evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2360-main-readiness-${{ github.run_id }}
          path: /tmp/p01-v2360-main-readiness.txt
          if-no-files-found: error
          retention-days: 90
