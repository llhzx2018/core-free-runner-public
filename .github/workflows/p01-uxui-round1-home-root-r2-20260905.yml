name: P01 UXUI Round1 Home Root R2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p01-uxui-round1-home-root-r2-20260905.yml

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_SHA: 413ab5b7fc03eff3d4a167423dd4766f6bd7f36d
      BASE_SHA: a3220a14ce6ccf14d52ca77977761e715c39fcfa
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: feature/p01-uxui-round1-home-root-shell-20260905
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Exact source and no-release boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(cat VERSION)" = '2.46.3'
          test "$(cat src/VERSION.txt)" = '2.46.3'
          changed="$(git diff --name-only "$BASE_SHA"..HEAD | sort)"
          printf '%s\n' "$changed"
          printf '%s\n' "$changed" | grep -Fxq 'docs/authority/P01_UXUI_RECONSTRUCTION_ROUND_PLAN_20260905.md'
          printf '%s\n' "$changed" | grep -Fxq 'src/index.php'
          printf '%s\n' "$changed" | grep -Fxq 'src/start.php'
          printf '%s\n' "$changed" | grep -Fxq 'src/assets/uxui-home-root.css'
          printf '%s\n' "$changed" | grep -Fxq 'tests/unit/uxui_round1_home_root_contract.php'
          test "$(printf '%s\n' "$changed" | wc -l)" -eq 5
          ! printf '%s\n' "$changed" | grep -Eq '(^VERSION$|^src/VERSION.txt$|^src/migrations/|^src/app/bootstrap.php$)'

      - name: Syntax and permanent contract
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l src/index.php
          php -l src/start.php
          php -l tests/unit/uxui_round1_home_root_contract.php
          php tests/unit/uxui_round1_home_root_contract.php
          find src -name '*.php' -type f -print0 | xargs -0 -n1 php -l >/dev/null

      - name: Relevant regression contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in \
            tests/unit/workspace_view_catalog_contract.php \
            tests/unit/public_global_nav_contract.php \
            tests/unit/home_command_center_contract.php \
            tests/unit/home_recent_use_contract.php \
            tests/unit/consolidated_product_model_contract.php; do
            if [ -f "$f" ]; then php "$f"; fi
          done
          echo P01_UXUI_ROUND1_HOME_ROOT=PASS
