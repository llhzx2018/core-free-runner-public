name: P01 V2.28 Main Promotion Gate
on:
  push:
    branches: [task/p01-v2280-main-promotion-gate-20260829]
    paths:
      - .github/workflows/p01-v2280-main-promotion-gate-20260829.yml
permissions:
  contents: read
jobs:
  promotion:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FORMAL: e010d484c8879737503a02612d0ba8cff1d2fd7d
      FORMAL_TREE: abb37ea592231a0076b96a5222fbd2e3d34a74cf
      BASE: 803a14f16846965d61ea0c1b69014468f7e00275
      PR: '47'
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: main
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: main
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: e010d484c8879737503a02612d0ba8cff1d2fd7d
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: formal
      - name: Exact Promotion Gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C main rev-parse HEAD)" = "$BASE"
          test "$(git -C formal rev-parse HEAD)" = "$FORMAL"
          test "$(git -C formal rev-parse HEAD^{tree})" = "$FORMAL_TREE"
          test "$(git -C formal merge-base "$BASE" "$FORMAL")" = "$BASE"
          test "$(tr -d '\r\n' < formal/VERSION)" = '2.28.0'
          test "$(tr -d '\r\n' < formal/src/VERSION.txt)" = '2.28.0'
          grep -Fx "define('VF_VERSION', '2.28.0');" formal/src/app/bootstrap.php >/dev/null
          grep -F '## V2.28.0 · Formal Release · 2026-08-29' formal/CHANGELOG.md >/dev/null
          PRJSON=$(gh api "repos/llhzx2018/vf-start/pulls/$PR")
          test "$(jq -r .state <<<"$PRJSON")" = open
          test "$(jq -r .base.ref <<<"$PRJSON")" = main
          test "$(jq -r .base.sha <<<"$PRJSON")" = "$BASE"
          test "$(jq -r .head.sha <<<"$PRJSON")" = "$FORMAL"
          test "$(jq -r .draft <<<"$PRJSON")" = false
          for i in $(seq 1 10); do
            PRJSON=$(gh api "repos/llhzx2018/vf-start/pulls/$PR")
            M=$(jq -r '.mergeable // "null"' <<<"$PRJSON")
            test "$M" != null && break
            sleep 2
          done
          test "$(jq -r .mergeable <<<"$PRJSON")" = true
          RUN=$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33190868178)
          test "$(jq -r .status <<<"$RUN")" = completed
          test "$(jq -r .conclusion <<<"$RUN")" = success
          ART=$(gh api repos/llhzx2018/core-free-runner-public/actions/artifacts/9693689203)
          test "$(jq -r .name <<<"$ART")" = 'p01-v228-formal-artifacts-e010d484c8879737503a02612d0ba8cff1d2fd7d'
          test "$(jq -r .expired <<<"$ART")" = false
          test "$(jq -r .digest <<<"$ART")" = 'sha256:2c7c7c950f1347c907aebeb7b26d8c4b849dce9304a850a3bdfd1b65fad86e6a'
          test "$(jq -r .size_in_bytes <<<"$ART")" = '4304988'
          if gh api repos/llhzx2018/vf-start/git/ref/tags/v2.28.0 >/dev/null 2>&1; then echo 'v2.28.0 tag unexpectedly exists'; exit 1; fi
          if gh api repos/llhzx2018/vf-start/releases/tags/v2.28.0 >/dev/null 2>&1; then echo 'v2.28.0 release unexpectedly exists'; exit 1; fi
          echo P01_V228_PROMOTION_PR_EXACT=PASS
          echo P01_V228_FORMAL_EVIDENCE_BOUND=PASS
          echo P01_V228_READY_TO_MERGE_MAIN=YES
          echo RELEASE_PUBLISHED=NO
          echo PRODUCTION_WRITE=NO
