name: P01 V2.28 Main Promotion Gate
on:
  push:
    branches: [task/p01-v2280-main-promotion-gate-20260829]
    paths:
      - .github/workflows/p01-v2280-main-promotion-gate-20260829.yml
permissions:
  contents: read
  actions: read
jobs:
  promotion:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FORMAL: e010d484c8879737503a02612d0ba8cff1d2fd7d
      FORMAL_TREE: abb37ea592231a0076b96a5222fbd2e3d34a74cf
      BASE: 803a14f16846965d61ea0c1b69014468f7e00275
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: main
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: main
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: e010d484c8879737503a02612d0ba8cff1d2fd7d
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: formal
      - name: Download exact proven Formal Artifact
        uses: actions/download-artifact@v4
        with:
          name: p01-v228-formal-artifacts-e010d484c8879737503a02612d0ba8cff1d2fd7d
          path: /tmp/p01-v228-promotion-evidence
          github-token: ${{ github.token }}
          repository: llhzx2018/core-free-runner-public
          run-id: 33190868178
      - name: Exact Promotion Machine Gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C main rev-parse HEAD)" = "$BASE"
          test "$(git -C formal rev-parse HEAD)" = "$FORMAL"
          test "$(git -C formal rev-parse HEAD^{tree})" = "$FORMAL_TREE"
          test "$(git -C formal merge-base "$BASE" "$FORMAL")" = "$BASE"
          test "$(tr -d '\r\n' < formal/VERSION)" = '2.28.0'
          test "$(tr -d '\r\n' < formal/src/VERSION.txt)" = '2.28.0'
          grep -Fx "define('VF_VERSION', '2.28.0');" formal/src/app/bootstrap.php >/dev/null
          grep -F '## V2.28.0 · Formal Release · 2026-08-29' formal/CHANGELOG.md >/dev/null
          E=/tmp/p01-v228-promotion-evidence
          test "$(find "$E" -maxdepth 1 -type f | wc -l)" = 8
          test "$(stat -c%s "$E/VF-Start-V2.28.0-FULL.zip")" = 579671
          test "$(sha256sum "$E/VF-Start-V2.28.0-FULL.zip" | awk '{print $1}')" = a00d72884b69d22affb33c9022829dbf9747849c5befad60d9b39f35609812b1
          test "$(stat -c%s "$E/VF_Start_V2.28.0_UPDATE.zip")" = 1255387
          test "$(sha256sum "$E/VF_Start_V2.28.0_UPDATE.zip" | awk '{print $1}')" = 7a8f8ad9417edd6305494f1228b7953791b91afd539b31d9bac16490f089581f
          cmp -s "$E/VF_Start_V2.28.0_UPDATE.zip" "$E/VF-Start-V2.28.0-UPDATE.zip"
          unzip -Z1 "$E/VF_Start_V2.28.0_UPDATE.zip" | grep -Fx repair-v2.28.0.php >/dev/null
          php -l "$E/repair-v2.28.0.php" >/dev/null
          jq -e '.release_source=="e010d484c8879737503a02612d0ba8cff1d2fd7d" and .release_tree=="abb37ea592231a0076b96a5222fbd2e3d34a74cf" and .formal_artifact_gate=="PASS" and .actual_upgrade=="PASS" and .rollback=="PASS" and .interruption_recovery=="PASS" and .fresh_install_ui=="PASS" and .release_published==false' "$E/P01-V2.28.0-FORMAL-METADATA.json" >/dev/null
          (cd "$E" && sha256sum -c SHA256SUMS.txt)
          echo P01_V228_PROMOTION_GIT_EXACT=PASS
          echo P01_V228_FORMAL_EVIDENCE_BYTES=PASS
          echo P01_V228_READY_TO_MERGE_MAIN=YES
          echo RELEASE_PUBLISHED=NO
          echo PRODUCTION_WRITE=NO
