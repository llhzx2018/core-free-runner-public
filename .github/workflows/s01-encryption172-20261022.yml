name: S01 encryption support exact WordPress validation
on:
  push:
    branches: [task/s01-encryption172-20261022]
    paths: ['.github/workflows/s01-encryption172-20261022.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.172
  TARGET_SHA: a8080a14e4f46d02709fbc747e32c35527db792e
  TARGET_TREE: 624db80065e9a5d6b3547faea741ee6ff61cca6c
  BASE_SHA: 901bf21866254912c6814df4b918f9641911570f
  SOURCE_VERSION: 1.35.171
  LANE_ID: s01-encryption172-20261022
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          ref: 02d4591eed025a3d3a67bc0a150b3ddc448c2ab8
          persist-credentials: false
          path: established
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: a8080a14e4f46d02709fbc747e32c35527db792e
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact package, old failure and bilingual guidance regression
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider baseline
          python3 control/lanes/s01-encryption172-20261022/package.py
          git -C target archive "$BASE_SHA" src | tar -x -C baseline
          for file in target/src/inc/seo-flow/*.php target/src/inc/modules/module-cta.php target/src/inc/modules/module-related-tools.php target/src/inc/runtime-constants.php target/tests/encryption-support-content-contract.php; do php -l "$file"; done
          for lang in en zh; do
            VF_TEST_THEME_ROOT="$PWD/baseline/src" VF_EXPECT_BASELINE_BUG=1 php target/tests/encryption-support-content-contract.php "$lang"
            php target/tests/encryption-support-content-contract.php "$lang"
            VF_TEST_TARGET_MISSING=1 php target/tests/encryption-support-content-contract.php "$lang"
            VF_TEST_THEME_ROOT="$PWD/baseline/src" php target/tests/encryption-support-content-contract.php "$lang" --snapshot > "proof/before-guidance-$lang.json"
            php target/tests/encryption-support-content-contract.php "$lang" --snapshot > "proof/after-guidance-$lang.json"
          done
          python3 - <<'PYCOMPARE'
          import json,pathlib
          for lang in ['en','zh']:
              before=json.loads(pathlib.Path('proof/before-guidance-'+lang+'.json').read_text())
              after=json.loads(pathlib.Path('proof/after-guidance-'+lang+'.json').read_text())
              assert before.keys()==after.keys() and len(before)==11
              changed=[k for k in before if before[k]!=after[k]]
              assert changed==['m3u8-encryption-detector'],changed
          print('OTHER_TEN_TOOL_GUIDANCE_SELECTIONS_BILINGUAL_BYTE_EQUIVALENT_PASS')
          PYCOMPARE
          gh release download v1.35.171 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.171.zip --dir provider
          echo '31dae5e044b0e4c9d2c04e17b43b396db3a75913012d7c60bd807700c5010fab  provider/vf-tools-theme_V1.35.171.zip' | sha256sum -c
          gh release download v1.25.94 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.94.zip --dir provider
          echo '70b90d40da5d69fc7819bd7ada3f15fb0145e64822b788bd94956c7827b2df03  provider/vf-tools-m3u8_V1.25.94.zip' | sha256sum -c
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          node --check control/lanes/s01-encryption172-20261022/browser.cjs
          mkdir -p "$HOME/.local/share/fonts"
          curl -g -fsSL --retry 2 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC[wght].ttf' -o "$HOME/.local/share/fonts/NotoSansSC.ttf"
          fc-cache -f
      - name: Real WordPress clean package, guidance, rollback and data protection
        run: |
          set -euo pipefail
          cp -a established/lanes/s01-frontend-design-20261017 lane
          cp control/lanes/s01-encryption172-20261022/clean.cjs lane/warm-admin.cjs
          bash control/lanes/s01-encryption172-20261022/native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-encryption-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target baseline provider
