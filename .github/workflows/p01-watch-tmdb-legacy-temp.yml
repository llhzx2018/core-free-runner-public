name: p01-watch-tmdb-legacy-bookmark-parity
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-watch-tmdb-legacy-temp.yml'
      - 'specs/p01_watch_tmdb_legacy_parity.json'
      - 'templates/p01_watch_tmdb_legacy.yml.in'
permissions:
  contents: read
jobs:
  exact-parity:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WORK: /tmp/p01-watch-tmdb-legacy-${{ github.run_id }}
      TARGET_REPO: llhzx2018/vf-start
      TARGET_VERSION: 2.47.504
      TARGET_SHA: b25f5697f1539cb5ea145fbbf0b0940a9fea8908
      TARGET_TREE: 2735ceef6153271345d752b31bf7c70004b76710
      HEAD_BRANCH: feat/p01-cross-subsite-legacy-watch-tmdb-parity
      BASE_SHA: 465890414fa9981af3ac8797c65f84f75db0d946
    steps:
      - name: Checkout trusted Public Runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact machine source identity before test
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$WORK"
          python3 scripts/ephemeral_lane_spec.py validate --spec specs/p01_watch_tmdb_legacy_parity.json > /dev/null
          python3 scripts/ephemeral_lane_spec.py audit-rendered --spec specs/p01_watch_tmdb_legacy_parity.json --input .github/workflows/p01-watch-tmdb-legacy-temp.yml
          python3 scripts/ephemeral_lane_spec.py render --spec specs/p01_watch_tmdb_legacy_parity.json --template templates/p01_watch_tmdb_legacy.yml.in --output "$WORK/rendered.yml"
          cmp "$WORK/rendered.yml" .github/workflows/p01-watch-tmdb-legacy-temp.yml
          echo P01_WATCH_TMDB_LANE_IDENTITY=PASS
      - name: Verify transient private candidate and bounded three-file delta
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          test -n "$READ_TOKEN"
          remote="$(git ls-remote "https://x-access-token:$READ_TOKEN@github.com/$TARGET_REPO.git" "refs/heads/$HEAD_BRANCH" | awk '{print $1}')"
          test "$remote" = "$TARGET_SHA"
          git clone -q --no-checkout "https://x-access-token:$READ_TOKEN@github.com/$TARGET_REPO.git" "$WORK/candidate"
          git -C "$WORK/candidate" checkout -q --detach "$TARGET_SHA"
          git -C "$WORK/candidate" remote set-url origin "https://github.com/$TARGET_REPO.git"
          test "$(git -C "$WORK/candidate" rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C "$WORK/candidate" rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(tr -d '\r\n ' < "$WORK/candidate/VERSION")" = "$TARGET_VERSION"
          git -C "$WORK/candidate" cat-file -e "$BASE_SHA^{commit}"
          git -C "$WORK/candidate" diff --name-only "$BASE_SHA" "$TARGET_SHA" | sort > "$WORK/diff.txt"
          printf '%s\n' src/assets/frontstage-legacy-entry.js src/settings.php tests/unit/p01_ia6_legacy_bookmark_native_contract.cjs | sort > "$WORK/expected.txt"
          cmp "$WORK/expected.txt" "$WORK/diff.txt"
          echo P01_WATCH_TMDB_THREE_FILE_SCOPE=PASS
      - name: Lint and exercise same-document Owner legacy task selection
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-mbstring >/dev/null
          cd "$WORK/candidate"
          php -l src/settings.php
          php -l src/app/FrontstageTmdbSettings.php
          node --check src/assets/frontstage-legacy-entry.js
          node --check tests/unit/p01_ia6_legacy_bookmark_native_contract.cjs
          node tests/unit/p01_ia6_legacy_bookmark_native_contract.cjs
          php tests/unit/p01_watch_tmdb_dedicated_menu_contract.php
          php tests/unit/admin_settings_retired_route_r58_contract.php
          echo P01_WATCH_TMDB_OLD_AND_NEW_OWNER_BOOKMARK_MACHINE=PASS
      - name: Remove private source and temporary Owner test work
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          echo P01_WATCH_TMDB_PUBLIC_ARTIFACT=NONE
          echo P01_WATCH_TMDB_PRODUCTION_WRITE=NONE
          case "$WORK" in /tmp/p01-watch-tmdb-legacy-*) rm -rf -- "$WORK";; *) exit 66;; esac
