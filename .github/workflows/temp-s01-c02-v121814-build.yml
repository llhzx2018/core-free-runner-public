          git diff --cached --check
          git commit -m 'fix(S01-C02): recover preserved Simply Static source safely'
          git push origin HEAD:fix/s01-static-source-recovery-v2-v121814
          echo CANDIDATE_SHA=$(git rev-parse HEAD)
          echo CANDIDATE_TREE=$(git rev-parse HEAD^{tree})
          echo PASS_V121814_BUILD
