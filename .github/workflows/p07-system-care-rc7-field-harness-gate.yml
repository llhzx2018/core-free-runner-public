name: P07 System Care RC7 Field Harness Gate

on:
  push:
    branches: [gate/p07-system-care-rc7-field-harness-20260907]
    paths:
      - '.github/workflows/p07-system-care-rc7-field-harness-gate.yml'

permissions:
  contents: read

jobs:
  validate-field-harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout public gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact private Field Harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/core-free-runner-private
          ref: 1d044fcfe654820bf5c8057be565f83980d5e9a0
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: private-gate
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact frozen P07 RC7 runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 0ce386082b648c4fa64a2c01e1c85957d0a8919b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: product
          persist-credentials: false
          fetch-depth: 1

      - name: Exact identities and Bash syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C private-gate rev-parse HEAD)" = "1d044fcfe654820bf5c8057be565f83980d5e9a0"
          test "$(git -C product rev-parse HEAD)" = "0ce386082b648c4fa64a2c01e1c85957d0a8919b"
          test "$(cat product/modules/system-care/VERSION)" = "0.1.0-rc7"
          bash -n private-gate/scripts/p07-system-care-rc7-field-preflight.sh
          bash -n private-gate/scripts/p07-system-care-rc7-field-gate.sh
          echo P07_RC7_FIELD_HARNESS_EXACT_IDENTITIES=PASS
          echo P07_RC7_FIELD_HARNESS_BASH_SYNTAX=PASS

      - name: Safety and real-user-path static gate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          files=[
              Path('private-gate/scripts/p07-system-care-rc7-field-preflight.sh'),
              Path('private-gate/scripts/p07-system-care-rc7-field-gate.sh'),
          ]
          text='\n'.join(p.read_text(encoding='utf-8') for p in files)
          required=[
              'P07_RC7_FIELD_DNS_WRITE=0',
              'P07_RC7_FIELD_OLD_SERVER_DELETE=0',
              'P07_RC7_FIELD_PRODUCTION_WRITE=0',
              'P07_RC7_FIELD_CLOUDPANEL_CONFIG_WRITE=0',
              'P07_RC7_FIELD_EXISTING_SITE_OVERWRITE=0',
              'P07_RC7_FIELD_UNRELATED_SCHEDULER_WRITE=0',
          ]
          for needle in required:
              assert needle in text, needle
          forbidden=[
              'clpctl site:add', 'clpctl site:delete', 'clpctl db:add', 'clpctl db:delete',
              'iptables ', 'nft add', 'ufw ', 'firewall-cmd',
              'systemctl reboot', '\nreboot\n', '\nshutdown\n', '\npoweroff\n',
              '/etc/ssh/sshd_config', 'authorized_keys',
              'StrictHostKeyChecking=no', 'UserKnownHostsFile=/dev/null',
          ]
          for needle in forbidden:
              assert needle not in text, f'forbidden field-harness behavior: {needle}'
          gate=Path('private-gate/scripts/p07-system-care-rc7-field-gate.sh').read_text(encoding='utf-8')
          assert 'trap cleanup EXIT' in gate
          assert 'safe_cleanup_state=1' in gate
          assert 'safe_cleanup_scheduler=1' in gate
          assert 'uploads_created' in gate and 'rmdir -- "$uploads"' in gate
          assert 'command -v script >/dev/null' in gate
          assert 'confirmed_evidence()' in gate
          assert 'script -qec' in gate
          assert 'confirmed_evidence enable' in gate
          assert 'confirmed_evidence rebaseline' in gate
          assert 'confirmed_evidence disable' in gate
          assert 'repair_scheduler_via_menu' in gate
          assert 'P07_RC7_RFG12_CLEANUP=PASS' in gate
          assert 'P07_RC7_REAL_CLOUDPANEL_WP_FIELD=PASS' in gate
          assert 'P07_RC7_REAL_CRON_FALLBACK=NOT_RUN' in gate
          assert 'P07_IE_STATE_DIR' in gate and 'P07_IE_ENTRY' in gate
          assert 'vf-system-care-intrusion-evidence.timer' in gate
          assert 'UNBASELINED_WORDPRESS_SITE' in gate
          assert 'StateEventsMissingError' in gate
          print('P07_RC7_FIELD_HARNESS_SAFETY_STATIC=PASS')
          print('P07_RC7_FIELD_HARNESS_REAL_USER_TTY_PATH=PASS')
          PY

      - name: Frozen product specialist regressions remain green
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          bash modules/system-care/tests/static_gate.sh
          bash modules/system-care/tests/functional_gate.sh
          echo P07_RC7_FIELD_HARNESS_FROZEN_PRODUCT_REGRESSION=PASS

      - name: Final harness gate marker
        shell: bash
        run: |
          echo P07_RC7_FIELD_HARNESS_MACHINE_GATE=PASS
