name: S01 frontend page directory exact-source verification
on:
  push:
    branches: [task/s01-theme-frontpages-20261015]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_REPO: 'llhzx2018/vf-tools-theme'
      TARGET_VERSION: '1.35.119'
      TARGET_SHA: '32bec307d42e7b7336a2b54a0fa6bc81e0b67baf'
      TARGET_TREE: 'c28891dde6cd3398cd12e756bd9b058e0bfb0d24'
      BASE_SHA: 'd1379cb2912b992ccec7ebb20bd97ffd8e6101a2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Bound lane identity
        run: |
          set -Eeuo pipefail
          mkdir proof
          python3 runner/scripts/ephemeral_lane_spec.py render --spec runner/lanes/s01-theme-frontpages-20261015/spec.json --template runner/lanes/s01-theme-frontpages-20261015/candidate.template.yml --output /tmp/frontpages-rendered.yml
          cmp /tmp/frontpages-rendered.yml runner/.github/workflows/s01-theme-frontpages-20261015.yml
          python3 runner/scripts/ephemeral_lane_spec.py audit-rendered --spec runner/lanes/s01-theme-frontpages-20261015/spec.json --input runner/.github/workflows/s01-theme-frontpages-20261015.yml > proof/lane-identity.json
          cp -a runner/lanes/s01-theme-frontpages-20261015 lane
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Source scope and syntax
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          python3 - <<'PY'
          import subprocess,pathlib,os,json
          changed=subprocess.check_output(['git','-C','target','diff','--name-only',os.environ['BASE_SHA'],os.environ['TARGET_SHA']],text=True).splitlines()
          allowed=json.loads(pathlib.Path('lane/allowed.json').read_text())
          assert sorted(changed)==sorted(allowed),(changed,allowed)
          for path in changed:
              if path.endswith('.php'):subprocess.run(['php','-l','target/'+path],check=True,stdout=subprocess.DEVNULL)
          assert pathlib.Path('target/VERSION').read_text().strip()==os.environ['TARGET_VERSION']
          for path in ['src/header.php','src/footer.php','src/inc/admin/admin-shell.php','src/inc/v6/component-workspace.php','src/inc/bootstrap/manifests/theme-action.php','src/inc/services/page-runtime-contract-service.php','src/inc/services/admin-preview-catalog-service.php','src/assets/css/public/vf-theme-public-runtime.css','VERSION','src/style.css']:
              before=subprocess.check_output(['git','-C','target','show',os.environ['BASE_SHA']+':'+path])
              assert before==pathlib.Path('target',path).read_bytes(),path
          pathlib.Path('proof/source.json').write_text(json.dumps({'status':'PASS','sha':os.environ['TARGET_SHA'],'tree':os.environ['TARGET_TREE'],'changed':changed,'version_bump':False,'frozen_shell_menu_public_runtime':'UNCHANGED'}))
          PY
          node --check target/src/assets/js/admin/admin-frontend-pages.js
          node --check target/src/assets/js/admin/admin-layout.js
          node --check lane/browser.cjs
          bash -n lane/native.sh
      - name: Browser runtime
        run: |
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -g -fsSL --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC[wght].ttf' -o "$HOME/.local/share/fonts/NotoSansSC.ttf"
          fc-cache -f
      - name: Real WordPress queries permissions languages and desktop workflows
        run: bash lane/native.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: s01-theme-frontpages-proof-${{ github.run_id }}
          path: |
            proof/*.json
            proof/*.png
          if-no-files-found: error
          retention-days: 30
      - name: Clean transient private source
        if: always()
        run: rm -rf target /tmp/wp-cli-frontpages.phar
