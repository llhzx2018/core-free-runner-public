name: P01 V2.47.235 Backend Discovery Proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v247235-backend-discovery.yml'
      - 'proof-triggers/p01-v247235-backend-discovery.json'

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout proof control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-curl >/dev/null
          php -m | grep -Fx curl
          echo P01_DISCOVERY_RUNTIME=PASS

      - name: Checkout exact P01 source
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" product
          git -C product fetch -q --depth 1 origin bc6f53746f5fd7476ed2f5826add39b7345bd5aa
          git -C product checkout -q --detach FETCH_HEAD
          test "$(git -C product rev-parse HEAD)" = "bc6f53746f5fd7476ed2f5826add39b7345bd5aa"
          test "$(tr -d '\r\n ' < product/VERSION)" = "2.47.235"
          test "$(tr -d '\r\n ' < product/src/VERSION.txt)" = "2.47.235"
          echo P01_DISCOVERY_EXACT_SOURCE=PASS

      - name: Execute live backend discovery path
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          php -d detect_unicode=0 <<'PHP'
          <?php
          declare(strict_types=1);
          require getcwd().'/product/src/app/CoreUpdates/GitHubClient.php';
          require getcwd().'/product/src/app/CoreUpdates/UpdateCore.php';

          $token = trim((string)getenv('VF_PRIVATE_READ_TOKEN'));
          if ($token === '') throw new RuntimeException('missing read token');

          $client = new \CoreUpdates\GitHubClient($token, 'vf-p01-v247235-discovery-proof');
          $manifest = $client->fetchProjectManifest('llhzx2018/core-updates', 'P01.json', 'main');

          $expect = [
            'project_id'=>'P01',
            'component_id'=>'APP',
            'current_version'=>'2.47.234',
            'target_version'=>'2.47.235',
            'schema_from'=>'2026090401',
            'schema_to'=>'2026090401',
            'repository'=>'llhzx2018/vf-start',
            'release_tag'=>'v2.47.235',
            'asset_name'=>'VF_Start_V2.47.235_UPDATE.zip',
            'product_identity'=>'bc6f53746f5fd7476ed2f5826add39b7345bd5aa',
            'asset_sha256'=>'cd45ab258dc854a6e8258e3b01f0d1d24c127f6d49f3e1847d3cf7421ff64d5c',
          ];
          foreach ($expect as $key=>$value) {
              if (($manifest[$key] ?? null) !== $value) throw new RuntimeException('manifest mismatch: '.$key);
          }
          if (($manifest['release_id'] ?? null) !== 403071600) throw new RuntimeException('release id mismatch');
          if (($manifest['asset_bytes'] ?? null) !== 2263795) throw new RuntimeException('asset bytes mismatch');
          if (($manifest['from_versions'] ?? null) !== ['2.47.234']) throw new RuntimeException('from_versions mismatch');
          if (($manifest['enabled'] ?? null) !== true || ($manifest['update_type'] ?? null) !== 'ATOMIC') throw new RuntimeException('channel state mismatch');

          $core = new \CoreUpdates\UpdateCore('P01', 'APP');
          $availability = $core->check('2.47.234', '2026090401', $manifest);
          if (($availability['status'] ?? '') !== 'AVAILABLE') throw new RuntimeException('not available');
          if (($availability['target_version'] ?? '') !== '2.47.235') throw new RuntimeException('target mismatch');

          $dest = '/tmp/VF_Start_V2.47.235_UPDATE.zip';
          @unlink($dest);
          $asset = $client->downloadReleaseAsset('llhzx2018/vf-start', 'v2.47.235', 'VF_Start_V2.47.235_UPDATE.zip', $dest);
          if ((int)($asset['size'] ?? 0) !== 2263795) throw new RuntimeException('live release asset size mismatch');
          $verified = $core->verifyPackage($dest, $manifest);
          if (($verified['status'] ?? '') !== 'VERIFIED') throw new RuntimeException('package verification failed');

          echo json_encode([
            'status'=>'PASS',
            'current_version'=>'2.47.234',
            'latest_version'=>'2.47.235',
            'available'=>true,
            'can_update'=>true,
            'manifest_source'=>'llhzx2018/core-updates/main/projects/P01.json',
            'release_id'=>403071600,
            'asset_bytes'=>2263795,
            'asset_sha256'=>'cd45ab258dc854a6e8258e3b01f0d1d24c127f6d49f3e1847d3cf7421ff64d5c',
            'product_identity'=>'bc6f53746f5fd7476ed2f5826add39b7345bd5aa',
            'production_write'=>false,
            'update_prepare_called'=>false,
            'update_install_called'=>false,
          ], JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE).PHP_EOL;
          echo "P01_BACKEND_DISCOVERY_V247235=PASS\n";
          PHP

      - name: Assert no Production mutation
        shell: bash
        run: |
          echo PRODUCTION_WRITE=0
          echo UPDATE_PREPARE_CALLED=NO
          echo UPDATE_INSTALL_CALLED=NO
