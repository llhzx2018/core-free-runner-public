name: P01 temporary Distribution exact-source proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v247285-distribution-proof.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: ccbd137a80b118ff8b7d29ab6b1dc2932658a7a1
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,curl,zip,openssl
          coverage: none
      - name: Canonical distribution validation
        run: |
          set -Eeuo pipefail
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php update-core/php/tests/run.php
          python3 - <<'PY'
          import json
          p=json.load(open('projects/P01.json'))
          assert p['current_version']=='2.47.284'
          assert p['target_version']=='2.47.285'
          assert p['from_versions']==['2.47.284']
          assert p['product_identity']=='135daa86a044473829e3d5c2b27a730944d263b6'
          assert p['asset_sha256']=='e6f5df076085ab2dac791dfaf16a270942e4a8965fc8dcab4c63fcf9682bdee9'
          assert p['asset_bytes']==2363757
          assert p['schema_from']==p['schema_to']=='2026090401'
          print('P01_DISTRIBUTION_IDENTITY=PASS')
          PY
          echo P01_DISTRIBUTION_CANONICAL=PASS
