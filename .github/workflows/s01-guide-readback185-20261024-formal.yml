name: S01 Theme exact formal release
on:
  push:
    branches: [task/s01-guide-readback185-20261024]
    paths: ['.github/workflows/s01-guide-readback185-20261024-formal.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.185
  TARGET_SHA: 25712e23cba54722c2ee6ba1180db4ef3db33b45
  TARGET_TREE: c36e63dd19a1422cde2b3f4ac8f9ca10d6031820
  BASE_SHA: 832abfc4f0c8e32afdc6866484f34cb3db0edc81
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 25712e23cba54722c2ee6ba1180db4ef3db33b45
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact candidate, merged tree and required evidence readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider candidate-proof
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40087683938 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40087683938 --jq .head_sha)" = 0db920f621b2dc187f26282701165de4ea29feaa
          test "$(gh api repos/$TARGET_REPO/commits/main --jq .sha)" = "$TARGET_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$TARGET_SHA --jq .tree.sha)" = "$TARGET_TREE"
          gh run download 40087683938 --repo llhzx2018/core-free-runner-public --name s01-home-40087683938 --dir candidate-proof
          cmp candidate-proof/state-before.sha256 candidate-proof/state-after.sha256
          cmp candidate-proof/contracts-before.json candidate-proof/contracts-after.json
          python3 control/lanes/s01-guide-readback185-20261024/package.py
          python3 - <<'PYVERIFY'
          import json,pathlib
          r=pathlib.Path('candidate-proof')
          old=json.loads((r/'package.json').read_text());new=json.loads(pathlib.Path('proof/package.json').read_text())
          assert old['source']=='0971f865ddc6bab7e62d004ddaa557b69b18dfa8'
          phases={phase:json.loads((r/(phase+'-readback-summary.json')).read_text()) for phase in ['before','upgrade','rollback','after']}
          for phase,result in phases.items():
              assert result['status']=='PASS' and result['errors']==result['write_requests']==[]
              assert len(result['rows'])==(4 if phase in ['before','after'] else 1)
              assert all(row['status']=='PASS' for row in result['rows'])
          for lang in ['en','zh']:
              for width in [1440,1024]:
                  before=json.loads((r/('before-readback-'+lang+'-'+str(width)+'.json')).read_text())
                  after=json.loads((r/('after-readback-'+lang+'-'+str(width)+'.json')).read_text())
                  assert not after['overflow'] and after['version']=='1.35.185'
                  for key in ['h1','canonical','hreflang','shell']:assert before[key]==after[key]
                  assert len(after['h1'])==len(after['canonical'])==1
                  assert [(x['href'],x['title']) for x in before['cards']]==[(x['href'],x['title']) for x in after['cards']]
                  assert after['extra']=='' and after['cards'][0]['copy'].endswith('KEEP_AUTHORED_END')
                  assert after['pagination']['border']==0 and after['pagination']['gap']==8
                  for phase in ['before','after']:assert (r/(phase+'-readback-'+lang+'-'+str(width)+'.png')).stat().st_size>1000
          excerpts=json.loads((r/'excerpt-check.json').read_text());assert excerpts['status']=='PASS' and excerpts['shortcode_calls']==0
          assert all(x['saved_preserved'] in [True,'N_A'] for x in excerpts['checks'])
          assert json.loads((r/'clean-install.json').read_text())['status']=='PASS'
          for k in ['status','version','tree','sha256','bytes','files']:assert old[k]==new[k],k
          assert new['sha256']=='33952bb3d562ada36d6de105788f2e02fc5d8326cd61771cd39ff7d8667070fd' and new['bytes']==1987371
          coverage=json.loads(pathlib.Path('control/lanes/s01-guide-readback185-20261024/release-authority.json').read_text())
          assert set(coverage['required'])=={'TESTING','GIT','UA_UI','SEO','SECURITY','INSTALL','UPGRADE','DATA_SCHEMA'}
          assert coverage['source']=='0971f865ddc6bab7e62d004ddaa557b69b18dfa8' and coverage['tree']=='c36e63dd19a1422cde2b3f4ac8f9ca10d6031820'
          assert coverage['owner_preview']=='POST_RELEASE_REQUIRED_MODE_B'
          for item in coverage['required'].values():
              assert item['sha'] and item['acceptance']
              item['evidence_status']='PASS_EXACT_CANDIDATE_MACHINE'
          coverage['candidate_run']='40087683938'
          coverage['merged_source']='25712e23cba54722c2ee6ba1180db4ef3db33b45'
          coverage['formal_release_gate']='PASS'
          coverage['production_effect']='NOT_PROVEN_POST_MANUAL_UPGRADE_READBACK_REQUIRED'
          pathlib.Path('proof/public-authority-coverage.json').write_text(json.dumps(coverage,ensure_ascii=False,indent=2))
          print('MERGED_TREE_EQUALS_TESTED_TREE_AND_EXACT_PACKAGE_PASS')
          PYVERIFY
      - name: Publish only the exact verified package
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.35.185 --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create v1.35.185 provider/vf-tools-theme_V1.35.185.zip --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Theme V1.35.185' --notes '指南正式站中英文截图收口：补充识别英文旧默认重复介绍，保留独立自定义文案；中文标题改为自然断行，卡片改用中性色边线。指南已填写摘要不再被主题按自动预算二次截短；正文自动摘要继续限长，中文按字符预算生成，安全文本不执行短码。原始文章/摘要、设置、真实查询/链接和已修复的独立分页保持。真实WordPress中英文1440/1024实际标题与完整截图、摘要安全正负例、自定义文案、搜索和第二页，新包清洁安装、184升级185/回退/重复安装数据保护通过。476运行文件，M3U8保持1.25.94，Ops不改。Production由OWNER手工升级后最终复核，手机实机暂缓。' --latest
          fi
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/v1.35.185 --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh release view v1.35.185 --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - name: Authenticated remote ZIP byte comparison
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download v1.35.185 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.185.zip --dir remote
          cmp provider/vf-tools-theme_V1.35.185.zip remote/vf-tools-theme_V1.35.185.zip
          echo '33952bb3d562ada36d6de105788f2e02fc5d8326cd61771cd39ff7d8667070fd  remote/vf-tools-theme_V1.35.185.zip' | sha256sum -c
          test "$(stat -c %s remote/vf-tools-theme_V1.35.185.zip)" = 1987371
          gh release view v1.35.185 --repo "$TARGET_REPO" --json url,publishedAt,tagName > proof/formal-release.json
          echo FORMAL_RELEASE_EXACT_REMOTE_ASSET_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-home-formal-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target provider remote candidate-proof
