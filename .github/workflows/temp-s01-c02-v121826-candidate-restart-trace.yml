name: TEMP S01-C02 1.21.826 Candidate Restart Trace
on:
  push:
    branches:
      - temp/s01-c02-v121826-candidate-restart-trace-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121826-candidate-restart-trace.yml'
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact Ops source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: eb41c358d106ec5deea36d88ee426bd63aee973d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: ops
      - name: Trace recovered-source to candidate restart path
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== RECOVERY START + WORKER ==='
          grep -RInE 'function vf_ops_s01_static_source_recovery_v2_(start|worker)_v121814|create_inspection_from_trusted_source_v121814|SOURCE_REINSPECTION_FAILED|inspection_complete' ops/includes/site-release/s01-static-source-recovery-v2.php | head -n 120 || true
          echo '=== PROMOTE INSPECTION ==='
          grep -RInE 'create_candidate_from_inspection_v121761|inspection.*candidate|promote.*candidate|wp_ajax.*candidate' ops/includes | head -n 220 || true
          echo '=== ADMIN UI / JS CALLERS ==='
          grep -RInE 'vf_ops_release_.*candidate|create_candidate_from_inspection|inspect_only|one_step_cf_zip|check_static_zip' ops/includes ops/assets | head -n 360 || true
          echo '=== CREATE TRAIT FUNCTION WINDOW ==='
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ops/includes/release/async-job-parts/01-job-create-trait.php')
          s=p.read_text()
          key='public static function create_candidate_from_inspection_v121761'
          i=s.find(key)
          print(s[i:i+9000] if i>=0 else 'NOT_FOUND')
          PY
          echo '=== RECOVERY WORKER WINDOW ==='
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ops/includes/site-release/s01-static-source-recovery-v2.php')
          s=p.read_text()
          for key in ['function vf_ops_s01_static_source_recovery_v2_start_v121814','function vf_ops_s01_static_source_recovery_v2_worker_v121814']:
              i=s.find(key)
              print('\n### '+key+'\n')
              print(s[i:i+12000] if i>=0 else 'NOT_FOUND')
          PY
          echo TRACE_DONE
