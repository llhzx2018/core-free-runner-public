name: S01-C03 embed exact formal release
on:
  push:
    branches: [task/s01-c03-embed78-20261010-release]
permissions:
  contents: read
  actions: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_REPO: 'llhzx2018/vf-tools-m3u8'
      TARGET_VERSION: '1.25.78'
      TARGET_SHA: '927b7e0cac9b775b6bfdfb9af93827a4dce60a0e'
      TARGET_TREE: '8691014ad64fd7af1e284e494ed88892f94cae4c'
      SOURCE_VERSION: '1.25.77'
      CANDIDATE_RUN: '38058451990'
      CANDIDATE_RUNNER_SHA: 'c3b8231f890b8455b3f46d22cea8c4cfe42cf13f'
      CANDIDATE_ARTIFACT_ID: '11672285971'
      PROMOTED_MAIN_SHA: 'b351a06232bc839468f49a6be131930a23bb4e7b'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Target spec preflight
        run: |
          set -Eeuo pipefail
          mkdir -p proof
          python3 runner/scripts/ephemeral_lane_spec.py render --spec runner/lanes/s01-c03-embed78-20261010-release/spec.json --template runner/lanes/s01-c03-embed78-20261010-release/release.template.yml --output /tmp/rendered-release.yml >/dev/null
          cmp /tmp/rendered-release.yml runner/.github/workflows/s01-c03-embed78-20261010-release.yml
          python3 runner/scripts/ephemeral_lane_spec.py audit-rendered --spec runner/lanes/s01-c03-embed78-20261010-release/spec.json --input runner/.github/workflows/s01-c03-embed78-20261010-release.yml > proof/lane-identity-audit.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Actual candidate archive reverse verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir candidate
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN" > /tmp/candidate-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT_ID" > /tmp/candidate-meta.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT_ID/zip" > /tmp/candidate-proof.zip
          python3 runner/lanes/s01-c03-embed78-20261010-release/formal-reverse.py
      - name: Exact promoted source and deterministic rebuild
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          cp -a runner/lanes/s01-c03-embed78-20261010-release lane
          test "$(gh api repos/$TARGET_REPO/git/ref/heads/main --jq '.object.sha')" = "$PROMOTED_MAIN_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$PROMOTED_MAIN_SHA --jq '.tree.sha')" = "$TARGET_TREE"
          php target/tests/unit/package-physical-locator-contract.php
          python3 lane/formal-build.py
          python3 - <<'PY'
          import json,pathlib
          a=json.loads(pathlib.Path('proof/identity.json').read_text());b=json.loads(pathlib.Path('candidate/proof/identity.json').read_text());assert a==b,(a,b)
          PY
      - name: Publish authorized exact tag and formal asset
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          gh api "repos/$TARGET_REPO/git/refs/tags" > /tmp/tags.json
          gh api "repos/$TARGET_REPO/releases?per_page=100" > /tmp/releases.json
          python3 - <<'PY'
          import pathlib,json,os
          tag='v'+os.environ['TARGET_VERSION']
          assert not any(n['ref']=='refs/tags/'+tag for n in json.loads(pathlib.Path('/tmp/tags.json').read_text()))
          assert not any(n['tag_name']==tag for n in json.loads(pathlib.Path('/tmp/releases.json').read_text()))
          pathlib.Path('/tmp/release-notes.md').write_text('修复显式 M3U8 iframe 端点被 Theme 工具页面截获：入口在查询完成后、页面与语言跳转前执行。Embed 预览等待视频实际解码才显示成功；失败保留明确恢复提示与生成代码，不再提前声称可发布。仅修改入口、媒体状态、Embed 源与对应分发包；普通页面、Schema、Updater、Theme/Ops/Header/Menu 不改。旧版工具路径失败与修复版 A/B、实际视频、13 项原生升级/回退/保留/全新安装证据、5 种代码复制与 JSON 下载、六宽度及普通首页/11工具路由验证通过。线上根路径失败未在干净环境重现，Production 升级后的在线复验仍待执行。Source: '+os.environ['TARGET_SHA']+'; candidate run '+os.environ['CANDIDATE_RUN']+'. Production由用户手工升级；未声明全产品、OWNER或Production PASS。\n')

          PY
          gh api "repos/$TARGET_REPO/git/refs" -X POST -f ref="refs/tags/v$TARGET_VERSION" -f sha="$PROMOTED_MAIN_SHA" > proof/tag.json
          gh release create "v$TARGET_VERSION" "proof/vf-tools-m3u8_V$TARGET_VERSION.zip" --repo "$TARGET_REPO" --verify-tag --title "VF Tools M3U8 V$TARGET_VERSION" --notes-file /tmp/release-notes.md
      - name: Exact delivered asset remote readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir delivered
          gh api "repos/$TARGET_REPO/releases/tags/v$TARGET_VERSION" > proof/release-meta.json
          gh api "repos/$TARGET_REPO/git/ref/tags/v$TARGET_VERSION" > /tmp/tag-readback.json
          gh release download "v$TARGET_VERSION" --repo "$TARGET_REPO" --pattern "vf-tools-m3u8_V$TARGET_VERSION.zip" --dir delivered
          python3 runner/lanes/s01-c03-embed78-20261010-release/formal-readback.py
      - name: Safe release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c03-embed78-release-${{ github.run_id }}
          path: proof/**/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Private workspace cleanup
        if: always()
        run: rm -rf target candidate delivered proof/*.zip /tmp/candidate-proof.zip

