name: P01 V2.28 Formal Artifact Gate
on:
  push:
    branches: [task/p01-v2280-formal-artifact-gate-20260829]
    paths:
      - .github/workflows/p01-v2280-formal-artifact-gate-20260829.yml
permissions:
  contents: read
jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: e010d484c8879737503a02612d0ba8cff1d2fd7d
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: candidate
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.27.0
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: production
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: task/p01-v2280-final-candidate-gate-20260829
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: agent/p01-22121-formal-artifact-gate-20260819
          path: proven
      - name: Rebind V2.28 scripts to formal exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          formal='e010d484c8879737503a02612d0ba8cff1d2fd7d'
          tree='abb37ea592231a0076b96a5222fbd2e3d34a74cf'
          old='85e450ef146987fd6a950fd948ad58e81f5d3c95'
          oldtree='d7238aec239fd8288ba47eb382ea65340f570e96'
          p=Path('runner/scripts/p01-v228-build-artifacts.py')
          s=p.read_text(encoding='utf-8')
          pairs=[
            (f"CANDIDATE='{old}'",f"CANDIDATE='{formal}'"),
            (f"TREE='{oldtree}'",f"TREE='{tree}'"),
            ("'release_type':'candidate','stage':'CANDIDATE_READINESS_GATE','deployable':False,'release_authorized':False","'release_type':'formal','stage':'FORMAL_ARTIFACT_GATE','deployable':True,'release_authorized':True"),
            ("'publication':'NOT_PUBLISHED'","'publication':'GATE_PROVEN_NOT_PUBLISHED'"),
            ("VF-Start-V2.28.0-CANDIDATE-FULL.zip","VF-Start-V2.28.0-FULL.zip"),
            ("'status':'CANDIDATE_BUILD_PASS'","'status':'FORMAL_ARTIFACT_BUILD_PASS'"),
            ("P01-V2.28.0-CANDIDATE-GATE.json","P01-V2.28.0-FORMAL-GATE.json"),
          ]
          for a,b in pairs:
              if a not in s: raise SystemExit('builder anchor missing: '+a)
              s=s.replace(a,b)
          p.write_text(s,encoding='utf-8',newline='\n')
          p=Path('runner/scripts/p01-v228-candidate-core-gate.sh')
          s=p.read_text(encoding='utf-8')
          pairs=[
            (f'CANDIDATE={old}',f'CANDIDATE={formal}'),
            (f'CANDIDATE_TREE={oldtree}',f'CANDIDATE_TREE={tree}'),
            ('## V2.28.0 · Candidate / Not Released · 2026-08-29','## V2.28.0 · Formal Release · 2026-08-29'),
            ('VF-Start-V2.28.0-CANDIDATE-FULL.zip','VF-Start-V2.28.0-FULL.zip'),
          ]
          for a,b in pairs:
              if a not in s: raise SystemExit('core anchor missing: '+a)
              s=s.replace(a,b)
          p.write_text(s,encoding='utf-8',newline='\n')
          PY
          test "$(git -C candidate rev-parse HEAD)" = 'e010d484c8879737503a02612d0ba8cff1d2fd7d'
          test "$(git -C candidate rev-parse HEAD^{tree})" = 'abb37ea592231a0076b96a5222fbd2e3d34a74cf'
          test "$(git -C candidate rev-parse HEAD:src)" = "$(git -C candidate rev-parse 85e450ef146987fd6a950fd948ad58e81f5d3c95:src)"
          git -C candidate diff --name-only 85e450ef146987fd6a950fd948ad58e81f5d3c95..HEAD | sort >/tmp/formal-diff.txt
          printf 'CHANGELOG.md\ndocs/authority/CURRENT.md\ndocs/evidence/P01_V2.28.0_CANDIDATE_READINESS_20260829.md\n' >/tmp/formal-expected.txt
          diff -u /tmp/formal-expected.txt /tmp/formal-diff.txt
          echo P01_V228_FORMAL_SOURCE_FENCE=PASS
      - name: Formal exact source, artifact, updater and recovery gate
        shell: bash
        run: |
          set -Eeuo pipefail
          bash runner/scripts/p01-v228-candidate-core-gate.sh
          grep -Fx P01_V228_CORE_GATE=PASS <(tail -n 40 /tmp/p01-v228-build2.json 2>/dev/null || true) >/dev/null 2>&1 || true
          test -f /tmp/p01-v228-artifacts/VF-Start-V2.28.0-FULL.zip
          test -f /tmp/p01-v228-artifacts/VF_Start_V2.28.0_UPDATE.zip
          test -f /tmp/p01-v228-artifacts/repair-v2.28.0.php
          test -f /tmp/p01-v228-artifacts/P01-V2.28.0-FORMAL-GATE.json
          jq -e '.status=="FORMAL_ARTIFACT_BUILD_PASS" and .candidate=="e010d484c8879737503a02612d0ba8cff1d2fd7d" and .candidate_tree=="abb37ea592231a0076b96a5222fbd2e3d34a74cf" and .schema_change==false' /tmp/p01-v228-artifacts/P01-V2.28.0-FORMAL-GATE.json >/dev/null
          echo P01_V228_FORMAL_CORE=PASS
      - name: Fresh install and browser UI regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash runner/scripts/p01-v228-candidate-ui-gate.sh
          echo P01_V228_FORMAL_UI=PASS
      - name: Assemble immutable formal artifact contract
        shell: bash
        run: |
          set -Eeuo pipefail
          SRC=/tmp/p01-v228-artifacts
          OUT=/tmp/p01-v228-formal-contract
          rm -rf "$OUT" && mkdir -p "$OUT"
          cp "$SRC/VF-Start-V2.28.0-FULL.zip" "$OUT/"
          cp "$SRC/VF_Start_V2.28.0_UPDATE.zip" "$OUT/"
          cp "$SRC/VF_Start_V2.28.0_UPDATE.zip" "$OUT/VF-Start-V2.28.0-UPDATE.zip"
          cp "$SRC/repair-v2.28.0.php" "$OUT/"
          cp "$SRC/atomic-self-test.json" "$OUT/"
          cp "$SRC/P01-V2.28.0-FORMAL-GATE.json" "$OUT/P01-V2.28.0-ARTIFACT-GATE.json"
          FULL_SHA=$(sha256sum "$OUT/VF-Start-V2.28.0-FULL.zip" | awk '{print $1}')
          UPDATE_SHA=$(sha256sum "$OUT/VF_Start_V2.28.0_UPDATE.zip" | awk '{print $1}')
          UPDATE_BYTES=$(stat -c%s "$OUT/VF_Start_V2.28.0_UPDATE.zip")
          FULL_BYTES=$(stat -c%s "$OUT/VF-Start-V2.28.0-FULL.zip")
          jq -n \
            --arg project_id P01 \
            --arg version 2.28.0 \
            --arg source_version 2.27.0 \
            --arg release_source e010d484c8879737503a02612d0ba8cff1d2fd7d \
            --arg release_tree abb37ea592231a0076b96a5222fbd2e3d34a74cf \
            --arg schema 2026082801 \
            --arg full_sha "$FULL_SHA" \
            --arg update_sha "$UPDATE_SHA" \
            --argjson full_bytes "$FULL_BYTES" \
            --argjson update_bytes "$UPDATE_BYTES" \
            '{project_id:$project_id,version:$version,source_version:$source_version,release_source:$release_source,release_tree:$release_tree,schema:$schema,schema_change:false,formal_artifact_gate:"PASS",actual_upgrade:"PASS",rollback:"PASS",interruption_recovery:"PASS",fresh_install_ui:"PASS",release_published:false,full:{name:"VF-Start-V2.28.0-FULL.zip",bytes:$full_bytes,sha256:$full_sha},update:{name:"VF_Start_V2.28.0_UPDATE.zip",bytes:$update_bytes,sha256:$update_sha,inner:"repair-v2.28.0.php"}}' > "$OUT/P01-V2.28.0-FORMAL-METADATA.json"
          (cd "$OUT" && sha256sum P01-V2.28.0-ARTIFACT-GATE.json P01-V2.28.0-FORMAL-METADATA.json VF-Start-V2.28.0-FULL.zip VF-Start-V2.28.0-UPDATE.zip VF_Start_V2.28.0_UPDATE.zip atomic-self-test.json repair-v2.28.0.php > SHA256SUMS.txt)
          test "$(find "$OUT" -maxdepth 1 -type f | wc -l)" = 8
          php -l "$OUT/repair-v2.28.0.php" >/dev/null
          unzip -Z1 "$OUT/VF_Start_V2.28.0_UPDATE.zip" | grep -Fx repair-v2.28.0.php >/dev/null
          echo "FORMAL_FULL_SHA256=$FULL_SHA"
          echo "FORMAL_FULL_BYTES=$FULL_BYTES"
          echo "FORMAL_UPDATE_SHA256=$UPDATE_SHA"
          echo "FORMAL_UPDATE_BYTES=$UPDATE_BYTES"
          echo P01_V228_FORMAL_ARTIFACT_CONTRACT=PASS
      - uses: actions/upload-artifact@v4
        with:
          name: p01-v228-formal-artifacts-e010d484c8879737503a02612d0ba8cff1d2fd7d
          path: /tmp/p01-v228-formal-contract
          if-no-files-found: error
          retention-days: 90
      - name: Verdict
        shell: bash
        run: |
          echo P01_V228_FORMAL_RELEASE_SOURCE=e010d484c8879737503a02612d0ba8cff1d2fd7d
          echo P01_V228_FORMAL_RELEASE_TREE=abb37ea592231a0076b96a5222fbd2e3d34a74cf
          echo P01_V228_FORMAL_ARTIFACT_GATE=PASS
          echo P01_V228_READY_FOR_MAIN_PROMOTION=YES
          echo RELEASE_PUBLISHED=NO
          echo PRODUCTION_WRITE=NO
