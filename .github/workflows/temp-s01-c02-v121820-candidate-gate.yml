name: TEMP S01-C02 v1.21.820 Candidate Gate
on:
  push:
    branches: [temp/s01-c02-v121820-preflight-authority-scan-20260905]
    paths: ['.github/workflows/temp-s01-c02-v121820-candidate-gate.yml']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPS_BASE: 00bc49b070485c6095a3b5bd3337b3fcc23d42f5
      OPS_SHA: 562827263f4d8fe93aee3ea6fb445164cfa5242a
      OPS_TREE: 9bee1ffdbec4321fab9bfe9570aa54968c8d1027
    steps:
      - name: Checkout exact Candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.OPS_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops
      - name: Verify identity and exact scope
        shell: bash
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          main=$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/vf-tools-ops/branches/main | jq -r '.commit.sha')
          develop=$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/vf-tools-ops/branches/develop | jq -r '.commit.sha')
          test "$main" = "$OPS_BASE"
          test "$develop" = "$OPS_BASE"
          test "$(git -C ops rev-parse HEAD)" = "$OPS_SHA"
          test "$(git -C ops rev-parse HEAD^{tree})" = "$OPS_TREE"
          test "$(git -C ops rev-list --count "$OPS_BASE..$OPS_SHA")" = 1
          test "$(git -C ops rev-list --count "$OPS_SHA..$OPS_BASE")" = 0
          printf '%s\n' \
            '.github/phase3/v121820-candidate-preflight-authority.php' \
            'VERSION' \
            'includes/publish-o10/publish-preflight-product.php' \
            'includes/publish-o10/publish-release-orchestrator.php' \
            'includes/publish-o10/publish-zip-product.php' \
            'vf-ops.php' | sort >/tmp/expected
          git -C ops diff --name-only "$OPS_BASE" "$OPS_SHA" | sort >/tmp/actual
          diff -u /tmp/expected /tmp/actual
          test "$(cat ops/VERSION)" = '1.21.820'
          grep -Fq 'Version: 1.21.820' ops/vf-ops.php
          grep -Fq "VF_OPS_VERSION', '1.21.820'" ops/vf-ops.php
          grep -Fq "VF_OPS_ROUND', 'CANDIDATE-PREFLIGHT-AUTHORITY-V1'" ops/vf-ops.php
          echo SOURCE_IDENTITY_SCOPE_CONTRACT=PASS
      - name: Full PHP lint and Candidate authority contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          find ops -path 'ops/.git' -prune -o -type f -name '*.php' -print0 | xargs -0 -n 1 php -l >/tmp/php-lint
          php ops/.github/phase3/v121820-candidate-preflight-authority.php
          pre='ops/includes/publish-o10/publish-preflight-product.php'
          zip='ops/includes/publish-o10/publish-zip-product.php'
          orch='ops/includes/publish-o10/publish-release-orchestrator.php'
          grep -Fq 'vf_ops_publish_preflight_saved_view_state_v121708' "$pre"
          grep -Fq "['PASS','PARTIAL']" "$pre"
          grep -Fq '$p0===0' "$pre"
          grep -Fq "warningsMayProceedButRemainVisible'=>true" "$pre"
          grep -Fq "finalOnlinePass'=>'NO" "$pre"
          grep -Fq 'function vf_ops_publish_preflight_gate_v121422' "$pre"
          grep -Fq 'vf_ops_publish_preflight_candidate_gate_v121820($batch)' "$zip"
          grep -Fq 'vf_ops_publish_preflight_candidate_gate_v121820($batch)' "$orch"
          git -C ops diff -U0 "$OPS_BASE" "$OPS_SHA" -- includes/publish-o10/publish-preflight-product.php includes/publish-o10/publish-release-orchestrator.php includes/publish-o10/publish-zip-product.php vf-ops.php | grep '^+' | grep -Ev '^\+\+\+' >/tmp/runtime-added || true
          if grep -Eqi 'm3u8|Seed HOLD|jd\.gg|wpvivid|\$wpdb|delete_option|wp_insert|wp_update|DROP TABLE|ALTER TABLE|wp_delete_post|wp_update_post|update_post_meta|delete_post_meta|wp_schedule|cron' /tmp/runtime-added; then
            echo FAIL_FORBIDDEN_RUNTIME_SCOPE
            cat /tmp/runtime-added
            exit 1
          fi
          test -z "$(git -C ops diff --name-only "$OPS_BASE" "$OPS_SHA" -- includes/release assets/js/admin-publish-zip.js)"
          echo PHP_AND_CANDIDATE_AUTHORITY_FAIL_CLOSED_CONTRACT=PASS
      - name: Execute saved-snapshot P1 nonblocking regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/v121820-runtime.php <<'PHP'
          <?php
          define('ABSPATH','/');
          define('VF_OPS_VERSION','1.21.820');
          $GLOBALS['t_opts']=[];
          function get_option($k,$d=[]){return $GLOBALS['t_opts'][$k]??$d;}
          function sanitize_key($s){return preg_replace('/[^a-z0-9_\-]/','',strtolower((string)$s));}
          function sanitize_text_field($s){return (string)$s;}
          function esc_url_raw($s){return (string)$s;}
          function wp_json_encode($v,$f=0){return json_encode($v,$f|JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES);}
          function current_time($type,$gmt=false){return $type==='timestamp'?time():gmdate('Y-m-d H:i:s');}
          function get_gmt_from_date($v,$f='Y-m-d H:i:s'){return gmdate($f,strtotime($v.' UTC'));}
          function vf_ops_is_digit_string($v){return ctype_digit((string)$v);}
          require 'ops/includes/publish-o10/publish-preflight-product.php';
          $batch=['id'=>'rb-test','status'=>'locked','scope_sha256'=>str_repeat('a',64),'locked_scope_sha256'=>str_repeat('a',64),'change_set_sha256'=>str_repeat('b',64),'post_ids'=>[],'component_intent_ids'=>[],'change_types'=>['static_artifact'],'acceptance_paths'=>['/'],'locked_at'=>'2026-09-05 10:00:00'];
          $c=vf_ops_publish_preflight_contract_v121422();
          function make_saved($batch,$p0=0,$p1=1,$status='PARTIAL',$version='1.21.820',$expired=false){
            $now=time();
            $s=['schemaVersion'=>'2.1','version'=>$version,'status'=>$status,'generatedAt'=>gmdate('Y-m-d H:i:s',$now),'generatedAtGmt'=>gmdate('Y-m-d H:i:s',$now),'expiresAtGmt'=>gmdate('Y-m-d H:i:s',$expired?$now-60:$now+1200),'revision'=>7,'gateSummary'=>['P0'=>$p0,'P1'=>$p1,'P2'=>0,'finalOnlinePass'=>'NO'],'batch'=>['id'=>$batch['id']],'batchIdentityHash'=>vf_ops_publish_preflight_batch_identity_v121708($batch),'snapshotHash'=>''];
            $x=$s;unset($x['snapshotHash']);$s['snapshotHash']=hash('sha256',wp_json_encode($x));return $s;
          }
          $GLOBALS['t_opts'][$c['snapshotOption']]=make_saved($batch,0,1,'PARTIAL');
          $r=vf_ops_publish_preflight_candidate_gate_v121820($batch);
          if(($r['status']??'')!=='PASS'||($r['p1_count']??0)!==1||($r['finalOnlinePass']??'')!=='NO'){fwrite(STDERR,"P1 regression failed\n");exit(1);}
          $GLOBALS['t_opts'][$c['snapshotOption']]=make_saved($batch,1,0,'BLOCKED');
          if((vf_ops_publish_preflight_candidate_gate_v121820($batch)['status']??'')!=='FAIL'){fwrite(STDERR,"P0 fail-closed failed\n");exit(1);}
          $GLOBALS['t_opts'][$c['snapshotOption']]=make_saved($batch,0,1,'PARTIAL','1.21.819');
          if((vf_ops_publish_preflight_candidate_gate_v121820($batch)['status']??'')!=='FAIL'){fwrite(STDERR,"version fail-closed failed\n");exit(1);}
          $GLOBALS['t_opts'][$c['snapshotOption']]=make_saved($batch,0,1,'PARTIAL','1.21.820',true);
          if((vf_ops_publish_preflight_candidate_gate_v121820($batch)['status']??'')!=='FAIL'){fwrite(STDERR,"expiry fail-closed failed\n");exit(1);}
          $GLOBALS['t_opts'][$c['snapshotOption']]=make_saved($batch,0,1,'PARTIAL');
          $bad=$batch;$bad['id']='rb-other';
          if((vf_ops_publish_preflight_candidate_gate_v121820($bad)['status']??'')!=='FAIL'){fwrite(STDERR,"batch identity fail-closed failed\n");exit(1);}
          echo "PASS_V121820_RUNTIME_P1_NONBLOCKING_P0_FAIL_CLOSED\n";
          PHP
          php /tmp/v121820-runtime.php
      - name: Build deterministic Candidate authority
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/release
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,re,zipfile
          root=Path('ops'); runtime=[]
          for p in root.rglob('*'):
              if not p.is_file() or p.is_symlink(): continue
              rel=p.relative_to(root).as_posix(); parts=rel.split('/'); low=[x.lower() for x in parts]
              if any(x in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in low): continue
              if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',rel,re.I): continue
              if '/' not in rel:
                  if rel not in {'vf-ops.php','uninstall.php'}: continue
              elif parts[0] not in {'includes','assets','languages','config'}: continue
              runtime.append((rel,p.read_bytes()))
          runtime.sort(key=lambda x:x[0])
          fp=hashlib.sha256()
          for rel,b in runtime: fp.update((rel+'\0'+hashlib.sha256(b).hexdigest()+'\n').encode())
          z=Path('/tmp/release/vf-tools-ops_V1.21.820.zip')
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as out:
              for rel,b in runtime:
                  i=zipfile.ZipInfo('vf-ops/'+rel,(2026,9,5,0,0,0)); i.compress_type=zipfile.ZIP_DEFLATED; i.external_attr=0o100644<<16; out.writestr(i,b)
          authority={'bytes':z.stat().st_size,'sha256':hashlib.sha256(z.read_bytes()).hexdigest(),'runtime_files':len(runtime),'runtime_fingerprint':fp.hexdigest()}
          print('CANDIDATE_AUTHORITY='+json.dumps(authority,separators=(',',':')))
          assert len(runtime)==905, authority
          PY
          unzip -tq /tmp/release/vf-tools-ops_V1.21.820.zip >/dev/null
          unzip -p /tmp/release/vf-tools-ops_V1.21.820.zip vf-ops/vf-ops.php | grep -Fq 'Version: 1.21.820'
          echo "CANDIDATE_TREE=$(git -C ops rev-parse HEAD^{tree})"
          echo PASS_V121820_CANDIDATE_GATE
