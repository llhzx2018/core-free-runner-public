name: S01 Component Authority Reconcile

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/s01-component-authority-reconcile.yml'
      - 'requests/s01-component-authority-reconcile.txt'

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    env:
      PUSH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Checkout M3U8 develop
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: develop
          token: ${{ env.PUSH_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: m3u8

      - name: Reconcile M3U8 machine authority only
        working-directory: m3u8
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "1.25.3"
          grep -q '^ \* Version: 1\.25\.3$' src/vf-tool-m3u8.php
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('VF_PROJECT.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['component_id']=='S01-C03'
          assert d.get('formal_release',{}).get('tag')=='v1.25.1'
          d['lifecycle']='WORKING_SOURCE_IDENTITY_RECONCILIATION'
          d['status']='WORKING_SOURCE_1_25_3_UNVERIFIED_AUTHORITY_REBASELINED'
          d['working_version']='1.25.3'
          d['candidate_version']='1.25.3'
          d['current_phase']='AUTHORITY_REBASELINE_SOURCE_IDENTITY_DRIFT'
          d['source_identity_rebaseline_20260819']={
            'current_working_source_version':'1.25.3',
            'version_file':'1.25.3',
            'plugin_header':'1.25.3',
            'package_profile_version':'1.25.2',
            'plugin_manifest_version':'1.25.2',
            'last_verified_formal_release':'1.25.1',
            'last_verified_formal_release_status':'PASS',
            'working_source_exact_reverification':'NOT_EXECUTED',
            'working_source_candidate_pass':'NOT_PROVEN',
            'production_installed_version':'UNVERIFIED',
            'production_write_by_rebaseline':0,
            'runtime_change_by_rebaseline':0,
            'schema_change_by_rebaseline':0,
            'version_bump_by_rebaseline':0,
            'main_promotion_by_rebaseline':0,
            'classification':['DOC_STATE_STALE','INTERNAL_IDENTITY_DRIFT'],
            'authority_documents':['docs/authority/RPD.md','docs/authority/SSOT.md','docs/authority/ACCEPTANCE_MATRIX.md']
          }
          d['return_to_vf_dev_required']=False
          d['current_project_block']='NONE'
          d['window_execution_block']='NONE'
          d['next_action']='VERIFY_1.25.3_CURRENT_SOURCE_EXACTLY_BEFORE_CANDIDATE_PASS_OR_RELEASE'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python3 -m json.tool VF_PROJECT.json >/dev/null
          test "$(git diff --name-only)" = "VF_PROJECT.json"
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VF_PROJECT.json
          git commit -m 'chore(S01-C03): reconcile working source authority 1.25.3'
          git push origin HEAD:develop
          echo "M3U8_AUTHORITY_COMMIT=$(git rev-parse HEAD)"

      - name: Checkout Ops develop
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: develop
          token: ${{ env.PUSH_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: ops

      - name: Reconcile Ops machine authority only
        working-directory: ops
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "1.21.791"
          grep -q '^ \* Version: 1\.21\.791$' vf-ops.php
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('VF_PROJECT.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['component_id']=='S01-C02'
          assert d.get('formal_release',{}).get('tag')=='v1.21.789'
          d['lifecycle']='WORKING_SOURCE_IDENTITY_RECONCILIATION'
          d['status']='WORKING_SOURCE_1_21_791_UNVERIFIED_AUTHORITY_REBASELINED'
          d['working_version']='1.21.791'
          d['candidate_version']='1.21.791'
          d['current_phase']='AUTHORITY_REBASELINE_SOURCE_IDENTITY_DRIFT'
          d['current_phase_status']='WORKING_SOURCE_AHEAD_OF_LAST_VERIFIED_RELEASE'
          d['source_identity_rebaseline_20260819']={
            'current_working_source_version':'1.21.791',
            'version_file':'1.21.791',
            'plugin_header':'1.21.791',
            'last_verified_formal_release':'1.21.789',
            'last_verified_formal_release_status':'PASS',
            'working_source_exact_reverification':'NOT_EXECUTED',
            'working_source_candidate_pass':'NOT_PROVEN',
            'p3_004':'DEFERRED_UNVERIFIED',
            'production_installed_version':'UNKNOWN',
            'production_write_by_rebaseline':0,
            'runtime_change_by_rebaseline':0,
            'schema_change_by_rebaseline':0,
            'version_bump_by_rebaseline':0,
            'main_promotion_by_rebaseline':0,
            'classification':['DOC_STATE_STALE'],
            'authority_documents':['docs/authority/RPD.md','docs/authority/SSOT.md','docs/authority/ACCEPTANCE_MATRIX.md']
          }
          d['product_failure']='NONE'
          d['project_block']='NONE'
          d['window_execution_block']='NONE'
          d['next_action']='VERIFY_1.21.791_CURRENT_SOURCE_EXACTLY_BEFORE_CANDIDATE_PASS_OR_RELEASE; P3-004_REMAINS_DEFERRED_UNVERIFIED'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python3 -m json.tool VF_PROJECT.json >/dev/null
          test "$(git diff --name-only)" = "VF_PROJECT.json"
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VF_PROJECT.json
          git commit -m 'chore(S01-C02): reconcile working source authority 1.21.791'
          git push origin HEAD:develop
          echo "OPS_AUTHORITY_COMMIT=$(git rev-parse HEAD)"
          echo 'RUNTIME_CHANGE=0'
          echo 'PRODUCTION_WRITE=0'
          echo 'MAIN_PROMOTION=0'
