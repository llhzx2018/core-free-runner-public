name: S01 Component Authority Reconcile

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/s01-component-authority-reconcile.yml'
      - 'requests/s01-component-authority-reconcile.txt'

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    env:
      PUSH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Checkout M3U8 develop
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: develop
          token: ${{ env.PUSH_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: m3u8

      - name: Reconcile M3U8 layered machine authority only
        working-directory: m3u8
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "1.25.3"
          grep -Fq ' * Version: 1.25.3' src/vf-tool-m3u8.php
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('VF_PROJECT.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['component_id']=='S01-C03'
          assert d.get('formal_release',{}).get('tag')=='v1.25.1'
          d['lifecycle']='WORKING_SOURCE_POST_DISTRIBUTION_RECONCILIATION'
          d['status']='WORKING_SOURCE_1_25_3_TAGGED_NOT_CURRENT_UPDATE_CHANNEL'
          d['working_version']='1.25.3'
          d['candidate_version']=None
          d['current_phase']='AUTHORITY_REBASELINE_POST_DISTRIBUTION_SOURCE_TAG'
          d['published_update_channel']={
            'status':'PASS_PUBLISHED_UPDATE_CHANNEL',
            'version':'1.25.2','tag':'v1.25.2','tag_target':'d13fa95047dee2eaa16a7e64bab74c7d06420de9',
            'from_versions':['1.25.1'],'core_updates_path':'projects/S01-C03.json',
            'core_updates_manifest_blob':'ba9de5b6b8d2dc780b3104d29ff22bfc390df20b',
            'asset_name':'vf-tools-m3u8_V1.25.2.zip','asset_bytes':3520025,
            'asset_sha256':'857eb4706f06a79b2eee0260fe144da7d8b6d43d2ab40fe310fcace3f72106bf',
            'runtime_files':546,'runtime_fingerprint':'dec3da20c89fb79df16f7fe233f7d0709270e1723bf9872adeb77380fc373548',
            'schema_from':'1.2.0','schema_to':'1.2.0','released_at':'2026-08-16T07:31:18Z',
            'production_write_by_publish_round':0,
            'distribution_note_last_observed_production':'1.25.1 / ACTIVE / OWNER-CONFIRMED AT THAT ROUND'
          }
          d['post_distribution_source_tag']={
            'version':'1.25.3','tag':'v1.25.3','tag_target':'4db0265c346dbabe91f206af33a16dba77bb2939',
            'purpose':'PRIVATE_ASSET_DOWNLOAD_BRIDGE_CORRECTIVE_SOURCE','current_core_updates_target':False,
            'formal_release_proof':'UNPROVEN_BY_CURRENT_AUTHORITY','production_proof':'NONE'
          }
          r=d.setdefault('source_identity_rebaseline_20260819',{})
          r.update({
            'current_working_source_version':'1.25.3','version_file':'1.25.3','plugin_header':'1.25.3',
            'package_profile_version':'1.25.2','plugin_manifest_version':'1.25.2',
            'bootstrap_formal_release':'1.25.1','published_update_channel':'1.25.2','current_source_tag':'1.25.3',
            'working_source_exact_reverification':'NOT_EXECUTED','working_source_candidate_pass':'NOT_PROVEN',
            'production_installed_version':'NOT_FRESHLY_READ_BACK','production_write_by_rebaseline':0,
            'runtime_change_by_rebaseline':0,'schema_change_by_rebaseline':0,'version_bump_by_rebaseline':0,
            'main_promotion_by_rebaseline':0,
            'classification':['DOC_STATE_STALE','INTERNAL_IDENTITY_DRIFT','TAG_NOT_EQUAL_DISTRIBUTION_CHANNEL']
          })
          r.pop('last_verified_formal_release',None); r.pop('last_verified_formal_release_status',None)
          d['return_to_vf_dev_required']=False
          d['current_project_block']='NONE'; d['window_execution_block']='NONE'
          d['next_action']='VERIFY_1.25.3_EXACT_SOURCE_AND_PRIVATE_ASSET_BRIDGE_BEFORE_ANY_CANDIDATE_OR_CHANNEL_PUBLISH'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python3 -m json.tool VF_PROJECT.json >/dev/null
          test "$(git diff --name-only)" = "VF_PROJECT.json"
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VF_PROJECT.json
          git commit -m 'chore(S01-C03): record 1.25.2 channel and 1.25.3 source tag'
          git push origin HEAD:develop
          echo "M3U8_LAYERED_AUTHORITY_COMMIT=$(git rev-parse HEAD)"

      - name: Checkout Ops develop
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: develop
          token: ${{ env.PUSH_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: ops

      - name: Reconcile Ops layered machine authority only
        working-directory: ops
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "1.21.791"
          grep -Fq ' * Version: 1.21.791' vf-ops.php
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('VF_PROJECT.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['component_id']=='S01-C02'
          assert d.get('formal_release',{}).get('tag')=='v1.21.789'
          d['lifecycle']='WORKING_SOURCE_POST_DISTRIBUTION_RECONCILIATION'
          d['status']='WORKING_SOURCE_1_21_791_TAGGED_NOT_CURRENT_UPDATE_CHANNEL'
          d['working_version']='1.21.791'
          d['candidate_version']=None
          d['current_phase']='AUTHORITY_REBASELINE_POST_DISTRIBUTION_SOURCE_TAG'
          d['current_phase_status']='WORKING_SOURCE_AHEAD_OF_PUBLISHED_UPDATE_CHANNEL'
          d['published_update_channel']={
            'status':'PASS_PUBLISHED_UPDATE_CHANNEL','version':'1.21.790','tag':'v1.21.790',
            'tag_target':'91bf324193095846a0ff546a9dca716daf44b4de','from_versions':['1.21.789'],
            'core_updates_path':'projects/S01-C02.json','core_updates_manifest_blob':'019c55820f4d7fadf131749e4a2c0fb3cc06aede',
            'asset_name':'vf-tools-ops_V1.21.790.zip','asset_bytes':3175301,
            'asset_sha256':'327cbf86b1bf568eeb59a9dc3ce9c5837906fae3bf79869e5ec346c251feea62',
            'runtime_files':888,'runtime_fingerprint':'5f5ec568311b1e4f02f62805377255dc942558da4ba2385b665d17606c046624',
            'schema_from':'6.0.0','schema_to':'6.0.0','released_at':'2026-08-16T06:57:47Z',
            'p3_004':'DEFERRED_UNVERIFIED','production_write_by_publish_round':0,
            'distribution_note_last_observed_production':'1.21.789 / ACTIVE / OWNER-CONFIRMED AT THAT ROUND'
          }
          d['post_distribution_source_tag']={
            'version':'1.21.791','tag':'v1.21.791','purpose':'PRIVATE_ASSET_DOWNLOAD_BRIDGE_CORRECTIVE_SOURCE',
            'current_core_updates_target':False,'formal_release_proof':'UNPROVEN_BY_CURRENT_AUTHORITY','production_proof':'NONE'
          }
          r=d.setdefault('source_identity_rebaseline_20260819',{})
          r.update({
            'current_working_source_version':'1.21.791','version_file':'1.21.791','plugin_header':'1.21.791',
            'bootstrap_formal_release':'1.21.789','published_update_channel':'1.21.790','current_source_tag':'1.21.791',
            'working_source_exact_reverification':'NOT_EXECUTED','working_source_candidate_pass':'NOT_PROVEN',
            'p3_004':'DEFERRED_UNVERIFIED','production_installed_version':'NOT_FRESHLY_READ_BACK',
            'production_write_by_rebaseline':0,'runtime_change_by_rebaseline':0,'schema_change_by_rebaseline':0,
            'version_bump_by_rebaseline':0,'main_promotion_by_rebaseline':0,
            'classification':['DOC_STATE_STALE','TAG_NOT_EQUAL_DISTRIBUTION_CHANNEL']
          })
          r.pop('last_verified_formal_release',None); r.pop('last_verified_formal_release_status',None)
          d['product_failure']='NONE'; d['project_block']='NONE'; d['window_execution_block']='NONE'
          d['next_action']='VERIFY_1.21.791_EXACT_SOURCE_AND_PRIVATE_ASSET_BRIDGE_BEFORE_ANY_CANDIDATE_OR_CHANNEL_PUBLISH; P3-004_REMAINS_DEFERRED_UNVERIFIED'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python3 -m json.tool VF_PROJECT.json >/dev/null
          test "$(git diff --name-only)" = "VF_PROJECT.json"
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VF_PROJECT.json
          git commit -m 'chore(S01-C02): record 1.21.790 channel and 1.21.791 source tag'
          git push origin HEAD:develop
          echo "OPS_LAYERED_AUTHORITY_COMMIT=$(git rev-parse HEAD)"
          echo 'RUNTIME_CHANGE=0'
          echo 'PRODUCTION_WRITE=0'
          echo 'MAIN_PROMOTION=0'
