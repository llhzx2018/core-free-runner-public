name: S01 R2 isolated immutable migration snapshot proof
on:
  push:
    branches: [task/s01-r2-m3u8-snapshot-20261102]
    paths:
      - '.github/workflows/s01-r2-m3u8-snapshot-20261102.yml'
      - 'lanes/s01-r2-m3u8-20261102/**'
permissions:
  contents: read
concurrency:
  group: s01-r2-m3u8-snapshot-20261102
  cancel-in-progress: false
env:
  TARGET_REPO: llhzx2018/vf-tools-m3u8
  TARGET_VERSION: 1.25.99
  TARGET_SHA: 98e5d683a2efe5816972e7f5478dd54aaf264d40
  TARGET_TREE: 94c5fd7d834ab29a40df971e0059c5a677797bb1
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Read trusted public harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: control
      - name: Identity and workflow scope preflight
        run: |
          set -Eeuo pipefail
          python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-r2-m3u8-20261102/spec.json --input control/.github/workflows/s01-r2-m3u8-snapshot-20261102.yml
          test "$GITHUB_REPOSITORY" = 'llhzx2018/core-free-runner-public'
      - name: Checkout exact private M3U8 candidate to ephemeral workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: 98e5d683a2efe5816972e7f5478dd54aaf264d40
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Verify exact candidate source and real PHP guard test
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          php -l target/src/includes/skin-seasonal.php
          php -l target/tests/skin-migration-snapshot-guard.php
          php -l target/tests/seasonal-empty-retry-wordpress.php
          php target/tests/skin-migration-snapshot-guard.php
          echo S01_R2_EXACT_SOURCE_PHP_PROOF=PASS
      - name: Isolated WordPress and MariaDB real-source fixture
        shell: bash
        run: bash control/lanes/s01-r2-m3u8-20261102/native.sh
      - name: Never persist private product source
        if: always()
        shell: bash
        run: rm -rf target
