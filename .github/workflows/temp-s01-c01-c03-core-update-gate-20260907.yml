name: S01 C01 C03 Core Update Gate

on:
  push:
    branches:
      - temp/s01-c01-c03-core-update-gate-20260907

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CORE_SHA: cc4ac7d5754811e842b2187b5cbf50c80f65ecce
      CORE_BASE: 2143253c1976427ad9987a31890a3b39a3408933
      THEME_SHA: 4c89a0b78b0ab767ab0b80c702a65d2ccc0f84f0
      THEME_TAG: v1.35.17
      THEME_ASSET: vf-tools-theme_V1.35.17.zip
      THEME_BYTES: '1805157'
      THEME_SHA256: 8ff759f180b80962a776b9fd5be2aff9454aeb15845072ccec74e2b331da862c
      THEME_RUNTIME_FILES: '445'
      THEME_RUNTIME_FP: 87230e72b3ba8e24905931097f414b5f23129cf79c889e611f496ef04e2a6a3f
      M3U8_SHA: c6d0bbb0392dfa59ab91b3b98d8a0258ca95f9bb
      M3U8_TAG: v1.25.26
      M3U8_ASSET: vf-tools-m3u8_V1.25.26.zip
      M3U8_BYTES: '3577579'
      M3U8_SHA256: 6c6c5961fceef4d8f42e6f6ad3fc5846643515fc1e8b420936e4852e866354dc
      M3U8_RUNTIME_FILES: '558'
      M3U8_RUNTIME_FP: 2fe9383b0baf374869edc4a238629c3441c4ec8da90e49176b1e6472571435b6

    steps:
      - name: Credential read-only boundary
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$READ_TOKEN"
          echo 'WRITE_TOKEN_USED=NO'
          echo 'PRODUCTION_WRITE_USED=NO'

      - name: Checkout exact core-updates candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CORE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: core

      - name: Exact two-manifest fence
        shell: bash
        run: |
          set -euo pipefail
          cd core
          test "$(git rev-parse HEAD)" = "$CORE_SHA"
          git cat-file -e "$CORE_BASE^{commit}"
          git diff --name-only "$CORE_BASE" HEAD | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          projects/S01-C01.json
          projects/S01-C03.json
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          echo PASS_EXACT_TWO_MANIFEST_FENCE

      - name: JSON and canonical manifest contract
        shell: bash
        run: |
          set -euo pipefail
          cd core
          jq -e . projects/S01-C01.json >/dev/null
          jq -e . projects/S01-C02.json >/dev/null
          jq -e . projects/S01-C03.json >/dev/null
          python3 scripts/check_manifest_contract.py >/tmp/manifest-contract.json
          jq -e '.status=="PASS"' /tmp/manifest-contract.json >/dev/null
          echo PASS_CANONICAL_MANIFEST_CONTRACT

      - name: Update Core PHP regression
        shell: bash
        run: |
          set -euo pipefail
          cd core
          find update-core/php -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/update-core-lint.log
          php update-core/php/tests/run.php
          echo PASS_UPDATE_CORE_PHP_REGRESSION

      - name: Exact S01 channel semantics
        shell: bash
        run: |
          set -euo pipefail
          cd core
          python3 - <<'PY'
          import json
          c1=json.load(open('projects/S01-C01.json'))
          c2=json.load(open('projects/S01-C02.json'))
          c3=json.load(open('projects/S01-C03.json'))
          assert c1['target_version']=='1.35.17'
          assert c1['release_tag']=='v1.35.17'
          assert c1['asset_name']=='vf-tools-theme_V1.35.17.zip'
          assert c1['asset_bytes']==1805157
          assert c1['asset_sha256']=='8ff759f180b80962a776b9fd5be2aff9454aeb15845072ccec74e2b331da862c'
          assert c1['runtime_files']==445
          assert c1['runtime_fingerprint']=='87230e72b3ba8e24905931097f414b5f23129cf79c889e611f496ef04e2a6a3f'
          assert c1['from_versions']==['1.35.8','1.35.9','1.35.10','1.35.11','1.35.12','1.35.13','1.35.14','1.35.15','1.35.16']
          assert c2['target_version']=='1.21.856'
          assert c2['asset_sha256']=='7989e1814051de7e7e5236b0b530836d2812a85482be8f6e7b0ec7a799ca9b96'
          assert c3['target_version']=='1.25.26'
          assert c3['release_tag']=='v1.25.26'
          assert c3['asset_name']=='vf-tools-m3u8_V1.25.26.zip'
          assert c3['asset_bytes']==3577579
          assert c3['asset_sha256']=='6c6c5961fceef4d8f42e6f6ad3fc5846643515fc1e8b420936e4852e866354dc'
          assert c3['runtime_files']==558 and c3['runtime_file_count']==558
          assert c3['runtime_fingerprint']=='2fe9383b0baf374869edc4a238629c3441c4ec8da90e49176b1e6472571435b6'
          assert c3['runtime_fingerprint_sha256']==c3['runtime_fingerprint']
          assert c3['physical_locator']=='vf-tool-m3u8/vf-tool-m3u8.php'
          assert c3['canonical_locator']=='vf-tools-m3u8/vf-tools-m3u8.php'
          assert c3['locator_cutover'] is False
          assert c3['schema_from']=='1.3.0' and c3['schema_to']=='1.3.0'
          assert c3['from_versions']==['1.25.20','1.25.21','1.25.22','1.25.23','1.25.24','1.25.25']
          assert 'migration remains CLOSED' in c3['notes']
          assert 'does not claim Production' in c1['notes'] and 'does not claim Production' in c3['notes']
          print('PASS_S01_EXACT_CHANNEL_SEMANTICS')
          PY

      - name: Live Theme Release authority
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh api repos/llhzx2018/vf-tools-theme/branches/main --jq '.commit.sha')" = "$THEME_SHA"
          test "$(gh api repos/llhzx2018/vf-tools-theme/git/ref/tags/$THEME_TAG --jq '.object.sha')" = "$THEME_SHA"
          gh api repos/llhzx2018/vf-tools-theme/releases/tags/$THEME_TAG > /tmp/theme-release.json
          test "$(jq -r '.draft' /tmp/theme-release.json)" = false
          test "$(jq -r '.prerelease' /tmp/theme-release.json)" = false
          test "$(jq -r --arg a "$THEME_ASSET" '.assets[]|select(.name==$a)|.size' /tmp/theme-release.json)" = "$THEME_BYTES"
          test "$(jq -r --arg a "$THEME_ASSET" '.assets[]|select(.name==$a)|.digest' /tmp/theme-release.json)" = "sha256:$THEME_SHA256"
          grep -Fq "Runtime files: $THEME_RUNTIME_FILES" /tmp/theme-release.json
          grep -Fq "Runtime fingerprint: $THEME_RUNTIME_FP" /tmp/theme-release.json
          echo PASS_LIVE_THEME_RELEASE_AUTHORITY

      - name: Live M3U8 Release authority
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh api repos/llhzx2018/vf-tools-m3u8/branches/main --jq '.commit.sha')" = "$M3U8_SHA"
          test "$(gh api repos/llhzx2018/vf-tools-m3u8/git/ref/tags/$M3U8_TAG --jq '.object.sha')" = "$M3U8_SHA"
          gh api repos/llhzx2018/vf-tools-m3u8/releases/tags/$M3U8_TAG > /tmp/m3u8-release.json
          test "$(jq -r '.draft' /tmp/m3u8-release.json)" = false
          test "$(jq -r '.prerelease' /tmp/m3u8-release.json)" = false
          test "$(jq -r --arg a "$M3U8_ASSET" '.assets[]|select(.name==$a)|.size' /tmp/m3u8-release.json)" = "$M3U8_BYTES"
          test "$(jq -r --arg a "$M3U8_ASSET" '.assets[]|select(.name==$a)|.digest' /tmp/m3u8-release.json)" = "sha256:$M3U8_SHA256"
          grep -Fq "Runtime files: $M3U8_RUNTIME_FILES" /tmp/m3u8-release.json
          grep -Fq "Runtime fingerprint: $M3U8_RUNTIME_FP" /tmp/m3u8-release.json
          echo PASS_LIVE_M3U8_RELEASE_AUTHORITY
