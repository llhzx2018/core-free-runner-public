name: S01 Final UX Runtime Authority Probe
on:
  push:
    branches: [temp/s01-final-ux-candidate-patch-20260907]
    paths: [.github/workflows/temp-s01-final-ux-runtime-authority-probe-20260907.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Compute exact released runtime authorities
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-tools-theme.git" c01
          git -C c01 checkout -q 6c30935c613802847d138097c63c3f73219ec02a
          cat > /tmp/theme-authority.php <<'PHP'
          <?php
          define('ABSPATH','/');
          class WP_Error { public function __construct(...$x){} }
          require $argv[1].'/src/inc/update/class-vf-theme-runtime-authority-v1.php';
          $s=VF_Theme_Runtime_Authority_V1::snapshot($argv[1].'/src');
          unset($s['files']);
          echo json_encode($s, JSON_UNESCAPED_SLASHES), "\n";
          PHP
          php /tmp/theme-authority.php c01 > /tmp/c01.json
          echo "C01_RUNTIME_FILES=$(jq -r '.file_count' /tmp/c01.json)"
          echo "C01_RUNTIME_FP=$(jq -r '.fingerprint_sha256' /tmp/c01.json)"

          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-tools-ops.git" c02
          git -C c02 checkout -q 3e873a80ff6d3defdc31a3d7b4f9574e8b84cfcb
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          root=Path('c02');rows=[]
          for p in root.rglob('*'):
            if not p.is_file() or p.is_symlink():continue
            rel=p.relative_to(root).as_posix();parts=rel.split('/')
            if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in parts):continue
            if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',rel,re.I):continue
            ok=(rel in {'vf-ops.php','uninstall.php'}) if '/' not in rel else parts[0] in {'includes','assets','languages','config'}
            if ok:rows.append((rel,p.read_bytes()))
          rows.sort();h=hashlib.sha256()
          for rel,b in rows:h.update((rel+'\0'+hashlib.sha256(b).hexdigest()+'\n').encode())
          print('C02_RUNTIME_FILES='+str(len(rows)));print('C02_RUNTIME_FP='+h.hexdigest())
          PY

          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-tools-m3u8.git" c03
          git -C c03 checkout -q 3a50a8557fbdb634f56ab6fd14a3d9072bd927c5
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          src=Path('c03/src');rows=[]
          for p in sorted(src.rglob('*'),key=lambda x:x.relative_to(src).as_posix()):
            if not p.is_file():continue
            rel=p.relative_to(src).as_posix();parts=rel.split('/');low=[x.lower() for x in parts];bn=parts[-1].lower()
            if any(x in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in low):continue
            if bn in {'readme.md','changelog.md','license','license.txt','package_profile.json'} or bn.endswith(('.sql','.sqlite','.sqlite3','.db','.log','.zip','.tar','.gz','.bak','.tmp')):continue
            ok=(rel in {'vf-tool-m3u8.php','uninstall.php','plugin-manifest.json','tool-settings.schema.json'}) if len(parts)==1 else parts[0] in {'admin','config','includes','public','templates','tools'}
            if ok:rows.append((rel,p.read_bytes()))
          h=hashlib.sha256()
          for rel,b in sorted(rows):h.update((rel+'\0'+hashlib.sha256(b).hexdigest()+'\n').encode())
          print('C03_RUNTIME_FILES='+str(len(rows)));print('C03_RUNTIME_FP='+h.hexdigest())
          PY
          echo 'PASS_S01_FINAL_UX_RUNTIME_AUTHORITY_PROBE'
