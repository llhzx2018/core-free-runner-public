name: TEMP S01 Update Refresh Runtime Authority
on:
  push:
    branches: [temp/s01-update-refresh-policy-gate-20260904]
    paths: ['.github/workflows/temp-s01-update-refresh-runtime-authority.yml']
permissions:
  contents: read
jobs:
  authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: fbdd766314d3f9abe8d1834343e8058d99167307
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: ops
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: af331956ebe3cf6847b0ef43209f84700c2c0dc3
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: m3base
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: 44ff4a658ed87af8746d7fc81244df80f24aa5c3
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: m3u8
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: a293009567c932310d19a310a8ea6361a2ef71c8
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: themebase
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 2db7feab0fa975bcadf01867a044983b51b17145
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: theme
      - name: Compute exact PHP Runtime Authority snapshots
        run: |
          set -Eeuo pipefail
          cat >/tmp/m3.php <<'PHP'
          <?php
          define('ABSPATH','/');
          if (!class_exists('WP_Error')) { class WP_Error { public function __construct(...$x){} } }
          final class VF_M3U8_Update_Contract_V1 { public const COMPONENT_ID='S01-C03'; public const RUNTIME_CONTRACT='VF_WP_COMPONENT_RUNTIME_AUTHORITY_V1'; }
          require $argv[1] . '/src/includes/update/class-vf-m3u8-runtime-authority-v1.php';
          $s=VF_M3U8_Runtime_Authority_V1::snapshot($argv[1].'/src');
          unset($s['files']); echo json_encode($s,JSON_UNESCAPED_SLASHES),"\n";
          PHP
          cat >/tmp/theme.php <<'PHP'
          <?php
          define('ABSPATH','/');
          if (!class_exists('WP_Error')) { class WP_Error { public function __construct(...$x){} } }
          require $argv[1] . '/src/inc/update/class-vf-theme-runtime-authority-v1.php';
          $s=VF_Theme_Runtime_Authority_V1::snapshot($argv[1].'/src');
          unset($s['files']); echo json_encode($s,JSON_UNESCAPED_SLASHES),"\n";
          PHP
          M3_BASE="$(php /tmp/m3.php m3base)"
          M3_CAND="$(php /tmp/m3.php m3u8)"
          TH_BASE="$(php /tmp/theme.php themebase)"
          TH_CAND="$(php /tmp/theme.php theme)"
          echo "M3U8_BASE_RUNTIME=$M3_BASE"
          echo "M3U8_CANDIDATE_RUNTIME=$M3_CAND"
          echo "THEME_BASE_RUNTIME=$TH_BASE"
          echo "THEME_CANDIDATE_RUNTIME=$TH_CAND"
          test "$(jq -r '.file_count' <<<"$M3_CAND")" = "$(( $(jq -r '.file_count' <<<"$M3_BASE") + 1 ))"
          test "$(jq -r '.file_count' <<<"$TH_CAND")" = "$(jq -r '.file_count' <<<"$TH_BASE")"
          test "$(jq -r '.file_count' <<<"$TH_BASE")" = '437'
          test "$(jq -r '.fingerprint_sha256' <<<"$TH_BASE")" = 'fd01891ba3f14c0f886788f7fadc5d4dcff5c795c07399fe74111a9d8ac1a2a5'
          test "$(jq -r '.file_count' <<<"$M3_BASE")" = '553'
          test "$(jq -r '.fingerprint_sha256' <<<"$M3_BASE")" = '6868e38a401bd3e672e1945d4e393903a11f9788ec73bb864b9fe48e25723196'
          echo PASS_BASE_MANIFEST_RUNTIME_AUTHORITIES
          echo "M3U8_TARGET_RUNTIME_FILES=$(jq -r '.file_count' <<<"$M3_CAND")"
          echo "M3U8_TARGET_RUNTIME_FP=$(jq -r '.fingerprint_sha256' <<<"$M3_CAND")"
          echo "THEME_TARGET_RUNTIME_FILES=$(jq -r '.file_count' <<<"$TH_CAND")"
          echo "THEME_TARGET_RUNTIME_FP=$(jq -r '.fingerprint_sha256' <<<"$TH_CAND")"
          echo PASS_S01_UPDATE_REFRESH_RUNTIME_AUTHORITY
