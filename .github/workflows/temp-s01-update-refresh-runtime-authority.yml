name: TEMP S01 Update Refresh Runtime Authority
on:
  push:
    branches: [temp/s01-update-refresh-policy-gate-20260904]
    paths: ['.github/workflows/temp-s01-update-refresh-runtime-authority.yml']
permissions:
  contents: read
jobs:
  authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: fbdd766314d3f9abe8d1834343e8058d99167307
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: ops
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: 44ff4a658ed87af8746d7fc81244df80f24aa5c3
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: m3u8
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 2db7feab0fa975bcadf01867a044983b51b17145
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: theme
      - name: Compute exact component runtime authorities
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re,json
          def auth(root, allowed_root, root_files, excluded_basenames):
              files={}
              for p in Path(root).rglob('*'):
                  if not p.is_file() or p.is_symlink(): continue
                  rel=p.relative_to(root).as_posix(); parts=rel.split('/'); base=parts[-1].lower()
                  if any(re.fullmatch(r'(?:\.git|\.github|tests?|docs?|evidence|private|tmp|temp|cache|logs?)',x,re.I) for x in parts): continue
                  if base in excluded_basenames: continue
                  if re.search(r'\.(?:sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',rel,re.I): continue
                  if '/' not in rel:
                      if rel not in root_files: continue
                  elif parts[0] not in allowed_root: continue
                  files[rel]=hashlib.sha256(p.read_bytes()).hexdigest()
              canonical=''.join(k+'\0'+files[k]+'\n' for k in sorted(files))
              return {'file_count':len(files),'fingerprint_sha256':hashlib.sha256(canonical.encode()).hexdigest()}
          ops=auth('ops',{'includes','assets','languages','config'},{'vf-ops.php','uninstall.php'},{'readme.md','changelog.md','license','license.txt'})
          m3=auth('m3u8/src',{'admin','config','includes','public','templates','tools'},{'vf-tool-m3u8.php','uninstall.php','plugin-manifest.json','tool-settings.schema.json'},{'readme.md','changelog.md','license','license.txt','package_profile.json'})
          th=auth('theme/src',{'inc','assets','config','languages','template-parts','templates'},{'style.css','functions.php','index.php'},{'readme.md','changelog.md','license','license.txt'})
          print('OPS_RUNTIME_AUTHORITY='+json.dumps(ops,separators=(',',':')))
          print('M3U8_RUNTIME_AUTHORITY='+json.dumps(m3,separators=(',',':')))
          print('THEME_RUNTIME_AUTHORITY='+json.dumps(th,separators=(',',':')))
          assert ops['file_count']==899
          assert m3['file_count']>=553
          assert th['file_count']==437
          print('PASS_S01_UPDATE_REFRESH_RUNTIME_AUTHORITY')
          PY
