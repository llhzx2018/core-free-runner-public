name: TEMP skill-book V5.1 Staging Validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-skill-book-v49-release.yml'
      - '.temp/v51/**'

permissions:
  contents: read

jobs:
  v51-staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout temporary runner
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Rebuild and verify exact implementation patch
        shell: bash
        run: |
          cat .temp/v51/seg00.xzpart .temp/v51/seg01.xzpart .temp/v51/seg02.xzpart .temp/v51/seg03.xzpart > /tmp/v51_impl.patch.xz
          echo 'd844df688abf7a67cfbadae4ed0ebb591d27dae9900dad4de6dbf148a83399db  /tmp/v51_impl.patch.xz' | sha256sum -c -
          xz -dc /tmp/v51_impl.patch.xz > /tmp/v51_impl.patch
          echo '59c90bbfb4e923d0d92c12c5e41b18934bc2f9aa0b54b4911c2147fe6462b0bc  /tmp/v51_impl.patch' | sha256sum -c -
      - name: Checkout GOV-DOC staging
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/gov-doc
          ref: release/skill-book-v51-source-20260828-staging
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          path: gov
          fetch-depth: 0
      - name: Apply exact V5.1 implementation
        shell: bash
        run: |
          set -euo pipefail
          cd gov
          rm -rf skills/skill-book/V5.1
          cp -a skills/skill-book/V5.0 skills/skill-book/V5.1
          cd skills/skill-book/V5.1
          git apply /tmp/v51_impl.patch
          test "$(cat VERSION)" = '5.1'
          grep -q 'SB51-RUNTIME-CONTRACT-A84E2C6D' SKILL.md
      - name: Validate V5.1 source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest
          cd gov
          PYTHONPYCACHEPREFIX=/tmp/v51pycache python - <<'PY'
          from pathlib import Path
          import py_compile
          fs=sorted(Path('skills/skill-book/V5.1').rglob('*.py'))
          for p in fs: py_compile.compile(str(p),doraise=True)
          print('PYTHON_SYNTAX_PASS',len(fs))
          PY
          python -m pytest --collect-only -q skills/skill-book/V5.1/tests | tail -n 1 | grep -q '69 tests collected'
          python -m pytest -q skills/skill-book/V5.1/tests
      - name: Commit and push staging only
        shell: bash
        env:
          GIT_AUTHOR_NAME: VictorForge
          GIT_AUTHOR_EMAIL: llhzx2018@gmail.com
          GIT_COMMITTER_NAME: VictorForge
          GIT_COMMITTER_EMAIL: llhzx2018@gmail.com
        run: |
          set -euo pipefail
          cd gov
          find skills/skill-book/V5.1 -type d \( -name __pycache__ -o -name .pytest_cache \) -prune -exec rm -rf {} +
          find skills/skill-book/V5.1 -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git add skills/skill-book/V5.1
          git diff --cached --quiet && { echo 'No V5.1 changes'; exit 1; }
          test "$(git diff --cached --name-only | grep -vc '^skills/skill-book/V5.1/')" -eq 0
          git commit -m 'skill-book: stage V5.1 implementation candidate'
          git push origin HEAD:release/skill-book-v51-source-20260828-staging
          echo "STAGING_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Remote readback
        shell: bash
        run: |
          cd gov
          git fetch origin release/skill-book-v51-source-20260828-staging
          test "$(git rev-parse origin/release/skill-book-v51-source-20260828-staging)" = "$STAGING_COMMIT"
          test "$(git show origin/release/skill-book-v51-source-20260828-staging:skills/skill-book/V5.1/VERSION)" = '5.1'
