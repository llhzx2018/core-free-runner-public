name: TEMP skill-book V4.9 Release

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/temp-skill-book-v49-release.yml']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout live GOV-DOC main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 1
          path: gov

      - name: Reconcile V4.9 published Candidate pointers
        working-directory: gov
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          python3 - <<'PY'
          from pathlib import Path

          current = Path('CURRENT.md')
          text = current.read_text(encoding='utf-8')
          old = "`skill-book V4.0/V4.1/V4.2/V4.3/V4.4/V4.5/V4.6/V4.7` 为保留的历史 Candidate，`V4.8` 为最新 Candidate；九者均未晋升 Source Current。V4.8 已进入 Candidate Distribution，但未进入 Current Distribution。"
          new = "`skill-book V4.0/V4.1/V4.2/V4.3/V4.4/V4.5/V4.6/V4.7/V4.8` 为保留的历史 Candidate，`V4.9` 为最新 Candidate；十者均未晋升 Source Current。V4.9 已进入 Candidate Distribution，但未进入 Current Distribution。"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('CURRENT_POINTER_TEXT_NOT_FOUND')
          current.write_text(text, encoding='utf-8')

          idx = Path('distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md')
          text = idx.read_text(encoding='utf-8')
          start = text.index('## Candidate（不改变 Current）')
          history = text.index('历史 Candidate：', start)
          block = '''## Candidate（不改变 Current）

`skill-book V4.9` 是最新 `CANDIDATE / NOT CURRENT`；Source Current仍为V3.5，且V4.9不包含在Current总包中。Installed Runtime Observation仍为V4.7 Candidate。

- [直接下载 skill-book V4.9 Candidate ZIP](https://github.com/llhzx2018/gov-doc/releases/download/skill-book-v4.9-candidate-20260827/skill-book_V4.9_CANDIDATE_20260827.zip)
- [下载 SHA-256 文件](https://github.com/llhzx2018/gov-doc/releases/download/skill-book-v4.9-candidate-20260827/skill-book_V4.9_CANDIDATE_20260827.zip.sha256)
- [查看 V4.9 Candidate Release](https://github.com/llhzx2018/gov-doc/releases/tag/skill-book-v4.9-candidate-20260827)
- [查看 V4.9 Candidate Source](https://github.com/llhzx2018/gov-doc/tree/main/skills/skill-book/V4.9)
- [查看 V4.9 Candidate Mother Overlay](https://github.com/llhzx2018/gov-doc/blob/main/mother-specs/skill-book/V4.9/SKILL_BOOK_V4.9_CANDIDATE_OVERLAY.md)
- [查看 V4.9 Candidate 分发说明](https://github.com/llhzx2018/gov-doc/blob/main/distribution/skills/candidates/skill-book/V4.9/README.md)

Published Distribution Identity：

- Bytes：`192842`
- SHA-256：`784d6fa971e6f81021e6d2c54f7e867712bf9d9d0fa89e8c7e7e9a5df9864b14`
- Release ID：`378148306`
- Remote Asset ID：`532921311`
- SHA Asset ID：`532921310`
- Exact Source Commit：`68e088b00f97c325cc7f44fae3fce0ad647341fd`
- Runner Run：`33120609680`
- Runner Job：`98686249201`
- Unit Tests：`44/44 PASS (full pytest collection on exact Source)`
- Python Syntax：`PASS`
- Local / Remote ZIP Identity：`MATCH`
- Remote Download Readback：`PASS`
- ZIP CRC / Unsafe Path / Duplicate Path / pycache：`PASS`
- Fresh V4.9 Runtime Forward Benchmark：`NOT_RUN`
- Real Reader Forward Evidence：`NOT_RUN`
- Current Promotion：`NOT_AUTHORIZED`
- Status：`PUBLISHED_REMOTE_VERIFIED`

V4.9 Candidate Publication仅完成分发闭环，不将Source Current从V3.5晋升，也不以机器PASS替代READ / LEARN / TRAIN / DO的真人Reader Outcome。

'''
          text = text[:start] + block + text[history:]
          marker = '历史 Candidate：\n\n'
          v48 = '- [skill-book V4.8](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.8)\n'
          if v48 not in text.split(marker,1)[1]:
              text = text.replace(marker, marker + v48, 1)
          idx.write_text(text, encoding='utf-8')

          c = current.read_text(encoding='utf-8')
          d = idx.read_text(encoding='utf-8')
          assert '| skill-book | V3.5 | V4.7 CANDIDATE（非 Current） |' in c
          assert '`V4.9` 为最新 Candidate' in c
          assert '`skill-book V4.9` 是最新 `CANDIDATE / NOT CURRENT`' in d
          assert 'Release ID：`378148306`' in d
          print('V49_POINTER_RECONCILIATION=PASS')
          PY
          git diff --check
          git add CURRENT.md distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = '2'
          git config user.name 'VF Governance Reconcile'
          git config user.email 'governance@kewaro.com'
          git commit -m 'skill-book: reconcile V4.9 published candidate pointers'
          git push origin HEAD:main

      - name: Verify remote reconciliation
        working-directory: gov
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main
          git show origin/main:CURRENT.md | grep -Fq '`V4.9` 为最新 Candidate'
          git show origin/main:CURRENT.md | grep -Fq '| skill-book | V3.5 | V4.7 CANDIDATE（非 Current） |'
          git show origin/main:distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md | grep -Fq '`skill-book V4.9` 是最新 `CANDIDATE / NOT CURRENT`'
          git show origin/main:distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md | grep -Fq 'Release ID：`378148306`'
          echo 'V49_GOVERNANCE_REMOTE_READBACK=PASS'
