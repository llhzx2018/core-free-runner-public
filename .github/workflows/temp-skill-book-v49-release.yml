name: TEMP skill-book V5.0 Governance Reconcile

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-skill-book-v49-release.yml'

permissions:
  contents: read

jobs:
  v50-governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout temporary runner
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
          path: runner

      - name: Checkout live GOV-DOC main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 1
          path: gov

      - name: Reconcile exactly two Candidate pointers
        working-directory: gov
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          current=Path('CURRENT.md')
          s=current.read_text(encoding='utf-8')
          old='`skill-book V4.0/V4.1/V4.2/V4.3/V4.4/V4.5/V4.6/V4.7/V4.8` 为保留的历史 Candidate，`V4.9` 为最新 Candidate；十者均未晋升 Source Current。V4.9 已进入 Candidate Distribution，但未进入 Current Distribution。'
          new='`skill-book V4.0/V4.1/V4.2/V4.3/V4.4/V4.5/V4.6/V4.7/V4.8/V4.9` 为保留的历史 Candidate，`V5.0` 为最新 Candidate；十一者均未晋升 Source Current。V5.0 已进入 Candidate Distribution，但未进入 Current Distribution。'
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new)
          assert '| skill-book | V3.5 | V4.7 CANDIDATE（非 Current） |' in s
          current.write_text(s,encoding='utf-8')

          idx=Path('distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md')
          t=idx.read_text(encoding='utf-8')
          marker='## Candidate（不改变 Current）\n'
          assert t.count(marker)==1
          prefix=t.split(marker,1)[0]
          tail='''## Candidate（不改变 Current）

`skill-book V5.0` 是最新 `CANDIDATE / NOT CURRENT`；Source Current仍为V3.5，且V5.0不包含在Current总包中。Installed Runtime Observation仍为V4.7 Candidate。

- [直接下载 skill-book V5.0 Candidate ZIP](https://github.com/llhzx2018/gov-doc/releases/download/skill-book-v5.0-candidate-20260827/skill-book_V5.0_CANDIDATE_20260827.zip)
- [下载 SHA-256 文件](https://github.com/llhzx2018/gov-doc/releases/download/skill-book-v5.0-candidate-20260827/skill-book_V5.0_CANDIDATE_20260827.zip.sha256)
- [查看 V5.0 Candidate Release](https://github.com/llhzx2018/gov-doc/releases/tag/skill-book-v5.0-candidate-20260827)
- [查看 V5.0 Candidate Source](https://github.com/llhzx2018/gov-doc/tree/main/skills/skill-book/V5.0)
- [查看 V5.0 Candidate Mother Overlay](https://github.com/llhzx2018/gov-doc/blob/main/mother-specs/skill-book/V5.0/SKILL_BOOK_V5.0_CANDIDATE_OVERLAY.md)
- [查看 V5.0 Candidate 分发说明](https://github.com/llhzx2018/gov-doc/blob/main/distribution/skills/candidates/skill-book/V5.0/README.md)

Published Distribution Identity：

- Bytes：`253866`
- SHA-256：`35b064da01ce86e3629c298e245cd2c8bb1d9dcbb94074a6743e95bbe79c99b8`
- Release ID：`378312515`
- Remote Asset ID：`533413133`
- SHA Asset ID：`533413134`
- Exact Source Commit：`36b64ea99ebe933de4bcf8efb956ead27c60c0a2`
- Runner Run：`33150244730`
- Runner Job：`98780294243`
- Unit Tests：`58/58 PASS (remote modular exact-source execution)`
- Python Syntax：`28/28 PASS`
- Local / Remote ZIP Identity：`MATCH`
- Remote Download Readback：`PASS`
- ZIP CRC / Unsafe Path / Duplicate Path / pycache：`PASS`
- Fresh V5.0 Runtime Forward Benchmark：`NOT_RUN`
- Real Reader Forward Evidence：`NOT_RUN`
- Current Promotion：`NOT_AUTHORIZED`
- Status：`PUBLISHED_REMOTE_VERIFIED`

V5.0 Candidate Publication仅完成分发闭环，不将Source Current从V3.5晋升，也不以机器PASS替代READ / LEARN / TRAIN / DO的真人Reader Outcome。

历史 Candidate：

- [skill-book V4.9](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.9)
- [skill-book V4.8](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.8)
- [skill-book V4.7](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.7)
- [skill-book V4.6](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.6)
- [skill-book V4.5](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.5)
- [skill-book V4.4](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.4)
- [skill-book V4.3](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.3)
- [skill-book V4.2](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.2)
- [skill-book V4.1](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.1)
- [skill-book V4.0](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.0)
'''
          idx.write_text(prefix+tail,encoding='utf-8')
          PY

          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" = '2'
          test "${changed[0]}" = 'CURRENT.md'
          test "${changed[1]}" = 'distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md'
          grep -Fq '`V5.0` 为最新 Candidate' CURRENT.md
          grep -Fq '`skill-book V5.0` 是最新 `CANDIDATE / NOT CURRENT`' distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md
          grep -Fq '| skill-book | V3.5 | V4.7 CANDIDATE（非 Current） |' CURRENT.md
          git config user.name 'VF Governance Reconcile'
          git config user.email 'governance@kewaro.com'
          git add CURRENT.md distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md
          git commit -m 'skill-book: reconcile V5.0 candidate pointers'
          git push origin HEAD:main

      - name: Remote readback
        working-directory: gov
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main
          git show origin/main:CURRENT.md | grep -Fq '`V5.0` 为最新 Candidate'
          git show origin/main:CURRENT.md | grep -Fq '| skill-book | V3.5 | V4.7 CANDIDATE（非 Current） |'
          git show origin/main:distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md | grep -Fq 'Release ID：`378312515`'
          git show origin/main:distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md | grep -Fq 'Remote Asset ID：`533413133`'
          echo V50_GOVERNANCE_RECONCILIATION=PASS

# v50-governance-trigger
