name: TEMP skill-book V4.9 Release

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/temp-skill-book-v49-release.yml']

permissions:
  contents: read

env:
  SOURCE_REPO: llhzx2018/gov-doc
  SOURCE_COMMIT: 68e088b00f97c325cc7f44fae3fce0ad647341fd
  SOURCE_PATH: skills/skill-book/V4.9
  TAG: skill-book-v4.9-candidate-20260827
  ASSET: skill-book_V4.9_CANDIDATE_20260827.zip
  SHA_ASSET: skill-book_V4.9_CANDIDATE_20260827.zip.sha256
  EXPECTED_BYTES: '192842'
  EXPECTED_SHA: 784d6fa971e6f81021e6d2c54f7e867712bf9d9d0fa89e8c7e7e9a5df9864b14

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Checkout exact private source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_COMMIT }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: source

      - name: Validate source and tests
        working-directory: source/skills/skill-book/V4.9
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ../../.. rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(tr -d '\r\n' < VERSION)" = '4.9'
          jq -e '.version=="4.9" and .status=="CANDIDATE_NOT_CURRENT" and .source_current_skill=="3.5" and .validation.python_unit_tests=="44/44 PASS (modular exact-source execution)" and .current_promotion=="NOT_AUTHORIZED"' MANIFEST.json >/dev/null
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/tests.txt"
          grep -Eq 'Ran 44 tests' "$RUNNER_TEMP/tests.txt"
          grep -Eq '^OK$' "$RUNNER_TEMP/tests.txt"
          python -m compileall -q scripts tests
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - name: Build and verify deterministic ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          SRC="source/$SOURCE_PATH" OUT="$RUNNER_TEMP/release/$ASSET" python3 - <<'PY'
          from pathlib import Path
          import os, zipfile
          src=Path(os.environ['SRC']); out=Path(os.environ['OUT'])
          files=sorted(p for p in src.rglob('*') if p.is_file() and '__pycache__' not in p.parts and p.suffix!='.pyc')
          assert len(files)==48, len(files)
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_STORED,strict_timestamps=True) as z:
              for p in files:
                  i=zipfile.ZipInfo('skill-book_V4.9_CANDIDATE/'+p.relative_to(src).as_posix(),date_time=(1980,1,1,0,0,0))
                  i.compress_type=zipfile.ZIP_STORED; i.create_system=3; i.external_attr=(0o100644<<16)
                  z.writestr(i,p.read_bytes())
          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None
              names=z.namelist(); assert len(names)==len(set(names))==48
              assert not any(n.startswith('/') or '..' in Path(n).parts or '__pycache__' in n or n.endswith('.pyc') for n in names)
          PY
          BYTES="$(stat -c%s "$RUNNER_TEMP/release/$ASSET")"
          SHA="$(sha256sum "$RUNNER_TEMP/release/$ASSET" | awk '{print $1}')"
          test "$BYTES" = "$EXPECTED_BYTES"
          test "$SHA" = "$EXPECTED_SHA"
          printf '%s  %s\n' "$SHA" "$ASSET" > "$RUNNER_TEMP/release/$SHA_ASSET"

      - name: Create prerelease and upload assets
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$RUNNER_TEMP/release/notes.md" <<EOF
          skill-book V4.9 Candidate / NOT CURRENT.

          Source authority: ${SOURCE_REPO}@${SOURCE_COMMIT}
          Source Current remains: skill-book V3.5
          Unit tests: 44/44 PASS (modular exact-source execution)
          Generation Responsibility Floor and Pre-Freeze Random Open + holdout added; V4.8 Runtime Truth Enforcement preserved.
          Fresh V4.9 Runtime Forward Benchmark: NOT_RUN
          Real Reader Forward Evidence: NOT_RUN
          Current Promotion: NOT_AUTHORIZED
          EOF
          if gh release view "$TAG" --repo "$SOURCE_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/release/$ASSET#$ASSET" "$RUNNER_TEMP/release/$SHA_ASSET#$SHA_ASSET" --repo "$SOURCE_REPO" --clobber
          else
            gh release create "$TAG" "$RUNNER_TEMP/release/$ASSET#$ASSET" "$RUNNER_TEMP/release/$SHA_ASSET#$SHA_ASSET" --repo "$SOURCE_REPO" --target "$SOURCE_COMMIT" --title 'skill-book V4.9 Candidate' --notes-file "$RUNNER_TEMP/release/notes.md" --prerelease
          fi

      - name: Remote readback and evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/readback"
          gh release download "$TAG" --repo "$SOURCE_REPO" --pattern "$ASSET" --pattern "$SHA_ASSET" --dir "$RUNNER_TEMP/readback"
          test "$(stat -c%s "$RUNNER_TEMP/readback/$ASSET")" = "$EXPECTED_BYTES"
          test "$(sha256sum "$RUNNER_TEMP/readback/$ASSET" | awk '{print $1}')" = "$EXPECTED_SHA"
          grep -Fq "$EXPECTED_SHA  $ASSET" "$RUNNER_TEMP/readback/$SHA_ASSET"
          gh api "repos/$SOURCE_REPO/releases/tags/$TAG" | jq -e --arg n "$ASSET" --arg d "sha256:$EXPECTED_SHA" '.prerelease==true and any(.assets[]; .name==$n and .size==192842 and .digest==$d)' >/dev/null
          gh api "repos/$SOURCE_REPO/releases/tags/$TAG" | jq '{id,tag_name,prerelease,assets:[.assets[]|{id,name,size,digest}]}'
