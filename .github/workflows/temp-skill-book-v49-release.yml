name: TEMP skill-book V5.0 Candidate Release

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-skill-book-v49-release.yml'

permissions:
  contents: read

jobs:
  v50-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout temporary runner
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
          path: runner

      - name: Checkout exact GOV-DOC Candidate source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/gov-doc
          ref: 36b64ea99ebe933de4bcf8efb956ead27c60c0a2
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: gov

      - name: Validate exact V5.0 source
        working-directory: gov
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '36b64ea99ebe933de4bcf8efb956ead27c60c0a2'
          python3 -m pip install --quiet pytest
          python3 - <<'PY'
          from pathlib import Path
          import py_compile
          root=Path('skills/skill-book/V5.0')
          files=list(root.rglob('*.py'))
          assert len(files)==28, len(files)
          for i,p in enumerate(files): py_compile.compile(str(p), cfile=f'/tmp/v50_rel_{i}.pyc', doraise=True)
          print('PYTHON_SYNTAX=PASS count=28')
          PY
          python3 -m pytest --collect-only -q skills/skill-book/V5.0/tests | tail -n 1 | grep -Fq '58 tests collected'
          python3 -m pytest -q skills/skill-book/V5.0/tests --ignore=skills/skill-book/V5.0/tests/test_runtime_acceptance_audit.py
          for t in test_good_evidence_truth_passes_when_runtime_writes_authority_path test_external_verifier_requires_runtime_evidence_file test_missing_invocation_receipt_blocks test_lowercase_manifest_mode_final_and_real_reader_are_enforced test_lowercase_sealed_without_baseline_blocks test_stale_canonical_evidence_blocks; do
            python3 -m pytest -q "skills/skill-book/V5.0/tests/test_runtime_acceptance_audit.py::T::$t"
          done
          echo V50_RELEASE_TESTS='58/58 PASS'

      - name: Build deterministic Candidate ZIP and verify identity
        working-directory: gov
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, zipfile, hashlib
          src=Path('skills/skill-book/V5.0')
          out=Path('../skill-book_V5.0_CANDIDATE_20260827.zip')
          tracked=subprocess.check_output(['git','ls-files','skills/skill-book/V5.0'], text=True).splitlines()
          assert len(tracked)==65, len(tracked)
          rels=sorted(Path(p).relative_to(src).as_posix() for p in tracked)
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_STORED) as z:
              for rel in rels:
                  data=(src/rel).read_bytes()
                  zi=zipfile.ZipInfo('skill-book_V5.0_CANDIDATE/'+rel, date_time=(1980,1,1,0,0,0))
                  zi.compress_type=zipfile.ZIP_STORED
                  zi.create_system=3
                  zi.external_attr=(0o100644 << 16)
                  z.writestr(zi,data)
          b=out.read_bytes(); h=hashlib.sha256(b).hexdigest()
          assert len(b)==253866, len(b)
          assert h=='35b064da01ce86e3629c298e245cd2c8bb1d9dcbb94074a6743e95bbe79c99b8', h
          Path('../skill-book_V5.0_CANDIDATE_20260827.zip.sha256').write_text(h+'  '+out.name+'\n', encoding='utf-8')
          with zipfile.ZipFile(out) as z: assert z.testzip() is None and len(z.infolist())==65
          print('V50_DETERMINISTIC_ZIP=PASS bytes=253866 sha256='+h)
          PY

      - name: Create prerelease and upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          TAG='skill-book-v5.0-candidate-20260827'
          ZIP='skill-book_V5.0_CANDIDATE_20260827.zip'
          SHA="$ZIP.sha256"
          if gh release view "$TAG" --repo llhzx2018/gov-doc >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" "$SHA" --repo llhzx2018/gov-doc --clobber
          else
            gh release create "$TAG" "$ZIP" "$SHA" --repo llhzx2018/gov-doc --target 36b64ea99ebe933de4bcf8efb956ead27c60c0a2 --title 'skill-book V5.0 Candidate' --prerelease --notes 'Candidate only; not Current. Source regression validation: 58/58 PASS (modular remote execution). Deterministic ZIP identity: 253866 bytes / SHA256 35b064da01ce86e3629c298e245cd2c8bb1d9dcbb94074a6743e95bbe79c99b8. Fresh V5.0 Runtime Forward Benchmark: NOT_RUN. Real Reader Evidence: NOT_RUN. Current Promotion: NOT_AUTHORIZED.'
          fi

      - name: Remote release readback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          TAG='skill-book-v5.0-candidate-20260827'
          rm -rf /tmp/v50-readback && mkdir -p /tmp/v50-readback
          gh release view "$TAG" --repo llhzx2018/gov-doc --json isPrerelease,targetCommitish,tagName | grep -Fq '"isPrerelease":true'
          gh release download "$TAG" --repo llhzx2018/gov-doc --pattern 'skill-book_V5.0_CANDIDATE_20260827.zip*' --dir /tmp/v50-readback
          test "$(stat -c%s /tmp/v50-readback/skill-book_V5.0_CANDIDATE_20260827.zip)" = '253866'
          echo '35b064da01ce86e3629c298e245cd2c8bb1d9dcbb94074a6743e95bbe79c99b8  /tmp/v50-readback/skill-book_V5.0_CANDIDATE_20260827.zip' | sha256sum -c -
          grep -Fxq '35b064da01ce86e3629c298e245cd2c8bb1d9dcbb94074a6743e95bbe79c99b8  skill-book_V5.0_CANDIDATE_20260827.zip' /tmp/v50-readback/skill-book_V5.0_CANDIDATE_20260827.zip.sha256
          echo V50_REMOTE_RELEASE_READBACK=PASS

# v50-release-trigger
