name: TEMP skill-book V5.1 Governance Reconcile

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-skill-book-v49-release.yml'

permissions:
  contents: read

jobs:
  v51-governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout temporary runner
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Checkout live GOV-DOC main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          path: gov
          fetch-depth: 0
      - name: Reconcile exactly two V5.1 pointers
        shell: bash
        run: |
          set -euo pipefail
          cd gov
          python - <<'PY'
          from pathlib import Path
          current=Path('CURRENT.md')
          s=current.read_text()
          old='`skill-book V4.0/V4.1/V4.2/V4.3/V4.4/V4.5/V4.6/V4.7/V4.8/V4.9` 为保留的历史 Candidate，`V5.0` 为最新 Candidate；十一者均未晋升 Source Current。V5.0 已进入 Candidate Distribution，但未进入 Current Distribution。'
          new='`skill-book V4.0/V4.1/V4.2/V4.3/V4.4/V4.5/V4.6/V4.7/V4.8/V4.9/V5.0` 为保留的历史 Candidate，`V5.1` 为最新 Candidate；十二者均未晋升 Source Current。V5.1 已进入 Candidate Distribution，但未进入 Current Distribution。'
          assert s.count(old)==1, s.count(old)
          current.write_text(s.replace(old,new))

          idx=Path('distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md')
          s=idx.read_text()
          marker='## Candidate（不改变 Current）\n'
          assert s.count(marker)==1
          prefix=s.split(marker,1)[0]
          block='''## Candidate（不改变 Current）

`skill-book V5.1` 是最新 `CANDIDATE / NOT CURRENT`；Source Current仍为V3.5，且V5.1不包含在Current总包中。Installed Runtime Observation仍为V4.7 Candidate。

- [直接下载 skill-book V5.1 Candidate ZIP](https://github.com/llhzx2018/gov-doc/releases/download/skill-book-v5.1-candidate-20260828/skill-book_V5.1_CANDIDATE_20260828.zip)
- [下载 SHA-256 文件](https://github.com/llhzx2018/gov-doc/releases/download/skill-book-v5.1-candidate-20260828/skill-book_V5.1_CANDIDATE_20260828.zip.sha256)
- [查看 V5.1 Candidate Release](https://github.com/llhzx2018/gov-doc/releases/tag/skill-book-v5.1-candidate-20260828)
- [查看 V5.1 Candidate Source](https://github.com/llhzx2018/gov-doc/tree/main/skills/skill-book/V5.1)
- [查看 V5.1 Candidate Mother Overlay](https://github.com/llhzx2018/gov-doc/blob/main/mother-specs/skill-book/V5.1/SKILL_BOOK_V5.1_CANDIDATE_OVERLAY.md)
- [查看 V5.1 Candidate 分发说明](https://github.com/llhzx2018/gov-doc/blob/main/distribution/skills/candidates/skill-book/V5.1/README.md)

Published Distribution Identity：

- Bytes：`282865`
- SHA-256：`e27105dc29cde170c99de32cba47e20e0474a4a9db4ded1e755131c7527f6031`
- Release ID：`378370703`
- Remote Asset ID：`533546180`
- SHA Asset ID：`533546178`
- Exact Source Commit：`bf6b7fd0720c921bc2ec50b07e0c951b62987f23`
- Source Validation Run / Job：`33157638104 / 98804131208`
- Release Run / Job：`33158223896 / 98806052441`
- Unit Tests：`69/69 PASS (remote exact-source execution)`
- Python Syntax：`30/30 PASS`
- Local / Remote ZIP Identity：`MATCH`
- Remote Download Readback：`PASS`
- ZIP CRC / Unsafe Path / Duplicate Path / pycache：`PASS`
- Fresh D1 V5.1 Runtime Forward Benchmark：`PASS_RUNTIME_ACCEPTANCE`
- D1 Baseline Applicability：`PASS_NOT_APPLICABLE_NEW_BOOK`
- D1 Reader Outcome：`BLOCK_REPLACEMENT` because Real Reader READ / LEARN / TRAIN are `NOT_RUN`
- Backend-installed V5.1 Runtime：`NOT_RUN`
- Current Promotion：`NOT_AUTHORIZED`
- Status：`PUBLISHED_REMOTE_VERIFIED`

V5.1 Candidate Publication仅完成分发闭环，不将Source Current从V3.5晋升；Fresh D1 machine Runtime PASS不替代READ / LEARN / TRAIN真人Reader Outcome。

历史 Candidate：

- [skill-book V5.0](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V5.0)
- [skill-book V4.9](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.9)
- [skill-book V4.8](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.8)
- [skill-book V4.7](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.7)
- [skill-book V4.6](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.6)
- [skill-book V4.5](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.5)
- [skill-book V4.4](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.4)
- [skill-book V4.3](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.3)
- [skill-book V4.2](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.2)
- [skill-book V4.1](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.1)
- [skill-book V4.0](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.0)
'''
          idx.write_text(prefix+block)
          PY
          changed="$(git diff --name-only)"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 2
          printf '%s\n' "$changed" | grep -qx 'CURRENT.md'
          printf '%s\n' "$changed" | grep -qx 'distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md'
          grep -q 'skill-book | V3.5 | V4.7 CANDIDATE' CURRENT.md
          grep -q '`skill-book V5.1` 是最新' distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md
      - name: Commit and push governance reconciliation
        shell: bash
        env:
          GIT_AUTHOR_NAME: VictorForge
          GIT_AUTHOR_EMAIL: llhzx2018@gmail.com
          GIT_COMMITTER_NAME: VictorForge
          GIT_COMMITTER_EMAIL: llhzx2018@gmail.com
        run: |
          set -euo pipefail
          cd gov
          git add CURRENT.md distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m 'skill-book: reconcile V5.1 candidate distribution'
          git push origin HEAD:main
          echo "GOV_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Remote readback
        shell: bash
        run: |
          set -euo pipefail
          cd gov
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GOV_COMMIT"
          git show origin/main:CURRENT.md | grep -q '`V5.1` 为最新 Candidate'
          git show origin/main:CURRENT.md | grep -q 'skill-book | V3.5 | V4.7 CANDIDATE'
          git show origin/main:distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md | grep -q '`skill-book V5.1` 是最新'

# synchronize trigger
