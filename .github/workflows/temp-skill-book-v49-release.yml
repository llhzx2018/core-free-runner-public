name: TEMP skill-book V5.0 Staging Patch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-skill-book-v49-release.yml'
      - 'temp/v50_skill.patch'

permissions:
  contents: read

jobs:
  v50-staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout temporary carrier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
          path: runner

      - name: Checkout GOV-DOC V5.0 staging
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/gov-doc
          ref: release/skill-book-v50-source-20260827-staging
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 1
          path: gov

      - name: Apply exact V5.0 SKILL patch
        working-directory: gov
        shell: bash
        run: |
          set -Eeuo pipefail
          git apply --check ../runner/temp/v50_skill.patch
          git apply ../runner/temp/v50_skill.patch
          test "$(git status --short skills/skill-book/V5.0 | wc -l | tr -d ' ')" = '1'
          test "$(git status --short skills/skill-book/V5.0/SKILL.md | wc -l | tr -d ' ')" = '1'
          echo V50_SKILL_PATCH_APPLY=PASS

      - name: Validate V5.0 exact staging source
        working-directory: gov
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import py_compile
          root=Path('skills/skill-book/V5.0')
          files=list(root.rglob('*.py'))
          assert len(files)==28, len(files)
          for i,p in enumerate(files): py_compile.compile(str(p), cfile=f'/tmp/v50_{i}.pyc', doraise=True)
          print('PYTHON_SYNTAX=PASS count=28')
          PY
          python3 -m pytest --collect-only -q skills/skill-book/V5.0/tests | tail -n 1 | grep -Fq '58 tests collected'
          python3 -m pytest -q skills/skill-book/V5.0/tests --ignore=skills/skill-book/V5.0/tests/test_runtime_acceptance_audit.py
          for t in test_good_evidence_truth_passes_when_runtime_writes_authority_path test_external_verifier_requires_runtime_evidence_file test_missing_invocation_receipt_blocks test_lowercase_manifest_mode_final_and_real_reader_are_enforced test_lowercase_sealed_without_baseline_blocks test_stale_canonical_evidence_blocks; do python3 -m pytest -q "skills/skill-book/V5.0/tests/test_runtime_acceptance_audit.py::$t"; done
          echo V50_SOURCE_TESTS='58/58 PASS modular execution'

      - name: Commit SKILL and verify exact identity
        working-directory: gov
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git status --short skills/skill-book/V5.0 | wc -l | tr -d ' ')" = '1'
          git add skills/skill-book/V5.0/SKILL.md
          git config user.name 'VF Skill Source Staging'
          git config user.email 'governance@kewaro.com'
          git commit -m 'skill-book: complete V5.0 staging source'
          git push origin HEAD:release/skill-book-v50-source-20260827-staging

      - name: Verify remote staging readback
        working-directory: gov
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin release/skill-book-v50-source-20260827-staging
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/release/skill-book-v50-source-20260827-staging)"
          git show origin/release/skill-book-v50-source-20260827-staging:skills/skill-book/V5.0/VERSION | grep -Fxq '5.0'
          git show origin/release/skill-book-v50-source-20260827-staging:skills/skill-book/V5.0/SKILL.md | grep -Fq 'skill-book V5.0 Candidate'
          echo V50_REMOTE_STAGING_READBACK=PASS

# v50-skill-patch-trigger-7
