name: TEMP skill-book V5.0 Staging Patch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-skill-book-v49-release.yml'
      - 'temp/v50_patch.tar.gz.b64'

permissions:
  contents: read

jobs:
  v50-staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout temporary carrier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
          path: runner

      - name: Checkout GOV-DOC V5.0 staging
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/gov-doc
          ref: release/skill-book-v50-source-20260827-staging
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 1
          path: gov

      - name: Verify and apply exact V5.0 patch carrier
        shell: bash
        run: |
          set -Eeuo pipefail
          base64 -d runner/temp/v50_patch.tar.gz.b64 > /tmp/v50_patch.tar.gz
          echo 'b0dcacea3b3319c5e1e3ade3b50823d834c940ea5e9b867f2449fa6e8e484983  /tmp/v50_patch.tar.gz' | sha256sum -c -
          test "$(tar -tzf /tmp/v50_patch.tar.gz | wc -l | tr -d ' ')" = '37'
          if tar -tzf /tmp/v50_patch.tar.gz | grep -E '(^/|(^|/)\.\.(/|$))'; then
            echo UNSAFE_PATCH_PATH
            exit 1
          fi
          tar -xzf /tmp/v50_patch.tar.gz -C gov/skills/skill-book/V5.0
          cd gov
          git diff --check
          test "$(git status --short skills/skill-book/V5.0 | wc -l | tr -d ' ')" = '37'
          echo V50_PATCH_APPLY=PASS

      - name: Validate V5.0 exact staging source
        working-directory: gov/skills/skill-book/V5.0
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import pathlib, py_compile, tempfile
          files = sorted(pathlib.Path('.').rglob('*.py'))
          with tempfile.TemporaryDirectory() as td:
              for p in files:
                  out = pathlib.Path(td) / (str(p).replace('/', '__') + '.pyc')
                  py_compile.compile(str(p), cfile=str(out), doraise=True)
          print('PYTHON_SYNTAX_PASS=' + str(len(files)))
          PY
          test "$(pytest --collect-only -q tests | grep -Eo '[0-9]+ tests collected' | tail -1 | awk '{print $1}')" = '58'
          pytest -q \
            tests/test_adequacy_audit.py \
            tests/test_book_regression_audit.py \
            tests/test_generation_depth_audit.py \
            tests/test_generation_responsibility_audit.py \
            tests/test_postdraft_baseline_audit.py \
            tests/test_prefreeze_random_open_audit.py \
            tests/test_reader_outcome_audit.py \
            tests/test_operational_closure_audit.py \
            tests/test_training_feedback_audit.py \
            tests/test_canonical_evidence_promotion.py \
            tests/test_strict_holdout_receipt_audit.py \
            tests/test_shadow_local_value_audit.py \
            tests/test_skill_contract.py
          for t in \
            test_good_evidence_truth_passes_when_runtime_writes_authority_path \
            test_external_verifier_requires_runtime_evidence_file \
            test_missing_invocation_receipt_blocks \
            test_lowercase_manifest_mode_final_and_real_reader_are_enforced \
            test_lowercase_sealed_without_baseline_blocks \
            test_stale_canonical_evidence_blocks
          do
            pytest -q "tests/test_runtime_acceptance_audit.py::RuntimeAcceptanceAuditTests::$t"
          done
          echo V50_SOURCE_TESTS='58/58 PASS (modular exact-source execution)'

      - name: Commit only V5.0 staging source
        working-directory: gov
        shell: bash
        run: |
          set -Eeuo pipefail
          git add skills/skill-book/V5.0
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = '37'
          git config user.name 'VF Skill Source Staging'
          git config user.email 'governance@kewaro.com'
          git commit -m 'skill-book: implement V5.0 candidate source gates'
          git push origin HEAD:release/skill-book-v50-source-20260827-staging

      - name: Verify remote staging readback
        working-directory: gov
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin release/skill-book-v50-source-20260827-staging
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/release/skill-book-v50-source-20260827-staging)"
          test "$(git show origin/release/skill-book-v50-source-20260827-staging:skills/skill-book/V5.0/VERSION)" = '5.0'
          git show origin/release/skill-book-v50-source-20260827-staging:skills/skill-book/V5.0/SKILL.md | grep -Fq 'SB50-RUNTIME-CONTRACT-73C1A9E4'
          git show origin/release/skill-book-v50-source-20260827-staging:skills/skill-book/V5.0/validation/SKILL_SELF_TEST.md | grep -Fq '58/58 PASS (modular execution)'
          echo V50_STAGING_REMOTE_READBACK=PASS
