name: TEMP skill-book V5.1 Candidate Release

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-skill-book-v49-release.yml'

permissions:
  contents: read

jobs:
  v51-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout temporary runner
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout exact GOV-DOC Candidate source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/gov-doc
          ref: bf6b7fd0720c921bc2ec50b07e0c951b62987f23
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          path: gov
          fetch-depth: 0

      - name: Validate exact V5.1 source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest
          cd gov
          test "$(git rev-parse HEAD)" = 'bf6b7fd0720c921bc2ec50b07e0c951b62987f23'
          test "$(cat skills/skill-book/V5.1/VERSION)" = '5.1'
          grep -q 'SB51-RUNTIME-CONTRACT-A84E2C6D' skills/skill-book/V5.1/SKILL.md
          PYTHONPYCACHEPREFIX=/tmp/v51pycache python - <<'PY'
          from pathlib import Path
          import py_compile
          fs=sorted(Path('skills/skill-book/V5.1').rglob('*.py'))
          assert len(fs)==30, len(fs)
          for p in fs: py_compile.compile(str(p),doraise=True)
          print('PYTHON_SYNTAX_PASS',len(fs))
          PY
          python -m pytest --collect-only -q skills/skill-book/V5.1/tests | tail -n 1 | grep -q '69 tests collected'
          python -m pytest -q skills/skill-book/V5.1/tests

      - name: Build deterministic Candidate ZIP and verify identity
        shell: bash
        run: |
          set -euo pipefail
          cd gov
          git ls-files skills/skill-book/V5.1 | sort > /tmp/v51-files.txt
          test "$(wc -l < /tmp/v51-files.txt)" -eq 70
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZipInfo, ZIP_STORED
          root=Path('skills/skill-book/V5.1')
          out=Path('/tmp/skill-book_V5.1_CANDIDATE_20260828.zip')
          tracked=[]
          for line in Path('/tmp/v51-files.txt').read_text().splitlines():
              p=Path(line)
              rel=p.relative_to(root).as_posix()
              tracked.append((rel,p))
          assert len(tracked)==70
          with ZipFile(out,'w',compression=ZIP_STORED) as z:
              for rel,p in tracked:
                  info=ZipInfo(f'skill-book_V5.1_CANDIDATE/{rel}',(1980,1,1,0,0,0))
                  info.compress_type=ZIP_STORED
                  info.create_system=3
                  info.external_attr=(0o100644 << 16)
                  z.writestr(info,p.read_bytes())
          PY
          test "$(stat -c %s /tmp/skill-book_V5.1_CANDIDATE_20260828.zip)" = '282865'
          echo 'e27105dc29cde170c99de32cba47e20e0474a4a9db4ded1e755131c7527f6031  /tmp/skill-book_V5.1_CANDIDATE_20260828.zip' | sha256sum -c -
          printf '%s  %s\n' 'e27105dc29cde170c99de32cba47e20e0474a4a9db4ded1e755131c7527f6031' 'skill-book_V5.1_CANDIDATE_20260828.zip' > /tmp/skill-book_V5.1_CANDIDATE_20260828.zip.sha256
          python - <<'PY'
          from zipfile import ZipFile
          p='/tmp/skill-book_V5.1_CANDIDATE_20260828.zip'
          with ZipFile(p) as z:
              assert len(z.infolist())==70
              assert z.testzip() is None
              for i in z.infolist():
                  assert i.compress_type==0
                  assert i.date_time==(1980,1,1,0,0,0)
                  assert (i.external_attr>>16)==0o100644
                  assert '..' not in i.filename.split('/') and not i.filename.startswith('/')
          print('ZIP_CONTAINER_PASS')
          PY

      - name: Create prerelease and upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          TAG='skill-book-v5.1-candidate-20260828'
          REPO='llhzx2018/gov-doc'
          ZIP='/tmp/skill-book_V5.1_CANDIDATE_20260828.zip'
          SHA='/tmp/skill-book_V5.1_CANDIDATE_20260828.zip.sha256'
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" "$SHA" --repo "$REPO" --clobber
          else
            gh release create "$TAG" "$ZIP" "$SHA" --repo "$REPO" --target 'bf6b7fd0720c921bc2ec50b07e0c951b62987f23' --title 'skill-book V5.1 Candidate' --prerelease --notes 'Candidate only; not Current. Source regression validation: 69/69 PASS (remote exact-source execution). Fresh D1 V5.1 Runtime Forward Benchmark: PASS_RUNTIME_ACCEPTANCE with PASS_NOT_APPLICABLE_NEW_BOOK. D1 Reader Outcome remains BLOCK_REPLACEMENT because real-reader READ/LEARN/TRAIN are NOT_RUN. Deterministic ZIP identity: 282865 bytes / SHA256 e27105dc29cde170c99de32cba47e20e0474a4a9db4ded1e755131c7527f6031. Backend-installed V5.1 Runtime: NOT_RUN. Current Promotion: NOT_AUTHORIZED.'
          fi

      - name: Remote release readback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          TAG='skill-book-v5.1-candidate-20260828'
          REPO='llhzx2018/gov-doc'
          rm -rf /tmp/v51-readback && mkdir -p /tmp/v51-readback
          gh release download "$TAG" --repo "$REPO" --dir /tmp/v51-readback --pattern 'skill-book_V5.1_CANDIDATE_20260828.zip'
          test "$(stat -c %s /tmp/v51-readback/skill-book_V5.1_CANDIDATE_20260828.zip)" = '282865'
          echo 'e27105dc29cde170c99de32cba47e20e0474a4a9db4ded1e755131c7527f6031  /tmp/v51-readback/skill-book_V5.1_CANDIDATE_20260828.zip' | sha256sum -c -
          gh release view "$TAG" --repo "$REPO" --json tagName,isPrerelease,targetCommitish,assets
