name: TEMP S01-C02 1.21.920 compatibility reachability proof

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temp-s01-c02-121920-compat-reachability.yml'

permissions:
  contents: read

jobs:
  exact-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact VF Tools Ops source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 5cc2e78caf8f512a4bb48e8e2fce86cb7a3d4311
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact source identity
        shell: bash
        run: |
          set -euo pipefail
          cd source
          test "$(git rev-parse HEAD)" = "5cc2e78caf8f512a4bb48e8e2fce86cb7a3d4311"
          test "$(cat VERSION)" = "1.21.920"
          grep -Fq "VF_OPS_ROUND', 'S01-COMPAT-SURFACE-REACHABILITY-R31'" vf-ops.php

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l source/includes/admin-v13/route-contract.php
          php -l source/includes/views/admin-shell-tabs-parts/02-shell-navigation.php
          php -l source/vf-ops.php
          php -l source/tests/s01-c02-121920-compat-surface-reachability-r31-contract.php

      - name: Compatibility reachability regression
        shell: bash
        run: |
          set -euo pipefail
          php source/tests/s01-c02-121920-compat-surface-reachability-r31-contract.php
