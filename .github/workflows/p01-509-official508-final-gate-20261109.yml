name: P01 509 exact-source Chromium Canonical official508 Atomic gate
on:
  push:
    branches:
      - task/p01-509-official508-final-gate-20261109
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      NEWS_SHA: 46e3661dfd61467ae1eeb9c3bfa777a98b28df6e
      PRODUCT_SHA: 46e3661dfd61467ae1eeb9c3bfa777a98b28df6e
      CHANNEL_SHA: 852e581ee03730f73a67f08349d57911b18be531
      P01_NEWS_R5_TARGET_VERSION: "2.47.509"
      VF_NEWS_R5_TARGET_VERSION: "2.47.509"
      VF_NEWS_R5_SANDBOX: "1"
      P01_BASE508_OUTPUT: /tmp/p01-news509-realbase-46e3661dfd/build508
    steps:
      - name: Checkout current registered public builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Transient private 509 exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.NEWS_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p01-exact
          persist-credentials: false
          fetch-depth: 2
      - name: Transient private channel 508 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.CHANNEL_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p01-channel
          persist-credentials: false
      - name: Prepare PHP and binary ZIP runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-xml php-mbstring php-zip php-gd unzip zip jq >/dev/null
          test "$(git -C p01-exact rev-parse HEAD)" = "$NEWS_SHA"
          test "$(git -C p01-channel rev-parse HEAD)" = "$CHANNEL_SHA"
          test "$(cat p01-channel/VERSION)" = "2.47.508"
          test "$(cat p01-exact/VERSION)" = "2.47.509"
          test "$(cat p01-exact/src/VERSION.txt)" = "2.47.509"
          grep -Fx "define('VF_VERSION', '2.47.509');" p01-exact/src/app/bootstrap.php
          php -l p01-exact/src/app/NewsFeedService.php >/dev/null
          php -l p01-exact/src/app/ChannelLibraryPage.php >/dev/null
          echo P01_509_INTEGRATED_PRODUCT_IDENTITY=PASS
      - name: Verify exact source ancestry and channel/news unchanged blobs
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p01-exact rev-list --parents -n 1 HEAD | awk '{print $3}')" = "$CHANNEL_SHA"
          for file in src/app/ChannelLibraryPage.php tests/integration/p01_channels_video_pagination_browser.mjs tests/integration/p01_channels_video_pagination_disposable_fixture.php tests/unit/channels_guest_readonly_layout_v247390_contract.php tests/unit/p01_channels_video_independent_pagination_native.php; do
            test "$(git -C p01-exact rev-parse HEAD:"$file")" = "$(git -C p01-channel rev-parse HEAD:"$file")"
          done
          php p01-exact/tests/unit/p01_channels_video_independent_pagination_native.php
          php p01-exact/tests/unit/p01_news_cross_source_dedup_native.php
          php p01-exact/tests/unit/p01_news_feed_service_contract.php
          php p01-exact/tests/unit/p01_news_source_preferences_contract.php
          php p01-exact/tests/unit/p01_news_release_surface_contract.php
          echo P01_509_NEWS_AND_CHANNEL_EXACT_SCOPED_CONTRACTS=PASS
      - name: Actual formal v508 baseline FULL and Atomic remote SHA verification
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          root="$(dirname "$P01_BASE508_OUTPUT")"
          mkdir -p "$P01_BASE508_OUTPUT"
          gh release download v2.47.508 -R llhzx2018/vf-start -D "$P01_BASE508_OUTPUT" -p 'VF-Start-V2.47.508-FULL.zip' -p 'VF_Start_V2.47.508_UPDATE.zip'
          echo 'e9d184f7527cd1f4c195df9992aae54be371d31a702c94258b4ebef34716b06d  '"$P01_BASE508_OUTPUT"'/VF-Start-V2.47.508-FULL.zip' | sha256sum -c -
          echo '12114db75f4cd816a56055be59d1ef3a90384eb5336cc8abea08d82991824b26  '"$P01_BASE508_OUTPUT"'/VF_Start_V2.47.508_UPDATE.zip' | sha256sum -c -
          unzip -t "$P01_BASE508_OUTPUT/VF-Start-V2.47.508-FULL.zip" >/dev/null
          unzip -t "$P01_BASE508_OUTPUT/VF_Start_V2.47.508_UPDATE.zip" >/dev/null
          echo P01_508_FORMAL_BASELINE_ASSETS_VERIFIED=PASS
      - name: Adapt only disposable prior 505-era fixture for current 508 baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path("p01-exact/tests/integration/p01_news_r5_atomic_package_gate.sh").read_text()
          for old in ["FROM=2.47.505","CANDIDATE_VERSION=2.47.506",'case "$TO" in 2.99.999|2.47.506)']:
              assert src.count(old)==1,old
          src=src.replace("FROM=2.47.505","FROM=2.47.508")
          src=src.replace("CANDIDATE_VERSION=2.47.506","CANDIDATE_VERSION=2.47.509")
          src=src.replace('case "$TO" in 2.99.999|2.47.506)', 'case "$TO" in 2.47.509)')
          old='gh release download "v$FROM" -R llhzx2018/vf-start -D "$WORK" \\\n  -p "VF-Start-V$FROM-FULL.zip" -p "VF_Start_V$FROM""_UPDATE.zip"'
          replacement='cp "$P01_BASE508_OUTPUT/VF-Start-V2.47.508-FULL.zip" "$WORK/"\ncp "$P01_BASE508_OUTPUT/VF_Start_V2.47.508_UPDATE.zip" "$WORK/"'
          assert src.count(old)==1,"old official baseline download anchor"
          src=src.replace(old,replacement)
          src=src.replace("P01_NEWS_R5_EXACT_505_TO_506_FULL_ATOMIC_BACKUP_RESTORE", "P01_NEWS_R5_EXACT_508_TO_509_FULL_ATOMIC_BACKUP_RESTORE")
          Path("/tmp/p01-news509-package-gate.sh").write_text(src)
          path=Path("p01-exact/tests/integration/p01_news_r5_lifecycle_native.php")
          helper=path.read_text()
          old="!is_file($resolved.'/news.php')"
          assert helper.count(old)==1
          helper=helper.replace(old,"is_file($resolved.'/news.php')")
          old="news_r5_assert($prefs['followed']===['solidot-tech'] && $prefs['enabled']===['cn-live','solidot-tech'],'preferences-retained');"
          new="news_r5_assert($prefs['followed']===['solidot-tech'] && count($prefs['enabled'])===2 && in_array('cn-live',$prefs['enabled'],true) && in_array('solidot-tech',$prefs['enabled'],true),'preferences-retained');"
          assert helper.count(old)==1
          path.write_text(helper.replace(old,new))
          print("P01_509_DISPOSABLE_FIXTURE_ADAPTATION=PASS")
          PY
      - name: Real 508 to 509 atomic package FULL install backup restore and rollback
        shell: bash
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          test "$(git -C p01-exact rev-parse HEAD)" = "$NEWS_SHA"
          bash /tmp/p01-news509-package-gate.sh | tee /tmp/p01-news509-gate-receipt.txt
          grep -Fx 'P01_NEWS_R5_EXACT_508_TO_509_FULL_ATOMIC_BACKUP_RESTORE=PASS' /tmp/p01-news509-gate-receipt.txt
          echo P01_509_FROM_508_INSTALL_UPGRADE_BACKUP_ROLLBACK=PASS
          echo P01_509_RELEASED_TO_PRODUCTION=NO
      - name: 509 exact owner/guest Chromium and zero-regression Canonical
        shell: bash
        timeout-minutes: 14
        env:
          VF_NEWS_BROWSER_MODULE: /tmp/p01-news509-browser-module
          PLAYWRIGHT_BROWSERS_PATH: /tmp/p01-news509-browsers
          VF_NEWS_TEST_ROOT: p01-exact
        run: |
          set -Eeuo pipefail
          sudo apt-get install -y -qq nodejs npm >/dev/null
          node --check p01-exact/tests/browser/p01_news_r4_chromium.cjs
          node --check p01-exact/src/assets/news-feed.js
          node --check p01-exact/src/assets/news-preferences.js
          mkdir -p "$VF_NEWS_BROWSER_MODULE" "$PLAYWRIGHT_BROWSERS_PATH"
          npm install --no-audit --no-fund --silent --prefix "$VF_NEWS_BROWSER_MODULE" playwright@1.56.1
          "$VF_NEWS_BROWSER_MODULE/node_modules/.bin/playwright" install chromium-headless-shell
          node p01-exact/tests/browser/p01_news_r4_chromium.cjs | tee /tmp/p01-news509-browser.txt
          grep -E '^P01_NEWS_R4_CHROMIUM=PASS checks=[0-9]+$' /tmp/p01-news509-browser.txt
          bash p01-exact/tests/canonical_release_regression.sh p01-exact p01-channel --require-zero-debt | tee /tmp/p01-news509-canonical.txt
          grep -Fx 'P01_CANONICAL_NEW_REGRESSION_COUNT=0' /tmp/p01-news509-canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/p01-news509-canonical.txt
          echo P01_509_EXACT_CHROMIUM_AND_CANONICAL=PASS
      - name: Remove transient source and private test data
        if: always()
        shell: bash
        run: |
          rm -rf p01-exact p01-channel /tmp/p01-news509-package-gate.sh /tmp/p01-news509-gate-receipt.txt /tmp/p01-news509-browser.txt /tmp/p01-news509-canonical.txt /tmp/p01-news509-browser-module /tmp/p01-news509-browsers
          case "$P01_BASE508_OUTPUT" in /tmp/p01-news509-base508-*/build508) rm -rf "$(dirname "$P01_BASE508_OUTPUT")" ;; esac
          echo P01_509_PRIVATE_CHECKOUT_CLEANED=YES
