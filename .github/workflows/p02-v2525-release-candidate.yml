name: P02 V2.5.25 Release Candidate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v2525-release-candidate.yml'
      - 'scripts/p02-v2525-release-candidate.sh'

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      PRODUCT_REF: 35347213bc2e721029f6b29337d04d16bbe4ceae
    steps:
      - name: Require registered product-read capability
        run: |
          set -Eeuo pipefail
          test -n "$RELEASE_TOKEN"
          echo PRODUCT_READ_CAPABILITY=PASS

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.PRODUCT_REF }}
          token: ${{ env.RELEASE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: product

      - name: Install runtime dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php8.3-cli php8.3-sqlite3 php8.3-zip curl

      - name: Build and verify V2.5.23 to V2.5.25 candidate
        run: bash scripts/p02-v2525-release-candidate.sh

      - name: Prove protected boundaries
        if: always()
        run: |
          echo PRIVATE_SOURCE_PERSISTED_AS_PUBLIC_ARTIFACT=NO
          echo CANDIDATE_BYTES_PERSISTED_AS_PUBLIC_ARTIFACT=NO
          echo PRODUCTION_WRITE=NO
