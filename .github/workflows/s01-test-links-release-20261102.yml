name: S01 segment formal release
on:
  push:
    branches: [task/s01-test-links-current-proof-20261102]
    paths: ['.github/workflows/s01-test-links-release-20261102.yml']
permissions:
  contents: read
  actions: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: theme
            repository: llhzx2018/vf-tools-theme
            commit: d44b6b148bcdf67c3908ff95678ea3528c1bb265
            tree: 7080a4629aa6298c73fce8799379d94b0488efdc
            tag: v1.35.224
            file: vf-tools-theme_V1.35.224.zip
            hash: 7d64ce96ac15c482b653666a54fd587437b8aa214a73eb82e6e6771eaa02a4de
          - component: m3u8
            repository: llhzx2018/vf-tools-m3u8
            commit: fbe049dc18eb18eab21e9d8c3cededfe55b783e7
            tree: 7a5b239830dc15e2c952c350845f5d1e0cca6df7
            tag: v1.25.99
            file: vf-tools-m3u8_V1.25.99.zip
            hash: 7bd5c648fc1eb3513896404e8d433bc64044ce79928ddf7ed79f73b2fd2ba2a4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.commit }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - uses: actions/download-artifact@v4
        with:
          name: s01-iptv-41373522516
          path: candidate
          run-id: 41373522516
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested candidate and verify remote bytes
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          REPO: ${{ matrix.repository }}
          COMMIT: ${{ matrix.commit }}
          TREE: ${{ matrix.tree }}
          TAG: ${{ matrix.tag }}
          ASSET: ${{ matrix.file }}
          HASH: ${{ matrix.hash }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$COMMIT"
          test "$(git -C source rev-parse 'HEAD^{tree}')" = "$TREE"
          echo "$HASH  candidate/$ASSET" | sha256sum -c
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then echo "Release already exists; refusing overwrite"; exit 1; fi
          gh release create "$TAG" "candidate/$ASSET" --repo "$REPO" --target "$COMMIT" --title "$TAG" --notes "测试链接页面体验及示例计数修复。机器验证完成；正式站人工验收待后续进行。"
          mkdir remote
          gh release download "$TAG" --repo "$REPO" --pattern "$ASSET" --dir remote
          cmp "candidate/$ASSET" "remote/$ASSET"
          echo "$HASH  remote/$ASSET" | sha256sum -c
          gh release view "$TAG" --repo "$REPO" --json tagName,isDraft,isPrerelease,url
          echo FORMAL_ASSET_REMOTE_BYTES_PASS
