name: P07 Release6 Pull Distribution Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'installers/p07.sh'
      - 'installers/p07-final.sh'
      - 'installers/p07-toolbox.sh'
      - 'dist/p07/0.1.0/overlay/**'
      - '.github/workflows/p07-release6-pull-distribution-gate.yml'

permissions:
  contents: read

jobs:
  distribution-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify release6 identity
        run: |
          set -Eeuo pipefail
          test "$(cat dist/p07/0.1.0/overlay/BUILD_ID)" = '0.1.0-release6'
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release6"' installers/p07-toolbox.sh
          grep -Fq 'EXPECTED_BUILD_ID="0.1.0-release6"' installers/p07-final.sh
          grep -Fq 'RUNTIME_MANIFEST_BLOB="6871192d26ed875f68b7eeb3959871c6d856e0d4"' installers/p07-final.sh
          grep -Fq 'EXPECTED_BLOB="f3fdea95a97f59ca32e3777e2c7d6e410e512037"' installers/p07.sh

      - name: Verify runtime manifest
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('dist/p07/0.1.0/overlay')
          def blob(path):
              data=path.read_bytes()
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          rows=[]
          for line in (root/'RUNTIME.gitblob').read_text().splitlines():
              if not line.strip(): continue
              h,p=line.split('  ',1); rows.append((h,p))
          for h,p in rows:
              path=root/p
              assert path.is_file(), p
              assert blob(path)==h, (p,blob(path),h)
          assert any(p=='lib/server_migration_pull.py' for _,p in rows)
          assert any(p=='bin/vfops-migrate-ui' for _,p in rows)
          PY

      - name: Pull model and Chinese-first contract
        run: |
          set -Eeuo pipefail
          grep -Fq 'server_migration_pull.py' dist/p07/0.1.0/overlay/bin/vfops
          grep -Fq '旧服务器 IP（输入 0 返回）' dist/p07/0.1.0/overlay/bin/vfops-migrate-ui
          grep -Fq '新服务器 / 接收端' dist/p07/0.1.0/overlay/bin/vfops-migrate-ui
          grep -Fq '整机迁入' dist/p07/0.1.0/overlay/bin/vfops-migrate-ui
          grep -Fq '单站迁入' dist/p07/0.1.0/overlay/bin/vfops-migrate-ui
          grep -Fq '继续未完成迁移' dist/p07/0.1.0/overlay/bin/vfops-migrate-ui
          grep -Fq 'DNS 不自动修改' dist/p07/0.1.0/overlay/bin/vfops-migrate-ui
          grep -Fq '旧服务器永不自动删除' dist/p07/0.1.0/overlay/bin/vfops-migrate-ui
          ! grep -Fq '目标服务器 IP（输入 0 返回）' dist/p07/0.1.0/overlay/bin/vfops-migrate-ui

      - name: Lazy install contract
        run: |
          set -Eeuo pipefail
          ! grep -Fq 'guided-init' installers/p07-final.sh
          ! grep -Eq 'apt-get install.*(rclone|openssh-client|rsync)' installers/p07-final.sh
          grep -Fq '已是当前版本，无需下载或重复安装' installers/p07-final.sh
          grep -Fq '进入远程备份时才安装 rclone' installers/p07-final.sh
          grep -Fq '进入服务器迁移时才安装 OpenSSH 客户端 + rsync' installers/p07-final.sh

      - name: Installer syntax and isolated current-runtime install
        run: |
          set -Eeuo pipefail
          bash -n installers/p07.sh
          bash -n installers/p07-final.sh
          bash -n installers/p07-toolbox.sh
          root="$PWD"
          tmp="$(mktemp -d)"
          export P07_PUBLIC_ROOT="file://$root"
          export P07_INSTALL_DIR="$tmp/install"
          export P07_PREVIOUS_DIR="$tmp/previous"
          export P07_BIN_LINK="$tmp/vfops"
          export P07_ALLOW_NONROOT=1
          export P07_NO_EXEC=1
          bash installers/p07-final.sh >"$tmp/install.log"
          test "$("$tmp/vfops" --version)" = 'VF Server Ops 0.1.0'
          test "$("$tmp/vfops" --build-id)" = '0.1.0-release6'
          grep -Fq '0.1.0-release6' "$tmp/install.log"
          ! grep -Fq 'guided-init' "$tmp/install.log"
          bash installers/p07-final.sh >"$tmp/second.log"
          grep -Fq '已是当前版本，无需下载或重复安装' "$tmp/second.log"

      - name: No Production action
        run: |
          echo 'P07_RELEASE6_DISTRIBUTION_GATE=PASS'
          echo 'P07_PRODUCTION_MIGRATION=NOT_RUN'
          echo 'P07_DNS_WRITE=NOT_RUN'
          echo 'P07_SOURCE_DELETE=NOT_RUN'
          echo 'P07_RESTORE_OVERWRITE=NOT_RUN'
          echo 'P07_RESOURCE_SAFE_APPLY=NOT_RUN'
