name: S01 Theme 1.35.27 Update Center Gate

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  theme-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      THEME_REPO: llhzx2018/vf-tools-theme
      BASE_SHA: 42a4d894033762e4e82c73a2cb46fb24395e3c3d
      CANDIDATE_SHA: 2c0b36850152aaaa33deaa345d7c8b3ef09cd800
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Checkout exact Theme candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 2c0b36850152aaaa33deaa345d7c8b3ef09cd800
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: theme
          persist-credentials: false

      - name: Verify exact candidate identity and scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${VF_PRIVATE_READ_TOKEN:-}"
          test "$(git -C theme rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(cat theme/VERSION)" = "1.35.27"
          grep -Fq 'Version: 1.35.27' theme/src/style.css
          grep -Fq 'V1.35.27_S01_UPDATE_CENTER_CREDENTIAL_HEALTH_NATIVE_OFFER' theme/src/style.css
          mapfile -t changed < <(git -C theme diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" | sort)
          expected="$(printf '%s\n'             VERSION             src/inc/update/class-vf-wp-update-admin-v1.php             src/style.css             tests/update-center-credential-native-offer-runtime.php             tests/update-center-human-language-contract.php             tests/update-refresh-policy-contract.php | sort)"
          test "$(printf '%s\n' "${changed[@]}")" = "$expected"
          echo THEME_13527_SCOPE=PASS

      - name: Run update-center contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          php theme/tests/update-refresh-policy-contract.php
          php theme/tests/update-center-human-language-contract.php
          php theme/tests/update-center-credential-native-offer-runtime.php
          echo THEME_13527_UPDATE_CENTER_CONTRACTS=PASS

      - name: PHP syntax and secret fence
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find theme/src -type f -name '*.php' -print0 | sort -z)
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find theme/tests -maxdepth 1 -type f -name '*.php' -print0 | sort -z)
          ! grep -RInE 'gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY' theme/src theme/tests/update-*.php
          echo THEME_13527_SYNTAX_SECRET_FENCE=PASS

      - name: Verify updater ownership and unchanged transport semantics
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C theme diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" -- src/inc/update/class-vf-theme-update-source-v1.php src/inc/update/class-vf-theme-update-client-v1.php src/inc/update/class-vf-theme-update-package-v1.php src/inc/update/class-vf-wp-update-credential-v1.php | wc -l)" = "0"
          grep -Fq "apply_filters('vf_wp_update_components_v1'" theme/src/inc/update/class-vf-wp-update-admin-v1.php
          grep -Fq "overlay_native_update_offers" theme/src/inc/update/class-vf-wp-update-admin-v1.php
          grep -Fq "credential_health(true)" theme/src/inc/update/class-vf-wp-update-admin-v1.php
          grep -Fq "[401, 403, 404]" theme/src/inc/update/class-vf-wp-update-admin-v1.php
          grep -Fq "delete_site_transient('update_plugins')" theme/src/inc/update/class-vf-wp-update-admin-v1.php
          grep -Fq "wp_update_plugins();" theme/src/inc/update/class-vf-wp-update-admin-v1.php
          echo THEME_13527_OWNER_TRANSPORT_BOUNDARY=PASS

      - name: Result
        shell: bash
        run: echo PASS_S01_THEME_13527_UPDATE_CENTER_GATE
