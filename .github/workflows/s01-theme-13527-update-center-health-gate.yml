name: S01 Theme 1.35.27 Distribution Gate

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  distribution-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      CORE_SHA: 342c1923a7906d9ad1d71b09b6f1f6e35d4b356d
      BASE_SHA: 68426c69669f0b6d65043bc8fecb5137d3465378
    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: 342c1923a7906d9ad1d71b09b6f1f6e35d4b356d
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: core-updates
          persist-credentials: false

      - name: Verify exact distribution scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${VF_PRIVATE_READ_TOKEN:-}"
          test -n "${VF_RELEASE_WRITE_TOKEN:-}"
          test "$(git -C core-updates rev-parse HEAD)" = "$CORE_SHA"
          actual="$(git -C core-updates diff --name-only "$BASE_SHA" "$CORE_SHA" | sort)"
          test "$actual" = "projects/S01-C01.json"
          echo THEME_13527_DISTRIBUTION_SCOPE=PASS

      - name: Verify manifest identity and direct eligibility
        shell: bash
        run: |
          set -Eeuo pipefail
          m=core-updates/projects/S01-C01.json
          jq -e '.schema_version=="wp-component-1.0"
            and .project_id=="S01"
            and .component_id=="S01-C01"
            and .component_type=="THEME"
            and .package_slug=="vf-tools-theme"
            and .enabled==true
            and .target_version=="1.35.27"
            and .repository=="llhzx2018/vf-tools-theme"
            and .release_tag=="v1.35.27"
            and .asset_name=="vf-tools-theme_V1.35.27.zip"
            and .asset_bytes==1655490
            and .asset_sha256=="bb0a4f2aae9bdd4610650c0aa9537bd76501cd0ffc6f7041a4c0d6cc17b87d6a"
            and .schema_from=="N/A"
            and .schema_to=="N/A"
            and .minimum_wordpress=="6.5"
            and .minimum_php=="8.2"
            and .backup_required==true
            and .rollback_supported==true
            and .runtime_contract=="VF_WP_COMPONENT_RUNTIME_AUTHORITY_V1"
            and .runtime_files==455
            and .runtime_fingerprint=="03d6cc594eac1be421e1ba4b433fd8a9679738d764de9d14819f79a5e3450ad5"' "$m" >/dev/null
          jq -e '.from_versions | index("1.35.8") != null and index("1.35.26") != null' "$m" >/dev/null
          test "$(jq -r '.from_versions | length' "$m")" = "19"
          test "$(jq -r '.from_versions | unique | length' "$m")" = "19"
          echo THEME_13527_MANIFEST_IDENTITY=PASS

      - name: Run core-updates contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd core-updates
          python3 scripts/check_manifest_contract.py
          php update-core/php/tests/run.php
          find update-core/php -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          echo CORE_UPDATE_CONTRACTS=PASS

      - name: Authenticated formal asset readback
        shell: bash
        run: |
          set -Eeuo pipefail
          m=core-updates/projects/S01-C01.json
          repo="$(jq -r '.repository' "$m")"
          tag="$(jq -r '.release_tag' "$m")"
          asset="$(jq -r '.asset_name' "$m")"
          expected_bytes="$(jq -r '.asset_bytes' "$m")"
          expected_sha="$(jq -r '.asset_sha256' "$m")"
          curl -fsSL             -H 'Accept: application/vnd.github+json'             -H "Authorization: Bearer $VF_PRIVATE_READ_TOKEN"             "https://api.github.com/repos/$repo/releases/tags/$tag" > /tmp/release.json
          aid="$(jq -r --arg n "$asset" '.assets[] | select(.name==$n) | .id' /tmp/release.json | head -n1)"
          test -n "$aid" && test "$aid" != null
          curl -fsSL -L             -H 'Accept: application/octet-stream'             -H "Authorization: Bearer $VF_PRIVATE_READ_TOKEN"             "https://api.github.com/repos/$repo/releases/assets/$aid" -o "/tmp/$asset"
          test "$(stat -c '%s' "/tmp/$asset")" = "$expected_bytes"
          test "$(sha256sum "/tmp/$asset" | awk '{print $1}')" = "$expected_sha"
          unzip -tq "/tmp/$asset" >/dev/null
          test "$(unzip -Z1 "/tmp/$asset" | cut -d/ -f1 | sort -u)" = "vf-tools-theme"
          unzip -p "/tmp/$asset" vf-tools-theme/style.css | grep -Fq 'Version: 1.35.27'
          test -n "$(unzip -Z1 "/tmp/$asset" | grep '^vf-tools-theme/functions.php$')"
          test -n "$(unzip -Z1 "/tmp/$asset" | grep '^vf-tools-theme/index.php$')"
          echo THEME_13527_PRIVATE_ASSET_READBACK=PASS

      - name: Verify sibling S01 channels unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(jq -r '.target_version' core-updates/projects/S01-C02.json)" = "1.21.872"
          test "$(jq -r '.target_version' core-updates/projects/S01-C03.json)" = "1.25.32"
          echo S01_SIBLING_CHANNELS=PASS

      - name: Secret fence and result
        shell: bash
        run: |
          set -Eeuo pipefail
          ! git -C core-updates diff "$BASE_SHA" "$CORE_SHA" -- projects/S01-C01.json | grep -E '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)'
          echo PASS_S01_THEME_13527_DISTRIBUTION_GATE
