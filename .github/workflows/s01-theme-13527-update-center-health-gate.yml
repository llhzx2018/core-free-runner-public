name: S01 Theme 1.35.27 Formal Release

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  formal-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      THEME_REPO: llhzx2018/vf-tools-theme
      THEME_SHA: d15bfdd95c875d5892a23a231ef110fd96f7b041
      BASE_SHA: 42a4d894033762e4e82c73a2cb46fb24395e3c3d
      VERSION: 1.35.27
      TAG: v1.35.27
      ASSET: vf-tools-theme_V1.35.27.zip
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Checkout exact merged Theme main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: d15bfdd95c875d5892a23a231ef110fd96f7b041
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: theme
          persist-credentials: false

      - name: Verify exact release identity and scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${GH_TOKEN:-}"
          test "$(git -C theme rev-parse HEAD)" = "$THEME_SHA"
          test "$(cat theme/VERSION)" = "$VERSION"
          grep -Fq 'Version: 1.35.27' theme/src/style.css
          grep -Fq 'V1.35.27_S01_UPDATE_CENTER_CREDENTIAL_HEALTH_NATIVE_OFFER' theme/src/style.css
          mapfile -t changed < <(git -C theme diff --name-only "$BASE_SHA" "$THEME_SHA" | sort)
          expected="$(printf '%s\n' \
            VERSION \
            src/inc/update/class-vf-wp-update-admin-v1.php \
            src/style.css \
            tests/update-center-credential-native-offer-runtime.php \
            tests/update-center-human-language-contract.php \
            tests/update-refresh-policy-contract.php | sort)"
          test "$(printf '%s\n' "${changed[@]}")" = "$expected"
          if gh release view "$TAG" --repo "$THEME_REPO" >/dev/null 2>&1; then
            echo "Release already exists" >&2
            exit 1
          fi
          if gh api "repos/$THEME_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag already exists" >&2
            exit 1
          fi
          echo THEME_RELEASE_IDENTITY=PASS

      - name: Re-run Theme update-center contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          php theme/tests/update-refresh-policy-contract.php
          php theme/tests/update-center-human-language-contract.php
          php theme/tests/update-center-credential-native-offer-runtime.php
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find theme/src -type f -name '*.php' -print0 | sort -z)
          echo THEME_RELEASE_CONTRACTS=PASS

      - name: Verify updater transport boundary unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C theme diff --name-only "$BASE_SHA" "$THEME_SHA" -- \
            src/inc/update/class-vf-theme-update-source-v1.php \
            src/inc/update/class-vf-theme-update-client-v1.php \
            src/inc/update/class-vf-theme-update-package-v1.php \
            src/inc/update/class-vf-wp-update-credential-v1.php | wc -l)" = "0"
          echo THEME_UPDATE_TRANSPORT_BOUNDARY=PASS

      - name: Build Theme Runtime Authority package
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf stage-theme dist-theme
          mkdir -p stage-theme/vf-tools-theme dist-theme
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, shutil
          src = Path('theme/src')
          dst = Path('stage-theme/vf-tools-theme')

          def runtime(rel: str) -> bool:
              rel = rel.replace('\\', '/').lstrip('/')
              if not rel or '../' in rel:
                  return False
              parts = rel.split('/')
              low = [x.lower() for x in parts]
              banned = {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'}
              if any(x in banned for x in low):
                  return False
              base = parts[-1].lower()
              if base in {'readme.md','changelog.md','license','license.txt'}:
                  return False
              if base.endswith(('.sql','.sqlite','.sqlite3','.db','.log','.zip','.tar','.gz','.bak','.tmp')):
                  return False
              if len(parts) == 1:
                  return rel == 'style.css' or base.endswith('.php')
              return parts[0] in {'inc','assets','config','languages','template-parts','templates'}

          rows = []
          for p in sorted((x for x in src.rglob('*') if x.is_file()), key=lambda x: x.relative_to(src).as_posix()):
              rel = p.relative_to(src).as_posix()
              if not runtime(rel):
                  continue
              if p.is_symlink():
                  raise SystemExit('runtime symlink forbidden: ' + rel)
              q = dst / rel
              q.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(p, q)
              rows.append((rel, hashlib.sha256(p.read_bytes()).hexdigest()))

          required = {'style.css','functions.php','index.php'}
          if not required.issubset({r for r,_ in rows}):
              raise SystemExit('required classic Theme runtime files missing')
          canonical = b''.join(rel.encode() + bytes([0]) + sha.encode() + bytes([10]) for rel,sha in rows)
          fp = hashlib.sha256(canonical).hexdigest()
          Path('/tmp/theme_count').write_text(str(len(rows)))
          Path('/tmp/theme_fp').write_text(fp)
          print('THEME_RUNTIME_FILES=' + str(len(rows)))
          print('THEME_RUNTIME_FINGERPRINT=' + fp)
          PY
          test "$(cat /tmp/theme_count)" = "455"
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find stage-theme/vf-tools-theme -type f -name '*.php' -print0 | sort -z)
          (cd stage-theme && zip -X -q -r "../dist-theme/$ASSET" vf-tools-theme)
          test -s "dist-theme/$ASSET"
          unzip -tq "dist-theme/$ASSET" >/dev/null
          test "$(unzip -Z1 "dist-theme/$ASSET" | cut -d/ -f1 | sort -u)" = "vf-tools-theme"
          unzip -p "dist-theme/$ASSET" vf-tools-theme/style.css | grep -Fq 'Version: 1.35.27'
          test -n "$(unzip -Z1 "dist-theme/$ASSET" | grep '^vf-tools-theme/functions.php$')"
          test -n "$(unzip -Z1 "dist-theme/$ASSET" | grep '^vf-tools-theme/index.php$')"
          ! unzip -Z1 "dist-theme/$ASSET" | grep -E '^vf-tools-theme/(\.git|\.github|tests?|docs?|evidence|private)(/|$)'
          sha256sum "dist-theme/$ASSET" | tee /tmp/theme_asset.sha256
          stat -c '%s' "dist-theme/$ASSET" | tee /tmp/theme_asset.bytes
          echo THEME_RUNTIME_PACKAGE=PASS

      - name: Create Theme formal release
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/theme-notes.md <<EOF
          S01-C01 1.35.27 VF Online Update Center reliability repair.
          Exact merged main source: $THEME_SHA

          - Validates the installed private-read credential against the private update authority instead of equating "stored" with "working".
          - Distinguishes verified, invalid, unreachable and missing credential states without exposing the secret.
          - Lets exact WordPress native update offers override stale/manual wrapper status so a real update cannot remain hidden as "needs attention".
          - Refreshes Theme and Plugin native update transients together and reconciles actual installable offers after all component callbacks.
          - Saving a replacement credential automatically performs a fresh update check.
          - Available components link directly to WordPress Updates.

          Existing Theme update transport, package integrity, recovery and credential-storage contracts are unchanged.
          Runtime files: $(cat /tmp/theme_count)
          Runtime fingerprint SHA256: $(cat /tmp/theme_fp)
          Product/Git/Release only. Production WordPress installation is not claimed.
          EOF
          gh release create "$TAG" "dist-theme/$ASSET#VF Tools Theme $VERSION Runtime-only WordPress update ZIP" \
            --repo "$THEME_REPO" --target "$THEME_SHA" --title "VF Tools Theme V$VERSION" --notes-file /tmp/theme-notes.md
          echo THEME_RELEASE_CREATE=PASS

      - name: Independent Theme release readback
        shell: bash
        run: |
          set -Eeuo pipefail
          j="$(gh api "repos/$THEME_REPO/releases/tags/$TAG")"
          aid="$(jq -r --arg n "$ASSET" '.assets[] | select(.name==$n) | .id' <<<"$j")"
          remote_bytes="$(jq -r --arg n "$ASSET" '.assets[] | select(.name==$n) | .size' <<<"$j")"
          local_bytes="$(cat /tmp/theme_asset.bytes)"
          local_sha="$(awk '{print $1}' /tmp/theme_asset.sha256)"
          test -n "$aid" && test "$aid" != null
          test "$remote_bytes" = "$local_bytes"
          test "$(jq -r '.object.sha' <<<"$(gh api "repos/$THEME_REPO/git/ref/tags/$TAG")")" = "$THEME_SHA"
          rm -rf /tmp/theme-readback && mkdir -p /tmp/theme-readback
          gh release download "$TAG" --repo "$THEME_REPO" --pattern "$ASSET" --dir /tmp/theme-readback --clobber
          test "$(sha256sum "/tmp/theme-readback/$ASSET" | awk '{print $1}')" = "$local_sha"
          unzip -tq "/tmp/theme-readback/$ASSET" >/dev/null
          unzip -p "/tmp/theme-readback/$ASSET" vf-tools-theme/style.css | grep -Fq 'Version: 1.35.27'
          cat > /tmp/theme-release-receipt.txt <<EOF
          COMPONENT=S01-C01
          VERSION=$VERSION
          SOURCE_SHA=$THEME_SHA
          TAG=$TAG
          ASSET=$ASSET
          ASSET_ID=$aid
          BYTES=$local_bytes
          SHA256=$local_sha
          RUNTIME_FILES=$(cat /tmp/theme_count)
          RUNTIME_FINGERPRINT=$(cat /tmp/theme_fp)
          PUBLISHED_AT=$(jq -r '.published_at' <<<"$j")
          EOF
          cat /tmp/theme-release-receipt.txt
          echo THEME_FORMAL_RELEASE=PASS

      - name: Upload Theme release receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c01-13527-release-${{ github.run_id }}
          path: /tmp/theme-release-receipt.txt
          if-no-files-found: error
          retention-days: 14
