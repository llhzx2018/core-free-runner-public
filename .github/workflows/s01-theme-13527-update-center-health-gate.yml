name: S01 Final Live Update Availability Smoke

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  live-update-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Checkout carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify private update access
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${VF_PRIVATE_READ_TOKEN:-}"
          for repo in core-updates vf-tools-theme vf-tools-ops vf-tools-m3u8; do
            code="$(curl -sS -o /dev/null -w '%{http_code}'               -H 'Accept: application/vnd.github+json'               -H "Authorization: Bearer $VF_PRIVATE_READ_TOKEN"               "https://api.github.com/repos/llhzx2018/$repo" || true)"
            echo "CHECK $repo HTTP $code"
            test "$code" = "200"
          done
          echo PRIVATE_UPDATE_ACCESS=PASS

      - name: Read live S01 manifests
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/s01-live
          for c in S01-C01 S01-C02 S01-C03; do
            curl -fsSL               -H 'Accept: application/vnd.github+json'               -H "Authorization: Bearer $VF_PRIVATE_READ_TOKEN"               "https://api.github.com/repos/llhzx2018/core-updates/contents/projects/$c.json?ref=main"               | jq -r '.content' | tr -d '\n' | base64 -d > "/tmp/s01-live/$c.json"
          done

          test "$(jq -r '.target_version' /tmp/s01-live/S01-C01.json)" = "1.35.27"
          test "$(jq -r '.target_version' /tmp/s01-live/S01-C02.json)" = "1.21.872"
          test "$(jq -r '.target_version' /tmp/s01-live/S01-C03.json)" = "1.25.32"

          jq -e '.enabled==true and (.from_versions | index("1.35.26") != null)' /tmp/s01-live/S01-C01.json >/dev/null
          jq -e '.enabled==true and (.from_versions | index("1.21.871") != null)' /tmp/s01-live/S01-C02.json >/dev/null
          jq -e '.enabled==true and (.from_versions | index("1.25.31") != null)' /tmp/s01-live/S01-C03.json >/dev/null

          jq -e '.asset_name=="vf-tools-theme_V1.35.27.zip" and .asset_sha256=="bb0a4f2aae9bdd4610650c0aa9537bd76501cd0ffc6f7041a4c0d6cc17b87d6a"' /tmp/s01-live/S01-C01.json >/dev/null
          jq -e '.asset_name=="vf-tools-ops_V1.21.872.zip" and .asset_sha256=="100f538a7fb180e003098f3a2f282509bc228af507a50272bb3d2b13ef1cbe1e"' /tmp/s01-live/S01-C02.json >/dev/null
          jq -e '.asset_name=="vf-tools-m3u8_V1.25.32.zip" and .asset_sha256=="8925f950bdd6d7624601053eb40e2fc426d980292a5ebbf07914b8403a3c1fa6"' /tmp/s01-live/S01-C03.json >/dev/null
          echo LIVE_S01_MANIFESTS=PASS

      - name: Download and verify every live update package
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/s01-assets

          verify_asset() {
            manifest="$1"
            root="$2"
            identity="$3"
            needle="$4"

            repo="$(jq -r '.repository' "$manifest")"
            tag="$(jq -r '.release_tag' "$manifest")"
            asset="$(jq -r '.asset_name' "$manifest")"
            expected_bytes="$(jq -r '.asset_bytes' "$manifest")"
            expected_sha="$(jq -r '.asset_sha256' "$manifest")"

            curl -fsSL               -H 'Accept: application/vnd.github+json'               -H "Authorization: Bearer $VF_PRIVATE_READ_TOKEN"               "https://api.github.com/repos/$repo/releases/tags/$tag" > /tmp/release.json

            aid="$(jq -r --arg n "$asset" '.assets[] | select(.name==$n) | .id' /tmp/release.json | head -n1)"
            test -n "$aid" && test "$aid" != null

            curl -fsSL -L               -H 'Accept: application/octet-stream'               -H "Authorization: Bearer $VF_PRIVATE_READ_TOKEN"               "https://api.github.com/repos/$repo/releases/assets/$aid"               -o "/tmp/s01-assets/$asset"

            test "$(stat -c '%s' "/tmp/s01-assets/$asset")" = "$expected_bytes"
            test "$(sha256sum "/tmp/s01-assets/$asset" | awk '{print $1}')" = "$expected_sha"
            unzip -tq "/tmp/s01-assets/$asset" >/dev/null
            test "$(unzip -Z1 "/tmp/s01-assets/$asset" | cut -d/ -f1 | sort -u)" = "$root"
            unzip -p "/tmp/s01-assets/$asset" "$identity" | grep -Fq "$needle"
            echo "PASS $asset"
          }

          verify_asset /tmp/s01-live/S01-C01.json vf-tools-theme vf-tools-theme/style.css 'Version: 1.35.27'
          verify_asset /tmp/s01-live/S01-C02.json vf-ops vf-ops/vf-ops.php 'Version: 1.21.872'
          verify_asset /tmp/s01-live/S01-C03.json vf-tool-m3u8 vf-tool-m3u8/vf-tool-m3u8.php 'Version: 1.25.32'
          echo LIVE_UPDATE_PACKAGES=PASS

      - name: Confirm Theme repair release semantics
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL             -H 'Accept: application/vnd.github.raw+json'             -H "Authorization: Bearer $VF_PRIVATE_READ_TOKEN"             'https://api.github.com/repos/llhzx2018/vf-tools-theme/contents/src/inc/update/class-vf-wp-update-admin-v1.php?ref=v1.35.27'             > /tmp/update-admin.php
          grep -Fq 'credential_health(true)' /tmp/update-admin.php
          grep -Fq 'overlay_native_update_offers' /tmp/update-admin.php
          grep -Fq "delete_site_transient('update_plugins')" /tmp/update-admin.php
          grep -Fq 'wp_update_plugins();' /tmp/update-admin.php
          grep -Fq '>前往更新</a>' /tmp/update-admin.php
          echo THEME_13527_REPAIR_SEMANTICS=PASS

      - name: Final result
        shell: bash
        run: |
          echo PASS_S01_LIVE_UPDATE_AVAILABLE
          echo 'LIVE_TARGETS=Theme_1.35.27,Ops_1.21.872,M3U8_1.25.32'
          echo 'This proves the live private update channel and installable release packages. It does not claim that a specific Production WordPress instance has already installed them.'
