name: S01 Theme exact formal release
on:
  push:
    branches: [task/s01-glossary203-20261026]
    paths: ['.github/workflows/s01-glossary203-20261026-formal.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.203
  TARGET_SHA: b890208623e6707834a3009931e35555f2b03250
  TARGET_TREE: 143261140db6a4eb07ecbbf613a4302b4cd72010
  BASE_SHA: d6d158b5a3db47d058fd525af28d4ea430564179
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - name: Formal identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-glossary203-20261026/formal-spec.json --input control/.github/workflows/s01-glossary203-20261026-formal.yml
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: b890208623e6707834a3009931e35555f2b03250
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact candidate, merged tree and required evidence readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider candidate-proof
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40424537865 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40424537865 --jq .head_sha)" = 531adb5a1a9989dce7c3639eed012bff5a162c29
          test "$(gh api repos/$TARGET_REPO/commits/main --jq .sha)" = "$TARGET_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$TARGET_SHA --jq .tree.sha)" = "$TARGET_TREE"
          gh run download 40424537865 --repo llhzx2018/core-free-runner-public --name s01-home-40424537865 --dir candidate-proof
          cmp candidate-proof/state-before.sha256 candidate-proof/state-after.sha256
          cmp candidate-proof/contracts-before.json candidate-proof/contracts-after.json
          python3 control/lanes/s01-glossary203-20261026/package.py
          python3 - <<'PYVERIFY'
          import json,pathlib,subprocess,urllib.parse
          r=pathlib.Path('candidate-proof')
          old=json.loads((r/'package.json').read_text());new=json.loads(pathlib.Path('proof/package.json').read_text())
          assert old['source']=='9178402b2b778714a3e21a9e4b4c4ed5b33644ca'
          for phase in ['before','after','smoke']:
              result=json.loads((r/('glossary-'+phase+'.json')).read_text())
              assert result['status']=='PASS' and result['rows']==2 and result['errors']==[]
          result=json.loads((r/'glossary-after.json').read_text())
          assert result['checks']>=60
          assert result['ownerContentSEO']=='BYTE_IDENTICAL'
          assert result['visualControls']=='SINGLE_SEARCH_BOUNDARY_UNFRAMED_PAGINATION_NO_REPEATED_RULES'
          assert result['states']=='DEFAULT_HOVER_KEYBOARD_FOCUS_ZH_EN_1440_1024'
          assert result['interaction']=='13_DEFINITIONS_PAGE2_SEARCH_FILTER_LETTER_RESET_NOJS'
          assert result['operationalAcceptance']=='OWNER_REVIEW_REQUIRED_AFTER_MANUAL_UPGRADE'
          for lang in ['zh','en']:
              for width in [1440,1024]:
                  for kind in ['glossary','search','search-focus','pagination','pagination-hover','pagination-focus']:
                      assert (r/f'{kind}-{lang}-{width}.png').stat().st_size>500
                  old_metrics=json.loads((r/f'metrics-before-{lang}-{width}.json').read_text())
                  corrected=json.loads((r/f'metrics-after-{lang}-{width}.json').read_text())
                  assert any(x>0 for x in old_metrics['ul']['border'])
                  for k in ['frame','heroBox','form','input','section','summary','term','ul']:assert all(x==0 for x in corrected[k]['border'])
                  assert corrected['ul']['background']=='rgba(0, 0, 0, 0)'
          assert json.loads((r/'clean-install.json').read_text())['status']=='PASS'
          assert json.loads((r/'bootstrap.json').read_text())['status']=='PASS'
          for k in ['status','version','tree','sha256','bytes','files']: assert old[k]==new[k],k
          assert new['sha256']=='3aa491e7892954d01b4029c09ba23b4b8d507451121275a50c1e87404eb7ee50' and new['bytes']==2010061
          coverage=json.loads(pathlib.Path('control/lanes/s01-glossary203-20261026/release-authority.json').read_text())
          assert set(coverage['required'])=={'TESTING','GIT','UA_UI','SEO','SECURITY','INSTALL','UPGRADE','DATA_SCHEMA','PERFORMANCE'}
          assert coverage['source']=='9178402b2b778714a3e21a9e4b4c4ed5b33644ca' and coverage['tree']=='143261140db6a4eb07ecbbf613a4302b4cd72010'
          assert coverage['owner_preview_runtime']=='N_A'
          assert coverage['release_mode']=='PROJECT_PREVIEW_N_A'
          assert coverage['owner_real_use']=='POST_PRODUCTION_REQUIRED'
          assert coverage['production_auto_apply'] is False
          for item in coverage['required'].values():
              assert item['sha'] and item['acceptance']
              endpoint='repos/llhzx2018/gov-doc/contents/'+urllib.parse.quote(item['path'],safe='/')+'?ref=main'
              live=json.loads(subprocess.check_output(['gh','api',endpoint]))
              assert live['sha']==item['sha'],item['path']
              item['evidence_status']='PASS_EXACT_CANDIDATE_MACHINE'
          coverage['candidate_status']='PASS_EXACT_CANDIDATE_MACHINE'
          coverage['candidate_run']='40424537865'
          coverage['merged_source']='b890208623e6707834a3009931e35555f2b03250'
          coverage['formal_release_gate']='PASS'
          coverage['production_effect']='NOT_PROVEN_POST_MANUAL_UPGRADE_READBACK_REQUIRED'
          pathlib.Path('proof/public-authority-coverage.json').write_text(json.dumps(coverage,ensure_ascii=False,indent=2))
          print('MERGED_TREE_EQUALS_TESTED_TREE_AND_EXACT_PACKAGE_PASS')
          PYVERIFY
      - name: Publish only the exact verified package
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.35.203 --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create v1.35.203 provider/vf-tools-theme_V1.35.203.zip --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Theme V1.35.203' --notes '术语表控件与视觉层级修复：移除搜索区重复的外框、输入绿边和顶部横线，保留一层中性输入边界及清晰键盘焦点；修复分页列表容器误套页码样式造成整圈边框，区分默认、当前页、悬停和键盘焦点。清除逐项长分隔线，使用留白组织定义，保留已发布的双语13项正文、工具/参考链接、搜索/筛选/分页和Head/SEO/设置。真实WordPress在202复现问题，并对203进行中英文1440/1024计算样式、局部截图与真实交互验证；干净安装、202升级203/回退/重复安装及受保护数据通过，476运行文件。最终UX验收仍待Owner手工升级后的真实站点裁决，不能以机器PASS替代。手机测试继续暂缓。' --latest
          fi
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/v1.35.203 --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh release view v1.35.203 --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - name: Authenticated remote ZIP byte comparison
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download v1.35.203 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.203.zip --dir remote
          cmp provider/vf-tools-theme_V1.35.203.zip remote/vf-tools-theme_V1.35.203.zip
          echo '3aa491e7892954d01b4029c09ba23b4b8d507451121275a50c1e87404eb7ee50  remote/vf-tools-theme_V1.35.203.zip' | sha256sum -c
          test "$(stat -c %s remote/vf-tools-theme_V1.35.203.zip)" = 2010061
          gh release view v1.35.203 --repo "$TARGET_REPO" --json url,publishedAt,tagName > proof/formal-release.json
          echo FORMAL_RELEASE_EXACT_REMOTE_ASSET_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-home-formal-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target provider remote candidate-proof
