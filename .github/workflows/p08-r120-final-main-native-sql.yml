name: P08 R120 p08-r120-final-main-native-sql exact merged main proof
on:
  pull_request:
    paths:
      - .github/workflows/p08-r120-final-main-native-sql.yml
permissions:
  contents: read
jobs:
  offline-updater-bridge:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 39
    strategy:
      fail-fast: false
      matrix:
        include:
          - {driver: mysql, image: 'mysql:8.4', health: 'mysqladmin ping -h 127.0.0.1 -uroot -pR106SyntheticRootOnly --silent'}
          - {driver: mariadb, image: 'mariadb:11.8', health: 'healthcheck.sh --connect --innodb_initialized'}
    services:
      sql:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: R106SyntheticRootOnly
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=10s --health-timeout=5s --health-retries=24
    env:
      GITHUB_ACTIONS: "true"
      P08_ISOLATED_INSTALL_TEST: "YES"
      P08_R105_DISPOSABLE: "YES"
      P08_R105_REAL_FULL_ISOLATED: "YES"
      P08_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      P08_R105_DB_DRIVER: ${{ matrix.driver }}
      P08_R114_EXACT_TARGET: 44d504185f0ac8cf4be552dc5adada989a08b40e
    steps:
      - name: Exact P08 source temporary private checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: da36b736e075ea0908aa38f896162cac8651f289
          path: p08-private
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Exact v0.1.3 candidate commit temporary private checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 44d504185f0ac8cf4be552dc5adada989a08b40e
          path: p08-next
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Actual current shared delivery structural standard temporary checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: d1f5d18a5efd475131d39bf83cfb17178af82da3
          path: gov-current
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: PHP 8.4 and Composer for real independently built 0.1.2 updater bridge
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mbstring, zip, sqlite3, pdo_sqlite, pdo_mysql, fileinfo, curl
          tools: composer:v2
      - name: Node 22 for locked current-page update feature assets
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source and negative gates before artifact build
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C p08-private rev-parse HEAD)" = "da36b736e075ea0908aa38f896162cac8651f289"
          test "$(git -C gov-current rev-parse HEAD)" = "d1f5d18a5efd475131d39bf83cfb17178af82da3"
          test "$(cat p08-private/VERSION)" = "0.1.2"
          test "$(git -C p08-next rev-parse HEAD)" = "$P08_R114_EXACT_TARGET"
          test "$(cat p08-next/VERSION)" = "0.1.3"
          php -l p08-next/src/Upgrade/R105OfficialNextRelease.php >/dev/null
          php -l p08-next/src/Upgrade/OwnerReleaseDiscovery.php >/dev/null
          php -l p08-next/tests/compatibility/r105_official_next_release.php >/dev/null
          php p08-next/tests/compatibility/r105_official_next_release.php \
            > "$RUNNER_TEMP/r114-013-discovery.log" 2>&1 || {
              echo R114_POST_UPGRADE_SOURCE_AND_CHANNEL_NEGATIVE=FAIL
              grep -E '^(R114_[A-Z0-9_]+|R105_NEXT_[A-Z0-9_]+)=' "$RUNNER_TEMP/r114-013-discovery.log" | tail -9 || true
              exit 1
            }
          grep -Fxq 'R114_POST_UPGRADE_013_CHANNEL_SOURCE_NEGATIVE=PASS' "$RUNNER_TEMP/r114-013-discovery.log"
          echo R114_013_SOURCE_AND_POST_UPGRADE_CHANNEL_CONTRACT=PASS
          for path in \
            src/Upgrade/FlatLayoutBridgePrepare.php \
            src/Upgrade/FlatLayoutBridgeActivation.php \
            src/Upgrade/R106Installed012Source.php \
            src/Upgrade/R105OfficialNextRelease.php \
            src/Upgrade/R105NextReleaseIntake.php \
            src/Upgrade/GitHubStableReleaseGate.php \
            src/Upgrade/GitHubStableAssetDownloader.php \
            src/Upgrade/GitHubVerifiedCandidatePreparation.php \
            src/Upgrade/OwnerUpgradePreparation.php \
            src/Upgrade/OwnerUpgradeJob.php \
            src/Upgrade/OwnerReleaseDiscovery.php \
            src/Upgrade/UpgradeReadiness.php \
            tests/compatibility/r106_official012_to_updater_bridge.php \
            tests/compatibility/r106_official012_bridge_next_owner.php \
            tests/compatibility/r106_official012_bridge_to_unissued_013_sql_native.php \
            src/Upgrade/R109AppLocal012Activation.php \
            src/Upgrade/R111NativeDatabaseWriteFence.php \
            tests/compatibility/r113_native_app_local_activation.php \
            tests/compatibility/r106_native_prebridge_snapshot.php; do
            if ! php -l "p08-private/$path" > "$RUNNER_TEMP/p08-r106-lint.log" 2>&1; then
              echo R106_PHP84_SYNTAX=FAIL
              exit 1
            fi
          done
          if ! php p08-private/tests/compatibility/r105_official_next_release.php > "$RUNNER_TEMP/p08-r106-legacy.log" 2>&1; then
            echo R106_OLD_CHANNEL_REGRESSION=FAIL; exit 1
          fi
          echo R106_PHP84_AND_PRIOR_OFFICIAL_CHANNEL_COMPAT=PASS
      - name: Build a real current bridge FULL with pinned PHP Composer, Vite and canonical task delivery gate
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          # Canonical GOV gate requires a CLEAN exact Git checkout, while
          # the packaged runtime necessarily has built vendor/Vite outputs.
          # Git archive proves the runtime was assembled from this HEAD.
          build="$RUNNER_TEMP/p08-r106-build-tree"
          mkdir -m 0700 "$build"
          git -C p08-private archive HEAD | tar -x -C "$build"
          cd "$build"
          if ! composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress > "$RUNNER_TEMP/p08-r106-composer.log" 2>&1; then
            echo R106_LOCKED_COMPOSER=FAIL; exit 1
          fi
          if ! npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-r106-node.log" 2>&1; then
            echo R106_LOCKED_NODE=FAIL; exit 1
          fi
          if ! npm run build > "$RUNNER_TEMP/p08-r106-node.log" 2>&1; then
            echo R106_BRIDGE_VITE=FAIL; exit 1
          fi
          cd "$GITHUB_WORKSPACE"
          mkdir -m 0700 "$RUNNER_TEMP/p08-r106-updater-bridge-v012"
          # Run the real Public Authority resolve + delivery gate against the
          # exact clean source; only the locked-built archival runtime has
          # Composer/Vite-generated outputs. Both use the same source commit.
          if ! python3 -B - <<'PY' > "$RUNNER_TEMP/p08-r106-build.log" 2>&1
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0,str(Path('p08-private/scripts').resolve()))
          from build_full import write_full,verify_canonical_full_contract
          source=Path('p08-private').resolve()
          built=Path(os.environ['RUNNER_TEMP'])/'p08-r106-build-tree'
          output=Path(os.environ['RUNNER_TEMP'])/'p08-r106-bridge-full.zip'
          governance=Path('gov-current').resolve()
          sha='da36b736e075ea0908aa38f896162cac8651f289'
          verify_canonical_full_contract(source,output,sha,governance,'resolve')
          result=write_full(built,output,'0.1.2',sha)
          verify_canonical_full_contract(source,output,sha,governance,'delivery')
          print('R106_DEV_LOCKED_FULL_ZIP_BYTES='+str(result['bytes']))
          print('R106_DEV_LOCKED_FULL_MANIFEST_SHA256='+str(result['sha256']))
          PY
          then
            echo R106_BRIDGE_GOV_FULL_PACKAGE_GATE=FAIL
            python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'p08-r106-build.log'
          raw=p.read_text(errors='replace')
          codes=sorted(set(re.findall(r'\b(?:FULL|CONTRACT|R106|P08)_[A-Z0-9_]{3,80}\b',raw)))
          if not codes:
              if 'Traceback (most recent call last)' in raw: codes=['BUILDER_PYTHON_EXCEPTION']
              elif 'FULL_BLOCKED' in raw: codes=['FULL_BLOCKED']
              else: codes=['BUILD_GATE_UNKNOWN']
          print('R106_BUILD_FAILURE_CODES='+','.join(codes[:6]))
          reasons=re.findall(r'CONTRACT_REASON=([A-Z][A-Z0-9_]{2,100})',raw)
          if reasons: print('R106_STRUCTURAL_GATE_REASON='+reasons[-1])
          # This is only the known, source-independent gate classification.
          for reason in ('UNSUPPORTED','UNKNOWN_TASK','RULES_NOT_RESOLVED',
                         'CONTRACT_CHECK','NO_MATCH','MISSING_REQUIRED',
                         'source identity','missing built runtime'):
              if reason.lower() in raw.lower():
                  print('R106_BUILD_REASON_HINT='+re.sub(r'[^A-Z0-9_]','_',reason.upper())[:40])
                  break
          PY
            exit 1
          fi
          unzip -q "$RUNNER_TEMP/p08-r106-bridge-full.zip" \
            -d "$RUNNER_TEMP/p08-r106-updater-bridge-v012"
          test "$(cat "$RUNNER_TEMP/p08-r106-updater-bridge-v012/VERSION")" = 0.1.2
          echo R106_BRIDGE_FULL_CANONICAL_GOV_DELIVERY_AND_BUILD=PASS
      - name: Official release v0.1.2 original bytes and two isolated Owner sites
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test -n "$P08_PRIVATE_READ_TOKEN"
          curl --fail --location --silent --show-error --max-time 90 \
            --header "Authorization: Bearer $P08_PRIVATE_READ_TOKEN" \
            --header "Accept: application/octet-stream" \
            "https://api.github.com/repos/llhzx2018/vf-adops/releases/assets/747260263" \
            --output "$RUNNER_TEMP/p08-r106-original-012.zip"
          test "$(wc -c < "$RUNNER_TEMP/p08-r106-original-012.zip")" = 10390070
          echo "1b3d7fc3743fb44af12c0b50905a65ea68d47c80f0e1e2ddc5e03c08d534b081  $RUNNER_TEMP/p08-r106-original-012.zip" | sha256sum -c --status
          for mode in success fault click; do
            site="$RUNNER_TEMP/p08-r106-official-012-site-$mode"
            mkdir -m 0700 "$site"
            unzip -q "$RUNNER_TEMP/p08-r106-original-012.zip" -d "$site"
            echo "fd15c721b12e524ffe747606172eb9f21dc98809bbb8c0430f1b4b586ca09233  $site/FULL_MANIFEST.json" | sha256sum -c --status
          done
          echo R106_REAL_ISSUED_012_FROZEN_FULL_VERIFIED=PASS
      - name: Build actual committed 0.1.3 FULL plus source-bound Atomic candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C p08-next rev-parse HEAD)" = "$P08_R114_EXACT_TARGET"
          target="$RUNNER_TEMP/p08-r114-built-013"
          mkdir -m 0700 "$target"
          git -C p08-next archive HEAD | tar -x -C "$target"
          test "$(cat "$target/VERSION")" = 0.1.3
          cd "$target"
          composer install --no-dev --no-interaction --prefer-dist \
            --optimize-autoloader --no-progress > "$RUNNER_TEMP/r114-composer.log" 2>&1 || {
              echo R114_TARGET_COMPOSER_LOCK=FAIL; exit 1;
            }
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/r114-node.log" 2>&1 || {
              echo R114_TARGET_NPM_LOCK=FAIL; exit 1;
          }
          npm run build >> "$RUNNER_TEMP/r114-node.log" 2>&1 || {
              echo R114_TARGET_VITE_BUILD=FAIL; exit 1;
          }
          cd "$GITHUB_WORKSPACE"
          python3 -B - <<'PY' > "$RUNNER_TEMP/r114-candidate-package.log" 2>&1 || {
          import hashlib,json,os,sys,zipfile
          from pathlib import Path
          sys.path.insert(0,str(Path('p08-next/scripts').resolve()))
          from build_full import write_full,verify_canonical_full_contract
          from build_atomic import write_atomic
          source=Path('p08-next').resolve()
          target=Path(os.environ['RUNNER_TEMP'])/'p08-r114-built-013'
          full=Path(os.environ['RUNNER_TEMP'])/'VF_AdOps_V0.1.3_FULL.zip'
          atomic=Path(os.environ['RUNNER_TEMP'])/'p08-r106-unissued013.zip'
          old=Path(os.environ['RUNNER_TEMP'])/'p08-r106-updater-bridge-v012'/'FULL_MANIFEST.json'
          gov=Path('gov-current').resolve()
          target_sha=os.environ['P08_R114_EXACT_TARGET']
          bridge_sha='da36b736e075ea0908aa38f896162cac8651f289'
          assert hashlib.sha256(old.read_bytes()).hexdigest()
          bridge_manifest=hashlib.sha256(old.read_bytes()).hexdigest()
          verify_canonical_full_contract(source,full,target_sha,gov,'resolve')
          full_info=write_full(target,full,'0.1.3',target_sha)
          verify_canonical_full_contract(source,full,target_sha,gov,'delivery')
          atomic_info=write_atomic(target,atomic,source_version='0.1.2',
              source_sha=bridge_sha,source_full_manifest_sha256=bridge_manifest,
              target_version='0.1.3',target_sha=target_sha)
          with zipfile.ZipFile(full) as z:
              f=json.loads(z.read('FULL_MANIFEST.json'))
              assert f['target_version']=='0.1.3' and f['source_sha']==target_sha
              assert f['type']=='CLEAN_FULL_ONLY' and f['data_included'] is False
              assert z.read('VERSION')==b'0.1.3\n'
          with zipfile.ZipFile(atomic) as z:
              a=json.loads(z.read('ATOMIC_MANIFEST.json'))
              assert a['source_sha']==bridge_sha
              assert a['target_sha']==target_sha
              assert a['source_full_manifest_sha256']==bridge_manifest
              assert a['source_version']=='0.1.2'
              assert a['target_version']=='0.1.3'
              assert a['schema_changes'] is False
              assert z.read('VERSION')==b'0.1.3\n'
              assert not any(x.startswith(('storage/','database/','.env')) for x in z.namelist())
          print('R114_REAL_COMMIT_SOURCE_FULL_AND_ATOMIC_SEALED=PASS')
          print('R114_CANDIDATE_TARGET_SHA='+target_sha)
          print('R114_FULL_SHA256='+full_info['sha256'])
          print('R114_FULL_BYTES='+str(full_info['bytes']))
          print('R114_ATOMIC_SHA256='+atomic_info['sha256'])
          print('R114_ATOMIC_BYTES='+str(atomic_info['bytes']))
          PY
            echo R114_REAL_SOURCE_FULL_AND_ATOMIC_GATE=FAIL
            grep -E '^R114_[A-Z0-9_]+=' "$RUNNER_TEMP/r114-candidate-package.log" | tail -10 || true
            exit 1
          }
          grep -Fxq R114_REAL_COMMIT_SOURCE_FULL_AND_ATOMIC_SEALED=PASS \
            "$RUNNER_TEMP/r114-candidate-package.log"
          echo R114_013_FINAL_REAL_SOURCE_CANDIDATE_ARCHIVES=PASS
      - name: R114 native two-engine actual committed v013 Atomic success fault restore
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          sudo apt-get update -qq > "$RUNNER_TEMP/r106-native-apt.log" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mariadb-client >> "$RUNNER_TEMP/r106-native-apt.log" 2>&1
          command -v mariadb-dump >/dev/null
          export NATIVE_DRIVER="$P08_R105_DB_DRIVER"
          export P08_R113_APP_LOCAL=YES
          export P08_R105_DB_USER=p08_fixture
          export P08_R105_DB_PASSWORD=R105SyntheticOnlyNoProduction
          export P08_R105_DB_PORT=3306
          php <<'PHP'
          <?php
          $p=new PDO('mysql:host=127.0.0.1;port=3306','root','R106SyntheticRootOnly',[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);
          $p->exec("CREATE USER 'p08_fixture'@'%' IDENTIFIED BY 'R105SyntheticOnlyNoProduction'");
          foreach(['success','fault'] as $mode) {
              foreach(["p08_src_$mode","p08_restore_$mode"] as $db) {
                  $p->exec("CREATE DATABASE ".$db." CHARACTER SET utf8mb4");
                  $p->exec("GRANT ALL PRIVILEGES ON ".$db.".* TO 'p08_fixture'@'%'");
              }
          }
          PHP
          fakeSha="$P08_R114_EXACT_TARGET"
          for mode in success fault; do
            export P08_R105_DB_SOURCE="p08_src_$mode"
            export P08_R105_DB_RESTORE="p08_restore_$mode"
            site="$RUNNER_TEMP/p08-r106-official-012-site-native-$NATIVE_DRIVER-$mode"
            mkdir -m 0700 "$site"
            unzip -q "$RUNNER_TEMP/p08-r106-original-012.zip" -d "$site"
            if ! php p08-private/tests/compatibility/r106_official012_bridge_to_unissued_013_sql_native.php \
               "$mode" "$site" "$RUNNER_TEMP/p08-r106-updater-bridge-v012" da36b736e075ea0908aa38f896162cac8651f289 \
               "$RUNNER_TEMP/p08-r106-unissued013.zip" "$fakeSha" \
               > "$RUNNER_TEMP/r106-native-$mode.log" 2>&1; then
              echo R113_NEW_BRIDGE_NATIVE_TEST=FAIL
              grep -E '^(R105_DISPOSABLE_NEXT_FAILURE_CODE|R105_DEV_SHUTDOWN_REASON|R105_DEV_PHASE_[A-Z_]+|R106_NATIVE_SQL_[A-Z_]+)=' "$RUNNER_TEMP/r106-native-$mode.log" | tail -n 12 || true
              exit 1
            fi
            grep -Fxq 'R113_NATIVE_SQL_APP_LOCAL_DB_FENCED_BACKUP_AND_BRIDGE=PASS' "$RUNNER_TEMP/r106-native-$mode.log"
            grep -Fxq 'R113_NATIVE_SQL_APP_LOCAL_DB_FENCED_BACKUP_AND_BRIDGE=PASS' "$RUNNER_TEMP/r106-native-$mode.log"
            printf -v marker 'R113_NATIVE_SQL_%s_%s_ISSUED_FULL_APP_LOCAL_NEXT_ATOMIC_ROLLBACK_RESTORE=PASS' "$NATIVE_DRIVER" "$mode"
            grep -Fxq "$marker" "$RUNNER_TEMP/r106-native-$mode.log"
          done
          echo R113_NATIVE_APP_LOCAL_POSITIVE_FAULT_AND_SEPARATE_RESTORE=PASS
          echo R114_REAL_COMMITTED_TARGET_NATIVE_SUCCESS_FAULT_RESTORE=PASS
          echo R113_NEXT_OFFICIAL_013_RELEASE=NOT_PUBLISHED
          echo R113_SITE_ACCOUNT_NO_ROOT_TEST=PASS
      - name: Always remove disposable private source, copies, test data, credentials and ZIP
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- p08-private p08-next gov-current "$RUNNER_TEMP"/p08-r106-official-012-site-* "$RUNNER_TEMP"/p08-r106-updater-bridge-v012 "$RUNNER_TEMP"/p08-r106-build-tree "$RUNNER_TEMP"/p08-r106-next-version-runtime
          rm -f -- "$RUNNER_TEMP"/p08-r106-*.zip "$RUNNER_TEMP"/p08-r106-*.log "$RUNNER_TEMP"/r106-native-*.log "$RUNNER_TEMP"/r106-native-apt.log
          rm -rf -- "$RUNNER_TEMP/p08-r114-built-013"
          rm -f -- "$RUNNER_TEMP/VF_AdOps_V0.1.3_FULL.zip" "$RUNNER_TEMP"/r114-*.log
          echo R114_PRIVATE_TARGET_AND_CANDIDATE_ZIPS_PURGED=YES
