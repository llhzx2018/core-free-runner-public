name: S01 Error Recovery UX Code Gate
on:
  push:
    branches: [temp/s01-error-recovery-ux-code-gate-20260907]
    paths: [.github/workflows/temp-s01-error-recovery-ux-code-gate-20260907.yml]
permissions:
  contents: read
jobs:
  ops:
    runs-on: ubuntu-24.04
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      REPO: llhzx2018/vf-tools-ops
      BRANCH: work/s01-c02-error-recovery-ux-20260907
      EXPECTED_HEAD: eff8d81f69f4517240edfc19ddd03b8693145e81
      EXPECTED_MAIN: 3e873a80ff6d3defdc31a3d7b4f9574e8b84cfcb
    steps:
      - name: Gate Ops recoverable-error UX
        shell: bash
        run: |
          set -euo pipefail
          test -n "$READ_TOKEN"
          echo 'MAIN_WRITE_USED=NO RELEASE_USED=NO DISTRIBUTION_USED=NO PRODUCTION_WRITE_USED=NO MIGRATION_USED=NO'
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/${REPO}.git" repo
          cd repo
          git checkout -q "$BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(cat VERSION)" = '1.21.857'
          grep -Fq 'Version: 1.21.857' vf-ops.php
          find includes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php tests/error-recovery-human-language-contract.php
          php tests/admin-human-language-contract.php
          php tests/dashboard-selector-hit-contract.php
          php tests/pages-tools-human-closure-contract.php
          php tests/system-components-human-language-contract.php
          php tests/update-compat-human-language-contract.php
          php tests/update-refresh-policy-current-contract.php
          php tests/visible-console-v2-contract.php
          python3 - <<'PY'
          import subprocess
          expected={
            'includes/admin-runtime-support.php',
            'tests/error-recovery-human-language-contract.php',
          }
          actual=set(subprocess.check_output(['git','diff','--name-only','origin/main...HEAD']).decode().splitlines())
          if actual != expected:
              print('EXPECTED',sorted(expected)); print('ACTUAL',sorted(actual)); raise SystemExit('FAIL_OPS_EXACT_FILE_FENCE')
          PY
          echo "OPS_HEAD=$(git rev-parse HEAD)"
          echo 'PASS_S01_C02_ERROR_RECOVERY_UX_CODE_GATE'

  m3u8:
    runs-on: ubuntu-24.04
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      REPO: llhzx2018/vf-tools-m3u8
      BRANCH: work/s01-c03-error-recovery-ux-20260907
      EXPECTED_HEAD: 609a7283574050faeba4cd1fb219531b4c6b4f2e
      EXPECTED_MAIN: 3a50a8557fbdb634f56ab6fd14a3d9072bd927c5
    steps:
      - name: Gate M3U8 recovery final-owner UX
        shell: bash
        run: |
          set -euo pipefail
          test -n "$READ_TOKEN"
          echo 'MAIN_WRITE_USED=NO RELEASE_USED=NO DISTRIBUTION_USED=NO PRODUCTION_WRITE_USED=NO MIGRATION_USED=NO'
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/${REPO}.git" repo
          cd repo
          git checkout -q "$BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(cat VERSION)" = '1.25.28'
          grep -Fq 'Version: 1.25.28' src/vf-tool-m3u8.php
          find src tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php tests/unit/error-recovery-final-owner-contract.php
          php tests/unit/admin-human-language-contract.php
          php tests/unit/dashboard-human-language-contract.php
          php tests/unit/host-recovery-human-language-contract.php
          php tests/unit/recovery-runtime-human-language-followup-contract.php
          php tests/unit/settings-human-language-followup-contract.php
          php tests/unit/package-physical-locator-contract.php
          php tests/unit/update-refresh-policy-contract.php
          php tests/unit/visible-console-v2-contract.php
          php tests/unit/bootstrap-upgrade-contract.php
          php tests/frontend-s01-uiux-final-owner-contract.php
          python3 - <<'PY'
          import subprocess
          expected={
            'src/admin/admin-loader.php',
            'src/admin/admin-console.php',
            'tests/unit/error-recovery-final-owner-contract.php',
          }
          actual=set(subprocess.check_output(['git','diff','--name-only','origin/main...HEAD']).decode().splitlines())
          if actual != expected:
              print('EXPECTED',sorted(expected)); print('ACTUAL',sorted(actual)); raise SystemExit('FAIL_M3U8_EXACT_FILE_FENCE')
          PY
          echo "M3U8_HEAD=$(git rev-parse HEAD)"
          echo 'PASS_S01_C03_ERROR_RECOVERY_UX_CODE_GATE'
