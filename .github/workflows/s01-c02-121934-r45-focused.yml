name: S01-C02 1.21.934 R45 Focused Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/s01-c02-121934-r45-focused.yml'

permissions:
  contents: read

jobs:
  focused-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_REPOSITORY: llhzx2018/vf-tools-ops
      TARGET_SHA: 4e7433f94a54f79a7cd62094c6ad12bb20c49d41
      EXPECTED_VERSION: 1.21.934
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Verify credential
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN"
          echo "PRIVATE_READ=PASS"

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target

      - name: Verify identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n' < target/VERSION)" = "$EXPECTED_VERSION"
          grep -Fq "Version: $EXPECTED_VERSION" target/vf-ops.php
          grep -Fq "S01-SHELL-HEADER-VISUAL-LOCK-R45" target/vf-ops.php
          echo "CANDIDATE_IDENTITY=PASS"

      - name: PHP syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l target/vf-ops.php
          php -l target/includes/views/admin-style-helpers/admin-s01-uiux-polish.php
          php -l target/tests/s01-c02-121932-navigation-role-r43-contract.php
          php -l target/tests/s01-c02-121933-navigation-flyout-r44-contract.php
          php -l target/tests/s01-c02-121934-shell-header-visual-lock-r45-contract.php
          echo "PHP_SYNTAX=PASS"

      - name: Shell lineage contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          php target/tests/s01-c02-121927-structural-pagehead-r38-contract.php
          php target/tests/s01-c02-121928-single-shell-r39-contract.php
          php target/tests/s01-c02-121929-css-shell-authority-r40-contract.php
          php target/tests/s01-c02-121932-navigation-role-r43-contract.php
          php target/tests/s01-c02-121933-navigation-flyout-r44-contract.php
          php target/tests/s01-c02-121934-shell-header-visual-lock-r45-contract.php
          echo "R38_R45_LINEAGE=PASS"

      - name: JS syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check target/assets/js/admin-s01-domain-shell-r1.js
          echo "JS_SYNTAX=PASS"

      - name: Upload sanitized evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-121934-r45-focused-${{ github.run_id }}
          path: target/VERSION
          retention-days: 7
