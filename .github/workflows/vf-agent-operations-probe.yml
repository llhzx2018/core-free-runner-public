name: VF Agent Operations Dispatch Probe

on:
  push:
    branches: [vf-agent-operations-v1]
    paths:
      - 'vf-agent/probes/**'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate probe payload
        shell: bash
        run: |
          set -euo pipefail
          probe="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^vf-agent/probes/.*\.json$' | head -n1)"
          test -n "$probe"
          python - "$probe" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1], encoding='utf-8'))
          assert data.get('expected') == 'PASS'
          assert data.get('probe_id')
          print('PROBE_PASS', data['probe_id'])
          PY
