name: TEMP P07-M05 VFTest exact-source native acceptance gaps
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p07-m05-vftest-missing-native-gates-20261125.yml'
permissions:
  contents: read
concurrency:
  group: p07-m05-vftest-native-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  p07-m05-native-completion:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.actor == 'llhzx2018' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'temp/p07-m05-vftest-missing-native-gates-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      P07_SHA: '14cb3f01536e5fd798515ed82e8e8e626a0e7949'
      P07_TREE: 'e7f95b0955a13dca924be3c89efffeb605eab5e0'
      P07_BASE: 'fd113376cf8e44c6a3bc00fbe47f34c2a354726a'
      PYTHONDONTWRITEBYTECODE: '1'
      NO_COLOR: '1'
    steps:
      - name: Exact P07 private source checkout transient only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 14cb3f01536e5fd798515ed82e8e8e626a0e7949
          path: transient-private-source
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable source, tree, base and module identity
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd transient-private-source
          [[ "$(git rev-parse HEAD)" == "$P07_SHA" ]]
          [[ "$(git rev-parse HEAD^{tree})" == "$P07_TREE" ]]
          git cat-file -e "$P07_BASE^{commit}"
          [[ "$(cat VERSION)" == "0.1.0" ]]
          test -f lib/m05_installed_p07_guard.py
          test -f lib/m05_environment_guard.py
          echo P07_M05_VFTEST_EXACT_SOURCE=PASS
      - name: Execute complete native terminal UX V3 PR gates
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd transient-private-source
          root="$RUNNER_TEMP/p07-vftest"
          mkdir -p "$root"
          check() {
            local label="$1"
            shift
            if ! timeout 240 "$@" >"$root/$label.log" 2>&1; then
              echo "P07_M05_VFTEST_GATE=FAIL:$label"
              grep -E '^(FAIL|ERROR): test_[A-Za-z0-9_]+ ' "$root/$label.log" | head -12 || true
              exit 13
            fi
            grep -E '^Ran [0-9]+ tests?' "$root/$label.log" || true
            echo "P07_M05_VFTEST_GATE=PASS:$label"
          }
          check ux_canonical python3 -B scripts/check_p07_terminal_ux.py
          check module_boundary python3 -B scripts/check_p07_modules.py
          check ux_pr_diff python3 -B scripts/check_p07_terminal_ux.py --base-ref "$P07_BASE"
          check ux_unit python3 -B -m unittest discover -s tests -p test_p07_terminal_ux_contract.py -q
          check module_unit python3 -B -m unittest discover -s tests -p test_p07_module_contract.py -q
          check m05_terminal python3 -B -m unittest discover -s tests -p test_p07_m05_vultr_terminal_ux.py -q
          echo P07_M05_VFTEST_TERMINAL_UX_NATIVE=PASS
      - name: Execute native MariaDB owner policy and M05 engine safety suites
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd transient-private-source
          root="$RUNNER_TEMP/p07-vftest"
          check() {
            local label="$1"
            shift
            if ! timeout 240 "$@" >"$root/$label.log" 2>&1; then
              echo "P07_M05_VFTEST_GATE=FAIL:$label"
              grep -E '^(FAIL|ERROR): test_[A-Za-z0-9_]+ ' "$root/$label.log" | head -12 || true
              exit 13
            fi
            grep -E '^Ran [0-9]+ tests?' "$root/$label.log" || true
            echo "P07_M05_VFTEST_GATE=PASS:$label"
          }
          bash -n bin/vfops-init-ui
          check mariadb_owner python3 -B -m unittest discover -s tests -p test_mariadb_owner_policy.py -q
          check server_migration python3 -B -m unittest discover -s tests -p test_server_migration.py -q
          check m05_engine_boundary python3 -B -m unittest discover -s tests -p test_p07_m05_db_engine_boundary.py -q
          check m05_install_order python3 -B -m unittest discover -s tests -p test_p07_m05_first_install_order.py -q
          check mariadb_init_skip python3 -B -m unittest discover -s tests -p test_p07_mariadb_init_skip.py -q
          echo P07_M05_VFTEST_MARIADB_NATIVE=PASS
      - name: Always remove P07 private tree and disposable test logs
        if: always()
        shell: bash
        run: |
          set +e
          set +x
          rm -rf -- "$GITHUB_WORKSPACE/transient-private-source" "$RUNNER_TEMP/p07-vftest"
          test ! -e "$GITHUB_WORKSPACE/transient-private-source"
          echo P07_M05_VFTEST_PRIVATE_CLEANUP=PASS
