name: TEMP S01-C02 Ops 1.21.809 Production Readback
on:
  push:
    branches: [temp/s01-c02-v121809-production-readback-20260904]
    paths: ['.github/workflows/temp-s01-c02-v121809-production-readback.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Enumerate VF REST and fresh-read Production
        run: |
          set -Eeuo pipefail
          BASE='https://www3.m3u8.one'
          curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 45 "$BASE/wp-json/" -o /tmp/root.json
          echo '=== VF_REST_ROUTES ==='
          jq -r '.routes | to_entries[] | select(.key|test("^/vf-ops/v1/")) | [.key, ([.value.endpoints[]?.methods[]?] | unique | join(","))] | @tsv' /tmp/root.json | sort | head -n 120

          echo '=== DOMAIN_AUTHORITY ==='
          curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 45 "$BASE/wp-json/vf-ops/v1/s01-domain-authority" | jq -c '{pluginVersion,status,authorityFinalHost,configuredPublicBaseUrl,authorityMatch}'

          echo '=== RELEVANT_PUBLIC_GETS ==='
          jq -r '.routes | to_entries[] | select(.key|test("^/vf-ops/v1/")) | select(.key|test("s01|static|publish|preflight|seo|boundary|candidate|closure";"i")) | select(any(.value.endpoints[]?; any(.methods[]?; .=="GET"))) | .key' /tmp/root.json | sort -u | head -n 40 >/tmp/routes.txt
          while IFS= read -r route; do
            [ -n "$route" ] || continue
            body=/tmp/body.json
            code="$(curl -sS --retry 2 --retry-delay 1 --connect-timeout 15 --max-time 45 -o "$body" -w '%{http_code}' "$BASE/wp-json$route" || true)"
            echo "ROUTE=$route HTTP=$code"
            if jq -e . "$body" >/dev/null 2>&1; then
              jq -c 'if type=="object" then with_entries(select(.key|test("password|token|secret|nonce|email|user";"i")|not)) else . end' "$body" | head -c 12000; echo
            else
              head -c 1000 "$body"; echo
            fi
          done </tmp/routes.txt

          echo 'PASS_V121809_PRODUCTION_READBACK_PROBE'
