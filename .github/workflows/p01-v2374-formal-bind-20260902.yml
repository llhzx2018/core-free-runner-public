name: P01 V2.37.4 Formal Bind
on:
  push:
    branches: [release/p01-v2374-hotfix-20260902]
    paths: [.github/workflows/p01-v2374-formal-bind-20260902.yml]
permissions:
  actions: read
  contents: read
jobs:
  bind:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCT_BRANCH: release/v2.37.4-formal-source-20260902
      CANDIDATE: b3fd44a44d937f1a990e8e1ebd8d20fa21c67e1c
      CANDIDATE_TREE: 79278ffd39a05fd82bacd758189c452e08a6b63f
      RUNTIME_TREE: 369f24a5320b9c7ebbb950a06c2711b8ca3b4f93
      READINESS_RUN: '33604312715'
    steps:
      - name: Gate evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$READINESS_RUN --jq .conclusion)" = success
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.PRODUCT_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Bind exact readiness evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('VF_PROJECT.json'); d=json.loads(p.read_text(encoding='utf-8'))
          assert d['production_version']=='2.37.3'
          assert d['published_release']['version']=='2.37.3'
          assert d['candidate_version']=='2.37.4'
          d['formal_release_state']='V2.37.4 CANDIDATE READINESS PASS / FORMAL SOURCE BOUND / NOT PUBLISHED'
          d['candidate_state']='V2.37.4 CANDIDATE READINESS PASS / FORMAL SOURCE BOUND'
          d['next_action']='Generate and freeze V2.37.4 Formal Artifact; run Strict Fresh against frozen bytes; publish only after PASS.'
          c=d['v2_37_4_release_candidate']
          c['candidate_readiness_run']=33604312715; c['candidate_readiness']='PASS'
          c['candidate_source']='b3fd44a44d937f1a990e8e1ebd8d20fa21c67e1c'
          c['candidate_tree']='79278ffd39a05fd82bacd758189c452e08a6b63f'
          c['runtime_tree']='369f24a5320b9c7ebbb950a06c2711b8ca3b4f93'; c['state']='FORMAL SOURCE BIND / NOT PUBLISHED'
          d['current_change']['candidate_readiness_run']=33604312715; d['current_change']['candidate_readiness']='PASS'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python3 -m json.tool VF_PROJECT.json >/dev/null
          git diff --check
          test "$(git diff --name-only)" = VF_PROJECT.json
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VF_PROJECT.json
          git commit -m 'release(P01): bind V2.37.4 candidate PASS'
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          git push origin HEAD:$PRODUCT_BRANCH
          printf 'P01_V2374_FORMAL_BIND=PASS\nFORMAL_SOURCE=%s\nTREE=%s\nRUNTIME_TREE=%s\nREADINESS_RUN=%s\nOWNER_PRODUCTION_WRITE=NO\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" "$(git rev-parse HEAD:src)" "$READINESS_RUN" | tee /tmp/p01-v2374-formal-bind.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-v2374-formal-bind-${{ github.run_id }}
          path: /tmp/p01-v2374-formal-bind.txt
          if-no-files-found: warn
          retention-days: 90
