name: TEMP P07 M03 release145 migration UX proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p07-m03-release145.yml'
      - 'harness/p07-m03-release145/**'
permissions:
  contents: read
jobs:
  proof:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'maintenance/p07-m03-release145-free-proof-20261122'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_VERSION: '0.1.0'
      TARGET_REPO: 'llhzx2018/vf-server-ops'
      TARGET_SHA: 'fa5288fe055fedab78c2ab45e91ed57283be50e1'
      TARGET_TREE: 'd4de87342fd0498ba4279dc13002e613f716359c'
      TARGET_BASE: '547ada1cd51f59026b879376e958fc387e88271a'
      EXPECTED_ZIP_SHA: 'e694d294711d36b970a1e49afd7f57e4400b7df29527576ac2329724b38a54b8'
      PYTHONDONTWRITEBYTECODE: '1'
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Audit immutable free lane identity
        run: |
          python3 -B scripts/ephemeral_lane_spec.py audit-rendered --spec harness/p07-m03-release145/lane.json --input .github/workflows/temp-p07-m03-release145.yml
      - name: Check out exact private candidate in temporary workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: .p07-private-product
      - name: Check out live private governance in temporary workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: .p07-private-governance
      - name: Verify candidate, public authority and actual terminal routes
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          product="$GITHUB_WORKSPACE/.p07-private-product"
          gov="$GITHUB_WORKSPACE/.p07-private-governance"
          [[ "$(git -C "$product" rev-parse HEAD)" == "$TARGET_SHA" ]]
          [[ "$(git -C "$product" rev-parse 'HEAD^{tree}')" == "$TARGET_TREE" ]]
          git -C "$product" merge-base --is-ancestor "$TARGET_BASE" HEAD
          cd "$product"
          check() {
            local marker="$1"; shift
            if "$@" > "$RUNNER_TEMP/p07-145-private.log" 2>&1; then
              echo "$marker=PASS"
            else
              echo "$marker=FAIL"
              exit 1
            fi
          }
          check P07_145_AUTHORITY python3 -B .github/checks/check_gov_doc_ci.py --project-root . --gov-root "$gov" --project-id P07 --profile cli --workflow .github/workflows/ci.yml --require-git
          check P07_145_ARCHITECTURE python3 -B .github/checks/architecture_gate.py --manifest .github/checks/code_architecture.json --gov-root "$gov" --git-root . --base-sha "$TARGET_BASE" --head-sha "$TARGET_SHA"
          check P07_145_SECRET_SCAN python3 -B scripts/secret_scan.py --root .
          check P07_145_UX_GATE python3 -B scripts/check_p07_terminal_ux.py --base-ref "$TARGET_BASE"
          check P07_145_MIGRATION_REGRESSION python3 -B -m unittest -q \
            tests.test_p07_m03_failed_task_ux tests.test_p07_m03_safe_batch_terminal_ux \
            tests.test_p07_m03_terminal_ux_v3 tests.test_p07_m03_d04_preparation_checklist \
            tests.test_p07_m03_d04_prepared_online_ui tests.test_p07_m03_d04_whole_vps_online_ui \
            tests.test_menu3_modular tests.test_server_migration tests.test_server_migration_pull \
            tests.test_p07_m03_d04_release_scope tests.test_p07_m03_safe_batch
      - name: Reproduce the exact package and prove upgrade and rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          stage="$RUNNER_TEMP/p07-145-proof"
          product="$GITHUB_WORKSPACE/.p07-private-product"
          harness="$GITHUB_WORKSPACE/harness/p07-m03-release145"
          mkdir -m 700 "$stage"
          download() {
            local url="$1" api="$2" name="$3" sha="$4"
            if curl --proto '=https' -fsSL --connect-timeout 8 --max-time 35 "$url" -o "$name" &&
                printf '%s  %s\n' "$sha" "$name" | sha256sum -c --status; then return 0; fi
            curl --proto '=https' -fsSL --connect-timeout 8 --max-time 40 -H 'Accept: application/octet-stream' "$api" -o "$name"
            printf '%s  %s\n' "$sha" "$name" | sha256sum -c --status
          }
          repo=llhzx2018/core-free-runner-public
          download "https://github.com/$repo/releases/download/p07-m03-v0.1.0-release144-20261122/P07-M03-0.1.0-release144.zip" \
            "https://api.github.com/repos/$repo/releases/assets/778474753" "$stage/official144.zip" eeddddad32814542d620e13ec46d9567e377af6ef4639cb17e78d26acc05af5d
          download "https://github.com/$repo/releases/download/p07-m03-v0.1.0-release142-20261120/P07-M03-0.1.0-release142.zip" \
            "https://api.github.com/repos/$repo/releases/assets/769843045" "$stage/official142.zip" dc6978463e8e73a224e7cccb2bdffe9710bc3bb478076b670703bbb164bda87e
          result="$stage/result"
          baseline_wrapper="$GITHUB_WORKSPACE/installers/p07-m03-release144-atomic.sh"
          builder="$harness/build-release145-ux-candidate.py"
          python3 -B "$builder" "$stage/official144.zip" "$product" "$result" "$baseline_wrapper"
          python3 -B "$builder" "$stage/official144.zip" "$product" "$stage/second" "$baseline_wrapper"
          zip=P07-M03-0.1.0-release145.zip
          printf '%s  %s\n' "$EXPECTED_ZIP_SHA" "$zip" > "$result/SHA256SUMS"
          (cd "$result" && sha256sum -c SHA256SUMS)
          cmp "$result/$zip" "$stage/second/$zip"
          cmp "$result/candidate-wrapper.sh" "$stage/second/candidate-wrapper.sh"
          if ! bash "$harness/test-release145-ux-upgrade.sh" "$stage/official144.zip" "$stage/official142.zip" \
              "$result/$zip" "$result/candidate-wrapper.sh" > "$RUNNER_TEMP/p07-145-upgrade.log" 2>&1; then
            sed -n '/^P07_145_[A-Z0-9_]*=PASS$/p' "$RUNNER_TEMP/p07-145-upgrade.log"
            echo P07_145_UPGRADE=FAIL
            exit 1
          fi
          sed -n '/^P07_145_[A-Z0-9_]*=PASS$/p' "$RUNNER_TEMP/p07-145-upgrade.log"
      - name: Clean temporary private work
        if: always()
        shell: bash
        run: |
          rm -rf -- .p07-private-product .p07-private-governance "$RUNNER_TEMP/p07-145-proof"
          rm -f -- "$RUNNER_TEMP/p07-145-private.log" "$RUNNER_TEMP/p07-145-upgrade.log"
