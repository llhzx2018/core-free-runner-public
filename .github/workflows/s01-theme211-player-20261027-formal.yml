name: S01 Theme exact formal release
on:
  push:
    branches: [task/s01-theme211-player-20261027]
    paths: ['.github/workflows/s01-theme211-player-20261027-formal.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.211
  TARGET_SHA: 7b5e6b50a7836cb5360f8c8d9b7171b4d1de0b18
  TARGET_TREE: 34964ecba71b42ec38c1990db5e387504992ecdf
  BASE_SHA: ac47490a8cf42b0d42f8ccf5ee8f748bbc8e89cc
  LANE_ID: s01-theme211-player-20261027
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: control
      - name: Formal identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-theme211-player-20261027/formal-spec.json --input control/.github/workflows/s01-theme211-player-20261027-formal.yml
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 7b5e6b50a7836cb5360f8c8d9b7171b4d1de0b18
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact candidate, merged tree and required evidence readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider candidate-proof
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40532522898 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40532522898 --jq .head_sha)" = 93af867923330595a0640e607fd532da09cdc7c1
          test "$(gh api repos/$TARGET_REPO/commits/main --jq .sha)" = "$TARGET_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$TARGET_SHA --jq .tree.sha)" = "$TARGET_TREE"
          gh run download 40532522898 --repo llhzx2018/core-free-runner-public --name s01-home-40532522898 --dir candidate-proof
          cmp candidate-proof/state-before.sha256 candidate-proof/state-after.sha256
          cmp candidate-proof/contracts-before.json candidate-proof/contracts-after.json
          python3 control/lanes/s01-theme211-player-20261027/package.py
          python3 - <<'PYVERIFY'
          import json,pathlib,subprocess,urllib.parse
          r=pathlib.Path('candidate-proof')
          old=json.loads((r/'package.json').read_text());new=json.loads(pathlib.Path('proof/package.json').read_text())
          assert old['source']=='d237a46a62cdb36cae01f714dd60350814c22ac4'
          for name in ['integration.json','hero-parity.json','clean-install.json','bootstrap.json','native-lifecycle.json','progress-navigation.json']:
              assert json.loads((r/name).read_text())['status']=='PASS'
          hero=json.loads((r/'hero-parity.json').read_text());assert hero['cases']==16 and hero['other_tool_hero']=='BYTE_IDENTICAL'
          after=json.loads((r/'after-results.json').read_text());assert after['status']=='PASS' and len(after['rows'])==6
          for lang in ['en','zh']:
              for width in [1440,1024]:assert (r/f'player-{lang}-{width}.png').stat().st_size>500
              assert (r/f'player-{lang}-playing.png').stat().st_size>500
          assert json.loads((r/'before-public.json').read_text())['pages']==json.loads((r/'after-public.json').read_text())['pages']
          for k in ['status','version','tree','sha256','bytes','files']: assert old[k]==new[k],k
          assert new['sha256']=='6b2439f2f6f88a6d44c60376fb930bd4a4b610c8aa16b3ca66f783e4c92a9578' and new['bytes']==2015530
          coverage=json.loads(pathlib.Path('control/lanes/s01-theme211-player-20261027/release-authority.json').read_text())
          assert set(coverage['required'])=={'TESTING','GIT','UA_UI','SEO','SECURITY','INSTALL','UPGRADE','DATA_SCHEMA','PERFORMANCE'}
          assert coverage['source']=='d237a46a62cdb36cae01f714dd60350814c22ac4' and coverage['tree']=='34964ecba71b42ec38c1990db5e387504992ecdf'
          assert coverage['owner_preview_runtime']=='N_A'
          assert coverage['release_mode']=='PROJECT_PREVIEW_N_A'
          assert coverage['owner_real_use']=='POST_PRODUCTION_REQUIRED'
          assert coverage['production_auto_apply'] is False
          for item in coverage['required'].values():
              assert item['sha'] and item['acceptance']
              endpoint='repos/llhzx2018/gov-doc/contents/'+urllib.parse.quote(item['path'],safe='/')+'?ref=main'
              live=json.loads(subprocess.check_output(['gh','api',endpoint]))
              assert live['sha']==item['sha'],item['path']
              item['evidence_status']='PASS_EXACT_CANDIDATE_MACHINE'
          coverage['candidate_status']='PASS_EXACT_CANDIDATE_MACHINE'
          coverage['candidate_run']='40532522898'
          coverage['merged_source']='7b5e6b50a7836cb5360f8c8d9b7171b4d1de0b18'
          coverage['formal_release_gate']='PASS'
          coverage['production_effect']='NOT_PROVEN_POST_MANUAL_UPGRADE_READBACK_REQUIRED'
          pathlib.Path('proof/public-authority-coverage.json').write_text(json.dumps(coverage,ensure_ascii=False,indent=2))
          print('MERGED_TREE_EQUALS_TESTED_TREE_AND_EXACT_PACKAGE_PASS')
          PYVERIFY
      - name: Publish only the exact verified package
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.35.211 --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create v1.35.211 provider/vf-tools-theme_V1.35.211.zip --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Theme V1.35.211' --notes '仅精修中英文播放器工具详情页的呈现：参考hls.js官方演示的输入/媒体/进阶诊断层级，压紧标题、移除本页面包屑与重复开始入口、减少工作区多层边框和阴影，统一内容基线与说明/FAQ字号间距。保留原H1、自定义文案/标签、Provider控件/模式/播放与存储行为、其他工具布局及URL/SEO合同。后台登记本页参考及限定开发范围，不自动写入人工通过。精确候选通过PHP16个输入/其他工具标题输出保持、中英文1440/1024桌面、空输入/错误/清空/专业模式/能力测试/真实内置示例播放、六个邻近页面与SEO Head保持，以及干净安装和210升级回退重复安装与数据保护。476运行文件，正式ZIP远端字节校验。手机暂缓，Production仍由Owner手工升级后最终复验。' --latest
          fi
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/v1.35.211 --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh release view v1.35.211 --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - name: Authenticated remote ZIP byte comparison
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download v1.35.211 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.211.zip --dir remote
          cmp provider/vf-tools-theme_V1.35.211.zip remote/vf-tools-theme_V1.35.211.zip
          echo '6b2439f2f6f88a6d44c60376fb930bd4a4b610c8aa16b3ca66f783e4c92a9578  remote/vf-tools-theme_V1.35.211.zip' | sha256sum -c
          test "$(stat -c %s remote/vf-tools-theme_V1.35.211.zip)" = 2015530
          gh release view v1.35.211 --repo "$TARGET_REPO" --json url,publishedAt,tagName > proof/formal-release.json
          echo FORMAL_RELEASE_EXACT_REMOTE_ASSET_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-home-formal-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target provider remote candidate-proof
