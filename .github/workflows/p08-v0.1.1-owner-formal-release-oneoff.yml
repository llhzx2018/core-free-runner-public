name: P08 0.1.1 scoped formal release and core-updates from verified exact-source (one-off)

on:
  push:
    branches:
      - task/p08-r32-package-proof-20261109

permissions:
  contents: read

concurrency:
  group: p08-formal-v0.1.1-owner-approved-private
  cancel-in-progress: false

jobs:
  publish-formal:
    if: github.repository == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      P08_FORMAL_EXACT_SHA: df17d7aad970a96bbfac86000e58df3d9211901f
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      P08_DISTRIBUTION_APPROVED: '1'
    steps:
      - name: Preflight exact certified source, prior independent machine success and scoped credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test -n "$VF_RELEASE_WRITE_TOKEN" || { echo P08_RELEASE_BLOCKED=RELEASE_WRITE_CREDENTIAL_ABSENT; exit 1; }
          for tool in gh jq curl git python3 sha256sum tar; do command -v "$tool" >/dev/null; done
          tmp="$(mktemp -d)"
          trap 'rm -rf -- "$tmp"' EXIT
          curl -fsSL --retry 2 -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/runs/42731913827' > "$tmp/runner.json"
          jq -e --arg sha '83325111abda8f050a85fe28b7b801444ec35a38' \
            '.id == 42731913827 and .status == "completed" and .conclusion == "success" and .head_sha == $sha' \
            "$tmp/runner.json" >/dev/null || { echo P08_RELEASE_BLOCKED=EXACT_MACHINE_PASS_NOT_CONFIRMED; exit 1; }
          export GH_TOKEN="$VF_RELEASE_WRITE_TOKEN"
          test "$(gh api repos/llhzx2018/vf-lander/commits/main --jq '.sha')" = "$P08_FORMAL_EXACT_SHA" \
            || { echo P08_RELEASE_BLOCKED=PRODUCT_MAIN_CHANGED; exit 1; }
          # Release token is Contents-only; verify immutable two-merge lineage,
          # not a Pull Requests API endpoint requiring an unrelated scope.
          test "$(gh api "repos/llhzx2018/vf-lander/commits/$P08_FORMAL_EXACT_SHA" --jq '.parents[0].sha')" = "b284b6eab4a433858e668d177bd4e808838547b5" \
            || { echo P08_RELEASE_BLOCKED=FINAL_MAIN_PARENT_DRIFT; exit 1; }
          test "$(gh api repos/llhzx2018/vf-lander/commits/b284b6eab4a433858e668d177bd4e808838547b5 --jq '.parents[1].sha')" = "bc47324bb5ff9c3db86abadcf3aa47ddd658b89b" \
            || { echo P08_RELEASE_BLOCKED=ORIGINAL_PR_HEAD_NOT_IN_MAIN_MERGE; exit 1; }
          for target in llhzx2018/vf-lander llhzx2018/core-updates; do
            gh api "repos/$target" | jq -e '.permissions.push == true' >/dev/null \
              || { echo P08_RELEASE_BLOCKED=REPOSITORY_WRITE_NOT_GRANTED; exit 1; }
          done
          if gh release view v0.1.1 -R llhzx2018/vf-lander >/dev/null 2>&1; then
            echo P08_RELEASE_BLOCKED=EXISTING_FORMAL_RELEASE
            exit 1
          fi
          echo P08_FORMAL_PREFLIGHT_EXACT_MAIN_AND_MACHINE_PASS=PASS

      - name: Checkout private exact merged P08 source without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-lander
          ref: df17d7aad970a96bbfac86000e58df3d9211901f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: p08-product

      - name: Install PHP 8.4 Composer dependencies
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mbstring, dom, xml, curl, pdo_mysql, pdo_sqlite, sqlite3, fileinfo, zip
          tools: composer:v2

      - name: Install Node.js 22 for exact-source Vite frontend
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rebuild and verify three actual formal candidate archives from immutable merged main
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd "$GITHUB_WORKSPACE/p08-product"
          test "$(git rev-parse HEAD)" = "$P08_FORMAL_EXACT_SHA"
          test "$(cat VERSION)" = 0.1.1
          test -z "$(git status --porcelain --untracked-files=all)"
          bash -n backend/bin/build-p08-release-candidates.sh
          bash -n backend/bin/publish-p08-verified-release.sh
          bash backend/bin/build-p08-release-candidates.sh "$RUNNER_TEMP/p08-v0.1.1-formal-candidates"
          (cd "$RUNNER_TEMP/p08-v0.1.1-formal-candidates" && sha256sum -c --status SHA256SUMS)
          echo P08_FORMAL_THREE_REAL_ARCHIVES_BOUND_TO_MAIN=PASS

      - name: Publish 0.1.1 tag, GitHub Release three assets, remote SHA256, official P08 channel
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd "$GITHUB_WORKSPACE/p08-product"
          test "$(git rev-parse HEAD)" = "$P08_FORMAL_EXACT_SHA"
          test -n "$VF_RELEASE_WRITE_TOKEN"
          bash backend/bin/publish-p08-verified-release.sh \
            "$RUNNER_TEMP/p08-v0.1.1-formal-candidates" --promote-channel
          echo P08_RELEASE_AND_CHANNEL_PUBLISHED_WITH_REMOTE_READBACK=PASS

      - name: Read back exact official tag and channel without touching Production
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          export GH_TOKEN="$VF_RELEASE_WRITE_TOKEN"
          test "$(gh api repos/llhzx2018/vf-lander/git/ref/tags/v0.1.1 --jq '.object.sha')" = "$P08_FORMAL_EXACT_SHA"
          gh api repos/llhzx2018/vf-lander/releases/tags/v0.1.1 | \
            jq -e '.draft == false and .prerelease == false and ([.assets[] | select(.name=="vf-lander-0.1.1-ATOMIC.tar.gz") ] | length) == 1' >/dev/null
          gh api -H 'Accept: application/vnd.github.raw+json' \
            'repos/llhzx2018/core-updates/contents/projects/P08.json?ref=main' | \
            jq -e --arg source "$P08_FORMAL_EXACT_SHA" \
              '.enabled==true and .target_version=="0.1.1" and .product_identity==$source and .release_tag=="v0.1.1"' >/dev/null
          echo P08_V0_1_1_FORMAL_DISTRIBUTION=PASS
          echo P08_PRODUCTION_CHANGED=NO

      - name: Remove private source and formal package copies from transient workspace
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- "$GITHUB_WORKSPACE/p08-product" "$RUNNER_TEMP/p08-v0.1.1-formal-candidates"
          echo P08_PRIVATE_SOURCE_AND_PACKAGE_CLEANUP_ATTEMPTED
          echo P08_PRIVATE_ARTIFACT_UPLOAD=NO
          echo P08_PRODUCTION_CHANGED=NO
