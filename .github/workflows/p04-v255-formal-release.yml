name: P04 V2.5.5 Formal Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p04-v255-formal-release.yml'

permissions:
  contents: read

concurrency:
  group: p04-v255-formal-release
  cancel-in-progress: false

env:
  PRODUCT_REPO: llhzx2018/vf-infra
  CORE_UPDATES_REPO: llhzx2018/core-updates
  CANDIDATE_COMMIT: 11d76ae5949d832c4fa31bc6fe540792fab21d8c
  CANDIDATE_TREE: aad90ae404d6a51646f3f9bcf589e819c8fee217
  TARGET_VERSION: 2.5.5
  SOURCE_VERSION: 2.5.3
  EXPECTED_BYTES: '217485'
  EXPECTED_SHA256: 8a42054b0ae507fa1e91dd55884efea4d94c29cedf3375dade50bff17b14669a
  EXPECTED_REPAIR_SHA256: aa2a9741ebcdc489b5c1c29b0bf3a702e516d0918ae6c39da9a1b6183c8376cb
  EXPECTED_PAYLOAD_SHA256: 1e5867c546b7e93bcf0cf5e3838dfaccdf6f4f00a2437ce3a8029a5854cc578d
  EXPECTED_TARGET_SOURCE_SHA256: c6a6aca5e0572a9c6f02eff21ae0cbf78c769c7eef3dd1d7608c5f98a0743aa2
  EXPECTED_RUNTIME_FILES: '150'
  EXPECTED_RUNTIME_FINGERPRINT: 43e7a968f990f098471121f81d2de0cb7bc47cdb806e6865e5a8009dc0440524
  EXPECTED_MARKER: VF_INFRA_ONLINE_HANDOFF_V1

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require unified release credentials
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$WRITE_TOKEN" && test -n "$READ_TOKEN"
          echo 'UNIFIED_RELEASE_CREDENTIALS=PASS'

      - name: Checkout exact V2.5.5 Product Candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: 11d76ae5949d832c4fa31bc6fe540792fab21d8c
          fetch-depth: 0
          path: vf-infra
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}

      - name: Exact Product / Runtime / Consumer Contract gate
        run: |
          set -Eeuo pipefail
          cd vf-infra
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test "$(cat VERSION)" = "$TARGET_VERSION"
          grep -Fq "public const HANDOFF_MARKER = '$EXPECTED_MARKER';" src/app/Core/Update/UpdateContract.php
          rm -rf "$RUNNER_TEMP/v255-runtime" "$RUNNER_TEMP/v255-release"
          python3 scripts/build-release-tree.py "$RUNNER_TEMP/v255-runtime" | tee "$RUNNER_TEMP/v255-runtime-build.json"
          python3 - <<'PY'
          import json,os,pathlib
          x=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'v255-runtime-build.json').read_text().strip().splitlines()[-1])
          assert x['version']=='2.5.5' and x['schema']==14 and x['file_count']==150
          assert x['source_fingerprint']=='43e7a968f990f098471121f81d2de0cb7bc47cdb806e6865e5a8009dc0440524'
          print('RUNTIME_IDENTITY_GATE=PASS')
          PY
          echo 'CONSUMER_HANDOFF_CONTRACT=PASS'

      - name: Build exact frozen V2.5.5 assets
        run: |
          set -Eeuo pipefail
          cd vf-infra
          python3 scripts/build-v255-update-release.py --target-runtime "$RUNNER_TEMP/v255-runtime" --output "$RUNNER_TEMP/v255-release" | tee "$RUNNER_TEMP/v255-artifact-build.json"
          out="$RUNNER_TEMP/v255-release"
          update="$out/VF_Infra_V2.5.5_UPDATE.zip"
          atomic="$out/VF_Infra_V2.5.5_ATOMIC.zip"
          repair="$out/repair-v2.5.5.php"
          test "$(stat -c '%s' "$update")" = "$EXPECTED_BYTES"
          test "$(sha256sum "$update" | awk '{print $1}')" = "$EXPECTED_SHA256"
          test "$(stat -c '%s' "$atomic")" = "$EXPECTED_BYTES"
          test "$(sha256sum "$atomic" | awk '{print $1}')" = "$EXPECTED_SHA256"
          cmp -s "$update" "$atomic"
          test "$(sha256sum "$repair" | awk '{print $1}')" = "$EXPECTED_REPAIR_SHA256"
          python3 scripts/validate-online-atomic-package.py --runtime "$RUNNER_TEMP/v255-runtime" --zip "$update" --version 2.5.5 --sha256 "$EXPECTED_SHA256"
          python3 scripts/validate-online-atomic-package.py --runtime "$RUNNER_TEMP/v255-runtime" --zip "$atomic" --version 2.5.5 --sha256 "$EXPECTED_SHA256"
          python3 - <<'PY'
          import json,os,pathlib
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'v255-release'
          p=out/'PACKAGE_MANIFEST.json'; m=json.loads(p.read_text(encoding='utf-8'))
          assert m['version']=='2.5.5' and m['schema']==14
          assert m['allowed_source_versions']==['2.5.3']
          assert m['payload_file_count']==10
          assert m['payload_sha256']=='1e5867c546b7e93bcf0cf5e3838dfaccdf6f4f00a2437ce3a8029a5854cc578d'
          assert m['production_source_manifest_sha256']=='c6a6aca5e0572a9c6f02eff21ae0cbf78c769c7eef3dd1d7608c5f98a0743aa2'
          assert m['online_handoff_marker']=='VF_INFRA_ONLINE_HANDOFF_V1'
          assert m['online_handoff_contract']=='consumer-derived' and m['online_handoff_gate']=='PASS'
          m.update({'source_commit':'11d76ae5949d832c4fa31bc6fe540792fab21d8c','source_tree':'aad90ae404d6a51646f3f9bcf589e819c8fee217','target_runtime_file_count':150,'target_runtime_source_fingerprint':'43e7a968f990f098471121f81d2de0cb7bc47cdb806e6865e5a8009dc0440524','schema_migration':'NONE'})
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          import hashlib
          def sha(q): return hashlib.sha256(q.read_bytes()).hexdigest()
          files=[out/'VF_Infra_V2.5.5_ATOMIC.zip',out/'VF_Infra_V2.5.5_UPDATE.zip',out/'repair-v2.5.5.php',p]
          for n in ['README_INSTALL.txt','PRODUCTION_SOURCE_MANIFEST_EXPECTED.txt']:
              q=out/n
              if q.exists(): files.append(q)
          (out/'SHA256SUMS.txt').write_text(''.join(f'{sha(q)}  {q.name}\n' for q in files),encoding='utf-8')
          print('PACKAGE_MANIFEST_GATE=PASS')
          PY
          unzip -t "$update" >/dev/null
          unzip -t "$atomic" >/dev/null
          test "$(unzip -Z1 "$update")" = 'repair-v2.5.5.php'
          unzip -p "$update" repair-v2.5.5.php | grep -Fq "$EXPECTED_MARKER"
          echo 'FROZEN_CANDIDATE_ASSET_IDENTITY=PASS'
          echo 'ONLINE_HANDOFF_MARKER=PASS'
          echo 'TESTED_ARTIFACT_IDENTITY_RECONFIRMED=PASS'

      - name: Assert unique V2.5.5 Release identity
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          ! gh release view v2.5.5 --repo "$PRODUCT_REPO" >/dev/null 2>&1
          code=$(curl -sS -o "$RUNNER_TEMP/v255-tag-check.json" -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$PRODUCT_REPO/git/ref/tags/v2.5.5")
          test "$code" = '404'
          echo 'UNIQUE_V255_RELEASE_IDENTITY=PASS'

      - name: Create V2.5.5 Formal Release
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          out="$RUNNER_TEMP/v255-release"
          gh release create v2.5.5 --repo "$PRODUCT_REPO" --target "$CANDIDATE_COMMIT" --title 'VF Infra V2.5.5' \
            --notes 'P04 V2.5.5：针对已发布 V2.5.4 Online Handoff packaging contract defect 的最小补丁发布。Builder/Consumer/Package Gate 统一由 UpdateContract::HANDOFF_MARKER 驱动；Schema 14、业务模型与 V2.5.4 已验证 UA/UI Runtime 保持不变。V2.5.4 继续保留为 PUBLISHED / KNOWN DEFECT / DO NOT USE FOR ONLINE UPGRADE。Production 当前仍为 V2.5.3，本 Release 不代表 Production 已升级。' \
            "$out/VF_Infra_V2.5.5_ATOMIC.zip" "$out/VF_Infra_V2.5.5_UPDATE.zip" "$out/PACKAGE_MANIFEST.json" "$out/SHA256SUMS.txt"
          echo 'V255_FORMAL_RELEASE_CREATE=PASS'

      - name: Authenticated Remote Release exact readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          cd vf-infra
          gh api "repos/$PRODUCT_REPO/releases/tags/v2.5.5" > "$RUNNER_TEMP/v255-release.json"
          python3 - "$RUNNER_TEMP/v255-release.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x['tag_name']=='v2.5.5' and x['draft'] is False and x['prerelease'] is False
          assert x['target_commitish']=='11d76ae5949d832c4fa31bc6fe540792fab21d8c'
          assert {a['name'] for a in x['assets']}=={'VF_Infra_V2.5.5_ATOMIC.zip','VF_Infra_V2.5.5_UPDATE.zip','PACKAGE_MANIFEST.json','SHA256SUMS.txt'}
          print('REMOTE_RELEASE_METADATA=PASS')
          PY
          tag=$(gh api "repos/$PRODUCT_REPO/git/ref/tags/v2.5.5" --jq '.object.sha')
          test "$tag" = "$CANDIDATE_COMMIT"
          for name in VF_Infra_V2.5.5_UPDATE.zip VF_Infra_V2.5.5_ATOMIC.zip; do
            asset_id=$(python3 - "$RUNNER_TEMP/v255-release.json" "$name" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1])); print(next(a['id'] for a in x['assets'] if a['name']==sys.argv[2]))
          PY
            )
            remote="$RUNNER_TEMP/$name.remote"
            curl --fail --silent --show-error --location --max-time 90 -H 'Accept: application/octet-stream' -H "Authorization: Bearer $READ_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$PRODUCT_REPO/releases/assets/$asset_id" -o "$remote"
            test "$(stat -c '%s' "$remote")" = "$EXPECTED_BYTES"
            test "$(sha256sum "$remote" | awk '{print $1}')" = "$EXPECTED_SHA256"
            cmp -s "$remote" "$RUNNER_TEMP/v255-release/$name"
            unzip -t "$remote" >/dev/null
            python3 scripts/validate-online-atomic-package.py --runtime "$RUNNER_TEMP/v255-runtime" --zip "$remote" --version 2.5.5 --sha256 "$EXPECTED_SHA256"
            unzip -p "$remote" repair-v2.5.5.php > "$RUNNER_TEMP/${name}.repair.php"
            test "$(sha256sum "$RUNNER_TEMP/${name}.repair.php" | awk '{print $1}')" = "$EXPECTED_REPAIR_SHA256"
          done
          cmp -s "$RUNNER_TEMP/VF_Infra_V2.5.5_UPDATE.zip.remote" "$RUNNER_TEMP/VF_Infra_V2.5.5_ATOMIC.zip.remote"
          published=$(python3 - "$RUNNER_TEMP/v255-release.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1]))['published_at'])
          PY
          )
          printf 'RELEASE_PUBLISHED_AT=%s\n' "$published" > "$RUNNER_TEMP/v255-release.env"
          echo 'REMOTE_RELEASE_ASSET_EXACT_READBACK=PASS'
          echo 'TESTED_ARTIFACT_EQUALS_DELIVERED_ARTIFACT=PASS'

      - name: Checkout core-updates after exact Release PASS
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: main
          fetch-depth: 0
          path: core-updates
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}

      - name: Verify V2.5.4 quarantine before superseding offer
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          x=json.load(open('core-updates/projects/P04.json'))
          assert x['enabled'] is False and x['target_version']=='2.5.4'
          assert x['release_tag']=='v2.5.4'
          assert x['asset_sha256']=='ee15dd1efefe74da2c1c7d76baa40d26ad04e1daa0eeac5caa909ca922aa187c'
          assert 'defect' in x.get('notes','').lower()
          print('V254_QUARANTINE_PRESERVED=PASS')
          PY

      - name: Publish exact V2.5.5 core-updates Manifest
        run: |
          set -Eeuo pipefail
          source "$RUNNER_TEMP/v255-release.env"
          cd core-updates
          python3 - "$RELEASE_PUBLISHED_AT" <<'PY'
          import json,pathlib,sys
          obj={
            'schema_version':'1.0','project_id':'P04','component_id':'APP','enabled':True,
            'target_version':'2.5.5','update_type':'ATOMIC','from_versions':['2.5.3'],
            'schema_from':'14','schema_to':'14','repository':'llhzx2018/vf-infra','release_tag':'v2.5.5',
            'asset_name':'VF_Infra_V2.5.5_UPDATE.zip','asset_bytes':217485,
            'asset_sha256':'8a42054b0ae507fa1e91dd55884efea4d94c29cedf3375dade50bff17b14669a',
            'backup_required':True,'rollback_supported':True,'released_at':sys.argv[1],'minimum_php':'8.0.0',
            'notes':'V2.5.5 patch release fixes the confirmed V2.5.4 Online Handoff packaging contract defect. V2.5.4 remains PUBLISHED / KNOWN DEFECT / SUPERSEDED FOR ONLINE UPDATE. Production source supported here is V2.5.3 only; V2.5.4 -> V2.5.5 is NOT VERIFIED / NOT ADVERTISED.'
          }
          pathlib.Path('projects/P04.json').write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add projects/P04.json
          git diff --cached --quiet && { echo 'V255_MANIFEST_CHANGE_MISSING=FAIL'; exit 1; }
          git commit -m 'release(P04): publish V2.5.5 update manifest'
          git push origin HEAD:main
          echo "CORE_UPDATES_MAIN=$(git rev-parse HEAD)" >> "$RUNNER_TEMP/v255-release.env"
          echo 'V255_CORE_UPDATES_PUBLISH=PASS'

      - name: Remote Manifest exact readback
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --location --max-time 30 -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github.raw+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$CORE_UPDATES_REPO/contents/projects/P04.json?ref=main" -o "$RUNNER_TEMP/P04.remote.json"
          python3 - <<'PY'
          import json,os,pathlib
          x=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'P04.remote.json').read_text(encoding='utf-8'))
          assert x['enabled'] is True
          assert x['target_version']=='2.5.5' and x['update_type']=='ATOMIC'
          assert x['from_versions']==['2.5.3']
          assert x['schema_from']=='14' and x['schema_to']=='14'
          assert x['repository']=='llhzx2018/vf-infra' and x['release_tag']=='v2.5.5'
          assert x['asset_name']=='VF_Infra_V2.5.5_UPDATE.zip'
          assert x['asset_bytes']==217485
          assert x['asset_sha256']=='8a42054b0ae507fa1e91dd55884efea4d94c29cedf3375dade50bff17b14669a'
          assert '2.5.4' not in x['from_versions']
          assert 'KNOWN DEFECT' in x['notes']
          print('V255_REMOTE_MANIFEST_EXACT_READBACK=PASS')
          PY
          echo 'FORMAL_RELEASE_AND_MANIFEST_ALL_PASS'
