name: P05 V1.1.9 Clean FULL Publish

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      P05_MAIN_SOURCE: b47b188cd0a4395d206c21ffc026d08acde786f5
      P05_VERIFIED_TREE: b99613f2d2d2e9d4f5d04fe69372fd57ed427dc4
      VERSION: 1.1.9
      ASSET: VF_SEO_V1.1.9_FULL.zip
      RECEIPT: VF_SEO_V1.1.9_RELEASE_RECEIPT.txt
    steps:
      - name: Checkout exact P05 main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: b47b188cd0a4395d206c21ffc026d08acde786f5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: p05

      - name: Verify exact main and verified tree
        working-directory: p05
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$P05_MAIN_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$P05_VERIFIED_TREE"
          test "$(cat VERSION)" = "$VERSION"
          node -e "const p=require('./package.json'); if(p.version!==process.env.VERSION) process.exit(1)"
          node -e "const p=require('./VF_PROJECT.json'); if(p.version!==process.env.VERSION||p.target_version!==process.env.VERSION||p.working_version!==process.env.VERSION) process.exit(1)"
          test ! -e VF_INSTALL_INSTANCE.json
          test ! -e .vf-seo-site-instance.json
          echo "P05_MAIN_SOURCE=$P05_MAIN_SOURCE"
          echo "P05_VERIFIED_TREE=$P05_VERIFIED_TREE"

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: p05/package-lock.json

      - name: Install dependencies and static gates
        working-directory: p05
        run: |
          set -euo pipefail
          npm ci
          npm run release:source:gate
          npm run lint
          npm run typecheck
          php -l php/src/RuntimePaths.php
          php -l php/src/SiteInstance.php
          php -l php/src/setup-bootstrap.php
          php -l php/src/Installer.php
          test ! -e php/src/FreshInstallRecovery.php
          bash php/tests/cloudpanel-fpm-home-cache-smoke.sh

      - name: Build test staging
        working-directory: p05
        run: |
          set -euo pipefail
          npm run build
          npm run build:php-release
          npm run php:release:gate
          test ! -e build/vf-seo-php-release/VF_INSTALL_INSTANCE.json
          test ! -e build/vf-seo-php-release/.vf-seo-site-instance.json
          find build/vf-seo-php-release -type f | sort > /tmp/test-staging-before.txt
          while IFS= read -r file; do sha256sum "$file"; done < /tmp/test-staging-before.txt > /tmp/test-staging-before.sha

      - name: Formal real-install regression on isolated/copy-safe paths
        working-directory: p05
        run: |
          set -euo pipefail
          VF_INSTALL_ROOT=build/vf-seo-php-release bash php/tests/browser-install-smoke.sh
          VF_INSTALL_ROOT=build/vf-seo-php-release bash php/tests/cloudpanel-fpm-real-install-smoke.sh
          google-chrome --version
          "$CHROMEWEBDRIVER/chromedriver" --version
          VF_INSTALL_ROOT=build/vf-seo-php-release python3 php/tests/browser-install-e2e.py
          test ! -e build/vf-seo-php-release/VF_INSTALL_INSTANCE.json
          test ! -e build/vf-seo-php-release/.vf-seo-site-instance.json

      - name: Prove test staging remained byte-identical
        working-directory: p05
        run: |
          set -euo pipefail
          find build/vf-seo-php-release -type f | sort > /tmp/test-staging-after.txt
          while IFS= read -r file; do sha256sum "$file"; done < /tmp/test-staging-after.txt > /tmp/test-staging-after.sha
          cmp /tmp/test-staging-before.txt /tmp/test-staging-after.txt
          cmp /tmp/test-staging-before.sha /tmp/test-staging-after.sha

      - name: Rebuild pristine release staging after all tests
        working-directory: p05
        run: |
          set -euo pipefail
          rm -rf build/vf-seo-php-release dist/client
          npm run build:php-release
          npm run php:release:gate
          test ! -e build/vf-seo-php-release/VF_INSTALL_INSTANCE.json
          test ! -e build/vf-seo-php-release/.vf-seo-site-instance.json
          test ! -e build/vf-seo-php-release/.env
          test ! -e build/vf-seo-php-release/php/src/FreshInstallRecovery.php
          if find build/vf-seo-php-release -type f \( -iname '*.sqlite' -o -iname '*.sqlite3' -o -iname '*.db' -o -iname '*.wal' -o -iname '*.shm' \) | grep -q .; then
            echo 'runtime database leaked into release staging' >&2
            exit 1
          fi
          if find build/vf-seo-php-release -type f \( -name 'setup.lock.json' -o -name 'runtime.env' \) | grep -q .; then
            echo 'runtime config/lock leaked into release staging' >&2
            exit 1
          fi
          find build/vf-seo-php-release -type f | sort > /tmp/release-staging-files.txt
          while IFS= read -r file; do sha256sum "$file"; done < /tmp/release-staging-files.txt > /tmp/release-staging.sha

      - name: Deterministic pristine FULL build
        working-directory: p05
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZipInfo, ZIP_DEFLATED
          import os
          root=Path('build/vf-seo-php-release')
          asset=os.environ['ASSET']
          def build(out):
              with ZipFile(out,'w') as z:
                  for p in sorted(x for x in root.rglob('*') if x.is_file()):
                      rel=p.relative_to(root).as_posix()
                      info=ZipInfo(rel,(1980,1,1,0,0,0))
                      mode=p.stat().st_mode & 0o777
                      info.external_attr=(mode & 0xFFFF) << 16
                      info.compress_type=ZIP_DEFLATED
                      z.writestr(info,p.read_bytes(),compress_type=ZIP_DEFLATED,compresslevel=9)
          build('../'+asset+'.a')
          build('../'+asset+'.b')
          PY
          cmp "../$ASSET.a" "../$ASSET.b"
          mv "../$ASSET.a" "../$ASSET"
          rm "../$ASSET.b"
          python3 - <<'PY'
          from zipfile import ZipFile
          import os
          asset='../'+os.environ['ASSET']
          forbidden={'VF_INSTALL_INSTANCE.json','.vf-seo-site-instance.json','.env'}
          with ZipFile(asset) as z:
              names=z.namelist()
              assert not forbidden.intersection(names), forbidden.intersection(names)
              assert not any(n.endswith(('.sqlite','.sqlite3','.db','.wal','.shm')) for n in names)
              assert not any(n.endswith('/setup.lock.json') or n.endswith('/runtime.env') for n in names)
              assert 'php/src/FreshInstallRecovery.php' not in names
          print('P05_FINAL_ZIP_RUNTIME_MARKERS=ABSENT')
          PY
          sha="$(sha256sum "../$ASSET" | awk '{print $1}')"
          bytes="$(stat -c '%s' "../$ASSET")"
          files="$(find build/vf-seo-php-release -type f | wc -l | tr -d ' ')"
          zip_files="$(python3 -c 'from zipfile import ZipFile; import os; print(len(ZipFile("../"+os.environ["ASSET"]).namelist()))')"
          test "$files" = "$zip_files"
          printf 'P05_VERSION=%s\nP05_SOURCE=%s\nP05_TREE=%s\nP05_FILES=%s\nP05_BYTES=%s\nP05_SHA256=%s\nINSTALL_IDENTITY_AUTHORITY=WEBROOT_MARKER\nFINAL_ZIP_RUNTIME_MARKERS=ABSENT\nPRIVATE_STATE_ISOLATION=INSTANCE_SCOPED\nLEGACY_STATE_FULL_DELETE_REINSTALL=PASS\nFORMAL_TEST_STAGING_IMMUTABLE=PASS\nPOST_TEST_PRISTINE_REBUILD=PASS\nCHROME_E2E=PASS\nPRODUCTION=NOT_DEPLOYED\n' "$VERSION" "$P05_MAIN_SOURCE" "$P05_VERIFIED_TREE" "$files" "$bytes" "$sha" > "../$RECEIPT"
          echo "P05_FILES=$files" >> "$GITHUB_ENV"
          echo "P05_BYTES=$bytes" >> "$GITHUB_ENV"
          echo "P05_SHA256=$sha" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          cd p05
          test -f "../$ASSET"
          test -f "../$RECEIPT"
          if gh release view "v$VERSION" --repo llhzx2018/vf-seo >/dev/null 2>&1; then
            echo "release v$VERSION already exists" >&2
            exit 1
          fi
          gh release create "v$VERSION" \
            --repo llhzx2018/vf-seo \
            --target "$P05_MAIN_SOURCE" \
            --title 'P05 · VF SEO v1.1.9 · Install Instance Authority Fix' \
            --notes 'Corrects the real fresh-install failure left by v1.1.8. The v1.1.8 publication pipeline ran install tests directly against formal staging and the final ZIP inherited a runtime Site Instance marker. V1.1.9 makes VF_INSTALL_INSTANCE.json the single webroot install-identity authority, scopes private state per instance, preserves old instance data without auto-adopting it, and removes database/history heuristics from fresh-install detection. Browser and Chrome tests now run without mutating formal staging, and the release pipeline rebuilds a pristine staging from the exact main source after all tests before creating the deterministic FULL. Production remains NOT_DEPLOYED.' \
            "../$ASSET" "../$RECEIPT"

      - name: Remote release readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/llhzx2018/vf-seo/releases/tags/v$VERSION" > /tmp/release.json
          python3 - <<'PY'
          import json, os
          r=json.load(open('/tmp/release.json'))
          assert r['tag_name']=='v'+os.environ['VERSION']
          assert r['target_commitish']==os.environ['P05_MAIN_SOURCE']
          assets={a['name']:a for a in r['assets']}
          a=assets[os.environ['ASSET']]
          receipt=assets[os.environ['RECEIPT']]
          assert int(a['size'])==int(os.environ['P05_BYTES'])
          digest=a.get('digest')
          if digest is not None:
              assert digest=='sha256:'+os.environ['P05_SHA256'], (digest,os.environ['P05_SHA256'])
          print('P05_RELEASE_ID='+str(r['id']))
          print('P05_ASSET_ID='+str(a['id']))
          print('P05_RECEIPT_ASSET_ID='+str(receipt['id']))
          print('P05_REMOTE_DIGEST='+str(digest))
          print('P05_V119_RELEASE_REMOTE_READBACK=PASS')
          PY

      - name: Machine receipt
        run: |
          echo 'P05_V119_FORMAL_RELEASE=PASS'
          echo "P05_MAIN_SOURCE=$P05_MAIN_SOURCE"
          echo "P05_VERIFIED_TREE=$P05_VERIFIED_TREE"
          echo "P05_FILES=$P05_FILES"
          echo "P05_BYTES=$P05_BYTES"
          echo "P05_SHA256=$P05_SHA256"
          echo 'WEBROOT_MARKER_IS_AUTHORITY=PASS'
          echo 'FINAL_ZIP_RUNTIME_MARKERS=ABSENT'
          echo 'PRIVATE_STATE_ISOLATION=INSTANCE_SCOPED'
          echo 'LEGACY_STATE_FULL_DELETE_REINSTALL=PASS'
          echo 'FORMAL_TEST_STAGING_IMMUTABLE=PASS'
          echo 'POST_TEST_PRISTINE_REBUILD=PASS'
          echo 'CHROME_E2E=PASS'
          echo 'PRODUCTION_WRITE=0'
