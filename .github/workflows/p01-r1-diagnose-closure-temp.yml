name: p01-r1-diagnose-closure-temp

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-r1-diagnose-closure-temp.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      TARGET_SHA: eef38a3bdc662d86346f3b299dbd9bc1c2464bba
    steps:
      - name: Checkout runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout exact P01 PR head
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" product
          git -C product fetch -q --depth 1 origin "$TARGET_SHA"
          git -C product checkout -q --detach FETCH_HEAD
          test "$(git -C product rev-parse HEAD)" = "$TARGET_SHA"
          echo P01_R1_EXACT_SOURCE=PASS

      - name: PHP syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          php -l src/setup.php
          php -l src/diagnose.php
          php -l src/system-health.php
          php -l tests/unit/admin_diagnose_entry_closure_r1_contract.php
          echo P01_R1_PHP_SYNTAX=PASS

      - name: Focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          tests=(
            tests/unit/admin_diagnose_entry_closure_r1_contract.php
            tests/unit/admin_backend_closure_contract.php
            tests/unit/admin_system_health_r18_contract.php
            tests/unit/admin_system_closure_contract.php
            tests/unit/admin_retired_routes_css_r32_contract.php
          )
          for t in "${tests[@]}"; do php "$t"; done
          echo P01_R1_FOCUSED_CONTRACTS=PASS

      - name: Source clean
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "$(git -C product status --porcelain)"
          echo P01_R1_SOURCE_UNCHANGED=PASS
