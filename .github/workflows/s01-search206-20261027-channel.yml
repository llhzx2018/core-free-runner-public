name: S01 exact Theme channel contract
on:
  push:
    branches: [task/s01-search206-20261027]
    paths: ['.github/workflows/s01-search206-20261027-channel.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.206
  TARGET_SHA: 86cc735ccd5c48e7dde07018f1b04562ac97b23d
  UPDATE_SHA: 27285d65130c1c2d604a702c4441ad0d695b0580
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: 27285d65130c1c2d604a702c4441ad0d695b0580
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: source
      - name: Channel identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-search206-20261027/channel-spec.json --input control/.github/workflows/s01-search206-20261027-channel.yml
      - name: Exact changed manifest and native protocol tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          test "$(git -C source diff --name-only cfbf6702a099f5b008bb0e2a71a045506e23e096 27285d65130c1c2d604a702c4441ad0d695b0580)" = projects/S01-C01.json
          git -C source diff --exit-code cfbf6702a099f5b008bb0e2a71a045506e23e096 27285d65130c1c2d604a702c4441ad0d695b0580 -- projects/S01-C03.json
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PYCHANNEL'
          import json,os
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']==os.environ['TARGET_VERSION']
          assert m['asset_sha256']=='8e710ddfb5108933d9f1105d2a8df41971a6d459a543826395ef0a9a39d16655' and m['asset_bytes']==2009057
          assert m['runtime_files']==476 and '1.35.205' in m['from_versions']
          assert m['release_tag']=='v'+os.environ['TARGET_VERSION']
          print('EXACT_CHANNEL_CONTRACT_PASS')
          PYCHANNEL
      - name: Cleanup
        if: always()
        run: rm -rf source
