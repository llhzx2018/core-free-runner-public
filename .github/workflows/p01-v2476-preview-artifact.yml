name: P01 V2.47.6 Owner Preview Artifact Gate

on:
  pull_request:
    paths:
      - '.github/workflows/p01-v2476-preview-artifact.yml'

permissions:
  contents: read

concurrency:
  group: p01-v2476-owner-preview-artifact
  cancel-in-progress: false

jobs:
  artifact:
    if: github.head_ref == 'temp/p01-v2476-preview-artifact-20260910'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      BASE_SHA: 7b848c45c7e4b99812535b449a230ea77fc356f0
      CANDIDATE_SHA: cbc883ba9ad59042775fb1b76a58d1a93489ec79
      TARGET_BRANCH: release/v2.47.6-preview-20260910
      SOURCE_TAG: v2.47.5
      SOURCE_SHA: 4a5d2a4ddccdfb0e3ea70d62af83c7a664563fb5
      SOURCE_VERSION: 2.47.5
      TARGET_VERSION: 2.47.6
      EXPECTED_SCHEMA: '2026090401'
      PREVIEW_TAG: v2.47.6-preview.1
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}

    steps:
      - name: Preview-only release truth
        run: |
          echo OWNER_PREVIEW_RUNTIME_APPLICABILITY=REQUIRED
          echo OWNER_PREVIEW_RUNTIME=NOT_RUN
          echo OWNER_REAL_USE=NOT_RUN
          echo FORMAL_RELEASE_ALLOWED=false
          echo STABLE_DISTRIBUTION_UPDATED=false
          echo PRODUCTION_WRITE=false

      - name: Exact live preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN" && test -n "$RELEASE_TOKEN"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/main" --jq '.object.sha')" = "$BASE_SHA"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/${TARGET_BRANCH}" --jq '.object.sha')" = "$CANDIDATE_SHA"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/tags/${SOURCE_TAG}" --jq '.object.sha')" = "$SOURCE_SHA"
          if GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/tags/${PREVIEW_TAG}" >/dev/null 2>&1; then echo PREVIEW_BLOCK=TAG_ALREADY_EXISTS; exit 81; fi
          test "$(GH_TOKEN="$RELEASE_TOKEN" gh api "repos/${PRODUCT_REPO}" --jq '.permissions.push')" = true
          echo P01_V2476_ARTIFACT_PREFLIGHT=PASS

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.CANDIDATE_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          path: vf-start

      - name: Checkout exact V2.47.5 baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: baseline

      - name: Checkout proven artifact helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 1dd635d8e8d4485736458672fb7a5be397d94f89
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: helper

      - name: Checkout proven artifact template
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 0439b0df027ae0bc6c21a8dbf91b066a564130f9
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: template

      - name: Checkout proven Atomic primitives
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 0468b28ae57c368f80b03f85060318667bcc5834
          persist-credentials: false
          fetch-depth: 1
          path: proven

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd
          coverage: none

      - name: Bind exact candidate and baseline identities
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C vf-start rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C baseline rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n ' < vf-start/VERSION)" = "$TARGET_VERSION"
          test "$(tr -d '\r\n ' < vf-start/src/VERSION.txt)" = "$TARGET_VERSION"
          grep -Fq "define('VF_VERSION', '$TARGET_VERSION');" vf-start/src/app/bootstrap.php
          test "$(tr -d '\r\n ' < baseline/VERSION)" = "$SOURCE_VERSION"
          test "$(php -r '$p=json_decode(file_get_contents("vf-start/VF_PROJECT.json"),true); echo $p["working_schema_version"];')" = "$EXPECTED_SCHEMA"
          test -f proven/scripts/p01-build-release.py
          echo P01_V2476_ARTIFACT_IDENTITIES=PASS

      - name: Exact source delta and forbidden change gate
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C vf-start diff --name-only "$SOURCE_SHA" "$CANDIDATE_SHA" | sort >/tmp/p01-v2476-delta
          printf '%s\n' VERSION src/VERSION.txt src/app/bootstrap.php src/assets/prototype-density.css src/assets/workspace-domain-nav-base.css src/assets/workspace-domain-nav.css tests/unit/prototype_density_contract.php | sort >/tmp/p01-v2476-expected
          diff -u /tmp/p01-v2476-expected /tmp/p01-v2476-delta
          test -z "$(git -C vf-start diff --name-only "$SOURCE_SHA" "$CANDIDATE_SHA" -- src/migrations VF_PROJECT.json src/app/UpdateManager.php src/update.php src/app/Auth.php src/app/SecurityManager.php src/app/Repository.php)"
          echo P01_V2476_ARTIFACT_SCOPE=PASS

      - name: Deterministic FULL and ATOMIC UPDATE gate
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf formal candidate
          cp -a vf-start formal
          cp -a vf-start candidate
          cp helper/scripts/_tmp_p01_v2470_formal_artifact_gate.sh /tmp/p01-v2476-artifact-gate.sh
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path('/tmp/p01-v2476-artifact-gate.sh')
          s=p.read_text(encoding='utf-8')
          repl=[
            ('7f3492f70276d83efed371296d69709c1e991350',os.environ['CANDIDATE_SHA']),
            ('b70971514ccf1c6b8f3793bfc5a2200cad47dfe9',os.environ['CANDIDATE_SHA']),
            ('1bd95e8777e72f6cd89206ddb9daf934ad4e6b9e',os.environ['SOURCE_SHA']),
            ('33993725218',os.environ['GITHUB_RUN_ID']),
            ('BIND_PR=416','BIND_PR=0'),
            ('OWNER_AUTHORIZED_V2470_RELEASE_CHAIN_20260906','OWNER_AUTHORIZED_V2476_OWNER_PREVIEW_20260910'),
            ('V2470','V2476'),('v2470','v2476')]
          for a,b in repl:
              if a not in s: raise SystemExit('missing helper anchor '+a)
              s=s.replace(a,b)
          s=s.replace('2.47.0','__TARGET__').replace('2.46.4','2.47.5').replace('__TARGET__','2.47.6')
          old="src=src.replace(\"'release_type':'patch'\",\"'release_type':'minor'\")"
          if old not in s: raise SystemExit('release-type helper anchor missing')
          s=s.replace(old,"src=src.replace('V2.46.1 之后 Consolidated L2 Product Optimization 的正式发布版本。','V2.47.5 之后 prototype-led page density rebaseline 的维护版本。')",1)
          p.write_text(s,encoding='utf-8')
          PY
          chmod +x /tmp/p01-v2476-artifact-gate.sh
          bash /tmp/p01-v2476-artifact-gate.sh | tee /tmp/p01-v2476-artifact.log
          ASSETS=/tmp/p01-v2476-formal-artifacts
          for f in VF-Start-V2.47.6-FULL.zip VF-Start-V2.47.6-FULL.zip.sha256 VF_Start_V2.47.6_UPDATE.zip VF_Start_V2.47.6_UPDATE.zip.sha256; do test -f "$ASSETS/$f"; done
          (cd "$ASSETS" && sha256sum -c VF-Start-V2.47.6-FULL.zip.sha256 && sha256sum -c VF_Start_V2.47.6_UPDATE.zip.sha256)
          ! unzip -Z1 "$ASSETS/VF-Start-V2.47.6-FULL.zip" | grep -Eq '(^|/)(private|backups|uploads|runtime-data)(/|$)'
          echo P01_V2476_ARTIFACT_UPGRADE_GATE=PASS

      - name: Preview package identity and payload assertions
        shell: bash
        run: |
          set -Eeuo pipefail
          ASSETS=/tmp/p01-v2476-formal-artifacts
          unzip -p "$ASSETS/VF-Start-V2.47.6-FULL.zip" VERSION | tr -d '\r\n ' | grep -Fx "$TARGET_VERSION"
          unzip -Z1 "$ASSETS/VF_Start_V2.47.6_UPDATE.zip" | grep -F 'prototype-density.css'
          unzip -Z1 "$ASSETS/VF_Start_V2.47.6_UPDATE.zip" | grep -F 'workspace-domain-nav.css'
          unzip -Z1 "$ASSETS/VF_Start_V2.47.6_UPDATE.zip" | grep -F 'workspace-domain-nav-base.css'
          echo P01_V2476_PREVIEW_PACKAGE_IDENTITY=PASS

      - name: Publish exact preview prerelease
        env:
          GH_TOKEN: ${{ env.RELEASE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ASSETS=/tmp/p01-v2476-formal-artifacts
          gh api --method POST "repos/${PRODUCT_REPO}/git/refs" -f ref="refs/tags/${PREVIEW_TAG}" -f sha="$CANDIDATE_SHA" >/dev/null
          test "$(gh api "repos/${PRODUCT_REPO}/git/ref/tags/${PREVIEW_TAG}" --jq '.object.sha')" = "$CANDIDATE_SHA"
          cat >/tmp/p01-v2476-preview-notes.md <<EOF
          P01 · VF Start V2.47.6 Preview 1

          - Exact candidate: ${CANDIDATE_SHA}
          - Engineering main: ${BASE_SHA}
          - Previous formal release: ${SOURCE_TAG} / ${SOURCE_SHA}
          - Change: R21 prototype-led density rebaseline for Navigation / Watch / Topics / Courses / Channels / Projects / Tools / Software.
          - Schema: ${EXPECTED_SCHEMA}; Migration: NONE
          - Candidate Fresh Install / setup revisit protection / authenticated desktop+mobile Chromium: PASS on Runner 34570976871.
          - Deterministic FULL / ATOMIC UPDATE / checksum / existing-data preservation / backup+rollback / security: PASS on Runner ${GITHUB_RUN_ID}.
          - OWNER_PREVIEW_RUNTIME: NOT_RUN
          - OWNER_REAL_USE: NOT_RUN
          - Formal Release: BLOCKED until Owner Preview gate passes.
          - Stable Distribution: NOT UPDATED
          - Production: NOT WRITTEN / NOT VERIFIED
          EOF
          gh release create "$PREVIEW_TAG" "$ASSETS/VF-Start-V2.47.6-FULL.zip" "$ASSETS/VF-Start-V2.47.6-FULL.zip.sha256" "$ASSETS/VF_Start_V2.47.6_UPDATE.zip" "$ASSETS/VF_Start_V2.47.6_UPDATE.zip.sha256" --repo "$PRODUCT_REPO" --title 'VF Start V2.47.6 Preview 1' --notes-file /tmp/p01-v2476-preview-notes.md --prerelease --verify-tag
          echo P01_V2476_PREVIEW_PRERELEASE=PASS

      - name: Independent remote byte identity readback
        env:
          GH_TOKEN: ${{ env.PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ASSETS=/tmp/p01-v2476-formal-artifacts
          test "$(gh api "repos/${PRODUCT_REPO}/git/ref/tags/${PREVIEW_TAG}" --jq '.object.sha')" = "$CANDIDATE_SHA"
          test "$(gh api "repos/${PRODUCT_REPO}/releases/tags/${PREVIEW_TAG}" --jq '.prerelease')" = true
          rm -rf /tmp/p01-v2476-remote; mkdir -p /tmp/p01-v2476-remote
          gh release download "$PREVIEW_TAG" --repo "$PRODUCT_REPO" --dir /tmp/p01-v2476-remote
          LOCAL="$ASSETS" REMOTE=/tmp/p01-v2476-remote python3 - <<'PY'
          from pathlib import Path
          import hashlib,os
          l=Path(os.environ['LOCAL']); r=Path(os.environ['REMOTE'])
          names=['VF-Start-V2.47.6-FULL.zip','VF-Start-V2.47.6-FULL.zip.sha256','VF_Start_V2.47.6_UPDATE.zip','VF_Start_V2.47.6_UPDATE.zip.sha256']
          assert sorted(p.name for p in r.iterdir() if p.is_file())==sorted(names)
          for n in names:
              a,b=l/n,r/n; ha=hashlib.sha256(a.read_bytes()).hexdigest(); hb=hashlib.sha256(b.read_bytes()).hexdigest(); assert a.stat().st_size==b.stat().st_size and ha==hb; print(f'PREVIEW_ASSET={n}|{a.stat().st_size}|{ha}')
          print('P01_V2476_REMOTE_BYTES=PASS')
          PY

      - name: Final preview artifact verdict
        run: |
          echo P01_V2476_PREVIEW_ARTIFACT_GATE=PASS
          echo INSTALL_GATE=PASS_FROM_CANDIDATE_RUN_34570976871
          echo UPGRADE_GATE=PASS
          echo DATA_PRESERVATION_GATE=PASS
          echo BACKUP_ROLLBACK_GATE=PASS
          echo SECURITY_GATE=PASS
          echo TESTING_GATE=PASS
          echo UA_UI_MACHINE=PASS_FROM_CANDIDATE_RUN_34570976871
          echo OWNER_PREVIEW_RUNTIME=NOT_RUN
          echo OWNER_REAL_USE=NOT_RUN
          echo FORMAL_RELEASE=BLOCKED_OWNER_PREVIEW
          echo STABLE_DISTRIBUTION_UPDATED=false
          echo PRODUCTION_WRITE=false

      - name: Cleanup
        if: always()
        run: rm -rf vf-start baseline helper template proven formal candidate /tmp/p01-v2476-*