name: P02 V2.5.128 OWNER-approved Formal Release and Atomic distribution

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p02-v25128-publish-20261112.yml']

permissions:
  contents: read

jobs:
  publish:
    if: github.head_ref == 'verify/p02-v25128-formal-20261112'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Exact merged PRIVATE P02 source read for real runtime discovery probe
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-library
          ref: bc7100b61963843cc6a71f4b8c81d35ea84894cf
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Final exact-source proof and private immutable draft 8 of 8 gate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "${GH_TOKEN:-}" || { echo P02_RELEASE_WRITE_PERMISSION_MISSING; exit 1; }
          test "$(git -C product rev-parse HEAD)" = 'bc7100b61963843cc6a71f4b8c81d35ea84894cf'
          test "$(cat product/VERSION)" = '2.5.128'
          test "$(gh api repos/llhzx2018/vf-library/branches/main --jq .commit.sha)" = 'bc7100b61963843cc6a71f4b8c81d35ea84894cf'
          for run in 43148918133 43150617345; do
            test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$run --jq .conclusion)" = success
          done
          if gh api repos/llhzx2018/vf-library/git/ref/tags/v2.5.128 >/dev/null 2>&1; then echo P02_TAG_ALREADY_PUBLISHED_STOP; exit 1; fi
          gh api repos/llhzx2018/vf-library/releases/442473985 > "${RUNNER_TEMP}/p02-formal-draft.json"
          gh api repos/llhzx2018/core-updates/contents/projects/P02.json?ref=main > "${RUNNER_TEMP}/p02-prev-canonical-api.json"
          gh api repos/llhzx2018/core-free-runner-public/contents/projects/P02.json?ref=main > "${RUNNER_TEMP}/p02-prev-mirror-api.json"
          python3 - <<'PY'
          import json,os,base64
          from pathlib import Path
          temp=Path(os.environ['RUNNER_TEMP'])
          r=json.loads((temp/'p02-formal-draft.json').read_text())
          expected={"VF_Library_V2.5.128_FULL.zip":[534628,"sha256:3830f8410b07680331bc795f3a37c27cc23d36abaadbb1524ee01f18e9965564"],"VF_Library_V2.5.128_UPDATE.zip":[488580,"sha256:298f7241c88ce0df368dfe91b599ee38abe1c98d8bf4ea76eecd1118aed36d27"],"VF_Library_V2.5.128_ATOMIC.zip":[725715,"sha256:ddeac0c8573e3b36e273b779549958f075230ebe0514eb582023bbb78b43ea46"],"VF_Library_V2.5.128_SOURCE.zip":[1166519,"sha256:24b52bd0b2283f9a4d126c203f280c03c4495065778fe36eccb186e1437331bc"],"VF_Library_V2.5.128_RELEASE_MANIFEST.json":[2802,"sha256:477beea3c15460d189889062b23152123e9f6b248f5d1f68553af7817e75ed8f"],"VF_Library_V2.5.128_RELEASE_NOTES.md":[406,"sha256:eacaf2f421edb920e5127edaa5b52d5320a8d8d26f0599343a537b4c32083797"],"repair-v2.5.128.php":[963422,"sha256:ba4f020b7dfb34f480713d07185d8d59c49ead9bb4860cc293b53687464ee38f"],"SHA256SUMS.txt":[683,"sha256:52be7cf1d3b7a5204ae5c2ffc070af458e4e9d1b36bd8aef7f8b34289cb6ec3f"]}
          assert r['id']==442473985 and r['tag_name']=='v2.5.128'
          assert r['draft'] is True and r['published_at'] is None
          assert r['target_commitish']=='bc7100b61963843cc6a71f4b8c81d35ea84894cf'
          assets={a['name']:a for a in r['assets']}
          assert set(assets)==set(expected),'PRIVATE_FORMAL_DRAFT_ASSET_SET_MISMATCH'
          for name,(size,digest) in expected.items():
            assert assets[name]['size']==size and assets[name].get('digest')==digest and assets[name]['state']=='uploaded',('REMOTE_FORMAL_DIGEST_MISMATCH',name)
          canonical=json.loads((temp/'p02-prev-canonical-api.json').read_text())
          mirror=json.loads((temp/'p02-prev-mirror-api.json').read_text())
          a=base64.b64decode(canonical['content']);b=base64.b64decode(mirror['content'])
          assert a==b,'CHANNEL_MIRROR_DRIFT'
          c=json.loads(a)
          assert c['target_version']=='2.5.127' and c['release_id']==442384094
          assert c['release_tag']=='v2.5.127' and c['product_identity']=='c0cc9412a684aa463c3cbf3a63483ea0dacb25a2'
          assert c['schema_from']==c['schema_to']=='2401'
          assert c['from_versions']==["2.5.81","2.5.82","2.5.102","2.5.103","2.5.104","2.5.105","2.5.111","2.5.112","2.5.113","2.5.114","2.5.115","2.5.116","2.5.117","2.5.118","2.5.119","2.5.120","2.5.121","2.5.122","2.5.124"]
          print('P02_V25128_FORMAL_DRAFT_REMOTE_BYTES_8_8=PASS')
          print('P02_V25128_RELEASE_AND_CHANNEL_NO_RACE=PASS')
          PY
          live="$(curl -fsSL --max-time 12 --proto '=https' https://lib.kewaro.com/VERSION.txt | tr -d '\r\n')"
          case " 2.5.81 2.5.82 2.5.102 2.5.103 2.5.104 2.5.105 2.5.111 2.5.112 2.5.113 2.5.114 2.5.115 2.5.116 2.5.117 2.5.118 2.5.119 2.5.120 2.5.121 2.5.122 2.5.124 2.5.127 " in *" $live "*) echo "P02_V25128_PREPUBLICATION_PUBLIC_RUNTIME_IN_SOURCE_SET=$live";; *) echo P02_V25128_PRODUCTION_SOURCE_DRIFT_STOP; exit 1;; esac
          echo P02_PRODUCTION_FRESH_AUTHENTICATED_READBACK=NOT_PROVEN
      - name: Publish user-approved V2.5.128 GitHub formal Release and verify immutable tag/assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api --method PATCH repos/llhzx2018/vf-library/releases/442473985 -F draft=false -F prerelease=false > "${RUNNER_TEMP}/p02-published-write.json"
          gh api repos/llhzx2018/vf-library/releases/442473985 > "${RUNNER_TEMP}/p02-published.json"
          gh api repos/llhzx2018/vf-library/git/ref/tags/v2.5.128 > "${RUNNER_TEMP}/p02-tag.json"
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          temp=Path(os.environ['RUNNER_TEMP'])
          r=json.loads((temp/'p02-published.json').read_text())
          tag=json.loads((temp/'p02-tag.json').read_text())
          before=json.loads((temp/'p02-formal-draft.json').read_text())
          assert r['id']==442473985 and r['tag_name']=='v2.5.128'
          assert r['draft'] is False and r['prerelease'] is False and r['published_at']
          assert r['target_commitish']=='bc7100b61963843cc6a71f4b8c81d35ea84894cf'
          assert tag['ref']=='refs/tags/v2.5.128'
          assert tag['object']['sha']=='bc7100b61963843cc6a71f4b8c81d35ea84894cf' and tag['object']['type']=='commit'
          x={a['name']:(a['id'],a['size'],a.get('digest')) for a in before['assets']}
          y={a['name']:(a['id'],a['size'],a.get('digest')) for a in r['assets']}
          assert x==y and len(x)==8
          print('P02_V25128_FORMAL_GITHUB_RELEASE_PUBLISHED=PASS')
          print('P02_V25128_TAG_EXACT_MAIN_AND_8_ASSETS=PASS')
          print('P02_V25128_RELEASE_ID='+str(r['id']))
          print('P02_V25128_RELEASE_URL='+str(r['html_url']))
          PY
      - name: Advance canonical core-updates and public mirror to exact immutable formal UPDATE
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,json,base64
          temp=Path(os.environ['RUNNER_TEMP'])
          canonical=json.loads((temp/'p02-prev-canonical-api.json').read_text())
          mirror=json.loads((temp/'p02-prev-mirror-api.json').read_text())
          before=json.loads(base64.b64decode(canonical['content']))
          release=json.loads((temp/'p02-published.json').read_text())
          assert release['published_at']
          assert before['target_version']=='2.5.127'
          assert before['from_versions']==["2.5.81","2.5.82","2.5.102","2.5.103","2.5.104","2.5.105","2.5.111","2.5.112","2.5.113","2.5.114","2.5.115","2.5.116","2.5.117","2.5.118","2.5.119","2.5.120","2.5.121","2.5.122","2.5.124"]
          update=next(a for a in release['assets'] if a['name']=='VF_Library_V2.5.128_UPDATE.zip')
          assert update['digest']=='sha256:298f7241c88ce0df368dfe91b599ee38abe1c98d8bf4ea76eecd1118aed36d27'
          final=dict(before)
          final.update({
            'current_version':'2.5.127',
            'target_version':'2.5.128',
            'from_versions':["2.5.81","2.5.82","2.5.102","2.5.103","2.5.104","2.5.105","2.5.111","2.5.112","2.5.113","2.5.114","2.5.115","2.5.116","2.5.117","2.5.118","2.5.119","2.5.120","2.5.121","2.5.122","2.5.124","2.5.127"],
            'release_tag':'v2.5.128',
            'release_id':442473985,
            'product_identity':'bc7100b61963843cc6a71f4b8c81d35ea84894cf',
            'asset_name':update['name'],
            'asset_bytes':update['size'],
            'asset_sha256':update['digest'].removeprefix('sha256:'),
            'released_at':release['published_at'],
            'notes':'P02 · VF Library V2.5.128 正式发布：原位 W1 Reader 只读预览与现有 PHP/SQLite 搜索、工作台兼容；Schema 2401，无数据迁移。精确源码 bc7100b6；20 个正式旧版经真实 FULL→Atomic/repair 直升，资料、Scratch 与故障回滚验证通过；双次确定性构建、Clean FULL 首装、8 个正式资产远端哈希回读、真实备份/附件恢复与隔离性能回归通过。发布/分发不自动修改 Production；由 Owner 在后台手工升级和真实使用验收。'
          })
          raw=(json.dumps(final,ensure_ascii=False,indent=2)+'\n').encode()
          (temp/'p02-new-manifest.json').write_bytes(raw)
          b64=base64.b64encode(raw).decode('ascii')
          for name,previous,repo in (
            ('canonical',canonical,'core-updates'),
            ('mirror',mirror,'core-free-runner-public')):
            request={'message':'release(P02): publish V2.5.128 verified 20-source Atomic channel',
              'content':b64,'sha':previous['sha'],'branch':'main'}
            (temp/f'p02-{name}-request.json').write_text(json.dumps(request))
          print('P02_CANONICAL_AND_PUBLIC_MIRROR_PAYLOAD_SAME=YES')
          PY
          gh api --method PUT repos/llhzx2018/core-updates/contents/projects/P02.json \
            --input "${RUNNER_TEMP}/p02-canonical-request.json" > "${RUNNER_TEMP}/p02-canonical-write.json"
          gh api repos/llhzx2018/core-updates/contents/projects/P02.json?ref=main > "${RUNNER_TEMP}/p02-canonical-readback.json"
          python3 - <<'PY'
          from pathlib import Path
          import json,base64,os
          t=Path(os.environ['RUNNER_TEMP'])
          j=json.loads((t/'p02-canonical-readback.json').read_text())
          assert base64.b64decode(j['content'])==(t/'p02-new-manifest.json').read_bytes()
          print('P02_V25128_CANONICAL_CORE_UPDATES_READBACK=PASS')
          PY
          gh api --method PUT repos/llhzx2018/core-free-runner-public/contents/projects/P02.json \
            --input "${RUNNER_TEMP}/p02-mirror-request.json" > "${RUNNER_TEMP}/p02-mirror-write.json"
          gh api repos/llhzx2018/core-free-runner-public/contents/projects/P02.json?ref=main > "${RUNNER_TEMP}/p02-mirror-readback.json"
          python3 - <<'PY'
          import json,base64,os
          from pathlib import Path
          t=Path(os.environ['RUNNER_TEMP'])
          expected=(t/'p02-new-manifest.json').read_bytes()
          canon=base64.b64decode(json.loads((t/'p02-canonical-readback.json').read_text())['content'])
          mirror=base64.b64decode(json.loads((t/'p02-mirror-readback.json').read_text())['content'])
          assert canon==mirror==expected
          d=json.loads(expected)
          assert d['target_version']=='2.5.128' and len(d['from_versions'])==20
          assert d['release_id']==442473985
          assert d['asset_sha256']=='298f7241c88ce0df368dfe91b599ee38abe1c98d8bf4ea76eecd1118aed36d27'
          print('P02_V25128_CANONICAL_AND_PUBLIC_CHANNEL_BYTES_IDENTICAL=PASS')
          PY
      - name: Verify real P02 PHP UpdateCore public discovery and private immutable UPDATE transport
        shell: bash
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          if ! php -r 'exit(PHP_VERSION_ID>=80300&&extension_loaded("curl")?0:1);'; then timeout 180s sudo apt-get install -y php8.3-cli php8.3-curl; fi
          test "$(git -C product rev-parse HEAD)" = 'bc7100b61963843cc6a71f4b8c81d35ea84894cf'
          php -d display_errors=0 <<'PHP'
          <?php
          declare(strict_types=1);
          require_once 'product/src/app/CoreUpdates/GitHubClient.php';
          require_once 'product/src/app/CoreUpdates/UpdateCore.php';
          $from=['2.5.81','2.5.82','2.5.102','2.5.103','2.5.104','2.5.105','2.5.111','2.5.112','2.5.113','2.5.114','2.5.115','2.5.116','2.5.117','2.5.118','2.5.119','2.5.120','2.5.121','2.5.122','2.5.124','2.5.127'];
          $client=new \CoreUpdates\GitHubClient('');
          $manifest=$client->fetchProjectManifest('llhzx2018/core-free-runner-public','P02.json','main');
          if(($manifest['target_version']??null)!=='2.5.128'||$manifest['from_versions']!==$from)throw new RuntimeException('P02_PUBLIC_MIRROR_IDENTITY_WRONG');
          $core=new \CoreUpdates\UpdateCore('P02','APP');
          foreach($from as $v){ if(($core->check($v,'2401',$manifest)['status']??null)!=='AVAILABLE')throw new RuntimeException('P02_CURRENT_RELEASE_UNAVAILABLE_'.$v); }
          if($core->check('2.5.128','2401',$manifest)['status']!=='UP_TO_DATE')throw new RuntimeException('NEW_TARGET_NOT_UP_TO_DATE');
          if($core->check('2.5.125','2401',$manifest)['status']!=='BLOCKED_SOURCE_VERSION')throw new RuntimeException('INVALID_SOURCE_NOT_BLOCKED');
          if($core->check('2.5.127','2399',$manifest)['status']!=='BLOCKED_SCHEMA')throw new RuntimeException('INVALID_SCHEMA_NOT_BLOCKED');
          echo "P02_V25128_REAL_PHP_UPDATE_DISCOVERY_20_OF_20=PASS\n";
          echo "P02_V25128_REAL_PHP_TARGET_UP_TO_DATE_AND_DENIAL=PASS\n";
          $token=trim((string)getenv('VF_PRIVATE_READ_TOKEN'));
          if($token==='')throw new RuntimeException('RUNTIME_PRIVATE_READ_CAPABILITY_UNAVAILABLE');
          $path=rtrim((string)getenv('RUNNER_TEMP'),'/').'/p02-v25128-official-atomic.zip';
          try{
              (new \CoreUpdates\GitHubClient($token))->downloadReleaseAsset((string)$manifest['repository'],(string)$manifest['release_tag'],(string)$manifest['asset_name'],$path);
              if($core->verifyPackage($path,$manifest)['status']!=='VERIFIED')throw new RuntimeException('OFFICIAL_ASSET_FAILED_SHA_OR_SIZE');
              echo "P02_V25128_REAL_PRIVATE_UPDATE_DOWNLOAD_DIGEST=PASS\n";
          }finally{if(is_file($path))@unlink($path);}
          PHP
      - name: Explicit independent Production manual boundary
        shell: bash
        run: |
          echo P02_V25128_FORMAL_RELEASE=PASS
          echo P02_V25128_DISTRIBUTION=PASS
          echo P02_V25128_PRODUCTION_WRITE=NO
          echo P02_V25128_OWNER_MANUAL_UPGRADE_REQUIRED=YES
      - name: Clean private source and transient state
        if: always()
        shell: bash
        run: |
          rm -rf product "${RUNNER_TEMP}/p02-v25128-official-atomic.zip"
          echo PUBLIC_RUNNER_PRIVATE_ASSET_PERSISTENCE=NO
