name: TEMP skill-book V5.7 Current Distribution closure

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  close-current-distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOV_REPO: llhzx2018/gov-doc
      EXPECTED_MAIN_SHA: dbc2389c16c40107b48123189a17bef0e078f1c4
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Require registered VF capabilities
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VF_PRIVATE_READ_TOKEN" || { echo 'BLOCK=VF_PRIVATE_READ_TOKEN_MISSING'; exit 78; }
          test -n "$VF_RELEASE_WRITE_TOKEN" || { echo 'BLOCK=VF_RELEASE_WRITE_TOKEN_MISSING'; exit 79; }
          echo 'REGISTERED_CAPABILITIES=PASS'

      - name: Checkout exact GOV-DOC main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/gov-doc
          ref: ${{ env.EXPECTED_MAIN_SHA }}
          token: ${{ env.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: gov

      - name: Verify R4 Current Distribution authority
        working-directory: gov
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import json
          d=json.loads(Path('distribution/skills/CURRENT_SKILL_DISTRIBUTION.json').read_text(encoding='utf-8'))
          assert d['source_sha']=='27680edd2f21cb65a14ef0b5609b8e92515a12a0', d['source_sha']
          assert d['release_tag']=='skills-pack-2026.08.29-r4', d['release_tag']
          assert d['release_assets_state']=='PUBLISHED_REMOTE_VERIFIED'
          assert d['repository_download_state']=='PUBLISHED_REMOTE_VERIFIED'
          assert d['skill_count']==11
          book=next(x for x in d['skills'] if x['name']=='skill-book')
          assert book['version']=='V5.7', book
          assert book['install_package']=='skill-book_V5.7_INSTALL_20260829r4.zip'
          assert book['bytes']==216743
          assert book['sha256']=='1672b2b53c035da7aae398c610315df9a52da51bafa62ec9358a9c2c4c0a0b0e'
          assert book['asset_state']=='PUBLISHED_REMOTE_VERIFIED'
          assert d['combined_pack']['bytes']==335533
          assert d['combined_pack']['sha256']=='a479a485b120846224df91cf20701adfc21387e7d27c88bef48a7ab5250ee2e7'
          print('R4_CURRENT_DISTRIBUTION_AUTHORITY=PASS')
          PY

      - name: Apply final governance closure only
        working-directory: gov
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          current=Path('CURRENT.md')
          text=current.read_text(encoding='utf-8')
          old='| skill-book | V5.7 | V5.7 CANDIDATE（已安装；Current Distribution 待发布） |'
          new='| skill-book | V5.7 | V5.7 CANDIDATE（已安装；Source / Distribution Current 均为 V5.7） |'
          assert text.count(old)==1, text.count(old)
          text=text.replace(old,new)
          old_tail='V5.7 Candidate Release 继续作为不可变历史发行身份；Source Current 晋升不自动等于 Current Distribution，正式分发仍必须通过 `distribution/skills/RELEASE_POLICY.md` 的 canonical publisher + Remote Readback Gate。Real Reader Evidence 仍为 NOT_RUN，不由 AI blind proxy 推导。'
          new_tail='V5.7 Candidate Release 继续作为不可变历史发行身份。V5.7 Source Current 已通过 `distribution/skills/RELEASE_POLICY.md` 的 canonical publisher 构建并以 `skills-pack-2026.08.29-r4` 发布 Current Distribution；Release 16 assets exact Remote Readback PASS，verified repository mirror 已合并 main。Source Current、Distribution Current 与 Installed Runtime 仍保持独立身份；当前个人运行层仍记录为已安装的 V5.7 Candidate bytes，直到 OWNER 重新安装 Current R4 build 后才可更新 Installed Runtime Observation。Real Reader Evidence 仍为 NOT_RUN，不由 AI blind proxy 推导。'
          assert text.count(old_tail)==1, text.count(old_tail)
          current.write_text(text.replace(old_tail,new_tail),encoding='utf-8')

          state=Path('mother-specs/skill-book/V5.7/CURRENT_STATE.md')
          state.write_text('''# skill-book V5.7 · Current State\n\nAs of: `2026-08-29`\n\nLifecycle:\n\n`SOURCE CURRENT V5.7 / CURRENT DISTRIBUTION V5.7 R4 / PUBLISHED_REMOTE_VERIFIED`\n\n## Source Current authority\n\n- Previous Source Current: `V3.5`\n- Source Current: `V5.7`\n- Runtime Contract: `SB57-RUNTIME-CONTRACT-8ADCAF17`\n- Source promotion main commit: `332c37dfe8bf2694c63263896a855b2a947bda27`\n- Source promotion closure commit: `27680edd2f21cb65a14ef0b5609b8e92515a12a0`\n- OWNER promotion decision: `APPROVED`\n- Current Mother Spec overlay: `mother-specs/agent-native-current/skill-book/V5.7/CURRENT_OVERLAY.md`\n- Exact Candidate source package commit: `885d43a70100911531b7bc38833355e559a90b1d`\n- Candidate non-manifest tree SHA-256: `ec3d55bef71856ffee823059538b8318010d7bac18ff91beadf72e9e7dee630b`\n- package bytes drift during Source promotion: `0`\n\n## Validation / Reader Outcome\n\n- Candidate Python compile: `42/42 PASS`\n- Candidate full regression: `140/140 PASS`\n- Reader Transfer targeted: `13/13 PASS`\n- V5.6 Depth GREEN / V5.7 Transfer RED bridge: `3/3 PASS`\n- Runtime Transfer integration: `42/42 PASS`\n- Fresh Isolated Blind Proxy: `PASS`\n- Installed Standalone Forward Test `V57-SFT-01`: `PASS`\n- SFT READ / LEARN / TRAIN / DO: `PASS / PASS / PASS_FIRST_ATTEMPT / PASS`\n- SFT Phase B Retry: `NOT_REQUIRED`\n- Real Reader Evidence: `NOT_RUN`\n\n## Current Distribution R4\n\n- source SHA: `27680edd2f21cb65a14ef0b5609b8e92515a12a0`\n- release ID: `379055808`\n- tag: `skills-pack-2026.08.29-r4`\n- title: `VF Skills Pack 2026.08.29 R4`\n- release assets: `16`\n- release exact remote readback: `PASS`\n- repository mirror remote readback: `PASS`\n- mirror PR: `#40`\n- mirror merge commit: `dbc2389c16c40107b48123189a17bef0e078f1c4`\n- Current Distribution manifest: `PUBLISHED_REMOTE_VERIFIED`\n- Current download mirror: `PUBLISHED_REMOTE_VERIFIED`\n\n### skill-book Current install build\n\n- package: `skill-book_V5.7_INSTALL_20260829r4.zip`\n- bytes: `216743`\n- SHA-256: `1672b2b53c035da7aae398c610315df9a52da51bafa62ec9358a9c2c4c0a0b0e`\n- asset state: `PUBLISHED_REMOTE_VERIFIED`\n\n### Combined Current pack\n\n- package: `VF_SKILLS_PACK_2026.08.29-r4_INSTALL_20260829r4.zip`\n- bytes: `335533`\n- SHA-256: `a479a485b120846224df91cf20701adfc21387e7d27c88bef48a7ab5250ee2e7`\n\n## Publisher execution truth\n\n- canonical publisher runner commit: `d454776c960fdfea3db54aa95b84b7a413645c6b`\n- canonical publisher run/job: `33266290921 / 99136825215`\n- package build / local verification / Release creation / Release remote readback / mirror build: `PASS`\n- mirror branch file write + remote byte readback: `PASS`\n- publisher's final Pull Requests API call: `INFRA_PERMISSION_BLOCK` because the registered release token cannot access Pull Requests API\n- no product or package failure resulted from that permission block\n- GitHub Connector created mirror PR `#40` from the already verified bytes; PR was squash-merged without changing distribution bytes\n\n## Installed Runtime boundary\n\n```text\nSOURCE_CURRENT = V5.7\nCURRENT_DISTRIBUTION = V5.7 / R4 / PUBLISHED_REMOTE_VERIFIED\nINSTALLED_RUNTIME_OBSERVATION = V5.7 CANDIDATE INSTALL\nREAL_READER_EVIDENCE = NOT_RUN\n```\n\nThe installed runtime observation does not silently become the R4 Current install build merely because Source/Distribution Current changed. OWNER installation/readback is a separate runtime gate. AI blind-reader evidence remains proxy evidence only; `REAL_READER_EVIDENCE = NOT_RUN`.\n''',encoding='utf-8')

          closure=Path('mother-specs/skill-book/V5.7/V57_CURRENT_DISTRIBUTION_CLOSURE_20260829.json')
          closure.write_text(json.dumps({
              'schema':'skill-book-current-distribution-closure/v1',
              'skill':'skill-book',
              'source_current':'V5.7',
              'source_sha':'27680edd2f21cb65a14ef0b5609b8e92515a12a0',
              'distribution_release_id':379055808,
              'distribution_tag':'skills-pack-2026.08.29-r4',
              'distribution_state':'PUBLISHED_REMOTE_VERIFIED',
              'skill_book_artifact':'skill-book_V5.7_INSTALL_20260829r4.zip',
              'skill_book_bytes':216743,
              'skill_book_sha256':'1672b2b53c035da7aae398c610315df9a52da51bafa62ec9358a9c2c4c0a0b0e',
              'combined_pack':'VF_SKILLS_PACK_2026.08.29-r4_INSTALL_20260829r4.zip',
              'combined_bytes':335533,
              'combined_sha256':'a479a485b120846224df91cf20701adfc21387e7d27c88bef48a7ab5250ee2e7',
              'canonical_publisher_run':'33266290921 / 99136825215',
              'canonical_release_and_readback':'PASS',
              'mirror_remote_readback':'PASS',
              'publisher_pr_api':'INFRA_PERMISSION_BLOCK',
              'connector_pr':40,
              'mirror_merge_commit':'dbc2389c16c40107b48123189a17bef0e078f1c4',
              'installed_runtime_observation':'V5.7 CANDIDATE INSTALL',
              'real_reader_evidence':'NOT_RUN'
          },ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('V57_CURRENT_DISTRIBUTION_GOVERNANCE_CLOSURE=PREPARED')
          PY

      - name: Guard scope and commit directly to exact main
        working-directory: gov
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add CURRENT.md mother-specs/skill-book/V5.7/CURRENT_STATE.md mother-specs/skill-book/V5.7/V57_CURRENT_DISTRIBUTION_CLOSURE_20260829.json
          mapfile -t changed < <(git diff --cached --name-only)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 3
          git diff --cached --exit-code -- skills/skill-book/V5.7 distribution/skills
          git commit -m 'skill-book: close V5.7 Current Distribution R4 governance'
          NEW_SHA="$(git rev-parse HEAD)"
          git push "https://x-access-token:${VF_RELEASE_WRITE_TOKEN}@github.com/${GOV_REPO}.git" "HEAD:refs/heads/main"
          echo "V57_CURRENT_DISTRIBUTION_CLOSURE_SHA=$NEW_SHA"

      - name: Remote main closure readback
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GOV_REPO']; token=os.environ['VF_PRIVATE_READ_TOKEN']
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/git/ref/heads/main',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=30) as r: data=json.load(r)
          sha=data['object']['sha']
          assert sha != os.environ['EXPECTED_MAIN_SHA'], sha
          print(f'REMOTE_MAIN_V57_DISTRIBUTION_CLOSURE={sha}')
          PY
