name: P04 V2.8.3 Governance Closure

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p04-v283-governance.yml'
      - 'requests/p04-v283-governance.txt'

permissions:
  contents: read

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_PRODUCT: 6180307a393783b3ee61dd2f5a65c6516a0d406d
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Checkout P04 develop exact product source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: develop
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
      - name: Write Current Truth closure
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          test "$(git rev-parse HEAD)" = "$EXPECTED_PRODUCT"
          test "$(gh api repos/llhzx2018/vf-infra/branches/main --jq .commit.sha)" = "$EXPECTED_PRODUCT"
          python3 - <<'PY'
          import json
          p='VF_PROJECT.json'
          d=json.load(open(p,encoding='utf-8'))
          d['status']='V2.8.3_FORMAL_RELEASE_PASS'
          d['lifecycle']='RELEASED_PENDING_PRODUCTION_OWNER_RETRY'
          d['version']='2.8.3'
          ba=d.setdefault('branch_authority',{})
          ba.update({
            'main':'V2.8.3_FORMAL_BRANCH_PENDING_GOVERNANCE_FAST_FORWARD',
            'develop':'V2.8.3_FORMAL_PRODUCT_PLUS_GOVERNANCE_CLOSURE',
            'formal_product_source':'6180307a393783b3ee61dd2f5a65c6516a0d406d',
            'formal_product_tree':'8401ce230a8b2697e0f589a494847fa3fb89730f',
            'formal_tag':'v2.8.3',
            'working_candidate_product_source':'6180307a393783b3ee61dd2f5a65c6516a0d406d',
            'working_candidate_product_tree':'8401ce230a8b2697e0f589a494847fa3fb89730f'
          })
          d['v283_runtime_safe_integrity_hotfix']={
            'status':'FORMAL_RELEASE_PASS',
            'root_cause':'V2.8.2_POST_REPAIR_CHECK_USED_STALE_IN_PROCESS_BOOTSTRAP_VERSION',
            'owner_symptom':'V2.8.2_UPGRADE_FAILED_AND_AUTOMATICALLY_ROLLED_BACK_WITH_POST_REPAIR_INTEGRITY_ERROR',
            'schema':14,'migration':'NONE','provider_authority_change':False,
            'formal_product_source':'6180307a393783b3ee61dd2f5a65c6516a0d406d',
            'formal_product_tree':'8401ce230a8b2697e0f589a494847fa3fb89730f',
            'runtime_source_fingerprint':'9761579991e5792047579b4122cfcabab4bddcc6f24851460c5e4b7a7931ebed',
            'source_manifest_sha256':'e4ffbbcc617d1cfcb7bf728c6699a933ace43ce53788899e762c0d60999c947c',
            'runtime_file_count_including_manifest':212,
            'runtime_safe_integrity_verifier':'ReleaseManifestIntegrityVerifier@target-version-explicit',
            'stale_bootstrap_constant_regression':'PASS',
            'source_exact_279_280_281_282_to_283':'PASS',
            'rollback_regression':'PASS','branding_regression':'PASS'
          }
          d['formal_release']={
            'status':'PASS','version':'2.8.3','tag':'v2.8.3','release_name':'VF Infra V2.8.3','release_id':372929766,
            'product_source':'6180307a393783b3ee61dd2f5a65c6516a0d406d','product_tree':'8401ce230a8b2697e0f589a494847fa3fb89730f',
            'full':{'asset_name':'VF_Infra_V2.8.3_FULL.zip','asset_id':520644284,'bytes':571219,'sha256':'432f12a18065841b177789689dcda704d116709a6b8e5ff8704d41142715ca5c'},
            'update':{'asset_name':'VF_Infra_V2.8.3_UPDATE.zip','asset_id':520644289,'bytes':1235174,'sha256':'97719634af66dd938a3a31dd42dfbe08a2c460d54c8b8fe16d90208c9dd42dbc','allowed_source_versions':['2.7.9','2.8.0','2.8.1','2.8.2'],'payload_file_count':212},
            'atomic_self_test':'PASS','remote_artifact_readback':'PASS','production_write':0
          }
          d['online_update_channel']={
            'status':'READY_FOR_V2.8.3_FORMAL_RELEASE','authority':'llhzx2018/core-updates/projects/P04.json','authority_publication_commit':'80a6e2e0452200d0595eaa4a3ea8742318fb31f8',
            'target_version':'2.8.3','allowed_source_versions':['2.7.9','2.8.0','2.8.1','2.8.2'],'schema_from':14,'schema_to':14,'update_type':'ATOMIC','backup_required':True,'rollback_supported':True,
            'e2e_run':32238112635,'e2e_job':96022510166,'e2e_status':'PASS','evidence_artifact_id':9359712083,'production_write':0
          }
          prod=d.setdefault('production',{})
          prod.update({
            'installed_version':'2.8.1','installed_version_evidence':'OWNER_SCREENSHOT_AND_V2.8.2_ROLLBACK_SCREENSHOT',
            'upgrade_v282':'FAILED_AND_AUTOMATICALLY_ROLLED_BACK',
            'upgrade_v282_failure':'POST_REPAIR_INTEGRITY_FALSE_NEGATIVE_FROM_STALE_IN_PROCESS_VERSION_CONTEXT',
            'production_write_by_assistant_v283_cycle':0,
            'next_requirement':'OWNER_RETRY_UPGRADE_TO_V2.8.3_AND_POST_UPGRADE_READBACK'
          })
          vfi=prod.setdefault('version_file_integrity',{})
          vfi.update({'status':'BLOCKED_PENDING_V2.8.3_REAL_UPGRADE','do_not_claim_fixed':True})
          gates=d.setdefault('verification_gates',{})
          gates.update({
            'production_v282_upgrade':'FAILED_AND_ROLLED_BACK_SAFELY',
            'v283_stale_bootstrap_integrity_regression':'PASS','v283_atomic_transaction_regression':'PASS','v283_source_exact_279_to_283':'PASS','v283_source_exact_280_to_283':'PASS','v283_source_exact_281_to_283':'PASS','v283_source_exact_282_to_283':'PASS','v283_branding_regression':'PASS','v283_formal_candidate':'PASS','v283_formal_release':'PASS','v283_core_updates_publish':'PASS','v283_online_channel_e2e':'PASS','production_v283_upgrade':'WAITING_OWNER_REAL_USE'
