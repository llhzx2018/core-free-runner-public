name: P08 R29 Owner-only Atomic Staging Security Machine Proof (one-off)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p08-r29-owner-stage-oneoff.yml'

permissions:
  contents: read

jobs:
  r29-owner-stage:
    if: github.repository == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      P08_SOURCE_SHA: b6cd49cd682f214b6c09a717e6d8d844ad4128a0
    steps:
      - name: Verify approved private checkout capability
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          test -n "$READ_TOKEN" || exit 77
          echo P08_R29_PRIVATE_CHECKOUT_CAPABILITY_PASS
      - name: Checkout exact private source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-lander
          ref: b6cd49cd682f214b6c09a717e6d8d844ad4128a0
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mbstring, dom, xml, curl, pdo_sqlite, sqlite3, fileinfo
          tools: composer:v2
      - name: Verify exact source and controller syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P08_SOURCE_SHA"
          test "$(cat VERSION)" = '0.1.0-dev'
          php -l backend/app/Support/Updates/OfficialUpdateResolver.php
          php -l backend/app/Support/Updates/OfficialAtomicStager.php
          php -l backend/app/Http/Controllers/UpdateStageController.php
          php -l backend/app/Http/Controllers/UpdateDiscoveryController.php
          php -l backend/routes/web.php
          php -l backend/tests/Unit/OfficialAtomicStagerTest.php
          php -l backend/tests/Feature/UpdateStagingTest.php
          php -l backend/tests/Feature/AtomicStagingMaterializationTest.php
          echo P08_R29_STAGER_AND_OWNER_ROUTE_SYNTAX_PASS
      - name: Run complete Foundation test suite including staging negatives
        shell: bash
        run: |
          set -Eeuo pipefail
          (cd backend && composer install --no-interaction --prefer-dist --no-progress >"$RUNNER_TEMP/p08-r29-composer.log" 2>&1)
          if ! (cd backend && vendor/bin/phpunit --testsuite Foundation --stop-on-failure >"$RUNNER_TEMP/p08-r29-tests.log" 2>&1); then
            echo P08_R29_PHPUNIT_REGRESSION_FAILURE
            grep -A 8 -B 3 -E 'FAILURES!|Failed asserting|ERRORS!|There was|There were' "$RUNNER_TEMP/p08-r29-tests.log" | tail -45 || true
            exit 1
          fi
          tail -6 "$RUNNER_TEMP/p08-r29-tests.log" | sed -r 's/\x1B\[[0-9;]*[mK]//g'
          echo P08_R29_COMPLETE_FOUNDATION_FEATURE_AND_UNIT_PASS
      - name: Independently assert no staging side effects on dev install
        shell: bash
        run: |
          set -Eeuo pipefail
          test ! -e backend/storage/app/private/p08-atomic-staging
          test "$(grep -c "'staging_enabled' => false" backend/config/updates.php)" = 1
          test "$(grep -c "'apply_enabled' => false" backend/config/updates.php)" = 1
          echo P08_R29_DEFAULT_STAGING_AND_APPLY_DISABLED_NO_ASSET_WRITES_PASS
      - name: Cleanup transient private code and test files
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- backend .git .github docs frontend VERSION AGENTS.md VF_PROJECT.json
          echo P08_R29_PRIVATE_CHECKOUT_CLEANUP_ATTEMPTED
          echo P08_R29_NO_PRIVATE_ARTIFACTS_UPLOADED
