name: P01 GOV-TOPIC safe-preview and counts one-shot
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-topic-sync-safe-preview-20261023.yml'
permissions:
  contents: read
jobs:
  scoped:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CANDIDATE_SHA: 8241182b52dea62019b3a854e45ba62402e514ad
      REPO: llhzx2018/vf-start
    steps:
      - name: Prepare PHP and Node
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,curl,mbstring,zip,gd,openssl
          coverage: none
      - name: Checkout exact private candidate temporarily
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git init -q candidate
          git -C candidate remote add origin "https://x-access-token:${READ_TOKEN}@github.com/${REPO}.git"
          git -C candidate fetch -q --depth 1 origin "$CANDIDATE_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C candidate remote remove origin
          echo P01_EXACT_MANAGED_EDITOR_SOURCE=PASS
      - name: Verify sync state templates and original safety gates
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          php -l src/app/TopicLibraryPage.php
          php -l src/gov-topic-sync.php
          php -l tests/unit/topic_sync_modal_refactor_contract.php
          php tests/unit/topic_sync_modal_refactor_contract.php
          php tests/unit/topic_sync_batch_ux_contract.php
          php tests/gov_topic_preview_contract.php
          php tests/gov_topic_source_ref_contract.php
          php tests/gov_topic_auth_contract.php
          node --check src/assets/topic-git-sync.js
          node tests/integration/topic_sync_modal_node.js
          echo P01_TOPIC_SYNC_PREVIEW_FAILCLOSED_AND_COUNTS=PASS
      - name: Cleanup transient private checkout
        if: always()
        run: |
          rm -rf candidate
          echo P01_PRIVATE_SOURCE_TEMP_CLEANUP=PASS
