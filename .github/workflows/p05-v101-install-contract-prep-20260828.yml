name: P05 V1.0.1 Install Contract Prep
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p05-v101-install-contract-prep-20260828.yml'
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Align installer to Common Baseline V2
        env:
          TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone "https://x-access-token:${TOKEN}@github.com/llhzx2018/vf-seo.git" p05 >/dev/null 2>&1
          cd p05
          git checkout release/p05-v1.0.1-common-baseline-v2-20260828
          test "$(git rev-parse HEAD)" = "ec613be42f18bd0456a7e5f5d9c0bbbe25a6e22c"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('install-cloudpanel.sh')
          s=p.read_text(encoding='utf-8')
          replacements={
            'VF SEO 1.0.0 要求 Node.js 24。':'VF SEO 1.0.1 要求 Node.js 24。',
            "printf 'VF_SESSION_TTL_SECONDS=43200\\n'":"printf 'VF_SESSION_TTL_SECONDS=2592000\\n'",
            "printf 'VF_SESSION_IDLE_SECONDS=1800\\n'":"printf 'VF_SESSION_IDLE_SECONDS=604800\\n'",
            "printf 'VF_SESSION_ABSOLUTE_SECONDS=43200\\n'":"printf 'VF_SESSION_ABSOLUTE_SECONDS=2592000\\n'",
            "printf 'VF_SESSION_ROTATION_SECONDS=900\\n'":"printf 'VF_SESSION_COOKIE_SECONDS=2592000\\n'\n  printf 'VF_STEP_UP_WINDOW_SECONDS=900\\n'\n  printf 'VF_DISPLAY_TIMEZONE=Asia/Shanghai\\n'\n  printf 'VF_LOCALE=zh-CN\\n'",
          }
          for old,new in replacements.items():
            if s.count(old)!=1:
              raise SystemExit('INSTALLER_SENTINEL_DRIFT '+old)
            s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          bash -n install-cloudpanel.sh
          grep -Fq 'VF_SESSION_TTL_SECONDS=2592000' install-cloudpanel.sh
          grep -Fq 'VF_SESSION_IDLE_SECONDS=604800' install-cloudpanel.sh
          grep -Fq 'VF_SESSION_ABSOLUTE_SECONDS=2592000' install-cloudpanel.sh
          grep -Fq 'VF_SESSION_COOKIE_SECONDS=2592000' install-cloudpanel.sh
          grep -Fq 'VF_STEP_UP_WINDOW_SECONDS=900' install-cloudpanel.sh
          grep -Fq 'VF_DISPLAY_TIMEZONE=Asia/Shanghai' install-cloudpanel.sh
          grep -Fq 'VF_LOCALE=zh-CN' install-cloudpanel.sh
          ! grep -Fq 'VF_SESSION_ROTATION_SECONDS=' install-cloudpanel.sh
          test "$(git diff --name-only | tr -d '\r')" = 'install-cloudpanel.sh'
          git diff --check
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add install-cloudpanel.sh
          git commit -m 'fix(P05): align first install with Common Baseline V2'
          git push origin HEAD:release/p05-v1.0.1-common-baseline-v2-20260828
          echo P05_V101_INSTALL_CONTRACT_PREP=PASS
