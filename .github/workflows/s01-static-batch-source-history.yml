name: S01 static batch source history
on:
  push:
    branches:
      - temp/s01-c02-production-readback-20260904-current
    paths:
      - '.github/workflows/s01-static-batch-source-history.yml'
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Inspect static batch creation history
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$R"
          git clone -q https://x-access-token:${R}@github.com/llhzx2018/vf-tools-ops.git ops
          cd ops
          for ref in v1.21.803 v1.21.804 v1.21.805 v1.21.806 v1.21.807 v1.21.808; do
            echo "=== $ref ==="
            git checkout -q "$ref"
            grep -RInE "Static Candidate|static_artifact|release_batch_create_v121363" includes .github 2>/dev/null | head -n 120 || true
          done
          echo PASS_STATIC_BATCH_SOURCE_HISTORY
