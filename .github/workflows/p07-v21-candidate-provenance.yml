name: P07 V2.1 Candidate Provenance

on:
  pull_request:
    paths:
      - '.github/workflows/p07-v21-candidate-provenance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Freeze exact V2.1 candidate identity
        shell: bash
        run: |
          set -euo pipefail
          candidate_commit='0a851b9fe1819c7970ed5bb8e3633f2fc8e73166'
          candidate_blob='44439376f04d28ebbdfe876809fd2b4a41d28278'
          candidate_path='experiments/p07-vps-audit-v21.sh'
          url="https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/${candidate_commit}/${candidate_path}"
          curl -fsSL "$url" -o /tmp/p07-vps-audit-v21.sh
          actual_sha="$(sha256sum /tmp/p07-vps-audit-v21.sh | awk '{print $1}')"
          bash -n /tmp/p07-vps-audit-v21.sh
          test "$(NO_COLOR=1 bash /tmp/p07-vps-audit-v21.sh --version | awk '{print $NF}')" = 'V2.1.0'
          test "$(bash /tmp/p07-vps-audit-v21.sh --build-id)" = '2.1.0-rc7-field'
          echo "P07_V21_CANDIDATE_COMMIT=${candidate_commit}"
          echo "P07_V21_CANDIDATE_BLOB=${candidate_blob}"
          echo "P07_V21_CANDIDATE_SHA256=${actual_sha}"
