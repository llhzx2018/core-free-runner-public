name: P01 V2.47.244 Course Reader Grid Row Proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p01-v247244-course-reader-grid-row.yml"
      - "proof-triggers/p01-v247244-course-reader-grid-row.json"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout proof control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd >/dev/null

      - name: Clone exact candidate and baseline
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" candidate
          git -C candidate fetch -q origin 81f2f519d326b96fccaa8dddd9ef0f91d1d26285
          git -C candidate checkout -q --detach 81f2f519d326b96fccaa8dddd9ef0f91d1d26285
          test "$(git -C candidate rev-parse HEAD)" = "81f2f519d326b96fccaa8dddd9ef0f91d1d26285"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.244"

          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" baseline
          git -C baseline fetch -q origin 87784af167f101ce92dbff810ae15303ad76bfdd
          git -C baseline checkout -q --detach 87784af167f101ce92dbff810ae15303ad76bfdd
          echo P01_V247244_EXACT_SOURCE=PASS

      - name: Reader grid proof
        shell: bash
        run: |
          set -Eeuo pipefail
          php candidate/tests/unit/course_markdown_reader_contract.php | tee /tmp/reader.txt
          grep -Fx 'P01_COURSE_MARKDOWN_READER=PASS' /tmp/reader.txt
          grep -Fq 'grid-column:2;' candidate/src/assets/course-study.css
          grep -Fq 'grid-row:1;' candidate/src/assets/course-study.css
          grep -Fq 'grid-column:1;' candidate/src/assets/course-study.css
          grep -Fq 'grid-column:auto;grid-row:auto' candidate/src/assets/course-study.css
          echo P01_V247244_SAME_GRID_ROW=PASS
          echo P01_V247244_SINGLE_DESKTOP_SCROLLBAR=PASS

      - name: Canonical regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate baseline --require-zero-debt | tee /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/canonical.txt
          echo P01_V247244_CANONICAL=PASS

      - name: No release write
        shell: bash
        run: |
          echo FORMAL_RELEASE_CALLED=NO
          echo DISTRIBUTION_WRITE=NO
          echo PRODUCTION_WRITE=NO
