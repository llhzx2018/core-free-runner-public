name: S01 player 95 formal exact release
on:
  push:
    branches: [task/s01-player95-20261028]
    paths: ['.github/workflows/s01-player95-formal-20261028.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-m3u8
  TARGET_VERSION: 1.25.95
  TARGET_SHA: a63479b5fb519ff8bf661c4ca94a338089a6e4f1
  TARGET_TREE: 85c487262037857115369f279b7fb261adb58a85
  BASE_SHA: 9416ed0aef6db0878834a03459ccbfe3566f31f4
  MERGED_SHA: a3e54d82817a557c62584976b803c6a2223d847c
  LANE_ID: s01-player95-20261028
jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: control
      - name: Identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-player95-20261028/spec.json --input control/.github/workflows/s01-player95-formal-20261028.yml
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: a63479b5fb519ff8bf661c4ca94a338089a6e4f1
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Verify evidence and rebuild exact bytes
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider prior-native prior-clean
          test "$(gh api repos/$TARGET_REPO/commits/main --jq .sha)" = "$MERGED_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$MERGED_SHA --jq .tree.sha)" = "$TARGET_TREE"
          gh run download 40684560023 --repo llhzx2018/core-free-runner-public --name s01-player95-40684560023 --dir prior-native
          gh run download 40685322545 --repo llhzx2018/core-free-runner-public --name s01-player95-clean-40685322545 --dir prior-clean
          python3 - <<'PY'
          import json
          from pathlib import Path
          n=Path('prior-native'); c=Path('prior-clean')
          for p in [n/'native-lifecycle.json',n/'browser.json',n/'package.json',c/'clean-admin.json']:
           x=json.loads(p.read_text());assert x['status']=='PASS',(str(p),x)
          p=json.loads((n/'package.json').read_text());assert p['source']=='a63479b5fb519ff8bf661c4ca94a338089a6e4f1' and p['sha256']=='030f28066417802dc973cb17be05bd33d182da282dc459f98e096043ddd4fd92'
          PY
          gh release download v1.25.94 --repo "$TARGET_REPO" --pattern vf-tools-m3u8_V1.25.94.zip --dir provider
          python3 control/lanes/s01-player95-20261028/package.py
          echo '030f28066417802dc973cb17be05bd33d182da282dc459f98e096043ddd4fd92  provider/vf-tools-m3u8_V1.25.95.zip' | sha256sum -c
      - name: Publish verified asset
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.25.95 --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create v1.25.95 provider/vf-tools-m3u8_V1.25.95.zip --repo "$TARGET_REPO" --target "$MERGED_SHA" --title 'VF Tools M3U8 V1.25.95' --notes '播放器加入固定版本同源 HLS.js 并校验文件指纹，支持 TS 与 fMP4，修正专业模式引擎状态和失败提示。独立 WordPress 播放、安装、升级、回退、重复安装与设置保护验证通过。正式站由 Owner 手工升级，升级后真实使用验收待完成。' --latest
          fi
          mkdir -p remote
          gh release download v1.25.95 --repo "$TARGET_REPO" --pattern vf-tools-m3u8_V1.25.95.zip --dir remote
          echo '030f28066417802dc973cb17be05bd33d182da282dc459f98e096043ddd4fd92  remote/vf-tools-m3u8_V1.25.95.zip' | sha256sum -c
          test "$(gh api repos/$TARGET_REPO/commits/v1.25.95 --jq .sha)" = "$MERGED_SHA"
          echo '{"status":"PASS","release":"v1.25.95","sha256":"030f28066417802dc973cb17be05bd33d182da282dc459f98e096043ddd4fd92","production":"UNTOUCHED"}' > proof/formal.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-player95-formal-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Clean private source and package
        if: always()
        run: rm -rf target provider remote prior-native prior-clean
