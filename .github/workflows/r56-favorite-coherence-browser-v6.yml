name: R56 Favorite Coherence Browser Gate V6

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r56-favorite-coherence-browser-v6.yml'

permissions:
  contents: read

jobs:
  r56-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_SHA: 58217702a6b5399d51d1dbd61a60d65b5ba66500
    steps:
      - name: Checkout exact private P01 candidate transiently
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: 58217702a6b5399d51d1dbd61a60d65b5ba66500
          path: vf-start
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact browser source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C vf-start rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(cat vf-start/VERSION)" = '2.47.0'
          node --check vf-start/src/assets/workspace.js
          echo R56_BROWSER_EXACT_SOURCE_BOUND

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Build workspace-shell fixture
        shell: bash
        run: |
          set -euo pipefail
          cat > vf-start/_r56_router.php <<'PHP'
          <?php
          declare(strict_types=1);
          $path=(string)(parse_url($_SERVER['REQUEST_URI']??'/',PHP_URL_PATH)?:'/');
          $static=__DIR__.$path;
          if($path!=='/'&&is_file($static))return false;
          if(!in_array($path,['/tools.php','/software.php'],true)){http_response_code(404);echo 'not found';return true;}
          header('Content-Type: text/html; charset=utf-8');
          ?><!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>R56</title></head><body>
          <script type="application/json" id="vf-workspace-data"><?=json_encode(['assets'=>['1'=>['id'=>1,'title'=>'R56 item','surface'=>'start','is_favorite'=>1]],'categories'=>[],'csrf'=>'r56'],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)?></script>
          <div data-bulkbar hidden><select data-bulk-category><option value="">分类</option></select><span data-selected-count>0</span><span data-page-count>0</span></div>
          <article data-asset-row="1"><span class="vf-asset-actions"><button type="button" data-favorite-id="1" data-favorite="1" class="active">★</button></span></article>
          <script src="/src/assets/workspace.js"></script>
          </body></html><?php return true;
          PHP
          php -l vf-start/_r56_router.php

      - name: Real Chromium favorite-view coherence
        shell: bash
        run: |
          set -euo pipefail
          (cd vf-start && php -S 127.0.0.1:8774 _r56_router.php >"$RUNNER_TEMP/r56-v6-php.log" 2>&1) &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS 'http://127.0.0.1:8774/tools.php?view=favorite' >/dev/null; then break; fi
            sleep 0.5
          done
          node <<'NODE'
          const { chromium }=require('playwright');
          const assert=(c,m)=>{if(!c)throw new Error(m)};
          const apiReply=async route=>route.fulfill({status:200,contentType:'application/json; charset=utf-8',body:JSON.stringify({ok:true,message:'收藏状态已更新'})});
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const width of [1280,390]){
              for(const routeName of ['tools.php','software.php']){
                const page=await browser.newPage({viewport:{width,height:900}});
                const errors=[];let apiCount=0,navCount=0;
                page.on('pageerror',e=>errors.push(String(e)));
                page.on('console',m=>{if(m.type()==='error')errors.push(`console:${m.text()}`)});
                page.on('request',r=>{if(r.isNavigationRequest()&&r.url().includes(`/${routeName}?view=favorite`))navCount++});
                await page.route('**/workspace-action.php',async r=>{apiCount++;await apiReply(r)});
                await page.goto(`http://127.0.0.1:8774/${routeName}?view=favorite`,{waitUntil:'domcontentloaded'});
                navCount=0;
                await page.locator('[data-favorite-id="1"]').click();
                await page.waitForTimeout(1000);
                assert(errors.length===0,`${routeName} errors ${width}: ${errors.join(' | ')}`);
                assert(apiCount===1,`${routeName} API count ${width}: ${apiCount}`);
                assert(navCount>=1,`${routeName} favorite did not reload ${width}: ${navCount}`);
                assert(new URL(page.url()).searchParams.get('view')==='favorite',`${routeName} lost favorite context ${width}`);
                await page.close();
              }

              const control=await browser.newPage({viewport:{width,height:900}});
              const errors=[];let apiCount=0,navCount=0;
              control.on('pageerror',e=>errors.push(String(e)));
              control.on('console',m=>{if(m.type()==='error')errors.push(`console:${m.text()}`)});
              control.on('request',r=>{if(r.isNavigationRequest()&&r.url().includes('/tools.php?view=all'))navCount++});
              await control.route('**/workspace-action.php',async r=>{apiCount++;await apiReply(r)});
              await control.goto('http://127.0.0.1:8774/tools.php?view=all',{waitUntil:'domcontentloaded'});
              navCount=0;
              await control.locator('[data-favorite-id="1"]').click();
              await control.waitForTimeout(1000);
              assert(errors.length===0,`control errors ${width}: ${errors.join(' | ')}`);
              assert(apiCount===1,`control API count ${width}: ${apiCount}`);
              assert(navCount===0,`control unexpectedly reloaded ${width}: ${navCount}`);
              assert(await control.locator('[data-favorite-id="1"]').getAttribute('data-favorite')==='0',`control favorite state not updated ${width}`);
              await control.close();
            }
            await browser.close();
            console.log('R56_REAL_BROWSER_DERIVED_FAVORITE_VIEW_COHERENCE_PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Cleanup transient private source
        if: always()
        shell: bash
        run: |
          rm -rf vf-start
          rm -f "$RUNNER_TEMP/r56-v6-php.log"
