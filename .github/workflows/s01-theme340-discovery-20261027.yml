name: S01 Theme340 HTML sitemap exact-source PHP proof
on:
  push:
    branches: [task/s01-theme340-discovery-20261027]
    paths: ['.github/workflows/s01-theme340-discovery-20261027.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.209
  TARGET_SHA: 8a6d62bca49ba6903945d9f41e1c6d089ba0834c
  TARGET_TREE: db1a2c312fa1684321ea4290a908acf46974b833
  BASE_SHA: 0e3a1032d0ca245ad4c74396ad8f6de34c69e3ab
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: control
      - name: Target identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-theme340-discovery-20261027/spec.json --input control/.github/workflows/s01-theme340-discovery-20261027.yml
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 8a6d62bca49ba6903945d9f41e1c6d089ba0834c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact SHA and four-file scope gate
        run: |
          set -euo pipefail
          mkdir -p proof
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse 'HEAD^{tree}')" = "$TARGET_TREE"
          test "$(tr -d '\r\n' < target/VERSION)" = "$TARGET_VERSION"
          git -C target diff --name-only "$BASE_SHA" HEAD | sort > proof/changed-files.txt
          test "$(wc -l < proof/changed-files.txt)" -eq 4
          grep -Fxq 'src/inc/modules/module-post-list.php' proof/changed-files.txt
          grep -Fxq 'src/inc/static-export-url-provider.php' proof/changed-files.txt
          grep -Fxq 'tests/sitemap-content-family-coverage.php' proof/changed-files.txt
          grep -Fxq 'tests/sitemap-route-policy-contract.php' proof/changed-files.txt
      - name: Targeted PHP lint and synthetic regression
        run: |
          set -euo pipefail
          for path in src/inc/modules/module-post-list.php src/inc/static-export-url-provider.php tests/sitemap-content-family-coverage.php tests/sitemap-route-policy-contract.php; do
            php -l "target/$path" | tee -a proof/php-lint.txt
          done
          php target/tests/sitemap-content-family-coverage.php | tee proof/content-family.json
          php target/tests/sitemap-route-policy-contract.php | tee proof/route-policy.json
          php target/tests/sitemap-tool-mounts.php | tee proof/tool-mounts.json
          php target/tests/tool-sitemap-policy-contract.php | tee proof/xml-policy.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-theme340-php-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Remove temporary private checkout
        if: always()
        run: rm -rf target
