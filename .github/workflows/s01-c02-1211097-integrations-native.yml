name: S01 C02 1211097 GSC Config Save WordPress Native
on:
  push:
    branches: [task/s01-c02-1211097-integrations-candidate-20261012]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      mariadb:
        image: mariadb:11.8.8
        env:
          MARIADB_ROOT_PASSWORD: fixture-root
          MARIADB_DATABASE: integrations_db
          MARIADB_USER: vf
          MARIADB_PASSWORD: vf
        ports: [3306:3306]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=6
    env:
      PRODUCT_DIR: ${{ github.workspace }}/product
    steps:
      - name: Checkout native test lane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Checkout exact PR candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: e870ee33b4848735ebda1a529a215d04cf00bb66
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Verify exact candidate and PHP mysql support
        run: |
          test "$(git -C product rev-parse HEAD)" = e870ee33b4848735ebda1a529a215d04cf00bb66
          sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php8.3-mysql php8.3-zip php8.3-xml php8.3-mbstring php8.3-curl
          php -m | grep -Fx pdo_mysql
          bash -n runner/lanes/s01-c02-integrations-1097/wordpress.sh
      - name: Run true WordPress option write, encryption, readback and conflict regression
        run: bash runner/lanes/s01-c02-integrations-1097/wordpress.sh
