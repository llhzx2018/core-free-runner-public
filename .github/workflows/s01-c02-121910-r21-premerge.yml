name: S01-C02 1.21.910 R21 Pre-Merge Gate

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_REPO: llhzx2018/vf-tools-ops
      CANDIDATE_SHA: 5d2f192e6e5a9fc583cafac599f433e8a82f54f9
      BASE_SHA: 50d13a6e2638fb8a3087bcc610ba02ebcb4d0138
      VERSION: 1.21.910

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 5d2f192e6e5a9fc583cafac599f433e8a82f54f9
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: ops
          persist-credentials: false

      - name: Exact scope and shell authority contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(tr -d '\r\n' < ops/VERSION)" = "$VERSION"
          grep -Fq 'Version: 1.21.910' ops/vf-ops.php
          grep -Fq "VF_OPS_VERSION', '1.21.910'" ops/vf-ops.php
          grep -Fq 'S01-SHELL-SINGLE-AUTHORITY-R21' ops/vf-ops.php

          actual="$(git -C ops diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" | sort)"
          expected="$(printf '%s\n'             CHANGELOG.md             VERSION             assets/css/current/admin-s01-content-seo-r16.css             assets/css/current/admin-s01-dashboard-r14.css             assets/css/current/admin-s01-quality-r17.css             assets/css/current/admin-s01-system-publish-r13.css             assets/css/current/admin-s01-tools-r15.css             assets/css/current/admin-s01-v6-shell-r1.css             tests/s01-c02-121910-shell-single-authority-r21-contract.php             vf-ops.php | sort)"
          test "$actual" = "$expected"

          php ops/tests/s01-c02-121910-shell-single-authority-r21-contract.php
          php -l ops/vf-ops.php >/dev/null

          python3 - <<'PY'
          from pathlib import Path
          files=[
            'admin-s01-dashboard-r14.css',
            'admin-s01-tools-r15.css',
            'admin-s01-content-seo-r16.css',
            'admin-s01-quality-r17.css',
            'admin-s01-system-publish-r13.css',
            'admin-s01-v6-shell-r1.css',
          ]
          forbidden=[
            '.vf-ops-v6-shell','.vf-v6-shell-header','.vf-v6-domain-nav',
            '.vf-v6-domain-mobile','.vf-v6-brand-mark','.vf-v6-brand-copy',
            '.vf-v8-current-domain',
          ]
          for name in files:
              p=Path('ops/assets/css/current')/name
              s=p.read_text(encoding='utf-8')
              assert s.count('{')==s.count('}'), f'brace imbalance {name}'
              assert '/*' in s and '*/' in s, f'comments malformed {name}'
              if name!='admin-s01-v6-shell-r1.css':
                  for needle in forbidden:
                      assert needle not in s, f'page owns shell: {name} {needle}'
          shell=(Path('ops/assets/css/current/admin-s01-v6-shell-r1.css').read_text(encoding='utf-8'))
          for needle in [
              '--vf-v6-shell-header-min-height:82px',
              '--vf-v6-shell-logo-size:42px',
              '--vf-v6-shell-brand-font:15px',
              '--vf-v6-shell-nav-font:13px',
              '--vf-v6-shell-nav-min-height:54px',
          ]:
              assert needle in shell, f'missing shell numeric authority {needle}'
          print('PASS_R21_SINGLE_SHELL')
          PY

          test "$(git -C ops diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" -- database config includes/v6 includes/wp-update docs/authority | wc -l)" = "0"

          ! grep -RInE 'gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY'             ops/vf-ops.php             ops/assets/css/current/admin-s01-v6-shell-r1.css             ops/assets/css/current/admin-s01-dashboard-r14.css             ops/assets/css/current/admin-s01-tools-r15.css             ops/assets/css/current/admin-s01-content-seo-r16.css             ops/assets/css/current/admin-s01-quality-r17.css             ops/assets/css/current/admin-s01-system-publish-r13.css

          echo PASS_S01_C02_121910_R21_PREMERGE
