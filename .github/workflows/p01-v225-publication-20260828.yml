name: P01 V2.25.0 Publication
on:
  push:
    branches: [task/p01-v222-multi-surface-gate-20260828]
    paths: ['.github/workflows/p01-v225-publication-20260828.yml']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RELEASE_SOURCE: 894cc9cb647a9b4694b0684d4bba89497e182e66
      RELEASE_TREE: 5db9ee2c6a7e58d44e40772cd5658fe4b85a87c1
      MAIN_SHA: 3e147ee33f027086bd48cd2900ad05a7109ac728
      VERSION: 2.25.0
      SOURCE_VERSION: 2.24.0
      SCHEMA: '2026082801'
      RELEASE_GATE: '33159883610'
      ARTIFACT_GATE: '33160021920'
      PROMOTION_GATE: '33160098741'
      ARTIFACT_ID: '9681226552'
      ASSET_NAME: VF_Start_V2.25.0_UPDATE.zip
      ASSET_BYTES: '1214902'
      ASSET_SHA: 0aac59a5092e833b2ac0be0807b4b236b3745f4662857a2073d8ed65d4798528
    steps:
      - name: Publication preflight fence
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          MAIN=$(gh api repos/llhzx2018/vf-start/branches/main | jq -r '.commit.sha')
          test "$MAIN" = "$MAIN_SHA"
          test "$(gh api repos/llhzx2018/vf-start/git/commits/$MAIN | jq -r '.tree.sha')" = "$RELEASE_TREE"
          test "$(gh api repos/llhzx2018/vf-start/git/commits/$RELEASE_SOURCE | jq -r '.tree.sha')" = "$RELEASE_TREE"
          for run in "$RELEASE_GATE" "$ARTIFACT_GATE" "$PROMOTION_GATE"; do
            gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$run" | jq -e '.status=="completed" and .conclusion=="success"' >/dev/null
          done
          ART=$(gh api "repos/llhzx2018/core-free-runner-public/actions/artifacts/$ARTIFACT_ID")
          test "$(jq -r '.expired' <<<"$ART")" = false
          test "$(jq -r '.name' <<<"$ART")" = "p01-v225-formal-artifacts-$RELEASE_SOURCE"
          if gh api repos/llhzx2018/vf-start/git/ref/tags/v2.25.0 >/tmp/existing-tag.json 2>/dev/null; then
            test "$(jq -r '.object.sha' /tmp/existing-tag.json)" = "$RELEASE_SOURCE"
          fi
          if gh api repos/llhzx2018/vf-start/releases/tags/v2.25.0 >/tmp/existing-release.json 2>/dev/null; then
            test "$(jq -r '.target_commitish' /tmp/existing-release.json)" = "$RELEASE_SOURCE"
          fi
          echo P01_V225_PUBLICATION_PREFLIGHT=PASS
      - name: Download exact formal artifact bundle
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-v225-pub /tmp/p01-v225-artifact.zip
          mkdir -p /tmp/p01-v225-pub
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/artifacts/$ARTIFACT_ID/zip" -o /tmp/p01-v225-artifact.zip
          unzip -q /tmp/p01-v225-artifact.zip -d /tmp/p01-v225-pub
          for f in P01-V2.25.0-ARTIFACT-GATE.json P01-V2.25.0-FORMAL-METADATA.json SHA256SUMS.txt VF-Start-V2.25.0-FULL.zip "$ASSET_NAME"; do test -f "/tmp/p01-v225-pub/$f"; done
          test "$(stat -c %s /tmp/p01-v225-pub/$ASSET_NAME)" = "$ASSET_BYTES"
          test "$(sha256sum /tmp/p01-v225-pub/$ASSET_NAME | awk '{print $1}')" = "$ASSET_SHA"
          jq -e --arg s "$RELEASE_SOURCE" --arg t "$RELEASE_TREE" '.candidate==$s and .candidate_tree==$t and .version=="2.25.0" and .schema=="2026082801" and .status=="PASS"' /tmp/p01-v225-pub/P01-V2.25.0-FORMAL-METADATA.json >/dev/null
          echo P01_V225_PUBLICATION_ARTIFACT=PASS
      - name: Create exact Tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! gh api repos/llhzx2018/vf-start/releases/tags/v2.25.0 >/tmp/release.json 2>/dev/null; then
            gh release create v2.25.0 -R llhzx2018/vf-start \
              --target "$RELEASE_SOURCE" \
              --title 'VF Start V2.25.0' \
              --notes 'V2.25.0 VF teal whole-site UX/UI formal release. Default Surface workspace returns to the VF light-neutral + teal visual authority: white sidebar, light gray canvas, teal active states, readable 12–14px information density, unified Home / Start / Channels / Watch / Resource Organizer UX, Chinese-first user-facing hierarchy, and preserved dark mode as an optional theme. Schema remains 2026082801. Online updater supports V2.24.0 -> V2.25.0 with atomic rollback.' \
              /tmp/p01-v225-pub/P01-V2.25.0-ARTIFACT-GATE.json \
              /tmp/p01-v225-pub/P01-V2.25.0-FORMAL-METADATA.json \
              /tmp/p01-v225-pub/SHA256SUMS.txt \
              /tmp/p01-v225-pub/VF-Start-V2.25.0-FULL.zip \
              "/tmp/p01-v225-pub/$ASSET_NAME"
            gh api repos/llhzx2018/vf-start/releases/tags/v2.25.0 >/tmp/release.json
          fi
          REL=$(cat /tmp/release.json)
          test "$(jq -r '.tag_name' <<<"$REL")" = v2.25.0
          test "$(jq -r '.target_commitish' <<<"$REL")" = "$RELEASE_SOURCE"
          test "$(jq -r '.draft' <<<"$REL")" = false
          test "$(jq -r '.prerelease' <<<"$REL")" = false
          TAG=$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.25.0 | jq -r '.object.sha')
          test "$TAG" = "$RELEASE_SOURCE"
          for f in P01-V2.25.0-ARTIFACT-GATE.json P01-V2.25.0-FORMAL-METADATA.json SHA256SUMS.txt VF-Start-V2.25.0-FULL.zip "$ASSET_NAME"; do
            test "$(jq --arg n "$f" '[.assets[]|select(.name==$n)]|length' <<<"$REL")" -eq 1
          done
          ASSET=$(jq -c --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)' <<<"$REL")
          test "$(jq -r '.size' <<<"$ASSET")" = "$ASSET_BYTES"
          test "$(jq -r '.digest' <<<"$ASSET")" = "sha256:$ASSET_SHA"
          echo "RELEASE_ID=$(jq -r '.id' <<<"$REL")" >> "$GITHUB_ENV"
          echo "RELEASED_AT=$(jq -r '.published_at' <<<"$REL")" >> "$GITHUB_ENV"
          echo P01_V225_GITHUB_RELEASE=PASS
      - name: Publish core-updates P01 channel
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf updates
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/core-updates.git" updates
          cd updates
          test "$(jq -r '.target_version' projects/P01.json)" = 2.24.0
          test "$(jq -r '.release_identity' projects/P01.json)" = 'v2.24.0@867e3387b8efb70398287d05fd3652540efa77c8'
          jq -n \
            --arg rid "$RELEASE_ID" --arg released "$RELEASED_AT" --arg sha "$RELEASE_SOURCE" --arg ah "$ASSET_SHA" --argjson ab "$ASSET_BYTES" \
            '{schema_version:"1.0",project_id:"P01",component_id:"APP",enabled:true,target_version:"2.25.0",update_type:"ATOMIC",from_versions:["2.24.0"],schema_from:"2026082801",schema_to:"2026082801",repository:"llhzx2018/vf-start",release_tag:"v2.25.0",asset_name:"VF_Start_V2.25.0_UPDATE.zip",asset_bytes:$ab,asset_sha256:$ah,release_id:($rid|tonumber),release_identity:("v2.25.0@"+$sha),backup_required:true,rollback_supported:true,released_at:$released,minimum_php:"8.0.0"}' > projects/P01.json
          jq -e --arg rid "$RELEASE_ID" --arg sha "$RELEASE_SOURCE" --arg ah "$ASSET_SHA" --argjson ab "$ASSET_BYTES" '.target_version=="2.25.0" and .from_versions==["2.24.0"] and .asset_bytes==$ab and .asset_sha256==$ah and (.release_id|tostring)==$rid and .release_identity==("v2.25.0@"+$sha)' projects/P01.json >/dev/null
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add projects/P01.json
          git commit -m "release(P01): publish V2.25.0 VF teal update channel" -m "Release v2.25.0 / ID $RELEASE_ID. Strict V2.24.0 -> V2.25.0 Atomic channel; Schema 2026082801 unchanged. Gates: $RELEASE_GATE / $ARTIFACT_GATE / $PROMOTION_GATE."
          set +e
          git push origin HEAD:main
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            git fetch origin main
            test "$(git show origin/main:projects/P01.json | jq -r '.target_version')" = 2.24.0
            git rebase origin/main
            git push origin HEAD:main
          fi
          echo "CORE_UPDATES_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo P01_V225_CORE_UPDATES=PASS
      - name: Remote publication readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/vf-start/branches/main | jq -r '.commit.sha')" = "$MAIN_SHA"
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.25.0 | jq -r '.object.sha')" = "$RELEASE_SOURCE"
          REL=$(gh api repos/llhzx2018/vf-start/releases/$RELEASE_ID)
          test "$(jq -r '.target_commitish' <<<"$REL")" = "$RELEASE_SOURCE"
          curl -fsSL "https://raw.githubusercontent.com/llhzx2018/core-updates/main/projects/P01.json?x=$(date +%s)" -o /tmp/P01.json
          jq -e --arg rid "$RELEASE_ID" --arg sha "$RELEASE_SOURCE" --arg ah "$ASSET_SHA" --argjson ab "$ASSET_BYTES" '.target_version=="2.25.0" and .from_versions==["2.24.0"] and .asset_bytes==$ab and .asset_sha256==$ah and (.release_id|tostring)==$rid and .release_identity==("v2.25.0@"+$sha)' /tmp/P01.json >/dev/null
          rm -rf /tmp/p01-v225-remote; mkdir -p /tmp/p01-v225-remote
          gh release download v2.25.0 -R llhzx2018/vf-start -p "$ASSET_NAME" -D /tmp/p01-v225-remote
          test "$(stat -c %s /tmp/p01-v225-remote/$ASSET_NAME)" = "$ASSET_BYTES"
          test "$(sha256sum /tmp/p01-v225-remote/$ASSET_NAME | awk '{print $1}')" = "$ASSET_SHA"
          test "$(unzip -Z1 /tmp/p01-v225-remote/$ASSET_NAME)" = 'repair-v2.25.0.php'
          echo P01_V225_REMOTE_PUBLICATION=PASS
      - name: Publication verdict
        run: |
          echo P01_V225_RELEASE_ID=$RELEASE_ID
          echo P01_V225_RELEASE_SOURCE=$RELEASE_SOURCE
          echo P01_V225_RELEASE_TREE=$RELEASE_TREE
          echo P01_V225_MAIN=$MAIN_SHA
          echo P01_V225_ASSET_BYTES=$ASSET_BYTES
          echo P01_V225_ASSET_SHA=$ASSET_SHA
          echo P01_V225_CORE_UPDATES_COMMIT=$CORE_UPDATES_COMMIT
          echo P01_V225_PUBLICATION=PASS
          echo OWNER_PRODUCTION_UPGRADE=PENDING
