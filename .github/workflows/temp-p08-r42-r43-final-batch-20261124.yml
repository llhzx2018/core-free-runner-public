          php "$t" restore-scratch "$site" "$RUNNER_TEMP/p08-r43-target-extract" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/p08-r43-native-restore-kill.log" 2>&1 || { echo P08_R43_NATIVE_KILL_RESTORE=FAIL; exit 1; }
          grep -q '^P08_R43_NATIVE_INDEPENDENT_DB_AND_MEDIA_RESTORE=PASS' "$RUNNER_TEMP/p08-r43-native-restore-kill.log"
          echo P08_R43_NATIVE_REAL_SIGKILL_INDEPENDENT_RESTORE=PASS engine=${{ matrix.engine }}
      - name: Remove confidential source, synthetic installation and backup/restore data
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- private-p08-bridge private-p08-target gov-proof
          rm -rf -- "$RUNNER_TEMP/p08-r43-target-extract" "$RUNNER_TEMP"/p08-r43-site-* "$RUNNER_TEMP"/p08-r43-native-restored-*
          rm -f -- "$RUNNER_TEMP"/p08-r43-*.zip "$RUNNER_TEMP"/p08-r43-*.log
          test ! -e private-p08-bridge && test ! -e private-p08-target && test ! -e gov-proof && test ! -e "$RUNNER_TEMP/p08-r43-target-extract"
          echo P08_R43_NATIVE_CONFIDENTIAL_CLEANUP=PASS
