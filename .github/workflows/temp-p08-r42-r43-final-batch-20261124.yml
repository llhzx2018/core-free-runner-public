          site="$RUNNER_TEMP/p08-r43-site-${{ matrix.engine }}-pre"
          t="private-p08-bridge/tests/compatibility/r43_isolated_installed_native_transaction.php"
          set +e
          php "$t" kill-pre-pointer "$site" "$RUNNER_TEMP/p08-r43-target-extract" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/p08-r43-native-kill.log" 2>&1
          killed=$?
          set -e
          test "$killed" -eq 137 || { echo "P08_R43_NATIVE_SIGKILL_EXIT_INVALID=$killed"; exit 1; }
          test "$(readlink "$site/current")" = "releases/$BRIDGE_SHA"
          test -f "$site/storage/app/private/adops/maintenance/maintenance.json"
          php "$t" recover "$site" "$RUNNER_TEMP/p08-r43-target-extract" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/p08-r43-native-recover.log" 2>&1 || { echo P08_R43_NATIVE_KILL_RECOVERY=FAIL; exit 1; }
          grep -q '^P08_R43_NATIVE_REAL_SIGKILL_NEW_PROCESS_RECOVERED=PASS' "$RUNNER_TEMP/p08-r43-native-recover.log"
          php "$t" verify-rollback "$site" "$RUNNER_TEMP/p08-r43-target-extract" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/p08-r43-native-kill-readback.log" 2>&1 || { echo P08_R43_NATIVE_KILL_READBACK=FAIL; exit 1; }
          php "$t" restore-scratch "$site" "$RUNNER_TEMP/p08-r43-target-extract" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/p08-r43-native-restore-kill.log" 2>&1 || { echo P08_R43_NATIVE_KILL_RESTORE=FAIL; exit 1; }
          grep -q '^P08_R43_NATIVE_INDEPENDENT_DB_AND_MEDIA_RESTORE=PASS' "$RUNNER_TEMP/p08-r43-native-restore-kill.log"
          echo P08_R43_NATIVE_REAL_SIGKILL_INDEPENDENT_RESTORE=PASS engine=${{ matrix.engine }}
      - name: Actual SIGKILL kill-uncommitted and independent recovery
        shell: bash
        run: |
