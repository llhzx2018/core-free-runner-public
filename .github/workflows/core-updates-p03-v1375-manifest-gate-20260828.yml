name: core-updates P03 V1.37.5 Manifest Exact Source Gate

on:
  push:
    paths:
      - '.github/workflows/core-updates-p03-v1375-manifest-gate-20260828.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CORE_UPDATES_SOURCE: 0cc0fbd48a3c47a15df1af991192f09d82e917c3
      CORE_UPDATES_BASE: 807b61764d8405e937a1cd9b3cd134c2bb97f7dc
      P03_RELEASE_SOURCE: f2865c97f80bd8052dd47d76ef08c626c044e669
      P03_RELEASE_ID: '378390441'
      P03_RELEASE_TAG: v1.37.5
      P03_ASSET: VF_Forge_V1.37.5_UPDATE.zip
      P03_ASSET_ID: '533586656'
      P03_ASSET_BYTES: '851575'
      P03_ASSET_SHA256: e90e2ef73abc13634213ee9fd8e166c99866c9b133d9837ec0f7939be51e8150
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact core-updates source and fence base
        env:
          TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone "https://x-access-token:${TOKEN}@github.com/llhzx2018/core-updates.git" updates >/dev/null 2>&1
          cd updates
          git fetch --no-tags origin "$CORE_UPDATES_SOURCE"
          git checkout --detach "$CORE_UPDATES_SOURCE"
          test "$(git rev-parse HEAD)" = "$CORE_UPDATES_SOURCE"
          test "$(git rev-parse HEAD^1)" = "$CORE_UPDATES_BASE"
          test "$(git diff --name-only "$CORE_UPDATES_BASE".."$CORE_UPDATES_SOURCE")" = 'projects/P03.json'
          echo CORE_UPDATES_P03_EXACT_SOURCE_FENCE=PASS
      - name: Validate P03 manifest against JSON Schema
        run: |
          set -Eeuo pipefail
          python3 -m pip install --quiet jsonschema
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker
          root=Path('updates')
          schema=json.loads((root/'schemas/update-manifest-v1.schema.json').read_text())
          d=json.loads((root/'projects/P03.json').read_text())
          Draft202012Validator(schema,format_checker=FormatChecker()).validate(d)
          assert d['project_id']=='P03' and d['component_id']=='APP' and d['enabled'] is True
          assert d['target_version']=='1.37.5' and d['update_type']=='ATOMIC'
          assert d['from_versions']==['1.37.4']
          assert d['schema_from']==d['schema_to']=='30'
          assert d['repository']=='llhzx2018/vf-forge'
          assert d['release_tag']=='v1.37.5' and d['release_id']==378390441
          assert d['product_identity']=='f2865c97f80bd8052dd47d76ef08c626c044e669'
          assert d['asset_name']=='VF_Forge_V1.37.5_UPDATE.zip'
          assert d['asset_bytes']==851575 and d['asset_sha256']=='e90e2ef73abc13634213ee9fd8e166c99866c9b133d9837ec0f7939be51e8150'
          assert d['backup_required'] is True and d['rollback_supported'] is True
          assert '33160320928' in d['notes'] and '98812936218' in d['notes']
          print('P03_V1375_MANIFEST_JSON_SCHEMA=PASS')
          print('P03_V1375_STRICT_FROM_VERSION=PASS')
          PY
      - name: Verify exact Release tag and UPDATE asset
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/vf-forge/git/ref/tags/$P03_RELEASE_TAG --jq .object.sha)" = "$P03_RELEASE_SOURCE"
          gh api repos/llhzx2018/vf-forge/releases/tags/$P03_RELEASE_TAG > /tmp/p03-release.json
          test "$(jq -r .id /tmp/p03-release.json)" = "$P03_RELEASE_ID"
          test "$(jq -r .draft /tmp/p03-release.json)" = false
          test "$(jq -r .prerelease /tmp/p03-release.json)" = false
          test "$(jq -r --arg n "$P03_ASSET" '.assets[]|select(.name==$n)|.id' /tmp/p03-release.json)" = "$P03_ASSET_ID"
          test "$(jq -r --arg n "$P03_ASSET" '.assets[]|select(.name==$n)|.size' /tmp/p03-release.json)" = "$P03_ASSET_BYTES"
          test "$(jq -r --arg n "$P03_ASSET" '.assets[]|select(.name==$n)|.digest' /tmp/p03-release.json)" = "sha256:$P03_ASSET_SHA256"
          echo P03_V1375_RELEASE_ASSET_IDENTITY=PASS
      - name: core-updates PHP syntax and regression
        run: |
          set -Eeuo pipefail
          cd updates
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/core-updates-p03-lint.log
          php update-core/php/tests/run.php
          echo CORE_UPDATES_REGRESSION=PASS
      - name: Final result
        run: |
          echo P03_V1375_MANIFEST_EXACT_SOURCE_GATE=PASS
          echo PRODUCTION_WRITE=NO
