name: P07 D05 disposable CloudPanel site engine-switch rollback
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-m03-d05-cp-site-switch-20261115.yml'
permissions:
  contents: read
jobs:
  cloudpanel-site:
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    runs-on: ubuntu-24.04
    timeout-minutes: 57
    strategy:
      fail-fast: false
      matrix:
        source_engine: [MYSQL_8.4, MARIADB_11_8]
    steps:
      - name: Read public synthetic CloudPanel harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Ephemeral exact P07 product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 0eac0ba1aa1c72a8d4f3282c9f14cdcba64b1625
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: .p07-private-site
      - name: Product site cutover/rollback negative regression and module isolation
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-private-site rev-parse HEAD)" = 0eac0ba1aa1c72a8d4f3282c9f14cdcba64b1625
          (
            cd .p07-private-site
            export PYTHONPATH="$PWD/lib"
            python3 -B -m unittest discover -s tests -p test_p07_m03_d05_site_sandbox.py -v
            python3 -B scripts/check_p07_modules.py --module P07-M03-D05 \
              --pr-title 'P07-M03-D05 数据库引擎转换：隔离 CloudPanel 实站应用切换与回切' \
              --changed-file lib/db_engine_conversion_site_sandbox.py \
              --affected P07-M03-D05 --shared-reason 'D05独立合成验证'
          )
          bash -n tests/p07_m03_d05_cloudpanel_site_switch_20261115.sh
          echo P07_D05_SITE_SWITCH_SOURCE_QA=PASS
      - name: Disposable real CloudPanel and live PHP app switch/rollback
        shell: bash
        env:
          P07_D05_SOURCE_ENGINE: ${{ matrix.source_engine }}
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          timeout --signal=TERM --kill-after=30s 3050s \
            bash tests/p07_m03_d05_cloudpanel_site_switch_20261115.sh
      - name: Remove private source and disposable VMs
        if: always()
        shell: bash
        run: |
          set +e
          sudo ip link del p07tapold >/dev/null 2>&1
          sudo ip link del p07br0 >/dev/null 2>&1
          sudo iptables -t nat -D POSTROUTING -s 172.29.71.0/24 -j MASQUERADE >/dev/null 2>&1
          rm -rf -- .p07-private-site
          test ! -e .p07-private-site
          echo P07_D05_CLOUDPANEL_TEST_PRIVATE_SOURCE_CLEAN=PASS
