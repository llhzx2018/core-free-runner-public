name: P08 v015 R67 preflight DEV full regression (no release)
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p08-v015-r67-dev-fix-20261121.yml
      - lanes/p08-v015-r67-dev-fix-20261121.json
permissions:
  contents: read
jobs:
  p08-v015-r67-dev-only:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-v015-r67-dev-fix-20261121' && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_REPO: llhzx2018/vf-adops
      TARGET_VERSION: '0.1.15'
      TARGET_SHA: e661d1f1094fe30f9a464ec1a8069ccb95704f59
      PYTHONDONTWRITEBYTECODE: '1'
      P08_ISOLATED_INSTALL_TEST: 'YES'
    steps:
      - name: Checkout isolated public-safe lane identity
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runner
          persist-credentials: false
      - name: Validate rendered lane exact source identity before tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B runner/scripts/ephemeral_lane_spec.py validate --spec runner/lanes/p08-v015-r67-dev-fix-20261121.json
          python3 -B runner/scripts/ephemeral_lane_spec.py audit-rendered --spec runner/lanes/p08-v015-r67-dev-fix-20261121.json --input runner/.github/workflows/p08-v015-r67-dev-fix-20261121.yml
      - name: Checkout exact private P08 DEV PR head transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: e661d1f1094fe30f9a464ec1a8069ccb95704f59
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
      - name: PHP 8.4 locked source platform
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: zip,curl,mbstring,pdo_mysql,pdo_sqlite,sqlite3,openssl,posix,dom,intl,fileinfo,sodium
          coverage: none
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact R67 version allowlist and existing effective Mode W tests
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(cat target/VERSION)" = "$TARGET_VERSION"
          python3 -B target/tests/test_r67_v015_fail_closed_version_gate.py
          python3 -B target/tests/test_v015_update_ux_candidate.py
          echo P08_R67_V015_AND_UNKNOWN_FUTURE_NEGATIVES=PASS
      - name: Full exact-source PHP development preflight and Vue regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          tmp="$RUNNER_TEMP/p08-v015-r67-dev"
          mkdir -m 700 "$tmp"
          npm ci --prefix target --ignore-scripts --no-fund --no-audit
          npm run typecheck --prefix target
          npm run test:unit --prefix target
          npm run build --prefix target
          composer --working-dir=target install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress --optimize-autoloader
          if bash target/scripts/dev_check.sh >"$tmp/dev-check-private.log" 2>&1; then
            grep -q '^R1_LOCAL_SOURCE_TESTS=PASS$' "$tmp/dev-check-private.log"
            grep -q '^P08_R67_LEGACY_EXECUTOR_REFUSES_NEW_VERSION=PASS$' "$tmp/dev-check-private.log"
            echo P08_R67_V015_FULL_DEV_CHECK=PASS
          else
            echo P08_R67_V015_FULL_DEV_CHECK=FAIL
            grep -E '^(P08_[A-Z0-9_]+=|R[0-9]+_[A-Z0-9_]+=)' "$tmp/dev-check-private.log" | tail -n 12 || true
            exit 41
          fi
          git -C target diff --exit-code
          echo P08_R67_V015_TYPECHECK_VITEST_BUILD=PASS
      - name: Remove all private source, logs and workspaces
        if: always()
        shell: bash
        run: |
          rm -rf -- target runner "$RUNNER_TEMP/p08-v015-r67-dev"
          test ! -e target && test ! -e runner
          echo P08_R67_V015_PRIVATE_CLEANUP=PASS
