name: P01 V2.21.21 Formal Artifact Gate

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p01-v2.21.21-formal-artifact-gate.yml'
      - 'scripts/p01-build-maintenance-candidate-22121.py'
      - 'scripts/p01-v22121-formal-artifact-gate.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p01-v2.21.21-formal-artifact-gate
  cancel-in-progress: false

env:
  CANDIDATE: 0b62c96b787e03b0dda6ef8493d29755b6baf83e
  CANDIDATE_TREE: 02b6199ab82f2fb03dd9d8048288421037869e4e
  PRODUCTION: 383552dc5035cb60b4cd131907d05d87c3171b9b
  VERSION: 2.21.21
  SOURCE_VERSION: 2.21.20
  SCHEMA: 2026080902

jobs:
  artifact-gate:
    if: (github.event_name == 'pull_request' && startsWith(github.head_ref, 'agent/p01-22121-formal-artifact-gate')) || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout runner gate source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: runner

      - name: Require registered Agent capabilities
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"
          bash -n runner/scripts/p01-v22121-formal-artifact-gate.sh
          python3 -m py_compile runner/scripts/p01-build-maintenance-candidate-22121.py
          echo 'HARNESS_STATIC_GATE=PASS'

      - name: Checkout exact private Candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.CANDIDATE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: candidate

      - name: Checkout exact private Production source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.PRODUCTION }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: production

      - name: Exact identities and private boundary
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test "$(git -C production rev-parse HEAD)" = "$PRODUCTION"
          test "$(tr -d '\r\n' < candidate/VERSION)" = "$VERSION"
          test "$(tr -d '\r\n' < candidate/src/VERSION.txt)" = "$VERSION"
          test "$(tr -d '\r\n' < production/VERSION)" = "$SOURCE_VERSION"
          test "$(tr -d '\r\n' < production/src/VERSION.txt)" = "$SOURCE_VERSION"
          grep -F "define('VF_VERSION', '2.21.21');" candidate/src/app/bootstrap.php >/dev/null
          grep -F "define('VF_VERSION', '2.21.20');" production/src/app/bootstrap.php >/dev/null
          if find candidate production -path '*/.git' -prune -o -type f \( -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.db' -o -name '.env' \) -print | grep -q .; then exit 1; fi
          echo 'EXACT_IDENTITIES_PRIVATE_BOUNDARY=PASS'

      - name: Install gate runtime
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-zip php-xml php-mbstring sqlite3 unzip jq >/dev/null
          php -r 'foreach(["pdo_sqlite","sqlite3","curl","zip","SimpleXML","mbstring","openssl"] as $x){if(!extension_loaded($x)&&!class_exists($x))exit(1);}'

      - name: Probe Atomic self-test visibly
        run: |
          set -Eeuo pipefail
          PROBE="$RUNNER_TEMP/p01-v22121-selftest-probe"
          rm -rf "$PROBE" && mkdir -p "$PROBE"
          python3 runner/scripts/p01-build-maintenance-candidate-22121.py \
            --candidate candidate/src \
            --production production/src \
            --out "$PROBE" \
            --candidate-commit "$CANDIDATE" \
            --candidate-tree "$CANDIDATE_TREE" \
            --production-commit "$PRODUCTION" \
            >/dev/null
          docker run --rm -v "$PROBE:/work:ro" -w /work php:8.0-cli php -l repair-v2.21.21.php
          set +e
          php "$PROBE/repair-v2.21.21.php" --self-test 2>&1 | tee "$RUNNER_TEMP/p01-v22121-selftest-visible.txt"
          rc=${PIPESTATUS[0]}
          set -e
          echo "ATOMIC_SELFTEST_EXIT=$rc"
          test "$rc" -eq 0

      - name: Execute complete formal artifact harness
        run: |
          set -Eeuo pipefail
          sed -i 's#php -l repair-v2.21.21.php >/dev/null#php -l repair-v2.21.21.php#' runner/scripts/p01-v22121-formal-artifact-gate.sh
          bash runner/scripts/p01-v22121-formal-artifact-gate.sh

      - name: Publish safe formal-gate evidence
        env:
          W: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -f /tmp/p01-v22121-formal-evidence.json
          jq -e '.pass==true and .release_authorized==false and .production_changed==false' /tmp/p01-v22121-formal-evidence.json >/dev/null
          git clone -q --depth 1 --branch vf-agent-operations-v1 "https://x-access-token:${W}@github.com/llhzx2018/core-free-runner-public.git" out
          mkdir -p out/vf-agent/results
          cp /tmp/p01-v22121-formal-evidence.json out/vf-agent/results/P01-V2.21.21-FORMAL-ARTIFACT-GATE.json
          git -C out config user.name VictorForge
          git -C out config user.email llhzx2018@gmail.com
          git -C out add vf-agent/results/P01-V2.21.21-FORMAL-ARTIFACT-GATE.json
          git -C out commit -q -m 'evidence(P01): V2.21.21 formal artifact gate PASS'
          git -C out pull -q --rebase origin vf-agent-operations-v1
          git -C out push -q origin HEAD:vf-agent-operations-v1
          echo 'FORMAL_ARTIFACT_GATE=PASS'

      - name: Cleanup all private/generated material
        if: always()
        run: |
          test ! -f /tmp/p01-v22121-browser.pid || kill "$(cat /tmp/p01-v22121-browser.pid)" 2>/dev/null || true
          rm -rf candidate production runner out \
            "$RUNNER_TEMP/p01-v22121-artifact-gate" "$RUNNER_TEMP/p01-v22121-selftest-probe" \
            /tmp/p01-v22121-gate-only /tmp/p01-v22121-runtime-tamper \
            /tmp/p01-v22121-fresh /tmp/p01-v22121-upgrade /tmp/p01-v22121-soft /tmp/p01-v22121-hard
          rm -f /tmp/p01-v22121-*.pid /tmp/p01-v22121-formal-evidence.json "$RUNNER_TEMP"/p01-* || true
          echo 'FORMAL_GATE_EPHEMERAL_CLEANUP=DONE'
