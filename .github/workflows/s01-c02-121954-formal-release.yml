name: S01-C02 1.21.954 Formal Release

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/s01-c02-121954-formal-release.yml'

permissions:
  actions: read
  contents: read

jobs:
  formal-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_REPOSITORY: llhzx2018/vf-tools-ops
      TARGET_SHA: c16fc1cfe9a3e903bb499c0a6038216da3e736aa
      TARGET_VERSION: 1.21.954
      RELEASE_TAG: v1.21.954
      ASSET_NAME: vf-tools-ops_V1.21.954.zip
      TESTED_RUN_ID: '36527830021'
      TESTED_ARTIFACT_NAME: s01-c02-v1.21.954-r5-candidate
      EXPECTED_BYTES: '3405710'
      EXPECTED_SHA256: c57e883dd1aabc7178e9541bc52d112c631ee39657e9e36d3412bc6b6ad11f00
      EXPECTED_RUNTIME_FILES: '961'
      EXPECTED_RUNTIME_FP: 4ab4631542cbf3bc0285ab86b3592582c0e655ec89191eca9684f1269c4b0eb2
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}

    steps:
      - name: Verify credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN"
          test -n "$RELEASE_WRITE_TOKEN"

      - name: Checkout exact promoted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target

      - name: Verify exact release source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n' < target/VERSION)" = "$TARGET_VERSION"
          grep -Fq "Version: $TARGET_VERSION" target/vf-ops.php
          grep -Fq "VF_OPS_VERSION', '$TARGET_VERSION'" target/vf-ops.php
          echo "EXACT_PROMOTED_SOURCE=PASS"

      - name: Fetch exact tested candidate artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir tested
          gh run download "$TESTED_RUN_ID" --repo "llhzx2018/core-free-runner-public" --name "$TESTED_ARTIFACT_NAME" --dir tested
          test -f "tested/FINAL_EVIDENCE.json"
          test -f "tested/package-evidence.json"
          test -f "tested/$ASSET_NAME"
          jq -e --arg sha "$TARGET_SHA" --arg version "$TARGET_VERSION" '
            .status=="PASS" and .candidate_sha==$sha and .candidate_version==$version and
            .public_authority.testing=="PASS" and .public_authority.git=="PASS" and
            .public_authority.upgrade=="PASS" and .public_authority.security=="PASS" and
            .public_authority.ua_ui=="PASS" and
            .existing_install_upgrade_preservation=="PASS" and
            .updater_implementation_changed==false and .schema_migration=="NONE" and
            .browser.result=="PASS" and .browser.blocking_errors==0 and .browser.responsive_failures==0
          ' tested/FINAL_EVIDENCE.json >/dev/null
          jq -e --arg version "$TARGET_VERSION" --arg sha "$EXPECTED_SHA256" --arg fp "$EXPECTED_RUNTIME_FP" --argjson bytes "$EXPECTED_BYTES" --argjson files "$EXPECTED_RUNTIME_FILES" '
            .candidate.version==$version and .candidate.bytes==$bytes and .candidate.sha256==$sha and
            .candidate.files==$files and .candidate.runtime_fingerprint==$fp
          ' tested/package-evidence.json >/dev/null
          test "$(stat -c %s "tested/$ASSET_NAME")" = "$EXPECTED_BYTES"
          test "$(sha256sum "tested/$ASSET_NAME" | awk '{print $1}')" = "$EXPECTED_SHA256"
          unzip -tq "tested/$ASSET_NAME" >/dev/null
          echo "TESTED_ARTIFACT_EXACT=PASS"

      - name: Create formal release from exact tested artifact
        shell: bash
        env:
          GH_TOKEN: ${{ env.RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          if gh api "repos/$TARGET_REPOSITORY/releases/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            TAG_SHA="$(gh api "repos/$TARGET_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
            test "$TAG_SHA" = "$TARGET_SHA"
          else
            cat > release-notes.md <<'MD'
          S01-C02 · VF Tools Ops · V1.21.954

          Production Real-use R5:
          - removes duplicate internal Page Body headers from 工具 / 内容与 SEO 概览 / 发布中心
          - removes the resulting dead vertical space below the shared S01 page title
          - compacts the daily Polylang blocker while preserving raw evidence in Advanced
          - 工作台 remains unchanged / locked for this round
          - Page Body V2 Macro remains frozen
          - Shell / Header / Header Menu IA remain frozen
          - no route, canonical data, schema, permission, provider ownership, business logic or updater semantic change
          - Exact Candidate Gate Run: 36527830021
          - exact source: c16fc1cfe9a3e903bb499c0a6038216da3e736aa

          OWNER Production visual acceptance remains pending after installation.
          MD
            gh release create "$RELEASE_TAG" "tested/$ASSET_NAME" --repo "$TARGET_REPOSITORY" --target "$TARGET_SHA" --title "VF Tools Ops V1.21.954" --notes-file release-notes.md
          fi
          echo "FORMAL_RELEASE_CREATE=PASS"

      - name: Remote formal release exact readback
        shell: bash
        env:
          GH_TOKEN: ${{ env.RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$TARGET_REPOSITORY/releases/tags/$RELEASE_TAG" > release.json
          RELEASE_ID="$(jq -r '.id' release.json)"
          ASSET_ID="$(jq -r --arg n "$ASSET_NAME" '.assets[] | select(.name==$n) | .id' release.json)"
          ASSET_SIZE="$(jq -r --arg n "$ASSET_NAME" '.assets[] | select(.name==$n) | .size' release.json)"
          ASSET_DIGEST="$(jq -r --arg n "$ASSET_NAME" '.assets[] | select(.name==$n) | (.digest // "")' release.json)"
          TAG_SHA="$(gh api "repos/$TARGET_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          test "$TAG_SHA" = "$TARGET_SHA"
          test "$ASSET_SIZE" = "$EXPECTED_BYTES"
          if [ -n "$ASSET_DIGEST" ] && [ "$ASSET_DIGEST" != "null" ]; then test "$ASSET_DIGEST" = "sha256:$EXPECTED_SHA256"; fi
          rm -rf readback; mkdir readback
          gh release download "$RELEASE_TAG" --repo "$TARGET_REPOSITORY" --pattern "$ASSET_NAME" --dir readback --clobber
          test "$(stat -c %s "readback/$ASSET_NAME")" = "$EXPECTED_BYTES"
          test "$(sha256sum "readback/$ASSET_NAME" | awk '{print $1}')" = "$EXPECTED_SHA256"
          unzip -tq "readback/$ASSET_NAME" >/dev/null
          echo "FORMAL_RELEASE_REMOTE_READBACK=PASS"
          echo "RELEASE_ID=$RELEASE_ID"
          echo "ASSET_ID=$ASSET_ID"
          echo "ASSET_BYTES=$ASSET_SIZE"
          echo "ASSET_SHA256=$EXPECTED_SHA256"
          echo "RUNTIME_FILES=$EXPECTED_RUNTIME_FILES"
          echo "RUNTIME_FINGERPRINT=$EXPECTED_RUNTIME_FP"

      - name: Remove private product bytes
        if: always()
        shell: bash
        run: rm -rf target tested readback

