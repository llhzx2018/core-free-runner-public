name: P01 Develop Exact Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p01-develop-hotfix.yml'
      - 'requests/p01-develop-hotfix-*.txt'

permissions:
  contents: read

concurrency:
  group: p01-develop-hotfix
  cancel-in-progress: false

jobs:
  hotfix:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      EXPECTED_HEAD: b8bd4c4d04de802a91f62edd7ea0bd2f3000e196
    steps:
      - name: Require unified write credential
        shell: bash
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$WRITE_TOKEN" || { echo 'VF_RELEASE_WRITE_TOKEN missing' >&2; exit 79; }
          echo 'VF_RELEASE_WRITE_TOKEN_PRESENT=YES'

      - name: Checkout exact private P01 develop
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: develop
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
          path: p01

      - name: Guard and repair exact syntax defect
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p01 rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('p01/src/app/bootstrap.php')
          s=p.read_text(encoding='utf-8')
          old="if (is_numeric($value)) return max(0, (int)$value;"
          new="if (is_numeric($value)) return max(0, (int)$value);"
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one syntax defect, got {s.count(old)}')
          p.write_text(s.replace(old,new),encoding='utf-8',newline='\n')
          PY
          php -l p01/src/app/bootstrap.php
          php -l p01/src/app/UpdateManager.php
          php -l p01/src/app/CoreUpdates/UpdateCore.php
          php -l p01/src/app/CoreUpdates/GitHubClient.php
          echo 'P01_DEVELOP_HOTFIX_LINT=PASS'

      - name: Commit exact repair
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p01
          git config user.name 'VF Release Automation'
          git config user.email 'vf-release-automation@users.noreply.github.com'
          git add src/app/bootstrap.php
          git diff --cached --check
          git commit -m 'fix(update): repair bootstrap syntax after version alignment'
          git push origin HEAD:develop
          echo "P01_REPAIRED_HEAD=$(git rev-parse HEAD)"
