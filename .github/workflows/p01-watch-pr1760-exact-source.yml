name: P01 Watch PR1760 Exact Source Regression
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-watch-pr1760-exact-source.yml'
permissions:
  contents: read
jobs:
  watch-regression:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_REPOSITORY: llhzx2018/vf-start
      CANDIDATE_SHA: 05f554823cce23ecc6d1e408d20124e94eec57fa
    steps:
      - name: Prepare ephemeral PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, curl, mbstring, zip, gd, openssl
          coverage: none
      - name: Exact private-source checkout
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN" || { echo 'P01_WATCH_BLOCKED_SECRET_MISSING'; exit 11; }
          git init -q candidate
          git -C candidate remote add origin "https://x-access-token:$READ_TOKEN@github.com/$SOURCE_REPOSITORY.git"
          git -C candidate -c advice.detachedHead=false fetch -q --depth 1 origin "$CANDIDATE_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C candidate remote remove origin
          echo "P01_WATCH_EXACT_SOURCE=$CANDIDATE_SHA"
      - name: PHP syntax and version identity
        working-directory: candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(tr -d '\r\n ' < VERSION)" = "2.47.460"
          test "$(tr -d '\r\n ' < src/VERSION.txt)" = "2.47.460"
          for file in \
            src/app/WatchMediaLibraryPage.php \
            src/app/WatchFacetContext.php \
            src/app/SubjectPageChrome.php \
            tests/unit/watch_cinema_rebuild_contract.php; do
            php -l "$file" >/dev/null
          done
          echo P01_WATCH_PHP_LINT=PASS
      - name: Watch focused unit and source regressions
        working-directory: candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          count=0
          failed=0
          for file in tests/unit/*watch*.php tests/unit/*Watch*.php; do
            test -f "$file" || continue
            count=$((count+1))
            if php "$file"; then :; else
              failed=$((failed+1))
              echo "P01_WATCH_FAILED_TEST=$file"
            fi
          done
          echo "P01_WATCH_FOCUSED_RESULT count=$count failed=$failed"
          test "$count" -ge 20
          test "$failed" -eq 0
          echo P01_WATCH_FOCUSED_TESTS=PASS
      - name: Remove transient source
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -d candidate ]; then
            git -C candidate remote remove origin 2>/dev/null || true
            rm -rf candidate
          fi
          test ! -e candidate
          echo P01_WATCH_PRIVATE_SOURCE_CLEANUP=PASS
