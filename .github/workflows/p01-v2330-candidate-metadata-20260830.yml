name: P01 V2.33.0 Candidate Metadata Closure
on:
  push:
    branches: [task/p01-v2330-candidate-closure-20260830]
    paths:
      - .github/workflows/p01-v2330-candidate-metadata-20260830.yml
permissions:
  contents: read
jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: release/p01-v2.33.0-candidate-20260830
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Exact-source V2.33 candidate metadata closure
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          test "$(git rev-parse HEAD)" = faf853ab897c9e9b080dd365ab54df7698a8428c
          test "$(git rev-parse HEAD^{tree})" = f81d776da1fa92d04acd31ccbe6444cb1d9f0d43
          python3 ../runner/scripts/p01-v2330-candidate-metadata.py
          python3 -m json.tool VF_PROJECT.json >/dev/null
          php -l src/app/bootstrap.php >/dev/null
          node --check src/assets/health.js >/dev/null
          test "$(cat VERSION)" = 2.33.0
          test "$(cat src/VERSION.txt)" = 2.33.0
          grep -Fx "define('VF_VERSION', '2.33.0');" src/app/bootstrap.php
          grep -F 'V2.33.0 RELEASE CANDIDATE' docs/authority/CURRENT.md >/dev/null
          grep -F 'Unified Candidate Readiness' docs/evidence/P01_V2.33.0_CANDIDATE_READINESS_20260830.md >/dev/null
          { git diff --name-only; git ls-files --others --exclude-standard; } | sort > /tmp/v233-candidate-actual.txt
          printf '%s\n' CHANGELOG.md VERSION VF_PROJECT.json docs/authority/CURRENT.md docs/evidence/P01_V2.33.0_CANDIDATE_READINESS_20260830.md docs/handoff/CURRENT_STATE.md src/VERSION.txt src/app/bootstrap.php | sort > /tmp/v233-candidate-expected.txt
          diff -u /tmp/v233-candidate-expected.txt /tmp/v233-candidate-actual.txt
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add CHANGELOG.md VERSION VF_PROJECT.json docs/authority/CURRENT.md docs/evidence/P01_V2.33.0_CANDIDATE_READINESS_20260830.md docs/handoff/CURRENT_STATE.md src/VERSION.txt src/app/bootstrap.php
          git commit -m 'chore(P01): close V2.33.0 candidate metadata'
          git push origin HEAD:release/p01-v2.33.0-candidate-20260830
          echo "NEW_SOURCE=$(git rev-parse HEAD)"
          echo "NEW_TREE=$(git rev-parse HEAD^{tree})"
          echo "RUNTIME_SRC_TREE=$(git rev-parse HEAD:src)"
          echo 'VERSION=2.33.0'
          echo 'SCHEMA=2026082901'
          echo 'OWNER_PRODUCTION_WRITE=NO'
          echo 'RELEASE=NO'
