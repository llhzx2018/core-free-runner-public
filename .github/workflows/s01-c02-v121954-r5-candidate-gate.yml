name: S01-C02 V1.21.954 Production Real-use R5 Candidate Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/s01-c02-v121954-r5-candidate-gate.yml'

permissions:
  contents: read

env:
  TARGET_REPOSITORY: llhzx2018/vf-tools-ops
  TARGET_SHA: c16fc1cfe9a3e903bb499c0a6038216da3e736aa
  BASE_SHA: 2068e4b1435d28ab5333ca076f95f371a6559b95
  TARGET_VERSION: 1.21.954
  BASE_VERSION: 1.21.953
  ARTIFACT_NAME: vf-tools-ops_V1.21.954.zip

jobs:
  candidate:
    name: Exact Source + Upgrade + Browser Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout Public Runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runner
          persist-credentials: false

      - name: Credential presence gate
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo 'PRIVATE_READ_CREDENTIAL=PASS'

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.BASE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: baseline
          fetch-depth: 1
          persist-credentials: false

      - name: Exact source and bounded diff gate
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C baseline rev-parse HEAD)" = "$BASE_SHA"
          test "$(tr -d '\r\n' < target/VERSION)" = "$TARGET_VERSION"
          grep -Fq " * Version: $TARGET_VERSION" target/vf-ops.php
          grep -Fq "VF_OPS_VERSION', '$TARGET_VERSION'" target/vf-ops.php
          git -C target diff --name-only "$BASE_SHA..$TARGET_SHA" | tee evidence/changed-files.txt
          cat > /tmp/allowed-files.txt <<'EOF'
          CHANGELOG.md
          VERSION
          assets/css/current/admin-s01-page-body-fine-polish-r1.css
          includes/s01/tool-workbench.php
          tests/s01-c02-prod-realuse-r5-pagehead-dedup-contract.php
          vf-ops.php
          EOF
          sort -u evidence/changed-files.txt > /tmp/actual-files.txt
          sort -u /tmp/allowed-files.txt > /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          ! grep -Eq '^(includes/wp-update/|includes/v6/(schema|migration|upgrade)|uninstall\.php|database/)' evidence/changed-files.txt
          echo 'EXACT_SOURCE_AND_BOUNDED_DIFF=PASS'

      - name: PHP syntax and UI contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm -v "$PWD/target:/src:ro" -w /src php:8.2-cli sh -lc '
            set -eu
            find . -path "./.git" -prune -o -name "*.php" -print0 | xargs -0 -n1 php -l >/tmp/php-lint.txt
            php tests/s01-c02-page-body-v2-fine-polish-r1-full-surface-contract.php
            php tests/s01-c02-page-body-v2-fine-polish-r3-human-language-contract.php
            php tests/s01-c02-page-body-v2-fine-polish-r4-b1-readability-contract.php
            php tests/s01-c02-page-body-v2-fine-polish-r4-b2-baseline-contract.php
            php tests/s01-c02-page-body-v2-fine-polish-r4-b3-publish-contract.php
            php tests/s01-c02-prod-realuse-r5-pagehead-dedup-contract.php
          '
          echo 'PHP_UI_CONTRACTS=PASS'

      - name: Security source gate
        shell: bash
        run: |
          set -Eeuo pipefail
          ! grep -RIlE --exclude-dir=.git -- '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|Authorization:[[:space:]]*Bearer[[:space:]]+[A-Za-z0-9._-]{16,}|sk-[A-Za-z0-9]{20,})' target | grep -q .
          ! find target -type f \( -name '.env' -o -name '*.pem' -o -name '*.key' -o -name 'id_rsa' -o -name 'id_ed25519' \) -print -quit | grep -q .
          echo 'SECURITY_SOURCE_SCAN=PASS'

      - name: Build exact deterministic packages
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib, json, re, zipfile
          from pathlib import Path
          def runtime(rel: Path) -> bool:
              p=rel.as_posix().lstrip('/')
              parts=p.split('/')
              if not p or '..' in parts: return False
              if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in parts): return False
              if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$', p, re.I): return False
              if '/' not in p: return p in {'vf-ops.php','uninstall.php'}
              return parts[0] in {'includes','assets','languages','config'}
          def collect(root):
              out={}
              for path in root.rglob('*'):
                  if path.is_file() and not path.is_symlink():
                      rel=path.relative_to(root)
                      if runtime(rel): out[rel.as_posix()]=path.read_bytes()
              return dict(sorted(out.items()))
          def fingerprint(files):
              h=hashlib.sha256()
              for rel,data in sorted(files.items()):
                  h.update(rel.encode()); h.update(b'\0'); h.update(hashlib.sha256(data).hexdigest().encode()); h.update(b'\n')
              return h.hexdigest()
          def pack(path,files):
              with zipfile.ZipFile(path,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
                  for rel,data in sorted(files.items()):
                      info=zipfile.ZipInfo(f'vf-ops/{rel}',(2026,9,29,0,0,0))
                      info.compress_type=zipfile.ZIP_DEFLATED
                      info.external_attr=0o100644<<16
                      z.writestr(info,data)
          rows={}
          for label,root,version,name in [
              ('baseline',Path('baseline'),'1.21.953',Path('/tmp/vf-tools-ops_V1.21.953.zip')),
              ('candidate',Path('target'),'1.21.954',Path('/tmp/vf-tools-ops_V1.21.954.zip')),
          ]:
              files=collect(root); pack(name,files)
              with zipfile.ZipFile(name) as z: assert z.testzip() is None
              rows[label]={'version':version,'files':len(files),'bytes':name.stat().st_size,'sha256':hashlib.sha256(name.read_bytes()).hexdigest(),'runtime_fingerprint':fingerprint(files)}
          Path('evidence/package-evidence.json').write_text(json.dumps(rows,indent=2)+'\n')
          print(json.dumps(rows,indent=2))
          PY
          cp "/tmp/$ARTIFACT_NAME" "evidence/$ARTIFACT_NAME"
          unzip -tq "evidence/$ARTIFACT_NAME" >/dev/null
          echo 'EXACT_RUNTIME_PACKAGE=PASS'

      - name: Existing-install upgrade preservation gate
        shell: bash
        run: |
          set -Eeuo pipefail
          NET="vf-r5-${GITHUB_RUN_ID}"
          DB="vf-r5-db-${GITHUB_RUN_ID}"
          WP="vf-r5-wp-${GITHUB_RUN_ID}"
          PORT="$((18000 + (GITHUB_RUN_ID % 10000)))"
          cleanup(){ docker rm -f "$WP" "$DB" >/dev/null 2>&1 || true; docker network rm "$NET" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          cleanup
          docker network create "$NET" >/dev/null
          docker run -d --name "$DB" --network "$NET" -e MARIADB_DATABASE=vf_test -e MARIADB_USER=vf_runner -e MARIADB_PASSWORD=vf_runner_ephemeral -e MARIADB_ROOT_PASSWORD=vf_root_ephemeral mariadb:11.8.8 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci >/dev/null
          for i in $(seq 1 40); do docker exec "$DB" mariadb-admin ping -uroot -pvf_root_ephemeral --silent >/dev/null 2>&1 && break || sleep 2; done
          docker exec "$DB" mariadb-admin ping -uroot -pvf_root_ephemeral --silent >/dev/null
          docker run -d --name "$WP" --network "$NET" -p "127.0.0.1:${PORT}:80" -e WORDPRESS_DB_HOST="$DB:3306" -e WORDPRESS_DB_USER=vf_runner -e WORDPRESS_DB_PASSWORD=vf_runner_ephemeral -e WORDPRESS_DB_NAME=vf_test -e WORDPRESS_TABLE_PREFIX=wp_ -e WORDPRESS_DEBUG=1 wordpress:7.0.2-php8.4-apache >/dev/null
          for i in $(seq 1 40); do curl -fsS "http://127.0.0.1:${PORT}/wp-login.php" >/dev/null 2>&1 && break || sleep 2; done
          curl -fsSL https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar -o /tmp/wp-cli.phar
          docker cp /tmp/wp-cli.phar "$WP:/usr/local/bin/wp"; docker exec "$WP" chmod +x /usr/local/bin/wp
          docker cp /tmp/vf-tools-ops_V1.21.953.zip "$WP:/tmp/vf-tools-ops_V1.21.953.zip"
          docker cp "/tmp/$ARTIFACT_NAME" "$WP:/tmp/$ARTIFACT_NAME"
          BASE_URL="http://127.0.0.1:${PORT}"
          docker exec "$WP" wp core install --allow-root --path=/var/www/html --url="$BASE_URL" --title='VF Ops R5 Upgrade' --admin_user=admin --admin_password='VF-R5-Admin-954!' --admin_email=fixture@example.invalid --skip-email >/dev/null
          docker exec "$WP" wp plugin install /tmp/vf-tools-ops_V1.21.953.zip --activate --force --allow-root --path=/var/www/html >/dev/null
          docker exec "$WP" wp eval --allow-root --path=/var/www/html '
            if (VF_OPS_VERSION !== "1.21.953") exit(2);
            update_option("vf_ops_r5_fixture_business_state", ["keep"=>"yes","n"=>954], false);
            $h=vf_tools_ops_v6_secret_put("R5FIX","fixture-secret-value","r5");
            update_option("vf_ops_r5_fixture_secret_handle",$h,false);
            if (!wp_next_scheduled("vf_ops_r5_fixture_cron")) wp_schedule_single_event(time()+3600,"vf_ops_r5_fixture_cron");
          '
          docker exec "$WP" wp plugin install "/tmp/$ARTIFACT_NAME" --activate --force --allow-root --path=/var/www/html >/dev/null
          docker exec "$WP" wp eval --allow-root --path=/var/www/html '
            do_action("admin_init");
            require_once ABSPATH . "wp-admin/includes/plugin.php";
            $d=get_plugin_data(WP_PLUGIN_DIR . "/vf-ops/vf-ops.php", false, false);
            if (($d["Version"]??"") !== "1.21.954" || VF_OPS_VERSION !== "1.21.954") exit(2);
            if (!is_plugin_active("vf-ops/vf-ops.php")) exit(3);
            $business=get_option("vf_ops_r5_fixture_business_state",[]);
            $h=(string)get_option("vf_ops_r5_fixture_secret_handle","");
            if (($business["keep"]??"") !== "yes") exit(4);
            if (vf_tools_ops_v6_secret_resolve($h,"R5FIX") !== "fixture-secret-value") exit(5);
            if (!wp_next_scheduled("vf_ops_r5_fixture_cron")) exit(6);
            if (count(vf_tools_ops_v6_table_suffixes()) !== 48) exit(7);
            if (class_exists("VF_Ops_Runtime_Authority_V1") && is_wp_error(VF_Ops_Runtime_Authority_V1::verify("1.21.954", WP_PLUGIN_DIR . "/vf-ops/"))) exit(8);
            echo "EXISTING_INSTALL_UPGRADE_PRESERVATION=PASS\n";
          ' | tee evidence/upgrade-after.txt
          echo "VF_BASE_URL=$BASE_URL" >> "$GITHUB_ENV"
          echo "VF_WP_CONTAINER=$WP" >> "$GITHUB_ENV"
          echo "VF_DB_CONTAINER=$DB" >> "$GITHUB_ENV"
          echo "VF_DOCKER_NETWORK=$NET" >> "$GITHUB_ENV"
          trap - EXIT

      - name: Authenticated browser responsive gate
        shell: bash
        env:
          WP_ADMIN_PASSWORD: VF-R5-Admin-954!
        run: |
          set -Eeuo pipefail
          cd target/.github/phase3
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.58.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          node browser-e2e.js "$VF_BASE_URL" "$GITHUB_WORKSPACE/evidence/browser-e2e.json"
          jq -e '.result=="PASS" and .login=="PASS" and .blocking_errors==0 and .responsive_failures==0' "$GITHUB_WORKSPACE/evidence/browser-e2e.json" >/dev/null
          echo 'AUTHENTICATED_BROWSER_RESPONSIVE=PASS'

      - name: Final evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -n --arg target "$TARGET_SHA" --arg base "$BASE_SHA" --arg version "$TARGET_VERSION" --argjson browser "$(cat evidence/browser-e2e.json)" --argjson package "$(cat evidence/package-evidence.json)" '{
            status:"PASS", project_id:"S01", component_id:"S01-C02",
            candidate_version:$version, candidate_sha:$target, baseline_sha:$base,
            public_authority:{testing:"PASS",git:"PASS",upgrade:"PASS",security:"PASS",ua_ui:"PASS",install:"ADDITIONAL_NOT_REQUIRED",data_schema:"N_A"},
            php_ui_contract:"PASS", security_source_scan:"PASS",
            existing_install_upgrade_preservation:"PASS",
            updater_implementation_changed:false, schema_migration:"NONE",
            internal_table_contract:48, owner_surface_scope:["O02","O03","O11"],
            browser:$browser, package:$package, production:"NOT_EXECUTED"
          }' | tee evidence/FINAL_EVIDENCE.json
          sha256sum "evidence/$ARTIFACT_NAME" | tee evidence/SHA256SUMS.txt
          echo 'S01-C02 V1.21.954 R5 CANDIDATE MACHINE PASS'

      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-v1.21.954-r5-candidate
          path: |
            evidence/FINAL_EVIDENCE.json
            evidence/package-evidence.json
            evidence/browser-e2e.json
            evidence/changed-files.txt
            evidence/upgrade-after.txt
            evidence/SHA256SUMS.txt
            evidence/vf-tools-ops_V1.21.954.zip
          retention-days: 30

      - name: Cleanup runtime
        if: always()
        shell: bash
        run: |
          docker rm -f "${VF_WP_CONTAINER:-}" "${VF_DB_CONTAINER:-}" >/dev/null 2>&1 || true
          docker network rm "${VF_DOCKER_NETWORK:-}" >/dev/null 2>&1 || true
