name: P02 V2.5.1 Production Hotfix Verify
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p02-v251-hotfix-verify.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: maintenance/v2.5.1-production-hotfix
          token: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'
          path: p02
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare runtime
        working-directory: p02
        run: |
          set -Eeuo pipefail
          test -n '${{ secrets.VF_PRIVATE_READ_TOKEN }}'
          test "$(cat VERSION)" = 2.5.1
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-zip php-curl sqlite3 curl
          php -l public/index.php >/dev/null
          node --check public/assets/app.js
          node --check public/assets/editor-enhancements.js
          node --check public/assets/v251-preboot.js
          test -s public/assets/v251-hotfix.css
          grep -q 'v251-hotfix.css' public/index.php
          grep -q 'v251-preboot.js' public/index.php
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Fresh install and browser regression
        working-directory: p02
        env: {AUDIT_PASSWORD: 'P02-V251-${{ github.run_id }}-${{ github.run_attempt }}!'}
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/p02-v251"; SITE="$ROOT/site"; mkdir -p "$SITE"
          bash scripts/build-deploy-tree.sh "$SITE" >/dev/null
          test "$(cat "$SITE/VERSION.txt")" = 2.5.1
          test -s "$SITE/assets/v251-hotfix.css"; test -s "$SITE/assets/v251-preboot.js"
          php -d display_errors=0 -S 127.0.0.1:18171 -t "$SITE" >"$ROOT/server.log" 2>&1 & echo $! > "$ROOT/server.pid"
          for _ in $(seq 1 80); do curl -fsS http://127.0.0.1:18171/setup.php >/dev/null 2>&1 && break; sleep .25; done
          curl -fsS -c "$ROOT/cookie.txt" http://127.0.0.1:18171/setup.php > "$ROOT/setup.html"
          TOKEN=$(python3 - "$ROOT/setup.html" <<'PY'
          import re,html,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf" value="([^"]+)"',s);assert m;print(html.unescape(m.group(1)))
          PY
          )
          test "$(curl -sS -o /dev/null -w '%{http_code}' -b "$ROOT/cookie.txt" -c "$ROOT/cookie.txt" -H 'Origin: http://127.0.0.1:18171' --data-urlencode "setup_csrf=$TOKEN" --data-urlencode "password=$AUDIT_PASSWORD" --data-urlencode "password_confirm=$AUDIT_PASSWORD" http://127.0.0.1:18171/setup.php)" = 303
          cat > .v251-hotfix.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1440,height:900}});
          let page=await context.newPage();const errors=[];page.on('pageerror',e=>errors.push(String(e)));
          await page.goto('http://127.0.0.1:18171/',{waitUntil:'networkidle'});
          let sess=await page.evaluate(async()=>await(await fetch('/api.php?action=session',{cache:'no-store'})).json());
          if(!sess?.site?.auth){await page.locator('[data-open-login]').click();await page.locator('#loginForm input[name="password"]').fill(process.env.AUDIT_PASSWORD);await page.locator('#loginSubmit').click();await page.waitForFunction(async()=>Boolean((await(await fetch('/api.php?action=session',{cache:'no-store'})).json())?.site?.auth));sess=await page.evaluate(async()=>await(await fetch('/api.php?action=session',{cache:'no-store'})).json());}
          const csrf=sess.csrf;const post=async(a,b)=>page.evaluate(async({a,b,csrf})=>await(await fetch('/api.php?action='+a,{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(b)})).json(),{a,b,csrf});
          const c=await post('category_save',{name:'V251 Hotfix Audit',description:'',icon:'folder'});const cid=Number(c.id);if(!cid)throw new Error('category');
          const i=await post('content_save',{category_id:cid,title:'V2.5.1 中栏与字号验证',description:'hotfix',content:'# V2.5.1\n\n这是一段用于字号变化验证的正文。\n\n## 第二节\n\n中间文档列表必须在新会话默认可见。',content_mode:'article',content_format:'markdown',primary_action:'read',status:'active'});const iid=Number(i.id);if(!iid)throw new Error('item');
          await page.evaluate(async({cid,iid})=>{await setContentView('notebook');await selectCategory(cid);await openReader(iid,true)},{cid,iid});await page.waitForFunction(iid=>Number(state.readerItem?.id)===iid,iid,{timeout:10000});
          const initial=await page.locator('#notebookListPane').isVisible();if(!initial)throw new Error('initial document list hidden');
          await page.locator('#notebookPaneCollapse').click();await page.waitForFunction(()=>state.notebookListCollapsed===true);await page.locator('#notebookPaneRestore').waitFor({state:'visible'});
          const rb=await page.locator('#notebookPaneRestore').boundingBox();const sb=await page.locator('#sidebarRailToggle').boundingBox();if(!rb||rb.x<245)throw new Error('restore clipped '+JSON.stringify(rb));if(sb&&Math.abs((sb.x+sb.width/2)-(rb.x+rb.width/2))<20)throw new Error('restore overlaps sidebar rail');
          const stored=await page.evaluate(()=>({local:localStorage.getItem('vftb-notebook-list-collapsed'),session:sessionStorage.getItem('vftb-notebook-list-collapsed-session')}));if(stored.local!=='1'||stored.session!=='1')throw new Error('collapsed state not captured '+JSON.stringify(stored));
          await page.close();page=await context.newPage();await page.goto('http://127.0.0.1:18171/',{waitUntil:'networkidle'});await page.waitForFunction(()=>window.state&&state.site?.auth===true);
          const reset=await page.evaluate(()=>({local:localStorage.getItem('vftb-notebook-list-collapsed'),session:sessionStorage.getItem('vftb-notebook-list-collapsed-session'),state:state.notebookListCollapsed}));if(reset.local!=='0'||reset.session!=='0'||reset.state!==false)throw new Error('new-session reset failed '+JSON.stringify(reset));
          await page.evaluate(async({cid,iid})=>{await setContentView('notebook');await selectCategory(cid);await openReader(iid,true)},{cid,iid});await page.waitForFunction(iid=>Number(state.readerItem?.id)===iid,iid,{timeout:10000});if(!await page.locator('#notebookListPane').isVisible())throw new Error('document list missing after new session');
          await page.evaluate(async()=>await state.workspaceController.setMode('edit',true));await page.locator('#articleSource').waitFor({state:'visible'});const ta=page.locator('#articleSource');await ta.focus();await ta.evaluate(el=>el.setSelectionRange(0,Math.min(20,el.value.length)));
          const before=await ta.evaluate(el=>parseFloat(getComputedStyle(el).fontSize));const labelBefore=await page.locator('[data-vf-editor-size-value]').first().textContent();await page.locator('[data-vf-editor-action="font-larger"]').first().click();const after=await ta.evaluate(el=>parseFloat(getComputedStyle(el).fontSize));const labelAfter=await page.locator('[data-vf-editor-size-value]').first().textContent();if(!(after>before))throw new Error('editor font did not change '+JSON.stringify({before,after,labelBefore,labelAfter}));
          if(errors.length)throw new Error(errors.join(' | '));console.log('P02_V251_HOTFIX_PASS='+JSON.stringify({rb,sb,stored,reset,before,after,labelBefore,labelAfter}));await browser.close();
          JS
          node .v251-hotfix.mjs
      - name: Cleanup
        if: always()
        working-directory: p02
        run: |
          if test -f "$RUNNER_TEMP/p02-v251/server.pid"; then kill "$(cat "$RUNNER_TEMP/p02-v251/server.pid")" 2>/dev/null || true; fi
          rm -rf "$RUNNER_TEMP/p02-v251" .v251-hotfix.mjs node_modules package.json package-lock.json || true
