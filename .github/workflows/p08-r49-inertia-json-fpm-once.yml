name: P08 R49 Inertia JSON immutable FPM readback (one-off)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p08-r49-inertia-json-fpm-once.yml'
permissions:
  contents: read
jobs:
  extracted-atomic:
    name: Real systemd offline 0.1.0 bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      P08_ORIGINAL_SHA: 55ecbc8461a4d90fe7241a00caffa55e557cde1c
      P08_BRIDGE_SHA: 795ba67ac69a461e16084732d0e2ab2b441f576e
      P08_TARGET_SHA: c1dbe9f1edecd25d4b3f92a8810f21032df9f0ae
    steps:
      - name: Checkout temporary public-safe PHP harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exact original flat 0.1.0 source checkout (R21 Owner trial)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-adops
          ref: 55ecbc8461a4d90fe7241a00caffa55e557cde1c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-flat
      - name: Exact private P08 0.1.0 bridge checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-adops
          ref: 795ba67ac69a461e16084732d0e2ab2b441f576e
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-bridge
      - name: Exact private P08 0.1.1 candidate checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-adops
          ref: c1dbe9f1edecd25d4b3f92a8810f21032df9f0ae
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-target
      - name: Verify source and target identity, no Owner data
        run: |
          set -euo pipefail
          test "$(git -C private-flat rev-parse HEAD)" = "$P08_ORIGINAL_SHA"
          test "$(cat private-flat/VERSION)" = "0.1.0"
          test ! -e private-flat/.env
          test "$(git -C private-bridge rev-parse HEAD)" = "$P08_BRIDGE_SHA"
          test "$(git -C private-target rev-parse HEAD)" = "$P08_TARGET_SHA"
          test "$(cat private-bridge/VERSION)" = "0.1.0"
          test "$(cat private-target/VERSION)" = "0.1.1"
          test ! -e private-bridge/.env
          test ! -e private-target/.env
          echo "P08_R32_BRIDGE_SOURCE=$P08_BRIDGE_SHA"
          echo "P08_R32_TARGET_SOURCE=$P08_TARGET_SHA"
      - name: Install PHP 8.4 Composer and native extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_mysql, pdo_sqlite, sqlite3, zip, mbstring, intl, bcmath, dom, fileinfo, sodium
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native PHP 8.4 FPM from Ubuntu 24.04 maintained PHP package repository
        run: |
          set -euo pipefail
          sudo apt-get update -qq > "$RUNNER_TEMP/p08-r41-apt.log" 2>&1 || { echo P08_R41_APT_UPDATE_FAILED; tail -n 25 "$RUNNER_TEMP/p08-r41-apt.log"; exit 1; }
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq software-properties-common >> "$RUNNER_TEMP/p08-r41-apt.log" 2>&1 || { echo P08_R41_APT_PREREQUISITE_FAILED; tail -n 25 "$RUNNER_TEMP/p08-r41-apt.log"; exit 1; }
          sudo add-apt-repository -y ppa:ondrej/php >> "$RUNNER_TEMP/p08-r41-apt.log" 2>&1 || { echo P08_R41_PHP_PACKAGE_REPOSITORY_UNAVAILABLE; tail -n 25 "$RUNNER_TEMP/p08-r41-apt.log"; exit 1; }
          sudo apt-get update -qq >> "$RUNNER_TEMP/p08-r41-apt.log" 2>&1 || { echo P08_R41_PHP_PACKAGE_INDEX_UNAVAILABLE; tail -n 25 "$RUNNER_TEMP/p08-r41-apt.log"; exit 1; }
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nginx cron php8.4-cli php8.4-fpm php8.4-sqlite3 php8.4-mbstring php8.4-xml php8.4-zip php8.4-curl php8.4-intl >> "$RUNNER_TEMP/p08-r41-apt.log" 2>&1 || { echo P08_R41_PHP_PACKAGE_INSTALL_FAILED; tail -n 25 "$RUNNER_TEMP/p08-r41-apt.log"; exit 1; }
          test -x /usr/bin/php8.4
          test -x /usr/bin/systemctl
          test -x /usr/sbin/nginx
          test -x /usr/sbin/runuser
          echo P08_R41_REAL_PHP84_FPM_DEPENDENCIES=PASS
      - name: Prove exact source versioned runtime refuses stale PHP-FPM code
        run: |
          set -euo pipefail
          test "$(git -C private-target rev-parse HEAD)" = "$P08_TARGET_SHA"
          /usr/bin/php8.4 private-target/tests/test_versioned_fpm_runtime_identity.php
          /usr/bin/php8.4 -l private-target/src/Upgrade/UpgradeReadiness.php
          echo P08_R48_EXACT_SOURCE_FPM_IDENTITY_REGRESSION=PASS
      - name: Build real pinned Composer/Vite for both exact source versions
        run: |
          set -euo pipefail
          for d in private-flat private-bridge private-target; do
            (
              cd "$d"
              mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
              composer install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/$d-composer.log" 2>&1
              npm ci --no-audit --no-fund > "$RUNNER_TEMP/$d-npm.log" 2>&1
              npm run build
              npm run typecheck
              python3 scripts/check_stack_contract.py --phase full
            )
          done
      - name: Extract actual original flat FULL, trusted bridge FULL, 0.1.1 FULL and real Atomic
        run: |
          set -euo pipefail
          python3 private-flat/scripts/build_full.py --source private-flat --output "$RUNNER_TEMP/p08-flat-full.zip" --version 0.1.0 --source-sha "$P08_ORIGINAL_SHA"
          python3 private-bridge/scripts/build_full.py --source private-bridge --output "$RUNNER_TEMP/p08-bridge-full.zip" --version 0.1.0 --source-sha "$P08_BRIDGE_SHA"
          python3 private-target/scripts/build_full.py --source private-target --output "$RUNNER_TEMP/p08-target-full.zip" --version 0.1.1 --source-sha "$P08_TARGET_SHA"
          mkdir "$RUNNER_TEMP/p08-original-flat-installed" "$RUNNER_TEMP/p08-bridge-extracted" "$RUNNER_TEMP/p08-target-extracted"
          unzip -qq "$RUNNER_TEMP/p08-flat-full.zip" -d "$RUNNER_TEMP/p08-original-flat-installed"
          unzip -qq "$RUNNER_TEMP/p08-bridge-full.zip" -d "$RUNNER_TEMP/p08-bridge-extracted"
          unzip -qq "$RUNNER_TEMP/p08-target-full.zip" -d "$RUNNER_TEMP/p08-target-extracted"
          SOURCE_MANIFEST_SHA=$(sha256sum "$RUNNER_TEMP/p08-bridge-extracted/FULL_MANIFEST.json" | cut -d' ' -f1)
          php -r 'require "private-bridge/src/Installation/SetupGuard.php"; foreach (array_slice($argv,1) as $root) VF\AdOps\Installation\SetupGuard::package($root); echo "P08_R35_TRIPLE_REAL_EXTRACTED_FULL_INTEGRITY=PASS\n";' "$RUNNER_TEMP/p08-original-flat-installed" "$RUNNER_TEMP/p08-bridge-extracted" "$RUNNER_TEMP/p08-target-extracted"
          python3 private-target/scripts/build_atomic.py --source private-target --output "$RUNNER_TEMP/p08-0.1.1-Atomic.zip" --source-version 0.1.0 --source-sha "$P08_BRIDGE_SHA" --source-full-manifest-sha256 "$SOURCE_MANIFEST_SHA" --target-version 0.1.1 --target-sha "$P08_TARGET_SHA" > "$RUNNER_TEMP/p08-atomic-metadata.json"
          echo "P08_R35_ORIGINAL_FULL_SHA256=$(sha256sum "$RUNNER_TEMP/p08-flat-full.zip" | cut -d' ' -f1)"
          echo "P08_R35_COMPAT_BRIDGE_FULL_SHA256=$(sha256sum "$RUNNER_TEMP/p08-bridge-full.zip" | cut -d' ' -f1)"
          echo "P08_R35_TARGET_FULL_SHA256=$(sha256sum "$RUNNER_TEMP/p08-target-full.zip" | cut -d' ' -f1)"
          echo "P08_R35_TARGET_ATOMIC_SHA256=$(sha256sum "$RUNNER_TEMP/p08-0.1.1-Atomic.zip" | cut -d' ' -f1)"
          echo "P08_R35_TRUSTED_BRIDGE_MANIFEST_SHA256=$SOURCE_MANIFEST_SHA"
      - name: Prove off-site V2 publisher signature on actual Atomic and tampered ZIP denial
        run: |
          set -euo pipefail
          php -l private-target/scripts/sign_atomic_release_offer.php
          grep -Fq 'PUBLIC_KEY_HEX = null' private-bridge/src/Upgrade/UpdateAuthority.php
          grep -Fq 'PUBLIC_KEY_HEX = null' private-target/src/Upgrade/UpdateAuthority.php
          # PUBLIC SYNTHETIC TEST seed ONLY; no real publisher signing key used.
          php -r '$pair=sodium_crypto_sign_seed_keypair(str_repeat(chr(77),SODIUM_CRYPTO_SIGN_SEEDBYTES)); echo bin2hex(sodium_crypto_sign_secretkey($pair))."\n";' |
            php private-target/scripts/sign_atomic_release_offer.php \
              "$RUNNER_TEMP/p08-0.1.1-Atomic.zip" "$RUNNER_TEMP/p08-bridge-extracted/FULL_MANIFEST.json" \
              "$(( $(date +%s) + 3600 ))" "$RUNNER_TEMP/p08-r43-signed"
          php -r '
            $raw=file_get_contents($argv[1]);
            $sig=hex2bin(trim(file_get_contents($argv[2])));
            $pair=sodium_crypto_sign_seed_keypair(str_repeat(chr(77),SODIUM_CRYPTO_SIGN_SEEDBYTES));
            if(!sodium_crypto_sign_verify_detached($sig,$raw,sodium_crypto_sign_publickey($pair)))
                throw new RuntimeException("R43_SYNTHETIC_SIGNED_OFFER_INVALID");
            $x=json_decode($raw,true,16,JSON_THROW_ON_ERROR);
            if(($x["type"]??null)!=="P08_SIGNED_RELEASE_OFFER_V2"
              || array_key_exists("stage_id",$x)
              || array_key_exists("stage_receipt_sha256",$x)
              || ($x["source_sha"]??null)!==$argv[3]
              || ($x["target_sha"]??null)!==$argv[4]
              || ($x["archive_sha256"]??null)!==hash_file("sha256",$argv[5]))
                throw new RuntimeException("R43_STATIC_PACKAGE_IDENTITY_INVALID");
            echo "P08_R43_REAL_ATOMIC_STATIC_V2_PUBLISHER_SIGNATURE=PASS\n";
          ' "$RUNNER_TEMP/p08-r43-signed/approved-offer.json" "$RUNNER_TEMP/p08-r43-signed/approved-offer.sig" "$P08_BRIDGE_SHA" "$P08_TARGET_SHA" "$RUNNER_TEMP/p08-0.1.1-Atomic.zip"
          python3 - "$RUNNER_TEMP/p08-0.1.1-Atomic.zip" "$RUNNER_TEMP/p08-r43-corrupt.zip" <<'PY'
          import sys,zipfile
          with zipfile.ZipFile(sys.argv[1],"r") as inp,zipfile.ZipFile(sys.argv[2],"w") as out:
            for name in inp.namelist():
              data=inp.read(name)
              if name=="VERSION": data=b"9.9.9\n"
              out.writestr(name,data)
          PY
          set +e
          php private-target/scripts/sign_atomic_release_offer.php \
            "$RUNNER_TEMP/p08-r43-corrupt.zip" "$RUNNER_TEMP/p08-bridge-extracted/FULL_MANIFEST.json" \
            "$(( $(date +%s) + 3600 ))" "$RUNNER_TEMP/p08-r43-invalid" </dev/null > "$RUNNER_TEMP/p08-r43-negative.log" 2>&1
          code=$?
          set -e
          test "$code" -ne 0
          grep -Fq 'ATOMIC_MEMBER_DIGEST_INVALID' "$RUNNER_TEMP/p08-r43-negative.log"
          test ! -e "$RUNNER_TEMP/p08-r43-invalid"
          echo P08_R43_TAMPERED_ATOMIC_NOT_SIGNABLE=PASS
          echo P08_R43_OFFICIAL_KEY_AND_RELEASE=NOT_CONFIGURED
      - name: Start real systemd nginx cron PHP8.4 FPM on disposable runner
        run: |
          set -euo pipefail
          bash -n private-target/scripts/cloudpanel_bridge_offline_once.sh
          sudo useradd -m -s /bin/bash p08ci
          site=/home/p08ci/htdocs/adops.kewaro.com
          bridge=/home/p08ci/artifacts/bridge
          target=/home/p08ci/artifacts/target
          sudo mkdir -p "$site" "$bridge" "$target"
          sudo cp -a "$RUNNER_TEMP/p08-original-flat-installed/." "$site/"
          sudo cp -a "$RUNNER_TEMP/p08-bridge-extracted/." "$bridge/"
          sudo cp -a "$RUNNER_TEMP/p08-target-extracted/." "$target/"
          sudo chown -R p08ci:p08ci /home/p08ci
          sudo chmod 0755 /home/p08ci /home/p08ci/htdocs "$site"
          sudo tee /etc/php/8.4/fpm/pool.d/p08ci.conf > /dev/null <<'EOF'
          [p08ci]
          user = p08ci
          group = p08ci
          listen = /run/php/p08ci-fpm.sock
          listen.owner = www-data
          listen.group = www-data
          pm = ondemand
          pm.max_children = 2
          pm.process_idle_timeout = 10s
          php_admin_value[opcache.enable] = 1
          php_admin_value[opcache.validate_timestamps] = 0
          EOF
          sudo tee /etc/nginx/sites-enabled/adops.kewaro.com.conf > /dev/null <<'EOF'
          server {
            listen 127.0.0.1:18086;
            server_name adops.kewaro.com;
            root /home/p08ci/htdocs/adops.kewaro.com/public;
            index index.php;
            location / { try_files $uri $uri/ /index.php?$query_string; }
            location ~ \.php$ {
              include snippets/fastcgi-php.conf;
              fastcgi_pass unix:/run/php/p08ci-fpm.sock;
            }
          }
          EOF
          sudo nginx -t -q
          sudo systemctl restart php8.4-fpm cron nginx
          for service in php8.4-fpm cron nginx; do sudo systemctl is-active --quiet "$service"; done
          echo P08_R41_ISOLATED_NATIVE_SERVICES_STARTED=PASS
      - name: Real original FULL first Owner install with SQLite
        run: |
          set -euo pipefail
          site=/home/p08ci/htdocs/adops.kewaro.com
          db=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.sqlite
          sudo runuser -u p08ci -- /usr/bin/php8.4 -r '$conn=new SQLite3($argv[1], SQLITE3_OPEN_READWRITE|SQLITE3_OPEN_CREATE); $conn->close();' "$site/database/$db"
          sudo runuser -u p08ci -- /usr/bin/php8.4 -r '
            $site=$argv[1]; $db=$argv[2];
            require $site."/src/Support/Autoload.php";
            require $site."/vendor/autoload.php";
            (new VF\AdOps\Installation\OwnerWebInstaller())->install([
              "db_driver"=>"sqlite","db_database"=>$db,
              "owner_email"=>"owner@isolated.example",
              "owner_password"=>"Synthetic-Owner-Test-1234!",
              "owner_confirm"=>"Synthetic-Owner-Test-1234!"
            ],$site);
            if(!is_file($site."/.env") ||
               !is_file($site."/storage/app/private/adops/installation/installed.json"))
              throw new RuntimeException("R41_REAL_OWNER_INSTALL_FAILED");
          ' "$site" "$db"
          echo P08_R41_REAL_ORIGINAL_OWNER_INSTALLED=PASS
      - name: Exercise real site-user offline bridge and fresh PHP-FPM restart
        run: |
          set -euo pipefail
          site=/home/p08ci/htdocs/adops.kewaro.com
          bridge=/home/p08ci/artifacts/bridge
          target=/home/p08ci/artifacts/target
          oldfull=$(sha256sum "$site/FULL_MANIFEST.json" | cut -d' ' -f1)
          bridgefull=$(sha256sum "$bridge/FULL_MANIFEST.json" | cut -d' ' -f1)
          targetfull=$(sha256sum "$target/FULL_MANIFEST.json" | cut -d' ' -f1)
          before=$(sudo systemctl show -p MainPID --value php8.4-fpm)
          test "$before" -gt 1
          sudo bash private-target/scripts/cloudpanel_bridge_offline_once.sh \
            --apply "$site" p08ci 8.4 "$bridge" "$target" \
            "$P08_ORIGINAL_SHA" "$oldfull" "$P08_BRIDGE_SHA" "$bridgefull" \
            "$P08_TARGET_SHA" "$targetfull" > "$RUNNER_TEMP/p08-r41-cutover.log" 2>&1 \
            || { grep -E '^P08_R[0-9]+_' "$RUNNER_TEMP/p08-r41-cutover.log" || true; exit 1; }
          grep -Fq 'P08_R36_OFFLINE_BRIDGE=COMMITTED_PRE_RESTART' "$RUNNER_TEMP/p08-r41-cutover.log"
          grep -Fq 'P08_R41_FPM_FRESH_MASTER_VERIFIED=YES' "$RUNNER_TEMP/p08-r41-cutover.log"
          grep -Fq 'P08_R36_SERVICES=RESTARTED_WITH_NEW_FPM_PROCESS' "$RUNNER_TEMP/p08-r41-cutover.log"
          test "$(sudo readlink "$site/current")" = "releases/$P08_BRIDGE_SHA"
          after=$(sudo systemctl show -p MainPID --value php8.4-fpm)
          test "$after" -gt 1 && test "$after" != "$before"
          for service in php8.4-fpm cron nginx; do sudo systemctl is-active --quiet "$service"; done
          test ! -e "$site/storage/app/private/adops/maintenance/maintenance.json"
          sudo runuser -u p08ci -- /usr/bin/php8.4 -r '
            require $argv[1]."/src/Installation/SetupGuard.php";
            VF\AdOps\Installation\SetupGuard::package($argv[2]);
          ' "$target" "$site/releases/$P08_BRIDGE_SHA"
          sudo runuser -u p08ci -- grep -Fq 'P08_SIGNED_RELEASE_OFFER_V2' "$site/current/src/Upgrade/OwnerUpgradeJob.php"
          sudo runuser -u p08ci -- grep -Fq 'readiness.can_upgrade' "$site/current/resources/js/modules/updates/UpdatePanel.vue"
          echo P08_R43_COMPATIBLE_BRIDGE_CONTAINS_OWNER_SIGNED_V2_UPDATE=PASS
          echo P08_R41_SYSTEMD_NGINX_CRON_FPM_STOP_RESTART_AND_BRIDGE=PASS
          echo P08_R41_FRESH_FPM_MASTER_PROCESS=PASS
          echo P08_R41_REAL_CLOUDPANEL_HOST=NOT_PROVEN
          echo P08_R41_OWNER_CLICK_SIGNED_OFFER=NOT_PROVEN
      - name: Login synthetic Owner to real versioned HTTPS app and pin FPM master
        run: |
          set -euo pipefail
          site=/home/p08ci/htdocs/adops.kewaro.com
          test "$(sudo readlink "$site/current")" = "releases/$P08_BRIDGE_SHA"
          sudo openssl req -x509 -nodes -newkey rsa:2048 \
            -keyout /etc/ssl/private/p08-r48-local-key.pem \
            -out /etc/ssl/certs/p08-r48-local-cert.pem \
            -days 1 -subj /CN=adops.kewaro.com > /dev/null 2>&1
          sudo chmod 0600 /etc/ssl/private/p08-r48-local-key.pem
          sudo tee /etc/nginx/sites-enabled/p08-r48-local.conf > /dev/null <<'EOF'
          server {
            listen 127.0.0.1:18443 ssl;
            server_name adops.kewaro.com;
            ssl_certificate /etc/ssl/certs/p08-r48-local-cert.pem;
            ssl_certificate_key /etc/ssl/private/p08-r48-local-key.pem;
            root /home/p08ci/htdocs/adops.kewaro.com/public;
            index index.php;
            location / { try_files $uri $uri/ /index.php?$query_string; }
            location ~ \.php$ {
              include snippets/fastcgi-php.conf;
              fastcgi_pass unix:/run/php/p08ci-fpm.sock;
            }
          }
          EOF
          sudo nginx -t -q
          sudo systemctl reload nginx
          before=$(sudo systemctl show -p MainPID --value php8.4-fpm)
          test "$before" -gt 1
          echo "$before" > "$RUNNER_TEMP/p08-r48-fpm-before"
          host=adops.kewaro.com
          origin=https://$host:18443
          login_code=$(curl --noproxy '*' --resolve "$host:18443:127.0.0.1" \
            -ksS --max-time 20 -b "$RUNNER_TEMP/p08-r48-cookies" \
            -c "$RUNNER_TEMP/p08-r48-cookies" \
            -o "$RUNNER_TEMP/p08-r48-login.html" -w '%{http_code}' "$origin/login")
          test "$login_code" = 200 || { echo P08_R48_OWNER_LOGIN_PAGE_HTTP_CODE="$login_code"; exit 1; }
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlencode
          import os
          class Token(HTMLParser):
            token=None
            def handle_starttag(self,tag,attrs):
              data=dict(attrs)
              if tag=='input' and data.get('name')=='_token': self.token=data.get('value')
          root=Path(os.environ['RUNNER_TEMP'])
          t=Token()
          t.feed((root/'p08-r48-login.html').read_text())
          assert isinstance(t.token,str) and len(t.token)>20,'R48_LOGIN_FORM_TOKEN_NOT_FOUND'
          form=root/'p08-r48-login-form'
          form.write_text(urlencode({'_token':t.token,'email':'owner@isolated.example',
                                     'password':'Synthetic-Owner-Test-1234!'}))
          form.chmod(0o600)
          PY
          login_post=$(curl --noproxy '*' --resolve "$host:18443:127.0.0.1" \
            -ksS --max-time 20 -b "$RUNNER_TEMP/p08-r48-cookies" \
            -c "$RUNNER_TEMP/p08-r48-cookies" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-binary "@$RUNNER_TEMP/p08-r48-login-form" \
            -D "$RUNNER_TEMP/p08-r48-login-post-headers" \
            -o /dev/null -w '%{http_code}' "$origin/login")
          test "$login_post" = 302 || { echo P08_R48_OWNER_LOGIN_POST_HTTP_CODE="$login_post"; exit 1; }
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          import os
          hdr=Path(os.environ['RUNNER_TEMP']+'/p08-r48-login-post-headers').read_text()
          paths=[urlparse(x.split(':',1)[1].strip()).path for x in hdr.splitlines()
                 if x.lower().startswith('location:')]
          print('P08_R48_LOGIN_REDIRECT_PATH='+(paths[-1] if paths else 'MISSING'))
          PY
          # Use Inertia's official JSON representation rather than parsing
          # the HTML data-page attribute (which has escaping/encoding semantics).
          # Inertia 3 compares X-Inertia-Version with the xxh128 hash of the
          # active release's Vite manifest. Without this header a GET returns
          # protocol-correct 409, NOT a PHP-FPM failure.
          old_asset_version=$(sudo runuser -u p08ci -- /usr/bin/php8.4 -r 'echo hash_file("xxh128", $argv[1]);' "$site/releases/$P08_BRIDGE_SHA/public/build/manifest.json")
          test "${#old_asset_version}" -eq 32
          old_code=$(curl --noproxy '*' --resolve "$host:18443:127.0.0.1" \
            -ksS --max-time 20 -b "$RUNNER_TEMP/p08-r48-cookies" \
            -c "$RUNNER_TEMP/p08-r48-cookies" \
            -H 'X-Inertia: true' -H 'X-Requested-With: XMLHttpRequest' \
            -H "X-Inertia-Version: $old_asset_version" \
            -H 'Accept: application/json' \
            -o "$RUNNER_TEMP/p08-r48-old-app.json" -w '%{http_code}' "$origin/app")
          test "$old_code" = 200 || { echo P08_R49_OLD_INERTIA_STATUS="$old_code"; exit 1; }
          python3 - <<'PY'
          from pathlib import Path
          import json, os
          root=Path(os.environ['RUNNER_TEMP'])
          page=json.loads((root/'p08-r48-old-app.json').read_text())
          assert page.get('component')=='Workspace','R49_EXPECT_OLD_INERTIA_WORKSPACE'
          item=page['props']['initial']['upgrade']
          assert item['version']=='0.1.0','R49_EXPECT_BRIDGE_VERSION'
          assert item['source_short']==os.environ['P08_BRIDGE_SHA'][:12], 'R49_EXPECT_BRIDGE_SHA'
          print('P08_R49_OLD_ACTUAL_INERTIA_JSON_SOURCE=PASS')
          PY
      - name: Prepare real publisher-signed Atomic with native SQLite backup and run deferred Worker
        run: |
          set -euo pipefail
          site=/home/p08ci/htdocs/adops.kewaro.com
          archive="$RUNNER_TEMP/p08-0.1.1-Atomic.zip"
          pub="$RUNNER_TEMP/p08-r43-signed"
          sudo install -o p08ci -g p08ci -m 0600 "$archive" /home/p08ci/artifacts/r45-update.zip
          sudo install -o p08ci -g p08ci -m 0600 "$pub/approved-offer.json" /home/p08ci/artifacts/r45-offer.json
          sudo install -o p08ci -g p08ci -m 0600 "$pub/approved-offer.sig" /home/p08ci/artifacts/r45-offer.sig
          sudo runuser -u p08ci -- /usr/bin/php8.4 -r '
            $root=$argv[1];
            require $root."/current/src/Support/Autoload.php";
            require $root."/current/vendor/autoload.php";
            $pair=sodium_crypto_sign_seed_keypair(str_repeat(chr(77),SODIUM_CRYPTO_SIGN_SEEDBYTES));
            $pub=bin2hex(sodium_crypto_sign_publickey($pair));
            $job=new VF\AdOps\Upgrade\OwnerUpgradeJob($pub);
            // On a newly bridged site the private upgrade ledger is created
            // only by first preparation; absence is the correct safe state.
            if(is_file($root."/storage/app/private/adops/upgrade/owner-job.json"))
              throw new RuntimeException("R45_INITIAL_JOB_NOT_NONE");
            $preparer=new VF\AdOps\Upgrade\SignedCandidatePreparation($pub);
            $result=$preparer->prepare($root,$argv[2],$argv[3],$argv[4]);
            if(($result["status"]??null)!=="SIGNED_CANDIDATE_PREPARED_NO_SWITCH")
              throw new RuntimeException("R45_PREPARE_NOT_READY");
            if(readlink($root."/current")!=="releases/".$argv[5])
              throw new RuntimeException("R45_PREPARATION_SWITCHED_CODE");
            $ready=$job->inspectApprovedOffer($root);
            if(($ready["target_sha"]??null)!==$argv[6])
              throw new RuntimeException("R45_SIGNED_OFFER_NOT_READY");
            $record=$job->submit($root,"owner1");
            if(($record["status"]??null)!=="PENDING")
              throw new RuntimeException("R45_OWNER_INTENT_NOT_PENDING");
            if(readlink($root."/current")!=="releases/".$argv[5])
              throw new RuntimeException("R45_PENDING_CHANGED_RELEASE");
            $worked=$job->work($root);
            if(($worked["status"]??null)!=="SUCCEEDED" ||
                readlink($root."/current")!=="releases/".$argv[6])
              throw new RuntimeException("R45_ATOMIC_WORKER_NOT_COMMITTED");
            echo "P08_R45_REAL_SIGNED_ARCHIVE_NATIVE_SQLITE_BACKUP_STAGE=PASS\n";
            echo "P08_R45_OWNER_REQUEST_DEFERRED_ATOMIC_POINTER=PASS\n";
          ' "$site" /home/p08ci/artifacts/r45-update.zip \
              /home/p08ci/artifacts/r45-offer.json /home/p08ci/artifacts/r45-offer.sig \
              "$P08_BRIDGE_SHA" "$P08_TARGET_SHA"
          sudo runuser -u p08ci -- /usr/bin/php8.4 -r '
            require $argv[1]."/src/Installation/SetupGuard.php";
            VF\AdOps\Installation\SetupGuard::package($argv[1]);
            echo "P08_R45_TARGET_IMMUTABLE_FULL=PASS\n";
          ' "$site/releases/$P08_TARGET_SHA"
          # Query the actual same-session Owner workbench through the same
          # live PHP-FPM master, with OPcache timestamp validation disabled.
          after=$(sudo systemctl show -p MainPID --value php8.4-fpm)
          test "$after" -gt 1
          test "$after" = "$(cat "$RUNNER_TEMP/p08-r48-fpm-before")"
          host=adops.kewaro.com
          origin=https://$host:18443
          # GitHub Actions steps are isolated shells. Re-read the exact
          # immutable bridge asset version; never persist browser cookies or
          # reuse a shell variable from the previous step.
          old_asset_version=$(sudo runuser -u p08ci -- /usr/bin/php8.4 -r 'echo hash_file("xxh128", $argv[1]);' "$site/releases/$P08_BRIDGE_SHA/public/build/manifest.json")
          test "${#old_asset_version}" -eq 32
          new_asset_version=$(sudo runuser -u p08ci -- /usr/bin/php8.4 -r 'echo hash_file("xxh128", $argv[1]);' "$site/releases/$P08_TARGET_SHA/public/build/manifest.json")
          test "${#new_asset_version}" -eq 32
          test "$old_asset_version" != "$new_asset_version"
          # Old tabs must receive Inertia 409 after a new immutable build.
          stale_code=$(curl --noproxy '*' --resolve "$host:18443:127.0.0.1" \
            -ksS --max-time 20 -b "$RUNNER_TEMP/p08-r48-cookies" \
            -H 'X-Inertia: true' -H 'X-Requested-With: XMLHttpRequest' \
            -H "X-Inertia-Version: $old_asset_version" \
            -H 'Accept: application/json' \
            -o /dev/null -w '%{http_code}' "$origin/app")
          test "$stale_code" = 409 || { echo P08_R49_STALE_ASSET_VERSION_NOT_REFUSED="$stale_code"; exit 1; }
          echo P08_R49_OLD_TAB_ASSET_VERSION_409=PASS
          new_code=$(curl --noproxy '*' --resolve "$host:18443:127.0.0.1" \
            -ksS --max-time 20 -b "$RUNNER_TEMP/p08-r48-cookies" \
            -c "$RUNNER_TEMP/p08-r48-cookies" \
            -H 'X-Inertia: true' -H 'X-Requested-With: XMLHttpRequest' \
            -H "X-Inertia-Version: $new_asset_version" \
            -H 'Accept: application/json' \
            -o "$RUNNER_TEMP/p08-r48-new-app.json" -w '%{http_code}' "$origin/app")
          test "$new_code" = 200 || { echo P08_R49_NEW_INERTIA_STATUS="$new_code"; exit 1; }
          python3 - <<'PY'
          from pathlib import Path
          import json, os
          root=Path(os.environ['RUNNER_TEMP'])
          page=json.loads((root/'p08-r48-new-app.json').read_text())
          assert page.get('component')=='Workspace','R49_EXPECT_NEW_INERTIA_WORKSPACE'
          item=page['props']['initial']['upgrade']
          assert item['version']=='0.1.1','R49_NEW_FPM_VERSION_MISMATCH'
          assert item['source_short']==os.environ['P08_TARGET_SHA'][:12],'R49_NEW_FPM_SHA_MISMATCH'
          assert item['job_status']=='SUCCEEDED','R49_CLI_WORKER_STATUS_MISMATCH'
          assert item['can_upgrade'] is False,'R49_NEW_VERSION_SHOULD_NOT_STILL_OFFER_APPLY'
          print('P08_R49_NEW_ACTUAL_INERTIA_JSON_SOURCE_AND_JOB=PASS')
          PY
          sudo systemctl is-active --quiet php8.4-fpm
          sudo systemctl is-active --quiet nginx
          echo P08_R49_SAME_FPM_PID_OPCACHE_VALIDATE_TIMESTAMPS_0=PASS
          echo P08_R49_IMMUTABLE_CODE_ONLY_ATOMIC_NO_ROOT_RESTART_IN_ISOLATION=PASS
          echo P08_R49_CLOUDPANEL_PRODUCTION=NOT_PROVEN
          echo P08_R45_REAL_BROWSER_AUTH_REQUEST=NOT_PROVEN
          echo P08_R45_REAL_RELEASE_SIGNER_CONFIGURED=NO
      - name: Erase private checkout, temporary synthesized Owner data, ZIPs and logs
        if: always()
