name: P07 #293 isolated Owner SSH candidate installer proof
on:
  pull_request:
    paths: ['.github/workflows/p07-293-ssh-candidate.yml']
permissions:
  contents: read
jobs:
  one-off:
    if: ${{ github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact private script candidate only in ephemeral workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 8841ac80ee0730b1ce17739adeed15a063bbb74c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
          fetch-depth: 0
      - name: Checkout exact public release115 immutable baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 7c3f685465b0da9a4414a13b629ea599006019ae
          persist-credentials: false
          path: public-baseline
          fetch-depth: 1
      - name: Shell syntax, isolated first install, idempotent fail-closed repeat
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C product rev-parse HEAD)" = 8841ac80ee0730b1ce17739adeed15a063bbb74c
          cp product/scripts/p07-owner-rc293-isolated-install.sh "$RUNNER_TEMP/p07-owner-installer.sh"
          bash -n "$RUNNER_TEMP/p07-owner-installer.sh"
          export P07_RC293_TEST_MODE=1
          export P07_RC293_TEST_PRODUCT="$PWD/product"
          export P07_RC293_TEST_PUBLIC="$PWD/public-baseline"
          export P07_RC293_TEST_TARGET="$RUNNER_TEMP/p07-rc293-candidate-tree"
          export P07_RC293_TEST_LINK="$RUNNER_TEMP/p07-rc293-bin/vfops-rc293"
          bash "$RUNNER_TEMP/p07-owner-installer.sh" >"$RUNNER_TEMP/p07-receipt.txt" 2>&1 || {
            cat "$RUNNER_TEMP/p07-receipt.txt"
            exit 1
          }
          grep -Fx 'P07_RC293_ISOLATED_INSTALL=PASS' "$RUNNER_TEMP/p07-receipt.txt"
          grep -Fx 'P07_RC293_MIGRATION_NOT_AUTO_STARTED=YES' "$RUNNER_TEMP/p07-receipt.txt"
          grep -Fx 'P07_RC293_DNS_AND_DATABASE_WRITES=NONE' "$RUNNER_TEMP/p07-receipt.txt"
          test "$("$P07_RC293_TEST_LINK" --build-id)" = "0.1.0-release116-rc1"
          test "$(git -C product rev-parse HEAD)" = "942bd9072f0f99519008b1d0610cc86309593cab"
          test ! -e "$P07_RC293_TEST_TARGET.previous"
          set +e
          bash "$RUNNER_TEMP/p07-owner-installer.sh" >"$RUNNER_TEMP/p07-repeat.txt" 2>&1
          rc=$?
          set -e
          test "$rc" -eq 13
          grep -F 'P07_RC293_BLOCKED=ISOLATED_CANDIDATE_SLOT_ALREADY_EXISTS' "$RUNNER_TEMP/p07-repeat.txt"
          test "$("$P07_RC293_TEST_LINK" --build-id)" = "0.1.0-release116-rc1"
          "$P07_RC293_TEST_LINK" server-migrate laravel-live-parity --help | grep -F -- '--domain'
          echo 'P07_RC293_OWNER_SSH_INSTALLER_EXACT_SOURCE_ISOLATED_PASS'
          echo 'P07_RC293_OWNER_SSH_CANDIDATE_REINSTALL_REJECTED_PASS'
      - name: Always remove private checkout, candidate install and all receipts
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- product public-baseline
          rm -rf -- "$RUNNER_TEMP/p07-rc293-candidate-tree" "$RUNNER_TEMP/p07-rc293-bin"
          rm -f -- "$RUNNER_TEMP/p07-owner-installer.sh" "$RUNNER_TEMP/p07-receipt.txt" "$RUNNER_TEMP/p07-repeat.txt"
          echo 'P07_RC293_PRIVATE_SOURCE_AND_TEST_INSTALL_CLEANED=PASS'
