name: P02 V2.5.121 Formal Release Publish

on:
  push:
    branches:
      - run/p02-v25121-release-publish-20260925
    paths:
      - '.github/workflows/p02-v25121-release-publish.yml'
      - 'requests/p02-v25121-formal-release.sh'

permissions:
  contents: read

jobs:
  release-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout runner carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner

      - name: Checkout exact P02 V2.5.121 main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: df8505cd8e82042c6e9636b2ceb22c742743e14f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product

      - name: Publish formal release and remote readback
        env:
          VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: bash runner/requests/p02-v25121-formal-release.sh
