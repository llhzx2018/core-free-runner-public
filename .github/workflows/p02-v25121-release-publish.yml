name: P02 V2.5.124 Formal Release Publish

on:
  push:
    branches:
      - run/p02-v25124-release-publish-20260926
    paths:
      - '.github/workflows/p02-v25121-release-publish.yml'
      - 'requests/p02-v25121-formal-release.sh'

permissions:
  contents: read

jobs:
  release-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout runner carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner

      - name: Checkout exact P02 V2.5.124 main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 913a8e38c9162c3455859e3b3f3db9095c44dd90
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product

      - name: Publish formal release and remote readback
        env:
          VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: bash runner/requests/p02-v25121-formal-release.sh
