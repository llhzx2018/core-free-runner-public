name: P07 PR293 Versioned Laravel final rsync credential protection proof
on:
  pull_request:
    paths: ['.github/workflows/p07-pr293-final-shared-config-rsync.yml']
permissions:
  contents: read
jobs:
  p07-exact-versioned-rsync:
    if: ${{ github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact P07 source into disposable workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 38d2a8831d7855afa4dfdd007614b4a0546d72dd
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p07-exact
          fetch-depth: 1
      - name: Isolated real rsync and bounded tests only
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd p07-exact
          test "$(git rev-parse HEAD)" = 38d2a8831d7855afa4dfdd007614b4a0546d72dd
          export PYTHONDONTWRITEBYTECODE=1
          command -v rsync >/dev/null || { echo 'ISOLATED_RSYNC_UNAVAILABLE'; exit 78; }
          bash -n bin/vfops-migrate-ui
          python3 -B -m unittest -q tests.test_migration_versioned_laravel_p07 tests.test_migration_failed_prepare_audit
          echo 'P07_PR293_EXACT_SOURCE_REAL_RSYNC_SHARED_ENV_RETAINED_NEW_RELEASE_SYMLINK_PASS'
      - name: Private source cleanup
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- p07-exact
          echo 'P07_PR293_TEMPORARY_SOURCE_REMOVED'
