name: P01 V2.37.4 Legacy IYF Diagnostic
on:
  push:
    branches: [diagnostic/p01-v2374-legacy-iyf-20260902]
    paths:
      - .github/workflows/p01-v2374-legacy-iyf-diag-20260902.yml
      - scripts/p01_v2374_legacy_iyf_diag.sh
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: diagnostic/p01-v2374-legacy-iyf-20260902
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: main
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          path: product
      - name: Exact version fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(cat product/VERSION)" = 2.37.4
          grep -F "define('VF_VERSION', '2.37.4')" product/src/app/bootstrap.php >/dev/null
      - name: Replay exact historical IYF record
        shell: bash
        run: bash runner/scripts/p01_v2374_legacy_iyf_diag.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-v2374-legacy-iyf-${{ github.run_id }}
          path: /tmp/p01-v2374-legacy-iyf-evidence
          if-no-files-found: warn
          retention-days: 30
