name: S01-C01 eight-page integration formal release
on:
  push:
    branches: [task/s01-c01-preview98-20261006-formal]
permissions:
  contents: read
  actions: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_REPO: 'llhzx2018/vf-tools-theme'
      TARGET_VERSION: '1.35.98'
      TARGET_SHA: '56543e1fca4d3e78ab16e5222660b160688dfac6'
      TARGET_TREE: '0a71ee527d90362994c40114ba3fa1b74b80dc44'
      SOURCE_VERSION: '1.35.97'
      CANDIDATE_RUN: '37486559521'
      CANDIDATE_SHA: 'fa94e801c5bfa73ca5119524404e0787b341d971'
      CANDIDATE_RUNNER_SHA: '88b112d17c907ffebdb50f23465bb2ddc268c270'
      CANDIDATE_ARTIFACT_ID: '11423103663'
      CANDIDATE_ARTIFACT_DIGEST: 'sha256:1f5f07a39e2f00465c48ed25a856cf6626316bc8056fd1fa317fac86d8530fb7'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runner
          persist-credentials: false
      - name: Target-owned formal lane identity preflight
        run: |
          set -Eeuo pipefail
          mkdir -p proof
          python3 runner/scripts/ephemeral_lane_spec.py render --spec runner/lanes/s01-c01-preview98-20261006/formal-spec.json --template runner/lanes/s01-c01-preview98-20261006/formal.template.yml --output /tmp/preview-formal-rendered.yml >/dev/null
          cmp /tmp/preview-formal-rendered.yml runner/.github/workflows/s01-c01-preview98-20261006-formal.yml
          python3 runner/scripts/ephemeral_lane_spec.py audit-rendered --spec runner/lanes/s01-c01-preview98-20261006/formal-spec.json --input runner/.github/workflows/s01-c01-preview98-20261006-formal.yml > proof/formal-lane-identity-audit.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Reverse verify exact tested tree and rebuilt bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$CANDIDATE_RUN --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$CANDIDATE_RUN --jq .head_sha)" = "$CANDIDATE_RUNNER_SHA"
          gh api "repos/llhzx2018/core-free-runner-public/actions/artifacts/$CANDIDATE_ARTIFACT_ID" > /tmp/tested-artifact-meta.json
          gh api "repos/llhzx2018/core-free-runner-public/actions/artifacts/$CANDIDATE_ARTIFACT_ID/zip" > /tmp/tested-artifact.zip
          python3 - <<'PYARTIFACT'
          import os,json,pathlib,hashlib,zipfile,stat
          meta=json.loads(pathlib.Path('/tmp/tested-artifact-meta.json').read_text())
          data=pathlib.Path('/tmp/tested-artifact.zip').read_bytes()
          assert meta['id']==int(os.environ['CANDIDATE_ARTIFACT_ID']) and meta['workflow_run']['id']==int(os.environ['CANDIDATE_RUN'])
          assert meta['workflow_run']['head_sha']==os.environ['CANDIDATE_RUNNER_SHA'] and not meta['expired']
          assert meta['digest']==os.environ['CANDIDATE_ARTIFACT_DIGEST']=='sha256:'+hashlib.sha256(data).hexdigest()
          assert meta['size_in_bytes']==len(data)
          with zipfile.ZipFile('/tmp/tested-artifact.zip') as z:
              assert z.testzip() is None
              names=z.namelist();assert len(names)==len(set(names))
              for entry in z.infolist():
                  p=pathlib.PurePosixPath(entry.filename)
                  assert not p.is_absolute() and '..' not in p.parts and '\\' not in entry.filename and not stat.S_ISLNK(entry.external_attr>>16)
                  assert p.suffix in ['.json','.png']
                  if p.suffix=='.json':json.loads(z.read(entry))
              z.extractall('tested')
          PYARTIFACT
          python3 - <<'PYGATE'
          import json,pathlib,os
          p=pathlib.Path('tested/proof');d=json.loads((p/'FINAL_EVIDENCE.json').read_text());v=json.loads((p/'preview/live-browser.json').read_text());r=json.loads((p/'diagnostic-regression.json').read_text())
          assert d['status']=='PASS' and d['source_sha']==os.environ['CANDIDATE_SHA'] and d['source_tree']==os.environ['TARGET_TREE'] and d['version']==os.environ['TARGET_VERSION']
          assert d['upgrade']==d['source_rollback']==d['reapply']==d['clean_install']=='PASS' and d['data_checks']>=44 and d['cross_page_cases']>=15
          assert d['security_boundary']==d['frozen_shell_header_menu']=='PASS' and d['diagnostic_regression']==d['expectation_regression']==d['surface_regression']=='PASS'
          h=json.loads((p/'expectation-regression.json').read_text());s=json.loads((p/'surface-regression.json').read_text())
          assert h['status']==s['status']=='PASS' and len(h['cases'])==4
          assert all(c['baseline']=='PASS' and c['missing']==c['wrong_target']=='FAIL_PRESERVED' and len(c['expected'])>=2 for c in h['cases'])
          assert h['system_negative']=='FAIL_PRESERVED'
          assert s['surface']['baseline']['header']['status']==s['surface']['baseline']['active']['status']=='PASS'
          assert s['surface']['black']['header']['status']==s['surface']['transparentBlack']['header']['status']==s['surface']['arbitrary']['active']['status']=='FAIL'
          assert len(s['labels'])==3 and all(r['width']>38 and r['scrollWidth']<=r['clientWidth']+4 and round(r['stepWidth'])==38 for r in s['labels'])
          assert v['status']=='PASS' and len(v['checks'])==6 and v['workflow_cases']>=16 and r['status']=='PASS'
          assert r['css']['baseline']['status']=='PASS' and r['css']['duplicate']['status']==r['css']['missing']['status']=='FAIL'
          assert r['clipped']['hidden']==r['clipped']['before'] and r['clipped']['visible']==r['clipped']['before']+1
          e=json.loads((p/'preview/engine-diagnostic.json').read_text());live=next(x for x in e['runs'] if x['mode']=='live_roundtrip');assert live['browser']['blockingProbeCount']==0 and live['browser']['unsafeLinkCount']==3;assert next(x for x in live['browser']['pages'] if x['targetKey']=='page_type:basic_page')['breakpoints'][0]['unsafeLinkCount']==1
          assert any(x['verdict']=='fail' for x in d['preview_engine_verdicts']), 'real content failures disappeared'
          PYGATE
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          cp -a runner/lanes/s01-c01-preview98-20261006 lane
          python3 lane/build.py
          python3 - <<'PY'
          import json,pathlib
          tested=json.loads(pathlib.Path('tested/proof/FINAL_EVIDENCE.json').read_text()); built=json.loads(pathlib.Path('proof/identity.json').read_text())
          for key in ['asset','asset_bytes','asset_sha256','source_tree','version']: assert tested[key]==built[key],key
          PY
      - name: Publish private formal Release and exact remote readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          ASSET="vf-tools-theme_V${TARGET_VERSION}.zip"; TAG="v$TARGET_VERSION"
          cat > /tmp/release-notes.md <<EOF
          VF Tools Theme V$TARGET_VERSION

          修复页面预览 hreflang 核对的语言依赖遗漏，使后台与前台复用既有语言登记；Header 探针读取透明容器实际显示的背景；导航选中态识别既有浅色 Token；恢复搜索关键词标签不再被步骤圆标样式压成38px。
          Exact candidate Run: $CANDIDATE_RUN。正常/缺失/错误语言链接、系统页错误注入、正常/黑色Header、透明Header黑底、任意错误导航背景正反例通过；关键词标签三种宽度无溢出，步骤圆标保持38px。预览控件六种宽度、各模式与暂停恢复停止、权限/nonce/签名/冲突检查通过。干净安装、$SOURCE_VERSION→$TARGET_VERSION原生升级/回退/再应用、44项恢复数据检查和16条连续跨页前台生效检查通过。
          未改Shell/Header/Header Menu、鉴权、Schema、Updater及数据边界。预览引擎的真实内容/404等失败项原样保留；不代表所有前台内容或Production验收PASS。Production由OWNER手工升级，OWNER真实使用为后置验收，独立Preview Runtime按SSOT为N_A。
          Exact promoted source: $TARGET_SHA; tree: $TARGET_TREE。
          EOF
          if gh release view "$TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            test "$(gh api repos/$TARGET_REPO/git/ref/tags/$TAG --jq .object.sha)" = "$TARGET_SHA"
          else
            gh release create "$TAG" "proof/$ASSET" --repo "$TARGET_REPO" --target "$TARGET_SHA" --title "VF Tools Theme V$TARGET_VERSION" --notes-file /tmp/release-notes.md
          fi
          gh api "repos/$TARGET_REPO/releases/tags/$TAG" > proof/remote-release.json
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/$TAG --jq .object.sha)" = "$TARGET_SHA"
          mkdir readback
          gh release download "$TAG" --repo "$TARGET_REPO" --pattern "$ASSET" --dir readback
          cmp "proof/$ASSET" "readback/$ASSET"
          python3 - <<'PY'
          import json,pathlib,os
          p=pathlib.Path('proof'); m=json.loads((p/'identity.json').read_text());r=json.loads((p/'remote-release.json').read_text());t=json.loads(pathlib.Path('tested/proof/FINAL_EVIDENCE.json').read_text());assert not r['draft'] and not r['prerelease'];a=[a for a in r['assets'] if a['name']==m['asset']];assert len(a)==1 and a[0]['size']==m['asset_bytes'] and a[0]['digest']=='sha256:'+m['asset_sha256'];m.update(release_id=r['id'],asset_id=a[0]['id'],released_at=r['published_at'],runtime_files=t['runtime_files'],runtime_fingerprint=t['runtime_fingerprint'],candidate_run=os.environ['CANDIDATE_RUN'],upgrade_run=os.environ['CANDIDATE_RUN'],formal_release='PASS',remote_readback='PASS',distribution='NOT_EXECUTED',production='NOT_EXECUTED');(p/'RELEASE_RECEIPT.json').write_text(json.dumps(m,indent=2));print(json.dumps(m))
          PY
      - name: Public-safe receipt
        id: receipt_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c01-preview-release-${{ github.run_id }}
          path: proof/RELEASE_RECEIPT.json
          retention-days: 30
          if-no-files-found: error

      - name: Read back actual formal receipt ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT_ARTIFACT_ID: ${{ steps.receipt_artifact.outputs.artifact-id }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$RECEIPT_ARTIFACT_ID" > /tmp/formal-receipt-meta.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$RECEIPT_ARTIFACT_ID/zip" > /tmp/formal-receipt.zip
          python3 - <<'PYRECEIPT'
          import os,json,pathlib,hashlib,zipfile
          meta=json.loads(pathlib.Path('/tmp/formal-receipt-meta.json').read_text())
          data=pathlib.Path('/tmp/formal-receipt.zip').read_bytes()
          digest='sha256:'+hashlib.sha256(data).hexdigest()
          assert meta['id']==int(os.environ['RECEIPT_ARTIFACT_ID']) and meta['workflow_run']['id']==int(os.environ['GITHUB_RUN_ID'])
          assert meta['workflow_run']['head_sha']==os.environ['GITHUB_SHA']
          assert not meta['expired'] and meta['digest']==digest and meta['size_in_bytes']==len(data)
          with zipfile.ZipFile('/tmp/formal-receipt.zip') as z:
              assert z.testzip() is None and z.namelist()==['RELEASE_RECEIPT.json']
              actual=json.loads(z.read('RELEASE_RECEIPT.json'))
              expected=json.loads(pathlib.Path('proof/RELEASE_RECEIPT.json').read_text())
              assert actual==expected and actual['source_sha']==os.environ['TARGET_SHA'] and actual['source_tree']==os.environ['TARGET_TREE'] and actual['formal_release']==actual['remote_readback']=='PASS'
          print('VF_FORMAL_AUDIT_BEGIN')
          print(pathlib.Path('proof/formal-lane-identity-audit.json').read_text())
          print('VF_FORMAL_AUDIT_END')
          print('VF_FORMAL_RECEIPT_BEGIN')
          print(json.dumps(actual))
          print('VF_FORMAL_RECEIPT_END')
          print('VF_FORMAL_ARTIFACT_BEGIN')
          print(json.dumps({'status':'PASS','id':meta['id'],'run_id':int(os.environ['GITHUB_RUN_ID']),'bytes':len(data),'digest':digest,'crc':'PASS','json_readback':'PASS'}))
          print('VF_FORMAL_ARTIFACT_END')
          PYRECEIPT
      - name: Private workspace cleanup
        if: always()
        run: rm -rf target readback proof/*.zip

