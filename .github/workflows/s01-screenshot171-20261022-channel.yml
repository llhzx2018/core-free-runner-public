name: S01 exact Theme channel contract
on:
  push:
    branches: [task/s01-screenshot171-20261022]
    paths: ['.github/workflows/s01-screenshot171-20261022-channel.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.171
  TARGET_SHA: 901bf21866254912c6814df4b918f9641911570f
  UPDATE_SHA: d0fe180865e6abdb9a0c0a989c6533ebf46d4083
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: d0fe180865e6abdb9a0c0a989c6533ebf46d4083
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Exact changed manifest and native protocol tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PYCHANNEL'
          import json,os
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']==os.environ['TARGET_VERSION']
          assert m['asset_sha256']=='31dae5e044b0e4c9d2c04e17b43b396db3a75913012d7c60bd807700c5010fab' and m['asset_bytes']==1972269
          assert m['runtime_files']==476 and '1.35.170' in m['from_versions']
          assert m['release_tag']=='v'+os.environ['TARGET_VERSION']
          print('EXACT_CHANNEL_CONTRACT_PASS')
          PYCHANNEL
      - name: Cleanup
        if: always()
        run: rm -rf source
