name: P03 V1.36.0 Integrated Product Feel Micro Polish
on:
  push:
    branches: [p03-v1360-runtime-integration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      EXPECTED_HEAD: b8bf788bc1e0b5771d7b03cda0c49c7d7c10b0d6
    steps:
      - name: Apply Chinese-first and mobile product-feel corrections
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WRITE_TOKEN:-}"
          git clone --quiet --branch integration/v1.36.0-product-experience --single-branch "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/vf-forge.git" p03
          cd p03
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              assert s.count(old)==1, f'{path}: anchor count {s.count(old)} for {old!r}'
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          # Product service: humanize event types and search result title.
          replace_once('src/app/ExperienceService.php',
              "return match($t){'DECISION','APPROVAL','RULE','SEAL','GATE'=>'重要决定','RELEASE'=>'版本 / 发布变化','SYNC'=>'来源同步','OBSERVED'=>'项目观察',default=>$type!==''?$type:'项目变化'};",
              "return match($t){'DECISION','APPROVAL','RULE','SEAL','GATE'=>'重要决定','RELEASE'=>'版本 / 发布变化','VERSION'=>'版本变化','STATUS'=>'状态变化','BLOCK'=>'阻断变化','NEXT_ACTION'=>'下一步变化','MILESTONE'=>'里程碑','SYNC'=>'来源同步','OBSERVED'=>'项目观察',default=>$type!==''?$type:'项目变化'};")
          replace_once('src/app/ExperienceService.php',
              "'title'=>(string)($r['event_type']?:'项目变化'),'summary'=>(string)$r['event_text']",
              "'title'=>$this->eventTitle((string)($r['event_type']??'')),'summary'=>(string)$r['event_text']")

          # UI strings: Chinese-first without translating genuine technical entity names.
          js=Path('public/assets/experience.js'); s=js.read_text(encoding='utf-8')
          pairs=[
            ('<div class="eyebrow">GLOBAL CONTEXT</div>','<div class="eyebrow">全局上下文</div>'),
            ('<div class="eyebrow">GLOBAL SEARCH</div>','<div class="eyebrow">全局搜索</div>'),
            ('Evidence / 正式来源','证据 / 正式来源'),
            ('打开 Evidence / 正式来源','打开证据 / 正式来源'),
          ]
          for old,new in pairs:
              assert old in s, f'JS missing {old}'
              s=s.replace(old,new)
          # Humanize source mode/type in the ordinary table.
          anchor="const safeHref=v=>{const s=String(v||'');return s.startsWith('https://')?esc(s):''};"
          add="const humanSource=v=>{const raw=String(v||'');const u=raw.toUpperCase();return esc(({GITHUB:'GitHub',READ_ONLY:'只读',API:'API',VF_DOC:'vf-doc',CORE_UPDATES:'core-updates'}[u])||raw)};"
          assert s.count(anchor)==1 and add not in s
          s=s.replace(anchor,anchor+add,1)
          old="<div class=\"file-name\">${text(r.authority_type)}<small>${text(r.provider)}</small></div><div>${text(r.read_mode)}</div>"
          new="<div class=\"file-name\">${humanSource(r.authority_type)}<small>${text(r.provider)}</small></div><div>${humanSource(r.read_mode)}</div>"
          assert s.count(old)==1
          s=s.replace(old,new,1)
          js.write_text(s,encoding='utf-8')

          # Mobile recent-change action is redundant; suppress it rather than let it wrap like a broken label.
          css=Path('public/assets/experience.css'); c=css.read_text(encoding='utf-8')
          old='.change-item>a{display:none}'
          new='.change-item>a,.change-item>button{display:none}'
          assert c.count(old)==1
          css.write_text(c.replace(old,new,1),encoding='utf-8')

          # Sanitized real-structure fixture uses Chinese-first human text.
          f=Path('tests/integration/v1360_experience_fixture.py'); x=f.read_text(encoding='utf-8')
          fpairs=[
            ('V1.36.0 正式 Runtime Integration','V1.36.0 正式运行体验集成'),
            ('提交 Integrated Runtime 截图供主控评审','提交正式集成运行界面截图供主控评审'),
            ('Synthetic Formal Authority','模拟正式来源'),
            ('Historical Atomic managed scope omitted memory-api.php; Source Exact was later closed.','历史 Atomic 管理范围曾遗漏 memory-api.php；之后已完成 Source Exact 校正并封板。'),
            ('GitHub + Production Evidence','GitHub + 生产证据'),
          ]
          for old,new in fpairs:
              assert old in x, f'fixture missing {old}'
              x=x.replace(old,new)
          f.write_text(x,encoding='utf-8')

          # Gate expectations follow the fixture semantics, not old English wording.
          for file in ['tests/integration/v1360_formal_runtime_gate.sh','tests/e2e/v1360_integrated_experience.spec.js']:
              p=Path(file); g=p.read_text(encoding='utf-8')
              g=g.replace('V1.36.0 正式 Runtime Integration','V1.36.0 正式运行体验集成')
              g=g.replace("'Integrated Runtime'", "'正式集成运行界面'")
              g=g.replace('Integrated Runtime 截图供主控评审','正式集成运行界面截图供主控评审')
              p.write_text(g,encoding='utf-8')
          PY
          php -l src/app/ExperienceService.php >/dev/null
          node --check public/assets/experience.js
          python3 -m py_compile tests/integration/v1360_experience_fixture.py
          bash -n tests/integration/v1360_formal_runtime_gate.sh
          node --check tests/e2e/v1360_integrated_experience.spec.js
          python3 tests/integration/v1360_experience_static_gate.py
          test "$(git status --short | wc -l)" -eq 6
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add src/app/ExperienceService.php public/assets/experience.js public/assets/experience.css tests/integration/v1360_experience_fixture.py tests/integration/v1360_formal_runtime_gate.sh tests/e2e/v1360_integrated_experience.spec.js
          git commit -m 'fix(v1.36.0): polish Chinese-first integrated product experience'
          git push origin HEAD:integration/v1.36.0-product-experience
          echo "PATCHED_HEAD=$(git rev-parse HEAD)"
