name: P01 Workspace Display Language Final Gate

on:
  push:
    branches:
      - task/p01-workspace-display-language-20260830
    paths:
      - .github/workflows/p01-workspace-display-language-final-20260830.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      EVID: /tmp/p01-workspace-display-language-final
    steps:
      - name: Checkout runner
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: runner

      - name: Checkout exact P01 source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: 0629e7205ea6ec75f4831e8a73a4246087e31618
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: p01

      - name: Exact source and scope fence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVID"
          test "$(git -C p01 rev-parse HEAD)" = 0629e7205ea6ec75f4831e8a73a4246087e31618
          git -C p01 diff --name-only 8f934157aa2215f7fedf12797c5add7b47c8e70a..HEAD | sort > "$EVID/actual-files.txt"
          cat > "$EVID/expected-files.txt" <<'EOF'
          src/app/FunctionalHome.php
          src/app/FunctionalWorkspaceCore.php
          src/app/FunctionalWorkspaceShell.php
          EOF
          sort -o "$EVID/expected-files.txt" "$EVID/expected-files.txt"
          diff -u "$EVID/expected-files.txt" "$EVID/actual-files.txt"
          test "$(git -C p01 rev-parse HEAD^{tree})" = ea0695aeba336d57f3d477d13be6c0cec912a7f8
          test "$(git -C p01 rev-parse HEAD:src/app/FunctionalHome.php)" = 8dac2892161b6781a1f007918de04854c16d263c
          test "$(git -C p01 rev-parse HEAD:src/app/FunctionalWorkspaceCore.php)" = 57ca35adafd03622aedb490d797e051fb6828f64
          test "$(git -C p01 rev-parse HEAD:src/app/FunctionalWorkspaceShell.php)" = b0e5ef30ce41b3f2e4127d2348a168be023ff001
          echo P01_WORKSPACE_DISPLAY_SCOPE=PASS | tee "$EVID/source-fence.txt"

      - name: PHP and render contract
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l p01/src/app/FunctionalWorkspaceCore.php
          php -l p01/src/app/FunctionalWorkspaceShell.php
          php -l p01/src/app/FunctionalHome.php
          php -r '
            require "p01/src/app/FunctionalHome.php";
            foreach([["channels","youtube","YouTube"],["channels","podcast","播客"],["channels","bilibili","哔哩哔哩"],["watch","movie","电影"],["watch","series","剧集"],["watch","documentary","纪录片"],["watch","variety","综艺"],["watch","anime","动漫"],["watch","自定义类型","自定义类型"],["topics","研究","研究"]] as [$m,$k,$w]) { if(vf_fw_kind_display_label($m,$k)!==$w) exit(1); }
            if(vf_home_asset_class(["surface"=>"watch","resource_kind"=>"movie"])!=="电影") exit(2);
            $_GET=[]; ob_start(); vf_fw_render_kind_nodes(["movie"=>2,"series"=>1,"自定义类型"=>1],"watch","movie"); $x=ob_get_clean();
            if(strpos($x,">电影<")===false||strpos($x,">剧集<")===false||strpos($x,">自定义类型<")===false||strpos($x,"kind=movie")===false||strpos($x,">movie<")!==false) exit(3);
            ob_start(); vf_fw_render_head(["title"=>"影视","scope"=>"all","admin"=>true,"category_name"=>"","kind"=>"movie","kind_label"=>"内容类型","q"=>"","total"=>2,"range_start"=>1,"range_end"=>2,"mode"=>"watch","category_id"=>0]); $x=ob_get_clean(); if(strpos($x,"内容类型：电影")===false||strpos($x,"value=\"movie\"")===false) exit(4);
            ob_start(); vf_fw_render_mobile_filters("watch",true,"all",[],[],0,["movie"=>2,"series"=>1],"movie"); $x=ob_get_clean(); if(strpos($x,"电影 · 2")===false||strpos($x,"kind=movie")===false) exit(5);
            $a=["id"=>1,"surface"=>"watch","url"=>"https://example.com/a","title"=>"测试电影","resource_kind"=>"movie","media_year"=>2026,"is_favorite"=>0,"is_private"=>0,"tags"=>[]]; ob_start(); vf_fw_render_row($a,false,true); $x=ob_get_clean(); if(strpos($x,"example.com · 电影")===false) exit(6); ob_start(); vf_fw_render_watch_card($a,false); $x=ob_get_clean(); if(strpos($x,"2026 · 电影")===false) exit(7);
            echo "P01_WORKSPACE_DISPLAY_RENDER=PASS\n";
          ' | tee "$EVID/render.txt"

      - name: Build actual renderer UI fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          php -r '
            require "p01/src/app/FunctionalHome.php";
            $_GET=["kind"=>"movie"];
            $asset=["id"=>1,"surface"=>"watch","url"=>"https://example.com/movie","title"=>"我的团长我的团","resource_kind"=>"movie","media_year"=>2026,"media_status"=>"watching","is_favorite"=>1,"is_private"=>1,"effective_private"=>1,"tags"=>["战争","中国"],"description"=>""];
            ob_start();
            echo "<!doctype html><html lang=\"zh-CN\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">";
            foreach(["surfaces.css","surface-workspace.css","workspace-v228.css","workspace-rebaseline.css","resource-media.css","workspace-domain-nav.css"] as $css) echo "<link rel=\"stylesheet\" href=\"assets/$css\">";
            echo "<title>Workspace UI Gate</title></head><body class=\"vf-surface-app vf-workspace-page vf-functional-workspace surface-watch\" data-vf-mode=\"watch\">";
            vf_fw_render_sidebar(["mode"=>"watch","scope"=>"all","admin"=>true,"surface_counts"=>["total"=>406,"start"=>349,"channels"=>15,"watch"=>41,"topics"=>1],"scope_counts"=>["all"=>406,"public"=>100,"private"=>306],"categories"=>[],"category_counts"=>[],"category_id"=>0,"category_total"=>4,"kind_counts"=>["movie"=>2,"series"=>1,"自定义类型"=>1],"kind"=>"movie","pending"=>0,"active_view"=>"watch","logo_url"=>""]);
            echo "<section class=\"vf-app-stage\">"; vf_fw_render_global_domain_nav("watch",true,"all"); echo "<main class=\"vf-shell-main\">";
            vf_fw_render_head(["title"=>"影视","scope"=>"all","admin"=>true,"category_name"=>"","kind"=>"movie","kind_label"=>"内容类型","q"=>"","total"=>41,"range_start"=>1,"range_end"=>30,"mode"=>"watch","category_id"=>0]);
            vf_fw_render_mobile_filters("watch",true,"all",[],[],0,["movie"=>2,"series"=>1,"自定义类型"=>1],"movie");
            echo "<section class=\"vf-workspace-list\">"; vf_fw_render_row($asset,true,true); echo "</section><section class=\"vf-watch-grid\">"; vf_fw_render_watch_card($asset,true); echo "</section>";
            echo "</main></section></body></html>"; file_put_contents("p01/src/workspace-display-fixture.html",ob_get_clean());
          '
          python3 -m http.server 8126 --directory p01/src >/tmp/p01-display-http.log 2>&1 &

      - name: Chromium desktop and mobile UI gate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > /tmp/p01-display-ui.cjs <<'EOF'
          const {chromium}=require('/tmp/node_modules/playwright'); const fs=require('fs');
          (async()=>{const b=await chromium.launch({headless:true}); const p=await b.newPage({viewport:{width:1440,height:900}}); await p.goto('http://127.0.0.1:8126/workspace-display-fixture.html',{waitUntil:'networkidle'});
            const desktop=await p.evaluate(()=>{const text=document.body.innerText; const kind=[...document.querySelectorAll('.vf-category-node')].find(x=>x.href.includes('kind=movie')); const chip=document.querySelector('.vf-context-chip'); const mobile=[...document.querySelectorAll('.vf-mobile-functional-filters option')].find(x=>x.textContent.includes('电影')); return {text,kindText:kind?.innerText||'',kindHref:kind?.getAttribute('href')||'',kindSearch:kind?.dataset.label||'',chip:chip?.textContent||'',mobile:mobile?.textContent||'',overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth};});
            if(!desktop.text.includes('电影')||!desktop.text.includes('剧集')||desktop.text.includes('\nmovie\n')) throw new Error('raw or translated desktop label regression');
            if(!desktop.kindText.includes('电影')||!desktop.kindHref.includes('kind=movie')||!desktop.kindSearch.includes('电影')||!desktop.kindSearch.includes('movie')) throw new Error('sidebar display/search/raw authority regression');
            if(!desktop.chip.includes('内容类型：电影')||!desktop.mobile.includes('电影')) throw new Error('chip/mobile label regression');
            if(desktop.overflow>1) throw new Error('desktop overflow'); fs.writeFileSync(process.env.EVID+'/desktop.json',JSON.stringify(desktop,null,2)); await p.screenshot({path:process.env.EVID+'/workspace-display-1440.png',fullPage:true});
            await p.setViewportSize({width:390,height:844}); await p.reload({waitUntil:'networkidle'}); const mobile=await p.evaluate(()=>({text:document.body.innerText,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,selected:[...document.querySelectorAll('.vf-mobile-functional-filters option')].find(x=>x.selected)?.textContent||''})); if(!mobile.text.includes('电影')||!mobile.selected.includes('电影')||mobile.overflow>1) throw new Error('mobile display/overflow regression'); fs.writeFileSync(process.env.EVID+'/mobile.json',JSON.stringify(mobile,null,2)); await p.screenshot({path:process.env.EVID+'/workspace-display-390.png',fullPage:true}); await b.close(); fs.writeFileSync(process.env.EVID+'/verdict.txt','P01_WORKSPACE_DISPLAY_UI=PASS\nSOURCE=0629e7205ea6ec75f4831e8a73a4246087e31618\n');})().catch(e=>{console.error(e);process.exit(1)});
          EOF
          EVID="$EVID" node /tmp/p01-display-ui.cjs

      - name: Upload UI evidence
        uses: actions/upload-artifact@v4
        with:
          name: p01-workspace-display-language-final-${{ github.run_id }}
          path: ${{ env.EVID }}
          retention-days: 30
