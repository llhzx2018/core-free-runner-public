name: P01 Large Library Navigation Gate V2
on:
  push:
    branches:
      - task/p01-v222-multi-surface-gate-20260828
    paths:
      - .github/workflows/p01-large-library-navigation-gate-v2-20260828.yml
      - scripts/p01-large-library-navigation-gate-20260828.sh
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE: 107b8205e7cd2aa53935aa70298235316b260438
      TREE: 0d30e4d60d4f5194cd8e477ac6f4e98cf8dac04d
      ROOT: /tmp/p01-large-library
      COOKIE: /tmp/p01-large-library.cookies
      PORT: '18332'
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Run exact large-library harness
        run: bash runner/scripts/p01-large-library-navigation-gate-20260828.sh
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/p01-large-library.pid 2>/dev/null)" 2>/dev/null || true
