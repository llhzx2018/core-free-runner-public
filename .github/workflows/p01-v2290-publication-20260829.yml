name: P01 V2.29 Publication
on:
  push:
    branches: [task/p01-v2290-formal-artifact-gate-20260829]
    paths:
      - .github/workflows/p01-v2290-publication-20260829.yml
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REPO: llhzx2018/vf-start
      TAG: v2.29.0
      FORMAL_SOURCE: aa9070bb810064df2e965a793b999ac8bde5734e
      FORMAL_TREE: a4922cbd297390500d5fbbf053c0072d1dd6360f
      MAIN_SHA: 1872c1268a44239a63271af0207593b05be38f51
      FULL_SHA: 1331b272429c5af5fabd0a5ec7d4319bd21d6a40b98e8fc95a5be7f55015a3ff
      UPDATE_SHA: 40505719b8dcbaa4a47437ba2e222172d8551ca206f3a8a5e8f11e951d3912a1
      FULL_BYTES: '612086'
      UPDATE_BYTES: '1319081'
    steps:
      - name: Checkout exact vf-start authority
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.MAIN_SHA }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: source
      - name: Download exact formal artifact contract
        uses: actions/download-artifact@v4
        with:
          name: p01-v229-formal-artifacts-aa9070bb810064df2e965a793b999ac8bde5734e
          path: formal
          repository: llhzx2018/core-free-runner-public
          run-id: 33213589827
          github-token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      - name: Publication gate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = "$MAIN_SHA"
          test "$(git -C source rev-parse HEAD^{tree})" = "$FORMAL_TREE"
          test "$(git -C source rev-parse "$FORMAL_SOURCE^{tree}")" = "$FORMAL_TREE"
          test "$(cat source/VERSION)" = '2.29.0'
          test "$(cat source/src/VERSION.txt)" = '2.29.0'
          test "$(sha256sum formal/VF-Start-V2.29.0-FULL.zip | awk '{print $1}')" = "$FULL_SHA"
          test "$(sha256sum formal/VF_Start_V2.29.0_UPDATE.zip | awk '{print $1}')" = "$UPDATE_SHA"
          test "$(sha256sum formal/VF-Start-V2.29.0-UPDATE.zip | awk '{print $1}')" = "$UPDATE_SHA"
          test "$(stat -c%s formal/VF-Start-V2.29.0-FULL.zip)" = "$FULL_BYTES"
          test "$(stat -c%s formal/VF_Start_V2.29.0_UPDATE.zip)" = "$UPDATE_BYTES"
          (cd formal && sha256sum -c SHA256SUMS.txt)
          if git -C source ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then echo 'Tag already exists; immutable publication refuses replacement.' >&2; exit 20; fi
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then echo 'Release already exists; immutable publication refuses replacement.' >&2; exit 21; fi
          echo P01_V229_PUBLICATION_GATE=PASS
      - name: Create immutable tag on Formal Source
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C source config user.name 'VictorForge Release Bot'
          git -C source config user.email 'llhzx2018@gmail.com'
          git -C source tag -a "$TAG" "$FORMAL_SOURCE" -m 'VF Start V2.29.0'
          git -C source push origin "refs/tags/$TAG"
          test "$(git -C source ls-remote origin "refs/tags/$TAG^{}" | awk '{print $1}')" = "$FORMAL_SOURCE"
          echo P01_V229_TAG=PASS
      - name: Create GitHub Release and upload formal assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          cat > /tmp/v229-notes.md <<'EOF'
          ## VF Start V2.29.0

          V2.29 completes the P01 functional/resource-domain rebaseline:
          - restores first-class Public / Private and hierarchical navigation categories;
          - separates 导航 / 频道 / 影视 / 专题 resource-domain taxonomy;
          - keeps favicon for ordinary URLs and adds compressed covers for media/topic resources;
          - adds remote/hosted HTML topics with CSP sandbox isolation;
          - makes Add, Edit and attachment deletion atomic and retires split legacy mutation paths;
          - migrates Schema `2026082801 -> 2026082901` with rollback/interruption recovery.

          Formal Artifact Gate: `33213589827` PASS.
          Formal Source: `aa9070bb810064df2e965a793b999ac8bde5734e`.
          Owner Production is not modified by publication.
          EOF
          gh release create "$TAG" formal/* --repo "$REPO" --title 'VF Start V2.29.0' --notes-file /tmp/v229-notes.md --verify-tag --latest
          gh release view "$TAG" --repo "$REPO" --json id,tagName,name,isDraft,isPrerelease,url > /tmp/p01-v229-release.json
          jq -e '.tagName=="v2.29.0" and .name=="VF Start V2.29.0" and .isDraft==false and .isPrerelease==false' /tmp/p01-v229-release.json >/dev/null
          gh release view "$TAG" --repo "$REPO" --json assets > /tmp/p01-v229-assets.json
          jq -e '.assets | map(.name) | index("VF_Start_V2.29.0_UPDATE.zip") != null and index("VF-Start-V2.29.0-FULL.zip") != null' /tmp/p01-v229-assets.json >/dev/null
          echo P01_V229_GITHUB_RELEASE=PASS
      - name: Read back immutable identity
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          git -C source fetch --tags --force
          test "$(git -C source rev-list -n1 "$TAG^{commit}")" = "$FORMAL_SOURCE"
          gh release view "$TAG" --repo "$REPO" --json id,tagName,name,isDraft,isPrerelease,url,assets | tee /tmp/p01-v229-publication-readback.json
          echo P01_V229_PUBLICATION=PASS
          echo OWNER_PRODUCTION_WRITE=NO
      - name: Upload publication evidence
        uses: actions/upload-artifact@v4
        with:
          name: p01-v229-publication-evidence-aa9070bb810064df2e965a793b999ac8bde5734e
          path: /tmp/p01-v229-*.json
          if-no-files-found: error
          retention-days: 30
