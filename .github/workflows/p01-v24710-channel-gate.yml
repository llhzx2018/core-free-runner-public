name: P01 V2.47.10 Stable Channel Gate

on:
  pull_request:
    paths:
      - '.github/workflows/p01-v24710-channel-gate.yml'

permissions:
  contents: read

concurrency:
  group: p01-v24710-channel-gate
  cancel-in-progress: false

jobs:
  channel:
    if: github.head_ref == 'temp/p01-v24710-channel-gate-20260915'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CHANNEL_REPO: llhzx2018/core-updates
      CHANNEL_BRANCH: release/p01-v24710-channel-20260915
      CHANNEL_SHA: 841885b66c9613d1a75f099d1b4a9d6c71c0a2d1
      CHANNEL_BASE_SHA: 7cdd98c934c8f5b2728be723a63edbbe5d9497d5
      PRODUCT_REPO: llhzx2018/vf-start
      FORMAL_SHA: 972541fd06c66044105ec1b19cf7738c340c90c1
      RELEASE_TAG: v2.47.10
      RELEASE_ID: '389699263'
      SOURCE_VERSION: 2.47.9
      TARGET_VERSION: 2.47.10
      EXPECTED_SCHEMA: '2026090401'
      UPDATE_ASSET: VF_Start_V2.47.10_UPDATE.zip
      UPDATE_BYTES: '1847940'
      UPDATE_SHA256: 7abb7cd71429c551274d7d4651bf185e3e46990f51fcab1db74d3a9b55b3f1f9
      RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}

    steps:
      - name: Exact channel and formal release preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RELEASE_TOKEN"
          test "$(GH_TOKEN="$RELEASE_TOKEN" gh api "repos/${CHANNEL_REPO}/git/ref/heads/${CHANNEL_BRANCH}" --jq '.object.sha')" = "$CHANNEL_SHA"
          test "$(GH_TOKEN="$RELEASE_TOKEN" gh api "repos/${CHANNEL_REPO}/git/ref/heads/main" --jq '.object.sha')" = "$CHANNEL_BASE_SHA"
          test "$(GH_TOKEN="$RELEASE_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/main" --jq '.object.sha')" = "$FORMAL_SHA"
          test "$(GH_TOKEN="$RELEASE_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')" = "$FORMAL_SHA"
          test "$(GH_TOKEN="$RELEASE_TOKEN" gh api "repos/${PRODUCT_REPO}/releases/tags/${RELEASE_TAG}" --jq '.id')" = "$RELEASE_ID"
          echo READ_CREDENTIAL_ROUTE=VF_RELEASE_WRITE_TOKEN
          echo P01_V24710_CHANNEL_PREFLIGHT=PASS

      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CHANNEL_SHA }}
          token: ${{ env.RELEASE_TOKEN }}
          persist-credentials: false
          fetch-depth: 2
          path: core-updates

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none

      - name: Manifest contract and exact P01 mapping
        working-directory: core-updates
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CHANNEL_SHA"
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD | sort)
          test "${#changed[@]}" = 1
          test "${changed[0]}" = projects/P01.json
          python3 scripts/check_manifest_contract.py >/tmp/p01-v24710-manifest-audit.json
          jq -e '.status=="PASS"' /tmp/p01-v24710-manifest-audit.json >/dev/null
          jq -e --arg src "$SOURCE_VERSION" --arg dst "$TARGET_VERSION" --arg schema "$EXPECTED_SCHEMA" --arg tag "$RELEASE_TAG" --arg sha "$FORMAL_SHA" --arg asset "$UPDATE_ASSET" --arg digest "$UPDATE_SHA256" --argjson rid "$RELEASE_ID" --argjson bytes "$UPDATE_BYTES" '
            .project_id=="P01" and .component_id=="APP" and .enabled==true and
            .current_version==$src and .target_version==$dst and .update_type=="ATOMIC" and
            .from_versions==[$src] and .schema_from==$schema and .schema_to==$schema and
            .repository=="llhzx2018/vf-start" and .release_tag==$tag and .release_id==$rid and
            .product_identity==$sha and .asset_name==$asset and .asset_bytes==$bytes and
            .asset_sha256==$digest and .backup_required==true and .rollback_supported==true
          ' projects/P01.json >/dev/null
          ! grep -Eiq '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,})' projects/P01.json
          echo P01_V24710_MANIFEST_CONTRACT=PASS

      - name: Update Core regression
        working-directory: core-updates
        shell: bash
        run: |
          set -Eeuo pipefail
          find update-core/php/src update-core/php/tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/p01-v24710-channel-php-lint
          php update-core/php/tests/run.php | tee /tmp/p01-v24710-update-core-tests
          echo P01_V24710_UPDATE_CORE=PASS

      - name: Remote release asset and byte identity
        env:
          GH_TOKEN: ${{ env.RELEASE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          META=$(gh api "repos/${PRODUCT_REPO}/releases/tags/${RELEASE_TAG}")
          test "$(jq -r '.id' <<<"$META")" = "$RELEASE_ID"
          test "$(jq -r '.draft' <<<"$META")" = false
          test "$(jq -r '.prerelease' <<<"$META")" = false
          test "$(jq -r --arg n "$UPDATE_ASSET" '.assets[]|select(.name==$n)|.size' <<<"$META")" = "$UPDATE_BYTES"
          test "$(jq -r --arg n "$UPDATE_ASSET" '.assets[]|select(.name==$n)|.digest' <<<"$META")" = "sha256:${UPDATE_SHA256}"
          rm -rf /tmp/p01-v24710-channel-asset && mkdir -p /tmp/p01-v24710-channel-asset
          gh release download "$RELEASE_TAG" --repo "$PRODUCT_REPO" --pattern "$UPDATE_ASSET" --dir /tmp/p01-v24710-channel-asset
          test "$(stat -c '%s' "/tmp/p01-v24710-channel-asset/$UPDATE_ASSET")" = "$UPDATE_BYTES"
          test "$(sha256sum "/tmp/p01-v24710-channel-asset/$UPDATE_ASSET" | awk '{print $1}')" = "$UPDATE_SHA256"
          echo P01_V24710_REMOTE_UPDATE_ASSET=PASS

      - name: Final stable channel verdict
        run: |
          echo CORE_UPDATES_MANIFEST_CONTRACT=PASS
          echo UPDATE_CORE_REGRESSION=PASS
          echo REMOTE_RELEASE_IDENTITY=PASS
          echo P01_V24710_STABLE_CHANNEL_GATE=PASS
          echo CHANNEL_PUBLISHED=false
          echo PRODUCTION=false

      - name: Cleanup
        if: always()
        run: rm -rf core-updates /tmp/p01-v24710-*
