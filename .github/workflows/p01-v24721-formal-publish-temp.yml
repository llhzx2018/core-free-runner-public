name: p01-v24721-formal-publish-temp

on:
  push:
    branches:
      - release/p01-v24721-publish

permissions:
  contents: read

concurrency:
  group: p01-v24721-formal-publish
  cancel-in-progress: false

jobs:
  artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      FORMAL_SHA: e258404165439ab0b8b6220f271728d8d9215bb8
      SOURCE_TAG: v2.47.20
      SOURCE_SHA: 83ca94662dd8bc053dea0ef94bc0e6ef0d587234
      SOURCE_VERSION: 2.47.20
      TARGET_VERSION: 2.47.21
      TARGET_TAG: v2.47.21
      EXPECTED_SCHEMA: '2026090401'
      CANDIDATE_RUN: '35437714041'
      BACKEND_GATE_RUN: '35437507855'
      BIND_PR: '787'
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}

    steps:
      - name: Exact formal authority
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$RELEASE_TOKEN"
          test "$(GH_TOKEN="$READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/main" --jq '.object.sha')" = "$FORMAL_SHA"
          test "$(GH_TOKEN="$READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/tags/${SOURCE_TAG}" --jq '.object.sha')" = "$SOURCE_SHA"
          test "$(GH_TOKEN="$READ_TOKEN" gh api "repos/${PRODUCT_REPO}/pulls/${BIND_PR}" --jq '.merged')" = true
          if GH_TOKEN="$READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/tags/${TARGET_TAG}" >/dev/null 2>&1; then
            echo BLOCK=TARGET_TAG_ALREADY_EXISTS
            exit 81
          fi
          echo P01_V24721_FORMAL_AUTHORITY=PASS

      - name: Checkout exact formal source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.FORMAL_SHA }}
          token: ${{ env.READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          path: vf-start

      - name: Checkout exact V2.47.20 baseline
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ env.READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: baseline

      - name: Checkout proven artifact helper
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: 1dd635d8e8d4485736458672fb7a5be397d94f89
          token: ${{ env.READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: helper

      - name: Checkout proven artifact template
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: 0439b0df027ae0bc6c21a8dbf91b066a564130f9
          token: ${{ env.READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: template

      - name: Checkout proven Atomic primitives
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 0468b28ae57c368f80b03f85060318667bcc5834
          persist-credentials: false
          fetch-depth: 1
          path: proven

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd
          coverage: none

      - name: Exact source syntax and backend contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C vf-start rev-parse HEAD)" = "$FORMAL_SHA"
          test "$(git -C baseline rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n ' < vf-start/VERSION)" = "$TARGET_VERSION"
          test "$(tr -d '\r\n ' < vf-start/src/VERSION.txt)" = "$TARGET_VERSION"
          grep -Fq "define('VF_VERSION', '${TARGET_VERSION}');" vf-start/src/app/bootstrap.php
          test "$(php -r '$p=json_decode(file_get_contents("vf-start/VF_PROJECT.json"),true); echo $p["working_schema_version"];')" = "$EXPECTED_SCHEMA"
          grep -Fq 'OWNER_PREVIEW_RUNTIME_APPLICABILITY = N_A' vf-start/docs/release/V2.47.21_RELEASE_GATE.md
          grep -Fq 'NO_UNKNOWN_APPLICABILITY = YES' vf-start/docs/release/V2.47.21_RELEASE_GATE.md
          find vf-start/src -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          find vf-start/src -name '*.js' -print0 | xargs -0 -n1 node --check >/dev/null
          php vf-start/tests/unit/admin_overview_ia_contract.php
          php vf-start/tests/unit/admin_secondary_nav_focus_contract.php
          php vf-start/tests/unit/admin_backend_closure_contract.php
          php vf-start/tests/unit/advanced_manager_daily_entry_contract.php
          php vf-start/tests/unit/admin_visual_system_r3_contract.php
          echo P01_V24721_EXACT_SOURCE_BACKEND_CONTRACTS=PASS

      - name: Rebuild deterministic FULL and Atomic UPDATE
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf formal candidate
          cp -a vf-start formal
          cp -a vf-start candidate
          cp helper/scripts/_tmp_p01_v2470_formal_artifact_gate.sh /tmp/p01-v24721-artifact-gate.sh
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path('/tmp/p01-v24721-artifact-gate.sh')
          s=p.read_text(encoding='utf-8')
          repl=[
            ('7f3492f70276d83efed371296d69709c1e991350',os.environ['FORMAL_SHA']),
            ('b70971514ccf1c6b8f3793bfc5a2200cad47dfe9',os.environ['FORMAL_SHA']),
            ('1bd95e8777e72f6cd89206ddb9daf934ad4e6b9e',os.environ['SOURCE_SHA']),
            ('33993725218',os.environ['GITHUB_RUN_ID']),
            ('BIND_PR=416','BIND_PR='+os.environ['BIND_PR']),
            ('OWNER_AUTHORIZED_V2470_RELEASE_CHAIN_20260906','OWNER_AUTHORIZED_V24721_ADMIN_UX_RELEASE_20260919'),
            ('V2470','V24721'),('v2470','v24721')
          ]
          for a,b in repl:
              if a not in s: raise SystemExit('missing helper anchor '+a)
              s=s.replace(a,b)
          s=s.replace('2.47.0','__TARGET__').replace('2.46.4',os.environ['SOURCE_VERSION']).replace('__TARGET__',os.environ['TARGET_VERSION'])
          old="src=src.replace(\"'release_type':'patch'\",\"'release_type':'minor'\")"
          if old not in s: raise SystemExit('release-type helper anchor missing')
          s=s.replace(old,"src=src.replace('V2.46.1 之后 Consolidated L2 Product Optimization 的正式发布版本。','V2.47.20 之后后台 UX / IA 收口的正式发布版本。')",1)
          p.write_text(s,encoding='utf-8')
          PY
          chmod +x /tmp/p01-v24721-artifact-gate.sh
          bash /tmp/p01-v24721-artifact-gate.sh | tee /tmp/p01-v24721-artifact.log
          grep -Fx 'P01_V24721_FORMAL_ARTIFACT_GATE=PASS' /tmp/p01-v24721-artifact.log
          echo P01_V24721_REAL_UPGRADE=PASS

      - name: Stable package contract
        shell: bash
        run: |
          set -Eeuo pipefail
          ASSETS=/tmp/p01-v24721-formal-artifacts
          FULL="$ASSETS/VF-Start-V2.47.21-FULL.zip"
          UPDATE="$ASSETS/VF_Start_V2.47.21_UPDATE.zip"
          for f in "$FULL" "$FULL.sha256" "$UPDATE" "$UPDATE.sha256"; do test -f "$f"; done
          (cd "$ASSETS" && sha256sum -c VF-Start-V2.47.21-FULL.zip.sha256 && sha256sum -c VF_Start_V2.47.21_UPDATE.zip.sha256)
          test "$(unzip -p "$FULL" VERSION.txt | tr -d '\r\n ')" = "$TARGET_VERSION"
          unzip -p "$FULL" release-manifest.json >/tmp/p01-v24721-release-manifest.json
          jq -e --arg t "$TARGET_VERSION" --arg s "$SOURCE_VERSION" --arg schema "$EXPECTED_SCHEMA" '.version==$t and .source_version==$s and .schema_version==$schema and .source_schema_version==$schema and .schema_change==false and (.schema_migrations|length)==0 and .runtime_data_included==false and .seed_user_business_data_included==false and .update.backup_required==true and .update.rollback_supported==true and .update.single_hop==true and (.update.supported_from==[$s])' /tmp/p01-v24721-release-manifest.json >/dev/null
          test "$(unzip -Z1 "$UPDATE" | wc -l | tr -d ' ')" = 1
          unzip -Z1 "$UPDATE" | grep -Fxq repair-v2.47.21.php
          php "$ASSETS/repair-v2.47.21.php" --self-test | jq -e '.ok==true and .global_barrier==true and .interruption_recovery==true' >/dev/null
          ! unzip -Z1 "$FULL" | grep -Eq '(^|/)(private|backups|uploads|runtime-data)(/|$)'
          (cd "$ASSETS" && sha256sum VF-Start-V2.47.21-FULL.zip VF-Start-V2.47.21-FULL.zip.sha256 VF_Start_V2.47.21_UPDATE.zip VF_Start_V2.47.21_UPDATE.zip.sha256 > SHA256SUMS.txt)
          echo P01_V24721_PACKAGE_CONTRACT=PASS

      - name: Create stable tag and release
        env:
          GH_TOKEN: ${{ env.RELEASE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ASSETS=/tmp/p01-v24721-formal-artifacts
          gh api --method POST "repos/${PRODUCT_REPO}/git/refs" -f ref="refs/tags/${TARGET_TAG}" -f sha="$FORMAL_SHA" >/dev/null
          test "$(gh api "repos/${PRODUCT_REPO}/git/ref/tags/${TARGET_TAG}" --jq '.object.sha')" = "$FORMAL_SHA"
          cat >/tmp/p01-v24721-notes.md <<EOF
          # P01 · VF Start V2.47.21

          后台 UX / IA 收口版本：
          - 后台默认入口改为任务优先“概览”，不再直接进入高级资源编辑器。
          - 一级导航收敛为：概览 / 资源 / 数据 / 系统 / 设置。
          - 六资源域保留在“全部资源”内部，减少侧栏重复入口。
          - 导入导出、浏览器助手、备份恢复统一归入“数据”。
          - 运行健康、更新、RSS/扩展统一归入“系统”；低频维护按需展开。
          - 设置页移除重复系统/RSS入口；全站治理降级为低频治理入口。
          - 不新增健康度/进度等假精确指标。

          Exact Formal Source: ${FORMAL_SHA}
          Previous Stable: ${SOURCE_TAG} / ${SOURCE_SHA}
          Schema: ${EXPECTED_SCHEMA} unchanged; Migration: NONE.
          Backend exact-source Gate: ${BACKEND_GATE_RUN} PASS.
          Bound Candidate Gate: ${CANDIDATE_RUN} PASS.
          Formal Release Gate: ${GITHUB_RUN_ID}.
          Strict 2.47.20 → 2.47.21 Atomic Update / Clean FULL / data preservation / backup+rollback / package safety: PASS in Formal Gate.
          OWNER_PREVIEW_RUNTIME_APPLICABILITY: N_A by explicit OWNER direct-publish instruction.
          Formal Release / Distribution do not imply Production upgraded.
          EOF
          gh release create "$TARGET_TAG"             "$ASSETS/VF-Start-V2.47.21-FULL.zip"             "$ASSETS/VF-Start-V2.47.21-FULL.zip.sha256"             "$ASSETS/VF_Start_V2.47.21_UPDATE.zip"             "$ASSETS/VF_Start_V2.47.21_UPDATE.zip.sha256"             "$ASSETS/SHA256SUMS.txt"             --repo "$PRODUCT_REPO" --title 'VF Start V2.47.21' --notes-file /tmp/p01-v24721-notes.md --verify-tag
          test "$(gh api "repos/${PRODUCT_REPO}/releases/tags/${TARGET_TAG}" --jq '.prerelease')" = false
          test "$(gh api "repos/${PRODUCT_REPO}/releases/tags/${TARGET_TAG}" --jq '.draft')" = false
          echo P01_V24721_STABLE_RELEASE=PASS

      - name: Independent remote byte readback
        env:
          GH_TOKEN: ${{ env.READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ASSETS=/tmp/p01-v24721-formal-artifacts
          test "$(gh api "repos/${PRODUCT_REPO}/git/ref/tags/${TARGET_TAG}" --jq '.object.sha')" = "$FORMAL_SHA"
          rm -rf /tmp/p01-v24721-remote
          mkdir -p /tmp/p01-v24721-remote
          gh release download "$TARGET_TAG" --repo "$PRODUCT_REPO" --dir /tmp/p01-v24721-remote
          LOCAL="$ASSETS" REMOTE=/tmp/p01-v24721-remote python3 - <<'PY'
          from pathlib import Path
          import hashlib,os
          l=Path(os.environ['LOCAL']); r=Path(os.environ['REMOTE'])
          names=['VF-Start-V2.47.21-FULL.zip','VF-Start-V2.47.21-FULL.zip.sha256','VF_Start_V2.47.21_UPDATE.zip','VF_Start_V2.47.21_UPDATE.zip.sha256','SHA256SUMS.txt']
          assert sorted(p.name for p in r.iterdir() if p.is_file())==sorted(names)
          for n in names:
              a,b=l/n,r/n
              ha=hashlib.sha256(a.read_bytes()).hexdigest(); hb=hashlib.sha256(b.read_bytes()).hexdigest()
              assert a.stat().st_size==b.stat().st_size and ha==hb
              print(f'FORMAL_ASSET={n}|{a.stat().st_size}|{ha}')
          print('P01_V24721_REMOTE_BYTES=PASS')
          PY

      - name: Final formal verdict
        run: |
          echo PUBLIC_AUTHORITY_INSTALL=PASS
          echo PUBLIC_AUTHORITY_SECURITY=PASS
          echo PUBLIC_AUTHORITY_TESTING=PASS
          echo PUBLIC_AUTHORITY_UPGRADE=PASS
          echo PUBLIC_AUTHORITY_DATA_SCHEMA=PASS
          echo PUBLIC_AUTHORITY_GIT=PASS
          echo PUBLIC_AUTHORITY_UA_UI=PASS
          echo OWNER_PREVIEW_RUNTIME_APPLICABILITY=N_A
          echo OWNER_REAL_USE=POST_RELEASE_PENDING
          echo P01_V24721_FORMAL_RELEASE_GATE=PASS
          echo STABLE_DISTRIBUTION_UPDATED=false
          echo PRODUCTION=false

      - name: Cleanup
        if: always()
        run: rm -rf vf-start baseline helper template proven formal candidate /tmp/p01-v24721-*
