name: P08 R104 exact-source isolated PHP and Vue regression (one-off)
on:
  pull_request:
    paths:
      - .github/workflows/p08-r104-exact-pr50-once.yml
permissions:
  contents: read
jobs:
  r104-exact-source:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - name: Checkout one-off public harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout pinned private P08 PR50 source only in temporary workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 99dda51d7bc25888b518a38dfa49bd781fd16ceb
          path: p08-private
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: PHP 8.4 CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mbstring, fileinfo, zip, pdo_sqlite
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source and read-only isolated PHP regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd p08-private
          test "$(git rev-parse HEAD)" = "99dda51d7bc25888b518a38dfa49bd781fd16ceb"
          test "$(cat VERSION)" = "0.1.2"
          for file in public/setup.php src/Upgrade/UpgradeReadiness.php tests/compatibility/r104_large_full_readiness.php tests/test_upgrade_readiness.php; do
            if php -l "$file" > "$RUNNER_TEMP/p08-r104-lint.log" 2>&1; then
              echo "P08_R104_PHP_SYNTAX=PASS"
            else
              echo "P08_R104_PHP_SYNTAX=FAIL"
              exit 1
            fi
          done
          for item in "tests/compatibility/r104_large_full_readiness.php" "tests/test_upgrade_readiness.php" "tests/test_setup_experience_contract.php" "tests/test_setup_guard.php"; do
            if php "$item" > "$RUNNER_TEMP/p08-r104-php.log" 2>&1; then
              echo "P08_R104_LOCAL_PHP_REGRESSION=PASS"
            else
              echo "P08_R104_LOCAL_PHP_REGRESSION=FAIL"
              exit 1
            fi
          done
          echo "P08_R104_EXACT_SHA_PHP_CHECKS=PASS"
      - name: Vue TypeScript frontend and unit regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd p08-private
          if ! npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-r104-npm.log" 2>&1; then
            echo P08_R104_LOCKED_NPM_INSTALL=FAIL; exit 1
          fi
          if ! npm run typecheck > "$RUNNER_TEMP/p08-r104-ts.log" 2>&1; then
            echo P08_R104_VUE_TYPECHECK=FAIL; exit 1
          fi
          if ! npm run test:unit > "$RUNNER_TEMP/p08-r104-unit.log" 2>&1; then
            echo P08_R104_VUE_UNIT_TEST=FAIL; exit 1
          fi
          if ! npm run build > "$RUNNER_TEMP/p08-r104-build.log" 2>&1; then
            echo P08_R104_VITE_BUILD=FAIL; exit 1
          fi
          echo P08_R104_VUE_TYPECHECK_UNIT_BUILD=PASS
      - name: Destruct temporary private source, logs and dependency caches
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- p08-private
          rm -f -- "$RUNNER_TEMP"/p08-r104-*.log
          echo P08_R104_DISPOSABLE_CLEANUP=COMPLETE

  r104-mysql-family:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [mysql, mariadb]
    services:
      db:
        image: ${{ matrix.engine == 'mysql' && 'mysql:8.4' || 'mariadb:11.8' }}
        env:
          MYSQL_ROOT_PASSWORD: synthetic-only-p08-ci-pass
          MARIADB_ROOT_PASSWORD: synthetic-only-p08-ci-pass
          MYSQL_ROOT_HOST: "%"
          MARIADB_ROOT_HOST: "%"
        ports:
          - 3306:3306
    env:
      P08_ISOLATED_INSTALL_TEST: YES
      P08_TEST_DB_DRIVER: ${{ matrix.engine }}
      P08_TEST_DB_HOST: 127.0.0.1
      P08_TEST_DB_CLEAN: p08_ci_clean
      P08_TEST_DB_DIRTY: p08_ci_dirty
      P08_TEST_DB_USER: root
      P08_TEST_DB_PASSWORD: synthetic-only-p08-ci-pass
    steps:
      - name: Checkout exact private R104 source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 99dda51d7bc25888b518a38dfa49bd781fd16ceb
          path: p08-private
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Setup PHP 8.4 MySQL engine
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_mysql, zip, mbstring, intl, bcmath, dom, fileinfo
      - name: Real isolated MySQL family setup / Owner / dirty refusal
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd p08-private
          test "$(git rev-parse HEAD)" = 99dda51d7bc25888b518a38dfa49bd781fd16ceb
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          if ! composer install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/p08-r104-composer.log" 2>&1; then
            echo P08_R104_COMPOSER_LOCKED_INSTALL=FAIL; exit 1
          fi
          # Service startup is transient; use a bounded local-PDO readiness probe.
          ready=0
          for i in $(seq 1 40); do
            if php -r 'try { new PDO("mysql:host=127.0.0.1;port=3306;charset=utf8mb4", "root", "synthetic-only-p08-ci-pass", [PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]); exit(0); } catch (Throwable $e) { exit(1); }' > /dev/null 2>&1; then
              ready=1; break
            fi
            sleep 2
          done
          test "$ready" = 1 || { echo P08_R104_SQL_SERVICE=NOT_READY; exit 1; }
          if ! php tests/fixtures/create_ci_databases.php > "$RUNNER_TEMP/p08-r104-db-setup.log" 2>&1; then
            echo P08_R104_DB_FIXTURE=FAIL; exit 1
          fi
          if ! php tests/test_install_mysql_e2e.php > "$RUNNER_TEMP/p08-r104-db-test.log" 2>&1; then
            echo P08_R104_DB_FIRST_INSTALL=FAIL; exit 1
          fi
          echo "P08_R104_REAL_MYSQL_FAMILY_${{ matrix.engine }}_INSTALL_AND_DIRTY_REFUSAL=PASS"
      - name: Always remove temporary private source and test logs
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- p08-private
          rm -f -- "$RUNNER_TEMP"/p08-r104-*.log
          echo P08_R104_MYSQL_FAMILY_CLEANUP=COMPLETE

  r104-sqlite:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      P08_ISOLATED_INSTALL_TEST: YES
    steps:
      - name: Checkout exact private R104 source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 99dda51d7bc25888b518a38dfa49bd781fd16ceb
          path: p08-private
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Setup PHP 8.4 SQLite engine
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_sqlite, sqlite3, zip, mbstring, intl, bcmath, dom, fileinfo
      - name: Real isolated SQLite setup, persistent Owner and dirty refusal
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd p08-private
          test "$(git rev-parse HEAD)" = 99dda51d7bc25888b518a38dfa49bd781fd16ceb
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          if ! composer install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/p08-r104-composer.log" 2>&1; then
            echo P08_R104_SQLITE_COMPOSER_INSTALL=FAIL; exit 1
          fi
          if ! php tests/test_install_sqlite_e2e.php > "$RUNNER_TEMP/p08-r104-sqlite.log" 2>&1; then
            echo P08_R104_SQLITE_FIRST_INSTALL=FAIL; exit 1
          fi
          echo P08_R104_REAL_SQLITE_INSTALL_AND_DIRTY_REFUSAL=PASS
      - name: Always remove temporary private source and test logs
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- p08-private
          rm -f -- "$RUNNER_TEMP"/p08-r104-*.log
          echo P08_R104_SQLITE_CLEANUP=COMPLETE
