name: P08 R104 exact-source isolated PHP and Vue regression (one-off)
on:
  pull_request:
    paths:
      - .github/workflows/p08-r104-exact-pr50-once.yml
permissions:
  contents: read
jobs:
  r104-exact-source:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - name: Checkout one-off public harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout pinned private P08 PR50 source only in temporary workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 99dda51d7bc25888b518a38dfa49bd781fd16ceb
          path: p08-private
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: PHP 8.4 CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mbstring, fileinfo, zip, pdo_sqlite
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source and read-only isolated PHP regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd p08-private
          test "$(git rev-parse HEAD)" = "99dda51d7bc25888b518a38dfa49bd781fd16ceb"
          test "$(cat VERSION)" = "0.1.2"
          for file in public/setup.php src/Upgrade/UpgradeReadiness.php tests/compatibility/r104_large_full_readiness.php tests/test_upgrade_readiness.php; do
            if php -l "$file" > "$RUNNER_TEMP/p08-r104-lint.log" 2>&1; then
              echo "P08_R104_PHP_SYNTAX=PASS"
            else
              echo "P08_R104_PHP_SYNTAX=FAIL"
              exit 1
            fi
          done
          for item in "tests/compatibility/r104_large_full_readiness.php" "tests/test_upgrade_readiness.php" "tests/test_setup_experience_contract.php" "tests/test_setup_guard.php"; do
            if php "$item" > "$RUNNER_TEMP/p08-r104-php.log" 2>&1; then
              echo "P08_R104_LOCAL_PHP_REGRESSION=PASS"
            else
              echo "P08_R104_LOCAL_PHP_REGRESSION=FAIL"
              exit 1
            fi
          done
          echo "P08_R104_EXACT_SHA_PHP_CHECKS=PASS"
      - name: Vue TypeScript frontend and unit regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd p08-private
          if ! npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-r104-npm.log" 2>&1; then
            echo P08_R104_LOCKED_NPM_INSTALL=FAIL; exit 1
          fi
          if ! npm run typecheck > "$RUNNER_TEMP/p08-r104-ts.log" 2>&1; then
            echo P08_R104_VUE_TYPECHECK=FAIL; exit 1
          fi
          if ! npm run test:unit > "$RUNNER_TEMP/p08-r104-unit.log" 2>&1; then
            echo P08_R104_VUE_UNIT_TEST=FAIL; exit 1
          fi
          if ! npm run build > "$RUNNER_TEMP/p08-r104-build.log" 2>&1; then
            echo P08_R104_VITE_BUILD=FAIL; exit 1
          fi
          echo P08_R104_VUE_TYPECHECK_UNIT_BUILD=PASS
      - name: Destruct temporary private source, logs and dependency caches
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- p08-private
          rm -f -- "$RUNNER_TEMP"/p08-r104-*.log
          echo P08_R104_DISPOSABLE_CLEANUP=COMPLETE
