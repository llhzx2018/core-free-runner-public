name: P01 Channels sparse state exact-source test-only
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-channels-sparse-state-test-only.yml'
permissions:
  contents: read
jobs:
  channels-sparse-state:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout registered Public Runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact private P01 checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 25210ede54321251be5860e5b9361ea7bcf85f6f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,mbstring,curl,openssl,zip
          coverage: none
      - name: Exact source state/privacy and regression contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "25210ede54321251be5860e5b9361ea7bcf85f6f"
          php -l product/src/app/ChannelLibraryPage.php
          php -l product/tests/unit/channels_private_badge_sparse_state_v247390_contract.php
          for testfile in \
            channels_private_badge_sparse_state_v247390_contract.php \
            channels_v247143_adaptive_density_contract.php \
            channels_v247142_context_columns_contract.php \
            channels_page_full_polish_contract.php \
            channel_page_full_polish_contract.php \
            channels_v247137_terminal_ownership_contract.php \
            channel_provider_context_facet_contract.php \
            channel_provider_normalization_contract.php \
            channel_provider_zero_result_contract.php \
            channel_kind_facet_context_contract.php \
            channel_card_action_hierarchy_contract.php \
            channel_add_background_context_contract.php \
            channel_watch_search_context_contract.php; do
            php "product/tests/unit/$testfile"
          done
          python3 - <<'PY'
          from pathlib import Path
          css=Path('product/src/assets/channel-library.css').read_text()
          assert css.count('{')==css.count('}')
          assert '.vf-channel-copy .vf-channel-private-badge{' in css
          assert '.is-state-empty .vf-channel-head-state' in css
          print('P01_CHANNELS_CSS_PRIVATE_BADGE=PASS')
          PY
          echo P01_CHANNELS_EXACT_SOURCE=PASS
      - name: Clear private checkout
        if: always()
        shell: bash
        run: rm -rf product
