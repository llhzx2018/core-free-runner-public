name: S01 Three Component Release Intake
on:
  push:
    branches: [temp/s01-final-ux-candidate-patch-20260907]
    paths: [.github/workflows/temp-s01-three-component-release-intake-20260907.yml]
permissions:
  contents: read
jobs:
  intake:
    runs-on: ubuntu-24.04
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      C01_SHA: 83960c172dbe2f5a937f4d0c35a17e8fc252126c
      C01_MAIN: 72d2a83da7b940a080d48c40891555dc815aaafa
      C02_SHA: cfd16e171ed97878a0c60a38805975480d2bf7bd
      C02_MAIN: 1ac24e55e7e21e1d02154a6fd6c96ac814f377b3
      C03_SHA: 45a050e24fe4feee4248869e42e2040ec2198e7b
      C03_MAIN: 6d603409acf470865e3ca8474cd29bff7fdd0601
    steps:
      - name: Exact release intake and public-authority mapping
        shell: bash
        run: |
          set -euo pipefail
          test -n "$READ_TOKEN"
          echo 'PUBLIC_AUTHORITY: UPGRADE=REQUIRED TESTING=REQUIRED SECURITY=REQUIRED GIT=REQUIRED UA_UI=REQUIRED'
          echo 'INSTALL=N_A DATA_SCHEMA=N_A API_PROVIDER=N_A SEO=N_A CRON_JOB=N_A NOTIFICATION=N_A OBSERVABILITY=N_A PERFORMANCE=N_A'
          echo 'PRODUCT_WRITE_USED=NO MAIN_WRITE_USED=NO RELEASE_WRITE_USED=NO DISTRIBUTION_WRITE_USED=NO PRODUCTION_WRITE_USED=NO MIGRATION_USED=NO'

          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-tools-theme.git" c01
          cd c01
          test "$(git rev-parse origin/main)" = "$C01_MAIN"
          git checkout -q "$C01_SHA"
          test "$(git rev-parse HEAD)" = "$C01_SHA"
          test "$(git show "$C01_MAIN":VERSION)" = '1.35.18'
          test "$(cat VERSION)" = '1.35.19'
          node --check src/assets/js/admin/admin-preview-human-language-final.js
          find src -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php tests/preview-human-language-followup-contract.php
          php tests/render-settings-human-language-contract.php
          php tests/recovery-human-language-closure-contract.php
          php tests/deep-admin-human-language-contract.php
          php tests/final-admin-human-closure-contract.php
          php tests/visible-console-v2-contract.php
          php tests/workbench-primary-action-contract.php
          php tests/update-refresh-policy-contract.php
          if git diff "$C01_MAIN"...HEAD | grep -E -i 'ghp_[A-Za-z0-9]+|github_pat_|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|VF_RELEASE_WRITE_TOKEN[[:space:]]*='; then exit 1; fi
          cd ..

          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-tools-ops.git" c02
          cd c02
          test "$(git rev-parse origin/main)" = "$C02_MAIN"
          git checkout -q "$C02_SHA"
          test "$(git rev-parse HEAD)" = "$C02_SHA"
          test "$(git show "$C02_MAIN":VERSION)" = '1.21.856'
          test "$(cat VERSION)" = '1.21.857'
          find includes -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php -l vf-ops.php >/dev/null
          php tests/system-components-human-language-contract.php
          php tests/update-compat-human-language-contract.php
          php tests/admin-human-language-contract.php
          php tests/pages-tools-human-closure-contract.php
          php tests/dashboard-selector-hit-contract.php
          php tests/visible-console-v2-contract.php
          php tests/update-refresh-policy-current-contract.php
          if git diff "$C02_MAIN"...HEAD | grep -E -i 'ghp_[A-Za-z0-9]+|github_pat_|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|VF_RELEASE_WRITE_TOKEN[[:space:]]*='; then exit 1; fi
          cd ..

          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-tools-m3u8.git" c03
          cd c03
          test "$(git rev-parse origin/main)" = "$C03_MAIN"
          git checkout -q "$C03_SHA"
          test "$(git rev-parse HEAD)" = "$C03_SHA"
          test "$(git show "$C03_MAIN":VERSION)" = '1.25.27'
          test "$(cat VERSION)" = '1.25.28'
          node --check src/admin/admin-s01-human-language-final.js
          find src -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php tests/unit/settings-human-language-followup-contract.php
          php tests/unit/recovery-runtime-human-language-followup-contract.php
          php tests/unit/admin-human-language-contract.php
          php tests/unit/dashboard-human-language-contract.php
          php tests/unit/host-recovery-human-language-contract.php
          php tests/unit/package-physical-locator-contract.php
          php tests/unit/update-refresh-policy-contract.php
          php tests/unit/visible-console-v2-contract.php
          php tests/unit/bootstrap-upgrade-contract.php
          php tests/frontend-s01-uiux-final-owner-contract.php
          git diff --exit-code "$C03_MAIN" -- src/includes/v6-provider-schema.php src/includes/v6-provider-post-migration-readonly.php src/includes/v6-provider-controlled-migration-admin.php src/includes/update
          if git diff "$C03_MAIN"...HEAD | grep -E -i 'ghp_[A-Za-z0-9]+|github_pat_|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|VF_RELEASE_WRITE_TOKEN[[:space:]]*='; then exit 1; fi
          cd ..
          echo 'PUBLIC_AUTHORITY_RELEASE_COVERAGE=PASS'
          echo 'NO_REQUIRED_GATE_MISSING=YES'
          echo 'NO_UNKNOWN_APPLICABILITY=YES'
          echo 'PASS_S01_THREE_COMPONENT_RELEASE_INTAKE'
