name: P01 V2.37.2 Manifest Gate
on:
  push:
    branches: [release/p01-v2372-hotfix-20260902]
    paths: [.github/workflows/p01-v2372-manifest-gate-20260902.yml]
permissions:
  actions: read
  contents: read
jobs:
  manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CORE_MAIN: 1f640592e97a5e670c75cb00cf89adf661f07a16
      CORE_CANDIDATE: 605e0fcce36813e9a7573ec9a04cff6ce40bb380
      RELEASE_ID: '381010644'
      UPDATE_ASSET_ID: '540714282'
      UPDATE_BYTES: '1271430'
      UPDATE_SHA: ac90582128a0d081b460f9887cb43d5e917ee0da23d4c1d81f1518b6f7b8bb8f
      FORMAL_SOURCE: 1f5a16796511620760a45cb81b3c8019b91e505b
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: main
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: live
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: release/p01-v2372-manifest-20260902
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: candidate
      - name: Exact channel boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C live rev-parse HEAD)" = "$CORE_MAIN"
          test "$(git -C candidate rev-parse HEAD)" = "$CORE_CANDIDATE"
          test "$(git -C candidate rev-parse HEAD^)" = "$CORE_MAIN"
          test "$(git -C candidate diff --name-only "$CORE_MAIN" HEAD)" = projects/P01.json
          jq -e '.current_version=="2.37.0" and .target_version=="2.37.1" and .from_versions==["2.37.0"] and .schema_from=="2026082901" and .schema_to=="2026082901"' live/projects/P01.json >/dev/null
          jq -e '.current_version=="2.37.1" and .target_version=="2.37.2" and .from_versions==["2.37.1"] and .update_type=="ATOMIC" and .schema_from=="2026082901" and .schema_to=="2026082901" and .release_tag=="v2.37.2" and .release_id==381010644 and .product_identity=="1f5a16796511620760a45cb81b3c8019b91e505b" and .asset_name=="VF_Start_V2.37.2_UPDATE.zip" and .asset_bytes==1271430 and .asset_sha256=="ac90582128a0d081b460f9887cb43d5e917ee0da23d4c1d81f1518b6f7b8bb8f"' candidate/projects/P01.json >/dev/null
          if jq -e '.from_versions|index("2.37.0")' candidate/projects/P01.json >/dev/null; then echo 'cross-grade path detected' >&2; exit 21; fi
          printf 'EXACT_SINGLE_FILE=PASS\nOLD_LIVE_2370_TO_2371=PASS\nNEW_STRICT_2371_TO_2372=PASS\nNO_CROSS_GRADE=PASS\nSCHEMA_CHANGE=NO\nMIGRATION=NONE\n' | tee /tmp/p01-v2372-manifest-boundary.txt
      - name: Release and frozen asset readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          REL="$(gh api repos/llhzx2018/vf-start/releases/$RELEASE_ID)"
          test "$(jq -r .tag_name <<<"$REL")" = v2.37.2
          test "$(jq -r .draft <<<"$REL")" = false
          test "$(jq -r .prerelease <<<"$REL")" = false
          A="$(jq -c '.assets[]|select(.id==540714282)' <<<"$REL")"
          test "$(jq -r .name <<<"$A")" = VF_Start_V2.37.2_UPDATE.zip
          test "$(jq -r .size <<<"$A")" = "$UPDATE_BYTES"
          test "$(jq -r .digest <<<"$A")" = "sha256:$UPDATE_SHA"
          curl -L --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/octet-stream' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/llhzx2018/vf-start/releases/assets/$UPDATE_ASSET_ID" -o /tmp/v2372-update.zip
          test "$(stat -c%s /tmp/v2372-update.zip)" = "$UPDATE_BYTES"
          test "$(sha256sum /tmp/v2372-update.zip | cut -d' ' -f1)" = "$UPDATE_SHA"
          unzip -t /tmp/v2372-update.zip >/dev/null
          printf 'P01_V2372_MANIFEST_GATE=PASS\nRELEASE_READBACK=PASS\nUPDATE_DOWNLOAD=PASS\nUPDATE_BYTES=%s\nUPDATE_SHA=%s\nFORMAL_SOURCE=%s\nOWNER_PRODUCTION_WRITE=NO\n' "$UPDATE_BYTES" "$UPDATE_SHA" "$FORMAL_SOURCE" | tee /tmp/p01-v2372-manifest-release.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-v2372-manifest-gate-${{ github.run_id }}
          path: |
            /tmp/p01-v2372-manifest-boundary.txt
            /tmp/p01-v2372-manifest-release.txt
          if-no-files-found: warn
          retention-days: 90
