name: S01 Theme108 Native Discovery Run Locator
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  locate:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Report S01 Theme108 public-safe native run IDs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api "repos/${{ github.repository }}/actions/runs?branch=task%2Fs01-theme108-native-discovery-20261011&per_page=30" --jq '.workflow_runs[] | select(.event=="push") | select(.name=="S01 native WP updater discovers Theme108 from 106/107 and M3U879") | [.id,.status,.conclusion,.head_sha,.html_url] | @tsv'
