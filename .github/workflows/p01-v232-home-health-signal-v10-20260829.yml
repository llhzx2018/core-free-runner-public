name: P01 V2.32 Home Health Signal Gate V10
on:
  push:
    branches: [task/p01-v232-home-command-center-20260829]
    paths:
      - .github/workflows/p01-v232-home-health-signal-v10-20260829.yml
      - scripts/p01-v232-home-health-signal-v10.sh
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PRODUCT: ${{ github.workspace }}/product
      ROOT: ${{ github.workspace }}/product/src
      PORT: '18642'
      ADMIN_PASS: 'P01V232!HomeGate'
      EVID: /tmp/p01-v232-home-evidence
      SOURCE: 68f6a37eddf529f99b1d064f750d86cd7a29016f
      SOURCE_TREE: 6a0d9fa28accc6bea2ee8e81745d6794cd89e17b
      BASE_SOURCE: f7c14b70dda991ac5fc8b25140eb558fd54009d6
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: 68f6a37eddf529f99b1d064f750d86cd7a29016f
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: V9 full Home regression on Health Signal candidate
        shell: bash
        run: bash runner/scripts/p01-v232-home-activity-rail-v9.sh
      - name: Upload V10 regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-v232-home-health-v10-regression-${{ github.run_id }}
          path: /tmp/p01-v232-home-evidence
          if-no-files-found: warn
          retention-days: 30

  health-signal:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PRODUCT: ${{ github.workspace }}/product
      ROOT: ${{ github.workspace }}/product/src
      PORT: '18642'
      ADMIN_PASS: 'P01V232!HomeGate'
      EVID: /tmp/p01-v232-health-evidence
      SOURCE: 68f6a37eddf529f99b1d064f750d86cd7a29016f
      SOURCE_TREE: 6a0d9fa28accc6bea2ee8e81745d6794cd89e17b
      DEVELOP_SOURCE: d1f09550b35b7f1f5b8023bb28538889d5e85111
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: 68f6a37eddf529f99b1d064f750d86cd7a29016f
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Health Signal canonical-state browser gate V10
        shell: bash
        run: bash runner/scripts/p01-v232-home-health-signal-v10.sh
      - name: Upload V10 Health Signal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-v232-home-health-v10-signal-${{ github.run_id }}
          path: /tmp/p01-v232-health-evidence
          if-no-files-found: warn
          retention-days: 30
