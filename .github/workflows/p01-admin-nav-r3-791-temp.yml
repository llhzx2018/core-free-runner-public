name: p01-admin-nav-r3-791-temp

on:
  push:
    branches:
      - run/p01-admin-nav-r3-791

permissions:
  contents: read

jobs:
  admin-nav-r3:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact P01 candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: e1901fc85b305d3969a039630104852adc2a6b1f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: vf-start
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd
          coverage: none

      - name: Exact source and syntax
        shell: bash
        run: |
          set -euo pipefail
          cd vf-start
          test "$(git rev-parse HEAD)" = "e1901fc85b305d3969a039630104852adc2a6b1f"
          find src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          echo P01_ADMIN_NAV_R3_SYNTAX=PASS

      - name: Focused navigation contracts
        shell: bash
        run: |
          set -euo pipefail
          cd vf-start
          php tests/unit/admin_secondary_nav_focus_contract.php
          php tests/unit/admin_navigation_consistency_contract.php
          php tests/unit/advanced_manager_daily_entry_contract.php
          php tests/unit/admin_backend_closure_contract.php
          php tests/unit/admin_overview_ia_contract.php
          php tests/unit/data_recovery_desktop_disclosure_contract.php
          php tests/unit/admin_visual_system_r3_contract.php
          php tests/unit/shared_admin_detail_language_contract.php
          echo P01_ADMIN_NAV_R3_CONTRACTS=PASS

      - name: Fresh install and Common Baseline
        shell: bash
        run: |
          set -euo pipefail
          TEST_PASSWORD=$(python3 -c "import secrets; print('Aa1!'+secrets.token_urlsafe(24))")
          echo "::add-mask::$TEST_PASSWORD"
          echo "TEST_PASSWORD=$TEST_PASSWORD" >> "$GITHUB_ENV"
          rm -rf /tmp/p01-admin-nav-r3
          cp -a vf-start/src /tmp/p01-admin-nav-r3
          cd /tmp/p01-admin-nav-r3
          php -S 127.0.0.1:18104 -t . >/tmp/p01-admin-nav-r3-server.log 2>&1 &
          echo $! >/tmp/p01-admin-nav-r3.pid
          for i in $(seq 1 30); do
            if curl -fsS -c /tmp/p01-admin-nav-r3.cookies -b /tmp/p01-admin-nav-r3.cookies http://127.0.0.1:18104/setup.php -o /tmp/p01-admin-nav-r3-setup.html; then break; fi
            sleep 1
          done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-admin-nav-r3-setup.html',encoding='utf-8').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s)
          assert m
          print(m.group(1))
          PY
          )
          curl -fsS -c /tmp/p01-admin-nav-r3.cookies -b /tmp/p01-admin-nav-r3.cookies -X POST http://127.0.0.1:18104/setup.php             --data-urlencode "setup_csrf=$CSRF"             --data-urlencode 'site_title=VF Admin Nav R3'             --data-urlencode "admin_password=$TEST_PASSWORD"             --data-urlencode "admin_password_confirm=$TEST_PASSWORD"             -o /tmp/p01-admin-nav-r3-setup-post.html
          test -f app/.runtime.php
          php cli/verify.php | tee /tmp/p01-admin-nav-r3-verify.txt
          grep -Fx 'VERIFY_PASS=YES' /tmp/p01-admin-nav-r3-verify.txt
          php cli/baseline-verify.php | tee /tmp/p01-admin-nav-r3-baseline.txt
          grep -Fx 'BASELINE_CORE_PASS=YES' /tmp/p01-admin-nav-r3-baseline.txt
          grep -Fx 'BASELINE_FULL_PASS=YES' /tmp/p01-admin-nav-r3-baseline.txt
          echo P01_ADMIN_NAV_R3_FRESH_BASELINE=PASS

      - name: Authenticated navigation smoke
        shell: bash
        run: |
          set -euo pipefail
          BASE=http://127.0.0.1:18104
          python3 - <<'PY' >/tmp/p01-admin-nav-r3-login.json
          import json,os
          print(json.dumps({"password":os.environ["TEST_PASSWORD"]}))
          PY
          curl -fsS -c /tmp/p01-admin-nav-r3.cookies -b /tmp/p01-admin-nav-r3.cookies             -H 'Content-Type: application/json' -X POST "$BASE/api.php?action=login"             --data-binary @/tmp/p01-admin-nav-r3-login.json             -o /tmp/p01-admin-nav-r3-login-result.json
          grep -F '"ok":true' /tmp/p01-admin-nav-r3-login-result.json >/dev/null

          for page in manage.php surface-manager.php transfer.php system-health.php update.php settings.php; do
            curl -fsS -c /tmp/p01-admin-nav-r3.cookies -b /tmp/p01-admin-nav-r3.cookies "$BASE/$page" -o "/tmp/p01-admin-nav-r3-$page.html"
          done

          # Exactly five top-level groups.
          test "$(grep -o 'class="vf-rail-item' /tmp/p01-admin-nav-r3-manage.php.html | wc -l | tr -d ' ')" = "5"

          # Resource defaults directly to Pending and exposes useful tasks in sidebar.
          grep -F 'href="surface-manager.php"' /tmp/p01-admin-nav-r3-surface-manager.php.html >/dev/null
          grep -F 'href="surface-manager.php?advanced=1"' /tmp/p01-admin-nav-r3-surface-manager.php.html >/dev/null
          grep -F 'href="links-admin.php"' /tmp/p01-admin-nav-r3-surface-manager.php.html >/dev/null
          grep -F 'href="health.php"' /tmp/p01-admin-nav-r3-surface-manager.php.html >/dev/null
          grep -F 'href="recycle-bin.php"' /tmp/p01-admin-nav-r3-surface-manager.php.html >/dev/null
          test "$(grep -o 'class="vf-rail-subitem' /tmp/p01-admin-nav-r3-surface-manager.php.html | wc -l | tr -d ' ')" = "5"

          # Data and System also expose direct task menus instead of hub detours.
          grep -F 'href="transfer.php"' /tmp/p01-admin-nav-r3-transfer.php.html >/dev/null
          grep -F 'href="browser-helper.php"' /tmp/p01-admin-nav-r3-transfer.php.html >/dev/null
          grep -F 'href="data-safety.php"' /tmp/p01-admin-nav-r3-transfer.php.html >/dev/null
          grep -F 'href="system-health.php"' /tmp/p01-admin-nav-r3-update.php.html >/dev/null
          grep -F 'href="update.php"' /tmp/p01-admin-nav-r3-update.php.html >/dev/null
          grep -F 'href="plugins.php"' /tmp/p01-admin-nav-r3-update.php.html >/dev/null

          # No decorative subgroup headings and no repeated page eyebrow.
          ! grep -F '系统收件箱' /tmp/p01-admin-nav-r3-surface-manager.php.html >/dev/null
          ! grep -F '业务分类' /tmp/p01-admin-nav-r3-surface-manager.php.html >/dev/null
          ! grep -F 'vf-admin-eyebrow' /tmp/p01-admin-nav-r3-update.php.html >/dev/null

          # Compatibility hubs redirect instead of adding an intermediate screen.
          test "$(curl -sS -o /dev/null -w '%{http_code}' -c /tmp/p01-admin-nav-r3.cookies -b /tmp/p01-admin-nav-r3.cookies "$BASE/resources.php")" = "302"
          test "$(curl -sS -o /dev/null -w '%{http_code}' -c /tmp/p01-admin-nav-r3.cookies -b /tmp/p01-admin-nav-r3.cookies "$BASE/data.php")" = "302"
          test "$(curl -sS -o /dev/null -w '%{http_code}' -c /tmp/p01-admin-nav-r3.cookies -b /tmp/p01-admin-nav-r3.cookies "$BASE/system.php")" = "302"

          echo P01_ADMIN_NAV_R3_HTTP=PASS

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/p01-admin-nav-r3.pid ]; then kill "$(cat /tmp/p01-admin-nav-r3.pid)" 2>/dev/null || true; fi
          rm -rf /tmp/p01-admin-nav-r3 /tmp/p01-admin-nav-r3*
