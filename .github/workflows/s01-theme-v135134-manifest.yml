name: S01-C01 v1.35.134 distribution candidate contract
on:
  push:
    branches: [task/s01-frontend-design-20261017]
    paths: ['.github/workflows/s01-theme-v135134-manifest.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          ref: release/s01-c01-v135134-distribution-20261018
          path: updates
          persist-credentials: false
      - name: Validate core-updates manifest schema and release identity
        run: |
          set -Eeuo pipefail
          cd updates
          python3 scripts/check_manifest_contract.py
          python3 - <<'PY'
          import json
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']=='1.35.134'
          assert m['release_tag']=='v1.35.134'
          assert m['asset_name']=='vf-tools-theme_V1.35.134.zip'
          assert m['asset_bytes']==1952247
          assert m['asset_sha256']=='0ac191879cdb88f95350b29e3539a6f9bbb165b06867d25169c44c355b2472de'
          assert m['runtime_files']==476
          assert '1.35.133' in m['from_versions']
          assert 'runtime_fingerprint' not in m
          print('S01_C01_DISTRIBUTION_CANDIDATE_CONTRACT=PASS')
          PY
