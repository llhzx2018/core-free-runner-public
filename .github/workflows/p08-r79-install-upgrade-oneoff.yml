name: P08 R79 new setup fields optional GitHub credential and old Atomic regression
on:
  push:
    branches: [test/p08-r79-owner-install-20261113]

permissions:
  contents: read

jobs:
  r77-owner-browser-two-click-https-github-wire:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      P08_ISOLATED_INSTALL_TEST: YES
      P08_R71_REAL_ZIP_TEST: YES
      P08_R73_ISOLATED_BROWSER: YES
      P08_R77_BROWSER: YES
      P08_R79_INSTALL_BROWSER: YES
      P08_R78_DIAG: NO
    steps:
      - name: Check independent machine/test-site scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = llhzx2018/core-free-runner-public
          test "$GITHUB_REF_NAME" = test/p08-r79-owner-install-20261113
          echo 'P08_R71_PUBLIC_SAFE_SYNTHETIC_FIXTURE=YES'
          echo 'P08_R71_PRODUCTION_AND_FORMAL_RELEASE=NO'
      - name: Read the EXACT P08 PR22 private commit and both predecessor source commits
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: a8e1c9c700fd067ff6e4ae404166d6f06138809a
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Native PHP 8.4 Composer/SQLite/ZIP/sodium
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: sqlite3,pdo_sqlite,zip,curl,sodium,mbstring,dom,xml,intl,bcmath,fileinfo
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: R75 Owner preparation controllers, job refusal, and Cron logging source tests
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail
          php -l src/Upgrade/OwnerUpgradePreparation.php
          php -l app/Http/Controllers/OwnerReleaseDiscoveryController.php
          php -l app/Http/Controllers/OwnerUpgradeController.php
          php -l src/Upgrade/owner-upgrade-worker.php
          php tests/test_owner_upgrade_transport.php
          php tests/test_owner_release_discovery_controller.php
          php tests/test_owner_upgrade_preparation.php
          php tests/test_owner_upgrade_worker_cron.php
          php -l public/setup.php
          php -l src/Installation/SetupGuard.php
          php -l src/Installation/OwnerWebInstaller.php
          php -l src/Upgrade/OwnerGitHubReadToken.php
          php -l app/Http/Controllers/AuthController.php
          php -l app/Http/Controllers/OwnerGitHubTokenController.php
          php -l tests/test_setup_guard.php
          php -l tests/test_setup_experience_contract.php
          bash -n tests/compatibility/run_r79_first_install_browser.sh
          python3 -m py_compile tests/compatibility/p08_r79_local_token_repo_proxy.py
          test -f tests/e2e/owner-first-setup-browser.spec.ts
          php tests/test_setup_guard.php
          php tests/test_setup_experience_contract.php
          php tests/test_owner_github_read_token.php
          echo 'P08_R79_INSTALL_FIELDS_OPTIONAL_TOKEN_AND_REVOKE_SOURCE_TESTS=PASS'
          bash tests/test_cloudpanel_owner_cron_install.sh
          python3 scripts/check_bridge_runtime_parity.py
          echo 'P08_R75_OWNER_PREPARATION_CONTROLLER_CRON_AND_PIN_SOURCE_TESTS=PASS'
      - name: Verify exact source identities and test script syntax
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = a8e1c9c700fd067ff6e4ae404166d6f06138809a
          test "$(cat VERSION)" = 0.1.1
          git cat-file -e 956c4d2144915e392d745f6ddbbad3c7e1c21442^{commit}
          git cat-file -e 55ecbc8461a4d90fe7241a00caffa55e557cde1c^{commit}
          php -l tests/compatibility/p08_r71_real_flat_bridge_atomic.php
          php -l tests/compatibility/p08_r71_real_atomic_post_bridge.php
          bash -n tests/compatibility/run_r75_browser_fpm.sh
          php -l tests/compatibility/p08_r77_browser_wire_fixture.php
          php -l tests/compatibility/p08_r78_preparation_diagnostic_worker.php
          php -l tests/test_upgrade_throttle_isolation.php
          php -l tests/test_php_minimum_runtime.php
          php tests/test_upgrade_throttle_isolation.php
          php tests/test_php_minimum_runtime.php
          python3 scripts/check_stack_contract.py --phase foundation
          composer validate --no-check-publish --strict
          python3 -m py_compile tests/compatibility/p08_r77_local_api_proxy.py
          bash -n tests/compatibility/run_r77_browser_two_clicks.sh
          bash -n tests/compatibility/run_r77_browser_php84_cli.sh
          test -f tests/e2e/owner-real-official-preparation.spec.ts
          test -f tests/e2e/owner-real-atomic-click.spec.ts
          echo 'P08_R71_EXACT_P08_SOURCE_AND_OLD_BRIDGE_HISTORY=PASS'
      - name: Actual two FULL + Atomic from locked Composer/Vite Git sources
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail
          python3 scripts/build_owner_atomic_pair.py \
            --repo "$PWD" \
            --target-sha a8e1c9c700fd067ff6e4ae404166d6f06138809a \
            --output-dir "$RUNNER_TEMP/p08-r71-real-artifacts"
          python3 scripts/verify_owner_atomic_pair.py \
            "$RUNNER_TEMP/p08-r71-real-artifacts" \
            956c4d2144915e392d745f6ddbbad3c7e1c21442 a8e1c9c700fd067ff6e4ae404166d6f06138809a
          echo 'P08_R71_REAL_BRIDGE_TARGET_UPDATE_PACKAGE_PAIR=PASS'
      - name: Independently build true historical flat 0.1.0 Owner FULL
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail
          mkdir "$RUNNER_TEMP/p08-r71-flat-src"
          git archive --format=tar 55ecbc8461a4d90fe7241a00caffa55e557cde1c | \
            tar -xf - -C "$RUNNER_TEMP/p08-r71-flat-src"
          test "$(cat "$RUNNER_TEMP/p08-r71-flat-src/VERSION")" = 0.1.0
          cd "$RUNNER_TEMP/p08-r71-flat-src"
          composer install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress --classmap-authoritative >/dev/null
          npm ci --no-audit --no-fund >/dev/null
          npm run build >/dev/null
          cd "$GITHUB_WORKSPACE/source"
          # Use the immutable legacy 0.1.0 builder, not the newer 0.1.1
          # builder whose added runtime cache member did not yet exist in 0.1.0.
          # This is a true old-source FULL, not a fabricated metadata patch.
          python3 "$RUNNER_TEMP/p08-r71-flat-src/scripts/build_full.py" \
            --source "$RUNNER_TEMP/p08-r71-flat-src" \
            --output "$RUNNER_TEMP/p08-r71-old-flat-full.zip" \
            --version 0.1.0 \
            --source-sha 55ecbc8461a4d90fe7241a00caffa55e557cde1c
          echo 'P08_R71_GENUINE_PRE_BRIDGE_FLAT_0_1_0_FULL=PASS'
      - name: Install actual old and Bridge FULL bytes in two disposable root instances
        shell: bash
        run: |
          set -Eeuo pipefail
          for x in p08-r71-site-success p08-r71-bridge; do
            mkdir "$RUNNER_TEMP/$x"
          done
          unzip -q "$RUNNER_TEMP/p08-r71-old-flat-full.zip" -d "$RUNNER_TEMP/p08-r71-site-success"
          unzip -q "$RUNNER_TEMP/p08-r71-real-artifacts/VF_AdOps_V0.1.0_BRIDGE_FULL.zip" -d "$RUNNER_TEMP/p08-r71-bridge"
          echo 'P08_R71_OLD_SITE_AND_BRIDGE_REAL_FULL_EXTRACTED=PASS'
      - name: Real old 0.1.0 Owner install to versioned Bridge, WITHOUT any preexisting signed stage
        shell: bash
        run: |
          set -Eeuo pipefail
          php source/tests/compatibility/p08_r71_real_flat_bridge_atomic.php \
            "$RUNNER_TEMP/p08-r71-site-success" \
            "$RUNNER_TEMP/p08-r71-bridge" \
            "$RUNNER_TEMP/p08-r71-real-artifacts/VF_AdOps_V0.1.1_UPDATE.zip" \
            55ecbc8461a4d90fe7241a00caffa55e557cde1c \
            956c4d2144915e392d745f6ddbbad3c7e1c21442 \
            a8e1c9c700fd067ff6e4ae404166d6f06138809a success
          test ! -e "$RUNNER_TEMP/p08-r71-site-success/storage/app/private/adops/upgrade/owner-preparation.json"
          test ! -e "$RUNNER_TEMP/p08-r71-site-success/storage/app/private/adops/upgrade/approved-offer.json"
          test ! -e "$RUNNER_TEMP/p08-r71-site-success/storage/app/private/adops/upgrade/owner-job.json"
          echo 'P08_R77_REAL_FLAT_TO_BRIDGE_WITH_NO_PRESTAGED_OFFER=PASS'
      - name: Install real Nginx and Chromium, use locked PHP 8.4 CLI SAPI (no Launchpad PPA)
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nginx >/dev/null
          php -v | head -n 1
          php -r 'if (PHP_VERSION_ID < 80401) exit(1);'
          php -m | grep -E '^pdo_sqlite|^PDO|^curl|^zip|^sodium' || true
          nginx -v
          npm ci --no-audit --no-fund >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          echo 'P08_R77_ISOLATED_NGINX_CHROMIUM_NATIVE_PHP84_CLI_DEPENDENCIES=PASS'
      - name: R79 real NEW 0.1.1 FULL first install Nginx local HTTPS Chromium and SQLite Owner login
        shell: bash
        run: |
          set -Eeuo pipefail
          bash source/tests/compatibility/run_r79_first_install_browser.sh
          echo 'P08_R79_REAL_FIRST_INSTALL_BROWSER_SQLITE_OWNER_AND_SETUP_LOCK=PASS'
      - name: Literal Nginx TLS Chromium 2 Owner clicks, PHP8.4 CLI website + separate native Worker Atomic
        shell: bash
        run: |
          set -Eeuo pipefail
          bash source/tests/compatibility/run_r77_browser_php84_cli.sh \
            "$RUNNER_TEMP/p08-r71-site-success" \
            "$RUNNER_TEMP/p08-r71-bridge" \
            a8e1c9c700fd067ff6e4ae404166d6f06138809a
          echo 'P08_R77_BROWSER_2_CLICKS_PHP84_CLI_NATIVE_SQLITE_ATOMIC=PASS'
      - name: Remove all unshipped private code, credentials and transient ZIPs
        if: always()
        shell: bash
        run: |
          rm -rf source \
            "$RUNNER_TEMP/p08-r71-flat-src" \
            "$RUNNER_TEMP/p08-r71-real-artifacts" \
            "$RUNNER_TEMP/p08-r71-site-success" \
            "$RUNNER_TEMP/p08-r71-bridge" \
            "$RUNNER_TEMP/p08-r77-browser-fixture" \
            "$RUNNER_TEMP/p08-r77-nginx-fpm" \
            "$RUNNER_TEMP/p08-r79-first-install" \
            "$RUNNER_TEMP/p08-r79-install-browser"
          rm -f "$RUNNER_TEMP/p08-r71-old-flat-full.zip" \
            "$RUNNER_TEMP/r71-offer-success.json" "$RUNNER_TEMP/r71-sig-success.txt" \
            "$RUNNER_TEMP/r71-offer-fault-after-swap.json" "$RUNNER_TEMP/r71-sig-fault-after-swap.txt" \
            "$RUNNER_TEMP/p08-r71-http.log" "$RUNNER_TEMP/p08-r71-health-body" \
            "$RUNNER_TEMP/p08-r71-success-output.txt" "$RUNNER_TEMP/p08-r71-fault-output.txt"
          echo 'P08_R73_PUBLIC_PRIVATE_SOURCE_AND_SITE_DATA_PERSISTED=NO'
