name: S01 Theme Preview168 exact formal release
on:
  push:
    branches: [task/s01-render-verify-20261022]
    paths: ['.github/workflows/s01-preview168-formal.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.168
  TARGET_SHA: e83159b14373b010f89a5dbedc6f102ab790ccfb
  TARGET_TREE: 555b9d9abd4c46f2f869021ad45c615a9fc88c63
  CANDIDATE_SHA: b0e3c2cc16584f248d0b5c4a386a279b0cf66a4d
  PACKAGE_HASH: a311f6cb4f51d90686304282736892a1743958fae350f781eefd75219c1ca324
  PACKAGE_BYTES: 1971638
jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: e83159b14373b010f89a5dbedc6f102ab790ccfb
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - name: Tested tree exactly equals merged main and pinned machine receipts
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p provider proof
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git -C target rev-parse "$CANDIDATE_SHA^{tree}")" = "$TARGET_TREE"
          test "$(gh api repos/$TARGET_REPO/commits/main --jq .sha)" = "$TARGET_SHA"
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/39723756095 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/39724236369 --jq .conclusion)" = success
          python3 control/lanes/s01-render166/package.py
          echo "$PACKAGE_HASH  provider/vf-tools-theme_V1.35.168.zip" | sha256sum -c
          test "$(stat -c %s provider/vf-tools-theme_V1.35.168.zip)" = "$PACKAGE_BYTES"
          echo THEME168_MERGED_TREE_EXACT_TESTED_SOURCE_PASS
      - name: Formal GitHub Theme release
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.35.168 --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create v1.35.168 provider/vf-tools-theme_V1.35.168.zip --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Theme V1.35.168' --notes '视觉验收不再对没有可用真实URL的内容页伪造首页预览或借用不同语言链接；预览入口明确不可用。原验收证据、运行接口和 Theme/Ops/M3U8 数据保持不变。PHP/Chromium、WordPress原生安装、167→168升级回退及数据保护已通过。Production仅Owner手工升级，手机测试暂缓。' --latest
          fi
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/v1.35.168 --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh release view v1.35.168 --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - name: Remote GitHub ZIP byte proof
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download v1.35.168 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.168.zip --dir remote
          cmp provider/vf-tools-theme_V1.35.168.zip remote/vf-tools-theme_V1.35.168.zip
          echo "$PACKAGE_HASH  remote/vf-tools-theme_V1.35.168.zip" | sha256sum -c
          test "$(stat -c %s remote/vf-tools-theme_V1.35.168.zip)" = "$PACKAGE_BYTES"
          gh release view v1.35.168 --repo "$TARGET_REPO" --json url,publishedAt,tagName > proof/release168.json
          echo THEME168_REMOTE_RELEASE_BYTES_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          path: proof/
          name: s01-preview168-formal
          retention-days: 14
      - name: Cleanup
        if: always()
        run: rm -rf target provider remote
