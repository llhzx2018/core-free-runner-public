name: TEMP S01-C02 Ops 1.21.836 Build Checkpoint Gate
on:
  push:
    branches:
      - temp/s01-c02-v121836-build-checkpoint-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121836-build-checkpoint-gate.yml'
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE: e1195a4c5c5eaf7b53565973413a8273a8fa3f48
      CANDIDATE: faa87ef7c5073ce5f776d7b10a9f54cf9a63a8c3
      TREE: 88e479893343d0851b8af6e8c4ac8e7679e225d9
      RUNNER_MAIN: 0160b557ad4ae0e8c6acd97e7551285bc05870bd
    steps:
      - name: Checkout exact Product candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.CANDIDATE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops
      - name: Verify identity syntax phase3 and exact five-file scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$CANDIDATE"
          test "$(git -C ops rev-parse HEAD^{tree})" = "$TREE"
          test "$(tr -d '\r\n' < ops/VERSION)" = 1.21.836
          php -l ops/includes/release/builders/class-candidate-batch-builder.php >/dev/null
          php -l ops/includes/site-release/s01-static-build-checkpoint-retry-v121836.php >/dev/null
          php -l ops/vf-ops.php >/dev/null
          php -l ops/.github/phase3/v121836-build-checkpoint-recovery.php >/dev/null
          php ops/.github/phase3/v121836-build-checkpoint-recovery.php | grep -Fxq PASS_V121836_BUILD_CHECKPOINT_RECOVERY
          mapfile -t files < <(git -C ops diff --name-only "$BASE" "$CANDIDATE" | sort)
          expected=(
            .github/phase3/v121836-build-checkpoint-recovery.php
            VERSION
            includes/release/builders/class-candidate-batch-builder.php
            includes/site-release/s01-static-build-checkpoint-retry-v121836.php
            vf-ops.php
          )
          test "${#files[@]}" = "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${files[$i]}" = "${expected[$i]}"; done
          git -C ops diff --check "$BASE" "$CANDIDATE"
      - name: Verify checkpoint recovery remains fail-closed
        shell: bash
        run: |
          set -Eeuo pipefail
          b=ops/includes/release/builders/class-candidate-batch-builder.php
          r=ops/includes/site-release/s01-static-build-checkpoint-retry-v121836.php
          p=ops/includes/release/async-job-parts/04-stage-pipeline-trait.php
          grep -Fq 'public static function run_next_stage(array $job): array' "$p"
          grep -Fq 'private static function checkpoint_job_v121836(array &$job, array $state): void' "$b"
          grep -Fq 'VF_Ops_Release_Async_Job::save($job);' "$b"
          test "$(grep -Fc 'self::checkpoint_job_v121836($job, $state);' "$b")" -ge 6
          python3 - <<'PY'
          from pathlib import Path
          s=Path('ops/includes/release/builders/class-candidate-batch-builder.php').read_text()
          assert s.index("$state['offset'] = max($start, $cursor);") < s.index("self::checkpoint_job_v121836($job, $state);\n        if ((int)$state['offset'] < (int)$state['total'])")
          assert s.index("$state['helper_phase'] = 'helper_zip_open';") < s.index("$state['helper_phase'] = 'resource_backfill';") < s.index("$state['helper_phase'] = 'helper_write';") < s.index("$state['helper_phase'] = 'helper_zip_close';")
          PY
          grep -Fq 'BUILD_CHECKPOINT_PRIOR_BOUNDARY_NOT_CURRENT' "$r"
          grep -Fq 'BUILD_CHECKPOINT_PRIOR_SIGNATURE_CHANGED' "$r"
          grep -Fq 'BUILD_CHECKPOINT_SOURCE_MISMATCH' "$r"
          grep -Fq 'BUILD_CHECKPOINT_FRESH_CANDIDATE_CREATED' "$r"
          grep -Fq 'vf_ops_s01_static_zero_write_retry_start_v121834()' "$r"
          grep -Fq 'hash_file' "$r"
          ! grep -Eq 'wp_insert_post|wp_update_post|TRUNCATE|DROP TABLE|candidatePackageReady[[:space:]]*=[[:space:]]*true|finalOnlinePass[[:space:]]*=[[:space:]]*["'"']YES["'"']' "$r"
      - name: Verify Product authority before promotion
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/main --jq .object.sha)" = "$BASE"
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/develop --jq .object.sha)" = "$BASE"
      - name: Verify Production 1.21.835 boundary truth
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-domain-authority' -o /tmp/domain.json
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-static-candidate-readiness' -o /tmp/static.json
          jq -e '.pluginVersion=="1.21.835" and .status=="CURRENT" and .authorityFinalHost=="https://ilovem3u8.com" and .configuredPublicBaseUrl=="https://ilovem3u8.com" and .authorityMatch==true' /tmp/domain.json >/dev/null
          jq -e '.pluginVersion=="1.21.835" and .sourceArtifactAvailable==true and .manualSourceUploadRequired==false and .candidatePackageReady==false and .finalOnlinePass=="NO"' /tmp/static.json >/dev/null
          jq -e '.sourceRecoveryHelperFinalizeStatus=="blocked" and .sourceRecoveryHelperFinalizeCode=="helper_finalize_boundary_not_proven" and .sourceRecoveryHelperFinalizeOldBuildOffset==225 and .sourceRecoveryHelperFinalizeOldBuildTotal==231' /tmp/static.json >/dev/null
          jq -e '.sourceRecoveryZeroWriteRetryCandidateStatus=="fail" and .sourceRecoveryZeroWriteRetryCandidateCurrentStage==4 and .sourceRecoveryZeroWriteRetryCandidateAuditFailureCount==0 and .sourceRecoveryZeroWriteRetryCandidateFailureClass=="candidate_build_unclassified"' /tmp/static.json >/dev/null
      - name: Verify runner main untouched
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git ls-remote https://github.com/llhzx2018/core-free-runner-public.git refs/heads/main | awk '{print $1}')" = "$RUNNER_MAIN"
      - name: Seal result
        run: echo PASS_V121836_BUILD_CHECKPOINT_GATE
