name: P07 Ops Console R9 Exact-source Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-ops-console-r9-exact-gate.yml'

permissions:
  contents: read

jobs:
  exact-source-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Verify private read capability
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN"

      - name: Checkout exact private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: ce1eef43be03efe02fb9a2c50a1b8d41c1e74418
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Identity and syntax
        working-directory: source
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 'ce1eef43be03efe02fb9a2c50a1b8d41c1e74418'
          test "$(cat BUILD_ID)" = '0.1.0-release9'
          for f in bin/vfops-user bin/vfops-diagnostics-ui bin/vfops-history-ui bin/vfops-selfcheck-ui bin/vfops-init-ui bin/vfops-auto-backup bin/vfops-migrate-ui lib/terminal_ui.sh lib/cloudpanel_ui_admin.sh lib/cloudpanel_ui_sites.sh; do bash -n "$f"; done
          python3 -m py_compile lib/ops_diagnostics.py lib/ops_history.py tests/test_ops_console_r9.py

      - name: Ops Console focused tests
        working-directory: source
        run: |
          set -Eeuo pipefail
          export PYTHONPATH="$PWD/lib"
          python3 -m unittest -v tests.test_ops_console_r9 tests.test_main_menu_routes tests.test_terminal_ui_color_contract tests.test_p07_integration_manifest

      - name: Product contracts
        working-directory: source
        run: |
          set -Eeuo pipefail
          grep -Fq '状态摘要：' bin/vfops-user
          grep -Fq '8) run_module "$DIAG_UI"' bin/vfops-user
          grep -Fq '9) run_module "$HISTORY_UI"' bin/vfops-user
          grep -Fq '10) run_module "$SELFCHECK_UI"' bin/vfops-user
          grep -Fq '11) run_module "$INIT_UI"' bin/vfops-user
          grep -Fq 'ui_confirm_exact CUTOVER' bin/vfops-migrate-ui
          grep -Fq 'DISABLE-AUTOBACKUP' bin/vfops-auto-backup
          grep -Fq 'APPLY_BASELINE' bin/vfops-init-ui
          grep -Fq 'INSTALL_CLOUDPANEL' bin/vfops-init-ui
          grep -Fq 'ui_confirm_exact REPAIR' bin/vfops-selfcheck-ui
          grep -Fq 'Ops Console V1' docs/authority/RPD.md

      - name: Full Slot3 regressions
        working-directory: source
        run: |
          set -Eeuo pipefail
          export PYTHONPATH="$PWD/lib"
          bash tests/smoke.sh >/tmp/p07-smoke.log 2>&1
          python3 -m unittest discover -s tests -p 'test_*.py' -q

      - name: Machine and secret boundary
        working-directory: source
        run: |
          set -Eeuo pipefail
          NO_COLOR=1 bash bin/vfops-user --version | grep -Fx 'VF Server Ops 0.1.0'
          NO_COLOR=1 bash bin/vfops-user --build-id | grep -Fx '0.1.0-release9'
          ! NO_COLOR=1 bash bin/vfops-user --version | grep -q $'\033'
          python3 scripts/secret_scan.py --root . >/tmp/p07-secret-scan.log 2>&1

      - name: Result
        if: always()
        run: |
          echo 'P07_OPS_CONSOLE_R9_SOURCE=ce1eef43be03efe02fb9a2c50a1b8d41c1e74418'
          echo 'P07_PRODUCTION_WRITE=NOT_RUN'
          echo 'P07_DNS_WRITE=NOT_RUN'
          echo 'P07_SOURCE_DELETE=NOT_RUN'
