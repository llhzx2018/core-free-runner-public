name: S01-C02 1.21.931 R42 Exact Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/s01-c02-121931-r42-exact-gate.yml'

permissions:
  contents: read

jobs:
  exact-source-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      TARGET_REPOSITORY: llhzx2018/vf-tools-ops
      TARGET_SHA: 90ea9ba46b81c58183504a2f840ada45f31d32f0
      EXPECTED_VERSION: 1.21.931
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Prove runner start
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "RUNNER_START=PASS"
          echo "TARGET_SHA=$TARGET_SHA"

      - name: Verify transient private read capability
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN" || { echo "RUNNER_INFRASTRUCTURE_BLOCK=VF_PRIVATE_READ_TOKEN_MISSING"; exit 78; }
          echo "TRANSIENT_PRIVATE_READ_CAPABILITY=PASS"

      - name: Checkout exact product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target

      - name: Verify exact identity
        shell: bash
        run: |
          set -Eeuo pipefail
          cd target
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "$EXPECTED_VERSION"
          grep -Fq "Version: $EXPECTED_VERSION" vf-ops.php
          grep -Fq "VF_OPS_VERSION', '$EXPECTED_VERSION'" vf-ops.php
          grep -Fq "S01-SHELL-HEADER-HIERARCHY-CLOSURE-R42" vf-ops.php
          echo "EXACT_SOURCE_IDENTITY=PASS"

      - name: Install PHP CLI
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli >/dev/null
          php -v | head -n 1

      - name: PHP syntax gate
        shell: bash
        run: |
          set -Eeuo pipefail
          find target -type f -name '*.php' -not -path '*/vendor/*' -print0 |
            xargs -0 -n1 php -l > php-lint.log
          echo "PHP_FILES_LINTED=$(wc -l < php-lint.log | tr -d ' ')"
          echo "PHP_LINT=PASS"

      - name: R42 exact contract
        shell: bash
        run: |
          set -Eeuo pipefail
          php target/tests/s01-c02-121931-shell-header-hierarchy-r42-contract.php | tee r42-contract.log
          grep -Fq "R42 contract PASS" r42-contract.log
          echo "R42_CONTRACT=PASS"

      - name: Build minimum evidence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          target=Path("target")
          actual=""
          if (target/".git").exists():
              actual=subprocess.check_output(["git","-C","target","rev-parse","HEAD"],text=True).strip()
          version=(target/"VERSION").read_text(encoding="utf-8").strip() if (target/"VERSION").exists() else ""
          lint=Path("php-lint.log").read_text(encoding="utf-8") if Path("php-lint.log").exists() else ""
          contract=Path("r42-contract.log").read_text(encoding="utf-8") if Path("r42-contract.log").exists() else ""
          payload={
            "schema":"vf-runner/s01-c02-r42-exact-gate-v1",
            "target_repository":os.environ["TARGET_REPOSITORY"],
            "expected_sha":os.environ["TARGET_SHA"],
            "actual_sha":actual,
            "version":version,
            "exact_source_identity":actual==os.environ["TARGET_SHA"] and version==os.environ["EXPECTED_VERSION"],
            "php_lint_pass":"No syntax errors detected" in lint,
            "php_files_linted":sum(1 for x in lint.splitlines() if x.strip()),
            "r42_contract_pass":"R42 contract PASS" in contract,
            "private_source_persisted":False,
            "secret_values_persisted":False
          }
          raw=json.dumps(payload,sort_keys=True,ensure_ascii=False).encode()
          payload["evidence_sha256"]=hashlib.sha256(raw).hexdigest()
          Path("evidence").mkdir(exist_ok=True)
          Path("evidence/s01-c02-r42-exact-gate.json").write_text(json.dumps(payload,indent=2,sort_keys=True,ensure_ascii=False),encoding="utf-8")
          print(json.dumps(payload,ensure_ascii=False))
          PY

      - name: Upload minimum evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: s01-c02-r42-exact-${{ github.run_id }}
          path: evidence/s01-c02-r42-exact-gate.json
          if-no-files-found: error
          retention-days: 14
