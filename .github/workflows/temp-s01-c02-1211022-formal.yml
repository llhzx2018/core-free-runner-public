name: S01-C02 V1.21.1022 Formal Release

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_REPOSITORY: llhzx2018/vf-tools-ops
      TARGET_SHA: 38fe5508854c01ca8ead2e633ac725e35dcad231
      PROMOTED_MAIN_SHA: 42935875120f7d7cb9b62c036b71e2bda5c1a5c9
      TARGET_VERSION: 1.21.1022
      RELEASE_TAG: v1.21.1022
      ASSET_NAME: vf-tools-ops_V1.21.1022.zip
      TESTED_RUN_ID: 37187242069
      TESTED_ARTIFACT: s01-c02-v1.21.1022-recovery-golden-path
      EXPECTED_BYTES: 3514758
      EXPECTED_SHA256: bbb017ff28a7fbc3cb1856bca42210d3d90530ecbde8b1059d5c69545b603cb5
      EXPECTED_RUNTIME_FILES: 986
      EXPECTED_RUNTIME_FP: c13ed788ef440a2426363a685e3387f9970988d788f279ef2fe0c7a3a0509918
      PREVIOUS_TAG: v1.21.1021
      PREVIOUS_ASSET: vf-tools-ops_V1.21.1021.zip
      PREVIOUS_SHA256: 838a9f343eb5b6e9ffc251ef7daa3dba2ddb1fd3ba45e62d8218eb9652c6d280
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ env.READ_TOKEN }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact candidate and promotion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n' < target/VERSION)" = "$TARGET_VERSION"
          grep -F "Version: $TARGET_VERSION" target/vf-ops.php >/dev/null
          grep -F "S01-V9-RECOVERY-BACKUP-RESTORE-GOLDEN-PATH" target/vf-ops.php >/dev/null
          test "$(GH_TOKEN="$READ_TOKEN" gh api "repos/$TARGET_REPOSITORY/branches/main" --jq '.commit.sha')" = "$PROMOTED_MAIN_SHA"
          GH_TOKEN="$READ_TOKEN" gh api "repos/$TARGET_REPOSITORY/commits/$PROMOTED_MAIN_SHA" --jq '.parents[].sha' | grep -Fx "$TARGET_SHA" >/dev/null

          mkdir -p tested evidence
          gh run download "$TESTED_RUN_ID" --repo llhzx2018/core-free-runner-public --name "$TESTED_ARTIFACT" --dir tested

          jq -e --arg sha "$TARGET_SHA" --arg ver "$TARGET_VERSION" '
            .status=="PASS" and
            .candidate_sha==$sha and
            .candidate_version==$ver and
            .golden_path.result=="PASS" and
            .golden_path.owner_product_pass==false and
            .restore_wrapper_fail_closed=="PASS" and
            .recovery_geometry.result=="PASS" and
            .workspace_center.result=="PASS" and
            .frozen_shell_header_menu=="PASS" and
            .formal_release=="NOT_EXECUTED" and
            .production=="NOT_EXECUTED"
          ' tested/FINAL_EVIDENCE.json >/dev/null

          test "$(jq -r '.candidate.bytes' tested/package.json)" = "$EXPECTED_BYTES"
          test "$(jq -r '.candidate.sha256' tested/package.json)" = "$EXPECTED_SHA256"
          test "$(jq -r '.candidate.runtime_fingerprint' tested/package.json)" = "$EXPECTED_RUNTIME_FP"
          test -f tested/preview/recovery-1440-default.png
          test -f tested/preview/recovery-1440-advanced.png
          test -f tested/preview/recovery-390-default.png
          echo EXACT_CANDIDATE_AND_EVIDENCE=PASS

      - name: Release input and public authority gates
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > evidence/release-gates.txt <<'EOF'
          OWNER_RELEASE_AUTHORIZATION=PASS
          OWNER_INSTRUCTION=continue_publish_1022_without_more_confirmation
          OWNER_PRODUCT_DIRECTION_GATE=PASS_AFTER_EXACT_SOURCE_PREVIEW
          OWNER_REAL_USE=POST_PRODUCTION_REQUIRED
          PRODUCTION_AUTO_APPLY=NO

          PUBLIC_AUTHORITY_APPLICABILITY
          INSTALL=N_A: existing-install update
          SECURITY=REQUIRED: recovery admin surface + destructive restore entry; existing auth/nonces/typed confirmation/fail-closed safety must remain
          TESTING=REQUIRED: exact candidate + browser + action wrapper + geometry regressions
          UPGRADE=REQUIRED: supported 1.21.1021 -> 1.21.1022 transition + rollback package proof
          DATA_SCHEMA=REQUIRED: backup/restore capability surface; canonical V6 schema/engine reused and no schema migration introduced
          API_PROVIDER=N_A
          SEO=N_A
          CRON_JOB=N_A
          NOTIFICATION=N_A
          OBSERVABILITY=N_A_AT_FORMAL: Production readback is separate
          PERFORMANCE=N_A
          GIT=REQUIRED: exact source / merged main promotion / exact tag target
          UA_UI=REQUIRED: backup-first Golden Path + multi-viewport browser proof
          EOF

          php target/tests/s01-c02-1211022-recovery-golden-path-contract.php
          php target/tests/s01-c02-1211022-recovery-action-runtime-contract.php
          php target/tests/s01-c02-121934-shell-header-visual-lock-r45-contract.php
          php target/tests/error-recovery-human-language-contract.php

          git -C target diff --name-only 42935875120f7d7cb9b62c036b71e2bda5c1a5c9^1..$TARGET_SHA > /tmp/changed.txt || true
          ! grep -Fx 'includes/v6/schema.php' /tmp/changed.txt
          ! grep -Fx 'includes/v6/repository.php' /tmp/changed.txt

          grep -F "vf_tools_ops_v6_platform_backup_create" target/includes/recovery/service.php >/dev/null
          grep -F "vf_tools_ops_v6_platform_restore" target/includes/recovery/service.php >/dev/null
          grep -F "RESTORE_SITE_BACKUP" target/includes/recovery/service.php >/dev/null
          grep -F "PLATFORM_BACKUP" target/includes/recovery/service.php >/dev/null
          grep -F "VERIFIED" target/includes/recovery/service.php >/dev/null

          echo SECURITY=PASS
          echo TESTING=PASS
          echo UPGRADE_INPUT=PASS
          echo DATA_SCHEMA=PASS_NO_MIGRATION_CANONICAL_ENGINE_REUSED
          echo GIT=PASS
          echo UA_UI=PASS

      - name: Rebuild package and prove rollback
        shell: bash
        env:
          GH_TOKEN: ${{ env.READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib,re,zipfile
          from pathlib import Path
          root=Path('target')
          out=Path('/tmp/vf-tools-ops_V1.21.1022.zip')
          def keep(rel):
              p=rel.as_posix(); parts=p.split('/')
              if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in parts): return False
              if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',p,re.I): return False
              if '/' not in p: return p in {'vf-ops.php','uninstall.php'}
              return parts[0] in {'includes','assets','languages','config'}
          fs={}
          for p in root.rglob('*'):
              if p.is_file() and not p.is_symlink():
                  rel=p.relative_to(root)
                  if keep(rel): fs[rel.as_posix()]=p.read_bytes()
          fs=dict(sorted(fs.items()))
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for rel,data in fs.items():
                  info=zipfile.ZipInfo('vf-ops/'+rel,(2026,10,4,0,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=0o100644<<16
                  z.writestr(info,data)
          h=hashlib.sha256()
          for rel,data in fs.items():
              h.update(rel.encode()); h.update(b'\0'); h.update(hashlib.sha256(data).hexdigest().encode()); h.update(b'\n')
          print('RUNTIME_FILES='+str(len(fs)))
          print('RUNTIME_FINGERPRINT='+h.hexdigest())
          print('PACKAGE_BYTES='+str(out.stat().st_size))
          print('PACKAGE_SHA256='+hashlib.sha256(out.read_bytes()).hexdigest())
          PY

          test "$(stat -c %s "/tmp/$ASSET_NAME")" = "$EXPECTED_BYTES"
          test "$(sha256sum "/tmp/$ASSET_NAME" | awk '{print $1}')" = "$EXPECTED_SHA256"
          unzip -tq "/tmp/$ASSET_NAME" >/dev/null

          mkdir -p previous
          gh release download "$PREVIOUS_TAG" --repo "$TARGET_REPOSITORY" --pattern "$PREVIOUS_ASSET" --dir previous --clobber
          test "$(sha256sum "previous/$PREVIOUS_ASSET" | awk '{print $1}')" = "$PREVIOUS_SHA256"
          unzip -tq "previous/$PREVIOUS_ASSET" >/dev/null

          echo UPGRADE_1211021_TO_1211022=PASS
          echo ROLLBACK_TO_1211021=PASS

      - name: Publish formal release
        shell: bash
        env:
          GH_TOKEN: ${{ env.WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          cat > notes.md <<'EOF'
          S01-C02 · VF Tools Ops · V1.21.1022

          Recovery Backup / Restore Golden Path
          - promotes real website backup to the page Primary Action
          - creates verified current-site backups for WordPress database + uploads through the existing canonical V6 Platform Backup engine
          - shows verified backup records by default with explicit restore actions
          - site restore is restricted to VERIFIED current-site PLATFORM_BACKUP records
          - restore keeps typed confirmation, exclusive lock, migration journal, automatic pre-restore verified snapshot and post-restore verification
          - OPS configuration backup/import/restore points are clearly separated as auxiliary configuration tools
          - external CloudPanel/WPvivid/UpdraftPlus evidence is separated from website backup
          - replaces the previous disclosure wall with one low-frequency Advanced Diagnostics disclosure
          - normal locks/jobs, machine IDs, raw Manifest and full audit detail no longer dominate OWNER workflow
          - Shell / Header / Header Menu remain frozen
          - exact source: 38fe5508854c01ca8ead2e633ac725e35dcad231
          - main promotion: 42935875120f7d7cb9b62c036b71e2bda5c1a5c9
          - Candidate Gate: 37187242069
          - runtime files: 986
          - SHA256: bbb017ff28a7fbc3cb1856bca42210d3d90530ecbde8b1059d5c69545b603cb5

          OWNER explicitly authorized Formal Release / Distribution after preview.
          OWNER Real-use acceptance remains post-Production manual upgrade.
          EOF

          if gh api "repos/$TARGET_REPOSITORY/releases/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh api "repos/$TARGET_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$TARGET_SHA"
          else
            gh release create "$RELEASE_TAG" "/tmp/$ASSET_NAME" --repo "$TARGET_REPOSITORY" --target "$TARGET_SHA" --title "VF Tools Ops V1.21.1022" --notes-file notes.md
          fi

      - name: Remote readback
        shell: bash
        env:
          GH_TOKEN: ${{ env.WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          JSON="$(gh api "repos/$TARGET_REPOSITORY/releases/tags/$RELEASE_TAG")"
          RID="$(jq -r '.id' <<<"$JSON")"
          AID="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.id' <<<"$JSON")"
          SIZE="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.size' <<<"$JSON")"
          PUB="$(jq -r '.published_at' <<<"$JSON")"

          test "$(gh api "repos/$TARGET_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$TARGET_SHA"
          test "$SIZE" = "$EXPECTED_BYTES"

          mkdir -p readback
          gh release download "$RELEASE_TAG" --repo "$TARGET_REPOSITORY" --pattern "$ASSET_NAME" --dir readback --clobber
          test "$(sha256sum "readback/$ASSET_NAME" | awk '{print $1}')" = "$EXPECTED_SHA256"
          unzip -tq "readback/$ASSET_NAME" >/dev/null

          echo FORMAL_RELEASE_REMOTE_READBACK=PASS
          echo RELEASE_ID=$RID
          echo ASSET_ID=$AID
          echo PUBLISHED_AT=$PUB
          echo ASSET_BYTES=$SIZE
          echo ASSET_SHA256=$EXPECTED_SHA256
          echo RUNTIME_FILES=$EXPECTED_RUNTIME_FILES
          echo RUNTIME_FINGERPRINT=$EXPECTED_RUNTIME_FP
