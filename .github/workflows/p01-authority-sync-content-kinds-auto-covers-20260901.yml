name: P01 Authority Sync Content Kinds Auto Covers
on:
  push:
    branches: [temp/p01-authority-content-kinds-auto-covers-20260901]
    paths: [.github/workflows/p01-authority-sync-content-kinds-auto-covers-20260901.yml]
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: authority/p01-l2-content-kinds-auto-covers-20260901
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Exact base guard and authority-only sync
        shell: bash
        env:
          EXPECTED_BASE: 92169989e3b813328e85133ab9e05bafb8593d0c
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$EXPECTED_BASE"
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('product')
          source='92169989e3b813328e85133ab9e05bafb8593d0c'
          tree='b61812e83e2572ebe42f36991e40521b44e2447f'
          candidate='ccaf71e4c44d09f7f8c0e4d5ed28a405309aa3e9'
          gate=33413843464
          artifact=9766202398
          digest='ba1d96ca54d38b0e25cf7486fdba4dd3a30c975f6920dfd7e4fcd5031c03935a'
          diag=33413529979
          diag_artifact=9766087227
          diag_digest='726e6b1d9c34863413bb797719e8d1582d3ba721ccc535b369e2a1a088dbe92d'

          p=root/'VF_PROJECT.json'
          data=json.loads(p.read_text())
          data['status']='V2.35.3 PRODUCTION CLOSURE PASS / L2 CONTENT KINDS + AUTO COVERS PASS'
          data['current_change']={
            'change_id':'P01-L2-CONTENT-KINDS-AUTO-COVERS-20260901',
            'base':'PR #155 develop a429d2660c165feae51a46f2144f8de6bda3961f',
            'result':'CONTENT KIND / PROVIDER SEPARATION + AUTOMATIC LOCAL COVER CACHE PASS / MERGED TO DEVELOP / NOT RELEASED',
            'schema_change':False,
            'migration':None,
            'latest_merge_pr':157,
            'runtime_product_source':source,
            'runtime_product_tree':tree,
            'latest_product_candidate':candidate,
            'diagnostic_run':diag,
            'diagnostic_artifact':diag_artifact,
            'diagnostic_artifact_sha256':diag_digest,
            'machine_gate':gate,
            'evidence_artifact':artifact,
            'evidence_artifact_sha256':digest,
            'owner_production_write':False,
            'runner_main_write':False
          }
          data['develop_state']='L2 THROUGH PR #157 MERGED / CONTENT KINDS + AUTO COVERS PASS / AHEAD OF MAIN / NOT RELEASED'
          data['current_authority']=f'Owner Production V2.35.3 Closure PASS / main Production Truth / develop runtime source {source} tree {tree} / PR #157 content kinds + provider separation + automatic cover cache Gate {gate} PASS'
          data['next_action']='Continue evidence-driven L2 product optimization from the current Product runtime. Next prioritize explicit admin/public-view state clarity and anonymous privacy verification, then investigate sticky/filter overlap using real scroll evidence. Do not promote to main, publish a Release, mutate core-updates or write Owner Production without a separate formal Release Gate.'
          data['l2_content_kinds_auto_covers']={
            'pr':157,
            'superseded_draft_pr':156,
            'product_candidate':candidate,
            'develop_product_merge':source,
            'product_tree':tree,
            'scope_files':8,
            'taxonomy':'resource_kind = content kind; provider inferred separately from URL',
            'legacy_normalization':['YouTube -> 频道','movie -> 电影','series -> 剧集'],
            'cover_cache':'og:image / twitter:image discovery -> local resource_asset_files -> resource-cover.php',
            'manual_override_priority':'PASS',
            'pending_remote_fetch':'DENIED / PASS',
            'diagnostic_run':diag,
            'diagnostic_result':'REAL DOM CONTRACT DEFECT REPRODUCED: primary-open rewrote visual nodes and removed data-edit-id before hydration apply',
            'machine_gate':gate,
            'evidence_artifact':artifact,
            'evidence_artifact_sha256':digest,
            'browser_390_1440':'PASS',
            'anonymous_privacy':'PRIVATE CHANNEL HIDDEN + PRIVATE COVER DENIED + PUBLIC MOVIE/COVER VISIBLE / PASS',
            'sqlite_integrity_fk':'PASS',
            'schema_version':'2026082901 / UNCHANGED',
            'version':'2.35.3 / UNCHANGED',
            'state':'MERGED TO DEVELOP / MACHINE PASS / NOT RELEASED',
            'main_write':False,
            'production_write':False
          }
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')

          section=f'''\n\n## L2 DEVELOP · CONTENT KINDS + AUTOMATIC COVER CACHE · 2026-09-01\n\nPR #157 corrected the existing Channels / Watch model without creating a second media system. `resource_kind` is now content-kind semantics, while YouTube / Bilibili / 爱一帆 and other platforms are Provider/source metadata inferred from URL. Legacy persisted platform/type aliases normalize at read time. Missing channel/movie covers can be discovered from page metadata and cached locally through the existing resource asset store.\n\n```text\nPR: #157 / MERGED TO DEVELOP ONLY\nExact Product Candidate: {candidate}\nCurrent L2 runtime Product Source: {source}\nCurrent L2 runtime Product Tree: {tree}\nScope: 8 Product files / no Schema / Migration / version change\nR5 Diagnostic: {diag} / REAL DOM CONTRACT DEFECT REPRODUCED + DIAGNOSTIC PASS\nR5 Artifact: {diag_artifact}\nR5 Digest: sha256:{diag_digest}\nFormal R6 Gate: {gate} / PASS\nEvidence Artifact: {artifact}\nDigest: sha256:{digest}\nProduction main: 3a60430c3c74688f2db81f2fd08e7e8ecd986fc9 / UNCHANGED\nOwner Production: V2.35.3 / UNCHANGED\n```\n\nR5 proved the auto-cover request was firing with a valid CSRF and the missing-cover asset was in the queue, but `workspace-primary-open.js` had already rewritten the visual node and intentionally removed `data-edit-id`; the old hydration selector therefore could not find the card. The final fix targets the stable parent `data-asset-row` contract instead. R6 then passed taxonomy/provider semantics, automatic cover hydration, local cache/manual override behavior, Pending remote-fetch denial, Chromium 390/1440, anonymous private-channel/private-cover isolation, public movie/public-cover access, SQLite integrity and foreign keys. Draft PR #156 was closed only because the connected Ready-for-Review mutation had a connector schema incompatibility; it did not represent a different Product Source.\n'''

          p=root/'docs/authority/CURRENT.md'; s=p.read_text()
          s=s.replace('> 更新时间：2026-08-31','> 更新时间：2026-09-01',1)
          s=re.sub(r'> 状态：`[^`]+`','> 状态：`CURRENT / V2.35.3 PRODUCTION CLOSURE PASS / L2 CONTENT KINDS + AUTO COVERS PASS`',s,count=1)
          if '## L2 DEVELOP · CONTENT KINDS + AUTOMATIC COVER CACHE · 2026-09-01' not in s: s=s.rstrip()+section
          p.write_text(s.rstrip()+'\n')

          p=root/'docs/handoff/CURRENT_STATE.md'; s=p.read_text()
          s=s.replace('更新时间：2026-08-31','更新时间：2026-09-01',1)
          s=re.sub(r'Current L2 runtime Product Source: [0-9a-f]+',f'Current L2 runtime Product Source: {source}',s,count=1)
          s=re.sub(r'Current L2 runtime Product Tree: [0-9a-f]+',f'Current L2 runtime Product Tree: {tree}',s,count=1)
          s=re.sub(r'L2 Product State: .*', 'L2 Product State: #142-#157 MERGED TO DEVELOP / CONTENT KINDS + AUTO COVERS PASS / NOT RELEASED',s,count=1)
          if '## L2 DEVELOP · CONTENT KINDS + AUTOMATIC COVER CACHE · 2026-09-01' not in s: s=s.rstrip()+section
          p.write_text(s.rstrip()+'\n')

          p=root/'docs/evidence/P01_L2_PRODUCT_WAVE_DEVELOP_MERGE_20260831.md'; s=p.read_text()
          s=s.replace('Current Product Source on develop: 7a9e9fd3e2505e85d7aa5781da8b23db7d961a9f',f'Current Product Source on develop: {source}',1)
          s=s.replace('Current Product Tree: d322efb883301c4f79570372908a0319b21c45a3',f'Current Product Tree: {tree}',1)
          s=s.replace('Latest Product PR: #151 / MERGED','Latest Product PR: #157 / MERGED',1)
          old='The current develop-only Product runtime is source `7a9e9fd3e2505e85d7aa5781da8b23db7d961a9f` / tree `d322efb883301c4f79570372908a0319b21c45a3` after PR #151 Machine PASS.'
          new=f'The current develop-only Product runtime is source `{source}` / tree `{tree}` after PR #157 Machine PASS.'
          s=s.replace(old,new,1)
          if '## L2 DEVELOP · CONTENT KINDS + AUTOMATIC COVER CACHE · 2026-09-01' not in s: s=s.rstrip()+section
          p.write_text(s.rstrip()+'\n')
          PY
          python3 -m json.tool product/VF_PROJECT.json >/dev/null
          git -C product diff --check
          git -C product diff --name-only | sort | tee /tmp/changed.txt
          cat >/tmp/expected.txt <<'EOF'
          VF_PROJECT.json
          docs/authority/CURRENT.md
          docs/evidence/P01_L2_PRODUCT_WAVE_DEVELOP_MERGE_20260831.md
          docs/handoff/CURRENT_STATE.md
          EOF
          diff -u /tmp/expected.txt /tmp/changed.txt
          test -z "$(git -C product diff --name-only | grep '^src/' || true)"
          grep -F '92169989e3b813328e85133ab9e05bafb8593d0c' product/docs/authority/CURRENT.md >/dev/null
          grep -F '33413843464' product/docs/handoff/CURRENT_STATE.md >/dev/null
          git -C product config user.name VictorForge
          git -C product config user.email llhzx2018@gmail.com
          git -C product add VF_PROJECT.json docs/authority/CURRENT.md docs/handoff/CURRENT_STATE.md docs/evidence/P01_L2_PRODUCT_WAVE_DEVELOP_MERGE_20260831.md
          git -C product commit -m 'docs(P01): record content kinds and auto cover closure'
          git -C product push origin HEAD:authority/p01-l2-content-kinds-auto-covers-20260901
          git -C product rev-parse HEAD
