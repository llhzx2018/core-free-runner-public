name: TEMP S01-C02 1.21.924 Quality Authority Proof

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  exact-source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: 497c006407de91b3720ff0819110b9979af6f1ae
      BASE_SHA: 08619b50fb0dc90aecd22bb37f550780a131e0a4

    steps:
      - name: Checkout exact private product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 497c006407de91b3720ff0819110b9979af6f1ae
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: product
          persist-credentials: false

      - name: Assert exact source and bounded diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C product rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' < product/VERSION)" = "1.21.924"
          actual="$(git -C product diff --name-only "$BASE_SHA" "$SOURCE_SHA" | sort)"
          expected="$(printf '%s\n' \
            CHANGELOG.md \
            VERSION \
            includes/views/admin-style-helpers/admin-s01-uiux-polish.php \
            tests/s01-c02-121924-quality-authority-loader-r35-contract.php \
            vf-ops.php | sort)"
          test "$actual" = "$expected"
          test "$(git -C product diff --name-only "$BASE_SHA" "$SOURCE_SHA" -- database config includes/v6 includes/wp-update docs/authority includes/admin-v13/services | wc -l)" = "0"

      - name: PHP syntax and R35 contract
        shell: bash
        run: |
          set -euo pipefail
          php -l product/vf-ops.php
          php -l product/includes/views/admin-style-helpers/admin-s01-uiux-polish.php
          php -l product/tests/s01-c02-121924-quality-authority-loader-r35-contract.php
          php product/tests/s01-c02-121924-quality-authority-loader-r35-contract.php

      - name: Independent runtime authority proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path("product")
          loader=(root/"includes/views/admin-style-helpers/admin-s01-uiux-polish.php").read_text(encoding="utf-8")
          view=(root/"includes/admin-v13/views/acceptance_overview.php").read_text(encoding="utf-8")
          css=(root/"assets/css/v13/acceptance/overview.css").read_text(encoding="utf-8")
          marker="'vf-ops-admin-s01-quality-r35' => 'assets/css/v13/acceptance/overview.css'"
          assert marker in loader
          start=loader.index("if ($isQualityOverview) {")
          block=loader[start:start+1800]
          assert "assets/css/v13/acceptance/overview.css" in block
          assert "admin-s01-quality-r17.css" not in block
          for cls in ["vf-v6-quality-page","vf-v9-pagebar","vf-v9-toolbar","vf-v9-priority","vf-v9-section","vf-v9-table","vf-v9-issue-list","vf-v9-details"]:
              assert cls in view, cls
              assert "."+cls in css, cls
          assert ".vf-accept-product" not in css
          print("S01-C02 1.21.924 runtime Quality CSS authority PASS")
          PY

      - name: Remove transient private checkout
        if: always()
        shell: bash
        run: rm -rf product

# synchronize proof

# retry after contract literal fix
