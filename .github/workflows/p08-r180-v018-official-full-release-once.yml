name: P08 R180 v0.1.8 one-shot official Clean FULL issuance (never Production)
on:
  pull_request:
    paths:
      - .github/workflows/p08-r180-v018-official-full-release-once.yml
      - scripts/p08_r180_v018_full_release_once.py
      - scripts/p08_r180_origin_http_smoke.py
permissions:
  contents: read
jobs:
  exact-source-build-real-full-release:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-v018-official-clean-full-once-20261118' && github.event.pull_request.base.ref == 'main' && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      P08_ISOLATED_INSTALL_TEST: 'YES'
      P08_CANDIDATE_SOURCE_SHA: 76511f1b0263abf4de34dbfafd87b918eb60e209
      P08_CANDIDATE_VERSION: '0.1.8'
    steps:
      - name: Checkout protected one-shot public harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact final merged private P08 main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 76511f1b0263abf4de34dbfafd87b918eb60e209
          path: p08
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Checkout exact effective final GOV-DOC Mode Q
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: a1d783e31e6e22b037f0d9140a8046f25da210fc
          path: gov
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: PHP 8.4 and Composer platform
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: zip,curl,mbstring,pdo_mysql,pdo_sqlite,sqlite3,openssl,posix,dom,intl,fileinfo
          coverage: none
      - name: Node 22 locked runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: p08/package-lock.json
      - name: Mandatory source governance and old release guard
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(id -u)" -ne 0
          test "$(git -C p08 rev-parse HEAD)" = 76511f1b0263abf4de34dbfafd87b918eb60e209
          test "$(git -C p08 rev-parse HEAD^{tree})" = e48809e49dbee28aff58e2a50598ddf2ca932432
          test "$(cat p08/VERSION)" = 0.1.8
          test "$(git -C gov rev-parse HEAD)" = a1d783e31e6e22b037f0d9140a8046f25da210fc
          grep -q '## RP-07Q ' p08/docs/authority/ACCEPTANCE_MATRIX.md
          grep -q '| skill-release | V3.16 |' gov/CURRENT.md
          grep -q 'V3.16 · ONLY P08 v0.1.8 / PR #67 Mode Q' gov/skills/skill-release/V3.16/SKILL.md
          test "$(gh api repos/llhzx2018/vf-adops/git/ref/heads/main --jq .object.sha)" = 76511f1b0263abf4de34dbfafd87b918eb60e209
          test "$(gh api repos/llhzx2018/gov-doc/git/ref/heads/main --jq .object.sha)" = a1d783e31e6e22b037f0d9140a8046f25da210fc
          test "$(gh api repos/llhzx2018/vf-adops/releases/tags/v0.1.7 --jq .id)" = 449685536
          test -z "$(git -C p08 status --porcelain --untracked-files=all)"
          echo P08_R180_MERGED_MAIN_GOVERNANCE_RP07Q_VERSIONED_SOURCE=PASS
      - name: Lockfile dependencies built for exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          composer install --working-dir=p08 --no-dev --no-scripts --prefer-dist --no-interaction --no-progress --optimize-autoloader
          npm ci --prefix p08 --ignore-scripts --no-audit --no-fund
          npm run build --prefix p08
          npm run typecheck --prefix p08
          npm run test:unit --prefix p08
          (cd p08 && composer check-platform-reqs --no-dev)
          test -z "$(git -C p08 status --porcelain --untracked-files=all)"
          (cd p08 && php tests/test_setup_guard.php && php tests/test_setup_experience_contract.php && php tests/test_site_domain_portability.php && php tests/test_setup_preflight.php)
          echo P08_R180_FINAL_MERGED_SOURCE_INSTALL_SECURITY_COMPILER=PASS
      - name: Build twice real immutable final source-indexed FULL and enforce canonical 13-domain structural gate
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -m 700 -p "$RUNNER_TEMP/p08-r180-final" "$RUNNER_TEMP/p08-r180-site"
          for suffix in A B; do
            python3 -B p08/scripts/build_full.py --source p08 --output "$RUNNER_TEMP/p08-r180-final/full-$suffix.zip" --version 0.1.8 --source-sha 76511f1b0263abf4de34dbfafd87b918eb60e209 --governance-root gov
          done
          cmp "$RUNNER_TEMP/p08-r180-final/full-A.zip" "$RUNNER_TEMP/p08-r180-final/full-B.zip"
          mv "$RUNNER_TEMP/p08-r180-final/full-A.zip" "$RUNNER_TEMP/p08-r180-final/VF_AdOps_V0.1.8_FULL.zip"
          unzip -q "$RUNNER_TEMP/p08-r180-final/VF_AdOps_V0.1.8_FULL.zip" -d "$RUNNER_TEMP/p08-r180-site"
          python3 - "$RUNNER_TEMP/p08-r180-final/VF_AdOps_V0.1.8_FULL.zip" <<'PY'
          import json,sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              m=json.loads(z.read("FULL_MANIFEST.json"))
              assert m["target_version"]=="0.1.8"
              assert m["source_sha"]=="76511f1b0263abf4de34dbfafd87b918eb60e209"
              assert m["data_included"] is False
              assert m["type"]=="CLEAN_FULL_ONLY"
              assert m["update_type"]=="NOT_ATOMIC"
              assert len(m["files"])>6100
              assert z.testzip() is None
          print("P08_R180_FINAL_FULL_IMMUTABLE_MERGED_MANIFEST_NO_USER_DATA=PASS")
          PY
          sha256sum "$RUNNER_TEMP/p08-r180-final/VF_AdOps_V0.1.8_FULL.zip"
          echo P08_R180_FINAL_FULL_DOUBLE_BUILD_IDENTICAL=PASS
      - name: Actual official candidate package browser-like HTTPS Origin Host CSRF and clean SQLite install
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/p08_r180_origin_http_smoke.py "$RUNNER_TEMP/p08-r180-site"
          php p08/tests/test_extracted_full_sqlite_e2e.php "$RUNNER_TEMP/p08-r180-site"
          test -L "$RUNNER_TEMP/p08-r180-site/current"
          test "$(cat "$RUNNER_TEMP/p08-r180-site/current/VERSION")" = 0.1.8
          php -S 127.0.0.1:18083 -t "$RUNNER_TEMP/p08-r180-site/public" "$RUNNER_TEMP/p08-r180-site/public/index.php" >"$RUNNER_TEMP/p08-r180-http.log" 2>&1 &
          p=$!
          trap 'kill "$p" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 25); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18083/login || true)"
            if [ "$code" = 200 ]; then break; fi
            sleep 1
          done
          test "$code" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18083/app)" = 302
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18083/setup)" = 503
          echo P08_R180_REAL_ISSUANCE_FULL_FIRST_OWNER_LOGIN_LOCK_AND_SECURITY=PASS
      - name: Assemble immutable provenance notes checksum three-file index
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$RUNNER_TEMP/p08-r180-final" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          name="VF_AdOps_V0.1.8_FULL.zip"
          data=(root/name).read_bytes()
          checksum=hashlib.sha256(data).hexdigest()
          prov={
             "schema_version":"1.0","product":"P08",
             "repository":"llhzx2018/vf-adops",
             "target_version":"0.1.8",
             "target_sha":"76511f1b0263abf4de34dbfafd87b918eb60e209",
             "tree_sha":"e48809e49dbee28aff58e2a50598ddf2ca932432",
             "governance_sha":"a1d783e31e6e22b037f0d9140a8046f25da210fc",
             "release_mode":"V3.16_MODE_Q_ONCE_ONLY",
             "source_pr":67,
             "asset_role":"CLEAN_FULL_ONLY",
             "data_included":False,
             "atomic_017_to_018_issued":False,
             "full_sha256":checksum,
             "full_bytes":len(data),
             "machine_3db_run":"44279601896",
             "gov_machine_run":"44281797719",
             "production_auto_apply":False
          }
          (root/"RELEASE_PROVENANCE.json").write_text(json.dumps(prov,sort_keys=True,indent=2)+"\n")
          notes="""# VF AdOps v0.1.8 — Clean FULL first installation
          
          Only new EMPTY website directory + EMPTY MariaDB 11.8 / MySQL 8.4 / SQLite database.
          The genuine installer now normalizes equivalent safe HTTPS Origin and Host including default :443 and case; hostile origin and forged host remain blocked. No product domain is pinned; adops.lanlihong.com was only one Owner test hostname. Recheck CloudPanel actual reverse-proxy Host and SSL if a mismatch persists.
          
          Source: merged P08 main 76511f1b0263abf4de34dbfafd87b918eb60e209. GOV-DOC Mode Q v3.16 and P08 RP-07Q effective; all required machine gates preserved. SQLite/MySQL8.4/MariaDB11.8 real extracted FULL first-install test evidence: R177 https://github.com/llhzx2018/core-free-runner-public/actions/runs/44279601896 ; exact source/native origin R176 https://github.com/llhzx2018/core-free-runner-public/actions/runs/44276353237 ; governance R178 https://github.com/llhzx2018/core-free-runner-public/actions/runs/44281797719 .
          
          Do NOT overwrite any previously installed site with FULL. No v0.1.7→v0.1.8 Atomic UPDATE is provided. Official v0.1.7 Release/UPDATE and the existing v0.1.5→v0.1.7 Atomic core-updates channel are left intact. Backups and future updates require the standard Owner manual process. CloudPanel, DNS, SSL, Production installation and real-use acceptance stay with Owner and are not claimed as PASS.
          """
          (root/"RELEASE_NOTES.md").write_text(notes)
          names=[name,"RELEASE_PROVENANCE.json","RELEASE_NOTES.md"]
          rows=[hashlib.sha256((root/n).read_bytes()).hexdigest()+"  "+n for n in names]
          (root/"SHA256SUMS").write_text("\n".join(rows)+"\n")
          print("P08_R180_FULL_RELEASE_PROVENANCE_CHECKSUMS_ASSEMBLED=PASS")
          PY
      - name: Publish exactly one official GitHub Release only after all previous executed hard gates and verify remote bytes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          P08_R180_ISOLATED: 'YES'
        run: |
          set -Eeuo pipefail
          python3 scripts/p08_r180_v018_full_release_once.py
      - name: Always purge private P08/GOV checkouts and transient build assets
        if: always()
        shell: bash
        run: |
          rm -rf -- p08 gov "$RUNNER_TEMP/p08-r180-site" "$RUNNER_TEMP/p08-r180-final" "$RUNNER_TEMP/p08-r180-http.log"
          test ! -e p08 && test ! -e gov
