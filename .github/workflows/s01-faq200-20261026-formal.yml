name: S01 Theme exact formal release
on:
  push:
    branches: [task/s01-faq200-formal-20261026]
    paths: ['.github/workflows/s01-faq200-20261026-formal.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.200
  TARGET_SHA: 24d48f2b403df78d2610dc84aa19f49c198d6292
  TARGET_TREE: 95cf56b007e2343510d7d3d512af7a5ea7456ebd
  BASE_SHA: 3af1db5b5f5d20fb26f52614b668a31960653b72
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - name: Formal identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-faq200-20261026/formal-spec.json --input control/.github/workflows/s01-faq200-20261026-formal.yml
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 24d48f2b403df78d2610dc84aa19f49c198d6292
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact candidate, merged tree and required evidence readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider candidate-proof
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40292957927 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40292957927 --jq .head_sha)" = e50d8b07ec815bbf0e0c75ada34f9b3834853fa6
          test "$(gh api repos/$TARGET_REPO/commits/main --jq .sha)" = "$TARGET_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$TARGET_SHA --jq .tree.sha)" = "$TARGET_TREE"
          gh run download 40292957927 --repo llhzx2018/core-free-runner-public --name s01-home-40292957927 --dir candidate-proof
          cmp candidate-proof/state-before.sha256 candidate-proof/state-after.sha256
          cmp candidate-proof/contracts-before.json candidate-proof/contracts-after.json
          python3 control/lanes/s01-faq200-20261026/package.py
          python3 - <<'PYVERIFY'
          import json,pathlib,subprocess,urllib.parse
          r=pathlib.Path('candidate-proof')
          old=json.loads((r/'package.json').read_text());new=json.loads(pathlib.Path('proof/package.json').read_text())
          assert old['source']=='6e4b32da55c76aa6efaca29a61bba71b85d35fec'
          for phase in ['before','after','smoke']:
              result=json.loads((r/('faq-'+phase+'.json')).read_text())
              assert result['status']=='PASS' and result['rows']==2
          result=json.loads((r/'faq-after.json').read_text())
          assert result['status']=='PASS' and result['errors']==[] and result['checks']>=44
          assert result['ownerContentSEO']=='BYTE_IDENTICAL'
          assert result['layout']=='SINGLE_RAIL_ZH_EN_1440_1024'
          assert result['cta']=='SECONDARY_TEXT_LINK'
          assert result['hierarchy']=='COMPACT_INTRO_SEARCH_PLAIN_CATEGORIES_NO_REPEAT_BADGES'
          assert result['customAndHeroOff']=='PRESERVED'
          assert result['interaction']=='SEARCH_CLEAR_ESCAPE_KEYBOARD_CATEGORY_SINGLE_MULTIPLE_NOJS_PASS'
          for lang in ['zh','en']:
              for width in [1440,1024]:
                  assert (r/f'faq-{lang}-{width}.png').stat().st_size>1000
                  assert (r/f'faq-empty-{lang}-{width}.png').stat().st_size>1000
          assert json.loads((r/'clean-install.json').read_text())['status']=='PASS'
          assert json.loads((r/'bootstrap.json').read_text())['status']=='PASS'
          for k in ['status','version','tree','sha256','bytes','files']: assert old[k]==new[k],k
          assert new['sha256']=='fd70d4ef0cd4b314e41d7d4dabb5723153978f70cf3925321b4287e6f1ed76d8' and new['bytes']==2003813
          coverage=json.loads(pathlib.Path('control/lanes/s01-faq200-20261026/release-authority.json').read_text())
          assert set(coverage['required'])=={'TESTING','GIT','UA_UI','SEO','SECURITY','INSTALL','UPGRADE','DATA_SCHEMA','PERFORMANCE'}
          assert coverage['source']=='6e4b32da55c76aa6efaca29a61bba71b85d35fec' and coverage['tree']=='95cf56b007e2343510d7d3d512af7a5ea7456ebd'
          assert coverage['owner_preview_runtime']=='N_A'
          assert coverage['release_mode']=='PROJECT_PREVIEW_N_A'
          assert coverage['owner_real_use']=='POST_PRODUCTION_REQUIRED'
          assert coverage['production_auto_apply'] is False
          for item in coverage['required'].values():
              assert item['sha'] and item['acceptance']
              endpoint='repos/llhzx2018/gov-doc/contents/'+urllib.parse.quote(item['path'],safe='/')+'?ref=main'
              live=json.loads(subprocess.check_output(['gh','api',endpoint]))
              assert live['sha']==item['sha'],item['path']
              item['evidence_status']='PASS_EXACT_CANDIDATE_MACHINE'
          coverage['candidate_run']='40292957927'
          coverage['merged_source']='24d48f2b403df78d2610dc84aa19f49c198d6292'
          coverage['formal_release_gate']='PASS'
          coverage['production_effect']='NOT_PROVEN_POST_MANUAL_UPGRADE_READBACK_REQUIRED'
          pathlib.Path('proof/public-authority-coverage.json').write_text(json.dumps(coverage,ensure_ascii=False,indent=2))
          print('MERGED_TREE_EQUALS_TESTED_TREE_AND_EXACT_PACKAGE_PASS')
          PYVERIFY
      - name: Publish only the exact verified package
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.35.200 --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create v1.35.200 provider/vf-tools-theme_V1.35.200.zip --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Theme V1.35.200' --notes 'FAQ桌面细节收敛：减轻分类导航与问题字重，突出分组标题，展开与收起采用上下箭头，底部引导降为辅助信息。仅既有FAQ桌面CSS及活跃bundle、摘要和版本元数据变更；问答内容、HTML结构、PHP渲染、业务JS、设置和既有测试保持。真实WordPress/Chromium中英文1440/1024、44项FAQ定向回归、199升级200/回退/重复安装及保护数据通过。476运行文件。Owner实际视觉验收仍待手工升级后确认；手机和文章内容暂缓。' --latest
          fi
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/v1.35.200 --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh release view v1.35.200 --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - name: Authenticated remote ZIP byte comparison
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download v1.35.200 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.200.zip --dir remote
          cmp provider/vf-tools-theme_V1.35.200.zip remote/vf-tools-theme_V1.35.200.zip
          echo 'fd70d4ef0cd4b314e41d7d4dabb5723153978f70cf3925321b4287e6f1ed76d8  remote/vf-tools-theme_V1.35.200.zip' | sha256sum -c
          test "$(stat -c %s remote/vf-tools-theme_V1.35.200.zip)" = 2003813
          gh release view v1.35.200 --repo "$TARGET_REPO" --json url,publishedAt,tagName > proof/formal-release.json
          echo FORMAL_RELEASE_EXACT_REMOTE_ASSET_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-home-formal-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target provider remote candidate-proof
