name: TEMP S01-C02 v1.21.816 Update Channel Gate
on:
  push:
    branches: [temp/s01-c02-v121816-build-20260905]
    paths: ['.github/workflows/temp-s01-c02-v121816-update-channel-gate.yml']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CORE_BASE: 53523fc470b403bf57c5755a7d2f88bee26f4982
      CORE_SHA: 06daae55891a14bdb23a475792bf36857673ce02
      OPS_SHA: 9e6c5700f652c2a4c5b915aac8c96d6198aecdf9
      OPS_TREE: c26ec81ae81a66d340264b40af9ac2488f397c51
      ASSET_NAME: vf-tools-ops_V1.21.816.zip
      ASSET_BYTES: '3229881'
      ASSET_SHA: 4a08d875b1c8377b04ee5ec6b87127da566b4deb929d2aae8582c85b29bef87d
      RUNTIME_FP: 18f2d6d54e38c5eda30a6be41d769473f8c717e1b5e1d2575e12ffc112149a0b
    steps:
      - name: Checkout exact update candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CORE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: updates
      - name: Gate update channel
        shell: bash
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          core_main=$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/core-updates/branches/main | jq -r '.commit.sha')
          test "$core_main" = "$CORE_BASE"
          test "$(git -C updates rev-parse HEAD)" = "$CORE_SHA"
          test "$(git -C updates rev-list --count "$CORE_BASE..$CORE_SHA")" = 1
          test "$(git -C updates diff --name-only "$CORE_BASE" "$CORE_SHA")" = 'projects/S01-C02.json'
          m=updates/projects/S01-C02.json
          jq -e '.target_version=="1.21.816" and .from_versions==["1.21.815"] and .release_tag=="v1.21.816" and .asset_name=="vf-tools-ops_V1.21.816.zip" and .asset_bytes==3229881 and .asset_sha256=="4a08d875b1c8377b04ee5ec6b87127da566b4deb929d2aae8582c85b29bef87d" and .schema_from=="6.0.0" and .schema_to=="6.0.0" and .physical_locator=="vf-ops/vf-ops.php" and .runtime_files==903 and .runtime_file_count==903 and .runtime_fingerprint=="18f2d6d54e38c5eda30a6be41d769473f8c717e1b5e1d2575e12ffc112149a0b" and .runtime_fingerprint_sha256=="18f2d6d54e38c5eda30a6be41d769473f8c717e1b5e1d2575e12ffc112149a0b" and .released_at=="2026-09-05T07:38:18Z"' "$m" >/dev/null
          rel=$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.816)
          test "$(jq -r '.target_commitish' <<<"$rel")" = "$OPS_SHA"
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.size' <<<"$rel")" = "$ASSET_BYTES"
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.digest' <<<"$rel")" = "sha256:$ASSET_SHA"
          ops_main=$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/vf-tools-ops/branches/main | jq -r '.commit.sha')
          ops_develop=$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/vf-tools-ops/branches/develop | jq -r '.commit.sha')
          test "$ops_main" = "$OPS_SHA"
          test "$ops_develop" = "$OPS_SHA"
          tree=$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/llhzx2018/vf-tools-ops/git/commits/$OPS_SHA" | jq -r '.tree.sha')
          test "$tree" = "$OPS_TREE"
          prod=$(curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-domain-authority')
          test "$(jq -r '.pluginVersion' <<<"$prod")" = '1.21.815'
          test "$(jq -r '.status' <<<"$prod")" = 'CURRENT'
          test "$(jq -r '.authorityFinalHost' <<<"$prod")" = 'https://ilovem3u8.com'
          test "$(jq -r '.authorityMatch' <<<"$prod")" = 'true'
          echo FORMAL_RELEASE_ASSET=PASS
          echo DIRECT_PRODUCTION_1_21_815_ONLY=PASS
          echo PASS_V121816_UPDATE_CHANNEL_GATE
