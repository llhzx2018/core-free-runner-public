name: TEMP Estate Node24 Four-Source Lane

on:
  push:
    branches:
      - verify/estate-node24-4source-20260829

permissions:
  contents: read

jobs:
  p02:
    name: P02 Exact Source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 3ab0d5f5c63b05fec7df8957f31077d48210cea3
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify P02 source and delta
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "3ab0d5f5c63b05fec7df8957f31077d48210cea3"
          actual="$(git diff --name-only c1a1f440016c7332393d041748ddafd73955fe9e...HEAD | sort)"
          expected="$(printf '%s\n' '.github/workflows/maintenance-reverify.yml' '.github/workflows/repository-health.yml' | sort)"
          test "$actual" = "$expected"
          grep -q 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' .github/workflows/maintenance-reverify.yml
          grep -q 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' .github/workflows/maintenance-reverify.yml
          grep -q 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' .github/workflows/repository-health.yml
          ! grep -R -E 'actions/(checkout|upload-artifact)@v[0-9]+' .github/workflows/maintenance-reverify.yml .github/workflows/repository-health.yml
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, fileinfo, sodium, zip, curl, mbstring
      - name: Run P02 repository verification
        run: bash scripts/verify-repository.sh
      - name: P02 marker
        run: echo 'P02_NODE24_MACHINE=PASS'

  p04:
    name: P04 Exact Source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-infra
          ref: ddabab39a607e6cf97f3211e4a328f4778c7d818
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify P04 workflow-only delta
        shell: bash
        run: |
          set -Eeuo pipefail
          base=18d683cf2e25ded2942a6e94dbdb833d662073a9
          test "$(git rev-parse HEAD)" = "ddabab39a607e6cf97f3211e4a328f4778c7d818"
          test "$(git diff --name-only "$base"...HEAD)" = '.github/workflows/ci.yml'
          test "$(git diff --numstat "$base"...HEAD -- .github/workflows/ci.yml)" = $'17\t17\t.github/workflows/ci.yml'
          git diff --unified=0 "$base"...HEAD -- .github/workflows/ci.yml > /tmp/p04-ci.diff
          changed="$(grep -E '^[+-]' /tmp/p04-ci.diff | grep -Ev '^\+\+\+|^---' || true)"
          test -n "$changed"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^[+-][[:space:]]+(-[[:space:]]+)?uses:[[:space:]]' || true)"
          test -z "$bad"
          for sha in \
            3d3c42e5aac5ba805825da76410c181273ba90b1 \
            5fda3b95a4ea91299a34e894583c3862153e4b97 \
            820762786026740c76f36085b0efc47a31fe5020 \
            043fb46d1a93c77aae656e7c1c64a875d1fc6a0a \
            f3e473d116dcccaddc5834248c87452386958240; do
            grep -q "$sha" .github/workflows/ci.yml
          done
          ! grep -E -q 'actions/(checkout|setup-python|setup-node|upload-artifact)@v[0-9]+|shivammathur/setup-php@v2' .github/workflows/ci.yml
          echo 'P04_PRODUCT_TREE_UNCHANGED=PROVEN'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, fileinfo, sodium, zip, curl, mbstring
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Run P04 repository health surface
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/repository-health-gate.py
          python scripts/check-migrations.py
          find src public tests -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          printf 'P04 exact source: %s\n' "$(git rev-parse HEAD)" > p04-node24-receipt.txt
      - name: Exercise P04 pinned upload-artifact runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p04-node24-scope-receipt-${{ github.run_id }}
          path: p04-node24-receipt.txt
          if-no-files-found: error
          retention-days: 1
      - name: P04 marker
        run: echo 'P04_NODE24_SCOPE_MACHINE=PASS'

  p05:
    name: P05 Exact Source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: 2e86eb31c522740448fe88b56a721d4ee81a962c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify P05 source and delta
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "2e86eb31c522740448fe88b56a721d4ee81a962c"
          actual="$(git diff --name-only c4dbf93eb72c73b8dcb9c9c9ca3f3316dc2bf29e...HEAD | sort)"
          expected="$(printf '%s\n' '.github/workflows/ci.yml' 'tests/contract/ci-action-pins.test.ts' | sort)"
          test "$actual" = "$expected"
          grep -q 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' .github/workflows/ci.yml
          grep -q 'actions/setup-node@820762786026740c76f36085b0efc47a31fe5020' .github/workflows/ci.yml
          ! grep -E -q 'actions/(checkout|setup-node)@v[0-9]+' .github/workflows/ci.yml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - name: Run P05 CI-safe regression
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          npm run lint
          npm run typecheck
          npm run test:unit
          npm run test:contract
          npm run build
      - name: P05 marker
        run: echo 'P05_NODE24_MACHINE=PASS'

  core_agent:
    name: Core Agent Exact Source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-agent
          ref: 5a42815f1e28013917cf139c8ce4e721b2863cd5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify core-agent source and delta
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "5a42815f1e28013917cf139c8ce4e721b2863cd5"
          actual="$(git diff --name-only 01d335b041924dee251aa48c41dd1552df408944...HEAD | sort)"
          expected="$(printf '%s\n' '.github/workflows/ci.yml' 'tests/test_ci_action_pins.py' | sort)"
          test "$actual" = "$expected"
          grep -q 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' .github/workflows/ci.yml
          grep -q 'actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97' .github/workflows/ci.yml
          grep -q 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' .github/workflows/ci.yml
          ! grep -E -q 'actions/(checkout|setup-python|upload-artifact)@v[0-9]+' .github/workflows/ci.yml
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Run core-agent verification
        run: python scripts/verify.py
      - name: Core Agent marker
        run: echo 'CORE_AGENT_NODE24_MACHINE=PASS'

  receipt:
    name: Four-Source Receipt
    needs: [p02, p04, p05, core_agent]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert all exact-source jobs passed
        shell: bash
        run: |
          set -Eeuo pipefail
          test '${{ needs.p02.result }}' = 'success'
          test '${{ needs.p04.result }}' = 'success'
          test '${{ needs.p05.result }}' = 'success'
          test '${{ needs.core_agent.result }}' = 'success'
          echo 'ESTATE_NODE24_4SOURCE_MACHINE=PASS'
