name: P04 V2.5.4 E2E Expected Error Patch

on:
  push:
    paths:
      - '.github/workflows/p04-v254-e2e-expected-error-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mark expected HTTP500 injection window
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/p04-v254-browser-e2e.mjs')
          s=p.read_text(encoding='utf-8')
          old="""const errors = [];
const browser = await chromium.launch({ headless: true });"""
          new="""const errors = [];
let expectedFailureInjection = false;
const browser = await chromium.launch({ headless: true });"""
          if s.count(old)!=1: raise SystemExit('errors sentinel mismatch')
          s=s.replace(old,new,1)
          old="""page.on('pageerror', (e) => errors.push(`PAGEERROR ${e.message}`));
page.on('console', (msg) => { if (msg.type() === 'error') errors.push(`CONSOLE ${msg.text()}`); });
page.on('response', (res) => { if (res.status() >= 500) errors.push(`HTTP${res.status()} ${res.url()}`); });"""
          new="""page.on('pageerror', (e) => { if (!expectedFailureInjection) errors.push(`PAGEERROR ${e.message}`); });
page.on('console', (msg) => { if (msg.type() === 'error' && !expectedFailureInjection) errors.push(`CONSOLE ${msg.text()}`); });
page.on('response', (res) => { if (res.status() >= 500 && !expectedFailureInjection) errors.push(`HTTP${res.status()} ${res.url()}`); });"""
          if s.count(old)!=1: raise SystemExit('listeners sentinel mismatch')
          s=s.replace(old,new,1)
          old="""// Synthetic full error and real retry recovery.
await page.route('**/api.php?action=dashboard*', async (route) => {"""
          new="""// Synthetic full error and real retry recovery.
expectedFailureInjection = true;
await page.route('**/api.php?action=dashboard*', async (route) => {"""
          if s.count(old)!=1: raise SystemExit('full error start sentinel mismatch')
          s=s.replace(old,new,1)
          old="""await page.unroute('**/api.php?action=dashboard*');
await page.locator('#view-dashboard [data-action=\"reload-view\"]').click();"""
          new="""await page.unroute('**/api.php?action=dashboard*');
expectedFailureInjection = false;
await page.locator('#view-dashboard [data-action=\"reload-view\"]').click();"""
          if s.count(old)!=1: raise SystemExit('full error end sentinel mismatch')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check scripts/p04-v254-browser-e2e.mjs
          git diff --check
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add scripts/p04-v254-browser-e2e.mjs
          git commit -m 'runner(P04): distinguish expected V2.5.4 error injection'
          git push origin HEAD:main
