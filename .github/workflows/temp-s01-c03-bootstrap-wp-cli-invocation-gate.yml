name: TEMP S01-C03 Bootstrap Rollback Diagnostic

on:
  push:
    branches:
      - temp/s01-release-prep-gate-20260902
    paths:
      - .github/workflows/temp-s01-c03-bootstrap-wp-cli-invocation-gate.yml

permissions:
  contents: read

env:
  BASE_SHA: 2551f1f0a4045012eea5759169cd96d07aab8215
  BOOTSTRAP_SHA: c0d46b8a1f024fcea3de7ee35a980e89149e08c3
  TARGET_SHA: 72d2a1ca9400a3a3530a90974758b7135a7039d2
  WP_PATH: /tmp/vf-s01-bootstrap-diag-wp
  PACKAGE_DIR: /tmp/vf-s01-bootstrap-diag-packages
  V1254_ASSET_ID: '540225036'
  V1254_BYTES: '3524539'
  V1254_SHA256: 797ee12ea864219880792d7c23530d1df15a609f6792f7bb5fa79361fbbe1c84

jobs:
  rollback-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: vf_s01_bootstrap_diag
          MARIADB_USER: vf
          MARIADB_PASSWORD: vf
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout bootstrap candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: ${{ env.BOOTSTRAP_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: bootstrap

      - name: Checkout provisional target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: target

      - name: Provision PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: mysqli,curl,zip,mbstring,xml,json,openssl
          coverage: none

      - name: Build target and install official source
        shell: bash
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$PACKAGE_DIR"
          test "$(git -C bootstrap rev-parse HEAD)" = "$BOOTSTRAP_SHA"
          test "$(git -C bootstrap rev-parse origin/main)" = "$BASE_SHA"
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          root=Path('target/src'); out=Path('/tmp/vf-s01-bootstrap-diag-packages')
          files={p.relative_to(root).as_posix():p.read_bytes() for p in root.rglob('*') if p.is_file() and not p.is_symlink()}; files=dict(sorted(files.items()))
          assert len(files)==550
          zpath=out/'vf-tools-m3u8_V1.25.6.zip'
          with zipfile.ZipFile(zpath,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for rel,data in files.items():
                  zi=zipfile.ZipInfo(f'vf-tool-m3u8/{rel}',(2026,9,2,0,0,0)); zi.compress_type=zipfile.ZIP_DEFLATED; zi.external_attr=0o100644<<16; z.writestr(zi,data)
          (out/'target.json').write_text(json.dumps({'bytes':zpath.stat().st_size,'sha256':hashlib.sha256(zpath.read_bytes()).hexdigest()}))
          PY
          curl -fsSL -H "Authorization: Bearer $VF_PRIVATE_READ_TOKEN" -H 'Accept: application/octet-stream' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/llhzx2018/vf-tools-m3u8/releases/assets/$V1254_ASSET_ID" -o "$PACKAGE_DIR/vf-tools-m3u8_V1.25.4.zip"
          test "$(stat -c%s "$PACKAGE_DIR/vf-tools-m3u8_V1.25.4.zip")" = "$V1254_BYTES"
          test "$(sha256sum "$PACKAGE_DIR/vf-tools-m3u8_V1.25.4.zip" | awk '{print $1}')" = "$V1254_SHA256"
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp
          chmod +x /tmp/wp && sudo mv /tmp/wp /usr/local/bin/wp
          for i in $(seq 1 30); do mysqladmin ping -h127.0.0.1 -P3306 -uvf -pvf --silent >/dev/null 2>&1 && break; sleep 1; done
          rm -rf "$WP_PATH"
          wp core download --path="$WP_PATH" --version=7.1 --force
          wp config create --path="$WP_PATH" --dbname=vf_s01_bootstrap_diag --dbuser=vf --dbpass=vf --dbhost=127.0.0.1:3306 --skip-check
          wp config set FS_METHOD direct --path="$WP_PATH"
          wp core install --path="$WP_PATH" --url=http://127.0.0.1:8088 --title='VF Bootstrap Rollback Diagnostic' --admin_user=owner --admin_password='diag-only' --admin_email=owner@example.invalid --skip-email
          wp plugin install "$PACKAGE_DIR/vf-tools-m3u8_V1.25.4.zip" --path="$WP_PATH" --activate --force
          test "$(wp plugin get vf-tool-m3u8 --field=version --path="$WP_PATH" | tr -d '\r')" = '1.25.4'

      - name: Seal exact pre-state
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/vf-schema-fingerprint.php <<'PHP'
          <?php
          $tables=function_exists('vf_tools_m3u8_v6_table_names')?vf_tools_m3u8_v6_table_names():[]; ksort($tables,SORT_STRING); global $wpdb; $p=['tables'=>[],'options'=>[]];
          foreach($tables as $k=>$t){$c=$wpdb->get_row('SHOW CREATE TABLE `'.str_replace('`','``',$t).'`',ARRAY_N);$r=$wpdb->get_results('SELECT * FROM `'.str_replace('`','``',$t).'`',ARRAY_A);usort($r,static fn($a,$b)=>strcmp(wp_json_encode($a),wp_json_encode($b)));$p['tables'][$k]=['name'=>$t,'create'=>$c,'rows'=>$r];}
          $p['options']['schema_version']=get_option('vf_tools_m3u8_v6_schema_version',null);$p['options']['migration']=get_option('vf_tools_m3u8_v6_private_schema_migration',null); echo hash('sha256',wp_json_encode($p,JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE)),"\n";
          PHP
          cat > /tmp/source-fp.py <<'PY'
          import hashlib,sys
          from pathlib import Path
          root=Path(sys.argv[1]); files={p.relative_to(root).as_posix():p.read_bytes() for p in root.rglob('*') if p.is_file() and not p.is_symlink()}; files=dict(sorted(files.items())); print(hashlib.sha256(''.join(f'{k}\0{hashlib.sha256(v).hexdigest()}\n' for k,v in files.items()).encode()).hexdigest()); print(len(files),file=sys.stderr)
          PY
          wp eval-file /tmp/vf-schema-fingerprint.php --path="$WP_PATH" > /tmp/schema-before
          python3 /tmp/source-fp.py "$WP_PATH/wp-content/plugins/vf-tool-m3u8" > /tmp/source-before
          echo "PRE_VERSION=$(wp plugin get vf-tool-m3u8 --field=version --path="$WP_PATH" | tr -d '\r')"
          echo "PRE_ACTIVE=$(wp plugin is-active vf-tool-m3u8 --path="$WP_PATH" >/dev/null && echo yes || echo no)"
          echo "PRE_SCHEMA=$(cat /tmp/schema-before)"
          echo "PRE_SOURCE=$(cat /tmp/source-before)"

      - name: Fault and print rollback diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          NEWZIP="$PACKAGE_DIR/vf-tools-m3u8_V1.25.6.zip"; NEWBYTES="$(jq -r .bytes "$PACKAGE_DIR/target.json")"; NEWSHA="$(jq -r .sha256 "$PACKAGE_DIR/target.json")"
          cp "$GITHUB_WORKSPACE/bootstrap/scripts/s01-c03-bootstrap-upgrade-1254.php" /tmp/bootstrap-fault.php
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/bootstrap-fault.php'); s=p.read_text(); needle='            self::assert_target_readback($pluginDir, $target, $activeBefore, $networkBefore);'; assert s.count(needle)==1; p.write_text(s.replace(needle,"            throw new RuntimeException('GATE_FAULT_AFTER_SOURCE_PROMOTION');\n"+needle))
          PY
          set +e
          wp --path="$WP_PATH" eval-file /tmp/bootstrap-fault.php "zip=$NEWZIP" "sha256=$NEWSHA" "bytes=$NEWBYTES" "target=1.25.6" >/tmp/fault.txt 2>&1
          rc=$?
          set -e
          echo "FAULT_RC=$rc"
          cat /tmp/fault.txt
          version="$(wp plugin get vf-tool-m3u8 --field=version --path="$WP_PATH" 2>&1 | tr -d '\r')" || true
          if wp plugin is-active vf-tool-m3u8 --path="$WP_PATH" >/dev/null 2>&1; then active=yes; else active=no; fi
          wp eval-file /tmp/vf-schema-fingerprint.php --path="$WP_PATH" > /tmp/schema-after || true
          python3 /tmp/source-fp.py "$WP_PATH/wp-content/plugins/vf-tool-m3u8" > /tmp/source-after || true
          echo "POST_VERSION=$version"
          echo "POST_ACTIVE=$active"
          echo "PRE_SCHEMA=$(cat /tmp/schema-before)"
          echo "POST_SCHEMA=$(cat /tmp/schema-after 2>/dev/null || echo MISSING)"
          echo "PRE_SOURCE=$(cat /tmp/source-before)"
          echo "POST_SOURCE=$(cat /tmp/source-after 2>/dev/null || echo MISSING)"
          echo 'PLUGIN_DIR_TOP:'
          find "$WP_PATH/wp-content/plugins" -maxdepth 2 -type d -printf '%P\n' | LC_ALL=C sort | head -50
          test "$rc" -ne 0
          grep -Fq 'GATE_FAULT_AFTER_SOURCE_PROMOTION' /tmp/fault.txt
          test "$version" = '1.25.4'
          test "$active" = yes
          cmp /tmp/schema-before /tmp/schema-after
          cmp /tmp/source-before /tmp/source-after
          echo 'ROLLBACK_DIAGNOSTIC_ASSERTIONS=PASS'
