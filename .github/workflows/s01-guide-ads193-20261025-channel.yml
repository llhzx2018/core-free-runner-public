name: S01 exact Theme channel contract
on:
  push:
    branches: [task/s01-guide-ads193-channel-20261025]
    paths: ['.github/workflows/s01-guide-ads193-20261025-channel.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.193
  TARGET_SHA: 39a6b8ad0f0d16ad3f3bc99ba5e71df1ae88e4e6
  UPDATE_SHA: 8100b29569ed403aa7dad0bec705a9fe5d76bdf9
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: 8100b29569ed403aa7dad0bec705a9fe5d76bdf9
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: source
      - name: Channel identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-guide-ads193-20261025/channel-spec.json --input control/.github/workflows/s01-guide-ads193-20261025-channel.yml
      - name: Exact changed manifest and native protocol tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          test "$(git -C source diff --name-only 68e3e2f4cdb35e3adcc514c1c9cae83a5c790007 8100b29569ed403aa7dad0bec705a9fe5d76bdf9)" = projects/S01-C01.json
          git -C source diff --exit-code 68e3e2f4cdb35e3adcc514c1c9cae83a5c790007 8100b29569ed403aa7dad0bec705a9fe5d76bdf9 -- projects/S01-C03.json
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PYCHANNEL'
          import json,os
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']==os.environ['TARGET_VERSION']
          assert m['asset_sha256']=='8cdb0ae74d8cc8f486b6c3a9b386a1c88a9aab7b5cbfe29346c833d693ace2f6' and m['asset_bytes']==1998744
          assert m['runtime_files']==476 and '1.35.192' in m['from_versions']
          assert m['release_tag']=='v'+os.environ['TARGET_VERSION']
          print('EXACT_CHANNEL_CONTRACT_PASS')
          PYCHANNEL
      - name: Cleanup
        if: always()
        run: rm -rf source
