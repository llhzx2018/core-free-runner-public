name: P02 2.5.129 isolated atomic fail-closed and maintenance recovery regression (one-off)
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p02-v25129-atomic-maintenance-negative-oneoff.yml']
permissions:
  contents: read
jobs:
  atomic-failure-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      P02_SOURCE_SHA: 28a480c49818e55e8db1228ac74719668a486ec9
      P02_SOURCE_TREE: b10d84ce02c1affc3bee5ef746959ef9f2779780
      P02_VERSION: 2.5.129
    steps:
      - name: Checkout exact private source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          repository: llhzx2018/vf-library
          ref: 28a480c49818e55e8db1228ac74719668a486ec9
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product

      - name: Validate checkout and runtime capabilities
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$P02_SOURCE_SHA"
          test "$(git -C product show -s --format=%T HEAD)" = "$P02_SOURCE_TREE"
          test "$(cat product/VERSION)" = "$P02_VERSION"
          ( cd product && python3 scripts/verify-source-manifest.py )
          if ! (php -r 'exit(extension_loaded("pdo_sqlite") && extension_loaded("sqlite3") && extension_loaded("zip") ? 0 : 1);' && command -v sqlite3); then
            sudo apt-get update -qq
            sudo apt-get install -y php-cli php-sqlite3 php-zip sqlite3 unzip curl
          fi
          php -r 'exit(extension_loaded("pdo_sqlite") && extension_loaded("sqlite3") && extension_loaded("zip") ? 0 : 1);'
          sqlite3 --version
          echo P02_129_EXACT_RUNTIME_IDENTITY_AND_DEPENDENCIES=PASS

      - name: Install disposable browser verification harness
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/p02-browser-harness"
          npm install --prefix "$RUNNER_TEMP/p02-browser-harness" --no-save --no-audit --no-fund playwright@1.55.0
          "$RUNNER_TEMP/p02-browser-harness/node_modules/.bin/playwright" install --with-deps chromium
          # Existing test suite resolves the test harness from the exact source root.
          ln -s "$RUNNER_TEMP/p02-browser-harness/node_modules" product/node_modules
          echo P02_129_BROWSER_HARNESS_DISPOSABLE=PASS

      - name: Run original maintenance regression on exact source with synthetic data only
        shell: bash
        env:
          TEST_PASSWORD: P02-129-Disposable-Machine-Only!
        run: |
          set -Eeuo pipefail
          export EVIDENCE_DIR="$RUNNER_TEMP/p02-129-maint-evidence"
          mkdir -p "$EVIDENCE_DIR"
          bash product/scripts/maintenance-reverify.sh > "$RUNNER_TEMP/p02-maint-console.txt" 2>&1 || {
            echo P02_129_ORIGINAL_MAINTENANCE_REGRESSION=FAIL
            grep -E '(^==|PASS|FAIL|Error|error|Exception|assert|missing|blocked)' "$RUNNER_TEMP/p02-maint-console.txt" | tail -n 55 || :
            exit 1
          }
          grep -F 'atomic_preprotection_failure_no_private_rollback' "$EVIDENCE_DIR/pre-activation-failure-regression.json"
          grep -F '"ok": true' "$EVIDENCE_DIR/pre-activation-failure-regression.json"
          echo P02_129_ATOMIC_PREACTIVATION_FAIL_CLOSED_AND_ATTACHMENT_INTEGRITY=PASS
          echo P02_129_MAINTENANCE_INSTALL_DATA_BACKUP_RESTORE_BROWSER=PASS
          echo P02_129_ATOMIC_21_SOURCE_APPLY_AND_ROLLBACK=NOT_EVALUATED

      - name: Always remove transient private checkout and synthetic runtime evidence
        if: always()
        shell: bash
        run: |
          rm -rf product "$RUNNER_TEMP/p02-browser-harness" "$RUNNER_TEMP/p02-129-maint-evidence" "$RUNNER_TEMP/p02-maint-console.txt"
          echo P02_129_PRIVATE_DATA_PERSISTED_IN_PUBLIC=NO
