name: S01 exact Theme channel contract
on:
  push:
    branches: [task/s01-encryption172-20261022]
    paths: ['.github/workflows/s01-encryption172-20261022-channel.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.172
  TARGET_SHA: f1d34513b1b870c24e593afba3b08222f97a97f2
  UPDATE_SHA: 706075451d7201f811b71259cad811d8401f06b1
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: 706075451d7201f811b71259cad811d8401f06b1
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Exact changed manifest and native protocol tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PYCHANNEL'
          import json,os
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']==os.environ['TARGET_VERSION']
          assert m['asset_sha256']=='ba1d0f93624b1bc3572e92fc8d3df0bea02f695d5e63e784edc6f965c757867a' and m['asset_bytes']==1973838
          assert m['runtime_files']==476 and '1.35.171' in m['from_versions']
          assert m['release_tag']=='v'+os.environ['TARGET_VERSION']
          print('EXACT_CHANNEL_CONTRACT_PASS')
          PYCHANNEL
      - name: Cleanup
        if: always()
        run: rm -rf source
