# verification-run-1
name: P02 V2.5.0 UAUI Verify

on:
  push:
    branches: [task/p02-v250-uaui-verify]
    paths: ['.github/workflows/p02-v250-uaui-verify.yml']
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p02-v250-uaui-verify.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - name: Require private read token
        env: {PRIVATE_TOKEN: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'}
        run: test -n "$PRIVATE_TOKEN"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: task/v2.5.0-runtime-uaui
          token: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'
          path: p02
          fetch-depth: 0
          persist-credentials: false
      - name: Install runtime and browser
        working-directory: p02
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-zip php-curl sqlite3 curl
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Static and repository gates
        working-directory: p02
        run: |
          set -Eeuo pipefail
          php -l public/index.php
          find public src -name '*.php' -type f -print0 | xargs -0 -n1 php -l >/tmp/php-lint.txt
          node --check public/assets/app.js
          node --check public/assets/editor-enhancements.js
          node --check public/assets/v250-uaui.js
          grep -q 'v250-uaui.css' public/index.php
          grep -q 'v250-uaui.js' public/index.php
          ! grep -q 'v250-layout-fix.css' public/index.php
          test ! -e public/assets/v250-layout-fix.css
          python3 scripts/repository-gates.py
          DEPLOY="$RUNNER_TEMP/deploy-check"
          bash scripts/build-deploy-tree.sh "$DEPLOY" >/dev/null
          test -s "$DEPLOY/assets/v250-uaui.css"
          test -s "$DEPLOY/assets/v250-uaui.js"
          test ! -e "$DEPLOY/assets/v250-layout-fix.css"
          rm -rf "$DEPLOY"
      - name: Install isolated test site
        working-directory: p02
        env: {AUDIT_PASSWORD: 'P02-V250-${{ github.run_id }}-${{ github.run_attempt }}!'}
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/p02-v250"; SITE="$ROOT/site"; mkdir -p "$SITE"
          bash scripts/build-deploy-tree.sh "$SITE" >/dev/null
          php -d display_errors=0 -S 127.0.0.1:18152 -t "$SITE" >"$ROOT/server.log" 2>&1 & echo $! > "$ROOT/server.pid"
          for _ in $(seq 1 80); do curl -fsS http://127.0.0.1:18152/setup.php >/dev/null 2>&1 && break; sleep .25; done
          curl -fsS -c "$ROOT/cookie.txt" http://127.0.0.1:18152/setup.php > "$ROOT/setup.html"
          TOKEN=$(python3 - "$ROOT/setup.html" <<'PY'
          import re,html,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf" value="([^"]+)"',s);assert m;print(html.unescape(m.group(1)))
          PY
          )
          code=$(curl -sS -o /dev/null -w '%{http_code}' -b "$ROOT/cookie.txt" -c "$ROOT/cookie.txt" -H 'Origin: http://127.0.0.1:18152' --data-urlencode "setup_csrf=$TOKEN" --data-urlencode "password=$AUDIT_PASSWORD" --data-urlencode "password_confirm=$AUDIT_PASSWORD" http://127.0.0.1:18152/setup.php)
          test "$code" = 303
      - name: Full browser UAUI regression
        working-directory: p02
        env: {AUDIT_PASSWORD: 'P02-V250-${{ github.run_id }}-${{ github.run_attempt }}!'}
        run: |
          set -Eeuo pipefail
          cat > .v250-audit.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:900}});
          const errors=[];
          page.on('pageerror',e=>errors.push('pageerror:'+String(e)));
          page.on('console',m=>{if(m.type()==='error'&&!/409 \(Conflict\)/.test(m.text()))errors.push('console:'+m.text())});
          const box=async s=>{const l=page.locator(s).first();return await l.isVisible()?await l.boundingBox():null};
          const overlap=(a,b)=>a&&b&&Math.max(0,Math.min(a.x+a.width,b.x+b.width)-Math.max(a.x,b.x))*Math.max(0,Math.min(a.y+a.height,b.y+b.height)-Math.max(a.y,b.y))>0;
          await page.goto('http://127.0.0.1:18152/',{waitUntil:'networkidle'});
          let sess=await page.evaluate(async()=>await(await fetch('/api.php?action=session',{cache:'no-store'})).json());
          if(!sess?.site?.auth){await page.locator('[data-open-login]').first().click();await page.locator('#loginForm input[name="password"]').fill(process.env.AUDIT_PASSWORD);await page.locator('#loginSubmit').click();await page.waitForFunction(async()=>Boolean((await(await fetch('/api.php?action=session',{cache:'no-store'})).json())?.site?.auth));sess=await page.evaluate(async()=>await(await fetch('/api.php?action=session',{cache:'no-store'})).json());}
          const csrf=sess.csrf;
          const post=async(a,b)=>page.evaluate(async({a,b,csrf})=>await(await fetch('/api.php?action='+a,{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(b)})).json(),{a,b,csrf});
          const cat=await post('category_save',{name:'V250 Runtime Audit',description:'',icon:'folder'});if(!cat.ok)throw new Error('category create failed');const cid=Number(cat.id);
          const item=await post('content_save',{category_id:cid,title:'V2.5.0 阅读排版与折叠验证',description:'这是一段只在用户主动选择摘要模式时出现的测试摘要。',content:'# V2.5.0 阅读排版与折叠验证\n\n正文用于验证舒适阅读。\n\n## 第二节\n\n'+('中文长文阅读段落，用于验证行高和内容宽度。 '.repeat(80)),content_mode:'article',content_format:'markdown',primary_action:'read',is_favorite:true,status:'active'});if(!item.ok)throw new Error('item create failed');const iid=Number(item.id);
          await page.reload({waitUntil:'networkidle'});
          await page.evaluate(async({cid,iid})=>{await setContentView('notebook');await selectCategory(cid);await openReader(iid,true)},{cid,iid});
          await page.waitForSelector('#notebookLayout');await page.waitForTimeout(300);
          const typography=await page.evaluate(()=>({body:parseFloat(getComputedStyle(document.body).fontSize),reader:parseFloat(getComputedStyle(document.querySelector('.markdown-body')).fontSize),line:parseFloat(getComputedStyle(document.querySelector('.markdown-body')).lineHeight),mode:document.body.dataset.v250ListMode,titleWeight:getComputedStyle(document.querySelector('.notebook-title-top strong')).fontWeight}));
          if(typography.body<14.5||typography.reader<16.5||typography.line<27||typography.mode!=='minimal')throw new Error('typography/default mode '+JSON.stringify(typography));
          if(await page.locator('.v250-list-mode-control').count()<1)throw new Error('list mode control missing');
          if(await page.locator('.notebook-title-meta').first().isVisible())throw new Error('minimal mode should hide meta');
          const modeSelect=page.locator('[data-v250-list-mode]').first();await modeSelect.selectOption('standard');await page.waitForTimeout(100);if((await page.evaluate(()=>document.body.dataset.v250ListMode))!=='standard')throw new Error('standard mode failed');
          await modeSelect.selectOption('summary');await page.waitForTimeout(150);if((await page.evaluate(()=>document.body.dataset.v250ListMode))!=='summary')throw new Error('summary mode failed');
          await modeSelect.selectOption('minimal');
          const visibleToggles=async()=>page.locator('#sidebarRailToggle:visible,#notebookPaneCollapse:visible,#notebookPaneRestore:visible').count();
          if(await visibleToggles()!==2)throw new Error('duplicate pane controls initial '+await visibleToggles());
          if(await page.locator('#menuBtn:visible').count()!==0)throw new Error('desktop duplicate menu toggle visible');
          const before=await box('#notebookDetailScroll');await page.locator('#notebookPaneCollapse').click();await page.waitForTimeout(160);
          const afterList=await box('#notebookDetailScroll');if(!afterList||!before||afterList.width<=before.width+150)throw new Error('reader did not expand after list collapse');
          if(await visibleToggles()!==2)throw new Error('duplicate pane controls list-collapsed '+await visibleToggles());
          if(overlap(await box('#sidebarRailToggle'),await box('#notebookPaneRestore')))throw new Error('pane controls overlap');
          await page.locator('#sidebarRailToggle').click();await page.waitForTimeout(160);
          const afterBoth=await box('#notebookDetailScroll');if(!afterBoth||afterBoth.width<=afterList.width+100)throw new Error('reader did not expand after both collapse');
          if(await visibleToggles()!==2)throw new Error('duplicate pane controls both-collapsed '+await visibleToggles());
          if(overlap(await box('#sidebarRailToggle'),await box('#notebookPaneRestore')))throw new Error('both-collapsed controls overlap');
          await page.locator('#notebookPaneRestore').click();await page.locator('#sidebarRailToggle').click();await page.waitForTimeout(160);
          const fav=await page.evaluate(async iid=>(await(await fetch('/api.php?action=content_get&id='+iid,{cache:'no-store'})).json()).data?.item?.is_favorite,iid);if(Number(fav)!==1)throw new Error('favorite parity failed '+fav);
          await page.evaluate(async()=>await state.workspaceController.setMode('edit',true));await page.waitForTimeout(180);if(await page.locator('#articleSource').count()!==1)throw new Error('article editor missing');const editorSize=await page.locator('#articleSource').evaluate(el=>parseFloat(getComputedStyle(el).fontSize));if(editorSize<15.5)throw new Error('editor font too small '+editorSize);if(await page.locator('.vf-editor-toolbar').count()<1)throw new Error('editor toolbar missing');await page.evaluate(async()=>await state.workspaceController.setMode('read',true));
          await page.locator('#themeBtn').click();await page.waitForTimeout(100);const dark=await page.evaluate(()=>({theme:document.documentElement.getAttribute('data-theme'),bg:getComputedStyle(document.body).backgroundColor,surface:getComputedStyle(document.querySelector('.sidebar')).backgroundColor}));if(dark.theme!=='dark'||/rgb\(247, 247, 247\)|rgb\(255, 255, 255\)/.test(dark.bg+' '+dark.surface))throw new Error('dark theme regression '+JSON.stringify(dark));await page.locator('#themeBtn').click();
          for(const [w,h] of [[1920,1080],[1440,900],[1024,820],[768,900],[390,844]]){await page.setViewportSize({width:w,height:h});await page.waitForTimeout(120);const m=await page.evaluate(()=>({client:document.documentElement.clientWidth,scroll:document.documentElement.scrollWidth}));if(m.scroll>m.client+3)throw new Error('horizontal overflow '+w+' '+JSON.stringify(m));}
          await page.setViewportSize({width:1440,height:900});await page.locator('#accountBtn').click();await page.waitForTimeout(80);const confirm=page.locator('[data-dialog-confirm]');if(await confirm.count())await confirm.click();await page.waitForFunction(async()=>!Boolean((await(await fetch('/api.php?action=session',{cache:'no-store'})).json())?.site?.auth));if(await page.locator('[data-open-login]').count()<1)throw new Error('logged-out UI missing');await page.locator('[data-open-login]').first().click();await page.locator('#loginForm input[name="password"]').fill(process.env.AUDIT_PASSWORD);await page.locator('#loginSubmit').click();await page.waitForFunction(async()=>Boolean((await(await fetch('/api.php?action=session',{cache:'no-store'})).json())?.site?.auth));
          if(errors.length)throw new Error(errors.join(' | '));console.log('P02_V250_UAUI_PASS='+JSON.stringify({typography,before,afterList,afterBoth,dark,errors}));await browser.close();
          JS
          node .v250-audit.mjs
      - name: Cleanup
        if: always()
        working-directory: p02
        run: |
          if test -f "$RUNNER_TEMP/p02-v250/server.pid"; then kill "$(cat "$RUNNER_TEMP/p02-v250/server.pid")" 2>/dev/null || true; fi
          rm -rf "$RUNNER_TEMP/p02-v250" .v250-audit.mjs node_modules package.json package-lock.json || true
