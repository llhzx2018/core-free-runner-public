name: Public Runner Workflow Archive Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/*.yml'
      - 'archive/workflows/**'
      - 'scripts/workflow_archive.py'
      - 'tests/test_workflow_archive.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Verify passive archive
        run: python scripts/workflow_archive.py

      - name: Run archive regression tests
        run: python -m unittest discover -s tests -v
