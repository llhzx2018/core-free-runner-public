name: P08 v0.1.5 domain portability focused proof (TEMP)
on:
  pull_request:
    paths: [.github/workflows/p08-r145-owner-backend-once-temp.yml]
permissions:
  contents: read
jobs:
  domain-portability:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Setup rootless PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: posix,zip,mbstring,sqlite3,pdo_sqlite,pdo_mysql,openssl
          coverage: none
      - name: Checkout exact P08 PR branch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: f809e9889281ecba9cc95d92b6ce8845779e2958
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p08
          persist-credentials: false
          fetch-depth: 1
      - name: Existing setup and real future-update-controller host guards
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(id -u)" -ne 0
          test "$(git -C p08 rev-parse HEAD)" = "f809e9889281ecba9cc95d92b6ce8845779e2958"
          test "$(cat p08/VERSION)" = 0.1.5
          php -l p08/tests/test_site_domain_portability.php
          php -l p08/tests/test_setup_guard.php
          php -l p08/tests/test_clean_full_versioned_bootstrap.php
          php p08/tests/test_setup_guard.php
          php p08/tests/test_site_domain_portability.php
          php p08/tests/test_clean_full_versioned_bootstrap.php
          php p08/tests/test_owner_next_release_gateway.php
          git -C p08 diff --quiet
          echo P08_R151_DOMAIN_PORTABILITY_SOURCE_BOUND_UNIT_PROOF=PASS
      - name: Clean private checkout
        if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/p08"
