name: P08 R145 bounded rootless recovery and architecture (TEMP)
on:
  pull_request:
    paths: [.github/workflows/p08-r145-owner-backend-once-temp.yml]
permissions:
  contents: read
jobs:
  r145:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: PHP 8.4 and required file extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: posix,mbstring,zip,sqlite3,pdo_sqlite,pdo_mysql
          coverage: none
      - name: Exact transient private P08 R145 PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 1cbfe46cb6ae84b6abaca5ad54e175971127bb9f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p08
          persist-credentials: false
          fetch-depth: 0
      - name: Exact transient GOV rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 5aeb01605290e2170c98efda79afffb1cff7a206
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: gov
          persist-credentials: false
          fetch-depth: 1
      - name: Node 22 with locked dependencies
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: p08/package-lock.json
      - name: Rootless original-suite reuse plus Owner review recovery, tamper and busy negatives
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(id -u)" -ne 0
          test "$(git -C p08 rev-parse HEAD)" = "1cbfe46cb6ae84b6abaca5ad54e175971127bb9f"
          test "$(git -C gov rev-parse HEAD)" = "5aeb01605290e2170c98efda79afffb1cff7a206"
          for path in p08/src/Upgrade/{R145OwnerReviewRecovery,OwnerNextReleaseGateway,OwnerPreviousCycleArchive,OwnerFutureAtomicService,OwnerFutureAtomicStore,OwnerFutureSiteDispatcher}.php p08/src/Upgrade/future-owner-upgrade-worker.php p08/app/Http/Controllers/OwnerFutureUpdateController.php p08/tests/{test_r145_owner_review_recovery,test_owner_next_release_gateway}.php; do
            php -l "$path" >/dev/null
          done
          php p08/tests/test_owner_next_release_gateway.php
          php -l p08/scripts/r145_owner_recovery_once.php >/dev/null
          php p08/tests/test_owner_previous_cycle_archive.php > "$RUNNER_TEMP/p08-r145-cycle.log" 2>&1 || {
            tail -n 35 "$RUNNER_TEMP/p08-r145-cycle.log"; exit 1;
          }
          for proof in \
            P08_R145_PREVIOUS_CYCLE_ROTATION_TOKEN_AND_BACKUP_INTACT=PASS \
            P08_R145_TAMPERED_PREVIOUS_CYCLE_REFUSED_BEFORE_ROTATION=PASS \
            P08_R145_CLEAN_FIRST_UPDATE_WITH_EXISTING_TOKEN=PASS; do
            grep -Fxq "$proof" "$RUNNER_TEMP/p08-r145-cycle.log"
          done
          python3 -B p08/scripts/build_r145_onefile.py --source-root p08 --out "$RUNNER_TEMP/p08-owner-recover-once.php"
          php -l "$RUNNER_TEMP/p08-owner-recover-once.php"
          if php "$RUNNER_TEMP/p08-owner-recover-once.php" "$RUNNER_TEMP" >/dev/null 2>&1; then
            echo R145_UNAUTHORIZED_CLI_ACCEPTED; exit 1
          fi
          echo P08_R145_ONEFILE_DETERMINISTIC_PACKAGE_AND_SITE_ROOT_REFUSAL=PASS
          php p08/tests/test_r145_owner_review_recovery.php > "$RUNNER_TEMP/p08-r145-php.log" 2>&1 || {
            tail -n 35 "$RUNNER_TEMP/p08-r145-php.log"; exit 1;
          }
          for proof in \
            P08_R143_966K_RECEIPT_AND_HISTORY=PASS \
            P08_R145_REVIEW_ARCHIVED_OLD_SESSION_BACKUP_INTACT_NO_SWITCH=PASS \
            P08_R145_OTHER_NEEDS_REVIEW_FAIL_CLOSED=PASS \
            P08_R145_HELD_WORKER_AND_TAMPER_BLOCKED=PASS; do
            grep -Fxq "$proof" "$RUNNER_TEMP/p08-r145-php.log"
          done
          python3 -B p08/.github/checks/test_architecture_gate.py
          python3 -B p08/.github/checks/architecture_gate.py \
            --manifest p08/.github/checks/code_architecture.json \
            --gov-root "$GITHUB_WORKSPACE/gov" \
            --base-sha 38979874dea85ec14ee91c2357dca117655c48c0 \
            --head-sha 1cbfe46cb6ae84b6abaca5ad54e175971127bb9f \
            --git-root "$GITHUB_WORKSPACE/p08"
          npm --prefix p08 ci --ignore-scripts --no-audit --no-fund
          npm --prefix p08 run typecheck
          npm --prefix p08 run build
          npm --prefix p08 run test:unit
          echo P08_R145_EXACT_SOURCE_ROOTLESS_RECOVERY_AND_NEXT_CHANNEL_ARCHITECTURE_UI=PASS
      - name: Purge transient private checkout and local logs
        if: always()
        shell: bash
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/p08" "$GITHUB_WORKSPACE/gov" "$RUNNER_TEMP/p08-r145-php.log" "$RUNNER_TEMP/p08-r145-cycle.log" "$RUNNER_TEMP/p08-owner-recover-once.php"
