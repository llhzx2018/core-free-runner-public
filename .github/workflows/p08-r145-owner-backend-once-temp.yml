name: P08 v0.1.5 clean FULL and future Atomic proof (TEMP)
on:
  pull_request:
    paths: [.github/workflows/p08-r145-owner-backend-once-temp.yml]
permissions:
  contents: read
jobs:
  clean-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: PHP 8.4 required platform and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: posix,curl,zip,mbstring,sqlite3,pdo_sqlite,pdo_mysql,openssl,sodium
          coverage: none
      - name: Checkout exact private v0.1.5 PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 8ff707ed6f48ad7393864d871b2864614c5b7d5c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p08
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout exact GOV-DOC main rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 5aeb01605290e2170c98efda79afffb1cff7a206
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: gov
          persist-credentials: false
          fetch-depth: 1
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: p08/package-lock.json
      - name: Pinned source, rootless setup, static checks and regression
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(id -u)" -ne 0
          test "$(git -C p08 rev-parse HEAD)" = "8ff707ed6f48ad7393864d871b2864614c5b7d5c"
          test "$(git -C gov rev-parse HEAD)" = "5aeb01605290e2170c98efda79afffb1cff7a206"
          test "$(cat p08/VERSION)" = "0.1.5"
          php -l p08/src/Installation/CleanFullVersionedBootstrap.php
          php -l p08/src/Installation/OwnerWebInstaller.php
          php -l p08/src/Upgrade/OwnerFutureAtomicService.php
          php p08/tests/test_clean_full_versioned_bootstrap.php
          php p08/tests/test_owner_next_release_gateway.php
          php p08/tests/test_owner_github_read_token.php
          php p08/tests/test_owner_github_token_transport.php
          php p08/tests/test_atomic_release_pointer.php
          php p08/tests/test_owner_future_atomic_status.php
          php p08/tests/test_owner_previous_cycle_archive.php > "$RUNNER_TEMP/r150-history.log"
          grep -Fxq P08_R145_PREVIOUS_CYCLE_ROTATION_TOKEN_AND_BACKUP_INTACT=PASS "$RUNNER_TEMP/r150-history.log"
          python3 -B p08/.github/checks/test_architecture_gate.py
          python3 -B p08/.github/checks/architecture_gate.py \
            --manifest p08/.github/checks/code_architecture.json \
            --gov-root "$GITHUB_WORKSPACE/gov" \
            --base-sha 38979874dea85ec14ee91c2357dca117655c48c0 \
            --head-sha 8ff707ed6f48ad7393864d871b2864614c5b7d5c \
            --git-root "$GITHUB_WORKSPACE/p08"
          composer --working-dir=p08 install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader --no-scripts
          npm --prefix p08 ci --ignore-scripts --no-audit --no-fund
          npm --prefix p08 run typecheck
          npm --prefix p08 run build
          npm --prefix p08 run test:unit
          mkdir -p "$RUNNER_TEMP/v015-assets" "$RUNNER_TEMP/v015-extracted"
          python3 -B p08/scripts/build_full.py \
            --source "$GITHUB_WORKSPACE/p08" \
            --output "$RUNNER_TEMP/v015-assets/VF_AdOps_V0.1.5_FULL.zip" \
            --version 0.1.5 --source-sha 8ff707ed6f48ad7393864d871b2864614c5b7d5c \
            --governance-root "$GITHUB_WORKSPACE/gov"
          unzip -q "$RUNNER_TEMP/v015-assets/VF_AdOps_V0.1.5_FULL.zip" -d "$RUNNER_TEMP/v015-extracted"
          P08_ISOLATED_INSTALL_TEST=YES \
          P08_CANDIDATE_SOURCE_SHA=8ff707ed6f48ad7393864d871b2864614c5b7d5c \
          P08_CANDIDATE_VERSION=0.1.5 \
            php p08/tests/test_extracted_full_sqlite_e2e.php "$RUNNER_TEMP/v015-extracted"
          php -r '$r=getenv("RUNNER_TEMP")."/v015-extracted"; $s=trim(file_get_contents($r."/VERSION")); $m=json_decode(file_get_contents($r."/FULL_MANIFEST.json"),true); if($s!=="0.1.5"||$m["target_version"]!==$s||readlink($r."/current")!=="releases/".$m["source_sha"])exit(2); echo "P08_R150_EXTRACTED_FULL_OWNER_INSTALL_VERSIONED=PASS\\n";'
          sha256sum "$RUNNER_TEMP/v015-assets/VF_AdOps_V0.1.5_FULL.zip"
          # Reuse existing native SQL FULL install cases with isolated Docker
          # databases from the SAME SHA-bound FULL as the SQLite install.
          for engine in mysql mariadb; do
            if [ "$engine" = mysql ]; then
              image="mysql:8.4"; client=mysql
            else
              image="mariadb:11.8"; client=mariadb
            fi
            docker pull "$image"
            docker run --detach --rm --name "p08-r150-$engine" \
              -e MYSQL_ROOT_PASSWORD=R150LocalOnly123 \
              -e MARIADB_ROOT_PASSWORD=R150LocalOnly123 \
              -p 127.0.0.1:3306:3306 "$image"
            ready=NO
            for i in $(seq 1 80); do
              if docker exec "p08-r150-$engine" "$client" -uroot -pR150LocalOnly123 -e 'SELECT 1' >/dev/null 2>&1; then
                ready=YES; break
              fi
              sleep 2
            done
            test "$ready" = YES
            docker exec "p08-r150-$engine" "$client" -uroot -pR150LocalOnly123 -e \
              "CREATE DATABASE p08_ci_clean; CREATE DATABASE p08_ci_dirty; \
               CREATE USER 'p08_ci'@'%' IDENTIFIED BY 'R150LocalDB_123'; \
               GRANT ALL PRIVILEGES ON p08_ci_clean.* TO 'p08_ci'@'%'; \
               GRANT ALL PRIVILEGES ON p08_ci_dirty.* TO 'p08_ci'@'%'; \
               CREATE TABLE p08_ci_dirty.sentinel (id INT);"
            site="$RUNNER_TEMP/v015-$engine"
            mkdir -p "$site/tests/compatibility"
            unzip -q "$RUNNER_TEMP/v015-assets/VF_AdOps_V0.1.5_FULL.zip" -d "$site"
            cp p08/tests/test_install_mysql_e2e.php "$site/tests/"
            cp p08/tests/compatibility/r101_complete_schema.php "$site/tests/compatibility/"
            P08_ISOLATED_INSTALL_TEST=YES P08_TEST_DB_HOST=127.0.0.1 \
            P08_TEST_DB_CLEAN=p08_ci_clean P08_TEST_DB_DIRTY=p08_ci_dirty \
            P08_TEST_DB_USER=p08_ci P08_TEST_DB_PASSWORD=R150LocalDB_123 \
            P08_TEST_DB_DRIVER="$engine" \
              php "$site/tests/test_install_mysql_e2e.php"
            php -r '$r=$argv[1];$m=json_decode(file_get_contents($r."/FULL_MANIFEST.json"),true);if(!is_link($r."/current")||readlink($r."/current")!=="releases/".$m["source_sha"]||trim(file_get_contents($r."/current/VERSION"))!=="0.1.5")exit(2);echo "P08_R150_NATIVE_SQL_FULL_VERSIONED_INSTALL=PASS\\n";' "$site"
            docker stop "p08-r150-$engine" >/dev/null
            echo "P08_R150_NATIVE_SQL_"$engine"_INSTALL_AND_BACKEND_LAYOUT=PASS"
          done
          echo P08_R150_REAL_3DB_CLEAN_FULL_EXTRACTED_OWNER_INSTALL=PASS
          echo P08_V015_EXACT_SOURCE_CLEAN_FULL_VERSIONED_AND_NEXT_UPDATES_SOURCE=PASS
      - name: Preserve disposable FULL candidate for independent proof only
        uses: actions/upload-artifact@v4
        with:
          name: P08-v015-CLEAN-FULL-DEV-ONLY
          path: ${{ runner.temp }}/v015-assets/VF_AdOps_V0.1.5_FULL.zip
          retention-days: 2
          if-no-files-found: ignore
      - name: Delete temporary private checkouts and DB fixtures
        if: always()
        shell: bash
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/p08" "$GITHUB_WORKSPACE/gov" "$RUNNER_TEMP/r150-history.log" "$RUNNER_TEMP/v015-extracted" "$RUNNER_TEMP/v015-mysql" "$RUNNER_TEMP/v015-mariadb"
