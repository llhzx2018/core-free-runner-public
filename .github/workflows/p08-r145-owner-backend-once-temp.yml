name: P08 R145 bounded rootless recovery and architecture (TEMP)
on:
  pull_request:
    paths: [.github/workflows/p08-r145-owner-backend-once-temp.yml]
permissions:
  contents: read
jobs:
  r145:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: PHP 8.4 and required file extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: posix,mbstring,zip,sqlite3,pdo_sqlite,pdo_mysql
          coverage: none
      - name: Exact transient private P08 R145 PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: b178141e084bc3b0c4f880501aa4a217f399fe9a
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p08
          persist-credentials: false
          fetch-depth: 0
      - name: Exact transient GOV rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 5aeb01605290e2170c98efda79afffb1cff7a206
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: gov
          persist-credentials: false
          fetch-depth: 1
      - name: Rootless original-suite reuse plus Owner review recovery, tamper and busy negatives
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(id -u)" -ne 0
          test "$(git -C p08 rev-parse HEAD)" = "b178141e084bc3b0c4f880501aa4a217f399fe9a"
          test "$(git -C gov rev-parse HEAD)" = "5aeb01605290e2170c98efda79afffb1cff7a206"
          php -l p08/src/Upgrade/R145OwnerReviewRecovery.php >/dev/null
          php -l p08/tests/test_r145_owner_review_recovery.php >/dev/null
          php p08/tests/test_r145_owner_review_recovery.php > "$RUNNER_TEMP/p08-r145-php.log" 2>&1 || {
            tail -n 35 "$RUNNER_TEMP/p08-r145-php.log"; exit 1;
          }
          for proof in \
            P08_R143_966K_RECEIPT_AND_HISTORY=PASS \
            P08_R145_REVIEW_ARCHIVED_OLD_SESSION_BACKUP_INTACT_NO_SWITCH=PASS \
            P08_R145_OTHER_NEEDS_REVIEW_FAIL_CLOSED=PASS \
            P08_R145_HELD_WORKER_AND_TAMPER_BLOCKED=PASS; do
            grep -Fxq "$proof" "$RUNNER_TEMP/p08-r145-php.log"
          done
          python3 -B p08/.github/checks/test_architecture_gate.py
          python3 -B p08/.github/checks/architecture_gate.py \
            --manifest p08/.github/checks/code_architecture.json \
            --gov-root "$GITHUB_WORKSPACE/gov" \
            --base-sha 38979874dea85ec14ee91c2357dca117655c48c0 \
            --head-sha b178141e084bc3b0c4f880501aa4a217f399fe9a \
            --git-root "$GITHUB_WORKSPACE/p08"
          echo P08_R145_EXACT_SOURCE_ROOTLESS_RECOVERY_ARCHITECTURE=PASS
      - name: Purge transient private checkout and local logs
        if: always()
        shell: bash
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/p08" "$GITHUB_WORKSPACE/gov" "$RUNNER_TEMP/p08-r145-php.log"
