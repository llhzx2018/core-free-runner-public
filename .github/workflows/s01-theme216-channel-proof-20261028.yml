name: S01 Theme 1.35.216 distribution exact-release proof
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/s01-theme216-channel-proof-20261028.yml']
permissions:
  contents: read
jobs:
  channel:
    name: Private exact manifest, updater and release asset verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Checkout public-safe proof control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact private distribution candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: d9b0360642237031d8ba0f5e403ce5d658082588
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: channel
      - name: Exact source and public authority manifest contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = llhzx2018/core-free-runner-public
          test "$(git -C channel rev-parse HEAD)" = d9b0360642237031d8ba0f5e403ce5d658082588
          test "$(cat channel/VERSION)" = 1.3.0
          python3 channel/scripts/check_manifest_contract.py > /tmp/core-manifest-audit.json
          test "$(python3 -c 'import json;print(json.load(open("/tmp/core-manifest-audit.json"))["status"])')" = PASS
          find channel/update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/core-php-lint.txt
          php channel/update-core/php/tests/run.php
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('channel/projects/S01-C01.json').read_text())
          assert m['schema_version']=='wp-component-1.0'
          assert m['component_id']=='S01-C01' and m['component_type']=='THEME'
          assert m['target_version']=='1.35.216'
          assert m['release_tag']=='v1.35.216'
          assert m['asset_name']=='vf-tools-theme_V1.35.216.zip'
          assert m['asset_sha256']=='1aa03833d4c8f94741461c1d4611a35391c1116f4a6b2cfaf9c59e2e112c1f26'
          assert m['asset_bytes']==2025138 and m['runtime_files']==476
          assert m['from_versions'][-1]=='1.35.215' and '1.35.216' not in m['from_versions']
          assert len(m['from_versions'])==len(set(m['from_versions']))==206
          assert m['schema_from']==m['schema_to']=='N/A'
          assert m['backup_required'] and m['rollback_supported']
          print('S01_THEME216_CHANNEL_SCHEMA_SOURCE_IDENTITY_PASS')
          PY
      - name: Actual remote private Formal Release and ZIP bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN" || { echo BLOCKED_PRIVATE_READ_CAPABILITY; exit 78; }
          gh api repos/llhzx2018/vf-tools-theme/releases/tags/v1.35.216 > /tmp/s01-release.json
          gh api repos/llhzx2018/vf-tools-theme/git/ref/tags/v1.35.216 > /tmp/s01-tag.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/s01-release.json'))
          t=json.load(open('/tmp/s01-tag.json'))
          assert r['tag_name']=='v1.35.216' and not r['draft'] and not r['prerelease']
          assert t['object']['sha']=='858e9db51ff7c3f3ed9611512c4a0da673333e7f'
          assets=[a for a in r['assets'] if a['name']=='vf-tools-theme_V1.35.216.zip']
          assert len(assets)==1 and assets[0]['size']==2025138
          assert assets[0].get('digest')=='sha256:1aa03833d4c8f94741461c1d4611a35391c1116f4a6b2cfaf9c59e2e112c1f26'
          print('S01_THEME216_FORMAL_RELEASE_IDENTITY_PASS')
          PY
          mkdir -p /tmp/s01-theme-release
          gh release download v1.35.216 --repo llhzx2018/vf-tools-theme --pattern vf-tools-theme_V1.35.216.zip --dir /tmp/s01-theme-release
          printf '%s  %s\n' 1aa03833d4c8f94741461c1d4611a35391c1116f4a6b2cfaf9c59e2e112c1f26 /tmp/s01-theme-release/vf-tools-theme_V1.35.216.zip | sha256sum --check
          python3 - <<'PY'
          import zipfile
          from pathlib import PurePosixPath
          p='/tmp/s01-theme-release/vf-tools-theme_V1.35.216.zip'
          with zipfile.ZipFile(p) as z:
              files=z.namelist()
              assert len(files)==476 and len(set(files))==476 and z.testzip() is None
              assert all(name.startswith('vf-tools-theme/') and '..' not in PurePosixPath(name).parts for name in files)
              assert 'Version: 1.35.216' in z.read('vf-tools-theme/style.css').decode()
          print('S01_THEME216_REMOTE_BINARY_INTEGRITY_PASS')
          PY
      - name: Ephemeral cleanup
        if: always()
        shell: bash
        run: |
          rm -rf channel /tmp/s01-theme-release
