name: TEMP P08 S3 seven Laravel Owner HTTP failures (metadata only)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p08-s3-seven-owner-http-20261122.yml'
      - 'scripts/temp_p08_s3_safe_junit_summary.py'

permissions:
  contents: read

jobs:
  original-laravel-owner-seven-assertions:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/p08-s3-seven-owner-http-rootcause-20261122'
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      TARGET_SHA: 8c17483ede8329e1b9ba1817ac906d6c8732de22
      P08_ISOLATED_INSTALL_TEST: 'YES'
    steps:
      - name: Fetch public-safe one-time diagnostic script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: public-harness
      - name: Checkout exact transient P08 private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 8c17483ede8329e1b9ba1817ac906d6c8732de22
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-p08
      - name: Exact source, no release, and PHP native runtime
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C private-p08 rev-parse HEAD)" = "$TARGET_SHA"
          test -s private-p08/composer.lock
          test -f private-p08/tests/Feature/VpsStaticWorkflowTest.php
          echo 'P08_S3_OWNER_DIAG_SOURCE=VERIFIED'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_sqlite, sqlite3, zip, mbstring, intl, bcmath, dom, fileinfo
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locked dependencies and original Laravel PHPUnit suite
        working-directory: private-p08
        run: |
          set -Eeuo pipefail
          set +x
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          if ! composer install --no-scripts --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/p08-composer.log" 2>&1; then echo P08_S3_OWNER_DIAG_COMPOSER=FAIL; exit 2; fi
          if ! npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-npm.log" 2>&1; then echo P08_S3_OWNER_DIAG_NPM=FAIL; exit 2; fi
          if ! npm run build > "$RUNNER_TEMP/p08-vue.log" 2>&1; then echo P08_S3_OWNER_DIAG_VUE=FAIL; exit 2; fi
          test -s public/build/manifest.json || { echo P08_S3_OWNER_DIAG_VITE_MANIFEST=MISSING; exit 2; }
          python3 -m py_compile "$GITHUB_WORKSPACE/public-harness/scripts/temp_p08_s3_safe_junit_summary.py"
          echo P08_S3_OWNER_DIAG_VUE_ASSETS=PASS
          set +e
          php vendor/bin/phpunit --no-coverage --colors=never --log-junit "$RUNNER_TEMP/p08-seven-junit.xml" \
            tests/Feature/StaticLandingHandoffTest.php \
            tests/Feature/StaticBundleArchiveDownloadTest.php \
            tests/Feature/StaticPagesWorkflowTest.php \
            tests/Feature/VpsStaticWorkflowTest.php \
            > "$RUNNER_TEMP/p08-seven-phpunit.log" 2>&1
          result=$?
          set -e
          test -s "$RUNNER_TEMP/p08-seven-junit.xml" || { echo P08_S3_OWNER_DIAG_JUNIT=BLOCKED; exit 2; }
          python3 "$GITHUB_WORKSPACE/public-harness/scripts/temp_p08_s3_safe_junit_summary.py" "$RUNNER_TEMP/p08-seven-junit.xml"
          if [ "$result" -eq 0 ]; then echo P08_S3_LARAVEL_OWNER_20=PASS; else echo P08_S3_LARAVEL_OWNER_20=FAIL; fi
          exit "$result"
      - name: Disposable synthetic lost SSH reply state probe
        if: always()
        working-directory: private-p08
        run: |
          set -Eeuo pipefail
          set +x
          python3 "$GITHUB_WORKSPACE/public-harness/scripts/temp_p08_s3_vps_probe.py" tests/Feature/VpsStaticWorkflowTest.php
          set +e
          php vendor/bin/phpunit --no-coverage --colors=never --filter stale_or_foreign_history_is_rejected_and_lost_ssh_reply_needs_explicit_verification tests/Feature/VpsStaticWorkflowTest.php > "$RUNNER_TEMP/p08-probe.log" 2>&1
          result=$?
          set -e
          grep -E '^P08_S3_RESTORE_PROBE_(STATUS|FAULT_UNCONSUMED|REMOTE_SWITCH_CALLED|SESSION_KEYS|LOCAL_STATE)=' "$RUNNER_TEMP/p08-probe.log" | head -n 8 || true
          echo "P08_S3_TEMP_NONEXACT_DIAGNOSTIC_EXIT=$result"
      - name: Purge private source, JUnit, full stderr, and synthetic fixtures
        if: always()
        run: |
          set +e
          rm -rf -- private-p08 public-harness
          rm -f -- "$RUNNER_TEMP"/p08-probe.log "$RUNNER_TEMP"/p08-composer.log "$RUNNER_TEMP"/p08-npm.log "$RUNNER_TEMP"/p08-vue.log "$RUNNER_TEMP"/p08-seven-phpunit.log "$RUNNER_TEMP"/p08-seven-junit.xml
          test ! -e private-p08
          echo P08_S3_PUBLIC_SAFE_CLEANUP=PASS
