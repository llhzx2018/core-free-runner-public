name: P01 V2.47.268 Dialog Cancel Proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p01-v247268-dialog-cancel.yml"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout proof control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare PHP Node runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd nodejs npm >/dev/null

      - name: Checkout exact source and release baseline
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" candidate
          git -C candidate fetch -q origin b9348fd34e4ad0f6cde70cbfe7a0b70b3afbc04d
          git -C candidate checkout -q --detach b9348fd34e4ad0f6cde70cbfe7a0b70b3afbc04d
          test "$(git -C candidate rev-parse HEAD)" = b9348fd34e4ad0f6cde70cbfe7a0b70b3afbc04d
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.268"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "2.47.268"

          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" baseline
          git -C baseline fetch -q origin ec20bffbc9074f85acedc836134132467347905c
          git -C baseline checkout -q --detach ec20bffbc9074f85acedc836134132467347905c
          echo P01_V247268_EXACT_SOURCE=PASS

      - name: Syntax and focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check candidate/src/assets/links-admin.js
          php -l candidate/src/links-admin.php
          php -l candidate/src/app/bootstrap.php
          php candidate/tests/unit/category_dialog_close_v247268_contract.php
          php candidate/tests/unit/links_dialog_cancel_save_guard_contract.php
          php candidate/tests/unit/navigation_category_accordion_v247267_contract.php
          php candidate/tests/unit/navigation_category_runtime_binding_v247264_contract.php
          php candidate/tests/unit/admin_navigation_consistency_contract.php
          echo P01_V247268_FOCUSED=PASS

      - name: Actual DOM event and native validation smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --prefix /tmp/vf-dialog-test --no-audit --no-fund --no-save jsdom@26.1.0
          NODE_PATH=/tmp/vf-dialog-test/node_modules node candidate/tests/browser/category_dialog_close_v247268.cjs
          echo P01_V247268_DOM_SMOKE=PASS

      - name: Canonical zero debt regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate baseline --require-zero-debt | tee /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/canonical.txt
          echo P01_V247268_CANONICAL=PASS

      - name: Bounded scope
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C candidate diff --name-only ec20bffbc9074f85acedc836134132467347905c..b9348fd34e4ad0f6cde70cbfe7a0b70b3afbc04d | tee /tmp/changed.txt
          if grep -E '(^|/)(migrations|schema|auth|security|update|install|setup)' /tmp/changed.txt; then
            echo "Unexpected high-risk scope"
            exit 1
          fi
          echo FORMAL_RELEASE_CALLED=NO
          echo DISTRIBUTION_WRITE=NO
          echo PRODUCTION_WRITE=NO
