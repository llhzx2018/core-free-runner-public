name: P03 V1.35.4 Distribution Repair R1 Remote Acceptance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p03-v1354-dist-r1-remote-acceptance.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: p03-v1354-dist-r1-remote-acceptance
  cancel-in-progress: false

jobs:
  remote-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DIST_BUILD_COMMIT: 1c9993ae94566a6b83c8bd53e71b01761aa37f59
      DIST_BUILD_TREE: 7a216956ef6fb81aee2de08b55c4275af91323a9
      PRODUCTION_COMMIT: 263c4d8f7e38bff58db5680a6845ceb5a576d6ae
      CORRECTIVE_RELEASE_ID: '371497308'
      CORRECTIVE_TAG: v1.35.4-dist-r1
      CORRECTIVE_RELEASE_NAME: VF Forge V1.35.4 Distribution Repair R1
      UPDATE_ASSET_ID: '517498815'
      UPDATE_BYTES: '766304'
      UPDATE_SHA256: dcc784332669ae4c2dc5ec9bc723cdc174c631b6ea2dc8c9d87ae28135a52141
      ORIGINAL_RELEASE_ID: '371488636'
      ORIGINAL_UPDATE_ASSET_ID: '517455108'
      ORIGINAL_UPDATE_BYTES: '766277'
      ORIGINAL_UPDATE_SHA256: c063d99e8ab99b86da345599c8db2f27d961b3565df94daafd203e867d8c8073

    steps:
      - name: Require private read credential
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo 'PRIVATE_READ_CREDENTIAL=PASS'

      - name: Checkout exact Distribution Build Commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-forge
          ref: ${{ env.DIST_BUILD_COMMIT }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: distribution

      - name: Checkout exact Production V1.35.3 parser
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-forge
          ref: ${{ env.PRODUCTION_COMMIT }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: production

      - name: Prepare PHP Zip runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-zip unzip >/dev/null
          php -r 'if(!class_exists("ZipArchive")){fwrite(STDERR,"ZipArchive missing\n");exit(1);} echo "REMOTE_ACCEPTANCE_RUNTIME=PASS\n";'

      - name: Remote release and asset identity readback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/p03-dist-r1-remote"; rm -rf "$ROOT"; mkdir -p "$ROOT"
          test "$(git -C distribution rev-parse HEAD)" = "$DIST_BUILD_COMMIT"
          test "$(git -C distribution rev-parse HEAD^{tree})" = "$DIST_BUILD_TREE"
          test "$(git -C production rev-parse HEAD)" = "$PRODUCTION_COMMIT"
          gh api "/repos/llhzx2018/vf-forge/git/ref/tags/$CORRECTIVE_TAG" > "$ROOT/tag.json"
          gh api "/repos/llhzx2018/vf-forge/releases/$CORRECTIVE_RELEASE_ID" > "$ROOT/release.json"
          python3 - "$ROOT/tag.json" "$ROOT/release.json" <<'PY'
          import json,os,sys
          tag=json.load(open(sys.argv[1]));rel=json.load(open(sys.argv[2]))
          assert tag['object']['sha']==os.environ['DIST_BUILD_COMMIT']
          assert rel['id']==int(os.environ['CORRECTIVE_RELEASE_ID'])
          assert rel['tag_name']==os.environ['CORRECTIVE_TAG']
          assert rel['name']==os.environ['CORRECTIVE_RELEASE_NAME']
          assert rel['draft'] is False and rel['prerelease'] is False
          expected={
            'repair-v1.35.4.php':(517498810,1024697,'de1b0eeed2d73474bd9a0332b3f09c024d530067589060d71beb99ae2f4e882c'),
            'VF_Forge_V1.35.4_UPDATE_DIST_R1.zip':(517498815,766304,'dcc784332669ae4c2dc5ec9bc723cdc174c631b6ea2dc8c9d87ae28135a52141'),
            'VF_Forge_V1.35.4_Atomic_Upgrade_DIST_R1.zip':(517498823,766304,'dcc784332669ae4c2dc5ec9bc723cdc174c631b6ea2dc8c9d87ae28135a52141'),
            'VF_Forge_V1.35.4_DISTRIBUTION_REPAIR_R1_MANIFEST.json':(517498837,2076,'2c301c10917d855585c740f3b66f0bbb7dcbae8a6c8cccd152985f108da75ac4'),
            'VF_Forge_V1.35.4_DISTRIBUTION_REPAIR_R1_NOTES.md':(517498850,963,'c396ffdcd082d8bd90f13bf5501b62bb435c1aac0a87f43fc383e63b21a96c2e'),
            'SHA256SUMS_DIST_R1.txt':(517498859,532,'8af4609fc4011519fbf8cc0b1766603c5d1b3e60355c3532fea416b0c7fc284b')}
          assets={a['name']:a for a in rel['assets']};assert set(assets)==set(expected)
          for name,(aid,size,sha) in expected.items():
              a=assets[name];assert a['id']==aid and a['state']=='uploaded' and a['size']==size and a.get('digest')=='sha256:'+sha,(name,a)
              print('REMOTE_ASSET_IDENTITY=PASS',a['id'],name,a['size'],a.get('digest'))
          print('REMOTE_RELEASE_IDENTITY=PASS')
          PY

      - name: Download exact Remote UPDATE with single binary Accept
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/p03-dist-r1-remote"
          gh api -H 'Accept: application/octet-stream' "/repos/llhzx2018/vf-forge/releases/assets/$UPDATE_ASSET_ID" > "$ROOT/remote-update.zip"
          test "$(stat -c%s "$ROOT/remote-update.zip")" = "$UPDATE_BYTES"
          test "$(sha256sum "$ROOT/remote-update.zip"|awk '{print $1}')" = "$UPDATE_SHA256"
          unzip -t "$ROOT/remote-update.zip" >/dev/null
          test "$(unzip -Z1 "$ROOT/remote-update.zip")" = 'repair-v1.35.4.php'
          echo 'REMOTE_UPDATE_DOWNLOAD=PASS'
          echo "REMOTE_UPDATE_BYTES=$(stat -c%s "$ROOT/remote-update.zip")"
          echo "REMOTE_UPDATE_SHA256=$(sha256sum "$ROOT/remote-update.zip"|awk '{print $1}')"

      - name: Execute exact Remote N-1 Acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/p03-dist-r1-remote"
          python3 distribution/scripts/distribution/production_n_minus_1_update_acceptance_gate.py \
            --parser production/src/app/ManualUpdateService.php \
            --update "$ROOT/remote-update.zip"
          echo 'REMOTE_N_MINUS_1_ACCEPTANCE=PASS'

      - name: Verify original V1.35.4 Product Release unchanged
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/p03-dist-r1-remote"
          gh api "/repos/llhzx2018/vf-forge/releases/$ORIGINAL_RELEASE_ID" > "$ROOT/original-release.json"
          python3 - "$ROOT/original-release.json" <<'PY'
          import json,os,sys
          d=json.load(open(sys.argv[1]));assert d['id']==int(os.environ['ORIGINAL_RELEASE_ID']) and d['tag_name']=='v1.35.4'
          a={x['name']:x for x in d['assets']}
          u=a['VF_Forge_V1.35.4_UPDATE.zip']
          assert u['id']==int(os.environ['ORIGINAL_UPDATE_ASSET_ID'])
          assert u['size']==int(os.environ['ORIGINAL_UPDATE_BYTES'])
          assert u.get('digest')=='sha256:'+os.environ['ORIGINAL_UPDATE_SHA256']
          print('ORIGINAL_V1354_RELEASE_UNCHANGED=PASS')
          PY

      - name: Verify zero public artifacts and cleanup
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf distribution production "$RUNNER_TEMP/p03-dist-r1-remote"
          RESP=$(curl -fsS -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts")
          test "$(python3 -c 'import json,sys;print(json.load(sys.stdin)["total_count"])' <<<"$RESP")" = 0
          echo 'PUBLIC_ACTIONS_ARTIFACTS=0'
          echo 'EPHEMERAL_CLEANUP=PASS'

      - name: Remote acceptance verdict
        shell: bash
        run: |
          echo 'REMOTE_RELEASE_READBACK=PASS'
          echo 'REMOTE_N_MINUS_1_ACCEPTANCE=PASS'
          echo 'ORIGINAL_V1354_RELEASE_MODIFIED=NO'
          echo 'CORE_UPDATES=QUARANTINED_ENABLED_FALSE'
          echo 'PRODUCTION_WRITE=0'
          echo 'NEXT=AUTHORITY_SEAL_THEN_STOP_FOR_MASTER'
