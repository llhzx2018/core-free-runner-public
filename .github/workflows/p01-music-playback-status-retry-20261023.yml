name: P01 Music cross-page playback status and retry regression (one-shot)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-music-playback-status-retry-20261023.yml'
permissions:
  contents: read
jobs:
  focused-music:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout runner request only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare bounded PHP and Node test tools
        run: |
          set -Eeuo pipefail
          # Github hosted ubuntu-24.04 image supplies PHP/Node. Avoid apt mirror
          # delays and do not alter machine image for this bounded smoke.
          php -v
          php -m | grep -i -F pdo_sqlite
          php -m | grep -i -F curl
          node --version
      - name: Fetch exact P01 Music candidate
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --depth 1 --branch fix/p01-music-playback-status-retry-20261023 "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" candidate
          test "$(git -C candidate rev-parse HEAD)" = d81559eff2a2fd694633ea4297123a0f9d935e5c
          test "$(cat candidate/VERSION)" = 2.47.439
      - name: PHP and JavaScript syntax checks
        run: |
          set -Eeuo pipefail
          for f in music-shell.php music-home.php music-discover.php music-radio.php; do php -l "candidate/src/$f"; done
          node --check candidate/src/assets/music-dock.js
          node --check candidate/src/assets/music-shell-route.js
          node --check candidate/tests/unit/music_dock_contract.js
          node --check candidate/tests/unit/music_layout_density_contract.js
          node --check candidate/tests/unit/music_interaction_quality_contract.js
          node --check candidate/src/assets/music-discover.js
          node --check candidate/src/assets/music-radio.js
      - name: Run focused audio persistence and security tests
        run: |
          set -Eeuo pipefail
          cd candidate
          node tests/unit/music_layout_density_contract.js
          node tests/unit/music_interaction_quality_contract.js
          node tests/unit/music_dock_contract.js
          node tests/unit/music_shell_route_contract.js
          node tests/unit/music_radio_directory_contract.js
          node tests/unit/music_audius_directory_contract.js
          php tests/unit/music_security_contract.php
          echo P01_MUSIC_PLAYBACK_STATUS_RETRY_UNIT_PASS
      - name: Real authenticated shell and child HTTP integration
        run: |
          set -Eeuo pipefail
          bash candidate/tests/integration/music_fresh_http.sh candidate
          echo P01_MUSIC_PLAYBACK_STATUS_RETRY_HTTP_PASS
      - name: Cleanup synthetic installation
        if: always()
        run: rm -rf candidate
