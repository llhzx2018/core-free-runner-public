name: P02 V2.5.50 Mobile Command Hierarchy Gate

on:
  push:
    branches:
      - run/p02-v2550-mobile-command-20260920
    paths:
      - '.github/workflows/p02-v2550-mobile-command.yml'

permissions:
  contents: read

jobs:
  ux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_SHA: 7211839f05de55a0add19e3bc362c13fdaf993a9
      TARGET_VERSION: 2.5.50
    steps:
      - name: Checkout exact P02 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 7211839f05de55a0add19e3bc362c13fdaf993a9
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product

      - name: Install runtime and Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-zip sqlite3 curl
          cd product
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify source and mobile command contracts
        shell: bash
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "$TARGET_VERSION"
          bash scripts/verify-repository.sh
          node tests/unit/p02_v2542_inkstone_reference_contract.mjs
          node tests/unit/p02_v2543_editor_list_continuity.mjs
          node tests/unit/p02_v2544_full_list_density.mjs
          node tests/unit/p02_v2545_settings_form_convergence.mjs
          node tests/unit/p02_v2548_workspace_toolbar_convergence.mjs
          node tests/unit/p02_v2549_sidebar_command_convergence.mjs
          node tests/unit/p02_v2550_mobile_command_hierarchy.mjs
          node tests/unit/p02_runtime_style_single_entry.mjs
          node tests/unit/p02_candidate_version_identity_contract.mjs
          echo P02_V2550_MOBILE_COMMAND_SOURCE_GATE=PASS

      - name: Real Chromium UX regression
        shell: bash
        working-directory: product
        run: |
          set -Eeuo pipefail
          bash scripts/ux-browser-reverify.sh
          echo P02_V2550_MOBILE_COMMAND_BROWSER_GATE=PASS
