name: P01 V2.47.6 Formal Publish

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v2476-formal-publish.yml'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      FORMAL_SHA: 67ffe44e67909ef5f172f3ba54e4e54da412d41b
      CANDIDATE_SHA: cbc883ba9ad59042775fb1b76a58d1a93489ec79
      PREVIEW_TAG: v2.47.6-preview.1
      FORMAL_TAG: v2.47.6
      FULL_NAME: VF-Start-V2.47.6-FULL.zip
      UPDATE_NAME: VF_Start_V2.47.6_UPDATE.zip
      FULL_SHA: 3bd0067398a18c415b9356c8455df0a7f3f1a89110a64f1300598047352426e7
      UPDATE_SHA: 8c632907a7a14cb3e38c0ca934be134863fd68220dd59239038a2cdd19879819
      FULL_BYTES: '856916'
      UPDATE_BYTES: '1828182'
    steps:
      - name: Exact authority and release boundary
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN" && test -n "$RELEASE_TOKEN"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/main" --jq '.object.sha')" = "$FORMAL_SHA"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/contents/VERSION?ref=${FORMAL_SHA}" -H 'Accept: application/vnd.github.raw+json')" = '2.47.6'
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/contents/src/VERSION.txt?ref=${FORMAL_SHA}" -H 'Accept: application/vnd.github.raw+json')" = '2.47.6'
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/tags/${PREVIEW_TAG}" --jq '.object.sha')" = "$CANDIDATE_SHA"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/releases/tags/${PREVIEW_TAG}" --jq '.prerelease')" = true
          if GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/tags/${FORMAL_TAG}" >/dev/null 2>&1; then
            echo 'FORMAL_BLOCK=TAG_ALREADY_EXISTS'; exit 81
          fi
          if GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/releases/tags/${FORMAL_TAG}" >/dev/null 2>&1; then
            echo 'FORMAL_BLOCK=RELEASE_ALREADY_EXISTS'; exit 82
          fi
          test "$(GH_TOKEN="$RELEASE_TOKEN" gh api "repos/${PRODUCT_REPO}" --jq '.permissions.push')" = true
          echo P01_V2476_FORMAL_AUTHORITY=PASS

      - name: Download exact verified preview assets
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p formal-assets
          gh release download "$PREVIEW_TAG" --repo "$PRODUCT_REPO" --dir formal-assets
          test "$(sha256sum "formal-assets/$FULL_NAME" | awk '{print $1}')" = "$FULL_SHA"
          test "$(sha256sum "formal-assets/$UPDATE_NAME" | awk '{print $1}')" = "$UPDATE_SHA"
          test "$(stat -c%s "formal-assets/$FULL_NAME")" = "$FULL_BYTES"
          test "$(stat -c%s "formal-assets/$UPDATE_NAME")" = "$UPDATE_BYTES"
          test -f "formal-assets/$FULL_NAME.sha256"
          test -f "formal-assets/$UPDATE_NAME.sha256"
          echo P01_V2476_FORMAL_FROZEN_ASSETS=PASS

      - name: Create stable tag and formal release
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api --method POST "repos/${PRODUCT_REPO}/git/refs" -f ref="refs/tags/${FORMAL_TAG}" -f sha="$FORMAL_SHA" >/dev/null
          test "$(gh api "repos/${PRODUCT_REPO}/git/ref/tags/${FORMAL_TAG}" --jq '.object.sha')" = "$FORMAL_SHA"
          cat > /tmp/v2476-notes.md <<'EOF'
          # P01 · VF Start V2.47.6

          R21 prototype-led page density rebaseline.

          - Runtime product bytes promoted from exact preview candidate `cbc883ba9ad59042775fb1b76a58d1a93489ec79`.
          - Formal source: `67ffe44e67909ef5f172f3ba54e4e54da412d41b`.
          - Previous formal: V2.47.5.
          - Schema: `2026090401` unchanged; Migration: NONE.
          - Fresh Install / authenticated desktop+mobile Chromium / Atomic 2.47.5→2.47.6 / data preservation / backup+rollback / security / remote byte readback: PASS.
          - Stable online-update publication is separate from Production installation; Production is not claimed by this release.
          EOF
          gh release create "$FORMAL_TAG" \
            "formal-assets/$FULL_NAME" \
            "formal-assets/$FULL_NAME.sha256" \
            "formal-assets/$UPDATE_NAME" \
            "formal-assets/$UPDATE_NAME.sha256" \
            --repo "$PRODUCT_REPO" \
            --title 'VF Start V2.47.6' \
            --notes-file /tmp/v2476-notes.md \
            --verify-tag
          echo P01_V2476_FORMAL_RELEASE_CREATED=PASS

      - name: Independent formal release readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api "repos/${PRODUCT_REPO}/releases/tags/${FORMAL_TAG}" --jq '.draft')" = false
          test "$(gh api "repos/${PRODUCT_REPO}/releases/tags/${FORMAL_TAG}" --jq '.prerelease')" = false
          test "$(gh api "repos/${PRODUCT_REPO}/git/ref/tags/${FORMAL_TAG}" --jq '.object.sha')" = "$FORMAL_SHA"
          FULL_REMOTE_SHA="$(gh api "repos/${PRODUCT_REPO}/releases/tags/${FORMAL_TAG}" --jq ".assets[] | select(.name==\"$FULL_NAME\") | .digest" | sed 's/^sha256://')"
          UPDATE_REMOTE_SHA="$(gh api "repos/${PRODUCT_REPO}/releases/tags/${FORMAL_TAG}" --jq ".assets[] | select(.name==\"$UPDATE_NAME\") | .digest" | sed 's/^sha256://')"
          FULL_REMOTE_BYTES="$(gh api "repos/${PRODUCT_REPO}/releases/tags/${FORMAL_TAG}" --jq ".assets[] | select(.name==\"$FULL_NAME\") | .size")"
          UPDATE_REMOTE_BYTES="$(gh api "repos/${PRODUCT_REPO}/releases/tags/${FORMAL_TAG}" --jq ".assets[] | select(.name==\"$UPDATE_NAME\") | .size")"
          test "$FULL_REMOTE_SHA" = "$FULL_SHA"
          test "$UPDATE_REMOTE_SHA" = "$UPDATE_SHA"
          test "$FULL_REMOTE_BYTES" = "$FULL_BYTES"
          test "$UPDATE_REMOTE_BYTES" = "$UPDATE_BYTES"
          echo P01_V2476_FORMAL_RELEASE_READBACK=PASS
          echo PRODUCTION_WRITE=false
