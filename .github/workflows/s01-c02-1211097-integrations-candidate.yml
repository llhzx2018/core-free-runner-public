name: S01 C02 1211097 GSC Config Save Candidate
on:
  push:
    branches: [task/s01-c02-1211097-integrations-candidate-20261012]
permissions:
  contents: read
jobs:
  integrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_DIR: ${{ github.workspace }}/product
    steps:
      - name: Checkout registered test lane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Checkout exact draft candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: e870ee33b4848735ebda1a529a215d04cf00bb66
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Exact source syntax and native PHP view assertions
        run: |
          test "$(git -C product rev-parse HEAD)" = e870ee33b4848735ebda1a529a215d04cf00bb66
          node --check product/assets/js/v13/system/integrations.js
          php -l product/includes/admin-v13/views/integrations.php
          php product/tests/s01-c02-1211092-integrations-state-render.php
      - name: Install disposable Chromium
        working-directory: product
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Published baseline integrations views and exact candidate browser workflow
        env:
          NODE_PATH: ${{ github.workspace }}/product/node_modules
        run: |
          cd product && node tests/s01-c02-1211092-integrations-state-browser-proof.js
          cd .. && node runner/lanes/s01-c02-integrations-1097/browser.cjs
          echo S01_C02_1097_CANDIDATE_CHROMIUM_PASS
