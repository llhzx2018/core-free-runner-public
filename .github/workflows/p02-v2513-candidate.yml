name: P02 V2.5.13 Candidate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v2513-candidate.yml'
      - 'scripts/p02-v2513-candidate.sh'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PRODUCT_REF: 3440bb64956452ebd51fc71cc14fa9580d54ed84
    steps:
      - name: Require private read capability
        env:
          TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: test -n "$TOKEN"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.PRODUCT_REF }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          path: product
          fetch-depth: 1
          persist-credentials: false
      - name: Verify V2.5.13 candidate
        run: |
          sed -i 's#https://example.com/v2513.png#/file.php?id=999#g' scripts/p02-v2513-candidate.sh
          bash scripts/p02-v2513-candidate.sh
