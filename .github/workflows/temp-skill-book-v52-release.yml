name: TEMP skill-book V5.2 Candidate Release

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-skill-book-v52-release.yml'

permissions:
  contents: read

jobs:
  v52-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout temporary runner head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout exact validated GOV source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/gov-doc
          ref: 11b48ba32bab1f7be7c3ac284fe234757a5f783f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: gov
          fetch-depth: 1

      - name: Guard exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C gov rev-parse HEAD)" = '11b48ba32bab1f7be7c3ac284fe234757a5f783f'
          cd gov/skills/skill-book/V5.2
          test "$(cat VERSION)" = '5.2'
          sha256sum -c SHA256SUMS.txt
          test "$(find . -type f | wc -l)" -eq 79
          test "$(find . -type f -name '*.py' | wc -l)" -eq 33

      - name: Syntax 33 of 33
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          files=sorted(Path('gov/skills/skill-book/V5.2').rglob('*.py'))
          assert len(files)==33
          for p in files:
              compile(p.read_text(encoding='utf-8'),str(p),'exec')
          print('PYTHON_SYNTAX=33/33 PASS')
          PY

      - name: Exact source regression 81 of 81
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -q 'pytest>=8,<9'
          cd gov/skills/skill-book/V5.2
          python3 -m pytest -q | tee /tmp/v52-release-pytest.log
          grep -Eq '81 passed' /tmp/v52-release-pytest.log

      - name: Build exact deterministic release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v52-release
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, zipfile
          root=Path('gov/skills/skill-book/V5.2')
          rels=[]
          for line in (root/'SHA256SUMS.txt').read_text(encoding='utf-8').splitlines():
              digest,rel=line.split('  ',1)
              assert hashlib.sha256((root/rel).read_bytes()).hexdigest()==digest,rel
              rels.append(rel)
          rels=sorted(rels+['SHA256SUMS.txt']); assert len(rels)==79
          out=Path('/tmp/v52-release/skill-book_V5.2_CANDIDATE_20260828.zip')
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_STORED) as z:
              for rel in rels:
                  pp=PurePosixPath(rel); assert not pp.is_absolute() and '..' not in pp.parts
                  info=zipfile.ZipInfo('skill-book_V5.2_CANDIDATE/'+rel,date_time=(1980,1,1,0,0,0))
                  info.compress_type=zipfile.ZIP_STORED; info.create_system=3; info.external_attr=(0o100644<<16)
                  z.writestr(info,(root/rel).read_bytes())
          data=out.read_bytes(); sha=hashlib.sha256(data).hexdigest()
          assert len(data)==313673, len(data)
          assert sha=='28fb3d07cd77f957bd1e22730c9584f7a250f4acef8228663f71ba845942b1c7',sha
          with zipfile.ZipFile(out) as z:
              infos=z.infolist(); names=[i.filename for i in infos]
              assert len(infos)==79 and z.testzip() is None
              assert names==sorted(names) and len(names)==len(set(names))
              assert all(i.compress_type==zipfile.ZIP_STORED for i in infos)
              assert all(i.date_time==(1980,1,1,0,0,0) for i in infos)
              assert all((i.external_attr>>16)==0o100644 for i in infos)
              assert not any('__pycache__' in n or n.endswith('.pyc') for n in names)
          print('RELEASE_BUILD_IDENTITY=MATCH')
          print('BYTES=313673')
          print('SHA256='+sha)
          PY
          cd /tmp/v52-release
          sha256sum skill-book_V5.2_CANDIDATE_20260828.zip > skill-book_V5.2_CANDIDATE_20260828.zip.sha256
          test "$(cat skill-book_V5.2_CANDIDATE_20260828.zip.sha256)" = '28fb3d07cd77f957bd1e22730c9584f7a250f4acef8228663f71ba845942b1c7  skill-book_V5.2_CANDIDATE_20260828.zip'

      - name: Create prerelease and upload exact assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          TAG: skill-book-v5.2-candidate-20260828
          REPO: llhzx2018/gov-doc
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo 'V5.2 release tag already exists; refusing replacement' >&2
            exit 1
          fi
          gh release create "$TAG" \
            /tmp/v52-release/skill-book_V5.2_CANDIDATE_20260828.zip \
            /tmp/v52-release/skill-book_V5.2_CANDIDATE_20260828.zip.sha256 \
            --repo "$REPO" \
            --target '11b48ba32bab1f7be7c3ac284fe234757a5f783f' \
            --prerelease \
            --title 'skill-book V5.2 Candidate' \
            --notes "Candidate only; not Current. Exact Source Commit: 11b48ba32bab1f7be7c3ac284fe234757a5f783f. Public Runner Source Gate: 33188624405 / 98908050358. Source regression: 81/81 PASS reconstructed and 81/81 PASS exact remote staging; release exact-source regression: 81/81 PASS. Python syntax: 33/33 PASS. Deterministic ZIP: 313673 bytes / SHA256 28fb3d07cd77f957bd1e22730c9584f7a250f4acef8228663f71ba845942b1c7. Fresh E1 Runtime: PASS_RUNTIME_ACCEPTANCE / PASS_NOT_APPLICABLE_NEW_BOOK / PASS_FREEZE_INTEGRITY. Reader Outcome remains BLOCK_REPLACEMENT because real-reader READ / LEARN / TRAIN are NOT_RUN. Backend-installed V5.2 Runtime: NOT_RUN. Current Promotion: NOT_AUTHORIZED."

      - name: Remote asset download readback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          TAG: skill-book-v5.2-candidate-20260828
          REPO: llhzx2018/gov-doc
        run: |
          set -euo pipefail
          mkdir -p /tmp/v52-readback
          gh release download "$TAG" --repo "$REPO" --dir /tmp/v52-readback
          test "$(stat -c %s /tmp/v52-readback/skill-book_V5.2_CANDIDATE_20260828.zip)" -eq 313673
          echo '28fb3d07cd77f957bd1e22730c9584f7a250f4acef8228663f71ba845942b1c7  /tmp/v52-readback/skill-book_V5.2_CANDIDATE_20260828.zip' | sha256sum -c -
          test "$(cat /tmp/v52-readback/skill-book_V5.2_CANDIDATE_20260828.zip.sha256)" = '28fb3d07cd77f957bd1e22730c9584f7a250f4acef8228663f71ba845942b1c7  skill-book_V5.2_CANDIDATE_20260828.zip'
          python3 - <<'PY'
          import zipfile
          p='/tmp/v52-readback/skill-book_V5.2_CANDIDATE_20260828.zip'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert len(z.infolist())==79
          print('REMOTE_DOWNLOAD_READBACK=PASS')
          PY

      - name: Stable release identity
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          TAG: skill-book-v5.2-candidate-20260828
          REPO: llhzx2018/gov-doc
        run: |
          set -euo pipefail
          gh api "repos/$REPO/releases/tags/$TAG" > /tmp/v52-release.json
          jq -e '.draft == false and .prerelease == true and .target_commitish == "11b48ba32bab1f7be7c3ac284fe234757a5f783f"' /tmp/v52-release.json >/dev/null
          jq -e '.assets | length == 2' /tmp/v52-release.json >/dev/null
          ZIP_ID="$(jq -r '.assets[] | select(.name=="skill-book_V5.2_CANDIDATE_20260828.zip") | .id' /tmp/v52-release.json)"
          SHA_ID="$(jq -r '.assets[] | select(.name=="skill-book_V5.2_CANDIDATE_20260828.zip.sha256") | .id' /tmp/v52-release.json)"
          RELEASE_ID="$(jq -r '.id' /tmp/v52-release.json)"
          ZIP_SIZE="$(jq -r '.assets[] | select(.name=="skill-book_V5.2_CANDIDATE_20260828.zip") | .size' /tmp/v52-release.json)"
          ZIP_DIGEST="$(jq -r '.assets[] | select(.name=="skill-book_V5.2_CANDIDATE_20260828.zip") | .digest' /tmp/v52-release.json)"
          test "$ZIP_SIZE" = '313673'
          test "$ZIP_DIGEST" = 'sha256:28fb3d07cd77f957bd1e22730c9584f7a250f4acef8228663f71ba845942b1c7'
          test -n "$RELEASE_ID" && test -n "$ZIP_ID" && test -n "$SHA_ID"
          echo "V5.2_RELEASE_RUN=$GITHUB_RUN_ID"
          echo "RELEASE_ID=$RELEASE_ID"
          echo "ZIP_ASSET_ID=$ZIP_ID"
          echo "SHA_ASSET_ID=$SHA_ID"
          echo 'STATUS=PUBLISHED_REMOTE_VERIFIED'
