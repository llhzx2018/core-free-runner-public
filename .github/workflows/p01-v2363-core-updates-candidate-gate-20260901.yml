name: P01 V2.36.3 Core Updates Candidate Gate
on:
  push:
    branches: [release/p01-v2363-candidate-20260901]
    paths: [.github/workflows/p01-v2363-core-updates-candidate-gate-20260901.yml]
permissions:
  contents: read
  actions: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CORE_BASE: 3ddf344872744ba4e9e407c99fe704b90a4cda97
      MANIFEST_SOURCE: 650935cc9d71570a7ab7a0dd1c615ea5e3bf74bf
      PRODUCT_SOURCE: 718e043e3715ef7b21849bc08634fca89bf92c1f
      PUBLICATION_RUN: '33504341771'
      RELEASE_ID: '380449563'
      ASSET_NAME: VF_Start_V2.36.3_UPDATE.zip
      ASSET_BYTES: '1236976'
      ASSET_SHA256: 7110d0e232ce7dec521b4e76148441d06376a02124249d68237b774f2d33447d
      EVID: /tmp/p01-v2363-core-updates-candidate-evidence
    steps:
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: zip
          coverage: none
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.MANIFEST_SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: updates
      - name: Validate candidate against published V2.36.3
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVID/download"
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$PUBLICATION_RUN --jq .conclusion)" = success
          cd updates
          test "$(git rev-parse HEAD)" = "$MANIFEST_SOURCE"
          test "$(git rev-parse HEAD^)" = "$CORE_BASE"
          test "$(git diff --name-only "$CORE_BASE" "$MANIFEST_SOURCE")" = projects/P01.json
          M=projects/P01.json
          jq -e . "$M" >/dev/null
          test "$(jq -r .project_id "$M")" = P01
          test "$(jq -r .component_id "$M")" = APP
          test "$(jq -r .enabled "$M")" = true
          test "$(jq -r .current_version "$M")" = 2.36.2
          test "$(jq -r .target_version "$M")" = 2.36.3
          test "$(jq -r '.from_versions|join(",")' "$M")" = 2.36.2
          test "$(jq -r .update_type "$M")" = ATOMIC
          test "$(jq -r .schema_from "$M")" = 2026082901
          test "$(jq -r .schema_to "$M")" = 2026082901
          test "$(jq -r .repository "$M")" = llhzx2018/vf-start
          test "$(jq -r .release_tag "$M")" = v2.36.3
          test "$(jq -r .release_id "$M")" = "$RELEASE_ID"
          test "$(jq -r .product_identity "$M")" = "$PRODUCT_SOURCE"
          test "$(jq -r .asset_name "$M")" = "$ASSET_NAME"
          test "$(jq -r .asset_bytes "$M")" = "$ASSET_BYTES"
          test "$(jq -r .asset_sha256 "$M")" = "$ASSET_SHA256"
          test "$(jq -r .backup_required "$M")" = true
          test "$(jq -r .rollback_supported "$M")" = true
          TAG=$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.36.3 --jq .object.sha)
          test "$TAG" = "$PRODUCT_SOURCE"
          gh api repos/llhzx2018/vf-start/releases/tags/v2.36.3 > "$EVID/release.json"
          test "$(jq -r .id "$EVID/release.json")" = "$RELEASE_ID"
          test "$(jq -r .tag_name "$EVID/release.json")" = v2.36.3
          test "$(jq -r .draft "$EVID/release.json")" = false
          test "$(jq -r .prerelease "$EVID/release.json")" = false
          jq -e --arg n "$ASSET_NAME" --argjson b "$ASSET_BYTES" --arg d "sha256:$ASSET_SHA256" '.assets[]|select(.name==$n and .size==$b and .digest==$d and .state=="uploaded")' "$EVID/release.json" >/dev/null
          gh release download v2.36.3 --repo llhzx2018/vf-start --pattern "$ASSET_NAME" --dir "$EVID/download"
          A="$EVID/download/$ASSET_NAME"; test -f "$A"
          test "$(stat -c %s "$A")" = "$ASSET_BYTES"
          test "$(sha256sum "$A"|awk '{print $1}')" = "$ASSET_SHA256"
          unzip -Z1 "$A" | grep -Fx repair-v2.36.3.php >/dev/null
          unzip -p "$A" repair-v2.36.3.php > "$EVID/repair-v2.36.3.php"
          php -l "$EVID/repair-v2.36.3.php" >/dev/null
          grep -F "public const SOURCE_VERSION='2.36.2';" "$EVID/repair-v2.36.3.php" >/dev/null
          grep -F "public const TARGET_VERSION='2.36.3';" "$EVID/repair-v2.36.3.php" >/dev/null
          php "$EVID/repair-v2.36.3.php" --self-test | tee "$EVID/atomic-self-test.json" | jq -e '.ok==true and .global_barrier==true and .interruption_recovery==true' >/dev/null
          REMOTE_MAIN=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          test "$REMOTE_MAIN" = "$CORE_BASE"
          git show "$CORE_BASE:projects/P01.json" > "$EVID/live-P01-before.json"
          test "$(jq -r .current_version "$EVID/live-P01-before.json")" = 2.36.1
          test "$(jq -r .target_version "$EVID/live-P01-before.json")" = 2.36.2
          test "$(jq -r '.from_versions|join(",")' "$EVID/live-P01-before.json")" = 2.36.1
          printf 'P01_V2363_CORE_UPDATES_CANDIDATE_GATE=PASS\nMANIFEST_SOURCE=%s\nCORE_UPDATES_MAIN_BEFORE=%s\nPRODUCT_SOURCE=%s\nRELEASE_ID=%s\nASSET_BYTES=%s\nASSET_SHA256=%s\nSUPPORTED_FROM=2.36.2\nTARGET=2.36.3\nSCHEMA_CHANGE=NO\nOWNER_PRODUCTION_WRITE=NO\n' "$MANIFEST_SOURCE" "$REMOTE_MAIN" "$PRODUCT_SOURCE" "$RELEASE_ID" "$ASSET_BYTES" "$ASSET_SHA256" | tee "$EVID/verdict.txt"
      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2363-core-updates-candidate-${{ github.run_id }}
          path: ${{ env.EVID }}
          if-no-files-found: error
          retention-days: 90
