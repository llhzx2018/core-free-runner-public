name: P01 V2.47.241 Final Main Proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v247241-final-main.yml'
      - 'proof-triggers/p01-v247241-final-main.json'

permissions:
  contents: read

jobs:
  final-main:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout proof control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd unzip nodejs >/dev/null
          php -m | grep -Fx pdo_sqlite
          php -m | grep -Fx zip
          php -m | grep -Fx gd
          echo P01_V247241_FINAL_RUNTIME=PASS
      - name: Clone exact main and stable baseline
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" candidate
          git -C candidate fetch -q origin 49dd1e83b238c99c33d3b7145d0f5f9fc10e7d02
          git -C candidate checkout -q --detach 49dd1e83b238c99c33d3b7145d0f5f9fc10e7d02
          test "$(git -C candidate rev-parse HEAD)" = "49dd1e83b238c99c33d3b7145d0f5f9fc10e7d02"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.241"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "2.47.241"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" baseline
          git -C baseline fetch -q origin 0b6bd7212066abd5ae6938344e538f5dd977c0be
          git -C baseline checkout -q --detach 0b6bd7212066abd5ae6938344e538f5dd977c0be
          echo P01_V247241_FINAL_EXACT_MAIN=PASS
      - name: Syntax and canonical regression
        shell: bash
        run: |
          set -Eeuo pipefail
          files=(candidate/src/app/CourseLibraryPage.php candidate/src/app/CourseMarkdownRenderer.php candidate/src/app/CoursePackageStore.php candidate/src/app/DisasterRecovery.php candidate/src/course-package-upload.php candidate/src/course-package-file.php candidate/tests/unit/course_markdown_reader_contract.php candidate/tests/unit/course_package_security_contract.php candidate/tests/unit/course_personal_study_r1_contract.php candidate/tests/integration/resource_asset_disaster_recovery_contract.php)
          for file in "${files[@]}"; do php -l "$file"; done
          node --check candidate/src/assets/course-experience.js
          bash candidate/tests/canonical_release_regression.sh candidate baseline --require-zero-debt | tee /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/canonical.txt
          echo P01_V247241_FINAL_CANONICAL=PASS
      - name: Focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          php candidate/tests/unit/course_markdown_reader_contract.php
          php candidate/tests/unit/course_package_security_contract.php
          php candidate/tests/unit/course_personal_study_r1_contract.php
          php candidate/tests/integration/resource_asset_disaster_recovery_contract.php
          echo P01_V247241_FINAL_FOCUSED=PASS
      - name: No schema or release mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          changed="$(git -C candidate diff --name-only 0b6bd7212066abd5ae6938344e538f5dd977c0be..HEAD)"
          if printf '%s\n' "$changed" | grep -E '(^|/)(migrations?|schema)(/|\.|$)'; then exit 1; fi
          grep -F "private const ASSET_KIND = 'course_package';" candidate/src/app/CoursePackageStore.php
          echo P01_V247241_FINAL_NO_SCHEMA=PASS
          echo FORMAL_RELEASE_CALLED=NO
          echo DISTRIBUTION_WRITE=NO
          echo PRODUCTION_WRITE=NO
