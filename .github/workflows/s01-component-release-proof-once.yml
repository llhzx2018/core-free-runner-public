name: S01 component candidate source checks (temporary)
on:
  push:
    branches: [test/s01-directory-parity-release-20261114]
    paths: ['.github/workflows/s01-component-release-proof-once.yml']
permissions:
  contents: read
jobs:
  verify:
    name: Verify ${{ matrix.id }} candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: S01-C01
            repo: llhzx2018/vf-tools-theme
            head: d2ae0c24a6ab61b5d930f972da7349accc971707
            base: d171a51df27c10e185d9f390b9b8a0b1c150abca
          - id: S01-C02
            repo: llhzx2018/vf-tools-ops
            head: f89086c790d9556961c37fc9bc5888343b80632f
            base: fba40a1e9c73779015b907ab830ff571a76fee1e
    steps:
      - name: Checkout candidate in temporary worker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.head }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: private-product
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout governance in temporary worker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: private-governance
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run original source gates with private output suppressed
        shell: bash
        env:
          COMPONENT: ${{ matrix.id }}
          CANDIDATE: ${{ matrix.head }}
          BASE: ${{ matrix.base }}
        run: |
          set -Eeuo pipefail
          cd private-product
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE" ]]
          base="$(git merge-base "$BASE" HEAD)"
          govern="$GITHUB_WORKSPACE/private-governance"
          run_check() {
            local label="$1"
            shift
            if "$@" >"$RUNNER_TEMP/s01-gate.log" 2>&1; then
              echo "$COMPONENT $label PASS"
            else
              echo "::error::$COMPONENT $label FAIL. Output was kept inside the temporary runner."
              if [[ "$label" == architecture-delta ]]; then
                python3 -c 'import hashlib,re,sys; s=open(sys.argv[1],encoding="utf-8").read(); m=re.search(r"(?m)^PROJECT_ARCHITECTURE=BLOCKED:([A-Z_]+)(?::([^\r\n]+))?$",s); print("architecture-reason="+m[1]+(" path_sha256="+hashlib.sha256(m[2].encode()).hexdigest() if m[2] else "") if m else "architecture-reason=UNCLASSIFIED")' "$RUNNER_TEMP/s01-gate.log"
              fi
              check_failed=1
            fi
          }
          check_failed=0
          run_check architecture-fixtures python3 -B -m unittest discover -s .github/checks -p test_architecture_gate.py
          run_check governance-fixtures python3 -B -m unittest discover -s .github/checks -p test_gov_doc_ci.py
          run_check current-authority python3 -B .github/checks/check_gov_doc_ci.py --project-root . --gov-root "$govern" --project-id "$COMPONENT" --profile wordpress_static --workflow .github/workflows/s01-static-modernization-contract.yml --require-git
          run_check shared-architecture-fixtures python3 -B -m unittest discover -s "$govern/governance/agent" -p test_code_architecture_lint.py -q
          run_check architecture-delta python3 -B .github/checks/architecture_gate.py --manifest .github/checks/code_architecture.json --gov-root "$govern" --git-root . --base-sha "$base" --head-sha "$CANDIDATE"
          run_check static-source python3 -B scripts/check_s01_static_modernization.py --phase auto
          run_check static-denial-fixtures python3 -B -m unittest discover -s tests/unit -p test_s01_static_modernization.py
          if [ -f package.json ]; then
            run_check dependencies npm ci --no-audit --no-fund
            run_check typecheck npm run typecheck
            run_check build npm run build
          fi
          exit "$check_failed"
      - name: Clean temporary source and output
        if: always()
        shell: bash
        run: rm -rf -- "$GITHUB_WORKSPACE/private-product" "$GITHUB_WORKSPACE/private-governance" "$RUNNER_TEMP/s01-gate.log"
