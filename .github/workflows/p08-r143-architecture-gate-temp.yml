name: P08 R143 exact source architecture and negative fixtures (TEMP)
on:
  pull_request:
    paths: [.github/workflows/p08-r143-architecture-gate-temp.yml]
permissions:
  contents: read
jobs:
  architecture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Transient exact P08 #58 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 7452ccadb06aa0554487fe6c683f6ddfffff8519
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p08
          persist-credentials: false
          fetch-depth: 0
      - name: Transient exact GOV-DOC main rules and checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 5aeb01605290e2170c98efda79afffb1cff7a206
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: gov
          persist-credentials: false
          fetch-depth: 1
      - name: Check exact PR base head and existing architecture positive negative tests
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p08 rev-parse HEAD)" = "7452ccadb06aa0554487fe6c683f6ddfffff8519"
          test "$(git -C gov rev-parse HEAD)" = "5aeb01605290e2170c98efda79afffb1cff7a206"
          git -C p08 cat-file -e f342be52b786b0cfd222f3650818e650f61a010d^{commit}
          python3 -B p08/.github/checks/test_architecture_gate.py
          python3 -B p08/.github/checks/architecture_gate.py \
            --manifest p08/.github/checks/code_architecture.json \
            --gov-root "$GITHUB_WORKSPACE/gov" \
            --base-sha f342be52b786b0cfd222f3650818e650f61a010d \
            --head-sha 7452ccadb06aa0554487fe6c683f6ddfffff8519 \
            --git-root "$GITHUB_WORKSPACE/p08"
          echo P08_R143_EXACT_SOURCE_ARCHITECTURE_AND_NEGATIVE_FIXTURES=PASS
      - name: Purge transient private checkout
        if: always()
        shell: bash
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/p08" "$GITHUB_WORKSPACE/gov"
