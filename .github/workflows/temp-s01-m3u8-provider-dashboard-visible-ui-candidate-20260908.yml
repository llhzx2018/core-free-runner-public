name: temp-s01-m3u8-provider-dashboard-visible-ui-candidate-20260908
on:
  push:
    branches:
      - temp/s01-page-update-center-v4-20260907
    paths:
      - .github/workflows/temp-s01-m3u8-provider-dashboard-visible-ui-candidate-20260908.yml
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      REPO: llhzx2018/vf-tools-m3u8
      BRANCH: work/s01-m3u8-provider-dashboard-visible-ui-20260908
      BASE_SHA: f806ad64447cdd84c664dcfa19ad52ab4fd45e17
    steps:
      - name: Build exact visible dashboard candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'CANDIDATE_WRITE_ONLY=YES MAIN_WRITE_USED=NO RELEASE_WRITE_USED=NO DISTRIBUTION_WRITE_USED=NO PRODUCTION_WRITE_USED=NO MIGRATION_WRITE_USED=NO'
          rm -rf /tmp/m3u8-src
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/${REPO}.git" /tmp/m3u8-src
          git -C /tmp/m3u8-src checkout -q "$BRANCH"
          test "$(git -C /tmp/m3u8-src rev-parse HEAD)" = "$BASE_SHA"
          test "$(tr -d '\r\n' < /tmp/m3u8-src/VERSION)" = '1.25.29'
          cd /tmp/m3u8-src
          python3 - <<'PY'
          from pathlib import Path
          path=Path('src/admin/Controller/class-v6-provider-operations-controller.php')
          text=path.read_text()
          start=text.index('function vf_tools_m3u8_render_v6_provider_dashboard(): void {')
          end=text.index('\nfunction vf_tools_m3u8_render_v6_runtime(): void {', start)
          new=r'''function vf_tools_m3u8_render_v6_provider_dashboard(): void {
              vf_tools_m3u8_v6_render_contract_header('Provider 工作台','先看当前健康状态和下一步；技术 ID、hash 与逐项自检默认收起，需要时再展开。');
              if(!vf_tools_m3u8_v6_schema_ready()){vf_tools_m3u8_v6_render_schema_block();return;}

              $rev=vf_tools_m3u8_v6_revision_service();
              $fix=vf_tools_m3u8_v6_fixture_service();
              $rt=vf_tools_m3u8_v6_runtime_service()->current();
              $compat=vf_tools_m3u8_v6_compatibility_service()->recent('COMPATIBILITY',1);
              $perf=vf_tools_m3u8_v6_performance_service()->recent('PERFORMANCE',1);
              $diag=vf_tools_m3u8_v6_diagnostics_service()->recent('DIAGNOSTIC',1);
              $self=vf_tools_m3u8_provider_self_check();
              $prod=apply_filters('vf_tools_m3u8_provider_production_dependents',['known'=>false,'dependents'=>[]]);

              $capabilityCount=count($rev->listCapabilities());
              $pipelineCount=count($rev->listPipelines());
              $fixtureCount=count($fix->listFixtures());
              $selfStatus=strtoupper((string)($self['status']??'UNKNOWN'));
              $selfBad=str_contains($selfStatus,'FAIL')||str_contains($selfStatus,'BLOCK');
              $selfPass=!$selfBad&&str_contains($selfStatus,'PASS');
              $healthTone=$selfBad?'danger':($selfPass?'success':'warning');
              $healthLabel=$selfBad?'需要处理':($selfPass?'运行正常':'待确认');
              $passCount=(int)($self['pass_count']??0);
              $checkCount=(int)($self['check_count']??0);

              $nextPage='vf-tool-m3u8-compatibility';
              $nextLabel='查看兼容性验证';
              $nextTitle='Provider 状态稳定，继续核对最新兼容性证据';
              $nextDescription='优先保持 Runtime 与验证证据为最新；不会在这里修改 Page、SEO、Site 或 Release 数据。';
              if($selfBad){
                  $nextPage='vf-tool-m3u8-diagnostics-v6';
                  $nextLabel='打开诊断';
                  $nextTitle='Provider 自检存在需要处理的项目';
                  $nextDescription='先查看诊断证据，再决定是否需要调整 Provider-owned 配置；不会猜测为通过。';
              }elseif(!$rt){
                  $nextPage='vf-tool-m3u8-runtime-v6';
                  $nextLabel='配置 Runtime';
                  $nextTitle='先完成 Runtime 配置';
                  $nextDescription='当前没有可用的 SEALED Runtime；完成后再运行兼容性和性能验证。';
              }elseif(!$compat){
                  $nextPage='vf-tool-m3u8-compatibility';
                  $nextLabel='运行兼容性验证';
                  $nextTitle='补齐兼容性证据';
                  $nextDescription='Runtime 已就绪，但还没有兼容性结果；UNKNOWN 不会被当作 PASS。';
              }elseif(!$perf){
                  $nextPage='vf-tool-m3u8-performance';
                  $nextLabel='查看性能验证';
                  $nextTitle='补齐性能证据';
                  $nextDescription='兼容性已有记录，下一步确认浏览器侧性能证据。';
              }elseif(!$diag){
                  $nextPage='vf-tool-m3u8-diagnostics-v6';
                  $nextLabel='收集诊断证据';
                  $nextTitle='补齐诊断证据';
                  $nextDescription='关键运行链已经有证据，再补一份诊断记录便于后续定位变化。';
              }

              $evidenceRows=[
                  ['兼容性验证',$compat,'vf-tool-m3u8-compatibility','检查 Runtime、Fixture 与跨组件依赖上下文。'],
                  ['性能验证',$perf,'vf-tool-m3u8-performance','确认浏览器侧运行表现与性能证据。'],
                  ['诊断证据',$diag,'vf-tool-m3u8-diagnostics-v6','保留可解释、可追踪的 Provider 诊断记录。'],
              ];
              $evidenceCount=0;
              foreach($evidenceRows as $row){if(!empty($row[1])){$evidenceCount++;}}
              $prodKnown=!empty($prod['known']);
              $prodCount=count((array)($prod['dependents']??[]));

              echo '<div class="vf-m3u8-v6-dashboard">';
              echo '<section class="vf-m3u8-v6-dashboard__hero" aria-labelledby="vf-m3u8-provider-health-title">';
              echo '<div class="vf-m3u8-v6-dashboard__hero-copy"><span class="vf-m3u8-v6-eyebrow">VF Tools M3U8 · Provider</span><h2 id="vf-m3u8-provider-health-title">'.esc_html($healthLabel).'</h2><p>先处理真正影响 Provider 的状态；工程细节默认收起，不再让 hash、内部 ID 和检查表占据第一屏。</p><div class="vf-m3u8-v6-version">当前插件版本 <strong>'.esc_html(VF_TOOL_M3U8_VERSION).'</strong></div></div>';
              echo '<div class="vf-m3u8-v6-dashboard__hero-status vf-m3u8-v6-status--'.esc_attr($healthTone).'"><span>Provider 自检</span><strong>'.esc_html((string)$passCount).' / '.esc_html((string)$checkCount).'</strong><small>'.esc_html($selfStatus).'</small></div>';
              echo '</section>';

              echo '<section class="vf-m3u8-v6-next-step" aria-labelledby="vf-m3u8-next-step-title"><div><span class="vf-m3u8-v6-eyebrow">当前下一步</span><h3 id="vf-m3u8-next-step-title">'.esc_html($nextTitle).'</h3><p>'.esc_html($nextDescription).'</p></div><a class="button button-primary" href="'.esc_url(admin_url('admin.php?page='.$nextPage)).'">'.esc_html($nextLabel).'</a></section>';

              echo '<section class="vf-m3u8-v6-summary-grid" aria-label="Provider 关键状态">';
              echo '<article class="vf-m3u8-v6-summary-card"><span>Provider 健康</span><strong>'.esc_html($healthLabel).'</strong><small>'.esc_html((string)$passCount).' / '.esc_html((string)$checkCount).' 项自检通过</small></article>';
              echo '<article class="vf-m3u8-v6-summary-card"><span>当前 Runtime</span><strong>'.($rt?esc_html((string)$rt['bundle_key'].'@'.(string)$rt['version']):'未就绪').'</strong><small>'.($rt?'SEALED Runtime 已就绪':'需要先配置 Runtime').'</small></article>';
              echo '<article class="vf-m3u8-v6-summary-card"><span>能力覆盖</span><strong>'.esc_html((string)$capabilityCount).' 能力 · '.esc_html((string)$pipelineCount).' 流程</strong><small>'.esc_html((string)$fixtureCount).' 个 Fixtures 支撑验证</small></article>';
              echo '<article class="vf-m3u8-v6-summary-card"><span>运行验证</span><strong>'.esc_html((string)$evidenceCount).' / 3 已有证据</strong><small>兼容性、性能、诊断分别保留真实状态</small></article>';
              echo '</section>';

              echo '<section class="vf-m3u8-v6-evidence" aria-labelledby="vf-m3u8-evidence-title"><div class="vf-m3u8-v6-section-heading"><div><span class="vf-m3u8-v6-eyebrow">运行证据</span><h3 id="vf-m3u8-evidence-title">最近验证状态</h3></div><p>状态优先，技术 hash 放到高级详情。</p></div><div class="vf-m3u8-v6-evidence-list">';
              foreach($evidenceRows as [$label,$rows,$page,$description]){
                  $record=$rows[0]??null;
                  $state=$record?(string)($record['state']??'UNKNOWN'):'未运行';
                  $stateUpper=strtoupper($state);
                  $tone=(str_contains($stateUpper,'FAIL')||str_contains($stateUpper,'BLOCK'))?'danger':(str_contains($stateUpper,'PASS')?'success':'warning');
                  echo '<div class="vf-m3u8-v6-evidence-row"><div><strong>'.esc_html($label).'</strong><p>'.esc_html($description).'</p></div><span class="vf-m3u8-v6-status vf-m3u8-v6-status--'.esc_attr($tone).'">'.esc_html($state).'</span><a class="button" href="'.esc_url(admin_url('admin.php?page='.$page)).'">打开</a></div>';
              }
              echo '</div></section>';

              echo '<section class="vf-m3u8-v6-production-boundary '.($prodKnown?'is-known':'is-unknown').'" aria-labelledby="vf-m3u8-production-title"><div><span class="vf-m3u8-v6-eyebrow">Production dependents · 只读</span><h3 id="vf-m3u8-production-title">'.($prodKnown?esc_html((string)$prodCount.' 条已知依赖'):'UNKNOWN · 尚无依赖索引').'</h3><p>'.($prodKnown?'这里只展示依赖数量，不在 Provider 内编辑外部 Owner 数据。':'当前 Ops Consumer 尚未提供 Production dependency index；明确保持 UNKNOWN，不猜测为 PASS。').'</p></div></section>';

              echo '<details class="vf-m3u8-v6-technical-details"><summary>查看技术详情与逐项自检</summary><div class="vf-m3u8-v6-technical-details__body">';
              echo '<p>Plugin <code>'.esc_html(VF_TOOL_M3U8_VERSION).'</code> 与 sealed Provider corpus <code>'.esc_html((string)(vf_tools_m3u8_provider_manifest()['version']??'UNKNOWN')).'</code> 使用独立版本域。</p>';
              echo '<div class="vf-m3u8-v6-technical-table"><table class="widefat striped"><thead><tr><th>Check</th><th>状态</th><th>说明</th></tr></thead><tbody>';
              foreach((array)($self['checks']??[]) as $check){echo '<tr><td><code>'.esc_html((string)($check['id']??'')).'</code></td><td>'.vf_tools_m3u8_v6_status_pill((string)($check['status']??'FAIL')).'</td><td>'.esc_html((string)($check['message']??'')).'</td></tr>';}
              echo '</tbody></table></div>';
              echo '<div class="vf-m3u8-v6-technical-evidence"><h4>最新证据 hash</h4><ul>';
              foreach($evidenceRows as [$label,$rows]){$record=$rows[0]??null;echo '<li><strong>'.esc_html($label).'</strong> '.($record?'<code>'.esc_html((string)($record['evidence_hash']??'UNKNOWN')).'</code>':'未运行').'</li>';}
              echo '</ul></div>';
              if(function_exists('vf_tools_m3u8_v6_render_post_migration_readonly_verification')){echo '<div class="vf-m3u8-v6-migration-readonly"><h4>迁移只读核验</h4>';vf_tools_m3u8_v6_render_post_migration_readonly_verification();echo '</div>';}
              echo '</div></details>';
              echo '</div>';
          }'''
          path.write_text(text[:start]+new+text[end:])
          PY
          mkdir -p admin/ui-v4 tests
          cat > admin/ui-v4/phase4-component-workspace.css <<'CSS'
          .vf-m3u8-v6-dashboard{max-width:1180px;display:grid;gap:16px;margin:18px 0 28px}
          .vf-m3u8-v6-dashboard *{box-sizing:border-box}
          .vf-m3u8-v6-dashboard__hero,.vf-m3u8-v6-next-step,.vf-m3u8-v6-evidence,.vf-m3u8-v6-production-boundary,.vf-m3u8-v6-technical-details{background:#fff;border:1px solid #dcdcde;border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
          .vf-m3u8-v6-dashboard__hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(210px,260px);gap:24px;align-items:stretch;padding:24px}
          .vf-m3u8-v6-dashboard__hero-copy{align-self:center;max-width:720px}
          .vf-m3u8-v6-dashboard__hero h2{margin:5px 0 8px;font-size:28px;line-height:1.15;color:#1d2327}
          .vf-m3u8-v6-dashboard__hero p,.vf-m3u8-v6-next-step p,.vf-m3u8-v6-section-heading p,.vf-m3u8-v6-evidence-row p,.vf-m3u8-v6-production-boundary p{margin:0;color:#50575e;line-height:1.6}
          .vf-m3u8-v6-eyebrow{display:block;margin-bottom:5px;color:#646970;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
          .vf-m3u8-v6-version{margin-top:14px;color:#50575e;font-size:13px}
          .vf-m3u8-v6-dashboard__hero-status{display:flex;min-height:142px;flex-direction:column;justify-content:center;align-items:flex-start;padding:20px;border:1px solid #dcdcde;border-radius:12px;background:#f6f7f7}
          .vf-m3u8-v6-dashboard__hero-status span{color:#50575e;font-size:12px;font-weight:600}
          .vf-m3u8-v6-dashboard__hero-status strong{margin:6px 0;font-size:30px;line-height:1;color:#1d2327}
          .vf-m3u8-v6-dashboard__hero-status small{font-weight:700}
          .vf-m3u8-v6-status--success{border-color:#8fbca4;background:#f0f6f2;color:#176b3a}
          .vf-m3u8-v6-status--warning{border-color:#dba617;background:#fff8e5;color:#6e4f00}
          .vf-m3u8-v6-status--danger{border-color:#d9877f;background:#fff4f3;color:#9f1c13}
          .vf-m3u8-v6-next-step{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;padding:20px 22px;border-left:4px solid #2271b1}
          .vf-m3u8-v6-next-step h3,.vf-m3u8-v6-section-heading h3,.vf-m3u8-v6-production-boundary h3{margin:2px 0 6px;font-size:18px;line-height:1.3;color:#1d2327}
          .vf-m3u8-v6-next-step .button-primary{min-width:138px;text-align:center}
          .vf-m3u8-v6-summary-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
          .vf-m3u8-v6-summary-card{min-width:0;padding:18px;background:#fff;border:1px solid #dcdcde;border-radius:12px}
          .vf-m3u8-v6-summary-card>span{display:block;color:#646970;font-size:12px;font-weight:600}
          .vf-m3u8-v6-summary-card>strong{display:block;margin:8px 0 6px;color:#1d2327;font-size:17px;line-height:1.35;overflow-wrap:anywhere}
          .vf-m3u8-v6-summary-card>small{display:block;color:#646970;line-height:1.5}
          .vf-m3u8-v6-evidence{padding:20px 22px}
          .vf-m3u8-v6-section-heading{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:14px}
          .vf-m3u8-v6-section-heading>p{max-width:320px;text-align:right;font-size:12px}
          .vf-m3u8-v6-evidence-list{display:grid;border-top:1px solid #e2e4e7}
          .vf-m3u8-v6-evidence-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(100px,auto) auto;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid #e2e4e7}
          .vf-m3u8-v6-evidence-row:last-child{border-bottom:0}
          .vf-m3u8-v6-evidence-row strong{display:block;margin-bottom:3px;color:#1d2327}
          .vf-m3u8-v6-evidence-row p{font-size:12px}
          .vf-m3u8-v6-status{display:inline-flex;justify-content:center;align-items:center;min-width:88px;padding:4px 9px;border:1px solid #dcdcde;border-radius:999px;font-size:12px;font-weight:700;text-align:center}
          .vf-m3u8-v6-production-boundary{padding:18px 22px}
          .vf-m3u8-v6-production-boundary.is-unknown{border-left:4px solid #dba617}
          .vf-m3u8-v6-production-boundary.is-known{border-left:4px solid #8fbca4}
          .vf-m3u8-v6-technical-details{overflow:hidden}
          .vf-m3u8-v6-technical-details>summary{cursor:pointer;padding:16px 20px;color:#2c3338;font-weight:600}
          .vf-m3u8-v6-technical-details>summary:hover{background:#f6f7f7}
          .vf-m3u8-v6-technical-details>summary:focus-visible,.vf-m3u8-v6-dashboard .button:focus-visible{outline:2px solid #2271b1;outline-offset:2px}
          .vf-m3u8-v6-technical-details__body{padding:0 20px 20px;border-top:1px solid #e2e4e7}
          .vf-m3u8-v6-technical-details__body>p{margin:16px 0;color:#50575e}
          .vf-m3u8-v6-technical-table{max-width:100%;overflow-x:auto}
          .vf-m3u8-v6-technical-table code,.vf-m3u8-v6-technical-evidence code{overflow-wrap:anywhere;word-break:break-word}
          .vf-m3u8-v6-technical-evidence{margin-top:18px;padding-top:2px}
          .vf-m3u8-v6-technical-evidence h4,.vf-m3u8-v6-migration-readonly h4{margin:12px 0 8px}
          .vf-m3u8-v6-technical-evidence ul{margin:0 0 0 18px}
          .vf-m3u8-v6-technical-evidence li{margin:6px 0;line-height:1.5}
          .vf-m3u8-v6-migration-readonly{margin-top:18px;padding-top:14px;border-top:1px solid #e2e4e7}
          @media (max-width:960px){.vf-m3u8-v6-summary-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.vf-m3u8-v6-dashboard__hero{grid-template-columns:minmax(0,1fr) minmax(180px,220px)}}
          @media (max-width:782px){.vf-m3u8-v6-dashboard{gap:12px;margin-top:14px}.vf-m3u8-v6-dashboard__hero,.vf-m3u8-v6-next-step{grid-template-columns:minmax(0,1fr)}.vf-m3u8-v6-dashboard__hero{padding:20px}.vf-m3u8-v6-dashboard__hero-status{min-height:auto}.vf-m3u8-v6-next-step .button-primary{width:100%}.vf-m3u8-v6-section-heading{display:block}.vf-m3u8-v6-section-heading>p{max-width:none;margin-top:6px;text-align:left}.vf-m3u8-v6-evidence-row{grid-template-columns:minmax(0,1fr) auto}.vf-m3u8-v6-evidence-row .button{grid-column:1/-1;width:100%;text-align:center}}
          @media (max-width:520px){.vf-m3u8-v6-summary-grid{grid-template-columns:minmax(0,1fr)}.vf-m3u8-v6-dashboard__hero h2{font-size:24px}.vf-m3u8-v6-evidence,.vf-m3u8-v6-production-boundary{padding:17px}.vf-m3u8-v6-evidence-row{grid-template-columns:minmax(0,1fr)}.vf-m3u8-v6-status{justify-self:start}.vf-m3u8-v6-evidence-row .button{grid-column:auto}}
          @media (prefers-reduced-motion:reduce){.vf-m3u8-v6-dashboard *{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}
          CSS
          cat > tests/provider-dashboard-visible-ui-contract.php <<'PHP'
          <?php
          declare(strict_types=1);
          $repo=dirname(__DIR__);
          $failures=[];
          $expect=static function(bool $condition,string $message)use(&$failures):void{if(!$condition){$failures[]=$message;}};
          $controller=(string)@file_get_contents($repo.'/src/admin/Controller/class-v6-provider-operations-controller.php');
          $loader=(string)@file_get_contents($repo.'/src/admin/ui-v4/admin-ui-assets.php');
          $css=(string)@file_get_contents($repo.'/admin/ui-v4/phase4-component-workspace.css');
          $version=trim((string)@file_get_contents($repo.'/VERSION'));
          $start=strpos($controller,'function vf_tools_m3u8_render_v6_provider_dashboard(): void {');
          $end=$start===false?false:strpos($controller,"\nfunction vf_tools_m3u8_render_v6_runtime(): void {",$start);
          $dashboard=($start!==false&&$end!==false)?substr($controller,$start,$end-$start):'';
          $expect($version==='1.25.29','visible UI candidate must not bump VERSION');
          $expect($dashboard!=='','provider dashboard function must be isolated');
          $expect(strpos($dashboard,'vf-m3u8-v6-dashboard')!==false,'dashboard must own a scoped visible UI shell');
          $expect(strpos($dashboard,'Provider 工作台')!==false,'dashboard must use a human-first title');
          $expect(strpos($dashboard,'当前下一步')!==false,'dashboard must expose one next-step surface');
          $expect(substr_count($dashboard,'button button-primary')===1,'dashboard must expose exactly one dominant primary action');
          $expect(strpos($dashboard,'Provider 健康')!==false&&strpos($dashboard,'当前 Runtime')!==false&&strpos($dashboard,'能力覆盖')!==false&&strpos($dashboard,'运行验证')!==false,'dashboard must expose four key human status cards');
          $expect(strpos($dashboard,'S01-C03')===false,'internal component id must not be default-visible in dashboard');
          $expect(strpos($dashboard,'<details class="vf-m3u8-v6-technical-details">')!==false,'technical details must be collapsible');
          $expect(strpos($dashboard,'<details class="vf-m3u8-v6-technical-details" open')===false,'technical details must be collapsed by default');
          $detailsPos=strpos($dashboard,'vf-m3u8-v6-technical-details');
          $checkPos=strpos($dashboard,"$check['id']");
          $hashPos=strpos($dashboard,"evidence_hash");
          $expect($detailsPos!==false&&$checkPos!==false&&$checkPos>$detailsPos,'raw self-check ids must live behind technical details');
          $expect($detailsPos!==false&&$hashPos!==false&&$hashPos>$detailsPos,'raw evidence hashes must live behind technical details');
