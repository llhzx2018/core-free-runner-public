name: temp-s01-m3u8-provider-dashboard-visible-ui-candidate-20260908
on:
  push:
    branches:
      - temp/s01-page-update-center-v4-20260907
    paths:
      - .github/workflows/temp-s01-m3u8-provider-dashboard-visible-ui-candidate-20260908.yml
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      REPO: llhzx2018/vf-tools-m3u8
      BRANCH: work/s01-m3u8-provider-dashboard-visible-ui-20260908
      BASE_SHA: f806ad64447cdd84c664dcfa19ad52ab4fd45e17
      GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Build exact visible dashboard candidate with corrected contract
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api 'repos/llhzx2018/core-free-runner-public/contents/.github/workflows/temp-s01-m3u8-provider-dashboard-visible-ui-candidate-20260908.yml?ref=e6182d3b43cecb24a5a8bd1d06eac7468e47b41d' --jq .content | base64 -d > /tmp/original.yml
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/original.yml').read_text().splitlines()
          marker='        run: |'
          i=lines.index(marker)+1
          block=[]
          for line in lines[i:]:
              if line and not line.startswith('          '):
                  break
              block.append(line[10:] if line.startswith('          ') else '')
          script='\n'.join(block)+'\n'
          old="git diff --name-only | sort > /tmp/actual-files"
          new="{ git diff --name-only; git ls-files --others --exclude-standard; } | sort > /tmp/actual-files"
          old_check="$checkPos=strpos($dashboard,\"$check['id']\");"
          new_check="$checkPos=strpos($dashboard,\"\\$check['id']\");"
          if old not in script:
              raise SystemExit('expected accounting line not found')
          if old_check not in script:
              raise SystemExit('expected check-id contract line not found')
          script=script.replace(old,new,1).replace(old_check,new_check,1)
          Path('/tmp/candidate-fixed.sh').write_text(script)
          PY
          bash /tmp/candidate-fixed.sh
