name: P01 Authority Sync Mobile Admin Actions
on:
  push:
    branches: [temp/p01-authority-sync-mobile-admin-actions-20260831]
    paths:
      - .github/workflows/p01-authority-sync-mobile-admin-actions-20260831.yml
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE: 7a9e9fd3e2505e85d7aa5781da8b23db7d961a9f
      TARGET_BRANCH: authority/p01-l2-mobile-admin-actions-20260831
    steps:
      - name: Checkout runner script
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: runner
      - name: Checkout authority branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Assert exact authority base
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$BASE"
          test -z "$(git -C product status --porcelain)"
      - name: Sync four authority files
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          python3 ../runner/scripts/p01_authority_sync_mobile_admin_actions_20260831.py
          python3 -m json.tool VF_PROJECT.json >/dev/null
      - name: Authority changed-file fence
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          git diff --check
          git diff --name-only | sort | tee /tmp/changed.txt
          cat >/tmp/expected.txt <<'EOF'
          VF_PROJECT.json
          docs/authority/CURRENT.md
          docs/evidence/P01_L2_PRODUCT_WAVE_DEVELOP_MERGE_20260831.md
          docs/handoff/CURRENT_STATE.md
          EOF
          diff -u /tmp/expected.txt /tmp/changed.txt
          test -z "$(git diff --name-only | grep '^src/' || true)"
      - name: Commit authority branch only
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VF_PROJECT.json docs/authority/CURRENT.md docs/handoff/CURRENT_STATE.md docs/evidence/P01_L2_PRODUCT_WAVE_DEVELOP_MERGE_20260831.md
          git commit -m 'docs(P01): record shared mobile admin action closure'
          git push origin HEAD:${TARGET_BRANCH}
