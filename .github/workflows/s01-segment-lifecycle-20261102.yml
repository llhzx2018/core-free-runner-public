name: S01 segment exact package lifecycle
on:
  push:
    branches: [task/s01-segment-current-proof-20261031]
    paths: ['.github/workflows/s01-segment-lifecycle-20261102.yml']
permissions:
  contents: read
  actions: read
jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 02d4591eed025a3d3a67bc0a150b3ddc448c2ab8
          persist-credentials: false
          path: established
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7a0fe3c12137bdeab82ddcd79d2deffed96c35dd
          persist-credentials: false
          path: prior
      - uses: actions/download-artifact@v4
        with:
          name: s01-segment-41369067984
          path: provider
          run-id: 41369067984
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run isolated install, upgrade, rollback and repeat
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof
          gh release download v1.35.222 --repo llhzx2018/vf-tools-theme --pattern vf-tools-theme_V1.35.222.zip --dir provider
          echo '51c547d67a37e376b9eaf01b1d6e65cefb6c607a9541a66d1a2736b8d849d154  provider/vf-tools-theme_V1.35.222.zip' | sha256sum -c
          gh release download v1.25.97 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.97.zip --dir provider
          echo 'd84279b9527f5da7ae43f05759dfb8288f5a07e63e481c84253e507458ad485f  provider/vf-tools-m3u8_V1.25.97.zip' | sha256sum -c
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          cp -a established/lanes/s01-frontend-design-20261017 lane
          bash control/lanes/s01-segment-browser/lifecycle.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: segment-lifecycle-${{ github.run_id }}
          path: proof/
          retention-days: 7

# Verify the expected version option transition independently.
