name: S01-C02 1.21.994 Keyword Map Geometry Diagnostic
on:
  push:
    branches:
      - diag/s01-c02-121994-keyword-map
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: cffc57dc4dd63b78517b8890abe2e43d71e2c784
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: target
          persist-credentials: false
      - name: Geometry
        shell: bash
        run: |
          set -Eeuo pipefail
          cd target
          mkdir -p /tmp/km-diag
          cd /tmp/km-diag
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.58.2 >/dev/null
          npx playwright install chromium >/dev/null
          cat > diag.js <<'JS'
          const fs=require('fs'), path=require('path'), {execFileSync}=require('child_process'), {chromium}=require('playwright');
          const root=process.env.ROOT;
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext();
            await ctx.route('https://fixture.invalid/**',async route=>{
              const p=new URL(route.request().url()).pathname;
              const file=path.join(root,p);
              if(fs.existsSync(file)){await route.fulfill({body:fs.readFileSync(file),contentType:file.endsWith('.css')?'text/css':'text/javascript'});return;}
              await route.fulfill({status:404,body:'missing'});
            });
            for(const width of [768,390]){
              const page=await ctx.newPage(); await page.setViewportSize({width,height:1000});
              const html=execFileSync('php',['-n',path.join(root,'tests/s01-c02-v8-render-fixture.php'),'map'],{encoding:'utf8'});
              await page.setContent(html,{waitUntil:'load'});
              const data=await page.evaluate(()=>{
                const root=document.querySelector('[data-vf-native-body-v8]');
                const pick=n=>{const r=n.getBoundingClientRect(),s=getComputedStyle(n);return {tag:n.tagName,cls:n.className,id:n.id,top:Math.round(r.top),bottom:Math.round(r.bottom),height:Math.round(r.height),display:s.display,mt:s.marginTop,mb:s.marginBottom,pt:s.paddingTop,pb:s.paddingBottom,overflowX:s.overflowX};};
                return {
                  bodyClass:document.body.className,
                  canvas:document.querySelector('.vf-page-canvas')?.getAttribute('data-vf-v13-route'),
                  sheets:[...document.styleSheets].map(s=>s.href||'inline').filter(Boolean),
                  children:[...root.children].map(pick),
                  pagebar:pick(root.querySelector('.vf-v8-keyword-pagebar')),
                  viewbar:pick(root.querySelector('.vf-v8-keyword-viewbar')),
                  tabs:pick(root.querySelector('.vf-v8-keyword-tabs')),
                  secondary:pick(root.querySelector('.vf-v8-keyword-secondary')),
                  feedback:pick(root.querySelector('.vf-v8-keyword-feedback')),
                  console:pick(root.querySelector('.vf-keyword-map-console')),
                };
              });
              console.log('WIDTH='+width+' '+JSON.stringify(data));
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          ROOT="$PWD/../.." node diag.js
