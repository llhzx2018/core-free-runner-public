name: S01 Ops system scan progress exact-source gate
on:
  push:
    branches: [task/s01-c02-progress-truth-20261013]
    paths: [.github/workflows/s01-c02-progress-truth-exact-20261013.yml]
permissions:
  contents: read
jobs:
  progress-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Exact transient private Ops checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 73e7758e358431fb96ca9c5cbef3a5e69777cadc
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - name: PHP lint and exact 10050-file source scan regression
        run: |
          set -Eeuo pipefail
          test "$(git -C private-source rev-parse HEAD)" = 73e7758e358431fb96ca9c5cbef3a5e69777cadc
          php -v | head -n 1
          php -l private-source/includes/plugins-governance/dependency-scan-batches-v1211086.php
          php -l private-source/tests/s01-c02-1211086-dependency-scan-batches.php
          php private-source/tests/s01-c02-1211086-dependency-scan-batches.php
          echo S01_OPS_SCAN_PROGRESS_EXACT_UNIT_PASS
      - name: Cleanup transient private source
        if: always()
        run: rm -rf private-source
