name: S01-C02 V1.21.1007 Footer Axis Candidate

on:
  push:
    branches:
      - release/s01-c02-1211007-global-footer-axis
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_REPO: llhzx2018/vf-tools-ops
      TARGET_SHA: 2dad7ef9503e9b9825ffa0acca59c4257d242f9d
      BASE_SHA: eb52a9bc6bca33040da33eb41311a9cd4e249909
      TARGET_VERSION: 1.21.1007
      BASE_VERSION: 1.21.1006
      ARTIFACT_NAME: vf-tools-ops_V1.21.1007.zip
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}

    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ env.READ_TOKEN }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.BASE_SHA }}
          token: ${{ env.READ_TOKEN }}
          path: baseline
          fetch-depth: 0
          persist-credentials: false

      - name: Source contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n' < target/VERSION)" = "$TARGET_VERSION"
          grep -F "Version: $TARGET_VERSION" target/vf-ops.php >/dev/null
          grep -F "define('VF_OPS_VERSION', '$TARGET_VERSION')" target/vf-ops.php >/dev/null
          grep -F "S01-V9-GLOBAL-FOOTER-AXIS" target/vf-ops.php >/dev/null
          php -l target/vf-ops.php >/dev/null
          git -C target diff --name-only "$BASE_SHA..$TARGET_SHA" | tee /tmp/diff.txt
          grep -Fx 'assets/css/current/admin-s01-page-frame-r18.css' /tmp/diff.txt >/dev/null
          grep -Fx 'tests/s01-c02-1211007-global-footer-axis-browser-proof.js' /tmp/diff.txt >/dev/null
          ! grep -E '^assets/css/current/admin-s01-v6-shell-r1.css$' /tmp/diff.txt
          echo SOURCE_CONTRACT=PASS

      - name: Browser dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/vf-node && cd /tmp/vf-node
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.58.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Footer and full-axis browser proof
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/target"
          export NODE_PATH=/tmp/vf-node/node_modules
          mkdir -p "$GITHUB_WORKSPACE/evidence"
          node tests/s01-c02-1211007-global-footer-axis-browser-proof.js | tee "$GITHUB_WORKSPACE/evidence/footer-axis.json"
          jq -e '.pass==true and (.checks|length)==63 and ([.checks[].failures[]]|length)==0 and .owner_product_pass==false' "$GITHUB_WORKSPACE/evidence/footer-axis.json" >/dev/null
          node tests/s01-c02-1211006-wide-screen-axis-browser-proof.js | tee "$GITHUB_WORKSPACE/evidence/wide-axis-regression.json"
          jq -e '.pass==true and (.checks|length)==21 and ([.checks[].failures[]]|length)==0' "$GITHUB_WORKSPACE/evidence/wide-axis-regression.json" >/dev/null
          echo GLOBAL_FOOTER_AXIS_63=PASS
          echo WIDE_AXIS_REGRESSION=PASS

      - name: Build deterministic packages
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib,re,zipfile,json
          from pathlib import Path
          def keep(rel):
              p=rel.as_posix(); parts=p.split('/')
              if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in parts): return False
              if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',p,re.I): return False
              if '/' not in p: return p in {'vf-ops.php','uninstall.php'}
              return parts[0] in {'includes','assets','languages','config'}
          def build(root,label,ver):
              root=Path(root); out=Path(f'/tmp/vf-tools-ops_V{ver}.zip')
              fs={}
              for p in root.rglob('*'):
                  if p.is_file() and not p.is_symlink():
                      rel=p.relative_to(root)
                      if keep(rel): fs[rel.as_posix()]=p.read_bytes()
              fs=dict(sorted(fs.items()))
              with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
                  for rel,data in fs.items():
                      info=zipfile.ZipInfo('vf-ops/'+rel,(2026,10,2,0,0,0)); info.compress_type=zipfile.ZIP_DEFLATED; info.external_attr=0o100644<<16; z.writestr(info,data)
              h=hashlib.sha256()
              for rel,data in fs.items():
                  h.update(rel.encode());h.update(b'\0');h.update(hashlib.sha256(data).hexdigest().encode());h.update(b'\n')
              return {'version':ver,'files':len(fs),'bytes':out.stat().st_size,'sha256':hashlib.sha256(out.read_bytes()).hexdigest(),'runtime_fingerprint':h.hexdigest()}
          rows={'baseline':build('baseline','baseline','1.21.1006'),'candidate':build('target','candidate','1.21.1007')}
          Path('evidence/package.json').write_text(json.dumps(rows,indent=2))
          print(json.dumps(rows,indent=2))
          PY
          unzip -tq "/tmp/$ARTIFACT_NAME" >/dev/null
          test "$(jq -r '.candidate.files' evidence/package.json)" = "$(jq -r '.baseline.files' evidence/package.json)"
          echo PACKAGE_BUILD=PASS

      - name: Upgrade preservation
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/basepkg /tmp/candpkg
          mkdir -p /tmp/basepkg /tmp/candpkg
          unzip -q "/tmp/vf-tools-ops_V1.21.1006.zip" -d /tmp/basepkg
          unzip -q "/tmp/vf-tools-ops_V1.21.1007.zip" -d /tmp/candpkg
          test -f /tmp/basepkg/vf-ops/vf-ops.php
          test -f /tmp/candpkg/vf-ops/vf-ops.php
          grep -F "Version: 1.21.1007" /tmp/candpkg/vf-ops/vf-ops.php >/dev/null
          test -f /tmp/candpkg/vf-ops/assets/css/current/admin-s01-page-frame-r18.css
          echo UPGRADE_PRESERVATION=PASS

      - name: Final evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE"
          jq -n --arg sha "$TARGET_SHA" --arg ver "$TARGET_VERSION" --argjson footer "$(cat evidence/footer-axis.json)" --argjson wide "$(cat evidence/wide-axis-regression.json)" --argjson package "$(cat evidence/package.json)" '{
            status:"PASS",candidate_sha:$sha,candidate_version:$ver,
            footer_axis:{result:($footer.pass|if . then "PASS" else "FAIL" end),checks:($footer.checks|length),owner_product_pass:false},
            wide_axis_regression:{result:($wide.pass|if . then "PASS" else "FAIL" end),checks:($wide.checks|length)},
            upgrade:"PASS",package:$package,frozen_shell_header_menu:"PASS",production:"NOT_EXECUTED"
          }' | tee evidence/FINAL_EVIDENCE.json
          echo S01_C02_V1211007_MACHINE_PASS

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s01-c02-v1.21.1007-global-footer-axis
          path: evidence/
          retention-days: 30
