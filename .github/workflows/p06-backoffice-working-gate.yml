name: P06 Backoffice Exact Working Source Gate

on:
  push:
    branches:
      - run/p06-backoffice-156019d
    paths:
      - .github/workflows/p06-backoffice-working-gate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p06-backoffice-156019d
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_REPO: llhzx2018/vf-press
      SOURCE_SHA: 156019d06e524e6c6a06107db7c5c4662884806c
      SOURCE_BRANCH: runtime/p06-ops-console
      EXPECTED_VERSION: 0.1.6
      EXPECTED_SCHEMA: '2'
    steps:
      - name: Checkout runner control
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          path: runner-control

      - name: Require registered private read capability
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo PRIVATE_READ_CAPABILITY=PASS

      - name: Checkout exact private working source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Prepare PHP SQLite runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 php-mbstring php-zip php-curl sqlite3 composer >/dev/null
          php -v
          composer --version
          echo MACHINE_RUNTIME=PASS

      - name: Exact source and backoffice authority preflight
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "$EXPECTED_VERSION"
          test "$(jq -r .version VF_PROJECT.json)" = "$EXPECTED_VERSION"
          test "$(jq -r .schema VF_PROJECT.json)" = "$EXPECTED_SCHEMA"
          grep -Fq '/studio/operations' docs/authority/SSOT.md
          grep -Fq '/studio/jobs' docs/authority/SSOT.md
          grep -Fq '/studio/recovery' docs/authority/SSOT.md
          grep -Fq '/studio/updates' docs/authority/SSOT.md
          grep -Fq '/studio/settings' docs/authority/SSOT.md
          grep -Fq 'Catalog First' docs/authority/SSOT.md
          grep -Fq 'BackofficeCatalogController' docs/authority/SSOT.md
          grep -Fq 'Machine PASS:                 NOT CLAIMED' docs/authority/ACCEPTANCE_MATRIX.md
          echo SOURCE_IDENTITY=PASS
          echo BACKOFFICE_AUTHORITY_PREFLIGHT=PASS

      - name: Composer and PHP syntax gate
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          composer validate --strict
          composer dump-autoload --no-dev --optimize --no-interaction
          find src bin public -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          echo COMPOSER_VALIDATE=PASS
          echo PHP_SYNTAX=PASS

      - name: Fresh migration and full regression
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf storage storage-restore-*
          php bin/migrate.php | grep -Fq MIGRATION_PASS
          php bin/self-test.php | grep -Fq FOUNDATION_SELF_TEST_PASS
          php bin/security-self-test.php | grep -Fq SECURITY_SELF_TEST_PASS
          php bin/research-self-test.php | grep -Fq RESEARCH_SELF_TEST_PASS
          php bin/publication-self-test.php | grep -Fq PUBLICATION_MANUSCRIPT_SELF_TEST=PASS
          php bin/reader-self-test.php | grep -Fq PUBLISHER_READER_SELF_TEST=PASS
          php bin/edition-self-test.php | grep -Fq EDITION_SELF_TEST=PASS
          php bin/living-publishing-self-test.php | grep -Fq LIVING_PUBLISHING_SELF_TEST=PASS
          php bin/operations-self-test.php | grep -Fq OPERATIONS_SELF_TEST=PASS
          php bin/operations-ui-self-test.php | grep -Fq OPERATIONS_UI_SELF_TEST=PASS
          php bin/backoffice-self-test.php | grep -Fq 'Backoffice self-test PASS'
          php bin/backoffice-catalog-self-test.php | grep -Fq BACKOFFICE_CATALOG_SELF_TEST=PASS
          php bin/public-asset-self-test.php | tee /tmp/p06-backoffice-public-assets
          grep -Fq PUBLIC_ASSET_HTTP_SELF_TEST=PASS /tmp/p06-backoffice-public-assets
          grep -Fq MAINTENANCE_CSS_HTTP_200=PASS /tmp/p06-backoffice-public-assets
          php bin/job-self-test.php | grep -Fq JOB_QUEUE_SELF_TEST=PASS
          php bin/update-self-test.php | grep -Fq UPDATE_SELF_TEST=PASS
          php bin/migrate.php | grep -Fq MIGRATION_PASS
          php -r '$pdo=new PDO("sqlite:storage/app.db"); if($pdo->query("PRAGMA integrity_check")->fetchColumn()!=="ok") exit(1); if((int)$pdo->query("SELECT MAX(version) FROM schema_migrations")->fetchColumn()!==2) exit(2); echo "SQLITE_INTEGRITY=PASS\nSCHEMA=2 PASS\n";'
          echo FULL_REGRESSION=PASS

      - name: Backoffice source contract
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq "href=\"/studio/jobs\"" src/Http/Studio/BackofficeShell.php
          grep -Fq "href=\"/studio/recovery\"" src/Http/Studio/BackofficeShell.php
          grep -Fq "href=\"/studio/updates\"" src/Http/Studio/BackofficeShell.php
          grep -Fq "href=\"/studio/settings\"" src/Http/Studio/BackofficeShell.php
          ! grep -Fq '/studio/operations#jobs' src/Http/Studio/BackofficeShell.php
          ! grep -Fq '/studio/operations#backup' src/Http/Studio/BackofficeShell.php
          ! grep -Fq '/studio/operations#update' src/Http/Studio/BackofficeShell.php
          grep -Fq 'BackofficeCatalogController' public/index.php
          grep -Fq "'/studio/research','/studio/publications','/studio/publishing'" public/index.php
          grep -Fq 'class="maintenance-table-wrap"' src/Http/Studio/BackofficeCatalogController.php
          grep -Fq '/runtime-asset/maintenance' public/index.php
          echo BACKOFFICE_ROUTE_CONTRACT=PASS
          echo CATALOG_FIRST_CONTRACT=PASS
          echo MAINTENANCE_ROUTE_CONTRACT=PASS

      - name: Product repository cleanliness
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf storage storage-restore-*
          STATUS="$(git status --short --untracked-files=all)"
          printf '%s\n' "$STATUS"
          test -z "$STATUS"
          echo PRODUCT_REPOSITORY_CLEAN=PASS
          echo PRIVATE_SOURCE_PERSISTED=NO

      - name: Persist public-safe exact evidence on temporary runner branch
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -Eeuo pipefail
          [ "$JOB_STATUS" = success ] && RESULT=PASS || RESULT=FAIL
          cd runner-control
          git pull --rebase origin run/p06-backoffice-156019d
          mkdir -p evidence/p06
          cat > evidence/p06/P06_BACKOFFICE_156019D_LATEST.txt <<EOF
          P06_BACKOFFICE_WORKING_GATE=$RESULT
          SOURCE_REPOSITORY=$SOURCE_REPO
          SOURCE_BRANCH=$SOURCE_BRANCH
          SOURCE_SHA=$SOURCE_SHA
          VERSION=$EXPECTED_VERSION
          SCHEMA=$EXPECTED_SCHEMA
          RUN_ID=$GITHUB_RUN_ID
          CHECKS=PRIVATE_READ,SOURCE_IDENTITY,BACKOFFICE_AUTHORITY,COMPOSER,PHP_SYNTAX,FRESH_MIGRATION,FULL_REGRESSION,BACKOFFICE_SHELL,BACKOFFICE_CATALOG,PUBLIC_ASSET_HTTP,MAINTENANCE_CSS,JOB_QUEUE,UPDATE,SQLITE_INTEGRITY,ROUTE_CONTRACT,CLEANLINESS
          FORMAL_RELEASE=NO
          PRODUCTION_WRITE=NO
          PRIVATE_SOURCE_PERSISTED=NO
          EOF
          git config user.name 'VF Public Runner'
          git config user.email 'vf-public-runner@users.noreply.github.com'
          git add evidence/p06/P06_BACKOFFICE_156019D_LATEST.txt
          git commit -m "evidence(P06): backoffice exact working gate $RESULT run $GITHUB_RUN_ID" || true
          git pull --rebase origin run/p06-backoffice-156019d
          git push origin HEAD:run/p06-backoffice-156019d
          test "$RESULT" = PASS
