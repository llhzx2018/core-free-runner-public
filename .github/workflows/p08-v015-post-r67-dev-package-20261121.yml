name: P08 v015 repaired main development-only 13 domain + genuine ZIP preflight
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p08-v015-post-r67-dev-package-20261121.yml
      - lanes/p08-v015-main-post-r67-13domain-dev-20261121.json
permissions:
  contents: read
jobs:
  p08-v015-dev-readiness:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-v015-main-post-r67-13domain-dev-20261121' && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TARGET_REPO: llhzx2018/vf-adops
      TARGET_VERSION: '0.1.15'
      TARGET_SHA: 369fcb0aa8fef71b0a2b79c2b7a6c473d2527c3e
      P08_OLD_SOURCE_SHA: 6fae792864a594465e4b3224bd6d73abde976f12
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout ephemeral public-safe lane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Audit target identity before private checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B runner/scripts/ephemeral_lane_spec.py validate --spec runner/lanes/p08-v015-main-post-r67-13domain-dev-20261121.json
          python3 -B runner/scripts/ephemeral_lane_spec.py audit-rendered --spec runner/lanes/p08-v015-main-post-r67-13domain-dev-20261121.json --input runner/.github/workflows/p08-v015-post-r67-dev-package-20261121.yml
      - name: Checkout exact already merged private P08 source, no persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 369fcb0aa8fef71b0a2b79c2b7a6c473d2527c3e
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
      - name: Checkout effective 13-domain GOV authorities
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 3c25384caeed4d14b09637321dbc3379008d92ce
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov
      - name: PHP 8.4 and locked Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: zip,curl,mbstring,pdo_mysql,pdo_sqlite,sqlite3,openssl,posix,dom,intl,fileinfo
          coverage: none
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lock verified exact main, R67 negative guard, compile package bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(id -u)" -ne 0
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C gov rev-parse HEAD)" = 3c25384caeed4d14b09637321dbc3379008d92ce
          test "$(cat target/VERSION)" = "$TARGET_VERSION"
          grep -Fq '| skill-release | V3.22 |' gov/CURRENT.md
          grep -Fq '## RP-07W' target/docs/authority/ACCEPTANCE_MATRIX.md
          python3 -B target/tests/test_r67_v015_fail_closed_version_gate.py
          npm ci --prefix target --ignore-scripts --no-audit --no-fund > "$RUNNER_TEMP/p08-v015-npm-private.log" 2>&1
          npm run build --prefix target >> "$RUNNER_TEMP/p08-v015-npm-private.log" 2>&1
          composer --working-dir=target install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress --optimize-autoloader > "$RUNNER_TEMP/p08-v015-composer-private.log" 2>&1
          python3 -B target/scripts/check_stack_contract.py --phase full --root target
          ( cd target
            git diff --exit-code && git diff --cached --exit-code
            for f in $(git ls-files --others --exclude-standard); do
              case "$f" in
                bootstrap/cache/packages.php|bootstrap/cache/services.php) test -f "$f" && ! test -L "$f" && rm -- "$f";;
                *) echo P08_V015_DEV_UNEXPECTED_GENERATED_SOURCE; exit 23;;
              esac
            done
            test -z "$(git status --porcelain --untracked-files=all)"
          )
          echo P08_V015_REPAIRED_MAIN_EXACT_SOURCE_PACKAGE_PREREQ=PASS
          git -C target rev-parse 'HEAD^{tree}' | sed 's/^/P08_V015_REPAIRED_MAIN_TREE=/'
      - name: Acquire genuine previously issued v014 FULL and exact old manifest bytes
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          tmp="$RUNNER_TEMP/p08-v015-dev-real-archives"
          test ! -e "$tmp"
          mkdir -m 700 "$tmp"
          curl -fsSL --retry 2 --max-time 100 \
            -H "Authorization: Bearer $READ_TOKEN" \
            -H 'Accept: application/octet-stream' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/llhzx2018/vf-adops/releases/assets/772420344 \
            -o "$tmp/issued-v014-full.zip"
          test "$(sha256sum "$tmp/issued-v014-full.zip" | cut -d' ' -f1)" = 2b8023a1c67213dbebb8f7047f27debbccc0f00fb210d10aeb3dc703076a811b
          unzip -p "$tmp/issued-v014-full.zip" FULL_MANIFEST.json > "$tmp/issued-v014-manifest.json"
          test "$(sha256sum "$tmp/issued-v014-manifest.json" | cut -d' ' -f1)" = efcfa190b08e11e2ff93c9ade976e86355f933fb22417c9668e4cb1f840cf09b
          python3 - "$tmp/issued-v014-manifest.json" <<'PY'
          from pathlib import Path
          import json,sys
          m=json.loads(Path(sys.argv[1]).read_bytes())
          assert m['source_sha']=='6fae792864a594465e4b3224bd6d73abde976f12'
          assert m['target_version']=='0.1.14' and m['type']=='CLEAN_FULL_ONLY'
          assert len(m['files'])>6100
          print('P08_V015_DEV_PREVIOUS_OFFICIAL_V014_ZIP_AND_MANIFEST=PASS')
          PY
      - name: Validate 13 shared authority applicability and twice-build true DEV FULL + Atomic
        shell: bash
        run: |
          set -Eeuo pipefail
          tmp="$RUNNER_TEMP/p08-v015-dev-real-archives"
          python3 -B - <<'PY'
          from pathlib import Path
          import json
          gov=Path('gov');target=Path('target')
          router=json.loads((gov/'governance/public-authority/VF_PUBLIC_AUTHORITY_APPLICABILITY_ROUTER_V1.0.json').read_text())
          domains=router['domains']
          required={'INSTALL','SECURITY','TESTING','UPGRADE','DATA_SCHEMA','CRON_JOB','OBSERVABILITY','GIT','UA_UI'}
          conditional={'API_PROVIDER','SEO','NOTIFICATION','PERFORMANCE'}
          assert len(domains)==13 and set(domains)==required|conditional
          matrix=(target/'docs/authority/PUBLIC_AUTHORITY_APPLICABILITY.md').read_text()
          for key,record in domains.items():
            body=gov/record['authority']
            assert body.is_file() and body.stat().st_size>1000
            assert '| '+key+' |' in matrix
          assert '## RP-07W' in (target/'docs/authority/ACCEPTANCE_MATRIX.md').read_text()
          print('P08_V015_DEV_13_DOMAIN_APPLICABILITY=PASS')
          PY
          old="$(sha256sum "$tmp/issued-v014-manifest.json" | cut -d' ' -f1)"
          for round in first second; do
            python3 -B target/scripts/build_full.py \
              --source "$GITHUB_WORKSPACE/target" --output "$tmp/dev-full-$round.zip" \
              --version 0.1.15 --source-sha "$TARGET_SHA" \
              --governance-root "$GITHUB_WORKSPACE/gov"
            python3 -B target/scripts/build_atomic.py \
              --source "$GITHUB_WORKSPACE/target" --output "$tmp/dev-update-$round.zip" \
              --source-version 0.1.14 --source-sha "$P08_OLD_SOURCE_SHA" \
              --source-full-manifest-sha256 "$old" \
              --previous-full-manifest "$tmp/issued-v014-manifest.json" \
              --target-version 0.1.15 --target-sha "$TARGET_SHA"
          done
          cmp "$tmp/dev-full-first.zip" "$tmp/dev-full-second.zip"
          cmp "$tmp/dev-update-first.zip" "$tmp/dev-update-second.zip"
          unzip -tqq "$tmp/dev-full-first.zip"
          unzip -tqq "$tmp/dev-update-first.zip"
          python3 - "$tmp" "$TARGET_SHA" <<'PY'
          import hashlib,json,sys,zipfile
          from pathlib import Path
          root=Path(sys.argv[1]);sha=sys.argv[2]
          expected_source='6fae792864a594465e4b3224bd6d73abde976f12'
          old_manifest_sha=hashlib.sha256((root/'issued-v014-manifest.json').read_bytes()).hexdigest()
          full=root/'dev-full-first.zip';atomic=root/'dev-update-first.zip'
          for p,filename in [(full,'FULL_MANIFEST.json'),(atomic,'ATOMIC_MANIFEST.json')]:
            with zipfile.ZipFile(p) as z:
              m=json.loads(z.read(filename))
              assert len(m['files'])>6100 and z.testzip() is None
              paths=z.namelist()
              assert not any(n.startswith('.git/') or n in ('.env','storage/database.sqlite')
                             or n.startswith('storage/app/private/') or n.startswith('node_modules/') for n in paths)
              if filename.startswith('FULL'):
                assert m['type']=='CLEAN_FULL_ONLY' and m['source_sha']==sha
                assert m['target_version']=='0.1.15' and m['data_included'] is False
              else:
                assert m['type']=='P08_ATOMIC_CODE_ONLY_V1' and m['source_version']=='0.1.14'
                assert m['source_sha']==expected_source and m['source_full_manifest_sha256']==old_manifest_sha
                assert m['target_version']=='0.1.15' and m['target_sha']==sha
                assert m['schema_changes'] is False
          print('P08_V015_DEV_FULL_SHA256='+hashlib.sha256(full.read_bytes()).hexdigest())
          print('P08_V015_DEV_ATOMIC_SHA256='+hashlib.sha256(atomic.read_bytes()).hexdigest())
          print('P08_V015_DEV_TRUE_ZIPS_DETERMINISTIC_AND_SOURCE_PINNED=PASS')
          PY
      - name: Public Authority structural delivery checks of both genuine DEV archives
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B - <<'PY'
          import hashlib,json,os,subprocess,sys
          from pathlib import Path
          p=Path('target').resolve();g=Path('gov').resolve()
          t=Path(os.environ['RUNNER_TEMP'])/'p08-v015-dev-real-archives'
          checker=g/'governance/public-authority/tools/task_delivery_contract_lint.py'
          router=g/'governance/public-authority/VF_PUBLIC_AUTHORITY_APPLICABILITY_ROUTER_V1.0.json'
          paths={'agents':'AGENTS.md','current':'docs/authority/CURRENT.md',
                 'acceptance':'docs/authority/RPD.md','applicability':'docs/authority/PUBLIC_AUTHORITY_APPLICABILITY.md'}
          required=['INSTALL','SECURITY','TESTING','UPGRADE','DATA_SCHEMA','CRON_JOB','OBSERVABILITY','GIT','UA_UI']
          capabilities=['source_change','full_package','installer_ui','auth','database','online_upgrade','background_job','release_visibility']
          for profile,filename,entry in [
            ('web_full_zip','dev-full-first.zip','public/setup.php'),
            ('web_atomic_zip','dev-update-first.zip','public/index.php')]:
            f=t/filename
            receipt={'schema':'vf.public-authority.task-delivery-check.v1','project':'P08',
              'source':os.environ['TARGET_SHA'],'project_authority':paths,
              'acceptance_markers':['WordPress-simple','CloudPanel'],
              'required_domains':required,'task_capabilities':capabilities,
              'delivery':{'profile':profile,'entrypoint':entry,'requires_git':False,
                'requires_manual_source_copy':False,'artifact':filename,
                'sha256':hashlib.sha256(f.read_bytes()).hexdigest()}}
            receipt_path=t/('receipt-'+profile+'.json')
            receipt_path.write_text(json.dumps(receipt))
            for phase,expected in [('resolve','RULES_RESOLVED'),('delivery','STRUCTURAL_PASS')]:
              process=subprocess.run([sys.executable,'-B',str(checker),'--phase',phase,
                '--receipt',str(receipt_path),'--project-root',str(p),
                '--artifact-root',str(t),'--public-router',str(router)],
                capture_output=True,text=True,timeout=90)
              assert process.returncode==0 and 'CONTRACT_CHECK='+expected in process.stdout.splitlines(),profile+':'+phase
              print('P08_V015_DEV_'+profile.upper()+'_'+phase.upper()+'=PASS')
          print('P08_V015_DEV_POST_R67_13_DOMAIN_REAL_ARCHIVE_STRUCTURAL_PREFLIGHT=PASS')
          PY
      - name: Always erase private code, artifacts and session logs
        if: always()
        shell: bash
        run: |
          rm -rf -- runner target gov "$RUNNER_TEMP/p08-v015-dev-real-archives" "$RUNNER_TEMP/p08-v015-npm-private.log" "$RUNNER_TEMP/p08-v015-composer-private.log"
          test ! -e target && test ! -e gov && test ! -e runner
          echo P08_V015_DEV_ONLY_PRIVATE_CLEANUP=PASS
