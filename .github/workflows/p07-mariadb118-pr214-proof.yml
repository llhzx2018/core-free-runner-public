name: TEMP P07 MariaDB 11.8 exact-private-source gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-mariadb118-pr214-proof.yml'

permissions:
  contents: read

jobs:
  exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_P07_SHA: c27b01404cca545b59529f752b3eea31fa308437
    steps:
      - name: Verify registered private read capability
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          test -n "$VF_PRIVATE_READ_TOKEN" || { echo P07_PRIVATE_READ_CAPABILITY_UNAVAILABLE; exit 78; }

      - name: Checkout exact private P07 source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: c27b01404cca545b59529f752b3eea31fa308437
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: transient-p07-private

      - name: Verify source identity and execute synthetic migration regression
        shell: bash
        working-directory: transient-p07-private
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_P07_SHA"
          test "$(cat VERSION)" = '0.1.0'
          test "$(cat BUILD_ID)" = '0.1.0-release88'
          bash -n bin/vfops-init-ui
          PYTHONPATH=lib python3 -m unittest -v             tests.test_mariadb_owner_policy             tests.test_server_migration             tests.test_server_migration_pull
          echo P07_MARIADB_118_EXACT_SOURCE_MACHINE_PASS

      - name: Clean up all private product material
        if: always()
        shell: bash
        run: |
          rm -rf -- transient-p07-private
