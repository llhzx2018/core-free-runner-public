name: P01 Music 2.47.428 Quick Import Exact HTTP Gate
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-music-quick-import-v247428-20261022.yml']
permissions:
  contents: read
jobs:
  verify:
    if: >-
      github.actor == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'verify/p01-music-quick-import-v247428-20261022'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Prepare PHP SQLite runtime
        uses: shivammathur/setup-php@2.35.5
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,mbstring,curl,zip
          coverage: none
      - name: Fetch private exact candidate transiently
        env:
          PRIVATE_READ: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ"
          git clone -q --depth 1 --no-checkout \
            "https://x-access-token:${PRIVATE_READ}@github.com/llhzx2018/vf-start.git" candidate
          git -C candidate fetch -q --depth 1 origin 4ff3f7c60dcbbb6b2f74f40ac8a89338a1abda8a
          git -C candidate checkout -q --detach FETCH_HEAD
          git -C candidate remote set-url origin "https://github.com/llhzx2018/vf-start.git"
          test "$(git -C candidate rev-parse HEAD)" = 4ff3f7c60dcbbb6b2f74f40ac8a89338a1abda8a
          test "$(tr -d '\r\n ' <candidate/VERSION)" = '2.47.428'
          test "$(tr -d '\r\n ' <candidate/src/VERSION.txt)" = '2.47.428'
          echo P01_MUSIC_IMPORT_EXACT_SOURCE=PASS
      - name: Verify quick parser and existing music contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in src/app/MusicQuickImport.php src/music-home.php src/app/MusicRepository.php src/app/MusicImportPlan.php; do php -l "candidate/$f"; done
          (cd candidate && php tests/unit/music_quick_import_contract.php)
          (cd candidate && php tests/unit/music_playlist_import_contract.php)
          (cd candidate && php tests/unit/music_import_plan_contract.php)
          (cd candidate && php tests/unit/music_native_source_contract.php)
          node candidate/tests/unit/music_player_fallback_contract.js
          (cd candidate && for f in \
            tests/unit/consolidated_product_acceptance_contract.php \
            tests/unit/engineering_consistency_r80_contract.php \
            tests/unit/public_global_nav_contract.php \
            tests/unit/public_home_owner_shell_unified_v247390_contract.php \
            tests/unit/workspace_view_catalog_contract.php; do php "$f"; done)
          echo P01_MUSIC_QUICK_IMPORT_UNIT_AND_REGRESSION=PASS
      - name: Synthetic true HTTP preview, CSRF, SQLite import, rollback, repeat
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n candidate/tests/integration/music_fresh_http.sh
          bash candidate/tests/integration/music_fresh_http.sh candidate
          echo P01_MUSIC_QUICK_IMPORT_HTTP=PASS
      - name: Clean transient source
        if: always()
        shell: bash
        run: |
          rm -rf candidate
          echo P01_MUSIC_QUICK_IMPORT_EPHEMERAL_CLEANUP=PASS
