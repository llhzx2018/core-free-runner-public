name: P02 V2.5.120 Source Hash Probe

on:
  push:
    branches: [run/p02-v25120-hash-20260925]

permissions:
  contents: read

jobs:
  hash:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: ui/p02-v25120-backup-security-closure-20260925
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product
      - name: Read exact source hashes
        run: |
          cd product
          echo "P02_V25120_VERSION_BYTES=$(wc -c < VERSION)"
          echo "P02_V25120_VERSION_SHA256=$(sha256sum VERSION | awk '{print $1}')"
          echo "P02_V25120_CSS_BYTES=$(wc -c < public/assets/app.css)"
          echo "P02_V25120_CSS_SHA256=$(sha256sum public/assets/app.css | awk '{print $1}')"
          echo "P02_V25120_HASH_PROBE=PASS"
