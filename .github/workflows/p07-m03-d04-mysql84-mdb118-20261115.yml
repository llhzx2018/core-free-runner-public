name: P07 M03-D04 MySQL8.4 to MariaDB11.8 isolated full site migration
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-m03-d04-mysql84-mdb118-20261115.yml'
      - 'tests/p07_m03_d04_mysql84_mdb118_gtid_full.sh'
permissions:
  contents: read
jobs:
  mysql84-mdb118-full-pull:
    # One bounded correction of exact source pin; normal product full test.
    if: github.event.action == 'synchronize'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout public synthetic runner harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout private exact P07 product commit transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 8a0a397d3f885c3900e3570aac96b1638f0a849e
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: .p07-private-exact
      - name: Synthetic MySQL8.4 to MariaDB11.8 two-CloudPanel actual site pull
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-private-exact rev-parse HEAD)" = 8a0a397d3f885c3900e3570aac96b1638f0a849e
          (
            cd .p07-private-exact
            export PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 PYTHONPATH="$PWD/lib"
            python3 -B -m unittest discover -s tests -p test_p07_m03_gtid_safe_reexport.py -v
            python3 -B -m unittest discover -s tests -p test_migration_source_mysql_hex_export.py -v
            python3 -B -m unittest discover -s tests -p test_p07_m03_source_sql_safety_preimport.py -v
            python3 -B -m unittest discover -s tests -p test_migration_safe_session_guard.py -v
          )
          echo P07_M03_D04_DYNAMIC_EXECUTION_NATIVE_REEXPORT_UNIT=PASS
          bash -n tests/p07_m03_d04_mysql84_mdb118_gtid_full.sh
          timeout --signal=TERM --kill-after=60s 3100s bash tests/p07_m03_d04_mysql84_mdb118_gtid_full.sh
      - name: Remove private product checkout
        if: always()
        shell: bash
        run: |
          rm -rf -- .p07-private-exact
          test ! -e .p07-private-exact
          echo P07_M03_D04_MYSQL_TEST_PRIVATE_SOURCE_CLEAN=PASS
