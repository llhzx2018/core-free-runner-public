name: S01 Ops 1.21.1111 channel exact candidate
on:
  push:
    branches: [task/s01-ops1111-publish-20261013]
    paths: [.github/workflows/s01-c02-1211111-channel-candidate.yml]
permissions:
  contents: read
jobs:
  channel-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: 609fcf2f1daabc738cfbff378bbbe03a19768510
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: channel
      - name: Original manifest schema and Update Core PHP tests
        run: |
          set -Eeuo pipefail
          test "$(git -C channel rev-parse HEAD)" = 609fcf2f1daabc738cfbff378bbbe03a19768510
          (cd channel && python3 scripts/check_manifest_contract.py)
          (cd channel && find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null)
          (cd channel && php update-core/php/tests/run.php)
          echo S01_OPS_1111_ORIGINAL_CORE_UPDATES_TESTS_PASS
      - name: Verify exact remotely published ZIP, metadata and source upgrade
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p released
          gh release download v1.21.1111 --repo llhzx2018/vf-tools-ops --pattern vf-tools-ops_V1.21.1111.zip --dir released
          python3 - <<'PY'
          import json,hashlib,pathlib,zipfile
          m=json.loads(pathlib.Path('channel/projects/S01-C02.json').read_text())
          p=pathlib.Path('released')/m['asset_name'];payload=p.read_bytes()
          assert m['target_version']=='1.21.1111' and m['release_tag']=='v1.21.1111'
          assert '1.21.1109' in m['from_versions']
          assert '1.21.1110' in m['from_versions']
          assert hashlib.sha256(payload).hexdigest()==m['asset_sha256']
          assert len(payload)==m['asset_bytes']==3581602
          with zipfile.ZipFile(p) as z:
           assert z.testzip() is None and len(z.namelist())==m['runtime_files']==990
           assert z.read('vf-ops/vf-ops.php').decode().find('Version: 1.21.1111')!=-1
          assert m['runtime_fingerprint']=='19c13b587d8b9086a0487137c9383cd14cbff7c8c0a3013d22052400e5fd6d80'
          print('S01_OPS_1111_CHANNEL_EXACT_RELEASE_ASSET_PASS')
          PY
      - name: Remove transient code and ZIP
        if: always()
        run: rm -rf channel released
