name: P08 R87 exact source atomic Vite asset projection (ephemeral)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p08-r87-vite-assets-once.yml'
permissions:
  contents: read
jobs:
  p08-r87:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout one-off public harness without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout pinned private P08 source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-adops
          ref: 64dc86334d4cded4715814b1fc5c03d1e84c604d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-p08-r87
      - name: Refuse wrong source or private runtime state
        run: |
          set -euo pipefail
          test "$(git -C private-p08-r87 rev-parse HEAD)" = 64dc86334d4cded4715814b1fc5c03d1e84c604d
          test "$(cat private-p08-r87/VERSION)" = 0.1.1
          test ! -e private-p08-r87/.env
          test ! -e private-p08-r87/storage/app/private/adops/installation/installed.json
          echo P08_R87_EXACT_SOURCE=PASS
      - name: Install isolated PHP 8.4 for source-bound tests
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: zip, mbstring, fileinfo, sodium, pdo_sqlite
      - name: Verify Vite asset projection, collision refusal, and Atomic pointer
        run: |
          set -euo pipefail
          cd private-p08-r87
          php -l src/Upgrade/GitHubVerifiedCandidatePreparation.php
          php -l src/Upgrade/AtomicReleaseAssets.php
          php -l src/Upgrade/AtomicReleaseMaterializer.php
          php -l src/Upgrade/AtomicReleasePointer.php
          php -l tests/test_atomic_release_materializer.php
          php tests/test_atomic_release_materializer.php
          php tests/test_atomic_release_pointer.php
          php tests/test_flat_layout_bridge_activation.php
          echo P08_R87_EXACT_SOURCE_ASSET_SAFETY_MACHINE=PASS
      - name: Remove transient private checkout and job scratch
        if: always()
        run: |
          rm -rf private-p08-r87
