name: P07 RC4 Freeze

on:
  push:
    branches: [feature/p07-vps-audit-rc4-china-regions]
    paths:
      - '.github/workflows/p07-rc4-freeze.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Freeze RC4 identity
        shell: bash
        run: |
          set -euo pipefail
          f=experiments/p07-vps-audit-v20-rc4.sh
          bash -n "$f"
          version="$(NO_COLOR=1 bash "$f" --version | awk '{print $NF}')"
          test "$version" = '2.0.0-rc4-zh'
          sha256sum "$f" | tee /tmp/P07_RC4_SHA256.txt
          printf 'VERSION=%s\nSOURCE_COMMIT=%s\n' "$version" "$GITHUB_SHA" >> /tmp/P07_RC4_SHA256.txt
      - name: Upload freeze evidence
        uses: actions/upload-artifact@v4
        with:
          name: p07-rc4-freeze-${{ github.run_id }}
          path: /tmp/P07_RC4_SHA256.txt
          if-no-files-found: error
          retention-days: 30
