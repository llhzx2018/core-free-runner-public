name: S01-C03 1.25.27 Human Recovery Gate

on:
  push:
    branches:
      - temp/s01-c03-12527-human-recovery-gate-20260907

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Credential boundary
        shell: bash
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_READ_TOKEN"

      - name: Checkout exact M3U8 candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: 029aac16e69c933eb3b336c4b8c30c8cc6db074c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: m3u8

      - name: Exact eight-file fence
        shell: bash
        run: |
          set -euo pipefail
          cd m3u8
          test "$(git rev-parse HEAD)" = "029aac16e69c933eb3b336c4b8c30c8cc6db074c"
          git cat-file -e c6d0bbb0392dfa59ab91b3b98d8a0258ca95f9bb^{commit}
          git diff --name-only c6d0bbb0392dfa59ab91b3b98d8a0258ca95f9bb HEAD | sort > /tmp/m3u8-actual.txt
          cat > /tmp/m3u8-expected.txt <<'EOF'
          VERSION
          src/admin/admin-s01-uiux-polish.php
          src/vf-tool-m3u8.php
          tests/unit/dashboard-human-language-contract.php
          tests/unit/host-recovery-human-language-contract.php
          tests/unit/package-physical-locator-contract.php
          tests/unit/update-refresh-policy-contract.php
          tests/unit/visible-console-v2-contract.php
          EOF
          sort -o /tmp/m3u8-expected.txt /tmp/m3u8-expected.txt
          diff -u /tmp/m3u8-expected.txt /tmp/m3u8-actual.txt
          test "$(cat VERSION)" = "1.25.27"
          grep -Fq 'Version: 1.25.27' src/vf-tool-m3u8.php
          grep -Fq "VF_TOOL_M3U8_VERSION', '1.25.27'" src/vf-tool-m3u8.php
          grep -Fq "VF_TOOL_M3U8_ROUND', 'R251'" src/vf-tool-m3u8.php
          grep -Fq 'R251_S01_HUMAN_RECOVERY_LANGUAGE' src/vf-tool-m3u8.php

      - name: Full PHP syntax gate
        shell: bash
        run: |
          set -euo pipefail
          find m3u8 -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/m3u8-php-lint.log
          tail -n 15 /tmp/m3u8-php-lint.log

      - name: Human Recovery and visible UX contracts
        shell: bash
        run: |
          set -euo pipefail
          cd m3u8
          php tests/unit/host-recovery-human-language-contract.php
          php tests/unit/dashboard-human-language-contract.php
          php tests/unit/admin-human-language-contract.php
          php tests/unit/update-refresh-policy-contract.php
          php tests/unit/visible-console-v2-contract.php
          php tests/unit/package-physical-locator-contract.php
          php tests/frontend-s01-uiux-final-owner-contract.php

      - name: Provider schema migration update freeze
        shell: bash
        run: |
          set -euo pipefail
          cd m3u8
          BASE=c6d0bbb0392dfa59ab91b3b98d8a0258ca95f9bb
          ! git diff --name-only "$BASE" HEAD | grep -E '(^|/)(tool-settings\.schema\.json|plugin-manifest\.json|PACKAGE_PROFILE\.json|src/includes/update/|src/includes/v6-provider-|src/config/)'
          git diff --quiet "$BASE" HEAD -- src/includes/v6-provider-schema.php
          git diff --quiet "$BASE" HEAD -- src/includes/v6-provider-controlled-migration-admin.php
          git diff --quiet "$BASE" HEAD -- src/includes/v6-provider-post-migration-readonly.php
          git diff --quiet "$BASE" HEAD -- src/includes/update
          grep -Fq "function vf_tools_m3u8_v6_schema_version(): string { return '1.3.0'; }" src/includes/v6-provider-schema.php
          grep -Fq 'Read-only closure evidence for an already committed controlled migration.' src/includes/v6-provider-post-migration-readonly.php
          git diff --unified=0 "$BASE" HEAD -- src/vf-tool-m3u8.php > /tmp/m3u8-main.diff
          ! grep -E '^[-+].*(require_once|register_activation_hook|VF_TOOLS_M3U8_(CANONICAL|LEGACY)_SLUG|vf_m3u8_settings_|vf_m3u8_mounts_|vf_tools_m3u8_v6_)' /tmp/m3u8-main.diff
          echo PASS_M3U8_PROVIDER_SCHEMA_MIGRATION_UPDATE_FREEZE

      - name: Default-visible owner proof
        shell: bash
        run: |
          set -euo pipefail
          cd m3u8
          grep -Fq 'data-vf-host-recovery="1"' src/admin/admin-s01-uiux-polish.php
          grep -Fq 'class="vf-workbench-v12 is-warn"' src/admin/admin-s01-uiux-polish.php
          grep -Fq '.vf-m3u8-admin .vf-workbench-v12' src/admin/ui-v4/admin-s01-console-v2.css
          grep -Fq '.vf-workbench-v12__header' src/admin/ui-v4/admin-s01-console-v2.css
          grep -Fq '.vf-workbench-v12__command' src/admin/ui-v4/admin-s01-console-v2.css
          ! grep -F '统一后台 Shell' src/admin/admin-s01-uiux-polish.php
          ! grep -F 'M3U8 Provider' src/admin/admin-s01-uiux-polish.php
          ! grep -F 'V7.1 当前架构' src/admin/admin-s01-uiux-polish.php
          ! grep -F 'Product Page' src/admin/admin-s01-uiux-polish.php
          ! grep -F '14 个 M3-*' src/admin/admin-s01-uiux-polish.php
          echo PASS_M3U8_DEFAULT_VISIBLE_OWNER_PROOF
