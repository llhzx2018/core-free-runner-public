name: p01-v24747-final-release-temp

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v24747-final-release-temp.yml'
      - 'requests/p01-v24747-final-release-20260924.json'
      - 'scripts/p01_build_v24747_final.py'
      - 'scripts/p01_v24747_final_gate.sh'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      UPDATES_REPO: llhzx2018/core-updates
      TARGET_SHA: 7d67e83859dbab24d928dc9adc90ac6dbe405121
      TARGET_TREE: cce12ac706cec24c0d3b30802a0fccf8599c5fc3
      GOV_SHA: d27f1391a63b4f7cc366894a445f771df14ba4d9
      VERSION: 2.47.47
      SOURCE_VERSION: 2.47.46
      SCHEMA: '2026090401'
      TAG: v2.47.47
    steps:
      - name: Checkout runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Exact source and Current Authority readback
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          remote_main="$(git ls-remote "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" refs/heads/main | awk '{print $1}')"
          remote_gov="$(git ls-remote "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/gov-doc.git" refs/heads/main | awk '{print $1}')"
          test "$remote_main" = "$TARGET_SHA"
          test "$remote_gov" = "$GOV_SHA"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" candidate
          git -C candidate fetch -q --depth 1 origin "$TARGET_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "$VERSION"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "$VERSION"
          echo P01_V24747_FINAL_EXACT_SOURCE=PASS

      - name: Download exact V2.47.46 formal baseline
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-rel46/full /tmp/p01-rel46/update
          gh release download v2.47.46 -R "$PRODUCT_REPO" -D /tmp/p01-rel46             -p 'VF-Start-V2.47.46-FULL.zip'             -p 'VF_Start_V2.47.46_UPDATE.zip'
          unzip -q /tmp/p01-rel46/VF-Start-V2.47.46-FULL.zip -d /tmp/p01-rel46/full
          unzip -q /tmp/p01-rel46/VF_Start_V2.47.46_UPDATE.zip -d /tmp/p01-rel46/update
          test "$(tr -d '\r\n ' </tmp/p01-rel46/full/VERSION.txt)" = "$SOURCE_VERSION"
          test -f /tmp/p01-rel46/update/repair-v2.47.46.php
          echo P01_V24747_FORMAL_BASELINE=PASS

      - name: Prepare runtime dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd unzip jq >/dev/null
          php -m | grep -Fx pdo_sqlite
          php -m | grep -Fx sqlite3
          php -m | grep -Fx curl
          php -m | grep -Fx gd

      - name: Checkout V2.47.46 stable source
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone -q --depth 1 --branch v2.47.46 "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" stable
          test "$(git -C stable rev-parse HEAD)" = "2e31cf1b78fc4fc1958138e99a7fd1fd1c57efa1"

      - name: Canonical zero-debt regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate stable --require-zero-debt | tee /tmp/p01-v24747-canonical.txt
          grep -Fx 'P01_CANONICAL_CURRENT_FAILURE_COUNT=0' /tmp/p01-v24747-canonical.txt
          grep -Fx 'P01_CANONICAL_NEW_REGRESSION_COUNT=0' /tmp/p01-v24747-canonical.txt
          grep -Fx 'P01_CANONICAL_LEGACY_TEST_DEBT_COUNT=0' /tmp/p01-v24747-canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/p01-v24747-canonical.txt
          echo P01_V24747_FINAL_CANONICAL=PASS

      - name: Focused UI security and data contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-v24747-focused-source
          cp -a candidate /tmp/p01-v24747-focused-source
          focused=/tmp/p01-v24747-focused-source
          tests=(
            tests/unit/admin_all_resources_column_lock_r4_contract.php
            tests/unit/admin_all_resources_visual_alignment_r3_contract.php
            tests/unit/admin_all_resources_alignment_r2_contract.php
            tests/unit/admin_all_resources_page3_polish_contract.php
            tests/unit/admin_resource_browse_edit_r5_contract.php
            tests/unit/resource_manager_pagination_context_contract.php
            tests/unit/engineering_consistency_r80_contract.php
            tests/unit/session_csrf_contract.php
            tests/unit/update_csrf_recovery_contract.php
            tests/unit/navigation_owner_behavior_privacy_contract.php
            tests/unit/privacy_cache_performance_r2_contract.php
          )
          for t in "${tests[@]}"; do php "$focused/$t"; done
          php "$focused/tests/integration/resource_asset_disaster_recovery_contract.php"
          test "$(git -C candidate status --porcelain)" = ""
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          echo P01_V24747_FINAL_FOCUSED=PASS
          echo P01_V24747_CANDIDATE_UNCHANGED=PASS

      - name: Build and verify final FULL + Atomic UPDATE
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/p01_v24747_final_gate.sh
          RECEIPT=/tmp/p01-v24747-artifacts/P01_V24747_ARTIFACT_RECEIPT.json
          jq -e --arg s "$TARGET_SHA" --arg t "$TARGET_TREE" '.version=="2.47.47" and .source_version=="2.47.46" and .source_sha==$s and .source_tree==$t and .schema=="2026090401"' "$RECEIPT" >/dev/null
          echo "FULL_SHA=$(jq -r '.full_sha256' "$RECEIPT")" >> "$GITHUB_ENV"
          echo "FULL_BYTES=$(jq -r '.full_bytes' "$RECEIPT")" >> "$GITHUB_ENV"
          echo "UPDATE_SHA=$(jq -r '.update_sha256' "$RECEIPT")" >> "$GITHUB_ENV"
          echo "UPDATE_BYTES=$(jq -r '.update_bytes' "$RECEIPT")" >> "$GITHUB_ENV"
          echo P01_V24747_FINAL_ARTIFACT_GATE=PASS

      - name: Record OWNER-authorized Preview exception
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/P01_V24747_RELEASE_EXCEPTION.txt <<'EOF'
          exception_id=P01-REL-24747-OWNER-PREVIEW-EX-20260924
          rule=RP-07 OWNER_PREVIEW_RUNTIME + OWNER_REAL_USE before Formal Release
          result=EXCEPTION
          approver=OWNER
          reason=OWNER explicitly authorized direct publish for manual Production update and asked not to repeat confirmation prompts.
          scope=V2.47.47 Formal Release + Distribution only
          residual_risk=Exact V2.47.47 visible UI was not OWNER-previewed before release.
          compensating_control=Exact-source canonical zero-debt, focused UI/security/data, Clean FULL, Atomic upgrade, idempotency, rollback and data-sentinel gates PASS; Production remains manual.
          effective_at=2026-09-24
          expires_at=2026-09-25 or Formal Release + Distribution closure, whichever comes first.
          exit_plan=OWNER manually updates Production to V2.47.47 and performs real-use visual QA; remaining defects return to L2 repair.
          evidence_pointer=vf-start PR #934 + active OWNER authorization
          EOF
          cat /tmp/P01_V24747_RELEASE_EXCEPTION.txt
          echo OWNER_PREVIEW_RUNTIME=EXCEPTION
          echo OWNER_REAL_USE=EXCEPTION
          echo OWNER_PREVIEW_EXCEPTION_AUTHORIZED=YES

      - name: Publish tag and GitHub Formal Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          remote_tag="$(git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${PRODUCT_REPO}.git" "refs/tags/${TAG}" | awk '{print $1}')"
          if [ -z "$remote_tag" ]; then
            git -C candidate config user.name VictorForge
            git -C candidate config user.email llhzx2018@gmail.com
            git -C candidate tag "$TAG" "$TARGET_SHA"
            git -C candidate push "https://x-access-token:${GH_TOKEN}@github.com/${PRODUCT_REPO}.git" "refs/tags/${TAG}"
          else
            test "$remote_tag" = "$TARGET_SHA"
          fi
          cat >/tmp/p01-v24747-notes.md <<EOF
          # VF Start V2.47.47

          P01 · VF Start V2.47.47 “全部资源”真实列轨锁定更新。

          - Exact Source: $TARGET_SHA
          - Exact Tree: $TARGET_TREE
          - Source Version: V2.47.46
          - Target Version: V2.47.47
          - Schema: $SCHEMA（不变）
          - “资源 / 分组 / 归属 / 操作”表头与每行强制使用同一 full-width grid rail
          - row / details / summary 容器统一锁定 100% 宽度，长标题不再挤动后续列
          - Desktop 与 Mobile 保持独立布局
          - Canonical zero-debt / Focused UI-Security-Data / Clean FULL / Atomic / Idempotency / Rollback / Data Sentinel: PASS
          - OWNER Preview Gate: EXCEPTION（Owner 明确授权直接发布供后台手动更新；未伪装为 Preview PASS）
          - Production upgrade: NOT INCLUDED；仍由 OWNER 在 P01 后台手动执行
          EOF
          FULL=/tmp/p01-v24747-artifacts/VF-Start-V2.47.47-FULL.zip
          UPDATE=/tmp/p01-v24747-artifacts/VF_Start_V2.47.47_UPDATE.zip
          if gh release view "$TAG" --repo "$PRODUCT_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FULL" "$UPDATE" --repo "$PRODUCT_REPO" --clobber
          else
            gh release create "$TAG" "$FULL" "$UPDATE" --repo "$PRODUCT_REPO" --title 'VF Start V2.47.47' --notes-file /tmp/p01-v24747-notes.md --verify-tag
          fi
          gh api "repos/${PRODUCT_REPO}/releases/tags/${TAG}" >/tmp/p01-v24747-release.json
          RELEASE_ID="$(jq -r '.id' /tmp/p01-v24747-release.json)"
          RELEASED_AT="$(jq -r '.published_at' /tmp/p01-v24747-release.json)"
          test -n "$RELEASE_ID" && test "$RELEASE_ID" != null
          test "$(jq -r '.assets[]|select(.name=="VF-Start-V2.47.47-FULL.zip")|.size' /tmp/p01-v24747-release.json)" = "$FULL_BYTES"
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.47.47_UPDATE.zip")|.size' /tmp/p01-v24747-release.json)" = "$UPDATE_BYTES"
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"
          echo "RELEASED_AT=$RELEASED_AT" >> "$GITHUB_ENV"
          echo P01_V24747_FORMAL_RELEASE=PASS

      - name: Remote Tag and Asset readback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          remote_tag="$(git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${PRODUCT_REPO}.git" "refs/tags/${TAG}" | awk '{print $1}')"
          test "$remote_tag" = "$TARGET_SHA"
          rm -rf /tmp/p01-v24747-remote && mkdir -p /tmp/p01-v24747-remote
          gh release download "$TAG" --repo "$PRODUCT_REPO" --dir /tmp/p01-v24747-remote             --pattern 'VF-Start-V2.47.47-FULL.zip'             --pattern 'VF_Start_V2.47.47_UPDATE.zip'
          test "$(sha256sum /tmp/p01-v24747-remote/VF-Start-V2.47.47-FULL.zip | awk '{print $1}')" = "$FULL_SHA"
          test "$(sha256sum /tmp/p01-v24747-remote/VF_Start_V2.47.47_UPDATE.zip | awk '{print $1}')" = "$UPDATE_SHA"
          echo P01_V24747_REMOTE_RELEASE_READBACK=PASS

      - name: Publish Stable core-updates P01
        shell: bash
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone -q --depth 1 --branch main "https://x-access-token:${WRITE_TOKEN}@github.com/${UPDATES_REPO}.git" updates
          python3 - <<'PY'
          from pathlib import Path
          import json, os
          p=Path('updates/projects/P01.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          if str(d.get('target_version','')) not in {'2.47.46','2.47.47'}:
              raise SystemExit('unexpected P01 stable target: '+str(d.get('target_version')))
          d.update({
            'current_version':'2.47.46',
            'target_version':'2.47.47',
            'update_type':'ATOMIC',
            'from_versions':['2.47.46'],
            'schema_from':'2026090401',
            'schema_to':'2026090401',
            'repository':'llhzx2018/vf-start',
            'release_tag':'v2.47.47',
            'release_id':int(os.environ['RELEASE_ID']),
            'product_identity':os.environ['TARGET_SHA'],
            'asset_name':'VF_Start_V2.47.47_UPDATE.zip',
            'asset_bytes':int(os.environ['UPDATE_BYTES']),
            'asset_sha256':os.environ['UPDATE_SHA'],
            'backup_required':True,
            'rollback_supported':True,
            'released_at':os.environ['RELEASED_AT'],
            'minimum_php':'8.0.0',
            'notes':'P01 · VF Start V2.47.47 全部资源 R4 列轨锁定稳定更新。Exact Source '+os.environ['TARGET_SHA']+'；Schema 2026090401 不变；Machine/Canonical/Clean FULL/Atomic/Idempotency/Rollback/Data Sentinel 均 PASS。OWNER 明确授权直接 Formal Release + Stable Distribution 供后台手动 Production 更新；Preview Gate 记录为一次性 EXCEPTION，不等于 Preview PASS；Production 仍由 OWNER 手动升级并做真实视觉验收。'
          })
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git -C updates config user.name VictorForge
          git -C updates config user.email llhzx2018@gmail.com
          git -C updates add projects/P01.json
          if ! git -C updates diff --cached --quiet; then
            git -C updates commit -m 'release(P01): publish VF Start V2.47.47 stable update'
          fi
          for i in 1 2 3; do
            if git -C updates push origin main; then break; fi
            git -C updates pull --rebase origin main
            test "$i" -lt 3
          done
          echo P01_V24747_CORE_UPDATES_PUBLISHED=PASS

      - name: Stable channel remote readback
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/core-updates-readback
          git clone -q --depth 1 --branch main "https://x-access-token:${READ_TOKEN}@github.com/${UPDATES_REPO}.git" /tmp/core-updates-readback
          jq -e             --arg sha "$UPDATE_SHA"             --arg product "$TARGET_SHA"             --argjson rid "$RELEASE_ID"             --argjson bytes "$UPDATE_BYTES"             '.current_version=="2.47.46" and .target_version=="2.47.47" and .from_versions==["2.47.46"] and .release_tag=="v2.47.47" and .release_id==$rid and .product_identity==$product and .asset_name=="VF_Start_V2.47.47_UPDATE.zip" and .asset_bytes==$bytes and .asset_sha256==$sha'             /tmp/core-updates-readback/projects/P01.json >/dev/null
          cat /tmp/core-updates-readback/projects/P01.json
          echo P01_V24747_STABLE_CHANNEL_READBACK=PASS
          echo P01_V24747_FORMAL_RELEASE_DISTRIBUTION=PASS
          echo P01_V24747_PRODUCTION_CHANGED=NO

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p01-v24747-final-release
          path: |
            /tmp/p01-v24747-artifacts/P01_V24747_ARTIFACT_RECEIPT.json
            /tmp/p01-v24747-release.json
            /tmp/P01_V24747_RELEASE_EXCEPTION.txt
            /tmp/p01-v24747-canonical.txt
          if-no-files-found: warn
          retention-days: 14
