name: P07 release94 exact formal publication
on:
  push:
    branches: [main]
    paths:
      - 'dist/p07/0.1.0/overlay/**'
      - 'packages/p07-system-care/0.1.0-rc63/**'
      - 'installers/p07.sh'
      - 'installers/p07-final.sh'
      - 'installers/p07-toolbox.sh'
      - 'installers/p07-system-care.sh'
      - '.github/workflows/p07-release94-formal-publish.yml'
permissions:
  contents: read
concurrency:
  group: p07-release94-formal-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_REPO: llhzx2018/core-free-runner-public
      RELEASE_TAG: p07-v0.1.0-release94
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact merged bytes and fail-closed trust chain
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN" || { echo P07_RELEASE_WRITE_CAPABILITY_MISSING; exit 78; }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api repos/$RELEASE_REPO/git/ref/heads/main --jq '.object.sha')" = "$GITHUB_SHA" || { echo P07_MAIN_MOVED; exit 78; }
          root=dist/p07/0.1.0/overlay
          care=packages/p07-system-care/0.1.0-rc63
          test "$(cat "$root/BUILD_ID")" = '0.1.0-release94'
          test "$(cat "$care/VERSION")" = '0.1.0-rc63'
          test "$(git hash-object "$root/RUNTIME.gitblob")" = 6d53e59eb10481a9d13d95e4ef2e5b376fb65fa2
          test "$(git hash-object "$root/MANIFEST.gitblob")" = 946914d12ccb11eafa506a75db6dd37bdde8594c
          test "$(git hash-object "$care/MANIFEST.gitblob")" = 6753125d53cc5d95fe69b1f08046d6fb63f0e8cd
          (cd "$root"; while read -r sha file; do test "$(git hash-object "$file")" = "$sha"; done < RUNTIME.gitblob)
          (cd "$root"; while read -r sha file; do test "$(git hash-object "$file")" = "$sha"; done < MANIFEST.gitblob)
          (cd "$care"; while read -r sha file; do test "$(git hash-object "$file")" = "$sha"; done < MANIFEST.gitblob)
          test "$(git hash-object installers/p07-final.sh)" = c26bd2c5198b26782dfe910711829337f75dd9a3
          test "$(git hash-object installers/p07.sh)" = 8ee883c99d84aae13ba0dbd54ffc2f20de83caac
          test "$(git hash-object installers/p07-toolbox.sh)" = 486688efda4c45da249831af8c6f4fd18af7fba8
          test "$(git hash-object installers/p07-system-care.sh)" = 465fd848ed51113ad2105f04ae748a922b1de978
          grep -Fq 'EXPECTED_BLOB="c26bd2c5198b26782dfe910711829337f75dd9a3"' installers/p07.sh
          grep -Fq 'EXPECTED_BUILD_ID="0.1.0-release94"' installers/p07-final.sh
          grep -Fq 'RUNTIME_MANIFEST_BLOB="6d53e59eb10481a9d13d95e4ef2e5b376fb65fa2"' installers/p07-final.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release94"' installers/p07-toolbox.sh
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc63"' installers/p07-toolbox.sh
          grep -Fq "MANIFEST_BLOB='6753125d53cc5d95fe69b1f08046d6fb63f0e8cd'" installers/p07-system-care.sh
          bash -n installers/p07.sh installers/p07-final.sh installers/p07-toolbox.sh installers/p07-system-care.sh
          echo P07_RELEASE94_EXACT_MERGED_PREFLIGHT_PASS
      - name: Formal GitHub release with exact target readback
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view "$RELEASE_TAG" -R "$RELEASE_REPO" >/dev/null 2>&1; then
            test "$(gh api repos/$RELEASE_REPO/git/ref/tags/$RELEASE_TAG --jq '.object.sha')" = "$GITHUB_SHA" || { echo P07_RELEASE_TAG_COLLISION; exit 81; }
          else
            gh release create "$RELEASE_TAG" -R "$RELEASE_REPO" --target "$GITHUB_SHA" \
              --title 'P07 · release94 · 正式网站数据工具与 System Care rc63' \
              --notes 'P07 release94 / System Care rc63. Exact private candidate 10654e902a41158d7d917a3956ce2bcea5554214; merged private source main ebee548790460b39cd18cb0ed606a1f286591638 has identical source tree. Public disposable real MySQL 8.4 to MariaDB 11.8 84-table, 9 populated-table equivalence PASS, 12 focused tests and five corrupted schema/data examples correctly blocked. Exact 165 migration and bundle regression tests PASS; isolated clean install, release93 to release94 upgrade, idempotency, corrupt-download rejection, and rollback PASS. Strict known-format full SQL fingerprint retains every schema object, conditional ALTER, row literal and index. Unknown SQL differences still block. No old CP/CP2/DNS changes. Production CP2 manual upgrade, migration resume, and DNS cutover remain separate OWNER gates.'
          fi
          test "$(gh api repos/$RELEASE_REPO/git/ref/tags/$RELEASE_TAG --jq '.object.sha')" = "$GITHUB_SHA"
          test "$(gh api repos/$RELEASE_REPO/releases/tags/$RELEASE_TAG --jq '.target_commitish')" = "$GITHUB_SHA"
          test "$(gh api repos/$RELEASE_REPO/releases/tags/$RELEASE_TAG --jq '.draft')" = false
          test "$(gh api repos/$RELEASE_REPO/releases/tags/$RELEASE_TAG --jq '.prerelease')" = false
          echo P07_RELEASE94_GITHUB_RELEASE_PASS
      - name: Upload exact installer assets and read back identities
        shell: bash
        run: |
          set -Eeuo pipefail
          gh release upload "$RELEASE_TAG" -R "$RELEASE_REPO" --clobber installers/p07.sh installers/p07-final.sh installers/p07-toolbox.sh installers/p07-system-care.sh
          mkdir -p /tmp/p07-release94-assets
          gh release download "$RELEASE_TAG" -R "$RELEASE_REPO" --dir /tmp/p07-release94-assets
          for name in p07.sh p07-final.sh p07-toolbox.sh p07-system-care.sh; do
            test -f "/tmp/p07-release94-assets/$name"
            test "$(git hash-object "/tmp/p07-release94-assets/$name")" = "$(git hash-object "installers/$name")"
          done
          echo P07_RELEASE94_ASSET_READBACK_PASS
      - name: Public installer raw-byte distribution readback
        shell: bash
        run: |
          set -Eeuo pipefail
          remote="https://raw.githubusercontent.com/$RELEASE_REPO/$GITHUB_SHA"
          for item in 'installers/p07.sh 8ee883c99d84aae13ba0dbd54ffc2f20de83caac' 'installers/p07-final.sh c26bd2c5198b26782dfe910711829337f75dd9a3' 'installers/p07-toolbox.sh 486688efda4c45da249831af8c6f4fd18af7fba8' 'installers/p07-system-care.sh 465fd848ed51113ad2105f04ae748a922b1de978' 'dist/p07/0.1.0/overlay/RUNTIME.gitblob 6d53e59eb10481a9d13d95e4ef2e5b376fb65fa2'; do
            read -r file sha <<< "$item"
            curl -fsSL --retry 5 --retry-delay 2 --proto '=https' --tlsv1.2 "$remote/$file" -o /tmp/p07-release94-remote
            test "$(git hash-object /tmp/p07-release94-remote)" = "$sha"
          done
          echo P07_RELEASE94_REMOTE_DISTRIBUTION_READBACK_PASS
