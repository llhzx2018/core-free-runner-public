name: P05 V1.2.0 Final Exact Source Gate
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p05-v120-final-3f0acc1.yml']
permissions:
  contents: read
jobs:
  p05-v120-final-exact-source:
    if: github.event_name == 'pull_request' && github.head_ref == 'tmp/p05-v120-final-3f0acc1-20260901'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_DB: vfseo_test, POSTGRES_USER: vfseo, POSTGRES_PASSWORD: vfseo-test-password }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vfseo -d vfseo_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      P05_EXACT_SOURCE: 3f0acc177d9b536eaf522276a5ffc0f957170887
      P05_BASE_MAIN: 239049548ab890d21e644051309af3df6ce1c9ed
      P05_EXACT_TREE: 27f9669d91ed9c3e2b8ed455c7d7a19431f505a2
      DATABASE_URL: postgresql://vfseo:vfseo-test-password@127.0.0.1:5432/vfseo_test
      VF_MASTER_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NODE_ENV: test
      APP_ENV: test
      VF_DATABASE_PROVIDER: sqlite
      VF_SECURE_COOKIES: 'false'
      VF_REQUIRE_HTTPS: 'false'
      VF_ADMIN_USERNAME: admin
      VF_ADMIN_PASSWORD: php-ci-portable-password-123
    steps:
      - name: Checkout exact private P05 v1.2.0 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.P05_EXACT_SOURCE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source tree version and five-file scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_EXACT_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$P05_EXACT_TREE"
          git cat-file -e "$P05_BASE_MAIN^{commit}"
          test "$(git rev-list --count "$P05_BASE_MAIN".."$P05_EXACT_SOURCE")" = 1
          test "$(git rev-list --count "$P05_EXACT_SOURCE".."$P05_BASE_MAIN")" = 0
          git diff --check "$P05_BASE_MAIN" "$P05_EXACT_SOURCE"
          git diff --name-only "$P05_BASE_MAIN" "$P05_EXACT_SOURCE" | sort > /tmp/changed
          printf '%s\n' VERSION VF_PROJECT.json docs/authority/RELEASE_V1.2.0_CANDIDATE.md package.json src/client/ProductApp.tsx | sort > /tmp/expected
          diff -u /tmp/expected /tmp/changed
          test "$(cat VERSION)" = '1.2.0'
          node - <<'NODE'
          const p=require('./package.json'), v=require('./VF_PROJECT.json');
          if(p.version!=='1.2.0'||v.version!=='1.2.0'||v.target_version!=='1.2.0'||v.working_version!=='1.2.0'||v.production_version!=='1.1.12') process.exit(1);
          NODE
          grep -F 'P05 · Product Optimization · v1.2.0' src/client/ProductApp.tsx >/dev/null
          grep -F 'OWNER_AUTHORIZED / FINAL_EXACT_SOURCE_GATE_PENDING' docs/authority/RELEASE_V1.2.0_CANDIDATE.md >/dev/null
          echo 'P05_V120_FINAL_BINDING=PASS'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: 24, cache: npm }
      - name: Install exact dependencies
        run: npm ci
      - name: Release source and engineering regression
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run release:source:gate
          npm run lint
          npm run typecheck
          npm run migrate
          npm run verify:schema
          npm run test
          npm run build
          echo 'P05_V120_FINAL_ENGINEERING=PASS'
      - name: Product truth and PHP parity
        shell: bash
        run: |
          set -Eeuo pipefail
          node --import tsx --test \
            tests/unit/product-empty-portfolio-real-site-bootstrap-truth.test.ts \
            tests/unit/demo-dataset.test.ts \
            tests/unit/product-site-load-race-truth.test.ts \
            tests/unit/product-login-workspace-read-truth.test.ts \
            tests/unit/product-portfolio-top-opportunity-routing-truth.test.ts \
            tests/unit/product-data-source-capability-truth.test.ts \
            tests/unit/product-provider-source-trust.test.ts \
            tests/unit/product-search-query-evidence-routing-truth.test.ts \
            tests/unit/product-keyword-page-drilldown-truth.test.ts \
            tests/unit/product-aeo-blocker-page-evidence-truth.test.ts \
            tests/unit/product-opportunity-subject-routing-parity.test.ts \
            tests/unit/product-overview-top-movers-query-routing-truth.test.ts \
            tests/unit/product-settings-truth.test.ts
          npm run test:php-product-parity
          MAIN_RECORD="$(find dist/client/assets -maxdepth 1 -type f -name 'index-*.js' -printf '%s %p\n' | sort -nr | head -n1)"
          test -n "$MAIN_RECORD"
          MAIN_BYTES="${MAIN_RECORD%% *}"
          test "$MAIN_BYTES" -lt 500000
          echo "P05_CLASSIC_MAIN_CHUNK_BYTES=$MAIN_BYTES"
          echo 'P05_V120_FINAL_PRODUCT_TRUTH=PASS'
      - name: Formal PHP release staging regression
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run build:php-release
          npm run php:release:gate
          echo 'P05_V120_FINAL_PHP_STAGING=PASS'
      - name: Source dependency and security gates
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run source:gate
          npm run scope:gate
          npm run dependency:gate
          npm audit --audit-level=high
          npm run security:gate
          echo 'P05_V120_FINAL_SOURCE_SECURITY=PASS'
      - name: Seal v1.2.0 exact source result
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_EXACT_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$P05_EXACT_TREE"
          test "$(cat VERSION)" = '1.2.0'
          echo 'P05_V120_FINAL_EXACT_SOURCE_GATE=PASS'
          echo "P05_EXACT_SOURCE=$P05_EXACT_SOURCE"
          echo "P05_EXACT_TREE=$P05_EXACT_TREE"
          echo 'P05_RELEASE_WRITE=0'
          echo 'P05_PRODUCTION_WRITE=0'
