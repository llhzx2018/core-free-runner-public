name: P05 V1.1.9 Candidate Authority

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      P05_BRANCH: fix/p05-install-instance-authority-v119-20260830
      P05_EXPECTED_HEAD: b56ed43e9ab8f280be3ce1eee7f0eb7e3c72acfd
    steps:
      - name: Checkout P05 candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: fix/p05-install-instance-authority-v119-20260830
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify starting source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$P05_EXPECTED_HEAD"
          test "$(cat VERSION)" = '1.1.9'
          node -e "const p=require('./package.json'); if(p.version!=='1.1.9') process.exit(1)"

      - name: Reconcile VF_PROJECT candidate truth
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('VF_PROJECT.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          data['status']='V1.1.9_RELEASE_CANDIDATE / FINAL_MACHINE_GATE_PENDING / PRODUCTION_NOT_DEPLOYED'
          data['version']='1.1.9'
          data['target_version']='1.1.9'
          data['working_version']='1.1.9'
          data['runtime_recovery_candidate']='V1.1.9_INSTALL_INSTANCE_AUTHORITY'
          data['runtime_recovery_release']='PENDING_FINAL_EXACT_SOURCE_GATE'
          data['production_runtime_acceptance']='V1.1.8_REAL_USER_FAIL_V1.1.9_NOT_DEPLOYED'
          data['working_branch']='fix/p05-install-instance-authority-v119-20260830'
          data['owner_real_use_review']='V1.1.8_REAL_FAIL_V1.1.9_REAL_ENDPOINT_NOT_PROVEN'
          data['owner_real_use_pass']='NOT_PROVEN_FOR_V1.1.9'
          data['release_authorization']='PENDING_V1.1.9_FINAL_EXACT_SOURCE_GATE'
          data['product_failure']='V1.1.8_RELEASE_ASSET_POLLUTED_BY_RUNTIME_INSTANCE_MARKER'
          data['next_action']='RUN FINAL V1.1.9 EXACT SOURCE FULL GATE; RELEASE ONLY AFTER PASS'
          data['deployment_readiness']='V1.1.9_CANDIDATE_MACHINE_GATE_PENDING'
          data['v1_1_9_install_instance_authority_fix']={
            'state':'RELEASE_CANDIDATE',
            'install_identity_authority':'WEBROOT_VF_INSTALL_INSTANCE_JSON',
            'fresh_rule':'MARKER_ABSENT_MEANS_NEW_INSTALL',
            'private_state_isolation':'INSTANCE_SCOPED',
            'legacy_in_place_compatibility':True,
            'fresh_install_database_heuristics':False,
            'root_cause':'V1.1.8_TESTS_MUTATED_FORMAL_STAGING_AND_FINAL_ZIP_INHERITED_RUNTIME_MARKER',
            'v1_1_8_package_gate_files':45,
            'v1_1_8_final_release_files':46,
            'mechanism_source':'f1ec6e25d728634c7668020e075a06996f29cce0',
            'mechanism_gate_run':33313929596,
            'mechanism_gate':'PASS',
            'formal_staging_immutable_during_tests':'PASS',
            'legacy_state_full_delete_reinstall':'PASS',
            'old_private_data_preserved_not_adopted':'PASS',
            'chrome_e2e':'PASS',
            'production_state':'NOT_DEPLOYED'
          }
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Verify exact mutation scope and values
        run: |
          set -euo pipefail
          git diff --name-only "$P05_EXPECTED_HEAD" -- | tee /tmp/changed.txt
          test "$(cat /tmp/changed.txt)" = 'VF_PROJECT.json'
          python3 - <<'PY'
          import json
          d=json.load(open('VF_PROJECT.json'))
          assert d['version']=='1.1.9'
          assert d['status'].startswith('V1.1.9_RELEASE_CANDIDATE')
          assert d['formal_release']=='v1.1.8'
          assert d['v1_1_9_install_instance_authority_fix']['mechanism_gate']=='PASS'
          assert d['production_write']==0
          PY

      - name: Commit and push candidate authority
        run: |
          set -euo pipefail
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add VF_PROJECT.json
          git commit -m 'release(P05): bind V1.1.9 candidate authority'
          git push origin HEAD:"$P05_BRANCH"

      - name: Receipt
        run: |
          echo 'P05_V119_CANDIDATE_AUTHORITY=PASS'
          echo 'CHANGED_FILES=VF_PROJECT.json'
          echo 'RELEASE_WRITE=0'
          echo 'PRODUCTION_WRITE=0'
