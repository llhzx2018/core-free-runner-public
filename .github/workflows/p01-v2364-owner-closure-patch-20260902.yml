name: P01 V2.36.4 Owner Closure Docs Patch
on:
  push:
    branches: [tmp/p01-v2364-owner-closure-patch-20260902]
    paths: [.github/workflows/p01-v2364-owner-closure-patch-20260902.yml]
permissions:
  contents: read
jobs:
  build-patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      P01_SOURCE: 0b7aa173d51ee17239716242e3e6b6f375428d2c
      P01_MAIN: 7edb03c97e036a6b1b646e9ee863e327fa8984e8
      FORMAL_SOURCE: 6b321422bce5a834521786d8233149c7624aa014
      FORMAL_TREE: 86c01bf1b5ee7c3ad3954e6ab9485734cb744d05
      RUNTIME_TREE: e1ee914a6d9e61bac7931b1f5363a8c7e24e925a
      RELEASE_ID: '380614937'
      CORE_P01_PROMOTION: 135f66c4eca08819840001f28dcd89869770085c
      CORE_REPO_HEAD: 36d700db5b63e079c2ca725544fe9f7b8e9ff024
      CORE_P01_BLOB: de1c805d55a4dbb52298ecc45625d2b7e9f43578
      OWNER_FINAL_SHA: 78e6af3e3fb189994cfe11a63bdd91889747c081ea223ded3390030bc7407271
      OWNER_PRECLOSURE_SHA: dd74207b93c45afa6e9277a49a875dc6cea01f8c0e31194d8b1e74df7c178cf0
      TERMINAL_FIX_CANDIDATE: 2f6b290c1bc86b3d961ef48d17e844cd269242db
      TERMINAL_FIX_MERGE: 0b7aa173d51ee17239716242e3e6b6f375428d2c
      TERMINAL_FIX_GATE: '33528457499'
      TERMINAL_FIX_ARTIFACT: '9808693721'
      TERMINAL_FIX_DIGEST: sha256:c487cfca3f35714a05871d68dd4e01fafb0b44e5b92c502b7b42f5552b11412e
      TERMINAL_FIX_R1: '33528294725'
      OUT: /tmp/p01-v2364-owner-closure-patch
    steps:
      - name: Checkout exact P01 develop truth
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.P01_SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01
      - name: Generate docs-only closure patch
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$OUT" && mkdir -p "$OUT/files/docs/authority" "$OUT/files/docs/handoff" "$OUT/files/docs/evidence"
          cd p01
          test "$(git rev-parse HEAD)" = "$P01_SOURCE"
          python3 - <<'PY'
          from pathlib import Path
          import copy, hashlib, json, os

          root = Path('.')
          out = Path(os.environ['OUT'])
          evidence_rel = Path('docs/evidence/P01_V2.36.4_OWNER_PRODUCTION_CLOSURE_20260902.md')

          section = '''<!-- P01_V2364_OWNER_PRODUCTION_CLOSURE -->
          ## V2.36.4 Owner Production Closure · 2026-09-02

          - Fresh Owner Readback：Current `V2.36.4` / Latest `V2.36.4` / `已是最新版本。`。
          - 更新历史：`2.36.3 → 2.36.4 / success`；完成时间 `2026-09-01 23:42:45`。
          - Last Check：`2026-09-02 00:01:38`；Footer：`VF Start · V2.36.4`；安装按钮不存在，仅保留“检查更新”。
          - Final Owner Screenshot：`1319×641`；SHA-256 `78e6af3e3fb189994cfe11a63bdd91889747c081ea223ded3390030bc7407271`。
          - Formal Release：`v2.36.4` / Release ID `380614937` / Formal Source `6b321422bce5a834521786d8233149c7624aa014` / Runtime Tree `e1ee914a6d9e61bac7931b1f5363a8c7e24e925a` / Schema `2026082901`。
          - core-updates 的 P01 Manifest 仍为严格 `V2.36.3 → V2.36.4`，P01 manifest blob `de1c805d55a4dbb52298ecc45625d2b7e9f43578` 未变；core-updates 仓库 main 已因无关 P05 工作前进到 `36d700db5b63e079c2ca725544fe9f7b8e9ff024`，不属于 P01 变更。
          - Historical Pre-Closure Screenshot：Atomic 历史已显示 `2.36.3 → 2.36.4 / success`，但旧浏览器文档仍显示 Current/Footer `V2.36.3`；SHA-256 `dd74207b93c45afa6e9277a49a875dc6cea01f8c0e31194d8b1e74df7c178cf0`。该图仅保留为真实 Terminal-State BUG 证据，已被本次 Final Owner Screenshot supersede。
          - Terminal-State BUG 已在 Product PR `#192` 修复并合并 develop `0b7aa173d51ee17239716242e3e6b6f375428d2c`；Candidate `2f6b290c1bc86b3d961ef48d17e844cd269242db`；R2 Browser Gate `33528457499` PASS / Artifact `9808693721` / Digest `sha256:c487cfca3f35714a05871d68dd4e01fafb0b44e5b92c502b7b42f5552b11412e`。R1 `33528294725` 为 Playwright executable 选择导致的 HARNESS ONLY failure。
          - 该 Terminal-State 修复当前 **DEVELOP ONLY / NOT RELEASED**；它不改变已经安装成功的 Owner Production V2.36.4，也不触发 V2.36.5。
          - Assistant direct Production write：**NO**；本次 Closure 不修改 Product `src`、Tag、Release、core-updates P01 Manifest 或 Owner Production。
          - Verdict：**PRODUCTION CLOSURE PASS**。V2.36.4 现在是 Current Owner Production Truth；后续恢复 L2 Product Optimization，按真实 Owner / Fresh Runtime 证据继续，不自动 Release。

          > 以下旧段落保留历史证据；如与本段冲突，以本段为 Current Production Authority。'''

          evidence = '''# P01 · V2.36.4 Owner Production Closure · 2026-09-02

          ## Verdict

          `PASS / OWNER PRODUCTION V2.36.4 / TERMINAL UI FINAL READBACK PASS`

          本证据记录 Owner 通过 VF Start 正式在线升级完成 `V2.36.3 → V2.36.4` 后的最终 Production Readback。Assistant 没有直接写 Owner Production。

          ## Final Owner Evidence

          ```text
          Current Version: V2.36.4
          Latest Version: V2.36.4
          Update State: 已是最新版本。
          Install Control: ABSENT
          Check Control: PRESENT
          Footer: VF Start · V2.36.4
          Last Check: 2026-09-02 00:01:38
          Update History: 2.36.3 -> 2.36.4 / success
          Update Completed At: 2026-09-01 23:42:45
          Screenshot Size: 1319 x 641
          Screenshot SHA256: 78e6af3e3fb189994cfe11a63bdd91889747c081ea223ded3390030bc7407271
          Assistant Production Write: NO
          ```

          ## Published Release Binding

          ```text
          Version: 2.36.4
          Tag: v2.36.4
          GitHub Release ID: 380614937
          Formal Source: 6b321422bce5a834521786d8233149c7624aa014
          Formal Tree: 86c01bf1b5ee7c3ad3954e6ab9485734cb744d05
          Runtime Tree: e1ee914a6d9e61bac7931b1f5363a8c7e24e925a
          Schema: 2026082901
          Migration: NONE
          UPDATE Asset: VF_Start_V2.36.4_UPDATE.zip
          UPDATE Bytes: 1237066
          UPDATE SHA256: ebb746554c95abb9f2fa77ce8ac6f41c280016c66e03f331149fd1d93370958b
          FULL Bytes: 587272
          FULL SHA256: 552e3a0dc4de3e782de27dfa71943ca69a28ee5169b4aed33a221a45704c6a24
          repair Bytes: 3592809
          repair SHA256: cdd7cefb0a4361f7e65fc2849156355e9b5a78401a862e9f74a9c64f817c44ee
          ```

          Formal Artifact R4 `33520819304`, Strict Fresh R2 `33521577888`, Composite Main Promotion `33524444884`, Publication Readback R2 `33525031995`, Remote Release Truth `33525222295` and core-updates Candidate Gate `33525506940` were already PASS in the immutable V2.36.4 release chain.

          ## core-updates Readback at Closure

          The P01 online-update contract remains exactly `V2.36.3 → V2.36.4`. The P01 manifest blob is still `de1c805d55a4dbb52298ecc45625d2b7e9f43578`, originally promoted by P01 commit `135f66c4eca08819840001f28dcd89869770085c`.

          At closure time the `core-updates` repository `main` is `36d700db5b63e079c2ca725544fe9f7b8e9ff024` only because unrelated P05 work was merged later. No P01 manifest field or byte was changed for this closure.

          ## Historical Terminal-State Regression

          The first Owner screenshot after Atomic completion already showed update history `2.36.3 → 2.36.4 / success`, but the browser document still displayed Current/Footer `V2.36.3` and Latest `V2.36.4`. That screenshot is retained as historical Pre-Closure evidence only:

          ```text
          Screenshot Size: 1319 x 641
          Screenshot SHA256: dd74207b93c45afa6e9277a49a875dc6cea01f8c0e31194d8b1e74df7c178cf0
          Classification: REAL ONLINE UPDATE TERMINAL-STATE STALE-RUNTIME BUG
          ```

          The defect was fixed after the Owner report by waiting for `update_status.current_version` to confirm the target runtime before the cache-busted automatic reload:

          ```text
          Product Candidate: 2f6b290c1bc86b3d961ef48d17e844cd269242db
          Product PR: #192
          Develop Merge: 0b7aa173d51ee17239716242e3e6b6f375428d2c
          R2 Browser Gate: 33528457499 / PASS
          Artifact: 9808693721
          Artifact Digest: sha256:c487cfca3f35714a05871d68dd4e01fafb0b44e5b92c502b7b42f5552b11412e
          R1: 33528294725 / HARNESS ONLY / Playwright executable selection
          Scope: src/assets/update-core.js only
          Schema/Migration/Version: UNCHANGED
          Release: NO
          Production Write: NO
          ```

          The R2 browser scenario deliberately returned the old runtime three times and required zero reloads during that stale period; only after the fourth probe reported V2.36.4 could the page reload. The final UI converged without manual refresh. This fix is develop-only and is not part of the already-published V2.36.4 bytes.

          ## Production Boundary

          ```text
          Owner Production Runtime: V2.36.4 / PASS
          Owner Production Schema: 2026082901
          Published Latest: V2.36.4
          Current = Latest: YES
          Terminal UI Final Readback: PASS
          Production Closure: PASS
          Assistant Production Write: NO
          Product main src mutation in closure: NO
          Tag/Release mutation in closure: NO
          core-updates P01 mutation in closure: NO
          Automatic next release: NO
          ```

          V2.36.4 Owner Production Closure is complete. Normal L2 product optimization may continue from Fresh Runtime / Owner evidence. Do not republish V2.36.4 or auto-create V2.36.5 solely for the already-merged develop-only terminal-state fix.
          '''

          def clean_block(s: str) -> str:
              lines = s.splitlines()
              nonempty = [len(x) - len(x.lstrip()) for x in lines if x.strip()]
              indent = min(nonempty) if nonempty else 0
              return '\n'.join(x[indent:] if x.strip() else '' for x in lines).strip() + '\n'

          section = clean_block(section)
          evidence = clean_block(evidence)

          for rel in [Path('docs/authority/CURRENT.md'), Path('docs/handoff/CURRENT_STATE.md')]:
              text = (root / rel).read_text(encoding='utf-8')
              first = text.find('\n')
              if first < 0:
                  raise SystemExit(f'no title newline: {rel}')
              marker = '<!-- P01_V2364_OWNER_PRODUCTION_CLOSURE -->'
              if marker in text:
                  raise SystemExit(f'marker already exists: {rel}')
              updated = text[:first+1] + '\n' + section + '\n' + text[first+1:]
              (root / rel).write_text(updated, encoding='utf-8')

          (root / evidence_rel).write_text(evidence, encoding='utf-8')

          project_path = root / 'VF_PROJECT.json'
          p = json.loads(project_path.read_text(encoding='utf-8'))
          p['status'] = 'V2.36.4 OWNER PRODUCTION / PUBLISHED / PRODUCTION CLOSURE PASS / L2 DEVELOP AHEAD'
          p['production_version'] = '2.36.4'
          p['working_version'] = '2.36.4'
          p['target_release_version'] = '2.36.4'
          p['current_phase'] = 'V2.36.4 OWNER PRODUCTION CLOSURE PASS / L2 PRODUCT OPTIMIZATION'

          pub = p['published_release']
          pub['release_state'] = 'PUBLISHED / OWNER INSTALLED / PRODUCTION CLOSURE PASS'
          pub['owner_production_runtime'] = '2.36.4'
          pub['owner_production_schema'] = '2026082901'
          pub['owner_production_upgrade'] = '2.36.3 -> 2.36.4 / SUCCESS'
          pub['owner_version_readback'] = 'Current V2.36.4 / Latest V2.36.4 / history 2.36.3 -> 2.36.4 success'
          pub['owner_browser_footer_readback'] = 'V2.36.4 / PASS'
          pub['owner_terminal_ui_last_check'] = '2026-09-02 00:01:38'
          pub['owner_terminal_ui_screenshot_sha256'] = os.environ['OWNER_FINAL_SHA']
          pub['owner_terminal_ui_screenshot_size'] = '1319x641'
          pub['owner_online_state'] = 'CURRENT=LATEST / NO UPDATE AVAILABLE'
          pub['p01_manifest_promotion_commit'] = os.environ['CORE_P01_PROMOTION']
          pub['core_updates_repository_head_at_closure'] = os.environ['CORE_REPO_HEAD']
          pub['p01_manifest_blob_at_closure'] = os.environ['CORE_P01_BLOB']
          pub['production_closure'] = 'PASS'

          p['production_release'] = copy.deepcopy(pub)

          p['authority']['current_production_evidence'] = str(evidence_rel)
          p['authority']['current_l2_develop_evidence'] = str(evidence_rel)
          p['candidate_state'] = 'CURRENT PUBLISHED BASELINE / NO NEW RELEASE CANDIDATE / DEVELOP HAS UNRELEASED TERMINAL FIX'
          p['formal_release_state'] = 'V2.36.4 PUBLISHED / OWNER PRODUCTION V2.36.4 / PRODUCTION CLOSURE PASS'
          p['develop_state'] = 'V2.36.4 BASELINE + UNRELEASED UPDATE TERMINAL RUNTIME CONFIRM FIX / PR #192 MERGED'
          p['current_authority'] = 'Owner Production V2.36.4 / Published Latest V2.36.4 / Production Closure PASS / develop ahead with unreleased terminal-state fix'
          p['next_action'] = 'Resume L2 Product Optimization from Fresh Owner/Runtime evidence; do not auto release or create V2.36.5 solely for the terminal-state fix.'
          p['current_change'] = {
              'change_id': 'P01-UPDATE-TERMINAL-RUNTIME-CONFIRM-20260902',
              'type': 'BUG FIX / ONLINE UPDATE TERMINAL STATE',
              'product_candidate': os.environ['TERMINAL_FIX_CANDIDATE'],
              'product_pr': 192,
              'develop_merge': os.environ['TERMINAL_FIX_MERGE'],
              'scope': ['src/assets/update-core.js'],
              'schema_change': False,
              'migration': None,
              'version_change': False,
              'r1_gate': int(os.environ['TERMINAL_FIX_R1']),
              'r1_classification': 'HARNESS ONLY / Playwright executable selection / no product byte change',
              'machine_gate': int(os.environ['TERMINAL_FIX_GATE']),
              'evidence_artifact': int(os.environ['TERMINAL_FIX_ARTIFACT']),
              'evidence_artifact_sha256': os.environ['TERMINAL_FIX_DIGEST'],
              'behavior': 'WAIT FOR update_status.current_version >= target before cache-busted reload',
              'stale_probe_behavior': '3 stale probes / 0 early reloads / PASS',
              'confirmed_probe_behavior': '4th probe target runtime / exactly 1 auto reload / PASS',
              'manual_refresh_required_after_fix': False,
              'release': False,
              'main_write': False,
              'production_write': False,
              'runner_main_write': False
          }
          p['l2_update_terminal_runtime_confirm'] = copy.deepcopy(p['current_change'])
          p['owner_production_activation_evidence'] = {
              'version': '2.36.4',
              'schema': '2026082901',
              'final_screenshot_sha256': os.environ['OWNER_FINAL_SHA'],
              'screenshot_size': '1319x641',
              'current': '2.36.4',
              'latest': '2.36.4',
              'footer': '2.36.4',
              'install_control': 'ABSENT',
              'check_control': 'PRESENT',
              'state': '已是最新版本。',
              'history': '2.36.3 -> 2.36.4 / success',
              'last_check': '2026-09-02 00:01:38',
              'terminal_ui_visual_closure': 'PASS',
              'preclosure_screenshot_sha256': os.environ['OWNER_PRECLOSURE_SHA'],
              'preclosure_classification': 'REAL TERMINAL-STATE STALE-RUNTIME BUG / superseded by final screenshot',
              'assistant_production_write': False
          }
          project_path.write_text(json.dumps(p, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          expected = {
              'VF_PROJECT.json',
              'docs/authority/CURRENT.md',
              'docs/handoff/CURRENT_STATE.md',
              str(evidence_rel),
          }
          for rel in expected:
              src = root / rel
              dst = out / 'files' / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              dst.write_bytes(src.read_bytes())

          manifest = {
              'status': 'P01_V2364_OWNER_CLOSURE_DOCS_PATCH_READY',
              'source': os.environ['P01_SOURCE'],
              'main_before_closure': os.environ['P01_MAIN'],
              'owner_final_screenshot_sha256': os.environ['OWNER_FINAL_SHA'],
              'files': {},
          }
          for rel in sorted(expected):
              b = (root / rel).read_bytes()
              manifest['files'][rel] = {'bytes': len(b), 'sha256': hashlib.sha256(b).hexdigest()}
          (out / 'patch-manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python3 -m json.tool VF_PROJECT.json >/dev/null
          git diff --check
          git status --short | tee "$OUT/status.txt"
          git diff --name-only | sort | tee "$OUT/changed.txt"
          cat >"$OUT/expected.txt" <<'EOF'
          VF_PROJECT.json
          docs/authority/CURRENT.md
          docs/evidence/P01_V2.36.4_OWNER_PRODUCTION_CLOSURE_20260902.md
          docs/handoff/CURRENT_STATE.md
          EOF
          diff -u "$OUT/expected.txt" "$OUT/changed.txt"
          ! git diff --name-only | grep -E '^src/'
          git diff -- VF_PROJECT.json docs/authority/CURRENT.md docs/handoff/CURRENT_STATE.md >"$OUT/diff.patch"
          git diff --no-index /dev/null docs/evidence/P01_V2.36.4_OWNER_PRODUCTION_CLOSURE_20260902.md >>"$OUT/diff.patch" || true
          printf 'P01_V2364_OWNER_CLOSURE_DOCS_PATCH=PASS\nSOURCE=%s\nDOCS_ONLY=YES\nOWNER_PRODUCTION_WRITE=NO\nRUNNER_MAIN_WRITE=NO\n' "$P01_SOURCE" | tee "$OUT/verdict.txt"
      - name: Upload exact docs patch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2364-owner-closure-docs-${{ github.run_id }}
          path: /tmp/p01-v2364-owner-closure-patch
          if-no-files-found: error
          retention-days: 90
