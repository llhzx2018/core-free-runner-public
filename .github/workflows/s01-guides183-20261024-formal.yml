name: S01 Theme exact formal release
on:
  push:
    branches: [task/s01-guides183-20261024]
    paths: ['.github/workflows/s01-guides183-20261024-formal.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.183
  TARGET_SHA: ba2d556e5f6eccd9c6a01d0b6d36d562f3014e3c
  TARGET_TREE: 4445019af960a3a6a1d3fe646df349fae1156c79
  BASE_SHA: f1535ec95e2f4d661a3650628bae0b35b0b1c517
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: ba2d556e5f6eccd9c6a01d0b6d36d562f3014e3c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact candidate, merged tree and required evidence readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider candidate-proof
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40084455611 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40084455611 --jq .head_sha)" = 1b52eb3debcb50270316424ff201ebf170508ee5
          test "$(gh api repos/$TARGET_REPO/commits/main --jq .sha)" = "$TARGET_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$TARGET_SHA --jq .tree.sha)" = "$TARGET_TREE"
          gh run download 40084455611 --repo llhzx2018/core-free-runner-public --name s01-home-40084455611 --dir candidate-proof
          cmp candidate-proof/state-before.sha256 candidate-proof/state-after.sha256
          cmp candidate-proof/contracts-before.json candidate-proof/contracts-after.json
          python3 control/lanes/s01-guides183-20261024/package.py
          python3 - <<'PYVERIFY'
          import json,pathlib
          r=pathlib.Path('candidate-proof')
          old=json.loads((r/'package.json').read_text());new=json.loads(pathlib.Path('proof/package.json').read_text())
          assert old['source']=='1fdb2e1933dc5f378197af36747712306ba8f0b0'
          phases={phase:json.loads((r/(phase+'-guides-summary.json')).read_text()) for phase in ['before','upgrade','rollback','after']}
          for phase,result in phases.items():
              assert result['status']=='PASS' and result['errors']==result['write_requests']==[]
              assert len(result['rows'])==(8 if phase in ['before','after'] else 1)
              assert all(row['status']=='PASS' for row in result['rows'])
          for lang in ['en','zh']:
              for width in [1440,1312,1280,1024]:
                  before=json.loads((r/('before-guides-'+lang+'-'+str(width)+'.json')).read_text())
                  after=json.loads((r/('after-guides-'+lang+'-'+str(width)+'.json')).read_text())
                  assert not after['overflow'] and after['version']=='1.35.183'
                  for key in ['h1','canonical','hreflang','shell','heroDescription']:assert before[key]==after[key]
                  assert len(after['h1'])==len(after['canonical'])==1
                  assert [(x['href'],x['title'],x['copy']) for x in before['cards']]==[(x['href'],x['title'],x['copy']) for x in after['cards']]
                  assert all(c['box']['paddingLeft']==c['box']['paddingTop']==26 for c in after['cards'])
                  assert not after['duplicateHead'] and after['cta'] is None and not after['heroActions']
                  assert after['input']['borderTop']+after['input']['borderBottom']==0
                  for phase in ['before','after']:assert (r/(phase+'-guides-'+lang+'-'+str(width)+'.png')).stat().st_size>1000
          assert len(phases['after']['interactions'])==4
          assert json.loads((r/'clean-install.json').read_text())['status']=='PASS'
          for k in ['status','version','tree','sha256','bytes','files']:assert old[k]==new[k],k
          assert new['sha256']=='a219ab710ff1f80d4dd521a37d4a021c6475e6342d44997e7995a70350577cdb' and new['bytes']==1986425
          coverage=json.loads(pathlib.Path('control/lanes/s01-guides183-20261024/release-authority.json').read_text())
          assert set(coverage['required'])=={'TESTING','GIT','UA_UI','SEO','SECURITY','INSTALL','UPGRADE','DATA_SCHEMA'}
          assert coverage['source']=='1fdb2e1933dc5f378197af36747712306ba8f0b0' and coverage['tree']=='4445019af960a3a6a1d3fe646df349fae1156c79'
          assert coverage['owner_preview']=='POST_RELEASE_REQUIRED_MODE_D'
          for item in coverage['required'].values():
              assert item['sha'] and item['acceptance']
              item['evidence_status']='PASS_EXACT_CANDIDATE_MACHINE'
          coverage['candidate_run']='40084455611'
          coverage['merged_source']='ba2d556e5f6eccd9c6a01d0b6d36d562f3014e3c'
          coverage['formal_release_gate']='PASS'
          coverage['production_effect']='NOT_PROVEN_POST_MANUAL_UPGRADE_READBACK_REQUIRED'
          pathlib.Path('proof/public-authority-coverage.json').write_text(json.dumps(coverage,ensure_ascii=False,indent=2))
          print('MERGED_TREE_EQUALS_TESTED_TREE_AND_EXACT_PACKAGE_PASS')
          PYVERIFY
      - name: Publish only the exact verified package
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.35.183 --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create v1.35.183 provider/vf-tools-theme_V1.35.183.zip --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Theme V1.35.183' --notes '指南目录按已展示的 web.dev 参考原型落地：单一介绍区、搜索与任务分类优先、桌面三列文章卡片与1024两列。去掉默认重复介绍和默认工具推广，保留独立编辑的模块标题、描述和CTA。文章标题、摘要、真实链接、已填写元数据、搜索、分页与保存数据不改；不使用示例文案替代正式内容，不为未填封面显示共享社交图。长标题摘要完整展示，阅读入口靠近内容，原生GET有可见搜索按钮。中英文四档桌面及真实搜索、第二页、无JS GET、键盘、自定义文案和相邻页面定向验证；精确新包清洁安装、升级、回退与重复安装数据保护通过。476运行文件，M3U8保持1.25.94，Ops不改。Production由OWNER手工升级后最终验收，手机实机暂缓。' --latest
          fi
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/v1.35.183 --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh release view v1.35.183 --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - name: Authenticated remote ZIP byte comparison
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download v1.35.183 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.183.zip --dir remote
          cmp provider/vf-tools-theme_V1.35.183.zip remote/vf-tools-theme_V1.35.183.zip
          echo 'a219ab710ff1f80d4dd521a37d4a021c6475e6342d44997e7995a70350577cdb  remote/vf-tools-theme_V1.35.183.zip' | sha256sum -c
          test "$(stat -c %s remote/vf-tools-theme_V1.35.183.zip)" = 1986425
          gh release view v1.35.183 --repo "$TARGET_REPO" --json url,publishedAt,tagName > proof/formal-release.json
          echo FORMAL_RELEASE_EXACT_REMOTE_ASSET_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-home-formal-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target provider remote candidate-proof
