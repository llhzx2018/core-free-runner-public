name: P07 Release7 Menu Distribution Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'installers/p07.sh'
      - 'installers/p07-final.sh'
      - 'installers/p07-toolbox.sh'
      - 'dist/p07/0.1.0/overlay/**'
      - '.github/workflows/p07-release7-menu-distribution-gate.yml'

permissions:
  contents: read

jobs:
  distribution-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Release7 identity
        run: |
          set -Eeuo pipefail
          test "$(cat dist/p07/0.1.0/overlay/BUILD_ID)" = '0.1.0-release7'
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release7"' installers/p07-toolbox.sh
          grep -Fq 'EXPECTED_BUILD_ID="0.1.0-release7"' installers/p07-final.sh
          grep -Fq 'RUNTIME_MANIFEST_BLOB="43469d018a72f4e24ea3fd644ac7af5970a06c74"' installers/p07-final.sh
          grep -Fq 'EXPECTED_BLOB="a3ffbdfb35ed201411bfa9463c8fea6e26702582"' installers/p07.sh

      - name: Verify runtime manifest
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('dist/p07/0.1.0/overlay')
          def blob(path):
              data=path.read_bytes()
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          for line in (root/'RUNTIME.gitblob').read_text().splitlines():
              if not line.strip():
                  continue
              h,p=line.split('  ',1)
              path=root/p
              assert path.is_file(), p
              assert blob(path)==h, (p,blob(path),h)
          PY

      - name: Seven-route visible-feedback contract
        run: |
          set -Eeuo pipefail
          python3 dist/p07/0.1.0/overlay/tests/test_main_menu_routes.py
          grep -Fq '没有发现已验证、可恢复的 P07 本地备份。' dist/p07/0.1.0/overlay/bin/vfops-site-ui
          grep -Fq '请先使用“备份网站”创建并验证一个备份。' dist/p07/0.1.0/overlay/bin/vfops-site-ui
          grep -Fq '功能没有正常完成：' dist/p07/0.1.0/overlay/bin/vfops-user
          grep -Fq '主菜单仍可继续使用' dist/p07/0.1.0/overlay/bin/vfops-user

      - name: Lazy installer and isolated upgrade
        run: |
          set -Eeuo pipefail
          ! grep -Fq 'guided-init' installers/p07-final.sh
          ! grep -Eq 'apt-get install.*(rclone|openssh-client|rsync)' installers/p07-final.sh
          root="$PWD"
          tmp="$(mktemp -d)"
          export P07_PUBLIC_ROOT="file://$root"
          export P07_INSTALL_DIR="$tmp/install"
          export P07_PREVIOUS_DIR="$tmp/previous"
          export P07_BIN_LINK="$tmp/vfops"
          export P07_ALLOW_NONROOT=1
          export P07_NO_EXEC=1
          bash installers/p07-final.sh >"$tmp/install.log"
          test "$("$tmp/vfops" --version)" = 'VF Server Ops 0.1.0'
          test "$("$tmp/vfops" --build-id)" = '0.1.0-release7'
          bash installers/p07-final.sh >"$tmp/second.log"
          grep -Fq '已是当前版本，无需下载或重复安装' "$tmp/second.log"

      - name: Syntax and safety boundary
        run: |
          set -Eeuo pipefail
          bash -n installers/p07.sh
          bash -n installers/p07-final.sh
          bash -n installers/p07-toolbox.sh
          echo 'P07_RELEASE7_MENU_DISTRIBUTION_GATE=PASS'
          echo 'P07_PRODUCTION_WRITE=NOT_RUN'
          echo 'P07_DNS_WRITE=NOT_RUN'
          echo 'P07_SOURCE_DELETE=NOT_RUN'
