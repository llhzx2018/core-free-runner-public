name: P08 isolated Owner browser entry proof (one-off)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p08-owner-browser-entry-oneoff.yml'

permissions:
  contents: read

jobs:
  p08-owner-browser:
    if: github.repository == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact P08 candidate transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-lander
          ref: 7d723081bbf7a12a45611a1684a070e80e43f7ea
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: p08-private-source
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mbstring, dom, xml, curl, pdo_sqlite, sqlite3, fileinfo
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated static delivery checks
        shell: bash
        run: |
          if ! command -v nginx >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nginx
          fi
      - name: Run exact-source synthetic browser and delivery checks
        shell: bash
        working-directory: p08-private-source
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '7d723081bbf7a12a45611a1684a070e80e43f7ea'
          test "$(cat VERSION)" = '0.1.0-dev'
          bash -n backend/tests/browser/run-owner-ui.sh
          log="$(mktemp -p "$RUNNER_TEMP" p08-browser.XXXXXXXX)"
          trap 'rm -f -- "$log"' EXIT
          result=0
          bash backend/tests/browser/run-owner-ui.sh --ci-delivery >"$log" 2>&1 || result=$?
          grep -E '^(P08_BROWSER_SOURCE=[0-9a-f]{40}|P08_BROWSER_STAGE=(dependencies|fixture|http|chromium|delivery)|EXISTING_OWNER_REINSTALL_GUARD_(PASS|FAILED)|BROWSER_E2E_(PASS|FAILED)( |$)|RESTORED_DATABASE_READBACK_PASS|ISOLATED_DATABASE_STATIC_BACKUP_RESTORE_AND_CORRUPTION_RECOVERY_PASS|NGINX_STATIC_DELIVERY_AND_PRIVATE_PATH_ISOLATION_PASS)' "$log" | cut -d ' ' -f 1 || true
          exit "$result"
      - name: Erase transient private checkout
        if: always()
        shell: bash
        run: rm -rf -- "$GITHUB_WORKSPACE/p08-private-source"
