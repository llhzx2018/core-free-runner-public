name: P01 V2.47.417 Distribution Preflight (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v247417-distribution-preflight-20261022.yml'
permissions:
  contents: read
jobs:
  exact-channel-proof:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Read exact distribution PR without merging
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone -q --depth 1 --branch dist/p01-v247417-await-owner416-20261022 "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/core-updates.git" proposed
          test "$(git -C proposed rev-parse HEAD)" = 54be0e1ef85a1a13fb846d38d0ca3ee0cb4909e4
          git clone -q --depth 1 --branch main "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/core-updates.git" live
          jq -e '.project_id=="P01" and .update_type=="ATOMIC" and .target_version=="2.47.416" and (.from_versions==["2.47.415"])' live/projects/P01.json >/dev/null
          jq -e '.project_id=="P01" and .update_type=="ATOMIC" and .target_version=="2.47.417" and (.from_versions==["2.47.416"]) and .product_identity=="6053762435b701f7431be18d0479fac459a8d96a" and .release_id==420254693 and .asset_name=="VF_Start_V2.47.417_UPDATE.zip" and .asset_bytes==2684799 and .asset_sha256=="624d0aa1e645e012fcf313b397a1f1c57705c5bd82286443e81334db1b6c89df"' proposed/projects/P01.json >/dev/null
          echo P01_CHANNEL_COMPATIBILITY_CHAIN=PASS
      - name: Verify Update Core source and manifest contract
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-mbstring php-sqlite3 >/dev/null
          cd proposed
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/update-core-lint.log
          php update-core/php/tests/run.php
          echo P01_UPDATE_CORE_NATIVE_CONTRACT=PASS
      - name: Verify private release identity without changing channel
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          gh api repos/llhzx2018/vf-start/releases/tags/v2.47.417 --jq '.id' | grep -Fx 420254693
          gh api repos/llhzx2018/vf-start/releases/tags/v2.47.417 --jq '.assets[] | select(.name=="VF_Start_V2.47.417_UPDATE.zip") | "\(.size) \(.digest)"' | grep -Fx '2684799 sha256:624d0aa1e645e012fcf313b397a1f1c57705c5bd82286443e81334db1b6c89df'
          echo P01_STAGED_DISTRIBUTION_PREFLIGHT=PASS
