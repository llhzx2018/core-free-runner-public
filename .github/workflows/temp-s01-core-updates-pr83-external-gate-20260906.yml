name: S01 core-updates PR83 External Exact-Head Gate

on:
  push:
    branches: [temp/s01-core-updates-pr83-external-gate-20260906]
    paths:
      - '.github/workflows/temp-s01-core-updates-pr83-external-gate-20260906.yml'

permissions:
  contents: read

jobs:
  exact-head-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      BASE_SHA: 669a45e9f96aa0f70e5e281e268aed0b9518b55a
      PR_HEAD_SHA: 57556d7c40a33c4e9d91fc2f43034c6fb532d8dd
    steps:
      - name: Credential and write-boundary gate
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo 'PRIVATE_READ_CREDENTIAL=VF_PRIVATE_READ_TOKEN'
          echo 'WRITE_USED=NO'

      - name: Checkout exact core-updates PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.PR_HEAD_SHA }}
          token: ${{ env.READ_TOKEN }}
          path: core-updates
          fetch-depth: 0
          persist-credentials: false

      - name: Exact source and three-file scope gate
        working-directory: core-updates
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          mapfile -t files < <(git diff --name-only "$BASE_SHA...$PR_HEAD_SHA" | sort)
          printf '%s\n' "${files[@]}"
          test "${#files[@]}" -eq 3
          test "${files[0]}" = 'projects/S01-C01.json'
          test "${files[1]}" = 'projects/S01-C02.json'
          test "${files[2]}" = 'projects/S01-C03.json'
          echo 'PR_SCOPE_EXACT_3_MANIFESTS=PASS'

      - name: Current repository manifest contract audit
        working-directory: core-updates
        run: |
          set -Eeuo pipefail
          python3 scripts/check_manifest_contract.py
          echo 'MANIFEST_CONTRACT_AUDIT=PASS'

      - name: Current Update Core V1 PHP syntax and regression
        working-directory: core-updates
        run: |
          set -Eeuo pipefail
          find update-core/php/src update-core/php/tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          echo 'UPDATE_CORE_V1_CURRENT_LAYOUT=PASS'

      - name: Exact S01 manifest authority assertions
        working-directory: core-updates
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected={
            'S01-C01':{'target_version':'1.35.11','release_tag':'v1.35.11','asset_name':'vf-tools-theme_V1.35.11.zip','asset_bytes':1796071,'asset_sha256':'b2107ba0dfa13720fe40164d2943fa3016d82e4f162bc4d7f8c31df55c9b61ef','runtime_files':442,'runtime_fingerprint':'0c041e0e920f40c3b0c070b33ea7f600aa983a74a6097398be3311577e697e8f','from_versions':['1.35.8','1.35.9','1.35.10'],'repository':'llhzx2018/vf-tools-theme'},
            'S01-C02':{'target_version':'1.21.850','release_tag':'v1.21.850','asset_name':'vf-tools-ops_V1.21.850.zip','asset_bytes':3334143,'asset_sha256':'1556eae3698412831bb9c81fe8729160ad5a3dcb1a9ca979b76add98cc58dfb0','runtime_files':933,'runtime_fingerprint':'58bc6003dbf642a5978649b52f2d9eb5493907508349c43bb89ab27abfb5e410','from_versions':['1.21.849'],'repository':'llhzx2018/vf-tools-ops','physical_locator':'vf-ops/vf-ops.php'},
            'S01-C03':{'target_version':'1.25.21','release_tag':'v1.25.21','asset_name':'vf-tools-m3u8_V1.25.21.zip','asset_bytes':3573646,'asset_sha256':'6a34f9997dafd9be4ee1a87a8ed57f623318b53c294fd7274503cbe3980dd29c','runtime_files':557,'runtime_fingerprint':'5cf274f3f69fc2bd9b244d8a8096d34792f16107b162000e838c70a09e98abc4','from_versions':['1.25.20'],'repository':'llhzx2018/vf-tools-m3u8','physical_locator':'vf-tool-m3u8/vf-tool-m3u8.php'}
          }
          for cid,e in expected.items():
              d=json.loads((Path('projects')/(cid+'.json')).read_text())
              assert d['component_id']==cid and d['schema_version']=='wp-component-1.0'
              assert d['runtime_contract']=='VF_WP_COMPONENT_RUNTIME_AUTHORITY_V1' and d['enabled'] is True
              for k,v in e.items(): assert d[k]==v,(cid,k,d.get(k),v)
              if cid!='S01-C01':
                  assert d['locator_cutover'] is False
                  assert d['runtime_file_count']==d['runtime_files']
                  assert d['runtime_fingerprint_sha256']==d['runtime_fingerprint']
          print('S01_MANIFEST_AUTHORITY=PASS')
          PY

      - name: Remote Release and asset metadata readback
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          token=os.environ['READ_TOKEN']
          rows=[
            ('llhzx2018/vf-tools-theme','v1.35.11','vf-tools-theme_V1.35.11.zip',1796071,'sha256:b2107ba0dfa13720fe40164d2943fa3016d82e4f162bc4d7f8c31df55c9b61ef'),
            ('llhzx2018/vf-tools-ops','v1.21.850','vf-tools-ops_V1.21.850.zip',3334143,'sha256:1556eae3698412831bb9c81fe8729160ad5a3dcb1a9ca979b76add98cc58dfb0'),
            ('llhzx2018/vf-tools-m3u8','v1.25.21','vf-tools-m3u8_V1.25.21.zip',3573646,'sha256:6a34f9997dafd9be4ee1a87a8ed57f623318b53c294fd7274503cbe3980dd29c')]
          for repo,tag,name,size,digest in rows:
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/releases/tags/{tag}',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req) as r: d=json.load(r)
              assert d['tag_name']==tag and d['draft'] is False and d['prerelease'] is False
              a=[x for x in d['assets'] if x['name']==name]
              assert len(a)==1 and a[0]['size']==size and a[0].get('digest')==digest,(repo,a)
              print(repo,tag,a[0]['id'],size,digest)
          print('REMOTE_RELEASE_ASSET_METADATA=PASS')
          PY

      - name: Final external gate verdict
        run: |
          echo 'CORE_UPDATES_PR83_EXTERNAL_EXACT_HEAD_GATE=PASS'
          echo 'CORE_UPDATES_NATIVE_WORKFLOW_LAYOUT_STALE=YES'
          echo 'PRODUCTION_WRITE=NO'
