name: P02 Manifest Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p02-manifest-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout public shell
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Require private read token
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_TOKEN" || exit 78

      - name: Checkout exact private candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: 1657c1ba951ca4513f9f05554a15b758feed323b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p02
          fetch-depth: 1
          persist-credentials: false

      - name: Print only bytes and SHA-256
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in public/index.php public/assets/update-core-ui.js; do
            test -f "p02/$f"
            printf '%s bytes=' "$f"
            stat -c '%s' "p02/$f"
            printf '%s sha256=' "$f"
            sha256sum "p02/$f" | awk '{print $1}'
          done

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf p02
