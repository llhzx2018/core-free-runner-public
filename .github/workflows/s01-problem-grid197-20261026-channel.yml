name: S01 exact Theme channel contract
on:
  push:
    branches: [task/s01-problem-grid197-channel-20261026]
    paths: ['.github/workflows/s01-problem-grid197-20261026-channel.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.197
  TARGET_SHA: af4b8b0b4b76285d2f402a570b2bb460ba6829ad
  UPDATE_SHA: e384293cba37dd5876adef18fbe6cbf00ed31442
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: e384293cba37dd5876adef18fbe6cbf00ed31442
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: source
      - name: Channel identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-problem-grid197-20261026/channel-spec.json --input control/.github/workflows/s01-problem-grid197-20261026-channel.yml
      - name: Exact changed manifest and native protocol tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          test "$(git -C source diff --name-only 400f6b414100aa689c204eebf389b996896d20de e384293cba37dd5876adef18fbe6cbf00ed31442)" = projects/S01-C01.json
          git -C source diff --exit-code 400f6b414100aa689c204eebf389b996896d20de e384293cba37dd5876adef18fbe6cbf00ed31442 -- projects/S01-C03.json
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PYCHANNEL'
          import json,os
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']==os.environ['TARGET_VERSION']
          assert m['asset_sha256']=='b127c50604dc106213e5e7cf4e43e8341338458ee60d39cb4aed9fcad3d050e8' and m['asset_bytes']==2001579
          assert m['runtime_files']==476 and '1.35.196' in m['from_versions']
          assert m['release_tag']=='v'+os.environ['TARGET_VERSION']
          print('EXACT_CHANNEL_CONTRACT_PASS')
          PYCHANNEL
      - name: Cleanup
        if: always()
        run: rm -rf source
