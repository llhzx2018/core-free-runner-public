name: P03 V1.35.3 Production Discovery Readonly Probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p03-v1353-production-discovery-readonly-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read-only production public identity and auth boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='https://forge.kewaro.com'
          ROOT_CODE=$(curl -sS -L -o /tmp/root.html -D /tmp/root.headers -w '%{http_code}' "$BASE/")
          echo "ROOT_HTTP=$ROOT_CODE"
          test "$ROOT_CODE" = '200'
          if grep -Eqi '1\.35\.2|V1\.35\.2' /tmp/root.html; then
            echo 'PRODUCTION_PUBLIC_VERSION_MARKER=1.35.2_PASS'
          else
            echo 'PRODUCTION_PUBLIC_VERSION_MARKER=NOT_EXPOSED'
          fi
          SYS_CODE=$(curl -sS -o /tmp/system-update.json -w '%{http_code}' "$BASE/api.php?action=system_update")
          CHECK_CODE=$(curl -sS -X POST -H "Origin: $BASE" -o /tmp/system-update-check.json -w '%{http_code}' "$BASE/api.php?action=system_update_check")
          echo "ANON_SYSTEM_UPDATE_HTTP=$SYS_CODE"
          echo "ANON_SYSTEM_UPDATE_CHECK_HTTP=$CHECK_CODE"
          test "$SYS_CODE" = '401'
          test "$CHECK_CODE" = '401'
          if grep -Eqi '管理员|登录|admin|login|unauth' /tmp/system-update.json /tmp/system-update-check.json; then
            echo 'PRODUCTION_UPDATE_AUTH_BOUNDARY=PASS'
          else
            echo 'PRODUCTION_UPDATE_AUTH_BOUNDARY=HTTP_401_PASS'
          fi
          echo 'PRODUCTION_WRITE=0'
          echo 'SYSTEM_UPDATE_PREPARE_CALLED=NO'
          echo 'PRODUCTION_UPGRADE_CALLED=NO'
