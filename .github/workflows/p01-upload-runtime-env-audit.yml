name: P01 Upload Runtime Env Audit

on:
  push:
    branches:
      - vf-agent-operations-v1
    paths:
      - '.github/workflows/p01-upload-runtime-env-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Show upload runtime limits
        shell: bash
        run: |
          set -euo pipefail
          php -r 'echo "SAPI=".PHP_SAPI."\nUPLOAD_MAX=".ini_get("upload_max_filesize")."\nPOST_MAX=".ini_get("post_max_size")."\nUSER_INI=".ini_get("user_ini.filename")."\n";'
