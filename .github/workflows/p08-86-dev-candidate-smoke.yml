name: P08 v014 exact DEV candidate no release package source smoke
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p08-86-dev-candidate-smoke.yml
      - scripts/p08_86_exact_candidate_smoke.sh
permissions:
  contents: read
jobs:
  source-and-code-only-package:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-86-v014-dev-source-20261120' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      P08_ISOLATED_INSTALL_TEST: 'YES'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout temporary Public Runner only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout pinned P08 v0.1.14 development candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: deee2750aed1a8944d07c05a6efb03d6bf5e7eee
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p08
      - name: Checkout current canonical GOV-DOC
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov
      - name: PHP 8.4 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: pdo_mysql,pdo_sqlite,sqlite3,zip,curl,mbstring,openssl,posix,dom,intl,bcmath,fileinfo
          coverage: none
      - name: Node22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install disposable native source-check utilities
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 420 sudo apt-get -qq update
          timeout 420 sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y sqlite3 mariadb-client
      - name: Exact pinned development check and FULL/UPDATE byte manifests
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          test "$(id -u)" -ne 0
          test "$(git -C p08 rev-parse HEAD)" = deee2750aed1a8944d07c05a6efb03d6bf5e7eee
          bash scripts/p08_86_exact_candidate_smoke.sh
      - name: Erase temporary private source and developer-only package bytes
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- p08 gov "$RUNNER_TEMP/p08-86-exact-source"
          test ! -e p08 && test ! -e gov
          test ! -e "$RUNNER_TEMP/p08-86-exact-source"
          echo "P08_86_PRIVATE_CLEANUP=PASS"
