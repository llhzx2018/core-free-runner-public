name: TEMP public locked Playwright browser input
on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/p08-public-browser-input-once.yml
permissions:
  contents: read
jobs:
  browser:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.actor == 'llhzx2018' &&
      github.triggering_actor == 'llhzx2018' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/p08-locked-public-browser-input-20261128'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Exact public Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
      - name: Official locked browser download and actual smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(node --version)" = v24.22.3
          work="$RUNNER_TEMP/vf-public-browser-$GITHUB_RUN_ID"
          test ! -e "$work"
          mkdir -m 700 "$work" "$work/home" "$work/browser" "$work/input" "$work/output"
          export HOME="$work/home" PLAYWRIGHT_BROWSERS_PATH="$work/browser" PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT=120000
          unset NODE_TLS_REJECT_UNAUTHORIZED NODE_EXTRA_CA_CERTS PLAYWRIGHT_DOWNLOAD_HOST PLAYWRIGHT_CHROMIUM_DOWNLOAD_HOST
          curl --proto '=https' --proto-redir '=https' --fail --silent --show-error --location --connect-timeout 45 --max-time 180 https://registry.npmjs.org/playwright-core/-/playwright-core-1.65.1.tgz -o "$work/input/core.tgz"
          python3 -B - "$work" <<'PY'
          import base64,hashlib,tarfile,sys,json
          from pathlib import Path
          root=Path(sys.argv[1]); archive=root/"input/core.tgz"
          assert base64.b64encode(hashlib.sha512(archive.read_bytes()).digest()).decode()=="hqPpz7blSMPxWVdoeE1yiBSzXsKiVOd2k+kjCvmUywD2GPO2Dd9HfcWnq9NN0GHbNZDFgZ9JfBFr+X5/BLo0qw=="
          with tarfile.open(archive) as tar: tar.extractall(root/"input",filter="data")
          p=json.loads((root/"input/package/package.json").read_text())
          assert p["name"]=="playwright-core" and p["version"]=="1.65.1"
          PY
          node "$work/input/package/cli.js" install chromium
          node - "$work/input/package" <<'JS'
          const {chromium}=require(process.argv[2]);
          (async()=>{const browser=await chromium.launch({headless:true});try{const page=await browser.newPage();await page.goto("data:text/html,<h1>public browser smoke</h1>");if(await page.locator("h1").textContent()!=="public browser smoke")throw Error("smoke");console.log("PUBLIC_LOCKED_BROWSER_SMOKE=PASS;VERSION="+browser.version());}finally{await browser.close();}})().catch(e=>{console.error(e.name);process.exit(1)});
          JS
          python3 -B - "$work" <<'PY'
          import json,hashlib,tarfile,re,stat,sys
          from pathlib import Path
          root=Path(sys.argv[1]); cache=root/"browser"
          descriptors=json.loads((root/"input/package/browsers.json").read_text())
          expected={x["name"].replace("-","_")+"-"+x["revision"] for x in descriptors["browsers"] if x["name"] in {"chromium","chromium-headless-shell","ffmpeg"}}
          paths=[x for x in cache.iterdir() if x.name!=".links"]
          assert len(expected)==3 and {x.name for x in paths}==expected and all(x.is_dir() and not x.is_symlink() for x in paths)
          archive=root/"output/browser-input.tar.gz"
          with tarfile.open(archive,"w:gz") as out:
              for path in sorted(paths): out.add(path,arcname=path.name,recursive=True)
          with tarfile.open(archive) as z:
              for m in z:
                  assert not m.isdev() and not m.isfifo() and (m.isfile() or m.isdir() or m.issym() or m.islnk())
                  assert not m.name.startswith("/") and ".." not in Path(m.name).parts
                  if m.issym() or m.islnk(): assert not m.linkname.startswith("/")
          with archive.open("rb") as f: digest=hashlib.file_digest(f,"sha256").hexdigest()
          receipt={"schema":1,"playwright_core":"1.65.1","node":"24.22.3","platform":"ubuntu-24.04-linux-x64","browsers":sorted(expected),"descriptors_sha256":hashlib.sha256((root/"input/package/browsers.json").read_bytes()).hexdigest(),"archive_sha256":digest,"archive_bytes":archive.stat().st_size,"scope":"PUBLIC_UPSTREAM_BROWSER_INPUT_ONLY","run_id":__import__("os").environ["GITHUB_RUN_ID"]}
          (root/"output/browser-receipt.json").write_text(json.dumps(receipt,sort_keys=True))
          print("PUBLIC_LOCKED_BROWSER_INPUT="+json.dumps(receipt,sort_keys=True))
          PY
      - name: Retain only public upstream browser input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-locked-playwright-1.65.1-${{ github.run_id }}
          path: ${{ runner.temp }}/vf-public-browser-${{ github.run_id }}/output/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Always remove temporary public dependency
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          path="$RUNNER_TEMP/vf-public-browser-$GITHUB_RUN_ID"
          test ! -L "$path"
          if test -e "$path"; then
            test -d "$path"
            test "$(stat -c %u "$path")" = "$(id -u)"
            rm -rf -- "$path"
          fi
          test ! -e "$path"
          echo PUBLIC_BROWSER_INPUT_CLEANUP=PASS
