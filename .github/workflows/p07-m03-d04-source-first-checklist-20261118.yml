name: P07 M03 D04 source-first receiver initialization checklist exact proof
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p07-m03-d04-source-first-checklist-20261118.yml']
permissions:
  contents: read
jobs:
  source-first:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      NO_COLOR: '1'
      P07_EXACT_SOURCE: '3a56b28aeb7a21b5ca46db08563882a5582cf1b3'
      P07_BASE: '9a01112539c8b3192a0f0d2bb8d2eefbc75a8b95'
    steps:
      - name: Checkout registered public runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Transient private exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 3a56b28aeb7a21b5ca46db08563882a5582cf1b3
          fetch-depth: 0
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: .p07-private
      - name: Current GOV-DOC architecture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: .gov-current
      - name: Exact Git diff architecture and seven-scenario terminal UX gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-private rev-parse HEAD)" = "$P07_EXACT_SOURCE"
          git -C .p07-private cat-file -e "$P07_BASE^{commit}"
          python3 -B .p07-private/.github/checks/architecture_gate.py \
            --manifest .p07-private/.github/checks/code_architecture.json \
            --gov-root .gov-current --git-root .p07-private \
            --base-sha "$P07_BASE" --head-sha "$P07_EXACT_SOURCE"
          (cd .p07-private && python3 -B scripts/check_p07_terminal_ux.py --base-ref "$P07_BASE")
          (cd .p07-private && python3 -B scripts/check_p07_modules.py)
          (cd .p07-private && python3 -B -m unittest discover -s tests -p 'test_p07_terminal_ux_contract.py' -q)
          echo P07_D04_SOURCE_FIRST_ARCHITECTURE_NAMING_UX7=PASS
      - name: Readonly source-first and target-initialization gate, SQL mismatch and cancellation
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n .p07-private/bin/vfops-migrate-ui
          bash -n .p07-private/components/p07-m03-migration-readiness.sh
          python3 -B -m py_compile .p07-private/bin/vfops_migration_readiness.py .p07-private/lib/migration_preparation_checklist.py
          (cd .p07-private && python3 -B tests/test_p07_m03_d04_preparation_checklist.py -v)
          (cd .p07-private && python3 -B tests/test_p07_dynamic_preflight.py -q)
          (cd .p07-private && python3 -B tests/test_p07_m03_d04_release_scope.py -q)
          (cd .p07-private && python3 -B tests/test_p07_m03_d04_prepared_online_ui.py -q)
          (cd .p07-private && python3 -B tests/test_p07_m03_d04_whole_vps_online_ui.py -q)
          echo P07_D04_SOURCE_FIRST_M03_TESTS=PASS
          echo P07_D04_REAL_OLD_VPS_CP2_DB_DNS_PRODUCTION_WRITES=NONE
      - name: Remove all private checkout
        if: always()
        shell: bash
        run: |
          rm -rf -- .p07-private .gov-current
          echo P07_D04_SOURCE_FIRST_PUBLIC_RUNNER_SANITIZED=PASS
