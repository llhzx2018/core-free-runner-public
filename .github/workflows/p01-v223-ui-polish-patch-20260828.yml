name: P01 V2.23 Unified Surface UI Polish Patch

on:
  push:
    branches:
      - task/p01-v222-multi-surface-gate-20260828
    paths:
      - '.github/workflows/p01-v223-ui-polish-patch-20260828.yml'

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Patch exact P01 feature branch
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf product
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/vf-start.git" product
          git -C product checkout -q feature/p01-unified-surface-ui-v223-20260828
          python3 - <<'PY'
          from pathlib import Path
          p=Path('product/src/surfaces.php')
          s=p.read_text(encoding='utf-8')
          old="""$watchWant = array_values(array_filter($watch, static fn(array $x): bool => (string)($x['media_status'] ?? '') === 'want'));
          if (!$watchWant) $watchWant = $watch;
          $watchWant = array_slice($watchWant, 0, 4);"""
          new="""$watchWant = array_values(array_filter($watch, static fn(array $x): bool => (string)($x['media_status'] ?? '') === 'want'));
          if (!$watchWant) $watchWant = $watch;
          $watchWantTotal = count($watchWant);
          $watchWant = array_slice($watchWant, 0, 4);"""
          if old not in s: raise SystemExit('watch count anchor missing')
          s=s.replace(old,new,1)
          s=s.replace("<link rel=\"stylesheet\" href=\"<?=htmlspecialchars(vf_asset_url('assets/surfaces.css'),ENT_QUOTES,'UTF-8')?>\">\n  <script", "<link rel=\"stylesheet\" href=\"<?=htmlspecialchars(vf_asset_url('assets/surfaces.css'),ENT_QUOTES,'UTF-8')?>\">\n  <link rel=\"stylesheet\" href=\"<?=htmlspecialchars(vf_asset_url('assets/surface-home.css'),ENT_QUOTES,'UTF-8')?>\">\n  <script",1)
          s=s.replace("<?=number_format(count($watchWant))?>","<?=number_format($watchWantTotal)?>",1)
          p.write_text(s,encoding='utf-8',newline='\n')

          p=Path('product/src/assets/surface-home.js')
          p.write_text("""(()=>{const root=document.documentElement;const key='vf-surface-theme';const stored=localStorage.getItem(key);if(stored==='dark'||stored==='light')root.dataset.theme=stored;document.querySelector('[data-theme-toggle]')?.addEventListener('click',()=>{const next=root.dataset.theme==='dark'?'light':'dark';root.dataset.theme=next;localStorage.setItem(key,next)});const input=document.querySelector('.vf-global-search input');document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();input?.focus()}})})();\n""",encoding='utf-8',newline='\n')
          PY
          php -l product/src/surfaces.php
          php -l product/src/surface.php
          php -l product/src/start.php
          php -l product/src/index.php
          node --check product/src/assets/surface-home.js
          git -C product config user.name VictorForge
          git -C product config user.email llhzx2018@gmail.com
          git -C product add src/surfaces.php src/assets/surface-home.js
          git -C product commit -m 'fix(P01): polish unified surface dashboard loading and counts'
          git -C product push origin feature/p01-unified-surface-ui-v223-20260828
          echo P01_V223_UI_POLISH_PATCH=PASS
