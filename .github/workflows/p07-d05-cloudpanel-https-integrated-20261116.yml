name: P07 D05 real CloudPanel managed HTTPS source-target-source integration TEMP
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-d05-cloudpanel-https-integrated-20261116.yml'
permissions:
  contents: read
jobs:
  d05-integrated-official-cp:
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    runs-on: ubuntu-24.04
    timeout-minutes: 52
    steps:
      - name: Checkout public disposable CloudPanel VM harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact D05 private source ephemeral checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: fdbffcae2d13f3987ff3263c824a609874b373d7
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: .p07-private-d05active
      - name: GOV-DOC architecture checker transient checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: .p07-d05-gov
      - name: Whole PR code, site sandbox and machine harness validation
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-private-d05active rev-parse HEAD)" = fdbffcae2d13f3987ff3263c824a609874b373d7
          bash -n tests/p07_m03_d05_integrated_cloudpanel_20261116.sh
          python3 -B -m py_compile tests/p07_m03_d05_integrated_cloudpanel_browser_20261116.py
          grep -Fq 'P07_ALLOW_SYNTHETIC_D05=1 python3' tests/p07_m03_d05_integrated_cloudpanel_browser_20261116.py
          cd .p07-private-d05active
          export PYTHONPATH="$PWD/lib"
          python3 -B .github/checks/test_architecture_gate.py
          python3 -B .github/checks/architecture_gate.py \
            --manifest .github/checks/code_architecture.json \
            --gov-root ../.p07-d05-gov --git-root . \
            --base-sha a6da82f35fdbd06020a7e65c8cbd5717f617f2f3 --head-sha fdbffcae2d13f3987ff3263c824a609874b373d7
          python3 -B scripts/check_p07_modules.py \
            --module P07-M03-D05 \
            --pr-title 'P07-M03-D05 数据库引擎转换：真实隔离 CloudPanel 官方 Active 与 HTTPS 应用回切' \
            --changed-file lib/db_engine_conversion_site_sandbox.py \
            --affected P07-M03-D05 \
            --shared-reason 'D05 仅受限合成 VM 和目标站点配置，D04 不变'
          python3 -B -m unittest discover -s tests -p test_p07_m03_d05_site_sandbox.py -v
          python3 - <<'PY'
          import subprocess
          paths=subprocess.check_output([
              "git","diff","--name-only","a6da82f35fdbd06020a7e65c8cbd5717f617f2f3","fdbffcae2d13f3987ff3263c824a609874b373d7"
          ],text=True).splitlines()
          assert not any(p.startswith(("lib/migration_", "lib/server_migration",
                                      "installers/", "public/")) for p in paths)
          print("P07_D05_INTEGRATED_D04_AND_INSTALLER_UNCHANGED=PASS")
          PY
          echo P07_D05_INTEGRATED_SECURITY_SOURCE_AND_ARCH=PASS
      - name: Disposable Debian13 CloudPanel official browser Active + real HTTPS PHP source-target-source
        shell: bash
        env:
          P07_D05_SOURCE_ENGINE: 'MYSQL_8.4'
          P07_ALLOW_SYNTHETIC_D05: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -Eeuo pipefail
          timeout --signal=TERM --kill-after=20s 2760s \
            bash tests/p07_m03_d05_integrated_cloudpanel_20261116.sh
          echo P07_D05_INTEGRATED_OFFICIAL_CP_HTTPS_MACHINE=PASS
      - name: Always clear generated private source, VM/tap and browser state
        if: always()
        shell: bash
        run: |
          set +e
          sudo ip link del p07tapold >/dev/null 2>&1
          sudo ip link del p07br0 >/dev/null 2>&1
          sudo iptables -t nat -D POSTROUTING -s 172.29.71.0/24 -j MASQUERADE >/dev/null 2>&1
          rm -rf -- .p07-private-d05active .p07-d05-gov
          test ! -e .p07-private-d05active
          test ! -e .p07-d05-gov
          echo P07_D05_INTEGRATED_PRIVATE_AND_VM_CLEANUP=PASS
