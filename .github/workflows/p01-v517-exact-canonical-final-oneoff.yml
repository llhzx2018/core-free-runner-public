name: P01 2.47.517 final exact source native canonical regression vs issued 516
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  canonical-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Validate exact P01 and registered public-safe runner surface
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = llhzx2018/core-free-runner-public
          test "$GITHUB_HEAD_REF" = test/p01-v517-exact-canonical-release-20261119
          test -n "$READ_TOKEN"
          echo P01_517_NATIVE_CANONICAL_SAFELY_ISOLATED=PASS
          echo P01_517_PRODUCTION_AND_RELEASE_WRITES=NONE
      - name: Checkout exact final candidate source without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 00927c1531ca6c6f740a815e62ced818173eb062
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: candidate
      - name: Checkout real issued 2.47.516 tag source for full inventory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ab49e83c4715cc9246c4333679fc5388e554cc98
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: baseline
      - name: Confirm official predecessor Tag and exact Git source SHAs
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          test "$(gh api 'repos/llhzx2018/vf-start/git/ref/tags/v2.47.516' --jq '.object.sha')" = ab49e83c4715cc9246c4333679fc5388e554cc98
          test "$(git -C baseline rev-parse HEAD)" = ab49e83c4715cc9246c4333679fc5388e554cc98
          test "$(git -C candidate rev-parse HEAD)" = 00927c1531ca6c6f740a815e62ced818173eb062
          test "$(cat baseline/VERSION)" = 2.47.516
          test "$(cat candidate/VERSION)" = 2.47.517
          test "$(cat candidate/src/VERSION.txt)" = 2.47.517
          git -C candidate merge-base --is-ancestor ab49e83c4715cc9246c4333679fc5388e554cc98 HEAD
          echo P01_517_CANONICAL_REAL_ISSUED_516_GIT_PREDECESSOR=PASS
      - name: Install native PHP and Python dependencies for actual repository tests
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq > "$RUNNER_TEMP/p01-canonical-apt.log" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php8.3-cli php8.3-mbstring php8.3-zip php8.3-sqlite3 php8.3-mysql php8.3-xml php8.3-curl python3 >> "$RUNNER_TEMP/p01-canonical-apt.log" 2>&1
          php -r 'foreach(["sqlite","mysql"] as $x)if(!in_array($x,PDO::getAvailableDrivers(),true))exit(4);'
          echo P01_517_CANONICAL_NATIVE_RUNTIME=PASS
      - name: Native exact source official FULL manifest and malformed acceptance negatives
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l candidate/src/app/next/runtime/CloudPanelPackageIdentity.php
          php -l candidate/tests/unit/p01_d37_official_full_readiness_native.php
          php -l candidate/tests/compatibility/laravel/run_major_signed_real_full_contract.php
          python3 -m py_compile candidate/tests/compatibility/laravel/http/run_cloudpanel_fpm_full_stage.py
          php candidate/tests/unit/p01_d37_official_full_readiness_native.php
          echo P01_517_NATIVE_OFFICIAL_FULL_SECURITY_NEGATIVES=PASS
      - name: Complete final native repository canonical baseline-to-candidate unit inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          if bash candidate/tests/canonical_release_regression.sh candidate baseline > "$RUNNER_TEMP/p01-517-canonical.txt" 2>&1; then
            grep -E '^P01_CANONICAL_|^P01_STACK_' "$RUNNER_TEMP/p01-517-canonical.txt" | tail -n 65
            grep -Fx P01_CANONICAL_UNIT_REGRESSION=PASS "$RUNNER_TEMP/p01-517-canonical.txt"
            echo P01_517_ISSUED_516_TO_CANDIDATE_FULL_CANONICAL=PASS
          else
            echo P01_517_ISSUED_516_TO_CANDIDATE_FULL_CANONICAL=FAIL
            grep -E '^P01_CANONICAL_|^P01_STACK_|^CHANGED_TEST_FAILURE=|^NEW_UNIT_REGRESSION=|^REMOVED_BASELINE_TEST=|^FAIL|^Traceback' "$RUNNER_TEMP/p01-517-canonical.txt" | tail -n 100 || true
            exit 1
          fi
      - name: Always clean private source, test data and logs
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate baseline
          rm -f -- "$RUNNER_TEMP"/p01-517-canonical.txt "$RUNNER_TEMP"/p01-canonical-apt.log
          echo P01_517_CANONICAL_PRIVATE_SOURCE_CLEANED=PASS
          echo P01_517_CANONICAL_NO_PUBLIC_ARTIFACT_AND_NO_PRODUCTION=PASS
