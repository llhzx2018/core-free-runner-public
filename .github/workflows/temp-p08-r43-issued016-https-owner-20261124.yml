name: TEMP P08 R43 genuine issued v016 Owner HTTPS one-click synthetic channel
on:
  pull_request:
    paths:
      - .github/workflows/temp-p08-r43-issued016-https-owner-20261124.yml
permissions:
  contents: read
concurrency:
  group: p08-r43-authentic-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  authentic-issued-owner-https:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/p08-r43-issued016-https-owner-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 44
    env:
      GITHUB_ACTIONS: 'true'
      P08_ISOLATED_INSTALL_TEST: 'YES'
      P08_R43_OLD_BROWSER: 'YES'
    steps:
      - name: Exact private P08 bridge source for disposable fixture only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: ae1a277bb9aea37319e419f5d148a13046013553
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-p08-bridge
      - name: Exact GOV current packaging contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: gov-proof
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_sqlite, sqlite3, pdo_mysql, zip, mbstring, intl, bcmath, dom, fileinfo, curl, posix
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Nginx and Chromium browser prerequisites on disposable runner
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          if ! command -v nginx >/dev/null; then
            timeout 70s sudo apt-get -o Acquire::Retries=0 update -qq > "$RUNNER_TEMP/p08-r43-browser-apt.log" 2>&1 || { echo P08_R43_NGINX_APT=BLOCKED; exit 1; }
            timeout 75s sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nginx >> "$RUNNER_TEMP/p08-r43-browser-apt.log" 2>&1 || { echo P08_R43_NGINX_INSTALL=BLOCKED; exit 1; }
          fi
          nginx -v
          test -x "$(command -v openssl)"
      - name: Download issued FULL bytes from immutable Github Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C private-p08-bridge rev-parse HEAD)" = 'ae1a277bb9aea37319e419f5d148a13046013553'
          test "$(cat private-p08-bridge/VERSION)" = '0.1.17'
          mkdir -m 700 "$RUNNER_TEMP/p08-r43-official-issued"
          gh release download v0.1.16 -R llhzx2018/vf-adops -p VF_AdOps_V0.1.16_FULL.zip --dir "$RUNNER_TEMP/p08-r43-official-issued" > "$RUNNER_TEMP/p08-r43-browser-gh.log" 2>&1 || { echo P08_R43_AUTHENTIC_ISSUED_DOWNLOAD=BLOCKED; exit 1; }
          oldzip="$RUNNER_TEMP/p08-r43-official-issued/VF_AdOps_V0.1.16_FULL.zip"
          test "$(stat -c %s "$oldzip")" = '8378356'
          test "$(sha256sum "$oldzip" | cut -d' ' -f1)" = '7f6a3050db060448df391f0dc5a8a3a2de45c9f28a704cb76606694b82bd084f'
          unzip -p "$oldzip" FULL_MANIFEST.json > "$RUNNER_TEMP/p08-r43-issued-manifest.json"
          php -r '$x=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);if(($x["source_sha"]??"")!=="ed96b18627cd0a63b1da20a1fd8c9b6c1808f159"||($x["target_version"]??"")!=="0.1.16")exit(1);' "$RUNNER_TEMP/p08-r43-issued-manifest.json"
          echo P08_R43_REAL_ISSUED_016_FULL_ORIGINAL_BYTES=PASS
      - name: Build exact developer v017 FULL and genuine-issued-schema-compatible Atomic
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          d=private-p08-bridge
          bash -n "$d/tests/compatibility/run_r43_issued016_https_one_click.sh"
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/p08-r43-synthetic-pycache" python3 -m py_compile "$d/tests/compatibility/r43_issued016_synthetic_https_fixture.py" "$d/tests/compatibility/r43_issued016_synthetic_https_proxy.py"
          mkdir -p "$d/bootstrap/cache" "$d/storage/framework/cache/data" "$d/storage/framework/sessions" "$d/storage/framework/views" "$d/storage/logs"
          (cd "$d" && composer install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/p08-r43-browser-composer.log" 2>&1) || { echo P08_R43_BROWSER_COMPOSER_LOCK=FAIL; exit 1; }
          (cd "$d" && npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-r43-browser-npm.log" 2>&1 && npm run build > "$RUNNER_TEMP/p08-r43-browser-vite.log" 2>&1) || { echo P08_R43_BROWSER_VITE=FAIL; exit 1; }
          (cd "$d" && npx playwright install chromium > "$RUNNER_TEMP/p08-r43-browser-chromium.log" 2>&1) || { echo P08_R43_CHROMIUM_INSTALL=BLOCKED; exit 1; }
          python3 "$d/scripts/build_full.py" --source "$d" --output "$RUNNER_TEMP/p08-r43-dev-v017-full.zip" --version 0.1.17 --source-sha 'ae1a277bb9aea37319e419f5d148a13046013553' --governance-root gov-proof > "$RUNNER_TEMP/p08-r43-browser-full.log" 2>&1 || { echo P08_R43_BROWSER_DEV_FULL=FAIL; grep 'FULL_BLOCKED' "$RUNNER_TEMP/p08-r43-browser-full.log" | head -n 5 || true; exit 1; }
          h="$(sha256sum "$RUNNER_TEMP/p08-r43-issued-manifest.json" | awk '{print $1}')"
          python3 "$d/scripts/build_atomic.py" --source "$d" --output "$RUNNER_TEMP/p08-r43-dev-v017-update.zip" --source-version 0.1.16 --source-sha 'ed96b18627cd0a63b1da20a1fd8c9b6c1808f159' --source-full-manifest-sha256 "$h" --previous-full-manifest "$RUNNER_TEMP/p08-r43-issued-manifest.json" --target-version 0.1.17 --target-sha 'ae1a277bb9aea37319e419f5d148a13046013553' > "$RUNNER_TEMP/p08-r43-browser-update.log" 2>&1 || { echo P08_R43_BROWSER_DEV_ISSUED_ATOMIC=FAIL; grep 'ATOMIC_REJECTED' "$RUNNER_TEMP/p08-r43-browser-update.log" | head -n 5 || true; exit 1; }
          echo P08_R43_REAL_DEV_FULL_AND_ISSUED_SOURCE_ATOMIC=PASS
      - name: First install real published v016 FULL Owner and preserve synthetic data
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          site="$RUNNER_TEMP/p08-r43-https-issued-site"
          mkdir -m 700 "$site"
          unzip -q "$RUNNER_TEMP/p08-r43-official-issued/VF_AdOps_V0.1.16_FULL.zip" -d "$site"
          php private-p08-bridge/tests/compatibility/r43_issued016_native_codeonly.php setup "$site" "$RUNNER_TEMP/p08-r43-dev-v017-update.zip" 'ae1a277bb9aea37319e419f5d148a13046013553' > "$RUNNER_TEMP/p08-r43-browser-setup.log" 2>&1 || { echo P08_R43_BROWSER_ISSUED_FIRST_INSTALL=FAIL; grep -E 'R43_|Fatal error|Error:' "$RUNNER_TEMP/p08-r43-browser-setup.log" | tail -n 8 || true; exit 1; }
          grep -q '^P08_R43_ACTUAL_OFFICIAL_V016_FULL_OWNER_INSTALL=PASS' "$RUNNER_TEMP/p08-r43-browser-setup.log"
          echo P08_R43_ACTUAL_ISSUED_016_OWNER_SITE_READY_FOR_HTTPS=PASS
      - name: Nginx HTTPS Chromium authentic v016 Owner check + explicit one-click with fully offline fake GitHub API
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          bash private-p08-bridge/tests/compatibility/run_r43_issued016_https_one_click.sh "$RUNNER_TEMP/p08-r43-https-issued-site" 'ae1a277bb9aea37319e419f5d148a13046013553' > "$RUNNER_TEMP/p08-r43-browser-e2e.log" 2>&1 || { echo P08_R43_ISSUED_016_HTTPS_ONECLICK=FAIL; grep -E 'P08_R43_|Error:|FAIL|expected|Timeout' "$RUNNER_TEMP/p08-r43-browser-e2e.log" | tail -n 19 | cut -c 1-330 || true; exit 1; }
          grep -q '^P08_R43_REAL_ISSUED016_OWNER_HTTPS_ONECLICK_LOCAL_SYNTHETIC_CHANNEL=PASS' "$RUNNER_TEMP/p08-r43-browser-e2e.log"
          grep -q '^P08_R43_V017_GITHUB_RELEASE_ACTUALLY_PUBLISHED=NO' "$RUNNER_TEMP/p08-r43-browser-e2e.log"
          echo P08_R43_REAL_ISSUED_016_HTTPS_OWNER_CLICK_AND_017_DEV_RUNTIME=PASS
      - name: Delete all ephemeral PRIVATE sources, credentials, synthetic site, ZIPs and browser results
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- private-p08-bridge gov-proof
          rm -rf -- "$RUNNER_TEMP/p08-r43-synthetic-pycache" "$RUNNER_TEMP/p08-r43-official-issued" "$RUNNER_TEMP/p08-r43-https-issued-site" "$RUNNER_TEMP/p08-r43-https-stack" "$RUNNER_TEMP/p08-r43-https-wire" "$RUNNER_TEMP/p08-r43-https-events.log"
          rm -f -- "$RUNNER_TEMP"/p08-r43-*.zip "$RUNNER_TEMP"/p08-r43-*.log "$RUNNER_TEMP/p08-r43-issued-manifest.json"
          test ! -e private-p08-bridge && test ! -e gov-proof && test ! -e "$RUNNER_TEMP/p08-r43-https-issued-site"
          echo P08_R43_REAL_ISSUED_OWNER_HTTPS_PRIVATE_CLEANUP=PASS
