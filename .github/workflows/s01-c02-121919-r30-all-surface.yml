name: S01-C02 1.21.919 R30 All Surface UXUI Gate

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CANDIDATE_SHA: 946a9cc0134563da2c359ab15339d51e495d6cfb
      BASE_SHA: 0827e03b566a3070fec4aa27e90a4144424f0b9c

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 946a9cc0134563da2c359ab15339d51e495d6cfb
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: ops
          persist-credentials: false

      - name: Verify R30 exact scope and all-surface contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(tr -d '\r\n' < ops/VERSION)" = "1.21.919"
          grep -Fq 'Version: 1.21.919' ops/vf-ops.php
          grep -Fq "VF_OPS_VERSION', '1.21.919'" ops/vf-ops.php
          grep -Fq 'S01-ALL-SURFACE-UXUI-CLOSURE-R30' ops/vf-ops.php

          php ops/tests/s01-c02-121919-all-surface-uxui-r30-contract.php
          php -l ops/vf-ops.php >/dev/null
          php -l ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php >/dev/null
          php -l ops/includes/views/admin-shell-tabs-parts/02-shell-navigation.php >/dev/null

          actual="$(git -C ops diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" | sort)"
          expected="$(printf '%s\n'             CHANGELOG.md             VERSION             assets/css/current/admin-s01-compat-r30.css             includes/views/admin-shell-tabs-parts/02-shell-navigation.php             includes/views/admin-style-helpers/admin-s01-uiux-polish.php             tests/s01-c02-121919-all-surface-uxui-r30-contract.php             vf-ops.php | sort)"
          test "$actual" = "$expected"

          python3 - <<'PY'
          import re
          from pathlib import Path

          route = Path('ops/includes/admin-v13/route-contract.php').read_text(encoding='utf-8')
          ui = Path('ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php').read_text(encoding='utf-8')
          nav = Path('ops/includes/views/admin-shell-tabs-parts/02-shell-navigation.php').read_text(encoding='utf-8')
          css = Path('ops/assets/css/current/admin-s01-compat-r30.css').read_text(encoding='utf-8')

          migration_count = route.count("'status'=>'migration_evidence'")
          assert migration_count == 13, migration_count

          # Route contract contains 39 registered Ops routes; standalone Tools is
          # the 40th OWNER surface in the six-domain shell.
          route_keys = re.findall(r"^\s*'([^']+)'\s*=>\s*\['key'=>", route, re.M)
          assert len(route_keys) == 39, len(route_keys)
          assert len(set(route_keys)) == 39

          assert "$isCanonicalRoute || $isCompatibilityRoute" in ui
          assert "admin-s01-compat-r30.css" in ui
          assert "vf_ops_v13_render_compat_route_banner_v121919" in nav
          assert "data-vf-route-status" in nav
          assert "currentIsCompat" in nav
          assert css.count('{') == css.count('}')

          successor_pairs = {
            'seo_gaps':'seo_refine',
            'seo_opportunities':'seo_planner',
            'seo_backlinks':'seo_links_redirects',
            'publish_workflow':'publish_zip',
            'publish_pending':'publish_zip',
            'publish_preflight':'publish_zip',
            'publish_batches':'publish_zip',
            'publish_history':'publish_zip',
            'acceptance':'acceptance_overview',
            'system_components':'system_plugins',
            'system_search_analytics':'integrations',
            'system_monetization':'ads',
            'system_backup':'system_recovery',
          }
          for src,dst in successor_pairs.items():
              assert f"'{src}'=>'{dst}'" in nav, (src,dst)

          print('PASS_R30_ALL_40_SURFACES')
          PY

          test "$(git -C ops diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" -- database config includes/v6 includes/wp-update docs/authority | wc -l)" = "0"

          ! grep -RInE 'gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY'             ops/vf-ops.php             ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php             ops/includes/views/admin-shell-tabs-parts/02-shell-navigation.php             ops/assets/css/current/admin-s01-compat-r30.css

          echo PASS_S01_C02_121919_R30_PREMERGE
