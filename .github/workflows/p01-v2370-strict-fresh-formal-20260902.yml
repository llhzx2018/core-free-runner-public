name: P01 V2.37.0 Strict Fresh Formal
on:
  push:
    branches:
      - release/p01-v2365-candidate-20260902
    paths:
      - .github/workflows/p01-v2370-strict-fresh-formal-20260902.yml
permissions:
  contents: read
  actions: read
jobs:
  strict-fresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      FORMAL_RUN: '33567419784'
      FORMAL_ARTIFACT: p01-v2370-formal-artifacts-33567419784
      FORMAL_ARTIFACT_ID: '9823658330'
      FORMAL_ARTIFACT_DIGEST: sha256:95f73a536461b6eeac28616ac8072d7433f194c6cb12c5b1a8d2e641629d6738
      FORMAL: 5172a497f7a2c9065880ae0d1257a15469917621
      FORMAL_TREE: eac2a8c76c49925bffbca9c23314ef90aec6f3bd
      FORMAL_RUNTIME_TREE: 057fbba8822950f163aa322d99b889ed3ab24842
      PREDECESSOR: ef86eba16aec71c1d0dabc16ad23089a78ee5057
      PREDECESSOR_TREE: 926504354eaf4354e852e78b19c0fde69513a133
      PREDECESSOR_RUNTIME_TREE: a7f472ec1f449ada1152d271f2723c52e7b58144
      SCHEMA: '2026082901'
      FULL_BYTES: '601163'
      FULL_SHA: 0a7e74750fa22a68ec26a0a4e14e7852e8ad2bb5514ba8c262c804d40eda609b
      UPDATE_BYTES: '1270761'
      UPDATE_SHA: c416486d5ea1d68b87c1bdfebcc7de42729f1ff7655e3ded49ebd5a88d1e3b29
      REPAIR_BYTES: '3689853'
      REPAIR_SHA: 085c205c32ba0c4b4e0d2153f808964f4c301c123baec85ec0a9f11870c04154
      DOWNLOAD: /tmp/p01-v2370-strict-download
      FRESH: /tmp/p01-v2370-strict-fresh
      EVID: /tmp/p01-v2370-strict-evidence
      COOKIE: /tmp/p01-v2370-strict.cookies
      PORT: '18607'
      ADMIN_PASS: P01V2370StrictFresh
    steps:
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 95fa7dbcc6c9eb5869412a88bdc58382870abebe
          path: gridhelper
      - name: Frozen formal artifact identity and fresh install
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf "$DOWNLOAD" "$FRESH" "$EVID" "$COOKIE"; mkdir -p "$DOWNLOAD" "$FRESH" "$EVID/screens"
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$FORMAL_RUN --jq .conclusion)" = success
          LIVE=$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$FORMAL_RUN/artifacts)
          LIVE_ID=$(jq -r '.artifacts[]|select(.name=="p01-v2370-formal-artifacts-33567419784")|.id' <<<"$LIVE")
          LIVE_DIGEST=$(jq -r '.artifacts[]|select(.id==9823658330)|.digest' <<<"$LIVE")
          LIVE_EXPIRED=$(jq -r '.artifacts[]|select(.id==9823658330)|.expired' <<<"$LIVE")
          test "$LIVE_ID" = "$FORMAL_ARTIFACT_ID"
          test "$LIVE_DIGEST" = "$FORMAL_ARTIFACT_DIGEST"
          test "$LIVE_EXPIRED" = false
          gh run download "$FORMAL_RUN" -R llhzx2018/core-free-runner-public -n "$FORMAL_ARTIFACT" -D "$DOWNLOAD"
          FULL=$(find "$DOWNLOAD" -type f -name 'VF-Start-V2.37.0-FULL.zip' -print -quit); test -n "$FULL"; ART_DIR=$(dirname "$FULL")
          (cd "$ART_DIR" && sha256sum -c SHA256SUMS.txt) | tee "$EVID/sha256.txt"
          for spec in \
            "VF-Start-V2.37.0-FULL.zip:$FULL_BYTES:$FULL_SHA" \
            "VF_Start_V2.37.0_UPDATE.zip:$UPDATE_BYTES:$UPDATE_SHA" \
            "repair-v2.37.0.php:$REPAIR_BYTES:$REPAIR_SHA"; do
            IFS=: read -r file bytes sha <<<"$spec"
            test "$(stat -c%s "$ART_DIR/$file")" = "$bytes"
            test "$(sha256sum "$ART_DIR/$file"|awk '{print $1}')" = "$sha"
          done
          if test -f "$ART_DIR/VF-Start-V2.37.0-UPDATE.zip"; then
            test "$(stat -c%s "$ART_DIR/VF-Start-V2.37.0-UPDATE.zip")" = "$UPDATE_BYTES"
            test "$(sha256sum "$ART_DIR/VF-Start-V2.37.0-UPDATE.zip"|awk '{print $1}')" = "$UPDATE_SHA"
          fi
          jq -e '.status=="FORMAL_ARTIFACT_GATE_PASS" and .formal_source=="5172a497f7a2c9065880ae0d1257a15469917621" and .formal_tree=="eac2a8c76c49925bffbca9c23314ef90aec6f3bd" and .runtime_tree=="057fbba8822950f163aa322d99b889ed3ab24842" and .schema=="2026082901" and .migration==null and (.added|sort)==(["quick-save.php"]|sort) and .removed==[] and (.changed|length)==29' "$ART_DIR/P01-V2.37.0-ARTIFACT-GATE.json" >/dev/null
          grep -F "public const SOURCE_VERSION='2.36.5';" "$ART_DIR/repair-v2.37.0.php" >/dev/null
          grep -F "public const TARGET_VERSION='2.37.0';" "$ART_DIR/repair-v2.37.0.php" >/dev/null
          grep -F "public const TARGET_SCHEMA='2026082901';" "$ART_DIR/repair-v2.37.0.php" >/dev/null
          unzip -q "$FULL" -d "$FRESH"
          test "$(cat "$FRESH/VERSION.txt")" = 2.37.0
          grep -Fx "define('VF_VERSION', '2.37.0');" "$FRESH/app/bootstrap.php" >/dev/null
          grep -F 'confirmRuntimeThenReload(toVersion)' "$FRESH/assets/update-core.js" >/dev/null
          grep -F "'apple-podcasts' => 2 * 1024 * 1024" "$FRESH/app/ResourceCoverCache.php" >/dev/null
          grep -F "vf_asset_url('assets/resource-actions.css')" "$FRESH/app/FunctionalWorkspace.php" >/dev/null
          ! grep -F '@import url("resource-actions.css")' "$FRESH/assets/resource-media.css" >/dev/null
          grep -F '.vf-functional-head>div{min-width:0}' "$FRESH/assets/workspace-rebaseline.css" >/dev/null
          grep -F '搜索我的互联网' "$FRESH/app/FunctionalWorkspace.php" >/dev/null
          grep -F 'data-prefill-url' "$FRESH/app/FunctionalWorkspace.php" >/dev/null
          grep -F 'savePendingCapture' "$FRESH/quick-save.php" >/dev/null
          grep -F 'categorySuggestions' "$FRESH/surface-manager.php" >/dev/null
          grep -F '撤销' "$FRESH/assets/links-admin.js" >/dev/null
          grep -F '导入浏览器书签' "$FRESH/transfer.php" >/dev/null
          grep -F 'recentAssets' "$FRESH/app/FunctionalHome.php" >/dev/null
          find "$FRESH" -type f -name '*.php' -print0 | xargs -0 -n1 php -l >"$EVID/php-syntax.txt"
          find "$FRESH/assets" "$FRESH/browser-extension" -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >"$EVID/js-syntax.txt"
          php -S 127.0.0.1:$PORT -t "$FRESH" >"$EVID/server.log" 2>&1 & echo $! >/tmp/p01-v2370-strict.pid
          for i in $(seq 1 60); do curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:$PORT/setup.php" -o "$EVID/setup.html" && break; sleep .25; done
          CSRF=$(python3 - "$EVID/setup.html" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -L -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:$PORT/setup.php" --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=P01 V2.37.0 Strict Fresh' --data-urlencode "admin_password=$ADMIN_PASS" --data-urlencode "admin_password_confirm=$ADMIN_PASS" -o "$EVID/setup-post.html"
          php "$FRESH/cli/verify.php" | tee "$EVID/verify.txt" | grep -Fx VERIFY_PASS=YES
          php "$FRESH/cli/surface-verify.php" | tee "$EVID/surface.txt" | grep -Fx CURRENT_DOMAIN_PASS=YES
          P01_ROOT="$FRESH" php gridhelper/scripts/p01_anonymous_grid_seed.php | tee "$EVID/grid-seed.txt"
          grep -Fx P01_ANONYMOUS_GRID_SEED=PASS "$EVID/grid-seed.txt"
          curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:$PORT/quick-save.php" -o "$EVID/quick-save.html"
          grep -F '快速收藏' "$EVID/quick-save.html" >/dev/null
          grep -F '保存到待整理' "$EVID/quick-save.html" >/dev/null
          printf 'FROZEN_ARTIFACT_ID=%s\nFROZEN_ARTIFACT_DIGEST=%s\nFULL_SHA=%s\nUPDATE_SHA=%s\nREPAIR_SHA=%s\nFRESH_INSTALL=PASS\nQUICK_SAVE_ROUTE=PASS\n' "$LIVE_ID" "$LIVE_DIGEST" "$FULL_SHA" "$UPDATE_SHA" "$REPAIR_SHA" | tee "$EVID/frozen.txt"
      - name: Canonical asset authority fresh HTTP check
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsS "http://127.0.0.1:$PORT/channels.php" -o "$EVID/channels-anon.html"
          grep -F 'asset.php?file=resource-actions.css' "$EVID/channels-anon.html" >/dev/null
          ! grep -F 'href="resource-actions.css"' "$EVID/channels-anon.html" >/dev/null
          printf 'CANONICAL_RESOURCE_ACTIONS_ASSET=PASS\n' | tee "$EVID/asset-authority.txt"
      - name: Install Chromium harness
        run: |
          python -m pip install --disable-pip-version-check --quiet playwright==1.55.0
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v google-chrome-stable >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1; then python -m playwright install chromium; fi
      - name: Anonymous authenticated logout browser gate 390 1319 1440
        env:
          P01_BASE_URL: http://127.0.0.1:18607
          P01_ADMIN_PASSWORD: P01V2370StrictFresh
          P01_EVIDENCE_DIR: /tmp/p01-v2370-strict-evidence/screens
        run: |
          set -Eeuo pipefail
          python gridhelper/scripts/p01_anonymous_grid_gate.py | tee "$EVID/grid-browser.txt"
          grep -Fx P01_ANONYMOUS_GRID_BROWSER=PASS "$EVID/grid-browser.txt"
      - name: Final privacy SQLite and strict-fresh verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          for route in start.php channels.php watch.php topics.php; do curl -fsS "http://127.0.0.1:$PORT/$route" -o "$EVID/anonymous-${route%.php}.html"; done
          ! grep -R -F '管理员视角' "$EVID"/anonymous-*.html
          ! grep -R -F '公开视角' "$EVID"/anonymous-*.html
          ROOT="$FRESH" php <<'PHP' | tee "$EVID/db-final.txt"
          <?php require getenv('ROOT').'/app/bootstrap.php';$d=vf_db();if(strtolower((string)$d->query('PRAGMA integrity_check')->fetchColumn())!=='ok')exit(1);if($d->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC))exit(2);echo "INTEGRITY=ok\nFK=0\n";
          PHP
          grep -Fx P01_ANONYMOUS_GRID_BROWSER=PASS "$EVID/grid-browser.txt"
          grep -Fx CANONICAL_RESOURCE_ACTIONS_ASSET=PASS "$EVID/asset-authority.txt"
          printf 'P01_V2370_STRICT_FRESH_FORMAL=PASS\nFORMAL=%s\nTREE=%s\nRUNTIME_TREE=%s\nPREDECESSOR=%s\nSCHEMA=%s\nFORMAL_RUN=%s\nFORMAL_ARTIFACT=%s\nFORMAL_ARTIFACT_DIGEST=%s\nFULL_SHA=%s\nUPDATE_SHA=%s\nREPAIR_SHA=%s\nANONYMOUS_GRID_390_1319_1440=PASS\nLOGIN_LOGOUT=PASS\nCANONICAL_ASSET_AUTHORITY=PASS\nV2365_FIX_PRESERVATION=PASS\nWAVE_1_13_CONTRACTS=PASS\nONE_FRONTEND=PASS\nPRIVACY=PASS\nSQLITE=PASS\nMIGRATION=NONE\nOWNER_PRODUCTION_WRITE=NO\n' "$FORMAL" "$FORMAL_TREE" "$FORMAL_RUNTIME_TREE" "$PREDECESSOR" "$SCHEMA" "$FORMAL_RUN" "$FORMAL_ARTIFACT_ID" "$FORMAL_ARTIFACT_DIGEST" "$FULL_SHA" "$UPDATE_SHA" "$REPAIR_SHA" | tee "$EVID/verdict.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-v2370-strict-fresh-formal-${{ github.run_id }}
          path: /tmp/p01-v2370-strict-evidence
          if-no-files-found: error
          retention-days: 90
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/p01-v2370-strict.pid 2>/dev/null)" 2>/dev/null || true
