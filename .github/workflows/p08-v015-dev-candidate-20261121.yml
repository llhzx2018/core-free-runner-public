name: P08 v015 UI-only DEV candidate exact official v014 native artifact readiness
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p08-v015-dev-candidate-20261121.yml
permissions:
  contents: read
jobs:
  p08-v015-dev-candidate:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-v015-dev-candidate-packages-20261121' && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact private P08 unissued candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: b1c3a2f51bbb5e0884e4582db5540a06170c2d0d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
      - name: Checkout effective current GOV rule source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: ec0af1f62f9056e3159c0c1fb2cb65fbc6576683
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov
      - name: PHP 8.4 native locked composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: zip,curl,mbstring,pdo_mysql,pdo_sqlite,sqlite3,openssl,posix,dom,intl,fileinfo
          coverage: none
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact P08 UX-only source and shared code checks
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = b1c3a2f51bbb5e0884e4582db5540a06170c2d0d
          test "$(git -C gov rev-parse HEAD)" = ec0af1f62f9056e3159c0c1fb2cb65fbc6576683
          test "$(cat target/VERSION)" = 0.1.15
          test -f target/docs/evidence/P08_V015_UPDATES_UX_DEV_CANDIDATE_20261121.md
          python3 -B target/tests/test_v015_update_ux_candidate.py
          npm ci --prefix target --ignore-scripts --no-fund --no-audit
          npm run typecheck --prefix target
          npm run test:unit --prefix target
          npm run build --prefix target
          composer --working-dir=target install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress --optimize-autoloader
          python3 -B target/scripts/check_stack_contract.py --phase full --root target
          (
            cd target
            git diff --exit-code && git diff --cached --exit-code
            for f in $(git ls-files --others --exclude-standard); do
              case "$f" in
                bootstrap/cache/packages.php|bootstrap/cache/services.php) test -f "$f" && ! test -L "$f" && rm -- "$f";;
                *) echo P08_V015_UNEXPECTED_GENERATED_SOURCE; exit 23;;
              esac
            done
            test -z "$(git status --porcelain --untracked-files=all)"
          )
          echo P08_V015_DEV_SOURCE_TYPED_TESTED_BUILT=PASS
      - name: Obtain genuine immutable official v014 FULL source, never synthetic manifest
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          tmp="$RUNNER_TEMP/p08-v015-candidate"
          mkdir -m 700 "$tmp"
          curl -fsSL --retry 2 --max-time 120 \
            -H "Authorization: Bearer $READ_TOKEN" \
            -H 'Accept: application/octet-stream' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/llhzx2018/vf-adops/releases/assets/772420344' \
            -o "$tmp/official-v014-full.zip"
          test "$(sha256sum "$tmp/official-v014-full.zip" | cut -d' ' -f1)" = 2b8023a1c67213dbebb8f7047f27debbccc0f00fb210d10aeb3dc703076a811b
          unzip -p "$tmp/official-v014-full.zip" FULL_MANIFEST.json > "$tmp/official-v014-manifest.json"
          python3 - "$tmp/official-v014-manifest.json" <<'PY'
          import sys,json,hashlib
          from pathlib import Path
          p=Path(sys.argv[1]);raw=p.read_bytes();m=json.loads(raw)
          assert m['type']=='CLEAN_FULL_ONLY'
          assert m['target_version']=='0.1.14'
          assert m['source_sha']=='6fae792864a594465e4b3224bd6d73abde976f12'
          assert m['project_id']=='P08' and m['repository']=='llhzx2018/vf-adops'
          assert len(m['files'])>6000 and len(raw)<4_000_000
          print('P08_V015_GENUINE_OFFICIAL_V014_MANIFEST_SHA256='+hashlib.sha256(raw).hexdigest())
          PY
          echo P08_V015_GENUINE_ISSUED_V014_FULL_SOURCE=PASS
      - name: Build deterministic v015 FULL and v014-source code-only Atomic twice (DEV ONLY)
        shell: bash
        run: |
          set -Eeuo pipefail
          tmp="$RUNNER_TEMP/p08-v015-candidate"
          old="$(sha256sum "$tmp/official-v014-manifest.json" | cut -d' ' -f1)"
          for round in first second; do
            python3 -B target/scripts/build_full.py \
              --source "$GITHUB_WORKSPACE/target" \
              --output "$tmp/dev-v015-full-$round.zip" \
              --version 0.1.15 --source-sha b1c3a2f51bbb5e0884e4582db5540a06170c2d0d \
              --governance-root "$GITHUB_WORKSPACE/gov"
            python3 -B target/scripts/build_atomic.py \
              --source "$GITHUB_WORKSPACE/target" \
              --output "$tmp/dev-v015-atomic-$round.zip" \
              --source-version 0.1.14 \
              --source-sha 6fae792864a594465e4b3224bd6d73abde976f12 \
              --source-full-manifest-sha256 "$old" \
              --previous-full-manifest "$tmp/official-v014-manifest.json" \
              --target-version 0.1.15 --target-sha b1c3a2f51bbb5e0884e4582db5540a06170c2d0d
          done
          cmp "$tmp/dev-v015-full-first.zip" "$tmp/dev-v015-full-second.zip"
          cmp "$tmp/dev-v015-atomic-first.zip" "$tmp/dev-v015-atomic-second.zip"
          unzip -tqq "$tmp/dev-v015-full-first.zip"
          unzip -tqq "$tmp/dev-v015-atomic-first.zip"
          python3 - "$tmp" <<'PY'
          import sys,json,zipfile,hashlib
          from pathlib import Path
          p=Path(sys.argv[1])
          full=p/'dev-v015-full-first.zip';up=p/'dev-v015-atomic-first.zip'
          older=hashlib.sha256((p/'official-v014-manifest.json').read_bytes()).hexdigest()
          with zipfile.ZipFile(full) as z:
            j=json.loads(z.read('FULL_MANIFEST.json'))
            assert j['source_sha']=='b1c3a2f51bbb5e0884e4582db5540a06170c2d0d' and j['target_version']=='0.1.15'
            assert j['type']=='CLEAN_FULL_ONLY' and j['data_included'] is False
            assert len(j['files'])>6000 and z.testzip() is None
          with zipfile.ZipFile(up) as z:
            j=json.loads(z.read('ATOMIC_MANIFEST.json'))
            assert j['type']=='P08_ATOMIC_CODE_ONLY_V1'
            assert j['source_version']=='0.1.14'
            assert j['source_sha']=='6fae792864a594465e4b3224bd6d73abde976f12'
            assert j['source_full_manifest_sha256']==older
            assert j['target_version']=='0.1.15' and j['target_sha']=='b1c3a2f51bbb5e0884e4582db5540a06170c2d0d'
            assert j['schema_changes'] is False and len(j['files'])>6000
            assert z.testzip() is None
          for file in (full,up):
            with zipfile.ZipFile(file) as z:
              assert not any(
                name.startswith('.git/') or name=='storage/database.sqlite'
                or name.startswith('storage/app/private/') or name.startswith('node_modules/')
                or name=='.env' for name in z.namelist())
          print('P08_V015_DEV_FULL_SHA256='+hashlib.sha256(full.read_bytes()).hexdigest())
          print('P08_V015_DEV_ATOMIC_SHA256='+hashlib.sha256(up.read_bytes()).hexdigest())
          print('P08_V015_DEV_FULL_AND_ATOMIC_DOUBLE_BUILD=PASS')
          PY
          echo P08_V015_DEV_CANDIDATE_NOT_TAG_RELEASE_CHANNEL=PASS
      - name: Always remove private source and temporary unissued package bits
        if: always()
        shell: bash
        run: |
          rm -rf -- target gov "$RUNNER_TEMP/p08-v015-candidate"
          test ! -e target && test ! -e gov
          echo P08_V015_PRIVATE_CLEANUP=PASS
