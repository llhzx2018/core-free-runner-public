name: P04 V2.5.4 Final Copy Contrast Patch

on:
  push:
    paths:
      - '.github/workflows/p04-v254-final-copy-contrast-patch.yml'

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: maintenance/p04-v2.5.4-full-backend-ui-20260816
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: vf-infra
      - name: Apply exact product patch
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/p04-v254-final-copy-contrast-patch.py vf-infra/.v254-final-patch.py
          cd vf-infra
          python3 .v254-final-patch.py
          rm .v254-final-patch.py
          node --check public/assets/app.js
          git diff --check
          test "$(git diff --name-only)" = $'public/assets/app.js\npublic/assets/v254-ui.css'
      - name: Commit and push
        shell: bash
        working-directory: vf-infra
        run: |
          set -euo pipefail
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add public/assets/app.js public/assets/v254-ui.css
          git commit -m 'fix(P04): finish V2.5.4 update copy and footer contrast'
          git push origin HEAD:maintenance/p04-v2.5.4-full-backend-ui-20260816
