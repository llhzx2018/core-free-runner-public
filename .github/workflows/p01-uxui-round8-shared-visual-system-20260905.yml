name: P01 UXUI Round8 Shared Visual System

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p01-uxui-round8-shared-visual-system-20260905.yml

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_SHA: ad8f81df6b1d697d3a54b7fbb7742d7fd4970068
      BASE_SHA: 1510aad28e33302739a46fd8a9e240150aa750f3
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: feature/p01-uxui-round8-shared-visual-system-20260905
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_sqlite,sqlite3,curl
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exact source and no-release boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(cat VERSION)" = '2.46.3'
          test "$(cat src/VERSION.txt)" = '2.46.3'
          changed="$(git diff --name-only "$BASE_SHA"..HEAD | sort)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | wc -l)" -eq 4
          ! printf '%s\n' "$changed" | grep -Eq '(^VERSION$|^src/VERSION.txt$|^src/migrations/|^src/app/bootstrap.php$)'
      - name: Syntax and Round 8 visual-system identity
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l src/app/SubjectPageChrome.php
          php -l tests/unit/uxui_round8_visual_system_contract.php
          php tests/unit/uxui_round8_visual_system_contract.php
          find src -name '*.php' -type f -print0 | xargs -0 -n1 php -l >/dev/null
          node --check src/assets/quick-open.js
          node --check src/assets/workspace.js
      - name: R1 to R7 and consolidated product regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in tests/unit/uxui_round1_home_root_contract.php tests/unit/uxui_round2_subject_identity_contract.php tests/unit/uxui_round3_course_identity_contract.php tests/unit/uxui_round4_tools_identity_contract.php tests/unit/uxui_round5_software_identity_contract.php tests/unit/uxui_round6_channels_watch_identity_contract.php tests/unit/uxui_round7_navigation_home_identity_contract.php tests/unit/consolidated_product_acceptance_contract.php; do php "$f"; done
      - name: Existing readability focus and mobile ergonomics regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in tests/unit/admin_visual_system_r3_contract.php tests/unit/books_mobile_touch_contract.php tests/unit/home_readability_contract.php tests/unit/system_baseline_human_ui_contract.php tests/unit/admin_secondary_nav_focus_contract.php tests/unit/quick_open_global_contract.php tests/unit/resource_action_visibility_contract.php tests/unit/resource_action_semantics_contract.php; do php "$f"; done
      - name: Static terminal visual-system assertions
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq '@import url("visual-system-final.css");' src/assets/quick-open.css
          grep -Fq 'assets/visual-system-final.css' src/app/SubjectPageChrome.php
          grep -Fq ':focus-visible' src/assets/visual-system-final.css
          grep -Fq 'dialog::backdrop' src/assets/visual-system-final.css
          grep -Fq 'overscroll-behavior:contain' src/assets/visual-system-final.css
          grep -Fq -- '--vf-touch-target:40px' src/assets/visual-system-final.css
          grep -Fq 'min-height:var(--vf-touch-target)' src/assets/visual-system-final.css
          grep -Fq 'overflow-wrap:anywhere' src/assets/visual-system-final.css
          grep -Fq '@media (prefers-reduced-motion: reduce)' src/assets/visual-system-final.css
          ! grep -Eq 'overflow-x:(auto|scroll)' src/assets/visual-system-final.css
          ! grep -Fq '.vf-global-domain-nav-inner' src/assets/visual-system-final.css
          echo P01_UXUI_ROUND8_SHARED_VISUAL_SYSTEM=PASS
