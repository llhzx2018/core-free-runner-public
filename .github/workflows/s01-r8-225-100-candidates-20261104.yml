name: S01 candidate Theme225 M3U8-100 WP lifecycle
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/s01-r8-225-100-candidates-20261104.yml']
permissions: {contents: read}
jobs:
  real-wp:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      db:
        image: mariadb:11.8
        env: {MARIADB_DATABASE: s01, MARIADB_USER: vf, MARIADB_PASSWORD: vf, MARIADB_ROOT_PASSWORD: fixture-only}
        ports: ['3306:3306']
        options: >-
          --health-cmd "mariadb-admin ping -h 127.0.0.1 -uroot -pfixture-only" --health-interval 10s --health-timeout 5s --health-retries 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {repository: llhzx2018/vf-tools-theme, ref: 92351d1a2863bbe8ad5fcff5778a4e908d75a212, token: '${{ secrets.VF_PRIVATE_READ_TOKEN }}', persist-credentials: false, path: theme}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {repository: llhzx2018/vf-tools-m3u8, ref: bfff0ed035f37af347820727e570502b333da9ff, token: '${{ secrets.VF_PRIVATE_READ_TOKEN }}', persist-credentials: false, path: m3u8}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3', extensions: 'mysqli,mbstring,intl,zip', coverage: none}
      - name: Verify exact version identity and focused business guard
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C theme rev-parse HEAD)" = 92351d1a2863bbe8ad5fcff5778a4e908d75a212
          test "$(git -C m3u8 rev-parse HEAD)" = bfff0ed035f37af347820727e570502b333da9ff
          test "$(cat theme/VERSION)" = 1.35.225
          test "$(cat m3u8/VERSION)" = 1.25.100
          php -l theme/src/inc/services/frontend-page-progress-service.php >/dev/null
          php -l m3u8/src/vf-tool-m3u8.php >/dev/null
          node --check m3u8/src/public/js/product/vod-download-runtime.js
          node m3u8/tests/vod-required-init-segment.node.cjs
          echo S01_CANDIDATES_EXACT_GUARD=PASS
      - name: Old official archive identity and candidate ZIP construction
        shell: bash
        env: {GH_TOKEN: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          mkdir -p "$RUNNER_TEMP/old" "$RUNNER_TEMP/new"
          gh release download v1.35.224 -R llhzx2018/vf-tools-theme -p vf-tools-theme_V1.35.224.zip -D "$RUNNER_TEMP/old"
          gh release download v1.25.99 -R llhzx2018/vf-tools-m3u8 -p vf-tools-m3u8_V1.25.99.zip -D "$RUNNER_TEMP/old"
          gh release download v1.21.1114 -R llhzx2018/vf-tools-ops -p vf-tools-ops_V1.21.1114.zip -D "$RUNNER_TEMP/old"
          echo "7d64ce96ac15c482b653666a54fd587437b8aa214a73eb82e6e6771eaa02a4de  $RUNNER_TEMP/old/vf-tools-theme_V1.35.224.zip" | sha256sum -c
          echo "7bd5c648fc1eb3513896404e8d433bc64044ce79928ddf7ed79f73b2fd2ba2a4  $RUNNER_TEMP/old/vf-tools-m3u8_V1.25.99.zip" | sha256sum -c
          echo "07accbb20cb23fae08d308f23be729a62daadc6d252c3a4ff213d550030e49a3  $RUNNER_TEMP/old/vf-tools-ops_V1.21.1114.zip" | sha256sum -c
          python3 - <<'PY'
          import os,pathlib,zipfile
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'new'
          for key,root,slug in [('theme','theme/src','vf-tools-theme'),('m3u8','m3u8/src','vf-tool-m3u8')]:
           src=pathlib.Path(root)
           with zipfile.ZipFile(out/(key+'.zip'),'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
            for f in sorted(src.rglob('*')):
             if f.is_file():
              rel=f.relative_to(src).as_posix()
              assert not f.is_symlink()
              if rel=='PACKAGE_PROFILE.json':continue
              z.write(f,slug+'/'+rel)
           with zipfile.ZipFile(out/(key+'.zip')) as z:
            assert z.testzip() is None
            print('S01_CANDIDATE_ZIP_PASS',key,len(z.namelist()))
          PY
      - name: Actual WordPress MariaDB upgrade rollback and reupgrade
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php8.3-mysql php8.3-xml php8.3-mbstring php8.3-curl php8.3-zip unzip curl >/dev/null
          curl -fsSLo /tmp/s01wp.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          sudo install -m755 /tmp/s01wp.phar /usr/local/bin/wp
          P="$RUNNER_TEMP/site"; mkdir -p "$P"
          wp core download --path="$P" --version=7.1.3 --allow-root --quiet
          wp config create --path="$P" --dbname=s01 --dbuser=vf --dbpass=vf --dbhost=127.0.0.1:3306 --skip-check --allow-root >/dev/null
          wp core install --path="$P" --url=http://127.0.0.1:18940 --title=S01 --admin_user=fixture --admin_password=fixture-only --admin_email=fixture@example.invalid --skip-email --allow-root >/dev/null
          wp theme install "$RUNNER_TEMP/old/vf-tools-theme_V1.35.224.zip" --activate --path="$P" --allow-root >/dev/null
          wp plugin install "$RUNNER_TEMP/old/vf-tools-ops_V1.21.1114.zip" --activate --path="$P" --allow-root >/dev/null
          wp plugin install "$RUNNER_TEMP/old/vf-tools-m3u8_V1.25.99.zip" --activate --path="$P" --allow-root >/dev/null
          wp option add s01_owner_guard preserved --path="$P" --allow-root >/dev/null
          ID="$(wp post create --post_type=post --post_status=draft --post_title='Owner fixture' --porcelain --path="$P" --allow-root)"
          wp post meta add "$ID" s01_guard untouched --path="$P" --allow-root >/dev/null
          check() {
            test "$(wp option get s01_owner_guard --path="$P" --allow-root)" = preserved
            test "$(wp post meta get "$ID" s01_guard --path="$P" --allow-root)" = untouched
            wp plugin is-active vf-ops --path="$P" --allow-root
            wp plugin is-active vf-tool-m3u8 --path="$P" --allow-root
          }
          wp theme install "$RUNNER_TEMP/new/theme.zip" --force --path="$P" --allow-root >/dev/null
          wp plugin install "$RUNNER_TEMP/new/m3u8.zip" --force --activate --path="$P" --allow-root >/dev/null
          test "$(wp theme get vf-tools-theme --field=version --path="$P" --allow-root)" = 1.35.225
          test "$(wp plugin get vf-tool-m3u8 --field=version --path="$P" --allow-root)" = 1.25.100
          cmp theme/src/inc/services/frontend-page-progress-service.php "$P/wp-content/themes/vf-tools-theme/inc/services/frontend-page-progress-service.php"
          cmp m3u8/src/public/js/product/vod-download-runtime.js "$P/wp-content/plugins/vf-tool-m3u8/public/js/product/vod-download-runtime.js"
          check; echo S01_NEW_CANDIDATES_WP_UPGRADE=PASS
          wp theme install "$RUNNER_TEMP/old/vf-tools-theme_V1.35.224.zip" --force --path="$P" --allow-root >/dev/null
          wp plugin install "$RUNNER_TEMP/old/vf-tools-m3u8_V1.25.99.zip" --force --activate --path="$P" --allow-root >/dev/null
          check
          test "$(wp theme get vf-tools-theme --field=version --path="$P" --allow-root)" = 1.35.224
          test "$(wp plugin get vf-tool-m3u8 --field=version --path="$P" --allow-root)" = 1.25.99
          echo S01_NEW_CANDIDATES_WP_ROLLBACK=PASS
          wp theme install "$RUNNER_TEMP/new/theme.zip" --force --path="$P" --allow-root >/dev/null
          wp plugin install "$RUNNER_TEMP/new/m3u8.zip" --force --activate --path="$P" --allow-root >/dev/null
          check
          test "$(wp theme get vf-tools-theme --field=version --path="$P" --allow-root)" = 1.35.225
          test "$(wp plugin get vf-tool-m3u8 --field=version --path="$P" --allow-root)" = 1.25.100
          echo S01_NEW_CANDIDATES_WP_REUPGRADE=PASS
      - name: Clean private source and synthetic fixtures
        if: always()
        run: rm -rf theme m3u8 "$RUNNER_TEMP/old" "$RUNNER_TEMP/new" "$RUNNER_TEMP/site" /tmp/s01wp.phar
