name: P07 original18 byte-exact SQL restore proof
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - task/p07-byte-exact-parity-20261112
permissions:
  contents: read
concurrency:
  group: p07-original18-byte-exact-20261112
  cancel-in-progress: false
jobs:
  binary-fingerprint-and-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      P07_EXACT_SHA: 200f532b3c9b28e0760ce75fcbdbfa19eaa73b89
    steps:
      - name: Transient exact private product checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 200f532b3c9b28e0760ce75fcbdbfa19eaa73b89
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product
      - name: Syntax, changed byte-parity tests, four DB and original18 regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C product rev-parse HEAD)" = "$P07_EXACT_SHA"
          test "$(cat product/BUILD_ID)" = "0.1.0-release146"
          python3 -B -m compileall -q product/lib product/tests
          (cd product && python3 -B -m unittest -v tests.test_p07_original_18_sql_binary_integrity)
          (cd product && python3 -B -m unittest -q tests.test_cloudpanel tests.test_p07_original_db_restore_drill tests.test_migration_final_db_shadow tests.test_migration_final_db_batch)
          (cd product && python3 -B -m unittest discover -s tests -p 'test_p07_original_18*.py' -q)
          echo P07_ORIGINAL18_BYTE_PARITY_SYNTHETIC=PASS
          echo P07_OWNER_CP2_MIGRATION=NOT_RUN
          echo P07_FORMAL_RELEASE=NO
      - name: Always remove transient private checkout
        if: always()
        shell: bash
        run: |
          rm -rf -- product
          echo P07_PRIVATE_CHECKOUT_CLEANED=YES
  native-cross-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      P07_EXACT_SHA: 200f532b3c9b28e0760ce75fcbdbfa19eaa73b89
      P07_SYNTHETIC_MARIADB: "1"
      P07_DB_TEST_HOST: 127.0.0.1
      P07_DB_TEST_PORT: "63306"
      P07_DB_TEST_PASSWORD: p07-synthetic-disposable-only-20261112
    steps:
      - name: Transient exact private product checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 200f532b3c9b28e0760ce75fcbdbfa19eaa73b89
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product
      - name: Start disposable MariaDB 11.8 and prepare native clients
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C product rev-parse HEAD)" = "$P07_EXACT_SHA"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mariadb-client
          docker pull mysql:8.4
          docker pull mariadb:11.8
          docker run --rm -d --name p07-byte-parity-maria118 --network bridge -p 127.0.0.1:63306:3306 -e "MARIADB_ROOT_PASSWORD=$P07_DB_TEST_PASSWORD" mariadb:11.8 >/dev/null
          for i in $(seq 1 100); do
            if MYSQL_PWD="$P07_DB_TEST_PASSWORD" mariadb --no-defaults -h 127.0.0.1 -P 63306 -uroot -N -e "SELECT 1" >/dev/null 2>&1; then
              echo P07_NATIVE_DISPOSABLE_MARIA118_READY=YES
              break
            fi
            sleep 2
          done
          test "$(MYSQL_PWD="$P07_DB_TEST_PASSWORD" mariadb --no-defaults -h 127.0.0.1 -P 63306 -uroot -N -e 'SELECT VERSION()' | cut -d. -f1-2)" = "11.8"
      - name: Real restricted four-database restore and foreign write refusal
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          (cd product && python3 -B -m unittest -v tests.test_p07_original_db_restore_real_mariadb)
          echo P07_NATIVE_ORIGINAL_TARGET_RESTORE=PASS
      - name: Real MySQL 8.4 to MariaDB 11.8 source shadow rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          (cd product && python3 -B -m unittest -v tests.test_p07_original_18_native_mysql84_to_mariadb118)
          echo P07_NATIVE_CROSS_ENGINE_ROLLBACK=PASS
          echo P07_OWNER_CP2_MIGRATION=NOT_RUN
          echo P07_FORMAL_RELEASE=NO
      - name: Always remove disposable DB and private checkout
        if: always()
        shell: bash
        run: |
          docker rm -f p07-byte-parity-maria118 >/dev/null 2>&1 || true
          rm -rf -- product
          echo P07_NATIVE_PRIVATE_CLEANUP=YES
