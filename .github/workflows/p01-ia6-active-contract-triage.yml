name: p01-ia6-active-contract-triage-temporary
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-ia6-active-contract-triage.yml']
permissions:
  contents: read
jobs:
  twelve-contracts:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SOURCE_SHA: c879bb71e66efdbb4c65c3220a7284dde9faa903
    steps:
      - name: Checkout public safe runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Evaluate 12 potentially active contract failures
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd >/dev/null
          ROOT="$(mktemp -d /tmp/p01-ia6-triage.XXXXXXXX)"
          trap 'rm -rf "$ROOT"' EXIT
          git clone -q --depth 1 --branch fix/p01-v247493-owner-dialog-save-ux "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" "$ROOT/code"
          git -C "$ROOT/code" remote set-url origin https://github.com/llhzx2018/vf-start.git
          test "$(git -C "$ROOT/code" rev-parse HEAD)" = "$SOURCE_SHA"
          unset READ_TOKEN
          echo "P01_TRIAGE_SOURCE=$SOURCE_SHA"
          cd "$ROOT/code"
          FILES=(
            backup_missing_history_readonly_audit_native.php
            backup_missing_protection_guard_native.php
            frontstage_category_management_r5_contract.php
            p01_ia_v2_r4_channels_watch_frontstage_contract.php
            p01_ia_v3_r2_panel_return_contract.php
            p01_ia_v3_r3_daily_management_contract.php
            p01_ia_v3_r4_frontstage_source_boundary_contract.php
            p01_ia_v3_r5_daily_shortcuts_contract.php
            p01_r2_frontstage_panel_lifecycle_contract.php
            shared_dialog_foundation_r1_contract.php
            workspace_atomic_form_routing_contract.php
            workspace_delete_undo_contract.php
          )
          FAIL=0
          for name in "${FILES[@]}"; do
            if php "tests/unit/$name" >"$ROOT/one.log" 2>&1; then
              echo "P01_ACTIVE_TRIAGE=PASS FILE=$name"
            else
              FAIL=$((FAIL+1))
              DETAIL="$(grep -m1 -E 'RuntimeException|Assertion|Fatal error|Uncaught|Warning|Error:' "$ROOT/one.log" || true)"
              DETAIL="$(printf '%s' "$DETAIL" | sed "s@$ROOT/code@<CANDIDATE>@g" | cut -c1-260)"
              echo "P01_ACTIVE_TRIAGE=FAIL FILE=$name MESSAGE=$DETAIL"
            fi
          done
          echo "P01_ACTIVE_TRIAGE_FAIL_COUNT=$FAIL"
          test "$FAIL" -eq 0
