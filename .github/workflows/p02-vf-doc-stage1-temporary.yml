name: TEMP P02 vf-doc Stage1 exact-source test
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/p02-vf-doc-stage1-temporary.yml]
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: {engine: [sqlite]}
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      APP_ALLOWED_HOSTS: localhost
      DB_CONNECTION: ${{ matrix.engine }}
      DB_DATABASE: ${{ matrix.engine == 'sqlite' && ':memory:' || 'vfdoc_ci' }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.engine == 'mariadb' && '3307' || '3306' }}
      DB_USERNAME: root
      DB_PASSWORD: synthetic_m01
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-doc
          ref: 2a58d9d8d817cb801a1a71f866de47973b4a4f01
          path: target
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_mysql, dom, xml, zip
          tools: composer:v2
          coverage: none
      - name: Verify source identity, guards and PHP syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = 2a58d9d8d817cb801a1a71f866de47973b4a4f01
          if (cd target &&
              python3 -B scripts/check_bootstrap.py &&
              python3 -B scripts/check_source_contract.py &&
              python3 -m unittest discover -s tests -p test_bootstrap.py &&
              python3 -m unittest discover -s tests/guards -p 'test_*.py' &&
              python3 -m unittest discover -s tests/evolution -p test_second_module.py &&
              find app routes config database/migrations -name '*.php' -type f -print0 | xargs -0 -n1 php -l) >"$RUNNER_TEMP/p02-guards.log" 2>&1; then
            echo P02_GUARDS=PASS
          else
            echo P02_GUARDS=FAIL
            exit 1
          fi
      - name: Isolated Composer dependency resolution
        shell: bash
        run: |
          set -Eeuo pipefail
          if (cd target && composer update --no-interaction --prefer-dist --no-progress --no-audit) >"$RUNNER_TEMP/p02-composer.log" 2>&1; then
            echo P02_COMPOSER=PASS
          else
            echo P02_COMPOSER=FAIL
            exit 1
          fi
      - name: Fresh engine schema (new synthetic DB only)
        shell: bash
        run: |
          set -Eeuo pipefail
          if (cd target && cp .env.example .env && php artisan key:generate --force && php artisan migrate --force) >"$RUNNER_TEMP/p02-migrate.log" 2>&1; then
            echo P02_MIGRATE=PASS
          else
            echo P02_MIGRATE=FAIL
            if grep -q SQLSTATE "$RUNNER_TEMP/p02-migrate.log"; then echo P02_DB_SQLSTATE=FAIL; fi
            exit 1
          fi
      - name: Native Laravel PHPUnit test suite
        shell: bash
        run: |
          set -Eeuo pipefail
          if (cd target && composer test) >"$RUNNER_TEMP/p02-php.log" 2>&1; then
            echo P02_NATIVE_PHP=PASS
          else
            echo P02_NATIVE_PHP=FAIL
            python3 -c "import pathlib,re,os; s=pathlib.Path(os.environ['RUNNER_TEMP']+'/p02-php.log').read_text(errors='replace'); s=re.sub(r'\x1b\[[0-9;]*m','',s); print('P02_TEST_COUNTS='+next((ln.split('Tests:',1)[-1].strip()[:100] for ln in s.splitlines() if 'Tests:' in ln),'UNKNOWN')); names=re.findall(r'(?:FAIL|FAILED)\s+(Tests\\[A-Za-z\\]+)(?:\s+>\s+([A-Za-z_ ]+))?',s); print('P02_FAIL_GROUPS='+','.join(sorted(set(n[0].split('\\')[1] if '\\' in n[0] else 'unknown' for n in names)))[:100]); print('P02_ERROR_CLASSES='+','.join(sorted(set(re.findall(r'(?:Exception|Error):\s*([A-Za-z_\\]+)',s))))[:90]))" || true
            grep -Eo 'Class "[A-Za-z_\\][A-Za-z0-9_\\]*" not found' "$RUNNER_TEMP/p02-php.log" | head -2 | sed 's/^Class /P02_CLASS_NOT_FOUND=/' || true
            if test -x target/vendor/bin/phpunit; then echo P02_PHPUNIT_BINARY_PRESENT=YES; else echo P02_PHPUNIT_BINARY_PRESENT=NO; fi
            if grep -Eq 'Class .*Tests\\\\' "$RUNNER_TEMP/p02-php.log"; then echo P02_MISSING_CLASS_ROOT=Tests
            elif grep -Eq 'Class .*App\\\\' "$RUNNER_TEMP/p02-php.log"; then echo P02_MISSING_CLASS_ROOT=App
            elif grep -Eq 'Class .*PHPUnit\\\\' "$RUNNER_TEMP/p02-php.log"; then echo P02_MISSING_CLASS_ROOT=PHPUnit
            elif grep -Eq 'Class .*Illuminate\\\\' "$RUNNER_TEMP/p02-php.log"; then echo P02_MISSING_CLASS_ROOT=Illuminate
            elif grep -Eq 'Class .*Inertia\\\\' "$RUNNER_TEMP/p02-php.log"; then echo P02_MISSING_CLASS_ROOT=Inertia
            else echo P02_MISSING_CLASS_ROOT=Other; fi
            for e in "MissingAppKeyException" "Vite manifest not found" "No application encryption key" "TypeError" "QueryException" "ErrorException" "BadMethodCallException" "BindingResolutionException" "Class .* not found" "Undefined array key" "There were" "There was"; do
              if grep -Eiq "$e" "$RUNNER_TEMP/p02-php.log"; then
                echo "P02_PHP_FAILURE_FINGERPRINT=$e"
              fi
            done
            grep -Eo 'Tests: [0-9]+( failed, [0-9]+ passed| passed)' "$RUNNER_TEMP/p02-php.log" | tail -1 || true
            sed -n -E 's/.*Tests: ([0-9]+ failed, )?([0-9]+ passed).*/P02_TEST_SUMMARY=\1\2/p' "$RUNNER_TEMP/p02-php.log" | tail -2 || true
            grep -Eo 'test_[a-z_]+[[:space:]]*\(Tests\\[^)]*\)' "$RUNNER_TEMP/p02-php.log" | head -5 || true
            exit 1
          fi
      - name: Always clean private source
        if: always()
        shell: bash
        run: |
          rm -rf target
          rm -f "$RUNNER_TEMP/p02-guards.log" "$RUNNER_TEMP/p02-php.log" "$RUNNER_TEMP/p02-composer.log" "$RUNNER_TEMP/p02-migrate.log"
          test ! -e target && echo P02_PRIVATE_CLEAN=PASS

  frontend:
    if: false # PHP test failure diagnosis only; prior exact source frontend PASS is reusable
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-doc
          ref: 2a58d9d8d817cb801a1a71f866de47973b4a4f01
          path: target
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with: {version: '10.20.0', run_install: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - name: pnpm resolves dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = 2a58d9d8d817cb801a1a71f866de47973b4a4f01
          if (cd target && pnpm install --no-frozen-lockfile) >"$RUNNER_TEMP/p02-pnpm.log" 2>&1; then
            echo P02_PNPM_RESOLVED=PASS
          else
            echo P02_PNPM_RESOLVED=FAIL
            exit 1
          fi
      - name: Vue TypeScript check (redacted)
        shell: bash
        run: |
          set -Eeuo pipefail
          if (cd target && pnpm run typecheck) >"$RUNNER_TEMP/p02-types.log" 2>&1; then
            echo P02_TYPES=PASS
          else
            echo P02_TYPES=FAIL
            grep -Eo 'resources/js/[A-Za-z0-9_/-]+\.(ts|vue)\([0-9]+,[0-9]+\): error TS[0-9]{4}' "$RUNNER_TEMP/p02-types.log" | head -6 || true
            exit 1
          fi
      - name: Vitest and Vite asset build (redacted)
        shell: bash
        run: |
          set -Eeuo pipefail
          if (cd target && pnpm run test:frontend && pnpm run build) >"$RUNNER_TEMP/p02-ui.log" 2>&1; then
            echo P02_FRONTEND=PASS
          else
            echo P02_FRONTEND=FAIL
            exit 1
          fi
      - name: Always clean private source
        if: always()
        shell: bash
        run: |
          rm -rf target
          rm -f "$RUNNER_TEMP/p02-ui.log" "$RUNNER_TEMP/p02-pnpm.log" "$RUNNER_TEMP/p02-types.log"
          test ! -e target && echo P02_PRIVATE_CLEAN=PASS
