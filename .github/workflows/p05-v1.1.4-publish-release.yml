name: P05 V1.1.4 Publish Release

on:
  push:
    branches:
      - gate/p05-v114-owner-takeover-20260830
    paths:
      - '.github/workflows/p05-v1.1.4-publish-release.yml'

permissions:
  actions: read
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      SOURCE_RUN: '33307262066'
      ARTIFACT_NAME: P05_V1.1.4_MAIN_RELEASE
      RELEASE_TAG: v1.1.4
      RELEASE_TITLE: P05 · VF SEO v1.1.4 · Browser Owner Setup Repair
      RELEASE_ASSET: VF_SEO_V1.1.4_FULL.zip
      RECEIPT_ASSET: VF_SEO_V1.1.4_RELEASE_RECEIPT.txt
      P05_MAIN_SHA: 2dfe41e88ddb4dbe8f8877accde7e7c964aeef30
      EXPECTED_SHA256: 3fe77ebbb20963c8ff013cdc847d805bb6299d5a700497a1d6a1751ee15c2a3d
      EXPECTED_BYTES: '240157'
      RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify release write token
        run: test -n "$RELEASE_WRITE_TOKEN"

      - name: Download exact main release artifact
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/p05-v114-publish"
          mkdir -p "$OUT"
          gh run download "$SOURCE_RUN" -R llhzx2018/core-free-runner-public -n "$ARTIFACT_NAME" -D "$OUT"
          test -f "$OUT/$RELEASE_ASSET"
          test -f "$OUT/$RECEIPT_ASSET"
          test "$(sha256sum "$OUT/$RELEASE_ASSET" | awk '{print $1}')" = "$EXPECTED_SHA256"
          test "$(stat -c %s "$OUT/$RELEASE_ASSET")" = "$EXPECTED_BYTES"
          grep -Fxq "P05_V114_MAIN_RELEASE_MACHINE=PASS" "$OUT/$RECEIPT_ASSET"
          grep -Fxq "P05_EXACT_MAIN=$P05_MAIN_SHA" "$OUT/$RECEIPT_ASSET"
          grep -Fxq "P05_BROWSER_OWNER_TAKEOVER=PASS" "$OUT/$RECEIPT_ASSET"
          grep -Fxq "P05_EXISTING_DATA_PROTECTION=PASS" "$OUT/$RECEIPT_ASSET"
          echo P05_V114_PUBLISH_ARTIFACT_IDENTITY=PASS

      - name: Publish GitHub Release v1.1.4
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/p05-v114-publish"
          if gh release view "$RELEASE_TAG" -R llhzx2018/vf-seo >/dev/null 2>&1; then
            echo RELEASE_ALREADY_EXISTS
            exit 1
          fi
          cat > "$RUNNER_TEMP/release-notes.txt" <<'EOF'
          P05 v1.1.4 fixes the browser ownership gap seen when a pre-browser-first/CLI-created empty P05 database already contains one administrator but the owner never had a browser flow to choose that administrator password.

          For that narrowly-scoped unfinished state (one active administrator, no setup lock, and no project/website/provider-account data), opening the site now routes to /setup and displays “设置管理员密码”. The owner can choose the administrator username and a new password without knowing the old generated/test password. SQLite is preserved, existing sessions are cleared, and the private setup lock is written after completion.

          This is not a general unauthenticated password-reset endpoint: an existing setup lock or any real owner data keeps the takeover path closed. The v1.1.3 legacy session repair remains included.

          Normal installation remains: upload FULL ZIP → extract → open domain → browser setup. No SSH, no CLI, no manual .env, and no deleting SQLite are required for the supported empty-legacy takeover path.

          Distribution remains FULL_ONLY, Schema remains VF-SEO-SCHEMA@1 / 1, and Production remains NOT_DEPLOYED.
          EOF
          gh release create "$RELEASE_TAG" \
            "$OUT/$RELEASE_ASSET#$RELEASE_ASSET" \
            "$OUT/$RECEIPT_ASSET#$RECEIPT_ASSET" \
            -R llhzx2018/vf-seo \
            --target "$P05_MAIN_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file "$RUNNER_TEMP/release-notes.txt"
          echo P05_V114_GITHUB_RELEASE_WRITE=PASS

      - name: Final remote release readback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          JSON="$(gh api repos/llhzx2018/vf-seo/releases/tags/$RELEASE_TAG)"
          test "$(jq -r .tag_name <<<"$JSON")" = "$RELEASE_TAG"
          test "$(jq -r .target_commitish <<<"$JSON")" = "$P05_MAIN_SHA"
          test "$(jq -r .draft <<<"$JSON")" = false
          test "$(jq -r .prerelease <<<"$JSON")" = false
          FULL="$(jq -c --arg n "$RELEASE_ASSET" '.assets[] | select(.name==$n)' <<<"$JSON")"
          RECEIPT="$(jq -c --arg n "$RECEIPT_ASSET" '.assets[] | select(.name==$n)' <<<"$JSON")"
          test -n "$FULL"
          test -n "$RECEIPT"
          test "$(jq -r .size <<<"$FULL")" = "$EXPECTED_BYTES"
          test "$(jq -r .digest <<<"$FULL")" = "sha256:$EXPECTED_SHA256"
          echo "P05_V114_RELEASE_ID=$(jq -r .id <<<"$JSON")"
          echo "P05_V114_FULL_ASSET_ID=$(jq -r .id <<<"$FULL")"
          echo "P05_V114_RECEIPT_ASSET_ID=$(jq -r .id <<<"$RECEIPT")"
          echo "P05_V114_PUBLISHED_AT=$(jq -r .published_at <<<"$JSON")"
          echo P05_V114_RELEASE_REMOTE_READBACK=PASS
