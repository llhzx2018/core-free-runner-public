name: S01-C01 navigation formal release
on:
  push:
    branches: [task/s01-c01-navigation-13574-formal]
permissions:
  contents: read
  actions: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_REPO: 'llhzx2018/vf-tools-theme'
      TARGET_VERSION: '1.35.74'
      TARGET_SHA: '9038f1234a9bdab767422d793cf91fcf4afe679a'
      TARGET_TREE: 'f684f8ebe188a33d9ec00d0eb10cd1aa61efae62'
      SOURCE_VERSION: '1.35.73'
      BASE_SHA: '56698b5abac9da78e9ac7a7a963decf77f6f03ef'
      CANDIDATE_RUN: '37140267343'
      CANDIDATE_SHA: 'c21e6f3cef50c1887745fca91a61cc244e914ce9'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runner
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Reverse verify exact tested tree and rebuilt bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$CANDIDATE_RUN --jq .conclusion)" = success
          gh run download "$CANDIDATE_RUN" --repo llhzx2018/core-free-runner-public --name "s01-c01-navigation-candidate-$CANDIDATE_RUN" --dir tested
          jq -e --arg sha "$CANDIDATE_SHA" --arg tree "$TARGET_TREE" --arg ver "$TARGET_VERSION" '.status=="PASS" and .source_sha==$sha and .source_tree==$tree and .version==$ver and .upgrade=="PASS" and .source_rollback=="PASS" and .wordpress_browser=="PASS" and .fixture_browser=="PASS" and .security_boundary=="PASS" and .frozen_shell_header_menu=="PASS" and .navigation_native_cases==6 and .navigation_fixture_cases==30 and .navigation_tabs=="PASS" and .navigation_controls=="PASS" and .navigation_draft_preservation=="PASS" and .navigation_form_preservation=="PASS" and .navigation_persistence=="PASS" and .navigation_csrf=="PASS" and .navigation_revision_conflict=="PASS" and .navigation_invalid_url=="PASS" and .navigation_keyboard=="PASS"' tested/FINAL_EVIDENCE.json >/dev/null
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          cp -a runner/lanes/s01-c01-navigation-13574 lane
          python3 lane/build.py
          python3 - <<'PY'
          import json,pathlib
          tested=json.loads(pathlib.Path('tested/FINAL_EVIDENCE.json').read_text()); built=json.loads(pathlib.Path('proof/identity.json').read_text())
          for key in ['asset','asset_bytes','asset_sha256','source_tree','version']: assert tested[key]==built[key],key
          PY
      - name: Publish private formal Release and exact remote readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          ASSET="vf-tools-theme_V${TARGET_VERSION}.zip"; TAG="v$TARGET_VERSION"
          cat > /tmp/release-notes.md <<EOF
          VF Tools Theme V$TARGET_VERSION

          导航与页脚页：恢复原有“菜单绑定、页头与移动、页脚、验证结果”四项操作入口，修复旧样式隐藏入口后分区无法进入的问题。每次只展开一个操作区，切换保留填写内容。
          六个菜单位置与当前编辑区整理为清晰的选择和编辑区域，语言缺失明细可收起。保存入口移至内容下方；桌面控件至少 40px、手机至少 44px，复选框和单选框 20×20px，下拉框保留原生箭头，内容左右留白一致；复选框方形、单选框圆形，选中标签与当前显示分区保持一致，切换即时显示选中底色。
          同时补齐导航页现有正式样式模块的加载，修复“已保存却提示响应式变量未通过”的误报；真实失败状态仍保留。
          原有导航保存处理、权限和 nonce、版本冲突、字段与配置契约保持；壳、头部、主菜单冻结。
          Exact candidate Run: $CANDIDATE_RUN。30 组源代码渲染用例（120 个分区状态）、6 宽度真实隔离 WordPress 控件和键盘检查、真实保存与刷新持久化、无效 URL/nonce/访客/版本冲突拒绝，以及 $SOURCE_VERSION→$TARGET_VERSION 原生升级、恢复旧版、重新应用新版通过。
          OWNER 验收范围为 UX/UI；机器检查不替代升级后 OWNER 视觉裁决。发布前独立 Preview Runtime 按项目 SSOT 为 N_A。
          Exact promoted source: $TARGET_SHA; tree: $TARGET_TREE。
          EOF
          if gh release view "$TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            test "$(gh api repos/$TARGET_REPO/git/ref/tags/$TAG --jq .object.sha)" = "$TARGET_SHA"
          else
            gh release create "$TAG" "proof/$ASSET" --repo "$TARGET_REPO" --target "$TARGET_SHA" --title "VF Tools Theme V$TARGET_VERSION" --notes-file /tmp/release-notes.md
          fi
          gh api "repos/$TARGET_REPO/releases/tags/$TAG" > proof/remote-release.json
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/$TAG --jq .object.sha)" = "$TARGET_SHA"
          mkdir readback
          gh release download "$TAG" --repo "$TARGET_REPO" --pattern "$ASSET" --dir readback
          cmp "proof/$ASSET" "readback/$ASSET"
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('proof'); m=json.loads((p/'identity.json').read_text());r=json.loads((p/'remote-release.json').read_text());t=json.loads(pathlib.Path('tested/FINAL_EVIDENCE.json').read_text());assert not r['draft'] and not r['prerelease'];a=[a for a in r['assets'] if a['name']==m['asset']];assert len(a)==1 and a[0]['size']==m['asset_bytes'] and a[0]['digest']=='sha256:'+m['asset_sha256'];m.update(release_id=r['id'],asset_id=a[0]['id'],released_at=r['published_at'],runtime_files=t['runtime_files'],runtime_fingerprint=t['runtime_fingerprint'],candidate_run=t['candidate_run'],formal_release='PASS',remote_readback='PASS',distribution='NOT_EXECUTED',production='NOT_EXECUTED');(p/'RELEASE_RECEIPT.json').write_text(json.dumps(m,indent=2));print(json.dumps(m))
          PY
      - name: Public-safe receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c01-navigation-release-${{ github.run_id }}
          path: proof/RELEASE_RECEIPT.json
          retention-days: 30
          if-no-files-found: error
      - name: Private workspace cleanup
        if: always()
        run: rm -rf target readback proof/*.zip
