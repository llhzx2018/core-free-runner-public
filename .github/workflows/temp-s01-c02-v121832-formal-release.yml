name: TEMP S01-C02 Ops 1.21.832 Formal Release
on:
  push:
    branches:
      - temp/s01-c02-v121832-formal-release-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121832-formal-release.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PRODUCT_REPO: llhzx2018/vf-tools-ops
      COMMIT: 02fb592cc6aacfcf8c0a39c9a648a08977820b44
      TREE: b90f4de92921860b62d9f36f3292e8138f6ba951
      TAG: v1.21.832
      ASSET: vf-tools-ops_V1.21.832.zip
      BYTES: '3260422'
      SHA256: baf078107c601ab8630c22685131087756f854b68c1b4b81501234cd012dd460
      FILES: '914'
      FP: 833db33ff1e14b43f679770c27e6bad5750e06617e7d1e195718281cf0476ac8
    steps:
      - name: Verify authority gates and release absence
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for b in main develop; do
            B="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$PRODUCT_REPO/branches/$b")"
            test "$(jq -r .commit.sha <<<"$B")" = "$COMMIT"
            test "$(jq -r .commit.commit.tree.sha <<<"$B")" = "$TREE"
          done
          release_code="$(curl -sS -o /tmp/release.json -w '%{http_code}' -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$PRODUCT_REPO/releases/tags/$TAG")"
          test "$release_code" = 404
          tag_code="$(curl -sS -o /tmp/ref.json -w '%{http_code}' -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$PRODUCT_REPO/git/ref/tags/$TAG")"
          test "$tag_code" = 404
          J="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/core-free-runner-public/git/ref/heads/main)"
          test "$(jq -r .object.sha <<<"$J")" = '0160b557ad4ae0e8c6acd97e7551285bc05870bd'
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.COMMIT }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops
      - name: Rebuild exact artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$COMMIT"
          test "$(git -C ops rev-parse HEAD^{tree})" = "$TREE"
          python3 - <<'PY'
          import re,hashlib,zipfile,os
          from pathlib import Path
          root=Path('ops'); files={}
          def ok(r):
            p=r.as_posix(); q=p.split('/')
            if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in q): return False
            if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',p,re.I): return False
            if '/' not in p: return p in {'vf-ops.php','uninstall.php'}
            return q[0] in {'includes','assets','languages','config'}
          for s in root.rglob('*'):
            if s.is_file() and not s.is_symlink():
              r=s.relative_to(root)
              if ok(r): files[r.as_posix()]=s.read_bytes()
          files=dict(sorted(files.items())); fp=hashlib.sha256()
          for r,b in files.items(): fp.update((r+'\0'+hashlib.sha256(b).hexdigest()+'\n').encode())
          z=Path('/tmp/'+os.environ['ASSET'])
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as out:
            for r,b in files.items():
              info=zipfile.ZipInfo('vf-ops/'+r,(2026,9,5,0,0,0)); info.compress_type=zipfile.ZIP_DEFLATED; info.external_attr=0o100644<<16; out.writestr(info,b)
          assert z.stat().st_size == int(os.environ['BYTES'])
          assert hashlib.sha256(z.read_bytes()).hexdigest() == os.environ['SHA256']
          assert len(files) == int(os.environ['FILES'])
          assert fp.hexdigest() == os.environ['FP']
          PY
          unzip -tq "/tmp/$ASSET" >/dev/null
      - name: Create formal tag release and asset
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          VF Tools Ops V1.21.832 closes the read-only Tail Replay Probe runtime dependency gap.

          - Focused Gate 33987885429 PASS on exact source 02fb592cc6aacfcf8c0a39c9a648a08977820b44 / tree b90f4de92921860b62d9f36f3292e8138f6ba951; deterministic Artifact Identity 33987925830 PASS.
          - V1.21.831 correctly identified a terminal recovered Candidate Stage-4 failure but its REST probe could not run because the lightweight publish_zip graph did not guarantee Candidate Path Filter / Entry Processor classes.
          - V1.21.832 reuses the already-proven V1.21.828 full ZIP execution runtime only during the public readiness readback, then reruns the unchanged V1.21.831 in-memory tail probe.
          - The layer is read-only: no Candidate retry, no Source ZIP upload/mutation, no WordPress content write, no Final Audit relaxation and no Candidate/package/finalOnline PASS forcing.
          - Public telemetry adds only tail-probe runtime readiness; existing probe output remains relative index, broad entry kind, processing phase and allowlisted Throwable class. No job identity, local path, filename, URL, Source SHA or raw error is exposed.
          - Production before upgrade remains 1.21.831 Candidate FAIL at Stage 4, offset 225/231, Candidate package unavailable, Source reusable, manualSourceUploadRequired=false and finalOnlinePass=NO.
          - M3U8 migration/data, Seed HOLD, JD.gg, WPvivid, schema, content governance and DNS are untouched.
          - Asset vf-tools-ops_V1.21.832.zip; 3260422 bytes; SHA256 baf078107c601ab8630c22685131087756f854b68c1b4b81501234cd012dd460; runtime files 914; fingerprint 833db33ff1e14b43f679770c27e6bad5750e06617e7d1e195718281cf0476ac8.
          - Production upgrade is NOT executed by this GitHub Release.
          EOF
          gh release create "$TAG" "/tmp/$ASSET" --repo "$PRODUCT_REPO" --target "$COMMIT" --title 'VF Tools Ops v1.21.832' --notes-file /tmp/release-notes.md
