name: P08 v013 official issuance after final native 3DB FULL and old PHP proof
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p08-v013-official-issuance.yml
      - scripts/p08_v013_issue_build_inputs.sh
      - scripts/p08_v013_official_release_once.py
permissions:
  contents: read
jobs:
  final-real-full-three-db:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-v013-final-official-issuance-20261120' && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: sqlite
            image: mysql:8.4
            health: mysqladmin ping --silent
          - kind: mysql
            image: mysql:8.4
            health: mysqladmin ping --silent
          - kind: mariadb
            image: mariadb:11.8
            health: healthcheck.sh --connect --innodb_initialized
    services:
      db:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: p08-v013-only-isolated
          MYSQL_ROOT_HOST: '%'
          MARIADB_ROOT_PASSWORD: p08-v013-only-isolated
          MARIADB_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=10s
          --health-timeout=6s
          --health-retries=18
    env:
      P08_ISOLATED_INSTALL_TEST: YES
      PYTHONDONTWRITEBYTECODE: '1'
      P08_TEST_DB_DRIVER: ${{ matrix.kind }}
      P08_TEST_DB_HOST: 127.0.0.1
      P08_TEST_DB_USER: root
      P08_TEST_DB_PASSWORD: p08-v013-only-isolated
      P08_TEST_DB_CLEAN: p08_ci_013_final_clean
      P08_TEST_DB_DIRTY: p08_ci_013_final_dirty
    steps:
      - name: Exact final P08 merged main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 8b385fecd132a02ac79f5b67e670783e98997c3e
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
      - name: Exact effective GOV-DOC Mode U
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 74c4090c93cea7ef6a55c7b17d39515e7ca8710c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov
      - name: PHP 8.4 and native modules
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: zip,curl,mbstring,pdo_mysql,pdo_sqlite,sqlite3,openssl,posix,dom,intl,fileinfo
          coverage: none
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native disposable SQL fixtures
        if: matrix.kind != 'sqlite'
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 420 sudo apt-get -qq update
          timeout 420 sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y mariadb-client
          mariadb -h127.0.0.1 -uroot -p"$P08_TEST_DB_PASSWORD" -e \
            'CREATE DATABASE p08_ci_013_final_clean; CREATE DATABASE p08_ci_013_final_dirty; CREATE TABLE p08_ci_013_final_dirty.synthetic_dirty(id integer primary key);'
      - name: Actual FINAL SHA clean FULL ZIP extracted first install and safety regression
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(id -u)" != 0
          test "$(git -C target rev-parse HEAD)" = 8b385fecd132a02ac79f5b67e670783e98997c3e
          test "$(git -C target rev-parse HEAD^{tree})" = 32b8722fbfaff3e988e69693510be0c1e6df8bba
          test "$(git -C gov rev-parse HEAD)" = 74c4090c93cea7ef6a55c7b17d39515e7ca8710c
          test "$(cat target/VERSION)" = 0.1.13
          grep -Fq '| skill-release | V3.20 |' gov/CURRENT.md
          npm ci --prefix target --ignore-scripts --no-fund --no-audit
          npm run build --prefix target
          composer --working-dir=target install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress --optimize-autoloader
          python3 -B target/scripts/check_stack_contract.py --phase full --root target
          ( cd target
            git diff --exit-code
            for f in $(git ls-files --others --exclude-standard); do
              case "$f" in
                bootstrap/cache/packages.php|bootstrap/cache/services.php) test -f "$f" && ! test -L "$f" && rm -- "$f" ;;
                *) echo P08_V013_UNEXPECTED_SOURCE_GENERATION; exit 27 ;;
              esac
            done
            test -z "$(git status --porcelain --untracked-files=all)"
          )
          tmp="$RUNNER_TEMP/p08-v013-final-full-${{ matrix.kind }}"
          site="$RUNNER_TEMP/p08-v013-final-clean-${{ matrix.kind }}"
          mkdir -m 700 "$tmp" "$site"
          for phase in first second; do
            python3 -B target/scripts/build_full.py --source "$GITHUB_WORKSPACE/target" \
              --output "$tmp/full-$phase.zip" --version 0.1.13 \
              --source-sha 8b385fecd132a02ac79f5b67e670783e98997c3e \
              --governance-root "$GITHUB_WORKSPACE/gov"
          done
          cmp "$tmp/full-first.zip" "$tmp/full-second.zip"
          test "$(sha256sum "$tmp/full-first.zip" | cut -d' ' -f1)" = f8075f065d1413c984f80ef7531242cfc894bf272e90f6d89282074f6617c1ec
          unzip -tqq "$tmp/full-first.zip"
          unzip -q "$tmp/full-first.zip" -d "$site"
          mkdir -p "$site/tests/compatibility"
          cp target/tests/test_install_sqlite_e2e.php target/tests/test_install_mysql_e2e.php "$site/tests/"
          cp target/tests/compatibility/r101_complete_schema.php "$site/tests/compatibility/"
          test ! -e "$site/.env"
          if [ "${{ matrix.kind }}" = sqlite ]; then
            php "$site/tests/test_install_sqlite_e2e.php"
          else
            php "$site/tests/test_install_mysql_e2e.php"
          fi
          test "$(readlink "$site/current")" = releases/8b385fecd132a02ac79f5b67e670783e98997c3e
          test "$(cat "$site/current/VERSION")" = 0.1.13
          test "$(sha256sum "$site/current/FULL_MANIFEST.json" | cut -d' ' -f1)" = \
            "$(unzip -p "$tmp/full-first.zip" FULL_MANIFEST.json | sha256sum | cut -d' ' -f1)"
          echo "P08_V013_FINAL_MERGED_MAIN_REAL_FULL_${{ matrix.kind }}=PASS"
      - name: Always dispose real private source, DB site and temporary packages
        if: always()
        shell: bash
        run: |
          rm -rf -- target gov "$RUNNER_TEMP/p08-v013-final-full-${{ matrix.kind }}" \
            "$RUNNER_TEMP/p08-v013-final-clean-${{ matrix.kind }}"
          test ! -e target && test ! -e gov
          echo "P08_V013_FINAL_MERGED_MAIN_REAL_FULL_${{ matrix.kind }}_CLEANUP=PASS"

  official-release-once:
    needs: [final-real-full-three-db]
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-v013-final-official-issuance-20261120' && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      P08_ISOLATED_INSTALL_TEST: YES
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout one-shot approved public-safe publisher source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout final merged P08 main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 8b385fecd132a02ac79f5b67e670783e98997c3e
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
      - name: Checkout real shipped previous v012 PHP
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: dac7bc1d5410c077f32e522eb5740537f618ef9d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: old
      - name: Checkout effective GOV-DOC
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 74c4090c93cea7ef6a55c7b17d39515e7ca8710c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov
      - name: PHP 8.4 and native modules
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: zip,curl,mbstring,pdo_mysql,pdo_sqlite,sqlite3,openssl,posix,dom,intl,fileinfo
          coverage: none
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Required old original native database tools
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 420 sudo apt-get -qq update
          timeout 420 sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y mariadb-client sqlite3
          command -v sqlite3 && command -v mariadb-dump
      - name: Rebuild actual issued 607b origin and final official input archives without publishing
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          bash scripts/p08_v013_issue_build_inputs.sh
      - name: Issue once only after exact SOURCE 3DB/GOV/official previous and remote absence gates
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          P08_V013_RELEASE_ONCE: YES
        run: |
          set -Eeuo pipefail
          python3 scripts/p08_v013_official_release_once.py
      - name: Mandatory private source, package and temp cleanup
        if: always()
        shell: bash
        run: |
          rm -rf -- target old gov "$RUNNER_TEMP/p08-v013-immutable-issue" \
            "$RUNNER_TEMP/p08-r129-real-issued-r131-r155-sqlite-issue"
          test ! -e target && test ! -e old && test ! -e gov
          echo P08_V013_ISSUANCE_DISPOSABLE_PRIVATE_CONTENT_CLEANED=PASS
