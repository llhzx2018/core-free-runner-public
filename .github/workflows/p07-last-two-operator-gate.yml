name: P07 last-two migration operator synthetic gate
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-last-two-operator-gate.yml'
      - 'experiments/p07-release113-last-two-stage.py'
      - 'experiments/p07-last-two-operator-tests.py'
      - 'experiments/p07-www3-source-schema-advisory.py'
      - 'experiments/p07-www3-byte-context-tests.py'
      - 'experiments/p07-sql-raw-byte-advisory.py'
      - 'experiments/p07-sql-byte-and-guard-tests.py'
      - 'experiments/p07-source-ddl-sighting.py'
      - 'experiments/p07-source-ddl-sighting-tests.py'
      - 'experiments/p07-www3-isolated-restore.py'
      - 'experiments/p07-www3-isolated-restore-tests.py'
      - 'experiments/p07-www3-restored-readback.py'
      - 'experiments/p07-www3-restored-readback-tests.py'
      - 'experiments/p07-www3-live-source-count-parity.py'
      - 'experiments/p07-www3-live-source-count-parity-tests.py'
      - 'experiments/p07-www3-content-worker.py'
      - 'experiments/p07-www3-content-worker-tests.py'
      - 'experiments/p07-www3-live-row-content-parity.py'
      - 'experiments/p07-www3-live-row-content-parity-tests.py'
      - 'experiments/p07-www3-three-table-type-worker.py'
      - 'experiments/p07-www3-three-table-field-diagnosis.py'
      - 'experiments/p07-www3-three-table-field-diagnosis-tests.py'
      - 'experiments/p07-www3-fourfield-one-command.sh'
      - 'experiments/p07-www3-fourfield-values-worker.py'
      - 'experiments/p07-www3-fourfield-value-difference.py'
      - 'experiments/p07-www3-fourfield-value-difference-tests.py'
      - 'experiments/p07-www3-fourfield-values-one-command.sh'
      - 'experiments/p07-www3-eight-ordinal-type-worker.py'
      - 'experiments/p07-www3-eight-ordinal-diagnostic.py'
      - 'experiments/p07-www3-eight-ordinal-diagnostic-tests.py'
      - 'experiments/p07-two-pending-live-db-worker.py'
      - 'experiments/p07-two-pending-live-db-parity.py'
      - 'experiments/p07-two-pending-live-db-parity-tests.py'
      - 'experiments/p07-ilovem3u8-single-table-pk-worker.py'
      - 'experiments/p07-ilovem3u8-target-excess-key-classify.py'
      - 'experiments/p07-ilovem3u8-target-excess-key-classify-tests.py'
      - 'experiments/p07-ilovem3u8-isolated-source-restore.py'
      - 'experiments/p07-ilovem3u8-isolated-source-restore-tests.py'
      - 'experiments/p07-ilovem3u8-isolated-recovery-verify.py'
      - 'experiments/p07-ilovem3u8-isolated-recovery-verify-tests.py'
      - 'experiments/p07-pending-three-runtime-readonly.py'
      - 'experiments/p07-pending-three-runtime-readonly-tests.py'
      - 'experiments/p07-fresh-cp2-schema-readonly-worker.py'
      - 'experiments/p07-fresh-cp2-schema-parity-readonly.py'
      - 'experiments/p07-17-site-staged-local-evidence.py'
      - 'experiments/p07-17-site-staged-local-evidence-tests.py'
      - 'experiments/p07-14-site-runtime-assets-readonly.py'
      - 'experiments/p07-14-site-runtime-assets-readonly-tests.py'
      - 'experiments/p07-14-site-missing-assets-private-stage.py'
      - 'experiments/p07-14-site-missing-assets-private-stage-tests.py'
      - 'experiments/p07-14-site-private-assets-guarded-install.py'
      - 'experiments/p07-14-site-private-assets-guarded-install-tests.py'
permissions:
  contents: read
jobs:
  last-two:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact script and block unsafe regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile experiments/p07-release113-last-two-stage.py experiments/p07-last-two-operator-tests.py
          python3 experiments/p07-last-two-operator-tests.py -v
          test "$(git show HEAD:dist/p07/0.1.0/overlay/BUILD_ID | tr -d '\n')" = "0.1.0-release113"
          echo P07_LAST_TWO_SYNTHETIC_PASS

      - name: Source-only SQL export advisory source syntax and boundaries
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile experiments/p07-www3-source-schema-advisory.py experiments/p07-www3-byte-context-tests.py
          python3 experiments/p07-www3-byte-context-tests.py -v
          python3 - <<'PY'
          import ast
          from pathlib import Path
          path=Path("experiments/p07-www3-source-schema-advisory.py")
          source=path.read_text()
          tree=ast.parse(source)
          remote=next(n.value.value for n in ast.walk(tree) if isinstance(n,ast.Assign)
                      and any(isinstance(t,ast.Name) and t.id=="REMOTE" for t in n.targets)
                      and isinstance(n.value,ast.Constant))
          ast.parse(remote)
          assert 'cloudpanel.export_database(database,dump,clpctl="clpctl")' in remote
          assert 'with tempfile.TemporaryDirectory(' in remote
          assert 'information_schema.tables' in remote
          assert '"--no-defaults"' in remote
          assert 'source_remote(s["source"],shlex.join(args),timeout=1900,check=False)' in source
          assert "engine.cutover_migration(" not in source
          assert "engine.resume_prepare_migration(" not in source
          assert "engine.prepare_migration(" not in source
          assert "cloudpanel.import_database(" not in remote
          print("P07_SOURCE_SQL_ADVISORY_STATIC_SCOPE_PASS")
          PY

      - name: Raw-byte SQL integrity and dynamic guard fail-closed fixtures
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile experiments/p07-sql-raw-byte-advisory.py experiments/p07-sql-byte-and-guard-tests.py
          python3 experiments/p07-sql-byte-and-guard-tests.py -v
          echo P07_RAW_BYTE_AND_GUARD_SYNTHETIC_PASS

      - name: Non-UTF8 DML independent schema sighting negative gate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile experiments/p07-source-ddl-sighting.py experiments/p07-source-ddl-sighting-tests.py
          python3 experiments/p07-source-ddl-sighting-tests.py -v
          echo P07_DDL_SIGHTING_ADVISORY_NEGATIVE_GATE_PASS

      - name: One-shot isolated www3 scratch restore with synthetic source and DB
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile experiments/p07-www3-isolated-restore.py experiments/p07-www3-isolated-restore-tests.py
          python3 experiments/p07-www3-isolated-restore-tests.py -v
          echo P07_WWW3_ISOLATED_RESTORE_SYNTHETIC_PASS
          python3 -m py_compile experiments/p07-www3-restored-readback.py experiments/p07-www3-restored-readback-tests.py
          python3 experiments/p07-www3-restored-readback-tests.py -v
          echo P07_WWW3_RESTORED_READBACK_SYNTHETIC_PASS
          # Real operator packaging regression: both verified files must be
          # collocated; missing or unrelated companion must fail before SQL.
          TMP="$(mktemp -d)"
          trap 'rm -rf -- "$TMP"' EXIT
          cp experiments/p07-www3-restored-readback.py "$TMP/"
          set +e
          OUT="$(python3 "$TMP/p07-www3-restored-readback.py" --verify-restored-read-only)"
          RC=$?
          set -e
          test "$RC" -eq 13
          test "$OUT" = 'BLOCKED=READBACK_COMPANION_MISSING_OR_UNSAFE'
          cp experiments/p07-www3-isolated-restore.py "$TMP/"
          set +e
          OUT="$(python3 "$TMP/p07-www3-restored-readback.py" --invalid-option)"
          RC=$?
          set -e
          test "$RC" -eq 13
          test "$OUT" = 'BLOCKED=EXPLICIT_READ_ONLY_ARG_REQUIRED'
          echo P07_WWW3_READBACK_TWO_FILE_OPERATOR_BUNDLE_PASS
          python3 -m py_compile experiments/p07-www3-live-source-count-parity.py experiments/p07-www3-live-source-count-parity-tests.py
          PYTHONDONTWRITEBYTECODE=1 python3 -B experiments/p07-www3-live-source-count-parity-tests.py -v
          echo P07_WWW3_LIVE_SOURCE_COUNT_ADVISORY_SYNTHETIC_PASS
          python3 -m py_compile experiments/p07-www3-content-worker.py experiments/p07-www3-live-row-content-parity.py experiments/p07-www3-live-row-content-parity-tests.py
          PYTHONDONTWRITEBYTECODE=1 python3 -B experiments/p07-www3-content-worker-tests.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -B experiments/p07-www3-live-row-content-parity-tests.py -v
          echo P07_WWW3_READ_ONLY_ROW_CONTENT_ADVISORY_SYNTHETIC_PASS
          python3 -m py_compile experiments/p07-www3-eight-ordinal-type-worker.py experiments/p07-www3-eight-ordinal-diagnostic.py experiments/p07-www3-eight-ordinal-diagnostic-tests.py
          PYTHONDONTWRITEBYTECODE=1 python3 -B experiments/p07-www3-eight-ordinal-diagnostic-tests.py -v
          echo P07_WWW3_EIGHT_ORDINAL_LIVE_DRIFT_ADVISORY_SYNTHETIC_PASS
          python3 -m py_compile experiments/p07-two-pending-live-db-worker.py experiments/p07-two-pending-live-db-parity.py experiments/p07-two-pending-live-db-parity-tests.py
          PYTHONDONTWRITEBYTECODE=1 python3 -B experiments/p07-two-pending-live-db-parity-tests.py -v
          echo P07_TWO_PENDING_SOURCE_TARGET_READONLY_PARITY_SYNTHETIC_PASS
          python3 -m py_compile experiments/p07-ilovem3u8-single-table-pk-worker.py experiments/p07-ilovem3u8-target-excess-key-classify.py experiments/p07-ilovem3u8-target-excess-key-classify-tests.py
          PYTHONDONTWRITEBYTECODE=1 python3 -B experiments/p07-ilovem3u8-target-excess-key-classify-tests.py -v
          echo P07_ILOVEM3U8_TWO_TARGET_ONLY_PK_ROWS_READONLY_SYNTHETIC_PASS
          python3 -m py_compile experiments/p07-ilovem3u8-isolated-source-restore.py experiments/p07-ilovem3u8-isolated-source-restore-tests.py
          PYTHONDONTWRITEBYTECODE=1 python3 -B experiments/p07-ilovem3u8-isolated-source-restore-tests.py -v
          echo P07_ILOVEM3U8_FRESH_SOURCE_ISOLATED_RESTORE_SYNTHETIC_PASS
          python3 -m py_compile experiments/p07-ilovem3u8-isolated-recovery-verify.py experiments/p07-ilovem3u8-isolated-recovery-verify-tests.py
          PYTHONDONTWRITEBYTECODE=1 python3 -B experiments/p07-ilovem3u8-isolated-recovery-verify-tests.py -v
          echo P07_ILOVEM3U8_PROTECTED_ISOLATED_READBACK_SYNTHETIC_PASS
          python3 -m py_compile experiments/p07-pending-three-runtime-readonly.py experiments/p07-pending-three-runtime-readonly-tests.py
          PYTHONDONTWRITEBYTECODE=1 python3 -B experiments/p07-pending-three-runtime-readonly-tests.py -v
          echo P07_PENDING_THREE_SITE_LOCAL_CONFIG_AND_DB_CANDIDATE_SYNTHETIC_PASS
          python3 -m py_compile experiments/p07-fresh-cp2-schema-readonly-worker.py experiments/p07-fresh-cp2-schema-parity-readonly.py
          echo P07_FRESH_CP2_SCHEMA_READONLY_PYTHON_VALIDATED
          python3 -m py_compile experiments/p07-www3-three-table-type-worker.py experiments/p07-www3-three-table-field-diagnosis.py experiments/p07-www3-three-table-field-diagnosis-tests.py
          PYTHONDONTWRITEBYTECODE=1 python3 -B experiments/p07-www3-three-table-field-diagnosis-tests.py -v
          echo P07_WWW3_THREE_TABLE_FOUR_FIELD_TYPE_DIAGNOSTIC_SYNTHETIC_PASS
          bash -n experiments/p07-www3-fourfield-one-command.sh
          python3 - <<'PY'
          from pathlib import Path
          text=Path("experiments/p07-www3-fourfield-one-command.sh").read_text()
          assert "set -Eeuo pipefail" in text
          assert "SCRIPT_BUNDLE_INTEGRITY=FAIL" in text
          assert "SCRIPT_BUNDLE_INTEGRITY=PASS" in text
          assert "--diagnose-three-table-field-types-read-only" in text
          assert "a128236a201439b183ba054c71e2f48e5334858a" in text
          assert "ea931b318a11a1785f24cbfda1c4811bba36880b" in text
          assert "4cb12c1fcd7c7d03c6b5fe6c95ffc72e946671ac" in text
          assert "a1ac6e2c6771ca8f2e8a55bcd7064ccc1f9cf47f" in text
          assert "1b3b9285853cc99e467f70d92c7d2b0222874018" in text
          assert "rm -rf /" not in text
          print("P07_FOURFIELD_ONE_COMMAND_BUNDLE_PINNING_PASS")
          PY
          python3 -m py_compile experiments/p07-www3-fourfield-values-worker.py experiments/p07-www3-fourfield-value-difference.py experiments/p07-www3-fourfield-value-difference-tests.py
          PYTHONDONTWRITEBYTECODE=1 python3 -B experiments/p07-www3-fourfield-value-difference-tests.py -v
          bash -n experiments/p07-www3-fourfield-values-one-command.sh
          echo P07_FOURFIELD_VALUE_DELTAS_AND_SAFE_WRAPPER_PASS
          python3 -m py_compile experiments/p07-17-site-staged-local-evidence.py experiments/p07-17-site-staged-local-evidence-tests.py
          PYTHONDONTWRITEBYTECODE=1 python3 -B experiments/p07-17-site-staged-local-evidence-tests.py -v
          echo P07_FOURTEEN_STAGED_LOCAL_READONLY_BATCH_AUDIT_PASS
          python3 -m py_compile experiments/p07-14-site-runtime-assets-readonly.py experiments/p07-14-site-runtime-assets-readonly-tests.py
          PYTHONDONTWRITEBYTECODE=1 python3 -B experiments/p07-14-site-runtime-assets-readonly-tests.py -v
          echo P07_14_SITE_RUNTIME_STORAGE_READONLY_SYNTHETIC_PASS
          python3 -m py_compile experiments/p07-14-site-missing-assets-private-stage.py experiments/p07-14-site-missing-assets-private-stage-tests.py
          PYTHONDONTWRITEBYTECODE=1 python3 -B experiments/p07-14-site-missing-assets-private-stage-tests.py -v
          echo P07_14_STAGED_ASSET_PRIVATE_COPY_SYNTHETIC_PASS
          python3 -m py_compile experiments/p07-14-site-private-assets-guarded-install.py experiments/p07-14-site-private-assets-guarded-install-tests.py
          PYTHONDONTWRITEBYTECODE=1 python3 -B experiments/p07-14-site-private-assets-guarded-install-tests.py -v
          echo P07_14_SITE_30_GUARDED_INSTALL_SYNTHETIC_PASS
