name: S01 Round 5 Cross-Component Product Closure

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/s01-r5-cross-component-product-closure.yml'

permissions:
  contents: read

jobs:
  closure-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      OPS_REPO: llhzx2018/vf-tools-ops
      OPS_SHA: 9e15e5ad0ebb127b146b50731eeeaaf726f895e5
      OPS_VERSION: 1.21.939
      THEME_REPO: llhzx2018/vf-tools-theme
      THEME_SHA: 268a2f00aaa129937afe48f2fe82ac0296655a8b
      THEME_VERSION: 1.35.31
      M3U8_REPO: llhzx2018/vf-tools-m3u8
      M3U8_SHA: cd5e0e7d957fd67f39eb05e438fecc1e761312f8
      M3U8_VERSION: 1.25.32

    steps:
      - name: Verify private read capability
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN"
          echo "PRIVATE_READ=PASS"

      - name: Checkout exact Ops
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.OPS_REPO }}
          ref: ${{ env.OPS_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: ops

      - name: Checkout exact Theme
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.THEME_REPO }}
          ref: ${{ env.THEME_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: theme

      - name: Checkout exact M3U8
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.M3U8_REPO }}
          ref: ${{ env.M3U8_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: m3u8

      - name: Verify exact identities
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$OPS_SHA"
          test "$(tr -d '\r\n' < ops/VERSION)" = "$OPS_VERSION"
          test "$(git -C theme rev-parse HEAD)" = "$THEME_SHA"
          test "$(tr -d '\r\n' < theme/VERSION)" = "$THEME_VERSION"
          test "$(git -C m3u8 rev-parse HEAD)" = "$M3U8_SHA"
          test "$(tr -d '\r\n' < m3u8/VERSION)" = "$M3U8_VERSION"
          echo "EXACT_THREE_COMPONENT_IDENTITY=PASS"

      - name: Install PHP CLI
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli >/dev/null

      - name: Ops survivor and orphan contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          php ops/tests/s01-c02-121935-product-surface-r46-contract.php
          php ops/tests/s01-c02-121935-surface-capability-r47-contract.php
          php ops/tests/s01-c02-121936-physical-surface-r48-contract.php
          php ops/tests/s01-c02-121937-survivor-product-r49-contract.php
          php ops/tests/s01-c02-121938-survivor-audit-truth-r50-contract.php
          php ops/tests/s01-c02-121939-component-drilldown-r51-contract.php
          echo "OPS_R46_R51_PRODUCT_CLOSURE=PASS"

      - name: Cross-component ownership and surface gate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, json, hashlib

          ops = Path("ops")
          theme = Path("theme")
          m3 = Path("m3u8")

          # ---------------- Ops current product surface ----------------
          route = (ops/"includes/admin-v13/route-contract.php").read_text(encoding="utf-8")
          domain = (ops/"includes/s01/admin-shell-domain-contract.php").read_text(encoding="utf-8")
          tools = (ops/"includes/s01/tool-workbench.php").read_text(encoding="utf-8")
          system_view = (ops/"includes/admin-v13/views/system_plugins.php").read_text(encoding="utf-8")
          system_service = (ops/"includes/admin-v13/services/system_plugins.php").read_text(encoding="utf-8")

          expected_routes = [
              "dashboard","content_workflow","content_articles","seo_refine","seo_keywords",
              "seo_links_redirects","seo_technical","seo_reviews","publish_zip",
              "acceptance_overview","system_plugins","integrations","system_recovery"
          ]
          # Literal key order inside current route-contract function.
          start = route.index("function vf_ops_v13_route_contract_v121391")
          end = route.find("\n}\n", start)
          segment = route[start:end]
          keys = re.findall(r"^\s*'([a-z0-9_]+)'\s*=>\s*\[", segment, re.M)
          if keys != expected_routes:
              raise SystemExit(f"OPS_FORMAL_ROUTE_SET_DRIFT:{keys}")
          if len(keys) + 1 != 14:
              raise SystemExit("OPS_OWNER_SURFACE_DENOMINATOR_NOT_14")

          absorbed = {
              "content_core":"content_articles",
              "content_briefs":"content_articles",
              "content_ai":"content_articles",
              "content_status":"content_articles",
              "content_media":"content_articles",
              "seo_planner":"content_workflow",
              "seo_languages":"seo_keywords",
              "acceptance_source":"acceptance_overview",
              "acceptance_online":"acceptance_overview",
              "acceptance_components":"acceptance_overview",
              "acceptance_export":"acceptance_overview",
              "system_site_release":"publish_zip",
          }
          for old, successor in absorbed.items():
              if re.search(rf"^\s*'{re.escape(old)}'\s*=>", segment, re.M):
                  raise SystemExit("ABSORBED_ROUTE_RESURRECTED:"+old)
              if f"'{old}'" not in route or f"'successor'=>'{successor}'" not in route:
                  raise SystemExit("ABSORBED_SUCCESSOR_MISSING:"+old)

          # Ads has no current OWNER page/capability.
          if (ops/"includes/admin-v13/views/ads.php").exists():
              raise SystemExit("ADS_OWNER_VIEW_RESURRECTED")
          if (ops/"includes/admin-v13/capabilities/ads.php").exists():
              raise SystemExit("ADS_OWNER_CAPABILITY_RESURRECTED")

          # No Ops daily path may reopen M3U8 legacy product pages.
          legacy_m3 = [
              "vf-tool-m3u8-tools","vf-tool-m3u8-lab",
              "vf-tool-m3u8-acceptance","vf-tool-m3u8-maintenance"
          ]
          for slug in legacy_m3:
              if slug in tools or slug in system_view or slug in system_service:
                  raise SystemExit("OPS_REOPENS_M3U8_LEGACY:"+slug)

          # Component drill-down is generic: consume descriptor manage_url.
          for token in ["manage_url","管理组件","VF 在线更新"]:
              if token not in system_view:
                  raise SystemExit("OPS_COMPONENT_DRILLDOWN_MISSING:"+token)
          for forbidden in ["themes.php?page=vf-theme-modules","page=vf-tool-m3u8-tools"]:
              if forbidden in system_view:
                  raise SystemExit("OPS_HARDCODED_COMPONENT_FALLBACK:"+forbidden)

          # Current six-domain product IA.
          for token in ["'dashboard'","'tools'","'content_seo'","'quality'","'publish'","'system'"]:
              if token not in domain:
                  raise SystemExit("OPS_DOMAIN_MISSING:"+token)

          # ---------------- Theme ownership surface ----------------
          theme_reg = (theme/"src/inc/admin/admin-tab-registry.php").read_text(encoding="utf-8")
          theme_workspace = (theme/"src/inc/v6/component-workspace.php").read_text(encoding="utf-8")
          theme_menu = (theme/"src/inc/admin/admin-menu-bootstrap.php").read_text(encoding="utf-8")

          theme_tabs = re.findall(r"^\s*'([a-z0-9_-]+)'\s*=>\s*\[\s*\n\s*'pageId'", theme_reg, re.M)
          expected_theme = ["overview","brand","layout","render","navigation","seo","preview","recovery"]
          if theme_tabs != expected_theme:
              raise SystemExit(f"THEME_CANONICAL_TABS_DRIFT:{theme_tabs}")
          if "return ['ads' => 'render'];" not in theme_reg:
              raise SystemExit("THEME_LEGACY_ADS_ALIAS_DRIFT")
          if "compatibility" not in theme_workspace.lower() and "recovery" not in theme_workspace.lower():
              raise SystemExit("THEME_FALLBACK_NOT_MARKED_COMPATIBILITY")
          if "add_theme_page(" not in theme_menu:
              raise SystemExit("THEME_RECOVERY_ENTRY_MISSING")

          # ---------------- M3U8 ownership surface ----------------
          m3ia = (m3/"src/admin/admin-ia-contract.php").read_text(encoding="utf-8")
          canonical = re.findall(r"'([^']+)'\s*=>\s*\[(?:(?!\n\s*'[^']+'\s*=>\s*\[).)*?'canonical'\s*=>\s*true", m3ia, re.S)
          legacy = re.findall(r"'([^']+)'\s*=>\s*\[(?:(?!\n\s*'[^']+'\s*=>\s*\[).)*?'legacyCompatibility'\s*=>\s*true", m3ia, re.S)
          expected_legacy = [
              "vf-tool-m3u8-tools","vf-tool-m3u8-lab",
              "vf-tool-m3u8-acceptance","vf-tool-m3u8-maintenance"
          ]
          if len(canonical) != 14:
              raise SystemExit(f"M3U8_CANONICAL_DENOMINATOR_NOT_14:{canonical}")
          if legacy != expected_legacy:
              raise SystemExit(f"M3U8_LEGACY_SET_DRIFT:{legacy}")
          for slug in expected_legacy:
              block_start = m3ia.index("'"+slug+"'")
              block_end = m3ia.find("\n        '", block_start+10)
              block = m3ia[block_start:block_end if block_end>0 else len(m3ia)]
              if "'navVisible' => false" not in block:
                  raise SystemExit("M3U8_LEGACY_NAV_VISIBLE:"+slug)

          # M3U8 overview remains the only default-visible engineering root;
          # specialist pages are canonical but not daily Ops navigation.
          for slug in canonical:
              if slug == "vf-tool-m3u8":
                  continue
              block_start = m3ia.index("'"+slug+"'")
              block_end = m3ia.find("\n        '", block_start+10)
              block = m3ia[block_start:block_end if block_end>0 else len(m3ia)]
              if "'navVisible' => false" not in block:
                  raise SystemExit("M3U8_SPECIALIST_PAGE_VISIBLE_BY_DEFAULT:"+slug)

          # ---------------- Evidence ----------------
          evidence = {
              "schema":"vf-audit/s01-cross-component-product-closure-v1",
              "ops_sha":"9e15e5ad0ebb127b146b50731eeeaaf726f895e5",
              "ops_version":"1.21.939",
              "ops_formal_routes":13,
              "ops_standalone_tools":1,
              "ops_owner_surfaces":14,
              "ops_absorbed_capabilities":12,
              "ops_ads_owner_ui":"retired",
              "theme_sha":"268a2f00aaa129937afe48f2fe82ac0296655a8b",
              "theme_version":"1.35.31",
              "theme_canonical_tabs":8,
              "m3u8_sha":"cd5e0e7d957fd67f39eb05e438fecc1e761312f8",
              "m3u8_version":"1.25.32",
              "m3u8_canonical_pages":14,
              "m3u8_legacy_compatibility_pages":4,
              "ops_reopens_m3u8_legacy":False,
              "duplicate_daily_component_shell":False,
              "unknown_ops_view_authority":0,
              "unknown_ops_capability_partial_authority":0,
              "result":"PASS"
          }
          raw=json.dumps(evidence,sort_keys=True).encode()
          evidence["evidence_sha256"]=hashlib.sha256(raw).hexdigest()
          Path("evidence").mkdir(exist_ok=True)
          Path("evidence/s01-cross-component-product-closure.json").write_text(
              json.dumps(evidence,indent=2,sort_keys=True),encoding="utf-8"
          )
          print("OPS_OWNER_SURFACES=14")
          print("OPS_ABSORBED_CAPABILITIES=12")
          print("OPS_ADS_OWNER_UI=RETIRED")
          print("THEME_CANONICAL_TABS=8")
          print("M3U8_CANONICAL_PAGES=14")
          print("M3U8_LEGACY_COMPATIBILITY_PAGES=4")
          print("CROSS_COMPONENT_OWNERSHIP=PASS")
          print("ORPHAN_PRODUCT_SURFACE=0")
          print("CROSS_COMPONENT_PRODUCT_CLOSURE=PASS")
          print("EVIDENCE_SHA256="+evidence["evidence_sha256"])
          PY

      - name: Upload sanitized evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-r5-cross-component-product-closure-${{ github.run_id }}
          path: evidence/s01-cross-component-product-closure.json
          if-no-files-found: error
          retention-days: 14
