name: P01 V2.24.0 Main Promotion Gate
on:
  push:
    branches: [task/p01-v222-multi-surface-gate-20260828]
    paths: ['.github/workflows/p01-v224-main-promotion-gate-20260828.yml']
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE: 867e3387b8efb70398287d05fd3652540efa77c8
      TREE: 5985dab8ee071c881fd1e425864ed363e3bdc905
      MAIN: f00a7d5dfe61d429a845bb1931065653e7750337
      DEVELOP: 4cb7000309601e4722c12906f9896a45b4e4f238
      RELEASE_GATE: '33155395660'
      ARTIFACT_GATE: '33155651293'
      ARTIFACT_ID: '9679479759'
    steps:
      - name: Readback refs and PASS evidence
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/vf-start.git" product
          test "$(git -C product rev-parse origin/main)" = "$MAIN"
          test "$(git -C product rev-parse origin/develop)" = "$DEVELOP"
          test "$(git -C product rev-parse origin/release/p01-v2.24.0-20260828)" = "$RELEASE"
          git -C product cat-file -e "$RELEASE^{commit}"
          test "$(git -C product rev-parse "$RELEASE^{tree}")" = "$TREE"
          git -C product merge-base --is-ancestor "$MAIN" "$RELEASE"
          git -C product merge-base --is-ancestor "$DEVELOP" "$RELEASE"
          test "$(git -C product show "$RELEASE:VERSION"|tr -d '\r\n')" = 2.24.0
          for run in "$RELEASE_GATE" "$ARTIFACT_GATE"; do gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$run" | jq -e '.status=="completed" and .conclusion=="success"' >/dev/null; done
          gh api "repos/llhzx2018/core-free-runner-public/actions/artifacts/$ARTIFACT_ID" | jq -e '.name=="p01-v224-formal-artifacts-867e3387b8efb70398287d05fd3652540efa77c8" and .expired==false' >/dev/null
          echo P01_V224_MAIN_PROMOTION=PASS
