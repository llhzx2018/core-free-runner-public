name: P08 R110 onefile Owner activation worker actual v0.1.2 FULL once
on:
  pull_request:
    paths: [.github/workflows/p08-r110-onefile-owner-worker-once.yml]
permissions:
  contents: read
jobs:
  site-owned-012-atomic:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GITHUB_ACTIONS: "true"
      P08_ISOLATED_INSTALL_TEST: "YES"
      P08_R105_DISPOSABLE: "YES"
      P08_R105_REAL_FULL_ISOLATED: "YES"
      P08_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      P08_R110_EXACT_SOURCE: 882b6f352169a189bc44d8d9f8b85b23792f6919
    steps:
      - name: Exact temporary private source from registered read capability
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 882b6f352169a189bc44d8d9f8b85b23792f6919
          path: p08-private
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Canonical shared delivery source exact governance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 64c8a874210f2fa89fee07c7283ffce2bbe6b36c
          path: gov-current
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Native PHP 8.4 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mbstring, zip, sqlite3, pdo_sqlite, pdo_mysql, fileinfo, curl
          tools: composer:v2
      - name: Locked Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: R110 exact PHP and build script lint plus negative source scope
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C p08-private rev-parse HEAD)" = "$P08_R110_EXACT_SOURCE"
          php -l p08-private/scripts/r110_owner_atomic_once.php
          php -l p08-private/tests/compatibility/r110_official012_onefile_worker.php
          php -l p08-private/src/Upgrade/R109AppLocal012Activation.php
          python3 - <<'PY'
          from pathlib import Path
          path=Path('p08-private/scripts/build_r110_onefile.py')
          compile(path.read_text(),str(path),'exec')
          print('R110_BUILDER_PYTHON_PARSE=PASS')
          PY
          python3 - <<'PY'
          from pathlib import Path
          code=Path('p08-private/scripts/r110_owner_atomic_once.php').read_text()
          assert '__halt_compiler();' in code
          assert 'password_verify' in code and 'session.use_strict_mode' in code
          assert 'proc_open(' in code and "'--worker'" in code
          assert 'R110_EMBEDDED_ZIP_SHA256' in code
          assert '/etc/nginx' not in code and 'systemctl(' not in code
          print('R110_OWNER_AUTH_AND_SITE_CLI_ONLY_SOURCE_SCOPE=PASS')
          PY
      - name: Independently build genuine indexed updater bridge runtime from exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          build="$RUNNER_TEMP/p08-r106-onefile-build-tree"
          mkdir -m 0700 "$build"
          git -C p08-private archive HEAD | tar -x -C "$build"
          cd "$build"
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress > "$RUNNER_TEMP/r106-composer.log" 2>&1 || {
            echo R106_ONEFILE_COMPOSER_LOCKED_BUILD=FAIL; exit 1;
          }
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/r106-node.log" 2>&1 || {
            echo R106_ONEFILE_NPM_LOCKED_BUILD=FAIL; exit 1;
          }
          npm run build >> "$RUNNER_TEMP/r106-node.log" 2>&1 || {
            echo R106_ONEFILE_VITE_BUILD=FAIL; exit 1;
          }
          cd "$GITHUB_WORKSPACE"
          python3 -B - <<'PY' > "$RUNNER_TEMP/r106-full.log" 2>&1 || {
          import os,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('p08-private/scripts').resolve()))
          from build_full import write_full,verify_canonical_full_contract
          source=Path('p08-private').resolve()
          built=Path(os.environ['RUNNER_TEMP'])/'p08-r106-onefile-build-tree'
          full=Path(os.environ['RUNNER_TEMP'])/'r106-onefile-bridge-full.zip'
          gov=Path('gov-current').resolve()
          sha=os.environ['P08_R110_EXACT_SOURCE']
          verify_canonical_full_contract(source,full,sha,gov,'resolve')
          write_full(built,full,'0.1.2',sha)
          verify_canonical_full_contract(source,full,sha,gov,'delivery')
          PY
            echo R106_ONEFILE_CANONICAL_FULL_GATE=FAIL
            python3 - <<'PY'
          import os,re
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'r106-full.log'
          raw=p.read_text(errors='replace') if p.exists() else ''
          codes=sorted(set(re.findall(r'\b(?:FULL|CONTRACT|P08|R106)_[A-Z0-9_]{4,90}\b',raw)))
          print("R106_ONEFILE_SAFE_CODES="+",".join(codes[-12:]))
          reasons=re.findall(r'CONTRACT_REASON=([A-Z][A-Z0-9_]{2,100})',raw)
          print("R106_ONEFILE_GATE_REASON="+(reasons[-1] if reasons else "NOT_PROVEN"))
          if not codes:
              print("R106_ONEFILE_EXEC_EXCEPTION="+("PYTHON_EXCEPTION" if 'Traceback' in raw else 'OTHER'))
          PY
            exit 1;
          }
          mkdir -m 0700 "$RUNNER_TEMP/p08-r106-updater-bridge-onefile"
          unzip -q "$RUNNER_TEMP/r106-onefile-bridge-full.zip" -d "$RUNNER_TEMP/p08-r106-updater-bridge-onefile"
          echo R106_ONEFILE_DISTINCT_BRIDGE_CANONICAL_FULL=PASS
      - name: Two deterministic sealed single-PHP packages and PHP syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --max-time 90 \
            --header "Authorization: Bearer $P08_PRIVATE_READ_TOKEN" \
            --header "Accept: application/octet-stream" \
            https://api.github.com/repos/llhzx2018/vf-adops/releases/assets/747260263 \
            --output "$RUNNER_TEMP/r110-official-012.zip"
          test "$(wc -c < "$RUNNER_TEMP/r110-official-012.zip")" = 10390070
          echo "1b3d7fc3743fb44af12c0b50905a65ea68d47c80f0e1e2ddc5e03c08d534b081  $RUNNER_TEMP/r110-official-012.zip" | sha256sum --check --status
          mkdir -m 0700 "$RUNNER_TEMP/r110-one-a" "$RUNNER_TEMP/r110-one-b"
          for n in a b; do
            python3 p08-private/scripts/build_r110_onefile.py \
              --source p08-private/scripts/r110_owner_atomic_once.php \
              --full "$RUNNER_TEMP/r106-onefile-bridge-full.zip" \
              --official-full "$RUNNER_TEMP/r110-official-012.zip" \
              --source-sha "$P08_R110_EXACT_SOURCE" \
              --output "$RUNNER_TEMP/r110-one-$n/p08-owner-atomic-once.php" \
              > "$RUNNER_TEMP/r110-builder-$n.log" 2>&1 || {
                echo R110_DETERMINISTIC_BUILD=FAIL
                exit 1
              }
          done
          cmp -s "$RUNNER_TEMP/r110-one-a/p08-owner-atomic-once.php" \
            "$RUNNER_TEMP/r110-one-b/p08-owner-atomic-once.php"
          php -l "$RUNNER_TEMP/r110-one-a/p08-owner-atomic-once.php" \
            > "$RUNNER_TEMP/r110-php-lint.log"
          python3 - <<'PY'
          import os,hashlib
          from pathlib import Path
          t=Path(os.environ['RUNNER_TEMP'])
          b=(t/'r110-one-a/p08-owner-atomic-once.php').read_bytes()
          original=(t/'r106-onefile-bridge-full.zip').read_bytes()
          pos=b.index(b'__halt_compiler();')+len(b'__halt_compiler();')
          assert b[pos:]==original, 'R110_EMBEDDED_ZIP_OFFSET_OR_BYTES_INVALID'
          assert b'@@' not in b[:pos], 'R110_TEMPLATE_UNRESOLVED'
          assert b[:pos].count(b'__halt_compiler();')==1
          print('R110_ONEFILE_FULL_ZIP_BYTES_PINNED_AND_DETERMINISTIC=PASS')
          PY
          echo R110_SITE_OWNER_ONEFILE_PHP_SYNTAX=PASS
      - name: Official v0.1.2 real FULL to onefile separate site-UID worker native backup
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test -n "$P08_PRIVATE_READ_TOKEN"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --max-time 90 \
            --header "Authorization: Bearer $P08_PRIVATE_READ_TOKEN" \
            --header "Accept: application/octet-stream" \
            https://api.github.com/repos/llhzx2018/vf-adops/releases/assets/747260263 \
            --output "$RUNNER_TEMP/r110-official-012.zip"
          test "$(wc -c < "$RUNNER_TEMP/r110-official-012.zip")" = 10390070
          echo "1b3d7fc3743fb44af12c0b50905a65ea68d47c80f0e1e2ddc5e03c08d534b081  $RUNNER_TEMP/r110-official-012.zip" | sha256sum --check --status
          site="$RUNNER_TEMP/p08-r110-official-012-site-success"
          bridge="$RUNNER_TEMP/p08-r110-updater-bridge-success"
          mkdir -m 0700 "$site" "$bridge"
          unzip -q "$RUNNER_TEMP/r110-official-012.zip" -d "$site"
          unzip -q "$RUNNER_TEMP/r106-onefile-bridge-full.zip" -d "$bridge"
          php p08-private/tests/compatibility/r110_official012_onefile_worker.php \
            success "$site" "$bridge" "$P08_R110_EXACT_SOURCE" \
            "$RUNNER_TEMP/r110-one-a/p08-owner-atomic-once.php" \
            > "$RUNNER_TEMP/r110-worker-acceptance.log" 2>&1 || {
              grep -E '^R110_BRIDGE_FAILURE=' "$RUNNER_TEMP/r110-worker-acceptance.log" | tail -1 || true
              echo R110_REAL_ONEFILE_WORKER_FULL_TEST=FAIL
              exit 1
            }
          grep -Fxq 'R110_REAL_ISSUED_012_ONEFILE_TO_SITE_ACCOUNT_ATOMIC_BRIDGE=PASS' "$RUNNER_TEMP/r110-worker-acceptance.log"
          grep -Fxq 'R110_OWNER_PASSWORD_HTML_AUTH=NOT_PROVEN_IN_THIS_WORKER_TEST' "$RUNNER_TEMP/r110-worker-acceptance.log"
          echo R110_SEPARATE_PHP_CLI_ONEFILE_NATIVE_SQLITE_WORKER=PASS
          echo R110_REAL_OWNER_BROWSER_AND_NATIVE_SQL_3DB=NOT_PROVEN
      - name: Genuine localhost HTTPS Chromium Owner login and one-PHP app-only activation
        shell: bash
        env:
          P08_R110_BROWSER: "YES"
        run: |
          set -Eeuo pipefail
          set +x
          cd p08-private
          npm ci --ignore-scripts --no-audit --no-fund > "$RUNNER_TEMP/r110-browser-node.log" 2>&1 || {
            echo R110_BROWSER_NODE_INSTALL=FAIL; exit 1;
          }
          npx playwright install chromium > "$RUNNER_TEMP/r110-browser-install.log" 2>&1 || {
            echo R110_BROWSER_CHROMIUM_INSTALL=FAIL; exit 1;
          }
          cd "$GITHUB_WORKSPACE"
          site="$RUNNER_TEMP/p08-r110-official-012-site-browser"
          bridge="$RUNNER_TEMP/p08-r110-updater-bridge-browser"
          mkdir -m 0700 "$site" "$bridge"
          unzip -q "$RUNNER_TEMP/r110-official-012.zip" -d "$site"
          unzip -q "$RUNNER_TEMP/r106-onefile-bridge-full.zip" -d "$bridge"
          php p08-private/tests/compatibility/r110_official012_onefile_worker.php \
            browser-setup "$site" "$bridge" "$P08_R110_EXACT_SOURCE" \
            "$RUNNER_TEMP/r110-one-a/p08-owner-atomic-once.php" \
            > "$RUNNER_TEMP/r110-browser-fixture.log" 2>&1 || {
              grep -E '^R110_BRIDGE_FAILURE=' "$RUNNER_TEMP/r110-browser-fixture.log" | tail -1 || true
              echo R110_REAL_ISSUED_BROWSER_FIXTURE=FAIL
              exit 1
            }
          grep -Fxq 'R110_BROWSER_REAL_ISSUED_012_OWNER_PASSWORD_FIXTURE_READY=PASS' \
            "$RUNNER_TEMP/r110-browser-fixture.log"
          bash p08-private/tests/compatibility/run_r110_owner_onefile_https_browser.sh "$site" \
            > "$RUNNER_TEMP/r110-browser-e2e.log" 2>&1 || {
              grep -E '^R110_(BROWSER|HTTPS|REAL)[A-Z0-9_]*(=|:)' "$RUNNER_TEMP/r110-browser-e2e.log" | tail -18 || true
              echo R110_REAL_HTTPS_BROWSER_TEST=FAIL
              exit 1
            }
          grep -Fxq 'R110_REAL_HTTPS_OWNER_ONEFILE_CLI_AUTO_EXECUTED=PASS' \
            "$RUNNER_TEMP/r110-browser-e2e.log"
          echo R110_REAL_HTTPS_CHROMIUM_OWNER_FIRST_ACTIVATION=PASS
      - name: Real SIGKILL only site PHP worker after native backup, Owner browser recover, explicit retry
        shell: bash
        env:
          P08_R110_BROWSER: "YES"
        run: |
          set -Eeuo pipefail
          set +x
          site="$RUNNER_TEMP/p08-r110-official-012-site-interrupt"
          bridge="$RUNNER_TEMP/p08-r110-updater-bridge-interrupt"
          mkdir -m 0700 "$site" "$bridge"
          unzip -q "$RUNNER_TEMP/r110-official-012.zip" -d "$site"
          unzip -q "$RUNNER_TEMP/r106-onefile-bridge-full.zip" -d "$bridge"
          php p08-private/tests/compatibility/r110_official012_onefile_worker.php \
            interrupt-setup "$site" "$bridge" "$P08_R110_EXACT_SOURCE" \
            "$RUNNER_TEMP/r110-one-a/p08-owner-atomic-once.php" \
            > "$RUNNER_TEMP/r110-interrupt-fixture.log" 2>&1 || {
              grep -E '^R110_BRIDGE_FAILURE=' "$RUNNER_TEMP/r110-interrupt-fixture.log" | tail -1 || true
              echo R110_SIGKILL_FIXTURE=FAIL; exit 1
            }
          grep -Fxq 'R110_REAL_ISSUED_012_SIGKILL_OWNER_SITE_PREPARED=PASS' "$RUNNER_TEMP/r110-interrupt-fixture.log"
          php "$site/public/p08-owner-atomic-once.php" --worker \
            > "$RUNNER_TEMP/r110-interrupt-worker.log" 2>&1 &
          worker=$!
          marker="$site/storage/app/private/adops/maintenance/maintenance.json"
          for n in $(seq 1 900); do
            [[ -f "$marker" ]] && break
            kill -0 "$worker" 2>/dev/null || break
            sleep .02
          done
          if [[ ! -f "$marker" ]]; then
            kill "$worker" >/dev/null 2>&1 || true
            wait "$worker" 2>/dev/null || true
            echo R110_SIGKILL_MARKER_TIMING=NOT_PROVEN; exit 1
          fi
          # Kill ONLY this isolated direct child, never Nginx/FPM, other
          # sites, databases, unrelated processes or a privileged process.
          kill -9 "$worker"
          wait "$worker" 2>/dev/null || true
          test -f "$marker"
          test -f "$site/storage/app/private/adops/layout-conversion/prepared.json"
          php -r '$s=json_decode(file_get_contents($argv[1]),true);exit(($s["status"]??"")==="RUNNING"?0:1);' \
            "$site/storage/app/private/adops/owner-atomic-once/state.json"
          echo R110_ACTUAL_SITE_PHP_WORKER_SIGKILL_DURING_MAINTENANCE=PASS
          bash p08-private/tests/compatibility/run_r110_owner_onefile_https_browser.sh \
            "$site" interrupt > "$RUNNER_TEMP/r110-interrupt-browser.log" 2>&1 || {
              grep -Eo 'R110_[A-Z0-9_]{5,90}=(PASS|FAIL|NOT_PROVEN|NEEDS_RECOVERY|[2345][0-9][0-9])|R110_INTERRUPT_[A-Z0-9_]{5,90}' \
                "$RUNNER_TEMP/r110-interrupt-browser.log" | tail -15 || true
              echo R110_SIGKILL_OWNER_RECOVERY_BROWSER=FAIL
              exit 1
            }
          grep -Fxq 'R110_REAL_SIGKILL_OWNER_RECOVERY_RETRY_HEALTH=PASS' "$RUNNER_TEMP/r110-interrupt-browser.log"
          test ! -f "$marker"
          test "$(readlink "$site/current")" = "releases/$P08_R110_EXACT_SOURCE"
          echo R110_REAL_SIGKILL_BACKUP_PROTECTED_RECOVERY_AND_OWNER_RETRY=PASS
      - name: Always purge all transient private source, binaries and Owner fixtures
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- p08-private gov-current "$RUNNER_TEMP/p08-r106-onefile-build-tree" \
            "$RUNNER_TEMP/r110-one-a" "$RUNNER_TEMP/r110-one-b" \
            "$RUNNER_TEMP/p08-r110-updater-bridge-success" "$RUNNER_TEMP/p08-r110-official-012-site-success" \
            "$RUNNER_TEMP/p08-r110-updater-bridge-browser" "$RUNNER_TEMP/p08-r110-official-012-site-browser" \
            "$RUNNER_TEMP/p08-r110-local-https-test" \
            "$RUNNER_TEMP/p08-r110-official-012-site-interrupt" \
            "$RUNNER_TEMP/p08-r110-updater-bridge-interrupt"
          rm -f -- "$RUNNER_TEMP"/r110-*.zip "$RUNNER_TEMP"/r110-*.log \
            "$RUNNER_TEMP"/r106-onefile-bridge-full.zip \
            "$RUNNER_TEMP"/r106-full.log "$RUNNER_TEMP"/r106-composer.log "$RUNNER_TEMP"/r106-node.log
          echo R110_PRIVATE_SOURCE_AND_PACKAGES_PURGED=YES
