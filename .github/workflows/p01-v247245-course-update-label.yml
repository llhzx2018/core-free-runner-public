name: P01 V2.47.245 Course Update Label Proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p01-v247245-course-update-label.yml"
      - "proof-triggers/p01-v247245-course-update-label.json"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout proof control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd >/dev/null
      - name: Clone exact candidate and baseline
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" candidate
          git -C candidate fetch -q origin 2e229d47bcc7cb446bf4ef406449ef9f27e22ad7
          git -C candidate checkout -q --detach 2e229d47bcc7cb446bf4ef406449ef9f27e22ad7
          test "$(git -C candidate rev-parse HEAD)" = "2e229d47bcc7cb446bf4ef406449ef9f27e22ad7"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.245"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" baseline
          git -C baseline fetch -q origin 832ff0ec8bc4428b915a8d2582dcd96710ee8bcf
          git -C baseline checkout -q --detach 832ff0ec8bc4428b915a8d2582dcd96710ee8bcf
          echo P01_V247245_EXACT_SOURCE=PASS
      - name: Reader label contract
        shell: bash
        run: |
          set -Eeuo pipefail
          php candidate/tests/unit/course_markdown_reader_contract.php | tee /tmp/reader.txt
          grep -Fx 'P01_COURSE_MARKDOWN_READER=PASS' /tmp/reader.txt
          grep -Fq "更新课程 ZIP" candidate/src/app/CourseLibraryPage.php
          grep -Fq "? '上传课程' : '更新课程 ZIP'" candidate/src/app/CourseLibraryPage.php
          echo P01_V247245_UPDATE_ZIP_LABEL=PASS
      - name: Canonical regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate baseline --require-zero-debt | tee /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/canonical.txt
          echo P01_V247245_CANONICAL=PASS
      - name: No release write
        shell: bash
        run: |
          echo FORMAL_RELEASE_CALLED=NO
          echo DISTRIBUTION_WRITE=NO
          echo PRODUCTION_WRITE=NO
