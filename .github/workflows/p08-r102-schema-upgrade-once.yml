name: P08 R102 additive database migration fault/rollback real three engine rehearsal (temporary)
# R102 developer-only old v0.1.1 → v0.1.2 DB delta; no official V2 Atomic/Production
# R102 source-admission exact installed FULL/DB negative proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p08-r102-schema-upgrade-once.yml'
permissions:
  contents: read
jobs:
  p08-r102:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout public-safe test harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Transient checkout exact P08 private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-adops
          ref: a47c456ef285d924269f4bd3f2964a9b4a83bd7f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-p08-r102
          fetch-depth: 0
      - name: Reject wrong SHA or installed Owner state
        run: |
          set -euo pipefail
          test "$(git -C private-p08-r102 rev-parse HEAD)" = a47c456ef285d924269f4bd3f2964a9b4a83bd7f
          test "$(cat private-p08-r102/VERSION)" = 0.1.2
          test ! -e private-p08-r102/.env
          test ! -e private-p08-r102/storage/app/private/adops/installation/installed.json
          echo P08_R102_EXACT_SOURCE=PASS
      - name: Transient canonical GOV-DOC checkout for mandatory FULL gates
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/gov-doc
          ref: 7b60a8b36795cf1b5c5e49d24f258b5a6a141ce4
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov-doc-r102
      - name: PHP 8.4 and pinned Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: zip, mbstring, dom, fileinfo, pdo_sqlite, sqlite3, pdo_mysql, intl, sodium
      - name: Node 22 for locked Vue build
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Genuine Laravel and Vite locked build, typecheck and unit tests
        run: |
          set -euo pipefail
          cd private-p08-r102
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          composer install --no-interaction --no-progress --prefer-dist --no-scripts > "$RUNNER_TEMP/p08-r102-composer.log" 2>&1 || { tail -n 25 "$RUNNER_TEMP/p08-r102-composer.log"; exit 1; }
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-r102-npm.log" 2>&1 || { tail -n 25 "$RUNNER_TEMP/p08-r102-npm.log"; exit 1; }
          npm run build
          npm run typecheck
          npm run test:unit
          python3 scripts/check_stack_contract.py --phase foundation
          echo P08_R102_VUE_LOCKED_BUILD_AND_TYPES=PASS
      - name: PHP lint and Owner monitoring five cached provider reports provenance and isolation
        env:
          P08_R102_DISPOSABLE_SCHEMA: YES
          P08_ISOLATED_INSTALL_TEST: YES
        run: |
          set -euo pipefail
          cd private-p08-r102
          php -l src/Landing/LandingBuilder.php
          php -l app/Http/Controllers/LandingController.php
          php -l app/Modules/Landing/Actions/CreateLanding.php
          php -l app/Modules/Landing/Actions/LandingAssetLibrary.php
          php -l app/Http/Controllers/LandingAssetController.php
          php -l database/migrations/2026_11_13_000003_create_landing_assets.php
          php -l app/Modules/StaticDeployment/Actions/CloudflarePagesGateway.php
          php -l app/Http/Controllers/StaticPagesController.php
          php -l app/Http/Controllers/TrackerCenterController.php
          php -l app/Modules/Tracker/Actions/TrackerEndpointPolicy.php
          php -l app/Modules/Tracker/Actions/SimpleKumaReadAdapter.php
          php -l database/migrations/2026_11_13_000005_create_tracker_connections.php
          php -l tests/Feature/TrackerCenterWorkflowTest.php
          php -l app/Http/Controllers/VpsStaticController.php
          php -l app/Modules/StaticDeployment/Actions/VpsTargetPolicy.php
          php -l app/Modules/StaticDeployment/Actions/VpsRemoteExecutor.php
          php -l app/Modules/StaticDeployment/Actions/OpenSshRemoteExecutor.php
          php -l app/Modules/StaticDeployment/Actions/VpsAtomicGateway.php
          php -l database/migrations/2026_11_14_000006_create_static_vps_targets.php
          php -l tests/Feature/VpsStaticWorkflowTest.php
          php -l app/Modules/Domains/Actions/DomainHostnamePolicy.php
          php -l app/Modules/Domains/Actions/DomainDnsTlsReader.php
          php -l app/Modules/Domains/Actions/NativeDomainDnsTlsReader.php
          php -l app/Http/Controllers/DomainCenterController.php
          php -l database/migrations/2026_11_14_000007_create_domain_records.php
          php -l tests/Feature/DomainCenterWorkflowTest.php
          php -l app/Http/Controllers/AdsCenterController.php
          php -l app/Modules/Ads/Actions/GoogleAdsOAuth.php
          php -l app/Modules/Ads/Actions/GoogleAdsReadAdapter.php
          php -l database/migrations/2026_11_14_000008_create_ad_google_connections.php
          php -l tests/Feature/AdsCenterWorkflowTest.php
          php -l app/Modules/Ads/Meta/MetaOAuth.php
          php -l app/Modules/Ads/Meta/MetaReadAdapter.php
          php -l app/Http/Controllers/MetaAdsController.php
          php -l database/migrations/2026_11_14_000009_create_ad_meta_connections.php
          php -l tests/Feature/MetaAdsWorkflowTest.php
          php -l app/Modules/Ads/TikTok/TikTokOAuth.php
          php -l app/Modules/Ads/TikTok/TikTokReadAdapter.php
          php -l app/Http/Controllers/TikTokAdsController.php
          php -l database/migrations/2026_11_14_000010_create_ad_tiktok_connections.php
          php -l tests/Feature/TikTokAdsWorkflowTest.php
          php -l app/Modules/Ads/PopAds/PopAdsReadAdapter.php
          php -l app/Http/Controllers/PopAdsController.php
          php -l database/migrations/2026_11_14_000011_create_ad_popads_connections.php
          php -l tests/Feature/PopAdsWorkflowTest.php
          php -l app/Modules/Monitoring/Actions/MonitoringReadModel.php
          php -l tests/Feature/MonitoringReadModelTest.php
          php -l app/Modules/Automation/Actions/AutomationRuleEngine.php
          php -l app/Http/Controllers/AutomationCenterController.php
          php -l tests/Feature/AutomationRuleWorkflowTest.php
          php -l database/migrations/2026_11_14_000012_create_automation_suggestion_tables.php
          php -l app/Http/Controllers/WorkspaceController.php
          php -l routes/web.php
          php -l src/Upgrade/R102PublishedInstallAdmission.php
          php -l src/Upgrade/R102SchemaAtomicArchive.php
          php -l src/Upgrade/R102BridgeTrust.php
          php -l src/Upgrade/R102OwnerUpgradeIntent.php
          php -l src/Upgrade/R102BridgeActivation.php
          php -l app/Http/Controllers/R102OneTimeOwnerController.php
          php -l tests/compatibility/r102_bridge_installed_sqlite.php
          python3 -m py_compile scripts/build_r102_owner_bridge.py
          python3 -m unittest discover -s tests -p 'test_r102_schema_atomic_builder.py' -v
          php -l tests/Feature/R102PublishedInstallAdmissionTest.php
          php -l tests/compatibility/r102_old_full_installed_native_sql.php
          php -l tests/compatibility/r102_old_full_installed_sqlite.php
          bash -n scripts/prepare-vps-static.sh
          php -l database/migrations/2026_11_13_000004_create_static_pages_targets.php
          php -l tests/Feature/StaticPagesWorkflowTest.php
          php -l tests/Feature/LandingAssetWorkflowTest.php
          php -l tests/Feature/LandingHistoryPreviewTest.php
          php tests/run.php
          ./vendor/bin/phpunit --no-progress tests/Feature/LandingAssetWorkflowTest.php
          ./vendor/bin/phpunit --no-progress tests/Feature/LandingHistoryPreviewTest.php
          ./vendor/bin/phpunit --no-progress tests/Feature/StaticPagesWorkflowTest.php
          ./vendor/bin/phpunit --no-progress tests/Feature/TrackerCenterWorkflowTest.php
          ./vendor/bin/phpunit --no-progress tests/Feature/VpsStaticWorkflowTest.php
          ./vendor/bin/phpunit --no-progress tests/Feature/DomainCenterWorkflowTest.php
          ./vendor/bin/phpunit --no-progress tests/Feature/AdsCenterWorkflowTest.php
          ./vendor/bin/phpunit --no-progress tests/Feature/MetaAdsWorkflowTest.php
          ./vendor/bin/phpunit --no-progress tests/Feature/TikTokAdsWorkflowTest.php
          ./vendor/bin/phpunit --no-progress tests/Feature/PopAdsWorkflowTest.php
          ./vendor/bin/phpunit --no-progress tests/Feature/MonitoringReadModelTest.php
          ./vendor/bin/phpunit --no-progress tests/Feature/AutomationRuleWorkflowTest.php
          ./vendor/bin/phpunit --no-progress tests/Feature/R102PublishedInstallAdmissionTest.php
          php -l tests/compatibility/r101_complete_schema.php
          php -l tests/Feature/R101IntegratedWorkspaceTest.php
          php -l tests/test_install_sqlite_e2e.php
          php -l tests/test_install_mysql_e2e.php
          php -l tests/test_extracted_full_sqlite_e2e.php
          ./vendor/bin/phpunit --no-progress tests/Feature/R101IntegratedWorkspaceTest.php
          php -l src/Upgrade/R102OfflineVersionedRehearsal.php
          php -l tests/compatibility/r102_install_published_sqlite.php
          php -l tests/compatibility/r102_old_full_installed_sqlite.php
          php -l src/Upgrade/R102AdditiveSchemaPlan.php
          php -l tests/Feature/R102AdditiveSchemaPlanTest.php
          ./vendor/bin/phpunit --no-progress tests/Feature/R102AdditiveSchemaPlanTest.php
          python3 -m unittest discover -s tests -p 'test_r101_atomic_schema_compat.py' -v
          # Live immutable released v0.1.1 tag against this exact R102 source.
          # This is an EXPECTED hard block, NOT an approval for schema migrations.
          set +e
          schema_json="$(python3 scripts/check_r101_atomic_schema_compat.py --repo . --base-ref v0.1.1 --target-ref HEAD)"
          gate_rc=$?
          set -e
          test "$gate_rc" -eq 2
          printf '%s\n' "$schema_json" | head -n 1 | python3 -c '
          import json,sys
          x=json.load(sys.stdin)
          assert x["status"]=="BLOCKED_PRE_RELEASE"
          assert x["source_version"]=="0.1.1" and x["target_version"]=="0.1.2"
          assert len(x["added_migrations"])==10
          assert x["removed_migrations"]==x["modified_migrations"]==[]
          assert "SCHEMA_MIGRATIONS_CHANGED" in x["reason_codes"]
          assert "TARGET_VERSION_NOT_NEWER" not in x["reason_codes"]
          print("R102_RELEASED_TAG_SCHEMA_DRIFT_10_WITH_BUMPED_VERSION=CONFIRMED_BLOCK")
          '
          # No bypass or production upgrade: run existing backup/Atomic regression.
          # Historical 0.1.0 Bridge byte parity is a separate, preserved safety gate.
          # R91-R100 changed AppServiceProvider and workspace; refusing to pin
          # altered new bytes as the old immutable Bridge is required.
          set +e
          bridge_output="$(python3 scripts/check_bridge_runtime_parity.py)"
          bridge_rc=$?
          set -e
          test "$bridge_rc" -eq 2
          printf '%s\\n' "$bridge_output" | grep -Fq 'P08_R67_BRIDGE_EXECUTOR=BLOCKED:'
          echo R102_HISTORICAL_BRIDGE_PARITY=BLOCKED_UNCHANGED_GUARD
          # Independent native backup / failed-stage rollback regressions are
          # tested; they must not be mistaken for an approved migration upgrade.
          php tests/test_atomic_release_pointer.php
          php tests/test_atomic_release_materializer.php
          php tests/test_atomic_code_transaction.php
          php tests/test_fresh_owner_upgrade_backup.php
          php tests/test_owner_upgrade_job.php
          php tests/test_owner_upgrade_worker_cron.php
          php tests/test_upgrade_throttle_isolation.php
          python3 -m unittest discover -s tests -p 'test_atomic_builder.py' -v
          python3 -m unittest discover -s tests -p 'test_full_builder.py' -v
          echo R102_INDEPENDENT_OLDER_BACKUP_ATOMIC_FAILCLOSED_REGRESSIONS=PASS
          php -l tests/runtime/vps_atomic_native.php
          echo P08_R102_OWNER_SQLITE_SYNTHETIC=PASS
          echo P08_R102_STATIC_LAYOUTS_OWNER_REVISION_SQLITE=PASS
      - name: R102 unsigned real extracted FULL SQLite first setup and ten-module migration proof
        run: |
          set -euo pipefail
          cd private-p08-r102
          test ! -e .env
          test ! -e storage/app/private/adops/installation/installed.json
          pkg="$RUNNER_TEMP/p08-r102-dev-only-FULL.zip"
          dest="$RUNNER_TEMP/p08-r102-extracted-FULL"
          test ! -e "$pkg" && test ! -e "$dest"
          # R102 builds no formal release, no uploaded artifact or channel.
          python3 - "$pkg" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd() / "scripts"))
          from build_full import write_full
          import subprocess
          head=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          receipt=write_full(Path.cwd(),Path(sys.argv[1]),"0.1.2",head)
          print("R102_UNSIGNED_FULL_SHA256="+receipt["sha256"])
          PY
          mkdir -m 0700 "$dest"
          unzip -q "$pkg" -d "$dest"
          test ! -e "$dest/.env"
          test ! -e "$dest/storage/app/private/adops/installation/installed.json"
          test -f "$dest/public/build/manifest.json"
          test -f "$dest/vendor/autoload.php"
          export P08_ISOLATED_INSTALL_TEST=YES
          export P08_CANDIDATE_VERSION=0.1.2
          export P08_CANDIDATE_SOURCE_SHA="$(git rev-parse HEAD)"
          php tests/test_extracted_full_sqlite_e2e.php "$dest"
          echo R102_REAL_EXTRACTED_FULL_SQLITE_OWNER_AND_ALL_MIGRATIONS=PASS
      - name: R102 actual published v0.1.1 FULL installed Owner -> v0.1.2 offline-versioned CI rehearsal and media restoration
        env:
          P08_ISOLATED_INSTALL_TEST: YES
          P08_R102_DISPOSABLE_SCHEMA: YES
        run: |
          set -euo pipefail
          src="$PWD/private-p08-r102"
          old_src="$RUNNER_TEMP/r102-old-v011-src"
          old_zip="$RUNNER_TEMP/r102-old-v011-FULL.zip"
          success="$RUNNER_TEMP/r102-v011-installed-success"
          fault="$RUNNER_TEMP/r102-v011-installed-fault"
          new="$RUNNER_TEMP/r102-v012-clean-target"
          test ! -e "$old_src" && test ! -e "$old_zip"
          test ! -e "$success" && test ! -e "$fault" && test ! -e "$new"
          git -C "$src" worktree add --detach "$old_src" v0.1.1
          test "$(git -C "$old_src" rev-parse HEAD)" = 9c7f76434fe2d064f2f1ac15c58a760f778cf055
          test "$(cat "$old_src/VERSION")" = 0.1.1
          # Byte-identical lockfiles: reuse already compiled dependencies,
          # but compile the authentic OLD Vue/Vite resources from v0.1.1.
          cmp "$old_src/composer.lock" "$src/composer.lock"
          cmp "$old_src/package-lock.json" "$src/package-lock.json"
          cp -a "$src/vendor" "$old_src/vendor"
          cp -a "$src/node_modules" "$old_src/node_modules"
          (cd "$old_src"; npm run build >/dev/null)
          python3 - "$old_src" "$old_zip" <<'PY'
          import sys
          from pathlib import Path
          source, zipfile=map(Path,sys.argv[1:3])
          sys.path.insert(0,str(source/"scripts"))
          from build_full import write_full
          receipt=write_full(source,zipfile,"0.1.1","9c7f76434fe2d064f2f1ac15c58a760f778cf055")
          print("R102_COMPILED_REAL_RELEASED_V011_FULL_SHA256="+receipt["sha256"])
          PY
          mkdir -m 0700 "$success" "$fault" "$new"
          unzip -q "$old_zip" -d "$success"
          unzip -q "$old_zip" -d "$fault"
          # Use the SAME v0.1.2 complete compiled bytes from the earlier
          # R102 unsigned development FULL build, without any installed state.
          unzip -q "$RUNNER_TEMP/p08-r102-dev-only-FULL.zip" -d "$new"
          test ! -e "$new/.env"
          schema_zip="$RUNNER_TEMP/r102-sqlite-schema-atomic.zip"
          test ! -e "$schema_zip"
          python3 - "$src" "$success" "$new" "$schema_zip" <<'PY'
          import sys,hashlib,json
          from pathlib import Path
          src,old,target,out=map(Path,sys.argv[1:5])
          sys.path.insert(0,str(src/"scripts"))
          from build_r102_schema_atomic import build
          oldsha=hashlib.sha256((old/"FULL_MANIFEST.json").read_bytes()).hexdigest()
          targetsha=json.loads((target/"FULL_MANIFEST.json").read_text())["source_sha"]
          x=build(target,out,oldsha,targetsha)
          assert x["migrations"]==10 and x["files"]>20
          print("R102_SCHEMA_ATOMIC_SQLITE_REAL_COMPILED_BYTES=PASS")
          PY
          export P08_R102_SCHEMA_ZIP="$schema_zip"
          export P08_R102_SCHEMA_ZIP_SHA="$(sha256sum "$schema_zip" | cut -d' ' -f1)"
          for site in "$success" "$fault"; do
            test ! -e "$site/.env"
            php "$src/tests/compatibility/r102_install_published_sqlite.php" "$site"
            test -e "$site/.env"
            test "$(cat "$site/VERSION")" = 0.1.1
            test ! -L "$site/current"
          done
          php -l "$src/src/Upgrade/R102OfflineVersionedRehearsal.php"
          php -l "$src/tests/compatibility/r102_old_full_installed_sqlite.php"
          php "$src/tests/compatibility/r102_old_full_installed_sqlite.php" fault "$fault" "$new"
          php "$src/tests/compatibility/r102_old_full_installed_sqlite.php" success "$success" "$new"
          echo R102_REAL_V011_FULL_INSTALLED_TO_V012_SQLITE_SOURCE_BACKUP_MEDIA_ROLLBACK=PASS
      - name: Source-pinned old 0.1.1 composite Bridge build and offline activation+Owner intent
        env:
          P08_ISOLATED_INSTALL_TEST: YES
          P08_R102_DISPOSABLE_SCHEMA: YES
        run: |
          set -euo pipefail
          src="$PWD/private-p08-r102"
          old_zip="$RUNNER_TEMP/r102-old-v011-FULL.zip"
          old="$RUNNER_TEMP/r102-composite-old-input"
          bridge_zip="$RUNNER_TEMP/r102-composite-bridge.zip"
          bridge="$RUNNER_TEMP/r102-composite-bridge-full"
          success="$RUNNER_TEMP/r102-bridge-old-success"
          fault="$RUNNER_TEMP/r102-bridge-old-fault"
          for path in "$old" "$bridge_zip" "$bridge" "$success" "$fault"; do test ! -e "$path"; done
          mkdir -m 0700 "$old" "$bridge" "$success" "$fault"
          unzip -q "$old_zip" -d "$old"
          oldfull="$(sha256sum "$old/FULL_MANIFEST.json" | cut -d' ' -f1)"
          python3 "$src/scripts/build_r102_owner_bridge.py" \
            --old-full "$old" --overlay "$src" --output "$bridge_zip" \
            --old-full-sha256 "$oldfull" --overlay-sha "$(git -C "$src" rev-parse HEAD)"
          unzip -q "$bridge_zip" -d "$bridge"
          php -r 'require $argv[1]."/src/Installation/SetupGuard.php"; VF\AdOps\Installation\SetupGuard::package($argv[2]);' "$src" "$bridge"
          unzip -q "$old_zip" -d "$success"
          unzip -q "$old_zip" -d "$fault"
          for site in "$success" "$fault"; do
            php "$src/tests/compatibility/r102_install_published_sqlite.php" "$site"
          done
          php "$src/tests/compatibility/r102_bridge_installed_sqlite.php" fault "$fault" "$bridge"
          php "$src/tests/compatibility/r102_bridge_installed_sqlite.php" success "$success" "$bridge"
          echo R102_REAL_PUBLISHED_011_BRIDGE_OWNER_INTENT_AND_FAULT_ROLLBACK=PASS
      - name: Native non-root Linux TAR checksum version switch and rollback
        run: |
          set -euo pipefail
          cd private-p08-r102
          if id vpsr93 >/dev/null 2>&1; then echo "TEST_USER_ALREADY_EXISTS"; exit 1; fi
          sudo useradd -m -s /bin/bash vpsr93
          cleanup() { sudo userdel -r vpsr93 >/dev/null 2>&1 || true; sudo rm -f /tmp/p08-r102-prepare.sh; }
          trap cleanup EXIT
          sudo install -m 0755 scripts/prepare-vps-static.sh /tmp/p08-r102-prepare.sh
          sudo -u vpsr93 -H bash /tmp/p08-r102-prepare.sh smoke
          php tests/runtime/vps_atomic_native.php
          echo P08_R102_UNPRIVILEGED_NATIVE_RELEASE_ROLLBACK=PASS
      - name: Real isolated Chromium Owner VPS Static Provider same-page responsive workflow
        run: |
          set -euo pipefail
          cd private-p08-r102
          site="$PWD"
          db="$RUNNER_TEMP/p08-r102-browser.sqlite"
          test ! -e "$site/.env"
          test ! -e "$db"
          touch "$db"
          chmod 0600 "$db"
          key="$(php -r 'echo base64_encode(random_bytes(32));')"
          cat > "$site/.env" <<EOF
          APP_NAME=R102_Isolated_Browser
          APP_ENV=testing
          APP_DEBUG=false
          APP_KEY=base64:$key
          APP_URL=http://127.0.0.1:18989
          APP_LOCALE=zh_CN
          DB_CONNECTION=sqlite
          DB_DATABASE=$db
          DB_FOREIGN_KEYS=true
          SESSION_DRIVER=database
          SESSION_ENCRYPT=true
          SESSION_SECURE_COOKIE=false
          CACHE_STORE=database
          QUEUE_CONNECTION=sync
          LOG_CHANNEL=stack
          EOF
          chmod 0600 "$site/.env"
          php artisan migrate --force --no-interaction >/dev/null
          php -r '
            require "vendor/autoload.php";
            $app=require "bootstrap/app.php";
            $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            Illuminate\Support\Facades\DB::table("users")->insert([
              "name"=>"Synthetic Owner", "email"=>"owner@isolated.example",
              "password"=>Illuminate\Support\Facades\Hash::make("Synthetic-SQLite-Owner-12345!"),
              "created_at"=>now(), "updated_at"=>now()
            ]);
            echo "P08_R102_SYNTHETIC_SQLITE_OWNER_FIXTURE=PASS\n";
          '
          # Synthetic Owner fixture must include the same sealed install
          # marker that public/index.php correctly requires for all /app URLs.
          mkdir -p "$site/storage/app/private/adops/installation"
          printf '%s\n' '{"status":"INSTALLED","project_id":"P08","database_driver":"sqlite","owner_id":1,"domain":"127.0.0.1"}' > "$site/storage/app/private/adops/installation/installed.json"
          chmod 0600 "$site/storage/app/private/adops/installation/installed.json"
          cat > "$RUNNER_TEMP/p08-r102-router.php" <<'PHP'
          <?php
          $site=(string)getenv('P08_R102_BROWSER_SITE');
          $path=parse_url((string)($_SERVER['REQUEST_URI']??''),PHP_URL_PATH);
          if (!is_string($path) || !str_starts_with($path,'/') || str_contains($path,'..')) {
              http_response_code(404); return true;
          }
          $public=$site.'/public';
          $candidate=$public.$path;
          if (is_file($candidate) && str_starts_with((string)realpath($candidate),$public.'/')) return false;
          require $public.'/index.php';
          PHP
          export P08_R102_BROWSER_SITE="$site"
          php -S 127.0.0.1:18989 -t "$site/public" "$RUNNER_TEMP/p08-r102-router.php" > "$RUNNER_TEMP/p08-r102-php.log" 2>&1 &
          server_pid="$!"
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:18989/login -o /dev/null; then break; fi
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:18989/login -o /dev/null
          npx playwright install chromium > "$RUNNER_TEMP/p08-r102-playwright.log" 2>&1 || { tail -n 25 "$RUNNER_TEMP/p08-r102-playwright.log"; exit 1; }
          P08_TEST_BASE_URL=http://127.0.0.1:18989 npx playwright test tests/e2e/owner-workspace.spec.ts --workers=1
          echo P08_R102_CHROMIUM_CPS_OFFER_MEDIA_RESPONSIVE=PASS
          kill "$server_pid" >/dev/null 2>&1 || true
          trap - EXIT
          rm -f "$site/.env" "$db" "$RUNNER_TEMP/p08-r102-router.php" "$RUNNER_TEMP/p08-r102-php.log" "$RUNNER_TEMP/p08-r102-playwright.log"
      - name: Always delete private checkout and temporary output
        if: always()
        run: |
          rm -rf private-p08-r102 gov-doc-r102
          rm -f "$RUNNER_TEMP/r102-sqlite-schema-atomic.zip" "$RUNNER_TEMP/p08-r102-composer.log" "$RUNNER_TEMP/p08-r102-npm.log"
          rm -rf "$RUNNER_TEMP/p08-r102-local-browser-site" "$RUNNER_TEMP/r102-old-v011-src" "$RUNNER_TEMP/r102-v011-installed-success" "$RUNNER_TEMP/r102-v011-installed-fault" "$RUNNER_TEMP/r102-v012-clean-target"
          rm -rf "$RUNNER_TEMP/r102-verified-restore-r102-v011-installed-success" "$RUNNER_TEMP/r102-verified-restore-r102-v011-installed-fault"
          rm -rf "$RUNNER_TEMP/p08-r102-extracted-FULL"
          rm -f "$RUNNER_TEMP/r102-old-v011-FULL.zip"
          rm -f "$RUNNER_TEMP/p08-r102-dev-only-FULL.zip"
          rm -f "$RUNNER_TEMP/p08-r102-local-browser-full.zip" "$RUNNER_TEMP/p08-r102-router.php" "$RUNNER_TEMP/p08-r102-local-build.json" "$RUNNER_TEMP/p08-r102-php.log" "$RUNNER_TEMP/p08-r102-playwright.log" "$RUNNER_TEMP/p08-r102-browser.sqlite"
  p08-r102-real-sql-schema-and-image:
    name: P08 R102 SQL ${{ matrix.driver }} Monitoring offline five-provider projection and native prior business
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - driver: mysql
            image: mysql:8.4
            health: mysqladmin ping --silent
          - driver: mariadb
            image: mariadb:11.8
            health: healthcheck.sh --connect --innodb_initialized
    services:
      sql:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: synthetic-only-p08-ci-pass
          MARIADB_ROOT_PASSWORD: synthetic-only-p08-ci-pass
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Transient checkout pinned private P08 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-adops
          ref: a47c456ef285d924269f4bd3f2964a9b4a83bd7f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-p08-r102
          fetch-depth: 0
      - name: Real PHP 8.4 with MySQL PDO and matching locked Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: zip, mbstring, dom, fileinfo, pdo_mysql, intl, sodium
      - name: Real SQL ${{ matrix.driver }} schema Owner Tracker and prior CPS revision
        env:
          R102_ENGINE: ${{ matrix.driver }}
        run: |
          set -euo pipefail
          cd private-p08-r102
          test "$(git rev-parse HEAD)" = a47c456ef285d924269f4bd3f2964a9b4a83bd7f
          test ! -e .env
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs storage/app/private/adops
          composer install --no-interaction --no-progress --prefer-dist --no-scripts > "$RUNNER_TEMP/p08-r102-sql-composer.log" 2>&1 || { tail -n 25 "$RUNNER_TEMP/p08-r102-sql-composer.log"; exit 1; }
          php -r '
            $db=new PDO("mysql:host=127.0.0.1;port=3306;charset=utf8mb4","root","synthetic-only-p08-ci-pass", [PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);
            $db->exec("CREATE DATABASE p08_r102_sql CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci");
          '
          key="$(php -r 'echo base64_encode(random_bytes(32));')"
          cat > .env <<EOF
          APP_NAME=P08_R102_Isolated_SQL
          APP_ENV=testing
          APP_DEBUG=false
          APP_KEY=base64:$key
          APP_URL=http://localhost
          DB_CONNECTION=$R102_ENGINE
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=p08_r102_sql
          DB_USERNAME=root
          DB_PASSWORD=synthetic-only-p08-ci-pass
          SESSION_DRIVER=array
          CACHE_STORE=array
          QUEUE_CONNECTION=sync
          LOG_CHANNEL=stack
          EOF
          chmod 0600 .env
          php artisan migrate --force --no-interaction >/dev/null
          php -r '
            require "vendor/autoload.php";
            $app=require "bootstrap/app.php";
            $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            $db=Illuminate\Support\Facades\DB::connection();
            $owner=$db->table("users")->insertGetId([
              "name"=>"Synthetic R102 Owner",
              "email"=>"r102-native-sql@isolated.example",
              "password"=>Illuminate\Support\Facades\Hash::make("Synthetic-pass-12345678"),
              "created_at"=>now(),"updated_at"=>now()
            ]);
            if(!Illuminate\Support\Facades\Schema::hasTable("landing_assets"))throw new RuntimeException("R102_MISSING_NATIVE_SQL_IMAGE_SCHEMA");
            if(!Illuminate\Support\Facades\Schema::hasTable("static_pages_targets"))throw new RuntimeException("R102_MISSING_NATIVE_SQL_PAGES_TARGET_SCHEMA");
            if(!Illuminate\Support\Facades\Schema::hasTable("tracker_connections"))throw new RuntimeException("R102_MISSING_NATIVE_SQL_TRACKER_SCHEMA");
            if(!Illuminate\Support\Facades\Schema::hasTable("static_vps_targets"))throw new RuntimeException("R102_MISSING_NATIVE_SQL_VPS_SCHEMA");
            if(!Illuminate\Support\Facades\Schema::hasTable("domain_records"))throw new RuntimeException("R102_MISSING_NATIVE_SQL_DOMAIN_SCHEMA");
            if(!Illuminate\Support\Facades\Schema::hasTable("ad_google_oauth_pending"))throw new RuntimeException("R102_MISSING_NATIVE_SQL_GOOGLE_OAUTH_STATE");
            if(!Illuminate\Support\Facades\Schema::hasTable("ad_channel_connections"))throw new RuntimeException("R102_MISSING_NATIVE_SQL_AD_ACCOUNTS");
            if(!Illuminate\Support\Facades\Schema::hasTable("ad_meta_oauth_pending"))throw new RuntimeException("R102_MISSING_NATIVE_SQL_META_OAUTH_PENDING");
            if(!Illuminate\Support\Facades\Schema::hasTable("ad_meta_connections"))throw new RuntimeException("R102_MISSING_NATIVE_SQL_META_CONNECTIONS");
            if(!Illuminate\Support\Facades\Schema::hasTable("ad_tiktok_oauth_pending"))throw new RuntimeException("R102_MISSING_NATIVE_SQL_TIKTOK_OAUTH_PENDING");
            if(!Illuminate\Support\Facades\Schema::hasTable("ad_tiktok_connections"))throw new RuntimeException("R102_MISSING_NATIVE_SQL_TIKTOK_CONNECTIONS");
            if(!Illuminate\Support\Facades\Schema::hasTable("ad_popads_connections"))throw new RuntimeException("R102_MISSING_NATIVE_SQL_POPADS_CONNECTIONS");
            $connId=(string)Illuminate\Support\Str::uuid();
            $db->table("ad_popads_connections")->insert([
              "id"=>$connId, "owner_id"=>$owner,"label"=>"Synthetic PopAds",
              "username"=>"isolated_r102", "encrypted_api_key"=>"encrypted_fixture_not_a_real_token",
              "key_fingerprint"=>hash("sha256","synthetic_r102"),
              "state"=>"CONNECTED", "created_at"=>now(), "updated_at"=>now()
            ]);
            if($db->table("ad_popads_connections")->where("id",$connId)->where("owner_id",$owner)->count()!==1)throw new RuntimeException("R102_NATIVE_POPADS_SQL_INSERT_FAILED");
            $monitorStart=now()->subDay()->toDateString();
            $monitorEnd=now()->toDateString();
            $db->table("ad_popads_connections")->where("id",$connId)->update([
              "snapshot_json"=>json_encode([
                "provider"=>"popads","from"=>$monitorStart,"to"=>$monitorEnd,
                "timezone"=>"UTC","currency"=>"USD",
                "fetched_at"=>now()->toIso8601String(),
                "insights"=>[["campaign_id"=>"9901","cost"=>3.5,"impressions"=>900,"currency"=>"USD"]],
                "report_partial"=>false
              ],JSON_THROW_ON_ERROR)
            ]);
            $nativeMonitor=(new App\Modules\Monitoring\Actions\MonitoringReadModel())->forOwner((int)$owner);
            $monitorPop=array_values(array_filter($nativeMonitor["rows"],static fn(array $row):bool=>$row["provider"]==="popads"));
            if(count($monitorPop)!==1 || $monitorPop[0]["metrics"]["spend"]!==3.5
              || $monitorPop[0]["metrics"]["impressions"]!==900
              || $monitorPop[0]["metrics"]["roi"]!==null
              || $monitorPop[0]["currency"]!=="USD"
              || $nativeMonitor["provenance"]!=="owner_local_saved_snapshots_only")
              throw new RuntimeException("R102_NATIVE_MONITORING_READ_MODEL_FAIL");
            $otherMonitor=(new App\Modules\Monitoring\Actions\MonitoringReadModel())->forOwner(999999999);
            if($otherMonitor["rows"]!==[])throw new RuntimeException("R102_NATIVE_MONITORING_OWNER_LEAK");
            echo "R102_NATIVE_MONITORING_".strtoupper(getenv("R102_ENGINE"))."=PASS\n";
            if(!Illuminate\Support\Facades\Schema::hasTable("automation_rules")
              ||!Illuminate\Support\Facades\Schema::hasTable("automation_suggestions"))
              throw new RuntimeException("R102_NATIVE_AUTOMATION_SCHEMA_MISSING");
            $engine=new App\Modules\Automation\Actions\AutomationRuleEngine(
              new App\Modules\Monitoring\Actions\MonitoringReadModel()
            );
            $engine->create((int)$owner,[
              "name"=>"Native SQL suggestion guard","provider"=>"popads",
              "connection_id"=>$connId,"metric"=>"spend","comparison"=>"gte",
              "threshold"=>2,"currency"=>"USD","min_sample"=>100,
              "cooldown_hours"=>24,"max_suggestions_per_day"=>2
            ]);
            $autoRule=$db->table("automation_rules")->where("owner_id",$owner)->first();
            if(!$autoRule || $autoRule->state!=="PAUSED")
              throw new RuntimeException("R102_NATIVE_DEFAULT_PAUSED_FAILED");
            $autoState=$engine->toggle((int)$owner,$autoRule->id);
            if($autoState!=="ENABLED")throw new RuntimeException("R102_NATIVE_TOGGLE_FAILED");
            if($engine->simulate((int)$owner,$autoRule->id)!=="SUGGESTED")
              throw new RuntimeException("R102_NATIVE_SIMULATE_SUGGEST_FAILED");
            if($engine->simulate((int)$owner,$autoRule->id)!=="COOLDOWN")
              throw new RuntimeException("R102_NATIVE_COOLDOWN_FAILED");
            $suggestions=$db->table("automation_suggestions")
              ->where("owner_id",$owner)->where("rule_id",$autoRule->id)->get();
            if($suggestions->count()!==2
              ||$db->table("automation_suggestions")->where("owner_id",999999999)->count()!==0
              ||count($engine->forOwner(999999999)["rules"])!==0)
              throw new RuntimeException("R102_NATIVE_OWNER_AUDIT_ISOLATION_FAIL");
            if(str_contains((string)$suggestions[0]->audit_json,"encrypted_api_key"))
              throw new RuntimeException("R102_NATIVE_SECRET_LEAK");
            $engine->archive((int)$owner,$autoRule->id);
            if(count($engine->forOwner((int)$owner)["rules"])!==0
              ||count($engine->forOwner((int)$owner)["history"])!==2)
              throw new RuntimeException("R102_NATIVE_ARCHIVE_AUDIT_LOSS");
            echo "R102_NATIVE_AUTOMATION_".strtoupper(getenv("R102_ENGINE"))."=PASS\n";
            $db->table("ad_popads_connections")->where("id",$connId)->delete();
            $bytes=base64_decode("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+a6eoAAAAASUVORK5CYII=",true);
            $tmp=tempnam(sys_get_temp_dir(),"r102native");
            try {
              file_put_contents($tmp,$bytes);
              $upload=new Illuminate\Http\UploadedFile($tmp,"native.png","image/png",null,true);
              $asset=(new App\Modules\Landing\Actions\LandingAssetLibrary())->upload((int)$owner,$upload);
              $payload=["kind"=>"cps","template"=>"focus",
                "title"=>"SQL isolated CPS","headline"=>"CPS isolated header",
                "body"=>"Synthetic only","cta_text"=>"View",
                "cta_url"=>"https://example.com/offer",
                "offer_reference"=>"OFFER-NATIVE-SQL-90",
                "image_asset_id"=>$asset["id"],"image_alt"=>"Native SQL test image"];
              $id=(new App\Modules\Landing\Actions\CreateLanding())->execute($payload,(int)$owner);
              $page=$db->table("landing_pages")->where("id",$id)->first();
              $revision=$db->table("landing_revisions")->where("landing_page_id",$id)->where("revision",1)->first();
              if($page===null||$revision===null||$page->kind!=="cps"
                 ||json_decode((string)$revision->source_payload,true)["offer_reference"]!=="OFFER-NATIVE-SQL-90")throw new RuntimeException("R102_CPS_SQL_PERSISTENCE_FAIL");
              $root=storage_path("app/private/adops/landings/".$id);
              $manifest=(new VF\AdOps\Landing\LandingVersionStore())->verify($root,1,(string)$revision->bundle_sha256);
              if($manifest["file_count"]!==3||!isset($manifest["files"]["media/hero.png"]))throw new RuntimeException("R102_SQL_IMAGE_MANIFEST_FAIL");
              if(file_get_contents($root."/versions/1/media/hero.png")!==$bytes)throw new RuntimeException("R102_SQL_IMAGE_BYTES_FAIL");
              (new App\Modules\Landing\Actions\LandingAssetLibrary())->archive((int)$owner,$asset["id"]);
              if(!is_file($root."/versions/1/media/hero.png"))throw new RuntimeException("R102_SQL_ARCHIVE_REMOVED_IMMUTABLE_IMAGE");
              echo "P08_R102_".strtoupper(getenv("R102_ENGINE"))."_SQL_SCHEMA_OWNER_CPS_IMAGE_REVISION=PASS\n";
            } finally { @unlink($tmp); }
          '
      - name: R102 actual disposable SQL first install clean/dirty and all ten migrations
        env:
          R102_ENGINE: ${{ matrix.driver }}
          P08_ISOLATED_INSTALL_TEST: YES
          P08_TEST_DB_HOST: 127.0.0.1
          P08_TEST_DB_CLEAN: p08_ci_clean
          P08_TEST_DB_DIRTY: p08_ci_dirty
          P08_TEST_DB_USER: root
          P08_TEST_DB_PASSWORD: synthetic-only-p08-ci-pass
          P08_TEST_DB_DRIVER: ${{ matrix.driver }}
        run: |
          set -euo pipefail
          src="$PWD/private-p08-r102"
          dest="$RUNNER_TEMP/p08-r102-first-install-$R102_ENGINE"
          test ! -e "$dest"
          mkdir -m 0700 "$dest"
          # Do not run the first installer on an existing migrated DB or site.
          tar -C "$src" -cf - --exclude='./.git' --exclude='./.env' \
            --exclude='./storage/app/private' --exclude='./storage/logs' \
            --exclude='./database/*.sqlite' . | tar -C "$dest" -xf -
          cd "$dest"
          test ! -e .env
          php tests/fixtures/create_ci_databases.php
          php tests/test_install_mysql_e2e.php
          P08_R102_DISPOSABLE_SCHEMA=YES php tests/compatibility/r102_old_schema_native.php
          echo "R102_REAL_FIRST_INSTALL_${R102_ENGINE}_OWNER_ALL_MIGRATIONS=PASS"
      - name: R102 native SQL actual v0.1.1 FULL to v0.1.2 versioned and recover
        env:
          P08_ISOLATED_INSTALL_TEST: YES
          P08_R102_DISPOSABLE_SCHEMA: YES
          P08_TEST_DB_HOST: 127.0.0.1
          P08_TEST_DB_USER: root
          P08_TEST_DB_PASSWORD: synthetic-only-p08-ci-pass
          P08_TEST_DB_DRIVER: ${{ matrix.driver }}
        run: |
          set -euo pipefail
          src="$PWD/private-p08-r102"
          older="$RUNNER_TEMP/r102-native-old-source-$P08_TEST_DB_DRIVER"
          cleanNew="$RUNNER_TEMP/r102-native-new-source-$P08_TEST_DB_DRIVER"
          older_zip="$RUNNER_TEMP/r102-native-old-FULL-$P08_TEST_DB_DRIVER.zip"
          target_zip="$RUNNER_TEMP/r102-native-new-FULL-$P08_TEST_DB_DRIVER.zip"
          target="$RUNNER_TEMP/r102-native-new-target-$P08_TEST_DB_DRIVER"
          success="$RUNNER_TEMP/r102-native-old-success-$P08_TEST_DB_DRIVER"
          fault="$RUNNER_TEMP/r102-native-old-fault-$P08_TEST_DB_DRIVER"
          for path in "$older" "$cleanNew" "$older_zip" "$target_zip" "$target" "$success" "$fault"; do test ! -e "$path"; done
          git -C "$src" worktree add --detach "$older" v0.1.1
          git -C "$src" worktree add --detach "$cleanNew" HEAD
          test "$(git -C "$cleanNew" rev-parse HEAD)" = a47c456ef285d924269f4bd3f2964a9b4a83bd7f
          test "$(git -C "$older" rev-parse HEAD)" = 9c7f76434fe2d064f2f1ac15c58a760f778cf055
          cmp "$older/composer.lock" "$src/composer.lock"
          cmp "$older/package-lock.json" "$src/package-lock.json"
          cp -a "$src/vendor" "$older/vendor"
          cp -a "$src/vendor" "$cleanNew/vendor"
          (cd "$cleanNew"; npm ci --no-audit --no-fund >/dev/null; npm run build >/dev/null)
          (cd "$older"; npm ci --no-audit --no-fund >/dev/null; npm run build >/dev/null)
          python3 - "$older" "$older_zip" "$cleanNew" "$target_zip" <<'PY'
          import sys,subprocess
          from pathlib import Path
          a,az,b,bz=map(Path,sys.argv[1:5])
          sys.path.insert(0,str(b/"scripts"))
          from build_full import write_full
          write_full(a,az,"0.1.1","9c7f76434fe2d064f2f1ac15c58a760f778cf055")
          sha=subprocess.check_output(["git","-C",str(b),"rev-parse","HEAD"],text=True).strip()
          write_full(b,bz,"0.1.2",sha)
          print("R102_REAL_SQL_NATIVE_OLD_AND_NEW_FULL_BUILD=PASS")
          PY
          mkdir -m 0700 "$target" "$success" "$fault"
          unzip -q "$target_zip" -d "$target"
          unzip -q "$older_zip" -d "$success"
          unzip -q "$older_zip" -d "$fault"
          schema_zip="$RUNNER_TEMP/r102-native-schema-atomic-$P08_TEST_DB_DRIVER.zip"
          test ! -e "$schema_zip"
          python3 - "$src" "$success" "$target" "$schema_zip" <<'PY'
          import sys,hashlib,json
          from pathlib import Path
          src,old,target,out=map(Path,sys.argv[1:5])
          sys.path.insert(0,str(src/"scripts"))
          from build_r102_schema_atomic import build
          oldsha=hashlib.sha256((old/"FULL_MANIFEST.json").read_bytes()).hexdigest()
          targetsha=json.loads((target/"FULL_MANIFEST.json").read_text())["source_sha"]
          x=build(target,out,oldsha,targetsha)
          assert x["migrations"]==10 and x["files"]>20
          print("R102_SCHEMA_ATOMIC_NATIVE_REAL_COMPILED_BYTES=PASS")
          PY
          export P08_R102_SCHEMA_ZIP="$schema_zip"
          export P08_R102_SCHEMA_ZIP_SHA="$(sha256sum "$schema_zip" | cut -d' ' -f1)"
          for mode in success fault; do
            site="$success"
            if [ "$mode" = fault ]; then site="$fault"; fi
            php "$src/tests/compatibility/r102_install_published_native_sql.php" "$site" "$mode"
            if [ "$mode" = success ]; then
              native_dump="$(command -v mariadb-dump || command -v mysqldump || true)"
              test -n "$native_dump" || { echo R102_NATIVE_DUMP_CLI=NOT_INSTALLED; exit 1; }
              # Keep this independent native-client probe byte-compatible with
              # the product fallback for MariaDB servers and a MySQL 8 client.
              dump_extra=()
              if [ "$P08_TEST_DB_DRIVER" = mariadb ] && [ "${native_dump##*/}" = mysqldump ]; then
                dump_extra=(--column-statistics=0 --no-tablespaces)
              fi
              set +e
              MYSQL_PWD="$P08_TEST_DB_PASSWORD" "$native_dump" --no-defaults \
                --host=127.0.0.1 --port=3306 --user=root --default-character-set=utf8mb4 \
                --single-transaction --quick --skip-comments --skip-dump-date \
                --skip-add-drop-table --skip-add-locks --skip-lock-tables --skip-triggers \
                "${dump_extra[@]}" r102_old_success > "$RUNNER_TEMP/r102-cli-dump-$P08_TEST_DB_DRIVER.sql" \
                2>"$RUNNER_TEMP/r102-cli-dump-$P08_TEST_DB_DRIVER.err"
              diagnostic_rc=$?
              set -e
              if [ "$diagnostic_rc" -ne 0 ]; then
                if grep -qiE 'unknown (option|variable)|unrecognized option' "$RUNNER_TEMP/r102-cli-dump-$P08_TEST_DB_DRIVER.err"; then
                  echo R102_NATIVE_DUMP_CLI=UNSUPPORTED_OPTION
                elif grep -qiE 'Access denied|authentication failed' "$RUNNER_TEMP/r102-cli-dump-$P08_TEST_DB_DRIVER.err"; then
                  echo R102_NATIVE_DUMP_CLI=AUTHENTICATION_REJECTED
                elif grep -qiE 'SSL|TLS|certificate' "$RUNNER_TEMP/r102-cli-dump-$P08_TEST_DB_DRIVER.err"; then
                  echo R102_NATIVE_DUMP_CLI=TLS_REJECTED
                else
                  echo R102_NATIVE_DUMP_CLI=FAILED_OTHER
                fi
                exit 1
              fi
              test -s "$RUNNER_TEMP/r102-cli-dump-$P08_TEST_DB_DRIVER.sql"
              echo R102_NATIVE_DUMP_CLI=PASS
              rm -f "$RUNNER_TEMP/r102-cli-dump-$P08_TEST_DB_DRIVER.sql" "$RUNNER_TEMP/r102-cli-dump-$P08_TEST_DB_DRIVER.err"
            fi
            php "$src/tests/compatibility/r102_old_full_installed_native_sql.php" "$mode" "$site" "$target"
          done
          echo "R102_REAL_NATIVE_UPGRADE_AND_RESTORE=PASS"
      - name: Always clean private source and disposable credentials
        if: always()
        run: |
          rm -rf private-p08-r102 "$RUNNER_TEMP/p08-r102-first-install-mysql" "$RUNNER_TEMP/p08-r102-first-install-mariadb"
          rm -rf "$RUNNER_TEMP"/r102-native-old-source-* "$RUNNER_TEMP"/r102-native-new-source-* "$RUNNER_TEMP"/r102-native-new-target-* "$RUNNER_TEMP"/r102-native-old-success-* "$RUNNER_TEMP"/r102-native-old-fault-* "$RUNNER_TEMP"/r102-private-verify-r102-native-old-*
          rm -f "$RUNNER_TEMP"/r102-native-schema-atomic-*.zip "$RUNNER_TEMP"/r102-native-old-FULL-*.zip "$RUNNER_TEMP"/r102-native-new-FULL-*.zip "$RUNNER_TEMP"/r102-cli-dump-*.sql "$RUNNER_TEMP"/r102-cli-dump-*.err
          rm -f "$RUNNER_TEMP/p08-r102-sql-composer.log"
