name: P07 M03-D04 MySQL8.4 receiver strict engine guard unit
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-m03-d04-mysql84-same-engine-20261115.yml'
      - 'tests/p07_m03_d04_mysql84_same_engine_full.sh'
permissions:
  contents: read
jobs:
  mysql84-engine-readonly-guard-unit:
    # One bounded correction of exact source pin; normal product full test.
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout public synthetic runner harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout private exact P07 product commit transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 16a3bdbfbcdabcfbd92d4e2ef9e9a4cf26d16de7
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: .p07-private-exact
      - name: Exact-source MySQL 8.4 receiver SQL-safety and vendor negative checks
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-private-exact rev-parse HEAD)" = 16a3bdbfbcdabcfbd92d4e2ef9e9a4cf26d16de7
          (
            cd .p07-private-exact
            export PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 PYTHONPATH="$PWD/lib"
            python3 -B -m unittest discover -s tests -p test_p07_m03_gtid_safe_reexport.py -v
            python3 -B -m unittest discover -s tests -p test_migration_source_mysql_hex_export.py -v
            python3 -B -m unittest discover -s tests -p test_p07_m03_source_sql_safety_preimport.py -v
            python3 -B -m unittest discover -s tests -p test_migration_safe_session_guard.py -v
            python3 -B -m unittest discover -s tests -p test_p07_m03_mysql84_receiver_preflight.py -v
          )
          echo P07_M03_D04_DYNAMIC_EXECUTION_NATIVE_REEXPORT_UNIT=PASS
          bash -n tests/p07_m03_d04_mysql84_same_engine_full.sh
          echo P07_M03_D04_MYSQL84_PERCONA_ENGINE_GUARD_UNIT=PASS
      - name: Remove private product checkout
        if: always()
        shell: bash
        run: |
          rm -rf -- .p07-private-exact
          test ! -e .p07-private-exact
          echo P07_M03_D04_MYSQL_TEST_PRIVATE_SOURCE_CLEAN=PASS
