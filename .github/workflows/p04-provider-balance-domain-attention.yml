name: P04 V2.8.7 Formal Candidate Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'requests/p04-provider-balance-domain-attention-*.txt'
      - '.github/workflows/p04-provider-balance-domain-attention.yml'

permissions:
  contents: read

concurrency:
  group: p04-v287-formal-candidate
  cancel-in-progress: true

env:
  SOURCE_REPOSITORY: llhzx2018/vf-infra
  SOURCE_COMMIT: '8d03885eaef8bd5e8fe6deca24e7f4b07fe533e0'
  BASE_COMMIT: '4a073698175f9536936de6a20438b29f1e821b65'
  TARGET_VERSION: '2.8.7'
  SCHEMA: '14'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Registered private source capability
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN" || { echo 'VF_PRIVATE_READ_TOKEN_MISSING' >&2; exit 78; }
          echo 'PRIVATE_SOURCE_CREDENTIAL=PASS'

      - name: Checkout exact P04 candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_COMMIT }}
          token: ${{ env.READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: candidate

      - name: Exact source, version and bounded scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(tr -d '\r\n' < candidate/VERSION)" = "$TARGET_VERSION"
          test ! -e candidate/database/migrations/015_
          mapfile -t changed < <(git -C candidate diff --name-only "$BASE_COMMIT"...HEAD | sort)
          expected=$(printf '%s\n'             .github/workflows/ci.yml             VERSION             VF_PROJECT.json             docs/authority/ACCEPTANCE_MATRIX.md             docs/authority/RPD.md             docs/authority/SSOT.md             docs/operations/package/FULL_INSTALL_ONLY.txt             docs/operations/package/README.md             docs/operations/package/RECOVERED_BUILD_NOTICE.txt             docs/operations/package/RELEASE_NOTES.md             public/assets/v270-reference-lock.js             public/assets/v271-unified-shell.css             public/assets/v271-unified-shell.js             public/assets/v275-ua-workflow.js             scripts/build-release-tree.py             scripts/build-v287-update-release.py             src/app/Core/PersonalInfraMoneyTrait.php             src/app/Core/PersonalInfraTodayTrait.php             tests/e2e/provider_balance_domain_attention.mjs             tests/integration/provider_balance_domain_attention_contract.php | sort)
          actual=$(printf '%s\n' "${changed[@]}")
          test "$actual" = "$expected"
          jq -e '.project_id=="P04" and .version=="2.8.7" and .schema==14 and .current_change.migration=="NONE" and .current_change.provider_authority_change==false and .current_change.owner_preview_runtime_applicability=="N/A_MAINTENANCE_HOTFIX"' candidate/VF_PROJECT.json >/dev/null
          echo 'P04_V287_BOUNDED_SCOPE=PASS'
          echo 'MIGRATION=NONE'

      - name: Prepare PHP and Node
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, fileinfo, sodium, zip, curl, mbstring

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Repository, syntax and contract checks
        shell: bash
        working-directory: candidate
        run: |
          set -Eeuo pipefail
          python scripts/repository-health-gate.py
          python scripts/check-migrations.py
          python -m py_compile scripts/build-release-tree.py scripts/build-v287-update-release.py
          find src public tests -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          node --check public/assets/v270-reference-lock.js
          node --check public/assets/v271-unified-shell.js
          node --check public/assets/v275-ua-workflow.js
          node --check tests/e2e/provider_balance_domain_attention.mjs
          php tests/integration/provider_balance_domain_attention_contract.php
          php tests/integration/provider_billing_contract_v250.php src
          php tests/integration/provider_billing_pagination_v256.php src
          php tests/unit/provider_currency_contract_v256.php src
          echo 'P04_V287_STATIC_AND_BACKEND_CONTRACTS=PASS'

      - name: Non-renewal attention browser behavior
        shell: bash
        working-directory: candidate
        run: |
          set -Eeuo pipefail
          npm install --no-save --silent jsdom@26
          node tests/e2e/provider_balance_domain_attention.mjs

      - name: Deterministic FULL and Atomic UPDATE candidate
        shell: bash
        working-directory: candidate
        run: |
          set -Eeuo pipefail
          rm -rf "$RUNNER_TEMP/v287-runtime-a" "$RUNNER_TEMP/v287-runtime-b" "$RUNNER_TEMP/v287-update-a" "$RUNNER_TEMP/v287-update-b" "$RUNNER_TEMP/v287-full-a" "$RUNNER_TEMP/v287-full-b" "$GITHUB_WORKSPACE/evidence"
          mkdir -p "$RUNNER_TEMP/v287-full-a" "$RUNNER_TEMP/v287-full-b" "$GITHUB_WORKSPACE/evidence"
          python scripts/build-release-tree.py "$RUNNER_TEMP/v287-runtime-a" > "$GITHUB_WORKSPACE/evidence/release-tree.json"
          python scripts/build-release-tree.py "$RUNNER_TEMP/v287-runtime-b" >/dev/null
          diff -qr "$RUNNER_TEMP/v287-runtime-a" "$RUNNER_TEMP/v287-runtime-b"
          jq -e '.version=="2.8.7" and .target_schema==14 and .release_kind=="maintenance_release" and .phase_status=="CANDIDATE"' "$RUNNER_TEMP/v287-runtime-a/release-manifest.json" >/dev/null
          python scripts/build-v287-update-release.py --target-runtime "$RUNNER_TEMP/v287-runtime-a" --output "$RUNNER_TEMP/v287-update-a" > "$GITHUB_WORKSPACE/evidence/update-build.json"
          python scripts/build-v287-update-release.py --target-runtime "$RUNNER_TEMP/v287-runtime-a" --output "$RUNNER_TEMP/v287-update-b" >/dev/null
          cmp "$RUNNER_TEMP/v287-update-a/VF_Infra_V2.8.7_UPDATE.zip" "$RUNNER_TEMP/v287-update-b/VF_Infra_V2.8.7_UPDATE.zip"
          php "$RUNNER_TEMP/v287-update-a/repair-v2.8.7.php" --self-test | tee "$GITHUB_WORKSPACE/evidence/atomic-self-test.txt"
          grep -Fq 'ATOMIC_SELF_TEST_PASS target=2.8.7 schema=14' "$GITHUB_WORKSPACE/evidence/atomic-self-test.txt"
          jq -e '.version=="2.8.7" and .schema==14 and .allowed_source_versions==["2.7.9","2.8.0","2.8.1","2.8.2","2.8.3","2.8.4","2.8.5","2.8.6"] and .provider_balance_display==true and .provider_detail_alignment==true and .do_not_renew_daily_attention_excluded==true and .do_not_renew_danger_alerts_preserved==true and .migration=="NONE"' "$RUNNER_TEMP/v287-update-a/PACKAGE_MANIFEST.json" >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,zipfile
          runtime=Path(os.environ['RUNNER_TEMP'])/'v287-runtime-a'
          def build(path):
              with zipfile.ZipFile(path,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9,strict_timestamps=True) as z:
                  for f in sorted(x for x in runtime.rglob('*') if x.is_file()):
                      rel=f.relative_to(runtime).as_posix()
                      info=zipfile.ZipInfo(rel,date_time=(1980,1,1,0,0,0))
                      info.compress_type=zipfile.ZIP_DEFLATED; info.create_system=3; info.external_attr=(0o100644<<16)
                      z.writestr(info,f.read_bytes())
          a=Path(os.environ['RUNNER_TEMP'])/'v287-full-a'/'VF_Infra_V2.8.7_FULL.zip'
          b=Path(os.environ['RUNNER_TEMP'])/'v287-full-b'/'VF_Infra_V2.8.7_FULL.zip'
          build(a); build(b)
          assert a.read_bytes()==b.read_bytes()
          update=Path(os.environ['RUNNER_TEMP'])/'v287-update-a'/'VF_Infra_V2.8.7_UPDATE.zip'
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          manifest=json.loads((runtime/'release-manifest.json').read_text(encoding='utf-8'))
          report={
            'status':'PASS','version':'2.8.7','schema':14,'migration':'NONE',
            'product_source':os.environ['SOURCE_COMMIT'],
            'runtime_file_count_including_manifest':manifest['file_count']+1,
            'runtime_fingerprint':manifest['source_fingerprint'],
            'full':{'bytes':a.stat().st_size,'sha256':sha(a)},
            'update':{'bytes':update.stat().st_size,'sha256':sha(update)},
            'atomic_self_test':'PASS','browser_attention':'PASS',
            'provider_authority':'READ_ONLY_FIRST','production_write':0
          }
          evidence=Path(os.environ['GITHUB_WORKSPACE'])/'evidence'
          (evidence/'P04_V287_FORMAL_CANDIDATE.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (evidence/'VF_Infra_V2.8.7_FULL.zip').write_bytes(a.read_bytes())
          (evidence/'VF_Infra_V2.8.7_UPDATE.zip').write_bytes(update.read_bytes())
          (evidence/'PACKAGE_MANIFEST.json').write_bytes((Path(os.environ['RUNNER_TEMP'])/'v287-update-a'/'PACKAGE_MANIFEST.json').read_bytes())
          print(json.dumps(report,ensure_ascii=False))
          PY
          echo 'P04_V287_FORMAL_CANDIDATE=PASS'

      - name: Upload candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: P04-V2.8.7-FORMAL-CANDIDATE
          path: evidence/
          if-no-files-found: error
          retention-days: 30
