name: P04 Provider Balance Domain Attention Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'requests/p04-provider-balance-domain-attention-*.txt'
      - '.github/workflows/p04-provider-balance-domain-attention.yml'

permissions:
  contents: read

concurrency:
  group: p04-provider-balance-domain-attention
  cancel-in-progress: true

env:
  SOURCE_REPOSITORY: llhzx2018/vf-infra
  SOURCE_COMMIT: '6738e5fa02fdd6f10c51ea15d37c7a11a52cdd98'
  BASE_COMMIT: '4a073698175f9536936de6a20438b29f1e821b65'
  SCHEMA: '14'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Registered private source capability
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN" || { echo 'VF_PRIVATE_READ_TOKEN_MISSING' >&2; exit 78; }
          echo 'PRIVATE_SOURCE_CREDENTIAL=PASS'

      - name: Checkout exact P04 hotfix
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_COMMIT }}
          token: ${{ env.READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: candidate

      - name: Exact source and bounded scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(tr -d '\r\n' < candidate/VERSION)" = '2.8.6'
          test ! -e candidate/database/migrations/015_
          mapfile -t changed < <(git -C candidate diff --name-only "$BASE_COMMIT"...HEAD | sort)
          expected=$(printf '%s\n'             .github/workflows/ci.yml             public/assets/v270-reference-lock.js             public/assets/v271-unified-shell.css             public/assets/v271-unified-shell.js             public/assets/v275-ua-workflow.js             src/app/Core/PersonalInfraMoneyTrait.php             src/app/Core/PersonalInfraTodayTrait.php             tests/e2e/provider_balance_domain_attention.mjs             tests/integration/provider_balance_domain_attention_contract.php | sort)
          actual=$(printf '%s\n' "${changed[@]}")
          test "$actual" = "$expected"
          echo 'P04_BOUNDED_SCOPE=PASS'
          echo 'MIGRATION=NONE'

      - name: Prepare PHP and Node
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, fileinfo, sodium, zip, curl, mbstring

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Repository, syntax and contract checks
        shell: bash
        working-directory: candidate
        run: |
          set -Eeuo pipefail
          python scripts/repository-health-gate.py
          python scripts/check-migrations.py
          find src public tests -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          node --check public/assets/v270-reference-lock.js
          node --check public/assets/v271-unified-shell.js
          node --check public/assets/v275-ua-workflow.js
          node --check tests/e2e/provider_balance_domain_attention.mjs
          php tests/integration/provider_balance_domain_attention_contract.php
          php tests/integration/provider_billing_contract_v250.php src
          php tests/integration/provider_billing_pagination_v256.php src
          php tests/unit/provider_currency_contract_v256.php src
          echo 'P04_STATIC_AND_BACKEND_CONTRACTS=PASS'

      - name: Non-renewal attention browser behavior
        shell: bash
        working-directory: candidate
        run: |
          set -Eeuo pipefail
          npm install --no-save --silent jsdom@26
          node tests/e2e/provider_balance_domain_attention.mjs

      - name: Public-safe verification summary
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p public-evidence
          {
            echo 'PROJECT=P04'
            echo "SOURCE_SHA=$SOURCE_COMMIT"
            echo "SCHEMA=$SCHEMA"
            echo 'MIGRATION=NONE'
            echo 'PRODUCTION_WRITE=0'
            echo 'RELEASE_WRITE=0'
            echo "JOB_STATUS=${{ job.status }}"
          } > public-evidence/P04_PROVIDER_BALANCE_DOMAIN_ATTENTION.txt

      - name: Upload public-safe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P04-PROVIDER-BALANCE-DOMAIN-ATTENTION
          path: public-evidence/P04_PROVIDER_BALANCE_DOMAIN_ATTENTION.txt
          if-no-files-found: error
          retention-days: 7
