name: P01 V2.47.133 Main Exact Gate

on:
  push:
    branches:
      - test-p01-v247133-main-gate-20260930
    paths:
      - '.github/workflows/temp-p01-v247133-main-gate.yml'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact main candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: fa2741d17bb54ce2e204a944a2f710d8436473ca
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          path: candidate

      - name: Checkout stable baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: a52eb5cf4b9d32da8d46325378c61ce94aeeab08
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: baseline

      - name: Exact main identity and syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat candidate/VERSION)" = "2.47.133"
          test "$(cat candidate/src/VERSION.txt)" = "2.47.133"
          grep -F "define('VF_VERSION', '2.47.133');" candidate/src/app/bootstrap.php
          php -l candidate/src/app/IconCache.php
          php -l candidate/src/api.php
          php -l candidate/src/icons.php
          php -l candidate/src/app/AdminShell.php
          php -l candidate/tests/unit/navigation_v247126_rail_icon_fix_contract.php
          node --check candidate/src/assets/icons.js
          echo P01_V247133_MAIN_IDENTITY=PASS

      - name: Focused favicon and admin contracts
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          php tests/unit/navigation_v247126_rail_icon_fix_contract.php
          php tests/unit/admin_icon_maintenance_v247133_contract.php
          php tests/unit/admin_backend_coverage_r60_contract.php
          php tests/unit/admin_navigation_consistency_contract.php
          php tests/unit/navigation_v247127_favicon_reliability_contract.php
          php tests/unit/navigation_v247127_favicon_provider_privacy_contract.php
          php tests/unit/navigation_v247127_safe_svg_favicon_contract.php
          php tests/unit/navigation_v247128_favicon_recovery_queue_contract.php
          php tests/unit/navigation_v247130_favicon_provider_generation_contract.php
          php tests/unit/navigation_v247131_favicon_stale_success_selfheal_contract.php
          php tests/unit/navigation_v247132_favicon_success_generation_refresh_contract.php
          php tests/unit/navigation_v247133_favicon_all_view_recovery_contract.php
          echo P01_V247133_MAIN_FOCUSED=PASS

      - name: Canonical regression
        shell: bash
        run: |
          set -euo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate baseline
          echo P01_V247133_MAIN_CANONICAL=PASS
