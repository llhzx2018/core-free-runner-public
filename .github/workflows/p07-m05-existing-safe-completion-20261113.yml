name: P07-M05 新服务器初始化 - 既有业务安全补全独立验证
on:
  push:
    branches: [test/p07-m05-existing-safe-completion-20261113]
    paths:
      - .github/workflows/p07-m05-existing-safe-completion-20261113.yml
permissions:
  contents: read
jobs:
  exact-private-source-isolated-test:
    if: github.repository == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - name: Checkout public test entry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact private product candidate transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: ffc88ec3c405532909512fd4d6ac8a849bbfa729
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product
      - name: Execute source-locked M05 no-business-write regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = ffc88ec3c405532909512fd4d6ac8a849bbfa729
          bash -n product/bin/vfops-init-ui
          bash -n product/bin/vfops-init-entry
          bash -n product/bin/vfops-init-core
          (
            cd product
            export PYTHONDONTWRITEBYTECODE=1
            python3 -B scripts/check_p07_modules.py
            python3 -B -m unittest discover -s tests -p 'test_p07_module_contract.py' -v
            python3 -B -m unittest discover -s tests -p 'test_p07_m05_host_write_gate.py' -v
            python3 -B -m unittest discover -s tests -p 'test_p07_m05_db_engine_boundary.py' -v
            python3 -B -m unittest discover -s tests -p 'test_p07_m05_isolated_module.py' -v
          )
          echo P07_M05_EXISTING_CLOUDPANEL_NO_AUTO_WRITE=PASS
          echo P07_M05_MISSING_SWAP_REQUIRES_SECOND_CONFIRMATION=PASS
          echo P07_M05_FRESH_INSTALL_PROTECTION=PASS
          echo P07_M05_OTHER_MODULE_INSTALL_OR_UPGRADE=NO
          echo P07_OWNER_PRODUCTION=UNTOUCHED
      - name: Always remove transient private checkout
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- product
          echo P07_M05_PRIVATE_CHECKOUT_CLEANED=YES
