name: P04 VF Infra V2.7.0 Formal Release

on:
  push:
    branches:
      - p04-v270-formal-release-tmp
    paths:
      - '.github/workflows/p04-v270-formal-release.yml'
      - '.github/scripts/p04-v270-formal-release.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p04-v270-formal-release
  cancel-in-progress: false

jobs:
  formal-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout release harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout exact V2.7.0 formal candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: e2fd12cce0518333d7aa15e9d5babc5db0c9043b
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
          fetch-depth: 2
          path: private-vf-infra-target

      - name: Checkout exact V2.6.0 production release source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: b8d080e432ba811f6689372636022774e558ffc1
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-vf-infra-source

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, fileinfo, sodium, zip, curl, mbstring
          coverage: none

      - name: Build verify publish and remote-readback V2.7.0
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: bash .github/scripts/p04-v270-formal-release.sh

      - name: Remove all private source and formal package bytes
        if: always()
        shell: bash
        run: |
          rm -rf private-vf-infra-target private-vf-infra-source
          rm -rf "$RUNNER_TEMP/p04-v270-formal" "$RUNNER_TEMP/p04-v270-assets"
          test ! -e private-vf-infra-target
          test ! -e private-vf-infra-source

      - name: Upload public-safe formal release evidence only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: P04-VF-Infra-V2.7.0-Formal-Release-Evidence
          path: p04-v270-release-evidence
          if-no-files-found: error
          retention-days: 14
