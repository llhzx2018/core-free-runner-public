name: S01 C01+C03 Shell Alignment Source Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/s01-c01-c03-shell-alignment-source-gate.yml'

permissions:
  contents: read

jobs:
  shell-source-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      M3U8_REPO: llhzx2018/vf-tools-m3u8
      M3U8_SHA: f3ba72926af391a26682591320873d5a1bb9b5b2
      THEME_REPO: llhzx2018/vf-tools-theme
      THEME_SHA: 4903afc3a40e4c5e16c4cae87379073261e44813

    steps:
      - name: Credential presence
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN"
          echo "PRIVATE_READ=PASS"

      - name: Checkout exact M3U8 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.M3U8_REPO }}
          ref: ${{ env.M3U8_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: m3u8

      - name: Checkout exact Theme candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.THEME_REPO }}
          ref: ${{ env.THEME_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: theme

      - name: Exact source readback
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C m3u8 rev-parse HEAD)" = "$M3U8_SHA"
          test "$(git -C theme rev-parse HEAD)" = "$THEME_SHA"
          echo "EXACT_SOURCE=PASS"

      - name: PHP syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l m3u8/src/admin/Presentation/Components/class-admin-components.php
          php -l m3u8/src/admin/ui-v4/admin-ui-assets.php
          php -l m3u8/tests/s01-c03-admin-shell-alignment-r1-contract.php
          php -l theme/src/inc/admin/admin-shell.php
          php -l theme/tests/s01-c01-admin-shell-alignment-r1-contract.php
          echo "PHP_SYNTAX=PASS"

      - name: S01 shell alignment contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          php m3u8/tests/s01-c03-admin-shell-alignment-r1-contract.php
          php theme/tests/s01-c01-admin-shell-alignment-r1-contract.php
          echo "S01_C01_C03_SHELL_CONTRACTS=PASS"

      - name: Changed-scope guard
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(tr -d '\r\n' < m3u8/VERSION)" = "1.25.32"
          test "$(tr -d '\r\n' < theme/VERSION)" = "1.35.31"
          grep -Fq "VF_TOOL_M3U8_VERSION', '1.25.32'" m3u8/src/vf-tool-m3u8.php
          grep -Fq "VF_THEME_VERSION', '1.35.31'" theme/src/inc/runtime-constants.php
          echo "VERSION_UNCHANGED=PASS"

      - name: Final evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          cat > evidence/s01-c01-c03-shell-alignment-source-gate.txt <<EOF
          STATUS=PASS
          M3U8_SHA=$M3U8_SHA
          THEME_SHA=$THEME_SHA
          PHP_SYNTAX=PASS
          SHELL_CONTRACTS=PASS
          VERSION_UNCHANGED=PASS
          RELEASE_EXECUTED=NO
          PRODUCTION_EXECUTED=NO
          EOF
          cat evidence/s01-c01-c03-shell-alignment-source-gate.txt

      - name: Remove private source
        if: always()
        shell: bash
        run: rm -rf m3u8 theme

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c01-c03-shell-alignment-source-gate-${{ github.run_id }}
          path: evidence/s01-c01-c03-shell-alignment-source-gate.txt
          if-no-files-found: error
          retention-days: 14
