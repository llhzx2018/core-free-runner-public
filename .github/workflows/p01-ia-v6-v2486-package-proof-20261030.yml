name: p01-ia-v6-v2486-package-proof-exact

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-ia-v6-v2486-package-proof-20261030.yml'

permissions:
  contents: read

concurrency:
  group: p01-ia-v6-v2486-package-proof-20261030
  cancel-in-progress: false

jobs:
  exact-source:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'test(P01):')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      PRODUCT_BRANCH: feat/ia-v6-frontstage-admin-parity-system-jobs-r1
      TARGET_SHA: e68eab76db773c80a162ad219e2e7a32829b080a
      PRODUCT_VERSION: 2.47.486
    steps:
      - name: Checkout registered runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install isolated PHP runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd php-xml >/dev/null
          php -m | grep -Fx pdo_sqlite
          php -m | grep -Fx sqlite3
          node --version
          echo P01_RUNTIME=PASS

      - name: Bind exact private product source without artifacts
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          expected="$(git ls-remote "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "refs/heads/${PRODUCT_BRANCH}" | awk '{print $1}')"
          test "$expected" = "$TARGET_SHA"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" candidate
          git -C candidate fetch -q --depth 1 origin "$TARGET_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "$PRODUCT_VERSION"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "$PRODUCT_VERSION"
          echo P01_EXACT_SOURCE=PASS

      - name: Diagnose 12 Canonical compatibility contract regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in \
            admin_update_credential_r27_contract \
            backend_ia_round2_all_resources_v247270_contract \
            p01_frontstage_local_management_r3_contract \
            p01_frontstage_local_management_r4_contract \
            p01_frontstage_local_management_r5_contract \
            p01_frontstage_local_management_r6_contract \
            p01_frontstage_local_management_r7_contract \
            p01_local_management_r1_contract \
            p01_local_management_r2_contract \
            pending_ai_governance_return_contract \
            pending_governance_context_contract \
            update_recovery_contract; do
            echo "P01_CANONICAL_DIAG_BEGIN=$name"
            set +e
            php "candidate/tests/unit/${name}.php" 2>&1 | tail -n 12
            status=${PIPESTATUS[0]}
            set -e
            echo "P01_CANONICAL_DIAG_EXIT=$name:$status"
          done
          echo P01_CANONICAL_DIAG_12_CAPTURED=YES

      - name: Syntax and canonical IA V5 management source contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          find candidate/src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find candidate/src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          (
            cd candidate
            count=0
            failed=0
            for file in tests/unit/p01_ia5_*.cjs tests/unit/p01_ia6_*.cjs; do
              test -f "$file"
              if node "$file" >/tmp/ia5-test-result.txt 2>&1; then
                echo "PASS_TEST=$file"
              else
                echo "FAIL_TEST=$file"
                grep -m1 -E 'AssertionError|SyntaxError|Error \[|Error:' /tmp/ia5-test-result.txt || true
                failed=$((failed+1))
              fi
              count=$((count+1))
            done
            test "$count" -ge 25
            for file in tests/unit/p01_music_advanced_native_contract.cjs tests/unit/p01_home_favorites_native_contract.cjs; do
              if node "$file" >/tmp/ia5-test-result.txt 2>&1; then
                echo "PASS_TEST=$file"
              else
                echo "FAIL_TEST=$file"
                grep -m1 -E 'AssertionError|SyntaxError|Error \[|Error:' /tmp/ia5-test-result.txt || true
                failed=$((failed+1))
              fi
            done
            echo "P01_IA5_CONTRACT_COUNT=$count"
            echo "P01_IA5_FAILURE_COUNT=$failed"
            test "$failed" -eq 0
          )
          echo P01_IA5_EXACT_SYNTAX_AND_CONTRACTS=PASS

      - name: Isolated authenticated desktop native backup review
        shell: bash
        run: |
          set -Eeuo pipefail
          root=/tmp/p01-r10-backup-native
          mkdir -p "$root"
          cp -a candidate/src/. "$root/"
          (
            cd "$root"
            php -S 127.0.0.1:18960 -t . >/tmp/p01-r10-server.log 2>&1
          ) &
          pid=$!
          trap 'kill "$pid" >/dev/null 2>&1 || true; rm -rf "$root" /tmp/p01-r10-browser /tmp/p01-r10-browser-bins' EXIT
          for _ in $(seq 1 50); do
            if curl -fsS -c /tmp/p01-r10-cookie -b /tmp/p01-r10-cookie http://127.0.0.1:18960/setup.php -o /tmp/p01-r10-setup.html; then break; fi
            sleep 1
          done
          csrf="$(python3 - <<'PY'
          import re
          html=open('/tmp/p01-r10-setup.html').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',html)
          assert m,'Missing setup csrf'
          print(m.group(1))
          PY
          )"
          curl -fsS -c /tmp/p01-r10-cookie -b /tmp/p01-r10-cookie -X POST http://127.0.0.1:18960/setup.php \
            --data-urlencode "setup_csrf=$csrf" --data-urlencode "site_title=R10 isolated Owner" \
            --data-urlencode "admin_password=P01R10!18960" \
            --data-urlencode "admin_password_confirm=P01R10!18960" -o /tmp/p01-r10-installed.html
          (cd "$root" && php cli/verify.php) | grep -Fx VERIFY_PASS=YES
          VF_IA6_SYNTHETIC_ROOT="$root" php <<'PHP'
          <?php
          require getenv('VF_IA6_SYNTHETIC_ROOT').'/app/bootstrap.php';
          $repo=new VfRepository(vf_db());
          $category=$repo->createCategory(['name'=>'IA6 bulk synthetic','description'=>'','icon'=>'','is_private'=>0,'sort_order'=>0]);
          foreach([1,2] as $index){
            $repo->saveLink(null,['surface'=>'start','category_id'=>$category,
              'title'=>'IA6 R12 bulk example '.$index,
              'url'=>'https://example.org/ia6-bulk-'.$index,
              'description'=>'synthetic-only','tags'=>[],'is_private'=>0,'is_pending'=>0]);
          }
          echo "P01_R12_NATIVE_BULK_TWO_SYNTHETIC_LINKS=PASS\n";
          PHP
          npm install --prefix /tmp/p01-r10-browser --no-audit --no-fund playwright@1.56.1 >/tmp/p01-r10-npm.log
          PLAYWRIGHT_BROWSERS_PATH=/tmp/p01-r10-browser-bins /tmp/p01-r10-browser/node_modules/.bin/playwright install --with-deps chromium >/tmp/p01-r10-chromium.log
          export NODE_PATH=/tmp/p01-r10-browser/node_modules
          export PLAYWRIGHT_BROWSERS_PATH=/tmp/p01-r10-browser-bins
          node <<'JS'
          'use strict';
          const assert=require('node:assert/strict');
          const {chromium}=require('playwright');
          const origin='http://127.0.0.1:18960';
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            try{
              const owner=await browser.newContext({viewport:{width:1440,height:900}});
              await owner.route(/https?:\/\/(?!127\.0\.0\.1)/,r=>r.abort());
              const login=await owner.request.post(origin+'/api.php?action=login',{data:{password:'P01R10!18960'}});
              assert.equal(login.status(),200);
              const guest=await browser.newContext();
              try{
                for(const action of ['backup_baseline_reset_preview','backup_automatic_retention_safety_preview','backup_upgrade_retention_preview']){
                  const denied=await guest.request.get(origin+'/api.php?action='+action);
                  assert.ok([401,403].includes(denied.status()),action+' Guest deny');
                }
                console.log('P01_R10_AUDIT_GUEST_DENY=PASS');
              }finally{await guest.close();}
              const page=await owner.newPage();
              for(const width of [1440,768]){
                await page.setViewportSize({width,height:900});
                await page.goto(origin+'/home.php',{waitUntil:'domcontentloaded'});
                await page.locator('[data-vf-global-manage-open]').click();
                const modal=page.locator('#vf-local-management');
                await modal.locator('[data-vf-global-group="data"]').click();
                const panel=modal.locator('[data-vf-backup-baseline-root]');
                assert.equal(await panel.count(),1);
                await panel.locator('summary').click();
                for(const kind of ['baseline','automatic','upgrade']){
                  await panel.locator('[data-vf-backup-baseline-read="'+kind+'"]').click();
                  await page.waitForFunction(()=>document.querySelector('[data-vf-backup-baseline-status]')?.textContent?.includes('只读检查完成'),null,{timeout:16000});
                  assert.ok((await panel.locator('[data-vf-backup-baseline-preview] dd').count())>=3,kind+' native read-only details');
                }
                assert.equal(await modal.locator('iframe').count(),0);
                assert.equal(page.url(),origin+'/home.php');
                await modal.locator('[data-vf-local-manage-close]').last().click();
                assert.equal(await modal.evaluate(e=>e.open),false);
                console.log('P01_R10_OWNER_BACKUP_AUDIT_'+width+'=PASS');
              }
              const guestAgain=await browser.newContext();
              try{
                const denied=await guestAgain.request.post(origin+'/api.php?action=resource_bulk_update',{data:{operation:'public',entries:[],confirmation:'BULK_PUBLIC_CONFIRMED'}});
                assert.ok([401,403].includes(denied.status()),'Guest batch denied');
              }finally{await guestAgain.close();}
              const preview=await owner.request.get(origin+'/api.php?action=resource_inventory&surface=start&limit=30');
              const current=await preview.json();
              assert.equal(current.ok,true);
              const two=current.rows.filter(x=>x.title.startsWith('IA6 R12 bulk example'));
              assert.equal(two.length,2);
              const stale=await owner.request.post(origin+'/api.php?action=resource_bulk_update',{
                headers:{'X-CSRF-Token':'wrong'},
                data:{operation:'private',entries:[{id:two[0].id,updated_at:two[0].updated_at}],confirmation:'BULK_PRIVATE_CONFIRMED'}
              });
              assert.ok([403,419].includes(stale.status()),'CSRF batch denied');
              console.log('P01_R12_RESOURCE_BULK_GUEST_CSRF_DENY=PASS');
              await page.goto(origin+'/home.php',{waitUntil:'domcontentloaded'});
              await page.locator('[data-vf-global-manage-open]').click();
              const batchDialog=page.locator('#vf-local-management');
              await batchDialog.locator('[data-vf-global-group="resources"]').click();
              const bulk=batchDialog.locator('[data-vf-global-bulk-root]');
              await bulk.locator('summary').click();
              async function applyBulk(op){
                await bulk.locator('[data-vf-global-bulk-load]').click();
                await page.waitForFunction(()=>document.querySelector('[data-vf-global-bulk-status]')?.textContent?.includes('已读取资源'),null,{timeout:16000});
                assert.equal(await bulk.locator('input[data-vf-bulk-pick]').count(),2);
                await bulk.locator('[data-vf-global-bulk-all]').check();
                await bulk.locator('[data-vf-global-bulk-operation]').selectOption(op);
                assert.equal(await bulk.locator('[data-vf-global-bulk-prepare]').isDisabled(),true);
                await bulk.locator('[data-vf-global-bulk-phrase]').fill('确认批量操作');
                await bulk.locator('[data-vf-global-bulk-prepare]').click();
                assert.equal(await bulk.locator('[data-vf-global-bulk-confirm]').isVisible(),true);
                await bulk.locator('[data-vf-global-bulk-commit]').click();
                await page.waitForFunction(()=>document.querySelector('[data-vf-global-bulk-status]')?.textContent?.includes('服务器确认已处理'),null,{timeout:30000});
                console.log('P01_R12_NATIVE_BULK_'+op.toUpperCase()+'=PASS');
              }
              await applyBulk('private');
              const afterPrivate=await (await owner.request.get(origin+'/api.php?action=resource_inventory&surface=start&limit=30')).json();
              assert.deepEqual(afterPrivate.rows.filter(x=>x.title.startsWith('IA6 R12')).map(x=>x.is_private),[1,1]);
              await applyBulk('public');
              const afterPublic=await (await owner.request.get(origin+'/api.php?action=resource_inventory&surface=start&limit=30')).json();
              assert.deepEqual(afterPublic.rows.filter(x=>x.title.startsWith('IA6 R12')).map(x=>x.is_private),[0,0]);
              await applyBulk('recycle');
              const afterRecycle=await (await owner.request.get(origin+'/api.php?action=resource_inventory&surface=start&limit=30')).json();
              assert.equal(afterRecycle.rows.filter(x=>x.title.startsWith('IA6 R12')).length,0);
              console.log('P01_R12_NATIVE_BULK_RECYCLE_READBACK=PASS');

              const restoreArea=batchDialog.locator('[data-vf-global-recycle-bulk-root]');
              await restoreArea.locator('summary').click();
              await restoreArea.locator('[data-vf-global-recycle-bulk-load]').click();
              await page.waitForFunction(()=>document.querySelector('[data-vf-global-recycle-bulk-status]')
                ?.textContent?.includes('已按需读取资源'),null,{timeout:16000});
              const visiblePicks=restoreArea.locator('input[data-vf-recycle-bulk-pick]');
              assert.equal(await visiblePicks.count(),2);
              await restoreArea.locator('[data-vf-global-recycle-bulk-all]').check();
              const prepareRestore=restoreArea.locator('[data-vf-global-recycle-bulk-prepare]');
              assert.equal(await prepareRestore.isDisabled(),true,'no write before typed phrase');
              await restoreArea.locator('[data-vf-global-recycle-bulk-phrase]').fill('确认批量恢复');
              await prepareRestore.click();
              assert.equal(await restoreArea.locator('[data-vf-global-recycle-bulk-confirm]').isVisible(),true);
              await restoreArea.locator('[data-vf-global-recycle-bulk-cancel]').click();
              assert.equal(await restoreArea.locator('[data-vf-global-recycle-bulk-confirm]').isVisible(),false);
              console.log('P01_R17_NATIVE_BULK_RESTORE_CANCEL_ZERO_WRITE=PASS');
              await restoreArea.locator('[data-vf-global-recycle-bulk-phrase]').fill('确认批量恢复');
              await prepareRestore.click();
              await restoreArea.locator('[data-vf-global-recycle-bulk-commit]').click();
              await page.waitForFunction(()=>document.querySelector('[data-vf-global-recycle-bulk-status]')
                ?.textContent?.includes('服务器确认已事务性恢复'),null,{timeout:24000});
              const afterRestore=await (await owner.request.get(origin+'/api.php?action=resource_inventory&surface=start&limit=30')).json();
              assert.equal(afterRestore.rows.filter(x=>x.title.startsWith('IA6 R12 bulk example')).length,2);
              const afterTrash=(await (await owner.request.get(origin+'/api.php?action=lifecycle_list&state=trashed')).json()).data;
              assert.equal(afterTrash.links.filter(x=>String(x.title||'').startsWith('IA6 R12 bulk example')).length,0);
              console.log('P01_R17_NATIVE_ATOMIC_BULK_RESTORE_READBACK=PASS');

              await page.goto(origin+'/home.php',{waitUntil:'domcontentloaded'});
              await page.locator('[data-vf-global-manage-open]').click();
              const modal=page.locator('#vf-local-management');
              await modal.locator('[data-vf-global-group="data"]').click();
              const panel=modal.locator('[data-vf-backup-baseline-root]');
              await panel.locator('summary').click();
              await panel.locator('[data-vf-backup-baseline-read="baseline"]').click();
              await page.waitForFunction(()=>document.querySelector('[data-vf-backup-baseline-status]')?.textContent?.includes('只读检查完成'));
              const prepare=panel.locator('[data-vf-backup-baseline-prepare]');
              assert.equal(await prepare.isDisabled(),true,'baseline cannot run before typing');
              await panel.locator('[data-vf-backup-baseline-phrase]').fill('确认重建备份');
              assert.equal(await prepare.isEnabled(),true,'phrase enables review');
              await prepare.click();
              assert.equal(await panel.locator('[data-vf-backup-baseline-confirm]').isVisible(),true);
              await panel.locator('[data-vf-backup-baseline-cancel]').click();
              assert.equal(await panel.locator('[data-vf-backup-baseline-confirm]').isVisible(),false);
              console.log('P01_R11_BASELINE_CANCEL_ZERO_WRITE=PASS');
              await panel.locator('[data-vf-backup-baseline-phrase]').fill('确认重建备份');
              await prepare.click();
              await panel.locator('[data-vf-backup-baseline-commit]').click();
              await page.waitForFunction(()=>document.querySelector('[data-vf-backup-baseline-status]')?.textContent?.includes('已完成备份历史重建'),null,{timeout:35000});
              const after=await owner.request.get(origin+'/api.php?action=backup_baseline_reset_preview');
              assert.equal(after.status(),200);
              const receipt=await after.json();
              assert.equal(receipt.preview.count,1);
              assert.equal(receipt.preview.protected,1);
              assert.equal(receipt.preview.missing,0);
              console.log('P01_R11_BASELINE_NATIVE_REAL_COMMIT_AND_READBACK=PASS');
              // Tools: the Owner native dialog must use canonical api.php and no legacy page.
              const routed=[];
              page.on('request',req=>{if(req.url().includes('toolbox-manager.php'))routed.push(req.url());});
              await page.goto(origin+'/tools.php',{waitUntil:'domcontentloaded'});
              await page.locator('[data-vf-local-manage-open]').click();
              const toolsPanel=page.locator('#vf-local-management [data-vf-local-toolbox-area]');
              assert.equal(await toolsPanel.count(),1,'native Tools editing exists');
              const toolsForm=toolsPanel.locator('[data-vf-local-toolbox-form]');
              await page.waitForFunction(()=>{
                const el=document.querySelector('[data-vf-local-toolbox-form] [data-vf-local-toolbox-scene]');
                return el&&el.options.length>0;
              },null,{timeout:12000});
              const newButton=toolsForm.locator('[data-vf-local-toolbox-new]');
              await newButton.click();
              await toolsForm.locator('input[name=name]').fill('IA6 R13 workflow');
              await toolsForm.locator('input[name=copy]').fill('Synthetic workflow test');
              await toolsForm.locator('textarea[name=keywords]').fill('demo');
              await toolsForm.locator('[data-vf-local-toolbox-save]').click();
              await page.waitForFunction(()=>document.querySelector('[data-vf-local-toolbox-status]')?.textContent?.includes('已保存'),null,{timeout:16000});
              console.log('P01_R13_NATIVE_TOOLBOX_SAVE=PASS');
              assert.deepEqual(routed,[],'Toolbox native page must never call backend GUI');
              const formScene=await toolsForm.locator('[data-vf-local-toolbox-scene]').inputValue();
              const apiUrl=origin+'/api.php?action=toolbox_manager_state&scene='+encodeURIComponent(formScene)+'&group='+encodeURIComponent('IA6 R13 workflow');
              const loaded=await owner.request.get(apiUrl);
              const data=await loaded.json();
              assert.equal(data.ok,true);
              assert.ok(data.groups['IA6 R13 workflow']);
              console.log('P01_R13_TOOLBOX_CANONICAL_READBACK=PASS');
              const deniedTools=await owner.request.post(origin+'/api.php?action=toolbox_manager_action',{headers:{'X-CSRF-Token':'invalid'},data:{action:'group_move',scene:formScene,group:'IA6 R13 workflow',direction:'up'}});
              assert.ok([403,419].includes(deniedTools.status()),'Wrong CSRF rejected');
              console.log('P01_R13_TOOLBOX_CSRF=PASS');
              const erase=toolsForm.locator('[data-vf-local-toolbox-delete]');
              await erase.click();
              const inlineDanger=toolsPanel.locator('[data-vf-local-toolbox-danger]');
              assert.equal(await inlineDanger.isVisible(),true,'group delete must have native inline confirmation');
              await toolsPanel.locator('[data-vf-local-toolbox-danger-cancel]').click();
              const afterCancel=await (await owner.request.get(apiUrl)).json();
              assert.ok(afterCancel.groups['IA6 R13 workflow'],'cancel cannot delete workflow');
              await erase.click();
              await toolsPanel.locator('[data-vf-local-toolbox-danger-apply]').click();
              await page.waitForFunction(()=>document.querySelector('[data-vf-local-toolbox-status]')?.textContent?.includes('已保存'),null,{timeout:16000});
              const afterDeleted=await (await owner.request.get(apiUrl)).json();
              assert.equal(Object.prototype.hasOwnProperty.call(afterDeleted.groups,'IA6 R13 workflow'),false);
              assert.deepEqual(routed,[],'No backend GUI request even during delete');
              console.log('P01_R13_TOOLBOX_INLINE_DELETE_CANCEL_AND_COMMIT=PASS');

              const guestForToolbox=await browser.newContext();
              const guestTools=await guestForToolbox.request.get(origin+'/api.php?action=toolbox_manager_state');
              assert.ok([401,403].includes(guestTools.status()),'Toolbox private route Guest denied');
              await guestForToolbox.close();
              console.log('P01_R13_TOOLBOX_GUEST_DENY=PASS');
              await page.goto(origin+'/music-shell.php?view=home',{waitUntil:'domcontentloaded'});
              await page.locator('[data-vf-local-manage-open]').click();
              const musicDialog=page.locator('#vf-local-management');
              await musicDialog.locator('[data-vf-local-task="music-advanced"]').click();
              const advanced=musicDialog.locator('[data-vf-local-music-advanced-area]');
              assert.equal(await advanced.isVisible(),true);
              await advanced.locator('[data-vf-local-music-advanced-format]').selectOption('csv');
              await advanced.locator('[data-vf-local-music-advanced-content]').fill(
                'title,artist,url,playlist\nR15 Canary Track,Test Artist,https://youtu.be/dQw4w9WgXcQ,R15 Canary List\n'
              );
              const musicRequests=[];
              page.on('request',r=>{
                const u=r.url();
                if(/\/(?:music|music-import)\.php(?:\?|$)/.test(u))musicRequests.push(u);
              });
              await advanced.locator('[data-vf-local-music-advanced-preview]').click();
              await page.waitForFunction(()=>/预览通过|检查发现|预览失败/.test(
                document.querySelector('[data-vf-local-music-advanced-status]')?.textContent||''
              ),null,{timeout:16000});
              const previewState=await advanced.locator('[data-vf-local-music-advanced-status]').innerText();
              assert.ok(previewState.includes('预览通过'),previewState);
              await advanced.locator('[data-vf-local-music-advanced-save]').click();
              await page.waitForFunction(()=>document.querySelector('[data-vf-local-music-advanced-status]')
                ?.textContent?.includes('导入完成'),null,{timeout:16000});
              console.log('P01_R15_NATIVE_MUSIC_IMPORT=PASS');
              assert.deepEqual(musicRequests,[],'Old Music management page may never be called by native tasks');
              const trackResult=await owner.request.get(origin+'/api.php?action=music_tracks_native');
              const tracks=await trackResult.json();
              assert.equal(tracks.ok,true);
              assert.ok(tracks.tracks.some(x=>x.title==='R15 Canary Track'));
              console.log('P01_R15_NATIVE_MUSIC_TRACK_READBACK=PASS');
              const exported=await owner.request.get(origin+'/api.php?action=music_archive_export_native');
              assert.equal(exported.status(),200);
              const exportedJson=await exported.text();
              assert.ok(exportedJson.includes('R15 Canary Track'));
              console.log('P01_R15_NATIVE_MUSIC_ARCHIVE_EXPORT=PASS');
              await musicDialog.locator('[data-vf-local-task="music-archive"]').click();
              const archive=musicDialog.locator('[data-vf-local-music-archive-area]');
              assert.equal(await archive.isVisible(),true);
              await archive.locator('[data-vf-local-music-archive-file]').setInputFiles({
                name:'r15-canary-archive.json',mimeType:'application/json',buffer:Buffer.from(exportedJson,'utf8')
              });
              await archive.locator('[data-vf-local-music-archive-restore]').click();
              assert.equal(await archive.locator('[data-vf-local-music-archive-confirm]').isVisible(),true);
              await archive.locator('[data-vf-local-music-archive-cancel]').click();
              assert.equal(await archive.locator('[data-vf-local-music-archive-confirm]').isVisible(),false);
              await archive.locator('[data-vf-local-music-archive-restore]').click();
              await archive.locator('[data-vf-local-music-archive-commit]').click();
              await page.waitForFunction(()=>document.querySelector('[data-vf-local-music-archive-status]')
                ?.textContent?.includes('音乐库已合并导回'),null,{timeout:18000});
              console.log('P01_R15_NATIVE_MUSIC_ARCHIVE_RESTORE=PASS');
              const guestMusic=await browser.newContext();
              try{
                for(const action of ['music_tracks_native','music_archive_export_native']){
                  const denied=await guestMusic.request.get(origin+'/api.php?action='+action);
                  assert.ok([401,403].includes(denied.status()),action);
                }
              }finally{await guestMusic.close();}
              console.log('P01_R15_MUSIC_GUEST_READ_DENY=PASS');
              await owner.close();
            }finally{await browser.close();}
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          JS
          echo P01_R10_NATIVE_BACKUP_BROWSER=PASS

      - name: Canonical protected baseline transaction isolated SQLite proof
