name: S01-C01 eight-page integration formal release
on:
  push:
    branches: [task/s01-c01-preview101-20261007-formal]
permissions:
  contents: read
  actions: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_REPO: 'llhzx2018/vf-tools-theme'
      TARGET_VERSION: '1.35.101'
      TARGET_SHA: '1bea166565912d8250760933d3a04bc45b91d151'
      TARGET_TREE: 'a403c195edc289ccd06bf5b84603b490b9be8aa2'
      SOURCE_VERSION: '1.35.100'
      CANDIDATE_RUN: '37593144596'
      CANDIDATE_SHA: 'e43a98b259ccccf8fabbb4f7837511a7609897e5'
      CANDIDATE_RUNNER_SHA: '380334b47ef2271afd25a04eb3f75053d9e8b921'
      CANDIDATE_ARTIFACT_ID: '11469529564'
      CANDIDATE_ARTIFACT_DIGEST: 'sha256:b8b417af5b20916717fee6fe3b91f3d7f52c24e7fffbfa8fec7c450355bb51d0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runner
          persist-credentials: false
      - name: Target-owned formal lane identity preflight
        run: |
          set -Eeuo pipefail
          mkdir -p proof
          python3 runner/scripts/ephemeral_lane_spec.py render --spec runner/lanes/s01-c01-preview101-20261007/formal-spec.json --template runner/lanes/s01-c01-preview101-20261007/formal.template.yml --output /tmp/preview-formal-rendered.yml >/dev/null
          cmp /tmp/preview-formal-rendered.yml runner/.github/workflows/s01-c01-preview101-20261007-formal.yml
          python3 runner/scripts/ephemeral_lane_spec.py audit-rendered --spec runner/lanes/s01-c01-preview101-20261007/formal-spec.json --input runner/.github/workflows/s01-c01-preview101-20261007-formal.yml > proof/formal-lane-identity-audit.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Reverse verify exact tested tree and rebuilt bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$CANDIDATE_RUN --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$CANDIDATE_RUN --jq .head_sha)" = "$CANDIDATE_RUNNER_SHA"
          gh api "repos/llhzx2018/core-free-runner-public/actions/artifacts/$CANDIDATE_ARTIFACT_ID" > /tmp/tested-artifact-meta.json
          gh api "repos/llhzx2018/core-free-runner-public/actions/artifacts/$CANDIDATE_ARTIFACT_ID/zip" > /tmp/tested-artifact.zip
          python3 - <<'PYARTIFACT'
          import os,json,pathlib,hashlib,zipfile,stat
          meta=json.loads(pathlib.Path('/tmp/tested-artifact-meta.json').read_text())
          data=pathlib.Path('/tmp/tested-artifact.zip').read_bytes()
          assert meta['id']==int(os.environ['CANDIDATE_ARTIFACT_ID']) and meta['workflow_run']['id']==int(os.environ['CANDIDATE_RUN'])
          assert meta['workflow_run']['head_sha']==os.environ['CANDIDATE_RUNNER_SHA'] and not meta['expired']
          assert meta['digest']==os.environ['CANDIDATE_ARTIFACT_DIGEST']=='sha256:'+hashlib.sha256(data).hexdigest()
          assert meta['size_in_bytes']==len(data)
          with zipfile.ZipFile('/tmp/tested-artifact.zip') as z:
              assert z.testzip() is None
              names=z.namelist();assert len(names)==len(set(names))
              for entry in z.infolist():
                  p=pathlib.PurePosixPath(entry.filename)
                  assert not p.is_absolute() and '..' not in p.parts and '\\' not in entry.filename and not stat.S_ISLNK(entry.external_attr>>16)
                  assert p.suffix in ['.json','.png']
                  if p.suffix=='.json':json.loads(z.read(entry))
              z.extractall('tested')
          PYARTIFACT
          python3 - <<'PYGATE'
          import json,pathlib,os
          p=pathlib.Path('tested/proof');d=json.loads((p/'FINAL_EVIDENCE.json').read_text());v=json.loads((p/'preview/live-browser.json').read_text());r=json.loads((p/'diagnostic-regression.json').read_text())
          assert d['status']=='PASS' and d['source_sha']==os.environ['CANDIDATE_SHA'] and d['source_tree']==os.environ['TARGET_TREE'] and d['version']==os.environ['TARGET_VERSION']
          assert d['upgrade']==d['source_rollback']==d['reapply']==d['clean_install']=='PASS' and d['data_checks']>=44 and d['cross_page_cases']>=15
          assert d['security_boundary']==d['frozen_shell_header_menu']=='PASS' and d['diagnostic_regression']==d['expectation_regression']==d['surface_regression']=='PASS'
          h=json.loads((p/'expectation-regression.json').read_text());s=json.loads((p/'surface-regression.json').read_text())
          assert h['status']==s['status']=='PASS' and len(h['cases'])==4
          assert all(c['baseline']=='PASS' and c['missing']==c['wrong_target']=='FAIL_PRESERVED' and len(c['expected'])>=2 for c in h['cases'])
          assert h['system_negative']=='FAIL_PRESERVED'
          assert h['legal']['draft_route']==h['legal']['published_identity']==h['legal']['private_route']=='PASS' and h['legal']['post_status_restored']
          assert h['legal']['raw_status']=='draft' and h['legal']['actual']['canonical']==[h['legal']['expected']['canonical']]
          assert s['surface']['baseline']['header']['status']==s['surface']['baseline']['active']['status']=='PASS'
          assert s['surface']['black']['header']['status']==s['surface']['transparentBlack']['header']['status']==s['surface']['arbitrary']['active']['status']=='FAIL'
          assert len(s['labels'])==6 and {r['viewport'] for r in s['labels']}=={1920,1440,1319,1024,768,390} and all(r['width']>38 and r['scrollWidth']<=r['clientWidth']+4 and round(r['stepWidth'])==38 for r in s['labels'])
          directory=json.loads((p/'directory-state-regression.json').read_text());assert directory['status']=='PASS' and len(directory['cases'])==2 and {c['populated'] for c in directory['cases']}=={True,False}
          touch=json.loads((p/'touch-regression.json').read_text());assert touch['status']=='PASS' and d['touch_regression']=='PASS' and len(touch['rows'])==30
          assert all(t['width']>=43.99 and t['height']>=43.99 for row in touch['rows'] for t in row['targets'])
          assert len(s['layout'])==36 and all(e['scrollWidth']<=e['clientWidth']+4 for row in s['layout'] for e in row['elements'])
          assert v['status']=='PASS' and len(v['checks'])==6 and v['workflow_cases']>=16 and r['status']=='PASS'
          assert r['css']['baseline']['status']=='PASS' and r['css']['duplicate']['status']==r['css']['missing']['status']=='FAIL'
          assert r['clipped']['hidden']==r['clipped']['hiddenAncestor']==r['clipped']['before'] and r['clipped']['ancestorRectCount']==0 and r['clipped']['visibleRectCount']>0 and r['clipped']['visible']==r['clipped']['before']+1
          e=json.loads((p/'preview/engine-diagnostic.json').read_text());live=next(x for x in e['runs'] if x['mode']=='live_roundtrip');assert live['browser']['blockingProbeCount']==0 and live['browser']['unsafeLinkCount']==0;assert next(x for x in live['browser']['pages'] if x['targetKey']=='page_type:basic_page')['breakpoints'][0]['unsafeLinkCount']==0
          assert any(x['verdict']=='fail' for x in d['preview_engine_verdicts']), 'real content failures disappeared'
          assert not any(x['category']=='uaui' or 'responsive-touch-targets' in x['current'] for x in live['issues']), 'touch failures remain'
          assert len(live['issues'])==24, 'remaining failures changed; review actual evidence'
          links=json.loads((p/'public-links-route-baseline.json').read_text());assert links['status']=='PASS' and links['private_targets_removed']==5 and links['source_preserved'] and links['feed_preserved'] and links['unavailable']['container']['status']=='N_A'
          comparison=json.loads((p/'round2-same-environment.json').read_text());assert comparison['baseline100_issues']==32 and comparison['candidate101_issues']==24 and comparison['resolved_records']==8
          dependency=json.loads((p/'dependency-regression.json').read_text());assert dependency['status']=='PASS' and not dependency['theme_issues'] and all(r['http']==200 and not r['error404'] and len(r['canonical'])==1 for r in dependency['routes'])
          assert len(dependency['headProof']['rows'])==4 and all(not r['issues'] for r in dependency['headProof']['rows'])
          player=next(r for r in dependency['routes'] if r['route']=='/m3u8-player/');assert player['contrast']['bad']['status']=='FAIL' and player['contrast']['restored']['status']=='PASS' and player['toolControls']
          assert player['ownershipContrast']['bad']['status']=='FAIL' and player['ownershipContrast']['restored']['status']=='PASS'
          assert all(player['interactions'][key]=='PASS' for key in ['url_input','clear','pro_mode','dropdown','simple_mode']) and player['interactions']['external_media_requests']=='NOT_EXECUTED'
          geometry=dependency['providerGeometryProof'];assert geometry['theme_styles_disabled']>0 and geometry['provider_only_root_width']>geometry['provider_only_container_client']+4 and geometry['provider_only_container_scroll']>geometry['provider_only_container_client']+4
          print('VF_DEPENDENCY_REVERSE '+json.dumps({'engine_status':dependency['engine_status'],'issues':len(dependency['issues']),'provider_issues':len(dependency['provider_issues']),'theme_issues':len(dependency['theme_issues'])}))
          assert dependency['engine_status']=='review' and len(dependency['provider_issues'])==len(dependency['issues'])==4 and sum(bool(r['blocking']) for r in dependency['issues'])==2
          assert d['public_links_route_regression']==d['dependency_regression']=='PASS'
          PYGATE
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          cp -a runner/lanes/s01-c01-preview101-20261007 lane
          python3 lane/build.py
          python3 - <<'PY'
          import json,pathlib
          tested=json.loads(pathlib.Path('tested/proof/FINAL_EVIDENCE.json').read_text()); built=json.loads(pathlib.Path('proof/identity.json').read_text())
          for key in ['asset','asset_bytes','asset_sha256','source_tree','version']: assert tested[key]==built[key],key
          PY
      - name: Publish private formal Release and exact remote readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          ASSET="vf-tools-theme_V${TARGET_VERSION}.zip"; TAG="v$TARGET_VERSION"
          cat > /tmp/release-notes.md <<EOF
          VF Tools Theme V$TARGET_VERSION

          修复公开正文/摘要中的后台操作与危险链接目标，保留原文、编辑器/REST/feed以及普通内部、外部、锚点和邮件链接。
          修复真实404误报工具容器缺失，以及合法插件工作区控件误报；HTTP/Head不存在问题继续记录，真实200页移除容器或主题额外控件仍报错。
          修复无媒体目录行被压缩到图片列、非目录工具网格外层误作用和主题工作区平板可用宽度。模块CSS与唯一预编译运行包同步，独立验证输入/运行包一致；无Provider内部DOM/样式/算法写入。
          同口径Theme-only失败记录32→24，关闭8条重复诊断记录。另行安装校验过的正式M3U8 1.25.57并创建明确标注的隔离WordPress测试内容，四个路由200及实际canonical/title/robots/hreflang通过。真实工具输入、清空、Pro、下拉、Simple与三宽度宿主验证通过；插件内部重复main、小触控目标和768px嵌入宽度溢出保留真实未通过项（引擎为REVIEW，页面整体未通过）；关闭主题CSS的等宽宿主对照仍复现插件宽度溢出。
          Exact candidate Run: $CANDIDATE_RUN。沿用30组触控、36组布局、实际Head/CSS/Header诊断正反例、预览控件六宽度与16流程、干净安装、$SOURCE_VERSION→$TARGET_VERSION原生升级/回退/再应用、44项恢复和八页16条前台生效。
          不声明全产品、Provider算法、OWNER验收或Production PASS。Shell/Header/Header Menu冻结，无Canonical内容、鉴权、Schema、Updater或Production写入；Production由OWNER手工升级，独立Preview Runtime按SSOT为N_A。
          Exact promoted source: $TARGET_SHA; tree: $TARGET_TREE。
          EOF
          if gh release view "$TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            test "$(gh api repos/$TARGET_REPO/git/ref/tags/$TAG --jq .object.sha)" = "$TARGET_SHA"
          else
            gh release create "$TAG" "proof/$ASSET" --repo "$TARGET_REPO" --target "$TARGET_SHA" --title "VF Tools Theme V$TARGET_VERSION" --notes-file /tmp/release-notes.md
          fi
          gh api "repos/$TARGET_REPO/releases/tags/$TAG" > proof/remote-release.json
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/$TAG --jq .object.sha)" = "$TARGET_SHA"
          mkdir readback
          gh release download "$TAG" --repo "$TARGET_REPO" --pattern "$ASSET" --dir readback
          cmp "proof/$ASSET" "readback/$ASSET"
          python3 - <<'PY'
          import json,pathlib,os
          p=pathlib.Path('proof'); m=json.loads((p/'identity.json').read_text());r=json.loads((p/'remote-release.json').read_text());t=json.loads(pathlib.Path('tested/proof/FINAL_EVIDENCE.json').read_text());assert not r['draft'] and not r['prerelease'];a=[a for a in r['assets'] if a['name']==m['asset']];assert len(a)==1 and a[0]['size']==m['asset_bytes'] and a[0]['digest']=='sha256:'+m['asset_sha256'];m.update(release_id=r['id'],asset_id=a[0]['id'],released_at=r['published_at'],runtime_files=t['runtime_files'],runtime_fingerprint=t['runtime_fingerprint'],candidate_run=os.environ['CANDIDATE_RUN'],upgrade_run=os.environ['CANDIDATE_RUN'],formal_release='PASS',remote_readback='PASS',distribution='NOT_EXECUTED',production='NOT_EXECUTED');(p/'RELEASE_RECEIPT.json').write_text(json.dumps(m,indent=2));print(json.dumps(m))
          PY
      - name: Public-safe receipt
        id: receipt_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c01-preview-release-${{ github.run_id }}
          path: proof/RELEASE_RECEIPT.json
          retention-days: 30
          if-no-files-found: error

      - name: Read back actual formal receipt ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT_ARTIFACT_ID: ${{ steps.receipt_artifact.outputs.artifact-id }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$RECEIPT_ARTIFACT_ID" > /tmp/formal-receipt-meta.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$RECEIPT_ARTIFACT_ID/zip" > /tmp/formal-receipt.zip
          python3 - <<'PYRECEIPT'
          import os,json,pathlib,hashlib,zipfile
          meta=json.loads(pathlib.Path('/tmp/formal-receipt-meta.json').read_text())
          data=pathlib.Path('/tmp/formal-receipt.zip').read_bytes()
          digest='sha256:'+hashlib.sha256(data).hexdigest()
          assert meta['id']==int(os.environ['RECEIPT_ARTIFACT_ID']) and meta['workflow_run']['id']==int(os.environ['GITHUB_RUN_ID'])
          assert meta['workflow_run']['head_sha']==os.environ['GITHUB_SHA']
          assert not meta['expired'] and meta['digest']==digest and meta['size_in_bytes']==len(data)
          with zipfile.ZipFile('/tmp/formal-receipt.zip') as z:
              assert z.testzip() is None and z.namelist()==['RELEASE_RECEIPT.json']
              actual=json.loads(z.read('RELEASE_RECEIPT.json'))
              expected=json.loads(pathlib.Path('proof/RELEASE_RECEIPT.json').read_text())
              assert actual==expected and actual['source_sha']==os.environ['TARGET_SHA'] and actual['source_tree']==os.environ['TARGET_TREE'] and actual['formal_release']==actual['remote_readback']=='PASS'
          print('VF_FORMAL_AUDIT_BEGIN')
          print(pathlib.Path('proof/formal-lane-identity-audit.json').read_text())
          print('VF_FORMAL_AUDIT_END')
          print('VF_FORMAL_RECEIPT_BEGIN')
          print(json.dumps(actual))
          print('VF_FORMAL_RECEIPT_END')
          print('VF_FORMAL_ARTIFACT_BEGIN')
          print(json.dumps({'status':'PASS','id':meta['id'],'run_id':int(os.environ['GITHUB_RUN_ID']),'bytes':len(data),'digest':digest,'crc':'PASS','json_readback':'PASS'}))
          print('VF_FORMAL_ARTIFACT_END')
          PYRECEIPT
      - name: Private workspace cleanup
        if: always()
        run: rm -rf target readback proof/*.zip
