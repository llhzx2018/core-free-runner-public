name: S01 R8 Ops real batch revision rollback and keyword map integration
on:
  push:
    branches: [task/s01-r8-exact-native-20261103]
    paths:
      - '.github/workflows/s01-r8-ops-batch-keyword-close-20261103.yml'
      - 'lanes/s01-r8-ops-batch-only-20261103/**'
permissions:
  contents: read
jobs:
  ops-batch-keyword-close:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: synthetic-root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: synthetic-wp
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: 7a1bca1deaf08148640812c9e465324442767d90
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: ba673c865fc91c5688df455ab37026b0b6db6762
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: theme
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 3f22e61339f7c76eea2c4524885819b10ee59057
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: ops
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli,mbstring,intl,zip
          coverage: none
      - name: Install disposable WordPress MariaDB and three exact pinned components
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSLo /tmp/s01-r8-golden-wpcli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          WP=/tmp/s01-r8-golden-wp
          mkdir -p "$WP"
          php /tmp/s01-r8-golden-wpcli.phar core download --path="$WP" --skip-content --quiet
          php /tmp/s01-r8-golden-wpcli.phar config create --path="$WP" --dbname=wordpress --dbuser=wordpress --dbpass=synthetic-wp --dbhost=127.0.0.1:3306 --skip-check
          php /tmp/s01-r8-golden-wpcli.phar core install --path="$WP" --url=http://127.0.0.1:18880 --title=S01-Golden-Fixture --admin_user=synthetic --admin_password=synthetic-only-password --admin_email=test@example.invalid --skip-email
          php /tmp/s01-r8-golden-wpcli.phar config set WP_CONTENT_URL http://127.0.0.1:18880/wp-content --path="$WP"
          php /tmp/s01-r8-golden-wpcli.phar config set WP_PLUGIN_URL http://127.0.0.1:18880/wp-content/plugins --path="$WP"
          php /tmp/s01-r8-golden-wpcli.phar config set WP_SITEURL http://127.0.0.1:18880 --path="$WP"
          php /tmp/s01-r8-golden-wpcli.phar config set WP_HOME http://127.0.0.1:18880 --path="$WP"
          mkdir -p "$WP/wp-content/themes/vf-tools-theme" "$WP/wp-content/plugins/vf-tools-ops" "$WP/wp-content/plugins/vf-tools-m3u8"
          cp -a theme/src/. "$WP/wp-content/themes/vf-tools-theme/"
          cp -a ops/. "$WP/wp-content/plugins/vf-tools-ops/"
          cp -a candidate/src/. "$WP/wp-content/plugins/vf-tools-m3u8/"
          php /tmp/s01-r8-golden-wpcli.phar theme activate vf-tools-theme --path="$WP"
          php /tmp/s01-r8-golden-wpcli.phar plugin activate vf-tools-ops/vf-ops.php vf-tools-m3u8/vf-tool-m3u8.php --path="$WP"
          php /tmp/s01-r8-golden-wpcli.phar rewrite structure '/%postname%/' --path="$WP" --hard
          php /tmp/s01-r8-golden-wpcli.phar eval '$ids=["player","converter","backup-restore","playlist-checker"]; $specs=vf_m3u8_first_run_tool_specs(); foreach($ids as $id){if(!isset($specs[$id]))throw new Exception("MISSING_TOOL_SPEC:".$id);$s=$specs[$id];if(get_page_by_path($s["route"],OBJECT,"page"))continue;$post=wp_insert_post(["post_type"=>"page","post_status"=>"publish","post_name"=>$s["route"],"post_title"=>"R8 ".$id,"post_content"=>"[".$s["shortcode"]."]"]);if(is_wp_error($post)||!$post)throw new Exception("PAGE_CREATE_FAILED:".$id);}' --path="$WP"
          php /tmp/s01-r8-golden-wpcli.phar eval '$s=vf_m3u8_first_run_product_flow_spec();$post=wp_insert_post(["post_type"=>"page","post_status"=>"publish","post_name"=>$s["route"],"post_title"=>"R8 M3U8 Download And Record","post_content"=>"[".$s["shortcode"]."]"]);if(is_wp_error($post)||!$post)throw new Exception("PRODUCT_FLOW_PAGE_CREATE_FAILED");' --path="$WP"
          cat > "$WP/.s01-router.php" <<'PHP'
          <?php
          $path=parse_url($_SERVER['REQUEST_URI'],PHP_URL_PATH);
          if(is_string($path) && $path!=='/' && is_file(__DIR__.$path)) return false;
          require __DIR__.'/index.php';
          PHP
          php -S 127.0.0.1:18880 -t "$WP" "$WP/.s01-router.php" > /tmp/s01-r8-golden-http.log 2>&1 &
          for i in $(seq 1 30);do if curl -fsS http://127.0.0.1:18880/m3u8-playlist-checker/ >/dev/null;then break;fi;sleep 2;done
          php /tmp/s01-r8-golden-wpcli.phar option update admin_email_lifespan 4102444800 --path="$WP"
          php /tmp/s01-r8-golden-wpcli.phar eval-file control/lanes/s01-r8-ops-admin-20261103/ops-14-targets.php --path="$WP"
          php /tmp/s01-r8-golden-wpcli.phar eval-file control/lanes/s01-r8-ops-save-20261103/seed-content.php --path="$WP"
          echo S01_R8_OPS_ADMIN_FIXTURE_READY=PASS
      - name: Actual Ops browser bulk mutation, revision deny, rollback and independent DB audit
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "3f22e61339f7c76eea2c4524885819b10ee59057"
          test "$(git -C theme rev-parse HEAD)" = "ba673c865fc91c5688df455ab37026b0b6db6762"
          test "$(git -C candidate rev-parse HEAD)" = "7a1bca1deaf08148640812c9e465324442767d90"
          node --check control/lanes/s01-r8-ops-batch-only-20261103/batch-workflow-browser.cjs
          npm install --no-audit --no-fund --prefix /tmp/s01-r8-ops-playwright playwright@1.62.1
          /tmp/s01-r8-ops-playwright/node_modules/.bin/playwright install chromium
          NODE_PATH=/tmp/s01-r8-ops-playwright/node_modules S01_R8_ORIGIN=http://127.0.0.1:18880 node control/lanes/s01-r8-ops-batch-only-20261103/batch-workflow-browser.cjs
          php /tmp/s01-r8-golden-wpcli.phar eval-file control/lanes/s01-r8-ops-save-20261103/readback-batch.php --path=/tmp/s01-r8-golden-wp
      - name: Exact Ops main keyword map real WP database integration
        shell: bash
        run: |
          set -Eeuo pipefail
          WP=/tmp/s01-r8-golden-wp
          test "$(git -C ops rev-parse HEAD)" = "3f22e61339f7c76eea2c4524885819b10ee59057"
          # The version-pinned upstream integration test uses the legacy vf-ops
          # installation directory. Preserve the exact test bytes; alias
          # only its directory path INSIDE this disposable test filesystem.
          test ! -e "$WP/wp-content/plugins/vf-ops"
          ln -s "$WP/wp-content/plugins/vf-tools-ops" "$WP/wp-content/plugins/vf-ops"
          php -l ops/tests/s01-c02-1211037-keyword-map-wp-integration.php
          php /tmp/s01-r8-golden-wpcli.phar eval 'require getenv("GITHUB_WORKSPACE")."/ops/tests/s01-c02-1211037-keyword-map-wp-integration.php";' --path="$WP" --user=synthetic | tee /tmp/s01-r8-ops-save-evidence/keyword-integration.json
          grep -q '"status":"PASS"' /tmp/s01-r8-ops-save-evidence/keyword-integration.json
          grep -q '"revision_conflict":"PASS"' /tmp/s01-r8-ops-save-evidence/keyword-integration.json
          grep -q '"unassign_readback":"PASS"' /tmp/s01-r8-ops-save-evidence/keyword-integration.json
          grep -q '"ordinary_open_write_free":"PASS"' /tmp/s01-r8-ops-save-evidence/keyword-integration.json
          echo S01_R8_OPS_KEYWORD_EXACT_MAIN_WP_INTEGRATION_PASS
      - name: Preserve Ops bulk workflow, revision and keyword exact-source database evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-r8-ops-batch-keyword-${{ github.run_id }}
          path: /tmp/s01-r8-ops-save-evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Destroy isolated environment and private source
        if: always()
        shell: bash
        run: rm -rf /tmp/s01-r8-golden-wp /tmp/s01-r8-golden-wpcli.phar /tmp/s01-r8-ops-playwright candidate theme ops /tmp/s01-r8-ops-admin-evidence /tmp/s01-r8-ops-save-evidence
