name: P01 V247289 Distribution exact-source proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v247289-distribution-proof.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: 64d95648495a90dab1e3b093c09433f9a3b66acb
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,curl,zip,openssl
          coverage: none
      - name: Update Core canonical, product identity and asset SHA
        run: |
          set -Eeuo pipefail
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php update-core/php/tests/run.php
          python3 - <<'PY'
          import json
          p=json.load(open('projects/P01.json'))
          assert p['current_version']=='2.47.288'
          assert p['target_version']=='2.47.289'
          assert p['from_versions']==['2.47.288'
          assert p['product_identity']=='463e1eaf6c4f5a0f6cb41cf642d2c5549e553707'
          assert p['release_id']==406667748
          assert p['asset_name']=='VF_Start_V2.47.289_UPDATE.zip'
          assert p['asset_sha256']=='ceee0b8cd54054595e1fd24968207b1a0ac5f1b15accc9640a6fb26a1c8170dc'
          assert p['asset_bytes']==2365882
          assert p['schema_from']==p['schema_to']=='2026090401'
          print('P01_V247289_DISTRIBUTION_IDENTITY=PASS')
          PY
          echo P01_V247289_DISTRIBUTION_CANONICAL=PASS
