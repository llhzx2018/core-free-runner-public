name: P01 V2.30 Authoritative Remote Online Update Gate V2
on:
  push:
    branches: [task/p01-v230-domain-nav-shell-20260829]
    paths: [.github/workflows/p01-v230-remote-online-update-authoritative-v2-20260829.yml]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      ROOT: /tmp/p01-v230-authoritative-v2-owner
      PORT: '18632'
      ADMIN_PASS: 'P01V230!AuthoritativeV2'
      SOURCE_SHA: aa9070bb810064df2e965a793b999ac8bde5734e
      FORMAL_SOURCE: 40b2d5239c557ab6c7b9aaaa092acffa9fb926f9
      FORMAL_TREE: 771125988f07c01740e4b3dc3863ff90ebcdc5dd
      PRODUCT_SOURCE: 426740ee3e36d207581dddf9b3fe5d62fd8d1808
      PRODUCT_TREE: 73ebd54d3113b6c2123af74d6a301294689855c8
      CORE_UPDATES_MAIN: 53fc02ebd99007793877a281e53238a591e7e485
      UPDATE_SHA: 65869be49eb094d2be97609aa4fd588aeed737b97695882fc3b216eaf20edcb0
      UPDATE_BYTES: '1328072'
      RELEASE_ID: '378891859'
      SCHEMA: '2026082901'
      EVID: /tmp/p01-v230-authoritative-v2-evidence
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.29.0
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: production

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: 53fc02ebd99007793877a281e53238a591e7e485
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: updates

      - name: Independent publication and discovery truth fence
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$EVID" && mkdir -p "$EVID"
          test "$(git -C production rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' < production/src/VERSION.txt)" = 2.29.0
          test "$(git -C updates rev-parse HEAD)" = "$CORE_UPDATES_MAIN"
          jq -e '
            .schema_version=="1.0" and .project_id=="P01" and .component_id=="APP" and .enabled==true and
            .current_version=="2.29.0" and .target_version=="2.30.0" and .update_type=="ATOMIC" and
            .from_versions==["2.29.0"] and .schema_from=="2026082901" and .schema_to=="2026082901" and
            .repository=="llhzx2018/vf-start" and .release_tag=="v2.30.0" and .release_id==378891859 and
            .product_identity=="40b2d5239c557ab6c7b9aaaa092acffa9fb926f9" and
            .asset_name=="VF_Start_V2.30.0_UPDATE.zip" and .asset_bytes==1328072 and
            .asset_sha256=="65869be49eb094d2be97609aa4fd588aeed737b97695882fc3b216eaf20edcb0" and
            .backup_required==true and .rollback_supported==true and .released_at=="2026-08-29T06:01:41Z" and
            .minimum_php=="8.0.0"
          ' updates/projects/P01.json >/dev/null
          test "$(git -C production ls-remote origin refs/tags/v2.30.0 | awk '{print $1}')" = "$FORMAL_SOURCE"
          R=$(gh api repos/llhzx2018/vf-start/releases/tags/v2.30.0)
          test "$(jq -r .id <<<"$R")" = "$RELEASE_ID"
          test "$(jq -r .draft <<<"$R")" = false
          test "$(jq -r .prerelease <<<"$R")" = false
          A=$(jq -c '.assets[]|select(.name=="VF_Start_V2.30.0_UPDATE.zip")' <<<"$R")
          test "$(jq -r .size <<<"$A")" = "$UPDATE_BYTES"
          test "$(jq -r .digest <<<"$A")" = "sha256:$UPDATE_SHA"
          gh release download v2.30.0 -R llhzx2018/vf-start -p VF_Start_V2.30.0_UPDATE.zip -D "$EVID"
          test "$(sha256sum "$EVID/VF_Start_V2.30.0_UPDATE.zip" | awk '{print $1}')" = "$UPDATE_SHA"
          test "$(stat -c%s "$EVID/VF_Start_V2.30.0_UPDATE.zip")" = "$UPDATE_BYTES"
          unzip -Z1 "$EVID/VF_Start_V2.30.0_UPDATE.zip" | grep -Fx repair-v2.30.0.php >/dev/null
          printf '%s\n' "$R" > "$EVID/release.json"
          cp updates/projects/P01.json "$EVID/P01.json"
          echo P01_V230_V2_REMOTE_TRUTH=PASS

      - name: Build isolated Owner-like V2.29 runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$ROOT" /tmp/p01-v230-v2.cookies
          cp -a production/src "$ROOT"
          php -S "127.0.0.1:${PORT}" -t "$ROOT" >"$EVID/pre-server.log" 2>&1 &
          echo $! >/tmp/p01-v230-v2.pid
          COOKIE=/tmp/p01-v230-v2.cookies
          for i in $(seq 1 40); do
            if curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:${PORT}/setup.php" -o /tmp/p01-v230-v2-setup.html; then break; fi
            sleep 0.25
          done
          test -s /tmp/p01-v230-v2-setup.html
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-v230-v2-setup.html',encoding='utf-8').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s); assert m; print(m.group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:${PORT}/setup.php" \
            --data-urlencode "setup_csrf=$CSRF" \
            --data-urlencode 'site_title=V230 Authoritative V2 Owner' \
            --data-urlencode "admin_password=$ADMIN_PASS" \
            --data-urlencode "admin_password_confirm=$ADMIN_PASS" >/dev/null
          test "$(tr -d '\r\n' < "$ROOT/VERSION.txt")" = 2.29.0
          php "$ROOT/cli/verify.php" | tee "$EVID/pre-verify.txt" | grep -Fx VERIFY_PASS=YES
          echo P01_V230_V2_V229_INSTALL=PASS

      - name: Seed representative Public Private domain data
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/p01-v230-v2-seed.php <<'PHP'
          <?php
          declare(strict_types=1);
          $root=getenv('ROOT'); require $root.'/app/bootstrap.php'; require_once $root.'/app/SurfaceRepository.php';
          $r=new VfRepository(vf_db()); $s=new VfSurfaceRepository(vf_db());
          $pub=$r->createCategory(['name'=>'公开导航','description'=>'V230 public','is_private'=>false,'sort_order'=>100]);
          $priv=$r->createCategory(['name'=>'私人导航','description'=>'V230 private','is_private'=>true,'sort_order'=>90]);
          $ids=['pub_cat'=>$pub,'priv_cat'=>$priv];
          for($i=1;$i<=12;$i++) $r->saveLink(null,['category_id'=>$pub,'title'=>'公开导航资源 '.str_pad((string)$i,2,'0',STR_PAD_LEFT),'url'=>'https://public-nav-'.$i.'.example.com','description'=>'preserve','tags'=>'authority,公开','is_private'=>false,'is_favorite'=>$i===1],'manual');
          for($i=1;$i<=3;$i++) $r->saveLink(null,['category_id'=>$priv,'title'=>'私人导航资源 '.str_pad((string)$i,2,'0',STR_PAD_LEFT),'url'=>'https://private-nav-'.$i.'.example.com','description'=>'private','tags'=>'authority,私人','is_private'=>true],'manual');
          foreach([['channels','频道','公开频道','私人频道'],['watch','电影','公开影视','私人影视'],['topics','AI','公开专题','私人专题']] as $cfg){
            [$domain,$kind,$pubTitle,$privTitle]=$cfg;
            for($i=1;$i<=3;$i++){
              $x=$r->saveLink(null,['category_id'=>$pub,'title'=>$pubTitle.' '.$i,'url'=>'https://'.$domain.'-public-'.$i.'.example.com','description'=>'public domain','tags'=>'authority,公开','is_private'=>false],'manual');
              $p=['surface'=>$domain,'resource_kind'=>$kind,'note'=>'public-'.$domain.'-'.$i];
              if($domain==='channels')$p['background_friendly']=true;
              if($domain==='watch'){ $p['media_year']=2020+$i; $p['media_status']='want'; }
              if($domain==='topics'){ $p['source_kind']='remote_url'; $p['source_ref']='https://'.$domain.'-public-'.$i.'.example.com'; }
              $s->upsertProfile((int)$x['id'],$p);
            }
            for($i=1;$i<=2;$i++){
              $x=$r->saveLink(null,['category_id'=>$priv,'title'=>$privTitle.' '.$i,'url'=>'https://'.$domain.'-private-'.$i.'.example.com','description'=>'private domain','tags'=>'authority,私人','is_private'=>true],'manual');
              $p=['surface'=>$domain,'resource_kind'=>$kind,'note'=>'private-'.$domain.'-'.$i];
              if($domain==='channels')$p['background_friendly']=true;
              if($domain==='watch'){ $p['media_year']=2010+$i; $p['media_status']='favorite'; }
              if($domain==='topics'){ $p['source_kind']='remote_url'; $p['source_ref']='https://'.$domain.'-private-'.$i.'.example.com'; }
              $s->upsertProfile((int)$x['id'],$p);
            }
          }
          $db=vf_db(); $counts=$s->counts(true);
          $before=['links'=>(int)$db->query("SELECT COUNT(*) FROM links WHERE lifecycle_state='active'")->fetchColumn(),'categories'=>(int)$db->query("SELECT COUNT(*) FROM categories WHERE lifecycle_state='active'")->fetchColumn(),'favorites'=>(int)$db->query("SELECT COUNT(*) FROM links WHERE lifecycle_state='active' AND is_favorite=1")->fetchColumn(),'profiles'=>(int)$db->query('SELECT COUNT(*) FROM resource_domain_profiles')->fetchColumn(),'schema'=>(string)$db->query("SELECT MAX(version) FROM schema_migrations WHERE status='success'")->fetchColumn(),'surface_counts'=>$counts];
          if($before['links']!==30||$before['categories']!==2||$before['favorites']!==1||$before['profiles']!==15||$before['schema']!=='2026082901') throw new RuntimeException('seed counts '.json_encode($before));
          foreach(['start'=>15,'channels'=>5,'watch'=>5,'topics'=>5,'total'=>30] as $k=>$v) if((int)($counts[$k]??-1)!==$v) throw new RuntimeException('surface '.$k);
          file_put_contents('/tmp/p01-v230-v2-before.json',json_encode($before,JSON_PRETTY_PRINT|JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES));
          file_put_contents('/tmp/p01-v230-v2-ids.json',json_encode($ids,JSON_THROW_ON_ERROR));
          echo "P01_V230_V2_SEED=PASS\n";
          PHP
          php /tmp/p01-v230-v2-seed.php | tee "$EVID/seed.txt" | grep -Fx P01_V230_V2_SEED=PASS
          cp /tmp/p01-v230-v2-before.json "$EVID/before.json"

      - name: Execute real VfUpdateManager remote check prepare install
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/p01-v230-v2-update.php <<'PHP'
          <?php
          declare(strict_types=1);
          $root=getenv('ROOT'); require $root.'/app/bootstrap.php'; require_once $root.'/app/UpdateManager.php';
          $m=new VfUpdateManager(vf_db(),['root'=>$root,'private_root'=>VF_PRIVATE_ROOT,'current_version'=>'2.29.0']);
          $check=$m->check(true);
          if(($check['ok']??false)!==true||($check['current_version']??'')!=='2.29.0'||($check['latest_version']??'')!=='2.30.0'||($check['available']??false)!==true||($check['can_update']??false)!==true) throw new RuntimeException('check '.json_encode($check,JSON_UNESCAPED_UNICODE));
          $req=$check['requirements']??[];
          if(($req['schema']['current']??'')!=='2026082901'||($req['schema']['from']??'')!=='2026082901'||($req['schema']['target']??'')!=='2026082901'||($req['schema']['ok']??false)!==true) throw new RuntimeException('schema '.json_encode($req,JSON_UNESCAPED_UNICODE));
          $prep=$m->prepare();
          if(($prep['ok']??false)!==true||($prep['from_version']??'')!=='2.29.0'||($prep['to_version']??'')!=='2.30.0'||($prep['release_tag']??'')!=='v2.30.0'||($prep['asset_name']??'')!=='VF_Start_V2.30.0_UPDATE.zip'||(int)($prep['update_package_bytes']??0)!==1328072||($prep['update_package_sha256']??'')!=='65869be49eb094d2be97609aa4fd588aeed737b97695882fc3b216eaf20edcb0') throw new RuntimeException('prepare '.json_encode($prep,JSON_UNESCAPED_UNICODE));
          foreach(['manifest_identity','release_tag','release_asset','bytes','sha256','atomic_self_test','recovery_point'] as $k) if(($prep['checks'][$k]??'')!=='pass') throw new RuntimeException('prepare check '.$k);
          $install=$m->install((string)$prep['operation_id']);
          if(($install['ok']??false)!==true||($install['updated']??false)!==true||($install['from_version']??'')!=='2.29.0'||($install['to_version']??'')!=='2.30.0') throw new RuntimeException('install '.json_encode($install,JSON_UNESCAPED_UNICODE));
          foreach(['release_identity','atomic_handoff','activation','cleanup'] as $k) if(($install['checks'][$k]??'')!=='pass') throw new RuntimeException('install check '.$k);
          file_put_contents(getenv('EVID').'/update.json',json_encode(['check'=>$check,'prepare'=>$prep,'install'=>$install],JSON_PRETTY_PRINT|JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES));
          echo "P01_V230_V2_REAL_REMOTE_UPDATE=PASS\n";
          PHP
          php /tmp/p01-v230-v2-update.php | tee "$EVID/update.txt" | grep -Fx P01_V230_V2_REAL_REMOTE_UPDATE=PASS

      - name: Verify upgraded version schema data and integrity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(tr -d '\r\n' < "$ROOT/VERSION.txt")" = 2.30.0
          grep -Fx "define('VF_VERSION', '2.30.0');" "$ROOT/app/bootstrap.php" >/dev/null
          test -f "$ROOT/assets/workspace-domain-nav.css"
          php "$ROOT/cli/verify.php" | tee "$EVID/post-verify.txt" | grep -Fx VERIFY_PASS=YES
          cat >/tmp/p01-v230-v2-post.php <<'PHP'
          <?php
          declare(strict_types=1);
          $root=getenv('ROOT'); $before=json_decode((string)file_get_contents('/tmp/p01-v230-v2-before.json'),true,512,JSON_THROW_ON_ERROR);
          require $root.'/app/bootstrap.php'; require_once $root.'/app/SurfaceRepository.php';
          $db=vf_db(); $s=new VfSurfaceRepository($db);
          $after=['links'=>(int)$db->query("SELECT COUNT(*) FROM links WHERE lifecycle_state='active'")->fetchColumn(),'categories'=>(int)$db->query("SELECT COUNT(*) FROM categories WHERE lifecycle_state='active'")->fetchColumn(),'favorites'=>(int)$db->query("SELECT COUNT(*) FROM links WHERE lifecycle_state='active' AND is_favorite=1")->fetchColumn(),'profiles'=>(int)$db->query('SELECT COUNT(*) FROM resource_domain_profiles')->fetchColumn(),'schema'=>(string)$db->query("SELECT COALESCE(MAX(version),'') FROM schema_migrations WHERE status='success'")->fetchColumn(),'integrity'=>strtolower((string)$db->query('PRAGMA integrity_check')->fetchColumn()),'fk'=>count($db->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC)),'surface_counts'=>$s->counts(true)];
          if($after['integrity']!=='ok'||$after['fk']!==0||$after['schema']!=='2026082901') throw new RuntimeException('database');
          foreach(['links','categories','favorites','profiles'] as $k) if($after[$k]!==$before[$k]) throw new RuntimeException('preserve '.$k);
          foreach($before['surface_counts'] as $k=>$v) if((int)($after['surface_counts'][$k]??-1)!==(int)$v) throw new RuntimeException('surface '.$k);
          $ids=json_decode((string)file_get_contents('/tmp/p01-v230-v2-ids.json'),true,512,JSON_THROW_ON_ERROR);
          $r=new VfRepository($db); $post=$r->saveLink(null,['category_id'=>(int)$ids['pub_cat'],'title'=>'升级后新增专题','url'=>'https://post-v230-topic.example.com','description'=>'post','tags'=>'升级后','is_private'=>false],'manual');
          $s->upsertProfile((int)$post['id'],['surface'=>'topics','resource_kind'=>'AI','source_kind'=>'remote_url','source_ref'=>'https://post-v230-topic.example.com']);
          if((int)$s->collection('topics',true)['count']!==6) throw new RuntimeException('post mutation');
          if(strtolower((string)$db->query('PRAGMA integrity_check')->fetchColumn())!=='ok'||count($db->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC))!==0) throw new RuntimeException('post integrity');
          file_put_contents(getenv('EVID').'/post.json',json_encode($after,JSON_PRETTY_PRINT|JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES));
          echo "P01_V230_V2_DATA_SCHEMA=PASS\n";
          PHP
          php /tmp/p01-v230-v2-post.php | tee "$EVID/post.txt" | grep -Fx P01_V230_V2_DATA_SCHEMA=PASS

      - name: Diagnostic Anonymous Public Private HTTP boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(tr -d '\r\n' < "$ROOT/VERSION.txt")" = 2.30.0
          if test -f /tmp/p01-v230-v2.pid; then kill "$(cat /tmp/p01-v230-v2.pid)" >/dev/null 2>&1 || true; fi
          php -S "127.0.0.1:${PORT}" -t "$ROOT" >"$EVID/post-http-server.log" 2>&1 &
          echo $! >/tmp/p01-v230-v2.pid
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:${PORT}/start.php" -o "$EVID/start-anonymous.html"; then ready=1; break; fi
            sleep 0.25
          done
          test "$ready" = 1
          for p in channels watch topics; do
            code=$(curl -sS -o "$EVID/${p}-anonymous.html" -w '%{http_code}' "http://127.0.0.1:${PORT}/${p}.php")
            test "$code" = 200 || { echo "HTTP_STATUS_${p}=$code" | tee -a "$EVID/http-diagnostics.txt"; exit 20; }
          done
          assert_visible(){
            local page="$1" pub="$2" priv="$3" label="$4"
            if ! grep -F "$pub" "$page" >/dev/null; then
              echo "MISSING_PUBLIC:$label:$pub" | tee -a "$EVID/http-diagnostics.txt"
              grep -n -F "${pub%% *}" "$page" | head -20 | tee -a "$EVID/http-diagnostics.txt" || true
              return 11
            fi
            if grep -F "$priv" "$page" >/dev/null; then
              echo "PRIVATE_LEAK:$label:$priv" | tee -a "$EVID/http-diagnostics.txt"
              grep -n -F "$priv" "$page" | head -10 | tee -a "$EVID/http-diagnostics.txt" || true
              return 12
            fi
            echo "HTTP_BOUNDARY_PASS:$label" | tee -a "$EVID/http-diagnostics.txt"
          }
          assert_visible "$EVID/start-anonymous.html" '公开导航资源 01' '私人导航资源 01' start
          assert_visible "$EVID/channels-anonymous.html" '公开频道 1' '私人频道 1' channels
          assert_visible "$EVID/watch-anonymous.html" '公开影视 1' '私人影视 1' watch
          assert_visible "$EVID/topics-anonymous.html" '公开专题 1' '私人专题 1' topics
          echo P01_V230_V2_ANONYMOUS_PUBLIC_PRIVATE_HTTP=PASS | tee -a "$EVID/http-diagnostics.txt"

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-v230-v2-browser && cd /tmp/p01-v230-v2-browser
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-save >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null 2>&1

      - name: Desktop Mobile browser validation after remote upgrade
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/p01-v230-v2-browser/gate.mjs <<'JS'
          import { chromium } from 'playwright'; import fs from 'fs';
          const base='http://127.0.0.1:18632', pass='P01V230!AuthoritativeV2', evid='/tmp/p01-v230-authoritative-v2-evidence';
          const browser=await chromium.launch({headless:true});
          const anon=await browser.newContext({viewport:{width:1440,height:960}}); const ap=await anon.newPage();
          await ap.goto(base+'/start.php',{waitUntil:'networkidle'}); const at=await ap.locator('body').innerText();
          if(!at.includes('公开导航资源 01')||at.includes('私人导航资源 01')) throw new Error('anonymous privacy');
          if(await ap.locator('.vf-global-domain-nav a').count()!==5) throw new Error('anon global nav'); await anon.close();
          const desktop=await browser.newContext({viewport:{width:1440,height:960}}); let lr=await desktop.request.post(base+'/api.php?action=login',{data:{password:pass}}); if(!lr.ok()) throw new Error('desktop login');
          const p=await desktop.newPage();
          for(const [path,pub,priv] of [['start.php','公开导航资源 01','私人导航资源 01'],['channels.php','公开频道 1','私人频道 1'],['watch.php','公开影视 1','私人影视 1'],['topics.php','公开专题 1','私人专题 1']]){
            await p.goto(base+'/'+path,{waitUntil:'networkidle'}); const body=await p.locator('body').innerText(); if(!body.includes(pub)||!body.includes(priv)) throw new Error(path+' admin data');
            if(await p.locator('.vf-global-domain-nav a').count()!==5) throw new Error(path+' nav count'); if(await p.locator('.vf-global-domain-nav a.active').count()!==1) throw new Error(path+' active');
            if(await p.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth)>1) throw new Error(path+' desktop overflow');
          }
          await p.goto(base+'/start.php',{waitUntil:'networkidle'}); if(await p.locator('.vf-asset-row').count()<15) throw new Error('navigation density'); await p.screenshot({path:evid+'/desktop-start.png',fullPage:true});
          for(const path of ['channels','watch','topics']){await p.goto(base+'/'+path+'.php',{waitUntil:'networkidle'}); await p.screenshot({path:evid+'/desktop-'+path+'.png',fullPage:true});}
          await desktop.close();
          const mobile=await browser.newContext({viewport:{width:390,height:844}}); lr=await mobile.request.post(base+'/api.php?action=login',{data:{password:pass}}); if(!lr.ok()) throw new Error('mobile login');
          const m=await mobile.newPage(); await m.goto(base+'/start.php',{waitUntil:'networkidle'}); await m.locator('.vf-mobile-command-row').waitFor({state:'visible'});
          const trigger=m.locator('.vf-mobile-category-trigger'); await trigger.waitFor({state:'visible'}); await trigger.click(); const overlay=m.locator('.vf-mobile-category-overlay'); await overlay.waitFor({state:'visible'});
          await overlay.locator('input[type=search]').fill('私人导航'); if(await overlay.locator('[data-category-picker-item]',{hasText:'私人导航'}).count()!==1) throw new Error('mobile category picker');
          if(await m.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth)>1) throw new Error('mobile start overflow'); await m.screenshot({path:evid+'/mobile-start.png',fullPage:true});
          for(const path of ['channels.php','watch.php','topics.php']){await m.goto(base+'/'+path,{waitUntil:'networkidle'}); if(await m.locator('.vf-global-domain-nav a').count()!==5) throw new Error(path+' mobile nav'); if(await m.locator('.vf-global-domain-nav a.active').count()!==1) throw new Error(path+' mobile active'); if(await m.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth)>1) throw new Error(path+' mobile overflow');}
          await m.screenshot({path:evid+'/mobile-topics.png',fullPage:true}); await mobile.close(); await browser.close(); fs.writeFileSync(evid+'/browser-verdict.txt','P01_V230_V2_DESKTOP_MOBILE_BROWSER=PASS\n');
          JS
          cd /tmp/p01-v230-v2-browser && node gate.mjs
          grep -Fx P01_V230_V2_DESKTOP_MOBILE_BROWSER=PASS "$EVID/browser-verdict.txt"

      - name: Final authoritative verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$EVID/verdict.txt" <<EOF
          SOURCE_VERSION=2.29.0
          TARGET_VERSION=2.30.0
          SOURCE_SCHEMA=$SCHEMA
          TARGET_SCHEMA=$SCHEMA
          FORMAL_SOURCE=$FORMAL_SOURCE
          FORMAL_TREE=$FORMAL_TREE
          PRODUCT_SOURCE=$PRODUCT_SOURCE
          PRODUCT_TREE=$PRODUCT_TREE
          CORE_UPDATES_MAIN=$CORE_UPDATES_MAIN
          RELEASE_ID=$RELEASE_ID
          UPDATE_SHA256=$UPDATE_SHA
          UPDATE_BYTES=$UPDATE_BYTES
          P01_V229_TO_V230_REMOTE_ONLINE_UPDATE_GATE=PASS
          P01_V230_DATA_PRESERVATION=PASS
          P01_V230_PUBLIC_PRIVATE_HTTP=PASS
          P01_V230_DESKTOP_MOBILE_BROWSER=PASS
          P01_V230_READY_FOR_OWNER_PRODUCTION_UPGRADE=YES
          OWNER_PRODUCTION_WRITE=NO
          EOF
          cat "$EVID/verdict.txt"

      - name: Upload authoritative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-v230-remote-online-update-v2-evidence-${{ github.run_id }}
          path: /tmp/p01-v230-authoritative-v2-evidence
          if-no-files-found: warn
          retention-days: 30
