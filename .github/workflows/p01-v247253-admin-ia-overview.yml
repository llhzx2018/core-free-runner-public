name: P01 V2.47.253 Admin IA + Overview Proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p01-v247253-admin-ia-overview.yml"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout proof control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd >/dev/null

      - name: Clone exact candidate and baseline
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" candidate
          git -C candidate fetch -q origin 1811dc1a10e8423748bfb74d0e1993c9844e4492
          git -C candidate checkout -q --detach 1811dc1a10e8423748bfb74d0e1993c9844e4492
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.253"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "2.47.253"

          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" baseline
          git -C baseline fetch -q origin c74ebc6353d6722fa9d7d1dffdd06d57fa0b3f28
          git -C baseline checkout -q --detach c74ebc6353d6722fa9d7d1dffdd06d57fa0b3f28
          echo P01_V247253_EXACT_SOURCE=PASS

      - name: PHP syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in             candidate/src/app/AdminShell.php             candidate/src/manage.php             candidate/src/health.php             candidate/src/duplicates.php             candidate/src/icons.php             candidate/src/recycle-bin.php             candidate/src/app/bootstrap.php; do
            php -l "$f"
          done
          echo P01_V247253_PHP_SYNTAX=PASS

      - name: Focused admin IA and overview contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          php candidate/tests/unit/admin_ia_v247253_contract.php
          php candidate/tests/unit/admin_navigation_consistency_contract.php
          php candidate/tests/unit/admin_secondary_nav_focus_contract.php
          php candidate/tests/unit/admin_special_primary_nav_r76_contract.php
          php candidate/tests/unit/admin_diagnose_entry_closure_r1_contract.php
          php candidate/tests/unit/admin_rail_action_only_contract.php
          php candidate/tests/unit/admin_overview_ia_contract.php
          php candidate/tests/unit/admin_overview_actionable_health_contract.php
          php candidate/tests/unit/admin_backend_closure_contract.php
          php candidate/tests/unit/admin_backend_coverage_r60_contract.php
          echo P01_V247253_ADMIN_FOCUSED=PASS

      - name: Canonical regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate baseline --require-zero-debt | tee /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/canonical.txt
          echo P01_V247253_CANONICAL=PASS

      - name: Prove bounded scope
        shell: bash
        run: |
          echo FORMAL_RELEASE_CALLED=NO
          echo DISTRIBUTION_WRITE=NO
          echo PRODUCTION_WRITE=NO
