name: S01 M3U8 1.25.43 Locator Contract Repair Gate

on:
  push:
    branches: [task/s01-theme13540-m3u812543-formal-release-20260925]
    paths:
      - '.github/workflows/s01-m3u8-12543-locator-contract-repair-gate-20260925.yml'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact M3U8 repair candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: 4c0a9a11626a5cfb18739f2e989e201bf5de9d48
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false

      - name: Verify test-only repair
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "4c0a9a11626a5cfb18739f2e989e201bf5de9d48"
          test "$(tr -d '\r\n' < VERSION)" = "1.25.43"
          grep -Fq "Version: 1.25.43" src/vf-tool-m3u8.php
          php tests/unit/package-physical-locator-contract.php
          php tests/s01-c03-admin-shell-alignment-r1-contract.php
          php tests/unit/admin-human-language-contract.php
          php tests/unit/update-schema-authority-contract.php
          echo M3U8_LOCATOR_CONTRACT_REPAIR_GATE=PASS
