name: P02 V2.5.9 Formal Verify And Publish

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v259-formal-release.yml'

permissions:
  contents: read

jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PRODUCT_REF: 611430c9dfd487b8a11e6b1d82eb03a283c0c25b
      SRCVER: 2.5.8
      VER: 2.5.9
      SCHEMA: '2401'
      TAG: v2.5.9
      UPDATE_NAME: VF_Library_V2.5.9_UPDATE.zip
    steps:
      - name: Require registered capabilities
        env:
          READ_TOKEN: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'
          RELEASE_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$RELEASE_TOKEN"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: '${{ env.PRODUCT_REF }}'
          token: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'
          path: product
          fetch-depth: 0
          persist-credentials: false

      - name: Exact source and repository gates
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_REF"
          test "$(tr -d '\r\n' < VERSION)" = "$VER"
          test "$(jq -r .version SOURCE_MANIFEST.json)" = "$VER"
          test "$(jq -r .schema SOURCE_MANIFEST.json)" = "$SCHEMA"
          test "$(jq -r .runtime_source_file_count SOURCE_MANIFEST.json)" = 72
          php -l src/app/ScratchTabsService.php >/dev/null
          php -l public/scratch-action.php >/dev/null
          node --check public/assets/scratch-tabs.js
          node --check public/assets/v254-common-branding.js
          python3 scripts/repository-gates.py
          git diff --check
          echo EXACT_FORMAL_SOURCE=PASS
          echo REPOSITORY_PRIVACY_GATES=PASS

      - name: Prepare deterministic V2.5.9 builder
        working-directory: product
        run: |
          set -Eeuo pipefail
          cp scripts/build-release-v2.5.4.py "$RUNNER_TEMP/build-v259.py"
          python3 - "$RUNNER_TEMP/build-v259.py" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text(encoding='utf-8')
          old="ROOT=Path(__file__).resolve().parents[1]; SRCVER='2.5.2'; VER='2.5.4'; SCHEMA=2401; DT=(2026,8,19,2,0,0)"
          new="ROOT=Path.cwd(); SRCVER='2.5.8'; VER='2.5.9'; SCHEMA=2401; DT=(2026,8,19,6,0,0)"
          assert old in s; s=s.replace(old,new)
          s=s.replace("default='build/release-v2.5.4'","default='build/release-v2.5.9'").replace("default='release/v2.5.4'","default='release/v2.5.9'")
          start="notes=out/f'VF_Library_V{VER}_RELEASE_NOTES.md'; notes.write_text(f'''"; end="''')\n arts=[sz,fz,uz,az,rf,notes]"
          i=s.index(start); j=s.index(end,i)
          notes="""notes=out/f'VF_Library_V{VER}_RELEASE_NOTES.md'; notes.write_text(f'''# VF Library V{VER}\n\nV2.5.9 adds Scratch Tabs / 临时页签工作台 as a lightweight Notepad replacement layer for personal use.\n\n- Instant blank temporary tabs with no required title, category or manual save.\n- Autosave and persistent open/closed tab state in existing private SQLite storage.\n- Refresh/reopen continuity; closing a tab does not delete content and Recent Closed can reopen it.\n- Organize later into a formal quick note or article and choose a category, preferring 99 待整理 when present.\n- Scratch content stays separate from formal notes/articles; the existing editor and preset-template flow remain unchanged.\n- Candidate API/Fresh Install run 32220473904 and real Chrome run 32220814612 passed persistence, multi-tab, restore, close/reopen, organize and mobile overflow gates.\n- Schema remains {SCHEMA}; no migration. Existing {SRCVER} sites use UPDATE.\n''')\n arts=[sz,fz,uz,az,rf,notes]"""
          s=s[:i]+notes+s[j+len(end):]
          s=s.replace("'candidate_browser':'PASS_RUN_32206056733_PLUS_32146866564'","'candidate_browser':'PASS_RUN_32220814612_PLUS_API_32220473904'")
          s=s.replace("'main_readback':'PRODUCTION_2.5.2_CURRENT_EXPECTED_NOT_PROMOTED'","'main_readback':'PRODUCTION_2.5.8_OWNER_AUTHENTICATED_CURRENT'")
          p.write_text(s,encoding='utf-8')
          PY
          python3 -m py_compile "$RUNNER_TEMP/build-v259.py"

      - name: Deterministic formal build twice
        working-directory: product
        run: |
          set -Eeuo pipefail
          TREE=$(git show -s --format=%T "$PRODUCT_REF")
          python3 "$RUNNER_TEMP/build-v259.py" --out build/formal-a --source-commit "$PRODUCT_REF" --source-tree "$TREE" --source-ref release/v2.5.9 >/tmp/a.json
          python3 "$RUNNER_TEMP/build-v259.py" --out build/formal-b --source-commit "$PRODUCT_REF" --source-tree "$TREE" --source-ref release/v2.5.9 >/tmp/b.json
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          a=Path('build/formal-a'); b=Path('build/formal-b')
          ha={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in a.iterdir() if p.is_file()}; hb={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in b.iterdir() if p.is_file()}
          assert ha==hb,(ha,hb)
          req={'VF_Library_V2.5.9_UPDATE.zip','VF_Library_V2.5.9_FULL.zip','VF_Library_V2.5.9_ATOMIC.zip','VF_Library_V2.5.9_SOURCE.zip','repair-v2.5.9.php','VF_Library_V2.5.9_RELEASE_NOTES.md','VF_Library_V2.5.9_RELEASE_MANIFEST.json','SHA256SUMS.txt'}
          assert req<=set(ha)
          print('DETERMINISTIC_BUILD=PASS')
          for n,h in sorted(ha.items()):print(n,h)
          PY
          unzip -t build/formal-a/$UPDATE_NAME >/dev/null
          unzip -t build/formal-a/VF_Library_V2.5.9_FULL.zip >/dev/null
          unzip -t build/formal-a/VF_Library_V2.5.9_ATOMIC.zip >/dev/null
          unzip -p build/formal-a/$UPDATE_NAME atomic-manifest.json | jq -e '.source_version=="2.5.8" and .target_version=="2.5.9" and .source_schema==2401 and .target_schema==2401' >/dev/null
          echo FORMAL_ARCHIVE_AND_SOURCE_IDENTITY=PASS

      - name: FULL fresh install plus Scratch API smoke
        working-directory: product
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/fresh259"; SITE="$ROOT/site"; mkdir -p "$SITE"; unzip -q build/formal-a/VF_Library_V2.5.9_FULL.zip -d "$SITE"
          test "$(cat "$SITE/VERSION.txt")" = 2.5.9
          PW="P02-V259-FRESH-${{ github.run_id }}!"; PORT=18294
          php -S 127.0.0.1:$PORT -t "$SITE" >/dev/null 2>&1 & PID=$!
          for _ in $(seq 1 80);do curl -fsS "http://127.0.0.1:$PORT/setup.php" >/dev/null 2>&1&&break;sleep .25;done
          curl -fsS -c "$ROOT/c" "http://127.0.0.1:$PORT/setup.php" > "$ROOT/setup"
          TOKEN=$(python3 - "$ROOT/setup" <<'PY'
          import re,html,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf" value="([^"]+)"',s);assert m;print(html.unescape(m.group(1)))
          PY
          )
          test "$(curl -sS -o /dev/null -w '%{http_code}' -b "$ROOT/c" -c "$ROOT/c" -H "Origin: http://127.0.0.1:$PORT" --data-urlencode "setup_csrf=$TOKEN" --data-urlencode "password=$PW" --data-urlencode "password_confirm=$PW" "http://127.0.0.1:$PORT/setup.php")" = 303
          SESSION=$(curl -fsS -b "$ROOT/c" "http://127.0.0.1:$PORT/api.php?action=session"); CSRF=$(jq -r .csrf<<<"$SESSION")
          NEW=$(curl -fsS -b "$ROOT/c" -H 'Content-Type: application/json' -H "X-CSRF-Token: $CSRF" -d '{}' "http://127.0.0.1:$PORT/scratch-action.php?action=create"); SID=$(jq -r .tab.id<<<"$NEW"); test "$SID" -gt 0
          curl -fsS -b "$ROOT/c" -H 'Content-Type: application/json' -H "X-CSRF-Token: $CSRF" -d "$(jq -nc --argjson id "$SID" --arg c 'Fresh Scratch' '{id:$id,content:$c,cursor_pos:13,scroll_top:0}')" "http://127.0.0.1:$PORT/scratch-action.php?action=save" | jq -e '.tab.content=="Fresh Scratch"' >/dev/null
          php "$SITE/cli/verify.php" | jq -e '.ok==true and .version=="2.5.9" and .schema_version==2401 and .integrity=="ok" and .foreign_key_errors==0' >/dev/null
          kill "$PID"
          echo FULL_FRESH_INSTALL_AND_SCRATCH=PASS

      - name: Existing Production V2.5.8 to V2.5.9
        working-directory: product
        env:
          READ_TOKEN: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/up258"; SRC="$ROOT/src"; SITE="$ROOT/site"; mkdir -p "$ROOT"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-library.git" "$SRC"; git -C "$SRC" checkout -q v2.5.8; mkdir -p "$SITE"; bash "$SRC/scripts/build-deploy-tree.sh" "$SITE" >/dev/null
          test "$(cat "$SITE/VERSION.txt")" = 2.5.8
          PW="P02-V259-UP-${{ github.run_id }}!"; PORT=18295
          php -S 127.0.0.1:$PORT -t "$SITE" >/dev/null 2>&1 & PID=$!
          for _ in $(seq 1 80);do curl -fsS "http://127.0.0.1:$PORT/setup.php" >/dev/null 2>&1&&break;sleep .25;done
          curl -fsS -c "$ROOT/c" "http://127.0.0.1:$PORT/setup.php" > "$ROOT/setup"
          TOKEN=$(python3 - "$ROOT/setup" <<'PY'
          import re,html,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf" value="([^"]+)"',s);assert m;print(html.unescape(m.group(1)))
          PY
          )
          test "$(curl -sS -o /dev/null -w '%{http_code}' -b "$ROOT/c" -c "$ROOT/c" -H "Origin: http://127.0.0.1:$PORT" --data-urlencode "setup_csrf=$TOKEN" --data-urlencode "password=$PW" --data-urlencode "password_confirm=$PW" "http://127.0.0.1:$PORT/setup.php")" = 303
          SESSION=$(curl -fsS -b "$ROOT/c" "http://127.0.0.1:$PORT/api.php?action=session"); CSRF=$(jq -r .csrf<<<"$SESSION")
          CAT=$(curl -fsS -b "$ROOT/c" -H 'Content-Type: application/json' -H "X-CSRF-Token: $CSRF" -d '{"name":"V259 Preserve","icon":"folder"}' "http://127.0.0.1:$PORT/api.php?action=category_save"); CID=$(jq -r .id<<<"$CAT")
          ITEM=$(jq -nc --argjson cid "$CID" '{category_id:$cid,title:"V259 Existing",content:"keep",content_mode:"article",content_format:"markdown",primary_action:"read",status:"active"}')
          SAVED=$(curl -fsS -b "$ROOT/c" -H 'Content-Type: application/json' -H "X-CSRF-Token: $CSRF" -d "$ITEM" "http://127.0.0.1:$PORT/api.php?action=content_save"); IID=$(jq -r .id<<<"$SAVED")
          curl -fsS -b "$ROOT/c" -H 'Content-Type: application/json' -H "X-CSRF-Token: $CSRF" -d "{\"id\":$IID,\"favorite\":true}" "http://127.0.0.1:$PORT/api.php?action=content_favorite" | jq -e .ok >/dev/null
          cat > "$ROOT/seed.php" <<'PHP'
          <?php
          $site=$argv[1]; require $site.'/app/bootstrap.php'; $db=vftb_db();
          $state=['version'=>1,'next_id'=>43,'tabs'=>[['id'=>42,'content'=>"升级前临时记录\n第二行",'is_open'=>true,'sort_order'=>100,'cursor_pos'=>6,'scroll_top'=>17,'created_at'=>gmdate('c'),'updated_at'=>gmdate('c'),'closed_at'=>null]]];
          $q=$db->prepare('INSERT INTO system_settings(setting_key,setting_value,updated_at) VALUES (?,?,?) ON CONFLICT(setting_key) DO UPDATE SET setting_value=excluded.setting_value,updated_at=excluded.updated_at');$q->execute(['scratch_tabs_state_v1',json_encode($state,JSON_UNESCAPED_UNICODE),gmdate('c')]);
          PHP
          php "$ROOT/seed.php" "$SITE"
          PKG="$(pwd)/build/formal-a/$UPDATE_NAME"; BYTES=$(stat -c%s "$PKG"); SHA=$(sha256sum "$PKG"|awk '{print $1}')
          cat > "$ROOT/up.php" <<'PHP'
          <?php
          $site=$argv[1];$pkg=$argv[2];$bytes=(int)$argv[3];$sha=$argv[4];$out=$argv[5];require $site.'/app/bootstrap.php';require_once $site.'/app/CoreUpdates/UpdateAdapter.php';require_once $site.'/app/CoreUpdates/UpdateCore.php';require_once $site.'/app/VfLibraryCoreUpdateAdapter.php';
          $m=['schema_version'=>'1.0','project_id'=>'P02','component_id'=>'APP','enabled'=>true,'current_version'=>'2.5.8','target_version'=>'2.5.9','update_type'=>'ATOMIC','from_versions'=>['2.5.8'],'schema_from'=>'2401','schema_to'=>'2401','repository'=>'llhzx2018/vf-library','release_tag'=>'v2.5.9','asset_name'=>'VF_Library_V2.5.9_UPDATE.zip','asset_bytes'=>$bytes,'asset_sha256'=>$sha,'backup_required'=>true,'rollback_supported'=>true,'released_at'=>'2026-08-19T06:00:00Z'];
          $c=new CoreUpdates\UpdateCore('P02','APP');if(($c->check('2.5.8','2401',$m)['status']??'')!=='AVAILABLE')exit(2);if(($c->verifyPackage($pkg,$m)['status']??'')!=='VERIFIED')exit(3);$r=$c->upgrade('2.5.8','2401',new VfLibraryCoreUpdateAdapter(),$pkg,$m);file_put_contents($out,json_encode($r));if(!in_array($r['status']??'',['COMMITTED','COMMITTED_WITH_CLEANUP_WARNING'],true)||empty($r['backup_locator']))exit(4);
          PHP
          php "$ROOT/up.php" "$SITE" "$PKG" "$BYTES" "$SHA" "$ROOT/result"
          test "$(cat "$SITE/VERSION.txt")" = 2.5.9; jq -e '.backup_locator|length>0' "$ROOT/result" >/dev/null
          curl -fsS -b "$ROOT/c" "http://127.0.0.1:$PORT/api.php?action=content_get&id=$IID" | jq -e '(.item.is_favorite|tonumber)==1 and .item.content=="keep"' >/dev/null
          SESSION2=$(curl -fsS -b "$ROOT/c" "http://127.0.0.1:$PORT/api.php?action=session"); jq -e '.site.auth==true'<<<"$SESSION2" >/dev/null; CSRF2=$(jq -r .csrf<<<"$SESSION2")
          LIST=$(curl -fsS -b "$ROOT/c" "http://127.0.0.1:$PORT/scratch-action.php?action=list"); jq -e '.data.open_count==1 and .data.open[0].id==42 and (.data.open[0].content|contains("升级前临时记录"))'<<<"$LIST" >/dev/null
          NEW=$(curl -fsS -b "$ROOT/c" -H 'Content-Type: application/json' -H "X-CSRF-Token: $CSRF2" -d '{}' "http://127.0.0.1:$PORT/scratch-action.php?action=create"); SID=$(jq -r .tab.id<<<"$NEW")
          curl -fsS -b "$ROOT/c" -H 'Content-Type: application/json' -H "X-CSRF-Token: $CSRF2" -d "$(jq -nc --argjson id "$SID" --arg c '升级后临时写入' '{id:$id,content:$c,cursor_pos:7,scroll_top:0}')" "http://127.0.0.1:$PORT/scratch-action.php?action=save" | jq -e '.tab.content=="升级后临时写入"' >/dev/null
          ORG=$(curl -fsS -b "$ROOT/c" -H 'Content-Type: application/json' -H "X-CSRF-Token: $CSRF2" -d "$(jq -nc --argjson id "$SID" --argjson cid "$CID" '{id:$id,title:"V259 Scratch Organized",category_id:$cid,content_mode:"quick"}')" "http://127.0.0.1:$PORT/scratch-action.php?action=organize"); OID=$(jq -r .item_id<<<"$ORG"); test "$OID" -gt 0
          curl -fsS -b "$ROOT/c" "http://127.0.0.1:$PORT/api.php?action=content_get&id=$OID" | jq -e '.item.title=="V259 Scratch Organized" and .item.content=="升级后临时写入"' >/dev/null
          php "$SITE/cli/verify.php" | jq -e '.ok==true and .version=="2.5.9" and .schema_version==2401 and .integrity=="ok" and .foreign_key_errors==0' >/dev/null
          kill "$PID"
          echo EXISTING_DATA_2.5.8_TO_2.5.9=PASS
          echo AUTOMATIC_BACKUP_DATA_FAVORITE_SESSION=PASS
          echo PREEXISTING_SCRATCH_PRESERVED=PASS
          echo POST_UPGRADE_SCRATCH_WRITE_AND_ORGANIZE=PASS

      - name: Publish V2.5.9 Release and remote readback
        working-directory: product
        env:
          GH_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
        run: |
          set -Eeuo pipefail
          if ! gh release view "$TAG" --repo llhzx2018/vf-library >/dev/null 2>&1; then
            gh release create "$TAG" build/formal-a/* --repo llhzx2018/vf-library --target "$PRODUCT_REF" --title "VF Library V2.5.9" --notes-file build/formal-a/VF_Library_V2.5.9_RELEASE_NOTES.md
          else
            gh release upload "$TAG" build/formal-a/* --repo llhzx2018/vf-library --clobber
          fi
          gh release view "$TAG" --repo llhzx2018/vf-library --json databaseId,tagName,isDraft,isPrerelease,publishedAt > "$RUNNER_TEMP/release.json"
          jq -e '.tagName=="v2.5.9" and .isDraft==false and .isPrerelease==false' "$RUNNER_TEMP/release.json" >/dev/null
          mkdir -p "$RUNNER_TEMP/readback"; gh release download "$TAG" --repo llhzx2018/vf-library --pattern "$UPDATE_NAME" --dir "$RUNNER_TEMP/readback"
          BYTES=$(stat -c%s build/formal-a/$UPDATE_NAME); SHA=$(sha256sum build/formal-a/$UPDATE_NAME|awk '{print $1}')
          test "$(stat -c%s "$RUNNER_TEMP/readback/$UPDATE_NAME")" = "$BYTES"
          test "$(sha256sum "$RUNNER_TEMP/readback/$UPDATE_NAME"|awk '{print $1}')" = "$SHA"
          TAGSHA=$(gh api repos/llhzx2018/vf-library/git/ref/tags/v2.5.9 --jq .object.sha); test "$TAGSHA" = "$PRODUCT_REF"
          echo "RELEASE_ID=$(jq -r .databaseId "$RUNNER_TEMP/release.json")"
          echo "PUBLISHED_AT=$(jq -r .publishedAt "$RUNNER_TEMP/release.json")"
          echo "UPDATE_BYTES=$BYTES"
          echo "UPDATE_SHA256=$SHA"
          echo FORMAL_RELEASE_REMOTE_READBACK=PASS
          echo PRODUCTION_WRITE=NO
