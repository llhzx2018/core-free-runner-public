name: S01 Page Body V1 A5 Candidate Gate

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/s01-page-body-v1-a5-gate-20260926.yml'

permissions:
  contents: read

jobs:
  gate:
    if: github.head_ref == 'task/s01-page-body-v1-a5-gate-20260926'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPS_SHA: 40789c60f16ff6198ead913c906be8d792626497
      THEME_SHA: 4f5a27105f785f2215c1cc675be9bb2d50f5ce38
      M3U8_SHA: c70cff89e4c300a93efefbec7cd1d5e8e94e0a6a
    steps:
      - name: Credential presence
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: test -n "$READ_TOKEN"

      - name: Checkout exact OPS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.OPS_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: ops

      - name: Checkout exact Theme
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: ${{ env.THEME_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: theme

      - name: Checkout exact M3U8
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: ${{ env.M3U8_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: m3u8

      - name: OPS A5 baseline
        working-directory: ops
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$OPS_SHA"
          php -l tests/s01-c02-page-body-system-v1-a5-baseline-contract.php
          php tests/s01-c02-page-body-system-v1-a5-baseline-contract.php

      - name: Theme A5 contract
        working-directory: theme
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$THEME_SHA"
          for f in src/inc/admin/views/brand.php src/inc/admin/views/layout.php src/inc/admin/views/navigation.php src/inc/admin/views/seo.php; do php -l "$f"; done
          php -l tests/s01-c01-page-body-system-v1-a5-contract.php
          php tests/s01-c01-page-body-system-v1-a1-contract.php
          php tests/s01-c01-page-body-system-v1-a2-contract.php
          php tests/s01-c01-page-body-system-v1-a5-contract.php
          grep -Fq 'data-vf-page-archetype="a5"' src/inc/admin/views/brand.php
          grep -Fq 'data-vf-page-archetype="a5"' src/inc/admin/views/layout.php
          grep -Fq 'data-vf-page-archetype="a5"' src/inc/admin/views/navigation.php
          grep -Fq 'data-vf-page-archetype="a5"' src/inc/admin/views/seo.php
          ! grep -Eq '\.vf-v6-shell-header|\.vf-v6-domain-nav|\.vf-theme-maintenance-menu|\.vf-theme-admin-header' src/assets/css/admin/admin-s01-page-body-system-v1.css

      - name: M3U8 A5 contract
        working-directory: m3u8
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$M3U8_SHA"
          php -l src/admin/pages/runtime.php
          php -l tests/s01-c03-page-body-system-v1-a5-contract.php
          php tests/s01-c03-page-body-system-v1-a1-contract.php
          php tests/s01-c03-page-body-system-v1-a2-contract.php
          php tests/s01-c03-page-body-system-v1-a3-contract.php
          php tests/s01-c03-page-body-system-v1-a4-contract.php
          php tests/s01-c03-page-body-system-v1-a5-contract.php
          grep -Fq 'data-vf-page-archetype="a5"' src/admin/pages/runtime.php
          ! grep -Eq '\.vf-v6-shell-header|\.vf-v6-domain-nav|\.vf-v6-domain-menu|\.vf-m3u8-console-head|\.vf-m3u8-primary-nav' src/admin/ui-v4/admin-s01-page-body-system-v1.css

      - name: CSS balance
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for path in [
              Path('theme/src/assets/css/admin/admin-s01-page-body-system-v1.css'),
              Path('m3u8/src/admin/ui-v4/admin-s01-page-body-system-v1.css'),
          ]:
              c=path.read_text()
              assert c.count('{')==c.count('}'), path
          print('PASS_CSS_BALANCE')
          PY
