name: TEMP P01 V2.47.283 Core Updates Proof
on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/temp-p01-v247283-core-updates.yml"]
permissions:
  contents: read
jobs:
  proof:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'proof(P01): V2.47.283 core-updates')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli jq >/dev/null
      - name: Exact candidate clone
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/core-updates.git" candidate
          git -C candidate fetch -q origin f94ba4d414f222d7614940945eae044c2f7f4699
          git -C candidate checkout -q --detach f94ba4d414f222d7614940945eae044c2f7f4699
          echo CORE_UPDATES_EXACT_SOURCE=PASS
      - name: Canonical PHP/manifest validation
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 scripts/check_manifest_contract.py
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find update-core/php -type f -name '*.php' -print0)
          php update-core/php/tests/run.php
          echo CORE_UPDATES_CANONICAL_EQUIVALENT=PASS
      - name: P01 manifest identity + bounded one-file delta
        run: |
          set -Eeuo pipefail
          cd candidate
          jq -e '
            .current_version=="2.47.282" and
            .target_version=="2.47.283" and
            .from_versions==["2.47.282"] and
            .release_id==406422561 and
            .product_identity=="ec56dbdf85cd749addfb89b93515bbd704228326" and
            .asset_name=="VF_Start_V2.47.283_UPDATE.zip" and
            .asset_bytes==2362354 and
            .asset_sha256=="0cced4593eb981bd797955113f469669628b42cab8651f22606943237b75a306" and
            (.notes|contains("平级操作组")) and
            (.notes|contains("嵌套折叠"))
          ' projects/P01.json >/dev/null
          git fetch -q origin main
          mapfile -t changed < <(git diff --name-only origin/main...HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "projects/P01.json"
          echo P01_V247283_MANIFEST_IDENTITY=PASS
          echo CORE_UPDATES_BOUNDED_DELTA=PASS
          echo PRODUCTION_WRITE=NO
