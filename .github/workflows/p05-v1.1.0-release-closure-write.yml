name: P05 V1.1.0 Release Closure Write

on:
  push:
    branches:
      - verify/p05-v1.1.0-release-source-20260830
    paths:
      - '.github/workflows/p05-v1.1.0-release-closure-write.yml'

permissions:
  contents: read

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      P05_BRANCH: governance/p05-v1.1.0-release-closure-20260830
      P05_RELEASE_SOURCE: e3455704cf5fc7254b86fbe84cc3941f585a15ac
      P05_RELEASE_TREE: 46b4fca0b04ecae1653ca9d75228c3b949c5267c
      RELEASE_ID: '379062020'
      FULL_ASSET_ID: '535551195'
      RECEIPT_ASSET_ID: '535551196'
      FULL_ASSET_SHA256: 86d889030ba4029f5b4d7cc4b2de352233d2c81b569765b58b36573f0941c3d6
      FULL_ASSET_BYTES: '190082'
      CORE_UPDATES_COMMIT: 294b8b4bb2ee79bfab5bf01478ad6b8448b457c9
      RELEASE_RUN: '33267281577'
      RELEASE_JOB: '99139478877'
      MAIN_GATE_RUN: '33267042400'
      MAIN_GATE_JOB: '99138826274'
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Verify release write token
        run: test -n "$WRITE_TOKEN" || exit 78
      - name: Checkout P05 closure branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.P05_BRANCH }}
          token: ${{ env.WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
          path: p05
      - name: Apply formal release closure
        working-directory: p05
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$P05_RELEASE_SOURCE"
          python3 - <<'PY'
          import json, os, pathlib
          root=pathlib.Path('.')
          release_source=os.environ['P05_RELEASE_SOURCE']
          release_tree=os.environ['P05_RELEASE_TREE']
          release_id=int(os.environ['RELEASE_ID'])
          asset_id=int(os.environ['FULL_ASSET_ID'])
          receipt_asset_id=int(os.environ['RECEIPT_ASSET_ID'])
          asset_sha=os.environ['FULL_ASSET_SHA256']
          asset_bytes=int(os.environ['FULL_ASSET_BYTES'])
          core_updates=os.environ['CORE_UPDATES_COMMIT']
          release_run=int(os.environ['RELEASE_RUN'])
          release_job=int(os.environ['RELEASE_JOB'])
          main_gate_run=int(os.environ['MAIN_GATE_RUN'])
          main_gate_job=int(os.environ['MAIN_GATE_JOB'])

          readme=(root/'README.md').read_text(encoding='utf-8')
          old='''Product: P05 · VF SEO\nCurrent Formal Release: v1.0.2\nCurrent Formal Release Candidate: v1.1.0 · PHP-first Runtime\nRepository VERSION: 1.1.0 · RELEASE SOURCE / NOT YET TAGGED\nLogical Schema: VF-SEO-SCHEMA@1 / 1\nDefault Database: SQLite\nProduction Deployment: NOT DEPLOYED\nPHP Runtime Compatibility: RELEASE SOURCE / MACHINE GATE PENDING / NOT YET RELEASED / NOT PRODUCTION'''
          new='''Product: P05 · VF SEO\nCurrent Formal Release: v1.1.0 · PHP-first Runtime\nRepository VERSION: 1.1.0 · RELEASED / DEPLOYMENT_READY\nFormal Release Source: e3455704cf5fc7254b86fbe84cc3941f585a15ac\nLogical Schema: VF-SEO-SCHEMA@1 / 1\nDefault Database: SQLite\nProduction Deployment: NOT DEPLOYED\nPHP Runtime Compatibility: RELEASED / DEPLOYMENT_READY / NOT PRODUCTION'''
          if old not in readme: raise SystemExit('README_CURRENT_TRUTH_PATTERN_MISSING')
          readme=readme.replace(old,new,1)
          oldp='Formal Release 与 Production Deployment 是不同 Gate。当前仓库已经进入 `v1.1.0` Release Source：版本元数据可以是 `1.1.0`，但在该 Exact Source 完成 Machine PASS 且 Owner 明确批准 Tag / GitHub Release 前，Current Formal Release 仍然是 `v1.0.2`。'
          newp='Formal Release 与 Production Deployment 是不同 Gate。`v1.1.0` 已完成 Exact Main Machine PASS、Tag、GitHub Release、正式 FULL 资产发布与 `core-updates` Manifest 收口；Production 仍为 `NOT_DEPLOYED`，不得把 Release PASS 冒充线上 Runtime PASS。'
          if oldp not in readme: raise SystemExit('README_RELEASE_PARAGRAPH_MISSING')
          readme=readme.replace(oldp,newp,1)
          oldb='''- `1.1.0` Release Source 必须绑定 Exact Source Machine Gate，不能把版本号修改本身冒充 Formal Release。\n- Tag `v1.1.0` / GitHub Release / Production Deployment 均是后续独立 Owner Gate。\n- 当前 Release Source Gate 不自动创建 Tag、GitHub Release，也不修改 Production。'''
          newb='''- Formal Release `v1.1.0` 已绑定 Exact Main `e3455704cf5fc7254b86fbe84cc3941f585a15ac` 与 Machine PASS。\n- Tag `v1.1.0` 与 GitHub Release 已完成；正式资产为 `VF_SEO_V1.1.0_FULL.zip`。\n- `core-updates/projects/P05.json` 已指向 `v1.1.0`，保持 `FULL_ONLY` / `from_versions=[]`，不声明 V1.0.2 → V1.1.0 Atomic 在线升级。\n- Production Deployment 仍是后续独立 Owner Gate；当前不修改 Production。'''
          if oldb not in readme: raise SystemExit('README_BOUNDARY_PATTERN_MISSING')
          readme=readme.replace(oldb,newb,1)
          marker='- [V1.1.0 Release Source](docs/release/V1.1.0_RELEASE_SOURCE.md)\n'
          if marker in readme and 'RELEASE_V1.1.0_CURRENT' not in readme:
              readme=readme.replace(marker,marker+'- [V1.1.0 Current Release Authority](docs/authority/RELEASE_V1.1.0_CURRENT.md)\n',1)
          (root/'README.md').write_text(readme,encoding='utf-8')

          changelog=(root/'CHANGELOG.md').read_text(encoding='utf-8')
          changelog=changelog.replace('## 1.1.0 · PHP-first Runtime（Release Source · 2026-08-30）','## 1.1.0 · PHP-first Runtime（正式发布 · 2026-08-30）',1)
          oldc='- Release Source 已切换为 `1.1.0`；Tag / GitHub Release 尚未执行，必须先取得该 Exact Source 的完整 Machine PASS。'
          newc='- Formal Publication：`v1.1.0` / Release `379062020` / `VF_SEO_V1.1.0_FULL.zip` / 32 files / 190082 bytes / SHA-256 `86d889030ba4029f5b4d7cc4b2de352233d2c81b569765b58b36573f0941c3d6`。\n- Exact Main `e3455704cf5fc7254b86fbe84cc3941f585a15ac` 已通过 Public Runner Run `33267042400` / Job `99138826274` 全链 Machine PASS。\n- `core-updates/projects/P05.json` 已晋级 `v1.1.0`，Distribution 继续 `FULL_ONLY` / `from_versions=[]`，不声明 V1.0.2 → V1.1.0 Atomic 在线升级。'
          if oldc not in changelog: raise SystemExit('CHANGELOG_RELEASE_PATTERN_MISSING')
          changelog=changelog.replace(oldc,newc,1)
          (root/'CHANGELOG.md').write_text(changelog,encoding='utf-8')

          release_readme='''# P05 Release Documentation\n\nCurrent formal release: `v1.1.0` · PHP-first Runtime.\n\nFormal publication truth:\n\n- Release source: `e3455704cf5fc7254b86fbe84cc3941f585a15ac`\n- Release tree: `46b4fca0b04ecae1653ca9d75228c3b949c5267c`\n- GitHub Release ID: `379062020`\n- Formal FULL: `VF_SEO_V1.1.0_FULL.zip`\n- FULL: `32 files / 190082 bytes`\n- SHA-256: `86d889030ba4029f5b4d7cc4b2de352233d2c81b569765b58b36573f0941c3d6`\n- Exact Main Machine: Run `33267042400` / Job `99138826274` = PASS\n- Distribution: `FULL_ONLY` / `from_versions=[]`\n- Production: `NOT_DEPLOYED`\n\nV1.1.0 release documents:\n\n- `V1.1.0_PHP_RELEASE_READINESS.md` — package/readiness contract and pre-release evidence.\n- `V1.1.0_PHP_RELEASE_GATE_CHECKLIST.md` — release gate sequence.\n- `V1.1.0_RELEASE_SOURCE.md` — release-source preparation evidence.\n- `../authority/RELEASE_V1.1.0_CURRENT.md` — current formal release authority.\n\nRelease Source, Formal Release, Distribution Manifest, and Production Deployment remain separate truth layers. Formal Release and Distribution are closed at V1.1.0; Production remains a later Owner gate.\n'''
          (root/'docs/release/README.md').write_text(release_readme,encoding='utf-8')

          p=json.loads((root/'VF_PROJECT.json').read_text(encoding='utf-8'))
          p.update({
            'status':'V1.1.0_RELEASED / DEPLOYMENT_READY / PRODUCTION_NOT_DEPLOYED',
            'version':'1.1.0','target_version':'1.1.0','working_version':'1.1.0','version_change':False,
            'formal_release':'v1.1.0','formal_release_state':'RELEASED_CURRENT',
            'formal_release_candidate_commit':release_source,'formal_release_candidate_tree':release_tree,
            'formal_release_asset':'VF_SEO_V1.1.0_FULL.zip','formal_release_asset_files':32,
            'formal_release_asset_bytes':asset_bytes,'formal_release_asset_sha256':asset_sha,
            'formal_release_id':release_id,'formal_release_asset_id':asset_id,
            'next_action':'P05 V1.1.0 RELEASE CLOSED; CORE-UPDATES MANIFEST CURRENT; PRODUCTION REMAINS NOT_DEPLOYED'
          })
          p['php_first_runtime_v1_1_0']={
            'state':'RELEASED_DEPLOYMENT_READY','web_runtime':'PHP_8.2_PLUS_PDO_SQLITE_SQLITE',
            'cloudpanel_target':'PHP_SITE_PHP_FPM','node_role':'OPTIONAL_WORKER_ADVANCED_RUNTIME',
            'release_source':release_source,'release_tree':release_tree,'schema':'VF-SEO-SCHEMA@1 / 1',
            'formal_release_id':release_id,'formal_full_asset_id':asset_id,'formal_receipt_asset_id':receipt_asset_id,
            'formal_full_asset':'VF_SEO_V1.1.0_FULL.zip','formal_full_files':32,'formal_full_bytes':asset_bytes,
            'formal_full_sha256':asset_sha,'distribution_mode':'FULL_ONLY','from_versions':[],
            'main_machine_run':main_gate_run,'main_machine_job':main_gate_job,'main_machine_state':'PASS',
            'publication_run':release_run,'publication_job':release_job,'publication_state':'PASS',
            'core_updates_commit':core_updates,'production_state':'NOT_DEPLOYED'
          }
          p['release_publication']={
            'state':'PASS_V1.1.0_CURRENT','repository':'llhzx2018/core-free-runner-public',
            'workflow':'.github/workflows/p05-v1.1.0-publish-release.yml','run':release_run,'job':release_job,
            'release_id':release_id,'tag':'v1.1.0','tag_source':release_source,'tag_tree':release_tree,
            'full_asset_id':asset_id,'receipt_asset_id':receipt_asset_id,'full_asset_sha256':asset_sha,
            'distribution':'core-updates/projects/P05.json','distribution_commit':core_updates,
            'distribution_mode':'FULL_ONLY','from_versions':[],'production_state':'NOT_DEPLOYED',
            'known_non_release_blocker':'PRODUCTION_RUNTIME_NOT_DEPLOYED'
          }
          p['deployment_readiness']={
            'state':'PASS_V1.1.0_RELEASED','production_state':'NOT_DEPLOYED',
            'production_verification':'NOT_APPLICABLE_UNTIL_FIRST_DEPLOYMENT','exact_source':release_source,
            'product_tree':release_tree,'schema':1,'common_product_baseline':'VF-COMMON-PRODUCT-BASELINE@2.0',
            'regression_evidence':{'repository':'llhzx2018/core-free-runner-public','run':main_gate_run,'job':main_gate_job,'state':'PASS'},
            'php_runtime_evidence':{'state':'PASS','php_minimum':'8.2','pdo_sqlite':'PASS','sqlite_migration':'PASS','admin_bootstrap':'PASS','http_owner_smoke':'PASS','release_package_gate':'PASS'},
            'full_asset':{'name':'VF_SEO_V1.1.0_FULL.zip','files':32,'bytes':asset_bytes,'sha256':asset_sha},
            'update_asset':{'state':'NOT_PUBLISHED_FULL_ONLY'}
          }
          p['authority']['release']='docs/authority/RELEASE_V1.1.0_CURRENT.md'
          (root/'VF_PROJECT.json').write_text(json.dumps(p,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          authority=f'''# P05 · VF SEO · V1.1.0 Current Release Authority\n\n## Release\n\n- Formal Release: `v1.1.0`\n- State: `RELEASED / DEPLOYMENT_READY / PRODUCTION_NOT_DEPLOYED`\n- Published At: `2026-08-29T18:04:44Z`\n- GitHub Release ID: `{release_id}`\n\n## Product Source\n\n- Exact Main Source: `{release_source}`\n- Product Tree: `{release_tree}`\n- VERSION: `1.1.0`\n- Schema: `VF-SEO-SCHEMA@1 / 1`\n\nThe formal tag `v1.1.0` resolves to the exact source above. The merge commit tree is byte-identical to the final verified release-source tree.\n\n## Runtime Contract\n\n- Preferred Web Runtime: `CloudPanel + PHP 8.2+ + PDO_SQLite + SQLite`\n- React/Vite client: prebuilt in the formal FULL asset\n- Production Web server requires Node/PM2: `NO`\n- Node 24 role: `OPTIONAL WORKER / ADVANCED COMPATIBILITY RUNTIME`\n- PostgreSQL: `ADVANCED / OPTIONAL / COMPATIBILITY`\n- Production Deployment: `NOT_DEPLOYED`\n\n## Distribution\n\n- Mode: `FULL_ONLY`\n- `from_versions=[]`\n- Atomic V1.0.2 → V1.1.0 update claimed: `NO`\n- core-updates main commit: `{core_updates}`\n- Manifest: `core-updates/projects/P05.json`\n\n## Formal Asset\n\n- FULL: `VF_SEO_V1.1.0_FULL.zip`\n- Release Asset ID: `{asset_id}`\n- Files: `32`\n- Bytes: `{asset_bytes}`\n- SHA-256: `{asset_sha}`\n- Release Receipt Asset ID: `{receipt_asset_id}`\n\n## Machine Evidence\n\n### Exact Main Release Gate\n\n- Repository: `llhzx2018/core-free-runner-public`\n- Run: `{main_gate_run}`\n- Job: `{main_gate_job}`\n- Result: `PASS`\n\nSame-source evidence includes `npm ci`, Release Source Gate, lint, typecheck, SQLite migration/schema, Unit/Contract/Integration regression, Node/React build, PHP syntax/security interop/migration/admin bootstrap/HTTP smoke, PHP Release Package Gate, Source/Scope/Dependency/Security gates, `npm audit` with 0 vulnerabilities, and repository cleanliness.\n\n### Publication Gate\n\n- Repository: `llhzx2018/core-free-runner-public`\n- Run: `{release_run}`\n- Job: `{release_job}`\n- Result: `PASS`\n- Remote Tag/Release/Assets readback: `PASS`\n\n### Distribution Manifest Gate\n\n- Public Runner Run: `33267392792`\n- Job: `99139784258`\n- Result: `PASS`\n- Release identity / asset digest / FULL_ONLY contract remote readback: `PASS`\n\n## Release Boundary\n\nThis release closes source, formal publication, and update-distribution truth for V1.1.0. It does **not** claim a live Production deployment. `production_version` remains `null`; Production activation and runtime acceptance require a separate Owner-authorized gate.\n\n## Closure\n\n`P05 V1.1.0 RELEASE = PASS / CLOSED`\n\n`P05 Production = NOT_DEPLOYED`\n'''
          (root/'docs/authority/RELEASE_V1.1.0_CURRENT.md').write_text(authority,encoding='utf-8')
          PY
          python3 -m json.tool VF_PROJECT.json >/dev/null
          grep -F 'Current Formal Release: v1.1.0' README.md
          grep -F '## 1.1.0 · PHP-first Runtime（正式发布 · 2026-08-30）' CHANGELOG.md
          grep -F 'P05 V1.1.0 RELEASE = PASS / CLOSED' docs/authority/RELEASE_V1.1.0_CURRENT.md
          git diff --check
      - name: Commit closure to P05 branch
        working-directory: p05
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add README.md CHANGELOG.md VF_PROJECT.json docs/release/README.md docs/authority/RELEASE_V1.1.0_CURRENT.md
          test -n "$(git status --porcelain)"
          git commit -m 'governance(P05): close V1.1.0 formal release'
          git push origin HEAD:$P05_BRANCH
          echo P05_V110_RELEASE_CLOSURE_WRITE=PASS
