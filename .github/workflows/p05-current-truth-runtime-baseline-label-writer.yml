name: P05 Current Truth Runtime Baseline Label Writer

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p05-current-truth-runtime-baseline-label-writer.yml'

permissions:
  contents: read

jobs:
  write-label-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      P05_BASE: ad87db29a77544671c3e989240f3221e9db322e6
      P05_BASE_TREE: 25c7d03d9930cc129dc3ad7723df792f62064e21
      P05_BRANCH: docs/p05-current-truth-runtime-baseline-label-20260902
    steps:
      - name: Checkout exact private P05 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: docs/p05-current-truth-runtime-baseline-label-20260902
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact base
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_BASE"
          test "$(git rev-parse HEAD^{tree})" = "$P05_BASE_TREE"
          test "$(cat VERSION)" = '1.2.2'
          node -e "const p=require('./package.json'); if(p.version!=='1.2.2') process.exit(1)"

      - name: Correct self-referential main labels
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          RUNTIME_SHA='5f1deb37a7f8b3828bd9617b6a0a14f045a3e096'
          RUNTIME_TREE='a467ab0a90656312bd297dfd5ecb51da396990b6'

          p=Path('VF_PROJECT.json')
          data=json.loads(p.read_text())
          old_sha=data.pop('post_release_main_commit', None)
          old_tree=data.pop('post_release_main_tree', None)
          assert old_sha == RUNTIME_SHA
          assert old_tree == RUNTIME_TREE
          data['post_release_runtime_baseline_commit']=RUNTIME_SHA
          data['post_release_runtime_baseline_tree']=RUNTIME_TREE
          data['repository_main_authority']='GITHUB_LIVE_MAIN_REF / MOVING_REF_NOT_SHA_PINNED_IN_CURRENT_TRUTH'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          p=Path('README.md')
          s=p.read_text()
          replacements={
            '## Post-release Working Main（未发布）':'## Post-release Runtime Baseline（未发布）',
            'Current main: '+RUNTIME_SHA:'Runtime code baseline commit: '+RUNTIME_SHA,
            'Current main tree: '+RUNTIME_TREE:'Runtime code baseline tree: '+RUNTIME_TREE,
            '当前 `main` 已领先正式 `v1.2.2` Release，但这不等于 Production 已部署这些 post-release 代码。':'当前仓库 `main` 已包含这些 post-release runtime fixes，但正式 Release 与 Production 仍是 `v1.2.2`；Runtime Baseline SHA 只绑定 #138/#139 后的代码树，不冒充会继续移动的 GitHub `main` SHA。'
          }
          for a,b in replacements.items():
            assert a in s, a
            s=s.replace(a,b,1)
          p.write_text(s)

          p=Path('CHANGELOG.md')
          s=p.read_text()
          old=f'post-release `main={RUNTIME_SHA}` / tree `{RUNTIME_TREE}`'
          new=f'post-release runtime baseline `{RUNTIME_SHA}` / tree `{RUNTIME_TREE}`'
          assert old in s
          p.write_text(s.replace(old,new,1))

          p=Path('docs/handoff/CURRENT_STATE.md')
          s=p.read_text()
          replacements={
            'Current Working Main: '+RUNTIME_SHA:'Post-release Runtime Baseline Commit: '+RUNTIME_SHA,
            'Current Working Tree: '+RUNTIME_TREE:'Post-release Runtime Baseline Tree: '+RUNTIME_TREE,
            'Working Main vs Formal Release: AHEAD / POST-RELEASE L2 FIXES':'Repository Main vs Formal Release: AHEAD / POST-RELEASE L2 FIXES\nRepository Main Authority: GitHub live `main` moving ref; SHA intentionally not pinned here'
          }
          for a,b in replacements.items():
            assert a in s, a
            s=s.replace(a,b,1)
          p.write_text(s)
          PY

          python3 - <<'PY'
          import json
          p=json.load(open('VF_PROJECT.json'))
          assert 'post_release_main_commit' not in p
          assert 'post_release_main_tree' not in p
          assert p['post_release_runtime_baseline_commit']=='5f1deb37a7f8b3828bd9617b6a0a14f045a3e096'
          assert p['post_release_runtime_baseline_tree']=='a467ab0a90656312bd297dfd5ecb51da396990b6'
          assert p['version']=='1.2.2' and p['production_version']=='1.2.2' and p['formal_release']=='v1.2.2'
          assert p['post_v1_2_2_update_service']['release_authorization']=='PENDING_OWNER'
          PY
          test "$(git diff --name-only | sort | tr '\n' ' ')" = 'CHANGELOG.md README.md VF_PROJECT.json docs/handoff/CURRENT_STATE.md '
          git diff --check

      - name: Commit and push exact correction
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add CHANGELOG.md README.md VF_PROJECT.json docs/handoff/CURRENT_STATE.md
          git commit -m 'docs(P05): label post-release runtime baseline precisely'
          git push origin "HEAD:${P05_BRANCH}"
          echo "P05_RUNTIME_BASELINE_LABEL_SHA=$(git rev-parse HEAD)"
          echo "P05_RUNTIME_BASELINE_LABEL_TREE=$(git rev-parse HEAD^{tree})"
          echo P05_RUNTIME_BASELINE_LABEL_WRITER=PASS
          echo P05_RELEASE_WRITE=0
          echo P05_PRODUCTION_WRITE=0
