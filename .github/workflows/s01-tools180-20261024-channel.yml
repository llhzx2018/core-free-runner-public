name: S01 exact Theme channel contract
on:
  push:
    branches: [task/s01-tools180-20261024]
    paths: ['.github/workflows/s01-tools180-20261024-channel.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.180
  TARGET_SHA: 3c227bcf8cfed885ac1cb290a250eda91fcf1445
  UPDATE_SHA: c64342e76b187aca53e43bf096ed496d8e3aafbd
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: c64342e76b187aca53e43bf096ed496d8e3aafbd
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Exact changed manifest and native protocol tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PYCHANNEL'
          import json,os
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']==os.environ['TARGET_VERSION']
          assert m['asset_sha256']=='39bd2d187f51e8c2c0a9e140e02fa7bcad6fc555f635ff84699fc6c4b280db85' and m['asset_bytes']==1983466
          assert m['runtime_files']==476 and '1.35.179' in m['from_versions']
          assert m['release_tag']=='v'+os.environ['TARGET_VERSION']
          print('EXACT_CHANNEL_CONTRACT_PASS')
          PYCHANNEL
      - name: Cleanup
        if: always()
        run: rm -rf source
