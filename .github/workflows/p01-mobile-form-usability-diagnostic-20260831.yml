name: P01 Browser Helper Token Hit Test
on:
  push:
    branches: [diag/p01-mobile-form-usability-20260831]
    paths: [.github/workflows/p01-mobile-form-usability-diagnostic-20260831.yml]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SOURCE: 7a9e9fd3e2505e85d7aa5781da8b23db7d961a9f
      ROOT: ${{ github.workspace }}/product/src
      EVID: /tmp/p01-helper-hit/evidence
      PORT: '18493'
      ADMIN_PASS: P01HelperHitTest
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - name: Checkout exact Product Source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Fresh setup
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-helper-hit; mkdir -p "$EVID"
          test "$(git -C product rev-parse HEAD)" = "$SOURCE"
          test -z "$(git -C product status --porcelain)"
          php -S 127.0.0.1:$PORT -t "$ROOT" >"$EVID/server.log" 2>&1 & echo $! >/tmp/p01-helper-hit.pid
          COOKIE=/tmp/p01-helper-hit.cookies
          for i in $(seq 1 60); do curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:$PORT/setup.php" -o "$EVID/setup.html" && break; sleep .25; done
          CSRF=$(python3 - "$EVID/setup.html" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:$PORT/setup.php" --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=P01 Helper Hit Test' --data-urlencode "admin_password=$ADMIN_PASS" --data-urlencode "admin_password_confirm=$ADMIN_PASS" -o "$EVID/setup-post.html"
      - name: Chromium 390 token pointer and DOM diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-helper-hit/pw; cd /tmp/p01-helper-hit/pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat >diag.cjs <<'JS'
          const {chromium}=require('playwright');const fs=require('fs');
          const base='http://127.0.0.1:18493/';const A=(v,m)=>{if(!v)throw Error(m)};
          (async()=>{
            const b=await chromium.launch({headless:true});const c=await b.newContext({viewport:{width:390,height:844}});
            const lr=await c.request.post(base+'api.php?action=login',{data:{password:'P01HelperHitTest'}});A(lr.ok(),'login status');A((await lr.json()).ok,'login payload');
            const p=await c.newPage();await p.goto(base+'browser-helper.php',{waitUntil:'domcontentloaded'});
            A(await p.evaluate(()=>document.documentElement.scrollWidth===document.documentElement.clientWidth),'initial overflow');
            await p.locator('#generateHelperToken').click();const dlg=p.locator('#helperTokenDialog');await dlg.waitFor({state:'visible'});
            const token=await p.locator('#newHelperToken').inputValue();A(token.length>=20,'token too short');
            const btn=p.locator('[data-copy-token]');await btn.scrollIntoViewIfNeeded();
            const geom=await btn.evaluate(e=>{const r=e.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,h=document.elementFromPoint(x,y),s=getComputedStyle(e);return{rect:{left:r.left,top:r.top,right:r.right,bottom:r.bottom,width:r.width,height:r.height},center:{x,y},hit:{tag:h&&h.tagName,id:h&&h.id,cls:h&&h.className,same:h===e,contained:!!(h&&e.contains(h))},style:{display:s.display,visibility:s.visibility,opacity:s.opacity,pointerEvents:s.pointerEvents,zIndex:s.zIndex},overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}});
            A(geom.rect.height>=40,'copy target too short');A(geom.overflow===0,'dialog overflow');A(geom.hit.same||geom.hit.contained,'copy center intercepted '+JSON.stringify(geom.hit));
            let trial='PASS';try{await btn.click({trial:true,timeout:5000})}catch(e){trial='FAIL '+e.message}
            const patch=await p.evaluate(()=>{try{const clip=navigator.clipboard||{};Object.defineProperty(clip,'writeText',{configurable:true,value:t=>{globalThis.__vfClip=String(t);return Promise.resolve()}});Object.defineProperty(clip,'readText',{configurable:true,value:()=>Promise.resolve(globalThis.__vfClip||'')});if(!navigator.clipboard)Object.defineProperty(navigator,'clipboard',{configurable:true,value:clip});return{ok:true,write:String(navigator.clipboard.writeText).slice(0,100)}}catch(e){return{ok:false,error:String(e)}}});A(patch.ok,'clipboard patch failed '+JSON.stringify(patch));
            let pointer='PASS',pointerCopied=false;try{await btn.click({timeout:5000});pointerCopied=await p.locator('[data-token-done]').isEnabled()}catch(e){pointer='FAIL '+e.message;pointerCopied=await p.locator('[data-token-done]').isEnabled()}
            let dom='NOT_NEEDED';if(!pointerCopied){dom='PASS';try{await btn.evaluate(e=>e.click());await p.waitForFunction(()=>!document.querySelector('[data-token-done]')?.disabled,null,{timeout:3000})}catch(e){dom='FAIL '+e.message}}
            const final=await p.evaluate(()=>({copied:!document.querySelector('[data-token-done]')?.disabled,state:document.querySelector('#helperTokenCopyState')?.textContent,button:document.querySelector('[data-copy-token]')?.textContent,clip:globalThis.__vfClip||'',overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}));
            A(final.copied,'copy workflow did not complete');A(final.clip===token,'clipboard value mismatch');A(final.overflow===0,'final overflow');
            await p.screenshot({path:process.env.EVID+'/browser-helper-token-390.png',fullPage:true});
            const verdict=(trial==='PASS'&&final.copied)?'PASS_NO_PRODUCT_CHANGE':'FAIL_PRODUCT_REVIEW';const out={source:process.env.SOURCE,viewport:{width:390,height:844},geom,trial,patch,pointer,pointerCopied,dom,final,verdict};fs.writeFileSync(process.env.EVID+'/token-hit-test.json',JSON.stringify(out,null,2));console.log('P01_HELPER_TOKEN_HIT_TEST='+verdict);console.log(JSON.stringify(out));A(verdict==='PASS_NO_PRODUCT_CHANGE','product review required');await c.close();await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          SOURCE="$SOURCE" EVID="$EVID" node diag.cjs | tee "$EVID/browser.txt"
      - name: SQLite integrity and FK
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$ROOT" php <<'PHP' | tee "$EVID/db.txt"
          <?php require getenv('ROOT').'/app/bootstrap.php';$db=vf_db();$i=strtolower((string)$db->query('PRAGMA integrity_check')->fetchColumn());$fk=count($db->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC));echo 'INTEGRITY='.$i."\nFK=".$fk."\n";if($i!=='ok'||$fk!==0)exit(1);
          PHP
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-helper-token-hit-${{ github.run_id }}
          path: ${{ env.EVID }}
          if-no-files-found: error
          retention-days: 30
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/p01-helper-hit.pid 2>/dev/null)" 2>/dev/null || true
