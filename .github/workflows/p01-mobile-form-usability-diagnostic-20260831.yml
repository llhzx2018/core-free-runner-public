name: P01 Mobile Form Usability Diagnostic
on:
  push:
    branches: [diag/p01-mobile-form-usability-20260831]
    paths: [.github/workflows/p01-mobile-form-usability-diagnostic-20260831.yml]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE: 7a9e9fd3e2505e85d7aa5781da8b23db7d961a9f
      ROOT: ${{ github.workspace }}/product/src
      EVID: /tmp/p01-mobile-form-usability/evidence
      PORT: '18493'
      ADMIN_PASS: P01MobileFormUsability
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - name: Checkout exact Product Source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Fresh setup
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-mobile-form-usability; mkdir -p "$EVID"
          test "$(git -C product rev-parse HEAD)" = "$SOURCE"
          test -z "$(git -C product status --porcelain)"
          php -S 127.0.0.1:$PORT -t "$ROOT" >"$EVID/server.log" 2>&1 & echo $! >/tmp/p01-mobile-form-usability.pid
          COOKIE=/tmp/p01-mobile-form-usability.cookies
          for i in $(seq 1 60); do curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:$PORT/setup.php" -o "$EVID/setup.html" && break; sleep .25; done
          CSRF=$(python3 - "$EVID/setup.html" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:$PORT/setup.php" --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=P01 Mobile Form Usability' --data-urlencode "admin_password=$ADMIN_PASS" --data-urlencode "admin_password_confirm=$ADMIN_PASS" -o "$EVID/setup-post.html"
      - name: Chromium 390 real form tasks
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-mobile-form-usability/pw; cd /tmp/p01-mobile-form-usability/pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat >diag.cjs <<'JS'
          const {chromium}=require('playwright');const fs=require('fs');
          const base='http://127.0.0.1:18493/';const assert=(v,m)=>{if(!v)throw Error(m)};
          async function login(c){const r=await c.request.post(base+'api.php?action=login',{data:{password:'P01MobileFormUsability'}});assert(r.ok(),'login status');const j=await r.json();assert(j.ok,'login payload');}
          async function auditControls(p,selector){return await p.locator(selector).evaluateAll(es=>es.filter(e=>e.offsetWidth||e.offsetHeight).map(e=>{const r=e.getBoundingClientRect();return{tag:e.tagName.toLowerCase(),type:e.type||'',name:e.name||'',id:e.id||'',width:+r.width.toFixed(1),height:+r.height.toFixed(1),left:+r.left.toFixed(1),right:+r.right.toFixed(1),top:+r.top.toFixed(1),bottom:+r.bottom.toFixed(1)}}));}
          async function assertViewportSafe(p,label){const d=await p.evaluate(()=>({overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,vw:document.documentElement.clientWidth}));assert(d.overflow===0,label+' horizontal overflow '+d.overflow);return d;}
          async function focusAndCheck(p,loc,label){await loc.scrollIntoViewIfNeeded();await loc.focus();await p.waitForTimeout(80);const d=await loc.evaluate(e=>{const r=e.getBoundingClientRect();return{active:document.activeElement===e,left:r.left,right:r.right,width:r.width,height:r.height,viewport:document.documentElement.clientWidth,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}});assert(d.active,label+' did not focus');assert(d.left>=-0.5&&d.right<=d.viewport+0.5,label+' clipped after focus');assert(d.overflow===0,label+' created overflow');return d;}
          (async()=>{const b=await chromium.launch({headless:true});const c=await b.newContext({viewport:{width:390,height:844}});await c.addInitScript(()=>{Object.defineProperty(navigator,'clipboard',{configurable:true,value:{writeText:async t=>{globalThis.__vfClipboard=String(t)},readText:async()=>globalThis.__vfClipboard||''}})});await login(c);const out={source:process.env.SOURCE,viewport:{width:390,height:844},settings:{},backup:{},helper:{}};
            let p=await c.newPage();await p.goto(base+'settings.php',{waitUntil:'domcontentloaded'});await p.waitForFunction(()=>document.querySelector('#settingsRoot')?.getAttribute('aria-busy')==='false');await assertViewportSafe(p,'settings initial');
            const settingsControls=await auditControls(p,'#settingsForm input:not([type=file]),#settingsForm select,#settingsForm textarea');assert(settingsControls.length>=15,'settings controls missing');for(const x of settingsControls){assert(x.left>=-0.5&&x.right<=390.5,'settings control clipped '+JSON.stringify(x));assert(x.width>=16&&x.height>=16,'settings control zero-size '+JSON.stringify(x));}
            out.settings.siteTitleFocus=await focusAndCheck(p,p.locator('[name="siteTitle"]'),'settings siteTitle');out.settings.pageSizeFocus=await focusAndCheck(p,p.locator('[name="pageSize"]'),'settings pageSize');await p.locator('[name="siteTitle"]').fill('P01 Mobile Form Saved');await p.locator('[name="pageSize"]').selectOption('30');await p.locator('#saveSettings').click();await p.waitForFunction(()=>document.querySelector('#settingsState')?.textContent.includes('设置已保存'));await p.reload({waitUntil:'domcontentloaded'});await p.waitForFunction(()=>document.querySelector('#settingsRoot')?.getAttribute('aria-busy')==='false');assert(await p.locator('[name="siteTitle"]').inputValue()==='P01 Mobile Form Saved','settings title did not persist');assert(await p.locator('[name="pageSize"]').inputValue()==='30','settings page size did not persist');await assertViewportSafe(p,'settings after reload');out.settings.controls=settingsControls;out.settings.roundTrip='PASS';await p.screenshot({path:process.env.EVID+'/settings-form-390.png',fullPage:true});await p.close();
            p=await c.newPage();await p.goto(base+'data-safety.php',{waitUntil:'domcontentloaded'});await p.waitForFunction(()=>!document.querySelector('#backupPolicyStatus')?.textContent.includes('加载中'));await assertViewportSafe(p,'backup initial');const backupControls=await auditControls(p,'#backupPolicy input:not([type=file])');for(const x of backupControls){assert(x.left>=-0.5&&x.right<=390.5,'backup control clipped '+JSON.stringify(x));assert(x.width>=16&&x.height>=16,'backup control zero-size '+JSON.stringify(x));}
            out.backup.intervalFocus=await focusAndCheck(p,p.locator('#autoBackupInterval'),'backup interval');out.backup.retentionFocus=await focusAndCheck(p,p.locator('#backupRetentionDays'),'backup retention');out.backup.keepFocus=await focusAndCheck(p,p.locator('#backupKeepRecent'),'backup keep');await p.locator('#autoBackupInterval').fill('48');await p.locator('#backupRetentionDays').fill('45');await p.locator('#backupKeepRecent').fill('12');await p.locator('#saveBackupPolicy').click();await p.waitForFunction(()=>document.querySelector('#backupPolicyStatus')?.textContent.includes('每 48 小时')&&document.querySelector('#backupPolicyStatus')?.textContent.includes('保留 45 天')&&document.querySelector('#backupPolicyStatus')?.textContent.includes('至少 12 份'));await p.reload({waitUntil:'domcontentloaded'});await p.waitForFunction(()=>document.querySelector('#autoBackupInterval')?.value==='48');assert(await p.locator('#backupRetentionDays').inputValue()==='45','backup retention did not persist');assert(await p.locator('#backupKeepRecent').inputValue()==='12','backup keep did not persist');await assertViewportSafe(p,'backup after reload');out.backup.controls=backupControls;out.backup.roundTrip='PASS';await p.screenshot({path:process.env.EVID+'/backup-form-390.png',fullPage:true});await p.close();
            p=await c.newPage();await p.goto(base+'browser-helper.php',{waitUntil:'domcontentloaded'});await assertViewportSafe(p,'helper initial');const helperControls=await auditControls(p,'#helperSiteUrl,#generateHelperToken,.vf-browser-helper-actions .btn');for(const x of helperControls){assert(x.left>=-0.5&&x.right<=390.5,'helper control clipped '+JSON.stringify(x));}
            out.helper.siteFocus=await focusAndCheck(p,p.locator('#helperSiteUrl'),'helper site URL');await p.locator('[data-copy="#helperSiteUrl"]').click();await p.waitForTimeout(80);const clipSite=await p.evaluate(()=>navigator.clipboard.readText());assert(clipSite===await p.locator('#helperSiteUrl').inputValue(),'site URL clipboard mismatch');await p.locator('#generateHelperToken').click();await p.locator('#helperTokenDialog').waitFor({state:'visible'});const token=await p.locator('#newHelperToken').inputValue();assert(token.length>=20,'generated token unexpectedly short');await assertViewportSafe(p,'helper token dialog');out.helper.tokenFocus=await focusAndCheck(p,p.locator('#newHelperToken'),'helper token');await p.locator('[data-copy-token]').click();await p.waitForFunction(()=>!document.querySelector('[data-token-done]')?.disabled);const clipToken=await p.evaluate(()=>navigator.clipboard.readText());assert(clipToken===token,'token clipboard mismatch');await p.locator('[data-token-done]').click();await p.waitForFunction(()=>!document.querySelector('#helperTokenDialog')?.open);assert((await p.locator('#helperTokenState').textContent()).includes('已配置'),'helper state not configured');await assertViewportSafe(p,'helper final');out.helper.controls=helperControls;out.helper.roundTrip='PASS';await p.screenshot({path:process.env.EVID+'/browser-helper-form-390.png',fullPage:true});await p.close();
            out.verdict='PASS_NO_PRODUCT_CHANGE';fs.writeFileSync(process.env.EVID+'/mobile-form-usability.json',JSON.stringify(out,null,2));console.log('P01_MOBILE_FORM_USABILITY=PASS_NO_CHANGE');console.log(JSON.stringify(out));await c.close();await b.close();})().catch(e=>{console.error(e);process.exit(1)});
          JS
          SOURCE="$SOURCE" EVID="$EVID" node diag.cjs | tee "$EVID/browser.txt"
      - name: SQLite integrity and FK
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$ROOT" php <<'PHP' | tee "$EVID/db.txt"
          <?php require getenv('ROOT').'/app/bootstrap.php';$db=vf_db();$integrity=strtolower((string)$db->query('PRAGMA integrity_check')->fetchColumn());$fk=count($db->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC));echo 'INTEGRITY='.$integrity."\n";echo 'FK='.$fk."\n";if($integrity!=='ok'||$fk!==0)exit(1);
          PHP
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-mobile-form-usability-${{ github.run_id }}
          path: ${{ env.EVID }}
          if-no-files-found: error
          retention-days: 30
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/p01-mobile-form-usability.pid 2>/dev/null)" 2>/dev/null || true
