name: P08 R21 one-off Owner recovery bundle GitHub Release (manual Production)
on:
  push:
    branches: [release/p08-r21-owner-recovery-once-20261113]
permissions:
  contents: read
concurrency:
  group: p08-r21-owner-recovery-20261113-once
  cancel-in-progress: false
jobs:
  owner-recovery-release:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.actor == 'llhzx2018' && github.ref == 'refs/heads/release/p08-r21-owner-recovery-once-20261113'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout exact merged private P08 R86 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 19120d036cf570460a5598c7159de3d78ae9de43
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Preflight official v0.1.1 and existing distribution remain unchanged
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = 19120d036cf570460a5598c7159de3d78ae9de43
          test "$(cat source/VERSION)" = 0.1.1
          test "$(gh api repos/llhzx2018/vf-adops/git/ref/heads/main --jq .object.sha)" = 19120d036cf570460a5598c7159de3d78ae9de43
          test "$(gh api repos/llhzx2018/vf-adops/git/ref/tags/v0.1.1 --jq .object.sha)" = 9c7f76434fe2d064f2f1ac15c58a760f778cf055
          test "$(gh api repos/llhzx2018/vf-adops/releases/tags/v0.1.1 --jq .id)" = 444076625
          test -n "$GH_TOKEN"
          if gh api repos/llhzx2018/vf-adops/releases/tags/p08-r21-owner-recovery-20261113 >/dev/null 2>&1; then
            echo P08_R86_OWNER_RECOVERY_RELEASE_ALREADY_EXISTS; exit 15
          fi
          if gh api repos/llhzx2018/vf-adops/git/ref/tags/p08-r21-owner-recovery-20261113 >/dev/null 2>&1; then
            echo P08_R86_OWNER_RECOVERY_TAG_ALREADY_EXISTS; exit 16
          fi
          gh api -H 'Accept: application/vnd.github.raw+json' 'repos/llhzx2018/core-updates/contents/projects/P08-ADOPS.json?ref=main' > "$RUNNER_TEMP/p08-r86-current-channel.json"
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          m=json.loads((Path(os.environ['RUNNER_TEMP'])/'p08-r86-current-channel.json').read_text())
          assert m['release_id']==444076625
          assert m['target_sha']=='9c7f76434fe2d064f2f1ac15c58a760f778cf055'
          assert m['asset_sha256']=='329a2bbbd1bd7bc0dae5412891c06085b7b304d3a701454ac53e1a44ba12155c'
          assert m['production_auto_apply'] is False
          PY
          echo P08_R86_SOURCE_MAIN_EXISTING_STABLE_RELEASE_AND_CHANNEL_VERIFIED=PASS
      - name: Download only the three exact existing private official 0.1.1 assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          D="$RUNNER_TEMP/p08-r86-official-assets"
          mkdir -m 0700 "$D"
          for entry in 743175524:VF_AdOps_V0.1.0_BRIDGE_FULL.zip 743175534:VF_AdOps_V0.1.1_FULL.zip 743175523:VF_AdOps_V0.1.1_UPDATE.zip; do
            id="${entry%%:*}"; name="${entry#*:}"
            curl -fsSL --retry 2 -H 'Accept: application/octet-stream' -H 'X-GitHub-Api-Version: 2022-11-28' -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/llhzx2018/vf-adops/releases/assets/$id" -o "$D/$name"
          done
          printf '%s  %s\n' \
            07bc7b324b7e37c6bcbfb1e3eb5633ae6e795617969ab75a88f230bdb08def3f "$D/VF_AdOps_V0.1.0_BRIDGE_FULL.zip" \
            d6caf8893d5ee24944bbcf79ad48e1ebb175938af4c222e0354eec9e4ddc87ba "$D/VF_AdOps_V0.1.1_FULL.zip" \
            329a2bbbd1bd7bc0dae5412891c06085b7b304d3a701454ac53e1a44ba12155c "$D/VF_AdOps_V0.1.1_UPDATE.zip" | sha256sum -c
          echo P08_R86_OFFICIAL_ORIGINAL_GITHUB_RELEASE_THREE_BYTES=PASS
      - name: Build and independently validate only the R21 one-ZIP 24MB manual package
        shell: bash
        run: |
          set -Eeuo pipefail
          B="$RUNNER_TEMP/VF_AdOps_R21_OWNER_RECOVERY_ONCE.zip"
          python3 -B source/scripts/build_p08_r21_owner_bundle.py --repo source --official-assets "$RUNNER_TEMP/p08-r86-official-assets" --output "$B" > "$RUNNER_TEMP/p08-r86-build-result.json"
          test "$(sha256sum "$B" | cut -d' ' -f1)" = 9e196652d9c646385492e6a5c76236135097067bdebbd39290300aec5217617f
          test "$(stat -c %s "$B")" = 24140313
          test "$(unzip -Z -1 "$B" | wc -l)" = 8
          mkdir "$RUNNER_TEMP/p08-r86-verification"
          unzip -q "$B" -d "$RUNNER_TEMP/p08-r86-verification"
          (cd "$RUNNER_TEMP/p08-r86-verification" && sha256sum --check SHA256SUMS)
          bash -n "$RUNNER_TEMP/p08-r86-verification/OWNER_R21_APPLY.sh"
          php -l "$RUNNER_TEMP/p08-r86-verification/p08-r21-official-atomic-once.php"
          if bash "$RUNNER_TEMP/p08-r86-verification/OWNER_R21_APPLY.sh" --apply /tmp/incorrect /tmp/incorrect > /dev/null 2>&1; then
            echo P08_R86_MANUAL_PACKAGE_WRONG_SITE_ACCEPTED; exit 17
          fi
          echo P08_R86_FINAL_MAIN_SOURCE_ONE_ZIP_AND_TAMPER_GATES=PASS
      - name: Create source-bound separate repair tag and draft, no stable channel writes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          REPO=llhzx2018/vf-adops
          TAG=p08-r21-owner-recovery-20261113
          gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha=19120d036cf570460a5598c7159de3d78ae9de43 >/dev/null
          test "$(gh api repos/$REPO/git/ref/tags/$TAG --jq .object.sha)" = 19120d036cf570460a5598c7159de3d78ae9de43
          cat > "$RUNNER_TEMP/p08-r86-release-notes.txt" <<'EOF'
          # VF AdOps · R21 旧站一次性安全更新工具

          此包 **不是新版 0.1.1 FULL，也不是通用版本更新**。只为旧 CloudPanel VF AdOps 0.1.0 R21 用户安装源码 917a2863 / 原 FULL Manifest SHA256 562a664a... 提供经过隔离机器验收的手工转换包。

          包名：VF_AdOps_R21_OWNER_RECOVERY_ONCE.zip。解压**在网站目录外**，先执行包内 OWNER_R21_APPLY.sh --check（只读），只有来源完全核对、已完成网站和数据库可靠异机备份、已安排维护窗口，Owner 才可在 SSH 中明确执行 --apply 并输入独立确认语。

          注意：离线转换期间会停止共享 Nginx、Cron 和该站 PHP-FPM，可能影响 VPS 上其它站点。旧站不可直接被 FULL、Bridge 或 UPDATE ZIP 覆盖。任何安全检查不通过则停止，不要猜测路径或强制执行。
          
          机器验收：MySQL 8.4 与 MariaDB 11.8 两独立 job 各 19/19 PASS；SQLite/真实 systemd Nginx PHP-FPM 15/15 PASS；8 文件整合 ZIP 与篡改负例 10/10 PASS。所有试验使用隔离旧站；Owner 正式 VPS 没有自动变动。

          既有 v0.1.1 官方 Release、Atomic ZIP、core-updates/projects/P08-ADOPS.json 均保持不变。此维护工具不设为 Latest Release，不触发自动更新。
          EOF
          gh release create "$TAG" "$RUNNER_TEMP/VF_AdOps_R21_OWNER_RECOVERY_ONCE.zip" -R "$REPO" --title "VF AdOps 0.1.1 · R21 旧站一次性兼容工具" --notes-file "$RUNNER_TEMP/p08-r86-release-notes.txt" --draft --latest=false --verify-tag
          gh api "repos/$REPO/releases?per_page=35" > "$RUNNER_TEMP/p08-r86-release-list.json"
          jq -er --arg tag "$TAG" '[.[]|select(.tag_name==$tag and .draft==true and .prerelease==false and (.assets|length)==1)]|if length==1 then .[0].id else empty end' "$RUNNER_TEMP/p08-r86-release-list.json" > "$RUNNER_TEMP/p08-r86-release-id"
          echo P08_R86_SEPARATE_DRAFT_RELEASE_AND_ONE_VERIFIED_ASSET=PASS
      - name: Download recovery asset through independent private GitHub API and verify exact byte identity
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          ID="$(cat "$RUNNER_TEMP/p08-r86-release-id")"
          gh api "repos/llhzx2018/vf-adops/releases/$ID" > "$RUNNER_TEMP/p08-r86-draft.json"
          jq -e '.draft==true and .prerelease==false and (.assets|length)==1' "$RUNNER_TEMP/p08-r86-draft.json" >/dev/null
          ASSET="$(jq -er '.assets[0].id' "$RUNNER_TEMP/p08-r86-draft.json")"
          test "$(jq -r '.assets[0].name' "$RUNNER_TEMP/p08-r86-draft.json")" = VF_AdOps_R21_OWNER_RECOVERY_ONCE.zip
          test "$(jq -r '.assets[0].size' "$RUNNER_TEMP/p08-r86-draft.json")" = 24140313
          test "$(jq -r '.assets[0].digest' "$RUNNER_TEMP/p08-r86-draft.json")" = sha256:9e196652d9c646385492e6a5c76236135097067bdebbd39290300aec5217617f
          curl -fsSL --retry 2 -H 'Accept: application/octet-stream' -H 'X-GitHub-Api-Version: 2022-11-28' -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/llhzx2018/vf-adops/releases/assets/$ASSET" -o "$RUNNER_TEMP/p08-r86-downloaded.zip"
          cmp "$RUNNER_TEMP/VF_AdOps_R21_OWNER_RECOVERY_ONCE.zip" "$RUNNER_TEMP/p08-r86-downloaded.zip"
          test "$(sha256sum "$RUNNER_TEMP/p08-r86-downloaded.zip" | cut -d' ' -f1)" = 9e196652d9c646385492e6a5c76236135097067bdebbd39290300aec5217617f
          echo P08_R86_GITHUB_DRAFT_REMOTE_BYTES_AND_SHA256_VERIFIED=PASS
      - name: Publish separate manual-recovery Release, leave official 0.1.1 and channel untouched
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          ID="$(cat "$RUNNER_TEMP/p08-r86-release-id")"
          gh api -X PATCH "repos/llhzx2018/vf-adops/releases/$ID" -F draft=false -f make_latest=false >/dev/null
          gh api 'repos/llhzx2018/vf-adops/releases/tags/p08-r21-owner-recovery-20261113' > "$RUNNER_TEMP/p08-r86-published.json"
          jq -e '.draft==false and .prerelease==false and (.assets|length)==1 and .assets[0].digest=="sha256:9e196652d9c646385492e6a5c76236135097067bdebbd39290300aec5217617f"' "$RUNNER_TEMP/p08-r86-published.json" >/dev/null
          test "$(gh api repos/llhzx2018/vf-adops/git/ref/tags/v0.1.1 --jq .object.sha)" = 9c7f76434fe2d064f2f1ac15c58a760f778cf055
          gh api -H 'Accept: application/vnd.github.raw+json' 'repos/llhzx2018/core-updates/contents/projects/P08-ADOPS.json?ref=main' > "$RUNNER_TEMP/p08-r86-channel-after.json"
          cmp "$RUNNER_TEMP/p08-r86-current-channel.json" "$RUNNER_TEMP/p08-r86-channel-after.json"
          echo P08_R86_OWNER_MANUAL_RECOVERY_RELEASE_REMOTE_READBACK=PASS
          echo P08_R86_ORIGINAL_011_RELEASE_AND_STABLE_CHANNEL=UNCHANGED
          echo P08_R86_PRODUCTION_TOUCH=NO
      - name: Clear all private checkout / downloads / ZIPs and credentials from disposable Runner
        shell: bash
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          rm -rf source "$RUNNER_TEMP/p08-r86-official-assets" "$RUNNER_TEMP/p08-r86-verification"
          rm -f "$RUNNER_TEMP/VF_AdOps_R21_OWNER_RECOVERY_ONCE.zip" "$RUNNER_TEMP/p08-r86-downloaded.zip" "$RUNNER_TEMP/p08-r86-build-result.json" "$RUNNER_TEMP/p08-r86-release-notes.txt" "$RUNNER_TEMP/p08-r86-release-list.json" "$RUNNER_TEMP/p08-r86-release-id" "$RUNNER_TEMP/p08-r86-draft.json" "$RUNNER_TEMP/p08-r86-published.json" "$RUNNER_TEMP/p08-r86-current-channel.json" "$RUNNER_TEMP/p08-r86-channel-after.json"
          echo P08_R86_PRIVATE_SOURCE_AND_ARTIFACT_RUNNER_PERSISTENCE=NO
