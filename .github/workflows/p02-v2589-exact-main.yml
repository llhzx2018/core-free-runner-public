name: P02 V2.5.89 Exact Main

on:
  push:
    branches:
      - run/p02-v2589-exact-main-20260922
    paths:
      - '.github/workflows/p02-v2589-exact-main.yml'

permissions:
  contents: read

jobs:
  exact-main:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact P02 main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 440eb6085191f9919e4ccddb80d7e25b60a70c22
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product

      - name: Install runtime and Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-zip sqlite3 unzip curl
          cd product
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Exact-main source and unit gate
        shell: bash
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "440eb6085191f9919e4ccddb80d7e25b60a70c22"
          test "$(cat VERSION)" = "2.5.89"
          python3 scripts/generate-source-manifest.py
          git diff --exit-code -- SOURCE_MANIFEST.json SOURCE_MANIFEST.txt
          node --check public/assets/app.js
          node --check public/assets/attachments.js
          node tests/unit/p02_v2589_attachment_replace_semantics.mjs
          while IFS= read -r cmd; do test -n "$cmd"; eval "$cmd"; done < <(awk '/run: node tests\/unit\//{sub(/^.*run: /,""); print}' .github/workflows/repository-health.yml)
          bash scripts/verify-repository.sh
          echo P02_V2589_EXACT_MAIN_SOURCE=PASS

      - name: Exact-main maintenance
        shell: bash
        working-directory: product
        env:
          TEST_PASSWORD: VF-P02-V2589-MAIN-${{ github.run_id }}!
          EVIDENCE_DIR: ${{ runner.temp }}/p02-v2589-exact-main
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          bash scripts/maintenance-reverify.sh
          echo P02_V2589_EXACT_MAIN_MAINTENANCE=PASS

      - name: Exact-main Chromium attachment replacement
        shell: bash
        working-directory: product
        env:
          VF_UX_FOCUSED_ATTACHMENT_REPLACE: "1"
          VF_UX_E2E_PASSWORD: VF-P02-V2589-MAIN-${{ github.run_id }}!
        run: |
          set -Eeuo pipefail
          timeout 180s bash scripts/ux-browser-reverify.sh
          echo P02_V2589_EXACT_MAIN_BROWSER=PASS

      - name: Upload exact-main evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p02-v2589-exact-main
          path: ${{ runner.temp }}/p02-v2589-exact-main
          if-no-files-found: ignore
          retention-days: 7
