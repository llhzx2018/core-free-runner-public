name: P04 V2.5.3 Settings Error Diagnose

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p04-v253-settings-error-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Prepare runtime
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-zip sqlite3 >/dev/null
      - name: Capture Settings backend error after successful Atomic
        env:
          VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone -q https://github.com/llhzx2018/core-free-runner-public.git runner-tools
          python3 - runner-tools/ops/p04/v253_hotfix_execute_v2.sh <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]);s=p.read_text()
          old='''POST_CODE=$(curl -sS -b "$WORK/cookie" -o "$WORK/settings-after.json" -w '%{http_code}' "$BASE/api.php?action=settings")\ntest "$POST_CODE" = 200'''
          new='''POST_CODE=$(curl -sS -b "$WORK/cookie" -o "$WORK/settings-after.json" -w '%{http_code}' "$BASE/api.php?action=settings")\necho "SETTINGS_HTTP=$POST_CODE"\nif [[ "$POST_CODE" != 200 ]]; then\n  echo '--- SETTINGS RESPONSE ---'\n  cat "$WORK/settings-after.json"\n  echo '--- SERVER LOG TAIL ---'\n  tail -120 "$WORK/http.log" | sed -E 's#(/[A-Za-z0-9._-]+){3,}#[ABSOLUTE_PATH_REDACTED]#g'\n  exit 1\nfi'''
          if s.count(old)!=1: raise SystemExit(f'settings sentinel count={s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          bash runner-tools/ops/p04/v253_hotfix_execute_v2.sh
      - name: Cleanup
        if: always()
        run: rm -rf runner-tools
