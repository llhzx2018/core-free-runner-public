name: P01 PR1820 one-time isolated unit install upgrade recovery safety
on:
  push:
    branches: [task/p01-pr1820-safety-ia4-20261028]
    paths:
      - '.github/workflows/p01-pr1820-safety-ia4-20261028.yml'
      - 'lanes/p01-pr1820-safety-ia4-20261028/run.sh'
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-start
  TARGET_VERSION: 2.47.466
  TARGET_SHA: 81684c499c04fc7c096f758c0d49592e0f8c2a50
  BASE_SHA: 03ea17d4c8e106b1f2f641c038868a57a0875f5e
  LANE_ID: p01-pr1820-safety-ia4-20261028
jobs:
  safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout existing public Runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: control
      - name: Audit rendered target source identity
        shell: bash
        run: |
          set -euo pipefail
          python3 control/scripts/ephemeral_lane_spec.py validate --spec "control/lanes/$LANE_ID/spec.json"
          python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec "control/lanes/$LANE_ID/spec.json" --input "control/.github/workflows/p01-pr1820-safety-ia4-20261028.yml"
      - name: Checkout P01 PR1820 private exact source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 81684c499c04fc7c096f758c0d49592e0f8c2a50
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: target
      - name: Checkout existing formal Stable V2.47.466 transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 03ea17d4c8e106b1f2f641c038868a57a0875f5e
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: stable
      - name: Exact source identity and baseline guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C stable rev-parse HEAD)" = "$BASE_SHA"
          test "$(tr -d '\r\n' < target/VERSION)" = "$TARGET_VERSION"
          test "$(tr -d '\r\n' < target/src/VERSION.txt)" = "$TARGET_VERSION"
          test "$(tr -d '\r\n' < stable/VERSION)" = "$TARGET_VERSION"
          test "$(find target/tests/unit -maxdepth 1 -type f -name '*.php' | wc -l)" -eq 771
          test "$(find stable/tests/unit -maxdepth 1 -type f -name '*.php' | wc -l)" -eq 771
          bash -n "control/lanes/$LANE_ID/run.sh"
          echo "P01_EXACT_SAFETY_CANDIDATE_AND_STABLE=PASS"
      - name: Ensure isolated PHP SQLite test prerequisites
        shell: bash
        run: |
          set -euo pipefail
          if ! php -m | grep -qi '^pdo_sqlite$' || ! php -m | grep -qi '^sqlite3$'; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq php8.3-sqlite3
          fi
          php -m | grep -qi '^pdo_sqlite$'
          php -m | grep -qi '^sqlite3$'
          php -v | head -n 1
          echo "P01_SYNTHETIC_TEST_SQLITE=READY"
      - name: Run one-time exact-source safety and canonical regression gates
        shell: bash
        run: |
          set -euo pipefail
          bash "control/lanes/$LANE_ID/run.sh" "$GITHUB_WORKSPACE/target" "$GITHUB_WORKSPACE/stable" "$GITHUB_WORKSPACE/proof"
      - name: Upload public-safe gate metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-pr1820-safety-${{ github.run_id }}
          path: proof/metadata.json
          if-no-files-found: warn
          retention-days: 14
      - name: Destroy both transient private checkouts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for p in "$GITHUB_WORKSPACE/target" "$GITHUB_WORKSPACE/stable"; do
            if [ -d "$p" ]; then
              case "$p" in "$GITHUB_WORKSPACE/target"|"$GITHUB_WORKSPACE/stable") rm -rf -- "$p";; *) exit 1;; esac
            fi
          done
          echo "P01_PRIVATE_CHECKOUT_CLEANUP=PASS"
