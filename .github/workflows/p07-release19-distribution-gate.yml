name: P07 Release19 Distribution Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'installers/p07.sh'
      - 'installers/p07-final.sh'
      - 'installers/p07-toolbox.sh'
      - 'dist/p07/0.1.0/overlay/**'
      - '.github/workflows/p07-release19-distribution-gate.yml'

permissions:
  contents: read

jobs:
  distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Release19 identity
        run: |
          set -Eeuo pipefail
          root='dist/p07/0.1.0/overlay'
          test "$(cat "$root/BUILD_ID")" = '0.1.0-release19'
          grep -Fq 'EXPECTED_BUILD_ID="0.1.0-release19"' installers/p07-final.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release19"' installers/p07-toolbox.sh
          grep -Fq 'RUNTIME_MANIFEST_BLOB="67f40e615003d8c302ec391c73c836f05113db57"' installers/p07-final.sh
          grep -Fq 'EXPECTED_BLOB="ab42d2d1b84669372b8615819de63f0c19619067"' installers/p07.sh
          grep -Fq '## Restore-As Guarded Nginx Reload Contract' "$root/docs/authority/RPD.md"
          grep -Fq '| B51 | Restore-As Guarded Nginx Reload / Transport Diagnosis |' "$root/docs/authority/ACCEPTANCE_MATRIX.md"

      - name: Exact overlay and runtime manifests
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('dist/p07/0.1.0/overlay')
          def blob(path: Path) -> str:
              data=path.read_bytes()
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          for name in ('RUNTIME.gitblob','MANIFEST.gitblob'):
              seen=set()
              for line in (root/name).read_text(encoding='utf-8').splitlines():
                  if not line.strip():
                      continue
                  expected, rel=line.split('  ',1)
                  assert rel not in seen, (name, rel)
                  seen.add(rel)
                  path=root/rel
                  assert path.is_file(), (name, rel)
                  assert blob(path)==expected, (name, rel, blob(path), expected)
          runtime=(root/'RUNTIME.gitblob').read_text(encoding='utf-8')
          required={
              'BUILD_ID':'b7eb936df01c4c996619c10e3a638cd1743c925a',
              'lib/restore_as_verified.py':'ca173d602b7a24c1ddad6d727dccff86c646efab',
              'lib/restore_failure_ui.sh':'688c4d0d67824098e220a086d3e023ab82a3d3af',
          }
          for rel, expected in required.items():
              assert f'{expected}  {rel}' in runtime, rel
          PY

      - name: Release19 guarded reload contract
        run: |
          set -Eeuo pipefail
          root='dist/p07/0.1.0/overlay'
          grep -Fq 'def _reload_nginx' "$root/lib/restore_as_verified.py"
          grep -Fq '[nginx, "-t"]' "$root/lib/restore_as_verified.py"
          grep -Fq '[nginx, "-s", "reload"]' "$root/lib/restore_as_verified.py"
          grep -Fq 'def _curl_failure_class' "$root/lib/restore_as_verified.py"
          grep -Fq 'CONNECT_FAILED' "$root/lib/restore_as_verified.py"
          grep -Fq 'TIMEOUT' "$root/lib/restore_as_verified.py"
          grep -Fq 'EMPTY_REPLY' "$root/lib/restore_as_verified.py"
          grep -Fq 'target_transport={transport}' "$root/lib/restore_as_verified.py"
          grep -Fq '_reload_nginx(nginx)' "$root/lib/restore_as_verified.py"
          grep -Fq 'nginx reload preflight failed' "$root/lib/restore_failure_ui.sh"
          grep -Fq 'nginx reload failed' "$root/lib/restore_failure_ui.sh"
          grep -Fq 'target_transport=CONNECT_FAILED' "$root/lib/restore_failure_ui.sh"
          grep -Fq 'target_transport=TIMEOUT' "$root/lib/restore_failure_ui.sh"
          grep -Fq 'target_transport=EMPTY_REPLY' "$root/lib/restore_failure_ui.sh"

      - name: Syntax and compile
        run: |
          set -Eeuo pipefail
          root='dist/p07/0.1.0/overlay'
          bash -n "$root/bin/vfops-site-ui"
          bash -n "$root/lib/restore_failure_ui.sh"
          python3 -m py_compile             "$root/lib/restore_as_verified.py"             "$root/lib/restore_as.py"             "$root/lib/restore_apply_core.py"             "$root/lib/verify.py"

      - name: Public overlay release19 regressions
        run: |
          set -Eeuo pipefail
          cd dist/p07/0.1.0/overlay
          export PYTHONPATH="$PWD/lib"
          python3 -m unittest -q             tests.test_restore_as_verified             tests.test_release16_restore_as_sqlite             tests.test_restore_as             tests.test_terminal_ui_color_contract             tests.test_user_entry

      - name: Guarded reload behavior
        run: |
          set -Eeuo pipefail
          root='dist/p07/0.1.0/overlay'
          export PYTHONPATH="$PWD/$root/lib"
          python3 - <<'PY'
          import subprocess
          from unittest import mock
          import restore_as_verified as r

          calls=[
              subprocess.CompletedProcess([],0,stdout='',stderr=''),
              subprocess.CompletedProcess([],0,stdout='',stderr=''),
          ]
          with mock.patch.object(r,'_run',side_effect=calls) as run:
              r._reload_nginx('/usr/sbin/nginx')
          assert run.call_args_list[0].args[0]==['/usr/sbin/nginx','-t']
          assert run.call_args_list[1].args[0]==['/usr/sbin/nginx','-s','reload']

          assert r._curl_failure_class(7)=='CONNECT_FAILED'
          assert r._curl_failure_class(28)=='TIMEOUT'
          assert r._curl_failure_class(52)=='EMPTY_REPLY'
          assert r._curl_failure_class(99)=='OTHER'
          PY

      - name: Isolated current-runtime install
        run: |
          set -Eeuo pipefail
          root="$PWD"
          tmp="$(mktemp -d)"
          export P07_PUBLIC_ROOT="file://$root"
          export P07_INSTALL_DIR="$tmp/install"
          export P07_PREVIOUS_DIR="$tmp/previous"
          export P07_BIN_LINK="$tmp/vfops"
          export P07_ALLOW_NONROOT=1
          export P07_NO_EXEC=1

          bash installers/p07-final.sh >"$tmp/install.log"
          test "$("$tmp/vfops" --version)" = 'VF Server Ops 0.1.0'
          test "$("$tmp/vfops" --build-id)" = '0.1.0-release19'
          grep -Fq 'lib/restore_as_verified.py' "$tmp/install/.runtime-manifest.gitblob"
          grep -Fq 'lib/restore_failure_ui.sh' "$tmp/install/.runtime-manifest.gitblob"

          bash installers/p07-final.sh >"$tmp/second.log"
          grep -Fq '已是当前版本，无需下载或重复安装' "$tmp/second.log"

      - name: Beginner transport classification
        run: |
          set -Eeuo pipefail
          root='dist/p07/0.1.0/overlay'
          tmp="$(mktemp -d)"

          cat >"$tmp/preflight.err" <<'EOF'
          ERROR: Restore-As local verification failed; rollback=PASS; reason=nginx reload preflight failed
          EOF
          NO_COLOR=1 bash -c "source '$root/lib/terminal_ui.sh'; source '$root/lib/restore_failure_ui.sh'; render_restore_failure '$tmp/preflight.err'" >"$tmp/preflight.out"
          grep -Fq 'Nginx 配置自检没有通过' "$tmp/preflight.out"

          cat >"$tmp/connect.err" <<'EOF'
          ERROR: Restore-As local verification failed; rollback=PASS; reason=local Host routing verification failed; target_vhost=PRESENT; target_listener=UNREACHABLE; target_transport=CONNECT_FAILED
          EOF
          NO_COLOR=1 bash -c "source '$root/lib/terminal_ui.sh'; source '$root/lib/restore_failure_ui.sh'; render_restore_failure '$tmp/connect.err'" >"$tmp/connect.out"
          grep -Fq '本机连接被拒绝' "$tmp/connect.out"
          ! grep -Fq 'target_transport=CONNECT_FAILED' "$tmp/connect.out"

          cat >"$tmp/empty.err" <<'EOF'
          ERROR: Restore-As local verification failed; rollback=PASS; reason=local Host routing verification failed; target_vhost=PRESENT; target_listener=UNREACHABLE; target_transport=EMPTY_REPLY
          EOF
          NO_COLOR=1 bash -c "source '$root/lib/terminal_ui.sh'; source '$root/lib/restore_failure_ui.sh'; render_restore_failure '$tmp/empty.err'" >"$tmp/empty.out"
          grep -Fq 'Nginx 返回了空响应' "$tmp/empty.out"

      - name: Safety boundary
        run: |
          set -Eeuo pipefail
          root='dist/p07/0.1.0/overlay'
          ! grep -R -n -E '(PRIVATE KEY|BEGIN OPENSSH|ghp_[A-Za-z0-9]|github_pat_)' "$root/bin" "$root/lib" installers/p07*.sh
          ! grep -R -n -E '(^|[^A-Za-z])(rm[[:space:]]+-rf[[:space:]]+/($|[[:space:]]))' installers/p07*.sh "$root/bin" "$root/lib"
          grep -Fq 'cleanup_database' "$root/lib/restore_as_verified.py"
          grep -Fq 'cleanup_site' "$root/lib/restore_as_verified.py"
          grep -Fq 'DNS 没有修改，原网站没有修改。' "$root/lib/restore_failure_ui.sh"

      - name: Result
        if: always()
        run: |
          echo 'P07_RELEASE19_DISTRIBUTION_GATE=COMPLETE'
          echo 'P07_PRODUCTION_WRITE=NOT_RUN'
