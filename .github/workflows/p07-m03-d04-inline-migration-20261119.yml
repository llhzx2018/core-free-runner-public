name: P07 M03 D04 one-case inline migration safe preflight proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-m03-d04-inline-migration-20261119.yml'
permissions:
  contents: read
jobs:
  p07-m03-d04-inline:
    if: github.repository == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      NO_COLOR: '1'
      P07_PRODUCT_SHA: '4a0eefbf68e664dc4d07c873f720aadfbf321c51'
      P07_BASE_SHA: '23fc0f1dc961df2e439ab1289141ab563cf57a95'
    steps:
      - name: Checkout public runner authority without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact private product revision only into temporary job workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 4a0eefbf68e664dc4d07c873f720aadfbf321c51
          fetch-depth: 0
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: .product
      - name: Checkout current GOV naming and architecture guard transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: .gov
      - name: Validate exact source plus Git diff architecture
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C .product rev-parse HEAD)" = "$P07_PRODUCT_SHA"
          git -C .product cat-file -e "$P07_BASE_SHA^{commit}"
          bash -n .product/bin/vfops-migrate-ui .product/components/p07-m03-migration-readiness.sh
          if ! python3 -B .product/.github/checks/architecture_gate.py \
              --manifest .product/.github/checks/code_architecture.json \
              --gov-root .gov --git-root .product \
              --base-sha "$P07_BASE_SHA" --head-sha "$P07_PRODUCT_SHA" \
              > "$RUNNER_TEMP/p07-inline-architecture.log" 2>&1; then
            echo P07_M03_D04_ARCHITECTURE=BLOCKED
            grep -E '^PROJECT_ARCHITECTURE=' "$RUNNER_TEMP/p07-inline-architecture.log" | cut -c1-150 || true
            exit 1
          fi
          (cd .product && python3 -B scripts/check_p07_modules.py) > "$RUNNER_TEMP/p07-inline-modules.log" 2>&1
          echo P07_M03_D04_EXACT_ARCHITECTURE_AND_MODULES=PASS
      - name: Test direct single and whole migration automatic read-only collision inventory and no-target-write negatives
        shell: bash
        run: |
          set -Eeuo pipefail
          for testcase in \
            test_p07_m03_terminal_ux_v3.py \
            test_p07_m03_d04_preparation_checklist.py \
            test_migration_no_overwrite_resume.py; do
            if (cd .product && python3 -B -m unittest discover -s tests -p "$testcase" -q) \
                > "$RUNNER_TEMP/p07-inline-$testcase.log" 2>&1; then
              echo "P07_M03_D04_SUITE_PASS=$testcase"
            else
              echo "P07_M03_D04_SUITE_BLOCKED=$testcase"
              grep -E '^(FAIL|ERROR):|^Ran [0-9]+ tests|^FAILED' "$RUNNER_TEMP/p07-inline-$testcase.log" | cut -c1-150 || true
              exit 1
            fi
          done
          echo P07_M03_D04_INLINE_NO_REPLAY_NOCONFLICT_OVERWRITE=PASS
      - name: Validate owner facing terminal UX evidence contract
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! (cd .product && python3 -B scripts/check_p07_terminal_ux.py \
            --module P07-M03-D04 \
            --changed-file bin/vfops-migrate-ui \
            --changed-file components/p07-m03-migration-readiness.sh \
            --evidence-file docs/ux-reviews/p07-m03-d04-inline-migration-20261119.json) \
              > "$RUNNER_TEMP/p07-inline-ux.log" 2>&1; then
            echo P07_M03_D04_UX_GATE=BLOCKED
            grep -E 'BLOCKED|FAIL|ERROR' "$RUNNER_TEMP/p07-inline-ux.log" | cut -c1-140 | head -n 8 || true
            exit 1
          fi
          echo P07_M03_D04_TERMINAL_UX_V3=PASS
          echo P07_M03_D04_OWNER_PRODUCTION_AND_MIGRATION=NOT_TOUCHED
      - name: Remove temporary private product and GOV source
        if: always()
        shell: bash
        run: |
          rm -rf -- .product .gov
          echo P07_M03_D04_PRIVATE_WORKSPACE_CLEANED=YES
