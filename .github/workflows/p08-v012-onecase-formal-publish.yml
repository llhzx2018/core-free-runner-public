name: P08 0.1.2 Mode L Formal Release to verified channel (one case)
on:
  push:
    branches: [test/p08-v012-formal-publish-onecase-20261114]
permissions:
  contents: read
jobs:
  release:
    if: github.repository == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      P08_REPO: llhzx2018/vf-adops
      P08_SOURCE: 7f7218abfa13ba232d1afd13f10df29da29dd21a
      GOV_SOURCE: 64c8a874210f2fa89fee07c7283ffce2bbe6b36c
      P08_PREVIOUS_SOURCE: 9c7f76434fe2d064f2f1ac15c58a760f778cf055
      P08_PREVIOUS_FULL_SHA256: d6caf8893d5ee24944bbcf79ad48e1ebb175938af4c222e0354eec9e4ddc87ba
      P08_PREVIOUS_FULL_MANIFEST_SHA256: a4bf9f7f5fc48bb4c32ece11139af508b68ed85e69a69cf48dff7adc0d837829
    steps:
      - name: Checkout registered public-safe workflow harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Transient exact merged P08 main source from private GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 7f7218abfa13ba232d1afd13f10df29da29dd21a
          path: private-p08-v012
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Transient approved GOV-DOC Mode L V3.11 Current
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 64c8a874210f2fa89fee07c7283ffce2bbe6b36c
          path: gov-v311
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: PHP 8.4 locked builder
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: zip,pdo_sqlite,pdo_mysql,sqlite3,curl,mbstring,dom,intl,fileinfo
          coverage: none
      - name: Node.js 22 locked Vite assets
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Immutable current source and hard-gate proof readback BEFORE any Tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          src="$PWD/private-p08-v012";gov="$PWD/gov-v311"
          test "$(git -C "$src" rev-parse HEAD)" = "$P08_SOURCE"
          test "$(git -C "$gov" rev-parse HEAD)" = "$GOV_SOURCE"
          test "$(cat "$src/VERSION")" = 0.1.2
          grep -Fq '| skill-release | V3.11 |' "$gov/CURRENT.md"
          grep -Fq 'Mode L · ONE_CASE_P08_ADOPS_012_SCHEMA_ATOMIC_RELEASE_FIRST_OWNER_MANUAL' "$gov/skills/skill-release/V3.11/SKILL.md"
          grep -Fq '## RP-07L · v0.1.2 R102' "$src/docs/authority/ACCEPTANCE_MATRIX.md"
          grep -Fq 'printf '"'"'%s\n'"'"' "$$" >&9' "$src/scripts/r102_cloudpanel_offline_once.sh"
          test -z "$(git -C "$src" status --porcelain --untracked-files=all)"
          python3 - "$src" <<'PY'
          import pathlib,subprocess,sys
          src=pathlib.Path(sys.argv[1]);base="f6bb8afa339739cd089c940bf6a58dd400cd556d"
          changed=set(subprocess.check_output(
            ["git","-C",str(src),"diff","--name-only",base,"7f7218abfa13ba232d1afd13f10df29da29dd21a"],text=True).splitlines())
          expected={"AGENTS.md","docs/authority/ACCEPTANCE_MATRIX.md",
            "docs/authority/CURRENT.md",
            "docs/evidence/P08_012_FORMAL_RELEASE_GATE_20261114.md",
            "scripts/r102_cloudpanel_offline_once.sh"}
          assert changed==expected,(changed^expected)
          old=subprocess.check_output(["git","-C",str(src),"show",base+":scripts/r102_cloudpanel_offline_once.sh"])
          new=(src/"scripts/r102_cloudpanel_offline_once.sh").read_bytes()
          assert new==old.replace(b'printf \x27%s\\n\x27 "$" >&9', b'printf \x27%s\\n\x27 "$$" >&9')
          print("P08_V012_EXECUTABLE_GIT_DIFF_ONLY_REAL_TESTED_ROOT_PID_FIX=PASS")
          PY
          for run in 43586881509 43588605099 43583857063 43565286516; do
            test "$(gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$run" --jq '.conclusion')" = success
          done
          for job in 132420880748 132420880994; do
            test "$(gh api "repos/llhzx2018/core-free-runner-public/actions/jobs/$job" --jq '.conclusion')" = success
          done
          test -f "$src/docs/authority/PUBLIC_AUTHORITY_APPLICABILITY.md"
          python3 -B "$gov/governance/public-authority/tools/current_dependency_lint.py" --root "$gov"
          bash -n "$src/scripts/r102_cloudpanel_offline_once.sh"
          echo P08_V012_PREPUBLICATION_GOV_SOURCE_ALL_RELEVANT_MACHINE_GATES=PASS
      - name: Official released old FULL actual-byte readback and locked PHP/Vue build
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          src="$PWD/private-p08-v012"
          old="$RUNNER_TEMP/p08-v012-real-official-011"
          test ! -e "$old"
          mkdir -m 0700 "$old" "$old/extracted"
          gh release download v0.1.1 -R "$P08_REPO" \
            --pattern VF_AdOps_V0.1.1_FULL.zip --dir "$old" >/dev/null
          printf '%s  %s\n' "$P08_PREVIOUS_FULL_SHA256" "$old/VF_AdOps_V0.1.1_FULL.zip" | sha256sum -c -
          test "$(stat -c %s "$old/VF_AdOps_V0.1.1_FULL.zip")" = 8044300
          unzip -q "$old/VF_AdOps_V0.1.1_FULL.zip" -d "$old/extracted"
          test "$(sha256sum "$old/extracted/FULL_MANIFEST.json" | cut -d' ' -f1)" = "$P08_PREVIOUS_FULL_MANIFEST_SHA256"
          cd "$src"
          composer install --prefer-dist --no-interaction --no-progress --no-scripts --optimize-autoloader > "$RUNNER_TEMP/p08-v012-composer.log" 2>&1 || { tail -n 15 "$RUNNER_TEMP/p08-v012-composer.log"; exit 1; }
          npm ci --ignore-scripts --no-audit --no-fund > "$RUNNER_TEMP/p08-v012-npm.log" 2>&1 || { tail -n 15 "$RUNNER_TEMP/p08-v012-npm.log"; exit 1; }
          npm run build > "$RUNNER_TEMP/p08-v012-vite.log" 2>&1 || { tail -n 15 "$RUNNER_TEMP/p08-v012-vite.log"; exit 1; }
          test -f vendor/autoload.php
          test -f public/build/manifest.json
          git worktree add --detach "$RUNNER_TEMP/p08-v012-clean-git" "$P08_SOURCE"
          git worktree add --detach "$RUNNER_TEMP/p08-v011-published-source" "$P08_PREVIOUS_SOURCE"
          test -z "$(git -C "$RUNNER_TEMP/p08-v012-clean-git" status --porcelain --untracked-files=all)"
          echo P08_V012_OFFICIAL_PREVIOUS_RELEASE_AND_LOCKED_DEPENDENCIES=PASS
      - name: Real final main FULL+Atomic+Bridge bytes and genuine old Owner upgrade
        env:
          P08_ISOLATED_INSTALL_TEST: YES
          P08_R102_DISPOSABLE_SCHEMA: YES
        run: |
          set -Eeuo pipefail
          src="$PWD/private-p08-v012"
          gov="$PWD/gov-v311"
          out="$RUNNER_TEMP/p08-v012-formal-private"
          target="$RUNNER_TEMP/p08-v012-extracted"
          bridge="$RUNNER_TEMP/p08-v011-r102-bridge-extracted"
          site="$RUNNER_TEMP/p08-v011-real-owner"
          old="$RUNNER_TEMP/p08-v012-real-official-011/extracted"
          mkdir -m 0700 "$out" "$target" "$bridge" "$site"
          python3 - "$src" "$RUNNER_TEMP/p08-v012-clean-git" "$gov" "$out/VF_AdOps_V0.1.2_FULL.zip" "$P08_SOURCE" <<'PY'
          import sys
          from pathlib import Path
          src,clean,gov,out=map(Path,sys.argv[1:5]);sha=sys.argv[5]
          sys.path.insert(0,str(src/"scripts"))
          from build_full import write_full,verify_canonical_full_contract
          verify_canonical_full_contract(clean,out,sha,gov,"resolve")
          write_full(src,out,"0.1.2",sha)
          verify_canonical_full_contract(clean,out,sha,gov,"delivery")
          print("P08_V012_FINAL_FULL_CANONICAL_SOURCE_AND_REAL_DELIVERY_BYTES=PASS")
          PY
          unzip -q "$out/VF_AdOps_V0.1.2_FULL.zip" -d "$target"
          test ! -f "$target/.env"
          test ! -e "$target/storage/app/private/adops/installation/installed.json"
          python3 "$src/scripts/build_r102_schema_atomic.py" \
            --source "$target" --output "$out/VF_AdOps_V0.1.2_UPDATE.zip" \
            --old-full-sha256 "$P08_PREVIOUS_FULL_MANIFEST_SHA256" \
            --target-sha "$P08_SOURCE"
          python3 "$src/scripts/build_r102_owner_bridge.py" \
            --old-full "$old" --overlay "$src" \
            --old-full-sha256 "$P08_PREVIOUS_FULL_MANIFEST_SHA256" \
            --overlay-sha "$P08_SOURCE" \
            --old-published-source "$RUNNER_TEMP/p08-v011-published-source" \
            --output "$out/VF_AdOps_V0.1.1_R102_BRIDGE_FULL.zip"
          unzip -q "$out/VF_AdOps_V0.1.1_R102_BRIDGE_FULL.zip" -d "$bridge"
          php -r 'require $argv[1]."/src/Installation/SetupGuard.php"; VF\AdOps\Installation\SetupGuard::package($argv[2]); VF\AdOps\Installation\SetupGuard::package($argv[3]);' "$src" "$target" "$bridge"
          php "$src/tests/test_extracted_full_sqlite_e2e.php" "$target"
          unzip -q "$RUNNER_TEMP/p08-v012-real-official-011/VF_AdOps_V0.1.1_FULL.zip" -d "$site"
          php "$src/tests/compatibility/r102_install_published_sqlite.php" "$site"
          php "$src/tests/compatibility/r102_bridge_installed_sqlite.php" success "$site" "$bridge"
          php "$src/tests/compatibility/r102_clicked_upgrade_sqlite.php" success "$site" "$target" "$out/VF_AdOps_V0.1.2_UPDATE.zip"
          cp "$src/scripts/r102_cloudpanel_offline_once.sh" "$out/VF_AdOps_V0.1.2_CLOUDPANEL_OFFLINE_ONCE.sh"
          test -f "$out/VF_AdOps_V0.1.2_CLOUDPANEL_OFFLINE_ONCE.sh"
          python3 - "$out" "$bridge" "$target" "$P08_SOURCE" "$P08_PREVIOUS_FULL_MANIFEST_SHA256" <<'PY'
          import sys,pathlib,hashlib,json,zipfile
          out,bridge,target=map(pathlib.Path,sys.argv[1:4]);sha=sys.argv[4];oldman=sys.argv[5]
          names=["VF_AdOps_V0.1.2_FULL.zip","VF_AdOps_V0.1.2_UPDATE.zip","VF_AdOps_V0.1.1_R102_BRIDGE_FULL.zip","VF_AdOps_V0.1.2_CLOUDPANEL_OFFLINE_ONCE.sh"]
          b=json.loads((bridge/"FULL_MANIFEST.json").read_bytes())
          full=json.loads((target/"FULL_MANIFEST.json").read_bytes())
          assert full["source_sha"]==sha and full["target_version"]=="0.1.2"
          assert b["target_version"]=="0.1.1" and len(b["source_sha"])==40
          bridgeId=b["source_sha"]
          bmhash=hashlib.sha256((bridge/"FULL_MANIFEST.json").read_bytes()).hexdigest()
          fmhash=hashlib.sha256((target/"FULL_MANIFEST.json").read_bytes()).hexdigest()
          receipt={"project_id":"P08","release_tag":"v0.1.2",
            "source_sha":sha,"source_version":"0.1.1","target_version":"0.1.2",
            "old_published_source_sha":"9c7f76434fe2d064f2f1ac15c58a760f778cf055",
            "old_published_full_sha256":"d6caf8893d5ee24944bbcf79ad48e1ebb175938af4c222e0354eec9e4ddc87ba",
            "old_published_full_manifest_sha256":oldman,
            "bridge_sha":bridgeId,"bridge_full_manifest_sha256":bmhash,
            "target_full_manifest_sha256":fmhash,"schema_from":"1.0",
            "schema_to":"1.1","migrations_added":10,
            "owner_preview":"POST_RELEASE_REQUIRED",
            "owner_real_use":"POST_PRODUCTION_REQUIRED",
            "owner_production_auto_apply":False,
            "machine_evidence":[43586881509,43588605099,43583857063,43565286516],
            "assets":[]}
          for name in names:
            p=out/name;assert p.is_file() and not p.is_symlink()
            blob=p.read_bytes()
            if name.endswith(".zip"):
              assert len(blob)>1024
              with zipfile.ZipFile(p) as z:
                all=z.namelist()
                assert len(all)>20 and len(all)==len(set(all))
                assert not any(s.startswith("/") or ".." in s.split("/") for s in all)
                if name.endswith("_UPDATE.zip"):
                  a=json.loads(z.read("ATOMIC_MANIFEST.json"))
                  assert a["source_sha"]==receipt["old_published_source_sha"]
                  assert a["source_full_manifest_sha256"]==oldman
                  assert a["target_sha"]==sha
                  assert a["schema_changes"] is True and len(a["migrations"])==10
                else:
                  m=json.loads(z.read("FULL_MANIFEST.json"))
                  assert m["type"]=="CLEAN_FULL_ONLY" and m["data_included"] is False
            else:
              assert b'printf \x27%s\\n\x27 "$$" >&9' in blob
            receipt["assets"].append({"name":name,"size":len(blob),"sha256":hashlib.sha256(blob).hexdigest()})
            print("P08_V012_FINAL_ASSET_HASH="+name+" "+hashlib.sha256(blob).hexdigest()+" "+str(len(blob)))
          (out/"RELEASE_PROVENANCE.json").write_text(json.dumps(receipt,sort_keys=True,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          names.append("RELEASE_PROVENANCE.json")
          (out/"SHA256SUMS").write_text("".join(hashlib.sha256((out/n).read_bytes()).hexdigest()+"  "+n+"\n" for n in names),encoding="utf-8")
          print("P08_V012_FINAL_REAL_ZIPS_AND_OLD_OWNER_SCHEMA_ATOMIC=PASS")
          PY
          (cd "$out"; sha256sum -c SHA256SUMS)
          test "$(find "$out" -maxdepth 1 -type f | wc -l)" -eq 6
          echo P08_V012_OFFICIAL_PUBLISH_INPUT_REAL_SOURCE_BYTES_AND_OLD_OWNER=PASS
      - name: RELEASE WRITER CAPABILITY, final Git main and old channel fail-closed
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN" || { echo P08_RELEASE_WRITE_CAPABILITY_MISSING; exit 78; }
          for repo in llhzx2018/vf-adops llhzx2018/core-updates; do
            test "$(gh api "repos/$repo" --jq '.permissions.push // false')" = true ||
              { echo P08_RELEASE_WRITE_SCOPE_NOT_CONFIRMED; exit 78; }
          done
          test "$(gh api "repos/llhzx2018/vf-adops/git/ref/heads/main" --jq '.object.sha')" = "$P08_SOURCE"
          test "$(gh api "repos/llhzx2018/gov-doc/git/ref/heads/main" --jq '.object.sha')" = "$GOV_SOURCE"
          actual_sha="$(gh api 'repos/llhzx2018/core-updates/contents/projects/P08-ADOPS.json?ref=main' --jq '.sha')"
          test "$actual_sha" = 507f9e9b42e898c0087c761d4ea8d3cc48a59f45 ||
            { echo P08_OFFICIAL_CHANNEL_CHANGED_DURING_RELEASE; exit 78; }
          gh api 'repos/llhzx2018/core-updates/contents/projects/P08-ADOPS.json?ref=main' --jq '.content' |
            base64 -d > "$RUNNER_TEMP/p08-old-channel.json"
          test "$(jq -r '.target_version' "$RUNNER_TEMP/p08-old-channel.json")" = 0.1.1
          test "$(jq -r '.release_tag' "$RUNNER_TEMP/p08-old-channel.json")" = v0.1.1
          test "$(jq -r '.target_sha' "$RUNNER_TEMP/p08-old-channel.json")" = "$P08_PREVIOUS_SOURCE"
          test "$(jq -r '.from_versions|join(",")' "$RUNNER_TEMP/p08-old-channel.json")" = 0.1.0
          if gh api 'repos/llhzx2018/vf-adops/git/ref/tags/v0.1.2' >/dev/null 2>&1; then
            echo P08_012_FORMAL_TAG_PREEXISTS_REQUIRES_SEPARATE_VERIFICATION
            exit 79
          fi
          if gh release view v0.1.2 -R llhzx2018/vf-adops >/dev/null 2>&1; then
            echo P08_012_FORMAL_RELEASE_PREEXISTS_REQUIRES_SEPARATE_VERIFICATION
            exit 79
          fi
          echo P08_012_RELEASE_WRITE_SCOPE_AND_NO_REMOTE_DRIFT=PASS
      - name: Publish ONLY verified official private GitHub v0.1.2 Release and read back ALL asset bytes
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          repo=llhzx2018/vf-adops
          out="$RUNNER_TEMP/p08-v012-formal-private"
          cat > "$RUNNER_TEMP/P08_V012_RELEASE_NOTES.md" <<'NOTES'
          VF AdOps 0.1.2 | R101–R102 full business integration and schema-safe Atomic.

          Source identity: official immutable v0.1.2 Tag on P08 main; ten new additive database migrations.
          Install a new empty website ONLY using VF_AdOps_V0.1.2_FULL.zip.
          Existing v0.1.1 official FULL installations: NEVER overwrite old files/data with FULL.
          An exact-source 0.1.1 R102 compatibility Bridge FULL is provided for an Owner-controlled
          one-time OFFLINE activation with external nginx/cron/FPM drain and native backup FIRST.
          Only after Bridge activation can the authenticated Owner request the v0.1.2 Schema Atomic
          update, which verifies the fixed GitHub channel, official Release asset bytes/SHA256 and
          Owner private receipt, and performs native backup and fail-closed migration/recovery.
          The separate tested CloudPanel offline script is a manually invoked helper for the
          already-activated Bridge's pending Owner upgrade, NOT an automatic updater.
          Production was NOT touched by the release process; Owner's actual upgrade requires
          their own separate backup, CloudPanel stop/recovery and manual approval.
          Real provider accounts, OAuth reviews, actual CloudPanel VPS and human real-use
          are NOT claimed to be tested. Owner Preview POST_RELEASE_REQUIRED, Owner real use
          POST_PRODUCTION_REQUIRED, not PASS.
          NOTES
          gh release create v0.1.2 -R "$repo" --target "$P08_SOURCE" \
            --title 'VF AdOps v0.1.2 · 官方 FULL / 数据库 Atomic / 旧版兼容 Bridge' \
            --notes-file "$RUNNER_TEMP/P08_V012_RELEASE_NOTES.md" \
            "$out/VF_AdOps_V0.1.2_FULL.zip" \
            "$out/VF_AdOps_V0.1.2_UPDATE.zip" \
            "$out/VF_AdOps_V0.1.1_R102_BRIDGE_FULL.zip" \
            "$out/VF_AdOps_V0.1.2_CLOUDPANEL_OFFLINE_ONCE.sh" \
            "$out/RELEASE_PROVENANCE.json" \
            "$out/SHA256SUMS"
          test "$(gh api "repos/$repo/git/ref/tags/v0.1.2" --jq '.object.sha')" = "$P08_SOURCE"
          test "$(gh api "repos/$repo/git/ref/tags/v0.1.2" --jq '.object.type')" = commit
          test "$(gh api "repos/$repo/releases/tags/v0.1.2" --jq '.draft')" = false
          test "$(gh api "repos/$repo/releases/tags/v0.1.2" --jq '.prerelease')" = false
          test "$(gh api "repos/$repo/releases/tags/v0.1.2" --jq '.assets|length')" = 6
          remote="$RUNNER_TEMP/p08-v012-remote-official"
          mkdir -m 0700 "$remote"
          gh release download v0.1.2 -R "$repo" --dir "$remote" >/dev/null
          (cd "$remote"; sha256sum -c SHA256SUMS)
          for file in "$out"/*; do cmp "$file" "$remote/$(basename "$file")"; done
          gh api "repos/$repo/releases/tags/v0.1.2" > "$RUNNER_TEMP/p08-official-release-meta.json"
          echo P08_012_OFFICIAL_PRIVATE_TAG_RELEASE_SIX_ASSETS_REMOTE_BYTES_SHA256=PASS
      - name: Distribute only verified fixed GitHub Release via P08-ADOPS stable channel
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          repo=llhzx2018/vf-adops
          release="$RUNNER_TEMP/p08-official-release-meta.json"
          out="$RUNNER_TEMP/p08-v012-formal-private"
          oldSha="$P08_PREVIOUS_FULL_MANIFEST_SHA256"
          bridgeDir="$RUNNER_TEMP/p08-v011-r102-bridge-extracted"
          bridgeSha="$(jq -r '.source_sha' "$bridgeDir/FULL_MANIFEST.json")"
          bridgeManifest="$(sha256sum "$bridgeDir/FULL_MANIFEST.json" | cut -d ' ' -f1)"
          zipName="VF_AdOps_V0.1.2_UPDATE.zip"
          fullName="VF_AdOps_V0.1.2_FULL.zip"
          updateId="$(jq -r --arg n "$zipName" '[.assets[]|select(.name==$n)]|if length==1 then .[0].id else error("bad update count") end' "$release")"
          fullId="$(jq -r --arg n "$fullName" '[.assets[]|select(.name==$n)]|if length==1 then .[0].id else error("bad full count") end' "$release")"
          relId="$(jq -r .id "$release")"
          test "$updateId" -gt 0 && test "$fullId" -gt 0 && test "$relId" -gt 0
          for name in "$zipName" "$fullName"; do
            metaSha="$(jq -r --arg n "$name" '.assets[]|select(.name==$n)|.digest // empty' "$release")"
            localSha="$(sha256sum "$out/$name" | cut -d ' ' -f1)"
            test -z "$metaSha" || test "$metaSha" = "sha256:$localSha"
            metadataSize="$(jq -r --arg n "$name" '.assets[]|select(.name==$n)|.size' "$release")"
            test "$metadataSize" = "$(stat -c %s "$out/$name")"
            test "$(jq -r --arg n "$name" '.assets[]|select(.name==$n)|.content_type' "$release")" = application/zip
          done
          updateSha="$(sha256sum "$out/$zipName" | cut -d' ' -f1)"
          fullSha="$(sha256sum "$out/$fullName" | cut -d' ' -f1)"
          updateBytes="$(stat -c %s "$out/$zipName")"
          fullBytes="$(stat -c %s "$out/$fullName")"
          jq -n --arg target "$P08_SOURCE" --arg old "$P08_PREVIOUS_SOURCE" \
            --arg oldHash "$oldSha" --arg bridge "$bridgeSha" --arg bridgeHash "$bridgeManifest" \
            --arg updateSha "$updateSha" --arg fullSha "$fullSha" \
            --arg updateName "$zipName" --arg fullName "$fullName" \
            --argjson releaseId "$relId" --argjson updateId "$updateId" \
            --argjson fullId "$fullId" --argjson updateBytes "$updateBytes" \
            --argjson fullBytes "$fullBytes" \
            '{
              schema_version:"1.0",project_id:"P08",component_id:"APP",
              repository:"llhzx2018/vf-adops",project_slug:"vf-adops",
              enabled:true,update_type:"ATOMIC",channel:"stable",
              backup_required:true,rollback_supported:true,
              signature_required:false,signature_algorithm:null,
              from_versions:["0.1.1"],target_version:"0.1.2",
              flat_source_sha:$old,source_sha:$old,
              flat_full_manifest_sha256:$oldHash,source_full_manifest_sha256:$oldHash,
              bridge_sha:$bridge,bridge_full_manifest_sha256:$bridgeHash,
              target_sha:$target,asset_sha256:$updateSha,full_asset_sha256:$fullSha,
              schema_from:"1.0",schema_to:"1.1",release_tag:"v0.1.2",
              release_id:$releaseId,asset_id:$updateId,asset_name:$updateName,
              asset_bytes:$updateBytes,full_asset_id:$fullId,full_asset_name:$fullName,
              full_asset_bytes:$fullBytes,minimum_php:"8.4.1",
              production_auto_apply:false,owner_bridge_activation:"MANUAL_OFFLINE_BACKUP_FIRST",
              notes:"P08 0.1.2 仅支持正式旧 0.1.1 + 兼容 Bridge 的备份优先 Schema Atomic；正式站 Owner 手工离线停写及升级，FULL 仅新站。"
            }' > "$RUNNER_TEMP/p08-v012-channel.json"
          # Re-verify the exact running PHP release metadata gate with REAL
          # GitHub Release and actual Tag metadata, not synthetic JSON.
          gh api "repos/$repo/git/ref/tags/v0.1.2" > "$RUNNER_TEMP/p08-v012-tag.json"
          php -r '
            require $argv[1]."/vendor/autoload.php";
            require $argv[1]."/src/Support/Autoload.php";
            $channel=json_decode(file_get_contents($argv[2]),true);
            $release=json_decode(file_get_contents($argv[3]),true);
            $tag=json_decode(file_get_contents($argv[4]),true);
            $bridge=["status"=>"R102_PUBLISHED_011_COMPAT_BRIDGE_READY",
              "source_version"=>"0.1.1","target_version"=>"0.1.2",
              "old_source_sha"=>"9c7f76434fe2d064f2f1ac15c58a760f778cf055",
              "old_full_manifest_sha256"=>$channel["source_full_manifest_sha256"],
              "bridge_sha"=>$channel["bridge_sha"],
              "bridge_full_manifest_sha256"=>$channel["bridge_full_manifest_sha256"],
              "driver"=>"sqlite"];
            $r=(new VF\AdOps\Upgrade\R102OfficialReleaseGate())->verify($channel,$release,$tag,$bridge);
            if(($r["status"]??null)!=="R102_OFFICIAL_METADATA_VERIFIED_ASSETS_NOT_DOWNLOADED"
              ||($r["can_install"]??true)!==false)exit(79);
            echo "P08_REAL_OFFICIAL_V012_RUNNING_READER_GATE=PASS\n";
          ' "$PWD/private-p08-v012" "$RUNNER_TEMP/p08-v012-channel.json" \
            "$release" "$RUNNER_TEMP/p08-v012-tag.json"
          oldRemoteSha="$(gh api 'repos/llhzx2018/core-updates/contents/projects/P08-ADOPS.json?ref=main' --jq '.sha')"
          test "$oldRemoteSha" = 507f9e9b42e898c0087c761d4ea8d3cc48a59f45
          encoded="$(base64 -w0 "$RUNNER_TEMP/p08-v012-channel.json")"
          gh api -X PUT 'repos/llhzx2018/core-updates/contents/projects/P08-ADOPS.json' \
            -f branch=main \
            -f message='Publish P08 AdOps v0.1.2 verified schema Atomic channel from official GitHub Release' \
            -f sha="$oldRemoteSha" \
            -f content="$encoded" > "$RUNNER_TEMP/p08-v012-channel-write-receipt.json"
          gh api 'repos/llhzx2018/core-updates/contents/projects/P08-ADOPS.json?ref=main' --jq '.content' |
            base64 -d > "$RUNNER_TEMP/p08-v012-channel-remote.json"
          cmp "$RUNNER_TEMP/p08-v012-channel.json" "$RUNNER_TEMP/p08-v012-channel-remote.json"
          test "$(jq -r '.target_version' "$RUNNER_TEMP/p08-v012-channel-remote.json")" = 0.1.2
          test "$(jq -r '.from_versions|join(",")' "$RUNNER_TEMP/p08-v012-channel-remote.json")" = 0.1.1
          echo P08_012_OFFICIAL_CORE_UPDATES_P08_ADOPS_CHANNEL_REMOTE_READBACK=PASS
          echo P08_V012_FORMAL_RELEASE_AND_DISTRIBUTION=PASS
          echo P08_OWNER_PRODUCTION=NOT_TOUCHED
      - name: Always erase private source, old Owner data and transient published byte copies
        if: always()
        run: |
          rm -rf "$GITHUB_WORKSPACE/private-p08-v012" "$GITHUB_WORKSPACE/gov-v311" \
            "$RUNNER_TEMP/p08-v012-real-official-011" \
            "$RUNNER_TEMP/p08-v012-clean-git" "$RUNNER_TEMP/p08-v011-published-source" \
            "$RUNNER_TEMP/p08-v012-formal-private" "$RUNNER_TEMP/p08-v012-extracted" \
            "$RUNNER_TEMP/p08-v011-r102-bridge-extracted" "$RUNNER_TEMP/p08-v011-real-owner" \
            "$RUNNER_TEMP/p08-v012-remote-official"
          rm -f "$RUNNER_TEMP"/p08-*.log "$RUNNER_TEMP"/p08-v012-*.json \
            "$RUNNER_TEMP/p08-official-release-meta.json" "$RUNNER_TEMP/p08-old-channel.json" \
            "$RUNNER_TEMP/P08_V012_RELEASE_NOTES.md"
          echo P08_V012_PRIVATE_SOURCE_AND_INSTALLED_OWNER_FIXTURE_REMOVED=YES
