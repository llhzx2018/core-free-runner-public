name: P07 D04 private static refresh pure unit safety
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-m03-d04-online-static-unit-20261116.yml'
permissions:
  contents: read
jobs:
  pure-static-unit:
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout public test workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Transient exact P07 source for pure unit tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: fbe40d18e41baaad49f67eb6b41bc08f24313221
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: .p07-private-unit
      - name: Run bounded pure Python regression without external resources
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-private-unit rev-parse HEAD)" = fbe40d18e41baaad49f67eb6b41bc08f24313221
          cd .p07-private-unit
          export PYTHONPATH="$PWD/lib"
          python3 -B -m unittest discover -s tests -p test_p07_m03_d04_prepared_static_online_snapshot.py -v
          python3 -B -m unittest discover -s tests -p test_p07_m03_d04_single_site_cutover_guard.py -v
          python3 -B scripts/check_p07_modules.py --module P07-M03-D04 \
            --pr-title 'P07-M03-D04 服务器迁移：静态站私有补拉快照' \
            --changed-file lib/migration_prepared_static_snapshot.py \
            --changed-file lib/server_migration_pull.py \
            --changed-file tests/test_p07_m03_d04_prepared_static_online_snapshot.py \
            --affected P07-M03-D04 --shared-reason '仅 D04 私有缓存，不变更其他主模块'
          echo P07_D04_STATIC_ONLINE_REFRESH_UNIT_ONLY=PASS
      - name: Always clean private source
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- .p07-private-unit
          test ! -e .p07-private-unit
          echo P07_D04_PRIVATE_SOURCE_CLEAN=PASS
