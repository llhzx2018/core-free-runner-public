name: P01 V2.47.10 Candidate Gate

on:
  pull_request:
    paths:
      - '.github/workflows/p01-v24710-candidate-gate.yml'

permissions:
  contents: read

concurrency:
  group: p01-v24710-candidate-gate
  cancel-in-progress: false

jobs:
  candidate:
    if: github.head_ref == 'temp/p01-v24710-candidate-gate-20260915'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      ENGINEERING_SHA: 238e44b35609949c80809bda47ecbbab8a85046c
      TARGET_BRANCH: release/v2.47.10-candidate-20260915
      SOURCE_TAG: v2.47.9
      SOURCE_SHA: 89df52cede9f03c88627396e66afe97325214353
      SOURCE_VERSION: 2.47.9
      TARGET_VERSION: 2.47.10
      EXPECTED_SCHEMA: '2026090401'
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}

    steps:
      - name: Exact authority and release preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN" && test -n "$RELEASE_TOKEN"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/main" --jq '.object.sha')" = "$ENGINEERING_SHA"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/tags/${SOURCE_TAG}" --jq '.object.sha')" = "$SOURCE_SHA"
          if GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/${TARGET_BRANCH}" >/dev/null 2>&1; then echo BLOCK=CANDIDATE_BRANCH_ALREADY_EXISTS; exit 81; fi
          if GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/tags/v${TARGET_VERSION}" >/dev/null 2>&1; then echo BLOCK=TARGET_TAG_ALREADY_EXISTS; exit 82; fi
          test "$(GH_TOKEN="$RELEASE_TOKEN" gh api "repos/${PRODUCT_REPO}" --jq '.permissions.push')" = true
          echo OWNER_PREVIEW_RUNTIME_APPLICABILITY=N_A
          echo P01_V24710_AUTHORITY=PASS

      - name: Checkout exact engineering source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.ENGINEERING_SHA }}
          token: ${{ env.RELEASE_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: vf-start

      - name: Create exact V2.47.10 candidate
        working-directory: vf-start
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$ENGINEERING_SHA"
          test "$(tr -d '\r\n ' < VERSION)" = "$SOURCE_VERSION"
          test "$(tr -d '\r\n ' < src/VERSION.txt)" = "$SOURCE_VERSION"
          grep -Fq "define('VF_VERSION', '${SOURCE_VERSION}');" src/app/bootstrap.php
          printf '%s\n' "$TARGET_VERSION" > VERSION
          printf '%s\n' "$TARGET_VERSION" > src/VERSION.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/bootstrap.php'); s=p.read_text(encoding='utf-8')
          old="define('VF_VERSION', '2.47.9');"; new="define('VF_VERSION', '2.47.10');"
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          p=Path('CHANGELOG.md'); s=p.read_text(encoding='utf-8')
          prefix='''# V2.47.10\n\n- R25：加强资源质量治理；Pending 只属于系统 Inbox，不进入 Navigation / Tools / Software 等正式日常 presentation 与统计。\n- R25：确定性 URL 结构优先于陈旧分类历史；YouTube 创作者主页进入 Channels 建议，已确认影视详情/播放路径进入 Watch 建议；无法独立确认 media kind 时保持在自动批处理门槛以下。\n- R25：canonical intake 拒绝新的 VF Start 内部产品自链接；默认 URL 重复检测按全局 URL identity，而不是按 Start 分类隔离。\n- R26：全局账户/管理动作统一到右上角；设置/退出保持直达，资源管理/回收站收进一个可访问的“···”菜单，侧栏底部不再形成第二全局操作区。\n- R26：匿名登录区移除仅登录态需要的分隔/阴影/偏移，Desktop / Mobile 保持可达且无横向溢出。\n- Schema 仍为 `2026090401`，Migration `NONE`；V2.47.10 只允许正式验证的 `2.47.9 → 2.47.10` 单跳在线更新。\n\n'''
          assert not s.startswith('# V2.47.10\n')
          p.write_text(prefix+s,encoding='utf-8')
          PY
          mkdir -p docs/release
          cat > docs/release/V2.47.10_RELEASE_GATE.md <<'EOF'
          # P01 · V2.47.10 Release Gate

          ## Owner Preview Applicability

          `OWNER_PREVIEW_RUNTIME_APPLICABILITY = N_A`

          Reason: V2.47.10 is a bounded maintenance release for resource-quality guards and shared Header/global-action UX. The Owner explicitly authorized this release chain with “继续下一轮，完成了就发布”. P01 has no separate supported preview distribution runtime; its installed updater consumes stable single-hop releases. Creating a second preview distribution path only for this maintenance round would add a new mechanism without product value. Exact Candidate Fresh Install, browser E2E, responsive geometry, focused resource contracts, strict UPDATE, existing-data preservation, backup/rollback and remote byte readback remain mandatory. Owner real-use after release remains authoritative and may still reject the result.

          ## Public Authority Applicability

          | Domain | State | Release obligation |
          |---|---|---|
          | INSTALL | REQUIRED | Clean FULL, setup/admin init/login/setup lock |
          | SECURITY | REQUIRED | auth/session/CSRF boundaries unchanged; package safety; no private/runtime/user data in artifacts |
          | TESTING | REQUIRED | syntax, focused contracts, runtime, browser, install and update evidence |
          | UPGRADE | REQUIRED | strict 2.47.9 → 2.47.10 Atomic update, preflight, backup/rollback/readback |
          | DATA_SCHEMA | REQUIRED | existing SQLite preserved; schema 2026090401 unchanged; no user/runtime data in packages |
          | API_PROVIDER | N_A | no provider/API capability change |
          | SEO | N_A | no indexing/canonical/metadata change |
          | CRON_JOB | N_A | no scheduler/background-job change |
          | NOTIFICATION | N_A | no notification capability change |
          | OBSERVABILITY | N_A | no Production write in this release gate |
          | PERFORMANCE | N_A | no capacity/performance-sensitive change |
          | GIT | REQUIRED | exact source, candidate, tag/release and remote readback |
          | UA_UI | REQUIRED | shared Header/global actions, Pending visibility, desktop/mobile reachability and no horizontal overflow |

          ## Stable Product Boundary

          - Previous stable: `v2.47.9`
          - Target: `v2.47.10`
          - Schema: `2026090401 → 2026090401`
          - Migration: `NONE`
          - Canonical data/storage/privacy authority: unchanged
          - Pending Authority: existing `links.is_pending`
          - Update route: strict one-hop `2.47.9 → 2.47.10`
          - Production: separate; Release/Distribution do not claim installed Production
          EOF
          git config user.name 'VF Release Runner'
          git config user.email 'vf-release-runner@users.noreply.github.com'
          git checkout -b "$TARGET_BRANCH"
          git add VERSION src/VERSION.txt src/app/bootstrap.php CHANGELOG.md docs/release/V2.47.10_RELEASE_GATE.md
          git commit -m 'release(P01): prepare V2.47.10 candidate'
          CANDIDATE_SHA=$(git rev-parse HEAD)
          echo "CANDIDATE_SHA=$CANDIDATE_SHA" >> "$GITHUB_ENV"
          git remote set-url origin "https://x-access-token:${RELEASE_TOKEN}@github.com/${PRODUCT_REPO}.git"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/${TARGET_BRANCH}" --jq '.object.sha')" = "$CANDIDATE_SHA"
          echo "P01_V24710_CANDIDATE_SHA=$CANDIDATE_SHA"

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd
          coverage: none

      - name: Exact identity and static contracts
        working-directory: vf-start
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(tr -d '\r\n ' < VERSION)" = "$TARGET_VERSION"
          test "$(tr -d '\r\n ' < src/VERSION.txt)" = "$TARGET_VERSION"
          grep -Fq "define('VF_VERSION', '${TARGET_VERSION}');" src/app/bootstrap.php
          test "$(php -r '$p=json_decode(file_get_contents("VF_PROJECT.json"),true); echo $p["working_schema_version"];')" = "$EXPECTED_SCHEMA"
          mapfile -t changed < <(git diff --name-only "$ENGINEERING_SHA"..HEAD | sort)
          printf '%s\n' "${changed[@]}" >/tmp/changed
          printf '%s\n' CHANGELOG.md VERSION docs/release/V2.47.10_RELEASE_GATE.md src/VERSION.txt src/app/bootstrap.php >/tmp/expected
          diff -u /tmp/expected /tmp/changed
          find src -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/php-lint
          find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          php tests/unit/pending_inbox_presentation_contract.php | grep -Fx 'P01_PENDING_INBOX_PRESENTATION_CONTRACT=PASS'
          php tests/unit/resource_quality_governance_contract.php | grep -Fx 'P01_RESOURCE_QUALITY_GOVERNANCE_CONTRACT=PASS'
          php tests/unit/resource_intake_quality_contract.php | grep -Fx 'P01_RESOURCE_INTAKE_QUALITY_CONTRACT=PASS'
          php tests/unit/pending_workspace_visibility_contract.php | grep -Fx 'P01_PENDING_WORKSPACE_VISIBILITY_CONTRACT=PASS'
          php tests/unit/global_account_actions_contract.php | grep -Fx 'P01_R22_GLOBAL_ACCOUNT_ACTIONS_CONTRACT=PASS'
          grep -Fq 'OWNER_PREVIEW_RUNTIME_APPLICABILITY = N_A' docs/release/V2.47.10_RELEASE_GATE.md
          echo P01_V24710_STATIC=PASS
          echo DATA_SCHEMA_CHANGE=NONE

      - name: Fresh install and representative resource seed
        working-directory: vf-start
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-v24710-runtime /tmp/p01-v24710-pw
          cp -a src /tmp/p01-v24710-runtime
          cd /tmp/p01-v24710-runtime
          php -S 127.0.0.1:18131 -t . >/tmp/p01-v24710-server.log 2>&1 & echo $! >/tmp/p01-v24710-server.pid
          for i in $(seq 1 30); do if curl -fsS -c /tmp/p01-v24710.cookies -b /tmp/p01-v24710.cookies http://127.0.0.1:18131/setup.php -o /tmp/p01-v24710-setup.html; then break; fi; sleep 1; done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-v24710-setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          PASS="Gate${GITHUB_RUN_ID}V24710x"; printf '%s' "$PASS" >/tmp/p01-v24710.password
          curl -fsS -L -c /tmp/p01-v24710.cookies -b /tmp/p01-v24710.cookies -X POST http://127.0.0.1:18131/setup.php --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=VF Start V24710 Gate' --data-urlencode "admin_password=$PASS" --data-urlencode "admin_password_confirm=$PASS" -o /tmp/p01-v24710-post.html
          php cli/verify.php | grep -Fx 'VERIFY_PASS=YES'
          code=$(curl -sS -o /tmp/revisit -D /tmp/revisit.h -w '%{http_code}' http://127.0.0.1:18131/setup.php); test "$code" = 302
          tr -d '\r' </tmp/revisit.h | grep -Eiq '^Location: /$'
          php -r 'require "app/bootstrap.php"; require "app/SurfaceRepository.php"; $r=new VfRepository(vf_db()); $r->createCategory(["name"=>"V24710 Gate Category","is_private"=>false,"sort_order"=>0]); $db=vf_db(); $q=$db->prepare("SELECT id FROM categories WHERE name=? ORDER BY id DESC LIMIT 1"); $q->execute(["V24710 Gate Category"]); $cid=(int)$q->fetchColumn(); if($cid<=0) exit(2); $r->saveLink(null,["surface"=>"start","category_id"=>$cid,"title"=>"V24710 Visible Resource","url"=>"https://example.com/v24710-visible","is_private"=>0],"manual"); $x=$r->savePendingCapture(["url"=>"https://example.com/v24710-pending","title"=>"V24710 Pending Resource"],"mobile-quick-save"); if((int)($x["id"]??0)<=0) exit(3); echo "P01_V24710_SEED=PASS\n";'
          echo P01_V24710_INSTALL=PASS

      - name: Browser proof for Pending isolation and global actions
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-v24710-pw && cd /tmp/p01-v24710-pw
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > verify.mjs <<'JS'
          import {chromium} from 'playwright';import fs from 'node:fs';
          const base='http://127.0.0.1:18131/',password=fs.readFileSync('/tmp/p01-v24710.password','utf8');
          const browser=await chromium.launch({headless:true});
          const ctx=await browser.newContext({viewport:{width:1291,height:797}});const p=await ctx.newPage();
          await p.goto(base+'start.php',{waitUntil:'networkidle'});
          const anon=await p.evaluate(()=>{const q=s=>document.querySelector(s);const a=q('.vf-global-account-actions');const login=q('[data-vf-auth-login]');return{anonymous:a?.classList.contains('is-anonymous')||false,login:login?.textContent.trim(),overflow:!!q('.vf-global-account-overflow'),docOverflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,rightGap:a?Math.round(innerWidth-a.getBoundingClientRect().right):999};});
          if(!anon.anonymous||anon.login!=='登录'||anon.overflow||anon.docOverflow>1||anon.rightGap>20)throw new Error('anonymous '+JSON.stringify(anon));
          await p.click('[data-vf-auth-login]');await p.fill('[data-vf-auth-dialog] input[name="password"]',password);await p.click('[data-vf-auth-submit]');await p.waitForSelector('.vf-global-account-actions a[href="settings.php"]',{timeout:15000});
          const auth=await p.evaluate(()=>{const q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)];const side=qa('.vf-functional-sidebar .vf-sidebar-bottom>a').map(a=>({text:a.textContent.trim(),display:getComputedStyle(a).display}));return{settings:q('.vf-global-account-actions>a[href="settings.php"]')?.textContent.trim(),logout:q('.vf-global-account-actions>[data-vf-auth-logout]')?.textContent.trim(),more:!!q('.vf-global-account-more'),side,docOverflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,pendingVisible:document.body.textContent.includes('V24710 Pending Resource'),visibleVisible:document.body.textContent.includes('V24710 Visible Resource')};});
          if(auth.settings!=='设置'||auth.logout!=='退出'||!auth.more||auth.side.some(x=>x.display!=='none')||auth.docOverflow>1||auth.pendingVisible||!auth.visibleVisible)throw new Error('authenticated '+JSON.stringify(auth));
          await p.click('.vf-global-account-more');await p.waitForSelector('.vf-global-account-menu:not([hidden])');
          const menu=await p.evaluate(()=>({expanded:document.querySelector('.vf-global-account-more')?.getAttribute('aria-expanded'),items:[...document.querySelectorAll('.vf-global-account-menu>a')].map(a=>[a.textContent.trim(),a.getAttribute('href')])}));
          if(menu.expanded!=='true'||JSON.stringify(menu.items)!==JSON.stringify([['资源管理','surface-manager.php?advanced=1'],['回收站','recycle-bin.php']]))throw new Error('menu '+JSON.stringify(menu));
          await p.keyboard.press('Escape');if(await p.getAttribute('.vf-global-account-more','aria-expanded')!=='false')throw new Error('escape did not close overflow');
          await p.goto(base+'surface-manager.php',{waitUntil:'networkidle'});await p.waitForSelector('.vf-pending-inbox-intro');
          const inbox=await p.evaluate(()=>({pending:document.body.textContent.includes('V24710 Pending Resource'),overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}));
          if(!inbox.pending||inbox.overflow>1)throw new Error('inbox '+JSON.stringify(inbox));
          await p.setViewportSize({width:390,height:844});await p.goto(base+'start.php',{waitUntil:'networkidle'});await p.waitForSelector('.vf-global-account-more');
          const mobile=await p.evaluate(()=>({overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,moreRect:document.querySelector('.vf-global-account-more')?.getBoundingClientRect().toJSON(),pendingVisible:document.body.textContent.includes('V24710 Pending Resource')}));
          if(mobile.overflow>1||mobile.pendingVisible||!mobile.moreRect||mobile.moreRect.right>391)throw new Error('mobile '+JSON.stringify(mobile));
          await p.click('.vf-global-account-more');await p.waitForSelector('.vf-global-account-menu:not([hidden])');
          const mm=await p.evaluate(()=>{const r=document.querySelector('.vf-global-account-menu')?.getBoundingClientRect();return r?{left:r.left,right:r.right,width:r.width}:null});
          if(!mm||mm.left<0||mm.right>391)throw new Error('mobile menu '+JSON.stringify(mm));
          console.log('P01_V24710_BROWSER='+JSON.stringify({anon,auth,menu,inbox,mobile,mm}));await browser.close();
          JS
          node verify.mjs | tee /tmp/p01-v24710-browser
          grep -F 'P01_V24710_BROWSER=' /tmp/p01-v24710-browser
          cd /tmp/p01-v24710-runtime
          php -r 'require "app/bootstrap.php"; $db=vf_db(); $q=$db->prepare("SELECT is_pending FROM links WHERE url=? AND lifecycle_state=\"active\""); $q->execute(["https://example.com/v24710-pending"]); $v=$q->fetchColumn(); if($v===false||(int)$v!==1) exit(2); echo "P01_V24710_PENDING_AUTHORITY=PASS\n";'
          echo P01_V24710_BROWSER_GATE=PASS

      - name: Final candidate verdict
        run: |
          echo PUBLIC_AUTHORITY_INSTALL=PASS
          echo PUBLIC_AUTHORITY_SECURITY=PASS_BOUNDARY_UNCHANGED
          echo PUBLIC_AUTHORITY_TESTING=PASS
          echo PUBLIC_AUTHORITY_GIT=PASS
          echo PUBLIC_AUTHORITY_UA_UI=PASS
          echo PUBLIC_AUTHORITY_UPGRADE=PENDING_FORMAL_ARTIFACT_GATE
          echo PUBLIC_AUTHORITY_DATA_SCHEMA=PENDING_FORMAL_ARTIFACT_GATE
          echo OWNER_PREVIEW_RUNTIME_APPLICABILITY=N_A
          echo OWNER_REAL_USE=POST_RELEASE_PENDING
          echo P01_V24710_CANDIDATE_GATE=PASS
          echo FORMAL_RELEASE=false
          echo DISTRIBUTION=false
          echo PRODUCTION=false

      - name: Cleanup
        if: always()
        run: |
          if test -f /tmp/p01-v24710-server.pid; then kill "$(cat /tmp/p01-v24710-server.pid)" 2>/dev/null || true; fi
          rm -rf vf-start /tmp/p01-v24710-* /tmp/changed /tmp/expected /tmp/php-lint
