name: P01 V2.36.3 Formal Bind Gate
on:
  push:
    branches: [release/p01-v2363-candidate-20260901]
    paths: [.github/workflows/p01-v2363-formal-bind-gate-20260901.yml]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      BOUND: 718e043e3715ef7b21849bc08634fca89bf92c1f
      CANDIDATE: d49a2a2be8c6c0386e03b0c880f1e6024396e4e0
      DEVELOP: 0b2890fed3153086be1c77fe2a3f119264dc24a2
      RUNTIME_TREE: 820724b585cb59864211f77c4fb33537b2345029
      CANDIDATE_RUN: '33501907010'
      CANDIDATE_ARTIFACT: '9798055642'
      CANDIDATE_DIGEST: 39225162784a38693175524142643866e8fafd9ed528324aa5fb4896829eacaa
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.BOUND }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
      - name: Exact formal bind and concurrency fence
        shell: bash
        run: |
          set -Eeuo pipefail
          E=/tmp/p01-v2363-formal-bind; rm -rf "$E"; mkdir -p "$E"
          test "$(git rev-parse HEAD)" = "$BOUND"
          test "$(git rev-parse HEAD^)" = "$CANDIDATE"
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          test "$(git diff --name-only "$CANDIDATE..$BOUND" | tr '\n' ' ')" = 'VF_PROJECT.json '
          LIVE_DEVELOP=$(git ls-remote origin refs/heads/develop | cut -f1)
          test "$LIVE_DEVELOP" = "$DEVELOP"
          test "$(cat VERSION)" = '2.36.3'
          test "$(cat src/VERSION.txt)" = '2.36.3'
          grep -Fx "define('VF_VERSION', '2.36.3');" src/app/bootstrap.php >/dev/null
          python3 -m json.tool VF_PROJECT.json >/dev/null
          jq -e --arg run "$CANDIDATE_RUN" --arg art "$CANDIDATE_ARTIFACT" --arg digest "$CANDIDATE_DIGEST" '
            .candidate_version=="2.36.3" and
            .schema_version=="2026082901" and
            .production_version=="2.36.2" and
            .v2_36_3_candidate_gate.state=="PASS" and
            (.v2_36_3_candidate_gate.candidate_readiness_run|tostring)==$run and
            (.v2_36_3_candidate_gate.artifact|tostring)==$art and
            .v2_36_3_candidate_gate.artifact_sha256==$digest and
            .v2_36_3_candidate_gate.candidate=="d49a2a2be8c6c0386e03b0c880f1e6024396e4e0" and
            .v2_36_3_candidate_gate.runtime_tree=="820724b585cb59864211f77c4fb33537b2345029" and
            .v2_36_3_candidate_gate.runtime_delta_count==7 and
            .v2_36_3_candidate_gate.runtime_added==[] and
            .v2_36_3_candidate_gate.runtime_removed==[] and
            .v2_36_3_candidate_gate.full_zip_sha256=="337513f31235d92deba9def79c8b8519502ae26850ef46408df0258c879dd0ca" and
            .v2_36_3_candidate_gate.update_zip_sha256=="d3eefd09548cc731f3b01de502ce106bc48fe890063aebcfe1a2d6de5ed031c8" and
            .v2_36_3_candidate_gate.repair_php_sha256=="5ea94b161aa3e8255a1a5330ffc3e8cf57a25166f756e74e6d95dcf6dcc3cb85" and
            .v2_36_3_candidate_gate.atomic_upgrade=="V2.36.2 -> V2.36.3 PASS" and
            .v2_36_3_candidate_gate.visual_readback=="PASS / 390 + 1440 screenshots manually reviewed" and
            .v2_36_3_candidate_gate.harness_r1_classification|startswith("HARNESS-ONLY") and
            .v2_36_3_candidate_gate.owner_production_write==false and
            .v2_36_3_candidate_gate.release_published==false
          ' VF_PROJECT.json >/dev/null
          python3 - <<'PY'
          import json,urllib.request
          r=json.load(urllib.request.urlopen('https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/runs/33501907010'))
          assert r['conclusion']=='success' and r['name']=='P01 V2.36.3 Candidate Readiness R2'
          a=json.load(urllib.request.urlopen('https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/runs/33501907010/artifacts'))['artifacts']
          a=[x for x in a if x['id']==9798055642][0]
          assert a['digest']=='sha256:39225162784a38693175524142643866e8fafd9ed528324aa5fb4896829eacaa' and not a['expired']
          print('REMOTE_R2=PASS')
          PY
          git diff --check "$CANDIDATE..$BOUND"
          git diff --name-only "$DEVELOP..$BOUND" | sort | tee "$E/develop-delta.txt"
          printf '%s\n' CHANGELOG.md VERSION VF_PROJECT.json src/VERSION.txt src/app/bootstrap.php | sort >"$E/expected.txt"
          diff -u "$E/expected.txt" "$E/develop-delta.txt"
          for p in src/app/FunctionalWorkspace.php src/assets/workspace-domain-nav.css src/index.php src/start.php src/surface.php; do
            test "$(git rev-parse "$DEVELOP:$p")" = "$(git rev-parse "$BOUND:$p")"
          done
          printf 'P01_V2363_FORMAL_BIND_GATE=PASS\nBOUND=%s\nCANDIDATE=%s\nRUNTIME_TREE=%s\nDEVELOP=%s\nLIVE_DEVELOP=%s\nDEVELOP_DELTA=5\nCANDIDATE_METADATA_ONLY=PASS\nREMOTE_R2=PASS\nMAIN_WRITE=NO\nRELEASE_PUBLISHED=NO\nOWNER_PRODUCTION_WRITE=NO\n' "$BOUND" "$CANDIDATE" "$RUNTIME_TREE" "$DEVELOP" "$LIVE_DEVELOP" | tee "$E/verdict.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2363-formal-bind-${{ github.run_id }}
          path: /tmp/p01-v2363-formal-bind
          if-no-files-found: error
          retention-days: 90
