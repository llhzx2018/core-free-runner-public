name: P05 Single Product Phase1 Writer

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p05-single-product-phase1-writer.yml'
      - 'scripts/p05-single-product-phase1-writer.py'

permissions:
  contents: read

jobs:
  write:
    if: github.event.pull_request.head.ref == 'write/p05-single-product-phase1-20260902'
    runs-on: ubuntu-24.04
    steps:
      - name: Verify private write capability
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$WRITE_TOKEN"
          echo 'P05_SINGLE_PRODUCT_WRITE_CAPABILITY=PASS'

      - name: Checkout disposable writer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact P05 product branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: product/single-product-consolidation-phase1-20260902
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 1
          path: p05

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: p05/package-lock.json

      - name: Bind exact Product base
        run: |
          set -Eeuo pipefail
          test "$(git -C p05 rev-parse HEAD)" = '2518a8c07fc516de714d275327df49359e9e4719'
          test "$(cat p05/VERSION)" = '1.2.3'
          echo 'P05_SINGLE_PRODUCT_BASE=PASS'

      - name: Apply phase1 consolidation
        run: |
          set -Eeuo pipefail
          python3 scripts/p05-single-product-phase1-writer.py
          git -C p05 diff --check
          mapfile -t changed < <(git -C p05 status --porcelain | sed -E 's/^.. //' | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 4
          expected=(
            'src/client/CommonSystemCenter.tsx'
            'src/client/ProductApp.tsx'
            'src/client/main.tsx'
            'tests/contract/single-product-shell.test.ts'
          )
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done
          test "$(cat p05/VERSION)" = '1.2.3'
          echo 'P05_SINGLE_PRODUCT_SCOPE=PASS'

      - name: Install dependencies
        working-directory: p05
        run: npm ci

      - name: Verify single-product contract
        working-directory: p05
        run: |
          set -Eeuo pipefail
          npm run typecheck
          node --import tsx --test --test-concurrency=1 tests/contract/single-product-shell.test.ts
          npm run build
          ! grep -R -F '新版工作区 Preview' dist
          ! grep -R -F '返回经典工作区' dist
          ! grep -R -F 'Product Optimization Preview' dist
          echo 'P05_SINGLE_PRODUCT_BUILD=PASS'

      - name: Commit and push private Product candidate
        run: |
          set -Eeuo pipefail
          git -C p05 config user.name 'VictorForge'
          git -C p05 config user.email 'llhzx2018@gmail.com'
          git -C p05 add src/client/main.tsx src/client/ProductApp.tsx src/client/CommonSystemCenter.tsx tests/contract/single-product-shell.test.ts
          git -C p05 commit -m 'refactor(P05): make Product workspace canonical'
          git -C p05 push origin HEAD:product/single-product-consolidation-phase1-20260902
          echo "P05_SINGLE_PRODUCT_CANDIDATE_SHA=$(git -C p05 rev-parse HEAD)"
          echo "P05_SINGLE_PRODUCT_CANDIDATE_TREE=$(git -C p05 rev-parse HEAD^{tree})"
          echo 'P05_SINGLE_PRODUCT_RELEASE_WRITE=0'
          echo 'P05_SINGLE_PRODUCT_PRODUCTION_WRITE=0'
