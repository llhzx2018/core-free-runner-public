name: core-agent V0.7 Private VF Write Machine Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/core-agent-v0.7-private-write-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CORE_AGENT_SOURCE_SHA: 126c77803ef28ac159a7508c51b751a52f7a3363
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN || secrets.CORE_AGENT_RUNNER_TOKEN || secrets.VF_START_RUNNER_TOKEN }}
      PRIVATE_WRITE_TOKEN: ${{ secrets.VF_PRIVATE_WRITE_TOKEN || secrets.CORE_AGENT_WRITE_TOKEN || secrets.VF_PRIVATE_READ_TOKEN || secrets.CORE_AGENT_RUNNER_TOKEN || secrets.VF_START_RUNNER_TOKEN }}
    steps:
      - name: Verify private source read credential
        shell: bash
        run: |
          if [ -z "$PRIVATE_READ_TOKEN" ]; then
            echo "RUNNER_INFRASTRUCTURE_BLOCK=PRIVATE_READ_TOKEN_MISSING"
            exit 78
          fi

      - name: Checkout exact core-agent V0.7 develop source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-agent
          ref: ${{ env.CORE_AGENT_SOURCE_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: source

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run core-agent machine verification
        working-directory: source
        env:
          VF_SOURCE_SHA: ${{ env.CORE_AGENT_SOURCE_SHA }}
        run: python scripts/verify.py

      - name: Run real private P02 develop write pilot
        id: private_pilot
        continue-on-error: true
        working-directory: source
        env:
          VF_SOURCE_SHA: ${{ env.CORE_AGENT_SOURCE_SHA }}
          V07_PRIVATE_WRITE_TOKEN: ${{ env.PRIVATE_WRITE_TOKEN }}
        run: python scripts/pilot_v07_private_repository_write.py

      - name: Build public-safe V0.7 evidence
        if: always()
        working-directory: source
        env:
          VF_SOURCE_SHA: ${{ env.CORE_AGENT_SOURCE_SHA }}
          PILOT_OUTCOME: ${{ steps.private_pilot.outcome }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          machine = Path('.evidence/verification.json')
          pilot = Path('.evidence/v07-private-write-pilot.json')
          out = Path('.evidence/v07-public-evidence.json')
          payload = {
              'schema': 'core-agent-public-evidence/v4',
              'version': '0.7.0',
              'source_sha': os.environ['VF_SOURCE_SHA'],
              'pilot_step_outcome': os.environ.get('PILOT_OUTCOME'),
              'private_source_persisted': False,
              'product_source_write_actions': 0,
              'main_write_actions': 0,
              'production_actions': 0,
              'release_actions': 0,
          }

          machine_status = 'MISSING'
          if machine.exists():
              raw = machine.read_bytes()
              detail = json.loads(raw.decode('utf-8'))
              machine_status = detail.get('status')
              payload.update({
                  'machine_status': machine_status,
                  'private_machine_evidence_sha256': hashlib.sha256(raw).hexdigest(),
                  'check_exit_codes': [item.get('exit_code') for item in detail.get('checks', [])],
                  'runner': detail.get('runner'),
              })
          else:
              payload['machine_status'] = machine_status

          pilot_status = 'MISSING'
          if pilot.exists():
              raw = pilot.read_bytes()
              detail = json.loads(raw.decode('utf-8'))
              pilot_status = detail.get('status')
              payload.update({
                  'private_pilot_status': pilot_status,
                  'private_pilot_evidence_sha256': hashlib.sha256(raw).hexdigest(),
                  'target_repository': detail.get('target_repository'),
                  'target_branch': detail.get('target_branch'),
                  'target_path': detail.get('target_path'),
                  'write_actions': detail.get('write_actions'),
                  'write_commit_sha': detail.get('commit_sha'),
                  'already_converged': detail.get('already_converged'),
                  'token_exposed': detail.get('token_exposed'),
              })
          else:
              payload['private_pilot_status'] = pilot_status

          payload['status'] = 'PASS' if machine_status == 'PASS' and pilot_status == 'PASS' else 'BLOCKED_OR_FAIL'
          canonical = json.dumps(payload, ensure_ascii=False, sort_keys=True).encode('utf-8')
          payload['sha256'] = hashlib.sha256(canonical).hexdigest()
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True), encoding='utf-8')
          print(f"PUBLIC_EVIDENCE_STATUS={payload['status']}")
          print(f"PUBLIC_EVIDENCE_SHA256={payload['sha256']}")
          PY

      - name: Upload public-safe evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-agent-v0.7-public-evidence-${{ env.CORE_AGENT_SOURCE_SHA }}
          path: |
            source/.evidence/v07-public-evidence.json
            source/.evidence/v07-private-write-pilot.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce private pilot gate
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.private_pilot.outcome }}" != "success" ]; then
            echo "V0.7_PRIVATE_PILOT_GATE=BLOCKED_OR_FAIL"
            exit 1
          fi
          echo "V0.7_PRIVATE_PILOT_GATE=PASS"
