name: P01 V2.36.1 Release Authority Closure Prep R2
on:
  push:
    branches: [release/p01-v2361-candidate-20260901]
    paths: [.github/workflows/p01-v2361-authority-closure-r2-20260901.yml]
permissions:
  contents: read
jobs:
  close-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE: 23321270d79fc98d529c2c5a0ef07e0f1012835a
      BRANCH: docs/p01-v2361-release-closure-20260901
    steps:
      - name: Checkout exact Authority branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01
      - name: Build and push five-file release closure
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p01 rev-parse HEAD)" = "$BASE"
          test "$(git -C p01 ls-remote origin refs/heads/main | awk '{print $1}')" = "$BASE"
          test "$(git -C p01 ls-remote origin refs/heads/develop | awk '{print $1}')" = "$BASE"
          cp scripts/p01-v2361-authority-closure.py p01/.authority-closure.py
          cd p01
          python3 .authority-closure.py
          rm .authority-closure.py
          python3 -m json.tool VF_PROJECT.json >/dev/null
          ACTUAL=$(git status --short | sed 's/^...//' | sort)
          EXPECTED=$(printf '%s\n' README.md VF_PROJECT.json docs/authority/CURRENT.md docs/evidence/P01_V2.36.1_RELEASE_CLOSURE_20260901.md docs/handoff/CURRENT_STATE.md | sort)
          test "$ACTUAL" = "$EXPECTED"
          test -z "$(git diff --name-only -- src)"
          test "$(jq -r .production_version VF_PROJECT.json)" = 2.36.0
          test "$(jq -r .published_release.version VF_PROJECT.json)" = 2.36.1
          test "$(jq -r .published_release.release_id VF_PROJECT.json)" = 380234103
          test "$(jq -r .published_release.core_updates_commit VF_PROJECT.json)" = 416cc8089b39349eb7ee62638b5267335d406320
          grep -F 'Published Latest: V2.36.1' README.md >/dev/null
          grep -F '<!-- P01_V2361_RELEASE_CLOSURE -->' docs/authority/CURRENT.md >/dev/null
          grep -F '<!-- P01_V2361_RELEASE_CLOSURE -->' docs/handoff/CURRENT_STATE.md >/dev/null
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add README.md VF_PROJECT.json docs/authority/CURRENT.md docs/handoff/CURRENT_STATE.md docs/evidence/P01_V2.36.1_RELEASE_CLOSURE_20260901.md
          git commit -m 'docs(P01): close V2.36.1 release chain'
          git push origin HEAD:"refs/heads/$BRANCH"
          echo P01_V2361_AUTHORITY_PREP_R2=PASS
