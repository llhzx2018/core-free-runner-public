name: TEMP skill-book V5.5 Candidate prerelease gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: temp-skill-book-v55-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  GOV_REPO: llhzx2018/gov-doc
  FINAL_SOURCE_COMMIT: b3b73d2a05e7ef2e497817cea7210c7f4504db05
  FINAL_SOURCE_AGG: e545c8f29e2b72bf9c38c7d45b03dad899c7f8c5a5cda5811094e904f87f3867
  ZIP_NAME: skill-book_V5.5_CANDIDATE_20260828.zip
  ZIP_SHA: 7d74d60a776517f63bd84bf41a86f9ec8a74eb1d2bd70aa972cafc6066bdd34f
  ZIP_BYTES: '431641'
  TAG: skill-book-v5.5-candidate-20260828
  RELEASE_TITLE: skill-book V5.5 Candidate · 2026-08-28

jobs:
  publish-and-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Clone exact final source authority
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GOV_REPO}.git" gov
          git -C gov checkout --quiet --detach "$FINAL_SOURCE_COMMIT"
          test "$(git -C gov rev-parse HEAD)" = "$FINAL_SOURCE_COMMIT"
          LIVE="$(git -C gov ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$LIVE" = "$FINAL_SOURCE_COMMIT"
          echo GOV_MAIN_EXACT_FINAL_SOURCE_PASS "$LIVE"

      - name: Verify release and tag absence immediately before publication
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/${GOV_REPO}/releases/tags/${TAG}" >/dev/null 2>&1; then
            echo BLOCK_RELEASE_ALREADY_EXISTS
            exit 1
          fi
          if git -C gov ls-remote --exit-code origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo BLOCK_TAG_ALREADY_EXISTS
            exit 1
          fi
          echo RELEASE_TAG_ABSENCE_PASS

      - name: Validate exact source and deterministic Candidate identity
        shell: bash
        working-directory: gov/skills/skill-book/V5.5
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS.txt >/dev/null
          test "$(find . -type f | wc -l)" -eq 95
          test "$(wc -l < SHA256SUMS.txt)" -eq 94
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZipInfo, ZIP_STORED
          import hashlib, os, stat
          root=Path('.')
          fs=sorted(p for p in root.rglob('*') if p.is_file())
          assert len(fs)==95, len(fs)
          h=hashlib.sha256()
          for p in fs:
              b=p.read_bytes()
              h.update(p.as_posix().encode()+b'\0'+hashlib.sha256(b).digest()+b'\n')
          agg=h.hexdigest()
          assert agg==os.environ['FINAL_SOURCE_AGG'], (agg, os.environ['FINAL_SOURCE_AGG'])
          out=Path('/tmp')/os.environ['ZIP_NAME']
          with ZipFile(out,'w',compression=ZIP_STORED) as z:
              for p in fs:
                  zi=ZipInfo(f'skill-book_V5.5_CANDIDATE/{p.as_posix()}',(2026,8,28,0,0,0))
                  zi.compress_type=ZIP_STORED
                  zi.create_system=3
                  zi.external_attr=(stat.S_IFREG|0o644)<<16
                  z.writestr(zi,p.read_bytes())
          b=out.read_bytes()
          got=hashlib.sha256(b).hexdigest()
          assert len(b)==int(os.environ['ZIP_BYTES']), len(b)
          assert got==os.environ['ZIP_SHA'], got
          (Path('/tmp')/(os.environ['ZIP_NAME']+'.sha256')).write_text(f"{got}  {os.environ['ZIP_NAME']}\n",encoding='utf-8')
          print('FINAL_SOURCE_AGG_PASS',agg)
          print('CANDIDATE_ZIP_IDENTITY_PASS',len(b),got)
          PY
          unzip -t "/tmp/$ZIP_NAME" >/dev/null

      - name: Create governed V5.5 Candidate prerelease
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          # skill-book V5.5 Candidate

          Status: **Candidate / NOT CURRENT**

          - Version: `V5.5 Candidate`
          - Runtime Contract: `SB55-RUNTIME-CONTRACT-6B3D9F21`
          - Scope: `Runtime Orchestration + Verifier Robustness Bug Closure`
          - Source authority commit: `b3b73d2a05e7ef2e497817cea7210c7f4504db05`
          - Candidate ZIP SHA-256: `7d74d60a776517f63bd84bf41a86f9ec8a74eb1d2bd70aa972cafc6066bdd34f`
          - Candidate ZIP bytes: `431641`
          - Source Current remains: `V3.5`
          - Previous Published Candidate: `V5.4`
          - Current Promotion: `NOT_AUTHORIZED`
          - Python syntax: `37/37 PASS`
          - Targeted regression: `52/52 PASS`
          - Full regression: `108/108 PASS`
          - Independent Runtime Acceptance: `16/16 PASS`
          - Fresh V5.4 A1 machine-only runtime false-block closure: `PASS`, Reader Tree mutation `0`
          - True content regression preserved: `POST_DRAFT_BASELINE_DIFFERENTIAL_BLOCK`
          - Real Reader Evidence: `NOT_RUN`; machine evidence does not substitute for Reader Outcome
          - Historical Canonical: `FIRST_FREEZE+ evaluator-only; never generation template`

          V5.5 does not change Current Distribution and is not a Current promotion.
          EOF
          gh release create "$TAG" \
            "/tmp/$ZIP_NAME" "/tmp/$ZIP_NAME.sha256" \
            --repo "$GOV_REPO" \
            --target "$FINAL_SOURCE_COMMIT" \
            --title "$RELEASE_TITLE" \
            --notes-file /tmp/release-notes.md \
            --prerelease
          echo PRERELEASE_CREATE_PASS

      - name: Remote release metadata and tag-target readback
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GOV_REPO}/releases/tags/${TAG}" > /tmp/release.json
          python - <<'PY'
          import json,os
          r=json.load(open('/tmp/release.json'))
          assert r['tag_name']==os.environ['TAG'],r['tag_name']
          assert r['prerelease'] is True,r['prerelease']
          assert r['draft'] is False,r['draft']
          names={a['name']:a for a in r['assets']}
          z=os.environ['ZIP_NAME']; s=z+'.sha256'
          assert set(names)=={z,s},set(names)
          assert names[z]['size']==int(os.environ['ZIP_BYTES']),names[z]['size']
          print('RELEASE_ID',r['id'])
          print('ZIP_ASSET_ID',names[z]['id'])
          print('SHA_ASSET_ID',names[s]['id'])
          print('PRERELEASE_METADATA_PASS')
          PY
          TAG_SHA="$(git -C gov ls-remote origin "refs/tags/${TAG}" | awk '{print $1}')"
          test "$TAG_SHA" = "$FINAL_SOURCE_COMMIT"
          echo TAG_TARGET_EXACT_SOURCE_PASS "$TAG_SHA"

      - name: Download published assets and verify remote bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/readback
          gh release download "$TAG" --repo "$GOV_REPO" --dir /tmp/readback
          test "$(stat -c %s "/tmp/readback/$ZIP_NAME")" = "$ZIP_BYTES"
          GOT="$(sha256sum "/tmp/readback/$ZIP_NAME" | awk '{print $1}')"
          test "$GOT" = "$ZIP_SHA"
          EXPECTED_LINE="$ZIP_SHA  $ZIP_NAME"
          test "$(cat "/tmp/readback/$ZIP_NAME.sha256")" = "$EXPECTED_LINE"
          unzip -t "/tmp/readback/$ZIP_NAME" >/dev/null
          rm -rf /tmp/extracted
          mkdir -p /tmp/extracted
          unzip -q "/tmp/readback/$ZIP_NAME" -d /tmp/extracted
          cd /tmp/extracted/skill-book_V5.5_CANDIDATE
          sha256sum -c SHA256SUMS.txt >/dev/null
          test "$(find . -type f | wc -l)" -eq 95
          test "$(wc -l < SHA256SUMS.txt)" -eq 94
          echo REMOTE_ASSET_READBACK_PASS "$GOT" "$ZIP_BYTES"
