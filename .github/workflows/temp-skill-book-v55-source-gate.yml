name: TEMP skill-book V5.5 final metadata reseal gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: temp-skill-book-v55-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  GOV_REPO: llhzx2018/gov-doc
  GOV_BASE: 3c5f0755a355adbac923d92c52fdb7e3589f6c02
  SOURCE_BRANCH: staging/skill-book-v55-candidate-final-20260828
  FINAL_SOURCE_AGG: e545c8f29e2b72bf9c38c7d45b03dad899c7f8c5a5cda5811094e904f87f3867
  ZIP_NAME: skill-book_V5.5_CANDIDATE_20260828.zip
  ZIP_SHA: 7d74d60a776517f63bd84bf41a86f9ec8a74eb1d2bd70aa972cafc6066bdd34f
  ZIP_BYTES: '431641'

jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact pre-fix V5.5 source authority
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/gov-doc
          ref: ${{ env.GOV_BASE }}
          path: gov
      - name: Apply deterministic final metadata reconciliation
        shell: bash
        working-directory: gov/skills/skill-book/V5.5
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, hashlib, os
          root=Path('.')
          p=root/'SOURCE_PACKAGE_IDENTITY.md'
          s=p.read_text(encoding='utf-8')
          old='- Candidate publication: `PENDING_LOCAL_FINAL_BYTES_AND_REMOTE_VALIDATION`'
          new='- Immutable package seal: `LOCAL_FINAL_BYTES_SEALED_AFTER_METADATA_RECONCILIATION`\n- Remote exact-source / prerelease status: `EXTERNAL_GOVERNANCE_EVIDENCE; MUST MATCH THIS IMMUTABLE PACKAGE; NOT SELF-MUTATED INTO PACKAGE`'
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new),encoding='utf-8')
          mpath=root/'MANIFEST.json'
          m=json.loads(mpath.read_text(encoding='utf-8'))
          m['package_seal_state']={
            'local_final_bytes':'PASS_FINAL_BYTES_AFTER_METADATA_RECONCILIATION',
            'deterministic_double_build':'PASS_REQUIRED_AND_VERIFIED_FOR_IMMUTABLE_CANDIDATE',
            'remote_exact_source':'EXTERNAL_GATE_MUST_MATCH_IMMUTABLE_PACKAGE',
            'prerelease':'EXTERNAL_GOVERNANCE_EVENT_NOT_SELF_MUTATED_INTO_PACKAGE'}
          m['validation']['final_byte_rerun_required']=False
          m['validation']['final_byte_rerun_state']='PASS_REQUIRED_ON_THESE_IMMUTABLE_BYTES_BEFORE_RELEASE'
          m['validation']['remote_evidence_model']='EXTERNAL_EVIDENCE_BOUND_BY_EXACT_SOURCE_AND_CANDIDATE_ZIP_SHA256'
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          fs=sorted(p for p in root.rglob('*') if p.is_file() and p.name not in {'MANIFEST.json','SHA256SUMS.txt'} and '__pycache__' not in p.parts and '.pytest_cache' not in p.parts and p.suffix not in {'.pyc','.pyo'})
          assert len(fs)==93, len(fs)
          m['files']=[{'path':p.as_posix(),'bytes':p.stat().st_size,'sha256':sha(p)} for p in fs]
          basis=''.join(f'{p.as_posix()}  {sha(p)}\n' for p in fs).encode()
          m['validation']['source_non_manifest_tree_sha256']=hashlib.sha256(basis).hexdigest()
          mpath.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          allfs=sorted(p for p in root.rglob('*') if p.is_file() and p.name!='SHA256SUMS.txt' and '__pycache__' not in p.parts and '.pytest_cache' not in p.parts and p.suffix not in {'.pyc','.pyo'})
          assert len(allfs)==94, len(allfs)
          (root/'SHA256SUMS.txt').write_text(''.join(f'{sha(p)}  {p.as_posix()}\n' for p in allfs),encoding='utf-8')
          h=hashlib.sha256()
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              b=p.read_bytes(); h.update(p.as_posix().encode()+b'\0'+hashlib.sha256(b).digest()+b'\n')
          got=h.hexdigest(); exp=os.environ['FINAL_SOURCE_AGG']
          assert got==exp,(got,exp)
          print('FINAL_SOURCE_AGG_MATCH',got)
          PY
          sha256sum -c SHA256SUMS.txt >/dev/null
          test "$(find . -type f | wc -l)" -eq 95
          test "$(wc -l < SHA256SUMS.txt)" -eq 94
          grep -q 'PASS_FINAL_BYTES_AFTER_METADATA_RECONCILIATION' MANIFEST.json
          ! grep -q 'PENDING_RERUN_AFTER_METADATA_RECONCILIATION' MANIFEST.json
      - name: Python syntax 37/37
        shell: bash
        working-directory: gov/skills/skill-book/V5.5
        run: |
          set -euo pipefail
          python - <<'PY'
          import py_compile
          from pathlib import Path
          fs=sorted(list(Path('scripts').glob('*.py'))+list(Path('tests').glob('*.py')))
          assert len(fs)==37,len(fs)
          for p in fs: py_compile.compile(str(p),doraise=True)
          print('PYTHON_SYNTAX_PASS 37/37')
          PY
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
      - name: Install pinned pytest
        run: python -m pip install --disable-pip-version-check pytest==9.0.2
      - name: Full regression 108/108 on final bytes
        shell: bash
        working-directory: gov/skills/skill-book/V5.5
        run: |
          set -euo pipefail
          python -m pytest -q
          rm -rf .pytest_cache
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          sha256sum -c SHA256SUMS.txt >/dev/null
          echo FULL_REGRESSION_108_PASS

  runtime-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact pre-fix V5.5 source authority
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/gov-doc
          ref: ${{ env.GOV_BASE }}
          path: gov
      - name: Apply same deterministic final metadata reconciliation
        shell: bash
        working-directory: gov/skills/skill-book/V5.5
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, hashlib, os
          root=Path('.')
          p=root/'SOURCE_PACKAGE_IDENTITY.md'; s=p.read_text(encoding='utf-8')
          old='- Candidate publication: `PENDING_LOCAL_FINAL_BYTES_AND_REMOTE_VALIDATION`'
          new='- Immutable package seal: `LOCAL_FINAL_BYTES_SEALED_AFTER_METADATA_RECONCILIATION`\n- Remote exact-source / prerelease status: `EXTERNAL_GOVERNANCE_EVIDENCE; MUST MATCH THIS IMMUTABLE PACKAGE; NOT SELF-MUTATED INTO PACKAGE`'
          assert s.count(old)==1
          p.write_text(s.replace(old,new),encoding='utf-8')
          mpath=root/'MANIFEST.json'; m=json.loads(mpath.read_text(encoding='utf-8'))
          m['package_seal_state']={'local_final_bytes':'PASS_FINAL_BYTES_AFTER_METADATA_RECONCILIATION','deterministic_double_build':'PASS_REQUIRED_AND_VERIFIED_FOR_IMMUTABLE_CANDIDATE','remote_exact_source':'EXTERNAL_GATE_MUST_MATCH_IMMUTABLE_PACKAGE','prerelease':'EXTERNAL_GOVERNANCE_EVENT_NOT_SELF_MUTATED_INTO_PACKAGE'}
          m['validation']['final_byte_rerun_required']=False
          m['validation']['final_byte_rerun_state']='PASS_REQUIRED_ON_THESE_IMMUTABLE_BYTES_BEFORE_RELEASE'
          m['validation']['remote_evidence_model']='EXTERNAL_EVIDENCE_BOUND_BY_EXACT_SOURCE_AND_CANDIDATE_ZIP_SHA256'
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          fs=sorted(p for p in root.rglob('*') if p.is_file() and p.name not in {'MANIFEST.json','SHA256SUMS.txt'})
          m['files']=[{'path':p.as_posix(),'bytes':p.stat().st_size,'sha256':sha(p)} for p in fs]
          basis=''.join(f'{p.as_posix()}  {sha(p)}\n' for p in fs).encode(); m['validation']['source_non_manifest_tree_sha256']=hashlib.sha256(basis).hexdigest()
          mpath.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          allfs=sorted(p for p in root.rglob('*') if p.is_file() and p.name!='SHA256SUMS.txt')
          (root/'SHA256SUMS.txt').write_text(''.join(f'{sha(p)}  {p.as_posix()}\n' for p in allfs),encoding='utf-8')
          h=hashlib.sha256()
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              b=p.read_bytes(); h.update(p.as_posix().encode()+b'\0'+hashlib.sha256(b).digest()+b'\n')
          assert h.hexdigest()==os.environ['FINAL_SOURCE_AGG'],h.hexdigest()
          print('FINAL_SOURCE_AGG_MATCH',h.hexdigest())
          PY
          sha256sum -c SHA256SUMS.txt >/dev/null
      - name: Install pinned pytest
        run: python -m pip install --disable-pip-version-check pytest==9.0.2
      - name: Independent Runtime Acceptance 16/16 on same final bytes
        shell: bash
        working-directory: gov/skills/skill-book/V5.5
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_runtime_acceptance_audit.py
          echo RUNTIME_ACCEPTANCE_16_PASS

  stage-final-exact-source:
    needs: [full-regression, runtime-acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact pre-fix V5.5 source with release token
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/gov-doc
          ref: ${{ env.GOV_BASE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          path: gov
          fetch-depth: 0
      - name: Reconcile exact final metadata and prove Candidate identity
        shell: bash
        working-directory: gov/skills/skill-book/V5.5
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZipInfo,ZIP_STORED
          import json,hashlib,os,stat
          root=Path('.')
          p=root/'SOURCE_PACKAGE_IDENTITY.md'; s=p.read_text(encoding='utf-8')
          old='- Candidate publication: `PENDING_LOCAL_FINAL_BYTES_AND_REMOTE_VALIDATION`'
          new='- Immutable package seal: `LOCAL_FINAL_BYTES_SEALED_AFTER_METADATA_RECONCILIATION`\n- Remote exact-source / prerelease status: `EXTERNAL_GOVERNANCE_EVIDENCE; MUST MATCH THIS IMMUTABLE PACKAGE; NOT SELF-MUTATED INTO PACKAGE`'
          assert s.count(old)==1
          p.write_text(s.replace(old,new),encoding='utf-8')
          mpath=root/'MANIFEST.json'; m=json.loads(mpath.read_text(encoding='utf-8'))
          m['package_seal_state']={'local_final_bytes':'PASS_FINAL_BYTES_AFTER_METADATA_RECONCILIATION','deterministic_double_build':'PASS_REQUIRED_AND_VERIFIED_FOR_IMMUTABLE_CANDIDATE','remote_exact_source':'EXTERNAL_GATE_MUST_MATCH_IMMUTABLE_PACKAGE','prerelease':'EXTERNAL_GOVERNANCE_EVENT_NOT_SELF_MUTATED_INTO_PACKAGE'}
          m['validation']['final_byte_rerun_required']=False
          m['validation']['final_byte_rerun_state']='PASS_REQUIRED_ON_THESE_IMMUTABLE_BYTES_BEFORE_RELEASE'
          m['validation']['remote_evidence_model']='EXTERNAL_EVIDENCE_BOUND_BY_EXACT_SOURCE_AND_CANDIDATE_ZIP_SHA256'
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          fs0=sorted(p for p in root.rglob('*') if p.is_file() and p.name not in {'MANIFEST.json','SHA256SUMS.txt'})
          m['files']=[{'path':p.as_posix(),'bytes':p.stat().st_size,'sha256':sha(p)} for p in fs0]
          basis=''.join(f'{p.as_posix()}  {sha(p)}\n' for p in fs0).encode(); m['validation']['source_non_manifest_tree_sha256']=hashlib.sha256(basis).hexdigest()
          mpath.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          allfs=sorted(p for p in root.rglob('*') if p.is_file() and p.name!='SHA256SUMS.txt')
          (root/'SHA256SUMS.txt').write_text(''.join(f'{sha(p)}  {p.as_posix()}\n' for p in allfs),encoding='utf-8')
          h=hashlib.sha256()
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              b=p.read_bytes(); h.update(p.as_posix().encode()+b'\0'+hashlib.sha256(b).digest()+b'\n')
          assert h.hexdigest()==os.environ['FINAL_SOURCE_AGG'],h.hexdigest()
          fs=sorted(p for p in root.rglob('*') if p.is_file())
          assert len(fs)==95,len(fs)
          out=Path('/tmp')/os.environ['ZIP_NAME']
          with ZipFile(out,'w',compression=ZIP_STORED) as z:
              for p in fs:
                  zi=ZipInfo(f'skill-book_V5.5_CANDIDATE/{p.as_posix()}',(2026,8,28,0,0,0)); zi.compress_type=ZIP_STORED; zi.create_system=3; zi.external_attr=(stat.S_IFREG|0o644)<<16
                  z.writestr(zi,p.read_bytes())
          b=out.read_bytes(); got=hashlib.sha256(b).hexdigest()
          assert len(b)==int(os.environ['ZIP_BYTES']),len(b)
          assert got==os.environ['ZIP_SHA'],got
          print('FINAL_SOURCE_AGG_MATCH',h.hexdigest())
          print('CANDIDATE_ZIP_IDENTITY_PASS',len(b),got)
          PY
          sha256sum -c SHA256SUMS.txt >/dev/null
          unzip -t "/tmp/$ZIP_NAME" >/dev/null
      - name: Stage three-file final metadata diff to isolated gov-doc branch
        shell: bash
        working-directory: gov
        env:
          VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          LIVE="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$LIVE" = "$GOV_BASE"
          if git ls-remote --exit-code origin "refs/heads/$SOURCE_BRANCH" >/dev/null 2>&1; then
            echo BLOCK_FINAL_SOURCE_BRANCH_ALREADY_EXISTS
            exit 1
          fi
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add skills/skill-book/V5.5/MANIFEST.json skills/skill-book/V5.5/SOURCE_PACKAGE_IDENTITY.md skills/skill-book/V5.5/SHA256SUMS.txt
          mapfile -t changed < <(git diff --cached --name-only | sort)
          test "${#changed[@]}" -eq 3
          test "${changed[0]}" = 'skills/skill-book/V5.5/MANIFEST.json'
          test "${changed[1]}" = 'skills/skill-book/V5.5/SHA256SUMS.txt'
          test "${changed[2]}" = 'skills/skill-book/V5.5/SOURCE_PACKAGE_IDENTITY.md'
          git commit -m 'skill-book: finalize V5.5 candidate package identity'
          FINAL_SOURCE_COMMIT="$(git rev-parse HEAD)"
          git remote set-url origin "https://x-access-token:${VF_RELEASE_WRITE_TOKEN}@github.com/${GOV_REPO}.git"
          git push origin "HEAD:refs/heads/$SOURCE_BRANCH"
          echo "FINAL_SOURCE_COMMIT=$FINAL_SOURCE_COMMIT"
          echo "FINAL_SOURCE_BRANCH=$SOURCE_BRANCH"
