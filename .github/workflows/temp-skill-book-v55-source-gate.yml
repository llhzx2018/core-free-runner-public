name: TEMP skill-book V5.5 governance reconciliation gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: temp-skill-book-v55-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  GOV_REPO: llhzx2018/gov-doc
  GOV_BASE: d00f2839fed708dd4ac914ca445512ac9e9bef91
  STAGING_BRANCH: staging/skill-book-v55-current-reconcile-20260828
  CURRENT_DIST_BLOB: 4742ae001ee50d7f3e9b1c09aa2515f70cf77f5b
  CURRENT_INDEX_BLOB: 8f12ac70db9bb36903fe2307a40f548d33d301d1
  TAG: skill-book-v5.5-candidate-20260828
  FINAL_SOURCE_COMMIT: b3b73d2a05e7ef2e497817cea7210c7f4504db05

jobs:
  reconcile-current-pointer:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Clone exact live governance base
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GOV_REPO}.git" gov
          git -C gov checkout --quiet --detach "$GOV_BASE"
          LIVE="$(git -C gov ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$LIVE" = "$GOV_BASE"
          test "$(git -C gov rev-parse HEAD:distribution/skills/CURRENT_SKILL_DISTRIBUTION.json)" = "$CURRENT_DIST_BLOB"
          test "$(git -C gov rev-parse HEAD:distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md)" = "$CURRENT_INDEX_BLOB"
          echo GOV_BASE_AND_CURRENT_DISTRIBUTION_LOCK_PASS "$LIVE"

      - name: Reverify published Candidate authority
        shell: bash
        working-directory: gov
        run: |
          set -euo pipefail
          gh api "repos/${GOV_REPO}/releases/tags/${TAG}" > /tmp/release.json
          python - <<'PY'
          import json,os
          r=json.load(open('/tmp/release.json'))
          assert r['prerelease'] is True
          assert r['draft'] is False
          assert r['tag_name']==os.environ['TAG']
          print('RELEASE_RECONCILIATION_PRECONDITION_PASS',r['id'])
          PY
          TAG_SHA="$(git ls-remote origin "refs/tags/${TAG}" | awk '{print $1}')"
          test "$TAG_SHA" = "$FINAL_SOURCE_COMMIT"
          echo TAG_SOURCE_PRECONDITION_PASS "$TAG_SHA"

      - name: Patch only skill-book Candidate reconciliation sentence
        shell: bash
        working-directory: gov
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('CURRENT.md')
          s=p.read_text(encoding='utf-8')
          old='`skill-book V4.0/V4.1/V4.2/V4.3/V4.4/V4.5/V4.6/V4.7/V4.8/V4.9/V5.0/V5.1/V5.2/V5.3` 为保留的历史 Candidate，`V5.4` 为最新 Candidate；十五个 Candidate 版本均未晋升 Source Current。V5.4 已进入 Candidate Distribution，但未进入 Current Distribution。'
          new='`skill-book V4.0/V4.1/V4.2/V4.3/V4.4/V4.5/V4.6/V4.7/V4.8/V4.9/V5.0/V5.1/V5.2/V5.3/V5.4` 为保留的历史 Candidate，`V5.5` 为最新 Candidate；十六个 Candidate 版本均未晋升 Source Current。V5.5 已进入 Candidate Distribution，但未进入 Current Distribution。'
          assert s.count(old)==1, s.count(old)
          s2=s.replace(old,new)
          assert s2.count(new)==1
          assert '| skill-book | V3.5 | V4.7 CANDIDATE（非 Current） |' in s2
          p.write_text(s2,encoding='utf-8')
          print('CURRENT_SKILL_BOOK_RECONCILIATION_PATCH_PASS')
          PY
          mapfile -t changed < <(git diff --name-only | sort)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'CURRENT.md'
          test "$(git rev-parse HEAD:distribution/skills/CURRENT_SKILL_DISTRIBUTION.json)" = "$CURRENT_DIST_BLOB"
          test "$(git rev-parse HEAD:distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md)" = "$CURRENT_INDEX_BLOB"
          git diff --check
          echo CURRENT_DISTRIBUTION_ZERO_DIFF_PRECOMMIT_PASS

      - name: Stage reconciliation to isolated branch
        shell: bash
        working-directory: gov
        run: |
          set -euo pipefail
          LIVE="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$LIVE" = "$GOV_BASE"
          if git ls-remote --exit-code origin "refs/heads/$STAGING_BRANCH" >/dev/null 2>&1; then
            echo BLOCK_RECONCILIATION_BRANCH_ALREADY_EXISTS
            exit 1
          fi
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add CURRENT.md
          test "$(git diff --cached --name-only)" = 'CURRENT.md'
          git commit -m 'governance: reconcile skill-book V5.5 latest Candidate'
          COMMIT="$(git rev-parse HEAD)"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GOV_REPO}.git"
          git push --quiet origin "HEAD:refs/heads/$STAGING_BRANCH"
          echo RECONCILIATION_COMMIT "$COMMIT"
          echo CURRENT_DISTRIBUTION_WRITE_0
