name: p01-ia6-v2486-27route-12tab-exact-proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-ia6-v2486-27route-12tab-closure.yml'

permissions:
  contents: read

concurrency:
  group: p01-ia6-v2486-27route-12tab-closure
  cancel-in-progress: false

jobs:
  exact-isolated-parity:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.title, 'test(P01):')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      PRODUCT_BRANCH: feat/ia-v6-frontstage-admin-parity-system-jobs-r1
      TARGET_SHA: 80034c1f5d7c248ae705a0ee6170c09ba769d2ad
      PRODUCT_VERSION: 2.47.486
    steps:
      - name: Prepare PHP and browser tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd php-xml >/dev/null
          php -m | grep -i -Fx pdo_sqlite
          echo P01_IA6_ISOLATED_RUNTIME=PASS

      - name: Lock candidate to exact authenticated private SHA
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          got="$(git ls-remote "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')"
          test "$got" = "$TARGET_SHA"
          git clone -q --no-checkout "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" candidate
          git -C candidate fetch -q --depth 1 origin "$TARGET_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "$PRODUCT_VERSION"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "$PRODUCT_VERSION"
          echo P01_IA6_EXACT_SHA=PASS

      - name: Disposable 27 historical GUI GETs and all 11+1 tabs at 1440 and 768
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$(mktemp -d /tmp/p01-ia6-27route-12tab-XXXXXXXX)"
          cp -a candidate/src/. "$root/"
          (
            cd "$root"
            php -S 127.0.0.1:18961 -t . >/tmp/p01-ia6-parity-php.log 2>&1
          ) &
          pid=$!
          trap 'kill "$pid" >/dev/null 2>&1 || true; rm -rf "$root" /tmp/p01-ia6-parity-browser /tmp/p01-ia6-parity-browser-bins /tmp/p01-ia6-parity-setup.html /tmp/p01-ia6-parity-cookie' EXIT
          for _ in $(seq 1 60); do
            if curl -fsS -c /tmp/p01-ia6-parity-cookie -b /tmp/p01-ia6-parity-cookie http://127.0.0.1:18961/setup.php -o /tmp/p01-ia6-parity-setup.html 2>/dev/null; then break; fi
            sleep 1
          done
          csrf="$(python3 - <<'PY'
          import re
          html=open('/tmp/p01-ia6-parity-setup.html').read()
          match=re.search(r'name="setup_csrf"\s+value="([^"]+)"',html)
          assert match,'Missing isolated setup CSRF'
          print(match.group(1))
          PY
          )"
          curl -fsS -c /tmp/p01-ia6-parity-cookie -b /tmp/p01-ia6-parity-cookie \
            -X POST http://127.0.0.1:18961/setup.php \
            --data-urlencode "setup_csrf=$csrf" \
            --data-urlencode "site_title=IA6 Disposable Twelve Tabs" \
            --data-urlencode "admin_password=P01R12!18961" \
            --data-urlencode "admin_password_confirm=P01R12!18961" \
            -o /tmp/p01-ia6-parity-installed.html
          (cd "$root" && php cli/verify.php) | grep -Fx VERIFY_PASS=YES
          VF_IA6_PROOF_ROOT="$root" php <<'PHP'
          <?php
          require getenv('VF_IA6_PROOF_ROOT').'/app/bootstrap.php';
          $repo=new VfRepository(vf_db());
          $category=$repo->createCategory(['name'=>'IA6 disposable privacy check','description'=>'','icon'=>'','is_private'=>1,'sort_order'=>0]);
          $repo->saveLink(null,[
              'surface'=>'start','category_id'=>$category,
              'title'=>'IA6_PRIVATE_NEVER_DISCLOSE_18961',
              'url'=>'https://example.org/ia6-private-never-disclose-18961',
              'description'=>'synthetic-private','tags'=>[],
              'is_private'=>1,'is_pending'=>0
          ]);
          echo "P01_IA6_PRIVATE_CANARY_READY=YES\n";
          PHP
          npm install --prefix /tmp/p01-ia6-parity-browser --no-audit --no-fund playwright@1.56.1 >/tmp/p01-ia6-parity-npm.log
          PLAYWRIGHT_BROWSERS_PATH=/tmp/p01-ia6-parity-browser-bins /tmp/p01-ia6-parity-browser/node_modules/.bin/playwright install --with-deps chromium >/tmp/p01-ia6-parity-chromium.log
          export NODE_PATH=/tmp/p01-ia6-parity-browser/node_modules
          export PLAYWRIGHT_BROWSERS_PATH=/tmp/p01-ia6-parity-browser-bins
          node <<'JS'
          'use strict';
          const assert=require('node:assert/strict');
          const {chromium}=require('playwright');
          const origin='http://127.0.0.1:18961';
          const routes=[
            ['home','home.php'],['start','start.php'],['inbox','inbox.php'],
            ['channels','channels.php'],['watch','watch.php'],
            ['music','music-shell.php?view=home'],['topics','topics.php'],
            ['courses','courses.php'],['projects','projects.php'],
            ['tools','tools.php'],['software','software.php']
          ];
          const domains=routes.map(row=>row[0]).concat('global');
          const legacy=[
            'manage.php','all-resources.php','surface-manager.php','links-admin.php',
            'toolbox-manager.php','health.php','duplicates.php','icons.php',
            'recycle-bin.php','transfer.php','data-safety.php','system-health.php',
            'jobs.php','plugins.php','browser-helper.php','update.php',
            'update-credential.php','settings.php','system-info.php',
            'system-baseline.php','diagnose.php','gov-topic-manager.php',
            'gov-book-manager.php','projects-source-manager.php',
            'music.php','music-import.php','full-governance.php'
          ];
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            try{
              const owner=await browser.newContext({viewport:{width:1440,height:900}});
              await owner.route(/https?:\/\/(?!127\.0\.0\.1)/,route=>route.abort());
              const login=await owner.request.post(origin+'/api.php?action=login',{
                data:{password:'P01R12!18961'}
              });
              assert.equal(login.status(),200,'Owner disposable login');
              assert.equal(routes.length,11);
              assert.equal(domains.length,12);
              assert.equal(legacy.length,27);
              for(const url of legacy){
                const reply=await owner.request.get(origin+'/'+url,{maxRedirects:5});
                if(url==='projects-source-manager.php'){
                  // This legacy Owner route is deliberately host-bound even on
                  // valid disposable localhost Owner sessions; 404 is its security contract.
                  assert.equal(reply.status(),404,'project legacy host-scope denial');
                  assert.ok((await reply.text()).includes('只属于 Kewaro Owner 安装'),
                    '404 must be the intended host guard, not a missing PHP file');
                }else{
                  assert.ok(reply.status()<500 && reply.status()!==404,
                    url+' must remain available as legacy compatibility/recovery: '+reply.status());
                }
              }
              console.log('P01_IA6_OWNER_27_DEEPLINK_HTTP_NO_404_5XX=PASS');
              const guest=await browser.newContext();
              try{
                for(const url of legacy){
                  const reply=await guest.request.get(origin+'/'+url,{maxRedirects:5});
                  assert.ok(reply.status()<500,url+' guest server error: '+reply.status());
                  const body=await reply.text();
                  assert.ok(!body.includes('IA6_PRIVATE_NEVER_DISCLOSE_18961'),
                    url+' leaked private canary to Guest');
                }
                for(const [label,url] of routes.filter(row=>!['inbox','music'].includes(row[0]))){
                  const p=await guest.newPage();
                  await p.goto(origin+'/'+url,{waitUntil:'domcontentloaded'});
                  assert.equal(await p.locator('[data-vf-global-manage-open]').count(),0,
                    label+' must not expose Owner management to guest');
                  await p.close();
                }
              }finally{await guest.close();}
              console.log('P01_IA6_GUEST_27_DEEPLINK_PRIVATE_CANARY_NO_LEAK=PASS');
              const p=await owner.newPage();
              let tabChecks=0, pageChecks=0;
              for(const width of [1440,768]){
                await p.setViewportSize({width,height:900});
                for(const [current,url] of routes){
                  const target=origin+'/'+url;
                  const reply=await p.goto(target,{waitUntil:'domcontentloaded'});
                  assert.equal(reply.status(),200,current+' owner page HTTP');
                  // Some canonically routed subsite entries normalize the URL at page load.
                  // Tab interaction must preserve the actual landed URL, not the input URL.
                  const landed=p.url();
                  assert.equal(await p.locator('[data-vf-global-manage-open]').count(),1,
                    current+' global opener missing');
                  await p.locator('[data-vf-global-manage-open]').click();
                  const dialog=p.locator('[data-vf-local-management]');
                  assert.equal(await dialog.evaluate(e=>e.open),true,current+' modal open');
                  const pagePath=new URL(p.url()).pathname;
                  let documentNavigationCount=0;
                  const detectDocumentNavigation=req=>{
                    if(req.isNavigationRequest()&&req.frame()===p.mainFrame()) documentNavigationCount++;
                  };
                  p.on('request',detectDocumentNavigation);
                  const tabs=dialog.locator('[data-vf-management-tab]');
                  assert.equal(await tabs.count(),12,current+' exact 11+1');
                  assert.equal(await dialog.locator('iframe').count(),0,'no nested legacy iframe');
                  const startBox=await dialog.boundingBox();
                  assert.ok(startBox && startBox.width<=width && startBox.height<=900,
                    current+' modal viewport containment');
                  for(const name of domains){
                    const tab=dialog.locator('[data-vf-management-tab="'+name+'"]');
                    assert.equal(await tab.isEnabled(),true,'unavailable '+name+' from '+current);
                    await tab.click({timeout:10000});
                    const selection=await tab.getAttribute('aria-selected');
                    if(selection!=='true'){
                      const diagnostic=await p.evaluate(()=>{
                        const members=['VFGlobalOperations','VFFrontstageRecoveryFiles','VFFrontstageBackupBaseline',
                          'VFFrontstageResourceBulk','VFFrontstageAdvancedResource','VFFullGovernance',
                          'VFFrontstageRecyclePurge','VFFrontstageRecycleBulk','VFFrontstageReauth',
                          'VFFrontstageSuggestions','VFFrontstageBrandAssets','VFFrontstageTmdb',
                          'VFFrontstageUpdateCredential','VFFrontstageSystemBaseline','VFFrontstagePluginLifecycle',
                          'VFFrontstageHistory','VFLocalHomeFavorites','VFLocalMusicAdvanced',
                          'VFRemoteInboxBatch','VFRemoteMusicManagement','VFRemoteWatchManagement',
                          'VFRemoteChannelsManagement','VFRemoteSources','VFRemoteSoftware',
                          'VFRemoteCategories','VFLocalDuplicates'];
                        const r={};
                        for(const key of members){
                          const f=window[key]?.requestDismiss;
                          if(typeof f==='function'){
                            try{r[key]=f.call(window[key]);}catch(e){r[key]='ERROR';}
                          }
                        }
                        r.feedback=[...document.querySelectorAll('#vf-local-management [role="status"],#vf-local-management [role="alert"]')]
                          .map(x=>String(x.textContent||'').trim().slice(0,90))
                          .filter(x=>/请先|正在|无法|不能|未保存|处理中|异常|拒绝|阻断/.test(x)).slice(-18);
                        return r;
                      });
                      console.log('P01_IA6_TAB_SELECTION_DIAGNOSTIC='+JSON.stringify({current,name,diagnostic}));
                    }
                    assert.equal(selection,'true','tab selection '+current+' -> '+name);
                    assert.equal(await dialog.evaluate(e=>e.open),true,
                      'tab must stay in the same native modal');
                    const active=(name===current)?'[data-vf-management-local-panel]':
                      '[data-vf-management-global-panel]';
                    assert.equal(await dialog.locator(active).isVisible(),true,
                      current+' -> '+name+' visible task panel');
                    assert.equal(await dialog.locator('iframe').count(),0);
                    assert.equal(new URL(p.url()).pathname,pagePath,
                      'tab switch changed page route: '+current+' -> '+name);
                    assert.equal(documentNavigationCount,0,
                      'tab switch performed document navigation: '+current+' -> '+name);
                    const nextBox=await dialog.boundingBox();
                    assert.ok(nextBox && Math.abs(nextBox.width-startBox.width)<=2 &&
                      Math.abs(nextBox.height-startBox.height)<=2,
                      'modal size instability: '+current+' -> '+name+' at '+width);
                    // Selection of a specialist native task explicitly starts a bounded
                    // Owner read. Keep the already-tested guard preventing navigation while
                    // that read is in flight; only move to the next tab after it settles.
                    const reader={
                      start:'[data-vf-remote-categories-read]',
                      channels:'[data-vf-remote-channels-load]',
                      watch:'[data-vf-remote-watch-read]',
                      music:'[data-vf-remote-music-load]',
                      topics:'[data-vf-remote-sources-load]',
                      courses:'[data-vf-remote-sources-load]',
                      projects:'[data-vf-remote-sources-load]',
                      tools:'[data-vf-remote-tools-load]',
                      software:'[data-vf-remote-software-load]'
                    }[name];
                    if(reader && name!==current){
                      await p.waitForFunction(sel=>{
                        const button=document.querySelector(sel);
                        return Boolean(button && !button.disabled);
                      },reader,{timeout:16000});
                    }
                    tabChecks++;
                  }
                  await p.locator('[data-vf-local-manage-close]').last().click();
                  assert.equal(await dialog.evaluate(e=>e.open),false,'close native modal');
                  assert.equal(new URL(p.url()).pathname,pagePath,'close changed route');
                  assert.equal(documentNavigationCount,0,'close performed document navigation');
                  p.off('request',detectDocumentNavigation);
                  pageChecks++;
                  console.log('P01_IA6_MODAL_'+width+'_'+current.toUpperCase()+'=PASS');
                }
              }
              assert.equal(pageChecks,22);
              assert.equal(tabChecks,264);
              console.log('P01_IA6_ALL_11_OWNER_PAGES_X_12_TABS_X_1440_768=PASS');
              console.log('P01_IA6_12_TAB_CHECKS='+tabChecks);
              await owner.close();
            }finally{await browser.close();}
          })().catch(e=>{console.error('P01_IA6_27ROUTE_12TAB_FAIL',e);process.exitCode=1;});
          JS
          echo P01_IA6_PARITY_SCOPED_MACHINE_GATE=PASS
