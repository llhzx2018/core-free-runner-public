      - name: Synthetic crash interruption and safe rollback in fresh disposable install
        shell: bash
        run: |
          set -Eeuo pipefail
          root=/tmp/p01-ia6-r11-runtime
          rm -rf "$root"
          mkdir -p "$root"
          cp -a candidate/src/. "$root/"
          (cd "$root" && php -S 127.0.0.1:18962 -t . >/tmp/p01-r11-fault-server.log 2>&1) &
          pid=$!
          trap 'kill "$pid" >/dev/null 2>&1 || true; rm -rf "$root"' EXIT
          for _ in $(seq 1 50); do
            if curl -fsS -c /tmp/p01-r11-fault-cookie -b /tmp/p01-r11-fault-cookie http://127.0.0.1:18962/setup.php -o /tmp/p01-r11-fault-setup.html; then break; fi
            sleep 1
          done
          csrf="$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-r11-fault-setup.html').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s)
          assert m,'Missing isolated setup CSRF'
          print(m.group(1))
          PY
          )"
          curl -fsS -c /tmp/p01-r11-fault-cookie -b /tmp/p01-r11-fault-cookie -X POST http://127.0.0.1:18962/setup.php \
            --data-urlencode "setup_csrf=$csrf" --data-urlencode "site_title=R11 synthetic fault installation" \
            --data-urlencode "admin_password=R11SyntheticFault!2026" \
            --data-urlencode "admin_password_confirm=R11SyntheticFault!2026" -o /tmp/p01-r11-fault-installed.html
          (cd "$root" && php cli/verify.php) | grep -Fx VERIFY_PASS=YES
          (cd "$root" && php -r 'require "app/bootstrap.php"; echo "P01_R11_FAULT_RUNTIME_DEBUG installed=".(vf_is_installed()?"yes":"no")." version=".VF_VERSION." private=".VF_PRIVATE_ROOT." root=".VF_ROOT."\\n";')
          VF_E2E_RUNTIME_ROOT="$root" php candidate/tests/integration/p01_ia6_interrupted_restore_disposable.php
          echo P01_R11_INTERRUPTED_RECOVERY_PROOF=PASS

      - name: Clean temporary private checkout
        if: always()
        shell: bash
        run: |
          rm -rf candidate
          echo P01_R10_PRIVATE_CHECKOUT_CLEANUP=PASS
