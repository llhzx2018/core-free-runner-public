name: P07 Terminal UX V2 Exact-source Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-terminal-ux-v2-exact-gate.yml'

permissions:
  contents: read

jobs:
  exact-source-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Verify private read capability
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN"

      - name: Checkout exact private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 9cda035befd4bfe56c2a2d6137f8d26e286336cb
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Identity and syntax
        working-directory: source
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '9cda035befd4bfe56c2a2d6137f8d26e286336cb'
          test "$(cat BUILD_ID)" = '0.1.0-release8'
          for f in bin/vfops-user bin/vfops-site-ui bin/vfops-migrate-ui bin/vfops-auto-backup bin/vfops-cloudpanel-ui lib/terminal_ui.sh; do bash -n "$f"; done
          python3 -m py_compile tests/test_terminal_ui_color_contract.py tests/test_main_menu_routes.py tests/test_p07_integration_manifest.py

      - name: Terminal UX V2 contract
        working-directory: source
        run: |
          set -Eeuo pipefail
          python3 -m unittest -v tests.test_terminal_ui_color_contract tests.test_main_menu_routes tests.test_p07_integration_manifest
          grep -Fq 'ui_page()' lib/terminal_ui.sh
          grep -Fq "ui_page 'P07 · 备份网站'" bin/vfops-site-ui
          grep -Fq "ui_page 'P07 · 恢复网站'" bin/vfops-site-ui
          grep -Fq "ui_page 'P07 · 服务器迁移'" bin/vfops-migrate-ui
          grep -Fq "ui_page 'P07 · 自动备份 / 远程灾备'" bin/vfops-auto-backup
          grep -Fq "ui_page 'P07 · CloudPanel 管理'" bin/vfops-cloudpanel-ui
          grep -Fq 'Terminal UX System V2' docs/authority/RPD.md

      - name: Full Slot3 regressions
        working-directory: source
        run: |
          set -Eeuo pipefail
          export PYTHONPATH="$PWD/lib"
          bash tests/smoke.sh >/tmp/p07-smoke.log 2>&1
          python3 -m unittest discover -s tests -p 'test_*.py' -q

      - name: Machine and secret boundary
        working-directory: source
        run: |
          set -Eeuo pipefail
          NO_COLOR=1 bash bin/vfops-user --version | grep -Fx 'VF Server Ops 0.1.0'
          NO_COLOR=1 bash bin/vfops-user --build-id | grep -Fx '0.1.0-release8'
          ! NO_COLOR=1 bash bin/vfops-user --version | grep -q $'\033'
          python3 scripts/secret_scan.py --root . >/tmp/p07-secret-scan.log 2>&1

      - name: Result
        if: always()
        run: |
          echo 'P07_TERMINAL_UX_V2_SOURCE=9cda035befd4bfe56c2a2d6137f8d26e286336cb'
          echo 'P07_PRODUCTION_WRITE=NOT_RUN'
          echo 'P07_DNS_WRITE=NOT_RUN'
