name: TEMP S01-C02 Ops 1.21.847 Formal Release
on:
  push:
    branches:
      - temp/s01-c02-v121845-runtime-suffix-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121847-formal-release.yml'
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      COMMIT: 8e4127d67d27df90d56f96ccdd86d545877d70df
      TREE: de14a4ff27d8eda30a20ea7e7afa730f6ebe3c7c
      TAG: v1.21.847
      ASSET: vf-tools-ops_V1.21.847.zip
      BYTES: '3319022'
      SHA256: f88136193770a21d4a4a0b2e5d47c3089b7fc2fa293a8931e0f2e1ccd94c59b2
      FILES: '929'
      FP: a9fd2ef209a5b06890e48e1274f005c2efd402c0bfecc8d041aabe046a632207
      RUNNER_MAIN: 0160b557ad4ae0e8c6acd97e7551285bc05870bd
    steps:
      - name: Verify authority gates and release absence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/main --jq .object.sha)" = "$COMMIT"
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/develop --jq .object.sha)" = "$COMMIT"
          test "$(git ls-remote https://github.com/llhzx2018/core-free-runner-public.git refs/heads/main | awk '{print $1}')" = "$RUNNER_MAIN"
          if gh api "repos/llhzx2018/vf-tools-ops/git/ref/tags/$TAG" >/dev/null 2>&1; then exit 1; fi
          if gh release view "$TAG" --repo llhzx2018/vf-tools-ops >/dev/null 2>&1; then exit 1; fi
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.COMMIT }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: ops
      - name: Rebuild exact artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$COMMIT"
          test "$(git -C ops rev-parse HEAD^{tree})" = "$TREE"
          test "$(tr -d '\r\n' < ops/VERSION)" = 1.21.847
          php ops/.github/phase3/v121847-root-helper-prepare-recovery.php | grep -Fxq PASS_V121847_ROOT_HELPER_PREPARE_RECOVERY
          mkdir -p /tmp/release
          python3 - <<'PY'
          import re, hashlib, zipfile, os
          from pathlib import Path
          root=Path('ops'); files={}
          def ok(r):
              p=r.as_posix(); q=p.split('/')
              if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in q): return False
              if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',p,re.I): return False
              if '/' not in p: return p in {'vf-ops.php','uninstall.php'}
              return q[0] in {'includes','assets','languages','config'}
          for s in root.rglob('*'):
              if s.is_file() and not s.is_symlink():
                  r=s.relative_to(root)
                  if ok(r): files[r.as_posix()]=s.read_bytes()
          files=dict(sorted(files.items())); fp=hashlib.sha256()
          for r,b in files.items(): fp.update((r+'\0'+hashlib.sha256(b).hexdigest()+'\n').encode())
          z=Path('/tmp/release/'+os.environ['ASSET'])
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as out:
              for r,b in files.items():
                  info=zipfile.ZipInfo('vf-ops/'+r,(2026,9,6,0,0,0)); info.compress_type=zipfile.ZIP_DEFLATED; info.external_attr=0o100644<<16; out.writestr(info,b)
          actual_sha=hashlib.sha256(z.read_bytes()).hexdigest(); actual_fp=fp.hexdigest()
          assert str(z.stat().st_size)==os.environ['BYTES']
          assert actual_sha==os.environ['SHA256']
          assert str(len(files))==os.environ['FILES']
          assert actual_fp==os.environ['FP']
          print('FORMAL_ASSET_BYTES='+str(z.stat().st_size))
          print('FORMAL_ASSET_SHA256='+actual_sha)
          print('FORMAL_RUNTIME_FILES='+str(len(files)))
          print('FORMAL_RUNTIME_FP='+actual_fp)
          PY
          unzip -tq "/tmp/release/$ASSET" >/dev/null
      - name: Create formal tag release and asset
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/notes.md <<'EOF'
          VF Tools Ops V1.21.847 recovers the genuine Production Stage-4 root-helper payload preparation failure exposed after V1.21.846 successfully removed the stale Final Audit contamination.

          - Focused Gate 34011704914 PASS on exact source 8e4127d67d27df90d56f96ccdd86d545877d70df / tree de14a4ff27d8eda30a20ea7e7afa730f6ebe3c7c.
          - Deterministic Artifact Identity 34011732108 PASS.
          - Production V1.21.846 proves a distinct fresh Candidate reached Stage 4 with 231/231 main build items, completeness PASS, zero audit failures and zero internal-link failure leaves, then failed before root helper writes at helper_root_prepare.
          - V1.21.847 isolates root-helper metadata producers. Metadata-only helpers may use contract-safe NOT_VERIFIED/finalOnlinePass=NO fallbacks when a producer throws or returns an invalid payload; _redirects and ads.txt generation remain fail-closed and are never silently dropped.
          - candidate-actions.json fallback preserves numeric outputFiles and candidateZipEntries so Final Audit still verifies actual ZIP entry counts. Health/report/version fallbacks remain candidate-only and explicitly do not claim Online PASS.
          - Recovery activates only on the exact V1.21.846 terminal boundary: Candidate mode, Stage 4, initialized build, offset==total>0, helper_root_prepare, helpers_written=false, completeness PASS, zero audit failures and direct build classifier candidate_helper_root_prepare_failed.
          - Trusted DONE inspection, immutable Source SHA, exact inspection lineage, release-record active/candidate pointers and record Source hashes are independently re-proved. The failed V1.21.846 Candidate is never reset/reused.
          - Only after proof is the mutable release record rebound to the trusted inspect-only job, terminal carry is verified absent, and a distinct RUNNING Stage-0 Candidate with exact Source SHA and zero inherited audit failures is created and delegated to the existing bounded worker.
          - Static Source is not uploaded or mutated. Final Audit, candidatePackageReady, DNS and finalOnline are never forced.
          - M3U8 migration/schema/DB, Seed HOLD, JD.gg, WPvivid and content governance remain untouched.
          - Asset vf-tools-ops_V1.21.847.zip; 3319022 bytes; SHA256 f88136193770a21d4a4a0b2e5d47c3089b7fc2fa293a8931e0f2e1ccd94c59b2; runtime files 929; fingerprint a9fd2ef209a5b06890e48e1274f005c2efd402c0bfecc8d041aabe046a632207.
          - Production upgrade is NOT executed by this GitHub Release.
          EOF
          gh release create "$TAG" "/tmp/release/$ASSET#$ASSET" --repo llhzx2018/vf-tools-ops --target "$COMMIT" --title 'VF Tools Ops v1.21.847' --notes-file /tmp/notes.md
          gh api "repos/llhzx2018/vf-tools-ops/releases/tags/$TAG" > /tmp/release.json
          jq -e --arg t "$TAG" --arg c "$COMMIT" --arg a "$ASSET" --argjson b "$BYTES" --arg d "sha256:$SHA256" '.tag_name==$t and .target_commitish==$c and .draft==false and .prerelease==false and ([.assets[] | select(.name==$a and .size==$b and .digest==$d)] | length)==1' /tmp/release.json >/dev/null
          jq -r '"FORMAL_RELEASE_ID=" + (.id|tostring), "FORMAL_ASSET_ID=" + (.assets[0].id|tostring), "FORMAL_PUBLISHED_AT=" + .published_at' /tmp/release.json
          test "$(git ls-remote https://github.com/llhzx2018/core-free-runner-public.git refs/heads/main | awk '{print $1}')" = "$RUNNER_MAIN"
          echo FORMAL_RELEASE_V121847=PASS
