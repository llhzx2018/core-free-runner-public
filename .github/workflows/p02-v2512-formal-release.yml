name: P02 V2.5.12 Formal Verify And Publish

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v2512-formal-release.yml'

permissions:
  contents: read

jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require registered capabilities
        env:
          RELEASE_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
        run: test -n "$RELEASE_TOKEN"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: 1f7d0f5227830da66f06db6966c283efce9d885c
          token: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
          path: product
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize sealed formal pipeline for V2.5.12
        env:
          PRODUCT_REF: 1f7d0f5227830da66f06db6966c283efce9d885c
          RELEASE_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
        run: |
          set -Eeuo pipefail
          git fetch origin task/p02-v2511-formal-release
          git show FETCH_HEAD:scripts/p02-v2510-formal-release.sh > "$RUNNER_TEMP/p02-v2512-formal.sh"
          python3 - "$RUNNER_TEMP/p02-v2512-formal.sh" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]);s=p.read_text(encoding='utf-8')
          # First move the old target 2.5.10 to the new immutable target 2.5.12,
          # then move the old source 2.5.9 to the actual Production source 2.5.10.
          s=s.replace('2.5.10','2.5.12')
          s=s.replace('2.5.9','2.5.10')
          s=s.replace('32225789953','32227564011')
          # Normalize formal release notes to the actual purpose of this superseding release.
          marker="notes=out/f'VF_Library_V{VER}_RELEASE_NOTES.md'; notes.write_text(f'''"
          end="''')\n arts=[sz,fz,uz,az,rf,notes]"
          if marker in s and end in s:
              i=s.index(marker);j=s.index(end,i)
              notes="""notes=out/f'VF_Library_V{VER}_RELEASE_NOTES.md'; notes.write_text(f'''# VF Library V{VER}\n\nV2.5.12 is the immutable standard-asset superseding release for actual Production V2.5.10.\n\n- Runtime UX/functionality is unchanged from the already verified V2.5.11 Scratch Tabs refinement.\n- Explicit Scratch TAB clicks open at document top.\n- Desktop Scratch workspace uses one compact top row.\n- Live line count is shown with autosave state, e.g. “42 行 · 已保存”.\n- V2.5.12 uses the canonical VF_Library_V2.5.12_UPDATE.zip asset required by the installed V2.5.10 UpdateService security contract.\n- Candidate Run 32231388825 passed repository/privacy, Fresh Install, actual V2.5.10 UpdateService, existing-data upgrade, automatic backup, data/favorite/session/Scratch preservation and SQLite integrity/FK gates.\n- Schema remains {SCHEMA}; no migration. Existing {SRCVER} sites use UPDATE.\n''')\n arts=[sz,fz,uz,az,rf,notes]"""
              s=s[:i]+notes+s[j+len(end):]
          p.write_text(s,encoding='utf-8')
          PY
          bash "$RUNNER_TEMP/p02-v2512-formal.sh"
