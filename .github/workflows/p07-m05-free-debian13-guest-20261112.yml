name: P07-M05 新服务器初始化 — Free Debian13 MariaDB 11.8 Native Guest Proof
on:
  push:
    branches: [feat/p07-unified-independent-module-router-20261112]
    paths:
      - 'tests/p07_m05_debian13_qemu_tcg.sh'
      - '.github/workflows/p07-m05-free-debian13-guest-20261112.yml'
permissions:
  contents: read
jobs:
  fresh-debian13-qemu-real-mariadb118:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout public P07 free machine test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # One bounded Formal Release capability check. Do NOT rerun the
      # >2300s TCG full-install timeout or duplicate the engine-only PASS.
      # A missing /dev/kvm is an infrastructure gate, not product source FAIL.
      - name: Formal Release native KVM capability gate — fail closed before private checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! -c /dev/kvm || ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo P07_M05_DEBIAN13_NATIVE_KVM=BLOCKED_INFRA_NO_KVM_DEVICE
            echo P07_M05_DEBIAN13_CLOUDPANEL_FULL=NOT_RUN
            echo P07_M05_FORMAL_RELEASE_GATE=BLOCKED_INFRA_KVM
            echo P07_M05_REPEATED_TCG_FULL_INSTALL=NO
            echo P07_M05_OWNER_SERVER=UNTOUCHED
            echo "Blocked: GitHub hosted test VM has no usable /dev/kvm; real Debian13 CloudPanel full bootstrap proof is still required." >> "$GITHUB_STEP_SUMMARY"
            exit 13
          fi
          echo P07_M05_DEBIAN13_NATIVE_KVM=AVAILABLE
          echo P07_M05_DEBIAN13_REAL_KVM_FULL_PROOF=START
      - name: Checkout exact private M05 standalone Owner Trial only in transient workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 1d288ae7fc2f213b702a43c8596a7284f3bfb82e
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private_m05
      - name: Prove real Debian13 + MariaDB11.8 CloudPanel full and first admin on KVM only
        shell: bash
        env:
          P07_M05_THROWAWAY_GITHUB_VM: YES_I_ACKNOWLEDGE_EPHEMERAL_GH_VM
          P07_M05_EXPLICIT_FULL_INSTALL_ON_KVM: 'YES'
        run: |
          set -Eeuo pipefail
          export P07_M05_OFFLINE_TRIAL_FILE="$GITHUB_WORKSPACE/private_m05/owner-trial/P07-M05-0.1.0-m05-candidate2-OFFLINE.run"
          test "$(git -C private_m05 rev-parse HEAD)" = '1d288ae7fc2f213b702a43c8596a7284f3bfb82e'
          bash tests/p07_m05_debian13_qemu_tcg.sh
      - name: Erase private product checkout after free VM test
        shell: bash
        if: always()
        run: |
          set +e
          rm -rf -- private_m05
          echo P07_M05_DEBIAN13_FREE_PRIVATE_CLEANUP=YES
