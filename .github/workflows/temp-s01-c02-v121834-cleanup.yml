name: TEMP S01-C02 Clean Ops 1.21.834 Prefix
on:
  push:
    branches:
      - temp/s01-c02-v121834-patch-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121834-cleanup.yml'
jobs:
  clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      EXPECTED: d33298c6139851e8671f0ae96f2633cb5d3b76c8
      WORK_BRANCH: work/s01-c02-v121834-zero-write-batch-closure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: temp/s01-c02-v121834-patch-20260905
          persist-credentials: false
          path: runner
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.WORK_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
          path: ops
      - name: Clean and verify
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$EXPECTED"
          python3 runner/.github/scripts/v121834_fix_leading_marker.py
          test "$(head -c 5 ops/includes/site-release/s01-static-zero-write-batch-retry-v121834.php)" = '<?php'
          test "$(head -c 5 ops/.github/phase3/v121834-zero-write-batch-closure.php)" = '<?php'
          php -l ops/includes/site-release/s01-static-zero-write-batch-retry-v121834.php >/dev/null
          php -l ops/.github/phase3/v121834-zero-write-batch-closure.php >/dev/null
          php ops/.github/phase3/v121834-zero-write-batch-closure.php | grep -Fxq PASS_V121834_ZERO_WRITE_BATCH_CLOSURE
          git -C ops diff --check
      - name: Commit cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C ops config user.name VictorForge
          git -C ops config user.email llhzx2018@gmail.com
          git -C ops add includes/site-release/s01-static-zero-write-batch-retry-v121834.php .github/phase3/v121834-zero-write-batch-closure.php
          test "$(git -C ops diff --cached --name-only | wc -l | tr -d ' ')" = 2
          git -C ops commit -m 'fix(S01-C02): remove generated PHP prefix marker'
          git -C ops push origin HEAD:${WORK_BRANCH}
          echo PRODUCT_CANDIDATE_COMMIT=$(git -C ops rev-parse HEAD)
          echo PRODUCT_CANDIDATE_TREE=$(git -C ops rev-parse HEAD^{tree})
