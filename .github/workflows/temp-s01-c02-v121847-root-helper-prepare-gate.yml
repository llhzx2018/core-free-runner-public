name: TEMP S01-C02 Ops 1.21.847 Root Helper Prepare Gate
on:
  push:
    branches:
      - temp/s01-c02-v121845-runtime-suffix-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121847-root-helper-prepare-gate.yml'
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      COMMIT: 8e4127d67d27df90d56f96ccdd86d545877d70df
      TREE: de14a4ff27d8eda30a20ea7e7afa730f6ebe3c7c
      BASE: b6745c09ecaa7a27deed3c970f683d86425fcc35
      CORE_UPDATES: 1cbae32a0be0b3e21e12d98605c7e302105d885b
      RUNNER_MAIN: 0160b557ad4ae0e8c6acd97e7551285bc05870bd
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.COMMIT }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops
      - name: Verify source and Phase3
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$COMMIT"
          test "$(git -C ops rev-parse HEAD^{tree})" = "$TREE"
          test "$(tr -d '\r\n' < ops/VERSION)" = '1.21.847'
          php -l ops/includes/release/builders/class-candidate-helper-writer.php >/dev/null
          php -l ops/includes/site-release/s01-static-root-helper-prepare-recovery-v121847.php >/dev/null
          php -l ops/vf-ops.php >/dev/null
          php -l ops/.github/phase3/v121847-root-helper-prepare-recovery.php >/dev/null
          php ops/.github/phase3/v121847-root-helper-prepare-recovery.php | grep -Fxq 'PASS_V121847_ROOT_HELPER_PREPARE_RECOVERY'
      - name: Verify narrow diff
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t files < <(git -C ops diff --name-only "$BASE" "$COMMIT")
          test "${#files[@]}" = 5
          printf '%s\n' "${files[@]}" | grep -Fxq '.github/phase3/v121847-root-helper-prepare-recovery.php'
          printf '%s\n' "${files[@]}" | grep -Fxq 'VERSION'
          printf '%s\n' "${files[@]}" | grep -Fxq 'includes/release/builders/class-candidate-helper-writer.php'
          printf '%s\n' "${files[@]}" | grep -Fxq 'includes/site-release/s01-static-root-helper-prepare-recovery-v121847.php'
          printf '%s\n' "${files[@]}" | grep -Fxq 'vf-ops.php'
      - name: Verify Engineering authority
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/main --jq .object.sha)" = "$BASE"
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/develop --jq .object.sha)" = "$BASE"
          test "$(gh api repos/llhzx2018/core-updates/git/ref/heads/main --jq .object.sha)" = "$CORE_UPDATES"
          test "$(gh api repos/llhzx2018/core-updates/git/ref/heads/develop --jq .object.sha)" = "$CORE_UPDATES"
      - name: Verify Production 1.21.846 root-prepare boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-domain-authority' -o /tmp/domain.json
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-static-candidate-readiness' -o /tmp/static.json
          jq -e '.pluginVersion=="1.21.846" and .status=="CURRENT" and .authorityFinalHost=="https://ilovem3u8.com" and .configuredPublicBaseUrl=="https://ilovem3u8.com" and .authorityMatch==true' /tmp/domain.json >/dev/null
          jq -e '.pluginVersion=="1.21.846" and .sourceArtifactAvailable==true and .manualSourceUploadRequired==false and .candidatePackageReady==false and .finalOnlinePass=="NO"' /tmp/static.json >/dev/null
          jq -e '.activeStaticJobStatus=="FAIL" and .activeStaticJobMode=="candidate" and .activeStaticJobFirstFailedStep=="candidate_build" and .activeStaticJobFailureCount==1 and .activeStaticJobNonAuditFailureCount==1 and .activeStaticJobAuditFailureCount==0 and .activeStaticJobInternalLinkFailureLeafCount==0' /tmp/static.json >/dev/null
          jq -e '.sourceRecoveryStructuralRetryStatus=="fail" and .sourceRecoveryStructuralRetryCode=="structural_retry_fresh_candidate_terminal" and .sourceRecoveryStructuralRetryCandidateCurrentStage==4 and .sourceRecoveryStructuralRetryCandidateBuildOffset==231 and .sourceRecoveryStructuralRetryCandidateBuildTotal==231 and .sourceRecoveryStructuralRetryCandidateHelperPhase=="helper_root_prepare" and .sourceRecoveryStructuralRetryCandidateHelpersWritten==false and .sourceRecoveryStructuralRetryCandidateCompletenessStatus=="pass" and .sourceRecoveryStructuralRetryCandidateAuditFailureCount==0' /tmp/static.json >/dev/null
      - name: Verify runner main unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git ls-remote https://github.com/llhzx2018/core-free-runner-public.git refs/heads/main | awk '{print $1}')" = "$RUNNER_MAIN"
          echo PASS_V121847_FOCUSED_GATE
