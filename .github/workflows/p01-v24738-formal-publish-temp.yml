      - name: Independent remote byte readback
        env:
          GH_TOKEN: ${{ env.READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ASSETS=/tmp/p01-v24738-formal-artifacts
          test "$(gh api "repos/${PRODUCT_REPO}/git/ref/tags/${TARGET_TAG}" --jq '.object.sha')" = "$FORMAL_SHA"
          rm -rf /tmp/p01-v24738-remote
          mkdir -p /tmp/p01-v24738-remote
          gh release download "$TARGET_TAG" --repo "$PRODUCT_REPO" --dir /tmp/p01-v24738-remote
          LOCAL="$ASSETS" REMOTE=/tmp/p01-v24738-remote python3 - <<'PY'
          from pathlib import Path
          import hashlib,os
          l=Path(os.environ['LOCAL']); r=Path(os.environ['REMOTE'])
          names=['VF-Start-V2.47.38-FULL.zip','VF-Start-V2.47.38-FULL.zip.sha256','VF_Start_V2.47.38_UPDATE.zip','VF_Start_V2.47.38_UPDATE.zip.sha256','SHA256SUMS.txt']
          assert sorted(p.name for p in r.iterdir() if p.is_file())==sorted(names)
          for n in names:
              a,b=l/n,r/n
              ha=hashlib.sha256(a.read_bytes()).hexdigest(); hb=hashlib.sha256(b.read_bytes()).hexdigest()
              assert a.stat().st_size==b.stat().st_size and ha==hb
              print(f'FORMAL_ASSET={n}|{a.stat().st_size}|{ha}')
          print('P01_V24738_REMOTE_BYTES=PASS')
          PY

