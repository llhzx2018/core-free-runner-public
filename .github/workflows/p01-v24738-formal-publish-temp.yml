          - 页面显示受保护备份数量，并明确受保护恢复点不参与自动清理。
          - retention 仍只清理 automatic + unprotected；keep_recent / retention_days 行为不变。
          - 在线升级前恢复点继续保持 pre-update + protected=true。
          - 本版本不自动删除任何 Production 备份，不改变 backup/disaster/history API、Schema、用户数据、权限与 IA。

          Exact Formal Source: ${FORMAL_SHA}
