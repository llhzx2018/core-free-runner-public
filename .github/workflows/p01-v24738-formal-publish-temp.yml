name: p01-v24738-formal-publish-temp

on:
  push:
    branches:
      - release/p01-v24738-publish

permissions:
  contents: read

concurrency:
  group: p01-v24738-formal-publish
  cancel-in-progress: false

jobs:
  artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      FORMAL_SHA: 3394e056ce9c0f6ba3667a67a8bc5ae1c4c513b0
      SOURCE_TAG: v2.47.37
      SOURCE_SHA: 0257705ab40bb9a34e64dabcab6961f4e44928d5
      SOURCE_VERSION: 2.47.37
      TARGET_VERSION: 2.47.38
      TARGET_TAG: v2.47.38
      EXPECTED_SCHEMA: '2026090401'
      CANDIDATE_RUN: '35497178395'
      BACKEND_GATE_RUN: '35497034328'
      BIND_PR: '838'
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}

    steps:
      - name: Exact formal authority
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$RELEASE_TOKEN"
          test "$(GH_TOKEN="$READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/main" --jq '.object.sha')" = "$FORMAL_SHA"
          test "$(GH_TOKEN="$READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/tags/${SOURCE_TAG}" --jq '.object.sha')" = "$SOURCE_SHA"
          if GH_TOKEN="$READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/tags/${TARGET_TAG}" >/dev/null 2>&1; then
            echo BLOCK=TARGET_TAG_ALREADY_EXISTS
            exit 81
          fi
          echo P01_V24738_FORMAL_AUTHORITY=PASS

      - name: Checkout exact formal source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.FORMAL_SHA }}
          token: ${{ env.READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          path: vf-start

      - name: Checkout exact V2.47.37 baseline
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ env.READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: baseline

      - name: Checkout proven artifact helper
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: 1dd635d8e8d4485736458672fb7a5be397d94f89
          token: ${{ env.READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: helper

      - name: Checkout proven artifact template
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: 0439b0df027ae0bc6c21a8dbf91b066a564130f9
          token: ${{ env.READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: template

      - name: Checkout proven Atomic primitives
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 0468b28ae57c368f80b03f85060318667bcc5834
          persist-credentials: false
          fetch-depth: 1
          path: proven

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd,opcache
          coverage: none

      - name: Exact source syntax and backend contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C vf-start rev-parse HEAD)" = "$FORMAL_SHA"
          test "$(git -C baseline rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n ' < vf-start/VERSION)" = "$TARGET_VERSION"
          test "$(tr -d '\r\n ' < vf-start/src/VERSION.txt)" = "$TARGET_VERSION"
          grep -Fq "define('VF_VERSION', '${TARGET_VERSION}');" vf-start/src/app/bootstrap.php
          test "$(php -r '$p=json_decode(file_get_contents("vf-start/VF_PROJECT.json"),true); echo $p["working_schema_version"];')" = "$EXPECTED_SCHEMA"
          grep -Fq 'OWNER_PREVIEW_RUNTIME_APPLICABILITY = N_A' vf-start/docs/release/V2.47.38_RELEASE_GATE.md
          grep -Fq 'NO_UNKNOWN_APPLICABILITY = YES' vf-start/docs/release/V2.47.38_RELEASE_GATE.md
          grep -Fq 'PRE_RELEASE_AUTHORITY_DRIFT_GATE = PASS' vf-start/docs/release/V2.47.38_RELEASE_GATE.md
          grep -Fq '| OBSERVABILITY | N_A |' vf-start/docs/release/V2.47.38_RELEASE_GATE.md
          grep -Fq '| PERFORMANCE | N_A |' vf-start/docs/release/V2.47.38_RELEASE_GATE.md
          grep -Fq '| CRON_JOB | REQUIRED |' vf-start/docs/release/V2.47.38_RELEASE_GATE.md
          find vf-start/src -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          find vf-start/src -name '*.js' -print0 | xargs -0 -n1 node --check >/dev/null
          php vf-start/tests/unit/admin_resource_browse_edit_r5_contract.php
          php vf-start/tests/unit/admin_visual_system_r4_contract.php
          php vf-start/tests/unit/admin_rail_action_only_contract.php
          php vf-start/tests/unit/atomic_runtime_cache_contract.php
          php vf-start/tests/unit/update_recovery_contract.php
          php vf-start/tests/unit/admin_overview_ia_contract.php
          php vf-start/tests/unit/admin_secondary_nav_focus_contract.php
          php vf-start/tests/unit/admin_backend_closure_contract.php
          php vf-start/tests/unit/admin_visual_system_r3_contract.php
          php vf-start/tests/unit/admin_navigation_category_route_runtime_contract.php
          php vf-start/tests/unit/admin_navigation_task_separation_contract.php
          php vf-start/tests/unit/admin_resource_health_closure_contract.php
          php vf-start/tests/unit/admin_data_closure_contract.php
          php vf-start/tests/unit/admin_system_closure_contract.php
          php vf-start/tests/unit/admin_settings_focus_contract.php
          php vf-start/tests/unit/admin_overview_actionable_health_contract.php
          php vf-start/tests/unit/admin_rail_r7_contract.php
          php vf-start/tests/unit/pending_inbox_quiet_state_r7_contract.php
          php vf-start/tests/unit/system_health_runtime_r7_contract.php
          php vf-start/tests/unit/url_health_action_first_r7_contract.php
          php vf-start/tests/unit/url_health_table_fit_r8_contract.php
          php vf-start/tests/unit/url_health_freshness_r9_contract.php
          php vf-start/tests/unit/url_health_decision_first_r10_contract.php
          php vf-start/tests/unit/admin_recycle_bin_r11_contract.php
          php vf-start/tests/unit/admin_recycle_bin_r12_pagination_contract.php
          php vf-start/tests/unit/admin_data_safety_r13_contract.php
          php vf-start/tests/unit/admin_data_safety_r14_runtime_retention_contract.php
          python3 - <<'PY'
          from pathlib import Path
          x=Path('vf-start/src/assets/health.js').read_text(encoding='utf-8')
          assert "$$('[data-start]').forEach(b=>b.disabled=active)" in x
          assert ";$('[data-start]').forEach(b=>b.disabled=active)" not in x
          print('P01_V24738_HEALTH_SELECTOR_SOURCE=PASS')
          PY
          echo P01_V24738_EXACT_SOURCE_BACKEND_CONTRACTS=PASS

      - name: Rebuild deterministic FULL and Atomic UPDATE
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf formal candidate
          cp -a vf-start formal
          cp -a vf-start candidate
          cp helper/scripts/_tmp_p01_v2470_formal_artifact_gate.sh /tmp/p01-v24738-artifact-gate.sh
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path('/tmp/p01-v24738-artifact-gate.sh')
          s=p.read_text(encoding='utf-8')
          repl=[
            ('7f3492f70276d83efed371296d69709c1e991350',os.environ['FORMAL_SHA']),
            ('b70971514ccf1c6b8f3793bfc5a2200cad47dfe9',os.environ['FORMAL_SHA']),
            ('1bd95e8777e72f6cd89206ddb9daf934ad4e6b9e',os.environ['SOURCE_SHA']),
            ('33993725218',os.environ['GITHUB_RUN_ID']),
            ('BIND_PR=416','BIND_PR='+os.environ['BIND_PR']),
            ('OWNER_AUTHORIZED_V2470_RELEASE_CHAIN_20260906','OWNER_AUTHORIZED_V24738_DATA_SAFETY_R14_RUNTIME_20260920'),
            ('V2470','V24738'),('v2470','v24738')
          ]
          for a,b in repl:
              if a not in s: raise SystemExit('missing helper anchor '+a)
              s=s.replace(a,b)
          s=s.replace('2.47.0','__TARGET__').replace('2.46.4',os.environ['SOURCE_VERSION']).replace('__TARGET__',os.environ['TARGET_VERSION'])
          old="src=src.replace(\"'release_type':'patch'\",\"'release_type':'minor'\")"
          if old not in s: raise SystemExit('release-type helper anchor missing')
          inner_patch="src=src.replace('V2.46.1 之后 Consolidated L2 Product Optimization 的正式发布版本。','V2.47.37 之后 Data Safety R14 运行时修复与受保护保留真相的正式发布版本.')\nbuilder_anchor=\"    return repair.replace(old,new,1)\"\nbuilder_replacement=\"    repair=repair.replace(old,new,1)\\n    method_anchor=\\\"    public static function selfTest(): array {\\\"\\n    method=\\\"    private static function refreshRuntimeCache(string $root): array {\\\\n        $helper=rtrim($root,'/').'/app/AtomicRuntimeCache.php';\\\\n        if(!is_file($helper)||is_link($helper))throw new RuntimeException('Atomic runtime cache helper missing.');\\\\n        require_once $helper;\\\\n        if(!class_exists('VfAtomicRuntimeCache',false))throw new RuntimeException('Atomic runtime cache helper invalid.');\\\\n        return VfAtomicRuntimeCache::refresh($root);\\\\n    }\\\\n\\\"\\n    if repair.count(method_anchor)!=1: raise SystemExit('atomic cache method anchor mismatch')\\n    repair=repair.replace(method_anchor,method+method_anchor,1)\\n    current_anchor=\\\"$dbv=self::dbVerify((string)$rt['db_file']);return ['ok'=>true,'already_current'=>true,'interrupted_recovered'=>$recovered,'schema'=>$dbv['schema'],'integrity'=>$dbv['integrity'],'fk'=>$dbv['foreign_key_errors']];\\\"\\n    current_new=\\\"$dbv=self::dbVerify((string)$rt['db_file']);$runtimeCache=self::refreshRuntimeCache($root);return ['ok'=>true,'already_current'=>true,'interrupted_recovered'=>$recovered,'schema'=>$dbv['schema'],'integrity'=>$dbv['integrity'],'fk'=>$dbv['foreign_key_errors'],'runtime_cache'=>$runtimeCache];\\\"\\n    if repair.count(current_anchor)!=1: raise SystemExit('atomic already-current cache anchor mismatch')\\n    repair=repair.replace(current_anchor,current_new,1)\\n    commit_anchor=\\\"$dbv=self::dbVerify($db);self::jsonWrite($journal,['target_version'=>self::TARGET_VERSION,'source_version'=>self::SOURCE_VERSION,'stage'=>$stage,'phase'=>'commit_ready','created_at'=>gmdate('c')]);\\\"\\n    commit_new=\\\"$dbv=self::dbVerify($db);$runtimeCache=self::refreshRuntimeCache($root);self::jsonWrite($journal,['target_version'=>self::TARGET_VERSION,'source_version'=>self::SOURCE_VERSION,'stage'=>$stage,'phase'=>'commit_ready','created_at'=>gmdate('c')]);\\\"\\n    if repair.count(commit_anchor)!=1: raise SystemExit('atomic commit cache anchor mismatch')\\n    repair=repair.replace(commit_anchor,commit_new,1)\\n    return_anchor=\\\"'target_checked'=>$target['checked'],'rollback_supported'=>true];\\\"\\n    return_new=\\\"'target_checked'=>$target['checked'],'rollback_supported'=>true,'runtime_cache'=>$runtimeCache];\\\"\\n    if repair.count(return_anchor)!=1: raise SystemExit('atomic return cache anchor mismatch')\\n    return repair.replace(return_anchor,return_new,1)\"\nif builder_anchor not in src: raise SystemExit('builder Atomic cache anchor missing')\nsrc=src.replace(builder_anchor,builder_replacement,1)"
          s=s.replace(old,inner_patch,1)
          p.write_text(s,encoding='utf-8')
          PY
          chmod +x /tmp/p01-v24738-artifact-gate.sh
          bash /tmp/p01-v24738-artifact-gate.sh | tee /tmp/p01-v24738-artifact.log
          grep -Fx 'P01_V24738_FORMAL_ARTIFACT_GATE=PASS' /tmp/p01-v24738-artifact.log
          jq -e '.runtime_cache as $r | (($r|type)=="object") and ($r|has("opcache_available")) and ($r|has("files_checked")) and ($r|has("reset"))' /tmp/v24738-formal-upgrade.json >/dev/null
          grep -Fq 'private static function refreshRuntimeCache(string $root): array' /tmp/p01-v24738-formal-artifacts/repair-v2.47.38.php
          grep -Fq 'app/AtomicRuntimeCache.php' /tmp/p01-v24738-formal-artifacts/repair-v2.47.38.php
          grep -Fq 'VfAtomicRuntimeCache::refresh($root)' /tmp/p01-v24738-formal-artifacts/repair-v2.47.38.php
          cmp -s /tmp/p01-v24738-formal-upgrade/app/AdminShell.php vf-start/src/app/AdminShell.php
          cmp -s /tmp/p01-v24738-formal-upgrade/assets/admin-shell.js vf-start/src/assets/admin-shell.js
          cmp -s /tmp/p01-v24738-formal-upgrade/assets/admin-shell.css vf-start/src/assets/admin-shell.css
          cmp -s /tmp/p01-v24738-formal-upgrade/assets/admin-consolidation.css vf-start/src/assets/admin-consolidation.css
          cmp -s /tmp/p01-v24738-formal-upgrade/assets/admin-resource-manager.css vf-start/src/assets/admin-resource-manager.css
          cmp -s /tmp/p01-v24738-formal-upgrade/assets/admin-resource-manager-core.js vf-start/src/assets/admin-resource-manager-core.js
          cmp -s /tmp/p01-v24738-formal-upgrade/surface-manager.php vf-start/src/surface-manager.php
          cmp -s /tmp/p01-v24738-formal-upgrade/links-admin.php vf-start/src/links-admin.php
          cmp -s /tmp/p01-v24738-formal-upgrade/assets/links-admin.js vf-start/src/assets/links-admin.js
          cmp -s /tmp/p01-v24738-formal-upgrade/health.php vf-start/src/health.php
          cmp -s /tmp/p01-v24738-formal-upgrade/assets/health.js vf-start/src/assets/health.js
          cmp -s /tmp/p01-v24738-formal-upgrade/transfer.php vf-start/src/transfer.php
          cmp -s /tmp/p01-v24738-formal-upgrade/system-health.php vf-start/src/system-health.php
          cmp -s /tmp/p01-v24738-formal-upgrade/assets/system.js vf-start/src/assets/system.js
          cmp -s /tmp/p01-v24738-formal-upgrade/settings.php vf-start/src/settings.php
          cmp -s /tmp/p01-v24738-formal-upgrade/assets/settings-admin.js vf-start/src/assets/settings-admin.js
          cmp -s /tmp/p01-v24738-formal-upgrade/manage.php vf-start/src/manage.php
          cmp -s /tmp/p01-v24738-formal-upgrade/recycle-bin.php vf-start/src/recycle-bin.php
          cmp -s /tmp/p01-v24738-formal-upgrade/assets/recycle-bin.js vf-start/src/assets/recycle-bin.js
          cmp -s /tmp/p01-v24738-formal-upgrade/data-safety.php vf-start/src/data-safety.php
          cmp -s /tmp/p01-v24738-formal-upgrade/assets/data-recovery.js vf-start/src/assets/data-recovery.js
          grep -Fq 'P01 Admin Visual System R4 — enterprise unified' /tmp/p01-v24738-formal-upgrade/assets/admin-consolidation.css
          grep -Fq 'P01 Admin Visual System R4 — resource workbench alignment' /tmp/p01-v24738-formal-upgrade/assets/admin-resource-manager.css
          grep -Fq 'P01 Resource Browser R5 — browse first, edit on demand.' /tmp/p01-v24738-formal-upgrade/assets/admin-resource-manager.css
          grep -Fq 'class="vf-resource-editor-details"' /tmp/p01-v24738-formal-upgrade/surface-manager.php
          grep -Fq "var details=savedRow.querySelector('.vf-resource-editor-details');if(details)details.open=true;" /tmp/p01-v24738-formal-upgrade/assets/admin-resource-manager-core.js
          ! grep -Fq '系统收件箱' /tmp/p01-v24738-formal-upgrade/app/AdminShell.php
          ! grep -Fq '资源库' /tmp/p01-v24738-formal-upgrade/app/AdminShell.php
          ! grep -Fq '业务分类' /tmp/p01-v24738-formal-upgrade/app/AdminShell.php
          grep -Fq "['href'=>'health.php','label'=>'网址健康']" /tmp/p01-v24738-formal-upgrade/app/AdminShell.php
          grep -Fq "get('workspace')==='categories'" /tmp/p01-v24738-formal-upgrade/assets/links-admin.js
          ! grep -Fq "location.hash==='#categories'" /tmp/p01-v24738-formal-upgrade/assets/links-admin.js
          grep -Fq '跨资源批量整理（低频）' /tmp/p01-v24738-formal-upgrade/transfer.php
          grep -Fq '请到“RSS 与扩展”' /tmp/p01-v24738-formal-upgrade/system-health.php
          grep -Fq 'class="vf-admin-subnav vf-settings-tabs"' /tmp/p01-v24738-formal-upgrade/settings.php
          grep -Fq "get('section')||'brand'" /tmp/p01-v24738-formal-upgrade/assets/settings-admin.js
          grep -Fq '网址健康需要处理' /tmp/p01-v24738-formal-upgrade/manage.php
          grep -Fq '条尚未检查' /tmp/p01-v24738-formal-upgrade/manage.php
          grep -Fq 'P01 Admin Rail R7 — quiet parent context, leaf-only emphasis, compact submenu rhythm.' /tmp/p01-v24738-formal-upgrade/assets/admin-consolidation.css
          grep -Fq -- '--vf-admin-rail:224px;' /tmp/p01-v24738-formal-upgrade/assets/admin-consolidation.css
          ! grep -Fq "group('系统收件箱'" /tmp/p01-v24738-formal-upgrade/assets/pending-inbox-ux.js
          ! grep -Fq 'vf-rail-subgroup-label' /tmp/p01-v24738-formal-upgrade/assets/pending-inbox-ux.js
          grep -Fq '当前没有待整理网址' /tmp/p01-v24738-formal-upgrade/surface-manager.php
          grep -Fq ',all=s=>Array.from(document.querySelectorAll(s))' /tmp/p01-v24738-formal-upgrade/assets/system.js
          grep -Fq '正在检查运行状态…' /tmp/p01-v24738-formal-upgrade/system-health.php
          grep -Fq "if(raw===null)return'attention';" /tmp/p01-v24738-formal-upgrade/assets/health.js
          grep -Fq '全部状态（含正常）' /tmp/p01-v24738-formal-upgrade/health.php
          grep -Fq 'P01 URL Health R8 — desktop table fits without horizontal clipping; row actions stay compact.' /tmp/p01-v24738-formal-upgrade/assets/admin-consolidation.css
          grep -Fq 'function rowActions(i,backup,canPromote,canReplace)' /tmp/p01-v24738-formal-upgrade/assets/health.js
          grep -Fq 'class="vf-health-row-more"' /tmp/p01-v24738-formal-upgrade/assets/health.js
          grep -Fq '.table{width:100%!important;min-width:0!important;table-layout:fixed}' /tmp/p01-v24738-formal-upgrade/assets/admin-consolidation.css
          grep -Fq 'P01 URL Health R9 — separate job completion from current data coverage.' /tmp/p01-v24738-formal-upgrade/assets/admin-consolidation.css
          grep -Fq 'id="jobProgress" hidden' /tmp/p01-v24738-formal-upgrade/health.php
          grep -Fq 'id="jobFreshness"' /tmp/p01-v24738-formal-upgrade/health.php
          grep -Fq 'function relativeAge(ts)' /tmp/p01-v24738-formal-upgrade/assets/health.js
          grep -Fq 'progress.hidden=!active' /tmp/p01-v24738-formal-upgrade/assets/health.js
          grep -Fq '最近一次网址检查数据' /tmp/p01-v24738-formal-upgrade/assets/health.js
          grep -Fq 'P01 URL Health R10 — decision-first rows, technical diagnostics on demand.' /tmp/p01-v24738-formal-upgrade/assets/admin-consolidation.css
          grep -Fq 'function decisionHint(i)' /tmp/p01-v24738-formal-upgrade/assets/health.js
          grep -Fq 'function diagnosticDetails(i)' /tmp/p01-v24738-formal-upgrade/assets/health.js
          grep -Fq 'class="vf-health-diagnostics"><summary>诊断详情</summary>' /tmp/p01-v24738-formal-upgrade/assets/health.js
          grep -Fq '先判断状态，需要技术细节时再展开诊断详情。' /tmp/p01-v24738-formal-upgrade/health.php
          grep -Fq 'assets/health.js?v=2183' /tmp/p01-v24738-formal-upgrade/health.php
          grep -Fq 'P01 Recycle Bin R11 — restore-first, destructive actions on demand.' /tmp/p01-v24738-formal-upgrade/assets/admin-consolidation.css
          grep -Fq 'id="surfaceFilter"' /tmp/p01-v24738-formal-upgrade/recycle-bin.php
          grep -Fq 'id="selectionBar" hidden' /tmp/p01-v24738-formal-upgrade/recycle-bin.php
          grep -Fq 'function trashRowActions(x)' /tmp/p01-v24738-formal-upgrade/assets/recycle-bin.js
          grep -Fq 'class="vf-recycle-row-more"><summary>更多</summary>' /tmp/p01-v24738-formal-upgrade/assets/recycle-bin.js
          grep -Fq 'P01 Recycle Bin R12 — bounded list length with simple pagination.' /tmp/p01-v24738-formal-upgrade/assets/admin-consolidation.css
          grep -Fq 'id="trashPager" hidden' /tmp/p01-v24738-formal-upgrade/recycle-bin.php
          grep -Fq 'id="trashRange"' /tmp/p01-v24738-formal-upgrade/recycle-bin.php
          grep -Fq 'page:0,pageSize:50' /tmp/p01-v24738-formal-upgrade/assets/recycle-bin.js
          grep -Fq 'function pageRows(rows)' /tmp/p01-v24738-formal-upgrade/assets/recycle-bin.js
          grep -Fq 'P01 Data Safety R13 — backup-first, low-frequency recovery on demand.' /tmp/p01-v24738-formal-upgrade/assets/admin-consolidation.css
          grep -Fq '<details class="vf-data-settings" id="backupPolicyDetails">' /tmp/p01-v24738-formal-upgrade/data-safety.php
          grep -Fq 'vf-disaster-tools' /tmp/p01-v24738-formal-upgrade/data-safety.php
          grep -Fq 'vf-history-tools' /tmp/p01-v24738-formal-upgrade/data-safety.php
          grep -Fq 'class="vf-data-safety-state ' /tmp/p01-v24738-formal-upgrade/assets/data-recovery.js
          grep -Fq 'class="vf-data-row-more"><summary>更多</summary>' /tmp/p01-v24738-formal-upgrade/assets/data-recovery.js
          grep -Fq '受保护恢复点不会自动清理' /tmp/p01-v24738-formal-upgrade/data-safety.php
          grep -Fq 'assets/data-recovery.js?v=22124' /tmp/p01-v24738-formal-upgrade/data-safety.php
          python3 - <<'PY'
          from pathlib import Path
          x=Path('/tmp/p01-v24738-formal-upgrade/assets/data-recovery.js').read_text(encoding='utf-8')
          assert "$$('[data-verify]').forEach" in x
          assert "$$('[data-dr-restore]').forEach" in x
          assert '不参与自动清理' in x
          assert "$('[data-verify]').forEach" not in x.replace("$$('[data-verify]').forEach",'')
          print('P01_V24738_UPGRADED_DATA_SAFETY_RUNTIME=PASS')
          PY
          python3 - <<'PY'
          from pathlib import Path
          x=Path('/tmp/p01-v24738-formal-upgrade/assets/health.js').read_text(encoding='utf-8')
          assert "$$('[data-start]').forEach(b=>b.disabled=active)" in x
          assert ";$('[data-start]').forEach(b=>b.disabled=active)" not in x
          print('P01_V24738_UPGRADED_HEALTH_SELECTOR=PASS')
          PY
          echo P01_V24738_ATOMIC_RUNTIME_CACHE_HANDOFF=PASS
          echo P01_V24738_REAL_UPGRADE=PASS

      - name: Stable package contract
        shell: bash
        run: |
          set -Eeuo pipefail
