name: P02 R30 Runtime Style Owner Scan
on:
  push:
    branches: [run/p02-r30-runtime-style-owner-scan]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: ca8d806b11cfbc8cdb5e5998ef65aa8d64abd238
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Locate dynamic stylesheet and inline style owners
        working-directory: product
        run: |
          set -Eeuo pipefail
          echo '=== SCRATCH_STYLESHEET_REFERENCES ==='
          grep -RIn --exclude='scratch-tabs.css' 'scratch-tabs\.css' public scripts tests || true
          echo '=== INLINE_STYLE_CREATORS ==='
          grep -RInE "createElement\(['\"]style['\"]\)|<style|style\.textContent|style\.innerHTML|appendChild\(style\)|append\(style\)" public/assets public/*.php || true
          echo '=== NOTEBOOK_EDITING_DYNAMIC_RULE ==='
          grep -RInF 'notebook-layout.notebook-editing:not(.notebook-list-collapsed):not(.notebook-focus)' public scripts tests || true
          echo '=== NOTEBOOK_LIST_PANE_DISPLAY_RULES_OUTSIDE_APP_CSS ==='
          grep -RInE 'notebook-list-pane.*display|display[^;}]*(flex|none).*notebook-list-pane' public/assets --exclude='app.css' || true
          echo P02_R30_RUNTIME_STYLE_OWNER_SCAN=PASS
