name: P01 V2.35.0 Strict Fresh Install Fence

on:
  push:
    branches: [release/p01-v2350-orchestrator-20260831]
    paths: [.github/workflows/p01-v2350-strict-fresh-install-fence-20260831.yml]

permissions:
  contents: read
  actions: read

jobs:
  fresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FORMAL_RUN: '33332314263'
      FORMAL_ARTIFACT_ID: '9737997420'
      FORMAL_ARTIFACT_DIGEST: e3443b99e6105b237a8a6195a0bf677c6329d4aa7e54add7adf26c2e500ac691
      FORMAL_SOURCE: d20f8e964455c7238b66c6ff6ab2e7d732d315e2
      FORMAL_TREE: 1d9c8a11f1e8ddb7bb775b28592459f754c2c59b
      RUNTIME_TREE: 24953b64762b2d17076e4149a2aa49a492316477
      FULL_SHA: d1451544b4922a861b5a7b54f80fb359b957aa1aec1bd5627720d308316f656c
      FULL_BYTES: '637661'
      UPDATE_SHA: 73cbfabf9968c6366491a7f3caa6b70916432c638ac3e7df87479ccc2051e68a
      UPDATE_BYTES: '1381982'
      REPAIR_SHA: b51efdcacf7731b98dee3ecc86dce584eab9270283166f70362279a2cf02f287
      REPAIR_BYTES: '3969857'
      SCHEMA: '2026082901'
      VERSION: 2.35.0
      CONTRACT: /tmp/p01-v2350-strict-contract
      FRESH: /tmp/p01-v2350-strict-fresh
      EVID: /tmp/p01-v2350-strict-fresh-evidence
      PORT: '18377'
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none

      - name: Download exact formal Actions artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf "$CONTRACT" "$FRESH" "$EVID"; mkdir -p "$CONTRACT" "$FRESH" "$EVID"
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/artifacts/$FORMAL_ARTIFACT_ID/zip" \
            -o /tmp/p01-v2350-formal.zip
          test "$(sha256sum /tmp/p01-v2350-formal.zip | awk '{print $1}')" = "$FORMAL_ARTIFACT_DIGEST"
          unzip -q /tmp/p01-v2350-formal.zip -d "$CONTRACT"
          test "$(find "$CONTRACT" -maxdepth 1 -type f | wc -l)" = 8
          echo P01_V2350_EXACT_FORMAL_ARTIFACT_DOWNLOAD=PASS | tee "$EVID/artifact-download.txt"

      - name: Verify immutable formal contract bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$CONTRACT"
          sha256sum -c SHA256SUMS.txt
          test "$(sha256sum VF-Start-V2.35.0-FULL.zip | awk '{print $1}')" = "$FULL_SHA"
          test "$(stat -c%s VF-Start-V2.35.0-FULL.zip)" = "$FULL_BYTES"
          test "$(sha256sum VF_Start_V2.35.0_UPDATE.zip | awk '{print $1}')" = "$UPDATE_SHA"
          test "$(stat -c%s VF_Start_V2.35.0_UPDATE.zip)" = "$UPDATE_BYTES"
          test "$(sha256sum VF-Start-V2.35.0-UPDATE.zip | awk '{print $1}')" = "$UPDATE_SHA"
          test "$(sha256sum repair-v2.35.0.php | awk '{print $1}')" = "$REPAIR_SHA"
          test "$(stat -c%s repair-v2.35.0.php)" = "$REPAIR_BYTES"
          jq -e --arg source "$FORMAL_SOURCE" --arg tree "$FORMAL_TREE" --arg runtime "$RUNTIME_TREE" --arg full "$FULL_SHA" --arg update "$UPDATE_SHA" '.version=="2.35.0" and .schema=="2026082901" and .release_source==$source and .release_tree==$tree and .runtime_tree==$runtime and .formal_artifact_gate=="PASS" and .actual_upgrade=="PASS" and .full.sha256==$full and .update.sha256==$update and .release_published==false and .owner_production_write==false' P01-V2.35.0-FORMAL-METADATA.json >/dev/null
          php -l repair-v2.35.0.php >/dev/null
          php repair-v2.35.0.php --self-test | tee "$EVID/strict-repair-self-test.json" | jq -e '.ok==true and .global_barrier==true and .interruption_recovery==true' >/dev/null
          unzip -Z1 VF_Start_V2.35.0_UPDATE.zip | grep -Fx repair-v2.35.0.php >/dev/null
          echo P01_V2350_FORMAL_CONTRACT_BYTES=PASS | tee "$EVID/contract-bytes.txt"

      - name: Extract exact FULL and enforce clean-runtime boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          unzip -q "$CONTRACT/VF-Start-V2.35.0-FULL.zip" -d "$FRESH"
          test "$(cat "$FRESH/VERSION.txt")" = "$VERSION"
          grep -Fx "define('VF_VERSION', '2.35.0');" "$FRESH/app/bootstrap.php" >/dev/null
          test -f "$FRESH/release-manifest.json"
          jq -e --arg source "$FORMAL_SOURCE" --arg tree "$FORMAL_TREE" --arg runtime "$RUNTIME_TREE" '.version=="2.35.0" and .schema_version=="2026082901" and .release_type=="formal" and .deployable==true and .release_authorized==true and .release_source_commit==$source and .release_source_tree==$tree and .runtime_source_tree==$runtime and .runtime_data_included==false and .schema_change==false and (.schema_migrations|length)==0' "$FRESH/release-manifest.json" >/dev/null
          if unzip -Z1 "$CONTRACT/VF-Start-V2.35.0-FULL.zip" | grep -E '(^|/)(PRIVATE|private|data)/|\.(sqlite|sqlite3|db)$' | grep .; then echo RUNTIME_DATA_LEAK; exit 1; fi
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find "$FRESH" -type f -name '*.php' -print0)
          while IFS= read -r -d '' f; do node --check "$f" >/dev/null; done < <(find "$FRESH" -type f -name '*.js' -print0)
          echo P01_V2350_STRICT_CLEAN_FULL=PASS | tee "$EVID/clean-full.txt"

      - name: Strict fresh setup and database verification
        shell: bash
        run: |
          set -Eeuo pipefail
          COOKIE="$EVID/fresh.cookies"
          php -S 127.0.0.1:$PORT -t "$FRESH" >"$EVID/fresh-server.log" 2>&1 & echo $! >/tmp/p01-v2350-strict.pid
          ready=0
          for i in $(seq 1 60); do if curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:$PORT/setup.php" -o "$EVID/setup.html"; then ready=1; break; fi; sleep .25; done
          test "$ready" = 1
          CSRF=$(python3 - "$EVID/setup.html" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read(); print(re.search(r'name="setup_csrf"\s+value="([^"]+)"',s).group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:$PORT/setup.php" --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=V235 Strict Fresh' --data-urlencode 'admin_password=V235Strict!2026' --data-urlencode 'admin_password_confirm=V235Strict!2026' -o "$EVID/setup-post.html"
          php "$FRESH/cli/verify.php" | tee "$EVID/verify.txt" | grep -Fx VERIFY_PASS=YES >/dev/null
          php "$FRESH/cli/surface-verify.php" | tee "$EVID/surface.txt" | grep -E 'MULTI_SURFACE_PASS=YES|CURRENT_DOMAIN_PASS=YES' >/dev/null
          php "$FRESH/cli/baseline-verify.php" | tee "$EVID/baseline.txt"
          grep -Fx BASELINE_CORE_PASS=YES "$EVID/baseline.txt"
          grep -Fx DRIFT_COUNT=0 "$EVID/baseline.txt"
          grep -Fx UNKNOWN_COUNT=0 "$EVID/baseline.txt"
          ROOT="$FRESH" php -r 'require getenv("ROOT")."/app/bootstrap.php";$db=vf_db();if((string)$db->query("SELECT MAX(version) FROM schema_migrations WHERE status=\"success\"")->fetchColumn()!=="2026082901")exit(1);if(strtolower((string)$db->query("PRAGMA integrity_check")->fetchColumn())!=="ok")exit(2);if($db->query("PRAGMA foreign_key_check")->fetchAll(PDO::FETCH_ASSOC))exit(3);echo "P01_V2350_STRICT_DB=PASS\n";' | tee "$EVID/db.txt"
          echo P01_V2350_STRICT_FRESH_SETUP=PASS | tee "$EVID/fresh-setup.txt"

      - name: Five-domain strict fresh browser smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-v2350-strict-ui; cd /tmp/p01-v2350-strict-ui
          npm init -y >/dev/null 2>&1; npm install playwright@1.55.0 --no-save >/dev/null 2>&1; npx playwright install chromium --with-deps >/dev/null 2>&1
          cat > smoke.cjs <<'JS'
          const {chromium}=require('playwright'),fs=require('fs');
          (async()=>{const b=await chromium.launch({headless:true}),c=await b.newContext({viewport:{width:1440,height:1000}});let r=await c.request.post('http://127.0.0.1:18377/api.php?action=login',{data:{password:'V235Strict!2026'}});if(!r.ok()||!(await r.json()).ok)throw Error('login');const p=await c.newPage(),pages=['home.php','start.php','channels.php','watch.php','topics.php'],metrics={};for(const f of pages){for(const theme of ['light','dark']){await p.goto('http://127.0.0.1:18377/'+f,{waitUntil:'networkidle'});await p.evaluate(t=>{document.documentElement.dataset.theme=t;localStorage.setItem('vf_theme',t)},theme);await p.reload({waitUntil:'networkidle'});const m=await p.evaluate(()=>({version:document.body.innerText.includes('V2.35.0'),overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}));if(!m.version||m.overflow>1)throw Error(f+' '+theme+' '+JSON.stringify(m));metrics[f+'-'+theme]=m;}}
          await p.setViewportSize({width:390,height:844});for(const f of pages){await p.goto('http://127.0.0.1:18377/'+f,{waitUntil:'networkidle'});const o=await p.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);if(o>1)throw Error('mobile overflow '+f);}fs.writeFileSync(process.env.EVID+'/browser-metrics.json',JSON.stringify(metrics,null,2));await b.close();console.log('P01_V2350_STRICT_BROWSER=PASS')})().catch(e=>{console.error(e);process.exit(1)});
          JS
          EVID="$EVID" node smoke.cjs | tee "$EVID/browser-result.txt"
          grep -Fx P01_V2350_STRICT_BROWSER=PASS "$EVID/browser-result.txt"

      - name: Verdict
        shell: bash
        run: |
          cat > "$EVID/verdict.txt" <<EOF
          P01_V2350_STRICT_FRESH_INSTALL=PASS
          FORMAL_RUN=$FORMAL_RUN
          FORMAL_ARTIFACT_ID=$FORMAL_ARTIFACT_ID
          FORMAL_ARTIFACT_DIGEST=sha256:$FORMAL_ARTIFACT_DIGEST
          FORMAL_SOURCE=$FORMAL_SOURCE
          FORMAL_TREE=$FORMAL_TREE
          RUNTIME_TREE=$RUNTIME_TREE
          FULL_SHA256=$FULL_SHA
          UPDATE_SHA256=$UPDATE_SHA
          SCHEMA=$SCHEMA
          VERSION=$VERSION
          OWNER_PRODUCTION_WRITE=NO
          RELEASE_PUBLISHED=NO
          EOF
          cat "$EVID/verdict.txt"

      - name: Upload strict fresh evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2350-strict-fresh-${{ github.run_id }}
          path: /tmp/p01-v2350-strict-fresh-evidence
          if-no-files-found: warn
          retention-days: 30

      - name: Stop server
        if: always()
        shell: bash
        run: kill "$(cat /tmp/p01-v2350-strict.pid 2>/dev/null)" 2>/dev/null || true
