name: P08 v0.1.4 exact PR57 FULL Atomic structural acceptance (TEMP)
on:
  pull_request:
    paths: [.github/workflows/p08-v014-final-artifacts-temp.yml]
permissions:
  contents: read
jobs:
  artifact-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    env:
      P08_R130_ISOLATED: "YES"
      P08_R132_ISOLATED: "YES"
    steps:
      - name: PHP 8.4 plus locked Composer prerequisites
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3,pdo_sqlite,pdo_mysql,posix,zip,curl,mbstring,dom
          coverage: none
          tools: composer:v2
      - name: Node22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact private P08 stacked PR57
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 69fe9854a3c5559fc16982606b4ac15a3f7ad9ed
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: .p08-source
          persist-credentials: false
      - name: Exact private governance Mode N PR191
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 9574e7a849c5a56cad4b7aef18b2b1f0cb4e0fcb
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: .gov-source
          persist-credentials: false
      - name: Build genuine 0.1.4 candidate FULL and code-only Atomic
        shell: bash
        env:
          GH_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          cd .p08-source
          test "$(git rev-parse HEAD)" = '69fe9854a3c5559fc16982606b4ac15a3f7ad9ed'
          test "$(cat VERSION)" = '0.1.4'
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress > "$RUNNER_TEMP/p08-artifact-composer.log" 2>&1
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-artifact-npm.log" 2>&1
          npm run build >> "$RUNNER_TEMP/p08-artifact-npm.log" 2>&1
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --max-time 90 \
            --header "Authorization: Bearer $GH_PRIVATE_READ_TOKEN" \
            --header "Accept: application/octet-stream" \
            https://api.github.com/repos/llhzx2018/vf-adops/releases/assets/753599121 \
            --output "$RUNNER_TEMP/p08-r132-issued-013.zip"
          echo "80556ab606aec6080b05000b41073e597578544162ac918277bd0629cf020527  $RUNNER_TEMP/p08-r132-issued-013.zip" | sha256sum -c --status
          python3 -B - <<'PY'
          import hashlib,os,sys,zipfile
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from build_full import write_full
          from build_atomic import write_atomic
          t=Path(os.environ['RUNNER_TEMP'])
          with zipfile.ZipFile(t/'p08-r132-issued-013.zip') as z:
              old_sha=hashlib.sha256(z.read('FULL_MANIFEST.json')).hexdigest()
          target='69fe9854a3c5559fc16982606b4ac15a3f7ad9ed'
          print(write_full(Path('.'),t/'p08-r132-candidate-full.zip','0.1.4',target))
          print(write_atomic(Path('.'),t/'p08-r132-candidate-atomic.zip',
              source_version='0.1.3',
              source_sha='44d504185f0ac8cf4be552dc5adada989a08b40e',
              source_full_manifest_sha256=old_sha,
              target_version='0.1.4',target_sha=target))
          PY
          python3 -B tests/compatibility/r132_candidate_package_gate.py \
            --full "$RUNNER_TEMP/p08-r132-candidate-full.zip" \
            --atomic "$RUNNER_TEMP/p08-r132-candidate-atomic.zip" \
            --old "$RUNNER_TEMP/p08-r132-issued-013.zip" \
            --source "$GITHUB_WORKSPACE/.p08-source" --sha '69fe9854a3c5559fc16982606b4ac15a3f7ad9ed'
          php -l "$RUNNER_TEMP/p08-owner-forward-once.php"
          echo P08_PR57_EXACT_CANDIDATE_ARTIFACT_BYTES_AND_ONEFILE=PASS
      - name: Exact-source public authority delivery resolve plus real ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          cd .p08-source
          python3 -B - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          temp=Path(os.environ['RUNNER_TEMP'])
          domains=['INSTALL','SECURITY','TESTING','UPGRADE','DATA_SCHEMA',
                   'API_PROVIDER','CRON_JOB','OBSERVABILITY','PERFORMANCE','GIT','UA_UI']
          triggers=['full_package','clean_install','installer','auth','session',
                    'update','atomic','database','backup','external_api',
                    'background_job','release_visibility','large_data','source_change',
                    'admin_surface','release']
          for profile,filename,entry in [
            ('web_full_zip','p08-r132-candidate-full.zip','public/setup.php'),
            ('web_atomic_zip','p08-r132-candidate-atomic.zip','public/index.php')]:
              src=temp/filename
              obj={
                'schema':'vf.public-authority.task-delivery-check.v1',
                'project':'P08','source':'69fe9854a3c5559fc16982606b4ac15a3f7ad9ed',
                'project_authority':{
                   'agents':'AGENTS.md',
                   'current':'docs/authority/CURRENT.md',
                   'acceptance':'docs/authority/ACCEPTANCE_MATRIX.md',
                   'applicability':'docs/authority/PUBLIC_AUTHORITY_APPLICABILITY.md',
                },
                'acceptance_markers':['P08_RP07N_CASE=P08_ADOPS_014_PR55_56_57_ONLY'],
                'required_domains':domains,
                'task_capabilities':triggers,
                'delivery':{
                  'profile':profile,
                  'entrypoint':entry,
                  'artifact':filename,
                  'sha256':hashlib.sha256(src.read_bytes()).hexdigest(),
                  'requires_git':False,'requires_manual_source_copy':False,
                },
              }
              (temp/('p08-r132-'+profile+'-receipt.json')).write_text(json.dumps(obj))
          PY
          g="$GITHUB_WORKSPACE/.gov-source"
          router="$g/governance/public-authority/VF_PUBLIC_AUTHORITY_APPLICABILITY_ROUTER_V1.0.json"
          lint="$g/governance/public-authority/tools/task_delivery_contract_lint.py"
          for profile in web_full_zip web_atomic_zip; do
            receipt="$RUNNER_TEMP/p08-r132-$profile-receipt.json"
            python3 -B "$lint" --phase resolve --receipt "$receipt" --project-root "$PWD" \
              --artifact-root "$RUNNER_TEMP" --public-router "$router"
            python3 -B "$lint" --phase delivery --receipt "$receipt" --project-root "$PWD" \
              --artifact-root "$RUNNER_TEMP" --public-router "$router"
          done
          echo P08_PR57_EXACT_PUBLIC_AUTHORITY_FULL_ATOMIC_STRUCTURAL_GATE=PASS
      - name: Purge all private materials
        if: always()
        shell: bash
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/.p08-source" "$GITHUB_WORKSPACE/.gov-source" \
            "$RUNNER_TEMP"/p08-r132-* "$RUNNER_TEMP"/p08-artifact-* \
            "$RUNNER_TEMP/p08-owner-forward-once.php"
