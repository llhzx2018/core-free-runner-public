name: P07 PR293 MariaDB 11.8 versioned Laravel isolated target e2e
on:
  pull_request:
    paths:
      - '.github/workflows/p07-pr293-mariadb118-target-e2e.yml'
permissions:
  contents: read
jobs:
  p07-mariadb-118-target:
    if: ${{ github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: p07syntheticlocalonly
        ports:
          - 3309:3306
        options: >-
          --health-cmd "mariadb-admin ping --host=127.0.0.1 --user=root --password=p07syntheticlocalonly --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Install MariaDB CLI for isolated disposable container
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          if ! command -v mariadb >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mariadb-client
          fi
          export MYSQL_PWD=p07syntheticlocalonly
          mariadb --protocol=tcp -h 127.0.0.1 -P 3309 -uroot --batch --skip-column-names -e 'SELECT VERSION()' > "$RUNNER_TEMP/p07-mariadb-version"
          grep -q '^11\.8\.' "$RUNNER_TEMP/p07-mariadb-version"
          echo 'P07_ISOLATED_REAL_MARIADB_11_8_PASS'
      - name: Checkout exact product source without credential persistence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: f82214ff5a1f27af43b704f9b2180ca62a4aaf2f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: p07-exact
      - name: Exact-source Python and actual MariaDB 11.8 import, app connect, retry guards
        shell: bash
        env:
          P07_SYNTHETIC_MARIADB: '1'
          P07_DB_TEST_HOST: 127.0.0.1
          P07_DB_TEST_PORT: '3309'
          P07_DB_TEST_PASSWORD: p07syntheticlocalonly
        run: |
          set -Eeuo pipefail
          set +x
          cd p07-exact
          test "$(git rev-parse HEAD)" = f82214ff5a1f27af43b704f9b2180ca62a4aaf2f
          export PYTHONDONTWRITEBYTECODE=1
          python3 -B -m unittest -q \
            tests.test_app_config \
            tests.test_migration_versioned_laravel_p07 \
            tests.test_migration_no_overwrite_resume \
            tests.test_migration_laravel_mariadb_engine \
            tests.test_server_migration_pull
          echo 'P07_293_MARIADB118_EXACT_SOURCE_TARGET_IMPORT_AND_PROTECTED_RETRY_PASS'
      - name: Remove temporary private checkout even on failure
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- p07-exact
          echo 'P07_293_PRIVATE_WORKSPACE_CLEANUP_DONE'
