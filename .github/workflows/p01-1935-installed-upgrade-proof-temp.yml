name: p01-1935-installed-upgrade-proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-1935-installed-upgrade-proof-temp.yml'
permissions:
  contents: read
jobs:
  p01-1935-installed-matrix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      PRODUCT_BRANCH: fix/p01-atomic-lock-bounded-and-interrupted-install-r1
      PRODUCT_SHA: 43dcb5a0120c1a53974fe7e6a437fbbca80dfa52
      PRODUCT_TREE: 375bf7290dbddfd8e26ff4bcb9cbddf5ed0786a2
      RUNNER_BUILDER_SHA: 7d60401fc002fe4a912afa47c3aa916e4b0226ca
      WORK_ROOT: /tmp/p01-1935-installed-proof-${{ github.run_id }}
    steps:
      - name: Checkout registered Public Runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Dependencies and exact builder
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$WORK_ROOT" "$WORK_ROOT/release"
          sudo apt-get update -qq
          sudo apt-get install -qq -y php-cli php-sqlite3 php-curl php-zip php-mbstring php-gd unzip >/dev/null
          php -m | grep -Fx pdo_sqlite
          test "$(git hash-object scripts/p01-build-release-v2.py)" = "$RUNNER_BUILDER_SHA"
          python3 -m py_compile scripts/p01_1935_installed_upgrade_matrix_temp.py
          python3 scripts/test_p01_atomic_builder_bounded_lock.py
          echo P01_1935_MACHINE_BUILDER_REUSED=PASS
      - name: Exact transient product source and immutable official releases
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test -n "$READ_TOKEN"
          remote="$(git ls-remote "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "refs/heads/${PRODUCT_BRANCH}" | awk '{print $1}')"
          test "$remote" = "$PRODUCT_SHA"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "$WORK_ROOT/candidate"
          git -C "$WORK_ROOT/candidate" fetch -q --depth 1 origin "$PRODUCT_SHA"
          git -C "$WORK_ROOT/candidate" checkout -q --detach "$PRODUCT_SHA"
          git -C "$WORK_ROOT/candidate" remote set-url origin "https://github.com/${PRODUCT_REPO}.git"
          test "$(git -C "$WORK_ROOT/candidate" rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git -C "$WORK_ROOT/candidate" rev-parse HEAD^{tree})" = "$PRODUCT_TREE"
          git clone -q --depth 1 --branch v2.47.499 "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "$WORK_ROOT/stable-src"
          test "$(git -C "$WORK_ROOT/stable-src" rev-parse HEAD)" = "80f47b2133c8515816a70bd494013358ea158d4d"
          git -C "$WORK_ROOT/stable-src" remote set-url origin "https://github.com/${PRODUCT_REPO}.git"
          test "$(tr -d '\r\n ' < "$WORK_ROOT/candidate/VERSION")" = "2.47.500"
          for VERSION in 2.47.498 2.47.499; do
            gh release download "v${VERSION}" -R "$PRODUCT_REPO" -D "$WORK_ROOT/release" \
              -p "VF-Start-V${VERSION}-FULL.zip" -p "VF_Start_V${VERSION}_UPDATE.zip"
          done
          printf '%s  %s\n' \
            f4f0748aba3f48aa5b721d2b3974e90d5c79a6d5f29c4d725cd53f36b3af634e "$WORK_ROOT/release/VF-Start-V2.47.498-FULL.zip" \
            6e512018bb31dbf989e5cbbf13581c75f3d67ee342cb7102b0a5a0754709cbf3 "$WORK_ROOT/release/VF_Start_V2.47.498_UPDATE.zip" \
            eb8752f5ba448c2588fb1981e6a71ffa16b4cd8004bb55b0512c978784352904 "$WORK_ROOT/release/VF-Start-V2.47.499-FULL.zip" \
            85e0a112e2ef3baf13bbada4089165c490576d72f8fa7837005dfc26fcfaf209 "$WORK_ROOT/release/VF_Start_V2.47.499_UPDATE.zip" \
              | sha256sum -c -
          echo P01_1935_IMMUTABLE_SOURCE_RELEASE_ASSETS=PASS
          echo P01_1935_EXACT_PRODUCT_SHA_AND_TREE=PASS
      - name: Exact source Canonical zero-regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash "$WORK_ROOT/candidate/tests/canonical_release_regression.sh" \
            "$WORK_ROOT/candidate" "$WORK_ROOT/stable-src" --require-zero-debt
          echo P01_1935_EXACT_247500_CANONICAL=PASS
          cd "$WORK_ROOT/candidate"
          node --check src/assets/update-core.js
          node tests/unit/p01_update_interrupted_owner_warning_native.cjs
          node tests/unit/update_check_stale_install_native.cjs
          node tests/unit/p01_ia6_update_oneclick_modal_return_native.cjs
          echo P01_1935_OWNER_UPDATE_UI_FAIL_CLOSED=PASS
      - name: Clean FULL, real Atomic source variants and injected rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          export PRODUCT_SHA
          python3 scripts/p01_1935_installed_upgrade_matrix_temp.py \
            --workspace "$WORK_ROOT" \
            --candidate "$WORK_ROOT/candidate" \
            --source-release-dir "$WORK_ROOT/release"
      - name: Safety classification and transient cleanup
        if: always()
        shell: bash
        run: |
          echo P01_1935_FORMAL_RELEASE=NOT_EXECUTED
          echo P01_1935_CORE_UPDATES=UNCHANGED
          echo P01_1935_PRODUCTION=UNCHANGED
          echo P01_1935_PRIVATE_SOURCE_PUBLIC_ARTIFACT=NONE
          case "$WORK_ROOT" in /tmp/p01-1935-installed-proof-*) rm -rf -- "$WORK_ROOT";; *) exit 66;; esac
