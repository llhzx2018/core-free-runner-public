name: P03 V1.37.3 Quick Identity Seal

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p03-v1373-quick-seal.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  P03_REPOSITORY: llhzx2018/vf-forge
  P03_BRANCH: maintenance/v1.37.3-portfolio-intelligence-bootstrap

jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout private V1.37.3 work branch
        uses: actions/checkout@v4
        with:
          repository: ${{ env.P03_REPOSITORY }}
          ref: ${{ env.P03_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: p03

      - name: Seal V1.37.3 identity and push exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p03
          python3 scripts/finalize_v1373.py
          test "$(cat VERSION)" = '1.37.3'
          test "$(cat database/schema/SCHEMA_VERSION)" = '30'
          grep -Fq "define('VFAB_VERSION', '1.37.3');" src/app/bootstrap.php
          grep -Fq "TARGET_VERSION='1.37.3'" scripts/build_atomic.py
          grep -Fq "ALLOWED_SOURCES=['1.37.2']" scripts/build_atomic.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION CHANGELOG.md src/app/bootstrap.php scripts/build_atomic.py
          if ! git diff --cached --quiet; then
            git commit -m 'release(P03): seal V1.37.3 portfolio intelligence identity'
            git push origin HEAD:${P03_BRANCH}
          fi
          echo "P03_V1373_EXACT_SOURCE=$(git rev-parse HEAD)"
          echo 'P03_V1373_QUICK_SEAL=PASS'
          echo 'SCHEMA=30'
          echo 'MIGRATION=NONE'
          echo 'PRODUCTION_WRITE=NO'
