name: S01 embed exact candidate package verification
on:
  push:
    branches: [task/s01-embed-recheck-20261031]
    paths: ['.github/workflows/s01-embed-exact-package-20261031.yml']
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 7a57972416ab0f6185f97c61117c8de4c21e70d2
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: theme
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: 1c284ea119d67f3fea42655982589af6a7551824
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: plugin
      - name: Build and check candidate packages
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof
          test "$(cat theme/VERSION)" = 1.35.221
          test "$(cat plugin/VERSION | tr -d '\n')" = 1.25.97
          php -l theme/src/inc/modules/module-faq.php
          php -l theme/src/inc/services/frontend-page-progress-service.php
          php -l plugin/src/vf-tool-m3u8.php
          node --check plugin/src/public/js/tool-runtime-i18n.js
          node --check plugin/src/public/dist/embed.js
          php -l plugin/src/includes/skin-seasonal.php
          cp plugin/tests/seasonal-empty-retry-wordpress.php proof/
          gh release download v1.25.96 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.96.zip --dir proof
          echo 'c49b51b8d4f92acb88fe5b1f1f6a2dc9ce523a49a394425f2123d1e9bed24723  proof/vf-tools-m3u8_V1.25.96.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path,PurePosixPath
          import hashlib,zipfile,io,json,subprocess
          theme=Path('theme/src')
          bundle=(theme/'assets/css/public/vf-theme-public-runtime.css').read_bytes()
          family=(theme/'assets/css/public/pages/families/public-family-02-tool-directory-detail-operations-closure.css').read_bytes()
          assert bundle.count(family)==1
          assert hashlib.sha256(bundle).hexdigest() in (theme/'inc/public-css-owner-registry.php').read_text()
          js=(Path('plugin/src/public/js/tool-runtime-i18n.js')).read_bytes()
          assert js in Path('plugin/src/public/dist/embed.js').read_bytes()
          def info(n):
              q=zipfile.ZipInfo(n,date_time=(1980,1,1,0,0,0))
              q.compress_type=zipfile.ZIP_DEFLATED;q.external_attr=0o100644<<16
              return q
          def build_theme():
              b=io.BytesIO()
              with zipfile.ZipFile(b,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
                  for p in sorted(x for x in theme.rglob('*') if x.is_file()):
                      assert not p.is_symlink()
                      z.writestr(info('vf-tools-theme/'+p.relative_to(theme).as_posix()),p.read_bytes())
              return b.getvalue()
          def build_plugin():
              b=io.BytesIO(); observed=[]
              with zipfile.ZipFile('proof/vf-tools-m3u8_V1.25.96.zip') as old,zipfile.ZipFile(b,'w') as z:
                  for zi in old.infolist():
                      n=zi.filename
                      assert n.startswith('vf-tool-m3u8/') and '..' not in PurePosixPath(n).parts
                      if zi.is_dir(): z.writestr(zi,b'');continue
                      rel=n[len('vf-tool-m3u8/'):]
                      p=Path('plugin/src')/rel
                      assert p.is_file() and not p.is_symlink(),rel
                      data=p.read_bytes()
                      if data!=old.read(zi): observed.append(rel)
                      z.writestr(zi,data)
              expected={'vf-tool-m3u8.php','plugin-manifest.json','public/js/tool-runtime-i18n.js','public/dist/embed.js','includes/skin-seasonal.php'}
              assert set(observed)==expected,observed
              return b.getvalue()
          records=[]
          for name,fn in [('vf-tools-theme_V1.35.221.zip',build_theme),('vf-tools-m3u8_V1.25.97.zip',build_plugin)]:
              data=fn();assert data==fn()
              out=Path('proof')/name;out.write_bytes(data)
              with zipfile.ZipFile(out) as z:
                  assert z.testzip() is None
                  files=sum(not x.is_dir() for x in z.infolist())
              records.append({'name':name,'bytes':len(data),'files':files,'sha256':hashlib.sha256(data).hexdigest()})
          Path('proof/candidate-package-proof.json').write_text(json.dumps({'status':'PASS','packages':records,'production':'unchanged'},indent=2))
          print(json.dumps(records))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embed-exact-candidates-${{ github.run_id }}
          path: proof/
          retention-days: 7

  lifecycle:
    needs: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 02d4591eed025a3d3a67bc0a150b3ddc448c2ab8
          persist-credentials: false
          path: established
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7a0fe3c12137bdeab82ddcd79d2deffed96c35dd
          persist-credentials: false
          path: prior
      - uses: actions/download-artifact@v4
        with:
          name: embed-exact-candidates-${{ github.run_id }}
          path: provider
      - name: Prepare old theme and isolated lifecycle
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof
          gh release download v1.35.220 --repo llhzx2018/vf-tools-theme --pattern vf-tools-theme_V1.35.220.zip --dir provider
          echo '0e9dbe597a8dcf7e2748f23558a18b5660f535f986773f06f46bdad9a7ba7bde  provider/vf-tools-theme_V1.35.220.zip' | sha256sum -c
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          cp -a established/lanes/s01-frontend-design-20261017 lane
          python3 - <<'PY'
          from pathlib import Path
          p=Path('prior/lanes/s01-converter-i18n-proof/converter-only-lifecycle.sh')
          s=p.read_text()
          s=s.replace('control/lanes/s01-converter-i18n-proof/plugin-snapshot.php','prior/lanes/s01-converter-i18n-proof/plugin-snapshot.php')
          s=s.replace('node control/lanes/s01-converter-i18n-proof/check.cjs','echo TARGETED_BROWSER_PASS_IN_RUN_41161053762')
          s=s.replace('1.35.220','1.35.221').replace('1.25.96','1.25.97')
          s=s.replace('for old in 1.35.219 1.35.216;', 'for old in 1.35.220;')
          s=s.replace('for old in 1.25.95 1.25.94;', 'for old in 1.25.96;')
          needle="cli eval-file /tmp/plugin-snapshot.php > proof/plugin-options-before.json"
          extra="""docker cp provider/seasonal-empty-retry-wordpress.php "$WP:/tmp/seasonal-empty-retry-wordpress.php"
          cli eval-file /tmp/seasonal-empty-retry-wordpress.php > proof/seasonal-empty-retry.json
          cli eval-file /tmp/plugin-snapshot.php > proof/plugin-options-after-candidate-retry.json
          cmp proof/plugin-options-before.json proof/plugin-options-after-candidate-retry.json
          echo NEW_VERSION_EMPTY_RETRY_SNAPSHOT_PROTECTED_PASS"""
          assert needle in s
          s=s.replace(needle,needle+'\n'+extra)

          backup="""cli eval '$k=["vf_m3u8_skin_seasonal_migration_evidence","vf_m3u8_skin_seasonal_migration_snapshot"]; $v=[]; foreach($k as $n) $v[$n]=get_option($n); echo base64_encode(serialize($v));' > proof/seasonal-backup.txt
          docker cp proof/seasonal-backup.txt "$WP:/tmp/seasonal-backup.txt" """
          recover="""cli eval '$v=unserialize(base64_decode(file_get_contents("/tmp/seasonal-backup.txt")),["allowed_classes"=>false]); if(!is_array($v)||count($v)!==2) WP_CLI::error("Invalid synthetic backup"); foreach($v as $k=>$x) update_option($k,$x);'
          cli eval-file /tmp/plugin-snapshot.php > proof/plugin-options-recovered.json
          cmp proof/plugin-options-before.json proof/plugin-options-recovered.json
          echo SEASONAL_RECOVERY_AFTER_OLD_ROLLBACK_PASS"""
          assert 'for old in 1.25.96; do' in s
          s=s.replace('for old in 1.25.96; do',backup+'\nfor old in 1.25.96; do',1)
          assert 'echo LEGACY_MIGRATION_METADATA_WARNING_RECORDED' in s
          s=s.replace('echo LEGACY_MIGRATION_METADATA_WARNING_RECORDED','echo LEGACY_MIGRATION_METADATA_WARNING_RECORDED\n'+recover,1)
          Path('/tmp/embed-lifecycle.sh').write_text(s)
          PY
          bash /tmp/embed-lifecycle.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embed-lifecycle-${{ github.run_id }}
          path: proof/
          retention-days: 7

  browser:
    needs: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 02d4591eed025a3d3a67bc0a150b3ddc448c2ab8
          persist-credentials: false
          path: established
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 7a57972416ab0f6185f97c61117c8de4c21e70d2
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
      - uses: actions/download-artifact@v4
        with:
          name: embed-exact-candidates-${{ github.run_id }}
          path: provider
      - name: Run bilingual exact package browser checks
        run: |
          set -euo pipefail
          mkdir -p proof
          cp -a established/lanes/s01-frontend-design-20261017 lane
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          python3 - <<'PY'
          from pathlib import Path
          p=Path('control/lanes/s01-embed-20261029/native.sh')
          s=p.read_text().replace('vf-tools-m3u8_V1.25.96.zip','vf-tools-m3u8_V1.25.97.zip')
          s='\n'.join(x for x in s.split('\n') if not x.startswith('docker cp provider-source/'))+'\n'
          Path('/tmp/embed-browser.sh').write_text(s)
          PY
          bash /tmp/embed-browser.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embed-browser-exact-${{ github.run_id }}
          path: proof/
          retention-days: 7
