name: P01 V2.47.271 Backend IA Round 3 Proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p01-v247271-backend-ia-round3.yml"

permissions:
  contents: read

jobs:
  proof:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'proof(P01): V2.47.271 backend IA round 3')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout proof control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd nodejs >/dev/null

      - name: Clone exact candidate and baseline
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" candidate
          git -C candidate fetch -q origin 01b2be1a89e5cec3d75587dd6660fa796a7da4b2
          git -C candidate checkout -q --detach 01b2be1a89e5cec3d75587dd6660fa796a7da4b2
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.271"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "2.47.271"
          grep -F "define('VF_VERSION', '2.47.271');" candidate/src/app/bootstrap.php

          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" baseline
          git -C baseline fetch -q origin cc79b096fa3c91b59dcf7960eca6783cb0476aaa
          git -C baseline checkout -q --detach cc79b096fa3c91b59dcf7960eca6783cb0476aaa
          test "$(tr -d '\r\n ' < baseline/VERSION)" = "2.47.270"
          echo P01_V247271_EXACT_SOURCE=PASS

      - name: Syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l candidate/src/toolbox-manager.php
          php -l candidate/src/app/ToolboxConfig.php
          php -l candidate/src/health.php
          php -l candidate/src/duplicates.php
          php -l candidate/src/icons.php
          php -l candidate/src/recycle-bin.php
          php -l candidate/src/app/bootstrap.php
          node --check candidate/src/assets/health.js
          node --check candidate/src/assets/duplicates.js
          node --check candidate/src/assets/icons.js
          node --check candidate/src/assets/recycle-bin.js
          echo P01_V247271_SYNTAX=PASS

      - name: Focused Round 3 contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          tests=(
            tests/unit/backend_ia_round3_toolbox_v247271_contract.php
            tests/unit/backend_ia_round3_resource_maintenance_v247271_contract.php
            tests/unit/tools_toolbox_manager_v247210_contract.php
            tests/unit/tools_task_toolbox_v247191_contract.php
            tests/unit/health_workspace_edit_deeplink_contract.php
            tests/unit/admin_resource_health_closure_contract.php
            tests/unit/admin_url_health_page5_polish_contract.php
            tests/unit/health_row_action_hierarchy_contract.php
            tests/unit/health_filter_empty_state_clarity_contract.php
            tests/unit/health_visible_selection_contract.php
            tests/unit/health_pending_continuation_contract.php
            tests/unit/admin_duplicates_r21_contract.php
            tests/unit/duplicates_pagination_reconcile_contract.php
            tests/unit/duplicates_direct_open_contract.php
            tests/unit/duplicates_mobile_readability_contract.php
            tests/unit/admin_icon_maintenance_v247133_contract.php
            tests/unit/admin_icon_rebuild_progress_v247134_contract.php
            tests/unit/admin_icon_maintenance_polish_v247135_contract.php
            tests/unit/admin_recycle_bin_r11_contract.php
            tests/unit/admin_recycle_bin_r12_pagination_contract.php
            tests/unit/admin_recycle_bin_page6_polish_contract.php
            tests/unit/recycle_bin_action_density_contract.php
            tests/unit/recycle_bin_direct_open_contract.php
            tests/unit/recycle_mobile_card_labels_contract.php
            tests/unit/backend_ia_round2_pending_v247270_contract.php
            tests/unit/backend_ia_round2_all_resources_v247270_contract.php
            tests/unit/admin_navigation_consistency_contract.php
          )
          for t in "${tests[@]}"; do php "$t"; done
          echo P01_V247271_FOCUSED=PASS

      - name: Canonical regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate baseline --require-zero-debt | tee /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/canonical.txt
          echo P01_V247271_CANONICAL=PASS

      - name: Bounded scope
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C candidate diff --name-only cc79b096fa3c91b59dcf7960eca6783cb0476aaa..01b2be1a89e5cec3d75587dd6660fa796a7da4b2 | tee /tmp/changed.txt
          if grep -E '(^|/)(migrations|schema|auth|security|update|install|setup)' /tmp/changed.txt; then
            echo "Unexpected high-risk scope"
            exit 1
          fi
          echo BACKEND_IA_ROUND3=YES
          echo FORMAL_RELEASE_CALLED=NO
          echo DISTRIBUTION_WRITE=NO
          echo PRODUCTION_WRITE=NO
