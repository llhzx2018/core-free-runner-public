name: P07 row multiset and scoped source-readback exact candidate safety
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-row-multiset-readback-gate.yml'
      - 'experiments/p07-multiset/**'
permissions:
  contents: read
jobs:
  exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact five-file source and released overlay identity
        shell: bash
        run: |
          set -Eeuo pipefail
          root=dist/p07/0.1.0/overlay
          test "$(cat "$root/BUILD_ID")" = 0.1.0-release107
          test "$(git hash-object experiments/p07-multiset/lib/sql_multiset_evidence.py)" = a301205d2907f6d35b98ad8557e14d0f94752935
          test "$(git hash-object experiments/p07-multiset/lib/sql_diff_evidence.py)" = 4bd760229971f2bafec761d4cd1ca271aea0990f
          test "$(git hash-object experiments/p07-multiset/lib/server_migration_pull.py)" = fcba1e8f0469c16ac6f04ee3c7e803c2cd1395c7
          test "$(git hash-object experiments/p07-multiset/tests/test_sql_multiset_evidence.py)" = bb914c38e09c84b618c7153a70050176efdb5d35
          test "$(git hash-object experiments/p07-multiset/tests/test_sql_readback_stability.py)" = 4200122abaaeafe2faed2482ef21e860246f1a24
          cp -a "$root" "$RUNNER_TEMP/p07-multiset-sandbox"
          for p in lib/sql_multiset_evidence.py lib/sql_diff_evidence.py lib/server_migration_pull.py tests/test_sql_multiset_evidence.py tests/test_sql_readback_stability.py; do
            cp "experiments/p07-multiset/$p" "$RUNNER_TEMP/p07-multiset-sandbox/$p"
          done
          chmod +x "$RUNNER_TEMP/p07-multiset-sandbox/bin/"*
          echo P07_MULTISET_EXACT_SOURCE_PASS
      - name: Multiset row differences source stability and preserved migration regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/p07-multiset-sandbox"
          python3 -m py_compile lib/sql_multiset_evidence.py lib/sql_diff_evidence.py lib/server_migration_pull.py tests/test_sql_multiset_evidence.py tests/test_sql_readback_stability.py
          PYTHONPATH=lib python3 -m unittest -v \
            tests.test_sql_multiset_evidence tests.test_sql_readback_stability \
            tests.test_sql_row_evidence tests.test_multiline_dml_integrity \
            tests.test_sql_diff_evidence tests.test_sql_diff_command \
            tests.test_verify tests.test_server_migration_pull
          echo P07_MULTISET_REAL_DIFF_SIMULATION_PASS
      - name: Verify SQL guard and site write boundary untouched
        shell: bash
        run: |
          set -Eeuo pipefail
          root=dist/p07/0.1.0/overlay
          for f in lib/verify.py lib/server_migration.py lib/cloudpanel.py lib/transport.py bin/vfops BUILD_ID; do
            test "$(git hash-object "$root/$f")" = "$(git hash-object "$RUNNER_TEMP/p07-multiset-sandbox/$f")"
          done
          echo P07_MULTISET_NO_DYNAMIC_SQL_WHITELIST_PASS
