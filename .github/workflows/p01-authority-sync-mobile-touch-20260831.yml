name: P01 Authority Sync Mobile Touch
on:
  push:
    branches:
      - temp/p01-authority-sync-mobile-touch-20260831
    paths:
      - .github/workflows/p01-authority-sync-mobile-touch-20260831.yml
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE: 192a6684975138871a2f2539ff9c511f34d3fe59
      TARGET_BRANCH: authority/p01-l2-mobile-touch-targets-20260831
    steps:
      - name: Checkout authority branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: authority/p01-l2-mobile-touch-targets-20260831
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Assert exact authority base
        shell: bash
        run: test "$(git -C product rev-parse HEAD)" = "$BASE" && test -z "$(git -C product status --porcelain)"
      - name: Sync four authority files
        shell: bash
        run: |
          cd product
          echo '    ncHJvZHVjdF90cmVlJzpDVVJSRU5UX1RSRUUsJ3Njb3BlJzpbJ3NyYy9hc3NldHMvYWRtaW4tY29uc29saWRhdGlvbi5jc3MnXSwncHJvZHVjdF9ibG9iJzpCTE9CLCiAgICAnY3NzX3Njb3BlJzonbGlua3MtYWRtaW4gPD03NjhweCBvbmx5JywnY3NzX21pbl9oZWlnaHRfcHgnOjQwLAogICAgJ21hY2hpbmVfZ2F0ZSc6R0FURSw nZXZpZGVuY2VfYXJ0aWZhY3QnOkFSVCwnZXZpZGVuY2VfYXJ0aWZhY3Rfc2hhMjU2JzpESUdF ' | base64 -d >/tmp/p01-sync.py
          python3 /tmp/p01-sync.py
      - name: Authority changed-file fence
        shell: bash
        run: |
          cd product
          git diff --check
          git diff --name-only | sort >/tmp/actual.txt
          printf '%s\n' VF_PROJECT.json docs/authority/CURRENT.md docs/evidence/P01_L2_PRODUCT_WAVE_DEVELOP_MERGE_20260831.md docs/handoff/CURRENT_STATE.md | sort >/tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          test -z "$(git diff --name-only -- src)"
          python3 -m json.tool VF_PROJECT.json >/dev/null
      - name: Commit authority branch only
        shell: bash
        run: |
          cd product
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VF_PROJECT.json docs/authority/CURRENT.md docs/evidence/P01_L2_PRODUCT_WAVE_DEVELOP_MERGE_20260831.md docs/handoff/CURRENT_STATE.md
          git commit -m 'docs(P01): record mobile touch-target L2 closure'
          git push origin HEAD:$TARGET_BRANCH
