name: TEMP S01-C02 Ops 1.21.828 Recovery Runtime Gate
on:
  push:
    branches:
      - temp/s01-c02-v121828-recovery-runtime-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121828-recovery-runtime-gate.yml'
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PRODUCT_REPO: llhzx2018/vf-tools-ops
      BASE: 3a59068c8e9c6adc533e37883f48bd38224e7362
      COMMIT: bd8f751a718bce205caf11bb6bbf6b676d074821
      TREE: 13e988ca8e8c543cbbe328044f90f71674034ed3
    steps:
      - name: Checkout exact Product candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.COMMIT }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: ops
      - name: Verify identity syntax and exact scope
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$COMMIT"
          test "$(git -C ops rev-parse HEAD^{tree})" = "$TREE"
          test "$(tr -d '\r\n' < ops/VERSION)" = 1.21.828
          php -l ops/vf-ops.php
          php -l ops/includes/site-release/s01-static-recovery-runtime-closure-v121828.php
          php -l ops/.github/phase3/v121828-recovery-runtime-closure.php
          C="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$PRODUCT_REPO/compare/$BASE...$COMMIT")"
          test "$(jq -r .status <<<"$C")" = ahead
          mapfile -t FILES < <(jq -r '.files[].filename' <<<"$C" | sort)
          EXPECTED=(.github/phase3/v121828-recovery-runtime-closure.php VERSION includes/site-release/s01-static-recovery-runtime-closure-v121828.php vf-ops.php)
          printf '%s\n' "${EXPECTED[@]}" | sort >/tmp/expected
          printf '%s\n' "${FILES[@]}" >/tmp/actual
          diff -u /tmp/expected /tmp/actual
          for b in main develop; do
            B="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$PRODUCT_REPO/branches/$b")"
            test "$(jq -r .commit.sha <<<"$B")" = "$BASE"
          done
      - name: Run recovery closure contract and adjacent regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          php ops/.github/phase3/v121828-recovery-runtime-closure.php | grep -Fxq PASS_V121828_RECOVERY_RUNTIME_CLOSURE
          php ops/.github/phase3/v121827-failed-candidate-source-rebind.php | grep -Fxq PASS_V121827_FAILED_CANDIDATE_SOURCE_REBIND
          php ops/.github/phase3/v121826-candidate-route-normalization.php | grep -Fxq PASS_V121826_CANDIDATE_ROUTE_NORMALIZATION
      - name: Verify fail-closed runtime boundaries
        shell: bash
        run: |
          set -Eeuo pipefail
          F=ops/includes/site-release/s01-static-recovery-runtime-closure-v121828.php
          grep -Fq "RECOVERY_EXECUTION_RUNTIME_NOT_READY" "$F"
          grep -Fq "remove_action(\$vfOpsRecoveryHookV121828, 'vf_ops_s01_static_source_recovery_v2_worker_v121814')" "$F"
          grep -Fq "add_action(\$vfOpsRecoveryHookV121828, 'vf_ops_s01_static_source_recovery_worker_v121828')" "$F"
          ! grep -Eq 'update_post_meta|wp_update_post|wp_insert_post|wp_delete_post|DELETE FROM|DROP TABLE|ALTER TABLE' "$F"
          ! grep -Fq "sourceRecoveryJobId" "$F"
          ! grep -Fq "sourceRecoverySourcePath" "$F"
          ! grep -Fq "sourceRecoverySha256" "$F"
      - name: Verify Production still fail-closed before owner upgrade
        shell: bash
        run: |
          set -Eeuo pipefail
          J="$(curl -fsSL https://www3.m3u8.one/wp-json/vf-ops/v1/s01-static-candidate-readiness)"
          test "$(jq -r .pluginVersion <<<"$J")" = 1.21.827
          test "$(jq -r .candidatePackageReady <<<"$J")" = false
          test "$(jq -r .manualSourceUploadRequired <<<"$J")" = false
          test "$(jq -r .sourceArtifactAvailable <<<"$J")" = true
          test "$(jq -r .sourceRecoveryCode <<<"$J")" = source_reinspection_failed
          test "$(jq -r .finalOnlinePass <<<"$J")" = NO
      - name: Verify runner main untouched
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          J="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/core-free-runner-public/git/ref/heads/main)"
          test "$(jq -r .object.sha <<<"$J")" = 0160b557ad4ae0e8c6acd97e7551285bc05870bd
      - name: Seal result
        run: echo PASS_V121828_RECOVERY_RUNTIME_GATE
