name: P01 Distribution Manifest Gate

on:
  push:
    branches:
      - test-core-updates-p01-dist-v247131
    paths:
      - '.github/workflows/temp-p01-distribution-manifest-gate.yml'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: c5947d56996ba477d7b04a50626557a5a4a4d09e
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: updates

      - name: Run native Update Core validation
        shell: bash
        run: |
          set -euo pipefail
          cd updates
          python3 scripts/check_manifest_contract.py
          php -v
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          echo P01_DISTRIBUTION_EXACT_SOURCE_GATE=PASS
