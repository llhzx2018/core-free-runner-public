name: S01 isolated 404 recovery checks
on:
  push:
    branches: [task/s01-404-20261027]
    paths: ['.github/workflows/s01-404-20261027.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.206
  TARGET_SHA: 70d22bb55d20b8fb36e3f33c8f94ec538e6b3e6b
  TARGET_TREE: 60a48c1caf32b9197fa3604f393e6e61ee6109fa
  BASE_SHA: d5e5a77f0626eb93d4b6ad7a4ce5565deaabee53
  LANE_ID: s01-404-20261027
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - name: Exact target preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-404-20261027/spec.json --input control/.github/workflows/s01-404-20261027.yml
      - uses: actions/checkout@v4
        with:
          ref: 02d4591eed025a3d3a67bc0a150b3ddc448c2ab8
          persist-credentials: false
          path: established
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 70d22bb55d20b8fb36e3f33c8f94ec538e6b3e6b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Scoped source identity and PHP syntax
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          mkdir -p baseline provider proof
          git -C target archive "$BASE_SHA" src | tar -x -C baseline
          python3 - <<'PY'
          import os,subprocess,pathlib,hashlib,re,json
          paths=subprocess.check_output(['git','-C','target','diff','--name-only',os.environ['BASE_SHA'],'HEAD']).decode().splitlines()
          assert set(paths)==set(['src/assets/css/public/pages/families/public-family-05-system-search-recovery-closure.css','src/assets/css/public/vf-theme-public-runtime.css','src/inc/public-css-owner-registry.php','src/inc/services/frontend-page-progress-service.php','src/inc/theme-system-recovery.php','src/inc/modules/module-hero.php'])
          for p in paths:
              if p.endswith('.php'):subprocess.run(['php','-l','target/'+p],check=True)
          for p in ['VERSION','src/style.css','src/inc/runtime-constants.php','src/inc/modules/module-post-list.php','src/inc/theme-navigation.php','src/inc/theme-public-route-404-guard.php']:
              assert pathlib.Path('target',p).read_bytes()==subprocess.check_output(['git','-C','target','show',os.environ['BASE_SHA']+':'+p]),p
          old=pathlib.Path('baseline/src/assets/css/public/pages/families/public-family-05-system-search-recovery-closure.css').read_bytes()
          new=pathlib.Path('target/src/assets/css/public/pages/families/public-family-05-system-search-recovery-closure.css').read_bytes()
          before=pathlib.Path('baseline/src/assets/css/public/vf-theme-public-runtime.css').read_bytes();after=pathlib.Path('target/src/assets/css/public/vf-theme-public-runtime.css').read_bytes()
          assert before.count(old)==1 and before.replace(old,new)==after
          assert hashlib.sha256(after).hexdigest() in pathlib.Path('target/src/inc/public-css-owner-registry.php').read_text()
          pathlib.Path('proof/source-identity.json').write_text(json.dumps({'sha':os.environ['TARGET_SHA'],'tree':os.environ['TARGET_TREE'],'base':os.environ['BASE_SHA'],'paths':paths,'version':'UNCHANGED_206_WORKING_SOURCE_NOT_RELEASE','runtimeFiles':sum(p.is_file() for p in pathlib.Path('target/src').rglob('*'))},indent=2))
          PY
          node --check control/lanes/s01-404-20261027/check.cjs
      - name: Synthetic provider and Chromium setup
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          gh release download v1.25.94 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.94.zip --dir provider
          echo '70b90d40da5d69fc7819bd7ada3f15fb0145e64822b788bd94956c7827b2df03  provider/vf-tools-m3u8_V1.25.94.zip' | sha256sum -c
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -g -fsSL --retry 2 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC[wght].ttf' -o "$HOME/.local/share/fonts/NotoSansSC.ttf"
          fc-cache -f
      - name: Disposable WordPress bilingual 404 and unchanged Search evidence
        run: |
          set -euo pipefail
          cp -a established/lanes/s01-frontend-design-20261017 lane
          bash control/lanes/s01-404-20261027/native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-404-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private checkout
        if: always()
        run: rm -rf target baseline provider
