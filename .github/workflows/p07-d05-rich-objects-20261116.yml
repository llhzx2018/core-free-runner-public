name: P07 D05 rich-schema native proof TEMP
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-d05-rich-objects-20261116.yml'
permissions:
  contents: read
jobs:
  rich-synthetic-objects:
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    steps:
      - name: Checkout public runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Transient exact P07 private source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 63547fcf03cb3c370ccde44bfd71633764bd3118
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: .p07-private-rich
      - name: Rich object unit and module UX guard
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-private-rich rev-parse HEAD)" = 63547fcf03cb3c370ccde44bfd71633764bd3118
          cd .p07-private-rich
          export PYTHONPATH="$PWD/lib"
          python3 -B -m unittest discover -s tests -p test_p07_m03_d05_business_objects_sandbox.py -v
          python3 -B scripts/check_p07_modules.py --module P07-M03-D05 \
            --pr-title 'P07-M03-D05 数据库引擎转换：完整业务对象隔离验证' \
            --changed-file lib/db_engine_conversion_business_objects_sandbox.py \
            --changed-file bin/vfops-db-convert-business-sandbox.py \
            --affected P07-M03-D05 --shared-reason '独立合成对象测试，无跨模块变更'
          python3 -B scripts/check_p07_terminal_ux.py \
            --module P07-M03-D05 \
            --changed-file bin/vfops-db-convert-business-sandbox.py \
            --evidence-file docs/ux-reviews/p07-m03-d05-rich-objects-v1.json
          echo P07_D05_RICH_SOURCE_TESTS=PASS
      - name: Four real engine routes and isolated rich object archive recovery
        shell: bash
        env:
          P07_ALLOW_SYNTHETIC_D05: '1'
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          cd .p07-private-rich
          mkdir -p .rich-results
          run_ok() {
            local src="$1" dst="$2" label="$3"
            local rc=0
            timeout --signal=TERM --kill-after=10s 260s \
              python3 -B bin/vfops-db-convert-business-sandbox.py \
              --synthetic-only --source "$src" --target "$dst" \
              >.rich-results/result.json || rc=$?
            if [ "$rc" -ne 0 ]; then
              python3 - <<'PY'
          import json
          from pathlib import Path
          try:
              record=json.loads(Path(".rich-results/result.json").read_text())
              code=str(record.get("status","UNCLASSIFIED"))[:120]
              import re
              assert re.fullmatch(r"[A-Z0-9_]+",code)
              print("P07_D05_RICH_FAIL_CLOSED_CLASS="+code)
          except (OSError,ValueError,AssertionError):
              print("P07_D05_RICH_FAIL_CLOSED_CLASS=OUTPUT_UNVERIFIED")
          PY
              return "$rc"
            fi
            python3 - "$src" "$dst" <<'PY'
          import json,sys
          from pathlib import Path
          r=json.loads(Path(".rich-results/result.json").read_text())
          assert r["status"]=="SYNTHETIC_RICH_OBJECTS_VERIFIED",r["status"]
          assert r["cleanup"]=="PASS"
          assert r["restored_source"] is True and r["private_archive_verified"] is True
          assert r["target_object_parity_verified"] is True
          assert r["source_readback"]=="VERIFIED_UNCHANGED"
          assert len(r["object_types"]) == 8
          assert r["account_grants_migrated"] is False
          assert r["all_business_objects_proven"] is False
          assert r["cloudpanel_active_switch"] is False
          assert r["production_touched"] is False
          assert r["source_engine"] == sys.argv[1] and r["target_engine"] == sys.argv[2]
          PY
            echo "P07_D05_RICH_OBJECTS_${label}=PASS"
          }
          run_fault() {
            local src="$1" dst="$2" fault="$3" label="$4" rc=0
            timeout --signal=TERM --kill-after=10s 260s \
              python3 -B bin/vfops-db-convert-business-sandbox.py \
              --synthetic-only --source "$src" --target "$dst" --fault "$fault" \
              >.rich-results/result.json || rc=$?
            test "$rc" -eq 2
            python3 - "$fault" <<'PY'
          import json,sys
          from pathlib import Path
          r=json.loads(Path(".rich-results/result.json").read_text())
          assert r["status"]=="FAIL_CLOSED_D05_OBJECT_FAULT_AFTER_"+sys.argv[1].split("-")[1].upper(),r["status"]
          assert r["source_readback"]=="VERIFIED_UNCHANGED"
          assert r["target_object_parity_verified"] is False
          assert r["cleanup"]=="PASS"
          assert r["production_touched"] is False
          PY
            echo "P07_D05_RICH_FAULT_${label}=PASS"
          }
          run_ok MYSQL_8.4 MARIADB_11.8 COMMUNITY_TO_MARIA
          run_ok MARIADB_11.8 MYSQL_8.4 MARIA_TO_COMMUNITY
          run_ok MYSQL_8.4_PERCONA MARIADB_11.8 PERCONA_TO_MARIA
          run_ok MARIADB_11.8 MYSQL_8.4_PERCONA MARIA_TO_PERCONA
          run_fault MYSQL_8.4 MARIADB_11.8 after-archive AFTER_ARCHIVE
          run_fault MARIADB_11.8 MYSQL_8.4_PERCONA after-import AFTER_IMPORT
          echo P07_D05_RICH_OBJECTS_NATIVE_PHASE=PASS
      - name: Always clean temporary resources and private checkout
        if: always()
        shell: bash
        run: |
          set +e
          docker ps -aq --filter 'label=org.kewaro.p07.d05.synthetic' | xargs -r docker rm -f >/dev/null 2>&1
          rm -rf -- .p07-private-rich
          test ! -e .p07-private-rich
          echo P07_D05_RICH_CLEANUP=PASS
