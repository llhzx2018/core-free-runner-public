name: S01 exact Theme channel contract
on:
  push:
    branches: [task/s01-blog186-20261024]
    paths: ['.github/workflows/s01-blog186-20261024-channel.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.186
  TARGET_SHA: 8d0ef7363038d0f08a86e4fe510fd2133f4a451b
  UPDATE_SHA: 7d66771dd4de52c9513df2c456e1fd54594d2e31
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: 7d66771dd4de52c9513df2c456e1fd54594d2e31
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Exact changed manifest and native protocol tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PYCHANNEL'
          import json,os
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']==os.environ['TARGET_VERSION']
          assert m['asset_sha256']=='30cea61d2213ff58ab45dbab17bf96b12539fb52cbc1d13a23a3767b24281841' and m['asset_bytes']==1991140
          assert m['runtime_files']==476 and '1.35.185' in m['from_versions']
          assert m['release_tag']=='v'+os.environ['TARGET_VERSION']
          print('EXACT_CHANNEL_CONTRACT_PASS')
          PYCHANNEL
      - name: Cleanup
        if: always()
        run: rm -rf source
