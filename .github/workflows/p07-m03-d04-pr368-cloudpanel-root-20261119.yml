# One-shot P07 M03 D04 source-only CloudPanel root and Laravel current proof.
name: P07 M03 D04 PR368 CloudPanel root proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-m03-d04-pr368-cloudpanel-root-20261119.yml'
permissions:
  contents: read
jobs:
  source-only:
    if: github.repository == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      NO_COLOR: '1'
      PRODUCT_SHA: '9b3cc24cd53b2d07ff8125d07039d5959fb20bf5'
      PRODUCT_BASE: '089c62e39e6c4998a92304cce30c73bfb1f2726d'
    steps:
      - name: Checkout disposable public runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact private PR source temporarily
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 9b3cc24cd53b2d07ff8125d07039d5959fb20bf5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: .product
      - name: Checkout current GOV architecture authority transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: .gov
      - name: Verify exact source and existing architecture/module gates safely
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C .product rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git -C .product merge-base "$PRODUCT_BASE" "$PRODUCT_SHA")" = "$PRODUCT_BASE"
          python3 -B .product/.github/checks/architecture_gate.py \
            --manifest .product/.github/checks/code_architecture.json \
            --gov-root .gov --git-root .product \
            --base-sha "$PRODUCT_BASE" --head-sha "$PRODUCT_SHA" \
            > "$RUNNER_TEMP/p07-architecture.log" 2>&1 || { echo P07_ARCHITECTURE_CHECK=FAIL; exit 1; }
          (cd .product && python3 -B scripts/check_p07_modules.py) \
            > "$RUNNER_TEMP/p07-modules.log" 2>&1 || { echo P07_MODULE_CHECK=FAIL; exit 1; }
          echo P07_M03_D04_ARCHITECTURE_AND_MODULES=PASS
      - name: Real focused tests with redacted failure output
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B - <<'PY'
          import os,re,subprocess,sys
          from pathlib import Path
          root=Path(".product").resolve()
          env=dict(os.environ)
          env["PYTHONPATH"]=str(root/"lib")
          proc=subprocess.run(
              [sys.executable, "-B", "tests/test_p07_m03_php_template_selection.py", "-q"],
              cwd=root, env=env, capture_output=True, text=True, timeout=90,
          )
          output=(proc.stdout or "") + "\n" + (proc.stderr or "")
          total=re.findall(r"Ran (\d+) tests", output)
          fails=re.findall(r"^(?:FAIL|ERROR): (test_[A-Za-z0-9_]+)",output,re.M)
          print("FOCUSED_TEST_COUNT="+(total[-1] if total else "UNKNOWN"))
          print("FOCUSED_FAILURES="+str(len(fails)))
          print("FOCUSED_TESTS="+("PASS" if proc.returncode == 0 else "FAIL"))
          if fails:
              print("FOCUSED_FAIL_NAMES="+",".join(sorted(set(fails))[:12]))
          sys.exit(0 if proc.returncode == 0 and total and int(total[-1]) >= 21 else 12)
          PY
      - name: Always remove sensitive checkout and test receipts
        if: always()
        shell: bash
        run: |
          rm -rf -- .product .gov
          rm -f -- "$RUNNER_TEMP/p07-architecture.log" "$RUNNER_TEMP/p07-modules.log"
          echo TRANSIENT_WORKSPACE_CLEANUP=PASS
