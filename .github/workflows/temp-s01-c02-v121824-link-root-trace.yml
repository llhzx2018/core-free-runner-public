name: TEMP S01-C02 1.21.824 Link Root Trace
on:
  push:
    branches:
      - temp/s01-c02-v121824-link-root-trace-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121824-link-root-trace.yml'
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact Ops source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 029d9059b22a5dfd1354db27cdc88c7a516777c9
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: ops
      - name: Trace internal link failure generators
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== MATCHES ==='
          grep -RInE '内部链接缺失|HTML 内部 URL|add_link_issue|entry_exists\(' ops/includes ops/vf-ops.php | head -n 240 || true
          echo '=== FUNCTIONS ==='
          grep -RInE 'function vf_toolsite_cf_release_final_audit_add_link_issue|function vf_toolsite_cf_release_final_audit_entry_exists|function vf_toolsite_cf_release_final_audit_urls_from_text|function vf_toolsite_cf_release_final_audit_normalize_internal_path' ops/includes | head -n 120 || true
          echo 'TRACE_DONE'
