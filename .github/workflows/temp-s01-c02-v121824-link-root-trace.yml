name: TEMP S01-C02 Candidate Builder Trace
on:
  push:
    branches:
      - temp/s01-c02-v121824-link-root-trace-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121824-link-root-trace.yml'
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact Ops source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 28e979580704fb9f6936a0f02d478cf8871ad15d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: ops
      - name: Trace Candidate ZIP builder and HTML repair context
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== CANDIDATE BUILDER CLASSES ==='
          grep -RInE 'class .*Candidate|Candidate_.*Builder|candidate.*Zip|ZipArchive' ops/includes/release ops/includes/cf-static-downloads | head -n 320 || true
          echo '=== TRANSFORM CALLERS ==='
          grep -RInE 'Candidate_Entry_Processor::transform|->transform\(|repair_html_for_static_package' ops/includes | head -n 260 || true
          echo '=== REPAIR FUNCTION DEFINITIONS ==='
          grep -RInE 'function[[:space:]]+vf_toolsite_cf_release_repair_html_for_static_package|function[[:space:]]+.*repair.*html.*static' ops/includes | head -n 160 || true
          echo '=== SOURCE ENTRY ENUMERATION ==='
          grep -RInE 'numFiles|getNameIndex|statIndex|addFromString|candidate_path|source_path' ops/includes/release ops/includes/cf-static-downloads | head -n 360 || true
          echo 'TRACE_DONE'
