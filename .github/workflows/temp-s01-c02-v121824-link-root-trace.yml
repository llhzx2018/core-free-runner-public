name: TEMP S01-C02 Candidate HTML Repair Trace
on:
  push:
    branches:
      - temp/s01-c02-v121824-link-root-trace-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121824-link-root-trace.yml'
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact Ops source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 28e979580704fb9f6936a0f02d478cf8871ad15d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: ops
      - name: Trace existing HTML link rewrite helpers and loader
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== PREPARE_HTML ==='
          grep -RInE 'prepare_html_for_cf|class VF_ToolSite_Static_Release_Repair_Core' ops/includes | head -n 220 || true
          echo '=== LINK REWRITE HELPERS ==='
          grep -RInE 'rewrite.*(?:href|link|url)|replace.*(?:href|link|url)|internal.*(?:href|link).*repair|canonical.*rewrite' ops/includes/cf-static-downloads ops/includes/release | head -n 320 || true
          echo '=== BUILDER LOADERS ==='
          grep -RInE 'class-candidate-zip-builder|class-candidate-batch-builder|class-candidate-entry-processor|class-candidate-path-filter' ops/includes ops/vf-ops.php | head -n 220 || true
          echo 'TRACE_DONE'
