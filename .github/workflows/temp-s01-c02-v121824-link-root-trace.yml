name: TEMP S01-C02 1.21.824 Link Root Trace
on:
  push:
    branches:
      - temp/s01-c02-v121824-link-root-trace-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121824-link-root-trace.yml'
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact Ops source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 029d9059b22a5dfd1354db27cdc88c7a516777c9
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: ops
      - name: Trace findings limit
        shell: bash
        run: |
          set -Eeuo pipefail
          f=ops/includes/release/async-job-parts/03-job-state-trait.php
          echo '=== FINDINGS_FROM_JOB ==='
          n=$(grep -n 'function findings_from_job' "$f" | head -1 | cut -d: -f1 || true)
          echo "LINE=$n"
          if [ -n "$n" ]; then start=$((n-30)); [ "$start" -lt 1 ] && start=1; end=$((n+90)); sed -n "${start},${end}p" "$f"; fi
          echo 'TRACE_DONE'
