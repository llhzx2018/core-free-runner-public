name: TEMP S01-C02 1.21.824 Link Root Trace
on:
  push:
    branches:
      - temp/s01-c02-v121824-link-root-trace-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121824-link-root-trace.yml'
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact Ops source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 029d9059b22a5dfd1354db27cdc88c7a516777c9
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: ops
      - name: Trace source-fix plan and safe actions
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== SOURCE FIX PLAN FILES ==='
          find ops/includes -type f \( -iname '*source*fix*plan*' -o -path '*release-source-fix-plan*' \) -print | sort
          echo '=== APPLY SAFE MATCHES ==='
          grep -RInE 'apply_safe_fixes|Source_Fix_Plan|source_fix_plan|from_findings\(' ops/includes | head -n 320 || true
          echo '=== ACTION HANDLERS ==='
          grep -RInE 'admin_post_.*apply_safe|function .*apply_safe|safe_fixes' ops/includes | head -n 240 || true
          echo 'TRACE_DONE'
