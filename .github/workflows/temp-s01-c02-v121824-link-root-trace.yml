name: TEMP S01-C02 1.21.824 Link Root Trace
on:
  push:
    branches:
      - temp/s01-c02-v121824-link-root-trace-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121824-link-root-trace.yml'
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact Ops source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 029d9059b22a5dfd1354db27cdc88c7a516777c9
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: ops
      - name: Trace findings implementation and limits
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== FINDINGS_FROM_JOB LOCATIONS ==='
          grep -RInE 'function[[:space:]]+findings_from_job|findings_from_job\(' ops/includes/release | head -n 120 || true
          echo '=== AUDIT LIMIT CALLS ==='
          grep -RInE 'VF_Ops_Release_Findings::from_audit|from_record_terminal_evidence|merge_sets\(' ops/includes/release | head -n 180 || true
          echo 'TRACE_DONE'
