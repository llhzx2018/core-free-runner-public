name: S01 Update Menu Owner Discovery

on:
  push:
    branches: [temp/s01-update-menu-owner-discovery-20260906]
    paths:
      - '.github/workflows/temp-s01-update-menu-owner-discovery-20260906.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Checkout latest product mains
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-tools-ops
          ref: main
          token: ${{ env.READ_TOKEN }}
          path: ops
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: main
          token: ${{ env.READ_TOKEN }}
          path: m3u8
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-tools-theme
          ref: main
          token: ${{ env.READ_TOKEN }}
          path: theme
          fetch-depth: 1
          persist-credentials: false

      - name: Record exact main identities
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/menu-discovery
          for d in ops m3u8 theme; do
            printf '%s\t%s\n' "$d" "$(git -C "$d" rev-parse HEAD)" | tee -a /tmp/menu-discovery/main-shas.tsv
          done

      - name: Locate updater menu registrations and page owners
        shell: bash
        run: |
          set -Eeuo pipefail
          : > /tmp/menu-discovery/hits.txt
          pattern='VF Tools Ops 更新|VF Tools M3U8 更新|VF 在线更新|add_management_page|add_submenu_page|add_menu_page|admin_menu|tools\.php\?page=|update-core|online.?update|updater'
          for d in ops m3u8 theme; do
            echo "===== $d =====" | tee -a /tmp/menu-discovery/hits.txt
            find "$d" -type f -name '*.php' \
              ! -path '*/.git/*' ! -path '*/vendor/*' ! -path '*/node_modules/*' -print0 \
              | xargs -0 grep -nEH "$pattern" \
              | tee -a /tmp/menu-discovery/hits.txt || true
          done
          echo MENU_OWNER_DISCOVERY=PASS

      - name: Show compact update-focused hits
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Ei '更新|add_management_page|add_submenu_page|add_menu_page|admin_menu|update-core|online.?update|updater' /tmp/menu-discovery/hits.txt \
            | head -n 400 | tee /tmp/menu-discovery/compact.txt || true
          test -s /tmp/menu-discovery/compact.txt
          echo COMPACT_OWNER_HITS=PASS

      - name: Upload discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: S01-UPDATE-MENU-OWNER-DISCOVERY-20260906
          path: /tmp/menu-discovery/
          if-no-files-found: error
          retention-days: 14
