name: GOV P01 exact Mode S source and negative contract
on:
  pull_request:
    paths:
      - '.github/workflows/gov-p01-mode-s-v318-oneoff.yml'
permissions:
  contents: read
jobs:
  governance-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout public Runner baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact private GOV-DOC source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 5d73e2df2bb0e3a90b74229bae5eddb38e2ed285
          path: .private-gov
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Machine verify exact source, scope, positive and negative governance invariants
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          cd .private-gov
          test "$(git rev-parse HEAD)" = "5d73e2df2bb0e3a90b74229bae5eddb38e2ed285"
          git cat-file -e "01eff0ed2a6d5b350d370a20bc833ac0ba2e4c34^{commit}"
          python3 -B - <<'PY'
          from pathlib import Path
          import subprocess
          base='01eff0ed2a6d5b350d370a20bc833ac0ba2e4c34'
          head='5d73e2df2bb0e3a90b74229bae5eddb38e2ed285'
          files=sorted(subprocess.check_output(['git','diff','--name-only',base,head],text=True).splitlines())
          expected=sorted([
            'CURRENT.md',
            'skills/README.md',
            'skills/skill-release/V3.18/SKILL.md',
            'governance/release/cases/P01_247516_247517_SEQUENTIAL_MAJOR_POST_RELEASE_OWNER_MANUAL_20261119.md'])
          assert files == expected, 'OUT_OF_SCOPE_GOVERNANCE_FILES'
          c=Path('CURRENT.md').read_text()
          index=Path('skills/README.md').read_text()
          skill=Path('skills/skill-release/V3.18/SKILL.md').read_text()
          case=Path('governance/release/cases/P01_247516_247517_SEQUENTIAL_MAJOR_POST_RELEASE_OWNER_MANUAL_20261119.md').read_text()
          old=Path('skills/skill-release/V3.17/SKILL.md').read_text()
          assert '| skill-release | V3.18 |' in c
          assert '| skill-release | V3.18 | V2.6 |' in index
          assert '  version: "3.18"' in skill and '  previous_version: "3.17"' in skill
          assert skill.count('### Mode S · ONE_CASE_P01_247516_247517_SEQUENTIAL_MAJOR_POST_RELEASE_OWNER_MANUAL')==1
          assert '### Mode R ·' in skill and '### Mode F ·' in skill
          assert old in skill or ('### Mode R ·' in skill and '### Mode Q' not in skill), 'V317_BASELINE_WEAKENED'
          for token in ('PHASE_1_SOURCE_PR=1977','PHASE_2_SOURCE_PR=1973',
            'PHASE_2_OFFICIAL_PREVIOUS=v2.47.516_ONLY_AFTER_ACTUALLY_ISSUED',
            'MACHINE_REQUIREMENTS=UNCHANGED','PRODUCTION_AUTO_APPLY=NO',
            'OWNER_PREVIEW_RUNTIME_APPLICABILITY=REQUIRED',
            'OWNER_PRODUCT_ACCEPTANCE=PENDING_NOT_PASS'):
              assert token in case, 'CASE_GUARD_MISSING'
          assert 'v516→v517' in skill and 'v515→v516' in skill
          assert 'PREVIEW_FIRST' in skill and 'UNKNOWN' in skill
          assert case.count('PROPOSED') >= 1 and 'GOV-DOC main' in case
          print('P01_MODE_S_EXACT_GOV_SOURCE_SCOPE=PASS')
          print('P01_MODE_S_TWO_VERSIONS_ISSUED_PREDECESSOR_REQUIRED=PASS')
          print('P01_MODE_S_PREVIEW_ONLY_DEFERRED_SECURITY_HARD_GATES=PASS')
          print('P01_MODE_S_NO_PRODUCTION_OR_AUTO_MIGRATION=PASS')
          PY
          python3 -B governance/public-authority/tools/current_dependency_lint.py --git-base 01eff0ed2a6d5b350d370a20bc833ac0ba2e4c34 --git-head 5d73e2df2bb0e3a90b74229bae5eddb38e2ed285
          python3 -B governance/public-authority/tools/global_closure_lint.py --git-base 01eff0ed2a6d5b350d370a20bc833ac0ba2e4c34 --git-head 5d73e2df2bb0e3a90b74229bae5eddb38e2ed285
          python3 -B governance/catalog/tools/doc_structure_lint.py
          echo 'P01_GOV_CURRENT_DEPENDENCY_AND_CATALOG=PASS'
      - name: Delete private checkout even on failure
        if: always()
        run: |
          rm -rf -- .private-gov
          echo 'P01_GOV_TEMPORARY_PRIVATE_SOURCE_CLEANED=YES'
