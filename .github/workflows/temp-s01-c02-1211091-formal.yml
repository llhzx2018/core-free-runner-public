name: S01-C02 V1.21.1091 Formal Release

on:
  push:
    branches:
      - release/s01-c02-1211091-audit-evidence-ux-20261010
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  TARGET_REPOSITORY: llhzx2018/vf-tools-ops
  TARGET_COMMIT: ee032afbef22aa3996ca2866a7c9d2245f99cd7a
  TARGET_TREE: 2467dfe279c94980c664e0da050303b24f576b45
  TESTED_SOURCE_SHA: 0a477ddda26f2af178bd4d4f2570e4933f96505a
  TAG: v1.21.1091
  RELEASE_NAME: VF Tools Ops V1.21.1091
  ASSET_NAME: vf-tools-ops_V1.21.1091.zip
  TESTED_ARTIFACT_ID: '11657889685'
  EXPECTED_BYTES: '3553790'
  EXPECTED_SHA256: baa35cea59538544cd5e53445a172dfed3630af5149538ba83ce855f59564634
  EXPECTED_RUNTIME_FILES: '989'
  EXPECTED_RUNTIME_FP: 63bae8a90c2230ff65b3a57496f10e119eac17df2e342df49216d931d631ee9b

jobs:
  release:
    name: Exact Tested Artifact Release + Remote Readback
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      db:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: fixture-root
          MARIADB_DATABASE: ops_1091_formal
          MARIADB_USER: vf
          MARIADB_PASSWORD: fixture-pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - name: Credential presence gate
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"
          echo 'READ_TOKEN_PRESENT=PASS'
          echo 'WRITE_TOKEN_PRESENT=PASS'

      - name: Fetch exact tested artifact from prior verified run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/tested
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/artifacts/${TESTED_ARTIFACT_ID}/zip" -o /tmp/tested-artifact.zip
          unzip -q /tmp/tested-artifact.zip -d /tmp/tested
          ZIP="$(find /tmp/tested -type f -name "$ASSET_NAME" -print -quit)"
          test -n "$ZIP"
          cp "$ZIP" "/tmp/$ASSET_NAME"
          test "$(stat -c %s "/tmp/$ASSET_NAME")" = "$EXPECTED_BYTES"
          test "$(sha256sum "/tmp/$ASSET_NAME" | awk '{print $1}')" = "$EXPECTED_SHA256"
          unzip -tq "/tmp/$ASSET_NAME" >/dev/null
          python3 - <<'PY'
          import hashlib, os, zipfile
          p='/tmp/'+os.environ['ASSET_NAME']; files={}
          with zipfile.ZipFile(p) as z:
              for n in z.namelist():
                  if n.endswith('/'): continue
                  if not n.startswith('vf-ops/'): raise SystemExit('unexpected root: '+n)
                  rel=n[len('vf-ops/'):]
                  if rel: files[rel]=z.read(n)
          if len(files)!=int(os.environ['EXPECTED_RUNTIME_FILES']): raise SystemExit('runtime count mismatch')
          if 'vf-ops.php' not in files: raise SystemExit('plugin main missing')
          h=hashlib.sha256()
          for rel,b in sorted(files.items()):
              h.update(rel.encode()); h.update(b'\0'); h.update(hashlib.sha256(b).hexdigest().encode()); h.update(b'\n')
          if h.hexdigest()!=os.environ['EXPECTED_RUNTIME_FP']: raise SystemExit('runtime fingerprint mismatch')
          print('TESTED_ARTIFACT_EXACT=PASS')
          PY

      - name: Verify exact actual-Frame candidate PASS
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/runs/38022674872" -o /tmp/ops-1091-candidate.json
          test "$(jq -r '.conclusion' /tmp/ops-1091-candidate.json)" = success
          echo PUBLISH_ACTUAL_FRAME_GATE_PASS

      - name: Verify exact product target and release absence
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          COMMIT_JSON="$(curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${TARGET_REPOSITORY}/git/commits/${TARGET_COMMIT}")"
          test "$(jq -r '.sha' <<<"$COMMIT_JSON")" = "$TARGET_COMMIT"
          test "$(jq -r '.tree.sha' <<<"$COMMIT_JSON")" = "$TARGET_TREE"
          test "$(curl -sS -o /tmp/tag-check.json -w '%{http_code}' -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${TARGET_REPOSITORY}/git/ref/tags/${TAG}")" = '404'
          test "$(curl -sS -o /tmp/release-check.json -w '%{http_code}' -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${TARGET_REPOSITORY}/releases/tags/${TAG}")" = '404'
          echo 'EXACT_PRODUCT_TARGET=PASS'
          CANDIDATE_COMMIT_JSON="$(curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${TARGET_REPOSITORY}/git/commits/${TESTED_SOURCE_SHA}")"
          test "$(jq -r '.tree.sha' <<<"$CANDIDATE_COMMIT_JSON")" = "$TARGET_TREE"
          echo 'EXACT_TESTED_SOURCE_TREE=PASS'

      - name: Isolated WordPress upgrade and rollback 1090 to 1091
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/wp1091-formal"; mkdir -p "$ROOT"; WP="$ROOT/site"; mkdir -p "$WP"
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o "$ROOT/wp"
          wpqa(){ php "$ROOT/wp" --path="$WP" "$@"; }
          wpqa core download --version=7.0.2 --force
          wpqa config create --dbname=ops_1091_formal --dbuser=vf --dbpass=fixture-pass --dbhost=127.0.0.1 --skip-check
          wpqa core install --url=https://fixture.invalid --title=Isolated-Evidence-Upgrade --admin_user=admin --admin_password=fixture-admin --admin_email=qa@example.invalid --skip-email
          curl -fsSL -L -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/octet-stream' "https://api.github.com/repos/${TARGET_REPOSITORY}/releases/assets/626922466" -o "$ROOT/vf-ops-1090.zip"
          test "$(sha256sum "$ROOT/vf-ops-1090.zip" | awk '{print $1}')" = "f8907723a024c786241276c1669430de8fe846765bb82546cc778a2e464d310c"
          wpqa plugin install "$ROOT/vf-ops-1090.zip" --activate
          test "$(wpqa plugin get vf-ops --field=version)" = "1.21.1090"
          wpqa option update vf_s01_1091_upgrade_preservation 'persisted-value'
          wpqa plugin install "/tmp/$ASSET_NAME" --force
          test "$(wpqa plugin get vf-ops --field=version)" = "1.21.1091"
          wpqa plugin is-active vf-ops
          test "$(wpqa option get vf_s01_1091_upgrade_preservation)" = 'persisted-value'
          wpqa plugin install "$ROOT/vf-ops-1090.zip" --force
          test "$(wpqa plugin get vf-ops --field=version)" = "1.21.1090"
          wpqa plugin is-active vf-ops
          test "$(wpqa option get vf_s01_1091_upgrade_preservation)" = 'persisted-value'
          echo 'REAL_WP_1090_1091_UPGRADE_ROLLBACK_PRESERVE=PASS'

      - name: Create exact tag and formal release
        shell: bash
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          jq -n --arg ref "refs/tags/${TAG}" --arg sha "$TARGET_COMMIT" '{ref:$ref,sha:$sha}' >/tmp/tag-create.json
          curl -fsSL -X POST -H "Authorization: Bearer $WRITE_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' "https://api.github.com/repos/${TARGET_REPOSITORY}/git/refs" --data-binary @/tmp/tag-create.json >/tmp/tag-created.json
          test "$(jq -r '.object.sha' /tmp/tag-created.json)" = "$TARGET_COMMIT"
          cat >/tmp/release-body.md <<'EOF'
          ## VF Tools Ops 1.21.1091 — 组件与系统第四、第五区审计结果 UX/UI 精修
          
          - OWNER 真实 1.21.1090 Production 截图和 WordPress 只读验证确认一键 7,170/7,170 全量扫描、3 批、审计 PASS、无审计问题，但页面仍混淆中途扫描与上次保存的审计，且第五区六个工程 Hash 默认铺满页面。
          - 产品 PR #352 将第四区分为本轮扫描中、当前完整审计、历史不匹配审计、尚未审计四种易懂状态。只有审计 PASS、完整覆盖、无活跃会话、当前 revision/configHash/inventoryHash 一致才显示完整审计完成；进行中明确提示下面是历史依赖数据。原表、操作按钮和删除安全门禁原样保留。
          - 第五区默认展示依赖审计、文件覆盖、记录保存时间和独立线上最终验收；Hash、治理 Manifest/Revision、旧功能映射和日志数保存在同页原生可折叠高级信息。FINAL_ONLINE_PASS 根据真实保存的授权状态呈现中文，不硬编码技术标识。不修改 Shell、Header、Header Menu、五区信息架构、WordPress 策略或任何后端扫描权限/数据。
          - Exact Candidate #38022674872 SUCCESS：真实 PHP View 五种独立状态、Chromium 1440/1024/768/390 宽度和键盘开关高级信息、原五区、治理弹窗与一键扫描回归，隔离 WordPress 7.0.2/MariaDB 11.4 激活及 CSS 路由。
          - Exact source 0a477ddda26f2af178bd4d4f2570e4933f96505a 与合并后 main ee032afbef22aa3996ca2866a7c9d2245f99cd7a 共用 tree 2467dfe279c94980c664e0da050303b24f576b45。正式 ZIP 复用 Candidate 原始字节：vf-tools-ops_V1.21.1091.zip，3,553,790 bytes，SHA-256 baa35cea59538544cd5e53445a172dfed3630af5149538ba83ce855f59564634，989 runtime files，fingerprint 63bae8a90c2230ff65b3a57496f10e119eac17df2e342df49216d931d631ee9b。
          - Schema 6.0.0 未改变。Production 始终 OWNER 手工升级；1090 既有正式审计 7,170/7,170 不需重复扫描，P1 WPVibe 未登记治理策略仍需单独 OWNER 决策。Machine PASS 不代表 OWNER UX PASS。
          EOF
          jq -n --arg tag "$TAG" --arg name "$RELEASE_NAME" --rawfile body /tmp/release-body.md '{tag_name:$tag,name:$name,body:$body,draft:false,prerelease:false}' >/tmp/release-create.json
          curl -fsSL -X POST -H "Authorization: Bearer $WRITE_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' "https://api.github.com/repos/${TARGET_REPOSITORY}/releases" --data-binary @/tmp/release-create.json >/tmp/release-created.json
          RID="$(jq -r '.id' /tmp/release-created.json)"; test -n "$RID"; test "$RID" != null
          test "$(jq -r '.draft' /tmp/release-created.json)" = false
          test "$(jq -r '.prerelease' /tmp/release-created.json)" = false
          echo "RELEASE_ID=$RID" >> "$GITHUB_ENV"
          echo "RELEASE_ID=$RID"

      - name: Upload exact tested asset
        shell: bash
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          curl -fsSL -X POST -H "Authorization: Bearer $WRITE_TOKEN" -H 'Content-Type: application/zip' "https://uploads.github.com/repos/${TARGET_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${ASSET_NAME}" --data-binary "@/tmp/$ASSET_NAME" >/tmp/asset-created.json
          AID="$(jq -r '.id' /tmp/asset-created.json)"; test -n "$AID"; test "$AID" != null
          test "$(jq -r '.name' /tmp/asset-created.json)" = "$ASSET_NAME"
          test "$(jq -r '.size' /tmp/asset-created.json)" = "$EXPECTED_BYTES"
          echo "ASSET_ID=$AID" >> "$GITHUB_ENV"
          echo "ASSET_ID=$AID"

      - name: Remote release exact readback
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          TAG_JSON="$(curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${TARGET_REPOSITORY}/git/ref/tags/${TAG}")"
          test "$(jq -r '.object.sha' <<<"$TAG_JSON")" = "$TARGET_COMMIT"
          curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${TARGET_REPOSITORY}/releases/tags/${TAG}" -o /tmp/release-readback.json
          test "$(jq -r '.id' /tmp/release-readback.json)" = "$RELEASE_ID"
          test "$(jq -r '.draft' /tmp/release-readback.json)" = false
          test "$(jq -r '.prerelease' /tmp/release-readback.json)" = false
          AID="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.id' /tmp/release-readback.json)"
          test "$AID" = "$ASSET_ID"
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.size' /tmp/release-readback.json)" = "$EXPECTED_BYTES"
          curl -fsSL -L -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/octet-stream' "https://api.github.com/repos/${TARGET_REPOSITORY}/releases/assets/${ASSET_ID}" -o "/tmp/remote-$ASSET_NAME"
          test "$(stat -c %s "/tmp/remote-$ASSET_NAME")" = "$EXPECTED_BYTES"
          test "$(sha256sum "/tmp/remote-$ASSET_NAME" | awk '{print $1}')" = "$EXPECTED_SHA256"
          unzip -tq "/tmp/remote-$ASSET_NAME" >/dev/null
          python3 - <<'PY'
          import hashlib, os, zipfile
          p='/tmp/remote-'+os.environ['ASSET_NAME']; files={}
          with zipfile.ZipFile(p) as z:
              for n in z.namelist():
                  if n.endswith('/'): continue
                  if not n.startswith('vf-ops/'): raise SystemExit('bad root')
                  rel=n[len('vf-ops/'):]
                  if rel: files[rel]=z.read(n)
          if len(files)!=int(os.environ['EXPECTED_RUNTIME_FILES']): raise SystemExit('count mismatch')
          h=hashlib.sha256()
          for rel,b in sorted(files.items()):
              h.update(rel.encode()); h.update(b'\0'); h.update(hashlib.sha256(b).hexdigest().encode()); h.update(b'\n')
          if h.hexdigest()!=os.environ['EXPECTED_RUNTIME_FP']: raise SystemExit('fingerprint mismatch')
          print('REMOTE_RUNTIME_READBACK=PASS')
          PY
          jq -n --arg run "$GITHUB_RUN_ID" --arg tag "$TAG" --arg target "$TARGET_COMMIT" --argjson release_id "$RELEASE_ID" --argjson asset_id "$ASSET_ID" --arg asset "$ASSET_NAME" --argjson bytes "$EXPECTED_BYTES" --arg sha "$EXPECTED_SHA256" --argjson runtime_files "$EXPECTED_RUNTIME_FILES" --arg runtime_fp "$EXPECTED_RUNTIME_FP" '{formal_release_run:$run,tag:$tag,tag_target:$target,release_id:$release_id,asset_id:$asset_id,asset_name:$asset,remote_asset_bytes:$bytes,remote_asset_sha256:$sha,remote_zip_integrity:"PASS",remote_runtime_files:$runtime_files,remote_runtime_fingerprint:$runtime_fp,tested_artifact_equals_delivered_artifact:"PASS"}' >/tmp/formal-release-readback.json
          cat /tmp/formal-release-readback.json

      - name: Upload release readback evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-v1.21.1091-formal-release-readback
          path: /tmp/formal-release-readback.json
          retention-days: 30
