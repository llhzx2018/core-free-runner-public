name: P01 V2.36.3 Release Authority Prep
on:
  push:
    branches: [release/p01-v2363-candidate-20260901]
    paths: [.github/workflows/p01-v2363-release-authority-prep-20260901.yml]
permissions:
  contents: read
  actions: read
jobs:
  prep:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE: bcecac5d3a9c103bfc37863a8870ec15285dcc5c
      BRANCH: docs/p01-v2363-release-closure-20260901
      FORMAL: 718e043e3715ef7b21849bc08634fca89bf92c1f
      FORMAL_TREE: 32e8afdd6d7cdd338c62fdafaedb200b127ca881
      RUNTIME_TREE: 820724b585cb59864211f77c4fb33537b2345029
      PRODUCT_MAIN: 21ac0ff14f17237212d288f71e95bde6eae503ec
      RELEASE_ID: '380449563'
      CORE_LIVE: 650935cc9d71570a7ab7a0dd1c615ea5e3bf74bf
      REMOTE_TRUTH_R2: '33504969865'
      REMOTE_TRUTH_ARTIFACT: '9799217396'
      REMOTE_TRUTH_DIGEST: sha256:c8112a57417bf5d66306cc464a2546506506647291375ad8b190f07ef7ed97e4
    steps:
      - name: Checkout exact develop
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: develop
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
      - name: Prepare docs-only release closure branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$BASE"
          test "$(git rev-parse HEAD^{tree})" = "$FORMAL_TREE"
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          test "$(gh api repos/llhzx2018/vf-start/branches/main --jq .commit.sha)" = "$PRODUCT_MAIN"
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.36.3 --jq .object.sha)" = "$FORMAL"
          test "$(gh api repos/llhzx2018/core-updates/branches/main --jq .commit.sha)" = "$CORE_LIVE"
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$REMOTE_TRUTH_R2 --jq .conclusion)" = success
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null 2>&1; then echo "branch already exists"; exit 1; fi
          git switch -c "$BRANCH"
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('VF_PROJECT.json')
          d=json.loads(p.read_text())
          d['status']='V2.36.2 OWNER PRODUCTION / V2.36.3 PUBLISHED / ONLINE UPDATE READY'
          d['production_version']='2.36.2'
          d['working_version']='2.36.3'
          d['target_release_version']='2.36.3'
          d['current_phase']='V2.36.3 RELEASE CLOSURE PASS / OWNER ONLINE UPDATE PENDING'
          d['candidate_version']='2.36.3'
          d['candidate_schema_version']='2026082901'
          d['candidate_state']='PUBLISHED / CANDIDATE CLOSED'
          d['formal_release_state']='V2.36.3 PUBLISHED / CORE-UPDATES LIVE / OWNER V2.36.2'
          d['develop_state']='V2.36.3 FORMAL TREE RELEASED / AUTHORITY CLOSURE PREPARED'
          d['current_authority']='Owner Production V2.36.2 / Published Latest V2.36.3 / live online next hop V2.36.3'
          d['next_action']='Owner 在在线更新页执行 V2.36.2 -> V2.36.3；完成后提供 Fresh Owner readback，随后仅做 Production Readback/Closure。Assistant 不直接写 Production。'
          pub=d.get('published_release',{})
          pub.update({
            'version':'2.36.3','tag':'v2.36.3','release_id':380449563,
            'release_source':'718e043e3715ef7b21849bc08634fca89bf92c1f',
            'release_tree':'32e8afdd6d7cdd338c62fdafaedb200b127ca881',
            'runtime_tree':'820724b585cb59864211f77c4fb33537b2345029',
            'schema_version':'2026082901',
            'main_promotion_commit':'21ac0ff14f17237212d288f71e95bde6eae503ec',
            'live_core_updates_commit':'650935cc9d71570a7ab7a0dd1c615ea5e3bf74bf',
            'live_online_next_hop':'2.36.3 / FROM 2.36.2',
            'online_asset':'VF_Start_V2.36.3_UPDATE.zip',
            'online_asset_bytes':1236976,
            'online_asset_sha256':'7110d0e232ce7dec521b4e76148441d06376a02124249d68237b774f2d33447d',
            'full_asset':'VF-Start-V2.36.3-FULL.zip',
            'full_asset_bytes':587176,
            'full_asset_sha256':'6580700355c8a0127b030f6217a106260f0d8867fd3c3fd6db04fbd048fe46df',
            'repair_asset':'repair-v2.36.3.php',
            'repair_asset_bytes':3591557,
            'repair_asset_sha256':'b76504cd122ab333815d44140ac7a1420451ed03cf63ced7013fc879044be231',
            'release_state':'PUBLISHED / CORE-UPDATES LIVE / OWNER UPGRADE PENDING',
            'assistant_production_write':False,
            'candidate_readiness_gate':33501907010,
            'formal_bind_gate':33502414744,
            'formal_artifact_gate':33502799058,
            'strict_fresh_install_gate':33503664704,
            'main_promotion_gate':33504020301,
            'publication_gate':33504341771,
            'core_updates_candidate_gate':33504575042,
            'core_updates_promotion_gate':33504635827,
            'remote_release_truth_gate':33504969865,
            'remote_release_truth_artifact':9799217396,
            'remote_release_truth_artifact_sha256':'c8112a57417bf5d66306cc464a2546506506647291375ad8b190f07ef7ed97e4'
          })
          d['published_release']=pub
          cur=d.get('current_change',{})
          cur.update({
            'result':'PUBLISHED / ONLINE UPDATE READY / OWNER NOT YET UPGRADED',
            'formal_source':'718e043e3715ef7b21849bc08634fca89bf92c1f',
            'formal_tree':'32e8afdd6d7cdd338c62fdafaedb200b127ca881',
            'runtime_tree':'820724b585cb59864211f77c4fb33537b2345029',
            'main_promotion_commit':'21ac0ff14f17237212d288f71e95bde6eae503ec',
            'release_id':380449563,
            'core_updates_commit':'650935cc9d71570a7ab7a0dd1c615ea5e3bf74bf',
            'remote_truth_r2':33504969865,
            'main_write':True,
            'production_write':False,
            'runner_main_write':False
          })
          d['current_change']=cur
          auth=d.get('authority',{})
          auth['current_formal_release_evidence']='docs/evidence/P01_V2.36.3_RELEASE_CLOSURE_20260901.md'
          auth['current_l2_develop_evidence']='docs/evidence/P01_V2.36.3_RELEASE_CLOSURE_20260901.md'
          d['authority']=auth
          d['v2_36_3_release_chain']={
            'candidate_readiness':33501907010,
            'formal_bind':33502414744,
            'formal_artifact':33502799058,
            'strict_fresh':33503664704,
            'main_promotion':33504020301,
            'publication_r2':33504341771,
            'core_updates_candidate':33504575042,
            'core_updates_promotion':33504635827,
            'remote_release_truth_r2':33504969865,
            'result':'PASS',
            'owner_production_write':False
          }
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2)+'\n')

          section='''<!-- P01_V2363_RELEASE_CLOSURE -->
          ## V2.36.3 Release Closure · 2026-09-01

          - Owner Production：`V2.36.2` / Schema `2026082901`；本轮 **未写 Production**。
          - Published Latest：`V2.36.3`；Tag `v2.36.3` 精确绑定 Formal Source `718e043e3715ef7b21849bc08634fca89bf92c1f`。
          - Formal Tree：`32e8afdd6d7cdd338c62fdafaedb200b127ca881`；Runtime Tree：`820724b585cb59864211f77c4fb33537b2345029`。
          - Product main：`21ac0ff14f17237212d288f71e95bde6eae503ec`，为 Tree-Identity Merge；`main:src` 与 Formal Runtime Tree 一致。
          - GitHub Release：`380449563`；非 Draft / 非 Prerelease；Publication R2 `33504341771` = **PASS**。
          - 正式在线资产：`VF_Start_V2.36.3_UPDATE.zip` = `1236976 bytes` / `sha256:7110d0e232ce7dec521b4e76148441d06376a02124249d68237b774f2d33447d`。
          - FULL：`587176 bytes` / `sha256:6580700355c8a0127b030f6217a106260f0d8867fd3c3fd6db04fbd048fe46df`；repair：`3591557 bytes` / `sha256:b76504cd122ab333815d44140ac7a1420451ed03cf63ced7013fc879044be231`。
          - Strict Fresh：`33503664704` = **PASS**；Fresh Install、390/1440 ONE FRONTEND、隐私、Sticky、CSP、SEO、SQLite 全 PASS。
          - core-updates Candidate `33504575042` = PASS；Promotion `33504635827` = PASS；live main `650935cc9d71570a7ab7a0dd1c615ea5e3bf74bf`。
          - Online Update Contract：**严格单跳 `V2.36.2 → V2.36.3`**；repair.php `SOURCE_VERSION=2.36.2 / TARGET_VERSION=2.36.3`，Atomic self-test PASS。
          - Remote Release Truth R1：仅因匿名访问私有 `core-updates` raw URL 返回 404 而失败，分类 **HARNESS ONLY**；Product / Release / Manifest 字节未修改。
          - Remote Release Truth R2：`33504969865` = **PASS**；Artifact `9799217396`；Digest `sha256:c8112a57417bf5d66306cc464a2546506506647291375ad8b190f07ef7ed97e4`；R2 使用与真实 Updater 一致的带 Token GitHub Contents API。
          - V2.36.3 收录：已修复 ONE FRONTEND P0 双壳/登录状态分裂缺陷，并包含共享 Sticky 筛选条穿透修复；Schema 不变，无 Migration。
          - Next：Owner 在后台在线更新页执行 `V2.36.2 → V2.36.3`；升级后提交 Fresh Current / Latest / History / Last Check / Footer 证据，再做 Production Closure。

          > 以下旧段落保留历史证据；如与本段冲突，以本段为 Current Release Authority。

          '''
          section='\n'.join(line.strip() if i==0 else line[10:] if line.startswith('          ') else line for i,line in enumerate(section.splitlines()))+'\n'
          for fn in ['docs/authority/CURRENT.md','docs/handoff/CURRENT_STATE.md']:
              q=pathlib.Path(fn)
              old=q.read_text()
              if '<!-- P01_V2363_RELEASE_CLOSURE -->' not in old:
                  lines=old.splitlines(True)
                  insert=1 if lines and lines[0].startswith('# ') else 0
                  q.write_text(''.join(lines[:insert])+('\n' if insert else '')+section+''.join(lines[insert:]))

          ev=pathlib.Path('docs/evidence/P01_V2.36.3_RELEASE_CLOSURE_20260901.md')
          ev.write_text('''# P01 · V2.36.3 Release Closure · 2026-09-01

## Verdict

**PASS — V2.36.3 is formally published and the online update channel is live for the strict single hop V2.36.2 → V2.36.3. Owner Production is still V2.36.2 until the owner performs the update.**

## Exact identities

- Formal Source: `718e043e3715ef7b21849bc08634fca89bf92c1f`
- Formal Tree: `32e8afdd6d7cdd338c62fdafaedb200b127ca881`
- Runtime Tree: `820724b585cb59864211f77c4fb33537b2345029`
- Product main promotion: `21ac0ff14f17237212d288f71e95bde6eae503ec`
- Tag: `v2.36.3`
- GitHub Release ID: `380449563`
- core-updates main: `650935cc9d71570a7ab7a0dd1c615ea5e3bf74bf`

## Release assets

- `VF-Start-V2.36.3-FULL.zip`: 587176 bytes / `sha256:6580700355c8a0127b030f6217a106260f0d8867fd3c3fd6db04fbd048fe46df`
- `VF_Start_V2.36.3_UPDATE.zip`: 1236976 bytes / `sha256:7110d0e232ce7dec521b4e76148441d06376a02124249d68237b774f2d33447d`
- `repair-v2.36.3.php`: 3591557 bytes / `sha256:b76504cd122ab333815d44140ac7a1420451ed03cf63ced7013fc879044be231`

## Gates

- Candidate Readiness: `33501907010` PASS
- Formal Bind: `33502414744` PASS
- Formal Artifact: `33502799058` PASS
- Strict Fresh: `33503664704` PASS
- Main Promotion: `33504020301` PASS
- Publication R2: `33504341771` PASS
- core-updates Candidate: `33504575042` PASS
- core-updates Promotion: `33504635827` PASS
- Remote Release Truth R2: `33504969865` PASS
- Remote Truth Artifact: `9799217396` / `sha256:c8112a57417bf5d66306cc464a2546506506647291375ad8b190f07ef7ed97e4`

## Online updater contract

- `current_version = 2.36.2`
- `target_version = 2.36.3`
- `from_versions = [2.36.2]`
- `repair-v2.36.3.php` binds `SOURCE_VERSION=2.36.2` and `TARGET_VERSION=2.36.3`
- Atomic self-test PASS
- Schema remains `2026082901`; no migration.

## Harness note

Remote Release Truth R1 used an anonymous `raw.githubusercontent.com` probe against the private `core-updates` repository and therefore received HTTP 404. This was a harness-only mistake. R2 reproduced the actual updater contract: authenticated GitHub Contents API access. No Product, Tag, Release, Artifact, or Manifest bytes were changed to obtain R2 PASS.

## Owner boundary

Assistant Production Write: **NO**. Owner Production remains **V2.36.2**. The next owner action is the visible online update **V2.36.2 → V2.36.3**, followed by Fresh Owner Production readback and closure.
''')
          PY
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          expected=$'VF_PROJECT.json\ndocs/authority/CURRENT.md\ndocs/evidence/P01_V2.36.3_RELEASE_CLOSURE_20260901.md\ndocs/handoff/CURRENT_STATE.md'
          test "$(printf '%s\n' "${changed[@]}")" = "$expected"
          test -z "$(git diff --name-only -- src)"
          python3 -m json.tool VF_PROJECT.json >/dev/null
          git diff --check
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VF_PROJECT.json docs/authority/CURRENT.md docs/evidence/P01_V2.36.3_RELEASE_CLOSURE_20260901.md docs/handoff/CURRENT_STATE.md
          git commit -m "docs(P01): record V2.36.3 release closure"
          git push origin "$BRANCH"
          printf 'AUTHORITY_PREP=PASS\nBRANCH=%s\nCOMMIT=%s\nBASE=%s\nSRC_TREE=%s\nOWNER_PRODUCTION_WRITE=NO\n' "$BRANCH" "$(git rev-parse HEAD)" "$BASE" "$(git rev-parse HEAD:src)" | tee /tmp/verdict.txt
      - name: Upload prep evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2363-release-authority-prep-${{ github.run_id }}
          path: /tmp/verdict.txt
          if-no-files-found: warn
          retention-days: 90
