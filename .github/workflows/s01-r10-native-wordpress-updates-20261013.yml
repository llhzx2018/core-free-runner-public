name: S01 R10 native WordPress Theme112 and M3U8-90
on:
  push:
    branches: [task/s01-r10-candidate-20261013]
    paths: [.github/workflows/s01-r10-native-wordpress-updates-20261013.yml]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_VERSION: '1.3.0'
      TARGET_SHA: 'f38ff4cb36ba10b90c13976c602b0257d0d7cb83'
      TARGET_TREE: '2b8fac6e37475b79bc78410c775ccc80a38fabcb'
      CHANNEL_SHA: 'f38ff4cb36ba10b90c13976c602b0257d0d7cb83'
      THEME_SOURCE_VERSION: '1.35.111'
      THEME_LEGACY_SOURCE_VERSION: '1.35.110'
      THEME_VERSION: '1.35.112'
      THEME_SHA: '2fd200573cf58d3cf87d81d95bf922e7a5cb4e87'
      THEME_TREE: '204b3b8ba14950235a9153626717740975d0e0b0'
      THEME_ASSET_SHA: '6574f7701b1646d968f1c7605f99b222584912e5d0af23debc6b5c0f66d26745'
      THEME_BASE_BYTES: '1793880'
      THEME_BASE_SHA256: '4587f95fe006606adf059e03c6452436fc79f8cfc616097f80657e9dc5091bd9'
      THEME_LEGACY_BYTES: '1793771'
      THEME_LEGACY_SHA256: '17e54882cff8ab4e755ba33a851e343d6db69290389851a2e0c45c9c49ce0c53'
      M3_SOURCE_VERSION: '1.25.89'
      M3_VERSION: '1.25.90'
      M3_SHA: '75560304915d2085302f6ac09c4ee57d105dc81c'
      M3_TREE: 'e7c8d62c53429f1ad19465d696aa7ad150c90e35'
      M3_ASSET_SHA: 'ad6b42a093082db6d477566a4aac47e087d456bf61ba4d3426858ca86467dafa'
      M3_BASE_BYTES: '3579747'
      M3_BASE_SHA256: 'ae775da6115ae20fb77aa9473bfa5ecda3998b4324a491a5b1f2a5ea2fa445a6'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: b644d52747a20ed7766232c7560a73de46927712
          persist-credentials: false
          path: previous
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: f38ff4cb36ba10b90c13976c602b0257d0d7cb83
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: task/s01-c01-footer105-20261010-discovery
          persist-credentials: false
          path: historic-theme
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: task/s01-c03-embed78-20261010-discovery
          persist-credentials: false
          path: historic-m3
      - name: Exact live channel, original schema and updater tests
        run: |
          set -Eeuo pipefail
          mkdir -p proof lane
          cp previous/lanes/s01-tools88-theme111-native-20261013/native.sh lane/native.sh
          bash -n lane/native.sh
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          (cd target && python3 scripts/check_manifest_contract.py >/tmp/s01-check.json)
          (cd target && find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null)
          (cd target && php update-core/php/tests/run.php)
          python3 -c "import json; assert json.load(open('/tmp/s01-check.json'))['status']=='PASS'"
          echo S01_R10_MERGED_CHANNEL_ORIGINAL_CI_PASS
      - name: WordPress native discovery and exact private asset download
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: bash lane/native.sh
      - name: Verify native receipt identities
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          x=json.load(open('proof/FINAL_DISCOVERY.json'))
          assert x['status']=='PASS' and set(x['component_checks'])=={'S01-C01','S01-C03'}
          assert all(v['native_discovery']=='UPDATE_AVAILABLE' and v['missing_credential']=='FAIL_CLOSED_PRESERVED' for v in x['component_checks'].values())
          print('S01_R10_NATIVE_WP_BOTH_COMPONENTS_DISCOVERABLE_PASS')
          PY
      - name: Cleanup private sources and fixtures
        if: always()
        run: rm -rf previous target historic-theme historic-m3 lane proof /tmp/theme-source.zip /tmp/theme-legacy-source.zip /tmp/m3-source.zip /tmp/theme-channel.json /tmp/m3-channel.json /tmp/theme-channel-main.json /tmp/m3-channel-main.json /tmp/vf-s01-wpcli.phar /tmp/s01-check.json
