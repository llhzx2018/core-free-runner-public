name: S01 exact Theme channel contract
on:
  push:
    branches: [task/s01-search205-20261027]
    paths: ['.github/workflows/s01-search205-20261027-channel.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.205
  TARGET_SHA: 8804cd0b3db69440b204bf8b07879a29b9e93df2
  UPDATE_SHA: ea16719cff3ca720f96ddd27d3688437b8ea5b61
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: ea16719cff3ca720f96ddd27d3688437b8ea5b61
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: source
      - name: Channel identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-search205-20261027/channel-spec.json --input control/.github/workflows/s01-search205-20261027-channel.yml
      - name: Exact changed manifest and native protocol tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          test "$(git -C source diff --name-only d210dab599243e11b5bc7f40dfaf3bf89bb7a169 ea16719cff3ca720f96ddd27d3688437b8ea5b61)" = projects/S01-C01.json
          git -C source diff --exit-code d210dab599243e11b5bc7f40dfaf3bf89bb7a169 ea16719cff3ca720f96ddd27d3688437b8ea5b61 -- projects/S01-C03.json
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PYCHANNEL'
          import json,os
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']==os.environ['TARGET_VERSION']
          assert m['asset_sha256']=='219b5d1e2c8f186afed49078bea357111f5e03ae8b48ec2cf3ff9125113f65d6' and m['asset_bytes']==2008733
          assert m['runtime_files']==476 and '1.35.204' in m['from_versions']
          assert m['release_tag']=='v'+os.environ['TARGET_VERSION']
          print('EXACT_CHANNEL_CONTRACT_PASS')
          PYCHANNEL
      - name: Cleanup
        if: always()
        run: rm -rf source
