name: S01-C02 1.21.1049 source acceptance candidate
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: fixture-root
          MARIADB_DATABASE: vf_source_1049
          MARIADB_USER: vf
          MARIADB_PASSWORD: vf-fixture-db
        ports: ["3306:3306"]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 973f63bd51cbeb483ef895e256b0568b5597725f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: target
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 38e43d2e262eddc2fb1d6d9a1ae12fef48460241
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: baseline
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, zip, sodium, mbstring

      - name: Exact source contracts
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          test "$(git -C target rev-parse HEAD)" = "973f63bd51cbeb483ef895e256b0568b5597725f"
          test "$(git -C target rev-parse HEAD^{tree})" = "3649fd2ff93b53db2caed2df945f7003c45c18b0"
          test "$(cat target/VERSION)" = "1.21.1049"
          test "$(cat baseline/VERSION)" = "1.21.1048"
          grep -F "Version: 1.21.1049" target/vf-ops.php >/dev/null
          php target/tests/s01-c02-1211049-source-functional-ui-contract.php
          php target/tests/s01-c02-121934-shell-header-visual-lock-r45-contract.php
          find target -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.txt
          echo SOURCE_CONTRACTS=PASS
          echo PHP_83_SYNTAX=PASS

      - name: Browser responsive proof
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/source-node
          cd /tmp/source-node
          npm init -y >/dev/null
          npm install --no-save playwright@1.58.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          export NODE_PATH=/tmp/source-node/node_modules
          cd "$GITHUB_WORKSPACE"
          node target/tests/s01-c02-1211049-source-browser-proof.js > evidence/source-browser.json
          cat evidence/source-browser.json
          jq -e '.pass==true and (.failures|length)==0' evidence/source-browser.json

      - name: Build baseline and candidate packages
        run: |
          set -Eeuo pipefail
          python3 baseline/.github/release/build-ops-package.py --source baseline --output "$RUNNER_TEMP/vf-tools-ops_V1.21.1048.zip" > baseline-package.json
          python3 target/.github/release/build-ops-package.py --source target --output "$RUNNER_TEMP/vf-tools-ops_V1.21.1049.zip" > package.json
          cp "$RUNNER_TEMP/vf-tools-ops_V1.21.1048.zip" baseline.zip
          cp "$RUNNER_TEMP/vf-tools-ops_V1.21.1049.zip" candidate.zip
          python3 - <<'PY'
          import json,zipfile
          from pathlib import Path
          for name in ['baseline.zip','candidate.zip']:
              with zipfile.ZipFile(name) as z:
                  assert z.testzip() is None,name
                  assert all(n.startswith('vf-ops/') and '..' not in n.split('/') for n in z.namelist()),name
          p=json.loads(Path('package.json').read_text())
          Path('evidence/package.json').write_text(json.dumps({
              'asset_name':p.get('asset_name',''),
              'asset_bytes':p.get('asset_bytes',0),
              'asset_sha256':p.get('asset_sha256',''),
              'runtime_files':p.get('runtime_files',0),
              'runtime_fingerprint':p.get('runtime_fingerprint','')
          },indent=2)+'\n')
          print('PACKAGE_CRC_PATH=PASS')
          PY

      - name: WordPress MariaDB functional integration and rollback
        run: |
          set -Eeuo pipefail
          TASK_ROOT="$RUNNER_TEMP/s01-source-1049"
          WP="$TASK_ROOT/wordpress"
          mkdir -p "$WP"
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o "$TASK_ROOT/wp"
          chmod +x "$TASK_ROOT/wp"
          wp(){ php "$TASK_ROOT/wp" --path="$WP" "$@"; }

          wp core download --version=7.0.2 --force >/dev/null
          wp config create --dbname=vf_source_1049 --dbuser=vf --dbpass=vf-fixture-db --dbhost=127.0.0.1:3306 --skip-check >/dev/null
          wp core install --url=http://127.0.0.1:18153 --title='Source Candidate 1049' --admin_user=admin --admin_password='Fixture-Source-1049!' --admin_email=fixture@example.invalid --skip-email >/dev/null

          wp plugin install "$GITHUB_WORKSPACE/baseline.zip" --activate >/dev/null
          wp option update vf_ops_source_candidate_sentinel preserve >/dev/null
          wp eval 'if(VF_OPS_VERSION!=="1.21.1048")throw new RuntimeException("BASE_VERSION");echo "BASELINE_RUNTIME=PASS\n";'

          wp plugin install "$GITHUB_WORKSPACE/candidate.zip" --force >/dev/null
          wp eval 'if(VF_OPS_VERSION!=="1.21.1049")throw new RuntimeException("TARGET_VERSION");if(get_option("vf_ops_source_candidate_sentinel")!=="preserve")throw new RuntimeException("STATE_CHANGED");echo "CANDIDATE_INSTALL_READBACK=PASS\n";'

          export TEST_FILE="$GITHUB_WORKSPACE/target/tests/s01-c02-1211049-source-wp-integration.php"
          wp eval 'require getenv("TEST_FILE");' > evidence/source-wp-integration.json
          cat evidence/source-wp-integration.json
          jq -e '.status=="PASS"
            and .ordinary_open_write_free=="PASS"
            and .stale_leaf_suppression=="PASS"
            and .historical_evidence_preserved=="PASS"
            and .corrupt_snapshot_hidden=="PASS"
            and .revision_conflict=="PASS"
            and .mutation_lock=="PASS"
            and .reset_state_guard=="PASS"
            and .reset_readback=="PASS"
            and .batch_gate_fail_closed=="PASS"' evidence/source-wp-integration.json

          wp plugin install "$GITHUB_WORKSPACE/baseline.zip" --force >/dev/null
          wp eval 'if(VF_OPS_VERSION!=="1.21.1048")throw new RuntimeException("ROLLBACK_VERSION");if(get_option("vf_ops_source_candidate_sentinel")!=="preserve")throw new RuntimeException("ROLLBACK_STATE");echo "ROLLBACK=PASS\n";'

      - name: Write public-safe evidence
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          def read_json(path):
              p=Path(path)
              if not p.exists() or p.stat().st_size<2:return {}
              try:return json.loads(p.read_text())
              except Exception:return {}
          b=read_json('evidence/source-browser.json')
          w=read_json('evidence/source-wp-integration.json')
          p=read_json('evidence/package.json')
          proof={
              'schema':'vf-s01-source-acceptance-proof/v1',
              'source_repository':'llhzx2018/vf-tools-ops',
              'source_sha':'973f63bd51cbeb483ef895e256b0568b5597725f',
              'source_tree':'3649fd2ff93b53db2caed2df945f7003c45c18b0',
              'version':'1.21.1049','base_version':'1.21.1048',
              'package_sha256':p.get('asset_sha256',''),
              'asset_bytes':p.get('asset_bytes',0),
              'runtime_files':p.get('runtime_files',0),
              'runtime_fingerprint':p.get('runtime_fingerprint',''),
              'browser':'PASS' if b.get('pass') is True and not b.get('failures') else 'NOT_PROVEN',
              'wp_mariadb_integration':'PASS' if w.get('status')=='PASS' else 'NOT_PROVEN',
              'production':'NOT_TOUCHED','owner_product_pass':False
          }
          proof['status']='PASS' if proof['browser']=='PASS' and proof['wp_mariadb_integration']=='PASS' else 'FAIL'
          Path('evidence/FINAL_EVIDENCE.json').write_text(json.dumps(proof,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(proof,ensure_ascii=False))
          if proof['status']!='PASS': raise SystemExit(1)
          PY

      - name: Upload public-safe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s01-c02-1211049-source-candidate-evidence
          path: |
            evidence/source-browser.json
            evidence/source-wp-integration.json
            evidence/package.json
            evidence/FINAL_EVIDENCE.json
          if-no-files-found: warn
          retention-days: 30
