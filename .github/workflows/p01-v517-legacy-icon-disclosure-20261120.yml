name: P01 v517 Owner restore historical favicon disclosure native HTTPS
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  scoped-laravel-owner-recovery:
    if: github.head_ref == 'test/p01-v517-legacy-icon-disclosure-20261120' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Restrict to synthetic assets and immutable product revision
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = llhzx2018/core-free-runner-public
          echo P01_INPUT_REAL_PRIVATE_BACKUP=NO
          echo P01_PRODUCTION_OR_CLOUDPANEL=UNTOUCHED
      - name: Transient exact-source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: af6756821c02a153337e211b465d755b80eb64b1
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
      - name: Verify restored-data accounting code and identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "af6756821c02a153337e211b465d755b80eb64b1"
          test "$(cat candidate/VERSION)" = "2.47.517"
          python3 -m py_compile candidate/tests/compatibility/laravel/http/owner_sqlite_restore_https.py
          grep -q "legacy_icon_file_references_not_restored" candidate/src/app/next/runtime/OwnerSqliteRecovery.php
          echo P01_V517_PRECISE_ICON_NONRESTORE_SOURCE_BINDING=PASS
      - name: Native PHP8.3 ZIP SQLite Composer and Nginx
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            nginx openssl curl unzip composer php8.3-cli php8.3-fpm \
            php8.3-sqlite3 php8.3-mysql php8.3-mbstring php8.3-xml \
            php8.3-curl php8.3-zip >/dev/null
          php -l candidate/src/app/next/runtime/OwnerSqliteRecovery.php
          php -r 'if(!in_array("sqlite",PDO::getAvailableDrivers(),true)||!class_exists("ZipArchive"))exit(3);'
          echo P01_NATIVE_SQLITE_ICON_SCOPE_SYNTAX=PASS
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: One exact Composer and Vite FULL build
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 scripts/build_p01_next_clean_full.py build \
            --source-sha af6756821c02a153337e211b465d755b80eb64b1 \
            --output /tmp/p01-owner-icons-clean-dev.zip
          python3 scripts/build_p01_next_clean_full.py verify \
            --zip /tmp/p01-owner-icons-clean-dev.zip
          python3 scripts/build_p01_next_cloudpanel_full.py build \
            --source-zip /tmp/p01-owner-icons-clean-dev.zip \
            --output /tmp/p01-owner-icons-cp-dev.zip
          python3 scripts/build_p01_next_cloudpanel_full.py verify \
            --zip /tmp/p01-owner-icons-cp-dev.zip
          echo P01_OWNER_ICONS_EXACT_FULL_VUE_TYPECHECK=PASS
      - name: Native installed Laravel session/CSRF recovered data and icon nonrestore readback
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 tests/compatibility/laravel/http/run_cloudpanel_fpm_full_stage.py \
            --bundle /tmp/p01-owner-icons-cp-dev.zip \
            --engine sqlite --only-owner-media-restore
          echo P01_OWNER_LEGACY_ICON_EXCLUSION_NATIVE_HTTPS=PASS
      - name: Remove ephemeral private source and packages
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate
          rm -f -- /tmp/p01-owner-icons-clean-dev.zip /tmp/p01-owner-icons-cp-dev.zip
          echo P01_PRIVATE_CHECKOUT_AND_BUNDLE_PERSISTENCE=NONE
