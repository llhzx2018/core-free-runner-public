name: S01 Final UX Candidate Patch

on:
  push:
    branches:
      - temp/s01-final-ux-candidate-patch-20260907
    paths:
      - '.github/workflows/temp-s01-final-ux-candidate-patch-20260907.yml'

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      C01_BRANCH: ux/s01-c01-deep-human-closure-13519-20260907
      C01_HEAD: 60f30e80231a953d8bf84d96b85cd55211d91ae0
      C01_MAIN: 72d2a83da7b940a080d48c40891555dc815aaafa
      C02_BRANCH: ux/s01-c02-pages-tools-human-closure-121857-20260907
      C02_HEAD: 1ac24e55e7e21e1d02154a6fd6c96ac814f377b3
      C02_MAIN: 1ac24e55e7e21e1d02154a6fd6c96ac814f377b3
    steps:
      - name: Candidate-only boundary
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WRITE_TOKEN"
          echo 'MAIN_WRITE_USED=NO'
          echo 'RELEASE_WRITE_USED=NO'
          echo 'PRODUCTION_WRITE_USED=NO'
      - name: Patch C01 Theme
        shell: bash
        run: |
          set -euo pipefail
          git clone -q "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/vf-tools-theme.git" c01
          cd c01
          test "$(git rev-parse origin/main)" = "$C01_MAIN"
          git checkout -q "$C01_BRANCH"
          test "$(git rev-parse HEAD)" = "$C01_HEAD"
          python3 - <<'PY'
          from pathlib import Path
          def one(path,old,new):
              p=Path(path); s=p.read_text(); n=s.count(old)
              if n!=1: raise SystemExit(f'EXACT_REPLACE_FAIL {path} count={n}: {old[:60]}')
              p.write_text(s.replace(old,new,1))
          one('VERSION','1.35.18\n','1.35.19\n')
          one('src/style.css','Version: 1.35.18','Version: 1.35.19')
          one('src/style.css','V1.35.18_S01_DEEP_HUMAN_LANGUAGE','V1.35.19_S01_FINAL_ADMIN_HUMAN_CLOSURE')
          b='src/inc/admin/views/brand.php'
          one(b,"$canonical_stored ? '正式配置已存储' : '当前使用兼容回退'","$canonical_stored ? '已保存并生效' : '正在使用安全默认设置'")
          one(b,"<span>修订 <?php echo esc_html($revision_short !== '' ? $revision_short : '未生成'); ?></span>","<span><?php echo esc_html($runtime_ok ? '前台显示已确认' : '前台显示待确认'); ?></span>")
          n='src/inc/admin/views/navigation.php'
          one(n,"$check_labels = ['database'=>'数据库回读','header'=>'桌面页头','mobile'=>'移动导航','footer'=>'页脚输出','css'=>'响应式变量'];","$check_labels = ['database'=>'保存结果','header'=>'桌面页头','mobile'=>'移动导航','footer'=>'页脚输出','css'=>'移动端适配'];")
          one(n,"'数据库、页头、移动导航、页脚与响应式变量已读取同一份正式配置。'","'导航与页脚设置已同步到桌面、移动端和页脚。'")
          one(n,"<span>保存后执行写入、数据库回读和五类前台显示检查。</span>","<span>保存后会自动检查桌面、移动端和页脚是否正确显示。</span>")
          one(n,"!empty($state['stored']) ? '正式配置已存储' : '当前使用兼容回退'","!empty($state['stored']) ? '已保存并生效' : '正在使用安全默认设置'")
          one(n,"<span>修订 <?php echo esc_html($revision_short !== '' ? $revision_short : '未生成'); ?></span>","<span><?php echo esc_html($runtime_ok ? '前台显示已确认' : '前台显示待确认'); ?></span>")
          one(n,"本页只绑定 WordPress 菜单到真实主题位置；菜单项本身仍由 WordPress 核心统一维护。","在这里选择桌面、移动端和页脚使用哪个 WordPress 菜单；菜单项内容仍在 WordPress 菜单中统一维护。")
          one(n,"<strong>旧配置仍在保护期</strong>","<strong>发现旧版设置</strong>")
          one(n,"'旧数据保留中，完成真实回读后再处理。':'等待真实环境确认迁移结果。'","'旧设置会暂时保留，确认当前导航显示正常后再自动整理。':'请先确认当前导航与页脚显示正常。'")
          for path in ['tests/update-refresh-policy-contract.php','tests/visible-console-v2-contract.php','tests/workbench-primary-action-contract.php']:
              p=Path(path); s=p.read_text(); c=s.count('1.35.18')
              if c<1: raise SystemExit('VERSION_CONTRACT_NOT_FOUND '+path)
              p.write_text(s.replace('1.35.18','1.35.19'))
          Path('tests/final-admin-human-closure-contract.php').write_text(r'''<?php
          $root=dirname(__DIR__); $brand=(string)file_get_contents($root.'/src/inc/admin/views/brand.php'); $nav=(string)file_get_contents($root.'/src/inc/admin/views/navigation.php'); $css=(string)file_get_contents($root.'/src/assets/css/admin/admin-s01-uiux-pages.css');
          foreach(['已保存并生效','正在使用安全默认设置','前台显示已确认','前台显示待确认'] as $x){if(!str_contains($brand,$x)){fwrite(STDERR,"FAIL_BRAND:$x\n");exit(1);}}
          foreach(['导航与页脚设置已同步到桌面、移动端和页脚。','保存后会自动检查桌面、移动端和页脚是否正确显示。',"'database'=>'保存结果'","'css'=>'移动端适配'",'发现旧版设置'] as $x){if(!str_contains($nav,$x)){fwrite(STDERR,"FAIL_NAV:$x\n");exit(1);}}
          foreach(['正式配置已存储','当前使用兼容回退','数据库回读','响应式变量','<span>修订 ','旧配置仍在保护期'] as $x){if(str_contains($brand."\n".$nav,$x)){fwrite(STDERR,"FAIL_VISIBLE_ENGINEERING:$x\n");exit(1);}}
          foreach([['vf-brand-page','.vf-brand-page'],['vf-brand-status-strip','.vf-brand-status-strip'],['vf-brand-workflow','.vf-brand-workflow'],['vf-navigation-page','.vf-navigation-page'],['vf-navigation-status-strip','.vf-navigation-status-strip'],['vf-navigation-workflow','.vf-navigation-workflow']] as [$c,$s]){if(!str_contains($brand."\n".$nav,$c)||!str_contains($css,$s)){fwrite(STDERR,"FAIL_SELECTOR:$s\n");exit(1);}}
          foreach(['data-vf-revision','name="revision"','data-vf-navigation-revision','data-vf-brand-revision'] as $x){if(!str_contains($brand."\n".$nav,$x)){fwrite(STDERR,"FAIL_INTERNAL:$x\n");exit(1);}}
          echo "PASS_THEME_FINAL_ADMIN_HUMAN_CLOSURE\n";
          ''')
          PY
          rm -f .github/workflows/temp-c01-13519-candidate-patch.yml
          php -l src/inc/admin/views/brand.php >/dev/null
          php -l src/inc/admin/views/navigation.php >/dev/null
          php tests/deep-admin-human-language-contract.php
          php tests/final-admin-human-closure-contract.php
          php tests/visible-console-v2-contract.php
          php tests/workbench-primary-action-contract.php
          php tests/update-refresh-policy-contract.php
          git config user.name VictorForge; git config user.email llhzx2018@gmail.com
          git add -A
          git commit -m 'feat(S01-C01): final admin human language closure 1.35.19'
          git push -q origin HEAD:"$C01_BRANCH"
      - name: Patch C02 Ops
        shell: bash
        run: |
          set -euo pipefail
          git clone -q "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/vf-tools-ops.git" c02
          cd c02
          test "$(git rev-parse origin/main)" = "$C02_MAIN"
          git checkout -q "$C02_BRANCH"
          test "$(git rev-parse HEAD)" = "$C02_HEAD"
          python3 - <<'PY'
          from pathlib import Path
          def one(path,old,new):
              p=Path(path); s=p.read_text(); n=s.count(old)
              if n!=1: raise SystemExit(f'EXACT_REPLACE_FAIL {path} count={n}: {old[:70]}')
              p.write_text(s.replace(old,new,1))
          one('VERSION','1.21.856\n','1.21.857\n')
          one('vf-ops.php','Version: 1.21.856','Version: 1.21.857')
          one('vf-ops.php',"VF_OPS_VERSION', '1.21.856'","VF_OPS_VERSION', '1.21.857'")
          one('vf-ops.php',"VF_OPS_ROUND', 'S01-DASHBOARD-SELECTOR-HIT'","VF_OPS_ROUND', 'S01-PAGES-TOOLS-HUMAN-CLOSURE'")
          one('includes/admin-v13/views/dashboard.php',"'1.21.856'","'1.21.857'")
          p='includes/views/admin-operations-console-pages.php'
          one(p,'集中查看公开页面、工具页、内容对象和组件依赖。这里只做轻量状态判断与责任分流，不扫描其他组件源码，也不自动访问前台。','集中查看公开页面、工具页、内容和相关组件状态。先处理需要关注的页面，再进入前台确认实际效果。')
          one(p,'<em>已登记路径总数</em>','<em>当前页面总数</em>')
          one(p,'<em>路径与页面对象可用</em>','<em>页面基础状态正常</em>')
          one(p,'状态来自 WordPress 页面对象、主题路径规则和工具功能可用性；未访问前台页面，不代表线上已经通过。','这里先检查页面是否存在、是否可用；最终效果仍需在真实前台确认。')
          one(p,'<th>页面与路径</th>','<th>页面</th>')
          one(p,'data-label="页面与路径"','data-label="页面"')
          one(p,"<code>'.esc_html((string)$row['path']).'</code>","<small>访问地址：'.esc_html((string)$row['path']).'</small>")
          one(p,"<small>'.esc_html((string)$row['contentType']).' · 短代码 '.esc_html((string)$row['shortcode']).'</small>","<small>'.esc_html((string)$row['contentType']).'</small>")
          one(p,"<strong>'.esc_html((string)$row['type']).'</strong><code>'.esc_html((string)$row['postType']).'</code>","<strong>'.esc_html((string)$row['type']).'</strong>")
          one(p,'这里只读取其他 VF 组件公开提供的状态，不读取其私有数据。','这里只显示相关 VF 组件是否可用；缺失时会给出处理提示。')
          for path in ['tests/admin-human-language-contract.php','tests/update-refresh-policy-current-contract.php','tests/visible-console-v2-contract.php']:
              q=Path(path); s=q.read_text(); c=s.count('1.21.856')
              if c<1: raise SystemExit('VERSION_CONTRACT_NOT_FOUND '+path)
              q.write_text(s.replace('1.21.856','1.21.857'))
          q=Path('tests/admin-human-language-contract.php'); s=q.read_text(); s=s.replace("VF_OPS_ROUND', 'S01-DASHBOARD-SELECTOR-HIT'","VF_OPS_ROUND', 'S01-PAGES-TOOLS-HUMAN-CLOSURE'"); q.write_text(s)
          Path('tests/pages-tools-human-closure-contract.php').write_text(r'''<?php
          $root=dirname(__DIR__); $page=(string)file_get_contents($root.'/includes/views/admin-operations-console-pages.php'); $main=(string)file_get_contents($root.'/vf-ops.php');
          foreach(['集中查看公开页面、工具页、内容和相关组件状态。','当前页面总数','页面基础状态正常','最终效果仍需在真实前台确认。','访问地址：','这里只显示相关 VF 组件是否可用；缺失时会给出处理提示。'] as $x){if(!str_contains($page,$x)){fwrite(STDERR,"FAIL_REQUIRED:$x\n");exit(1);}}
          foreach(['责任分流，不扫描其他组件源码','已登记路径总数','路径与页面对象可用',' · 短代码 ',"<code>'.esc_html((string)$row['postType']).'</code>"] as $x){if(str_contains($page,$x)){fwrite(STDERR,"FAIL_VISIBLE_ENGINEERING:$x\n");exit(1);}}
          foreach(["$row['shortcode']","$row['postType']",'data-vf-pt-row','data-vf-pt-status'] as $x){if(!str_contains($page,$x)){fwrite(STDERR,"FAIL_INTERNAL:$x\n");exit(1);}}
          if(!str_contains($main,'Version: 1.21.857')||!str_contains($main,"VF_OPS_ROUND', 'S01-PAGES-TOOLS-HUMAN-CLOSURE'")){fwrite(STDERR,"FAIL_IDENTITY\n");exit(1);} echo "PASS_OPS_PAGES_TOOLS_HUMAN_CLOSURE\n";
          ''')
          PY
          php -l includes/views/admin-operations-console-pages.php >/dev/null
          php tests/pages-tools-human-closure-contract.php
          php tests/admin-human-language-contract.php
          php tests/dashboard-selector-hit-contract.php
          php tests/visible-console-v2-contract.php
          php tests/update-refresh-policy-current-contract.php
          git config user.name VictorForge; git config user.email llhzx2018@gmail.com
          git add -A
          git commit -m 'feat(S01-C02): pages and tools human language closure 1.21.857'
          git push -q origin HEAD:"$C02_BRANCH"
