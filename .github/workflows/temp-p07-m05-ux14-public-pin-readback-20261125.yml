name: TEMP P07-M05 UX14 post-merge anonymous toolbox + ZIP readback
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temp-p07-m05-ux14-public-pin-readback-20261125.yml
permissions:
  contents: read
jobs:
  p07-ux14-public-main:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.actor == 'llhzx2018' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'temp/p07-m05-ux14-public-pin-readback-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PIN_SOURCE_SHA: '7789eaf083bad6e3d0fce19982f930f30794e3e3'
      PIN_GIT_BLOB: '45b37be100fd1ac1f3b15e445829956dc33a5ba9'
      OLD_MAIN_SHA: 'b581c35589bb5b4af21116e6d4cc4735da50db0c'
      TARGET_ZIP_SHA: '8cca47f0a7bfed619daefe3074697f3837fc92c50103d218a12ca9149cd9d11d'
      TAG: 'p07-m05-v0.1.0-ux14-verified-pycache-20261125'
    steps:
      - name: Anonymous readback of actual current main installation command
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          root="$RUNNER_TEMP/p07-ux14-final-readback"
          mkdir -m 0700 "$root"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --retry 2 --max-time 90 \
            'https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/p07-toolbox.sh' \
            -o "$root/toolbox-current.sh"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --retry 2 --max-time 90 \
            "https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/$OLD_MAIN_SHA/installers/p07-toolbox.sh" \
            -o "$root/toolbox-previous.sh"
          test "$(git hash-object "$root/toolbox-current.sh")" = "$PIN_GIT_BLOB"
          grep -Fqx 'M05_BUILD_EXPECTED="0.1.0-m05-ux14-verified-pycache"' "$root/toolbox-current.sh"
          grep -Fqx 'M05_PREVIOUS_OFFICIAL_BUILD="0.1.0-m05-ux13-provider-neutral"' "$root/toolbox-current.sh"
          grep -Fqx 'M05_UPGRADE_FROM19="0.1.0-m05-ux12-apt-failstop"' "$root/toolbox-current.sh"
          grep -Fqx 'M05_BUNDLE_SHA256="8cca47f0a7bfed619daefe3074697f3837fc92c50103d218a12ca9149cd9d11d"' "$root/toolbox-current.sh"
          python3 -B - "$root" <<'PY'
          import pathlib,re,sys
          root=pathlib.Path(sys.argv[1])
          current=(root/"toolbox-current.sh").read_text("utf8")
          previous=(root/"toolbox-previous.sh").read_text("utf8")
          protected=re.compile(r"^(?:M0[1-4]_|VF_SERVER_OPS_|VF_NODE_|VPS_AUDIT_)")
          def pins(text):
              return [s for s in text.splitlines() if protected.match(s)]
          assert pins(current)==pins(previous), "non-M05 module pin changed"
          assert "M05_BUNDLE_URL=\"https://github.com/llhzx2018/core-free-runner-public/releases/download/p07-m05-v0.1.0-ux14-verified-pycache-20261125/P07-M05-0.1.0-m05-ux14-verified-pycache.zip\"" in current
          print("P07_M05_MAIN_RAW_ANONYMOUS_SCRIPT_BLOB=PASS")
          print("P07_M01_M04_PUBLIC_PINS_UNCHANGED=PASS")
          PY
      - name: Verify exact UX14 ZIP anonymously from currently pinned URL
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          root="$RUNNER_TEMP/p07-ux14-final-readback"
          url="https://github.com/llhzx2018/core-free-runner-public/releases/download/$TAG/P07-M05-0.1.0-m05-ux14-verified-pycache.zip"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --retry 2 --max-time 100 \
            "$url" -o "$root/p07-m05-ux14.zip"
          printf '%s  %s\n' "$TARGET_ZIP_SHA" "$root/p07-m05-ux14.zip" | sha256sum -c - >/dev/null
          test "$(unzip -p "$root/p07-m05-ux14.zip" p07-m05/BUILD_ID)" = "0.1.0-m05-ux14-verified-pycache"
          echo P07_M05_UX14_UNAUTHENTICATED_ASSET_SHA=PASS
          echo P07_M05_UX14_SINGLE_PUBLIC_INSTALL_ENTRY_READY=PASS
      - name: Remove temporary data
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- "$RUNNER_TEMP/p07-ux14-final-readback"
          echo P07_M05_READBACK_TEMP_CLEANUP=PASS
