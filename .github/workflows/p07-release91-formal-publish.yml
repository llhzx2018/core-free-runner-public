name: P07 release91 exact formal publication
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p07-release91-formal-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_REPO: llhzx2018/core-free-runner-public
      RELEASE_TAG: p07-v0.1.0-release91
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact merged bytes and fail-closed trust chain
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN" || { echo P07_RELEASE_WRITE_CAPABILITY_MISSING; exit 78; }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api repos/$RELEASE_REPO/git/ref/heads/main --jq '.object.sha')" = "$GITHUB_SHA" || { echo P07_MAIN_MOVED; exit 78; }
          root=dist/p07/0.1.0/overlay
          care=packages/p07-system-care/0.1.0-rc60
          test "$(cat "$root/BUILD_ID")" = '0.1.0-release91'
          test "$(cat "$care/VERSION")" = '0.1.0-rc60'
          test "$(git hash-object "$root/RUNTIME.gitblob")" = 44f75bb5da04c6b262c5c5b6f55d58a02b3241ea
          test "$(git hash-object "$root/MANIFEST.gitblob")" = 5233e4349a1d81cd3f34ea540d746b6c71bdfc72
          test "$(git hash-object "$care/MANIFEST.gitblob")" = cd81ad4d536f7045b8c932dd608b663b5fa89d53
          (cd "$root"; while read -r sha file; do test "$(git hash-object "$file")" = "$sha"; done < RUNTIME.gitblob)
          (cd "$root"; while read -r sha file; do test "$(git hash-object "$file")" = "$sha"; done < MANIFEST.gitblob)
          (cd "$care"; while read -r sha file; do test "$(git hash-object "$file")" = "$sha"; done < MANIFEST.gitblob)
          test "$(git hash-object installers/p07-final.sh)" = 579f2fecefb5521998c93c975dd375942a4aae09
          test "$(git hash-object installers/p07.sh)" = 6081938901de7d4208750e81a7dfd4ff59bc233d
          test "$(git hash-object installers/p07-toolbox.sh)" = a1c52196490e2ca9518e3d76622843d70283d944
          test "$(git hash-object installers/p07-system-care.sh)" = 6523e33e889ee606985e75f178943d8b7c7e2403
          grep -Fq 'EXPECTED_BLOB="579f2fecefb5521998c93c975dd375942a4aae09"' installers/p07.sh
          grep -Fq 'EXPECTED_BUILD_ID="0.1.0-release91"' installers/p07-final.sh
          grep -Fq 'RUNTIME_MANIFEST_BLOB="44f75bb5da04c6b262c5c5b6f55d58a02b3241ea"' installers/p07-final.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release91"' installers/p07-toolbox.sh
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc60"' installers/p07-toolbox.sh
          grep -Fq "MANIFEST_BLOB='cd81ad4d536f7045b8c932dd608b663b5fa89d53'" installers/p07-system-care.sh
          bash -n installers/p07.sh installers/p07-final.sh installers/p07-toolbox.sh installers/p07-system-care.sh
          echo P07_RELEASE91_EXACT_MERGED_PREFLIGHT_PASS
      - name: Formal GitHub release with exact target readback
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view "$RELEASE_TAG" -R "$RELEASE_REPO" >/dev/null 2>&1; then
            test "$(gh api repos/$RELEASE_REPO/git/ref/tags/$RELEASE_TAG --jq '.object.sha')" = "$GITHUB_SHA" || { echo P07_RELEASE_TAG_COLLISION; exit 81; }
          else
            gh release create "$RELEASE_TAG" -R "$RELEASE_REPO" --target "$GITHUB_SHA" \
              --title 'P07 · release91 · 正式网站数据工具与 System Care rc60' \
              --notes 'P07 release91 / System Care rc60. Exact private candidate 06af42e815c2f5366062e0b744add50d07742ddf; merged source main 7162efd6bf3379d4a63a9d6393835e1ca1f79d26 with identical Git tree. Registered Public Runner SQL verifier regression and fail-closed cases PASS; isolated clean install, release90 upgrade, idempotence, intentional corruption rejection and rollback PASS. Adds only fixed non-secret SQL verification failure codes without bypassing data checks. CP2 manual update and migration verification remain Owner-operated; this release does not change DNS or server data.'
          fi
          test "$(gh api repos/$RELEASE_REPO/git/ref/tags/$RELEASE_TAG --jq '.object.sha')" = "$GITHUB_SHA"
          test "$(gh api repos/$RELEASE_REPO/releases/tags/$RELEASE_TAG --jq '.target_commitish')" = "$GITHUB_SHA"
          test "$(gh api repos/$RELEASE_REPO/releases/tags/$RELEASE_TAG --jq '.draft')" = false
          test "$(gh api repos/$RELEASE_REPO/releases/tags/$RELEASE_TAG --jq '.prerelease')" = false
          echo P07_RELEASE91_GITHUB_RELEASE_PASS
      - name: Upload exact installer assets and read back identities
        shell: bash
        run: |
          set -Eeuo pipefail
          gh release upload "$RELEASE_TAG" -R "$RELEASE_REPO" --clobber installers/p07.sh installers/p07-final.sh installers/p07-toolbox.sh installers/p07-system-care.sh
          mkdir -p /tmp/p07-release91-assets
          gh release download "$RELEASE_TAG" -R "$RELEASE_REPO" --dir /tmp/p07-release91-assets
          for name in p07.sh p07-final.sh p07-toolbox.sh p07-system-care.sh; do
            test -f "/tmp/p07-release91-assets/$name"
            test "$(git hash-object "/tmp/p07-release91-assets/$name")" = "$(git hash-object "installers/$name")"
          done
          echo P07_RELEASE91_ASSET_READBACK_PASS
      - name: Public installer raw-byte distribution readback
        shell: bash
        run: |
          set -Eeuo pipefail
          remote="https://raw.githubusercontent.com/$RELEASE_REPO/$GITHUB_SHA"
          for item in 'installers/p07.sh 6081938901de7d4208750e81a7dfd4ff59bc233d' 'installers/p07-final.sh 579f2fecefb5521998c93c975dd375942a4aae09' 'installers/p07-toolbox.sh a1c52196490e2ca9518e3d76622843d70283d944' 'installers/p07-system-care.sh 6523e33e889ee606985e75f178943d8b7c7e2403' 'dist/p07/0.1.0/overlay/RUNTIME.gitblob 44f75bb5da04c6b262c5c5b6f55d58a02b3241ea'; do
            read -r file sha <<< "$item"
            curl -fsSL --retry 5 --retry-delay 2 --proto '=https' --tlsv1.2 "$remote/$file" -o /tmp/p07-release91-remote
            test "$(git hash-object /tmp/p07-release91-remote)" = "$sha"
          done
          echo P07_RELEASE91_REMOTE_DISTRIBUTION_READBACK_PASS
