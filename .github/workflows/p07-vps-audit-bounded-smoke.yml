name: P07 VPS audit bounded smoke
on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/p07-vps-audit-v225-r1.sh'
      - 'installers/p07-toolbox.sh'
      - '.github/workflows/p07-vps-audit-bounded-smoke.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Syntax and bounded identity
        shell: bash
        run: |
          set -Eeuo pipefail
          file='experiments/p07-vps-audit-v225-r1.sh'
          bash -n "$file"
          test "$(NO_COLOR=1 bash "$file" --build-id)" = '2.2.5-rc1-bounded-quick'
          test "$(NO_COLOR=1 bash "$file" --version | awk '{print $NF}')" = 'V2.2.5'
          NO_COLOR=1 bash "$file" --self-test | tee /tmp/p07-audit-self-test.txt
          grep -Fq 'P07_VPS_VALUE_VERDICT_SELF_TEST=PASS' /tmp/p07-audit-self-test.txt
          NO_COLOR=1 bash "$file" --color-demo | grep -Fq '服务器结论'
          test -z "$(grep -n 'NO_COLOR=1 bash "$BASE"' "$file" || true)"
          grep -Fq '最长 15 秒' "$file"
          grep -Fq '最长 12 秒' "$file"
          grep -Fq 'PROBE_FILE' "$file"
          printf 'VPS_AUDIT_SHA256=%s\n' "$(sha256sum "$file" | awk '{print $1}')"
      - name: Real minimal quick probe in disposable runner only
        shell: bash
        run: |
          set -Eeuo pipefail
          tmp="$(mktemp -d -t p07-vps-ci.XXXXXX)"
          trap 'rm -rf -- "$tmp"' EXIT
          start="$(date +%s)"
          set +e
          NO_COLOR=1 P07_BENCH_DIR="$tmp" timeout --signal=TERM --kill-after=2s 40s \
            bash experiments/p07-vps-audit-v225-r1.sh > "$tmp/output" 2>&1
          code=$?
          set -e
          test "$code" -eq 0 -o "$code" -eq 12
          cat "$tmp/output"
          grep -Eq '机器性能|当前机器正忙' "$tmp/output"
          test "$(( $(date +%s)-start ))" -le 40
          test -z "$(find "$tmp" -maxdepth 1 -name '.p07-quick*' -print -quit)"
          if [[ "$code" -eq 0 ]]; then
            grep -Fq '检测结束：' "$tmp/output"
            grep -Fq '4K ' "$tmp/output"
          fi
          echo 'P07_VPS_AUDIT_QUICK_TIMEOUT_AND_CLEANUP=PASS'
