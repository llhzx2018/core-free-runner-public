name: R80 Focused Software Platform Total Gate
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r80-software-platform-total.yml'

permissions:
  contents: read

jobs:
  r80-focused-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: 03efbd9cfcf39dd4439998480e515a456dfacd58
    steps:
      - name: Checkout exact private P01 candidate transiently
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: 03efbd9cfcf39dd4439998480e515a456dfacd58
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p01-source
          fetch-depth: 1
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_sqlite,sqlite3,curl
          coverage: none

      - name: Exact source and focused contract
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p01-source
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(cat VERSION)" = '2.47.0'
          php -l src/app/SoftwareWorkspaceHome.php
          php -l tests/unit/software_platform_total_contract.php
          php tests/unit/software_platform_total_contract.php
          echo R80_SOFTWARE_PLATFORM_TOTAL_PASS
          echo R80_EXACT_CANDIDATE_GATE_PASS

      - name: Cleanup transient private source
        if: always()
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/p01-source"
