name: R80 Focused Software Platform Total Gate
on:
  pull_request:
    paths:
      - '.github/workflows/r80-software-platform-total.yml'

permissions:
  contents: read

jobs:
  r80-focused-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact private P01 candidate transiently
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: 03efbd9cfcf39dd4439998480e515a456dfacd58
          token: ${{ secrets.CORE_PRIVATE_READONLY_TOKEN }}
          path: p01-source
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Exact source and focused contract
        shell: bash
        run: |
          set -euo pipefail
          cd p01-source
          test "$(git rev-parse HEAD)" = "03efbd9cfcf39dd4439998480e515a456dfacd58"
          test "$(tr -d '\r\n' < VERSION)" = "2.47.0"
          php -l src/app/SoftwareWorkspaceHome.php
          php tests/unit/software_platform_total_contract.php
          echo "R80_EXACT_CANDIDATE_GATE_PASS=03efbd9cfcf39dd4439998480e515a456dfacd58"

      - name: Cleanup transient private source
        if: always()
        shell: bash
        run: rm -rf p01-source
