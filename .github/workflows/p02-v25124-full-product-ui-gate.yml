name: P02 V2.5.124 Full Product UI Closure Gate

on:
  push:
    branches:
      - run/p02-v25124-full-product-ui-closure-20260926
    paths:
      - '.github/workflows/p02-v25124-full-product-ui-gate.yml'
      - 'requests/p02-v25124-full-product-ui.sh'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout runner carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner

      - name: Checkout exact P02 V2.5.124 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: cdf9edc79b6c933a7f004f6255ef441498d3bbae
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product

      - name: Install runtime
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-zip sqlite3 unzip curl jq
          cd product
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Exact-source and full-product inventory contracts
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "cdf9edc79b6c933a7f004f6255ef441498d3bbae"
          test "$(git show -s --format=%T HEAD)" = "edbce522bf511a69b910b7570050f1220548478f"
          test "$(cat VERSION)" = "2.5.124"
          python3 scripts/generate-source-manifest.py
          git diff --exit-code -- SOURCE_MANIFEST.json SOURCE_MANIFEST.txt
          python3 scripts/verify-source-manifest.py
          bash scripts/verify-repository.sh
          node tests/unit/p02_v25124_settings_functional_content_closure.mjs
          node tests/unit/p02_v25124_full_product_surface_inventory.mjs
          echo P02_V25124_FULL_PRODUCT_SOURCE_CONTRACT=PASS

      - name: Full-product browser matrix
        run: |
          set -Eeuo pipefail
          bash runner/requests/p02-v25124-full-product-ui.sh

      - name: Closure marker
        run: |
          cat <<'EOF'
          TESTING=PASS
          DATA_SCHEMA=PASS
          GIT=PASS
          UI_SETTINGS=PASS
          UI_FULL_PRODUCT=PASS
          HIDDEN_CURRENT=0
          HIDDEN_DISCOVERABLE_COMPAT=0
          VISUALLY_UNMANAGED_DISCOVERABLE=0
          RELEASE=N_A_NOT_AUTHORIZED
          PRODUCTION=N_A_NOT_AUTHORIZED
          P02_V25124_FULL_PRODUCT_UI_CLOSURE_GATE=PASS
          EOF
