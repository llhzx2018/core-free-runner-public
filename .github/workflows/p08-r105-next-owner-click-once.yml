name: P08 R105 0.1.2 Owner clicked next official path (disposable)
on:
  pull_request:
    paths:
      - .github/workflows/p08-r105-next-owner-click-once.yml
permissions:
  contents: read
jobs:
  owner-next:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    env:
      GITHUB_ACTIONS: "true"
      P08_ISOLATED_INSTALL_TEST: "YES"
      P08_R105_DISPOSABLE: "YES"
      P08_R105_REAL_FULL_ISOLATED: "YES"
      P08_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Transient pinned P08 private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: e3985f1e8fd99d95533b7bfc3610aedda52d7b90
          path: p08-private
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: PHP 8.4 for genuine native SQLite + official Laravel vendor
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mbstring, zip, sqlite3, pdo_sqlite, fileinfo, curl
      - name: Exact source PHP syntax and no-next/source forgery regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C p08-private rev-parse HEAD)" = "e3985f1e8fd99d95533b7bfc3610aedda52d7b90"
          test "$(cat p08-private/VERSION)" = "0.1.2"
          for file in \
            src/Upgrade/R105OfficialNextRelease.php \
            src/Upgrade/R105NextReleaseIntake.php \
            src/Upgrade/GitHubStableReleaseGate.php \
            src/Upgrade/GitHubStableAssetDownloader.php \
            src/Upgrade/GitHubVerifiedCandidatePreparation.php \
            src/Upgrade/OwnerUpgradeJob.php \
            src/Upgrade/OwnerUpgradePreparation.php \
            src/Upgrade/UpgradeReadiness.php \
            app/Http/Controllers/OwnerReleaseDiscoveryController.php \
            app/Http/Controllers/OwnerUpgradeController.php \
            tests/compatibility/r105_official_next_release.php \
            tests/compatibility/r105_official_next_owner_click.php \
            tests/test_owner_upgrade_preparation.php \
            tests/test_official_github_sha256_job.php; do
            php -l "p08-private/$file" > "$RUNNER_TEMP/p08-r105-next-lint.log" 2>&1 \
              || { echo R105_NEXT_PHP84_LINT=FAIL; exit 1; }
          done
          for file in \
            tests/compatibility/r105_official_next_release.php \
            tests/test_owner_upgrade_preparation.php \
            tests/test_official_github_sha256_job.php \
            tests/test_github_stable_asset_downloader.php; do
            if ! php "p08-private/$file" > "$RUNNER_TEMP/p08-r105-next-unit.log" 2>&1; then
              echo "R105_NEXT_LEGACY_CASE_FAILED=$(basename "$file")"
              grep -Eo 'R[0-9]{2,3}_[A-Z0-9_]+|P08_[A-Z0-9_]+' "$RUNNER_TEMP/p08-r105-next-unit.log" | sort -u | tail -n 5 || true
              exit 1
            fi
            echo "R105_NEXT_LEGACY_$(basename "$file")=PASS"
          done
          echo R105_NEXT_PHP84_AND_LEGACY_BACKWARDS_COMPAT=PASS
      - name: Genuine official v0.1.2 FULL -> synthetic next UPDATE -> Owner prepare/execute/worker
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test -n "$P08_PRIVATE_READ_TOKEN"
          site="$RUNNER_TEMP/p08-r105-real-full-owner-013"
          target="$RUNNER_TEMP/p08-r105-next-synthetic-runtime"
          mkdir -m 0700 "$site" "$target"
          curl --fail --location --silent --show-error --max-time 90 \
            --header "Authorization: Bearer $P08_PRIVATE_READ_TOKEN" \
            --header "Accept: application/octet-stream" \
            "https://api.github.com/repos/llhzx2018/vf-adops/releases/assets/747260263" \
            --output "$RUNNER_TEMP/p08-r105-next-official.zip"
          test "$(wc -c < "$RUNNER_TEMP/p08-r105-next-official.zip")" = 10390070
          echo "1b3d7fc3743fb44af12c0b50905a65ea68d47c80f0e1e2ddc5e03c08d534b081  $RUNNER_TEMP/p08-r105-next-official.zip" | sha256sum -c --status
          for dir in "$site" "$target"; do
            unzip -q "$RUNNER_TEMP/p08-r105-next-official.zip" -d "$dir"
            test "$(cat "$dir/VERSION")" = "0.1.2"
            echo "fd15c721b12e524ffe747606172eb9f21dc98809bbb8c0430f1b4b586ca09233  $dir/FULL_MANIFEST.json" | sha256sum -c --status
          done
          printf '0.1.3\n' > "$target/VERSION"
          fakeSha="$(printf %s 'P08-R105-CI-NO-RELEASE-e3985f1e8fd99d95533b7bfc3610aedda52d7b90' | sha256sum | cut -c1-40)"
          python3 p08-private/scripts/build_atomic.py \
            --source "$target" \
            --output "$RUNNER_TEMP/p08-r105-next-unissued.zip" \
            --source-version 0.1.2 \
            --source-sha 7f7218abfa13ba232d1afd13f10df29da29dd21a \
            --source-full-manifest-sha256 fd15c721b12e524ffe747606172eb9f21dc98809bbb8c0430f1b4b586ca09233 \
            --target-version 0.1.3 --target-sha "$fakeSha" \
            > "$RUNNER_TEMP/p08-r105-next-build-receipt.json"
          if ! php p08-private/tests/compatibility/r105_official_next_owner_click.php \
            "$site" "$RUNNER_TEMP/p08-r105-next-unissued.zip" "$fakeSha" \
            > "$RUNNER_TEMP/p08-r105-next-owner.log" 2>&1; then
            echo R105_NEXT_OWNER_PREPARE_EXECUTE=FAIL
            # The fixture emits only bounded status markers and sanitized
            # uppercase failure codes; no stack, path or credential.
            grep -E '^R105_NEXT_OWNER_(CHECK_ONLY_NO_APPLY|CLI_OFFICIAL_ASSET_NATIVE_BACKUP_PREPARED|AUTH_INTENT_SEPARATE_CLI_ATOMIC|FAILURE)=' "$RUNNER_TEMP/p08-r105-next-owner.log" | tail -n 5 || true
            exit 1
          fi
          grep -Fxq R105_NEXT_OWNER_CHECK_ONLY_NO_APPLY=PASS "$RUNNER_TEMP/p08-r105-next-owner.log"
          grep -Fxq R105_NEXT_OWNER_CLI_OFFICIAL_ASSET_NATIVE_BACKUP_PREPARED=PASS "$RUNNER_TEMP/p08-r105-next-owner.log"
          grep -Fxq R105_NEXT_OWNER_AUTH_INTENT_SEPARATE_CLI_ATOMIC=PASS "$RUNNER_TEMP/p08-r105-next-owner.log"
          grep -Fxq R105_NEXT_OWNER_SYNTHETIC_UNISSUED_RELEASE=NOT_OFFICIAL "$RUNNER_TEMP/p08-r105-next-owner.log"
          echo R105_NEXT_OFFICIAL_SOURCE_OWNER_CLI_FULL_CHAIN_ISOLATED=PASS
          echo R105_NEXT_OFFICIAL_GITHUB_RELEASE_AND_CHROMIUM=NOT_PROVEN
      - name: Always delete private code, test Owner data, backup, ZIP, logs
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- p08-private "$RUNNER_TEMP"/p08-r105-real-full-owner-* "$RUNNER_TEMP"/p08-r105-next-synthetic-runtime
          rm -f -- "$RUNNER_TEMP"/p08-r105-next-*.zip "$RUNNER_TEMP"/p08-r105-next-*.log "$RUNNER_TEMP"/p08-r105-next-build-receipt.json
          echo R105_NEXT_PRIVATE_SOURCE_AND_OWNER_TEST_SITE_CLEANED=YES
