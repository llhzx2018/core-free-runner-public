name: S01 R10 exact core updates manifest native checks
on:
  push:
    branches: [task/s01-r10-candidate-20261013]
    paths: [.github/workflows/s01-r10-channel-preflight-20261013.yml]
permissions:
  contents: read
jobs:
  update-channel-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: 10f1e29097229f7e1e7263a1e25dd609be8198b3
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-channel
      - name: Run original canonical core-updates CI commands
        run: |
          set -Eeuo pipefail
          test "$(git -C private-channel rev-parse HEAD)" = 10f1e29097229f7e1e7263a1e25dd609be8198b3
          cd private-channel
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l > /tmp/s01-r10-php-lint.txt
          php update-core/php/tests/run.php
          echo S01_R10_CORE_UPDATES_ORIGINAL_TESTS_PASS
      - name: Reverse-check public release files against both manifests
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p receipts
          gh release download v1.25.90 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.90.zip --dir receipts
          gh release download v1.35.112 --repo llhzx2018/vf-tools-theme --pattern vf-tools-theme_V1.35.112.zip --dir receipts
          python3 - <<'PY'
          import json,hashlib,pathlib,zipfile
          for comp in ['S01-C03','S01-C01']:
           m=json.loads((pathlib.Path('private-channel/projects')/(comp+'.json')).read_text())
           data=(pathlib.Path('receipts')/m['asset_name']).read_bytes()
           assert hashlib.sha256(data).hexdigest()==m['asset_sha256']
           assert len(data)==m['asset_bytes']
           assert m['target_version'] in m['release_tag'] and m['enabled']
           with zipfile.ZipFile(pathlib.Path('receipts')/m['asset_name']) as z:
            assert z.testzip() is None
            assert len(z.namelist())==m['runtime_files']
           print('EXACT_CHANNEL_ASSET_'+comp+'_PASS')
          print('S01_R10_CHANNEL_CANDIDATE_REMOTE_ASSETS_PASS')
          PY
      - name: Cleanup private channel and release ZIPs
        if: always()
        run: rm -rf private-channel receipts /tmp/s01-r10-php-lint.txt
