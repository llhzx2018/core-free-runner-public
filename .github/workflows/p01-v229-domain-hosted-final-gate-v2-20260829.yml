name: P01 V2.29 Resource Domain Final Gate V2

on:
  push:
    branches:
      - task/p01-v229-domain-hosted-final-gate-v2-20260829

permissions:
  contents: read

env:
  SOURCE_SHA: a6b8d47064ce06fa2cf8b8003ba15e25a83666d2
  ROOT: /tmp/p01-v229-final-v2
  PORT: '18440'
  ADMIN_PASS: 'P01FinalV2!2026'

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none

      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: source

      - name: Exact source fresh runtime and legacy migration
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' < source/VERSION)" = '2.29.0'
          grep -F "define('VF_VERSION', '2.29.0');" source/src/app/bootstrap.php
          grep -F "'version' => '2026082901'" source/src/migrations/2026082901_v229_resource_domains.php
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find source/src -type f -name '*.php' -print0)
          node --check source/src/assets/workspace.js
          node --check source/src/assets/workspace-rebaseline.js
          cat >/tmp/p01-v2-migration.php <<'PHP'
          <?php
          declare(strict_types=1);
          $db=new PDO('sqlite::memory:');$db->setAttribute(PDO::ATTR_ERRMODE,PDO::ERRMODE_EXCEPTION);$db->exec('PRAGMA foreign_keys=ON');
          $db->exec('CREATE TABLE links(id INTEGER PRIMARY KEY)');
          $db->exec("CREATE TABLE resource_surface_profiles(link_id INTEGER PRIMARY KEY,surface TEXT NOT NULL,resource_kind TEXT NOT NULL DEFAULT '',note TEXT NOT NULL DEFAULT '',background_friendly INTEGER NOT NULL DEFAULT 0,media_year INTEGER,media_status TEXT NOT NULL DEFAULT '',last_opened_at TEXT NOT NULL DEFAULT '',created_at TEXT NOT NULL,updated_at TEXT NOT NULL,FOREIGN KEY(link_id) REFERENCES links(id) ON DELETE CASCADE)");
          $db->exec("INSERT INTO links(id) VALUES(7)");
          $db->exec("INSERT INTO resource_surface_profiles(link_id,surface,resource_kind,note,background_friendly,media_year,media_status,last_opened_at,created_at,updated_at) VALUES(7,'channels','旅行生活','legacy',1,NULL,'','','2026-01-01T00:00:00Z','2026-01-01T00:00:00Z')");
          $m=include getenv('SRC').'/src/migrations/2026082901_v229_resource_domains.php';($m['up'])($db);
          $r=$db->query('SELECT * FROM resource_domain_profiles WHERE link_id=7')->fetch(PDO::FETCH_ASSOC);if(!$r||$r['domain_key']!=='channels'||$r['resource_kind']!=='旅行生活'||(int)$r['background_friendly']!==1)throw new RuntimeException('legacy');
          if((int)$db->query("SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='resource_asset_files'")->fetchColumn()!==1)throw new RuntimeException('asset table');
          echo "P01_V2_LEGACY=PASS\n";
          PHP
          SRC="$PWD/source" php /tmp/p01-v2-migration.php | grep -Fx P01_V2_LEGACY=PASS
          rm -rf "$ROOT" /tmp/p01-v2-* || true
          cp -a source/src "$ROOT"
          php -d display_errors=1 -d log_errors=1 -d error_reporting=E_ALL -S "127.0.0.1:${PORT}" -t "$ROOT" >/tmp/p01-v2-server.log 2>&1 &
          echo $! >/tmp/p01-v2-server.pid
          COOKIE=/tmp/p01-v2-setup.cookies
          for i in $(seq 1 30); do curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:${PORT}/setup.php" -o /tmp/p01-v2-setup.html && break || sleep 1; done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-v2-setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:${PORT}/setup.php" --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=P01 Final V2' --data-urlencode "admin_password=$ADMIN_PASS" --data-urlencode "admin_password_confirm=$ADMIN_PASS" -o /tmp/p01-v2-setup-post.html
          php "$ROOT/cli/verify.php" | tee /tmp/p01-v2-verify.txt | grep -Fx VERIFY_PASS=YES
          echo P01_V2_FRESH=PASS

      - name: Seed and domain privacy favicon truth
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/p01-v2-seed.php <<'PHP'
          <?php
          declare(strict_types=1);
          $root=getenv('ROOT');require $root.'/app/bootstrap.php';require_once $root.'/app/SurfaceRepository.php';
          $r=new VfRepository(vf_db());$s=new VfSurfaceRepository(vf_db());$db=vf_db();
          $pub=$r->createCategory(['name'=>'公开网址','is_private'=>false]);$priv=$r->createCategory(['name'=>'私人网址','is_private'=>true]);
          $save=function(string $t,string $u,int $c,bool $p=false)use($r):int{return (int)$r->saveLink(null,['category_id'=>$c,'title'=>$t,'url'=>$u,'description'=>'gate','is_private'=>$p],'manual')['id'];};
          $start=$save('导航 Favicon','https://nav-v2.example.com',$pub,false);$startHidden=$save('导航 私人分类','https://hidden-v2.example.com',$priv,false);
          $channel=$save('频道 旅行生活','https://channel-v2.example.com',$priv,false);$s->upsertProfile($channel,['surface'=>'channels','resource_kind'=>'旅行生活']);
          $watch=$save('影视 电影','https://watch-v2.example.com',$priv,false);$s->upsertProfile($watch,['surface'=>'watch','resource_kind'=>'电影','media_year'=>'2026']);
          $remote=$save('专题 远程研究','https://remote-v2.example.com',$priv,false);$s->upsertProfile($remote,['surface'=>'topics','resource_kind'=>'研究','source_kind'=>'remote_url']);
          $private=$save('频道 私人','https://private-v2.example.com',$pub,true);$s->upsertProfile($private,['surface'=>'channels','resource_kind'=>'私人']);
          if(!is_dir(VF_USER_ICON_DIR))mkdir(VF_USER_ICON_DIR,0750,true);$f='v2-favicon.png';$png=base64_decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=');file_put_contents(VF_USER_ICON_DIR.'/'.$f,$png);$h=hash('sha256',$png);$q=$db->prepare('INSERT INTO user_link_icons(link_id,file_name,file_hash,mime_type,byte_size,width,height,updated_at) VALUES(?,?,?,?,?,?,?,?)');$q->execute([$start,$f,$h,'image/png',strlen($png),1,1,gmdate('c')]);
          $admin=$s->allAssets(true);$a=[];foreach($admin as $x)$a[(int)$x['id']]=$x;foreach([$channel,$watch,$remote] as $id)if((int)($a[$id]['effective_private']??1)!==0)throw new RuntimeException('effective privacy');if(($a[$start]['icon_cache_status']??'')!=='user')throw new RuntimeException('favicon');
          $public=$s->allAssets(false);$p=[];foreach($public as $x)$p[(int)$x['id']]=$x;foreach([$start,$channel,$watch,$remote] as $id)if(!isset($p[$id]))throw new RuntimeException('public missing');foreach([$startHidden,$private] as $id)if(isset($p[$id]))throw new RuntimeException('private leak');
          file_put_contents('/tmp/p01-v2-fixture.json',json_encode(compact('pub','priv','remote'),JSON_UNESCAPED_SLASHES));echo "P01_V2_SEED=PASS\n";
          PHP
          ROOT="$ROOT" php /tmp/p01-v2-seed.php | grep -Fx P01_V2_SEED=PASS
          COOKIE=/tmp/p01-v2-admin.cookies;LOGIN=$(curl -fsS -c "$COOKIE" -b "$COOKIE" -H 'Content-Type: application/json' -X POST "http://127.0.0.1:${PORT}/api.php?action=login" --data "{\"password\":\"$ADMIN_PASS\"}");jq -e '.ok==true' <<<"$LOGIN" >/dev/null
          PRIV=$(jq -r '.priv' /tmp/p01-v2-fixture.json);REMOTE=$(jq -r '.remote' /tmp/p01-v2-fixture.json)
          curl -fsS -b "$COOKIE" "http://127.0.0.1:${PORT}/channels.php?category=${PRIV}&scope=public" -o /tmp/v2-channels.html;grep -F '频道分类' /tmp/v2-channels.html;grep -F '频道 旅行生活' /tmp/v2-channels.html
          curl -fsS -b "$COOKIE" "http://127.0.0.1:${PORT}/watch.php?category=${PRIV}&scope=public" -o /tmp/v2-watch.html;grep -F '内容类型' /tmp/v2-watch.html;grep -F '影视 电影' /tmp/v2-watch.html
          curl -fsS -b "$COOKIE" "http://127.0.0.1:${PORT}/topics.php?category=${PRIV}&scope=public" -o /tmp/v2-topics.html;grep -F '专题分类' /tmp/v2-topics.html;grep -F '专题 远程研究' /tmp/v2-topics.html
          CODE=$(curl -sS -D /tmp/v2-remote.headers -o /dev/null -w '%{http_code}' -b "$COOKIE" "http://127.0.0.1:${PORT}/surface-open.php?id=${REMOTE}");test "$CODE" = 302;grep -Fi 'Location: https://remote-v2.example.com' /tmp/v2-remote.headers
          echo P01_V2_DOMAIN_PRIVACY=PASS

      - name: Browser cover hosted HTML sandbox and mobile
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os,struct,zlib
          w,h=1600,1000;raw=bytearray()
          for _ in range(h):raw.extend(b'\x00'+os.urandom(w*3))
          def chunk(t,d):return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
          png=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(bytes(raw),6))+chunk(b'IEND',b'');open('/tmp/p01-v2-large.png','wb').write(png);print(len(png))
          PY
          cat >/tmp/p01-v2-public.html <<'HTML'
          <!doctype html><meta charset="utf-8"><h1>HOSTED_V2_MARKER</h1><script>document.body.dataset.ran='yes';try{localStorage.setItem('x','1');document.body.dataset.storage='allowed'}catch(e){document.body.dataset.storage='blocked'};fetch('/api.php?action=health').then(()=>document.body.dataset.fetch='allowed').catch(()=>document.body.dataset.fetch='blocked');</script>
          HTML
          cat >/tmp/p01-v2-private.html <<'HTML'
          <!doctype html><meta charset="utf-8"><h1>PRIVATE_V2_MARKER</h1>
          HTML
          mkdir -p /tmp/p01-v2-browser && cd /tmp/p01-v2-browser;npm init -y >/dev/null 2>&1;npm install playwright@1.55.0 --no-save >/dev/null 2>&1;npx playwright install chromium >/dev/null 2>&1
          cat >gate.mjs <<'JS'
          import { chromium } from 'playwright';
          const base='http://127.0.0.1:18440',browser=await chromium.launch({headless:true}),ctx=await browser.newContext({viewport:{width:1440,height:900}});const login=await ctx.request.post(base+'/api.php?action=login',{data:{password:'P01FinalV2!2026'}});if(!login.ok())throw new Error('login');const p=await ctx.newPage();
          await p.goto(base+'/topics.php?scope=public',{waitUntil:'networkidle'});if(await p.getByText('专题 远程研究',{exact:true}).count()<1)throw new Error('public scope');await p.locator('[data-open-add]').click();let f=p.locator('[data-add-form]');await f.locator('select[name="source_kind"]').selectOption('hosted_html');if(await f.locator('[data-url-field]').isVisible())throw new Error('url visible');if(!(await f.locator('[data-html-field]').isVisible()))throw new Error('html hidden');if(await f.locator('input[name="url"]').getAttribute('required')!==null)throw new Error('url required');await f.locator('input[name="title"]').fill('专题 托管公开');await f.locator('input[name="resource_kind"]').fill('AI学习');await f.locator('input[name="is_private"]').uncheck();await f.locator('input[name="cover"]').setInputFiles('/tmp/p01-v2-large.png');await f.locator('input[name="html"]').setInputFiles('/tmp/p01-v2-public.html');await f.locator('button[type="submit"]:not([data-add-continue])').click();await p.getByText('专题 托管公开',{exact:true}).waitFor({timeout:15000});
          const card=p.locator('.vf-topic-card').filter({hasText:'专题 托管公开'});if(await card.count()!==1)throw new Error('card');const id=await card.getAttribute('data-asset-row');if(!id)throw new Error('id');if(!String(await card.locator('.vf-topic-cover img').getAttribute('src')).includes('resource-cover.php'))throw new Error('cover');await card.locator('[data-edit-id]').first().click();const d=p.locator('[data-detail-form]');if(await d.locator('select[name="source_kind"]').inputValue()!=='hosted_html')throw new Error('detail source');if(await d.locator('[data-url-field]').isVisible())throw new Error('detail url');if(!(await d.locator('[data-html-status]').textContent()).includes('p01-v2-public.html'))throw new Error('html status');await p.screenshot({path:'/tmp/p01-v229-final-v2-topics.png',fullPage:true});await p.locator('[data-close-panel]').first().click();
          const hosted=await ctx.newPage();await hosted.goto(base+'/resource-html.php?id='+id,{waitUntil:'load'});await hosted.getByText('HOSTED_V2_MARKER',{exact:true}).waitFor();await hosted.waitForTimeout(250);if(await hosted.locator('body').getAttribute('data-ran')!=='yes')throw new Error('script did not run');if(await hosted.locator('body').getAttribute('data-storage')!=='blocked')throw new Error('storage not isolated');if(await hosted.locator('body').getAttribute('data-fetch')!=='blocked')throw new Error('fetch not isolated');await hosted.screenshot({path:'/tmp/p01-v229-final-v2-hosted.png'});await hosted.close();
          await p.goto(base+'/topics.php',{waitUntil:'networkidle'});await p.locator('[data-open-add]').click();f=p.locator('[data-add-form]');await f.locator('select[name="source_kind"]').selectOption('hosted_html');await f.locator('input[name="title"]').fill('专题 托管私人');await f.locator('input[name="resource_kind"]').fill('私人');await f.locator('input[name="html"]').setInputFiles('/tmp/p01-v2-private.html');await f.locator('button[type="submit"]:not([data-add-continue])').click();await p.getByText('专题 托管私人',{exact:true}).waitFor({timeout:15000});
          await p.setViewportSize({width:390,height:844});await p.goto(base+'/topics.php?scope=public',{waitUntil:'networkidle'});await p.locator('[data-open-add]').click();f=p.locator('[data-add-form]');await f.locator('select[name="source_kind"]').selectOption('hosted_html');if(await f.locator('[data-url-field]').isVisible()||!(await f.locator('[data-html-field]').isVisible()))throw new Error('mobile source fields');const overflow=await p.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);if(overflow>1)throw new Error('mobile overflow '+overflow);await p.screenshot({path:'/tmp/p01-v229-final-v2-mobile.png',fullPage:true});await browser.close();console.log('P01_V2_BROWSER=PASS');
          JS
          node gate.mjs | grep -Fx P01_V2_BROWSER=PASS

      - name: Storage CSP size and integrity
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/p01-v2-db.php <<'PHP'
          <?php
          declare(strict_types=1);$root=getenv('ROOT');require $root.'/app/bootstrap.php';$db=vf_db();
          $pub=$db->query("SELECT l.id,p.source_kind,p.source_ref FROM links l JOIN resource_domain_profiles p ON p.link_id=l.id WHERE l.title='专题 托管公开'")->fetch(PDO::FETCH_ASSOC);$priv=$db->query("SELECT l.id FROM links l JOIN resource_domain_profiles p ON p.link_id=l.id WHERE l.title='专题 托管私人' AND p.source_kind='hosted_html'")->fetch(PDO::FETCH_ASSOC);if(!$pub||!$priv||$pub['source_kind']!=='hosted_html'||$pub['source_ref']!=='p01-v2-public.html')throw new RuntimeException('profiles');
          $cover=$db->query("SELECT r.* FROM resource_asset_files r JOIN links l ON l.id=r.link_id WHERE l.title='专题 托管公开' AND r.asset_kind='cover'")->fetch(PDO::FETCH_ASSOC);if(!$cover||(int)$cover['byte_size']>1200*1024||(int)$cover['width']>960||(int)$cover['height']>960||!in_array($cover['mime_type'],['image/webp','image/jpeg'],true))throw new RuntimeException('cover compression');
          $html=$db->query("SELECT r.* FROM resource_asset_files r JOIN links l ON l.id=r.link_id WHERE l.title='专题 托管公开' AND r.asset_kind='html'")->fetch(PDO::FETCH_ASSOC);if(!$html||$html['original_name']!=='p01-v2-public.html'||(int)$html['byte_size']>2*1024*1024)throw new RuntimeException('html metadata');
          $path='';foreach($db->query('PRAGMA database_list')->fetchAll(PDO::FETCH_ASSOC) as $x)if($x['name']==='main')$path=$x['file'];if($path===''||str_contains((string)file_get_contents($path),'HOSTED_V2_MARKER'))throw new RuntimeException('raw html in db');if((string)$db->query('PRAGMA integrity_check')->fetchColumn()!=='ok'||$db->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC))throw new RuntimeException('db');file_put_contents('/tmp/p01-v2-hosted.json',json_encode(['pub'=>(int)$pub['id'],'priv'=>(int)$priv['id']]));echo "P01_V2_DB=PASS\n";
          PHP
          ROOT="$ROOT" php /tmp/p01-v2-db.php | grep -Fx P01_V2_DB=PASS
          PUB=$(jq -r '.pub' /tmp/p01-v2-hosted.json);PRIV=$(jq -r '.priv' /tmp/p01-v2-hosted.json)
          CODE=$(curl -sS -D /tmp/p01-v2-hosted.headers -o /tmp/p01-v2-hosted.html -w '%{http_code}' "http://127.0.0.1:${PORT}/resource-html.php?id=${PUB}");test "$CODE" = 200;grep -F HOSTED_V2_MARKER /tmp/p01-v2-hosted.html;CSP=$(grep -i '^Content-Security-Policy:' /tmp/p01-v2-hosted.headers);grep -F 'sandbox allow-scripts' <<<"$CSP";grep -F "connect-src 'none'" <<<"$CSP";grep -F "form-action 'none'" <<<"$CSP";! grep -Fq 'allow-same-origin' <<<"$CSP"
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:${PORT}/resource-html.php?id=${PRIV}");test "$CODE" = 404
          COOKIE=/tmp/p01-v2-open.cookies;LOGIN=$(curl -fsS -c "$COOKIE" -b "$COOKIE" -H 'Content-Type: application/json' -X POST "http://127.0.0.1:${PORT}/api.php?action=login" --data "{\"password\":\"$ADMIN_PASS\"}");CSRF=$(jq -r '.csrf' <<<"$LOGIN");CODE=$(curl -sS -D /tmp/p01-v2-open.headers -o /dev/null -w '%{http_code}' -b "$COOKIE" "http://127.0.0.1:${PORT}/surface-open.php?id=${PUB}");test "$CODE" = 302;grep -Fi "Location: resource-html.php?id=${PUB}" /tmp/p01-v2-open.headers
          python3 - <<'PY'
          open('/tmp/p01-v2-big.html','wb').write(b'<html>'+b'x'*(2*1024*1024+100)+b'</html>')
          PY
          CODE=$(curl -sS -o /tmp/p01-v2-big.json -w '%{http_code}' -b "$COOKIE" -X POST "http://127.0.0.1:${PORT}/resource-media.php" -F "csrf=$CSRF" -F 'action=html_upload' -F "id=$PUB" -F 'html=@/tmp/p01-v2-big.html;type=text/html');test "$CODE" = 422;jq -e '.ok==false and (.error|contains("2 MB"))' /tmp/p01-v2-big.json >/dev/null
          php "$ROOT/cli/verify.php" | tee /tmp/p01-v2-verify-end.txt | grep -Fx VERIFY_PASS=YES
          echo P01_V2_SECURITY_STORAGE=PASS

      - name: Final verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "SOURCE_SHA=$SOURCE_SHA"
          echo 'SCHEMA=2026082901'
          echo 'FAVICON=PASS'
          echo 'COVER_BROWSER_COMPRESSION=PASS'
          echo 'DOMAIN_PRIVACY=PASS'
          echo 'HOSTED_HTML_SANDBOX=PASS'
          echo 'MOBILE=PASS'
          echo 'VERIFY_PASS=YES'
          echo 'PRODUCTION_WRITE=NO'
          echo 'P01_V229_RESOURCE_DOMAIN_FINAL_V2=PASS'

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: p01-v229-resource-domain-final-v2
          path: |
            /tmp/p01-v229-final-v2-topics.png
            /tmp/p01-v229-final-v2-hosted.png
            /tmp/p01-v229-final-v2-mobile.png
            /tmp/p01-v2-hosted.headers
            /tmp/p01-v2-verify.txt
            /tmp/p01-v2-verify-end.txt
          retention-days: 30
