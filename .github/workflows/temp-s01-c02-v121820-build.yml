          git commit -m 'fix(S01-C02): align Candidate preflight authority'
          test "$(git rev-list --count 00bc49b070485c6095a3b5bd3337b3fcc23d42f5..HEAD)" = '1'
          git push origin HEAD:refs/heads/fix/s01-candidate-preflight-authority-v121820
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)"
