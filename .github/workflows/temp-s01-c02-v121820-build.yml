name: TEMP S01-C02 v1.21.820 Build Candidate
on:
  push:
    branches: [temp/s01-c02-v121820-preflight-authority-scan-20260905]
    paths:
      - '.github/workflows/temp-s01-c02-v121820-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout runner scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: temp/s01-c02-v121820-preflight-authority-scan-20260905
          persist-credentials: false
          path: runner
      - name: Checkout exact Ops 1.21.819 with write token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 00bc49b070485c6095a3b5bd3337b3fcc23d42f5
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: ops
      - name: Build and push exact candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd ops
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git switch -c fix/s01-candidate-preflight-authority-v121820
          python3 ../runner/.github/scripts/temp-s01-c02-v121820-build.py
          test "$(cat VERSION)" = '1.21.820'
          grep -q 'Version: 1.21.820' vf-ops.php
          grep -q "VF_OPS_VERSION', '1.21.820" vf-ops.php
          php -l includes/publish-o10/publish-preflight-product.php
          php -l includes/publish-o10/publish-zip-product.php
          php -l includes/publish-o10/publish-release-orchestrator.php
          php .github/phase3/v121820-candidate-preflight-authority.php
          git diff --check
          git add VERSION vf-ops.php includes/publish-o10/publish-preflight-product.php includes/publish-o10/publish-zip-product.php includes/publish-o10/publish-release-orchestrator.php .github/phase3/v121820-candidate-preflight-authority.php
          git commit -m 'fix(S01-C02): align Candidate preflight authority'
          test "$(git rev-list --count 00bc49b070485c6095a3b5bd3337b3fcc23d42f5..HEAD)" = '1'
          git push origin HEAD:refs/heads/fix/s01-candidate-preflight-authority-v121820
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)"
          echo "CANDIDATE_TREE=$(git rev-parse HEAD^{tree})"
          echo PASS_V121820_BUILD
