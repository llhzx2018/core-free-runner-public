name: S01 C02 1211096 Real Governance Audit Isolated
on:
  push:
    branches: [task/s01-c02-1211096-governance-audit-machine-20261012]
permissions:
  contents: read
  actions: read
jobs:
  governance-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.8.8
        env:
          MARIADB_ROOT_PASSWORD: syntheticroot
          MARIADB_DATABASE: ops_test
          MARIADB_USER: ops
          MARIADB_PASSWORD: ops
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=6
    steps:
      - name: Checkout isolated test lane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Syntax check audit lane
        run: bash -n lanes/s01-c02-governance-audit-1096/check.sh
      - name: Real official Ops plugin and MariaDB governance audit
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: bash lanes/s01-c02-governance-audit-1096/check.sh
      - name: Upload redacted proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s01-c02-governance-audit-${{ github.run_id }}
          path: proof/
          if-no-files-found: warn
          retention-days: 7
