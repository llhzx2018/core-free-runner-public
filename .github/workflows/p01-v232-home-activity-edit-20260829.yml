name: P01 V2.32 Home Activity Rail Edit
on:
  push:
    branches: [task/p01-v232-home-command-center-20260829]
    paths:
      - .github/workflows/p01-v232-home-activity-edit-20260829.yml
permissions:
  contents: read
jobs:
  edit:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_SOURCE: ac628d91c21dd29c9b5518997ebdf56228750e32
      PRODUCT_BRANCH: feature/p01-v2.32-home-activity-rail-20260829
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: feature/p01-v2.32-home-activity-rail-20260829
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Exact-source fenced Home activity edit
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$EXPECTED_SOURCE"
          python3 - <<'PY'
          from pathlib import Path

          php = Path('product/src/app/FunctionalHome.php')
          s = php.read_text(encoding='utf-8')

          anchor = "function vf_home_asset_class(array $asset): string\n{\n"
          helpers = r'''function vf_home_operation_view(array $entry): array
          {
              $action = strtolower(trim((string)($entry['action'] ?? '')));
              $type = strtolower(trim((string)($entry['object_type'] ?? '')));
              $actionLabel = match ($action) {
                  'create' => '新增',
                  'update' => '编辑',
                  'move' => '移动',
                  'organize' => '整理',
                  'update_visibility' => '修改可见范围',
                  'update_pending', 'pending' => '修改整理状态',
                  'delete', 'trash' => '删除',
                  'archive' => '归档',
                  'restore' => '恢复',
                  'favorite' => '收藏',
                  'unfavorite' => '取消收藏',
                  'reorder', 'reorder_links' => '调整网址顺序',
                  'reorder_favorites' => '调整收藏顺序',
                  'reorder_categories' => '调整分类顺序',
                  'health_redirect_apply' => '采用跳转地址',
                  'backup_promote' => '启用备用网址',
                  'history_restore' => '历史恢复',
                  default => $action !== '' ? $action : '操作',
              };
              $typeLabel = match ($type) {
                  'link' => '网址',
                  'category' => '分类',
                  'settings' => '设置',
                  'affiliate_link' => '推广链接',
                  'link_batch' => '批量网址',
                  'favorite_batch' => '收藏',
                  'tag_batch' => '标签',
                  'category_batch' => '批量分类',
                  default => '资源',
              };
              $id = max(0, (int)($entry['object_id'] ?? 0));
              $result = strtolower(trim((string)($entry['result'] ?? 'success')));
              $createdAt = trim((string)($entry['created_at'] ?? ''));
              $time = '';
              if ($createdAt !== '') {
                  try {
                      $time = (new DateTimeImmutable($createdAt))->setTimezone(new DateTimeZone('Asia/Shanghai'))->format('m-d H:i');
                  } catch (Throwable $ignored) {}
              }
              return [
                  'action' => $actionLabel,
                  'object' => $typeLabel . ($id > 0 ? ' #' . $id : ''),
                  'success' => $result === '' || $result === 'success',
                  'time' => $time,
              ];
          }

          '''
          if s.count(anchor) != 1:
              raise SystemExit('operation helper anchor drift')
          s = s.replace(anchor, helpers + anchor, 1)

          old = "    $favorites = (array)$context['favorites'];\n    $total = (int)($surfaceCounts['total'] ?? 0);\n"
          new = "    $favorites = (array)$context['favorites'];\n    $operations = (array)($context['operations'] ?? []);\n    $total = (int)($surfaceCounts['total'] ?? 0);\n"
          if s.count(old) != 1:
              raise SystemExit('operation context anchor drift')
          s = s.replace(old, new, 1)

          start_marker = '      <section class="vf-home-section vf-home-action-section">\n'
          end_marker = '    </aside>\n'
          start = s.find(start_marker)
          end = s.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('activity section markers drift')
          replacement = r'''      <?php if($pending>0): ?>
          <section class="vf-home-section vf-home-action-section">
            <header><div><span>处理</span><h2>有内容需要整理</h2><p>仅显示现有归属建议，不创建新的任务系统。</p></div></header>
            <a class="vf-home-primary-link" href="surface-manager.php">处理 <?=number_format($pending)?> 条待整理内容 →</a>
          </section>
          <?php endif; ?>

          <section class="vf-home-section vf-home-activity-section">
            <header><div><span>动态</span><h2>最近操作</h2><p>来自现有操作历史，只读展示最近 5 条。</p></div></header>
            <?php if(!$operations): ?>
              <div class="vf-home-activity-empty">还没有可显示的操作记录。</div>
            <?php else: ?>
              <div class="vf-home-activity-list">
                <?php foreach($operations as $entry): $view=vf_home_operation_view($entry); ?>
                  <div class="vf-home-activity-item<?= $view['success'] ? '' : ' is-failed' ?>">
                    <span class="vf-home-activity-dot" aria-hidden="true"></span>
                    <span class="vf-home-activity-copy"><b><?=vf_fw_h((string)$view['action'])?></b><small><?=vf_fw_h((string)$view['object'])?></small></span>
                    <i><?php if($view['time']!==''): ?><?=vf_fw_h((string)$view['time'])?> · <?php endif; ?><?= $view['success'] ? '完成' : '失败' ?></i>
                  </div>
                <?php endforeach; ?>
              </div>
            <?php endif; ?>
          </section>
          '''
          s = s[:start] + replacement + s[end:]

          old = "    $pending = count(array_filter($suggestions, static fn(array $suggestion): bool => (int)($suggestion['confidence'] ?? 0) >= 94));\n    $branding = ['logoUrl'=>''];\n"
          new = "    $pending = count(array_filter($suggestions, static fn(array $suggestion): bool => (int)($suggestion['confidence'] ?? 0) >= 94));\n    $operations = [];\n    try { $operations = (new VfOperationHistory($db))->recent(5, 0); } catch (Throwable $ignored) {}\n    $branding = ['logoUrl'=>''];\n"
          if s.count(old) != 1:
              raise SystemExit('history data anchor drift')
          s = s.replace(old, new, 1)

          old = "<?php vf_render_home_command_center(['surface_counts'=>$surfaceCounts,'pending'=>$pending,'favorite_count'=>$favoriteCount,'recent_count'=>count($recentAll),'recent'=>$recent,'favorites'=>$favorites]); ?>\n"
          new = "<?php vf_render_home_command_center(['surface_counts'=>$surfaceCounts,'pending'=>$pending,'favorite_count'=>$favoriteCount,'recent_count'=>count($recentAll),'recent'=>$recent,'favorites'=>$favorites,'operations'=>$operations]); ?>\n"
          if s.count(old) != 1:
              raise SystemExit('history render anchor drift')
          s = s.replace(old, new, 1)
          php.write_text(s, encoding='utf-8')

          css = Path('product/src/assets/workspace-home.css')
          c = css.read_text(encoding='utf-8')
          anchor = ".vf-home-action-section{background:color-mix(in srgb,var(--ws-teal-soft) 32%,var(--ws-panel))}\n"
          extra = r'''.vf-home-activity-list{display:grid;gap:2px}
          .vf-home-activity-item{min-width:0;min-height:42px;padding:7px 6px;display:grid;grid-template-columns:8px minmax(0,1fr) auto;align-items:center;gap:8px;border-radius:7px}
          .vf-home-activity-item:hover{background:var(--ws-soft)}
          .vf-home-activity-dot{width:6px;height:6px;border-radius:999px;background:var(--ws-teal)}
          .vf-home-activity-copy{min-width:0}
          .vf-home-activity-copy b,.vf-home-activity-copy small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          .vf-home-activity-copy b{color:var(--ws-text);font-size:10.5px;font-weight:700}
          .vf-home-activity-copy small{margin-top:2px;color:var(--ws-muted-2);font-size:9.5px}
          .vf-home-activity-item>i{color:var(--ws-muted-2);font-style:normal;font-size:9px;font-weight:700;white-space:nowrap}
          .vf-home-activity-item.is-failed .vf-home-activity-dot{background:#b45309}
          .vf-home-activity-item.is-failed>i{color:#b45309}
          .vf-home-activity-empty{padding:12px 8px;color:var(--ws-muted-2);font-size:10px;line-height:1.5}
          '''
          if c.count(anchor) != 1:
              raise SystemExit('activity css anchor drift')
          c = c.replace(anchor, anchor + extra, 1)
          css.write_text(c, encoding='utf-8')
          PY
          php -l product/src/app/FunctionalHome.php
          test "$(git -C product diff --name-only | sort | tr '\n' ' ')" = "src/app/FunctionalHome.php src/assets/workspace-home.css "
          git -C product diff --check
          git -C product diff --stat
          test "$(tr -d '\r\n' < product/src/VERSION.txt)" = "2.31.0"
          git -C product config user.name VictorForge
          git -C product config user.email llhzx2018@gmail.com
          git -C product add src/app/FunctionalHome.php src/assets/workspace-home.css
          git -C product commit -m "refine(P01): surface recent operations on Home"
          git -C product push origin "HEAD:${PRODUCT_BRANCH}"
          echo "NEW_SOURCE=$(git -C product rev-parse HEAD)"
          echo "NEW_TREE=$(git -C product rev-parse HEAD^{tree})"
          echo "VERSION=$(tr -d '\r\n' < product/src/VERSION.txt)"
          echo "OWNER_PRODUCTION_WRITE=NO"
          echo "RELEASE=NO"
