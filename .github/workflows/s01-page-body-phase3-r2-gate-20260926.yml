name: S01 Page Body Phase 3 R2 Gate

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/s01-page-body-phase3-r2-gate-20260926.yml'

permissions:
  contents: read

jobs:
  gate:
    if: github.head_ref == 'task/s01-page-body-phase3-r2-gate-20260926'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      OPS_SHA: 6282280483154c92501b79a697821c3e81b4d102
      THEME_SHA: c822ebfa7321d27a885b7b60f3a469c5ad7f79eb
      M3U8_SHA: c60c8ed71734b7af465a3fd02b87f5255a582a4e
    steps:
      - name: Credential presence
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: test -n "$READ_TOKEN"

      - name: Checkout exact candidates
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          for spec in             "llhzx2018/vf-tools-ops:$OPS_SHA:ops"             "llhzx2018/vf-tools-theme:$THEME_SHA:theme"             "llhzx2018/vf-tools-m3u8:$M3U8_SHA:m3u8"
          do
            IFS=: read -r r s d <<<"$spec"
            git clone -q --filter=blob:none "https://x-access-token:$READ_TOKEN@github.com/$r.git" "$d"
            git -C "$d" fetch -q origin "$s"
            git -C "$d" checkout -q --detach "$s"
            test "$(git -C "$d" rev-parse HEAD)" = "$s"
          done

      - name: OPS Phase 3 R1+R2
        working-directory: ops
        run: |
          set -Eeuo pipefail
          php -l tests/s01-c02-page-body-system-v1-phase3-contract.php
          php tests/s01-c02-page-body-system-v1-phase3-contract.php
          grep -Fq 'Phase 3 · Responsive / Accessibility / Legacy Residue R1' assets/css/current/admin-s01-page-body-system-v1.css
          grep -Fq 'Phase 3 · Responsive / Accessibility / Legacy Residue R2' assets/css/current/admin-s01-page-body-system-v1.css
          ! grep -Eq '\.vf-v6-shell-header|\.vf-v6-domain-nav|\.vf-s01-shell-header' assets/css/current/admin-s01-page-body-system-v1.css

      - name: Theme Phase 3 R1+R2
        working-directory: theme
        run: |
          set -Eeuo pipefail
          php -l tests/s01-c01-page-body-system-v1-phase3-contract.php
          php tests/s01-c01-page-body-system-v1-phase3-contract.php
          grep -Fq 'Phase 3 · Responsive / Accessibility / Legacy Residue R1' src/assets/css/admin/admin-s01-page-body-system-v1.css
          grep -Fq 'Phase 3 · Responsive / Accessibility / Legacy Residue R2' src/assets/css/admin/admin-s01-page-body-system-v1.css
          ! grep -Eq '\.vf-v6-shell-header|\.vf-v6-domain-nav|\.vf-theme-maintenance-menu|\.vf-theme-admin-header' src/assets/css/admin/admin-s01-page-body-system-v1.css

      - name: M3U8 Phase 3 R1+R2
        working-directory: m3u8
        run: |
          set -Eeuo pipefail
          php -l tests/s01-c03-page-body-system-v1-phase3-contract.php
          php tests/s01-c03-page-body-system-v1-phase3-contract.php
          grep -Fq 'Phase 3 · Responsive / Accessibility / Legacy Residue R1' src/admin/ui-v4/admin-s01-page-body-system-v1.css
          grep -Fq 'Phase 3 · Responsive / Accessibility / Legacy Residue R2' src/admin/ui-v4/admin-s01-page-body-system-v1.css
          ! grep -Eq '\.vf-v6-shell-header|\.vf-v6-domain-nav|\.vf-v6-domain-menu|\.vf-m3u8-console-head|\.vf-m3u8-primary-nav' src/admin/ui-v4/admin-s01-page-body-system-v1.css

      - name: CSS delimiter balance
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          paths=[
            Path('ops/assets/css/current/admin-s01-page-body-system-v1.css'),
            Path('theme/src/assets/css/admin/admin-s01-page-body-system-v1.css'),
            Path('m3u8/src/admin/ui-v4/admin-s01-page-body-system-v1.css'),
          ]
          for p in paths:
              c=p.read_text()
              assert c.count('{')==c.count('}'), p
          print('PASS_PHASE3_R2_CSS_BALANCE')
          PY
