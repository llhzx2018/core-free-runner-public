name: P01 V2.38.0 Core Updates Manifest Gate
on:
  push:
    branches: [release/p01-v2380-projects-20260902]
    paths: [.github/workflows/p01-v2380-core-updates-manifest-gate.yml]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CORE_BRANCH: release/p01-v2380-projects-20260902
      CORE_COMMIT: 1c45bd81a6244bb9214a459067c99a17d72d9948
      RELEASE_ID: '381223680'
      AUTHORITY_SOURCE: 64ff0068ca8a3d231b1be83610b104b1c9d8611d
      UPDATE_BYTES: '1283549'
      UPDATE_SHA: 2bf71a8619eefb6bf7b2da0d3095f57e37a4809acb01f795541781ea6e1b6b94
    steps:
      - name: Exact manifest and release asset gate
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          test "$(gh api repos/llhzx2018/core-updates/git/ref/heads/$CORE_BRANCH --jq .object.sha)" = "$CORE_COMMIT"
          gh api "repos/llhzx2018/core-updates/contents/projects/P01.json?ref=$CORE_BRANCH" --jq .content | tr -d '\n' | base64 -d >/tmp/P01.json
          jq -e '
            .schema_version=="1.0" and
            .project_id=="P01" and .component_id=="APP" and .enabled==true and
            .current_version=="2.37.5" and .target_version=="2.38.0" and
            .update_type=="ATOMIC" and .from_versions==["2.37.5"] and
            .schema_from=="2026082901" and .schema_to=="2026082901" and
            .repository=="llhzx2018/vf-start" and .release_tag=="v2.38.0" and
            .release_id==381223680 and
            .product_identity=="64ff0068ca8a3d231b1be83610b104b1c9d8611d" and
            .asset_name=="VF_Start_V2.38.0_UPDATE.zip" and
            .asset_bytes==1283549 and
            .asset_sha256=="2bf71a8619eefb6bf7b2da0d3095f57e37a4809acb01f795541781ea6e1b6b94" and
            .backup_required==true and .rollback_supported==true and
            .minimum_php=="8.0.0"
          ' /tmp/P01.json >/dev/null
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.38.0 --jq .object.sha)" = "$AUTHORITY_SOURCE"
          REL="$(gh api repos/llhzx2018/vf-start/releases/$RELEASE_ID)"
          test "$(jq -r .tag_name <<<"$REL")" = 'v2.38.0'
          test "$(jq -r .draft <<<"$REL")" = false
          test "$(jq -r .prerelease <<<"$REL")" = false
          AID="$(jq -r '.assets[]|select(.name=="VF_Start_V2.38.0_UPDATE.zip")|.id' <<<"$REL")"
          ASIZE="$(jq -r '.assets[]|select(.name=="VF_Start_V2.38.0_UPDATE.zip")|.size' <<<"$REL")"
          ADIGEST="$(jq -r '.assets[]|select(.name=="VF_Start_V2.38.0_UPDATE.zip")|.digest' <<<"$REL")"
          test -n "$AID"
          test "$ASIZE" = "$UPDATE_BYTES"
          test "$ADIGEST" = "sha256:$UPDATE_SHA"
          curl -L --fail-with-body --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/octet-stream' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/llhzx2018/vf-start/releases/assets/$AID" -o /tmp/update.zip
          test "$(stat -c %s /tmp/update.zip)" = "$UPDATE_BYTES"
          test "$(sha256sum /tmp/update.zip | awk '{print $1}')" = "$UPDATE_SHA"
          test "$(unzip -Z1 /tmp/update.zip | wc -l | tr -d ' ')" = '1'
          test "$(unzip -Z1 /tmp/update.zip)" = 'repair-v2.38.0.php'
          unzip -p /tmp/update.zip repair-v2.38.0.php >/tmp/repair-v2.38.0.php
          php -l /tmp/repair-v2.38.0.php >/dev/null
          php /tmp/repair-v2.38.0.php --self-test | jq -e '.ok==true and .global_barrier==true and .interruption_recovery==true' >/dev/null
          echo P01_V2380_CORE_UPDATES_MANIFEST_GATE=PASS
          echo STRICT_SINGLE_HOP=2.37.5_TO_2.38.0
          echo SCHEMA=2026082901
          echo MIGRATION=NONE
          echo OWNER_PRODUCTION_WRITE=NO
