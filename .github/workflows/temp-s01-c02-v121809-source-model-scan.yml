name: TEMP S01-C02 Ops Static Source Model Scan
on:
  push:
    branches: [temp/s01-c02-v121809-production-readback-20260904]
    paths: ['.github/workflows/temp-s01-c02-v121809-source-model-scan.yml']
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Scan exact Ops source model
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$R"
          git clone -q --branch main "https://x-access-token:${R}@github.com/llhzx2018/vf-tools-ops.git" ops
          cd ops
          test "$(git rev-parse HEAD)" = 'e4c5fc3dece349ca23f0fea361d55709d4b3f82c'
          echo '=== PUBLISH_ZIP_MODEL ==='
          grep -RIn -C 25 --include='*.php' -E 'function vf_ops_publish_zip_model_v121423|vf_ops_publish_zip_model_v121423' . | sed -n '1,500p' || true
          echo '=== SOURCE_PATH_WRITES_READS ==='
          grep -RIn -C 12 --include='*.php' -E 'source_path|sourcePath|source_artifact|sourceArtifact|Simply Static|static source|source zip|source_zip' . | sed -n '1,1200p' || true
          echo '=== JOB_STORE_MODEL ==='
          grep -RIn -C 15 --include='*.php' -E 'jobInfo|job_info|static_job|static jobs|candidate.*job|job.*candidate|inspectionComplete|canPromoteInspection' . | sed -n '1,1200p' || true
          echo 'PASS_STATIC_SOURCE_MODEL_SCAN'
