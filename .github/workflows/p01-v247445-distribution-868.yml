name: P01 2.47.445 exact core-updates PR868 independent gate
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-v247445-distribution-868.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UPDATE_REPO: llhzx2018/core-updates
      UPDATE_SHA: 8bf7e3f381e34d313056c2cab7f9caa7aa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Bind exact private update candidate in ephemeral checkout
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          ROOT="$RUNNER_TEMP/p01-445-distribution"
          echo "P01_UPDATES_ROOT=$ROOT" >> "$GITHUB_ENV"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/$UPDATE_REPO.git" "$ROOT"
          git -C "$ROOT" checkout -q --detach "$UPDATE_SHA"
          git -C "$ROOT" remote set-url origin "https://github.com/$UPDATE_REPO.git"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$UPDATE_SHA"
          echo P01_445_DIST_EXACT_SOURCE=PASS
      - name: Full core-updates contract and exact P01 release coordinates
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$P01_UPDATES_ROOT"
          python3 scripts/check_manifest_contract.py | tee "$P01_UPDATES_ROOT/manifest-result.json"
          grep -F '"status": "PASS"' "$P01_UPDATES_ROOT/manifest-result.json" >/dev/null
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php update-core/php/tests/run.php
          python3 - <<'PY'
          import json
          m=json.load(open('projects/P01.json'))
          assert m['target_version']=='2.47.445'
          assert m['current_version']=='2.47.444'
          assert m['from_versions']==['2.47.444']
          assert m['release_tag']=='v2.47.445'
          assert m['release_id']==422524152
          assert m['product_identity']=='40b42ec656d1f3ae995043f8f4d3f14a02f971b7'
          assert m['asset_name']=='VF_Start_V2.47.445_UPDATE.zip'
          assert m['asset_bytes']==2944024
          assert m['asset_sha256']=='0093b2d9e9467a8107aafe1fc4fbea4be0712397d06c4246029502ef43841f03'
          assert m['schema_from']==m['schema_to']=='2026102201'
          assert m['update_type']=='ATOMIC'
          assert m['backup_required'] is True and m['rollback_supported'] is True
          print('P01_445_DISTRIBUTION_COORDINATES=PASS')
          PY
          echo P01_445_DISTRIBUTION_EQUIVALENT_CI=PASS
      - name: Independent published release/tag/UPDATE remote readback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          RELEASE_JSON="$RUNNER_TEMP/p01-445-release.json"
          gh api repos/llhzx2018/vf-start/releases/tags/v2.47.445 > "$RELEASE_JSON"
          jq -e '.id==422524152 and .tag_name=="v2.47.445" and .draft==false and .prerelease==false' "$RELEASE_JSON" >/dev/null
          jq -e '.assets[] | select(.name=="VF_Start_V2.47.445_UPDATE.zip") | .size==2944024 and .digest=="sha256:0093b2d9e9467a8107aafe1fc4fbea4be0712397d06c4246029502ef43841f03"' "$RELEASE_JSON" >/dev/null
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.47.445 --jq '.object.sha')" = "40b42ec656d1f3ae995043f8f4d3f14a02f971b7"
          mkdir -p "$RUNNER_TEMP/p01-445-remote"
          gh release download v2.47.445 -R llhzx2018/vf-start -D "$RUNNER_TEMP/p01-445-remote" -p VF_Start_V2.47.445_UPDATE.zip
          test "$(sha256sum "$RUNNER_TEMP/p01-445-remote/VF_Start_V2.47.445_UPDATE.zip" | awk '{print $1}')" = "0093b2d9e9467a8107aafe1fc4fbea4be0712397d06c4246029502ef43841f03"
          echo P01_445_DISTRIBUTION_REMOTE_ASSET=PASS
      - name: Delete private checkout
        if: always()
        shell: bash
        run: |
          if [ -n "${P01_UPDATES_ROOT:-}" ]; then rm -rf -- "$P01_UPDATES_ROOT"; fi
          echo P01_445_DIST_EPHEMERAL=PASS
