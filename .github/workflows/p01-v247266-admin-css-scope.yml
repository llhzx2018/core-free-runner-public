name: P01 V2.47.266 Admin CSS Scope Proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p01-v247266-admin-css-scope.yml"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout proof control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd nodejs >/dev/null

      - name: Clone exact candidate and baseline
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" candidate
          git -C candidate fetch -q origin 30a43fefd0672d5dd8bd07dc8ac7a07f3a859ec8
          git -C candidate checkout -q --detach 30a43fefd0672d5dd8bd07dc8ac7a07f3a859ec8
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.266"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "2.47.266"

          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" baseline
          git -C baseline fetch -q origin 3ecad622aeac4f6d281b5410febb3162183909ca
          git -C baseline checkout -q --detach 3ecad622aeac4f6d281b5410febb3162183909ca
          echo P01_V247266_EXACT_SOURCE=PASS

      - name: Syntax and CSS scope contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check candidate/src/assets/links-admin.js
          php -l candidate/src/links-admin.php
          php -l candidate/src/app/bootstrap.php
          php candidate/tests/unit/admin_pages_css_scope_v247266_contract.php
          php candidate/tests/unit/navigation_category_editor_v247265_contract.php
          php candidate/tests/unit/navigation_category_sort_v247263_contract.php
          php candidate/tests/unit/navigation_category_runtime_binding_v247264_contract.php
          php candidate/tests/unit/navigation_category_workspace_tabs_contract.php
          php candidate/tests/unit/admin_navigation_categories_page4_polish_contract.php
          php candidate/tests/unit/admin_navigation_consistency_contract.php
          echo P01_V247266_FOCUSED=PASS

      - name: Production regression root-cause guard
        shell: bash
        run: |
          set -Eeuo pipefail
          php candidate/tests/unit/admin_pages_css_scope_v247266_contract.php | tee /tmp/css-scope.txt
          grep -Fx 'P01_ADMIN_PAGES_CSS_SCOPE_V247266=PASS' /tmp/css-scope.txt
          grep -F 'P01 V2.47.265 — Navigation category editor.' candidate/src/assets/admin-pages.css
          ! grep -F $'.vf-health-center-note span{font-size:10.5px;color:var(--vf-admin-muted);text-align:right}\n@media(max-width:640px){\n/* transfer.php' candidate/src/assets/admin-pages.css
          echo P01_V247266_DESKTOP_CATEGORY_CSS=PASS

      - name: Canonical regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate baseline --require-zero-debt | tee /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/canonical.txt
          echo P01_V247266_CANONICAL=PASS

      - name: Bounded scope
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C candidate diff --name-only 3ecad622aeac4f6d281b5410febb3162183909ca..30a43fefd0672d5dd8bd07dc8ac7a07f3a859ec8 | tee /tmp/changed.txt
          grep -Fx 'src/assets/admin-pages.css' /tmp/changed.txt
          grep -Fx 'tests/unit/admin_pages_css_scope_v247266_contract.php' /tmp/changed.txt
          if grep -E '(^|/)(migrations|schema|auth|security|update|install|setup)' /tmp/changed.txt; then
            echo "Unexpected high-risk scope"
            exit 1
          fi
          echo FORMAL_RELEASE_CALLED=NO
          echo DISTRIBUTION_WRITE=NO
          echo PRODUCTION_WRITE=NO
