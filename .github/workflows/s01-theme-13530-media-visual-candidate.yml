name: S01 Theme 1.35.30 Media Visual Formal Release

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  actions: read

jobs:
  formal-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_REPO: llhzx2018/vf-tools-theme
      SOURCE_SHA: 643153c295d9fc4ac5f6190384481f4e1349e563
      VERSION: 1.35.30
      TAG: v1.35.30
      ASSET: vf-tools-theme_V1.35.30.zip
      CANDIDATE_RUN_ID: '35434617914'
      CANDIDATE_ARTIFACT_ID: '10582057770'
      EXPECTED_BYTES: '1726698'
      EXPECTED_SHA256: 7fa874b37ba2d68923c346ee498d3654b07eaafe112652dc5fccdc4e914b5325
      EXPECTED_RUNTIME_FILES: '456'
      EXPECTED_RUNTIME_FP: 958ea9171a3858a99306f3e9f4bf8068013eb1e71efed20e4b785bdc1244708f

    steps:
      - name: Credential presence gate
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"
          echo PASS_RELEASE_CREDENTIAL_PRESENCE

      - name: Checkout exact released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 643153c295d9fc4ac5f6190384481f4e1349e563
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: theme
          persist-credentials: false

      - name: Exact release identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C theme rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' < theme/VERSION)" = "$VERSION"
          grep -Fq 'Version: 1.35.30' theme/src/style.css
          grep -Fq 'V1.35.30_S01_MEDIA_VISUAL_CLOSURE' theme/src/style.css
          php theme/tests/s01-c01-13530-media-visual-closure-contract.php
          echo PASS_EXACT_RELEASE_SOURCE

      - name: Fetch exact tested candidate artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/tested && mkdir -p /tmp/tested
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/artifacts/$CANDIDATE_ARTIFACT_ID/zip" \
            -o /tmp/tested-artifact.zip
          unzip -q /tmp/tested-artifact.zip -d /tmp/tested
          ZIP="$(find /tmp/tested -type f -name "$ASSET" -print -quit)"
          test -n "$ZIP"
          cp "$ZIP" "/tmp/$ASSET"
          test "$(stat -c %s "/tmp/$ASSET")" = "$EXPECTED_BYTES"
          test "$(sha256sum "/tmp/$ASSET" | awk '{print $1}')" = "$EXPECTED_SHA256"
          unzip -tq "/tmp/$ASSET" >/dev/null
          unzip -Z1 "/tmp/$ASSET" | grep -Fxq 'vf-tools-theme/screenshot.png'
          unzip -Z1 "/tmp/$ASSET" | grep -Fxq 'vf-tools-theme/theme.json'
          echo PASS_EXACT_TESTED_ARTIFACT_FETCH

      - name: Runtime Authority exact verification
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib, os, re, zipfile
          p='/tmp/'+os.environ['ASSET']
          runtime={}
          with zipfile.ZipFile(p) as z:
              for n in z.namelist():
                  if n.endswith('/'): continue
                  if not n.startswith('vf-tools-theme/'): raise SystemExit('unexpected root: '+n)
                  rel=n[len('vf-tools-theme/'):]
                  if not rel: continue
                  if re.search(r'(^|/)(?:\.git|\.github|tests?|docs?|evidence|private|tmp|temp|cache|logs?)(/|$)',rel,re.I): continue
                  base=rel.split('/')[-1].lower()
                  if base in {'readme.md','changelog.md','license','license.txt'}: continue
                  if re.search(r'\.(?:sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',rel,re.I): continue
                  ok=(('/' not in rel and (rel=='style.css' or rel.lower().endswith('.php'))) or re.match(r'^(?:inc|assets|config|languages|template-parts|templates)/',rel))
                  if not ok: continue
                  runtime[rel]=z.read(n)
          if len(runtime)!=int(os.environ['EXPECTED_RUNTIME_FILES']): raise SystemExit('runtime count mismatch')
          if b'Version: 1.35.30' not in runtime['style.css']: raise SystemExit('theme version mismatch')
          if b"VF_THEME_VERSION', '1.35.30'" not in runtime['inc/runtime-constants.php']: raise SystemExit('public runtime identity mismatch')
          h=hashlib.sha256()
          for rel,b in sorted(runtime.items()):
              h.update(rel.encode()); h.update(b'\0'); h.update(hashlib.sha256(b).hexdigest().encode()); h.update(b'\n')
          if h.hexdigest()!=os.environ['EXPECTED_RUNTIME_FP']: raise SystemExit('runtime fingerprint mismatch')
          print('PASS_RUNTIME_AUTHORITY_EXACT')
          PY

      - name: Verify tag and release absence
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          if gh release view "$TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then exit 31; fi
          if gh api "repos/$TARGET_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then exit 32; fi
          test "$(gh api "repos/$TARGET_REPO/commits/$SOURCE_SHA" --jq '.sha')" = "$SOURCE_SHA"
          echo PASS_RELEASE_ABSENCE_AND_TARGET

      - name: Create exact formal release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          cat > /tmp/release-notes.md <<EOF
          # VF Tools Theme V1.35.30

          **S01-C01 · Media & Visual Closure**

          This release:
          - keeps content-card media visible below 430px using a compact 16:7 cover instead of hiding images;
          - adds family-aware Article / Guide / Fix / Term / Archive fallback treatment;
          - hardens responsive inline reading media, figures, pictures and figcaptions;
          - repairs theme.json to schema version 3 and aligns public VF runtime metadata to 1.35.30;
          - preserves legacy phase metadata as historical evidence instead of promoting current PASS.

          Safety:
          - Data Migration NONE
          - Navigation / route ownership UNCHANGED
          - Theme/Plugin ownership UNCHANGED
          - Runtime files $EXPECTED_RUNTIME_FILES
          - Candidate Gate $CANDIDATE_RUN_ID PASS
          - Rollback v1.35.29
          - Production installation NOT YET CLAIMED
          - OWNER Real-use POST_RELEASE_NOT_RUN

          Exact asset:
          - $ASSET
          - Bytes $EXPECTED_BYTES
          - SHA-256 $EXPECTED_SHA256
          - Runtime Fingerprint $EXPECTED_RUNTIME_FP
          EOF
          created=0
          cleanup(){ rc=$?; if [ "$rc" -ne 0 ] && [ "$created" -eq 1 ]; then gh release delete "$TAG" --repo "$TARGET_REPO" --cleanup-tag -y >/dev/null 2>&1 || true; fi; exit "$rc"; }
          trap cleanup EXIT
          gh release create "$TAG" "/tmp/$ASSET#VF Tools Theme $VERSION" \
            --repo "$TARGET_REPO" --target "$SOURCE_SHA" --title "VF Tools Theme V$VERSION" --notes-file /tmp/release-notes.md
          created=1
          trap - EXIT
          echo PASS_FORMAL_RELEASE_CREATED

      - name: Independent remote release readback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          JSON="$(gh api "repos/$TARGET_REPO/releases/tags/$TAG")"
          RID="$(jq -r '.id' <<<"$JSON")"
          AID="$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.id' <<<"$JSON")"
          PUBLISHED="$(jq -r '.published_at' <<<"$JSON")"
          test -n "$RID" && test "$RID" != null
          test -n "$AID" && test "$AID" != null
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.size' <<<"$JSON")" = "$EXPECTED_BYTES"
          test "$(gh api "repos/$TARGET_REPO/git/ref/tags/$TAG" --jq '.object.sha')" = "$SOURCE_SHA"
          rm -rf /tmp/release-readback && mkdir -p /tmp/release-readback
          gh release download "$TAG" --repo "$TARGET_REPO" --pattern "$ASSET" --dir /tmp/release-readback
          test "$(stat -c %s "/tmp/release-readback/$ASSET")" = "$EXPECTED_BYTES"
          test "$(sha256sum "/tmp/release-readback/$ASSET" | awk '{print $1}')" = "$EXPECTED_SHA256"
          cmp "/tmp/$ASSET" "/tmp/release-readback/$ASSET"
          unzip -tq "/tmp/release-readback/$ASSET" >/dev/null
          cat > /tmp/formal-release-receipt.txt <<EOF
          COMPONENT=S01-C01
          VERSION=$VERSION
          SOURCE_SHA=$SOURCE_SHA
          CANDIDATE_RUN=$CANDIDATE_RUN_ID
          CANDIDATE_ARTIFACT_ID=$CANDIDATE_ARTIFACT_ID
          TAG=$TAG
          RELEASE_ID=$RID
          ASSET=$ASSET
          ASSET_ID=$AID
          BYTES=$EXPECTED_BYTES
          SHA256=$EXPECTED_SHA256
          RUNTIME_FILES=$EXPECTED_RUNTIME_FILES
          RUNTIME_FINGERPRINT=$EXPECTED_RUNTIME_FP
          THEME_JSON_SCHEMA=3
          PHONE_MEDIA_VISIBLE=PASS
          FAMILY_FALLBACK_MEDIA=PASS
          READING_MEDIA_RESPONSIVE=PASS
          PUBLISHED_AT=$PUBLISHED
          REMOTE_ZIP_INTEGRITY=PASS
          TESTED_ARTIFACT_EQUALS_DELIVERED_ARTIFACT=PASS
          PRODUCTION=NOT_CLAIMED
          OWNER_REAL_USE=POST_RELEASE_NOT_RUN
          RESULT=PASS
          EOF
          cat /tmp/formal-release-receipt.txt
          echo PASS_S01_THEME_13530_FORMAL_RELEASE

      - name: Upload formal release receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c01-13530-formal-release-${{ github.run_id }}
          path: /tmp/formal-release-receipt.txt
          if-no-files-found: error
          retention-days: 30
