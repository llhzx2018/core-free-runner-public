name: P05 Secondary Surface Split Exact Source Gate
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p05-secondary-split-8f57f89.yml'
permissions:
  contents: read
jobs:
  p05-secondary-split:
    if: github.event_name == 'pull_request' && github.head_ref == 'tmp/p05-secondary-split-8f57f89-20260831'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: vfseo_test
          POSTGRES_USER: vfseo
          POSTGRES_PASSWORD: vfseo-test-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vfseo -d vfseo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      P05_EXACT_SOURCE: 8f57f890b36b07df251bf0268ceee29f87fdca13
      P05_BASE_MAIN: f86cb4dc661f5a596d8ef6353079d39477a300e6
      DATABASE_URL: postgresql://vfseo:vfseo-test-password@127.0.0.1:5432/vfseo_test
      VF_MASTER_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NODE_ENV: test
      APP_ENV: test
      VF_DATABASE_PROVIDER: sqlite
      VF_SECURE_COOKIES: 'false'
      VF_REQUIRE_HTTPS: 'false'
      VF_ADMIN_USERNAME: admin
      VF_ADMIN_PASSWORD: php-ci-portable-password-123
    steps:
      - name: Checkout exact private P05 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.P05_EXACT_SOURCE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source and scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_EXACT_SOURCE"
          git cat-file -e "$P05_BASE_MAIN^{commit}"
          git diff --check "$P05_BASE_MAIN" "$P05_EXACT_SOURCE" -- '*.ts' '*.tsx' '*.css' '*.mjs' '*.php' '*.json' '*.yml' '*.yaml'
          test "$(git diff --name-only "$P05_BASE_MAIN" "$P05_EXACT_SOURCE" | wc -l)" -eq 2
          echo 'P05_SECONDARY_SPLIT_EXACT_SOURCE_BINDING=PASS'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: 24, cache: npm }
      - name: Install exact dependencies
        run: npm ci
      - name: Engineering regression
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run lint
          npm run typecheck
          npm run migrate
          npm run verify:schema
          npm run test
          npm run build
          echo 'P05_SECONDARY_SPLIT_ENGINEERING=PASS'
      - name: Verify classic entry reduction and secondary chunks
        shell: bash
        run: |
          set -Eeuo pipefail
          MAIN_CHUNK="$(find dist/client/assets -maxdepth 1 -type f -name 'index-*.js' -print -quit)"
          test -n "$MAIN_CHUNK"
          MAIN_BYTES="$(stat -c%s "$MAIN_CHUNK")"
          test "$MAIN_BYTES" -lt 560000
          for name in CommonSystemCenter UpdateShortcut DemoDatasetShortcut ProductWorkspaceShortcut ProductApp; do
            CHUNK="$(find dist/client/assets -maxdepth 1 -type f -name "${name}-*.js" -print -quit)"
            test -n "$CHUNK"
            echo "P05_${name}_CHUNK=$(basename "$CHUNK")"
            echo "P05_${name}_CHUNK_BYTES=$(stat -c%s "$CHUNK")"
          done
          echo "P05_CLASSIC_MAIN_CHUNK=$(basename "$MAIN_CHUNK")"
          echo "P05_CLASSIC_MAIN_CHUNK_BYTES=$MAIN_BYTES"
          echo 'P05_SECONDARY_SPLIT_BUNDLE_VALUE=PASS'
      - name: Formal PHP staging regression
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run build:php-release
          npm run php:release:gate
          for name in CommonSystemCenter UpdateShortcut DemoDatasetShortcut ProductWorkspaceShortcut ProductApp; do
            test -n "$(find build/vf-seo-php-release/assets -maxdepth 1 -type f -name "${name}-*.js" -print -quit)"
          done
          echo 'P05_SECONDARY_SPLIT_PHP_RELEASE_STAGING=PASS'
      - name: Source and security gates
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run source:gate
          npm run scope:gate
          npm run dependency:gate
          npm audit --audit-level=high
          npm run security:gate
          echo 'P05_SECONDARY_SPLIT_SOURCE_SECURITY=PASS'
      - name: Seal exact source result
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_EXACT_SOURCE"
          echo 'P05_SECONDARY_SPLIT_EXACT_SOURCE_GATE=PASS'
          echo "P05_EXACT_SOURCE=$P05_EXACT_SOURCE"
          echo 'P05_RELEASE_WRITE=0'
          echo 'P05_PRODUCTION_WRITE=0'
