name: p01-v247497-modef-highrisk-readiness
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-v247497-modef-risk-temp.yml']
permissions:
  contents: read
jobs:
  exact-mode-f:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      PRODUCT_BRANCH: release/p01-v247497-candidate
      TARGET_SHA: 3c24dfd09ba78f2e8a556376759812c5c44190f3
      STABLE_SHA: f64fcc150fe8a861543b0cbd49946c99e09e078b
    steps:
      - name: Checkout ephemeral public test control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact-source P01 Mode F security, backup recovery and browser tests
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          test -n "$READ_TOKEN"
          ROOT="$(mktemp -d /tmp/p01-modef-risk.XXXXXXXX)"
          PIDS=""
          cleanup() {
            for pid in $PIDS; do kill "$pid" >/dev/null 2>&1 || true; done
            case "$ROOT" in /tmp/p01-modef-risk.*) rm -rf -- "$ROOT" ;; esac
          }
          trap cleanup EXIT
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd curl unzip nodejs npm >/dev/null
          git clone -q --depth 1 --branch "$PRODUCT_BRANCH" "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" "$ROOT/candidate"
          test "$(git -C "$ROOT/candidate" rev-parse HEAD)" = "$TARGET_SHA"
          git -C "$ROOT/candidate" remote set-url origin "https://github.com/$PRODUCT_REPO.git"
          unset READ_TOKEN
          test "$(tr -d '\r\n ' < "$ROOT/candidate/VERSION")" = "2.47.497"
          test "$(tr -d '\r\n ' < "$ROOT/candidate/src/VERSION.txt")" = "2.47.497"
          echo "P01_MODEF_EXACT_SHA=$TARGET_SHA"
          cd "$ROOT/candidate"
          bash tests/integration/run_p01_ia6_r3_highrisk_disposable.sh
          php tests/unit/full_surface_governance_privacy_monotonic_runtime.php
          php tests/unit/p01_ia6_sensitive_native_operations_release_contract.php
          php tests/unit/backup_recovery_symlink_fail_closed_native.php
          php tests/unit/backup_missing_protection_guard_native.php
          php tests/unit/tmdb_watch_metadata_behavior.php
          php tests/unit/p01_watch_tmdb_server_identity_runtime.php
          php tests/unit/p01_watch_recent_open_identity_runtime.php
          echo P01_MODEF_HIGH_RISK_AUTH_PRIVACY_CAS=PASS

          # Fresh synthetic installs with explicit path-fenced destructive tests.
          install_site() {
            local target="$1" port="$2"
            mkdir -p "$target"
            cp -a "$ROOT/candidate/src/." "$target/"
            (cd "$target" && php -S "127.0.0.1:$port" -t . >"$target/server-test.log" 2>&1) &
            local serverpid=$!
            PIDS="$PIDS $serverpid"
            local html="$ROOT/setup-$port.html" jar="$ROOT/cookies-$port.txt"
            for n in $(seq 1 50); do
              if curl -fsS -c "$jar" -b "$jar" "http://127.0.0.1:$port/setup.php" -o "$html" 2>/dev/null; then break; fi
              sleep 1
            done
            test -s "$html"
            local csrf
            csrf="$(python3 - "$html" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s)
          if not m: raise SystemExit('missing disposable setup CSRF')
          print(m.group(1))
          PY
            )"
            curl -fsS -c "$jar" -b "$jar" -X POST "http://127.0.0.1:$port/setup.php" \
              --data-urlencode "setup_csrf=$csrf" \
              --data-urlencode "site_title=VF Start temporary Mode F site" \
              --data-urlencode 'admin_password=ModeFDisposable!2026' \
              --data-urlencode 'admin_password_confirm=ModeFDisposable!2026' -o "$ROOT/setup-response-$port"
            (cd "$target" && php cli/verify.php) | grep -Fx 'VERIFY_PASS=YES'
            kill "$serverpid" >/dev/null 2>&1 || true
          }
          DISASTER="$(mktemp -d /tmp/p01-ia6-disaster-parity-XXXXXXXX)"
          R11="$(mktemp -d /tmp/p01-ia6-r11-XXXXXXXX)"
          # Guard also deletes the isolated runtimes created by mktemp.
          trap 'for pid in $PIDS; do kill "$pid" >/dev/null 2>&1 || true; done; rm -rf "$ROOT" "$DISASTER" "$R11"' EXIT
          install_site "$DISASTER" 18971
          VF_E2E_RUNTIME_ROOT="$DISASTER" VF_IA6_DISPOSABLE_ACK='IA6-DISASTER-DISPOSABLE-ONLY' \
            php tests/integration/p01_ia6_disaster_roundtrip_disposable.php
          install_site "$R11" 18972
          VF_E2E_RUNTIME_ROOT="$R11" php tests/integration/p01_ia6_interrupted_restore_disposable.php
          echo P01_MODEF_DISASTER_AND_INTERRUPTED_RECOVERY=PASS

          # Run exact-source Chromium tests ONLY against new localhost installation.
          BROWSER_ROOT="$ROOT/browser-instance"
          install_site "$BROWSER_ROOT" 18973
          (cd "$BROWSER_ROOT" && php -S 127.0.0.1:18973 -t . >"$ROOT/browser-server.log" 2>&1) &
          PIDS="$PIDS $!"
          HARNESS="$ROOT/playwright-harness"
          mkdir -p "$HARNESS"
          npm install --prefix "$HARNESS" --no-save --no-audit --no-fund --silent playwright@1.56.1
          PLAYWRIGHT_BROWSERS_PATH="$ROOT/playwright-browsers" \
            "$HARNESS/node_modules/.bin/playwright" install chromium >/dev/null
          for testname in \
            p01_ia6_27_routes_11_tabs_browser.mjs \
            p01_ia6_four_fallbacks_http_browser.mjs \
            p01_ia6_legacy_bookmark_native_browser.mjs \
            p01_ia6_data_safety_readonly_parity_browser.mjs \
            p01_ia6_reversible_frontstage_browser.mjs; do
            cp "tests/integration/$testname" "$HARNESS/$testname"
            P01_TEST_ORIGIN=http://127.0.0.1:18973 P01_TEST_PASSWORD='ModeFDisposable!2026' \
              PLAYWRIGHT_BROWSERS_PATH="$ROOT/playwright-browsers" \
              node "$HARNESS/$testname"
          done
          echo P01_MODEF_OWNER_GUEST_LEGACY_BROWSER=PASS
          echo P01_MODEF_TEMP_RUNNER_NO_RELEASE=YES
      - name: Safety lifecycle
        if: always()
        shell: bash
        run: |
          echo P01_MODEF_PRODUCTION_WRITES=NONE
          echo P01_MODEF_RELEASE_WRITES=NONE
          echo P01_MODEF_PRIVATE_SOURCE_PUBLIC_ARTIFACT=NONE
          echo P01_MODEF_RUNNER_TEMPORARY_PR_CLOSE_UNMERGED=YES
