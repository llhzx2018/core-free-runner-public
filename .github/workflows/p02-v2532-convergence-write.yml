          'tests/unit/p02_candidate_version_identity_contract.mjs':'''import fs from 'node:fs';\nimport crypto from 'node:crypto';\nconst versionBytes=fs.readFileSync('VERSION'),version=versionBytes.toString('utf8').trim();const manifest=JSON.parse(fs.readFileSync('SOURCE_MANIFEST.json','utf8'));const candidate=JSON.parse(fs.readFileSync('docs/authority/P02_DEVELOP_CANDIDATE_IDENTITY.json','utf8'));const index=fs.readFileSync('public/index.php','utf8');\nif(version!=='2.5.32'||manifest.version!=='2.5.32')throw new Error('V2.5.32 identity mismatch');if(manifest.schema!==2401||manifest.runtime_source_file_count!==80)throw new Error('manifest drift');const entry=manifest.entries.find(x=>x.repo_path==='VERSION');const sha=crypto.createHash('sha256').update(versionBytes).digest('hex');if(!entry||entry.sha256!==sha||entry.repo_sha256!==sha)throw new Error('VERSION hash mismatch');if(candidate.candidate_version!=='2.5.32'||candidate.production_version!=='2.5.31'||candidate.schema!==2401||candidate.runtime_source_file_count!==80)throw new Error('candidate authority drift');if(candidate.release_prep_allowed!==false||candidate.owner_test_requested!==false)throw new Error('candidate must remain optimization-only');if(index.includes('v2521-context-ux')||fs.existsSync('public/assets/v2521-context-ux.js')||fs.existsSync('public/assets/v2521-context-ux.css'))throw new Error('companion layer still present');console.log('P02_CANDIDATE_VERSION_IDENTITY=PASS');\n''',
