name: S01-C02 ZIP operator copy isolated gate
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      db:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: fixture-root
          MARIADB_DATABASE: ops_1071_upgrade
          MARIADB_USER: vf
          MARIADB_PASSWORD: fixture-pass
        ports: ["3306:3306"]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 369492c3280a46cbe23540f9b032bbd8321b64da
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: target
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, sodium, mbstring
      - name: Verify source and static contracts
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "369492c3280a46cbe23540f9b032bbd8321b64da"
          test "$(cat target/VERSION)" = "1.21.1071"
          mkdir -p evidence
          php -l target/includes/admin-v13/views/publish_zip_v6.php
          php -l target/tests/s01-c02-1211068-zip-gate-truth-view-fixture.php
          php -l target/tests/s01-c02-1211067-zip-php-chunk-real-contract.php
          node --check target/assets/js/admin-publish-zip.js
          node --check target/tests/s01-c02-1211066-publish-zip-operator-resume-browser.js
          node --check target/tests/s01-c02-1211067-zip-input-browser-e2e.js
          node target/tests/s01-c02-1211068-zip-gate-truth-contract.js | tee evidence/zip-gates.json
          php target/tests/s01-c02-1211067-zip-php-chunk-real-contract.php | tee evidence/zip-chunk.txt
          php target/tests/s01-c02-1211069-source-semantic-freshness-isolated.php | tee evidence/source-freshness.txt
          php target/tests/s01-c02-1211058-quality-disclosure-contract.php | tee evidence/quality-disclosure.txt
          php target/tests/s01-c02-121934-shell-header-visual-lock-r45-contract.php | tee evidence/shell-freeze.txt
      - name: Prove exact browser runtime equivalence to passing Playwright source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          GH_TOKEN="$GH_READ_TOKEN" gh api 'repos/llhzx2018/vf-tools-ops/compare/9fb2880edf93cb0ba6c75876f40d10bb9b922280...369492c3280a46cbe23540f9b032bbd8321b64da' --jq '.files[].filename' | sort > evidence/ui-diff-paths.txt
          printf 'CHANGELOG.md\nVERSION\nvf-ops.php\n' > evidence/expected-version-only-paths.txt
          diff -u evidence/expected-version-only-paths.txt evidence/ui-diff-paths.txt
          test "$(gh run view 37788118041 --repo llhzx2018/core-free-runner-public --json conclusion --jq '.conclusion')" = success
          mkdir -p evidence/tested
          gh run download 37788118041 --repo llhzx2018/core-free-runner-public --name s01-c02-zip-operator-20261008 --dir evidence/tested
          jq -e '.status=="PASS" and .source_sha=="9fb2880edf93cb0ba6c75876f40d10bb9b922280" and .production=="NOT_TOUCHED"' evidence/tested/FINAL_EVIDENCE.json
          echo BROWSER_CODE_EQUIVALENT=PASS | tee evidence/browser-equivalence.txt
      - name: Build package and isolated WordPress install upgrade rollback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          python3 target/.github/release/build-ops-package.py --source target --output "$RUNNER_TEMP/vf-tools-ops_V1.21.1071.zip" | tee evidence/package.json
          unzip -tq "$RUNNER_TEMP/vf-tools-ops_V1.21.1071.zip" >/dev/null
          ROOT="$RUNNER_TEMP/ops-1071-wordpress"; mkdir -p "$ROOT" previous
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o "$ROOT/wp"
          chmod +x "$ROOT/wp"
          mysql -h127.0.0.1 -P3306 -uroot -pfixture-root -e 'CREATE DATABASE IF NOT EXISTS ops_1071_clean CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;'
          WP1="$ROOT/clean"; mkdir -p "$WP1"; wp1(){ php "$ROOT/wp" --path="$WP1" "$@"; }
          wp1 core download --version=7.0.2 --force >/dev/null
          wp1 config create --dbname=ops_1071_clean --dbuser=root --dbpass=fixture-root --dbhost=127.0.0.1:3306 --skip-check >/dev/null
          wp1 core install --url=http://127.0.0.1:18201 --title='OPS 1071 clean' --admin_user=admin --admin_password=fixture-admin --admin_email=fixture@example.invalid --skip-email >/dev/null
          wp1 plugin install "$RUNNER_TEMP/vf-tools-ops_V1.21.1071.zip" --activate >/dev/null
          wp1 eval 'if(VF_OPS_VERSION!=="1.21.1071")throw new RuntimeException("CLEAN_INSTALL_WRONG_VERSION");'
          gh release download v1.21.1070 --repo llhzx2018/vf-tools-ops --pattern vf-tools-ops_V1.21.1070.zip --dir previous --clobber
          echo '9bc122a1923c5ebc0c7b59fcb355dbca22a0045942e8ee60b15d1c9ce69cbb65  previous/vf-tools-ops_V1.21.1070.zip' | sha256sum -c -
          WP2="$ROOT/upgrade"; mkdir -p "$WP2"; wp2(){ php "$ROOT/wp" --path="$WP2" "$@"; }
          wp2 core download --version=7.0.2 --force >/dev/null
          wp2 config create --dbname=ops_1071_upgrade --dbuser=vf --dbpass=fixture-pass --dbhost=127.0.0.1:3306 --skip-check >/dev/null
          wp2 core install --url=http://127.0.0.1:18202 --title='OPS 1071 upgrade' --admin_user=admin --admin_password=fixture-admin --admin_email=fixture@example.invalid --skip-email >/dev/null
          wp2 plugin install "$GITHUB_WORKSPACE/previous/vf-tools-ops_V1.21.1070.zip" --activate >/dev/null
          wp2 option update vf_ops_1071_sentinel preserved >/dev/null
          wp2 eval 'if(VF_OPS_VERSION!=="1.21.1070")throw new RuntimeException("BASE_WRONG_VERSION");'
          wp2 plugin install "$RUNNER_TEMP/vf-tools-ops_V1.21.1071.zip" --force >/dev/null
          wp2 eval 'if(VF_OPS_VERSION!=="1.21.1071"||get_option("vf_ops_1071_sentinel")!=="preserved")throw new RuntimeException("UPGRADE_OR_DATA_LOSS");'
          wp2 plugin install "$GITHUB_WORKSPACE/previous/vf-tools-ops_V1.21.1070.zip" --force >/dev/null
          wp2 eval 'if(VF_OPS_VERSION!=="1.21.1070"||get_option("vf_ops_1071_sentinel")!=="preserved")throw new RuntimeException("ROLLBACK_OR_DATA_LOSS");'
          echo INSTALL_UPGRADE_ROLLBACK=PASS | tee evidence/install-upgrade-rollback.txt
      - name: Seal exact-source evidence
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('evidence')
          bridge=(root/'browser-equivalence.txt')
          ok=bridge.is_file() and 'BROWSER_CODE_EQUIVALENT=PASS' in bridge.read_text()
          install=(root/'install-upgrade-rollback.txt')
          ok=ok and install.is_file() and 'INSTALL_UPGRADE_ROLLBACK=PASS' in install.read_text()
          gate=(root/'zip-gates.json')
          try: ok=ok and json.loads(gate.read_text())['pass'] is True
          except Exception: ok=False
          result={'schema':'s01-c02-zip-operator-isolated/v1','source_sha':'369492c3280a46cbe23540f9b032bbd8321b64da','status':'PASS' if ok else 'FAIL','production':'NOT_TOUCHED','owner_pass':False}
          (root/'FINAL_EVIDENCE.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(result,ensure_ascii=False))
          if not ok: raise SystemExit(1)
          PY
      - name: Upload isolated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s01-c02-zip-operator-20261008
          path: evidence/
          retention-days: 14
