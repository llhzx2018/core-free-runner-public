name: S01-C02 ZIP operator copy isolated gate
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 9fb2880edf93cb0ba6c75876f40d10bb9b922280
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: target
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, sodium, mbstring
      - name: Verify source and static contracts
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "9fb2880edf93cb0ba6c75876f40d10bb9b922280"
          test "$(cat target/VERSION)" = "1.21.1070"
          mkdir -p evidence
          php -l target/includes/admin-v13/views/publish_zip_v6.php
          php -l target/tests/s01-c02-1211068-zip-gate-truth-view-fixture.php
          php -l target/tests/s01-c02-1211067-zip-php-chunk-real-contract.php
          node --check target/assets/js/admin-publish-zip.js
          node --check target/tests/s01-c02-1211066-publish-zip-operator-resume-browser.js
          node --check target/tests/s01-c02-1211067-zip-input-browser-e2e.js
          node target/tests/s01-c02-1211068-zip-gate-truth-contract.js | tee evidence/zip-gates.json
          php target/tests/s01-c02-1211067-zip-php-chunk-real-contract.php | tee evidence/zip-chunk.txt
          php target/tests/s01-c02-1211069-source-semantic-freshness-isolated.php | tee evidence/source-freshness.txt
          php target/tests/s01-c02-1211058-quality-disclosure-contract.php | tee evidence/quality-disclosure.txt
          php target/tests/s01-c02-121934-shell-header-visual-lock-r45-contract.php | tee evidence/shell-freeze.txt
      - name: Real browser ZIP and quality regressions
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/zip-operator-node
          cd /tmp/zip-operator-node
          npm init -y >/dev/null
          npm install --no-save playwright@1.58.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          export NODE_PATH=/tmp/zip-operator-node/node_modules
          cd "$GITHUB_WORKSPACE"
          node target/tests/s01-c02-1211066-publish-zip-operator-resume-browser.js | tee evidence/zip-manual-resume.json
          node target/tests/s01-c02-1211067-zip-input-browser-e2e.js | tee evidence/zip-upload.json
          node target/tests/s01-c02-1211070-quality-native-disclosure-browser.js | tee evidence/quality-native.json
          jq -e '.pass==true' evidence/zip-manual-resume.json
          jq -e '.pass==true' evidence/zip-upload.json
          jq -e '.pass==true' evidence/quality-native.json
      - name: Seal exact-source evidence
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('evidence')
          browser=['zip-manual-resume.json','zip-upload.json','quality-native.json']
          try: ok=all(json.loads((root/n).read_text())['pass'] is True for n in browser)
          except Exception: ok=False
          gate=(root/'zip-gates.json')
          try: ok=ok and json.loads(gate.read_text())['pass'] is True
          except Exception: ok=False
          result={'schema':'s01-c02-zip-operator-isolated/v1','source_sha':'9fb2880edf93cb0ba6c75876f40d10bb9b922280','status':'PASS' if ok else 'FAIL','production':'NOT_TOUCHED','owner_pass':False}
          (root/'FINAL_EVIDENCE.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(result,ensure_ascii=False))
          if not ok: raise SystemExit(1)
          PY
      - name: Upload isolated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s01-c02-zip-operator-20261008
          path: evidence/
          retention-days: 14
