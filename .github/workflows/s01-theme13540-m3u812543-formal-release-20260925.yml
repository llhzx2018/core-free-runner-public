name: S01 Theme 1.35.40 M3U8 1.25.43 Formal Release

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/s01-theme13540-m3u812543-formal-release-20260925.yml'

permissions:
  contents: read

jobs:
  formal-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Checkout Theme exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: f8b0cbc60570f01839aba238dedc0a02a3355402
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: theme

      - name: Checkout M3U8 exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: 4b2f306fcc987e8ba133859bfc4b0a1448243167
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: m3u8

      - name: Exact source gates
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C theme rev-parse HEAD)" = "f8b0cbc60570f01839aba238dedc0a02a3355402"
          test "$(git -C m3u8 rev-parse HEAD)" = "4b2f306fcc987e8ba133859bfc4b0a1448243167"
          test "$(tr -d '\r\n' < theme/VERSION)" = "1.35.40"
          test "$(tr -d '\r\n' < m3u8/VERSION)" = "1.25.43"
          grep -Fq "Version: 1.35.40" theme/src/style.css
          grep -Fq "V1.35.40_S01_THEME_HEADER_IA_R13" theme/src/style.css
          grep -Fq "V1.35.40_S01_THEME_HEADER_IA_R13" theme/src/inc/runtime-constants.php
          grep -Fq '"vfThemeVersion": "1.35.40"' theme/src/theme.json
          grep -Fq "Version: 1.25.43" m3u8/src/vf-tool-m3u8.php
          grep -Fq "VF_TOOL_M3U8_VERSION', '1.25.43'" m3u8/src/vf-tool-m3u8.php
          grep -Fq "VF_TOOL_M3U8_ROUND', 'R265'" m3u8/src/vf-tool-m3u8.php
          grep -Fq "OWNER_PREVIEW_RUNTIME_APPLICABILITY = N_A" theme/docs/authority/SSOT.md
          grep -Fq "OWNER_PREVIEW_RUNTIME_APPLICABILITY = N_A" m3u8/docs/authority/SSOT.md
          php theme/tests/s01-c01-admin-shell-alignment-r1-contract.php
          php theme/tests/final-admin-human-closure-contract.php
          php theme/tests/recovery-workflow-v4-contract.php
          php m3u8/tests/s01-c03-admin-shell-alignment-r1-contract.php
          php m3u8/tests/unit/admin-human-language-contract.php
          php m3u8/tests/unit/update-schema-authority-contract.php
          php m3u8/tests/unit/package-physical-locator-contract.php
          find theme/src m3u8/src -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l >/dev/null
          if git -C theme grep -I -nE '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{50,}|AKIA[0-9A-Z]{16})' -- src; then exit 51; fi
          if git -C m3u8 grep -I -nE '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{50,}|AKIA[0-9A-Z]{16})' -- src; then exit 52; fi
          echo EXACT_SOURCE_GATE=PASS

      - name: Rollback source availability
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/rollback-theme" "$RUNNER_TEMP/rollback-m3u8"
          gh release download v1.35.38 --repo llhzx2018/vf-tools-theme --pattern vf-tools-theme_V1.35.38.zip --dir "$RUNNER_TEMP/rollback-theme"
          gh release download v1.25.41 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.41.zip --dir "$RUNNER_TEMP/rollback-m3u8"
          unzip -p "$RUNNER_TEMP/rollback-theme/vf-tools-theme_V1.35.38.zip" vf-tools-theme/style.css | grep -Fq "Version: 1.35.38"
          unzip -p "$RUNNER_TEMP/rollback-m3u8/vf-tools-m3u8_V1.25.41.zip" vf-tool-m3u8/vf-tool-m3u8.php | grep -Fq "Version: 1.25.41"
          echo ROLLBACK_SOURCE_GATE=PASS

      - name: Build deterministic packages
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/releases"
          cat > "$RUNNER_TEMP/build_release.py" <<'PY'
          import hashlib,json,pathlib,re,sys,zipfile
          kind,src_s,out_s,root_name=sys.argv[1:]
          src=pathlib.Path(src_s); out=pathlib.Path(out_s)
          files=sorted((p for p in src.rglob('*') if p.is_file()),key=lambda p:p.relative_to(src).as_posix())
          def make(path):
              with zipfile.ZipFile(path,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
                  if kind=='m3u8':
                      d=zipfile.ZipInfo(root_name+'/',date_time=(1980,1,1,0,0,0)); d.external_attr=(0o40755<<16)|0x10
                      z.writestr(d,b'')
                  for p in files:
                      rel=p.relative_to(src).as_posix()
                      zi=zipfile.ZipInfo(root_name+'/'+rel,date_time=(1980,1,1,0,0,0))
                      zi.compress_type=zipfile.ZIP_DEFLATED; zi.create_system=3; zi.external_attr=0o100644<<16
                      z.writestr(zi,p.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          a=out.with_suffix('.a.zip'); b=out.with_suffix('.b.zip')
          make(a); make(b)
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          assert sha(a)==sha(b)
          out.write_bytes(a.read_bytes())
          def runtime(rel):
              if re.search(r'(^|/)(?:\.git|\.github|tests?|docs?|evidence|private|tmp|temp|cache|logs?)(/|$)',rel,re.I): return False
              base=pathlib.PurePosixPath(rel).name.lower()
              excluded={'readme.md','changelog.md','license','license.txt'}
              if kind=='m3u8': excluded.add('package_profile.json')
              if base in excluded: return False
              if re.search(r'\.(?:sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',rel,re.I): return False
              if '/' not in rel:
                  if kind=='theme': return rel=='style.css' or rel.lower().endswith('.php')
                  return rel in {'vf-tool-m3u8.php','uninstall.php','plugin-manifest.json','tool-settings.schema.json'}
              prefixes=('inc','assets','config','languages','template-parts','templates') if kind=='theme' else ('admin','config','includes','public','templates','tools')
              return rel.split('/',1)[0] in prefixes
          rows=[]
          for p in files:
              rel=p.relative_to(src).as_posix()
              if runtime(rel): rows.append((rel,hashlib.sha256(p.read_bytes()).hexdigest()))
          canon=''.join(rel+'\0'+h+'\n' for rel,h in rows).encode()
          meta={
            'kind':kind,'asset_name':out.name,'asset_bytes':out.stat().st_size,'asset_sha256':sha(out),
            'package_files':len(files),'runtime_files':len(rows),'runtime_fingerprint':hashlib.sha256(canon).hexdigest()
          }
          out.with_suffix('.json').write_text(json.dumps(meta,indent=2)+'\n')
          print(json.dumps(meta))
          PY
          python3 "$RUNNER_TEMP/build_release.py" theme theme/src "$RUNNER_TEMP/releases/vf-tools-theme_V1.35.40.zip" vf-tools-theme
          python3 "$RUNNER_TEMP/build_release.py" m3u8 m3u8/src "$RUNNER_TEMP/releases/vf-tools-m3u8_V1.25.43.zip" vf-tool-m3u8
          unzip -t "$RUNNER_TEMP/releases/vf-tools-theme_V1.35.40.zip" >/dev/null
          unzip -t "$RUNNER_TEMP/releases/vf-tools-m3u8_V1.25.43.zip" >/dev/null
          unzip -p "$RUNNER_TEMP/releases/vf-tools-theme_V1.35.40.zip" vf-tools-theme/style.css | grep -Fq "Version: 1.35.40"
          unzip -p "$RUNNER_TEMP/releases/vf-tools-m3u8_V1.25.43.zip" vf-tool-m3u8/vf-tool-m3u8.php | grep -Fq "Version: 1.25.43"
          cat "$RUNNER_TEMP/releases/vf-tools-theme_V1.35.40.json"
          cat "$RUNNER_TEMP/releases/vf-tools-m3u8_V1.25.43.json"
          echo DETERMINISTIC_PACKAGE_GATE=PASS

      - name: Create or verify exact releases
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          release_exact () {
            repo="$1"; tag="$2"; sha="$3"; asset="$4"; title="$5"; notes="$6"; local_file="$RUNNER_TEMP/releases/$asset"
            if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
              echo "REUSE_EXISTING_RELEASE $repo $tag"
            else
              gh release create "$tag" "$local_file#$asset" --repo "$repo" --target "$sha" --title "$title" --notes "$notes"
            fi
            test "$(gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.sha')" = "$sha"
            json="$(gh api "repos/$repo/releases/tags/$tag")"
            python3 - "$json" "$tag" "$asset" "$repo" <<'PY'
          import json,sys
          x=json.loads(sys.argv[1]); tag,asset,repo=sys.argv[2:]
          assert x['tag_name']==tag and not x['draft'] and not x['prerelease']
          m=[a for a in x.get('assets',[]) if a['name']==asset]
          assert len(m)==1
          print(repo+' RELEASE_ID='+str(x['id']))
          print(repo+' ASSET_ID='+str(m[0]['id']))
          print(repo+' REMOTE_BYTES='+str(m[0]['size']))
          PY
            rm -rf "$RUNNER_TEMP/remote-$tag"; mkdir -p "$RUNNER_TEMP/remote-$tag"
            gh release download "$tag" --repo "$repo" --pattern "$asset" --dir "$RUNNER_TEMP/remote-$tag"
            cmp "$local_file" "$RUNNER_TEMP/remote-$tag/$asset"
          }
          release_exact llhzx2018/vf-tools-theme v1.35.40 f8b0cbc60570f01839aba238dedc0a02a3355402 vf-tools-theme_V1.35.40.zip "VF Tools Theme V1.35.40" "S01-C01 Header/Menu IA Closure. Six daily Theme destinations plus Validation & Maintenance. Page-content visual refinement is out of scope. OWNER preview runtime is N/A by stable SSOT; final Production OWNER visual acceptance remains pending."
          release_exact llhzx2018/vf-tools-m3u8 v1.25.43 4b2f306fcc987e8ba133859bfc4b0a1448243167 vf-tools-m3u8_V1.25.43.zip "VF Tools M3U8 V1.25.43" "S01-C03 Header/Menu IA Closure. Professional Mode has seven canonical destinations; Runtime+Boundary and Diagnostics+Performance are merged with compatibility aliases preserved. Schema remains 1.3.0. OWNER preview runtime is N/A by stable SSOT; final Production OWNER visual acceptance remains pending."
          echo FORMAL_RELEASE_REMOTE_READBACK=PASS

      - name: Build release receipts
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/receipts"
          python3 - "$RUNNER_TEMP/releases/vf-tools-theme_V1.35.40.json" "$(gh api repos/llhzx2018/vf-tools-theme/releases/tags/v1.35.40)" "$RUNNER_TEMP/receipts/theme.json" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1])); r=json.loads(sys.argv[2]); a=[x for x in r['assets'] if x['name']==m['asset_name']][0]
          m.update(release_id=r['id'],asset_id=a['id'],tag=r['tag_name'],source_sha='f8b0cbc60570f01839aba238dedc0a02a3355402',version='1.35.40')
          json.dump(m,open(sys.argv[3],'w'),indent=2)
          PY
          python3 - "$RUNNER_TEMP/releases/vf-tools-m3u8_V1.25.43.json" "$(gh api repos/llhzx2018/vf-tools-m3u8/releases/tags/v1.25.43)" "$RUNNER_TEMP/receipts/m3u8.json" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1])); r=json.loads(sys.argv[2]); a=[x for x in r['assets'] if x['name']==m['asset_name']][0]
          m.update(release_id=r['id'],asset_id=a['id'],tag=r['tag_name'],source_sha='4b2f306fcc987e8ba133859bfc4b0a1448243167',version='1.25.43',schema_from='1.3.0',schema_to='1.3.0')
          json.dump(m,open(sys.argv[3],'w'),indent=2)
          PY
          cat "$RUNNER_TEMP/receipts/theme.json"
          cat "$RUNNER_TEMP/receipts/m3u8.json"

      - name: Upload release receipts
        uses: actions/upload-artifact@v4
        with:
          name: s01-header-ia-formal-release-receipts
          path: ${{ runner.temp }}/receipts
          retention-days: 14
