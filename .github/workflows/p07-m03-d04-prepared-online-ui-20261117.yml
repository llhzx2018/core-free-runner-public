name: P07 M03 D04 exact online private refresh and terminal UX
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p07-m03-d04-prepared-online-ui-20261117.yml']
permissions:
  contents: read
jobs:
  exact-online-refresh-and-no-cutover:
    if: github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      NO_COLOR: '1'
    steps:
      - name: Public test infrastructure checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact transient P07 private HEAD checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: '1fabe5c91e487d522a43200af9e0e20b40316597'
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: .p07-private
      - name: Current GOV-DOC authority checkout for actual Git diff scope
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: .gov-current
      - name: Actual Git base-to-head architecture naming and ownership gate
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C .p07-private cat-file -e 'a6da82f35fdbd06020a7e65c8cbd5717f617f2f3^{commit}'
          python3 -B .p07-private/.github/checks/architecture_gate.py \
            --manifest .p07-private/.github/checks/code_architecture.json \
            --gov-root .gov-current --git-root .p07-private \
            --base-sha a6da82f35fdbd06020a7e65c8cbd5717f617f2f3 \
            --head-sha 1fabe5c91e487d522a43200af9e0e20b40316597
      - name: Changed scope and Python shell safety checks
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-private rev-parse HEAD)" = '1fabe5c91e487d522a43200af9e0e20b40316597'
          cd .p07-private
          test "$(cat BUILD_ID)" = '0.1.0-release137'
          python3 -B -m unittest discover -s tests -p 'test_p07_m03_d04_prepared_online_*.py' -v
          python3 -B -m unittest discover -s tests -p 'test_p07_m03_d04_whole_vps_online_*.py' -v
          python3 -B -m unittest discover -s tests -p 'test_p07_m03_d04_whole_file_private_snapshot.py' -v
          python3 -B -m unittest discover -s tests -p 'test_p07_m03_d04_prepared_static_online_snapshot.py' -v
          python3 -B -m unittest discover -s tests -p 'test_p07_m03_d04_prepared_sqlite_online_snapshot.py' -v
          python3 -B -m unittest discover -s tests -p 'test_p07_m03_d04_mysql_online_private_snapshot.py' -v
          python3 -B -m unittest discover -s tests -p 'test_p07_m03_d04_final_sync_guard.py' -v
          python3 -B scripts/check_p07_modules.py
          python3 -B scripts/check_p07_terminal_ux.py
          bash -n bin/vfops-migrate-ui
          python3 -B -m py_compile lib/migration_prepared_online_refresh.py lib/migration_prepared_whole_vps_refresh.py lib/migration_prepared_whole_file_snapshot.py lib/server_migration_pull.py
          bash -n bin/vfops-migrate-ui
          echo P07_D04_WHOLE_VPS_PRIVATE_WARM_SNAPSHOT_AND_TTY=PASS
      - name: Exact M03-only candidate runtime transitive closure check without distribution
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$RUNNER_TEMP/p07-online-r137"
          python3 -B .p07-private/scripts/p07_candidate_bundle.py \
            --product-root .p07-private --public-root . \
            --output "$stage" \
            --product-sha '1fabe5c91e487d522a43200af9e0e20b40316597' \
            --build 0.1.0-release137 --care 0.1.0-rc85 --m03-only
          python3 -B - <<'PY'
          import os,hashlib,json,pathlib
          stage=pathlib.Path(os.environ['RUNNER_TEMP'])/'p07-online-r137'
          a=json.loads((stage/'candidate_attestation.json').read_text())
          assert a['status']=='FORMAL_STAGING_NOT_PUBLISHED'
          assert a['product_source_sha']=='1fabe5c91e487d522a43200af9e0e20b40316597'
          assert a['product_build']=='0.1.0-release137'
          assert a['independent_module_only'] and not a['other_modules_changed']
          p=stage/'dist/p07/0.1.0/overlay'
          m=(p/'RUNTIME.gitblob').read_text().splitlines()
          names=set()
          for line in m:
              h,path=line.split('  ',1)
              data=(p/path).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==h,path
              names.add(path)
          assert {'lib/migration_prepared_online_refresh.py','lib/migration_prepared_whole_vps_refresh.py',
                  'lib/migration_prepared_whole_file_snapshot.py','lib/server_migration_pull.py',
                  'bin/vfops-migrate-ui','lib/migration_final_sync_guard.py','BUILD_ID'} <= names
          assert not (stage/'installers/p07-toolbox.sh').exists()
          assert not (stage/'installers/p07-system-care.sh').exists()
          print('P07_M03_D04_ONLINE_REFRESH_RUNTIME_CLOSURE=PASS')
          print('P07_M03_D04_OTHER_FOUR_MODULES_UNCHANGED=PASS')
          print('P07_M03_D04_PUBLIC_RELEASE=NOT_RUN')
          PY
      - name: Clean transient private checkout and synthetic output
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- .p07-private .gov-current "$RUNNER_TEMP/p07-online-r137"
          test ! -e .p07-private
          test ! -e .gov-current
          echo P07_ONLINE_REFRESH_PRIVATE_WORKSPACE_CLEAN=PASS
