name: S01-C01 v1.35.134 Release install-upgrade-rollback gate
on:
  push:
    branches: [task/s01-frontend-design-20261017]
    paths: ['.github/workflows/s01-theme-v135134-upgrade.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Download two private formal releases
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/old artifacts/new
          gh release download v1.35.133 --repo llhzx2018/vf-tools-theme --pattern 'vf-tools-theme_V1.35.133.zip' --dir artifacts/old
          gh release download v1.35.134 --repo llhzx2018/vf-tools-theme --pattern 'vf-tools-theme_V1.35.134.zip' --dir artifacts/new
          echo '8a36ef59971316b7aa69c4f1df78f9305ee25097cc10f379156025ff151c8f3f  artifacts/old/vf-tools-theme_V1.35.133.zip' | sha256sum -c
          echo '0ac191879cdb88f95350b29e3539a6f9bbb165b06867d25169c44c355b2472de  artifacts/new/vf-tools-theme_V1.35.134.zip' | sha256sum -c
      - name: Deterministic clean install, upgrade and rollback verification
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile
          from tempfile import TemporaryDirectory
          old=pathlib.Path('artifacts/old/vf-tools-theme_V1.35.133.zip')
          new=pathlib.Path('artifacts/new/vf-tools-theme_V1.35.134.zip')
          with TemporaryDirectory() as directory:
              root=pathlib.Path(directory)
              for version,file in [('1.35.133',old),('1.35.134',new)]:
                  dest=root/version
                  with zipfile.ZipFile(file) as z:
                      assert z.testzip() is None
                      assert all(p.startswith('vf-tools-theme/') and '..' not in pathlib.PurePosixPath(p).parts for p in z.namelist())
                      z.extractall(dest)
                  assert 'Version: '+version in (dest/'vf-tools-theme/style.css').read_text()
                  assert (dest/'vf-tools-theme/functions.php').is_file()
              base=root/'1.35.133/vf-tools-theme';current=root/'1.35.134/vf-tools-theme'
              assert hashlib.sha256((current/'style.css').read_bytes()).digest()!=hashlib.sha256((base/'style.css').read_bytes()).digest()
              receipt={'status':'PASS','release_previous':'1.35.133','release_target':'1.35.134','clean_package_structure':'PASS','file_upgrade_extract':'PASS','rollback_archive_integrity':'PASS','wordpress_runtime_upgrade':'NOT_TESTED','native_update_discovery':'NOT_TESTED','production':'UNTOUCHED'}
              print(json.dumps(receipt))
          PY
      - name: Delete private ZIPs and temporary files
        if: always()
        run: rm -rf artifacts
