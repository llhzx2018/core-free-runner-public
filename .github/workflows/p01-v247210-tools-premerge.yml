name: p01-v247210-tools-premerge

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v247210-tools-premerge.yml'

permissions:
  contents: read

jobs:
  exact-source-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      TARGET_SHA: 9d88e440b639317e74fad47c8ee736bcbc09ae7b
      TARGET_VERSION: 2.47.210
      BASE_TAG: v2.47.209
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare PHP
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd unzip >/dev/null
          php -m | grep -Fx pdo_sqlite
          php -m | grep -Fx sqlite3
          echo P01_PREMERGE_RUNTIME=PASS

      - name: Resolve exact private source transiently
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" candidate
          git -C candidate fetch -q --depth 1 origin "$TARGET_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "$TARGET_VERSION"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "$TARGET_VERSION"
          git clone -q --depth 1 --branch "$BASE_TAG" "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" stable
          echo P01_PREMERGE_EXACT_SOURCE=PASS

      - name: Syntax and focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          find src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          php tests/unit/tools_toolbox_manager_v247210_contract.php | tee /tmp/p01-tools-manager.txt
          grep -Fx 'P01_TOOLS_TOOLBOX_MANAGER_V247210=PASS' /tmp/p01-tools-manager.txt
          php tests/unit/tool_scene_context_consistency_contract.php | tee /tmp/p01-tool-scene.txt
          grep -Fx 'TOOL_SCENE_CONTEXT_CONSISTENCY_PASS' /tmp/p01-tool-scene.txt
          echo P01_PREMERGE_FOCUSED=PASS

      - name: Canonical zero-debt regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          bash tests/canonical_release_regression.sh . "$GITHUB_WORKSPACE/stable" --require-zero-debt | tee /tmp/p01-canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/p01-canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/p01-canonical.txt
          echo P01_PREMERGE_CANONICAL=PASS

      - name: Final source-boundary assertions
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          grep -F "!array_key_exists('surface', \$asset)" src/app/ToolboxConfig.php >/dev/null
          grep -F "(string)\$asset['surface'] !== 'start'" src/app/ToolboxConfig.php >/dev/null
          ! grep -F -- '->saveLink(' src/toolbox-manager.php
          ! grep -Eqi 'CREATE TABLE|UPDATE LINKS|INSERT INTO LINKS|DELETE FROM LINKS' src/app/ToolboxConfig.php
          echo P01_PREMERGE_PRESENTATION_ONLY=PASS
