name: S01-C01 WP Online Update Reference

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/s01-c01-wp-online-update-reference.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout public runner
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: runner

      - name: Checkout exact private S01-C01 candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: af7e8fbb470f858fa133b0c2ea323c1445518965
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product

      - name: Verify exact candidate identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = 'af7e8fbb470f858fa133b0c2ea323c1445518965'
          test "$(tr -d '\r\n' < product/VERSION)" = '1.35.8'
          echo 'S01_C01_PRIVATE_SOURCE_IDENTITY=PASS'

      - name: Prepare runner dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-zip >/dev/null
          php -v
          php -m | grep -qi '^zip$'
          docker version
          google-chrome --version || google-chrome-stable --version || chromium --version

      - name: Execute exact WordPress update reference suite
        shell: bash
        working-directory: product
        run: bash tests/wp-update/run.sh

      - name: Scrub public evidence boundary
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -d evidence/wp-update ]; then
            rm -rf evidence/wp-update/*/packages
            find evidence/wp-update -type f \( -name '*.zip' -o -name '*.php' -o -name '*.sql' -o -name '*.sqlite*' -o -name '*.db' \) -delete
            ! grep -RIl --exclude='*.png' --exclude='*.jpg' --exclude='*.jpeg' 'runner-private-token' evidence/wp-update >/dev/null 2>&1
          fi
          echo 'S01_C01_PUBLIC_EVIDENCE_SCRUB=PASS'

      - name: Upload public-safe evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s01-c01-wp-online-update-public-safe-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/wp-update/
          if-no-files-found: warn
          retention-days: 30
