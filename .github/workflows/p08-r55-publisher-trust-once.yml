name: P08 R55 publisher trust pre-release strict check (one-off)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p08-r55-publisher-trust-once.yml'
permissions:
  contents: read
jobs:
  release-trust:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout temporary test lane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout exact private P08 PR 22 head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-adops
          ref: a71f8b9d16726279488e8f216d37d7109e5dfa84
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-p08
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: none
          coverage: none
          extensions: sodium, zip
      - name: Execute exact-source publisher trust and hard negative tests
        run: |
          set -euo pipefail
          cd private-p08
          test "$(git rev-parse HEAD)" = "a71f8b9d16726279488e8f216d37d7109e5dfa84"
          test "$(cat VERSION)" = 0.1.1
          grep -Fq 'PUBLIC_KEY_HEX = null' src/Upgrade/UpdateAuthority.php
          php -l scripts/check_atomic_publisher_trust.php
          php -l tests/test_atomic_publisher_trust.php
          php tests/test_atomic_publisher_trust.php
          bash scripts/dev_check.sh > "$RUNNER_TEMP/p08-r55-dev.log" 2>&1 || { tail -n 45 "$RUNNER_TEMP/p08-r55-dev.log"; exit 1; }
          grep -F 'R1_LOCAL_SOURCE_TESTS=PASS' "$RUNNER_TEMP/p08-r55-dev.log"
          python3 scripts/check_stack_contract.py --phase mature
          echo P08_R55_REAL_SOURCE_TEST_GATE=PASS
          echo P08_R55_OFFICIAL_KEY_AND_RELEASE=NOT_CONFIGURED
      - name: Cleanup private product source and logs
        if: always()
        run: |
          rm -rf private-p08
          rm -f "$RUNNER_TEMP/p08-r55-dev.log"
          echo P08_R55_TEMP_PRIVATE_SOURCE_CLEANUP=COMPLETE
