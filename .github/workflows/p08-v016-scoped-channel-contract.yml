name: P08 v016 isolated exact single-case empty normal-client Atomic contract
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p08-v016-scoped-channel-contract.yml
permissions:
  contents: read
jobs:
  p08-v016-real-contract:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-v016-scoped-channel-contract-20261121'
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout disposable public-safe harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout private core-updates EXACT proposed PR 993 SHA only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: decdd230e671001596daadd95f82f93af6fec130
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
      - name: PHP 8.4 native shared UpdateCore
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: openssl,curl,mbstring,zip
          coverage: none
      - name: Native manifest audit, Draft 2020 JSONSchema, shared PHP and P08 negative tests
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(id -u)" -ne 0
          test "$(git -C target rev-parse HEAD)" = decdd230e671001596daadd95f82f93af6fec130
          test "$(git -C target diff --name-only)" = ""
          d="$RUNNER_TEMP/p08-v016-channel-contract"
          mkdir -m 700 "$d"
          (cd target && python3 -B scripts/check_manifest_contract.py) > "$d/manifest-audit.json"
          python3 - "$d/manifest-audit.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['status']=='PASS' and d['manifest_count']>=2
          assert all(not x['failures'] for x in d['results'])
          print('P08_V016_NEW_SCOPED_RULE_ALL_CHANNELS_MANIFEST_AUDIT=PASS')
          PY
          python3 -m pip install --disable-pip-version-check --quiet --target "$d/jsonschema" jsonschema==4.25.1 > "$d/pip.log" 2>&1
          if ! (cd target && PYTHONPATH="$GITHUB_WORKSPACE/target:$d/jsonschema" python3 -B -m unittest discover -s tests -p test_p08_v016_zero_normal_client.py -v) > "$d/p08-tests.log" 2>&1; then
            python3 - "$d/p08-tests.log" <<'PY'
          import re,sys
          for line in open(sys.argv[1],errors="replace"):
              if re.match(r"^(FAIL|ERROR): test_|^AssertionError:|^FAILED \(|^Ran [0-9]+ tests",line):
                  print("P08_CONTRACT_ISOLATED_TEST_ERROR="+line.strip()[:220])
          PY
            exit 12
          fi
          grep -q '^OK$' "$d/p08-tests.log"
          ! grep -q 'skipped=' "$d/p08-tests.log"
          echo P08_V016_ONE_CASE_SCHEMA_REAL_DRAFT2020_AND_NEGATIVE_MATRIX=PASS
          php -l target/update-core/php/src/UpdateCore.php > /dev/null
          php -l target/update-core/php/tests/run.php > /dev/null
          php target/update-core/php/tests/run.php > "$d/php-tests.log" 2>&1
          grep -q UPDATE_CORE_V1_TESTS_PASS "$d/php-tests.log"
          grep -q 'P08 unsafe v015 update cannot run any data-writing adapter' "$d/php-tests.log"
          echo P08_V016_SHARED_PHP_REAL_CHECK_AND_APPLY_NO_WRITES=PASS
          test -z "$(git -C target status --porcelain --untracked-files=all)"
          echo P08_V016_EXACT_PRIVATE_SOURCE_CLEAN=PASS
      - name: Verify immutable official v016 GitHub Release and candidate exact assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          d="$RUNNER_TEMP/p08-v016-channel-contract"
          gh api repos/llhzx2018/vf-adops/releases/tags/v0.1.16 > "$d/release.json"
          gh api repos/llhzx2018/vf-adops/git/ref/tags/v0.1.16 > "$d/tag.json"
          python3 - "$d/release.json" "$d/tag.json" target/projects/P08-ADOPS.json <<'PY'
          import json,sys
          rel,tag,chan=(json.load(open(p)) for p in sys.argv[1:])
          assert tag['object']['sha']==chan['target_sha']=='ed96b18627cd0a63b1da20a1fd8c9b6c1808f159'
          assert rel['id']==chan['release_id']==453771143 and rel['tag_name']=='v0.1.16'
          assert rel['draft'] is False and rel['prerelease'] is False
          assets={a['name']:a for a in rel['assets']}
          assert set(assets)=={'VF_AdOps_V0.1.16_FULL.zip','VF_AdOps_V0.1.16_UPDATE.zip',
                              'RELEASE_NOTES.md','RELEASE_PROVENANCE.json','SHA256SUMS'}
          for prefix in ('', 'full_'):
            name=chan[prefix+'asset_name']
            asset=assets[name]
            assert asset['id']==chan[prefix+'asset_id']
            assert asset['size']==chan[prefix+'asset_bytes']
            assert asset['digest']=='sha256:'+chan[prefix+'asset_sha256']
          assert chan['update_type']=='ATOMIC' and chan['from_versions']==[]
          assert chan['source_sha']=='369fcb0aa8fef71b0a2b79c2b7a6c473d2527c3e'
          assert chan['source_full_manifest_sha256']=='6cd31e18a625e799923360892121fe5f8220714f3395a7441a59d8f5b4751e4a'
          assert chan['production_auto_apply'] is False
          assert chan['backup_required'] is True and chan['rollback_supported'] is True
          print('P08_V016_GENUINE_OFFICIAL_RELEASE_AND_NO_OLD_CLIENT_CHANNEL=PASS')
          PY
      - name: Erase transient private source, all logs and dependency files
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- target "$RUNNER_TEMP/p08-v016-channel-contract"
          test ! -e target
          echo P08_V016_SCOPED_CONTRACT_PRIVATE_WORKSPACE_CLEANUP=PASS
