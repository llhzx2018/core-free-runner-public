      - name: Commit and push docs-only authority
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          cd p01
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add README.md AGENTS.md CHANGELOG.md VF_PROJECT.json docs/README.md docs/authority/CURRENT.md docs/authority/ACCEPTANCE_MATRIX.md docs/authority/RPD.md docs/authority/SSOT.md docs/architecture/P01_MULTI_SURFACE_ARCHITECTURE.md docs/architecture/README.md docs/evidence/P01_V2.25.0_VF_TEAL_UI_AUDIT_20260828.json
          git diff --cached --check
          git commit -m 'docs(P01): sync V2.25 VF teal UX UI authority'
          git push origin HEAD:"$BRANCH"
          echo "DOCS_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verdict
