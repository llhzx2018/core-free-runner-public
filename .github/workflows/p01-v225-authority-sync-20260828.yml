name: P01 V2.25 VF Teal Authority Sync
on:
  push:
    branches: [task/p01-v222-multi-surface-gate-20260828]
    paths: ['.github/workflows/p01-v225-authority-sync-20260828.yml']
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      EXACT_SOURCE: d3904c4e7a9c44aaed5da9c4653c99c5a5a83bb8
      BRANCH: feature/p01-v2.25.0-vf-teal-rebaseline-20260828
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01
      - name: Verify exact functional source
        run: |
          set -Eeuo pipefail
          cd p01
          test "$(git rev-parse HEAD)" = "$EXACT_SOURCE"
          echo P01_V225_DOC_BASE=PASS
      - name: Synchronize current authority documents
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p01
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          SOURCE='d3904c4e7a9c44aaed5da9c4653c99c5a5a83bb8'
          UI1=33157340401
          UI2=33157677144
          def overlay(path, block):
              p=Path(path); t=p.read_text(encoding='utf-8')
              t=re.sub(r'\n?<!-- V225:BEGIN -->.*?<!-- V225:END -->\n?', '\n', t, flags=re.S)
              lines=t.splitlines()
              pos=1
              while pos < len(lines) and lines[pos].strip()=='' : pos+=1
              lines[pos:pos]=['','<!-- V225:BEGIN -->',block.strip(),'<!-- V225:END -->','']
              p.write_text('\n'.join(lines).rstrip()+'\n',encoding='utf-8')
          Path('docs/authority/CURRENT.md').write_text(f'''# P01 · VF Start · Current Authority

> 更新时间：2026-08-28
> 状态：`CURRENT / V2.24.0 OWNER PRODUCTION / V2.25.0 VF TEAL WHOLE-SITE CANDIDATE`

## 1. Current Truth

```text
Owner Production Runtime: V2.24.0
Owner Production Schema: 2026082801
Formal Release: V2.24.0 / PASS
Release Source: 867e3387b8efb70398287d05fd3652540efa77c8
