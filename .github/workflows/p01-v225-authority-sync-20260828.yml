          Path('docs/evidence/P01_V2.25.0_VF_TEAL_UI_AUDIT_20260828.json').write_text(json.dumps({'project':'P01','candidate':'2.25.0','base_production':'2.24.0','functional_source':SOURCE,'schema':'2026082801','ui_audits':[{'run':UI1,'result':'PASS','desktop':'1440x1000','mobile':'390x844'},{'run':UI2,'result':'PASS','desktop':'1365x900','mobile':'390x844','high_density_start':True}],'contracts':{'default_light_teal':'PASS','white_sidebar':'PASS','adminshell_alignment':'PASS','readability':'PASS','shared_shell':'PASS','schema_unchanged':True,'production_write':False}},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
