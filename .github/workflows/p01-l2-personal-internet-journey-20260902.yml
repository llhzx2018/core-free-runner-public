name: P01 L2 Personal Internet Journey Closure
on:
  push:
    branches: [run/p01-l2-personal-internet-journey-20260902]
    paths: [.github/workflows/p01-l2-personal-internet-journey-20260902.yml]
permissions:
  contents: read
jobs:
  journey:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: develop
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Exact develop fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = f036cd0f5833ef2639970db336c62393cf43cce0
          test -z "$(git -C product status --porcelain)"
      - name: Runtime lint
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          for f in src/app/FunctionalHome.php src/app/FunctionalWorkspace.php src/app/Repository.php src/app/SurfaceRepository.php src/surface-manager.php src/transfer.php src/quick-save.php src/health.php src/duplicates.php; do php -l "$f" >/dev/null; done
      - name: First-use and import journey
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          grep -F '导入浏览器书签' src/app/FunctionalHome.php >/dev/null
          grep -F 'transfer.php' src/app/FunctionalHome.php >/dev/null
          grep -F 'Chrome' src/transfer.php >/dev/null
          grep -F 'Edge' src/transfer.php >/dev/null
          grep -F 'Firefox' src/transfer.php >/dev/null
          grep -F 'transfer_preview' src/transfer.php >/dev/null
          grep -F 'transfer_apply' src/transfer.php >/dev/null
          grep -F '恢复点' src/transfer.php >/dev/null
      - name: Personal search journey
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          grep -F '搜索我的互联网' src/app/FunctionalHome.php >/dev/null
          grep -F 'vf-global-search' src/app/FunctionalWorkspace.php >/dev/null
          grep -Eq 'metaKey|ctrlKey' src/assets/workspace-rebaseline.js
          grep -F 'data-web-search-fallback' src/app/FunctionalWorkspace.php >/dev/null
          grep -F 'data-save-search-url' src/app/FunctionalWorkspace.php >/dev/null
      - name: Capture and mobile quick-save journey
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          grep -F 'public function savePendingCapture' src/app/Repository.php >/dev/null
          grep -F "mobile-quick-save" src/app/Repository.php >/dev/null
          grep -F '已保存到私人待整理' src/quick-save.php >/dev/null
          grep -F 'hash_equals($csrf, $provided)' src/quick-save.php >/dev/null
          grep -F '<a href="quick-save.php">＋ 快速收藏</a>' src/app/FunctionalHome.php >/dev/null
          grep -R -F '"version": "1.6.5"' src browser-extension 2>/dev/null | head -1 >/dev/null
      - name: Pending and classification journey
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          grep -F 'public function categorySuggestions' src/app/SurfaceRepository.php >/dev/null
          grep -F '<h2>待整理网址</h2>' src/surface-manager.php >/dev/null
          grep -F "bulkLinks([$id],'organize',$categoryId)" src/surface-manager.php >/dev/null
          grep -F '系统只建议，不会自动移动' src/surface-manager.php >/dev/null
          grep -F "(int)($asset['is_pending'] ?? 0) === 1" src/app/FunctionalHome.php >/dev/null
          grep -F "(int)($asset['is_pending']??0)===1" src/app/FunctionalWorkspace.php >/dev/null
      - name: Health and data-safety journey
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          grep -F 'vf-health-center-tabs' src/health.php >/dev/null
          grep -F 'vf-health-center-tabs' src/duplicates.php >/dev/null
          grep -F 'function vf_home_backup_status' src/app/FunctionalHome.php >/dev/null
          grep -F 'VfBackupManager' src/app/FunctionalHome.php >/dev/null
          grep -F 'data-safety.php#backups-section' src/app/FunctionalHome.php >/dev/null
      - name: Daily-use and safe-delete journey
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          grep -F '<h2 id="vfHomeRecentTitle">最近使用</h2>' src/app/FunctionalHome.php >/dev/null
          grep -F 'last_surface_opened_at' src/app/FunctionalHome.php >/dev/null
          grep -F 'surface-open.php?id=' src/app/FunctionalHome.php >/dev/null
          grep -F 'showDeleteUndo' src/assets/links-admin.js >/dev/null
          grep -F 'setTimeout(hideDeleteUndo,30000)' src/assets/links-admin.js >/dev/null
          grep -F "api('links_bulk_restore'" src/assets/links-admin.js >/dev/null
      - name: Boundary and verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          test "$(cat VERSION)" = 2.36.4
          test "$(cat src/VERSION.txt)" = 2.36.4
          test -z "$(git status --porcelain)"
          echo 'P01 PERSONAL INTERNET JOURNEY WAVE 1-13 PASS'
