name: S01-C02 1.21.912 Distribution R23 Gate

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CORE_UPDATES_SHA: d3a73448e5f5afb81e9fa7ad12d9e4670d5aea71
      PRODUCT_SHA: 3677940d4c60f04a0d744d4accbb6884bcd4fa07
      VERSION: 1.21.912
      TAG: v1.21.912
      ASSET: vf-tools-ops_V1.21.912.zip
      ASSET_BYTES: "3480305"
      ASSET_SHA256: 90866249ffd8a41da5c9cd64ee683d6f474d6471435daf8a932f75c00bf66cd0
      RUNTIME_FILES: "972"
      RUNTIME_FINGERPRINT: 18a9d70a1976e2a0ea2ddcd657b4ef58ab9cfc347fecdf35588b4b6ca1abfe01

    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: d3a73448e5f5afb81e9fa7ad12d9e4670d5aea71
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: dist

      - name: Checkout exact Ops source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 3677940d4c60f04a0d744d4accbb6884bcd4fa07
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops

      - name: Verify manifest and update core
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C dist rev-parse HEAD)" = "$CORE_UPDATES_SHA"
          python3 dist/scripts/check_manifest_contract.py >/tmp/manifest.json
          grep -Fq '"status": "PASS"' /tmp/manifest.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          m=json.loads(Path('dist/projects/S01-C02.json').read_text())
          assert m['target_version']==os.environ['VERSION']
          assert m['release_tag']==os.environ['TAG']
          assert m['asset_name']==os.environ['ASSET']
          assert m['asset_bytes']==int(os.environ['ASSET_BYTES'])
          assert m['asset_sha256']==os.environ['ASSET_SHA256']
          assert m['runtime_files']==int(os.environ['RUNTIME_FILES'])
          assert m['runtime_fingerprint']==os.environ['RUNTIME_FINGERPRINT']
          assert '1.21.911' in m['from_versions']
          print('PASS_MANIFEST')
          PY
          find dist/update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php dist/update-core/php/tests/run.php

      - name: Verify product R23 contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$PRODUCT_SHA"
          php ops/tests/s01-c02-121912-surface-density-consistency-r23-contract.php

      - name: Verify formal release binding
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          JSON="$(gh api "repos/llhzx2018/vf-tools-ops/releases/tags/$TAG")"
          test "$(jq -r '.target_commitish' <<<"$JSON")" = "$PRODUCT_SHA"
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.size' <<<"$JSON")" = "$ASSET_BYTES"
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.digest' <<<"$JSON")" = "sha256:$ASSET_SHA256"
          mkdir -p /tmp/release
          gh release download "$TAG" --repo llhzx2018/vf-tools-ops --pattern "$ASSET" --dir /tmp/release
          test "$(sha256sum "/tmp/release/$ASSET" | awk '{print $1}')" = "$ASSET_SHA256"
          echo PASS_DISTRIBUTION_R23
