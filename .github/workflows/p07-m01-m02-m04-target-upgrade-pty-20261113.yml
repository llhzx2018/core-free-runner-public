name: P07 current target upgrades M01 M02 M04 negative and PTY proof
on:
  push:
    branches: [test/p07-m01-m02-m04-target-upgrade-pty-20261113]
    paths:
      - .github/workflows/p07-m01-m02-m04-target-upgrade-pty-20261113.yml
permissions:
  contents: read
jobs:
  exact-module-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Exact source checkout of current P07 Toolbox candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: b6957a5e7282234824772e46210f2955416bd50f
          persist-credentials: false
      - name: Run actual helper-function PTY confirmations and negative tests
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = b6957a5e7282234824772e46210f2955416bd50f
          bash -n installers/p07-toolbox.sh
          export PYTHONDONTWRITEBYTECODE=1
          python3 -B -m unittest discover -s tests -p test_p07_module_target_upgrade_gate.py -v
          python3 -B -m unittest discover -s tests -p test_p07_five_slot_route_isolation.py -q
          python3 -B -m unittest discover -s tests -p test_p07_public_terminal_ux.py -q
          python3 -B scripts/check_p07_public_terminal_ux.py
          echo P07_M01_NETWORK_NODE_TARGET_UPGRADE=PASS
          echo P07_M02_VPS_AUDIT_TARGET_UPGRADE=PASS
          echo P07_M04_SYSTEM_CARE_TARGET_UPGRADE=PASS
          echo P07_ALL_OTHER_MODULES=UNCHANGED
          echo P07_OWNER_PRODUCTION=NOT_RUN
