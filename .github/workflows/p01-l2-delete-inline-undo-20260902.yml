name: P01 L2 Delete Inline Undo
on:
  push:
    branches: [run/p01-delete-inline-undo-20260902]
    paths: [.github/workflows/p01-l2-delete-inline-undo-20260902.yml]
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: run/p01-delete-inline-undo-20260902
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: product/p01-delete-inline-undo-20260902
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Fresh source fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = e65d75b2eb4e425b2b35a25d044dcc94c8915fd8
          test "$(git -C product rev-parse origin/develop)" = e65d75b2eb4e425b2b35a25d044dcc94c8915fd8
      - name: Apply product patch
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          python3 ../runner/scripts/p01_delete_inline_undo_patch.py
      - name: Verify exact product contract
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          php -l src/links-admin.php >/dev/null
          node --check src/assets/links-admin.js
          git diff --check
          grep -F 'id="linkUndo" hidden' src/links-admin.php >/dev/null
          grep -F 'id="undoDelete"' src/links-admin.php >/dev/null
          grep -F 'function showDeleteUndo(ids)' src/assets/links-admin.js >/dev/null
          grep -F "api('links_bulk_restore'" src/assets/links-admin.js >/dev/null
          grep -F "if(action==='delete'){showDeleteUndo(ids);return}" src/assets/links-admin.js >/dev/null
          grep -F 'setTimeout(hideDeleteUndo,30000)' src/assets/links-admin.js >/dev/null
          grep -F '.vf-inline-undo' src/assets/admin-pages.css >/dev/null
          test "$(git diff --name-only -- src/VERSION.txt VF_PROJECT.json database src/migrations | wc -l | tr -d ' ')" = 0
          git diff --name-only | sort | tee /tmp/changed.txt
          expected=$(printf '%s\n' src/assets/admin-pages.css src/assets/links-admin.js src/links-admin.php | sort)
          test "$(cat /tmp/changed.txt)" = "$expected"
          echo 'DELETE INLINE UNDO PASS'
      - name: Commit and push candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add src/links-admin.php src/assets/links-admin.js src/assets/admin-pages.css
          git commit -m 'feat(P01): add inline undo after trashing links'
          git push origin HEAD:product/p01-delete-inline-undo-20260902
          echo "CANDIDATE=$(git rev-parse HEAD)"
          echo "TREE=$(git rev-parse HEAD^{tree})"
