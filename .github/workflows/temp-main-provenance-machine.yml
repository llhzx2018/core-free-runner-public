name: TEMP Public Runner Main Provenance Machine

on:
  push:
    branches:
      - 'verify/public-runner-main-provenance-f54bd45-20260829'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact verification lane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Public Runner regressions
        run: python3 -m unittest discover -s tests -v

      - name: Prove current main is a merged PR result
        run: |
          set -Eeuo pipefail
          python3 scripts/check_main_push_provenance.py \
            --repository llhzx2018/core-free-runner-public \
            --sha f646f63776a059281a9b05c7b16a8a7d4a873607

      - name: Build public-safe receipt
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/runner
          cat > evidence/runner/MAIN_PUSH_PROVENANCE_MACHINE.txt <<'EOF'
          FORMAL_EXACT_SOURCE=f54bd45c962370e7f3893924e4f3fe431d754ee2
          PROVEN_MAIN_SHA=f646f63776a059281a9b05c7b16a8a7d4a873607
          PROVEN_MAIN_PR=392
          MAIN_PUSH_PROVENANCE=PASS
          PUBLIC_RUNNER_REGRESSION=PASS
          TEMP_LANE_MERGE=NO
          EOF
          sha256sum evidence/runner/MAIN_PUSH_PROVENANCE_MACHINE.txt
          echo 'PUBLIC_RUNNER_MAIN_PROVENANCE_MACHINE=PASS'

      - name: Upload public-safe receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 Node24
        with:
          name: public-runner-main-provenance-machine-${{ github.run_id }}
          path: evidence/runner/MAIN_PUSH_PROVENANCE_MACHINE.txt
          if-no-files-found: error
          retention-days: 14
