# One-time public-safe P02 machine proof. CLOSE WITHOUT MERGE. No private artifacts.
name: TEMP P02 current-stack remaining synthetic acceptance
on:
  pull_request:
    types: [opened]
    branches: [main]
    paths: ['.github/workflows/p02-current-stack-public-safe-once.yml']
permissions:
  contents: read
concurrency:
  group: p02-current-stack-public-safe-81947a51
  cancel-in-progress: false
jobs:
  exact-product:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.event_name == 'pull_request' &&
      github.event.action == 'opened' &&
      github.run_attempt == 1 &&
      github.actor == 'llhzx2018' &&
      github.triggering_actor == 'llhzx2018' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/p02-current-stack-public-safe-once-20261128' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4','8.5']
    services:
      mysql:
        image: mysql:8.4
        env: {MYSQL_ROOT_PASSWORD: vfdoc_lock_synthetic_only, MYSQL_DATABASE: vfdoc_ci, MYSQL_ROOT_HOST: '%'}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pvfdoc_lock_synthetic_only" --health-interval=10s --health-timeout=5s --health-retries=18
      mariadb:
        image: mariadb:11.8
        env: {MARIADB_ROOT_PASSWORD: vfdoc_lock_synthetic_only, MARIADB_DATABASE: vfdoc_ci, MARIADB_ROOT_HOST: '%'}
        ports: ['3307:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=18
    env:
      TARGET_REPO: llhzx2018/vf-doc
      TARGET_VERSION: '0.1.0-dev.1'
      TARGET_SHA: 81947a514708be2f520c87e1b4b3644f9c11e154
      TARGET_TREE: 38e48119847436157af1d588da3eb0f24297c5fc
      CONTROL_SHA: 2ba5ff6e6e831ce8cd7bce59054e382eb0dbb3ad
      CONTROL_TREE: 47808267318e7e25bef4f3593eb8c1e3e21dc349
      PHP_MINOR: ${{ matrix.php }}
    steps:
      - name: Verified hosted PHP mechanism
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          tools: composer:2.11.3
          extensions: mbstring,pdo_sqlite,sqlite3,pdo_mysql,dom,xml,xmlwriter,curl,zip,fileinfo,openssl,sodium,pcntl,posix,intl,bcmath
          coverage: none
      - name: Exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24.22.3'}
      - name: Transient exact private P02 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-doc
          ref: 81947a514708be2f520c87e1b4b3644f9c11e154
          path: target
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
      - name: Verify exact source tree and frozen runtime
        id: identity
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          test "$(id -u)" != 0
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(cat target/VERSION)" = "$TARGET_VERSION"
          test -z "$(git -C target status --porcelain)"
          test ! -e target/.env
          test "$(sha256sum target/composer.lock | cut -d' ' -f1)" = b8fd0e76de8869fefa192abaf3aa86e618e1b5e5dde2ae2d9d24def89e11f22a
          test "$(sha256sum target/pnpm-lock.yaml | cut -d' ' -f1)" = ab58d49b69ae7e10ab4af4a4bf208fd8f1016e555e597ddd8283986ffc66a8b0
          php -r 'exit((getenv("PHP_MINOR")==="8.4" && PHP_VERSION_ID>=80428 && PHP_VERSION_ID<80500)||(getenv("PHP_MINOR")==="8.5" && PHP_VERSION_ID>=80513 && PHP_VERSION_ID<80600)?0:2);'
          php -r 'foreach(["pdo","pdo_mysql","pdo_sqlite","mbstring","dom","xmlwriter","zip","curl","fileinfo"] as $e)if(!extension_loaded($e))exit(2);'
          test "$(node --version)" = v24.22.3
          composer --no-plugins --no-scripts --no-ansi --version | grep -Eq '^Composer version 2\.11\.3( |$)'
          lab="$RUNNER_TEMP/p02-current-proof"
          test ! -e "$lab" && test ! -L "$lab"
          mkdir -m 700 "$lab"
          mkdir -m 700 "$lab/home" "$lab/tmp" "$lab/logs" "$lab/tools"
          chmod 700 target
          echo P02_PUBLIC_EXACT_SOURCE_AND_FROZEN_RUNTIME=PASS
      - name: Complete original PHPUnit on three independent databases
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          lab="$RUNNER_TEMP/p02-current-proof"
          export HOME="$lab/home" TMPDIR="$lab/tmp" COMPOSER_HOME="$lab/home/composer" COMPOSER_CACHE_DIR="$lab/home/composer-cache"
          export COMPOSER_NO_INTERACTION=1 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 CI=true
          export npm_config_cache="$lab/home/npm-cache" npm_config_userconfig="$lab/home/npmrc" npm_config_globalconfig="$lab/home/npm-globalrc" npm_config_fetch_retries=0 npm_config_registry=https://registry.npmjs.org
          export PATH="$lab/tools/node_modules/.bin:$PATH"
          phase() {
            local stage="$1" network="$2" limit="$3" rc=0 attempt
            shift 3
            for attempt in 1 2; do
              if timeout --kill-after=10s "$limit" "$@" >"$lab/logs/$stage.log" 2>&1; then echo "P02_PHASE=$stage:PASS"; return 0; else rc=$?; fi
              if [[ "$network" = yes && "$attempt" = 1 ]] &&
                grep -Eiq 'could not resolve (host|proxy)|temporary failure in name resolution|EAI_AGAIN|ECONNRESET|ETIMEDOUT|connection timed out|operation timed out|connection reset by peer' "$lab/logs/$stage.log" &&
                ! grep -Eiq '401|403|404|certificate|TLS|authentication|authorization|integrity|checksum|security advisories|permission denied|no matching version' "$lab/logs/$stage.log"; then
                echo "P02_PHASE_RETRY=$stage:WAIT90"; sleep 90
              else echo "P02_PHASE=$stage:FAIL"; return "$rc"; fi
            done
            return "$rc"
          }
          cd target
          phase composer_frozen yes 600 composer install --no-interaction --prefer-dist --no-progress --no-plugins --no-scripts
          phase composer_validate no 60 composer validate --no-check-publish --no-check-all --strict
          phase composer_platform no 60 composer check-platform-reqs
          git diff --quiet HEAD -- composer.lock pnpm-lock.yaml
          failed=0
          for engine in sqlite mysql mariadb; do
            lane="$lab/matrix-$engine"
            git clone --local --no-hardlinks --no-recurse-submodules "$GITHUB_WORKSPACE/target" "$lane" >"$lab/logs/clone-$engine.log" 2>&1
            test "$(git -C "$lane" rev-parse HEAD)" = "$TARGET_SHA"
            test "$(git -C "$lane" rev-parse HEAD^{tree})" = "$TARGET_TREE"
            cp -a vendor "$lane/vendor"
            (
              cd "$lane"
              mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs storage/app/private
              cp .env.example .env
              export APP_ENV=testing APP_DEBUG=false APP_URL=http://localhost APP_ALLOWED_HOSTS=localhost CACHE_STORE=array SESSION_DRIVER=array QUEUE_CONNECTION=sync
              export DB_CONNECTION="$engine" DB_DATABASE=vfdoc_ci DB_HOST=127.0.0.1 DB_USERNAME=root DB_PASSWORD=vfdoc_lock_synthetic_only DB_PORT=3306
              if test "$engine" = sqlite; then export DB_DATABASE=:memory:
              elif test "$engine" = mariadb; then export DB_PORT=3307; fi
              php artisan package:discover --ansi &&
              php artisan key:generate --force &&
              php artisan migrate --force &&
              php vendor/bin/phpunit --version &&
              php vendor/bin/phpunit --no-progress --colors=never --fail-on-empty-test-suite --fail-on-skipped --fail-on-incomplete --fail-on-risky --log-junit "$lab/logs/$engine.xml" &&
              git diff --quiet HEAD -- composer.lock pnpm-lock.yaml
            ) >"$lab/logs/matrix-$engine.log" 2>&1 && rc=0 || rc=$?
            if python3 -B - "$lab/logs/$engine.xml" "$lab/logs/matrix-$engine.log" "$rc" "$engine" <<'PY'
          import pathlib,re,sys,xml.etree.ElementTree as ET
          p,log,rc,engine=sys.argv[1:]
          raw=pathlib.Path(log).read_text(errors="replace")
          try: cases=list(ET.parse(p).iter("testcase"))
          except (OSError,ET.ParseError): cases=[]
          counts={k:sum(c.find(k) is not None for c in cases) for k in ("failure","error","skipped")}
          print("P02_PHPUNIT_CELL="+engine+" CASES="+str(len(cases))+" ASSERTIONS="+str(sum(int(c.get("assertions","0")) for c in cases))+" FAIL="+str(counts["failure"])+" ERROR="+str(counts["error"])+" SKIP="+str(counts["skipped"]))
          for c in cases:
              if any(c.find(k) is not None for k in counts):
                  n=c.get("name","")
                  cl=c.get("class","").split("\\")[-1]
                  if re.fullmatch(r"[A-Za-z0-9_]{1,100}",cl) and re.fullmatch(r"test[A-Za-z0-9_]{1,160}",n):print("P02_PHPUNIT_FAILED_CASE="+cl+"."+n)
          if not cases:
              for marker,pat in (("PHP_FATAL",r"Fatal error"),("BOOTSTRAP",r"Error in bootstrap"),("UNDEFINED_METHOD",r"Call to undefined method"),("MISSING_CLASS",r"Class .{1,120} not found"),("CONFIG",r"XML configuration"),("NO_TESTS",r"No tests executed|No tests found"),("SQLSTATE",r"SQLSTATE"),("TYPE_ERROR",r"TypeError"),("UNKNOWN_OPTION",r"Unknown option")):
                  if re.search(pat,raw,re.I):print("P02_PHPUNIT_REASON="+marker)
          sys.exit(0 if int(rc)==0 and cases and not any(counts.values()) else 1)
          PY
            then echo "P02_PHPUNIT_RESULT=$engine:PASS"; else echo "P02_PHPUNIT_RESULT=$engine:FAIL"; failed=1; fi
          done
          test "$failed" = 0
          echo P02_PHPUNIT_THREE_DB=PASS
      - name: Exact temporary installer browser control
        if: always() && !cancelled() && steps.identity.outcome == 'success' && matrix.php == '8.4'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-doc
          ref: 2ba5ff6e6e831ce8cd7bce59054e382eb0dbb3ad
          path: control
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
      - name: Original isolated clean FULL builder, no public artifact
        id: full
        if: always() && !cancelled() && steps.identity.outcome == 'success'
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          lab="$RUNNER_TEMP/p02-current-proof"
          export HOME="$lab/home" TMPDIR="$lab/tmp" COMPOSER_HOME="$lab/home/composer" COMPOSER_CACHE_DIR="$lab/home/composer-cache"
          export COMPOSER_NO_INTERACTION=1 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 CI=true
          export npm_config_cache="$lab/home/npm-cache" npm_config_userconfig="$lab/home/npmrc" npm_config_globalconfig="$lab/home/npm-globalrc" npm_config_fetch_retries=0 npm_config_registry=https://registry.npmjs.org
          export PATH="$lab/tools/node_modules/.bin:$PATH"
          phase() {
            local stage="$1" network="$2" limit="$3" rc=0 attempt
            shift 3
            for attempt in 1 2; do
              if timeout --kill-after=10s "$limit" "$@" >"$lab/logs/$stage.log" 2>&1; then echo "P02_PHASE=$stage:PASS"; return 0; else rc=$?; fi
              if [[ "$network" = yes && "$attempt" = 1 ]] &&
                grep -Eiq 'could not resolve (host|proxy)|temporary failure in name resolution|EAI_AGAIN|ECONNRESET|ETIMEDOUT|connection timed out|operation timed out|connection reset by peer' "$lab/logs/$stage.log" &&
                ! grep -Eiq '401|403|404|certificate|TLS|authentication|authorization|integrity|checksum|security advisories|permission denied|no matching version' "$lab/logs/$stage.log"; then
                echo "P02_PHASE_RETRY=$stage:WAIT90"; sleep 90
              else echo "P02_PHASE=$stage:FAIL"; return "$rc"; fi
            done
            return "$rc"
          }
          phase pnpm_tool yes 240 npm install --prefix "$lab/tools" --ignore-scripts --no-fund --no-audit pnpm@11.29.0
          test "$(pnpm --version)" = 11.29.0
          git -C target diff --quiet HEAD --
          phase full_build no 900 bash target/scripts/build-clean-full.sh "$lab/full.zip"
          unzip -tqq "$lab/full.zip" >"$lab/logs/full-crc.log" 2>&1
          echo P02_PUBLIC_DEV_FULL_BUILD=PASS
          if test "$PHP_MINOR" = 8.4; then
            cd target
            phase browser_deps yes 600 pnpm install --frozen-lockfile
            export PLAYWRIGHT_BROWSERS_PATH="$lab/browsers"
            phase browser_install yes 600 pnpm exec playwright install --with-deps chromium
            test -d node_modules/@playwright/test
            git diff --quiet HEAD -- composer.lock pnpm-lock.yaml
            echo P02_PUBLIC_PINNED_BROWSER=PASS
          fi
      - name: Original PHP85 FULL recovery and dirty rejection on three databases
        if: always() && !cancelled() && steps.full.outcome == 'success' && matrix.php == '8.5'
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          lab="$RUNNER_TEMP/p02-current-proof"
          export HOME="$lab/home" TMPDIR="$lab/tmp" COMPOSER_HOME="$lab/home/composer" COMPOSER_CACHE_DIR="$lab/home/composer-cache"
          export COMPOSER_NO_INTERACTION=1 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 CI=true
          export npm_config_cache="$lab/home/npm-cache" npm_config_userconfig="$lab/home/npmrc" npm_config_globalconfig="$lab/home/npm-globalrc" npm_config_fetch_retries=0 npm_config_registry=https://registry.npmjs.org
          export PATH="$lab/tools/node_modules/.bin:$PATH"
          phase() {
            local stage="$1" network="$2" limit="$3" rc=0 attempt
            shift 3
            for attempt in 1 2; do
              if timeout --kill-after=10s "$limit" "$@" >"$lab/logs/$stage.log" 2>&1; then echo "P02_PHASE=$stage:PASS"; return 0; else rc=$?; fi
              if [[ "$network" = yes && "$attempt" = 1 ]] &&
                grep -Eiq 'could not resolve (host|proxy)|temporary failure in name resolution|EAI_AGAIN|ECONNRESET|ETIMEDOUT|connection timed out|operation timed out|connection reset by peer' "$lab/logs/$stage.log" &&
                ! grep -Eiq '401|403|404|certificate|TLS|authentication|authorization|integrity|checksum|security advisories|permission denied|no matching version' "$lab/logs/$stage.log"; then
                echo "P02_PHASE_RETRY=$stage:WAIT90"; sleep 90
              else echo "P02_PHASE=$stage:FAIL"; return "$rc"; fi
            done
            return "$rc"
          }
          php -r '$x=new PDO("mysql:host=127.0.0.1;port=3306;charset=utf8mb4","root","vfdoc_lock_synthetic_only");$x->exec("CREATE DATABASE ".chr(96)."vfdoc-ci".chr(96));' >"$lab/hyphen-mysql.log" 2>&1
          php -r '$x=new PDO("mysql:host=127.0.0.1;port=3307;charset=utf8mb4","root","vfdoc_lock_synthetic_only");$x->exec("CREATE DATABASE ".chr(96)."vfdoc-ci".chr(96));' >"$lab/hyphen-mariadb.log" 2>&1
          echo P02_STAGE5_REAL_HYPHEN_DB_CREATED=PASS
          cat >"$lab/one-full.sh" <<'VF_FULL'
          set -Eeuo pipefail
          base="$RUNNER_TEMP/p02-current-proof"
          pids=""
          trap 'for p in $pids; do kill "$p" 2>/dev/null || true; wait "$p" 2>/dev/null || true; done' EXIT
          for engine in "$1"; do
            case "$engine" in
              sqlite) port=8131; dirty=8141; dbport=3306;;
              mysql) port=8132; dirty=8142; dbport=3306;;
              mariadb) port=8133; dirty=8143; dbport=3307;;
            esac
            mkdir -p "$base/$engine" "$base/dirty-$engine"
            unzip -q "$base/full.zip" -d "$base/$engine"
            unzip -q "$base/full.zip" -d "$base/dirty-$engine"
            for suffix in "$engine" "dirty-$engine"; do
              site="$base/$suffix"
              printf '%s\n' '<?php' '$p=parse_url($_SERVER["REQUEST_URI"],PHP_URL_PATH);' 'if(is_file(__DIR__."/public".$p))return false;' 'require __DIR__."/public/index.php";' >"$site/router.php"
            done
            php -S "127.0.0.1:$port" -t "$base/$engine/public" "$base/$engine/router.php" >"$base/server-$engine.log" 2>&1 &
            pids="$pids $!"
            for n in $(seq 1 40); do
              if curl -fsS -o /dev/null "http://127.0.0.1:$port/setup.php"; then break; fi
              sleep 1
            done
            if python3 target/tests/e2e/full_install_probe.py --root "$base/$engine" --base "http://127.0.0.1:$port" --engine "$engine" --db-port "$dbport" --db-name "vfdoc-ci" --mode clean >"$base/clean-$engine.log" 2>&1; then
              echo "P02_STAGE5_CLEAN_FULL_$engine=PASS"
            else
              echo "P02_STAGE5_CLEAN_FULL_$engine=FAIL"
              grep -E 'P02_STAGE4_ACTUAL_FULL_INSTALL=FAIL stage=[a-z-]+' "$base/clean-$engine.log" | tail -1 || true
              exit 1
            fi
            if php target/tests/e2e/full_recovery_probe.php "$base/$engine" >"$base/restore-$engine.log" 2>&1; then
              echo "P02_STAGE5_EXTRACTED_RESTORE_$engine=PASS"
            else
              echo "P02_STAGE5_EXTRACTED_RESTORE_$engine=FAIL"
              grep -Eo 'P02_STAGE5_[A-Z_]+=(PASS|FAIL)' "$base/restore-$engine.log" | tail -4 || true
              exit 1
            fi
            # Source artifacts come from two genuine extracted Clean FULL
            # copies with synthetic future VERSION only; no official Release.
            # The builder includes locked vendor and compiled assets.
            if test ! -e "$base/atomic-new-v1.zip"; then
              mkdir -p "$base/new-full-v1" "$base/new-full-v2"
              unzip -q "$base/full.zip" -d "$base/new-full-v1"
              unzip -q "$base/full.zip" -d "$base/new-full-v2"
              printf '%s\n' '0.1.1' >"$base/new-full-v1/VERSION"
              printf '%s\n' '0.1.2' >"$base/new-full-v2/VERSION"
              printf '%s\n' '<?php // proof-v1' >"$base/new-full-v1/app/AtomicProofFixture.php"
              printf '%s\n' '<?php // proof-v2' >"$base/new-full-v2/app/AtomicProofFixture.php"
              if ! python3 target/scripts/build_new_atomic.py --full-dir "$base/new-full-v1" --from-version 0.1.0 --output "$base/atomic-new-v1.zip" >"$base/atomic-build-v1.log" 2>&1; then
                grep -Eo 'P02_ATOMIC_BUILD=FAIL [A-Z_]+' "$base/atomic-build-v1.log" | head -1 || true
                python3 -c 'import re,sys,pathlib; t=open(sys.argv[1]).read(); m=re.search(r"FORBIDDEN_NONHIDDEN_RUNTIME_FILE: ([^\\n]+)",t); p=m.group(1) if m else ""; print("P02_BUILDER_SCOPE="+p.split("/")[0]+" EXT="+pathlib.Path(p).suffix.lower())' "$base/atomic-build-v1.log"
                exit 1
              fi
              if ! python3 target/scripts/build_new_atomic.py --full-dir "$base/new-full-v2" --from-version 0.1.1 --output "$base/atomic-new-v2.zip" >"$base/atomic-build-v2.log" 2>&1; then
                grep -Eo 'P02_ATOMIC_BUILD=FAIL [A-Z_]+' "$base/atomic-build-v2.log" | head -1 || true
                exit 1
              fi
              echo P02_STAGE5_FULL_DERIVED_ATOMIC_BUILDER=PASS
            fi
            export VF_DOC_ATOMIC_PACKAGE_1="$base/atomic-new-v1.zip"
            export VF_DOC_ATOMIC_PACKAGE_2="$base/atomic-new-v2.zip"
            if php target/tests/e2e/atomic_upgrade_probe.php "$base/$engine" success >"$base/atomic-success-$engine.log" 2>&1; then
              echo "P02_STAGE5_ACTUAL_ATOMIC_$engine=PASS"
            else
              echo "P02_STAGE5_ACTUAL_ATOMIC_$engine=FAIL"
              grep -Eo 'P02_STAGE5_[A-Z_]+=(PASS|FAIL)' "$base/atomic-success-$engine.log" | tail -5 || true
              exit 1
            fi
            # Force-kill only the disposable PHP child immediately after the
            # first live file rename; OS lock disappears but journal remains.
            set +e
            php target/tests/e2e/atomic_upgrade_probe.php "$base/$engine" kill >"$base/atomic-kill-$engine.log" 2>&1
            killed="$?"
            set -e
            if test "$killed" -ne 137 || ! grep -q P02_STAGE5_HARD_KILL_INJECTED=NOW "$base/atomic-kill-$engine.log"; then
              echo "P02_STAGE5_HARD_KILL_$engine=FAIL"
              exit 1
            fi
            echo "P02_STAGE5_HARD_KILL_$engine=PASS"
            if python3 target/tests/e2e/atomic_rescue_http_probe.py --base "http://127.0.0.1:$port" >"$base/atomic-http-$engine.log" 2>&1; then
              echo "P02_STAGE5_OWNER_HTTP_RESCUE_$engine=PASS"
            else
              echo "P02_STAGE5_OWNER_HTTP_RESCUE_$engine=FAIL"
              exit 1
            fi
            if php target/tests/e2e/atomic_upgrade_probe.php "$base/$engine" verify >"$base/atomic-verify-$engine.log" 2>&1; then
              echo "P02_STAGE5_SIGKILL_DATA_PRESERVED_$engine=PASS"
            else
              echo "P02_STAGE5_SIGKILL_DATA_PRESERVED_$engine=FAIL"
              exit 1
            fi
            if python3 target/tests/e2e/portability_http_probe.py --root "$base/$engine" >"$base/portability-$engine.log" 2>&1; then
              echo "P02_STAGE7_PORTABILITY_$engine=PASS"
            else
              echo "P02_STAGE7_PORTABILITY_$engine=FAIL"
              grep -Eo 'P02_STAGE7_[A-Z_]+=(PASS|FAIL)' "$base/portability-$engine.log" | tail -6 || true
              exit 1
            fi
            if test "$engine" = sqlite; then
              mkdir -p "$base/dirty-$engine/storage/app/private"
              python3 - "$base/dirty-$engine/storage/app/private/vf-doc.sqlite" <<'PY'
          import sqlite3,sys
          conn=sqlite3.connect(sys.argv[1])
          conn.execute("CREATE TABLE unrelated_user_data (id INTEGER)")
          conn.commit()
          conn.close()
          PY
            fi
            php -S "127.0.0.1:$dirty" -t "$base/dirty-$engine/public" "$base/dirty-$engine/router.php" >"$base/dirty-server-$engine.log" 2>&1 &
            pids="$pids $!"
            for n in $(seq 1 40); do
              if curl -fsS -o /dev/null "http://127.0.0.1:$dirty/setup.php"; then break; fi
              sleep 1
            done
            if python3 target/tests/e2e/full_install_probe.py --root "$base/dirty-$engine" --base "http://127.0.0.1:$dirty" --engine "$engine" --db-port "$dbport" --db-name "vfdoc-ci" --mode dirty >"$base/dirty-$engine.log" 2>&1; then
              echo "P02_STAGE5_DIRTY_DB_$engine=PASS"
            else
              echo "P02_STAGE5_DIRTY_DB_$engine=FAIL"
              exit 1
            fi
          done
          echo "P02_PHP85_FULL_CELL=$1:PASS"
          VF_FULL
          failed=0
          for engine in sqlite mysql mariadb; do
            if bash "$lab/one-full.sh" "$engine" >"$lab/logs/full-$engine.log" 2>&1; then
              echo "P02_PHP85_FULL_RESULT=$engine:PASS"
            else echo "P02_PHP85_FULL_RESULT=$engine:FAIL"; failed=1; fi
            grep -E '^P02_(STAGE[457]_[A-Za-z0-9_]+=(PASS|FAIL)( stage=[a-z-]+)?|PHP85_FULL_CELL=(sqlite|mysql|mariadb):PASS)$' "$lab/logs/full-$engine.log" || true
          done
          test "$failed" = 0
          echo P02_PHP85_FULL_THREE_DB_RECOVERY=PASS
      - name: Six outstanding original browser flows only, synthetic evidence destroyed
        if: always() && !cancelled() && steps.full.outcome == 'success' && matrix.php == '8.4'
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          lab="$RUNNER_TEMP/p02-current-proof"
          export HOME="$lab/home" TMPDIR="$lab/tmp" COMPOSER_HOME="$lab/home/composer" COMPOSER_CACHE_DIR="$lab/home/composer-cache"
          export COMPOSER_NO_INTERACTION=1 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 CI=true
          export npm_config_cache="$lab/home/npm-cache" npm_config_userconfig="$lab/home/npmrc" npm_config_globalconfig="$lab/home/npm-globalrc" npm_config_fetch_retries=0 npm_config_registry=https://registry.npmjs.org
          export PATH="$lab/tools/node_modules/.bin:$PATH"
          phase() {
            local stage="$1" network="$2" limit="$3" rc=0 attempt
            shift 3
            for attempt in 1 2; do
              if timeout --kill-after=10s "$limit" "$@" >"$lab/logs/$stage.log" 2>&1; then echo "P02_PHASE=$stage:PASS"; return 0; else rc=$?; fi
              if [[ "$network" = yes && "$attempt" = 1 ]] &&
                grep -Eiq 'could not resolve (host|proxy)|temporary failure in name resolution|EAI_AGAIN|ECONNRESET|ETIMEDOUT|connection timed out|operation timed out|connection reset by peer' "$lab/logs/$stage.log" &&
                ! grep -Eiq '401|403|404|certificate|TLS|authentication|authorization|integrity|checksum|security advisories|permission denied|no matching version' "$lab/logs/$stage.log"; then
                echo "P02_PHASE_RETRY=$stage:WAIT90"; sleep 90
              else echo "P02_PHASE=$stage:FAIL"; return "$rc"; fi
            done
            return "$rc"
          }
          export PLAYWRIGHT_MODULE_PATH="$GITHUB_WORKSPACE/target/node_modules/@playwright/test" PLAYWRIGHT_BROWSERS_PATH="$lab/browsers"
          export E2E_CONFIRM_DISPOSABLE_NEW_VFDOC=YES E2E_EXACT_SOURCE_SHA="$TARGET_SHA" E2E_EMAIL=synthetic@example.test E2E_PASSWORD=synthetic-secure-password
          mkdir -m 700 "$lab/synthetic-screenshots"
          export VF_P02_SCREENSHOTS="$lab/synthetic-screenshots"
          test -f "$lab/full.zip"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          python3 -B - <<'PY'
          import pathlib,re
          s=pathlib.Path("target/tests/e2e/run_final_stage_batch.sh").read_text()
          m=re.search(r"(?ms)^tests=\(\n(.*?)^\)",s)
          assert m
          expected=("stage6_workspace","quick_capture","standalone_markdown","bulk_organization","revision_compare","recent_category","notebook_reader","rich_reader_template","editor","private_attachment_reader","transfer_branding","settings_nine")
          assert tuple(re.findall(r"(?m)^\s{2}([a-z0-9_]+)\.browser\.cjs\s*$",m.group(1)))==expected
          PY
          cat >"$lab/one-browser.sh" <<'SH'
          set -Eeuo pipefail
          umask 077
          lab="$RUNNER_TEMP/p02-current-proof"
          flow="$1"
          site="$lab/site-$flow"
          mkdir -m 700 "$site"
          unzip -q "$lab/full.zip" -d "$site"
          test ! -e "$site/.env"
          printf '%s\n' '<?php' '$p=parse_url($_SERVER["REQUEST_URI"],PHP_URL_PATH);' 'if(is_file(__DIR__."/public".$p))return false;' 'require __DIR__."/public/index.php";' >"$site/router.php"
          if curl -fsS --connect-timeout 1 --max-time 2 http://127.0.0.1:8000/setup.php >/dev/null 2>&1; then echo P02_BROWSER_STALE_SITE=FAIL; exit 2; fi
          php -S 127.0.0.1:8000 -t "$site/public" "$site/router.php" >"$lab/logs/server-$flow.log" 2>&1 &
          server="$!"
          trap 'kill "$server" 2>/dev/null || true; wait "$server" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 40); do
            kill -0 "$server" || exit 2
            if curl -fsS --connect-timeout 1 --max-time 2 http://127.0.0.1:8000/setup.php >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          if test "$flow" = setup_browser; then
            export P02_FULL_EXTRACT_ROOT="$site" P02_FULL_BASE_URL=http://127.0.0.1:8000
            node target/tests/e2e/setup_browser.cjs
            test "$(git -C control rev-parse HEAD)" = "$CONTROL_SHA"
            test "$(git -C control rev-parse HEAD^{tree})" = "$CONTROL_TREE"
            node control/proof/p02-actual-install-browser.cjs
          elif test "$flow" = legacy_ux_inheritance; then
            python3 -B target/tests/e2e/full_install_probe.py --root "$site" --base http://127.0.0.1:8000 --engine sqlite --mode clean
            node "target/tests/e2e/$flow.browser.cjs" "$VF_P02_SCREENSHOTS"
          else
            python3 -B target/tests/e2e/full_install_probe.py --root "$site" --base http://127.0.0.1:8000 --engine sqlite --mode clean
            node "target/tests/e2e/$flow.browser.cjs"
          fi
          SH
          failed=0
          for flow in bulk_organization recent_category editor settings_nine setup_browser legacy_ux_inheritance; do
            if bash "$lab/one-browser.sh" "$flow" >"$lab/logs/browser-$flow.log" 2>&1; then echo "P02_PUBLIC_BROWSER=$flow:PASS"
            else
              echo "P02_PUBLIC_BROWSER=$flow:FAIL"
              grep -E '^P02_(FINAL_BROWSER|STACK_INSTALLER|EDITOR|BULK_ORGANIZE|RECENT_CATEGORY_BROWSER|SETTINGS_NINE_BROWSER)_[A-Z_]+=[A-Z0-9_-]{1,96}$' "$lab/logs/browser-$flow.log" || true
              for name in TimeoutError AssertionError TypeError ReferenceError; do if grep -q "$name" "$lab/logs/browser-$flow.log"; then echo "P02_PUBLIC_BROWSER_ERROR=$name"; fi; done
              failed=1
            fi
          done
          test "$failed" = 0
          echo P02_PUBLIC_SIX_REMAINING_BROWSER_FLOWS=PASS
      - name: Always erase private source, runtime, FULL, screenshots and synthetic logs
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          for dir in "$GITHUB_WORKSPACE/target" "$GITHUB_WORKSPACE/control" "$RUNNER_TEMP/p02-current-proof"; do
            test ! -L "$dir"
