# One-time public-safe P02 machine proof. CLOSE WITHOUT MERGE. No private artifacts.
name: TEMP P02 direct PHPUnit and remaining settings return
on:
  pull_request:
    types: [opened]
    branches: [main]
    paths: ['.github/workflows/p02-current-stack-public-safe-once.yml']
permissions:
  contents: read
concurrency:
  group: p02-direct-phpunit-return-53843e73
  cancel-in-progress: false
jobs:
  exact-product:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.event_name == 'pull_request' &&
      github.event.action == 'opened' &&
      github.run_attempt == 1 &&
      github.actor == 'llhzx2018' &&
      github.triggering_actor == 'llhzx2018' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/p02-direct-phpunit-return-once-20261128' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4','8.5']
    services:
      mysql:
        image: mysql:8.4
        env: {MYSQL_ROOT_PASSWORD: vfdoc_lock_synthetic_only, MYSQL_DATABASE: vfdoc_ci, MYSQL_ROOT_HOST: '%'}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pvfdoc_lock_synthetic_only" --health-interval=10s --health-timeout=5s --health-retries=18
      mariadb:
        image: mariadb:11.8
        env: {MARIADB_ROOT_PASSWORD: vfdoc_lock_synthetic_only, MARIADB_DATABASE: vfdoc_ci, MARIADB_ROOT_HOST: '%'}
        ports: ['3307:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=18
    env:
      TARGET_REPO: llhzx2018/vf-doc
      TARGET_VERSION: '0.1.0-dev.1'
      TARGET_SHA: 53843e7308a2ed62b6ba5a714f35c2bef3fc7cea
      TARGET_TREE: a8d5e618fe6e3465d3f600872b84bc730a7c5c42
      PHP_MINOR: ${{ matrix.php }}
    steps:
      - name: Verified hosted PHP mechanism
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          tools: composer:2.11.3
          extensions: mbstring,pdo_sqlite,sqlite3,pdo_mysql,dom,xml,xmlwriter,curl,zip,fileinfo,openssl,sodium,pcntl,posix,intl,bcmath
          coverage: none
      - name: Exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24.22.3'}
      - name: Transient exact private P02 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-doc
          ref: 53843e7308a2ed62b6ba5a714f35c2bef3fc7cea
          path: target
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
      - name: Verify exact source tree and frozen runtime
        id: identity
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          test "$(id -u)" != 0
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(cat target/VERSION)" = "$TARGET_VERSION"
          test -z "$(git -C target status --porcelain)"
          test ! -e target/.env
          test "$(sha256sum target/composer.lock | cut -d' ' -f1)" = b8fd0e76de8869fefa192abaf3aa86e618e1b5e5dde2ae2d9d24def89e11f22a
          test "$(sha256sum target/pnpm-lock.yaml | cut -d' ' -f1)" = ab58d49b69ae7e10ab4af4a4bf208fd8f1016e555e597ddd8283986ffc66a8b0
          php -r 'exit((getenv("PHP_MINOR")==="8.4" && PHP_VERSION_ID>=80428 && PHP_VERSION_ID<80500)||(getenv("PHP_MINOR")==="8.5" && PHP_VERSION_ID>=80513 && PHP_VERSION_ID<80600)?0:2);'
          php -r 'foreach(["pdo","pdo_mysql","pdo_sqlite","mbstring","dom","xmlwriter","zip","curl","fileinfo"] as $e)if(!extension_loaded($e))exit(2);'
          test "$(node --version)" = v24.22.3
          composer --no-plugins --no-scripts --no-ansi --version | grep -Eq '^Composer version 2\.11\.3( |$)'
          lab="$RUNNER_TEMP/p02-current-proof"
          test ! -e "$lab" && test ! -L "$lab"
          mkdir -m 700 "$lab"
          mkdir -m 700 "$lab/home" "$lab/tmp" "$lab/logs" "$lab/tools"
          chmod 700 target
          echo P02_PUBLIC_EXACT_SOURCE_AND_FROZEN_RUNTIME=PASS
      - name: Original PHPUnit direct exact checkout then independent frozen autoload lanes
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          lab="$RUNNER_TEMP/p02-current-proof"
          export HOME="$lab/home" TMPDIR="$lab/tmp" COMPOSER_HOME="$lab/home/composer" COMPOSER_CACHE_DIR="$lab/home/composer-cache"
          export COMPOSER_NO_INTERACTION=1 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 CI=true
          export npm_config_cache="$lab/home/npm-cache" npm_config_userconfig="$lab/home/npmrc" npm_config_globalconfig="$lab/home/npm-globalrc" npm_config_fetch_retries=0 npm_config_registry=https://registry.npmjs.org
          export PATH="$lab/tools/node_modules/.bin:$PATH"
          phase() {
            local stage="$1" network="$2" limit="$3" rc=0 attempt
            shift 3
            for attempt in 1 2; do
              if timeout --kill-after=10s "$limit" "$@" >"$lab/logs/$stage.log" 2>&1; then echo "P02_PHASE=$stage:PASS"; return 0; else rc=$?; fi
              if [[ "$network" = yes && "$attempt" = 1 ]] &&
                grep -Eiq 'could not resolve (host|proxy)|temporary failure in name resolution|EAI_AGAIN|ECONNRESET|ETIMEDOUT|connection timed out|operation timed out|connection reset by peer' "$lab/logs/$stage.log" &&
                ! grep -Eiq '401|403|404|certificate|TLS|authentication|authorization|integrity|checksum|security advisories|permission denied|no matching version' "$lab/logs/$stage.log"; then
                echo "P02_PHASE_RETRY=$stage:WAIT90"; sleep 90
              else echo "P02_PHASE=$stage:FAIL"; return "$rc"; fi
            done
            return "$rc"
          }
          cd target
          phase composer_frozen yes 600 composer install --no-interaction --prefer-dist --no-progress --no-plugins --no-scripts
          phase composer_validate no 60 composer validate --no-check-publish --no-check-all --strict
          phase composer_platform no 60 composer check-platform-reqs
          git diff --quiet HEAD -- composer.lock pnpm-lock.yaml
          # Report only fixed classes, package/test symbols and source-relative
          # file/line identities. Never emit raw diagnostics or assertion values.
          cat >"$lab/diagnose-php.py" <<'PY'
          import pathlib,re,sys
          log=pathlib.Path(sys.argv[1]).read_text(errors="replace")
          phase=sys.argv[2]
          assert re.fullmatch(r"[A-Z_]{1,40}",phase)
          print("P02_PHP_DIAGNOSTIC_PHASE="+phase)
          patterns={
            "DECLARATION_INCOMPATIBLE":r"Declaration of .* must be compatible with",
            "ACCESS_LEVEL":r"Access level to .* must be",
            "FINAL_METHOD":r"Cannot override final method",
            "FINAL_CLASS":r"cannot extend final class",
            "MISSING_CLASS_OR_INTERFACE":r"(?:Class|Interface|Trait) .{1,180} not found",
            "UNDEFINED_METHOD":r"Call to undefined method",
            "REDECLARATION":r"Cannot (?:redeclare|declare class)",
            "TYPE_ERROR":r"TypeError|ArgumentCountError",
            "PARSE_ERROR":r"Parse error|syntax error",
            "MISSING_EXTENSION":r"extensions?.{1,100}(?:not available|required|missing)",
            "SQLSTATE":r"SQLSTATE",
            "BOOTSTRAP":r"Error in bootstrap",
            "UNKNOWN_OPTION":r"Unknown option",
            "PHP_FATAL":r"Fatal error"
          }
          for label,pat in patterns.items():
            if re.search(pat,log,re.I):print("P02_PHP_DIAGNOSTIC_KIND="+label)
          # Symbols are limited to locked public package namespaces and
          # original test case names; values/arguments/messages never emitted.
          fatal=[line for line in log.splitlines() if re.search(r"Fatal error|Parse error|Declaration of|Cannot override|Access level|Uncaught (?:Error|TypeError)",line,re.I)]
          prefix=("PHPUnit.","Illuminate.","NunoMaduro.","Mockery.","Symfony.","Composer.","SebastianBergmann.","Whoops.","DeepCopy.","Hamcrest.","Tests.")
          for line in fatal:
              for value in re.findall(r"[A-Za-z_][A-Za-z0-9_]*(?:\\[A-Za-z_][A-Za-z0-9_]*)+(?:::[A-Za-z_][A-Za-z0-9_]*)?",line):
                  value=value.replace("\\",".")
                  if value.startswith(prefix) and len(value)<=180:
                      print("P02_PHP_DIAGNOSTIC_SYMBOL="+value)
          # The allowlist excludes arbitrary app paths, secrets and host paths.
          for line in fatal:
              for m in re.finditer(r"((?:tests/(?:Feature|Unit)/[A-Za-z0-9_]+Test\.php|tests/TestCase\.php|vendor/(?:phpunit/phpunit|laravel/framework|nunomaduro/collision|mockery/mockery|composer)/[A-Za-z0-9_/.-]+\.php))(?::| on line )([0-9]{1,7})",line):
                  print("P02_PHP_DIAGNOSTIC_LOCATION="+m.group(1)+":"+m.group(2))
          PY
          chmod 700 "$lab/diagnose-php.py"
          # Previous exact run proved autoload/version/discovery 184 tests on
          # both PHP versions, then both copied-vendor lanes fatally redeclared
          # the same single-declaration test method. Run the original checkout
          # directly first; never copy generated Composer autoload between lanes.
          test "$(git hash-object tests/Feature/AtomicUpgradeServiceTest.php)" = 439965c4a6829092c9d98268cb955094b42bc311
          php -l tests/Feature/AtomicUpgradeServiceTest.php >"$lab/logs/fatal-file-lint.log" 2>&1
          echo P02_FATAL_SOURCE_PHP_LINT=PASS
          cat >"$lab/fatal-location.php" <<'PHP'
          <?php
          register_shutdown_function(static function (): void {
              $error = error_get_last();
              if (!$error || !in_array($error['type'], [E_ERROR,E_PARSE,E_CORE_ERROR,E_COMPILE_ERROR,E_USER_ERROR,E_RECOVERABLE_ERROR], true)) return;
              $file = (string) $error['file'];
              $line = (int) $error['line'];
              echo "\nP02_FATAL_SHUTDOWN_TYPE=".$error['type']."\n";
              $base = getcwd().DIRECTORY_SEPARATOR;
              $relative = str_starts_with($file,$base) ? substr($file,strlen($base)) : '';
              if (preg_match('~^(tests/(?:Feature|Unit)/[A-Za-z0-9_]+Test\.php|tests/TestCase\.php|vendor/(?:phpunit/phpunit|laravel/framework|nunomaduro/collision|mockery/mockery|composer)/[A-Za-z0-9_./-]+\.php)~D',$relative,$m)) {
                  echo "P02_FATAL_SHUTDOWN_LOCATION=".$m[1].":".$line."\n";
              }
              echo "P02_FATAL_SHUTDOWN_EVAL=".(str_contains($file,"eval()'d code")?'YES':'NO')."\n";
              if (preg_match('~Cannot redeclare ([A-Za-z0-9_\\\\]+::[A-Za-z0-9_]+)\(~i',(string)$error['message'],$m)) {
                  $symbol=str_replace("\\",".",$m[1]);
                  if (str_starts_with($symbol,'Tests.') || str_starts_with($symbol,'PHPUnit.')) echo "P02_FATAL_SHUTDOWN_REDECLARATION=".$symbol."\n";
              }
          });
          PHP
          chmod 600 "$lab/fatal-location.php"
          failed=0
          for engine in sqlite mysql mariadb; do
            if test "$engine" = sqlite; then
              lane="$GITHUB_WORKSPACE/target"
              echo P02_MATRIX_EXECUTION_MODE=ORIGINAL_CHECKOUT
            else
              lane="$lab/matrix-$engine"
              git clone --local --no-hardlinks --no-recurse-submodules "$GITHUB_WORKSPACE/target" "$lane" >"$lab/logs/clone-$engine.log" 2>&1
              echo P02_MATRIX_EXECUTION_MODE=FRESH_FROZEN_AUTOLOAD
              (cd "$lane"; phase "composer_frozen_$engine" yes 600 composer install --no-interaction --prefer-dist --no-progress --no-plugins --no-scripts)
            fi
            test "$(git -C "$lane" rev-parse HEAD)" = "$TARGET_SHA"
            test "$(git -C "$lane" rev-parse HEAD^{tree})" = "$TARGET_TREE"
            test "$(git -C "$lane" hash-object tests/Feature/AtomicUpgradeServiceTest.php)" = 439965c4a6829092c9d98268cb955094b42bc311
            (
              cd "$lane"
              mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs storage/app/private
              cp .env.example .env
              export APP_ENV=testing APP_DEBUG=false APP_URL=http://localhost APP_ALLOWED_HOSTS=localhost CACHE_STORE=array SESSION_DRIVER=array QUEUE_CONNECTION=sync
              export DB_CONNECTION="$engine" DB_DATABASE=vfdoc_ci DB_HOST=127.0.0.1 DB_USERNAME=root DB_PASSWORD=vfdoc_lock_synthetic_only DB_PORT=3306
              if test "$engine" = sqlite; then export DB_DATABASE=:memory:
              elif test "$engine" = mariadb; then export DB_PORT=3307; fi
              echo P02_MATRIX_PHASE=PACKAGE_DISCOVER &&
              php -d display_errors=stderr artisan package:discover --ansi &&
              echo P02_MATRIX_PHASE=KEY_GENERATE &&
              php -d display_errors=stderr artisan key:generate --force &&
              echo P02_MATRIX_PHASE=MIGRATE &&
              php -d display_errors=stderr artisan migrate --force &&
              echo P02_MATRIX_PHASE=PHPUNIT_RUN &&
              php -d display_errors=stderr -d "auto_prepend_file=$lab/fatal-location.php" vendor/bin/phpunit --debug --no-progress --colors=never --fail-on-empty-test-suite --fail-on-skipped --fail-on-incomplete --fail-on-risky --log-junit "$lab/logs/$engine.xml" &&
              git diff --quiet HEAD -- composer.lock pnpm-lock.yaml
            ) >"$lab/logs/matrix-$engine.log" 2>&1 && rc=0 || rc=$?
            grep -E '^P02_FATAL_SHUTDOWN_(TYPE|LOCATION|EVAL|REDECLARATION)=[A-Za-z0-9_./:-]{1,240}$' "$lab/logs/matrix-$engine.log" || true
            python3 -B - "$lab/logs/matrix-$engine.log" <<'PY'
          import pathlib,re,sys
          s=pathlib.Path(sys.argv[1]).read_text(errors="replace")
          cases=re.findall(r"(?m)^Test Preparation Started \(Tests\\(?:Feature|Unit)\\[A-Za-z0-9_]+::test[A-Za-z0-9_]+\)$",s)
          print("P02_PHPUNIT_ACTUAL_PREPARATION_EVENTS="+str(len(cases)))
          PY
            rm -f -- "$lane/.env"
            if python3 -B - "$lab/logs/$engine.xml" "$lab/logs/matrix-$engine.log" "$rc" "$engine" <<'PY'
          import pathlib,re,sys,xml.etree.ElementTree as ET
          p,log,rc,engine=sys.argv[1:]
          raw=pathlib.Path(log).read_text(errors="replace")
          try: cases=list(ET.parse(p).iter("testcase"))
          except (OSError,ET.ParseError): cases=[]
          counts={k:sum(c.find(k) is not None for c in cases) for k in ("failure","error","skipped")}
          print("P02_PHPUNIT_CELL="+engine+" CASES="+str(len(cases))+" ASSERTIONS="+str(sum(int(c.get("assertions","0")) for c in cases))+" FAIL="+str(counts["failure"])+" ERROR="+str(counts["error"])+" SKIP="+str(counts["skipped"]))
          for c in cases:
              if any(c.find(k) is not None for k in counts):
                  n=c.get("name","")
                  cl=c.get("class","").split("\\")[-1]
                  if re.fullmatch(r"[A-Za-z0-9_]{1,100}",cl) and re.fullmatch(r"test[A-Za-z0-9_]{1,160}",n):print("P02_PHPUNIT_FAILED_CASE="+cl+"."+n)
          if not cases:
              for marker,pat in (("PHP_FATAL",r"Fatal error"),("BOOTSTRAP",r"Error in bootstrap"),("UNDEFINED_METHOD",r"Call to undefined method"),("MISSING_CLASS",r"Class .{1,120} not found"),("CONFIG",r"XML configuration"),("NO_TESTS",r"No tests executed|No tests found"),("SQLSTATE",r"SQLSTATE"),("TYPE_ERROR",r"TypeError"),("UNKNOWN_OPTION",r"Unknown option")):
                  if re.search(pat,raw,re.I):print("P02_PHPUNIT_REASON="+marker)
          sys.exit(0 if int(rc)==0 and cases and not any(counts.values()) else 1)
          PY
            then echo "P02_PHPUNIT_RESULT=$engine:PASS"
            else
              echo "P02_PHPUNIT_RESULT=$engine:FAIL"; failed=1
              stage="$(grep -E '^P02_MATRIX_PHASE=[A-Z_]+$' "$lab/logs/matrix-$engine.log" | tail -1 | cut -d= -f2)"
              case "$stage" in PACKAGE_DISCOVER|KEY_GENERATE|MIGRATE|PHPUNIT_RUN) ;; *) stage=UNCLASSIFIED;; esac
              python3 -B "$lab/diagnose-php.py" "$lab/logs/matrix-$engine.log" "$stage"
              # Earlier exact-source six cells died before any tests. If the
              # common fatal recurs before JUnit exists, stop the other cells
              # instead of repeating the same startup failure.
              if [[ "$stage" != MIGRATE ]] && test ! -s "$lab/logs/$engine.xml" &&
                 grep -Eqi 'Fatal error|Parse error' "$lab/logs/matrix-$engine.log"; then
                echo P02_MATRIX_REMAINING_CELLS=DEFERRED_COMMON_FATAL
                break
              fi
            fi
          done
          test "$failed" = 0
          echo P02_PHPUNIT_THREE_DB=PASS
      - name: Ephemeral FULL for affected browser paths only, no artifact
        id: full
        if: always() && !cancelled() && steps.identity.outcome == 'success' && matrix.php == '8.4'
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          lab="$RUNNER_TEMP/p02-current-proof"
          export HOME="$lab/home" TMPDIR="$lab/tmp" COMPOSER_HOME="$lab/home/composer" COMPOSER_CACHE_DIR="$lab/home/composer-cache"
          export COMPOSER_NO_INTERACTION=1 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 CI=true
          export npm_config_cache="$lab/home/npm-cache" npm_config_userconfig="$lab/home/npmrc" npm_config_globalconfig="$lab/home/npm-globalrc" npm_config_fetch_retries=0 npm_config_registry=https://registry.npmjs.org
          export PATH="$lab/tools/node_modules/.bin:$PATH"
          phase() {
            local stage="$1" network="$2" limit="$3" rc=0 attempt
            shift 3
            for attempt in 1 2; do
              if timeout --kill-after=10s "$limit" "$@" >"$lab/logs/$stage.log" 2>&1; then echo "P02_PHASE=$stage:PASS"; return 0; else rc=$?; fi
              if [[ "$network" = yes && "$attempt" = 1 ]] &&
                grep -Eiq 'could not resolve (host|proxy)|temporary failure in name resolution|EAI_AGAIN|ECONNRESET|ETIMEDOUT|connection timed out|operation timed out|connection reset by peer' "$lab/logs/$stage.log" &&
                ! grep -Eiq '401|403|404|certificate|TLS|authentication|authorization|integrity|checksum|security advisories|permission denied|no matching version' "$lab/logs/$stage.log"; then
                echo "P02_PHASE_RETRY=$stage:WAIT90"; sleep 90
              else echo "P02_PHASE=$stage:FAIL"; return "$rc"; fi
            done
            return "$rc"
          }
          phase pnpm_tool yes 240 npm install --prefix "$lab/tools" --ignore-scripts --no-fund --no-audit pnpm@11.29.0
          test "$(pnpm --version)" = 11.29.0
          git -C target diff --quiet HEAD --
          git clone --local --no-hardlinks --no-recurse-submodules "$GITHUB_WORKSPACE/target" "$lab/browser-source" >"$lab/logs/browser-source-clone.log" 2>&1
          test "$(git -C "$lab/browser-source" rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test ! -e "$lab/browser-source/.env"
          phase full_build no 900 bash "$lab/browser-source/scripts/build-clean-full.sh" "$lab/full.zip"
          unzip -tqq "$lab/full.zip" >"$lab/logs/full-crc.log" 2>&1
          echo P02_PUBLIC_DEV_FULL_BUILD=PASS
          if test "$PHP_MINOR" = 8.4; then
            cd target
            phase browser_deps yes 600 pnpm install --frozen-lockfile
            export PLAYWRIGHT_BROWSERS_PATH="$lab/browsers"
            phase browser_install yes 600 pnpm exec playwright install --with-deps chromium
            test -d node_modules/@playwright/test
            git diff --quiet HEAD -- composer.lock pnpm-lock.yaml
            echo P02_PUBLIC_PINNED_BROWSER=PASS
          fi
      - name: Only outstanding full settings return scenario
        if: always() && !cancelled() && steps.full.outcome == 'success' && matrix.php == '8.4'
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          lab="$RUNNER_TEMP/p02-current-proof"
          export HOME="$lab/home" TMPDIR="$lab/tmp" COMPOSER_HOME="$lab/home/composer" COMPOSER_CACHE_DIR="$lab/home/composer-cache"
          export COMPOSER_NO_INTERACTION=1 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 CI=true
          export npm_config_cache="$lab/home/npm-cache" npm_config_userconfig="$lab/home/npmrc" npm_config_globalconfig="$lab/home/npm-globalrc" npm_config_fetch_retries=0 npm_config_registry=https://registry.npmjs.org
          export PATH="$lab/tools/node_modules/.bin:$PATH"
          phase() {
            local stage="$1" network="$2" limit="$3" rc=0 attempt
            shift 3
            for attempt in 1 2; do
              if timeout --kill-after=10s "$limit" "$@" >"$lab/logs/$stage.log" 2>&1; then echo "P02_PHASE=$stage:PASS"; return 0; else rc=$?; fi
              if [[ "$network" = yes && "$attempt" = 1 ]] &&
                grep -Eiq 'could not resolve (host|proxy)|temporary failure in name resolution|EAI_AGAIN|ECONNRESET|ETIMEDOUT|connection timed out|operation timed out|connection reset by peer' "$lab/logs/$stage.log" &&
                ! grep -Eiq '401|403|404|certificate|TLS|authentication|authorization|integrity|checksum|security advisories|permission denied|no matching version' "$lab/logs/$stage.log"; then
                echo "P02_PHASE_RETRY=$stage:WAIT90"; sleep 90
              else echo "P02_PHASE=$stage:FAIL"; return "$rc"; fi
            done
            return "$rc"
          }
          export PLAYWRIGHT_MODULE_PATH="$GITHUB_WORKSPACE/target/node_modules/@playwright/test" PLAYWRIGHT_BROWSERS_PATH="$lab/browsers"
          export E2E_CONFIRM_DISPOSABLE_NEW_VFDOC=YES E2E_EXACT_SOURCE_SHA="$TARGET_SHA" E2E_EMAIL=synthetic@example.test E2E_PASSWORD=synthetic-secure-password
          mkdir -m 700 "$lab/synthetic-screenshots"
          export VF_P02_SCREENSHOTS="$lab/synthetic-screenshots"
          test -f "$lab/full.zip"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          python3 -B - <<'PY'
          import pathlib,re
          s=pathlib.Path("target/tests/e2e/run_final_stage_batch.sh").read_text()
          m=re.search(r"(?ms)^tests=\(\n(.*?)^\)",s)
          assert m
          expected=("stage6_workspace","quick_capture","standalone_markdown","bulk_organization","revision_compare","recent_category","notebook_reader","rich_reader_template","editor","private_attachment_reader","transfer_branding","settings_nine")
          assert tuple(re.findall(r"(?m)^\s{2}([a-z0-9_]+)\.browser\.cjs\s*$",m.group(1)))==expected
          PY
          cat >"$lab/one-browser.sh" <<'SH'
          set -Eeuo pipefail
          umask 077
          lab="$RUNNER_TEMP/p02-current-proof"
          flow="$1"
          site="$lab/site-$flow"
          mkdir -m 700 "$site"
          unzip -q "$lab/full.zip" -d "$site"
          test ! -e "$site/.env"
          printf '%s\n' '<?php' '$p=parse_url($_SERVER["REQUEST_URI"],PHP_URL_PATH);' 'if(is_file(__DIR__."/public".$p))return false;' 'require __DIR__."/public/index.php";' >"$site/router.php"
          if curl -fsS --connect-timeout 1 --max-time 2 http://127.0.0.1:8000/setup.php >/dev/null 2>&1; then echo P02_BROWSER_STALE_SITE=FAIL; exit 2; fi
          php -S 127.0.0.1:8000 -t "$site/public" "$site/router.php" >"$lab/logs/server-$flow.log" 2>&1 &
          server="$!"
          trap 'kill "$server" 2>/dev/null || true; wait "$server" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 40); do
            kill -0 "$server" || exit 2
            if curl -fsS --connect-timeout 1 --max-time 2 http://127.0.0.1:8000/setup.php >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          if test "$flow" = setup_browser; then
            export P02_FULL_EXTRACT_ROOT="$site" P02_FULL_BASE_URL=http://127.0.0.1:8000
            P02_SETUP_BROWSER_REAL_INSTALL=YES node target/tests/e2e/setup_browser.cjs
          elif test "$flow" = legacy_ux_inheritance; then
            python3 -B target/tests/e2e/full_install_probe.py --root "$site" --base http://127.0.0.1:8000 --engine sqlite --mode clean
            node "target/tests/e2e/$flow.browser.cjs" "$VF_P02_SCREENSHOTS"
          else
            python3 -B target/tests/e2e/full_install_probe.py --root "$site" --base http://127.0.0.1:8000 --engine sqlite --mode clean
            node "target/tests/e2e/$flow.browser.cjs"
          fi
          SH
          failed=0
          for flow in legacy_ux_inheritance; do
            if bash "$lab/one-browser.sh" "$flow" >"$lab/logs/browser-$flow.log" 2>&1; then echo "P02_PUBLIC_BROWSER=$flow:PASS"
            else
              echo "P02_PUBLIC_BROWSER=$flow:FAIL"
              failed=1
            fi
            python3 -B - "$lab/logs/browser-$flow.log" <<'PY'
          import pathlib,re,sys
          raw=pathlib.Path(sys.argv[1]).read_text(errors="replace")
          for line in raw.splitlines():
              if re.fullmatch(r"P02_(?:FINAL_[A-Z0-9_]+|SETUP_[A-Z0-9_]+|STAGE4_INSTALLER_BROWSER|STAGE6_MUTATION_PENDING_SAVE_AND_TRASH_RESTORE|EDITOR_[A-Z0-9_]+|BULK_ORGANIZE_[A-Z0-9_]+|SETTINGS_[A-Z0-9_]+)=[A-Za-z0-9_-]{1,100}",line):
                  print(line)
              m=re.fullmatch(r"P02_(?:STAGE3_BROWSER_EDITOR|SETTINGS_NINE_BROWSER)=FAIL checkpoint=([A-Za-z0-9_-]{1,100})",line)
              if m: print("P02_BROWSER_EXACT_CHECKPOINT="+m.group(1))
          for label in ("TimeoutError","AssertionError","TypeError","ReferenceError"):
              if label in raw: print("P02_PUBLIC_BROWSER_ERROR="+label)
          PY
          done
          test "$failed" = 0
          echo P02_PUBLIC_SETTINGS_RETURN_REMAINDER=PASS
      - name: Always erase private source, runtime, FULL, screenshots and synthetic logs
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          for dir in "$GITHUB_WORKSPACE/target" "$GITHUB_WORKSPACE/control" "$RUNNER_TEMP/p02-current-proof"; do
            test ! -L "$dir"
            if test -e "$dir"; then
              test -d "$dir" && test "$(stat -c %u "$dir")" = "$(id -u)"
              rm -rf -- "$dir"
            fi
            test ! -e "$dir"
          done
          echo P02_PUBLIC_PRIVATE_CLEANUP=PASS
