name: gov-authority-drift-negation-fix-temp

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gov-authority-drift-negation-fix-temp.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout exact gov-doc PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: cfe20406b6ac876a8cb56679e815967180bbad62
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: gov

      - name: Checkout exact P01 validation sample
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 63aece29b7562a800d6771a1479bcfc9faa26cab
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product

      - name: Exact identities
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C gov rev-parse HEAD)" = "cfe20406b6ac876a8cb56679e815967180bbad62"
          test "$(git -C product rev-parse HEAD)" = "63aece29b7562a800d6771a1479bcfc9faa26cab"
          echo GOV_DRIFT_FIX_EXACT_SOURCE=PASS

      - name: Syntax and regression selftest
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile gov/governance/authority/tools/authority_drift_lint.py
          python3 -m py_compile gov/governance/authority/tools/test_authority_drift_lint_negation.py
          python3 gov/governance/authority/tools/test_authority_drift_lint_negation.py | tee /tmp/selftest.txt
          grep -q '^VF_AUTHORITY_DRIFT_NEGATION_CONTEXT_TEST=PASS$' /tmp/selftest.txt
          echo GOV_DRIFT_FIX_SELFTEST=PASS

      - name: P01 Current Authority validation without wrapper
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 gov/governance/authority/tools/authority_drift_lint.py product \
            --rules gov/governance/authority/VF_AUTHORITY_DRIFT_LINT_RULES_V1.0.json \
            --json > /tmp/p01-drift.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/p01-drift.json',encoding='utf-8'))
          current={
            'docs/authority/CURRENT.md',
            'docs/authority/RPD.md',
            'docs/authority/SSOT.md',
            'docs/authority/ACCEPTANCE_MATRIX.md',
            'docs/authority/P01_FUNCTIONAL_CONTRACT_20260829.md',
          }
          bad=[x for x in d['findings'] if x['severity']=='REVIEW_REQUIRED' and x['file'] in current]
          print('P01_CURRENT_AUTHORITY_REVIEW_REQUIRED='+str(len(bad)))
          if bad:
            print(json.dumps(bad,ensure_ascii=False,indent=2))
            raise SystemExit(2)
          print('GOV_DRIFT_FIX_P01_CURRENT_AUTHORITY=PASS')
          PY

      - name: Ensure true historical snapshots remain reviewable
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/p01-drift.json',encoding='utf-8'))
          historical=[x for x in d['findings'] if x['severity']=='REVIEW_REQUIRED' and x['file'] not in {
            'docs/authority/CURRENT.md','docs/authority/RPD.md','docs/authority/SSOT.md',
            'docs/authority/ACCEPTANCE_MATRIX.md','docs/authority/P01_FUNCTIONAL_CONTRACT_20260829.md'}]
          print('P01_HISTORICAL_REVIEW_REQUIRED='+str(len(historical)))
          if not historical:
            raise SystemExit('expected historical snapshots to remain reviewable')
          print('GOV_DRIFT_FIX_FAIL_CLOSED_PRESERVED=PASS')
          PY