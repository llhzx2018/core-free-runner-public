name: P07 Care rc44 compact resource formal release
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-care-rc44-one-shot-release.yml'
permissions:
  contents: read
jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      github.event.pull_request.title == 'release(P07): rc44 resource UI source-consistent closure'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout canonical verified Public main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Verify release source and 13 exact-source Machine Gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 'ac685b1267a013003a00cd3468b36eb5797c9935'
          test "$(cat dist/p07/0.1.0/overlay/BUILD_ID)" = '0.1.0-release84'
          pkg='packages/p07-system-care/0.1.0-rc44'
          test "$(cat "$pkg/VERSION")" = '0.1.0-rc44'
          test "$(git hash-object "$pkg/MANIFEST.gitblob")" = '933fdd4b849b219ee3d7ff0ff9dd601d3782200a'
          test "$(git hash-object "$pkg/vf-system-care.sh")" = 'baa684e32c3240542c1e71f6ed37250490ccb677'
          test "$(git hash-object "$pkg/lib/resource_brief.py")" = '77c9c576eb0ea1cb92232d7bffe66283184e7782'
          (cd "$pkg" && while read -r hash rel; do test "$(git hash-object "$rel")" = "$hash"; done < MANIFEST.gitblob)
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc44"' installers/p07-toolbox.sh
          grep -Fq 'VPS_AUDIT_EXPECTED="V2.1.0"' installers/p07-toolbox.sh
          grep -Fq 'VF_NODE_EXPECTED="0.1.0-rc13"' installers/p07-toolbox.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release84"' installers/p07-toolbox.sh
          grep -Fq "MANIFEST_BLOB='933fdd4b849b219ee3d7ff0ff9dd601d3782200a'" installers/p07-system-care.sh
          grep -Fq 'engine.build_plan(snap, rec)' "$pkg/lib/resource_brief.py"
          grep -Fq 'resource_brief.py" overview' "$pkg/vf-system-care.sh"
          grep -Fq 'resource_brief.py" plan' "$pkg/resource-apply.sh"
          for id in 37759545201 37759545183 37759545112 37759545154 37759545259 37759545093 37759545199 37759545217 37759545172 37759545139 37759545110 37759545197 37759545133; do
            test "$(gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$id" --jq .head_sha)" = '8733efebb60e47b511e6fd7d8a681942dc81752e'
            test "$(gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$id" --jq .conclusion)" = success
          done
          echo P07_CARE_RC44_FORMAL_PRECONDITIONS=PASS
      - name: Publish formal release and remotely read back
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          repo='llhzx2018/core-free-runner-public'
          tag='p07-v0.1.0-release84-care-rc44-resource-one-screen'
          target='ac685b1267a013003a00cd3468b36eb5797c9935'
          if gh release view "$tag" -R "$repo" >/dev/null 2>&1; then
            test "$(gh release view "$tag" -R "$repo" --json targetCommitish --jq .targetCommitish)" = "$target"
          else
            gh release create "$tag" -R "$repo" --target "$target" \
              --title 'P07 · 服务器维护 rc44 · 性能配置统一单屏展示' \
              --notes 'OWNER 实机反馈性能配置两屏说明重复、排版零散，且 1966MB 内存的首屏误报不可应用、次屏却可应用。本版将概览与实际执行前评估统一使用同一真实安全计划，显示服务器参数、适用性、拟调整项和明确确认；失败条件不提供 A 应用入口。二次确认与原来的生产引擎独立复验仍全部保留，输出短摘要，详细恢复记录仍存本机。既有 MySQL/PHP 调整算法、校准与安全回滚均未改动。菜单1节点rc13、菜单2测速V2.1.0、菜单3/5、Server Ops release84 全部冻结。13/13 隔离 Machine Gates PASS；生产未自动修改，OWNER 验收另行判定。' \
              --latest=false
          fi
          test "$(gh release view "$tag" -R "$repo" --json tagName --jq .tagName)" = "$tag"
          echo P07_CARE_RC44_FORMAL_RELEASE=PASS
