name: TEMP S01-C02 1067 ZIP upload real-view 3-flow browser proof
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  zip-input:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 1ee0dde8391e7adaf2a4a8060099b1a31a054185
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: target
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, mbstring
      - name: Read-only check exact code and real ZIP upload UI
        run: |
          set -Eeuo pipefail
          mkdir -p evidence /tmp/zip-qa-node
          test "$(git -C target rev-parse HEAD)" = 1ee0dde8391e7adaf2a4a8060099b1a31a054185
          test "$(git -C target rev-parse HEAD^{tree})" = 7e6d11b9db5d3a69bdafe29a419ccd55bc2627a4
          test "$(cat target/VERSION)" = 1.21.1067
          php -l target/tests/s01-c02-1211067-zip-input-idle-view-fixture.php
          node --check target/tests/s01-c02-1211067-zip-input-browser-e2e.js
          cd /tmp/zip-qa-node
          npm init -y >/dev/null
          npm install --no-save playwright@1.58.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          export NODE_PATH=/tmp/zip-qa-node/node_modules
          cd "$GITHUB_WORKSPACE"
          node target/tests/s01-c02-1211067-zip-input-browser-e2e.js | tee evidence/browser.json
          jq -e '.pass and (.scenarios|length)==3 and .real_view and .real_js and .production=="NOT_TOUCHED"' evidence/browser.json
      - name: Save evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s01-c02-1067-zip-upload-three-flow
          path: evidence/
          retention-days: 14
