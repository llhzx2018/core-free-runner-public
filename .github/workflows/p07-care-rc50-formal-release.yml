name: P07 Care rc50 one-time Formal Release
on:
  push:
    branches: [main]
    paths:
      - 'packages/p07-system-care/0.1.0-rc50/**'
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify rc50 immutable source and installer pointers
        shell: bash
        run: |
          set -Eeuo pipefail
          pkg=packages/p07-system-care/0.1.0-rc50
          test "$(cat "$pkg/VERSION")" = '0.1.0-rc50'
          test "$(git hash-object "$pkg/MANIFEST.gitblob")" = 'ac2fb497b0b9b63884068d45d2f9a168bb186c71'
          (cd "$pkg" && while read -r digest file; do test "$(git hash-object "$file")" = "$digest"; done < MANIFEST.gitblob)
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc50"' installers/p07-toolbox.sh
          grep -Fq "VERSION='0.1.0-rc50'" installers/p07-system-care.sh
          grep -Fq "MANIFEST_BLOB='ac2fb497b0b9b63884068d45d2f9a168bb186c71'" installers/p07-system-care.sh
          bash -n "$pkg/intrusion-evidence.sh" installers/p07-toolbox.sh installers/p07-system-care.sh
      - name: Publish exact merge SHA as Formal Release; verify tag and metadata
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          TAG=p07-v0.1.0-release84-care-rc50-wp-status-fail-closed
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title 'P07 · rc50 WordPress 状态故障禁止可信基线更新' \
              --notes 'rc49 已发布且保持不可变。额外隔离审查发现：WordPress 安全状态读取失败时界面可能把历史记录显示为 0。rc50 在状态失败、监测未开启或历史数量异常时拒绝更新参考状态；23 条历史记录的数量及二次 Y/N 确认保留，无异常状态仍可正常使用。历史证据保留不删，所有服务器与网站 Production 操作禁止自动执行。OWNER 实机验收仍为 NOT_RUN。'
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')" = "$GITHUB_SHA"
          test "$(gh release view "$TAG" --json tagName --jq '.tagName')" = "$TAG"
          test "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = false
          echo P07_RC50_FORMAL_RELEASE_REMOTE_READBACK=PASS
