name: P07 System Care RC11 Candidate Install Upgrade Gate V2

on:
  push:
    branches: [gate/p07-system-care-rc11-inventory-discovery-20260908]
    paths:
      - '.github/workflows/p07-system-care-rc11-candidate-install-upgrade-gate-v2.yml'

permissions:
  contents: read

env:
  CANDIDATE_BRANCH: gate/p07-system-care-rc11-inventory-discovery-20260908

jobs:
  fresh-and-classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch fixed candidate installer and pin package branch
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --proto '=https' --tlsv1.2 "https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/${CANDIDATE_BRANCH}/installers/p07-system-care.sh" -o /tmp/rc11.sh
          sed -i "s|raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/|raw.githubusercontent.com/llhzx2018/core-free-runner-public/${CANDIDATE_BRANCH}/|" /tmp/rc11.sh
          grep -Fq "VERSION='0.1.0-rc11'" /tmp/rc11.sh
          grep -Fq "MANIFEST_BLOB='76485789fb23904b506e0914fe7f17cd8e3aceb5'" /tmp/rc11.sh
          grep -Fq '"$stage/intrusion-evidence.sh" "$stage/intrusion-evidence-entry.sh"' /tmp/rc11.sh
          grep -Fq '"$stage/lib/intrusion_state.py" "$stage/lib/intrusion_discovery.py"' /tmp/rc11.sh
          bash -n /tmp/rc11.sh
      - name: Fresh install exact candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo bash /tmp/rc11.sh status >/dev/null
          test "$(NO_COLOR=1 /usr/local/bin/vf-system-care --version | awk '{print $NF}')" = 0.1.0-rc11
          sudo test -x /opt/vf-system-care/intrusion-evidence-entry.sh
          sudo test -f /opt/vf-system-care/lib/intrusion_discovery.py
          sudo test ! -e /opt/vf-system-care/lib/intrusion_scan_rc9.py
          echo P07_RC11_CANDIDATE_FRESH_INSTALL=PASS
      - name: Classify CloudPanel sites without inventing WordPress
        shell: bash
        run: |
          set -Eeuo pipefail
          tmp=/tmp/rc11-no-wp
          home="$tmp/home"; nginx="$tmp/nginx"; db="$tmp/db.sq3"; state="$tmp/state"; systemd="$tmp/systemd"; cron="$tmp/cron/p07"
          mkdir -p "$home/alice/htdocs/a.test" "$home/bob/htdocs/b.test" "$home/carol/htdocs/c.test" "$nginx" "$systemd" "$(dirname "$cron")"
          for p in "$home/alice/htdocs/a.test" "$home/bob/htdocs/b.test" "$home/carol/htdocs/c.test"; do printf '%s\n' '<?php echo "php";' > "$p/index.php"; done
          python3 - "$db" <<'PY'
          import sqlite3,sys
          c=sqlite3.connect(sys.argv[1]); c.execute('CREATE TABLE site(id INTEGER PRIMARY KEY, domain_name TEXT, user TEXT, type TEXT)')
          c.executemany('INSERT INTO site(domain_name,user,type) VALUES(?,?,?)',[('a.test','alice','php'),('b.test','bob','php'),('c.test','carol','php')]); c.commit(); c.close()
          PY
          sudo env P07_IE_DISCOVERY_HOME="$home" P07_IE_CLOUDPANEL_DB="$db" P07_IE_NGINX_SITES_DIR="$nginx" python3 /opt/vf-system-care/lib/intrusion_discovery.py --kv > /tmp/no-wp.txt
          grep -Fxq 'P07_WP_DISCOVERY_STATUS=NO_WORDPRESS' /tmp/no-wp.txt
          grep -Fxq 'P07_WP_DISCOVERY_CLOUDPANEL_SITES=3' /tmp/no-wp.txt
          grep -Fxq 'P07_WP_DISCOVERY_WORDPRESS_SITES=0' /tmp/no-wp.txt
          printf '1\n\n0\n' | sudo script -qec "env NO_COLOR=1 P07_IE_STATE_DIR='$state' P07_IE_DISCOVERY_HOME='$home' P07_IE_CLOUDPANEL_DB='$db' P07_IE_NGINX_SITES_DIR='$nginx' P07_IE_SYSTEMD_DIR='$systemd' P07_IE_CRON_FILE='$cron' P07_IE_ENTRY=/bin/true /usr/local/bin/vf-system-care evidence menu" /dev/null > /tmp/no-wp-menu.txt 2>&1
          grep -Fq 'CloudPanel   已识别 3 个网站' /tmp/no-wp-menu.txt
          grep -Fq 'WordPress    0 个' /tmp/no-wp-menu.txt
          grep -Fq '不用重复按开启' /tmp/no-wp-menu.txt
          sudo test ! -e "$state/baseline.json"
          test ! -e "$systemd/vf-system-care-intrusion-evidence.service"
          test ! -e "$systemd/vf-system-care-intrusion-evidence.timer"
          test ! -e "$cron"
          echo P07_RC11_CANDIDATE_NO_WORDPRESS_UX=PASS
      - name: Deep Nginx WordPress root enables normally
        shell: bash
        run: |
          set -Eeuo pipefail
          tmp=/tmp/rc11-wp
          home="$tmp/home"; nginx="$tmp/nginx"; db="$tmp/db.sq3"; state="$tmp/state"; systemd="$tmp/systemd"; cron="$tmp/cron/p07"
          root="$home/alice/htdocs/wp.test/releases/current/public"
          mkdir -p "$root/wp-content/uploads" "$nginx" "$systemd" "$(dirname "$cron")"
          printf '%s\n' '<?php // config' > "$root/wp-config.php"
          printf '%s\n' '<?php // settings' > "$root/wp-settings.php"
          python3 - "$db" <<'PY'
          import sqlite3,sys
          c=sqlite3.connect(sys.argv[1]); c.execute('CREATE TABLE site(id INTEGER PRIMARY KEY, domain_name TEXT, user TEXT, type TEXT)'); c.execute('INSERT INTO site(domain_name,user,type) VALUES(?,?,?)',('wp.test','alice','php')); c.commit(); c.close()
          PY
          cat > "$nginx/wp.test.conf" <<EOF
          server {
            server_name wp.test;
            root $root;
          }
          EOF
          printf '1\n1\n' | sudo script -qec "env NO_COLOR=1 P07_IE_STATE_DIR='$state' P07_IE_DISCOVERY_HOME='$home' P07_IE_CLOUDPANEL_DB='$db' P07_IE_NGINX_SITES_DIR='$nginx' P07_IE_SYSTEMD_DIR='$systemd' P07_IE_CRON_FILE='$cron' P07_IE_ENTRY=/bin/true /usr/local/bin/vf-system-care evidence menu" /dev/null > /tmp/wp-menu.txt 2>&1
          grep -Fq 'CloudPanel   已识别 1 个网站' /tmp/wp-menu.txt
          grep -Fq 'WordPress    已识别 1 个' /tmp/wp-menu.txt
          grep -Fq '网站安全保护已开启' /tmp/wp-menu.txt
          sudo test -f "$state/baseline.json"
          test -f "$systemd/vf-system-care-intrusion-evidence.service"
          test -f "$systemd/vf-system-care-intrusion-evidence.timer"
          echo P07_RC11_CANDIDATE_WORDPRESS_ENABLE=PASS

  failed-residue-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install public RC10 and reproduce failed baseline residue
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/p07-system-care.sh -o /tmp/rc10.sh
          grep -Fq "VERSION='0.1.0-rc10'" /tmp/rc10.sh
          sudo bash /tmp/rc10.sh status >/dev/null
          sudo rm -rf /var/lib/vf-system-care/intrusion-evidence
          mkdir -p /tmp/empty-home
          set +e
          sudo env P07_IE_DISCOVERY_HOME=/tmp/empty-home python3 /opt/vf-system-care/lib/intrusion_evidence.py --state-dir /var/lib/vf-system-care/intrusion-evidence baseline >/tmp/old-fail.out 2>/tmp/old-fail.err
          rc=$?
          set -e
          test "$rc" = 20
          sudo test -f /var/lib/vf-system-care/intrusion-evidence/.lock
          sudo test ! -e /var/lib/vf-system-care/intrusion-evidence/baseline.json
          sudo test ! -e /etc/systemd/system/vf-system-care-intrusion-evidence.timer
          echo P07_RC11_START_FROM_RC10_FAILED_RESIDUE=PASS
      - name: Upgrade fixed candidate without inventing enrollment
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --proto '=https' --tlsv1.2 "https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/${CANDIDATE_BRANCH}/installers/p07-system-care.sh" -o /tmp/rc11.sh
          sed -i "s|raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/|raw.githubusercontent.com/llhzx2018/core-free-runner-public/${CANDIDATE_BRANCH}/|" /tmp/rc11.sh
          sudo bash /tmp/rc11.sh status >/dev/null
          test "$(NO_COLOR=1 /usr/local/bin/vf-system-care --version | awk '{print $NF}')" = 0.1.0-rc11
          sudo test -f /var/lib/vf-system-care/intrusion-evidence/.lock
          sudo test ! -e /var/lib/vf-system-care/intrusion-evidence/baseline.json
          sudo test ! -e /var/lib/vf-system-care/intrusion-evidence/scan_state.json
          sudo NO_COLOR=1 /usr/local/bin/vf-system-care evidence status > /tmp/after.txt
          grep -Fq '网站安全   未开启' /tmp/after.txt
          sudo test ! -e /etc/systemd/system/vf-system-care-intrusion-evidence.timer
          echo P07_RC11_FAILED_RESIDUE_UPGRADE_SAFE=PASS

  valid-state-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install public RC10 and create valid state/scheduler bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/p07-system-care.sh -o /tmp/rc10.sh
          sudo bash /tmp/rc10.sh status >/dev/null
          sudo rm -rf /var/lib/vf-system-care/intrusion-evidence
          site=/tmp/valid-wp
          mkdir -p "$site/wp-content/uploads"
          printf '%s\n' '<?php // config' > "$site/wp-config.php"
          printf '%s\n' '<?php // settings' > "$site/wp-settings.php"
          sudo python3 /opt/vf-system-care/lib/intrusion_evidence.py --state-dir /var/lib/vf-system-care/intrusion-evidence baseline --site-root "$site" >/dev/null
          printf '%s\n' '[Unit]' 'Description=P07 fixture' | sudo tee /etc/systemd/system/vf-system-care-intrusion-evidence.service >/dev/null
          printf '%s\n' '[Timer]' 'OnCalendar=daily' | sudo tee /etc/systemd/system/vf-system-care-intrusion-evidence.timer >/dev/null
          sudo sha256sum /var/lib/vf-system-care/intrusion-evidence/baseline.json /var/lib/vf-system-care/intrusion-evidence/scan_state.json /etc/systemd/system/vf-system-care-intrusion-evidence.service /etc/systemd/system/vf-system-care-intrusion-evidence.timer | sudo tee /tmp/before.sha >/dev/null
          echo P07_RC11_START_FROM_RC10_VALID_STATE=PASS
      - name: Upgrade fixed candidate preserving state and scheduler bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --proto '=https' --tlsv1.2 "https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/${CANDIDATE_BRANCH}/installers/p07-system-care.sh" -o /tmp/rc11.sh
          sed -i "s|raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/|raw.githubusercontent.com/llhzx2018/core-free-runner-public/${CANDIDATE_BRANCH}/|" /tmp/rc11.sh
          sudo bash /tmp/rc11.sh status >/dev/null
          test "$(NO_COLOR=1 /usr/local/bin/vf-system-care --version | awk '{print $NF}')" = 0.1.0-rc11
          sudo sha256sum -c /tmp/before.sha
          test "$(sudo stat -c '%a' /var/lib/vf-system-care/intrusion-evidence)" = 700
          test "$(sudo stat -c '%a' /var/lib/vf-system-care/intrusion-evidence/baseline.json)" = 600
          test "$(sudo stat -c '%a' /var/lib/vf-system-care/intrusion-evidence/scan_state.json)" = 600
          echo P07_RC11_VALID_STATE_UPGRADE_PRESERVED=PASS

  final:
    needs: [fresh-and-classify, failed-residue-upgrade, valid-state-upgrade]
    runs-on: ubuntu-24.04
    steps:
      - run: echo P07_SYSTEM_CARE_RC11_CANDIDATE_INSTALL_UPGRADE_GATE=PASS
