name: P01 V2.26 Develop Exact Gate
on:
  push:
    branches: [task/p01-v222-multi-surface-gate-20260828]
    paths: ['.github/workflows/p01-v226-develop-exact-gate-20260828.yml']
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE: 66c3b69527c3273c8dc923c88b3d5bfee8eda3ce
      TREE: 1f68db30b1a060456378dd482bbf7aaa5235f9fd
      FEATURE_HEAD: ae9e083319a0b191e180cdcb332a5a16ae6e1e3a
      FEATURE_GATE: '33162587296'
      SCREENSHOT_GATE: '33162117162'
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 2
          path: product
      - name: Exact develop identity and evidence
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$SOURCE"
          test "$(git -C product rev-parse HEAD^{tree})" = "$TREE"
          git -C product cat-file -e "$FEATURE_HEAD^{commit}"
          test "$(git -C product rev-parse "$FEATURE_HEAD^{tree}")" = "$TREE"
          test "$(gh api repos/llhzx2018/vf-start/branches/develop | jq -r '.commit.sha')" = "$SOURCE"
          for run in "$FEATURE_GATE" "$SCREENSHOT_GATE"; do gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$run" | jq -e '.status=="completed" and .conclusion=="success"' >/dev/null; done
          find product/src -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          find product/src -name '*.js' -print0 | xargs -0 -n1 node --check >/dev/null
          echo P01_V226_DEVELOP_IDENTITY=PASS
      - name: Fresh runtime regression
        run: |
          set -Eeuo pipefail
          ROOT=/tmp/p01-v226-develop; COOKIE=/tmp/p01-v226-develop.cookies
          rm -rf "$ROOT" "$COOKIE"; cp -a product/src "$ROOT"
          php -S 127.0.0.1:18312 -t "$ROOT" >/tmp/p01-v226-develop.log 2>&1 & PID=$!; trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS -c "$COOKIE" -b "$COOKIE" http://127.0.0.1:18312/setup.php -o /tmp/setup.html && break; sleep 1; done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/setup.html',encoding='utf-8').read();print(re.search(r'name="setup_csrf"\s+value="([^"]+)"',s).group(1))
          PY
          )
          curl -sS -c "$COOKIE" -b "$COOKIE" -X POST http://127.0.0.1:18312/setup.php --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=V226 Develop' --data-urlencode 'admin_password=P01V226!Develop' --data-urlencode 'admin_password_confirm=P01V226!Develop' -o /tmp/post.html
          test -f "$ROOT/app/.runtime.php"
          curl -fsS -c "$COOKIE" -b "$COOKIE" -H 'Content-Type: application/json' -X POST 'http://127.0.0.1:18312/api.php?action=login' --data '{"password":"P01V226!Develop"}' | jq -e '.ok==true' >/dev/null
          curl -fsS -c "$COOKIE" -b "$COOKIE" http://127.0.0.1:18312/surfaces.php -o /tmp/all.html
          grep -F '全部收藏' /tmp/all.html >/dev/null
          ! grep -F '你的互联网，从这里继续。' /tmp/all.html
          ! grep -F '＋ 新增' /tmp/all.html
          curl -fsS -c "$COOKIE" -b "$COOKIE" http://127.0.0.1:18312/surface-manager.php -o /tmp/inbox.html
          grep -F '系统认出的内容' /tmp/inbox.html >/dev/null
          ! grep -F 'vf-editor-row' /tmp/inbox.html
          php "$ROOT/cli/verify.php" | grep -Fx 'VERIFY_PASS=YES'
          php "$ROOT/cli/surface-verify.php" | grep -Fx 'MULTI_SURFACE_PASS=YES'
          php "$ROOT/cli/baseline-verify.php" | tee /tmp/base.txt
          grep -Fx 'BASELINE_CORE_PASS=YES' /tmp/base.txt
          grep -Fx 'DRIFT_COUNT=0' /tmp/base.txt
          grep -Fx 'UNKNOWN_COUNT=0' /tmp/base.txt
          echo P01_V226_DEVELOP_RUNTIME=PASS
      - name: Verdict
        run: |
          echo P01_V226_DEVELOP=$SOURCE
          echo P01_V226_TREE=$TREE
          echo P01_V226_DEVELOP_EXACT_GATE=PASS
          echo RELEASE=NO
          echo PRODUCTION=NO
