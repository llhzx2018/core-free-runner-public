name: P01 V2.24 Develop Exact Source Gate

on:
  push:
    branches:
      - task/p01-v222-multi-surface-gate-20260828
    paths:
      - '.github/workflows/p01-v224-develop-exact-source-gate-20260828.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      DEVELOP_SOURCE: 537c96c569203b09bfdec563aef8daf7b105e424
      VERIFIED_PR_HEAD: 21b2a7ac8ff7b11013f57c176407f773c288738c
      SCHEMA: '2026082801'
    steps:
      - name: Checkout exact develop source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.DEVELOP_SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: p01
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - name: Develop exact identity and tree fence
        env:
          READ_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          cd p01
          test "$(git rev-parse HEAD)" = "$DEVELOP_SOURCE"
          test "$(git ls-remote "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" refs/heads/develop | awk '{print $1}')" = "$DEVELOP_SOURCE"
          test "$(git rev-parse "$DEVELOP_SOURCE^{tree}")" = "$(git rev-parse "$VERIFIED_PR_HEAD^{tree}")"
          test "$(tr -d '\r\n' < VERSION)" = '2.23.0'
          echo P01_V224_DEVELOP_IDENTITY=PASS
      - name: Syntax and authority
        run: |
          set -Eeuo pipefail
          find p01/src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find p01/src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          python3 -m json.tool p01/VF_PROJECT.json >/dev/null
          grep -F 'V2.24.0 UX Rebaseline' p01/docs/authority/CURRENT.md >/dev/null
          echo P01_V224_DEVELOP_STATIC=PASS
      - name: Fresh runtime UX regression
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-v224-develop
          cp -a p01/src /tmp/p01-v224-develop
          cd /tmp/p01-v224-develop
          php -S 127.0.0.1:18237 -t . >/tmp/p01-v224-develop-server.log 2>&1 & echo $! >/tmp/p01-v224-develop.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18237/setup.php -o /tmp/p01-v224-develop-setup.html && break; sleep 1; done
          curl -fsS -c /tmp/p01-v224-develop.cookies -b /tmp/p01-v224-develop.cookies http://127.0.0.1:18237/setup.php -o /tmp/p01-v224-develop-setup.html
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-v224-develop-setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c /tmp/p01-v224-develop.cookies -b /tmp/p01-v224-develop.cookies -X POST http://127.0.0.1:18237/setup.php --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=VF Start V224 Develop' --data-urlencode 'admin_password=P01V224!Develop' --data-urlencode 'admin_password_confirm=P01V224!Develop' -o /tmp/p01-v224-develop-post.html
          php cli/verify.php | grep -Fx 'VERIFY_PASS=YES'
          php cli/surface-verify.php | tee /tmp/p01-v224-develop-surface.txt
          grep -Fx 'MULTI_SURFACE_PASS=YES' /tmp/p01-v224-develop-surface.txt
          grep -Fx "WORKING_SCHEMA=$SCHEMA" /tmp/p01-v224-develop-surface.txt
          php cli/baseline-verify.php | tee /tmp/p01-v224-develop-base.txt
          grep -Fx 'BASELINE_CORE_PASS=YES' /tmp/p01-v224-develop-base.txt
          grep -Fx 'DRIFT_COUNT=0' /tmp/p01-v224-develop-base.txt
          grep -Fx 'UNKNOWN_COUNT=0' /tmp/p01-v224-develop-base.txt
          curl -fsS -c /tmp/p01-v224-develop-admin.cookies -b /tmp/p01-v224-develop-admin.cookies -H 'Content-Type: application/json' -X POST 'http://127.0.0.1:18237/api.php?action=login' --data '{"password":"P01V224!Develop"}' | jq -e '.ok==true' >/dev/null
          curl -fsS -c /tmp/p01-v224-develop-admin.cookies -b /tmp/p01-v224-develop-admin.cookies http://127.0.0.1:18237/surfaces.php | grep -F 'PERSONAL INTERNET HOME' >/dev/null
          curl -fsS -c /tmp/p01-v224-develop-admin.cookies -b /tmp/p01-v224-develop-admin.cookies http://127.0.0.1:18237/start.php | grep -F 'WEB START' >/dev/null
          curl -fsS -c /tmp/p01-v224-develop-admin.cookies -b /tmp/p01-v224-develop-admin.cookies http://127.0.0.1:18237/channels.php | grep -F 'CONTENT MEMORY' >/dev/null
          curl -fsS -c /tmp/p01-v224-develop-admin.cookies -b /tmp/p01-v224-develop-admin.cookies http://127.0.0.1:18237/watch.php | grep -F 'PERSONAL WATCHLIST' >/dev/null
          curl -fsS -c /tmp/p01-v224-develop-admin.cookies -b /tmp/p01-v224-develop-admin.cookies http://127.0.0.1:18237/surface-manager.php | grep -F 'RESOURCE INBOX' >/dev/null
          test "$(php -r "require 'app/bootstrap.php'; echo strtolower((string)vf_db()->query('PRAGMA integrity_check')->fetchColumn());")" = ok
          test "$(php -r "require 'app/bootstrap.php'; echo count(vf_db()->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC));")" = 0
          kill "$(cat /tmp/p01-v224-develop.pid)" 2>/dev/null || true
          echo P01_V224_DEVELOP_REGRESSION=PASS
      - name: Verdict
        run: |
          echo P01_V224_DEVELOP_SOURCE="$DEVELOP_SOURCE"
          echo P01_V224_DEVELOP_MACHINE=PASS
          echo RELEASE=NO
          echo PRODUCTION=NO
