name: P08 PR55 rootless Owner update wake (ephemeral)

on:
  pull_request:
    paths:
      - '.github/workflows/p08-pr55-owner-wake-temp.yml'

permissions:
  contents: read

jobs:
  owner-site-worker-wake:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Get PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: posix
      - name: Get Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Temporary private source checkout (never persisted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          repository: llhzx2018/vf-adops
          ref: 77f70e2902bc3c18a65154f2e576ab64f082bce7
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: .p08-source
          persist-credentials: false
      - name: Exact HEAD rootless CLI, controller and Vue tests
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rm -rf -- "$GITHUB_WORKSPACE/.p08-source"' EXIT
          cd "$GITHUB_WORKSPACE/.p08-source"
          test "$(git rev-parse HEAD)" = 77f70e2902bc3c18a65154f2e576ab64f082bce7
          php -l src/Upgrade/OwnerSiteWorkerDispatcher.php
          php -l app/Http/Controllers/OwnerUpgradeController.php
          php -l app/Http/Controllers/OwnerReleaseDiscoveryController.php
          php -l tests/test_owner_site_worker_dispatcher.php
          php -l tests/test_owner_upgrade_transport.php
          php -l tests/test_owner_release_discovery_controller.php
          php tests/test_owner_site_worker_dispatcher.php
          php tests/test_owner_upgrade_transport.php
          php tests/test_owner_release_discovery_controller.php
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run test:unit
          echo P08_PR55_ROOTLESS_WAKE_SOURCE_TEST=PASS
      - name: Remove private workspace after any result
        if: always()
        shell: bash
        run: rm -rf -- "$GITHUB_WORKSPACE/.p08-source"
