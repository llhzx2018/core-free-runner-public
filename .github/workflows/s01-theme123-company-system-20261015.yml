name: S01 company system exact release lifecycle verification
on:
  push:
    branches: [task/s01-theme123-company-system-20261015]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_REPO: 'llhzx2018/vf-tools-theme'
      TARGET_VERSION: '1.35.123'
      TARGET_SHA: '0fbb45dc334466f3b1da974cba63e30bbe002613'
      TARGET_TREE: 'b73526f4cabc0316019dc16ee94af87b6fc65c49'
      BASE_SHA: '6be589e7867fb5984f58b638575de199261bf97c'
      SOURCE_VERSION: '1.35.122'
      THEME_BASE_BYTES: '1815330'
      THEME_BASE_SHA256: '8c790f90412c51d4dd62683519cc672926e16a824eacdf2f63b6db288b005517'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Bound lane identity
        run: |
          set -Eeuo pipefail
          mkdir proof
          python3 runner/scripts/ephemeral_lane_spec.py render --spec runner/lanes/s01-theme123-company-system-20261015/spec.json --template runner/lanes/s01-theme123-company-system-20261015/candidate.template.yml --output /tmp/frontpages-rendered.yml
          cmp /tmp/frontpages-rendered.yml runner/.github/workflows/s01-theme123-company-system-20261015.yml
          python3 runner/scripts/ephemeral_lane_spec.py audit-rendered --spec runner/lanes/s01-theme123-company-system-20261015/spec.json --input runner/.github/workflows/s01-theme123-company-system-20261015.yml > proof/lane-identity.json
          cp -a runner/lanes/s01-theme123-company-system-20261015 lane
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Source scope and syntax
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          python3 - <<'PY'
          import subprocess,pathlib,os,json
          changed=subprocess.check_output(['git','-C','target','diff','--name-only',os.environ['BASE_SHA'],os.environ['TARGET_SHA']],text=True).splitlines()
          allowed=json.loads(pathlib.Path('lane/allowed-changes.json').read_text())
          assert sorted(changed)==sorted(allowed),(changed,allowed)
          for path in changed:
              if path.endswith('.php'):subprocess.run(['php','-l','target/'+path],check=True,stdout=subprocess.DEVNULL)
          assert pathlib.Path('target/VERSION').read_text().strip()==os.environ['TARGET_VERSION']
          for path in ['src/header.php','src/footer.php','src/inc/admin/admin-shell.php','src/inc/v6/component-workspace.php','src/inc/bootstrap/manifests/theme-action.php','src/inc/services/page-runtime-contract-service.php','src/inc/services/admin-preview-catalog-service.php']:
              before=subprocess.check_output(['git','-C','target','show',os.environ['BASE_SHA']+':'+path])
              assert before==pathlib.Path('target',path).read_bytes(),path
          pathlib.Path('proof/source.json').write_text(json.dumps({'status':'PASS','sha':os.environ['TARGET_SHA'],'tree':os.environ['TARGET_TREE'],'changed':changed,'version_bump':True,'frozen_shell_menu':'UNCHANGED'}))
          PY
          python3 - <<'PYFREEZE'
          import subprocess,pathlib,json
          paths=['src/assets/css/public/pages/families/public-family-06-company-legal-basic-operations-closure.css', 'src/assets/css/public/pages/families/public-family-05-system-search-recovery-closure.css']
          import os
          base=os.environ['BASE_SHA'];bundle=pathlib.Path('target/src/assets/css/public/vf-theme-public-runtime.css').read_text()
          for path in paths:
              new=pathlib.Path('target',path).read_text();old=subprocess.check_output(['git','-C','target','show',base+':'+path],text=True)
              assert bundle.count(new)==1;bundle=bundle.replace(new,old,1)
          assert bundle==subprocess.check_output(['git','-C','target','show',base+':src/assets/css/public/vf-theme-public-runtime.css'],text=True)
          pathlib.Path('proof/css-owner-equality.json').write_text(json.dumps({'status':'PASS','changed_css_owners':2,'all_other_owner_bytes':'IDENTICAL'}))
          PYFREEZE
          php target/tests/directory-request-state-contract.php > proof/directory-regression.json
          node --check target/src/assets/js/admin/admin-frontend-pages.js
          node --check target/src/assets/js/admin/admin-layout.js
          node --check lane/browser.cjs
          bash -n lane/native.sh
          python3 lane/theme-build.py
      - name: Authenticated rollback package identity
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          mkdir provider
          gh release download "v$SOURCE_VERSION" --repo "$TARGET_REPO" --pattern "vf-tools-theme_V$SOURCE_VERSION.zip" --dir provider
          python3 - <<'PYBASE'
          import pathlib,os,hashlib,zipfile
          p=pathlib.Path('provider')/('vf-tools-theme_V'+os.environ['SOURCE_VERSION']+'.zip');data=p.read_bytes()
          assert len(data)==int(os.environ['THEME_BASE_BYTES']) and hashlib.sha256(data).hexdigest()==os.environ['THEME_BASE_SHA256']
          with zipfile.ZipFile(p) as z:assert z.testzip() is None
          PYBASE
          gh release download v1.25.91 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.91.zip --dir provider
          echo 'fcb56d605550c5b04a3ff8b3b78b8bf86ca11b77e0aa22334fa67e675b01d6df  provider/vf-tools-m3u8_V1.25.91.zip' | sha256sum -c
      - name: Browser runtime
        run: |
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -g -fsSL --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC[wght].ttf' -o "$HOME/.local/share/fonts/NotoSansSC.ttf"
          fc-cache -f
      - name: Real WordPress queries permissions languages and desktop workflows
        run: bash lane/native.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: s01-theme123-company-system-proof-${{ github.run_id }}
          path: |
            proof/*.json
            proof/*.png
          if-no-files-found: error
          retention-days: 30
      - name: Clean transient private source
        if: always()
        run: rm -rf target provider proof/*.zip /tmp/wp-cli-frontpages.phar
