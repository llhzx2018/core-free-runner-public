name: P01 V2.46.3 Production Closure Final

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p01-v2463-production-closure-final-20260905.yml

permissions:
  contents: read

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      PRODUCT_BRANCH: docs/p01-v2463-production-closure-final-20260905
      EXPECTED_BASE: 9e86e5f380d6a00f930cd608a5a04a582e10799c
      HOME_SCREENSHOT_SHA: fd0a1b51379c93309f57c161aebf8bc966238fb5cdf8e1fc3c660534957f37d2
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.PRODUCT_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 1
          persist-credentials: true

      - name: Write final Production closure governance
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          test "$(cat VERSION)" = '2.46.3'
          test "$(cat src/VERSION.txt)" = '2.46.3'
          grep -Fq "define('VF_VERSION', '2.46.3');" src/app/bootstrap.php
          grep -Fq 'FINAL OWNER PAGE SMOKE PENDING' VF_PROJECT.json
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path('VF_PROJECT.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          d['status'] = 'V2.46.3 PRODUCTION / PUBLISHED / CLOSED'
          d['current_phase'] = 'ROUND 10 PRODUCTION CLOSURE PASS / L2 PRODUCT OPTIMIZATION'
          if isinstance(d.get('production_release'), dict):
              d['production_release']['release_state'] = 'PUBLISHED / OWNER INSTALLED OBSERVED / PRODUCTION CLOSURE PASS'
              pe = d['production_release'].setdefault('production_evidence', {})
              pe['owner_home_smoke'] = {
                  'authority':'OWNER UI SCREENSHOT',
                  'observed_date':'2026-09-05',
                  'result':'PASS',
                  'nine_primary_entries_visible':['首页','导航','频道','影视','专题','课程','项目','工具','软件'],
                  'footer_version':'V2.46.3',
                  'screenshot_sha256':os.environ['HOME_SCREENSHOT_SHA'],
                  'screenshot_size':'1319x1259',
                  'screenshot_bytes':177251
              }
              pe['owner_representative_page_smoke'] = {
                  'authority':'OWNER ATTESTATION',
                  'result':'PASS',
                  'pages':['课程','工具','软件','专题','项目'],
                  'statement':'5 个页面都能正常打开'
              }
          if isinstance(d.get('published_release'), dict):
              d['published_release']['release_state'] = 'PUBLISHED / REMOTE BYTE READBACK PASS / OWNER PRODUCTION CLOSURE PASS'
          if isinstance(d.get('current_change'), dict):
              d['current_change']['status'] = 'PRODUCTION CLOSURE PASS'
          d['candidate_state'] = 'PUBLISHED / OWNER PRODUCTION CLOSURE PASS'
          d['formal_release_state'] = 'V2.46.3 PUBLISHED / OWNER PRODUCTION CLOSURE PASS'
          d['develop_state'] = 'NOT CURRENT AUTHORITY / NEW L2 WORK STARTS FROM MAIN'
          d['current_authority'] = 'Owner Production V2.46.3 / Published v2.46.3@494b7a9a / Engineering main governance closure / Schema 2026090401 / Round 10 PRODUCTION CLOSURE PASS'
          d['next_action'] = 'Return to normal L2 Product Optimization from current main. Do not repeat V2.46.2 manifest repair or V2.46.3 release/production closure.'
          d['round10_production_closure'] = {
              'state':'PASS',
              'date':'2026-09-05',
              'production_version':'2.46.3',
              'schema':'2026090401',
              'migration':'NONE',
              'owner_update_terminal':'PASS',
              'owner_home_smoke':'PASS',
              'owner_representative_page_smoke':'PASS',
              'home_screenshot_sha256':os.environ['HOME_SCREENSHOT_SHA'],
              'representative_pages':['课程','工具','软件','专题','项目']
          }
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/evidence/P01_V2.46.3_OWNER_PRODUCTION_ACTIVATION_20260905.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('State: **OWNER PRODUCTION ACTIVATION PASS / FINAL OWNER PAGE SMOKE PENDING**', 'State: **PRODUCTION CLOSURE PASS**')
          old = '''The current window does **not** possess the Owner Production login session, so it cannot independently enumerate the live URL dataset or click through private workspace pages. Final Round 10 closure therefore still requires a minimal Owner-session page smoke: home renders, nine primary entries are visible, and representative Courses / Tools / Software / Topics / Projects pages open without runtime errors.'''
          new = '''Final Owner-session smoke is now complete:\n\n- Owner supplied the Production home screenshot. The top navigation visibly contains all nine primary entries: `首页 / 导航 / 频道 / 影视 / 专题 / 课程 / 项目 / 工具 / 软件`.\n- Footer/runtime marker on the same Production home screenshot is `VF Start · V2.46.3`.\n- Home screenshot SHA-256: `fd0a1b51379c93309f57c161aebf8bc966238fb5cdf8e1fc3c660534957f37d2`\n- Home screenshot dimensions: `1319x1259`\n- Home screenshot bytes: `177251`\n- Owner explicitly confirmed representative pages `课程 / 工具 / 软件 / 专题 / 项目` all open normally without errors.\n\nTherefore Round 10 Owner-session page smoke = **PASS**. This is Owner-observed/attested Production authority; the assistant still does not claim an independent authenticated Production crawl.'''
          if old not in s:
              raise SystemExit('expected pending smoke paragraph not found')
          s = s.replace(old, new)
          s = s.replace('Complete the minimal Owner-session page smoke. If it passes, update this evidence to `PRODUCTION CLOSURE PASS`, update `VF_PROJECT.json` phase/next action, and return P01 to normal L2 Product Optimization.', 'Round 10 is closed: `PRODUCTION CLOSURE PASS`. Return P01 to normal L2 Product Optimization from current `main`; do not repeat the V2.46.2 manifest-repair chain or V2.46.3 release/Production closure.')
          p.write_text(s, encoding='utf-8')
          PY
          python3 -m json.tool VF_PROJECT.json >/dev/null
          mapfile -t changed < <(git status --porcelain | sed -E 's/^.. //' | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = 'VF_PROJECT.json'
          test "${changed[1]}" = 'docs/evidence/P01_V2.46.3_OWNER_PRODUCTION_ACTIVATION_20260905.md'
          grep -Fq 'ROUND 10 PRODUCTION CLOSURE PASS / L2 PRODUCT OPTIMIZATION' VF_PROJECT.json
          grep -Fq '"state": "PASS"' VF_PROJECT.json
          grep -Fq 'PRODUCTION CLOSURE PASS' docs/evidence/P01_V2.46.3_OWNER_PRODUCTION_ACTIVATION_20260905.md
          grep -Fq '课程 / 工具 / 软件 / 专题 / 项目' docs/evidence/P01_V2.46.3_OWNER_PRODUCTION_ACTIVATION_20260905.md
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VF_PROJECT.json docs/evidence/P01_V2.46.3_OWNER_PRODUCTION_ACTIVATION_20260905.md
          git commit -m 'docs(P01): close V2.46.3 production'
          git push origin HEAD:${PRODUCT_BRANCH}

      - name: Closure PASS
        run: echo P01_V2463_PRODUCTION_CLOSURE=PASS
