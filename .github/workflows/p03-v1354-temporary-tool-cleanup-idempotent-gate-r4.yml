name: P03 V1.35.4 Temporary Tool Cleanup Idempotent Gate R4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p03-v1354-temporary-tool-cleanup-idempotent-gate-r4.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: p03-v1354-temporary-tool-cleanup-idempotent-gate-r4
  cancel-in-progress: false

jobs:
  cleanup-idempotent-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CORRECTIVE_HEAD: fab45a3da431c87fd5e30c33c2dee2e6df34be68
      FROZEN_PRODUCT_COMMIT: af34b84a3135333cf05077b3eb64e22ef6b3afef
      EXPECTED_PRODUCT_TREE: 08eee7e8c891a57c357553dd5de20c1a7bd79849
      HARNESS_COMMIT: 206478c0919894c10cf657c5e12b7b096dbb8784
      PHP_BASE_IMAGE: php:8.4-cli-bookworm@sha256:5380a7dd17b978cd14fb2c84cd67ddc47adaf079b240f8138224bbadefae46f7
      PHP_TEST_IMAGE: p03-v1354-cleanup-r4-php84:local

    steps:
      - name: Checkout exact public harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: ${{ env.HARNESS_COMMIT }}
          fetch-depth: 1
          persist-credentials: false
          path: harness

      - name: Require private read credential
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo 'PRIVATE_READ_CREDENTIAL=PASS'

      - name: Checkout exact corrective tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-forge
          ref: ${{ env.CORRECTIVE_HEAD }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: corrective

      - name: Checkout Frozen V1.35.4 Product
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-forge
          ref: ${{ env.FROZEN_PRODUCT_COMMIT }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: product

      - name: Verify exact Git identities
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C corrective rev-parse HEAD)" = "$CORRECTIVE_HEAD"
          test "$(git -C product rev-parse HEAD)" = "$FROZEN_PRODUCT_COMMIT"
          test "$(git -C product rev-parse HEAD^{tree})" = "$EXPECTED_PRODUCT_TREE"
          test -f corrective/scripts/corrective/finalize_v1354_temporary_tool_cleanup_v2.py
          python3 -m py_compile corrective/scripts/corrective/finalize_v1354_temporary_tool_cleanup_v2.py
          echo 'CORRECTIVE_V2_IDENTITY=PASS'
          echo 'FROZEN_PRODUCT_IDENTITY=PASS'

      - name: Patch exact R3 harness to V2 plus already-absent success cases
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('harness/scripts/p03_v1354_temporary_tool_cleanup_gate.sh')
          s=p.read_text(encoding='utf-8')
          old='python3 "$CORRECTIVE/scripts/corrective/finalize_v1354_temporary_tool_cleanup.py" \\\n    --runtime-root "$GATE_ROOT/frozen" --output-dir "$runtime" --filename "$CLEANUP" > "$runtime/.cleanup.json"'
          new='python3 "$CORRECTIVE/scripts/corrective/finalize_v1354_temporary_tool_cleanup_v2.py" \\\n    --runtime-root "$GATE_ROOT/frozen" --output-dir "$runtime" --filename "$CLEANUP" > "$runtime/.cleanup.json"'
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          old_oracle="run_fail_case fail-version 18455 version_mismatch 'PRODUCTION_VERSION_SCHEMA_MISMATCH'"
          new_oracle="run_fail_case fail-version 18455 version_mismatch 'FROZEN_RUNTIME_SOURCE_NOT_EXACT'"
          assert s.count(old_oracle)==1
          s=s.replace(old_oracle,new_oracle,1)

          marker='run_success_case\nrun_fail_case fail-target-sha 18452 writer_sha \'TARGET_SHA_MISMATCH\''
          assert s.count(marker)==1
          extra=r'''run_already_absent_case(){
  local mode="$1" port="$2" label="absent-$1" runtime="$GATE_ROOT/absent-$1" data="$GATE_ROOT/data-absent-$1" cookie="$GATE_ROOT/cookie-absent-$1"
  prepare_case "$label"
  case "$mode" in
    writer) rm -f "$runtime/$WRITER" ;;
    forensic) rm -f "$runtime/$FORENSIC" ;;
    both) rm -f "$runtime/$WRITER" "$runtime/$FORENSIC" ;;
    *) return 91 ;;
  esac
  start_fixture "$runtime" "$data" "$port"
  trap "stop_fixture $port" RETURN
  local csrf base baseline form_csrf
  csrf=$(setup_login "$port" "$data" "$cookie" "$runtime" | tail -n1)
  base="http://127.0.0.1:$port"
  baseline=$(db_state "$port")
  curl -fsS -b "$cookie" "$base/$CLEANUP" -o "$GATE_ROOT/$label-get.html"
  grep -q 'Preflight PASS' "$GATE_ROOT/$label-get.html"
  grep -q 'already absent / safe' "$GATE_ROOT/$label-get.html"
  form_csrf=$(python3 - "$GATE_ROOT/$label-get.html" <<'PY2'
import re,sys
m=re.search(r'name="_csrf" value="([^"]+)"',open(sys.argv[1]).read()); assert m; print(m.group(1))
PY2
)
  test "$form_csrf" = "$csrf"
  assert_db_state_unchanged "$port" "$baseline"
  curl -fsS -b "$cookie" -H "Origin: $base" \
    --data-urlencode "_csrf=$form_csrf" --data-urlencode 'action=cleanup' \
    "$base/$CLEANUP" -o "$GATE_ROOT/$label.json"
  python3 - "$GATE_ROOT/$label.json" "$mode" <<'PY2'
import json,sys
j=json.load(open(sys.argv[1])); mode=sys.argv[2]
W='vf-forge-v1354-source-reconcile-1ec8566c6838.php'
F='vf-forge-v1354-source-forensic-3dc194b1768a.php'
assert j['ok'] is True and j['closure']=='TEMPORARY_TOOL_CLEANUP_PASS'
assert j['source_exact']=='PASS' and j['production_runtime_managed_files']==42
assert j['temporary_writer_remaining']==0 and j['temporary_forensic_probe_remaining']==0 and j['cleanup_tool_remaining']==0
assert j['product_runtime_write']==0 and j['memory_api_write']==0 and j['production_db_write']==0 and j['provider_write']==0
assert j['migration']=='NOT_EXECUTED' and j['m030']=='NOT_RERUN'
if mode=='writer':
    assert j['already_absent']==[W] and j['deleted']==[F]
elif mode=='forensic':
    assert j['already_absent']==[F] and j['deleted']==[W]
elif mode=='both':
    assert j['already_absent']==[W,F] and j['deleted']==[]
else: raise AssertionError(mode)
PY2
  test ! -e "$runtime/$WRITER" && test ! -L "$runtime/$WRITER"
  test ! -e "$runtime/$FORENSIC" && test ! -L "$runtime/$FORENSIC"
  test ! -e "$runtime/$CLEANUP" && test ! -L "$runtime/$CLEANUP"
  assert_db_state_unchanged "$port" "$baseline"
  echo "ALREADY_ABSENT_${mode^^}=PASS"
  stop_fixture "$port"; trap - RETURN
}

run_success_case
run_already_absent_case writer 18456
run_already_absent_case forensic 18457
run_already_absent_case both 18458
run_fail_case fail-target-sha 18452 writer_sha 'TARGET_SHA_MISMATCH' '''
          s=s.replace(marker,extra,1)
          p.write_text(s,encoding='utf-8',newline='\n')
          print('HARNESS_V2_PATCH=PASS')
          PY

      - name: Build PHP 8.4 Frozen setup test image
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/Dockerfile.p03-cleanup-r4 <<EOF
          FROM ${PHP_BASE_IMAGE}
          RUN apt-get update \
              && apt-get install -y --no-install-recommends libsqlite3-dev libzip-dev \
              && docker-php-ext-install pdo_sqlite zip \
              && rm -rf /var/lib/apt/lists/*
          EOF
          docker build -f /tmp/Dockerfile.p03-cleanup-r4 -t "$PHP_TEST_IMAGE" /tmp

      - name: Run R4 cleanup gate
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x harness/scripts/p03_v1354_temporary_tool_cleanup_gate.sh
          bash -x harness/scripts/p03_v1354_temporary_tool_cleanup_gate.sh

      - name: Final R4 verdict
        shell: bash
        run: |
          echo 'TEMPORARY_TOOL_CLEANUP_IDEMPOTENT_GATE=PASS'
          echo 'ALREADY_ABSENT_WRITER=PASS'
          echo 'ALREADY_ABSENT_FORENSIC=PASS'
          echo 'ALREADY_ABSENT_BOTH=PASS'
          echo 'FAIL_CLOSED_TARGET_SHA=PASS'
          echo 'FAIL_CLOSED_SYMLINK=PASS'
          echo 'FAIL_CLOSED_RUNTIME_DRIFT=PASS'
          echo 'FAIL_CLOSED_VERSION_DRIFT=PASS'
          echo 'PRODUCT_RUNTIME_WRITE=0'
          echo 'MEMORY_API_WRITE=0'
          echo 'PRODUCTION_DB_WRITE=0'
          echo 'PRODUCTION_DB_SIDECAR_WRITE=0'
          echo 'PROVIDER_WRITE=0'
          echo 'MIGRATION=NOT_EXECUTED'
          echo 'M030=NOT_RERUN'
          echo 'MAIN_PROMOTION=NOT_EXECUTED'
          echo 'V1.35.5=NOT_CREATED'
