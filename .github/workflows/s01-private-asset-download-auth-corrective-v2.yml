name: S01 Private Asset Auth Corrective V2

on:
  push:
    branches: [task/s01-private-asset-download-auth-corrective]
    paths: ['.github/workflows/s01-private-asset-download-auth-corrective-v2.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s01-private-asset-auth-corrective-v2
  cancel-in-progress: false

jobs:
  verify:
    name: ${{ matrix.component }} native bulk private asset corrective
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: OPS
            repository: llhzx2018/vf-tools-ops
            candidate_ref: task/v121791-private-asset-downloader-auth
            candidate_commit: 01f111cff3c7a423343e9ba3374dd8702bfdfe06
            candidate_version: 1.21.791
            base_commit: 91bf324193095846a0ff546a9dca716daf44b4de
            production_ref: v1.21.789
            production_version: 1.21.789
            target_version: 1.21.790
            plugin_dir: vf-ops
            plugin_file: vf-ops/vf-ops.php
            source_root: .
            bootstrap_rel: includes/wp-update/bootstrap.php
            bridge_rel: includes/wp-update/class-vf-ops-private-asset-download-bridge-v1.php
            source_class: VF_Ops_Update_Source_V1
            credential_class: VF_WP_Update_Credential_V1
            bridge_class: VF_Ops_Private_Asset_Download_Bridge_V1
            authority_class: VF_Ops_Runtime_Authority_V1
            asset_id: '516546259'
            asset_name: vf-tools-ops_V1.21.790.zip
            asset_bytes: '3175301'
            asset_sha256: 327cbf86b1bf568eeb59a9dc3ce9c5837906fae3bf79869e5ec346c251feea62
            candidate_asset: vf-tools-ops_V1.21.791.zip
          - component: M3U8
            repository: llhzx2018/vf-tools-m3u8
            candidate_ref: task/v1253-private-asset-downloader-auth
            candidate_commit: 4db0265c346dbabe91f206af33a16dba77bb2939
            candidate_version: 1.25.3
            base_commit: d13fa95047dee2eaa16a7e64bab74c7d06420de9
            production_ref: v1.25.1
            production_version: 1.25.1
            target_version: 1.25.2
            plugin_dir: vf-tool-m3u8
            plugin_file: vf-tool-m3u8/vf-tool-m3u8.php
            source_root: src
            bootstrap_rel: includes/update/bootstrap.php
            bridge_rel: includes/update/class-vf-m3u8-private-asset-download-bridge-v1.php
            source_class: VF_M3U8_Update_Source_V1
            credential_class: VF_M3U8_Update_Credential_V1
            bridge_class: VF_M3U8_Private_Asset_Download_Bridge_V1
            authority_class: VF_M3U8_Runtime_Authority_V1
            asset_id: '516569640'
            asset_name: vf-tools-m3u8_V1.25.2.zip
            asset_bytes: '3520025'
            asset_sha256: 857eb4706f06a79b2eee0260fe144da7d8b6d43d2ab40fe310fcace3f72106bf
            candidate_asset: vf-tools-m3u8_V1.25.3.zip

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: vf_corrective
          MARIADB_USER: vf
          MARIADB_PASSWORD: vf
        ports: ['3306:3306']
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      COMPONENT: ${{ matrix.component }}
      REPOSITORY: ${{ matrix.repository }}
      CANDIDATE_COMMIT: ${{ matrix.candidate_commit }}
      CANDIDATE_VERSION: ${{ matrix.candidate_version }}
      BASE_COMMIT: ${{ matrix.base_commit }}
      PRODUCTION_VERSION: ${{ matrix.production_version }}
      TARGET_VERSION: ${{ matrix.target_version }}
      PLUGIN_DIR: ${{ matrix.plugin_dir }}
      PLUGIN_FILE: ${{ matrix.plugin_file }}
      SOURCE_ROOT: ${{ matrix.source_root }}
      BOOTSTRAP_REL: ${{ matrix.bootstrap_rel }}
      BRIDGE_REL: ${{ matrix.bridge_rel }}
      SOURCE_CLASS: ${{ matrix.source_class }}
      CREDENTIAL_CLASS: ${{ matrix.credential_class }}
      BRIDGE_CLASS: ${{ matrix.bridge_class }}
      AUTHORITY_CLASS: ${{ matrix.authority_class }}
      ASSET_ID: ${{ matrix.asset_id }}
      ASSET_NAME: ${{ matrix.asset_name }}
      ASSET_BYTES: ${{ matrix.asset_bytes }}
      ASSET_SHA256: ${{ matrix.asset_sha256 }}
      CANDIDATE_ASSET: ${{ matrix.candidate_asset }}
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}

    steps:
      - name: Credential gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VF_PRIVATE_READ_TOKEN"
          echo 'UNIFIED_READ_CREDENTIAL_PRESENT=PASS'

      - name: Checkout harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Checkout corrective candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.candidate_ref }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout immutable Production baseline
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.production_ref }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: production
          fetch-depth: 1
          persist-credentials: false

      - name: Candidate identity and bounded source delta
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          test "$(tr -d '\r\n' < candidate/VERSION)" = "$CANDIDATE_VERSION"
          if [ "$COMPONENT" = OPS ]; then
            expected=$'VERSION\nincludes/wp-update/bootstrap.php\nincludes/wp-update/class-vf-ops-private-asset-download-bridge-v1.php\nvf-ops.php'
          else
            expected=$'VERSION\nsrc/includes/update/bootstrap.php\nsrc/includes/update/class-vf-m3u8-private-asset-download-bridge-v1.php\nsrc/vf-tool-m3u8.php'
          fi
          actual="$(git -C candidate diff --name-only "$BASE_COMMIT"..HEAD | sort)"
          test "$actual" = "$expected"
          php -l "candidate/$SOURCE_ROOT/$BOOTSTRAP_REL" >/dev/null
          php -l "candidate/$SOURCE_ROOT/$BRIDGE_REL" >/dev/null
          echo 'CANDIDATE_SOURCE_IDENTITY=PASS'
          echo 'BOUNDED_DELTA=PASS'
          echo 'SCHEMA_CHANGE=NO'
          echo 'LOCATOR_CUTOVER=NO'

      - name: PHP and WP-CLI
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: mysqli, curl, zip, sodium, mbstring, xml, gd, fileinfo
          coverage: none

      - name: Install tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client jq unzip curl rsync >/dev/null
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp
          chmod +x /tmp/wp && sudo mv /tmp/wp /usr/local/bin/wp
          for i in $(seq 1 30); do mariadb -h127.0.0.1 -uvf -pvf -e 'SELECT 1' vf_corrective >/dev/null 2>&1 && break; sleep 1; done
          wp --info

      - name: Build real Production baseline with only corrective bridge overlay
        shell: bash
        run: |
          set -Eeuo pipefail
          WP_ROOT="$RUNNER_TEMP/wp-$COMPONENT"
          echo "WP_ROOT=$WP_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$WP_ROOT"
          wp core download --path="$WP_ROOT" --version=7.0.2 --force >/dev/null
          wp config create --path="$WP_ROOT" --dbname=vf_corrective --dbuser=vf --dbpass=vf --dbhost=127.0.0.1:3306 --skip-check >/dev/null
          wp core install --path="$WP_ROOT" --url=http://127.0.0.1:18095 --title="VF Corrective" --admin_user=admin --admin_password='Fixture-Only-Admin!' --admin_email=fixture@example.invalid --skip-email >/dev/null
          DEST="$WP_ROOT/wp-content/plugins/$PLUGIN_DIR"
          mkdir -p "$DEST"
          if [ "$SOURCE_ROOT" = '.' ]; then
            rsync -a --exclude=.git production/ "$DEST/"
            cp "candidate/$BOOTSTRAP_REL" "$DEST/$BOOTSTRAP_REL"
            cp "candidate/$BRIDGE_REL" "$DEST/$BRIDGE_REL"
          else
            rsync -a production/$SOURCE_ROOT/ "$DEST/"
            cp "candidate/$SOURCE_ROOT/$BOOTSTRAP_REL" "$DEST/$BOOTSTRAP_REL"
            cp "candidate/$SOURCE_ROOT/$BRIDGE_REL" "$DEST/$BRIDGE_REL"
          fi
          mkdir -p "$WP_ROOT/wp-content/mu-plugins"
          cat > "$WP_ROOT/wp-content/mu-plugins/vf-auth-observer.php" <<'PHP'
          <?php
          if (!defined('ABSPATH')) { exit; }
          add_filter('http_request_args', function($args,$url){
              $file=getenv('VF_HTTP_EVIDENCE_PATH'); if(!$file) return $args;
              $p=wp_parse_url((string)$url); $host=strtolower((string)($p['host']??''));
              if(!in_array($host,['api.github.com','objects.githubusercontent.com','github-releases.githubusercontent.com','release-assets.githubusercontent.com'],true)) return $args;
              $auth=false; foreach((array)($args['headers']??[]) as $k=>$v){if(strtolower((string)$k)==='authorization'&&trim((string)$v)!==''){$auth=true;break;}}
              file_put_contents($file,wp_json_encode(['host'=>$host,'path'=>(string)($p['path']??''),'authorization'=>$auth],JSON_UNESCAPED_SLASHES)."\n",FILE_APPEND|LOCK_EX);
              return $args;
          },PHP_INT_MAX,2);
          add_filter('upgrader_pre_download',function($reply,$package,$upgrader,$extra){
              $file=getenv('VF_HOOK_EVIDENCE_PATH'); $plugin=getenv('PLUGIN_FILE'); if(!$file||!is_array($extra)) return $reply;
              $match=((string)($extra['plugin']??'')===$plugin)||(is_array($extra['plugins']??null)&&in_array($plugin,$extra['plugins'],true));
              if($match&&str_contains((string)$package,'/releases/assets/')) file_put_contents($file,wp_json_encode(['keys'=>array_values(array_keys($extra)),'has_type'=>array_key_exists('type',$extra),'plugin_match'=>true])."\n",FILE_APPEND|LOCK_EX);
              return $reply;
          },1,4);
          PHP
          export VF_HTTP_EVIDENCE_PATH="$RUNNER_TEMP/$COMPONENT-http.jsonl"
          export VF_HOOK_EVIDENCE_PATH="$RUNNER_TEMP/$COMPONENT-hook.jsonl"
          : > "$VF_HTTP_EVIDENCE_PATH"; : > "$VF_HOOK_EVIDENCE_PATH"
          echo "VF_HTTP_EVIDENCE_PATH=$VF_HTTP_EVIDENCE_PATH" >> "$GITHUB_ENV"
          echo "VF_HOOK_EVIDENCE_PATH=$VF_HOOK_EVIDENCE_PATH" >> "$GITHUB_ENV"
          wp plugin activate "$PLUGIN_DIR" --path="$WP_ROOT" >/dev/null
          wp eval --path="$WP_ROOT" '
            $a=getenv("AUTHORITY_CLASS"); $r=$a::establish(getenv("PRODUCTION_VERSION"),WP_PLUGIN_DIR."/".getenv("PLUGIN_DIR")); if(is_wp_error($r)) exit(2);
            update_option("vf_corrective_fixture_state","KEEP",false);
            if(!wp_next_scheduled("vf_corrective_fixture_cron")) wp_schedule_single_event(time()+3600,"vf_corrective_fixture_cron");
            $role=get_role("administrator"); if($role) $role->add_cap("vf_corrective_fixture_cap",true);
            echo "PRODUCTION_OVERLAY_READY=PASS\n";
          '

      - name: Exact missing token and secret-leak negative gates
        shell: bash
        run: |
          set -Eeuo pipefail
          wp option delete vf_private_update_credential_v1 --path="$WP_ROOT" >/dev/null 2>&1 || true
          env -u VF_PRIVATE_READ_TOKEN wp eval --path="$WP_ROOT" '
            $c=getenv("CREDENTIAL_CLASS"); if($c::has_secret()) exit(11);
            $s=getenv("SOURCE_CLASS"); $src=new $s(getenv("PRODUCTION_VERSION")); $r=$src->manifest(true);
            if(!is_wp_error($r)||!str_contains($r->get_error_code(),"private_update_token_missing")) exit(12);
            echo "MISSING_TOKEN_FAIL_CLOSED=PASS\n";
          '
          wp option update vf_private_update_credential_v1 FIXTURE_SENTINEL_NOT_RUNTIME_CREDENTIAL --path="$WP_ROOT" --autoload=no >/dev/null

          RELEASE='$rel=["asset_name"=>getenv("ASSET_NAME"),"asset_bytes"=>(int)getenv("ASSET_BYTES"),"asset_sha256"=>getenv("ASSET_SHA256"),"asset_api_url"=>"https://api.github.com/repos/".getenv("REPOSITORY")."/releases/assets/".getenv("ASSET_ID")];'
          VF_PRIVATE_READ_TOKEN='VF_INVALID_NEGATIVE_TOKEN_000000000000000000' wp eval --path="$WP_ROOT" "$RELEASE
            \$s=getenv('SOURCE_CLASS'); \$src=new \$s(getenv('PRODUCTION_VERSION')); \$r=\$src->download(\$rel);
            if(!is_wp_error(\$r)){if(is_string(\$r))@unlink(\$r);exit(13);} echo 'WRONG_TOKEN_FAIL_CLOSED=PASS';"
          wp eval --path="$WP_ROOT" '
            $b=getenv("BRIDGE_CLASS"); $before=is_file(getenv("VF_HTTP_EVIDENCE_PATH"))?count(file(getenv("VF_HTTP_EVIDENCE_PATH"))):0;
            $r=$b::pre_download(false,"https://example.com/repos/x/releases/assets/1",null,["plugin"=>getenv("PLUGIN_FILE")]);
            $after=is_file(getenv("VF_HTTP_EVIDENCE_PATH"))?count(file(getenv("VF_HTTP_EVIDENCE_PATH"))):0;
            if(!is_wp_error($r)||$before!==$after) exit(14); echo "UNEXPECTED_HOST_NO_AUTH_REQUEST=PASS\n";
          '
          wp eval --path="$WP_ROOT" "$RELEASE
            \$asset=\$rel['asset_api_url']; \$redirect='https://release-assets.githubusercontent.com/vf-fixture'; \$seen=null;
            add_filter('pre_http_request',function(\$pre,\$args,\$url)use(\$asset,\$redirect,&\$seen){
              \$auth=false;foreach((array)(\$args['headers']??[])as \$k=>\$v){if(strtolower((string)\$k)==='authorization'&&trim((string)\$v)!=='')\$auth=true;}
              if((string)\$url===\$asset){if(!\$auth)return new WP_Error('fixture_missing_auth','x');return ['headers'=>['location'=>\$redirect],'body'=>'','response'=>['code'=>302,'message'=>'Found'],'cookies'=>[],'filename'=>null];}
              if((string)\$url===\$redirect){\$seen=\$auth;return new WP_Error('fixture_redirect_stop','x');}return \$pre;
            },1,3);
            \$s=getenv('SOURCE_CLASS');\$src=new \$s(getenv('PRODUCTION_VERSION'));\$r=\$src->download(\$rel);
            if(!is_wp_error(\$r)||\$r->get_error_code()!=='fixture_redirect_stop'||\$seen!==false)exit(15);echo 'REDIRECT_NO_SECRET_LEAK=PASS';"
          wp eval --path="$WP_ROOT" "$RELEASE
            \$rel['asset_bytes']++;\$s=getenv('SOURCE_CLASS');\$src=new \$s(getenv('PRODUCTION_VERSION'));\$r=\$src->download(\$rel);
            if(!is_wp_error(\$r)||!str_contains(\$r->get_error_code(),'bytes_mismatch'))exit(16);echo 'BYTES_MISMATCH_FAIL_CLOSED=PASS';"
          wp eval --path="$WP_ROOT" "$RELEASE
            \$rel['asset_sha256']=str_repeat('0',64);\$s=getenv('SOURCE_CLASS');\$src=new \$s(getenv('PRODUCTION_VERSION'));\$r=\$src->download(\$rel);
            if(!is_wp_error(\$r)||!str_contains(\$r->get_error_code(),'sha256_mismatch'))exit(17);echo 'SHA_MISMATCH_FAIL_CLOSED=PASS';"

      - name: Real update_plugins discovery then native Plugin_Upgrader bulk downloader
        shell: bash
        run: |
          set -Eeuo pipefail
          : > "$VF_HTTP_EVIDENCE_PATH"; : > "$VF_HOOK_EVIDENCE_PATH"
          wp eval --path="$WP_ROOT" '
            $s=getenv("SOURCE_CLASS");if(method_exists($s,"clear_cache"))$s::clear_cache();delete_site_transient("update_plugins");delete_transient("update_plugins");wp_update_plugins();
            $t=get_site_transient("update_plugins");$p=getenv("PLUGIN_FILE");$u=is_object($t)?($t->response[$p]??null):null;
            $expected="https://api.github.com/repos/".getenv("REPOSITORY")."/releases/assets/".getenv("ASSET_ID");
            if(!is_object($u)||(string)($u->new_version??"")!==getenv("TARGET_VERSION")||(string)($u->package??"")!==$expected)exit(21);
            echo "REAL_UPDATE_DISCOVERY=PASS\n";
          '
          wp eval --path="$WP_ROOT" '
            require_once ABSPATH."wp-admin/includes/class-wp-upgrader.php";require_once ABSPATH."wp-admin/includes/plugin.php";
            $p=getenv("PLUGIN_FILE");$up=new Plugin_Upgrader(new Automatic_Upgrader_Skin());$all=$up->bulk_upgrade([$p]);
            if($all===false||!is_array($all)||!array_key_exists($p,$all))exit(22);$r=$all[$p];if(is_wp_error($r)){fwrite(STDERR,$r->get_error_code()."\n");exit(23);}if(!is_array($r)&&$r!==true)exit(24);
            echo "REAL_BULK_PLUGIN_UPGRADER=PASS\n";
          '

      - name: Verify auth handoff, hook shape, install and preserved state
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$VF_HTTP_EVIDENCE_PATH" "$VF_HOOK_EVIDENCE_PATH" "$REPOSITORY" "$ASSET_ID" <<'PY'
          import json,sys
          h=[json.loads(x) for x in open(sys.argv[1],encoding='utf-8') if x.strip()]
          k=[json.loads(x) for x in open(sys.argv[2],encoding='utf-8') if x.strip()]
          path=f'/repos/{sys.argv[3]}/releases/assets/{sys.argv[4]}'
          first=[x for x in h if x.get('host')=='api.github.com' and x.get('path')==path]
          assert first and any(x.get('authorization') is True for x in first),first
          red=[x for x in h if x.get('host') in {'objects.githubusercontent.com','github-releases.githubusercontent.com','release-assets.githubusercontent.com'}]
          assert all(x.get('authorization') is False for x in red),red
          assert k and any(x.get('plugin_match') and x.get('has_type') is False for x in k),k
          print('ASSET_API_AUTHORIZATION=PASS')
          print('BULK_HOOK_EXTRA_WITHOUT_TYPE=CONFIRMED')
          print('REDIRECT_SECRET_LEAK=NONE')
          PY
          wp eval --path="$WP_ROOT" '
            require_once ABSPATH."wp-admin/includes/plugin.php";$p=getenv("PLUGIN_FILE");$d=get_plugin_data(WP_PLUGIN_DIR."/".$p,false,false);
            if((string)($d["Version"]??"")!==getenv("TARGET_VERSION")||!is_plugin_active($p))exit(31);
            if((string)get_option("vf_corrective_fixture_state","")!=="KEEP")exit(32);
            if((string)get_option("vf_private_update_credential_v1","")!=="FIXTURE_SENTINEL_NOT_RUNTIME_CREDENTIAL")exit(33);
            if(!wp_next_scheduled("vf_corrective_fixture_cron"))exit(34);$r=get_role("administrator");if(!$r||!$r->has_cap("vf_corrective_fixture_cap"))exit(35);
            echo "TARGET_INSTALLED=PASS\nPLUGIN_ACTIVE=PASS\nOPTION_PRESERVED=PASS\nSECRET_STORAGE_PRESERVED=PASS\nCRON_PRESERVED=PASS\nCAPABILITY_PRESERVED=PASS\n";
          '
          if [ "$COMPONENT" = OPS ]; then
            wp eval --path="$WP_ROOT" 'do_action("admin_init");if(count(vf_tools_ops_v6_table_suffixes())!==48)exit(36);echo "TABLES_48_PRESERVED=PASS\n";'
          else
            wp eval --path="$WP_ROOT" 'if(function_exists("vf_tools_m3u8_v6_table_suffixes")&&count(vf_tools_m3u8_v6_table_suffixes())!==14)exit(37);echo "M3U8_RUNTIME_STATE_PRESERVED=PASS\n";'
          fi

      - name: Build exact corrective candidate artifact and fresh install
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$COMPONENT" "$CANDIDATE_ASSET" <<'PY'
          import hashlib,json,re,sys,zipfile,os
          from pathlib import Path
          comp,asset=sys.argv[1:];root=Path('candidate' if comp=='OPS' else 'candidate/src');slug='vf-ops' if comp=='OPS' else 'vf-tool-m3u8'
          def ok(rel):
            p=rel.as_posix();parts=p.split('/');low=[x.lower() for x in parts]
            if any(x in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in low):return False
            if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',p,re.I):return False
            if comp=='OPS': return (len(parts)==1 and p in {'vf-ops.php','uninstall.php'}) or parts[0] in {'includes','assets','languages','config'}
            return (len(parts)==1 and p in {'vf-tool-m3u8.php','uninstall.php','plugin-manifest.json','tool-settings.schema.json'}) or parts[0] in {'admin','config','includes','public','templates','tools'}
          files={f.relative_to(root).as_posix():f.read_bytes() for f in root.rglob('*') if f.is_file() and not f.is_symlink() and ok(f.relative_to(root))};files=dict(sorted(files.items()))
          out=Path('/tmp')/asset
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
            for rel,b in files.items():
              zi=zipfile.ZipInfo(slug+'/'+rel,(2026,8,16,0,0,0));zi.compress_type=zipfile.ZIP_DEFLATED;zi.external_attr=0o100644<<16;z.writestr(zi,b)
          h=hashlib.sha256()
          for rel,b in files.items():h.update(rel.encode());h.update(b'\0');h.update(hashlib.sha256(b).hexdigest().encode());h.update(b'\n')
          meta={'component':comp,'candidate_commit':os.environ['CANDIDATE_COMMIT'],'corrective_version':os.environ['CANDIDATE_VERSION'],'artifact':asset,'bytes':out.stat().st_size,'sha256':hashlib.sha256(out.read_bytes()).hexdigest(),'runtime_files':len(files),'runtime_fingerprint':h.hexdigest()}
          Path('/tmp/'+comp+'-meta.json').write_text(json.dumps(meta,indent=2)+'\n');print(json.dumps(meta))
          PY
          unzip -tq "/tmp/$CANDIDATE_ASSET" >/dev/null
          DB="vf_fresh_${COMPONENT,,}";mariadb -h127.0.0.1 -uroot -proot -e "CREATE DATABASE \`$DB\`;GRANT ALL ON \`$DB\`.* TO 'vf'@'%';FLUSH PRIVILEGES;"
          FRESH="$RUNNER_TEMP/fresh-$COMPONENT";mkdir -p "$FRESH";wp core download --path="$FRESH" --version=7.0.2 --force >/dev/null
          wp config create --path="$FRESH" --dbname="$DB" --dbuser=vf --dbpass=vf --dbhost=127.0.0.1:3306 --skip-check >/dev/null
          wp core install --path="$FRESH" --url=http://127.0.0.1:18096 --title=Fresh --admin_user=admin --admin_password='Fresh-Fixture!' --admin_email=fixture@example.invalid --skip-email >/dev/null
          wp plugin install "/tmp/$CANDIDATE_ASSET" --path="$FRESH" --activate >/dev/null
          wp eval --path="$FRESH" 'require_once ABSPATH."wp-admin/includes/plugin.php";$p=getenv("PLUGIN_FILE");$d=get_plugin_data(WP_PLUGIN_DIR."/".$p,false,false);if((string)($d["Version"]??"")!==getenv("CANDIDATE_VERSION")||!is_plugin_active($p))exit(41);echo "CORRECTIVE_FRESH_INSTALL=PASS\n";'

      - name: Seal redacted evidence and remove private source/package
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "evidence/$COMPONENT"
          python3 - "/tmp/$COMPONENT-meta.json" "evidence/$COMPONENT/result.json" <<'PY'
          import json,sys,datetime
          m=json.load(open(sys.argv[1]));m.update({'result':'PASS','real_wordpress_downloader_fixture':'PASS','secret_leak_negative_tests':'PASS','missing_token':'FAIL_CLOSED','wrong_token':'FAIL_CLOSED','unexpected_host':'NO_AUTH_REQUEST','redirect':'NO_SECRET_LEAK','bytes_mismatch':'FAIL_CLOSED','sha_mismatch':'FAIL_CLOSED','state_preservation':'PASS','production_write':0,'existing_release_modified':False,'evidence_privacy':'REDACTED_NO_SECRET_NO_SOURCE_NO_ZIP','observed_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()});json.dump(m,open(sys.argv[2],'w'),indent=2)
          PY
          cat "evidence/$COMPONENT/result.json"
          rm -f "/tmp/$CANDIDATE_ASSET" "/tmp/$COMPONENT-meta.json"
          rm -rf candidate production "$WP_ROOT" "$RUNNER_TEMP/fresh-$COMPONENT"
          if find evidence -type f \( -name '*.php' -o -name '*.zip' -o -name '*.sql' -o -name '*.db' -o -name '*.key' -o -name '*.pem' \) -print -quit | grep -q .;then exit 51;fi
          if grep -RIlE 'Bearer[[:space:]]+[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}' evidence 2>/dev/null|grep -q .;then exit 52;fi
          echo 'PUBLIC_EVIDENCE_PRIVACY=PASS'

      - name: Upload redacted evidence only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-${{ matrix.component }}-private-asset-auth-corrective-v2-${{ github.run_id }}
          path: evidence/${{ matrix.component }}/
          if-no-files-found: error
          retention-days: 30
