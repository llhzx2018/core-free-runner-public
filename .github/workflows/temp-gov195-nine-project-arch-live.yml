name: "TEMP GOV195 nine-project real architecture exact-source audit"
on:
  pull_request:
    paths:
      - '.github/workflows/temp-gov195-nine-project-arch-live.yml'
permissions:
  contents: read
jobs:
  source-proof:
    name: "read-only architecture ${{ matrix.project }}"
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - project: P01
            repo: llhzx2018/vf-start
            head: c377dc3e0696585b207561081f6dc462108c904f
            base: defaf3db8bd94adc9909e1783ec2134e03b44410
          - project: P02
            repo: llhzx2018/vf-library
            head: a5ca0f94e46542adb9ffce5413a6007c913f8810
            base: f5dd7782e6fcae14a6ca04b8a263e1bee09f74e7
          - project: P04
            repo: llhzx2018/vf-infra
            head: 40c4c6d0aca18f3a19e2f7f5cac2c3403664c81a
            base: c71bed4a0fc29731841e27f05bc56c9e10f18a48
          - project: P05
            repo: llhzx2018/vf-seo
            head: f06947be58f7d0ce9d642210e8c56c7ddb431aed
            base: dc161c254f7b4040a37a7a749720e5133802db43
          - project: P07
            repo: llhzx2018/vf-server-ops
            head: a6da82f35fdbd06020a7e65c8cbd5717f617f2f3
            base: 905599e8ca6ac6fd766856c35301328388b3eb81
          - project: P08
            repo: llhzx2018/vf-adops
            head: 38979874dea85ec14ee91c2357dca117655c48c0
            base: f342be52b786b0cfd222f3650818e650f61a010d
          - project: S01-C01
            repo: llhzx2018/vf-tools-theme
            head: f681cc076abde944ea08c48a5b7397ae8fd25de7
            base: 4489a5f0cc5a29299be6b574ccaee8a3147f296b
          - project: S01-C02
            repo: llhzx2018/vf-tools-ops
            head: 1a1339f3122f0a9b24499b428ddbdbe68dda4524
            base: 853d0d7189e4a30afaffe5c6f82bd42cefa4d804
          - project: S01-C03
            repo: llhzx2018/vf-tools-m3u8
            head: e73abecdac2cc6a3aa54351f6176952fdae48f6f
            base: e3d643991ea260a79ec632f0ec04466477184f56
    steps:
      - name: Checkout exact current shared governance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 70aef9ac061671546d408740b35b999e0ee7b866
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: gov
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout read-only exact software main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.head }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 2
      - name: Verify exact source and run existing product source architecture gate
        shell: bash
        env:
          GITHUB_EVENT_PATH: ''
        run: |
          set -Eeuo pipefail
          test "$(git -C gov rev-parse HEAD)" = "70aef9ac061671546d408740b35b999e0ee7b866"
          test "$(git -C source rev-parse HEAD)" = "${{ matrix.head }}"
          test "$(git -C source rev-parse HEAD^)" = "${{ matrix.base }}"
          test -f source/.github/checks/architecture_gate.py
          test -f source/.github/checks/code_architecture.json
          set +e
          result=$(python3 -B source/.github/checks/architecture_gate.py \
              --manifest source/.github/checks/code_architecture.json \
              --gov-root gov --git-root source \
              --base-sha "${{ matrix.base }}" --head-sha "${{ matrix.head }}" 2>&1)
          rc=$?
          set -e
          echo "AUDIT_PROJECT=${{ matrix.project }}"
          echo "AUDIT_PRODUCT_SHA=${{ matrix.head }}"
          echo "AUDIT_GOV_SHA=70aef9ac061671546d408740b35b999e0ee7b866"
          if [ "$rc" -ne 0 ]; then
            code=$(printf '%s\n' "$result" | sed -n 's/^PROJECT_ARCHITECTURE=BLOCKED:\([A-Za-z0-9_]*\).*/\1/p' | tail -1)
            echo "AUDIT_SOURCE_CHECK=BLOCKED:${code:-CHECK_EXECUTION}"
            exit 1
          fi
          printf '%s\n' "$result" | grep -E '^(PORTABILITY_STATIC_GIT_DIFF|QUALITY_STAGE_ROUTING|PROJECT_ARCHITECTURE)=' | sed -E 's/(changed_production_files|changed_code_paths|changed_paths)": [0-9]+/\1": <count>/g' || true
          printf '%s\n' "$result" | grep -q '^PROJECT_ARCHITECTURE=STRUCTURAL_PASS;'
          printf '%s\n' "$result" | grep -q '^QUALITY_STAGE_ROUTING=CLASSIFIED_NOT_EXECUTED;'
          echo 'AUDIT_SOURCE_CHECK=PASS'
      - name: Secure cleanup of transient private sources
        if: always()
        shell: bash
        run: |
          rm -rf -- gov source
          echo "TRANSIENT_PRIVATE_SOURCE_CLEANED=YES"
