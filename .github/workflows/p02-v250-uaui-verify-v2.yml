name: P02 V2.5.0 UAUI Verify V2

on:
  pull_request:
    branches: [main]
    paths: ['p02-v250-v2-trigger.txt']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - name: Require private read token
        env: {PRIVATE_TOKEN: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'}
        run: test -n "$PRIVATE_TOKEN"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: task/v2.5.0-runtime-uaui
          token: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'
          path: p02
          fetch-depth: 0
          persist-credentials: false
      - name: Static gates
        working-directory: p02
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-zip php-curl sqlite3 curl
          php -l public/index.php
          find public src -name '*.php' -type f -print0 | xargs -0 -n1 php -l >/tmp/p02-php-lint.txt
          node --check public/assets/app.js
          node --check public/assets/editor-enhancements.js
          node --check public/assets/v250-uaui.js
          python3 scripts/repository-gates.py
          DEPLOY="$RUNNER_TEMP/deploy-check"; bash scripts/build-deploy-tree.sh "$DEPLOY" >/dev/null
          test -s "$DEPLOY/assets/v250-uaui.css"; test -s "$DEPLOY/assets/v250-uaui.js"
          grep -q 'v250-uaui.css' "$DEPLOY/index.php"; grep -q 'v250-uaui.js' "$DEPLOY/index.php"
          rm -rf "$DEPLOY"
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Fresh install
        working-directory: p02
        env: {AUDIT_PASSWORD: 'P02-V250V2-${{ github.run_id }}-${{ github.run_attempt }}!'}
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/p02-v250-v2"; SITE="$ROOT/site"; mkdir -p "$SITE"
          bash scripts/build-deploy-tree.sh "$SITE" >/dev/null
          php -d display_errors=0 -S 127.0.0.1:18153 -t "$SITE" >"$ROOT/server.log" 2>&1 & echo $! > "$ROOT/server.pid"
          for _ in $(seq 1 80); do curl -fsS http://127.0.0.1:18153/setup.php >/dev/null 2>&1 && break; sleep .25; done
          curl -fsS -c "$ROOT/cookie.txt" http://127.0.0.1:18153/setup.php > "$ROOT/setup.html"
          TOKEN=$(python3 - "$ROOT/setup.html" <<'PY'
          import re,html,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf" value="([^"]+)"',s);assert m;print(html.unescape(m.group(1)))
          PY
          )
          test "$(curl -sS -o /dev/null -w '%{http_code}' -b "$ROOT/cookie.txt" -c "$ROOT/cookie.txt" -H 'Origin: http://127.0.0.1:18153' --data-urlencode "setup_csrf=$TOKEN" --data-urlencode "password=$AUDIT_PASSWORD" --data-urlencode "password_confirm=$AUDIT_PASSWORD" http://127.0.0.1:18153/setup.php)" = 303
      - name: Browser regression
        working-directory: p02
        env: {AUDIT_PASSWORD: 'P02-V250V2-${{ github.run_id }}-${{ github.run_attempt }}!'}
        run: |
          cat > .v250-v2.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:900}});const errors=[];
          page.on('pageerror',e=>errors.push('pageerror:'+String(e)));page.on('console',m=>{if(m.type()==='error'&&!/409 \(Conflict\)/.test(m.text()))errors.push('console:'+m.text())});
          const box=async s=>{const l=page.locator(s).first();return await l.isVisible()?await l.boundingBox():null};
          const overlap=(a,b)=>!!(a&&b&&Math.max(0,Math.min(a.x+a.width,b.x+b.width)-Math.max(a.x,b.x))*Math.max(0,Math.min(a.y+a.height,b.y+b.height)-Math.max(a.y,b.y))>0);
          await page.goto('http://127.0.0.1:18153/',{waitUntil:'networkidle'});
          let sess=await page.evaluate(async()=>await(await fetch('/api.php?action=session',{cache:'no-store'})).json());
          if(!sess?.site?.auth){await page.locator('[data-open-login]').click();await page.locator('#loginForm input[name="password"]').fill(process.env.AUDIT_PASSWORD);await page.locator('#loginSubmit').click();await page.waitForFunction(async()=>Boolean((await(await fetch('/api.php?action=session',{cache:'no-store'})).json())?.site?.auth));sess=await page.evaluate(async()=>await(await fetch('/api.php?action=session',{cache:'no-store'})).json());}
          const csrf=sess.csrf;const post=async(a,b)=>page.evaluate(async({a,b,csrf})=>await(await fetch('/api.php?action='+a,{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(b)})).json(),{a,b,csrf});
          const c=await post('category_save',{name:'V250 V2 Audit',description:'',icon:'folder'});if(!c.ok)throw new Error('category '+JSON.stringify(c));const cid=Number(c.id);
          const i=await post('content_save',{category_id:cid,title:'V2.5.0 UAUI 浏览器验证',description:'摘要仅在摘要模式主动显示。',content:'# V2.5.0 UAUI 浏览器验证\n\n这是用于阅读排版验证的正文。\n\n## 第二节\n\n'+('舒适阅读需要合适字号、行距和内容宽度。 '.repeat(90)),content_mode:'article',content_format:'markdown',primary_action:'read',is_favorite:true,status:'active'});if(!i.ok)throw new Error('item '+JSON.stringify(i));const iid=Number(i.id);
          await page.reload({waitUntil:'networkidle'});
          await page.evaluate(async({cid,iid})=>{await setContentView('notebook');await selectCategory(cid);await openReader(iid,true)},{cid,iid});
          await page.waitForFunction(iid=>Number(state.readerItem?.id)===Number(iid),iid,{timeout:10000});
          await page.locator('#notebookLayout').waitFor({state:'visible'});await page.locator('.notebook-title-top strong').first().waitFor({state:'visible'});await page.locator('.markdown-body').first().waitFor({state:'visible'});await page.waitForTimeout(150);
          const typography=await page.evaluate(()=>{const body=document.body,reader=document.querySelector('.markdown-body'),title=document.querySelector('.notebook-title-top strong');return {body:parseFloat(getComputedStyle(body).fontSize),reader:parseFloat(getComputedStyle(reader).fontSize),line:parseFloat(getComputedStyle(reader).lineHeight),mode:document.body.dataset.v250ListMode,titleWeight:getComputedStyle(title).fontWeight};});
          if(typography.body<14.5||typography.reader<16.5||typography.line<27||typography.mode!=='minimal')throw new Error('typography '+JSON.stringify(typography));
          const select=page.locator('[data-v250-list-mode]').first();await select.waitFor({state:'visible'});if(await page.locator('.notebook-title-meta').first().isVisible())throw new Error('minimal meta visible');
          await select.selectOption('standard');await page.waitForFunction(()=>document.body.dataset.v250ListMode==='standard');
          await select.selectOption('summary');await page.waitForFunction(()=>document.body.dataset.v250ListMode==='summary');await page.locator('.v250-item-summary:not([hidden])').first().waitFor({state:'visible'});
          await select.selectOption('minimal');await page.waitForFunction(()=>document.body.dataset.v250ListMode==='minimal');
          const visible=()=>page.locator('#sidebarRailToggle:visible,#notebookPaneCollapse:visible,#notebookPaneRestore:visible').count();if(await visible()!==2)throw new Error('controls initial '+await visible());
          const before=await box('#notebookDetailScroll');await page.locator('#notebookPaneCollapse').click();await page.waitForFunction(()=>state.notebookListCollapsed===true);const afterList=await box('#notebookDetailScroll');if(!before||!afterList||afterList.width<=before.width+150)throw new Error('list collapse geometry');if(await visible()!==2)throw new Error('controls list collapsed '+await visible());if(overlap(await box('#sidebarRailToggle'),await box('#notebookPaneRestore')))throw new Error('rails overlap list collapsed');
          await page.locator('#sidebarRailToggle').click();await page.waitForFunction(()=>state.sidebarCollapsed===true);const afterBoth=await box('#notebookDetailScroll');if(!afterBoth||afterBoth.width<=afterList.width+100)throw new Error('both collapse geometry');if(await visible()!==2)throw new Error('controls both collapsed '+await visible());if(overlap(await box('#sidebarRailToggle'),await box('#notebookPaneRestore')))throw new Error('rails overlap both collapsed');
          await page.locator('#notebookPaneRestore').click();await page.locator('#sidebarRailToggle').click();await page.waitForFunction(()=>!state.notebookListCollapsed&&!state.sidebarCollapsed);
          const fav=await page.evaluate(async iid=>Number((await(await fetch('/api.php?action=content_get&id='+iid,{cache:'no-store'})).json()).data?.item?.is_favorite||0),iid);if(fav!==1)throw new Error('favorite '+fav);
          await page.evaluate(async()=>await state.workspaceController.setMode('edit',true));await page.locator('#articleSource').waitFor({state:'visible'});await page.locator('.vf-editor-toolbar').first().waitFor({state:'visible'});const ed=await page.locator('#articleSource').evaluate(el=>parseFloat(getComputedStyle(el).fontSize));if(ed<15.5)throw new Error('editor font '+ed);await page.evaluate(async()=>await state.workspaceController.setMode('read',true));
          await page.locator('#themeBtn').click();await page.waitForFunction(()=>document.documentElement.getAttribute('data-theme')==='dark');const dark=await page.evaluate(()=>({bg:getComputedStyle(document.body).backgroundColor,side:getComputedStyle(document.querySelector('.sidebar')).backgroundColor}));if(/rgb\(247, 247, 247\)|rgb\(255, 255, 255\)/.test(dark.bg+' '+dark.side))throw new Error('dark '+JSON.stringify(dark));await page.locator('#themeBtn').click();
          for(const [w,h] of [[1920,1080],[1440,900],[1024,820],[768,900],[390,844]]){await page.setViewportSize({width:w,height:h});await page.waitForTimeout(100);const m=await page.evaluate(()=>({c:document.documentElement.clientWidth,s:document.documentElement.scrollWidth}));if(m.s>m.c+3)throw new Error('overflow '+w+' '+JSON.stringify(m));}
          await page.setViewportSize({width:1440,height:900});await page.locator('#accountBtn').click();const dlg=page.locator('[data-dialog-confirm]');if(await dlg.count())await dlg.click();await page.waitForFunction(async()=>!Boolean((await(await fetch('/api.php?action=session',{cache:'no-store'})).json())?.site?.auth));await page.locator('[data-open-login]').waitFor({state:'visible'});await page.locator('[data-open-login]').click();await page.locator('#loginForm input[name="password"]').fill(process.env.AUDIT_PASSWORD);await page.locator('#loginSubmit').click();await page.waitForFunction(async()=>Boolean((await(await fetch('/api.php?action=session',{cache:'no-store'})).json())?.site?.auth));
          if(errors.length)throw new Error(errors.join(' | '));console.log('P02_V250_V2_PASS='+JSON.stringify({typography,before,afterList,afterBoth,dark,errors}));await browser.close();
          JS
          node .v250-v2.mjs
      - name: Cleanup
        if: always()
        working-directory: p02
        run: |
          if test -f "$RUNNER_TEMP/p02-v250-v2/server.pid"; then kill "$(cat "$RUNNER_TEMP/p02-v250-v2/server.pid")" 2>/dev/null || true; fi
          rm -rf "$RUNNER_TEMP/p02-v250-v2" .v250-v2.mjs node_modules package.json package-lock.json || true
