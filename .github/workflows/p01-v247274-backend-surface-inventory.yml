name: P01 V2.47.274 Backend Surface Inventory

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p01-v247274-backend-surface-inventory.yml"

permissions:
  contents: read

jobs:
  inventory:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'audit(P01): V2.47.274 backend surface inventory')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Clone exact vf-start main
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" candidate
          git -C candidate fetch -q origin 4679a5e5a1a154782b04eacfc5b94988ea856f27
          git -C candidate checkout -q --detach 4679a5e5a1a154782b04eacfc5b94988ea856f27
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.274"
          echo P01_BACKEND_INVENTORY_EXACT_SOURCE=PASS

      - name: Enumerate admin surfaces
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import pathlib,re,json
          root=pathlib.Path("candidate/src")
          rows=[]
          redirects=[]
          for p in sorted(root.glob("*.php")):
              s=p.read_text(encoding="utf-8",errors="replace")
              if "vf_admin_shell_begin" in s:
                  title=""
                  group=""
                  m=re.search(r"['\"]title['\"]\s*=>\s*['\"]([^'\"]+)",s)
                  if m:title=m.group(1)
                  m=re.search(r"['\"]group['\"]\s*=>\s*['\"]([^'\"]+)",s)
                  if m:group=m.group(1)
                  rows.append((p.name,title,group))
              if "vf_is_admin" in s and "header('Location:" in s and "vf_admin_shell_begin" not in s:
                  locs=re.findall(r"header\(['\"]Location:\s*([^'\"]+)",s)
                  redirects.append((p.name,locs))
          print("ADMIN_SHELL_FILES="+json.dumps(rows,ensure_ascii=False,separators=(",",":")))
          print("ADMIN_REDIRECT_ONLY="+json.dumps(redirects,ensure_ascii=False,separators=(",",":")))
          expected={
            "manage.php","surface-manager.php","links-admin.php","toolbox-manager.php",
            "health.php","duplicates.php","icons.php","recycle-bin.php",
            "transfer.php","data-safety.php","system-health.php","jobs.php","plugins.php",
            "browser-helper.php","update.php","settings.php","full-governance.php",
            "system-info.php","system-baseline.php","diagnose.php","update-credential.php","workbench.php"
          }
          actual={x[0] for x in rows}
          print("ADMIN_SHELL_FILE_COUNT="+str(len(actual)))
          print("HIDDEN_CURRENT="+json.dumps(sorted(actual-expected),ensure_ascii=False))
          print("MISSING_EXPECTED="+json.dumps(sorted(expected-actual),ensure_ascii=False))
          if actual!=expected:
              raise SystemExit("P01_BACKEND_SOURCE_INVENTORY=FAIL")
          print("P01_BACKEND_SOURCE_INVENTORY=PASS")
          print("PRODUCTION_WRITE=NO")
          PY
