name: S01 preview chooser locale bounded validation
on:
  push:
    branches: [task/s01-preview-dialog169-20261022]
    paths: ['.github/workflows/s01-preview-dialog169.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.169
  TARGET_SHA: 61918227f18de3a3577d71621d19ab6ba0c403dc
  TARGET_TREE: 383bc04509b729db6fa9dea9d72e40f8ac869f79
  BASE_SHA: e83159b14373b010f89a5dbedc6f102ab790ccfb
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          ref: 02d4591eed025a3d3a67bc0a150b3ddc448c2ab8
          persist-credentials: false
          path: established
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 61918227f18de3a3577d71621d19ab6ba0c403dc
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact package and new chooser regression
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider baseline
          python3 control/lanes/s01-preview-dialog169-20261022/package.py
          php -l target/src/inc/runtime-constants.php
          node --check target/src/assets/js/admin/admin-preview.js
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          git -C target show "$BASE_SHA:src/assets/js/admin/admin-preview.js" > baseline/preview.js
          NODE_PATH="$PWD/node_modules" node target/tests/preview-target-dialog-language-browser-check.js baseline/preview.js --expect-regression | tee proof/baseline-regression.txt
          NODE_PATH="$PWD/node_modules" node target/tests/preview-target-dialog-language-browser-check.js target/src/assets/js/admin/admin-preview.js | tee proof/chooser-regression.txt
          gh release download v1.35.168 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.168.zip --dir provider
          echo 'a311f6cb4f51d90686304282736892a1743958fae350f781eefd75219c1ca324  provider/vf-tools-theme_V1.35.168.zip' | sha256sum -c
          gh release download v1.25.94 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.94.zip --dir provider
          echo '70b90d40da5d69fc7819bd7ada3f15fb0145e64822b788bd94956c7827b2df03  provider/vf-tools-m3u8_V1.25.94.zip' | sha256sum -c
      - name: Exact clean ZIP native upgrade rollback repeat and state protection
        run: |
          set -euo pipefail
          cp -a established/lanes/s01-frontend-design-20261017 lane
          cp control/lanes/s01-preview-dialog169-20261022/clean.cjs lane/warm-admin.cjs
          cp control/lanes/s01-preview-dialog169-20261022/seed.php lane/operations-seed.php
          cp control/lanes/s01-preview-dialog169-20261022/review-snapshot.php lane/review-snapshot.php
          python3 - <<'PYLANE'
          from pathlib import Path
          s=Path('lane/native.sh').read_text().replace('provider/vf-tools-m3u8_V1.25.91.zip','provider/vf-tools-m3u8_V1.25.94.zip')
          marker='docker cp target/src/. "$WP:/var/www/html/wp-content/themes/vf-tools-theme/"'
          assert s.count(marker)==1
          s=s.replace(marker,'docker exec "$WP" rmdir /var/www/html/wp-content/themes/vf-tools-theme\ndocker cp provider/vf-tools-theme_V1.35.169.zip "$WP:/tmp/clean-theme.zip"\ncli theme install /tmp/clean-theme.zip >/dev/null')
          installer='cli plugin install polylang --version=3.8.10 --activate >/dev/null'
          assert s.count(installer)==1
          s=s.replace(installer,'for attempt in 1 2 3; do '+installer+' && break; test "$attempt" -lt 3 || exit 1; sleep 3; done')
          marker='docker cp lane/snapshot.php "$WP:/tmp/snapshot.php"'
          assert s.count(marker)==1
          s=s.replace(marker,'docker cp lane/operations-seed.php "$WP:/tmp/operations-seed.php";cli eval-file /tmp/operations-seed.php >/dev/null\n'+marker)
          s=s.replace('cli eval-file /tmp/snapshot.php > proof/state-before.sha256','docker cp lane/review-snapshot.php "$WP:/tmp/review-snapshot.php";cli eval-file /tmp/review-snapshot.php > proof/review-before.sha256\ncli eval-file /tmp/snapshot.php > proof/state-before.sha256')
          marker='if [ "${VF_REVIEW_ONLY_STATE:-0}" = "1" ];then'
          assert s.count(marker)==1
          s=s.split(marker)[0]+"""
          docker cp provider/vf-tools-theme_V1.35.168.zip "$WP:/tmp/theme-old.zip"
          docker cp provider/vf-tools-theme_V1.35.169.zip "$WP:/tmp/theme-new.zip"
          version_check(){ test "$(cli theme get vf-tools-theme --field=version)" = "$1"; test "$(cli plugin get vf-tool-m3u8 --field=version)" = "1.25.94"; echo INSTALLED_VERSION_PASS="$1"; }
          version_check 1.35.169
          cli theme install /tmp/theme-old.zip --force >/dev/null
          version_check 1.35.168
          cli theme install /tmp/theme-new.zip --force >/dev/null
          version_check 1.35.169
          cli theme install /tmp/theme-old.zip --force >/dev/null
          version_check 1.35.168
          cli theme install /tmp/theme-new.zip --force >/dev/null
          version_check 1.35.169
          cli theme install /tmp/theme-new.zip --force >/dev/null
          version_check 1.35.169
          cli eval-file /tmp/snapshot.php > proof/state-after.sha256
          cmp proof/state-before.sha256 proof/state-after.sha256
          cli eval-file /tmp/review-snapshot.php > proof/review-after.sha256
          cmp proof/review-before.sha256 proof/review-after.sha256
          echo NATIVE_CLEAN_ZIP_UPGRADE_ROLLBACK_REPEAT_PROTECTED_DATA_PASS
          """
          Path('lane/preview.sh').write_text(s)
          PYLANE
          bash lane/preview.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-preview-dialog-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private runtime
        if: always()
        run: rm -rf target provider lane baseline
