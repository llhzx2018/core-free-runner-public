name: P03 V1.37.3 Restore Stable Core

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p03-v1373-restore-stable-core.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  P03_REPOSITORY: llhzx2018/vf-forge
  P03_BRANCH: maintenance/v1.37.3-portfolio-intelligence-bootstrap
  STABLE_TAG: v1.37.2
  PRE_SETUP_DETOUR_COMMIT: d9a7bb9c09f867ab407b377a8632c23f57570d77

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout private V1.37.3 work branch
        uses: actions/checkout@v4
        with:
          repository: ${{ env.P03_REPOSITORY }}
          ref: ${{ env.P03_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: p03

      - name: Restore V1.37.2 stable core and retain V1.37.3 identity
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p03
          git show "$STABLE_TAG:src/app/bootstrap.php" > src/app/bootstrap.php
          git show "$STABLE_TAG:public/setup.php" > public/setup.php
          git show "$STABLE_TAG:scripts/build_runtime.py" > scripts/build_runtime.py
          git show "$STABLE_TAG:tests/integration/source_integrity_test.py" > tests/integration/source_integrity_test.py
          git show "$PRE_SETUP_DETOUR_COMMIT:scripts/build_atomic.py" > scripts/build_atomic.py
          rm -f src/app/SetupSupport.php
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/bootstrap.php')
          s=p.read_text(encoding='utf-8')
          old="define('VFAB_VERSION', '1.37.2');"
          new="define('VFAB_VERSION', '1.37.3');"
          assert old in s
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          test "$(cat VERSION)" = '1.37.3'
          grep -Fq "define('VFAB_VERSION', '1.37.3');" src/app/bootstrap.php
          grep -Fq "require_once __DIR__ . '/Auth.php';" src/app/bootstrap.php
          grep -Fq 'function vfab_start_session()' src/app/bootstrap.php
          grep -Fq 'function vfab_php_security_baseline()' src/app/bootstrap.php
          grep -Fq 'function vfab_ensure_schema(PDO $pdo)' src/app/bootstrap.php
          grep -Fq 'vfab_start_session();$setupCsrf=' public/setup.php
          grep -Fq "TARGET_VERSION='1.37.3'" scripts/build_atomic.py
          grep -Fq "ALLOWED_SOURCES=['1.37.2']" scripts/build_atomic.py
          ! grep -Fq 'INSTALL_ONLY_FILES' scripts/build_atomic.py
          test ! -e src/app/SetupSupport.php
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/bootstrap.php public/setup.php scripts/build_runtime.py scripts/build_atomic.py tests/integration/source_integrity_test.py
          git add -u src/app/SetupSupport.php || true
          if ! git diff --cached --quiet; then
            git commit -m 'fix(P03): restore V1.37.2 stable runtime foundation'
            git push origin HEAD:${P03_BRANCH}
          fi
          echo "P03_V1373_STABLE_CORE_SOURCE=$(git rev-parse HEAD)"
          echo 'P03_V1373_STABLE_CORE_RESTORE=PASS'
          echo 'PRODUCTION_WRITE=NO'
