name: P05 Common Baseline V2 Final Exact Source Gate
on:
  push:
    branches: [vf-agent-operations-v1]
    paths:
      - '.github/workflows/p05-common-baseline-v2-final-exact-source-gate.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vfseo
          POSTGRES_PASSWORD: vfseo
          POSTGRES_DB: vfseo_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U vfseo -d vfseo_gate"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      EXACT_SOURCE: b8ec5f454db4ba91a1117ce1cc428b957b440fbc
      RUNTIME_VERIFIED_SOURCE: 3c081bdd1444149f4411eabf5f5ee9e57cff505a
      ASSESSED_BASE: 2e0f3a66a8764d54841f7d7161de7d35e5aacf3f
      TARGET_BRANCH: maintenance/common-product-baseline-v2-20260828
      RUNTIME_GATE_RUN: '33108814258'
      RUNTIME_GATE_JOB: '98645831505'
      DATABASE_URL: postgresql://vfseo:vfseo@127.0.0.1:5432/vfseo_gate
      VF_MASTER_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - name: Checkout final exact P05 source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.EXACT_SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: p05
      - name: Prepare Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: p05/package-lock.json
      - name: Final source and authority closure fence
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p05
          test "$(git rev-parse HEAD)" = "$EXACT_SOURCE"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$EXACT_SOURCE"
          test "$(git rev-parse origin/main)" = "$ASSESSED_BASE"
          test "$(tr -d '\r\n' < VERSION)" = '1.0.1'
          grep -Fq "APP_VERSION = '1.0.1'" src/server/version.ts
          grep -Fq 'SCHEMA_VERSION = 1' src/server/version.ts
          test -z "$(git diff --name-only "$ASSESSED_BASE" "$EXACT_SOURCE" -- VERSION database)"
          actual="$(git diff --name-only "$RUNTIME_VERIFIED_SOURCE" "$EXACT_SOURCE" | sort)"
          expected="$(printf '%s\n' docs/authority/VF_COMMON_PRODUCT_BASELINE_ADOPTION.json docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION.json docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION_CANDIDATE.json | sort)"
          test "$actual" = "$expected"
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path('.')
          v1=json.loads((root/'docs/authority/VF_COMMON_PRODUCT_BASELINE_ADOPTION.json').read_text())
          candidate=json.loads((root/'docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION_CANDIDATE.json').read_text())
          current=json.loads((root/'docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION.json').read_text())
          runtime=os.environ['RUNTIME_VERIFIED_SOURCE']; run=int(os.environ['RUNTIME_GATE_RUN']); job=int(os.environ['RUNTIME_GATE_JOB'])
          assert v1['state']=='SUPERSEDED_BY_V2',v1
          assert candidate['state']=='VERIFIED',candidate
          assert candidate['machine_verification']['state']=='PASS',candidate
          assert candidate['machine_verification']['run_id']==run,candidate
          assert candidate['machine_verification']['job_id']==job,candidate
          assert candidate['machine_verification']['exact_source_sha']==runtime,candidate
          assert candidate['machine_verification']['resolver']['drift_count']==0,candidate
          assert candidate['machine_verification']['resolver']['unknown_count']==0,candidate
          assert candidate['machine_verification']['resolver']['full_pass'] is True,candidate
          assert current['state']=='CURRENT',current
          assert current['runtime_verified_source_sha']==runtime,current
          assert current['machine_verification']['state']=='PASS',current
          assert current['machine_verification']['run_id']==run,current
          assert current['machine_verification']['job_id']==job,current
          assert current['machine_verification']['exact_source_sha']==runtime,current
          assert current['machine_verification']['resolver']['drift_count']==0,current
          assert current['machine_verification']['resolver']['unknown_count']==0,current
          assert current['machine_verification']['resolver']['full_pass'] is True,current
          assert current['version_changed'] is False and current['schema_changed'] is False,current
          assert current['release_executed'] is False and current['production_changed'] is False,current
          assert current['adoption_semantics']=='RUNTIME_DERIVED / READ_ONLY_SYSTEM_BASELINE / NO_SHADOW_TRUTH / EXPLICIT_EXCEPTION_PRESERVED',current
          print('P05_V2_FINAL_AUTHORITY=PASS')
          PY
      - name: Install exact dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p05
          npm ci
      - name: Current formal regression on final exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p05
          npm run lint
          npm run typecheck
          npm run test:unit
          npm run test:contract
          npm run test:integration
          npm run build
          echo P05_V2_FINAL_REGRESSION=PASS
      - name: Final fresh install and runtime resolver gate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p05
          ROOT="$RUNNER_TEMP/p05-v2-final"
          PORT=19035
          PASS='P05-V2-Final-Admin-Password-2026!'
          export NODE_ENV=test PORT
          export VF_DATABASE_PROVIDER=sqlite
          export VF_SQLITE_PATH="$ROOT/vf-seo.sqlite3"
          export VF_BACKUP_DIR="$ROOT/backups"
          export VF_ADMIN_USERNAME=admin
          export VF_ADMIN_PASSWORD="$PASS"
          export VF_SECURE_COOKIES=false VF_REQUIRE_HTTPS=false VF_TRUST_PROXY=false
          export VF_SESSION_TTL_SECONDS=2592000 VF_SESSION_IDLE_SECONDS=604800 VF_SESSION_ABSOLUTE_SECONDS=2592000 VF_SESSION_COOKIE_SECONDS=2592000
          export VF_STEP_UP_WINDOW_SECONDS=900 VF_DISPLAY_TIMEZONE=Asia/Shanghai VF_LOCALE=zh-CN
          mkdir -p "$ROOT"
          npm run migrate
          npm run verify:schema
          npm run bootstrap:admin
          npm run verify:admin-ready
          node dist/src/server/index.js >"$ROOT/server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 120); do
            curl -fsS "http://127.0.0.1:$PORT/api/health" >/dev/null 2>&1 && break
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then cat "$ROOT/server.log"; exit 31; fi
            sleep .1
          done
          cat > "$ROOT/check.mjs" <<'JS'
          const base=`http://127.0.0.1:${process.env.PORT}`;
          const login=await fetch(base+'/api/auth/login',{method:'POST',headers:{'content-type':'application/json','origin':base},body:JSON.stringify({username:'admin',password:process.env.VF_ADMIN_PASSWORD})});
          if(login.status!==200) throw new Error(`login ${login.status}`);
          const setCookie=login.headers.get('set-cookie')||'';
          if(!/Max-Age=2592000/i.test(setCookie)) throw new Error(`cookie ${setCookie}`);
          const cookie=setCookie.split(';')[0];
          const get=async(path)=>{const r=await fetch(base+path,{headers:{cookie}});const b=await r.json();if(r.status!==200)throw new Error(`${path} ${r.status}`);return b;};
          const info=await get('/api/system/info');
          if(info.profile!=='PERSONAL_SINGLE_ADMIN'||info.version!=='1.0.1'||info.schema!==1) throw new Error(`info ${JSON.stringify(info)}`);
          if(info.auth.idleSeconds!==604800||info.auth.absoluteSeconds!==2592000||info.auth.cookieSeconds!==2592000||info.auth.serverSessionFloorSeconds!==2592000||info.auth.periodicRotationRequired!==false||info.auth.stepUpWindowSeconds!==900) throw new Error(`auth ${JSON.stringify(info.auth)}`);
          const baseline=(await get('/api/system/baseline')).report;
          if(baseline.baseline!=='VF-COMMON-PRODUCT-BASELINE@2.0'||baseline.results.length!==15) throw new Error(`baseline ${JSON.stringify(baseline)}`);
          if(baseline.summary.pass!==14||baseline.summary.exception!==0||baseline.summary.drift!==0||baseline.summary.unknown!==0||baseline.summary.nA!==1||baseline.summary.fullPass!==true) throw new Error(`summary ${JSON.stringify(baseline.summary)}`);
          const health=await get('/api/system/health');
          if(health.database!=='READY'||health.process!=='READY') throw new Error(`health ${JSON.stringify(health)}`);
          console.log('P05_V2_FINAL_RUNTIME=PASS');
          JS
          node "$ROOT/check.mjs"
          kill "$SERVER_PID"; wait "$SERVER_PID" || true; trap - EXIT
          if grep -Eqi 'Unhandled|uncaught|fatal|EADDRINUSE' "$ROOT/server.log"; then cat "$ROOT/server.log"; exit 32; fi
      - name: Final exact-source verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p05
          test "$(git rev-parse HEAD)" = "$EXACT_SOURCE"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$EXACT_SOURCE"
          test "$(git rev-parse origin/main)" = "$ASSESSED_BASE"
          test -z "$(git diff --name-only "$ASSESSED_BASE" "$EXACT_SOURCE" -- VERSION database)"
          echo P05_COMMON_BASELINE_V2_FINAL_EXACT_SOURCE="$EXACT_SOURCE"
          echo P05_COMMON_BASELINE_V2_RUNTIME_VERIFIED_SOURCE="$RUNTIME_VERIFIED_SOURCE"
          echo P05_COMMON_BASELINE_V2_VERSION=1.0.1
          echo P05_COMMON_BASELINE_V2_SCHEMA=1
          echo P05_COMMON_BASELINE_V2_MACHINE=PASS
          echo P05_COMMON_BASELINE_V2_AUTHORITY=CURRENT
          echo P05_COMMON_BASELINE_V2_RELEASE=NO
          echo P05_COMMON_BASELINE_V2_PRODUCTION=NO
