name: S01-C01 V1.35.11 Formal Release

on:
  push:
    branches: [temp/s01-c01-v13511-formal-release]
    paths:
      - '.github/workflows/temp-s01-c01-v13511-formal-release.yml'

permissions:
  contents: read

concurrency:
  group: s01-c01-v13511-formal-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      REPO: llhzx2018/vf-tools-theme
      PRODUCT_COMMIT: 868192e5f355f4b2f49855de868360c47b87ea78
      TAG: v1.35.11
      VERSION: 1.35.11
      ASSET_NAME: vf-tools-theme_V1.35.11.zip
      EXPECTED_FILES: '446'
      EXPECTED_BYTES: '1796071'
      EXPECTED_SHA: b2107ba0dfa13720fe40164d2943fa3016d82e4f162bc4d7f8c31df55c9b61ef
      EXPECTED_FP: 00c2fb5b939a4a06085da069d7f1a419f6b936a34885fee9ed6c83d878e9a3c7
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Credential authority gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"
          echo 'CREDENTIAL_MODEL=READ_WRITE_SEPARATED'

      - name: Checkout exact Theme source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-tools-theme
          ref: ${{ env.PRODUCT_COMMIT }}
          token: ${{ env.READ_TOKEN }}
          path: theme
          fetch-depth: 0
          persist-credentials: false

      - name: Re-run Theme release gates
        working-directory: theme
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_COMMIT"
          test "$(tr -d '\r\n' < VERSION)" = "$VERSION"
          grep -Eq '^Version: 1\.35\.11$' src/style.css
          find src -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php tests/update-refresh-policy-contract.php
          php tests/public-reading-final-owner-contract.php
          echo 'THEME_RELEASE_GATE=PASS'

      - name: Rebuild byte-identical Theme candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/theme-release"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os, zipfile
          src=Path('theme/src'); dest=Path(os.environ['RUNNER_TEMP'])/'theme-release'/os.environ['ASSET_NAME']
          rows=[(p.relative_to(src).as_posix(),p) for p in sorted(src.rglob('*'),key=lambda x:x.relative_to(src).as_posix()) if p.is_file()]
          dirs={'vf-tools-theme/'}
          for rel,_ in rows:
              cur='vf-tools-theme'
              for part in rel.split('/')[:-1]:
                  cur += '/' + part; dirs.add(cur + '/')
          with zipfile.ZipFile(dest,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for d in sorted(dirs):
                  zi=zipfile.ZipInfo(d); zi.date_time=(1980,1,1,0,0,0); zi.external_attr=(0o40755<<16)|0x10; z.writestr(zi,b'')
              for rel,p in rows:
                  zi=zipfile.ZipInfo('vf-tools-theme/'+rel); zi.date_time=(1980,1,1,0,0,0); zi.compress_type=zipfile.ZIP_DEFLATED; zi.external_attr=0o100644<<16; z.writestr(zi,p.read_bytes())
          canon=''.join(f'{rel}\0{hashlib.sha256(p.read_bytes()).hexdigest()}\n' for rel,p in rows).encode()
          assert len(rows)==int(os.environ['EXPECTED_FILES'])
          assert dest.stat().st_size==int(os.environ['EXPECTED_BYTES'])
          assert hashlib.sha256(dest.read_bytes()).hexdigest()==os.environ['EXPECTED_SHA']
          assert hashlib.sha256(canon).hexdigest()==os.environ['EXPECTED_FP']
          with zipfile.ZipFile(dest) as z:
              assert z.testzip() is None
              assert z.read('vf-tools-theme/style.css').decode('utf-8').find('Version: 1.35.11') >= 0
          print('TESTED_ARTIFACT_BYTE_IDENTITY=PASS')
          PY

      - name: Tag-first draft Release transaction, exact readback, publish
        shell: bash
        run: |
          set -Eeuo pipefail
          API="https://api.github.com/repos/$REPO"
          AUTH_READ=(-H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          AUTH_WRITE=(-H "Authorization: Bearer $WRITE_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          ASSET="$RUNNER_TEMP/theme-release/$ASSET_NAME"
          RELEASE_ID=''
          TAG_CREATED=0

          cleanup_failure(){
            rc=$?
            if [ "$rc" -ne 0 ]; then
              if [ -n "$RELEASE_ID" ]; then curl -sS -X DELETE "${AUTH_WRITE[@]}" "$API/releases/$RELEASE_ID" >/dev/null || true; fi
              if [ "$TAG_CREATED" = 1 ]; then curl -sS -X DELETE "${AUTH_WRITE[@]}" "$API/git/refs/tags/$TAG" >/dev/null || true; fi
            fi
            exit "$rc"
          }
          trap cleanup_failure EXIT

          curl --fail-with-body -sS "${AUTH_WRITE[@]}" "$API/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          python3 - "$RUNNER_TEMP/releases.json" "$TAG" > "$RUNNER_TEMP/stale-drafts.txt" <<'PY'
          import json,sys
          rows=json.load(open(sys.argv[1])); tag=sys.argv[2]
          hits=[r for r in rows if r.get('tag_name')==tag]
          if any(not r.get('draft',False) for r in hits):
              raise SystemExit('PUBLISHED_RELEASE_ALREADY_EXISTS')
          for r in hits:
              if r.get('draft',False): print(r['id'])
          PY
          while read -r rid; do
            [ -z "$rid" ] || curl --fail-with-body -sS -X DELETE "${AUTH_WRITE[@]}" "$API/releases/$rid" >/dev/null
          done < "$RUNNER_TEMP/stale-drafts.txt"

          TAG_CODE="$(curl -sS -o "$RUNNER_TEMP/tag-preflight.json" -w '%{http_code}' "${AUTH_WRITE[@]}" "$API/git/ref/tags/$TAG")"
          if [ "$TAG_CODE" = 200 ]; then
            EXISTING_SHA="$(python3 -c 'import json;print(json.load(open("'$RUNNER_TEMP/tag-preflight.json'"))["object"]["sha"])')"
            test "$EXISTING_SHA" = "$PRODUCT_COMMIT"
            curl --fail-with-body -sS -X DELETE "${AUTH_WRITE[@]}" "$API/git/refs/tags/$TAG" >/dev/null
          else
            test "$TAG_CODE" = 404
          fi
          echo 'REMOTE_RELEASE_PREFLIGHT=PASS'

          python3 - "$TAG" "$PRODUCT_COMMIT" > "$RUNNER_TEMP/tag.json" <<'PY'
          import json,sys
          print(json.dumps({'ref':'refs/tags/'+sys.argv[1],'sha':sys.argv[2]}))
          PY
          curl --fail-with-body -sS -X POST "${AUTH_WRITE[@]}" -H 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/tag.json" "$API/git/refs" > "$RUNNER_TEMP/tag-response.json"
          TAG_CREATED=1
          test "$(python3 -c 'import json;print(json.load(open("'$RUNNER_TEMP/tag-response.json'"))["object"]["sha"])')" = "$PRODUCT_COMMIT"
          echo 'TAG_CREATE=PASS'

          python3 - "$TAG" "$PRODUCT_COMMIT" > "$RUNNER_TEMP/release.json" <<'PY'
          import json,sys
          print(json.dumps({
            'tag_name':sys.argv[1],
            'target_commitish':sys.argv[2],
            'name':'VF Tools Theme V1.35.11',
            'body':'S01-C01 · VF Tools Theme 1.35.11 UI/UX closure. Git/Release PASS does not claim Production, Static, Online or FINAL_ONLINE_PASS.',
            'draft':True,
            'prerelease':False
          }))
          PY
          curl --fail-with-body -sS -X POST "${AUTH_WRITE[@]}" -H 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/release.json" "$API/releases" > "$RUNNER_TEMP/release-response.json"
          RELEASE_ID="$(python3 -c 'import json;print(json.load(open("'$RUNNER_TEMP/release-response.json'"))["id"])')"
          test -n "$RELEASE_ID"
          echo 'DRAFT_RELEASE_CREATE=PASS'

          UPLOAD_URL="https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=$ASSET_NAME"
          curl --fail-with-body -sS -X POST "${AUTH_WRITE[@]}" -H 'Content-Type: application/zip' --data-binary @"$ASSET" "$UPLOAD_URL" > "$RUNNER_TEMP/asset-response.json"
          ASSET_ID="$(python3 -c 'import json;print(json.load(open("'$RUNNER_TEMP/asset-response.json'"))["id"])')"
          test -n "$ASSET_ID"
          test "$(python3 -c 'import json;print(json.load(open("'$RUNNER_TEMP/asset-response.json'"))["size"])')" = "$EXPECTED_BYTES"
          echo 'RELEASE_ASSET_UPLOAD=PASS'

          curl --fail-with-body -sS -L -H "Authorization: Bearer $WRITE_TOKEN" -H 'Accept: application/octet-stream' -H 'X-GitHub-Api-Version: 2022-11-28' "$API/releases/assets/$ASSET_ID" -o "$RUNNER_TEMP/remote-$ASSET_NAME"
          REMOTE="$RUNNER_TEMP/remote-$ASSET_NAME"
          test "$(stat -c %s "$REMOTE")" = "$EXPECTED_BYTES"
          test "$(sha256sum "$REMOTE" | awk '{print $1}')" = "$EXPECTED_SHA"
          python3 - "$REMOTE" <<'PY'
          import sys,zipfile,re
          p=sys.argv[1]
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              files=[i for i in z.infolist() if not i.is_dir()]
              assert len(files)==446
              assert sorted({i.filename.split('/')[0] for i in files})==['vf-tools-theme']
              txt=z.read('vf-tools-theme/style.css').decode('utf-8')
              assert re.search(r'^Version:\s*1\.35\.11\s*$',txt,re.M)
          PY
          echo 'REMOTE_ASSET_EXACT_READBACK_BEFORE_PUBLISH=PASS'

          echo '{"draft":false,"prerelease":false}' > "$RUNNER_TEMP/publish.json"
          curl --fail-with-body -sS -X PATCH "${AUTH_WRITE[@]}" -H 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/publish.json" "$API/releases/$RELEASE_ID" > "$RUNNER_TEMP/published.json"
          python3 - "$RUNNER_TEMP/published.json" "$TAG" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1])); tag=sys.argv[2]
          assert x['tag_name']==tag and x['draft'] is False and x['prerelease'] is False
          PY
          test "$(curl --fail-with-body -sS "${AUTH_READ[@]}" "$API/git/ref/tags/$TAG" | python3 -c 'import json,sys;print(json.load(sys.stdin)["object"]["sha"])')" = "$PRODUCT_COMMIT"
          test "$(curl --fail-with-body -sS "${AUTH_READ[@]}" "$API/branches/main" | python3 -c 'import json,sys;print(json.load(sys.stdin)["commit"]["sha"])')" = "$PRODUCT_COMMIT"
          trap - EXIT
          echo "FORMAL_RELEASE_ID=$RELEASE_ID"
          echo "FORMAL_ASSET_ID=$ASSET_ID"
          echo 'FORMAL_RELEASE=PASS'
          echo 'REMOTE_ASSET_EXACT_READBACK=PASS'
          echo 'TESTED_ARTIFACT_EQUALS_DELIVERED_ARTIFACT=PASS'
