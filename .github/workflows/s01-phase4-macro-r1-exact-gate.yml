name: S01 Phase 4 Macro R1 Exact Gate

on:
  push:
    branches:
      - task/s01-phase4-macro-r1-gate
    paths:
      - .github/workflows/s01-phase4-macro-r1-exact-gate.yml

permissions:
  contents: read

jobs:
  exact-gate:
    name: Three-component exact CSS contract gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: OPS
            repo: llhzx2018/vf-tools-ops
            base: 7c90688c5fe02d60c3d1b271d112442343533c8d
            head: 4ac47e47edbf1d861707e611dfadc87dec1c7cdd
            test: tests/s01-c02-page-body-system-v1-phase4-macro-contract.php
            allowed1: assets/css/current/admin-s01-dashboard-r14.css
            allowed2: tests/s01-c02-page-body-system-v1-phase4-macro-contract.php
          - component: THEME
            repo: llhzx2018/vf-tools-theme
            base: 0a1a4f3c1b72b8e1a9b3e21884f9b2fa2aa8a512
            head: 308641194c3691429b910f388149d9eda221c365
            test: tests/s01-c01-page-body-system-v1-phase4-macro-contract.php
            allowed1: src/assets/css/admin/admin-s01-page-body-system-v1.css
            allowed2: tests/s01-c01-page-body-system-v1-phase4-macro-contract.php
          - component: M3U8
            repo: llhzx2018/vf-tools-m3u8
            base: b058da1e449e773ebebb694c33675517608f87de
            head: 5ce1e23235fdafcfd40777757695d48e6a8bea8a
            test: tests/s01-c03-page-body-system-v1-phase4-macro-contract.php
            allowed1: src/admin/ui-v4/admin-s01-page-body-system-v1.css
            allowed2: tests/s01-c03-page-body-system-v1-phase4-macro-contract.php
    steps:
      - name: Credential presence
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo "PRIVATE_READ_CREDENTIAL=PASS"

      - name: Exact source and bounded diff
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          REPO: ${{ matrix.repo }}
          BASE: ${{ matrix.base }}
          HEAD: ${{ matrix.head }}
          ALLOWED1: ${{ matrix.allowed1 }}
          ALLOWED2: ${{ matrix.allowed2 }}
        run: |
          set -Eeuo pipefail
          curl -fsSL             -H "Authorization: Bearer $READ_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/commits/$HEAD" -o /tmp/head.json
          test "$(jq -r '.sha' /tmp/head.json)" = "$HEAD"

          curl -fsSL             -H "Authorization: Bearer $READ_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/compare/$BASE...$HEAD" -o /tmp/compare.json
          test "$(jq -r '.status' /tmp/compare.json)" = "ahead"
          mapfile -t CHANGED < <(jq -r '.files[].filename' /tmp/compare.json | sort)
          printf '%s\n' "${CHANGED[@]}"
          test "${#CHANGED[@]}" -eq 2
          printf '%s\n' "${CHANGED[@]}" | grep -Fx "$ALLOWED1"
          printf '%s\n' "${CHANGED[@]}" | grep -Fx "$ALLOWED2"
          echo "BOUNDED_DIFF=PASS"

      - name: Fetch exact private source
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          REPO: ${{ matrix.repo }}
          HEAD: ${{ matrix.head }}
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/src
          curl -fsSL -L             -H "Authorization: Bearer $READ_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/tarball/$HEAD" -o /tmp/src.tar.gz
          tar -xzf /tmp/src.tar.gz -C /tmp/src
          SOURCE_DIR="$(find /tmp/src -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$SOURCE_DIR"
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          echo "EXACT_SOURCE_FETCH=PASS"

      - name: Run Phase 4 macro contract
        shell: bash
        env:
          TEST_FILE: ${{ matrix.test }}
        run: |
          set -Eeuo pipefail
          php "$SOURCE_DIR/$TEST_FILE"

      - name: Frozen boundary negative check
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
          ALLOWED1: ${{ matrix.allowed1 }}
        run: |
          set -Eeuo pipefail
          FILE="$SOURCE_DIR/$ALLOWED1"
          test -f "$FILE"
          case "$COMPONENT" in
            OPS)
              ! grep -F '.vf-v6-shell-header' "$FILE"
              ! grep -F '.vf-v6-domain-nav' "$FILE"
              ;;
            THEME)
              ! grep -F '.vf-v6-shell-header' "$FILE"
              ! grep -F '.vf-v6-domain-nav' "$FILE"
              ! grep -F '.vf-theme-admin-header' "$FILE"
              ;;
            M3U8)
              ! grep -F '.vf-v6-shell-header' "$FILE"
              ! grep -F '.vf-v6-domain-nav' "$FILE"
              ! grep -F '.vf-m3u8-console-head' "$FILE"
              ! grep -F '.vf-m3u8-primary-nav' "$FILE"
              ;;
          esac
          echo "FROZEN_BOUNDARY=PASS"
