name: P01 V2.36.1 Formal Artifact Gate
on:
  push:
    branches: [release/p01-v2361-candidate-20260901]
    paths: [.github/workflows/p01-v2361-formal-artifact-gate-20260901.yml]
permissions:
  contents: read
jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      FORMAL: 23321270d79fc98d529c2c5a0ef07e0f1012835a
      FORMAL_TREE: 889d7662cf7907cc93d958c5df31f7824faa050a
      FORMAL_RUNTIME_TREE: 91f92c5d3e7080469a7f5ab1497145454014c87a
      MAIN_EXPECTED: e35a0757bde5e8c749f8ca3cb49349d2c463ec77
      SOURCE: 225780b1ed56bbcc8e62ba465b1129e1c22ee60a
      SOURCE_TREE: 8af6d8ea6168fae52988cae8272a19073a0a7a2e
      SOURCE_RUNTIME_TREE: ad3f96345ead330adffb20c7ecb3cdf6537036b6
      VERSION: 2.36.1
      SOURCE_VERSION: 2.36.0
      SCHEMA: '2026082901'
      CANDIDATE_GATE: '33472637909'
      CANDIDATE_ARTIFACT: '9787058642'
      CANDIDATE_DIGEST: 1e6dfd1aa9b7612f5ccf0b85bc46919979f224a0e75734680bce0de2b0ebcf60
      OUT: /tmp/p01-v2361-formal-artifacts
      EVID: /tmp/p01-v2361-formal-evidence
      UPGRADE: /tmp/p01-v2361-formal-upgrade
    steps:
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - name: Checkout release runner
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: release/p01-v2361-candidate-20260901
          path: runner
      - name: Checkout proven V2.36.0 formal template
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 71c0ddf946974a6d6ac75bc629ffc07256eb9e4f
          path: template
      - name: Checkout exact merged formal source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.FORMAL }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: formal
      - name: Checkout immutable V2.36.0 predecessor
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.36.0
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: production
      - name: Checkout proven Atomic builder
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: agent/p01-22121-formal-artifact-gate-20260819
          path: proven
      - name: Generate fenced formal gates
        shell: bash
        run: python3 runner/scripts/p01_v2361_formal_gate_generate.py
      - name: Exact formal fence
        shell: bash
        run: bash /tmp/p01-v2361-formal-generated/01-exact.sh
      - name: Build deterministic formal release artifacts
        shell: bash
        run: bash /tmp/p01-v2361-formal-generated/02-build.sh
      - name: Actual formal V2.36.0 to V2.36.1 upgrade
        shell: bash
        run: bash /tmp/p01-v2361-formal-generated/03-atomic.sh
      - name: Final formal verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          printf 'P01_V2361_FORMAL_ARTIFACT_GATE=PASS\nFORMAL=%s\nTREE=%s\nRUNTIME_TREE=%s\nSCHEMA=%s\nMIGRATION=NONE\nCANDIDATE_GATE=%s/PASS\nOWNER_PRODUCTION_WRITE=NO\n' "$FORMAL" "$FORMAL_TREE" "$FORMAL_RUNTIME_TREE" "$SCHEMA" "$CANDIDATE_GATE" | tee "$EVID/verdict.txt"
      - name: Upload formal artifacts and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-v2361-formal-artifacts-${{ github.run_id }}
          path: |
            /tmp/p01-v2361-formal-artifacts
            /tmp/p01-v2361-formal-evidence
          if-no-files-found: error
          retention-days: 90
      - name: Stop server
        if: always()
        shell: bash
        run: kill "$(cat /tmp/p01-v2361-formal.pid 2>/dev/null)" 2>/dev/null || true
