name: P01 V2.47.4 Contract Reconcile Gate

on:
  pull_request:
    paths:
      - '.github/workflows/p01-v2474-contract-reconcile-gate.yml'

permissions:
  contents: read

jobs:
  reconcile:
    if: github.head_ref == 'temp/p01-v2474-preview-gate-20260910'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      TEST_SHA: f34108bdaff33506c2f2e24b93e4d0c427a0d9b7
      BASE_MAIN: 1057a229073560b2315a99df7a7e231b89eb6d1e
      SOURCE_TAG: v2.47.3
      SOURCE_SHA: 62c3edc7178a01b1204811856a8fb7ca2b19ae21
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Verify exact test branch identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/main" --jq '.object.sha')" = "$BASE_MAIN"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/test/p01-v2474-release-contract-reconcile-20260910" --jq '.object.sha')" = "$TEST_SHA"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/tags/${SOURCE_TAG}" --jq '.object.sha')" = "$SOURCE_SHA"
          echo P01_V2474_CONTRACT_RECONCILE_IDENTITY=PASS

      - name: Checkout exact P01 test branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.TEST_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd
          coverage: none

      - name: Verify scope and all changed unit contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TEST_SHA"
          test "$(git rev-parse "$SOURCE_TAG^{commit}")" = "$SOURCE_SHA"
          git diff --name-only "$BASE_MAIN" "$TEST_SHA" | sort >/tmp/actual
          cat >/tmp/expected <<'EOF'
          tests/unit/all_resources_page_visual_closure_contract.php
          tests/unit/channels_page_full_polish_contract.php
          tests/unit/project_page_context_closure_contract.php
          tests/unit/topics_page_full_polish_contract.php
          EOF
          sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual
          test -z "$(git diff --name-only "$SOURCE_TAG" "$TEST_SHA" -- src/migrations VF_PROJECT.json)"
          find src -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
          mapfile -t tests < <(git diff --name-only "$SOURCE_TAG" "$TEST_SHA" -- 'tests/unit/*.php' | sort)
          test "${#tests[@]}" -eq 21
          failures=0
          for f in "${tests[@]}"; do
            echo "RUN_RELEASE_UNIT=$f"
            if php "$f"; then :; else echo "UNIT_FAIL=$f"; failures=$((failures+1)); fi
          done
          echo "P01_V2474_CHANGED_UNITS_TOTAL=${#tests[@]}"
          test "$failures" -eq 0
          echo P01_V2474_ALL_CHANGED_UNIT_CONTRACTS=PASS
