name: P01 V2.37.3 Formal Artifact
on:
  push:
    branches: [release/p01-v2373-hotfix-20260902]
    paths:
      - .github/workflows/p01-v2373-formal-artifact-20260902.yml
      - scripts/p01_v2373_formal_artifact.py
permissions:
  actions: read
  contents: read
jobs:
  artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OUT: /tmp/p01-v2373-formal-artifacts
      FORMAL_SOURCE: cec95e310771feb6813a51c7ee3340884295ee38
      FORMAL_TREE: 8fc025e93aaf730414e70a3fcbdc6d43fe954653
      RUNTIME_TREE: e56459ebadc120c749cc5336821d762001db5218
      SOURCE: 1f5a16796511620760a45cb81b3c8019b91e505b
    steps:
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: release/p01-v2373-hotfix-20260902
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: agent/p01-22121-formal-artifact-gate-20260819
          path: proven
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.FORMAL_SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: formal
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.37.2
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: production
      - name: Fresh formal source fence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C formal rev-parse HEAD)" = "$FORMAL_SOURCE"
          test "$(git -C formal rev-parse HEAD^{tree})" = "$FORMAL_TREE"
          test "$(git -C formal rev-parse HEAD:src)" = "$RUNTIME_TREE"
          test "$(git -C production rev-parse HEAD)" = "$SOURCE"
          test "$(cat formal/VERSION)" = 2.37.3
          test "$(cat production/VERSION)" = 2.37.2
          test "$(git -C formal rev-parse HEAD:database)" = "$(git -C production rev-parse HEAD:database)"
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33600570356 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33600694106 --jq .conclusion)" = success
      - name: Freeze deterministic formal bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 runner/scripts/p01_v2373_formal_artifact.py | tee /tmp/p01-v2373-formal-build.json
          php -l "$OUT/repair-v2.37.3.php"
          php "$OUT/repair-v2.37.3.php" --self-test | tee /tmp/p01-v2373-repair-self-test.json | jq -e '.ok==true and .global_barrier==true and .interruption_recovery==true' >/dev/null
          unzip -t "$OUT/VF-Start-V2.37.3-FULL.zip" >/dev/null
          unzip -t "$OUT/VF_Start_V2.37.3_UPDATE.zip" >/dev/null
          sha256sum "$OUT"/* | sort | tee /tmp/p01-v2373-formal-sha256.txt
          test "$(find "$OUT" -maxdepth 1 -type f | wc -l | tr -d ' ')" = 8
          jq -e '.status=="FORMAL_ARTIFACT_PASS" and .version=="2.37.3" and .source_version=="2.37.2" and .schema=="2026082901" and .schema_change==false and .migration==null' "$OUT/P01-V2.37.3-FORMAL.json" >/dev/null
          printf 'P01_V2373_FORMAL_ARTIFACT=PASS\nFORMAL_SOURCE=%s\nTREE=%s\nRUNTIME_TREE=%s\nSCHEMA=2026082901\nMIGRATION=NONE\nFROZEN_BYTES=YES\nREBUILD_AFTER_THIS=NO\nOWNER_PRODUCTION_WRITE=NO\n' "$FORMAL_SOURCE" "$FORMAL_TREE" "$RUNTIME_TREE" | tee /tmp/p01-v2373-formal-artifact-verdict.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2373-formal-artifact-${{ github.run_id }}
          path: |
            /tmp/p01-v2373-formal-artifacts
            /tmp/p01-v2373-formal-build.json
            /tmp/p01-v2373-repair-self-test.json
            /tmp/p01-v2373-formal-sha256.txt
            /tmp/p01-v2373-formal-artifact-verdict.txt
          if-no-files-found: error
          retention-days: 90
