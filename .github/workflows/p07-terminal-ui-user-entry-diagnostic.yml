name: P07 Terminal UI User Entry Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-terminal-ui-user-entry-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: d95188c0765dedaf4e29c437ad2f8dd664919328
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Exact source
        run: test "$(git rev-parse HEAD)" = "d95188c0765dedaf4e29c437ad2f8dd664919328"
      - name: Synthetic migration branch diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m unittest -v \
            tests.test_user_entry.UserEntryTests.test_migration_unreachable_fails_before_backup \
            tests.test_user_entry.UserEntryTests.test_migration_needs_key_setup_is_distinct_and_can_return \
            tests.test_user_entry.UserEntryTests.test_migration_key_setup_rechecks_and_reaches_ready \
            tests.test_user_entry.UserEntryTests.test_migration_target_not_cloudpanel_fails_before_backup \
            tests.test_user_entry.UserEntryTests.test_migration_target_domain_conflict_fails_before_backup
