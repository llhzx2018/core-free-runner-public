name: S01 Theme 1.35.31 Card Layout Candidate Gate

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_REPO: llhzx2018/vf-tools-theme
      CANDIDATE_SHA: 268a2f00aaa129937afe48f2fe82ac0296655a8b
      BASE_SHA: 643153c295d9fc4ac5f6190384481f4e1349e563
      VERSION: 1.35.31
      PREVIOUS_TAG: v1.35.30
      ASSET: vf-tools-theme_V1.35.31.zip
      PREVIOUS_ASSET: vf-tools-theme_V1.35.30.zip

    steps:
      - name: Checkout exact Theme candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 268a2f00aaa129937afe48f2fe82ac0296655a8b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: theme
          persist-credentials: false

      - name: Exact identity and scope fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C theme rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(tr -d '\r\n' < theme/VERSION)" = "$VERSION"
          grep -Fq 'Version: 1.35.31' theme/src/style.css
          grep -Fq 'V1.35.31_S01_CARD_LAYOUT_CONTRACT_CLOSURE' theme/src/style.css
          actual="$(git -C theme diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" | sort)"
          expected="$(printf '%s\n' \
            CHANGELOG.md \
            VERSION \
            src/assets/css/public/pages/families/public-family-03-content-list-operations-closure.css \
            src/assets/css/public/vf-theme-public-runtime.css \
            src/inc/runtime-constants.php \
            src/style.css \
            src/theme.json \
            tests/s01-c01-13531-card-layout-contract-closure.php | sort)"
          test "$actual" = "$expected"
          echo PASS_EXACT_IDENTITY_AND_SCOPE

      - name: Card layout contract and PHP syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          php theme/tests/s01-c01-13531-card-layout-contract-closure.php
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find theme/src -type f -name '*.php' -print0 | sort -z)
          python3 - <<'PY'
          import json
          d=json.load(open('theme/src/theme.json'))
          assert d['version'] == 3
          assert d['settings']['custom']['vfThemeVersion'] == '1.35.31'
          assert d['settings']['custom']['vfPackageSyncRound'] == 'V1.35.31_S01_CARD_LAYOUT_CONTRACT_CLOSURE'
          print('PASS_THEME_JSON_IDENTITY')
          PY
          echo PASS_CARD_LAYOUT_CONTRACT_AND_PHP

      - name: Live renderer selector assertions
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq "echo '<a class="vf-directory-card " theme/src/inc/modules/module-post-list.php
          test "$(grep -Fo ':where(.vf-directory-card,.vf-directory-card>a)' theme/src/assets/css/public/pages/families/public-family-03-content-list-operations-closure.css | wc -l)" = "3"
          test "$(grep -Fo ':where(.vf-directory-card,.vf-directory-card>a)' theme/src/assets/css/public/vf-theme-public-runtime.css | wc -l)" = "3"
          grep -Fq ':where(.vf-directory-card,.vf-directory-card>a){display:grid;grid-template-columns:112px minmax(0,1fr);align-items:stretch;min-height:150px;color:inherit;text-decoration:none}' theme/src/assets/css/public/vf-theme-public-runtime.css
          grep -Fq ':where(.vf-directory-card,.vf-directory-card>a){grid-template-columns:76px minmax(0,1fr);min-height:132px}' theme/src/assets/css/public/vf-theme-public-runtime.css
          grep -Fq ':where(.vf-directory-card,.vf-directory-card>a){grid-template-columns:minmax(0,1fr);gap:0}' theme/src/assets/css/public/vf-theme-public-runtime.css
          echo PASS_ROOT_CARD_LAYOUT_ASSERTIONS

      - name: Ownership and security fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C theme diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" -- \
            src/inc/update \
            src/inc/services/navigation-service.php \
            src/inc/theme-navigation.php \
            src/inc/theme-navigation-render.php \
            src/inc/modules/module-post-list.php | wc -l)" = "0"
          ! grep -RInE 'gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY' \
            theme/src/inc/runtime-constants.php \
            theme/src/theme.json \
            theme/src/style.css
          echo PASS_BOUNDARY_AND_SECURITY

      - name: Build deterministic Theme package and Runtime Authority
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf stage1 stage2 dist
          mkdir -p stage1/vf-tools-theme stage2/vf-tools-theme dist
          cp -a theme/src/. stage1/vf-tools-theme/
          cp -a theme/src/. stage2/vf-tools-theme/
          rm -f stage1/vf-tools-theme/README.md stage1/vf-tools-theme/CHANGELOG.md
          rm -f stage2/vf-tools-theme/README.md stage2/vf-tools-theme/CHANGELOG.md
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          root=Path('theme/src')
          def runtime(rel):
              rel=rel.replace('\\','/').lstrip('/')
              if not rel or '../' in rel: return False
              if re.search(r'(^|/)(?:\.git|\.github|tests?|docs?|evidence|private|tmp|temp|cache|logs?)(/|$)',rel,re.I): return False
              base=Path(rel).name.lower()
              if base in {'readme.md','changelog.md','license','license.txt'}: return False
              if re.search(r'\.(?:sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',rel,re.I): return False
              if '/' not in rel:
                  return rel=='style.css' or rel.lower().endswith('.php')
              return re.match(r'^(?:inc|assets|config|languages|template-parts|templates)/',rel) is not None
          rows=[]
          for p in sorted((x for x in root.rglob('*') if x.is_file()),key=lambda x:x.relative_to(root).as_posix()):
              rel=p.relative_to(root).as_posix()
              if not runtime(rel): continue
              if p.is_symlink(): raise SystemExit('runtime symlink forbidden: '+rel)
              b=p.read_bytes()
              rows.append((rel,hashlib.sha256(b).hexdigest()))
          canonical=b''.join(rel.encode()+b'\0'+sha.encode()+b'\n' for rel,sha in rows)
          Path('/tmp/runtime_count').write_text(str(len(rows)))
          Path('/tmp/runtime_fp').write_text(hashlib.sha256(canonical).hexdigest())
          print('RUNTIME_FILES='+str(len(rows)))
          print('RUNTIME_FINGERPRINT='+hashlib.sha256(canonical).hexdigest())
          PY
          test "$(cat /tmp/runtime_count)" = "456"
          (cd stage1 && zip -X -q -r "../dist/$ASSET" vf-tools-theme)
          (cd stage2 && zip -X -q -r "../dist/rebuild-$ASSET" vf-tools-theme)
          cmp "dist/$ASSET" "dist/rebuild-$ASSET"
          unzip -tq "dist/$ASSET" >/dev/null
          test "$(unzip -Z1 "dist/$ASSET" | cut -d/ -f1 | sort -u)" = "vf-tools-theme"
          unzip -p "dist/$ASSET" vf-tools-theme/style.css | grep -Fq 'Version: 1.35.31'
          unzip -p "dist/$ASSET" vf-tools-theme/inc/runtime-constants.php | grep -Fq "VF_THEME_VERSION', '1.35.31'"
          unzip -p "dist/$ASSET" vf-tools-theme/theme.json | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['version']==3 and d['settings']['custom']['vfThemeVersion']=='1.35.31'"
          unzip -Z1 "dist/$ASSET" | grep -Fxq 'vf-tools-theme/screenshot.png'
          unzip -Z1 "dist/$ASSET" | grep -Fxq 'vf-tools-theme/theme.json'
          sha256sum "dist/$ASSET" | awk '{print $1}' > /tmp/asset_sha
          stat -c '%s' "dist/$ASSET" > /tmp/asset_bytes
          echo PASS_DETERMINISTIC_THEME_PACKAGE

      - name: Previous release compatibility and rollback gate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p previous
          gh release download "$PREVIOUS_TAG" --repo "$TARGET_REPO" --pattern "$PREVIOUS_ASSET" --dir previous
          unzip -tq "previous/$PREVIOUS_ASSET" >/dev/null
          unzip -p "previous/$PREVIOUS_ASSET" vf-tools-theme/style.css | grep -Fq 'Version: 1.35.30'
          unzip -Z1 "previous/$PREVIOUS_ASSET" | grep -v '/$' | sed 's#^vf-tools-theme/##' | sort > /tmp/prev_files.txt
          unzip -Z1 "dist/$ASSET" | grep -v '/$' | sed 's#^vf-tools-theme/##' | sort > /tmp/new_files.txt
          comm -13 /tmp/prev_files.txt /tmp/new_files.txt > /tmp/added.txt
          comm -23 /tmp/prev_files.txt /tmp/new_files.txt > /tmp/removed.txt
          test ! -s /tmp/added.txt
          test ! -s /tmp/removed.txt
          echo "ROLLBACK_ASSET=$PREVIOUS_TAG/$PREVIOUS_ASSET"
          echo PASS_PREVIOUS_RELEASE_COMPATIBILITY_AND_ROLLBACK

      - name: Candidate receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/candidate-receipt.txt <<EOF
          COMPONENT=S01-C01
          VERSION=$VERSION
          SOURCE_SHA=$CANDIDATE_SHA
          BASE_RELEASE=$PREVIOUS_TAG
          ASSET=$ASSET
          BYTES=$(cat /tmp/asset_bytes)
          SHA256=$(cat /tmp/asset_sha)
          RUNTIME_FILES=$(cat /tmp/runtime_count)
          RUNTIME_FINGERPRINT=$(cat /tmp/runtime_fp)
          RUNTIME_ADDED=NONE
          RUNTIME_REMOVED=NONE
          ROOT_CARD_LAYOUT=PASS
          DESKTOP_MEDIA_RAIL=PASS
          MOBILE_MEDIA_RAIL=PASS
          PHONE_MEDIA_COVER=PASS
          DATA_MIGRATION=NONE
          OWNER_REAL_USE=POST_RELEASE_NOT_RUN
          RESULT=PASS
          EOF
          cat /tmp/candidate-receipt.txt
          echo PASS_S01_THEME_13531_CANDIDATE_GATE

      - name: Upload exact tested candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c01-13531-candidate-${{ github.run_id }}
          path: |
            dist/vf-tools-theme_V1.35.31.zip
            /tmp/candidate-receipt.txt
          if-no-files-found: error
          retention-days: 14
