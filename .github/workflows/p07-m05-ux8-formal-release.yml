# P07-M05 新服务器初始化 UX10: one-shot public-safe test, close PR without merge.
name: P07 M05 UX10 CP2 bootstrap boundary and fail-stop proof
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/p07-m05-ux8-formal-release.yml]
permissions:
  contents: read
jobs:
  m05-ux10:
    if: github.repository == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      NO_COLOR: '1'
      PRODUCT_SHA: 097f2d084dfae2a7446fdca1186c9f0e68767fa9
      PRODUCT_TREE: d1075a72657ea84aad7f739fbf4079613f32021f
      PREVIOUS_BUILD: 0.1.0-m05-ux9-real-backup-identity
      NEW_BUILD: 0.1.0-m05-ux10-bootstrap-ux-failstop
      PREVIOUS_SHA: 4c7a6e2574ab5ac31cfa95a3cc3e05ea7278739976a4bfe28283806aa4193031
    steps:
      - name: Checkout public atomic installer and tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact private PR367 source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 097f2d084dfae2a7446fdca1186c9f0e68767fa9
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product
      - name: Verify exact product identity and M03 denial remains intact
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git -C product rev-parse HEAD^{tree})" = "$PRODUCT_TREE"
          test "$(cat product/VERSION)" = 0.1.0
          test "$(grep '^BUILD_ID = ' product/scripts/build_p07_m05_bundle.py)" = "BUILD_ID = \"$NEW_BUILD\""
          test "$(git -C product diff --name-only adb184c3547015d7ddad0b75cd6e8cac003dff79 "$PRODUCT_SHA" | grep -vc -E '^(bin/vfops-init-(core|ui)|lib/m05_cloudpanel_bootstrap.py|scripts/build_p07_m05_bundle.py|tests/test_p07_m05_(isolated_module|host_write_gate).py)$')" = "0"
          test "$(git -C product show HEAD:lib/migration_release_scope.py | sha256sum | cut -d ' ' -f1)" = "$(git -C product show adb184c3547015d7ddad0b75cd6e8cac003dff79:lib/migration_release_scope.py | sha256sum | cut -d ' ' -f1)"
          bash -n product/bin/vfops-init-core product/bin/vfops-init-ui product/bin/vfops-init-entry
          python3 -B -m py_compile product/lib/m05_cloudpanel_bootstrap.py
          echo P07_M05_UX10_M03_DENIAL_AND_EXACT_SCOPE=PASS
      - name: Execute relevant M05 tests including actual CLI isolation and failure UX
        shell: bash
        run: |
          set -Eeuo pipefail
          export PYTHONPATH=product/lib
          python3 -B -m unittest discover -s product/tests -p 'test_p07_m05_isolated_module.py' -q
          python3 -B -m unittest discover -s product/tests -p 'test_p07_m05_host_write_gate.py' -q
          python3 -B -m unittest discover -s product/tests -p 'test_p07_m05_dirty_host_guard.py' -q
          python3 -B product/scripts/check_p07_modules.py
          python3 -B product/scripts/check_p07_terminal_ux.py
          echo P07_M05_UX10_SECURITY_AND_TERMINAL_UX_TESTS=PASS
      - name: Build twice and independently Atomic upgrade UX9 to UX10 then rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          m="$RUNNER_TEMP/p07-m05-ux10"
          mkdir -p "$m"
          python3 -B product/scripts/build_p07_m05_bundle.py --output "$m/a.zip"
          python3 -B product/scripts/build_p07_m05_bundle.py --output "$m/b.zip"
          cmp "$m/a.zip" "$m/b.zip"
          python3 - "$m/a.zip" <<'PY'
          import sys,zipfile,json
          with zipfile.ZipFile(sys.argv[1]) as z:
              manifest=json.loads(z.read('p07-m05/MODULE_MANIFEST.json'))
              assert manifest['module_id']=='P07-M05'
              assert manifest['module_build_id']=='0.1.0-m05-ux10-bootstrap-ux-failstop'
              assert 'p07-m05/lib/m05_cloudpanel_bootstrap.py' in z.namelist()
              assert 'p07-m05/bin/vfops' not in z.namelist()
          print('P07_M05_UX10_REPRODUCIBLE_ISOLATED_ZIP=PASS')
          PY
          curl --proto '=https' --tlsv1.2 -fsSL --retry 2 --max-time 90 \
            'https://github.com/llhzx2018/core-free-runner-public/releases/download/p07-m05-v0.1.0-ux9-real-backup-identity-20261118/P07-M05-0.1.0-m05-ux9-real-backup-identity.zip' -o "$m/ux9.zip"
          echo "$PREVIOUS_SHA  $m/ux9.zip" | sha256sum -c - >/dev/null
          test ! -e /opt/vfops-modules/m05
          for i in m01 m02 m03 m04; do
            sudo -n mkdir -p "/opt/vfops-modules/$i"
            printf 'KEEP_%s\n' "$i" | sudo -n tee "/opt/vfops-modules/$i/KEEP" >/dev/null
          done
          (cd /opt/vfops-modules && sha256sum m0{1,2,3,4}/KEEP) > "$m/siblings.sha"
          new_sha="$(sha256sum "$m/a.zip" | cut -d ' ' -f1)"
          sudo -n python3 -B installers/p07-m05-atomic.py install "$m/ux9.zip" "$PREVIOUS_SHA"
          test "$(sudo -n readlink /opt/vfops-modules/m05/current)" = "releases/$PREVIOUS_BUILD"
          sudo -n python3 -B installers/p07-m05-atomic.py install "$m/a.zip" "$new_sha"
          test "$(sudo -n readlink /opt/vfops-modules/m05/current)" = "releases/$NEW_BUILD"
          sudo -n python3 -B installers/p07-m05-atomic.py install "$m/a.zip" "$new_sha"
          if sudo -n python3 -B installers/p07-m05-atomic.py install "$m/a.zip" "$(printf '0%.0s' {1..64})" >/dev/null 2>&1; then exit 13; fi
          if sudo -n python3 -B installers/p07-m05-atomic.py rollback "$PREVIOUS_BUILD" --confirm WRONG >/dev/null 2>&1; then exit 13; fi
          sudo -n python3 -B installers/p07-m05-atomic.py rollback "$PREVIOUS_BUILD" --confirm "P07-M05:$PREVIOUS_BUILD"
          test "$(sudo -n readlink /opt/vfops-modules/m05/current)" = "releases/$PREVIOUS_BUILD"
          sudo -n python3 -B installers/p07-m05-atomic.py install "$m/a.zip" "$new_sha"
          (cd /opt/vfops-modules && sha256sum -c "$m/siblings.sha")
          echo P07_M05_UX9_TO_UX10_REAL_ATOMIC_ROLLBACK_SIBLING_SAFE=PASS
          echo P07_M05_UX10_DEV_PACKAGE_SHA256="$new_sha"
          echo P07_OWNER_CP2_PRODUCTION_DB_DNS_MIGRATION=NOT_RUN
      - name: Remove temporary private source and ZIPs
        if: always()
        shell: bash
        run: |
          rm -rf -- product "$RUNNER_TEMP/p07-m05-ux10"
          echo P07_PRIVATE_SOURCE_AND_TEST_ZIPS_CLEANED=PASS
