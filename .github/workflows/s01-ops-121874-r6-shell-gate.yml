name: S01 Ops 1.21.874 Live Availability Smoke

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Verify private authority access
        shell: bash
        run: |
          set -Eeuo pipefail
          for repo in core-updates vf-tools-ops; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $VF_PRIVATE_READ_TOKEN" "https://api.github.com/repos/llhzx2018/$repo" || true)"
            test "$code" = "200"
          done
          echo PRIVATE_AUTHORITY=PASS

      - name: Read live S01-C02 and verify package
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $VF_PRIVATE_READ_TOKEN"             'https://api.github.com/repos/llhzx2018/core-updates/contents/projects/S01-C02.json?ref=main'             | jq -r '.content' | tr -d '\n' | base64 -d > /tmp/c02.json
          jq -e '(.target_version=="1.21.874")
            and ((.from_versions | index("1.21.873")) != null)' /tmp/c02.json >/dev/null
          repo="$(jq -r '.repository' /tmp/c02.json)"
          tag="$(jq -r '.release_tag' /tmp/c02.json)"
          asset="$(jq -r '.asset_name' /tmp/c02.json)"
          bytes="$(jq -r '.asset_bytes' /tmp/c02.json)"
          sha="$(jq -r '.asset_sha256' /tmp/c02.json)"
          curl -fsSL -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $VF_PRIVATE_READ_TOKEN"             "https://api.github.com/repos/$repo/releases/tags/$tag" > /tmp/release.json
          aid="$(jq -r --arg n "$asset" '.assets[] | select(.name==$n) | .id' /tmp/release.json | head -n1)"
          test -n "$aid" && test "$aid" != null
          curl -fsSL -L -H 'Accept: application/octet-stream' -H "Authorization: Bearer $VF_PRIVATE_READ_TOKEN"             "https://api.github.com/repos/$repo/releases/assets/$aid" -o "/tmp/$asset"
          test "$(stat -c '%s' "/tmp/$asset")" = "$bytes"
          test "$(sha256sum "/tmp/$asset" | awk '{print $1}')" = "$sha"
          unzip -tq "/tmp/$asset" >/dev/null
          unzip -p "/tmp/$asset" vf-ops/vf-ops.php | grep -Fq 'Version: 1.21.874'
          echo PASS_S01_OPS_121874_LIVE_AVAILABLE
