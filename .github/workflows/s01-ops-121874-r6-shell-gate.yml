name: S01 Ops 1.21.874 R6 Global Shell Gate

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CANDIDATE_SHA: a467018a4b2e687b3a633f181d8f58901ee65501
      BASE_SHA: 8d63c75773ea2dd9c096356dbb4791d0cfbc8de9
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Checkout exact Ops candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: a467018a4b2e687b3a633f181d8f58901ee65501
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: ops
          persist-credentials: false

      - name: Exact identity and scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(cat ops/VERSION)" = "1.21.874"
          grep -Fq 'Version: 1.21.874' ops/vf-ops.php
          grep -Fq "S01-MATURE-ADMIN-V6-R6-GLOBAL-SHELL-CLOSURE" ops/vf-ops.php
          actual="$(git -C ops diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" | sort)"
          expected="$(printf '%s\n'             VERSION             vf-ops.php             includes/s01/v6-landing-shell.php             includes/s01/tool-workbench.php             tests/s01-v6-r6-global-shell-closure-contract.php | sort)"
          test "$actual" = "$expected"
          echo OPS_121874_SCOPE=PASS

      - name: Contract and PHP syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          php ops/tests/s01-v6-r6-global-shell-closure-contract.php
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find ops -type f -name '*.php' -print0 | sort -z)
          echo OPS_121874_PHP=PASS

      - name: Ownership boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" --             includes/wp-update             includes/v6             includes/site-release             includes/publish-workflow             includes/system-governance | wc -l)" = "0"
          ! grep -RInE 'gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY' ops/includes/s01 ops/vf-ops.php
          echo OPS_121874_BOUNDARY=PASS

      - name: Result
        run: echo PASS_S01_OPS_121874_R6_GLOBAL_SHELL_GATE
