name: S01 Ops 1.21.874 Distribution Gate

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  distribution-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      CORE_SHA: c9306fac19a352269b759173ff4f9e39634b73ad
      CORE_PARENT: 3b1eea1af62744ac7f3a1a477fcd5e302a059adb
    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: c9306fac19a352269b759173ff4f9e39634b73ad
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: core-updates
          persist-credentials: false

      - name: Exact distribution scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C core-updates rev-parse HEAD)" = "$CORE_SHA"
          test "$(git -C core-updates rev-parse HEAD^)" = "$CORE_PARENT"
          test "$(git -C core-updates diff --name-only "$CORE_PARENT" "$CORE_SHA")" = "projects/S01-C02.json"
          echo OPS_121874_DISTRIBUTION_SCOPE=PASS

      - name: Manifest and sibling identity
        shell: bash
        run: |
          set -Eeuo pipefail
          m=core-updates/projects/S01-C02.json
          jq -e '.target_version=="1.21.874"
            and .release_tag=="v1.21.874"
            and .asset_name=="vf-tools-ops_V1.21.874.zip"
            and .asset_bytes==3430410
            and .asset_sha256=="0672c1aee4ea7e0e9e8bfe1ede6d100325cf1eea4cba26f547aaae41c9a092ab"
            and .runtime_file_count==953
            and .runtime_fingerprint_sha256=="5d6122986c51e01201929ee4b4a3cd71323ae05c7a4b5b3d98cf670105392c58"
            and .schema_from=="6.0.0"
            and .schema_to=="6.0.0"
            and .enabled==true' "$m" >/dev/null
          jq -e '.from_versions | index("1.21.873") != null and index("1.21.872") != null and index("1.21.861") == null' "$m" >/dev/null
          test "$(jq -r '.from_versions | length' "$m")" = "24"
          test "$(jq -r '.from_versions | unique | length' "$m")" = "24"
          test "$(jq -r '.target_version' core-updates/projects/S01-C01.json)" = "1.35.28"
          test "$(jq -r '.target_version' core-updates/projects/S01-C03.json)" = "1.25.32"
          echo OPS_121874_MANIFEST=PASS

      - name: Core contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd core-updates
          python3 scripts/check_manifest_contract.py
          php update-core/php/tests/run.php
          echo CORE_UPDATE_CONTRACTS=PASS

      - name: Authenticated asset readback
        shell: bash
        run: |
          set -Eeuo pipefail
          m=core-updates/projects/S01-C02.json
          repo="$(jq -r '.repository' "$m")"
          tag="$(jq -r '.release_tag' "$m")"
          asset="$(jq -r '.asset_name' "$m")"
          bytes="$(jq -r '.asset_bytes' "$m")"
          sha="$(jq -r '.asset_sha256' "$m")"
          curl -fsSL -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $VF_PRIVATE_READ_TOKEN" "https://api.github.com/repos/$repo/releases/tags/$tag" > /tmp/release.json
          aid="$(jq -r --arg n "$asset" '.assets[] | select(.name==$n) | .id' /tmp/release.json | head -n1)"
          test -n "$aid" && test "$aid" != null
          curl -fsSL -L -H 'Accept: application/octet-stream' -H "Authorization: Bearer $VF_PRIVATE_READ_TOKEN" "https://api.github.com/repos/$repo/releases/assets/$aid" -o "/tmp/$asset"
          test "$(stat -c '%s' "/tmp/$asset")" = "$bytes"
          test "$(sha256sum "/tmp/$asset" | awk '{print $1}')" = "$sha"
          unzip -tq "/tmp/$asset" >/dev/null
          unzip -p "/tmp/$asset" vf-ops/vf-ops.php | grep -Fq 'Version: 1.21.874'
          echo OPS_121874_PRIVATE_ASSET=PASS

      - name: Result
        run: echo PASS_S01_OPS_121874_DISTRIBUTION_GATE
