name: P01 V2.47.3 Navigation Tab Patch Prepare

on:
  pull_request:
    paths:
      - '.github/workflows/p01-v2473-candidate-gate.yml'

permissions:
  contents: read

concurrency:
  group: p01-v2473-navigation-tab-patch
  cancel-in-progress: false

jobs:
  prepare:
    if: github.head_ref == 'temp/p01-v2473-candidate-gate-20260909'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      BASE_SHA: a52bef9fa789f618a175c688b6e7b7891cd9a94f
      TARGET_BRANCH: fix/v2473-links-shared-tabs
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Exact authority and write capability
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$WRITE_TOKEN"
          test "$(GH_TOKEN="$WRITE_TOKEN" gh api "repos/${PRODUCT_REPO}" --jq '.permissions.push')" = true
          current="$(GH_TOKEN="$WRITE_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/main" --jq '.object.sha')"
          test "$current" = "$BASE_SHA" || { echo "PATCH_BLOCK=MAIN_DRIFT:${current}"; exit 82; }
          if GH_TOKEN="$WRITE_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/${TARGET_BRANCH}" >/dev/null 2>&1; then
            echo PATCH_BLOCK=TARGET_BRANCH_ALREADY_EXISTS
            exit 83
          fi
          echo P01_NAV_TAB_PATCH_AUTHORITY=PASS

      - name: Checkout exact P01 main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.BASE_SHA }}
          token: ${{ env.WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 2
          path: vf-start

      - name: Patch one shared-tab class and verify focused contract
        working-directory: vf-start
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/assets/admin-consolidation.js')
          s=p.read_text(encoding='utf-8')
          old="tabs.className='vf-links-workspace-tabs';"
          new="tabs.className='vf-admin-subnav vf-links-workspace-tabs';"
          if s.count(old) != 1:
              raise SystemExit(f'anchor_count={s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          test "$(git diff --name-only)" = 'src/assets/admin-consolidation.js'
          test "$(git diff --numstat | awk '{print $1":"$2}')" = '1:1'
          node --check src/assets/admin-consolidation.js
          php tests/unit/navigation_category_workspace_tabs_contract.php
          php tests/unit/navigation_row_action_hierarchy_contract.php
          echo P01_NAV_TAB_PATCH_GATE=PASS

      - name: Publish focused patch branch
        working-directory: vf-start
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'VictorForge Runner'
          git config user.email 'llhzx2018@users.noreply.github.com'
          git checkout -b "$TARGET_BRANCH"
          git add src/assets/admin-consolidation.js
          git commit -m 'Navigation: restore shared workspace tab styling'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          echo "P01_NAV_TAB_PATCH_SHA=$(git rev-parse HEAD)"

      - name: Cleanup private source
        if: always()
        shell: bash
        run: rm -rf vf-start
