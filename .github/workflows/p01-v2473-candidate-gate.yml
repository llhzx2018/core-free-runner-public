name: P01 V2.47.3 R3 Formal Candidate Gate
on:
  pull_request:
    paths: ['.github/workflows/p01-v2473-candidate-gate.yml']
permissions:
  contents: read
concurrency:
  group: p01-v2473-r3-formal-candidate
  cancel-in-progress: false
jobs:
  candidate:
    if: github.head_ref == 'temp/p01-v2473-candidate-gate-20260909'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      BASE_SHA: c2c2b5ed1ea7c3b2b98f9254a651ebadab711631
      SOURCE_TAG: v2.47.2
      SOURCE_VERSION: 2.47.2
      TARGET_VERSION: 2.47.3
      TARGET_BRANCH: release/v2.47.3-r3
      EXPECTED_SCHEMA: '2026090401'
      RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Exact live authority
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RELEASE_TOKEN"
          test "$(GH_TOKEN="$RELEASE_TOKEN" gh api "repos/${PRODUCT_REPO}" --jq '.permissions.pull')" = true
          test "$(GH_TOKEN="$RELEASE_TOKEN" gh api "repos/${PRODUCT_REPO}" --jq '.permissions.push')" = true
          current="$(GH_TOKEN="$RELEASE_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/main" --jq '.object.sha')"
          test "$current" = "$BASE_SHA" || { echo "RELEASE_BLOCK=MAIN_DRIFT:${current}"; exit 82; }
          if GH_TOKEN="$RELEASE_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/${TARGET_BRANCH}" >/dev/null 2>&1; then exit 83; fi
          echo P01_V2473_R3_LIVE_AUTHORITY=PASS
      - name: Checkout exact release base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.BASE_SHA }}
          token: ${{ env.RELEASE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          fetch-tags: true
          path: vf-start
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd
          coverage: none
      - name: Exact three-point release bind
        working-directory: vf-start
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "$(git rev-parse "$SOURCE_TAG^{commit}")" = d821f52729da9f4f454d6e81e2ff6dcf520e6b2f
          test "$(tr -d '\r\n ' < VERSION)" = "$SOURCE_VERSION"
          test "$(tr -d '\r\n ' < src/VERSION.txt)" = "$SOURCE_VERSION"
          grep -Fq "define('VF_VERSION', '$SOURCE_VERSION');" src/app/bootstrap.php
          printf '%s\n' "$TARGET_VERSION" > VERSION
          printf '%s\n' "$TARGET_VERSION" > src/VERSION.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/bootstrap.php'); s=p.read_text(encoding='utf-8')
          old="define('VF_VERSION', '2.47.2');"; new="define('VF_VERSION', '2.47.3');"
          if s.count(old)!=1: raise SystemExit('VF_VERSION anchor mismatch')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git diff --name-only | sort >/tmp/bind-files
          printf '%s\n' VERSION src/VERSION.txt src/app/bootstrap.php | sort >/tmp/bind-expected
          diff -u /tmp/bind-expected /tmp/bind-files
          test "$(git diff --numstat | awk '{a+=$1;d+=$2} END{print a":"d}')" = '3:3'
          echo P01_V2473_R3_BIND_EXACT=PASS
      - name: Schema migration and syntax
        working-directory: vf-start
        shell: bash
        run: |
          set -Eeuo pipefail
          schema="$(php -r '$p=json_decode(file_get_contents("VF_PROJECT.json"),true); echo $p["working_schema_version"];')"
          test "$schema" = "$EXPECTED_SCHEMA"
          test -z "$(git diff --name-only "$SOURCE_TAG" "$BASE_SHA" -- src/migrations VF_PROJECT.json)"
          find src -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
          while IFS= read -r -d '' f; do node --check "$f" >/dev/null; done < <(find src -type f -name '*.js' -print0)
          echo P01_V2473_R3_SCHEMA_SYNTAX=PASS
      - name: Every changed unit contract since V2.47.2
        working-directory: vf-start
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t tests < <(git diff --name-only "$SOURCE_TAG" "$BASE_SHA" -- 'tests/unit/*.php' | sort)
          test "${#tests[@]}" -gt 0
          for f in "${tests[@]}"; do echo "RUN_RELEASE_UNIT=$f"; php "$f"; done
          echo "P01_V2473_R3_CHANGED_UNITS=PASS count=${#tests[@]}"
      - name: Core integrations
        working-directory: vf-start
        shell: bash
        run: |
          set -Eeuo pipefail
          php tests/integration/p01_v2391_resource_groups_acceptance.php
          php tests/integration/p01_books_catalog_acceptance.php
          php tests/integration/p01_six_surface_authority_acceptance.php
          echo P01_V2473_R3_INTEGRATION=PASS
      - name: Fresh install CLI verify and HTTP smoke
        working-directory: vf-start
        shell: bash
        run: |
          set -Eeuo pipefail
          RUNTIME=/tmp/p01-v2473-r3-runtime; rm -rf "$RUNTIME"; cp -a src "$RUNTIME"; cd "$RUNTIME"
          php -S 127.0.0.1:18103 -t . >/tmp/r3-server.log 2>&1 & SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS -c /tmp/r3.cookies -b /tmp/r3.cookies http://127.0.0.1:18103/setup.php -o /tmp/r3-setup.html && break; sleep 1; done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/r3-setup.html',encoding='utf-8').read(); m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s); assert m; print(m.group(1))
          PY
          )
          PASS="Gate${GITHUB_RUN_ID}A9x"
          curl -fsS -c /tmp/r3.cookies -b /tmp/r3.cookies -X POST http://127.0.0.1:18103/setup.php --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=VF Start Candidate' --data-urlencode "admin_password=$PASS" --data-urlencode "admin_password_confirm=$PASS" -o /tmp/r3-post.html
          test -f app/.runtime.php
          php cli/verify.php | tee /tmp/r3-verify.txt
          grep -Fx 'VERIFY_PASS=YES' /tmp/r3-verify.txt
          for p in / /start.php /channels.php /watch.php /topics.php /courses.php /projects.php /tools.php /software.php; do test "$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:18103$p")" = 200; done
          kill "$SERVER_PID" 2>/dev/null || true; trap - EXIT
          echo P01_V2473_R3_FRESH_RUNTIME=PASS
      - name: Publish exact candidate
        working-directory: vf-start
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git diff --numstat | awk '{a+=$1;d+=$2} END{print a":"d}')" = '3:3'
          git config user.name 'VictorForge Release Runner'
          git config user.email 'llhzx2018@users.noreply.github.com'
          git checkout -b "$TARGET_BRANCH"
          git add VERSION src/VERSION.txt src/app/bootstrap.php
          git commit -m 'release(P01): bind V2.47.3 formal candidate'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          echo "P01_V2473_R3_CANDIDATE_SHA=$(git rev-parse HEAD)"
          echo P01_V2473_R3_CANDIDATE_PUBLISHED=PASS
      - name: Final verdict
        run: |
          echo P01_V2473_R3_FORMAL_CANDIDATE_GATE=PASS
          echo SCHEMA=2026090401
          echo MIGRATION=NONE
      - name: Cleanup
        if: always()
        run: rm -rf vf-start
