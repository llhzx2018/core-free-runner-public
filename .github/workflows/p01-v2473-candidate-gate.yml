name: P01 V2.47.3 R2 Bind Prepare

on:
  pull_request:
    paths:
      - '.github/workflows/p01-v2473-candidate-gate.yml'

permissions:
  contents: read

concurrency:
  group: p01-v2473-r2-bind-prepare
  cancel-in-progress: false

jobs:
  candidate:
    if: github.head_ref == 'temp/p01-v2473-candidate-gate-20260909'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      MAIN_SHA: ce0277891b3f99d7d2c6709d819f9f9a33bb9c96
      CANDIDATE_BRANCH: release/v2.47.3-r2
      TARGET_VERSION: 2.47.3
      SOURCE_VERSION: 2.47.2
      EXPECTED_SCHEMA: '2026090401'
      RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Require governed release capability
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RELEASE_TOKEN" || { echo 'CANDIDATE_BLOCK=VF_RELEASE_WRITE_TOKEN_MISSING'; exit 81; }
          test "$(GH_TOKEN="$RELEASE_TOKEN" gh api "repos/${PRODUCT_REPO}" --jq '.permissions.pull')" = true
          test "$(GH_TOKEN="$RELEASE_TOKEN" gh api "repos/${PRODUCT_REPO}" --jq '.permissions.push')" = true
          echo P01_RELEASE_CAPABILITY=PASS

      - name: Exact live main authority and clean target gate
        shell: bash
        run: |
          set -Eeuo pipefail
          current="$(GH_TOKEN="$RELEASE_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/main" --jq '.object.sha')"
          test "$current" = "$MAIN_SHA" || { echo "CANDIDATE_BLOCK=MAIN_DRIFT:${current}"; exit 82; }
          if GH_TOKEN="$RELEASE_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/${CANDIDATE_BRANCH}" >/dev/null 2>&1; then
            echo "CANDIDATE_BLOCK=TARGET_BRANCH_ALREADY_EXISTS:${CANDIDATE_BRANCH}"
            exit 83
          fi
          echo P01_V2473_R2_LIVE_AUTHORITY=PASS

      - name: Checkout exact V2.47.2 main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.MAIN_SHA }}
          token: ${{ env.RELEASE_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: vf-start

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd
          coverage: none

      - name: Bind exact three version authorities
        working-directory: vf-start
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$MAIN_SHA"
          test "$(tr -d '\r\n ' < VERSION)" = "$SOURCE_VERSION"
          test "$(tr -d '\r\n ' < src/VERSION.txt)" = "$SOURCE_VERSION"
          grep -Fq "define('VF_VERSION', '$SOURCE_VERSION');" src/app/bootstrap.php
          printf '%s\n' "$TARGET_VERSION" > VERSION
          printf '%s\n' "$TARGET_VERSION" > src/VERSION.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/bootstrap.php')
          text=p.read_text(encoding='utf-8')
          old="define('VF_VERSION', '2.47.2');"
          new="define('VF_VERSION', '2.47.3');"
          if text.count(old) != 1:
              raise SystemExit(f'VF_VERSION_SOURCE_COUNT={text.count(old)}')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          test "$(tr -d '\r\n ' < VERSION)" = "$TARGET_VERSION"
          test "$(tr -d '\r\n ' < src/VERSION.txt)" = "$TARGET_VERSION"
          grep -Fq "define('VF_VERSION', '$TARGET_VERSION');" src/app/bootstrap.php
          git diff --name-only | sort > /tmp/p01-v2473-files
          printf '%s\n' VERSION src/VERSION.txt src/app/bootstrap.php | sort > /tmp/p01-v2473-expected
          diff -u /tmp/p01-v2473-expected /tmp/p01-v2473-files
          test "$(git diff --numstat | awk '{a+=$1;d+=$2} END{print a":"d}')" = '3:3'
          echo P01_V2473_R2_BIND_DIFF_EXACT=PASS

      - name: Schema and migration boundary
        working-directory: vf-start
        shell: bash
        run: |
          set -Eeuo pipefail
          schema="$(python3 - <<'PY'
          import json
          print(str(json.load(open('VF_PROJECT.json',encoding='utf-8'))['working_schema_version']))
          PY
          )"
          test "$schema" = "$EXPECTED_SCHEMA"
          head_schema="$(python3 - <<'PY'
          import pathlib,re
          versions=[]
          for p in pathlib.Path('src/migrations').glob('*.php'):
              m=re.search(r"['\"]version['\"]\s*=>\s*['\"](\d+)['\"]",p.read_text(encoding='utf-8'))
              if not m: raise SystemExit(f'missing migration version: {p}')
              versions.append(m.group(1))
          if not versions: raise SystemExit('no migrations')
          print(sorted(versions)[-1])
          PY
          )"
          test "$head_schema" = "$EXPECTED_SCHEMA"
          test -z "$(git diff --name-only -- src/migrations VF_PROJECT.json)"
          echo P01_V2473_R2_SCHEMA_MIGRATION_BOUNDARY=PASS

      - name: Full PHP and JavaScript syntax
        working-directory: vf-start
        shell: bash
        run: |
          set -Eeuo pipefail
          find src -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/p01-v2473-r2-php-lint.log
          while IFS= read -r -d '' file; do node --check "$file" >/dev/null; done < <(find src -type f -name '*.js' -print0)
          echo P01_V2473_R2_SYNTAX=PASS

      - name: All focused unit contracts
        working-directory: vf-start
        shell: bash
        run: |
          set -Eeuo pipefail
          count=0
          while IFS= read -r -d '' test_file; do
            echo "RUN_UNIT=${test_file}"
            php "$test_file"
            count=$((count+1))
          done < <(find tests/unit -maxdepth 1 -type f -name '*.php' -print0 | sort -z)
          test "$count" -gt 0
          echo "P01_V2473_R2_UNIT_CONTRACTS=PASS count=${count}"

      - name: Core resource integration contracts
        working-directory: vf-start
        shell: bash
        run: |
          set -Eeuo pipefail
          php tests/integration/p01_v2391_resource_groups_acceptance.php
          php tests/integration/p01_books_catalog_acceptance.php
          php tests/integration/p01_six_surface_authority_acceptance.php
          echo P01_V2473_R2_CORE_INTEGRATION=PASS

      - name: Fresh install and runtime verify
        working-directory: vf-start
        shell: bash
        run: |
          set -Eeuo pipefail
          RUNTIME=/tmp/p01-v2473-r2-runtime
          rm -rf "$RUNTIME"
          cp -a src "$RUNTIME"
          cd "$RUNTIME"
          php -S 127.0.0.1:18103 -t . >/tmp/p01-v2473-r2-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS -c /tmp/p01-v2473-r2.cookies -b /tmp/p01-v2473-r2.cookies http://127.0.0.1:18103/setup.php -o /tmp/p01-v2473-r2-setup.html; then break; fi
            sleep 1
          done
          CSRF=$(python3 - <<'PY'
          import re
          text=open('/tmp/p01-v2473-r2-setup.html',encoding='utf-8').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',text)
          assert m,'setup csrf missing'
          print(m.group(1))
          PY
          )
          SETUP_KEY=$(python3 - <<'PY'
          import re
          text=open('/tmp/p01-v2473-r2-setup.html',encoding='utf-8').read()
          m=re.search(r'name="setup_key"\s+value="([^"]+)"',text)
          print(m.group(1) if m else '')
          PY
          )
          args=(--data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=VF Start V2.47.3 Candidate' --data-urlencode 'admin_password=CandidateGate!2026' --data-urlencode 'admin_password_confirm=CandidateGate!2026')
          if [ -n "$SETUP_KEY" ]; then args+=(--data-urlencode "setup_key=$SETUP_KEY"); fi
          curl -fsS -c /tmp/p01-v2473-r2.cookies -b /tmp/p01-v2473-r2.cookies -X POST http://127.0.0.1:18103/setup.php "${args[@]}" -o /tmp/p01-v2473-r2-setup-post.html
          test -f app/.runtime.php
          php cli/verify.php | tee /tmp/p01-v2473-r2-verify.txt
          grep -Fx 'VERIFY_PASS=YES' /tmp/p01-v2473-r2-verify.txt
          for path in / /start.php /channels.php /watch.php /topics.php /courses.php /projects.php /tools.php /software.php; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:18103${path}")"
            test "$code" = 200 || { echo "HTTP_FAIL path=${path} code=${code}"; exit 91; }
          done
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
          echo P01_V2473_R2_FRESH_RUNTIME=PASS

      - name: Commit and publish exact candidate branch
        working-directory: vf-start
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --name-only | sort > /tmp/p01-v2473-r2-final-files
          printf '%s\n' VERSION src/VERSION.txt src/app/bootstrap.php | sort > /tmp/p01-v2473-r2-final-expected
          diff -u /tmp/p01-v2473-r2-final-expected /tmp/p01-v2473-r2-final-files
          test "$(git diff --numstat | awk '{a+=$1;d+=$2} END{print a":"d}')" = '3:3'
          git config user.name 'VictorForge Release Runner'
          git config user.email 'llhzx2018@users.noreply.github.com'
          git add VERSION src/VERSION.txt src/app/bootstrap.php
          git commit -m 'Release: bind V2.47.3 exact source'
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          git remote set-url origin "https://x-access-token:${RELEASE_TOKEN}@github.com/${PRODUCT_REPO}.git"
          git push origin "HEAD:refs/heads/${CANDIDATE_BRANCH}"
          remote="$(GH_TOKEN="$RELEASE_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/${CANDIDATE_BRANCH}" --jq '.object.sha')"
          test "$remote" = "$CANDIDATE_SHA"
          echo "P01_V2473_R2_CANDIDATE_SHA=${CANDIDATE_SHA}"
          echo P01_V2473_R2_CANDIDATE_PUBLISHED=PASS

      - name: Final R2 verdict
        shell: bash
        run: |
          echo 'P01_V2473_R2_BIND_PREPARE=PASS'
          echo 'SCHEMA=2026090401'
          echo 'MIGRATION=NONE'

      - name: Cleanup private source
        if: always()
        shell: bash
        run: rm -rf vf-start
