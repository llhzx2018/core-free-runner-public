name: P01 V2.47.3 Formal Publish

on:
  pull_request:
    paths:
      - '.github/workflows/p01-v2473-candidate-gate.yml'

permissions:
  contents: read

concurrency:
  group: p01-v2473-formal-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.head_ref == 'temp/p01-v2473-candidate-gate-20260909'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      UPDATES_REPO: llhzx2018/core-updates
      FORMAL_SHA: 62c3edc7178a01b1204811856a8fb7ca2b19ae21
      BIND_CANDIDATE_SHA: 638afa4b22f800708227c260231b2c83a3c41827
      BASELINE_SHA: d821f52729da9f4f454d6e81e2ff6dcf520e6b2f
      VERSION: 2.47.3
      SOURCE_VERSION: 2.47.2
      SCHEMA: '2026090401'
      TAG: v2.47.3
      OUT: /tmp/p01-v2473-formal-artifacts
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Require registered private read capability
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN" || { echo 'PUBLISH_BLOCK=VF_PRIVATE_READ_TOKEN_MISSING'; exit 81; }
          echo P01_PRIVATE_READ_CAPABILITY=PASS

      - name: Checkout exact V2.47.3 Formal Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.FORMAL_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: formal

      - name: Checkout exact passed V2.47.3 Bind Candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.BIND_CANDIDATE_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: candidate

      - name: Checkout exact V2.47.2 Formal baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.BASELINE_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: baseline

      - name: Checkout proven V2.47.0 artifact helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 1dd635d8e8d4485736458672fb7a5be397d94f89
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: helper

      - name: Checkout proven artifact template
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 0439b0df027ae0bc6c21a8dbf91b066a564130f9
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: template

      - name: Checkout proven Atomic primitives
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 0468b28ae57c368f80b03f85060318667bcc5834
          persist-credentials: false
          fetch-depth: 1
          path: proven

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd
          coverage: none

      - name: Adapt proven V2.47.0 Formal Artifact Gate
        shell: bash
        run: |
          set -Eeuo pipefail
          cp helper/scripts/_tmp_p01_v2470_formal_artifact_gate.sh /tmp/p01-v2473-formal-artifact-gate.sh
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/p01-v2473-formal-artifact-gate.sh')
          s=p.read_text(encoding='utf-8')
          replacements=[
            ('7f3492f70276d83efed371296d69709c1e991350','62c3edc7178a01b1204811856a8fb7ca2b19ae21'),
            ('b70971514ccf1c6b8f3793bfc5a2200cad47dfe9','638afa4b22f800708227c260231b2c83a3c41827'),
            ('1bd95e8777e72f6cd89206ddb9daf934ad4e6b9e','d821f52729da9f4f454d6e81e2ff6dcf520e6b2f'),
            ('33993725218','34341062705'),
            ('BIND_PR=416','BIND_PR=722'),
            ('OWNER_AUTHORIZED_V2470_RELEASE_CHAIN_20260906','OWNER_AUTHORIZED_V2473_POST_RELEASE_UX_REFINEMENT_20260909'),
            ('V2470','V2473'),
            ('v2470','v2473'),
          ]
          for old,new in replacements:
              if old not in s:
                  raise SystemExit('missing V2.47.0 gate anchor: '+old)
              s=s.replace(old,new)
          s=s.replace('2.47.0','__P01_TARGET__').replace('2.46.4','2.47.2').replace('__P01_TARGET__','2.47.3')
          old="src=src.replace(\"'release_type':'patch'\",\"'release_type':'minor'\")"
          if old not in s:
              raise SystemExit('release type anchor missing')
          s=s.replace(old,"src=src.replace('V2.46.1 之后 Consolidated L2 Product Optimization 的正式发布版本。','V2.47.2 之后持续 UX / UI 与日常工作流精修的维护发布。')",1)
          p.write_text(s,encoding='utf-8')
          PY
          chmod +x /tmp/p01-v2473-formal-artifact-gate.sh
          grep -Fq 'FORMAL_SHA=62c3edc7178a01b1204811856a8fb7ca2b19ae21' /tmp/p01-v2473-formal-artifact-gate.sh
          grep -Fq 'CANDIDATE_SHA=638afa4b22f800708227c260231b2c83a3c41827' /tmp/p01-v2473-formal-artifact-gate.sh
          grep -Fq 'SOURCE_SHA=d821f52729da9f4f454d6e81e2ff6dcf520e6b2f' /tmp/p01-v2473-formal-artifact-gate.sh
          grep -Fq "test \"\$(cat formal/VERSION)\" = '2.47.3'" /tmp/p01-v2473-formal-artifact-gate.sh
          grep -Fq "test \"\$(cat baseline/VERSION)\" = '2.47.2'" /tmp/p01-v2473-formal-artifact-gate.sh
          ! grep -Fq "'release_type':'minor'" /tmp/p01-v2473-formal-artifact-gate.sh
          echo P01_V2473_GATE_ADAPTATION=PASS

      - name: Rebuild and verify exact V2.47.3 Formal assets
        shell: bash
        run: |
          set -Eeuo pipefail
          diff -qr baseline/src/migrations formal/src/migrations
          echo P01_V2473_MIGRATION_DIRECTORY_EQUIVALENCE=PASS
          bash /tmp/p01-v2473-formal-artifact-gate.sh
          test "$(find "$OUT" -maxdepth 1 -type f | wc -l | tr -d ' ')" = 8
          jq -e '.version=="2.47.3" and .source_version=="2.47.2" and .schema=="2026090401" and .source_schema=="2026090401" and .formal_source=="62c3edc7178a01b1204811856a8fb7ca2b19ae21"' "$OUT/P01-V2.47.3-FORMAL.json" >/dev/null
          (cd "$OUT" && sha256sum -c VF-Start-V2.47.3-FULL.zip.sha256 && sha256sum -c VF_Start_V2.47.3_UPDATE.zip.sha256 && sha256sum -c repair-v2.47.3.php.sha256)
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os
          root=Path(os.environ['OUT'])
          expected={
            'P01-V2.47.3-FORMAL.json','P01-V2.47.3-RELEASE-NOTES.md',
            'VF-Start-V2.47.3-FULL.zip','VF-Start-V2.47.3-FULL.zip.sha256',
            'VF_Start_V2.47.3_UPDATE.zip','VF_Start_V2.47.3_UPDATE.zip.sha256',
            'repair-v2.47.3.php','repair-v2.47.3.php.sha256',
          }
          got={p.name for p in root.iterdir() if p.is_file()}
          assert got==expected, {'expected':sorted(expected),'got':sorted(got)}
          for p in sorted(root.iterdir()):
              if p.is_file(): print(f'LOCAL_ASSET={p.name}|{p.stat().st_size}|{hashlib.sha256(p.read_bytes()).hexdigest()}')
          PY
          echo P01_V2473_FORMAL_ARTIFACT_EXACT=PASS

      - name: Require registered release write capability
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN" || { echo 'PUBLISH_BLOCK=VF_RELEASE_WRITE_TOKEN_MISSING'; exit 82; }
          test "$(gh api "repos/${PRODUCT_REPO}" --jq '.permissions.push')" = true || exit 83
          test "$(gh api "repos/${UPDATES_REPO}" --jq '.permissions.push')" = true || exit 84
          echo P01_RELEASE_WRITE_CAPABILITY=PASS

      - name: Pre-mutation exact authority gate
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api "repos/${PRODUCT_REPO}/git/ref/heads/main" --jq '.object.sha')" = "$FORMAL_SHA"
          gh api "repos/${UPDATES_REPO}/contents/projects/P01.json?ref=main" --jq '.content' | tr -d '\n' | base64 -d > /tmp/p01-current.json
          jq -e '.project_id=="P01" and .component_id=="APP" and .target_version=="2.47.2" and .release_tag=="v2.47.2" and .product_identity=="d821f52729da9f4f454d6e81e2ff6dcf520e6b2f"' /tmp/p01-current.json >/dev/null
          if gh api "repos/${PRODUCT_REPO}/git/ref/tags/${TAG}" > /tmp/p01-existing-tag.json 2>/dev/null; then
            test "$(jq -r '.object.sha' /tmp/p01-existing-tag.json)" = "$FORMAL_SHA"
          fi
          if gh api "repos/${PRODUCT_REPO}/releases/tags/${TAG}" > /tmp/p01-existing-release.json 2>/dev/null; then
            test "$(jq -r '.draft' /tmp/p01-existing-release.json)" = false
            test "$(jq -r '.prerelease' /tmp/p01-existing-release.json)" = false
          fi
          echo P01_V2473_PREMUTATION_AUTHORITY=PASS

      - name: Create exact tag and immutable private Release or adopt exact existing Release
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! gh api "repos/${PRODUCT_REPO}/git/ref/tags/${TAG}" >/tmp/p01-tag.json 2>/dev/null; then
            gh api --method POST "repos/${PRODUCT_REPO}/git/refs" -f ref="refs/tags/${TAG}" -f sha="$FORMAL_SHA" > /tmp/p01-tag.json
          fi
          test "$(jq -r '.object.sha' /tmp/p01-tag.json)" = "$FORMAL_SHA"
          if gh release view "$TAG" --repo "$PRODUCT_REPO" >/dev/null 2>&1; then
            READBACK=/tmp/p01-existing-release-assets
            rm -rf "$READBACK" && mkdir -p "$READBACK"
            gh release download "$TAG" --repo "$PRODUCT_REPO" --dir "$READBACK"
            LOCAL="$OUT" REMOTE="$READBACK" python3 - <<'PY'
          from pathlib import Path
          import hashlib, os
          local=Path(os.environ['LOCAL']); remote=Path(os.environ['REMOTE'])
          expected=sorted(p.name for p in local.iterdir() if p.is_file()); got=sorted(p.name for p in remote.iterdir() if p.is_file())
          assert expected==got
          for name in expected:
              a,b=local/name,remote/name
              assert a.stat().st_size==b.stat().st_size and hashlib.sha256(a.read_bytes()).digest()==hashlib.sha256(b.read_bytes()).digest()
          print('EXISTING_RELEASE_EXACT_BYTES=PASS')
          PY
          else
            gh release create "$TAG" "$OUT"/* --repo "$PRODUCT_REPO" --title 'VF Start V2.47.3' --notes-file "$OUT/P01-V2.47.3-RELEASE-NOTES.md" --verify-tag
          fi
          echo P01_V2473_RELEASE_IDENTITY=PASS

      - name: Independent read-only Tag and 8-Asset Remote Readback
        env:
          GH_TOKEN: ${{ env.PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api "repos/${PRODUCT_REPO}/git/ref/tags/${TAG}" --jq '.object.sha')" = "$FORMAL_SHA"
          gh api "repos/${PRODUCT_REPO}/releases/tags/${TAG}" > /tmp/p01-v2473-release.json
          test "$(jq -r '.draft' /tmp/p01-v2473-release.json)" = false
          test "$(jq -r '.prerelease' /tmp/p01-v2473-release.json)" = false
          rm -rf /tmp/p01-v2473-remote && mkdir -p /tmp/p01-v2473-remote
          gh release download "$TAG" --repo "$PRODUCT_REPO" --dir /tmp/p01-v2473-remote
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          local=Path(os.environ['OUT']); remote=Path('/tmp/p01-v2473-remote')
          expected=sorted(p.name for p in local.iterdir() if p.is_file()); got=sorted(p.name for p in remote.iterdir() if p.is_file())
          assert len(expected)==8 and expected==got
          for name in expected:
              a,b=local/name,remote/name
              assert a.stat().st_size==b.stat().st_size
              assert hashlib.sha256(a.read_bytes()).hexdigest()==hashlib.sha256(b.read_bytes()).hexdigest()
          formal=json.loads((remote/'P01-V2.47.3-FORMAL.json').read_text(encoding='utf-8'))
          assert formal['version']=='2.47.3' and formal['source_version']=='2.47.2' and formal['schema']=='2026090401' and formal['formal_source']==os.environ['FORMAL_SHA']
          print('REMOTE_RELEASE_8_ASSET_BYTE_IDENTITY=PASS')
          PY
          RELEASE_ID="$(jq -r '.id' /tmp/p01-v2473-release.json)"
          RELEASED_AT="$(jq -r '.published_at' /tmp/p01-v2473-release.json)"
          UPDATE_ASSET_ID="$(jq -r '.assets[]|select(.name=="VF_Start_V2.47.3_UPDATE.zip")|.id' /tmp/p01-v2473-release.json)"
          UPDATE_BYTES="$(stat -c %s "$OUT/VF_Start_V2.47.3_UPDATE.zip")"
          UPDATE_SHA="$(sha256sum "$OUT/VF_Start_V2.47.3_UPDATE.zip" | awk '{print $1}')"
          FULL_BYTES="$(stat -c %s "$OUT/VF-Start-V2.47.3-FULL.zip")"
          FULL_SHA="$(sha256sum "$OUT/VF-Start-V2.47.3-FULL.zip" | awk '{print $1}')"
          REPAIR_BYTES="$(stat -c %s "$OUT/repair-v2.47.3.php")"
          REPAIR_SHA="$(sha256sum "$OUT/repair-v2.47.3.php" | awk '{print $1}')"
          printf 'RELEASE_ID=%s\nRELEASED_AT=%s\nUPDATE_ASSET_ID=%s\nUPDATE_BYTES=%s\nUPDATE_SHA=%s\nFULL_BYTES=%s\nFULL_SHA=%s\nREPAIR_BYTES=%s\nREPAIR_SHA=%s\n' "$RELEASE_ID" "$RELEASED_AT" "$UPDATE_ASSET_ID" "$UPDATE_BYTES" "$UPDATE_SHA" "$FULL_BYTES" "$FULL_SHA" "$REPAIR_BYTES" "$REPAIR_SHA" >> "$GITHUB_ENV"
          echo P01_V2473_REMOTE_RELEASE_READBACK=PASS

      - name: Publish exact core-updates P01 manifest
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/${UPDATES_REPO}/contents/projects/P01.json?ref=main" > /tmp/p01-core-current-api.json
          OLD_BLOB="$(jq -r '.sha' /tmp/p01-core-current-api.json)"
          jq -r '.content' /tmp/p01-core-current-api.json | tr -d '\n' | base64 -d > /tmp/p01-core-current.json
          jq -e '.target_version=="2.47.2" and .release_tag=="v2.47.2" and .product_identity=="d821f52729da9f4f454d6e81e2ff6dcf520e6b2f"' /tmp/p01-core-current.json >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import json, os
          d=json.loads(Path('/tmp/p01-core-current.json').read_text(encoding='utf-8'))
          d.update({
            'current_version':'2.47.2','target_version':'2.47.3','update_type':'ATOMIC','from_versions':['2.47.2'],
            'schema_from':'2026090401','schema_to':'2026090401','repository':'llhzx2018/vf-start','release_tag':'v2.47.3',
            'release_id':int(os.environ['RELEASE_ID']),'product_identity':os.environ['FORMAL_SHA'],'asset_name':'VF_Start_V2.47.3_UPDATE.zip',
            'asset_bytes':int(os.environ['UPDATE_BYTES']),'asset_sha256':os.environ['UPDATE_SHA'],'backup_required':True,'rollback_supported':True,
            'released_at':os.environ['RELEASED_AT'],'minimum_php':'8.0.0',
            'notes':('P01 · VF Start V2.47.3 持续 UX / UI 与日常工作流精修正式在线升级通道。严格只允许 V2.47.2 → V2.47.3；Schema 2026090401 不变，Migration NONE。'
                     f'Formal Source {os.environ["FORMAL_SHA"]}；Formal Artifact、Fresh Install、V2.47.2 → V2.47.3 Atomic Upgrade、数据保持、SQLite/Schema/CLI/Multi Surface、GitHub Release 8 Asset 远端字节回读全部 PASS（Runner Run {os.environ.get("GITHUB_RUN_ID","")}）。'
                     f'canonical UPDATE 为 VF_Start_V2.47.3_UPDATE.zip，Asset ID {os.environ["UPDATE_ASSET_ID"]}，{os.environ["UPDATE_BYTES"]} bytes，sha256:{os.environ["UPDATE_SHA"]}。backup_required=true，rollback_supported=true。')
          })
          Path('/tmp/P01-v2473.json').write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          jq -e --arg sha "$FORMAL_SHA" --arg update_sha "$UPDATE_SHA" --argjson rid "$RELEASE_ID" --argjson bytes "$UPDATE_BYTES" '.current_version=="2.47.2" and .target_version=="2.47.3" and .from_versions==["2.47.2"] and .schema_from=="2026090401" and .schema_to=="2026090401" and .release_tag=="v2.47.3" and .product_identity==$sha and .asset_name=="VF_Start_V2.47.3_UPDATE.zip" and .asset_bytes==$bytes and .asset_sha256==$update_sha and .release_id==$rid' /tmp/P01-v2473.json >/dev/null
          CONTENT_B64="$(base64 -w0 /tmp/P01-v2473.json)"
          gh api --method PUT "repos/${UPDATES_REPO}/contents/projects/P01.json" -f message='release(P01): publish VF Start V2.47.3 update channel' -f content="$CONTENT_B64" -f sha="$OLD_BLOB" -f branch=main > /tmp/p01-core-update-write.json
          CORE_UPDATES_COMMIT="$(jq -r '.commit.sha' /tmp/p01-core-update-write.json)"
          echo "CORE_UPDATES_COMMIT=$CORE_UPDATES_COMMIT" >> "$GITHUB_ENV"
          echo P01_V2473_CORE_UPDATES_WRITE=PASS

      - name: Independent core-updates remote readback
        env:
          GH_TOKEN: ${{ env.PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/${UPDATES_REPO}/contents/projects/P01.json?ref=main" --jq '.content' | tr -d '\n' | base64 -d > /tmp/p01-core-readback.json
          jq -e --arg sha "$FORMAL_SHA" --arg update_sha "$UPDATE_SHA" --argjson rid "$RELEASE_ID" --argjson bytes "$UPDATE_BYTES" '.current_version=="2.47.2" and .target_version=="2.47.3" and .from_versions==["2.47.2"] and .schema_from=="2026090401" and .schema_to=="2026090401" and .release_tag=="v2.47.3" and .product_identity==$sha and .asset_name=="VF_Start_V2.47.3_UPDATE.zip" and .asset_bytes==$bytes and .asset_sha256==$update_sha and .release_id==$rid' /tmp/p01-core-readback.json >/dev/null
          echo P01_V2473_CORE_UPDATES_REMOTE_READBACK=PASS

      - name: Build public-safe formal publication evidence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-v2473-public-evidence
          jq -n --arg formal_source "$FORMAL_SHA" --arg tag "$TAG" --arg release_id "${RELEASE_ID:-}" --arg released_at "${RELEASED_AT:-}" --arg update_asset_id "${UPDATE_ASSET_ID:-}" --arg update_sha "${UPDATE_SHA:-}" --arg update_bytes "${UPDATE_BYTES:-}" --arg full_sha "${FULL_SHA:-}" --arg full_bytes "${FULL_BYTES:-}" --arg repair_sha "${REPAIR_SHA:-}" --arg repair_bytes "${REPAIR_BYTES:-}" --arg core_updates_commit "${CORE_UPDATES_COMMIT:-}" --arg run_id "$GITHUB_RUN_ID" '{schema:"p01-formal-publication-evidence/v1",project_id:"P01",version:"2.47.3",source_version:"2.47.2",schema_version:"2026090401",migration:"NONE",formal_source:$formal_source,tag:$tag,release_id:$release_id,released_at:$released_at,update_asset_id:$update_asset_id,assets:{update:{sha256:$update_sha,bytes:$update_bytes},full:{sha256:$full_sha,bytes:$full_bytes},repair:{sha256:$repair_sha,bytes:$repair_bytes}},core_updates_commit:$core_updates_commit,runner_run_id:$run_id,private_source_persisted:false,production_write:false}' > /tmp/p01-v2473-public-evidence/P01-V2.47.3-FORMAL-PUBLICATION-EVIDENCE.json

      - name: Upload public-safe publication evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: P01-V2.47.3-FORMAL-PUBLICATION-EVIDENCE-${{ github.run_id }}
          path: /tmp/p01-v2473-public-evidence/P01-V2.47.3-FORMAL-PUBLICATION-EVIDENCE.json
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup private source and formal assets
        if: always()
        shell: bash
        run: rm -rf formal candidate baseline helper template proven /tmp/p01-v2473-formal-artifacts /tmp/p01-v2473-remote
