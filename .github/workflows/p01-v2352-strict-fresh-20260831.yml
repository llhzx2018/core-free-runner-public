name: P01 V2.35.2 Strict Fresh Install Fence

on:
  push:
    branches: [release/p01-v2352-strict-fresh-20260831]
    paths: [.github/workflows/p01-v2352-strict-fresh-20260831.yml]

permissions:
  actions: read
  contents: read

jobs:
  strict-fresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FORMAL_RUN: '33347322224'
      FORMAL_ARTIFACT: p01-v2352-formal-artifacts-33347322224
      FORMAL_SOURCE: 3c9239be8bba34637411110f7fdb43f6e494c880
      FORMAL_TREE: 5d179443e215879259e3b5560c5e3c0342c2149b
      RUNTIME_TREE: f000f39c1a2cf48296a4c165726323dabaf5e37c
      FORMAL_DIGEST: sha256:94c13fc54833a0e5bfd8efb80a59f2419fb9b5e979b380c0d0d2e221e4546b58
      ART: /tmp/p01-v2352-formal-download
      FRESH: /tmp/p01-v2352-strict-fresh
      EVID: /tmp/p01-v2352-strict-fresh-evidence
      PORT: '18448'
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none

      - name: Download exact Formal Artifact Gate bytes
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.FORMAL_ARTIFACT }}
          path: ${{ env.ART }}
          repository: llhzx2018/core-free-runner-public
          run-id: ${{ env.FORMAL_RUN }}
          github-token: ${{ github.token }}

      - name: Verify formal byte set and clean FULL package
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$FRESH" "$EVID"; mkdir -p "$FRESH" "$EVID"
          test -f "$ART/VF-Start-V2.35.2-FULL.zip"
          test -f "$ART/VF_Start_V2.35.2_UPDATE.zip"
          test -f "$ART/VF-Start-V2.35.2-UPDATE.zip"
          test -f "$ART/repair-v2.35.2.php"
          test -f "$ART/SHA256SUMS.txt"
          test -f "$ART/P01-V2.35.2-FORMAL-METADATA.json"
          test -f "$ART/P01-V2.35.2-ARTIFACT-GATE.json"
          test -f "$ART/atomic-self-test.json"
          (cd "$ART" && sha256sum -c SHA256SUMS.txt)
          test "$(jq -r .release_source "$ART/P01-V2.35.2-FORMAL-METADATA.json")" = "$FORMAL_SOURCE"
          test "$(jq -r .release_tree "$ART/P01-V2.35.2-FORMAL-METADATA.json")" = "$FORMAL_TREE"
          test "$(jq -r .runtime_tree "$ART/P01-V2.35.2-FORMAL-METADATA.json")" = "$RUNTIME_TREE"
          unzip -q "$ART/VF-Start-V2.35.2-FULL.zip" -d "$FRESH"
          test "$(cat "$FRESH/VERSION.txt")" = '2.35.2'
          test "$(jq -r .version "$FRESH/release-manifest.json")" = '2.35.2'
          test "$(jq -r .release_type "$FRESH/release-manifest.json")" = 'formal'
          test "$(jq -r .release_source_commit "$FRESH/release-manifest.json")" = "$FORMAL_SOURCE"
          test "$(jq -r .runtime_source_tree "$FRESH/release-manifest.json")" = "$RUNTIME_TREE"
          test "$(jq -r .runtime_data_included "$FRESH/release-manifest.json")" = 'false'
          if find "$FRESH" -maxdepth 2 \( -name '.vfnav-data*' -o -name '*.sqlite' -o -name '*.db' -o -name '*.log' \) -print | grep -q .; then echo FULL_NOT_CLEAN; exit 20; fi
          find "$FRESH" -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          node --check "$FRESH/assets/update-core.js"
          printf 'P01_V2352_STRICT_FORMAL_BYTES=PASS\nFORMAL_RUN=%s\nFORMAL_ARTIFACT_DIGEST=%s\n' "$FORMAL_RUN" "$FORMAL_DIGEST" | tee "$EVID/bytes.txt"

      - name: Strict first install from exact FULL bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          COOKIE="$EVID/fresh.cookies"
          php -S 127.0.0.1:$PORT -t "$FRESH" >"$EVID/server.log" 2>&1 & echo $! >/tmp/p01-v2352-strict.pid
          for i in $(seq 1 60); do curl -fsS -c "$COOKIE" -b "$COOKIE" http://127.0.0.1:$PORT/setup.php -o "$EVID/setup.html" && break; sleep .25; done
          CSRF=$(python3 - "$EVID/setup.html" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST http://127.0.0.1:$PORT/setup.php --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=V2352 Strict Fresh' --data-urlencode 'admin_password=V2352Strict!2026' --data-urlencode 'admin_password_confirm=V2352Strict!2026' -o "$EVID/setup-post.html"
          php "$FRESH/cli/verify.php" | tee "$EVID/verify.txt" | grep -Fx VERIFY_PASS=YES
          php "$FRESH/cli/surface-verify.php" | tee "$EVID/surface.txt" | grep -Fx CURRENT_DOMAIN_PASS=YES
          ROOT="$FRESH" php <<'PHP' | tee "$EVID/clean-data.txt"
          <?php
          require getenv('ROOT').'/app/bootstrap.php';$db=vf_db();
          foreach(['categories','links','import_batches','backup_records','operation_history'] as $t){$n=(int)$db->query('SELECT COUNT(*) FROM '.$t)->fetchColumn();if($n!==0){fwrite(STDERR,$t.'='.$n."\n");exit(10);}}
          if(strtolower((string)$db->query('PRAGMA integrity_check')->fetchColumn())!=='ok')exit(11);
          if($db->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC))exit(12);
          echo "P01_V2352_STRICT_CLEAN_DATA=PASS\n";
          PHP
          for u in '/' '/surfaces.php?domain=start' '/surfaces.php?domain=channels' '/surfaces.php?domain=watch' '/surfaces.php?domain=topics' '/update.php'; do code=$(curl -sS -o /dev/null -w '%{http_code}' -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:$PORT$u"); test "$code" = 200; done
          printf 'P01_V2352_STRICT_FRESH=PASS\nVERSION=2.35.2\nSCHEMA=2026082901\nOWNER_PRODUCTION_WRITE=NO\n' | tee "$EVID/verdict.txt"

      - name: Upload strict fresh evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2352-strict-fresh-${{ github.run_id }}
          path: ${{ env.EVID }}
          if-no-files-found: error
          retention-days: 30

      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/p01-v2352-strict.pid 2>/dev/null)" 2>/dev/null || true
