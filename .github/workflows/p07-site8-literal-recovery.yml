name: P07 site8 private literal recovery synthetic exact-source proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-site8-literal-recovery.yml'
      - 'experiments/p07-site8-literal-recovery/**'
permissions:
  contents: read
jobs:
  literal-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact pinned product source and isolated overlay
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(cat dist/p07/0.1.0/overlay/BUILD_ID)" = 0.1.0-release112
          test "$(git hash-object experiments/p07-site8-literal-recovery/lib/private_conflict_preservation.py)" = 8ab17d9d8bb1ca66f3574acc1f056c675c405a81
          test "$(git hash-object experiments/p07-site8-literal-recovery/lib/private_sql_literal_reconcile.py)" = 9c616f31ab9e8f07816ed69a1fc2ddc3711ab852
          test "$(git hash-object experiments/p07-site8-literal-recovery/lib/migration_recovery_rehearsal.py)" = 4726bdfb7ad4e2e2f9691f89a53c30c15acff138
          test "$(git hash-object experiments/p07-site8-literal-recovery/tests/test_private_sql_literal_reconcile.py)" = 1fee1cc5522f75a884ba3a11a9cf5bc7bd773765
          test "$(git hash-object experiments/p07-site8-literal-recovery/tests/test_private_conflict_preservation.py)" = cd7649d77254dbf3528246ac302d74ce42b99c30
          cp -a dist/p07/0.1.0/overlay "$RUNNER_TEMP/p07-site8-literal"
          for p in lib/private_conflict_preservation.py lib/private_sql_literal_reconcile.py lib/migration_recovery_rehearsal.py tests/test_private_sql_literal_reconcile.py tests/test_private_conflict_preservation.py; do
            cp "experiments/p07-site8-literal-recovery/$p" "$RUNNER_TEMP/p07-site8-literal/$p"
          done
          cd "$RUNNER_TEMP/p07-site8-literal"
          python3 -m py_compile lib/private_conflict_preservation.py lib/private_sql_literal_reconcile.py lib/migration_recovery_rehearsal.py tests/test_private_sql_literal_reconcile.py
          echo P07_SITE8_LITERAL_EXACT_BYTES_PASS
      - name: Synthetic verified backups and read-only original preservation
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/p07-site8-literal"
          PYTHONPATH=lib python3 -m unittest -v \
            tests.test_private_sql_literal_reconcile \
            tests.test_private_conflict_preservation
          echo P07_SITE8_LITERAL_SYNTHETIC_PASS
      - name: Existing SQL guard and non-destructive migration protections
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/p07-site8-literal"
          PYTHONPATH=lib python3 -m unittest -q \
            tests.test_private_recovery_gate \
            tests.test_sql_pk_conflict_evidence \
            tests.test_sql_row_evidence \
            tests.test_migration_no_overwrite_resume
          for p in lib/cloudpanel.py lib/restore_apply_core.py lib/server_migration.py lib/server_migration_pull.py lib/package_core.py BUILD_ID; do
            test "$(git hash-object "$GITHUB_WORKSPACE/dist/p07/0.1.0/overlay/$p")" = "$(git hash-object "$p")"
          done
          echo P07_SITE8_LITERAL_DB_WRITERS_UNCHANGED_PASS
