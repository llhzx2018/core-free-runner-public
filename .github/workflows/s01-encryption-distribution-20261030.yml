name: S01 theme distribution independent verification
on:
  push:
    branches: [task/s01-encryption-proof-20261030]
    paths: ['.github/workflows/s01-encryption-distribution-20261030.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: 462a7b85b47887dd180cadc45d424fb7b263a463
          persist-credentials: false
      - name: Exact distribution contract and native CI tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 462a7b85b47887dd180cadc45d424fb7b263a463
          python3 scripts/check_manifest_contract.py
          php -v
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PY'
          import json
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']=='1.35.218' and m['release_tag']=='v1.35.218'
          assert m['asset_name']=='vf-tools-theme_V1.35.218.zip'
          assert m['asset_sha256']=='dc59368826dfdc7c0ff3a58996c9e0a9d00cdae9e7a7cf290c6db0fbf0053d69'
          assert m['asset_bytes']==2026260 and m['runtime_files']==476
          assert all(x in m['from_versions'] for x in ['1.35.216','1.35.217'])
          print('S01_THEME_MANIFEST_EXACT_PASS')
          PY
