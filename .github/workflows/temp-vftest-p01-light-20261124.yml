name: VFTEST P01 LIGHT isolated PHP Vue evidence
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/temp-vftest-p01-light-20261124.yml]
permissions:
  contents: read
concurrency:
  group: vf-test-p01-light-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  p01-light-source-and-interface:
    name: VFTEST-P01-LIGHT-PHP-VUE
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'test/vftest-p01-light-')
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Transient exact P01 private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-startnew
          ref: a37927c5b2ecb0372816adfb53aef17d0d575611
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-src
      - name: Verify exact unchanged development commit
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C private-src rev-parse HEAD)" = "a37927c5b2ecb0372816adfb53aef17d0d575611"
          test "$(cat private-src/VERSION)" = "0.1.0-dev"
          echo VFTEST_P01_SOURCE_SHA=a37927c5b2ecb0372816adfb53aef17d0d575611
          echo VFTEST_P01_COMMIT_MATCH=PASS
      - name: Existing read-only P01 structural checkers
        shell: bash
        working-directory: private-src
        run: |
          set -Eeuo pipefail
          set +x
          for checker in check_bootstrap check_dependency_lock check_delivery_plan check_visual_identity; do
            if ! python3 "scripts/${checker}.py" >"$RUNNER_TEMP/p01-vftest-${checker}.log" 2>&1; then
              echo "VFTEST_P01_SOURCE_CHECK_FAILED=${checker}"
              exit 1
            fi
          done
          echo VFTEST_P01_SOURCE_CHECKERS=4_PASS
      - name: Set up pinned Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: npm lockfile, real Vue TS typecheck and Vite build
        shell: bash
        working-directory: private-src
        run: |
          set -Eeuo pipefail
          set +x
          if ! npm ci --no-audit --no-fund --no-progress --quiet >"$RUNNER_TEMP/p01-vftest-npm-install.log" 2>&1; then
            echo VFTEST_P01_NPM_INSTALL=FAIL; exit 1
          fi
          echo VFTEST_P01_NPM_INSTALL=PASS
          if ! npm run typecheck >"$RUNNER_TEMP/p01-vftest-typescript.log" 2>&1; then
            echo VFTEST_P01_TYPESCRIPT=FAIL; exit 1
          fi
          echo VFTEST_P01_TYPESCRIPT=PASS
          if ! npm run build >"$RUNNER_TEMP/p01-vftest-vite.log" 2>&1; then
            echo VFTEST_P01_VITE_BUILD=FAIL; exit 1
          fi
          test -f public/build/manifest.json || { echo VFTEST_P01_VITE_MANIFEST=MISSING; exit 1; }
          echo VFTEST_P01_VITE_BUILD=PASS
          echo VFTEST_P01_VITE_MANIFEST=PASS
      - name: PHP 8.4 Laravel runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_sqlite,sqlite3,zip,sodium,dom,xml,fileinfo,curl,openssl
          tools: composer:v2
          coverage: none
      - name: Synthetic-only unit and Inertia page contract tests
        working-directory: private-src
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          if ! composer install --no-interaction --prefer-dist --no-progress --quiet >"$RUNNER_TEMP/p01-vftest-composer.log" 2>&1; then
            echo VFTEST_P01_COMPOSER=FAIL; exit 1
          fi
          echo VFTEST_P01_COMPOSER=PASS
          export APP_ENV=testing DB_CONNECTION=sqlite DB_DATABASE=:memory:
          export APP_KEY="base64:$(openssl rand -base64 32)"
          export CACHE_STORE=array SESSION_DRIVER=array QUEUE_CONNECTION=sync
          export VF_INSTALL_DEV_CLAIM_ENABLED=false
          set +e
          ./vendor/bin/phpunit --log-junit "$RUNNER_TEMP/p01-vftest-junit.xml" \
            tests/Unit/ReleaseSourcePolicyTest.php \
            tests/Unit/NewAtomicPackageInspectorTest.php \
            tests/Feature/InertiaPagePathContractTest.php \
            >"$RUNNER_TEMP/p01-vftest-phpunit.log" 2>&1
          code=$?
          set -e
          if ! python3 - "$RUNNER_TEMP/p01-vftest-junit.xml" <<'PY'
          import pathlib, sys, re, xml.etree.ElementTree as ET
          p=pathlib.Path(sys.argv[1])
          if not p.is_file():
              print('VFTEST_P01_JUNIT=MISSING')
              sys.exit(1)
          cases=list(ET.parse(p).getroot().iter('testcase'))
          skipped=sum(c.find('skipped') is not None for c in cases)
          failed=sum(c.find('failure') is not None or c.find('error') is not None for c in cases)
          assertions=sum(int(c.get('assertions','0')) for c in cases)
          print('VFTEST_P01_JUNIT='+','.join(map(str,(len(cases),assertions,skipped,failed))))
          for c in cases:
              if c.find('failure') is not None or c.find('error') is not None:
                  print('VFTEST_P01_FAILED_METHOD='+re.sub('[^A-Za-z0-9_]', '',c.get('name',''))[:110])
          if len(cases)<12 or skipped or failed or assertions<30: sys.exit(1)
          PY
          then
            echo VFTEST_P01_JUNIT_CHECK=FAIL
            exit 1
          fi
          if [ "$code" -ne 0 ]; then echo VFTEST_P01_PHPUNIT=FAIL; exit "$code"; fi
          echo VFTEST_P01_PHPUNIT=PASS
      - name: Always scrub private source and logs
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- private-src
          rm -f -- "$RUNNER_TEMP"/p01-vftest-*
          test ! -e private-src
          echo VFTEST_P01_PRIVATE_SOURCE_SCRUB=PASS
