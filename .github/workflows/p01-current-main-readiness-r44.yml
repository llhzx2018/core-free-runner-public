name: P01 Current Main Readiness R44

on:
  push:
    branches:
      - temp/p01-current-main-readiness-r44-20260920
    paths:
      - '.github/workflows/p01-current-main-readiness-r44.yml'

permissions:
  contents: read

jobs:
  exact-source-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      P01_SHA: e4c2fac6a473ad93b33ac6d9a5b14eb5e6c85e6c
      P01_RELEASE_BASELINE_SHA: 3394e056ce9c0f6ba3667a67a8bc5ae1c4c513b0
      P01_SCHEMA: '2026090401'
    steps:
      - name: Verify private-read capability
        shell: bash
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "${PRIVATE_READ_TOKEN:-}"
          echo 'VF_PRIVATE_READ_TOKEN_PRESENT=YES'

      - name: Checkout exact P01 source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.P01_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: target

      - name: Checkout released V2.47.38 baseline transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.P01_RELEASE_BASELINE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: baseline

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd
          coverage: none

      - name: Exact source identity and syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$P01_SHA"
          VERSION="$(tr -d '\r\n' < target/VERSION)"
          test "$VERSION" = "$(tr -d '\r\n' < target/src/VERSION.txt)"
          grep -F "define('VF_VERSION', '$VERSION');" target/src/app/bootstrap.php >/dev/null
          python3 - <<'PY'
          import json
          p=json.load(open('target/VF_PROJECT.json',encoding='utf-8'))
          assert p['project_id']=='P01'
          assert str(p['working_schema_version'])=='2026090401'
          PY
          find target/src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find target/src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          echo "P01_CURRENT_EXACT_SOURCE=$P01_SHA"
          echo "P01_CURRENT_VERSION=$VERSION"
          echo 'P01_CURRENT_SYNTAX=PASS'

      - name: R15-R47 changed-scope contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd target
          tests=(
            tests/unit/admin_backend_closure_contract.php
            tests/unit/admin_browser_helper_r15_contract.php
            tests/unit/admin_data_closure_contract.php
            tests/unit/admin_overview_actionable_health_contract.php
            tests/unit/admin_overview_ia_contract.php
            tests/unit/admin_settings_focus_contract.php
            tests/unit/navigation_category_header_contract.php
            tests/unit/admin_duplicates_r21_contract.php
            tests/unit/admin_eyebrow_shadow_config_r37_contract.php
            tests/unit/admin_group_single_authority_r39_contract.php
            tests/unit/admin_navigation_consistency_contract.php
            tests/unit/admin_overview_r20_contract.php
            tests/unit/admin_overview_r29_special_capabilities_contract.php
            tests/unit/admin_plugins_dead_nav_r40_contract.php
            tests/unit/admin_plugins_r17_contract.php
            tests/unit/admin_retired_routes_css_r32_contract.php
            tests/unit/admin_secondary_nav_focus_contract.php
            tests/unit/admin_settings_nav_r19_contract.php
            tests/unit/admin_system_baseline_r25_contract.php
            tests/unit/admin_system_health_r18_contract.php
            tests/unit/admin_system_info_r22_contract.php
            tests/unit/admin_transfer_r16_contract.php
            tests/unit/admin_update_credential_r27_contract.php
            tests/unit/admin_update_r26_contract.php
            tests/unit/admin_workbench_copy_r41_contract.php
            tests/unit/admin_workbench_shadow_config_r38_contract.php
            tests/unit/release_authority_r44_contract.php
          )
          failures=0
          for test_file in "${tests[@]}"; do
            if php "$test_file" >/dev/null 2>&1; then
              :
            else
              echo "CURRENT_SCOPE_FAIL=$test_file"
              failures=$((failures+1))
            fi
          done
          echo "P01_CURRENT_SCOPE_TEST_COUNT=${#tests[@]}"
          echo "P01_CURRENT_SCOPE_FAILURE_COUNT=$failures"
          test "$failures" -eq 0
          echo 'P01_CURRENT_SCOPE_CONTRACTS=PASS'

      - name: Current unit inventory sweep
        shell: bash
        run: |
          set -Eeuo pipefail
          cd target
          count=0
          failures=0
          : >/tmp/p01-current-unit-failures.txt
          while IFS= read -r test_file; do
            count=$((count+1))
            if php "$test_file" >/dev/null 2>&1; then
              :
            else
              failures=$((failures+1))
              echo "$test_file" >>/tmp/p01-current-unit-failures.txt
            fi
          done < <(find tests/unit -maxdepth 1 -type f -name '*.php' | sort)
          test "$count" -gt 300
          echo "P01_CURRENT_UNIT_TEST_COUNT=$count"
          echo "P01_CURRENT_UNIT_FAILURE_COUNT=$failures"
          if [ "$failures" -eq 0 ]; then
            echo 'P01_CURRENT_UNIT_INVENTORY=PASS'
          else
            echo 'P01_CURRENT_UNIT_INVENTORY=DEBT_PRESENT'
            sed 's#^#UNIT_DEBT=#' /tmp/p01-current-unit-failures.txt
          fi
          echo "$failures" >/tmp/p01-current-unit-failure-count

      - name: Released baseline unit inventory comparison
        shell: bash
        run: |
          set -Eeuo pipefail
          cd baseline
          count=0
          failures=0
          : >/tmp/p01-baseline-unit-failures.txt
          while IFS= read -r test_file; do
            count=$((count+1))
            if php "$test_file" >/dev/null 2>&1; then
              :
            else
              failures=$((failures+1))
              echo "$test_file" >>/tmp/p01-baseline-unit-failures.txt
            fi
          done < <(find tests/unit -maxdepth 1 -type f -name '*.php' | sort)
          echo "P01_RELEASE_BASELINE_UNIT_TEST_COUNT=$count"
          echo "P01_RELEASE_BASELINE_UNIT_FAILURE_COUNT=$failures"
          echo "$failures" >/tmp/p01-baseline-unit-failure-count

          sort -u /tmp/p01-current-unit-failures.txt >/tmp/p01-current-unit-failures.sorted.txt
          sort -u /tmp/p01-baseline-unit-failures.txt >/tmp/p01-baseline-unit-failures.sorted.txt
          comm -23 /tmp/p01-current-unit-failures.sorted.txt /tmp/p01-baseline-unit-failures.sorted.txt >/tmp/p01-new-unit-failures.txt
          comm -13 /tmp/p01-current-unit-failures.sorted.txt /tmp/p01-baseline-unit-failures.sorted.txt >/tmp/p01-resolved-unit-failures.txt
          new_count="$(wc -l </tmp/p01-new-unit-failures.txt | tr -d ' ')"
          resolved_count="$(wc -l </tmp/p01-resolved-unit-failures.txt | tr -d ' ')"
          echo "P01_UNIT_NEW_FAILURE_COUNT=$new_count"
          echo "P01_UNIT_RESOLVED_FAILURE_COUNT=$resolved_count"
          if [ "$new_count" -gt 0 ]; then
            sed 's#^#NEW_UNIT_FAILURE=#' /tmp/p01-new-unit-failures.txt
          fi
          echo "$new_count" >/tmp/p01-new-unit-failure-count

      - name: Repository canonical release regression gate
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          bash target/tests/canonical_release_regression.sh target baseline

      - name: Fresh install and runtime verification
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          RUNTIME=/tmp/p01-current-readiness-runtime
          rm -rf "$RUNTIME" /tmp/p01-current-readiness.cookies /tmp/p01-current-readiness-admin.cookies
          cp -a target/src "$RUNTIME"
          cd "$RUNTIME"
          php -S 127.0.0.1:18144 -t . >/tmp/p01-current-readiness-server.log 2>&1 &
          SERVER_PID=$!
          echo "$SERVER_PID" >/tmp/p01-current-readiness.pid
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          READY=0
          for i in $(seq 1 40); do
            if curl -fsS -c /tmp/p01-current-readiness.cookies -b /tmp/p01-current-readiness.cookies http://127.0.0.1:18144/setup.php -o /tmp/p01-current-readiness-setup.html; then
              READY=1
              break
            fi
            sleep 1
          done
          test "$READY" = 1

          CSRF=$(python3 - <<'PY'
          import re
          text=open('/tmp/p01-current-readiness-setup.html',encoding='utf-8').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',text)
          assert m,'setup csrf missing'
          print(m.group(1))
          PY
          )

          curl -fsS -c /tmp/p01-current-readiness.cookies -b /tmp/p01-current-readiness.cookies             -X POST http://127.0.0.1:18144/setup.php             --data-urlencode "setup_csrf=$CSRF"             --data-urlencode 'site_title=P01 Current Readiness'             --data-urlencode 'admin_password=CurrentReadiness!2026'             --data-urlencode 'admin_password_confirm=CurrentReadiness!2026'             -o /tmp/p01-current-readiness-setup-post.html

          test -f app/.runtime.php
          php cli/verify.php | tee /tmp/p01-current-readiness-verify.txt
          grep -Fx 'VERIFY_PASS=YES' /tmp/p01-current-readiness-verify.txt

          php cli/baseline-verify.php | tee /tmp/p01-current-readiness-baseline.txt
          grep -Fx 'BASELINE_CORE_PASS=YES' /tmp/p01-current-readiness-baseline.txt
          grep -Fx 'DRIFT_COUNT=0' /tmp/p01-current-readiness-baseline.txt
          grep -Fx 'UNKNOWN_COUNT=0' /tmp/p01-current-readiness-baseline.txt

          if [ -f cli/surface-verify.php ]; then
            php cli/surface-verify.php | tee /tmp/p01-current-readiness-surface.txt
            grep -Fx 'MULTI_SURFACE_PASS=YES' /tmp/p01-current-readiness-surface.txt
            grep -Fx "WORKING_SCHEMA=$P01_SCHEMA" /tmp/p01-current-readiness-surface.txt
          fi

          LOGIN_CODE=$(curl -sS -c /tmp/p01-current-readiness-admin.cookies -b /tmp/p01-current-readiness-admin.cookies             -o /tmp/p01-current-readiness-login.json -w '%{http_code}'             -H 'Content-Type: application/json'             -X POST 'http://127.0.0.1:18144/api.php?action=login'             --data '{"password":"CurrentReadiness!2026"}')
          test "$LOGIN_CODE" = 200
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/p01-current-readiness-login.json',encoding='utf-8'))
          assert data.get('ok') is True,data
          PY

          for page in             manage.php surface-manager.php links-admin.php health.php duplicates.php recycle-bin.php             transfer.php browser-helper.php data-safety.php system-health.php plugins.php system-info.php             system-baseline.php update.php settings.php; do
            code=$(curl -sS -c /tmp/p01-current-readiness-admin.cookies -b /tmp/p01-current-readiness-admin.cookies               -o "/tmp/p01-current-${page//\//_}.html" -w '%{http_code}' "http://127.0.0.1:18144/$page")
            test "$code" = 200
            grep -F 'data-vf-admin-shell="server"' "/tmp/p01-current-${page//\//_}.html" >/dev/null
          done

          curl -fsS -c /tmp/p01-current-readiness-admin.cookies -b /tmp/p01-current-readiness-admin.cookies             http://127.0.0.1:18144/manage.php -o /tmp/p01-current-manage.html
          grep -F 'href="browser-helper.php"' /tmp/p01-current-manage.html >/dev/null
          grep -F '>浏览器助手<' /tmp/p01-current-manage.html >/dev/null
          grep -F 'href="update.php"' /tmp/p01-current-manage.html >/dev/null
          grep -F '>在线升级<' /tmp/p01-current-manage.html >/dev/null

          echo 'P01_CURRENT_FRESH_INSTALL=PASS'
          echo 'P01_CURRENT_ADMIN_HTTP=PASS'
          echo 'P01_CURRENT_RUNTIME_BASELINE=PASS'

      - name: Synthetic browser UA UI gate
        shell: bash
        run: |
          set -Eeuo pipefail
          RUNTIME=/tmp/p01-current-readiness-runtime
          test -f "$RUNTIME/app/.runtime.php"

          php -S 127.0.0.1:18145 -t "$RUNTIME" >/tmp/p01-browser-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18145/manage.php -o /dev/null; then
              break
            fi
            sleep 1
          done

          BROWSER_DIR=/tmp/p01-browser-gate
          rm -rf "$BROWSER_DIR"
          mkdir -p "$BROWSER_DIR"
          cd "$BROWSER_DIR"
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.57.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null

          cat > gate.mjs <<'JS'
          import { chromium } from 'playwright';

          const base='http://127.0.0.1:18145/';
          const viewports=[
            {name:'390',width:390,height:844},
            {name:'768',width:768,height:1024},
            {name:'1024',width:1024,height:768},
            {name:'1440',width:1440,height:900},
            {name:'1920',width:1920,height:1080},
          ];
          const pages=[
            ['manage.php','overview'],
            ['surface-manager.php','resources'],
            ['surface-manager.php?advanced=1','resources'],
            ['links-admin.php','resources'],
            ['health.php','resources'],
            ['duplicates.php','resources'],
            ['recycle-bin.php','resources'],
            ['transfer.php','data'],
            ['data-safety.php','data'],
            ['browser-helper.php','browser'],
            ['system-health.php','system'],
            ['plugins.php','system'],
            ['system-info.php','system'],
            ['system-baseline.php','system'],
            ['update.php','update'],
            ['settings.php','settings'],
          ];
          const expectedTop=[
            {label:'概览',href:'manage.php'},
            {label:'资源',href:'surface-manager.php'},
            {label:'数据',href:'transfer.php'},
            {label:'浏览器助手',href:'browser-helper.php'},
            {label:'系统',href:'system-health.php'},
            {label:'在线升级',href:'update.php'},
            {label:'设置',href:'settings.php'},
          ];

          const browser=await chromium.launch({headless:true});
          let checked=0;
          try{
            for(const vp of viewports){
              const context=await browser.newContext({viewport:{width:vp.width,height:vp.height}});
              const login=await context.request.post(base+'api.php?action=login',{
                data:{password:'CurrentReadiness!2026'}
              });
              if(login.status()!==200) throw new Error('login failed viewport='+vp.name+' status='+login.status());
              const loginJson=await login.json();
              if(!loginJson?.ok) throw new Error('login response not ok viewport='+vp.name);

              for(const [route,group] of pages){
                const page=await context.newPage();
                const pageErrors=[];
                const consoleErrors=[];
                page.on('pageerror',err=>pageErrors.push(String(err?.message||err)));
                page.on('console',msg=>{if(msg.type()==='error')consoleErrors.push(msg.text());});

                const response=await page.goto(base+route,{waitUntil:'networkidle',timeout:30000});
                if(!response || response.status()!==200) throw new Error(route+' HTTP '+(response?.status()??'NO_RESPONSE')+' viewport='+vp.name);
                await page.waitForTimeout(150);

                const shell=await page.locator('body').getAttribute('data-vf-admin-shell');
                const actualGroup=await page.locator('body').getAttribute('data-vf-group');
                if(shell!=='server') throw new Error(route+' shell='+shell+' viewport='+vp.name);
                if(actualGroup!==group) throw new Error(route+' group='+actualGroup+' expected='+group+' viewport='+vp.name);

                const geometry=await page.evaluate(()=>({
                  width:window.innerWidth,
                  scrollWidth:document.documentElement.scrollWidth,
                  bodyScrollWidth:document.body.scrollWidth
                }));
                if(geometry.scrollWidth>geometry.width+2 || geometry.bodyScrollWidth>geometry.width+2){
                  throw new Error(route+' document-overflow viewport='+vp.name+' '+JSON.stringify(geometry));
                }

                const activeTop=await page.locator('.vf-rail-section > .vf-rail-item.active').count();
                if(activeTop!==1) throw new Error(route+' active-top-count='+activeTop+' viewport='+vp.name);

                if(route==='manage.php'){
                  const top=await page.locator('.vf-rail-section > .vf-rail-item').evaluateAll(nodes=>nodes.map(a=>({
                    label:(a.querySelector('span')?.textContent||'').trim(),
                    href:(a.getAttribute('href')||'').trim()
                  })));
                  if(JSON.stringify(top)!==JSON.stringify(expectedTop)){
                    throw new Error('top-nav mismatch viewport='+vp.name+' actual='+JSON.stringify(top));
                  }

                  if(vp.width===390){
                    await page.locator('.vf-admin-menu-button').click();
                    const opened=await page.locator('body').evaluate(el=>el.classList.contains('vf-rail-open'));
                    if(!opened) throw new Error('mobile rail did not open');
                    await page.keyboard.press('Escape');
                    const closed=await page.locator('body').evaluate(el=>!el.classList.contains('vf-rail-open'));
                    if(!closed) throw new Error('mobile rail did not close with Escape');
                  }
                }

                if(pageErrors.length) throw new Error(route+' pageerror viewport='+vp.name+' '+pageErrors.join(' | '));
                if(consoleErrors.length) throw new Error(route+' console-error viewport='+vp.name+' '+consoleErrors.join(' | '));

                checked++;
                await page.close();
              }
              await context.close();
            }
          } finally {
            await browser.close();
          }

          console.log('P01_UI_EVIDENCE_VIEWPORTS=390,768,1024,1440,1920');
          console.log('P01_UI_SCENE_CHECK_COUNT='+checked);
          console.log('P01_UI_TOP_LEVEL_NAV=PASS');
          console.log('P01_UI_SPECIAL_CAPABILITIES=PASS');
          console.log('P01_UI_DOCUMENT_OVERFLOW=PASS');
          console.log('P01_UI_CONSOLE_PAGEERROR=PASS');
          console.log('P01_UI_MOBILE_RAIL=PASS');
          console.log('P01_SYNTHETIC_BROWSER_UA_UI=PASS');
          JS

          node gate.mjs

      - name: No-schema-delta fence from released baseline
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C baseline rev-parse HEAD)" = "$P01_RELEASE_BASELINE_SHA"
          test "$(python3 - <<'PY'
          import json
          current=json.load(open('target/VF_PROJECT.json',encoding='utf-8'))
          baseline=json.load(open('baseline/VF_PROJECT.json',encoding='utf-8'))
          assert str(current['working_schema_version'])=='2026090401'
          assert str(baseline['working_schema_version'])=='2026090401'
          print(current['working_schema_version'])
          PY
          )" = "$P01_SCHEMA"
          diff -qr baseline/src/migrations target/src/migrations >/tmp/p01-migration-diff.txt || {
            cat /tmp/p01-migration-diff.txt
            echo 'UNEXPECTED_MIGRATION_DELTA' >&2
            exit 1
          }
          echo 'P01_CURRENT_SCHEMA_DELTA=NONE'
          echo 'P01_CURRENT_MACHINE_READINESS=PASS'
          echo 'RELEASE=NO'
          echo 'TAG=NO'
          echo 'DISTRIBUTION=NO'
          echo 'PRODUCTION=NO'

      - name: Machine preflight verdict
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          current_failures="$(cat /tmp/p01-current-unit-failure-count 2>/dev/null || echo 999)"
          baseline_failures="$(cat /tmp/p01-baseline-unit-failure-count 2>/dev/null || echo 999)"
          new_failures="$(cat /tmp/p01-new-unit-failure-count 2>/dev/null || echo 999)"
          echo "P01_CURRENT_UNIT_DEBT_COUNT=$current_failures"
          echo "P01_RELEASE_BASELINE_UNIT_DEBT_COUNT=$baseline_failures"
          echo "P01_NEW_UNIT_REGRESSION_COUNT=$new_failures"
          if [ "$new_failures" -ne 0 ]; then
            echo 'P01_MACHINE_PREFLIGHT=FAIL_NEW_UNIT_REGRESSION'
            exit 1
          fi
          echo 'P01_CURRENT_DELTA_REGRESSION=PASS'
          if [ "$current_failures" -ne 0 ]; then
            echo 'P01_LEGACY_TEST_DEBT=DEBT_PRESENT'
          else
            echo 'P01_LEGACY_TEST_DEBT=NONE'
          fi
          echo 'P01_MACHINE_PREFLIGHT=PASS'
          echo 'OWNER_PREVIEW_RUNTIME=NOT_RUN'
          echo 'OWNER_REAL_USE=NOT_RUN'
          echo 'P01_FORMAL_RELEASE_READY=NO'
          echo 'RELEASE=NO'
          echo 'TAG=NO'
          echo 'DISTRIBUTION=NO'
          echo 'PRODUCTION=NO'

      - name: Cleanup private checkout
        if: always()
        shell: bash
        run: |
          rm -rf target baseline /tmp/p01-current-readiness-runtime
          rm -f /tmp/p01-current-readiness* /tmp/p01-current-*.html /tmp/p01-*-unit-*.txt /tmp/p01-migration-diff.txt
          echo 'P01_PRIVATE_SOURCE_CLEANUP=PASS'
