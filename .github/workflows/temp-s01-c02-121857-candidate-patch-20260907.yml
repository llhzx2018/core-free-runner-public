name: S01 C02 1.21.857 Candidate Patch
on:
  push:
    branches:
      - temp/s01-final-ux-candidate-patch-20260907
    paths:
      - .github/workflows/temp-s01-c02-121857-candidate-patch-20260907.yml
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-24.04
    env:
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      REPO: llhzx2018/vf-tools-ops
      BRANCH: ux/s01-c02-pages-tools-human-closure-121857-20260907
      MAIN_SHA: 1ac24e55e7e21e1d02154a6fd6c96ac814f377b3
      HEAD_SHA: 1ac24e55e7e21e1d02154a6fd6c96ac814f377b3
    steps:
      - name: Candidate-only boundary, patch and gate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WRITE_TOKEN"
          echo 'MAIN_WRITE_USED=NO'
          echo 'RELEASE_WRITE_USED=NO'
          echo 'PRODUCTION_WRITE_USED=NO'
          git clone -q "https://x-access-token:${WRITE_TOKEN}@github.com/${REPO}.git" repo
          cd repo
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"
          git checkout -q "$BRANCH"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          python3 - <<'PY'
          from pathlib import Path

          def one(path, old, new):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'EXACT_REPLACE_FAIL {path} count={n}: {old[:100]}')
              p.write_text(s.replace(old, new, 1))

          one('VERSION', '1.21.856\n', '1.21.857\n')
          one('vf-ops.php', ' * Version: 1.21.856', ' * Version: 1.21.857')
          one('vf-ops.php', "VF_OPS_VERSION', '1.21.856'", "VF_OPS_VERSION', '1.21.857'")
          one('vf-ops.php', "VF_OPS_ROUND', 'S01-DASHBOARD-SELECTOR-HIT'", "VF_OPS_ROUND', 'S01-PAGES-TOOLS-HUMAN-CLOSURE'")
          one('assets/css/current/admin-s01-console-v2.css',
              ' * Final visual owner. 1.21.856 closes the real dashboard selector gap.',
              ' * Final visual owner. 1.21.857 keeps the real dashboard owner and closes Pages & Tools default-language noise.')
          one('includes/admin-v13/views/dashboard.php',
              "defined('VF_OPS_VERSION') ? VF_OPS_VERSION : '1.21.856'",
              "defined('VF_OPS_VERSION') ? VF_OPS_VERSION : '1.21.857'")

          p = 'includes/views/admin-operations-console-pages.php'
          one(p,
              '集中查看公开页面、工具页、内容对象和组件依赖。这里只做轻量状态判断与责任分流，不扫描其他组件源码，也不自动访问前台。',
              '集中查看公开页面、工具页、内容对象和相关功能是否可用；优先处理会影响前台访问或内容维护的问题。')
          one(p,
              '状态来自 WordPress 页面对象、主题路径规则和工具功能可用性；未访问前台页面，不代表线上已经通过。',
              '这里根据当前页面、主题入口和工具状态判断是否可以继续验收；线上结果仍以真实前台验收为准。')
          one(p,
              '主题页面信息或工具信息当前不可用。VF Tools Ops 不会扫描源码补猜结果。',
              '主题页面信息或工具信息当前不可用。请先确认相关功能已加载，再返回这里查看。')
          one(p,
              '<th>页面与路径</th><th>范围</th><th>负责组件</th><th>当前状态</th><th>页面内容</th><th>处理入口</th>',
              '<th>页面与路径</th><th>范围</th><th>维护位置</th><th>当前状态</th><th>页面内容</th><th>处理入口</th>')
          one(p,
              r'''echo '<td data-label="负责组件"><strong>'.esc_html((string)$row['ownerLabel']).'</strong><small>'.esc_html((string)$row['expected']).'</small></td>';'''.replace('\\"','"'),
              r'''echo '<td data-label="维护位置"><strong>'.esc_html((string)$row['ownerLabel']).'</strong><small>'.esc_html((string)$row['expected']).'</small></td>';'''.replace('\\"','"'))
          one(p,
              r'''echo '<td data-label="页面内容"><strong>'.esc_html(vf_ops_v11_human_status_label_v121853((string)$row['contentStatus'])).'</strong><small>'.esc_html((string)$row['contentType']).' · 短代码 '.esc_html((string)$row['shortcode']).'</small><small class="vf-pt-v2-title">'.esc_html((string)$row['title']).'</small></td>';'''.replace('\\"','"'),
              r'''echo '<td data-label="页面内容" data-content-type="'.esc_attr((string)$row['contentType']).'" data-shortcode="'.esc_attr((string)$row['shortcode']).'"><strong>'.esc_html(vf_ops_v11_human_status_label_v121853((string)$row['contentStatus'])).'</strong><small class="vf-pt-v2-title">'.esc_html((string)$row['title']).'</small></td>';'''.replace('\\"','"'))
          one(p,
              '<span>正式内容类型</span><h2>内容对象是否可运营</h2><p>这里只统计状态和数量，不读取正文。</p>',
              '<span>内容类型</span><h2>内容是否可以正常管理</h2><p>这里只显示各类内容的可用状态和数量，不展开正文。</p>')
          one(p,
              r'''echo '<div><span><strong>'.esc_html((string)$row['type']).'</strong><code>'.esc_html((string)$row['postType']).'</code></span><span class="vf-pt-v2-type-stats">'''.replace('\\"','"'),
              r'''echo '<div data-post-type="'.esc_attr((string)$row['postType']).'"><span><strong>'.esc_html((string)$row['type']).'</strong></span><span class="vf-pt-v2-type-stats">'''.replace('\\"','"'))
          one(p,
              '<span>组件状态</span><h2>缺失时明确提示，不假定通过</h2><p>这里只读取其他 VF 组件公开提供的状态，不读取其私有数据。</p>',
              '<span>相关功能</span><h2>相关工具是否已经接通</h2><p>如果相关工具功能尚未就绪，这里会直接提示，并保留明确的处理方向。</p>')

          for path in ['tests/admin-human-language-contract.php','tests/visible-console-v2-contract.php','tests/update-refresh-policy-current-contract.php']:
              q = Path(path)
              s = q.read_text()
              if '1.21.856' not in s or 'S01-DASHBOARD-SELECTOR-HIT' not in s:
                  raise SystemExit('VERSION_ROUND_CONTRACT_NOT_FOUND ' + path)
              s = s.replace('1.21.856','1.21.857').replace('S01-DASHBOARD-SELECTOR-HIT','S01-PAGES-TOOLS-HUMAN-CLOSURE')
              q.write_text(s)

          t = 'tests/admin-human-language-contract.php'
          one(t,
              "'pages_owner' => str_contains($pages, '<th>负责组件</th>'),",
              "'pages_owner' => str_contains($pages, '<th>维护位置</th>'),")
          one(t,
              "'pages_content' => str_contains($pages, '<th>页面内容</th>'),",
              "'pages_content' => str_contains($pages, '<th>页面内容</th>'),\n    'pages_intro_human' => str_contains($pages, '优先处理会影响前台访问或内容维护的问题'),\n    'pages_empty_human' => str_contains($pages, '请先确认相关功能已加载，再返回这里查看'),\n    'pages_related_function_human' => str_contains($pages, '相关工具是否已经接通'),")

          Path('tests/pages-tools-human-closure-contract.php').write_text(r'''<?php
          $root = dirname(__DIR__);
          $pages = (string) file_get_contents($root . '/includes/views/admin-operations-console-pages.php');
          $css = (string) file_get_contents($root . '/assets/css/current/admin-s01-console-v2.css');
          $cut = strpos($pages, '<details class="vf-pt-v2-panel vf-pt-v2-professional">');
          if ($cut === false) { fwrite(STDERR, "FAIL_PROFESSIONAL_BOUNDARY_MISSING\n"); exit(1); }
          $default = substr($pages, 0, $cut);
          $required = [
              '集中查看公开页面、工具页、内容对象和相关功能是否可用',
              '优先处理会影响前台访问或内容维护的问题',
              '线上结果仍以真实前台验收为准',
              '<th>维护位置</th>',
              'data-label="维护位置"',
              'data-shortcode=',
              'data-content-type=',
              'data-post-type=',
              '内容是否可以正常管理',
              '相关工具是否已经接通',
          ];
          foreach ($required as $text) {
              if (!str_contains($default, $text)) { fwrite(STDERR, "FAIL_REQUIRED_PAGES_TOOLS_HUMAN:$text\n"); exit(1); }
          }
          $forbidden = [
              '责任分流',
              '不扫描其他组件源码',
              '不会扫描源码补猜结果',
              ' · 短代码 ',
              "<strong>'.esc_html((string)\$row['type']).'</strong><code>",
          ];
          foreach ($forbidden as $text) {
              if (str_contains($default, $text)) { fwrite(STDERR, "FAIL_DEFAULT_ENGINEERING_COPY:$text\n"); exit(1); }
          }
          foreach (['$row[\'shortcode\']','$row[\'contentType\']','$row[\'postType\']','vf_ops_v11_human_status_label_v121853'] as $token) {
              if (!str_contains($pages, $token)) { fwrite(STDERR, "FAIL_INTERNAL_DIAGNOSTIC_PRESERVATION:$token\n"); exit(1); }
          }
          foreach (['vf-pt-v2-page-head','vf-pt-v2-filterbar','vf-pt-v2-table-wrap','vf-pt-v2-secondary-grid'] as $class) {
              if (!str_contains($pages, $class) || !str_contains($css, '.' . $class)) { fwrite(STDERR, "FAIL_FINAL_OWNER_SELECTOR_HIT:$class\n"); exit(1); }
          }
          echo "PASS_OPS_PAGES_TOOLS_HUMAN_CLOSURE\n";
          ''')
          PY
          php -l vf-ops.php >/dev/null
          php -l includes/views/admin-operations-console-pages.php >/dev/null
          php -l includes/admin-v13/views/dashboard.php >/dev/null
          php -l tests/pages-tools-human-closure-contract.php >/dev/null
          php tests/admin-human-language-contract.php
          php tests/pages-tools-human-closure-contract.php
          php tests/dashboard-selector-hit-contract.php
          php tests/visible-console-v2-contract.php
          php tests/update-refresh-policy-current-contract.php
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add -A
          git commit -m 'feat(S01-C02): pages and tools human language closure 1.21.857'
          git push -q origin HEAD:"$BRANCH"
