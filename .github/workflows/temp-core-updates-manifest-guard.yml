name: TEMP core-updates Manifest Guard Exact Source

on:
  push:
    branches:
      - 'temp/core-updates-manifest-guard-20260907'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CORE_UPDATES_SHA: 67f47568406edf24ac8ca08d291cf56c47741f38
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Require registered private read capability
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VF_PRIVATE_READ_TOKEN" || { echo 'BLOCK=VF_PRIVATE_READ_TOKEN_MISSING'; exit 78; }

      - name: Checkout exact core-updates source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CORE_UPDATES_SHA }}
          token: ${{ env.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: core-updates

      - name: Verify exact source identity
        working-directory: core-updates
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CORE_UPDATES_SHA"
          echo "EXACT_SOURCE=$CORE_UPDATES_SHA"

      - name: Manifest Contract Audit
        working-directory: core-updates
        run: python3 scripts/check_manifest_contract.py

      - name: PHP syntax check
        working-directory: core-updates
        run: find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Update Core regression tests
        working-directory: core-updates
        run: php update-core/php/tests/run.php

      - name: Public-safe result
        shell: bash
        run: |
          echo 'CORE_UPDATES_MANIFEST_GUARD_EXACT_SOURCE=PASS'
          echo "SOURCE_SHA=$CORE_UPDATES_SHA"
