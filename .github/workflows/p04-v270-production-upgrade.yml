name: P04 V2.7.0 Production Private Runner Dispatch

on:
  push:
    branches: [p04-v270-production-upgrade-tmp]
    paths:
      - '.github/workflows/p04-v270-production-upgrade.yml'

permissions:
  contents: read

concurrency:
  group: p04-v270-production-private-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Dispatch private Production workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VF_RELEASE_WRITE_TOKEN"
          code=$(curl --silent --show-error --output "$RUNNER_TEMP/dispatch.out" --write-out '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $VF_RELEASE_WRITE_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/llhzx2018/core-free-runner-private/actions/workflows/p04-v270-production-upgrade-once.yml/dispatches \
            -d '{"ref":"main"}')
          echo "PRIVATE_DISPATCH_HTTP=$code"
          test "$code" = '204'
          echo 'PRIVATE_PRODUCTION_DISPATCH=PASS'
