name: P04 V2.7.0 OWNER Authorized Production Upgrade

on:
  push:
    branches: [p04-v270-production-upgrade-tmp]
    paths:
      - '.github/workflows/p04-v270-production-upgrade.yml'
      - '.github/scripts/p04-v270-production-upgrade.py'

permissions:
  contents: write

concurrency:
  group: p04-v270-production-upgrade
  cancel-in-progress: false

jobs:
  production-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ github.token }}
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      VF_INFRA_ADMIN_PASSWORD: ${{ secrets.VF_INFRA_ADMIN_PASSWORD }}
      P04_ADMIN_PASSWORD: ${{ secrets.P04_ADMIN_PASSWORD }}
      P04_PRODUCTION_ADMIN_PASSWORD: ${{ secrets.P04_PRODUCTION_ADMIN_PASSWORD }}
      VF_PRODUCTION_ADMIN_PASSWORD: ${{ secrets.VF_PRODUCTION_ADMIN_PASSWORD }}
      VF_INFRA_PRODUCTION_PASSWORD: ${{ secrets.VF_INFRA_PRODUCTION_PASSWORD }}
      VF_INFRA_SSH_HOST: ${{ secrets.VF_INFRA_SSH_HOST }}
      VF_INFRA_SSH_USER: ${{ secrets.VF_INFRA_SSH_USER }}
      VF_INFRA_SSH_PRIVATE_KEY: ${{ secrets.VF_INFRA_SSH_PRIVATE_KEY }}
      P04_SSH_HOST: ${{ secrets.P04_SSH_HOST }}
      P04_SSH_USER: ${{ secrets.P04_SSH_USER }}
      P04_SSH_PRIVATE_KEY: ${{ secrets.P04_SSH_PRIVATE_KEY }}
      CLOUDPANEL_SSH_HOST: ${{ secrets.CLOUDPANEL_SSH_HOST }}
      CLOUDPANEL_SSH_USER: ${{ secrets.CLOUDPANEL_SSH_USER }}
      CLOUDPANEL_SSH_PRIVATE_KEY: ${{ secrets.CLOUDPANEL_SSH_PRIVATE_KEY }}
      PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
      PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
      PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Probe existing Production credential channels without values
        shell: bash
        run: |
          set -Eeuo pipefail
          for prefix in VF_INFRA P04 CLOUDPANEL PRODUCTION; do
            h="${prefix}_SSH_HOST"; u="${prefix}_SSH_USER"; k="${prefix}_SSH_PRIVATE_KEY"
            if [ -n "${!h:-}" ] && [ -n "${!u:-}" ] && [ -n "${!k:-}" ]; then echo "${prefix}_SSH_CHANNEL=COMPLETE"; else echo "${prefix}_SSH_CHANNEL=INCOMPLETE"; fi
          done
          admin=0
          for n in VF_INFRA_ADMIN_PASSWORD P04_ADMIN_PASSWORD P04_PRODUCTION_ADMIN_PASSWORD VF_PRODUCTION_ADMIN_PASSWORD VF_INFRA_PRODUCTION_PASSWORD; do [ -n "${!n:-}" ] && admin=1 || true; done
          [ "$admin" = 1 ] && echo 'PRODUCTION_ADMIN_CHANNEL=AVAILABLE' || echo 'PRODUCTION_ADMIN_CHANNEL=NONE'
      - name: Ensure Python HTTP client
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY' || python3 -m pip install --quiet requests
          import requests
          print('REQUESTS_READY')
          PY
      - name: Execute authorized Production 2.6.0 to 2.7.0 Atomic closure gate
        shell: bash
        run: python3 .github/scripts/p04-v270-production-upgrade.py
