name: P04 V2.7.0 Production Private Runner Dispatch

on:
  push:
    branches: [p04-v270-production-upgrade-tmp]
    paths:
      - '.github/workflows/p04-v270-production-upgrade.yml'

permissions:
  contents: write

concurrency:
  group: p04-v270-production-private-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      GH_STATUS_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch private Production workflow and record result
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VF_RELEASE_WRITE_TOKEN"
          code=$(curl --silent --show-error --output "$RUNNER_TEMP/dispatch.out" --write-out '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $VF_RELEASE_WRITE_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/llhzx2018/core-free-runner-private/actions/workflows/p04-v270-production-upgrade-once.yml/dispatches \
            -d '{"ref":"main"}')
          status=FAIL; [ "$code" = '204' ] && status=PASS || true
          python3 - "$code" "$status" <<'PY'
          import json,sys,pathlib,os,base64,urllib.request
          code,status=sys.argv[1:3]
          data={'private_dispatch':status,'http_code':int(code),'run_id':int(os.environ.get('GITHUB_RUN_ID','0'))}
          raw=(json.dumps(data,indent=2,sort_keys=True)+'\n').encode()
          repo=os.environ['GITHUB_REPOSITORY']; branch=os.environ['GITHUB_REF_NAME']; path='p04-v270-private-dispatch-status.json'; token=os.environ['GH_STATUS_TOKEN']
          api=f'https://api.github.com/repos/{repo}/contents/{path}'
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}
          sha=None
          try:
            req=urllib.request.Request(api+'?ref='+branch,headers=headers); sha=json.load(urllib.request.urlopen(req,timeout=20)).get('sha')
          except Exception: pass
          body={'message':'chore(P04): record private production dispatch status','content':base64.b64encode(raw).decode(),'branch':branch}
          if sha: body['sha']=sha
          req=urllib.request.Request(api,data=json.dumps(body).encode(),headers=headers,method='PUT'); urllib.request.urlopen(req,timeout=30).read()
          PY
          echo "PRIVATE_DISPATCH_HTTP=$code"
          test "$code" = '204'
          echo 'PRIVATE_PRODUCTION_DISPATCH=PASS'
