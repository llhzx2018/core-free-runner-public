name: S01 C02 1211099 Formal Release
on:
  push:
    branches: [task/s01-c02-1211099-formal-release-20261012]
permissions:
  contents: read
  actions: read
jobs:
  formal-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_VERSION: '1.21.1099'
      TARGET_SHA: '6ec4b13921aa421446881c0e528eb985dd443e8d'
      MAIN_SHA: '177a9f1022b77eaa96370cea203c1233d1d845d6'
      TARGET_TREE: '4f5ce0da1208141fc9001a905ae04299463a131c'
      RELEASE_TAG: 'v1.21.1099'
      RUN_ID: '38193700777'
      ARTIFACT_ID: '11722946316'
    steps:
      - name: Checkout public scoped release harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Checkout exact machine-proven private product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 6ec4b13921aa421446881c0e528eb985dd443e8d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Perform verified formal release and remote asset readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          bash -n runner/lanes/s01-c02-1211099/formal-release.sh
          bash runner/lanes/s01-c02-1211099/formal-release.sh
      - name: Upload only public-safe release receipt (never binary)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-1211099-formal-${{ github.run_id }}
          path: |
            proof-formal/stage.txt
            proof-formal/build.json
            proof-formal/gate-readback.json
            proof-formal/promoted-main.json
            proof-formal/release.json
            proof-formal/FINAL_FORMAL_RELEASE.json
          if-no-files-found: warn
          retention-days: 30
