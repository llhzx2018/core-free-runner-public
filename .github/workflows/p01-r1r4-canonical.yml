name: P01 R1-R4 contract reconciliation candidate diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-r1r4-canonical.yml'

permissions:
  contents: read

jobs:
  canonical:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      PRODUCT_SHA: ca99a4e953be92ec2effdd59c5a95ce79330127e
      BASE_TAG: v2.47.395
    steps:
      - name: Install isolated PHP test runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd unzip >/dev/null
          php -m | grep -Eix 'pdo_sqlite|mbstring'
      - name: Clone exact target and formal release baseline
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          repo_url="https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git"
          live_sha="$(git ls-remote "$repo_url" refs/heads/test/p01-r1r4-canonical-contract-reconcile-20261020 | awk '{print $1}')"
          test "$live_sha" = "$PRODUCT_SHA"
          git clone -q --no-checkout "$repo_url" candidate
          git -C candidate fetch -q --depth 1 origin "$PRODUCT_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          git clone -q --depth 1 --branch "$BASE_TAG" "$repo_url" baseline
          test "$(git -C candidate rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(tr -d ' \r\n' < candidate/VERSION)" = "2.47.395"
          test "$(tr -d ' \r\n' < baseline/VERSION)" = "2.47.395"
          echo P01_R1R4_CONTRACT_CANDIDATE_IDENTITIES=PASS
      - name: Execute six corrected legacy contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          for t in course_reading_brief_contract frontend_projects_tools_software_r5_contract public_home_owner_shell_unified_v247390_contract public_home_shared_interaction_v247390_contract public_home_visitor_discovery_v247390_contract software_header_r9_contract; do
            php -l "tests/unit/${t}.php" >/dev/null
            php "tests/unit/${t}.php"
          done
          echo P01_R1R4_SIX_CONTRACTS_RECONCILED=PASS
