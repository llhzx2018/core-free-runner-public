name: P01 R1-R4 canonical regression zero-debt only

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-r1r4-canonical.yml'

permissions:
  contents: read

jobs:
  canonical:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      PRODUCT_SHA: 09e75573b1afad6b7fa13059ad1135caba96dae6
      BASE_TAG: v2.47.395
    steps:
      - name: Install isolated PHP test runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd unzip >/dev/null
          php -m | grep -Eix 'pdo_sqlite|mbstring'
      - name: Clone exact target and formal release baseline
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          repo_url="https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git"
          live_sha="$(git ls-remote "$repo_url" refs/heads/main | awk '{print $1}')"
          test "$live_sha" = "$PRODUCT_SHA"
          git clone -q --no-checkout "$repo_url" candidate
          git -C candidate fetch -q --depth 1 origin "$PRODUCT_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          git clone -q --depth 1 --branch "$BASE_TAG" "$repo_url" baseline
          test "$(git -C candidate rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(tr -d ' \r\n' < candidate/VERSION)" = "2.47.395"
          test "$(tr -d ' \r\n' < baseline/VERSION)" = "2.47.395"
          echo P01_R1R4_CANONICAL_IDENTITIES=PASS
      - name: Run all canonical tests against last formal release
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate baseline --require-zero-debt | tee /tmp/p01-canonical-r1r4.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/p01-canonical-r1r4.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/p01-canonical-r1r4.txt
          echo P01_R1R4_CANONICAL_MACHINE=PASS
