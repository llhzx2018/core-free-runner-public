name: P07 LibreSpeed Global Fallback Probe

on:
  push:
    branches:
      - experiment/p07-oneshot-bench-v05
    paths:
      - .github/workflows/p07-librespeed-global-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download verified LibreSpeed CLI
        shell: bash
        run: |
          set -euo pipefail
          URL='https://github.com/librespeed/speedtest-cli/releases/download/v1.0.14/librespeed-cli_1.0.14_linux_amd64.tar.gz'
          SHA='89800767ac14085c78a20847ebea23340f6c14a78de0a15c2ac7db8b565c961f'
          curl -fL --retry 2 --connect-timeout 10 --max-time 90 "$URL" -o /tmp/librespeed.tgz
          echo "$SHA  /tmp/librespeed.tgz" | sha256sum -c -
          mkdir -p /tmp/librespeed
          tar -xzf /tmp/librespeed.tgz -C /tmp/librespeed
          BIN="$(find /tmp/librespeed -maxdepth 2 -type f -name 'librespeed-cli*' | head -n1)"
          test -n "$BIN"
          chmod +x "$BIN"
          echo "LIBRESPEED_BIN=$BIN" >> "$GITHUB_ENV"
          "$BIN" --version
      - name: Create pinned HTTPS server pool
        shell: bash
        run: |
          cat >/tmp/p07-librespeed-servers.json <<'JSON'
          [
            {"id":91,"name":"Los Angeles, USA","server":"https://laxspeed.sharktech.net","dlURL":"backend/garbage.php","ulURL":"backend/empty.php","pingURL":"backend/empty.php","getIpURL":"backend/getIP.php"},
            {"id":54,"name":"Los Angeles, USA (2)","server":"https://la.speedtest.clouvider.net/backend","dlURL":"garbage.php","ulURL":"empty.php","pingURL":"empty.php","getIpURL":"getIP.php"},
            {"id":93,"name":"Chicago, USA","server":"https://chispeed.sharktech.net","dlURL":"backend/garbage.php","ulURL":"backend/empty.php","pingURL":"backend/empty.php","getIpURL":"backend/getIP.php"},
            {"id":92,"name":"Denver, USA","server":"https://denspeed.sharktech.net","dlURL":"backend/garbage.php","ulURL":"backend/empty.php","pingURL":"backend/empty.php","getIpURL":"backend/getIP.php"},
            {"id":52,"name":"New York, USA","server":"https://nyc.speedtest.clouvider.net/backend","dlURL":"garbage.php","ulURL":"empty.php","pingURL":"empty.php","getIpURL":"getIP.php"},
            {"id":78,"name":"Virginia, USA","server":"https://speed.riverside.rocks/","dlURL":"garbage.php","ulURL":"empty.php","pingURL":"empty.php","getIpURL":"getIP.php"},
            {"id":50,"name":"Frankfurt, Germany","server":"https://fra.speedtest.clouvider.net/backend","dlURL":"garbage.php","ulURL":"empty.php","pingURL":"empty.php","getIpURL":"getIP.php"},
            {"id":94,"name":"Amsterdam, Netherlands","server":"https://amsspeed.sharktech.net","dlURL":"backend/garbage.php","ulURL":"backend/empty.php","pingURL":"backend/empty.php","getIpURL":"backend/getIP.php"},
            {"id":49,"name":"London, England","server":"https://lon.speedtest.clouvider.net/backend","dlURL":"garbage.php","ulURL":"empty.php","pingURL":"empty.php","getIpURL":"getIP.php"},
            {"id":68,"name":"Singapore","server":"https://speedtest.dsgroupmedia.com","dlURL":"backend/garbage.php","ulURL":"backend/empty.php","pingURL":"backend/empty.php","getIpURL":"backend/getIP.php"},
            {"id":75,"name":"Bangalore, India","server":"https://in1.backend.librespeed.org/","dlURL":"garbage.php","ulURL":"empty.php","pingURL":"empty.php","getIpURL":"getIP.php"},
            {"id":82,"name":"Tokyo, Japan","server":"https://librespeed.a573.net/","dlURL":"backend/garbage.php","ulURL":"backend/empty.php","pingURL":"backend/empty.php","getIpURL":"backend/getIP.php"}
          ]
          JSON
          python3 -m json.tool /tmp/p07-librespeed-servers.json >/dev/null
      - name: Probe six regional pools with low traffic
        shell: bash
        run: |
          set -euo pipefail
          : >/tmp/global.tsv
          probe(){
            local id region out rc
            id="$1"; region="$2"; out="/tmp/ls-${id}.json"
            set +e
            timeout 45s "$LIBRESPEED_BIN" --json --local-json /tmp/p07-librespeed-servers.json --server "$id" --no-icmp --duration 2 --concurrent 2 --chunks 12 --upload-size 512 --timeout 10 --telemetry-level disabled >"$out" 2>"$out.err"
            rc=$?
            set -e
            (( rc == 0 )) || return 1
            python3 - "$out" "$region" <<'PY'
          import json,sys
          p,region=sys.argv[1:]
          obj=json.load(open(p,encoding='utf-8'))
          if isinstance(obj,list):
              if not obj: raise SystemExit(1)
              obj=obj[0]
          if not isinstance(obj,dict): raise SystemExit(1)
          up=float(obj['upload']); down=float(obj['download']); ping=float(obj['ping'])
          if min(up,down,ping) < 0: raise SystemExit(1)
          print(f"{region}\t{up:.2f}\t{down:.2f}\t{ping:.2f}\t{id}")
          PY
          }
          pool(){
            local region="$1" spec id label line
            shift
            for spec in "$@"; do
              IFS='|' read -r id label <<<"$spec"
              if line="$(probe "$id" "$region")"; then
                printf '%s\n' "$line" | tee -a /tmp/global.tsv
                return 0
              fi
              echo "$region candidate $id unavailable; trying next" >&2
            done
            printf '%s\tFAIL\tFAIL\tFAIL\tNONE\n' "$region" | tee -a /tmp/global.tsv
            return 1
          }
          pass=0
          pool 'US West'    '91|LA Sharktech' '54|LA Clouvider' && pass=$((pass+1)) || true
          pool 'US Central' '93|Chicago' '92|Denver' && pass=$((pass+1)) || true
          pool 'US East'    '52|New York' '78|Virginia' && pass=$((pass+1)) || true
          pool 'Europe'     '50|Frankfurt' '94|Amsterdam' '49|London' && pass=$((pass+1)) || true
          pool 'Asia South' '68|Singapore' '75|Bangalore' && pass=$((pass+1)) || true
          pool 'Tokyo'      '82|Tokyo' && pass=$((pass+1)) || true
          cat /tmp/global.tsv
          echo "REGION_PASS=$pass"
          test "$pass" -ge 5
