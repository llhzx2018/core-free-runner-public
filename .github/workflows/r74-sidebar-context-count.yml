name: R74 Sidebar Context Count

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r74-sidebar-context-count.yml'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: 468d1665841ccdb953754c2b1657d81585497341
    steps:
      - name: Checkout exact VF Start candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: 468d1665841ccdb953754c2b1657d81585497341
          path: vf-start
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_sqlite,sqlite3,curl
          coverage: none

      - name: Exact candidate and focused contracts
        shell: bash
        run: |
          set -euo pipefail
          cd vf-start
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(tr -d '\r\n ' < VERSION)" = "2.47.0"
          php -l tests/unit/sidebar_context_count_contract.php
          php tests/unit/sidebar_context_count_contract.php
          php tests/unit/tag_search_count_context_contract.php
          php tests/unit/contextual_favorite_badge_contract.php
          echo R74_SIDEBAR_CONTEXT_COUNT_PASS
          echo R74_EXACT_CANDIDATE_GATE_PASS

      - name: Cleanup private source
        if: always()
        shell: bash
        run: rm -rf vf-start
