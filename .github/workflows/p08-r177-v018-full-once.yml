name: P08 R177 v0.1.8 one-time true 3DB FULL and HTTPS installer gate
on:
  pull_request:
    paths:
      - .github/workflows/p08-r177-v018-full-once.yml
      - scripts/p08_r177_origin_http_smoke.py
permissions:
  contents: read
jobs:
  sqlite-extracted-full-browser:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-v018-final-full-once-20261118' && github.event.pull_request.base.ref == 'main' && ${{ github.actor }} == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      P08_ISOLATED_INSTALL_TEST: YES
      P08_CANDIDATE_SOURCE_SHA: 101033e085e63f6318741a8cb53471bc2b919a71
      P08_CANDIDATE_VERSION: '0.1.8'
    steps:
      - name: Checkout isolated one-time machine proof only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact private P08 v0.1.8 release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 101033e085e63f6318741a8cb53471bc2b919a71
          path: p08
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Checkout canonical rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          path: gov
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: PHP 8.4 and locked composer platform
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: zip,curl,mbstring,sqlite3,pdo_sqlite,pdo_mysql,openssl,posix,dom,intl,fileinfo
          coverage: none
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: p08/package-lock.json
      - name: Exact source checks and build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(id -u)" -ne 0
          test "$(git -C p08 rev-parse HEAD)" = 101033e085e63f6318741a8cb53471bc2b919a71
          test "$(cat p08/VERSION)" = 0.1.8
          test -z "$(git -C p08 status --porcelain --untracked-files=all)"
          composer install --working-dir=p08 --no-dev --no-scripts --prefer-dist --no-interaction --no-progress --optimize-autoloader
          npm ci --prefix p08 --ignore-scripts --no-audit --no-fund
          npm run build --prefix p08
          npm run typecheck --prefix p08
          npm run test:unit --prefix p08
          (cd p08 && composer check-platform-reqs --no-dev)
          test -z "$(git -C p08 status --porcelain --untracked-files=all)"
          (cd p08 && bash scripts/dev_check.sh)
          echo P08_R177_FINAL_VERSION_SOURCE_PHP_JS_GATES=PASS
      - name: Two reproducible real FULL ZIP builds and official manifest structural contract
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -m 700 -p "$RUNNER_TEMP/p08-r177-zip" "$RUNNER_TEMP/p08-r177-sqlite"
          for suffix in A B; do
            python3 -B p08/scripts/build_full.py --source p08 --output "$RUNNER_TEMP/p08-r177-zip/full-$suffix.zip" --version 0.1.8 --source-sha 101033e085e63f6318741a8cb53471bc2b919a71 --governance-root gov
          done
          cmp "$RUNNER_TEMP/p08-r177-zip/full-A.zip" "$RUNNER_TEMP/p08-r177-zip/full-B.zip"
          python3 - "$RUNNER_TEMP/p08-r177-zip/full-A.zip" <<'PY'
          import json, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              m=json.loads(z.read("FULL_MANIFEST.json"))
              assert m["target_version"]=="0.1.8"
              assert m["source_sha"]=="101033e085e63f6318741a8cb53471bc2b919a71"
              assert m["type"]=="CLEAN_FULL_ONLY" and m["data_included"] is False
              assert m["update_type"]=="NOT_ATOMIC"
              assert len(m["files"])>6100
              assert b"0.1.8" in z.read("public/p08-install-build.txt")
              assert z.testzip() is None
          print("P08_R177_REAL_FULL_018_MANIFEST_SOURCE_NO_USER_DATA=PASS")
          PY
          sha256sum "$RUNNER_TEMP/p08-r177-zip/full-A.zip"
          unzip -q "$RUNNER_TEMP/p08-r177-zip/full-A.zip" -d "$RUNNER_TEMP/p08-r177-sqlite"
          echo P08_R177_DOUBLE_BUILD_IDENTICAL_EXTRACTED_CLEAN_FULL=PASS
      - name: Actual extracted v0.1.8 FULL HTTPS GET POST origin/CSRF malicious negatives
        env:
          P08_ISOLATED_INSTALL_TEST: YES
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/p08_r177_origin_http_smoke.py "$RUNNER_TEMP/p08-r177-sqlite"
          echo P08_R177_REAL_HTTPS_SETUP_SOURCE_VERSION_AND_ORIGIN=PASS
      - name: Actual extracted v0.1.8 FULL native SQLite install and login first run
        shell: bash
        run: |
          set -Eeuo pipefail
          php p08/tests/test_extracted_full_sqlite_e2e.php "$RUNNER_TEMP/p08-r177-sqlite"
          test -L "$RUNNER_TEMP/p08-r177-sqlite/current"
          test "$(cat "$RUNNER_TEMP/p08-r177-sqlite/current/VERSION")" = 0.1.8
          php -S 127.0.0.1:18083 -t "$RUNNER_TEMP/p08-r177-sqlite/public" "$RUNNER_TEMP/p08-r177-sqlite/public/index.php" >"$RUNNER_TEMP/p08-r177-http.log" 2>&1 &
          p=$!
          trap 'kill "$p" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 25); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18083/login || true)"
            if [ "$code" = 200 ]; then break; fi
            sleep 1
          done
          test "$code" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18083/app)" = 302
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18083/setup)" = 503
          echo P08_R177_REAL_SQLITE_EXTRACTED_FULL_INSTALL_LOGIN_GUEST_LOCK=PASS
      - name: Always clean private source and temporary package
        if: always()
        shell: bash
        run: |
          rm -rf -- p08 gov "$RUNNER_TEMP/p08-r177-sqlite" "$RUNNER_TEMP/p08-r177-zip" "$RUNNER_TEMP/p08-r177-http.log"
          test ! -e p08 && test ! -e gov
  mysql-mariadb-extracted-full:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-v018-final-full-once-20261118' && github.event.pull_request.base.ref == 'main' && ${{ github.actor }} == 'llhzx2018'
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: mysql
            image: mysql:8.4
            health: mysqladmin ping --silent
          - kind: mariadb
            image: mariadb:11.8
            health: healthcheck.sh --connect --innodb_initialized
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      db:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: synthetic-only-p08-ci-pass
          MYSQL_ROOT_HOST: '%'
          MARIADB_ROOT_PASSWORD: synthetic-only-p08-ci-pass
          MARIADB_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=18
    env:
      P08_ISOLATED_INSTALL_TEST: YES
      P08_CANDIDATE_SOURCE_SHA: 101033e085e63f6318741a8cb53471bc2b919a71
      P08_CANDIDATE_VERSION: '0.1.8'
      P08_TEST_DB_DRIVER: ${{ matrix.kind }}
      P08_TEST_DB_HOST: 127.0.0.1
      P08_TEST_DB_CLEAN: p08_ci_clean
      P08_TEST_DB_DIRTY: p08_ci_dirty
      P08_TEST_DB_USER: root
      P08_TEST_DB_PASSWORD: synthetic-only-p08-ci-pass
    steps:
      - name: Checkout one-off machine-only proof harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact v0.1.8 private product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 101033e085e63f6318741a8cb53471bc2b919a71
          path: p08
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Checkout current canonical FULL governance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          path: gov
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: PHP 8.4 and MariaDB/MySQL PDO
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: zip,curl,mbstring,pdo_mysql,pdo_sqlite,sqlite3,openssl,dom,intl,fileinfo
          coverage: none
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build exact FINAL code source-bound reproducible v0.1.8 FULL for SQL engine
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p08 rev-parse HEAD)" = 101033e085e63f6318741a8cb53471bc2b919a71
          test "$(cat p08/VERSION)" = 0.1.8
          composer install --working-dir=p08 --no-dev --no-scripts --prefer-dist --no-interaction --no-progress --optimize-autoloader
          npm ci --prefix p08 --ignore-scripts --no-audit --no-fund
          npm run build --prefix p08
          test -z "$(git -C p08 status --porcelain --untracked-files=all)"
          mkdir -m 700 -p "$RUNNER_TEMP/p08-r177-sqlzip" "$RUNNER_TEMP/p08-r177-sqlsite"
          python3 -B p08/scripts/build_full.py --source p08 --output "$RUNNER_TEMP/p08-r177-sqlzip/full-A.zip" --version 0.1.8 --source-sha 101033e085e63f6318741a8cb53471bc2b919a71 --governance-root gov
          python3 -B p08/scripts/build_full.py --source p08 --output "$RUNNER_TEMP/p08-r177-sqlzip/full-B.zip" --version 0.1.8 --source-sha 101033e085e63f6318741a8cb53471bc2b919a71 --governance-root gov
          cmp "$RUNNER_TEMP/p08-r177-sqlzip/full-A.zip" "$RUNNER_TEMP/p08-r177-sqlzip/full-B.zip"
          sha256sum "$RUNNER_TEMP/p08-r177-sqlzip/full-A.zip"
          unzip -q "$RUNNER_TEMP/p08-r177-sqlzip/full-A.zip" -d "$RUNNER_TEMP/p08-r177-sqlsite"
          cp -a p08/tests "$RUNNER_TEMP/p08-r177-sqlsite/tests"
          echo P08_R177_REAL_SQL_ENGINE_FULL_PACKAGE_SOURCE_HASH=PASS
      - name: Actual native first Owner install from extracted FULL dirty DB rejection and repeat denial
        shell: bash
        run: |
          set -Eeuo pipefail
          php p08/tests/fixtures/create_ci_databases.php
          php "$RUNNER_TEMP/p08-r177-sqlsite/tests/test_install_mysql_e2e.php"
          test -L "$RUNNER_TEMP/p08-r177-sqlsite/current"
          test "$(cat "$RUNNER_TEMP/p08-r177-sqlsite/current/VERSION")" = 0.1.8
          echo P08_R177_SQL_NATIVE_INSTALL_SCHEMA_OWNER_DIRTY_REPLAY=PASS
      - name: Cleanup all synthetic SQL sites and source
        if: always()
        shell: bash
        run: |
          rm -rf -- p08 gov "$RUNNER_TEMP/p08-r177-sqlsite" "$RUNNER_TEMP/p08-r177-sqlzip"
          test ! -e p08 && test ! -e gov
