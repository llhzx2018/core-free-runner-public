name: S01 R9 Theme225 M3U8100 channel exact premerge
on:
  push:
    branches: [test/s01-r9-dual-channel-discovery-20261104]
    paths: ['.github/workflows/s01-r9-dual-channel-premerge-20261104.yml']
permissions: {contents: read}
jobs:
  channel-premerge:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: c4c6b24988461aa870ecf1db4e4e4f752f1c9157
          token: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'
          persist-credentials: false
          path: channel
      - name: Exact premerge product channel source and original manifest plus PHP tests
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C channel rev-parse HEAD)" = c4c6b24988461aa870ecf1db4e4e4f752f1c9157
          (cd channel && python3 scripts/check_manifest_contract.py)
          (cd channel && find update-core/php -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null)
          (cd channel && php update-core/php/tests/run.php)
          echo S01_R9_DUAL_CHANNEL_ORIGINAL_CONTRACT_AND_PHP=PASS
      - name: Published Theme and M3U8 exact remote release ZIP integrity
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          mkdir -p "$RUNNER_TEMP/published"
          gh release download v1.35.225 -R llhzx2018/vf-tools-theme --pattern vf-tools-theme_V1.35.225.zip -D "$RUNNER_TEMP/published"
          gh release download v1.25.100 -R llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.100.zip -D "$RUNNER_TEMP/published"
          gh api repos/llhzx2018/vf-tools-theme/releases/tags/v1.35.225 --jq '{tag_name,draft,prerelease,assets:[.assets[]|{name,size,digest}]}' >"$RUNNER_TEMP/published/theme-release.json"
          gh api repos/llhzx2018/vf-tools-m3u8/releases/tags/v1.25.100 --jq '{tag_name,draft,prerelease,assets:[.assets[]|{name,size,digest}]}' >"$RUNNER_TEMP/published/m3u8-release.json"
          python3 - <<'PY'
          import json,os,pathlib,hashlib,zipfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'],'published')
          for kind,component,version,basename,slug,header,files,expected in [
            ('theme','S01-C01','1.35.225','vf-tools-theme_V1.35.225.zip','vf-tools-theme','style.css',476,'adc5413022a674e8256cc7f82bc04d1513036dbd483b1fb89c81b74de9a21c89'),
            ('m3u8','S01-C03','1.25.100','vf-tools-m3u8_V1.25.100.zip','vf-tool-m3u8','vf-tool-m3u8.php',591,'d1c27b66d51440160321b31a12b7ede8cb418f7a5a89e4ad8f3cfb921af2544b')]:
           m=json.loads(pathlib.Path('channel/projects/'+component+'.json').read_text())
           rel=json.loads((root/(kind+'-release.json')).read_text())
           asset=root/basename
           digest=hashlib.sha256(asset.read_bytes()).hexdigest()
           assert digest==expected==m['asset_sha256']
           assert m['target_version']==version and m['release_tag']==rel['tag_name']=='v'+version
           assert m['asset_name']==basename and m['asset_bytes']==asset.stat().st_size
           assert m['runtime_files']==files and m['backup_required'] is True and m['rollback_supported'] is True
           assert m['enabled'] is True and m['schema_from']==m['schema_to']
           old='1.35.224' if kind=='theme' else '1.25.99'
           assert old in m['from_versions'] and len(m['from_versions'])==len(set(m['from_versions']))
           assert rel['draft'] is False and rel['prerelease'] is False
           a=[a for a in rel['assets'] if a['name']==basename]
           assert len(a)==1 and a[0]['digest']=='sha256:'+digest and a[0]['size']==asset.stat().st_size
           with zipfile.ZipFile(asset) as z:
            assert z.testzip() is None and len(z.namelist())==files
            assert slug+'/'+header in z.namelist()
            assert 'Version: '+version in z.read(slug+'/'+header).decode()
            assert all(n.startswith(slug+'/') and '..' not in pathlib.PurePosixPath(n).parts for n in z.namelist())
           if kind=='m3u8':
            assert m['plugin_file']=='vf-tool-m3u8/vf-tool-m3u8.php'
            assert m['package_slug']=='vf-tool-m3u8'
            assert m['runtime_file_count']==591
            assert not m.get('locator_cutover')
            assert 'runtime_fingerprint' not in m and 'runtime_fingerprint_sha256' not in m
           print('S01_R9_OFFICIAL_'+component+'_RELEASE_ASSET_CHANNEL_PREMERGE=PASS')
          print('S01_R9_DUAL_ASSET_CHANNEL_PREMERGE=PASS')
          PY
      - name: Cleanup temporary channel and remote assets
        if: always()
        run: rm -rf channel "$RUNNER_TEMP/published"
