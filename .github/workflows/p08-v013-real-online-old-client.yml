name: P08 v013 original issued PHP LIVE official channel preflight
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p08-v013-real-online-old-client.yml
      - tests/p08_v013_real_online_old_php_channel.php
permissions:
  contents: read
jobs:
  genuine-v012-php-live-online:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-v013-real-online-old-php-channel-20261120'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      P08_ISOLATED_INSTALL_TEST: 'YES'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout public read-only live-channel acceptance script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact original v012 shipped source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: dac7bc1d5410c077f32e522eb5740537f618ef9d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: old
      - name: PHP8.4 real curl crypto and ZIP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: curl,zip,openssl,mbstring,posix,fileinfo
          coverage: none
      - name: Download official v013 UPDATE by immutable asset ID and execute original v012 PHP against LIVE GitHub channel
        shell: bash
        env:
          P08_CHANNEL_TEST_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          test "$(id -u)" -ne 0
          test "$(git -C old rev-parse HEAD)" = dac7bc1d5410c077f32e522eb5740537f618ef9d
          test -n "$P08_CHANNEL_TEST_TOKEN"
          test "$(php -r 'echo PHP_MAJOR_VERSION,".",PHP_MINOR_VERSION;')" = 8.4
          php -l tests/p08_v013_real_online_old_php_channel.php
          php -l old/src/Upgrade/OwnerNextReleaseGateway.php
          composer --working-dir=old install --no-dev --no-scripts --prefer-dist \
            --no-interaction --no-progress --optimize-autoloader
          test -f old/vendor/autoload.php
          root="$RUNNER_TEMP/p08-v013-live-online-only"
          mkdir -m 700 "$root"
          archive="$root/VF_AdOps_V0.1.13_UPDATE.zip"
          curl -fsSL --retry 2 --max-time 120 \
            -H "Authorization: Bearer $P08_CHANNEL_TEST_TOKEN" \
            -H 'Accept: application/octet-stream' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/llhzx2018/vf-adops/releases/assets/770296935" \
            -o "$archive"
          test "$(stat -c %s "$archive")" = 8355163
          test "$(sha256sum "$archive" | cut -d' ' -f1)" = \
            6982a7b44873ac825e6c252b309d8f11a9ade67e67f5b8b6467538a46ef71b2a
          echo P08_V013_REAL_REMOTE_ISSUED_ATOMIC_BYTES=PASS
          php tests/p08_v013_real_online_old_php_channel.php "$archive"
      - name: Always dispose all private original code, token-independent fixture and downloaded ZIP
        if: always()
        shell: bash
        run: |
          rm -rf -- old "$RUNNER_TEMP/p08-v013-live-online-only"
          test ! -e old
          test ! -e "$RUNNER_TEMP/p08-v013-live-online-only"
          echo P08_V013_LIVE_OLD_PHP_ONLINE_ALL_PRIVATE_CLEANUP=PASS
