name: P07 OneShot Bench v0.9 Gate

on:
  push:
    branches:
      - experiment/p07-oneshot-bench-v05
    paths:
      - .github/workflows/p07-v09-gate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load exact candidate
        shell: bash
        run: |
          set -euo pipefail
          git show 90d34694a6bdfadf46311919a3067644fa5f146d:experiments/p07-bench.sh > /tmp/p07-bench-v09.sh
          chmod +x /tmp/p07-bench-v09.sh
          grep -F 'VERSION="0.9.0"' /tmp/p07-bench-v09.sh
      - name: Syntax and self-test
        shell: bash
        run: |
          set -euo pipefail
          bash -n /tmp/p07-bench-v09.sh
          /tmp/p07-bench-v09.sh --version | grep -F '0.9.0'
          /tmp/p07-bench-v09.sh --self-test | grep -F 'SELF_TEST=PASS'
      - name: Provider-limited field regression
        shell: bash
        env:
          XDG_STATE_HOME: /tmp/p07-v09-state
          P07_BENCH_DEMO_BACKEND_REASON: RATE_LIMITED
          P07_BENCH_DEMO_MAINLAND_FAIL_HOST: 10086.cn
        run: |
          set -euo pipefail
          rm -rf "$XDG_STATE_HOME"
          /tmp/p07-bench-v09.sh --demo >/tmp/v09-demo
          grep -F 'Speedtest backend preflight failed: RATE_LIMITED. Remaining Ookla nodes skipped.' /tmp/v09-demo
          grep -F 'Cloudflare Edge' /tmp/v09-demo
          grep -F 'Carrier Speed       : NOT_RUN (Ookla RATE_LIMITED)' /tmp/v09-demo
          grep -F 'Mainland HTTPS Fail : www.10086.cn' /tmp/v09-demo
          grep -F 'Evidence Quality    : PARTIAL' /tmp/v09-demo
          grep -F 'China IP Risk       : UNKNOWN' /tmp/v09-demo
          grep -F 'OOKLA RATE LIMITED; NO IP-BLOCKING VERDICT FROM SPEEDTEST' /tmp/v09-demo
          grep -F 'test-platform evidence, not IP-blocking evidence' /tmp/v09-demo
          ! grep -q 'Carrier Speed       : 0/0 PASS' /tmp/v09-demo
          ! grep -q 'Los Angeles, US' /tmp/v09-demo
      - name: JSON evidence contract
        shell: bash
        env:
          XDG_STATE_HOME: /tmp/p07-v09-state
        run: |
          set -euo pipefail
          json="$(ls -1t "$XDG_STATE_HOME"/p07-bench/reports/*.json | head -n1)"
          python3 - "$json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          a=d['china_ip_assessment']
          assert d['schema_version']==3
          assert a['verdict']=='UNKNOWN'
          assert a['evidence_quality']=='PARTIAL'
          assert a['ookla_provider']['reason']=='RATE_LIMITED'
          assert a['mainland_https']['pass']==5
          assert a['mainland_https']['fail']==1
          assert 'www.10086.cn' in a['mainland_https']['failed_hosts']
          assert any(n['name']=='Cloudflare Edge' and n['state']=='PASS' for n in d['network_nodes'])
          PY
      - name: One-shot and safety boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q '请选择\|Select option' /tmp/v09-demo
          ! grep -E 'curl .*--insecure|curl .* -k|wget .*--no-check-certificate' /tmp/p07-bench-v09.sh
          ! grep -E 'sysctl -w|systemctl restart|reboot|shutdown' /tmp/p07-bench-v09.sh
          grep -F 'sha256sum' /tmp/p07-bench-v09.sh
