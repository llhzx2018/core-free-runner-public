name: TEMP S01-C02 v1.21.813 Formal Release
on:
  push:
    branches: [temp/s01-c03-v12519-runtime-authority-probe-20260905]
    paths: ['.github/workflows/temp-s01-c02-v121813-formal-release.yml']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE: bd2fb0f84a39cbbbdc0c4d999397c4c7c0f82f44
      BYTES: '3220322'
      SHA256: a00f9bbe58569fde49a25156335b1ac50c731570e528018815d54ca76e5d3397
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.SOURCE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: ops
      - name: Verify promoted source
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          live(){ curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/llhzx2018/vf-tools-ops/branches/$1" | jq -r '.commit.sha'; }
          test "$(live main)" = "$SOURCE"
          test "$(live develop)" = "$SOURCE"
          echo PROMOTED_SOURCE=PASS
      - name: Rebuild exact Candidate artifact
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re,zipfile
          files=[]
          for p in Path('ops').rglob('*'):
              if not p.is_file() or p.is_symlink(): continue
              rel=p.relative_to('ops').as_posix(); parts=rel.split('/')
              if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in parts): continue
              if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',rel,re.I): continue
              if '/' not in rel:
                  if rel not in {'vf-ops.php','uninstall.php'}: continue
              elif parts[0] not in {'includes','assets','languages','config'}: continue
              files.append((rel,p.read_bytes()))
          files.sort(key=lambda x:x[0])
          z=Path('/tmp/vf-tools-ops_V1.21.813.zip')
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as out:
              for rel,b in files:
                  i=zipfile.ZipInfo('vf-ops/'+rel,(2026,9,5,0,0,0)); i.compress_type=zipfile.ZIP_DEFLATED; i.external_attr=0o100644<<16; out.writestr(i,b)
          print(z.stat().st_size,hashlib.sha256(z.read_bytes()).hexdigest())
          PY
          test "$(stat -c '%s' /tmp/vf-tools-ops_V1.21.813.zip)" = "$BYTES"
          test "$(sha256sum /tmp/vf-tools-ops_V1.21.813.zip | awk '{print $1}')" = "$SHA256"
          unzip -tq /tmp/vf-tools-ops_V1.21.813.zip >/dev/null
          echo EXACT_ARTIFACT=PASS
      - name: Create formal release
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          ! gh release view v1.21.813 --repo llhzx2018/vf-tools-ops >/dev/null 2>&1
          gh release create v1.21.813 /tmp/vf-tools-ops_V1.21.813.zip \
            --repo llhzx2018/vf-tools-ops \
            --target "$SOURCE" \
            --title 'VF Tools Ops v1.21.813' \
            --notes 'S01-C02 M3U8 Authority Rebind Guard V1. Repairs only the proven S01-C03 v1.25.19 Runtime Authority version-mismatch deadlock, and only when the installed M3U8 runtime exactly matches the official v1.25.19 Authority: 551 files / SHA256 fingerprint 361eb3263b689bbe7a117d1628e51f069358697a3d85fd7e3c1faf2e7afcf113. Any runtime drift remains blocked. The priority-9 guard only rebinds Runtime Authority metadata, then the existing M3U8 updater remains authoritative for download integrity, ZIP validation, recovery, install and post-update verification. Also fixes Ops update-page latest-version display precedence. No M3U8 migration/schema/DB write, Seed HOLD release, content write, plugin-state mutation or DNS write.'
      - name: Release readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          j="$(gh api repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.813)"
          test "$(jq -r '.target_commitish' <<<"$j")" = "$SOURCE"
          test "$(jq -r '.draft' <<<"$j")" = false
          test "$(jq -r '.prerelease' <<<"$j")" = false
          test "$(jq -r '.assets[]|select(.name=="vf-tools-ops_V1.21.813.zip")|.size' <<<"$j")" = "$BYTES"
          test "$(jq -r '.assets[]|select(.name=="vf-tools-ops_V1.21.813.zip")|.digest' <<<"$j")" = "sha256:$SHA256"
          echo PASS_V121813_FORMAL_RELEASE
