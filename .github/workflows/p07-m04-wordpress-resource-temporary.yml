name: TEMP P07 M04 WordPress evidence and resource real host
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p07-m04-wordpress-resource-temporary.yml']
permissions:
  contents: read
jobs:
  actual-use:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.actor == 'llhzx2018' && github.triggering_actor == 'llhzx2018' && github.event.pull_request.user.login == 'llhzx2018' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'temp/p07-m04-wordpress-resource-20261128'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4d6cc374291f81893c0adfed02a03c06fa99a6c3
          persist-credentials: false
          path: m04-source
      - name: Install exact candidate and execute actual resource planning
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          cd m04-source
          test "$(git rev-parse HEAD)" = 4d6cc374291f81893c0adfed02a03c06fa99a6c3
          test "$(git rev-parse 'HEAD^{tree}')" = d44e2794914280263fa94b7922abd7bfecc05e91
          test -z "$(git status --porcelain)"
          test ! -e /opt/vfops-modules/m04
          work=$(mktemp -d "$RUNNER_TEMP/p07-m04-wp.XXXXXX")
          printf '%s\n' "$work" > "$RUNNER_TEMP/p07-m04-wp-owned-$GITHUB_RUN_ID"
          python3 -B installers/p07-m04-ux6-atomic.py build "$work/m04.zip" >"$work/build.log"
          digest=$(sha256sum "$work/m04.zip" | cut -d' ' -f1)
          test "$digest" = 27413282414fff40557af99069ac6878f0bd05d20032b52378cd899fdb644355
          sudo -n python3 -B installers/p07-m04-ux6-atomic.py install "$work/m04.zip" "$digest"
          root=/opt/vfops-modules/m04/current
          test "$(sudo -n git hash-object "$root/lib/intrusion_evidence.py")" = e7e479359abd32200e059542a4e1de29e00dd621
          test "$(sudo -n git hash-object "$root/lib/resource_apply.py")" = 0eef659e7a7edc0395a1e680cdaf77521bb3aa59
          echo P07_M04_EXACT_INSTALLED_SOURCE=4d6cc374291f81893c0adfed02a03c06fa99a6c3
          sudo -n sha256sum /etc/fstab /etc/ssh/sshd_config /var/lib/dpkg/status >"$work/host-before"
          sudo -n env PYTHONDONTWRITEBYTECODE=1 NO_COLOR=1 bash "$root/vf-system-care.sh" resources json >"$work/profile.json"
          sudo -n env PYTHONDONTWRITEBYTECODE=1 NO_COLOR=1 bash "$root/vf-system-care.sh" resources plan-json >"$work/plan.json"
          python3 -B - "$work/plan.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1]))
          assert p['schema']=='vf-resource-apply-plan.v1'
          assert p['cap_only'] and not p['automatic_mysql_restart'] and not p['automatic_service_disable']
          assert p['swap']['automatic_action']=='NONE'
          assert all(c['effective_numeric']<=c['current_numeric'] for c in p['mysql_changes'])
          assert all(c['effective']<=c['current'] for c in p['php_changes'])
          print('P07_M04_REAL_RESOURCE_PROFILE='+p['profile_id'])
          print('P07_M04_REAL_RESOURCE_ELIGIBLE='+str(p['eligible']))
          print('P07_M04_REAL_RESOURCE_CALIBRATION='+p['calibration_state'])
          print('P07_M04_REAL_RESOURCE_BLOCK_REASON_COUNT='+str(len(p['block_reasons'])))
          if p['eligible']:
              print('P07_M04_APPLY=NOT_RUN_REQUIRES_APPLICABLE_CONTROLLED_HOST')
          else:
              assert p['block_reasons'] and p['apply_state']=='PREVIEW_ONLY_BLOCKED'
              print('P07_M04_APPLY=NOT_ELIGIBLE')
          print('P07_M04_REAL_RESOURCE_PLAN=PASS')
          PY
          printf '4\n\n0\n' | sudo -n script -qfec "stty cols 80 rows 24; env PYTHONDONTWRITEBYTECODE=1 NO_COLOR=1 TERM=dumb bash '$root/vf-system-care.sh' menu" "$work/resource-menu.tty" >"$work/resource-menu.log" 2>&1
          grep -Fq '适用性' "$work/resource-menu.log"
          sudo -n sha256sum -c "$work/host-before" >/dev/null
          echo P07_M04_REAL_RESOURCE_MENU_AND_NO_HOST_WRITE=PASS
      - name: Actual WordPress file baseline and anomaly evidence with isolated official core fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          read -r work < "$RUNNER_TEMP/p07-m04-wp-owned-$GITHUB_RUN_ID"
          [[ "$work" == "$RUNNER_TEMP"/p07-m04-wp.* && -d "$work" && ! -L "$work" ]]
          root=/opt/vfops-modules/m04/current
          # Official release files only: never execute PHP or expose a web service.
          curl --proto '=https' --proto-redir '=https' -fsSL --connect-timeout 10 --max-time 90 https://wordpress.org/wordpress-6.8.3.tar.gz -o "$work/wp.tar.gz"
          export WORK="$work"
          python3 -B - <<'PY'
          import hashlib,os,tarfile,sqlite3,re
          from pathlib import Path
          w=Path(os.environ['WORK'])
          archive=w/'wp.tar.gz'
          assert archive.stat().st_size<70*1024*1024
          with tarfile.open(archive) as tar:
              members=tar.getmembers()
              assert len(members)<10000 and sum(m.size for m in members)<200*1024*1024
              assert all(m.name.split('/')[0]=='wordpress' and (m.isfile() or m.isdir()) for m in members)
              tar.extractall(w/'unpack',filter='data')
          home=w/'home';site=home/'fixture'/ 'htdocs'/'wordpress.test'
          site.parent.mkdir(parents=True)
          (w/'unpack'/'wordpress').rename(site)
          version=(site/'wp-includes/version.php').read_text()
          assert re.search(r"\$wp_version\s*=\s*'6\.8\.3'",version)
          (site/'wp-config.php').write_text("<?php /* isolated synthetic configuration; not executed */\n")
          ordinary=home/'fixture'/'htdocs'/'ordinary.test';ordinary.mkdir()
          (ordinary/'index.php').write_text('<?php /* ordinary fixture */\n')
          with sqlite3.connect(w/'panel.db') as c:
              c.executescript("CREATE TABLE site(domain_name TEXT,user TEXT,type TEXT); INSERT INTO site VALUES('wordpress.test','fixture','php'); INSERT INTO site VALUES('ordinary.test','fixture','php');")
          (w/'nginx').mkdir()
          (w/'scheduler').mkdir()
          print('P07_M04_WP_CORE_VERSION=6.8.3; ARCHIVE_SHA256='+hashlib.sha256(archive.read_bytes()).hexdigest())
          PY
          export P07_IE_DISCOVERY_HOME="$work/home" P07_IE_CLOUDPANEL_DB="$work/panel.db" P07_IE_NGINX_SITES_DIR="$work/nginx"
          export P07_IE_STATE_DIR="$work/state" P07_IE_SYSTEMD_DIR="$work/scheduler" P07_IE_CRON_FILE="$work/owned.cron" P07_IE_ENTRY="$root/vf-system-care.sh"
          export PYTHONDONTWRITEBYTECODE=1 NO_COLOR=1
          run() { sudo -n --preserve-env=P07_IE_DISCOVERY_HOME,P07_IE_CLOUDPANEL_DB,P07_IE_NGINX_SITES_DIR,P07_IE_STATE_DIR,P07_IE_SYSTEMD_DIR,P07_IE_CRON_FILE,P07_IE_ENTRY,PYTHONDONTWRITEBYTECODE,NO_COLOR "$@"; }
          helper() { run python3 -B "$root/lib/intrusion_evidence.py" --state-dir "$work/state" "$@"; }
          snapshot() { find "$work/home" -type f -print0 | sort -z | xargs -0 sha256sum; }
          snapshot >"$work/files-initial"
          run python3 -B "$root/lib/intrusion_discovery.py" --kv >"$work/discovery.log"
          grep -Fxq P07_WP_DISCOVERY_STATUS=READY "$work/discovery.log"
          grep -Fxq P07_WP_DISCOVERY_WORDPRESS_SITES=1 "$work/discovery.log"
          grep -Fxq P07_WP_DISCOVERY_CLOUDPANEL_SITES=2 "$work/discovery.log"
          printf 'y\n' | run script -qfec "bash '$root/vf-system-care.sh' evidence enable" "$work/enable.tty" >"$work/enable.log" 2>&1
          grep -Fq '网站安全保护已开启' "$work/enable.log"
          helper status >"$work/baseline-status.json"
          python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));assert d["enabled"] and d["result"]=="BASELINE_READY"' "$work/baseline-status.json"
          test -f "$work/scheduler/vf-system-care-intrusion-evidence.timer"
          grep -Fxq OnCalendar=daily "$work/scheduler/vf-system-care-intrusion-evidence.timer"
          run bash "$root/vf-system-care.sh" evidence scan-scheduled >"$work/clean.log"
          helper status >"$work/clean.json"
          python3 -c 'import json,sys;assert json.load(open(sys.argv[1]))["result"]=="CLEAN"' "$work/clean.json"
          snapshot >"$work/files-after-clean";cmp "$work/files-initial" "$work/files-after-clean"
          echo P07_M04_WP_REAL_BASELINE_CLEAN_SCAN_AND_SITE_READ_ONLY=PASS
          site="$work/home/fixture/htdocs/wordpress.test"
          cp "$site/wp-config.php" "$work/config.original"
          printf '\n/* harmless test change */\n' >>"$site/wp-config.php"
          snapshot >"$work/files-changed"
          run bash "$root/vf-system-care.sh" evidence scan >"$work/changed.log"
          helper report --json --limit 100 >"$work/report.json"
          python3 - "$work/report.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1]));assert p['scan']['result']=='ANOMALY'
          assert any(e.get('relative_path')=='wp-config.php' for e in p['events'])
          print('P07_M04_WP_REAL_CHANGED_FILE_EVIDENCE=PASS')
          PY
          snapshot >"$work/files-after-scan";cmp "$work/files-changed" "$work/files-after-scan"
          cp "$work/config.original" "$site/wp-config.php"
          run bash "$root/vf-system-care.sh" evidence scan-scheduled >"$work/history.log"
          helper status >"$work/history.json"
          python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));assert d["result"]=="ANOMALY_HISTORY" and d["event_count"]>=1' "$work/history.json"
          echo P07_M04_WP_HISTORICAL_EVIDENCE_RETAINED=PASS
          sudo -n sha256sum "$work/state/baseline.json" >"$work/baseline-before"
          export P07_IE_MAX_TRACKED_FILES=1
          set +e
          sudo -n --preserve-env=P07_IE_DISCOVERY_HOME,P07_IE_CLOUDPANEL_DB,P07_IE_NGINX_SITES_DIR,P07_IE_STATE_DIR,P07_IE_SYSTEMD_DIR,P07_IE_CRON_FILE,P07_IE_ENTRY,P07_IE_MAX_TRACKED_FILES,PYTHONDONTWRITEBYTECODE,NO_COLOR bash "$root/vf-system-care.sh" evidence scan-scheduled >"$work/limit.log" 2>&1
          rc=$?
          set -e
          unset P07_IE_MAX_TRACKED_FILES
          test "$rc" != 0
          helper status >"$work/limited.json"
          python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));assert d["status"]=="FAILED" and d["error_class"]=="ScanBudgetExceededError" and d["event_count"]>=1' "$work/limited.json"
          sudo -n sha256sum -c "$work/baseline-before" >/dev/null
          echo P07_M04_WP_SCAN_FAILURE_BASELINE_AND_HISTORY_PROTECTED=PASS
          run bash "$root/vf-system-care.sh" evidence scan-scheduled >"$work/recovered.log"
          helper status >"$work/recovered.json"
          python3 -c 'import json,sys;assert json.load(open(sys.argv[1]))["result"]=="ANOMALY_HISTORY"' "$work/recovered.json"
          printf 'y\n' | run script -qfec "bash '$root/vf-system-care.sh' evidence disable" "$work/disable.tty" >"$work/disable.log" 2>&1
          test ! -e "$work/scheduler/vf-system-care-intrusion-evidence.timer"
          helper status >"$work/disabled.json"
          python3 -c 'import json,sys;assert json.load(open(sys.argv[1]))["event_count"]>=1' "$work/disabled.json"
          snapshot >"$work/files-final";cmp "$work/files-initial" "$work/files-final"
          sudo -n sha256sum -c "$work/host-before" >/dev/null
          echo P07_M04_WP_RECOVERY_DISABLE_HISTORY_AND_HOST_PROTECTION=PASS
          echo P07_M04_WP_SCOPE=OFFICIAL_CORE_FILES_SYNTHETIC_PANEL_METADATA_SCHEDULER_FILES_AND_REAL_SCAN_SCHEDULED_COMMAND_NOT_LIVE_TIMER_OR_PHP
      - name: Always remove owned candidate and isolated test state
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          f="$RUNNER_TEMP/p07-m04-wp-owned-$GITHUB_RUN_ID"
          if [[ -f "$f" && ! -L "$f" ]]; then
            read -r work < "$f"
            [[ "$work" == "$RUNNER_TEMP"/p07-m04-wp.* && -d "$work" && ! -L "$work" ]]
            if [[ -L /opt/vfops-modules/m04/current ]]; then
              test "$(readlink /opt/vfops-modules/m04/current)" = releases/0.1.0-ux6
              sudo -n rm -rf -- /opt/vfops-modules/m04
            fi
            sudo -n rm -rf -- "$work"
            test ! -e "$work"; rm -- "$f"
          fi
          test ! -e /opt/vfops-modules/m04
          echo P07_M04_WP_RESOURCE_OWNED_CLEANUP=PASS
