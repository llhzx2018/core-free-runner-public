name: R89 Focused Watch Page Context Count Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r89-watch-page-context-counts.yml'

permissions:
  contents: read

jobs:
  r89-focused-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: 3696ece3723dacec5757d5aa27a4b883bcfae6ad
    steps:
      - name: Checkout exact private P01 candidate transiently
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: 3696ece3723dacec5757d5aa27a4b883bcfae6ad
          path: vf-start
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Exact source and focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd vf-start
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(cat VERSION)" = '2.47.0'
          php -l src/app/WatchMediaLibraryPage.php
          php -l tests/unit/watch_page_context_count_contract.php
          php tests/unit/watch_page_context_count_contract.php
          php tests/unit/watch_status_context_badge_contract.php
          php tests/unit/watch_cross_filter_count_contract.php
          php tests/unit/watch_year_genre_zero_result_contract.php
          php tests/unit/sidebar_context_count_contract.php
          php tests/unit/scope_context_count_contract.php
          echo R89_WATCH_PAGE_CONTEXT_COUNT_PASS
          echo R89_EXACT_CANDIDATE_GATE_PASS

      - name: Cleanup transient private source
        if: always()
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/vf-start"
