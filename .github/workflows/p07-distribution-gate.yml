name: P07 Distribution Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'installers/p07.sh'
      - 'installers/p07-final.sh'
      - 'installers/p07-toolbox.sh'
      - 'installers/p07-system-care.sh'
      - 'dist/p07/0.1.0/overlay/**'
      - 'packages/p07-system-care/0.1.0-rc46/**'
      - '.github/workflows/p07-distribution-gate.yml'
      - '.github/workflows/p07-toolbox-smoke.yml'
      - '.github/workflows/p07-system-care-smoke.yml'
      - '.github/workflows/p07-beginner-menu-gate.yml'

permissions:
  contents: read

# Current P07 distribution gate. Exact Source/overlay/installer identities are updated only when an authorized P07 distribution advances.

jobs:
  distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Current P07 distribution identity
        run: |
          set -Eeuo pipefail
          root='dist/p07/0.1.0/overlay'
          test "$(cat "$root/BUILD_ID")" = '0.1.0-release84'
          grep -Fq 'EXPECTED_BUILD_ID="0.1.0-release84"' installers/p07-final.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release84"' installers/p07-toolbox.sh
          grep -Fq 'RUNTIME_MANIFEST_BLOB="928e5c216915c30f11ac6e128a7bd63041e1be40"' installers/p07-final.sh
          grep -Fq 'EXPECTED_BLOB="9760c352ac71629902e2e317f39b71b323a02a79"' installers/p07.sh
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc46"' installers/p07-toolbox.sh
          grep -Fq "VERSION='0.1.0-rc46'" installers/p07-system-care.sh
          grep -Fq "MANIFEST_BLOB='47fc32b746cd82ef4194005eb99bdc906b200a44'" installers/p07-system-care.sh

      - name: Current P07 exact-source files
        run: |
          set -Eeuo pipefail
          source_commit='e5d97a62f144e19664d2ccab9a9b90cc15abb725'
          while read -r expected rel; do
            actual="$(git hash-object "dist/p07/0.1.0/overlay/$rel")"
            test "$actual" = "$expected" || { echo "EXACT_SOURCE_MISMATCH: $rel $actual != $expected" >&2; exit 1; }
          done <<'FILES'
          ecf5f8f65201797ab37d543442f1f6cbaa04f432 BUILD_ID
          e939a7be232f18f5f3891cc7ba7e56036340b931 lib/server_migration.py
          10c595779ca5b9c02215bb4826938f7802cb6a68 lib/server_migration_pull.py
          d206f9fdc06160bf65e25a60dfccdff6ba11e065 lib/ops_diagnostics.py
          b95b2d2612b49e78e0c66c04b7cf7b911f34025a lib/auto_backup.py
          5b7144da4521fed4c93cbb0482023f923753dfc6 bin/vfops-auto-backup
          07eb2fa71252423df451c56b1f0c43b90f39c9ca bin/vfops-site-ui
          33e065832e9d6a535541858c774f52f70ea9baa0 bin/vfops-diagnostics-ui
          ea3bd3e179df1b1b2f69b3534746540f60e4bb61 bin/vfops-history-ui
          df6469c090df0b6907a2704abe3ff74943db08ce bin/vfops-selfcheck-ui
          6c3b87c839ce0d02f03299639d3dc18322291f64 bin/vfops-init-ui
          94ed66947c0e42a4b3dbf9990178cab57e6e1c98 bin/vfops-migrate-ui
          fe2100262a785870ba7b6400f241aaf0c9f57b83 bin/vfops-storage-setup
          509e1bae6977a5321889535fc9ee9d16abfa3f63 bin/vfops-user
          261b83260efcd8746508cf4c14f143d7a5a1500b tests/test_server_migration.py
          8f08b49310130f676122ddc85b80096b68381c81 tests/test_server_migration_pull.py
          5d66ab58997966d0d43f6765e7160502629b70ee tests/fixtures/release68_press_webroot_sibling_regression.json
          1ca34ec3e7dec6d9ab1597b73243093e50f5ee9f tests/test_ops_diagnostics.py
          2e6975efa6de713bac0cb78632b6d0b66c2410ec tests/test_auto_backup.py
          a707f2a2bc374c9ec78b870119596e64a0f8aa16 tests/test_auto_backup_run_now_ux.py
          f637e80017fb5bc96e3567af7fa2d344f2d5e85a tests/test_site_overview_alignment.py
          cc125946a285a0177123f3285134d3c1cdf613ee docs/authority/CURRENT.md
          622396bda9a9527e701b87eeeafe723d903e2b40 docs/authority/ACCEPTANCE_MATRIX.md
          d31f7a519ae0b4ed346ff944bedf74c9a3c9780c docs/authority/SSOT.md
          68c70c2722754f61076998be41116651a392aed0 docs/authority/RPD.md
          5fd8ea9a914d446fc4a30e5909bfc4fd3970f021 tests/test_main_menu_routes.py
          1001a591bffb9fa4985668fae3959b0f7fb1447d tests/test_menu3_modular.py
          87893093be8073cd5cd7125e4814f5ceb49c9eff tests/test_release11_beginner_ia.py
          18ab6ff65b0f46d39a21e82bbef7cf37c858db27 tests/test_storage_onboarding_ux.py
          7d83140f0af75c9748e7361fea31d7272a5aa03b tests/test_release78_contextual_menus.py
          f52411005bacf61e56e0f3a3728d910d463991e5 tests/test_ops_console_r9.py
          d279e91b6d77ee238e3b6f7dd8eaf9c36b1ab494 tests/test_user_remote_backup.py
          08fec2e74e741610e0799deede25f325be57479e tests/test_user_entry.py
          FILES
          echo "P07_DISTRIBUTION_SOURCE_COMMIT=$source_commit"

      - name: Exact overlay and runtime manifests
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('dist/p07/0.1.0/overlay')
          def blob(path: Path) -> str:
              data=path.read_bytes()
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          for name in ('RUNTIME.gitblob','MANIFEST.gitblob'):
              seen=set()
              for line in (root/name).read_text(encoding='utf-8').splitlines():
                  if not line.strip(): continue
                  expected, rel=line.split('  ',1)
                  assert rel not in seen, (name, rel)
                  seen.add(rel)
                  path=root/rel
                  assert path.is_file(), (name, rel)
                  assert blob(path)==expected, (name, rel, blob(path), expected)
          PY

      - name: Beginner naming and grouped IA
        run: |
          set -Eeuo pipefail
          ui='dist/p07/0.1.0/overlay/bin/vfops-init-ui'
          migration='dist/p07/0.1.0/overlay/bin/vfops-migrate-ui'
          user='dist/p07/0.1.0/overlay/bin/vfops-user'
          toolbox='installers/p07-toolbox.sh'
          systemcare='packages/p07-system-care/0.1.0-rc46/vf-system-care.sh'

          grep -Fq '服务器工具箱' "$toolbox"
          grep -Eq '网络代理节点.*V2Ray代理' "$toolbox"
          grep -Eq '服务器性能检测.*VPS验机' "$toolbox"
          grep -Fq 'VPS_AUDIT_EXPECTED="V2.1.0"' "$toolbox"
          grep -Fq 'VPS_AUDIT_BUILD_EXPECTED="2.1.0-rc7-field"' "$toolbox"
          grep -Fq '功能：5 项' "$toolbox"
          grep -Fq 'VF_NODE_EXPECTED="0.1.0-rc13"' "$toolbox"
          grep -Fq 'VPS_AUDIT_EXPECTED="V2.1.0"' "$toolbox"
          grep -Fq 'VPS_AUDIT_BUILD_EXPECTED="2.1.0-rc7-field"' "$toolbox"
          grep -Fq '确认卸载？[y/N]' packages/p07-network-node/0.1.0-rc13/uninstall.sh
          ! grep -Fq '确认卸载 P07 节点？' packages/p07-network-node/0.1.0-rc13/uninstall.sh
          ! grep -Fq '上游提交' packages/p07-network-node/0.1.0-rc12/status.sh
          ! grep -Fq '核心组件' packages/p07-network-node/0.1.0-rc12/status.sh
          grep -Fq 'VPS_AUDIT_URL="https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/0a851b9fe1819c7970ed5bb8e3633f2fc8e73166/experiments/p07-vps-audit-v21.sh"' "$toolbox"
          grep -Fq 'VPS_AUDIT_SHA256="d1846e751bba5c860c623e3db26641908e27ca43b39cf37016758853b65a952d"' "$toolbox"
          grep -Fq '  bash "$tmp"' "$toolbox"
          ! grep -Fq 'render_vps_audit_output' "$toolbox"
          ! grep -Fq 'NO_COLOR=1 bash "$tmp"' "$toolbox"
          # Original V2.1.0 has real inventory, full network/China pools, fio, route and original ANSI when TTY.
          # The original V2.1 baseline is pinned to an immutable historical source, not duplicated in main.
          original="$(mktemp)"
          trap 'rm -f "$original"' EXIT
          curl -fsSL --retry 2 --connect-timeout 10 --max-time 40 'https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/0a851b9fe1819c7970ed5bb8e3633f2fc8e73166/experiments/p07-vps-audit-v21.sh' -o "$original"
          test "$(sha256sum "$original" | awk '{print $1}')" = 'd1846e751bba5c860c623e3db26641908e27ca43b39cf37016758853b65a952d'
          bash -n "$original"
          test "$(NO_COLOR=1 bash "$original" --version | awk '{print $NF}')" = 'V2.1.0'
          test "$(NO_COLOR=1 bash "$original" --build-id)" = '2.1.0-rc7-field'
          grep -Fq 'BASE_EXPECTED="2.0.0-rc4-zh"' "$original"
          grep -Fq 'print_fio' "$original"
          grep -Fq 'print_three_carrier_route' "$original"
          grep -Fq 'run_base' "$original"

          grep -Eq '网站与数据.*网站/数据库/备份' "$toolbox"
          grep -Eq '服务器维护与安全.*更新/清理/安全' "$toolbox"
          grep -Eq '新服务器初始化.*更新/面板/优化' "$toolbox"
          ! grep -Fq 'P07 · VF 服务器运维' "$toolbox"
          grep -Fq 'run_server_init' "$toolbox"
          grep -Fq 'ensure_system_care_current' "$toolbox"
          grep -Fq 'P07_SYSTEM_CARE_ROOT=/opt/vf-system-care' "$toolbox"
          grep -Fq "printf '请选择 [0-5]：'" "$toolbox"
          grep -Fq 'exec bash "$INIT_UI"' "$user"
          grep -Fq '立即备份一个网站' "$user"
          grep -Fq '从备份恢复网站' "$user"
          grep -Fq '自动备份与异地备份' "$user"
          grep -Fq '服务器迁移' "$user"
          ! grep -Fq 'backup_menu()' "$user"
          grep -Fq '首次验证：先备份一个网站' dist/p07/0.1.0/overlay/bin/vfops-auto-backup
          grep -Fq '继续验证：备份全部网站' dist/p07/0.1.0/overlay/bin/vfops-auto-backup
          grep -Fq 'run_now smoke' dist/p07/0.1.0/overlay/bin/vfops-auto-backup
          grep -Fq 'run_now full' dist/p07/0.1.0/overlay/bin/vfops-auto-backup
          grep -Fq '确认现在开始设置？[y/N]' dist/p07/0.1.0/overlay/bin/vfops-storage-setup
          ! grep -Fq '首次验证：立即备份全部网站' dist/p07/0.1.0/overlay/bin/vfops-storage-setup
          ! grep -Fq '返回后选择“3. 立即备份全部网站”' dist/p07/0.1.0/overlay/bin/vfops-auto-backup
          grep -Fq '继续上次迁移' dist/p07/0.1.0/overlay/bin/vfops-migrate-ui
          grep -Fq '服务器资源评估完成' dist/p07/0.1.0/overlay/bin/vfops-init-ui
          ! grep -Fq 'MySQL缓冲池' dist/p07/0.1.0/overlay/bin/vfops-init-ui
          ! grep -Fq 'PHP热点上限' dist/p07/0.1.0/overlay/bin/vfops-init-ui
          ! grep -Fq '已准备好，开始一键初始化' dist/p07/0.1.0/overlay/bin/vfops-storage-setup
          grep -Fq -- '--init' "$user"

          ! grep -Fq '一键初始化服务器（推荐）' "$ui"
          ! grep -Fq '请选择 [0-1]' "$ui"
          grep -Fq 'preflight' "$ui"
          grep -Fq 'run_initialization' "$ui"
          ! grep -Fq "ui_menu_warn 2 '基础设置（时区 / Swap）'" "$ui"
          ! grep -Fq "ui_menu_warn 3 'CloudPanel 状态 / 安装'" "$ui"
          ! grep -Fq '请选择 [0-3]' "$ui"
          ! grep -Fq '确认补齐缺少的基础设置？[y/N]' "$ui"
          ! grep -Fq '确认安装 CloudPanel？[y/N]' "$ui"
          grep -Fq '确认开始一键初始化？[y/N]' "$ui"
          grep -Fq '1/5 基础设置' "$ui"
          grep -Fq '2/5 系统更新' "$ui"
          grep -Fq '3/5 CloudPanel' "$ui"
          grep -Fq '4/5 性能配置' "$ui"
          grep -Fq '5/5 最终检查' "$ui"
          grep -Fq '首次空服务器会自动安装系统更新' "$ui"
          grep -Fq 'CloudPanel 已安装的服务器只检查更新' "$ui"
          grep -Fq '性能配置统一调用一级菜单 4 的同一套正式调优；初始化不再维护第二套调优逻辑。' "$ui"
          grep -Fq '本次初始化执行清单' "$ui"
          grep -Fq 'resource_block_reason_cn' "$ui"
          grep -Fq 'resource_result_complete' "$ui"
          grep -Fq '当前 MySQL 配置结构与已校准模板不同' "$ui"
          grep -Fq '当前不适合自动调整' "$ui"
          grep -Fq '安全检查阻止了自动调整' "$ui"
          grep -Fq '性能配置未闭环' "$ui"
          grep -Fq '无法从 CloudPanel 读取本机数据库连接信息' "$ui"
          grep -Fq 'CloudPanel 数据库连接信息读取超时' "$ui"
          grep -Fq 'run_resource_apply_with_progress' "$ui"
          grep -Fq '性能配置处理中 · 已耗时' "$ui"
          grep -Fq '不读取数据库密码，不重启 MySQL / Nginx' "$ui"
          grep -Fq '已读取到 CloudPanel 本机数据库连接信息，但本机连接验证失败' "$ui"
          grep -Fq '安全检查返回了未识别的阻断条件，已停止自动调整' "$ui"
          grep -Fq 'resource-profile.sh' "$ui"
          grep -Fq 'resource-apply.sh' "$ui"
          grep -Fq 'plan-json --mode balanced' "$ui"
          grep -Fq 'apply-empty-server-confirmed-json' "$ui"
          grep -Fq 'P07_RESOURCE_APPLY_CONFIRMED=1' "$ui"
          ! grep -Fq 'lib/resource_profile.py' "$ui"
          ! grep -Fq 'lib/resource_apply.py' "$ui"
          grep -Fq '检测到已有网站；为避免影响现有业务' "$ui"
          grep -Fq '本次只检查，不自动调整站点参数' "$ui"
          grep -Fq '空服务器安全检查未通过' "$ui"
          ! grep -Fq '重新执行初始化检查（推荐）' "$ui"
          ! grep -Fq '初始化 / 重新初始化服务器（推荐）' "$ui"
          ! grep -Fq 'CloudPanel 尚未安装，确认现在安装？[y/N]' "$ui"
          grep -Fq '服务器初始化完成' "$ui"
          ! grep -Fq '输入 APPLY_BASELINE' "$ui"
          ! grep -Fq '输入 INSTALL_CLOUDPANEL' "$ui"
          grep -Fq '/^SwapTotal:/' "$ui"
          grep -Fq 'CPU / 内存 / 磁盘配置只做提示，不作为禁止安装或迁移的条件。' "$ui"
          pull='dist/p07/0.1.0/overlay/lib/server_migration_pull.py'
          grep -Fq 'hardware_baseline_is_advisory' "$pull"
          grep -Fq '["bin", "lib", "VERSION", "BUILD_ID"]' "$pull"
          ! grep -Fq '["bin", "lib", "VERSION", "BUILD_ID", "VF_PROJECT.json"]' "$pull"
          grep -Fq 'current-server migration runtime is incomplete' "$pull"
          grep -Fq 'def cloudpanel_database_server_ready_local(' "$pull"
          grep -Fq 'CURRENT_SERVER_CLOUDPANEL_DATABASE_SERVER_INCOMPLETE' "$pull"
          grep -Fq 'CLOUDPANEL_INCOMPLETE_DATABASE_SERVER' "$pull"
          grep -Fq 'CLOUDPANEL_ADMIN_REQUIRED' "$pull"
          grep -Fq 'def cloudpanel_user_count_local(' "$pull"
          grep -Fq 'cloudpanel_user_count_local() == 0' "$pull"
          grep -Fq 'new-server CloudPanel database server metadata is missing; migration cannot resume safely' "$pull"
          grep -Fq 'cloud_hint = local_cloud_hint()' "$pull"
          migration_core='dist/p07/0.1.0/overlay/lib/server_migration.py'
          grep -Fq 'if "vultr" in value:' "$migration_core"
          grep -Fq 'return "vultr"' "$migration_core"
          ! grep -Fq 'INSERT INTO database_server' "$pull"
          grep -Fq 'CloudPanel 已安装；首次使用必须先创建管理员' "$ui"
          grep -Fq '管理员密码只在当前服务器终端隐藏输入；不会发送给 ChatGPT，不写入 P07 日志。' "$ui"
          grep -Fq 'read -r -s password' "$ui"
          grep -Fq 'run_clpctl_root user:add' "$ui"
          grep -Fq 'CloudPanel 首次管理员与本机数据库服务器初始化完成' "$ui"
          grep -Fq 'CloudPanel 安装不完整：本机数据库服务器主记录缺失。' "$ui"
          grep -Fq '这台机器不能作为迁移目标继续使用' "$ui"
          grep -Fq '第一次连接旧服务器，需要输入旧服务器 root 密码一次' "$migration"
          grep -Fq '密码只交给系统 ssh-copy-id；P07 不读取、不保存。' "$migration"
          ! grep -Fq '现在为新服务器准备专用迁移密钥' "$migration"
          grep -Fq 'VFOPS_MIGRATION_PROGRESS=1' "$migration"
          grep -Fq 'run_migration_live' "$migration"
          grep -Fq '实时显示已传输量 / 百分比 / 速度' "$migration"
          grep -Fq -- '--info=progress2,stats2' "$pull"
          grep -Fq 'stream_to_stderr=show_progress' "$pull"
          grep -Fq 'def source_path_kind(' "$pull"
          grep -Fq 'remote_spec = remote' "$pull"
          grep -Fq 'target.rmdir()' "$pull"
          grep -Fq 'new-server external target type conflict' "$pull"
          grep -Fq 'old-server external path is not a regular file/directory' "$pull"
          grep -Fq '200 <= int(last_code) < 500' "$pull"
          grep -Fq 'else "LOCAL_HTTP_PROBE"' "$pull"
          grep -Fq 'def php_fpm_listener_for_domain(' "$pull"
          grep -Fq 'def reconcile_php_fpm_backend(' "$pull"
          grep -Fq 'def refresh_external_assets_from_source(' "$pull"
          grep -Fq '发现 {len(external_added_paths)} 个此前漏记的站点外部 Runtime / Storage，已加入原迁移任务' "$pull"
          grep -Fq '0/7 · 正在刷新旧服务器完整资产清单' "$pull"
          grep -Fq '"WEBROOT_SIBLING"' "$migration_core"
          grep -Fq '(".vf*", ".press*")' "$migration_core"
          grep -Fq 'def external_assets_for_site(' "$migration_core"
          grep -Fq '"reason": reason' "$migration_core"
          grep -Fq 'def refresh_migration_assets_from_source(' "$pull"
          grep -Fq 'old-server selected site structure changed during migration' "$pull"
          grep -Fq 'def pre_cutover_reconcile(' "$pull"
          grep -Fq 'pre-cutover completeness reconciliation failed' "$pull"
          grep -Fq 'def capture_source_http_baseline(' "$pull"
          grep -Fq 'def http_baseline_compatible(' "$pull"
          grep -Fq 'HTTP_BASELINE_REGRESSION' "$pull"
          grep -Fq 'SOURCE_HTTP_BASELINE_UNAVAILABLE' "$pull"
          grep -Fq '正在执行切换前完整性对账' "$pull"
          grep -Fq 'PHP_FPM_LISTENER_MISSING' "$pull"
          grep -Fq 'tcp_listener_ready' "$pull"
          grep -Fq 'systemctl", "start", service' "$pull"
          grep -Fq 'systemctl", "reload", service' "$pull"
          grep -Fq '"CUTOVER_FAILED_ROLLED_BACK"' "$pull"
          grep -Fq '继续这个迁移任务重试最终同步？[y/N]' "$migration"
          grep -Fq '可以继续使用同一个迁移任务重试；不会重新创建任务，也不会修改 DNS。' "$migration"
          grep -Fq 'render_indeterminate_bar' "$migration"
          grep -Fq 'run_quiet_with_progress' "$migration"
          grep -Fq '最终同步处理中' "$migration"
          grep -Fq '文件传输阶段会继续输出 rsync 百分比 / 速度' "$migration"
          grep -Fq 'def progress_note(' "$pull"
          grep -Fq '1/7 · 正在进入短维护窗口并保护旧服务器运行状态' "$pull"
          grep -Fq '7/7 · 正在逐站执行新服务器本地验证' "$pull"
          grep -Fq '安全恢复 · 正在恢复旧服务器运行状态' "$pull"
          grep -Fq 'new-server MySQL import failed' "$pull"
          grep -Fq 'new-server application DB config remap failed' "$pull"
          cloudpanel='dist/p07/0.1.0/overlay/lib/cloudpanel.py'
          grep -Fq 'env["SUDO_USER"] = "root"' "$cloudpanel"
          grep -Fq 'MEMORY_BELOW_CLOUDPANEL_PUBLISHED_BASELINE' "$pull"
          ! grep -Fq 'raise PullMigrationError("memory is below CloudPanel minimum")' "$pull"
          grep -Fq 'show_bootstrap_blocker' "$ui"
          grep -Fq '检测到这台服务器已经存在网站或数据库环境' "$ui"
          grep -Fq '这不是低配限制' "$ui"
          ! grep -Fq '当前服务器不满足自动安装 CloudPanel 的条件。' "$ui"
          grep -Fq 'existing_environment' "$pull"
