          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          empty=subprocess.CompletedProcess(["clpctl"],0,stdout="",stderr="")
          with mock.patch.object(
              mod, "_clpctl_commands", side_effect=lambda action: [[action]]
          ), mock.patch.object(
              mod, "_run_clp_probe", side_effect=[empty, empty]
          ), mock.patch.object(
              mod, "_cloudpanel_stored_master_password", return_value="stored-secret"
          ):
              assert mod._try_clp_credentials() == (
                  "root","stored-secret","127.0.0.1",3306
              )

          print("P07_CLOUDPANEL_STORED_MASTER_CREDENTIAL=PASS")
          PY

      - name: CloudPanel credential probe timeout is fail-closed
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import importlib.util
          import subprocess
          from pathlib import Path
          path=Path("packages/p07-system-care/0.1.0-rc46/lib/resource_apply.py")
          spec=importlib.util.spec_from_file_location("resource_apply_rc32_timeout", path)
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          mod._clpctl_commands=lambda action: [[action]]

          original=mod._run
          calls=[]
          def first_timeout_then_password(cmd, *, env=None, timeout=15.0, check=True):
              calls.append(tuple(cmd))
              if cmd[-1] == "db:show:master-credentials":
                  raise subprocess.TimeoutExpired(cmd, timeout)
              if cmd[-1] == "db:show:master-password":
                  return subprocess.CompletedProcess(cmd, 0, stdout="Password: fallback-secret\n", stderr="")
              raise AssertionError(cmd)
          mod._run=first_timeout_then_password
          try:
              got=mod._try_clp_credentials()
              assert got == ("root","fallback-secret","127.0.0.1",3306), got
              assert not any("db:show:credentials" in x for call in calls for x in call)
          finally:
              mod._run=original

          def always_timeout(cmd, *, env=None, timeout=15.0, check=True):
              raise subprocess.TimeoutExpired(cmd, timeout)
          mod._run=always_timeout
          try:
              try:
                  mod._try_clp_credentials()
              except mod.ApplyBlocked as exc:
                  assert str(exc) == "MYSQL_MASTER_CREDENTIAL_LOOKUP_TIMEOUT", exc
              else:
                  raise AssertionError("timeout was not fail-closed")
          finally:
              mod._run=original
          print("P07_CLOUDPANEL_AUTH_TIMEOUT=PASS")
          PY

