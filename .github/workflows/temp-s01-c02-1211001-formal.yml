name: S01-C02 V1.21.1001 Formal Release

on:
  push:
    branches:
      - release/s01-c02-1211001-formal
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_REPOSITORY: llhzx2018/vf-tools-ops
      TARGET_SHA: 0db9ac94f400b7055bc8d5e5d88c30d5a5667712
      PROMOTED_MAIN_SHA: 448174506f0696d25b4c327c581a0136c4cdef61
      TARGET_VERSION: 1.21.1001
      RELEASE_TAG: v1.21.1001
      ASSET_NAME: vf-tools-ops_V1.21.1001.zip
      TESTED_RUN_ID: '36989829765'
      TESTED_ARTIFACT: s01-c02-v1.21.1001-technical-responsive-consistency
      EXPECTED_BYTES: '3475909'
      EXPECTED_SHA256: 0ddc1da02a0ae647522dbaca04a3deb037302c5223ae60e185c31afea84d157e
      EXPECTED_RUNTIME_FILES: '975'
      EXPECTED_RUNTIME_FP: 65cad1eafdd4e79e7d724db5f6c25c3e7c28c23612628a1a844078d7449fda12
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}

    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ env.READ_TOKEN }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Verify promotion and exact candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n' < target/VERSION)" = "$TARGET_VERSION"
          test "$(GH_TOKEN="$READ_TOKEN" gh api "repos/$TARGET_REPOSITORY/branches/main" --jq '.commit.sha')" = "$PROMOTED_MAIN_SHA"
          GH_TOKEN="$READ_TOKEN" gh api "repos/$TARGET_REPOSITORY/commits/$PROMOTED_MAIN_SHA" --jq '.parents[].sha' | grep -Fx "$TARGET_SHA" >/dev/null
          mkdir tested
          gh run download "$TESTED_RUN_ID" --repo llhzx2018/core-free-runner-public --name "$TESTED_ARTIFACT" --dir tested
          jq -e --arg sha "$TARGET_SHA" --arg ver "$TARGET_VERSION" '
            .status=="PASS" and
            .candidate_sha==$sha and
            .candidate_version==$ver and
            .responsive_consistency.result=="PASS" and
            .responsive_consistency.checks==7 and
            .responsive_consistency.owner_product_pass==false and
            .upgrade=="PASS" and
            .frozen_shell_header_menu=="PASS" and
            .production=="NOT_EXECUTED"
          ' tested/FINAL_EVIDENCE.json >/dev/null
          test "$(stat -c %s "tested/$ASSET_NAME")" = "$EXPECTED_BYTES"
          test "$(sha256sum "tested/$ASSET_NAME" | awk '{print $1}')" = "$EXPECTED_SHA256"
          unzip -tq "tested/$ASSET_NAME" >/dev/null
          echo EXACT_CANDIDATE=PASS

      - name: Publish formal release
        shell: bash
        env:
          GH_TOKEN: ${{ env.WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          cat > notes.md <<'EOF'
          S01-C02 · VF Tools Ops · V1.21.1001

          Technical & Indexing · Responsive Consistency Closure
          - 修复同一页面在不同 WordPress 后台宽度下出现两套头部/优先任务显示方式
          - 技术页改为单一 source-rendered command bar，不再依赖 R18 搬移本地 Hero
          - 1218 / 1051 / 993 保持同一桌面结构
          - 900 / 768 / 390 只堆叠同一组组件，不再产生第二套页面模式
          - “查看其余”与“专业边界”展开/收起不会改变页面头与当前优先区域
          - Shell / Header / Header Menu 冻结不变
          - 1.21.1000 → 1.21.1001 upgrade preservation PASS
          - 7-width responsive consistency proof PASS
          - exact source: 0db9ac94f400b7055bc8d5e5d88c30d5a5667712
          - main promotion: 448174506f0696d25b4c327c581a0136c4cdef61
          - Candidate Gate: 36989829765

          OWNER Preview = N_A under bounded reversible files-only Admin UX/UI continuous-delivery authority.
          OWNER Real Use / Product Acceptance remain post-Production and are not claimed PASS.
          EOF
          if gh api "repos/$TARGET_REPOSITORY/releases/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh api "repos/$TARGET_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$TARGET_SHA"
          else
            gh release create "$RELEASE_TAG" "tested/$ASSET_NAME" --repo "$TARGET_REPOSITORY" --target "$TARGET_SHA" --title "VF Tools Ops V1.21.1001" --notes-file notes.md
          fi

      - name: Remote readback
        shell: bash
        env:
          GH_TOKEN: ${{ env.WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          JSON="$(gh api "repos/$TARGET_REPOSITORY/releases/tags/$RELEASE_TAG")"
          RID="$(jq -r '.id' <<<"$JSON")"
          AID="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.id' <<<"$JSON")"
          SIZE="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.size' <<<"$JSON")"
          PUB="$(jq -r '.published_at' <<<"$JSON")"
          test "$(gh api "repos/$TARGET_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$TARGET_SHA"
          test "$SIZE" = "$EXPECTED_BYTES"
          mkdir readback
          gh release download "$RELEASE_TAG" --repo "$TARGET_REPOSITORY" --pattern "$ASSET_NAME" --dir readback --clobber
          test "$(sha256sum "readback/$ASSET_NAME" | awk '{print $1}')" = "$EXPECTED_SHA256"
          unzip -tq "readback/$ASSET_NAME" >/dev/null
          echo FORMAL_RELEASE_REMOTE_READBACK=PASS
          echo RELEASE_ID=$RID
          echo ASSET_ID=$AID
          echo PUBLISHED_AT=$PUB
          echo ASSET_BYTES=$SIZE
          echo ASSET_SHA256=$EXPECTED_SHA256
          echo RUNTIME_FILES=$EXPECTED_RUNTIME_FILES
          echo RUNTIME_FINGERPRINT=$EXPECTED_RUNTIME_FP
