name: P01 Watch Fallback Poster Gate V2
on:
  push:
    branches: [task/p01-watch-fallback-poster-gate-20260831]
    paths: [.github/workflows/p01-watch-fallback-poster-gate-v2-20260831.yml]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE: 45a9ddd68932db5ecbf9acbf1c212bf29f44e4e9
      TREE: ca3bc1a41d7cc2102c6254ad6ec7f8ed6a539735
      BASE: 279e5a2a40f735ac1b917aeec9574fadecd23b61
      ROOT: /tmp/p01-watch-fallback-v2
      EVID: /tmp/p01-watch-fallback-v2-evid
      PORT: '18412'
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Exact source and one-file fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$SOURCE"
          test "$(git -C product rev-parse HEAD^{tree})" = "$TREE"
          test "$(git -C product merge-base "$BASE" HEAD)" = "$BASE"
          test "$(git -C product diff --name-only "$BASE"...HEAD)" = src/assets/resource-media.css
          test "$(cat product/VERSION)" = '2.35.0'
          grep -F 'Watch fallback poster identity' product/src/assets/resource-media.css >/dev/null
          echo P01_WATCH_FALLBACK_SOURCE_FENCE=PASS
      - name: Fresh Watch fixture with one real cover
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$ROOT" "$EVID" /tmp/p01-watch-fallback-v2.cookies
          mkdir -p "$EVID"
          cp -a product/src "$ROOT"
          php -S 127.0.0.1:$PORT -t "$ROOT" >"$EVID/server.log" 2>&1 & echo $! >/tmp/p01-watch-fallback-v2.pid
          for i in $(seq 1 60); do curl -fsS -c /tmp/p01-watch-fallback-v2.cookies -b /tmp/p01-watch-fallback-v2.cookies "http://127.0.0.1:$PORT/setup.php" -o /tmp/p01-watch-fallback-v2-setup.html && break; sleep .25; done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-watch-fallback-v2-setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c /tmp/p01-watch-fallback-v2.cookies -b /tmp/p01-watch-fallback-v2.cookies -X POST "http://127.0.0.1:$PORT/setup.php" --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=Watch Fallback Gate V2' --data-urlencode 'admin_password=WatchFallback2026' --data-urlencode 'admin_password_confirm=WatchFallback2026' -o /tmp/p01-watch-fallback-v2-post.html
          php "$ROOT/cli/verify.php" | grep -Fx VERIFY_PASS=YES >/dev/null
          cat >/tmp/p01-watch-fallback-v2-seed.php <<'PHP'
          <?php
          require '/tmp/p01-watch-fallback-v2/app/bootstrap.php';
          require_once '/tmp/p01-watch-fallback-v2/app/SurfaceRepository.php';
          $db=vf_db();$r=new VfRepository($db);$s=new VfSurfaceRepository($db);
          $c=$r->createCategory(['name'=>'影视验证','description'=>'','is_private'=>false]);$ids=[];
          foreach(['城市电影','山海剧集','历史纪录片','人物纪录片','喜剧电影'] as $i=>$title){$x=$r->saveLink(null,['category_id'=>$c,'title'=>$title,'url'=>'https://example.com/watch-fallback-'.$i,'description'=>'影视条目','tags'=>'影视','is_private'=>$i===4,'is_favorite'=>$i===0],'manual');$ids[]=(int)$x['id'];$s->upsertProfile((int)$x['id'],['surface'=>'watch','resource_kind'=>$i===2||$i===3?'纪录片':($i===1?'剧集':'电影'),'media_year'=>2021+$i,'media_status'=>$i%2?'watched':'watching','note'=>'海报 fallback 验证']);}
          $dir=VF_PRIVATE_ROOT.'/resource-assets/covers';if(!is_dir($dir))mkdir($dir,0750,true);$png=base64_decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=');$file='watch-gate-real-cover.png';$path=$dir.'/'.$file;file_put_contents($path,$png);$hash=hash_file('sha256',$path);$now=gmdate('c');$stmt=$db->prepare("INSERT INTO resource_asset_files(link_id,asset_kind,file_name,original_name,mime_type,byte_size,width,height,file_hash,created_at,updated_at) VALUES(?,'cover',?,'watch-gate-real-cover.png','image/png',?,1,1,?,?,?)");$stmt->execute([$ids[0],$file,filesize($path),$hash,$now,$now]);echo "P01_WATCH_FALLBACK_SEED=PASS\n";
          PHP
          php /tmp/p01-watch-fallback-v2-seed.php | grep -Fx P01_WATCH_FALLBACK_SEED=PASS
      - name: Chromium fallback identity, real poster, responsive gate
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-watch-fallback-v2-pw && cd /tmp/p01-watch-fallback-v2-pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat >gate.cjs <<'JS'
          const {chromium}=require('playwright'),fs=require('fs');
          (async()=>{const b=await chromium.launch({headless:true});const c=await b.newContext({viewport:{width:1440,height:900}});const login=await c.request.post('http://127.0.0.1:18412/api.php?action=login',{data:{password:'WatchFallback2026'}});if(!login.ok()||!(await login.json()).ok)throw Error('login');const p=await c.newPage(),metrics={};
          for(const [w,h,size] of [[1440,900,'1440'],[390,844,'390']]){await p.setViewportSize({width:w,height:h});await p.goto('http://127.0.0.1:18412/watch.php',{waitUntil:'networkidle'});await p.waitForTimeout(180);for(const theme of ['light','dark']){await p.evaluate(t=>document.documentElement.setAttribute('data-theme',t),theme);await p.waitForTimeout(100);const m=await p.evaluate(()=>{const posters=[...document.querySelectorAll('.vf-watch-poster')],fallbacks=[...document.querySelectorAll('.vf-watch-poster>b')],images=[...document.querySelectorAll('.vf-watch-poster>img')];if(!fallbacks[0]||!images[0])return{missing:true,count:posters.length,fallbacks:fallbacks.length,images:images.length};const fb=fallbacks[0],cs=getComputedStyle(fb),after=getComputedStyle(fb,'::after'),poster=getComputedStyle(fb.parentElement),img=images[0],ics=getComputedStyle(img),ir=img.getBoundingClientRect(),pr=img.parentElement.getBoundingClientRect();return{count:posters.length,fallbacks:fallbacks.length,images:images.length,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,width:Math.round(fb.getBoundingClientRect().width),height:Math.round(fb.getBoundingClientRect().height),opacity:cs.opacity,after:after.content,posterBg:poster.backgroundImage,imgObjectFit:ics.objectFit,imgWidth:Math.round(ir.width),imgHeight:Math.round(ir.height),posterWidth:Math.round(pr.width),posterHeight:Math.round(pr.height),naturalWidth:img.naturalWidth};});if(m.missing||m.count!==5||m.fallbacks!==4||m.images!==1||m.overflow>1||m.opacity!=='1'||m.after!=='"影视"')throw Error(`${size}-${theme} ${JSON.stringify(m)}`);const expected=size==='390'?[40,52]:[48,62];if(Math.abs(m.width-expected[0])>1||Math.abs(m.height-expected[1])>1)throw Error(`${size}-${theme}-badge ${JSON.stringify(m)}`);if(!m.posterBg||m.posterBg==='none')throw Error(`${size}-${theme}-fallback-bg ${JSON.stringify(m)}`);const dw=m.posterWidth-m.imgWidth,dh=m.posterHeight-m.imgHeight;if(m.imgObjectFit!=='cover'||m.naturalWidth<1||dw<0||dh<0||dw>2||dh>2)throw Error(`${size}-${theme}-real-cover ${JSON.stringify(m)}`);metrics[`${size}-${theme}`]=m;await p.screenshot({path:`${process.env.EVID}/watch-${size}-${theme}.png`,fullPage:true});}}
          fs.writeFileSync(process.env.EVID+'/metrics.json',JSON.stringify(metrics,null,2));fs.writeFileSync(process.env.EVID+'/verdict.txt',`P01_WATCH_FALLBACK_POSTER=PASS\nSOURCE=${process.env.SOURCE}\n`);await b.close();console.log('P01_WATCH_FALLBACK_POSTER=PASS');})().catch(e=>{console.error(e);process.exit(1)});
          JS
          EVID="$EVID" SOURCE="$SOURCE" node gate.cjs 2>&1 | tee "$EVID/result.txt"
          grep -Fx P01_WATCH_FALLBACK_POSTER=PASS "$EVID/result.txt"
      - name: Regression and SQLite through application authority
        shell: bash
        run: |
          set -Eeuo pipefail
          php "$ROOT/cli/verify.php" | tee "$EVID/verify.txt" | grep -Fx VERIFY_PASS=YES
          php "$ROOT/cli/surface-verify.php" | tee "$EVID/surface-verify.txt" | grep -Fx CURRENT_DOMAIN_PASS=YES
          cat >/tmp/p01-watch-fallback-v2-dbcheck.php <<'PHP'
          <?php
          require '/tmp/p01-watch-fallback-v2/app/bootstrap.php';$db=vf_db();if((string)$db->query('PRAGMA integrity_check')->fetchColumn()!=='ok')exit(2);$fk=$db->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC);if($fk)exit(3);echo "P01_WATCH_FALLBACK_SQLITE=PASS\n";
          PHP
          php /tmp/p01-watch-fallback-v2-dbcheck.php | tee "$EVID/sqlite.txt" | grep -Fx P01_WATCH_FALLBACK_SQLITE=PASS
          echo P01_WATCH_FALLBACK_REGRESSION=PASS | tee "$EVID/regression.txt"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-watch-fallback-poster-v2-${{ github.run_id }}
          path: ${{ env.EVID }}
          if-no-files-found: error
          retention-days: 30
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/p01-watch-fallback-v2.pid 2>/dev/null)" 2>/dev/null || true
