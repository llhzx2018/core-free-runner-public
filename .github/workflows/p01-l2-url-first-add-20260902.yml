name: P01 L2 URL First Add
on:
  push:
    branches: [run/p01-url-first-add-20260902]
    paths: [.github/workflows/p01-l2-url-first-add-20260902.yml]
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: run/p01-url-first-add-20260902
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: product/p01-url-first-add-20260902
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Fresh source fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = 00a96a449a6f78b44b705555a51be494d64e1130
          test "$(git -C product rev-parse origin/develop)" = 00a96a449a6f78b44b705555a51be494d64e1130
      - name: Apply product patch
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          python3 ../runner/scripts/p01_url_first_add_patch.py
      - name: Verify exact product contract
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          php -l src/workspace-create.php >/dev/null
          node --check src/assets/workspace-create-bundle.js
          git diff --check
          grep -F 'function vf_workspace_create_title' src/workspace-create.php >/dev/null
          grep -F "if (\$title !== '' || \$surface !== 'start') return \$title;" src/workspace-create.php >/dev/null
          grep -F "preg_replace('/^www\\./i', '', \$host)" src/workspace-create.php >/dev/null
          grep -F '网址标题不能为空。' src/app/Repository.php >/dev/null
          grep -F "title.required=!start" src/assets/workspace-create-bundle.js >/dev/null
          grep -F "title.placeholder=start?'可不填，系统先用域名作为标题':'资源标题'" src/assets/workspace-create-bundle.js >/dev/null
          grep -F "copy.textContent='导航网址可只填网址；标题留空时先用域名。'" src/assets/workspace-create-bundle.js >/dev/null
          grep -F 'vf-add-more-toggle' src/assets/workspace-create-bundle.js >/dev/null
          grep -F '.vf-add-quickbar' src/assets/resource-actions.css >/dev/null
          test "$(git diff --name-only -- src/VERSION.txt VF_PROJECT.json database src/migrations | wc -l | tr -d ' ')" = 0
          git diff --name-only | sort | tee /tmp/changed.txt
          expected=$(printf '%s\n' src/assets/resource-actions.css src/assets/workspace-create-bundle.js src/workspace-create.php | sort)
          test "$(cat /tmp/changed.txt)" = "$expected"
          echo 'URL FIRST ADD PASS'
      - name: Commit and push candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add src/workspace-create.php src/assets/workspace-create-bundle.js src/assets/resource-actions.css
          git commit -m 'feat(P01): make navigation add URL-first'
          git push origin HEAD:product/p01-url-first-add-20260902
          echo "CANDIDATE=$(git rev-parse HEAD)"
          echo "TREE=$(git rev-parse HEAD^{tree})"
