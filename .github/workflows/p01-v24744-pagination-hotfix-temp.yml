name: p01-v24744-pagination-hotfix-temp

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v24744-pagination-hotfix-temp.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      BASE_SHA: 221301fba18dd3c73307ecf06b3f9185630ff485
      TARGET_SHA: fb61ae26454f908b17c6f6a69fb617470aedbccb
    steps:
      - name: Checkout exact hotfix
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          for name in baseline current; do
            git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "$name"
          done
          git -C baseline fetch -q --depth 1 origin "$BASE_SHA"
          git -C baseline checkout -q --detach FETCH_HEAD
          git -C current fetch -q --depth 1 origin "$TARGET_SHA"
          git -C current checkout -q --detach FETCH_HEAD
          test "$(tr -d '\r\n ' < current/VERSION)" = "2.47.44"
          test "$(tr -d '\r\n ' < current/src/VERSION.txt)" = "2.47.44"
          grep -F "define('VF_VERSION', '2.47.44');" current/src/app/bootstrap.php >/dev/null
          echo P01_V24744_EXACT_SOURCE=PASS

      - name: Verify bounded hotfix diff
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C current fetch -q --depth 1 origin "$BASE_SHA"
          git -C current diff --name-only "$BASE_SHA" "$TARGET_SHA" | sort >/tmp/actual.txt
          cat >/tmp/expected.txt <<'EOF'
          VERSION
          src/VERSION.txt
          src/app/bootstrap.php
          src/assets/admin-consolidation.css
          tests/unit/admin_data_safety_pagination_visibility_v24744_contract.php
          tests/unit/engineering_consistency_r80_contract.php
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          echo P01_V24744_BOUNDED_DIFF=PASS

      - name: Focused regression contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          php tests/unit/admin_data_safety_pagination_visibility_v24744_contract.php
          php tests/unit/admin_data_safety_page8_polish_contract.php
          php tests/unit/admin_data_safety_r13_contract.php
          php tests/unit/admin_data_safety_r14_runtime_retention_contract.php
          php tests/unit/backup_policy_desktop_disclosure_contract.php
          php tests/unit/engineering_consistency_r80_contract.php
          node --check current/src/assets/admin-consolidation.js
          echo P01_V24744_FOCUSED=PASS

      - name: Canonical zero-debt guard
        shell: bash
        run: |
          set -Eeuo pipefail
          bash current/tests/canonical_release_regression.sh current baseline --require-zero-debt | tee /tmp/canonical.txt
          grep -q '^P01_CANONICAL_CURRENT_FAILURE_COUNT=0$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_NEW_REGRESSION_COUNT=0$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_LEGACY_TEST_DEBT_COUNT=0$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS$' /tmp/canonical.txt
          echo P01_V24744_CANONICAL=PASS
