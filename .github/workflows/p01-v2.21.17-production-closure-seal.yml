name: P01 V2.21.17 Production Closure Seal

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p01-v2.21.17-production-closure-seal.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  P01_BRANCH: maintenance/post-seal-health-2.21.17-20260816
  PREV_AUTHORITY_HEAD: 761d0e94031ce116b11a534c4daee5ac8c782f78
  PRODUCT_COMMIT: 89f55e9a772904ebe03537ec54c2891e13a52c80
  PRODUCT_TREE: 184738a87e5bdf9a4d2cd912933f6a935dcc9038
  REMOTE_MAIN: 4c908ae6a32ed0855751bbe809c8b204d957aba1
  REMOTE_DEVELOP: 4c908ae6a32ed0855751bbe809c8b204d957aba1
  RELEASE_ID: '371276138'
  UPDATE_BYTES: '1043007'
  UPDATE_SHA: dec98a321dcfba560f1055c34fabbcee454b37ea9ab41886c09fd0f4f5cddeac
  FULL_BYTES: '479778'
  FULL_SHA: 8bcd6765236ceab1e555f369a919192af3131ae7da0a27058adc847878c51c63
  CORE_UPDATES_COMMIT: 92adb4319a720f31c35cd5fd270bc47e9f8d18a2

jobs:
  closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Credential gate
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"
          echo 'CREDENTIAL_GATE=PASS'

      - name: Checkout exact current Candidate Authority branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.P01_BRANCH }}
          token: ${{ env.WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: p01

      - name: Guard product identity and authority parent
        run: |
          set -Eeuo pipefail
          test "$(git -C p01 rev-parse HEAD)" = "$PREV_AUTHORITY_HEAD"
          test "$(git -C p01 rev-parse "$PRODUCT_COMMIT^{tree}")" = "$PRODUCT_TREE"
          test "$(tr -d '\r\n' < p01/VERSION)" = '2.21.17'
          test "$(tr -d '\r\n' < p01/src/VERSION.txt)" = '2.21.17'
          test -z "$(git -C p01 diff --name-only "$PRODUCT_COMMIT" HEAD -- src)"
          echo 'PRODUCT_IDENTITY_UNCHANGED=PASS'

      - name: Current remote truth readback
        run: |
          set -Eeuo pipefail
          main="$(gh api repos/llhzx2018/vf-start/git/ref/heads/main --jq .object.sha)"
          develop="$(gh api repos/llhzx2018/vf-start/git/ref/heads/develop --jq .object.sha)"
          test "$main" = "$REMOTE_MAIN"
          test "$develop" = "$REMOTE_DEVELOP"

          gh api repos/llhzx2018/vf-start/git/ref/tags/v2.21.17 > /tmp/tag.json
          gh api repos/llhzx2018/vf-start/releases/tags/v2.21.17 > /tmp/release.json
          test "$(jq -r '.object.sha' /tmp/tag.json)" = "$PRODUCT_COMMIT"
          jq -e --arg c "$PRODUCT_COMMIT" --argjson id "$RELEASE_ID" '.id==$id and .tag_name=="v2.21.17" and .target_commitish==$c and .draft==false and .prerelease==false' /tmp/release.json >/dev/null
          jq -e --arg sha "$UPDATE_SHA" --argjson bytes "$UPDATE_BYTES" '.assets[]|select(.name=="VF_Start_V2.21.17_UPDATE.zip")|(.size==$bytes and .digest==("sha256:"+$sha))' /tmp/release.json >/dev/null
          jq -e --arg sha "$FULL_SHA" --argjson bytes "$FULL_BYTES" '.assets[]|select(.name=="VF_Start_V2.21.17_FULL.zip")|(.size==$bytes and .digest==("sha256:"+$sha))' /tmp/release.json >/dev/null

          core="$(gh api repos/llhzx2018/core-updates/git/ref/heads/main --jq .object.sha)"
          test "$core" = "$CORE_UPDATES_COMMIT"
          gh api 'repos/llhzx2018/core-updates/contents/projects/P01.json?ref=main' --jq .content | tr -d '\n' | base64 -d > /tmp/P01.json
          jq -e --arg sha "$UPDATE_SHA" --argjson bytes "$UPDATE_BYTES" --argjson rid "$RELEASE_ID" '.project_id=="P01" and .target_version=="2.21.17" and .from_versions==["2.21.16"] and .schema_from=="2026080902" and .schema_to=="2026080902" and .release_tag=="v2.21.17" and .asset_name=="VF_Start_V2.21.17_UPDATE.zip" and .asset_bytes==$bytes and .asset_sha256==$sha and .release_id==$rid and .release_identity=="v2.21.17@89f55e9a772904ebe03537ec54c2891e13a52c80"' /tmp/P01.json >/dev/null
          echo 'REMOTE_RELEASE_AND_CORE_UPDATES=PASS'

      - name: Read-only Production public version readback
        run: |
          set -Eeuo pipefail
          curl -fsS --connect-timeout 10 --max-time 30 -H 'Accept: application/json' 'https://start.kewaro.com/api.php?action=bootstrap' -o /tmp/bootstrap.json
          jq -e '.ok==true and .version=="2.21.17"' /tmp/bootstrap.json >/dev/null
          echo 'PRODUCTION_PUBLIC_VERSION=2.21.17'
          echo 'PRODUCTION_WRITE=0'

      - name: Write V2.21.17 final Authority and closure evidence
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, os, re

          root=Path('p01')
          product=os.environ['PRODUCT_COMMIT']
          tree=os.environ['PRODUCT_TREE']
          main=os.environ['REMOTE_MAIN']
          develop=os.environ['REMOTE_DEVELOP']
          release_id=int(os.environ['RELEASE_ID'])
          update_bytes=int(os.environ['UPDATE_BYTES'])
          update_sha=os.environ['UPDATE_SHA']
          full_bytes=int(os.environ['FULL_BYTES'])
          full_sha=os.environ['FULL_SHA']
          core=os.environ['CORE_UPDATES_COMMIT']
          branch=os.environ['P01_BRANCH']
          upgrade_time='2026-08-16 17:11:23 +08:00'

          # VF_PROJECT.json: current-state semantics only; historical evidence objects remain unless replaced below.
          p=root/'VF_PROJECT.json'
          d=json.loads(p.read_text(encoding='utf-8'))
          d['status']='V2.21.17 PRODUCTION / FINAL ONLINE PASS / CLOSED'
          d['production_version']='2.21.17'
          d['working_version']=None
          d['candidate_version']=None
          d['candidate_state']='NONE / V2.21.17 RELEASED TO PRODUCTION'
          d['current_phase']='STABLE_OPERATIONS / V2.21.17 PRODUCTION CLOSED'
          d['current_authority']='V2.21.17 PRODUCTION CLOSURE SEAL'
          d['current_state']='PRODUCTION 2.21.17 = LATEST 2.21.17 / CLOSED'
          d['lifecycle']='STABLE_OPERATIONS / CLOSED'
          d['verified_release_ready']=True
          d['release_ready']='RELEASED / CLOSED'
          d['formal_artifact_gate']='PASS'
          d['release_authorization']='AUTHORIZED / EXECUTED / CLOSED'
          d.setdefault('authority',{})['v2_21_17_production_closure']='docs/evidence/V2.21.17_PRODUCTION_CLOSURE_20260816.md'
          d['production_gates']={
              'scope':'V2.21.17 PRODUCTION CLOSURE',
              'formal_release':'PASS',
              'online_discovery':'PASS / MASTER-CONFIRMED PRODUCTION BACKEND',
              'production_atomic_upgrade':'PASS / 2.21.16 -> 2.21.17',
              'production_version_readback':'PASS / 2.21.17',
              'production_latest_readback':'PASS / 2.21.17',
              'production_equals_latest':'YES',
              'schema':'2026080902 / UNCHANGED',
              'upgrade_history':'PASS / 2026-08-16 17:11:23 +08:00',
              'product_failure':'NONE',
              'project_block':'NONE'
          }
          d['production_closure']={
              'version':'2.21.17',
              'latest':'2.21.17',
              'schema':'2026080902',
              'online_discovery':'PASS',
              'production_upgrade':'PASS',
              'production_version_readback':'PASS',
              'production_equals_latest':True,
              'upgrade_history':{
                  'from':'2.21.16','to':'2.21.17','result':'success','timestamp':upgrade_time,
                  'authority':'MASTER-CONFIRMED PRODUCTION SCREENSHOT'
              },
              'public_bootstrap_readback':'PASS / 2.21.17',
              'browser_extension_boundary':'1.6.4 / UNCHANGED',
              'rollback':'NOT REQUIRED / SUCCESSFUL UPGRADE'
          }
          d['release']={
              'scope':'V2.21.17 CURRENT FORMAL RELEASE',
              'tag':'v2.21.17','release_id':release_id,
              'candidate_commit':product,'candidate_tree':tree,
              'update_asset':'VF_Start_V2.21.17_UPDATE.zip','update_bytes':update_bytes,'update_sha256':update_sha,
              'full_asset':'VF_Start_V2.21.17_FULL.zip','full_bytes':full_bytes,'full_sha256':full_sha,
              'release_identity':'PASS / IMMUTABLE BY VF RELEASE CONTRACT'
          }
          d['update_system']={
              'project_id':'P01','component_id':'APP',
              'source_version':'2.21.16','target_version':'2.21.17','production_version':'2.21.17',
              'schema_from':'2026080902','schema_to':'2026080902',
              'manifest_truth':'llhzx2018/core-updates/projects/P01.json',
              'release_truth':'GitHub Release v2.21.17',
              'formal_tag':'v2.21.17','candidate_commit':product,
              'update_asset':'VF_Start_V2.21.17_UPDATE.zip','update_asset_bytes':update_bytes,'update_asset_sha256':update_sha,
              'core_updates':'2.21.17 / VERIFIED','core_updates_commit':core,
              'production_discovery':'PASS','production_upgrade':'PASS','production_equals_latest':'YES',
              'legacy_bridge':'RETIRED / NOT REINTRODUCED',
              'browser_extension_unit':'INDEPENDENT / 1.6.4 / UNCHANGED'
          }
          d['git_closure']={
              'scope':'V2.21.17 PRODUCTION CLOSURE / AUTHORITY-ONLY',
              'remote_main':main,'remote_develop':develop,
              'candidate_authority_branch':branch,
              'candidate_product_identity':product,'candidate_product_tree':tree,
              'product_source_changed_after_candidate_identity':False,
              'main_promotion':'NOT EXECUTED IN THIS CLOSURE DIRECTIVE',
              'develop_promotion':'NOT EXECUTED IN THIS CLOSURE DIRECTIVE',
              'note':'Remote main/develop are recorded exactly; this closure does not misstate unexecuted Git promotion as PASS.'
          }
          d['vf_release_executed']=True
          d['formal_release_complete']=True
          d['formal_tag_created']=True
          d['publication_completed']=True
          d['production_deployed']=True
          d['production_exact_reconciliation']='NOT EXECUTED / NOT REQUIRED BY THIS CLOSURE DIRECTIVE'
          d['main_updated']=False
          d['develop_updated']=False
          d['main_alignment']='NOT EXECUTED FOR V2.21.17 / REMOTE main REMAINS '+main
          d['final_online_pass']='YES'
          d['repository_block']=[]
          d['project_block']=[]
          d['product_failure']='NONE CONFIRMED'
          d['next_action']='STOP FOR MASTER / P01 V2.21.17 CLOSED'
          d['v2_21_17_production_closure']={
              'formal_release':'PASS','online_discovery':'PASS','production_upgrade':'PASS','production_version_readback':'PASS',
              'production_current':'2.21.17','production_latest':'2.21.17','production_equals_latest':'YES',
              'schema':'2026080902','upgrade_from':'2.21.16','upgrade_to':'2.21.17','upgrade_result':'success','upgrade_time':upgrade_time,
              'release_tag':'v2.21.17','release_id':release_id,'release_product_commit':product,'release_product_tree':tree,
              'update_asset':'VF_Start_V2.21.17_UPDATE.zip','update_bytes':update_bytes,'update_sha256':update_sha,
              'core_updates_commit':core,'core_updates_identity':'PASS',
              'product_failure':'NONE','project_block':'NONE','status':'CLOSED'
          }
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          current=f'''# P01 · VF Start · Current Authority Overlay\n\n> 更新时间：2026-08-16 17:11:23 +08:00\n> 状态：CURRENT / V2.21.17 PRODUCTION CLOSED\n> 本文件是当前 Production / Release / Online Update / Closure 的最高优先级状态覆盖；历史 SSOT 与矩阵中的旧 CURRENT 仅作为历史证据。\n\n## 最终状态\n\n```text\nProject: P01 · VF Start\nRepository: llhzx2018/vf-start\n\nProduction Current: 2.21.17\nLatest: 2.21.17\nProduction = Latest: YES\nSchema: 2026080902 / UNCHANGED\nBrowser Helper: 1.6.4 / UNCHANGED\n\nFormal Release: PASS\nOnline Discovery: PASS\nProduction Upgrade: PASS\nProduction Version Readback: PASS\nFinal Online Pass: YES\nProduct Failure: NONE\nProject Block: NONE\nStatus: CLOSED\n```\n\n## Release Identity\n\n```text\nCandidate Product Commit: {product}\nCandidate Product Tree: {tree}\nTag: v2.21.17\nRelease ID: {release_id}\nUPDATE: VF_Start_V2.21.17_UPDATE.zip\nUPDATE bytes: {update_bytes}\nUPDATE SHA-256: {update_sha}\nFULL: VF_Start_V2.21.17_FULL.zip\nFULL bytes: {full_bytes}\nFULL SHA-256: {full_sha}\n```\n\nRelease / Tag / Asset identity 已发布并按 vf-release V2.2 合同封为不可变身份，本轮未重新发布、覆盖或替换任何正式资产。\n\n## core-updates Identity\n\n```text\nRepository: llhzx2018/core-updates\nCommit: {core}\nCurrent source: 2.21.16\nTarget: 2.21.17\nSchema: 2026080902 -> 2026080902\nRelease: v2.21.17\nAsset: VF_Start_V2.21.17_UPDATE.zip\nbytes: {update_bytes}\nSHA-256: {update_sha}\nRelease ID: {release_id}\n```\n\n## Production Upgrade Result\n\n主控已根据真实 Production 后台截图确认：\n\n```text\nProduction Current: 2.21.17\nLatest: 2.21.17\nUpgrade History: 2.21.16 -> 2.21.17\nResult: success\nTime: {upgrade_time}\n```\n\n公共只读 `bootstrap` 同步回读为 `2.21.17`。本轮封板没有再次执行 Production Upgrade。\n\n## Git Remote Truth\n\n```text\nmain: {main}\ndevelop: {develop}\nAuthority Branch: {branch}\nProduct Identity: {product}\nProduct Source Changed After Product Identity: NO\n```\n\n本轮只做 Authority-only Production Closure Seal，未执行 `main` / `develop` 晋级，因此不得把未执行的 Git Promotion 写成 PASS。线上 Production Runtime 已由真实升级与版本回读确认是 2.21.17；Git 分支 HEAD 按本轮 Remote Truth 原样记录。\n\n## NEXT\n\n```text\nSTOP FOR MASTER\nP01 · VF Start · V2.21.17 CLOSED\n```\n'''
          (root/'docs/authority/CURRENT.md').write_text(current,encoding='utf-8')

          handoff=f'''# CURRENT STATE · P01 VF Start\n\n更新时间：2026-08-16 17:11:23 +08:00\n\n```text\nProject: P01 · VF Start\nState: V2.21.17 PRODUCTION CLOSED\nProduction: 2.21.17\nLatest: 2.21.17\nSchema: 2026080902\nFormal Release: PASS\nOnline Discovery: PASS\nProduction Upgrade: PASS\nProduction Version Readback: PASS\nProduction = Latest: YES\nProduct Failure: NONE\nProject Block: NONE\nFinal Online Pass: YES\n\nRelease Tag: v2.21.17\nRelease ID: {release_id}\nProduct Commit: {product}\nProduct Tree: {tree}\nUPDATE: VF_Start_V2.21.17_UPDATE.zip / {update_bytes} bytes / {update_sha}\ncore-updates: {core}\n\nProduction Upgrade History:\n2.21.16 -> 2.21.17 / success / {upgrade_time}\n\nRemote main: {main}\nRemote develop: {develop}\nGit Promotion This Closure: NOT EXECUTED\nProduct Source Modification This Closure: NO\n```\n\n## NEXT ACTION\n\n```text\nSTOP FOR MASTER\nP01 V2.21.17 CLOSED\n```\n'''
          (root/'docs/handoff/CURRENT_STATE.md').write_text(handoff,encoding='utf-8')

          evidence=f'''# P01 · VF Start · V2.21.17 Production Closure\n\n## Final Verdict\n\n- Formal Release：PASS\n- Online Discovery：PASS\n- Production Upgrade：PASS\n- Production Version Readback：PASS\n- Production = Latest：YES\n- Product Failure：NONE\n- Project Block：NONE\n- Final Status：CLOSED\n\n## Production Evidence\n\n主控根据真实 Production 后台截图确认：\n\n- Production Current：`2.21.17`\n- Latest：`2.21.17`\n- Upgrade：`2.21.16 -> 2.21.17`\n- Result：`success`\n- Time：`{upgrade_time}`\n\n本次 Closure 另外通过公开只读 bootstrap 回读 `2.21.17`；没有再次执行 Production Upgrade。\n\n## Release Identity\n\n- Product Commit：`{product}`\n- Product Tree：`{tree}`\n- Tag：`v2.21.17`\n- Release ID：`{release_id}`\n- UPDATE：`VF_Start_V2.21.17_UPDATE.zip` / `{update_bytes}` bytes / `{update_sha}`\n- FULL：`VF_Start_V2.21.17_FULL.zip` / `{full_bytes}` bytes / `{full_sha}`\n\n## core-updates Identity\n\n- Commit：`{core}`\n- Source：`2.21.16`\n- Target：`2.21.17`\n- Schema：`2026080902 -> 2026080902`\n- Release：`v2.21.17`\n- Asset identity：PASS\n\n## Git Remote Truth at Closure\n\n- main：`{main}`\n- develop：`{develop}`\n- Authority Branch：`{branch}`\n- Product source changed after `{product}`：NO\n- main/develop promotion in this closure：NOT EXECUTED\n\n本 Evidence 不把未执行的 Git Promotion 伪写成 PASS。Production Runtime 与 Git Remote HEAD 分别按各自真实证据记录。\n'''
          (root/'docs/evidence/V2.21.17_PRODUCTION_CLOSURE_20260816.md').write_text(evidence,encoding='utf-8')

          # SSOT: refresh top metadata and add a highest-priority current closure overlay; preserve historical body.
          sp=root/'docs/authority/SSOT.md'
          s=sp.read_text(encoding='utf-8')
          replacements={
              '> **SSOT Revision**：`R2026.08.15-V22115-UPDATE-CORE-CANDIDATE`  ': '> **SSOT Revision**：`R2026.08.16-V22117-PRODUCTION-CLOSED`  ',
              '> **Production Authority**：`VF Start V2.21.14`  ': '> **Production Authority**：`VF Start V2.21.17`  ',
              '> **Current Production**：`VF Start V2.21.14 / PRODUCTION / CURRENT`  ': '> **Current Production**：`VF Start V2.21.17 / PRODUCTION / CURRENT / CLOSED`  ',
              '> **Development Source Baseline**：`VF Start V2.21.15 · UPDATE CORE CANDIDATE`  ': f'> **Development Source Baseline**：`V2.21.17 RELEASE PRODUCT IDENTITY {product}`  ',
              '> **Current Lifecycle**：`CANDIDATE_VALIDATION`  ': '> **Current Lifecycle**：`STABLE_OPERATIONS / CLOSED`  ',
              '> **当前阶段**：`V2.21.15 CANDIDATE VALIDATION / V2.21.14 PRODUCTION UNCHANGED`  ': '> **当前阶段**：`V2.21.17 PRODUCTION CLOSED`  ',
              '> **V2.21.14**：`PRODUCTION / CURRENT`  ': '> **V2.21.14**：`HISTORICAL / PREVIOUS PRODUCTION`  ',
              '> **V2.21.15**：`ENGINEERING / CANDIDATE / NOT PRODUCTION`  ': '> **V2.21.15**：`HISTORICAL / SUPERSEDED RELEASE`  '
          }
          for old,new in replacements.items():
              if old not in s: raise SystemExit('SSOT metadata drift: '+old)
              s=s.replace(old,new,1)
          marker='> **V2.21.15**：`HISTORICAL / SUPERSEDED RELEASE`  \n'
          s=s.replace(marker,marker+'> **V2.21.16**：`HISTORICAL / PREVIOUS PRODUCTION`  \n> **V2.21.17**：`PRODUCTION / CURRENT / CLOSED`  \n',1)
          section=f'''# 0.00000 CURRENT · 2026-08-16 V2.21.17 Production Closure\n\n```text\nProduction: 2.21.17\nLatest: 2.21.17\nProduction = Latest: YES\nSchema: 2026080902 / UNCHANGED\nFormal Release: PASS\nOnline Discovery: PASS\nProduction Upgrade: PASS\nProduction Version Readback: PASS\nUpgrade History: 2.21.16 -> 2.21.17 / success / {upgrade_time}\nRelease Tag: v2.21.17\nRelease ID: {release_id}\nRelease Product Identity: {product}\nRelease Product Tree: {tree}\nUPDATE: VF_Start_V2.21.17_UPDATE.zip / {update_bytes} bytes / {update_sha}\ncore-updates: {core} / PASS\nRemote main: {main}\nRemote develop: {develop}\nGit Promotion This Closure: NOT EXECUTED\nProduct Failure: NONE\nProject Block: NONE\nFINAL_ONLINE_PASS: YES\nStatus: CLOSED\n```\n\n本节是当前最高优先级 Production Closure 覆盖。旧的 V2.21.15、V2.21.16 `CURRENT` 文本继续作为生成时点历史证据保留，不得覆盖本节。Production Runtime 与 Git Remote HEAD 分别按真实证据记录；本轮未执行 `main` / `develop` 晋级，因此不把未执行 Git Promotion 写成 PASS。\n\n'''
          first='---\n\n'
          if first not in s: raise SystemExit('SSOT section anchor missing')
          s=s.replace(first,first+section,1)
          sp.write_text(s,encoding='utf-8')

          # Acceptance Matrix: refresh top metadata and prepend final production closure gate set.
          mp=root/'docs/authority/ACCEPTANCE_MATRIX.md'
          m=mp.read_text(encoding='utf-8')
          meta={
              '> **Matrix Revision**：`R2026.08.15-V22115-UPDATE-CORE-CANDIDATE`  ': '> **Matrix Revision**：`R2026.08.16-V22117-PRODUCTION-CLOSED`  ',
              '> **当前阶段**：`V2.21.15 CANDIDATE VALIDATION / V2.21.14 PRODUCTION UNCHANGED`  ': '> **当前阶段**：`V2.21.17 PRODUCTION CLOSED`  ',
              '> **Production Authority**：`VF Start V2.21.14`  ': '> **Production Authority**：`VF Start V2.21.17`  ',
              '> **Development Source Baseline**：`VF Start V2.21.15 · UPDATE CORE CANDIDATE`  ': f'> **Development Source Baseline**：`V2.21.17 RELEASE PRODUCT IDENTITY {product}`  ',
              '> **Target**：`VF Start V2.21.15 · CANDIDATE / NOT PRODUCTION`  ': '> **Target**：`VF Start V2.21.17 · PRODUCTION / CLOSED`  '
          }
          for old,new in meta.items():
              if old not in m: raise SystemExit('Matrix metadata drift: '+old)
              m=m.replace(old,new,1)
          matrix_section=f'''# 0.00000 CURRENT · V2.21.17 Production Closure Gates\n\n| ID | Gate | Evidence / Result | Status |\n|---|---|---|---|\n| V22117-PROD-01 | Exact Product Identity | `{product}` / `{tree}` | PASS |\n| V22117-PROD-02 | Formal Release | `v2.21.17` / Release `{release_id}` | PASS |\n| V22117-PROD-03 | UPDATE Identity | `{update_bytes}` bytes / `{update_sha}` | PASS |\n| V22117-PROD-04 | core-updates | `{core}` / 2.21.16 -> 2.21.17 | PASS |\n| V22117-PROD-05 | Online Discovery | Production backend confirmed 2.21.17 available | PASS |\n| V22117-PROD-06 | Production Upgrade | `2.21.16 -> 2.21.17` / success / `{upgrade_time}` | PASS |\n| V22117-PROD-07 | Production Version Readback | `2.21.17` | PASS |\n| V22117-PROD-08 | Production Latest Readback | `2.21.17` | PASS |\n| V22117-PROD-09 | Production = Latest | YES | PASS |\n| V22117-PROD-10 | Schema | `2026080902` / unchanged | PASS |\n| V22117-PROD-11 | Product Failure | NONE | PASS |\n| V22117-PROD-12 | Project Block | NONE | PASS |\n| V22117-PROD-13 | FINAL_ONLINE_PASS | YES | PASS |\n| V22117-PROD-14 | main/develop Promotion This Closure | not executed; remote truth recorded separately | N/A |\n\n**Current Phase：`STABLE_OPERATIONS / V2.21.17 PRODUCTION CLOSED`。** 本节是当前最高优先级矩阵覆盖；下面旧版本 CURRENT 行仅为历史证据。\n\n'''
          anchor='# 0.000 CURRENT · V2.21.15 Unified Update Candidate Gates\n'
          if anchor not in m: raise SystemExit('Matrix current anchor missing')
          m=m.replace(anchor,matrix_section+anchor,1)
          mp.write_text(m,encoding='utf-8')
          PY

          python3 -m json.tool p01/VF_PROJECT.json >/dev/null
          git -C p01 diff --check
          echo 'FINAL_AUTHORITY_WRITTEN=PASS'

      - name: Commit Authority-only Production Closure Seal
        run: |
          set -Eeuo pipefail
          cd p01
          git config user.name 'VF Release Automation'
          git config user.email 'vf-release-automation@users.noreply.github.com'
          git add VF_PROJECT.json docs/authority/CURRENT.md docs/authority/SSOT.md docs/authority/ACCEPTANCE_MATRIX.md docs/handoff/CURRENT_STATE.md docs/evidence/V2.21.17_PRODUCTION_CLOSURE_20260816.md
          test -z "$(git diff --cached --name-only -- src)"
          git diff --cached --name-only | tee /tmp/closure-files.txt
          python3 - <<'PY'
          allowed={
            'VF_PROJECT.json','docs/authority/CURRENT.md','docs/authority/SSOT.md','docs/authority/ACCEPTANCE_MATRIX.md',
            'docs/handoff/CURRENT_STATE.md','docs/evidence/V2.21.17_PRODUCTION_CLOSURE_20260816.md'
          }
          got={x.strip() for x in open('/tmp/closure-files.txt',encoding='utf-8') if x.strip()}
          assert got==allowed,(got,allowed)
          print('AUTHORITY_ONLY_SCOPE=PASS')
          PY
          git commit -m 'docs(authority): seal P01 V2.21.17 production closure'
          git push origin HEAD:"$P01_BRANCH"
          echo "CLOSURE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo 'PRODUCTION_CLOSURE_SEAL_COMMITTED=PASS'

      - name: Final remote readback
        run: |
          set -Eeuo pipefail
          git -C p01 fetch origin "$P01_BRANCH"
          test "$(git -C p01 rev-parse origin/$P01_BRANCH)" = "$CLOSURE_HEAD"
          test -z "$(git -C p01 diff --name-only "$PRODUCT_COMMIT" "$CLOSURE_HEAD" -- src)"
          git -C p01 diff --name-only "$PREV_AUTHORITY_HEAD" "$CLOSURE_HEAD" | tee /tmp/final-files.txt
          python3 - <<'PY'
          allowed={
            'VF_PROJECT.json','docs/authority/CURRENT.md','docs/authority/SSOT.md','docs/authority/ACCEPTANCE_MATRIX.md',
            'docs/handoff/CURRENT_STATE.md','docs/evidence/V2.21.17_PRODUCTION_CLOSURE_20260816.md'
          }
          got={x.strip() for x in open('/tmp/final-files.txt',encoding='utf-8') if x.strip()}
          assert got==allowed,(got,allowed)
          print('REMOTE_AUTHORITY_ONLY_READBACK=PASS')
          PY
          test "$(gh api repos/llhzx2018/vf-start/git/ref/heads/main --jq .object.sha)" = "$REMOTE_MAIN"
          test "$(gh api repos/llhzx2018/vf-start/git/ref/heads/develop --jq .object.sha)" = "$REMOTE_DEVELOP"
          test "$(gh api repos/llhzx2018/core-updates/git/ref/heads/main --jq .object.sha)" = "$CORE_UPDATES_COMMIT"
          echo 'MAIN_UNCHANGED=PASS'
          echo 'DEVELOP_UNCHANGED=PASS'
          echo 'P01_V2.21.17_PRODUCTION_CLOSURE=CLOSED'

      - name: Summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # P01 V2.21.17 Production Closure
          - Production: 2.21.17
          - Latest: 2.21.17
          - Formal Release: PASS
          - Online Discovery: PASS
          - Production Upgrade: PASS
          - Production Version Readback: PASS
          - Product Failure: NONE
          - Project Block: NONE
          - Closure Authority Head: $CLOSURE_HEAD
          - main/develop: unchanged by this closure directive
          - Final: CLOSED
          EOF
