name: P07 R5 real non-Docker native MariaDB scratch restore
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-r5-native-scratch.yml'
      - 'experiments/p07-r5/**'
permissions:
  contents: read
jobs:
  native-scratch:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact product candidate source and CLI
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(cat dist/p07/0.1.0/overlay/BUILD_ID)" = "0.1.0-release111"
          test "$(git hash-object experiments/p07-r5/lib/native_scratch_restore.py)" = ae97eac55cbb0ae3f72f856b92e5225d8638c223
          test "$(git hash-object experiments/p07-r5/lib/server_migration_pull.py)" = 125b69621c1cf7467ded820a54b06dd778f67f2b
          test "$(git hash-object experiments/p07-r5/bin/vfops)" = d06e9f73f7e49927e4e40e59dff50af4c0138938
          test "$(git hash-object experiments/p07-r5/tests/test_native_scratch_restore.py)" = 7c044838ee51f0b1b0f2fc4dd143ee9a7ed9223d
          test "$(git hash-object experiments/p07-r5/lib/private_recovery_gate.py)" = f28aedfba4caf1788d7e6266a809141601228025
          test "$(git hash-object experiments/p07-r5/lib/migration_remainder.py)" = 36c4166d5b06c0ef2491d60ae9c5ed134352d351
          test "$(git hash-object experiments/p07-r5/lib/isolated_db_restore.py)" = c3a65c561dee2b76298b24b47fcb5876614045ec
          test "$(git hash-object experiments/p07-r5/tests/test_private_recovery_gate.py)" = 47bf70e75587c7816918bc60a8156f7e4fdcbaea
          test "$(git hash-object experiments/p07-r5/tests/test_migration_remainder.py)" = 179736d53c790b204af859ac027cc09f61cc1c67
          cp -a dist/p07/0.1.0/overlay "$RUNNER_TEMP/p07-r5"
          for p in lib/native_scratch_restore.py lib/server_migration_pull.py bin/vfops tests/test_native_scratch_restore.py lib/private_recovery_gate.py lib/migration_remainder.py lib/isolated_db_restore.py tests/test_private_recovery_gate.py tests/test_migration_remainder.py; do
            cp "experiments/p07-r5/$p" "$RUNNER_TEMP/p07-r5/$p"
          done
          chmod +x "$RUNNER_TEMP/p07-r5/bin/"*
          cd "$RUNNER_TEMP/p07-r5"
          python3 -m py_compile lib/native_scratch_restore.py lib/server_migration_pull.py tests/test_native_scratch_restore.py
          bash -n bin/vfops
          echo P07_R5_EXACT_SOURCE_PASS
      - name: Fail-closed scratch safety and no-production regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/p07-r5"
          PYTHONPATH=lib python3 -m unittest -v \
            tests.test_native_scratch_restore.NativeRestoreContractTests \
            tests.test_private_recovery_gate \
            tests.test_migration_remainder \
            tests.test_migration_no_overwrite_resume \
            tests.test_sql_pk_conflict_evidence
          echo P07_R5_SAFETY_UNIT_PASS
      - name: Install native MariaDB programs only in disposable hosted Runner
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y mariadb-server mariadb-client >/dev/null
          command -v mariadbd
          command -v mariadb-install-db
          command -v mariadb
          echo P07_R5_NATIVE_BINARIES_READY
      - name: Two genuine independent native scratch imports and failure cleanup
        shell: bash
        env:
          P07_R5_NATIVE_INTEGRATION: "1"
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/p07-r5"
          PYTHONPATH=lib python3 -m unittest -v tests.test_native_scratch_restore.NativeRestoreRealEngineTests
          test -z "$(find /tmp -maxdepth 1 -type d -name 'vfops-r5-*' -print -quit)"
          echo P07_R5_NATIVE_SQL_IMPORT_CLEANUP_PASS
      - name: Root-invoked real SQL restores MUST drop MariaDB daemon privileges
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/p07-r5"
          sudo env PYTHONPATH=lib python3 -c 'import native_scratch_restore as n; u,g=n._identity(); assert u != 0 and g != 0; print("P07_R5_ROOT_TO_UNPRIVILEGED_IDENTITY_PASS")'
          sudo env PYTHONPATH=lib P07_R5_NATIVE_INTEGRATION=1 python3 -m unittest -v tests.test_native_scratch_restore.NativeRestoreRealEngineTests
          test -z "$(find /tmp -maxdepth 1 -type d -name 'vfops-r5-*' -print -quit)"
          echo P07_R5_ROOT_MODE_NATIVE_RESTORE_PASS
      - name: Preserve existing host and P07 writer safety
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/p07-r5"
          for p in lib/cloudpanel.py lib/restore_apply_core.py lib/verify.py lib/package_core.py lib/server_migration.py BUILD_ID; do
            test "$(git hash-object "$GITHUB_WORKSPACE/dist/p07/0.1.0/overlay/$p")" = "$(git hash-object "$p")"
          done
          echo P07_R5_DB_WRITERS_UNCHANGED_PASS
