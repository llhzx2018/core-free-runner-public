name: S01-C01 SEO round4 exact artifact readback
on:
  push:
    branches: [task/s01-c01-seo-round4-readback-20261008]
permissions:
  contents: read
  actions: read
jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_REPO: 'llhzx2018/vf-tools-theme'
      TARGET_VERSION: '1.35.101'
      TARGET_SHA: '1bea166565912d8250760933d3a04bc45b91d151'
      TARGET_TREE: 'a403c195edc289ccd06bf5b84603b490b9be8aa2'
      PROVIDER_VERSION: '1.25.59'
      ARTIFACT_ID: '11520287214'
      ARTIFACT_BYTES: '6589291'
      ARTIFACT_DIGEST: 'sha256:1fc9834bf22924bd4983ccfe67db33b3c933a6f47ea43e467eddc8ed649b302c'
      ORIGINAL_RUN: '37707259784'
      ORIGINAL_JOB: '113084472983'
      ORIGINAL_HEAD: '82156a0ad41f6d1cb6087952117c407ba77905fb'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact reader spec
        run: |
          set -Eeuo pipefail
          python3 scripts/ephemeral_lane_spec.py render --spec lanes/s01-c01-seo-round4-readback-20261008/spec.json --template lanes/s01-c01-seo-round4-readback-20261008/candidate.template.yml --output /tmp/reader.yml >/dev/null
          cmp /tmp/reader.yml .github/workflows/s01-c01-seo-round4-readback-20261008.yml
          python3 scripts/ephemeral_lane_spec.py audit-rendered --spec lanes/s01-c01-seo-round4-readback-20261008/spec.json --input .github/workflows/s01-c01-seo-round4-readback-20261008.yml
      - name: Download actual archive and original job classification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > /tmp/meta.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/archive.zip
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$ORIGINAL_JOB" > /tmp/job.json
          python3 lanes/s01-c01-seo-round4-readback-20261008/reader.py
