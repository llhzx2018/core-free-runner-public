name: P02 V2.5.0 Manifest Artifact
on:
  pull_request:
    branches: [main]
    paths: ['p02-v250-manifest-artifact-trigger.txt']
permissions: {contents: read}
jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: 47f77eef383fbe0f8554b77e73820f1eea702843
          token: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'
          path: p02
          fetch-depth: 1
          persist-credentials: false
      - name: Generate manifest
        working-directory: p02
        run: |
          set -Eeuo pipefail
          DEPLOY="$RUNNER_TEMP/p02-v250-deploy"
          bash scripts/build-deploy-tree.sh "$DEPLOY" >/dev/null
          python3 - "$DEPLOY" > "$RUNNER_TEMP/SOURCE_MANIFEST.json" <<'PY'
          import sys,os,json,hashlib
          root=sys.argv[1]; rows=[]
          for dp,_,fs in os.walk(root):
              for f in sorted(fs):
                  p=os.path.join(dp,f); rel=os.path.relpath(p,root).replace(os.sep,'/')
                  if rel.startswith('app/'): repo='src/'+rel
                  elif rel.startswith('cli/'): repo='src/'+rel
                  elif rel=='VERSION.txt': repo='VERSION'
                  else: repo='public/'+rel
                  b=open(p,'rb').read(); h=hashlib.sha256(b).hexdigest()
                  rows.append({'full_path':rel,'repo_path':repo,'bytes':len(b),'sha256':h,'repo_sha256':h})
          rows.sort(key=lambda x:x['full_path'])
          data={'project':'P02 · VF Library','version':'2.5.0','schema':2401,'source_baseline_full_sha256':'PENDING_FORMAL_CANDIDATE_ARTIFACT','mapping_contract':'Each declared runtime source file must exist exactly once at repo_path; hashes bind the Git-native V2.5.0 UA/UI Candidate derived from Production V2.4.26. Formal release identity is not assigned by this candidate manifest.','runtime_source_file_count':len(rows),'entries':rows}
          print(json.dumps(data,ensure_ascii=False,indent=2))
          PY
          python3 -m json.tool "$RUNNER_TEMP/SOURCE_MANIFEST.json" >/dev/null
          grep -q '"runtime_source_file_count": 58' "$RUNNER_TEMP/SOURCE_MANIFEST.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p02-v250-source-manifest
          path: '${{ runner.temp }}/SOURCE_MANIFEST.json'
          if-no-files-found: error
          retention-days: 1
