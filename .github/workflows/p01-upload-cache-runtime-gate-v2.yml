name: P01 Update Resolver Scope Patch

on:
  push:
    branches:
      - vf-agent-operations-v1
    paths:
      - '.github/workflows/p01-upload-cache-runtime-gate-v2.yml'

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      EXPECTED_HEAD: d6699572245cfeab25deda1cc732ed53f9f0f6a7
      TARGET_BRANCH: maintenance/common-product-baseline-v2-20260827
    steps:
      - name: Checkout P01 branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Apply scoped evidence fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 <<'PY'
          from pathlib import Path
          p=Path('src/app/CommonBaseline.php')
          s=p.read_text()
          old="$successSafe=$ordered($manager,['atomicJson[','actual !==','journal['])&&$has($manager,\"'failed_rolled_back'\")&&$has($manager,\"'recovery_required'\");"
          new="$installStart=strpos($manager,'public function install(');$historyStart=strpos($manager,'public function history(');$install=($installStart!==false&&$historyStart!==false&&$historyStart>$installStart)?substr($manager,$installStart,$historyStart-$installStart):'';$successSafe=$install!==''&&$ordered($install,[\"atomicJson['ok']\",'actual !==',\"result'] = 'success'\"])&&$has($install,\"'failed_rolled_back'\")&&$has($install,\"'recovery_required'\");"
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY
          php -l src/app/CommonBaseline.php
          git diff --check
          test "$(git status --short | wc -l)" -eq 1
          test "$(cat VERSION)" = '2.21.24'
          test "$(cat src/VERSION.txt)" = '2.21.24'
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add src/app/CommonBaseline.php
          git commit -m 'p01: scope update success evidence to install'
          git push origin HEAD:$TARGET_BRANCH
          echo NEW_HEAD=$(git rev-parse HEAD)
