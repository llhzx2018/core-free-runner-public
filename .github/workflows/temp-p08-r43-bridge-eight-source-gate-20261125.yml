name: TEMP P08 R43 read-only v017 eight-pin bridge vs v018
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p08-r43-bridge-eight-source-gate-20261125.yml'
permissions:
  contents: read
concurrency:
  group: p08-r43-eight-readonly-20261125
  cancel-in-progress: false
env:
  TARGET_REPO: llhzx2018/vf-adops
  TARGET_VERSION: '0.1.18'
  TARGET_SHA: 72f3d4ffee8bb6acfc22cd3635667cfe496e366e
  BRIDGE_SHA: d3d29680469629c659fae06a38c172d77c30812d
  OLD_SIX_BRIDGE_SHA: 7451af80324c8b3d48b873c1d808c7c2397f73e4
jobs:
  pure-source:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/p08-r43-bridge-eight-source-gate-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout canonical public harness for spec audit only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: public-control
      - name: Audit final one-off lane source identity before private checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          python3 public-control/scripts/ephemeral_lane_spec.py audit-rendered --spec public-control/specs/ephemeral/p08-r43-bridge-eight-source-gate-20261125.json --input public-control/.github/workflows/temp-p08-r43-bridge-eight-source-gate-20261125.yml > "$RUNNER_TEMP/p08-r43-lane-audit.log"
          echo P08_R43_EIGHT_PIN_LANE_SPEC=PASS
      - name: Transient exact private S9 v018 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 72f3d4ffee8bb6acfc22cd3635667cfe496e366e
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: private-v018
      - name: Transient exact private v017 bridge source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: d3d29680469629c659fae06a38c172d77c30812d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: private-v017
      - name: Syntax and pure in-memory source-bound negative tests
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C private-v018 rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C private-v017 rev-parse HEAD)" = "$BRIDGE_SHA"
          test "$(cat private-v018/VERSION)" = "$TARGET_VERSION"
          test "$(cat private-v017/VERSION)" = '0.1.17'
          php -l private-v017/src/Upgrade/R43SchemaUpgradeAdmission.php > "$RUNNER_TEMP/p08-r43-php-lint.log" 2>&1 || { echo P08_R43_BRIDGE_PHP_SYNTAX=FAIL; exit 1; }
          php -l private-v017/tests/compatibility/r43_schema_upgrade_admission.php > "$RUNNER_TEMP/p08-r43-php-test-lint.log" 2>&1 || { echo P08_R43_BRIDGE_TEST_SYNTAX=FAIL; exit 1; }
          php -r '
            require "private-v017/src/Upgrade/R43SchemaUpgradeAdmission.php";
            $c = \VF\AdOps\Upgrade\R43SchemaUpgradeAdmission::class;
            $old = $c::expectedOriginal();
            $six = $c::expectedAdditional();
            $eight = $c::expectedActualTargetAdditional();
            if (count($old)!==15 || count($six)!==6 || count($eight)!==8 || count(array_diff_assoc($six,$eight))!==0 || count(array_diff_key($eight,$six))!==2) exit(3);
          ' > "$RUNNER_TEMP/p08-r43-php-map.log" 2>&1 || { echo P08_R43_BRIDGE_PHP_MAP=FAIL; exit 1; }
          (cd private-v018 && PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s tests -p 'test_s9_r43_schema_boundary.py' -v) > "$RUNNER_TEMP/p08-r43-python-unittest.log" 2>&1 || { echo P08_R43_PYTHON_NEGATIVE_UNIT=FAIL; exit 1; }
          echo P08_R43_PHP_EXACT_SIX_PLUS_TWO_SOURCE=PASS_READ_ONLY
          echo P08_R43_PYTHON_NEGATIVE_UNIT=PASS_READ_ONLY
      - name: Real exact Git source cross-version compatibility and negative refusal
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          git -C private-v018 fetch -q ../private-v017 "$BRIDGE_SHA" > "$RUNNER_TEMP/p08-r43-local-fetch.log" 2>&1
          git -C private-v018 cat-file -e "$BRIDGE_SHA^{commit}"
          git -C private-v018 cat-file -e "$OLD_SIX_BRIDGE_SHA^{commit}"
          (cd private-v018 && PYTHONDONTWRITEBYTECODE=1 python3 -B scripts/check_s9_r43_schema_boundary.py --repo . --target-sha "$TARGET_SHA" --bridge-sha "$BRIDGE_SHA") > "$RUNNER_TEMP/p08-r43-actual-positive.log" 2>&1 || { echo P08_R43_ACTUAL_EIGHT_BRIDGE=FAIL; exit 1; }
          grep -F 'P08_R43_V017_V018_BRIDGE_ALIGNMENT=BRIDGE_MIGRATION_SOURCE_ALIGNED_NOT_INSTALLABLE' "$RUNNER_TEMP/p08-r43-actual-positive.log" > /dev/null
          set +e
          (cd private-v018 && PYTHONDONTWRITEBYTECODE=1 python3 -B scripts/check_s9_r43_schema_boundary.py --repo . --target-sha "$TARGET_SHA" --bridge-sha "$OLD_SIX_BRIDGE_SHA") > "$RUNNER_TEMP/p08-r43-actual-six-negative.log" 2>&1
          refused=$?
          set -e
          test "$refused" = 4 || { echo P08_R43_OLD_SIX_BRIDGE_NOT_REFUSED; exit 1; }
          grep -F 'P08_R43_V017_V018_BRIDGE_ALIGNMENT=BLOCKED_BRIDGE_MIGRATION_SOURCE_DRIFT' "$RUNNER_TEMP/p08-r43-actual-six-negative.log" >/dev/null
          echo P08_R43_FINAL_ACTUAL_V017_TO_V018_PINS=PASS_READ_ONLY_NOT_INSTALLABLE
          echo P08_R43_OLD_SIX_SOURCE_DRIFT_REFUSAL=PASS
          echo P08_R43_SCHEMA_APPLY=DISABLED
      - name: Remove private checkouts and all isolated logs
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- private-v017 private-v018
          rm -f -- "$RUNNER_TEMP"/p08-r43-*.log
          test ! -e private-v017 && test ! -e private-v018
          echo P08_R43_TRANSIENT_PRIVATE_SOURCE_CLEANUP=PASS
