name: S01 Blog approved reference and native lifecycle proof
on:
  push:
    branches: [task/s01-blog186-20261024]
    paths: ['.github/workflows/s01-blog186-20261024.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.186
  TARGET_SHA: c8447dcfb34c9e42a3abf1ce6989c0e1a8685e43
  TARGET_TREE: a8c45b741c4eef44b473c9987488746b4e3fafcc
  BASE_SHA: 53096d65171f1f3c4ffe9725ac4ab95c1dbe3a4a
  SOURCE_VERSION: 1.35.185
  LANE_ID: s01-blog186-20261024
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - name: Target identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-blog186-20261024/spec.json --input control/.github/workflows/s01-blog186-20261024.yml
      - uses: actions/checkout@v4
        with:
          ref: 02d4591eed025a3d3a67bc0a150b3ddc448c2ab8
          persist-credentials: false
          path: established
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: c8447dcfb34c9e42a3abf1ce6989c0e1a8685e43
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact package and focused syntax checks
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider baseline
          python3 control/lanes/s01-blog186-20261024/package.py
          for f in src/inc/modules/module-hero.php src/inc/modules/module-post-list.php src/inc/modules/module-directory-ui.php src/inc/modules/module-cta.php src/inc/runtime-constants.php; do php -l "target/$f"; done
          node --check target/src/assets/js/main.js
          php -l target/src/inc/services/frontend-page-progress-service.php
          php -l target/src/inc/public-css-owner-registry.php
          node --check target/tests/blog-directory-reference-browser-check.cjs
          node --check control/lanes/s01-blog186-20261024/clean.cjs
          gh release download v1.35.185 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.185.zip --dir provider
          echo '33952bb3d562ada36d6de105788f2e02fc5d8326cd61771cd39ff7d8667070fd  provider/vf-tools-theme_V1.35.185.zip' | sha256sum -c
          gh release download v1.25.94 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.94.zip --dir provider
          echo '70b90d40da5d69fc7819bd7ada3f15fb0145e64822b788bd94956c7827b2df03  provider/vf-tools-m3u8_V1.25.94.zip' | sha256sum -c
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -g -fsSL --retry 2 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC[wght].ttf' -o "$HOME/.local/share/fonts/NotoSansSC.ttf"
          fc-cache -f
      - name: Native WordPress Blog directory and upgrade rollback data protection
        run: |
          set -euo pipefail
          cp -a established/lanes/s01-frontend-design-20261017 lane
          cp control/lanes/s01-blog186-20261024/clean.cjs lane/warm-admin.cjs
          bash control/lanes/s01-blog186-20261024/native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-home-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target baseline provider
