name: TEMP gov-doc PR51 Handoff V2.4 Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-gov-doc-pr51-handoff-v24.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      EXPECTED_SHA: 78a62c0f72dd25f8f8fdfaae447287769151d426
    steps:
      - name: Verify private read capability
        shell: bash
        run: test -n "$PRIVATE_READ_TOKEN"

      - name: Checkout exact gov-doc candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: ${{ env.EXPECTED_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Verify exact source identity
        shell: bash
        run: test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Validate mission-preserving handoff candidate
        working-directory: source
        run: python skills/skill-handoff/candidates/V2.4/tests/validate_candidate.py

      - name: Verify Current identities remain unchanged
        working-directory: source
        shell: bash
        run: |
          grep -F '| skill-handoff | V2.2 | V2.2 |' skills/README.md
          grep -F '| skill-handoff | V2.2 | V2.3 |' CURRENT.md
          test ! -e skills/skill-handoff/V2.4
          echo 'HANDOFF_V24_CANDIDATE_BOUNDARY=PASS'
