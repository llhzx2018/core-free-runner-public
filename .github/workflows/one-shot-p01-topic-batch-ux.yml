name: One-shot P01 Topic Batch UX Exact Source
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/one-shot-p01-topic-batch-ux.yml']
permissions:
  contents: read
jobs:
  topic-batch-ux:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      EXACT_SOURCE_SHA: fa7f7ac77e5710b4939600e9b9ab12fdbc55b135
    steps:
      - name: Confirm transient private read capability
        shell: bash
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_READ_TOKEN" || { echo "BLOCKED_CAPABILITY_PRIVATE_READ"; exit 78; }
          echo "REGISTERED_PRIVATE_READ=YES"
      - name: Checkout exact private P01 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.EXACT_SOURCE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: transient-p01
      - name: Syntax and scoped tests
        shell: bash
        working-directory: transient-p01
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_SOURCE_SHA"
          php -v
          php -l src/gov-topic-sync.php
          php -l src/app/TopicLibraryPage.php
          php -l src/app/GovTopicSync.php
          php -l tests/unit/topic_sync_batch_ux_contract.php
          php tests/unit/topic_sync_batch_ux_contract.php
          node tests/integration/topic_sync_modal_node.js
          php tests/gov_topic_preview_contract.php
          php tests/gov_topic_remote_contract.php
          php tests/gov_topic_catalog_contract.php
          php tests/gov_topic_auth_contract.php
          python3 tests/gov_topic_sqlite_contract.py
          echo 'TOPIC_BATCH_EXACT_CONTRACT=PASS'
      - name: Real PDO SQLite integration when module available
        shell: bash
        working-directory: transient-p01
        run: |
          set -euo pipefail
          if php -m | grep -qi '^pdo_sqlite$'; then
            php tests/gov_topic_pdo_integration.php
            echo 'TOPIC_BATCH_SQLITE_PDO=PASS'
          else
            echo 'TOPIC_BATCH_SQLITE_PDO=BLOCKED_ENV_NO_EXTENSION'
          fi
      - name: Remove private source
        if: always()
        shell: bash
        run: |
          rm -rf transient-p01
          echo 'PRIVATE_SOURCE_PERSISTED=NO'
