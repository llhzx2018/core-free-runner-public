        shell: bash
        run: |
          set -Eeuo pipefail
          cd p01
          BASE='2b60b27c1e5cb53f841e9e7f0c8e521bacba1030'
          test "$(git rev-parse HEAD)" = "$BASE"
          python3 - <<'PY'
          import json
          from pathlib import Path
