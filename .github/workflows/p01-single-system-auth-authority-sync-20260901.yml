          PY
          python3 -m json.tool VF_PROJECT.json >/dev/null
          git diff --check
          git add -N docs/evidence/P01_SINGLE_SYSTEM_AUTH_MODEL_RESTORE_20260901.md
          actual="$(git diff --name-only | sort | tr '\n' ' ')"
          expected='VF_PROJECT.json docs/authority/CURRENT.md docs/evidence/P01_SINGLE_SYSTEM_AUTH_MODEL_RESTORE_20260901.md docs/handoff/CURRENT_STATE.md '
          test "$actual" = "$expected"
