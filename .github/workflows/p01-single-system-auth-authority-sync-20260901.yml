          - Runtime Tree：`9788bdf228f3bd7e140a89f7881ce1b01c43f154`。
          - 正式产品模型：**一个前台，不存在管理员版/公开版两套视角。**
          - 未登录：只读取公开资源；私人资源不可见；管理入口不可见。
