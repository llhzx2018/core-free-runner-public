name: P01 Single System Auth Authority Sync
on:
  push:
    branches: [temp/p01-single-system-auth-model-20260901]
    paths: [.github/workflows/p01-single-system-auth-authority-sync-20260901.yml]
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: authority/p01-single-system-auth-model-restore-20260901
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01
