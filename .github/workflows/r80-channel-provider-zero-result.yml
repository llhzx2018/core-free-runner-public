name: P01 R80 Channel Provider Zero Result

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r80-channel-provider-zero-result.yml'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: 78b5d13166983a0420514f975993fc72417dc17b
    steps:
      - name: Checkout exact P01 candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: 78b5d13166983a0420514f975993fc72417dc17b
          path: vf-start
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_sqlite,sqlite3,curl
          coverage: none

      - name: Verify exact candidate and focused contracts
        working-directory: vf-start
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "2.47.0"
          php -l src/app/ChannelLibraryPage.php
          php -l tests/unit/channel_provider_zero_result_contract.php
          php tests/unit/channel_provider_zero_result_contract.php
          php tests/unit/channel_provider_context_facet_contract.php
          php tests/unit/channel_provider_normalization_contract.php
          php tests/unit/subject_kind_zero_scope_contract.php
          echo "R80_CHANNEL_PROVIDER_ZERO_RESULT_PASS"
          echo "R80_EXACT_CANDIDATE_GATE_PASS"

      - name: Cleanup private source
        if: always()
        shell: bash
        run: rm -rf vf-start
