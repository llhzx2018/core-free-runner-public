name: TEMP S01-C02 1.21.827 Reinspection Failure Trace
on:
  push:
    branches:
      - temp/s01-c02-v121827-reinspection-failure-trace-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121827-reinspection-failure-trace.yml'
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact Product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 3a59068c8e9c6adc533e37883f48bd38224e7362
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: ops
      - name: Trace recovery runtime dependency closure
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== PUBLISH_ZIP RUNTIME MAP ==='
          grep -n -A180 -B10 "publish_zip" ops/includes/bootstrap/runtime-loader.php | head -n 260 || true
          echo '=== ASYNC JOB LOADERS ==='
          grep -RInE "release/async-job|class VF_Ops_Release_Async_Job|VF_Ops_Release_Context|class VF_Ops_Release_Step_(Validate_Environment|Inspect_Source_Zip|Preflight_Core_Matrix)" ops/includes/bootstrap ops/includes/release ops/includes | head -n 360 || true
          echo '=== RECOVERY RUNTIME SHORT-CIRCUIT ==='
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ops/includes/site-release/s01-static-source-recovery-v2.php')
          s=p.read_text(); a=s.find('function vf_ops_s01_static_source_recovery_v2_runtime_v121814'); b=s.find('function vf_ops_s01_static_source_recovery_v2_authority_v121814')
          print(s[a:b])
          PY
          echo '=== STATIC READBACK ==='
          curl -fsSL https://www3.m3u8.one/wp-json/vf-ops/v1/s01-static-candidate-readiness | jq -c '{pluginVersion,activeStaticJobStatus,activeStaticJobMode,sourceRecoveryStatus,sourceRecoveryCode,sourceRecoveryBasis,sourceRecoveryWorkerStatus,sourceArtifactAvailable,manualSourceUploadRequired}'
          echo TRACE_RUNTIME_DONE
