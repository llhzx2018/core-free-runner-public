name: TEMP S01-C02 1.21.827 Reinspection Failure Trace
on:
  push:
    branches:
      - temp/s01-c02-v121827-reinspection-failure-trace-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121827-reinspection-failure-trace.yml'
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact Product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 3a59068c8e9c6adc533e37883f48bd38224e7362
          fetch-depth: 1
          persist-credentials: false
          path: ops
      - name: Trace all recovery failure markers and inspect-only stage behavior
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== MARKER STRINGS ==='
          grep -RInE 'current_active_job_failed|source_reinspection_failed|SOURCE_REINSPECTION_FAILED|RECOVERY_STAGE_EXCEPTION|RECOVERY_INSPECTION_TERMINAL' ops/includes | head -n 240 || true
          echo '=== INSPECT-ONLY PIPELINE ==='
          python3 - <<'PY'
          from pathlib import Path
          for f in [
            'ops/includes/release/async-job-parts/04-stage-pipeline-trait.php',
            'ops/includes/release/async-job-parts/05-record-findings-trait.php',
            'ops/includes/release/async-job-parts/03-job-state-trait.php',
            'ops/includes/site-release/s01-static-source-recovery-v2.php',
            'ops/includes/site-release/s01-static-failed-candidate-source-rebind-v121827.php',
          ]:
            p=Path(f)
            print('\n###', f)
            s=p.read_text()
            for key in ['inspectOnly','inspect_only','run_recovery_inspection_stage_v121814','SOURCE_REINSPECTION_FAILED','current_active_job_failed']:
              i=s.find(key)
              if i>=0:
                print(s[max(0,i-1800):i+7000])
                break
          PY
          echo '=== PRODUCTION PUBLIC NOW ==='
          curl -fsSL https://www3.m3u8.one/wp-json/vf-ops/v1/s01-static-candidate-readiness | jq -c '{pluginVersion,activeStaticJobStatus,activeStaticJobMode,sourceArtifactAvailable,sourceInspectionComplete,promotableInspectionAvailable,candidatePackageReady,manualSourceUploadRequired,sourceRecoveryStatus,sourceRecoveryCode,sourceRecoveryBasis,sourceRecoveryWorkerStatus,nextBoundary}'
          echo TRACE_DONE
