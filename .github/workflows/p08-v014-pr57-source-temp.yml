name: P08 v0.1.4 final PR57 source PHP JS and security regressions (TEMP)
on:
  pull_request:
    paths: [.github/workflows/p08-v014-pr57-source-temp.yml]
permissions:
  contents: read
jobs:
  exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      P08_FINAL_SOURCE: 69fe9854a3c5559fc16982606b4ac15a3f7ad9ed
    steps:
      - name: PHP 8.4 and native extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3,pdo_sqlite,pdo_mysql,posix,zip,curl,mbstring,dom
          coverage: none
          tools: composer:v2
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Private P08 exact source checkout to ephemeral workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 69fe9854a3c5559fc16982606b4ac15a3f7ad9ed
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: .p08-source
      - name: Source-bound full native PHP and security regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd .p08-source
          test "$(git rev-parse HEAD)" = "$P08_FINAL_SOURCE"
          bash scripts/dev_check.sh > "$RUNNER_TEMP/p08-final-devcheck.log" 2>&1 || {
            grep -E 'FAIL|FATAL|error|ERROR|BLOCKED|NOT_FOUND|Cannot|Uncaught|TypeError|RuntimeException|Syntax' "$RUNNER_TEMP/p08-final-devcheck.log" | tail -n 17 || true
            echo P08_FINAL_DEV_CHECK=FAIL
            exit 1
          }
          tail -n 3 "$RUNNER_TEMP/p08-final-devcheck.log"
          echo P08_FINAL_PR57_EXACT_NATIVE_DEV_CHECK=PASS
      - name: Composer and TypeScript locked build/tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cd .p08-source
          composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader > "$RUNNER_TEMP/p08-final-composer.log" 2>&1
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-final-npm.log" 2>&1
          npm run build >> "$RUNNER_TEMP/p08-final-npm.log" 2>&1
          npm run typecheck >> "$RUNNER_TEMP/p08-final-npm.log" 2>&1
          npm run test:unit >> "$RUNNER_TEMP/p08-final-npm.log" 2>&1
          tail -n 8 "$RUNNER_TEMP/p08-final-npm.log"
          php tests/test_cloudpanel_offline_contract.php
          python3 -B -m unittest discover -s tests -p 'test_r132_live_release_proof.py' -v
          echo P08_FINAL_PR57_EXACT_LOCKED_PHP_VUE_JS=PASS
      - name: Clean workspace
        if: always()
        shell: bash
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/.p08-source" "$RUNNER_TEMP/p08-final-devcheck.log" "$RUNNER_TEMP/p08-final-composer.log" "$RUNNER_TEMP/p08-final-npm.log"
