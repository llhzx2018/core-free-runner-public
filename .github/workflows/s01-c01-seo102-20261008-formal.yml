name: S01-C01 scoped SEO consumer 102 formal release
on:
  push:
    branches: [task/s01-c01-seo102-20261008-formal]
permissions:
  contents: read
  actions: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_REPO: 'llhzx2018/vf-tools-theme'
      TARGET_VERSION: '1.35.102'
      TARGET_SHA: '9b96ed7e97146430f8fb4f0cc75f8898563107cf'
      TARGET_TREE: '0e574f76e00703507989539e3460b93cf886a4f8'
      SOURCE_VERSION: '1.35.101'
      CANDIDATE_RUN: '37711728075'
      CANDIDATE_SHA: 'baf72e4a6a1a002efae87a055a7c33255b579f7a'
      CANDIDATE_RUNNER_SHA: '5017c968e428b4916555f633628e7e84a509856f'
      CANDIDATE_ARTIFACT_ID: '11522535133'
      CANDIDATE_ARTIFACT_DIGEST: 'sha256:a69249578f929f9a2b36af1586ce20a9ae015cc2058d004d92f41824914b217f'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runner
          persist-credentials: false
      - name: Target-owned formal lane identity preflight
        run: |
          set -Eeuo pipefail
          mkdir -p proof
          python3 runner/scripts/ephemeral_lane_spec.py render --spec runner/lanes/s01-c01-seo102-20261008/formal-spec.json --template runner/lanes/s01-c01-seo102-20261008/formal.template.yml --output /tmp/preview-formal-rendered.yml >/dev/null
          cmp /tmp/preview-formal-rendered.yml runner/.github/workflows/s01-c01-seo102-20261008-formal.yml
          python3 runner/scripts/ephemeral_lane_spec.py audit-rendered --spec runner/lanes/s01-c01-seo102-20261008/formal-spec.json --input runner/.github/workflows/s01-c01-seo102-20261008-formal.yml > proof/formal-lane-identity-audit.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Reverse verify exact tested tree and rebuilt bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$CANDIDATE_RUN --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$CANDIDATE_RUN --jq .head_sha)" = "$CANDIDATE_RUNNER_SHA"
          gh api "repos/llhzx2018/core-free-runner-public/actions/artifacts/$CANDIDATE_ARTIFACT_ID" > /tmp/tested-artifact-meta.json
          gh api "repos/llhzx2018/core-free-runner-public/actions/artifacts/$CANDIDATE_ARTIFACT_ID/zip" > /tmp/tested-artifact.zip
          python3 - <<'PYARTIFACT'
          import os,json,pathlib,hashlib,zipfile,stat
          meta=json.loads(pathlib.Path('/tmp/tested-artifact-meta.json').read_text())
          data=pathlib.Path('/tmp/tested-artifact.zip').read_bytes()
          assert meta['id']==int(os.environ['CANDIDATE_ARTIFACT_ID']) and meta['workflow_run']['id']==int(os.environ['CANDIDATE_RUN'])
          assert meta['workflow_run']['head_sha']==os.environ['CANDIDATE_RUNNER_SHA'] and not meta['expired']
          assert meta['digest']==os.environ['CANDIDATE_ARTIFACT_DIGEST']=='sha256:'+hashlib.sha256(data).hexdigest()
          assert meta['size_in_bytes']==len(data)
          with zipfile.ZipFile('/tmp/tested-artifact.zip') as z:
              assert z.testzip() is None
              names=z.namelist();assert len(names)==len(set(names))
              for entry in z.infolist():
                  p=pathlib.PurePosixPath(entry.filename)
                  assert not p.is_absolute() and '..' not in p.parts and '\\' not in entry.filename and not stat.S_ISLNK(entry.external_attr>>16)
                  assert p.suffix in ['.json','.png']
                  if p.suffix=='.json':json.loads(z.read(entry))
              z.extractall('tested')
          PYARTIFACT
          python3 - <<'PYGATE'
          import json,pathlib,os
          p=pathlib.Path('tested');d=json.loads((p/'FINAL_EVIDENCE.json').read_text())
          assert d['status']=='PASS' and d['source_sha']==os.environ['CANDIDATE_SHA'] and d['source_tree']==os.environ['TARGET_TREE'] and d['version']==os.environ['TARGET_VERSION']
          assert d['upgrade']==d['rollback']==d['reapply']==d['clean_install']==d['canonical_data_preservation']=='PASS'
          assert d['security_boundary']=='SOURCE_PACKAGE_SECRET_SCAN_PASS' and d['frozen_shell_header_menu']=='PASS'
          assert d['provider_actual_language_reads']==22 and d['provider_acceptance']=='NOT_PROVEN_FAIL_CLOSED_PRESERVED'
          assert d['seo_controls_cases']==60 and d['head_xml']==d['polylang']=='PASS' and d['directory_widths']==6
          assert d['production']=='NOT_EXECUTED' and d['owner_real_use']=='PENDING_POST_MANUAL_UPGRADE'
          for name in ['provider-actual.json','provider-reapply.json','envelope-contract.json','flat-contract.json','null-contract.json','heading-contract.json','directory-contract.json','live-browser.json','public-output.json','paired-output.json','directory-browser.json','clean-install.json','upgrade-rollback.json','performance.json']:
              assert json.loads((p/name).read_text())['status']=='PASS',name
          for name in ['provider-baseline.json','provider-rollback.json']: assert json.loads((p/name).read_text())['status']=='REPRODUCED'
          assert json.loads((p/'clean-install.json').read_text())['setup_revisit']=='LOCKED_ALREADY_INSTALLED'
          assert json.loads((p/'upgrade-rollback.json').read_text())['repeat_install']=='PASS'
          gate=json.loads(pathlib.Path('runner/lanes/s01-c01-seo102-20261008/release-authority.json').read_text())
          assert gate['source_sha']==os.environ['CANDIDATE_SHA'] and gate['source_tree']==os.environ['TARGET_TREE']
          assert gate['owner_preview_runtime_applicability']=='N_A' and gate['production_auto_apply'] is False
          assert all(x['result'] in ['REQUIRED','CONDITIONAL','N_A'] for x in gate['applicability'].values())
          print('SCOPED_RELEASE_REVERSE_PASS')
          PYGATE
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          cp -a runner/lanes/s01-c01-seo102-20261008 lane
          python3 lane/build.py
          python3 - <<'PY'
          import json,pathlib
          tested=json.loads(pathlib.Path('tested/FINAL_EVIDENCE.json').read_text()); built=json.loads(pathlib.Path('proof/identity.json').read_text())
          for key in ['asset','asset_bytes','asset_sha256','source_tree','version']: assert tested[key]==built[key],key
          PY
      - name: Publish private formal Release and exact remote readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          ASSET="vf-tools-theme_V${TARGET_VERSION}.zip"; TAG="v$TARGET_VERSION"
          cat > /tmp/release-notes.md <<EOF
          VF Tools Theme V$TARGET_VERSION

          修复技术 SEO 消费端把 Provider 响应元数据当成工具路由、忽略 data.tools、以及使用公开 slug 而非内部 tool_id 读取语义/语言/索引状态/真实验收/Lastmod 的问题；兼容旧扁平响应和字符串 Lastmod。
          Sitemap 无合格 URL 时显示实际排除原因和语言页数量。保留缺少真实验收、noindex、禁用、语言不完整与 Canonical none 的排除规则，不伪造 Provider 验收、不把未验收工具加入 Sitemap。
          修复工具目录分类点击后回到全部、关键词与分类组合丢失；服务端与浏览器筛选一致，刷新保留状态、清除恢复完整工具池，原生请求可显示真实匹配/空结果。
          工具目录在模块标题与推荐小标题相同时仅显示一次标题，保留六个推荐入口与不同自定义标题。
          Exact candidate Run: $CANDIDATE_RUN。实际 C03 1.25.59 API 只读核对 11 工具/22 语言页；隔离 WordPress 原生 101→102 升级/回退/再应用/重复安装、配置保留、干净安装/首次请求/登录/安装锁定、60 项 SEO 控件、13 项 HTTP Head/XML、6 项真实 Polylang、目录六宽度、16 项真实搜索/筛选/刷新/清除/下拉与原生请求，以及 Provider 响应形态/失败排除正反例通过。
          只声明本次修复范围机器证据通过，不声明全产品、Provider 播放算法、真实工具验收、OWNER 产品验收或 Production PASS。Shell/Header/Header Menu 冻结，无数据模型、鉴权、Schema、Updater、Provider 写入或自动 Production。
          独立 Preview Runtime 按 SSOT 为 N_A；Production 由 OWNER 手工升级，之后完成真实使用确认。
          Exact promoted source: $TARGET_SHA; tree: $TARGET_TREE。
          EOF
          if gh release view "$TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            test "$(gh api repos/$TARGET_REPO/git/ref/tags/$TAG --jq .object.sha)" = "$TARGET_SHA"
          else
            gh release create "$TAG" "proof/$ASSET" --repo "$TARGET_REPO" --target "$TARGET_SHA" --title "VF Tools Theme V$TARGET_VERSION" --notes-file /tmp/release-notes.md
          fi
          gh api "repos/$TARGET_REPO/releases/tags/$TAG" > proof/remote-release.json
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/$TAG --jq .object.sha)" = "$TARGET_SHA"
          mkdir readback
          gh release download "$TAG" --repo "$TARGET_REPO" --pattern "$ASSET" --dir readback
          cmp "proof/$ASSET" "readback/$ASSET"
          python3 - <<'PY'
          import json,pathlib,os
          p=pathlib.Path('proof'); m=json.loads((p/'identity.json').read_text());r=json.loads((p/'remote-release.json').read_text());t=json.loads(pathlib.Path('tested/FINAL_EVIDENCE.json').read_text());assert not r['draft'] and not r['prerelease'];a=[a for a in r['assets'] if a['name']==m['asset']];assert len(a)==1 and a[0]['size']==m['asset_bytes'] and a[0]['digest']=='sha256:'+m['asset_sha256'];m.update(release_id=r['id'],asset_id=a[0]['id'],released_at=r['published_at'],runtime_files=t['runtime_files'],runtime_fingerprint=t['runtime_fingerprint'],candidate_run=os.environ['CANDIDATE_RUN'],upgrade_run=os.environ['CANDIDATE_RUN'],formal_release='PASS',remote_readback='PASS',distribution='NOT_EXECUTED',production='NOT_EXECUTED');(p/'RELEASE_RECEIPT.json').write_text(json.dumps(m,indent=2));print(json.dumps(m))
          PY
      - name: Public-safe receipt
        id: receipt_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c01-formal-seo102-${{ github.run_id }}
          path: proof/RELEASE_RECEIPT.json
          retention-days: 30
          if-no-files-found: error

      - name: Read back actual formal receipt ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT_ARTIFACT_ID: ${{ steps.receipt_artifact.outputs.artifact-id }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$RECEIPT_ARTIFACT_ID" > /tmp/formal-receipt-meta.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$RECEIPT_ARTIFACT_ID/zip" > /tmp/formal-receipt.zip
          python3 - <<'PYRECEIPT'
          import os,json,pathlib,hashlib,zipfile
          meta=json.loads(pathlib.Path('/tmp/formal-receipt-meta.json').read_text())
          data=pathlib.Path('/tmp/formal-receipt.zip').read_bytes()
          digest='sha256:'+hashlib.sha256(data).hexdigest()
          assert meta['id']==int(os.environ['RECEIPT_ARTIFACT_ID']) and meta['workflow_run']['id']==int(os.environ['GITHUB_RUN_ID'])
          assert meta['workflow_run']['head_sha']==os.environ['GITHUB_SHA']
          assert not meta['expired'] and meta['digest']==digest and meta['size_in_bytes']==len(data)
          with zipfile.ZipFile('/tmp/formal-receipt.zip') as z:
              assert z.testzip() is None and z.namelist()==['RELEASE_RECEIPT.json']
              actual=json.loads(z.read('RELEASE_RECEIPT.json'))
              expected=json.loads(pathlib.Path('proof/RELEASE_RECEIPT.json').read_text())
              assert actual==expected and actual['source_sha']==os.environ['TARGET_SHA'] and actual['source_tree']==os.environ['TARGET_TREE'] and actual['formal_release']==actual['remote_readback']=='PASS'
          print('VF_FORMAL_AUDIT_BEGIN')
          print(pathlib.Path('proof/formal-lane-identity-audit.json').read_text())
          print('VF_FORMAL_AUDIT_END')
          print('VF_FORMAL_RECEIPT_BEGIN')
          print(json.dumps(actual))
          print('VF_FORMAL_RECEIPT_END')
          print('VF_FORMAL_ARTIFACT_BEGIN')
          print(json.dumps({'status':'PASS','id':meta['id'],'run_id':int(os.environ['GITHUB_RUN_ID']),'bytes':len(data),'digest':digest,'crc':'PASS','json_readback':'PASS'}))
          print('VF_FORMAL_ARTIFACT_END')
          PYRECEIPT
      - name: Private workspace cleanup
        if: always()
        run: rm -rf target readback proof/*.zip
