name: P01 V2.36.0 Authority Merge Readiness
on:
  push:
    branches: [temp/p01-v2360-release-gate-20260901]
    paths: [.github/workflows/p01-v2360-authority-merge-readiness-20260901.yml]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Exact read-only authority fence
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          MAIN=$(gh api repos/llhzx2018/vf-start/branches/main --jq .commit.sha)
          DEVELOP=$(gh api repos/llhzx2018/vf-start/branches/develop --jq .commit.sha)
          AUTH=$(gh api repos/llhzx2018/vf-start/branches/authority/p01-v2360-release-closure-20260901 --jq .commit.sha)
          TAG=$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.36.0 --jq .object.sha)
          RELEASE=$(gh api repos/llhzx2018/vf-start/releases/tags/v2.36.0 --jq .id)
          CORE=$(gh api repos/llhzx2018/core-updates/branches/main --jq .commit.sha)
          test "$MAIN" = 225780b1ed56bbcc8e62ba465b1129e1c22ee60a
          test "$DEVELOP" = 225780b1ed56bbcc8e62ba465b1129e1c22ee60a
          test "$AUTH" = 2bba5995443a4fea6847dd42afcc1df6f480eb3e
          test "$TAG" = 225780b1ed56bbcc8e62ba465b1129e1c22ee60a
          test "$RELEASE" = 380209550
          test "$CORE" = 447e5f97bfaef078c31b752126f3b5bd0284a5ee
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33469554421 --jq .conclusion)" = success
          printf 'P01_V2360_AUTHORITY_MERGE_READY=PASS\nMAIN=%s\nDEVELOP=%s\nAUTH=%s\nTAG=%s\nRELEASE=%s\nCORE_UPDATES=%s\nOWNER_PRODUCTION_WRITE=NO\n' "$MAIN" "$DEVELOP" "$AUTH" "$TAG" "$RELEASE" "$CORE"
