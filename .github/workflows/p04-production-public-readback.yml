name: P04 Production Public Readback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p04-production-public-readback.yml'

permissions:
  contents: read

concurrency:
  group: p04-production-public-readback
  cancel-in-progress: false

jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PROD_URL: https://infra.kewaro.com
      EXPECTED_ASSET_BYTES: '41442'
      EXPECTED_ASSET_SHA256: 3431cae2a905110669c8437fd2e2270bc74eacfe297ed4d9768eb3902a94eb10
      RELEASE_ASSET_API: https://api.github.com/repos/llhzx2018/vf-infra/releases/assets/515855401
    steps:
      - name: Require unified read credential
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo 'VF_PRIVATE_READ_TOKEN=AVAILABLE'

      - name: Live Production login page readback
        shell: bash
        run: |
          set -Eeuo pipefail
          out="$RUNNER_TEMP/login.html"
          curl --fail --silent --show-error --location --max-time 20 --output "$out" "$PROD_URL/login.php"
          python3 - "$out" <<'PY'
          import re, pathlib, sys
          text=pathlib.Path(sys.argv[1]).read_text(encoding='utf-8',errors='replace')
          matches=re.findall(r'VF Infra\s*·\s*V([0-9]+(?:\.[0-9]+){2})', text)
          if not matches:
              print('PRODUCTION_VERSION_READBACK=NOT_FOUND')
              raise SystemExit(2)
          print('PRODUCTION_VERSION='+matches[-1])
          print('LOGIN_CONTRACT=' + ('PASS' if 'name="csrf"' in text and 'name="password"' in text else 'FAIL'))
          PY

      - name: Maintenance authentication boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          headers="$RUNNER_TEMP/maintenance.headers"
          curl --silent --show-error --max-time 20 --output /dev/null --dump-header "$headers" "$PROD_URL/maintenance.php"
          code=$(awk 'NR==1{print $2}' "$headers")
          location=$(awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/\r$/,"",$0); print substr($0,index($0,":")+2); exit}' "$headers")
          echo "MAINTENANCE_UNAUTH_HTTP=$code"
          echo "MAINTENANCE_LOCATION=$location"
          case "$code" in 301|302|303|307|308) ;; *) echo 'MAINTENANCE_AUTH_BOUNDARY=FAIL'; exit 1;; esac
          printf '%s' "$location" | grep -Fq 'login.php?return=maintenance.php'
          echo 'MAINTENANCE_AUTH_BOUNDARY=PASS'

      - name: Formal UPDATE remote identity readback
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          out="$RUNNER_TEMP/VF_Infra_V2.5.2_UPDATE.zip"
          curl --fail --silent --show-error --location --max-time 60 \
            -H 'Accept: application/octet-stream' \
            -H "Authorization: Bearer $READ_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$RELEASE_ASSET_API" -o "$out"
          bytes=$(stat -c '%s' "$out")
          sha=$(sha256sum "$out" | awk '{print $1}')
          test "$bytes" = "$EXPECTED_ASSET_BYTES"
          test "$sha" = "$EXPECTED_ASSET_SHA256"
          test "$(unzip -Z1 "$out" | wc -l | tr -d ' ')" = '1'
          test "$(unzip -Z1 "$out")" = 'repair-v2.5.2.php'
          echo "FORMAL_UPDATE_BYTES=$bytes"
          echo "FORMAL_UPDATE_SHA256=$sha"
          echo 'FORMAL_UPDATE_IDENTITY=PASS'

      - name: Public readback summary
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'P04_PRODUCTION_PUBLIC_READBACK=PASS'
          echo 'NO_PRODUCTION_WRITE_EXECUTED=TRUE'
