name: P01 V2.47.241 Backend Discovery Proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p01-v247241-backend-discovery.yml"
      - "proof-triggers/p01-v247241-backend-discovery.json"

permissions:
  contents: read

jobs:
  discovery:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout proof control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli curl jq >/dev/null
          php -v >/dev/null

      - name: Checkout exact P01 source
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" product
          git -C product fetch -q --depth 1 origin 2329303d660dc817562cb94ac78be405365944c4
          git -C product checkout -q --detach FETCH_HEAD
          test "$(git -C product rev-parse HEAD)" = "2329303d660dc817562cb94ac78be405365944c4"
          test "$(tr -d '\r\n ' < product/VERSION)" = "2.47.241"
          echo P01_DISCOVERY_EXACT_SOURCE=PASS

      - name: Read live stable manifest and formal release
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          curl -fsSL             -H "Authorization: Bearer $READ_TOKEN"             -H "Accept: application/vnd.github.raw+json"             "https://api.github.com/repos/llhzx2018/core-updates/contents/projects/P01.json?ref=main"             -o /tmp/P01.json

          jq -e '
            .project_id=="P01" and
            .component_id=="APP" and
            .enabled==true and
            .current_version=="2.47.240" and
            .target_version=="2.47.241" and
            .update_type=="ATOMIC" and
            .from_versions==["2.47.240"] and
            .schema_from=="2026090401" and
            .schema_to=="2026090401" and
            .release_tag=="v2.47.241" and
            .release_id==403166952 and
            .product_identity=="2329303d660dc817562cb94ac78be405365944c4" and
            .asset_name=="VF_Start_V2.47.241_UPDATE.zip" and
            .asset_bytes==2319878 and
            .asset_sha256=="c4e2390e996db50a0aa360f92cc3cb4d45dd876673ce78d9c21c6a1a74bb3dce" and
            .backup_required==true and
            .rollback_supported==true
          ' /tmp/P01.json >/dev/null

          curl -fsSL             -H "Authorization: Bearer $READ_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/llhzx2018/vf-start/releases/tags/v2.47.241"             -o /tmp/release.json

          jq -e '
            .id==403166952 and
            .tag_name=="v2.47.241" and
            .draft==false and
            .prerelease==false and
            any(.assets[]; .name=="VF_Start_V2.47.241_UPDATE.zip" and .size==2319878 and .digest=="sha256:c4e2390e996db50a0aa360f92cc3cb4d45dd876673ce78d9c21c6a1a74bb3dce")
          ' /tmp/release.json >/dev/null
          echo P01_DISCOVERY_LIVE_AUTHORITIES=PASS

      - name: Prove backend reports AVAILABLE
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/check.php <<'PHP'
          <?php
          declare(strict_types=1);
          require $argv[1] . '/src/app/CoreUpdates/UpdateCore.php';
          $manifest=json_decode((string)file_get_contents('/tmp/P01.json'),true,512,JSON_THROW_ON_ERROR);
          $core=new CoreUpdates\UpdateCore('P01','APP');
          $result=$core->check('2.47.240','2026090401',$manifest);
          if (($result['status']??'')!=='AVAILABLE') {
              fwrite(STDERR,json_encode($result,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n");
              exit(1);
          }
          if (($result['target_version']??'')!=='2.47.241' || ($result['update_type']??'')!=='ATOMIC') exit(2);
          echo "P01_BACKEND_DISCOVERY=PASS status=AVAILABLE current=2.47.240 target=2.47.241 update_type=ATOMIC\n";
          PHP
          php /tmp/check.php product
          echo PRODUCTION_WRITE=NO
