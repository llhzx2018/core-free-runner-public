name: P01 UX01 Global Shell

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ux01-global-shell.yml'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: 8ecb7042a49c4ea0a0c4d3295c9b9f962c0077dd
    steps:
      - name: Checkout exact P01 candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.EXPECTED_SHA }}
          path: vf-start
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Verify exact SHA and version
        working-directory: vf-start
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          test "$(tr -d '\r\n ' < VERSION)" = "2.47.0"
          echo "UX01_EXACT_SHA=$actual"
          echo "UX01_VERSION=2.47.0"

      - name: PHP lint focused contracts
        working-directory: vf-start
        run: |
          php -l tests/unit/ux01_global_visual_system_contract.php
          php -l tests/unit/subject_domain_nav_shell_contract.php
          php -l tests/unit/mobile_product_controls_contract.php

      - name: UX01 global visual-system contract
        working-directory: vf-start
        run: php tests/unit/ux01_global_visual_system_contract.php

      - name: R95 subject shell regression
        working-directory: vf-start
        run: php tests/unit/subject_domain_nav_shell_contract.php

      - name: R96 mobile controls regression
        working-directory: vf-start
        run: php tests/unit/mobile_product_controls_contract.php

      - name: Exact candidate gate
        run: echo "UX01_EXACT_CANDIDATE_GATE_PASS"

      - name: Cleanup private source
        if: always()
        shell: bash
        run: rm -rf vf-start
