name: P02 V2.5.17 Formal Verify And Publish

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p02-v2517-formal-release.yml']

permissions:
  contents: read

jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Require registered capabilities
        env:
          RELEASE_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
        run: test -n "$RELEASE_TOKEN"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: 04eb2f92028c864c0fecf4468db9fc0a34257143
          token: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
          path: product
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize sealed formal pipeline for V2.5.17
        env:
          PRODUCT_REF: 04eb2f92028c864c0fecf4468db9fc0a34257143
          RELEASE_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
        run: |
          set -Eeuo pipefail
          git fetch origin task/p02-v2511-formal-release
          git show FETCH_HEAD:scripts/p02-v2510-formal-release.sh > "$RUNNER_TEMP/p02-v2517-formal.sh"
          python3 - "$RUNNER_TEMP/p02-v2517-formal.sh" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]);s=p.read_text(encoding='utf-8')
          s=s.replace('2.5.10','2.5.17')
          s=s.replace('2.5.9','2.5.16')
          s=s.replace('32225789953','32276072517')
          s=s.replace('test "$(jq -r .runtime_source_file_count SOURCE_MANIFEST.json)" = 72','test "$(jq -r .runtime_source_file_count SOURCE_MANIFEST.json)" = 74')
          marker="notes=out/f'VF_Library_V{VER}_RELEASE_NOTES.md'; notes.write_text(f'''";end="''')\n arts=[sz,fz,uz,az,rf,notes]"
          if marker in s and end in s:
              i=s.index(marker);j=s.index(end,i)
              notes="""notes=out/f'VF_Library_V{VER}_RELEASE_NOTES.md'; notes.write_text(f'''# VF Library V{VER}\n\nV2.5.17 is an Information Architecture Simplification maintenance release driven by authenticated OWNER real-use feedback.\n\n- Scratch / 临时工作台 is the true capture layer for quick notes and temporary material.\n- Library is the long-term saved material layer; legacy quick/article top-level navigation is removed from the primary IA.\n- Existing quick/article storage fields remain fully compatible; old local quick/article views safely normalize to 全部资料.\n- Visible terminology is simplified to 资料 / 长文 rather than exposing internal quick/article concepts.\n- 最近使用 now reflects explicit opening, reading, editing, copying or calling content instead of depending on the legacy optional article-open counter.\n- Candidate Run 32276072517 PASS: 74/74 Source Exact, Fresh Install, real Chromium IA/recent-use semantics, legacy mode fallback and 390px no overflow.\n- Provides the canonical direct Atomic path from authenticated Production {SRCVER} to V{VER}.\n- Schema remains {SCHEMA}; no migration.\n''')\n arts=[sz,fz,uz,az,rf,notes]"""
              s=s[:i]+notes+s[j+len(end):]
          p.write_text(s,encoding='utf-8')
          PY
          bash "$RUNNER_TEMP/p02-v2517-formal.sh"
