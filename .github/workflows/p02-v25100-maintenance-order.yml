name: P02 V2.5.100 Maintenance Request Order

on:
  push:
    branches:
      - run/p02-v25100-maintenance-order-20260923
    paths:
      - '.github/workflows/p02-v25100-maintenance-order.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact P02 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 553a7528ad773a988d57c6b249beac7856a7fc7d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product
      - name: Install runtime and Chromium
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-zip sqlite3 unzip curl
          cd product
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Exact-source source and unit
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "553a7528ad773a988d57c6b249beac7856a7fc7d"
          test "$(cat VERSION)" = "2.5.100"
          python3 scripts/generate-source-manifest.py
          git diff --exit-code -- SOURCE_MANIFEST.json SOURCE_MANIFEST.txt
          node --check public/assets/app.js
          node --check public/assets/maintenance.js
          node tests/unit/p02_v25100_maintenance_request_order.mjs
          while IFS= read -r cmd; do test -n "$cmd"; eval "$cmd"; done < <(awk '/run: node tests\/unit\//{sub(/^.*run: /,""); print}' .github/workflows/repository-health.yml)
          bash scripts/verify-repository.sh
          echo P02_V25100_MAINTENANCE_ORDER_SOURCE=PASS
      - name: Maintenance baseline
        working-directory: product
        env:
          TEST_PASSWORD: VF-P02-V25100-${{ github.run_id }}!
          EVIDENCE_DIR: ${{ runner.temp }}/p02-v25100-maintenance-order
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          bash scripts/maintenance-reverify.sh
          echo P02_V25100_MAINTENANCE_ORDER_MAINTENANCE=PASS
      - name: Focused Chromium request order
        working-directory: product
        env:
          VF_UX_FOCUSED_MAINTENANCE_ORDER: "1"
          VF_UX_E2E_PASSWORD: VF-P02-V25100-${{ github.run_id }}!
        run: |
          set -Eeuo pipefail
          timeout 240s bash scripts/ux-browser-reverify.sh
          echo P02_V25100_MAINTENANCE_ORDER_BROWSER_GATE=PASS
