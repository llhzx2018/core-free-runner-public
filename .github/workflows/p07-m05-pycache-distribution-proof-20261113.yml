name: P07-M05 新服务器初始化 · 正式发行后公共工具箱完整交互验收
on:
  push:
    branches: [fix/p07-m05-cache-recovery-20261113]
    paths:
      - .github/workflows/p07-m05-pycache-distribution-proof-20261113.yml
permissions:
  contents: read
jobs:
  public-Toolbox-Owner-confirm-identity-and-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Read official new released asset directly and validate exact Toolbox pins
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n installers/p07-toolbox.sh
          test "$(git hash-object installers/p07-m05-cache-recovery.py)" = ab185d13f3db07b76bd2ccc5da80263acbeffa3c
          grep -Fxq 'M05_CACHE_RECOVERY_URL="https://github.com/llhzx2018/core-free-runner-public/releases/download/p07-m05-v0.1.0-pycache-safe1-20261113/P07-M05-CACHE-RECOVERY.py"' installers/p07-toolbox.sh
          grep -Fxq 'M05_BUILD_EXPECTED="0.1.0-m05-pycache-safe1"' installers/p07-toolbox.sh
          grep -Fxq 'M05_UPGRADE_FROM3="0.1.0-m05-clean-host-guard1"' installers/p07-toolbox.sh
          grep -Fxq 'M05_BUNDLE_SHA256="fca55ed4c949a1353602d5ed7e5a6184921f650b0320c3dead8a41f9d86b6370"' installers/p07-toolbox.sh
          test "$(NO_COLOR=1 bash installers/p07-toolbox.sh --version | head -n1)" != ""
          mkdir -p "$RUNNER_TEMP/p07-distributed"
          dir="$RUNNER_TEMP/p07-distributed"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 2 --max-time 90 \
            'https://github.com/llhzx2018/core-free-runner-public/releases/download/p07-m05-v0.1.0-pycache-safe1-20261113/P07-M05-0.1.0-m05-pycache-safe1.zip' \
            -o "$dir/new.zip"
          echo "fca55ed4c949a1353602d5ed7e5a6184921f650b0320c3dead8a41f9d86b6370  $dir/new.zip" | sha256sum -c --status
          echo P07_M05_PUBLIC_OFFICIAL_ASSET_ONLINE_SHA256=PASS
      - name: Simulate broken existing Owner install and CLI relaunch using official old ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          dir="$RUNNER_TEMP/p07-distributed"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 2 --max-time 90 \
            https://github.com/llhzx2018/core-free-runner-public/releases/download/p07-m05-v0.1.0-clean-host-guard1-20261113/P07-M05-0.1.0-m05-clean-host-guard1.zip \
            -o "$dir/old.zip"
          echo "b2b72275980f7c2220f0c95fce18f644967bd69a17fa0a8320f96149a4096a1a  $dir/old.zip" | sha256sum -c --status
          sudo python3 -B installers/p07-m05-atomic.py install "$dir/old.zip" \
            b2b72275980f7c2220f0c95fce18f644967bd69a17fa0a8320f96149a4096a1a
          python3 - <<'PY'
          from pathlib import Path
          source=Path('installers/p07-toolbox.sh').read_text()
          x=source.index('m05_verified_current() {')
          y=source.index('\n# P07-M05 新服务器初始化 · identity-failure diagnostic',x)
          Path('/tmp/p07-m05-official-verify.sh').write_text(
           '#!/usr/bin/env bash\nset -Eeuo pipefail\n'
           'M05_ROOT=/opt/vfops-modules/m05\nM05_RUNTIME="$M05_ROOT/current/bin/vfops-init-entry"\n'
           +source[x:y]+'\nm05_verified_current\n')
          PY
          bash /tmp/p07-m05-official-verify.sh
          sudo env -u PYTHONDONTWRITEBYTECODE -u PYTHONPYCACHEPREFIX \
             bash /opt/vfops-modules/m05/current/bin/vfops-init-core server-migrate target-status >/dev/null
          count="$(sudo find /opt/vfops-modules/m05/current/lib/__pycache__ -type f -name '*.pyc' | wc -l)"
          test "$count" -gt 30
          if bash /tmp/p07-m05-official-verify.sh >/dev/null 2>&1; then
            echo P07_M05_PREVIOUS_OFFICIAL_CACHE_DEFECT_NOT_REPRODUCED; exit 13
          fi
          echo "P07_M05_PRIOR_OFFICIAL_SELF_REJECTION_REPRODUCED=$count"
      - name: Exercise actual Toolbox default N, Owner Y cache recovery, separate upgrade N/Y
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os,pty,select,signal,tempfile,time
          from pathlib import Path
          source=Path('installers/p07-toolbox.sh').read_text()
          marker='\ncase "'+chr(36)+'{1:-}" in'
          assert source.count(marker)==1
          with tempfile.TemporaryDirectory(prefix='p07-m05-release-pty-') as d:
            executable=Path(d)/'real-toolbox-functions.sh'
            executable.write_text(source.split(marker)[0]+'\nensure_m05_current\n')
            questions=[
              '确认仅隔离 M05 Python 缓存并重新校验？[y/N]：'.encode(),
              '确认仅升级 P07-M05 新服务器初始化？[y/N]：'.encode()
            ]
            def invoke(answers):
              pid,ptym=pty.fork()
              if pid==0:
                os.execvp('sudo',['sudo','bash',str(executable)])
              data=b'';asked=[False,False];which=0;end=time.monotonic()+105
              while time.monotonic()<end:
                ok,_,_=select.select([ptym],[],[],0.2)
                if ok:
                  try: chunk=os.read(ptym,8192)
                  except OSError:
                    _,st=os.waitpid(pid,0);os.close(ptym)
                    return os.waitstatus_to_exitcode(st),data.decode(errors='replace'),asked
                  if not chunk:
                    _,st=os.waitpid(pid,0);os.close(ptym)
                    return os.waitstatus_to_exitcode(st),data.decode(errors='replace'),asked
                  data+=chunk
                  for i,prompt in enumerate(questions):
                    if not asked[i] and prompt in data:
                      asked[i]=True
                      if which<len(answers):
                        os.write(ptym,(answers[which]+'\n').encode())
                        which+=1
                done,st=os.waitpid(pid,os.WNOHANG)
                if done:
                  os.close(ptym)
                  return os.waitstatus_to_exitcode(st),data.decode(errors='replace'),asked
              os.kill(pid,signal.SIGKILL);os.waitpid(pid,0);os.close(ptym)
              raise RuntimeError('Toolbox PTY interaction timed out')
            root=Path('/opt/vfops-modules/m05')
            current=lambda: os.readlink(root/'current')
            before='releases/0.1.0-m05-clean-host-guard1'
            assert current()==before
            code,out,asked=invoke(['n'])
            assert code!=0 and asked[0] and current()==before and '已取消' in out,(code,out[-1500:],asked)
            assert (root/'current/lib/__pycache__').is_dir()
            print('P07_M05_TOOLBOX_OWNER_CACHE_N_PRESERVES_OLD=PASS')
            code,out,asked=invoke(['y','n'])
            assert code!=0 and all(asked) and current()==before and '未确认 M05 升级' in out,(code,out[-1700:],asked)
            assert not (root/'current/lib/__pycache__').exists()
            assert (root/'.cache-quarantine').is_dir()
            print('P07_M05_TOOLBOX_OWNER_CACHE_Y_UPGRADE_N_PRESERVES_OLD=PASS')
            # Clean old build: separate upgrade prompt Y must fetch the real
            # official ZIP from GitHub and atomically switch M05 only.
            code,out,asked=invoke(['y'])
            assert code==0 and asked[1],(code,out[-1900:],asked)
            assert current()=='releases/0.1.0-m05-pycache-safe1'
            print('P07_M05_TOOLBOX_OFFICIAL_ASSET_OWNER_UPGRADE_Y=PASS')
          PY
          bash /tmp/p07-m05-official-verify.sh
          sudo env -u PYTHONDONTWRITEBYTECODE -u PYTHONPYCACHEPREFIX \
            bash /opt/vfops-modules/m05/current/bin/vfops-init-core server-migrate target-status >/dev/null
          test ! -e /opt/vfops-modules/m05/current/lib/__pycache__
          bash /tmp/p07-m05-official-verify.sh
          sudo python3 -B installers/p07-m05-atomic.py rollback 0.1.0-m05-clean-host-guard1 \
            --confirm P07-M05:0.1.0-m05-clean-host-guard1
          test "$(readlink /opt/vfops-modules/m05/current)" = releases/0.1.0-m05-clean-host-guard1
          for module in m01 m02 m03 m04; do test ! -e "/opt/vfops-modules/$module"; done
          test ! -e /home/clp
          echo P07_M05_PUBLIC_ACTUAL_TOOLBOX_ROLLBACK_AND_RELAUNCH=PASS
          echo P07_M05_M01_TO_M04_AND_CLOUDPANEL_NOT_TOUCHED=YES
          echo P07_OWNER_PRODUCTION=NOT_TOUCHED
      - name: Clear test package copies and verify no credentials persisted
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/p07-distributed"
          echo P07_M05_PUBLIC_PROOF_PRIVACY=NO_PRIVATE_SOURCE_OR_SECRET
