name: P01 V2.36.3 Owner Production Closure R2
on:
  push:
    branches: [release/p01-v2363-candidate-20260901]
    paths: [.github/workflows/p01-v2363-owner-production-closure-r2-20260901.yml]
permissions:
  contents: read
jobs:
  closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE: f0a54a43af8614426995dc3894ccedfd919be8ac
      BRANCH: production/p01-v2363-owner-closure-20260901
      RUNTIME_TREE: 820724b585cb59864211f77c4fb33537b2345029
    steps:
      - name: Checkout runner script
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: release/p01-v2363-candidate-20260901
          path: runner
      - name: Checkout exact product closure branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: production/p01-v2363-owner-closure-20260901
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Write and gate owner Production closure
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          test "$(git rev-parse HEAD)" = "$BASE"
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          test "$(git ls-remote origin refs/heads/develop | cut -f1)" = "$BASE"
          cd ..
          python3 runner/scripts/p01_v2363_owner_production_closure.py product
          cd product
          git add VF_PROJECT.json docs/authority/CURRENT.md docs/evidence/P01_V2.36.3_OWNER_PRODUCTION_CLOSURE_20260901.md docs/handoff/CURRENT_STATE.md
          expected=$'VF_PROJECT.json\ndocs/authority/CURRENT.md\ndocs/evidence/P01_V2.36.3_OWNER_PRODUCTION_CLOSURE_20260901.md\ndocs/handoff/CURRENT_STATE.md'
          test "$(git diff --cached --name-only | sort)" = "$expected"
          test -z "$(git diff --cached --name-only -- src)"
          python3 -m json.tool VF_PROJECT.json >/dev/null
          jq -e '.production_version=="2.36.3" and .published_release.version=="2.36.3" and .production_release.version=="2.36.3" and .production_release.production_closure=="PASS" and .current_change.production_write==false' VF_PROJECT.json >/dev/null
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git commit -m 'docs(P01): close V2.36.3 Owner Production'
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          git push origin HEAD:"$BRANCH"
      - name: Remote exact-scope readback
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          git fetch origin "$BRANCH" --quiet
          test "$(git rev-parse origin/$BRANCH:src)" = "$RUNTIME_TREE"
          test "$(git diff --name-only "$BASE" origin/$BRANCH | sort)" = $'VF_PROJECT.json\ndocs/authority/CURRENT.md\ndocs/evidence/P01_V2.36.3_OWNER_PRODUCTION_CLOSURE_20260901.md\ndocs/handoff/CURRENT_STATE.md'
