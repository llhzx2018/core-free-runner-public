name: S01 Theme exact formal release
on:
  push:
    branches: [task/s01-article-ads189-release-20261025]
    paths: ['.github/workflows/s01-article-ads189-20261025-formal.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.189
  TARGET_SHA: 58438a8b2e70808e5c155db9425e05e8e10b73e7
  TARGET_TREE: 3c14f2f83c347ca97d0713ce85d95975c3d4fec9
  BASE_SHA: de19c8ceedef4a0da7f05ed677a0155c1eeb5b7f
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - name: Formal identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-article-ads189-20261025/formal-spec.json --input control/.github/workflows/s01-article-ads189-20261025-formal.yml
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 58438a8b2e70808e5c155db9425e05e8e10b73e7
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact candidate, merged tree and required evidence readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider candidate-proof
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40173249865 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40173249865 --jq .head_sha)" = c70a76e23c0818ab5af2f291be14bf4f3d930883
          test "$(gh api repos/$TARGET_REPO/commits/main --jq .sha)" = "$TARGET_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$TARGET_SHA --jq .tree.sha)" = "$TARGET_TREE"
          gh run download 40173249865 --repo llhzx2018/core-free-runner-public --name s01-home-40173249865 --dir candidate-proof
          cmp candidate-proof/state-before.sha256 candidate-proof/state-after.sha256
          cmp candidate-proof/contracts-before.json candidate-proof/contracts-after.json
          python3 control/lanes/s01-article-ads189-20261025/package.py
          python3 - <<'PYVERIFY'
          import json,pathlib
          r=pathlib.Path('candidate-proof')
          old=json.loads((r/'package.json').read_text());new=json.loads(pathlib.Path('proof/package.json').read_text())
          assert old['source']=='6d565dd7ae45cbe1b97f1b835a7fdff36aa3474d'
          phases={phase:json.loads((r/(phase+'-article-ad-summary.json')).read_text()) for phase in ['before','upgrade','rollback','after','fallback']}
          for phase,result in phases.items():
              assert result['status']=='PASS' and result['errors']==result['writes']==[]
              assert len(result['rows'])==({'before':4,'upgrade':1,'rollback':1,'after':8,'fallback':2}[phase])
              assert all(row['status']=='PASS' for row in result['rows'])
          for lang in ['en','zh']:
              for width in [1440,1024]:
                  for state in ['off','ready']:assert (r/('article-ads-'+lang+'-'+state+'-'+str(width)+'.png')).stat().st_size>1000
                  base=json.loads((r/('ad-baseline-'+lang+'-'+str(width)+'.json')).read_text())
                  shown=json.loads((r/('article-ads-'+lang+'-off-'+str(width)+'.json')).read_text())
                  for key in ['h1','body','title','description','canonical','hreflang','robots','schema']:assert shown[key]==base[key]
                  assert not shown['overflow'] and abs(shown['reading']['w']-760)<2
                  if width==1440:assert abs(shown['group']['w']-1120)<2
          assert json.loads((r/'clean-install.json').read_text())['status']=='PASS'
          for k in ['status','version','tree','sha256','bytes','files']:assert old[k]==new[k],k
          assert new['sha256']=='9510212164cf0c84f59eeace71c99f59b079816734219af28f573328c6734b5e' and new['bytes']==1996332
          coverage=json.loads(pathlib.Path('control/lanes/s01-article-ads189-20261025/release-authority.json').read_text())
          assert set(coverage['required'])=={'TESTING','GIT','UA_UI','SEO','SECURITY','INSTALL','UPGRADE','DATA_SCHEMA','PERFORMANCE'}
          assert coverage['source']=='6d565dd7ae45cbe1b97f1b835a7fdff36aa3474d' and coverage['tree']=='3c14f2f83c347ca97d0713ce85d95975c3d4fec9'
          assert coverage['owner_preview_runtime']=='POST_RELEASE_REQUIRED'
          assert coverage['release_mode']=='OWNER_DIRECT_REVERSIBLE_UI_RELEASE'
          assert coverage['owner_real_use']=='POST_PRODUCTION_REQUIRED'
          assert coverage['production_auto_apply'] is False
          for item in coverage['required'].values():
              assert item['sha'] and item['acceptance']
              item['evidence_status']='PASS_EXACT_CANDIDATE_MACHINE'
          coverage['candidate_run']='40173249865'
          coverage['merged_source']='58438a8b2e70808e5c155db9425e05e8e10b73e7'
          coverage['formal_release_gate']='PASS'
          coverage['production_effect']='NOT_PROVEN_POST_MANUAL_UPGRADE_READBACK_REQUIRED'
          pathlib.Path('proof/public-authority-coverage.json').write_text(json.dumps(coverage,ensure_ascii=False,indent=2))
          print('MERGED_TREE_EQUALS_TESTED_TREE_AND_EXACT_PACKAGE_PASS')
          PYVERIFY
      - name: Publish only the exact verified package
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.35.189 --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create v1.35.189 provider/vf-tools-theme_V1.35.189.zip --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Theme V1.35.189' --notes '按已展示的中英文有无广告原型落地1120px文章整体、760px正文与320px侧栏，标题与正文同边界。目录在宽屏右侧、窄屏正文前；关闭目录与侧栏继续有效，后台宽度说明同步。广告复用既有Theme位置尺寸与Ops公开合同，未配置、空内容或不可用时不渲染广告框；不新增广告SDK或商业账户数据。中英文1440/1024真实WordPress布局与定向交互、SEO标签保留、干净安装、188升级189/回退/重复安装及数据保护通过。广告证据使用隔离合成合同，不代表真实投放、CWV或收录通过。476运行文件，M3U8保持1.25.94，Ops未改；Production由Owner手工升级，最终视觉与实际使用仍待确认，手机暂缓。' --latest
          fi
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/v1.35.189 --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh release view v1.35.189 --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - name: Authenticated remote ZIP byte comparison
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download v1.35.189 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.189.zip --dir remote
          cmp provider/vf-tools-theme_V1.35.189.zip remote/vf-tools-theme_V1.35.189.zip
          echo '9510212164cf0c84f59eeace71c99f59b079816734219af28f573328c6734b5e  remote/vf-tools-theme_V1.35.189.zip' | sha256sum -c
          test "$(stat -c %s remote/vf-tools-theme_V1.35.189.zip)" = 1996332
          gh release view v1.35.189 --repo "$TARGET_REPO" --json url,publishedAt,tagName > proof/formal-release.json
          echo FORMAL_RELEASE_EXACT_REMOTE_ASSET_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-home-formal-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target provider remote candidate-proof
