name: S01 Theme exact formal release
on:
  push:
    branches: [task/s01-search205-20261027]
    paths: ['.github/workflows/s01-search205-20261027-formal.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.205
  TARGET_SHA: 8804cd0b3db69440b204bf8b07879a29b9e93df2
  TARGET_TREE: c155149c8d54ce770fb4e8dcae98ff0b63e54877
  BASE_SHA: f7acf35d7d4898afb4d45e672089636fa5172336
  LANE_ID: s01-search205-20261027
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - name: Formal identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-search205-20261027/formal-spec.json --input control/.github/workflows/s01-search205-20261027-formal.yml
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 8804cd0b3db69440b204bf8b07879a29b9e93df2
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact candidate, merged tree and required evidence readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider candidate-proof
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40433696155 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40433696155 --jq .head_sha)" = 638dc847fd627055161b866044f365c3432bc58b
          test "$(gh api repos/$TARGET_REPO/commits/main --jq .sha)" = "$TARGET_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$TARGET_SHA --jq .tree.sha)" = "$TARGET_TREE"
          gh run download 40433696155 --repo llhzx2018/core-free-runner-public --name s01-home-40433696155 --dir candidate-proof
          cmp candidate-proof/state-before.sha256 candidate-proof/state-after.sha256
          cmp candidate-proof/contracts-before.json candidate-proof/contracts-after.json
          python3 control/lanes/s01-search205-20261027/package.py
          python3 - <<'PYVERIFY'
          import json,pathlib,subprocess,urllib.parse
          r=pathlib.Path('candidate-proof')
          old=json.loads((r/'package.json').read_text());new=json.loads(pathlib.Path('proof/package.json').read_text())
          assert old['source']=='9c7ed7aeb599a50738246af2a57e8be68c36fd75'
          for phase in ['before','after','smoke']:
              result=json.loads((r/('search-'+phase+'.json')).read_text())
              assert result['status']=='PASS' and len(result['rows'])==2 and result['errors']==[] and result['writes']==[]
          result=json.loads((r/'search-after.json').read_text())
          assert result['checks']>=100
          assert result['operationalAcceptance']=='OWNER_REVIEW_REQUIRED_AFTER_MANUAL_UPGRADE'
          for lang in ['zh','en']:
              for width in [1440,1024]:
                  assert (r/f'search-{lang}-{width}.png').stat().st_size>500
                  metrics=json.loads((r/f'metrics-{lang}-{width}.json').read_text())
                  assert metrics['border']=='0px' and metrics['padding']=='0px' and metrics['shadow']=='none'
              for name in ['entry','empty','static-empty','focus']: assert (r/f'search-{name}-{lang}.png').stat().st_size>500
              assert json.loads((r/f'reproduced-hidden-{lang}.json').read_text())['hiddenVisible']>0
          assert json.loads((r/'clean-install.json').read_text())['status']=='PASS'
          assert json.loads((r/'bootstrap.json').read_text())['status']=='PASS'
          for k in ['status','version','tree','sha256','bytes','files']: assert old[k]==new[k],k
          assert new['sha256']=='219b5d1e2c8f186afed49078bea357111f5e03ae8b48ec2cf3ff9125113f65d6' and new['bytes']==2008733
          coverage=json.loads(pathlib.Path('control/lanes/s01-search205-20261027/release-authority.json').read_text())
          assert set(coverage['required'])=={'TESTING','GIT','UA_UI','SEO','SECURITY','INSTALL','UPGRADE','DATA_SCHEMA','PERFORMANCE'}
          assert coverage['source']=='9c7ed7aeb599a50738246af2a57e8be68c36fd75' and coverage['tree']=='c155149c8d54ce770fb4e8dcae98ff0b63e54877'
          assert coverage['owner_preview_runtime']=='N_A'
          assert coverage['release_mode']=='PROJECT_PREVIEW_N_A'
          assert coverage['owner_real_use']=='POST_PRODUCTION_REQUIRED'
          assert coverage['production_auto_apply'] is False
          for item in coverage['required'].values():
              assert item['sha'] and item['acceptance']
              endpoint='repos/llhzx2018/gov-doc/contents/'+urllib.parse.quote(item['path'],safe='/')+'?ref=main'
              live=json.loads(subprocess.check_output(['gh','api',endpoint]))
              assert live['sha']==item['sha'],item['path']
              item['evidence_status']='PASS_EXACT_CANDIDATE_MACHINE'
          coverage['candidate_status']='PASS_EXACT_CANDIDATE_MACHINE'
          coverage['candidate_run']='40433696155'
          coverage['merged_source']='8804cd0b3db69440b204bf8b07879a29b9e93df2'
          coverage['formal_release_gate']='PASS'
          coverage['production_effect']='NOT_PROVEN_POST_MANUAL_UPGRADE_READBACK_REQUIRED'
          pathlib.Path('proof/public-authority-coverage.json').write_text(json.dumps(coverage,ensure_ascii=False,indent=2))
          print('MERGED_TREE_EQUALS_TESTED_TREE_AND_EXACT_PACKAGE_PASS')
          PYVERIFY
      - name: Publish only the exact verified package
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.35.205 --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create v1.35.205 provider/vf-tools-theme_V1.35.205.zip --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Theme V1.35.205' --notes '搜索页精修：参照实际查看的GOV.UK搜索页，移除重复范围框/首屏多余留白和逐条打开结果，标题摘要形成连续阅读列表，简化无匹配恢复并保留自定义文案。修复静态搜索hidden状态被后置卡片样式覆盖，实际可见结果与提示一致。博客单项末页计数使用单数；后台历史区记录204实际截图范围和205待人工复验进度，不覆盖独立人工备注。真实WordPress/Chromium双语1440/1024检查搜索、类型、无匹配、首尾分页、无脚本GET、特殊字符、干净安装及204/205升级回退重复安装与数据保护。204公共分页继续复用，查询/URL/SEO/Canonical内容与Provider不改；476运行文件，CSS bundle减少。最终运营体验待Owner手工升级后截图验收，Production未自动修改，手机暂缓。' --latest
          fi
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/v1.35.205 --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh release view v1.35.205 --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - name: Authenticated remote ZIP byte comparison
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download v1.35.205 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.205.zip --dir remote
          cmp provider/vf-tools-theme_V1.35.205.zip remote/vf-tools-theme_V1.35.205.zip
          echo '219b5d1e2c8f186afed49078bea357111f5e03ae8b48ec2cf3ff9125113f65d6  remote/vf-tools-theme_V1.35.205.zip' | sha256sum -c
          test "$(stat -c %s remote/vf-tools-theme_V1.35.205.zip)" = 2008733
          gh release view v1.35.205 --repo "$TARGET_REPO" --json url,publishedAt,tagName > proof/formal-release.json
          echo FORMAL_RELEASE_EXACT_REMOTE_ASSET_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-home-formal-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target provider remote candidate-proof
