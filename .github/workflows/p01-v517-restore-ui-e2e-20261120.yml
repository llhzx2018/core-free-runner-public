name: P01 v517 Owner single-page browser plus exact-source native HTTPS restore
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  p01-media-https:
    if: github.head_ref == 'test/p01-v517-restore-ui-e2e-20261120' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 34
    steps:
      - name: Confirm private-source test scope
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          echo P01_MEDIA_HTTPS_SCOPE=SYNTHETIC_TEMPORARY_NO_PRODUCTION
      - name: Checkout exact P01 source using ephemeral credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ed0f3f7b68335afea7ae8b17ac1ee715eb43683d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - name: Verify exact source, all modified Python and PHP syntax
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "ed0f3f7b68335afea7ae8b17ac1ee715eb43683d"
          test "$(cat candidate/VERSION)" = 2.47.517
          test "$(cat candidate/src/VERSION.txt)" = 2.47.517
          python3 -m py_compile candidate/tests/compatibility/laravel/http/owner_media_restore_https.py candidate/tests/compatibility/laravel/http/owner_sqlite_restore_https.py candidate/tests/compatibility/laravel/http/run_cloudpanel_fpm_full_stage.py
          php -l candidate/src/app/next/runtime/OwnerLegacyMediaArchive.php
          php -l candidate/src/app/next/http/OwnerSqliteRecoveryRoutes.php
          echo P01_MEDIA_EXACT_SHA_SYNTAX=PASS
      - name: Install disposable Nginx PHP-FPM8.3 PHP ZIP/SQLite and composer
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nginx openssl curl unzip composer php8.3-cli php8.3-fpm php8.3-sqlite3 php8.3-zip php8.3-mysql php8.3-mbstring php8.3-xml php8.3-curl >/dev/null
          command -v nginx
          command -v php-fpm8.3
          php -r 'if(PHP_VERSION_ID<80300||!in_array("sqlite",PDO::getAvailableDrivers(),true)||!class_exists("ZipArchive"))exit(1);echo "P01_MEDIA_PHP_FPM_SQLITE_ZIP=PASS\n";'
      - name: Setup pinned Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Build and verify exact self-contained CloudPanel FULL ZIP
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 scripts/build_p01_next_clean_full.py build --source-sha ed0f3f7b68335afea7ae8b17ac1ee715eb43683d --output /tmp/p01-media-clean.zip
          python3 scripts/build_p01_next_clean_full.py verify --zip /tmp/p01-media-clean.zip
          python3 scripts/build_p01_next_cloudpanel_full.py build --source-zip /tmp/p01-media-clean.zip --output /tmp/p01-media-cloudpanel.zip
          python3 scripts/build_p01_next_cloudpanel_full.py verify --zip /tmp/p01-media-cloudpanel.zip
          echo P01_MEDIA_EXACT_CLOUDPANEL_FULL_MANIFEST=PASS
      - name: Chromium full Owner SQLite to media restore UI on 390 768 1440
        run: |
          set -Eeuo pipefail
          cd candidate/src/app/next/frontend
          npm ci --no-audit --no-fund
          npm run typecheck
          npx playwright install --with-deps chromium >/dev/null
          npx playwright test tests/workbench.spec.ts --grep 'P01 one-page SQLite then private media Owner restore'
          echo P01_V517_EXACT_BROWSER_LEGACY_SQLITE_MEDIA_390_768_1440=PASS
      - name: Native TLS Nginx PHP-FPM Owner complete data and media ZIP restore
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 tests/compatibility/laravel/http/run_cloudpanel_fpm_full_stage.py --bundle /tmp/p01-media-cloudpanel.zip --engine sqlite --only-owner-media-restore
          echo P01_MEDIA_REAL_BUNDLED_HTTPS_ALL_KINDS=PASS
      - name: Delete private checkout and developer-only packages
        if: always()
        run: |
          rm -rf -- candidate
          rm -f -- /tmp/p01-media-clean.zip /tmp/p01-media-cloudpanel.zip
          echo P01_MEDIA_PRIVATE_SOURCE_PERSISTED=NO
          echo P01_MEDIA_PUBLIC_PACKAGES_OR_ARTIFACTS=NONE
