name: p01-v24731-bind-temp

on:
  push:
    branches:
      - run/p01-v24731-bind

permissions:
  contents: read

jobs:
  bind-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: 303cb04b3ab957102e831874bd87e4630a3b1da9
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: target
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout verified engineering base
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: 62dc398da9a8cc6b6660168586f969b36e22999d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: base
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd,opcache
          coverage: none

      - name: Exact bind scope and syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "303cb04b3ab957102e831874bd87e4630a3b1da9"
          test "$(git -C base rev-parse HEAD)" = "62dc398da9a8cc6b6660168586f969b36e22999d"
          test "$(tr -d '\r\n ' < target/VERSION)" = "2.47.31"
          test "$(tr -d '\r\n ' < target/src/VERSION.txt)" = "2.47.31"
          grep -Fq "define('VF_VERSION', '2.47.31');" target/src/app/bootstrap.php
          test "$(tr -d '\r\n ' < base/VERSION)" = "2.47.30"
          test -f target/docs/release/V2.47.31_RELEASE_GATE.md
          mapfile -t changed < <(git -C target diff --name-only 62dc398da9a8cc6b6660168586f969b36e22999d..303cb04b3ab957102e831874bd87e4630a3b1da9 | sort)
          test "${#changed[@]}" = 4
          printf '%s\n' "${changed[@]}" >/tmp/p01-v24731-bind-files.txt
          grep -Fxq VERSION /tmp/p01-v24731-bind-files.txt
          grep -Fxq src/VERSION.txt /tmp/p01-v24731-bind-files.txt
          grep -Fxq src/app/bootstrap.php /tmp/p01-v24731-bind-files.txt
          grep -Fxq docs/release/V2.47.31_RELEASE_GATE.md /tmp/p01-v24731-bind-files.txt
          find target/src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find target/src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          echo P01_V24731_BIND_SCOPE_SYNTAX=PASS

      - name: Focused release contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd target
          php tests/unit/admin_navigation_category_route_runtime_contract.php
          php tests/unit/admin_navigation_task_separation_contract.php
          php tests/unit/admin_resource_health_closure_contract.php
          php tests/unit/admin_data_closure_contract.php
          php tests/unit/admin_system_closure_contract.php
          php tests/unit/admin_settings_focus_contract.php
          php tests/unit/admin_overview_actionable_health_contract.php
          php tests/unit/admin_visual_system_r4_contract.php
          php tests/unit/admin_resource_browse_edit_r5_contract.php
          php tests/unit/admin_navigation_consistency_contract.php
          php tests/unit/admin_secondary_nav_focus_contract.php
          php tests/unit/admin_backend_closure_contract.php
          php tests/unit/admin_rail_r7_contract.php
          php tests/unit/pending_inbox_quiet_state_r7_contract.php
          php tests/unit/system_health_runtime_r7_contract.php
          php tests/unit/url_health_action_first_r7_contract.php
          php tests/unit/url_health_table_fit_r8_contract.php
          php tests/unit/atomic_runtime_cache_contract.php
          php tests/unit/update_recovery_contract.php
          grep -Fq 'OWNER_PREVIEW_RUNTIME_APPLICABILITY = N_A' docs/release/V2.47.31_RELEASE_GATE.md
          grep -Fq 'NO_UNKNOWN_APPLICABILITY = YES' docs/release/V2.47.31_RELEASE_GATE.md
          grep -Fq 'PRE_RELEASE_AUTHORITY_DRIFT_GATE = PASS' docs/release/V2.47.31_RELEASE_GATE.md
          echo P01_V24731_RELEASE_CONTRACTS=PASS

      - name: Fresh install baseline and authenticated admin smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          TEST_PASSWORD=$(python3 -c "import secrets; print('Aa1!'+secrets.token_urlsafe(24))")
          echo "::add-mask::$TEST_PASSWORD"
          echo "TEST_PASSWORD=$TEST_PASSWORD" >> "$GITHUB_ENV"
          rm -rf /tmp/p01-v24731-runtime
          cp -a target/src /tmp/p01-v24731-runtime
          cd /tmp/p01-v24731-runtime
          php -S 127.0.0.1:18115 -t . >/tmp/p01-v24731-server.log 2>&1 &
          echo $! >/tmp/p01-v24731.pid
          for i in $(seq 1 30); do
            curl -fsS -c /tmp/p01-v24731.cookies -b /tmp/p01-v24731.cookies http://127.0.0.1:18115/setup.php -o /tmp/p01-v24731-setup.html && break
            sleep 1
          done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-v24731-setup.html',encoding='utf-8').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s)
          assert m
          print(m.group(1))
          PY
          )
          curl -fsS -c /tmp/p01-v24731.cookies -b /tmp/p01-v24731.cookies -X POST http://127.0.0.1:18115/setup.php \
            --data-urlencode "setup_csrf=$CSRF" \
            --data-urlencode 'site_title=VF V24731 Bind' \
            --data-urlencode "admin_password=$TEST_PASSWORD" \
            --data-urlencode "admin_password_confirm=$TEST_PASSWORD" \
            -o /tmp/p01-v24731-setup-post.html
          php cli/verify.php | tee /tmp/p01-v24731-verify.txt
          grep -Fx 'VERIFY_PASS=YES' /tmp/p01-v24731-verify.txt
          php cli/baseline-verify.php | tee /tmp/p01-v24731-baseline.txt
          grep -Fx 'BASELINE_CORE_PASS=YES' /tmp/p01-v24731-baseline.txt
          grep -Fx 'BASELINE_FULL_PASS=YES' /tmp/p01-v24731-baseline.txt
          php -r 'require "app/bootstrap.php"; $r=new VfRepository(vf_db()); $cid=$r->createCategory(["name"=>"Runner 分类"]); $saved=$r->saveLink(null,["surface"=>"start","category_id"=>$cid,"title"=>"Runner URL","url"=>"https://example.com"]); $id=(int)$saved["id"]; $db=vf_db(); $now=gmdate("c"); $s=$db->prepare("INSERT INTO link_health(link_id,status,http_status,last_checked_at,consecutive_failures,manual_confirmed,updated_at,ignore_auto) VALUES(?,\"confirmed\",404,?,2,1,?,0)"); $s->execute([$id,$now,$now]);'

          TEST_PASSWORD="$TEST_PASSWORD" python3 - <<'PY' >/tmp/p01-v24731-login.json
          import json,os
          print(json.dumps({"password":os.environ["TEST_PASSWORD"]}))
          PY
          curl -fsS -c /tmp/p01-v24731.cookies -b /tmp/p01-v24731.cookies -H 'Content-Type: application/json' \
            -X POST 'http://127.0.0.1:18115/api.php?action=login' --data-binary @/tmp/p01-v24731-login.json \
            -o /tmp/p01-v24731-login-result.json
          grep -F '"ok":true' /tmp/p01-v24731-login-result.json >/dev/null

          curl -fsS -c /tmp/p01-v24731.cookies -b /tmp/p01-v24731.cookies 'http://127.0.0.1:18115/settings.php?section=display' -o /tmp/p01-v24731-settings.html
          grep -F '<h1>设置</h1>' /tmp/p01-v24731-settings.html >/dev/null
          grep -F '恢复显示推荐值' /tmp/p01-v24731-settings.html >/dev/null

          curl -fsS -c /tmp/p01-v24731.cookies -b /tmp/p01-v24731.cookies 'http://127.0.0.1:18115/manage.php' -o /tmp/p01-v24731-manage.html
          grep -F '网址健康 1 条待处理' /tmp/p01-v24731-manage.html >/dev/null
          grep -F 'health.php?status=attention' /tmp/p01-v24731-manage.html >/dev/null

          curl -fsS -c /tmp/p01-v24731.cookies -b /tmp/p01-v24731.cookies 'http://127.0.0.1:18115/surface-manager.php?advanced=1' -o /tmp/p01-v24731-resources.html
          grep -F 'class="vf-resource-editor-details"' /tmp/p01-v24731-resources.html >/dev/null
          ! grep -F 'class="vf-resource-editor-details" open' /tmp/p01-v24731-resources.html >/dev/null

          curl -fsS -c /tmp/p01-v24731.cookies -b /tmp/p01-v24731.cookies 'http://127.0.0.1:18115/surface-manager.php' -o /tmp/p01-v24731-pending.html
          grep -F '<h1>待整理收件箱</h1>' /tmp/p01-v24731-pending.html >/dev/null
          grep -F '当前没有待整理网址' /tmp/p01-v24731-pending.html >/dev/null

          curl -fsS -c /tmp/p01-v24731.cookies -b /tmp/p01-v24731.cookies 'http://127.0.0.1:18115/system-health.php' -o /tmp/p01-v24731-system.html
          grep -F '正在检查运行状态…' /tmp/p01-v24731-system.html >/dev/null
          curl -fsS -c /tmp/p01-v24731.cookies -b /tmp/p01-v24731.cookies 'http://127.0.0.1:18115/asset.php?file=system.js&v=2.47.31' -o /tmp/p01-v24731-system.js
          grep -F ',all=s=>Array.from(document.querySelectorAll(s))' /tmp/p01-v24731-system.js >/dev/null

          curl -fsS -c /tmp/p01-v24731.cookies -b /tmp/p01-v24731.cookies 'http://127.0.0.1:18115/health.php' -o /tmp/p01-v24731-health.html
          grep -F '默认只显示真正需要处理的异常' /tmp/p01-v24731-health.html >/dev/null
          grep -F '<option value="attention">待处理（确认 / 疑似 / 暂时）</option><option value="">全部状态（含正常）</option>' /tmp/p01-v24731-health.html >/dev/null
          curl -fsS -c /tmp/p01-v24731.cookies -b /tmp/p01-v24731.cookies 'http://127.0.0.1:18115/asset.php?file=health.js&v=2.47.31' -o /tmp/p01-v24731-health.js
          grep -F 'function rowActions(i,backup,canPromote,canReplace)' /tmp/p01-v24731-health.js >/dev/null
          grep -F 'class="vf-health-row-more"' /tmp/p01-v24731-health.js >/dev/null
          echo P01_V24731_BIND_FRESH_AUTH_SMOKE=PASS

      - name: Verdict
        run: |
          echo P01_V24731_BOUND_CANDIDATE_GATE=PASS
          echo ENGINEERING_GATE=35489107435
          echo SCHEMA=2026090401
          echo MIGRATION=NONE
          echo PRODUCTION=NOT_WRITTEN

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/p01-v24731.pid ]; then kill "$(cat /tmp/p01-v24731.pid)" 2>/dev/null || true; fi
          rm -rf /tmp/p01-v24731-runtime /tmp/p01-v24731-*
