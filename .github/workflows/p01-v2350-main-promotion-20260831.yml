name: P01 V2.35.1 Main Promotion
on:
  push:
    branches: [release/p01-v2350-orchestrator-20260831]
    paths: [.github/workflows/p01-v2350-main-promotion-20260831.yml]
permissions:
  contents: read
jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FORMAL_SOURCE: eb36fd19d269aed4ef4246c2c18f172b2c761bde
      FORMAL_TREE: 00aca451804db5ebf9260d8101dfe829789c4f24
      RUNTIME_TREE: 3cdfa02d8c19ae5e771b7d4abff69a670ac4396c
      RECONCILED_SOURCE: b48b1071b5b56d37d35e97b61e13d055a3d2c852
      MAIN_PRE: 0bd93177ce3d8bc16f41162859d62b799a5a7d4c
      FORMAL_RUN: '33340105433'
      FORMAL_RUNNER_HEAD: d392ac289aa9f22b6eafc98bd46866e3c1e30dac
      STRICT_RUN: '33340185389'
      STRICT_RUNNER_HEAD: 65af7f7a320e8f5a0b0e41f2494b335f1510fc1b
    steps:
      - name: Verify exact gates and concurrent truth
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          FORMAL_GATE=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/runs/$FORMAL_RUN")
          test "$(jq -r .status <<<"$FORMAL_GATE")" = completed
          test "$(jq -r .conclusion <<<"$FORMAL_GATE")" = success
          test "$(jq -r .head_sha <<<"$FORMAL_GATE")" = "$FORMAL_RUNNER_HEAD"
          FRESH_GATE=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/runs/$STRICT_RUN")
          test "$(jq -r .status <<<"$FRESH_GATE")" = completed
          test "$(jq -r .conclusion <<<"$FRESH_GATE")" = success
          test "$(jq -r .head_sha <<<"$FRESH_GATE")" = "$STRICT_RUNNER_HEAD"
          rm -rf product
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/vf-start.git" product
          git -C product fetch -q origin main develop release/v2.35.1-reconciled-formal-20260831 --tags
          MAIN=$(git -C product rev-parse origin/main); DEVELOP=$(git -C product rev-parse origin/develop); RECON=$(git -C product rev-parse origin/release/v2.35.1-reconciled-formal-20260831)
          test "$MAIN" = "$MAIN_PRE"
          test "$DEVELOP" = "$FORMAL_SOURCE"
          test "$RECON" = "$RECONCILED_SOURCE"
          test "$(git -C product rev-parse "$FORMAL_SOURCE^{tree}")" = "$FORMAL_TREE"
          test "$(git -C product rev-parse "$FORMAL_SOURCE:src")" = "$RUNTIME_TREE"
          test "$(git -C product rev-parse "$RECON^{tree}")" = "$FORMAL_TREE"
          test "$(git -C product rev-parse "$RECON:src")" = "$RUNTIME_TREE"
          test "$(git -C product merge-base "$DEVELOP" "$RECON")" = "$DEVELOP"
          test "$(git -C product merge-base "$MAIN" "$RECON")" = "$MAIN"
          ! git -C product show-ref --verify --quiet refs/tags/v2.35.1
          test "$(git -C product show "$FORMAL_SOURCE:VERSION" | tr -d '\r\n')" = 2.35.1
          echo P01_V2351_FORMAL_GATE=PASS
          echo P01_V2351_STRICT_FRESH_GATE=PASS
          echo P01_V2351_RECONCILED_TREE_IDENTITY=PASS
          echo P01_V2351_PROMOTION_PRECHECK=PASS
      - name: Fast-forward main and develop to reconciled exact tree
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/vf-start.git"
          git -C product push "$REMOTE" "$RECONCILED_SOURCE:refs/heads/main"
          git -C product push "$REMOTE" "$RECONCILED_SOURCE:refs/heads/develop"
          git -C product fetch -q origin main develop
          test "$(git -C product rev-parse origin/main)" = "$RECONCILED_SOURCE"
          test "$(git -C product rev-parse origin/develop)" = "$RECONCILED_SOURCE"
          test "$(git -C product rev-parse origin/main^{tree})" = "$FORMAL_TREE"
          test "$(git -C product rev-parse origin/main:src)" = "$RUNTIME_TREE"
          echo P01_V2351_MAIN_PROMOTION=PASS
          echo P01_V2351_DEVELOP_SYNC=PASS
          echo FORMAL_TAG_SOURCE=$FORMAL_SOURCE
          echo TAG_CREATED=NO
          echo RELEASE_PUBLISHED=NO
          echo OWNER_PRODUCTION_WRITE=NO
