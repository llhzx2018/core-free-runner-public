name: P01 V2.35.0 Main Promotion
on:
  push:
    branches: [release/p01-v2350-orchestrator-20260831]
    paths: [.github/workflows/p01-v2350-main-promotion-20260831.yml]
permissions:
  contents: read
jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify exact gates and concurrent truth
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          FORMAL_GATE=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/runs/33332314263)
          test "$(jq -r .status <<<"$FORMAL_GATE")" = completed
          test "$(jq -r .conclusion <<<"$FORMAL_GATE")" = success
          test "$(jq -r .head_sha <<<"$FORMAL_GATE")" = 7f5ceeff9b7c34dc5557c83c588d3579377cb5cd
          FRESH_GATE=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/runs/33332398277)
          test "$(jq -r .status <<<"$FRESH_GATE")" = completed
          test "$(jq -r .conclusion <<<"$FRESH_GATE")" = success
          test "$(jq -r .head_sha <<<"$FRESH_GATE")" = 4f8b59945d0c85f22653602d43f636daa99f4314
          rm -rf product
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/vf-start.git" product
          git -C product fetch -q origin main develop --tags
          MAIN=$(git -C product rev-parse origin/main)
          DEVELOP=$(git -C product rev-parse origin/develop)
          test "$MAIN" = 84f7ba02a8ab79ba6d7675c76b7d07e4895a3436
          test "$DEVELOP" = d20f8e964455c7238b66c6ff6ab2e7d732d315e2
          test "$(git -C product rev-parse "$DEVELOP^{tree}")" = 1d9c8a11f1e8ddb7bb775b28592459f754c2c59b
          test "$(git -C product rev-parse "$DEVELOP:src")" = 24953b64762b2d17076e4149a2aa49a492316477
          test "$(git -C product merge-base "$MAIN" "$DEVELOP")" = "$MAIN"
          ! git -C product show-ref --verify --quiet refs/tags/v2.35.0
          test "$(git -C product show "$DEVELOP:VERSION" | tr -d '\r\n')" = 2.35.0
          test "$(git -C product show "$DEVELOP:src/VERSION.txt" | tr -d '\r\n')" = 2.35.0
          git -C product show "$DEVELOP:src/app/bootstrap.php" | grep -F "define('VF_VERSION', '2.35.0')" >/dev/null
          echo P01_V2350_FORMAL_GATE_33332314263=PASS
          echo P01_V2350_STRICT_FRESH_GATE_33332398277=PASS
          echo P01_V2350_PROMOTION_PRECHECK=PASS
      - name: Promote exact formal source to main
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/vf-start.git"
          git -C product push "$REMOTE" d20f8e964455c7238b66c6ff6ab2e7d732d315e2:refs/heads/main
          git -C product fetch -q origin main develop
          test "$(git -C product rev-parse origin/main)" = d20f8e964455c7238b66c6ff6ab2e7d732d315e2
          test "$(git -C product rev-parse origin/develop)" = d20f8e964455c7238b66c6ff6ab2e7d732d315e2
          test "$(git -C product rev-parse origin/main^{tree})" = 1d9c8a11f1e8ddb7bb775b28592459f754c2c59b
          test "$(git -C product rev-parse origin/main:src)" = 24953b64762b2d17076e4149a2aa49a492316477
          echo P01_V2350_MAIN_PROMOTION=PASS
          echo P01_V2350_DEVELOP_SYNC=PASS
          echo TAG_CREATED=NO
          echo RELEASE_PUBLISHED=NO
          echo OWNER_PRODUCTION_WRITE=NO
