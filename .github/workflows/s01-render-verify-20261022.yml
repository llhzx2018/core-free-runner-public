name: S01 Theme renderer readonly recheck targeted proof
on:
  push:
    branches: [task/s01-render-verify-20261022]
    paths: ['.github/workflows/s01-render-verify-20261022.yml']
permissions:
  contents: read
jobs:
  readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: c7dc8e0550ad4e5df1bd1ff4954d579f14873232
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
      - name: Exact-source syntax and bounded existing contract
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = "c7dc8e0550ad4e5df1bd1ff4954d579f14873232"
          php -l target/src/inc/admin/admin-render-actions.php
          php -l target/src/inc/admin/views/render.php
          php -l target/tests/render-page-refinement-contract.php
          node --check target/src/assets/js/admin/admin-render.js
          php target/tests/render-page-refinement-contract.php
          php target/tests/render-settings-human-language-contract.php
      - name: Actual PHP ajax handler isolated fail-closed paths
        run: |
          set -euo pipefail
          cat > /tmp/vf-readonly-verify.php <<'PHP'
          <?php
          define('ABSPATH', '/tmp');
          class Reply extends Exception {
              public function __construct(public bool $success, public array $data, public int $status) {
                  parent::__construct('reply');
              }
          }
          $GLOBALS['allow']=true;
          $GLOBALS['nonce']=true;
          $GLOBALS['stored']=true;
          $GLOBALS['valid']=true;
          $GLOBALS['errors']=[];
          $GLOBALS['writes']=0;
          function add_action($a,$b){}
          function current_user_can($cap){return $GLOBALS['allow'] && $cap==='vf_manage_theme_profile';}
          function check_ajax_referer($action,$key){
              if($action!=='theme.render.save'||$key!=='nonce'||!$GLOBALS['nonce']){
                  throw new Reply(false,['failureCode'=>'NONCE'],403);
              }
          }
          function wp_unslash($x){return $x;}
          function sanitize_text_field($x){return $x;}
          function wp_send_json_error($data,$status=200){throw new Reply(false,$data,$status);}
          function wp_send_json_success($data,$status=200){throw new Reply(true,$data,$status);}
          function update_option(){++$GLOBALS['writes'];throw new Exception('WRITTEN');}
          function delete_option(){++$GLOBALS['writes'];throw new Exception('DELETED');}
          function vf_tools_theme_renderer_readback(){return [
              'stored'=>$GLOBALS['stored'],
              'source'=>$GLOBALS['stored']?'database':'registered_defaults',
              'renderer'=>['defaultMode'=>'STANDARD'],
              'revision'=>str_repeat('a',64),
              'errors'=>$GLOBALS['errors'],
          ];}
          function vf_tools_theme_renderer_runtime_verification($expected){return [
              'ok'=>$GLOBALS['valid'],
              'status'=>$GLOBALS['valid']?'PASS':'BLOCKED',
              'revision'=>str_repeat('a',64),
              'checks'=>['databaseReadback'=>true],
          ];}
          require __DIR__.'/'.'../home/runner/work'.'/unreachable.php';
          PHP
          # Swap only the harness include placeholder: test executes actual checked-out handler.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/vf-readonly-verify.php')
          s=p.read_text().replace("require __DIR__.'/'.'../home/runner/work'.'/unreachable.php';", "require getcwd().'/target/src/inc/admin/admin-render-actions.php';")
          p.write_text(s)
          PY
          cat >> /tmp/vf-readonly-verify.php <<'PHP'
          function probe($name, callable $setup, int $http, string $failure=''): void {
              $GLOBALS['allow']=true;$GLOBALS['nonce']=true;
              $GLOBALS['stored']=true;$GLOBALS['valid']=true;
              $GLOBALS['errors']=[];
              $_POST=['revision'=>str_repeat('a',64), 'renderer'=>['defaultMode'=>'MALICIOUS']];
              $setup();
              try{vf_theme_render_verify_ajax();throw new Exception($name.' NO RESPONSE');}
              catch(Reply $reply){
                  if($reply->status!==$http || ($failure!==''&&($reply->data['failureCode']??'')!==$failure)){
                      throw new Exception($name.' BAD RESULT '.$reply->status.' '.json_encode($reply->data));
                  }
                  echo "PASS $name\n";
              }
          }
          probe('stored_config_success',fn()=>null,200);
          probe('permission_rejected',fn()=> $GLOBALS['allow']=false,403,'FORBIDDEN');
          probe('nonce_rejected',fn()=> $GLOBALS['nonce']=false,403,'NONCE');
          probe('default_config_not_saved',fn()=> $GLOBALS['stored']=false,422,'DEFAULT_NOT_STORED');
          probe('missing_revision',fn()=> $_POST['revision']='',409,'REVISION_CONFLICT');
          probe('revision_conflict',fn()=> $_POST['revision']=str_repeat('b',64),409,'REVISION_CONFLICT');
          probe('runtime_contract_rejected',fn()=> $GLOBALS['valid']=false,422,'RUNTIME_CONTRACT_MISMATCH');
          probe('stored_error_rejected',fn()=> $GLOBALS['errors']=['test'=>'bad'],422,'RUNTIME_CONTRACT_MISMATCH');
          if($GLOBALS['writes']!==0) throw new Exception('NONZERO WRITES: '.$GLOBALS['writes']);
          echo "PASS no_write_for_all_eight_paths\n";
          PHP
          php /tmp/vf-readonly-verify.php
      - name: Actual renderer JS in Chromium with mocked AJAX transport
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          cat > /tmp/vf-render-browser.cjs <<'JS'
          const assert=require('node:assert/strict');
          const {createHash}=require('node:crypto');
          const {chromium}=require('playwright');
          const kinds=['SUMMARY','METRIC','TEXT','CODE','TABLE','TREE','MEDIA_PREVIEW','RUNTIME_ARTIFACT','BATCH','DIAGNOSTIC'];
          const checks=['databaseReadback','allResultKindsMapped','widgetIsolation','noJsContent','themeOnlySemantics','pageProjectionConsumer','standardHybridRenderer','fullProductPageRenderer','projectionTechnicalSeo','providerWidgetHost','runtimeDescriptorConsumer','runtimeAssetClosure','widgetAssetClosure','runtimePublicManifest','registeredConfiguration','renderPresentationConsumer'];
          const renderer={
            defaultMode:'STANDARD',allowedModes:['STANDARD','HYBRID','PROVIDER_WIDGET'],renderSchemaVersion:'1.0.0',
            supportedProjectionSchemaRange:'>=1.0.0 <2.0.0',widgetHostApiVersion:'1.0.0',
            primitiveProfile:'VF_TOOLS_STANDARD_V1',inputLayout:'STACKED',parameterLayout:'PROGRESSIVE_DISCLOSURE',
            progressPresentation:'STAGE_OR_REAL_PERCENT',resultKinds:kinds,errorPresentation:'WHAT_WHY_NEXT',
            widgetIsolation:true,widgetOwnsWholePage:false,mobileFallback:'HOST_CONTROLLED',
            noJsProductContent:true,accessibilityProfile:'WCAG_KEYBOARD_FOCUS_ARIA_V1',lazyLoadRuntime:true,
          };
          function canonical(value){
            if(Array.isArray(value))return value.map(canonical);
            if(value && typeof value==='object')return Object.fromEntries(Object.keys(value).sort().map(k=>[k,canonical(value[k])]));
            return value;
          }
          function reply(r){
            const revision=createHash('sha256').update(JSON.stringify(canonical(r))).digest('hex');
            return {ok:true,state:{stored:true,source:'database',errors:[],renderer:r,revision},
              runtimeVerification:{ok:true,status:'PASS',revision,summary:'模拟接口检查通过',checks:Object.fromEntries(checks.map(k=>[k,true]))}};
          }
          const html=(revision,stored)=>'<section data-vf-render-page data-vf-render-stored="'+stored+'" data-vf-revision="'+revision+'">'
          +'<div data-vf-render-status data-status="pass"><span data-vf-render-status-summary></span><span data-vf-render-status-note></span></div>'
          +'<span data-vf-render-status-detail></span><span data-vf-render-verification-label></span><span data-vf-render-current-mode></span>'
          +'<span data-vf-render-contract-revision></span><p data-vf-render-save-feedback hidden></p>'
          +'<form data-vf-render-form><input type="hidden" data-vf-render-revision name="revision" value="'+revision+'">'
          +'<select name="renderer[defaultMode]"><option value="STANDARD">标准</option><option value="HYBRID">混合</option><option value="PROVIDER_WIDGET">嵌入</option></select>'
          +'<input type="checkbox" name="renderer[lazyLoadRuntime]" value="1" checked>'
          +'<button type="button" data-vf-render-discard hidden>放弃</button>'
          +'<button type="button" data-vf-render-verify hidden>重新检查</button>'
          +'<button type="submit" data-vf-render-save>保存更改</button>'
          +'<a href="/preview">视觉预览</a></form></section>';
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const first=reply(renderer),page=await browser.newPage();
              await page.setContent(html(first.state.revision,'1'));
              await page.evaluate(()=>{
                window.VFThemeRender={ajaxUrl:'/wp-admin/admin-ajax.php',nonce:'test',saveAction:'vf_theme_render_save'};
                window.__seen=[];
                window.__reply=null;
                window.__mode='ok';
                window.fetch=async (_url,init)=>{
                  window.__seen.push(init.body.get('action'));
                  if(window.__mode==='offline')throw Error('network off');
                  return {ok:true,json:async()=>({success:true,data:window.__reply})};
                };
              });
              await page.addScriptTag({path:'target/src/assets/js/admin/admin-render.js'});
              assert.equal(await page.locator('[data-vf-render-verify]').isHidden(),false);
              await page.evaluate(data=>window.__reply=data,first);
              await page.locator('[data-vf-render-verify]').click();
              await page.waitForFunction(()=>document.querySelector('[data-vf-render-save-feedback]').textContent.includes('没有执行保存'));
              assert.deepEqual(await page.evaluate(()=>window.__seen),['vf_theme_render_verify']);
              console.log('PASS browser_readonly_action_success');
              await page.evaluate(()=>window.__mode='offline');
              await page.locator('[data-vf-render-verify]').click();
              await page.waitForFunction(()=>document.querySelector('[data-vf-render-save-feedback]').textContent.includes('只读检查未完成'));
              assert.notEqual(await page.locator('[data-vf-render-status]').getAttribute('data-status'),'unknown');
              assert.equal(await page.evaluate(()=>{const e=new Event('beforeunload',{cancelable:true});window.dispatchEvent(e);return e.defaultPrevented;}),false);
              console.log('PASS browser_readonly_failure_no_unknown_write_or_leave_guard');
              const next={...renderer,defaultMode:'HYBRID'};
              await page.evaluate(data=>{window.__mode='ok';window.__reply=data;},reply(next));
              await page.locator('select[name="renderer[defaultMode]"]').selectOption('HYBRID');
              assert.equal(await page.locator('[data-vf-render-verify]').isHidden(),true);
              await page.locator('[data-vf-render-save]').click();
              await page.waitForFunction(()=>document.querySelector('[data-vf-render-save-feedback]').textContent.includes('已保存并完成回读检查'));
              assert.deepEqual(await page.evaluate(()=>window.__seen),['vf_theme_render_verify','vf_theme_render_verify','vf_theme_render_save']);
              console.log('PASS browser_real_save_stays_on_original_action');
              await page.close();
              const p2=await browser.newPage();
              await p2.setContent(html(first.state.revision,'0'));
              await p2.evaluate(()=>window.VFThemeRender={ajaxUrl:'/wp-admin/admin-ajax.php',nonce:'test',saveAction:'vf_theme_render_save'});
              await p2.addScriptTag({path:'target/src/assets/js/admin/admin-render.js'});
              assert.equal(await p2.locator('[data-vf-render-verify]').isHidden(),true);
              assert.equal(await p2.locator('[data-vf-render-save]').textContent(),'保存默认设置');
              console.log('PASS browser_default_config_first_save_entry');
              await p2.close();
            }finally{await browser.close();}
          })().catch(error=>{console.error(error);process.exit(1)});
          JS
          NODE_PATH="$PWD/node_modules" node /tmp/vf-render-browser.cjs
