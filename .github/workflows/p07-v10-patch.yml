name: P07 OneShot v1.0 Multi-Region Fallback Patch

on:
  push:
    branches:
      - experiment/p07-oneshot-bench-v05
    paths:
      - experiments/p07-v10-patch.py
      - .github/workflows/p07-v10-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Apply v1.0 RC patch
        run: python3 experiments/p07-v10-patch.py
      - name: Validate v1.0 RC static and demo contracts
        shell: bash
        run: |
          set -euo pipefail
          bash -n experiments/p07-bench.sh
          ./experiments/p07-bench.sh --version | grep -F '1.0.0-rc1'
          ./experiments/p07-bench.sh --self-test | grep -F 'SELF_TEST=PASS'
          P07_BENCH_DEMO_BACKEND_REASON=RATE_LIMITED P07_BENCH_DEMO_MAINLAND_FAIL_HOST=10086.cn ./experiments/p07-bench.sh --demo >/tmp/global-fallback-demo
          grep -F 'Speedtest backend preflight failed: RATE_LIMITED' /tmp/global-fallback-demo
          grep -F 'Global fallback     : LibreSpeed multi-region quick test' /tmp/global-fallback-demo
          grep -F 'US West' /tmp/global-fallback-demo
          grep -F 'US Central' /tmp/global-fallback-demo
          grep -F 'US East' /tmp/global-fallback-demo
          grep -F 'Europe' /tmp/global-fallback-demo
          grep -F 'Singapore' /tmp/global-fallback-demo
          grep -F 'Tokyo' /tmp/global-fallback-demo
          grep -F 'Cloudflare Edge' /tmp/global-fallback-demo
          grep -F 'SUPPLEMENTAL' /tmp/global-fallback-demo
          grep -F 'Carrier Speed       : NOT_RUN (Ookla RATE_LIMITED)' /tmp/global-fallback-demo
          grep -F 'China IP Risk       : UNKNOWN' /tmp/global-fallback-demo
          ! grep -q 'Carrier Speed       : 0/0 PASS' /tmp/global-fallback-demo
          grep -F 'LIBRESPEED_AMD64_SHA256="89800767ac14085c78a20847ebea23340f6c14a78de0a15c2ac7db8b565c961f"' experiments/p07-bench.sh
          grep -F 'LIBRESPEED_ARM64_SHA256="75e51a2494d03cb35a92ddbf862b40571a25a1526f3cf3dfa8b1d5d7bc622bd9"' experiments/p07-bench.sh
          ! grep -q -- '--skip-cert-verify' experiments/p07-bench.sh
          ! grep -q -- '--no-check-certificate' experiments/p07-bench.sh
      - name: Commit v1.0 RC candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add experiments/p07-bench.sh
          git diff --cached --quiet && exit 0
          git commit -m 'feat(p07-bench): add LibreSpeed global fallback v1.0-rc1'
          git push origin HEAD:experiment/p07-oneshot-bench-v05
