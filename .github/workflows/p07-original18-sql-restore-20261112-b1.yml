name: P07 original18 SQL restore exact-source safety proof
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - task/p07-original18-sql-restore-proof-20261112-b1
permissions:
  contents: read
concurrency:
  group: p07-original18-sql-restore-20261112-b1
  cancel-in-progress: false
jobs:
  original18-sql-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      P07_EXACT_SHA: b4f0aafffa979254f8d2ddf9f563eb079bcc58f2
    steps:
      - name: Checkout exact private source into transient workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: b4f0aafffa979254f8d2ddf9f563eb079bcc58f2
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product
      - name: Exact identity and Python syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C product rev-parse HEAD)" = "$P07_EXACT_SHA"
          test "$(cat product/VERSION)" = "0.1.0"
          test "$(cat product/BUILD_ID)" = "0.1.0-release146"
          (cd product && python3 -B -m compileall -q lib)
          echo P07_ORIGINAL18_SQL_RESTORE_SYNTAX=PASS
      - name: Original restore/shadow/prepare focused regression
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          (cd product && python3 -B -m unittest -v tests.test_p07_original_db_restore_drill tests.test_migration_final_db_shadow tests.test_p07_original_18_prepare_recovery tests.test_p07_original_18_file_warm_stage tests.test_p07_original_18_protected_preparation)
          echo P07_ORIGINAL18_SQL_RESTORE_SYNTHETIC=PASS
          echo P07_OWNER_CP2_MIGRATION=NOT_RUN
          echo P07_FORMAL_RELEASE=NO
      - name: Remove private product source from public Runner
        if: always()
        shell: bash
        run: |
          rm -rf -- product
          echo P07_PRIVATE_PRODUCT_SOURCE_CLEANED=YES
