name: P01 V2.36.5 Candidate Readiness R2
on:
  push:
    branches: [release/p01-v2365-candidate-20260902]
    paths: [.github/workflows/p01-v2365-candidate-readiness-20260902.yml]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CANDIDATE: 57d99978340a45cd7673c6d0943137e6437aae51
      CANDIDATE_TREE: 4517a92885e5fe4db42ba5b23bdcfbc712940be2
      CANDIDATE_RUNTIME_TREE: a7f472ec1f449ada1152d271f2723c52e7b58144
      MAIN: 4760b152fdf7f2ea2866c8fa04dfee873fb3ee3b
      SOURCE: 6b321422bce5a834521786d8233149c7624aa014
      SOURCE_TREE: 86c01bf1b5ee7c3ad3954e6ab9485734cb744d05
      SOURCE_RUNTIME_TREE: e1ee914a6d9e61bac7931b1f5363a8c7e24e925a
      VERSION: 2.36.5
      SOURCE_VERSION: 2.36.4
      SCHEMA: '2026082901'
      OUT: /tmp/p01-v2365-candidate-artifacts
      EVID: /tmp/p01-v2365-candidate-evidence
      UPGRADE: /tmp/p01-v2365-upgrade
      FRESH: /tmp/p01-v2365-fresh
    steps:
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: release/p01-v2365-candidate-20260902
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 0fe72c7981f5f2b6ddd51bf4cfa5d6c014c9b0d3
          path: template
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: agent/p01-22121-formal-artifact-gate-20260819
          path: proven
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.CANDIDATE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: candidate
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.36.4
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: production
      - name: Generate fenced gates
        run: python3 runner/scripts/p01_v2365_candidate_readiness_generate.py
      - name: Exact source and verified blob authority fence
        run: bash /tmp/p01-v2365-generated/01-exact.sh
      - name: Build deterministic candidate artifacts
        run: bash /tmp/p01-v2365-generated/02-build.sh
      - name: Actual V2.36.4 to V2.36.5 Atomic upgrade
        run: bash /tmp/p01-v2365-generated/03-atomic.sh
      - name: Strict fresh candidate runtime
        run: bash /tmp/p01-v2365-generated/04-fresh.sh
      - name: Combined patch static regression contract
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -F 'confirmRuntimeThenReload(toVersion)' candidate/src/assets/update-core.js >/dev/null
          grep -F "'youtube' => \$candidates === [] ? 3 * 1024 * 1024 : 524288" candidate/src/app/ResourceCoverCache.php >/dev/null
          grep -F "'apple-podcasts' => 2 * 1024 * 1024" candidate/src/app/ResourceCoverCache.php >/dev/null
          grep -F "vf_asset_url('assets/resource-actions.css')" candidate/src/app/FunctionalWorkspace.php >/dev/null
          ! grep -F '@import url("resource-actions.css")' candidate/src/assets/resource-media.css >/dev/null
          grep -F '.vf-functional-head>div{min-width:0}' candidate/src/assets/workspace-rebaseline.css >/dev/null
          printf 'PR192_TERMINAL_FIX=PASS\nPR195_YOUTUBE_COVER=PASS\nPR196_ASSET_AUTHORITY=PASS\nPR197_MOBILE_PATH=PASS\nPR198_APPLE_COVER=PASS\n' | tee "$EVID/combined-contract.txt"
      - name: Final candidate boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(cat candidate/VERSION)" = 2.36.5
          jq -e '.production_version=="2.36.4" and .published_release.version=="2.36.4" and .candidate_version=="2.36.5" and .current_change.release_authorized_by_owner==true' candidate/VF_PROJECT.json >/dev/null
          printf 'P01_V2365_CANDIDATE_READINESS=PASS\nCANDIDATE=%s\nTREE=%s\nRUNTIME_TREE=%s\nPRODUCTION_FORMAL_SOURCE=%s\nPRODUCTION_MAIN_PARENT=%s\nSCHEMA=%s\nATOMIC_2364_TO_2365=PASS\nFRESH_INSTALL=PASS\nVERIFIED_PRODUCT_BLOBS=5/5\nUNKNOWN_RUNTIME_BYTES=0\nOWNER_PRODUCTION_WRITE=NO\n' "$CANDIDATE" "$CANDIDATE_TREE" "$CANDIDATE_RUNTIME_TREE" "$SOURCE" "$MAIN" "$SCHEMA" | tee "$EVID/verdict.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-v2365-candidate-readiness-${{ github.run_id }}
          path: |
            /tmp/p01-v2365-candidate-artifacts
            /tmp/p01-v2365-candidate-evidence
          if-no-files-found: error
          retention-days: 90
