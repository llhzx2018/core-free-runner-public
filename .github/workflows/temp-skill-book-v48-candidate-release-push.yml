'''
          idx.write_text(head+tail,encoding='utf-8'); print('V48_RECONCILE_PREPARED=PASS')
          PY
          git diff --check
          git add CURRENT.md distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md distribution/skills/candidates/skill-book/V4.8/README.md distribution/skills/candidates/skill-book/V4.8/RUNTIME_ZIP_MIRROR_STATUS.md
          git diff --cached --check; git commit -q -m 'skill-book: reconcile V4.8 published candidate authority'
          commit="$(git rev-parse HEAD)"; test "$(git ls-remote origin refs/heads/main|awk '{print $1}')" = "$RECONCILE_BASE"; git push -q origin HEAD:main
          echo "V48_GOV_RECONCILIATION_COMMIT=$commit"; echo 'V48_GOV_RECONCILIATION=PASS'

      - name: Final remote authority readback
        shell: bash
        run: |
          set -Eeuo pipefail
          cd gov-r; git fetch -q origin main; git reset -q --hard origin/main
          grep -Fq '| skill-book | V3.5 | V4.7 CANDIDATE（非 Current） |' CURRENT.md
          grep -Fq '`V4.8` 为最新 Candidate' CURRENT.md
          grep -Fq 'Status: `PUBLISHED_REMOTE_VERIFIED`' distribution/skills/candidates/skill-book/V4.8/RUNTIME_ZIP_MIRROR_STATUS.md
          grep -Fq "$EXPECTED_SHA256" distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md
          grep -Fq "$RELEASE_ID" distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md
          grep -Fq "$ZIP_ASSET_ID" distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md
          grep -Fq "$SOURCE_COMMIT" distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md
          j="$(GH_TOKEN="$RELEASE_TOKEN" gh api "repos/$GOV_REPOSITORY/releases/tags/$TAG")"; test "$(jq -r '.id' <<<"$j")" = "$RELEASE_ID"; test "$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.id' <<<"$j")" = "$ZIP_ASSET_ID"
          echo "V48_FINAL_GOV_MAIN=$(git rev-parse HEAD)"; echo 'LATEST_CANDIDATE=V4.8'; echo 'SOURCE_CURRENT=V3.5'; echo 'INSTALLED_RUNTIME_OBSERVATION=V4.7'; echo 'CURRENT_PROMOTION=NOT_AUTHORIZED'; echo 'V48_MIRROR=PUBLISHED_REMOTE_VERIFIED'; echo 'V48_FINAL_REMOTE_AUTHORITY_READBACK=PASS'
