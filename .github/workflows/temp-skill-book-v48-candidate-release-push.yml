- Current Promotion: `NOT_AUTHORIZED`
''',encoding='utf-8')
          cur=r/'CURRENT.md'; t=cur.read_text(encoding='utf-8')
          a='| skill-book | V3.5 | V4.6 CANDIDATE（非 Current） |'; b='| skill-book | V3.5 | V4.7 CANDIDATE（非 Current） |'
          if a in t:t=t.replace(a,b,1)
          elif b not in t:raise SystemExit('CURRENT_ROW_UNEXPECTED')
          a='`skill-book V4.0/V4.1/V4.2/V4.3/V4.4/V4.5/V4.6` 为保留的历史 Candidate，`V4.7` 为最新 Candidate；八者均未晋升 Source Current。V4.7 已进入 Candidate Distribution，但未进入 Current Distribution。'
          b='`skill-book V4.0/V4.1/V4.2/V4.3/V4.4/V4.5/V4.6/V4.7` 为保留的历史 Candidate，`V4.8` 为最新 Candidate；九者均未晋升 Source Current。V4.8 已进入 Candidate Distribution，但未进入 Current Distribution。'
          if a in t:t=t.replace(a,b,1)
          elif b not in t:raise SystemExit('CURRENT_CANDIDATE_UNEXPECTED')
          cur.write_text(t,encoding='utf-8')
          idx=r/'distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md'; t=idx.read_text(encoding='utf-8'); marker='## Candidate（不改变 Current）'; head=t.split(marker,1)[0]
          tail=f'''{marker}

`skill-book V4.8` 是最新 `CANDIDATE / NOT CURRENT`；Source Current仍为V3.5，且V4.8不包含在Current总包中。Installed Runtime Observation为V4.7 Candidate。

