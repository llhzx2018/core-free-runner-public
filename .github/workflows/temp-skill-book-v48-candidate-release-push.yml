name: TEMP skill-book V4.8 Candidate Release Gate

on:
  push:
    branches:
      - release/skill-book-v48-candidate-asset-20260827
    paths:
      - '.github/workflows/temp-skill-book-v48-candidate-release-push.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: temp-skill-book-v48-candidate-release-gate
  cancel-in-progress: false

env:
  GOV_REPOSITORY: llhzx2018/gov-doc
  SOURCE_COMMIT: d5d809172f23b31212cf6b66551f775b2e07e35f
  TAG: skill-book-v4.8-candidate-20260827
  RELEASE_TITLE: skill-book V4.8 Candidate
  ASSET_NAME: skill-book_V4.8_CANDIDATE_20260827.zip
  EXPECTED_BYTES: '156008'
  EXPECTED_SHA256: df933b799e7e56a662f055abfe9825d15a4470c86cf9b41a34e30cbb98bf4c4b

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      RUNNER_GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout temporary PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Verify PR remains open and unmerged
        shell: bash
        run: |
          set -Eeuo pipefail
          pr="$(GH_TOKEN="$RUNNER_GH_TOKEN" gh api repos/${GITHUB_REPOSITORY}/pulls/366)"
          test "$(jq -r '.state' <<<"$pr")" = 'open'
          test "$(jq -r '.merged' <<<"$pr")" = 'false'
          test "$(jq -r '.head.ref' <<<"$pr")" = 'release/skill-book-v48-candidate-asset-20260827'
          echo 'TEMP_V48_PR_OPEN_NOT_MERGED=PASS'

      - name: Exact GOV-DOC Source checkout and preconditions
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN"
          test -n "$RELEASE_TOKEN"
          test -z "$(git ls-remote "https://x-access-token:${RELEASE_TOKEN}@github.com/${GOV_REPOSITORY}.git" "refs/tags/$TAG")"
          if GH_TOKEN="$RELEASE_TOKEN" gh api "repos/$GOV_REPOSITORY/releases/tags/$TAG" >/dev/null 2>&1; then
            echo 'V48_RELEASE_ALREADY_EXISTS=BLOCK'
            exit 1
          fi
          git clone -q "https://x-access-token:${PRIVATE_READ_TOKEN}@github.com/${GOV_REPOSITORY}.git" gov
          cd gov
          git checkout -q "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(cat skills/skill-book/V4.8/VERSION)" = '4.8'
          echo "V48_EXACT_SOURCE_CHECKOUT=PASS:$SOURCE_COMMIT"

      - name: Verify exact payload and SHA manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('gov/skills/skill-book/V4.8')
          m=json.loads((root/'MANIFEST.json').read_text(encoding='utf-8'))
          assert m['version']=='4.8' and len(m['files'])==39
          expected=set()
          for x in m['files']:
              p=root/x['path']; assert p.is_file(),x['path']
              b=p.read_bytes(); assert len(b)==x['bytes']; assert hashlib.sha256(b).hexdigest()==x['sha256']
              expected.add(x['path'])
          actual={p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()}-{'MANIFEST.json','SHA256SUMS.txt'}
          assert actual==expected
          skill=(root/'SKILL.md').read_bytes()
          assert len(skill)==29597
          assert hashlib.sha256(skill).hexdigest()=='e046eb73a400c690d524ec889fa33252c2bc9b2af1ab2aa9fe598b10e21401de'
          print('V48_PAYLOAD_IDENTITY=39/39_PASS')
          PY
          cd gov/skills/skill-book/V4.8
          sha256sum -c SHA256SUMS.txt >/dev/null
          echo 'V48_SHA256SUMS=PASS'

      - name: Run V4.8 38 modular tests and syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          cd gov/skills/skill-book/V4.8
          python3 -m unittest discover -s tests -v 2>&1 | tee /tmp/v48-tests.log
          test "$(grep -E '^Ran [0-9]+ tests? in ' /tmp/v48-tests.log | tail -1 | awk '{print $2}')" = '38'
          grep -Fq 'OK' /tmp/v48-tests.log
          python3 -m compileall -q scripts tests
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          echo 'V48_MODULAR_TESTS=38/38_PASS'
          echo 'V48_PYTHON_SYNTAX=PASS'

      - name: Build exact portable deterministic ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/v48-local
          python3 - <<'PY'
          from pathlib import Path,PurePosixPath
          import hashlib,zipfile
          src=Path('gov/skills/skill-book/V4.8'); out=Path('/tmp/v48-local/skill-book_V4.8_CANDIDATE_20260827.zip')
          files=sorted(p for p in src.rglob('*') if p.is_file())
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_STORED) as z:
              for p in files:
                  zi=zipfile.ZipInfo('skill-book_V4.8_CANDIDATE/'+p.relative_to(src).as_posix(),date_time=(1980,1,1,0,0,0))
                  zi.compress_type=zipfile.ZIP_STORED; zi.create_system=3; zi.external_attr=(0o100644<<16); zi.extra=b''; zi.comment=b''
                  z.writestr(zi,p.read_bytes())
          b=out.read_bytes(); assert len(b)==156008; assert hashlib.sha256(b).hexdigest()=='df933b799e7e56a662f055abfe9825d15a4470c86cf9b41a34e30cbb98bf4c4b'
          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None
              names=z.namelist(); assert len(names)==len(set(names))==41
              assert not [n for n in names if PurePosixPath(n).is_absolute() or '..' in PurePosixPath(n).parts or '\\' in n]
              assert not [n for n in names if '__pycache__' in PurePosixPath(n).parts or n.endswith('.pyc')]
          print('V48_LOCAL_ZIP_BYTES=156008')
          print('V48_LOCAL_ZIP_SHA256=df933b799e7e56a662f055abfe9825d15a4470c86cf9b41a34e30cbb98bf4c4b')
          print('V48_LOCAL_CRC_PATH_DUP_PYCACHE=PASS')
          PY
          printf '%s  %s\n' "$EXPECTED_SHA256" "$ASSET_NAME" > "/tmp/v48-local/$ASSET_NAME.sha256"

      - name: Create prerelease and upload exact assets
        shell: bash
        run: |
          set -Eeuo pipefail
          GH_TOKEN="$RELEASE_TOKEN" gh release create "$TAG" --repo "$GOV_REPOSITORY" --target "$SOURCE_COMMIT" --title "$RELEASE_TITLE" --notes "skill-book V4.8 Candidate / NOT CURRENT. Source Current V3.5. Exact Source Commit $SOURCE_COMMIT. 38/38 modular tests PASS. Current Promotion NOT_AUTHORIZED." --prerelease "/tmp/v48-local/$ASSET_NAME" "/tmp/v48-local/$ASSET_NAME.sha256"
          j="$(GH_TOKEN="$RELEASE_TOKEN" gh api "repos/$GOV_REPOSITORY/releases/tags/$TAG")"
          rid="$(jq -r '.id' <<<"$j")"; zid="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.id' <<<"$j")"; sid="$(jq -r --arg n "$ASSET_NAME.sha256" '.assets[]|select(.name==$n)|.id' <<<"$j")"
          test "$(jq -r '.prerelease' <<<"$j")" = true
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.size' <<<"$j")" = "$EXPECTED_BYTES"
          digest="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.digest // empty' <<<"$j")"; if test -n "$digest"; then test "$digest" = "sha256:$EXPECTED_SHA256"; fi
          test -n "$rid"; test -n "$zid"; test -n "$sid"
          echo "RELEASE_ID=$rid" >> "$GITHUB_ENV"; echo "ZIP_ASSET_ID=$zid" >> "$GITHUB_ENV"; echo "SHA_ASSET_ID=$sid" >> "$GITHUB_ENV"
          echo "V48_RELEASE_ID=$rid"; echo "V48_ZIP_ASSET_ID=$zid"; echo "V48_SHA_ASSET_ID=$sid"; echo 'V48_PRERELEASE=PASS'

      - name: Remote asset download readback
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/v48-remote
          GH_TOKEN="$RELEASE_TOKEN" gh release download "$TAG" --repo "$GOV_REPOSITORY" --dir /tmp/v48-remote
          test "$(stat -c '%s' "/tmp/v48-remote/$ASSET_NAME")" = "$EXPECTED_BYTES"
          test "$(sha256sum "/tmp/v48-remote/$ASSET_NAME"|awk '{print $1}')" = "$EXPECTED_SHA256"
          cmp -s "/tmp/v48-local/$ASSET_NAME" "/tmp/v48-remote/$ASSET_NAME"
          cmp -s "/tmp/v48-local/$ASSET_NAME.sha256" "/tmp/v48-remote/$ASSET_NAME.sha256"
          python3 - <<'PY'
          from pathlib import Path,PurePosixPath
          import hashlib,zipfile
          p=Path('/tmp/v48-remote/skill-book_V4.8_CANDIDATE_20260827.zip'); b=p.read_bytes()
          assert len(b)==156008 and hashlib.sha256(b).hexdigest()=='df933b799e7e56a662f055abfe9825d15a4470c86cf9b41a34e30cbb98bf4c4b'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None; names=z.namelist(); assert len(names)==len(set(names))==41
              assert not [n for n in names if PurePosixPath(n).is_absolute() or '..' in PurePosixPath(n).parts or '\\' in n]
              assert not [n for n in names if '__pycache__' in PurePosixPath(n).parts or n.endswith('.pyc')]
          print('V48_REMOTE_DOWNLOAD_READBACK=PASS'); print('V48_LOCAL_REMOTE_IDENTITY=MATCH'); print('V48_REMOTE_CRC_PATH_DUP_PYCACHE=PASS')
          PY

      - name: Resolve Runner identity
        shell: bash
        run: |
          set -Eeuo pipefail
          job="$(GH_TOKEN="$RUNNER_GH_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" --jq '.jobs[]|select(.name=="release")|.id'|head -1)"
          test -n "$job"; echo "RUNNER_JOB_ID=$job" >> "$GITHUB_ENV"; echo "V48_RUNNER_RUN=$GITHUB_RUN_ID"; echo "V48_RUNNER_JOB=$job"

      - name: GOV-DOC reconciliation after remote verification
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone -q "https://x-access-token:${RELEASE_TOKEN}@github.com/${GOV_REPOSITORY}.git" gov-r
          cd gov-r
          git config user.name 'VF Candidate Reconcile'; git config user.email 'release@kewaro.com'
          base="$(git rev-parse origin/main)"; test "$base" = "$(git ls-remote origin refs/heads/main|awk '{print $1}')"
          git checkout -q -B v48-reconcile origin/main; git merge-base --is-ancestor "$SOURCE_COMMIT" HEAD
          export RECONCILE_BASE="$base"
          python3 - <<'PY'
          from pathlib import Path
          import os
          source=os.environ['SOURCE_COMMIT']; tag=os.environ['TAG']; asset=os.environ['ASSET_NAME']; sha=os.environ['EXPECTED_SHA256']; size=os.environ['EXPECTED_BYTES']
          rid=os.environ['RELEASE_ID']; zid=os.environ['ZIP_ASSET_ID']; sid=os.environ['SHA_ASSET_ID']; run=os.environ['GITHUB_RUN_ID']; job=os.environ['RUNNER_JOB_ID']
          base=f'https://github.com/llhzx2018/gov-doc/releases/download/{tag}'; r=Path('.')
          (r/'distribution/skills/candidates/skill-book/V4.8/README.md').write_text(f'''# skill-book V4.8 Candidate · Source Distribution

> Status: `CANDIDATE / NOT CURRENT`  
> Distribution: `PUBLISHED_REMOTE_VERIFIED`  
> Source Authority: `skills/skill-book/V4.8/`  
> Candidate Mother Overlay: `mother-specs/skill-book/V4.8/SKILL_BOOK_V4.8_CANDIDATE_OVERLAY.md`  
> Source Current remains: `skill-book V3.5`

## Published Candidate Authority

- Exact Source Commit: `{source}`
- Tag: `{tag}`
- Release ID: `{rid}`
- File: `{asset}`
- Bytes: `{size}`
- SHA-256: `{sha}`
- Remote Asset ID: `{zid}`
- SHA Asset ID: `{sid}`
- Runner Run: `{run}`
- Runner Job: `{job}`
- Unit tests: `38/38 PASS (modular execution)`
- Python syntax: `PASS`
- ZIP container: `ZIP_STORED + fixed timestamp / permissions / path ordering`
- Local / Remote ZIP Identity: `MATCH`
- Remote Download Readback: `PASS`
- ZIP CRC: `PASS`
- Unsafe Path: `0`
- Duplicate Path: `0`
- pycache/pyc: `0`

Download: `{base}/{asset}`
SHA file: `{base}/{asset}.sha256`

## Authority Boundary
- Source Current: `skill-book V3.5`
- Installed Runtime Observation: `skill-book V4.7`
- V4.8 Backend Runtime Test: `NOT_RUN`
- Real Reader Forward Evidence: `NOT_RUN`
- Current Promotion: `NOT_AUTHORIZED`

Publication completes Candidate distribution only. It does not promote V4.8 to Source Current and does not claim Reader Outcome closure.
''',encoding='utf-8')
          (r/'distribution/skills/candidates/skill-book/V4.8/RUNTIME_ZIP_MIRROR_STATUS.md').write_text(f'''# Runtime ZIP Mirror Status · skill-book V4.8

Status: `PUBLISHED_REMOTE_VERIFIED`

