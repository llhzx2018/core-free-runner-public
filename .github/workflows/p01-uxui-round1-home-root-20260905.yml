name: P01 UXUI Round1 Home Root

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p01-uxui-round1-home-root-20260905.yml

permissions:
  contents: read

jobs:
  round1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      PRODUCT_BRANCH: feature/p01-uxui-round1-home-root-shell-20260905
      EXPECTED_SHA: 4c6ca3e64df591dae16a27a231189eb2d5fdad69
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.PRODUCT_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 1
          persist-credentials: true

      - name: Exact branch boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(cat VERSION)" = '2.46.3'
          test "$(cat src/VERSION.txt)" = '2.46.3'

      - name: Implement Root equals Home
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > src/index.php <<'PHP'
          <?php
          declare(strict_types=1);
          require_once __DIR__ . '/app/FunctionalWorkspaceShell.php';

          // Canonical root route: VF Start opens Home, never Navigation.
          // Authenticated Owners receive the private command center. Anonymous
          // visitors receive a small public Home shell; Navigation remains start.php.
          if (!vf_is_installed()) { header('Location: setup.php'); exit; }
          if (vf_is_admin()) { require __DIR__ . '/home.php'; exit; }

          vf_security_headers(false);
          header('Cache-Control: public, max-age=120, stale-while-revalidate=300');
          $entries = VfWorkspaceViewCatalog::entries(false);
          ?><!doctype html><html lang="zh-CN"><head>
          <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><meta name="theme-color" content="#0f766e">
          <title>首页 · VF Start</title>
          <link rel="stylesheet" href="<?=vf_fw_h(vf_asset_url('assets/surfaces.css'))?>">
          <link rel="stylesheet" href="<?=vf_fw_h(vf_asset_url('assets/surface-workspace.css'))?>">
          <link rel="stylesheet" href="<?=vf_fw_h(vf_asset_url('assets/workspace-v228.css'))?>">
          <link rel="stylesheet" href="<?=vf_fw_h(vf_asset_url('assets/workspace-rebaseline.css'))?>">
          <link rel="stylesheet" href="<?=vf_fw_h(vf_asset_url('assets/workspace-domain-nav.css'))?>">
          <link rel="stylesheet" href="<?=vf_fw_h(vf_asset_url('assets/uxui-home-root.css'))?>">
          </head><body class="vf-surface-app vf-public-home" data-vf-mode="home">
          <?php vf_fw_render_global_domain_nav('home', false, 'public'); ?>
          <main class="vf-public-home-main">
            <section class="vf-public-home-hero">
              <span class="vf-public-home-kicker">VF START · 首页</span>
              <h1>我的互联网，从首页开始。</h1>
              <p>首页负责开始与回到工作；导航只是其中一个资源工作区。登录后，这里会显示真正需要处理的事项、最近使用和最近操作。</p>
              <form class="vf-public-home-search" action="surfaces.php" method="get">
                <span aria-hidden="true">⌕</span><input type="search" name="q" placeholder="搜索公开资源" autocomplete="off"><button type="submit">搜索</button>
              </form>
              <div class="vf-public-home-actions"><a href="start.php">进入导航</a><button type="button" data-vf-auth-login>登录个人工作台</button></div>
            </section>
            <section class="vf-public-home-principle" aria-label="首页职责">
              <strong>Home ≠ Navigation</strong>
              <p>打开主域名、点击 VF Start 标志或点击“首页”，都回到这里；导航拥有自己的独立入口。</p>
            </section>
          </main>
          <script src="<?=vf_fw_h(vf_asset_url('assets/auth-controls.js'))?>" defer></script>
          </body></html>
          PHP

          cat > src/start.php <<'PHP'
          <?php
          declare(strict_types=1);

          // Navigation is a first-class workspace, not the site root.
          $vfWorkspaceMode = 'start';
          require_once __DIR__ . '/app/FunctionalWorkspace.php';
          vf_security_headers(true);
          vf_render_functional_workspace();
          PHP

          python3 - <<'PY'
          from pathlib import Path

          p=Path('src/app/WorkspaceViewCatalog.php')
          s=p.read_text()
          old="""        if ($admin) return $entries;\n        return array_values(array_filter($entries, static fn(array $entry): bool => $entry['mode'] !== 'home'));"""
          if old not in s: raise SystemExit('WorkspaceViewCatalog entries boundary not found')
          s=s.replace(old,"        return $entries;",1)
          s=s.replace("['mode'=>'home','label'=>'首页','route'=>'home.php','icon'=>'⌂']","['mode'=>'home','label'=>'首页','route'=>'index.php','icon'=>'⌂']",1)
          p.write_text(s)

          p=Path('src/app/FunctionalWorkspaceCore.php')
          s=p.read_text()
          old="        'home' => 'home.php',"
          if old not in s: raise SystemExit('home base route not found')
          p.write_text(s.replace(old,"        'home' => 'index.php',",1))

          p=Path('src/app/FunctionalWorkspaceShell.php')
          s=p.read_text()
          replacements={
            "$href = $key === 'home' ? 'home.php' : vf_fw_route_link($key, $admin ? $scope : 'public', 0);":"$href = $key === 'home' ? 'index.php' : vf_fw_route_link($key, $admin ? $scope : 'public', 0);",
            "$brandHref = $admin ? 'home.php' : 'index.php';":"$brandHref = 'index.php';",
            "$target=$key==='home'?'home.php':vf_fw_route_link($key,$admin?$scope:'public',$categoryId);":"$target=$key==='home'?'index.php':vf_fw_route_link($key,$admin?$scope:'public',$categoryId);",
          }
          for old,new in replacements.items():
              if old not in s: raise SystemExit('shell boundary not found: '+old)
              s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('src/assets/auth-controls.js')
          s=p.read_text()
          old="        location.reload();"
          if old not in s: raise SystemExit('login reload boundary not found')
          p.write_text(s.replace(old,"        location.href='index.php';",1))
          PY

          cat > src/assets/uxui-home-root.css <<'CSS'
          /* UX/UI Reconstruction R1: root is a real Home, not the Navigation workspace. */
          .vf-public-home{min-height:100vh;background:var(--ws-bg);color:var(--ws-text)}
          .vf-public-home-main{width:min(1180px,calc(100% - 40px));margin:0 auto;padding:clamp(48px,8vw,108px) 0 64px}
          .vf-public-home-hero{max-width:820px}
          .vf-public-home-kicker{display:block;color:var(--ws-teal);font-size:11px;font-weight:800;letter-spacing:.16em}
          .vf-public-home-hero h1{max-width:760px;margin:12px 0 14px;font-size:clamp(38px,6vw,72px);line-height:1.02;letter-spacing:-.05em}
          .vf-public-home-hero p{max-width:700px;margin:0;color:var(--ws-muted);font-size:15px;line-height:1.8}
          .vf-public-home-search{max-width:660px;height:52px;margin-top:30px;padding:0 8px 0 16px;display:flex;align-items:center;gap:10px;border:1px solid var(--ws-line-strong);border-radius:14px;background:var(--ws-panel);box-shadow:0 10px 30px rgba(15,23,42,.05)}
          .vf-public-home-search>span{color:var(--ws-muted-2);font-size:18px}.vf-public-home-search input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:var(--ws-text);font:inherit;font-size:14px}.vf-public-home-search button{height:36px;padding:0 14px;border:0;border-radius:9px;background:var(--ws-teal);color:#fff;font-weight:750;cursor:pointer}
          .vf-public-home-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}.vf-public-home-actions a,.vf-public-home-actions button{min-height:40px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--ws-line-strong);border-radius:9px;background:var(--ws-panel);color:var(--ws-text);font:inherit;font-size:12.5px;font-weight:750;text-decoration:none;cursor:pointer}.vf-public-home-actions button{border-color:var(--ws-teal);background:var(--ws-teal);color:#fff}
          .vf-public-home-principle{max-width:660px;margin-top:54px;padding-top:18px;border-top:1px solid var(--ws-line)}.vf-public-home-principle strong{font-size:12px;letter-spacing:.04em}.vf-public-home-principle p{margin:6px 0 0;color:var(--ws-muted-2);font-size:12px;line-height:1.65}
          @media(max-width:760px){.vf-public-home-main{width:min(100% - 24px,1180px);padding-top:34px}.vf-public-home-hero h1{font-size:38px}.vf-public-home-search{height:48px;margin-top:22px}.vf-public-home-actions{display:grid;grid-template-columns:1fr 1fr}.vf-public-home-actions a,.vf-public-home-actions button{width:100%}}
          CSS

          cat > tests/unit/uxui_round1_home_root_contract.php <<'PHP'
          <?php
          declare(strict_types=1);
          $root=dirname(__DIR__,2);
          $mustContain=function(string $path,string $needle):void use($root){$s=file_get_contents($root.'/'.$path);if($s===false||!str_contains($s,$needle))throw new RuntimeException($path.' missing: '.$needle);};
          $mustNotContain=function(string $path,string $needle):void use($root){$s=file_get_contents($root.'/'.$path);if($s!==false&&str_contains($s,$needle))throw new RuntimeException($path.' still contains: '.$needle);};
          $mustContain('src/index.php',"require __DIR__ . '/home.php'");
          $mustNotContain('src/index.php',"$vfWorkspaceMode = 'start'");
          $mustContain('src/start.php',"$vfWorkspaceMode = 'start'");
          $mustContain('src/app/WorkspaceViewCatalog.php',"['mode'=>'home','label'=>'首页','route'=>'index.php'");
          $mustNotContain('src/app/WorkspaceViewCatalog.php',"entry['mode'] !== 'home'");
          $mustContain('src/app/FunctionalWorkspaceCore.php',"'home' => 'index.php'");
          $mustContain('src/app/FunctionalWorkspaceShell.php',"$brandHref = 'index.php';");
          $mustContain('src/assets/auth-controls.js',"location.href='index.php';");
          echo "UXUI_ROUND1_HOME_ROOT_CONTRACT=PASS\n";
          PHP

          git status --short

      - name: Syntax and Round1 contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l src/index.php
          php -l src/start.php
          php -l src/app/WorkspaceViewCatalog.php
          php -l src/app/FunctionalWorkspaceCore.php
          php -l src/app/FunctionalWorkspaceShell.php
          php -l tests/unit/uxui_round1_home_root_contract.php
          php tests/unit/uxui_round1_home_root_contract.php
          node --check src/assets/auth-controls.js
          test "$(cat VERSION)" = '2.46.3'
          test "$(cat src/VERSION.txt)" = '2.46.3'
          test ! -e src/migrations/2026090501.php

      - name: Commit Round1 implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add src/index.php src/start.php src/app/WorkspaceViewCatalog.php src/app/FunctionalWorkspaceCore.php src/app/FunctionalWorkspaceShell.php src/assets/auth-controls.js src/assets/uxui-home-root.css tests/unit/uxui_round1_home_root_contract.php
          git commit -m 'feat(P01): make root the canonical Home'
          git push origin HEAD:${PRODUCT_BRANCH}
