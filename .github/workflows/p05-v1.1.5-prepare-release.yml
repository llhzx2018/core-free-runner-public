name: P05 V1.1.5 Prepare Release Source

on:
  push:
    branches:
      - gate/p05-v115-stale-empty-install-20260830
    paths:
      - '.github/workflows/p05-v1.1.5-prepare-release.yml'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    env:
      P05_VERSION: 1.1.5
      P05_BRANCH: release/p05-v1.1.5-fresh-install-fix-20260830
    steps:
      - name: Checkout P05 release branch
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.P05_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
      - name: Bump release identity
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$P05_VERSION" > VERSION
          python3 - <<'PY'
          import json, os
          v=os.environ['P05_VERSION']
          for path in ['package.json','VF_PROJECT.json']:
              with open(path,'r',encoding='utf-8') as f: data=json.load(f)
              data['version']=v
              if path=='VF_PROJECT.json':
                  data['target_version']=v
                  data['working_version']=v
                  data['status']='V1.1.5_RELEASE_CANDIDATE / DEPLOYMENT_READY / PRODUCTION_NOT_DEPLOYED'
              with open(path,'w',encoding='utf-8') as f:
                  json.dump(data,f,ensure_ascii=False,indent=2)
                  f.write('\n')
          PY
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VERSION package.json VF_PROJECT.json
          git commit -m 'release(P05): prepare V1.1.5 fresh-install fix'
          git push origin HEAD:"$P05_BRANCH"
          echo P05_V115_RELEASE_SOURCE_PREPARED=PASS
