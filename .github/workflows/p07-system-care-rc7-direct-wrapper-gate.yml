name: P07 System Care RC7 Direct Wrapper Gate

on:
  push:
    branches: [gate/p07-system-care-rc7-field-harness-20260907]
    paths:
      - '.github/workflows/p07-system-care-rc7-direct-wrapper-gate.yml'

permissions:
  contents: read

jobs:
  validate-direct-wrapper:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout public gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact private direct wrapper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/core-free-runner-private
          ref: 863f8c6c59005e4fc1473c12f9e85d6b9d98a79e
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: private-gate
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact frozen P07 RC7 runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 0ce386082b648c4fa64a2c01e1c85957d0a8919b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: product
          persist-credentials: false
          fetch-depth: 1

      - name: Exact identities and syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C private-gate rev-parse HEAD)" = "863f8c6c59005e4fc1473c12f9e85d6b9d98a79e"
          test "$(git -C product rev-parse HEAD)" = "0ce386082b648c4fa64a2c01e1c85957d0a8919b"
          bash -n private-gate/scripts/p07-system-care-rc7-field-direct-run.sh
          bash -n private-gate/scripts/p07-system-care-rc7-field-preflight.sh
          bash -n private-gate/scripts/p07-system-care-rc7-field-gate.sh
          echo P07_RC7_DIRECT_WRAPPER_IDENTITIES=PASS
          echo P07_RC7_DIRECT_WRAPPER_BASH_SYNTAX=PASS

      - name: Validate-only mode has zero VPS contact
        shell: bash
        env:
          PRODUCT_DIR: ${{ github.workspace }}/product
          P07_DIRECT_MODE: validate
        run: |
          set -Eeuo pipefail
          output="$(bash private-gate/scripts/p07-system-care-rc7-field-direct-run.sh)"
          printf '%s\n' "$output"
          grep -Fq 'P07_RC7_DIRECT_EXECUTOR_EXACT_HARNESS=PASS' <<<"$output"
          grep -Fq 'P07_RC7_DIRECT_EXECUTOR_EXACT_PRODUCT=PASS' <<<"$output"
          grep -Fq 'P07_RC7_DIRECT_EXECUTOR_MODE=VALIDATE_ONLY' <<<"$output"
          grep -Fq 'P07_RC7_DIRECT_EXECUTOR_VPS_CONTACT=0' <<<"$output"
          grep -Fq 'P07_RC7_REAL_CLOUDPANEL_WP_FIELD=NOT_RUN' <<<"$output"
          grep -Fq 'P07_RC7_DIRECT_EXECUTOR_VALIDATE=PASS' <<<"$output"
          echo P07_RC7_DIRECT_WRAPPER_VALIDATE_ONLY=PASS

      - name: Direct wrapper security contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('private-gate/scripts/p07-system-care-rc7-field-direct-run.sh')
          s=p.read_text(encoding='utf-8')
          required=[
            "EXPECTED_PRODUCT_SHA='0ce386082b648c4fa64a2c01e1c85957d0a8919b'",
            "EXPECTED_PREFLIGHT_BLOB='e58fc4f16c022a76b8d76e6937465c4fa5c03ce8'",
            "EXPECTED_FIELD_GATE_BLOB='d93402558b830284d0b2ac45f6d8605c6886b417'",
            ': "${VPS_PASSWORD:?VPS_PASSWORD required only for P07_DIRECT_MODE=run}"',
            "grep -Fq -- \"$VPS_PASSWORD\"",
            "P07_RC7_DIRECT_EXECUTOR_SECRET_LOG_SCAN=PASS",
            "P07_RC7_FIELD_DNS_WRITE=0",
            "P07_RC7_FIELD_OLD_SERVER_DELETE=0",
            "P07_RC7_FIELD_PRODUCTION_WRITE=0",
            "P07_RC7_FIELD_CLOUDPANEL_CONFIG_WRITE=0",
            "P07_RC7_FIELD_EXISTING_SITE_OVERWRITE=0",
            "P07_RC7_FIELD_UNRELATED_SCHEDULER_WRITE=0",
          ]
          for x in required:
            assert x in s, x
          forbidden=[
            'StrictHostKeyChecking=no', 'UserKnownHostsFile=/dev/null',
            '/etc/ssh/sshd_config', 'iptables ', 'nft add', 'firewall-cmd',
            'systemctl reboot', '\nreboot\n', '\nshutdown\n', '\npoweroff\n',
          ]
          for x in forbidden:
            assert x not in s, x
          print('P07_RC7_DIRECT_WRAPPER_SECURITY_STATIC=PASS')
          PY

      - name: Frozen product specialist regressions remain green
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          bash modules/system-care/tests/static_gate.sh
          bash modules/system-care/tests/functional_gate.sh
          echo P07_RC7_DIRECT_WRAPPER_FROZEN_PRODUCT_REGRESSION=PASS

      - name: Final direct wrapper marker
        shell: bash
        run: echo P07_RC7_DIRECT_WRAPPER_MACHINE_GATE=PASS
