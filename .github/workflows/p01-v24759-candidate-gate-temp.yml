name: p01-v24759-candidate-gate-temp

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v24759-candidate-gate-temp.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      TARGET_SHA: 223b1a2a32a39b854d1a1144efee3f6af45f2718
      STABLE_SHA: bec31fd98a45b116100d573a65d70d2d6ab86f32
    steps:
      - name: Checkout runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout exact candidate and stable source
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          for name in candidate stable; do
            git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "${name}"
          done
          git -C candidate fetch -q --depth 1 origin "${TARGET_SHA}"
          git -C candidate checkout -q --detach FETCH_HEAD
          git -C stable fetch -q --depth 1 origin "${STABLE_SHA}"
          git -C stable checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C stable rev-parse HEAD)" = "$STABLE_SHA"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.59"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "2.47.59"
          echo P01_V24759_CANDIDATE_EXACT_SOURCE=PASS

      - name: Candidate identity diff
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C candidate fetch -q --depth 1 origin 2dc80e8c71a3c7435f0bce5b6e09165f7aa22151
          git -C candidate diff --name-only 2dc80e8c71a3c7435f0bce5b6e09165f7aa22151 "$TARGET_SHA" | sort >/tmp/actual.txt
          cat >/tmp/expected.txt <<'EOF'
          VERSION
          src/VERSION.txt
          src/app/bootstrap.php
          tests/unit/engineering_consistency_r80_contract.php
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          echo P01_V24759_CANDIDATE_IDENTITY_DIFF=PASS

      - name: Focused UI and identity contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check candidate/src/assets/links-admin.js
          tests=(
            tests/unit/navigation_category_workspace_tabs_contract.php
            tests/unit/navigation_page_visual_closure_contract.php
            tests/unit/navigation_header_spacing_r1_contract.php
            tests/unit/engineering_consistency_r80_contract.php
            tests/unit/session_csrf_contract.php
          )
          for t in "${tests[@]}"; do php "candidate/${t}"; done
          echo P01_V24759_CANDIDATE_FOCUSED=PASS

      - name: Canonical zero-debt
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate stable --require-zero-debt | tee /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_CURRENT_FAILURE_COUNT=0' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_NEW_REGRESSION_COUNT=0' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_LEGACY_TEST_DEBT_COUNT=0' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/canonical.txt
          echo P01_V24759_CANDIDATE_CANONICAL=PASS
