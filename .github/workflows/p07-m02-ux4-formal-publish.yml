# Owner authorized only P07-M02 UX4, PR 4627 exact candidate.
name: P07 M02 UX4 independent Formal Release
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p07-m02-ux4-formal-publish.yml']
  push:
    branches: [main]
    paths: ['.github/workflows/p07-m02-ux4-formal-publish.yml']
permissions:
  contents: read
  actions: read
jobs:
  exact-module-release:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.actor == 'llhzx2018' && github.triggering_actor == 'llhzx2018' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.user.login == 'llhzx2018' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.head_ref == 'release/p07-m02-ux4-formal-20261128') ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
        startsWith(github.event.head_commit.message, 'P07 M02 UX4 formal publish')))
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE: 76c46e042f19d9a289ef31b1c16db2caba837f63
      CANDIDATE: acb31acc2241ac7f58fd0daf235113ca55ae2009
      TREE: 232c0dc8381b344ae48690c6be5e73fa770e7483
      PRODUCT_AUTHORITY: 5a9fd0d1cfdc485f9709586f191689f9e47a3415
      GOV: cf6d84ab4efcaee16566a56744d7a363692dfab4
      BUILD: 2.1.1-ux4
      ASSET: P07-M02-2.1.1-ux4.zip
      RELEASE_TAG: p07-m02-v2.1.1-ux4-20261128
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 76c46e042f19d9a289ef31b1c16db2caba837f63
          persist-credentials: false
          path: source
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 5a9fd0d1cfdc485f9709586f191689f9e47a3415
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: cf6d84ab4efcaee16566a56744d7a363692dfab4
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov
      - name: Reuse exact source original machine proofs and normal merge identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE"
          test "$(git -C source rev-parse 'HEAD^{tree}')" = "$TREE"
          test "$(git -C product rev-parse HEAD)" = "$PRODUCT_AUTHORITY"
          test "$(git -C gov rev-parse HEAD)" = "$GOV"
          test "$(git -C gov hash-object CURRENT.md)" = 8045f822f40f34efc72d0cdd877db753050dc5df
          test "$(git -C source hash-object experiments/p07-vps-audit-v21-ux4.sh)" = 470aae8d118e1d1ac74edc414b04282f20aff3b6
          test "$(git -C source hash-object installers/p07-m02-ux4-atomic.py)" = c90ceb89655010b192f400839f218890727ddd5d
          test "$(git -C source hash-object installers/p07-three-ux-atomic.py)" = 9fc4ecfab8bca665ccde238f0e40631657205f82
          test "$(git -C source hash-object scripts/build_p07_ux_three_release_candidates.py)" = 116f10167722b14842065317a18437d2dbd24627
          test "$(git -C source hash-object installers/p07-toolbox.sh)" = 2b021ab7df93a339fd3cf9885a25ac9b91dc3768
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/4627")
          jq -e --arg candidate "$CANDIDATE" --arg source "$SOURCE" '.merged and .head.sha==$candidate and .merge_commit_sha==$source' <<<"$pr" >/dev/null
          for pair in 46031357144:140615684997 46031357123:140615684408; do
            run=$(echo "$pair"|cut -d: -f1);job=$(echo "$pair"|cut -d: -f2)
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" | jq -e --arg sha "$CANDIDATE" '.head_sha==$sha and .conclusion=="success"' >/dev/null
            gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$job" | jq -e --argjson run "$run" '.run_id==$run and .conclusion=="success" and (.steps|length)>0' >/dev/null
          done
          for run in 46031357282 46031357332 46031357249; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" | jq -e --arg sha "$CANDIDATE" '.head_sha==$sha and .conclusion=="success"' >/dev/null
          done
          echo P07_M02_EXACT_MERGED_TREE_AND_REUSED_REAL_MACHINE_GATES=PASS
          echo P07_M02_ROUTE_MEASUREMENT_LIMIT=INSUFFICIENT_RETAINED
      - name: Build exact standalone ZIP twice and verify manifest and structural delivery
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/p07-m02-formal"
          test ! -e "$root"
          mkdir -m 700 "$root"
          export ROOT="$root"
          python3 -B - <<'PY'
          import hashlib,importlib.util,json,os,subprocess,zipfile
          from pathlib import Path
          root=Path(os.environ['ROOT']);source=Path('source')
          def load(path,name):
              spec=importlib.util.spec_from_file_location(name,path);m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m);return m
          c=load(source/'installers/p07-m02-ux4-atomic.py','candidate')
          b=load(source/'scripts/build_p07_ux_three_release_candidates.py','builder')
          script=(source/'experiments/p07-vps-audit-v21-ux4.sh').read_bytes()
          files={c.ENTRY:script,'VERSION':(c.NEW+'\n').encode()}
          files[c.META]=c.manifest(c.NEW,script)
          c.check_payload(c.NEW,files)
          target=root/os.environ['ASSET'];rebuild=root/'rebuild.zip'
          digest=b.output_zip(target,c.MODULE,files)
          assert b.output_zip(rebuild,c.MODULE,files)==digest and target.read_bytes()==rebuild.read_bytes()
          rebuild.unlink()
          with zipfile.ZipFile(target) as z:
              assert set(z.namelist())=={'p07-m02/'+x for x in files} and len(z.infolist())==3
              assert all(z.read('p07-m02/'+n)==v for n,v in files.items())
              assert z.testzip() is None
              assert all((i.external_attr>>16)&0o170000==0o100000 for i in z.infolist())
          meta=hashlib.sha256(files[c.META]).hexdigest()
          receipt={'schema':'vf.p07.m02.ux4.release.v1','module_id':c.MODULE,'module_name':c.LABEL,
                   'build_id':c.NEW,'previous_build':c.OLD,'source_commit':os.environ['SOURCE'],
                   'candidate_commit':os.environ['CANDIDATE'],'source_tree':os.environ['TREE'],
                   'product_authority_commit':os.environ['PRODUCT_AUTHORITY'],
                   'gov_authority_commit':os.environ['GOV'],'tag':os.environ['RELEASE_TAG'],
                   'asset':target.name,'bytes':target.stat().st_size,'sha256':digest,'manifest_sha256':meta,
                   'installer_blob':'c90ceb89655010b192f400839f218890727ddd5d',
                   'atomic_engine_blob':'9fc4ecfab8bca665ccde238f0e40631657205f82',
                   'machine_runs':[46031357144,46031357123,46125517661],
                   'route_evidence':'INSUFFICIENT','production':'OWNER_MANUAL_NOT_RUN',
                   'other_modules':'UNCHANGED','public_toolbox_pin':'UX3_UNTIL_SEPARATE_DISTRIBUTION_GATE'}
          manifest=root/'P07-M02-UX4-RELEASE.json'
          manifest.write_text(json.dumps(receipt,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          (root/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in (target,manifest)))
          delivery={'schema':'vf.public-authority.task-delivery-check.v1','project':'P07','source':os.environ['PRODUCT_AUTHORITY'],
                    'project_authority':{'agents':'AGENTS.md','current':'docs/authority/CURRENT.md','acceptance':'docs/authority/ACCEPTANCE_MATRIX.md','applicability':'docs/authority/PUBLIC_AUTHORITY_APPLICABILITY.md'},
                    'acceptance_markers':['P07-M02 服务器性能检测（VPS 验机）','P07-PUBLIC-03'],
                    'required_domains':['INSTALL','UPGRADE','SECURITY','TESTING','DATA_SCHEMA','GIT','UA_UI','OBSERVABILITY','PERFORMANCE'],
                    'task_capabilities':['installer','update','source_change','release','ux_change','diagnostics','performance_sensitive_release'],
                    'delivery':{'profile':'static_bundle_zip','entrypoint':'p07-m02/vps-audit.sh','artifact':target.name,'sha256':digest,'requires_git':False,'requires_manual_source_copy':False}}
          (root/'delivery.json').write_text(json.dumps(delivery,ensure_ascii=False))
          tree=subprocess.check_output(['git','-C','product','rev-parse','HEAD^{tree}'],text=True).strip()
          baseline={'category':'N_A','scope_source':os.environ['PRODUCT_AUTHORITY'],'scope_tree':tree,
                    'scope_ref':'P07-M02 PR 4627 exact existing CLI release packaging, terminal UX V3 separately proven',
                    'reason':'Existing terminal CLI artifact promotion only; no new visual prototype or web design in this packaging task. Exact terminal UX tests remain REQUIRED and were independently executed.'}
          (root/'prototype-scope.json').write_text(json.dumps(baseline))
          print('P07_M02_FINAL_ZIP_SHA256='+digest)
          print('P07_M02_FINAL_ZIP_BYTES='+str(target.stat().st_size))
          print('P07_M02_FINAL_MANIFEST_SHA256='+meta)
          print('P07_M02_REPRODUCIBLE_EXACT_THREE_MEMBER_FULL=PASS')
          PY
          python3 -B gov/governance/public-authority/tools/task_delivery_contract_lint.py --phase delivery --project-root product --artifact-root "$root" --receipt "$root/delivery.json" --public-router gov/governance/public-authority/VF_PUBLIC_AUTHORITY_APPLICABILITY_ROUTER_V1.0.json --ux-baseline "$root/prototype-scope.json" --owner-ux-status PENDING
          (cd "$root" && sha256sum -c SHA256SUMS)
          echo P07_M02_PREISSUE_ARTIFACT_GATE=PASS
      - name: Publish only immutable M02 release after normal authorized main merge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN" || { echo P07_M02_RELEASE_WRITE_CAPABILITY_MISSING;exit 78; }
          r="$GITHUB_REPOSITORY";root="$RUNNER_TEMP/p07-m02-formal"
          test "$(gh api "repos/$r/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          gh api "repos/$r/compare/$SOURCE...$GITHUB_SHA" | jq -e '.status=="ahead" and ([.files[].filename]==[".github/workflows/p07-m02-ux4-formal-publish.yml"])' >/dev/null
          test "$(gh api "repos/llhzx2018/vf-server-ops/git/ref/heads/main" --jq '.object.sha')" = "$PRODUCT_AUTHORITY"
          test "$(gh api "repos/llhzx2018/gov-doc/git/ref/heads/main" --jq '.object.sha')" = "$GOV"
          # Never overwrite or append to an already existing release or tag.
          if gh release view "$RELEASE_TAG" -R "$r" >/dev/null 2>&1;then echo P07_M02_EXISTING_RELEASE_STOP;exit 13;fi
          if gh api "repos/$r/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1;then echo P07_M02_EXISTING_TAG_STOP;exit 13;fi
          gh release create "$RELEASE_TAG" -R "$r" --target "$SOURCE" \
            --title 'P07-M02 服务器性能检测 2.1.1-UX4 正式独立安装包' \
            --notes '仅 M02；准确候选 acb31acc 正常合并至 76c46e04，实际完整性能检测与原子升级/回滚证据复用。网络路由检测可能显示证据不足。其他四模块不变。公共 Toolbox 更新另验；Production 仅 Owner 手工。' \
            "$root/$ASSET" "$root/P07-M02-UX4-RELEASE.json" "$root/SHA256SUMS"
          test "$(gh api "repos/$r/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$SOURCE"
          gh api "repos/$r/releases/tags/$RELEASE_TAG" | jq -e '.draft==false and .prerelease==false and (.assets|length)==3' >/dev/null
          gh api "repos/$r/releases/tags/$RELEASE_TAG" --jq '"P07_M02_RELEASE_ID="+(.id|tostring),(.assets[]| "P07_M02_ASSET_ID="+(.id|tostring)+" "+.name+" "+(.size|tostring))'
          unset GH_TOKEN GITHUB_TOKEN
          mkdir "$root/remote"
          for name in "$ASSET" P07-M02-UX4-RELEASE.json SHA256SUMS;do
            curl --proto '=https' --proto-redir '=https' -fsSL --max-time 120 "https://github.com/$r/releases/download/$RELEASE_TAG/$name" -o "$root/remote/$name"
            cmp "$root/$name" "$root/remote/$name"
          done
          (cd "$root/remote" && sha256sum -c SHA256SUMS)
          echo P07_M02_IMMUTABLE_TAG_OFFICIAL_ASSET_ANONYMOUS_READBACK=PASS
          echo P07_M02_FORMAL_RELEASE_ASSET=PASS
      - name: Always clean staged release and private source
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          for p in "$RUNNER_TEMP/p07-m02-formal" "$GITHUB_WORKSPACE/product" "$GITHUB_WORKSPACE/gov" "$GITHUB_WORKSPACE/source";do
            [[ ! -L "$p" ]]
            rm -rf -- "$p"
            test ! -e "$p"
          done
          echo P07_M02_TRANSIENT_CHECKOUT_AND_STAGED_BYTES_CLEANUP=PASS
