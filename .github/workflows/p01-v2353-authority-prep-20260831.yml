            .v2_35_3_tag_state="ABSENT / CANDIDATE ONLY" |
            .core_updates_v2_35_3_state="NOT PUBLISHED" |
            .v2_35_3_hotfix_gate={run:33358556905,result:"PASS",evidence_artifact:9745933486,evidence_digest:"sha256:b426a811a55dafd08f4140a5b638628b31ea8e1440114473ab2ddf97c8aa9ee2"}
          ' VF_PROJECT.json > VF_PROJECT.json.tmp
          mv VF_PROJECT.json.tmp VF_PROJECT.json
          jq -e '.production_version=="2.35.2" and .candidate_version=="2.35.3" and .current_change.machine_gate==33358556905 and .schema_version=="2026082901" and .current_change.migration==null' VF_PROJECT.json >/dev/null
          test "$(git diff --name-only)" = VF_PROJECT.json
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VF_PROJECT.json
          git commit -m 'release(P01): reconcile V2.35.3 candidate authority'
          git push origin HEAD:release/v2.35.3-candidate-20260831
          echo P01_V2353_AUTHORITY_PREP=PASS
