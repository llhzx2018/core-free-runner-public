name: P01 V2.35.3 Candidate Authority Prep
on:
  push:
    branches: [release/p01-v2353-candidate-prep-20260831]
    paths: [.github/workflows/p01-v2353-authority-prep-20260831.yml]
permissions:
  contents: read
jobs:
  authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: release/v2.35.3-candidate-20260831
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Reconcile exact Current Truth metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          test "$(git rev-parse HEAD)" = 7274b32a5c77c3fe58c18771e14efc42275a8574
          test "$(git rev-parse origin/develop)" = c9ca6d6f0052bd1a0c61d07fc6b1042708e74b93
          test "$(git rev-parse origin/main)" = 3c9239be8bba34637411110f7fdb43f6e494c880
          jq '
            .status="V2.35.2 OWNER UPGRADE SUCCESS / V2.35.2 PUBLISHED / V2.35.3 PATCH RELEASE CANDIDATE" |
            .production_version="2.35.2" |
            .working_version="2.35.3" |
            .target_release_version="2.35.3" |
            .current_phase="V2.35.3 CANDIDATE READINESS PENDING" |
            .production_release={
              version:"2.35.2", tag:"v2.35.2", release_id:379457325,
              release_source:"3c9239be8bba34637411110f7fdb43f6e494c880",
              release_tree:"5d179443e215879259e3b5560c5e3c0342c2149b",
              runtime_tree:"f000f39c1a2cf48296a4c165726323dabaf5e37c",
              schema_version:"2026082901",
              core_updates_commit:"d9cdc90149be9c04701d6853b60f9c5a3c8a66a7",
              online_asset:"VF_Start_V2.35.2_UPDATE.zip", online_asset_bytes:1377507,
              online_asset_sha256:"0b518b5393a0fdefdd98924429ef16e2e0f85af366887fa8c8b5cb4b9bc73505",
              full_asset:"VF-Start-V2.35.2-FULL.zip", full_asset_bytes:638639,
              full_asset_sha256:"8cb9874110d0f9b677eaa971f156b0dc2b3f54c5cf58a8f15e0dc5734bb6cce4",
              candidate_readiness_gate:33347168167,
              formal_artifact_gate:33347322224,
              formal_artifact_id:9742423604,
              formal_artifact_sha256:"94c13fc54833a0e5bfd8efb80a59f2419fb9b5e979b380c0d0d2e221e4546b58",
              strict_fresh_install_gate:33347594730,
              strict_fresh_artifact:9742506228,
              strict_fresh_artifact_sha256:"e33547304baf91a4c537999de9dab4f1b2d8e841bbbfdd0199eb5287561cdef6",
              main_promotion_gate:33347651122,
              publication_gate:33347698664,
              core_updates_manifest_gate:33347846821,
              remote_online_update_gate:33356120668,
              remote_online_update_artifact:9745179160,
              remote_online_update_artifact_sha256:"6dc513654aa67c43b681d5c169f756519ef0efbd8ba0ecb26595f248450c0854",
              remote_online_update:"2.35.1 -> 2.35.2 / PASS / ISOLATED OWNER-LIKE RUNTIME",
              owner_production_runtime:"2.35.2",
              owner_production_schema:"2026082901",
              owner_production_upgrade:"2.35.1 -> 2.35.2 / SUCCESS / Owner screenshot confirmed",
              owner_version_readback:"Current V2.35.2 / Latest V2.35.2 / green latest; terminal UI contradiction triggered V2.35.3 hotfix",
              production_closure:"UPGRADE SUCCESS / UI TERMINAL CLOSURE SUPERSEDED BY V2.35.3 HOTFIX",
              assistant_production_write:false
            } |
            .published_release=.production_release |
            .current_change={
              change_id:"P01-V2353-ONLINE-UPDATE-TERMINAL-CLOSURE-HOTFIX-20260831",
              base:"V2.35.2 OWNER UPGRADE SUCCESS / V2.35.2 PUBLISHED",
              result:"V2.35.3 PATCH RELEASE CANDIDATE",
              target_version:"2.35.3", schema_change:false, migration:null,
              product_source:"818091eb5d9576e8278a6e7282cfd4d1b6a32918",
              develop_source:"c9ca6d6f0052bd1a0c61d07fc6b1042708e74b93",
              machine_gate:33358556905, machine_result:"PASS", assistant_production_write:false
            } |
            .candidate_version="2.35.3" |
            .candidate_schema_version="2026082901" |
            .candidate_state="CANDIDATE READINESS PENDING" |
            .formal_release_state="V2.35.2 PUBLISHED / V2.35.3 NOT YET PUBLISHED" |
            .develop_state="V2.35.3 TERMINAL-STATE HOTFIX MERGED / RELEASE CANDIDATE PREPARED" |
            .current_authority="Owner Production V2.35.2 / Published Latest V2.35.2 / V2.35.3 Candidate Pending" |
            .next_action="Run V2.35.3 Candidate Readiness; only after PASS continue Formal Artifact, Strict Fresh, main promotion, publication, core-updates and remote online update gates." |
            .v2_35_2_tag_state="PUBLISHED / IMMUTABLE" |
