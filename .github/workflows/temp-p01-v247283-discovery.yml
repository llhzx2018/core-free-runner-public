name: TEMP P01 V2.47.283 Distribution Discovery
on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/temp-p01-v247283-discovery.yml"]
permissions:
  contents: read
jobs:
  proof:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'proof(P01): V2.47.283 discovery')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-curl jq unzip >/dev/null
      - name: Installed updater discovery from V2.47.282
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone -q --depth 1 --branch v2.47.282 "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" source
          READ_TOKEN="$READ_TOKEN" php -r '
            require "source/src/app/CoreUpdates/UpdateCore.php";
            require "source/src/app/CoreUpdates/GitHubClient.php";
            $client=new \CoreUpdates\GitHubClient((string)getenv("READ_TOKEN"),"p01-v247283-discovery-proof");
            $m=$client->fetchProjectManifest("llhzx2018/core-updates","P01.json","main");
            $core=new \CoreUpdates\UpdateCore("P01","APP");
            $result=$core->check("2.47.282","2026090401",$m);
            if(($result["status"]??"")!=="AVAILABLE"||($result["target_version"]??"")!=="2.47.283")exit(12);
            if(($m["release_id"]??0)!==406422561||($m["product_identity"]??"")!=="ec56dbdf85cd749addfb89b93515bbd704228326")exit(13);
            if(($m["asset_sha256"]??"")!=="0cced4593eb981bd797955113f469669628b42cab8651f22606943237b75a306")exit(14);
            if(strpos((string)($m["notes"]??""),"嵌套折叠")===false)exit(15);
            echo "P01_UPDATER_DISCOVERY=PASS\nP01_UPDATER_STATUS=AVAILABLE\nP01_UPDATER_TARGET=2.47.283\n";
          '
      - name: Exact formal Release readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api repos/llhzx2018/vf-start/releases/tags/v2.47.283 >/tmp/rel.json
          jq -e '.id==406422561 and .tag_name=="v2.47.283" and .draft==false and .prerelease==false' /tmp/rel.json >/dev/null
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.47.283 --jq '.object.sha')" = "ec56dbdf85cd749addfb89b93515bbd704228326"
          jq -e '.assets[]|select(.name=="VF_Start_V2.47.283_UPDATE.zip")|(.size==2362354 and .digest=="sha256:0cced4593eb981bd797955113f469669628b42cab8651f22606943237b75a306")' /tmp/rel.json >/dev/null
          mkdir -p /tmp/p01
          gh release download v2.47.283 -R llhzx2018/vf-start -D /tmp/p01 -p VF_Start_V2.47.283_UPDATE.zip
          test "$(stat -c %s /tmp/p01/VF_Start_V2.47.283_UPDATE.zip)" = 2362354
          echo '0cced4593eb981bd797955113f469669628b42cab8651f22606943237b75a306  /tmp/p01/VF_Start_V2.47.283_UPDATE.zip' | sha256sum -c -
          echo P01_RELEASE_ASSET_READBACK=PASS
          echo P01_V247283_DISTRIBUTION_DISCOVERY=PASS
          echo PRODUCTION_WRITE=NO
