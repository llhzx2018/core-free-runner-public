name: P01 V2.37.0 Formal Artifact Gate
on:
  push:
    branches:
      - release/p01-v2365-candidate-20260902
    paths:
      - .github/workflows/p01-v2370-formal-artifact-gate-20260902.yml
permissions:
  actions: read
  contents: read
jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FORMAL: 5172a497f7a2c9065880ae0d1257a15469917621
      FORMAL_TREE: eac2a8c76c49925bffbca9c23314ef90aec6f3bd
      FORMAL_RUNTIME_TREE: 057fbba8822950f163aa322d99b889ed3ab24842
      CANDIDATE: 0020ddc866f888a5d9485d3abfd3ae664a15cb7d
      MAIN_EXPECTED: 4a41d3533fe8450c3f491d5aaf28417536012ba0
      DEVELOP_EXPECTED: 6442c4b40a029ff359539d4adb509260c1ecf496
      SOURCE: ef86eba16aec71c1d0dabc16ad23089a78ee5057
      SOURCE_TREE: 926504354eaf4354e852e78b19c0fde69513a133
      SOURCE_RUNTIME_TREE: a7f472ec1f449ada1152d271f2723c52e7b58144
      VERSION: 2.37.0
      SOURCE_VERSION: 2.36.5
      SCHEMA: '2026082901'
      CANDIDATE_GATE: '33567195059'
      CANDIDATE_ARTIFACT: '9823578793'
      CANDIDATE_DIGEST: aad7d03454c9063ee72c48e5158653a9494e8caa7f2f8d378044545da464edcb
      FORMAL_BIND_GATE: '33567294699'
      OUT: /tmp/p01-v2370-formal-artifacts
      EVID: /tmp/p01-v2370-formal-evidence
      UPGRADE: /tmp/p01-v2370-formal-upgrade
    steps:
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: release/p01-v2365-candidate-20260902
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 71c0ddf946974a6d6ac75bc629ffc07256eb9e4f
          path: template
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.FORMAL }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: formal
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.36.5
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: production
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: agent/p01-22121-formal-artifact-gate-20260819
          path: proven
      - name: Verify prior release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$CANDIDATE_GATE --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$FORMAL_BIND_GATE --jq .conclusion)" = success
          art=$(gh api repos/llhzx2018/core-free-runner-public/actions/artifacts/$CANDIDATE_ARTIFACT)
          test "$(jq -r .workflow_run.id <<<"$art")" = "$CANDIDATE_GATE"
          test "$(jq -r .digest <<<"$art")" = "sha256:$CANDIDATE_DIGEST"
          printf 'STAGE_R1=HARNESS_ONLY_WORKFLOW_REGISTRATION\nSTAGE_R2=HARNESS_ONLY_UNTRACKED_DIFF\nSTAGE_R3=PASS\nCANDIDATE_READINESS=PASS\nFORMAL_BIND=PASS\n' | tee /tmp/p01-v2370-prior-evidence.txt
      - name: Generate fenced formal gates
        run: python3 runner/scripts/p01_v2370_formal_gate_generate.py
      - name: Exact formal fence
        run: bash /tmp/p01-v2370-formal-generated/01-exact.sh
      - name: Build deterministic formal release artifacts
        run: bash /tmp/p01-v2370-formal-generated/02-build.sh
      - name: Verify frozen Formal artifact identity
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-v2370-formal-full-check; mkdir -p /tmp/p01-v2370-formal-full-check
          unzip -qq "$OUT/VF-Start-V2.37.0-FULL.zip" -d /tmp/p01-v2370-formal-full-check
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('/tmp/p01-v2370-formal-full-check')
          m=json.loads((root/'release-manifest.json').read_text())
          expected={'project_id':'P01','version':'2.37.0','source_version':'2.36.5','schema_version':'2026082901','source_schema_version':'2026082901','release_type':'formal','stage':'FORMAL_ARTIFACT_GATE','deployable':True,'release_authorized':True,'formal_source_commit':'5172a497f7a2c9065880ae0d1257a15469917621','formal_source_tree':'eac2a8c76c49925bffbca9c23314ef90aec6f3bd','runtime_source_tree':'057fbba8822950f163aa322d99b889ed3ab24842','production_source_commit':'ef86eba16aec71c1d0dabc16ad23089a78ee5057','production_source_tree':'926504354eaf4354e852e78b19c0fde69513a133','production_runtime_tree':'a7f472ec1f449ada1152d271f2723c52e7b58144','candidate_gate':33567195059,'candidate_artifact':9823578793,'candidate_digest':'sha256:aad7d03454c9063ee72c48e5158653a9494e8caa7f2f8d378044545da464edcb','schema_change':False,'runtime_data_included':False}
          for k,v in expected.items():
              if m.get(k)!=v: raise SystemExit(f'manifest drift {k}: {m.get(k)!r}')
          if m.get('schema_migrations')!=[]: raise SystemExit('unexpected migration')
          b=m.get('atomic_runtime_boundary') or {}
          if sorted(b.get('added_files') or [])!=['quick-save.php'] or b.get('removed_files'): raise SystemExit('runtime add/remove drift '+json.dumps(b))
          if len(b.get('changed_files') or [])!=29: raise SystemExit('changed file count drift '+json.dumps(b))
          runtime=m.get('runtime_files') or {}
          if not runtime: raise SystemExit('runtime_files empty')
          for rel,want_hash in runtime.items():
              pkg=root/rel; src=pathlib.Path('formal/src')/rel
              if not pkg.is_file() or not src.is_file(): raise SystemExit('runtime file missing '+rel)
              if hashlib.sha256(pkg.read_bytes()).hexdigest()!=want_hash: raise SystemExit('package hash mismatch '+rel)
              if hashlib.sha256(src.read_bytes()).hexdigest()!=want_hash: raise SystemExit('source identity mismatch '+rel)
          gate=json.loads(pathlib.Path('/tmp/p01-v2370-formal-artifacts/P01-V2.37.0-ARTIFACT-GATE.json').read_text())
          if gate.get('status')!='FORMAL_ARTIFACT_GATE_PASS': raise SystemExit('gate status drift '+repr(gate.get('status')))
          print('FORMAL_RUNTIME_PAYLOAD_EXACT=PASS')
          print('FORMAL_MANIFEST_IDENTITY=PASS')
          PY
          grep -F "public const SOURCE_VERSION='2.36.5';" "$OUT/repair-v2.37.0.php" >/dev/null
          grep -F "public const TARGET_VERSION='2.37.0';" "$OUT/repair-v2.37.0.php" >/dev/null
          grep -F "public const TARGET_SCHEMA='2026082901';" "$OUT/repair-v2.37.0.php" >/dev/null
          printf 'FULL_BYTES=%s\nFULL_SHA=%s\nUPDATE_BYTES=%s\nUPDATE_SHA=%s\nREPAIR_BYTES=%s\nREPAIR_SHA=%s\n' "$(stat -c%s "$OUT/VF-Start-V2.37.0-FULL.zip")" "$(sha256sum "$OUT/VF-Start-V2.37.0-FULL.zip"|awk '{print $1}')" "$(stat -c%s "$OUT/VF_Start_V2.37.0_UPDATE.zip")" "$(sha256sum "$OUT/VF_Start_V2.37.0_UPDATE.zip"|awk '{print $1}')" "$(stat -c%s "$OUT/repair-v2.37.0.php")" "$(sha256sum "$OUT/repair-v2.37.0.php"|awk '{print $1}')" | tee "$EVID/formal-hashes.txt"
      - name: Actual formal V2.36.5 to V2.37.0 upgrade
        run: bash /tmp/p01-v2370-formal-generated/03-atomic.sh
      - name: Final formal verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          printf 'P01_V2370_FORMAL_ARTIFACT_GATE=PASS\nFORMAL=%s\nTREE=%s\nRUNTIME_TREE=%s\nSCHEMA=%s\nMIGRATION=NONE\nCANDIDATE_GATE=%s/PASS\nFORMAL_BIND_GATE=%s/PASS\nFORMAL_DETERMINISTIC=PASS\nFORMAL_RUNTIME_PAYLOAD_EXACT=PASS\nATOMIC_2365_TO_2370=PASS\nOWNER_PRODUCTION_WRITE=NO\n' "$FORMAL" "$FORMAL_TREE" "$FORMAL_RUNTIME_TREE" "$SCHEMA" "$CANDIDATE_GATE" "$FORMAL_BIND_GATE" | tee "$EVID/verdict.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-v2370-formal-artifacts-${{ github.run_id }}
          path: |
            /tmp/p01-v2370-formal-artifacts
            /tmp/p01-v2370-formal-evidence
            /tmp/p01-v2370-prior-evidence.txt
          if-no-files-found: error
          retention-days: 90
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/p01-v2370-formal.pid 2>/dev/null)" 2>/dev/null || true
