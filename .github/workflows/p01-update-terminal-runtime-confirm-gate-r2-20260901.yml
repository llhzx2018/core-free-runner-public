name: P01 Update Terminal Runtime Confirm Gate R2
on:
  push:
    branches: [release/p01-v2364-candidate-20260901]
    paths: [.github/workflows/p01-update-terminal-runtime-confirm-gate-r2-20260901.yml]
permissions:
  contents: read
  actions: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEVELOP: 4a608669d1ee7457aca645f561f57d883e51d749
      CANDIDATE: 2f6b290c1bc86b3d961ef48d17e844cd269242db
      R1_RUN: '33528294725'
      EVID: /tmp/p01-update-terminal-runtime-confirm-r2
    steps:
      - name: R1 harness classification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$R1_RUN --jq .conclusion)" = failure
      - name: Checkout exact gate harness R2
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: gatehelper
      - name: Checkout exact P01 candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.CANDIDATE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01
      - name: Exact source and one-file fence
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          rm -rf "$EVID" && mkdir -p "$EVID"
          cd p01
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git rev-parse HEAD^)" = "$DEVELOP"
          test "$(gh api repos/llhzx2018/vf-start/branches/develop --jq .commit.sha)" = "$DEVELOP"
          test "$(git diff --name-only "$DEVELOP..$CANDIDATE")" = 'src/assets/update-core.js'
          git diff --check "$DEVELOP..$CANDIDATE"
          node --check src/assets/update-core.js
          git diff --stat "$DEVELOP..$CANDIDATE" | tee "$EVID/diff-stat.txt"
          git diff "$DEVELOP..$CANDIDATE" -- src/assets/update-core.js > "$EVID/update-core.diff"
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check --quiet playwright==1.55.0
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v google-chrome-stable >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1; then python -m playwright install chromium; fi
      - name: Stale runtime then confirmed runtime browser gate R2
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile gatehelper/.github/scripts/p01_update_terminal_runtime_confirm_gate_r2.py
          python gatehelper/.github/scripts/p01_update_terminal_runtime_confirm_gate_r2.py | tee "$EVID/browser.txt"
          grep -Fx P01_UPDATE_TERMINAL_RUNTIME_CONFIRM=PASS "$EVID/browser.txt"
          grep -Fx NO_RELOAD_WHILE_RUNTIME_STALE=PASS "$EVID/verdict.txt"
          grep -Fx AUTO_RELOAD_AFTER_RUNTIME_CONFIRM=PASS "$EVID/verdict.txt"
          grep -Fx TERMINAL_CURRENT_LATEST_FOOTER=PASS "$EVID/verdict.txt"
          grep -Fx MANUAL_REFRESH_REQUIRED=NO "$EVID/verdict.txt"
      - name: Verdict
        run: |
          printf 'P01_UPDATE_TERMINAL_GATE_R2=PASS\nPRODUCT=%s\nBASE_DEVELOP=%s\nSCOPE=src/assets/update-core.js\nSIMULATED_STALE_RUNTIME=PASS\nNO_RELOAD_WHILE_STALE=PASS\nAUTO_RELOAD_AFTER_CONFIRM=PASS\nMANUAL_REFRESH_REQUIRED=NO\nR1=HARNESS_ONLY_BROWSER_EXECUTABLE_SELECTION\nSCHEMA_CHANGE=NO\nMIGRATION=NO\nMAIN_WRITE=NO\nPRODUCTION_WRITE=NO\nRUNNER_MAIN_WRITE=NO\n' "$CANDIDATE" "$DEVELOP" | tee "$EVID/final-verdict.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-update-terminal-runtime-confirm-r2-${{ github.run_id }}
          path: /tmp/p01-update-terminal-runtime-confirm-r2
          if-no-files-found: error
          retention-days: 90
