name: P01 V2.28 Final Develop Closure
on:
  push:
    branches: [task/p01-v2280-final-develop-closure-20260829]
    paths:
      - .github/workflows/p01-v2280-final-develop-closure-20260829.yml
permissions:
  contents: read
jobs:
  closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FINAL: 21f5da3dde9899010c7617ff8fcdedd545b7fcbd
      FINAL_TREE: 3ca0984c59ec91d4a6735765b89309852a4753eb
      CANDIDATE: 85e450ef146987fd6a950fd948ad58e81f5d3c95
      CANDIDATE_TREE: d7238aec239fd8288ba47eb382ea65340f570e96
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.FINAL }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: final
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.CANDIDATE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: candidate
      - name: Exact develop authority closure
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C final rev-parse HEAD)" = "$FINAL"
          test "$(git -C final rev-parse HEAD^{tree})" = "$FINAL_TREE"
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test "$(tr -d '\r\n' < final/VERSION)" = '2.28.0'
          test "$(tr -d '\r\n' < final/src/VERSION.txt)" = '2.28.0'
          grep -Fx "define('VF_VERSION', '2.28.0');" final/src/app/bootstrap.php >/dev/null
          test "$(git -C final rev-parse HEAD:src)" = "$(git -C candidate rev-parse HEAD:src)"
          cmp -s final/VERSION candidate/VERSION
          cmp -s final/CHANGELOG.md candidate/CHANGELOG.md
          git -C final diff --name-only "$CANDIDATE"..HEAD | sort >/tmp/p01-v228-final-docs.txt
          printf 'docs/authority/CURRENT.md\ndocs/evidence/P01_V2.28.0_CANDIDATE_READINESS_20260829.md\n' >/tmp/p01-v228-final-docs-expected.txt
          diff -u /tmp/p01-v228-final-docs-expected.txt /tmp/p01-v228-final-docs.txt
          ! git -C final diff --name-only "$CANDIDATE"..HEAD -- database/migrations | grep .
          grep -F 'V2.28.0 READY_FOR_L3_RELEASE_GATE' final/docs/authority/CURRENT.md >/dev/null
          grep -F 'V2.28.0 READY_FOR_L3_RELEASE_GATE: YES' final/docs/authority/CURRENT.md >/dev/null
          grep -F 'Full Candidate Readiness Gate: 33189868468 / PASS' final/docs/authority/CURRENT.md >/dev/null
          grep -F 'Status: `PASS / READY_FOR_L3_RELEASE_GATE`' final/docs/evidence/P01_V2.28.0_CANDIDATE_READINESS_20260829.md >/dev/null
          grep -F 'Public Runner: 33189868468' final/docs/evidence/P01_V2.28.0_CANDIDATE_READINESS_20260829.md >/dev/null
          grep -F 'Formal Release: NOT STARTED' final/docs/evidence/P01_V2.28.0_CANDIDATE_READINESS_20260829.md >/dev/null
          grep -F 'Production Upgrade: NOT STARTED' final/docs/evidence/P01_V2.28.0_CANDIDATE_READINESS_20260829.md >/dev/null
          echo P01_V228_FINAL_DEVELOP_EXACT=PASS
          echo P01_V228_FINAL_DEVELOP_RUNTIME_EQ_CANDIDATE=YES
          echo P01_V228_READY_FOR_L3_RELEASE_GATE=YES
          echo MAIN_WRITE=NO
          echo PRODUCTION_WRITE=NO
