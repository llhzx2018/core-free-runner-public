name: P08 R111 SQL write fence real MySQL 8.4 and MariaDB 11.8
on:
  pull_request:
    paths:
      - .github/workflows/p08-r111-three-engine-write-fence.yml
permissions:
  contents: read
jobs:
  offline-updater-bridge:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 39
    strategy:
      fail-fast: false
      matrix:
        include:
          - {driver: mysql, image: 'mysql:8.4', health: 'mysqladmin ping -h 127.0.0.1 -uroot -pR106SyntheticRootOnly --silent'}
          - {driver: mariadb, image: 'mariadb:11.8', health: 'healthcheck.sh --connect --innodb_initialized'}
    services:
      sql:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: R106SyntheticRootOnly
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=10s --health-timeout=5s --health-retries=24
    env:
      GITHUB_ACTIONS: "true"
      P08_ISOLATED_INSTALL_TEST: "YES"
      P08_R105_DISPOSABLE: "YES"
      P08_R105_REAL_FULL_ISOLATED: "YES"
      P08_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      P08_R110_NATIVE_DRIVER: ${{ matrix.driver }}
      P08_R111_ISOLATED: "YES"
      P08_R111_DB_DRIVER: ${{ matrix.driver }}
    steps:
      - name: Exact P08 source temporary private checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 006fb4ee8d743c1ab876c27baf3868e770899da8
          path: p08-private
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Actual current shared delivery structural standard temporary checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 64c8a874210f2fa89fee07c7283ffce2bbe6b36c
          path: gov-current
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: PHP 8.4 and Composer for real independently built 0.1.2 updater bridge
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mbstring, zip, sqlite3, pdo_sqlite, pdo_mysql, fileinfo, curl
          tools: composer:v2
      - name: Node 22 for locked current-page update feature assets
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup native real SQL fixture and source syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C p08-private rev-parse HEAD)" = 006fb4ee8d743c1ab876c27baf3868e770899da8
          php -l p08-private/tests/compatibility/r110_issued012_app_local_native_sql.php >/dev/null
          sudo apt-get update -qq > "$RUNNER_TEMP/r110-native-client.log" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mariadb-client >> "$RUNNER_TEMP/r110-native-client.log" 2>&1
          export MYSQL_PWD=R106SyntheticRootOnly
          mariadb --no-defaults -h 127.0.0.1 -P3306 -uroot \
            -e "CREATE DATABASE p08_r110_src_$P08_R110_NATIVE_DRIVER; CREATE DATABASE p08_r110_empty_$P08_R110_NATIVE_DRIVER; CREATE USER 'p08_fixture'@'%' IDENTIFIED BY 'R110SyntheticOnlyNoProduction'; GRANT ALL PRIVILEGES ON p08_r110_src_$P08_R110_NATIVE_DRIVER.* TO 'p08_fixture'@'%'; GRANT ALL PRIVILEGES ON p08_r110_empty_$P08_R110_NATIVE_DRIVER.* TO 'p08_fixture'@'%';"
          unset MYSQL_PWD

          export MYSQL_PWD=R106SyntheticRootOnly
          mariadb --no-defaults -h 127.0.0.1 -P3306 -uroot -e "
            CREATE DATABASE p08_r111_synthetic_$P08_R111_DB_DRIVER;
            CREATE USER 'p08_r111_synthetic'@'%' IDENTIFIED BY 'R111SyntheticOnlyNoProduction';
            GRANT ALL PRIVILEGES ON p08_r111_synthetic_$P08_R111_DB_DRIVER.* TO 'p08_r111_synthetic'@'%';
            CREATE USER 'p08_r111_no_lock'@'%' IDENTIFIED BY 'R111SyntheticNoLockOnly';
            GRANT SELECT ON p08_r111_synthetic_$P08_R111_DB_DRIVER.* TO 'p08_r111_no_lock'@'%';
            CREATE TABLE p08_r111_synthetic_$P08_R111_DB_DRIVER.r111_changes (id BIGINT PRIMARY KEY AUTO_INCREMENT, marker VARCHAR(40) NOT NULL);
            CREATE TABLE p08_r111_synthetic_$P08_R111_DB_DRIVER.r111_aux (id BIGINT PRIMARY KEY AUTO_INCREMENT, marker VARCHAR(40) NOT NULL);
            INSERT INTO p08_r111_synthetic_$P08_R111_DB_DRIVER.r111_changes (marker) VALUES ('before');
          "
          unset MYSQL_PWD
          export MYSQL_PWD=R106SyntheticRootOnly
          mariadb --no-defaults -h 127.0.0.1 -P3306 -uroot \
            -e "CREATE TABLE p08_r110_src_$P08_R110_NATIVE_DRIVER.r111_fixture_second (id INTEGER PRIMARY KEY, marker VARCHAR(40));"
          unset MYSQL_PWD
          php -l p08-private/src/Upgrade/R111NativeDatabaseWriteFence.php
          php -l p08-private/tests/compatibility/r111_native_mysql_mariadb_write_fence.php
          php p08-private/tests/compatibility/r111_native_mysql_mariadb_write_fence.php
          echo "R111_NATIVE_${P08_R111_DB_DRIVER}_GET_WRITE_FENCE=PASS"
          echo R110_NATIVE_REAL_SQL_AND_CLIENT_READY=PASS
      - name: Canonical P08 same-version updater FULL from exact private SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          mkdir -m 0700 "$RUNNER_TEMP/r110-native-build"
          git -C p08-private archive HEAD | tar -x -C "$RUNNER_TEMP/r110-native-build"
          cd "$RUNNER_TEMP/r110-native-build"
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress > "$RUNNER_TEMP/r110-native-composer.log" 2>&1 || {
            echo R110_NATIVE_COMPOSER=FAIL; exit 1;
          }
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/r110-native-node.log" 2>&1 || {
            echo R110_NATIVE_NPM=FAIL; exit 1;
          }
          npm run build >> "$RUNNER_TEMP/r110-native-node.log" 2>&1 || {
            echo R110_NATIVE_VITE=FAIL; exit 1;
          }
          cd "$GITHUB_WORKSPACE"
          python3 -B - <<'PY' > "$RUNNER_TEMP/r110-native-build.log" 2>&1 || {
          import os,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('p08-private/scripts').resolve()))
          from build_full import write_full,verify_canonical_full_contract
          sha='006fb4ee8d743c1ab876c27baf3868e770899da8'
          source=Path('p08-private').resolve()
          runtime=Path(os.environ['RUNNER_TEMP'])/'r110-native-build'
          zipfile=Path(os.environ['RUNNER_TEMP'])/'r110-native-bridge.zip'
          gov=Path('gov-current').resolve()
          verify_canonical_full_contract(source,zipfile,sha,gov,'resolve')
          write_full(runtime,zipfile,'0.1.2',sha)
          verify_canonical_full_contract(source,zipfile,sha,gov,'delivery')
          PY
            echo R110_NATIVE_CANONICAL_FULL=FAIL; exit 1;
          }
          bridge="$RUNNER_TEMP/p08-r110-native-bridge-$P08_R110_NATIVE_DRIVER-ready"
          mkdir -m 0700 "$bridge"
          unzip -q "$RUNNER_TEMP/r110-native-bridge.zip" -d "$bridge"
          echo R110_NATIVE_EXACT_SOURCE_FULL_GATE=PASS
      - name: Official released v0.1.2 to real SQL native backup and empty restore
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          curl --fail --location --silent --show-error --max-time 90 \
            --header "Authorization: Bearer $P08_PRIVATE_READ_TOKEN" \
            --header "Accept: application/octet-stream" \
            https://api.github.com/repos/llhzx2018/vf-adops/releases/assets/747260263 \
            --output "$RUNNER_TEMP/r110-native-old.zip"
          test "$(wc -c < "$RUNNER_TEMP/r110-native-old.zip")" = 10390070
          echo "1b3d7fc3743fb44af12c0b50905a65ea68d47c80f0e1e2ddc5e03c08d534b081  $RUNNER_TEMP/r110-native-old.zip" | sha256sum -c --status
          site="$RUNNER_TEMP/p08-r110-native-$P08_R110_NATIVE_DRIVER-site"
          mkdir -m 0700 "$site"
          unzip -q "$RUNNER_TEMP/r110-native-old.zip" -d "$site"
          if ! php p08-private/tests/compatibility/r110_issued012_app_local_native_sql.php \
            "$site" "$RUNNER_TEMP/p08-r110-native-bridge-$P08_R110_NATIVE_DRIVER-ready" \
            006fb4ee8d743c1ab876c27baf3868e770899da8 \
            > "$RUNNER_TEMP/r110-native-test.log" 2>&1; then
              grep -E '^R110_NATIVE_FAILURE=' "$RUNNER_TEMP/r110-native-test.log" | tail -1 || true
              echo R110_NATIVE_DB_INTEGRATION=FAIL; exit 1;
          fi
          grep -Fxq "R110_REAL_NATIVE_$P08_R110_NATIVE_DRIVER"_ISSUED_012_TO_APP_GATEWAY_BACKUP_RESTORE=PASS "$RUNNER_TEMP/r110-native-test.log"
          echo "R110_NATIVE_$P08_R110_NATIVE_DRIVER"_OFFICIAL_012_APP_FIRST_UPGRADE=PASS
      - name: Always purge private transient source and SQL fixtures
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- p08-private gov-current "$RUNNER_TEMP/r110-native-build" \
            "$RUNNER_TEMP/p08-r110-native-bridge-$P08_R110_NATIVE_DRIVER-ready" \
            "$RUNNER_TEMP/p08-r110-native-$P08_R110_NATIVE_DRIVER-site"
          rm -f -- "$RUNNER_TEMP"/r110-native-*.zip "$RUNNER_TEMP"/r110-native-*.log
          echo R110_NATIVE_PRIVATE_TEMP_PURGED=YES
