name: TEMP P08 R43 genuine Owner shadow DDL and dedicated-account fence joined
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p08-r43-native-shadow-fence-joined-20261124.yml'
permissions:
  contents: read
concurrency:
  group: p08-r43-schema-archive-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  TARGET_REPO: llhzx2018/vf-adops
  TARGET_VERSION: '0.1.18'
  TARGET_SHA: 3fe0acb3eed6bf8171246bb82e5e963c0e292345
  BRIDGE_VERSION: '0.1.17'
  BRIDGE_SHA: 0d5622c3f583cf83f21aea824247428e3a16cb9c
jobs:
  identity-preflight:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/p08-r43-native-shadow-fence-joined-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 scripts/ephemeral_lane_spec.py audit-rendered --spec specs/ephemeral/p08-r43-native-shadow-fence-joined-20261124.json --input .github/workflows/temp-p08-r43-native-shadow-fence-joined-20261124.yml
  native-shadow-fence-join:
    needs: identity-preflight
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/p08-r43-native-shadow-fence-joined-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        engine: [mysql, mariadb]
    services:
      db:
        image: ${{ matrix.engine == 'mysql' && 'mysql:8.4' || 'mariadb:11.8' }}
        env:
          MYSQL_ROOT_PASSWORD: isolated-p08-r43-native-db
          MYSQL_ROOT_HOST: '%'
          MARIADB_ROOT_PASSWORD: isolated-p08-r43-native-db
          MARIADB_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="sh -c 'mariadb-admin ping --silent || mysqladmin ping --silent'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=25
    env:
      GITHUB_ACTIONS: 'true'
      P08_ISOLATED_INSTALL_TEST: 'YES'
      P08_R43_DISPOSABLE_SCHEMA: 'YES'
      P08_R43_NATIVE_ENGINE: ${{ matrix.engine }}
      P08_R43_NATIVE_DB_PASSWORD: isolated-p08-r43-native-db
      P08_R43_NATIVE_SITE_ACCOUNT: p08_r43_site_guarded
      P08_R43_NATIVE_SITE_ACCOUNT_PASSWORD: R43_disposable_guarded_20261124_only
      P08_R43_SHADOW_SCENARIO: guarded
    steps:
      - name: Checkout exact v017 bridge candidate (private transient checkout)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.BRIDGE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-p08-bridge
      - name: Checkout exact v018 integrated target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-p08-target
      - name: Checkout current GOV-doc delivery contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: gov-proof
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_mysql, pdo_sqlite, sqlite3, zip, mbstring, intl, bcmath, dom, fileinfo, posix
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native SQL backup client on disposable runner
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          if command -v mysqldump >/dev/null && command -v mysql >/dev/null; then
            echo P08_R43_NATIVE_PREINSTALLED_MYSQL_CLIENT=PASS
          elif command -v mariadb-dump >/dev/null && command -v mariadb >/dev/null; then
            echo P08_R43_NATIVE_PREINSTALLED_MARIADB_CLIENT=PASS
          else
            timeout 75s sudo apt-get -o Acquire::Retries=0 update -qq > "$RUNNER_TEMP/p08-r43-apt.log" 2>&1 || { echo P08_R43_NATIVE_CLIENT_APT_NETWORK=BLOCKED; exit 1; }
            timeout 85s sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mariadb-client >> "$RUNNER_TEMP/p08-r43-apt.log" 2>&1 || { echo P08_R43_NATIVE_CLIENT_INSTALL=FAIL; exit 1; }
          fi
          (command -v mariadb-dump || command -v mysqldump) >/dev/null || { echo P08_R43_NATIVE_DUMP_CLIENT_MISSING; exit 1; }
          (command -v mariadb || command -v mysql) >/dev/null || { echo P08_R43_NATIVE_RESTORE_CLIENT_MISSING; exit 1; }
          echo P08_R43_NATIVE_BACKUP_CLIENT_PRESENT=PASS
      - name: Exact source, vendor and Vite build + real source-locked dev Clean FULL archives
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C private-p08-bridge rev-parse HEAD)" = "$BRIDGE_SHA"
          test "$(git -C private-p08-target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(cat private-p08-bridge/VERSION)" = "$BRIDGE_VERSION"
          test "$(cat private-p08-target/VERSION)" = "$TARGET_VERSION"
          php -l private-p08-bridge/tests/compatibility/r43_isolated_installed_native_transaction.php > "$RUNNER_TEMP/p08-r43-native-lint.log" 2>&1 || { echo P08_R43_NATIVE_DRIVER_TEST_SYNTAX=FAIL; exit 1; }
          php -l private-p08-bridge/src/Upgrade/R43IsolatedSchemaTransaction.php >> "$RUNNER_TEMP/p08-r43-native-lint.log" 2>&1 || { echo P08_R43_NATIVE_TRANSACTION_SYNTAX=FAIL; exit 1; }
          for d in private-p08-bridge private-p08-target; do
            mkdir -p "$d/bootstrap/cache" "$d/storage/framework/cache/data" "$d/storage/framework/sessions" "$d/storage/framework/views" "$d/storage/logs"
            (cd "$d" && composer install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/p08-r43-$d-composer.log" 2>&1) || { echo P08_R43_NATIVE_LOCKED_COMPOSER=FAIL; exit 1; }
            (cd "$d" && npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-r43-$d-npm.log" 2>&1 && npm run build > "$RUNNER_TEMP/p08-r43-$d-vite.log" 2>&1) || { echo P08_R43_NATIVE_LOCKED_VITE=FAIL; exit 1; }
          done
          python3 private-p08-bridge/scripts/build_full.py --source private-p08-bridge --output "$RUNNER_TEMP/p08-r43-bridge.zip" --version "$BRIDGE_VERSION" --source-sha "$BRIDGE_SHA" --governance-root gov-proof > "$RUNNER_TEMP/p08-r43-bridge-builder.log" 2>&1 || { echo P08_R43_NATIVE_BRIDGE_FULL=FAIL; exit 1; }
          python3 private-p08-target/scripts/build_full.py --source private-p08-target --output "$RUNNER_TEMP/p08-r43-target.zip" --version "$TARGET_VERSION" --source-sha "$TARGET_SHA" --governance-root gov-proof > "$RUNNER_TEMP/p08-r43-target-builder.log" 2>&1 || { echo P08_R43_NATIVE_TARGET_FULL=FAIL; exit 1; }
          mkdir -m 700 "$RUNNER_TEMP/p08-r43-target-extract"
          unzip -q "$RUNNER_TEMP/p08-r43-target.zip" -d "$RUNNER_TEMP/p08-r43-target-extract"
          echo P08_R43_NATIVE_TWO_CANONICAL_DEV_FULLS=PASS
      - name: Parse exact native handoff source and create 3 disposable databases with two accounts
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          for f in src/Upgrade/R43NativeShadowSchemaStage.php src/Upgrade/R43NativeShadowFenceHandoffDrill.php tests/compatibility/r43_native_shadow_fence_handoff_drill.php tests/compatibility/r43_isolated_installed_native_transaction.php; do
            php -l "private-p08-bridge/$f" >> "$RUNNER_TEMP/p08-r43-join-lint.log" 2>&1 || { echo P08_R43_JOINED_PHP84_SYNTAX=FAIL; exit 1; }
          done
          site="$RUNNER_TEMP/p08-r43-site-$P08_R43_NATIVE_ENGINE-guarded"
          mkdir -m 700 "$site"
          unzip -q "$RUNNER_TEMP/p08-r43-bridge.zip" -d "$site"
          t="private-p08-bridge/tests/compatibility/r43_native_shadow_fence_handoff_drill.php"
          php "$t" prepare-native "$site" "$RUNNER_TEMP/p08-r43-target-extract" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/p08-r43-join-create.log" 2>&1 || { echo P08_R43_JOINED_DB_ACCOUNT_CREATE=FAIL; exit 1; }
          grep -qx 'P08_R43_JOINED_SYNTHETIC_DEDICATED_ACCOUNT_SETUP=PASS' "$RUNNER_TEMP/p08-r43-join-create.log"
          grep -qx 'P08_R43_JOINED_APP_PRINCIPAL_CANNOT_CONNECT_TO_OTHER_TENANT=PASS' "$RUNNER_TEMP/p08-r43-join-create.log"
          echo "P08_R43_JOINED_NATIVE_PRINCIPAL_AND_THREE_DB_FIXTURE=PASS engine=$P08_R43_NATIVE_ENGINE"
      - name: Genuine v017 Owner FULL with dedicated nonadmin DB user, Token and nonempty business
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          site="$RUNNER_TEMP/p08-r43-site-$P08_R43_NATIVE_ENGINE-guarded"
          php private-p08-bridge/tests/compatibility/r43_isolated_installed_native_transaction.php setup "$site" "$RUNNER_TEMP/p08-r43-target-extract" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/p08-r43-join-owner.log" 2>&1 || { echo P08_R43_JOINED_NATIVE_OWNER_INSTALL=FAIL; exit 1; }
          grep -qx 'P08_R43_NATIVE_REAL_FULL_017_OWNER_FIRST_INSTALL=PASS' "$RUNNER_TEMP/p08-r43-join-owner.log"
          grep -qx 'P08_R43_NATIVE_NONEMPTY_LANDING_ASSET_AUTOMATION_SEEDED=PASS' "$RUNNER_TEMP/p08-r43-join-owner.log"
          grep -qx 'DB_USERNAME="p08_r43_site_guarded"' "$site/.env"
          echo "P08_R43_JOINED_REAL_OWNER_SITE_DEDICATED_ACCOUNT=PASS engine=$P08_R43_NATIVE_ENGINE"
      - name: Restore native source backup only into empty shadow, run six real Laravel DDL, fence app account
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          t="private-p08-bridge/tests/compatibility/r43_native_shadow_fence_handoff_drill.php"
          site="$RUNNER_TEMP/p08-r43-site-$P08_R43_NATIVE_ENGINE-guarded"
          if ! php "$t" stage "$site" "$RUNNER_TEMP/p08-r43-target-extract" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/p08-r43-join-stage.log" 2>&1; then
            echo P08_R43_JOINED_SHADOW_STAGE=FAIL
            code="$(grep -oE 'R43_[A-Z][A-Z0-9_]+' "$RUNNER_TEMP/p08-r43-join-stage.log" | tail -1 || true)"
            if [[ "$code" =~ ^R43_[A-Z][A-Z0-9_]+$ ]]; then echo "P08_R43_JOINED_SAFE_REASON=$code"; else echo P08_R43_JOINED_SAFE_REASON=UNCLASSIFIED; fi
            exit 1
          fi
          grep -qx 'P08_R43_JOINED_REAL_OWNER_SOURCE_BACKUP_RESTORE_SIX_DDL_ONLY_ON_SHADOW=PASS' "$RUNNER_TEMP/p08-r43-join-stage.log"
          if ! php "$t" fence "$site" "$RUNNER_TEMP/p08-r43-target-extract" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/p08-r43-join-fence.log" 2>&1; then
            echo P08_R43_JOINED_ACCOUNT_FENCE_OR_PARITY=FAIL
            grep -E '^P08_R43_JOINED_[A-Z0-9_]+=PASS$' "$RUNNER_TEMP/p08-r43-join-fence.log" | tail -18 || true
            code="$(grep -oE 'R43_[A-Z][A-Z0-9_]+' "$RUNNER_TEMP/p08-r43-join-fence.log" | tail -1 || true)"
            if [[ "$code" =~ ^R43_[A-Z][A-Z0-9_]+$ ]]; then echo "P08_R43_JOINED_SAFE_REASON=$code"; else echo P08_R43_JOINED_SAFE_REASON=UNCLASSIFIED; fi
            exit 1
          fi
          grep -qx 'P08_R43_JOINED_DEDICATED_ACCOUNT_FENCED_OLD_AND_NEW_DATA_PARITY=PASS' "$RUNNER_TEMP/p08-r43-join-fence.log"
          grep -qx 'P08_R43_JOINED_ACCOUNT_LOCK_ALONE_INSUFFICIENT=PASS' "$RUNNER_TEMP/p08-r43-join-fence.log"
          grep -qx 'P08_R43_JOINED_OTHER_TENANT_WRITABLE_WHILE_SITE_LOCKED=PASS' "$RUNNER_TEMP/p08-r43-join-fence.log"
          echo "P08_R43_JOINED_REAL_SHADOW_AND_DB_ACCOUNT_DRAIN=PASS engine=$P08_R43_NATIVE_ENGINE"
      - name: Real SIGKILL137 between fence and hypothetical cutover, fresh process checks original Owner
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          t="private-p08-bridge/tests/compatibility/r43_native_shadow_fence_handoff_drill.php"
          site="$RUNNER_TEMP/p08-r43-site-$P08_R43_NATIVE_ENGINE-guarded"
          set +e
          php "$t" worker-sigkill "$site" "$RUNNER_TEMP/p08-r43-target-extract" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/p08-r43-join-kill.log" 2>&1
          code=$?
          set -e
          if [[ "$code" != 137 ]]; then echo "P08_R43_JOINED_KILL_EXIT_NOT_137=$code"; exit 1; fi
          grep -qx 'P08_R43_JOINED_WORKER_SIGKILL_WHILE_SITE_ACCOUNT_LOCKED=PASS' "$RUNNER_TEMP/p08-r43-join-kill.log"
          php "$t" audit-after-kill "$site" "$RUNNER_TEMP/p08-r43-target-extract" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/p08-r43-join-fresh.log" 2>&1 || { echo P08_R43_JOINED_FRESH_PROCESS_AUDIT=FAIL; exit 1; }
          grep -qx 'P08_R43_JOINED_INDEPENDENT_POST_SIGKILL_FENCE_PERSISTED_CLONE_AND_OWNER_UNCHANGED=PASS' "$RUNNER_TEMP/p08-r43-join-fresh.log"
          echo "P08_R43_JOINED_POST_SIGKILL_LOCKED_SHADOW_AND_OLD_OWNER_INTACT=PASS engine=$P08_R43_NATIVE_ENGINE"
      - name: Privileged outsider bypasses app account lock and shadow is refused
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          t="private-p08-bridge/tests/compatibility/r43_native_shadow_fence_handoff_drill.php"
          site="$RUNNER_TEMP/p08-r43-site-$P08_R43_NATIVE_ENGINE-guarded"
          php "$t" outside-admin-write "$site" "$RUNNER_TEMP/p08-r43-target-extract" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/p08-r43-join-outsider.log" 2>&1 || { echo P08_R43_JOINED_OUTSIDER_NEGATIVE=FAIL; exit 1; }
          grep -qx 'P08_R43_JOINED_PRIVILEGED_OUTSIDE_WRITER_CAN_BYPASS_ACCOUNT_LOCK=PASS' "$RUNNER_TEMP/p08-r43-join-outsider.log"
          php "$t" audit-stale-refusal "$site" "$RUNNER_TEMP/p08-r43-target-extract" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/p08-r43-join-blocked.log" 2>&1 || { echo P08_R43_JOINED_STALE_SHADOW_NOT_REFUSED; exit 1; }
          grep -qx 'P08_R43_JOINED_INDEPENDENT_PRIVILEGED_WRITER_DIVERGENCE_CUTOVER_REFUSED=PASS' "$RUNNER_TEMP/p08-r43-join-blocked.log"
          php "$t" explicit-test-unlock "$site" "$RUNNER_TEMP/p08-r43-target-extract" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/p08-r43-join-unlock.log" 2>&1 || { echo P08_R43_JOINED_INDEPENDENT_UNLOCK=FAIL; exit 1; }
          grep -qx 'P08_R43_JOINED_EXPLICIT_TEST_ONLY_ACCOUNT_UNLOCK=PASS' "$RUNNER_TEMP/p08-r43-join-unlock.log"
          echo "P08_R43_JOINED_PRIVILEGED_OUTSIDER_WRITE_DETECTED_NO_CUTOVER=PASS engine=$P08_R43_NATIVE_ENGINE"
          echo P08_R43_PRODUCTION_SCHEMA_AND_DB_CUTOVER=BLOCKED
      - name: Delete synthetic database users and workspaces; no public private source persistence
        if: always()
        shell: bash
        run: |
          set +e
          set +x
          status=1
          site="$RUNNER_TEMP/p08-r43-site-$P08_R43_NATIVE_ENGINE-guarded"
          if test -f private-p08-bridge/tests/compatibility/r43_native_shadow_fence_handoff_drill.php && test -d "$site"; then
            php private-p08-bridge/tests/compatibility/r43_native_shadow_fence_handoff_drill.php cleanup-native "$site" "$RUNNER_TEMP/p08-r43-target-extract" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/p08-r43-join-cleanup.log" 2>&1
            status=$?
          fi
          rm -rf -- private-p08-bridge private-p08-target gov-proof
          rm -rf -- "$site" "$RUNNER_TEMP/p08-r43-target-extract"
          rm -f -- "$RUNNER_TEMP"/p08-r43-*.zip "$RUNNER_TEMP"/p08-r43-*.log
          if test "$status" -eq 0 && test ! -e private-p08-bridge && test ! -e private-p08-target && test ! -e "$site"; then
            echo P08_R43_JOINED_TEMP_PRIVATE_SOURCE_DB_USERS_CLEANUP=PASS
          else
            echo P08_R43_JOINED_CLEANUP=FAIL
            exit 1
          fi
