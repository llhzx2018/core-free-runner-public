name: p01-247494-distribution-manifest-proof-temporary
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-247494-distribution-fallback.yml']
permissions:
  contents: read
jobs:
  core-updates-exact-source:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout public safe temporary workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate exact channel PR, canonical update-core tests and real GitHub Release
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          test -n "$READ_TOKEN"
          ROOT="$(mktemp -d /tmp/p01-494-channel.XXXXXXXX)"
          trap 'rm -rf "$ROOT"' EXIT
          git clone -q --depth 1 --branch dist/p01-v247494-native-one-gui \
            "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/core-updates.git" "$ROOT/current"
          git -C "$ROOT/current" remote set-url origin https://github.com/llhzx2018/core-updates.git
          test "$(git -C "$ROOT/current" rev-parse HEAD)" = cec108174ab6f5404546ca4003fb837ad19e18aa
          cd "$ROOT/current"
          python3 scripts/check_manifest_contract.py > "$ROOT/manifest.json"
          python3 - "$ROOT/manifest.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x["status"]=="PASS",x["status"]
          print("P01_494_FULL_MANIFEST_CONTRACT=PASS")
          PY
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php update-core/php/tests/run.php > "$ROOT/php-tests.log" 2>&1 || {
            tail -50 "$ROOT/php-tests.log"; exit 1;
          }
          echo P01_494_UPDATE_CORE_PHP_REGRESSION=PASS
          python3 - <<'PY'
          import json
          d=json.load(open('projects/P01.json'))
          expected=dict(project_id='P01',component_id='APP',enabled=True,
           current_version='2.47.493',target_version='2.47.494',
           update_type='ATOMIC',from_versions=['2.47.493'],schema_from='2026102201',
           schema_to='2026102201',repository='llhzx2018/vf-start',
           release_tag='v2.47.494',release_id=435140084,
           product_identity='f9b71d59ee239be952f8495f2a0cc381e3497a3e',
           asset_name='VF_Start_V2.47.494_UPDATE.zip',asset_bytes=3767883,
           asset_sha256='4f933bad09d247607ef5601636ac1ef9d742ec2eecb91c792393fbebc86311c7',
           backup_required=True,rollback_supported=True)
          for k,v in expected.items():
           assert d.get(k)==v,f'CHANNEL_MISMATCH:{k}'
          assert d['released_at']=='2026-11-05T11:53:01Z'
          print('P01_494_EXACT_FROM_VERSION_SCHEMA_AND_SHA=PASS')
          PY
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.47.494 --jq .object.sha)" = f9b71d59ee239be952f8495f2a0cc381e3497a3e
          gh api repos/llhzx2018/vf-start/releases/tags/v2.47.494 > "$ROOT/release.json"
          python3 - "$ROOT/release.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r["id"]==435140084 and r["tag_name"]=="v2.47.494"
          assert r["draft"]==False and r["prerelease"]==False
          assets={a['name']:a for a in r['assets']}
          a=assets['VF_Start_V2.47.494_UPDATE.zip']
          assert a['size']==3767883 and a['digest']=='sha256:4f933bad09d247607ef5601636ac1ef9d742ec2eecb91c792393fbebc86311c7'
          print('P01_494_EXACT_REMOTE_RELEASE_AND_ASSET=PASS')
          PY
          echo P01_494_CHANNEL_FINAL_MACHINE=PASS
