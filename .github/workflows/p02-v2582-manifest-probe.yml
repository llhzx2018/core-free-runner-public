name: P02 V2.5.82 Manifest Probe

on:
  push:
    branches:
      - run/p02-v2582-owner-ux-r1-20260922
    paths:
      - '.github/workflows/p02-v2582-manifest-probe.yml'

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact P02 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 7dd330a047c18df7a3a35dd230aace042c459456
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Generate candidate manifests
        shell: bash
        working-directory: product
        run: |
          set -Eeuo pipefail
          python3 scripts/generate-source-manifest.py
          sha256sum public/assets/v2537-inkstone-shell.js public/assets/scratch-tabs.js
          stat -c '%n %s' public/assets/v2537-inkstone-shell.js public/assets/scratch-tabs.js
      - name: Upload generated manifests
        uses: actions/upload-artifact@v4
        with:
          name: p02-v2582-generated-manifest
          path: |
            product/SOURCE_MANIFEST.json
            product/SOURCE_MANIFEST.txt
          retention-days: 2
