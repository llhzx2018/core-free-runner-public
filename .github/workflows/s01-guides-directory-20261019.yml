name: S01-C01 Guides directory classification and desktop SEO gate
on:
  push:
    branches: [task/s01-frontend-design-20261017]
    paths: ['.github/workflows/s01-guides-directory-20261019.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: runner
      - name: Copy existing verified WP/Chromium review lane
        run: |
          mkdir -p proof
          cp -a runner/lanes/s01-frontend-design-20261017 lane
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 5eab60b767f6d8cb171c092830023a35e400fa86
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact source scope, canonical CSS and PHP/JS syntax gates
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = 5eab60b767f6d8cb171c092830023a35e400fa86
          test "$(cat target/VERSION)" = 1.35.136
          python3 - <<'PY'
          import pathlib,subprocess
          root=pathlib.Path('target')
          base='17fc8ad501b10346c87f4292bd12dab1d4353c01'
          src='src/assets/css/public/pages/families/public-family-03-content-list-operations-closure.css'
          bundle='src/assets/css/public/vf-theme-public-runtime.css'
          post='src/inc/modules/module-post-list.php'
          changed=subprocess.check_output(['git','-C','target','diff','--name-only',base,'HEAD'],text=True).splitlines()
          assert sorted(changed)==sorted([src,bundle,post]),changed
          before=subprocess.check_output(['git','-C','target','show',base+':'+src],text=True)
          bundle_before=subprocess.check_output(['git','-C','target','show',base+':'+bundle],text=True)
          after=(root/src).read_text()
          bundle_after=(root/bundle).read_text()
          assert bundle_before.count(before)==1
          assert bundle_after==bundle_before.replace(before,after,1)
          assert after.count('S01 Guides directory desktop legibility')==1
          print('GUIDES_SOURCE_SCOPE_AND_ACTIVE_RUNTIME_CSS=PASS')
          PY
          php -l target/src/inc/modules/module-post-list.php
          php -l lane/guide-task-gate.php
          node --check lane/r15-guides-directory.cjs
      - name: Exact provider fixture for tool and content page contracts
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          mkdir -p provider
          gh release download v1.25.91 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.91.zip --dir provider
          echo 'fcb56d605550c5b04a3ff8b3b78b8bf86ca11b77e0aa22334fa67e675b01d6df  provider/vf-tools-m3u8_V1.25.91.zip' | sha256sum -c
      - name: Install Chromium and Chinese typography fixture
        run: |
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -g -fsSL --retry 2 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC[wght].ttf' -o "$HOME/.local/share/fonts/NotoSansSC.ttf"
          fc-cache -f
      - name: Real isolated WordPress MariaDB full regression and Guide gates
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          script=Path('lane/native.sh').read_text()
          seed='docker cp lane/snapshot.php "$WP:/tmp/snapshot.php"'
          assert script.count(seed)==1
          script=script.replace(seed,'docker cp lane/guide-task-gate.php "$WP:/tmp/guide-task-gate.php";cli eval-file /tmp/guide-task-gate.php > proof/guide-task.txt\n'+seed)
          end='cli eval-file /tmp/snapshot.php > proof/state-after.sha256'
          assert script.count(end)==1
          script=script.replace(end,'node lane/r15-guides-directory.cjs\n'+end)
          Path('lane/native-guides.sh').write_text(script)
          PY
          bash lane/native-guides.sh
      - name: Remove transient private Theme and Provider
        if: always()
        run: rm -rf target provider
