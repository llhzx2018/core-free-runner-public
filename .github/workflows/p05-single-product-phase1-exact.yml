name: P05 Single Product Phase1 Exact Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p05-single-product-phase1-exact.yml'

permissions:
  contents: read

jobs:
  gate:
    if: github.event.pull_request.head.ref == 'test/p05-single-product-phase1-exact-20260902'
    runs-on: ubuntu-24.04
    steps:
      - name: Verify private read capability
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo 'P05_SINGLE_PRODUCT_READ_CAPABILITY=PASS'

      - name: Checkout exact Product candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: a9ad68bef4bcbad734513d0896365f3e9f117d84
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 2

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm

      - name: Verify exact source and four-file scope
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 'a9ad68bef4bcbad734513d0896365f3e9f117d84'
          test "$(git rev-parse HEAD^)" = '2518a8c07fc516de714d275327df49359e9e4719'
          test "$(cat VERSION)" = '1.2.3'
          mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 4
          expected=(
            'src/client/CommonSystemCenter.tsx'
            'src/client/ProductApp.tsx'
            'src/client/main.tsx'
            'tests/contract/single-product-shell.test.ts'
          )
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done
          echo 'P05_SINGLE_PRODUCT_EXACT_SCOPE=PASS'

      - name: Install dependencies
        run: npm ci

      - name: Verify canonical single-product runtime
        run: |
          set -Eeuo pipefail
          npm run typecheck
          npm run test:unit
          npm run test:contract
          npm run build
          ! grep -R -F '新版工作区 Preview' dist
          ! grep -R -F '返回经典工作区' dist
          ! grep -R -F 'Product Optimization Preview' dist
          test -n "$(find dist/client/assets -maxdepth 1 -type f -name 'ProductApp-*' -print -quit)"
          test -z "$(find dist/client/assets -maxdepth 1 -type f -name 'ProductWorkspaceShortcut-*' -print -quit)"
          test -z "$(find dist/client/assets -maxdepth 1 -type f -name 'DemoDatasetShortcut-*' -print -quit)"
          grep -R -F '系统维护' dist/client/assets >/dev/null
          grep -R -F '系统与更新' dist/client/assets >/dev/null
          echo 'P05_SINGLE_PRODUCT_RUNTIME=PASS'

      - name: Verify no authority mutation
        run: |
          set -Eeuo pipefail
          test "$(cat VERSION)" = '1.2.3'
          echo 'P05_SINGLE_PRODUCT_RELEASE_WRITE=0'
          echo 'P05_SINGLE_PRODUCT_PRODUCTION_WRITE=0'
          echo 'P05_SINGLE_PRODUCT_EXACT_GATE=PASS'
