name: P02 v2.5.129 exact channel continuity (one-off, no package)
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p02-v25129-channel-continuity-oneoff.yml']
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-library
          ref: 93087ea96114016914b03d87bd387061631d9ea0
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Exact source and 21-source continuity checks only
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = '93087ea96114016914b03d87bd387061631d9ea0'
          test "$(cat product/VERSION)" = '2.5.129'
          test "$(sha256sum product/public/assets/w1/w1-search.js | cut -d' ' -f1)" = 'ccb9029fd07d4e60dbc925119273737053f95ce1a09b358b3c48e616b007ed35'
          test "$(sha256sum product/public/assets/w1/w1-search.css | cut -d' ' -f1)" = 'e8cfe76cfb1c5ade7dce3476919b4f2055b7c45953a5f05dff0bcd9eee87fe6f'
          cd product
          python3 scripts/verify-source-manifest.py
          python3 -m py_compile scripts/build-candidate.py scripts/build-release.py scripts/build-multisource-update.py scripts/build-multisource-repair.py
          node --test tests/unit/p02_release_source_versions_required.test.mjs
          # Read CURRENT public update channel at execution; never commit its
          # dynamic contents as a second project Authority.
          channel="${RUNNER_TEMP}/p02-current-channel.json"
          curl -fsSL https://raw.githubusercontent.com/llhzx2018/core-updates/main/projects/P02.json -o "$channel"
          python3 - "$channel" <<'PY'
          import json,subprocess,sys
          channel=sys.argv[1]
          doc=json.load(open(channel,encoding="utf-8"))
          from_versions=doc["from_versions"]+[doc["target_version"]]
          assert len(from_versions)==len(set(from_versions))==21,"official-source-count-drift"
          cmd=["python3","scripts/verify-release-source-set.py","--channel-json",channel,"--target-version","2.5.129"]
          for v in from_versions: cmd.extend(["--source-version",v])
          subprocess.run(cmd,check=True)
          print("P02_21_SOURCE_SET_OFFICIAL_CHANNEL_MATCH=PASS")
          PY
          bash scripts/verify-repository.sh
          echo P02_V25129_SOURCE_GUARDS_AND_READER_BUNDLE=PASS
          echo P02_V25129_FULL_ATOMIC_BUILT=NO
          echo P02_V25129_21_SOURCE_UPGRADES_PERFORMED=NO
      - name: Cleanup transient private checkout
        if: always()
        shell: bash
        run: |
          rm -rf product
          echo P02_PRIVATE_SOURCE_PERSISTED_IN_PUBLIC_GIT_OR_ARTIFACT=NO
