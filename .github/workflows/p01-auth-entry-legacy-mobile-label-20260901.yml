name: P01 Auth Entry Legacy Mobile Label
on:
  push:
    branches: [temp/p01-auth-entry-fix-20260901]
    paths:
      - .github/workflows/p01-auth-entry-legacy-mobile-label-20260901.yml
      - scripts/p01-auth-entry-legacy-mobile-label.py
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PRODUCT_HEAD: 9b354d5db93b4c81930014331e055611decdbbf8
      PRODUCT_BRANCH: fix/p01-auth-entry-visibility-20260901
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.PRODUCT_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01
      - name: Apply legacy mobile login label
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p01 rev-parse HEAD)" = "$PRODUCT_HEAD"
          P01_ROOT="$GITHUB_WORKSPACE/p01" python3 runner/scripts/p01-auth-entry-legacy-mobile-label.py
          php -l p01/src/index.php >/dev/null
          git -C p01 diff --check
          test "$(git -C p01 diff --name-only)" = src/index.php
          grep -F 'mobileAccountLabel.textContent=auth?' p01/src/index.php >/dev/null
      - name: Commit Product follow-up
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p01
          test "$(git rev-parse HEAD)" = "$PRODUCT_HEAD"
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add src/index.php
          git commit -m 'fix(P01): label mobile public auth entry as login'
          git push origin HEAD:"$PRODUCT_BRANCH"
          echo "P01_AUTH_ENTRY_SOURCE=$(git rev-parse HEAD)"
          echo 'P01_AUTH_ENTRY_LEGACY_MOBILE=PASS'
