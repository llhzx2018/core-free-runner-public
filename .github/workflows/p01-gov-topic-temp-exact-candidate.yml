name: p01-gov-topic-temp-exact-candidate
# One-shot transient proof. This PR is closed without merge.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-gov-topic-temp-exact-candidate.yml'
permissions:
  contents: read
jobs:
  exact-source:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      EXPECT_FEATURE: 51bfdf2e6c9c139fa0a009de73792e5c630ae6a4
      EXPECT_BASE_TAG: v2.47.403
    steps:
      - name: Install PHP test runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd unzip >/dev/null
          php -r 'if (!in_array("sqlite",PDO::getAvailableDrivers(),true)) exit(8);'
          echo P01_PUBLIC_RUNNER_PDO_SQLITE=PASS
      - name: Transient private source resolution
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}"
          gh auth setup-git >/dev/null
          git clone --quiet https://github.com/llhzx2018/vf-start.git candidate
          cd candidate
          echo P01_HEAD_SOURCE_RUNTIME=FORMAL_TAG_PINNED
          git fetch --quiet origin "$EXPECT_FEATURE" "refs/tags/$EXPECT_BASE_TAG:refs/tags/$EXPECT_BASE_TAG"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECT_FEATURE" || test "$(git rev-parse "$EXPECT_FEATURE")" = "$EXPECT_FEATURE"
          test "$(git show "$EXPECT_BASE_TAG:VERSION" | tr -d '\r\n')" = "2.47.403"
          git worktree add --quiet --detach ../stable "$EXPECT_BASE_TAG"
          git checkout -q -B isolated-merge "$EXPECT_BASE_TAG"
          git config user.name 'P01 Isolated Proof'
          git config user.email 'isolated-proof@localhost'
          git merge --quiet --no-ff --no-edit "$EXPECT_FEATURE"
          test "$(cat VERSION | tr -d '\r\n')" = "2.47.403"
          echo P01_V247403_FEATURE_MERGE=PASS
          echo "P01_TEMP_MERGED_TREE=$(git rev-parse HEAD^{tree})"
      - name: Focused true-PDO and HTTP security proof
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          for test in tests/gov_topic_catalog_contract.php tests/gov_topic_local_integrity_contract.php tests/gov_topic_auth_contract.php tests/gov_topic_remote_contract.php tests/gov_topic_source_ref_contract.php tests/gov_topic_asset_route_contract.php tests/gov_topic_preview_contract.php tests/gov_topic_pdo_integration.php; do
            php "$test"
          done
          echo P01_TOPIC_ISOLATED_MACHINE=PASS
      - name: Stable baseline canonical full regression
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          timeout 1800 bash tests/canonical_release_regression.sh . ../stable --require-zero-debt
          echo P01_V247403_CANONICAL_REGRESSION=PASS
      - name: Synthetic next-version FULL and Atomic package smoke
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth=1 https://github.com/llhzx2018/core-free-runner-public.git runner-control
          mkdir -p release-base/full release-base/update candidate-out
          gh release download "$EXPECT_BASE_TAG" -R llhzx2018/vf-start -D release-base -p "VF-Start-V2.47.403-FULL.zip" -p "VF_Start_V2.47.403_UPDATE.zip"
          unzip -q release-base/VF-Start-V2.47.403-FULL.zip -d release-base/full
          unzip -q release-base/VF_Start_V2.47.403_UPDATE.zip -d release-base/update
          cd candidate
          python3 - <<'PY'
          from pathlib import Path
          root=Path('.')
          for path in (root/'VERSION',root/'src/VERSION.txt'):
              assert path.read_text().strip()=='2.47.403'
              path.write_text('2.47.404\n')
          bootstrap=root/'src/app/bootstrap.php'
          raw=bootstrap.read_text()
          old="define('VF_VERSION', '2.47.403');"
          assert raw.count(old)==1
          bootstrap.write_text(raw.replace(old,"define('VF_VERSION', '2.47.404');"))
          PY
          git add VERSION src/VERSION.txt src/app/bootstrap.php
          git commit --quiet -m 'test-only synthetic candidate v2.47.404'
          python3 ../runner-control/scripts/p01-maintenance-release.py \
            --candidate src \
            --baseline-full ../release-base/full \
            --baseline-repair ../release-base/update/repair-v2.47.403.php \
            --out ../candidate-out \
            --version 2.47.404 --source-version 2.47.403 \
            --target-sha "$(git rev-parse HEAD)" --target-tree "$(git rev-parse HEAD^{tree})" >/dev/null
          cd ..
          unzip -t candidate-out/VF-Start-V2.47.404-FULL.zip >/dev/null
          unzip -t candidate-out/VF_Start_V2.47.404_UPDATE.zip >/dev/null
          mkdir -p candidate-update candidate-full
          unzip -q candidate-out/VF_Start_V2.47.404_UPDATE.zip -d candidate-update
          unzip -q candidate-out/VF-Start-V2.47.404-FULL.zip -d candidate-full
          php -l candidate-update/repair-v2.47.404.php >/dev/null
          php candidate-update/repair-v2.47.404.php --self-test | grep -F '"ok":true' >/dev/null
          test "$(cat candidate-full/VERSION.txt)" = "2.47.404"
          echo P01_TOPIC_SYNTHETIC_FULL_ATOMIC_PACKAGE=PASS
      - name: Private GOV-TOPIC Contents permission diagnostic
        shell: bash
        run: |
          set -euo pipefail
          if gh api repos/llhzx2018/gov-topic/contents/distribution/p01/catalog.json >/dev/null 2>&1; then
            echo GOV_TOPIC_PRIVATE_GITHUB_RUNNER_CONTENTS=PASS
          else
            echo GOV_TOPIC_PRIVATE_GITHUB_RUNNER_CONTENTS=NOT_PROVEN
          fi
          echo P01_PRIVATE_SOURCE_PERSISTENCE=NONE
