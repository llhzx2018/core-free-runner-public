name: P05 V1.1.11 Supplemental Atomic Asset Publish

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  publish-atomic-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: 1.1.11
      RELEASE_ID: '379349908'
      RELEASE_SOURCE: 49434d79d861bba206d72daa4476363f1bf8e0d4
      PUBLIC_GATE_RUN: '33328403016'
      PUBLIC_GATE_JOB: '99302512282'
      PUBLIC_GATE_HEAD: 72ea30fedbe71693214d42edee5a0021a4619e25
      ARTIFACT_NAME: P05_V1.1.11_STANDARD_ATOMIC_ARTIFACTS_72ea30fedbe71693214d42edee5a0021a4619e25
      REPAIR_SHA256: 3bd4ace9a5cf51a172038adb8b4acf1a86657dd1d612b2bdb3042274226f1cc3
      UPDATE_SHA256: 82c0a65b7b29729a1be659940af62abd4c02909866590f97e7b5b4b6b6198702
      SELFTEST_SHA256: c78abf51699281a2de8b4b2a4d2aa4c283cf64e422a90275cb2f2e148328bd05
      METADATA_SHA256: a6e8de13de1ccb323c7ff47f9b8ab5c6621aeea34731a944078436573ea46d97
      GATE_SHA256: c3f0fcef5291628f54f3f041d64a5b417ff84b5ca0ce1b005cae57146cf4a543
      REPAIR_BYTES: '2459713'
      UPDATE_BYTES: '847947'
      SELFTEST_BYTES: '389'
      METADATA_BYTES: '1732'
      GATE_BYTES: '515'

    steps:
      - name: Bind proven Public Atomic Gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$PUBLIC_GATE_RUN" > /tmp/run.json
          gh api "repos/llhzx2018/core-free-runner-public/actions/jobs/$PUBLIC_GATE_JOB" > /tmp/job.json
          python3 - <<'PY'
          import json,os
          run=json.load(open('/tmp/run.json'))
          job=json.load(open('/tmp/job.json'))
          assert run['id']==int(os.environ['PUBLIC_GATE_RUN'])
          assert run['head_sha']==os.environ['PUBLIC_GATE_HEAD']
          assert run['status']=='completed' and run['conclusion']=='success'
          assert job['id']==int(os.environ['PUBLIC_GATE_JOB'])
          assert job['run_id']==int(os.environ['PUBLIC_GATE_RUN'])
          assert job['status']=='completed' and job['conclusion']=='success'
          assert job['name']=='p05-v1111-standard-atomic'
          print('P05_PUBLIC_ATOMIC_GATE_BINDING=PASS')
          PY

      - name: Download exact PASS artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p05-atomic-assets
          gh run download "$PUBLIC_GATE_RUN" \
            --repo llhzx2018/core-free-runner-public \
            --name "$ARTIFACT_NAME" \
            --dir /tmp/p05-atomic-assets
          find /tmp/p05-atomic-assets -maxdepth 1 -type f -printf '%f\n' | sort
          test "$(find /tmp/p05-atomic-assets -maxdepth 1 -type f | wc -l)" = 6

      - name: Verify exact Atomic asset contract
        run: |
          set -Eeuo pipefail
          D=/tmp/p05-atomic-assets
          test "$(sha256sum "$D/repair-v1.1.11.php" | awk '{print $1}')" = "$REPAIR_SHA256"
          test "$(sha256sum "$D/VF_SEO_V1.1.11_UPDATE.zip" | awk '{print $1}')" = "$UPDATE_SHA256"
          test "$(sha256sum "$D/atomic-self-test.json" | awk '{print $1}')" = "$SELFTEST_SHA256"
          test "$(sha256sum "$D/P05-V1.1.11-ATOMIC-METADATA.json" | awk '{print $1}')" = "$METADATA_SHA256"
          test "$(sha256sum "$D/P05-V1.1.11-ATOMIC-GATE.json" | awk '{print $1}')" = "$GATE_SHA256"
          test "$(stat -c%s "$D/repair-v1.1.11.php")" = "$REPAIR_BYTES"
          test "$(stat -c%s "$D/VF_SEO_V1.1.11_UPDATE.zip")" = "$UPDATE_BYTES"
          test "$(stat -c%s "$D/atomic-self-test.json")" = "$SELFTEST_BYTES"
          test "$(stat -c%s "$D/P05-V1.1.11-ATOMIC-METADATA.json")" = "$METADATA_BYTES"
          test "$(stat -c%s "$D/P05-V1.1.11-ATOMIC-GATE.json")" = "$GATE_BYTES"
          php -l "$D/repair-v1.1.11.php" >/dev/null
          php "$D/repair-v1.1.11.php" --self-test > /tmp/selftest.json
          jq -e '.ok==true and .source_version=="1.1.10" and .target_version=="1.1.11" and .rollback==true and .interruption_recovery==true and .runtime_pointer_preserved==true and .remote_download_required==false' /tmp/selftest.json >/dev/null
          jq -e '.result=="PASS" and .actual_upgrade=="PASS" and .data_preservation=="PASS" and .idempotence=="PASS" and .rollback=="PASS" and .interruption_recovery=="PASS" and .browser_single_php=="PASS" and .production_write==0' "$D/P05-V1.1.11-ATOMIC-GATE.json" >/dev/null
          test "$(unzip -Z1 "$D/VF_SEO_V1.1.11_UPDATE.zip" | wc -l)" = 1
          unzip -Z1 "$D/VF_SEO_V1.1.11_UPDATE.zip" | grep -Fx repair-v1.1.11.php >/dev/null
          echo 'P05_SUPPLEMENTAL_ATOMIC_ASSET_CONTRACT=PASS'

      - name: Verify existing private v1.1.11 Release boundary
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api "repos/llhzx2018/vf-seo/releases/tags/v$VERSION" > /tmp/release-before.json
          python3 - <<'PY'
          import json,os
          r=json.load(open('/tmp/release-before.json'))
          assert r['id']==int(os.environ['RELEASE_ID'])
          assert r['tag_name']=='v'+os.environ['VERSION']
          assert r['target_commitish']==os.environ['RELEASE_SOURCE']
          assets={a['name']:a for a in r['assets']}
          assert assets['VF_SEO_V1.1.11_FULL.zip']['digest']=='sha256:b24bbbeb997fa6414689a01b32eb70a7bf20c82ffeec8761fea4b69612629ce8'
          assert assets['VF_SEO_V1.1.11_RELEASE_RECEIPT.txt']['digest']=='sha256:d0bb220948f1f05f2034c1ec1c0f984cbd1dbbd07dae45d0b1b44a4c25d476ba'
          supplemental={
            'repair-v1.1.11.php','VF_SEO_V1.1.11_UPDATE.zip','atomic-self-test.json',
            'P05-V1.1.11-ATOMIC-METADATA.json','P05-V1.1.11-ATOMIC-GATE.json','SHA256SUMS.txt'
          }
          assert supplemental.isdisjoint(assets)
          print('P05_EXISTING_RELEASE_BOUNDARY=PASS')
          PY

      - name: Upload canonical Atomic assets to Product Release
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          D=/tmp/p05-atomic-assets
          gh release upload "v$VERSION" \
            --repo llhzx2018/vf-seo \
            "$D/repair-v1.1.11.php" \
            "$D/VF_SEO_V1.1.11_UPDATE.zip" \
            "$D/atomic-self-test.json" \
            "$D/P05-V1.1.11-ATOMIC-METADATA.json" \
            "$D/P05-V1.1.11-ATOMIC-GATE.json" \
            "$D/SHA256SUMS.txt"

      - name: Remote readback Product Release asset truth
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api "repos/llhzx2018/vf-seo/releases/tags/v$VERSION" > /tmp/release-after.json
          python3 - <<'PY'
          import json,os
          r=json.load(open('/tmp/release-after.json'))
          assert r['id']==int(os.environ['RELEASE_ID'])
          assert r['target_commitish']==os.environ['RELEASE_SOURCE']
          assets={a['name']:a for a in r['assets']}
          expected={
            'repair-v1.1.11.php':('sha256:'+os.environ['REPAIR_SHA256'],int(os.environ['REPAIR_BYTES'])),
            'VF_SEO_V1.1.11_UPDATE.zip':('sha256:'+os.environ['UPDATE_SHA256'],int(os.environ['UPDATE_BYTES'])),
            'atomic-self-test.json':('sha256:'+os.environ['SELFTEST_SHA256'],int(os.environ['SELFTEST_BYTES'])),
            'P05-V1.1.11-ATOMIC-METADATA.json':('sha256:'+os.environ['METADATA_SHA256'],int(os.environ['METADATA_BYTES'])),
            'P05-V1.1.11-ATOMIC-GATE.json':('sha256:'+os.environ['GATE_SHA256'],int(os.environ['GATE_BYTES'])),
          }
          for name,(digest,size) in expected.items():
              a=assets[name]
              assert a['digest']==digest,(name,a.get('digest'),digest)
              assert int(a['size'])==size,(name,a['size'],size)
              print(f'{name}_ASSET_ID={a["id"]}')
          assert 'SHA256SUMS.txt' in assets
          assert assets['VF_SEO_V1.1.11_FULL.zip']['digest']=='sha256:b24bbbeb997fa6414689a01b32eb70a7bf20c82ffeec8761fea4b69612629ce8'
          assert assets['VF_SEO_V1.1.11_RELEASE_RECEIPT.txt']['digest']=='sha256:d0bb220948f1f05f2034c1ec1c0f984cbd1dbbd07dae45d0b1b44a4c25d476ba'
          print('P05_PRODUCT_RELEASE_ATOMIC_ASSETS=PASS')
          print('P05_EXISTING_FULL_RECEIPT_UNCHANGED=PASS')
          PY

      - name: Publication receipt
        run: |
          echo 'P05_V1111_SUPPLEMENTAL_ATOMIC_PUBLICATION=PASS'
          echo 'P05_PUBLIC_GATE_RUN=33328403016'
          echo 'P05_PUBLIC_GATE_JOB=99302512282'
          echo 'P05_REPAIR_SHA256=3bd4ace9a5cf51a172038adb8b4acf1a86657dd1d612b2bdb3042274226f1cc3'
          echo 'P05_UPDATE_SHA256=82c0a65b7b29729a1be659940af62abd4c02909866590f97e7b5b4b6b6198702'
          echo 'P05_PRODUCTION_WRITE=0'
