name: P05 V1.1.11 Online Update Formal Publish

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vfseo_test
          POSTGRES_USER: vfseo
          POSTGRES_PASSWORD: vfseo-test-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U vfseo -d vfseo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      P05_MAIN_SOURCE: 49434d79d861bba206d72daa4476363f1bf8e0d4
      P05_VERIFIED_TREE: f8cf4326d7c8631298843b8bd48ff06ae54f4c40
      P05_EXACT_SOURCE: 6705dfb1886b209187180fd6191c1521624fb6ba
      P05_FINAL_GATE_RUN: '33324629957'
      P05_FINAL_GATE_JOB: '99292477706'
      VERSION: 1.1.11
      ASSET: VF_SEO_V1.1.11_FULL.zip
      RECEIPT: VF_SEO_V1.1.11_RELEASE_RECEIPT.txt
      DIST_TAG: p05-dist-v1.1.11
      DATABASE_URL: postgresql://vfseo:vfseo-test-password@127.0.0.1:5432/vfseo_test
      VF_MASTER_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NODE_ENV: test
    steps:
      - name: Checkout exact P05 main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.P05_MAIN_SOURCE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: p05

      - name: Verify exact main and tree-equivalent promotion
        working-directory: p05
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$P05_MAIN_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$P05_VERIFIED_TREE"
          test "$(git rev-parse "$P05_EXACT_SOURCE^{tree}")" = "$P05_VERIFIED_TREE"
          test "$(cat VERSION)" = "$VERSION"
          node - <<'NODE'
          const p=require('./package.json'), l=require('./package-lock.json'), v=require('./VF_PROJECT.json');
          const x=process.env.VERSION;
          if(p.version!==x||l.version!==x||l.packages[''].version!==x) process.exit(1);
          if(v.version!==x||v.target_version!==x||v.working_version!==x) process.exit(1);
          if(v.production_deployment!=='NOT_DEPLOYED'||v.production_write!==0) process.exit(1);
          NODE
          test ! -e VF_INSTALL_INSTANCE.json
          test ! -e .vf-seo-site-instance.json
          echo "P05_MAIN_SOURCE=$P05_MAIN_SOURCE"
          echo "P05_VERIFIED_TREE=$P05_VERIFIED_TREE"

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: p05/package-lock.json

      - name: Install dependencies and PHP runtime modules
        run: |
          set -euo pipefail
          cd p05
          npm ci
          cd ..
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-zip php-curl
          php -v
          php -m | grep -i '^pdo_sqlite$'
          php -m | grep -i '^zip$'
          php -m | grep -i '^curl$'

      - name: Complete engineering release-source and security regression
        working-directory: p05
        run: |
          set -euo pipefail
          npm run release:source:gate
          npm run lint
          npm run typecheck
          npm run test:unit
          npm run test:contract
          npm run test:integration
          npm run build
          npm run source:gate
          npm run scope:gate
          npm run dependency:gate
          npm audit --audit-level=high
          npm run security:gate

      - name: PHP compatibility and install regression
        working-directory: p05
        env:
          APP_ENV: test
          VF_DATABASE_PROVIDER: sqlite
          VF_SECURE_COOKIES: 'false'
          VF_REQUIRE_HTTPS: 'false'
          VF_ADMIN_USERNAME: admin
          VF_ADMIN_PASSWORD: php-ci-portable-password-123
        run: |
          set -euo pipefail
          npm run php:lint
          php php/tests/security-interop.php
          bash php/tests/http-smoke.sh
          bash php/tests/cloudpanel-fpm-home-cache-smoke.sh
          test ! -e VF_INSTALL_INSTANCE.json
          test ! -e php/src/FreshInstallRecovery.php

      - name: Build formal test staging
        working-directory: p05
        env:
          VF_RELEASE_SOURCE_SHA: ${{ env.P05_MAIN_SOURCE }}
        run: |
          set -euo pipefail
          npm run build:php-release
          npm run php:release:gate
          S=build/vf-seo-php-release
          test ! -e "$S/VF_INSTALL_INSTANCE.json"
          test ! -e "$S/.vf-seo-site-instance.json"
          test -f "$S/php/src/PhpUpdater.php"
          test -z "$(find "$S" \( -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.db' -o -name 'runtime.env' -o -name 'setup.lock.json' -o -name '.vfseo-data-*' \) -print -quit)"
          node - <<'NODE'
          const m=require('./build/vf-seo-php-release/PHP_RELEASE_MANIFEST.json');
          const bad=()=>process.exit(1);
          if(m.version!=='1.1.11'||m.sourceCommit!==process.env.P05_MAIN_SOURCE) bad();
          if(m.onlineUpdate!=='PHP_ATOMIC_FULL_RELEASE'||m.onlineUpdateRequiresShell!==false||m.onlineUpdateRequiresPrivateToken!==false||m.onlineUpdateOpcacheReset!==true) bad();
          if(!String(m.onlineUpdateAuthority).includes('core-free-runner-public')) bad();
          if(m.productionDeployment!=='NOT_DEPLOYED') bad();
          NODE
          bash php/tests/cloudpanel-root-smoke.sh "$S"
          test ! -e "$S/VF_INSTALL_INSTANCE.json"
          find "$S" -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/test-staging-before.sha

      - name: Browser pointer dirty-state Chrome and updater regression
        working-directory: p05
        run: |
          set -euo pipefail
          S=build/vf-seo-php-release
          VF_INSTALL_ROOT="$S" bash php/tests/browser-install-smoke.sh
          VF_INSTALL_ROOT="$S" bash php/tests/cloudpanel-fpm-real-install-smoke.sh
          google-chrome --version
          "$CHROMEWEBDRIVER/chromedriver" --version
          VF_INSTALL_ROOT="$S" python3 php/tests/browser-install-e2e.py
          php -d opcache.enable=0 scripts/php-updater-smoke.php "$S"

      - name: Prove formal test staging remained byte-identical
        working-directory: p05
        run: |
          set -euo pipefail
          S=build/vf-seo-php-release
          find "$S" -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/test-staging-after.sha
          cmp /tmp/test-staging-before.sha /tmp/test-staging-after.sha

      - name: Rebuild pristine release staging after all tests
        working-directory: p05
        env:
          VF_RELEASE_SOURCE_SHA: ${{ env.P05_MAIN_SOURCE }}
        run: |
          set -euo pipefail
          S=build/vf-seo-php-release
          rm -rf "$S" dist/client
          npm run build:php-release
          npm run php:release:gate
          test ! -e "$S/VF_INSTALL_INSTANCE.json"
          test ! -e "$S/.vf-seo-site-instance.json"
          test ! -e "$S/.env"
          test ! -e "$S/php/src/FreshInstallRecovery.php"
          test -f "$S/php/src/PhpUpdater.php"
          if find "$S" -type f \( -iname '*.sqlite' -o -iname '*.sqlite3' -o -iname '*.db' -o -iname '*.wal' -o -iname '*.shm' \) | grep -q .; then
            echo 'runtime database leaked into release staging' >&2
            exit 1
          fi
          if find "$S" -type f \( -name 'setup.lock.json' -o -name 'runtime.env' -o -name 'VF_INSTALL_INSTANCE.json' -o -name '.vf-seo-site-instance.json' \) | grep -q .; then
            echo 'runtime pointer/config leaked into release staging' >&2
            exit 1
          fi

      - name: Deterministic pristine FULL build
        working-directory: p05
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZipInfo, ZIP_DEFLATED
          import os
          root=Path('build/vf-seo-php-release')
          asset=os.environ['ASSET']
          def build(out):
              with ZipFile(out,'w') as z:
                  for p in sorted(x for x in root.rglob('*') if x.is_file()):
                      rel=p.relative_to(root).as_posix()
                      info=ZipInfo(rel,(1980,1,1,0,0,0))
                      mode=p.stat().st_mode & 0o777
                      info.external_attr=(mode & 0xFFFF) << 16
                      info.compress_type=ZIP_DEFLATED
                      z.writestr(info,p.read_bytes(),compress_type=ZIP_DEFLATED,compresslevel=9)
          build('../'+asset+'.a')
          build('../'+asset+'.b')
          PY
          cmp "../$ASSET.a" "../$ASSET.b"
          mv "../$ASSET.a" "../$ASSET"
          rm "../$ASSET.b"
          python3 - <<'PY'
          from zipfile import ZipFile
          import os
          asset='../'+os.environ['ASSET']
          forbidden={'VF_INSTALL_INSTANCE.json','.vf-seo-site-instance.json','.env'}
          with ZipFile(asset) as z:
              names=z.namelist()
              assert not forbidden.intersection(names), forbidden.intersection(names)
              assert not any(n.endswith(('.sqlite','.sqlite3','.db','.wal','.shm')) for n in names)
              assert not any(n.endswith('/setup.lock.json') or n.endswith('/runtime.env') for n in names)
              assert 'php/src/FreshInstallRecovery.php' not in names
              assert 'php/src/PhpUpdater.php' in names
          print('P05_FINAL_ZIP_RUNTIME_MARKERS=ABSENT')
          print('P05_FINAL_ZIP_UPDATER=PRESENT')
          PY
          sha="$(sha256sum "../$ASSET" | awk '{print $1}')"
          bytes="$(stat -c '%s' "../$ASSET")"
          files="$(find build/vf-seo-php-release -type f | wc -l | tr -d ' ')"
          zip_files="$(python3 -c 'from zipfile import ZipFile; import os; print(len(ZipFile("../"+os.environ["ASSET"]).namelist()))')"
          test "$files" = "$zip_files"
          printf 'P05_VERSION=%s\nP05_MAIN_SOURCE=%s\nP05_EXACT_SOURCE=%s\nP05_TREE=%s\nP05_FINAL_GATE_RUN=%s\nP05_FINAL_GATE_JOB=%s\nP05_FILES=%s\nP05_BYTES=%s\nP05_SHA256=%s\nONLINE_UPDATE=PHP_ATOMIC_FULL_RELEASE\nPUBLIC_DISTRIBUTION=CORE_FREE_RUNNER_PUBLIC\nPRIVATE_TOKEN_ON_SERVER=0\nAUTOMATIC_SQLITE_BACKUP=PASS\nRUNTIME_POINTER_PRESERVED=PASS\nPRIVATE_SQLITE_PRESERVED=PASS\nROLLBACK_TREE=PASS\nOPCACHE_RUNTIME_DETECTION=PASS\nOPCACHE_FAIL_CLOSED=PASS\nNORMAL_UPDATE_REQUIRES_SHELL=0\nPRODUCTION=NOT_DEPLOYED\n' "$VERSION" "$P05_MAIN_SOURCE" "$P05_EXACT_SOURCE" "$P05_VERIFIED_TREE" "$P05_FINAL_GATE_RUN" "$P05_FINAL_GATE_JOB" "$files" "$bytes" "$sha" > "../$RECEIPT"
          echo "P05_FILES=$files" >> "$GITHUB_ENV"
          echo "P05_BYTES=$bytes" >> "$GITHUB_ENV"
          echo "P05_SHA256=$sha" >> "$GITHUB_ENV"

      - name: Publish private Source Release v1.1.11
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          cd p05
          test -f "../$ASSET"
          test -f "../$RECEIPT"
          if gh release view "v$VERSION" --repo llhzx2018/vf-seo >/dev/null 2>&1; then
            echo "release v$VERSION already exists" >&2
            exit 1
          fi
          gh release create "v$VERSION" \
            --repo llhzx2018/vf-seo \
            --target "$P05_MAIN_SOURCE" \
            --title 'P05 · VF SEO v1.1.11 · PHP Online Update Baseline' \
            --notes 'V1.1.11 establishes the PHP-native backend online-update baseline for CloudPanel installs. The backend now exposes a visible 系统与更新 entry plus PHP update status/apply endpoints; installed servers use a public verified FULL distribution mirror and require no private GitHub token. Updates verify GitHub SHA-256, create an automatic SQLite recovery point, stage in a sibling directory, preserve the Runtime Pointer and private SQLite state, atomically switch the webroot, retain a rollback tree, and fail closed if active OPcache cannot be reset. Normal future updates require no SSH, CLI, .env edit, or HOME cleanup. V1.1.10 → V1.1.11 is intended to be the final manual CloudPanel update. Production remains NOT_DEPLOYED.' \
            "../$ASSET" "../$RECEIPT"

      - name: Private release remote readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/llhzx2018/vf-seo/releases/tags/v$VERSION" > /tmp/private-release.json
          python3 - <<'PY'
          import json, os
          r=json.load(open('/tmp/private-release.json'))
          assert r['tag_name']=='v'+os.environ['VERSION']
          assert r['target_commitish']==os.environ['P05_MAIN_SOURCE']
          assets={a['name']:a for a in r['assets']}
          a=assets[os.environ['ASSET']]
          rec=assets[os.environ['RECEIPT']]
          assert int(a['size'])==int(os.environ['P05_BYTES'])
          assert a.get('digest')=='sha256:'+os.environ['P05_SHA256']
          print('P05_RELEASE_ID='+str(r['id']))
          print('P05_ASSET_ID='+str(a['id']))
          print('P05_RECEIPT_ASSET_ID='+str(rec['id']))
          print('P05_PUBLISHED_AT='+str(r['published_at']))
          print('P05_PRIVATE_RELEASE_REMOTE_READBACK=PASS')
          PY

      - name: Publish identical public update mirror
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f "$ASSET"
          if gh release view "$DIST_TAG" --repo llhzx2018/core-free-runner-public >/dev/null 2>&1; then
            echo "public distribution $DIST_TAG already exists" >&2
            exit 1
          fi
          gh release create "$DIST_TAG" \
            --repo llhzx2018/core-free-runner-public \
            --target main \
            --title 'P05 Public Distribution Mirror · v1.1.11' \
            --notes "Verified public distribution mirror for P05 VF SEO v1.1.11. Private source authority: llhzx2018/vf-seo@$P05_MAIN_SOURCE. Asset SHA-256: $P05_SHA256. This release is a distribution mirror only; it is not Source Truth or Production Truth." \
            "$ASSET"

      - name: Anonymous public mirror digest readback
        run: |
          set -euo pipefail
          curl -fsSL -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/llhzx2018/core-free-runner-public/releases/tags/$DIST_TAG" > /tmp/public-release.json
          python3 - <<'PY'
          import json, os
          r=json.load(open('/tmp/public-release.json'))
          assert r['tag_name']==os.environ['DIST_TAG']
          assets={a['name']:a for a in r['assets']}
          a=assets[os.environ['ASSET']]
          assert int(a['size'])==int(os.environ['P05_BYTES'])
          assert a.get('digest')=='sha256:'+os.environ['P05_SHA256']
          assert os.environ['P05_MAIN_SOURCE'] in (r.get('body') or '')
          print('P05_PUBLIC_RELEASE_ID='+str(r['id']))
          print('P05_PUBLIC_ASSET_ID='+str(a['id']))
          print('P05_PUBLIC_MIRROR_SHA256='+str(a['digest']))
          print('P05_PUBLIC_MIRROR_ANONYMOUS_READBACK=PASS')
          PY

      - name: Machine receipt
        run: |
          echo 'P05_V1111_FORMAL_RELEASE=PASS'
          echo "P05_MAIN_SOURCE=$P05_MAIN_SOURCE"
          echo "P05_EXACT_SOURCE=$P05_EXACT_SOURCE"
          echo "P05_VERIFIED_TREE=$P05_VERIFIED_TREE"
          echo "P05_FILES=$P05_FILES"
          echo "P05_BYTES=$P05_BYTES"
          echo "P05_SHA256=$P05_SHA256"
          echo 'P05_PRIVATE_RELEASE=PASS'
          echo 'P05_PUBLIC_UPDATE_MIRROR=PASS'
          echo 'P05_PRIVATE_TOKEN_ON_INSTALLED_SERVER=0'
          echo 'P05_NORMAL_FUTURE_UPDATE_REQUIRES_SHELL=0'
          echo 'P05_PRODUCTION_WRITE=0'
          echo 'P05_PRODUCTION=NOT_DEPLOYED'
