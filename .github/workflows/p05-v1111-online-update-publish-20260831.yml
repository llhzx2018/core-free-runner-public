name: P05 V1.1.11 Atomic R2 Asset Replace

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  publish-atomic-r2:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: 1.1.11
      RELEASE_ID: '379349908'
      RELEASE_SOURCE: 49434d79d861bba206d72daa4476363f1bf8e0d4
      PUBLIC_GATE_RUN: '33330873356'
      PUBLIC_GATE_JOB: '99309075329'
      PUBLIC_GATE_HEAD: 2c24d4e100bdff94a98e179b7e747ea69b9ce5a8
      ARTIFACT_NAME: P05_V1.1.11_STANDARD_ATOMIC_R2_2c24d4e100bdff94a98e179b7e747ea69b9ce5a8
      REPAIR_SHA256: 267407763caa3b853c9e7c76ccb1a0c0fdfa45e9d15178be6d0cb52bef889ef5
      UPDATE_SHA256: 628d06f2e63eed56f4953d0e9dce76c44a9cc864cf5c2dc17e04c2ee4fbc276c
      SELFTEST_SHA256: c78abf51699281a2de8b4b2a4d2aa4c283cf64e422a90275cb2f2e148328bd05
      METADATA_SHA256: 0a2df01a6a92b3c5c2e1ba1ac352289c5adf7ac217171802db17fd30f122e307
      GATE_SHA256: d7b5f02df74f2ca1a336b4871b75f9632a75ff0330503e3fcb59b555b6b76c4b
      REPAIR_BYTES: '2459854'
      UPDATE_BYTES: '847983'
      SELFTEST_BYTES: '389'
      METADATA_BYTES: '1802'
      GATE_BYTES: '585'

    steps:
      - name: Bind proven Public Atomic R2 Gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$PUBLIC_GATE_RUN" > /tmp/run.json
          gh api "repos/llhzx2018/core-free-runner-public/actions/jobs/$PUBLIC_GATE_JOB" > /tmp/job.json
          python3 - <<'PY'
          import json,os
          run=json.load(open('/tmp/run.json')); job=json.load(open('/tmp/job.json'))
          assert run['id']==int(os.environ['PUBLIC_GATE_RUN'])
          assert run['head_sha']==os.environ['PUBLIC_GATE_HEAD']
          assert run['status']=='completed' and run['conclusion']=='success'
          assert job['id']==int(os.environ['PUBLIC_GATE_JOB']) and job['run_id']==int(os.environ['PUBLIC_GATE_RUN'])
          assert job['status']=='completed' and job['conclusion']=='success'
          assert job['name']=='p05-v1111-standard-atomic'
          print('P05_PUBLIC_ATOMIC_R2_GATE_BINDING=PASS')
          PY

      - name: Download exact PASS R2 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p05-atomic-r2
          gh run download "$PUBLIC_GATE_RUN" --repo llhzx2018/core-free-runner-public --name "$ARTIFACT_NAME" --dir /tmp/p05-atomic-r2
          test "$(find /tmp/p05-atomic-r2 -maxdepth 1 -type f | wc -l)" = 6

      - name: Verify exact R2 asset contract
        run: |
          set -Eeuo pipefail
          D=/tmp/p05-atomic-r2
          test "$(sha256sum "$D/repair-v1.1.11.php" | awk '{print $1}')" = "$REPAIR_SHA256"
          test "$(sha256sum "$D/VF_SEO_V1.1.11_UPDATE.zip" | awk '{print $1}')" = "$UPDATE_SHA256"
          test "$(sha256sum "$D/atomic-self-test.json" | awk '{print $1}')" = "$SELFTEST_SHA256"
          test "$(sha256sum "$D/P05-V1.1.11-ATOMIC-METADATA.json" | awk '{print $1}')" = "$METADATA_SHA256"
          test "$(sha256sum "$D/P05-V1.1.11-ATOMIC-GATE.json" | awk '{print $1}')" = "$GATE_SHA256"
          test "$(stat -c%s "$D/repair-v1.1.11.php")" = "$REPAIR_BYTES"
          test "$(stat -c%s "$D/VF_SEO_V1.1.11_UPDATE.zip")" = "$UPDATE_BYTES"
          test "$(stat -c%s "$D/atomic-self-test.json")" = "$SELFTEST_BYTES"
          test "$(stat -c%s "$D/P05-V1.1.11-ATOMIC-METADATA.json")" = "$METADATA_BYTES"
          test "$(stat -c%s "$D/P05-V1.1.11-ATOMIC-GATE.json")" = "$GATE_BYTES"
          php -l "$D/repair-v1.1.11.php" >/dev/null
          jq -e '.result=="PASS" and .proxy_https_same_origin=="PASS" and .distribution_revision=="R2" and .production_write==0' "$D/P05-V1.1.11-ATOMIC-GATE.json" >/dev/null
          test "$(unzip -Z1 "$D/VF_SEO_V1.1.11_UPDATE.zip" | wc -l)" = 1
          unzip -Z1 "$D/VF_SEO_V1.1.11_UPDATE.zip" | grep -Fx repair-v1.1.11.php >/dev/null
          echo 'P05_ATOMIC_R2_ASSET_CONTRACT=PASS'

      - name: Verify immutable Product Release boundary
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api "repos/llhzx2018/vf-seo/releases/tags/v$VERSION" > /tmp/release-before.json
          python3 - <<'PY'
          import json,os
          r=json.load(open('/tmp/release-before.json'))
          assert r['id']==int(os.environ['RELEASE_ID'])
          assert r['target_commitish']==os.environ['RELEASE_SOURCE']
          a={x['name']:x for x in r['assets']}
          assert a['VF_SEO_V1.1.11_FULL.zip']['digest']=='sha256:b24bbbeb997fa6414689a01b32eb70a7bf20c82ffeec8761fea4b69612629ce8'
          assert a['VF_SEO_V1.1.11_RELEASE_RECEIPT.txt']['digest']=='sha256:d0bb220948f1f05f2034c1ec1c0f984cbd1dbbd07dae45d0b1b44a4c25d476ba'
          print('P05_IMMUTABLE_RELEASE_BOUNDARY=PASS')
          PY

      - name: Replace canonical Atomic assets with R2
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          D=/tmp/p05-atomic-r2
          gh release upload "v$VERSION" --repo llhzx2018/vf-seo --clobber \
            "$D/repair-v1.1.11.php" \
            "$D/VF_SEO_V1.1.11_UPDATE.zip" \
            "$D/atomic-self-test.json" \
            "$D/P05-V1.1.11-ATOMIC-METADATA.json" \
            "$D/P05-V1.1.11-ATOMIC-GATE.json" \
            "$D/SHA256SUMS.txt"

      - name: Remote readback Product Release R2 truth
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api "repos/llhzx2018/vf-seo/releases/tags/v$VERSION" > /tmp/release-after.json
          python3 - <<'PY'
          import json,os
          r=json.load(open('/tmp/release-after.json')); a={x['name']:x for x in r['assets']}
          assert r['id']==int(os.environ['RELEASE_ID']) and r['target_commitish']==os.environ['RELEASE_SOURCE']
          expected={
            'repair-v1.1.11.php':('sha256:'+os.environ['REPAIR_SHA256'],int(os.environ['REPAIR_BYTES'])),
            'VF_SEO_V1.1.11_UPDATE.zip':('sha256:'+os.environ['UPDATE_SHA256'],int(os.environ['UPDATE_BYTES'])),
            'atomic-self-test.json':('sha256:'+os.environ['SELFTEST_SHA256'],int(os.environ['SELFTEST_BYTES'])),
            'P05-V1.1.11-ATOMIC-METADATA.json':('sha256:'+os.environ['METADATA_SHA256'],int(os.environ['METADATA_BYTES'])),
            'P05-V1.1.11-ATOMIC-GATE.json':('sha256:'+os.environ['GATE_SHA256'],int(os.environ['GATE_BYTES'])),
          }
          for name,(digest,size) in expected.items():
              assert a[name]['digest']==digest,(name,a[name].get('digest'),digest)
              assert int(a[name]['size'])==size
              print(f'{name}_ASSET_ID={a[name]["id"]}')
          assert a['VF_SEO_V1.1.11_FULL.zip']['digest']=='sha256:b24bbbeb997fa6414689a01b32eb70a7bf20c82ffeec8761fea4b69612629ce8'
          assert a['VF_SEO_V1.1.11_RELEASE_RECEIPT.txt']['digest']=='sha256:d0bb220948f1f05f2034c1ec1c0f984cbd1dbbd07dae45d0b1b44a4c25d476ba'
          print('P05_PRODUCT_RELEASE_ATOMIC_R2=PASS')
          print('P05_EXISTING_FULL_RECEIPT_UNCHANGED=PASS')
          PY

      - name: Publication receipt
        run: |
          echo 'P05_V1111_ATOMIC_R2_PUBLICATION=PASS'
          echo 'P05_PUBLIC_GATE_RUN=33330873356'
          echo 'P05_PUBLIC_GATE_JOB=99309075329'
          echo 'P05_REPAIR_SHA256=267407763caa3b853c9e7c76ccb1a0c0fdfa45e9d15178be6d0cb52bef889ef5'
          echo 'P05_UPDATE_SHA256=628d06f2e63eed56f4953d0e9dce76c44a9cc864cf5c2dc17e04c2ee4fbc276c'
          echo 'P05_PRODUCTION_WRITE=0'
