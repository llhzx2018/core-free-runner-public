name: P04 V2.5.5 Release Readback Continuation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p04-v255-release-readback-continuation.yml'

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PRODUCT_REPO: llhzx2018/vf-infra
      CORE_UPDATES_REPO: llhzx2018/core-updates
      CANDIDATE_COMMIT: 11d76ae5949d832c4fa31bc6fe540792fab21d8c
      CANDIDATE_TREE: aad90ae404d6a51646f3f9bcf589e819c8fee217
      EXPECTED_BYTES: '217485'
      EXPECTED_SHA256: 8a42054b0ae507fa1e91dd55884efea4d94c29cedf3375dade50bff17b14669a
      EXPECTED_REPAIR_SHA256: aa2a9741ebcdc489b5c1c29b0bf3a702e516d0918ae6c39da9a1b6183c8376cb
      EXPECTED_PAYLOAD_SHA256: 1e5867c546b7e93bcf0cf5e3838dfaccdf6f4f00a2437ce3a8029a5854cc578d
      EXPECTED_SOURCE_SHA256: c6a6aca5e0572a9c6f02eff21ae0cbf78c769c7eef3dd1d7608c5f98a0743aa2
      EXPECTED_RUNTIME_FINGERPRINT: 43e7a968f990f098471121f81d2de0cb7bc47cdb806e6865e5a8009dc0440524
      EXPECTED_MARKER: VF_INFRA_ONLINE_HANDOFF_V1
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: 11d76ae5949d832c4fa31bc6fe540792fab21d8c
          path: vf-infra
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}

      - name: Build exact target Runtime authority
        run: |
          set -Eeuo pipefail
          cd vf-infra
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          python3 scripts/build-release-tree.py "$RUNNER_TEMP/runtime" > "$RUNNER_TEMP/runtime.json"
          python3 - <<'PY'
          import json,os,pathlib
          x=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'runtime.json').read_text().strip().splitlines()[-1])
          assert x['version']=='2.5.5' and x['schema']==14 and x['file_count']==150
          assert x['source_fingerprint']=='43e7a968f990f098471121f81d2de0cb7bc47cdb806e6865e5a8009dc0440524'
          print('RUNTIME_AUTHORITY=PASS')
          PY

      - name: Authenticated exact Release readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$PRODUCT_REPO/releases/tags/v2.5.5" > "$RUNNER_TEMP/release.json"
          python3 - "$RUNNER_TEMP/release.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x['tag_name']=='v2.5.5' and not x['draft'] and not x['prerelease']
          assert x['target_commitish']=='11d76ae5949d832c4fa31bc6fe540792fab21d8c'
          assert {a['name'] for a in x['assets']}=={'VF_Infra_V2.5.5_UPDATE.zip','VF_Infra_V2.5.5_ATOMIC.zip','PACKAGE_MANIFEST.json','SHA256SUMS.txt'}
          print('RELEASE_METADATA=PASS')
          PY
          test "$(gh api "repos/$PRODUCT_REPO/git/ref/tags/v2.5.5" --jq '.object.sha')" = "$CANDIDATE_COMMIT"
          for name in VF_Infra_V2.5.5_UPDATE.zip VF_Infra_V2.5.5_ATOMIC.zip PACKAGE_MANIFEST.json SHA256SUMS.txt; do
            id=$(python3 - "$RUNNER_TEMP/release.json" "$name" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1])); print(next(a['id'] for a in x['assets'] if a['name']==sys.argv[2]))
          PY
            )
            curl --fail --silent --show-error --location --max-time 90 \
              -H 'Accept: application/octet-stream' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$PRODUCT_REPO/releases/assets/$id" -o "$RUNNER_TEMP/$name"
          done
          for name in VF_Infra_V2.5.5_UPDATE.zip VF_Infra_V2.5.5_ATOMIC.zip; do
            test "$(stat -c '%s' "$RUNNER_TEMP/$name")" = "$EXPECTED_BYTES"
            test "$(sha256sum "$RUNNER_TEMP/$name" | awk '{print $1}')" = "$EXPECTED_SHA256"
            unzip -t "$RUNNER_TEMP/$name" >/dev/null
            python3 vf-infra/scripts/validate-online-atomic-package.py --runtime "$RUNNER_TEMP/runtime" --zip "$RUNNER_TEMP/$name" --version 2.5.5 --sha256 "$EXPECTED_SHA256"
            unzip -p "$RUNNER_TEMP/$name" repair-v2.5.5.php > "$RUNNER_TEMP/$name.repair.php"
            test "$(sha256sum "$RUNNER_TEMP/$name.repair.php" | awk '{print $1}')" = "$EXPECTED_REPAIR_SHA256"
          done
          cmp -s "$RUNNER_TEMP/VF_Infra_V2.5.5_UPDATE.zip" "$RUNNER_TEMP/VF_Infra_V2.5.5_ATOMIC.zip"
          python3 - <<'PY'
          import json,os,pathlib
          r=pathlib.Path(os.environ['RUNNER_TEMP'])
          m=json.loads((r/'PACKAGE_MANIFEST.json').read_text(encoding='utf-8'))
          assert m['version']=='2.5.5' and m['schema']==14 and m['allowed_source_versions']==['2.5.3']
          assert m['payload_file_count']==10 and m['payload_sha256']=='1e5867c546b7e93bcf0cf5e3838dfaccdf6f4f00a2437ce3a8029a5854cc578d'
          assert m['production_source_manifest_sha256']=='c6a6aca5e0572a9c6f02eff21ae0cbf78c769c7eef3dd1d7608c5f98a0743aa2'
          assert m['online_handoff_marker']=='VF_INFRA_ONLINE_HANDOFF_V1'
          assert m['source_commit']=='11d76ae5949d832c4fa31bc6fe540792fab21d8c'
          assert m['source_tree']=='aad90ae404d6a51646f3f9bcf589e819c8fee217'
          assert m['target_runtime_file_count']==150
          assert m['target_runtime_source_fingerprint']=='43e7a968f990f098471121f81d2de0cb7bc47cdb806e6865e5a8009dc0440524'
          print('PACKAGE_MANIFEST_REMOTE=PASS')
          PY
          grep -Fq "$EXPECTED_SHA256  VF_Infra_V2.5.5_UPDATE.zip" "$RUNNER_TEMP/SHA256SUMS.txt"
          grep -Fq "$EXPECTED_SHA256  VF_Infra_V2.5.5_ATOMIC.zip" "$RUNNER_TEMP/SHA256SUMS.txt"
          echo 'EXACT_RELEASE_ASSET_READBACK=PASS'

      - name: Exact core-updates remote readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api -H 'Accept: application/vnd.github.raw+json' "repos/$CORE_UPDATES_REPO/contents/projects/P04.json?ref=main" > "$RUNNER_TEMP/P04.json"
          python3 - "$RUNNER_TEMP/P04.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x['enabled'] is True and x['target_version']=='2.5.5' and x['update_type']=='ATOMIC'
          assert x['from_versions']==['2.5.3']
          assert x['schema_from']=='14' and x['schema_to']=='14'
          assert x['release_tag']=='v2.5.5' and x['asset_name']=='VF_Infra_V2.5.5_UPDATE.zip'
          assert x['asset_bytes']==217485 and x['asset_sha256']=='8a42054b0ae507fa1e91dd55884efea4d94c29cedf3375dade50bff17b14669a'
          assert 'PUBLISHED / KNOWN DEFECT / SUPERSEDED FOR ONLINE UPDATE' in x['notes']
          assert '2.5.4' not in x['from_versions']
          print('CORE_UPDATES_V255_REMOTE_READBACK=PASS')
          PY
          echo 'V255_RELEASE_DISTRIBUTION_READBACK_ALL_PASS'
