name: P07-M05 新服务器初始化已安装缓存自锁缺陷取证
on:
  push:
    branches: [test/p07-m05-current-pycache-20261113]
    paths: [.github/workflows/p07-m05-cache-regression-20261113.yml]
permissions:
  contents: read
jobs:
  official-M05-pycache-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download and install unchanged public official M05 release
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 2 \
            'https://github.com/llhzx2018/core-free-runner-public/releases/download/p07-m05-v0.1.0-clean-host-guard1-20261113/P07-M05-0.1.0-m05-clean-host-guard1.zip' \
            -o "$RUNNER_TEMP/current.zip"
          echo "b2b72275980f7c2220f0c95fce18f644967bd69a17fa0a8320f96149a4096a1a  $RUNNER_TEMP/current.zip" | sha256sum -c --status
          sudo python3 -B installers/p07-m05-atomic.py install "$RUNNER_TEMP/current.zip" \
            b2b72275980f7c2220f0c95fce18f644967bd69a17fa0a8320f96149a4096a1a
          test "$(readlink /opt/vfops-modules/m05/current)" = releases/0.1.0-m05-clean-host-guard1
          echo P07_M05_ORIGINAL_OFFICIAL_INSTALLED=YES
      - name: Run the unchanged official module then assert exact pycache regression
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          a=Path('installers/p07-toolbox.sh').read_text()
          b=a[a.index('m05_verified_current() {'):a.index('\nensure_m05_current() {')]
          # Invoke the exact public verifier from the installed toolbox
          # without running the top-level Toolbox menu.
          Path('/tmp/check-m05.sh').write_text(
             '#!/usr/bin/env bash\nset -Eeuo pipefail\n'
             'M05_ROOT=/opt/vfops-modules/m05\n'
             'M05_RUNTIME="$M05_ROOT/current/bin/vfops-init-entry"\n'+b+'\nm05_verified_current\n')
          PY
          bash /tmp/check-m05.sh
          echo P07_M05_BEFORE_FIRST_USE_IDENTITY=PASS
          set +e
          bash /opt/vfops-modules/m05/current/bin/vfops-init-core \
            server-migrate target-status >/dev/null 2>&1
          rc=$?
          set -e
          echo "P07_M05_READ_ONLY_TARGET_STATUS_RC=$rc"
          pycs="$(find /opt/vfops-modules/m05/releases/0.1.0-m05-clean-host-guard1/lib -type f -name '*.pyc' | wc -l)"
          echo "P07_M05_AFTER_ONE_RUN_NEW_PYCS=$pycs"
          test "$pycs" -gt 0
          if bash /tmp/check-m05.sh >/dev/null 2>&1; then
            echo P07_M05_REPRODUCED_FALSE_REJECT=NO
            exit 1
          fi
          echo P07_M05_REPRODUCED_FALSE_REJECT=YES
          test ! -e /home/clp
          for other in m01 m02 m03 m04; do test ! -e "/opt/vfops-modules/$other"; done
          echo P07_M05_OTHER_MODULES_NOT_TOUCHED=YES
          echo P07_OWNER_VPS=NOT_TOUCHED
