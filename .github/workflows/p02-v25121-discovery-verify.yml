name: P02 V2.5.121 Stable Discovery Verify

on:
  push:
    branches:
      - run/p02-v25121-discovery-verify-20260925
    paths:
      - '.github/workflows/p02-v25121-discovery-verify.yml'
      - 'requests/p02-v25121-discovery-verify.sh'

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout runner carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner

      - name: Checkout exact P02 V2.5.120 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: d694f9213b1f7a1d04245e61779c8f07b6238c1a
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product

      - name: Verify live stable discovery
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-zip sqlite3 curl jq
          bash runner/requests/p02-v25121-discovery-verify.sh
