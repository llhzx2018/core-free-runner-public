name: P02 V2.5.29 Publication Closure
on:
  push:
    branches: [task/p02-v2529-common-baseline-release-20260828]
    paths: ['.github/workflows/p02-v2529-publication-closure-20260828.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify final remote publication truth
        env:
          GH_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f vf-agent/results/P02-V2.5.29-FORMAL-RELEASE.json
          jq -e '.pass==true and .formal_gate.status=="PASS" and .publication_operation.required_publication_step=="PASS" and .production.status=="UPGRADE_REQUIRED"' vf-agent/results/P02-V2.5.29-FORMAL-RELEASE.json >/dev/null
          test "$(gh api repos/llhzx2018/vf-library/git/ref/tags/v2.5.29 --jq .object.sha)" = 387655e222c1fed0b6e4559b66d254dba5d3c8e4
          REL=$(gh api repos/llhzx2018/vf-library/releases/tags/v2.5.29)
          printf '%s' "$REL" | jq -e '.id==378158937 and .draft==false and .prerelease==false and (.assets|length)==8' >/dev/null
          printf '%s' "$REL" | jq -e '.assets[] | select(.name=="VF_Library_V2.5.29_UPDATE.zip") | .size==357985 and .digest=="sha256:aeaa5f11343017593236d923d51086f43b0930a85035552b87594e05c3c63b92"' >/dev/null
          MAIN=$(gh api repos/llhzx2018/vf-library/branches/main --jq .commit.sha)
          test "$MAIN" = e02551fc21a8dfab2d08b77eac0a3eb383cecc62
          M=$(gh api repos/llhzx2018/core-updates/contents/projects/P02.json?ref=main --jq .content | base64 -d)
          printf '%s' "$M" | jq -e '.project_id=="P02" and .current_version=="2.5.28" and .target_version=="2.5.29" and .from_versions==["2.5.28"] and .update_type=="ATOMIC" and .schema_from=="2401" and .schema_to=="2401" and .release_tag=="v2.5.29" and .release_id==378158937 and .product_identity=="387655e222c1fed0b6e4559b66d254dba5d3c8e4" and .asset_name=="VF_Library_V2.5.29_UPDATE.zip" and .asset_bytes==357985 and .asset_sha256=="aeaa5f11343017593236d923d51086f43b0930a85035552b87594e05c3c63b92" and .backup_required==true and .rollback_supported==true' >/dev/null
          echo P02_V2529_PUBLICATION_CLOSURE=PASS
          echo P02_PRODUCTION=UPGRADE_REQUIRED
