name: P02 V2.5.3 Candidate Seal

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v253-candidate-seal.yml'

permissions:
  contents: read

jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require registered capabilities
        env:
          READ_TOKEN: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'
          WRITE_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: maintenance/v2.5.3-notebook-resizer-hotfix
          token: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
          fetch-depth: 0
          persist-credentials: true
          path: p02

      - name: Seal V2.5.3 candidate authority
        working-directory: p02
        run: |
          set -Eeuo pipefail
          test "$(tr -d '\r\n' < VERSION)" = '2.5.3'
          test -s public/assets/v253-hotfix.css
          grep -Fq 'assets/v253-hotfix.css' public/index.php
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('.')
          manifest_path=root/'SOURCE_MANIFEST.json'
          m=json.loads(manifest_path.read_text(encoding='utf-8'))
          m['version']='2.5.3'
          m['mapping_contract']='Each declared runtime source file must exist exactly once at repo_path; hashes bind the Git-native V2.5.3 Notebook Resizer Hotfix derived from formal V2.5.2. Formal release identity is not assigned by this candidate manifest.'
          entries=m['entries']
          if not any(e['full_path']=='assets/v253-hotfix.css' for e in entries):
              entries.append({'full_path':'assets/v253-hotfix.css','repo_path':'public/assets/v253-hotfix.css'})
          for e in entries:
              p=root/e['repo_path']; b=p.read_bytes(); h=hashlib.sha256(b).hexdigest()
              e['bytes']=len(b); e['sha256']=h; e['repo_sha256']=h
          entries.sort(key=lambda e:e['full_path'])
          m['runtime_source_file_count']=len(entries)
          manifest_path.write_text(json.dumps(m,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')

          ch=root/'CHANGELOG.md'; old=ch.read_text(encoding='utf-8')
          if not old.startswith('# VF Library V2.5.3'):
              head='''# VF Library V2.5.3 · Notebook 列表宽度拖动 Hotfix · 2026-08-18\n\n- 修复 OWNER 在真实 Production 编辑状态发现的 Document List 宽度拖动无效问题。\n- 根因：V2.5.2 已重新显示 Document List 与 Resizer，但历史 `.notebook-editing` 仍以 `!important` 强制单列 Grid；拖动逻辑虽然正确更新 `--notebook-list-width`，Grid 却没有消费该变量，因此视觉宽度不变。\n- Desktop Edit / Split 在列表未折叠、未进入 Focus 时恢复 `Document List + 6px Resizer + Detail` 三轨 Grid，继续复用原有 240–460px 拖动与本地记忆逻辑。\n- 扩大分隔线实际拖拽命中区，但不改变 6px 布局占位；中部折叠按钮继续保持更高层级。\n- Chromium 真实 Pointer Drag 回归 Run `32146866564` PASS：Edit 288→368px、Split 368→313px，Detail 同步让位，localStorage 记忆/折叠恢复/新页面恢复均 PASS；A-/A+ 16→17px 回归 PASS；1920/1440/1024 Desktop 与 900/768/430/390 响应式无横向溢出。\n- Schema 保持 `2401`，无 Migration；V2.5.2 为本版唯一直接升级来源。\n\n'''
              ch.write_text(head+old,encoding='utf-8')

          src=root/'scripts/build-release-v2.5.2.py'; dst=root/'scripts/build-release-v2.5.3.py'
          s=src.read_text(encoding='utf-8')
          old_head="ROOT=Path(__file__).resolve().parents[1]; SRCVER='2.5.0'; VER='2.5.2'; SCHEMA=2401; DT=(2026,8,18,11,40,0)"
          new_head="ROOT=Path(__file__).resolve().parents[1]; SRCVER='2.5.2'; VER='2.5.3'; SCHEMA=2401; DT=(2026,8,18,14,15,0)"
          if old_head not in s: raise RuntimeError('builder version header not found')
          s=s.replace(old_head,new_head)
          s=s.replace("default='build/release-v2.5.2'","default='build/release-v2.5.3'")
          s=s.replace("default='release/v2.5.2'","default='release/v2.5.3'")
          s=s.replace("V2.5.2 is the consolidated Production hotfix for V2.5.0. It fixes Document List visibility/recovery, restores the editor A-/A+ visual font-size control, and makes Edit/Split use the available workspace width.","V2.5.3 is a scoped Production hotfix for V2.5.2. It restores real Document List width dragging in Edit/Split mode while retaining the V2.5.2 responsive editor fixes.")
          s=s.replace("Highlights:\\n- New browser sessions start with the Document List visible instead of inheriting a stale collapsed local state.","Highlights:\\n- Edit/Split restore the three-track Notebook grid whenever the Document List is visible, so `--notebook-list-width` again controls the real column.\\n- The resizer hit target is wider without increasing the 6px layout track or covering the collapse control.\\n- Width persists through drag, collapse/restore and a new page in the same browser storage context.\\n- Retained from V2.5.2: new browser sessions start with the Document List visible instead of inheriting a stale collapsed local state.")
          s=s.replace("- All V2.5.0 Stable Core behavior is otherwise retained.","- All V2.5.2 Stable Core behavior is otherwise retained.")
          s=s.replace("PASS_RUN_32134169497","PASS_RUN_32146866564")
          s=s.replace("'main_readback':'PRODUCTION_2.5.0_UNCHANGED'","'main_readback':'PRODUCTION_2.5.2_CURRENT_EXPECTED'")
          dst.write_text(s,encoding='utf-8'); dst.chmod(0o755)
          PY

          rm -rf "$RUNNER_TEMP/deploy"; mkdir -p "$RUNNER_TEMP/deploy"
          bash scripts/build-deploy-tree.sh "$RUNNER_TEMP/deploy" >/dev/null
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          m=json.loads(Path('SOURCE_MANIFEST.json').read_text())
          dep=Path(os.environ['RUNNER_TEMP'])/'deploy'
          actual={p.relative_to(dep).as_posix():(p.stat().st_size,hashlib.sha256(p.read_bytes()).hexdigest()) for p in dep.rglob('*') if p.is_file()}
          declared={e['full_path']:(int(e['bytes']),e['sha256']) for e in m['entries']}
          assert m['version']=='2.5.3'
          assert m['runtime_source_file_count']==62,(m['runtime_source_file_count'],len(actual))
          assert actual==declared,(set(actual)-set(declared),set(declared)-set(actual))
          print('SOURCE_MANIFEST_62_OF_62=PASS')
          PY
          python3 scripts/repository-gates.py
          python3 -m py_compile scripts/build-release-v2.5.3.py
          php -l public/index.php >/dev/null
          git diff --check
          git config user.name 'VF Release Automation'
          git config user.email 'vf-release@users.noreply.github.com'
          git add VERSION CHANGELOG.md SOURCE_MANIFEST.json public/index.php public/assets/v253-hotfix.css scripts/build-release-v2.5.3.py
          git diff --cached --check
          if ! git diff --cached --quiet; then git commit -m 'chore(v2.5.3): seal notebook resizer hotfix candidate'; fi
          git push origin HEAD:maintenance/v2.5.3-notebook-resizer-hotfix
          echo SEALED_COMMIT=$(git rev-parse HEAD)
          echo BROWSER_RUN=32146866564
          echo SCHEMA=2401
          echo MIGRATION=NONE
          echo PRODUCTION_WRITE=NO
