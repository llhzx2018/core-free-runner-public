name: TEMP P08 Owner schema status UI
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p08-schema-owner-status-20261126.yml'
permissions:
  contents: read
concurrency:
  group: p08-schema-owner-status-${{ github.event.pull_request.number }}
  cancel-in-progress: false
env:
  TARGET_REPO: llhzx2018/vf-adops
  TARGET_VERSION: '0.1.18'
  TARGET_SHA: e6813b87abc15747c902b5dad2b6893829dad4f5
  TARGET_TREE: 5a0f185b05add95a037ee17331ea69543c9689dd
  GOV_SHA: 5afe0d29a5a401db80ecdb981038b89a8cefed0a
jobs:
  identity-preflight:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'llhzx2018' && github.head_ref == 'evidence/p08-schema-owner-status-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 scripts/ephemeral_lane_spec.py audit-rendered --spec specs/ephemeral/p08-schema-owner-status-20261126.json --input .github/workflows/temp-p08-schema-owner-status-20261126.yml
  owner-status:
    needs: identity-preflight
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'llhzx2018' && github.head_ref == 'evidence/p08-schema-owner-status-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-p08
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact changed UI and run focused new tests
        working-directory: private-p08
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$TARGET_TREE"
          test "$(cat VERSION)" = "$TARGET_VERSION"
          test ! -e .env
          test "$(git hash-object resources/js/modules/updates/FutureOwnerUpdatePanel.vue)" = de7657e17661d92ccd6bc8856b4e43a356aee2d8
          test "$(git hash-object resources/js/modules/updates/futureUpdateCheckFeedback.ts)" = 5c278758ff748aa9c90d7364ec26a41583f0f948
          test "$(git hash-object tests/js/schemaUpgradeStatus.test.ts)" = cac2cdcface8f1eb1c57eae739b933a52aa16619
          echo P08_SCHEMA_OWNER_UI_EXACT_SOURCE=PASS
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-owner-deps.log" 2>&1
          echo P08_SCHEMA_OWNER_UI_DEPENDENCIES=PASS
          npm run typecheck > "$RUNNER_TEMP/p08-owner-types.log" 2>&1
          echo P08_SCHEMA_OWNER_UI_TYPECHECK=PASS
          npx --no-install vitest run tests/js/schemaUpgradeStatus.test.ts --reporter=json --outputFile="$RUNNER_TEMP/p08-owner-result.json" > "$RUNNER_TEMP/p08-owner-test.log" 2>&1
          node -e 'const r=require(process.env.RUNNER_TEMP+"/p08-owner-result.json");if(r.numFailedTests!==0||r.numPassedTests!==16)process.exit(1);console.log("P08_SCHEMA_OWNER_UI_CASES="+r.numPassedTests+";FAIL=0")'
      - name: Cleanup ephemeral private checkout and logs
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- private-p08
          rm -f -- "$RUNNER_TEMP/p08-owner-deps.log" "$RUNNER_TEMP/p08-owner-types.log" "$RUNNER_TEMP/p08-owner-test.log" "$RUNNER_TEMP/p08-owner-result.json"
          test ! -e private-p08
          echo P08_SCHEMA_OWNER_UI_CLEANUP=PASS
