name: P07 M03 D04 owner field Latin-1 preflight diagnostic exact source
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p07-m03-d04-field-latin1-preflight-20261118.yml']
permissions:
  contents: read
jobs:
  exact-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      NO_COLOR: '1'
      P07_SOURCE_SHA: '7022c63d537673765ced909f692b78ea8bd30f7b'
      P07_BASE_SHA: 'b7f2be5075b9096c054110876a8c2fbce61e8bf0'
    steps:
      - name: Checkout registered public runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Transient checkout exact private P07 fix
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 7022c63d537673765ced909f692b78ea8bd30f7b
          fetch-depth: 0
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: .p07-private
      - name: Current GOV-DOC naming and architecture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: .gov-current
      - name: Exact-source Git diff and only two allowed P07-M03 files
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-private rev-parse HEAD)" = "$P07_SOURCE_SHA"
          test "$(git -C .p07-private merge-base "$P07_BASE_SHA" "$P07_SOURCE_SHA")" = "$P07_BASE_SHA"
          git -C .p07-private diff --name-only "$P07_BASE_SHA" "$P07_SOURCE_SHA" |
            sort > "$RUNNER_TEMP/p07-diff-paths.txt"
          printf '%s\n' bin/vfops-migrate-ui tests/test_p07_dynamic_preflight.py |
            sort > "$RUNNER_TEMP/p07-allowed-paths.txt"
          diff -u "$RUNNER_TEMP/p07-allowed-paths.txt" "$RUNNER_TEMP/p07-diff-paths.txt"
          python3 -B .p07-private/.github/checks/architecture_gate.py \
            --manifest .p07-private/.github/checks/code_architecture.json \
            --gov-root .gov-current --git-root .p07-private \
            --base-sha "$P07_BASE_SHA" --head-sha "$P07_SOURCE_SHA"
          echo P07_D04_LATIN1_LIVE_GIT_ARCHITECTURE_AND_MODULE_ISOLATION=PASS
      - name: Reproduce Latin-1 symptom and prove exact local source fix
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n .p07-private/bin/vfops-migrate-ui
          (cd .p07-private && python3 -B tests/test_p07_dynamic_preflight.py -v)
          (cd .p07-private && python3 -B tests/test_p07_m03_d04_prepared_online_ui.py -v)
          (cd .p07-private && python3 -B tests/test_p07_m03_d04_whole_vps_online_ui.py -v)
          (cd .p07-private && python3 -B scripts/check_p07_modules.py)
          (cd .p07-private && python3 -B scripts/check_p07_terminal_ux.py)
          echo P07_D04_OWNER_FIELD_LATIN1_REDACTED_PRECHECK_AND_UX=PASS
          echo P07_D04_OLD_VPS_CP2_SQL_DNS_MIGRATION_WRITES=NONE
      - name: Remove transient private source and field diagnostics
        if: always()
        shell: bash
        run: |
          rm -rf -- .p07-private .gov-current
          rm -f -- "$RUNNER_TEMP/p07-diff-paths.txt" "$RUNNER_TEMP/p07-allowed-paths.txt"
          echo P07_D04_FIELD_PROOF_PRIVATE_SOURCE_SANITIZED=PASS
