name: P07 all five Toolbox slots independence candidate
on:
  push:
    branches:
      - task/p07-toolbox-five-slot-proof-20261112
  pull_request:
    branches:
      - feat/p07-toolbox-m05-isolated-20261112
permissions:
  contents: read
jobs:
  five-slot-dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout public distribution candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Chinese slot identity and independent dispatch negative fixtures
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          bash -n installers/p07-toolbox.sh
          python3 -B -m unittest discover -s tests -p 'test_p07_*_isolation.py' -v
          echo P07_FIVE_SLOT_DISPATCH_STATIC=PASS
          echo P07_M05_PUBLIC_ROUTE_NEGATIVE=PASS
          echo P07_OTHER_MODULE_PACKAGE_UPGRADE=NOT_PROVEN
          echo P07_FORMAL_RELEASE=NO
