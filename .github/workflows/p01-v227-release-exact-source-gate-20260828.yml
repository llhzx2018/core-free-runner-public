name: P01 V2.27.0 Release Exact Source Gate
on:
  push:
    branches: [task/p01-v222-multi-surface-gate-20260828]
    paths: ['.github/workflows/p01-v227-release-exact-source-gate-20260828.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SHA: 8c3d18e1243d4b6ddc40bc7922746131a5d0d9c3
      TREE: 6e9fb22d146b6b1e9ab276100331043c8ec647aa
      DEVELOP: d26f9f0e03b49365ffd0b6307d8071c122e79904
      DEVELOP_TREE: 00a3567663d92e71292c2ab3fc0d4f8635a68454
      VERSION: 2.27.0
      SCHEMA: '2026082801'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SHA }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 2
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - name: Release identity fence
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TREE"
          test "$(git rev-parse HEAD^)" = "$DEVELOP"
          test "$(git rev-parse HEAD^^{tree})" = "$DEVELOP_TREE"
          test "$(git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/vf-start.git" refs/heads/release/p01-v2.27.0-20260828|awk '{print $1}')" = "$SHA"
          test "$(tr -d '\r\n' < VERSION)" = "$VERSION"
          test "$(tr -d '\r\n' < src/VERSION.txt)" = "$VERSION"
          grep -F "define('VF_VERSION', '2.27.0');" src/app/bootstrap.php >/dev/null
          grep -F '## V2.27.0 · Formal Release · 2026-08-28' CHANGELOG.md >/dev/null
          mapfile -t ids < <(git diff --name-only "$DEVELOP..$SHA")
          test "${#ids[@]}" -eq 1
          test "${ids[0]}" = 'CHANGELOG.md'
          echo P01_V227_RELEASE_IDENTITY=PASS
      - name: Syntax fresh runtime and workspace productization contract
        shell: bash
        run: |
          set -Eeuo pipefail
          find src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          test -f src/workspace-action.php
          test -f src/assets/workspace.js
          grep -F 'data-open-add' src/app/SurfaceShell.php >/dev/null
          grep -F 'data-bulkbar' src/app/SurfaceShell.php >/dev/null
          grep -F 'data-detail-form' src/app/SurfaceShell.php >/dev/null
          rm -rf /tmp/p01-v227-release /tmp/p01-v227-release.cookies /tmp/p01-v227-release-anon.cookies
          cp -a src /tmp/p01-v227-release
          php -S 127.0.0.1:18332 -t /tmp/p01-v227-release >/tmp/p01-v227-release.log 2>&1 & echo $! >/tmp/p01-v227-release.pid
          trap 'kill "$(cat /tmp/p01-v227-release.pid)" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS -c /tmp/p01-v227-release.cookies -b /tmp/p01-v227-release.cookies http://127.0.0.1:18332/setup.php -o /tmp/p01-v227-release-setup.html && break || sleep 1; done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-v227-release-setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c /tmp/p01-v227-release.cookies -b /tmp/p01-v227-release.cookies -X POST http://127.0.0.1:18332/setup.php --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=V227 Release' --data-urlencode 'admin_password=P01V227!Release' --data-urlencode 'admin_password_confirm=P01V227!Release' -o /tmp/p01-v227-release-post.html
          test -f /tmp/p01-v227-release/app/.runtime.php
          cat >/tmp/p01-v227-release-seed.php <<'PHP'
          <?php
          require '/tmp/p01-v227-release/app/bootstrap.php'; require_once '/tmp/p01-v227-release/app/SurfaceRepository.php';
          $r=new VfRepository(vf_db());$s=new VfSurfaceRepository(vf_db());
          $c=$r->createCategory(['name'=>'Release Gate','description'=>'','is_private'=>false]);
          $a=$r->saveLink(null,['category_id'=>$c,'title'=>'GitHub','url'=>'https://github.com','description'=>'Start fixture','is_private'=>false,'is_favorite'=>true],'manual');
          $b=$r->saveLink(null,['category_id'=>$c,'title'=>'硅谷101','url'=>'https://youtube.com/@v227-release-channel','description'=>'长期内容源','is_private'=>true],'manual');
          $s->upsertProfile((int)$b['id'],['surface'=>'channels','resource_kind'=>'creator','background_friendly'=>true,'note'=>'后台听']);
          $w=$r->saveLink(null,['category_id'=>$c,'title'=>'奥本海默','url'=>'https://example.com/v227-release-watch','description'=>'影视索引','is_private'=>true],'manual');
          $s->upsertProfile((int)$w['id'],['surface'=>'watch','resource_kind'=>'movie','media_year'=>'2023','media_status'=>'want','note'=>'想看']);
          PHP
          php /tmp/p01-v227-release-seed.php
          curl -fsS -c /tmp/p01-v227-release.cookies -b /tmp/p01-v227-release.cookies -H 'Content-Type: application/json' -X POST 'http://127.0.0.1:18332/api.php?action=login' --data '{"password":"P01V227!Release"}' | jq -e '.ok==true' >/dev/null
          curl -fsS -c /tmp/p01-v227-release.cookies -b /tmp/p01-v227-release.cookies http://127.0.0.1:18332/surfaces.php -o /tmp/p01-v227-release-all.html
          grep -F '<h1>全部收藏</h1>' /tmp/p01-v227-release-all.html >/dev/null
          grep -F 'data-open-add' /tmp/p01-v227-release-all.html >/dev/null
          grep -F 'data-bulkbar' /tmp/p01-v227-release-all.html >/dev/null
          grep -F 'workspace.js' /tmp/p01-v227-release-all.html >/dev/null
          curl -fsS -c /tmp/p01-v227-release.cookies -b /tmp/p01-v227-release.cookies http://127.0.0.1:18332/channels.php | grep -F '<h1>Channels</h1>' >/dev/null
          curl -fsS -c /tmp/p01-v227-release.cookies -b /tmp/p01-v227-release.cookies http://127.0.0.1:18332/watch.php | grep -F '<h1>Watch</h1>' >/dev/null
          curl -fsS -c /tmp/p01-v227-release-anon.cookies http://127.0.0.1:18332/ -o /tmp/p01-v227-release-public.html
          ! grep -F 'vf-app-sidebar' /tmp/p01-v227-release-public.html
          php /tmp/p01-v227-release/cli/verify.php | grep -Fx 'VERIFY_PASS=YES'
          php /tmp/p01-v227-release/cli/surface-verify.php | tee /tmp/p01-v227-release-surface.txt
          grep -Fx 'MULTI_SURFACE_PASS=YES' /tmp/p01-v227-release-surface.txt
          grep -Fx "WORKING_SCHEMA=$SCHEMA" /tmp/p01-v227-release-surface.txt
          php /tmp/p01-v227-release/cli/baseline-verify.php | tee /tmp/p01-v227-release-base.txt
          grep -Fx 'BASELINE_CORE_PASS=YES' /tmp/p01-v227-release-base.txt
          grep -Fx 'DRIFT_COUNT=0' /tmp/p01-v227-release-base.txt
          grep -Fx 'UNKNOWN_COUNT=0' /tmp/p01-v227-release-base.txt
          test "$(php -r "require '/tmp/p01-v227-release/app/bootstrap.php';echo strtolower((string)vf_db()->query('PRAGMA integrity_check')->fetchColumn());")" = ok
          test "$(php -r "require '/tmp/p01-v227-release/app/bootstrap.php';echo count(vf_db()->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC));")" = 0
          echo P01_V227_RELEASE_RUNTIME=PASS
      - name: Verdict
        run: |
          echo P01_V227_RELEASE_SOURCE=$SHA
          echo P01_V227_RELEASE_TREE=$TREE
          echo P01_V227_RELEASE_EXACT_SOURCE_GATE=PASS
          echo SCHEMA=$SCHEMA
          echo PRODUCTION=NO
