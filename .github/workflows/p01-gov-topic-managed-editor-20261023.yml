name: P01 GOV-TOPIC managed editor safety one-shot
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-gov-topic-managed-editor-20261023.yml'
permissions:
  contents: read
jobs:
  scoped:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CANDIDATE_SHA: ece1cf47ff5b42f4d351b7a6ab6bd01d0c0b2afa
      REPO: llhzx2018/vf-start
    steps:
      - name: Prepare PHP and Node
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,curl,mbstring,zip,gd,openssl
          coverage: none
      - name: Checkout exact private candidate temporarily
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git init -q candidate
          git -C candidate remote add origin "https://x-access-token:${READ_TOKEN}@github.com/${REPO}.git"
          git -C candidate fetch -q --depth 1 origin "$CANDIDATE_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C candidate remote remove origin
          echo P01_EXACT_MANAGED_EDITOR_SOURCE=PASS
      - name: PHP and JS syntax, managed-source contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          php -l src/workspace-save.php
          php -l src/app/SurfaceShell.php
          php -l tests/unit/gov_topic_managed_editor_contract.php
          node --check src/assets/workspace.js
          php tests/unit/gov_topic_managed_editor_contract.php
          php tests/gov_topic_source_ref_contract.php
          php tests/gov_topic_local_integrity_contract.php
          php tests/unit/workspace_atomic_form_routing_contract.php
          echo P01_MANAGED_EDITOR_SCOPED_SECURITY_GATE=PASS
      - name: Cleanup transient private checkout
        if: always()
        run: |
          rm -rf candidate
          echo P01_PRIVATE_SOURCE_TEMP_CLEANUP=PASS
