name: S01 R10 exact formal release Theme112 M3U8-90
on:
  push:
    branches: [task/s01-r10-candidate-20261013]
    paths: [.github/workflows/s01-r10-formal-release-20261013.yml]
permissions:
  contents: read
  actions: read
jobs:
  s01-formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: task/s01-r10-candidate-20261013
          persist-credentials: false
          path: harness
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 5e3c331b20ec72e82c91c8cd3cd0b5a9d0d5e89e
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: ops
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: 75560304915d2085302f6ac09c4ee57d105dc81c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: m3u8
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 2fd200573cf58d3cf87d81d95bf922e7a5cb4e87
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: theme
      - name: Verify exact candidate proof, current product main, source trees
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p proof
          for n in m3u8 theme; do
            test -f "$n/VERSION"
          done
          test "$(tr -d '[:space:]' < m3u8/VERSION)" = 1.25.90
          test "$(tr -d '[:space:]' < theme/VERSION)" = 1.35.112
          test "$(git -C m3u8 rev-parse HEAD^{tree})" = e7c8d62c53429f1ad19465d696aa7ad150c90e35
          test "$(git -C theme rev-parse HEAD^{tree})" = 204b3b8ba14950235a9153626717740975d0e0b0
          test "$(gh api repos/llhzx2018/vf-tools-m3u8/branches/main --jq .commit.sha)" = 75560304915d2085302f6ac09c4ee57d105dc81c
          test "$(gh api repos/llhzx2018/vf-tools-theme/branches/main --jq .commit.sha)" = 2fd200573cf58d3cf87d81d95bf922e7a5cb4e87
          gh api repos/llhzx2018/core-free-runner-public/actions/runs/38374466299 --jq .conclusion | grep -qx success
          if gh release view v1.25.90 --repo llhzx2018/vf-tools-m3u8 >/dev/null 2>&1; then echo "M3 release tag exists; fail closed"; exit 1; fi
          if gh release view v1.35.112 --repo llhzx2018/vf-tools-theme >/dev/null 2>&1; then echo "Theme release tag exists; fail closed"; exit 1; fi
          echo S01_R10_EXACT_FORMAL_AUTHORITY_PASS
      - name: Rebuild and reverse-check byte-exact candidate packages
        run: |
          set -Eeuo pipefail
          python3 harness/s01-r9-package-preflight.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          expected={
            'vf-tools-m3u8-preflight.zip':'ad6b42a093082db6d477566a4aac47e087d456bf61ba4d3426858ca86467dafa',
            'vf-tools-theme-preflight.zip':'6574f7701b1646d968f1c7605f99b222584912e5d0af23debc6b5c0f66d26745',
          }
          for name,digest in expected.items():
           actual=hashlib.sha256((Path('proof')/name).read_bytes()).hexdigest()
           assert actual==digest,(name,actual,digest)
          print('S01_R10_TESTED_CANDIDATE_ASSET_BYTE_PARITY_PASS')
          PY
          cp proof/vf-tools-m3u8-preflight.zip proof/vf-tools-m3u8_V1.25.90.zip
          cp proof/vf-tools-theme-preflight.zip proof/vf-tools-theme_V1.35.112.zip
      - name: Real WordPress baseline upgrade, rollback, reapply
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p baseline
          gh release download v1.25.89 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.89.zip --dir baseline
          gh release download v1.35.111 --repo llhzx2018/vf-tools-theme --pattern vf-tools-theme_V1.35.111.zip --dir baseline
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php8.3-mysql php8.3-xml php8.3-mbstring php8.3-curl php8.3-zip mariadb-server unzip curl >/dev/null
          sudo service mariadb start >/dev/null
          sudo mariadb -e "CREATE DATABASE s01_r10;CREATE USER 's01'@'localhost' IDENTIFIED BY 'synthetic-only';GRANT ALL ON s01_r10.* TO 's01'@'localhost';FLUSH PRIVILEGES;"
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/s01-r10-wp.phar
          sudo install -m 0755 /tmp/s01-r10-wp.phar /usr/local/bin/wp
          wpdir="$RUNNER_TEMP/s01-r10-wordpress"
          echo "WP_DIR=$wpdir" >> "$GITHUB_ENV"
          mkdir -p "$wpdir"
          wp core download --path="$wpdir" --version=7.1.3 --allow-root >/dev/null
          wp config create --path="$wpdir" --dbname=s01_r10 --dbuser=s01 --dbpass=synthetic-only --dbhost=localhost --skip-check --allow-root >/dev/null
          wp core install --path="$wpdir" --url=http://127.0.0.1:18890 --title='S01 Test' --admin_user=admin --admin_password=synthetic-only --admin_email=synthetic@example.invalid --skip-email --allow-root >/dev/null
          wp theme install baseline/vf-tools-theme_V1.35.111.zip --activate --path="$wpdir" --allow-root >/dev/null
          wp plugin install baseline/vf-tools-m3u8_V1.25.89.zip --activate --path="$wpdir" --allow-root >/dev/null
          wp eval 'update_option("s01_formal_preserve",["ref"=>"keep","v"=>97]);set_theme_mod("s01_formal_keep","untouched");' --path="$wpdir" --allow-root
          wp theme install proof/vf-tools-theme_V1.35.112.zip --force --path="$wpdir" --allow-root >/dev/null
          wp plugin install proof/vf-tools-m3u8_V1.25.90.zip --force --path="$wpdir" --allow-root >/dev/null
          test "$(wp theme get vf-tools-theme --field=version --path="$wpdir" --allow-root)" = 1.35.112
          test "$(wp plugin get vf-tool-m3u8 --field=version --path="$wpdir" --allow-root)" = 1.25.90
          wp theme install baseline/vf-tools-theme_V1.35.111.zip --force --path="$wpdir" --allow-root >/dev/null
          wp plugin install baseline/vf-tools-m3u8_V1.25.89.zip --force --path="$wpdir" --allow-root >/dev/null
          test "$(wp theme get vf-tools-theme --field=version --path="$wpdir" --allow-root)" = 1.35.111
          test "$(wp plugin get vf-tool-m3u8 --field=version --path="$wpdir" --allow-root)" = 1.25.89
          wp theme install proof/vf-tools-theme_V1.35.112.zip --force --path="$wpdir" --allow-root >/dev/null
          wp plugin install proof/vf-tools-m3u8_V1.25.90.zip --force --path="$wpdir" --allow-root >/dev/null
          wp eval 'if(get_option("s01_formal_preserve")!==["ref"=>"keep","v"=>97]||get_theme_mod("s01_formal_keep")!=="untouched")throw new Exception("S01_STATE_LOST");echo "S01_R10_UPGRADE_ROLLBACK_REAPPLY_PASS";' --path="$wpdir" --allow-root
          test "$(wp plugin get vf-tool-m3u8 --field=version --path="$wpdir" --allow-root)" = 1.25.90
          test "$(wp theme get vf-tools-theme --field=version --path="$wpdir" --allow-root)" = 1.35.112
      - name: Publish exact main releases and independently download assets
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh release create v1.25.90 proof/vf-tools-m3u8_V1.25.90.zip --repo llhzx2018/vf-tools-m3u8 --target 75560304915d2085302f6ac09c4ee57d105dc81c --title "VF Tools M3U8 1.25.90" --notes "S01 Provider Browser Stream child validity and Ops Downloader settings snapshot coherence. Exact main source and deterministic asset verified; WordPress upgrade/rollback/reapply PASS. Production upgraded only by OWNER; OWNER final use pending."
          gh release create v1.35.112 proof/vf-tools-theme_V1.35.112.zip --repo llhzx2018/vf-tools-theme --target 2fd200573cf58d3cf87d81d95bf922e7a5cb4e87 --title "VF Tools Theme 1.35.112" --notes "S01 Theme Renderer lazy-load configuration validation, MariaDB readback and frontend consumer consistency. Exact main source and deterministic asset verified; WordPress upgrade/rollback/reapply PASS. Production upgraded only by OWNER; OWNER final use pending."
          mkdir -p remote
          gh release download v1.25.90 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.90.zip --dir remote
          gh release download v1.35.112 --repo llhzx2018/vf-tools-theme --pattern vf-tools-theme_V1.35.112.zip --dir remote
          cmp proof/vf-tools-m3u8_V1.25.90.zip remote/vf-tools-m3u8_V1.25.90.zip
          cmp proof/vf-tools-theme_V1.35.112.zip remote/vf-tools-theme_V1.35.112.zip
          test "$(gh api repos/llhzx2018/vf-tools-m3u8/git/ref/tags/v1.25.90 --jq .object.sha)" = 75560304915d2085302f6ac09c4ee57d105dc81c
          test "$(gh api repos/llhzx2018/vf-tools-theme/git/ref/tags/v1.35.112 --jq .object.sha)" = 2fd200573cf58d3cf87d81d95bf922e7a5cb4e87
          echo S01_R10_FORMAL_RELEASE_REMOTE_ASSETS_AND_TAGS_PASS
      - name: Cleanup private source, release payload, synthetic site
        if: always()
        run: rm -rf harness ops m3u8 theme proof baseline remote "$RUNNER_TEMP/s01-r10-wordpress" /tmp/s01-r10-wp.phar
