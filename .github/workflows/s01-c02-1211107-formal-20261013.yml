name: S01 C02 1.21.1107 formal UI-only WordPress release
on:
  push:
    branches: [task/s01-c02-1211106-real-wp-tools-css-20261012]
    paths: [.github/workflows/s01-c02-1211107-formal-20261013.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_SHA: b5a4227c765729bd74e032f8d8f246b06d125e81
      CANDIDATE_SHA: b9869b959a09670ec9f44992baf2904233bc3b0a
      VERSION: '1.21.1107'
      ASSET_SHA: 3ee84c75a9877241ed911e1ceb5f3991faaeacb4804eb1082d936391f2452745
      TARGET_REPO: llhzx2018/vf-tools-ops
    steps:
      - name: Checkout exact promoted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: b5a4227c765729bd74e032f8d8f246b06d125e81
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product
      - name: Revalidate immutable merge, machine proof, and deterministic package
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$TARGET_SHA"
          test "$(cat product/VERSION)" = "$VERSION"
          git -C product merge-base --is-ancestor "$CANDIDATE_SHA" HEAD
          live_main=$(gh api "repos/$TARGET_REPO/git/ref/heads/main" --jq '.object.sha')
          test "$live_main" = "$TARGET_SHA"
          merged=$(gh api "repos/$TARGET_REPO/pulls/404" --jq '.merge_commit_sha')
          test "$merged" = "$TARGET_SHA"
          mkdir -p proof
          python3 product/.github/release/build-ops-package.py --source product --output "proof/vf-tools-ops_V1.21.1107.zip" > proof/package.json
          python3 product/.github/release/build-ops-package.py --source product --output "proof/rebuild.zip" > proof/rebuild.json
          cmp proof/vf-tools-ops_V1.21.1107.zip proof/rebuild.zip
          echo "$ASSET_SHA  proof/vf-tools-ops_V1.21.1107.zip" | sha256sum -c -
          python3 - <<'PY'
          import json,zipfile
          p=json.load(open('proof/package.json'))
          assert p['version']=='1.21.1107' and p['runtime_files']==990
          assert p['asset_sha256']=='3ee84c75a9877241ed911e1ceb5f3991faaeacb4804eb1082d936391f2452745'
          with zipfile.ZipFile('proof/vf-tools-ops_V1.21.1107.zip') as z:
              assert z.testzip() is None
              assert all(x.startswith('vf-ops/') and '..' not in x.split('/') for x in z.namelist())
          print('EXACT_MERGED_FORMAL_PACKAGE_PASS')
          PY
      - name: Verify public source-candidate WordPress machine run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          proof=$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/38261598951 --jq '.conclusion')
          test "$proof" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/38261598951 --jq '.head_sha')" = addef9f9e735f7da170c2a893ea50c8afca0e8c8
          echo EXACT_PUBLIC_CANDIDATE_MACHINE_PROOF=PASS
      - name: Publish one immutable formal GitHub release
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          if gh release view "v$VERSION" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            echo 'Existing release version cannot be overwritten'; exit 1
          fi
          if gh api "repos/$TARGET_REPO/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo 'Existing tag version cannot be moved'; exit 1
          fi
          cat > proof/release-notes.md <<'NOTES'
          # VF Tools Ops 1.21.1107 · M3U8 Downloader 工具页 CSS 输出修复
          
          本次是只修改 Ops 后台工具页 CSS 输出的可回滚修复。WordPress 中 R17 样式已经存在却没有在实际页面输出时，四个维护入口与六项常用设置会退化成裸排版；现在按 WordPress 原生样式句柄只在工具页输出。
          
          - 主代码：PR #404，精确合并源码 b5a4227c765729bd74e032f8d8f246b06d125e81。
          - 真实隔离测试：Runner #38261598951；WordPress 7.0.2 / 7.1.3、MariaDB、M3U8 1.25.84、四宽度布局、8/8 合成控件交互、1.21.1106→1.21.1107→1.21.1106→1.21.1107 升级回滚及整份 Provider 配置保全通过。
          - 正式 ZIP：vf-tools-ops_V1.21.1107.zip，物理插件目录 vf-ops；SHA-256 3ee84c75a9877241ed911e1ceb5f3991faaeacb4804eb1082d936391f2452745。
          - Schema：6.0.0 不变；无需数据迁移。可从 1.21.1106 升级。升级前保留站点备份，已验证回滚至 1.21.1106。
          - 本次 **没有修改** M3U8 六项参数的保存权限、Nonce、Revision、Provider 事务、Theme、Shell/Header/Menu 或 WordPress 更新协议。六参数真实 POST 保存/拒绝的独立端到端专项测试仍为 UNVERIFIED，不冒充 PASS。
          - Production 仅 OWNER 手工升级；发布、分发与机器测试均不能冒充 Production 已升级或 OWNER 实机最终 UX/UI PASS。
          NOTES
          gh release create "v$VERSION" "proof/vf-tools-ops_V1.21.1107.zip" --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Ops 1.21.1107 · 工具页 CSS 输出修复' --notes-file proof/release-notes.md --latest
          echo FORMAL_RELEASE_CREATED=PASS
      - name: Verify remote release tag and exact asset bytes
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(gh api "repos/$TARGET_REPO/git/ref/tags/v$VERSION" --jq '.object.sha')" = "$TARGET_SHA"
          test "$(gh api "repos/$TARGET_REPO/releases/tags/v$VERSION" --jq '.draft')" = false
          mkdir -p proof/remote
          gh release download "v$VERSION" --repo "$TARGET_REPO" --pattern 'vf-tools-ops_V1.21.1107.zip' --dir proof/remote
          cmp proof/vf-tools-ops_V1.21.1107.zip proof/remote/vf-tools-ops_V1.21.1107.zip
          echo "$ASSET_SHA  proof/remote/vf-tools-ops_V1.21.1107.zip" | sha256sum -c -
          echo REMOTE_ASSET_IMMUTABLE_SHA_READBACK_PASS
      - name: Upload nonsecret proof only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-1107-formal-proof-${{ github.run_id }}
          path: |
            proof/package.json
            proof/rebuild.json
            proof/release-notes.md
          if-no-files-found: warn
          retention-days: 10
