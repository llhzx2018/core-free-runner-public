name: P01 V2.36.3 Bind Candidate PASS
on:
  push:
    branches: [release/p01-v2363-candidate-20260901]
    paths: [.github/workflows/p01-v2363-bind-candidate-pass-20260901.yml]
permissions:
  contents: read
jobs:
  bind:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify live R2 evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, urllib.request
          run=json.load(urllib.request.urlopen('https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/runs/33501907010'))
          if run.get('name')!='P01 V2.36.3 Candidate Readiness R2' or run.get('conclusion')!='success':
              raise SystemExit('R2 run not successful')
          arts=json.load(urllib.request.urlopen('https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/runs/33501907010/artifacts'))
          a=[x for x in arts.get('artifacts',[]) if x.get('id')==9798055642]
          if len(a)!=1: raise SystemExit('R2 artifact missing')
          a=a[0]
          if a.get('digest')!='sha256:39225162784a38693175524142643866e8fafd9ed528324aa5fb4896829eacaa':
              raise SystemExit('R2 artifact digest drift')
          if a.get('expired'): raise SystemExit('R2 artifact expired')
          print('LIVE_R2_EVIDENCE=PASS')
          PY
      - name: Checkout P01 formal-source branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: release/v2.36.3-formal-source-20260901
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
      - name: Bind exact Candidate Readiness R2 PASS
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 'd49a2a2be8c6c0386e03b0c880f1e6024396e4e0'
          test "$(git rev-parse HEAD^{tree})" = '44f62c6eb02d6d4354d33813f9cf3423b295a61c'
          test "$(git rev-parse HEAD:src)" = '820724b585cb59864211f77c4fb33537b2345029'
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('VF_PROJECT.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          if d.get('candidate_version')!='2.36.3': raise SystemExit('candidate version drift')
          if d.get('schema_version')!='2026082901': raise SystemExit('schema drift')
          if d.get('production_version')!='2.36.2': raise SystemExit('owner production drift')
          rc=d.get('v2_36_3_release_candidate') or {}
          if rc.get('base_develop')!='0b2890fed3153086be1c77fe2a3f119264dc24a2': raise SystemExit('release base drift')
          if rc.get('one_frontend_product_pr')!=179 or rc.get('sticky_product_pr')!=176: raise SystemExit('product PR drift')
          d['current_phase']='V2.36.3 CANDIDATE READINESS R2 PASS / FORMAL BIND GATE PENDING'
          d['candidate_state']='CANDIDATE READINESS R2 PASS / FORMAL BIND GATE PENDING'
          d['develop_state']='V2.36.3 FORMAL PATCH SOURCE CANDIDATE PASS / NOT YET STAGED TO DEVELOP'
          d['formal_release_state']='V2.36.2 PUBLISHED + OWNER INSTALLED / KNOWN P0 DEFECT / V2.36.3 CANDIDATE PASS / NOT YET RELEASED'
          d['current_authority']='Owner Production V2.36.2 / Published Latest V2.36.2 / known P0 dual-shell defect / V2.36.3 Candidate Readiness R2 PASS / Formal Bind pending'
          d['next_action']='Run independent V2.36.3 Formal Bind Gate, then create develop-only formal-source PR if PASS. Do not write main, Tag, GitHub Release, core-updates or Owner Production.'
          gate={
            'state':'PASS',
            'candidate':'d49a2a2be8c6c0386e03b0c880f1e6024396e4e0',
            'candidate_tree':'44f62c6eb02d6d4354d33813f9cf3423b295a61c',
            'runtime_tree':'820724b585cb59864211f77c4fb33537b2345029',
            'predecessor':'4fd25a5ce4383dc456e755fc2e031a861d6ff655',
            'predecessor_version':'2.36.2',
            'schema':'2026082901',
            'schema_change':False,
            'migration':None,
            'runtime_delta_count':7,
            'runtime_changed':['VERSION.txt','app/FunctionalWorkspace.php','app/bootstrap.php','assets/workspace-domain-nav.css','index.php','start.php','surface.php'],
            'runtime_added':[],
            'runtime_removed':[],
            'candidate_readiness_run':33501907010,
            'artifact':9798055642,
            'artifact_sha256':'39225162784a38693175524142643866e8fafd9ed528324aa5fb4896829eacaa',
            'full_zip_bytes':587084,
            'full_zip_sha256':'337513f31235d92deba9def79c8b8519502ae26850ef46408df0258c879dd0ca',
            'update_zip_bytes':1236885,
            'update_zip_sha256':'d3eefd09548cc731f3b01de502ce106bc48fe890063aebcfe1a2d6de5ed031c8',
            'repair_php_bytes':3591277,
            'repair_php_sha256':'5ea94b161aa3e8255a1a5330ffc3e8cf57a25166f756e74e6d95dcf6dcc3cb85',
            'candidate_json_bytes':655,
            'candidate_json_sha256':'22097743f203b423f9adf68bb538a1fb6948c484808defa827fac3a42d14fa37',
            'deterministic_artifacts':'PASS',
            'atomic_upgrade':'V2.36.2 -> V2.36.3 PASS',
            'data_preservation':'PASS',
            'fresh_install':'PASS',
            'one_frontend':'390 + 1440 / ANONYMOUS + AUTHENTICATED + LOGOUT / SAME SHELL / PASS',
            'sticky_overlap':'390 + 1440 / OPAQUE STICKY / SCROLL PASS',
            'csp':'PASS',
            'public_start_seo':'PASS',
            'non_start_public_noindex':'PASS',
            'anonymous_private_leak':'NONE / REAL RESULT ROW ASSERTION',
            'sqlite_integrity':'PASS',
            'foreign_key_check':'0',
            'one_frontend_product_gate_run':33499913594,
            'one_frontend_product_gate_artifact':9797277341,
            'one_frontend_product_gate_artifact_sha256':'1c4222918553f10128f53aac296144f485d342072b243a3d8000c881e655c519',
            'sticky_product_gate_run':33491546225,
            'harness_r1_non_product_failure':33501492725,
            'harness_r1_artifact':9797889649,
            'harness_r1_artifact_sha256':'7c32f9c9c4773289e0a2274f5d47cf8eb7bfeea389c9ee93d2b4ce9e14af52bf',
            'harness_r1_classification':'HARNESS-ONLY / page-wide search text assertion falsely treated query echo as private-row leak',
            'visual_readback':'PASS / 390 + 1440 screenshots manually reviewed',
            'release_published':False,
            'main_write':False,
            'core_updates_write':False,
            'owner_production_write':False
          }
          d['v2_36_3_candidate_gate']=gate
          rc.update({
            'candidate_source':gate['candidate'],
            'candidate_tree':gate['candidate_tree'],
            'runtime_tree':gate['runtime_tree'],
            'candidate_readiness_run':gate['candidate_readiness_run'],
            'candidate_readiness_artifact':gate['artifact'],
            'candidate_readiness_artifact_sha256':gate['artifact_sha256'],
            'candidate_readiness_state':'PASS',
            'state':'CANDIDATE READINESS R2 PASS / FORMAL BIND PENDING'
          })
          d['v2_36_3_release_candidate']=rc
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python3 -m json.tool VF_PROJECT.json >/dev/null
          git diff --check
          test "$(git diff --name-only | tr '\n' ' ')" = 'VF_PROJECT.json '
          test "$(git rev-parse HEAD:src)" = '820724b585cb59864211f77c4fb33537b2345029'
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VF_PROJECT.json
          git commit -m 'release(P01): bind V2.36.3 candidate PASS'
          echo "BOUND_SOURCE=$(git rev-parse HEAD)"
          echo "BOUND_TREE=$(git rev-parse HEAD^{tree})"
          echo "BOUND_RUNTIME_TREE=$(git rev-parse HEAD:src)"
          git push origin HEAD:release/v2.36.3-formal-source-20260901
