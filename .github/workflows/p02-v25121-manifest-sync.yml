name: P02 V2.5.121 Source Manifest Sync

on:
  push:
    branches:
      - run/p02-v25121-manifest-sync-20260925
    paths:
      - '.github/workflows/p02-v25121-manifest-sync.yml'
      - 'requests/p02-v25121-manifest-sync.sh'

permissions:
  contents: read

jobs:
  manifest-sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout runner carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner

      - name: Checkout exact P02 V2.5.121 engineering main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 46d0fd07bc977e02bcec626fa97491bd85e42331
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product

      - name: Regenerate and publish manifest-only repair branch
        env:
          VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: bash runner/requests/p02-v25121-manifest-sync.sh
