name: P08 Mode AD exact tested FULL byte parity only
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p08-v018-final-clean-full-mode-ad-proof.yml'
      - 'scripts/p08_v018_final_clean_full_proof.py'
permissions:
  contents: read
concurrency:
  group: p08-v018-final-clean-full-mode-ad-proof
  cancel-in-progress: false
jobs:
  proof:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-v018-final-clean-full-mode-ad-20261128' && github.actor == 'llhzx2018' && github.triggering_actor == 'llhzx2018' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
      P08_ISOLATED_INSTALL_TEST: 'YES'
      TARGET_SHA: b95ccd8062191193bc8971e50fab96c30045e6be
    steps:
      - name: Checkout reviewed one-shot proof harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: harness
      - name: Checkout exact merged P08
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: b95ccd8062191193bc8971e50fab96c30045e6be
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: p08
      - name: Checkout exact effective GOV Mode AD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: f7e967fc6fa590942b7cecfb1407ec25f1eaf320
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: gov
      - name: Native PHP 8.4 and locked Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:2.11.3
          extensions: pdo_sqlite, sqlite3, pdo_mysql, zip, curl, mbstring, intl, bcmath, dom, fileinfo, pcntl, posix
          coverage: none
      - name: Native exact Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
      - name: Single exact FULL regeneration and aggregate runtime parity
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/p08-v018-formal-proof"
          python3 -B harness/scripts/p08_v018_final_clean_full_proof.py
      - name: Always erase private source and temporary product bytes
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          rm -rf -- p08 gov harness "$RUNNER_TEMP/p08-v018-formal-proof" "$RUNNER_TEMP/p08-r43-clean-full-sqlite" "$RUNNER_TEMP/p08-r43-clean-full-mysql" "$RUNNER_TEMP/p08-r43-clean-full-mariadb" "$RUNNER_TEMP"/p08-r43-independent-private-* "$RUNNER_TEMP"/p08-r43-bad-private-* "$RUNNER_TEMP"/p08-r43-snapshot-recovery-*
          test ! -e p08 && test ! -e gov && test ! -e "$RUNNER_TEMP/p08-v018-formal-proof"
          echo P08_MODE_AD_PRIVATE_WORKSPACE_CLEANUP=PASS
