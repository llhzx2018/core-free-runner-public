name: P01 HiFi Product Refinement

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-hifi-refinement.yml'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      EXPECTED_SHA: 54dbd08981c0d53bb29ad6a1c542a18c14ae5b58
    steps:
      - name: Checkout exact P01 candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.EXPECTED_SHA }}
          path: vf-start
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Verify exact SHA and version
        working-directory: vf-start
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          test "$(tr -d '\r\n ' < VERSION)" = "2.47.0"
          echo "HIFI_EXACT_SHA=$actual"
          echo "HIFI_VERSION=2.47.0"

      - name: PHP lint changed product pages and contracts
        working-directory: vf-start
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            src/app/CourseLibraryPage.php \
            src/app/ProjectActionCenterPage.php \
            src/app/ProjectSignalRepository.php \
            src/app/SoftwareWorkspaceHome.php \
            src/app/ToolSceneDetail.php \
            src/app/ToolWorkspaceHome.php \
            src/app/TopicLibraryPage.php \
            tests/unit/hifi_product_pages_contract.php \
            tests/unit/subject_primary_open_contract.php \
            tests/unit/ux02_interaction_contract.php; do
            php -l "$f"
          done

      - name: JS syntax
        working-directory: vf-start
        run: node --check src/assets/workspace-primary-open.js

      - name: HiFi product-pages contract
        working-directory: vf-start
        run: php tests/unit/hifi_product_pages_contract.php

      - name: Primary-open interaction contract
        working-directory: vf-start
        run: php tests/unit/subject_primary_open_contract.php

      - name: Shared UX02 interaction contract
        working-directory: vf-start
        run: php tests/unit/ux02_interaction_contract.php

      - name: UX01 global visual-system regression
        working-directory: vf-start
        run: php tests/unit/ux01_global_visual_system_contract.php

      - name: Subject shell regression
        working-directory: vf-start
        run: php tests/unit/subject_domain_nav_shell_contract.php

      - name: Mobile controls regression
        working-directory: vf-start
        run: php tests/unit/mobile_product_controls_contract.php

      - name: Exact candidate gate
        run: echo "P01_HIFI_EXACT_CANDIDATE_GATE_PASS"

      - name: Cleanup private source
        if: always()
        shell: bash
        run: rm -rf vf-start
