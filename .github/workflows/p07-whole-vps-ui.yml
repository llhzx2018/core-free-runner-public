name: P07 legacy fresh preflight local fail-closed and error reason proof
on:
  pull_request:
    paths: ['.github/workflows/p07-whole-vps-ui.yml']
permissions:
  contents: read
jobs:
  exact-preflight-regression:
    if: ${{ github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Transient exact P07 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: ee2d4c1a8625003964c7c2e8ba8a93154fff9955
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
          fetch-depth: 1
      - name: Verify source-bound local-only guard and safe mixed output
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C product rev-parse HEAD)" = ee2d4c1a8625003964c7c2e8ba8a93154fff9955
          bash -n product/bin/vfops-migrate-ui
          export PYTHONPATH="$PWD/product/lib:$PWD/product"
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s product/tests -p test_migration_fresh_cp2.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s product/tests -p test_p07_fresh_menu.py -v
          echo P07_USED_CP2_PRECHECK_BEFORE_OLD_SOURCE_SSH_SQL_PASS
          echo P07_LEGACY_MIXED_ERROR_REASON_NO_PRIVATE_LOG_LEAK_PASS
      - name: Purge transient private code
        if: always()
        shell: bash
        run: |
          rm -rf -- product
          echo P07_USED_CP2_REGRESSION_SOURCE_CLEANED
