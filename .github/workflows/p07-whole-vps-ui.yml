name: P07 existing CP2 migration safe read-only inspection exact source
on:
  pull_request:
    paths: ['.github/workflows/p07-whole-vps-ui.yml']
permissions:
  contents: read
jobs:
  readonly-existing-task:
    if: ${{ github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Transient exact private P07 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 8210ef6466e4b1e38e032497897b6f873f45761f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
          fetch-depth: 1
      - name: Verify read-only existing task UI and summary without remote or database writes
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C product rev-parse HEAD)" = 8210ef6466e4b1e38e032497897b6f873f45761f
          bash -n product/bin/vfops-migrate-ui
          export PYTHONPATH="$PWD/product:$PWD/product/lib"
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest -v \
            product.tests.test_server_migration_pull.TargetPullContractTests.test_existing_migration_summary_counts_stages_without_business_data \
            product.tests.test_server_migration_pull.TargetPullContractTests.test_existing_migration_summary_malformed_stages_fail_to_other_bucket \
            product.tests.test_p07_fresh_menu.FreshMenuTests.test_existing_18_site_failed_task_opens_readonly_no_resume \
            product.tests.test_p07_fresh_menu.FreshMenuTests.test_existing_whole_vps_prepared_has_no_cutover_button \
            product.tests.test_p07_fresh_menu.FreshMenuTests.test_selected_single_site_requires_explicit_yes_after_inspection \
            product.tests.test_p07_fresh_menu.FreshMenuTests.test_existing_menu_select_uses_inspection_not_auto_resume \
            product.tests.test_p07_fresh_menu.FreshMenuTests.test_existing_task_list_only_opens_readonly_and_counts_all_sites \
            product.tests.test_p07_fresh_menu.FreshMenuTests.test_existing_task_list_cannot_hide_corrupt_migration_state \
            product.tests.test_p07_fresh_menu.FreshMenuTests.test_cutover_and_dns_retry_never_default_to_yes
          echo P07_EXISTING_18_SITE_READONLY_FIRST_NO_REIMPORT_NO_CUTOVER_PASS
      - name: Remove private source after proof
        if: always()
        shell: bash
        run: |
          rm -rf -- product
          echo P07_EXISTING_MIGRATION_READONLY_PRIVATE_SOURCE_CLEANED
