name: P07 official CloudPanel MySQL84 and MariaDB118 on independent free VMs
on:
  pull_request:
    paths: ['.github/workflows/p07-whole-vps-ui.yml']
permissions:
  contents: read
jobs:
  cloudpanel-native:
    if: ${{ github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [MYSQL_8.4, MARIADB_11.8]
    env:
      P07_TEST_ENGINE: ${{ matrix.engine }}
    steps:
      - name: SHA-pinned official CloudPanel installation on disposable hosted VM
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(cat /proc/1/comm)" = systemd || { echo P07_CLOUDPANEL_NATIVE_VM_SYSTEMD_MISSING; exit 1; }
          test "$(. /etc/os-release; echo "$ID-$VERSION_ID")" = ubuntu-24.04
          ENGINE="$P07_TEST_ENGINE"
          case "$ENGINE" in MYSQL_8.4|MARIADB_11.8) ;; *) exit 77;; esac
          if command -v clpctl >/dev/null; then echo P07_CLOUDPANEL_PREEXISTING_CLI_REFUSE; exit 1; fi
          if systemctl is-active --quiet mysql || systemctl is-active --quiet mariadb || systemctl is-active --quiet nginx; then
           echo P07_CLOUDPANEL_PREEXISTING_SERVICE_REFUSE
           exit 1
          fi
          INSTALLER="$RUNNER_TEMP/p07-official-cloudpanel-install.sh"
          curl -fsSL --retry 2 --connect-timeout 15 https://installer.cloudpanel.io/ce/v2/install.sh -o "$INSTALLER"
          echo "8146dbe0a488e7088b04071b0c34d59aa0ab1fe9dcec382d395fd155c9e6c476  $INSTALLER" | sha256sum -c - >/dev/null || { echo P07_OFFICIAL_CLOUDPANEL_INSTALLER_SHA_MISMATCH; exit 1; }
          echo P07_OFFICIAL_CLOUDPANEL_INSTALLER_SHA_PASS
          set +e
          sudo timeout --kill-after=20s 820s env DB_ENGINE="$ENGINE" bash "$INSTALLER" >"$RUNNER_TEMP/p07-cp-private-log" 2>&1
          rc=$?
          set -e
          if ((rc)); then
           printf 'P07_NATIVE_VM_CLOUDPANEL_INSTALL_%s_BLOCKED_RC_%s\n' "$ENGINE" "$rc"
           exit 1
          fi
          command -v clpctl >/dev/null
          test -f /home/clp/htdocs/app/data/db.sq3
          sudo systemctl is-active --quiet nginx
          if [[ "$ENGINE" = MYSQL_8.4 ]]; then
           sudo mysql --version | grep -E '8[.]4[.]' >/dev/null
          else
           sudo mariadb --version | grep -E '11[.]8[.]' >/dev/null
          fi
          printf 'P07_NATIVE_VM_CLOUDPANEL_%s_REAL_CLI_ENGINE_PASS\n' "$ENGINE"
          CI_DOMAIN="p07-free-$(echo "$ENGINE" | tr '[:upper:]' '[:lower:]').example.test"
          CI_USER="p07testrunner"
          CI_PASSWORD="$(openssl rand -hex 20)"
          set +e
          sudo clpctl site:add:static --domainName="$CI_DOMAIN" --siteUser="$CI_USER" --siteUserPassword="$CI_PASSWORD" >"$RUNNER_TEMP/p07-cp-site-private-log" 2>&1
          site_rc=$?
          set -e
          unset CI_PASSWORD
          if ((site_rc)); then
           echo P07_NATIVE_VM_CLOUDPANEL_SITE_CREATION_BLOCKED
           exit 1
          fi
          SITE_ROOT="/home/$CI_USER/htdocs/$CI_DOMAIN"
          test -d "$SITE_ROOT"
          printf 'P07 true CloudPanel synthetic site\n' | sudo tee "$SITE_ROOT/index.html" >/dev/null
          curl --silent --show-error --fail --resolve "$CI_DOMAIN:80:127.0.0.1" "http://$CI_DOMAIN/" | grep -F 'P07 true CloudPanel synthetic site' >/dev/null
          printf 'P07_NATIVE_VM_CLOUDPANEL_%s_STATIC_SITE_HTTP_PASS\n' "$ENGINE"
          echo P07_TRUE_CLOUDPANEL_EPHEMERAL_VM_NO_OWNER_DATA_WRITES
      - name: Erase transient installer and private local logs
        if: always()
        shell: bash
        run: |
          set +e
          rm -f -- "$RUNNER_TEMP/p07-official-cloudpanel-install.sh" "$RUNNER_TEMP/p07-cp-private-log" "$RUNNER_TEMP/p07-cp-site-private-log"
          echo P07_NATIVE_CLOUDPANEL_TEST_LOG_CLEANUP_PASS
