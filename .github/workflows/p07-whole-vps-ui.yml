name: P07 dynamic whole CloudPanel VPS inventory and menu exact-source proof
on:
  pull_request:
    paths: ['.github/workflows/p07-whole-vps-ui.yml']
permissions:
  contents: read
jobs:
  dynamic-inventory:
    if: ${{ github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Transient exact private P07 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: c2a0d0c6baecb5f2705d6b0bb7298c97e4e9a872
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
          fetch-depth: 1
      - name: Verify normal UI no fixed site count, source inventory 18-23 and fail-closed cases
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C product rev-parse HEAD)" = c2a0d0c6baecb5f2705d6b0bb7298c97e4e9a872
          bash -n product/bin/vfops-migrate-ui
          export PYTHONPATH="$PWD/product/lib:$PWD/product"
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s product/tests -p test_user_entry.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s product/tests -p test_server_migration.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s product/tests -p test_server_migration_pull.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s product/tests -p test_p07_fresh_menu.py -v
          echo P07_DYNAMIC_ALL_SOURCE_SITE_INVENTORY_EXACT_SOURCE_PASS
          echo P07_LEGACY_FIXED_SITE_MENU_NOT_ACCESSIBLE_PASS
          echo P07_USED_TARGET_NO_REIMPORT_GUARDS_PRESERVED_PASS
      - name: Remove ephemeral source
        if: always()
        shell: bash
        run: |
          rm -rf -- product
          echo P07_DYNAMIC_INVENTORY_PRIVATE_SOURCE_CLEANED
