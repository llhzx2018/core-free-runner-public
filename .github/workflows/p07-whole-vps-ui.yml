name: P07 interrupted PREPARING no-replay + release116 candidate safety
on:
  pull_request:
    paths: ['.github/workflows/p07-whole-vps-ui.yml']
permissions:
  contents: read
jobs:
  verify-whole-vps:
    if: ${{ github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Exact private source ephemeral checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 7b4f51096e7ddbd11cc9630a61ee24c2305a1e70
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
          fetch-depth: 0
      - name: Verify current whole VPS UI and no-login published installer guard
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C product rev-parse HEAD)" = 7b4f51096e7ddbd11cc9630a61ee24c2305a1e70
          bash -n product/bin/vfops-migrate-ui
          bash -n product/scripts/p07-owner-rc293-isolated-install.sh
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$PWD/product/lib:$PWD/product" python3 -B -m unittest discover -s product/tests -p test_user_entry.py -v
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$PWD/product/lib:$PWD/product" python3 -B -m unittest discover -s product/tests -p test_migration_no_overwrite_resume.py -v
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$PWD/product/lib:$PWD/product" python3 -B -m unittest discover -s product/tests -p test_server_migration_pull.py -v
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$PWD/product/lib:$PWD/product" python3 -B -m unittest discover -s product/tests -p test_p07_public_owner_install.py -v
          echo 'P07_WHOLE_VPS_ALL_SITES_MENU_PASS'
          echo 'P07_PUBLIC_NO_LOGIN_RELEASE_LOCK_TEST_PASS'
          echo 'P07_WHOLE_VPS_NO_SITE_FILTER_OR_LEGACY_17_PASS'
          echo 'P07_WHOLE_VPS_NO_AUTO_CUTOVER_PASS'
      - name: Build and install exact whole-VPS candidate in isolated path
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 7c3f685465b0da9a4414a13b629ea599006019ae
          persist-credentials: false
          path: public-base
          fetch-depth: 1
      - name: Verify installed candidate whole-VPS menu and no stable runtime modifications
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          export P07_RC293_TEST_MODE=1
          export P07_RC293_TEST_SOURCE_SHA="7b4f51096e7ddbd11cc9630a61ee24c2305a1e70"
          export P07_RC293_TEST_PRODUCT="$PWD/product"
          export P07_RC293_TEST_PUBLIC="$PWD/public-base"
          export P07_RC293_TEST_TARGET="$RUNNER_TEMP/p07-rc293-whole-vps-tree"
          export P07_RC293_TEST_LINK="$RUNNER_TEMP/p07-rc293-whole-vps-bin/vfops-rc293"
          bash -n product/scripts/p07-owner-rc293-isolated-install.sh
          bash product/scripts/p07-owner-rc293-isolated-install.sh > "$RUNNER_TEMP/p07-whole-receipt" 2>&1 || {
            cat "$RUNNER_TEMP/p07-whole-receipt"
            exit 1
          }
          grep -F 'P07_RC293_ISOLATED_INSTALL=PASS' "$RUNNER_TEMP/p07-whole-receipt"
          grep -F 'P07_RC293_WHOLE_VPS_MENU=Website_Data_5_Migration_1_ALL_SOURCE_SITES' "$RUNNER_TEMP/p07-whole-receipt"
          test "$("$P07_RC293_TEST_LINK" --build-id)" = 0.1.0-release116-rc1
          grep -F "ui_menu_flow 1 '迁入整个旧 VPS（全部 CloudPanel 网站）'" "$P07_RC293_TEST_TARGET/bin/vfops-migrate-ui"
          grep -F 'bin/vfops-migrate-ui' "$P07_RC293_TEST_TARGET/.runtime-manifest.gitblob"
          test ! -e "$P07_RC293_TEST_TARGET.previous"
          echo 'P07_WHOLE_VPS_INSTALLED_ALL_SITES_RUNTIME_PASS'
      - name: Always clean transient private checkout
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- product public-base
          rm -rf -- "$RUNNER_TEMP/p07-rc293-whole-vps-tree" "$RUNNER_TEMP/p07-rc293-whole-vps-bin"
          rm -f -- "$RUNNER_TEMP/p07-whole-receipt"
          echo 'P07_WHOLE_VPS_PRIVATE_SOURCE_CLEANED'
