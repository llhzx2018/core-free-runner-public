name: P07 free exact-source MySQL84 MariaDB118 isolated machine proof
on:
  pull_request:
    paths: ['.github/workflows/p07-whole-vps-ui.yml']
permissions:
  contents: read
jobs:
  real-engine-synthetic:
    if: ${{ github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exactly current private product, ephemeral only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 4833dc4cab7e1bc17ba82748bf928f0826553b68
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
          fetch-depth: 1
      - name: Start two independent disposable real database engines and test
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C product rev-parse HEAD)" = 4833dc4cab7e1bc17ba82748bf928f0826553b68
          # Never touch a real business database. All test credentials are
          # generated inside the ephemeral job; no credential in Git or logs.
          P07_CI_SYNTH_PWD="$(openssl rand -hex 24)"
          export P07_SYNTHETIC_DB_RESTORE_ONLY=1
          export P07_SYNTHETIC_DB_HOST=127.0.0.1
          export P07_SYNTHETIC_MYSQL_PASSWORD="$P07_CI_SYNTH_PWD"
          export P07_SYNTHETIC_MARIADB_PASSWORD="$P07_CI_SYNTH_PWD"
          export P07_SYNTHETIC_MARIADB=1
          export P07_DB_TEST_HOST=127.0.0.1
          export P07_DB_TEST_PORT=3309
          export P07_DB_TEST_PASSWORD="$P07_CI_SYNTH_PWD"
          cleanup() {
            docker rm -f p07-synthetic-mysql84 p07-synthetic-mariadb118 >/dev/null 2>&1 || true
            unset P07_CI_SYNTH_PWD P07_SYNTHETIC_MYSQL_PASSWORD P07_SYNTHETIC_MARIADB_PASSWORD P07_DB_TEST_PASSWORD
          }
          trap cleanup EXIT
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mariadb-client >/dev/null
          docker run --rm -d --name p07-synthetic-mysql84 \
            -e MYSQL_ROOT_PASSWORD="$P07_CI_SYNTH_PWD" -e MYSQL_ROOT_HOST=% \
            -p 127.0.0.1:3307:3306 mysql:8.4 >/dev/null
          docker run --rm -d --name p07-synthetic-mariadb118 \
            -e MARIADB_ROOT_PASSWORD="$P07_CI_SYNTH_PWD" -e MARIADB_ROOT_HOST=% \
            -p 127.0.0.1:3306:3306 -p 127.0.0.1:3308:3306 \
            -p 127.0.0.1:3309:3306 mariadb:11.8 >/dev/null
          ready=0
          for attempt in $(seq 1 90); do
            if MYSQL_PWD="$P07_CI_SYNTH_PWD" mariadb --no-defaults --protocol=tcp --host=127.0.0.1 --port=3307 --user=root -N -e 'SELECT 1' >/dev/null 2>&1 \
              && MYSQL_PWD="$P07_CI_SYNTH_PWD" mariadb --no-defaults --protocol=tcp --host=127.0.0.1 --port=3308 --user=root -N -e 'SELECT 1' >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1 || { echo 'P07_SYNTHETIC_REAL_ENGINES_NOT_READY'; exit 1; }
          echo 'P07_SYNTHETIC_MYSQL84_AND_MARIADB118_READY'
          export PYTHONPATH="$PWD/product:$PWD/product/lib"
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s product/tests/integration -p test_dual_engine_restore_drill.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s product/tests -p test_migration_laravel_mariadb_engine.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s product/tests -p test_migration_laravel_readonly_engine.py -v
          echo 'P07_SYNTHETIC_CROSS_ENGINE_RESTORE_AND_APP_CONNECTION_PASS'
      - name: Delete transient source and test state
        if: always()
        shell: bash
        run: |
          set +e
          docker rm -f p07-synthetic-mysql84 p07-synthetic-mariadb118 >/dev/null 2>&1
          rm -rf -- product
          echo P07_EPHEMERAL_ENGINE_AND_PRIVATE_SOURCE_CLEANED
