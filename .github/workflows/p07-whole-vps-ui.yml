name: P07 free Runner true CloudPanel VM capability preflight
on:
  pull_request:
    paths: ['.github/workflows/p07-whole-vps-ui.yml']
permissions:
  contents: read
jobs:
  vm-capability:
    if: ${{ github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check capacity for two real CloudPanel virtual machines only
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          mem_kb="$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)"
          free_kb="$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
          cpu="$(nproc)"
          echo "P07_GH_PUBLIC_VM_TEST_CPU=$cpu"
          echo "P07_GH_PUBLIC_VM_TEST_MEMORY_MIB=$((mem_kb/1024))"
          echo "P07_GH_PUBLIC_VM_TEST_STORAGE_GIB=$((free_kb/1048576))"
          if [[ ! -c /dev/kvm || ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo 'P07_VM_HARDWARE_ACCELERATION=UNAVAILABLE'
            echo 'P07_TRUE_CLOUDPANEL_DUAL_VM_TEST=NOT_STARTED'
            exit 0
          fi
          echo 'P07_VM_HARDWARE_ACCELERATION=AVAILABLE'
          if (( mem_kb < 6*1024*1024 || free_kb < 10*1024*1024 || cpu < 2 )); then
            echo 'P07_TRUE_CLOUDPANEL_DUAL_VM_TEST=INSUFFICIENT_CAPACITY'
            exit 0
          fi
          echo 'P07_TRUE_CLOUDPANEL_DUAL_VM_TEST=CAPACITY_PRECHECK_PASS'
