name: P07 failed-prepare protected audit UI exact source
on:
  pull_request:
    paths: ['.github/workflows/p07-whole-vps-ui.yml']
permissions:
  contents: read
jobs:
  protected-failed-prepare-audit:
    if: ${{ github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Ephemeral exact product checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 7c06545cca4ace4b0b62e795eb11c5cf0915f9b0
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
          fetch-depth: 1
      - name: Audit marker and safe CLI tests
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C product rev-parse HEAD)" = 7c06545cca4ace4b0b62e795eb11c5cf0915f9b0
          bash -n product/bin/vfops-migrate-ui
          export PYTHONPATH="$PWD/product:$PWD/product/lib"
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest -v \
            product.tests.test_migration_failed_prepare_audit \
            product.tests.test_p07_fresh_menu.FreshMenuTests.test_failed_single_site_audit_only_on_explicit_yes_and_redacts_secrets \
            product.tests.test_p07_fresh_menu.FreshMenuTests.test_failed_audit_malformed_receipt_never_claims_success \
            product.tests.test_p07_fresh_menu.FreshMenuTests.test_existing_18_site_failed_task_opens_readonly_no_resume \
            product.tests.test_p07_fresh_menu.FreshMenuTests.test_existing_whole_vps_prepared_has_no_cutover_button \
            product.tests.test_p07_fresh_menu.FreshMenuTests.test_existing_task_list_cannot_hide_corrupt_migration_state \
            product.tests.test_server_migration_pull.TargetPullContractTests.test_existing_migration_summary_counts_stages_without_business_data
          echo P07_FAILED_PREPARE_AUDIT_EXACT_SOURCE_NO_DB_WRITES_PASS
          echo P07_FAILED_PREPARE_ONLY_USER_CLICK_NO_RESUME_NO_CUTOVER_PASS
      - name: Remove private checkout
        if: always()
        shell: bash
        run: |
          rm -rf -- product
          echo P07_FAILED_PREPARE_AUDIT_PRIVATE_CHECKOUT_CLEANED
