name: P07 exact latest dynamic-inventory release116 install upgrade rollback
on:
  pull_request:
    paths: ['.github/workflows/p07-whole-vps-ui.yml']
permissions:
  contents: read
jobs:
  release116-candidate:
    if: ${{ github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Transient exact P07 candidate checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 812afe60c4c17d57abe320f528f98cbc245e2405
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
          fetch-depth: 1
      - name: Immutable public release115 baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 7c3f685465b0da9a4414a13b629ea599006019ae
          path: public-base
          persist-credentials: false
          fetch-depth: 1
      - name: Verify offline release116 bundle and real atomic upgrade rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          PRODUCT_SHA=812afe60c4c17d57abe320f528f98cbc245e2405
          PUBLIC_SHA=7c3f685465b0da9a4414a13b629ea599006019ae
          test "$(git -C product rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git -C public-base rev-parse HEAD)" = "$PUBLIC_SHA"
          test "$(cat product/BUILD_ID)" = 0.1.0-release116
          test "$(cat public-base/dist/p07/0.1.0/overlay/BUILD_ID)" = 0.1.0-release115
          export P07_RC293_TEST_MODE=1
          export P07_RC293_TEST_SOURCE_SHA="$PRODUCT_SHA"
          export P07_RC293_TEST_PRODUCT="$PWD/product"
          export P07_RC293_TEST_PUBLIC="$PWD/public-base"
          export P07_RC293_TEST_TARGET="$RUNNER_TEMP/p07-rc293-release116-tree"
          export P07_RC293_TEST_LINK="$RUNNER_TEMP/p07-rc293-release116-bin/vfops"
          bash -n product/scripts/p07-owner-rc293-isolated-install.sh
          export PYTHONPATH="$PWD/product:$PWD/product/lib"
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s product/tests -p test_p07_bundle_identity.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s product/tests -p test_p07_public_owner_install.py -v
          bash product/scripts/p07-owner-rc293-isolated-install.sh >"$RUNNER_TEMP/p07-release116-candidate-proof" 2>&1 || {
            grep -E '^P07_' "$RUNNER_TEMP/p07-release116-candidate-proof" || true
            echo P07_RELEASE116_ISOLATED_INSTALL_FAILED
            exit 1
          }
          grep -F 'P07_RC293_ISOLATED_INSTALL=PASS' "$RUNNER_TEMP/p07-release116-candidate-proof"
          grep -F 'P07_RC293_BUILD=0.1.0-release116' "$RUNNER_TEMP/p07-release116-candidate-proof"
          test "$("$P07_RC293_TEST_LINK" --build-id)" = 0.1.0-release116
          echo P07_FORMAL116_ISOLATED_INSTALL_EXACT_SOURCE_PASS
          CANDIDATE="$RUNNER_TEMP/p07-rc293-formal116-staging"
          python3 -B product/scripts/p07_candidate_bundle.py \
            --product-root product --public-root public-base \
            --output "$CANDIDATE" --product-sha "$PRODUCT_SHA" \
            --build 0.1.0-release116 --care 0.1.0-rc83 >/dev/null
          python3 - "$CANDIDATE" "$PRODUCT_SHA" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1]);expected=sys.argv[2]
          att=json.loads((root/'candidate_attestation.json').read_text())
          assert att['status']=='FORMAL_STAGING_NOT_PUBLISHED'
          assert att['product_source_sha']==expected
          assert att['product_build']=='0.1.0-release116'
          assert att['system_care_build']=='0.1.0-rc83'
          def blob(p):
           b=p.read_bytes()
           return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          tree=root/'dist/p07/0.1.0/overlay'
          assert blob(tree/'RUNTIME.gitblob')==att['runtime_manifest_blob']
          assert blob(tree/'MANIFEST.gitblob')==att['overlay_manifest_blob']
          assert blob(root/'installers/p07-final.sh')==att['final_installer_blob']
          names=['bin/vfops-migrate-ui','lib/server_migration_pull.py','lib/migration_failed_prepare_audit.py','lib/migration_laravel_live_parity.py']
          manifest=(tree/'RUNTIME.gitblob').read_text()
          for name in names:assert ('  '+name+'\n') in manifest
          for line in manifest.splitlines():
           checksum,name=line.split('  ',1)
           assert blob(tree/name)==checksum
          print('P07_RELEASE116_FORMAL_STAGING_MANIFEST_MODULE_CLOSURE_PASS')
          PY
          APP="$RUNNER_TEMP/p07-rc293-upgrade-app"
          OLD="$RUNNER_TEMP/p07-rc293-upgrade-old"
          BIN="$RUNNER_TEMP/p07-rc293-upgrade-bin/vfops"
          mkdir -p "$(dirname "$BIN")"
          P07_ALLOW_NONROOT=1 P07_NO_EXEC=1 \
           P07_INSTALL_DIR="$APP" P07_PREVIOUS_DIR="$OLD" P07_BIN_LINK="$BIN" \
           P07_PUBLIC_ROOT="file://$PWD/public-base" \
           bash public-base/installers/p07.sh >/dev/null
          test "$("$BIN" --build-id)" = 0.1.0-release115
          echo KEEP_OLD_INSTALL_DATA >"$APP/.p07-protected-sentinel"
          python3 - "$CANDIDATE/installers/p07-final.sh" "$RUNNER_TEMP/p07-rc293-fault-copy.sh" <<'PY'
          from pathlib import Path
          import sys
          script=Path(sys.argv[1]).read_text()
          needle='\nNEW_INSTALLED=1\nmkdir -p "$(dirname "$BIN_LINK")"'
          assert script.count(needle)==1
          Path(sys.argv[2]).write_text(script.replace(needle,'\nNEW_INSTALLED=1\nexit 88\nmkdir -p "$(dirname "$BIN_LINK")"'))
          PY
          set +e
          P07_ALLOW_NONROOT=1 P07_NO_EXEC=1 \
           P07_INSTALL_DIR="$APP" P07_PREVIOUS_DIR="$OLD" P07_BIN_LINK="$BIN" \
           P07_PUBLIC_ROOT="file://$CANDIDATE" \
           bash "$RUNNER_TEMP/p07-rc293-fault-copy.sh" >"$RUNNER_TEMP/p07-rc293-fault-receipt" 2>&1
          rc=$?
          set -e
          test "$rc" = 88 || { echo P07_INJECTED_SWAP_FAULT_CODE_UNEXPECTED; exit 1; }
          test "$("$BIN" --build-id)" = 0.1.0-release115
          test "$(cat "$APP/.p07-protected-sentinel")" = KEEP_OLD_INSTALL_DATA
          test ! -e "$OLD"
          test ! -e "$APP.new"
          echo P07_RELEASE116_INJECTED_ATOMIC_SWAP_FAILURE_ROLLBACK_PASS
          P07_ALLOW_NONROOT=1 P07_NO_EXEC=1 \
           P07_INSTALL_DIR="$APP" P07_PREVIOUS_DIR="$OLD" P07_BIN_LINK="$BIN" \
           P07_PUBLIC_ROOT="file://$CANDIDATE" \
           bash "$CANDIDATE/installers/p07.sh" >/dev/null
          test "$("$BIN" --build-id)" = 0.1.0-release116
          test "$(NO_COLOR=1 bash "$OLD/bin/vfops-user" --build-id)" = 0.1.0-release115
          test "$(cat "$OLD/.p07-protected-sentinel")" = KEEP_OLD_INSTALL_DATA
          test ! -e "$APP.new"
          echo P07_RELEASE115_TO_116_ATOMIC_UPGRADE_PREVIOUS_TREE_PRESERVED_PASS
          echo P07_OWNER_SERVER_CHANGES_NONE_UNPUBLISHED
      - name: Always erase source, staged builds and simulated installs
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- product public-base
          rm -rf -- "$RUNNER_TEMP/p07-rc293-release116-tree" "$RUNNER_TEMP/p07-rc293-release116-bin"
          rm -rf -- "$RUNNER_TEMP/p07-rc293-formal116-staging"
          rm -rf -- "$RUNNER_TEMP/p07-rc293-upgrade-app" "$RUNNER_TEMP/p07-rc293-upgrade-old" "$RUNNER_TEMP/p07-rc293-upgrade-bin"
          rm -f -- "$RUNNER_TEMP/p07-release116-candidate-proof" "$RUNNER_TEMP/p07-rc293-fault-copy.sh" "$RUNNER_TEMP/p07-rc293-fault-receipt"
          echo P07_RELEASE116_PRIVATE_SOURCE_AND_STAGED_ASSETS_CLEANED
