name: P07 full-source re-inventory drift guard exact source
on:
  pull_request:
    paths: ['.github/workflows/p07-whole-vps-ui.yml']
permissions:
  contents: read
jobs:
  site-scope-drift:
    if: ${{ github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact product source temporarily
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: b12883a795a4013494f33b9544e8454145b02048
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
          fetch-depth: 1
      - name: Run new full-scope drift tests and affected asset refresh paths
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C product rev-parse HEAD)" = b12883a795a4013494f33b9544e8454145b02048
          export PYTHONPATH="$PWD/product:$PWD/product/lib"
          python3 -B -m unittest -v \
            product.tests.test_server_migration_pull.TargetPullContractTests.test_refresh_all_source_rechecks_entire_cloudpanel_scope \
            product.tests.test_server_migration_pull.TargetPullContractTests.test_refresh_all_source_rejects_added_removed_and_duplicate_sites \
            product.tests.test_server_migration_pull.TargetPullContractTests.test_refresh_selected_site_keeps_filtered_scope \
            product.tests.test_server_migration_pull.TargetPullContractTests.test_refresh_migration_assets_adds_sqlite_and_runtime_changes \
            product.tests.test_server_migration_pull.TargetPullContractTests.test_refresh_migration_assets_blocks_selected_site_structure_drift
          echo P07_FULL_SOURCE_SNAPSHOT_DRIFT_NEGATIVE_PROOF_PASS
          echo P07_EXISTING_SELECTED_SITE_REFRESH_COMPAT_PASS
      - name: Remove ephemeral private checkout
        if: always()
        shell: bash
        run: |
          rm -rf -- product
          echo P07_SITE_DRIFT_PRIVATE_SOURCE_CLEANED
