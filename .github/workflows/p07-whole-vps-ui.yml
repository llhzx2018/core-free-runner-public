name: P07 official CloudPanel real VM supported OS database proof
on:
  pull_request:
    paths: ['.github/workflows/p07-whole-vps-ui.yml']
permissions:
  contents: read
jobs:
  real-cloudpanel-vm:
    if: ${{ github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [MYSQL_8.4, MARIADB_11.8]
    env:
      P07_TEST_DB_ENGINE: ${{ matrix.engine }}
    steps:
      - name: Official SHA-pinned installer after required apt preparation
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          ENGINE="$P07_TEST_DB_ENGINE"
          case "$ENGINE" in MYSQL_8.4|MARIADB_11.8) ;; *) exit 13;; esac
          test "$(. /etc/os-release; echo "$ID-$VERSION_ID")" = ubuntu-24.04
          test "$(cat /proc/1/comm)" = systemd
          if command -v clpctl >/dev/null; then echo P07_CLOUDPANEL_EXISTING_INSTALL_REFUSED; exit 13; fi
          if systemctl is-active --quiet nginx mysql mariadb; then echo P07_CLOUDPANEL_PREEXISTING_SERVICE_REFUSED; exit 13; fi
          printf 'P07_CLOUDPANEL_OFFICIAL_VM_ENGINE=%s\n' "$ENGINE"
          echo "P07_CLOUDPANEL_VM_MEMORY_MIB=$(awk '/MemAvailable:/ {printf "%d", $2/1024}' /proc/meminfo)"
          echo "P07_CLOUDPANEL_VM_DISK_GIB=$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {printf "%d", $4/1048576}')"
          sudo apt-get update -qq >"$RUNNER_TEMP/p07-apt-setup-private.log" 2>&1 || { echo P07_CLOUDPANEL_VM_APT_UPDATE_BLOCKED; exit 14; }
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl wget sudo ca-certificates openssl >/dev/null 2>&1 || { echo P07_CLOUDPANEL_VM_PREREQUISITES_BLOCKED; exit 14; }
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get -y -qq upgrade >"$RUNNER_TEMP/p07-apt-upgrade-private.log" 2>&1 || { echo P07_CLOUDPANEL_VM_APT_UPGRADE_BLOCKED; exit 14; }
          INSTALLER="$RUNNER_TEMP/p07-official-install.sh"
          curl --fail --silent --show-error --retry 2 --connect-timeout 15 --location https://installer.cloudpanel.io/ce/v2/install.sh -o "$INSTALLER"
          printf '%s  %s\n' "8146dbe0a488e7088b04071b0c34d59aa0ab1fe9dcec382d395fd155c9e6c476" "$INSTALLER" | sha256sum -c - >/dev/null || { echo P07_OFFICIAL_INSTALLER_SHA_MISMATCH_STOP; exit 15; }
          echo P07_CLOUDPANEL_OFFICIAL_INSTALLER_HASH_PASS
          set +e
          sudo timeout --signal=TERM --kill-after=20s 900s env DEBIAN_FRONTEND=noninteractive DB_ENGINE="$ENGINE" bash "$INSTALLER" >"$RUNNER_TEMP/p07-official-install-private.log" 2>&1
          rc=$?
          set -e
          if ((rc != 0)); then
           python3 - "$RUNNER_TEMP/p07-official-install-private.log" <<'PY'
          import re,sys
          from pathlib import Path
          s=Path(sys.argv[1]).read_text(errors='replace')[-200000:]
          patterns={
           'P07_INSTALL_REQUIRES_PUBLIC_IP':r'public ip|external ip|ip address.+(not|missing)|could not get.*ip',
           'P07_INSTALL_HOSTNAME_OR_DNS':r'hostname|resolv|dns failure|temporary failure in name resolution',
           'P07_INSTALL_UNSUPPORTED_ENVIRONMENT':r'container|virtualization|not support|unsupported|prerequisite|system requirement',
           'P07_INSTALL_APT_REPOSITORY':r'failed to fetch|unable to locate package|apt-get|apt update|apt install|NO_PUBKEY|dpkg',
           'P07_INSTALL_NETWORK':r'connection refused|connection timed out|could not resolve host|unable to connect',
           'P07_INSTALL_STORAGE':r'not enough space|no space left|disk space',
           'P07_INSTALL_SERVICE':r'failed to start|systemctl|service.+failed|systemd',
          }
          match=[name for name,pat in patterns.items() if re.search(pat,s,re.I)]
          print('P07_INSTALL_FAILURE_CLASSES='+(';'.join(match) if match else 'UNCLASSIFIED'))
          print('P07_INSTALL_PRIVATE_LOG_EXPOSURE=NONE')
          PY
           printf 'P07_OFFICIAL_INSTALL_%s_FAILED_RC_%s\n' "$ENGINE" "$rc"
           exit 1
          fi
          command -v clpctl >/dev/null || { echo P07_INSTALLED_CLI_MISSING; exit 1; }
          sudo systemctl is-active --quiet nginx || { echo P07_INSTALLED_NGINX_INACTIVE; exit 1; }
          printf 'P07_OFFICIAL_INSTALL_%s_CLI_NGINX_PASS\n' "$ENGINE"
          sudo clpctl --help >/dev/null 2>&1 || { echo P07_INSTALLED_CLI_HELP_FAILED; exit 1; }
          echo P07_NATIVE_VM_CLOUDPANEL_EXECUTION_CAPABILITY_PASS
      - name: Erase ephemeral private installer and logs
        if: always()
        shell: bash
        run: |
          set +e
          rm -f -- "$RUNNER_TEMP/p07-official-install-private.log" "$RUNNER_TEMP/p07-official-install.sh" "$RUNNER_TEMP/p07-apt-setup-private.log" "$RUNNER_TEMP/p07-apt-upgrade-private.log"
          echo P07_REAL_VM_PRIVATE_INSTALL_LOGS_CLEANED
