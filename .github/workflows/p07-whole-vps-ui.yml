name: P07 free loopback SSH rsync SQLite static transfer machine proof
on:
  pull_request:
    paths: ['.github/workflows/p07-whole-vps-ui.yml']
permissions:
  contents: read
jobs:
  synthetic-ssh:
    if: ${{ github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Exact private product transient checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 4833dc4cab7e1bc17ba82748bf928f0826553b68
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
          fetch-depth: 1
      - name: Real loopback sshd and P07 SSH/rsync/SQLite/HTTP synthetic test
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C product rev-parse HEAD)" = 4833dc4cab7e1bc17ba82748bf928f0826553b68
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq openssh-server openssh-client rsync >/dev/null
          SSHD_ROOT="$RUNNER_TEMP/p07-private-sshd"
          SOURCE_ROOT="$RUNNER_TEMP/p07-synthetic-source"
          mkdir -p "$SSHD_ROOT" "$SOURCE_ROOT"
          chmod 700 "$SSHD_ROOT"
          ssh-keygen -q -t ed25519 -N '' -f "$SSHD_ROOT/client_key"
          ssh-keygen -q -t ed25519 -N '' -f "$SSHD_ROOT/host_key"
          cp -- "$SSHD_ROOT/client_key.pub" "$SSHD_ROOT/authorized_keys"
          chmod 600 "$SSHD_ROOT/client_key" "$SSHD_ROOT/host_key" "$SSHD_ROOT/authorized_keys"
          TEST_USER="$(id -un)"
          {
            printf 'Port 2222\nListenAddress 127.0.0.1\n'
            printf 'HostKey %s\n' "$SSHD_ROOT/host_key"
            printf 'PidFile %s\n' "$SSHD_ROOT/sshd.pid"
            printf 'AuthorizedKeysFile %s\n' "$SSHD_ROOT/authorized_keys"
            printf 'AllowUsers %s\n' "$TEST_USER"
            printf 'PubkeyAuthentication yes\nPasswordAuthentication no\nKbdInteractiveAuthentication no\n'
            printf 'PermitRootLogin no\nUsePAM no\nStrictModes no\n'
            printf 'AllowTcpForwarding no\nX11Forwarding no\nPermitTunnel no\n'
            printf 'LogLevel ERROR\n'
          } > "$SSHD_ROOT/sshd_config"
          chmod 600 "$SSHD_ROOT/sshd_config"
          sudo install -d -m 0755 /run/sshd
          sudo /usr/sbin/sshd -t -f "$SSHD_ROOT/sshd_config"
          sudo /usr/sbin/sshd -f "$SSHD_ROOT/sshd_config" -E "$SSHD_ROOT/sshd.log"
          ssh -p 2222 -i "$SSHD_ROOT/client_key" \
            -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            -o "UserKnownHostsFile=$SSHD_ROOT/known_hosts" \
            "$TEST_USER@127.0.0.1" true >/dev/null
          echo P07_LOOPBACK_REAL_SSH_KEY_AUTH_PASS
          P07_TEST_SSH_KEY="$SSHD_ROOT/client_key" \
          P07_TEST_SSH_USER="$TEST_USER" \
          P07_TEST_SOURCE_DIR="$SOURCE_ROOT" \
          PYTHONPATH="$PWD/product/lib:$PWD/product" \
          PYTHONDONTWRITEBYTECODE=1 python3 -B - <<'PY'
          import hashlib
          import os
          from functools import partial
          from http.server import ThreadingHTTPServer, SimpleHTTPRequestHandler
          from pathlib import Path
          import shlex
          import sqlite3
          import threading
          import urllib.request
          import server_migration_pull as pull

          root = Path(os.environ["P07_TEST_SOURCE_DIR"])
          src = root / "site"
          src.mkdir(parents=True)
          (src / "index.html").write_text("<h1>P07 source static page</h1>\n", encoding="utf-8")
          (src / "site.css").write_text("h1 {color: teal}\n", encoding="utf-8")
          dbdir = root / "sqlite"
          dbdir.mkdir()
          live = dbdir / "live.db"
          con = sqlite3.connect(live)
          con.execute("CREATE TABLE entries (id INTEGER PRIMARY KEY, title TEXT)")
          con.executemany("INSERT INTO entries VALUES (?,?)", [(1, "alpha"), (2, "beta"), (3, "你好")])
          con.commit()
          con.close()

          source = {"host":"127.0.0.1", "ip":"127.0.0.1",
                    "ssh_user":os.environ["P07_TEST_SSH_USER"], "ssh_port":2222,
                    "identity_file":os.environ["P07_TEST_SSH_KEY"], "ssh":"ssh"}
          target = Path(os.environ["RUNNER_TEMP"]) / "p07-isolated-receiver"
          site = target / "site"
          site.mkdir(parents=True)
          pull.pull_path(source, str(src) + "/", site, delete=False)
          assert (site / "index.html").read_bytes() == (src / "index.html").read_bytes()
          assert (site / "site.css").read_bytes() == (src / "site.css").read_bytes()
          assert hashlib.sha256((site / "index.html").read_bytes()).digest() == hashlib.sha256((src / "index.html").read_bytes()).digest()
          print("P07_REAL_SSH_RSYNC_FILE_CONTENT_AND_SHA256_PASS", flush=True)

          snap = dbdir / "consistent-snapshot.db"
          code = ("import sqlite3;"
                  f"src=sqlite3.connect({str(live)!r});"
                  f"dst=sqlite3.connect({str(snap)!r});"
                  "src.backup(dst);dst.close();src.close()")
          pull.source_remote(source, "python3 -c " + shlex.quote(code), timeout=30)
          local_snap = target / "consistent-snapshot.db"
          pull.pull_path(source, str(snap), local_snap)
          con = sqlite3.connect(f"file:{local_snap}?mode=ro", uri=True)
          try:
              assert con.execute("PRAGMA quick_check").fetchone()[0] == "ok"
              assert con.execute("SELECT COUNT(*) FROM entries").fetchone()[0] == 3
              assert con.execute("SELECT title FROM entries WHERE id=3").fetchone()[0] == "你好"
          finally:
              con.close()
          print("P07_REAL_SSH_SQLITE_CONSISTENT_BACKUP_TRANSFER_PASS", flush=True)

          server = ThreadingHTTPServer(("127.0.0.1",0),partial(SimpleHTTPRequestHandler,directory=str(site)))
          th = threading.Thread(target=server.serve_forever, daemon=True)
          th.start()
          try:
              req = urllib.request.Request(
                  f"http://127.0.0.1:{server.server_port}/",
                  headers={"Host":"site.example.test"},
              )
              body = urllib.request.urlopen(req, timeout=5).read()
              assert b"P07 source static page" in body
          finally:
              server.shutdown()
              server.server_close()
          print("P07_TRANSFERRRED_STATIC_HTTP_HOST_HEADER_PASS",flush=True)

          try:
              pull.pull_path(source, "relative-refused", target / "should-not-exist")
          except pull.PullMigrationError:
              pass
          else:
              raise AssertionError("RELATIVE_REMOTE_PATH_NOT_REJECTED")
          assert not (target / "should-not-exist").exists()
          print("P07_UNSAFE_REMOTE_PATH_REJECTED_PASS", flush=True)
          PY
      - name: Always remove private source and ephemeral sshd
        if: always()
        shell: bash
        run: |
          set +e
          SSHD_ROOT="$RUNNER_TEMP/p07-private-sshd"
          if [[ -f "$SSHD_ROOT/sshd.pid" ]]; then
            sudo kill -TERM "$(cat "$SSHD_ROOT/sshd.pid")" >/dev/null 2>&1 || true
          fi
          rm -rf -- product "$RUNNER_TEMP/p07-private-sshd" "$RUNNER_TEMP/p07-synthetic-source" "$RUNNER_TEMP/p07-isolated-receiver"
          echo P07_EPHEMERAL_REAL_SSH_AND_PRIVATE_SOURCE_CLEANED
