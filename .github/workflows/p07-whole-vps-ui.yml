name: P07 whole VPS unfiltered pull UI regression
on:
  pull_request:
    paths: ['.github/workflows/p07-whole-vps-ui.yml']
permissions:
  contents: read
jobs:
  verify-whole-vps:
    if: ${{ github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Exact private source ephemeral checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 99014947bcfb926dabcc0c264d9105c2c94462c4
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
          fetch-depth: 1
      - name: Verify default whole VPS UI, abort and conflict paths
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C product rev-parse HEAD)" = 99014947bcfb926dabcc0c264d9105c2c94462c4
          bash -n product/bin/vfops-migrate-ui
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$PWD/product" python3 -B -m unittest discover -s product/tests -p test_user_entry.py -v
          echo 'P07_WHOLE_VPS_ALL_SITES_MENU_PASS'
          echo 'P07_WHOLE_VPS_NO_SITE_FILTER_OR_LEGACY_17_PASS'
          echo 'P07_WHOLE_VPS_NO_AUTO_CUTOVER_PASS'
      - name: Always clean transient private checkout
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- product
          echo 'P07_WHOLE_VPS_PRIVATE_SOURCE_CLEANED'
