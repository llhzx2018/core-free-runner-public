name: P02 V2.5.50 Full UX Regression

on:
  push:
    branches:
      - run/p02-v2550-full-ux-20260920
    paths:
      - '.github/workflows/p02-v2550-full-ux.yml'

permissions:
  contents: read

jobs:
  ux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_SHA: d35bb778ad767d7d2d8339e8664edcae5cd85c93
      TARGET_VERSION: 2.5.50
    steps:
      - name: Checkout exact P02 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: d35bb778ad767d7d2d8339e8664edcae5cd85c93
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product

      - name: Install runtime and Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-zip sqlite3 curl
          cd product
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Full exact-source UX regression
        shell: bash
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "$TARGET_VERSION"
          bash scripts/verify-repository.sh
          bash scripts/ux-browser-reverify.sh
          echo P02_V2550_FULL_UX_REGRESSION=PASS
