name: P07 five module toolbox M05 isolated dispatch proof
on:
  push:
    branches:
      - task/p07-toolbox-m05-proof-20261112
  pull_request:
    branches:
      - feat/p07-toolbox-m05-isolated-20261112
permissions:
  contents: read
jobs:
  m05-dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact public distribution candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Confirm only M05 route and synthetic dispatch
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          bash -n installers/p07-toolbox.sh
          python3 -B -m unittest discover -s tests -p 'test_p07_m05_toolbox_isolation.py' -v
          echo P07_M05_TOOLBOX_ROUTE_ISOLATED=PASS
          echo P07_OTHER_MODULE_INSTALLERS_NOT_CALLED=PASS_SYNTHETIC
          echo P07_REAL_DISTRIBUTION=NOT_RELEASED
