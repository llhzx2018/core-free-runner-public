name: P01 UI Control Geometry One-shot 1588
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-control-geometry-1588.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl,mbstring,sqlite3,pdo_sqlite,SimpleXML,zip
          coverage: none
      - name: Retrieve exact candidate
        shell: bash
        env:
          TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$TOKEN"
          ROOT="$RUNNER_TEMP/p01-1588"
          echo "P01_WORK=$ROOT" >> "$GITHUB_ENV"
          git clone -q --no-checkout "https://x-access-token:${TOKEN}@github.com/llhzx2018/vf-start.git" "$ROOT"
          git -C "$ROOT" checkout -q --detach 3f0a410258d4db81f42919064afd7ed5a4420872
          git -C "$ROOT" remote set-url origin https://github.com/llhzx2018/vf-start.git
          test "$(git -C "$ROOT" rev-parse HEAD)" = 3f0a410258d4db81f42919064afd7ed5a4420872
      - name: Focused shared component gate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$P01_WORK"
          php -l src/app/ChannelLibraryPage.php
          php tests/unit/p01_shared_control_geometry_contract.php
          php tests/unit/channels_reader_r4_single_toolbar_contract.php
          php tests/unit/channels_owner_video_manual_sync_native.php
          node --check tests/integration/p01_control_geometry_cross_page_browser.mjs
          echo P01_SHARED_CONTROL_FOCUSED=PASS
      - name: Prepare isolated installed fixture and browser
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$P01_WORK/src"
          php -S 127.0.0.1:18621 -t . > "$P01_WORK/local-php.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS -c "$P01_WORK/cookies" -b "$P01_WORK/cookies" http://127.0.0.1:18621/setup.php -o "$P01_WORK/setup.html"; then break; fi
            sleep 1
          done
          CSRF=$(python3 - "$P01_WORK/setup.html" <<'PY'
          import re,sys
          raw=open(sys.argv[1],encoding="utf-8").read()
          value=re.search(r'name="setup_csrf"\s+value="([^"]+)"',raw)
          assert value,'Synthetic setup CSRF missing'
          print(value.group(1))
          PY
          )
          curl -fsS -c "$P01_WORK/cookies" -b "$P01_WORK/cookies" -X POST http://127.0.0.1:18621/setup.php \
            --data-urlencode "setup_csrf=$CSRF" \
            --data-urlencode "site_title=VF Synthetic UI Audit" \
            --data-urlencode "admin_password=IsolatedAudit2026" \
            --data-urlencode "admin_password_confirm=IsolatedAudit2026" \
            -o "$P01_WORK/setup-post.html"
          test -f app/.runtime.php
          cd "$P01_WORK"
          P01_SYNTHETIC_PAGINATION=YES php tests/integration/p01_populated_pagination_fixture.php
          npm install --no-save --ignore-scripts --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Source-driven cross-page Chromium control geometry
        shell: bash
        env:
          P01_TEST_ORIGIN: http://127.0.0.1:18621
          P01_TEST_PASSWORD: IsolatedAudit2026
        run: |
          set -Eeuo pipefail
          cd "$P01_WORK"
          node tests/integration/p01_control_geometry_cross_page_browser.mjs
          echo P01_CROSS_PAGE_CHROMIUM=PASS
