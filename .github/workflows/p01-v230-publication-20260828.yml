name: P01 V2.23.0 Publication
on:
  push:
    branches: [task/p01-v222-multi-surface-gate-20260828]
    paths: ['.github/workflows/p01-v230-publication-20260828.yml']
permissions:
  contents: read
env:
  PRODUCT_REPO: llhzx2018/vf-start
  UPDATES_REPO: llhzx2018/core-updates
  RUNNER_REPO: llhzx2018/core-free-runner-public
  MAIN_COMMIT: 8bbb51b38bddd769613b12dd6bf015b784c89f86
  RELEASE_SOURCE: 6e7d30e6ea0c8f5f70076a69b0d1e6fb9be620b2
  RELEASE_TREE: 8bc7b4c2f643566d3688ecdeda74a47c320cbc2f
  VERSION: 2.23.0
  SOURCE_VERSION: 2.22.1
  SCHEMA: '2026082801'
  TAG: v2.23.0
  RELEASE_GATE: '33147285602'
  ARTIFACT_GATE: '33147403831'
  PROMOTION_GATE: '33147450050'
  ARTIFACT_ID: '9676306756'
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Exact main and release source fence
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          rm -rf product
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/${PRODUCT_REPO}.git" product
          test "$(git -C product rev-parse origin/main)" = "$MAIN_COMMIT"
          test "$(git -C product rev-parse "$MAIN_COMMIT^{tree}")" = "$RELEASE_TREE"
          git -C product cat-file -e "$RELEASE_SOURCE^{commit}"
          test "$(git -C product rev-parse "$RELEASE_SOURCE^{tree}")" = "$RELEASE_TREE"
          git -C product merge-base --is-ancestor "$RELEASE_SOURCE" "$MAIN_COMMIT"
          test "$(git -C product show "$RELEASE_SOURCE:VERSION"|tr -d '\r\n')" = "$VERSION"
          for run in "$RELEASE_GATE" "$ARTIFACT_GATE" "$PROMOTION_GATE"; do gh api "repos/${RUNNER_REPO}/actions/runs/$run" | jq -e '.status=="completed" and .conclusion=="success"' >/dev/null; done
          echo P01_V230_PUBLICATION_FENCE=PASS
      - name: Fetch exact formal artifacts
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api "repos/${RUNNER_REPO}/actions/artifacts/${ARTIFACT_ID}" >/tmp/meta.json
          jq -e '.name=="P01-V2.23.0-FORMAL-ARTIFACTS" and .expired==false' /tmp/meta.json >/dev/null
          rm -rf /tmp/p01-v230-publish /tmp/p01-v230-artifact.zip; mkdir -p /tmp/p01-v230-publish
          gh api --method GET "repos/${RUNNER_REPO}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/p01-v230-artifact.zip
          unzip -q /tmp/p01-v230-artifact.zip -d /tmp/p01-v230-publish
          FULL=$(find /tmp/p01-v230-publish -type f -name 'VF-Start-V2.23.0-FULL.zip' -print -quit)
          UPDATE=$(find /tmp/p01-v230-publish -type f -name 'VF-Start-V2.23.0-UPDATE.zip' -print -quit)
          LEGACY=$(find /tmp/p01-v230-publish -type f -name 'VF_Start_V2.23.0_UPDATE.zip' -print -quit)
          REPAIR=$(find /tmp/p01-v230-publish -type f -name 'server-update-v2.23.0-repair.php' -print -quit)
          GATE=$(find /tmp/p01-v230-publish -type f -name 'P01-V2.23.0-RELEASE-GATE.json' -print -quit)
          ARTGATE=$(find /tmp/p01-v230-publish -type f -name 'P01-V2.23.0-ARTIFACT-GATE.json' -print -quit)
          SUMS=$(find /tmp/p01-v230-publish -type f -name 'SHA256SUMS.txt' -print -quit)
          for f in "$FULL" "$UPDATE" "$LEGACY" "$REPAIR" "$GATE" "$ARTGATE" "$SUMS"; do test -f "$f"; done
          jq -e --arg s "$RELEASE_SOURCE" --arg t "$RELEASE_TREE" '.status=="PASS" and .version=="2.23.0" and .source_version=="2.22.1" and .candidate==$s and .candidate_tree==$t and .schema=="2026082801" and .schema_change==false and .online_upgrade=="PASS" and .unified_ui=="PASS"' "$GATE" >/dev/null
          test "$(unzip -Z1 "$LEGACY" | wc -l)" -eq 1
          unzip -Z1 "$LEGACY" | grep -Fxq 'repair-v2.23.0.php'
          FULL_SHA=$(sha256sum "$FULL"|awk '{print $1}'); UPDATE_SHA=$(sha256sum "$UPDATE"|awk '{print $1}'); LEGACY_SHA=$(sha256sum "$LEGACY"|awk '{print $1}'); REPAIR_SHA=$(sha256sum "$REPAIR"|awk '{print $1}')
          FULL_BYTES=$(stat -c %s "$FULL"); UPDATE_BYTES=$(stat -c %s "$UPDATE"); LEGACY_BYTES=$(stat -c %s "$LEGACY"); REPAIR_BYTES=$(stat -c %s "$REPAIR")
          printf 'FULL=%s\nUPDATE=%s\nLEGACY=%s\nREPAIR=%s\nGATE=%s\nARTGATE=%s\nSUMS=%s\nFULL_SHA=%s\nUPDATE_SHA=%s\nLEGACY_SHA=%s\nREPAIR_SHA=%s\nFULL_BYTES=%s\nUPDATE_BYTES=%s\nLEGACY_BYTES=%s\nREPAIR_BYTES=%s\n' "$FULL" "$UPDATE" "$LEGACY" "$REPAIR" "$GATE" "$ARTGATE" "$SUMS" "$FULL_SHA" "$UPDATE_SHA" "$LEGACY_SHA" "$REPAIR_SHA" "$FULL_BYTES" "$UPDATE_BYTES" "$LEGACY_BYTES" "$REPAIR_BYTES" >> "$GITHUB_ENV"
          echo P01_V230_EXACT_ARTIFACTS=PASS
      - name: Create immutable tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          if gh api "repos/${PRODUCT_REPO}/git/ref/tags/${TAG}" >/tmp/tag.json 2>/dev/null; then test "$(jq -r '.object.sha' /tmp/tag.json)" = "$RELEASE_SOURCE"; else gh api --method POST "repos/${PRODUCT_REPO}/git/refs" -f ref="refs/tags/${TAG}" -f sha="$RELEASE_SOURCE" >/tmp/tag.json; fi
          test "$(jq -r '.object.sha' /tmp/tag.json)" = "$RELEASE_SOURCE"
          cat >/tmp/notes.md <<'EOF'
          VF Start V2.23.0 正式落地 Unified Surface UI。

          - 修复 V2.22.x Multi-Surface 功能存在但主页仍像旧导航 / Preview 的交付缺口。
          - 管理员访问 `/` 进入统一 Dashboard；匿名 `/` 继续现有公开 Start。
          - 新增深色固定侧栏、顶部全局搜索、Start / Channels / Watch 三列真实数据 Dashboard、今日发现与资产统计。
          - `start.php` 保留 Classic Start；Channels / Watch 接入同一统一 Shell。
          - 不新增数据库或 Schema；Schema 仍为 2026082801。
          - Formal Artifact Gate 已用真实 V2.22.1 Updater 完整验证 2.22.1 → 2.23.0，数据保留、SQLite/FK、Baseline 与升级后管理员 Dashboard 均 PASS。
          - Machine Gates：33147167918 / 33147285602 / 33147403831 / 33147450050 全部 PASS。
          - 正式发布不直接修改 Owner Production Server；服务器升级仍由后台在线升级执行。
          EOF
          gh release create "$TAG" "$FULL" "$UPDATE" "$LEGACY" "$REPAIR" "$GATE" "$ARTGATE" "$SUMS" --repo "$PRODUCT_REPO" --title 'VF Start V2.23.0 · Unified Surface UI' --notes-file /tmp/notes.md --verify-tag
          gh api "repos/${PRODUCT_REPO}/releases/tags/${TAG}" >/tmp/release.json
          RELEASE_ID=$(jq -r '.id' /tmp/release.json); RELEASED_AT=$(jq -r '.published_at' /tmp/release.json)
          test "$(jq -r '.draft' /tmp/release.json)" = false; test "$(jq -r '.prerelease' /tmp/release.json)" = false
          printf 'RELEASE_ID=%s\nRELEASED_AT=%s\n' "$RELEASE_ID" "$RELEASED_AT" >> "$GITHUB_ENV"
          echo P01_V230_GITHUB_RELEASE=PASS
      - name: Remote release byte readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-v230-remote; mkdir -p /tmp/p01-v230-remote
          gh release download "$TAG" --repo "$PRODUCT_REPO" --dir /tmp/p01-v230-remote
          test "$(sha256sum /tmp/p01-v230-remote/VF-Start-V2.23.0-FULL.zip|awk '{print $1}')" = "$FULL_SHA"
          test "$(sha256sum /tmp/p01-v230-remote/VF-Start-V2.23.0-UPDATE.zip|awk '{print $1}')" = "$UPDATE_SHA"
          test "$(sha256sum /tmp/p01-v230-remote/VF_Start_V2.23.0_UPDATE.zip|awk '{print $1}')" = "$LEGACY_SHA"
          test "$(sha256sum /tmp/p01-v230-remote/server-update-v2.23.0-repair.php|awk '{print $1}')" = "$REPAIR_SHA"
          echo P01_V230_REMOTE_ASSETS=PASS
      - name: Publish core-updates P01 channel
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          rm -rf updates
          git clone -q --depth 1 --branch main "https://x-access-token:${WRITE_TOKEN}@github.com/${UPDATES_REPO}.git" updates
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          p=Path('updates/projects/P01.json'); d=json.loads(p.read_text(encoding='utf-8'))
          if str(d.get('target_version'))!='2.22.1': raise SystemExit('unexpected current P01 update target')
          d.update({'target_version':'2.23.0','update_type':'ATOMIC','from_versions':['2.22.1'],'schema_from':'2026082801','schema_to':'2026082801','repository':'llhzx2018/vf-start','release_tag':'v2.23.0','asset_name':'VF_Start_V2.23.0_UPDATE.zip','asset_bytes':int(os.environ['LEGACY_BYTES']),'asset_sha256':os.environ['LEGACY_SHA'],'release_id':int(os.environ['RELEASE_ID']),'release_identity':'v2.23.0@6e7d30e6ea0c8f5f70076a69b0d1e6fb9be620b2','backup_required':True,'rollback_supported':True,'released_at':os.environ['RELEASED_AT'],'minimum_php':'8.0.0'})
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8',newline='\n')
          PY
          git -C updates config user.name VictorForge; git -C updates config user.email llhzx2018@gmail.com
          git -C updates add projects/P01.json; git -C updates commit -m 'release(P01): publish VF Start V2.23.0 update channel'
          for i in 1 2 3; do if git -C updates push origin main; then break; fi; git -C updates pull --rebase origin main; test "$i" -lt 3; done
          UPDATE_COMMIT=$(git -C updates rev-parse HEAD); echo UPDATE_COMMIT=$UPDATE_COMMIT >> "$GITHUB_ENV"
          echo P01_V230_CORE_UPDATES=PASS
      - name: Final remote publication readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/${PRODUCT_REPO}/git/ref/tags/${TAG} --jq '.object.sha')" = "$RELEASE_SOURCE"
          gh api "repos/${PRODUCT_REPO}/releases/tags/${TAG}" | jq -e --argjson id "$RELEASE_ID" '.id==$id and .draft==false and .prerelease==false' >/dev/null
          gh api "repos/${UPDATES_REPO}/contents/projects/P01.json?ref=main" --jq '.content' | tr -d '\n' | base64 -d >/tmp/P01.json
          jq -e --arg sha "$LEGACY_SHA" --argjson bytes "$LEGACY_BYTES" --argjson rid "$RELEASE_ID" '.target_version=="2.23.0" and .from_versions==["2.22.1"] and .schema_from=="2026082801" and .schema_to=="2026082801" and .release_tag=="v2.23.0" and .asset_name=="VF_Start_V2.23.0_UPDATE.zip" and .asset_sha256==$sha and .asset_bytes==$bytes and .release_id==$rid and .release_identity=="v2.23.0@6e7d30e6ea0c8f5f70076a69b0d1e6fb9be620b2"' /tmp/P01.json >/dev/null
          echo P01_V230_PUBLICATION=PASS
          echo RELEASE_ID=$RELEASE_ID
          echo CORE_UPDATES_COMMIT=$UPDATE_COMMIT
          echo PRODUCTION=NO
