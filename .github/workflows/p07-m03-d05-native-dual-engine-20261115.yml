name: P07 M03 D05 native dual-engine synthetic proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-m03-d05-native-dual-engine-20261115.yml'
      - 'tests/p07_m03_d05_native_pair_synthetic.sh'
permissions:
  contents: read
jobs:
  native-pair:
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Native MySQL 8.4 and MariaDB 11.8 synthetic-only bidirectional conversion
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n tests/p07_m03_d05_native_pair_synthetic.sh
          timeout --signal=TERM --kill-after=20s 1440s bash tests/p07_m03_d05_native_pair_synthetic.sh
      - name: Cleanup isolated synthetic instances and inputs
        if: always()
        shell: bash
        run: |
          docker rm -f p07-d05-mysql84-test p07-d05-maria118-test >/dev/null 2>&1 || true
          echo P07_D05_SYNTHETIC_ENGINE_CLEANUP=PASS
