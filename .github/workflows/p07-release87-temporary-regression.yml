name: TEMP P07 release87 exact-source full bounded regression
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-release87-temporary-regression.yml'

permissions:
  contents: read

concurrency:
  group: temp-p07-pr200-final-gate
  cancel-in-progress: false

jobs:
  final-regression:
    if: github.repository == 'llhzx2018/core-free-runner-public'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Verify registered private read capability
        shell: bash
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          test -n "$PRIVATE_READ_TOKEN" || exit 78

      - name: Checkout exact P07 private candidate into transient workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 36f0c6b8375a4788eeb40cb8a12fab9dcbae2b0b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: p07-private

      - name: Run exact-source independent full coverage shard
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          set -Eeuo pipefail
          test "$(git -C p07-private rev-parse HEAD)" = '36f0c6b8375a4788eeb40cb8a12fab9dcbae2b0b'
          test "$(cat p07-private/BUILD_ID)" = '0.1.0-release87'
          cd p07-private
          export PYTHONPATH="$PWD/lib"
          bash -n bin/vfops bin/vfops-migrate-ui
          mapfile -t modules < <(python3 - "$SHARD_INDEX" <<'PY'
          import pathlib,sys
          critical = (
              "test_backup", "test_restore_new", "test_auto_backup",
              "test_cloudpanel", "test_server_migration_pull", "test_policy",
              "test_storage", "test_restore", "test_restore_apply",
              "test_mariadb_owner_policy", "test_cli_menu",
          )
          all_test_names=sorted(p.stem for p in pathlib.Path("tests").glob("test_*.py"))
          assert len(all_test_names)==56, "source test inventory drift"
          remaining=[name for name in all_test_names if name not in critical]
          assert len(remaining)==45
          shard=int(sys.argv[1])
          selected=critical if shard==0 else tuple(name for idx,name in enumerate(remaining) if idx%5==shard-1)
          assert len(selected)==(11 if shard==0 else 9)
          print("\n".join("tests."+name for name in selected))
          PY
          )
          echo "P07_FINAL_SHARD_${SHARD_INDEX}_MODULES=${#modules[@]}"
          log="$RUNNER_TEMP/p07-exact-final-${SHARD_INDEX}.log"
          if timeout --signal=TERM --kill-after=5s 750 python3 -m unittest -q "${modules[@]}" >"$log" 2>&1; then
            echo "P07_FINAL_SHARD_${SHARD_INDEX}=PASS"
            grep -E '^Ran [0-9]+ tests? in ' "$log" | tail -n1 || true
          else
            rc=$?
            if [ "$rc" -eq 124 ]; then
              echo "P07_FINAL_SHARD_${SHARD_INDEX}=TIMEOUT"
            else
              echo "P07_FINAL_SHARD_${SHARD_INDEX}=UNRESOLVED_FAILURE"
            fi
            echo "P07_FINAL_SHARD_${SHARD_INDEX}_EXIT=$rc"
            grep -E '^Ran [0-9]+ tests? in |^FAILED \(' "$log" | tail -n2 || true
            exit "$rc"
          fi

      - name: Erase transient private source and private raw test output
        if: always()
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/p07-private"
          rm -f -- "$RUNNER_TEMP/p07-exact-final-${SHARD_INDEX}.log"
          echo 'P07_PRIVATE_SOURCE_PERSISTED=NO'
          echo 'P07_PRIVATE_LOG_PERSISTED=NO'
