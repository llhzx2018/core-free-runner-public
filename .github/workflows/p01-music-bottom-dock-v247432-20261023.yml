name: P01 Music fixed bottom dock 2.47.432 exact gate
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-music-bottom-dock-v247432-20261023.yml'
permissions:
  contents: read
jobs:
  verify:
    if: >-
      github.actor == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'verify/p01-music-bottom-dock-v247432-20261023'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: shivammathur/setup-php@2.35.5
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,mbstring,curl,zip
          coverage: none
      - name: Checkout exact private P01 candidate (ephemeral)
        env:
          PRIVATE_READ: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ"
          git clone -q --depth 1 --no-checkout "https://x-access-token:${PRIVATE_READ}@github.com/llhzx2018/vf-start.git" candidate
          git -C candidate fetch -q --depth 1 origin 78be3a3301034f8f8e409f7e15f00a7ce237800a
          git -C candidate checkout -q --detach FETCH_HEAD
          git -C candidate remote set-url origin https://github.com/llhzx2018/vf-start.git
          test "$(git -C candidate rev-parse HEAD)" = '78be3a3301034f8f8e409f7e15f00a7ce237800a'
          test "$(tr -d '\r\n ' <candidate/VERSION)" = '2.47.432'
          test "$(tr -d '\r\n ' <candidate/src/VERSION.txt)" = '2.47.432'
          echo P01_DOCK_EXACT_GIT_SOURCE=PASS
      - name: PHP syntax, same-origin frame safeguards and Node DOM playback
        shell: bash
        run: |
          set -Eeuo pipefail
          for p in candidate/src/app/bootstrap.php candidate/src/music-shell.php candidate/src/music-home.php candidate/src/music-discover.php candidate/src/music-radio.php; do php -l "$p"; done
          for f in candidate/src/assets/music-dock.js candidate/src/assets/music-shell-route.js candidate/src/assets/music-player.js candidate/src/assets/music-radio.js candidate/src/assets/music-discover.js; do node --check "$f"; done
          (cd candidate && php tests/unit/music_security_contract.php)
          node candidate/tests/unit/music_dock_contract.js
          node candidate/tests/unit/music_shell_route_contract.js
          node candidate/tests/unit/music_player_fallback_contract.js
          node candidate/tests/unit/music_radio_directory_contract.js
          node candidate/tests/unit/music_audius_directory_contract.js
          (cd candidate && php tests/unit/music_audius_source_contract.php)
          (cd candidate && php tests/unit/music_radio_source_contract.php)
          (cd candidate && php tests/unit/music_quick_import_contract.php)
          echo P01_DOCK_FOCUSED_SECURITY_AND_CLIENT=PASS
      - name: Synthetic full HTTP P01 admin/guest & Music shell iframe boundaries
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n candidate/tests/integration/music_fresh_http.sh
          bash candidate/tests/integration/music_fresh_http.sh candidate
          echo P01_DOCK_OWNER_REAL_HTTP_AND_FRAME=PASS
      - name: Clean ephemeral private checkout
        if: always()
        shell: bash
        run: |
          rm -rf candidate
          echo P01_DOCK_PRIVATE_CHECKOUT_CLEANUP=PASS
