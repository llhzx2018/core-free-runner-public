name: S01 homepage content hierarchy desktop proof
on:
  push:
    branches: [task/s01-home176-20261023]
    paths: ['.github/workflows/s01-home176-20261023.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.176
  TARGET_SHA: 9c2f7d7ba3af8155810a21fb03d793c88459a7c1
  TARGET_TREE: d559cc2c2903ff125843d7ea8f940a010decfa6d
  BASE_SHA: 4227d5cc058124961a573826fd697cd10f304130
  SOURCE_VERSION: 1.35.175
  LANE_ID: s01-home176-20261023
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          ref: 02d4591eed025a3d3a67bc0a150b3ddc448c2ab8
          persist-credentials: false
          path: established
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 9c2f7d7ba3af8155810a21fb03d793c88459a7c1
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact package and focused syntax checks
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider baseline
          python3 control/lanes/s01-home176-20261023/package.py
          php -l target/src/footer.php
          php -l target/src/inc/services/frontend-page-progress-service.php
          php -l target/src/inc/public-css-owner-registry.php
          node --check target/tests/home-composition-browser-check.cjs
          node --check control/lanes/s01-home176-20261023/clean.cjs
          gh release download v1.35.175 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.175.zip --dir provider
          echo '947f99c2f72430bceb0404ec0f22abaca2d3c3488d1d5dc140953bffc6ff95bc  provider/vf-tools-theme_V1.35.175.zip' | sha256sum -c
          gh release download v1.25.94 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.94.zip --dir provider
          echo '70b90d40da5d69fc7819bd7ada3f15fb0145e64822b788bd94956c7827b2df03  provider/vf-tools-m3u8_V1.25.94.zip' | sha256sum -c
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -g -fsSL --retry 2 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC[wght].ttf' -o "$HOME/.local/share/fonts/NotoSansSC.ttf"
          fc-cache -f
      - name: Native WordPress bilingual home and upgrade rollback data protection
        run: |
          set -euo pipefail
          cp -a established/lanes/s01-frontend-design-20261017 lane
          cp control/lanes/s01-home176-20261023/clean.cjs lane/warm-admin.cjs
          bash control/lanes/s01-home176-20261023/native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-home-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target baseline provider
