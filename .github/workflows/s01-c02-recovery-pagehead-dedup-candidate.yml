name: S01 C02 Recovery Pagehead Dedup Candidate
on:
  push:
    branches: [task/s01-c02-1211099-pagehead-dedup-browser-20261012]
permissions:
  contents: read
jobs:
  scoped-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout approved public test lane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Checkout exact private Ops candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 907f943cac388871e9727b004a7e7250b283a693
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Verify pinned candidate identity, static contract and PHP syntax
        run: |
          test "$(git -C product rev-parse HEAD)" = 907f943cac388871e9727b004a7e7250b283a693
          test "$(cat product/VERSION)" = 1.21.1098
          php -l product/includes/admin-v13/views/system_recovery.php
          node --check product/assets/js/v13/system/recovery.js
          node --check product/tests/s01-c02-1211099-recovery-pagehead-dedup-browser-proof.js
      - name: Provision disposable Chromium
        working-directory: product
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Assert page title dedup and old Recovery regression across viewports
        working-directory: product
        run: |
          node tests/s01-c02-1211099-recovery-pagehead-dedup-browser-proof.js
          node tests/s01-c02-1211022-recovery-golden-path-browser-proof.js
          node tests/s01-c02-1211024-recovery-diagnostics-browser-proof.js
          echo S01_C02_1099_PAGEHEAD_DEDUP_CANDIDATE_PASS
