name: P01 2.47.493 manifest exact release channel isolated proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-493-manifest-exact-once.yml'
permissions:
  contents: read
jobs:
  verify-exact-manifest:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'test(P01):')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      DIST_REPO: llhzx2018/core-updates
      DIST_BRANCH: dist/p01-v2.47.493-ia-v6-final-20261105
      DIST_SHA: eb554086406b7afcfb7ebe2803a699a0621e0c66
      PRODUCT_REPO: llhzx2018/vf-start
      PRODUCT_SHA: 342a2ad7d7f3d203010c400af45e59e18c65fe31
      ASSET_SHA: 87df7210db14c58e0a7700c0adfa9352476c7239037d06ec311b53c4ccdbc8b0
      ASSET_BYTES: 3858233
    steps:
      - name: Checkout registered public control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify private manifest exact SHA and schema in temporary workspace
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          actual="$(git ls-remote "https://x-access-token:$READ_TOKEN@github.com/$DIST_REPO.git" "refs/heads/$DIST_BRANCH" | awk '{print $1}')"
          test "$actual" = "$DIST_SHA"
          git clone -q --no-checkout "https://x-access-token:$READ_TOKEN@github.com/$DIST_REPO.git" /tmp/p01-493-distribution
          git -C /tmp/p01-493-distribution fetch -q --depth 1 origin "$DIST_SHA"
          git -C /tmp/p01-493-distribution checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/p01-493-distribution rev-parse HEAD)" = "$DIST_SHA"
          jq -e --arg sha "$PRODUCT_SHA" --arg digest "$ASSET_SHA" --argjson bytes "$ASSET_BYTES" '
            .schema_version=="1.0" and .project_id=="P01" and .component_id=="APP" and .enabled==true and
            .current_version=="2.47.492" and .target_version=="2.47.493" and
            .from_versions==["2.47.492"] and .update_type=="ATOMIC" and
            .schema_from=="2026102201" and .schema_to=="2026102201" and
            .repository=="llhzx2018/vf-start" and .release_tag=="v2.47.493" and
            .release_id==434857561 and .product_identity==$sha and
            .asset_name=="VF_Start_V2.47.493_UPDATE.zip" and
            .asset_bytes==$bytes and .asset_sha256==$digest and
            .backup_required==true and .rollback_supported==true and
            .minimum_php=="8.0.0"
          ' /tmp/p01-493-distribution/projects/P01.json >/dev/null
          echo P01_493_DISTRIBUTION_MANIFEST_EXACT_SCHEMA=PASS
      - name: Verify GitHub formal Tag and Release asset digest and download bytes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          gh api "repos/$PRODUCT_REPO/git/ref/tags/v2.47.493" >/tmp/p01-493-tag.json
          jq -e --arg sha "$PRODUCT_SHA" '.object.sha==$sha and .object.type=="commit"' /tmp/p01-493-tag.json >/dev/null
          gh api "repos/$PRODUCT_REPO/releases/tags/v2.47.493" >/tmp/p01-493-release.json
          jq -e --arg sha "$ASSET_SHA" --argjson bytes "$ASSET_BYTES" '
            .id==434857561 and .tag_name=="v2.47.493" and .draft==false and
            .prerelease==false and
            ([.assets[] | select(.name=="VF_Start_V2.47.493_UPDATE.zip" and
            .size==$bytes and .digest==("sha256:"+$sha))] | length)==1
          ' /tmp/p01-493-release.json >/dev/null
          mkdir -p /tmp/p01-493-remote-asset
          gh release download v2.47.493 -R "$PRODUCT_REPO" -D /tmp/p01-493-remote-asset -p VF_Start_V2.47.493_UPDATE.zip
          test "$(stat -c %s /tmp/p01-493-remote-asset/VF_Start_V2.47.493_UPDATE.zip)" = "$ASSET_BYTES"
          test "$(sha256sum /tmp/p01-493-remote-asset/VF_Start_V2.47.493_UPDATE.zip | awk '{print $1}')" = "$ASSET_SHA"
          echo P01_493_FORMAL_TAG_AND_ASSET_IDENTITY=PASS
          echo P01_493_REMOTE_UPDATE_BYTES_AND_SHA256=PASS
      - name: Erase temporary private checkout and artifact
        if: always()
        shell: bash
        run: |
          rm -rf /tmp/p01-493-distribution /tmp/p01-493-remote-asset /tmp/p01-493-release.json /tmp/p01-493-tag.json
          echo P01_493_DISTRIBUTION_PROOF_CLEANUP=PASS
