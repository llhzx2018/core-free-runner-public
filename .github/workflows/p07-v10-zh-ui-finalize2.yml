name: P07 v1.0 中文界面终检 2

on:
  push:
    branches:
      - experiment/p07-oneshot-bench-v05
    paths:
      - .github/workflows/p07-v10-zh-ui-finalize2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/p07-oneshot-bench-v05

      - name: 强制用户显示层全中文
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('experiments/p07-bench.sh')
          s=p.read_text(encoding='utf-8')

          # 内部 TSV / 状态代码保持稳定，只修改用户终端显示层。
          pairs=[
            ('"$YELLOW" "$name" "$RESET"', '"$YELLOW" "$(zh_name "$name")" "$RESET"'),
            ('"$YELLOW" "$display" "$RESET"', '"$YELLOW" "$(zh_name "$display")" "$RESET"'),
            ('"$GREEN" "PASS" "$RESET"', '"$GREEN" "正常" "$RESET"'),
            ('"$RED" "$state" "$RESET"', '"$RED" "$(zh_state "$state")" "$RESET"'),
            ('"$YELLOW" "$reason" "$RESET"', '"$YELLOW" "$(zh_reason "$reason")" "$RESET"'),
            ('"$RED" "FAIL" "$RESET"', '"$RED" "失败" "$RESET"'),
            ('"$YELLOW" "$best_reason" "$RESET"', '"$YELLOW" "$(zh_reason "$best_reason")" "$RESET"'),
            ('"$GREEN" \'PASS\' "$RESET" \'LIBRESPEED\'', '"$GREEN" \'正常\' "$RESET" \'备用测速\''),
            ('"$RED" \'FAIL\' "$RESET" "$YELLOW" \'LIBRESPEED_UNAVAILABLE\' "$RESET"', '"$RED" \'失败\' "$RESET" "$YELLOW" \'备用测速节点不可用\' "$RESET"'),
            ("printf ' Swap               : %s  （已用 %s）\\n' \"$SWAP_TOTAL\" \"$SWAP_USED\"", "printf ' 交换分区           : %s  （已用 %s）\\n' \"$SWAP_TOTAL\" \"$SWAP_USED\""),
            ("printf ' 运行时间           : %s\\n' \"$UPTIME\"", "printf ' 运行时间           : %s\\n' \"$(sed -e 's/weeks\\?/周/g' -e 's/days\\?/天/g' -e 's/hours\\?/小时/g' -e 's/minutes\\?/分钟/g' -e 's/seconds\\?/秒/g' <<<\"$UPTIME\")\""),
          ]
          for old,new in pairs:
              s=s.replace(old,new)

          # 第一轮中文化误把备用地区映射的 key 也翻成了中文；恢复“英文内部值 -> 中文显示值”。
          region_pairs={
            "    '美国西部') printf '美国西部' ;;":"    'US West'|'美国西部') printf '美国西部' ;;",
            "    '美国中部') printf '美国中部' ;;":"    'US Central'|'美国中部') printf '美国中部' ;;",
            "    '美国东部') printf '美国东部' ;;":"    'US East'|'美国东部') printf '美国东部' ;;",
            "    '欧洲') printf '欧洲' ;;":"    'Europe'|'欧洲') printf '欧洲' ;;",
            "    '亚洲南部') printf '亚洲南部' ;;":"    'Asia South'|'亚洲南部') printf '亚洲南部' ;;",
          }
          for old,new in region_pairs.items():
              s=s.replace(old,new)

          p.write_text(s,encoding='utf-8')
          PY
          bash -n experiments/p07-bench.sh

      - name: 正常路径与限流备用路径双终检
        shell: bash
        run: |
          set -euo pipefail
          normal="$(experiments/p07-bench.sh --demo)"
          fallback="$(P07_BENCH_DEMO_BACKEND_REASON=RATE_LIMITED experiments/p07-bench.sh --demo)"
          printf '%s\n%s\n' '===== 正常路径 =====' "$normal"
          printf '%s\n%s\n' '===== 限流备用路径 =====' "$fallback"

          for text in "$normal" "$fallback"; do
            grep -q 'P07 VPS 一键验机' <<<"$text"
            grep -q '节点/地区' <<<"$text"
            grep -q '上传' <<<"$text"
            grep -q '下载' <<<"$text"
            grep -q '延迟' <<<"$text"
            grep -q '中国大陆访问评估' <<<"$text"
            grep -q '建议' <<<"$text"
          done

          banned='Speedtest\.net|Los Angeles, US|Dallas, US|Montreal, CA|Paris, FR|Amsterdam, NL|China Unicom, CN|China Telecom, CN|China Backup, CN|Hong Kong, CN|Singapore, SG|Taipei, CN|Tokyo, JP|[[:space:]]PASS[[:space:]]|[[:space:]]FAIL[[:space:]]|RATE_LIMITED|BACKEND_UNAVAILABLE|BACKEND_FAILURE|NODE_UNAVAILABLE|LIBRESPEED_UNAVAILABLE|[[:space:]]LIBRESPEED[[:space:]]|SUPPLEMENTAL|NOT_RUN'
          ! grep -Eq "$banned" <<<"$normal"
          ! grep -Eq "$banned" <<<"$fallback"
          ! grep -Eq '^[[:space:]]*(US West|US Central|US East|Europe|Asia South)[[:space:]]' <<<"$fallback"

          grep -q '美国西部·洛杉矶' <<<"$normal"
          grep -q '美国中部·达拉斯' <<<"$normal"
          grep -q '中国联通' <<<"$normal"
          grep -q '中国电信' <<<"$normal"
          grep -q '中国香港' <<<"$normal"
          grep -q '新加坡' <<<"$normal"
          grep -q '日本·东京' <<<"$normal"

          grep -q '测速平台限流' <<<"$fallback"
          grep -q '全球备用测速' <<<"$fallback"
          grep -q '美国西部' <<<"$fallback"
          grep -q '美国中部' <<<"$fallback"
          grep -q '美国东部' <<<"$fallback"
          grep -q '欧洲' <<<"$fallback"
          grep -q '亚洲南部' <<<"$fallback"
          grep -q '日本·东京' <<<"$fallback"
          grep -q 'Cloudflare 边缘基准' <<<"$fallback"

      - name: 提交中文终检版本
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add experiments/p07-bench.sh
          git diff --cached --quiet && exit 0
          git commit -m 'fix(p07-bench): enforce Chinese terminal display'
          git push origin HEAD:experiment/p07-oneshot-bench-v05
