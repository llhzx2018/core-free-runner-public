name: S01 Private Release Asset Download Auth Corrective

on:
  push:
    branches:
      - task/s01-private-asset-download-auth-corrective
    paths:
      - '.github/workflows/s01-private-asset-download-auth-corrective.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s01-private-asset-download-auth-corrective
  cancel-in-progress: false

jobs:
  corrective:
    name: ${{ matrix.component }} real bulk Plugin_Upgrader private asset auth
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: OPS
            repository: llhzx2018/vf-tools-ops
            candidate_ref: task/v121791-private-asset-downloader-auth
            candidate_commit: 01f111cff3c7a423343e9ba3374dd8702bfdfe06
            candidate_version: 1.21.791
            production_ref: v1.21.789
            production_version: 1.21.789
            target_version: 1.21.790
            plugin_dir: vf-ops
            plugin_file: vf-ops/vf-ops.php
            source_root: .
            bootstrap_rel: includes/wp-update/bootstrap.php
            bridge_rel: includes/wp-update/class-vf-ops-private-asset-download-bridge-v1.php
            source_class: VF_Ops_Update_Source_V1
            bridge_class: VF_Ops_Private_Asset_Download_Bridge_V1
            authority_class: VF_Ops_Runtime_Authority_V1
            asset_id: '516546259'
            asset_name: vf-tools-ops_V1.21.790.zip
            asset_bytes: '3175301'
            asset_sha256: 327cbf86b1bf568eeb59a9dc3ce9c5837906fae3bf79869e5ec346c251feea62
            candidate_asset: vf-tools-ops_V1.21.791.zip
          - component: M3U8
            repository: llhzx2018/vf-tools-m3u8
            candidate_ref: task/v1253-private-asset-downloader-auth
            candidate_commit: 4db0265c346dbabe91f206af33a16dba77bb2939
            candidate_version: 1.25.3
            production_ref: v1.25.1
            production_version: 1.25.1
            target_version: 1.25.2
            plugin_dir: vf-tool-m3u8
            plugin_file: vf-tool-m3u8/vf-tool-m3u8.php
            source_root: src
            bootstrap_rel: includes/update/bootstrap.php
            bridge_rel: includes/update/class-vf-m3u8-private-asset-download-bridge-v1.php
            source_class: VF_M3U8_Update_Source_V1
            bridge_class: VF_M3U8_Private_Asset_Download_Bridge_V1
            authority_class: VF_M3U8_Runtime_Authority_V1
            asset_id: '516569640'
            asset_name: vf-tools-m3u8_V1.25.2.zip
            asset_bytes: '3520025'
            asset_sha256: 857eb4706f06a79b2eee0260fe144da7d8b6d43d2ab40fe310fcace3f72106bf
            candidate_asset: vf-tools-m3u8_V1.25.3.zip

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: vf_corrective
          MARIADB_USER: vf
          MARIADB_PASSWORD: vf
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10

    env:
      COMPONENT: ${{ matrix.component }}
      REPOSITORY: ${{ matrix.repository }}
      CANDIDATE_COMMIT: ${{ matrix.candidate_commit }}
      CANDIDATE_VERSION: ${{ matrix.candidate_version }}
      PRODUCTION_VERSION: ${{ matrix.production_version }}
      TARGET_VERSION: ${{ matrix.target_version }}
      PLUGIN_DIR: ${{ matrix.plugin_dir }}
      PLUGIN_FILE: ${{ matrix.plugin_file }}
      SOURCE_ROOT: ${{ matrix.source_root }}
      BOOTSTRAP_REL: ${{ matrix.bootstrap_rel }}
      BRIDGE_REL: ${{ matrix.bridge_rel }}
      SOURCE_CLASS: ${{ matrix.source_class }}
      BRIDGE_CLASS: ${{ matrix.bridge_class }}
      AUTHORITY_CLASS: ${{ matrix.authority_class }}
      ASSET_ID: ${{ matrix.asset_id }}
      ASSET_NAME: ${{ matrix.asset_name }}
      ASSET_BYTES: ${{ matrix.asset_bytes }}
      ASSET_SHA256: ${{ matrix.asset_sha256 }}
      CANDIDATE_ASSET: ${{ matrix.candidate_asset }}
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}

    steps:
      - name: Require unified private read credential
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VF_PRIVATE_READ_TOKEN"
          echo 'VF_PRIVATE_READ_TOKEN_PRESENT=PASS'

      - name: Checkout public harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Checkout exact corrective candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.candidate_ref }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout immutable production baseline
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.production_ref }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: production
          fetch-depth: 1
          persist-credentials: false

      - name: Verify corrective source identity and bounded delta
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          test "$(tr -d '\r\n' < candidate/VERSION)" = "$CANDIDATE_VERSION"
          if [ "$COMPONENT" = OPS ]; then
            base='91bf324193095846a0ff546a9dca716daf44b4de'
            expected=$'VERSION\nincludes/wp-update/bootstrap.php\nincludes/wp-update/class-vf-ops-private-asset-download-bridge-v1.php\nvf-ops.php'
          else
            base='d13fa95047dee2eaa16a7e64bab74c7d06420de9'
            expected=$'VERSION\nsrc/includes/update/bootstrap.php\nsrc/includes/update/class-vf-m3u8-private-asset-download-bridge-v1.php\nsrc/vf-tool-m3u8.php'
          fi
          actual="$(git -C candidate diff --name-only "$base"..HEAD | sort)"
          test "$actual" = "$expected"
          php -l "candidate/$SOURCE_ROOT/$BOOTSTRAP_REL" >/dev/null
          php -l "candidate/$SOURCE_ROOT/$BRIDGE_REL" >/dev/null
          echo 'CORRECTIVE_DELTA_SCOPE=PASS'
          echo 'SCHEMA_CHANGE=NO'
          echo 'LOCATOR_CUTOVER=NO'

      - name: Provision WordPress runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: mysqli, curl, zip, sodium, mbstring, xml, gd, fileinfo
          coverage: none

      - name: Install WP-CLI and wait for MariaDB
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client jq unzip curl rsync >/dev/null
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp
          chmod +x /tmp/wp
          sudo mv /tmp/wp /usr/local/bin/wp
          for i in $(seq 1 30); do mariadb -h127.0.0.1 -uvf -pvf -e 'SELECT 1' vf_corrective >/dev/null 2>&1 && break; sleep 1; done
          wp --info

      - name: Build isolated Production-baseline plus exact corrective bridge fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          WP_ROOT="$RUNNER_TEMP/wp-$COMPONENT"
          echo "WP_ROOT=$WP_ROOT" >> "$GITHUB_ENV"
          rm -rf "$WP_ROOT"; mkdir -p "$WP_ROOT"
          wp core download --path="$WP_ROOT" --version=7.0.2 --force >/dev/null
          wp config create --path="$WP_ROOT" --dbname=vf_corrective --dbuser=vf --dbpass=vf --dbhost=127.0.0.1:3306 --skip-check >/dev/null
          wp core install --path="$WP_ROOT" --url="http://127.0.0.1:18095" --title="VF $COMPONENT Corrective Fixture" --admin_user=admin --admin_password='Fixture-Only-Admin!' --admin_email=fixture@example.invalid --skip-email >/dev/null

          DEST="$WP_ROOT/wp-content/plugins/$PLUGIN_DIR"
          mkdir -p "$DEST"
          if [ "$SOURCE_ROOT" = '.' ]; then
            rsync -a --exclude='.git' production/ "$DEST/"
            cp "candidate/$BOOTSTRAP_REL" "$DEST/$BOOTSTRAP_REL"
            cp "candidate/$BRIDGE_REL" "$DEST/$BRIDGE_REL"
          else
            rsync -a production/$SOURCE_ROOT/ "$DEST/"
            cp "candidate/$SOURCE_ROOT/$BOOTSTRAP_REL" "$DEST/$BOOTSTRAP_REL"
            cp "candidate/$SOURCE_ROOT/$BRIDGE_REL" "$DEST/$BRIDGE_REL"
          fi

          mkdir -p "$WP_ROOT/wp-content/mu-plugins"
          cat > "$WP_ROOT/wp-content/mu-plugins/vf-corrective-http-observer.php" <<'PHP'
          <?php
          if (!defined('ABSPATH')) { exit; }
          add_filter('http_request_args', function($args, $url) {
              $path = getenv('VF_HTTP_EVIDENCE_PATH');
              if (!$path) { return $args; }
              $p = wp_parse_url((string)$url);
              $host = strtolower((string)($p['host'] ?? ''));
              if (!in_array($host, ['api.github.com','objects.githubusercontent.com','github-releases.githubusercontent.com','release-assets.githubusercontent.com'], true)) { return $args; }
              $headers = is_array($args['headers'] ?? null) ? $args['headers'] : [];
              $has = false;
              foreach ($headers as $k => $v) { if (strtolower((string)$k) === 'authorization' && trim((string)$v) !== '') { $has = true; break; } }
              $row = ['host'=>$host,'path'=>(string)($p['path'] ?? ''),'authorization'=>$has];
              file_put_contents($path, wp_json_encode($row, JSON_UNESCAPED_SLASHES)."\n", FILE_APPEND|LOCK_EX);
              return $args;
          }, PHP_INT_MAX, 2);
          add_filter('upgrader_pre_download', function($reply, $package, $upgrader, $hook_extra) {
              $path = getenv('VF_HOOK_EVIDENCE_PATH');
              $plugin = getenv('PLUGIN_FILE');
              if (!$path || !is_array($hook_extra)) { return $reply; }
              $matches = ((string)($hook_extra['plugin'] ?? '') === $plugin) || (is_array($hook_extra['plugins'] ?? null) && in_array($plugin, $hook_extra['plugins'], true));
              if ($matches && str_contains((string)$package, '/releases/assets/')) {
                  $row = ['keys'=>array_values(array_keys($hook_extra)),'has_type'=>array_key_exists('type',$hook_extra),'plugin_match'=>true];
                  file_put_contents($path, wp_json_encode($row)."\n", FILE_APPEND|LOCK_EX);
              }
              return $reply;
          }, 1, 4);
          PHP

          export VF_HTTP_EVIDENCE_PATH="$RUNNER_TEMP/$COMPONENT-http.jsonl"
          export VF_HOOK_EVIDENCE_PATH="$RUNNER_TEMP/$COMPONENT-hook.jsonl"
          : > "$VF_HTTP_EVIDENCE_PATH"
          : > "$VF_HOOK_EVIDENCE_PATH"
          echo "VF_HTTP_EVIDENCE_PATH=$VF_HTTP_EVIDENCE_PATH" >> "$GITHUB_ENV"
          echo "VF_HOOK_EVIDENCE_PATH=$VF_HOOK_EVIDENCE_PATH" >> "$GITHUB_ENV"

          wp plugin activate "$PLUGIN_DIR" --path="$WP_ROOT" >/dev/null
          wp eval --path="$WP_ROOT" '
            $authority=getenv("AUTHORITY_CLASS");
            $r=$authority::establish(getenv("PRODUCTION_VERSION"), WP_PLUGIN_DIR."/".getenv("PLUGIN_DIR"));
            if (is_wp_error($r)) { fwrite(STDERR,$r->get_error_code()."\n"); exit(2); }
            update_option("vf_corrective_fixture_state","KEEP",false);
            update_option("vf_private_update_credential_v1","FIXTURE_SENTINEL_NOT_RUNTIME_CREDENTIAL",false);
            if (!wp_next_scheduled("vf_corrective_fixture_cron")) { wp_schedule_single_event(time()+3600,"vf_corrective_fixture_cron"); }
            $role=get_role("administrator"); if ($role) { $role->add_cap("vf_corrective_fixture_cap",true); }
            echo "PRODUCTION_BASELINE_OVERLAY_READY=PASS\n";
          '

      - name: Negative gates - missing/wrong credential, unexpected host, redirect leak, bytes/SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          RELEASE_PHP='$release=["asset_name"=>getenv("ASSET_NAME"),"asset_bytes"=>(int)getenv("ASSET_BYTES"),"asset_sha256"=>getenv("ASSET_SHA256"),"asset_api_url"=>"https://api.github.com/repos/".getenv("REPOSITORY")."/releases/assets/".getenv("ASSET_ID")];'

          env -u VF_PRIVATE_READ_TOKEN wp eval --path="$WP_ROOT" "$RELEASE_PHP
            \$cls=getenv('SOURCE_CLASS'); \$s=new \$cls(getenv('PRODUCTION_VERSION')); \$r=\$s->download(\$release);
            if (!is_wp_error(\$r)) { if (is_string(\$r)) @unlink(\$r); exit(21); }
            echo 'MISSING_TOKEN_FAIL_CLOSED=PASS';"

          VF_PRIVATE_READ_TOKEN='VF_INVALID_NEGATIVE_TOKEN_000000000000000000' wp eval --path="$WP_ROOT" "$RELEASE_PHP
            \$cls=getenv('SOURCE_CLASS'); \$s=new \$cls(getenv('PRODUCTION_VERSION')); \$r=\$s->download(\$release);
            if (!is_wp_error(\$r)) { if (is_string(\$r)) @unlink(\$r); exit(22); }
            echo 'WRONG_TOKEN_FAIL_CLOSED=PASS';"

          wp eval --path="$WP_ROOT" '
            $bridge=getenv("BRIDGE_CLASS"); $path=getenv("VF_HTTP_EVIDENCE_PATH"); $before=is_file($path)?count(file($path)):0;
            $r=$bridge::pre_download(false,"https://example.com/repos/x/releases/assets/1",null,["plugin"=>getenv("PLUGIN_FILE")]);
            $after=is_file($path)?count(file($path)):0;
            if (!is_wp_error($r) || $before!==$after) exit(23);
            echo "UNEXPECTED_HOST_NO_AUTH_REQUEST=PASS\n";
          '

          wp eval --path="$WP_ROOT" "$RELEASE_PHP
            \$asset=\$release['asset_api_url']; \$redirect='https://release-assets.githubusercontent.com/vf-corrective-fixture'; \$seen=null;
            add_filter('pre_http_request',function(\$pre,\$args,\$url) use (\$asset,\$redirect,&\$seen){
              if ((string)\$url===\$asset) {
                \$headers=is_array(\$args['headers']??null)?\$args['headers']:[]; \$auth=false; foreach(\$headers as \$k=>\$v){if(strtolower((string)\$k)==='authorization'&&trim((string)\$v)!==''){\$auth=true;}}
                if(!\$auth) return new WP_Error('vf_fixture_first_hop_missing_auth','fixture');
                return ['headers'=>['location'=>\$redirect],'body'=>'','response'=>['code'=>302,'message'=>'Found'],'cookies'=>[],'filename'=>null];
              }
              if ((string)\$url===\$redirect) {
                \$headers=is_array(\$args['headers']??null)?\$args['headers']:[]; \$auth=false; foreach(\$headers as \$k=>\$v){if(strtolower((string)\$k)==='authorization'&&trim((string)\$v)!==''){\$auth=true;}}
                \$seen=\$auth; return new WP_Error('vf_fixture_redirect_stop','fixture stop');
              }
              return \$pre;
            },1,3);
            \$cls=getenv('SOURCE_CLASS'); \$s=new \$cls(getenv('PRODUCTION_VERSION')); \$r=\$s->download(\$release);
            if (!is_wp_error(\$r) || \$r->get_error_code()!=='vf_fixture_redirect_stop' || \$seen!==false) exit(24);
            echo 'REDIRECT_NO_SECRET_LEAK=PASS';"

          wp eval --path="$WP_ROOT" "$RELEASE_PHP
            \$release['asset_bytes']=(int)\$release['asset_bytes']+1; \$cls=getenv('SOURCE_CLASS'); \$s=new \$cls(getenv('PRODUCTION_VERSION')); \$r=\$s->download(\$release);
            if (!is_wp_error(\$r) || !str_contains(\$r->get_error_code(),'bytes_mismatch')) exit(25);
            echo 'BYTES_MISMATCH_FAIL_CLOSED=PASS';"

          wp eval --path="$WP_ROOT" "$RELEASE_PHP
            \$release['asset_sha256']=str_repeat('0',64); \$cls=getenv('SOURCE_CLASS'); \$s=new \$cls(getenv('PRODUCTION_VERSION')); \$r=\$s->download(\$release);
            if (!is_wp_error(\$r) || !str_contains(\$r->get_error_code(),'sha256_mismatch')) exit(26);
            echo 'SHA_MISMATCH_FAIL_CLOSED=PASS';"

      - name: Real discovery and WordPress bulk Plugin_Upgrader private asset download
        shell: bash
        run: |
          set -Eeuo pipefail
          : > "$VF_HTTP_EVIDENCE_PATH"
          : > "$VF_HOOK_EVIDENCE_PATH"

          wp eval --path="$WP_ROOT" '
            if (method_exists(getenv("SOURCE_CLASS"),"clear_cache")) { $c=getenv("SOURCE_CLASS"); $c::clear_cache(); }
            delete_site_transient("update_plugins"); delete_transient("update_plugins");
            wp_update_plugins();
            $t=get_site_transient("update_plugins"); $plugin=getenv("PLUGIN_FILE"); $u=is_object($t)?($t->response[$plugin]??null):null;
            if (!is_object($u) || (string)($u->new_version??"")!==getenv("TARGET_VERSION")) exit(31);
            $expected="https://api.github.com/repos/".getenv("REPOSITORY")."/releases/assets/".getenv("ASSET_ID");
            if ((string)($u->package??"")!==$expected) exit(32);
            echo "REAL_UPDATE_DISCOVERY=PASS\n";
          '

          wp eval --path="$WP_ROOT" '
            require_once ABSPATH."wp-admin/includes/class-wp-upgrader.php";
            require_once ABSPATH."wp-admin/includes/plugin.php";
            $plugin=getenv("PLUGIN_FILE");
            $upgrader=new Plugin_Upgrader(new Automatic_Upgrader_Skin());
            $all=$upgrader->bulk_upgrade([$plugin]);
            $r=is_array($all)?($all[$plugin]??null):null;
            if (is_wp_error($r)) { fwrite(STDERR,"BULK_ERROR=".$r->get_error_code()."\n"); exit(33); }
            if ($r!==true) { fwrite(STDERR,"BULK_RESULT_INVALID\n"); exit(34); }
            echo "REAL_BULK_PLUGIN_UPGRADER=PASS\n";
          '

      - name: Verify HTTP authorization handoff, bulk hook semantics and preserved state
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$VF_HTTP_EVIDENCE_PATH" "$VF_HOOK_EVIDENCE_PATH" "$REPOSITORY" "$ASSET_ID" <<'PY'
          import json,sys
          http=[json.loads(x) for x in open(sys.argv[1],encoding='utf-8') if x.strip()]
          hooks=[json.loads(x) for x in open(sys.argv[2],encoding='utf-8') if x.strip()]
          asset_path=f"/repos/{sys.argv[3]}/releases/assets/{sys.argv[4]}"
          first=[x for x in http if x.get('host')=='api.github.com' and x.get('path')==asset_path]
          assert first and any(x.get('authorization') is True for x in first), first
          redirects=[x for x in http if x.get('host') in {'objects.githubusercontent.com','github-releases.githubusercontent.com','release-assets.githubusercontent.com'}]
          if redirects:
              assert all(x.get('authorization') is False for x in redirects), redirects
          assert hooks and any(x.get('plugin_match') and x.get('has_type') is False for x in hooks), hooks
          print('ASSET_API_AUTHORIZATION=PASS')
          print('REAL_BULK_HOOK_EXTRA_WITHOUT_TYPE=CONFIRMED')
          print('REDIRECT_RUNTIME_AUTHORIZATION_LEAK=NONE')
          PY

          wp eval --path="$WP_ROOT" '
            require_once ABSPATH."wp-admin/includes/plugin.php";
            $plugin=getenv("PLUGIN_FILE"); $data=get_plugin_data(WP_PLUGIN_DIR."/".$plugin,false,false);
            if ((string)($data["Version"]??"")!==getenv("TARGET_VERSION")) exit(41);
            if (!is_plugin_active($plugin)) exit(42);
            if ((string)get_option("vf_corrective_fixture_state","")!=="KEEP") exit(43);
            if ((string)get_option("vf_private_update_credential_v1","")!=="FIXTURE_SENTINEL_NOT_RUNTIME_CREDENTIAL") exit(44);
            if (!wp_next_scheduled("vf_corrective_fixture_cron")) exit(45);
            $role=get_role("administrator"); if(!$role || !$role->has_cap("vf_corrective_fixture_cap")) exit(46);
            echo "TARGET_VERSION_INSTALLED=PASS\nPLUGIN_ACTIVE=PASS\nOPTION_PRESERVED=PASS\nSECRET_STORAGE_PRESERVED=PASS\nCRON_PRESERVED=PASS\nCAPABILITY_PRESERVED=PASS\n";
          '

          if [ "$COMPONENT" = OPS ]; then
            wp eval --path="$WP_ROOT" 'do_action("admin_init"); if(count(vf_tools_ops_v6_table_suffixes())!==48) exit(47); echo "TABLES_48_PRESERVED=PASS\n";'
          else
            wp eval --path="$WP_ROOT" 'if(function_exists("vf_tools_m3u8_v6_table_suffixes") && count(vf_tools_m3u8_v6_table_suffixes())!==14) exit(48); echo "M3U8_DATA_RUNTIME_PRESERVED=PASS\n";'
          fi

      - name: Build deterministic corrective candidate and fresh-install verify
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/candidate-out" "$RUNNER_TEMP/fresh-$COMPONENT"
          python3 - "$COMPONENT" "$CANDIDATE_COMMIT" "$CANDIDATE_ASSET" <<'PY'
          import hashlib,json,re,sys,zipfile
          from pathlib import Path
          comp,commit,asset=sys.argv[1:]
          if comp=='OPS':
              root=Path('candidate'); slug='vf-ops'
              def runtime(rel):
                  p=rel.as_posix().lstrip('/'); parts=p.split('/')
                  if not p or '..' in parts:return False
                  if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in parts):return False
                  if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',p,re.I):return False
                  if '/' not in p:return p in {'vf-ops.php','uninstall.php'}
                  return parts[0] in {'includes','assets','languages','config'}
          else:
              root=Path('candidate/src'); slug='vf-tool-m3u8'
              def runtime(rel):
                  p=rel.as_posix().lstrip('/'); parts=p.split('/'); base=parts[-1].lower() if parts else ''
                  if not p or '..' in parts:return False
                  if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in parts):return False
                  if base in {'readme.md','changelog.md','license','license.txt','package_profile.json'}:return False
                  if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',p,re.I):return False
                  if '/' not in p:return p in {'vf-tool-m3u8.php','uninstall.php','plugin-manifest.json','tool-settings.schema.json'}
                  return parts[0] in {'admin','config','includes','public','templates','tools'}
          files={}
          for f in root.rglob('*'):
              if f.is_file() and not f.is_symlink() and runtime(f.relative_to(root)):
                  files[f.relative_to(root).as_posix()]=f.read_bytes()
          files=dict(sorted(files.items()))
          out=Path('/tmp')/asset
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for rel,b in files.items():
                  zi=zipfile.ZipInfo(slug+'/'+rel,(2026,8,16,0,0,0));zi.compress_type=zipfile.ZIP_DEFLATED;zi.external_attr=0o100644<<16;z.writestr(zi,b)
          h=hashlib.sha256()
          for rel,b in files.items():
              h.update(rel.encode());h.update(b'\0');h.update(hashlib.sha256(b).hexdigest().encode());h.update(b'\n')
          meta={'component':comp,'candidate_commit':commit,'artifact':asset,'bytes':out.stat().st_size,'sha256':hashlib.sha256(out.read_bytes()).hexdigest(),'runtime_files':len(files),'runtime_fingerprint':h.hexdigest()}
          Path('/tmp/'+comp+'-candidate-meta.json').write_text(json.dumps(meta,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(meta))
          PY
          unzip -tq "/tmp/$CANDIDATE_ASSET" >/dev/null

          DB="vf_fresh_${COMPONENT,,}"
          mariadb -h127.0.0.1 -uroot -proot -e "CREATE DATABASE \`$DB\`; GRANT ALL PRIVILEGES ON \`$DB\`.* TO 'vf'@'%'; FLUSH PRIVILEGES;"
          FRESH="$RUNNER_TEMP/fresh-$COMPONENT"
          wp core download --path="$FRESH" --version=7.0.2 --force >/dev/null
          wp config create --path="$FRESH" --dbname="$DB" --dbuser=vf --dbpass=vf --dbhost=127.0.0.1:3306 --skip-check >/dev/null
          wp core install --path="$FRESH" --url=http://127.0.0.1:18096 --title="VF $COMPONENT Corrective Fresh" --admin_user=admin --admin_password='Fixture-Fresh-Only!' --admin_email=fixture@example.invalid --skip-email >/dev/null
          wp plugin install "/tmp/$CANDIDATE_ASSET" --path="$FRESH" --activate >/dev/null
          wp eval --path="$FRESH" '
            require_once ABSPATH."wp-admin/includes/plugin.php"; $p=getenv("PLUGIN_FILE"); $d=get_plugin_data(WP_PLUGIN_DIR."/".$p,false,false);
            if((string)($d["Version"]??"")!==getenv("CANDIDATE_VERSION")) exit(51); if(!is_plugin_active($p)) exit(52); echo "CORRECTIVE_FRESH_INSTALL=PASS\n";
          '

      - name: Seal redacted candidate evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "evidence/$COMPONENT"
          python3 - "/tmp/$COMPONENT-candidate-meta.json" "evidence/$COMPONENT/result.json" <<'PY'
          import json,sys,datetime
          meta=json.load(open(sys.argv[1],encoding='utf-8'))
          out={'result':'PASS','component':meta['component'],'candidate_commit':meta['candidate_commit'],'corrective_version':__import__('os').environ['CANDIDATE_VERSION'],'artifact':meta['artifact'],'artifact_bytes':meta['bytes'],'artifact_sha256':meta['sha256'],'runtime_files':meta['runtime_files'],'runtime_fingerprint':meta['runtime_fingerprint'],'real_wordpress_bulk_plugin_upgrader_private_asset':'PASS','real_private_github_asset':'PASS','missing_token':'FAIL_CLOSED','wrong_token':'FAIL_CLOSED','unexpected_host':'NO_AUTH_REQUEST','redirect_secret_leak':'NONE','bytes_mismatch':'FAIL_CLOSED','sha_mismatch':'FAIL_CLOSED','state_preservation':'PASS','production_write':0,'existing_release_modified':False,'observed_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'evidence_privacy':'REDACTED_NO_SECRET_NO_SOURCE_NO_ZIP'}
          json.dump(out,open(sys.argv[2],'w',encoding='utf-8'),ensure_ascii=False,indent=2)
          PY
          cat "evidence/$COMPONENT/result.json"
          rm -f "/tmp/$CANDIDATE_ASSET" "/tmp/$COMPONENT-candidate-meta.json"
          rm -rf candidate production "$WP_ROOT" "$RUNNER_TEMP/fresh-$COMPONENT"
          echo 'PRIVATE_SOURCE_AND_ZIP_CLEANUP=PASS'

      - name: Public evidence secret/privacy gate
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if find evidence -type f \( -name '*.php' -o -name '*.zip' -o -name '*.sql' -o -name '*.db' -o -name '*.sqlite' -o -name '*.key' -o -name '*.pem' \) -print -quit | grep -q .; then exit 91; fi
          if grep -RIlE 'Bearer[[:space:]]+[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|VF_PRIVATE_READ_TOKEN[[:space:]]*[:=]' evidence 2>/dev/null | grep -q .; then exit 92; fi
          echo 'PUBLIC_EVIDENCE_PRIVACY=PASS'

      - name: Upload redacted evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-${{ matrix.component }}-private-asset-auth-corrective-${{ github.run_id }}
          path: evidence/${{ matrix.component }}/
          if-no-files-found: warn
          retention-days: 30
