name: P03 V1.36.0 Install Stage Debug
on:
  push:
    branches: [p03-v1360-runtime-integration]
  workflow_dispatch:
permissions:
  contents: read
env:
  EXPECTED_P03_HEAD: 209358a52ba5f65f51345638c098796d9f8ed703
  FIXTURE_PASS: Vf1360-Integrated-Test!
  PHP_TEST_IMAGE: vf-forge-v1360-debug-php84
jobs:
  debug-install:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Clone exact source and build image
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VF_PRIVATE_READ_TOKEN:-}"
          git clone --quiet --branch integration/v1.36.0-product-experience --single-branch "https://x-access-token:${VF_PRIVATE_READ_TOKEN}@github.com/llhzx2018/vf-forge.git" p03
          test "$(git -C p03 rev-parse HEAD)" = "$EXPECTED_P03_HEAD"
          mkdir -p evidence
          cat > "$RUNNER_TEMP/Dockerfile.v1360" <<'EOF'
          FROM php:8.4-cli-bookworm
          USER root
          RUN apt-get update && apt-get install -y --no-install-recommends libzip-dev libsqlite3-dev libcurl4-openssl-dev sqlite3 curl unzip && docker-php-ext-install zip pdo_sqlite curl && rm -rf /var/lib/apt/lists/*
          EOF
          docker build -q -t "$PHP_TEST_IMAGE" -f "$RUNNER_TEMP/Dockerfile.v1360" "$RUNNER_TEMP" >/dev/null
      - name: Diagnose runtime install
        working-directory: p03
        shell: bash
        run: |
          set -u
          E="$GITHUB_WORKSPACE/evidence/INSTALL_DEBUG.txt"; : > "$E"
          step(){ echo "$1" | tee -a "$E"; }
          RUNTIME="$RUNNER_TEMP/runtime"; DATA_ROOT="$RUNNER_TEMP/private"; COOKIE="$RUNNER_TEMP/cookie"; BASE='http://127.0.0.1:18082'; C='vf-forge-v1360-install-debug'
          rm -rf "$RUNTIME" "$DATA_ROOT" "$COOKIE"; mkdir -p "$DATA_ROOT"
          python3 scripts/build_runtime.py "$RUNTIME" >/dev/null || { step 'BUILD_RUNTIME=FAIL'; exit 1; }; step 'BUILD_RUNTIME=PASS'
          for f in app/ExperienceService.php assets/experience.js assets/experience.css memory-api.php setup.php; do test -f "$RUNTIME/$f" || { step "RUNTIME_FILE_MISSING=$f"; exit 1; }; done; step 'RUNTIME_FILES=PASS'
          docker rm -f "$C" >/dev/null 2>&1 || true
          docker run -d --rm --name "$C" -p 18082:18082 -e VF_PRIVATE_READ_TOKEN="$VF_PRIVATE_READ_TOKEN" -v "$RUNTIME:/app" -v "$DATA_ROOT:$DATA_ROOT" -w /app "$PHP_TEST_IMAGE" php -S 0.0.0.0:18082 -t /app >/dev/null || { step 'SERVER_START=FAIL'; exit 1; }; step 'SERVER_START=PASS'
          ready=0; for i in $(seq 1 60); do code=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/setup.php" || true); if [ "$code" = 200 ]; then ready=1; break; fi; sleep .25; done; step "SETUP_GET_HTTP=$code"; test "$ready" = 1 || { docker logs "$C" 2>&1 | tail -20 | sed -E 's/(token|password|secret)=[^ ]+/\1=[REDACTED]/Ig' >> "$E"; exit 1; }
          curl -fsS -c "$COOKIE" "$BASE/setup.php" -o "$RUNNER_TEMP/setup.html" || { step 'SETUP_GET_COOKIE=FAIL'; exit 1; }; step 'SETUP_GET_COOKIE=PASS'
          CSRF=$(python3 - "$RUNNER_TEMP/setup.html" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf" value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          ) || { step 'CSRF_EXTRACT=FAIL'; exit 1; }; step 'CSRF_EXTRACT=PASS'
          POST_CODE=$(curl -sS -D "$RUNNER_TEMP/post.headers" -o "$RUNNER_TEMP/post.body" -b "$COOKIE" -c "$COOKIE" -H "Origin: $BASE" --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=VF Forge Integrated Runtime Fixture' --data-urlencode "data_root=$DATA_ROOT" --data-urlencode "password=$FIXTURE_PASS" --data-urlencode "password_confirm=$FIXTURE_PASS" -w '%{http_code}' "$BASE/setup.php" || true); step "SETUP_POST_HTTP=$POST_CODE"
          if [ "$POST_CODE" != 302 ] && [ "$POST_CODE" != 303 ]; then grep -E '^(HTTP/|Location:)' "$RUNNER_TEMP/post.headers" >> "$E" || true; sed -E 's/[A-Za-z0-9+\/_=-]{24,}/[REDACTED]/g' "$RUNNER_TEMP/post.body" | head -20 >> "$E"; docker logs "$C" 2>&1 | tail -20 | sed -E 's/[A-Za-z0-9+\/_=-]{24,}/[REDACTED]/g' >> "$E"; docker rm -f "$C" >/dev/null 2>&1 || true; exit 1; fi
          DB=$(find "$DATA_ROOT" -type f -name '*.sqlite' | head -n1); if [ -z "$DB" ]; then step 'DB_FOUND=NO'; find "$DATA_ROOT" -maxdepth 3 -type f -printf '%P\n' >> "$E"; exit 1; fi; step 'DB_FOUND=YES'
          S=$(sqlite3 "$DB" 'select max(version) from schema_migrations;' 2>/dev/null || true); step "DB_SCHEMA=$S"
          I=$(sqlite3 "$DB" 'pragma integrity_check;' 2>/dev/null || true); step "DB_INTEGRITY=$I"
          A=$(sqlite3 "$DB" 'select count(*) from asset_files;' 2>/dev/null || true); step "ASSET_FILES=$A"
          docker rm -f "$C" >/dev/null 2>&1 || true
          test "$S" = 30; test "$I" = ok; test "$A" = 0
          step 'INSTALL_DEBUG=PASS'
      - name: Upload debug evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P03_V1360_INSTALL_DEBUG
          path: evidence
          retention-days: 1
