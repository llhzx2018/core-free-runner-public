name: TEMP S01-C02 Ops 1.21.826 Formal Release
on:
  push:
    branches: [temp/s01-c02-v121826-formal-release-20260905]
    paths: ['.github/workflows/temp-s01-c02-v121826-formal-release.yml']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      REPO: llhzx2018/vf-tools-ops
      COMMIT: eb41c358d106ec5deea36d88ee426bd63aee973d
      TREE: 13c862a05276eaff38e1730b668e0725956dd506
      GATE_RUN: '33982282870'
      GATE_SHA: 47504d951b8584774c226af6ab80ed3ed046de3a
      IDENTITY_RUN: '33982329754'
      TAG: v1.21.826
      ASSET: vf-tools-ops_V1.21.826.zip
      BYTES: '3245802'
      SHA256: d162dd4ea95462cc1ea942eede92c69c3b550a11d72fce12ae23c1ba336974dd
      FILES: '908'
      FP: fe6fd49404aa0b43cd58bd64ef7986091b80e39b830bd80bd54dacd042bc5762
    steps:
      - name: Verify authority gates and release absence
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          W: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$R"; test -n "$W"
          for run in "$GATE_RUN" "$IDENTITY_RUN"; do
            J="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/runs/$run")"
            test "$(jq -r .status <<<"$J")" = completed
            test "$(jq -r .conclusion <<<"$J")" = success
          done
          G="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/runs/$GATE_RUN")"
          test "$(jq -r .head_sha <<<"$G")" = "$GATE_SHA"
          L="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$REPO/releases/latest")"
          test "$(jq -r .tag_name <<<"$L")" = v1.21.825
          for b in main develop; do
            B="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$REPO/branches/$b")"
            test "$(jq -r .commit.sha <<<"$B")" = "$COMMIT"
            test "$(jq -r .commit.commit.tree.sha <<<"$B")" = "$TREE"
          done
          code="$(curl -sS -o /tmp/existing -w '%{http_code}' -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$REPO/releases/tags/$TAG")"
          test "$code" = 404
          code="$(curl -sS -o /tmp/tag-existing -w '%{http_code}' -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$REPO/git/ref/tags/$TAG")"
          test "$code" = 404
          echo RELEASE_AUTHORITY_V121826=PASS

      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.COMMIT }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: ops

      - name: Rebuild exact artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$COMMIT"
          test "$(git -C ops rev-parse HEAD^{tree})" = "$TREE"
          test "$(tr -d '\r\n' < ops/VERSION)" = 1.21.826
          grep -Fq 'Version: 1.21.826' ops/vf-ops.php
          php ops/.github/phase3/v121826-candidate-route-normalization.php | grep -Fxq PASS_V121826_CANDIDATE_ROUTE_NORMALIZATION
          mkdir -p /tmp/release
          python3 - <<'PY'
          import re,hashlib,zipfile,os
          from pathlib import Path
          root=Path('ops'); f={}
          def ok(r):
            p=r.as_posix(); q=p.split('/')
            if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in q): return False
            if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',p,re.I): return False
            if '/' not in p: return p in {'vf-ops.php','uninstall.php'}
            return q[0] in {'includes','assets','languages','config'}
          for s in root.rglob('*'):
            if s.is_file() and not s.is_symlink():
              r=s.relative_to(root)
              if ok(r): f[r.as_posix()]=s.read_bytes()
          f=dict(sorted(f.items())); fp=hashlib.sha256()
          for r,b in f.items(): fp.update((r+'\0'+hashlib.sha256(b).hexdigest()+'\n').encode())
          z=Path('/tmp/release/'+os.environ['ASSET'])
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as o:
            for r,b in f.items():
              i=zipfile.ZipInfo('vf-ops/'+r,(2026,9,5,0,0,0)); i.compress_type=zipfile.ZIP_DEFLATED; i.external_attr=0o100644<<16; o.writestr(i,b)
          assert z.stat().st_size==int(os.environ['BYTES'])
          assert hashlib.sha256(z.read_bytes()).hexdigest()==os.environ['SHA256']
          assert len(f)==int(os.environ['FILES'])
          assert fp.hexdigest()==os.environ['FP']
          PY
          unzip -tq "/tmp/release/$ASSET" >/dev/null
          unzip -p "/tmp/release/$ASSET" vf-ops/includes/release/builders/class-candidate-route-normalizer.php | grep -Fq 'count($matches) === 1'
          echo EXACT_ARTIFACT_V121826=PASS

      - name: Create formal tag release and asset
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          W: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -n --arg ref "refs/tags/$TAG" --arg sha "$COMMIT" '{ref:$ref,sha:$sha}' >/tmp/tag.json
          curl -fsSL -X POST -H "Authorization: Bearer $W" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' "https://api.github.com/repos/$REPO/git/refs" --data-binary @/tmp/tag.json >/tmp/tag-out.json
          test "$(jq -r .object.sha /tmp/tag-out.json)" = "$COMMIT"
          cat >/tmp/body.md <<EOF
          VF Tools Ops V1.21.826 adds a fail-closed Candidate-only route normalization layer for the S01 Static Candidate build.

          - Focused Gate $GATE_RUN PASS on exact source $COMMIT / tree $TREE; deterministic artifact identity run $IDENTITY_RUN PASS.
          - Existing recovered Static Source is reused. WordPress source content and the source ZIP are not mutated by this repair.
          - Missing archive anchor routes are unlinked while preserving visible anchor content; they are not redirected to unrelated content.
          - Core tool routes are never guessed or silently remapped.
          - Ordinary content anchors are relocated only when the Candidate route inventory has exactly one same-language, same-slug root↔blog/guides/problems/faq match.
          - Ambiguous or unmatched links remain unchanged and continue to fail the existing Final Audit.
          - Canonical, hreflang, OG/JSON identity and Final Audit rules are unchanged; no Gate relaxation or forced PASS exists.
          - Small-package and large batched Candidate builders share the same route-normalization contract; large builds persist the inventory once to job-private state.
          - No repeat Source ZIP upload is authorized. A new Candidate build is required after Production upgrades to this version so the new builder code can act on the recovered Source.
          - M3U8 migration/data, Seed HOLD, JD.gg, WPvivid, content governance, schema and DNS are untouched.
          - Asset $ASSET; $BYTES bytes; SHA256 $SHA256; runtime files $FILES; fingerprint $FP.
          - Production upgrade is NOT executed by this GitHub Release.
          EOF
          sed -i 's/^          //' /tmp/body.md
          jq -n --arg tag "$TAG" --arg name 'VF Tools Ops v1.21.826' --rawfile body /tmp/body.md '{tag_name:$tag,name:$name,body:$body,draft:false,prerelease:false}' >/tmp/rel.json
          curl -fsSL -X POST -H "Authorization: Bearer $W" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' "https://api.github.com/repos/$REPO/releases" --data-binary @/tmp/rel.json >/tmp/rel-out.json
          RID="$(jq -r .id /tmp/rel-out.json)"; test -n "$RID"; test "$RID" != null
          curl -fsSL -X POST -H "Authorization: Bearer $W" -H 'Content-Type: application/zip' "https://uploads.github.com/repos/$REPO/releases/$RID/assets?name=$ASSET" --data-binary "@/tmp/release/$ASSET" >/tmp/asset-out.json
          test "$(jq -r .size /tmp/asset-out.json)" = "$BYTES"
          L="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$REPO/releases/tags/$TAG")"
          test "$(jq -r .tag_name <<<"$L")" = "$TAG"
          test "$(jq -r .draft <<<"$L")" = false
          test "$(jq -r .prerelease <<<"$L")" = false
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.size' <<<"$L")" = "$BYTES"
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.digest' <<<"$L")" = "sha256:$SHA256"
          T="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$REPO/git/ref/tags/$TAG")"
          test "$(jq -r .object.sha <<<"$T")" = "$COMMIT"
          echo FORMAL_RELEASE_V121826=PASS
