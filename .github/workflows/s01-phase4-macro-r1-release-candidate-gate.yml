name: S01 Phase 4 Macro R1 Release Candidate Gate

on:
  push:
    branches:
      - task/s01-phase4-macro-r1-release-candidate-gate
    paths:
      - .github/workflows/s01-phase4-macro-r1-release-candidate-gate.yml

permissions:
  contents: read

jobs:
  candidate:
    name: RC Gate (${{ matrix.component }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: OPS
            repo: llhzx2018/vf-tools-ops
            base: 7c90688c5fe02d60c3d1b271d112442343533c8d
            head: 33e97949cfda4a92e30e0977b314e0d5c3307816
            version: 1.21.944
            allowed: assets/css/current/admin-s01-dashboard-r14.css,tests/s01-c02-page-body-system-v1-phase4-macro-contract.php,VERSION,vf-ops.php,CHANGELOG.md
          - component: THEME
            repo: llhzx2018/vf-tools-theme
            base: 0a1a4f3c1b72b8e1a9b3e21884f9b2fa2aa8a512
            head: c7ba7e788596655da46fcec458f7d4a112a8a1da
            version: 1.35.46
            allowed: src/assets/css/admin/admin-s01-page-body-system-v1.css,tests/s01-c01-page-body-system-v1-phase4-macro-contract.php,VERSION,src/inc/runtime-constants.php,src/style.css,src/theme.json,CHANGELOG.md
          - component: M3U8
            repo: llhzx2018/vf-tools-m3u8
            base: b058da1e449e773ebebb694c33675517608f87de
            head: de5d68767a05c73ded10f8dbb4fb6884d40b83c4
            version: 1.25.49
            allowed: src/admin/ui-v4/admin-s01-page-body-system-v1.css,tests/s01-c03-page-body-system-v1-phase4-macro-contract.php,VERSION,src/vf-tool-m3u8.php,CHANGELOG.md

    steps:
      - name: Credential and public-authority intake
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          cat <<'MATRIX'
          PUBLIC_AUTHORITY_APPLICABILITY
          INSTALL        N_A
          SECURITY       REQUIRED
          TESTING        REQUIRED
          UPGRADE        REQUIRED
          DATA_SCHEMA    N_A
          API_PROVIDER   N_A
          SEO            N_A
          CRON_JOB       N_A
          NOTIFICATION   N_A
          OBSERVABILITY  N_A
          PERFORMANCE    N_A
          GIT            REQUIRED
          UA_UI          REQUIRED
          MATRIX
          echo "OWNER_PREVIEW_RUNTIME_APPLICABILITY=N_A"
          echo "OWNER_REAL_USE=POST_PRODUCTION_REQUIRED"
          echo "OWNER_DIRECT_RELEASE_AUTHORIZATION=PASS"

      - name: Verify exact private source and bounded diff
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          REPO: ${{ matrix.repo }}
          BASE: ${{ matrix.base }}
          HEAD: ${{ matrix.head }}
          ALLOWED: ${{ matrix.allowed }}
        run: |
          set -Eeuo pipefail
          curl -fsSL             -H "Authorization: Bearer $READ_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/commits/$HEAD" -o /tmp/head.json
          test "$(jq -r '.sha' /tmp/head.json)" = "$HEAD"
          curl -fsSL             -H "Authorization: Bearer $READ_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/compare/$BASE...$HEAD" -o /tmp/compare.json
          test "$(jq -r '.status' /tmp/compare.json)" = "ahead"
          IFS=',' read -r -a EXPECTED <<< "$ALLOWED"
          mapfile -t ACTUAL < <(jq -r '.files[].filename' /tmp/compare.json | sort)
          mapfile -t WANT < <(printf '%s\n' "${EXPECTED[@]}" | sort)
          diff -u <(printf '%s\n' "${WANT[@]}") <(printf '%s\n' "${ACTUAL[@]}")
          echo "EXACT_SOURCE_AND_BOUNDED_DIFF=PASS"

      - name: Fetch exact candidate
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          REPO: ${{ matrix.repo }}
          HEAD: ${{ matrix.head }}
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/src /tmp/src.tar.gz
          mkdir -p /tmp/src
          curl -fsSL -L             -H "Authorization: Bearer $READ_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/tarball/$HEAD" -o /tmp/src.tar.gz
          tar -xzf /tmp/src.tar.gz -C /tmp/src
          SOURCE_DIR="$(find /tmp/src -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$SOURCE_DIR"
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          echo "EXACT_CANDIDATE_FETCH=PASS"

      - name: Version identity and PHP syntax
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
          VERSION: ${{ matrix.version }}
        run: |
          set -Eeuo pipefail
          test "$(tr -d '\r\n' < "$SOURCE_DIR/VERSION")" = "$VERSION"
          case "$COMPONENT" in
            OPS)
              grep -F "Version: $VERSION" "$SOURCE_DIR/vf-ops.php"
              grep -F "VF_OPS_VERSION', '$VERSION'" "$SOURCE_DIR/vf-ops.php"
              php -l "$SOURCE_DIR/vf-ops.php"
              ;;
            THEME)
              grep -F "Version: $VERSION" "$SOURCE_DIR/src/style.css"
              grep -F "VF_THEME_VERSION', '$VERSION'" "$SOURCE_DIR/src/inc/runtime-constants.php"
              php -l "$SOURCE_DIR/src/inc/runtime-constants.php"
              ;;
            M3U8)
              grep -F "Version: $VERSION" "$SOURCE_DIR/src/vf-tool-m3u8.php"
              grep -F "VF_TOOL_M3U8_VERSION', '$VERSION'" "$SOURCE_DIR/src/vf-tool-m3u8.php"
              php -l "$SOURCE_DIR/src/vf-tool-m3u8.php"
              ;;
          esac
          echo "VERSION_IDENTITY=PASS"

      - name: Exact UI and frozen-boundary contracts
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          set -Eeuo pipefail
          case "$COMPONENT" in
            OPS)
              php "$SOURCE_DIR/tests/s01-c02-page-body-system-v1-phase4-macro-contract.php"
              php "$SOURCE_DIR/tests/s01-c02-page-body-system-v1-phase3-contract.php"
              php "$SOURCE_DIR/tests/s01-c02-page-body-system-v1-phase3-residue-contract.php"
              php "$SOURCE_DIR/tests/update-compat-human-language-contract.php"
              ;;
            THEME)
              php "$SOURCE_DIR/tests/s01-c01-page-body-system-v1-phase4-macro-contract.php"
              php "$SOURCE_DIR/tests/s01-c01-page-body-system-v1-phase3-contract.php"
              php "$SOURCE_DIR/tests/s01-c01-page-body-system-v1-phase3-residue-contract.php"
              php "$SOURCE_DIR/tests/update-center-human-language-contract.php"
              ;;
            M3U8)
              php "$SOURCE_DIR/tests/s01-c03-page-body-system-v1-phase4-macro-contract.php"
              php "$SOURCE_DIR/tests/s01-c03-page-body-system-v1-phase3-contract.php"
              php "$SOURCE_DIR/tests/s01-c03-page-body-system-v1-phase3-residue-contract.php"
              php "$SOURCE_DIR/tests/unit/package-physical-locator-contract.php"
              php "$SOURCE_DIR/tests/unit/update-schema-authority-contract.php"
              ;;
          esac
          echo "TESTING_UAUI_UPGRADE_CONTRACTS=PASS"

      - name: Build deterministic exact candidate package and security scan
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
          VERSION: ${{ matrix.version }}
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/out
          if [ "$COMPONENT" = "OPS" ]; then
            python3 "$SOURCE_DIR/.github/release/build-ops-package.py"               --source "$SOURCE_DIR"               --output "/tmp/out/vf-tools-ops_V$VERSION.zip" | tee /tmp/package-meta.json
          else
            python3 - "$SOURCE_DIR" "$COMPONENT" "$VERSION" <<'PY'
          import hashlib, json, re, sys, zipfile
          from pathlib import Path

          repo=Path(sys.argv[1]); component=sys.argv[2]; version=sys.argv[3]
          if component=="THEME":
              src=repo/"src"; top="vf-tools-theme"; out=Path(f"/tmp/out/vf-tools-theme_V{version}.zip")
              def runtime(rel):
                  parts=rel.split("/")
                  if len(parts)==1:
                      return rel=="style.css" or rel.lower().endswith(".php")
                  return parts[0] in {"inc","assets","config","languages","template-parts","templates"}
              main="style.css"
          else:
              src=repo/"src"; top="vf-tool-m3u8"; out=Path(f"/tmp/out/vf-tools-m3u8_V{version}.zip")
              def runtime(rel):
                  base=rel.split("/")[-1].lower()
                  if base in {"readme.md","changelog.md","license","license.txt","package_profile.json"}: return False
                  if re.search(r"\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$", rel, re.I): return False
                  parts=rel.split("/")
                  if len(parts)==1:
                      return rel in {"vf-tool-m3u8.php","uninstall.php","plugin-manifest.json","tool-settings.schema.json"}
                  return parts[0] in {"admin","config","includes","public","templates","tools"}
              main="vf-tool-m3u8.php"

          files=[]
          for p in sorted(src.rglob("*")):
              if not p.is_file(): continue
              rel=p.relative_to(src).as_posix()
              if p.is_symlink(): raise SystemExit(f"symlink not allowed: {rel}")
              if re.search(r"(^|/)(\.git|\.github|tests?|docs?|evidence|private)(/|$)", rel, re.I):
                  raise SystemExit(f"dev/private path not allowed: {rel}")
              if re.search(r"\.(sql|sqlite|sqlite3|db|log|tar|gz)$", rel, re.I) or re.search(r"(^|/)\.env(?:\.|$)|(^|/)wp-config\.php$", rel, re.I):
                  raise SystemExit(f"forbidden package content: {rel}")
              files.append((rel,p.read_bytes()))

          epoch=(1980,1,1,0,0,0)
          with zipfile.ZipFile(out,"w",compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for rel,data in files:
                  zi=zipfile.ZipInfo(f"{top}/{rel}",epoch)
                  zi.compress_type=zipfile.ZIP_DEFLATED
                  zi.external_attr=0o100644 << 16
                  z.writestr(zi,data,compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)

          with zipfile.ZipFile(out) as z:
              names=[n for n in z.namelist() if not n.endswith("/")]
              if not names or any(not n.startswith(top+"/") for n in names): raise SystemExit("single-root failed")
              if f"{top}/{main}" not in names: raise SystemExit("main file missing")
              if any(n.startswith(f"{top}/{top}/") for n in names): raise SystemExit("double nested root")
              main_bytes=z.read(f"{top}/{main}").decode("utf-8")
              if component=="THEME":
                  if not re.search(rf"^Version:\s*{re.escape(version)}\s*$",main_bytes,re.M): raise SystemExit("theme version mismatch")
              else:
                  if not re.search(rf"^\s*\*\s*Version:\s*{re.escape(version)}\s*$",main_bytes,re.M): raise SystemExit("plugin version mismatch")

          rows=[]
          for rel,data in files:
              if runtime(rel):
                  rows.append((rel,hashlib.sha256(data).hexdigest()))
          canonical="".join(f"{p}\0{h}\n" for p,h in sorted(rows)).encode()
          meta={
              "version":version,
              "asset_name":out.name,
              "asset_bytes":out.stat().st_size,
              "asset_sha256":hashlib.sha256(out.read_bytes()).hexdigest(),
              "runtime_files":len(rows),
              "runtime_fingerprint":hashlib.sha256(canonical).hexdigest(),
              "package_slug":top,
              "root_contract":"PASS_SINGLE_ROOT",
          }
          Path("/tmp/package-meta.json").write_text(json.dumps(meta,sort_keys=True)+"\n")
          print(json.dumps(meta,sort_keys=True))
          PY
          fi
          test -s /tmp/package-meta.json
          jq -e '.asset_bytes > 0 and (.asset_sha256|length)==64 and .runtime_files > 0 and (.runtime_fingerprint|length)==64' /tmp/package-meta.json
          echo "SECURITY_PACKAGE_GATE=PASS"

      - name: Candidate gate summary
        shell: bash
        run: |
          set -Eeuo pipefail
          cat /tmp/package-meta.json
          echo "PUBLIC_AUTHORITY_RELEASE_COVERAGE=PASS"
          echo "NO_REQUIRED_GATE_MISSING=YES"
          echo "NO_UNKNOWN_APPLICABILITY=YES"
          echo "RELEASE_CANDIDATE_GATE=PASS"
