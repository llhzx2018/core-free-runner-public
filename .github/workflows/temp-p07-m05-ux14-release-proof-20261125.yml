name: TEMP P07 M05 UX14 immutable UX13 to UX14 release proof
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temp-p07-m05-ux14-release-proof-20261125.yml
permissions:
  contents: read
jobs:
  p07-m05-ux14-atomic:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.actor == 'llhzx2018' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'temp/p07-m05-ux14-release-proof-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      P07_SHA: 'b6b7f1b631f18367898540404961fd72d39b327a'
      P07_TREE: '767a1c6ae28c8337d99599e903d775821822ceb8'
      OLD_SHA: '969e0a61177f0ef85b4b06524579c506f0506d545c9e2acfc6b272ab5522142d'
      NEW_SHA: '8cca47f0a7bfed619daefe3074697f3837fc92c50103d218a12ca9149cd9d11d'
    steps:
      - name: Set up Python 3.13
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
      - name: Exact private final main source in ephemeral workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-server-ops
          ref: b6b7f1b631f18367898540404961fd72d39b327a
          path: transient-p07
          fetch-depth: 1
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Verify final source and run unchanged M05 security suites
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C transient-p07 rev-parse HEAD)" = "$P07_SHA"
          test "$(git -C transient-p07 rev-parse 'HEAD^{tree}')" = "$P07_TREE"
          echo P07_M05_FINAL_MAIN_SOURCE_TREE=PASS
          cd transient-p07
          for suite in test_p07_m05_trial_cache_guard.py test_p07_m05_dirty_host_guard.py test_p07_m05_installed_root_guard.py test_p07_m05_isolated_module.py test_p07_m05_host_write_gate.py; do
            log="$RUNNER_TEMP/$(basename "$suite").log"
            if ! python3 -B -m unittest discover -s tests -p "$suite" -q >"$log" 2>&1; then
              echo "P07_M05_FINAL_SUITE=FAIL:$suite"
              grep -E '^(FAIL|ERROR): test_[A-Za-z0-9_]+ ' "$log" | head -12 || true
              exit 13
            fi
            grep -E '^Ran [0-9]+ tests?' "$log" || true
            echo "P07_M05_FINAL_SUITE=PASS:$suite"
          done
      - name: Download immutable already-issued M05 UX13 ZIP
        shell: bash
        env:
          UX13_URL: 'https://github.com/llhzx2018/core-free-runner-public/releases/download/p07-m05-v0.1.0-ux13-provider-neutral-20261125/P07-M05-0.1.0-m05-ux13-provider-neutral.zip'
        run: |
          set -Eeuo pipefail
          set +x
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --retry 2 --max-time 95 "$UX13_URL" -o "$RUNNER_TEMP/old-ux13.zip"
          printf '%s  %s\n' "$OLD_SHA" "$RUNNER_TEMP/old-ux13.zip" | sha256sum -c - >/dev/null
          echo P07_M05_IMMUTABLE_ISSUED_UX13=PASS
      - name: Double build final UX14 ZIP and validate actual immutable bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd transient-p07
          python3 -B scripts/build_p07_m05_bundle.py --output "$RUNNER_TEMP/new-ux14-a.zip" > "$RUNNER_TEMP/ux14-builder-a.log"
          python3 -B scripts/build_p07_m05_bundle.py --output "$RUNNER_TEMP/new-ux14-b.zip" > "$RUNNER_TEMP/ux14-builder-b.log"
          cmp -s "$RUNNER_TEMP/new-ux14-a.zip" "$RUNNER_TEMP/new-ux14-b.zip"
          printf '%s  %s\n' "$NEW_SHA" "$RUNNER_TEMP/new-ux14-a.zip" | sha256sum -c - >/dev/null
          python3 -B - <<'PY'
          import os,zipfile
          p=os.path.join(os.environ["RUNNER_TEMP"],"new-ux14-a.zip")
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              assert all(n.startswith("p07-m05/") for n in names)
              assert "p07-m05/lib/m05_python_cache_guard.py" in names
              assert z.read("p07-m05/BUILD_ID")==b"0.1.0-m05-ux14-verified-pycache\n"
              assert all("/__pycache__/" not in n and not n.endswith(".pyc") for n in names)
              assert all("/.env" not in n and "/.git/" not in n for n in names)
          print("P07_M05_DOUBLE_BUILD_FINAL_ZIP=PASS")
          PY
      - name: Actual released UX13 to exact UX14 atomic, damage rejection, rollback, M01-04 unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          python3 -B - <<'PY'
          import hashlib,os,pathlib,sys,tempfile,zipfile,subprocess
          from pathlib import Path
          sys.path.insert(0,str(Path("transient-p07/scripts").resolve()))
          import install_p07_m05_bundle as inst
          os.environ["P07_M05_DISPOSABLE_TEST"]="1"
          home=Path(os.environ["RUNNER_TEMP"])
          old=home/"old-ux13.zip"
          new=home/"new-ux14-a.zip"
          oldsha=os.environ["OLD_SHA"]
          newsha=os.environ["NEW_SHA"]
          assert hashlib.sha256(old.read_bytes()).hexdigest()==oldsha
          assert hashlib.sha256(new.read_bytes()).hexdigest()==newsha
          with tempfile.TemporaryDirectory(prefix="p07-m05-ux14-formal-",dir=home) as td:
              root=Path(td)/"modules"
              root.mkdir(mode=0o700)
              other={}
              for idx in range(1,5):
                  target=root/f"m{idx:02d}"/"identity"
                  target.parent.mkdir()
                  target.write_bytes(f"P07-M{idx:02d}-unchanged\n".encode())
                  other[str(target)]=hashlib.sha256(target.read_bytes()).hexdigest()
              previous=inst.install(old,oldsha,root,test_mode=True)
              assert previous["installed_build"]=="0.1.0-m05-ux13-provider-neutral"
              current=root/"m05"/"current"
              assert current.is_symlink()
              assert current.resolve().joinpath("BUILD_ID").read_text().strip()==previous["installed_build"]
              try:
                  inst.install(new,"0"*64,root,test_mode=True)
                  raise AssertionError("mismatched hash must fail")
              except inst.IsolatedInstallError:
                  pass
              assert current.resolve().joinpath("BUILD_ID").read_text().strip()==previous["installed_build"]
              broken=Path(td)/"corrupt.zip"
              broken.write_bytes(new.read_bytes()[:-35]+b"CORRUPTED ZIP")
              try:
                  inst.install(broken,hashlib.sha256(broken.read_bytes()).hexdigest(),root,test_mode=True)
                  raise AssertionError("corrupt archive must fail")
              except (inst.IsolatedInstallError,zipfile.BadZipFile):
                  pass
              assert current.resolve().joinpath("BUILD_ID").read_text().strip()==previous["installed_build"]
              updated=inst.install(new,newsha,root,test_mode=True)
              assert updated["installed_build"]=="0.1.0-m05-ux14-verified-pycache"
              assert current.resolve().joinpath("BUILD_ID").read_text().strip()==updated["installed_build"]
              assert (root/"m05"/"releases"/previous["installed_build"]).is_dir()
              again=inst.install(new,newsha,root,test_mode=True)
              assert again["already_current"]
              assert all(hashlib.sha256(Path(path).read_bytes()).hexdigest()==sha for path,sha in other.items())
              print("P07_M05_REAL_UX13_TO_UX14_ATOMIC=PASS")
              print("P07_M05_REAL_OLD_AND_FINAL_SHA_VERIFIED=PASS")
              print("P07_M05_BAD_SHA_AND_CORRUPT_ARCHIVE_REFUSED=PASS")
              print("P07_M05_FOUR_UNRELATED_MODULES_UNCHANGED=PASS")
              restored=inst.rollback(previous["installed_build"],root,test_mode=True)
              assert restored["restored_build"]==previous["installed_build"]
              assert current.resolve().joinpath("BUILD_ID").read_text().strip()==previous["installed_build"]
              assert all(hashlib.sha256(Path(path).read_bytes()).hexdigest()==sha for path,sha in other.items())
              print("P07_M05_REAL_ISSUED_UX13_ROLLBACK=PASS")
          PY
      - name: Remove every transient private checkout and ZIP
        if: always()
        shell: bash
        run: |
          set +e
          set +x
          rm -rf -- "$GITHUB_WORKSPACE/transient-p07"
          rm -f -- "$RUNNER_TEMP"/test_p07_m05_*.py.log "$RUNNER_TEMP"/old-ux13.zip "$RUNNER_TEMP"/new-ux14-a.zip "$RUNNER_TEMP"/new-ux14-b.zip "$RUNNER_TEMP"/ux14-builder-a.log "$RUNNER_TEMP"/ux14-builder-b.log
          test ! -e "$GITHUB_WORKSPACE/transient-p07"
          echo P07_M05_PRIVATE_TEST_WORKSPACE_CLEANED=PASS
