name: TEMP S01-C02 Ops 1.21.831 Formal Release
on:
  push:
    branches:
      - temp/s01-c02-v121831-formal-release-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121831-formal-release.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PRODUCT_REPO: llhzx2018/vf-tools-ops
      COMMIT: b0ef670e5a9564ad33329cfee8d5902bfe6a0d47
      TREE: bc1290af8750d54f2f2c85b6814948b7b86d891c
      TAG: v1.21.831
      ASSET: vf-tools-ops_V1.21.831.zip
      BYTES: '3259206'
      SHA256: 5f85cbf2d385fc5a87e0c3a74b88da9a85dd8888823d9d252f3edf4390826cc2
      FILES: '913'
      FP: 29248ca9c1e62f8043ae9c244bd29405954319c0a26665907bdd318d9a5fce15
    steps:
      - name: Verify authority gates and release absence
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for b in main develop; do
            B="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$PRODUCT_REPO/branches/$b")"
            test "$(jq -r .commit.sha <<<"$B")" = "$COMMIT"
            test "$(jq -r .commit.commit.tree.sha <<<"$B")" = "$TREE"
          done
          release_code="$(curl -sS -o /tmp/release.json -w '%{http_code}' -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$PRODUCT_REPO/releases/tags/$TAG")"
          test "$release_code" = 404
          tag_code="$(curl -sS -o /tmp/ref.json -w '%{http_code}' -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$PRODUCT_REPO/git/ref/tags/$TAG")"
          test "$tag_code" = 404
          J="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/core-free-runner-public/git/ref/heads/main)"
          test "$(jq -r .object.sha <<<"$J")" = '0160b557ad4ae0e8c6acd97e7551285bc05870bd'
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.COMMIT }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops
      - name: Rebuild exact artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$COMMIT"
          test "$(git -C ops rev-parse HEAD^{tree})" = "$TREE"
          test "$(tr -d '\r\n' < ops/VERSION)" = 1.21.831
          php ops/.github/phase3/v121831-candidate-tail-replay-probe.php | grep -Fxq PASS_V121831_CANDIDATE_TAIL_REPLAY_PROBE
          python3 - <<'PY'
          import re,hashlib,zipfile,os
          from pathlib import Path
          root=Path('ops'); files={}
          def ok(r):
            p=r.as_posix(); q=p.split('/')
            if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in q): return False
            if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',p,re.I): return False
            if '/' not in p: return p in {'vf-ops.php','uninstall.php'}
            return q[0] in {'includes','assets','languages','config'}
          for s in root.rglob('*'):
            if s.is_file() and not s.is_symlink():
              r=s.relative_to(root)
              if ok(r): files[r.as_posix()]=s.read_bytes()
          files=dict(sorted(files.items())); fp=hashlib.sha256()
          for r,b in files.items(): fp.update((r+'\0'+hashlib.sha256(b).hexdigest()+'\n').encode())
          z=Path('/tmp/'+os.environ['ASSET'])
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as out:
            for r,b in files.items():
              info=zipfile.ZipInfo('vf-ops/'+r,(2026,9,5,0,0,0)); info.compress_type=zipfile.ZIP_DEFLATED; info.external_attr=0o100644<<16; out.writestr(info,b)
          assert z.stat().st_size == int(os.environ['BYTES'])
          assert hashlib.sha256(z.read_bytes()).hexdigest() == os.environ['SHA256']
          assert len(files) == int(os.environ['FILES'])
          assert fp.hexdigest() == os.environ['FP']
          PY
          unzip -tq "/tmp/$ASSET" >/dev/null
      - name: Create formal tag release and asset
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          VF Tools Ops V1.21.831 adds a privacy-safe read-only tail replay probe for the recovered Candidate Stage-4 build failure.

          - Focused Gate 33987285298 PASS on exact source b0ef670e5a9564ad33329cfee8d5902bfe6a0d47 / tree bc1290af8750d54f2f2c85b6814948b7b86d891c; deterministic Artifact Identity 33987346597 PASS.
          - The probe runs only for the already-terminal Stage-4 Candidate whose V1.21.830 class is candidate_build_unclassified.
          - It replays at most the unprocessed tail entries in memory and reports only relative index, broad entry kind, processing phase and allowlisted Throwable class.
          - It does NOT expose raw error text, job identity, local paths, filenames, URLs or Source SHA.
          - It does NOT write Candidate/Source/content state, schedule work, retry the failed Candidate, relax Final Audit or force Candidate/package/finalOnline PASS.
          - Production pre-release truth remains Candidate FAIL at build offset 225/231; the trusted Static Source remains reusable and manualSourceUploadRequired=false.
          - The temporary noop probe file was removed before this candidate; 1.21.830 cleanup tree equals the released 1.21.830 runtime tree and the 1.21.831 Gate verified no _noop residue on main/develop.
          - M3U8 migration/data, Seed HOLD, JD.gg, WPvivid, schema, content governance and DNS are untouched.
          - Asset vf-tools-ops_V1.21.831.zip; 3259206 bytes; SHA256 5f85cbf2d385fc5a87e0c3a74b88da9a85dd8888823d9d252f3edf4390826cc2; runtime files 913; fingerprint 29248ca9c1e62f8043ae9c244bd29405954319c0a26665907bdd318d9a5fce15.
          - Production upgrade is NOT executed by this GitHub Release.
          EOF
          gh release create "$TAG" "/tmp/$ASSET" --repo "$PRODUCT_REPO" --target "$COMMIT" --title 'VF Tools Ops v1.21.831' --notes-file /tmp/release-notes.md
