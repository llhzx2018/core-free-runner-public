name: P04 Provider Search Pointer Return Audit

on:
  push:
    branches:
      - audit/p04-provider-search-pointer-return-20260830

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CANDIDATE: 7321f9594bf3333b89abae74c06ff1c2afdf286c
      EVIDENCE: ${{ github.workspace }}/evidence-p04-provider-pointer-return
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify private read
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: test -n "$PRIVATE_READ_TOKEN" || exit 78
      - name: Checkout exact P04 develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-infra
          ref: ${{ env.CANDIDATE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, fileinfo, sodium, zip, curl, mbstring
          coverage: none
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Exact source and relevant contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$CANDIDATE"
          test "$(tr -d '\r\n' < product/VERSION)" = '2.8.11'
          cd product
          python scripts/repository-health-gate.py
          python scripts/check-migrations.py
          node --check public/assets/daily-ux-polish.js
          node --check public/assets/v275-ua-workflow.js
          node --check public/assets/daily-provider-ux-polish.js
          php tests/unit/ui_daily_ux_polish_contract.php .
          php tests/unit/ui_daily_provider_ux_polish_contract.php .
          php tests/unit/ui_detail_technical_language_contract.php .
      - name: Install Fresh Chromium
        run: |
          set -Eeuo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save --no-package-lock playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Fresh provider pointer + return audit
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE"
          WEB="$RUNNER_TEMP/p04-provider-pointer-return-runtime"
          python3 product/scripts/build-release-tree.py "$WEB" >"$EVIDENCE/build.json"
          PORT=19062
          php -d opcache.jit=0 -S "127.0.0.1:$PORT" -t "$WEB" >"$EVIDENCE/php-server.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 120); do curl -fsS "http://127.0.0.1:$PORT/setup.php" >/dev/null 2>&1 && break; sleep .1; done
          EVIDENCE="$EVIDENCE" CANDIDATE="$CANDIDATE" WEB_ROOT="$WEB" PRODUCT_ROOT="$GITHUB_WORKSPACE/product" VF_E2E_BASE_URL="http://127.0.0.1:$PORT" node scripts/p04-provider-search-pointer-return-audit-20260830.mjs
          grep -Fq '"status": "PASS"' "$EVIDENCE/P04_PROVIDER_SEARCH_POINTER_RETURN_AUDIT.json"
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: P04-PROVIDER-SEARCH-POINTER-RETURN-${{ env.CANDIDATE }}
          path: evidence-p04-provider-pointer-return/
          if-no-files-found: error
          retention-days: 14
