name: P05 CloudPanel FPM Home Cache Exact Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  exact-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      P05_EXACT_SOURCE: 7ff7af72ddecfcaf87867f6b31b81df61929025c
    steps:
      - name: Checkout runner source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout exact private P05 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: 7ff7af72ddecfcaf87867f6b31b81df61929025c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: p05

      - name: Verify exact source
        working-directory: p05
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$P05_EXACT_SOURCE"
          echo "P05_EXACT_SOURCE=$P05_EXACT_SOURCE"

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: p05/package-lock.json

      - name: Install dependencies
        working-directory: p05
        run: npm ci

      - name: Release identity
        working-directory: p05
        run: |
          set -euo pipefail
          npm run release:source:gate
          test "$(cat VERSION)" = '1.1.7'

      - name: PHP syntax and CloudPanel FPM path/cache contract
        working-directory: p05
        run: |
          set -euo pipefail
          php -v
          php -l php/src/RuntimePaths.php
          php -l php/src/setup-bootstrap.php
          bash php/tests/cloudpanel-fpm-home-cache-smoke.sh

      - name: Build formal PHP staging
        working-directory: p05
        run: |
          set -euo pipefail
          npm run build
          npm run build:php-release
          npm run php:release:gate

      - name: HOME-unset CloudPanel real install
        working-directory: p05
        run: |
          set -euo pipefail
          VF_INSTALL_ROOT=build/vf-seo-php-release bash php/tests/cloudpanel-fpm-real-install-smoke.sh

      - name: Existing browser-first regression
        working-directory: p05
        run: |
          set -euo pipefail
          VF_INSTALL_ROOT=build/vf-seo-php-release bash php/tests/browser-install-smoke.sh

      - name: Real Chrome regression
        working-directory: p05
        run: |
          set -euo pipefail
          google-chrome --version
          "$CHROMEWEBDRIVER/chromedriver" --version
          VF_INSTALL_ROOT=build/vf-seo-php-release python3 php/tests/browser-install-e2e.py

      - name: Machine receipt
        run: |
          echo 'P05_V117_CLOUDPANEL_FPM_MACHINE=PASS'
          echo 'P05_EXACT_SOURCE=7ff7af72ddecfcaf87867f6b31b81df61929025c'
          echo 'VERSION=1.1.7'
          echo 'HOME_UNSET=PASS'
          echo 'LEGACY_SHARED_STATE_IGNORED=PASS'
          echo 'CLOUDFLARE_NOSTORE=PASS'
          echo 'BROWSER_FIRST_INSTALL=PASS'
          echo 'CHROME_E2E=PASS'
          echo 'RELEASE_WRITE=0'
          echo 'PRODUCTION_WRITE=0'
