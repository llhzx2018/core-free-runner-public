name: P01 V2.37.4 AVIF Negotiation Gate R2
on:
  push:
    branches: [run/p01-v2374-avif-negotiation-20260902]
    paths:
      - .github/workflows/p01-v2374-avif-negotiation-r2-20260902.yml
permissions:
  contents: read
jobs:
  gate-r2:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: run/p01-v2374-avif-negotiation-20260902
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: 740610e6529dbc0997af3112d83c0aa95bd8d0ac
          fetch-depth: 0
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          path: product
      - name: Harness-only duplicate require correction
        run: sed -i "/ResourceAssetStore.php';/d" runner/scripts/p01_v2374_avif_negotiation.sh
      - name: Patch, regress, and stage exact hotfix R2
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: bash runner/scripts/p01_v2374_avif_negotiation.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-v2374-avif-negotiation-r2-${{ github.run_id }}
          path: /tmp/p01-v2374-avif-evidence
          if-no-files-found: warn
          retention-days: 90
