name: P04 V2.8.6 Post Release Authority

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p04-v286-post-release-authority.yml'
      - 'requests/p04-v286-post-release-authority.txt'

permissions:
  contents: read

jobs:
  authority:
    runs-on: ubuntu-24.04
    env:
      P04_REPOSITORY: llhzx2018/vf-infra
      EXPECTED_HEAD: 906f16a39f305d7bbc668cd8d371a34304944a67
      RELEASE_ID: '373012164'
      FULL_ASSET_ID: '520784289'
      UPDATE_ASSET_ID: '520784290'
      CORE_UPDATES_COMMIT: a82227326965b3527fc668244d76152151a63414
      PUSH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Checkout exact P04 develop
        uses: actions/checkout@v4
        with:
          repository: ${{ env.P04_REPOSITORY }}
          ref: develop
          token: ${{ env.PUSH_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: source

      - name: Patch formal release Current Truth only
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PUSH_TOKEN"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch origin main develop
          test "$(git rev-parse origin/main)" = "$EXPECTED_HEAD"
          test "$(git rev-parse origin/develop)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          from pathlib import Path
          import json, os
          p=Path('VF_PROJECT.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['project_id']=='P04' and d['version']=='2.8.6' and d['schema']==14
          d['status']='V2.8.6_FORMAL_RELEASE_PUBLISHED'
          d['lifecycle']='RELEASED_WAITING_OWNER_PRODUCTION_UPGRADE'
          d['branch_authority']['main']='V2.8.6_FORMAL_RELEASE_PLUS_GOVERNANCE'
          d['branch_authority']['develop']='V2.8.6_FORMAL_RELEASE_PLUS_GOVERNANCE'
          d['branch_authority']['formal_product_source']='d98c2bc9281f259b6ba9f90855b01e42b73eabb3'
          d['branch_authority']['formal_product_tree']='40a5ae119812676aaf2f6e5a89e0e9c238876457'
          d['branch_authority']['formal_tag']='v2.8.6'
          d['formal_release']={
            'version':'2.8.6','tag':'v2.8.6','release_id':int(os.environ['RELEASE_ID']),
            'product_source':'d98c2bc9281f259b6ba9f90855b01e42b73eabb3',
            'product_tree':'40a5ae119812676aaf2f6e5a89e0e9c238876457','schema':14,
            'full_asset_id':int(os.environ['FULL_ASSET_ID']),'full_asset_name':'VF_Infra_V2.8.6_FULL.zip',
            'full_bytes':579762,'full_sha256':'1f77d7522a2cad2c4e3a0f4528dff410aaa4d8f3cb5b0c77465c8f9b7016bf40',
            'update_asset_id':int(os.environ['UPDATE_ASSET_ID']),'update_asset_name':'VF_Infra_V2.8.6_UPDATE.zip',
            'update_bytes':1250606,'update_sha256':'990437edf412efa4ffda89caf32823f059f945c205a34ed87db7db9486fe6106',
            'core_updates_commit':os.environ['CORE_UPDATES_COMMIT'],'remote_asset_readback':'PASS','status':'PASS'
          }
          d['verification_gates']['v286_formal_release']='PASS'
          d['verification_gates']['v286_remote_asset_readback']='PASS'
          d['verification_gates']['v286_core_updates_publish']='PASS'
          d['verification_gates']['production_v286_upgrade']='NOT_EXECUTED'
          d['production']['installed_version']='2.8.5'
          d['production']['upgrade_v286']='NOT_EXECUTED'
          d['production']['next_requirement']='OWNER_REAL_UPGRADE_TO_V2.8.6'
          d['current_phase']='V2.8.6_FORMAL_RELEASE_PUBLISHED_WAITING_OWNER_REAL_UPGRADE'
          d['next_gate']='OWNER_REAL_PRODUCTION_UPGRADE'
          d['next_action']='OWNER_OPEN_SYSTEM_UPDATE_AND_UPGRADE_TO_V2.8.6'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          ssot='''# P04 · VF Infra · Current Truth SSOT\n\n> Current Truth：2026-08-19 19:56 +08:00  \n> Repository：`llhzx2018/vf-infra`  \n> Production Runtime：`2.8.5`  \n> Production Schema：`14`  \n> Formal Release：`2.8.6 / PASS`  \n> Provider Authority：`READ_ONLY_FIRST`  \n> Project Block：`NONE`\n\n## 1. Current Truth\n\n```text\nProduction: 2.8.5 / OWNER real-use readback\nSchema: 14\nV2.8.6 Formal Release: PASS\nV2.8.6 Product Source: d98c2bc9281f259b6ba9f90855b01e42b73eabb3\nV2.8.6 Product Tree: 40a5ae119812676aaf2f6e5a89e0e9c238876457\nTag: v2.8.6\nRelease ID: 373012164\ncore-updates: a82227326965b3527fc668244d76152151a63414 / PASS\nProduction Upgrade: NOT EXECUTED\n```\n\n## 2. V2.8.6 Maintenance Result\n\n已修复：诊断按钮即时反馈与结果保留、时区/默认币种对齐、后台自动任务个人化文案、`data-v271-action` 到既有长耗时反馈层的兼容桥。Schema 14，无 Migration，不扩大 Provider 写权限。\n\n## 3. Formal Artifacts\n\n```text\nFULL: VF_Infra_V2.8.6_FULL.zip\nBytes: 579762\nSHA-256: 1f77d7522a2cad2c4e3a0f4528dff410aaa4d8f3cb5b0c77465c8f9b7016bf40\nAsset ID: 520784289\n\nUPDATE: VF_Infra_V2.8.6_UPDATE.zip\nBytes: 1250606\nSHA-256: 990437edf412efa4ffda89caf32823f059f945c205a34ed87db7db9486fe6106\nAsset ID: 520784290\nRemote Download + SHA Readback: PASS\n```\n\n## 4. Distribution\n\n`core-updates/projects/P04.json` 已发布 `target_version = 2.8.6`，允许 `2.7.9 / 2.8.0 / 2.8.1 / 2.8.2 / 2.8.3 / 2.8.4 / 2.8.5 → 2.8.6`。\n\n## 5. 唯一下一 Gate\n\n```text\nOWNER_REAL_PRODUCTION_UPGRADE\n```\n\n正式 Release 已完成，但 Production 当前仍是 2.8.5。未经 OWNER 实际点击升级并回读前，不得宣布 Production 2.8.6 / FINAL_ONLINE_PASS。\n'''
          Path('docs/authority/SSOT.md').write_text(ssot,encoding='utf-8')
          matrix='''# VF Infra Current Acceptance Matrix · V2.8.6 Formal Release\n\n| Gate | 状态 |\n|---|---|\n| Exact Tested Product Source | PASS / `d98c2bc9281f259b6ba9f90855b01e42b73eabb3` |\n| Product Tree | PASS / `40a5ae119812676aaf2f6e5a89e0e9c238876457` |\n| Schema | PASS / `14` |\n| Migration | `NONE` |\n| Repository Health | PASS |\n| Migration 001-014 | PASS |\n| Browser OWNER Defect Regression | PASS |\n| Tag `v2.8.6` | PASS |\n| GitHub Release | PASS / `373012164` |\n| FULL Asset | PASS / `520784289` / `579762` bytes |\n| FULL SHA-256 | `1f77d7522a2cad2c4e3a0f4528dff410aaa4d8f3cb5b0c77465c8f9b7016bf40` |\n| UPDATE Asset | PASS / `520784290` / `1250606` bytes |\n| UPDATE SHA-256 | `990437edf412efa4ffda89caf32823f059f945c205a34ed87db7db9486fe6106` |\n| Remote Asset Download + Hash | PASS |\n| core-updates | PASS / `a82227326965b3527fc668244d76152151a63414` |\n| Provider Authority | `READ_ONLY_FIRST` |\n| Production Version | `2.8.5` |\n| Production V2.8.6 Upgrade | `NOT_EXECUTED` |\n| Project Block | `NONE` |\n\n## Final Gate\n\n```text\nFORMAL_RELEASE: PASS\nDISTRIBUTION: PASS\nPRODUCTION_WRITE_BY_RELEASE_RUN: 0\nNEXT: OWNER_REAL_PRODUCTION_UPGRADE\n```\n'''
          Path('docs/authority/ACCEPTANCE_MATRIX.md').write_text(matrix,encoding='utf-8')
          PY
          python3 -m json.tool VF_PROJECT.json >/dev/null
          CHANGED=$(git diff --name-only | sort)
          EXPECTED=$(printf '%s\n' VF_PROJECT.json docs/authority/ACCEPTANCE_MATRIX.md docs/authority/SSOT.md | sort)
          test "$CHANGED" = "$EXPECTED"

      - name: Commit and align main develop non-force
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VF_PROJECT.json docs/authority/SSOT.md docs/authority/ACCEPTANCE_MATRIX.md
          git commit -m 'chore(P04): close V2.8.6 formal release authority'
          NEW=$(git rev-parse HEAD)
          git push origin HEAD:develop
          git push origin HEAD:main
          echo "P04_V286_AUTHORITY_COMMIT=$NEW"
          echo 'RUNTIME_CHANGE=0'
          echo 'PRODUCTION_WRITE=0'
