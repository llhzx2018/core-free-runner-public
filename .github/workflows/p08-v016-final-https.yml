name: P08 v016 final issued-v015 and final full Owner HTTPS Chromium
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/p08-v016-final-https.yml, scripts/p08_v016_final_real_https.sh, scripts/p08_v016_final_owner_https.spec.ts]
permissions:
  contents: read
jobs:
  final-real-https:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-v016-final-https-20261121'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        edition: [old, target]
    env:
      CI: 'true'
      P08_ISOLATED_INSTALL_TEST: 'YES'
      P08_V016_FINAL_HTTPS: 'YES'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout isolated public-safe browser harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact final private v016 main without persisted token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: ed96b18627cd0a63b1da20a1fd8c9b6c1808f159
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
      - name: Checkout effective public governance Mode Y
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 80ab251e15e63fc01a4e587e93054b0f6d0179a5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov
      - name: Native PHP 8.4 Composer runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: zip,curl,mbstring,pdo_sqlite,sqlite3,pdo_mysql,openssl,posix,dom,intl,fileinfo,bcmath
          coverage: none
      - name: Node 22 toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Isolated actual vendor and Chromium dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(id -u)" -ne 0
          test "$(git -C target rev-parse HEAD)" = ed96b18627cd0a63b1da20a1fd8c9b6c1808f159
          test "$(git -C gov rev-parse HEAD)" = 80ab251e15e63fc01a4e587e93054b0f6d0179a5
          grep -Fq '| skill-release | V3.24 |' gov/CURRENT.md
          npm ci --prefix target --ignore-scripts --no-fund --no-audit
          npm run build --prefix target
          composer --working-dir=target install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress --optimize-autoloader
          (cd target && npx playwright install --with-deps chromium)
          sudo apt-get -qq install -y nginx
          test -z "$(git -C target status --porcelain)"
          echo P08_V016_FINAL_HTTPS_EXACT_DEPENDENCIES=PASS
      - name: Final-source actual HTTPS Chromium browser and authority negatives
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          bash scripts/p08_v016_final_real_https.sh "${{ matrix.edition }}"
      - name: Always erase private source and browser fixtures
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- target gov "$RUNNER_TEMP/p08-v016-final-https-${{ matrix.edition }}" "$RUNNER_TEMP/p08-v016-final-browser-${{ matrix.edition }}"
          test ! -e target && test ! -e gov
          echo P08_V016_FINAL_HTTPS_PRIVATE_CLEANUP=PASS
