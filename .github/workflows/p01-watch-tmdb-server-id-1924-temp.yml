name: p01-watch-tmdb-server-id-1924-temporary
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-watch-tmdb-server-id-1924-temp.yml']
permissions:
  contents: read
jobs:
  exact-watch-tmdb-identity:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_SHA: ec0204403c6c818d7de476f57a6d13368964bac1
      BASE_SHA: 214d8917d4d345ca994c738a95c748b6c01e14cc
      PRODUCT_REPO: llhzx2018/vf-start
      PRODUCT_BRANCH: fix/p01-watch-tmdb-server-id-failclosed-20261106
    steps:
      - name: Checkout public Runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact P01 server-side Watch writer identity and zero-debt proof
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          test -n "$READ_TOKEN"
          ROOT="$(mktemp -d /tmp/p01-watch-tmdb-id-1924.XXXXXXXX)"
          trap 'rm -rf "$ROOT"' EXIT
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd >/dev/null
          git clone -q --depth 1 --branch "$PRODUCT_BRANCH" "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" "$ROOT/candidate"
          git clone -q --depth 1 --branch main "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" "$ROOT/stable"
          test "$(git -C "$ROOT/candidate" rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C "$ROOT/stable" rev-parse HEAD)" = "$BASE_SHA"
          git -C "$ROOT/candidate" remote set-url origin "https://github.com/$PRODUCT_REPO.git"
          git -C "$ROOT/stable" remote set-url origin "https://github.com/$PRODUCT_REPO.git"
          unset READ_TOKEN
          test "$(tr -d '\r\n ' < "$ROOT/candidate/VERSION")" = "2.47.496"
          test "$(tr -d '\r\n ' < "$ROOT/candidate/src/VERSION.txt")" = "2.47.496"
          echo "P01_WATCH_TMDB_ID_EXACT_SHA=$TARGET_SHA"
          cd "$ROOT/candidate"
          for f in src/watch-metadata-sync.php src/app/WatchMetadataSync.php tests/unit/p01_watch_tmdb_server_identity_runtime.php; do php -l "$f" >/dev/null; done
          echo P01_WATCH_TMDB_ID_PHP_SYNTAX=PASS
          php tests/unit/p01_watch_tmdb_server_identity_runtime.php
          php tests/unit/watch_metadata_r14_status_behavior.php
          php tests/unit/tmdb_watch_metadata_behavior.php
          php tests/unit/tmdb_watch_match_safety_r15.php
          php tests/unit/watch_r13_auto_detail_contract.php
          node tests/browser/watch_metadata_manual_sync_result_contract.cjs
          node tests/unit/p01_watch_native_metadata_zero_load_contract.cjs
          echo P01_WATCH_TMDB_ID_FOCUSED=PASS
          RC=0
          bash tests/canonical_release_regression.sh "$ROOT/candidate" "$ROOT/stable" --require-zero-debt >"$ROOT/canonical.log" 2>&1 || RC=$?
          grep -E '^(P01_CANONICAL_(BASELINE_TEST_COUNT|CURRENT_TEST_COUNT|CURRENT_FAILURE_COUNT|NEW_REGRESSION_COUNT|REMOVED_BASELINE_TEST_COUNT|LEGACY_TEST_DEBT_COUNT|ZERO_DEBT_REQUIRED)=|NEW_UNIT_REGRESSION=|CHANGED_TEST_FAILURE=)' "$ROOT/canonical.log" || true
          test "$RC" -eq 0
          echo P01_WATCH_TMDB_ID_CANONICAL_ZERO_DEBT=PASS
      - name: Public-safe lifecycle receipt
        if: always()
        shell: bash
        run: |
          echo P01_PRIVATE_SOURCE_PUBLIC_ARTIFACT=NONE
          echo P01_PRODUCTION_CHANGED=NO
          echo P01_RUNNER_LANE_CLOSE_WITHOUT_MERGE=YES
