name: P02 V2.5.0 Broad Regression
on:
  pull_request:
    branches: [main]
    paths: ['p02-v250-broad-trigger.txt']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: task/v2.5.0-runtime-uaui
          token: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'
          path: p02
          fetch-depth: 0
          persist-credentials: false
      - name: Adapt and execute maintenance regression
        working-directory: p02
        run: |
          set -Eeuo pipefail
          cp scripts/maintenance-reverify.sh "$RUNNER_TEMP/p02-v250-maintenance.sh"
          sed -i 's/2\.4\.24/2.5.0/g; s/V2\.4\.24/V2.5.0/g; s/v2\.4\.24/v2.5.0/g' "$RUNNER_TEMP/p02-v250-maintenance.sh"
          chmod +x "$RUNNER_TEMP/p02-v250-maintenance.sh"
          bash "$RUNNER_TEMP/p02-v250-maintenance.sh"
      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/p02-v250-maintenance.sh" || true
