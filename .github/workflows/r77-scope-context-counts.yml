name: R77 Focused Scope Context Count Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r77-scope-context-counts.yml'

permissions:
  contents: read

jobs:
  r77-focused-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: 2662169767ab8a1119c37991132ceb60f518631c
    steps:
      - name: Checkout exact private P01 candidate transiently
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: 2662169767ab8a1119c37991132ceb60f518631c
          path: vf-start
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_sqlite,sqlite3,curl
          coverage: none

      - name: Exact source and focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd vf-start
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(cat VERSION)" = '2.47.0'
          php -l tests/unit/scope_context_count_contract.php
          php tests/unit/scope_context_count_contract.php
          php tests/unit/mobile_filter_context_count_contract.php
          php tests/unit/sidebar_context_count_contract.php
          php tests/unit/tag_search_count_context_contract.php
          echo R77_SCOPE_CONTEXT_COUNT_PASS
          echo R77_EXACT_CANDIDATE_GATE_PASS

      - name: Cleanup transient private source
        if: always()
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/vf-start"
