name: TEMP Dispatch Skill Pack 2026.09.07 R1

on:
  push:
    branches:
      - temp/dispatch-skill-pack-20260907r1
    paths:
      - '.github/workflows/temp-dispatch-skill-pack-20260907r1.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch canonical Skill Pack publisher
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/gov-doc-skill-pack-publish.yml/dispatches" \
            -d @- <<'JSON'
          {
            "ref": "main",
            "inputs": {
              "exact_source_sha": "8fb69570c89cbcb75efcae68f20eef2666eb579e",
              "pack_version": "2026.09.07-r1",
              "build_id": "20260907r1",
              "confirm_publish": "true"
            }
          }
          JSON
          echo 'CANONICAL_SKILL_PACK_DISPATCH=PASS'
          echo 'SKILL_PACK=2026.09.07-r1'
