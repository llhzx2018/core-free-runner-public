name: P02 V2.5.81 R3 Full Surface Audit

on:
  push:
    branches:
      - task/p02-v2581-r1-hash-gate-20260921
    paths:
      - '.github/workflows/p02-v2581-r3-full-audit.yml'
      - 'requests/p02-v2581-r3-audit/**'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout audit harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Checkout exact P02 V2.5.81 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: a92bd8f8222bb560349bd727bbe305014a23d91a
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, zip, curl, mbstring, openssl
          coverage: none
      - name: Install Playwright Chromium
        working-directory: product
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Run full 25-surface re-audit
        run: bash runner/requests/p02-v2581-r3-audit/run.sh product
      - name: Remove transient private checkout
        if: always()
        run: rm -rf product
