name: P02 VF Library V2.5.4 Common Baseline Gate

on:
  pull_request:
    branches: [gate/p02-v254-common-baseline]
    paths:
      - triggers/p02-v254-common-baseline.txt

permissions:
  contents: read

env:
  SOURCE_SHA: 6db75825b6ea3cdf340f6d885f3004d9c5fe14a2
  RUNTIME_SHA: 801336625e417a1dbb1b8fd48bbc1f4c9fe03ba7
  BASE_SHA: 25d465b3051b0b203f2c635a98c991da0b5c18cd

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact P02 final develop head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, fileinfo, sodium, zip, curl, mbstring

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Exact final source and scope
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(cat VERSION)" = '2.5.4'
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$RUNTIME_SHA^{commit}"
          git diff --name-only "$RUNTIME_SHA" "$SOURCE_SHA" | tee /tmp/p02-v254-seal-files.txt
          if grep -Ev '^(VF_PROJECT\.json|docs/authority/VF_COMMON_PRODUCT_BASELINE_ADOPTION\.json|docs/evidence/P02_V254_COMMON_BASELINE_CANDIDATE_PASS_20260819\.md)$' /tmp/p02-v254-seal-files.txt; then
            echo P02_V254_SEAL_SCOPE_VIOLATION
            exit 79
          fi
          test "$(git diff --name-only "$RUNTIME_SHA" "$SOURCE_SHA" -- VERSION SOURCE_MANIFEST.json SOURCE_MANIFEST.txt src public tests scripts/generate-source-manifest.py | wc -l)" -eq 0
          echo P02_V254_FINAL_SEAL_SCOPE=PASS

      - name: Repository, manifest, PHP and JavaScript health
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/verify-repository.sh
          python scripts/generate-source-manifest.py
          git diff --exit-code -- SOURCE_MANIFEST.json SOURCE_MANIFEST.txt
          node --check public/assets/v254-common-branding.js
          node --check public/assets/app.js
          echo P02_V254_FINAL_REPOSITORY_MANIFEST_SYNTAX=PASS

      - name: Real favicon private-storage contract
        working-directory: product
        run: php tests/integration/common_favicon_contract_v254.php

      - name: Public baseline seal assertions
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('docs/authority/VF_COMMON_PRODUCT_BASELINE_ADOPTION.json').read_text())
          p=json.loads(Path('VF_PROJECT.json').read_text())
          assert a['summary']['compliant_count']==7 and a['summary']['semantic_gap_count']==0 and a['summary']['pending']==[]
          assert p['public_baseline']['state']=='COMPLIANT'
          assert p['public_baseline']['compliant_count']==7 and p['public_baseline']['semantic_gap_count']==0 and p['public_baseline']['pending']==[]
          assert p['working']['verified_runtime_source']=='801336625e417a1dbb1b8fd48bbc1f4c9fe03ba7'
          print('P02_V254_PUBLIC_BASELINE_SEAL=PASS')
          PY

      - name: Build exact deploy tree
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p02-v254-runtime
          bash scripts/build-deploy-tree.sh /tmp/p02-v254-runtime
          test "$(cat /tmp/p02-v254-runtime/VERSION.txt)" = '2.5.4'
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          runtime=Path('/tmp/p02-v254-runtime')
          manifest=json.loads(Path('SOURCE_MANIFEST.json').read_text())
          declared={e['full_path']:(e['bytes'],e['sha256']) for e in manifest['entries']}
          actual={}
          for p in runtime.rglob('*'):
              if p.is_file():
                  b=p.read_bytes();actual[p.relative_to(runtime).as_posix()]=(len(b),hashlib.sha256(b).hexdigest())
          assert declared==actual
          print('P02_V254_FINAL_DEPLOY_MANIFEST_EXACT=PASS',len(actual))
          PY

      - name: Safety cleanup
        if: always()
        shell: bash
        run: |
          rm -rf /tmp/p02-v254-runtime /tmp/p02-v254-seal-files.txt
          echo PRIVATE_SOURCE_PERSISTED=NO
          echo TOKEN_EXPOSED=NO
          echo MAIN_WRITE=NO
          echo PRODUCTION_WRITE=NO
