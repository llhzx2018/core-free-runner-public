name: P02 VF Library V2.5.4 Common Baseline Gate

on:
  pull_request:
    branches: [gate/p02-v254-common-baseline]
    paths:
      - triggers/p02-v254-common-baseline.txt

permissions:
  contents: read

env:
  SOURCE_SHA: f4619e908fd982fac9d7ab3afad69b1124efccb7
  BASE_SHA: 25d465b3051b0b203f2c635a98c991da0b5c18cd

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact P02 maintenance source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, fileinfo, sodium, zip, curl, mbstring

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Exact source and scope
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(cat VERSION)" = '2.5.4'
          git cat-file -e "$BASE_SHA^{commit}"
          git diff --name-only "$BASE_SHA" "$SOURCE_SHA" | tee /tmp/p02-v254-files.txt
          test -s /tmp/p02-v254-files.txt
          if grep -Ev '^(VERSION|src/app/FaviconAsset\.php|public/favicon\.php|public/favicon-action\.php|public/index\.php|public/assets/v254-common-branding\.(js|css)|tests/integration/common_favicon_contract_v254\.php)$' /tmp/p02-v254-files.txt; then
            echo P02_V254_SCOPE_VIOLATION
            exit 79
          fi
          echo P02_V254_EXACT_SCOPE=PASS

      - name: Repository, PHP and JavaScript health
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/repository-gates.py
          find src public tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/p02-v254-php-lint.txt
          node --check public/assets/v254-common-branding.js
          node --check public/assets/app.js
          grep -Fq 'v254-common-branding.css' public/index.php
          grep -Fq 'v254-common-branding.js' public/index.php
          echo P02_V254_SYNTAX=PASS

      - name: Real favicon private-storage contract
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          php tests/integration/common_favicon_contract_v254.php
          echo P02_V254_FAVICON_CONTRACT=PASS

      - name: Existing public capability source contracts
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq "case 'textbox_import_preview'" public/api.php
          grep -Fq "case 'textbox_import'" public/api.php
          grep -Fq 'createBackup' src/app/Repository.php
          test -f src/app/RecoveryService.php
          test -f src/app/AtomicUpgradeService.php
          test -f src/app/CoreUpdates/UpdateCore.php
          test -f public/setup.php
          echo P02_V254_EXISTING_PUBLIC_CAPABILITIES=PASS

      - name: Build exact deploy tree
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p02-v254-runtime
          bash scripts/build-deploy-tree.sh /tmp/p02-v254-runtime
          test "$(cat /tmp/p02-v254-runtime/VERSION.txt)" = '2.5.4'
          test -f /tmp/p02-v254-runtime/app/FaviconAsset.php
          test -f /tmp/p02-v254-runtime/favicon.php
          test -f /tmp/p02-v254-runtime/favicon-action.php
          test -f /tmp/p02-v254-runtime/assets/v254-common-branding.js
          test -f /tmp/p02-v254-runtime/assets/v254-common-branding.css
          test ! -e /tmp/p02-v254-runtime/branding
          echo P02_V254_DEPLOY_TREE=PASS

      - name: Safety cleanup
        if: always()
        shell: bash
        run: |
          rm -rf /tmp/p02-v254-runtime /tmp/p02-v254-files.txt /tmp/p02-v254-php-lint.txt
          echo PRIVATE_SOURCE_PERSISTED=NO
          echo TOKEN_EXPOSED=NO
          echo PRODUCTION_WRITE=NO
