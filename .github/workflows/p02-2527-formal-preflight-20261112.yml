name: P02 v2.5.127 exact 19-source formal preflight
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p02-2527-formal-preflight-20261112.yml']
permissions:
  contents: read
jobs:
  formal-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VF_RELEASE_FROM_VERSIONS: '2.5.81 2.5.82 2.5.102 2.5.103 2.5.104 2.5.105 2.5.111 2.5.112 2.5.113 2.5.114 2.5.115 2.5.116 2.5.117 2.5.118 2.5.119 2.5.120 2.5.121 2.5.122 2.5.124'
      VF_RELEASE_SOURCE_SHA: 'c0cc9412a684aa463c3cbf3a63483ea0dacb25a2'
      VF_RELEASE_SOURCE_REF: main
      OUT: ${{ github.workspace }}/product/build/release-preflight
      OUT2: ${{ github.workspace }}/product/build/release-preflight-repeat
    steps:
      - name: Checkout immutable PRIVATE P02 current source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-library
          ref: c0cc9412a684aa463c3cbf3a63483ea0dacb25a2
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Checkout exact canonical GOV-DOC rules
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/gov-doc
          ref: 33b222f642ff18dd52a1ac7887443d91833edbb2
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: governance
      - name: Install PHP SQLite and Zip if ephemeral runner needs them
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! php -r 'exit(PHP_VERSION_ID>=80300&&extension_loaded("pdo_sqlite")&&extension_loaded("sqlite3")&&extension_loaded("zip")?0:1);'; then
            timeout 180s sudo apt-get install -y php8.3-cli php8.3-sqlite3 php8.3-zip
          fi
          php -r 'exit(PHP_VERSION_ID>=80300&&extension_loaded("pdo_sqlite")&&extension_loaded("sqlite3")&&extension_loaded("zip")?0:1);'
      - name: Exact Source, Channel continuity, no tag collision
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = 'c0cc9412a684aa463c3cbf3a63483ea0dacb25a2'
          test "$(cat product/VERSION)" = '2.5.127'
          gh api repos/llhzx2018/core-updates/contents/projects/P02.json?ref=main --jq .content | base64 -d > "${RUNNER_TEMP}/p02-channel.json"
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          p=json.loads(Path(os.environ['RUNNER_TEMP'],'p02-channel.json').read_text())
          assert p['target_version']=='2.5.124' and p['schema_from']=='2401'
          assert p['from_versions']==["2.5.81","2.5.82","2.5.102","2.5.103","2.5.104","2.5.105","2.5.111","2.5.112","2.5.113","2.5.114","2.5.115","2.5.116","2.5.117","2.5.118","2.5.119","2.5.120","2.5.121","2.5.122"]
          print('P02_FORMAL_CHANNEL_SOURCE_CONTINUITY=PASS')
          PY
          if gh api repos/llhzx2018/vf-library/git/ref/tags/v2.5.127 >/dev/null 2>&1; then
            echo P02_FORMAL_DUPLICATE_TAG=BLOCK
            exit 1
          fi
          echo P02_FORMAL_PREPUB_TAG_FREE=PASS
      - name: Exact P02 formal package gate (two builds, clean FULL, manifest)
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/verify-release-artifacts.sh
          echo P02_FORMAL_PREPUB_BUILDER=PASS
      - name: Real 19 verified official FULL releases to 2.5.127 and injection rollback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "${GH_TOKEN:-}" || { echo P02_PRIVATE_RELEASE_READ_NOT_AVAILABLE; exit 78; }
          mkdir -p "${RUNNER_TEMP}/p02-official-sources"
          for old in 2.5.81 2.5.82 2.5.102 2.5.103 2.5.104 2.5.105 2.5.111 2.5.112 2.5.113 2.5.114 2.5.115 2.5.116 2.5.117 2.5.118 2.5.119 2.5.120 2.5.121 2.5.122 2.5.124; do
            gh release download "v${old}" -R llhzx2018/vf-library -p "VF_Library_V${old}_FULL.zip" -D "${RUNNER_TEMP}/p02-official-sources"
          done
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('product/build/release-preflight')
          assert root.joinpath('VF_Library_V2.5.127_ATOMIC.zip').is_file()
          files={
            '2.5.81':(440049,'a420358244180dda056372432fd0b376404e451f87a5c586f4b7bdc1b9d6ca1e'),
            '2.5.82':(446918,'85039c94e2aed9a711d1a67b72678fb52a25c152c84d5a6eeb2029b399608ff5'),
            '2.5.102':(459993,'8ef6c1dd2b8e42925717b03f6d4b4778f7b92c8b877cacd388eb8d942125c9a0'),
            '2.5.103':(464931,'dd33af1b7dba0d22ec28aa5eb212e139d25d360e29a9c3ba627d6b7bbc8bd535'),
            '2.5.104':(465647,'994ebd2640b24fe6813b3f7f1d4a1475e3f81968c5578efdbb28c85bec9c00a1'),
            '2.5.105':(467596,'94f365e377e9423672455c66a67d2a31afa7587dce80b3c5ba97acb18234a936'),
            '2.5.111':(474502,'dab834093666171026b2e4e8526e68409c04c09ccb4e0980652262f48d663633'),
            '2.5.112':(480037,'0b3b7279bd7ea169de73153d593f3a6452c2cec2b0b8c73ca63b5ffd79983c3d'),
            '2.5.113':(481401,'ded849fab9e476042bb93daf379d97b25c2e1e2ccc8b2ba77c80e53b4b17cf3c'),
            '2.5.114':(484338,'376f24da5ae5e0869c598b72044c78420627138eda163a9d9d238afa4e1be607'),
            '2.5.115':(486198,'795ef929e71cbed189d60219cd6cc17b10ea015168d4f23ae2b1910176ba695f'),
            '2.5.116':(488425,'a0680c89da02f8a4b7e1ba15fe9e33416f6bad55c787fbb26899e9022b0480b9'),
            '2.5.117':(489412,'9978c77de565f11142fb3b48a8a2e523c948a4e8f687d4d6b7c5e33e5c8aa37a'),
            '2.5.118':(490452,'8be68d0995e80a5288c228fb580450be8f4f232bf9cc87f45ce9d80bbf04e14c'),
            '2.5.119':(490836,'1817f995bc0dea1fe6d3feb46c66f84bca9e6b3b4fb3cea335a7aef72f58bbbc'),
            '2.5.120':(491802,'ff0eb042a390cb1da02fbb32077cfd569e2088b687cc82a4ade82ecd24909961'),
            '2.5.121':(492433,'2d7564e798aba23c91764c9fa925cee264292106fb9731ac00d9e19e8f0d719e'),
            '2.5.122':(493073,'79a9e2e2a8e5aa29946bbdbf47cf6d34429fc23a67689cc611ef8daebae82387'),
            '2.5.124':(496067,'c30e9a5a5d8380443f564c0e56606c13edb31da3482c1704deecdcf9c1ff7a56'),
          }
          import os
          for v,(size,sha) in files.items():
            path=Path(os.environ['RUNNER_TEMP'],'p02-official-sources','VF_Library_V'+v+'_FULL.zip')
            assert path.is_file() and path.stat().st_size==int(size)
            assert hashlib.sha256(path.read_bytes()).hexdigest()==sha
          print('P02_FORMAL_19_OFFICIAL_SOURCE_ASSET_SHA=PASS')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, tempfile, zipfile, re, json, html, os, time, http.cookiejar
          import urllib.request, urllib.parse, urllib.error, sqlite3
          prior=Path(os.environ['RUNNER_TEMP'],'p02-official-sources')
          artifacts=Path('product/build/release-preflight')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args):return None
          def request(opener,url,data=None,headers=None):
              r=urllib.request.Request(url,data,headers or {},method='POST' if data is not None else 'GET')
              try:
                  resp=opener.open(r,timeout=35)
                  return resp.status,resp.read().decode('utf-8',errors='replace')
              except urllib.error.HTTPError as error:
                  return error.code,error.read().decode('utf-8',errors='replace')
          def marker(body,name):
              x=re.search(r'name="'+name+r'" value="([^"]+)"',body)
              if not x:raise RuntimeError('MISSING_HIDDEN_FIELD_'+name)
              return html.unescape(x.group(1))
          def do_post(opener,url,values,base):
              data=urllib.parse.urlencode(values).encode()
              return request(opener,url,data,{'Origin':base,'Content-Type':'application/x-www-form-urlencoded'})
          def post_json(opener,base,csrf,action,data):
              code,body=request(opener,base+'/api.php?action='+action,json.dumps(data).encode(),
                {'Origin':base,'Content-Type':'application/json','X-CSRF-Token':csrf})
              try:result=json.loads(body)
              except ValueError:raise RuntimeError('BAD_JSON_RESPONSE_'+action+':'+str(code))
              if code not in (200,201) or not result.get('ok'):raise RuntimeError('CANONICAL_API_POST_FAILED_'+action+':'+str(code))
              return result
          with tempfile.TemporaryDirectory(prefix='p02-real-upgrade-') as temp:
              folder=Path(temp)
              for n,old in enumerate(["2.5.81","2.5.82","2.5.102","2.5.103","2.5.104","2.5.105","2.5.111","2.5.112","2.5.113","2.5.114","2.5.115","2.5.116","2.5.117","2.5.118","2.5.119","2.5.120","2.5.121","2.5.122","2.5.124"]):
                  site=folder/('source-'+old);site.mkdir()
                  with zipfile.ZipFile(prior/('VF_Library_V'+old+'_FULL.zip')) as z:z.extractall(site)
                  assert (site/'VERSION.txt').read_text().strip()==old
                  port=18971+n
                  base='http://127.0.0.1:'+str(port)
                  server=subprocess.Popen(['php','-S','127.0.0.1:'+str(port),'-t',str(site)],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                  opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()),NoRedirect())
                  try:
                      for _ in range(45):
                          try:
                              status,body=request(opener,base+'/setup.php')
                              if status==200:break
                          except Exception:pass
                          time.sleep(.1)
                      else:raise RuntimeError('OLD_INSTALL_HTTP_UNAVAILABLE')
                      csrf=marker(body,'setup_csrf')
                      status,body=do_post(opener,base+'/setup.php',{'setup_csrf':csrf,
                        'password':'P02-SYNTHETIC-OWNER-TRIAL-ONLY','password_confirm':'P02-SYNTHETIC-OWNER-TRIAL-ONLY'},base)
                      assert status==303,('OLD_INSTALL_FAILED',old,status)
                      status,body=request(opener,base+'/api.php?action=session')
                      auth=json.loads(body)
                      assert status==200 and auth.get('ok') is True and auth.get('site',{}).get('auth') is True
                      assert auth.get('version')==old
                      csrf=auth.get('csrf','')
                      category=post_json(opener,base,csrf,'category_save',{'name':'P02_W1_ONLY_SYNTHETIC','icon':'folder'})
                      item=post_json(opener,base,csrf,'content_save',{'category_id':category['id'],
                        'title':'P02_W1_PRESERVED_'+old,
                        'content':'Synthetic material remains after upgrade and failed injection.',
                        'content_mode':'article','content_format':'markdown',
                        'primary_action':'read','status':'active'})
                      itemid=int(item['id'])
                      sql=list(folder.rglob('textbox-*.sqlite'))
                      selected=[x for x in sql if x.parent.parent==folder or x.parent.parent==site.parent]
                      assert sql,'NO_SQLITE'
                      repair=artifacts/'repair-v2.5.127.php'
                      (site/repair.name).write_bytes(repair.read_bytes())
                      if old in ('2.5.81','2.5.124'):
                          stage=folder/('rollback-stage-'+old);stage.mkdir()
                          update=artifacts/'VF_Library_V2.5.127_UPDATE.zip'
                          with zipfile.ZipFile(update) as z:z.extractall(stage)
                          php=folder/'inject-rollback.php'
                          php.write_text("""<?php
          declare(strict_types=1);
          require $argv[1].'/app/bootstrap.php';
          $p=json_decode(file_get_contents($argv[2].'/atomic-manifest.json'),true);
          $map=[];
          foreach($p['files'] as $item)$map[$item['path']]=['bytes'=>$item['bytes'],'sha256'=>$item['sha256']];
          try{
            VfLibraryAtomicUpgradeService::fromCurrentRuntime()->upgrade('2.5.124','2.5.127',$argv[2].'/payload',$map,['source_schema'=>2401,'target_schema'=>2401,'fail_after_file'=>1]);
            fwrite(STDERR,'EXPECTED_FAULT_NOT_RAISED');exit(1);
          }catch(Throwable $e){
            if(strpos($e->getMessage(),'Atomic test fault: file replacement')===false){
              fwrite(STDERR,'UNEXPECTED_ATOMIC_FAULT_CLASS');exit(1);
            }
          }
          echo "P02_FORMAL_PARTIAL_FILE_ROLLBACK=PASS\\n";
          """)
                          if old=='2.5.81':
                              php.write_text(php.read_text().replace("upgrade('2.5.124','2.5.127'","upgrade('2.5.81','2.5.127'"))
                          proc=subprocess.run(['php',str(php),str(site),str(stage)],capture_output=True,text=True,timeout=80)
                          assert proc.returncode==0,('ROLLBACK_ENGINE_TEST_FAILED',proc.stderr[-200:])
                          assert (site/'VERSION.txt').read_text().strip()==old
                          status,body=request(opener,base+'/api.php?action=content_get&id='+str(itemid))
                          assert status==200 and json.loads(body).get('item',{}).get('title')=='P02_W1_PRESERVED_'+old,('ROLLBACK_DATA_LOSS',old)
                          print('P02_FORMAL_PARTIAL_FILE_ROLLBACK=PASS')
                      status,body=request(opener,base+'/'+repair.name)
                      assert status==200,('REPAIR_LOGIN_READ',old,status)
                      form_csrf=marker(body,'csrf')
                      status,body=do_post(opener,base+'/'+repair.name,{'action':'upgrade','csrf':form_csrf},base)
                      assert status==200 and '升级完成' in body,('REAL_REPAIR_FAILED',old,status,body[-200:])
                      assert (site/'VERSION.txt').read_text().strip()=='2.5.127'
                      status,body=request(opener,base+'/api.php?action=content_get&id='+str(itemid))
                      after=json.loads(body)
                      assert status==200 and after.get('item',{}).get('title')=='P02_W1_PRESERVED_'+old,('UPDATE_DATA_LOSS',old)
                      assert 'Synthetic material remains' in after.get('item',{}).get('content','')
                      assert not (site/'app/.runtime.php').is_symlink()
                      db_files=list(folder.rglob('textbox-*.sqlite'))
                      assert db_files
                      db_file=[x for x in db_files if x.parent.as_posix().startswith(folder.as_posix())][-1]
                      with sqlite3.connect(db_file) as db:
                          assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
                          assert db.execute('PRAGMA foreign_key_check').fetchall()==[]
                      assert (site/'assets/w1/w1-search.js').is_file()
                      print('P02_FORMAL_UPGRADE_FROM_'+old.replace('.','_')+'=PASS')
                      print('P02_FORMAL_DATA_RETAINED_FROM_'+old.replace('.','_')+'=PASS')
                  finally:
                      server.terminate();server.wait(timeout=12)
          print('P02_FORMAL_ALL_19_SOURCE_DIRECT_UPGRADES=PASS')
          PY
      - name: Public Authority real formal assets structural checks
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('product/build/release-preflight')
          domains=['INSTALL','SECURITY','TESTING','UPGRADE','DATA_SCHEMA','API_PROVIDER','CRON_JOB','NOTIFICATION','OBSERVABILITY','GIT','UA_UI']
          base={'schema':'vf.public-authority.task-delivery-check.v1','project':'P02','source':'c0cc9412a684aa463c3cbf3a63483ea0dacb25a2',
            'project_authority':{'agents':'AGENTS.md','current':'docs/authority/CURRENT.md','acceptance':'docs/authority/ACCEPTANCE_MATRIX.md','applicability':'docs/authority/PUBLIC_AUTHORITY_APPLICABILITY.md'},
            'acceptance_markers':['Source Manifest','W1_BROWSER_COMPAT'],'required_domains':domains,
            'task_capabilities':['full_package','clean_install','candidate','update','atomic','rollback','database','backup','external_api','scheduler','notification_center','operational_health','source_change','ui_change']}
          for label,profile,asset,entry in [('full','web_full_zip','VF_Library_V2.5.127_FULL.zip','setup.php'),
            ('atomic','web_atomic_zip','VF_Library_V2.5.127_ATOMIC.zip','repair-v2.5.127.php')]:
            receipt=dict(base)
            receipt['delivery']={'profile':profile,'entrypoint':entry,'artifact':asset,
              'sha256':hashlib.sha256((root/asset).read_bytes()).hexdigest(),'requires_git':False,'requires_manual_source_copy':False}
            Path(os.environ['RUNNER_TEMP'],f'p02-{label}-formal-delivery.json').write_text(json.dumps(receipt))
          PY
          for profile in full atomic; do
            python3 governance/governance/public-authority/tools/task_delivery_contract_lint.py               --receipt "${RUNNER_TEMP}/p02-${profile}-formal-delivery.json"               --project-root product --artifact-root product/build/release-preflight               --public-router governance/governance/public-authority/VF_PUBLIC_AUTHORITY_APPLICABILITY_ROUTER_V1.0.json
          done
          echo P02_FORMAL_TASK_DELIVERY_STRUCTURAL=PASS
      - name: Private source and synthetic test cleanup
        if: always()
        shell: bash
        run: |
          rm -rf product governance "${RUNNER_TEMP}/p02-official-sources"
          echo PRIVATE_SOURCE_AND_SYNTHETIC_DATA_PERSISTED_IN_PUBLIC_GIT_OR_ARTIFACT=NO
