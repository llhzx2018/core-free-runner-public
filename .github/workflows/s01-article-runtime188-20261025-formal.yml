name: S01 Theme exact formal release
on:
  push:
    branches: [task/s01-article-runtime188-20261025]
    paths: ['.github/workflows/s01-article-runtime188-20261025-formal.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.188
  TARGET_SHA: 9c8877792e4af5aef2be1409ee3648c560452d89
  TARGET_TREE: 0e6c787f310f2dea02c6854bfc05a4c743de4e30
  BASE_SHA: 076c0e5be765e7447892d4fc267309566ec24a01
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - name: Formal identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-article-runtime188-20261025/formal-spec.json --input control/.github/workflows/s01-article-runtime188-20261025-formal.yml
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 9c8877792e4af5aef2be1409ee3648c560452d89
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact candidate, merged tree and required evidence readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider candidate-proof
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40169152076 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40169152076 --jq .head_sha)" = 43e5d281123a14fec6d3a1ed6697e3038224cabb
          test "$(gh api repos/$TARGET_REPO/commits/main --jq .sha)" = "$TARGET_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$TARGET_SHA --jq .tree.sha)" = "$TARGET_TREE"
          gh run download 40169152076 --repo llhzx2018/core-free-runner-public --name s01-home-40169152076 --dir candidate-proof
          cmp candidate-proof/state-before.sha256 candidate-proof/state-after.sha256
          cmp candidate-proof/contracts-before.json candidate-proof/contracts-after.json
          python3 control/lanes/s01-article-runtime188-20261025/package.py
          python3 - <<'PYVERIFY'
          import json,pathlib
          r=pathlib.Path('candidate-proof')
          old=json.loads((r/'package.json').read_text());new=json.loads(pathlib.Path('proof/package.json').read_text())
          assert old['source']=='447c5e5e83a9f4b4f5f0ace8cdde38199b0af482'
          phases={phase:json.loads((r/(phase+'-article-summary.json')).read_text()) for phase in ['before','upgrade','rollback','after','fallback']}
          for phase,result in phases.items():
              assert result['status']=='PASS' and result['errors']==result['write_requests']==[]
              assert len(result['rows'])==(4 if phase in ['before','after'] else (2 if phase=='fallback' else 1))
              assert all(row['status']=='PASS' for row in result['rows'])
          for lang in ['en','zh']:
              for width in [1440,1024]:
                  for phase in ['before','after']:assert (r/(phase+'-article-'+lang+'-'+str(width)+'.png')).stat().st_size>1000
                  a=json.loads((r/('before-article-'+lang+'-'+str(width)+'.json')).read_text());b=json.loads((r/('after-article-'+lang+'-'+str(width)+'.json')).read_text())
                  assert not a['overflow'] and not b['overflow']
                  for key in ['h1','body','canonical','hreflang','robots','header','footer']:assert a[key]==b[key]
                  assert b['font']=='18px' and abs(b['reading']['w']-760)<2
                  assert (r/('sidebar-article-'+lang+'-'+str(width)+'.png')).stat().st_size>1000
              assert (r/('copy-article-'+lang+'.png')).stat().st_size>1000
          assert len(phases['after']['interactions'])==2
          for item in phases['after']['interactions']:
              assert all(v=='PASS' for k,v in item.items() if k!='lang')
          assert json.loads((r/'clean-install.json').read_text())['status']=='PASS'
          for k in ['status','version','tree','sha256','bytes','files']:assert old[k]==new[k],k
          assert new['sha256']=='f45493df564197cb512acbbb35049d87651adc7273a4f36a4c129793e161a3f6' and new['bytes']==1994445
          coverage=json.loads(pathlib.Path('control/lanes/s01-article-runtime188-20261025/release-authority.json').read_text())
          assert set(coverage['required'])=={'TESTING','GIT','UA_UI','SEO','SECURITY','INSTALL','UPGRADE','DATA_SCHEMA'}
          assert coverage['source']=='447c5e5e83a9f4b4f5f0ace8cdde38199b0af482' and coverage['tree']=='0e6c787f310f2dea02c6854bfc05a4c743de4e30'
          assert coverage['owner_preview_runtime']=='POST_RELEASE_REQUIRED'
          assert coverage['release_mode']=='OWNER_DIRECT_REVERSIBLE_UI_RELEASE'
          assert coverage['owner_real_use']=='POST_PRODUCTION_REQUIRED'
          assert coverage['production_auto_apply'] is False
          for item in coverage['required'].values():
              assert item['sha'] and item['acceptance']
              item['evidence_status']='PASS_EXACT_CANDIDATE_MACHINE'
          coverage['candidate_run']='40169152076'
          coverage['merged_source']='9c8877792e4af5aef2be1409ee3648c560452d89'
          coverage['formal_release_gate']='PASS'
          coverage['production_effect']='NOT_PROVEN_POST_MANUAL_UPGRADE_READBACK_REQUIRED'
          pathlib.Path('proof/public-authority-coverage.json').write_text(json.dumps(coverage,ensure_ascii=False,indent=2))
          print('MERGED_TREE_EQUALS_TESTED_TREE_AND_EXACT_PACKAGE_PASS')
          PYVERIFY
      - name: Publish only the exact verified package
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.35.188 --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create v1.35.188 provider/vf-tools-theme_V1.35.188.zip --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Theme V1.35.188' --notes '按Owner已确认的GitHub Blog/web.dev文章详情原型优化居中阅读区、标题/正文层级、目录模式与文末接续，保留阅读档位、自定义模块、作者原文和现有开关；收敛默认通用工具/FAQ/重复CTA，分享失败提供可手动复制地址的恢复入口。无Rank Math时文章Schema读取真实作者、日期及文章/博客面包屑。真实WordPress中英文1440/1024、目录模式/宽度档位/自定义模块/分享恢复/无脚本、Rank Math和无插件降级、干净安装、187升级188/回退/重复安装及数据保护通过。476运行文件，M3U8保持1.25.94，Ops未改。Production由Owner手工升级后最终复验，手机暂缓。' --latest
          fi
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/v1.35.188 --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh release view v1.35.188 --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - name: Authenticated remote ZIP byte comparison
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download v1.35.188 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.188.zip --dir remote
          cmp provider/vf-tools-theme_V1.35.188.zip remote/vf-tools-theme_V1.35.188.zip
          echo 'f45493df564197cb512acbbb35049d87651adc7273a4f36a4c129793e161a3f6  remote/vf-tools-theme_V1.35.188.zip' | sha256sum -c
          test "$(stat -c %s remote/vf-tools-theme_V1.35.188.zip)" = 1994445
          gh release view v1.35.188 --repo "$TARGET_REPO" --json url,publishedAt,tagName > proof/formal-release.json
          echo FORMAL_RELEASE_EXACT_REMOTE_ASSET_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-home-formal-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target provider remote candidate-proof
