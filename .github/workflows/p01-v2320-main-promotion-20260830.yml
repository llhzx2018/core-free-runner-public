name: P01 V2.32 Main Promotion
on:
  push:
    branches: [task/p01-v2320-formal-release-20260830]
    paths: [.github/workflows/p01-v2320-main-promotion-20260830.yml]
permissions:
  contents: read
jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify exact Gate and concurrent truth
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          GATE=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/runs/33264371922)
          test "$(jq -r .status <<<"$GATE")" = completed
          test "$(jq -r .conclusion <<<"$GATE")" = success
          test "$(jq -r .head_sha <<<"$GATE")" = bb5617c8efe6711b9a847e969a32223d8f83e9f0
          rm -rf product
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/vf-start.git" product
          git -C product fetch -q origin main develop --tags
          MAIN=$(git -C product rev-parse origin/main)
          DEVELOP=$(git -C product rev-parse origin/develop)
          test "$MAIN" = f7c14b70dda991ac5fc8b25140eb558fd54009d6
          test "$DEVELOP" = 120a42667fce7357fdaef03b64cb7ea41392040d
          test "$(git -C product rev-parse "$DEVELOP^{tree}")" = d0fa7c87ebefef083712ec0b7707a6c4273943f2
          test "$(git -C product rev-parse "$DEVELOP:src")" = f348cb314623906acc851cb79d75b1c8f6637aff
          test "$(git -C product merge-base "$MAIN" "$DEVELOP")" = "$MAIN"
          ! git -C product show-ref --verify --quiet refs/tags/v2.32.0
          test "$(git -C product show "$DEVELOP:VERSION" | tr -d '\r\n')" = 2.32.0
          test "$(git -C product show "$DEVELOP:src/VERSION.txt" | tr -d '\r\n')" = 2.32.0
          git -C product show "$DEVELOP:src/app/bootstrap.php" | grep -F "define('VF_VERSION', '2.32.0')" >/dev/null
          echo P01_V2320_FORMAL_GATE_33264371922=PASS
          echo P01_V2320_PROMOTION_PRECHECK=PASS
      - name: Promote exact develop to main
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C product push "https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/vf-start.git" 120a42667fce7357fdaef03b64cb7ea41392040d:refs/heads/main
          git -C product fetch -q origin main
          test "$(git -C product rev-parse origin/main)" = 120a42667fce7357fdaef03b64cb7ea41392040d
          test "$(git -C product rev-parse origin/main^{tree})" = d0fa7c87ebefef083712ec0b7707a6c4273943f2
          test "$(git -C product rev-parse origin/main:src)" = f348cb314623906acc851cb79d75b1c8f6637aff
          echo P01_V2320_MAIN_PROMOTION=PASS
          echo TAG_CREATED=NO
          echo RELEASE_PUBLISHED=NO
          echo OWNER_PRODUCTION_WRITE=NO
