name: P07 M03 CP2 source-first SSH UX exact-source proof
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p07-m03-cp2-ssh-ux-20261118.yml']
permissions:
  contents: read
jobs:
  source-ux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NO_COLOR: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PRODUCT_SHA: '30d2e8222cdd20ed340a07bd9bbb66adae4540a0'
      PRODUCT_BASE: '9352e4d7eafda74cfeb0cb6f11688431a6a10d80'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 30d2e8222cdd20ed340a07bd9bbb66adae4540a0
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: .p07-private
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: .gov-current
      - name: Verify exact source and single-module architecture/UX safety
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-private rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(cat .p07-private/BUILD_ID)" = '0.1.0-release138'
          python3 -B .p07-private/.github/checks/architecture_gate.py --manifest .p07-private/.github/checks/code_architecture.json --gov-root .gov-current --git-root .p07-private --base-sha "$PRODUCT_BASE" --head-sha "$PRODUCT_SHA"
          (cd .p07-private && python3 -B scripts/check_p07_terminal_ux.py --base-ref "$PRODUCT_BASE" && python3 -B scripts/check_p07_modules.py)
          (cd .p07-private && python3 -B tests/test_p07_m03_d04_preparation_checklist.py -q)
          bash -n .p07-private/bin/vfops-migrate-ui
          bash -n .p07-private/components/p07-m03-migration-readiness.sh
          echo P07_M03_CP2_SSH_UX_SOURCE_TEST=PASS
          echo P07_M03_CP2_FORMAL_RELEASE=NOT_RUN
      - name: Clean private checkout
        if: always()
        shell: bash
        run: |
          rm -rf -- .p07-private .gov-current
          echo P07_PRIVATE_CHECKOUT_CLEANUP=PASS
