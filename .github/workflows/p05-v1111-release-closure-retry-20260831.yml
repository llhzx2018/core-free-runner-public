name: P05 V1.1.11 Release Authority Closure Retry

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  closure-retry:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      P05_BASE: 49434d79d861bba206d72daa4476363f1bf8e0d4
      P05_BRANCH: governance/p05-v1111-release-closure-20260831
      VERSION: 1.1.11
      CANDIDATE_SOURCE: 6705dfb1886b209187180fd6191c1521624fb6ba
      RELEASE_TREE: f8cf4326d7c8631298843b8bd48ff06ae54f4c40
      EXACT_GATE_RUN: '33324629957'
      EXACT_GATE_JOB: '99292477706'
      MECHANISM_RUN: '33324381888'
      MECHANISM_JOB: '99291824138'
      PUBLICATION_RUN: '33324914166'
      PUBLICATION_JOB: '99293234048'
      RELEASE_ID: '379349908'
      FULL_ASSET: VF_SEO_V1.1.11_FULL.zip
      FULL_ASSET_ID: '536861594'
      RECEIPT_ASSET: VF_SEO_V1.1.11_RELEASE_RECEIPT.txt
      RECEIPT_ASSET_ID: '536861593'
      FULL_FILES: '45'
      FULL_BYTES: '371150'
      FULL_SHA256: b24bbbeb997fa6414689a01b32eb70a7bf20c82ffeec8761fea4b69612629ce8
      PUBLISHED_AT: 2026-08-30T17:20:30Z
      PUBLIC_DIST_TAG: p05-dist-v1.1.11
      PUBLIC_RELEASE_ID: '379349919'
      PUBLIC_ASSET_ID: '536861640'
    steps:
      - name: Checkout runner retry source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact P05 release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.P05_BASE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
          path: p05
      - name: Reverify release truth
        working-directory: p05
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$P05_BASE"
          test "$(git rev-parse HEAD^{tree})" = "$RELEASE_TREE"
          test "$(git rev-parse "$CANDIDATE_SOURCE^{tree}")" = "$RELEASE_TREE"
          gh api "repos/llhzx2018/vf-seo/releases/tags/v$VERSION" > /tmp/private-release.json
          curl -fsSL -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/llhzx2018/core-free-runner-public/releases/tags/$PUBLIC_DIST_TAG" > /tmp/public-release.json
          python3 - <<'PY'
          import json, os
          p=json.load(open('/tmp/private-release.json')); q=json.load(open('/tmp/public-release.json'))
          pa={a['name']:a for a in p['assets']}; qa={a['name']:a for a in q['assets']}
          assert str(p['id'])==os.environ['RELEASE_ID'] and p['target_commitish']==os.environ['P05_BASE']
          assert str(pa[os.environ['FULL_ASSET']]['id'])==os.environ['FULL_ASSET_ID']
          assert pa[os.environ['FULL_ASSET']]['digest']=='sha256:'+os.environ['FULL_SHA256']
          assert str(q['id'])==os.environ['PUBLIC_RELEASE_ID'] and q['tag_name']==os.environ['PUBLIC_DIST_TAG']
          assert str(qa[os.environ['FULL_ASSET']]['id'])==os.environ['PUBLIC_ASSET_ID']
          assert qa[os.environ['FULL_ASSET']]['digest']=='sha256:'+os.environ['FULL_SHA256']
          print('P05_V1111_RELEASE_REVERIFY=PASS')
          PY
      - name: Reuse closure writer with corrected scope check
        working-directory: p05
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source=Path('../.github/workflows/p05-v1111-release-closure-20260831.yml').read_text()
          marker='      - name: Write post-release Current Truth\n        working-directory: p05\n        run: |\n'
          start=source.index(marker)+len(marker)
          end=source.index('\n      - name: Commit and push closure branch', start)
          block=source[start:end]
          lines=[]
          for line in block.splitlines():
              line=line[10:] if line.startswith('          ') else line
              if line.startswith("expected='CHANGELOG.md README.md VF_PROJECT.json"):
                  continue
              if line.startswith('actual="$(git diff --name-only'):
                  continue
              if line == 'test "$actual" = "$expected"':
                  continue
              lines.append(line)
          script='\n'.join(lines)+'\n'
          scope="""python3 - <<'PY_SCOPE'\nimport subprocess\nexpected={'CHANGELOG.md','README.md','VF_PROJECT.json','docs/authority/RELEASE_V1.1.11_CURRENT.md','docs/evidence/FORMAL_PUBLICATION_V1.1.11_20260831.md','docs/handoff/CURRENT_STATE.md','docs/release/README.md','php/README.md'}\nactual={line[3:] for line in subprocess.check_output(['git','status','--porcelain'],text=True).splitlines() if len(line)>=4}\nassert actual==expected,(sorted(actual),sorted(expected))\nprint('P05_CLOSURE_SCOPE=PASS')\nPY_SCOPE\n"""
          needle='test "$(cat VERSION)" = "1.1.11"'
          script=script.replace(needle,scope+needle,1)
          Path('/tmp/p05-v1111-write.sh').write_text(script)
          PY
          bash /tmp/p05-v1111-write.sh
      - name: Commit and push eight-file closure
        working-directory: p05
        run: |
          set -euo pipefail
          git config user.name "VF Public Runner"
          git config user.email "actions@users.noreply.github.com"
          git add README.md CHANGELOG.md VF_PROJECT.json php/README.md docs/release/README.md docs/handoff/CURRENT_STATE.md docs/authority/RELEASE_V1.1.11_CURRENT.md docs/evidence/FORMAL_PUBLICATION_V1.1.11_20260831.md
          test "$(git diff --cached --name-only | wc -l)" -eq 8
          git commit -m "docs(P05): close v1.1.11 release and update authority"
          git push origin "HEAD:$P05_BRANCH"
          echo "P05_V1111_CLOSURE_HEAD=$(git rev-parse HEAD)"
          echo "P05_RELEASE_SOURCE_IMMUTABLE=$P05_BASE"
          echo "P05_PRODUCTION_WRITE=0"
