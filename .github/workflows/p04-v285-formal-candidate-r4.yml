name: P04 V2.8.5 Formal Candidate R4

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p04-v285-formal-candidate-r4.yml'
      - 'requests/p04-v285-formal-candidate-r4.txt'

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    env:
      SOURCE_REPOSITORY: llhzx2018/vf-infra
      SOURCE_COMMIT: b73179673801452469a276ec744e15612ee7f38a
      TARGET_VERSION: 2.8.5
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_COMMIT }}
          token: ${{ env.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, zip, sodium, pdo_sqlite, sqlite3
          ini-file: production

      - name: Verify and build exact candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd source
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(cat VERSION)" = "$TARGET_VERSION"
          node --check public/assets/v271-unified-shell.js
          node --check public/assets/v278-route-scroll-reset.js
          node --check public/assets/v280-navigation-simplify.js
          node --check public/assets/v284-long-action-feedback.js
          php -l public/index.php >/dev/null
          python3 -m py_compile scripts/build-release-tree.py scripts/build-v285-update-release.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('public/assets/v271-unified-shell.js').read_text(encoding='utf-8')
          assert 'v271-settings-layout' in s and 'settingsNav(section)' in s
          assert "body = renderData(payload) + renderBackup(payload);" in s
          assert "body = renderSystem(payload) + renderDiagnostics(payload);" in s
          assert "if (section === 'backup') section = 'data';" in s
          assert "if (section === 'diagnostics') section = 'system';" in s
          assert "const sub = '';" in s
          n=Path('public/assets/v280-navigation-simplify.js').read_text(encoding='utf-8')
          assert "reconcileNestedNav(routeRoot.querySelector('.v271-settings-content'), section);" not in n
          sc=Path('public/assets/v278-route-scroll-reset.js').read_text(encoding='utf-8')
          assert 'MutationObserver' in sc and 'routeRendered()' in sc and 'pendingRouteReset' in sc
          assert 'fetch' not in sc and 'provider_accounts_sync_all' not in sc
          print('P04_V285_UX_CONTRACT_PASS')
          PY
          rm -rf "$RUNNER_TEMP/v285-runtime" "$RUNNER_TEMP/v285-update-a" "$RUNNER_TEMP/v285-update-b" "$RUNNER_TEMP/v285-out"
          mkdir -p "$RUNNER_TEMP/v285-out" "$GITHUB_WORKSPACE/evidence"
          python3 scripts/build-release-tree.py "$RUNNER_TEMP/v285-runtime" | tee "$GITHUB_WORKSPACE/evidence/release-tree.json"
          jq -e '.version=="2.8.5" and .target_schema==14 and .release_kind=="maintenance_release"' "$RUNNER_TEMP/v285-runtime/release-manifest.json" >/dev/null
          python3 scripts/build-v285-update-release.py --target-runtime "$RUNNER_TEMP/v285-runtime" --output "$RUNNER_TEMP/v285-update-a" | tee "$GITHUB_WORKSPACE/evidence/update-build.json"
          python3 scripts/build-v285-update-release.py --target-runtime "$RUNNER_TEMP/v285-runtime" --output "$RUNNER_TEMP/v285-update-b" >/dev/null
          cmp "$RUNNER_TEMP/v285-update-a/VF_Infra_V2.8.5_UPDATE.zip" "$RUNNER_TEMP/v285-update-b/VF_Infra_V2.8.5_UPDATE.zip"
          php "$RUNNER_TEMP/v285-update-a/repair-v2.8.5.php" --self-test | tee "$GITHUB_WORKSPACE/evidence/atomic-self-test.txt"
          grep -Fq 'ATOMIC_SELF_TEST_PASS target=2.8.5 schema=14' "$GITHUB_WORKSPACE/evidence/atomic-self-test.txt"
          jq -e '.version=="2.8.5" and .schema==14 and .allowed_source_versions==["2.7.9","2.8.0","2.8.1","2.8.2","2.8.3","2.8.4"] and .release_kind=="settings_single_page_route_scroll_source_exact_runtime_safe_verify" and .source_exact_reconciliation==true and .reconcile_all_release_manifest_files==true and .post_repair_manifest_integrity_required==true and .settings_primary_sidebar_retained==true and .nested_settings_tabs_removed==true and .owned_route_post_render_scroll_reset==true' "$RUNNER_TEMP/v285-update-a/PACKAGE_MANIFEST.json" >/dev/null
          grep -Fq 'ReleaseManifestIntegrityVerifier::verify(__DIR__,VF_INFRA_ATOMIC_TARGET)' "$RUNNER_TEMP/v285-update-a/repair-v2.8.5.php"
          grep -Fq '"2.8.4"' "$RUNNER_TEMP/v285-update-a/repair-v2.8.5.php"
          unzip -t "$RUNNER_TEMP/v285-update-a/VF_Infra_V2.8.5_UPDATE.zip" >/dev/null
          test "$(unzip -Z1 "$RUNNER_TEMP/v285-update-a/VF_Infra_V2.8.5_UPDATE.zip" | wc -l | tr -d ' ')" = 1
          test "$(unzip -Z1 "$RUNNER_TEMP/v285-update-a/VF_Infra_V2.8.5_UPDATE.zip")" = 'repair-v2.8.5.php'
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, zipfile
          runtime=Path(os.environ['RUNNER_TEMP'])/'v285-runtime'
          out=Path(os.environ['RUNNER_TEMP'])/'v285-out'
          update_dir=Path(os.environ['RUNNER_TEMP'])/'v285-update-a'
          full=out/'VF_Infra_V2.8.5_FULL.zip'
          with zipfile.ZipFile(full,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9,strict_timestamps=True) as z:
              for f in sorted(x for x in runtime.rglob('*') if x.is_file()):
                  rel=f.relative_to(runtime).as_posix()
                  info=zipfile.ZipInfo(rel,date_time=(1980,1,1,0,0,0)); info.compress_type=zipfile.ZIP_DEFLATED; info.create_system=3; info.external_attr=(0o100644<<16)
                  z.writestr(info,f.read_bytes())
          update=update_dir/'VF_Infra_V2.8.5_UPDATE.zip'
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          manifest=json.loads((runtime/'release-manifest.json').read_text(encoding='utf-8'))
          pkg=json.loads((update_dir/'PACKAGE_MANIFEST.json').read_text(encoding='utf-8'))
          report={
            'status':'PASS','version':'2.8.5','schema':14,'product_source':os.environ['SOURCE_COMMIT'],
            'runtime_file_count':manifest['file_count']+1,'runtime_fingerprint':manifest['source_fingerprint'],
            'source_manifest_sha256':pkg['production_source_manifest_sha256'],
            'payload_file_count':pkg['payload_file_count'],
            'allowed_sources':pkg['allowed_source_versions'],
            'full':{'bytes':full.stat().st_size,'sha256':sha(full)},
            'update':{'bytes':update.stat().st_size,'sha256':sha(update)},
            'atomic_self_test':'PASS','settings_left_sidebar':'RETAINED','nested_tabs':'REMOVED',
            'data_management':'ONE_PAGE','system_information':'ONE_PAGE','route_scroll_post_render':'PASS',
            'long_action_feedback_regression':'PRESERVED','production_write':0
          }
          Path(os.environ['GITHUB_WORKSPACE'],'evidence','P04_V285_FORMAL_CANDIDATE.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (out/'CANDIDATE_IDENTITY.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False))
          PY
          cp "$RUNNER_TEMP/v285-out/VF_Infra_V2.8.5_FULL.zip" "$GITHUB_WORKSPACE/evidence/"
          cp "$RUNNER_TEMP/v285-update-a/VF_Infra_V2.8.5_UPDATE.zip" "$GITHUB_WORKSPACE/evidence/"
          cp "$RUNNER_TEMP/v285-update-a/PACKAGE_MANIFEST.json" "$GITHUB_WORKSPACE/evidence/"
          echo 'P04_V285_FORMAL_CANDIDATE_PASS'
          echo 'PRODUCTION_WRITE=0'

      - name: Upload candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: P04-V2.8.5-FORMAL-CANDIDATE
          path: evidence/
          if-no-files-found: error
          retention-days: 30
