name: P01 V2.27 Final Authority Head Gate
on:
  push:
    branches: [task/p01-v222-multi-surface-gate-20260828]
    paths: ['.github/workflows/p01-v227-final-authority-head-gate-20260828.yml']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE: e54b14d421343bc4e7b0288c93db0bb44589c84d
      TREE: 00a3567663d92e71292c2ab3fc0d4f8635a68454
      RUNTIME_SOURCE: efd05e0fd8af1f2f0f5ff74e778621fcc1a62430
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 2
          persist-credentials: false
          path: product
      - name: Exact authority closure and diff fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$SOURCE"
          test "$(git -C product rev-parse HEAD^{tree})" = "$TREE"
          test "$(cat product/VERSION)" = '2.27.0'
          test "$(cat product/src/VERSION.txt)" = '2.27.0'
          grep -F "define('VF_VERSION', '2.27.0');" product/src/app/bootstrap.php >/dev/null
          git -C product fetch --depth=2 origin "$RUNTIME_SOURCE"
          mapfile -t changed < <(git -C product diff --name-only "$RUNTIME_SOURCE" "$SOURCE")
          test "${#changed[@]}" -eq 7
          allowed='VF_PROJECT.json docs/architecture/P01_MULTI_SURFACE_ARCHITECTURE.md docs/authority/ACCEPTANCE_MATRIX.md docs/authority/CURRENT.md docs/authority/RPD.md docs/authority/SSOT.md docs/evidence/P01_V2.27.0_WORKSPACE_PRODUCTIZATION_20260828.md'
          for f in "${changed[@]}"; do grep -qwF "$f" <<<"$allowed"; done
          grep -F 'Final Exact Head Gate: 33178564469 / PASS' product/docs/authority/CURRENT.md >/dev/null
          grep -F 'Final Candidate Source: efd05e0fd8af1f2f0f5ff74e778621fcc1a62430' product/docs/authority/SSOT.md >/dev/null
          grep -F 'Final Exact Head Gate | PASS / `33178564469`' product/docs/authority/ACCEPTANCE_MATRIX.md >/dev/null
          python3 -m json.tool product/VF_PROJECT.json >/dev/null
          php -l product/src/app/bootstrap.php >/dev/null
          git -C product diff --check "$RUNTIME_SOURCE" "$SOURCE"
          echo P01_V227_FINAL_AUTHORITY_DIFF=PASS
      - name: Verdict
        shell: bash
        run: |
          echo P01_V227_FINAL_AUTHORITY_SOURCE=$SOURCE
          echo P01_V227_FINAL_AUTHORITY_TREE=$TREE
          echo P01_V227_FINAL_AUTHORITY_HEAD_GATE=PASS
          echo RUNTIME_EXACT_GATE=33178564469
          echo RELEASE=NO
          echo PRODUCTION=NO
