name: P01 V2.37.0 Watch Cover Diagnostic
on:
  push:
    branches: [diag/p01-v2370-watch-cover-20260902]
    paths: [.github/workflows/p01-v2370-watch-cover-diagnostic-20260902.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: fe0aaef44b163c4b899d802e73faa69d06b0f285
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          path: product
      - name: Fetch representative movie detail page
        shell: bash
        run: |
          set -Eeuo pipefail
          URL='https://xiaoheimi.cc/index.php/vod/detail/id/220543.html'
          curl --fail --silent --show-error --location --max-time 20 \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152.0 Safari/537.36' \
            -H 'Accept: text/html,application/xhtml+xml' "$URL" -o /tmp/page.html
          printf 'URL=%s\nBYTES=%s\n' "$URL" "$(stat -c%s /tmp/page.html)" | tee /tmp/summary.txt
          printf 'OG_IMAGE=%s\n' "$(grep -Eio '<meta[^>]+(og:image|twitter:image|image_src)[^>]*>' /tmp/page.html | wc -l)" | tee -a /tmp/summary.txt
          printf 'IMG_TAGS=%s\n' "$(grep -Eio '<img[^>]*>' /tmp/page.html | wc -l)" | tee -a /tmp/summary.txt
          printf 'DATA_ORIGINAL=%s\n' "$(grep -Eio 'data-original=["'"'][^"'"']+' /tmp/page.html | wc -l)" | tee -a /tmp/summary.txt
          printf 'DATA_SRC=%s\n' "$(grep -Eio 'data-src=["'"'][^"'"']+' /tmp/page.html | wc -l)" | tee -a /tmp/summary.txt
          grep -Eio '<img[^>]*(data-original|data-src|poster|cover|vod|pic|thumb)[^>]*>' /tmp/page.html | head -20 > /tmp/img-snippets.txt || true
      - name: Run current VF cover extractor
        shell: bash
        run: |
          set -Eeuo pipefail
          php -r "require 'product/src/app/ResourceCoverCache.php'; \$h=file_get_contents('/tmp/page.html'); \$c=VfResourceCoverCache::extractCoverCandidates(\$h,'https://xiaoheimi.cc/index.php/vod/detail/id/220543.html'); echo 'CURRENT_CANDIDATES='.count(\$c).PHP_EOL; foreach(array_slice(\$c,0,10) as \$x){echo \$x['score'].' '.\$x['url'].PHP_EOL;}" | tee /tmp/current-extractor.txt
      - name: Diagnostic verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          cat /tmp/summary.txt
          cat /tmp/current-extractor.txt
          test "$(awk -F= '/IMG_TAGS/{print $2}' /tmp/summary.txt)" -gt 0
          printf 'P01_V2370_WATCH_COVER_DIAGNOSTIC=PASS\n' | tee /tmp/verdict.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-v2370-watch-cover-diagnostic-${{ github.run_id }}
          path: |
            /tmp/summary.txt
            /tmp/current-extractor.txt
            /tmp/img-snippets.txt
            /tmp/verdict.txt
          if-no-files-found: warn
          retention-days: 30
