name: P01 V2.37.0 Watch Cover Diagnostic R2
on:
  push:
    branches: [diag/p01-v2370-watch-cover-20260902]
    paths: [.github/workflows/p01-v2370-watch-cover-diagnostic-20260902.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: fe0aaef44b163c4b899d802e73faa69d06b0f285
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          path: product
      - name: Fetch and classify representative detail page
        shell: bash
        run: |
          set -Eeuo pipefail
          URL='https://xiaoheimi.cc/index.php/vod/detail/id/220543.html'
          curl --fail --silent --show-error --location --max-time 20 \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152.0 Safari/537.36' \
            -H 'Accept: text/html,application/xhtml+xml' "$URL" -o /tmp/page.html
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('/tmp/page.html').read_text('utf-8','ignore')
          tags=re.findall(r'<img\b[^>]*>',s,re.I|re.S)
          def n(p): return len(re.findall(p,s,re.I|re.S))
          summary=[
            f'BYTES={len(s.encode("utf-8"))}',
            f'OG_IMAGE={n(r"<meta[^>]+(?:og:image|twitter:image|image_src)[^>]*>")}',
            f'IMG_TAGS={len(tags)}',
            f'DATA_ORIGINAL={n(r"\bdata-original\s*=")}',
            f'DATA_SRC={n(r"\bdata-src\s*=")}',
            f'LAZY_SRC={n(r"\bdata-lazy-src\s*=")}',
          ]
          Path('/tmp/summary.txt').write_text('\n'.join(summary)+'\n')
          Path('/tmp/img-snippets.txt').write_text('\n'.join(tags[:20])+'\n')
          print('\n'.join(summary)); print('\n'.join(tags[:20]))
          PY
      - name: Run current VF cover extractor
        shell: bash
        run: |
          set -Eeuo pipefail
          php -r "require 'product/src/app/ResourceCoverCache.php'; \$h=file_get_contents('/tmp/page.html'); \$c=VfResourceCoverCache::extractCoverCandidates(\$h,'https://xiaoheimi.cc/index.php/vod/detail/id/220543.html'); echo 'CURRENT_CANDIDATES='.count(\$c).PHP_EOL; foreach(array_slice(\$c,0,10) as \$x){echo \$x['score'].' '.\$x['url'].PHP_EOL;}" | tee /tmp/current-extractor.txt
      - name: Diagnostic verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          cat /tmp/summary.txt
          cat /tmp/current-extractor.txt
          test "$(awk -F= '/IMG_TAGS/{print $2}' /tmp/summary.txt)" -gt 0
          printf 'R1=HARNESS_ONLY_SHELL_QUOTING\nP01_V2370_WATCH_COVER_DIAGNOSTIC_R2=PASS\n' | tee /tmp/verdict.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-v2370-watch-cover-diagnostic-r2-${{ github.run_id }}
          path: |
            /tmp/summary.txt
            /tmp/current-extractor.txt
            /tmp/img-snippets.txt
            /tmp/verdict.txt
          if-no-files-found: warn
          retention-days: 30
