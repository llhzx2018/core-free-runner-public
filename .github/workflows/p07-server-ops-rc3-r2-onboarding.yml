name: P07 Server Ops RC3 R2 One-Click Onboarding

on:
  push:
    branches: [main]
    paths:
      - 'dist/p07/0.1.0-rc3/**'
      - 'installers/p07.sh'
      - 'installers/p07-toolbox.sh'
      - 'installers/p07-rc3-r2-onboarding.sh'
      - '.github/workflows/p07-server-ops-rc3-r2-onboarding.yml'
  pull_request:
    paths:
      - 'dist/p07/0.1.0-rc3/**'
      - 'installers/p07.sh'
      - 'installers/p07-toolbox.sh'
      - 'installers/p07-rc3-r2-onboarding.sh'
      - '.github/workflows/p07-server-ops-rc3-r2-onboarding.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r2-onboarding:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Exact guided-init15 identity
        run: |
          set -euo pipefail
          test "$(cat dist/p07/0.1.0-rc3/overlay/BUILD_ID)" = '0.1.0-rc3-guided-init15'
          test "$(git hash-object dist/p07/0.1.0-rc3/overlay/BUILD_ID)" = '392173a22e56e4764c95332b75d28886dac76bd2'
          test "$(git hash-object dist/p07/0.1.0-rc3/overlay/bin/vfops-storage-setup)" = '966bb88b4b5cee26c810c18c6aa55e6e79beee40'
          test "$(git hash-object dist/p07/0.1.0-rc3/overlay/lib/google_device_oauth.py)" = 'ce79cfd7cc9a8a9dcbad8d33566f8f4ac915db30'
          test "$(git hash-object dist/p07/0.1.0-rc3/overlay/tests/test_google_device_oauth.py)" = '5a1397008b47905616c302045d6a84a66b314429'
          test "$(git hash-object dist/p07/0.1.0-rc3/overlay/tests/test_storage_onboarding_ux.py)" = '9aba22b71d26e5e778c292b4fb659bbbbe234bee'

      - name: Build current runtime
        run: |
          set -euo pipefail
          rm -rf /tmp/p07-r2
          mkdir -p /tmp/p07-r2
          cp -a dist/p07/0.1.0-rc2/vf-server-ops/. /tmp/p07-r2/
          cp -a dist/p07/0.1.0-rc3/overlay/. /tmp/p07-r2/
          chmod +x /tmp/p07-r2/bin/vfops-storage-setup /tmp/p07-r2/bin/vfops-auto-backup
          test "$(cat /tmp/p07-r2/BUILD_ID)" = '0.1.0-rc3-guided-init15'

      - name: Syntax and onboarding tests
        env:
          PYTHONPATH: /tmp/p07-r2/lib
          P07_RC3_RUNTIME: /tmp/p07-r2
        run: |
          set -euo pipefail
          bash -n /tmp/p07-r2/bin/vfops-storage-setup
          bash -n /tmp/p07-r2/bin/vfops-auto-backup
          python3 -m py_compile /tmp/p07-r2/lib/google_device_oauth.py
          cd /tmp/p07-r2
          python3 tests/test_google_device_oauth.py -v
          python3 tests/test_storage_onboarding_ux.py -v
          cd "$GITHUB_WORKSPACE"
          python3 dist/p07/0.1.0-rc3/tests/test_storage_setup.py -v
          python3 dist/p07/0.1.0-rc3/tests/test_storage.py -v
          python3 dist/p07/0.1.0-rc3/tests/test_auto_backup.py -v
          sudo -E python3 dist/p07/0.1.0-rc3/tests/test_auto_backup_run_now_ux.py -v

      - name: Preparation-first and secret-boundary contract
        run: |
          set -euo pipefail
          SETUP=/tmp/p07-r2/bin/vfops-storage-setup
          OAUTH=/tmp/p07-r2/lib/google_device_oauth.py
          MENU=/tmp/p07-r2/bin/vfops-auto-backup
          grep -Fq '首次使用前只需要准备' "$SETUP"
          grep -Fq '已准备好，一键初始化 Google + B2' "$SETUP"
          grep -Fq '查看准备教程' "$SETUP"
          grep -Fq 'Google Drive API' "$SETUP"
          grep -Fq 'TVs and Limited Input devices' "$SETUP"
          grep -Fq 'Application Key ID + Application Key' "$SETUP"
          grep -Fq 'Recovery Key：P07 自动生成，无需提前准备' "$SETUP"
          grep -Fq 'secrets.token_urlsafe(48)' "$SETUP"
          grep -Fq '只显示这一次' "$SETUP"
          ! grep -Fq 'Recovery Key（输入不回显）' "$SETUP"
          ! grep -Fq 'Client Secret（输入不回显）' "$SETUP"
          ! grep -Fq '"client_secret": client_secret' "$OAUTH"
          ! grep -Fq 'sys.stdin.readline' "$OAUTH"
          grep -Fq '当前网站：已重新读取 CloudPanel 全部站点' "$MENU"
          grep -Fq '首次启用定时备份前，当前全部 CloudPanel 网站必须先完成一次真实双远程备份验证' "$MENU"
          grep -Fq '旧 PASS 不会覆盖新站点' "$MENU"
          grep -Fq 'DNS：未修改' "$SETUP"
          grep -Fq 'SOURCE：保留' "$SETUP"

      - name: Installer rollback and upgrade
        run: |
          set -euo pipefail
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          if [[ -z "$HEAD_SHA" ]]; then HEAD_SHA="$GITHUB_SHA"; fi
          ROOT="https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/${HEAD_SHA}"
          FIXED14="https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/ad5acb910262777e003cb4a9efaece667ba0e7e2"
          WORK=/tmp/p07-init15-gate
          rm -rf "$WORK"
          mkdir -p "$WORK/bin"

          P07_ALLOW_NONROOT=1 P07_NO_EXEC=1 P07_TOOLBOX_PARENT=1 \
            P07_PUBLIC_ROOT="$FIXED14" P07_INSTALL_DIR="$WORK/install" P07_PREVIOUS_DIR="$WORK/previous" P07_BIN_LINK="$WORK/bin/vfops" \
            bash <(curl -fsSL "$FIXED14/installers/p07.sh")
          test "$($WORK/bin/vfops --build-id)" = '0.1.0-rc3-guided-init14'
          BEFORE="$(find "$WORK/install" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"

          set +e
          P07_ALLOW_NONROOT=1 P07_NO_EXEC=1 P07_TOOLBOX_PARENT=1 P07_INIT15_TEST_FAIL=1 \
            P07_PUBLIC_ROOT="$ROOT" P07_INSTALL_DIR="$WORK/install" P07_PREVIOUS_DIR="$WORK/previous" P07_BIN_LINK="$WORK/bin/vfops" \
            bash "$GITHUB_WORKSPACE/installers/p07-rc3-r2-onboarding.sh"
          RC=$?
          set -e
          test "$RC" -ne 0
          test "$($WORK/bin/vfops --build-id)" = '0.1.0-rc3-guided-init14'
          AFTER="$(find "$WORK/install" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          test "$BEFORE" = "$AFTER"

          P07_ALLOW_NONROOT=1 P07_NO_EXEC=1 P07_TOOLBOX_PARENT=1 \
            P07_PUBLIC_ROOT="$ROOT" P07_INSTALL_DIR="$WORK/install" P07_PREVIOUS_DIR="$WORK/previous" P07_BIN_LINK="$WORK/bin/vfops" \
            bash "$GITHUB_WORKSPACE/installers/p07-rc3-r2-onboarding.sh"
          test "$($WORK/bin/vfops --build-id)" = '0.1.0-rc3-guided-init15'
          grep -Fq 'Recovery Key：P07 自动生成，无需提前准备' "$WORK/install/bin/vfops-storage-setup"

      - name: Stable and Toolbox routing
        run: |
          set -euo pipefail
          test "$(git hash-object installers/p07-rc3-r2-onboarding.sh)" = '66e6eeae6d2123c318cd755365e299b04e61eac4'
          grep -Fq 'installers/p07-rc3-r2-onboarding.sh' installers/p07.sh
          grep -Fq 'EXPECTED_BLOB="66e6eeae6d2123c318cd755365e299b04e61eac4"' installers/p07.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-rc3-guided-init15"' installers/p07-toolbox.sh
          grep -Fq '3. CloudPanel 备份 / 恢复 / 迁移' installers/p07-toolbox.sh
          grep -Fq '测试中' installers/p07-toolbox.sh
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc12"' installers/p07-toolbox.sh

      - name: Result
        run: echo 'P07_SERVER_OPS_RC3_R2_ONBOARDING_GATE=PASS'
