name: P07 Server Ops RC3 R2 One-Click Onboarding

on:
  push:
    branches: [main]
    paths:
      - 'dist/p07/0.1.0-rc3/**'
      - 'installers/p07.sh'
      - 'installers/p07-toolbox.sh'
      - 'installers/p07-rc3-r2-oauth-contract.sh'
      - '.github/workflows/p07-server-ops-rc3-r2-onboarding.yml'
  pull_request:
    paths:
      - 'dist/p07/0.1.0-rc3/**'
      - 'installers/p07.sh'
      - 'installers/p07-toolbox.sh'
      - 'installers/p07-rc3-r2-oauth-contract.sh'
      - '.github/workflows/p07-server-ops-rc3-r2-onboarding.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r2-onboarding:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Exact guided-init16 identity
        run: |
          set -euo pipefail
          test "$(cat dist/p07/0.1.0-rc3/overlay/BUILD_ID)" = '0.1.0-rc3-guided-init16'
          test "$(git hash-object dist/p07/0.1.0-rc3/overlay/BUILD_ID)" = '622b752887d46c17a8a5d05046037a2dc6a35475'
          test "$(git hash-object dist/p07/0.1.0-rc3/overlay/bin/vfops-storage-setup)" = 'b279677ae561f9feb689964bd8f09be98c9211c9'
          test "$(git hash-object dist/p07/0.1.0-rc3/overlay/lib/google_device_oauth.py)" = '3b023f307bf744650a351e19bde01b3597469992'
          test "$(git hash-object dist/p07/0.1.0-rc3/overlay/tests/test_google_device_oauth.py)" = 'c72c938a5ed81b074c1ae8a3afbb0943df0aa683'
          test "$(git hash-object dist/p07/0.1.0-rc3/overlay/tests/test_storage_onboarding_ux.py)" = '59bf88d6b6a6493c536919ab67318513330d091f'

      - name: Build current runtime
        run: |
          set -euo pipefail
          rm -rf /tmp/p07-r2
          mkdir -p /tmp/p07-r2
          cp -a dist/p07/0.1.0-rc2/vf-server-ops/. /tmp/p07-r2/
          cp -a dist/p07/0.1.0-rc3/overlay/. /tmp/p07-r2/
          chmod +x /tmp/p07-r2/bin/vfops-storage-setup /tmp/p07-r2/bin/vfops-auto-backup
          test "$(cat /tmp/p07-r2/BUILD_ID)" = '0.1.0-rc3-guided-init16'

      - name: Syntax and onboarding regressions
        env:
          PYTHONPATH: /tmp/p07-r2/lib
          P07_RC3_RUNTIME: /tmp/p07-r2
        run: |
          set -euo pipefail
          bash -n /tmp/p07-r2/bin/vfops-storage-setup
          bash -n /tmp/p07-r2/bin/vfops-auto-backup
          python3 -m py_compile /tmp/p07-r2/lib/google_device_oauth.py
          cd /tmp/p07-r2
          python3 tests/test_google_device_oauth.py -v
          python3 tests/test_storage_onboarding_ux.py -v
          cd "$GITHUB_WORKSPACE"
          python3 dist/p07/0.1.0-rc3/tests/test_storage_setup.py -v
          python3 dist/p07/0.1.0-rc3/tests/test_auto_backup.py -v
          sudo -E python3 dist/p07/0.1.0-rc3/tests/test_auto_backup_run_now_ux.py -v

      - name: Preparation-first and secret-boundary contract
        run: |
          set -euo pipefail
          SETUP=/tmp/p07-r2/bin/vfops-storage-setup
          OAUTH=/tmp/p07-r2/lib/google_device_oauth.py
          MENU=/tmp/p07-r2/bin/vfops-auto-backup
          grep -Fq '首次使用前请先准备' "$SETUP"
          grep -Fq 'Google：OAuth Client ID + Client Secret' "$SETUP"
          grep -Fq 'B2：Bucket + Application Key ID + Application Key' "$SETUP"
          grep -Fq '已准备好，一键初始化 Google + B2' "$SETUP"
          grep -Fq '查看完整准备教程' "$SETUP"
          grep -Fq 'Google Drive API' "$SETUP"
          grep -Fq 'TVs and Limited Input devices' "$SETUP"
          grep -Fq 'OAuth Client Secret（输入不回显）' "$SETUP"
          grep -Fq 'Recovery Key：P07 自动生成，无需提前准备' "$SETUP"
          grep -Fq 'secrets.token_urlsafe(48)' "$SETUP"
          grep -Fq '只显示这一次' "$SETUP"
          ! grep -Fq 'Recovery Key（输入不回显）' "$SETUP"
          ! grep -Fq -- '--client-secret' "$SETUP"
          grep -Fq 'DEVICE_ENDPOINT, {"client_id": client_id, "scope": DRIVE_SCOPE}' "$OAUTH"
          grep -Fq '"client_secret": client_secret' "$OAUTH"
          grep -Fq 'client_secret = sys.stdin.readline()' "$OAUTH"
          grep -Fq '当前网站：已重新读取 CloudPanel 全部站点' "$MENU"
          grep -Fq '首次启用定时备份前，当前全部 CloudPanel 网站必须先完成一次真实双远程备份验证' "$MENU"
          grep -Fq '旧 PASS 不会覆盖新站点' "$MENU"
          grep -Fq 'DNS：未修改' "$SETUP"
          grep -Fq 'SOURCE：保留' "$SETUP"

      - name: Installer rollback and upgrade from fixed init15
        run: |
          set -euo pipefail
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          if [[ -z "$HEAD_SHA" ]]; then HEAD_SHA="$GITHUB_SHA"; fi
          ROOT="https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/${HEAD_SHA}"
          FIXED15="https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/aa4dbc32cdddd81a188d55714c050de6b28436f2"
          WORK=/tmp/p07-init16-gate
          rm -rf "$WORK"
          mkdir -p "$WORK/bin"
          curl -fsSL "$FIXED15/installers/p07.sh" -o "$WORK/init15.sh"

          sudo env P07_NO_EXEC=1 P07_TOOLBOX_PARENT=1 \
            P07_PUBLIC_ROOT="$FIXED15" P07_INSTALL_DIR="$WORK/install" P07_PREVIOUS_DIR="$WORK/previous" P07_BIN_LINK="$WORK/bin/vfops" \
            bash "$WORK/init15.sh"
          test "$($WORK/bin/vfops --build-id)" = '0.1.0-rc3-guided-init15'
          BEFORE="$(sudo find "$WORK/install" -type f -print0 | sort -z | sudo xargs -0 sha256sum | sha256sum | awk '{print $1}')"

          set +e
          sudo env P07_NO_EXEC=1 P07_TOOLBOX_PARENT=1 P07_INIT16_TEST_FAIL=1 \
            P07_PUBLIC_ROOT="$ROOT" P07_INSTALL_DIR="$WORK/install" P07_PREVIOUS_DIR="$WORK/previous" P07_BIN_LINK="$WORK/bin/vfops" \
            bash "$GITHUB_WORKSPACE/installers/p07-rc3-r2-oauth-contract.sh"
          RC=$?
          set -e
          test "$RC" -ne 0
          test "$($WORK/bin/vfops --build-id)" = '0.1.0-rc3-guided-init15'
          AFTER="$(sudo find "$WORK/install" -type f -print0 | sort -z | sudo xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          test "$BEFORE" = "$AFTER"

          sudo env P07_NO_EXEC=1 P07_TOOLBOX_PARENT=1 \
            P07_PUBLIC_ROOT="$ROOT" P07_INSTALL_DIR="$WORK/install" P07_PREVIOUS_DIR="$WORK/previous" P07_BIN_LINK="$WORK/bin/vfops" \
            bash "$GITHUB_WORKSPACE/installers/p07-rc3-r2-oauth-contract.sh"
          test "$($WORK/bin/vfops --build-id)" = '0.1.0-rc3-guided-init16'
          grep -Fq 'Google：OAuth Client ID + Client Secret' "$WORK/install/bin/vfops-storage-setup"
          grep -Fq 'Recovery Key：P07 自动生成，无需提前准备' "$WORK/install/bin/vfops-storage-setup"

      - name: Stable and Toolbox routing
        run: |
          set -euo pipefail
          test "$(git hash-object installers/p07-rc3-r2-oauth-contract.sh)" = '4a7889ea606fa2353f194abbb2c6b27345f35050'
          grep -Fq 'installers/p07-rc3-r2-oauth-contract.sh' installers/p07.sh
          grep -Fq 'EXPECTED_BLOB="4a7889ea606fa2353f194abbb2c6b27345f35050"' installers/p07.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-rc3-guided-init16"' installers/p07-toolbox.sh
          grep -Fq 'VERSION="V0.1.0"' installers/p07-toolbox.sh
          grep -Fq '3. CloudPanel 备份 / 恢复 / 迁移' installers/p07-toolbox.sh
          grep -Fq '测试中' installers/p07-toolbox.sh
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc12"' installers/p07-toolbox.sh

      - name: Result
        run: echo 'P07_SERVER_OPS_RC3_R2_ONBOARDING_GUIDED_INIT16_GATE=PASS'
