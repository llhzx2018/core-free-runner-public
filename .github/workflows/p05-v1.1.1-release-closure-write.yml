name: P05 V1.1.1 Release Closure Write

on:
  push:
    branches:
      - verify/p05-v1.1.0-release-source-20260830
    paths:
      - '.github/workflows/p05-v1.1.1-release-closure-write.yml'

permissions:
  contents: read

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_BRANCH: governance/p05-v1.1.1-release-closure-20260830
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      RELEASE_SOURCE: ac8c3f2bedf3b1fe16f38ed079ffbe2f29e54cbc
      RELEASE_TREE: 0012ca03e7a065a1d5866e1d6dcc62e79c901fff
      RELEASE_ID: '379069840'
      FULL_ASSET_ID: '535585680'
      RECEIPT_ASSET_ID: '535585687'
      FULL_BYTES: '218144'
      FULL_SHA: 905f7381a5c2e526c585c578df58aa604fffbab457e96d47444f78a3ff885c4c
      CORE_UPDATES_MAIN: d7aa807b588fcdcc60f2f719895d9ae111a1a5d9
    steps:
      - name: Verify release write token
        shell: bash
        run: test -n "$GH_TOKEN" || { echo TOKEN_MISSING; exit 78; }
      - name: Checkout P05 closure branch
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ env.GH_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply V1.1.1 formal release closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          source=os.environ['RELEASE_SOURCE']; tree=os.environ['RELEASE_TREE']
          release_id=int(os.environ['RELEASE_ID']); full_asset_id=int(os.environ['FULL_ASSET_ID']); receipt_asset_id=int(os.environ['RECEIPT_ASSET_ID'])
          full_bytes=int(os.environ['FULL_BYTES']); full_sha=os.environ['FULL_SHA']; core_main=os.environ['CORE_UPDATES_MAIN']

          # VF_PROJECT current truth
          pth=Path('VF_PROJECT.json'); p=json.loads(pth.read_text())
          p['status']='V1.1.1_RELEASED / DEPLOYMENT_READY / PRODUCTION_NOT_DEPLOYED'
          p['version']='1.1.1'; p['target_version']='1.1.1'; p['working_version']='1.1.1'; p['version_change']=False
          p['working_branch']='main'
          p['formal_release']='v1.1.1'; p['formal_release_state']='RELEASED_CURRENT'
          p['formal_release_candidate_commit']=source; p['formal_release_candidate_tree']=tree
          p['formal_release_asset']='VF_SEO_V1.1.1_FULL.zip'; p['formal_release_asset_files']=36; p['formal_release_asset_bytes']=full_bytes; p['formal_release_asset_sha256']=full_sha
          p['formal_release_id']=release_id; p['formal_release_asset_id']=full_asset_id
          p['release_authorization']='PASS_RELEASED'
          p['production_deployment']='NOT_DEPLOYED'; p['production_version']=None; p['production_write']=0
          p['next_action']='P05 V1.1.1 RELEASE CLOSED; PRODUCTION REMAINS NOT_DEPLOYED; NEXT GATE IS OWNER-AUTHORIZED PRODUCTION ACTIVATION'
          fix=p.setdefault('v1_1_1_cloudpanel_root_fix',{})
          fix.update({'state':'RELEASED','release_source':source,'release_tree':tree,'formal_release':'v1.1.1','release_id':release_id,'full_asset_id':full_asset_id,'full_asset_bytes':full_bytes,'full_asset_sha256':full_sha,'exact_source_gate_run':33268647550,'exact_source_gate_job':99143063005,'exact_main_gate_run':33268752148,'exact_main_gate_job':99143334619,'publication_run':33268819597,'publication_job':99143516199,'manifest_gate_run':33268887831,'manifest_gate_job':99143689984,'core_updates_main':core_main,'production_state':'NOT_DEPLOYED'})
          p['deployment_readiness']={
            'state':'PASS_V1.1.1_RELEASED','production_state':'NOT_DEPLOYED','production_verification':'NOT_APPLICABLE_UNTIL_FIRST_DEPLOYMENT',
            'exact_source':source,'product_tree':tree,'schema':1,'common_product_baseline':'VF-COMMON-PRODUCT-BASELINE@2.0',
            'regression_evidence':{'repository':'llhzx2018/core-free-runner-public','run':33268752148,'job':99143334619,'state':'PASS'},
            'cloudpanel_direct_extract':{'state':'PASS','root_entry':'index.php','root_assets':'assets/','hardened_root':'php/public','runtime_version_authority':'VERSION'},
            'full_asset':{'name':'VF_SEO_V1.1.1_FULL.zip','files':36,'bytes':full_bytes,'sha256':full_sha},
            'update_asset':{'state':'NOT_PUBLISHED_FULL_ONLY'}
          }
          p['release_publication']={
            'state':'PASS_V1.1.1_CURRENT','repository':'llhzx2018/core-free-runner-public','workflow':'.github/workflows/p05-v1.1.1-publish-release.yml',
            'run':33268819597,'job':99143516199,'release_id':release_id,'tag':'v1.1.1','tag_source':source,'tag_tree':tree,
            'full_asset_id':full_asset_id,'receipt_asset_id':receipt_asset_id,'full_asset_sha256':full_sha,
            'distribution':'core-updates/projects/P05.json','distribution_commit':core_main,'distribution_mode':'FULL_ONLY','from_versions':[],
            'production_state':'NOT_DEPLOYED','known_non_release_blocker':None
          }
          p.setdefault('authority',{})['release']='docs/authority/RELEASE_V1.1.1_CURRENT.md'
          pth.write_text(json.dumps(p,ensure_ascii=False,indent=2)+'\n')

          # README current truth and release boundary
          r=Path('README.md'); text=r.read_text()
          text=re.sub(r'```text\nProduct: P05 · VF SEO\n.*?```', f'''```text\nProduct: P05 · VF SEO\nCurrent Formal Release: v1.1.1 · CloudPanel Direct-Extract Fix\nRepository VERSION: 1.1.1 · RELEASED / DEPLOYMENT_READY\nFormal Release Source: {source}\nLogical Schema: VF-SEO-SCHEMA@1 / 1\nDefault Database: SQLite\nProduction Deployment: NOT DEPLOYED\nPHP Runtime Compatibility: V1.1.1 RELEASED / CLOUDPANEL DIRECT-EXTRACT READY / NOT PRODUCTION\n```''', text, count=1, flags=re.S)
          text=text.replace('`v1.1.0` 仍是当前已经发布的 Formal Release；`v1.1.1` 是针对第一次真实 CloudPanel 解压反馈形成的 patch Release Source。Formal Release 与 Production Deployment 仍是不同 Gate，Production 保持 `NOT_DEPLOYED`。', '`v1.1.1` 已完成 Exact Source、Exact Main、CloudPanel Direct-Extract、正式 Tag / GitHub Release、正式 FULL 资产与 `core-updates` Distribution Manifest 收口。Formal Release 与 Production Deployment 仍是不同 Gate，Production 保持 `NOT_DEPLOYED`。')
          text=text.replace('- 当前 Formal Release 仍为 `v1.1.0`，V1.1.1 只有在新的 Exact Source Machine Gate、main Merge Gate、Tag / GitHub Release 与 distribution manifest 全部完成后才升级为正式版本。', f'- Formal Release `v1.1.1` 已绑定 Exact Main `{source}`、Tree `{tree}` 与完整 Machine PASS。')
          text=text.replace('- `v1.1.1` 不声明 V1.1.0 → V1.1.1 Atomic 在线升级；继续使用 `FULL_ONLY` / `from_versions=[]`。', '- `v1.1.1` GitHub Release 与 `core-updates/projects/P05.json` 均已发布；继续使用 `FULL_ONLY` / `from_versions=[]`，不声明 V1.1.0 → V1.1.1 Atomic 在线升级。')
          r.write_text(text)

          # CHANGELOG promotion
          c=Path('CHANGELOG.md'); text=c.read_text()
          text=text.replace('## 1.1.1 · CloudPanel Direct-Extract Fix（Release Source · 2026-08-30）','## 1.1.1 · CloudPanel Direct-Extract Fix（正式发布 · 2026-08-30）',1)
          anchor='\n## 1.1.0 · PHP-first Runtime（正式发布 · 2026-08-30）'
          if 'Formal Publication：`v1.1.1`' not in text:
              extra=f'''- Formal Publication：`v1.1.1` / Release `{release_id}` / `VF_SEO_V1.1.1_FULL.zip` / 36 files / {full_bytes} bytes / SHA-256 `{full_sha}`。\n- Exact Main `{source}` / Tree `{tree}` 已通过 Public Runner Run `33268752148` / Job `99143334619` 全链 Machine PASS。\n- Publication Run `33268819597` / Job `99143516199` = PASS；GitHub Tag / Release / Assets Remote Readback = PASS。\n- `core-updates/projects/P05.json` 已晋级 V1.1.1，main `{core_main}`；Manifest Gate Run `33268887831` / Job `99143689984` = PASS。\n- Production 继续保持 `NOT_DEPLOYED`。\n'''
              text=text.replace(anchor,'\n'+extra+anchor,1)
          c.write_text(text)

          # Release docs index
          Path('docs/release/README.md').write_text(f'''# P05 Release Documentation\n\nCurrent formal release: `v1.1.1` · CloudPanel Direct-Extract Fix.\n\nFormal publication truth:\n\n- Release source: `{source}`\n- Release tree: `{tree}`\n- GitHub Release ID: `{release_id}`\n- Formal FULL: `VF_SEO_V1.1.1_FULL.zip`\n- FULL: `36 files / {full_bytes} bytes`\n- SHA-256: `{full_sha}`\n- Exact Source Machine: Run `33268647550` / Job `99143063005` = PASS\n- Exact Main Machine: Run `33268752148` / Job `99143334619` = PASS\n- Publication: Run `33268819597` / Job `99143516199` = PASS\n- Distribution Manifest: `core-updates/main@{core_main}`; Gate Run `33268887831` / Job `99143689984` = PASS\n- Distribution: `FULL_ONLY` / `from_versions=[]`\n- Production: `NOT_DEPLOYED`\n\nV1.1.1 documents:\n\n- `V1.1.1_CLOUDPANEL_ROOT_FIX.md` — root-entry defect, runtime-version authority correction, private runtime boundary, and machine contract.\n- `../authority/RELEASE_V1.1.1_CURRENT.md` — current formal release authority.\n\nV1.1.0 documents remain historical evidence. Release Source, Formal Release, Distribution Manifest, and Production Deployment remain separate truth layers. V1.1.1 release/distribution are closed; Production remains a later Owner gate.\n''')

          authority=Path('docs/authority/RELEASE_V1.1.1_CURRENT.md')
          authority.write_text(f'''# P05 · VF SEO · V1.1.1 Current Release Authority\n\n## Release\n\n- Formal Release: `v1.1.1`\n- State: `RELEASED / DEPLOYMENT_READY / PRODUCTION_NOT_DEPLOYED`\n- Published At: `2026-08-29T18:38:53Z`\n- GitHub Release ID: `{release_id}`\n\n## Product Source\n\n- Exact Main Source: `{source}`\n- Product Tree: `{tree}`\n- VERSION: `1.1.1`\n- Schema: `VF-SEO-SCHEMA@1 / 1`\n\nThe formal tag `v1.1.1` resolves to the exact main source above. The merge commit tree is byte-identical to the final verified patch-source tree.\n\n## CloudPanel Deployment Contract\n\n- Direct-extract Root Entry: `index.php`\n- Direct-extract static root: `assets/`\n- Hardened alternative Root Directory: `php/public`\n- PHP minimum: `8.2`\n- Required extension: `pdo_sqlite`\n- Runtime product version authority: `VERSION`\n- Private runtime config: `$HOME/.config/vf-seo/runtime.env`\n- SQLite / Backup private root: `$HOME/.local/share/vf-seo`\n- Production Web server requires Node/PM2: `NO`\n- Node 24: `OPTIONAL WORKER / ADVANCED COMPATIBILITY RUNTIME`\n- Production Deployment: `NOT_DEPLOYED`\n\n## Formal Asset\n\n- FULL: `VF_SEO_V1.1.1_FULL.zip`\n- Release Asset ID: `{full_asset_id}`\n- Files: `36`\n- Bytes: `{full_bytes}`\n- SHA-256: `{full_sha}`\n- Release Receipt Asset ID: `{receipt_asset_id}`\n\n## Machine Evidence\n\n- Patch Exact Source: Run `33268647550` / Job `99143063005` = `PASS`\n- Exact Main Release Gate: Run `33268752148` / Job `99143334619` = `PASS`\n- Formal Publication: Run `33268819597` / Job `99143516199` = `PASS`\n- Distribution Manifest Gate: Run `33268887831` / Job `99143689984` = `PASS`\n- core-updates main: `{core_main}`\n\nSame-source evidence includes npm dependency install, release/source/scope/dependency/security gates, lint, typecheck, SQLite migration/schema, unit/contract/integration regression, Node/React build, PHP syntax and security/password interop, fresh PHP migration/admin bootstrap, nested-public HTTP smoke, CloudPanel direct-extract root smoke, root static-asset verification, PHP VERSION identity, CLI HTTP fail-closed, formal deterministic FULL build, `npm audit` and repository cleanliness.\n\n## Distribution\n\n- Mode: `FULL_ONLY`\n- `from_versions=[]`\n- Atomic V1.1.0 → V1.1.1 update claimed: `NO`\n- Manifest: `core-updates/projects/P05.json`\n\n## Boundary / Closure\n\nThis release closes source, formal publication, CloudPanel direct-extract package correctness, and update-distribution truth for V1.1.1. It does not claim a live Production deployment. `production_version` remains `null`; Production activation and runtime acceptance remain a separate Owner-authorized gate.\n\n`P05 V1.1.1 RELEASE = PASS / CLOSED`\n\n`P05 Production = NOT_DEPLOYED`\n''')
          PY
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add README.md CHANGELOG.md VF_PROJECT.json docs/release/README.md docs/authority/RELEASE_V1.1.1_CURRENT.md
          git diff --cached --check
          git commit -m 'governance(P05): close V1.1.1 formal release'
          git push origin "HEAD:$TARGET_BRANCH"
          echo P05_V111_RELEASE_CLOSURE_WRITE=PASS
