name: S01 embed plugin native update discovery
on:
  push:
    branches: [task/s01-embed-recheck-20261031]
    paths: ['.github/workflows/s01-embed-plugin-discovery-20261031.yml']
permissions:
  contents: read
jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4cac82e7eed6eb20b90aa8cc2964ae3ccc4b94b3
          persist-credentials: false
          path: control
      - name: Verify published manifest and download exact prior release
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p proof provider
          gh api 'repos/llhzx2018/core-updates/contents/projects/S01-C03.json?ref=main' --jq .content | base64 -d > proof/manifest.json
          python3 - <<'PY'
          import json
          m=json.load(open('proof/manifest.json'))
          assert m['target_version']=='1.25.97' and '1.25.96' in m['from_versions']
          assert m['asset_sha256']=='d84279b9527f5da7ae43f05759dfb8288f5a07e63e481c84253e507458ad485f'
          print('MAIN_PLUGIN_CHANNEL_READBACK_PASS')
          PY
          gh release download v1.25.96 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.96.zip --dir provider
          echo 'c49b51b8d4f92acb88fe5b1f1f6a2dc9ce523a49a394425f2123d1e9bed24723  provider/vf-tools-m3u8_V1.25.96.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          root=Path('control/lanes/s01-converter-plugin-discovery-20261030')
          for name in ['discovery.sh','discover.php']:
              p=root/name
              s=p.read_text().replace('1.25.96','1.25.97').replace('1.25.94','1.25.96')
              p.write_text(s)
          PY
          php -l control/lanes/s01-converter-plugin-discovery-20261030/discover.php
      - name: Native WordPress plugin update discovery in test mode
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: bash control/lanes/s01-converter-plugin-discovery-20261030/discovery.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-embed-plugin-discovery-${{ github.run_id }}
          path: proof/
          retention-days: 14
