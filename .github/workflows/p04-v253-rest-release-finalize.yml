name: P04 V2.5.3 REST Release Finalize

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p04-v253-rest-release-finalize.yml'

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CANDIDATE: 4037ef8533747b774716eae96a529f752c4dca16
      TAG: v2.5.3
      VERSION: 2.5.3
      UPDATE_ASSET: VF_Infra_V2.5.3_UPDATE.zip
      ATOMIC_ASSET: VF_Infra_V2.5.3_ATOMIC.zip
      EXPECTED_BYTES: '198577'
      EXPECTED_SHA256: e98c122e9e2e75c6c2668039488c3e656f1569dfaa46aa4b5bdbcc4f701112ec
      EXPECTED_SOURCE_MANIFEST: d7d05a3d255eade6a31a1983c5cdf4455ae1dea5a448ec29c029e69158eb3618
    steps:
      - name: Require unified credentials
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$WRITE_TOKEN"; test -n "$READ_TOKEN"
          echo 'UNIFIED_CREDENTIALS=PASS'

      - name: Prepare real build runtime
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-zip sqlite3 jq >/dev/null
          php -r 'foreach(["pdo_sqlite","sqlite3","curl","openssl","json","sodium"] as $x)if(!extension_loaded($x))exit(2);if(!class_exists("ZipArchive"))exit(3);echo "REAL_BUILD_RUNTIME=PASS\n";'

      - name: Rebuild exact immutable V2.5.3 formal artifacts
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone -q "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/vf-infra.git" repo
          cd repo
          git checkout -q "$CANDIDATE"
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(cat VERSION)" = "$VERSION"
          python3 scripts/build-release-tree.py "$RUNNER_TEMP/v253-runtime" >/dev/null
          python3 scripts/build-v253-update-release.py --target-runtime "$RUNNER_TEMP/v253-runtime" --output "$RUNNER_TEMP/v253-release" >"$RUNNER_TEMP/v253-build.jsonl"
          php "$RUNNER_TEMP/v253-release/repair-v2.5.3.php" --self-test
          for n in "$UPDATE_ASSET" "$ATOMIC_ASSET"; do
            p="$RUNNER_TEMP/v253-release/$n"
            test "$(stat -c%s "$p")" = "$EXPECTED_BYTES"
            test "$(sha256sum "$p"|awk '{print $1}')" = "$EXPECTED_SHA256"
          done
          cmp -s "$RUNNER_TEMP/v253-release/$UPDATE_ASSET" "$RUNNER_TEMP/v253-release/$ATOMIC_ASSET"
          python3 - "$RUNNER_TEMP/v253-release/PACKAGE_MANIFEST.json" <<'PY'
          import json,os,sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          assert p['version']=='2.5.3' and p['schema']==14
          assert p['allowed_source_versions']==['2.5.2']
          assert p['payload_file_count']==7
          assert p['production_source_file_count']==148
          assert p['production_source_manifest_sha256']==os.environ['EXPECTED_SOURCE_MANIFEST']
          assert p['schema_change'] is False and p['business_model_change'] is False and p['provider_write_authority_change'] is False
          PY
          echo 'EXACT_FORMAL_ARTIFACTS=PASS'

      - name: Verify exact tag and create/read Release via REST only
        env:
          TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          auth=(-H "Authorization: Bearer $TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          tag_code=$(curl -sS -o "$RUNNER_TEMP/tag.json" -w '%{http_code}' "${auth[@]}" "https://api.github.com/repos/llhzx2018/vf-infra/git/ref/tags/$TAG")
          test "$tag_code" = 200
          test "$(jq -r .object.sha "$RUNNER_TEMP/tag.json")" = "$CANDIDATE"

          code=$(curl -sS -o "$RUNNER_TEMP/release.json" -w '%{http_code}' "${auth[@]}" "https://api.github.com/repos/llhzx2018/vf-infra/releases/tags/$TAG")
          if [[ "$code" = 404 ]]; then
            jq -n --arg tag "$TAG" --arg target "$CANDIDATE" --arg name 'VF Infra V2.5.3' --arg body 'P04 V2.5.3 Hotfix：修复 V2.5.2 Production Settings 500、统一更新信任语义、Maintenance/Atomic CSP UI、运行时代码缓存失效与成功清理。Schema 14 不变；不增加 Provider 写权限。' \
              '{tag_name:$tag,target_commitish:$target,name:$name,body:$body,draft:false,prerelease:false,generate_release_notes:false}' > "$RUNNER_TEMP/create-release.json"
            create_code=$(curl -sS -o "$RUNNER_TEMP/release.json" -w '%{http_code}' -X POST "${auth[@]}" -H 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/create-release.json" 'https://api.github.com/repos/llhzx2018/vf-infra/releases')
            test "$create_code" = 201
          else
            test "$code" = 200
          fi
          rid=$(jq -r .id "$RUNNER_TEMP/release.json")
          test -n "$rid"; test "$rid" != null
          test "$(jq -r .tag_name "$RUNNER_TEMP/release.json")" = "$TAG"
          test "$(jq -r .draft "$RUNNER_TEMP/release.json")" = false
          test "$(jq -r .prerelease "$RUNNER_TEMP/release.json")" = false
          echo "$rid" > "$RUNNER_TEMP/release-id.txt"
          echo "REST_RELEASE_ID=$rid"
          echo 'REST_RELEASE_CREATE_OR_READ=PASS'

      - name: Upload missing assets and reject any conflicting asset
        env:
          TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          auth=(-H "Authorization: Bearer $TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          rid=$(cat "$RUNNER_TEMP/release-id.txt")
          curl -fsS "${auth[@]}" "https://api.github.com/repos/llhzx2018/vf-infra/releases/$rid" > "$RUNNER_TEMP/release-current.json"

          upload_one(){
            local name="$1" type="$2" path="$3"
            local local_bytes local_sha count remote_bytes remote_digest existing_id
            local_bytes=$(stat -c%s "$path"); local_sha=$(sha256sum "$path"|awk '{print $1}')
            count=$(jq -r --arg n "$name" '[.assets[]|select(.name==$n)]|length' "$RUNNER_TEMP/release-current.json")
            if [[ "$count" = 1 ]]; then
              remote_bytes=$(jq -r --arg n "$name" '.assets[]|select(.name==$n)|.size' "$RUNNER_TEMP/release-current.json")
              remote_digest=$(jq -r --arg n "$name" '.assets[]|select(.name==$n)|.digest // ""' "$RUNNER_TEMP/release-current.json")
              test "$remote_bytes" = "$local_bytes"
              if [[ -n "$remote_digest" && "$remote_digest" != null ]]; then test "$remote_digest" = "sha256:$local_sha"; fi
              echo "ASSET_ALREADY_EXACT=$name"
              return
            fi
            test "$count" = 0
            code=$(curl -sS -o "$RUNNER_TEMP/upload-response.json" -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: $type" -H 'X-GitHub-Api-Version: 2022-11-28' \
              --data-binary @"$path" "https://uploads.github.com/repos/llhzx2018/vf-infra/releases/$rid/assets?name=$name")
            test "$code" = 201
            test "$(jq -r .name "$RUNNER_TEMP/upload-response.json")" = "$name"
            test "$(jq -r .size "$RUNNER_TEMP/upload-response.json")" = "$local_bytes"
            digest=$(jq -r '.digest // ""' "$RUNNER_TEMP/upload-response.json")
            if [[ -n "$digest" && "$digest" != null ]]; then test "$digest" = "sha256:$local_sha"; fi
            curl -fsS "${auth[@]}" "https://api.github.com/repos/llhzx2018/vf-infra/releases/$rid" > "$RUNNER_TEMP/release-current.json"
            echo "ASSET_UPLOADED=$name"
          }

          R="$RUNNER_TEMP/v253-release"
          upload_one "$ATOMIC_ASSET" 'application/zip' "$R/$ATOMIC_ASSET"
          upload_one "$UPDATE_ASSET" 'application/zip' "$R/$UPDATE_ASSET"
          upload_one 'PACKAGE_MANIFEST.json' 'application/json' "$R/PACKAGE_MANIFEST.json"
          upload_one 'SHA256SUMS.txt' 'text/plain' "$R/SHA256SUMS.txt"
          echo 'REST_ASSET_UPLOADS=PASS'

      - name: Stable Release readback with GitHub digest
        env:
          TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          auth=(-H "Authorization: Bearer $TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          sleep 12
          code=$(curl -sS -o "$RUNNER_TEMP/release-stable.json" -w '%{http_code}' "${auth[@]}" "https://api.github.com/repos/llhzx2018/vf-infra/releases/tags/$TAG")
          test "$code" = 200
          test "$(jq -r .tag_name "$RUNNER_TEMP/release-stable.json")" = "$TAG"
          test "$(jq -r .draft "$RUNNER_TEMP/release-stable.json")" = false
          test "$(jq -r .prerelease "$RUNNER_TEMP/release-stable.json")" = false
          for n in "$UPDATE_ASSET" "$ATOMIC_ASSET"; do
            test "$(jq -r --arg n "$n" '[.assets[]|select(.name==$n)]|length' "$RUNNER_TEMP/release-stable.json")" = 1
            test "$(jq -r --arg n "$n" '.assets[]|select(.name==$n)|.size' "$RUNNER_TEMP/release-stable.json")" = "$EXPECTED_BYTES"
            digest=$(jq -r --arg n "$n" '.assets[]|select(.name==$n)|.digest // ""' "$RUNNER_TEMP/release-stable.json")
            test "$digest" = "sha256:$EXPECTED_SHA256"
          done
          for n in PACKAGE_MANIFEST.json SHA256SUMS.txt; do
            test "$(jq -r --arg n "$n" '[.assets[]|select(.name==$n)]|length' "$RUNNER_TEMP/release-stable.json")" = 1
          done
          published=$(jq -r .published_at "$RUNNER_TEMP/release-stable.json")
          test -n "$published"; test "$published" != null
          printf '%s' "$published" > "$RUNNER_TEMP/released-at.txt"
          echo "FORMAL_RELEASED_AT=$published"
          echo 'STABLE_RELEASE_DIGEST_READBACK=PASS'

      - name: Unified read token must download exact UPDATE
        env:
          TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          auth=(-H "Authorization: Bearer $TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          code=$(curl -sS -o "$RUNNER_TEMP/read-release.json" -w '%{http_code}' "${auth[@]}" "https://api.github.com/repos/llhzx2018/vf-infra/releases/tags/$TAG")
          test "$code" = 200
          aid=$(jq -r --arg n "$UPDATE_ASSET" '.assets[]|select(.name==$n)|.id' "$RUNNER_TEMP/read-release.json" | head -1)
          aurl=$(jq -r --arg n "$UPDATE_ASSET" '.assets[]|select(.name==$n)|.url' "$RUNNER_TEMP/read-release.json" | head -1)
          test -n "$aid"; test -n "$aurl"
          dcode=$(curl -sS -L -o "$RUNNER_TEMP/read-update.zip" -w '%{http_code}' \
             -H "Authorization: Bearer $TOKEN" -H 'Accept: application/octet-stream' -H 'X-GitHub-Api-Version: 2022-11-28' "$aurl")
          test "$dcode" = 200
          test "$(stat -c%s "$RUNNER_TEMP/read-update.zip")" = "$EXPECTED_BYTES"
          test "$(sha256sum "$RUNNER_TEMP/read-update.zip"|awk '{print $1}')" = "$EXPECTED_SHA256"
          echo 'UNIFIED_READ_TOKEN_UPDATE_DOWNLOAD=PASS'

      - name: Publish core-updates only after Release and download PASS
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone -q "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/core-updates.git" core-updates
          cd core-updates; git checkout -q main
          released_at=$(cat "$RUNNER_TEMP/released-at.txt")
          python3 - "$released_at" > projects/P04.json <<'PY'
          import json,os,sys
          d={
            'schema_version':'1.0','project_id':'P04','component_id':'APP','enabled':True,
            'target_version':'2.5.3','update_type':'ATOMIC','from_versions':['2.5.2'],
            'schema_from':'14','schema_to':'14','repository':'llhzx2018/vf-infra','release_tag':'v2.5.3',
            'asset_name':'VF_Infra_V2.5.3_UPDATE.zip','asset_bytes':int(os.environ['EXPECTED_BYTES']),
            'asset_sha256':os.environ['EXPECTED_SHA256'],'backup_required':True,'rollback_supported':True,
            'released_at':sys.argv[1],'minimum_php':'8.0.0',
            'notes':'P04 V2.5.3 hotfix: Settings unified update trust, Maintenance/Atomic CSP UI, runtime cache invalidation and release cleanup.'
          }
          print(json.dumps(d,ensure_ascii=False,indent=2)+"\n",end='')
          PY
          git config user.name VictorForge; git config user.email llhzx2018@gmail.com
          if [[ -n "$(git status --porcelain -- projects/P04.json)" ]]; then
            git add projects/P04.json
            git commit -m 'release(P04): publish V2.5.3 hotfix manifest'
            git push -q origin main
          fi
          echo "CORE_UPDATES_P04_BLOB=$(git rev-parse HEAD:projects/P04.json)"
          echo 'CORE_UPDATES_P04_PUBLISH=PASS'

      - name: Final unified online discovery and main non-advancement
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          rauth=(-H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          mcode=$(curl -sS -o "$RUNNER_TEMP/p04-content.json" -w '%{http_code}' "${rauth[@]}" 'https://api.github.com/repos/llhzx2018/core-updates/contents/projects/P04.json?ref=main')
          test "$mcode" = 200
          jq -r .content "$RUNNER_TEMP/p04-content.json" | tr -d '\n' | base64 -d > "$RUNNER_TEMP/p04.json"
          python3 - "$RUNNER_TEMP/p04.json" <<'PY'
          import json,os,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d['target_version']=='2.5.3' and d['from_versions']==['2.5.2']
          assert d['release_tag']=='v2.5.3' and d['asset_name']=='VF_Infra_V2.5.3_UPDATE.zip'
          assert d['asset_bytes']==int(os.environ['EXPECTED_BYTES']) and d['asset_sha256']==os.environ['EXPECTED_SHA256']
          assert d['schema_from']=='14' and d['schema_to']=='14'
          PY
          wcode=$(curl -sS -o "$RUNNER_TEMP/main.json" -w '%{http_code}' -H "Authorization: Bearer $WRITE_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' 'https://api.github.com/repos/llhzx2018/vf-infra/branches/main')
          test "$wcode" = 200
          test "$(jq -r .commit.sha "$RUNNER_TEMP/main.json")" = bc23fcaca79f20f91f058b5de164a4a42c73bae6
          echo 'FINAL_ONLINE_DISCOVERY=PASS'
          echo 'PRODUCTION_MAIN_NON_ADVANCEMENT=PASS'

      - name: Cleanup
        if: always()
        run: rm -rf repo core-updates "$RUNNER_TEMP/v253-runtime" "$RUNNER_TEMP/v253-release" "$RUNNER_TEMP/v253-build.jsonl" "$RUNNER_TEMP"/*.json "$RUNNER_TEMP"/*.txt "$RUNNER_TEMP/read-update.zip"
