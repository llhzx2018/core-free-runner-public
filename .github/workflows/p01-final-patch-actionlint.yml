name: P01 Final Patch Actionlint

on:
  push:
    branches: [vf-agent-operations-v1]
    paths: ['.github/workflows/p01-final-patch-actionlint.yml']

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: vf-agent-operations-v1
      - name: Run actionlint
        shell: bash
        run: |
          set -euo pipefail
          VERSION=1.7.7
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_x86_64.tar.gz" -o /tmp/actionlint.tgz
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          /tmp/actionlint .github/workflows/p01-final-baseline-resolver-patch-v2.yml
