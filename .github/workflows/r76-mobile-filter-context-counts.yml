name: R76 Focused Mobile Filter Context Count Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r76-mobile-filter-context-counts.yml'

permissions:
  contents: read

jobs:
  r76-focused-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: 703331dc89acbfd0f62051a63ba6f1e0183d52d3
    steps:
      - name: Checkout exact private P01 candidate transiently
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: 703331dc89acbfd0f62051a63ba6f1e0183d52d3
          path: vf-start
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_sqlite,sqlite3,curl
          coverage: none

      - name: Exact source and focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd vf-start
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(cat VERSION)" = '2.47.0'
          node --check src/assets/workspace-rebaseline.js
          php -l tests/unit/mobile_filter_context_count_contract.php
          php tests/unit/mobile_filter_context_count_contract.php
          php tests/unit/sidebar_context_count_contract.php
          php tests/unit/tool_scene_recommended_sort_contract.php
          echo R76_MOBILE_FILTER_CONTEXT_COUNT_PASS
          echo R76_EXACT_CANDIDATE_GATE_PASS

      - name: Cleanup transient private source
        if: always()
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/vf-start"
