name: S01 Theme exact formal release
on:
  push:
    branches: [task/s01-ads-entry195-formal-20261026]
    paths: ['.github/workflows/s01-ads-entry195-20261026-formal.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.195
  TARGET_SHA: 4d44ac08dffe168f98cd78f78aa34cb6d65e750c
  TARGET_TREE: 15c25574fc9e80bcddb5dc45543f269d9f5f8db0
  BASE_SHA: a02c80efe12a65c0ee22ae87adfbd8130c735198
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - name: Formal identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-ads-entry195-20261026/formal-spec.json --input control/.github/workflows/s01-ads-entry195-20261026-formal.yml
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 4d44ac08dffe168f98cd78f78aa34cb6d65e750c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact candidate, merged tree and required evidence readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider candidate-proof
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40250908532 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40250908532 --jq .head_sha)" = 6aeaa82828fc7a35fa4b5c2ce936981807eddd65
          test "$(gh api repos/$TARGET_REPO/commits/main --jq .sha)" = "$TARGET_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$TARGET_SHA --jq .tree.sha)" = "$TARGET_TREE"
          gh run download 40250908532 --repo llhzx2018/core-free-runner-public --name s01-home-40250908532 --dir candidate-proof
          cmp candidate-proof/state-before.sha256 candidate-proof/state-after.sha256
          cmp candidate-proof/contracts-before.json candidate-proof/contracts-after.json
          python3 control/lanes/s01-ads-entry195-20261026/package.py
          python3 - <<'PYVERIFY'
          import json,pathlib,subprocess,urllib.parse
          r=pathlib.Path('candidate-proof')
          old=json.loads((r/'package.json').read_text());new=json.loads(pathlib.Path('proof/package.json').read_text())
          assert old['source']=='71432a1c439c80c89df296b9ca163c2ffb3b6d88'
          for phase in ['before','after','smoke']:
              result=json.loads((r/('ads-entry-'+phase+'.json')).read_text())
              assert result['status']=='PASS' and result['rows']==2
          assert (r/'ads-read-before.sha256').read_bytes()==(r/'ads-read-after.sha256').read_bytes()
          read=json.loads((r/'ads-entry-read.json').read_text());write=json.loads((r/'ads-entry-write.json').read_text())
          assert read['status']=='PASS' and read['errors']==[] and read['cleanSave']=='HIDDEN'
          assert write['status']=='PASS' and write['errors']==[]
          for key in ['dirtyDiscard','ajaxSaveReload','nativeNoJS']:assert write[key]=='PASS',key
          assert write['staleRevision']=='409_REJECTED_INPUT_RETAINED'
          assert write['nonce']=='403_REJECTED' and write['permission']=='403_REJECTED' and write['networkError']=='INPUT_RETAINED'
          assert write['finalDesktop']=='RESTORED_OFF' and write['publicSidebar']=='300x250_ZH_EN_SYNTHETIC'
          for name in ['ads-entry-clean-1440.png','ads-entry-clean-1024.png','ads-entry-public-ready-zh.png','ads-entry-public-ready-en.png']:assert (r/name).stat().st_size>1000
          assert json.loads((r/'clean-install.json').read_text())['status']=='PASS'
          assert json.loads((r/'bootstrap.json').read_text())['status']=='PASS'
          for k in ['status','version','tree','sha256','bytes','files']: assert old[k]==new[k],k
          assert new['sha256']=='d57e868c7810cd4aa3c323dd32b99838f56e8e19ac8a214fa124fd6a3f5c1cb6' and new['bytes']==2000892
          coverage=json.loads(pathlib.Path('control/lanes/s01-ads-entry195-20261026/release-authority.json').read_text())
          assert set(coverage['required'])=={'TESTING','GIT','UA_UI','SEO','SECURITY','INSTALL','UPGRADE','DATA_SCHEMA','PERFORMANCE'}
          assert coverage['source']=='71432a1c439c80c89df296b9ca163c2ffb3b6d88' and coverage['tree']=='15c25574fc9e80bcddb5dc45543f269d9f5f8db0'
          assert coverage['owner_preview_runtime']=='N_A'
          assert coverage['release_mode']=='PROJECT_PREVIEW_N_A'
          assert coverage['owner_real_use']=='POST_PRODUCTION_REQUIRED'
          assert coverage['production_auto_apply'] is False
          for item in coverage['required'].values():
              assert item['sha'] and item['acceptance']
              endpoint='repos/llhzx2018/gov-doc/contents/'+urllib.parse.quote(item['path'],safe='/')+'?ref=main'
              live=json.loads(subprocess.check_output(['gh','api',endpoint]))
              assert live['sha']==item['sha'],item['path']
              item['evidence_status']='PASS_EXACT_CANDIDATE_MACHINE'
          coverage['candidate_run']='40250908532'
          coverage['merged_source']='4d44ac08dffe168f98cd78f78aa34cb6d65e750c'
          coverage['formal_release_gate']='PASS'
          coverage['production_effect']='NOT_PROVEN_POST_MANUAL_UPGRADE_READBACK_REQUIRED'
          pathlib.Path('proof/public-authority-coverage.json').write_text(json.dumps(coverage,ensure_ascii=False,indent=2))
          print('MERGED_TREE_EQUALS_TESTED_TREE_AND_EXACT_PACKAGE_PASS')
          PYVERIFY
      - name: Publish only the exact verified package
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.35.195 --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create v1.35.195 provider/vf-tools-theme_V1.35.195.zip --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Theme V1.35.195' --notes '修复广告设置入口不可达：旧ads链接恢复进入页面布局的广告子视图，页面总览及指南布局有可见入口并可直达侧栏。保持8个主能力页，不加主菜单；位置、页型、设备同页呈现，Dirty保存与放弃可用。复用现有主题广告权限、nonce、revision和保存回读事务，不改变Ops商业广告数据。真实WordPress浏览器入口发现、只读打开、保存刷新、冲突/网络失败输入保留、无JS提交和权限/nonce拒绝、双语300x250合成侧栏、公开页面保持、干净安装、194升级195/回退/重复安装及生命周期数据保护通过。476运行文件。Production由Owner手工升级，真实投放与Owner最终验收待完成，手机暂缓。' --latest
          fi
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/v1.35.195 --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh release view v1.35.195 --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - name: Authenticated remote ZIP byte comparison
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download v1.35.195 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.195.zip --dir remote
          cmp provider/vf-tools-theme_V1.35.195.zip remote/vf-tools-theme_V1.35.195.zip
          echo 'd57e868c7810cd4aa3c323dd32b99838f56e8e19ac8a214fa124fd6a3f5c1cb6  remote/vf-tools-theme_V1.35.195.zip' | sha256sum -c
          test "$(stat -c %s remote/vf-tools-theme_V1.35.195.zip)" = 2000892
          gh release view v1.35.195 --repo "$TARGET_REPO" --json url,publishedAt,tagName > proof/formal-release.json
          echo FORMAL_RELEASE_EXACT_REMOTE_ASSET_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-home-formal-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target provider remote candidate-proof
