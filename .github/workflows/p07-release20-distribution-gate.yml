name: P07 Release20 Distribution Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'installers/p07.sh'
      - 'installers/p07-final.sh'
      - 'installers/p07-toolbox.sh'
      - 'dist/p07/0.1.0/overlay/**'
      - '.github/workflows/p07-release20-distribution-gate.yml'

permissions:
  contents: read

jobs:
  distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Release20 identity
        run: |
          set -Eeuo pipefail
          root='dist/p07/0.1.0/overlay'
          test "$(cat "$root/BUILD_ID")" = '0.1.0-release20'
          grep -Fq 'EXPECTED_BUILD_ID="0.1.0-release20"' installers/p07-final.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release20"' installers/p07-toolbox.sh
          grep -Fq 'RUNTIME_MANIFEST_BLOB="0b5de474284a2ee5f52030736ab64c0a0e07182a"' installers/p07-final.sh
          grep -Fq 'EXPECTED_BLOB="c94e9abad001d9724f31f435265691257801cff6"' installers/p07.sh
          grep -Fq '## Restore-As Guarded Nginx Reload Contract' "$root/docs/authority/RPD.md"
          grep -Fq '| B52 | Restore-As Systemd-first Nginx Reload |' "$root/docs/authority/ACCEPTANCE_MATRIX.md"

      - name: Exact overlay and runtime manifests
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('dist/p07/0.1.0/overlay')
          def blob(path: Path) -> str:
              data=path.read_bytes()
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          for name in ('RUNTIME.gitblob','MANIFEST.gitblob'):
              seen=set()
              for line in (root/name).read_text(encoding='utf-8').splitlines():
                  if not line.strip():
                      continue
                  expected, rel=line.split('  ',1)
                  assert rel not in seen, (name, rel)
                  seen.add(rel)
                  path=root/rel
                  assert path.is_file(), (name, rel)
                  assert blob(path)==expected, (name, rel, blob(path), expected)
          runtime=(root/'RUNTIME.gitblob').read_text(encoding='utf-8')
          required={
              'BUILD_ID':'72a6e35162bf59e84aaccd4236a189d61b85a0fd',
              'lib/restore_as_verified.py':'be3f76938e7102fdd637d10c2c231173bd61ce23',
              'lib/restore_failure_ui.sh':'688c4d0d67824098e220a086d3e023ab82a3d3af',
          }
          for rel, expected in required.items():
              assert f'{expected}  {rel}' in runtime, rel
          PY

      - name: Release20 systemd-first reload contract
        run: |
          set -Eeuo pipefail
          root='dist/p07/0.1.0/overlay'
          grep -Fq 'def _systemd_nginx_active' "$root/lib/restore_as_verified.py"
          grep -Fq '[nginx, "-t"]' "$root/lib/restore_as_verified.py"
          grep -Fq '[systemctl, "is-active", "nginx"]' "$root/lib/restore_as_verified.py"
          grep -Fq '[systemctl, "reload", "nginx"]' "$root/lib/restore_as_verified.py"
          grep -Fq '[nginx, "-s", "reload"]' "$root/lib/restore_as_verified.py"
          grep -Fq 'mode=SYSTEMD' "$root/lib/restore_as_verified.py"
          grep -Fq 'mode=DIRECT_SIGNAL' "$root/lib/restore_as_verified.py"
          grep -Fq 'nginx_reload' "$root/lib/restore_as_verified.py"

      - name: Syntax and compile
        run: |
          set -Eeuo pipefail
          root='dist/p07/0.1.0/overlay'
          bash -n "$root/bin/vfops-site-ui"
          bash -n "$root/lib/restore_failure_ui.sh"
          python3 -m py_compile             "$root/lib/restore_as_verified.py"             "$root/lib/restore_as.py"             "$root/lib/restore_apply_core.py"             "$root/lib/verify.py"

      - name: Public overlay release20 regressions
        run: |
          set -Eeuo pipefail
          cd dist/p07/0.1.0/overlay
          export PYTHONPATH="$PWD/lib"
          python3 -m unittest -q             tests.test_restore_as_verified             tests.test_release16_restore_as_sqlite             tests.test_restore_as             tests.test_p07_integration_manifest             tests.test_terminal_ui_color_contract             tests.test_user_entry

      - name: Systemd reload behavior
        run: |
          set -Eeuo pipefail
          root='dist/p07/0.1.0/overlay'
          export PYTHONPATH="$PWD/$root/lib"
          python3 - <<'PY'
          import subprocess
          from unittest import mock
          import restore_as_verified as r

          calls=[
              subprocess.CompletedProcess([],0,stdout='',stderr=''),
              subprocess.CompletedProcess([],0,stdout='active\n',stderr=''),
              subprocess.CompletedProcess([],0,stdout='',stderr=''),
          ]
          with mock.patch.object(r,'_run',side_effect=calls) as run:
              mode=r._reload_nginx('/usr/sbin/nginx',systemctl='/usr/bin/systemctl')
          assert mode=='SYSTEMD'
          assert run.call_args_list[0].args[0]==['/usr/sbin/nginx','-t']
          assert run.call_args_list[1].args[0]==['/usr/bin/systemctl','is-active','nginx']
          assert run.call_args_list[2].args[0]==['/usr/bin/systemctl','reload','nginx']

          fallback=[
              subprocess.CompletedProcess([],0,stdout='',stderr=''),
              subprocess.CompletedProcess([],3,stdout='inactive\n',stderr=''),
              subprocess.CompletedProcess([],0,stdout='',stderr=''),
          ]
          with mock.patch.object(r,'_run',side_effect=fallback) as run:
              mode=r._reload_nginx('/usr/sbin/nginx',systemctl='/usr/bin/systemctl')
          assert mode=='DIRECT_SIGNAL'
          assert run.call_args_list[2].args[0]==['/usr/sbin/nginx','-s','reload']
          PY

      - name: Isolated current-runtime install
        run: |
          set -Eeuo pipefail
          root="$PWD"
          tmp="$(mktemp -d)"
          export P07_PUBLIC_ROOT="file://$root"
          export P07_INSTALL_DIR="$tmp/install"
          export P07_PREVIOUS_DIR="$tmp/previous"
          export P07_BIN_LINK="$tmp/vfops"
          export P07_ALLOW_NONROOT=1
          export P07_NO_EXEC=1

          bash installers/p07-final.sh >"$tmp/install.log"
          test "$("$tmp/vfops" --version)" = 'VF Server Ops 0.1.0'
          test "$("$tmp/vfops" --build-id)" = '0.1.0-release20'
          grep -Fq 'lib/restore_as_verified.py' "$tmp/install/.runtime-manifest.gitblob"
          grep -Fq 'lib/restore_failure_ui.sh' "$tmp/install/.runtime-manifest.gitblob"

          bash installers/p07-final.sh >"$tmp/second.log"
          grep -Fq '已是当前版本，无需下载或重复安装' "$tmp/second.log"

      - name: Safety boundary
        run: |
          set -Eeuo pipefail
          root='dist/p07/0.1.0/overlay'
          ! grep -R -n -E '(PRIVATE KEY|BEGIN OPENSSH|ghp_[A-Za-z0-9]|github_pat_)' "$root/bin" "$root/lib" installers/p07*.sh
          ! grep -R -n -E '(^|[^A-Za-z])(rm[[:space:]]+-rf[[:space:]]+/($|[[:space:]]))' installers/p07*.sh "$root/bin" "$root/lib"
          grep -Fq 'cleanup_database' "$root/lib/restore_as_verified.py"
          grep -Fq 'cleanup_site' "$root/lib/restore_as_verified.py"
          grep -Fq 'DNS 没有修改，原网站没有修改。' "$root/lib/restore_failure_ui.sh"

      - name: Result
        if: always()
        run: |
          echo 'P07_RELEASE20_DISTRIBUTION_GATE=COMPLETE'
          echo 'P07_PRODUCTION_WRITE=NOT_RUN'
