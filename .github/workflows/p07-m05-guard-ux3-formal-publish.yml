# Owner 2026-11-14 explicit one-module Formal Release: only P07-M05 新服务器初始化.
# PREVIEW PR: verify exact bytes; MAIN squash merge: publish and remotely read back.
# Private source checked out in ephemeral Github runner only. No Production/Owner VPS.
name: P07-M05 guard-ux3 standalone Formal Release
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/p07-m05-guard-ux3-formal-publish.yml]
  push:
    branches: [main]
    paths: [.github/workflows/p07-m05-guard-ux3-formal-publish.yml]
permissions:
  contents: read
jobs:
  exact-m05-formal:
    if: github.repository == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      NO_COLOR: '1'
      P07_M05_EXACT_SOURCE: 8e9a9dd61e81024034f47ba2e59910c0564ff457
      P07_M05_NEW_BUILD: 0.1.0-m05-db-first-guard-ux3
      P07_M05_NEW_SHA256: a5d5ccb77aa3c9dd5120fa112fbb73c6701877f0c2200a9f4f9da79ebb1faf29
      P07_M05_RELEASE_TAG: p07-m05-v0.1.0-guard-ux3-20261114
      P07_M05_ASSET_NAME: P07-M05-0.1.0-m05-db-first-guard-ux3.zip
    steps:
      - name: Checkout PRIVATE P07 exact merged source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 8e9a9dd61e81024034f47ba2e59910c0564ff457
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product
      - name: Release source guard, reproducible standalone ZIP, safe contents and exact SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$P07_M05_EXACT_SOURCE"
          test "$(cat product/VERSION)" = 0.1.0
          test "$(grep -E '^BUILD_ID = ' product/scripts/build_p07_m05_bundle.py)" = "BUILD_ID = \"$P07_M05_NEW_BUILD\""
          mkdir -p "$RUNNER_TEMP/p07-m05-release"
          python3 -B product/scripts/build_p07_m05_bundle.py --output "$RUNNER_TEMP/p07-m05-release/$P07_M05_ASSET_NAME" >/dev/null
          python3 -B product/scripts/build_p07_m05_bundle.py --output "$RUNNER_TEMP/p07-m05-release/second.zip" >/dev/null
          cmp "$RUNNER_TEMP/p07-m05-release/$P07_M05_ASSET_NAME" "$RUNNER_TEMP/p07-m05-release/second.zip"
          echo "$P07_M05_NEW_SHA256  $RUNNER_TEMP/p07-m05-release/$P07_M05_ASSET_NAME" | sha256sum -c - >/dev/null
          rm -f "$RUNNER_TEMP/p07-m05-release/second.zip"
          python3 - "$RUNNER_TEMP/p07-m05-release/$P07_M05_ASSET_NAME" <<'PY'
          import hashlib,json,os,pathlib,stat,sys,zipfile
          file=pathlib.Path(sys.argv[1])
          with zipfile.ZipFile(file) as z:
              infos=z.infolist()
              names=[i.filename for i in infos]
              assert len(names)==90 and len(set(names))==90
              assert "p07-m05/MODULE_MANIFEST.json" in names
              guard=z.read("p07-m05/lib/m05_environment_guard.py")
              assert b"5355" in guard and b"systemd-resolved.service" in guard and b"MainPID" in guard
              for i in infos:
                  p=pathlib.PurePosixPath(i.filename)
                  assert not p.is_absolute() and ".." not in p.parts
                  assert p.parts[0]=="p07-m05" and len(p.parts)>=2
                  assert not i.is_dir() and (i.external_attr >> 16 & 0o170000) != stat.S_IFLNK
                  assert not any(k in p.parts for k in (".git",".github",".env","__pycache__"))
                  assert not p.name.endswith((".pyc",".pem",".key"))
                  raw=z.read(i)
                  assert b"-----BEGIN PRIVATE KEY-----" not in raw
                  assert b"-----BEGIN RSA PRIVATE KEY-----" not in raw
                  assert b"PRIVATE DATA - BEGIN" not in raw
              manifest=json.loads(z.read("p07-m05/MODULE_MANIFEST.json"))
              assert manifest["build_id"]==os.environ["P07_M05_NEW_BUILD"]
          assert hashlib.sha256(file.read_bytes()).hexdigest()==os.environ["P07_M05_NEW_SHA256"]
          print("P07_M05_FORMAL_PACKAGE_SENSITIVE_CONTENT_AND_MANIFEST=PASS")
          print("P07_M05_FORMAL_EXACT_ZIP_BYTES=PASS")
          PY
      - name: Reuse independently executed required KVM and old-official-upgrade proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          for run in 43561686491 43562337442; do
            test "$(gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$run" --jq '.conclusion')" = success || exit 78
          done
          old_url='https://github.com/llhzx2018/core-free-runner-public/releases/download/p07-v0.1.0-five-modules-ux4-20261114/P07-M05-0.1.0-m05-db-first-ux2.zip'
          curl --proto '=https' --tlsv1.2 -fsSL --retry 2 --max-time 90 "$old_url" -o "$RUNNER_TEMP/p07-m05-release/previous.zip"
          echo "4e7e95103ccf68724f16297444fd2c0b36391443fc85d076b6a0aa8731c2dd6c  $RUNNER_TEMP/p07-m05-release/previous.zip" | sha256sum -c - >/dev/null
          rm -f "$RUNNER_TEMP/p07-m05-release/previous.zip"
          echo P07_M05_PREVIOUS_OFFICIAL_SOURCE_AND_BYTES=VERIFIED
          echo P07_M05_KVM_DEBIAN13_CLOUDPANEL_MARIADB118_ADMIN=EXACT_SOURCE_PASS
          echo P07_M05_OFFICIAL_UX2_TO_GUARD_UX3_ATOMIC_AND_ROLLBACK=EXACT_SOURCE_PASS
          echo P07_M01_M02_M03_M04_UNCHANGED=YES
      - name: Build immutable release manifest and checksum file
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          root=Path(os.environ["RUNNER_TEMP"])/"p07-m05-release"
          name=os.environ["P07_M05_ASSET_NAME"]
          digest=os.environ["P07_M05_NEW_SHA256"]
          assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest
          evidence={
            "schema":"p07.m05.standalone.formal-release.v1",
            "module":"P07-M05 新服务器初始化",
            "build":os.environ["P07_M05_NEW_BUILD"],
            "source_repo":"llhzx2018/vf-server-ops",
            "source_commit":os.environ["P07_M05_EXACT_SOURCE"],
            "tag":os.environ["P07_M05_RELEASE_TAG"],
            "asset":name,
            "sha256":digest,
            "from_previous_formal":"0.1.0-m05-db-first-ux2",
            "proof_old_to_new_rollback":"https://github.com/llhzx2018/core-free-runner-public/actions/runs/43561686491",
            "proof_debian13_kvm_mariadb118":"https://github.com/llhzx2018/core-free-runner-public/actions/runs/43562337442",
            "other_modules":"UNTOUCHED",
            "owner_vps":"NOT_RUN",
            "production":"OWNER_MANUAL_ONLY",
            "dns":"UNTOUCHED",
            "migration":"NOT_RUN",
          }
          manifest=root/"P07-M05-GUARD-UX3-RELEASE.json"
          manifest.write_text(json.dumps(evidence,ensure_ascii=False,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          (root/"SHA256SUMS").write_text(
            f"{digest}  {name}\n"+
            f"{hashlib.sha256(manifest.read_bytes()).hexdigest()}  {manifest.name}\n",
            encoding="utf-8")
          print("P07_M05_RELEASE_MANIFEST_SHA256=PASS")
          PY
          (cd "$RUNNER_TEMP/p07-m05-release" && sha256sum -c SHA256SUMS)
      - name: Publish PRIVATE source tag and PUBLIC M05-only Release assets on exact authorized main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'P07 M05 guard-ux3 formal publish')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN" || { echo P07_M05_RELEASE_WRITE_CAPABILITY_MISSING; exit 78; }
          p='llhzx2018/vf-server-ops'
          r='llhzx2018/core-free-runner-public'
          tag="$P07_M05_RELEASE_TAG"
          src="$P07_M05_EXACT_SOURCE"
          test "$(gh api "repos/$p/git/ref/heads/main" --jq '.object.sha')" = "$src" || { echo P07_M05_SOURCE_DRIFT; exit 78; }
          test "$(gh api "repos/$r/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA" || { echo P07_M05_PUBLIC_MAIN_DRIFT; exit 78; }
          if gh release view "$tag" -R "$p" >/dev/null 2>&1; then
            test "$(gh api "repos/$p/git/ref/tags/$tag" --jq '.object.sha')" = "$src" || exit 81
          else
            if gh api "repos/$p/git/ref/tags/$tag" >/dev/null 2>&1; then exit 81; fi
            gh release create "$tag" -R "$p" --target "$src" \
              --title 'P07-M05 新服务器初始化 · guard-ux3 正式源码' \
              --notes 'Owner 2026-11-14 授权 M05 单模块正式发行。源码 exact merge 8e9a9dd6；Debian13 CloudPanel/MariaDB11.8 首次安装 KVM 真实 PASS；官方旧版升级/回滚 PASS。M01-M04 不动；Production 只由 Owner 手工操作。'
          fi
          if gh release view "$tag" -R "$r" >/dev/null 2>&1; then
            test "$(gh api "repos/$r/git/ref/tags/$tag" --jq '.object.sha')" = "$GITHUB_SHA" || exit 81
            test "$(gh api "repos/$r/releases/tags/$tag" --jq '.assets|length')" = 3 || exit 81
          else
            if gh api "repos/$r/git/ref/tags/$tag" >/dev/null 2>&1; then exit 81; fi
            gh release create "$tag" -R "$r" --target "$GITHUB_SHA" \
              --title 'P07-M05 新服务器初始化 · guard-ux3 正式独立更新' \
              --notes '仅 M05 ZIP、SHA256SUMS 与来源/机器证据清单。支持从当前正式 db-first-ux2 独立 Atomic 升级与回滚；M01-M04、网站、数据库、DNS、Production 均不自动操作。'
            gh release upload "$tag" -R "$r" \
              "$RUNNER_TEMP/p07-m05-release/$P07_M05_ASSET_NAME" \
              "$RUNNER_TEMP/p07-m05-release/P07-M05-GUARD-UX3-RELEASE.json" \
              "$RUNNER_TEMP/p07-m05-release/SHA256SUMS"
          fi
          dir="$(mktemp -d -t p07-m05-published.XXXXXXXX)"
          trap 'rm -rf -- "$dir"' EXIT
          gh release download "$tag" -R "$r" --dir "$dir"
          (cd "$dir" && sha256sum -c SHA256SUMS)
          cmp "$dir/$P07_M05_ASSET_NAME" "$RUNNER_TEMP/p07-m05-release/$P07_M05_ASSET_NAME"
          cmp "$dir/P07-M05-GUARD-UX3-RELEASE.json" "$RUNNER_TEMP/p07-m05-release/P07-M05-GUARD-UX3-RELEASE.json"
          test "$(gh api "repos/$p/git/ref/tags/$tag" --jq '.object.sha')" = "$src"
          test "$(gh api "repos/$r/releases/tags/$tag" --jq '.assets|length')" = 3
          echo P07_M05_SOURCE_TAG_AND_PUBLIC_RELEASE_REMOTE_BYTES_SHA256=PASS
          echo P07_M05_FORMAL_RELEASE=PASS
          echo P07_M01_M02_M03_M04_UNTOUCHED=YES
          echo P07_OWNER_VPS_PRODUCTION_DNS_MIGRATION=NOT_RUN
      - name: Securely destroy temporary private checkout and unsent packages
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- product "$RUNNER_TEMP/p07-m05-release"
          echo P07_M05_PRIVATE_CHECKOUT_AND_TEMP_PACKAGES_CLEANUP=YES
          echo P07_OWNER_VPS_PRODUCTION_DNS_MIGRATION=NOT_RUN
