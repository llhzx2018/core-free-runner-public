name: P01 fresh FULL old private full-tree escrow and new Laravel import
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  fresh-full-direct-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PRODUCT_SHA: 44b1c051f982a3e0d17b1f7e6b1d818e4f8ec842
      OLD_RELEASE_SHA256: 5ee0c031dda82c53353929dc4519b0cc1b647b2af82a1bcd8a27a03ab7866778
    steps:
      - name: Checkout exact private product source into temporary workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 44b1c051f982a3e0d17b1f7e6b1d818e4f8ec842
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: candidate
      - name: Checkout current shared architecture authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov-doc
      - name: Enforce one-off scope exact source and PHP/Python syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "$GITHUB_HEAD_REF" = "test/p01-fresh-full-icons-20261118"
          test "$(git -C candidate rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(cat candidate/VERSION)" = 2.47.517
          test "$(cat candidate/src/VERSION.txt)" = 2.47.517
          python3 -B - <<'PY'
          import ast
          from pathlib import Path
          names=[
            "tests/compatibility/laravel/http/run_d67_official_to_laravel_https.py",
            "tests/compatibility/laravel/run_d65_official_v515_full_restore.py",
            "scripts/build_p01_next_clean_full.py",
            "scripts/build_p01_next_cloudpanel_full.py",
          ]
          for name in names:ast.parse((Path("candidate")/name).read_text())
          PY
          echo P01_FRESH_FULL_EXACT_PRIVATE_SHA_AND_PYTHON=PASS
      - name: Install isolated native php sqlite nginx fpm and build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq > "$RUNNER_TEMP/p01-fresh-apt.txt" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nginx php8.3-fpm php8.3-cli php8.3-sqlite3 php8.3-mysql php8.3-mbstring php8.3-curl php8.3-xml php8.3-zip php8.3-gd php8.3-intl composer openssl unzip >> "$RUNNER_TEMP/p01-fresh-apt.txt" 2>&1
          php8.3 -l candidate/src/app/next/runtime/FreshFullImportPreflight.php
          php8.3 -l candidate/src/app/next/runtime/FreshFullPrivateEscrow.php
          php8.3 -l candidate/src/app/next/runtime/FreshFullPortableBundle.php
          php8.3 -l candidate/src/app/next/runtime/FreshFullOwnerProtectedIntake.php
          php8.3 -l candidate/src/app/next/bin/owner-intake-offline.php
          php8.3 -l candidate/src/app/next/runtime/FreshFullOwnerOfflineSnapshot.php
          php8.3 -l candidate/src/app/next/runtime/FreshFullReleaseMigrationLedger.php >/dev/null
          php8.3 -l candidate/src/app/next/runtime/OfficialV247515MigrationProvenance.php >/dev/null
          php8.3 -l candidate/src/app/next/runtime/FreshFullOfflineConversion.php >/dev/null
          php8.3 -l candidate/src/app/next/runtime/FreshFullSealedSiteStage.php >/dev/null
          php8.3 -l candidate/src/app/next/runtime/MajorOfflineSealedStageMethods.php >/dev/null
          php8.3 -l candidate/tests/compatibility/laravel/run_d67_seal_official_old_clone.php >/dev/null
          php8.3 -l candidate/src/app/next/bin/owner-intake-offline.php >/dev/null
          php8.3 -l candidate/src/app/next/runtime/FreshFullImportPreflight.php >/dev/null
          php8.3 -l candidate/tests/compatibility/laravel/run_d66_official_release_to_future_clone.php >/dev/null
          php8.3 -l candidate/src/app/next/runtime/FreshFullSourceExporter.php
          php8.3 -l candidate/src/app/next/runtime/FreshFullSourceWriterFence.php
          php8.3 -l candidate/src/app/next/bin/owner-export-offline.php
          php8.3 -l candidate/tests/compatibility/laravel/run_fresh_full_source_export.php
          php8.3 -l candidate/tests/compatibility/laravel/run_fresh_full_owner_offline_snapshot.php
          php8.3 -l candidate/tests/compatibility/laravel/run_fresh_full_portable_bundle.php
          php8.3 -l candidate/src/app/next/runtime/CloudPanelDomainRebinding.php
          php8.3 -l candidate/src/app/next/runtime/FreshFullPortableBundle.php >/dev/null
          php8.3 -l candidate/src/app/next/runtime/FreshFullOwnerProtectedIntake.php >/dev/null
          php8.3 -l candidate/src/app/next/bin/owner-intake-offline.php >/dev/null
          php8.3 -l candidate/tests/compatibility/laravel/run_fresh_full_portable_bundle.php >/dev/null
          php8.3 -l candidate/tests/compatibility/laravel/run_fresh_full_old_private_escrow.php
          php8.3 -l candidate/tests/compatibility/laravel/run_d67_seal_official_old_clone.php
          php8.3 -l candidate/src/app/next/runtime/LegacyV247515SnapshotAudit.php
          echo P01_FRESH_FULL_NATIVE_PHP_PDO_SQLITE_SYNTAX=PASS
      - name: Real source Git diff naming architecture and negatives
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B candidate/.github/checks/test_architecture_gate.py > "$RUNNER_TEMP/p01-fresh-arch-neg.txt" 2>&1
          python3 -B candidate/.github/checks/architecture_gate.py --manifest candidate/.github/checks/code_architecture.json --gov-root gov-doc --base-sha c377dc3e0696585b207561081f6dc462108c904f --head-sha "$PRODUCT_SHA" --git-root candidate > "$RUNNER_TEMP/p01-fresh-arch.txt" 2>&1 || {
            grep -E 'PROJECT_ARCHITECTURE=|Error|FAIL' "$RUNNER_TEMP/p01-fresh-arch.txt" | head -n 8 || true
            exit 1
          }
          grep -F 'PROJECT_ARCHITECTURE=STRUCTURAL_PASS' "$RUNNER_TEMP/p01-fresh-arch.txt" >/dev/null
          echo P01_FRESH_FULL_ACTUAL_DIFF_ARCHITECTURE_NAMING=PASS
      - name: Targeted latest HEAD FULL missing-dependency negative tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B -m unittest discover -s candidate/tests/architecture -p test_p01_next_full_bundle.py >"$RUNNER_TEMP/p01-fresh-bundle-negatives.txt" 2>&1 || {
            grep -E '(^FAIL|^ERROR|AssertionError|RuntimeError|ModuleNotFound)' "$RUNNER_TEMP/p01-fresh-bundle-negatives.txt" | head -n 20 || true
            exit 1
          }
          php8.3 -l candidate/src/app/next/runtime/CloudPanelCleanFullPreflight.php >/dev/null
          echo P01_V517_LATEST_FULL_SOURCE_DEPENDENCIES_AND_NEGATIVES=PASS
      - name: Verify original GitHub v515 FULL identity
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -m 700 "$RUNNER_TEMP/p01-old-full"
          gh release download v2.47.515 --repo llhzx2018/vf-start --pattern VF-Start-V2.47.515-FULL.zip --dir "$RUNNER_TEMP/p01-old-full" > "$RUNNER_TEMP/p01-old-download.txt" 2>&1
          asset="$RUNNER_TEMP/p01-old-full/VF-Start-V2.47.515-FULL.zip"
          test "$(stat -c '%s' "$asset")" = 1802482
          test "$(sha256sum "$asset" | cut -d' ' -f1)" = "$OLD_RELEASE_SHA256"
          echo P01_FRESH_FULL_OLD_OFFICIAL_BYTES_IMMUTABLE=PASS
      - name: Build exact-source self-contained new Laravel FULL
        shell: bash
        run: |
          set -Eeuo pipefail
          (cd candidate && python3 -B scripts/build_p01_next_clean_full.py build --source-sha "$PRODUCT_SHA" --output "$RUNNER_TEMP/p01-fresh-clean.zip" --composer composer > "$RUNNER_TEMP/p01-fresh-build.txt" 2>&1)
          python3 -B candidate/scripts/build_p01_next_clean_full.py verify --zip "$RUNNER_TEMP/p01-fresh-clean.zip" > "$RUNNER_TEMP/p01-fresh-build-verify.txt" 2>&1
          python3 -B candidate/scripts/build_p01_next_cloudpanel_full.py build --source-zip "$RUNNER_TEMP/p01-fresh-clean.zip" --output "$RUNNER_TEMP/p01-fresh-cloudpanel.zip" > "$RUNNER_TEMP/p01-fresh-layout.txt" 2>&1
          python3 -B candidate/scripts/build_p01_next_cloudpanel_full.py verify --zip "$RUNNER_TEMP/p01-fresh-cloudpanel.zip" > "$RUNNER_TEMP/p01-fresh-layout-verify.txt" 2>&1
          test -s "$RUNNER_TEMP/p01-fresh-cloudpanel.zip"
          echo P01_FRESH_FULL_REAL_EXACT_COMPOSER_VITE_CLOUDPANEL_BUNDLE=PASS
      - name: Build checkout-only original v515 to native Laravel migration dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          composer install --working-dir=candidate/src/app/next --no-dev --prefer-dist --no-interaction --no-progress --no-scripts --no-plugins > "$RUNNER_TEMP/p01-fresh-converter-composer.txt" 2>&1
          test -f candidate/src/app/next/vendor/autoload.php
          echo P01_FRESH_FULL_CONVERSION_NATIVE_DEPENDENCIES=PASS
      - name: Genuine installed v515 clone to fresh new FULL Owner HTTPS and no-overwrite proof
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! P01_D65_OFFICIAL_ASSET_ISOLATED=YES python3 -B candidate/tests/compatibility/laravel/run_d65_official_v515_full_restore.py --release-full "$RUNNER_TEMP/p01-old-full/VF-Start-V2.47.515-FULL.zip" --candidate-root candidate --future-bundle "$RUNNER_TEMP/p01-fresh-cloudpanel.zip" --fresh-site-only > "$RUNNER_TEMP/p01-fresh-results.txt" 2>&1; then
            grep -E '^P01_(D65|FRESH_FULL|FRESH_OWNER|FRESH_SOURCE|FRESH_PORTABLE)_[A-Z0-9_]+=' "$RUNNER_TEMP/p01-fresh-results.txt" | tail -n 20 || true
            exit 1
          fi
          grep -Fx 'P01_FRESH_FULL_INDEPENDENT_HTTPS_OLD_OWNER_AND_PRIVATE_DATA=PASS' "$RUNNER_TEMP/p01-fresh-results.txt"
          grep -Fx 'P01_FRESH_FULL_MULTIPLE_USER_ICONS_ACTIVE=PASS' "$RUNNER_TEMP/p01-fresh-results.txt"
          grep -Fx 'P01_FRESH_FULL_OLD_ALL_PRIVATE_FILES_INCLUDING_UNKNOWN=PASS' "$RUNNER_TEMP/p01-fresh-results.txt"
          grep -Fx 'P01_FRESH_FULL_OLD_PRIVATE_MANIFEST_SHA_AND_NO_REPLAY=PASS' "$RUNNER_TEMP/p01-fresh-results.txt"
          grep -Fx 'P01_FRESH_SOURCE_REAL_OFFICIAL_WRITER_FENCE_CONTENDS=PASS' "$RUNNER_TEMP/p01-fresh-results.txt"
          grep -Fx 'P01_FRESH_SOURCE_WRITER_FENCE_RELEASE_RESTORES_ACCESS=PASS' "$RUNNER_TEMP/p01-fresh-results.txt"
          grep -Fx 'P01_FRESH_SOURCE_OFFICIAL_LOCAL_LEDGER_DRIFT_DENIED=PASS' "$RUNNER_TEMP/p01-fresh-results.txt"
          grep -Fx 'P01_FRESH_SOURCE_ONE_COMMAND_FROM_OFFICIAL_V515=PASS' "$RUNNER_TEMP/p01-fresh-results.txt"
          grep -Fx 'P01_FRESH_SOURCE_SQLITE_UNKNOWN_PRIVATE_AND_SOURCE_SHA=PASS' "$RUNNER_TEMP/p01-fresh-results.txt"
          grep -Fx 'P01_FRESH_SOURCE_BAD_ROOT_AND_REPLAY_DENIED=PASS' "$RUNNER_TEMP/p01-fresh-results.txt"
          grep -Fx 'P01_FRESH_SOURCE_OLD_OWNER_DB_CONFIG_AND_UNKNOWN_UNCHANGED=PASS' "$RUNNER_TEMP/p01-fresh-results.txt"
          grep -Fx 'P01_FRESH_OWNER_OFFWEBROOT_INTAKE_AND_CLI=PASS' "$RUNNER_TEMP/p01-fresh-results.txt"
          grep -Fx 'P01_FRESH_OWNER_INTERRUPTED_COMPLETE_STAGE_RECOVERED=PASS' "$RUNNER_TEMP/p01-fresh-results.txt"
          grep -Fx 'P01_FRESH_OWNER_RECOVERY_TAMPER_EXTRA_AND_PARTIAL_REFUSED=PASS' "$RUNNER_TEMP/p01-fresh-results.txt"
          grep -Fx 'P01_FRESH_OWNER_RECOVERY_REPLAY_REFUSED=PASS' "$RUNNER_TEMP/p01-fresh-results.txt"
          grep -Fx 'P01_FRESH_OWNER_FINAL_HANDOFF_RECEIPT_AND_STAGE_VERIFIED=PASS' "$RUNNER_TEMP/p01-fresh-results.txt"
          grep -Fx 'P01_FRESH_OWNER_HANDOFF_UNTRUSTED_RECEIPT_AND_SHA_DENIED=PASS' "$RUNNER_TEMP/p01-fresh-results.txt"
          grep -Fx 'P01_FRESH_FULL_PORTABLE_CONFIG_MEDIA_MIGRATIONS_SOURCE_ONLY=PASS' "$RUNNER_TEMP/p01-fresh-results.txt"
          grep -Fx 'P01_FRESH_FULL_PINNED_V515_MIGRATIONS_AND_FORGERY_REJECTED=PASS' "$RUNNER_TEMP/p01-fresh-results.txt"
          grep -Fx 'P01_FRESH_OWNER_ONE_COMMAND_NATIVE_OFFLINE_PREPARE_35_TABLES=PASS' "$RUNNER_TEMP/p01-fresh-results.txt"
          grep -Fx 'P01_FRESH_OWNER_OFFLINE_BAD_SHA_AND_REPLAY_REFUSED=PASS' "$RUNNER_TEMP/p01-fresh-results.txt"
          grep -Fx 'P01_FRESH_OWNER_PORTABLE_PREPARED_FOR_PACKAGED_LARAVEL_SEAL=PASS' "$RUNNER_TEMP/p01-fresh-results.txt"
          grep -Fx 'P01_FRESH_FULL_PORTABLE_PREPARED_THEN_REAL_SEALED_APP=PASS' "$RUNNER_TEMP/p01-fresh-results.txt"
          grep -Fx 'P01_FRESH_FULL_REAL_SEAL_BAD_SHA_AND_RECEIPT_REFUSED=PASS' "$RUNNER_TEMP/p01-fresh-results.txt"
          grep -Fx 'P01_FRESH_FULL_REAL_SEAL_REPLAY_REFUSED=PASS' "$RUNNER_TEMP/p01-fresh-results.txt"
          grep -Fx 'P01_FRESH_FULL_D66_NO_OLD_WEBSITE_DIRECTORY=PASS' "$RUNNER_TEMP/p01-fresh-results.txt"
          grep -Fx 'P01_FRESH_FULL_D67_NO_OLD_WEBSITE_DIRECTORY=PASS' "$RUNNER_TEMP/p01-fresh-results.txt"
          grep -Fx 'P01_FRESH_FULL_OLD_V515_WEBROOT_ABSENT_DURING_CONVERSION_AND_HTTPS=PASS' "$RUNNER_TEMP/p01-fresh-results.txt"
          grep -Fx 'P01_FRESH_OWNER_ARCHIVE_DIGEST_TEMP_PATH_AND_REPLAY_DENIED=PASS' "$RUNNER_TEMP/p01-fresh-results.txt"
          grep -Fx 'P01_FRESH_OWNER_INTAKE_NEVER_MODIFIES_INSTALLED_SITE=PASS' "$RUNNER_TEMP/p01-fresh-results.txt"
          grep -Fx 'P01_FRESH_PORTABLE_ONEFILE_ARCHIVE_SHA_AND_REOPEN=PASS' "$RUNNER_TEMP/p01-fresh-results.txt"
          grep -Fx 'P01_FRESH_PORTABLE_BAD_SHA_AND_UNSAFE_ZIP_REJECTED=PASS' "$RUNNER_TEMP/p01-fresh-results.txt"
          grep -Fx 'P01_FRESH_PORTABLE_OLD_SQLITE_37_TABLES_PRIVATE_UNKNOWN=PASS' "$RUNNER_TEMP/p01-fresh-results.txt"
          grep -Fx 'P01_FRESH_PORTABLE_SOURCE_UNTOUCHED_AND_REPLAY_REFUSED=PASS' "$RUNNER_TEMP/p01-fresh-results.txt"
          grep -Fx 'P01_FRESH_FULL_OLD_SITE_PRIVATE_SOURCE_UNCHANGED=PASS' "$RUNNER_TEMP/p01-fresh-results.txt"
          grep -Fx 'P01_FRESH_FULL_COMPLETE_PRIVATE_ESCROW_SEALED_OFFWEBROOT=PASS' "$RUNNER_TEMP/p01-fresh-results.txt"
          grep -Fx 'P01_FRESH_FULL_UNKNOWN_PRIVATE_BYTES_PRESERVED_IN_LARAVEL=PASS' "$RUNNER_TEMP/p01-fresh-results.txt"
          grep -Fx 'P01_DOMAIN_HOST_REBIND_AND_ROLLBACK=PASS' "$RUNNER_TEMP/p01-fresh-results.txt"
          grep -Fx 'P01_DOMAIN_UNTRUSTED_AND_STALE_REJECTED=PASS' "$RUNNER_TEMP/p01-fresh-results.txt"
          grep -Fx 'P01_DOMAIN_OWNER_DB_AND_KEYS_UNCHANGED=PASS' "$RUNNER_TEMP/p01-fresh-results.txt"
          grep -Fx 'P01_FRESH_FULL_V515_NATIVE_IMPORT_PRECHECK=PASS' "$RUNNER_TEMP/p01-fresh-results.txt"
          grep -Fx 'P01_FRESH_FULL_DIRTY_OR_UNTRUSTED_IMPORT_REJECTED=PASS' "$RUNNER_TEMP/p01-fresh-results.txt"
          grep -Fx 'P01_D67_REAL_LARAVEL_AUTH_CSRF_AND_OLD_RECORD_NEW_WRITE=PASS' "$RUNNER_TEMP/p01-fresh-results.txt"
          grep -Fx 'P01_D67_ORIGINAL_OFFICIAL_OLD_INSTALL_UNCHANGED=PASS' "$RUNNER_TEMP/p01-fresh-results.txt"
          grep -Fx 'P01_D65_ACTUAL_OLD_SITE_CODE_DATA_CONFIG_MEDIA_RESTORED=PASS' "$RUNNER_TEMP/p01-fresh-results.txt"
          echo P01_FRESH_FULL_DIRECT_V515_TO_LARAVEL_ISOLATED_MACHINE=PASS
      - name: Clean temporary source data and identity
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate gov-doc "$RUNNER_TEMP/p01-old-full"
          rm -f -- "$RUNNER_TEMP"/p01-fresh-*.txt "$RUNNER_TEMP"/p01-fresh-*.zip "$RUNNER_TEMP"/p01-old-download.txt
          test ! -e candidate && test ! -e gov-doc
          echo P01_FRESH_FULL_PRIVATE_SOURCE_AND_SYNTHETIC_DATA_PERSISTED=NONE
