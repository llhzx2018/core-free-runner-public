name: TEMP S01-C02 Ops 1.21.848 Production Fresh Read
on:
  push:
    branches:
      - temp/s01-c02-v121845-runtime-suffix-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121848-production-fresh-read.yml'
jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Fresh-read Production and bounded poll
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='https://www3.m3u8.one/wp-json/vf-ops/v1'
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 "$BASE/s01-domain-authority" -o /tmp/domain.json
          jq -c '{pluginVersion,status,authorityFinalHost,configuredPublicBaseUrl,authorityMatch}' /tmp/domain.json
          for i in $(seq 1 8); do
            curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 "$BASE/s01-static-candidate-readiness" -o /tmp/static.json
            echo "SAMPLE=$i"
            jq -c '{pluginVersion,sourceArtifactAvailable,manualSourceUploadRequired,candidatePackageReady,finalOnlinePass,activeStaticJobStatus,activeStaticJobMode,activeStaticJobFirstFailedStep,activeStaticJobFailureCount,activeStaticJobNonAuditFailureCount,activeStaticJobAuditFailureCount,activeStaticJobInternalLinkFailureLeafCount,activeStaticJobInternalLinkUniqueTargetCount,sourceRecoveryUrlContractRetryStatus,sourceRecoveryUrlContractRetryCode,sourceRecoveryUrlContractRetryCandidateStatus,sourceRecoveryUrlContractRetryCandidateCurrentStage,sourceRecoveryUrlContractRetryCandidateAuditFailureCount,sourceRecoveryUrlContractRetryCandidateBuildOffset,sourceRecoveryUrlContractRetryCandidateBuildTotal,sourceRecoveryUrlContractRetryCandidateHelperPhase,sourceRecoveryUrlContractRetryCandidateHelpersWritten,sourceRecoveryUrlContractRetryCandidateCompletenessStatus,activeStaticJobFailureSubtypeStatus,activeStaticJobFailureSubtypeLeafCount,activeStaticJobFailureSubtypeKnownCount,activeStaticJobFailureSubtypeOtherCount,activeStaticJobFailureSubtypeCounts,activeStaticJobInternalLinkTargetFamilyCounts}' /tmp/static.json
            pv=$(jq -r '.pluginVersion // ""' /tmp/static.json)
            st=$(jq -r '.sourceRecoveryUrlContractRetryCandidateStatus // ""' /tmp/static.json | tr '[:lower:]' '[:upper:]')
            rr=$(jq -r '.sourceRecoveryUrlContractRetryStatus // ""' /tmp/static.json | tr '[:lower:]' '[:upper:]')
            if [ "$pv" = '1.21.848' ] && { [ "$st" = 'DONE' ] || [ "$st" = 'FAIL' ] || [ "$st" = 'FAILED' ] || [ "$st" = 'BLOCKED' ] || [ "$st" = 'ERROR' ] || [ "$st" = 'CANCELLED' ] || [ "$st" = 'TIMEOUT' ] || { [ -z "$st" ] && [ "$rr" = 'BLOCKED' ]; }; }; then
              break
            fi
            sleep 15
          done
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 "$BASE/s01-static-boundary-reconciliation" -o /tmp/boundary.json
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 "$BASE/s01-seo-closure" -o /tmp/seo.json
          jq -c '{pluginVersion,status,finalHost,configuredPublicBaseUrl,authorityMatch}' /tmp/boundary.json || true
          jq -c '{pluginVersion,status,finalHost,finalOnlinePass}' /tmp/seo.json || true
          echo PASS_V121848_PRODUCTION_FRESH_READ
