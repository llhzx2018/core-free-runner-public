name: TEMP S01-C02 Ops 1.21.849 Static Token Integrity Gate

on:
  push:
    branches:
      - temp/s01-c02-v121849-static-token-integrity-gate-20260906
    paths:
      - '.github/workflows/temp-s01-c02-v121849-static-token-integrity-gate.yml'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPS_BASE_SHA: 7f0f6808c7a9fa076c58cf87776666fbdf38be6d
      OPS_CANDIDATE_SHA: ca87ee6a6dd1139dab6fe33f20b64d537b1a2b20
      OPS_CANDIDATE_TREE: 9ecefb081daf8a8563746601522678d8f93e67f8
    steps:
      - name: Checkout exact v848 base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.OPS_BASE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: base

      - name: Checkout exact v849 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.OPS_CANDIDATE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: candidate

      - name: Verify exact bounded source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C base rev-parse HEAD)" = "$OPS_BASE_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$OPS_CANDIDATE_SHA"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "$OPS_CANDIDATE_TREE"
          test "$(tr -d '\r\n' < base/VERSION)" = 1.21.848
          test "$(tr -d '\r\n' < candidate/VERSION)" = 1.21.849
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          def files(root):
              out={}
              for p in Path(root).rglob('*'):
                  if p.is_file() and '.git' not in p.parts:
                      out[p.relative_to(root).as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
              return out
          a,b=files('base'),files('candidate')
          changed=sorted(k for k in set(a)|set(b) if a.get(k)!=b.get(k))
          expected=sorted([
              '.github/phase3/r6-static-token-integrity.php',
              'VERSION',
              'vf-ops.php',
              'includes/cf-release/checker-html-parts/04-residue-target.php',
              'includes/cf-release/repair-core-parts/cleanup-parts/02-shadow-terms.php',
              'includes/cf-release/repair-core-parts/cleanup-parts/03-public-residue.php',
          ])
          print('CHANGED_FILES=',changed)
          assert changed==expected,(changed,expected)
          PY
          echo EXACT_BOUNDED_SOURCE=PASS

      - name: Verify protected boundaries unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          cmp base/includes/release/builders/class-candidate-entry-processor.php candidate/includes/release/builders/class-candidate-entry-processor.php
          cmp base/includes/release/builders/class-candidate-route-normalizer.php candidate/includes/release/builders/class-candidate-route-normalizer.php
          cmp base/includes/site-release/s01-static-final-audit-url-contract-retry-v121848.php candidate/includes/site-release/s01-static-final-audit-url-contract-retry-v121848.php
          cmp base/includes/s01/tool-workbench.php candidate/includes/s01/tool-workbench.php
          cmp base/includes/site-release/final-domain-authority.php candidate/includes/site-release/final-domain-authority.php
          cmp base/includes/site-release/s01-static-candidate-readiness.php candidate/includes/site-release/s01-static-candidate-readiness.php
          echo PROTECTED_BOUNDARIES=PASS

      - name: PHP syntax and focused token regression
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l candidate/vf-ops.php
          php -l candidate/includes/cf-release/repair-core-parts/cleanup-parts/02-shadow-terms.php
          php -l candidate/includes/cf-release/repair-core-parts/cleanup-parts/03-public-residue.php
          php -l candidate/includes/cf-release/checker-html-parts/04-residue-target.php
          php -l candidate/.github/phase3/r6-static-token-integrity.php
          php candidate/.github/phase3/r6-static-token-integrity.php | tee /tmp/v121849-token.txt
          grep -Fxq PASS_R6_STATIC_TOKEN_INTEGRITY /tmp/v121849-token.txt
          echo TOKEN_REGRESSION=PASS

      - name: Verify v849 identity and fail-closed guards
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'Version: 1.21.849' candidate/vf-ops.php
          grep -Fq "VF_OPS_VERSION', '1.21.849" candidate/vf-ops.php
          grep -Fq "STATIC-CANDIDATE-TECHNICAL-TOKEN-INTEGRITY-V1" candidate/vf-ops.php
          grep -Fq "(?<![A-Za-z0-9_\\-])shortcode(?![A-Za-z0-9_\\-])" candidate/includes/cf-release/checker-html-parts/04-residue-target.php
          grep -Fq 'data-vf-shortcode-tool' candidate/.github/phase3/r6-static-token-integrity.php
          grep -Fq 'data-vf-static module-tool' candidate/.github/phase3/r6-static-token-integrity.php
          if grep -Fq "['shortcode', 'Shortcode', 'SHORTCODE']" candidate/includes/cf-release/repair-core-parts/cleanup-parts/03-public-residue.php; then exit 1; fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('candidate/includes/cf-release/repair-core-parts/cleanup-parts/02-shadow-terms.php').read_text()
          old="'shortcode'\n        ], [\n            'static tool module',\n            'static module',\n            'static module'"
          assert old not in p
          PY
          grep -Fq "finalOnlinePass'=>'NO'" candidate/includes/site-release/s01-static-candidate-readiness.php
          echo FAIL_CLOSED_GUARDS=PASS
          echo PASS_V121849_STATIC_TOKEN_INTEGRITY_GATE
