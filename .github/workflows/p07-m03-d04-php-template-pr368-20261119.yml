# P07-M03 网站与数据 / D04 服务器迁移: one-off source-only proof.
# Existing registered Public Runner; temporary branch/PR CLOSE WITHOUT MERGE.
name: P07 M03 D04 PHP template PR368 source safety
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-m03-d04-php-template-pr368-20261119.yml'
permissions:
  contents: read
jobs:
  source-safety:
    if: github.repository == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      NO_COLOR: '1'
      PRODUCT_SHA: '1064c2d3c98b3c59a116fbe5bfcdc0674e58668b'
      PRODUCT_BASE: '089c62e39e6c4998a92304cce30c73bfb1f2726d'
    steps:
      - name: Public runner checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Transient exact P07 private checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 1064c2d3c98b3c59a116fbe5bfcdc0674e58668b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: .p07-private
      - name: Current GOV-DOC code architecture guards
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: .gov-current
      - name: Verify exact P07 SHA and guard M03 module isolation
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-private rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git -C .p07-private merge-base "$PRODUCT_BASE" "$PRODUCT_SHA")" = "$PRODUCT_BASE"
          (cd .p07-private && python3 -B scripts/check_p07_modules.py)
          python3 -B .p07-private/.github/checks/architecture_gate.py \
            --manifest .p07-private/.github/checks/code_architecture.json \
            --gov-root .gov-current --git-root .p07-private \
            --base-sha "$PRODUCT_BASE" --head-sha "$PRODUCT_SHA"
          echo P07_M03_D04_SOURCE_IDENTITY_AND_MODULE_ISOLATION=PASS
      - name: Run new root-template positive and no-write negative tests
        shell: bash
        run: |
          set -Eeuo pipefail
          (cd .p07-private && python3 -B tests/test_p07_m03_php_template_selection.py -q)
          echo P07_M03_D04_PHP_TEMPLATE_NEGATIVES=PASS
      - name: Reuse existing target-pull safety tests
        shell: bash
        run: |
          set -Eeuo pipefail
          (cd .p07-private && python3 -B tests/test_server_migration_pull.py -q)
          (cd .p07-private && python3 -B tests/test_server_migration.py -q)
          echo P07_M03_D04_EXISTING_MIGRATION_REGRESSION=PASS
      - name: Remove transient private checkouts
        if: always()
        shell: bash
        run: |
          rm -rf -- .p07-private .gov-current
          echo P07_M03_D04_PRIVATE_WORKSPACE_CLEANUP=PASS
