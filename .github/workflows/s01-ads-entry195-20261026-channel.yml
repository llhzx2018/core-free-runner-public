name: S01 exact Theme channel contract
on:
  push:
    branches: [task/s01-ads-entry195-channel-20261026]
    paths: ['.github/workflows/s01-ads-entry195-20261026-channel.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.195
  TARGET_SHA: 4d44ac08dffe168f98cd78f78aa34cb6d65e750c
  UPDATE_SHA: 11a8ed6517c4c69945045c5ac5ee8bd080e1e970
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: 11a8ed6517c4c69945045c5ac5ee8bd080e1e970
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: source
      - name: Channel identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-ads-entry195-20261026/channel-spec.json --input control/.github/workflows/s01-ads-entry195-20261026-channel.yml
      - name: Exact changed manifest and native protocol tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          test "$(git -C source diff --name-only c30232a74fb130bddaf018ac5224e549c92247e4 11a8ed6517c4c69945045c5ac5ee8bd080e1e970)" = projects/S01-C01.json
          git -C source diff --exit-code c30232a74fb130bddaf018ac5224e549c92247e4 11a8ed6517c4c69945045c5ac5ee8bd080e1e970 -- projects/S01-C03.json
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PYCHANNEL'
          import json,os
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']==os.environ['TARGET_VERSION']
          assert m['asset_sha256']=='d57e868c7810cd4aa3c323dd32b99838f56e8e19ac8a214fa124fd6a3f5c1cb6' and m['asset_bytes']==2000892
          assert m['runtime_files']==476 and '1.35.194' in m['from_versions']
          assert m['release_tag']=='v'+os.environ['TARGET_VERSION']
          print('EXACT_CHANNEL_CONTRACT_PASS')
          PYCHANNEL
      - name: Cleanup
        if: always()
        run: rm -rf source
