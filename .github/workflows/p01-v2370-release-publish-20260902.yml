name: P01 V2.37.0 Release Publish
on:
  push:
    branches: [release/p01-v2365-candidate-20260902]
    paths: [.github/workflows/p01-v2370-release-publish-20260902.yml]
permissions:
  actions: read
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      FORMAL: 5172a497f7a2c9065880ae0d1257a15469917621
      FORMAL_TREE: eac2a8c76c49925bffbca9c23314ef90aec6f3bd
      FORMAL_RUNTIME_TREE: 057fbba8822950f163aa322d99b889ed3ab24842
      TAG: v2.37.0
      VERSION: 2.37.0
      SOURCE_VERSION: 2.36.5
      SCHEMA: '2026082901'
      FORMAL_GATE: '33567419784'
      STRICT_FRESH_GATE: '33567802392'
      ARTIFACT_ID: '9823658330'
      ARTIFACT_DIGEST: 95f73a536461b6eeac28616ac8072d7433f194c6cb12c5b1a8d2e641629d6738
      FULL_BYTES: '601163'
      FULL_SHA: 0a7e74750fa22a68ec26a0a4e14e7852e8ad2bb5514ba8c262c804d40eda609b
      UPDATE_BYTES: '1270761'
      UPDATE_SHA: c416486d5ea1d68b87c1bdfebcc7de42729f1ff7655e3ded49ebd5a88d1e3b29
      REPAIR_BYTES: '3689853'
      REPAIR_SHA: 085c205c32ba0c4b4e0d2153f808964f4c301c123baec85ec0a9f11870c04154
    steps:
      - name: Fresh publication authority readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$FORMAL_GATE --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$STRICT_FRESH_GATE --jq .conclusion)" = success
          main=$(gh api repos/$PRODUCT_REPO/branches/main --jq .commit.sha)
          test "$main" = "$FORMAL"
          tree=$(gh api repos/$PRODUCT_REPO/commits/$FORMAL --jq .commit.tree.sha)
          test "$tree" = "$FORMAL_TREE"
          runtime_tree=$(gh api repos/$PRODUCT_REPO/git/trees/$FORMAL_TREE --jq '.tree[]|select(.path=="src")|.sha')
          test "$runtime_tree" = "$FORMAL_RUNTIME_TREE"
          test -z "$(gh api repos/$PRODUCT_REPO/git/ref/tags/$TAG --jq .object.sha 2>/dev/null || true)"
          printf 'MAIN=%s\nFORMAL_TREE=%s\nRUNTIME_TREE=%s\nFORMAL_ARTIFACT_GATE=%s/PASS\nSTRICT_FRESH=%s/PASS\n' "$main" "$tree" "$runtime_tree" "$FORMAL_GATE" "$STRICT_FRESH_GATE" | tee /tmp/p01-v2370-promotion-readback.txt
      - name: Download frozen Formal Artifact only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/frozen; mkdir -p /tmp/frozen
          meta=$(gh api repos/llhzx2018/core-free-runner-public/actions/artifacts/$ARTIFACT_ID)
          test "$(jq -r .digest <<<"$meta")" = "sha256:$ARTIFACT_DIGEST"
          test "$(jq -r .expired <<<"$meta")" = false
          curl --fail --silent --show-error --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/artifacts/$ARTIFACT_ID/zip" \
            -o /tmp/formal-artifact.zip
          test "$(sha256sum /tmp/formal-artifact.zip|awk '{print $1}')" = "$ARTIFACT_DIGEST"
          unzip -qq /tmp/formal-artifact.zip -d /tmp/frozen
          FULL=$(find /tmp/frozen -type f -name 'VF-Start-V2.37.0-FULL.zip' -print -quit); test -n "$FULL"; dirname "$FULL" > /tmp/p01-v2370-art-dir
      - name: Verify exact eight frozen release assets
        shell: bash
        run: |
          set -Eeuo pipefail
          d=$(cat /tmp/p01-v2370-art-dir)
          (cd "$d" && sha256sum -c SHA256SUMS.txt)
          files=(atomic-self-test.json P01-V2.37.0-ARTIFACT-GATE.json P01-V2.37.0-FORMAL-METADATA.json repair-v2.37.0.php SHA256SUMS.txt VF-Start-V2.37.0-FULL.zip VF-Start-V2.37.0-UPDATE.zip VF_Start_V2.37.0_UPDATE.zip)
          for f in "${files[@]}"; do test -f "$d/$f"; done
          test "$(stat -c%s "$d/VF-Start-V2.37.0-FULL.zip")" = "$FULL_BYTES"
          test "$(sha256sum "$d/VF-Start-V2.37.0-FULL.zip"|awk '{print $1}')" = "$FULL_SHA"
          for f in VF-Start-V2.37.0-UPDATE.zip VF_Start_V2.37.0_UPDATE.zip; do
            test "$(stat -c%s "$d/$f")" = "$UPDATE_BYTES"
            test "$(sha256sum "$d/$f"|awk '{print $1}')" = "$UPDATE_SHA"
          done
          test "$(stat -c%s "$d/repair-v2.37.0.php")" = "$REPAIR_BYTES"
          test "$(sha256sum "$d/repair-v2.37.0.php"|awk '{print $1}')" = "$REPAIR_SHA"
      - name: Create exact immutable tag and draft release
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api --method POST repos/$PRODUCT_REPO/git/refs -f ref="refs/tags/$TAG" -f sha="$FORMAL" >/tmp/tag-create.json
          test "$(gh api repos/$PRODUCT_REPO/git/ref/tags/$TAG --jq .object.sha)" = "$FORMAL"
          cat >/tmp/release-notes.md <<'EOF'
          V2.37.0 是 VF Start 的 Personal Internet Journey 产品收束版本，把过去分散存在的能力连接成一条普通用户可以真正使用的主链。

          主要更新：
          - 首次使用直接支持 Chrome / Edge / Firefox 书签导入，改为导入优先、预览确认流程。
          - 全局搜索覆盖个人资源，支持 Ctrl/Cmd+K、相关性排序、Google fallback，以及 URL 零结果直接保存。
          - Browser Helper 升级至 1.6.5，安装、连接、失效重连与“打开待整理”链路统一。
          - 网址健康与重复网址收束为一个健康中心入口。
          - 首页新增数据安全状态与最多 6 条最近使用，保持轻量，不扩张为 Dashboard。
          - 普通导航新增改为 URL-first，标题可由域名安全兜底。
          - 删除网址进入回收站后提供 30 秒页面内撤销。
          - 待整理严格以 `is_pending` 为准，并提供只建议、不自动迁移的现有分类建议。
          - 新增 `quick-save.php` 手机快速收藏入口，始终保存为私人待整理。

          Wave 1–13 Product Gate、Personal Internet Journey、V2.36.5→V2.37.0 Atomic、Fresh Install、Strict Fresh Formal 全部 PASS。Schema 保持 `2026082901`，无 Migration。

          本 Release 直接发布冻结 Formal Artifact 原字节，没有重新构建。
          EOF
          gh release create "$TAG" --repo "$PRODUCT_REPO" --verify-tag --draft --title "VF Start V2.37.0" --notes-file /tmp/release-notes.md
      - name: Upload exact frozen assets
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          d=$(cat /tmp/p01-v2370-art-dir)
          gh release upload "$TAG" --repo "$PRODUCT_REPO" \
            "$d/atomic-self-test.json" \
            "$d/P01-V2.37.0-ARTIFACT-GATE.json" \
            "$d/P01-V2.37.0-FORMAL-METADATA.json" \
            "$d/repair-v2.37.0.php" \
            "$d/SHA256SUMS.txt" \
            "$d/VF-Start-V2.37.0-FULL.zip" \
            "$d/VF-Start-V2.37.0-UPDATE.zip" \
            "$d/VF_Start_V2.37.0_UPDATE.zip"
      - name: Release asset byte-for-byte readback and publish
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/release-readback; mkdir -p /tmp/release-readback
          gh release download "$TAG" --repo "$PRODUCT_REPO" --dir /tmp/release-readback
          d=/tmp/release-readback
          test "$(sha256sum "$d/VF-Start-V2.37.0-FULL.zip"|awk '{print $1}')" = "$FULL_SHA"
          test "$(stat -c%s "$d/VF-Start-V2.37.0-FULL.zip")" = "$FULL_BYTES"
          for f in VF-Start-V2.37.0-UPDATE.zip VF_Start_V2.37.0_UPDATE.zip; do
            test "$(sha256sum "$d/$f"|awk '{print $1}')" = "$UPDATE_SHA"
            test "$(stat -c%s "$d/$f")" = "$UPDATE_BYTES"
          done
          test "$(sha256sum "$d/repair-v2.37.0.php"|awk '{print $1}')" = "$REPAIR_SHA"
          test "$(stat -c%s "$d/repair-v2.37.0.php")" = "$REPAIR_BYTES"
          (cd "$d" && sha256sum -c SHA256SUMS.txt)
          gh release edit "$TAG" --repo "$PRODUCT_REPO" --draft=false --prerelease=false --latest
          rel=$(gh api repos/$PRODUCT_REPO/releases/tags/$TAG)
          test "$(jq -r .draft <<<"$rel")" = false
          test "$(jq -r .prerelease <<<"$rel")" = false
          test "$(jq '.assets|length' <<<"$rel")" = 8
          test "$(gh api repos/$PRODUCT_REPO/git/ref/tags/$TAG --jq .object.sha)" = "$FORMAL"
          printf 'P01_V2370_RELEASE_PUBLISH=PASS\nTAG=%s\nFORMAL=%s\nFULL_BYTES=%s\nFULL_SHA=%s\nUPDATE_BYTES=%s\nUPDATE_SHA=%s\nREPAIR_BYTES=%s\nREPAIR_SHA=%s\nASSETS=8\nOWNER_PRODUCTION_WRITE=NO\n' "$TAG" "$FORMAL" "$FULL_BYTES" "$FULL_SHA" "$UPDATE_BYTES" "$UPDATE_SHA" "$REPAIR_BYTES" "$REPAIR_SHA" | tee /tmp/p01-v2370-release-verdict.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-v2370-release-publish-${{ github.run_id }}
          path: |
            /tmp/p01-v2370-promotion-readback.txt
            /tmp/p01-v2370-release-verdict.txt
          if-no-files-found: warn
          retention-days: 90
