name: p01-admin-r13-v24737-engineering-temp

on:
  push:
    branches:
      - run/p01-admin-r13-v24737-engineering

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact P01 source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: 7ef858bf7ef7742546b4ee8fab2257a54a389cc1
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p01
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd,opcache
          coverage: none

      - name: Exact source contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p01 rev-parse HEAD)" = "7ef858bf7ef7742546b4ee8fab2257a54a389cc1"
          test "$(tr -d '\r\n ' < p01/VERSION)" = "2.47.36"
          php -l p01/src/data-safety.php >/dev/null
          node --check p01/src/assets/data-recovery.js
          php p01/tests/unit/admin_data_safety_r13_contract.php
          php p01/tests/unit/admin_data_closure_contract.php
          php p01/tests/unit/admin_navigation_consistency_contract.php
          php p01/tests/unit/admin_secondary_nav_focus_contract.php
          php p01/tests/unit/admin_backend_closure_contract.php
          echo P01_DATA_SAFETY_R13_FOCUSED_CONTRACTS=PASS

      - name: Fresh install authenticated data-safety smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          TEST_PASSWORD=$(python3 -c "import secrets; print('Aa1!'+secrets.token_urlsafe(24))")
          echo "::add-mask::$TEST_PASSWORD"
          rm -rf /tmp/p01-r13-runtime
          cp -a p01/src /tmp/p01-r13-runtime
          cd /tmp/p01-r13-runtime
          php -S 127.0.0.1:18126 -t . >/tmp/p01-r13-server.log 2>&1 &
          echo $! >/tmp/p01-r13.pid
          for i in $(seq 1 30); do
            if curl -fsS -c /tmp/p01-r13.cookies -b /tmp/p01-r13.cookies http://127.0.0.1:18126/setup.php -o /tmp/p01-r13-setup.html; then break; fi
            sleep 1
          done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-r13-setup.html',encoding='utf-8').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s)
          assert m
          print(m.group(1))
          PY
          )
          curl -fsS -c /tmp/p01-r13.cookies -b /tmp/p01-r13.cookies -X POST http://127.0.0.1:18126/setup.php \
            --data-urlencode "setup_csrf=$CSRF" \
            --data-urlencode 'site_title=VF R13' \
            --data-urlencode "admin_password=$TEST_PASSWORD" \
            --data-urlencode "admin_password_confirm=$TEST_PASSWORD" \
            -o /tmp/p01-r13-setup-post.html
          php cli/verify.php | tee /tmp/p01-r13-verify.txt
          grep -Fx 'VERIFY_PASS=YES' /tmp/p01-r13-verify.txt
          php cli/baseline-verify.php | tee /tmp/p01-r13-baseline.txt
          grep -Fx 'BASELINE_CORE_PASS=YES' /tmp/p01-r13-baseline.txt
          grep -Fx 'BASELINE_FULL_PASS=YES' /tmp/p01-r13-baseline.txt

          TEST_PASSWORD="$TEST_PASSWORD" python3 - <<'PY' >/tmp/p01-r13-login.json
          import json,os
          print(json.dumps({"password":os.environ["TEST_PASSWORD"]}))
          PY
          curl -fsS -c /tmp/p01-r13.cookies -b /tmp/p01-r13.cookies -H 'Content-Type: application/json' \
            -X POST 'http://127.0.0.1:18126/api.php?action=login' --data-binary @/tmp/p01-r13-login.json \
            -o /tmp/p01-r13-login-result.json
          grep -F '"ok":true' /tmp/p01-r13-login-result.json >/dev/null

          curl -fsS -c /tmp/p01-r13.cookies -b /tmp/p01-r13.cookies 'http://127.0.0.1:18126/data-safety.php' -o /tmp/p01-r13-data.html
          grep -F '<h1>备份与恢复</h1>' /tmp/p01-r13-data.html >/dev/null
          grep -F 'id="summary">正在读取备份状态' /tmp/p01-r13-data.html >/dev/null
          grep -F '<details class="vf-data-settings" id="backupPolicyDetails">' /tmp/p01-r13-data.html >/dev/null
          grep -F 'id="createBackup2">创建手动备份' /tmp/p01-r13-data.html >/dev/null
          grep -F 'vf-disaster-tools' /tmp/p01-r13-data.html >/dev/null
          grep -F 'vf-history-tools' /tmp/p01-r13-data.html >/dev/null
          grep -F 'asset.php?file=data-recovery.js&amp;v=2.47.36' /tmp/p01-r13-data.html >/dev/null

          curl -fsS -c /tmp/p01-r13.cookies -b /tmp/p01-r13.cookies 'http://127.0.0.1:18126/asset.php?file=data-recovery.js&v=2.47.36' -o /tmp/p01-r13-data.js
          grep -F 'class="vf-data-safety-state ' /tmp/p01-r13-data.js >/dev/null
          grep -F 'class="vf-data-row-more"><summary>更多</summary>' /tmp/p01-r13-data.js >/dev/null
          grep -F '恢复这份备份' /tmp/p01-r13-data.js >/dev/null
          grep -F '执行完整恢复' /tmp/p01-r13-data.js >/dev/null

          curl -fsS -c /tmp/p01-r13.cookies -b /tmp/p01-r13.cookies 'http://127.0.0.1:18126/api.php?action=backup_list' -o /tmp/p01-r13-backups.json
          grep -F '"ok":true' /tmp/p01-r13-backups.json >/dev/null
          curl -fsS -c /tmp/p01-r13.cookies -b /tmp/p01-r13.cookies 'http://127.0.0.1:18126/api.php?action=backup_policy' -o /tmp/p01-r13-policy.json
          grep -F '"ok":true' /tmp/p01-r13-policy.json >/dev/null
          curl -fsS -c /tmp/p01-r13.cookies -b /tmp/p01-r13.cookies 'http://127.0.0.1:18126/api.php?action=disaster_list' -o /tmp/p01-r13-disaster.json
          grep -F '"ok":true' /tmp/p01-r13-disaster.json >/dev/null
          echo P01_DATA_SAFETY_R13_AUTH_HTTP=PASS

      - name: Verdict
        run: |
          echo P01_ADMIN_R13_EXACT_SOURCE_GATE=PASS
          echo SCHEMA=2026090401
          echo MIGRATION=NONE
          echo PRODUCTION=NOT_WRITTEN

      - name: Cleanup
        if: always()
        run: |
          if [ -f /tmp/p01-r13.pid ]; then kill "$(cat /tmp/p01-r13.pid)" 2>/dev/null || true; fi
          rm -rf p01 /tmp/p01-r13-*
