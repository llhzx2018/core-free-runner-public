name: P08 R121 real final full-atomic-onephp prepublication
on:
  pull_request:
    paths: [.github/workflows/p08-r121-v013-real-pair-prepublish.yml]
permissions:
  contents: read
jobs:
  package:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      P08_FINAL: 44d504185f0ac8cf4be552dc5adada989a08b40e
      P08_BRIDGE: da36b736e075ea0908aa38f896162cac8651f289
      GOV_FINAL: d1f5d18a5efd475131d39bf83cfb17178af82da3
      GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 44d504185f0ac8cf4be552dc5adada989a08b40e
          path: p08
          persist-credentials: false
          fetch-depth: 0
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: da36b736e075ea0908aa38f896162cac8651f289
          path: p08-bridge
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: d1f5d18a5efd475131d39bf83cfb17178af82da3
          path: gov
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mbstring, zip, sqlite3, pdo_sqlite, pdo_mysql, fileinfo, curl
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Main and Mode M identity plus approved exact-source machine evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C p08 rev-parse HEAD)" = "$P08_FINAL"
          test "$(git -C p08-bridge rev-parse HEAD)" = "$P08_BRIDGE"
          test "$(git -C gov rev-parse HEAD)" = "$GOV_FINAL"
          test "$(gh api repos/llhzx2018/vf-adops/git/ref/heads/main --jq '.object.sha')" = "$P08_FINAL"
          test "$(gh api repos/llhzx2018/gov-doc/git/ref/heads/main --jq '.object.sha')" = "$GOV_FINAL"
          test "$(cat p08/VERSION)" = 0.1.3
          test "$(cat p08-bridge/VERSION)" = 0.1.2
          grep -q '## RP-07M' p08/docs/authority/ACCEPTANCE_MATRIX.md
          grep -q '### Mode M' gov/skills/skill-release/V3.12/SKILL.md
          test -z "$(git -C p08 diff --name-only ff5f3383cd217ff34491c7c515918ec3e3d3c3ad "$P08_FINAL" -- app src public resources routes config database composer.json composer.lock package.json package-lock.json scripts tests)"
          for run in 43801680986 43801842033 43801862168 43802129134 43809407657 43809407524 43809407478; do
            test "$(gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$run" --jq '.conclusion')" = success || { echo R121_OLD_OR_FINAL_MACHINE_NOT_PASS; exit 1; }
          done
          echo R121_FINAL_MAIN_MODE_M_AND_MACHINE_IDENTITY=PASS
      - name: Resolve 13 public domains before generating any artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          python3 -B - <<'PY'
          from pathlib import Path
          import json
          router=json.loads(Path('gov/governance/public-authority/VF_PUBLIC_AUTHORITY_APPLICABILITY_ROUTER_V1.0.json').read_text())['domains']
          required={'INSTALL','SECURITY','TESTING','UPGRADE','DATA_SCHEMA','GIT','UA_UI','API_PROVIDER','CRON_JOB','OBSERVABILITY'}
          conditional={'SEO','NOTIFICATION','PERFORMANCE'}
          assert set(router)==required|conditional
          for k,v in router.items():
              assert Path('gov',v['authority']).read_text().strip(),k
              assert '| '+k+' |' in Path('p08/docs/authority/PUBLIC_AUTHORITY_APPLICABILITY.md').read_text(),k
          print('R121_ALL_13_AUTHORITIES_10_REQUIRED_3_CONDITIONAL_READ=PASS')
          PY
      - name: Download and independently verify actual published old v0.1.2 FULL
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          curl --fail --location --silent --show-error --retry 3 --max-time 120 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/octet-stream' \
            https://api.github.com/repos/llhzx2018/vf-adops/releases/assets/747260263 \
            -o "$RUNNER_TEMP/old012.zip"
          test "$(wc -c < "$RUNNER_TEMP/old012.zip")" = 10390070
          echo "1b3d7fc3743fb44af12c0b50905a65ea68d47c80f0e1e2ddc5e03c08d534b081  $RUNNER_TEMP/old012.zip" | sha256sum --check --status
          echo R121_REAL_PREVIOUS_FORMAL_BINARY_READBACK=PASS
      - name: Locked complete target and bridge PHP JS runtime build
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          for pair in 'p08:target' 'p08-bridge:bridge'; do
            repo="$(printf '%s' "$pair" | cut -d : -f 1)"
            dest="$RUNNER_TEMP/p08-$(printf '%s' "$pair" | cut -d : -f 2)"
            mkdir -m 0700 "$dest"
            git -C "$repo" archive HEAD | tar -x -C "$dest"
            ( cd "$dest" && composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress > "$RUNNER_TEMP/r121-composer.log" 2>&1 && npm ci --no-audit --no-fund > "$RUNNER_TEMP/r121-npm.log" 2>&1 && npm run build >> "$RUNNER_TEMP/r121-npm.log" 2>&1 ) || { echo R121_LOCKED_RUNTIME_BUILD=FAIL; exit 1; }
          done
          echo R121_LOCKED_FINAL_AND_BRIDGE_RUNTIME_BUILT=PASS
      - name: Actual final full atomic and one-PHP source-bound package checks
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          python3 -B - <<'PY' > "$RUNNER_TEMP/r121-packages.log" 2>&1 || { echo R121_RELEASE_PACKAGE_BUILD=FAIL; exit 1; }
          import os,sys,json,hashlib,zipfile,subprocess
          from pathlib import Path
          t=Path(os.environ['RUNNER_TEMP'])
          sys.path.insert(0,str(Path('p08/scripts').resolve()))
          from build_full import write_full,verify_canonical_full_contract
          from build_atomic import write_atomic
          from build_r110_onefile import generate
          sha=os.environ['P08_FINAL']; bridge=os.environ['P08_BRIDGE']
          gov=Path('gov').resolve(); p=Path('p08').resolve()
          f=t/'VF_AdOps_V0.1.3_FULL.zip'
          b=t/'bridge012.zip'
          u=t/'VF_AdOps_V0.1.3_UPDATE.zip'
          o=t/'p08-owner-atomic-once.php'
          verify_canonical_full_contract(p,f,sha,gov,'resolve')
          write_full(t/'p08-target',f,'0.1.3',sha)
          verify_canonical_full_contract(p,f,sha,gov,'delivery')
          verify_canonical_full_contract(Path('p08-bridge').resolve(),b,bridge,gov,'resolve')
          write_full(t/'p08-bridge',b,'0.1.2',bridge)
          verify_canonical_full_contract(Path('p08-bridge').resolve(),b,bridge,gov,'delivery')
          with zipfile.ZipFile(b) as z:
              manifestsha=hashlib.sha256(z.read('FULL_MANIFEST.json')).hexdigest()
          write_atomic(t/'p08-target',u,source_version='0.1.2',source_sha=bridge,
              source_full_manifest_sha256=manifestsha,target_version='0.1.3',target_sha=sha)
          generate(p/'scripts/r110_owner_atomic_once.php',b,t/'old012.zip',bridge,o)
          with zipfile.ZipFile(f) as z:
              m=json.loads(z.read('FULL_MANIFEST.json'))
              assert (m['target_version'],m['source_sha'])==('0.1.3',sha)
              assert 'public/setup.php' in z.namelist() and 'vendor/autoload.php' in z.namelist()
              assert not any(n.startswith(('storage/','scripts/','tests/','.git/')) for n in z.namelist())
          with zipfile.ZipFile(u) as z:
              m=json.loads(z.read('ATOMIC_MANIFEST.json'))
              assert (m['source_version'],m['source_sha'],m['target_version'],m['target_sha'])==('0.1.2',bridge,'0.1.3',sha)
              assert m['source_full_manifest_sha256']==manifestsha and m['schema_changes'] is False
              assert not any(n.startswith(('storage/','scripts/','tests/','.git/')) for n in z.namelist())
          data=o.read_bytes(); marker=b'__halt_compiler();'
          assert data.count(marker)==1 and data.split(marker)[1]==b.read_bytes()
          for a in (f,u,o):
              print('R121_BYTE_RECEIPT='+a.name+':'+str(a.stat().st_size)+':'+hashlib.sha256(a.read_bytes()).hexdigest())
          print('R121_REAL_FINAL_MAIN_THREE_ARTIFACT_IDENTITIES=PASS')
          PY
          php -l "$RUNNER_TEMP/p08-owner-atomic-once.php" > "$RUNNER_TEMP/r121-php-lint.log" 2>&1 || { echo R121_SINGLE_PHP_SYNTAX=FAIL; exit 1; }
          echo R121_FINAL_FULL_ATOMIC_ONEPHP_BUILT=PASS
      - name: Canonical atomic actual ZIP delivery and two-build reproducibility
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          python3 -B - <<'PY'
          import os,sys,json,hashlib,zipfile,subprocess
          from pathlib import Path
          t=Path(os.environ['RUNNER_TEMP'])
          sys.path.insert(0,str(Path('p08/scripts').resolve()))
          from build_full import write_full
          from build_atomic import write_atomic
          from build_r110_onefile import generate
          z=t/'VF_AdOps_V0.1.3_UPDATE.zip'
          checks=['INSTALL','SECURITY','TESTING','UPGRADE','DATA_SCHEMA','GIT','UA_UI','API_PROVIDER','CRON_JOB','OBSERVABILITY']
          receipt={'schema':'vf.public-authority.task-delivery-check.v1','project':'P08','source':os.environ['P08_FINAL'],
            'project_authority':{'agents':'AGENTS.md','current':'docs/authority/CURRENT.md','acceptance':'docs/authority/RPD.md','applicability':'docs/authority/PUBLIC_AUTHORITY_APPLICABILITY.md'},
            'acceptance_markers':['WordPress-simple','CloudPanel'],'required_domains':checks,
            'task_capabilities':['source_change','full_package','installer_ui','auth','database','online_upgrade','external_api','background_job','release_visibility'],
            'delivery':{'profile':'web_atomic_zip','entrypoint':'public/index.php','requires_git':False,'requires_manual_source_copy':False,'artifact':z.name,'sha256':hashlib.sha256(z.read_bytes()).hexdigest()}}
          rp=t/'r121-receipt.json';rp.write_text(json.dumps(receipt))
          tool=Path('gov/governance/public-authority/tools/task_delivery_contract_lint.py').resolve()
          router=Path('gov/governance/public-authority/VF_PUBLIC_AUTHORITY_APPLICABILITY_ROUTER_V1.0.json').resolve()
          for phase in ('resolve','delivery'):
              p=subprocess.run([sys.executable,'-B',str(tool),'--phase',phase,'--receipt',str(rp),
                  '--project-root',str(Path('p08').resolve()),'--artifact-root',str(t.resolve()),
                  '--public-router',str(router)],capture_output=True,text=True)
              assert p.returncode==0,'R121_CANONICAL_ATOMIC_'+phase
              print('R121_CANONICAL_ATOMIC_'+phase.upper()+'=PASS')
          with zipfile.ZipFile(t/'bridge012.zip') as b:
              digest=hashlib.sha256(b.read('FULL_MANIFEST.json')).hexdigest()
          full2=t/'repeat-full.zip';atom2=t/'repeat-atomic.zip';one2=t/'p08-owner-atomic-once-copy.php'
          write_full(t/'p08-target',full2,'0.1.3',os.environ['P08_FINAL'])
          write_atomic(t/'p08-target',atom2,source_version='0.1.2',source_sha=os.environ['P08_BRIDGE'],
              source_full_manifest_sha256=digest,target_version='0.1.3',target_sha=os.environ['P08_FINAL'])
          generate(Path('p08/scripts/r110_owner_atomic_once.php'),t/'bridge012.zip',t/'old012.zip',os.environ['P08_BRIDGE'],one2)
          for name,alt in [('VF_AdOps_V0.1.3_FULL.zip',full2),('VF_AdOps_V0.1.3_UPDATE.zip',atom2),('p08-owner-atomic-once.php',one2)]:
              assert (t/name).read_bytes()==alt.read_bytes(),'R121_REPRODUCIBILITY_FAILED'
          print('R121_TRIPLE_ACTUAL_BYTE_REPRODUCIBILITY=PASS')
          PY
      - name: Always purge actual private source, ZIP and ephemeral logs
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- p08 p08-bridge gov "$RUNNER_TEMP/p08-target" "$RUNNER_TEMP/p08-bridge"
          rm -f -- "$RUNNER_TEMP"/*012.zip "$RUNNER_TEMP"/VF_AdOps_V0.1.3_*.zip "$RUNNER_TEMP"/repeat-*.zip "$RUNNER_TEMP"/p08-owner-atomic-once* "$RUNNER_TEMP"/r121-*.log "$RUNNER_TEMP"/r121-*.json
          echo R121_PRIVATE_SOURCE_AND_ALL_BUILD_ARTIFACTS_PURGED=YES
