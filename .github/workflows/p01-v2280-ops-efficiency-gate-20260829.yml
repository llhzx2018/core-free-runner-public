name: P01 V2.28 Ops Efficiency Gate
on:
  push:
    branches: [task/p01-v2280-ops-gate-20260829]
    paths:
      - .github/workflows/p01-v2280-ops-efficiency-gate-20260829.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE: 767b4785ae536e34218e5823131001674b755167
      TREE: 45109457f1ca380d89d81e409ef3a547e1f7aa90
      BASE_SOURCE: 65bf6ee57f3fb53f88bc7426a0baef827e06a1b6
      ROOT: /tmp/p01-v228-ops
      PORT: '18336'
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Exact source fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$SOURCE"
          test "$(git -C product rev-parse HEAD^{tree})" = "$TREE"
          test "$(cat product/VERSION)" = '2.27.0'
          php -l product/src/app/SurfaceShell.php >/dev/null
          php -l product/src/surface.php >/dev/null
          node --check product/src/assets/workspace.js
          git -C product diff --name-only "$BASE_SOURCE"..HEAD | sort >/tmp/p01-v228-files.txt
          printf 'src/app/SurfaceShell.php\nsrc/assets/workspace-v228.css\nsrc/assets/workspace.js\nsrc/surface.php\n' >/tmp/p01-v228-expected.txt
          diff -u /tmp/p01-v228-expected.txt /tmp/p01-v228-files.txt
          echo P01_V228_OPS_EXACT=PASS
      - name: Fresh runtime with representative data
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$ROOT" /tmp/p01-v228-ids.json /tmp/p01-v228.cookies
          cp -a product/src "$ROOT"
          php -S 127.0.0.1:$PORT -t "$ROOT" >/tmp/p01-v228-server.log 2>&1 & echo $! >/tmp/p01-v228.pid
          for i in $(seq 1 30); do curl -fsS -c /tmp/p01-v228.cookies -b /tmp/p01-v228.cookies "http://127.0.0.1:$PORT/setup.php" -o /tmp/p01-v228-setup.html && break || sleep 1; done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-v228-setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c /tmp/p01-v228.cookies -b /tmp/p01-v228.cookies -X POST "http://127.0.0.1:$PORT/setup.php" \
            --data-urlencode "setup_csrf=$CSRF" \
            --data-urlencode 'site_title=V228 Ops Gate' \
            --data-urlencode 'admin_password=P01V228!Ops' \
            --data-urlencode 'admin_password_confirm=P01V228!Ops' \
            -o /tmp/p01-v228-setup-post.html
          cat >/tmp/p01-v228-seed.php <<'PHP'
          <?php
          require '/tmp/p01-v228-ops/app/bootstrap.php';
          require_once '/tmp/p01-v228-ops/app/SurfaceRepository.php';
          $r=new VfRepository(vf_db());$s=new VfSurfaceRepository(vf_db());
          $start=$r->createCategory(['name'=>'开发工具','description'=>'','is_private'=>false]);
          $chA=$r->createCategory(['name'=>'频道 A','description'=>'','is_private'=>false]);
          $chB=$r->createCategory(['name'=>'频道 B','description'=>'','is_private'=>false]);
          $wa=$r->createCategory(['name'=>'影视 A','description'=>'','is_private'=>false]);
          $wb=$r->createCategory(['name'=>'影视 B','description'=>'','is_private'=>false]);
          for($i=1;$i<=20;$i++)$r->saveLink(null,['category_id'=>$start,'title'=>'Start '.str_pad((string)$i,3,'0',STR_PAD_LEFT),'url'=>'https://start'.$i.'.example.com','description'=>'start','tags'=>'工具','is_private'=>true],'manual');
          for($i=1;$i<=70;$i++){ $x=$r->saveLink(null,['category_id'=>$chA,'title'=>'Channel A '.str_pad((string)$i,3,'0',STR_PAD_LEFT),'url'=>'https://youtube.com/@opsa'.$i,'description'=>'channel A','tags'=>'频道','is_private'=>true],'manual');$s->upsertProfile((int)$x['id'],['surface'=>'channels','resource_kind'=>'creator','background_friendly'=>$i%3===0]); }
          for($i=1;$i<=55;$i++){ $x=$r->saveLink(null,['category_id'=>$chB,'title'=>'Channel B '.str_pad((string)$i,3,'0',STR_PAD_LEFT),'url'=>'https://youtube.com/@opsb'.$i,'description'=>'channel B','tags'=>'频道','is_private'=>true],'manual');$s->upsertProfile((int)$x['id'],['surface'=>'channels','resource_kind'=>'creator','background_friendly'=>$i%4===0]); }
          $statuses=['want','watching','watched','favorite'];
          for($i=1;$i<=60;$i++){ $x=$r->saveLink(null,['category_id'=>$wa,'title'=>'Movie A '.str_pad((string)$i,3,'0',STR_PAD_LEFT),'url'=>'https://movie-a'.$i.'.example.com','description'=>'movie A','tags'=>'影视','is_private'=>true],'manual');$s->upsertProfile((int)$x['id'],['surface'=>'watch','resource_kind'=>'movie','media_year'=>2000+$i%25,'media_status'=>$statuses[($i-1)%4]]); }
          for($i=1;$i<=35;$i++){ $x=$r->saveLink(null,['category_id'=>$wb,'title'=>'Movie B '.str_pad((string)$i,3,'0',STR_PAD_LEFT),'url'=>'https://movie-b'.$i.'.example.com','description'=>'movie B','tags'=>'影视','is_private'=>true],'manual');$s->upsertProfile((int)$x['id'],['surface'=>'watch','resource_kind'=>'series','media_year'=>1990+$i%30,'media_status'=>$statuses[($i-1)%4]]); }
          file_put_contents('/tmp/p01-v228-ids.json',json_encode(['start'=>$start,'chA'=>$chA,'chB'=>$chB,'wa'=>$wa,'wb'=>$wb],JSON_THROW_ON_ERROR));
          echo "P01_V228_SEED=PASS\n";
          PHP
          php /tmp/p01-v228-seed.php | grep -Fx P01_V228_SEED=PASS
          echo P01_V228_RUNTIME=PASS
      - name: Browser interaction and UI evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-v228-ui /tmp/p01-v228-playwright
          cd /tmp/p01-v228-playwright
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          cat >gate.js <<'JS'
          const { chromium } = require('playwright');
          const fs=require('fs');
          (async()=>{
            const ids=JSON.parse(fs.readFileSync('/tmp/p01-v228-ids.json','utf8'));
            const base='http://127.0.0.1:18336';
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:1440,height:1000}});
            const login=await context.request.post(base+'/api.php?action=login',{data:{password:'P01V228!Ops'}});if(!login.ok())throw new Error('login http '+login.status());const lb=await login.json();if(!lb.ok)throw new Error('login rejected');
            const page=await context.newPage();const errors=[];page.on('pageerror',e=>errors.push(String(e)));
            const noDocOverflow=async(label)=>{const m=await page.evaluate(()=>({doc:document.documentElement.scrollWidth,win:innerWidth}));if(m.doc>m.win+2)throw new Error(label+' doc overflow '+JSON.stringify(m));};

            await page.goto(base+`/channels.php?category=${ids.chA}&per=30&page=2`,{waitUntil:'networkidle'});
            if(!((await page.locator('.vf-workspace-count').innerText()).includes('当前 31–60')))throw new Error('channels range missing');
            if((await page.locator('select[aria-label="分类筛选"]').inputValue())==='')throw new Error('channels category not selected');
            if((await page.locator('select[aria-label="每页数量"]').inputValue())==='')throw new Error('channels per control missing');
            if(await page.locator('.vf-pagination nav a').count()<3)throw new Error('channels numbered pagination missing');
            await page.locator('[data-open-add]').click();await page.locator('[data-panel="add"]:not([hidden])').waitFor();
            if((await page.locator('[data-add-form] select[name="surface"]').inputValue())!=='channels')throw new Error('channels add surface context missing');
            if((await page.locator('[data-add-form] select[name="category_id"]').inputValue())!==String(ids.chA))throw new Error('channels add category context missing');
            await page.getByRole('button',{name:'关闭'}).click();await page.waitForTimeout(180);

            await page.goto(base+`/channels.php?category=${ids.chA}&per=30&page=1`,{waitUntil:'networkidle'});
            const boxes=page.locator('[data-select-asset]');await boxes.nth(0).click();await boxes.nth(4).click({modifiers:['Shift']});
            const bulk=page.locator('[data-bulkbar]:not([hidden])');await bulk.waitFor();
            if(!((await bulk.innerText()).includes('5 / 30 项已选择')))throw new Error('shift range selection failed: '+await bulk.innerText());
            if(await page.locator('[data-asset-row].is-selected').count()!==5)throw new Error('selected row state mismatch');
            await page.screenshot({path:'/tmp/p01-v228-ui/desktop-bulk-range.png',fullPage:true});
            const favReq=page.waitForRequest(r=>r.url().includes('/workspace-action.php')&&r.method()==='POST');await bulk.locator('[data-bulk-action="favorite"]').click();await favReq;await page.locator('.vf-workspace-toast.show').waitFor();await page.waitForTimeout(120);
            if(!(await page.locator('[data-bulkbar]').isHidden()))throw new Error('bulk did not clear after favorite');
            for(let i=0;i<5;i++){if((await page.locator('[data-asset-row]').nth(i).locator('[data-favorite-id]').getAttribute('data-favorite'))!=='1')throw new Error('favorite state not synced')}

            await boxes.nth(0).click();await boxes.nth(1).click();await page.locator('[data-bulk-clear]').click();if(!(await page.locator('[data-bulkbar]').isHidden()))throw new Error('clear selection failed');
            await boxes.nth(0).click();await boxes.nth(1).click();
            await Promise.all([page.waitForNavigation({waitUntil:'networkidle'}),page.locator('[data-bulk-category]').selectOption(String(ids.chB))]);
            if(!((await page.locator('.vf-workspace-count').innerText()).includes('68 项')))throw new Error('bulk category move did not refresh filtered count');

            await page.goto(base+`/watch.php?category=${ids.wa}&per=30&page=1`,{waitUntil:'networkidle'});
            if(!((await page.locator('.vf-workspace-count').innerText()).includes('60 项')))throw new Error('watch category filter count missing');
            if(await page.locator('.vf-pagination nav a').count()<2)throw new Error('watch pagination missing');
            const cardText=await page.locator('.vf-watch-card').first().innerText();if(!/想看|在看|看过|珍藏/.test(cardText))throw new Error('watch status not localized: '+cardText);
            await page.locator('[data-open-add]').click();await page.locator('[data-panel="add"]:not([hidden])').waitFor();
            if((await page.locator('[data-add-form] select[name="surface"]').inputValue())!=='watch')throw new Error('watch add surface context missing');
            if((await page.locator('[data-add-form] select[name="category_id"]').inputValue())!==String(ids.wa))throw new Error('watch add category context missing');
            await page.getByRole('button',{name:'关闭'}).click();await page.goto(base+'/watch.php?status=want',{waitUntil:'networkidle'});
            if(!(await page.getByRole('link',{name:/想看/}).first().getAttribute('class')||'').includes('active'))throw new Error('watch status filter not active');
            await page.screenshot({path:'/tmp/p01-v228-ui/desktop-watch-filter.png',fullPage:true});

            await page.setViewportSize({width:390,height:844});await page.goto(base+`/channels.php?category=${ids.chA}&per=30`,{waitUntil:'networkidle'});await page.locator('[data-select-asset]').first().click();await page.locator('[data-bulkbar]:not([hidden])').waitFor();
            const rect=await page.locator('[data-bulkbar]').evaluate(el=>{const r=el.getBoundingClientRect();return {left:r.left,right:r.right,width:r.width,win:innerWidth,scroll:el.scrollWidth,client:el.clientWidth}});if(rect.left<0||rect.right>rect.win+1||rect.scroll>rect.client+2)throw new Error('mobile bulk overflow '+JSON.stringify(rect));
            await noDocOverflow('mobile channels');await page.screenshot({path:'/tmp/p01-v228-ui/mobile-bulk.png',fullPage:true});
            if(errors.length)throw new Error('page errors: '+errors.join(' | '));
            await browser.close();console.log('P01_V228_OPS_UI=PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node gate.js | tee /tmp/p01-v228-ui/result.txt
          grep -Fx P01_V228_OPS_UI=PASS /tmp/p01-v228-ui/result.txt
      - name: Regression baseline and data integrity
        shell: bash
        run: |
          set -Eeuo pipefail
          php "$ROOT/cli/verify.php" | grep -Fx VERIFY_PASS=YES
          php "$ROOT/cli/surface-verify.php" | grep -Fx MULTI_SURFACE_PASS=YES
          php "$ROOT/cli/baseline-verify.php" | tee /tmp/p01-v228-baseline.txt
          grep -Fx BASELINE_CORE_PASS=YES /tmp/p01-v228-baseline.txt
          grep -Fx DRIFT_COUNT=0 /tmp/p01-v228-baseline.txt
          grep -Fx UNKNOWN_COUNT=0 /tmp/p01-v228-baseline.txt
          php -r 'require "/tmp/p01-v228-ops/app/bootstrap.php";$db=vf_db();if(strtolower((string)$db->query("PRAGMA integrity_check")->fetchColumn())!=="ok")exit(1);if($db->query("PRAGMA foreign_key_check")->fetchAll(PDO::FETCH_ASSOC))exit(2);$fav=(int)$db->query("SELECT COUNT(*) FROM links WHERE is_favorite=1")->fetchColumn();if($fav<5)exit(3);echo "P01_V228_SQLITE=PASS\n";' | grep -Fx P01_V228_SQLITE=PASS
          echo P01_V228_OPS_REGRESSION=PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P01-v228-ops-efficiency-ui-evidence
          path: /tmp/p01-v228-ui
          if-no-files-found: error
          retention-days: 30
      - name: Verdict
        run: |
          echo P01_V228_SOURCE=$SOURCE
          echo P01_V228_TREE=$TREE
          echo P01_V228_OPS_GATE=PASS
          echo PRODUCT_FILES_CHANGED=4
          echo SCHEMA_CHANGE=NO
          echo PRODUCTION_WRITE=NO
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/p01-v228.pid 2>/dev/null)" 2>/dev/null || true
