name: S01 Theme exact formal release
on:
  push:
    branches: [task/s01-backup-followup158-20261021]
    paths: ['.github/workflows/s01-backup-followup-formal.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.158
  TARGET_SHA: d126c8b7b3a142456df2050ded051fa3d3b70e58
  TARGET_TREE: 8e5652864620e5aa00df716bf0be8d425afb530a
  BASE_SHA: 00ead868db51a55fe17e3cafb9d02a3ac6007341
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: d126c8b7b3a142456df2050ded051fa3d3b70e58
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact verified candidate and merged source readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider candidate-proof
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/39562353117 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/39562353117 --jq .head_sha)" = b245c76ce049640963a46be9d5ad018e43838af4
          test "$(gh api repos/$TARGET_REPO/commits/main --jq .sha)" = "$TARGET_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$TARGET_SHA --jq .tree.sha)" = "$TARGET_TREE"
          gh run download 39562353117 --repo llhzx2018/core-free-runner-public --name s01-backup-followup-39562353117 --dir candidate-proof
          python3 control/lanes/s01-backup-followup158-20261021/package.py
          python3 - <<'PYVERIFY'
          import json,pathlib
          old=json.loads(pathlib.Path('candidate-proof/package.json').read_text())
          new=json.loads(pathlib.Path('proof/package.json').read_text())
          browser=json.loads(pathlib.Path('candidate-proof/browser-results.json').read_text())
          assert browser['status']=='PASS' and browser['passed']==browser['count']
          for k in ['status','version','tree','sha256','bytes','files']:assert old[k]==new[k],k
          assert new['sha256']=='f9866ee9178fef0df40c3bb520fcc422667a306f74d1324f2db6560820d9bafa' and new['bytes']==1971702
          print('MERGED_TREE_EQUALS_TESTED_TREE_AND_EXACT_PACKAGE_PASS')
          PYVERIFY
      - name: Formal release only exact verified bytes
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.35.158 --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create v1.35.158 provider/vf-tools-theme_V1.35.158.zip --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Theme V1.35.158' --notes '备份恢复页的异常提示、相关推荐、隐私/边界/FAQ 默认说明与底部入口对齐本地数据任务。保留自定义标题和说明；M3U8 1.25.94 的备份/预检/恢复/回滚逻辑未变。中英文四桌面宽度定向浏览器、自定义文案、播放器对照及 Theme 157→158 升级回退重复安装和数据库保护 PASS。Owner 真实体验待手工 Production 升级，手机暂缓。' --latest
          fi
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/v1.35.158 --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh release view v1.35.158 --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - name: Authenticated formal asset remote bytes readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download v1.35.158 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.158.zip --dir remote
          cmp provider/vf-tools-theme_V1.35.158.zip remote/vf-tools-theme_V1.35.158.zip
          echo 'f9866ee9178fef0df40c3bb520fcc422667a306f74d1324f2db6560820d9bafa  remote/vf-tools-theme_V1.35.158.zip' | sha256sum -c
          test "$(stat -c %s remote/vf-tools-theme_V1.35.158.zip)" = 1971702
          gh release view v1.35.158 --repo "$TARGET_REPO" --json url,publishedAt,tagName > proof/formal-release.json
          echo FORMAL_RELEASE_EXACT_REMOTE_ASSET_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-backup-formal-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources packages
        if: always()
        run: rm -rf target provider remote candidate-proof
