name: P07 #293 Migration-Owned DB Metadata on Real MariaDB 11.8
on:
  pull_request:
    paths: ['.github/workflows/p07-293-owned-db-metadata.yml']
permissions:
  contents: read
jobs:
  p07-owned-metadata-proof:
    if: ${{ github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: p07-synthetic-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mariadb-admin ping --host=127.0.0.1 --user=root --password=p07-synthetic-only --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Install MariaDB CLI
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          if ! command -v mariadb >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mariadb-client
          fi
          MYSQL_PWD=p07-synthetic-only mariadb --no-defaults --protocol=tcp -h127.0.0.1 -P3306 -uroot -N -e 'SELECT VERSION()' | grep -E '^11[.]8[.]'
          echo 'P07_REAL_MARIADB_118_PRESENT'
      - name: Checkout P07 exact private candidate ephemerally
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 9915a3d7f0a034233af93c584bddc06cfc292ee2
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p07-exact
          fetch-depth: 1
      - name: Execute owned metadata query and focused no-write tests
        shell: bash
        env:
          P07_SYNTHETIC_MARIADB: '1'
          P07_DB_TEST_HOST: 127.0.0.1
          P07_DB_TEST_PORT: '3306'
          P07_DB_TEST_PASSWORD: p07-synthetic-only
        run: |
          set -Eeuo pipefail
          set +x
          cd p07-exact
          test "$(git rev-parse HEAD)" = 9915a3d7f0a034233af93c584bddc06cfc292ee2
          export PYTHONDONTWRITEBYTECODE=1
          python3 -B -m unittest -q \
            tests.test_migration_failed_prepare_audit \
            tests.test_migration_laravel_mariadb_engine
          echo 'P07_293_OWNED_USER_REAL_MARIADB118_METADATA_QUERY_PASS'
      - name: Remove exact-source private checkout on success or failure
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- p07-exact
          echo 'P07_293_PRIVATE_WORKSPACE_CLEANUP_DONE'
