name: S01 downloader 1.35.217 formal release
on:
  push:
    branches: [task/s01-downloader-proof-20261029]
    paths: ['.github/workflows/s01-downloader217-release.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.217
  TARGET_SHA: 25f956f608b18f6c61ef73ca861b3a984f02b8c7
  TARGET_TREE: 6d4daee3c88e3abc27183516bb515decab666a1c
  BASE_SHA: 858e9db51ff7c3f3ed9611512c4a0da673333e7f
  LANE_ID: s01-downloader-20261029
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: control
      - name: Identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-downloader-release-20261029/spec.json --input control/.github/workflows/s01-downloader217-release.yml
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 25f956f608b18f6c61ef73ca861b3a984f02b8c7
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Build and verify exact candidate bytes
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/$TARGET_REPO/git/ref/heads/main --jq .object.sha)" = "$TARGET_SHA"
          mkdir -p proof provider
          python3 control/lanes/s01-downloader-20261029/package.py
          test "$(stat -c %s provider/vf-tools-theme_V1.35.217.zip)" = 2025542
          echo '7593cfa0632f26a66cce432bf56f3550a5bf89e4771f7d248831d089c328a2a1  provider/vf-tools-theme_V1.35.217.zip' | sha256sum -c
      - name: Publish and verify formal release
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          if gh release view v1.35.217 --repo "$TARGET_REPO" >/dev/null 2>&1; then echo RELEASE_ALREADY_EXISTS_STOP; exit 1; fi
          cat > /tmp/s01-release-notes <<'NOTES'
          Theme 1.35.217: downloader task-entry and default FAQ guidance refinement. Author content and existing Provider functionality are preserved. Isolated bilingual desktop tests cover real synthetic file download and package install/rollback/reinstall; protected database state remains unchanged. Production requires a separate manual upgrade by the owner; mobile and owner visual acceptance remain pending.
          Source: 25f956f608b18f6c61ef73ca861b3a984f02b8c7
          Candidate evidence: https://github.com/llhzx2018/core-free-runner-public/actions/runs/40897574534
          Files: 476; bytes: 2025542; SHA256: 7593cfa0632f26a66cce432bf56f3550a5bf89e4771f7d248831d089c328a2a1.
          NOTES
          gh release create v1.35.217 provider/vf-tools-theme_V1.35.217.zip --repo "$TARGET_REPO" --target "$TARGET_SHA" --title "VF Tools Theme V1.35.217" --notes-file /tmp/s01-release-notes
          mkdir -p remote
          gh release download v1.35.217 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.217.zip --dir remote
          cmp provider/vf-tools-theme_V1.35.217.zip remote/vf-tools-theme_V1.35.217.zip
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/v1.35.217 --jq .object.sha)" = "$TARGET_SHA"
          echo FORMAL_RELEASE_REMOTE_BYTES_PASS
      - name: Clean private material
        if: always()
        run: rm -rf target provider remote
