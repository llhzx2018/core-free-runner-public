# TEMP one-off P02 Stage6 REAL Chromium public-safe proof. CLOSE WITHOUT MERGE.
# Private source transient via existing Runtime Secret, synthetic-only data, no artifacts.
name: TEMP P02 Stage6 final editor-only successor twelve Chromium
on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths: ['.github/workflows/p02-stage6-free-hosted-real-chromium-once.yml']
permissions:
  contents: read
concurrency:
  group: p02-stage6-free-hosted-one-shot
  cancel-in-progress: false
jobs:
  exact-real-browser:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.event_name == 'pull_request' &&
      github.event.action == 'synchronize' &&
      github.run_attempt == 1 &&
      github.actor == 'llhzx2018' &&
      github.triggering_actor == 'llhzx2018' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public' &&
      github.event.pull_request.head.ref == 'test/p02-stage6-editor-final-20261125' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-doc
          ref: 9ca0428b04652695b4cc79b101d8ec17184a802d
          path: control
          fetch-depth: 2
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-doc
          ref: 1486f85f5b63fc1ed1c843fb50e96c8517371f62
          path: target
          fetch-depth: 3
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_sqlite,sqlite3,pdo_mysql,dom,xml,zip,curl,fileinfo
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: pnpm/action-setup@v4
        with: {version: '10.20.0', run_install: false}
      - name: Exact identity, Chromium installation and frozen real FULL
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          test "$(git -C control rev-parse HEAD)" = 9ca0428b04652695b4cc79b101d8ec17184a802d
          test "$(git -C control rev-parse HEAD^{tree})" = 718aecf3f6a32810e14a59e9781185db7bc3050d
          test "$(git -C target rev-parse HEAD)" = 1486f85f5b63fc1ed1c843fb50e96c8517371f62
          test "$(git -C target rev-parse HEAD^{tree})" = 6576582fb94ffcf88b52088fd0a342fd5bb5ff5e
          echo P02_PUBLIC_CHROMIUM_EXACT_SOURCE_TREE=PASS
          lab="$RUNNER_TEMP/p02-stage6-exact"
          toolsdir="$RUNNER_TEMP/p02-playwright-tools"
          test ! -e "$lab" && test ! -e "$toolsdir"
          install -d -m 0700 "$lab" "$toolsdir"
          test "$(git -C target rev-parse HEAD^)" = aa727d87bea98d810b2b4031c941ec43fffad10a
          test "$(git -C target rev-parse HEAD^^)" = b1cfa8c6cca8c5c5f430d865c7a0570d5c8f857a
          test "$(git -C target diff --name-only HEAD^ HEAD)" = tests/e2e/editor.browser.cjs
          test "$(git -C control rev-parse HEAD^)" = bba3107931039e436cc09f7ae06523e680da7c56
          expected_product="$(printf '%s\n' tests/e2e/bulk_organization.browser.cjs tests/e2e/editor.browser.cjs tests/e2e/notebook_reader.browser.cjs tests/e2e/transfer_branding.browser.cjs | sort)"
          test "$(git -C target diff --name-only HEAD^^ HEAD | sort)" = "$expected_product"
          test "$(cat target/VERSION)" = 0.1.0-dev.1
          command -v unzip >/dev/null
          node --check target/tests/e2e/editor.browser.cjs
          expected_control="$(printf '%s\n' scripts/p02-stage6-isolated-batch.sh tests/test_p02_stage6_browser_fixture.py | sort)"
          test "$(git -C control diff --name-only HEAD^ HEAD | sort)" = "$expected_control"
          echo P02_STAGE6_TEST_ONLY_GIT_DIFF=PASS
          if bash -n control/scripts/p02-stage6-isolated-batch.sh &&
             python3 -B control/scripts/check_p02_hyperv_workflow_safety.py >"$lab/control-gate.log" 2>&1 &&
             python3 -B control/tests/test_p02_stage6_browser_fixture.py >"$lab/control-tests.log" 2>&1; then
            echo P02_STAGE6_CONTROL_SAFETY_AND_REGRESSIONS=PASS
          else
            echo P02_STAGE6_CONTROL_SAFETY_AND_REGRESSIONS=FAIL
            exit 1
          fi
          install -d -m 0700 "$lab/tmp"
          if npm install --prefix "$toolsdir" playwright@1.56.1 >"$lab/npm.log" 2>&1 &&
            PLAYWRIGHT_BROWSERS_PATH="$lab/browsers" node "$toolsdir/node_modules/playwright/cli.js" install --with-deps chromium >"$lab/browser-install.log" 2>&1; then
            echo P02_PUBLIC_CHROMIUM_ENGINE_INSTALLED=PASS
          else
            echo P02_PUBLIC_CHROMIUM_ENGINE_INSTALLED=FAIL
            exit 1
          fi
          test -e "$toolsdir/node_modules/playwright" && test -d "$lab/browsers"
          if bash target/scripts/build-clean-full.sh "$lab/full.zip" >"$lab/full-build.log" 2>&1 && unzip -tqq "$lab/full.zip" >/dev/null; then
            echo P02_PUBLIC_CHROMIUM_EXACT_FULL_BUILD=PASS
          else
            echo P02_PUBLIC_CHROMIUM_EXACT_FULL_BUILD=FAIL
            exit 1
          fi
      - name: One batch of twelve existing Chromium flows on independent real SQLite FULL
        shell: bash
        env:
          P02_STAGE6_STANDALONE_ONLY: 'YES'
          E2E_CONFIRM_DISPOSABLE_NEW_VFDOC: 'YES'
          E2E_EXACT_SOURCE_SHA: 1486f85f5b63fc1ed1c843fb50e96c8517371f62
          E2E_EMAIL: synthetic@example.test
          E2E_PASSWORD: synthetic-secure-password
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          export PLAYWRIGHT_MODULE_PATH="$RUNNER_TEMP/p02-playwright-tools/node_modules/playwright"
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/p02-stage6-exact/browsers"
          lab="$RUNNER_TEMP/p02-stage6-exact"
          export TMPDIR="$lab/tmp"
          test -f "$lab/full.zip"
          test -e "$PLAYWRIGHT_MODULE_PATH"
          # The old heavy source lane and wrong source identity must refuse before installation.
          if P02_STAGE6_STANDALONE_ONLY=NO bash control/scripts/p02-stage6-isolated-batch.sh "$lab" >"$lab/negative-native.log" 2>&1; then
            echo P02_STAGE6_WRONG_LANE_REFUSAL=FAIL
            exit 1
          fi
          if E2E_EXACT_SOURCE_SHA=b1cfa8c6cca8c5c5f430d865c7a0570d5c8f857a bash control/scripts/p02-stage6-isolated-batch.sh "$lab" >"$lab/negative-source.log" 2>&1; then
            echo P02_STAGE6_WRONG_SOURCE_REFUSAL=FAIL
            exit 1
          fi
          test ! -e "$lab/stage6-isolated-1"
          echo P02_STAGE6_EXACT_LOCK_NEGATIVES=PASS
          log="$lab/isolated-twelve-browser.log"
          rc=0
          bash control/scripts/p02-stage6-isolated-batch.sh "$lab" >"$log" 2>&1 || rc="$?"
          python3 -B - "$log" "$lab" "$rc" <<'PY'
          import pathlib,re,sys
          log=pathlib.Path(sys.argv[1]).read_text(errors='replace').splitlines()
          lab=pathlib.Path(sys.argv[2])
          rc=int(sys.argv[3])
          expected=('stage6_workspace','quick_capture','standalone_markdown','bulk_organization','revision_compare','recent_category','notebook_reader','rich_reader_template','editor','private_attachment_reader','transfer_branding','settings_nine')
          known={n+'.browser.cjs':i for i,n in enumerate(expected,1)}
          seen={}
          installs=0
          last_failed=None
          for line in log:
              if line=='P02_STAGE6_ISOLATED_OWNER_INSTALL=PASS':
                  installs+=1
              m=re.fullmatch(r'P02_STAGE6_(PASSED|FAILED)_FLOW=([a-z0-9_]+\.browser\.cjs)',line)
              if m:
                  result,name=m.groups()
                  if name not in known or name in seen:
                      print('P02_STAGE6_RESULT_INVENTORY=FAIL');sys.exit(2)
                  seen[name]=result
                  print('P02_STAGE6_FLOW_RESULT='+name+':'+('PASS' if result=='PASSED' else 'FAIL'))
                  last_failed=name if result=='FAILED' else None
              m=re.fullmatch(r'P02_STAGE6_FAILED_EXIT_CODE=([0-9]{1,3})',line)
              if m and last_failed:
                  print('P02_STAGE6_FLOW_EXIT='+last_failed+':'+m.group(1))
              if line in ('P02_STAGE6_ISOLATED_OWNER_INSTALL=FAIL','P02_STAGE6_ISOLATED_SERVER_CLEANUP=FAIL','P02_STAGE6_STALE_SERVER_REFUSED','P02_STAGE6_ISOLATED_SERVER_EXITED','P02_STAGE6_ISOLATED_SETUP_READY=FAIL','P02_STAGE6_EXACT_FLOW_INVENTORY=FAIL','P02_STAGE6_UNTRUSTED_ISOLATED_SITE'):
                  print(line)
          # Only compile-time checkpoint identifiers from the exact synthetic tests;
          # no raw errors, DOM, HTTP content, source text, or runtime private files.
          for name,result in seen.items():
              if result!='FAILED':continue
              f=lab/('stage6-flow-'+str(known[name])+'.log')
              raw=f.read_text(errors='replace') if f.is_file() else ''
              src=(pathlib.Path('target/tests/e2e')/name).read_text(encoding='utf-8')
              allowed=set(re.findall(r"checkpoint\s*=\s*'([a-z0-9-]{1,80})'",src))
              match=re.search(r'(?:CHECKPOINT=|checkpoint=)([a-z0-9-]{1,80})',raw)
              cp=match.group(1) if match and match.group(1) in allowed else 'NOT_EMITTED'
              kind=('PLAYWRIGHT_TIMEOUT' if 'TimeoutError' in raw else
                    'ASSERTION' if 'AssertionError' in raw else
                    'LOCATOR_AMBIGUOUS' if 'strict mode violation' in raw else
                    'NOT_EMITTED')
              print('P02_STAGE6_FLOW_CHECKPOINT='+name+':'+cp)
              print('P02_STAGE6_FLOW_ERROR_CLASS='+name+':'+kind)
              if name=='editor.browser.cjs':
                  code=re.search(r'^P02_EDITOR_ERROR_CLASS=(AssertionError|TimeoutError|TypeError|Error|Other)
          print('P02_STAGE6_FRESH_OWNER_INSTALLS='+str(installs))
          print('P02_STAGE6_EXECUTED_FLOW_COUNT='+str(len(seen)))
          for name in known:
              if name not in seen: print('P02_STAGE6_FLOW_RESULT='+name+':NOT_RUN')
          if rc==0 and installs==12 and len(seen)==12 and all(v=='PASSED' for v in seen.values()) and 'P02_STAGE6_EXACT_FLOW_INVENTORY=PASS_12' in log and 'P02_STAGE6_SYNTHETIC_BROWSER_FLOWS=12_PASS' in log:
              print('P02_PUBLIC_CHROMIUM_BATCH=PASS_12')
          else:
              print('P02_PUBLIC_CHROMIUM_BATCH=FAIL')
              sys.exit(1)
          PY
      - name: Always remove private source and ephemeral runtime
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          rm -rf -- control target "$RUNNER_TEMP/p02-stage6-exact" "$RUNNER_TEMP/p02-playwright-tools"
          test ! -e control && test ! -e target && test ! -e "$RUNNER_TEMP/p02-stage6-exact" && test ! -e "$RUNNER_TEMP/p02-playwright-tools"
          echo P02_PUBLIC_CHROMIUM_PRIVATE_CLEAN=PASS

# ARMED once: authorized Stage6 browser-only full batch; no full heavy lane.
,raw,re.M)
                  line=re.search(r'^P02_EDITOR_ASSERT_LINE=([0-9]{1,4}|NOT_EMITTED)
          print('P02_STAGE6_FRESH_OWNER_INSTALLS='+str(installs))
          print('P02_STAGE6_EXECUTED_FLOW_COUNT='+str(len(seen)))
          for name in known:
              if name not in seen: print('P02_STAGE6_FLOW_RESULT='+name+':NOT_RUN')
          if rc==0 and installs==12 and len(seen)==12 and all(v=='PASSED' for v in seen.values()) and 'P02_STAGE6_EXACT_FLOW_INVENTORY=PASS_12' in log and 'P02_STAGE6_SYNTHETIC_BROWSER_FLOWS=12_PASS' in log:
              print('P02_PUBLIC_CHROMIUM_BATCH=PASS_12')
          else:
              print('P02_PUBLIC_CHROMIUM_BATCH=FAIL')
              sys.exit(1)
          PY
      - name: Always remove private source and ephemeral runtime
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          rm -rf -- control target "$RUNNER_TEMP/p02-stage6-exact" "$RUNNER_TEMP/p02-playwright-tools"
          test ! -e control && test ! -e target && test ! -e "$RUNNER_TEMP/p02-stage6-exact" && test ! -e "$RUNNER_TEMP/p02-playwright-tools"
          echo P02_PUBLIC_CHROMIUM_PRIVATE_CLEAN=PASS

# ARMED once: authorized Stage6 browser-only full batch; no full heavy lane.
,raw,re.M)
                  print('P02_EDITOR_ERROR_CLASS='+ (code.group(1) if code else 'NOT_EMITTED'))
                  print('P02_EDITOR_ASSERT_LINE='+ (line.group(1) if line else 'NOT_EMITTED'))
          print('P02_STAGE6_FRESH_OWNER_INSTALLS='+str(installs))
          print('P02_STAGE6_EXECUTED_FLOW_COUNT='+str(len(seen)))
          for name in known:
              if name not in seen: print('P02_STAGE6_FLOW_RESULT='+name+':NOT_RUN')
          if rc==0 and installs==12 and len(seen)==12 and all(v=='PASSED' for v in seen.values()) and 'P02_STAGE6_EXACT_FLOW_INVENTORY=PASS_12' in log and 'P02_STAGE6_SYNTHETIC_BROWSER_FLOWS=12_PASS' in log:
              print('P02_PUBLIC_CHROMIUM_BATCH=PASS_12')
          else:
              print('P02_PUBLIC_CHROMIUM_BATCH=FAIL')
              sys.exit(1)
          PY
      - name: Always remove private source and ephemeral runtime
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          rm -rf -- control target "$RUNNER_TEMP/p02-stage6-exact" "$RUNNER_TEMP/p02-playwright-tools"
          test ! -e control && test ! -e target && test ! -e "$RUNNER_TEMP/p02-stage6-exact" && test ! -e "$RUNNER_TEMP/p02-playwright-tools"
          echo P02_PUBLIC_CHROMIUM_PRIVATE_CLEAN=PASS

# Staged only; final batch runs on one authorized synchronize.

# ARMED: one final owner-authorized Stage6 browser-only run; stop on first failure.
