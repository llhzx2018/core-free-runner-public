# TEMP one-off P02 Stage6 REAL Chromium public-safe proof. CLOSE WITHOUT MERGE.
# Private source transient via existing Runtime Secret, synthetic-only data, no artifacts.
name: TEMP P02 Stage6 real Chromium existing free hosted one-shot
on:
  pull_request:
    branches: [main]
    types: [opened]
    paths: ['.github/workflows/p02-stage6-free-hosted-real-chromium-once.yml']
permissions:
  contents: read
concurrency:
  group: p02-stage6-free-hosted-one-shot
  cancel-in-progress: false
jobs:
  exact-real-browser:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.event_name == 'pull_request' &&
      github.event.action == 'opened' &&
      github.actor == 'llhzx2018' &&
      github.triggering_actor == 'llhzx2018' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public' &&
      github.event.pull_request.head.ref == 'test/p02-stage6-free-hosted-bounded-20261125' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-doc
          ref: 67500e4b007d8162450ba889d1b0bc164312b9a2
          path: control
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-doc
          ref: b1cfa8c6cca8c5c5f430d865c7a0570d5c8f857a
          path: target
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_sqlite,sqlite3,pdo_mysql,dom,xml,zip,curl,fileinfo
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: pnpm/action-setup@v4
        with: {version: '10.20.0', run_install: false}
      - name: Exact identity, Chromium installation and frozen real FULL
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          test "$(git -C control rev-parse HEAD)" = 67500e4b007d8162450ba889d1b0bc164312b9a2
          test "$(git -C control rev-parse HEAD^{tree})" = def0130c90e7db780772ec6853a22c9eab6e4ab1
          test "$(git -C target rev-parse HEAD)" = b1cfa8c6cca8c5c5f430d865c7a0570d5c8f857a
          test "$(git -C target rev-parse HEAD^{tree})" = d524c7c4e34b7348e24c344c4c6696f86884743f
          echo P02_PUBLIC_CHROMIUM_EXACT_SOURCE_TREE=PASS
          lab="$RUNNER_TEMP/p02-stage6-exact"
          toolsdir="$RUNNER_TEMP/p02-playwright-tools"
          test ! -e "$lab" && test ! -e "$toolsdir"
          install -d -m 0700 "$lab" "$toolsdir"
          if npm install --prefix "$toolsdir" playwright@1.56.1 >"$lab/npm.log" 2>&1 &&
            PLAYWRIGHT_BROWSERS_PATH="$lab/browsers" node "$toolsdir/node_modules/playwright/cli.js" install --with-deps chromium >"$lab/browser-install.log" 2>&1; then
            echo P02_PUBLIC_CHROMIUM_ENGINE_INSTALLED=PASS
          else
            echo P02_PUBLIC_CHROMIUM_ENGINE_INSTALLED=FAIL
            exit 1
          fi
          test -e "$toolsdir/node_modules/playwright" && test -d "$lab/browsers"
          if bash target/scripts/build-clean-full.sh "$lab/full.zip" >"$lab/full-build.log" 2>&1 && unzip -tqq "$lab/full.zip" >/dev/null; then
            echo P02_PUBLIC_CHROMIUM_EXACT_FULL_BUILD=PASS
          else
            echo P02_PUBLIC_CHROMIUM_EXACT_FULL_BUILD=FAIL
            exit 1
          fi
      - name: One bounded synthetic diagnostic and unchanged 12 original Chromium flows
        shell: bash
        env:
          E2E_CONFIRM_DISPOSABLE_NEW_VFDOC: 'YES'
          E2E_EXACT_SOURCE_SHA: b1cfa8c6cca8c5c5f430d865c7a0570d5c8f857a
          E2E_EMAIL: synthetic@example.test
          E2E_PASSWORD: synthetic-secure-password
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          export PLAYWRIGHT_MODULE_PATH="$RUNNER_TEMP/p02-playwright-tools/node_modules/playwright"
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/p02-stage6-exact/browsers"
          python3 -B - <<'PY'
          import os,pathlib,re,shutil,subprocess,sys,time,urllib.request
          root=pathlib.Path.cwd()
          lab=pathlib.Path(os.environ['RUNNER_TEMP'])/'p02-stage6-exact'
          src=root/'target'
          names=('stage6_workspace.browser.cjs','quick_capture.browser.cjs','standalone_markdown.browser.cjs','bulk_organization.browser.cjs','revision_compare.browser.cjs','recent_category.browser.cjs','notebook_reader.browser.cjs','rich_reader_template.browser.cjs','editor.browser.cjs','private_attachment_reader.browser.cjs','transfer_branding.browser.cjs','settings_nine.browser.cjs')
          def logrun(args,name,timeout=180,env=None):
              with (lab/name).open('wb') as out:
                  os.chmod(lab/name,0o600)
                  return subprocess.run(args,cwd=root,stdout=out,stderr=subprocess.STDOUT,timeout=timeout,check=False,env=env).returncode
          def server_for(suffix):
              site=lab/suffix
              site.mkdir(mode=0o700)
              if logrun(['unzip','-q',str(lab/'full.zip'),'-d',str(site)],'extract-'+suffix+'.log',60)!=0:raise RuntimeError('EXTRACT_FAIL')
              (site/'router.php').write_text('<?php\n$p=parse_url($_SERVER["REQUEST_URI"],PHP_URL_PATH);\nif(is_file(__DIR__."/public".$p))return false;\nrequire __DIR__."/public/index.php";\n')
              f=(lab/('server-'+suffix+'.log')).open('wb')
              p=subprocess.Popen(['php','-S','127.0.0.1:8000','-t',str(site/'public'),str(site/'router.php')],stdout=f,stderr=subprocess.STDOUT,cwd=root)
              ready=False
              for _ in range(35):
                  try:
                      with urllib.request.urlopen('http://127.0.0.1:8000/setup.php',timeout=2) as rsp:ready=rsp.status==200
                  except Exception:pass
                  if ready:break
                  time.sleep(1)
              if not ready:
                  p.terminate()
                  raise RuntimeError('HTTP_SETUP_UNREADY')
              rc=logrun(['python3','target/tests/e2e/full_install_probe.py','--root',str(site),'--base','http://127.0.0.1:8000','--engine','sqlite','--mode','clean'],'install-'+suffix+'.log',120)
              if rc:
                  p.terminate()
                  raise RuntimeError('REAL_OWNER_INSTALL_FAILURE')
              return p,f
          def stop(p,f):
              if p is not None:
                  p.terminate()
                  try:p.wait(timeout=5)
                  except subprocess.TimeoutExpired:p.kill()
              if f is not None:f.close()
          def marker(msg):
              print(msg,flush=True)
          marker('P02_PUBLIC_CHROMIUM_START=PASS')
          # A fresh, independent test site isolates the original Markdown import.
          p=f=None
          try:
              p,f=server_for('isolated-markdown')
              marker('P02_PUBLIC_CHROMIUM_ISOLATED_MD_OWNER_INSTALL=PASS')
              script=(src/'tests/e2e/standalone_markdown.browser.cjs').read_text()
              anchor='    page.setDefaultTimeout(16000);'
              if script.count(anchor)!=1:raise RuntimeError('MD_SOURCE_ANCHOR')
              additions=[
                  "    page.on('response', r => { const p=new URL(r.url()).pathname; if(p==='/materials-import-preview') console.log('P02_DIAG_PREVIEW_HTTP='+r.status()); if(p==='/materials-import-markdown') console.log('P02_DIAG_IMPORT_HTTP='+r.status()); });",
                  "    page.on('framenavigated', f => { if(f===page.mainFrame()){ const p=new URL(f.url()).pathname; if(['/login','/materials','/settings/transfer'].includes(p)) console.log('P02_DIAG_ROUTE='+p.replaceAll('/','_')); }});",
                  "    page.on('pageerror', e => console.log('P02_DIAG_BROWSER_EXCEPTION='+e.name));",
              ]
              script=script.replace(anchor,anchor+'\n'+'\n'.join(additions))
              catch="console.error('P02_SINGLE_MD_CHECKPOINT=' + checkpoint, String(error));"
              if script.count(catch)!=1:raise RuntimeError('MD_SOURCE_CATCH')
              script=script.replace(catch,"console.error('P02_DIAG_MD_CHECKPOINT=' + checkpoint);")
              path=lab/'instrumented-standalone.cjs'
              path.write_text(script)
              rc=logrun(['node',str(path)],'instrumented-md.log',110)
              raw=(lab/'instrumented-md.log').read_text(errors='replace')
              for line in raw.splitlines():
                  if re.fullmatch(r'P02_DIAG_(PREVIEW_HTTP|IMPORT_HTTP)=[1-5][0-9]{2}',line) or re.fullmatch(r'P02_DIAG_ROUTE=_(?:login|materials|settings_transfer)',line) or re.fullmatch(r'P02_DIAG_MD_CHECKPOINT=(startup|login|transfer|read-only-preview|confirm|done)',line) or re.fullmatch(r'P02_DIAG_BROWSER_EXCEPTION=[A-Za-z]{1,30}',line):
                      marker(line)
              marker('P02_PUBLIC_CHROMIUM_ISOLATED_MD='+('PASS' if rc==0 else 'FAIL'))
          finally:
              stop(p,f)
          # A new SECOND site is used for the unchanged, full original 12.
          p=f=None
          try:
              p,f=server_for('exact-twelve')
              marker('P02_PUBLIC_CHROMIUM_FRESH_BATCH_OWNER_INSTALL=PASS')
              rc=logrun(['bash','target/tests/e2e/run_final_stage_batch.sh'],'original-stage6-12.log',1050)
              raw=(lab/'original-stage6-12.log').read_text(errors='replace')
              passed=re.findall(r'(?m)^P02_STAGE6_PASSED_FLOW=([a-z0-9_.-]+)$',raw)
              for name in passed:
                  if name in names: marker('P02_PUBLIC_CHROMIUM_PASSED_FLOW='+name)
              fail=re.findall(r'(?m)^P02_STAGE6_FAILED_FLOW=([a-z0-9_.-]+)$',raw)
              marker('P02_PUBLIC_CHROMIUM_FAILED_FLOW='+(fail[-1] if fail and fail[-1] in names else 'NONE'))
              marker('P02_PUBLIC_CHROMIUM_PASSED_COUNT='+str(len([x for x in passed if x in names])))
              correct=rc==0 and passed==list(names) and 'P02_STAGE6_SYNTHETIC_BROWSER_FLOWS=12_PASS' in raw
              marker('P02_PUBLIC_CHROMIUM_BATCH='+('PASS_12' if correct else 'FAIL'))
              if not correct:sys.exit(2)
          finally:
              stop(p,f)
          PY
      - name: Always remove private source and ephemeral runtime
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          rm -rf -- control target "$RUNNER_TEMP/p02-stage6-exact" "$RUNNER_TEMP/p02-playwright-tools"
          test ! -e control && test ! -e target && test ! -e "$RUNNER_TEMP/p02-stage6-exact"
          echo P02_PUBLIC_CHROMIUM_PRIVATE_CLEAN=PASS
