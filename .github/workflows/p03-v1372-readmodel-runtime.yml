name: P03 V1.37.2 Read Model Runtime

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p03-v1372-project-intelligence-integrity.yml'
      - '.github/workflows/p03-v1372-readmodel-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  P03_REPOSITORY: llhzx2018/vf-forge
  P03_BRANCH: maintenance/v1.37.2-project-intelligence-integrity

jobs:
  read-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout private P03 maintenance branch
        uses: actions/checkout@v4
        with:
          repository: ${{ env.P03_REPOSITORY }}
          ref: ${{ env.P03_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: p03
      - name: Run resilient data composition fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 >/dev/null
          cd p03
          python3 scripts/finalize_v1372.py
          php -l src/app/ProjectIntelligenceReadModel.php
          php tests/integration/project_intelligence_v1372_read_model_test.php
          echo 'P03_V1372_DATA_INTEGRITY_FIXTURE=PASS'
          echo 'PRODUCTION_WRITE=NO'
