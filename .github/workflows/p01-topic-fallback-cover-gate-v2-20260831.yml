name: P01 Topic Fallback Cover Gate V2
on:
  push:
    branches: [task/p01-topic-fallback-cover-gate-20260831]
    paths: [.github/workflows/p01-topic-fallback-cover-gate-v2-20260831.yml]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE: 324401d90652333193dfef2d1f23e94382711a53
      TREE: f54a48c37ffcd9b0016f78e468fa680cabcd39ce
      BASE: 1720dbeec8fc99c85f1b5000d221ead456ed3dc7
      ROOT: /tmp/p01-topic-fallback-v2
      EVID: /tmp/p01-topic-fallback-v2-evid
      PORT: '18402'
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Exact source and one-file fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$SOURCE"
          test "$(git -C product rev-parse HEAD^{tree})" = "$TREE"
          test "$(git -C product merge-base "$BASE" HEAD)" = "$BASE"
          test "$(git -C product diff --name-only "$BASE"...HEAD)" = src/assets/resource-media.css
          test "$(cat product/VERSION)" = '2.35.0'
          grep -F 'topic fallback cover identity' product/src/assets/resource-media.css >/dev/null
          echo P01_TOPIC_FALLBACK_SOURCE_FENCE=PASS
      - name: Fresh topics fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$ROOT" "$EVID" /tmp/p01-topic-fallback-v2.cookies
          mkdir -p "$EVID"
          cp -a product/src "$ROOT"
          php -S 127.0.0.1:$PORT -t "$ROOT" >"$EVID/server.log" 2>&1 & echo $! >/tmp/p01-topic-fallback-v2.pid
          READY=0
          for i in $(seq 1 60); do if curl -fsS -c /tmp/p01-topic-fallback-v2.cookies -b /tmp/p01-topic-fallback-v2.cookies "http://127.0.0.1:$PORT/setup.php" -o /tmp/p01-topic-fallback-v2-setup.html; then READY=1; break; fi; sleep .25; done
          test "$READY" = 1
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-topic-fallback-v2-setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c /tmp/p01-topic-fallback-v2.cookies -b /tmp/p01-topic-fallback-v2.cookies -X POST "http://127.0.0.1:$PORT/setup.php" --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=Topic Fallback Gate V2' --data-urlencode 'admin_password=TopicFallback2026' --data-urlencode 'admin_password_confirm=TopicFallback2026' -o /tmp/p01-topic-fallback-v2-post.html
          php "$ROOT/cli/verify.php" | grep -Fx VERIFY_PASS=YES >/dev/null
          cat >/tmp/p01-topic-fallback-v2-seed.php <<'PHP'
          <?php
          require '/tmp/p01-topic-fallback-v2/app/bootstrap.php';
          require_once '/tmp/p01-topic-fallback-v2/app/SurfaceRepository.php';
          $r=new VfRepository(vf_db());$s=new VfSurfaceRepository(vf_db());
          $c=$r->createCategory(['name'=>'专题验证','description'=>'','is_private'=>false]);
          foreach(['独立网站出海指南','VPS 迁移专题','Web 安全学习路线','SEO 赚钱完整指南'] as $i=>$title){
            $x=$r->saveLink(null,['category_id'=>$c,'title'=>$title,'url'=>'https://example.com/topic-fallback-'.$i,'description'=>'长期专题知识页','tags'=>'专题,指南','is_private'=>$i===3,'is_favorite'=>$i===0],'manual');
            $s->upsertProfile((int)$x['id'],['surface'=>'topics','resource_kind'=>$i%2?'学习路线':'指南','surface_note'=>'长期维护']);
          }
          echo "P01_TOPIC_FALLBACK_SEED=PASS\n";
          PHP
          php /tmp/p01-topic-fallback-v2-seed.php | grep -Fx P01_TOPIC_FALLBACK_SEED=PASS
      - name: Chromium fallback identity and responsive gate
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-topic-fallback-v2-pw
          cd /tmp/p01-topic-fallback-v2-pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat >gate.cjs <<'JS'
          const {chromium}=require('playwright'),fs=require('fs');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const c=await b.newContext({viewport:{width:1440,height:900}});
            const login=await c.request.post('http://127.0.0.1:18402/api.php?action=login',{data:{password:'TopicFallback2026'}});if(!login.ok()||!(await login.json()).ok)throw Error('login');
            const p=await c.newPage(),metrics={};
            for(const [w,h,size] of [[1440,900,'1440'],[390,844,'390']]){
              await p.setViewportSize({width:w,height:h});await p.goto('http://127.0.0.1:18402/topics.php',{waitUntil:'networkidle'});await p.waitForTimeout(160);
              for(const theme of ['light','dark']){
                await p.evaluate(t=>document.documentElement.setAttribute('data-theme',t),theme);await p.waitForTimeout(100);
                const m=await p.evaluate(()=>{
                  const covers=[...document.querySelectorAll('.vf-topic-cover')],badge=document.querySelector('.vf-topic-cover>b');
                  if(!badge) return {missing:true};
                  const cs=getComputedStyle(badge),after=getComputedStyle(badge,'::after'),cover=getComputedStyle(badge.parentElement);
                  return {count:covers.length,images:document.querySelectorAll('.vf-topic-cover img').length,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,width:Math.round(badge.getBoundingClientRect().width),height:Math.round(badge.getBoundingClientRect().height),opacity:cs.opacity,color:cs.color,bg:cs.backgroundColor,after:after.content,afterColor:after.color,coverBg:cover.backgroundImage};
                });
                if(m.missing||m.count!==4||m.images!==0||m.overflow>1||m.opacity!=='1'||m.after!=='"专题"')throw Error(`${size}-${theme} ${JSON.stringify(m)}`);
                const expected=size==='390'?42:52;if(Math.abs(m.width-expected)>1||Math.abs(m.height-expected)>1)throw Error(`${size}-${theme}-badge ${JSON.stringify(m)}`);
                if(!m.coverBg||m.coverBg==='none')throw Error(`${size}-${theme}-coverbg ${JSON.stringify(m)}`);
                metrics[`${size}-${theme}`]=m;
                await p.screenshot({path:`${process.env.EVID}/topics-${size}-${theme}.png`,fullPage:true});
              }
            }
            fs.writeFileSync(process.env.EVID+'/metrics.json',JSON.stringify(metrics,null,2));
            fs.writeFileSync(process.env.EVID+'/visual-verdict.txt',`P01_TOPIC_FALLBACK_COVER=PASS\nSOURCE=${process.env.SOURCE}\n`);
            await b.close();console.log('P01_TOPIC_FALLBACK_COVER=PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          EVID="$EVID" SOURCE="$SOURCE" node gate.cjs 2>&1 | tee "$EVID/result.txt"
          grep -Fx P01_TOPIC_FALLBACK_COVER=PASS "$EVID/result.txt"
      - name: Regression and SQLite through application authority
        shell: bash
        run: |
          set -Eeuo pipefail
          php "$ROOT/cli/verify.php" | tee "$EVID/verify.txt" | grep -Fx VERIFY_PASS=YES
          php "$ROOT/cli/surface-verify.php" | tee "$EVID/surface-verify.txt" | grep -Fx CURRENT_DOMAIN_PASS=YES
          ROOT="$ROOT" php <<'PHP' | tee "$EVID/sqlite.txt"
          <?php
          require getenv('ROOT').'/app/bootstrap.php';
          $db=vf_db();
          $integrity=strtolower((string)$db->query('PRAGMA integrity_check')->fetchColumn());
          $fk=$db->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC);
          if($integrity!=='ok'||$fk){fwrite(STDERR,json_encode(['integrity'=>$integrity,'fk'=>$fk],JSON_UNESCAPED_UNICODE)."\n");exit(1);}
          echo "P01_TOPIC_FALLBACK_SQLITE=PASS\n";
          PHP
          grep -Fx P01_TOPIC_FALLBACK_SQLITE=PASS "$EVID/sqlite.txt"
          cat > "$EVID/verdict.txt" <<EOF
          P01_TOPIC_FALLBACK_COVER_GATE=PASS
          P01_TOPIC_FALLBACK_REGRESSION=PASS
          SOURCE=$SOURCE
          TREE=$TREE
          PRODUCT_BYTES_CHANGED=CSS_ONLY
          EOF
          cat "$EVID/verdict.txt"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-topic-fallback-cover-v2-${{ github.run_id }}
          path: ${{ env.EVID }}
          if-no-files-found: error
          retention-days: 30
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/p01-topic-fallback-v2.pid 2>/dev/null)" 2>/dev/null || true
