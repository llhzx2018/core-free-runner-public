name: P02 V2.5.80 Detail Bug Audit

on:
  push:
    branches:
      - audit/p02-v2580-detail-bugs-20260921
    paths:
      - '.github/workflows/p02-v2580-detail-bug-audit.yml'
      - 'requests/p02-v2580-detail-audit/**'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout audit harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner

      - name: Require private read capability
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: test -n "$PRIVATE_READ_TOKEN"

      - name: Checkout exact P02 V2.5.80 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 01c6915a9843089064b539bb4811c70d993b9b8d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, zip, curl, mbstring, openssl
          coverage: none

      - name: Install Playwright Chromium
        working-directory: product
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Run full detail audit
        run: bash runner/requests/p02-v2580-detail-audit/run.sh product

      - name: Remove transient private checkout
        if: always()
        run: rm -rf product
