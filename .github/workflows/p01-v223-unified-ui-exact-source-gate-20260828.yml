name: P01 V2.23 Unified Surface UI Exact Source Gate

on:
  push:
    branches:
      - task/p01-v222-multi-surface-gate-20260828
    paths:
      - '.github/workflows/p01-v223-unified-ui-exact-source-gate-20260828.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      FEATURE_BRANCH: feature/p01-unified-surface-ui-v223-20260828
      EXACT_SOURCE: 35926810f1f59738b3b47f7dff690253f4da0e1b
      BASE_MAIN: 45503b3a6483ea89a6b076822b3661a9b32bcbf4
      VERSION: 2.22.1
      SCHEMA: '2026082801'
      TARGET_RELEASE: 2.23.0
    steps:
      - name: Checkout exact feature source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.EXACT_SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: p01
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - name: Exact identity and source boundary
        env:
          READ_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p01
          test "$(git rev-parse HEAD)" = "$EXACT_SOURCE"
          test "$(git ls-remote "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "refs/heads/${FEATURE_BRANCH}" | awk '{print $1}')" = "$EXACT_SOURCE"
          test "$(git ls-remote "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" refs/heads/main | awk '{print $1}')" = "$BASE_MAIN"
          test "$(tr -d '\r\n' < VERSION)" = "$VERSION"
          test "$(tr -d '\r\n' < src/VERSION.txt)" = "$VERSION"
          mapfile -t files < <(git diff --name-only "$BASE_MAIN...$EXACT_SOURCE")
          printf '%s\n' "${files[@]}"
          for f in "${files[@]}"; do
            case "$f" in
              src/index.php|src/start.php|src/surface.php|src/surfaces.php|src/assets/surface-home.css|src/assets/surface-home.js) ;;
              *) echo "unexpected UI scope file: $f" >&2; exit 1;;
            esac
          done
          test "${#files[@]}" -eq 6
          echo P01_V223_UI_IDENTITY_BOUNDARY=PASS
      - name: PHP and JavaScript syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          find p01/src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find p01/src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          echo P01_V223_UI_SYNTAX=PASS
      - name: Fresh install seed and baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-v223-ui /tmp/p01-v223.cookies
          cp -a p01/src /tmp/p01-v223-ui
          cd /tmp/p01-v223-ui
          php -S 127.0.0.1:18233 -t . >/tmp/p01-v223-ui-server.log 2>&1 & echo $! >/tmp/p01-v223-ui.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18233/setup.php -o /tmp/p01-v223-setup.html && break; sleep 1; done
          curl -fsS -c /tmp/p01-v223.cookies -b /tmp/p01-v223.cookies http://127.0.0.1:18233/setup.php -o /tmp/p01-v223-setup.html
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-v223-setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c /tmp/p01-v223.cookies -b /tmp/p01-v223.cookies -X POST http://127.0.0.1:18233/setup.php --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=VF Start V223 UI Gate' --data-urlencode 'admin_password=P01V223!UnifiedUI' --data-urlencode 'admin_password_confirm=P01V223!UnifiedUI' -o /tmp/p01-v223-setup-post.html
          php cli/verify.php | tee /tmp/p01-v223-verify.txt
          grep -Fx 'VERIFY_PASS=YES' /tmp/p01-v223-verify.txt
          php cli/surface-verify.php | tee /tmp/p01-v223-surface.txt
          grep -Fx 'MULTI_SURFACE_PASS=YES' /tmp/p01-v223-surface.txt
          grep -Fx "WORKING_SCHEMA=$SCHEMA" /tmp/p01-v223-surface.txt
          php cli/baseline-verify.php | tee /tmp/p01-v223-baseline.txt
          grep -Fx 'BASELINE_CORE_PASS=YES' /tmp/p01-v223-baseline.txt
          grep -Fx 'DRIFT_COUNT=0' /tmp/p01-v223-baseline.txt
          grep -Fx 'UNKNOWN_COUNT=0' /tmp/p01-v223-baseline.txt
          cat >/tmp/p01-v223-seed.php <<'PHP'
          <?php
          require '/tmp/p01-v223-ui/app/bootstrap.php';
          require_once '/tmp/p01-v223-ui/app/SurfaceRepository.php';
          $r=new VfRepository(vf_db());
          $s=new VfSurfaceRepository(vf_db());
          $c1=$r->createCategory(['name'=>'工具','description'=>'','is_private'=>false]);
          $a=$r->saveLink(null,['category_id'=>$c1,'title'=>'Cloudflare Dashboard','url'=>'https://dash.cloudflare.com/','description'=>'Cloudflare','is_private'=>false],'manual');
          $c2=$r->createCategory(['name'=>'科技','description'=>'','is_private'=>false]);
          $b=$r->saveLink(null,['category_id'=>$c2,'title'=>'硅谷101','url'=>'https://www.youtube.com/@TheValley101','description'=>'AI时代的芯片故事','is_private'=>false],'manual');
          $s->upsertProfile((int)$b['id'],['surface'=>'channels','resource_kind'=>'youtube','note'=>'频道','background_friendly'=>true]);
          $c3=$r->createCategory(['name'=>'电影','description'=>'','is_private'=>false]);
          $d=$r->saveLink(null,['category_id'=>$c3,'title'=>'测试电影','url'=>'https://example.com/movie','description'=>'测试','is_private'=>false],'manual');
          $s->upsertProfile((int)$d['id'],['surface'=>'watch','resource_kind'=>'movie','media_year'=>'2024','media_status'=>'want']);
          echo "P01_V223_UI_SEED=PASS\n";
          PHP
          php /tmp/p01-v223-seed.php
          test "$(php -r "require 'app/bootstrap.php'; echo strtolower((string)vf_db()->query('PRAGMA integrity_check')->fetchColumn());")" = ok
          test "$(php -r "require 'app/bootstrap.php'; echo count(vf_db()->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC));")" = 0
          echo P01_V223_UI_FRESH_BASELINE=PASS
      - name: Anonymous and authenticated route contract
        shell: bash
        run: |
          set -Eeuo pipefail
          # Anonymous public root remains the mature public navigator.
          code=$(curl -sS -o /tmp/p01-v223-public-root.html -w '%{http_code}' http://127.0.0.1:18233/)
          test "$code" = 200
          if grep -F 'vf-dashboard-columns' /tmp/p01-v223-public-root.html >/dev/null; then echo 'public root must not become owner dashboard' >&2; exit 1; fi
          # New private dashboard is independently reachable and real-data driven.
          curl -fsS http://127.0.0.1:18233/surfaces.php -o /tmp/p01-v223-public-surfaces.html
          grep -F 'vf-dashboard-columns' /tmp/p01-v223-public-surfaces.html >/dev/null
          grep -F 'surface-home.css' /tmp/p01-v223-public-surfaces.html >/dev/null
          grep -F 'Start' /tmp/p01-v223-public-surfaces.html >/dev/null
          grep -F 'Channels' /tmp/p01-v223-public-surfaces.html >/dev/null
          grep -F 'Watch' /tmp/p01-v223-public-surfaces.html >/dev/null
          curl -fsS http://127.0.0.1:18233/assets/surface-home.css | grep -F '.vf-dashboard-columns' >/dev/null
          curl -fsS http://127.0.0.1:18233/assets/surface-home.js | grep -F 'vf-surface-theme' >/dev/null
          # Authenticate using the actual P01 API and preserve the session cookie.
          curl -fsS -c /tmp/p01-v223-admin.cookies -b /tmp/p01-v223-admin.cookies -H 'Content-Type: application/json' -X POST 'http://127.0.0.1:18233/api.php?action=login' --data '{"password":"P01V223!UnifiedUI"}' | jq -e '.ok==true and (.csrf|length)>10' >/dev/null
          root_code=$(curl -sS -c /tmp/p01-v223-admin.cookies -b /tmp/p01-v223-admin.cookies -D /tmp/p01-v223-root.headers -o /tmp/p01-v223-root-auth.html -w '%{http_code}' http://127.0.0.1:18233/)
          test "$root_code" = 302
          grep -iE '^location: *surfaces\.php' /tmp/p01-v223-root.headers >/dev/null
          start_code=$(curl -sS -c /tmp/p01-v223-admin.cookies -b /tmp/p01-v223-admin.cookies -o /tmp/p01-v223-start.html -w '%{http_code}' http://127.0.0.1:18233/start.php)
          test "$start_code" = 200
          if grep -F 'vf-dashboard-columns' /tmp/p01-v223-start.html >/dev/null; then echo 'start.php must stay classic Start' >&2; exit 1; fi
          curl -fsS -c /tmp/p01-v223-admin.cookies -b /tmp/p01-v223-admin.cookies http://127.0.0.1:18233/surfaces.php -o /tmp/p01-v223-home.html
          grep -F 'vf-dashboard-columns' /tmp/p01-v223-home.html >/dev/null
          grep -F 'Cloudflare Dashboard' /tmp/p01-v223-home.html >/dev/null
          grep -F '硅谷101' /tmp/p01-v223-home.html >/dev/null
          grep -F '测试电影' /tmp/p01-v223-home.html >/dev/null
          curl -fsS -c /tmp/p01-v223-admin.cookies -b /tmp/p01-v223-admin.cookies http://127.0.0.1:18233/channels.php -o /tmp/p01-v223-channels.html
          grep -F 'vf-app-sidebar' /tmp/p01-v223-channels.html >/dev/null
          grep -F 'ANTI-ALGORITHM MEMORY' /tmp/p01-v223-channels.html >/dev/null
          grep -F '硅谷101' /tmp/p01-v223-channels.html >/dev/null
          curl -fsS -c /tmp/p01-v223-admin.cookies -b /tmp/p01-v223-admin.cookies http://127.0.0.1:18233/watch.php -o /tmp/p01-v223-watch.html
          grep -F 'vf-app-sidebar' /tmp/p01-v223-watch.html >/dev/null
          grep -F 'PERSONAL WATCHLIST' /tmp/p01-v223-watch.html >/dev/null
          grep -F '测试电影' /tmp/p01-v223-watch.html >/dev/null
          echo P01_V223_UI_ROUTE_CONTRACT=PASS
      - name: Final database and baseline regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/p01-v223-ui
          php cli/surface-verify.php | grep -Fx 'MULTI_SURFACE_PASS=YES'
          php cli/baseline-verify.php | tee /tmp/p01-v223-final-baseline.txt
          grep -Fx 'BASELINE_CORE_PASS=YES' /tmp/p01-v223-final-baseline.txt
          grep -Fx 'DRIFT_COUNT=0' /tmp/p01-v223-final-baseline.txt
          grep -Fx 'UNKNOWN_COUNT=0' /tmp/p01-v223-final-baseline.txt
          test "$(php -r "require 'app/bootstrap.php'; echo strtolower((string)vf_db()->query('PRAGMA integrity_check')->fetchColumn());")" = ok
          test "$(php -r "require 'app/bootstrap.php'; echo count(vf_db()->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC));")" = 0
          kill "$(cat /tmp/p01-v223-ui.pid)" 2>/dev/null || true
          echo P01_V223_UI_REGRESSION=PASS
      - name: Verdict
        shell: bash
        run: |
          echo P01_V223_UI_EXACT_SOURCE="$EXACT_SOURCE"
          echo P01_V223_UI_MACHINE=PASS
          echo TARGET_RELEASE="$TARGET_RELEASE"
          echo SCHEMA="$SCHEMA"
          echo PRODUCTION=NO
