name: TEMP S01-C02 Ops 1.21.801 Update Channel Gate

on:
  push:
    branches:
      - temp/s01-c02-v121801-update-channel-gate-20260904
    paths:
      - '.github/workflows/temp-s01-c02-v121801-update-channel-gate.yml'

permissions:
  contents: read

jobs:
  update-channel-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CORE_CANDIDATE_SHA: 178ad7dc788be33d58fcff602446814b7abfc1be
      OPS_RELEASE_SHA: 897d34c3153ca2a6d7cfa289cca7fd9966062f17
      OPS_RELEASE_TREE: df5c1d60cd944bc630b817852da5cec3e92c536d
      RELEASE_ID: '382604442'
      ASSET_ID: '544086359'
      ASSET_NAME: vf-tools-ops_V1.21.801.zip
      ASSET_BYTES: '3203056'
      ASSET_SHA256: e0491a69ddcd794821d8a95ca3760e7a32d1fcc1cd8fd100e0e3b5d9609c598f
      RUNTIME_FILES: '895'
      RUNTIME_FP: 3041d889bc814d8ab0d356bb468185bd52ed622cbf39f65062ab59a2f33af363
    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CORE_CANDIDATE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: updates

      - name: Verify candidate identity and UpdateCore regression
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C updates rev-parse HEAD)" = "$CORE_CANDIDATE_SHA"
          jq empty updates/projects/S01-C02.json
          find updates/update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php updates/update-core/php/tests/run.php
          echo UPDATE_CORE_REGRESSION=PASS

      - name: Verify exact direct 1.21.800 to 1.21.801 manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          FILE=updates/projects/S01-C02.json
          jq -e --arg sha "$ASSET_SHA256" --arg fp "$RUNTIME_FP" '
            .schema_version=="wp-component-1.0" and
            .project_id=="S01" and
            .component_id=="S01-C02" and
            .component_type=="PLUGIN" and
            .target_version=="1.21.801" and
            .from_versions==["1.21.800"] and
            .release_tag=="v1.21.801" and
            .asset_name=="vf-tools-ops_V1.21.801.zip" and
            .asset_bytes==3203056 and
            .asset_sha256==$sha and
            .runtime_files==895 and
            .runtime_fingerprint==$fp and
            .runtime_file_count==895 and
            .runtime_fingerprint_sha256==$fp and
            .schema_from=="6.0.0" and
            .schema_to=="6.0.0" and
            .backup_required==true and
            .rollback_supported==true and
            .physical_locator=="vf-ops/vf-ops.php" and
            .locator_cutover==false
          ' "$FILE" >/dev/null
          echo S01_C02_1_21_801_MANIFEST_IDENTITY=PASS

      - name: Verify exact released tag asset and ZIP bytes
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          REL="$(curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.801')"
          test "$(jq -r '.id' <<<"$REL")" = "$RELEASE_ID"
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.id' <<<"$REL")" = "$ASSET_ID"
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.size' <<<"$REL")" = "$ASSET_BYTES"
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.digest' <<<"$REL")" = "sha256:${ASSET_SHA256}"
          TAG="$(curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/llhzx2018/vf-tools-ops/git/ref/tags/v1.21.801')"
          test "$(jq -r '.object.sha' <<<"$TAG")" = "$OPS_RELEASE_SHA"
          COMMIT="$(curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/llhzx2018/vf-tools-ops/git/commits/${OPS_RELEASE_SHA}")"
          test "$(jq -r '.tree.sha' <<<"$COMMIT")" = "$OPS_RELEASE_TREE"
          curl -fsSL -L --retry 3 -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/octet-stream' "https://api.github.com/repos/llhzx2018/vf-tools-ops/releases/assets/${ASSET_ID}" -o /tmp/$ASSET_NAME
          test "$(stat -c '%s' /tmp/$ASSET_NAME)" = "$ASSET_BYTES"
          test "$(sha256sum /tmp/$ASSET_NAME | awk '{print $1}')" = "$ASSET_SHA256"
          unzip -tq /tmp/$ASSET_NAME >/dev/null
          unzip -Z1 /tmp/$ASSET_NAME | grep -Fxq 'vf-ops/includes/site-release/s01-project-authority.runtime.json'
          unzip -p /tmp/$ASSET_NAME vf-ops/includes/site-release/s01-project-authority.runtime.json | jq -e '.project_id=="S01" and .component_id=="S01-C02" and .search_analytics.final_public_host=="https://ilovem3u8.com"' >/dev/null
          unzip -p /tmp/$ASSET_NAME vf-ops/vf-ops.php | grep -Fq "elseif (\$vfOpsS01Action === 'vf_ops_s01_seo_confirm_formal_primary_v121798')"
          echo S01_C02_RELEASE_ASSET_EXACT_READBACK=PASS

      - name: Verify direct-source contract remains fail closed
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          p=json.load(open('updates/projects/S01-C02.json'))
          assert p['from_versions']==['1.21.800']
          for old in ['1.21.797','1.21.798','1.21.799']:
              assert old not in p['from_versions']
          assert p['target_version']=='1.21.801'
          print('DIRECT_SOURCE_1_21_800_ONLY=PASS')
          PY
          grep -Fq 'Candidate Gate run 33857507226 PASS' updates/projects/S01-C02.json
          grep -Fq 'Formal Release run 33857780172 PASS' updates/projects/S01-C02.json
          echo UPDATE_CHANNEL_GATE=PASS
