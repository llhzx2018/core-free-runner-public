name: P01 V2.30 Publication
on:
  push:
    branches: [task/p01-v230-domain-nav-shell-20260829]
    paths: [.github/workflows/p01-v230-publication-20260829.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Publication precheck
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/vf-start/branches/main --jq .commit.sha)" = 40b2d5239c557ab6c7b9aaaa092acffa9fb926f9
          test "$(gh api repos/llhzx2018/vf-start/contents/VERSION?ref=main --jq .content | tr -d '\n' | base64 -d | tr -d '\r\n')" = 2.30.0
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33237382066 --jq .conclusion)" = success
          if gh api repos/llhzx2018/vf-start/git/ref/tags/v2.30.0 >/dev/null 2>&1; then echo 'v2.30.0 tag already exists'; exit 2; fi
          if gh api repos/llhzx2018/vf-start/releases/tags/v2.30.0 >/dev/null 2>&1; then echo 'v2.30.0 release already exists'; exit 3; fi
          echo P01_V230_PUBLICATION_PRECHECK=PASS
      - name: Fetch exact PASS artifact
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-v230-publish /tmp/p01-v230-artifact.zip
          mkdir -p /tmp/p01-v230-publish
          gh api --method GET repos/llhzx2018/core-free-runner-public/actions/artifacts/9710319537/zip > /tmp/p01-v230-artifact.zip
          unzip -q /tmp/p01-v230-artifact.zip -d /tmp/p01-v230-publish
          cd /tmp/p01-v230-publish
          sha256sum -c SHA256SUMS.txt
          test "$(stat -c%s VF-Start-V2.30.0-FULL.zip)" = 615286
          test "$(stat -c%s VF_Start_V2.30.0_UPDATE.zip)" = 1328072
          test "$(stat -c%s repair-v2.30.0.php)" = 3821201
          test "$(sha256sum VF-Start-V2.30.0-FULL.zip | awk '{print $1}')" = 3bbafe93403294f1d6e4296a1828de46160f8cc2066702d538dd9d6674c95c10
          test "$(sha256sum VF_Start_V2.30.0_UPDATE.zip | awk '{print $1}')" = 65869be49eb094d2be97609aa4fd588aeed737b97695882fc3b216eaf20edcb0
          test "$(sha256sum repair-v2.30.0.php | awk '{print $1}')" = 318a382da01a572ab18ba137bf5a80f119af3f0afec3e36cb9dcb56db2c50089
          jq -e '.formal_artifact_gate=="PASS" and .release_source=="40b2d5239c557ab6c7b9aaaa092acffa9fb926f9" and .product_source=="426740ee3e36d207581dddf9b3fe5d62fd8d1808" and .schema=="2026082901" and .schema_change==false and .owner_production_write==false' P01-V2.30.0-FORMAL-METADATA.json >/dev/null
          echo P01_V230_EXACT_PASS_ARTIFACT=PASS
      - name: Create immutable tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api --method POST repos/llhzx2018/vf-start/git/refs -f ref=refs/tags/v2.30.0 -f sha=40b2d5239c557ab6c7b9aaaa092acffa9fb926f9 >/tmp/p01-v230-tag.json
          test "$(jq -r .object.sha /tmp/p01-v230-tag.json)" = 40b2d5239c557ab6c7b9aaaa092acffa9fb926f9
          cat >/tmp/p01-v230-notes.md <<'EOF'
          VF Start V2.30.0 完成资源域导航与子域 UX/UI 精修。

          - 固定全局五域切换：首页 / 导航 / 频道 / 影视 / 专题。
          - 导航恢复完整层级分类树、0 项分类与移动端分类选择器。
          - 频道、影视、专题分别采用更符合内容类型的浏览密度与卡片结构。
          - 移动端恢复“搜索当前资源 + 添加”的真实命令行。
          - 继续保持 Public / Private 数据边界与现有 Atomic 写入 Authority。
          - Schema 保持 2026082901 不变。
          - 支持从 V2.29.0 Atomic 升级；正式 Artifact Gate 33237382066 PASS。
          - 本 Release 不自动写 Owner Production。
          EOF
          cd /tmp/p01-v230-publish
          gh release create v2.30.0 \
            P01-V2.30.0-ARTIFACT-GATE.json \
            P01-V2.30.0-FORMAL-METADATA.json \
            SHA256SUMS.txt \
            VF-Start-V2.30.0-FULL.zip \
            VF-Start-V2.30.0-UPDATE.zip \
            VF_Start_V2.30.0_UPDATE.zip \
            atomic-self-test.json \
            repair-v2.30.0.php \
            --repo llhzx2018/vf-start --title 'VF Start V2.30.0' --notes-file /tmp/p01-v230-notes.md --verify-tag
          gh api repos/llhzx2018/vf-start/releases/tags/v2.30.0 > /tmp/p01-v230-release.json
          test "$(jq -r .tag_name /tmp/p01-v230-release.json)" = v2.30.0
          test "$(jq -r .draft /tmp/p01-v230-release.json)" = false
          test "$(jq -r .prerelease /tmp/p01-v230-release.json)" = false
          test "$(jq '.assets|length' /tmp/p01-v230-release.json)" = 8
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.30.0_UPDATE.zip")|.size' /tmp/p01-v230-release.json)" = 1328072
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.30.0_UPDATE.zip")|.digest' /tmp/p01-v230-release.json)" = sha256:65869be49eb094d2be97609aa4fd588aeed737b97695882fc3b216eaf20edcb0
          test "$(jq -r '.assets[]|select(.name=="VF-Start-V2.30.0-FULL.zip")|.digest' /tmp/p01-v230-release.json)" = sha256:3bbafe93403294f1d6e4296a1828de46160f8cc2066702d538dd9d6674c95c10
          test "$(jq -r '.assets[]|select(.name=="repair-v2.30.0.php")|.digest' /tmp/p01-v230-release.json)" = sha256:318a382da01a572ab18ba137bf5a80f119af3f0afec3e36cb9dcb56db2c50089
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.30.0 --jq .object.sha)" = 40b2d5239c557ab6c7b9aaaa092acffa9fb926f9
          echo P01_V230_TAG_REMOTE_READBACK=PASS
          echo P01_V230_GITHUB_RELEASE=PASS
          echo CORE_UPDATES_WRITE=NO
          echo OWNER_PRODUCTION_WRITE=NO
      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-v230-publication-${{ github.run_id }}
          path: |
            /tmp/p01-v230-tag.json
            /tmp/p01-v230-release.json
          if-no-files-found: warn
