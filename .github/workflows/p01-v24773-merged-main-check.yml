name: p01-v24773-merged-main-check

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v24773-merged-main-check.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      TARGET_SHA: 5a90fa61b0e446444b49f8de58438d2de5e9acda
      TARGET_TREE: 9e6fe0e775e95dfb237471a569f604062f267218
      STABLE_SHA: cd176611a24be2dd90155ce84b6b89fab2915150
      STABLE_TAG: v2.47.72
      VERSION: 2.47.73
    steps:
      - name: Checkout runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout exact merged main and stable baseline
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          remote_main="$(git ls-remote "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" refs/heads/main | awk '{print $1}')"
          test "$remote_main" = "$TARGET_SHA"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" candidate
          git -C candidate fetch -q --depth 1 origin "$TARGET_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "$VERSION"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "$VERSION"
          git clone -q --depth 1 --branch "$STABLE_TAG" "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" stable
          test "$(git -C stable rev-parse HEAD)" = "$STABLE_SHA"
          echo P01_V24773_MERGED_MAIN_EXACT_SOURCE=PASS

      - name: Prepare PHP
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd unzip >/dev/null
          php -m | grep -Fx pdo_sqlite
          php -m | grep -Fx sqlite3
          php -m | grep -Fx curl

      - name: Exact diff boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C candidate fetch -q --depth 1 origin "$STABLE_SHA"
          git -C candidate diff --name-only "$STABLE_SHA" "$TARGET_SHA" | sort >/tmp/diff.txt
          cat >/tmp/allowed.txt <<'EOF'
          VERSION
          src/VERSION.txt
          src/app/AdminShell.php
          src/app/SystemHealth.php
          src/app/bootstrap.php
          src/assets/admin-pages.css
          src/assets/jobs.css
          src/assets/jobs.js
          src/assets/system.js
          src/jobs.php
          src/system-health.php
          tests/unit/admin_backend_coverage_r60_contract.php
          tests/unit/admin_retired_routes_css_r32_contract.php
          tests/unit/admin_scheduled_tasks_center_contract.php
          tests/unit/admin_secondary_nav_focus_contract.php
          tests/unit/admin_system_capabilities_r62_contract.php
          tests/unit/admin_system_group_polish_r69_contract.php
          tests/unit/engineering_consistency_r80_contract.php
          tests/unit/system_health_cron_diagnostic_contract.php
          EOF
          sort -o /tmp/allowed.txt /tmp/allowed.txt
          diff -u /tmp/allowed.txt /tmp/diff.txt
          test -z "$(git -C candidate diff "$STABLE_SHA" "$TARGET_SHA" -- src/app/Auth.php src/app/Repository.php src/app/Seo.php src/app/DataSafety.php src/migrations)"
          echo P01_V24773_MERGED_MAIN_DIFF_BOUNDARY=PASS

      - name: Focused scheduled tasks contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l candidate/src/jobs.php >/dev/null
          php -l candidate/src/app/SystemHealth.php >/dev/null
          tests=(
            tests/unit/engineering_consistency_r80_contract.php
            tests/unit/admin_scheduled_tasks_center_contract.php
            tests/unit/admin_secondary_nav_focus_contract.php
            tests/unit/admin_retired_routes_css_r32_contract.php
            tests/unit/admin_system_capabilities_r62_contract.php
            tests/unit/admin_system_group_polish_r69_contract.php
            tests/unit/admin_backend_coverage_r60_contract.php
            tests/unit/system_health_cron_diagnostic_contract.php
            tests/unit/system_health_cron_runtime_proof.php
          )
          for t in "${tests[@]}"; do php "candidate/$t"; done
          echo P01_V24773_MERGED_MAIN_FOCUSED=PASS

      - name: Canonical zero-debt regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate stable --require-zero-debt | tee /tmp/p01-v24773-merged-main-canonical.txt
          grep -Fx 'P01_CANONICAL_CURRENT_FAILURE_COUNT=0' /tmp/p01-v24773-merged-main-canonical.txt
          grep -Fx 'P01_CANONICAL_NEW_REGRESSION_COUNT=0' /tmp/p01-v24773-merged-main-canonical.txt
          grep -Fx 'P01_CANONICAL_LEGACY_TEST_DEBT_COUNT=0' /tmp/p01-v24773-merged-main-canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/p01-v24773-merged-main-canonical.txt
          test "$(git -C candidate status --porcelain)" = ""
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          echo P01_V24773_MERGED_MAIN_CANONICAL=PASS
          echo P01_V24773_MERGED_MAIN_PREFLIGHT=PASS
