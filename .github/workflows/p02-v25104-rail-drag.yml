name: P02 V2.5.104 Visible Rail Drag Browser

on:
  push:
    branches:
      - run/p02-v25104-rail-drag-20260924
    paths:
      - '.github/workflows/p02-v25104-rail-drag.yml'

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact P02 V2.5.104 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 3cba5c78254f51a2bef267d0d47023e6d77a92b4
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product

      - name: Install runtime and Chromium
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-zip sqlite3 curl
          cd product
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Exact-source rail contract
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "3cba5c78254f51a2bef267d0d47023e6d77a92b4"
          test "$(cat VERSION)" = "2.5.104"
          node tests/unit/p02_v25104_rail_drag_bugfix.mjs
          python3 scripts/generate-source-manifest.py
          git diff --exit-code -- SOURCE_MANIFEST.json SOURCE_MANIFEST.txt
          python3 scripts/verify-source-manifest.py

      - name: Launch clean V2.5.104 site
        working-directory: product
        env:
          TEST_PASSWORD: "VF-P02-V25104-RAIL-${{ github.run_id }}!"
        run: |
          set -Eeuo pipefail
          SITE="${RUNNER_TEMP}/p02-v25104-site"
          COOKIE="${RUNNER_TEMP}/p02-v25104-cookie.txt"
          BASE="http://127.0.0.1:18104"
          bash scripts/build-deploy-tree.sh "$SITE"
          test "$(cat "$SITE/VERSION.txt")" = "2.5.104"
          php -d display_errors=0 -S 127.0.0.1:18104 -t "$SITE" >"${RUNNER_TEMP}/p02-v25104-server.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/p02-v25104-server.pid"
          for _ in $(seq 1 80); do curl -fsS "$BASE/setup.php" >/dev/null 2>&1 && break; sleep .25; done
          curl -fsS -c "$COOKIE" "$BASE/setup.php" > "${RUNNER_TEMP}/p02-v25104-setup.html"
          SETUP_CSRF="$(python3 -c 'import re,html,sys;s=open(sys.argv[1],encoding="utf-8").read();m=re.search(r"name=\"setup_csrf\" value=\"([^\"]+)\"",s);assert m;print(html.unescape(m.group(1)))' "${RUNNER_TEMP}/p02-v25104-setup.html")"
          STATUS="$(curl -sS -o /dev/null -w '%{http_code}' -b "$COOKIE" -c "$COOKIE" -H "Origin: $BASE" --data-urlencode "setup_csrf=$SETUP_CSRF" --data-urlencode "password=$TEST_PASSWORD" --data-urlencode "password_confirm=$TEST_PASSWORD" "$BASE/setup.php")"
          test "$STATUS" = "303"

      - name: Drag visible rails in real Chromium
        working-directory: product
        env:
          VF_UX_E2E_BASE_URL: http://127.0.0.1:18104
          VF_UX_E2E_PASSWORD: "VF-P02-V25104-RAIL-${{ github.run_id }}!"
          VF_UX_E2E_VERSION: "2.5.104"
        run: |
          set -Eeuo pipefail
          node tests/e2e/p02_v25104_rail_drag_bugfix.mjs

      - name: Stop clean site
        if: always()
        run: |
          if test -f "${RUNNER_TEMP}/p02-v25104-server.pid"; then
            kill "$(cat "${RUNNER_TEMP}/p02-v25104-server.pid")" 2>/dev/null || true
          fi
