name: P07 multiline host SQL gate exact-source proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-scratch-multiline-host-gate.yml'
      - 'experiments/p07-scratch-multiline-gate/**'
permissions:
  contents: read
jobs:
  host-boundary-synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact source and sealed overlay
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(cat dist/p07/0.1.0/overlay/BUILD_ID)" = 0.1.0-release112
          test "$(git hash-object experiments/p07-scratch-multiline-gate/lib/scratch_sql_host_policy.py)" = 4c1eaa1cdcfdacb26da5a12bcf7ce9abcb68012e
          test "$(git hash-object experiments/p07-scratch-multiline-gate/tests/test_scratch_sql_host_policy.py)" = 16d9ae0b181323811c9badc6ec3cf84ae154a671
          test "$(git hash-object experiments/p07-scratch-multiline-gate/tests/test_scratch_multiline_host_gate.py)" = 61dda57a42d658f747d930e48b8061dd844c53c1
          test "$(git hash-object experiments/p07-scratch-multiline-gate/tests/test_scratch_sealed_input.py)" = 4d17107f4420c372aba1ce0d718a9ed3081eba52
          test "$(git hash-object experiments/p07-scratch-multiline-gate/lib/server_migration_pull.py)" = 71fb59ad7d005b88e39cbeed4b3302c7f313bd06
          test "$(git hash-object experiments/p07-scratch-multiline-gate/tests/test_server_migration_pull.py)" = 04403482be20e46ed1752637c573119ea43d099e
          test "$(git hash-object experiments/p07-scratch-multiline-gate/tests/test_migration_no_overwrite_resume.py)" = b8477422097f60e1fc5eca579ec27f7bdf1ad1ec
          test "$(git hash-object experiments/p07-scratch-multiline-gate/lib/private_sql_literal_reconcile.py)" = 19ddfab465e27767c56e7abf6a853fddd4684cdd
          test "$(git hash-object experiments/p07-scratch-multiline-gate/lib/private_conflict_preservation.py)" = 8ab17d9d8bb1ca66f3574acc1f056c675c405a81
          test "$(git hash-object experiments/p07-scratch-multiline-gate/lib/migration_recovery_rehearsal.py)" = 4726bdfb7ad4e2e2f9691f89a53c30c15acff138
          cp -a dist/p07/0.1.0/overlay "$RUNNER_TEMP/p07-scratch-host-gate"
          for p in lib/scratch_sql_host_policy.py tests/test_scratch_sql_host_policy.py tests/test_scratch_multiline_host_gate.py tests/test_scratch_sealed_input.py lib/server_migration_pull.py tests/test_server_migration_pull.py tests/test_migration_no_overwrite_resume.py lib/private_sql_literal_reconcile.py lib/private_conflict_preservation.py lib/migration_recovery_rehearsal.py; do
            cp "experiments/p07-scratch-multiline-gate/$p" "$RUNNER_TEMP/p07-scratch-host-gate/$p"
          done
          cd "$RUNNER_TEMP/p07-scratch-host-gate"
          python3 -m py_compile lib/scratch_sql_host_policy.py tests/test_scratch_multiline_host_gate.py
          echo P07_MULTILINE_EXACT_SOURCE_PASS
      - name: Host input boundary and byte identity synthetic verification
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/p07-scratch-host-gate"
          PYTHONPATH=lib python3 -m unittest -v \
            tests.test_scratch_sql_host_policy \
            tests.test_scratch_multiline_host_gate \
            tests.test_scratch_sealed_input \
            tests.test_scratch_guard_quarantine
          echo P07_MULTILINE_HOST_BOUNDARY_PASS
      - name: Existing scratch native docker and migration regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/p07-scratch-host-gate"
          PYTHONPATH=lib python3 -m unittest -q \
            tests.test_isolated_db_restore \
            tests.test_native_scratch_restore \
            tests.test_restore_sql_preflight \
            tests.test_migration_no_overwrite_resume \
            tests.test_server_migration_pull
          for p in lib/cloudpanel.py lib/server_migration.py lib/restore_apply_core.py lib/package_core.py BUILD_ID; do
            test "$(git hash-object "$GITHUB_WORKSPACE/dist/p07/0.1.0/overlay/$p")" = "$(git hash-object "$p")"
          done
          echo P07_MULTILINE_DB_WRITERS_UNCHANGED_PASS
