name: S01 C01 Preview Human Readonly Gate
on:
  push:
    branches: [temp/s01-final-ux-candidate-patch-20260907]
    paths: [.github/workflows/temp-s01-c01-preview-human-readonly-20260907.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      HEAD_SHA: b0966cf7892e706ea585d02dee79d194eaae04d9
    steps:
      - name: Verify exact C01 preview follow-up
        shell: bash
        run: |
          set -euo pipefail
          test -n "$READ_TOKEN"
          echo 'PRODUCT_WRITE_USED=NO MAIN_WRITE_USED=NO RELEASE_WRITE_USED=NO PRODUCTION_WRITE_USED=NO'
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-tools-theme.git" repo
          cd repo
          git checkout -q "$HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(cat VERSION)" = '1.35.19'
          node --check src/assets/js/admin/admin-preview-human-language-final.js
          php -l src/inc/admin/admin-s01-uiux-polish.php >/dev/null
          php tests/preview-human-language-followup-contract.php
          php tests/render-settings-human-language-contract.php
          php tests/recovery-human-language-closure-contract.php
          php tests/deep-admin-human-language-contract.php
          php tests/final-admin-human-closure-contract.php
          php tests/visible-console-v2-contract.php
          php tests/workbench-primary-action-contract.php
          php tests/update-refresh-policy-contract.php
          git diff --exit-code
          echo 'PASS_S01_C01_PREVIEW_HUMAN_READONLY_GATE'
