name: p01-1940-reauth-on-demand-focused-proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-1940-reauth-on-demand-proof-temp.yml'
permissions:
  contents: read
jobs:
  reauth-ux-source-and-security-regression:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SOURCE_SHA: 5fd29474800e82bbf8e52b9bda8ddffa15e165b0
      BASE_SHA: e791c35d4b7ae231a3e726d1a5040d127ab0ae5d
      WORK: /tmp/p01-reauth-ui-${{ github.run_id }}
    steps:
      - name: Checkout registered public Runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Transient exact private source checkout
        shell: bash
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          test -n "$VF_PRIVATE_READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${VF_PRIVATE_READ_TOKEN}@github.com/llhzx2018/vf-start.git" "$WORK"
          git -C "$WORK" fetch -q --depth 12 origin "$SOURCE_SHA"
          git -C "$WORK" checkout -q --detach "$SOURCE_SHA"
          git -C "$WORK" remote set-url origin https://github.com/llhzx2018/vf-start.git
          test "$(git -C "$WORK" rev-parse HEAD)" = "$SOURCE_SHA"
          git -C "$WORK" merge-base --is-ancestor "$BASE_SHA" "$SOURCE_SHA"
          test "$(git -C "$WORK" diff --name-only "$BASE_SHA" "$SOURCE_SHA")" = "$(printf 'src/app/FrontstageRecentAuth.php\nsrc/assets/frontstage-recent-auth.js\nsrc/assets/local-subsite-management.css\ntests/unit/p01_ia6_recent_auth_r21_contract.cjs')"
          echo P01_REAUTH_UI_EXACT_SOURCE_AND_4_FILE_SCOPE=PASS
      - name: Verify on-demand visual semantics and existing reauth security
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$WORK"
          node --check src/assets/frontstage-recent-auth.js
          node --check tests/unit/p01_ia6_recent_auth_r21_contract.cjs
          php -l src/app/FrontstageRecentAuth.php
          php -l src/reauth.php
          php -l src/app/Auth.php
          node tests/unit/p01_ia6_recent_auth_r21_contract.cjs
          php tests/unit/p01_ia6_retired_gui_security_successor_contract.php
          echo P01_REAUTH_UI_EXPLICIT_428_SHOW_INPUT_RESET_AND_SECURITY=PASS
      - name: Verify server-side Auth and reauth API remain exact-source unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$WORK"
          test "$(git diff "$BASE_SHA" "$SOURCE_SHA" -- src/reauth.php src/app/Auth.php src/api.php)" = ""
          echo P01_REAUTH_SERVER_SIDE_SECURITY_UNCHANGED=PASS
      - name: Cleanup private source and secret-bearing workspace
        if: always()
        shell: bash
        run: |
          echo P01_REAUTH_PUBLIC_ARTIFACT_PRIVATE_SOURCE=NONE
          echo P01_REAUTH_PRODUCTION_WRITE=NONE
          case "$WORK" in /tmp/p01-reauth-ui-*) rm -rf -- "$WORK";; *) exit 77;; esac
