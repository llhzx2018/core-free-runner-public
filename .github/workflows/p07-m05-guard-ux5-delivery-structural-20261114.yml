# One-off exact official ZIP structural delivery gate, public-safe only.
name: P07-M05 新服务器初始化 guard-ux5 正式包公共规范结构门禁
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p07-m05-guard-ux5-delivery-structural-20261114.yml']
permissions:
  contents: read
jobs:
  actual-artifact:
    if: github.head_ref == 'test/p07-m05-guard-ux5-delivery-structural-20261114'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      NO_COLOR: '1'
    steps:
      - name: Exact PRIVATE P07 product source temporary checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 594fd1130a49330b583ef1eac07a72c3bc4e6ddb
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Live GOV-DOC public authority gate temporary checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov
      - name: Real released M05 official ZIP and actual task-delivery contract lint
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = 594fd1130a49330b583ef1eac07a72c3bc4e6ddb
          mkdir -p official
          artifact='P07-M05-0.1.0-m05-db-first-guard-ux5.zip'
          curl --proto '=https' --tlsv1.2 -fsSL --retry 2 --max-time 120 \
            "https://github.com/llhzx2018/core-free-runner-public/releases/download/p07-m05-v0.1.0-guard-ux5-20261114/$artifact" -o "official/$artifact"
          echo "882b3363f32aa4405ec0c3ae9fe16914f33738e587cacbd571caa47e6e5de046  official/$artifact" | sha256sum -c -
          cat > "$RUNNER_TEMP/p07-m05-delivery.json" <<'JSON'
          {
            "schema":"vf.public-authority.task-delivery-check.v1",
            "project":"P07 · VF Server Ops · P07-M05 新服务器初始化",
            "source":"594fd1130a49330b583ef1eac07a72c3bc4e6ddb",
            "project_authority":{
              "agents":"AGENTS.md",
              "current":"docs/authority/CURRENT.md",
              "acceptance":"docs/authority/ACCEPTANCE_MATRIX.md",
              "applicability":"docs/authority/PUBLIC_AUTHORITY_APPLICABILITY.md"
            },
            "acceptance_markers":["P07-M05 新服务器初始化","P07 全模块终端 UX/UI 硬验收"],
            "required_domains":["INSTALL","SECURITY","TESTING","UPGRADE","DATA_SCHEMA","GIT","UA_UI"],
            "task_capabilities":["installer","update","release","database","source_change","ux_change"],
            "delivery":{
              "profile":"web_atomic_zip",
              "entrypoint":"p07-m05/bin/vfops-init-entry",
              "artifact":"P07-M05-0.1.0-m05-db-first-guard-ux5.zip",
              "sha256":"882b3363f32aa4405ec0c3ae9fe16914f33738e587cacbd571caa47e6e5de046",
              "requires_git":false,
              "requires_manual_source_copy":false
            }
          }
          JSON
          python3 -B gov/governance/public-authority/tools/task_delivery_contract_lint.py \
            --phase delivery \
            --receipt "$RUNNER_TEMP/p07-m05-delivery.json" \
            --project-root product \
            --artifact-root official \
            --public-router gov/governance/public-authority/VF_PUBLIC_AUTHORITY_APPLICABILITY_ROUTER_V1.0.json
          echo P07_M05_UX5_ACTUAL_RELEASE_PACKAGE_STRUCTURAL_GATE=PASS
          echo P07_OWNER_VPS_PRODUCTION_DNS_MIGRATION=UNTOUCHED
      - name: Clean temporary private sources and official ZIP
        if: always()
        run: |
          rm -rf -- product gov official "$RUNNER_TEMP/p07-m05-delivery.json"
          echo P07_M05_DELIVERY_TEMP_SOURCE_CLEANUP=PASS
