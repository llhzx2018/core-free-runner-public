name: S01-C02 1086 System dependency reference truth and five-section UX
on:
  push:
    branches: [test/s01-c02-1211086-scan-batches-20261010]
jobs:
  isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      db:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: fixture-root
          MARIADB_DATABASE: ops_1086
          MARIADB_USER: vf
          MARIADB_PASSWORD: fixture-pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - name: Checkout exact Ops source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 2fbd88b251f779adced433fc4e7a14a853ad9e64
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli,pdo_mysql,zip,curl,mbstring
          coverage: none
      - name: Install Chromium for real shared JS integration
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --only-shell
      - name: Service and view syntax + true-vs-false positive unit acceptance
        run: |
          set -Eeuo pipefail
          test "$(cat VERSION)" = 1.21.1086
          php -l includes/admin-v13/services/system_plugins.php
          php -l includes/admin-v13/views/system_plugins.php
          php -l tests/s01-c02-1211084-system-dependency-reference-truth.php
          php tests/s01-c02-1211084-system-dependency-reference-truth.php
          php -l includes/plugins-governance/dependency-scan-batches-v1211086.php
          php -l includes/plugins-governance/dependency-audit.php
          php -l includes/plugins-governance/service.php
          php -l tests/s01-c02-1211086-dependency-scan-batches.php
          php tests/s01-c02-1211086-dependency-scan-batches.php
      - name: Five always-visible system sections responsive/browser behavior
        run: |
          set -Eeuo pipefail
          node tests/s01-c02-1211015-system-one-page-browser-proof.js
          node tests/s01-c02-1211016-system-one-page-hierarchy-browser-proof.js
      - name: Governance source readback only, no new deletion permissions
        run: |
          set -Eeuo pipefail
          test "$(grep -c 'data-vf-system-section=' includes/admin-v13/views/system_plugins.php)" -ge 5
          grep -q 'remove_all_reported_residuals' includes/plugins-governance/dependency-audit.php
          grep -q 'candidate.*residual' includes/plugins-governance/dependency-audit.php
          grep -q 'DELETION_REQUIRES_SEPARATE_AUTHORIZED_WORK_ORDER' includes/plugins-governance/operation-proof.php
          echo 'DELETION_AUTHORIZATION_FAIL_CLOSED_CODE_UNCHANGED=PASS'
      - name: Isolated real WordPress activation and update CSS boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/wp1086"; mkdir -p "$ROOT"; WP="$ROOT/site"; mkdir -p "$WP"
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o "$ROOT/wp"
          wpqa(){ php "$ROOT/wp" --path="$WP" "$@"; }
          wpqa core download --version=7.0.2 --force
          wpqa config create --dbname=ops_1086 --dbuser=vf --dbpass=fixture-pass --dbhost=127.0.0.1 --skip-check
          wpqa core install --url=https://fixture.invalid --title=Isolated --admin_user=admin --admin_password=fixture-admin --admin_email=qa@example.invalid --skip-email
          mkdir -p "$WP/wp-content/plugins/vf-ops"
          rsync -a --exclude='.git' --exclude='node_modules' ./ "$WP/wp-content/plugins/vf-ops/"
          wpqa plugin activate vf-ops
          wpqa eval-file "$WP/wp-content/plugins/vf-ops/tests/s01-c02-1211075-publish-asset-wordpress.php" publish
          wpqa eval-file "$WP/wp-content/plugins/vf-ops/tests/s01-c02-1211075-publish-asset-wordpress.php" system
          wpqa eval 'require_once WP_PLUGIN_DIR."/vf-ops/includes/admin-v13/services/system_plugins.php"; $m=["summary"=>["p0"=>0,"p1"=>0,"dependencyResiduals"=>134],"inventory"=>["status"=>"PASS"],"dependencyAudit"=>["status"=>"PASS","issues"=>[]]]; $s=vf_ops_v13_system_health_summary_v121937($m,[["component_id"=>"S01-C02","state"=>"CURRENT"]]); if($s["status"]!=="REVIEW"||$s["residuals"]!==134)throw new RuntimeException("Real WP dependency refs health incorrectly blocked"); echo "REAL_WP_SYSTEM_HEALTH_REFERENCES=PASS\n";'
          wpqa eval-file "$WP/wp-content/plugins/vf-ops/tests/s01-c02-1211086-real-wp-golden-path.php"
      - name: Deterministic exact ZIP
        run: |
          mkdir -p /tmp/s01-c02-1086
          python3 .github/release/build-ops-package.py --output /tmp/s01-c02-1086/vf-tools-ops_V1.21.1086.zip > /tmp/s01-c02-1086/manifest.json
          unzip -tq /tmp/s01-c02-1086/vf-tools-ops_V1.21.1086.zip
          cat /tmp/s01-c02-1086/manifest.json
      - name: Seal candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: s01-c02-v1.21.1086-system-reference-candidate
          path: /tmp/s01-c02-1086/
          retention-days: 30
