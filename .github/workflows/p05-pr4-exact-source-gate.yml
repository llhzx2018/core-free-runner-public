name: P05 PR4 Exact Source Runner Gate

on:
  push:
    branches:
      - task/p05-pr4-runner-gate-20260827
    paths:
      - '.github/workflows/p05-pr4-exact-source-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: vfseo_test
          POSTGRES_USER: vfseo
          POSTGRES_PASSWORD: vfseo-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vfseo -d vfseo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      P05_SOURCE_SHA: 4dd532b13959396d77f32dbbbb9231736485f023
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      DATABASE_URL: postgresql://vfseo:vfseo-test-password@127.0.0.1:5432/vfseo_test
      VF_MASTER_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NODE_ENV: test
    steps:
      - name: Verify private read capability
        shell: bash
        run: |
          if [ -z "$PRIVATE_READ_TOKEN" ]; then
            echo "RUNNER_INFRASTRUCTURE_BLOCK=VF_PRIVATE_READ_TOKEN_MISSING"
            exit 78
          fi

      - name: Checkout exact P05 source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.P05_SOURCE_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: source

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Lint
        working-directory: source
        run: npm run lint

      - name: Typecheck
        working-directory: source
        run: npm run typecheck

      - name: Migrate
        working-directory: source
        run: npm run migrate

      - name: Verify schema
        working-directory: source
        run: npm run verify:schema

      - name: Test
        working-directory: source
        run: npm run test

      - name: Build
        working-directory: source
        run: npm run build

      - name: Source gate
        working-directory: source
        run: npm run source:gate

      - name: Scope gate
        working-directory: source
        run: npm run scope:gate

      - name: Phase 2 security gates when available
        working-directory: source
        shell: bash
        run: |
          if [ -f scripts/security-gate.mjs ]; then
            npm run dependency:gate
            npm audit --audit-level=high
            npm run security:gate
          fi

      - name: Repository cleanliness
        working-directory: source
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            exit 1
          fi
