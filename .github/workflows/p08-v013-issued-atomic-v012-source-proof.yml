name: P08 v013 authentic 607b old PHP HTTPS Owner one-click
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/p08-v013-issued-atomic-v012-source-proof.yml]
permissions:
  contents: read
jobs:
  three-db-official-chain:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-v013-607b-https-old-owner-singleclick-20261120'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: sqlite
            image: mysql:8.4
            health: mysqladmin ping --silent
    services:
      db:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: p08-only-disposable-ci
          MYSQL_ROOT_HOST: '%'
          MARIADB_ROOT_PASSWORD: p08-only-disposable-ci
          MARIADB_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=10s
          --health-timeout=6s
          --health-retries=18
    env:
      P08_ISOLATED_INSTALL_TEST: 'YES'
      PYTHONDONTWRITEBYTECODE: '1'
      P08_TEST_DB_DRIVER: ${{ matrix.kind }}
      P08_TEST_DB_HOST: 127.0.0.1
      P08_TEST_DB_USER: root
      P08_TEST_DB_PASSWORD: p08-only-disposable-ci
      P08_TEST_DB_CLEAN: p08_ci_013_chain
      P08_TEST_DB_DIRTY: p08_ci_013_chain_dirty
    steps:
      - name: Checkout exact one-off Public Runner harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact v013 target source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 11f1ca58849e4baf8283c33659863416e48b9c5d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
      - name: Exact original v012 PHP offline test harness and installed-engine code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: dac7bc1d5410c077f32e522eb5740537f618ef9d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: old
      - name: Exact GOV-DOC Mode U candidate authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: a6e476ccc54fec29cf5264177cf65675b282d4da
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov
      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: zip,curl,mbstring,pdo_mysql,pdo_sqlite,sqlite3,openssl,posix,dom,intl,fileinfo
          coverage: none
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install genuine native DB clients
        run: |
          set -Eeuo pipefail
          timeout 420 sudo apt-get -qq update
          timeout 420 sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y mariadb-client sqlite3
          command -v mariadb-dump && command -v sqlite3
      - name: Download immutable authentic official chain and build exact candidate
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C old rev-parse HEAD)" = dac7bc1d5410c077f32e522eb5740537f618ef9d
          test "$(git -C target rev-parse HEAD)" = 11f1ca58849e4baf8283c33659863416e48b9c5d
          test "$(git -C gov rev-parse HEAD)" = a6e476ccc54fec29cf5264177cf65675b282d4da
          tmp="$RUNNER_TEMP/p08-v013-official-chain-${{ matrix.kind }}"
          mkdir -m 700 "$tmp"
          while read -r id fname expected; do
            curl -fsSL --retry 2 --max-time 100 \
              -H "Authorization: Bearer $READ_TOKEN" \
              -H 'Accept: application/octet-stream' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/llhzx2018/vf-adops/releases/assets/$id" \
              -o "$tmp/$fname"
            test "$(sha256sum "$tmp/$fname" | cut -d' ' -f1)" = "$expected"
          done <<'ASSETS'
          763106581 v019-full.zip 91a37e0116066bf0df32341cc0708b8b52eaaa998ea556a920b72ff3863a9232
          763937408 v010-update.zip 3a9ceae0d6b928bc6871b8db900be421728be24c4500dc1c661463917ba4a827
          766931637 v012-update.zip 9a80f880a9cfbd22efce35383ee933766100e936fc6f99f89272237dd4e0ab56
          766931640 v012-full.zip 721aaad6ae41d1faedff80f06a78320d3bb86faf26ccd0f4917e5d4a2d94cca6
          ASSETS
          unzip -p "$tmp/v019-full.zip" FULL_MANIFEST.json > "$tmp/019-manifest.json"
          unzip -p "$tmp/v012-full.zip" FULL_MANIFEST.json > "$tmp/012-clean-manifest.json"
          test "$(sha256sum "$tmp/012-clean-manifest.json" | cut -d' ' -f1)" = 4df28b7a9dcfbaf4c0bec18009955fe1b0c7764ccfe94f4257ae2ca0dc3794cc
          python3 - "$tmp" <<'PY'
          import hashlib,json,sys,zipfile
          from pathlib import Path
          t=Path(sys.argv[1])
          m019=(t/'019-manifest.json').read_bytes()
          m010=json.loads(zipfile.ZipFile(t/'v010-update.zip').read('ATOMIC_MANIFEST.json'))
          m012=json.loads(zipfile.ZipFile(t/'v012-update.zip').read('ATOMIC_MANIFEST.json'))
          assert m010['source_sha']=='b77c7e8563d93255f5f4a60bb8c5736a994d8151'
          assert m010['target_sha']=='ef78dcb21117c822e2756360280f2418f794704f'
          assert m010['source_full_manifest_sha256']==hashlib.sha256(m019).hexdigest()
          assert m012['source_sha']=='ef78dcb21117c822e2756360280f2418f794704f'
          assert m012['target_sha']=='dac7bc1d5410c077f32e522eb5740537f618ef9d'
          assert m012['source_full_manifest_sha256']=='efebfefde3115864dba71c2e56fedae2f7ada8ad4064010473d716b689f67fe9'
          assert m010['schema_changes'] is False and m012['schema_changes'] is False
          print('P08_013_ORIGINAL_019_010_012_RELEASE_AND_LEGACY_MANIFEST_IDENTITY=PASS')
          PY
          cd target
          npm ci --no-fund --no-audit
          npm run build
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          python3 scripts/check_stack_contract.py --phase full
          git diff --exit-code && git diff --cached --exit-code
          mapfile -t generated < <(git ls-files --others --exclude-standard)
          for file in "${generated[@]}"; do
            case "$file" in
              bootstrap/cache/packages.php|bootstrap/cache/services.php)
                test -f "$file" && ! test -L "$file" && rm -- "$file" ;;
              *) echo P08_013_CHAIN_UNEXPECTED_SOURCE_GENERATION; exit 29 ;;
            esac
          done
          test -z "$(git status --porcelain --untracked-files=all)"
          python3 scripts/build_full.py --source "$PWD" --output "$tmp/v013-full.zip" \
            --version 0.1.13 --source-sha 11f1ca58849e4baf8283c33659863416e48b9c5d \
            --governance-root "$GITHUB_WORKSPACE/gov"
          test "$(sha256sum "$tmp/v013-full.zip" | cut -d' ' -f1)" = 66ce5a6b081d218ed54a8ec9903f0544dba577525398f23f3f630ad855367d25
          echo "P08_013_SOURCE_EXACT_FULL_READY=PASS"
          echo "P08_013_CHAIN_SOURCE_EXACT_FULL=${{ matrix.kind }}:PASS"
      - name: True v019 FULL to official v010 Atomic to official v012 Atomic to real v013
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          tmp="$RUNNER_TEMP/p08-v013-official-chain-${{ matrix.kind }}"
          site="$RUNNER_TEMP/p08-r129-real-issued-r131-r155-${{ matrix.kind }}-chain"
          mkdir -m 700 "$site"
          unzip -q "$tmp/v019-full.zip" -d "$site"
          mkdir -p "$site/tests/compatibility"
          cp old/tests/test_install_sqlite_e2e.php old/tests/test_install_mysql_e2e.php "$site/tests/"
          cp old/tests/compatibility/r101_complete_schema.php "$site/tests/compatibility/"
          if [ "${{ matrix.kind }}" = sqlite ]; then
            php "$site/tests/test_install_sqlite_e2e.php"
          else
            mariadb -h127.0.0.1 -uroot -p"$P08_TEST_DB_PASSWORD" -e \
              'CREATE DATABASE p08_ci_013_chain; CREATE DATABASE p08_ci_013_chain_dirty; CREATE TABLE p08_ci_013_chain_dirty.synthetic_dirty(id integer primary key);'
            php "$site/tests/test_install_mysql_e2e.php"
          fi
          test "$(readlink "$site/current")" = "releases/b77c7e8563d93255f5f4a60bb8c5736a994d8151"
          # Disposable SQLite installer fixture sets a known synthetic optional PAT.
          # R154 first-stage covers optional-no-PAT. Require exact known fixture
          # before removing; real Owner sites and actual secrets are never read.
          if [ "${{ matrix.kind }}" = sqlite ]; then
            synthetic="$site/storage/app/private/adops/upgrade/github-read-token"
            test -f "$synthetic" && test ! -L "$synthetic"
            test "$(stat -c %a "$synthetic")" = 600
            test "$(cat "$synthetic")" = "github_pat_$(printf 's%.0s' {1..42})"
            rm -- "$synthetic"
            test ! -e "$synthetic"
            echo P08_013_SQLITE_SYNTHETIC_OPTIONAL_TOKEN_VARIANT=PASS
          fi
          python3 - "$tmp/v019-to-v010.php" <<'PY'
          from pathlib import Path
          import sys
          s=Path('old/tests/compatibility/r154_clean_full_to_two_native_atomic_cycles.php').read_text()
          changes=[
            ("'0.1.5':($phase==='recover'?'0.1.7':'0.1.6')",
             "'0.1.9':($phase==='recover'?'0.1.10':'0.1.9')",1),
            ("trim((string)file_get_contents($site.'/current/VERSION'))!=='0.1.6'",
             "trim((string)file_get_contents($site.'/current/VERSION'))!=='0.1.10'",1),
            ("'target_version'=>'0.1.7'","'target_version'=>'0.1.10'",1),
            ("str_repeat('1',40)","'ef78dcb21117c822e2756360280f2418f794704f'",1),
            ("str_repeat('2',40)","'ef78dcb21117c822e2756360280f2418f794704f'",4),
          ]
          for before,after,n in changes:
            assert s.count(before)==n,(before,s.count(before))
            s=s.replace(before,after)
          Path(sys.argv[1]).write_text(s)
          PY
          P08_R154_NATIVE=YES php "$tmp/v019-to-v010.php" first "$site" \
            b77c7e8563d93255f5f4a60bb8c5736a994d8151 "$tmp/v010-update.zip"
          test "$(readlink "$site/current")" = "releases/ef78dcb21117c822e2756360280f2418f794704f"
          test "$(sha256sum "$site/current/FULL_MANIFEST.json" | cut -d' ' -f1)" = efebfefde3115864dba71c2e56fedae2f7ada8ad4064010473d716b689f67fe9
          media="$site/storage/app/private/adops/r202-media-proof.bin"
          printf 'P08_CHAIN_REAL_ORIGIN_SYNTHETIC_MEDIA_ONLY\n' > "$media"
          chmod 0600 "$media"
          P08_R205_CHAINED=YES php old/tests/compatibility/r205_chained_atomic_apply.php \
            "$site" ef78dcb21117c822e2756360280f2418f794704f \
            efebfefde3115864dba71c2e56fedae2f7ada8ad4064010473d716b689f67fe9 \
            "$tmp/v012-update.zip" dac7bc1d5410c077f32e522eb5740537f618ef9d 0.1.12
          test "$(readlink "$site/current")" = "releases/dac7bc1d5410c077f32e522eb5740537f618ef9d"
          installed="$(sha256sum "$site/current/FULL_MANIFEST.json" | cut -d' ' -f1)"
          echo "P08_013_OFFICIAL_ATOMIC_INSTALLED_012_MANIFEST_SHA256=$installed"
          test "$installed" = 607b3a02a20021c0747d42440497b7e9e3e0fe39040869f475ba22f9f19437e9
          test "$installed" != 4df28b7a9dcfbaf4c0bec18009955fe1b0c7764ccfe94f4257ae2ca0dc3794cc
          # Preserve a fully isolated copy of the *actual* issued v012
          # Atomic-installed origin for HTTPS Owner login; never edit indexed
          # release code or the original test site / Owner data.
          web="$RUNNER_TEMP/p08-r129-real-issued-r131-r155-sqlite-web"
          mkdir -m 700 "$web"
          cp -a "$site/." "$web/"
          test "$(sha256sum "$web/current/FULL_MANIFEST.json" | cut -d' ' -f1)" = "$installed"
          grep -Fq "$site" "$web/.env"
          sed -i "s#$site#$web#g; s#adops.lanlihong.com#127.0.0.1:18497#g" "$web/.env"
          grep -Fq "$web" "$web/.env"
          grep -Fq "127.0.0.1:18497" "$web/.env"
          test "$(readlink "$web/current")" = releases/dac7bc1d5410c077f32e522eb5740537f618ef9d
          test ! -e "$web/storage/app/private/adops/owner-next-update/intent.json"
          echo P08_607B_ORIGINAL_ISSUED_BROWSER_SOURCE_CLONED_ISOLATED=PASS
          # Build for the ACTUAL installed source and its exact schema file index.
          # No clean-FULL/Atomic-installed manifest alias or security bypass.
          python3 "$GITHUB_WORKSPACE/target/scripts/build_atomic.py" \
            --source "$GITHUB_WORKSPACE/target" --output "$tmp/v013-update.zip" \
            --source-version 0.1.12 --source-sha dac7bc1d5410c077f32e522eb5740537f618ef9d \
            --source-full-manifest-sha256 "$installed" \
            --previous-full-manifest "$site/current/FULL_MANIFEST.json" \
            --target-version 0.1.13 --target-sha 11f1ca58849e4baf8283c33659863416e48b9c5d
          unzip -p "$tmp/v013-update.zip" ATOMIC_MANIFEST.json | python3 -c 'import json,sys; m=json.load(sys.stdin); assert m["source_full_manifest_sha256"]=="607b3a02a20021c0747d42440497b7e9e3e0fe39040869f475ba22f9f19437e9"; assert m["source_sha"]=="dac7bc1d5410c077f32e522eb5740537f618ef9d"; assert m["schema_changes"] is False; print("P08_013_AUTHENTIC_ATOMIC_INSTALLED_SOURCE_MANIFEST=PASS")'
          # Independently re-build the REAL 607b-origin code-only archive with
          # exact old installed manifest (not the v012 clean FULL identity).
          python3 "$GITHUB_WORKSPACE/target/scripts/build_atomic.py" \
            --source "$GITHUB_WORKSPACE/target" --output "$tmp/v013-update-second.zip" \
            --source-version 0.1.12 --source-sha dac7bc1d5410c077f32e522eb5740537f618ef9d \
            --source-full-manifest-sha256 "$installed" \
            --previous-full-manifest "$site/current/FULL_MANIFEST.json" \
            --target-version 0.1.13 --target-sha 11f1ca58849e4baf8283c33659863416e48b9c5d
          cmp "$tmp/v013-update.zip" "$tmp/v013-update-second.zip"
          sha_a="$(sha256sum "$tmp/v013-update.zip" | cut -d' ' -f1)"
          sha_b="$(sha256sum "$tmp/v013-update-second.zip" | cut -d' ' -f1)"
          test "$sha_a" = "$sha_b"
          test -z "$(git -C target status --porcelain --untracked-files=all)"
          echo "P08_V013_607B_ATOMIC_DOUBLE_BUILD_${{ matrix.kind }}=PASS:$sha_a"
          # Clean v012 and Atomic-installed v012 digests must NEVER alias.
          if python3 "$GITHUB_WORKSPACE/target/scripts/build_atomic.py" \
            --source "$GITHUB_WORKSPACE/target" --output "$tmp/must-refuse-wrong-source.zip" \
            --source-version 0.1.12 --source-sha dac7bc1d5410c077f32e522eb5740537f618ef9d \
            --source-full-manifest-sha256 4df28b7a9dcfbaf4c0bec18009955fe1b0c7764ccfe94f4257ae2ca0dc3794cc \
            --previous-full-manifest "$site/current/FULL_MANIFEST.json" \
            --target-version 0.1.13 --target-sha 11f1ca58849e4baf8283c33659863416e48b9c5d; then
            echo P08_V013_WRONG_ORIGIN_NOT_REJECTED
            exit 31
          fi
          test ! -e "$tmp/must-refuse-wrong-source.zip"
          test -z "$(git -C target status --porcelain --untracked-files=all)"
          echo "P08_V013_607B_WRONG_SOURCE_ORIGIN_REFUSAL_${{ matrix.kind }}=PASS"
          P08_R205_CHAINED=YES php old/tests/compatibility/r205_chained_atomic_apply.php \
            "$site" dac7bc1d5410c077f32e522eb5740537f618ef9d \
            "$installed" "$tmp/v013-update.zip" 11f1ca58849e4baf8283c33659863416e48b9c5d 0.1.13
          test "$(readlink "$site/current")" = releases/11f1ca58849e4baf8283c33659863416e48b9c5d
          test "$(cat "$site/current/VERSION")" = 0.1.13
          # Do not create another next-version source identity split.
          clean_next="$(unzip -p "$tmp/v013-full.zip" FULL_MANIFEST.json | sha256sum | cut -d' ' -f1)"
          updated_next="$(sha256sum "$site/current/FULL_MANIFEST.json" | cut -d' ' -f1)"
          echo "P08_V013_CLEAN_NEW_FULL_MANIFEST_SHA256=$clean_next"
          echo "P08_V013_ACTUAL_607B_UPDATE_RESULT_SHA256=$updated_next"
          test "$clean_next" = "$updated_next"
          echo "P08_V013_NEXT_SOURCE_MANIFEST_CONVERGENCE_${{ matrix.kind }}=PASS"
          echo "P08_013_GENUINE_019_FULL_010_ATOMIC_012_ATOMIC_013_ATOMIC=${{ matrix.kind }}:PASS"
      - name: Real previously issued v012 PHP Owner-authenticated HTTPS one-click
        shell: bash
        run: |
          set -Eeuo pipefail
          bash "$GITHUB_WORKSPACE/tests/p08-v013-607b-old-owner-https.sh" \
            "$RUNNER_TEMP/p08-v013-official-chain-sqlite" \
            "$RUNNER_TEMP/p08-r129-real-issued-r131-r155-sqlite-web"
          echo P08_V013_607B_OLD_CLIENT_HTTPS_BROWSER=PASS
      - name: Mandatory disposal of private source and every temporary installed site
        if: always()
        run: |
          rm -rf -- target old gov "$RUNNER_TEMP/p08-v013-official-chain-${{ matrix.kind }}" \
            "$RUNNER_TEMP/p08-r129-real-issued-r131-r155-${{ matrix.kind }}-chain" \
            "$RUNNER_TEMP/p08-r129-real-issued-r131-r155-sqlite-web"
          test ! -e target && test ! -e old && test ! -e gov
          echo "P08_013_OFFICIAL_MULTI_GENERATION_PRIVATE_CLEANUP=${{ matrix.kind }}:PASS"
