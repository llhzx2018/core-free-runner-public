name: P01 IA6 exact disposable full-disaster parity
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-ia6-487-restore-parity-once.yml'
permissions:
  contents: read
jobs:
  isolated-recovery:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title,'test(P01):')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      PRODUCT_BRANCH: feat/ia-v6-frontstage-admin-parity-system-jobs-r1
      PRODUCT_SHA: 54d806df9551250794d56a420693204cb99899e2
      PRODUCT_VERSION: 2.47.487
      P01_TEST_ORIGIN: http://127.0.0.1:19066
    steps:
      - name: Checkout existing public Runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install disposable PHP SQLite runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd php-xml >/dev/null
          php -m | grep -Fx pdo_sqlite
          php -m | grep -Fx Phar
      - name: Clone private exact candidate read-only
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          actual="$(git ls-remote "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')"
          test "$actual" = "$PRODUCT_SHA"
          git clone -q --no-checkout "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" candidate
          git -C candidate fetch -q --depth 1 origin "$PRODUCT_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "$PRODUCT_VERSION"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "$PRODUCT_VERSION"
          echo P01_IA6_DISASTER_EXACT_SOURCE=PASS
      - name: Targeted recovery source contract and PHP JS lint
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l candidate/tests/integration/p01_ia6_disaster_roundtrip_disposable.php
          php -l candidate/src/app/DisasterRecovery.php
          node --check candidate/src/assets/frontstage-recovery-files.js
          node --check candidate/tests/unit/p01_ia6_recovery_files_r2_contract.cjs
          (cd candidate && node tests/unit/p01_ia6_recovery_files_r2_contract.cjs)
          echo P01_IA6_DISASTER_SOURCE_AND_REAUTH_CONTRACT=PASS
      - name: Fresh installed localhost Owner fixture only
        shell: bash
        run: |
          set -Eeuo pipefail
          root=/tmp/p01-ia6-disaster-parity-20261031
          rm -rf "$root"
          mkdir -p "$root"
          cp -a candidate/src/. "$root/"
          (cd "$root" && php -S 127.0.0.1:19066 -t . >/tmp/p01-ia6-disaster-parity-server.log 2>&1 & echo $! >/tmp/p01-ia6-disaster-parity.pid)
          for i in $(seq 1 35); do
            if curl -fsS -c /tmp/p01-ia6-disaster-parity.cookie -b /tmp/p01-ia6-disaster-parity.cookie "$P01_TEST_ORIGIN/setup.php" -o /tmp/p01-ia6-disaster-parity-setup.html; then break; fi
            sleep 1
          done
          csrf="$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-ia6-disaster-parity-setup.html',encoding='utf-8').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s)
          assert m
          print(m.group(1))
          PY
          )"
          curl -fsS -c /tmp/p01-ia6-disaster-parity.cookie -b /tmp/p01-ia6-disaster-parity.cookie \
            -X POST "$P01_TEST_ORIGIN/setup.php" \
            --data-urlencode "setup_csrf=$csrf" \
            --data-urlencode "site_title=P01 IA6 Disposable Recovery Parity" \
            --data-urlencode "admin_password=P01IsolatedRecoveryOnly2026!" \
            --data-urlencode "admin_password_confirm=P01IsolatedRecoveryOnly2026!" \
            >/tmp/p01-ia6-disaster-parity-installed.html
          (cd "$root" && php cli/verify.php) | grep -Fx VERIFY_PASS=YES
          echo P01_IA6_DISASTER_FRESH_SETUP=PASS
      - name: Fail closed without explicit disposable acknowledgement
        shell: bash
        run: |
          set -Eeuo pipefail
          root=/tmp/p01-ia6-disaster-parity-20261031
          if VF_E2E_RUNTIME_ROOT="$root" php candidate/tests/integration/p01_ia6_disaster_roundtrip_disposable.php >/tmp/p01-ia6-disaster-refusal.log 2>&1; then
            echo "UNACKNOWLEDGED_DISASTER_TEST_WAS_ALLOWED" >&2
            exit 1
          fi
          grep -F 'IA6_DISASTER_TEST_REFUSES_NONDISPOSABLE_RUNTIME' /tmp/p01-ia6-disaster-refusal.log
          echo P01_IA6_DISASTER_NEGATIVE_ACK_GUARD=PASS
      - name: Perform actual protected package verify upload rejection and rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          VF_E2E_RUNTIME_ROOT=/tmp/p01-ia6-disaster-parity-20261031 \
          VF_IA6_DISPOSABLE_ACK=IA6-DISASTER-DISPOSABLE-ONLY \
            php candidate/tests/integration/p01_ia6_disaster_roundtrip_disposable.php
          echo P01_IA6_DISASTER_REAL_ROUNDTRIP_GATE=PASS
      - name: Always cleanup isolated runtime and private candidate
        if: always()
        shell: bash
        run: |
          if test -f /tmp/p01-ia6-disaster-parity.pid; then kill "$(cat /tmp/p01-ia6-disaster-parity.pid)" >/dev/null 2>&1 || true; fi
          rm -rf /tmp/p01-ia6-disaster-parity-20261031 candidate
          echo P01_IA6_DISASTER_CLEANUP=PASS
