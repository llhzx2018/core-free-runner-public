name: S01 C01+C03 Shell Browser Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/s01-c01-c03-shell-browser-gate.yml'

permissions:
  contents: read

jobs:
  m3u8-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      TARGET_SHA: f3ba72926af391a26682591320873d5a1bb9b5b2
      RUN_ID: S01-C03-SHELL-${{ github.run_id }}-${{ github.run_attempt }}
      VF_HTTP_PORT: '18081'
    steps:
      - name: Checkout exact M3U8 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: ${{ env.TARGET_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: m3u8

      - name: PHP and CJK browser runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none

      - name: Install CJK font
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk >/dev/null
          fc-cache -f >/dev/null

      - name: Execute exact M3U8 WordPress and browser regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd m3u8
          cp scripts/phase3-git-native.sh "$RUNNER_TEMP/m3u8-shell-browser.sh"
          python3 - "$RUNNER_TEMP/m3u8-shell-browser.sh" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          s=p.read_text(encoding='utf-8').replace('1.25.0','1.25.32')
          needle='wpcli plugin activate vf-tool-m3u8 | tee "$EVIDENCE_DIR/wp-cli-activate.txt"'
          replacement='wpcli config set VF_TOOLS_OPS_COMPONENT_ID S01-C02 --type=constant >/dev/null\n'+needle
          if needle not in s:
              raise SystemExit('M3U8_PHASE3_PATCH_ANCHOR_MISSING')
          p.write_text(s.replace(needle,replacement,1),encoding='utf-8')
          PY
          GITHUB_WORKSPACE="$PWD" GITHUB_SHA="$TARGET_SHA" GITHUB_REF="refs/heads/work/s01-c03-shell-header-alignment-r1-20260923" bash "$RUNNER_TEMP/m3u8-shell-browser.sh"

      - name: Upload M3U8 browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c03-shell-browser-${{ github.run_id }}
          path: m3u8/evidence/phase3/
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup private source
        if: always()
        shell: bash
        run: rm -rf m3u8

  theme-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      TARGET_SHA: 4903afc3a40e4c5e16c4cae87379073261e44813
    steps:
      - name: Checkout exact Theme candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: ${{ env.TARGET_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: theme

      - name: PHP and CJK browser runtime
        uses: shivammathur/setup-php@f3e473d116dccc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: fileinfo, sodium, zip
          coverage: none

      - name: Install CJK font
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk >/dev/null
          fc-cache -f >/dev/null

      - name: Execute exact Theme WordPress and browser regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd theme
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/phase3/run-current.sh')
          s=p.read_text(encoding='utf-8')
          s=s.replace('1.35.7','1.35.31').replace('1.35.6','1.35.30').replace('V1357','V13531')
          p.write_text(s,encoding='utf-8')
          PY
          GITHUB_WORKSPACE="$PWD" GITHUB_SHA="$TARGET_SHA" GITHUB_REF="refs/heads/work/s01-c01-shell-header-alignment-r1-20260923" bash tests/phase3/run-current-v4.sh

      - name: Upload Theme browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c01-shell-browser-${{ github.run_id }}
          path: theme/evidence/runtime/
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup private source
        if: always()
        shell: bash
        run: rm -rf theme
