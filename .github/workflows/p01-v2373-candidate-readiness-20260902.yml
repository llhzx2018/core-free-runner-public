name: P01 V2.37.3 Candidate Readiness
on:
  push:
    branches: [release/p01-v2373-hotfix-20260902]
    paths:
      - .github/workflows/p01-v2373-candidate-readiness-20260902.yml
      - scripts/p01_v2373_candidate_readiness_generate.py
      - scripts/p01_v2373_candidate_iyf_e2e.sh
permissions:
  actions: read
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CANDIDATE: 7ae6235b8ce6aa93422f034bde77d22a47e74398
      CANDIDATE_TREE: 19aa0d93bd641cebf6b5cd7f46abd0898d4ed8de
      CANDIDATE_RUNTIME_TREE: e56459ebadc120c749cc5336821d762001db5218
      HOTFIX: 80ccbdf77b7e708cd17b3d9d7fcbaed71426cc51
      MAIN: 6f09d59e3ecc0ed54b9a3ae6e3fc6ba22b109ea1
      SOURCE: 1f5a16796511620760a45cb81b3c8019b91e505b
      SOURCE_TREE: e423df9391c48e4176c041db0f38a32b28c21d44
      SOURCE_RUNTIME_TREE: 70b627513327aee0a37fae245b0f4042ad69b5a4
      VERSION: 2.37.3
      SOURCE_VERSION: 2.37.2
      SCHEMA: '2026082901'
      OUT: /tmp/p01-v2373-candidate-artifacts
      EVID: /tmp/p01-v2373-candidate-evidence
      UPGRADE: /tmp/p01-v2373-upgrade
      FRESH: /tmp/p01-v2373-fresh
    steps:
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: release/p01-v2373-hotfix-20260902
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 0fe72c7981f5f2b6ddd51bf4cfa5d6c014c9b0d3
          path: template
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: agent/p01-22121-formal-artifact-gate-20260819
          path: proven
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.CANDIDATE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: candidate
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.37.2
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: production
      - name: Verify prior evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVID"
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33599532987 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33599708702 --jq .conclusion)" = failure
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33599902477 --jq .conclusion)" = failure
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33600058990 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33600341324 --jq .conclusion)" = success
          printf 'DIAG_R2=FAIL_REPRODUCED\nHOTFIX_R1=HARNESS_ONLY\nHOTFIX_R2=HARNESS_ONLY_AFTER_PRODUCT_SUCCESS\nHOTFIX_R3=PASS\nSTAGE=PASS\n' | tee "$EVID/prior-gates.txt"
      - name: Generate readiness gates
        run: python3 runner/scripts/p01_v2373_candidate_readiness_generate.py
      - name: Exact source fence
        run: bash /tmp/p01-v2373-generated/01-exact.sh
      - name: Build deterministic candidate artifacts
        run: bash /tmp/p01-v2373-generated/02-build.sh
      - name: Actual V2.37.2 to V2.37.3 Atomic upgrade
        run: bash /tmp/p01-v2373-generated/03-atomic.sh
      - name: Strict fresh candidate runtime
        run: bash /tmp/p01-v2373-generated/04-fresh.sh
      - name: True IYF first-attempt E2E
        shell: bash
        run: bash runner/scripts/p01_v2373_candidate_iyf_e2e.sh
      - name: Final candidate verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(cat candidate/VERSION)" = 2.37.3
          jq -e '.production_version=="2.37.2" and .published_release.version=="2.37.2" and .candidate_version=="2.37.3" and .current_change.release_authorized_by_owner==true' candidate/VF_PROJECT.json >/dev/null
          grep -F 'P01_V2373_IYF_FIRST_ATTEMPT=3/3 PASS' "$EVID/iyf-verdict.txt" >/dev/null || grep -F 'P01_V2373_IYF_RESOURCE_COVER_SERVE=3/3 PASS' "$EVID/iyf-verdict.txt" >/dev/null
          printf 'P01_V2373_CANDIDATE_READINESS=PASS\nCANDIDATE=%s\nTREE=%s\nRUNTIME_TREE=%s\nSOURCE=%s\nSCHEMA=%s\nATOMIC_2372_TO_2373=PASS\nFRESH_INSTALL=PASS\nIYF_FIRST_ATTEMPT=3/3\nIYF_RESOURCE_COVER_SERVE=3/3\nMANUAL_UPLOAD_UNCHANGED=PASS\nOWNER_PRODUCTION_WRITE=NO\n' "$CANDIDATE" "$CANDIDATE_TREE" "$CANDIDATE_RUNTIME_TREE" "$SOURCE" "$SCHEMA" | tee "$EVID/verdict.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-v2373-candidate-readiness-${{ github.run_id }}
          path: |
            /tmp/p01-v2373-candidate-artifacts
            /tmp/p01-v2373-candidate-evidence
          if-no-files-found: warn
          retention-days: 90
