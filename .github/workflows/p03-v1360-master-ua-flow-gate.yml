name: P03 V1.36.0 Master UA Low-Fi Flow Gate

on:
  push:
    branches:
      - p03-v1360-flow-gate
    paths:
      - 'p03/v1360-master-ua-flow/**'
      - '.github/workflows/p03-v1360-master-ua-flow-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static flow model gate
        shell: python
        run: |
          import json
          p='p03/v1360-master-ua-flow/flow-model.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['sanitized'] is True
          assert d['global_nav']==['today','projects','search']
          assert len(d['tasks'])==14
          assert [x['id'] for x in d['tasks']]==[f'TASK-{i:02d}' for i in range(1,15)]
          t=d['thresholds']
          for x in d['tasks']:
              assert x['clicks']<=t['clicks'],x
              assert x['context_switch']<=t['context_switch'],x
              assert x['backtracking']==0,x
              assert x['decision_points']==0,x
              assert x['dead_end']==0,x
              assert x['internal_model']==0,x
              assert x['next_action']==1,x
          assert next(x for x in d['tasks'] if x['id']=='TASK-13')['context_recovery_seconds']<=10
          print('STATIC_FLOW_MODEL_14_14_PASS')
          print('GLOBAL_NAV=today,projects,search')
          print('HIGH_FI=NOT_EXECUTED')
      - name: Install browser harness
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Start sanitized Low-Fi prototype
        run: |
          python3 -m http.server 18760 --directory p03/v1360-master-ua-flow > "$RUNNER_TEMP/p03-lowfi-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/p03-lowfi-server.pid"
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:18760/index.html >/dev/null && exit 0; sleep .2; done
          cat "$RUNNER_TEMP/p03-lowfi-server.log"
          exit 1
      - name: Machine task flow measurement
        env:
          P03_LOWFI_BASE: http://127.0.0.1:18760
          P03_FLOW_EVIDENCE: p03/v1360-master-ua-flow/evidence
        run: node p03/v1360-master-ua-flow/flow-gate.spec.js
      - name: Independent evidence assertions
        shell: python
        run: |
          import json
          p='p03/v1360-master-ua-flow/evidence/flow-measurement.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['result']=='PASS'
          assert len(d['tasks'])==14
          assert d['master_ua_flow_gate']=='NOT_SELF_DECLARED'
          assert d['high_fi']=='NOT_EXECUTED'
          assert d['candidate']=='NO'
          assert d['release']=='NO'
          assert d['production_write']==0
          for x in d['tasks']:
              assert x['clicks']<=3
              assert x['context_switch']<=1
              assert x['backtracking']==0
              assert x['decision_points']==0
              assert x['dead_end']==0
              assert x['internal_model']==0
              assert x['next_action_visible']==1
          print('INDEPENDENT_FLOW_EVIDENCE_PASS')
          print('MASTER_UA_FLOW_GATE=NOT_SELF_DECLARED')
          print('READY_FOR_MASTER_UA_FLOW_REVIEW')
      - name: Upload sanitized flow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P03_V1.36.0_MASTER_UA_LOWFI_FLOW_EVIDENCE
          path: p03/v1360-master-ua-flow/evidence
          if-no-files-found: error
          retention-days: 2
