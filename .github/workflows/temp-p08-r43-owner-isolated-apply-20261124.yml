name: TEMP P08 R43 Owner-approved isolated schema APPLY and SIGKILL recovery proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p08-r43-owner-isolated-apply-20261124.yml'
permissions:
  contents: read
concurrency:
  group: p08-r43-schema-archive-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  TARGET_REPO: llhzx2018/vf-adops
  TARGET_VERSION: '0.1.18'
  TARGET_SHA: 3fe0acb3eed6bf8171246bb82e5e963c0e292345
  BRIDGE_VERSION: '0.1.17'
  BRIDGE_SHA: 993030dc4d3a3f91114e3492b9633ed3ce73d86d
jobs:
  identity-preflight:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/p08-r43-owner-isolated-apply-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 scripts/ephemeral_lane_spec.py audit-rendered --spec specs/ephemeral/p08-r43-owner-isolated-apply-20261124.json --input .github/workflows/temp-p08-r43-owner-isolated-apply-20261124.yml
  schema-atomic-archive:
    needs: identity-preflight
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/p08-r43-owner-isolated-apply-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      P08_ISOLATED_INSTALL_TEST: 'YES'
      P08_R43_DISPOSABLE_SCHEMA: 'YES'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.BRIDGE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-p08-bridge
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-p08-target
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: gov-proof
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_mysql, pdo_sqlite, sqlite3, zip, mbstring, intl, bcmath, dom, fileinfo, posix
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source locked dependencies and two real source-built FULL archives
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C private-p08-bridge rev-parse HEAD)" = "$BRIDGE_SHA"
          test "$(git -C private-p08-target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(cat private-p08-bridge/VERSION)" = "$BRIDGE_VERSION"
          test "$(cat private-p08-target/VERSION)" = "$TARGET_VERSION"
          php -l private-p08-bridge/src/Upgrade/R43IsolatedSchemaTransaction.php > "$RUNNER_TEMP/r43-php-syntax.log" 2>&1 || { echo R43_TRANSACTION_PHP_SYNTAX=FAIL; exit 1; }
          php -l private-p08-bridge/tests/compatibility/r43_isolated_installed_transaction.php >> "$RUNNER_TEMP/r43-php-syntax.log" 2>&1 || { echo R43_TEST_PHP_SYNTAX=FAIL; exit 1; }
          for d in private-p08-bridge private-p08-target; do
            mkdir -p "$d/bootstrap/cache" "$d/storage/framework/cache/data" "$d/storage/framework/sessions" "$d/storage/framework/views" "$d/storage/logs"
            (cd "$d" && composer install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/r43-$d-composer.log" 2>&1) || { echo R43_COMPOSER_LOCK=FAIL; exit 1; }
            (cd "$d" && npm ci --no-audit --no-fund > "$RUNNER_TEMP/r43-$d-npm.log" 2>&1 && npm run build > "$RUNNER_TEMP/r43-$d-vite.log" 2>&1) || { echo R43_NPM_VITE=FAIL; exit 1; }
          done
          python3 private-p08-bridge/scripts/build_full.py --source private-p08-bridge --output "$RUNNER_TEMP/r43-bridge.zip" --version "$BRIDGE_VERSION" --source-sha "$BRIDGE_SHA" --governance-root gov-proof > "$RUNNER_TEMP/r43-bridge-package.log" 2>&1 || { echo R43_BRIDGE_CANONICAL_FULL=FAIL; exit 1; }
          python3 private-p08-target/scripts/build_full.py --source private-p08-target --output "$RUNNER_TEMP/r43-target.zip" --version "$TARGET_VERSION" --source-sha "$TARGET_SHA" --governance-root gov-proof > "$RUNNER_TEMP/r43-target-package.log" 2>&1 || { echo R43_TARGET_CANONICAL_FULL=FAIL; exit 1; }
          mkdir -m 700 "$RUNNER_TEMP/p08-r43-target-extract"
          unzip -q "$RUNNER_TEMP/r43-target.zip" -d "$RUNNER_TEMP/p08-r43-target-extract"
          mkdir -m 700 "$RUNNER_TEMP/p08-r43-bridge-extract"
          unzip -q "$RUNNER_TEMP/r43-bridge.zip" -d "$RUNNER_TEMP/p08-r43-bridge-extract"
          echo P08_R43_CANONICAL_DEV_FULLS_EXTRACTED=PASS
      - name: PHP Python syntax and exact-source schema provenance
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          php -l private-p08-bridge/src/Upgrade/R43SchemaAtomicArchive.php > "$RUNNER_TEMP/r43-archive-php.log" 2>&1 || { echo P08_R43_ATOMIC_VERIFIER_SYNTAX=FAIL; exit 1; }
          php -l private-p08-bridge/tests/compatibility/r43_schema_atomic_zip.php >> "$RUNNER_TEMP/r43-archive-php.log" 2>&1 || { echo P08_R43_ATOMIC_TEST_SYNTAX=FAIL; exit 1; }
          python3 -m py_compile private-p08-bridge/scripts/build_r43_schema_atomic.py > "$RUNNER_TEMP/r43-archive-python.log" 2>&1 || { echo P08_R43_ATOMIC_BUILDER_SYNTAX=FAIL; exit 1; }
          echo P08_R43_ATOMIC_CODE_SYNTAX=PASS
      - name: Two identical 21-migration schema UPDATE archives with verified source FULL
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          old_manifest="$(sha256sum "$RUNNER_TEMP/p08-r43-bridge-extract/FULL_MANIFEST.json" | cut -d' ' -f1)"
          for suffix in a b; do
            python3 private-p08-bridge/scripts/build_r43_schema_atomic.py --source-full "$RUNNER_TEMP/p08-r43-bridge-extract" --target-runtime private-p08-target --output "$RUNNER_TEMP/p08-r43-schema-$suffix.zip" --source-sha "$BRIDGE_SHA" --source-full-sha256 "$old_manifest" --target-sha "$TARGET_SHA" > "$RUNNER_TEMP/r43-schema-$suffix-build.log" 2>&1 || { echo P08_R43_SCHEMA_ATOMIC_BUILD=FAIL; exit 1; }
          done
          cmp -s "$RUNNER_TEMP/p08-r43-schema-a.zip" "$RUNNER_TEMP/p08-r43-schema-b.zip" || { echo P08_R43_SCHEMA_ATOMIC_DETERMINISM=FAIL; exit 1; }
          echo P08_R43_SCHEMA_ATOMIC_DETERMINISTIC_DOUBLE_BUILD=PASS
          zip_sha="$(sha256sum "$RUNNER_TEMP/p08-r43-schema-a.zip" | cut -d' ' -f1)"
          php private-p08-bridge/tests/compatibility/r43_schema_atomic_zip.php "$RUNNER_TEMP/p08-r43-bridge-extract" "$RUNNER_TEMP/p08-r43-schema-a.zip" "$BRIDGE_SHA" "$old_manifest" "$TARGET_SHA" "$zip_sha" > "$RUNNER_TEMP/r43-schema-archive-test.log" 2>&1 || { echo P08_R43_SCHEMA_ATOMIC_ARCHIVE_VERIFIER=FAIL; exit 1; }
          grep -qx 'P08_R43_SCHEMA_ATOMIC_DEV_ARCHIVE_GATE=PASS' "$RUNNER_TEMP/r43-schema-archive-test.log"
          echo P08_R43_SCHEMA_ATOMIC_FULL_ZIP_AND_TAMPER_MATRIX=PASS
      - name: Refuse forged prior FULL digest and changed additive migration source
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          old_manifest="$(sha256sum "$RUNNER_TEMP/p08-r43-bridge-extract/FULL_MANIFEST.json" | cut -d' ' -f1)"
          bad_digest="$(printf 'f%.0s' {1..64})"
          if python3 private-p08-bridge/scripts/build_r43_schema_atomic.py --source-full "$RUNNER_TEMP/p08-r43-bridge-extract" --target-runtime private-p08-target --output "$RUNNER_TEMP/r43-rejected.zip" --source-sha "$BRIDGE_SHA" --source-full-sha256 "$bad_digest" --target-sha "$TARGET_SHA" > "$RUNNER_TEMP/r43-bad-full.log" 2>&1; then echo P08_R43_FORGED_FULL_ACCEPTED; exit 1; fi
          test ! -e "$RUNNER_TEMP/r43-rejected.zip"
          mutation='private-p08-target/database/migrations/2026_11_23_000017_create_automation_local_safety_and_rule_versions.php'
          cp "$mutation" "$RUNNER_TEMP/r43-original-migration.php"
          printf '\n// disposable unauthorized migration change\n' >> "$mutation"
          if python3 private-p08-bridge/scripts/build_r43_schema_atomic.py --source-full "$RUNNER_TEMP/p08-r43-bridge-extract" --target-runtime private-p08-target --output "$RUNNER_TEMP/r43-rejected.zip" --source-sha "$BRIDGE_SHA" --source-full-sha256 "$old_manifest" --target-sha "$TARGET_SHA" > "$RUNNER_TEMP/r43-bad-migration.log" 2>&1; then echo P08_R43_CHANGED_SCHEMA_ACCEPTED; exit 1; fi
          test ! -e "$RUNNER_TEMP/r43-rejected.zip"
          cp "$RUNNER_TEMP/r43-original-migration.php" "$mutation"
          echo P08_R43_SCHEMA_ATOMIC_SOURCE_TAMPER_REFUSED=PASS
      - name: Owner authenticated intent and site-user isolated private schema asset intake
        shell: bash
        env:
          P08_R145_ISOLATED: 'YES'
          P08_R43_DISPOSABLE: 'YES'
        run: |
          set -Eeuo pipefail
          set +x
          php -l private-p08-bridge/src/Upgrade/R43OwnerSchemaPreparation.php > "$RUNNER_TEMP/r43-owner-prep-syntax.log" 2>&1 || { echo P08_R43_OWNER_PREP_SYNTAX=FAIL; exit 1; }
          php -l private-p08-bridge/tests/compatibility/r43_owner_schema_preparation.php >> "$RUNNER_TEMP/r43-owner-prep-syntax.log" 2>&1 || { echo P08_R43_OWNER_PREP_TEST_SYNTAX=FAIL; exit 1; }
          php -l private-p08-bridge/src/Upgrade/r43-owner-schema-prepare-worker.php >> "$RUNNER_TEMP/r43-owner-prep-syntax.log" 2>&1 || { echo P08_R43_SCHEMA_CLI_WORKER_SYNTAX=FAIL; exit 1; }
          for mode in good bad; do
            site="$RUNNER_TEMP/p08-r43-site-owner-$mode"
            mkdir -m 700 "$site"
            unzip -q "$RUNNER_TEMP/r43-bridge.zip" -d "$site"
            php private-p08-bridge/tests/compatibility/r43_isolated_installed_transaction.php setup "$site" "$RUNNER_TEMP/p08-r43-target-extract" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/r43-owner-install-$mode.log" 2>&1 || { echo P08_R43_OWNER_INSTALLED_FULL_SETUP=FAIL; exit 1; }
            if ! php private-p08-bridge/tests/compatibility/r43_owner_schema_preparation.php "$mode" "$site" "$RUNNER_TEMP/p08-r43-schema-a.zip" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/r43-owner-prep-$mode.log" 2>&1; then
              safe_reason="$(sed -nE 's/.*(RuntimeException|Error): ([A-Z][A-Z0-9_]{5,120}).*/\2/p' "$RUNNER_TEMP/r43-owner-prep-$mode.log" | head -1 || true)"
              if [[ ! "$safe_reason" =~ ^[A-Z][A-Z0-9_]{5,120}$ ]]; then safe_reason=PRIVATE_FAILURE_UNKNOWN; fi
              echo "P08_R43_OWNER_PREP_FAIL_MODE=$mode"
              echo "P08_R43_OWNER_PREP_FAIL_CODE=$safe_reason"
              exit 1
            fi
            grep -qx "P08_R43_OWNER_SCHEMA_PRIVATE_PREPARATION_$mode=PASS" "$RUNNER_TEMP/r43-owner-prep-$mode.log"
          done
          echo P08_R43_OWNER_SCHEMA_TWO_INSTALLED_OWNER_PREPARATIONS=PASS
      - name: Real prepared Owner isolated APPLY fault rollback and separate-process SIGKILL recovery
        shell: bash
        env:
          P08_R145_ISOLATED: 'YES'
          P08_R43_DISPOSABLE: 'YES'
        run: |
          set -Eeuo pipefail
          set +x
          php -l private-p08-bridge/src/Upgrade/R43IsolatedOwnerSchemaApply.php > "$RUNNER_TEMP/r43-owner-apply-syntax.log" 2>&1 || { echo P08_R43_OWNER_APPLY_SYNTAX=FAIL; exit 1; }
          php -l private-p08-bridge/tests/compatibility/r43_isolated_owner_schema_apply.php >> "$RUNNER_TEMP/r43-owner-apply-syntax.log" 2>&1 || { echo P08_R43_OWNER_APPLY_TEST_SYNTAX=FAIL; exit 1; }
          for case in success fault kill; do
            site="$RUNNER_TEMP/p08-r43-site-owner-apply-$case"
            mkdir -m 700 "$site"
            unzip -q "$RUNNER_TEMP/r43-bridge.zip" -d "$site"
            if ! php private-p08-bridge/tests/compatibility/r43_isolated_installed_transaction.php setup "$site" "$RUNNER_TEMP/p08-r43-target-extract" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/r43-owner-apply-install-$case.log" 2>&1; then echo P08_R43_OWNER_APPLY_INSTALL_REFUSED; exit 1; fi
            if ! php private-p08-bridge/tests/compatibility/r43_owner_schema_preparation.php good "$site" "$RUNNER_TEMP/p08-r43-schema-a.zip" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/r43-owner-apply-prep-$case.log" 2>&1; then echo P08_R43_OWNER_APPLY_PRIVATE_PREP_FAILED; exit 1; fi
            for phase in unconfirmed bad-witness; do
              if ! php private-p08-bridge/tests/compatibility/r43_isolated_owner_schema_apply.php "$phase" "$site" "$RUNNER_TEMP/p08-r43-target-extract" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/r43-owner-apply-$case-$phase.log" 2>&1; then
                safe_reason="$(sed -nE 's/.*(RuntimeException|Error): ([A-Z][A-Z0-9_]{5,120}).*/\2/p' "$RUNNER_TEMP/r43-owner-apply-$case-$phase.log" | head -1 || true)"
                if [[ ! "$safe_reason" =~ ^[A-Z][A-Z0-9_]{5,120}$ ]]; then safe_reason=PRIVATE_FAILURE_UNKNOWN; fi
                echo "P08_R43_OWNER_APPLY_ADMISSION_FAIL=$phase"
                echo "P08_R43_OWNER_APPLY_ADMISSION_REASON=$safe_reason"
                exit 1
              fi
            done
            if [[ "$case" == "kill" ]]; then
              set +e
              php private-p08-bridge/tests/compatibility/r43_isolated_owner_schema_apply.php kill "$site" "$RUNNER_TEMP/p08-r43-target-extract" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/r43-owner-apply-kill.log" 2>&1
              killed=$?
              set -e
              if [[ "$killed" -ne 137 ]]; then echo P08_R43_OWNER_APPLY_REAL_SIGKILL_NOT_137; exit 1; fi
              echo P08_R43_OWNER_APPLY_SIGKILL137_ACTUAL_PROCESS=PASS
              phase=recover
            else
              phase="$case"
            fi
            if ! php private-p08-bridge/tests/compatibility/r43_isolated_owner_schema_apply.php "$phase" "$site" "$RUNNER_TEMP/p08-r43-target-extract" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/r43-owner-apply-$case-$phase.log" 2>&1; then
              safe_reason="$(sed -nE 's/.*(RuntimeException|Error): ([A-Z][A-Z0-9_]{5,120}).*/\2/p' "$RUNNER_TEMP/r43-owner-apply-$case-$phase.log" | head -1 || true)"
              if [[ ! "$safe_reason" =~ ^[A-Z][A-Z0-9_]{5,120}$ ]]; then safe_reason=PRIVATE_FAILURE_UNKNOWN; fi
              echo "P08_R43_OWNER_APPLY_FAILURE_CLASS=$safe_reason"
              exit 1
            fi
            if [[ "$case" == "success" ]]; then
              if ! php private-p08-bridge/tests/compatibility/r43_isolated_owner_schema_apply.php replay "$site" "$RUNNER_TEMP/p08-r43-target-extract" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/r43-owner-apply-$case-replay.log" 2>&1; then echo P08_R43_OWNER_APPLY_REPLAY_GATE_FAILED; exit 1; fi
            fi
            phase_upper="$(printf '%s' "$phase" | tr '[:lower:]' '[:upper:]')"
            grep -qx "P08_R43_OWNER_ISOLATED_SCHEMA_$phase_upper=PASS" "$RUNNER_TEMP/r43-owner-apply-$case-$phase.log"
            echo "P08_R43_OWNER_DISPOSABLE_APPLY_CASE_$case=PASS"
          done
          echo P08_R43_OWNER_ISOLATED_APPLY_SUCCESS_FAULT_SIGKILL_RECOVERY=PASS
      - name: Verify standalone test cannot execute outside registered disposable machine
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          if env -u P08_R43_DISPOSABLE_SCHEMA -u P08_ISOLATED_INSTALL_TEST php private-p08-bridge/tests/compatibility/r43_schema_atomic_zip.php >/dev/null 2>&1; then echo P08_R43_NON_ISOLATED_ACCEPTED; exit 1; fi
          echo P08_R43_SCHEMA_ATOMIC_TEST_ISOLATION=PASS
      - name: Clean private sources, all development ZIPs and synthetic negative fixtures
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- private-p08-bridge private-p08-target gov-proof
          rm -rf -- "$RUNNER_TEMP/p08-r43-target-extract" "$RUNNER_TEMP/p08-r43-bridge-extract"
          rm -rf -- "$RUNNER_TEMP/p08-r43-site-owner-good" "$RUNNER_TEMP/p08-r43-site-owner-bad"
          rm -rf -- "$RUNNER_TEMP/p08-r43-site-owner-apply-success" "$RUNNER_TEMP/p08-r43-site-owner-apply-fault" "$RUNNER_TEMP/p08-r43-site-owner-apply-kill"
          rm -f -- "$RUNNER_TEMP"/p08-r43-schema-*.zip "$RUNNER_TEMP"/r43-*.zip "$RUNNER_TEMP"/r43-*.log "$RUNNER_TEMP"/r43-*.php
          test ! -e private-p08-bridge && test ! -e private-p08-target && test ! -e gov-proof && test ! -e "$RUNNER_TEMP/p08-r43-schema-a.zip"
          echo P08_R43_SCHEMA_ATOMIC_EPHEMERAL_CLEANUP=PASS
