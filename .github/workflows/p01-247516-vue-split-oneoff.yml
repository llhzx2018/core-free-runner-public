name: P01 2.47.516 three-subsite Vue split validation (one-off)
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  exact-vue-three-subsite:
    runs-on: ubuntu-24.04
    timeout-minutes: 36
    env:
      TARGET_VERSION: 2.47.516
      TARGET_SHA: f7bc6e231b6e76fbccffc0aa0b85e0ab8cc44989
    steps:
      - name: Checkout registered public Runner lane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Audit exact source target and rendered workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ephemeral_lane_spec.py validate --spec scripts/ephemeral/p01-247516-vue-split.json > "$RUNNER_TEMP/p01-spec.txt"
          python3 scripts/ephemeral_lane_spec.py audit-rendered --spec scripts/ephemeral/p01-247516-vue-split.json --input .github/workflows/p01-247516-vue-split-oneoff.yml > "$RUNNER_TEMP/p01-audit.txt"
          grep -F '"status": "PASS"' "$RUNNER_TEMP/p01-audit.txt" >/dev/null
          echo P01_VUE_SPLIT_EXACT_TARGET_AUDIT=PASS
      - name: Checkout exact P01 private source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - name: Setup native Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install lockfile npm dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(cat candidate/VERSION)" = "$TARGET_VERSION"
          cd candidate/src/app/next/frontend
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/p01-npm-install.txt" 2>&1 || { echo P01_VUE_NPM_INSTALL=FAIL; exit 1; }
          echo P01_VUE_NPM_INSTALL=PASS
      - name: TypeScript and Vue SFC typecheck
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate/src/app/next/frontend
          npm run typecheck > "$RUNNER_TEMP/p01-typecheck.txt" 2>&1 || {
            grep -E 'error TS[0-9]+|Error|error:' "$RUNNER_TEMP/p01-typecheck.txt" | head -n 14 || true
            echo P01_VUE_SPLIT_TYPECHECK=FAIL; exit 1;
          }
          echo P01_VUE_SPLIT_TYPECHECK=PASS
      - name: All existing Vue/Vitest unit regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate/src/app/next/frontend
          npm run test:unit > "$RUNNER_TEMP/p01-vue-unit.txt" 2>&1 || {
            grep -E 'FAIL|Error|Assertion|failed|FAILURES' "$RUNNER_TEMP/p01-vue-unit.txt" | head -n 12 || true
            echo P01_VUE_SPLIT_UNIT=FAIL; exit 1;
          }
          echo P01_VUE_SPLIT_UNIT=PASS
      - name: Build actual scoped-style Vue production bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate/src/app/next/frontend
          npm run build > "$RUNNER_TEMP/p01-vite-build.txt" 2>&1 || {
            grep -E 'ERROR|error|failed|Failed' "$RUNNER_TEMP/p01-vite-build.txt" | head -n 14 || true
            echo P01_VUE_SPLIT_BUILD=FAIL; exit 1;
          }
          echo P01_VUE_SPLIT_BUILD=PASS
      - name: Chromium three affected subsite screens
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate/src/app/next/frontend
          npx playwright install --with-deps chromium > "$RUNNER_TEMP/p01-browser-install.txt" 2>&1 || { echo P01_VUE_SPLIT_BROWSER_SETUP=BLOCKED; exit 1; }
          npx playwright test tests/projects.spec.ts tests/watch.spec.ts tests/topics.spec.ts --reporter=line > "$RUNNER_TEMP/p01-browser.txt" 2>&1 || {
            grep -E 'failed|Error:|FAIL|expect' "$RUNNER_TEMP/p01-browser.txt" | head -n 15 || true
            echo P01_VUE_SPLIT_CHROMIUM=FAIL; exit 1;
          }
          echo P01_VUE_SPLIT_CHROMIUM=PASS
      - name: Always purge exact private source, logs and build artifacts
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate "$RUNNER_TEMP"/p01-*.txt
          echo P01_VUE_SPLIT_PRIVATE_SOURCE_PERSISTED=NO
          echo P01_VUE_SPLIT_PUBLIC_ARTIFACTS=NONE
