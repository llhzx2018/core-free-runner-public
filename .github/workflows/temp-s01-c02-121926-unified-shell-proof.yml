name: TEMP S01-C02 1.21.926 Unified Shell Proof

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  exact-source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: bf59a1cd9ee4be92f3f06aa1e885e7835a898147
      BASE_SHA: cb5fb4c97bc5b3bab7cff40e0fb4dd5fec597fe0

    steps:
      - name: Checkout exact product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: bf59a1cd9ee4be92f3f06aa1e885e7835a898147
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: product
          persist-credentials: false

      - name: Exact bounded diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C product rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' < product/VERSION)" = "1.21.926"
          actual="$(git -C product diff --name-only "$BASE_SHA" "$SOURCE_SHA" | sort)"
          expected="$(printf '%s\n' \
            CHANGELOG.md \
            VERSION \
            assets/css/current/admin-s01-page-header-r37.css \
            includes/admin-v13/route-contract.php \
            includes/admin-v13/tab-controller.php \
            includes/admin-v13/views/publish_zip.php \
            includes/admin-v13/views/seo_planner.php \
            includes/admin-v13/views/seo_today.php \
            includes/admin-v13/views/system_site_release.php \
            includes/source-quality-runtime-smoke-parts/02-menu-content-routes.php \
            includes/views/admin-style-helpers/admin-s01-uiux-polish.php \
            tests/s01-c02-121926-unified-shell-orphan-r37-contract.php \
            vf-ops.php | sort)"
          test "$actual" = "$expected"
          test "$(git -C product diff --name-only "$BASE_SHA" "$SOURCE_SHA" -- database config includes/wp-update docs/authority includes/admin-v13/services | wc -l)" = "0"

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l product/vf-ops.php
          php -l product/includes/admin-v13/route-contract.php
          php -l product/includes/admin-v13/tab-controller.php
          php -l product/includes/source-quality-runtime-smoke-parts/02-menu-content-routes.php
          php -l product/includes/views/admin-style-helpers/admin-s01-uiux-polish.php
          php -l product/tests/s01-c02-121926-unified-shell-orphan-r37-contract.php

      - name: R37 product contract
        shell: bash
        run: |
          set -euo pipefail
          php product/tests/s01-c02-121926-unified-shell-orphan-r37-contract.php

      - name: Independent shell orphan proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path("product")
          route=(root/"includes/admin-v13/route-contract.php").read_text(encoding="utf-8")
          nav=(root/"includes/views/admin-shell-tabs-parts/02-shell-navigation.php").read_text(encoding="utf-8")
          loader=(root/"includes/views/admin-style-helpers/admin-s01-uiux-polish.php").read_text(encoding="utf-8")
          css=(root/"assets/css/current/admin-s01-page-header-r37.css").read_text(encoding="utf-8")
          controller=(root/"includes/admin-v13/tab-controller.php").read_text(encoding="utf-8")

          rows=[]
          for line in route.splitlines():
              m=re.match(r"^\s*'([^']+)'\s*=>\s*\[(.*)\],?\s*$",line)
              if not m: continue
              key,body=m.group(1),m.group(2)
              vm=re.search(r"'view'=>'(admin-v13/views/[^']+)'",body)
              sm=re.search(r"'status'=>'([^']+)'",body)
              if vm and sm:
                  rows.append((key,vm.group(1),sm.group(1)))
          assert len(rows)==39, len(rows)
          assert sum(1 for _,_,s in rows if s=="migration_evidence")==13
          assert sum(1 for _,_,s in rows if s!="migration_evidence")==26
          for key,_,_ in rows:
              assert ("'"+key+"'") in nav or ('"'+key+'"') in nav, key

          declared=set(re.findall(r"admin-v13/views/[A-Za-z0-9_-]+\.php",route))
          physical=set(
              p.relative_to(root/"includes").as_posix()
              for p in (root/"includes/admin-v13/views").rglob("*.php")
          )
          assert physical==declared, (sorted(physical-declared),sorted(declared-physical))

          for dead in ("seo_today.php","publish_zip.php","system_site_release.php","seo_planner.php"):
              assert not (root/"includes/admin-v13/views"/dead).exists(), dead

          assert "$route['view']='admin-v13/views/seo_today_v6.php';" not in controller
          assert "$route['view']='admin-v13/views/publish_zip_v6.php';" not in controller
          assert "$route['view']='admin-v13/views/system_site_release_v6.php';" not in controller
          assert "$route['view']='admin-v13/views/content_workflow.php';" in controller

          assert "vf-ops-admin-s01-page-header-r37" in loader
          assert "admin-s01-page-header-r37.css" in loader
          assert "--vf-r37-page-title-size:34px" in css
          assert "--vf-r37-page-title-mobile:30px" in css
          assert css.count("{")==css.count("}")
          print("S01-C02 1.21.926 unified shell + orphan exact proof PASS")
          PY

      - name: Cleanup
        if: always()
        run: rm -rf product

# synchronize exact proof

# retry after contract syntax fix

# retry after shadow-reference false-positive fix
