name: P01 V2.47.275 Core Updates Proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p01-v247275-core-updates-proof.yml"

permissions:
  contents: read

jobs:
  proof:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'proof(P01): V2.47.275 core-updates')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli jq >/dev/null

      - name: Clone exact core-updates candidate
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/core-updates.git" candidate
          git -C candidate fetch -q origin 31baf47e41d5d868fed954f9560d766758e07435
          git -C candidate checkout -q --detach 31baf47e41d5d868fed954f9560d766758e07435
          test "$(git -C candidate rev-parse HEAD)" = "31baf47e41d5d868fed954f9560d766758e07435"
          echo CORE_UPDATES_EXACT_SOURCE=PASS

      - name: Canonical CI equivalent
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 scripts/check_manifest_contract.py
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find update-core/php -type f -name '*.php' -print0)
          php update-core/php/tests/run.php
          echo CORE_UPDATES_CANONICAL_CI_EQUIVALENT=PASS

      - name: Verify P01 V2.47.275 identity
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          jq -e '
            .schema_version=="1.0" and
            .project_id=="P01" and
            .component_id=="APP" and
            .enabled==true and
            .current_version=="2.47.274" and
            .target_version=="2.47.275" and
            .update_type=="ATOMIC" and
            .from_versions==["2.47.274"] and
            .schema_from=="2026090401" and
            .schema_to=="2026090401" and
            .repository=="llhzx2018/vf-start" and
            .release_tag=="v2.47.275" and
            .release_id==405492062 and
            .product_identity=="67c5cf14e7a7b0c2d0ab880878df93326f5c0adb" and
            .asset_name=="VF_Start_V2.47.275_UPDATE.zip" and
            .asset_bytes==2353558 and
            .asset_sha256=="163f1a69863757a847285a05a499d1258a8d2697f55ae45e305826db1af36243" and
            .backup_required==true and
            .rollback_supported==true and
            .minimum_php=="8.0.0" and
            (.notes | contains("中文一致性"))
          ' projects/P01.json >/dev/null
          echo P01_V247275_MANIFEST_IDENTITY=PASS

      - name: Verify bounded delta
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          git fetch -q origin main
          mapfile -t changed < <(git diff --name-only origin/main...HEAD)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "projects/P01.json"
          echo CORE_UPDATES_BOUNDED_DELTA=PASS
          echo PRODUCTION_WRITE=NO
