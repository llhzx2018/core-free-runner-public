name: P01 V2.24.0 Formal Artifact Gate
on:
  push:
    branches: [task/p01-v222-multi-surface-gate-20260828]
    paths: ['.github/workflows/p01-v224-formal-artifact-gate-20260828.yml']
permissions:
  contents: read
env:
  CANDIDATE: 867e3387b8efb70398287d05fd3652540efa77c8
  CANDIDATE_TREE: 5985dab8ee071c881fd1e425864ed363e3bdc905
  SOURCE_TAG: v2.23.0
  SOURCE_COMMIT: 6e7d30e6ea0c8f5f70076a69b0d1e6fb9be620b2
  VERSION: 2.24.0
  SOURCE_VERSION: 2.23.0
  SCHEMA: '2026082801'
  OUT: /tmp/p01-v224-artifacts
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.CANDIDATE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: candidate
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE_TAG }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: production
      - name: Build deterministic same-schema artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test "$(git -C production rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(tr -d '\r\n' < candidate/VERSION)" = "$VERSION"
          test "$(tr -d '\r\n' < production/VERSION)" = "$SOURCE_VERSION"
          find candidate/src -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          find candidate/src -type f -name '*.js' -print0 | xargs -0 -n1 node --check >/dev/null
          rm -rf runner proven "$OUT"
          git clone -q --depth 1 --branch task/p01-v222-multi-surface-gate-20260828 https://github.com/llhzx2018/core-free-runner-public.git runner
          git clone -q --depth 1 --branch agent/p01-22121-formal-artifact-gate-20260819 https://github.com/llhzx2018/core-free-runner-public.git proven
          cat >/tmp/p01-v224-build.py <<'PY'
          from pathlib import Path
          import hashlib, importlib.util, json
          ROOT=Path.cwd(); VERSION='2.24.0'; SOURCE_VERSION='2.23.0'; SCHEMA='2026082801'
          CANDIDATE='867e3387b8efb70398287d05fd3652540efa77c8'; TREE='5985dab8ee071c881fd1e425864ed363e3bdc905'; SOURCE='6e7d30e6ea0c8f5f70076a69b0d1e6fb9be620b2'
          def load(name,path):
              s=importlib.util.spec_from_file_location(name,path); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); return m
          base=load('base',ROOT/'proven/scripts/p01-build-release.py'); v2=load('v2',ROOT/'proven/scripts/p01-build-release-v2.py')
          sha=lambda b: hashlib.sha256(b).hexdigest()
          gate_only={'.gitignore','CHANGELOG.md','DEPLOY-HERE.txt','FULL-PACKAGE-NOTES.txt','README.md','UPGRADE-V2.txt','robots.txt'}
          def runtime(files): return {k:v for k,v in files.items() if k!='release-manifest.json' and k not in gate_only and k!='VF-Start-Browser-Extension.zip'}
          target_delivery=base.collect(ROOT/'candidate/src'); source_delivery=base.collect(ROOT/'production/src')
          assert target_delivery['VERSION.txt'].strip()==VERSION.encode(); assert source_delivery['VERSION.txt'].strip()==SOURCE_VERSION.encode()
          target=runtime(target_delivery); source=runtime(source_delivery)
          changed=sorted(k for k in target if k not in source or sha(target[k])!=sha(source[k])); added=sorted(set(target)-set(source)); removed=sorted(set(source)-set(target))
          if not changed: raise SystemExit('empty runtime delta')
          for r in ['app/SurfaceShell.php','assets/surface-ux-closure.css','system-baseline.php','cli/baseline-verify.php','app/SurfaceRepository.php','cli/surface-verify.php']:
              if r not in target: raise SystemExit('missing target runtime '+r)
          manifest={'project':'VF Start','project_id':'P01','project_slug':'vf-start','component_id':'APP','version':VERSION,'source_version':SOURCE_VERSION,'schema_version':SCHEMA,'source_schema_version':SCHEMA,'release_type':'formal','stage':'FORMAL_ARTIFACT_GATE','deployable':True,'release_authorized':False,'source_commit':CANDIDATE,'source_tree':TREE,'production_source_commit':SOURCE,'schema_change':False,'schema_migrations':[],'runtime_data_included':False,'seed_user_business_data_included':False,'runtime_hashed_file_count':len(target),'runtime_files':{k:sha(v) for k,v in sorted(target.items())},'atomic_runtime_boundary':{'source_version':SOURCE_VERSION,'target_version':VERSION,'source_app_gate_count':len(source),'target_app_gate_count':len(target),'added_files':added,'removed_files':removed,'runtime_delta':changed},'browser_extension':{'version':'1.6.4','release_unit':'INDEPENDENT','released_this_round':False},'update':{'project_id':'P01','component_id':'APP','manifest_truth':'llhzx2018/core-updates/projects/P01.json','release_truth':'GitHub Release','asset_name':'VF_Start_V2.24.0_UPDATE.zip','supported_from':[SOURCE_VERSION],'backup_required':True,'rollback_supported':True},'multi_surface':{'surfaces':['start','channels','watch'],'profile_table':'resource_surface_profiles','no_profile_semantics':'START','automatic_reclassification':False},'common_product_baseline':{'id':'VF-COMMON-PRODUCT-BASELINE@2.0','profile':'PERSONAL_SINGLE_ADMIN','current':True}}
          mb=(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n').encode()
          full=dict(target_delivery); full['release-manifest.json']=mb
          atomic=dict(target); atomic['release-manifest.json']=mb
          repair=v2.build_repair(source,atomic,sha(target['app/UpdateManager.php']))
          old="public const SOURCE_VERSION='2.21.14';\n    public const TARGET_VERSION='2.21.15';\n    public const TARGET_SCHEMA='2026080902';"
          new="public const SOURCE_VERSION='2.23.0';\n    public const TARGET_VERSION='2.24.0';\n    public const TARGET_SCHEMA='2026082801';"
          if repair.count(old)!=1: raise SystemExit('repair constant anchor mismatch')
          repair=repair.replace(old,new,1)
          out=Path('/tmp/p01-v224-artifacts'); out.mkdir(parents=True,exist_ok=True)
          rp=out/'repair-v2.24.0.php'; rp.write_text(repair,encoding='utf-8',newline='\n')
          base.deterministic_zip(out/'VF-Start-V2.24.0-FULL.zip',full)
          base.deterministic_zip(out/'VF-Start-V2.24.0-UPDATE.zip',{rp.name:rp.read_bytes()})
          base.deterministic_zip(out/'VF_Start_V2.24.0_UPDATE.zip',{rp.name:rp.read_bytes()})
          result={'project_id':'P01','version':VERSION,'source_version':SOURCE_VERSION,'candidate':CANDIDATE,'candidate_tree':TREE,'source_commit':SOURCE,'source_schema':SCHEMA,'schema':SCHEMA,'schema_change':False,'runtime_source_files':len(source),'runtime_target_files':len(target),'runtime_added':added,'runtime_removed':removed,'runtime_delta':changed,'runtime_delta_count':len(changed),'atomic_update':True,'status':'BUILD_PASS'}
          (out/'P01-V2.24.0-ARTIFACT-GATE.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          arts=[p for p in sorted(out.iterdir()) if p.is_file()]
          (out/'SHA256SUMS.txt').write_text(''.join(f'{base.sha256_file(p)}  {p.name}\n' for p in arts),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False))
          PY
          python3 /tmp/p01-v224-build.py | tee /tmp/p01-v224-build.log
          php -l "$OUT/repair-v2.24.0.php" >/dev/null
          php "$OUT/repair-v2.24.0.php" --self-test | tee "$OUT/atomic-self-test.json"
          jq -e '.ok==true and .global_barrier==true and .interruption_recovery==true' "$OUT/atomic-self-test.json" >/dev/null
          unzip -t "$OUT/VF_Start_V2.24.0_UPDATE.zip" >/dev/null
          test "$(unzip -Z1 "$OUT/VF_Start_V2.24.0_UPDATE.zip" | wc -l)" -eq 1
          unzip -Z1 "$OUT/VF_Start_V2.24.0_UPDATE.zip" | grep -Fxq 'repair-v2.24.0.php'
          ASSET_SHA=$(sha256sum "$OUT/VF_Start_V2.24.0_UPDATE.zip"|awk '{print $1}'); ASSET_BYTES=$(stat -c %s "$OUT/VF_Start_V2.24.0_UPDATE.zip")
          printf 'ASSET_SHA=%s\nASSET_BYTES=%s\n' "$ASSET_SHA" "$ASSET_BYTES" >> "$GITHUB_ENV"
          jq -e '.version=="2.24.0" and .source_version=="2.23.0" and .source_schema=="2026082801" and .schema=="2026082801" and .schema_change==false and .status=="BUILD_PASS"' "$OUT/P01-V2.24.0-ARTIFACT-GATE.json" >/dev/null
          echo P01_V224_BUILD=PASS
      - name: FULL fresh install and UX
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT=/tmp/p01-v224-full; COOKIE=/tmp/p01-v224-full.cookies
          rm -rf "$ROOT" "$COOKIE"; mkdir -p "$ROOT"; unzip -q "$OUT/VF-Start-V2.24.0-FULL.zip" -d "$ROOT"
          test "$(tr -d '\r\n' < "$ROOT/VERSION.txt")" = "$VERSION"
          php -S 127.0.0.1:18251 -t "$ROOT" >/tmp/p01-v224-full.log 2>&1 & PID=$!; trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -sS http://127.0.0.1:18251/setup.php -o /tmp/setup.html && break || sleep 1; done
          curl -fsS -c "$COOKIE" -b "$COOKIE" http://127.0.0.1:18251/setup.php -o /tmp/setup.html
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/setup.html').read(); print(re.search(r'name="setup_csrf"\s+value="([^"]+)"',s).group(1))
          PY
          )
          curl -sS -c "$COOKIE" -b "$COOKIE" -X POST http://127.0.0.1:18251/setup.php --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=V224 Full' --data-urlencode 'admin_password=P01V224!Full' --data-urlencode 'admin_password_confirm=P01V224!Full' -o /tmp/post.html
          test -f "$ROOT/app/.runtime.php"
          php "$ROOT/cli/verify.php" | tee /tmp/v.txt; grep -Fx 'VERIFY_PASS=YES' /tmp/v.txt
          php "$ROOT/cli/surface-verify.php" | tee /tmp/s.txt; grep -Fx 'MULTI_SURFACE_PASS=YES' /tmp/s.txt
          php "$ROOT/cli/baseline-verify.php" | tee /tmp/b.txt; grep -Fx 'BASELINE_CORE_PASS=YES' /tmp/b.txt; grep -Fx 'DRIFT_COUNT=0' /tmp/b.txt; grep -Fx 'UNKNOWN_COUNT=0' /tmp/b.txt
          curl -fsS -c "$COOKIE" -b "$COOKIE" -H 'Content-Type: application/json' -X POST 'http://127.0.0.1:18251/api.php?action=login' --data '{"password":"P01V224!Full"}' | jq -e '.ok==true' >/dev/null
          for route in surfaces.php start.php channels.php watch.php surface-manager.php; do curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:18251/$route" -o "/tmp/full-${route%.php}.html"; grep -F 'vf-app-sidebar' "/tmp/full-${route%.php}.html" >/dev/null; grep -F 'surface-ux-closure.css' "/tmp/full-${route%.php}.html" >/dev/null; done
          echo P01_V224_FULL=PASS
      - name: Actual V2.23.0 to V2.24.0 atomic updater
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT=/tmp/p01-v224-owner; COOKIE=/tmp/p01-v224-owner.cookies
          rm -rf "$ROOT" "$COOKIE"; cp -a production/src "$ROOT"
          php -S 127.0.0.1:18252 -t "$ROOT" >/tmp/p01-v224-owner.log 2>&1 & PID=$!; trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -sS http://127.0.0.1:18252/setup.php -o /tmp/owner-setup.html && break || sleep 1; done
          curl -fsS -c "$COOKIE" -b "$COOKIE" http://127.0.0.1:18252/setup.php -o /tmp/owner-setup.html
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/owner-setup.html').read(); print(re.search(r'name="setup_csrf"\s+value="([^"]+)"',s).group(1))
          PY
          )
          curl -sS -c "$COOKIE" -b "$COOKIE" -X POST http://127.0.0.1:18252/setup.php --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=V224 Owner' --data-urlencode 'admin_password=P01V224!Owner' --data-urlencode 'admin_password_confirm=P01V224!Owner' -o /tmp/owner-post.html
          test -f "$ROOT/app/.runtime.php"
          cat >/tmp/seed.php <<'PHP'
          <?php require '/tmp/p01-v224-owner/app/bootstrap.php'; require_once '/tmp/p01-v224-owner/app/SurfaceRepository.php'; $r=new VfRepository(vf_db());$s=new VfSurfaceRepository(vf_db());$c=$r->createCategory(['name'=>'Keep','description'=>'','is_private'=>false]);$a=$r->saveLink(null,['category_id'=>$c,'title'=>'Keep Start','url'=>'https://example.com/start','description'=>'keep','is_private'=>false],'manual');$b=$r->saveLink(null,['category_id'=>$c,'title'=>'Keep Channel','url'=>'https://youtube.com/@keep','description'=>'keep','is_private'=>false],'manual');$s->upsertProfile((int)$b['id'],['surface'=>'channels','resource_kind'=>'youtube','background_friendly'=>true]);file_put_contents('/tmp/start-id',(string)$a['id']);file_put_contents('/tmp/channel-id',(string)$b['id']);
          PHP
          php /tmp/seed.php
          cp "$OUT/repair-v2.24.0.php" "$ROOT/repair-v2.24.0.php"
          php "$ROOT/repair-v2.24.0.php" --verify-source="$ROOT" | jq -e '.ok==true' >/dev/null
          php "$ROOT/repair-v2.24.0.php" --run="$ROOT" | tee /tmp/update-result.json
          jq -e '.ok==true and .already_current==false and .schema=="2026082801" and .integrity=="ok" and .fk==0' /tmp/update-result.json >/dev/null
          test "$(tr -d '\r\n' < "$ROOT/VERSION.txt")" = "$VERSION"
          php "$ROOT/cli/verify.php" | grep -Fx 'VERIFY_PASS=YES'
          php "$ROOT/cli/surface-verify.php" | grep -Fx 'MULTI_SURFACE_PASS=YES'
          php "$ROOT/cli/baseline-verify.php" | tee /tmp/up-base.txt; grep -Fx 'DRIFT_COUNT=0' /tmp/up-base.txt; grep -Fx 'UNKNOWN_COUNT=0' /tmp/up-base.txt
          START=$(cat /tmp/start-id); CHANNEL=$(cat /tmp/channel-id)
          php -r "require '$ROOT/app/bootstrap.php'; require_once '$ROOT/app/SurfaceRepository.php'; \$r=new VfRepository(vf_db()); \$s=new VfSurfaceRepository(vf_db()); \$a=\$r->getLinkById((int)'$START'); \$b=\$r->getLinkById((int)'$CHANNEL'); if((\$a['title']??'')!=='Keep Start'||(\$b['title']??'')!=='Keep Channel')exit(1); \$p=\$s->profile((int)'$CHANNEL'); if((\$p['surface']??'')!=='channels')exit(1); echo 'DATA_PRESERVED=YES\n';"
          curl -fsS -c "$COOKIE" -b "$COOKIE" -H 'Content-Type: application/json' -X POST 'http://127.0.0.1:18252/api.php?action=login' --data '{"password":"P01V224!Owner"}' | jq -e '.ok==true' >/dev/null
          curl -fsS -c "$COOKIE" -b "$COOKIE" http://127.0.0.1:18252/channels.php | grep -F 'surface-ux-closure.css' >/dev/null
          echo P01_V224_ACTUAL_UPDATER=PASS
      - name: Rollback injection
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT=/tmp/p01-v224-rollback; rm -rf "$ROOT"; cp -a production/src "$ROOT"
          php -S 127.0.0.1:18253 -t "$ROOT" >/tmp/rb.log 2>&1 & PID=$!; trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -sS http://127.0.0.1:18253/setup.php -o /tmp/rb-setup.html && break || sleep 1; done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/rb-setup.html').read(); print(re.search(r'name="setup_csrf"\s+value="([^"]+)"',s).group(1))
          PY
          )
          curl -sS -c /tmp/rb.cookies -b /tmp/rb.cookies -X POST http://127.0.0.1:18253/setup.php --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=Rollback' --data-urlencode 'admin_password=P01V224!Rollback' --data-urlencode 'admin_password_confirm=P01V224!Rollback' -o /tmp/rb-post.html
          cp "$OUT/repair-v2.24.0.php" "$ROOT/repair-v2.24.0.php"
          set +e; VF_ATOMIC_TEST_FAIL_AFTER_APPLY=1 php "$ROOT/repair-v2.24.0.php" --run="$ROOT" >/tmp/rb-result.txt 2>&1; RC=$?; set -e
          test "$RC" -ne 0
          test "$(tr -d '\r\n' < "$ROOT/VERSION.txt")" = "$SOURCE_VERSION"
          php "$ROOT/repair-v2.24.0.php" --verify-source="$ROOT" | jq -e '.ok==true' >/dev/null
          php "$ROOT/cli/verify.php" | grep -Fx 'VERIFY_PASS=YES'
          echo P01_V224_ROLLBACK=PASS
      - name: Artifact metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '{"version":"2.24.0","source_version":"2.23.0","schema":"2026082801","candidate":"%s","candidate_tree":"%s","asset_name":"VF_Start_V2.24.0_UPDATE.zip","asset_bytes":%s,"asset_sha256":"%s","status":"PASS"}\n' "$CANDIDATE" "$CANDIDATE_TREE" "$ASSET_BYTES" "$ASSET_SHA" > "$OUT/P01-V2.24.0-FORMAL-METADATA.json"
          cat "$OUT/P01-V2.24.0-FORMAL-METADATA.json"
          echo P01_V224_FORMAL_ARTIFACT_GATE=PASS
      - uses: actions/upload-artifact@v4
        with:
          name: p01-v224-formal-artifacts-${{ env.CANDIDATE }}
          path: /tmp/p01-v224-artifacts
          if-no-files-found: error
          retention-days: 7
