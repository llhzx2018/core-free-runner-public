name: GOV-DOC PR 186 exact-source quality proof (temporary)

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/gov-pr186-source-proof.yml'

permissions:
  contents: read

jobs:
  gov186-exact-source:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      startsWith(github.head_ref, 'maintenance/gov-pr186-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Read exact temporary private governance source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/gov-doc
          ref: c934984ed812c551be3ee736a6728b65ceffd004
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: gov-src
      - name: Verify source and execute architecture negative fixtures
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C gov-src rev-parse HEAD)" = "c934984ed812c551be3ee736a6728b65ceffd004"
          echo 'GOV_EXACT_SOURCE=c934984ed812c551be3ee736a6728b65ceffd004'
          if python3 -B -m unittest discover -s gov-src/governance/agent -p test_code_architecture_lint.py > "$RUNNER_TEMP/gov186-arch.log" 2>&1; then
            grep -E '^Ran [0-9]+ tests|^OK$' "$RUNNER_TEMP/gov186-arch.log" || true
            echo 'GOV186_ARCHITECTURE_NEGATIVE_FIXTURES=PASS'
          else
            echo 'GOV186_ARCHITECTURE_NEGATIVE_FIXTURES=FAIL'
            exit 1
          fi
      - name: Verify naming enabled manifest and stable global governance routers
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          python3 -B gov-src/governance/agent/code_architecture_lint.py --manifest gov-src/governance/agent/VF_CODE_ARCHITECTURE_MANIFEST_EXAMPLE_V1.1.json > "$RUNNER_TEMP/gov186-manifest.log" 2>&1 || { echo 'GOV186_MANIFEST=FAIL'; exit 1; }
          echo 'GOV186_MANIFEST=PASS'
          python3 -B gov-src/governance/public-authority/tools/global_closure_lint.py --root gov-src > "$RUNNER_TEMP/gov186-global.log" 2>&1 || { echo 'GOV186_GLOBAL_CLOSURE=FAIL'; exit 1; }
          echo 'GOV186_GLOBAL_CLOSURE=PASS'
          python3 -B gov-src/governance/public-authority/tools/current_dependency_lint.py --root gov-src > "$RUNNER_TEMP/gov186-dependency.log" 2>&1 || { echo 'GOV186_CURRENT_DEPENDENCY=FAIL'; exit 1; }
          echo 'GOV186_CURRENT_DEPENDENCY=PASS'
      - name: Run public authority negative fixtures and actual Git impact gates
        shell: bash
        env:
          PR_BODY: |
            PUBLIC_AUTHORITY_IMPACT: UPDATED
            AFFECTED_DOMAINS: INSTALL, UPGRADE, SECURITY, TESTING, GIT, UA_UI, DATA_SCHEMA
            IMPACT_REASON: New repository bootstrap source naming conventions and architecture checks are changed with explicit review of their applicable public governance domains.
        run: |
          set -Eeuo pipefail
          set +x
          if python3 -B -m unittest discover -s gov-src/governance/public-authority/tools -p test_global_closure_lint.py > "$RUNNER_TEMP/gov186-global-fixtures.log" 2>&1; then
            grep -E '^Ran [0-9]+ tests|^OK$' "$RUNNER_TEMP/gov186-global-fixtures.log" || true
            echo 'GOV186_GLOBAL_NEGATIVE_FIXTURES=PASS'
          else
            echo 'GOV186_GLOBAL_NEGATIVE_FIXTURES=FAIL'
            exit 1
          fi
          if python3 -B -m unittest discover -s gov-src/governance/public-authority/tools -p test_current_dependency_lint.py > "$RUNNER_TEMP/gov186-current-fixtures.log" 2>&1; then
            grep -E '^Ran [0-9]+ tests|^OK$' "$RUNNER_TEMP/gov186-current-fixtures.log" || true
            echo 'GOV186_CURRENT_DEPENDENCY_NEGATIVE_FIXTURES=PASS'
          else
            echo 'GOV186_CURRENT_DEPENDENCY_NEGATIVE_FIXTURES=FAIL'
            exit 1
          fi
          if python3 -B gov-src/governance/public-authority/tools/global_closure_lint.py --root gov-src --git-base 64c8a874210f2fa89fee07c7283ffce2bbe6b36c --git-head c934984ed812c551be3ee736a6728b65ceffd004 > "$RUNNER_TEMP/gov186-global-diff.log" 2>&1; then
            echo 'GOV186_GLOBAL_ACTUAL_DIFF=PASS'
          else
            echo 'GOV186_GLOBAL_ACTUAL_DIFF=FAIL'
            exit 1
          fi
          if python3 -B gov-src/governance/public-authority/tools/current_dependency_lint.py --root gov-src --git-base 64c8a874210f2fa89fee07c7283ffce2bbe6b36c --git-head c934984ed812c551be3ee736a6728b65ceffd004 > "$RUNNER_TEMP/gov186-dependency-diff.log" 2>&1; then
            echo 'GOV186_CURRENT_DEPENDENCY_ACTUAL_DIFF=PASS'
          else
            echo 'GOV186_CURRENT_DEPENDENCY_ACTUAL_DIFF=FAIL'
            exit 1
          fi
      - name: Verify GOV-DOC repository bootstrap and document structure
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          if python3 -B -m unittest discover -s gov-src/governance/agent -p test_repository_entry.py > "$RUNNER_TEMP/gov186-entry-fixtures.log" 2>&1; then
            grep -E '^Ran [0-9]+ tests|^OK$' "$RUNNER_TEMP/gov186-entry-fixtures.log" || true
            echo 'GOV186_ENTRY_NEGATIVE_FIXTURES=PASS'
          else
            echo 'GOV186_ENTRY_NEGATIVE_FIXTURES=FAIL'
            exit 1
          fi
          if python3 -B -m unittest discover -s gov-src/governance/catalog/tools -p test_doc_structure_lint.py > "$RUNNER_TEMP/gov186-doc-fixtures.log" 2>&1; then
            grep -E '^Ran [0-9]+ tests|^OK$' "$RUNNER_TEMP/gov186-doc-fixtures.log" || true
            echo 'GOV186_DOC_STRUCTURE_NEGATIVE_FIXTURES=PASS'
          else
            echo 'GOV186_DOC_STRUCTURE_NEGATIVE_FIXTURES=FAIL'
            exit 1
          fi
          if python3 -B gov-src/governance/catalog/tools/doc_structure_lint.py --root gov-src > "$RUNNER_TEMP/gov186-doc-structure.log" 2>&1; then
            echo 'GOV186_DOC_STRUCTURE=PASS'
          else
            echo 'GOV186_DOC_STRUCTURE=FAIL'
            exit 1
          fi
      - name: Clean temporary private source and test logs
        if: always()
        shell: bash
        run: |
          rm -rf gov-src
          rm -f "$RUNNER_TEMP"/gov186-*.log
