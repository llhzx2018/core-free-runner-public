name: P01 Production Version Probe 20260819
on:
  push:
    branches: [vf-agent-operations-v1]
    paths: ['.github/workflows/p01-production-version-probe-20260819.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      W: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Read public Production version only
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --max-time 30 https://start.kewaro.com/ -o /tmp/home.html
          python3 - <<'PY'
          import re
          s=open('/tmp/home.html',encoding='utf-8',errors='replace').read()
          m=re.search(r'VF Start\s*·\s*V([0-9]+(?:\.[0-9]+){2})',s)
          if not m: raise SystemExit('PRODUCTION_VERSION_NOT_EXPOSED')
          open('/tmp/version','w').write(m.group(1))
          print('PRODUCTION_VERSION='+m.group(1))
          PY
      - name: Publish sanitized evidence
        if: always()
        shell: bash
        env:
          S: ${{ job.status }}
          RID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os,json,base64,urllib.request,urllib.error
          try:v=open('/tmp/version').read().strip()
          except:v='UNKNOWN'
          q={'schema':'vf-public-runner-result/v1','project_id':'P01','gate':'PRODUCTION_VERSION_READONLY','status':os.environ['S'].upper(),'pass':os.environ['S']=='success','production_version':v,'production_write_executed':0,'workflow_run_id':os.environ['RID']};c=json.dumps(q,indent=2)+'\n';t=os.environ['W'];api='https://api.github.com/repos/llhzx2018/core-free-runner-public/contents/vf-agent/results/P01-PRODUCTION-VERSION-READONLY-20260819.json';h={'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json'};sha=None
          try:
            with urllib.request.urlopen(urllib.request.Request(api+'?ref=vf-agent-operations-v1',headers=h)) as x:sha=json.load(x).get('sha')
          except urllib.error.HTTPError as e:
            if e.code!=404:raise
          d={'message':'evidence(P01): publish readonly Production version','content':base64.b64encode(c.encode()).decode(),'branch':'vf-agent-operations-v1'}
          if sha:d['sha']=sha
          urllib.request.urlopen(urllib.request.Request(api,data=json.dumps(d).encode(),method='PUT',headers={**h,'Content-Type':'application/json'})).read()
          PY
