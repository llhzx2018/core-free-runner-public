name: P07 VPS Audit RC4 Gate

on:
  push:
    branches: [feature/p07-vps-audit-rc4-china-regions]
    paths:
      - 'experiments/p07-vps-audit-v20-rc4.sh'
      - '.github/workflows/p07-vps-audit-rc4-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: RC4 syntax and mainland surface
        shell: bash
        run: |
          set -euo pipefail
          f=experiments/p07-vps-audit-v20-rc4.sh
          bash -n "$f"
          NO_COLOR=1 bash "$f" --version | tee /tmp/ver
          NO_COLOR=1 bash "$f" --help | tee /tmp/help
          grep -q '2.0.0-rc4-zh' /tmp/ver
          grep -q '北京 / 上海 / 华南深圳 / 西南重庆' /tmp/help
          grep -q "probe_pool '北京'" "$f"
          grep -q "probe_pool '上海'" "$f"
          grep -q "probe_pool '华南 深圳'" "$f"
          grep -q "probe_pool '西南 重庆'" "$f"
          grep -q '清华 TUNA' "$f"
          grep -q '上海交大 SJTUG' "$f"
          grep -q '南科大 SUSTech' "$f"
          grep -q '重庆邮电 CQUPT' "$f"
          grep -q '大陆→VPS下载中位数' "$f"
          grep -q '大陆用户→VPS' "$f"
          ! grep -q "39.9042,116.4074" "$f"
          ! grep -q 'speedtest-go' "$f"
      - name: Frozen RC3 dependency integrity
        shell: bash
        run: |
          set -euo pipefail
          url='https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/e765c5547a4a92972428042c8594f9359346d3e6/experiments/p07-vps-audit-v20-rc3.sh'
          expected='53b30d3616d40f8e64780e97486e36227afb5c07b651923f9205f2906c860951'
          curl -fsSL "$url" -o /tmp/rc3.sh
          test "$(sha256sum /tmp/rc3.sh | awk '{print $1}')" = "$expected"
          test "$(NO_COLOR=1 bash /tmp/rc3.sh --version | awk '{print $NF}')" = '2.0.0-rc3-zh'
