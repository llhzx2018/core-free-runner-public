name: TEMP S01-C02 inspect-only failure source diagnostic
on:
  push:
    branches: [temp/s01-c03-v12519-runtime-authority-probe-20260905]
    paths: ['.github/workflows/temp-s01-c02-v121814-build-v2.yml']
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact Ops 1.21.814 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 3a89aca6ea87e0bfabeab2cc414388ad3188bd9a
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: ops
      - name: Locate async job implementation and failure fields
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== CLASS LOCATIONS ==='
          grep -R -n --include='*.php' 'class VF_Ops_Release_Async_Job' ops/includes || true
          echo '=== FAILURE FIELD LOCATIONS ==='
          grep -R -n -E --include='*.php' "(error_code|errorCode|last_error|lastError|failure_code|failureCode|inspection_complete|check_static_zip|run_next_stage)" ops/includes/publish-o10 ops/includes/site-release 2>/dev/null | head -n 220 || true
          echo '=== ASYNC FILES ==='
          find ops/includes -type f -name '*.php' | grep -Ei '(async|job|release.*worker|worker.*release)' | sort | head -n 80
