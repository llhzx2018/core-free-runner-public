name: TEMP S01-C02 v1.21.815 Formal Release
on:
  push:
    branches: [temp/s01-c03-v12519-runtime-authority-probe-20260905]
    paths: ['.github/workflows/temp-s01-c02-v121814-build-v2.yml']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPS_SHA: 75cee365f69db2684ab753de03cb34607d4eb25e
      ASSET_BYTES: '3228295'
      ASSET_SHA: 4f31b27a083d3c50b5b508898a767618af2217613a0a026604918a00426aced7
    steps:
      - name: Checkout exact Ops source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.OPS_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops
      - name: Verify promoted source and rebuild exact Candidate
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          main=$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/vf-tools-ops/branches/main | jq -r '.commit.sha')
          develop=$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/vf-tools-ops/branches/develop | jq -r '.commit.sha')
          test "$main" = "$OPS_SHA"
          test "$develop" = "$OPS_SHA"
          mkdir -p /tmp/release
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re,zipfile
          root=Path('ops'); runtime=[]
          for p in root.rglob('*'):
              if not p.is_file() or p.is_symlink(): continue
              rel=p.relative_to(root).as_posix(); parts=rel.split('/'); low=[x.lower() for x in parts]
              if any(x in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in low): continue
              if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',rel,re.I): continue
              if '/' not in rel:
                  if rel not in {'vf-ops.php','uninstall.php'}: continue
              elif parts[0] not in {'includes','assets','languages','config'}: continue
              runtime.append((rel,p.read_bytes()))
          runtime.sort(key=lambda x:x[0])
          z=Path('/tmp/release/vf-tools-ops_V1.21.815.zip')
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as out:
              for rel,b in runtime:
                  i=zipfile.ZipInfo('vf-ops/'+rel,(2026,9,5,0,0,0)); i.compress_type=zipfile.ZIP_DEFLATED; i.external_attr=0o100644<<16; out.writestr(i,b)
          print(z.stat().st_size, hashlib.sha256(z.read_bytes()).hexdigest(), len(runtime))
          PY
          test "$(stat -c '%s' /tmp/release/vf-tools-ops_V1.21.815.zip)" = "$ASSET_BYTES"
          test "$(sha256sum /tmp/release/vf-tools-ops_V1.21.815.zip | awk '{print $1}')" = "$ASSET_SHA"
          unzip -tq /tmp/release/vf-tools-ops_V1.21.815.zip >/dev/null
          echo EXACT_CANDIDATE_ARTIFACT=PASS
      - name: Create and read back Formal Release
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          ! gh release view v1.21.815 --repo llhzx2018/vf-tools-ops >/dev/null 2>&1
          gh release create v1.21.815 /tmp/release/vf-tools-ops_V1.21.815.zip --repo llhzx2018/vf-tools-ops --target "$OPS_SHA" --title 'VF Tools Ops v1.21.815' --notes 'S01-C02 Static Inspection Failure Readback V1. Corrects the 1.21.814 recovery-marker ordering so a terminal failed inspect-only job with a preserved source is reported as SOURCE_REINSPECTION_FAILED instead of CURRENT_SOURCE_AVAILABLE. Adds only safe aggregate readiness fields: failure count, warning count, unique sanitized failure codes, and first failed stage. It does not expose issue text, paths, URLs, filenames, SHA or job identity and does not alter inspection verdicts or bypass any FAIL. Existing recovered Simply Static source remains preserved; no repeat source upload is authorized by publication. No M3U8 migration/schema/DB write, Seed HOLD release, JD.gg/WPvivid mutation, content write, Production activation or DNS write.'
          j=$(gh api repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.815)
          test "$(jq -r '.target_commitish' <<<"$j")" = "$OPS_SHA"
          test "$(jq -r '.draft' <<<"$j")" = false
          test "$(jq -r '.prerelease' <<<"$j")" = false
          test "$(jq -r '.assets[]|select(.name==\"vf-tools-ops_V1.21.815.zip\")|.size' <<<"$j")" = "$ASSET_BYTES"
          test "$(jq -r '.assets[]|select(.name==\"vf-tools-ops_V1.21.815.zip\")|.digest' <<<"$j")" = "sha256:$ASSET_SHA"
          echo "RELEASE_ID=$(jq -r '.id' <<<"$j")"
          echo "ASSET_ID=$(jq -r '.assets[]|select(.name==\"vf-tools-ops_V1.21.815.zip\")|.id' <<<"$j")"
          echo "PUBLISHED_AT=$(jq -r '.published_at' <<<"$j")"
          echo PASS_V121815_FORMAL_RELEASE
