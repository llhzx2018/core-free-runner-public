name: TEMP S01-C02 v1.21.815 Formal Release Readback Correction
on:
  push:
    branches: [temp/s01-c03-v12519-runtime-authority-probe-20260905]
    paths: ['.github/workflows/temp-s01-c02-v121814-build-v2.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPS_SHA: 75cee365f69db2684ab753de03cb34607d4eb25e
      ASSET_BYTES: '3228295'
      ASSET_SHA: 4f31b27a083d3c50b5b508898a767618af2217613a0a026604918a00426aced7
    steps:
      - name: Verify existing Formal Release exactly
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          j=$(gh api repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.815)
          test "$(jq -r '.id' <<<"$j")" = '383154361'
          test "$(jq -r '.target_commitish' <<<"$j")" = "$OPS_SHA"
          test "$(jq -r '.draft' <<<"$j")" = false
          test "$(jq -r '.prerelease' <<<"$j")" = false
          test "$(jq -r --arg a 'vf-tools-ops_V1.21.815.zip' '.assets[]|select(.name==$a)|.id' <<<"$j")" = '545453183'
          test "$(jq -r --arg a 'vf-tools-ops_V1.21.815.zip' '.assets[]|select(.name==$a)|.size' <<<"$j")" = "$ASSET_BYTES"
          test "$(jq -r --arg a 'vf-tools-ops_V1.21.815.zip' '.assets[]|select(.name==$a)|.digest' <<<"$j")" = "sha256:$ASSET_SHA"
          echo PASS_V121815_FORMAL_RELEASE_REMOTE_READBACK
