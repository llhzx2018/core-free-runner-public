name: TEMP S01-C02 v1.21.814 Update Channel Gate
on:
  push:
    branches: [temp/s01-c03-v12519-runtime-authority-probe-20260905]
    paths: ['.github/workflows/temp-s01-c02-v121814-build-v2.yml']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: 25de04079a570178055fc31108e6c51559e9c8c5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: updates
      - name: Checkout gate script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: temp/s01-c03-v12519-runtime-authority-probe-20260905
          persist-credentials: false
          path: runner
      - name: Fresh-read core-updates main
        working-directory: updates
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          live=$(curl -fsSL -H "Authorization: Bearer ${R}" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/llhzx2018/core-updates/branches/main' | jq -r '.commit.sha')
          test "$live" = '9a4939f5432347051b112201bce0755d760c1869'
          echo CORE_UPDATES_MAIN_BASE=PASS
      - name: Run exact Update Channel Gate
        working-directory: updates
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: bash ../runner/.github/scripts/temp-s01-c02-v121814-update-channel-gate.sh
