name: TEMP S01-C02 v1.21.815 Update Channel Gate
on:
  push:
    branches: [temp/s01-c03-v12519-runtime-authority-probe-20260905]
    paths: ['.github/workflows/temp-s01-c02-v121814-build-v2.yml']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CORE_BASE: 25de04079a570178055fc31108e6c51559e9c8c5
      CORE_CANDIDATE: 53523fc470b403bf57c5755a7d2f88bee26f4982
      OPS_SHA: 75cee365f69db2684ab753de03cb34607d4eb25e
      ASSET_SHA: 4f31b27a083d3c50b5b508898a767618af2217613a0a026604918a00426aced7
    steps:
      - name: Checkout exact update candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CORE_CANDIDATE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: updates
      - name: Gate update channel
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          live=$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/core-updates/branches/main | jq -r '.commit.sha')
          test "$live" = "$CORE_BASE"
          test "$(git -C updates diff --name-only "$CORE_BASE" "$CORE_CANDIDATE")" = 'projects/S01-C02.json'
          jq -e '.target_version=="1.21.815" and .from_versions==["1.21.814"] and .release_tag=="v1.21.815" and .asset_name=="vf-tools-ops_V1.21.815.zip" and .asset_bytes==3228295 and .asset_sha256=="4f31b27a083d3c50b5b508898a767618af2217613a0a026604918a00426aced7" and .schema_from=="6.0.0" and .schema_to=="6.0.0" and .runtime_files==902 and .runtime_fingerprint=="cebecbdbf1b84bcc9e8f3ba6e62fd3ddfb5bd0e3901c083a79aea2aaf713102b"' updates/projects/S01-C02.json >/dev/null
          echo UPDATE_SCOPE_AND_MANIFEST=PASS
          main=$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/vf-tools-ops/branches/main | jq -r '.commit.sha')
          develop=$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/vf-tools-ops/branches/develop | jq -r '.commit.sha')
          test "$main" = "$OPS_SHA"; test "$develop" = "$OPS_SHA"
          rel=$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.815)
          test "$(jq -r '.id' <<<"$rel")" = '383154361'
          test "$(jq -r '.target_commitish' <<<"$rel")" = "$OPS_SHA"
          test "$(jq -r --arg a 'vf-tools-ops_V1.21.815.zip' '.assets[]|select(.name==$a)|.id' <<<"$rel")" = '545453183'
          test "$(jq -r --arg a 'vf-tools-ops_V1.21.815.zip' '.assets[]|select(.name==$a)|.size' <<<"$rel")" = '3228295'
          test "$(jq -r --arg a 'vf-tools-ops_V1.21.815.zip' '.assets[]|select(.name==$a)|.digest' <<<"$rel")" = "sha256:$ASSET_SHA"
          echo FORMAL_RELEASE_AND_SOURCE=PASS
          prod=$(curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-domain-authority')
          echo "$prod" | jq -e '.pluginVersion=="1.21.814" and .status=="CURRENT" and .authorityFinalHost=="https://ilovem3u8.com"' >/dev/null
          echo DIRECT_PRODUCTION_1_21_814_ONLY=PASS
          echo PASS_V121815_UPDATE_CHANNEL_GATE
