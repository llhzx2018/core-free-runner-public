name: P04 V2.8.3 Formal Release

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p04-v283-formal-release.yml'
      - 'requests/p04-v283-formal-release.txt'

permissions:
  contents: read

env:
  SOURCE_SHA: '6180307a393783b3ee61dd2f5a65c6516a0d406d'
  FULL_BYTES: '571219'
  FULL_SHA: '432f12a18065841b177789689dcda704d116709a6b8e5ff8704d41142715ca5c'
  UPDATE_BYTES: '1235174'
  UPDATE_SHA: '97719634af66dd938a3a31dd42dfbe08a2c460d54c8b8fe16d90208c9dd42dbc'

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, fileinfo, sodium, zip, curl, mbstring
      - name: Publish exact V2.8.3
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' < VERSION)" = '2.8.3'
          test "$(gh api repos/llhzx2018/vf-infra/branches/main --jq .commit.sha)" = "$SOURCE_SHA"
          ! gh release view v2.8.3 -R llhzx2018/vf-infra >/dev/null 2>&1
          ! gh api repos/llhzx2018/vf-infra/git/ref/tags/v2.8.3 >/dev/null 2>&1
          R="$RUNNER_TEMP/runtime"; O="$RUNNER_TEMP/update"
          python3 scripts/build-release-tree.py "$R"
          python3 - "$R" "$RUNNER_TEMP/VF_Infra_V2.8.3_FULL.zip" <<'PY'
          import pathlib,sys,zipfile
          root=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9,strict_timestamps=True) as z:
            for p in sorted(x for x in root.rglob('*') if x.is_file()):
              i=zipfile.ZipInfo(p.relative_to(root).as_posix(),date_time=(1980,1,1,0,0,0)); i.compress_type=zipfile.ZIP_DEFLATED; i.create_system=3; i.external_attr=(0o100644<<16); z.writestr(i,p.read_bytes())
          PY
          python3 scripts/build-v283-update-release.py --target-runtime "$R" --output "$O"
          cp "$O/VF_Infra_V2.8.3_UPDATE.zip" "$RUNNER_TEMP/VF_Infra_V2.8.3_UPDATE.zip"
          test "$(stat -c %s "$RUNNER_TEMP/VF_Infra_V2.8.3_FULL.zip")" = "$FULL_BYTES"
          test "$(sha256sum "$RUNNER_TEMP/VF_Infra_V2.8.3_FULL.zip"|awk '{print $1}')" = "$FULL_SHA"
          test "$(stat -c %s "$RUNNER_TEMP/VF_Infra_V2.8.3_UPDATE.zip")" = "$UPDATE_BYTES"
          test "$(sha256sum "$RUNNER_TEMP/VF_Infra_V2.8.3_UPDATE.zip"|awk '{print $1}')" = "$UPDATE_SHA"
          php "$O/repair-v2.8.3.php" --self-test | grep -F 'ATOMIC_SELF_TEST_PASS target=2.8.3 schema=14'
          gh release create v2.8.3 "$RUNNER_TEMP/VF_Infra_V2.8.3_FULL.zip#VF Infra V2.8.3 FULL" "$RUNNER_TEMP/VF_Infra_V2.8.3_UPDATE.zip#VF Infra V2.8.3 UPDATE" -R llhzx2018/vf-infra --target "$SOURCE_SHA" --title 'VF Infra V2.8.3' --notes-file docs/operations/package/RELEASE_NOTES.md
          mkdir -p "$RUNNER_TEMP/readback" evidence
          gh release download v2.8.3 -R llhzx2018/vf-infra --dir "$RUNNER_TEMP/readback" --pattern 'VF_Infra_V2.8.3_*.zip'
          gh api repos/llhzx2018/vf-infra/releases/tags/v2.8.3 > evidence/release.json
          gh api repos/llhzx2018/vf-infra/git/ref/tags/v2.8.3 > evidence/tag.json
          test "$(jq -r .object.sha evidence/tag.json)" = "$SOURCE_SHA"
          test "$(sha256sum "$RUNNER_TEMP/readback/VF_Infra_V2.8.3_FULL.zip"|awk '{print $1}')" = "$FULL_SHA"
          test "$(sha256sum "$RUNNER_TEMP/readback/VF_Infra_V2.8.3_UPDATE.zip"|awk '{print $1}')" = "$UPDATE_SHA"
          echo 'P04_V283_FORMAL_RELEASE=PASS'
          echo "RELEASE_ID=$(jq -r .id evidence/release.json)"
          jq -r '.assets[]|"ASSET_ID="+(.id|tostring)+" NAME="+.name+" BYTES="+(.size|tostring)' evidence/release.json
          echo "TAG_SOURCE=$SOURCE_SHA"
          echo "FULL_SHA256=$FULL_SHA"
          echo "UPDATE_SHA256=$UPDATE_SHA"
          echo 'PRODUCTION_WRITE=0'
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P04-V2.8.3-FORMAL-RELEASE-EVIDENCE
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
