name: P01 owner old-site complete asset export fail-closed proof
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  owner-media-extras-gate:
    if: github.head_ref == 'test/p01-owner-complete-asset-export-fence-20261120' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Scope exact product revision and synthetic-only evidence
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = llhzx2018/core-free-runner-public
          echo P01_REAL_OWNER_FILES_INCLUDED=NO
          echo P01_OLD_PRODUCTION_READ_OR_WRITE=NONE
      - name: Checkout exact private P01 candidate transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: e0904c0e6e96e57693a944a1e4b873f99e0d2068
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: candidate
      - name: Checkout shared architecture and naming rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov-doc
      - name: Exact source and actual Git diff architecture + negative contract
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = e0904c0e6e96e57693a944a1e4b873f99e0d2068
          test "$(cat candidate/VERSION)" = 2.47.517
          test "$(cat candidate/src/VERSION.txt)" = 2.47.517
          python3 -B candidate/.github/checks/test_architecture_gate.py
          python3 -B candidate/.github/checks/architecture_gate.py \
            --manifest candidate/.github/checks/code_architecture.json \
            --gov-root gov-doc \
            --base-sha ab49e83c4715cc9246c4333679fc5388e554cc98 \
            --head-sha e0904c0e6e96e57693a944a1e4b873f99e0d2068 \
            --git-root candidate > "$RUNNER_TEMP/p01-archive-architecture.log" 2>&1
          grep -F 'PROJECT_ARCHITECTURE=STRUCTURAL_PASS' "$RUNNER_TEMP/p01-archive-architecture.log"
          python3 -m py_compile candidate/scripts/build_p01_legacy_owner_media_archive.py candidate/tests/architecture/test_p01_owner_media_export.py
          echo P01_V517_FINAL_LEGACY_ASSET_EXPORT_ARCH_AND_SYNTAX=PASS
      - name: Native real PHP SQLite and ZipArchive
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php8.3-cli php8.3-sqlite3 php8.3-zip >/dev/null
          php -r 'if(!extension_loaded("pdo_sqlite")||!class_exists("ZipArchive"))exit(2);'
          php -l candidate/src/app/next/runtime/OwnerLegacyMediaArchive.php
          echo P01_OWNER_EXPORT_AND_IMPORT_REAL_NATIVE_DRIVERS=PASS
      - name: Complete media roundtrip plus full-loss prevention negatives
        run: |
          set -Eeuo pipefail
          cd candidate
          PYTHONDONTWRITEBYTECODE=1 python3 -B tests/architecture/test_p01_owner_media_export.py
          echo P01_OWNER_EXPORTED_MEDIA_FULL_ROUNDTRIP_SYNTHETIC=PASS
          echo P01_OLD_BRANDING_AND_USER_ICON_OMISSION_FAIL_CLOSED=PASS
      - name: Always clean transient private checkout and evidence logs
        if: always()
        run: |
          rm -rf -- candidate gov-doc
          rm -f -- "$RUNNER_TEMP/p01-archive-architecture.log"
          echo P01_PRIVATE_SOURCE_OR_REAL_OWNER_BYTES_PERSISTED=NO
          echo P01_PUBLIC_TEST_ARTIFACTS=NONE
