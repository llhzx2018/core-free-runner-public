name: S01 Error Recovery UX Bump Gate
on:
  push:
    branches: [temp/s01-error-recovery-ux-code-gate-20260907]
    paths: [.github/workflows/temp-s01-error-recovery-ux-bump-gate-20260907.yml]
permissions:
  contents: read
jobs:
  ops:
    runs-on: ubuntu-24.04
    env:
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      REPO: llhzx2018/vf-tools-ops
      BRANCH: work/s01-c02-error-recovery-ux-20260907
      EXPECTED_HEAD: eff8d81f69f4517240edfc19ddd03b8693145e81
      EXPECTED_MAIN: 3e873a80ff6d3defdc31a3d7b4f9574e8b84cfcb
    steps:
      - name: Prepare Ops 1.21.858 identity and candidate gate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WRITE_TOKEN"
          echo 'MAIN_WRITE_USED=NO RELEASE_USED=NO DISTRIBUTION_USED=NO PRODUCTION_WRITE_USED=NO MIGRATION_USED=NO'
          git clone -q "https://x-access-token:${WRITE_TOKEN}@github.com/${REPO}.git" repo
          cd repo
          git checkout -q "$BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          old='1.21.857'; new='1.21.858'
          old_round='S01-PAGES-TOOLS-HUMAN-CLOSURE'; new_round='S01-ERROR-RECOVERY-UX-CLOSURE'
          files=subprocess.check_output([
              'git','grep','-l','-E',r'1\.21\.857|S01-PAGES-TOOLS-HUMAN-CLOSURE','--','VERSION','vf-ops.php','includes','tests'
          ]).decode().splitlines()
          allowed_direct={
              'VERSION','vf-ops.php','includes/admin-runtime-support.php',
              'includes/admin-v13/views/dashboard.php','includes/admin-v13/views/system_components.php',
              'includes/views/admin-operations-console-pages.php','includes/wp-update/class-vf-ops-update-admin-v1.php'
          }
          unexpected=[p for p in files if p not in allowed_direct and not p.startswith('tests/')]
          if unexpected:
              print('UNEXPECTED_IDENTITY_FILES', unexpected); raise SystemExit('FAIL_OPS_IDENTITY_FILE_FENCE')
          print('OPS_IDENTITY_FILES', *files, sep='\n')
          for name in files:
              p=Path(name); s=p.read_text(); before=s
              s=s.replace(old,new).replace(old_round,new_round)
              if s == before:
                  raise SystemExit(f'NO_EXPECTED_CHANGE:{name}')
              p.write_text(s)
          PY
          test "$(cat VERSION)" = '1.21.858'
          grep -Fq 'Version: 1.21.858' vf-ops.php
          grep -Fq "VF_OPS_VERSION', '1.21.858'" vf-ops.php
          grep -Fq "VF_OPS_ROUND', 'S01-ERROR-RECOVERY-UX-CLOSURE'" vf-ops.php
          if git grep -n -E '1\.21\.857|S01-PAGES-TOOLS-HUMAN-CLOSURE' -- VERSION vf-ops.php includes tests; then
            echo 'FAIL_OPS_STALE_RELEASE_IDENTITY'; exit 1
          fi
          find includes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php tests/error-recovery-human-language-contract.php
          php tests/admin-human-language-contract.php
          php tests/dashboard-selector-hit-contract.php
          php tests/pages-tools-human-closure-contract.php
          php tests/system-components-human-language-contract.php
          php tests/update-compat-human-language-contract.php
          php tests/update-refresh-policy-current-contract.php
          php tests/visible-console-v2-contract.php
          python3 - <<'PY'
          import subprocess
          actual=set(subprocess.check_output(['git','diff','--name-only','origin/main']).decode().splitlines())
          allowed_direct={
              'VERSION','vf-ops.php','includes/admin-runtime-support.php',
              'includes/admin-v13/views/dashboard.php','includes/admin-v13/views/system_components.php',
              'includes/views/admin-operations-console-pages.php','includes/wp-update/class-vf-ops-update-admin-v1.php',
          }
          bad=[p for p in actual if p not in allowed_direct and not p.startswith('tests/')]
          if bad:
              print('ACTUAL',sorted(actual)); print('BAD',bad); raise SystemExit('FAIL_OPS_CANDIDATE_FILE_FENCE')
          if 'includes/admin-runtime-support.php' not in actual or 'tests/error-recovery-human-language-contract.php' not in actual:
              raise SystemExit('FAIL_OPS_UX_FIX_MISSING')
          print('OPS_CANDIDATE_FILES', *sorted(actual), sep='\n')
          PY
          git diff --exit-code origin/main -- includes/v6
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add -A
          git commit -m 'release(S01-C02): prepare 1.21.858 error recovery UX'
          git push -q origin HEAD:"$BRANCH"
          echo "OPS_121858_HEAD=$(git rev-parse HEAD)"
          echo 'PASS_S01_C02_121858_BUMP_GATE'

  m3u8:
    runs-on: ubuntu-24.04
    env:
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      REPO: llhzx2018/vf-tools-m3u8
      BRANCH: work/s01-c03-error-recovery-ux-20260907
      EXPECTED_HEAD: 609a7283574050faeba4cd1fb219531b4c6b4f2e
      EXPECTED_MAIN: 3a50a8557fbdb634f56ab6fd14a3d9072bd927c5
    steps:
      - name: Prepare M3U8 1.25.29 identity and candidate gate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WRITE_TOKEN"
          echo 'MAIN_WRITE_USED=NO RELEASE_USED=NO DISTRIBUTION_USED=NO PRODUCTION_WRITE_USED=NO MIGRATION_USED=NO'
          git clone -q "https://x-access-token:${WRITE_TOKEN}@github.com/${REPO}.git" repo
          cd repo
          git checkout -q "$BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          old='1.25.28'; new='1.25.29'
          old_round='R252'; new_round='R253'
          old_marker='R252_S01_FINAL_ADMIN_HUMAN_CLOSURE'; new_marker='R253_S01_ERROR_RECOVERY_UX_CLOSURE'
          files=subprocess.check_output([
              'git','grep','-l','-E',r'1\.25\.28|R252','--','VERSION','src/vf-tool-m3u8.php','tests'
          ]).decode().splitlines()
          unexpected=[p for p in files if p not in {'VERSION','src/vf-tool-m3u8.php'} and not p.startswith('tests/')]
          if unexpected:
              print('UNEXPECTED_IDENTITY_FILES', unexpected); raise SystemExit('FAIL_M3U8_IDENTITY_FILE_FENCE')
          print('M3U8_IDENTITY_FILES', *files, sep='\n')
          for name in files:
              p=Path(name); s=p.read_text(); before=s
              s=s.replace(old_marker,new_marker).replace(old,new).replace(old_round,new_round)
              if s == before:
                  raise SystemExit(f'NO_EXPECTED_CHANGE:{name}')
              p.write_text(s)
          PY
          test "$(cat VERSION)" = '1.25.29'
          grep -Fq 'Version: 1.25.29' src/vf-tool-m3u8.php
          grep -Fq "VF_TOOL_M3U8_VERSION', '1.25.29'" src/vf-tool-m3u8.php
          grep -Fq "VF_TOOL_M3U8_ROUND', 'R253'" src/vf-tool-m3u8.php
          grep -Fq 'R253_S01_ERROR_RECOVERY_UX_CLOSURE' src/vf-tool-m3u8.php
          if git grep -n -E '1\.25\.28|R252' -- VERSION src/vf-tool-m3u8.php tests; then
            echo 'FAIL_M3U8_STALE_RELEASE_IDENTITY'; exit 1
          fi
          find src tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php tests/unit/error-recovery-final-owner-contract.php
          php tests/unit/admin-human-language-contract.php
          php tests/unit/dashboard-human-language-contract.php
          php tests/unit/host-recovery-human-language-contract.php
          php tests/unit/recovery-runtime-human-language-followup-contract.php
          php tests/unit/settings-human-language-followup-contract.php
          php tests/unit/package-physical-locator-contract.php
          php tests/unit/update-refresh-policy-contract.php
          php tests/unit/visible-console-v2-contract.php
          php tests/unit/bootstrap-upgrade-contract.php
          php tests/frontend-s01-uiux-final-owner-contract.php
          python3 - <<'PY'
          import subprocess
          actual=set(subprocess.check_output(['git','diff','--name-only','origin/main']).decode().splitlines())
          allowed={'VERSION','src/vf-tool-m3u8.php','src/admin/admin-loader.php','src/admin/admin-console.php'}
          bad=[p for p in actual if p not in allowed and not p.startswith('tests/')]
          if bad:
              print('ACTUAL',sorted(actual)); print('BAD',bad); raise SystemExit('FAIL_M3U8_CANDIDATE_FILE_FENCE')
          for required in ['src/admin/admin-loader.php','src/admin/admin-console.php','tests/unit/error-recovery-final-owner-contract.php']:
              if required not in actual: raise SystemExit('FAIL_M3U8_UX_FIX_MISSING:'+required)
          print('M3U8_CANDIDATE_FILES', *sorted(actual), sep='\n')
          PY
          git diff --exit-code origin/main -- src/includes/v6-provider-schema.php src/includes/v6-provider-post-migration-readonly.php src/includes/v6-provider-controlled-migration-admin.php src/includes/update
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add -A
          git commit -m 'release(S01-C03): prepare 1.25.29 error recovery UX'
          git push -q origin HEAD:"$BRANCH"
          echo "M3U8_12529_HEAD=$(git rev-parse HEAD)"
          echo 'PASS_S01_C03_12529_BUMP_GATE'
