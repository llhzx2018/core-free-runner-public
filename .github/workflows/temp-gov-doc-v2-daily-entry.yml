name: TEMP gov-doc V2 Daily Entry Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact gov-doc candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/gov-doc
          ref: 590e56e505c989646fc930110c8850cf5974310b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: gov-doc
          persist-credentials: false

      - name: Verify exact identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C gov-doc rev-parse HEAD)" = "590e56e505c989646fc930110c8850cf5974310b"

      - name: Authority drift marker scan
        shell: bash
        run: |
          set -euo pipefail
          python gov-doc/governance/authority/tools/authority_drift_lint.py gov-doc --json > /tmp/authority.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/authority.json', encoding='utf-8'))
          assert p['scanned_files'] > 0
          print('AUTHORITY_SCAN_RESULT=', p['result'])
          print('AUTHORITY_REVIEW_REQUIRED=', p['review_required'])
          PY

      - name: Verify Current daily pointer
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'VF_Agent_Runtime_日常极简指南_V1.4.md' gov-doc/CURRENT.md
          grep -Fq 'DAILY GUIDE V1.4 = CURRENT DAILY HUMAN ENTRY' gov-doc/CURRENT.md
          grep -Fq 'Historical Pilot Observability V1.0' gov-doc/CURRENT.md
          grep -Fq 'Durable Runtime Bootstrap V1.2' gov-doc/CURRENT.md

      - name: Verify Active and Retired lifecycle
        shell: bash
        run: |
          set -euo pipefail
          for p in 'P01 · VF Start' 'P02 · VF Library' 'P04 · VF Infra' 'P05 · VF SEO'; do
            grep -Fq "$p" gov-doc/CURRENT.md
          done
          grep -Fq 'P03 · VF Forge = RETIRED / HISTORICAL / DO NOT ROUTE NEW WORK' gov-doc/CURRENT.md
          grep -Fq 'P06 · VF Press = RETIRED / HISTORICAL / DO NOT ROUTE NEW WORK' gov-doc/CURRENT.md

      - name: Verify V1.4 semantics
        shell: bash
        run: |
          set -euo pipefail
          f='gov-doc/governance/agent/VF_Agent_Runtime_日常极简指南_V1.4.md'
          grep -Fq 'CURRENT / DEVELOPMENT SYSTEM V2 DAILY ENTRY' "$f"
          grep -Fq 'P01，修这个 BUG。' "$f"
          grep -Fq 'P02，调整这里的 UI。' "$f"
          grep -Fq 'P04，继续这个明确功能。' "$f"
          grep -Fq 'P05，修健康检查问题。' "$f"
          grep -Fq '当前 `P03 / P06` 为 Retired' "$f"
          grep -Fq 'Durable Runtime = OFF' "$f"
          grep -Fq 'Current Project != Master Mission' "$f"
          ! grep -Fq 'P06，继续后台开发。' "$f"
          ! grep -Fq 'P03，这个正式文件中心有个 BUG。' "$f"

      - name: Verify scope boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f gov-doc/CURRENT.md
          test -f 'gov-doc/governance/agent/VF_Agent_Runtime_日常极简指南_V1.4.md'
          echo 'PRODUCT_CODE_WRITES=0'
          echo 'RELEASE_TAG_DISTRIBUTION_PRODUCTION=0'
