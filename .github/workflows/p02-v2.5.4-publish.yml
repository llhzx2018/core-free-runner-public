name: P02 V2.5.4 Formal Release Publication

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v2.5.4-publish.yml'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REPOSITORY: llhzx2018/vf-library
      PRODUCT_REF: 9d5d8e60245def8b7c5f80ab7961d614621dd7e0
      TAG: v2.5.4
      UPDATE_NAME: VF_Library_V2.5.4_UPDATE.zip
      UPDATE_BYTES: '315662'
      UPDATE_SHA256: 9dfc03dc9b34ac8a7b27ee437d066ed0198ba8bc21e0f15e38a753fcadea6d6b
      FULL_NAME: VF_Library_V2.5.4_FULL.zip
      FULL_BYTES: '323979'
      FULL_SHA256: dcb7d8fa395cfa46f644cea25d00f64931e1c36e83f559b530ea834d012c2015
      ATOMIC_NAME: VF_Library_V2.5.4_ATOMIC.zip
      ATOMIC_BYTES: '457911'
      ATOMIC_SHA256: 0b3b29af89f87be1c11b9316a9ded68fd85da636b95e4e82f09682b22e8149de
      SOURCE_NAME: VF_Library_V2.5.4_SOURCE.zip
      SOURCE_BYTES: '423053'
      SOURCE_SHA256: e4bf60efe5f8181c15ca4873e84492fc0aa15207d93ccaa5e3ab810e2a43a367
      REPAIR_NAME: repair-v2.5.4.php
      REPAIR_BYTES: '609143'
      REPAIR_SHA256: 7c5999e74a150888bacf4349e289a02ced08b58e4a27f0ae8327cff88cac85e5
      NOTES_NAME: VF_Library_V2.5.4_RELEASE_NOTES.md
      NOTES_BYTES: '1262'
      NOTES_SHA256: d3270419315847b3bd1cd95374df404e6f3e32fdb63cc2f9379848909adeed10
      MANIFEST_NAME: VF_Library_V2.5.4_RELEASE_MANIFEST.json
      MANIFEST_BYTES: '2734'
      MANIFEST_SHA256: f5617abdfaf15267f3e5c49c8c94d3ff44bcc75addcf131bca06277a3d29b036
      SUMS_NAME: SHA256SUMS.txt
      SUMS_BYTES: '669'
      SUMS_SHA256: d0c32a37a72517d5fa27e275734abe44afb6076e1860dd8cf7ae0cb2e5bccd2f
    steps:
      - name: Require registered release capabilities
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN" || { echo VF_PRIVATE_READ_TOKEN_MISSING; exit 78; }
          test -n "$WRITE_TOKEN" || { echo VF_RELEASE_WRITE_TOKEN_MISSING; exit 79; }
          echo REGISTERED_RELEASE_CAPABILITIES=PASS

      - name: Checkout exact formal product source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.PRODUCT_REPOSITORY }}
          ref: ${{ env.PRODUCT_REF }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: product

      - name: Rebuild and verify exact deterministic release set
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_REF"
          test "$(tr -d '\r\n' < VERSION)" = '2.5.4'
          TREE=$(git show -s --format=%T "$PRODUCT_REF")
          python3 scripts/build-release-v2.5.4.py --out build/release --source-commit "$PRODUCT_REF" --source-tree "$TREE" --source-ref release/v2.5.4 >/dev/null
          python3 - <<'PY'
          import hashlib,os
          from pathlib import Path
          root=Path('build/release')
          pairs=[
            ('UPDATE_NAME','UPDATE_BYTES','UPDATE_SHA256'),('FULL_NAME','FULL_BYTES','FULL_SHA256'),
            ('ATOMIC_NAME','ATOMIC_BYTES','ATOMIC_SHA256'),('SOURCE_NAME','SOURCE_BYTES','SOURCE_SHA256'),
            ('REPAIR_NAME','REPAIR_BYTES','REPAIR_SHA256'),('NOTES_NAME','NOTES_BYTES','NOTES_SHA256'),
            ('MANIFEST_NAME','MANIFEST_BYTES','MANIFEST_SHA256'),('SUMS_NAME','SUMS_BYTES','SUMS_SHA256')]
          for nk,bk,hk in pairs:
            p=root/os.environ[nk]; data=p.read_bytes()
            assert len(data)==int(os.environ[bk]),(p,len(data),os.environ[bk])
            assert hashlib.sha256(data).hexdigest()==os.environ[hk],p
          print('FORMAL_RELEASE_SET_IDENTITY=PASS')
          PY

      - name: Publish or verify exact private GitHub Release
        working-directory: product
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          if gh release view "$TAG" --repo "$PRODUCT_REPOSITORY" >/dev/null 2>&1; then
            echo RELEASE_ALREADY_EXISTS=YES
          else
            gh release create "$TAG" build/release/* \
              --repo "$PRODUCT_REPOSITORY" \
              --target "$PRODUCT_REF" \
              --title 'VF Library V2.5.4' \
              --notes-file "build/release/$NOTES_NAME"
            echo RELEASE_CREATED=YES
          fi
          gh release view "$TAG" --repo "$PRODUCT_REPOSITORY" --json databaseId,tagName,publishedAt,targetCommitish,isDraft,isPrerelease,assets > "$RUNNER_TEMP/release.json"
          python3 - "$RUNNER_TEMP/release.json" <<'PY'
          import json,os,sys
          x=json.load(open(sys.argv[1]))
          assert x['tagName']==os.environ['TAG'] and not x['isDraft'] and not x['isPrerelease']
          expected={
            os.environ['UPDATE_NAME']:int(os.environ['UPDATE_BYTES']),os.environ['FULL_NAME']:int(os.environ['FULL_BYTES']),
            os.environ['ATOMIC_NAME']:int(os.environ['ATOMIC_BYTES']),os.environ['SOURCE_NAME']:int(os.environ['SOURCE_BYTES']),
            os.environ['REPAIR_NAME']:int(os.environ['REPAIR_BYTES']),os.environ['NOTES_NAME']:int(os.environ['NOTES_BYTES']),
            os.environ['MANIFEST_NAME']:int(os.environ['MANIFEST_BYTES']),os.environ['SUMS_NAME']:int(os.environ['SUMS_BYTES'])}
          assets={a['name']:int(a['size']) for a in x.get('assets',[])}
          for name,size in expected.items(): assert assets.get(name)==size,(name,assets.get(name),size)
          print('RELEASE_ID='+str(x['databaseId']))
          print('PUBLISHED_AT='+str(x['publishedAt']))
          print('REMOTE_RELEASE_METADATA=PASS')
          PY

      - name: Remote update asset bytes and SHA readback
        working-directory: product
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/readback"
          gh release download "$TAG" --repo "$PRODUCT_REPOSITORY" --pattern "$UPDATE_NAME" --dir "$RUNNER_TEMP/readback"
          test "$(stat -c %s "$RUNNER_TEMP/readback/$UPDATE_NAME")" = "$UPDATE_BYTES"
          test "$(sha256sum "$RUNNER_TEMP/readback/$UPDATE_NAME" | awk '{print $1}')" = "$UPDATE_SHA256"
          echo REMOTE_UPDATE_BYTES_SHA256=PASS

      - name: Public-safe publication summary
        if: always()
        run: |
          echo P02=VF_LIBRARY
          echo TARGET=2.5.4
          echo FORMAL_SOURCE=$PRODUCT_REF
          echo UPDATE_BYTES=$UPDATE_BYTES
          echo UPDATE_SHA256=$UPDATE_SHA256
          echo PRODUCTION_WRITE=NO
          echo PRIVATE_SOURCE_PERSISTED=NO
