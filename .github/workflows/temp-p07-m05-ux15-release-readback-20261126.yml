name: TEMP P07-M05 UX15 exact official remote asset readback
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temp-p07-m05-ux15-release-readback-20261126.yml
permissions:
  contents: read
jobs:
  ux15-remote-readback:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.actor == 'llhzx2018' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'temp/p07-m05-ux15-release-readback-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      P07_SHA: '51520a4422c87888f79e349b79914ca1f64826ef'
      TARGET_TREE: '13358d477833462d662a04d5ea0915955191f2b4'
      PUBLIC_MAIN_SHA: 'f85c0f45f33632efee48b982087091346b7736f5'
      TAG: 'p07-m05-v0.1.0-ux15-rc4-runtime-compat-20261126'
      ASSET: 'P07-M05-0.1.0-m05-ux15-rc4-runtime-compat.zip'
      RECEIPT: 'P07-M05-UX15-FORMAL-RELEASE.json'
      ZIP_SHA: 'fa67235dbc9fc7d132b057da7095d5064d1b72f7308a781aa7d616e942d27d99'
    steps:
      - name: Read-only verify both official GitHub tag and release identities
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          test -n "$GH_TOKEN" || { echo P07_M05_PRIVATE_READ_CAPABILITY_MISSING; exit 78; }
          test "$(gh api repos/llhzx2018/vf-server-ops/git/ref/tags/"$TAG" --jq '.object.sha')" = "$P07_SHA"
          test "$(gh api repos/llhzx2018/core-free-runner-public/git/ref/tags/"$TAG" --jq '.object.sha')" = "$PUBLIC_MAIN_SHA"
          gh api repos/llhzx2018/vf-server-ops/releases/tags/"$TAG" --jq '.tag_name' | grep -Fx "$TAG" >/dev/null
          gh api repos/llhzx2018/core-free-runner-public/releases/tags/"$TAG" --jq '.tag_name' | grep -Fx "$TAG" >/dev/null
          echo P07_M05_UX15_BOTH_OFFICIAL_TAGS_RELEASES=PASS
      - name: Independently fetch anonymous published UX15 ZIP and exact release receipt
        shell: bash
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: |
          set -Eeuo pipefail
          set +x
          root="$RUNNER_TEMP/p07-ux15-official"
          mkdir -m 0700 "$root"
          base="https://github.com/llhzx2018/core-free-runner-public/releases/download/$TAG"
          unset GH_TOKEN GITHUB_TOKEN GH_ENTERPRISE_TOKEN
          curl -q --proto '=https' --tlsv1.2 -fsSL --max-time 60 "https://api.github.com/repos/llhzx2018/core-free-runner-public/releases/tags/$TAG" -o "$root/release-metadata.json"
          python3 -B - "$root/release-metadata.json" <<'PY'
          import json,os,sys
          r=json.load(open(sys.argv[1]))
          assert r["id"]==458868762 and r["draft"] is False and r["tag_name"]==os.environ["TAG"]
          expected={os.environ["ASSET"]:(793988269,584701,os.environ["ZIP_SHA"]),os.environ["RECEIPT"]:(793988270,1733,"b07f68cd71bedc3baf4fa1ac68f23088b43a031cb2aed3c8fc8160b465dde39f"),"SHA256SUMS":(793988266,211,"8aa0b7af7ec4917d549094462500f0aa2de1f422699db7cf29b30c0d47999942")}
          assert len(r["assets"])==len(expected)
          for a in r["assets"]:
              i,n,h=expected[a["name"]]
              assert (a["id"],a["size"],a["digest"],a["state"])==(i,n,"sha256:"+h,"uploaded")
          print("P07_M05_UX15_ANONYMOUS_ASSET_METADATA=PASS")
          PY
          rm "$root/release-metadata.json"
          for f in "$ASSET" "$RECEIPT" SHA256SUMS; do
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 2 --max-time 100 \
              "$base/$f" -o "$root/$f"
            test -s "$root/$f"
          done
          printf '%s  %s\n' "$ZIP_SHA" "$root/$ASSET" | sha256sum -c - >/dev/null
          (cd "$root" && sha256sum --strict -c SHA256SUMS)
          export ROOT="$root"
          python3 -B - <<'PY'
          import hashlib,json,os,pathlib,zipfile
          root=pathlib.Path(os.environ["ROOT"])
          names={os.environ["ASSET"],os.environ["RECEIPT"],"SHA256SUMS"}
          assert {p.name for p in root.iterdir()}==names
          receipt=json.loads((root/os.environ["RECEIPT"]).read_text(encoding="utf8"))
          assert hashlib.sha256((root/os.environ["RECEIPT"]).read_bytes()).hexdigest()=="b07f68cd71bedc3baf4fa1ac68f23088b43a031cb2aed3c8fc8160b465dde39f"
          assert hashlib.sha256((root/"SHA256SUMS").read_bytes()).hexdigest()=="8aa0b7af7ec4917d549094462500f0aa2de1f422699db7cf29b30c0d47999942"
          assert receipt["module_id"]=="P07-M05"
          assert receipt["build_id"]=="0.1.0-m05-ux15-rc4-runtime-compat"
          assert receipt["source_commit"]==os.environ["P07_SHA"]
          assert receipt["source_tree"]==os.environ["TARGET_TREE"]
          assert receipt["formal_tag"]==os.environ["TAG"]
          assert receipt["archive_name"]==os.environ["ASSET"]
          assert receipt["archive_sha256"]==os.environ["ZIP_SHA"]
          assert receipt["previous_formal_build"]=="0.1.0-m05-ux14-verified-pycache"
          with zipfile.ZipFile(root/os.environ["ASSET"]) as z:
              assert z.testzip() is None
              assert z.read("p07-m05/BUILD_ID")==b"0.1.0-m05-ux15-rc4-runtime-compat\n"
              assert "p07-m05/lib/m05_python_cache_guard.py" in z.namelist()
          print("P07_M05_UX15_REMOTE_FULL_BYTES_SHA_AND_RECEIPT=PASS")
          PY
      - name: Recheck published public SHA manifest and current UX14 pin not yet promoted
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(gh api repos/llhzx2018/core-free-runner-public/branches/main --jq '.commit.sha')" = "$PUBLIC_MAIN_SHA"
          test "$(gh api repos/llhzx2018/vf-server-ops/branches/main --jq '.commit.sha')" = "$P07_SHA"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 2 --max-time 40 \
            'https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/p07-toolbox.sh' \
            -o "$RUNNER_TEMP/p07-toolbox-current.sh"
          grep -Fqx 'M05_BUILD_EXPECTED="0.1.0-m05-ux14-verified-pycache"' "$RUNNER_TEMP/p07-toolbox-current.sh"
          echo P07_M05_UX15_OFFICIAL_PUBLIC_READBACK=PASS
          echo P07_M05_TOOLBOX_PIN=UX14_UNCHANGED
      - name: Erase transient downloaded files
        if: always()
        shell: bash
        run: |
          set +e
          set +x
          rm -rf -- "$RUNNER_TEMP/p07-ux15-official"
          rm -f -- "$RUNNER_TEMP/p07-toolbox-current.sh"
          echo P07_M05_READBACK_TEMP_BYTES_REMOVED=PASS
