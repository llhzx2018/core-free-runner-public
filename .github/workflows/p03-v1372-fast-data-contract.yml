name: P03 V1.37.2 Fast Data Contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p03-v1372-fast-data-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  P03_REPOSITORY: llhzx2018/vf-forge
  P03_BRANCH: maintenance/v1.37.2-project-intelligence-integrity

jobs:
  data-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact private maintenance source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.P03_REPOSITORY }}
          ref: ${{ env.P03_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: p03
      - name: Finalize in workspace and verify data semantics
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p03
          php -v
          php -m | grep -qiE '^pdo_sqlite$'
          python3 scripts/finalize_v1372.py
          test "$(cat VERSION)" = '1.37.2'
          php -l src/app/AuthorityMemoryService.php
          php -l src/app/ProjectIntelligenceReadModel.php
          php -l public/intelligence-api.php
          node --check public/assets/project-intelligence.js
          node --check public/assets/project-intelligence-v1372.js
          python3 tests/unit/project_intelligence_v1372_contract_test.py
          php tests/integration/project_intelligence_v1372_read_model_test.php
          grep -Fq "production_truth']['current_version" src/app/ProjectIntelligenceReadModel.php
          grep -Fq "truthValue(\$truth, 'working')" src/app/ProjectIntelligenceReadModel.php
          grep -Fq "nonBlockingText" src/app/ProjectIntelligenceReadModel.php
          grep -Fq "endpoint_locator" src/app/ProjectIntelligenceReadModel.php
          grep -Fq "'production_truth'" src/app/AuthorityMemoryService.php
          grep -Fq "'version'" src/app/AuthorityMemoryService.php
          grep -Fq "'schema'" src/app/AuthorityMemoryService.php
          echo 'P03_V1372_FAST_DATA_CONTRACT=PASS'
          echo 'PRODUCTION_WRITE=NO'
