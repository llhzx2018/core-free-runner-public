name: p01-v247221-software-r4

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v247221-software-r4.yml'

permissions:
  contents: read

jobs:
  exact-source-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      TARGET_SHA: 4d346df37b9fe9766ab1373658a426f25585e328
      BASE_TAG: v2.47.220
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd unzip >/dev/null
          php -m | grep -Fx pdo_sqlite
          echo P01_SOFTWARE_R4_RUNTIME=PASS
      - name: Resolve exact private source
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" candidate
          git -C candidate fetch -q --depth 1 origin "$TARGET_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.221"
          git clone -q --depth 1 --branch "$BASE_TAG" "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" stable
          echo P01_SOFTWARE_R4_EXACT_SOURCE=PASS
      - name: Focused Software verification
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          php -l src/app/SoftwareWorkspaceHome.php >/dev/null
          node --check src/assets/software-workspace.js
          php tests/unit/software_production_r4_contract.php
          php tests/unit/software_screenshot_polish_r3_contract.php
          php tests/unit/software_onepage_r2_contract.php
          php tests/unit/software_mature_landing_r1_contract.php
          php tests/unit/software_page_full_polish_contract.php
          php tests/unit/software_platform_total_contract.php
          php tests/unit/software_workspace_contract.php
          php tests/unit/frontend_projects_tools_software_r5_contract.php
          echo P01_SOFTWARE_R4_FOCUSED=PASS
      - name: Canonical zero-debt regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          bash tests/canonical_release_regression.sh . "$GITHUB_WORKSPACE/stable" --require-zero-debt | tee /tmp/p01-canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/p01-canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/p01-canonical.txt
          echo P01_SOFTWARE_R4_CANONICAL=PASS
