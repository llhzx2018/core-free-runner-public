name: TEMP S01-C02 Ops 1.21.799 Update Channel Gate

on:
  push:
    branches:
      - temp/s01-c02-v121799-update-channel-gate-20260903

permissions:
  contents: read

jobs:
  update-channel-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CORE_CANDIDATE_SHA: 0e308ec66bb09104a0bb628a8a943a5441d11c48
      OPS_RELEASE_SHA: 4a04c70ba20ba7407230c8121aa6e5f11ac29743
      OPS_RELEASE_TREE: 05107a744a61c1566ce783c5135192ad2b07e6e2
      RELEASE_ID: '382483445'
      ASSET_ID: '543806414'
      ASSET_NAME: vf-tools-ops_V1.21.799.zip
      ASSET_BYTES: '3202380'
      ASSET_SHA256: f1ef9c80259578cd1f5243e570d34633685f7628a7c8b2549f1015644d635b9b
      RUNTIME_FILES: '894'
      RUNTIME_FP: cf6c5360c5aaa704cc392d15b3f9fb3c83838fe053629c32c5b1edbc1e81ac5e
    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CORE_CANDIDATE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: updates

      - name: Verify candidate identity and UpdateCore regression
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C updates rev-parse HEAD)" = "$CORE_CANDIDATE_SHA"
          jq empty updates/projects/S01-C02.json
          find updates/update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php updates/update-core/php/tests/run.php
          echo UPDATE_CORE_REGRESSION=PASS

      - name: Verify exact S01-C02 1.21.797 to 1.21.799 channel
        shell: bash
        run: |
          set -Eeuo pipefail
          FILE=updates/projects/S01-C02.json
          jq -e --arg sha "$ASSET_SHA256" --arg fp "$RUNTIME_FP" '
            .schema_version=="wp-component-1.0" and
            .project_id=="S01" and
            .component_id=="S01-C02" and
            .component_type=="PLUGIN" and
            .target_version=="1.21.799" and
            .from_versions==["1.21.797"] and
            .release_tag=="v1.21.799" and
            .asset_name=="vf-tools-ops_V1.21.799.zip" and
            .asset_bytes==3202380 and
            .asset_sha256==$sha and
            .runtime_files==894 and
            .runtime_fingerprint==$fp and
            .runtime_file_count==894 and
            .runtime_fingerprint_sha256==$fp and
            .schema_from=="6.0.0" and
            .schema_to=="6.0.0" and
            .backup_required==true and
            .rollback_supported==true and
            .physical_locator=="vf-ops/vf-ops.php" and
            .locator_cutover==false
          ' "$FILE" >/dev/null
          echo S01_C02_MANIFEST_IDENTITY=PASS

      - name: Verify released tag asset and exact bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          REL="$(curl -fsSL -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.799')"
          test "$(jq -r '.id' <<<"$REL")" = "$RELEASE_ID"
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.id' <<<"$REL")" = "$ASSET_ID"
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.size' <<<"$REL")" = "$ASSET_BYTES"
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.digest' <<<"$REL")" = "sha256:${ASSET_SHA256}"
          TAG="$(curl -fsSL -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/llhzx2018/vf-tools-ops/git/ref/tags/v1.21.799')"
          test "$(jq -r '.object.sha' <<<"$TAG")" = "$OPS_RELEASE_SHA"
          COMMIT="$(curl -fsSL -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/llhzx2018/vf-tools-ops/git/commits/${OPS_RELEASE_SHA}")"
          test "$(jq -r '.tree.sha' <<<"$COMMIT")" = "$OPS_RELEASE_TREE"
          curl -fL --retry 3 -o /tmp/$ASSET_NAME "https://github.com/llhzx2018/vf-tools-ops/releases/download/v1.21.799/$ASSET_NAME"
          test "$(stat -c '%s' /tmp/$ASSET_NAME)" = "$ASSET_BYTES"
          test "$(sha256sum /tmp/$ASSET_NAME | awk '{print $1}')" = "$ASSET_SHA256"
          unzip -tq /tmp/$ASSET_NAME >/dev/null
          echo S01_C02_RELEASE_ASSET_EXACT_READBACK=PASS

      - name: Verify direct-source contract remains fail closed
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          p=json.load(open('updates/projects/S01-C02.json'))
          assert p['from_versions']==['1.21.797']
          assert '1.21.798' not in p['from_versions']
          assert p['target_version']=='1.21.799'
          print('DIRECT_SOURCE_1_21_797_ONLY=PASS')
          PY
          echo UPDATE_CHANNEL_GATE=PASS
