name: S01 Component Header IA Candidate Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/s01-component-header-ia-gate-20260925.yml'

permissions:
  contents: read

jobs:
  theme-ia:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      THEME_SHA: 7b891c50b3e6227577baf3ede0601e349e5fefba
    steps:
      - name: Credential presence
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: test -n "$READ_TOKEN"
      - name: Checkout exact Theme candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: ${{ env.THEME_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: theme
      - name: Exact source and identity
        run: |
          set -Eeuo pipefail
          test "$(git -C theme rev-parse HEAD)" = "$THEME_SHA"
          test "$(tr -d '\r\n' < theme/VERSION)" = "1.35.40"
          grep -Fq "Version: 1.35.40" theme/src/style.css
          grep -Fq "V1.35.40_S01_THEME_HEADER_IA_R13" theme/src/style.css
          grep -Fq "V1.35.40_S01_THEME_HEADER_IA_R13" theme/src/inc/runtime-constants.php
          grep -Fq '"vfThemeVersion": "1.35.40"' theme/src/theme.json
          grep -Fq '"vfPackageSyncRound": "V1.35.40_S01_THEME_HEADER_IA_R13"' theme/src/theme.json
      - name: PHP syntax
        run: |
          set -Eeuo pipefail
          php -l theme/src/inc/admin/admin-tab-registry.php
          php -l theme/src/inc/admin/admin-shell.php
          php -l theme/src/inc/runtime-constants.php
          php -l theme/tests/s01-c01-admin-shell-alignment-r1-contract.php
      - name: Theme header IA contracts
        working-directory: theme
        run: |
          set -Eeuo pipefail
          php tests/s01-c01-admin-shell-alignment-r1-contract.php
          php tests/visible-console-v2-contract.php
          php tests/final-admin-human-closure-contract.php

  m3u8-ia:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      M3U8_SHA: e6750f3d7c77a4c06cfb347168b39ec44210ef94
    steps:
      - name: Credential presence
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: test -n "$READ_TOKEN"
      - name: Checkout exact M3U8 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: ${{ env.M3U8_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: m3u8
      - name: Exact source and identity
        run: |
          set -Eeuo pipefail
          test "$(git -C m3u8 rev-parse HEAD)" = "$M3U8_SHA"
          test "$(tr -d '\r\n' < m3u8/VERSION)" = "1.25.43"
          grep -Fq "Version: 1.25.43" m3u8/src/vf-tool-m3u8.php
          grep -Fq "VF_TOOL_M3U8_VERSION', '1.25.43'" m3u8/src/vf-tool-m3u8.php
          grep -Fq "VF_TOOL_M3U8_ROUND', 'R265'" m3u8/src/vf-tool-m3u8.php
      - name: PHP syntax
        run: |
          set -Eeuo pipefail
          php -l m3u8/src/admin/admin-ia-contract.php
          php -l m3u8/src/admin/Presentation/Components/class-admin-components.php
          php -l m3u8/src/admin/Controller/class-v6-provider-operations-controller.php
          php -l m3u8/src/admin/admin-console.php
          php -l m3u8/src/admin/console-bootstrap.php
          php -l m3u8/tests/s01-c03-admin-shell-alignment-r1-contract.php
      - name: M3U8 header IA contracts
        working-directory: m3u8
        run: |
          set -Eeuo pipefail
          php tests/s01-c03-admin-shell-alignment-r1-contract.php
          php tests/unit/admin-human-language-contract.php
          php tests/unit/visible-console-v2-contract.php
          php tests/provider-dashboard-visible-ui-contract.php
