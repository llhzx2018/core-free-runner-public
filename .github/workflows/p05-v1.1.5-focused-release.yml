name: P05 V1.1.5 Focused Release

on:
  push:
    branches:
      - gate/p05-v115-stale-empty-install-20260830
    paths:
      - '.github/workflows/p05-v1.1.5-focused-release.yml'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      P05_MAIN_SHA: 71493ef55f51d5aeebcc3693e1e8a8e6fe441392
      P05_VERSION: 1.1.5
      RELEASE_TAG: v1.1.5
      RELEASE_ASSET: VF_SEO_V1.1.5_FULL.zip
      RECEIPT_ASSET: VF_SEO_V1.1.5_RELEASE_RECEIPT.txt
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Checkout exact P05 main
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.P05_MAIN_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Focused release verification
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$P05_MAIN_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "$P05_VERSION"
          test "$(node -p "require('./package.json').version")" = "$P05_VERSION"
          test "$(jq -r .version VF_PROJECT.json)" = "$P05_VERSION"
          npm ci
          npm run release:source:gate
          php -r 'if (PHP_VERSION_ID < 80200 || !extension_loaded("pdo_sqlite")) exit(1);'
          php -l php/src/FreshInstallRecovery.php
          php -l php/src/setup-bootstrap.php
          bash php/tests/stale-empty-install-smoke.sh
          npm run build:php-release
          npm run php:release:gate
          test -f build/vf-seo-php-release/php/src/FreshInstallRecovery.php
          grep -Fq 'recoverStaleEmptyInstall' build/vf-seo-php-release/php/src/setup-bootstrap.php
          echo P05_V115_FOCUSED_MACHINE=PASS
      - name: Build deterministic FULL
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/p05-v115-release"
          mkdir -p "$OUT"
          zip_stage() {
            local out="$1"
            STAGE="$(pwd)/build/vf-seo-php-release" OUT_FILE="$out" python3 - <<'PY'
          import os,pathlib,zipfile
          stage=pathlib.Path(os.environ['STAGE']); out=pathlib.Path(os.environ['OUT_FILE'])
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9,strict_timestamps=True) as z:
              for p in sorted(x for x in stage.rglob('*') if x.is_file()):
                  rel=p.relative_to(stage).as_posix()
                  info=zipfile.ZipInfo(rel,date_time=(1980,1,1,0,0,0)); info.compress_type=zipfile.ZIP_DEFLATED; info.create_system=3
                  info.external_attr=((0o100755 if rel=='install-cloudpanel-php.sh' else 0o100644)<<16)
                  z.writestr(info,p.read_bytes())
          PY
          }
          zip_stage "$OUT/a.zip"
          zip_stage "$OUT/b.zip"
          cmp "$OUT/a.zip" "$OUT/b.zip"
          mv "$OUT/a.zip" "$OUT/$RELEASE_ASSET"
          rm "$OUT/b.zip"
          SHA="$(sha256sum "$OUT/$RELEASE_ASSET" | awk '{print $1}')"
          BYTES="$(stat -c %s "$OUT/$RELEASE_ASSET")"
          FILES="$(unzip -Z1 "$OUT/$RELEASE_ASSET" | grep -cv '/$')"
          TREE="$(git rev-parse HEAD^{tree})"
          cat > "$OUT/$RECEIPT_ASSET" <<EOF
          P05_V115_FOCUSED_RELEASE_MACHINE=PASS
          P05_EXACT_MAIN=$P05_MAIN_SHA
          P05_TREE=$TREE
          P05_VERSION=$P05_VERSION
          P05_STALE_EMPTY_FRESH_INSTALL=PASS
          P05_FORMAL_FULL_FILES=$FILES
          P05_FORMAL_FULL_BYTES=$BYTES
          P05_FORMAL_FULL_SHA256=$SHA
          P05_PRODUCTION=NOT_DEPLOYED
          EOF
          echo "RELEASE_SHA=$SHA" >> "$GITHUB_ENV"
          echo "RELEASE_BYTES=$BYTES" >> "$GITHUB_ENV"
          echo "RELEASE_FILES=$FILES" >> "$GITHUB_ENV"
          echo "RELEASE_TREE=$TREE" >> "$GITHUB_ENV"
          echo "RELEASE_DIR=$OUT" >> "$GITHUB_ENV"
      - name: Publish v1.1.5
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          if gh release view "$RELEASE_TAG" -R llhzx2018/vf-seo >/dev/null 2>&1; then
            echo "release already exists" >&2
            exit 1
          fi
          cat > "$RUNNER_TEMP/notes.txt" <<'EOF'
          P05 v1.1.5 fixes the fresh-install case observed on CloudPanel where a freshly uploaded web root could still inherit an older empty private setup state from the site user's HOME and incorrectly show the login screen.

          If the retained setup lock is from an older P05 version, exactly one admin exists, there is no project/website/provider data, and no successful login has ever occurred, VF SEO now archives that stale lock and returns to browser-first owner setup so the owner can choose the administrator password. Existing installations with real data or a prior successful login remain protected and are never reset by this path.

          Production remains NOT_DEPLOYED.
          EOF
          gh release create "$RELEASE_TAG" \
            "$RELEASE_DIR/$RELEASE_ASSET#$RELEASE_ASSET" \
            "$RELEASE_DIR/$RECEIPT_ASSET#$RECEIPT_ASSET" \
            -R llhzx2018/vf-seo \
            --target "$P05_MAIN_SHA" \
            --title 'P05 · VF SEO v1.1.5 · Fresh Install Recovery' \
            --notes-file "$RUNNER_TEMP/notes.txt"
      - name: Remote release readback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          JSON="$(gh api repos/llhzx2018/vf-seo/releases/tags/$RELEASE_TAG)"
          FULL="$(jq -c --arg n "$RELEASE_ASSET" '.assets[] | select(.name==$n)' <<<"$JSON")"
          test "$(jq -r .target_commitish <<<"$JSON")" = "$P05_MAIN_SHA"
          test "$(jq -r .size <<<"$FULL")" = "$RELEASE_BYTES"
          test "$(jq -r .digest <<<"$FULL")" = "sha256:$RELEASE_SHA"
          echo "P05_V115_RELEASE_ID=$(jq -r .id <<<"$JSON")"
          echo "P05_V115_FULL_ASSET_ID=$(jq -r .id <<<"$FULL")"
          echo "P05_V115_PUBLISHED_AT=$(jq -r .published_at <<<"$JSON")"
          echo "P05_V115_FULL_FILES=$RELEASE_FILES"
          echo "P05_V115_FULL_BYTES=$RELEASE_BYTES"
          echo "P05_V115_FULL_SHA256=$RELEASE_SHA"
          echo "P05_V115_RELEASE_REMOTE_READBACK=PASS"
