name: GOV-BOOK B1 v1.0.2 two-stage training feedback proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/govbook-b1-v102-feedback-proof-20261015.yml'
permissions:
  contents: read
jobs:
  source-and-reader:
    if: >-
      github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public' &&
      github.event.pull_request.user.login == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout pinned private candidate and original source
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          umask 077
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/gov-book.git" book
          git -C book fetch -q origin draft/b1-v58-r2-reader-feedback-pages-20261015
          git -C book fetch -q origin draft/b1-skill-book-v58-depth-20261015
          git -C book checkout -q b3f1eee88d4aa71052d52c9d0735c37c7be94386
          test "$(git -C book rev-parse HEAD)" = b3f1eee88d4aa71052d52c9d0735c37c7be94386
          echo GOVBOOK_B1_EXACT_CANDIDATE=PASS
      - name: Verify unchanged original, 12 chapter rewrites and 24 complete feedbacks
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import pathlib,json,hashlib,re,zipfile,subprocess,posixpath
          root=pathlib.Path('book')
          s=lambda b:hashlib.sha256(b).hexdigest()
          base=root/'distribution/p01/books/B1'
          older=base/'v1.0.1'
          newer=base/'v1.0.2'
          oldmeta=json.loads((older/'asset.json').read_text('utf8'))
          meta=json.loads((newer/'asset.json').read_text('utf8'))
          catalog=json.loads((root/'distribution/p01/catalog.json').read_text('utf8'))
          manifest=json.loads((root/'books/B1/revisions/skill-book-v5.8-r2/SOURCE_MANIFEST.json').read_text('utf8'))
          revisions={r['book_id']:r for r in catalog['internal_revisions']}
          assert len(revisions)==8 and len(catalog['books'])==9 and len(catalog['internal_books'])==2
          assert revisions['B1']['book_version']=='v1.0.2'
          assert revisions['A1']['book_version']=='v1.0.3' and revisions['B3']['book_version']=='v1.0.3'
          assert meta['book_version']=='v1.0.2' and meta['base_book_version']=='v1.0.0'
          assert meta['qualification']=='INTERNAL' and meta['publication_status']=='NOT_PUBLISHED'
          assert meta['source_commit']==manifest['source_commit']=='a996fb0b3da18fbbd2ff228f48a20b412e8fd942'
          assert s((older/'reader.zip').read_bytes())==oldmeta['zip']['sha256']
          assert s((newer/'cover.png').read_bytes())==meta['cover']['sha256']==oldmeta['cover']['sha256']
          payload=(newer/'reader.zip').read_bytes()
          assert len(payload)==116447==meta['zip']['bytes'] and s(payload)==meta['zip']['sha256']=='4c6628b5cae949038f9fd95d06e0914623f5eb54008400cf4f0fe515d792d241'
          assert len(manifest['entries'])==43 and len({e['name'] for e in manifest['entries']})==43
          old_root='books/B1/revisions/skill-book-v5.8-r1/p01_course/md/'
          new_root=root/'books/B1/revisions/skill-book-v5.8-r2/p01_course/md'
          exercises=[1,2,3,5,6,9,10,12,13,14,15,16]
          pattern=re.compile(r'<details>\s*<summary>查看(第一次|第二次) Feedback</summary>\s*([\s\S]*?)\s*</details>')
          with zipfile.ZipFile(newer/'reader.zip') as z:
            assert z.testzip() is None
            infos=z.infolist()
            assert len(infos)==43
            names={i.filename for i in infos}
            assert len(names)==43
            for i in infos:
              assert i.compress_type==zipfile.ZIP_STORED and (i.flag_bits & 0x800)
              assert not i.filename.startswith('/') and '\\' not in i.filename
              assert '..' not in pathlib.PurePosixPath(i.filename).parts
              assert i.filename.endswith('.md') and i.file_size<=2*1024*1024
            for e in manifest['entries']:
              name=e['name']
              body=(root/e['source']).read_bytes()
              assert z.read(name)==body and len(body)==e['bytes']
              assert (zipfile.crc32(body)&0xffffffff)==int(e['crc32'],16)
              assert hashlib.sha1(f'blob {len(body)}'.encode()+bytes([0])+body).hexdigest()==e['git_blob']
              text=body.decode('utf8')
              assert sum(x.startswith('# ') for x in text.splitlines())==1
              for href in re.findall(r'\]\(([^)\s]+)\)',text):
                href=href.split('#')[0]
                if not href or href.startswith(('https://','http://','mailto:')):continue
                normalized=posixpath.normpath(posixpath.join(posixpath.dirname(name),href))
                assert normalized in names and not normalized.startswith('../'),(name,href)
            changed=[]
            for n in range(1,19):
              ch=f'{n:02d}_第{n:02d}章.md'
              original=subprocess.check_output(['git','-C','book','show','d08346cfcdce8aa19b6b594e978f2dbd6eb8bdeb:'+old_root+ch]).decode('utf8')
              revised=(new_root/ch).read_text('utf8')
              if n not in exercises:
                assert revised==original
                continue
              found=pattern.findall(original)
              assert len(found)==2 and found[0][0]=='第一次' and found[1][0]=='第二次'
              def convert(m):
                first=m.group(1)=='第一次'
                marker='**LEARNER CORRECTION**' if first else '**WHAT CHANGED**'
                parts=m.group(2).strip().split(marker)
                assert len(parts)==2 and parts[0].strip() and parts[1].strip()
                sid='FIRST' if first else 'SECOND'
                fb=f'Training/{n:02d}_{sid}.md'
                ftext=(new_root/fb).read_text('utf8')
                assert parts[0].strip() in ftext and z.read(fb).decode('utf8')==ftext
                assert ('../'+ch) in ftext
                return f'[先完成作答，再查看第 {n} 章{"第一轮" if first else "第二轮"}参考反馈]({fb})\n\n{marker}{parts[1].rstrip()}'
              target=pattern.sub(convert,original)
              assert revised==target,(ch,'lost_original_or_feedback')
              assert '<details>' not in revised and '<summary>' not in revised
              changed.append(ch)
            assert len(changed)==12
          print('GOVBOOK_B1_43_MD_SHA_CRC=PASS')
          print('GOVBOOK_B1_12_LOSSLESS_EXERCISE_REWRITE=PASS')
          print('GOVBOOK_B1_24_TWO_STAGE_FEEDBACKS=PASS')
          print('GOVBOOK_B1_NESTED_LINKS_AND_H1=PASS')
          print('GOVBOOK_B1_IDENTITY_AND_COVER_PRESERVED=PASS')
          PY
      - name: All eight reader versions regression
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 book/tools/verify_p01_internal_revisions.py
          echo GOVBOOK_ALL_EIGHT_REVISION_REGRESSION=PASS
      - name: Remove private source
        if: always()
        shell: bash
        run: rm -rf book
