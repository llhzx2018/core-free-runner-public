name: P07 M03 D04 matched-engine source QA
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-m03-d04-matched-qa-20261115.yml'
permissions:
  contents: read
jobs:
  qa:
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout public runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Transient exact private product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: d0b7f9b0ac89aba1ae630128cd32878c5844bb6d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: .p07-private-match
      - name: Full stage matched engine plus conversion route tests
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-private-match rev-parse HEAD)" = d0b7f9b0ac89aba1ae630128cd32878c5844bb6d
          cd .p07-private-match
          export PYTHONPATH="$PWD/lib"
          python3 -B -m unittest discover -s tests -p test_p07_m03_d04_matched_engine.py -v
          python3 -B -m unittest discover -s tests -p test_p07_m03_db_conversion_plan.py -v
          python3 -B -m unittest discover -s tests -p test_p07_terminal_ux_contract.py -v
          python3 -B scripts/check_p07_modules.py --module P07-M03-D04 \
            --pr-title 'P07-M03-D04 服务器迁移：匹配引擎数据库独立阶段' \
            --changed-file lib/server_migration_pull.py \
            --changed-file lib/migration_matched_engine.py \
            --affected P07-M03-D04 --shared-reason 'D04新增匹配引擎受控共享运行库'
          python3 -B scripts/check_p07_terminal_ux.py
          echo P07_M03_D04_MATCHED_ENGINE_SOURCE_QA=PASS
      - name: Remove private checkout
        if: always()
        shell: bash
        run: |
          rm -rf -- .p07-private-match
          test ! -e .p07-private-match
          echo P07_M03_D04_PRIVATE_SOURCE_CLEAN=PASS
