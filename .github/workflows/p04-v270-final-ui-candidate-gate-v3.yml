name: P04 V2.7 Final UI Candidate Gate V3
on:
  push:
    branches: [p04-v270-final-ui-candidate-gate-tmp]
    paths: [.github/workflows/p04-v270-final-ui-candidate-gate-v3.yml]
permissions:
  contents: write
jobs:
  candidate-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PRODUCT_HEAD: ad3031313d31302c41e0c9528bd04b81ba06724c
      AUTHORITY_HEAD: 2b9209fb5c5a8d5ec4f7ea770fa473962fdccb9c
      PRODUCT_VERSION: 2.7.0
      PRODUCT_SCHEMA: '14'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Publish run locator
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'VF Candidate Gate Runner'; git config user.email 'actions@users.noreply.github.com'
          printf '{"status":"STARTING","run_id":"%s","product_head":"%s","version":"2.7.0","schema":14,"production_write":0}\n' "$GITHUB_RUN_ID" "$PRODUCT_HEAD" > p04-v270-final-ui-candidate-gate-run.json
          git add p04-v270-final-ui-candidate-gate-run.json && git commit -m 'chore(P04): locate candidate gate v3 [skip ci]' || true
          git push origin HEAD:p04-v270-final-ui-candidate-gate-tmp
      - name: Require existing private read authority
        env: {TOKEN: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'}
        run: test -n "$TOKEN"
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: ad3031313d31302c41e0c9528bd04b81ba06724c
          token: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'
          fetch-depth: 0
          persist-credentials: false
          path: vf-src
      - name: Exact identity and CSS-only delta
        working-directory: vf-src
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_HEAD"
          test "$(tr -d '\r\n' < VERSION)" = "$PRODUCT_VERSION"
          test "$(jq -r '.schema_version_contract' VF_PROJECT.json)" = "$PRODUCT_SCHEMA"
          test "$(jq -r '.integration.migration' VF_PROJECT.json)" = 'NONE'
          mapfile -t changed < <(git diff --name-only "$AUTHORITY_HEAD" "$PRODUCT_HEAD")
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx public/index.php
          printf '%s\n' "${changed[@]}" | grep -Fx public/assets/v270-final-polish.css
          test -z "$(git diff --name-only "$AUTHORITY_HEAD" "$PRODUCT_HEAD" -- VERSION VF_PROJECT.json migrations public/bootstrap.php public/api.php public/experience.php public/assets/v270-reference-lock.js public/assets/v270-personal-infra.css)"
          test "$(git diff --numstat "$AUTHORITY_HEAD" "$PRODUCT_HEAD" -- public/index.php | awk '{print $1":"$2}')" = '1:0'
          ! grep -Eqi '(api[_-]?key|secret|token|password)[[:space:]]*[:=][[:space:]]*["'"'][^"'"']{8,}' public/assets/v270-final-polish.css
          echo P04_V270_POLISH_ONLY_DELTA=PASS
      - name: PHP and unit regression
        working-directory: vf-src
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find . -type f -name '*.php' -print0)
          for t in tests/unit/*.php; do php "$t"; done
          echo P04_V270_PHP_UNIT_REGRESSION=PASS
      - name: Install Playwright Chromium
        working-directory: vf-src
        shell: bash
        run: |
          set -Eeuo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Actual browser visual functional security gate
        working-directory: vf-src
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f public/config.php public/*.sqlite public/*.sqlite-* || true
          rm -rf public/data public/storage var/data var/sessions evidence-final-ui
          mkdir -p evidence-final-ui
          export VF_INFRA_E2E_ADMIN_CREDENTIAL="P04-CANDIDATE-$(openssl rand -hex 16)"
          php -S 127.0.0.1:18998 -t public > evidence-final-ui/php-server.log 2>&1 & PHP_PID=$!
          cleanup(){ kill "$PHP_PID" 2>/dev/null || true; }; trap cleanup EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18998/setup.php >/dev/null && break || sleep 1; done
          curl -fsS http://127.0.0.1:18998/setup.php >/dev/null
          VF_INFRA_E2E_BASE_URL=http://127.0.0.1:18998 VF_INFRA_E2E_ADMIN_CREDENTIAL="$VF_INFRA_E2E_ADMIN_CREDENTIAL" VF_INFRA_E2E_WEB_ROOT="$PWD/public" VF_V270_TESTED_RUNTIME_COMMIT="$PRODUCT_HEAD" VF_V270_EVIDENCE_DIR="$PWD/evidence-final-ui" node tests/e2e/v270-final-polish-evidence.mjs | tee evidence-final-ui/e2e.log
          test -f public/config.php
          mode="$(stat -c '%a' public/config.php)"; case "$mode" in 600|640) ;; *) exit 71;; esac
          code="$(curl -sS -o /tmp/unauth -w '%{http_code}' -H 'Accept: application/json' 'http://127.0.0.1:18998/api.php?action=snapshot')"
          test "$code" = 401 -o "$code" = 403
          ! grep -RIlE '(VF_PRIVATE_READ_TOKEN|VF_RELEASE_WRITE_TOKEN|ghp_[A-Za-z0-9]{20,}|github_pat_)' evidence-final-ui public/config.php
          pngs="$(find evidence-final-ui -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')"; test "$pngs" -ge 12
          sha256sum evidence-final-ui/*.png > evidence-final-ui/SHA256SUMS
          printf 'SECURITY_REGRESSION=PASS\nCONFIG_MODE=%s\nUNAUTH_API_HTTP=%s\n' "$mode" "$code" > evidence-final-ui/security-regression.txt
          printf '{"status":"READY_FOR_ACTUAL_PIXEL_REVIEW","runtime_commit":"%s","version":"2.7.0","schema":14,"migration":"NONE","owner_real_use":"PASS","functional_regression":"PASS","security_regression":"PASS","desktop":"PASS","mobile":"PASS","screenshot_count":%s,"production_write":0,"candidate_created":false}\n' "$PRODUCT_HEAD" "$pngs" > evidence-final-ui/CANDIDATE_GATE_MANIFEST.json
          echo P04_V270_BROWSER_VISUAL_SECURITY=PASS
      - uses: actions/upload-artifact@v4
        with:
          name: P04-V2.7.0-FINAL-UI-CANDIDATE-GATE
          path: vf-src/evidence-final-ui
          if-no-files-found: error
          retention-days: 30
      - name: Record outcome
        if: always()
        env: {JOB_STATUS: '${{ job.status }}'}
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'VF Candidate Gate Runner'; git config user.email 'actions@users.noreply.github.com'
          s=FAILED; [ "$JOB_STATUS" = success ] && s=TESTED_READY_FOR_PIXEL_REVIEW
          printf '{"status":"%s","run_id":"%s","job_status":"%s","product_head":"%s","version":"2.7.0","schema":14,"production_write":0}\n' "$s" "$GITHUB_RUN_ID" "$JOB_STATUS" "$PRODUCT_HEAD" > p04-v270-final-ui-candidate-gate-run.json
          git add p04-v270-final-ui-candidate-gate-run.json && git commit -m 'chore(P04): record candidate gate v3 result [skip ci]' || true
          git push origin HEAD:p04-v270-final-ui-candidate-gate-tmp
