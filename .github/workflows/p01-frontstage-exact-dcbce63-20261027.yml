name: "TEMP P01 frontstage focused regression dcbce63"
on:
  push:
    branches:
      - "verify/p01-frontstage-dcbce63-machine-20261027"
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  p01-frontstage-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact P01 private source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: "dcbce63cba263abbd91b3da94abde898acb8f058"
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Fail closed on non-identical candidate
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "dcbce63cba263abbd91b3da94abde898acb8f058"
          test "$(cat VERSION)" = "2.47.464"
          test "$(cat src/VERSION.txt)" = "2.47.464"
          echo "P01_MAIN_EXACT_SHA_AND_VERSION=PASS"
      - name: Print runtime versions
        run: |
          php -v | head -2
          node --version
      - name: Focused PHP source syntax
        run: |
          set -eu
          for p in src/app/WatchFacetContext.php src/app/WatchMediaLibraryPage.php src/app/SubjectPageChrome.php src/toolbox-manager.php src/music-home.php src/app/FunctionalWorkspace.php; do
            php -l "$p"
          done
          echo "P01_FRONTSTAGE_PHP_SYNTAX=PASS"
      - name: Focused JavaScript source syntax
        run: |
          set -eu
          for p in src/assets/local-subsite-management.js src/assets/workspace.js src/assets/watch-metadata.js src/assets/full-governance.js; do
            node --check "$p"
          done
          echo "P01_FRONTSTAGE_JS_SYNTAX=PASS"
      - name: Watch status and filtering PHP regression
        run: |
          set -eu
          php tests/unit/watch_status_transition_facets_contract.php
          php tests/unit/watch_page_filter_hierarchy_contract.php
          echo "P01_WATCH_FILTER_MACHINE=PASS"
      - name: Music Tools Inbox native management regression
        run: |
          set -eu
          node --test tests/unit/p01_frontstage_specialist_tasks_contract.cjs tests/unit/p01_tools_workflow_draft_preservation_contract.cjs tests/unit/p01_inbox_bulk_dispatch_race_contract.cjs
          echo "P01_NATIVE_MANAGEMENT_MACHINE=PASS"
      - name: Watch native detail and atomic save behavior regression
        run: |
          set -eu
          node --test tests/browser/watch_cinema_detail_delegation_contract.cjs tests/browser/watch_metadata_detail_live_sync_contract.cjs tests/browser/watch_metadata_manual_sync_result_contract.cjs tests/browser/watch_detail_save_single_submit_contract.cjs tests/browser/watch_add_single_submit_contract.cjs
          echo "P01_WATCH_INTERACTION_MACHINE=PASS"
      - name: Public-safe completion statement
        run: |
          echo "P01_FOCUSED_EXACT_SOURCE_REGRESSION=PASS"
          echo "No Release, Distribution, Production or private source persistence."
