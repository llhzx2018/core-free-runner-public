name: P01 V2.47.281 Core Updates Proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p01-v247281-core-updates-proof.yml"

permissions:
  contents: read

jobs:
  proof:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'proof(P01): V2.47.281 core-updates')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli jq >/dev/null
      - name: Clone exact candidate
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/core-updates.git" candidate
          git -C candidate fetch -q origin 1dec97542031bf984d03bd02225803c6e7841ba2
          git -C candidate checkout -q --detach 1dec97542031bf984d03bd02225803c6e7841ba2
          echo CORE_UPDATES_EXACT_SOURCE=PASS
      - name: Canonical CI equivalent
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 scripts/check_manifest_contract.py
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find update-core/php -type f -name '*.php' -print0)
          php update-core/php/tests/run.php
          echo CORE_UPDATES_CANONICAL_CI_EQUIVALENT=PASS
      - name: Verify identity
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          jq -e '
            .current_version=="2.47.280" and
            .target_version=="2.47.281" and
            .from_versions==["2.47.280"] and
            .release_id==406329836 and
            .product_identity=="bf1371778a2a3c5402847d4b2d7bd5ef551af900" and
            .asset_name=="VF_Start_V2.47.281_UPDATE.zip" and
            .asset_bytes==2360775 and
            .asset_sha256=="cd83e44453819cc2126521d4dcbc78bd34615b7302ba1d9cecb0d028bad35836" and
            (.notes|contains("三步安装连接流程恢复为始终可见")) and
            (.notes|contains("本地时间显示"))
          ' projects/P01.json >/dev/null
          echo P01_V247281_MANIFEST_IDENTITY=PASS
      - name: Verify bounded delta
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          git fetch -q origin main
          mapfile -t changed < <(git diff --name-only origin/main...HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "projects/P01.json"
          echo CORE_UPDATES_BOUNDED_DELTA=PASS
          echo PRODUCTION_WRITE=NO
