name: P01 V2.21.18 Mobile Overflow Probe
on:
  push:
    branches: [vf-agent-operations-v1]
    paths: ['.github/workflows/p01-v2.21.18-mobile-overflow-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      W: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - shell: bash
        run: |
          set -Eeuo pipefail
          git clone -q --depth 1 --branch maintenance/prototype-refactor-2.21.18-20260819 "https://x-access-token:${R}@github.com/llhzx2018/vf-start.git" c
          test "$(git -C c rev-parse HEAD)" = '1c8d9cc0fa75ff312fae1a5c08dd6559dcb26cd2'
          sudo apt-get update -qq;sudo apt-get install -y -qq php-sqlite3 >/dev/null
          cp -a c/src /tmp/p;cd /tmp/p;php -S 127.0.0.1:18087 -t . >/tmp/slog 2>&1 & echo $! >/tmp/pid
          for i in $(seq 1 30);do curl -fsS -c /tmp/c http://127.0.0.1:18087/setup.php -o /tmp/s && break||sleep 1;done
          C=$(python3 - <<'PY'
          import re
          print(re.search(r'name="setup_csrf"\s+value="([^"]+)"',open('/tmp/s').read()).group(1))
          PY
          )
          curl -fsSL -c /tmp/c -b /tmp/c -X POST http://127.0.0.1:18087/setup.php --data-urlencode "setup_csrf=$C" --data-urlencode 'site_title=VF' --data-urlencode 'admin_password=Runner-P01-22118!Strong' --data-urlencode 'admin_password_confirm=Runner-P01-22118!Strong' >/dev/null
          mkdir -p "$RUNNER_TEMP/n";cd "$RUNNER_TEMP/n";npm init -y >/dev/null 2>&1;PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm i --no-audit --no-fund playwright-core@1.57.0 >/dev/null 2>&1
          cat > probe.mjs <<'JS'
          import{chromium}from'playwright-core';import fs from'fs';const b=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const p=await b.newPage({viewport:{width:390,height:900}});await p.goto('http://127.0.0.1:18087/',{waitUntil:'networkidle'});await p.click('#loginButton');await p.fill('[name=password]','Runner-P01-22118!Strong');await p.click('#loginSubmit');await p.waitForFunction(()=>document.documentElement.dataset.vfNavigationStability==='3');let d=await p.evaluate(()=>{const vw=document.documentElement.clientWidth;return{vw,htmlScroll:document.documentElement.scrollWidth,bodyScroll:document.body.scrollWidth,items:[...document.querySelectorAll('body *')].map(e=>{let r=e.getBoundingClientRect(),s=getComputedStyle(e);return{tag:e.tagName.toLowerCase(),id:e.id||'',cls:String(e.className||'').slice(0,160),left:Math.round(r.left),right:Math.round(r.right),width:Math.round(r.width),scrollWidth:e.scrollWidth,clientWidth:e.clientWidth,position:s.position,display:s.display,whiteSpace:s.whiteSpace,minWidth:s.minWidth,widthCss:s.width}}).filter(x=>x.right>vw+1||x.left<-1||x.scrollWidth>x.clientWidth+1).sort((a,b)=>Math.max(b.right-vw,b.scrollWidth-b.clientWidth)-Math.max(a.right-vw,a.scrollWidth-a.clientWidth)).slice(0,30)}});fs.writeFileSync('/tmp/probe.json',JSON.stringify(d,null,2));console.log(JSON.stringify(d,null,2));await b.close();
          JS
          node probe.mjs
      - if: always()
        shell: bash
        env:
          S: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import os,json,base64,urllib.request,urllib.error
          try:d=json.load(open('/tmp/probe.json'))
          except:d={}
          p={'schema':'vf-mobile-overflow-probe/v1','status':os.environ['S'].upper(),'probe':d};c=json.dumps(p,indent=2)+'\n';t=os.environ['W'];api='https://api.github.com/repos/llhzx2018/core-free-runner-public/contents/vf-agent/results/P01-V2.21.18-MOBILE-OVERFLOW-PROBE.json';h={'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json'};sha=None
          try:
            with urllib.request.urlopen(urllib.request.Request(api+'?ref=vf-agent-operations-v1',headers=h)) as r:sha=json.load(r).get('sha')
          except urllib.error.HTTPError as e:
            if e.code!=404:raise
          b={'message':'evidence(P01): publish 390px overflow probe','content':base64.b64encode(c.encode()).decode(),'branch':'vf-agent-operations-v1'}
          if sha:b['sha']=sha
          urllib.request.urlopen(urllib.request.Request(api,data=json.dumps(b).encode(),method='PUT',headers={**h,'Content-Type':'application/json'})).read()
          PY
      - if: always()
        run: if [ -f /tmp/pid ];then kill $(cat /tmp/pid) 2>/dev/null||true;fi
