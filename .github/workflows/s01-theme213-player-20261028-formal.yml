name: S01 Theme exact formal release
on:
  push:
    branches: [task/s01-theme213-player-20261028]
    paths: ['.github/workflows/s01-theme213-player-20261028-formal.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.213
  TARGET_SHA: 156f385b9753bc85a0064f0b4a3cd65f6fb59e89
  TARGET_TREE: 83d7bc4fc0d69b05c2e2d09cb84280e879216a86
  BASE_SHA: a36a2b20812a49b1ceeb650fd37fc4a24c356062
  LANE_ID: s01-theme213-player-20261028
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: control
      - name: Formal identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-theme213-player-20261028/formal-spec.json --input control/.github/workflows/s01-theme213-player-20261028-formal.yml
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 156f385b9753bc85a0064f0b4a3cd65f6fb59e89
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact candidate, merged tree and required evidence readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider candidate-proof
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40542771859 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40542771859 --jq .head_sha)" = 06369d4e92fe891004c9b75709cd120044f3ffb0
          test "$(gh api repos/$TARGET_REPO/commits/main --jq .sha)" = "$TARGET_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$TARGET_SHA --jq .tree.sha)" = "$TARGET_TREE"
          gh run download 40542771859 --repo llhzx2018/core-free-runner-public --name s01-home-40542771859 --dir candidate-proof
          cmp candidate-proof/state-before.sha256 candidate-proof/state-after.sha256
          cmp candidate-proof/contracts-before.json candidate-proof/contracts-after.json
          python3 control/lanes/s01-theme213-player-20261028/package.py
          python3 - <<'PYVERIFY'
          import json,pathlib,subprocess,urllib.parse
          r=pathlib.Path('candidate-proof')
          old=json.loads((r/'package.json').read_text());new=json.loads(pathlib.Path('proof/package.json').read_text())
          assert old['source']=='f3a29c612ca5cdeea79a513d00d781c70f3192c3'
          for name in ['hero-parity.json','clean-install.json','bootstrap.json','native-lifecycle.json','progress-navigation.json']:
              assert json.loads((r/name).read_text())['status']=='PASS'
          hero=json.loads((r/'hero-parity.json').read_text());assert hero['cases']==16 and hero['other_tool_hero']=='BYTE_IDENTICAL'
          after=json.loads((r/'after-results.json').read_text());assert after['status']=='PASS' and len(after['rows'])==6
          for lang in ['en','zh']:
              for width in [1440,1024]:assert (r/f'player-{lang}-{width}.png').stat().st_size>500
              assert (r/f'player-{lang}-playing.png').stat().st_size>500
          assert json.loads((r/'before-public.json').read_text())['pages']==json.loads((r/'after-public.json').read_text())['pages']
          for k in ['status','version','tree','sha256','bytes','files']: assert old[k]==new[k],k
          assert new['sha256']=='f0adeeca0e19d24d8299a587be5b63bbb13efc23b6d9c50d137a1b2a924717bb' and new['bytes']==2020228
          coverage=json.loads(pathlib.Path('control/lanes/s01-theme213-player-20261028/release-authority.json').read_text())
          assert set(coverage['required'])=={'TESTING','GIT','UA_UI','SEO','SECURITY','INSTALL','UPGRADE','DATA_SCHEMA','PERFORMANCE'}
          assert coverage['source']=='f3a29c612ca5cdeea79a513d00d781c70f3192c3' and coverage['tree']=='83d7bc4fc0d69b05c2e2d09cb84280e879216a86'
          assert coverage['owner_preview_runtime']=='N_A'
          assert coverage['release_mode']=='PROJECT_PREVIEW_N_A'
          assert coverage['owner_real_use']=='POST_PRODUCTION_REQUIRED'
          assert coverage['production_auto_apply'] is False
          for item in coverage['required'].values():
              assert item['sha'] and item['acceptance']
              endpoint='repos/llhzx2018/gov-doc/contents/'+urllib.parse.quote(item['path'],safe='/')+'?ref=main'
              live=json.loads(subprocess.check_output(['gh','api',endpoint]))
              assert live['sha']==item['sha'],item['path']
              item['evidence_status']='PASS_EXACT_CANDIDATE_MACHINE'
          coverage['candidate_status']='PASS_EXACT_CANDIDATE_MACHINE'
          coverage['candidate_run']='40542771859'
          coverage['merged_source']='156f385b9753bc85a0064f0b4a3cd65f6fb59e89'
          coverage['formal_release_gate']='PASS'
          coverage['production_effect']='NOT_PROVEN_POST_MANUAL_UPGRADE_READBACK_REQUIRED'
          pathlib.Path('proof/public-authority-coverage.json').write_text(json.dumps(coverage,ensure_ascii=False,indent=2))
          print('MERGED_TREE_EQUALS_TESTED_TREE_AND_EXACT_PACKAGE_PASS')
          PYVERIFY
      - name: Publish only the exact verified package
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.35.213 --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create v1.35.213 provider/vf-tools-theme_V1.35.213.zip --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Theme V1.35.213' --notes '播放器页参考Bitmovin Test Your Stream的商业测试工作区层级：链接输入与媒体优先，宽屏历史收藏辅助栏，空历史不留空栏，专业模式与证据保持全宽；弱化重复引导、绿色装饰线及历史按钮视觉竞争，统一下方说明与FAQ层级。保留全部Provider操作、自定义文案、播放与本地存储及SEO。双语1440/1024、五条历史与收藏、重命名/删除/刷新保留/导出、错误恢复、真实内置示例播放、邻近页面保持、原生211升级回退重复安装与数据保护均通过；476运行文件，正式ZIP远端字节一致。手机暂缓，Production仍由Owner手工升级并最终验收。' --latest
          fi
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/v1.35.213 --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh release view v1.35.213 --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - name: Authenticated remote ZIP byte comparison
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download v1.35.213 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.213.zip --dir remote
          cmp provider/vf-tools-theme_V1.35.213.zip remote/vf-tools-theme_V1.35.213.zip
          echo 'f0adeeca0e19d24d8299a587be5b63bbb13efc23b6d9c50d137a1b2a924717bb  remote/vf-tools-theme_V1.35.213.zip' | sha256sum -c
          test "$(stat -c %s remote/vf-tools-theme_V1.35.213.zip)" = 2020228
          gh release view v1.35.213 --repo "$TARGET_REPO" --json url,publishedAt,tagName > proof/formal-release.json
          echo FORMAL_RELEASE_EXACT_REMOTE_ASSET_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-home-formal-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target provider remote candidate-proof
