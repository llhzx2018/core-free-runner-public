name: P05 V1.2.3 Production Read-only Probe

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p05-v123-production-readonly-probe-20260902.yml']

permissions:
  contents: read

jobs:
  probe:
    if: github.event_name == 'pull_request' && github.head_ref == 'tmp/p05-v123-production-readonly-probe-20260902'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read-only HTTPS and health probe
        run: |
          set -Eeuo pipefail
          BASE='https://seo.kewaro.com'
          curl --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 30 -sS -D /tmp/root.headers -o /tmp/root.body "$BASE/"
          root_status="$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END {print code}' /tmp/root.headers)"
          test "$root_status" = '200'
          curl --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 30 -sS -D /tmp/health.headers -o /tmp/health.json "$BASE/api/health"
          health_status="$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END {print code}' /tmp/health.headers)"
          test "$health_status" = '200'
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/health.json'))
          assert x.get('ok') is True
          assert x.get('service')=='vf-seo'
          assert isinstance(x.get('version'),str) and x['version']
          assert str(x.get('schema'))=='1'
          assert x.get('runtime')=='php'
          print('P05_PRODUCTION_HEALTH=PASS')
          print('P05_PRODUCTION_VERSION='+x['version'])
          print('P05_PRODUCTION_SCHEMA='+str(x['schema']))
          print('P05_PRODUCTION_RUNTIME='+x['runtime'])
          print('P05_PRODUCTION_DATABASE_PROVIDER='+str(x.get('databaseProvider')))
          print('P05_PRODUCTION_DATABASE='+str(x.get('database')))
          print('P05_PRODUCTION_PROCESS='+str(x.get('process')))
          PY
          echo "P05_PRODUCTION_ROOT_HTTP=$root_status"
          echo "P05_PRODUCTION_HEALTH_HTTP=$health_status"
          echo 'P05_PRODUCTION_WRITE=0'
