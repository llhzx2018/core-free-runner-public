name: TEMP skill-book V4.8 Candidate Release

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-skill-book-v48-candidate-release.yml'

permissions:
  contents: read

concurrency:
  group: temp-skill-book-v48-candidate-release
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: llhzx2018/gov-doc
  SOURCE_COMMIT: 'd5d809172f23b31212cf6b66551f775b2e07e35f'
  SOURCE_PATH: skills/skill-book/V4.8
  TARGET_VERSION: '4.8'
  SOURCE_CURRENT: '3.5'
  TAG: skill-book-v4.8-candidate-20260827
  ASSET_NAME: skill-book_V4.8_CANDIDATE_20260827.zip
  SHA_NAME: skill-book_V4.8_CANDIDATE_20260827.zip.sha256
  EXPECTED_LOCAL_SHA256: 'df933b799e7e56a662f055abfe9825d15a4470c86cf9b41a34e30cbb98bf4c4b'
  EXPECTED_LOCAL_BYTES: '156008'

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Registered release capabilities
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN" || { echo 'VF_PRIVATE_READ_TOKEN_MISSING' >&2; exit 78; }
          test -n "$RELEASE_TOKEN" || { echo 'VF_RELEASE_WRITE_TOKEN_MISSING' >&2; exit 78; }
          echo 'REGISTERED_RELEASE_CAPABILITIES=PASS'

      - name: Checkout exact GOV-DOC Candidate source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_COMMIT }}
          token: ${{ env.READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: source

      - name: Exact source preflight and tests
        shell: bash
        working-directory: source/skills/skill-book/V4.8
        run: |
          set -Eeuo pipefail
          test "$(git -C ../../.. rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(tr -d '\r\n' < VERSION)" = "$TARGET_VERSION"
          jq -e '.version=="4.8" and .status=="CANDIDATE_NOT_CURRENT" and .source_current_skill=="3.5" and .validation.python_unit_tests=="38/38 PASS (modular execution)" and .current_promotion=="NOT_AUTHORIZED"' MANIFEST.json >/dev/null
          grep -Fq 'Runtime Hard Entry Protocol' SKILL.md
          grep -Fq 'runtime_entry_receipt.json' SKILL.md
          grep -Fq 'runtime_acceptance_audit.py' SKILL.md
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/v48-tests.txt"
          grep -Eq 'Ran 38 tests' "$RUNNER_TEMP/v48-tests.txt"
          grep -Eq '^OK$' "$RUNNER_TEMP/v48-tests.txt"
          python -m compileall -q scripts tests
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          echo 'EXACT_SOURCE_AND_38_TESTS=PASS'

      - name: Build portable deterministic Candidate ZIP twice
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$RUNNER_TEMP/v48-build-a" "$RUNNER_TEMP/v48-build-b" "$RUNNER_TEMP/v48-release"
          mkdir -p "$RUNNER_TEMP/v48-build-a" "$RUNNER_TEMP/v48-build-b" "$RUNNER_TEMP/v48-release"
          SOURCE_FILE_COUNT="$(find "source/$SOURCE_PATH" -type f ! -path '*/__pycache__/*' ! -name '*.pyc' | wc -l | tr -d ' ')"
          test "$SOURCE_FILE_COUNT" = '41'
          for out in "$RUNNER_TEMP/v48-build-a/$ASSET_NAME" "$RUNNER_TEMP/v48-build-b/$ASSET_NAME"; do
            SRC="source/$SOURCE_PATH" OUT="$out" python3 - <<'PY'
          from pathlib import Path
          import os, zipfile
          src=Path(os.environ['SRC']); out=Path(os.environ['OUT'])
          prefix='skill-book_V4.8_CANDIDATE'
          files=sorted(p for p in src.rglob('*') if p.is_file() and '__pycache__' not in p.parts and p.suffix!='.pyc')
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_STORED,strict_timestamps=True) as z:
              for p in files:
                  rel=p.relative_to(src).as_posix()
                  info=zipfile.ZipInfo(f'{prefix}/{rel}',date_time=(1980,1,1,0,0,0))
                  info.compress_type=zipfile.ZIP_STORED
                  info.create_system=3
                  info.external_attr=(0o100644<<16)
                  z.writestr(info,p.read_bytes())
          PY
          done
          cmp "$RUNNER_TEMP/v48-build-a/$ASSET_NAME" "$RUNNER_TEMP/v48-build-b/$ASSET_NAME"
          cp "$RUNNER_TEMP/v48-build-a/$ASSET_NAME" "$RUNNER_TEMP/v48-release/$ASSET_NAME"
          ASSET="$RUNNER_TEMP/v48-release/$ASSET_NAME" SOURCE_FILE_COUNT="$SOURCE_FILE_COUNT" SRC_ROOT="source/$SOURCE_PATH" python3 - <<'PY'
          from pathlib import Path
          import json, os, zipfile
          p=Path(os.environ['ASSET']); prefix='skill-book_V4.8_CANDIDATE/'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              names=z.namelist()
              assert len(names)==len(set(names))
              assert not any(n.startswith('/') or '..' in Path(n).parts for n in names)
              assert not any('__pycache__' in n or n.endswith('.pyc') for n in names)
              assert all(i.compress_type==zipfile.ZIP_STORED for i in z.infolist())
              assert len([n for n in names if not n.endswith('/')])==int(os.environ['SOURCE_FILE_COUNT'])
              manifest=json.loads((Path(os.environ['SRC_ROOT'])/'MANIFEST.json').read_text(encoding='utf-8'))
              for item in manifest.get('files',[]):
                  assert names.count(prefix+item['path'])==1, item['path']
          print('ZIP_STRUCTURE_MANIFEST_PATHS=PASS')
          PY
          ASSET_BYTES="$(stat -c%s "$RUNNER_TEMP/v48-release/$ASSET_NAME")"
          ASSET_SHA256="$(sha256sum "$RUNNER_TEMP/v48-release/$ASSET_NAME" | awk '{print $1}')"
          echo "RUNNER_ASSET_BYTES=$ASSET_BYTES"
          echo "RUNNER_ASSET_SHA256=$ASSET_SHA256"
          test "$ASSET_BYTES" = "$EXPECTED_LOCAL_BYTES"
          test "$ASSET_SHA256" = "$EXPECTED_LOCAL_SHA256"
          printf '%s  %s\n' "$ASSET_SHA256" "$ASSET_NAME" > "$RUNNER_TEMP/v48-release/$SHA_NAME"
          {
            echo "ASSET_BYTES=$ASSET_BYTES"
            echo "ASSET_SHA256=$ASSET_SHA256"
            echo "SOURCE_FILE_COUNT=$SOURCE_FILE_COUNT"
          } >> "$GITHUB_ENV"
          echo 'PORTABLE_DETERMINISTIC_BUILD_TWICE_AND_LOCAL_IDENTITY=PASS'

      - name: Create exact Candidate tag and prerelease
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C source config user.name 'VF Release Automation'
          git -C source config user.email 'release@kewaro.com'
          if git -C source show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git -C source rev-list -n1 "$TAG")" = "$SOURCE_COMMIT"
          else
            git -C source tag -a "$TAG" "$SOURCE_COMMIT" -m 'skill-book V4.8 Candidate'
            git -C source remote set-url origin "https://x-access-token:${RELEASE_TOKEN}@github.com/${SOURCE_REPOSITORY}.git"
            git -C source push origin "refs/tags/$TAG"
          fi
          cat > "$RUNNER_TEMP/v48-release/release-notes.md" <<EOF
          skill-book V4.8 Candidate / NOT CURRENT.

          Source authority: ${SOURCE_REPOSITORY}@${SOURCE_COMMIT}
          Source Current remains: skill-book V${SOURCE_CURRENT}
          Unit tests: 38/38 PASS (modular execution)
          Runtime truth enforcement: Runtime Entry Receipt, External Verifier Authority, normalized Manifest keys, runtime path discovery, SEALED baseline truth and false-green final decision detection.
          Portable deterministic ZIP: ZIP_STORED + fixed metadata.
          Real Reader Forward Evidence: NOT_RUN
          Backend V4.8 Runtime Forward Test: NOT_RUN
          Current Promotion: NOT_AUTHORIZED
          EOF
          if gh release view "$TAG" --repo "$SOURCE_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/v48-release/$ASSET_NAME#$ASSET_NAME" "$RUNNER_TEMP/v48-release/$SHA_NAME#$SHA_NAME" --repo "$SOURCE_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$RUNNER_TEMP/v48-release/$ASSET_NAME#$ASSET_NAME" "$RUNNER_TEMP/v48-release/$SHA_NAME#$SHA_NAME" --repo "$SOURCE_REPOSITORY" --title 'skill-book V4.8 Candidate' --notes-file "$RUNNER_TEMP/v48-release/release-notes.md" --prerelease --verify-tag
          fi
          echo 'V48_CANDIDATE_PRERELEASE_CREATED=PASS'

      - name: Remote Release Asset readback and verification
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$RUNNER_TEMP/v48-readback" && mkdir -p "$RUNNER_TEMP/v48-readback"
          gh release download "$TAG" --repo "$SOURCE_REPOSITORY" --pattern "$ASSET_NAME" --pattern "$SHA_NAME" --dir "$RUNNER_TEMP/v48-readback"
          test "$(stat -c%s "$RUNNER_TEMP/v48-readback/$ASSET_NAME")" = "$EXPECTED_LOCAL_BYTES"
          test "$(sha256sum "$RUNNER_TEMP/v48-readback/$ASSET_NAME" | awk '{print $1}')" = "$EXPECTED_LOCAL_SHA256"
          grep -Fq "$EXPECTED_LOCAL_SHA256  $ASSET_NAME" "$RUNNER_TEMP/v48-readback/$SHA_NAME"
          ASSET="$RUNNER_TEMP/v48-readback/$ASSET_NAME" python3 - <<'PY'
          from pathlib import Path
          import os, zipfile
          p=Path(os.environ['ASSET'])
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              names=z.namelist()
              assert len(names)==len(set(names))
              assert not any(n.startswith('/') or '..' in Path(n).parts for n in names)
              assert not any('__pycache__' in n or n.endswith('.pyc') for n in names)
              assert all(i.compress_type==zipfile.ZIP_STORED for i in z.infolist())
          print('REMOTE_ASSET_SHA_CRC_PATHS=PASS')
          PY

      - name: Publish public-safe evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          release_json="$(gh api "repos/$SOURCE_REPOSITORY/releases/tags/$TAG")"
          RELEASE_ID="$(jq -r '.id' <<<"$release_json")"
          ASSET_ID="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.id' <<<"$release_json")"
          SHA_ASSET_ID="$(jq -r --arg n "$SHA_NAME" '.assets[]|select(.name==$n)|.id' <<<"$release_json")"
          REMOTE_DIGEST="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.digest' <<<"$release_json")"
          test "$REMOTE_DIGEST" = "sha256:$EXPECTED_LOCAL_SHA256"
          cat > "$RUNNER_TEMP/V48_RELEASE_EVIDENCE.txt" <<EOF
          SKILL=skill-book
          VERSION=4.8
          STATUS=CANDIDATE_NOT_CURRENT
          SOURCE_COMMIT=$SOURCE_COMMIT
          SOURCE_CURRENT=$SOURCE_CURRENT
          UNIT_TESTS=38/38_PASS_MODULAR
          SOURCE_FILE_COUNT=$SOURCE_FILE_COUNT
          RELEASE_TAG=$TAG
          RELEASE_ID=$RELEASE_ID
          ASSET_NAME=$ASSET_NAME
          ASSET_ID=$ASSET_ID
          ASSET_BYTES=$ASSET_BYTES
          ASSET_SHA256=$ASSET_SHA256
          SHA_ASSET_ID=$SHA_ASSET_ID
          LOCAL_REMOTE_IDENTITY=MATCH
          REMOTE_DOWNLOAD_READBACK=PASS
          ZIP_CRC=PASS
          UNSAFE_PATH=0
          DUPLICATE_PATH=0
          PYCACHE_PYC=0
          PRODUCTION_WRITE=0
          CURRENT_PROMOTION=NOT_AUTHORIZED
          EOF
          cat "$RUNNER_TEMP/V48_RELEASE_EVIDENCE.txt"

      - name: Upload public-safe release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SKILL-BOOK-V4.8-CANDIDATE-RELEASE-EVIDENCE
          path: ${{ runner.temp }}/V48_RELEASE_EVIDENCE.txt
          if-no-files-found: error
          retention-days: 30
