name: P06 PR5 Exact Source Gate 3ba10da

on:
  push:
    branches:
      - run/p06-backoffice-3ba10da
    paths:
      - .github/workflows/p06-backoffice-3ba10da-gate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p06-backoffice-3ba10da
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_REPO: llhzx2018/vf-press
      SOURCE_SHA: 3ba10da25103c7282498ed1198448cf2d686e4f8
      SOURCE_BRANCH: runtime/p06-ops-console
      EXPECTED_VERSION: 0.1.6
      EXPECTED_SCHEMA: '2'
    steps:
      - name: Checkout runner control
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          path: runner-control

      - name: Require registered private read capability
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo PRIVATE_READ_CAPABILITY=PASS

      - name: Checkout exact private source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Prepare PHP SQLite runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 php-mbstring php-zip php-curl sqlite3 composer >/dev/null
          php -v
          composer --version
          echo MACHINE_RUNTIME=PASS

      - name: Exact source identity
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "$EXPECTED_VERSION"
          test "$(jq -r .version VF_PROJECT.json)" = "$EXPECTED_VERSION"
          test "$(jq -r .schema VF_PROJECT.json)" = "$EXPECTED_SCHEMA"
          echo SOURCE_IDENTITY=PASS
          echo VERSION=$EXPECTED_VERSION
          echo SCHEMA=$EXPECTED_SCHEMA

      - name: Composer and PHP syntax
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          composer validate --strict
          composer dump-autoload --no-dev --optimize --no-interaction
          find src bin public -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          echo COMPOSER_VALIDATE=PASS
          echo PHP_SYNTAX=PASS

      - name: Fresh migration and formal regression contract
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf storage storage-restore-*
          php bin/migrate.php | grep -Fq MIGRATION_PASS
          php bin/self-test.php | grep -Fq FOUNDATION_SELF_TEST_PASS
          php bin/security-self-test.php | grep -Fq SECURITY_SELF_TEST_PASS
          php bin/research-self-test.php | grep -Fq RESEARCH_SELF_TEST_PASS
          php bin/publication-self-test.php | grep -Fq PUBLICATION_MANUSCRIPT_SELF_TEST=PASS
          php bin/reader-self-test.php | grep -Fq PUBLISHER_READER_SELF_TEST=PASS
          php bin/edition-self-test.php | grep -Fq EDITION_SELF_TEST=PASS
          php bin/living-publishing-self-test.php | grep -Fq LIVING_PUBLISHING_SELF_TEST=PASS
          php bin/operations-self-test.php | grep -Fq OPERATIONS_SELF_TEST=PASS
          php bin/operations-ui-self-test.php | grep -Fq OPERATIONS_UI_SELF_TEST=PASS
          php bin/backoffice-self-test.php | grep -Fq 'Backoffice self-test PASS'
          php bin/backoffice-catalog-self-test.php | tee /tmp/p06-backoffice-catalog
          grep -Fq BACKOFFICE_CATALOG_SELF_TEST=PASS /tmp/p06-backoffice-catalog
          grep -Fq OBJECT_ENTRY=OVERVIEW /tmp/p06-backoffice-catalog
          grep -Fq QUALITY_ENTRY=OBJECT_LEVEL /tmp/p06-backoffice-catalog
          grep -Fq PUBLISHING_ENTRY=OBJECT_LEVEL /tmp/p06-backoffice-catalog
          php bin/public-asset-self-test.php | tee /tmp/p06-public-assets
          grep -Fq PUBLIC_ASSET_HTTP_SELF_TEST=PASS /tmp/p06-public-assets
          grep -Fq MAINTENANCE_CSS_HTTP_200=PASS /tmp/p06-public-assets
          php bin/job-self-test.php | grep -Fq JOB_QUEUE_SELF_TEST=PASS
          php bin/update-self-test.php | grep -Fq UPDATE_SELF_TEST=PASS
          php bin/migrate.php | grep -Fq MIGRATION_PASS
          php -r '$pdo=new PDO("sqlite:storage/app.db"); if($pdo->query("PRAGMA integrity_check")->fetchColumn()!=="ok") exit(1); if((int)$pdo->query("SELECT MAX(version) FROM schema_migrations")->fetchColumn()!==2) exit(2); echo "SQLITE_INTEGRITY=PASS\nSCHEMA_2=PASS\n";'
          echo FRESH_MIGRATION=PASS
          echo FORMAL_REGRESSION_CONTRACT=PASS

      - name: Backoffice shell and catalog contracts
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'class BackofficeShell' src/Http/Studio/BackofficeShell.php
          grep -Fq 'href="/studio/jobs"' src/Http/Studio/BackofficeShell.php
          grep -Fq 'href="/studio/recovery"' src/Http/Studio/BackofficeShell.php
          grep -Fq 'href="/studio/updates"' src/Http/Studio/BackofficeShell.php
          grep -Fq 'href="/studio/settings"' src/Http/Studio/BackofficeShell.php
          ! grep -Fq '/studio/operations#jobs' src/Http/Studio/BackofficeShell.php
          grep -Fq 'class BackofficeCatalogController' src/Http/Studio/BackofficeCatalogController.php
          grep -Fq "'/studio/research' => \$this->renderResearch()" src/Http/Studio/BackofficeCatalogController.php
          grep -Fq "'/studio/publications' => \$this->renderPublications()" src/Http/Studio/BackofficeCatalogController.php
          grep -Fq "'/studio/publishing' => \$this->renderPublishing()" src/Http/Studio/BackofficeCatalogController.php
          echo BACKOFFICE_SHELL=PASS
          echo CATALOG=PASS

      - name: Object overview contracts
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'class BackofficeObjectOverviewController' src/Http/Studio/BackofficeObjectOverviewController.php
          grep -Fq '研究对象总览' src/Http/Studio/BackofficeObjectOverviewController.php
          grep -Fq '进入研究 Studio' src/Http/Studio/BackofficeObjectOverviewController.php
          grep -Fq '出版物总览' src/Http/Studio/BackofficeObjectOverviewController.php
          grep -Fq '进入母稿 Studio' src/Http/Studio/BackofficeObjectOverviewController.php
          grep -Fq '/quality' src/Http/Studio/BackofficeObjectOverviewController.php
          grep -Fq '/publishing' src/Http/Studio/BackofficeObjectOverviewController.php
          echo RESEARCH_OVERVIEW=PASS
          echo BOOK_OVERVIEW=PASS

      - name: Quality and publishing desk contracts
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'class QualityController' src/Http/Studio/QualityController.php
          grep -Fq '/quality/(ai/review|ai/accept)' src/Http/Studio/QualityController.php
          grep -Fq '不会直接覆盖 Canonical Markdown' src/Http/Studio/QualityController.php
          grep -Fq 'class PublishingDeskController' src/Http/Studio/PublishingDeskController.php
          grep -Fq 'revision/create|candidate/create|edition/publish|export/build|distribution/update' src/Http/Studio/PublishingDeskController.php
          ! grep -Fq 'ai/review' src/Http/Studio/PublishingDeskController.php
          ! grep -Fq 'AI 编辑审校' src/Http/Studio/PublishingDeskController.php
          grep -Fq 'QualityController' public/index.php
          grep -Fq 'PublishingDeskController' public/index.php
          grep -Fq "'/studio/publications/'.\$legacyPublishing[1].'/publishing'" public/index.php
          echo QUALITY=PASS
          echo PUBLISHING_DESK=PASS

      - name: Maintenance and HTTP asset contracts
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'class MaintenanceController' src/Http/Studio/MaintenanceController.php
          grep -Fq '/studio/jobs' public/index.php
          grep -Fq '/studio/recovery' public/index.php
          grep -Fq '/studio/updates' public/index.php
          grep -Fq '/studio/settings' public/index.php
          grep -Fq '/runtime-asset/backoffice' public/index.php
          grep -Fq '/runtime-asset/maintenance' public/index.php
          echo MAINTENANCE=PASS
          echo HTTP_ASSET_CONTRACT=PASS

      - name: Product repository cleanliness
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf storage storage-restore-*
          STATUS="$(git status --short --untracked-files=all)"
          printf '%s\n' "$STATUS"
          test -z "$STATUS"
          echo PRODUCT_REPOSITORY_CLEAN=PASS
          echo PRIVATE_SOURCE_PERSISTED=NO

      - name: Persist public-safe evidence
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -Eeuo pipefail
          [ "$JOB_STATUS" = success ] && RESULT=PASS || RESULT=FAIL
          cd runner-control
          git pull --rebase origin run/p06-backoffice-3ba10da
          mkdir -p evidence/p06
          cat > evidence/p06/P06_PR5_3BA10DA_EXACT_GATE_LATEST.txt <<EOF
          P06_PR5_EXACT_SOURCE_GATE=$RESULT
          SOURCE_REPOSITORY=$SOURCE_REPO
          SOURCE_BRANCH=$SOURCE_BRANCH
          SOURCE_SHA=$SOURCE_SHA
          VERSION=$EXPECTED_VERSION
          SCHEMA=$EXPECTED_SCHEMA
          RUN_ID=$GITHUB_RUN_ID
          CHECKS=PHP_SYNTAX,FRESH_MIGRATION,BACKOFFICE_SHELL,CATALOG,RESEARCH_OVERVIEW,BOOK_OVERVIEW,QUALITY,PUBLISHING_DESK,MAINTENANCE,HTTP_ASSET,BACKOFFICE_SELF_TESTS,FORMAL_REGRESSION_CONTRACT,SQLITE_INTEGRITY,CLEANLINESS
          FORMAL_RELEASE=NO
          PRODUCTION_WRITE=NO
          MAIN_WRITE=NO
          PRIVATE_SOURCE_PERSISTED=NO
          EOF
          git config user.name 'VF Public Runner'
          git config user.email 'vf-public-runner@users.noreply.github.com'
          git add evidence/p06/P06_PR5_3BA10DA_EXACT_GATE_LATEST.txt
          git commit -m "evidence(P06): PR5 exact gate $RESULT run $GITHUB_RUN_ID" || true
          git pull --rebase origin run/p06-backoffice-3ba10da
          git push origin HEAD:run/p06-backoffice-3ba10da
          test "$RESULT" = PASS
