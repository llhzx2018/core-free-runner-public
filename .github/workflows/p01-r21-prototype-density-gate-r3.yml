name: P01 R21 Authenticated Density Gate R3

on:
  pull_request:
    paths:
      - '.github/workflows/p01-r21-prototype-density-gate-r3.yml'

permissions:
  contents: read

jobs:
  gate:
    if: github.head_ref == 'temp/p01-r21-prototype-density-gate-20260910'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      BASE_SHA: 4a5d2a4ddccdfb0e3ea70d62af83c7a664563fb5
      CANDIDATE_SHA: 7a7a3a2d6c63002899ff8815ea2af685cbcc2955
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}

    steps:
      - name: Exact candidate authority
        run: |
          set -Eeuo pipefail
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/main" --jq '.object.sha')" = "$BASE_SHA"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/work/p01-r21-prototype-density-20260910" --jq '.object.sha')" = "$CANDIDATE_SHA"
          echo P01_R21_R3_AUTHORITY=PASS

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.CANDIDATE_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: vf-start

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd
          coverage: none

      - name: Fresh install and authenticated session
        working-directory: vf-start
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-r21-runtime
          cp -a src /tmp/p01-r21-runtime
          cd /tmp/p01-r21-runtime
          php -S 127.0.0.1:18121 -t . >/tmp/p01-r21-server.log 2>&1 &
          echo $! >/tmp/p01-r21-server.pid
          for i in $(seq 1 30); do curl -fsS -c /tmp/p01-r21.cookies -b /tmp/p01-r21.cookies http://127.0.0.1:18121/setup.php -o /tmp/p01-r21-setup.html && break; sleep 1; done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-r21-setup.html',encoding='utf-8').read(); m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s); assert m; print(m.group(1))
          PY
          )
          PASS="Gate${GITHUB_RUN_ID}R21x"
          curl -fsS -L -c /tmp/p01-r21.cookies -b /tmp/p01-r21.cookies -X POST http://127.0.0.1:18121/setup.php --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=VF Start R21 Gate' --data-urlencode "admin_password=$PASS" --data-urlencode "admin_password_confirm=$PASS" -o /tmp/p01-r21-post.html
          test -f app/.runtime.php
          php cli/verify.php | grep -Fx 'VERIFY_PASS=YES'
          test -s /tmp/p01-r21.cookies
          echo P01_R21_R3_INSTALL_SESSION=PASS

      - name: Authenticated Chromium geometry
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-r21-pw && cd /tmp/p01-r21-pw
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > verify.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const base='http://127.0.0.1:18121/';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1291,height:797}});
          const raw=fs.readFileSync('/tmp/p01-r21.cookies','utf8').split(/\r?\n/);
          const cookies=[];
          for(let line of raw){if(!line)continue;if(line.startsWith('#HttpOnly_'))line=line.slice('#HttpOnly_'.length);else if(line.startsWith('#'))continue;const p=line.split('\t');if(p.length<7)continue;cookies.push({name:p[5],value:p[6],url:base});}
          if(!cookies.length)throw new Error('No authenticated cookies from setup');
          await context.addCookies(cookies);
          const page=await context.newPage();
          const overflow=()=>page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
          await page.goto(base+'start.php',{waitUntil:'networkidle'});
          const nav=await page.evaluate(()=>{const s=document.querySelector('.vf-app-sidebar'),stage=document.querySelector('.vf-app-stage');const r=document.createElement('article');r.className='vf-asset-row';r.innerHTML='<span class="vf-asset-select"></span><span class="vf-asset-icon">A</span><span class="vf-asset-copy"><strong>Readable title</strong><small>domain · category</small></span>';document.querySelector('.vf-shell-main').append(r);return{body:document.body.className,side:getComputedStyle(s).display,sw:s.getBoundingClientRect().width,left:stage.getBoundingClientRect().left,rh:r.getBoundingClientRect().height,ts:parseFloat(getComputedStyle(r.querySelector('strong')).fontSize),ms:parseFloat(getComputedStyle(r.querySelector('small')).fontSize)}});
          if(nav.side==='none'||nav.sw<200||nav.left<200||nav.rh<54||nav.ts<13||nav.ms<11||await overflow()>1)throw new Error('Navigation '+JSON.stringify(nav));
          const cases=[
            ['watch.php','vf-watch-library-grid',6,'<article class="vf-watch-library-card"><div class="vf-watch-copy"><strong>Movie</strong><small>2026</small></div></article>','.vf-watch-copy strong',13],
            ['topics.php','vf-topic-library-grid',4,'<article class="vf-topic-library-card"><a class="vf-topic-library-cover"></a><div class="vf-topic-library-body"><h3>Topic</h3></div></article>','.vf-topic-library-body h3',14],
            ['courses.php','vf-course-grid',2,'<article class="vf-course-card"><a class="vf-course-cover"><span class="vf-course-cover-art"></span></a><div class="vf-course-card-body"><h3>Course</h3></div></article>','.vf-course-card h3',14],
            ['channels.php','vf-channel-grid',3,'<article class="vf-channel-card"><span class="vf-channel-avatar"></span><div class="vf-channel-copy"><h3>Channel</h3></div></article>','.vf-channel-copy h3',13.5],
            ['projects.php','vf-project-action-grid',2,'<article class="vf-project-action-card"><h3>Project</h3></article>','.vf-project-action-card h3',13.5],
            ['tools.php','vf-tool-scene-grid',4,'<a class="vf-tool-scene-card"><span class="vf-tool-scene-copy"><strong>Task scene</strong></span></a>','.vf-tool-scene-copy strong',13.5],
            ['software.php','vf-software-common-grid',6,'<a class="vf-software-common-card"><strong>App</strong></a>','.vf-software-common-card strong',12]
          ];
          const out={navigation:nav,subjects:{}};
          for(const [path,klass,want,html,sel,min] of cases){await page.goto(base+path,{waitUntil:'networkidle'});const r=await page.evaluate(({klass,html,sel})=>{const side=document.querySelector('.vf-app-sidebar'),stage=document.querySelector('.vf-app-stage'),main=document.querySelector('.vf-shell-main');const grid=document.createElement('div');grid.className=klass;grid.innerHTML=html.repeat(8);main.append(grid);const cs=getComputedStyle(grid),text=grid.querySelector(sel);return{body:document.body.className,side:getComputedStyle(side).display,left:stage.getBoundingClientRect().left,mw:main.getBoundingClientRect().width,display:cs.display,cols:cs.gridTemplateColumns.split(' ').filter(Boolean).length,fs:text?parseFloat(getComputedStyle(text).fontSize):0}}, {klass,html,sel});if(r.side!=='none'||Math.abs(r.left)>1||r.mw<1180||r.display!=='grid'||r.cols!==want||r.fs<min||await overflow()>1)throw new Error(path+' '+JSON.stringify(r));out.subjects[path]=r;}
          const mobile=await browser.newContext({viewport:{width:390,height:844}});await mobile.addCookies(cookies);const m=await mobile.newPage();for(const path of ['start.php','watch.php','topics.php','courses.php','channels.php','projects.php','tools.php','software.php']){await m.goto(base+path,{waitUntil:'networkidle'});const d=await m.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);if(d>1)throw new Error(path+' mobile overflow '+d)}
          console.log('P01_R21_AUTH_BROWSER='+JSON.stringify(out));await browser.close();
          JS
          node verify.mjs | tee /tmp/p01-r21-auth-browser
          grep -F 'P01_R21_AUTH_BROWSER=' /tmp/p01-r21-auth-browser
          echo P01_R21_AUTHENTICATED_CHROMIUM=PASS

      - name: Final verdict
        run: |
          echo P01_R21_PRODUCT_SHAPE_GATE=PASS
          echo RELEASE=false
          echo PRODUCTION=false

      - name: Cleanup
        if: always()
        run: |
          if test -f /tmp/p01-r21-server.pid; then kill "$(cat /tmp/p01-r21-server.pid)" 2>/dev/null || true; fi
          rm -rf vf-start /tmp/p01-r21-*
