name: P01 V2.21.25 Authority Closure Prep

on:
  push:
    branches:
      - task/p01-v22125-release-candidate-prep-20260828
    paths:
      - '.github/workflows/p01-v22125-authority-closure-prep-20260828.yml'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      CLOSURE_BRANCH: release/p01-v2.21.25-authority-closure-20260828
      EXPECTED_BASE: 9fa7e86307f79d9535a9d522c7a6bff7a11fd4ed
      RELEASE_SOURCE: 6bc09cd152210183972dcb3f2c361eb65a4cadab
      RELEASE_TREE: 56ab66918e394477faad175e5ce9656eb0bc7b3f
      RELEASE_ID: '378146285'
      PUBLICATION_RUN: '33120263975'
      CORE_UPDATES_COMMIT: 92e90b9ac3c4ad3b4ae92af0f76762005a283d2d
    steps:
      - name: Clone exact closure branch
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone -q --branch "$CLOSURE_BRANCH" "https://x-access-token:${WRITE_TOKEN}@github.com/${PRODUCT_REPO}.git" p01
          cd p01
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_BASE"
          test "$(git rev-parse HEAD^{tree})" = "$RELEASE_TREE"
          test "$(tr -d '\r\n' < VERSION)" = '2.21.25'
          test -z "$(git status --porcelain)"
          echo P01_AUTHORITY_CLOSURE_SOURCE_FENCE=PASS

      - name: Update release authority truth only
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p01
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('VF_PROJECT.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          assert x['production_version']=='2.21.24',x
          assert x['working_version']=='2.21.25',x
          assert x['candidate_version']=='2.21.25',x
          assert str(x['schema_version'])=='2026080902',x
          x['status']='V2.21.24 PRODUCTION / V2.21.25 FORMAL RELEASE / PRODUCTION UPGRADE REQUIRED'
          x['candidate_state']='FORMAL RELEASED / COMMON PRODUCT BASELINE V2 / PRODUCTION UPGRADE REQUIRED'
          x['current_phase']='V2.21.25 FORMAL RELEASE / PRODUCTION UPGRADE REQUIRED'
          x['current_authority']='v2.21.25@6bc09cd152210183972dcb3f2c361eb65a4cadab / Release 378146285 / main@9fa7e86307f79d9535a9d522c7a6bff7a11fd4ed tree-equivalent; Production remains owner-evidenced V2.21.24 until backend upgrade'
          x['git_governance']='V2.21.25 formal release published from exact verified source; main merge tree equivalent; no force; Production version is not advanced until owner backend upgrade is observed'
          x['current_change']={
            'change_id':'P01-V2.21.25-COMMON-BASELINE-V2-RELEASE-20260828',
            'scope':['common_product_baseline_v2_runtime','system_info','system_baseline','runtime_health','online_update','backup_restore','personal_single_admin_session_and_step_up'],
            'schema_changed':False,'migration_changed':False,'business_data_changed':False,'production_write':False,
            'source_commit':'6bc09cd152210183972dcb3f2c361eb65a4cadab',
            'main_merge_commit':'9fa7e86307f79d9535a9d522c7a6bff7a11fd4ed',
            'integration':'FORMAL RELEASE / TAG EXACT / MAIN TREE EQUIVALENT','pr':12
          }
          x['formal_release']={
            'version':'2.21.25','tag':'v2.21.25','release_id':378146285,
            'release_commit':'6bc09cd152210183972dcb3f2c361eb65a4cadab','release_tree':'56ab66918e394477faad175e5ce9656eb0bc7b3f',
            'released_at':'2026-08-27T21:54:51Z','core_updates':'PASS / TARGET 2.21.25 / FROM [2.21.24] / COMMIT 92e90b9ac3c4ad3b4ae92af0f76762005a283d2d',
            'exact_source_machine_gate_run_id':33119783158,'artifact_gate_run_id':33119946804,'publication_run_id':33120263975,
            'production_upgrade':'REQUIRED / NOT YET OWNER-EVIDENCED'
          }
          g=x.setdefault('gates',{})
          g['static_identity']='PASS / VERSION + src/VERSION.txt + VF_VERSION = 2.21.25'
          g['remote_readback']='PASS / main tree == release tree / tag v2.21.25 exact source 6bc09cd152210183972dcb3f2c361eb65a4cadab'
          g['php_syntax']='PASS / RELEASE EXACT SOURCE + FORMAL ARTIFACT'
          g['clean_full_install']='PASS / V2.21.25 / BASELINE CORE+FULL PASS / ZERO BUSINESS DATA'
          g['exact_atomic_upgrade']='PASS / 2.21.24 -> 2.21.25 / schema 2026080902'
          g['upgrade_idempotency']='PASS / already_current=true'
          g['rollback_and_interruption_recovery']='PASS / injected failure restored V2.21.24 source + DB integrity'
          g['remote_asset_sha_readback']='PASS / V2.21.25 THREE ASSETS'
          g['repository_actions_run']='PASS / MACHINE 33119783158 / ARTIFACT 33119946804 / PUBLICATION 33120263975'
          g['release']='PASS / V2.21.25 FORMAL RELEASE / ID 378146285'
          g['core_updates']='PASS / TARGET 2.21.25 / FROM [2.21.24] / 92e90b9ac3c4ad3b4ae92af0f76762005a283d2d'
          g['production']='UPGRADE REQUIRED / CURRENT OWNER-EVIDENCED V2.21.24 / DO NOT CLAIM V2.21.25 UNTIL BACKEND UPGRADE'
          g['production_functional_smoke']='PENDING / AFTER OWNER BACKEND UPGRADE'
          x['main_alignment']='PASS / main@9fa7e86307f79d9535a9d522c7a6bff7a11fd4ed tree 56ab66918e394477faad175e5ce9656eb0bc7b3f == release source tree; tag exact 6bc09cd152210183972dcb3f2c361eb65a4cadab'
          x['next_action']='OWNER BACKEND UPGRADE: V2.21.24 -> V2.21.25; then record Production readback and smoke. Do not infer Production completion from Release publication alone.'
          x['release_evidence']={
            'status':'PASS','evidence':'core-free-runner-public/task/p01-v22125-release-candidate-prep-20260828/vf-agent/results/P01-V2.21.25-FORMAL-RELEASE.json',
            'update':{'name':'VF-Start-V2.21.25-UPDATE.zip','bytes':1137813,'sha256':'9845ce644463de5fb151c2aeb024378ec405b9a845d735b92ae7430650ba2dce'},
            'full':{'name':'VF-Start-V2.21.25-FULL.zip','bytes':519638,'sha256':'4aba35b11e7522d3218bd232ee47eeb518d1c700b82ea140031a6a68f78838df'},
            'repair':{'name':'server-update-v2.21.25-repair.php','bytes':3260227,'sha256':'e35212329c9754c3dcec50d9772613c3db318f8c07227deb9a2f3ae7479af382'}
          }
          # Preserve production_observation at V2.21.24 exactly as the latest owner evidence.
          p.write_text(json.dumps(x,ensure_ascii=False,indent=2)+'\n',encoding='utf-8',newline='\n')
          PY
          cat > docs/authority/CURRENT.md <<'EOF'
          # P01 · VF Start · Current Authority Overlay

          > 更新时间：2026-08-28  
          > 状态：CURRENT / V2.21.25 FORMAL RELEASE / PRODUCTION UPGRADE REQUIRED  
          > 本文件覆盖历史 SSOT、旧矩阵与旧 Closure 中的 CURRENT 状态；历史内容只作证据。

          ## Current Truth

          ```text
          Project: P01 · VF Start
          Repository: llhzx2018/vf-start

          Formal Release: V2.21.25 / PASS
          Release Tag: v2.21.25
          Release ID: 378146285
          Release Source: 6bc09cd152210183972dcb3f2c361eb65a4cadab
          Release Tree: 56ab66918e394477faad175e5ce9656eb0bc7b3f
          Product main after release merge: 9fa7e86307f79d9535a9d522c7a6bff7a11fd4ed
          main tree == release tree: PASS
          Released At: 2026-08-27T21:54:51Z

          Prior Formal Release: V2.21.24
          Prior Release Source: 7363949d18f44652458ec7ef0f7c67c9cae1bbb4

          Schema: 2026080902 / UNCHANGED
          Browser Helper: 1.6.4 / UNCHANGED
          Common Product Baseline: VF-COMMON-PRODUCT-BASELINE@2.0 / CURRENT
          Profile: PERSONAL_SINGLE_ADMIN

          core-updates Target: 2.21.25
          from_versions: [2.21.24]
          Update Type: ATOMIC
          core-updates Commit: 92e90b9ac3c4ad3b4ae92af0f76762005a283d2d

          Production Current: V2.21.24 / OWNER-EVIDENCED
          Production V2.21.25: NOT YET PROVEN
          Production Write by Publication: NO
          Required Next Action: OWNER BACKEND UPGRADE V2.21.24 -> V2.21.25
          ```

          ## Common Product Baseline V2 Release Scope

          - 统一 System Info / System Baseline / Runtime Health / Online Update / Backup-Restore 运维语义。
          - PERSONAL_SINGLE_ADMIN 会话基线：Idle 7 天；Absolute / Cookie / Server Session Floor 30 天。
          - 高风险操作 Recent Auth / Step-up 窗口 900 秒。
          - 保留 P01 恢复工件 FILE_UPLOAD 显式例外；No Shadow Truth。
          - 正式机器闭环保持 Required DRIFT=0、UNKNOWN=0。
          - Schema 与 Browser Helper 均不机械升版。

          ## Verified Gates

          ```text
          Release Candidate Prep: PASS / Run 33119657998
          Release Exact Source Machine Gate: PASS / Run 33119783158
          Formal Artifact Gate: PASS / Run 33119946804 / Artifact 9666046878
          Publication: PASS / Run 33120263975

          Fresh FULL Install: PASS
          Common Baseline Core + Full: PASS
          Exact V2.21.24 -> V2.21.25 Atomic Upgrade: PASS
          Upgrade Idempotency: PASS
          Injected Failure Rollback: PASS
          SQLite Integrity / Foreign Keys: PASS
          Package Private/DB Exclusion: PASS
          GitHub Release Remote Asset SHA Readback: PASS
          core-updates Remote Readback: PASS
          Production Changed by Publication: NO
          ```

          ## Formal Release Artifact Identity

          ```text
          UPDATE / ATOMIC:
          VF-Start-V2.21.25-UPDATE.zip
          bytes: 1137813
          SHA-256: 9845ce644463de5fb151c2aeb024378ec405b9a845d735b92ae7430650ba2dce

          FULL:
          VF-Start-V2.21.25-FULL.zip
          bytes: 519638
          SHA-256: 4aba35b11e7522d3218bd232ee47eeb518d1c700b82ea140031a6a68f78838df

          Repair:
          server-update-v2.21.25-repair.php
          bytes: 3260227
          SHA-256: e35212329c9754c3dcec50d9772613c3db318f8c07227deb9a2f3ae7479af382
          ```

          ## Production Boundary

          ```text
          Formal Release V2.21.25: COMPLETE
          core-updates V2.21.25: COMPLETE / REMOTE READBACK PASS
          Backend Upgrade Availability: READY
          Production Upgrade V2.21.25: PENDING OWNER ACTION / NOT_PROVEN

          NEXT:
          Owner opens VF Start backend Online Update and upgrades V2.21.24 -> V2.21.25.
          After the real upgrade, record Current=Latest=V2.21.25 and perform Production smoke.
          ```

          禁止仅凭 GitHub Release 或更新通道已经发布，就把 Production 写成 V2.21.25；必须以真实后台升级后的运行证据收口。
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p=Path('CHANGELOG.md')
          t=p.read_text(encoding='utf-8')
          old='### VF Start V2.21.25 — Common Product Baseline V2 Release Candidate'
          new='### VF Start V2.21.25 — Common Product Baseline V2 Formal Release'
          assert t.count(old)==1,(old,t.count(old))
          t=t.replace(old,new,1)
          old2='- 当前为 Release Candidate；正式 Tag / Release / core-updates / Production Upgrade 需通过后续 Machine + Artifact + Publication Gate。'
          new2='- 正式 Tag / Release / core-updates 已完成并远端回读 PASS；Production Upgrade 仍需由 Owner 在后台真实执行后收口。'
          assert t.count(old2)==1,(old2,t.count(old2))
          p.write_text(t.replace(old2,new2,1),encoding='utf-8',newline='\n')
          PY

      - name: Authority closure diff gate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p01
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 3
          for f in VF_PROJECT.json docs/authority/CURRENT.md CHANGELOG.md; do printf '%s\n' "${changed[@]}" | grep -Fxq "$f"; done
          test -z "$(git diff --name-only -- src)"
          python3 -m json.tool VF_PROJECT.json >/dev/null
          grep -Fq 'V2.21.25 FORMAL RELEASE / PRODUCTION UPGRADE REQUIRED' docs/authority/CURRENT.md
          grep -Fq 'Production V2.21.25: NOT YET PROVEN' docs/authority/CURRENT.md
          grep -Fq 'Common Product Baseline V2 Formal Release' CHANGELOG.md
          git diff --check
          echo P01_AUTHORITY_CLOSURE_DIFF=PASS

      - name: Commit and push authority closure
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p01
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VF_PROJECT.json docs/authority/CURRENT.md CHANGELOG.md
          git commit -m 'docs(P01): close V2.21.25 formal release authority'
          SHA="$(git rev-parse HEAD)"
          git push origin "HEAD:$CLOSURE_BRANCH"
          test "$(git ls-remote origin "refs/heads/$CLOSURE_BRANCH" | awk '{print $1}')" = "$SHA"
          echo P01_AUTHORITY_CLOSURE_SHA="$SHA"
          echo P01_AUTHORITY_CLOSURE_PREP=PASS
