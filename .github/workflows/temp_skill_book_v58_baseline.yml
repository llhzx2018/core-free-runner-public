name: TEMP skill-book V5.8 reader-first validation

on:
  pull_request:
    paths:
      - '.github/workflows/temp_skill_book_v58_baseline.yml'

permissions:
  contents: read

jobs:
  validate-v58:
    runs-on: ubuntu-24.04
    env:
      GOV_REPO: llhzx2018/gov-doc
      TARGET_BRANCH: work/skill-book-v58-reader-first-rebalance
    steps:
      - name: Checkout V5.8 work branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.GOV_REPO }}
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: gov

      - name: Entry size and identity scan
        working-directory: gov
        run: |
          set -Eeuo pipefail
          echo "WORK_SHA=$(git rev-parse HEAD)"
          echo "SKILL_BYTES=$(wc -c < skills/skill-book/V5.8/SKILL.md)"
          echo '--- SB57 operational residual files ---'
          grep -RIl 'SB57-RUNTIME-CONTRACT-8ADCAF17' skills/skill-book/V5.8 || true
          test "$(cat skills/skill-book/V5.8/VERSION)" = '5.8'
          grep -F 'SB58-RUNTIME-CONTRACT-BF41D2E7' skills/skill-book/V5.8/SKILL.md
          grep -F "RUNTIME_CONTRACT_ID='SB58-RUNTIME-CONTRACT-BF41D2E7'" skills/skill-book/V5.8/scripts/runtime_acceptance_audit.py
          grep -F "RID='SB58-RUNTIME-CONTRACT-BF41D2E7'" skills/skill-book/V5.8/scripts/runtime_authority_fidelity_audit.py

      - name: Compile scripts and tests
        working-directory: gov
        run: |
          set -Eeuo pipefail
          python -m compileall -q skills/skill-book/V5.8/scripts skills/skill-book/V5.8/tests

      - name: Run V5.8 reader-first regression
        working-directory: gov
        run: |
          set -Eeuo pipefail
          python skills/skill-book/V5.8/tests/test_v58_reader_first_rebalance.py

      - name: Run full V5.8 suite
        working-directory: gov
        run: |
          set -Eeuo pipefail
          python -m unittest discover -s skills/skill-book/V5.8/tests -p 'test*.py' -v
