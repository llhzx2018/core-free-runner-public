name: TEMP skill-book V5.8 reader-first baseline

on:
  pull_request:
    paths:
      - '.github/workflows/temp_skill_book_v58_baseline.yml'

permissions:
  contents: read

jobs:
  prepare-v58:
    runs-on: ubuntu-24.04
    env:
      GOV_REPO: llhzx2018/gov-doc
      EXPECTED_MAIN_SHA: c261d7df99ebcbbe4ccd20fb69cd0f97e8c8f4df
      TARGET_BRANCH: work/skill-book-v58-reader-first-rebalance
    steps:
      - name: Require registered VF capabilities
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$VF_PRIVATE_READ_TOKEN"
          test -n "$VF_RELEASE_WRITE_TOKEN"
          echo 'REGISTERED_CAPABILITIES=PASS'

      - name: Checkout exact GOV-DOC main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.GOV_REPO }}
          ref: ${{ env.EXPECTED_MAIN_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: gov

      - name: Copy V5.7 source into isolated V5.8 work baseline
        working-directory: gov
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test -d skills/skill-book/V5.7
          test -d mother-specs/skill-book/V5.7
          test ! -e skills/skill-book/V5.8
          test ! -e mother-specs/skill-book/V5.8
          git checkout -b "$TARGET_BRANCH"
          cp -a skills/skill-book/V5.7 skills/skill-book/V5.8
          cp -a mother-specs/skill-book/V5.7 mother-specs/skill-book/V5.8
          printf '5.8\n' > skills/skill-book/V5.8/VERSION
          cat > mother-specs/skill-book/V5.8/V58_READER_FIRST_REBALANCE_START.md <<'EOF'
          # skill-book V5.8 · Reader-First Rebalance Start

          Development branch: `work/skill-book-v58-reader-first-rebalance`

          Trigger evidence: A1 V5.7 fresh generation produced a structurally complete but materially thin 18-chapter manuscript and exposed English engineering-oriented reader-facing packaging. Package integrity did not imply full-book quality.

          V5.8 is a rebase, not an append-only verifier release.

          Priority order:

          `BOOK FIRST -> CONTINUOUS READING -> SUBSTANCE -> LEARN/TRAIN/DO -> EVIDENCE`

          Source Current remains V5.7 until separate candidate validation and OWNER promotion.
          EOF
          git rm -f mother-specs/skill-book/V5.8/V57_INSTALLED_RUNTIME_RECONCILIATION_20260829.json || true
          git rm -f mother-specs/skill-book/V5.8/CURRENT_STATE.md || true

      - name: Guard scope, commit and push work branch
        working-directory: gov
        env:
          VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add skills/skill-book/V5.8 mother-specs/skill-book/V5.8
          mapfile -t changed < <(git diff --cached --name-only)
          test "${#changed[@]}" -gt 80
          bad=0
          for f in "${changed[@]}"; do
            case "$f" in
              skills/skill-book/V5.8/*|mother-specs/skill-book/V5.8/*) ;;
              *) echo "OUT_OF_SCOPE=$f"; bad=1 ;;
            esac
          done
          test "$bad" -eq 0
          git commit -m 'skill-book: start V5.8 reader-first rebalance'
          NEW_SHA="$(git rev-parse HEAD)"
          git push "https://x-access-token:${VF_RELEASE_WRITE_TOKEN}@github.com/${GOV_REPO}.git" "HEAD:refs/heads/${TARGET_BRANCH}"
          echo "V58_BASELINE_SHA=$NEW_SHA"

      - name: Remote work-branch readback
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GOV_REPO']; branch=os.environ['TARGET_BRANCH']; token=os.environ['VF_PRIVATE_READ_TOKEN']
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/git/ref/heads/{branch}',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=30) as r: data=json.load(r)
          sha=data['object']['sha']
          print(f'REMOTE_V58_BASELINE={sha}')
          PY
