name: TEMP skill-book V4.8 GOV-DOC Source Publish

on:
  push:
    branches:
      - release/skill-book-v48-candidate-asset-20260827
    paths:
      - '.github/workflows/temp-skill-book-v48-recover.yml'

permissions:
  contents: read

concurrency:
  group: temp-skill-book-v48-gov-source-publish
  cancel-in-progress: false

env:
  GOV_REPOSITORY: llhzx2018/gov-doc
  STAGING_REF: a68a9940dcc16a948387ceafa545a178ab0ee6e4
  EXPECTED_ZIP_BYTES: '156008'
  EXPECTED_ZIP_SHA256: df933b799e7e56a662f055abfe9825d15a4470c86cf9b41a34e30cbb98bf4c4b

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Checkout temporary runner branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Read live GOV-DOC main before write
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RELEASE_TOKEN"
          live="$(git ls-remote "https://x-access-token:${RELEASE_TOKEN}@github.com/${GOV_REPOSITORY}.git" refs/heads/main | awk '{print $1}')"
          test -n "$live"
          echo "GOV_MAIN_LIVE_BEFORE_WRITE=$live"

      - name: Publish exact V4.8 Source as source-only commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone -q "https://x-access-token:${RELEASE_TOKEN}@github.com/${GOV_REPOSITORY}.git" gov
          cd gov
          git config user.name 'VF Skill Publication'
          git config user.email 'release@kewaro.com'
          git fetch -q origin "$STAGING_REF"
          live="$(git rev-parse origin/main)"
          remote_live="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$live" = "$remote_live"
          echo "GOV_MAIN_BASE=$live"
          git checkout -q -B v48-publish origin/main
          if test -e skills/skill-book/V4.8; then
            echo 'V48_SOURCE_ALREADY_EXISTS_ON_MAIN=BLOCK'
            exit 1
          fi
          git checkout -q "$STAGING_REF" -- skills/skill-book/V4.8
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          root=Path('skills/skill-book/V4.8')
          m=json.loads((root/'MANIFEST.json').read_text(encoding='utf-8'))
          assert len(m['files']) == 39
          for x in m['files']:
              b=(root/x['path']).read_bytes()
              assert len(b)==x['bytes']
              assert hashlib.sha256(b).hexdigest()==x['sha256']
          assert hashlib.sha256((root/'SKILL.md').read_bytes()).hexdigest()=='e046eb73a400c690d524ec889fa33252c2bc9b2af1ab2aa9fe598b10e21401de'
          print('SOURCE_PRECOMMIT_IDENTITY=39/39_PASS')
          PY
          git add skills/skill-book/V4.8
          git diff --cached --check
          git commit -q -m 'skill-book: publish V4.8 Candidate source'
          source_commit="$(git rev-parse HEAD)"
          before_push="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$before_push" = "$live"
          git push -q origin HEAD:main
          echo "V48_SOURCE_COMMIT=$source_commit"
          echo 'V48_SOURCE_FAST_FORWARD_MAIN=PASS'

      - name: Remote readback VERSION SKILL MANIFEST
        shell: bash
        run: |
          set -Eeuo pipefail
          cd gov
          git fetch -q origin main
          git reset -q --hard origin/main
          test "$(cat skills/skill-book/V4.8/VERSION)" = '4.8'
          test "$(sha256sum skills/skill-book/V4.8/SKILL.md | awk '{print $1}')" = 'e046eb73a400c690d524ec889fa33252c2bc9b2af1ab2aa9fe598b10e21401de'
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          root=Path('skills/skill-book/V4.8')
          m=json.loads((root/'MANIFEST.json').read_text(encoding='utf-8'))
          assert m['version']=='4.8'
          assert len(m['files'])==39
          for x in m['files']:
              b=(root/x['path']).read_bytes()
              assert len(b)==x['bytes']
              assert hashlib.sha256(b).hexdigest()==x['sha256']
          print('V48_REMOTE_SOURCE_READBACK=PASS')
          PY
          echo "V48_REMOTE_SOURCE_HEAD=$(git rev-parse HEAD)"

      - name: Publish V4.8 Mother Overlay
        shell: bash
        run: |
          set -Eeuo pipefail
          cd gov
          source_head="$(git rev-parse HEAD)"
          git checkout -q "$STAGING_REF" -- mother-specs/skill-book/V4.8/SKILL_BOOK_V4.8_CANDIDATE_OVERLAY.md
          git add mother-specs/skill-book/V4.8/SKILL_BOOK_V4.8_CANDIDATE_OVERLAY.md
          git diff --cached --check
          git commit -q -m 'skill-book: publish V4.8 Candidate mother overlay'
          before_push="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$before_push" = "$source_head"
          git push -q origin HEAD:main
          echo "V48_MOTHER_OVERLAY_COMMIT=$(git rev-parse HEAD)"
          echo 'V48_MOTHER_OVERLAY_PUBLISHED=PASS'

      - name: Publish pending V4.8 Candidate Distribution
        shell: bash
        run: |
          set -Eeuo pipefail
          cd gov
          git fetch -q origin main
          git reset -q --hard origin/main
          overlay_head="$(git rev-parse HEAD)"
          git checkout -q "$STAGING_REF" -- distribution/skills/candidates/skill-book/V4.8
          grep -Fq 'PENDING_REMOTE_RELEASE' distribution/skills/candidates/skill-book/V4.8/README.md
          grep -Fq 'PENDING_REMOTE_RELEASE' distribution/skills/candidates/skill-book/V4.8/RUNTIME_ZIP_MIRROR_STATUS.md
          grep -Fq "$EXPECTED_ZIP_SHA256" distribution/skills/candidates/skill-book/V4.8/README.md
          grep -Fq "$EXPECTED_ZIP_BYTES" distribution/skills/candidates/skill-book/V4.8/README.md
          git add distribution/skills/candidates/skill-book/V4.8
          git diff --cached --check
          git commit -q -m 'skill-book: publish V4.8 pending candidate distribution'
          before_push="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$before_push" = "$overlay_head"
          git push -q origin HEAD:main
          echo "V48_PENDING_DISTRIBUTION_COMMIT=$(git rev-parse HEAD)"
          echo 'V48_PENDING_DISTRIBUTION_PUBLISHED=PASS'

      - name: Final GOV-DOC phase readback
        shell: bash
        run: |
          set -Eeuo pipefail
          cd gov
          git fetch -q origin main
          git reset -q --hard origin/main
          test "$(cat skills/skill-book/V4.8/VERSION)" = '4.8'
          grep -Fq 'SB48-RUNTIME-CONTRACT-9F3C6A17' skills/skill-book/V4.8/SKILL.md
          grep -Fq 'Status: `PENDING_REMOTE_RELEASE`' distribution/skills/candidates/skill-book/V4.8/RUNTIME_ZIP_MIRROR_STATUS.md
          test -f mother-specs/skill-book/V4.8/SKILL_BOOK_V4.8_CANDIDATE_OVERLAY.md
          echo "GOV_MAIN_AFTER_V48_SOURCE_PHASE=$(git rev-parse HEAD)"
          echo 'SOURCE_CURRENT=V3.5'
          echo 'LATEST_PUBLISHED_CANDIDATE_STILL=V4.7_UNTIL_REMOTE_RELEASE'
          echo 'V48_GOV_SOURCE_OVERLAY_PENDING_DISTRIBUTION=PASS'
