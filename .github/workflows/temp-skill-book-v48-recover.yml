name: TEMP skill-book V4.8 Candidate Release

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-skill-book-v48-recover.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: temp-skill-book-v48-candidate-release
  cancel-in-progress: false

env:
  GOV_REPOSITORY: llhzx2018/gov-doc
  SOURCE_COMMIT: d5d809172f23b31212cf6b66551f775b2e07e35f
  TAG: skill-book-v4.8-candidate-20260827
  RELEASE_TITLE: skill-book V4.8 Candidate
  ASSET_NAME: skill-book_V4.8_CANDIDATE_20260827.zip
  EXPECTED_BYTES: '156008'
  EXPECTED_SHA256: df933b799e7e56a662f055abfe9825d15a4470c86cf9b41a34e30cbb98bf4c4b
  ROOT_NAME: skill-book_V4.8_CANDIDATE

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      RUNNER_GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout temporary Runner PR
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Preconditions and exact Source checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN"
          test -n "$RELEASE_TOKEN"
          test -z "$(git ls-remote "https://x-access-token:${RELEASE_TOKEN}@github.com/${GOV_REPOSITORY}.git" "refs/tags/$TAG")"
          if GH_TOKEN="$RELEASE_TOKEN" gh api "repos/$GOV_REPOSITORY/releases/tags/$TAG" >/dev/null 2>&1; then
            echo 'V48_RELEASE_ALREADY_EXISTS=BLOCK'
            exit 1
          fi
          git clone -q "https://x-access-token:${PRIVATE_READ_TOKEN}@github.com/${GOV_REPOSITORY}.git" gov
          cd gov
          git checkout -q "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(cat skills/skill-book/V4.8/VERSION)" = '4.8'
          echo "V48_EXACT_SOURCE_CHECKOUT=PASS:$SOURCE_COMMIT"

      - name: Verify payload identities
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          root=Path('gov/skills/skill-book/V4.8')
          m=json.loads((root/'MANIFEST.json').read_text(encoding='utf-8'))
          assert m['version']=='4.8'
          assert len(m['files'])==39
          expected=set()
          for x in m['files']:
              p=root/x['path']; assert p.is_file(), x['path']
              b=p.read_bytes()
              assert len(b)==x['bytes'], x['path']
              assert hashlib.sha256(b).hexdigest()==x['sha256'], x['path']
              expected.add(x['path'])
          actual={p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()}-{'MANIFEST.json','SHA256SUMS.txt'}
          assert actual==expected
          skill=(root/'SKILL.md').read_bytes()
          assert len(skill)==29597
          assert hashlib.sha256(skill).hexdigest()=='e046eb73a400c690d524ec889fa33252c2bc9b2af1ab2aa9fe598b10e21401de'
          print('V48_RELEASE_PAYLOAD_IDENTITY=39/39_PASS')
          PY
          cd gov/skills/skill-book/V4.8
          sha256sum -c SHA256SUMS.txt >/dev/null
          echo 'V48_RELEASE_SHA256SUMS=PASS'

      - name: Run 38 modular tests and syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          cd gov/skills/skill-book/V4.8
          python3 -m unittest discover -s tests -v 2>&1 | tee /tmp/v48-release-tests.log
          count="$(grep -E '^Ran [0-9]+ tests? in ' /tmp/v48-release-tests.log | tail -1 | awk '{print $2}')"
          test "$count" = '38'
          grep -Fq 'OK' /tmp/v48-release-tests.log
          python3 -m compileall -q scripts tests
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          echo 'V48_RELEASE_TESTS=38/38_PASS'
          echo 'V48_RELEASE_PYTHON_SYNTAX=PASS'

      - name: Build portable deterministic Candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/v48-local
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, zipfile
          src=Path('gov/skills/skill-book/V4.8')
          out=Path('/tmp/v48-local/skill-book_V4.8_CANDIDATE_20260827.zip')
          root_name='skill-book_V4.8_CANDIDATE'
          files=sorted(p for p in src.rglob('*') if p.is_file())
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_STORED) as z:
              for p in files:
                  zi=zipfile.ZipInfo(f'{root_name}/{p.relative_to(src).as_posix()}', date_time=(1980,1,1,0,0,0))
                  zi.compress_type=zipfile.ZIP_STORED
                  zi.create_system=3
                  zi.external_attr=(0o100644<<16)
                  zi.extra=b''; zi.comment=b''
                  z.writestr(zi,p.read_bytes())
          b=out.read_bytes(); sha=hashlib.sha256(b).hexdigest()
          assert len(b)==156008, len(b)
          assert sha=='df933b799e7e56a662f055abfe9825d15a4470c86cf9b41a34e30cbb98bf4c4b', sha
          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None
              names=z.namelist(); assert len(names)==len(set(names))==41
              assert not [n for n in names if PurePosixPath(n).is_absolute() or '..' in PurePosixPath(n).parts or '\\' in n]
              assert not [n for n in names if '__pycache__' in PurePosixPath(n).parts or n.endswith('.pyc')]
          print('V48_LOCAL_ZIP_BYTES=156008')
          print('V48_LOCAL_ZIP_SHA256=df933b799e7e56a662f055abfe9825d15a4470c86cf9b41a34e30cbb98bf4c4b')
          print('V48_LOCAL_ZIP_CRC=PASS')
          print('V48_LOCAL_UNSAFE_PATH=0')
          print('V48_LOCAL_DUPLICATE_PATH=0')
          print('V48_LOCAL_PYCACHE_PYC=0')
          PY
          printf '%s  %s\n' "$EXPECTED_SHA256" "$ASSET_NAME" > "/tmp/v48-local/$ASSET_NAME.sha256"

      - name: Create GOV-DOC prerelease and upload assets
        shell: bash
        run: |
          set -Eeuo pipefail
          GH_TOKEN="$RELEASE_TOKEN" gh release create "$TAG" \
            --repo "$GOV_REPOSITORY" \
            --target "$SOURCE_COMMIT" \
            --title "$RELEASE_TITLE" \
            --notes "skill-book V4.8 Candidate / NOT CURRENT. Source Current remains V3.5. Exact Source Commit: $SOURCE_COMMIT. 38/38 modular tests PASS. Runtime promotion NOT_AUTHORIZED." \
            --prerelease \
            "/tmp/v48-local/$ASSET_NAME" \
            "/tmp/v48-local/$ASSET_NAME.sha256"
          release_json="$(GH_TOKEN="$RELEASE_TOKEN" gh api "repos/$GOV_REPOSITORY/releases/tags/$TAG")"
          release_id="$(jq -r '.id' <<<"$release_json")"
          zip_id="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.id' <<<"$release_json")"
          sha_id="$(jq -r --arg n "$ASSET_NAME.sha256" '.assets[]|select(.name==$n)|.id' <<<"$release_json")"
          zip_size="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.size' <<<"$release_json")"
          zip_digest="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.digest // empty' <<<"$release_json")"
          test "$(jq -r '.prerelease' <<<"$release_json")" = 'true'
          test "$zip_size" = "$EXPECTED_BYTES"
          if test -n "$zip_digest"; then test "$zip_digest" = "sha256:$EXPECTED_SHA256"; fi
          test -n "$release_id"; test -n "$zip_id"; test -n "$sha_id"
          echo "RELEASE_ID=$release_id" >> "$GITHUB_ENV"
          echo "ZIP_ASSET_ID=$zip_id" >> "$GITHUB_ENV"
          echo "SHA_ASSET_ID=$sha_id" >> "$GITHUB_ENV"
          echo "V48_RELEASE_ID=$release_id"
          echo "V48_ZIP_ASSET_ID=$zip_id"
          echo "V48_SHA_ASSET_ID=$sha_id"
          echo 'V48_PRERELEASE_CREATED=PASS'

      - name: Remote download readback and byte identity
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/v48-remote && mkdir -p /tmp/v48-remote
          GH_TOKEN="$RELEASE_TOKEN" gh release download "$TAG" --repo "$GOV_REPOSITORY" --dir /tmp/v48-remote
          test -f "/tmp/v48-remote/$ASSET_NAME"
          test -f "/tmp/v48-remote/$ASSET_NAME.sha256"
          test "$(stat -c '%s' "/tmp/v48-remote/$ASSET_NAME")" = "$EXPECTED_BYTES"
          test "$(sha256sum "/tmp/v48-remote/$ASSET_NAME" | awk '{print $1}')" = "$EXPECTED_SHA256"
          cmp -s "/tmp/v48-local/$ASSET_NAME" "/tmp/v48-remote/$ASSET_NAME"
          cmp -s "/tmp/v48-local/$ASSET_NAME.sha256" "/tmp/v48-remote/$ASSET_NAME.sha256"
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, zipfile
          p=Path('/tmp/v48-remote/skill-book_V4.8_CANDIDATE_20260827.zip')
          b=p.read_bytes()
          assert len(b)==156008
          assert hashlib.sha256(b).hexdigest()=='df933b799e7e56a662f055abfe9825d15a4470c86cf9b41a34e30cbb98bf4c4b'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              names=z.namelist(); assert len(names)==len(set(names))==41
              assert not [n for n in names if PurePosixPath(n).is_absolute() or '..' in PurePosixPath(n).parts or '\\' in n]
              assert not [n for n in names if '__pycache__' in PurePosixPath(n).parts or n.endswith('.pyc')]
          print('V48_REMOTE_DOWNLOAD_READBACK=PASS')
          print('V48_LOCAL_REMOTE_IDENTITY=MATCH')
          print('V48_REMOTE_ZIP_CRC=PASS')
          print('V48_REMOTE_UNSAFE_PATH=0')
          print('V48_REMOTE_DUPLICATE_PATH=0')
          print('V48_REMOTE_PYCACHE_PYC=0')
          PY

      - name: Resolve Runner run and job identity
        shell: bash
        run: |
          set -Eeuo pipefail
          job_id="$(GH_TOKEN="$RUNNER_GH_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" --jq '.jobs[]|select(.name=="release")|.id' | head -1)"
          test -n "$job_id"
          echo "RUNNER_JOB_ID=$job_id" >> "$GITHUB_ENV"
          echo "V48_RUNNER_RUN_ID=$GITHUB_RUN_ID"
          echo "V48_RUNNER_JOB_ID=$job_id"

      - name: Reconcile GOV-DOC published Candidate authority
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf gov-reconcile
          git clone -q "https://x-access-token:${RELEASE_TOKEN}@github.com/${GOV_REPOSITORY}.git" gov-reconcile
          cd gov-reconcile
          git config user.name 'VF Candidate Reconcile'
          git config user.email 'release@kewaro.com'
          live="$(git rev-parse origin/main)"
          remote_live="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$live" = "$remote_live"
          git checkout -q -B v48-reconcile origin/main
          git merge-base --is-ancestor "$SOURCE_COMMIT" HEAD
          export RECONCILE_BASE="$live"
          python3 - <<'PY'
          from pathlib import Path
          import os
          source=os.environ['SOURCE_COMMIT']; tag=os.environ['TAG']; asset=os.environ['ASSET_NAME']
          sha=os.environ['EXPECTED_SHA256']; size=os.environ['EXPECTED_BYTES']
          rid=os.environ['RELEASE_ID']; zid=os.environ['ZIP_ASSET_ID']; sid=os.environ['SHA_ASSET_ID']
          run=os.environ['GITHUB_RUN_ID']; job=os.environ['RUNNER_JOB_ID']
          base=f'https://github.com/llhzx2018/gov-doc/releases/download/{tag}'
          root=Path('.')
          readme=root/'distribution/skills/candidates/skill-book/V4.8/README.md'
          readme.write_text(f'''# skill-book V4.8 Candidate · Source Distribution

> Status: `CANDIDATE / NOT CURRENT`  
> Distribution: `PUBLISHED_REMOTE_VERIFIED`  
> Source Authority: `skills/skill-book/V4.8/`  
> Candidate Mother Overlay: `mother-specs/skill-book/V4.8/SKILL_BOOK_V4.8_CANDIDATE_OVERLAY.md`  
> Source Current remains: `skill-book V3.5`

## Candidate Purpose

V4.8 repairs runtime invocation/evidence truth gaps exposed by the backend V4.7 A1 sealed forward test. It adds mandatory Runtime Entry Receipt, declarative evidence with External Verifier Authority, Manifest key normalization, runtime path discovery repair, SEALED baseline truth enforcement and false-green final decision detection.

## Published Candidate Authority

- Exact Source Commit: `{source}`
- Tag: `{tag}`
- Release ID: `{rid}`
- File: `{asset}`
- Bytes: `{size}`
- SHA-256: `{sha}`
- Remote Asset ID: `{zid}`
- SHA Asset ID: `{sid}`
- Runner Run: `{run}`
- Runner Job: `{job}`
- Unit tests: `38/38 PASS (modular execution)`
- Python syntax: `PASS`
- ZIP container: `ZIP_STORED + fixed timestamp / permissions / path ordering`
- Local / Remote ZIP Identity: `MATCH`
- Remote Download Readback: `PASS`
- ZIP CRC: `PASS`
- Unsafe Path: `0`
- Duplicate Path: `0`
- pycache/pyc: `0`

Download: `{base}/{asset}`

SHA file: `{base}/{asset}.sha256`

## Authority Boundary

- Source Current: `skill-book V3.5`
- Installed Runtime Observation: `skill-book V4.7`
- V4.8 Backend Runtime Test: `NOT_RUN`
- Real Reader Forward Evidence: `NOT_RUN`
- Current Promotion: `NOT_AUTHORIZED`

Publication completes Candidate distribution only. It does not promote V4.8 to Source Current and does not claim Reader Outcome closure.
''',encoding='utf-8')
          mirror=root/'distribution/skills/candidates/skill-book/V4.8/RUNTIME_ZIP_MIRROR_STATUS.md'
          mirror.write_text(f'''# Runtime ZIP Mirror Status · skill-book V4.8

Status: `PUBLISHED_REMOTE_VERIFIED`

V4.8 Candidate has completed the temporary Public Runner release gate, remote asset download readback and byte-for-byte identity verification. The temporary Runner PR is publication-only and must not be merged into Runner Current.

## Published Distribution Authority

- Release: `skill-book V4.8 Candidate` (prerelease)
- Tag: `{tag}`
- Release ID: `{rid}`
- File: `{asset}`
- Remote Asset ID: `{zid}`
- SHA Asset ID: `{sid}`
- Bytes: `{size}`
- SHA-256: `{sha}`
- Exact Source Commit: `{source}`
- Runner Run: `{run}`
- Runner Job: `{job}`
- Unit Tests: `38/38 PASS (modular execution)`
- Python Syntax: `PASS`
- Local / Remote Identity: `MATCH`
- Remote Download Readback: `PASS`
- ZIP CRC: `PASS`
- Unsafe Path: `0`
- Duplicate Path: `0`
- pycache/pyc: `0`
- Software Production Write: `0`

Download: `{base}/{asset}`

SHA file: `{base}/{asset}.sha256`

## Authority Boundary

- Source: `skills/skill-book/V4.8/`
- Mother Overlay: `mother-specs/skill-book/V4.8/SKILL_BOOK_V4.8_CANDIDATE_OVERLAY.md`
- Latest Candidate: `V4.8`
- Source Current: `V3.5`
- Installed Runtime Observation: `V4.7`
- Backend V4.8 Runtime Test: `NOT_RUN`
- Real Reader Evidence: `NOT_RUN`
- Current Promotion: `NOT_AUTHORIZED`
''',encoding='utf-8')

          current=root/'CURRENT.md'
          t=current.read_text(encoding='utf-8')
          old_row='| skill-book | V3.5 | V4.6 CANDIDATE（非 Current） |'
          new_row='| skill-book | V3.5 | V4.7 CANDIDATE（非 Current） |'
          if old_row in t: t=t.replace(old_row,new_row,1)
          elif new_row not in t: raise SystemExit('CURRENT_SKILL_BOOK_ROW_UNEXPECTED')
          old='`skill-book V4.0/V4.1/V4.2/V4.3/V4.4/V4.5/V4.6` 为保留的历史 Candidate，`V4.7` 为最新 Candidate；八者均未晋升 Source Current。V4.7 已进入 Candidate Distribution，但未进入 Current Distribution。'
          new='`skill-book V4.0/V4.1/V4.2/V4.3/V4.4/V4.5/V4.6/V4.7` 为保留的历史 Candidate，`V4.8` 为最新 Candidate；九者均未晋升 Source Current。V4.8 已进入 Candidate Distribution，但未进入 Current Distribution。'
          if old in t: t=t.replace(old,new,1)
          elif new not in t: raise SystemExit('CURRENT_CANDIDATE_SENTENCE_UNEXPECTED')
          current.write_text(t,encoding='utf-8')

          idx=root/'distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md'
          t=idx.read_text(encoding='utf-8')
          marker='## Candidate（不改变 Current）'
          if marker not in t: raise SystemExit('CANDIDATE_MARKER_MISSING')
          head=t.split(marker,1)[0]
          tail=f'''{marker}

`skill-book V4.8` 是最新 `CANDIDATE / NOT CURRENT`；Source Current仍为V3.5，且V4.8不包含在Current总包中。Installed Runtime Observation为V4.7 Candidate。

- [直接下载 skill-book V4.8 Candidate ZIP]({base}/{asset})
- [下载 SHA-256 文件]({base}/{asset}.sha256)
- [查看 V4.8 Candidate Release](https://github.com/llhzx2018/gov-doc/releases/tag/{tag})
- [查看 V4.8 Candidate Source](https://github.com/llhzx2018/gov-doc/tree/main/skills/skill-book/V4.8)
- [查看 V4.8 Candidate Mother Overlay](https://github.com/llhzx2018/gov-doc/blob/main/mother-specs/skill-book/V4.8/SKILL_BOOK_V4.8_CANDIDATE_OVERLAY.md)
- [查看 V4.8 Candidate 分发说明](https://github.com/llhzx2018/gov-doc/blob/main/distribution/skills/candidates/skill-book/V4.8/README.md)

Published Distribution Identity：

- Bytes：`{size}`
- SHA-256：`{sha}`
- Release ID：`{rid}`
- Remote Asset ID：`{zid}`
- SHA Asset ID：`{sid}`
- Exact Source Commit：`{source}`
- Runner Run：`{run}`
- Runner Job：`{job}`
- Unit Tests：`38/38 PASS (modular execution)`
- Python Syntax：`PASS`
- Local / Remote ZIP Identity：`MATCH`
- Remote Download Readback：`PASS`
- ZIP CRC / Unsafe Path / Duplicate Path / pycache：`PASS`
- Status：`PUBLISHED_REMOTE_VERIFIED`
- Current Promotion：`NOT_AUTHORIZED`

历史 Candidate：

- [skill-book V4.7](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.7)
- [skill-book V4.6](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.6)
- [skill-book V4.5](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.5)
- [skill-book V4.4](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.4)
- [skill-book V4.3](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.3)
- [skill-book V4.2](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.2)
- [skill-book V4.1](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.1)
- [skill-book V4.0](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.0)
'''
          idx.write_text(head+tail,encoding='utf-8')
          print('V48_GOV_RECONCILE_FILES_PREPARED=PASS')
          PY
          git diff --check
          git add CURRENT.md distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md distribution/skills/candidates/skill-book/V4.8/README.md distribution/skills/candidates/skill-book/V4.8/RUNTIME_ZIP_MIRROR_STATUS.md
          git diff --cached --check
          git commit -q -m 'skill-book: reconcile V4.8 published candidate authority'
          reconcile_commit="$(git rev-parse HEAD)"
          before_push="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$before_push" = "$RECONCILE_BASE"
          git push -q origin HEAD:main
          echo "V48_GOV_RECONCILIATION_COMMIT=$reconcile_commit"
          echo 'V48_GOV_RECONCILIATION_WRITE=PASS'

      - name: Final remote authority readback
        shell: bash
        run: |
          set -Eeuo pipefail
          cd gov-reconcile
          git fetch -q origin main
          git reset -q --hard origin/main
          grep -Fq '| skill-book | V3.5 | V4.7 CANDIDATE（非 Current） |' CURRENT.md
          grep -Fq '`V4.8` 为最新 Candidate' CURRENT.md
          grep -Fq 'Status: `PUBLISHED_REMOTE_VERIFIED`' distribution/skills/candidates/skill-book/V4.8/RUNTIME_ZIP_MIRROR_STATUS.md
          grep -Fq "$EXPECTED_SHA256" distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md
          grep -Fq "$RELEASE_ID" distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md
          grep -Fq "$ZIP_ASSET_ID" distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md
          grep -Fq "$SOURCE_COMMIT" distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md
          grep -Fq 'Current Promotion：`NOT_AUTHORIZED`' distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md
          release_json="$(GH_TOKEN="$RELEASE_TOKEN" gh api "repos/$GOV_REPOSITORY/releases/tags/$TAG")"
          test "$(jq -r '.id' <<<"$release_json")" = "$RELEASE_ID"
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.id' <<<"$release_json")" = "$ZIP_ASSET_ID"
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.size' <<<"$release_json")" = "$EXPECTED_BYTES"
          echo "V48_FINAL_GOV_MAIN=$(git rev-parse HEAD)"
          echo 'LATEST_CANDIDATE=V4.8'
          echo 'SOURCE_CURRENT=V3.5'
          echo 'INSTALLED_RUNTIME_OBSERVATION=V4.7'
          echo 'CURRENT_PROMOTION=NOT_AUTHORIZED'
          echo 'V48_MIRROR=PUBLISHED_REMOTE_VERIFIED'
          echo 'TEMP_PR_MUST_CLOSE_NOT_MERGE=YES'
          echo 'V48_FINAL_REMOTE_AUTHORITY_READBACK=PASS'

# Synchronize trigger: this workflow commit is intentionally made after PR #366 opened; the PR will be closed and never merged.
