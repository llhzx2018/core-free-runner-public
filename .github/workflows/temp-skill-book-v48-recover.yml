name: TEMP skill-book V4.8 Exact Source Verify

on:
  push:
    branches:
      - release/skill-book-v48-candidate-asset-20260827
    paths:
      - '.github/workflows/temp-skill-book-v48-recover.yml'

permissions:
  contents: read

concurrency:
  group: temp-skill-book-v48-exact-source-verify
  cancel-in-progress: false

env:
  GOV_REPOSITORY: llhzx2018/gov-doc
  GOV_SOURCE_REF: a68a9940dcc16a948387ceafa545a178ab0ee6e4
  EXPECTED_BYTES: '156008'
  EXPECTED_SHA256: df933b799e7e56a662f055abfe9825d15a4470c86cf9b41a34e30cbb98bf4c4b
  ROOT_NAME: skill-book_V4.8_CANDIDATE

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Checkout temporary runner branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Checkout exact GOV-DOC V4.8 source candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN"
          git clone -q "https://x-access-token:${PRIVATE_READ_TOKEN}@github.com/${GOV_REPOSITORY}.git" gov
          cd gov
          git checkout -q "$GOV_SOURCE_REF"
          test "$(git rev-parse HEAD)" = "$GOV_SOURCE_REF"
          echo "GOV_SOURCE_CHECKOUT=PASS:$GOV_SOURCE_REF"

      - name: Verify 39 payload identities and package metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path('gov/skills/skill-book/V4.8')
          manifest = json.loads((root/'MANIFEST.json').read_text(encoding='utf-8'))
          files = manifest['files']
          assert len(files) == 39, len(files)
          expected_paths = set()
          for item in files:
              p = root / item['path']
              assert p.is_file(), item['path']
              b = p.read_bytes()
              assert len(b) == item['bytes'], (item['path'], len(b), item['bytes'])
              assert hashlib.sha256(b).hexdigest() == item['sha256'], item['path']
              expected_paths.add(item['path'])
          actual_payload = {
              str(p.relative_to(root)).replace('\\','/')
              for p in root.rglob('*') if p.is_file()
          } - {'MANIFEST.json','SHA256SUMS.txt'}
          assert actual_payload == expected_paths, (sorted(actual_payload-expected_paths), sorted(expected_paths-actual_payload))
          assert (root/'VERSION').read_text(encoding='utf-8') == '4.8\n'
          skill = (root/'SKILL.md').read_bytes()
          assert len(skill) == 29597
          assert hashlib.sha256(skill).hexdigest() == 'e046eb73a400c690d524ec889fa33252c2bc9b2af1ab2aa9fe598b10e21401de'
          git_blob = hashlib.sha1(b'blob '+str(len(skill)).encode()+b'\0'+skill).hexdigest()
          assert git_blob == '6af1f182376a87914594dea9b5d576182789fc0f', git_blob
          print('V48_MANIFEST_PAYLOAD_IDENTITY=39/39_PASS')
          print('V48_SKILL_BLOB_IDENTITY=PASS')
          PY
          cd gov/skills/skill-book/V4.8
          sha256sum -c SHA256SUMS.txt
          echo 'V48_SHA256SUMS=PASS'

      - name: Run V4.8 modular tests and syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          cd gov/skills/skill-book/V4.8
          python3 -m unittest discover -s tests -v 2>&1 | tee /tmp/v48-tests.log
          count="$(grep -E '^Ran [0-9]+ tests? in ' /tmp/v48-tests.log | tail -1 | awk '{print $2}')"
          test "$count" = '38'
          grep -Fq 'OK' /tmp/v48-tests.log
          echo 'V48_MODULAR_TESTS=38/38_PASS'
          python3 -m compileall -q scripts tests
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          echo 'V48_PYTHON_SYNTAX=PASS'

      - name: Build portable deterministic V4.8 Candidate ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, zipfile
          src = Path('gov/skills/skill-book/V4.8')
          out = Path('/tmp/skill-book_V4.8_CANDIDATE_20260827.zip')
          root_name = 'skill-book_V4.8_CANDIDATE'
          files = sorted(p for p in src.rglob('*') if p.is_file())
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_STORED) as z:
              for p in files:
                  rel = p.relative_to(src).as_posix()
                  zi = zipfile.ZipInfo(f'{root_name}/{rel}', date_time=(1980,1,1,0,0,0))
                  zi.compress_type = zipfile.ZIP_STORED
                  zi.create_system = 3
                  zi.external_attr = (0o100644 << 16)
                  zi.extra = b''
                  zi.comment = b''
                  z.writestr(zi, p.read_bytes())
          b = out.read_bytes()
          sha = hashlib.sha256(b).hexdigest()
          print(f'V48_ZIP_BYTES={len(b)}')
          print(f'V48_ZIP_SHA256={sha}')
          assert len(b) == 156008, len(b)
          assert sha == 'df933b799e7e56a662f055abfe9825d15a4470c86cf9b41a34e30cbb98bf4c4b', sha
          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None
              names = z.namelist()
              assert len(names) == len(set(names)) == 41
              unsafe = []
              pycache = []
              for n in names:
                  pp = PurePosixPath(n)
                  if pp.is_absolute() or '..' in pp.parts or '\\' in n:
                      unsafe.append(n)
                  if '__pycache__' in pp.parts or n.endswith('.pyc'):
                      pycache.append(n)
              assert not unsafe, unsafe
              assert not pycache, pycache
          print('V48_ZIP_CRC=PASS')
          print('V48_UNSAFE_PATH=0')
          print('V48_DUPLICATE_PATH=0')
          print('V48_PYCACHE_PYC=0')
          print('V48_LOCAL_CANDIDATE_IDENTITY=MATCH')
          PY
