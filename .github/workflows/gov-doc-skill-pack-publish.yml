name: GOV-DOC Current Skill Pack Publish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gov-doc-skill-pack-publish.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_REPO: llhzx2018/gov-doc
      EXPECTED_GOV_DOC_SHA: 27680edd2f21cb65a14ef0b5609b8e92515a12a0
      VF_SKILL_PACK_VERSION: 2026.08.29-r4
      VF_SKILL_BUILD_ID: 20260829r4
      VF_SKILL_RELEASE_TAG: skills-pack-2026.08.29-r4
      VF_SKILL_RELEASE_TITLE: VF Skills Pack 2026.08.29 R4
      DIST_DIR: dist/skills-2026.08.29-r4
      MIRROR_BRANCH: release/skill-pack-20260829r4-mirror
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Require VF registered capabilities
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VF_PRIVATE_READ_TOKEN" || { echo 'REGISTERED_CAPABILITY_BLOCK=VF_PRIVATE_READ_TOKEN_MISSING'; exit 78; }
          test -n "$VF_RELEASE_WRITE_TOKEN" || { echo 'REGISTERED_CAPABILITY_BLOCK=VF_RELEASE_WRITE_TOKEN_MISSING'; exit 79; }
          echo 'REGISTERED_VF_CAPABILITIES=PASS'

      - name: Checkout exact GOV-DOC Current source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/gov-doc
          ref: ${{ env.EXPECTED_GOV_DOC_SHA }}
          token: ${{ env.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: gov

      - name: Bind exact Source SHA
        working-directory: gov
        shell: bash
        run: |
          set -Eeuo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          test "$SOURCE_SHA" = "$EXPECTED_GOV_DOC_SHA"
          echo "GOV_DOC_RELEASE_SOURCE_SHA=$SOURCE_SHA"

      - name: Build Current Skill install packages
        working-directory: gov
        run: python3 distribution/skills/release_build.py

      - name: Verify local package set
        working-directory: gov
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, zipfile
          root = Path(os.environ['DIST_DIR'])
          manifest = json.loads((root/'INSTALL_BUILD_MANIFEST.json').read_text(encoding='utf-8'))
          assert manifest['pack_version'] == os.environ['VF_SKILL_PACK_VERSION'], manifest['pack_version']
          assert manifest['build_date'] == os.environ['VF_SKILL_BUILD_ID'], manifest['build_date']
          assert manifest['source_sha'] == os.environ['EXPECTED_GOV_DOC_SHA'], manifest['source_sha']
          assert manifest['skill_count'] == 11, manifest['skill_count']
          assert len(manifest['skills']) == 11, len(manifest['skills'])
          names = [r['skill'] for r in manifest['skills']]
          assert len(names) == len(set(names)) == 11, names
          assert 'skill-topic' in names, names
          topic = next(r for r in manifest['skills'] if r['skill'] == 'skill-topic')
          assert topic['version'] == 'V1.2', topic
          book = next(r for r in manifest['skills'] if r['skill'] == 'skill-book')
          assert book['version'] == 'V5.7', book
          build_id = os.environ['VF_SKILL_BUILD_ID']
          skill_zips = sorted(root.glob(f'skill-*_V*_INSTALL_{build_id}.zip'))
          assert len(skill_zips) == 11, [p.name for p in skill_zips]
          all_zips = sorted(root.glob('*.zip'))
          assert len(all_zips) == 12, [p.name for p in all_zips]
          for p in all_zips:
              with zipfile.ZipFile(p) as z:
                  assert z.testzip() is None, p.name
                  entries = z.namelist()
                  assert len(entries) == len(set(entries)), p.name
                  assert not any(n.startswith('/') or '..' in Path(n).parts for n in entries), p.name
          for r in manifest['skills']:
              p = root/r['artifact']
              assert p.stat().st_size == r['bytes'], p.name
              assert hashlib.sha256(p.read_bytes()).hexdigest() == r['sha256'], p.name
              assert r['source_sha'] == os.environ['EXPECTED_GOV_DOC_SHA'], r['skill']
          print('LOCAL_DISTRIBUTION_VERIFY_PASS=11_SKILLS_12_ZIPS_SKILL_TOPIC_V1.2_SKILL_BOOK_V5.7')
          PY

      - name: Create immutable private GOV-DOC Release or adopt existing exact Release identity
        working-directory: gov
        env:
          GH_TOKEN: ${{ env.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          DIR="$DIST_DIR"
          if gh release view "$VF_SKILL_RELEASE_TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            echo 'RELEASE_ALREADY_EXISTS=REMOTE_IDENTITY_VERIFY'
            READBACK="$RUNNER_TEMP/gov-doc-existing-release"
            rm -rf "$READBACK" && mkdir -p "$READBACK"
            gh release download "$VF_SKILL_RELEASE_TAG" --repo "$TARGET_REPO" --dir "$READBACK"
            python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, zipfile
          remote = Path(os.environ['RUNNER_TEMP'])/'gov-doc-existing-release'
          manifest = json.loads((remote/'INSTALL_BUILD_MANIFEST.json').read_text(encoding='utf-8'))
          assert manifest['pack_version'] == os.environ['VF_SKILL_PACK_VERSION'], manifest['pack_version']
          assert manifest['build_date'] == os.environ['VF_SKILL_BUILD_ID'], manifest['build_date']
          assert manifest['source_sha'] == os.environ['EXPECTED_GOV_DOC_SHA'], manifest['source_sha']
          assert manifest['skill_count'] == 11, manifest['skill_count']
          assert len(manifest['skills']) == 11, len(manifest['skills'])
          names = [r['skill'] for r in manifest['skills']]
          assert len(names) == len(set(names)) == 11, names
          topic = next(r for r in manifest['skills'] if r['skill'] == 'skill-topic')
          assert topic['version'] == 'V1.2', topic
          book = next(r for r in manifest['skills'] if r['skill'] == 'skill-book')
          assert book['version'] == 'V5.7', book
          for r in manifest['skills']:
              p = remote/r['artifact']
              assert p.is_file(), p.name
              assert p.stat().st_size == r['bytes'], p.name
              assert hashlib.sha256(p.read_bytes()).hexdigest() == r['sha256'], p.name
              assert r['source_sha'] == os.environ['EXPECTED_GOV_DOC_SHA'], r['skill']
              with zipfile.ZipFile(p) as z:
                  assert z.testzip() is None, p.name
                  entries = z.namelist()
                  assert len(entries) == len(set(entries)), p.name
                  assert not any(n.startswith('/') or '..' in Path(n).parts for n in entries), p.name
          pack_name = f"VF_SKILLS_PACK_{os.environ['VF_SKILL_PACK_VERSION']}_INSTALL_{os.environ['VF_SKILL_BUILD_ID']}.zip"
          pack = remote/pack_name
          sidecar = remote/f'{pack_name}.sha256'
          expected_pack_sha = sidecar.read_text(encoding='utf-8').split()[0]
          assert hashlib.sha256(pack.read_bytes()).hexdigest() == expected_pack_sha
          with zipfile.ZipFile(pack) as z:
              assert z.testzip() is None
          sums = {}
          for line in (remote/'SHA256SUMS.txt').read_text(encoding='utf-8').splitlines():
              if line.strip():
                  digest, name = line.split(None, 1)
                  sums[name.strip()] = digest
          for r in manifest['skills']:
              assert sums[r['artifact']] == r['sha256'], r['artifact']
          expected_assets = 16
          actual_assets = len([p for p in remote.iterdir() if p.is_file()])
          assert actual_assets == expected_assets, actual_assets
          print('EXISTING_RELEASE_REMOTE_SELF_VERIFY_PASS=11_SKILLS_16_ASSETS_SKILL_TOPIC_V1.2_SKILL_BOOK_V5.7')
          PY
            rm -rf "$DIR"
            mkdir -p "$DIR"
            cp "$READBACK"/* "$DIR"/
            echo 'RELEASE_IDENTITY_SOURCE=EXISTING_REMOTE_VERIFIED_BYTES'
          else
            gh release create "$VF_SKILL_RELEASE_TAG" "$DIR"/* \
              --repo "$TARGET_REPO" \
              --target "$EXPECTED_GOV_DOC_SHA" \
              --title "$VF_SKILL_RELEASE_TITLE" \
              --notes-file "$DIR/RELEASE_NOTES.md"
            echo 'NEW_RELEASE_CREATE=PASS'
          fi

      - name: Remote Release exact readback
        working-directory: gov
        env:
          GH_TOKEN: ${{ env.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          READBACK="$RUNNER_TEMP/gov-doc-skill-pack-readback"
          rm -rf "$READBACK" && mkdir -p "$READBACK"
          gh release download "$VF_SKILL_RELEASE_TAG" --repo "$TARGET_REPO" --dir "$READBACK"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          local = Path(os.environ['DIST_DIR'])
          remote = Path(os.environ['RUNNER_TEMP'])/'gov-doc-skill-pack-readback'
          expected = sorted(p.name for p in local.iterdir() if p.is_file())
          got = sorted(p.name for p in remote.iterdir() if p.is_file())
          assert expected == got, {'expected': expected, 'got': got}
          for name in expected:
              a, b = local/name, remote/name
              assert a.stat().st_size == b.stat().st_size, name
              assert hashlib.sha256(a.read_bytes()).hexdigest() == hashlib.sha256(b.read_bytes()).hexdigest(), name
          manifest = json.loads((remote/'INSTALL_BUILD_MANIFEST.json').read_text(encoding='utf-8'))
          topic = next(r for r in manifest['skills'] if r['skill'] == 'skill-topic')
          assert topic['version'] == 'V1.2', topic
          book = next(r for r in manifest['skills'] if r['skill'] == 'skill-book')
          assert book['version'] == 'V5.7', book
          print(f'REMOTE_RELEASE_READBACK_PASS={len(expected)}_ASSETS_SKILL_TOPIC_V1.2_SKILL_BOOK_V5.7')
          PY

      - name: Build verified repository download mirror
        working-directory: gov
        run: python3 distribution/skills/release_publish.py --release-verified

      - name: Stage verified mirror on GOV-DOC release branch through GitHub API
        working-directory: gov
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import base64, hashlib, json, os, urllib.error, urllib.parse, urllib.request
          from pathlib import Path

          repo = os.environ['TARGET_REPO']
          expected_main = os.environ['EXPECTED_GOV_DOC_SHA']
          branch = os.environ['MIRROR_BRANCH']
          token = os.environ['VF_RELEASE_WRITE_TOKEN']
          api_root = 'https://api.github.com'
          local_root = Path('.')

          def call(method: str, path: str, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(
                  api_root + path,
                  data=data,
                  method=method,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'Content-Type': 'application/json',
                      'User-Agent': 'vf-skill-pack-publisher',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as res:
                      raw = res.read()
                      return None if not raw else json.loads(raw.decode('utf-8'))
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode('utf-8', errors='replace')
                  raise RuntimeError(f'GitHub API {method} {path} -> {exc.code}: {body[:400]}') from exc

          def q(path: str) -> str:
              return urllib.parse.quote(path, safe='/')

          main_ref = call('GET', f'/repos/{repo}/git/ref/heads/main')
          actual_main = main_ref['object']['sha']
          assert actual_main == expected_main, {'expected_main': expected_main, 'actual_main': actual_main}

          ref_path = f'/repos/{repo}/git/refs/heads/{q(branch)}'
          try:
              call('DELETE', ref_path)
          except RuntimeError as exc:
              text = str(exc)
              missing = '-> 404:' in text or ('-> 422:' in text and 'Reference does not exist' in text)
              if not missing:
                  raise
          call('POST', f'/repos/{repo}/git/refs', {'ref': f'refs/heads/{branch}', 'sha': expected_main})

          def get_content(path: str):
              encoded = q(path)
              try:
                  return call('GET', f'/repos/{repo}/contents/{encoded}?ref={urllib.parse.quote(branch, safe="")}')
              except RuntimeError as exc:
                  if '-> 404:' in str(exc):
                      return None
                  raise

          current_dir = get_content('distribution/skills/current') or []
          for item in current_dir:
              if item.get('type') == 'file':
                  call('DELETE', f'/repos/{repo}/contents/{q(item["path"])}', {
                      'message': f'chore(distribution): replace verified Skill mirror {os.environ["VF_SKILL_RELEASE_TAG"]}',
                      'sha': item['sha'],
                      'branch': branch,
                  })

          files = [p for p in sorted((local_root/'distribution/skills/current').iterdir()) if p.is_file()]
          files += [
              local_root/'distribution/skills/CURRENT_SKILL_DISTRIBUTION.json',
              local_root/'distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md',
              local_root/'distribution/skills/HISTORICAL_STANDALONE_IDENTITIES_20260820.json',
          ]

          for path in files:
              rel = path.as_posix()
              prior = get_content(rel)
              payload = {
                  'message': f'chore(distribution): publish verified Skill downloads {os.environ["VF_SKILL_RELEASE_TAG"]}',
                  'content': base64.b64encode(path.read_bytes()).decode('ascii'),
                  'branch': branch,
              }
              if isinstance(prior, dict) and prior.get('sha'):
                  payload['sha'] = prior['sha']
              call('PUT', f'/repos/{repo}/contents/{q(rel)}', payload)

          for path in files:
              rel = path.as_posix()
              remote = get_content(rel)
              assert isinstance(remote, dict) and remote.get('content'), rel
              actual = base64.b64decode(remote['content'])
              assert len(actual) == path.stat().st_size, rel
              assert hashlib.sha256(actual).hexdigest() == hashlib.sha256(path.read_bytes()).hexdigest(), rel

          pulls = call('GET', f'/repos/{repo}/pulls?state=open&head=llhzx2018:{urllib.parse.quote(branch, safe="")}')
          if pulls:
              pr = pulls[0]
          else:
              pr = call('POST', f'/repos/{repo}/pulls', {
                  'title': f'chore(distribution): publish verified Current Skill downloads {os.environ["VF_SKILL_PACK_VERSION"]}',
                  'head': branch,
                  'base': 'main',
                  'body': (
                      'Machine-generated verified distribution mirror after GitHub Release exact readback.\n\n'
                      f'Exact Source: `{expected_main}`\n'
                      f'Release: `{os.environ["VF_SKILL_RELEASE_TAG"]}`\n'
                      'Expected Current Skills: `11`\n'
                      'Expected skill-topic: `V1.2`\n'
                      'Expected skill-book: `V5.7`\n'
                      'Production: `NO CHANGE`\n'
                  ),
              })
          print(f'GOV_DOC_DISTRIBUTION_PR={pr["number"]}')
          print(f'GOV_DOC_DISTRIBUTION_PR_URL={pr["html_url"]}')
          print('GOV_DOC_MIRROR_REMOTE_READBACK=PASS')
          PY

      - name: Final private Release visibility check
        env:
          GH_TOKEN: ${{ env.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh release view "$VF_SKILL_RELEASE_TAG" --repo "$TARGET_REPO" --json tagName,name,isDraft,isPrerelease,url --jq '.'
          echo 'GOV_DOC_RELEASE_GATE=PASS'
          echo 'GOV_DOC_DISTRIBUTION_MERGE_GATE=PENDING_PR'
