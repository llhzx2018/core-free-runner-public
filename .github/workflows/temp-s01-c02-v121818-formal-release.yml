name: TEMP S01-C02 v1.21.818 Formal Release
on:
  push:
    branches: [temp/s01-c02-v121818-build-20260905]
    paths: ['.github/workflows/temp-s01-c02-v121818-formal-release.yml']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPS_SHA: 2380c5cb29fbf60b3af3f99ae93ea6717dbc34dd
      ASSET_NAME: vf-tools-ops_V1.21.818.zip
      ASSET_BYTES: '3233896'
      ASSET_SHA: ef4679d191dde5722ff4130ab56a147a775068fa27e38f0a641fa6be58e3ccc5
    steps:
      - name: Checkout exact Ops source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.OPS_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops
      - name: Verify promoted source and rebuild exact Candidate
        shell: bash
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          main=$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/vf-tools-ops/branches/main | jq -r '.commit.sha')
          develop=$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/vf-tools-ops/branches/develop | jq -r '.commit.sha')
          test "$main" = "$OPS_SHA"
          test "$develop" = "$OPS_SHA"
          mkdir -p /tmp/release
          python3 - <<'PY'
          from pathlib import Path
          import re,zipfile
          root=Path('ops'); runtime=[]
          for p in root.rglob('*'):
              if not p.is_file() or p.is_symlink(): continue
              rel=p.relative_to(root).as_posix(); parts=rel.split('/'); low=[x.lower() for x in parts]
              if any(x in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in low): continue
              if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',rel,re.I): continue
              if '/' not in rel:
                  if rel not in {'vf-ops.php','uninstall.php'}: continue
              elif parts[0] not in {'includes','assets','languages','config'}: continue
              runtime.append((rel,p.read_bytes()))
          runtime.sort(key=lambda x:x[0])
          z=Path('/tmp/release/vf-tools-ops_V1.21.818.zip')
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as out:
              for rel,b in runtime:
                  i=zipfile.ZipInfo('vf-ops/'+rel,(2026,9,5,0,0,0)); i.compress_type=zipfile.ZIP_DEFLATED; i.external_attr=0o100644<<16; out.writestr(i,b)
          assert len(runtime)==905
          PY
          test "$(stat -c '%s' /tmp/release/$ASSET_NAME)" = "$ASSET_BYTES"
          test "$(sha256sum /tmp/release/$ASSET_NAME | awk '{print $1}')" = "$ASSET_SHA"
          unzip -tq /tmp/release/$ASSET_NAME >/dev/null
          echo EXACT_CANDIDATE_ARTIFACT=PASS
      - name: Create and read back Formal Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          ! gh release view v1.21.818 --repo llhzx2018/vf-tools-ops >/dev/null 2>&1
          gh release create v1.21.818 "/tmp/release/$ASSET_NAME" --repo llhzx2018/vf-tools-ops --target "$OPS_SHA" --title 'VF Tools Ops v1.21.818' --notes 'S01-C02 Static Inspection Failure Segment Runtime V1. Reuses canonical VF_Ops_Release_Findings directly against existing candidate_audit leaf failures and exposes only aggregate segment counts plus explicit CURRENT / CLASSIFIER_UNAVAILABLE / INCOMPLETE state. It does not expose issue text, URL/path, filename, SHA, package name or job identity and does not alter any FAIL/PASS verdict. Existing recovered Simply Static source remains preserved; no repeat source upload is authorized. No M3U8 migration/schema/DB write, Seed HOLD release, JD.gg/WPvivid mutation, content write, Production activation or DNS write.'
          j=$(gh api repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.818)
          test "$(jq -r '.target_commitish' <<<"$j")" = "$OPS_SHA"
          test "$(jq -r '.draft' <<<"$j")" = false
          test "$(jq -r '.prerelease' <<<"$j")" = false
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[] | select(.name==$n) | .size' <<<"$j")" = "$ASSET_BYTES"
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[] | select(.name==$n) | .digest' <<<"$j")" = "sha256:$ASSET_SHA"
          echo "RELEASE_ID=$(jq -r '.id' <<<"$j")"
          echo "ASSET_ID=$(jq -r --arg n "$ASSET_NAME" '.assets[] | select(.name==$n) | .id' <<<"$j")"
          echo "PUBLISHED_AT=$(jq -r '.published_at' <<<"$j")"
          echo PASS_V121818_FORMAL_RELEASE
