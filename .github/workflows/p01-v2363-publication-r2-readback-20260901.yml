name: P01 V2.36.3 Publication R2 Readback
on:
  push:
    branches: [release/p01-v2363-candidate-20260901]
    paths: [.github/workflows/p01-v2363-publication-r2-readback-20260901.yml]
permissions:
  actions: read
  contents: read
jobs:
  verify-publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FORMAL_SOURCE: 718e043e3715ef7b21849bc08634fca89bf92c1f
      FORMAL_TREE: 32e8afdd6d7cdd338c62fdafaedb200b127ca881
      RUNTIME_TREE: 820724b585cb59864211f77c4fb33537b2345029
      MAIN_EXPECTED: 21ac0ff14f17237212d288f71e95bde6eae503ec
      DEVELOP_EXPECTED: bcecac5d3a9c103bfc37863a8870ec15285dcc5c
      FORMAL_RUN: '33502799058'
      FORMAL_ARTIFACT: p01-v2363-formal-artifacts-r2-33502799058
      STRICT_RUN: '33503664704'
      PROMOTION_RUN: '33504020301'
      PUBLICATION_R1: '33504149192'
      DOWNLOAD: /tmp/p01-v2363-publication-r2-formal
      ROUNDTRIP: /tmp/p01-v2363-publication-r2-release
      EVID: /tmp/p01-v2363-publication-r2-evidence
    steps:
      - name: Download exact Formal Artifact Gate bytes
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.FORMAL_ARTIFACT }}
          path: ${{ env.DOWNLOAD }}
          repository: llhzx2018/core-free-runner-public
          run-id: ${{ env.FORMAL_RUN }}
          github-token: ${{ github.token }}
      - name: Checkout exact formal source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.FORMAL_SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01
      - name: Verify existing tag release and all assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          rm -rf "$ROUNDTRIP" "$EVID"; mkdir -p "$ROUNDTRIP" "$EVID"
          for run in "$FORMAL_RUN" "$STRICT_RUN" "$PROMOTION_RUN"; do test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$run --jq .conclusion)" = success; done
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$PUBLICATION_R1 --jq .conclusion)" = failure
          FULL=$(find "$DOWNLOAD" -type f -name 'VF-Start-V2.36.3-FULL.zip' -print -quit); test -n "$FULL"; PACK=$(dirname "$FULL")
          test "$(find "$PACK" -maxdepth 1 -type f | wc -l)" = 8
          cd "$GITHUB_WORKSPACE/p01"
          test "$(git rev-parse HEAD)" = "$FORMAL_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$FORMAL_TREE"
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          MAIN=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          DEV=$(git ls-remote origin refs/heads/develop | awk '{print $1}')
          TAG=$(git ls-remote --tags origin refs/tags/v2.36.3 | awk '{print $1}')
          test "$MAIN" = "$MAIN_EXPECTED"
          test "$DEV" = "$DEVELOP_EXPECTED"
          test "$TAG" = "$FORMAL_SOURCE"
          git fetch origin "$MAIN" "$DEV" --quiet
          test "$(git rev-parse "$MAIN^{tree}")" = "$FORMAL_TREE"
          test "$(git rev-parse "$MAIN:src")" = "$RUNTIME_TREE"
          git merge-base --is-ancestor "$FORMAL_SOURCE" "$MAIN"
          test "$(git rev-parse "$DEV^{tree}")" = "$FORMAL_TREE"
          test "$(git rev-parse "$DEV:src")" = "$RUNTIME_TREE"
          gh api repos/llhzx2018/vf-start/releases/tags/v2.36.3 > "$EVID/release.json"
          test "$(jq -r .id "$EVID/release.json")" = 380449563
          test "$(jq -r .tag_name "$EVID/release.json")" = v2.36.3
          test "$(jq -r .draft "$EVID/release.json")" = false
          test "$(jq -r .prerelease "$EVID/release.json")" = false
          test "$(jq '.assets|length' "$EVID/release.json")" = 8
          jq -r '.assets[] | [.name,.size,.digest] | @tsv' "$EVID/release.json" | sort > "$EVID/live-assets.tsv"
          cd "$PACK"
          sha256sum -c SHA256SUMS.txt | tee "$EVID/formal-sha256-check.txt"
          test "$(sha256sum VF-Start-V2.36.3-FULL.zip|awk '{print $1}')" = 6580700355c8a0127b030f6217a106260f0d8867fd3c3fd6db04fbd048fe46df
          test "$(sha256sum VF_Start_V2.36.3_UPDATE.zip|awk '{print $1}')" = 7110d0e232ce7dec521b4e76148441d06376a02124249d68237b774f2d33447d
          test "$(sha256sum repair-v2.36.3.php|awk '{print $1}')" = b76504cd122ab333815d44140ac7a1420451ed03cf63ced7013fc879044be231
          gh release download v2.36.3 --repo llhzx2018/vf-start --dir "$ROUNDTRIP"
          test "$(find "$ROUNDTRIP" -maxdepth 1 -type f | wc -l)" = 8
          : > "$EVID/roundtrip.tsv"
          for f in "$PACK"/*; do
            n=$(basename "$f"); r="$ROUNDTRIP/$n"; test -f "$r"
            fs=$(stat -c %s "$f"); rs=$(stat -c %s "$r"); fh=$(sha256sum "$f"|awk '{print $1}'); rh=$(sha256sum "$r"|awk '{print $1}')
            test "$fs" = "$rs"; test "$fh" = "$rh"
            printf '%s\t%s\t%s\n' "$n" "$rs" "$rh" >> "$EVID/roundtrip.tsv"
          done
          test "$(stat -c %s "$ROUNDTRIP/VF-Start-V2.36.3-FULL.zip")" = 587176
          test "$(stat -c %s "$ROUNDTRIP/VF_Start_V2.36.3_UPDATE.zip")" = 1236976
          test "$(stat -c %s "$ROUNDTRIP/repair-v2.36.3.php")" = 3591557
          test "$(sha256sum "$ROUNDTRIP/VF-Start-V2.36.3-FULL.zip"|awk '{print $1}')" = 6580700355c8a0127b030f6217a106260f0d8867fd3c3fd6db04fbd048fe46df
          test "$(sha256sum "$ROUNDTRIP/VF_Start_V2.36.3_UPDATE.zip"|awk '{print $1}')" = 7110d0e232ce7dec521b4e76148441d06376a02124249d68237b774f2d33447d
          test "$(sha256sum "$ROUNDTRIP/repair-v2.36.3.php"|awk '{print $1}')" = b76504cd122ab333815d44140ac7a1420451ed03cf63ced7013fc879044be231
          PUBLISHED_AT=$(jq -r .published_at "$EVID/release.json")
          printf 'P01_V2363_PUBLICATION_R2=PASS\nTAG=v2.36.3\nTAG_SOURCE=%s\nRELEASE_ID=380449563\nPUBLISHED_AT=%s\nASSETS=8\nFULL_BYTES=587176\nFULL_SHA256=6580700355c8a0127b030f6217a106260f0d8867fd3c3fd6db04fbd048fe46df\nUPDATE_BYTES=1236976\nUPDATE_SHA256=7110d0e232ce7dec521b4e76148441d06376a02124249d68237b774f2d33447d\nREPAIR_BYTES=3591557\nREPAIR_SHA256=b76504cd122ab333815d44140ac7a1420451ed03cf63ced7013fc879044be231\nROUNDTRIP_ALL_ASSETS=PASS\nR1_CLASSIFICATION=HARNESS_ONLY_TARGET_COMMITISH_ASSERTION\nOWNER_PRODUCTION_WRITE=NO\n' "$TAG" "$PUBLISHED_AT" | tee "$EVID/verdict.txt"
      - name: Upload publication R2 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2363-publication-r2-${{ github.run_id }}
          path: ${{ env.EVID }}
          if-no-files-found: error
          retention-days: 90
