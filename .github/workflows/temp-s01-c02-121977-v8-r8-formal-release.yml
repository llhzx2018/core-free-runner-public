name: S01-C02 1.21.977 V8 R8 Formal Release

on:
  push:
    branches:
      - release/s01-c02-121977-v8-r8-formal
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  formal-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_REPOSITORY: llhzx2018/vf-tools-ops
      TARGET_SHA: 1da9b3bf153f95b477a3c90f1e3eeef3bf948d1f
      TARGET_VERSION: 1.21.977
      RELEASE_TAG: v1.21.977
      ASSET_NAME: vf-tools-ops_V1.21.977.zip
      TESTED_RUN_ID: '36826204222'
      TESTED_ARTIFACT_NAME: s01-c02-v1.21.977-v8-r8-candidate
      EXPECTED_BYTES: '3447211'
      EXPECTED_SHA256: e5f73889ba818c0136f8f68335e18ddc5906e11bd3dc541f68c74d70fb65e75d
      EXPECTED_RUNTIME_FILES: '968'
      EXPECTED_RUNTIME_FP: 92260d35a73ac58f25364f051fa2715b0d962cf26ea71eb97b7b6b31ab93b893
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}

    steps:
      - name: Verify credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN"
          test -n "$RELEASE_WRITE_TOKEN"

      - name: Checkout exact promoted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target

      - name: Verify exact tested candidate artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n' < target/VERSION)" = "$TARGET_VERSION"
          rm -rf tested; mkdir tested
          gh run download "$TESTED_RUN_ID" --repo llhzx2018/core-free-runner-public --name "$TESTED_ARTIFACT_NAME" --dir tested
          test -f tested/FINAL_EVIDENCE.json
          test -f "tested/$ASSET_NAME"
          jq -e --arg sha "$TARGET_SHA" --arg ver "$TARGET_VERSION" '
            .status=="PASS" and
            .candidate_sha==$sha and
            .candidate_version==$ver and
            .upgrade=="PASS" and
            .browser.result=="PASS" and
            .browser.blocking_errors==0 and
            .browser.responsive_failures==0 and
            .v8_source_render.result=="PASS" and
            .v8_source_render.checks==60 and
            .security_boundary=="PASS" and
            .frozen_shell_header_menu=="PASS" and
            .owner_real_use=="POST_PRODUCTION_REQUIRED"
          ' tested/FINAL_EVIDENCE.json >/dev/null
          test "$(stat -c %s "tested/$ASSET_NAME")" = "$EXPECTED_BYTES"
          test "$(sha256sum "tested/$ASSET_NAME"|awk '{print $1}')" = "$EXPECTED_SHA256"
          unzip -tq "tested/$ASSET_NAME" >/dev/null
          echo "EXACT_TESTED_ARTIFACT=PASS"

      - name: Create formal release
        shell: bash
        env:
          GH_TOKEN: ${{ env.RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          if gh api "repos/$TARGET_REPOSITORY/releases/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh api "repos/$TARGET_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$TARGET_SHA"
          else
            cat > release-notes.md <<'MD'
          S01-C02 · VF Tools Ops · V1.21.977

          V8 Production Acceptance R8:
          - 组件清单中的状态 / 策略标签按内容自适应宽度，不再撑满整格伪装成输入框
          - 页面与关键词地图保持 1.21.976 已验收布局不变
          - 六档宽度共 60 组 source-render 验证
          - Shell / Header / Header Menu 保持冻结
          - 1.21.976 → 1.21.977 upgrade preservation PASS
          - authenticated browser regression PASS
          - V8 source-render 60 checks PASS
          - exact source: 1da9b3bf153f95b477a3c90f1e3eeef3bf948d1f
          - Candidate Gate Run: 36826204222

          Production installation and OWNER visual acceptance remain separate gates.
          MD
            gh release create "$RELEASE_TAG" "tested/$ASSET_NAME" --repo "$TARGET_REPOSITORY" --target "$TARGET_SHA" --title "VF Tools Ops V1.21.977" --notes-file release-notes.md
          fi

      - name: Remote exact readback
        shell: bash
        env:
          GH_TOKEN: ${{ env.RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          JSON="$(gh api "repos/$TARGET_REPOSITORY/releases/tags/$RELEASE_TAG")"
          RID="$(jq -r '.id' <<<"$JSON")"
          AID="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.id' <<<"$JSON")"
          SIZE="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.size' <<<"$JSON")"
          PUB="$(jq -r '.published_at' <<<"$JSON")"
          TAG_SHA="$(gh api "repos/$TARGET_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          test "$TAG_SHA" = "$TARGET_SHA"
          test "$SIZE" = "$EXPECTED_BYTES"
          rm -rf readback; mkdir readback
          gh release download "$RELEASE_TAG" --repo "$TARGET_REPOSITORY" --pattern "$ASSET_NAME" --dir readback --clobber
          test "$(stat -c %s "readback/$ASSET_NAME")" = "$EXPECTED_BYTES"
          test "$(sha256sum "readback/$ASSET_NAME"|awk '{print $1}')" = "$EXPECTED_SHA256"
          unzip -tq "readback/$ASSET_NAME" >/dev/null
          echo "FORMAL_RELEASE_REMOTE_READBACK=PASS"
          echo "RELEASE_ID=$RID"
          echo "ASSET_ID=$AID"
          echo "PUBLISHED_AT=$PUB"
          echo "ASSET_BYTES=$SIZE"
          echo "ASSET_SHA256=$EXPECTED_SHA256"
          echo "RUNTIME_FILES=$EXPECTED_RUNTIME_FILES"
          echo "RUNTIME_FINGERPRINT=$EXPECTED_RUNTIME_FP"

      - name: Cleanup
        if: always()
        run: rm -rf target tested readback
