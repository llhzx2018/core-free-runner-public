name: S01 UX Closure Batch Gate

on:
  push:
    branches:
      - temp/s01-ux-closure-batch-gate-20260907

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Credential boundary
        shell: bash
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_READ_TOKEN"

      - name: Checkout exact Theme candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: ef009f2ead19fd653d9f632053c14f38f31c640d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: theme

      - name: Checkout exact M3U8 candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: a9c15753769fd114d03e9eb3664c1c8ecde5ba39
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: m3u8

      - name: Theme exact six-file fence
        shell: bash
        run: |
          set -euo pipefail
          cd theme
          test "$(git rev-parse HEAD)" = "ef009f2ead19fd653d9f632053c14f38f31c640d"
          git cat-file -e e2a7f80d74f1c567cd468bb0c1d7c853ca94cbfd^{commit}
          git diff --name-only e2a7f80d74f1c567cd468bb0c1d7c853ca94cbfd HEAD | sort > /tmp/theme-actual.txt
          cat > /tmp/theme-expected.txt <<'EOF'
          VERSION
          src/inc/admin/views/tabs/overview.php
          src/style.css
          tests/update-refresh-policy-contract.php
          tests/visible-console-v2-contract.php
          tests/workbench-primary-action-contract.php
          EOF
          sort -o /tmp/theme-expected.txt /tmp/theme-expected.txt
          diff -u /tmp/theme-expected.txt /tmp/theme-actual.txt

      - name: M3U8 exact eight-file fence
        shell: bash
        run: |
          set -euo pipefail
          cd m3u8
          test "$(git rev-parse HEAD)" = "a9c15753769fd114d03e9eb3664c1c8ecde5ba39"
          git cat-file -e 023d0e82531da5c674dedeff8af5365bcd329011^{commit}
          git diff --name-only 023d0e82531da5c674dedeff8af5365bcd329011 HEAD | sort > /tmp/m3u8-actual.txt
          cat > /tmp/m3u8-expected.txt <<'EOF'
          VERSION
          src/admin/Controller/class-dashboard-controller.php
          src/admin/pages/dashboard.php
          src/vf-tool-m3u8.php
          tests/unit/dashboard-human-language-contract.php
          tests/unit/package-physical-locator-contract.php
          tests/unit/update-refresh-policy-contract.php
          tests/unit/visible-console-v2-contract.php
          EOF
          sort -o /tmp/m3u8-expected.txt /tmp/m3u8-expected.txt
          diff -u /tmp/m3u8-expected.txt /tmp/m3u8-actual.txt

      - name: Full PHP syntax gate
        shell: bash
        run: |
          set -euo pipefail
          find theme -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/theme-php-lint.log
          find m3u8 -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/m3u8-php-lint.log
          tail -n 10 /tmp/theme-php-lint.log
          tail -n 10 /tmp/m3u8-php-lint.log

      - name: Theme workbench primary-action contract
        shell: bash
        run: |
          set -euo pipefail
          cd theme
          php tests/workbench-primary-action-contract.php
          php tests/update-refresh-policy-contract.php
          php tests/update-center-human-language-contract.php
          php tests/visible-console-v2-contract.php

      - name: Theme behavior boundary
        shell: bash
        run: |
          set -euo pipefail
          cd theme
          ! git diff --name-only e2a7f80d74f1c567cd468bb0c1d7c853ca94cbfd HEAD | grep -E '(^|/)(assets/css/|inc/update/|class-vf-theme-update-|class-vf-wp-update-)'
          git diff --unified=0 e2a7f80d74f1c567cd468bb0c1d7c853ca94cbfd HEAD -- src/inc/admin/views/tabs/overview.php > /tmp/theme-overview.diff
          ! grep -E '^[-+].*(data-vf-dashboard-(next-link|refresh|maintenance-link)|vf_theme_dashboard_url)' /tmp/theme-overview.diff
          echo PASS_THEME_PRIMARY_ACTION_BEHAVIOR_BOUNDARY

      - name: M3U8 dashboard human-language contracts
        shell: bash
        run: |
          set -euo pipefail
          cd m3u8
          php tests/unit/dashboard-human-language-contract.php
          php tests/unit/package-physical-locator-contract.php
          php tests/unit/update-refresh-policy-contract.php
          php tests/unit/visible-console-v2-contract.php
          php tests/frontend-s01-uiux-final-owner-contract.php

      - name: M3U8 provider update migration boundary
        shell: bash
        run: |
          set -euo pipefail
          cd m3u8
          ! git diff --name-only 023d0e82531da5c674dedeff8af5365bcd329011 HEAD | grep -E '(^|/)(tool-settings\.schema\.json|plugin-manifest\.json|src/includes/update/|src/includes/v6-provider-|src/config/)'
          git diff --unified=0 023d0e82531da5c674dedeff8af5365bcd329011 HEAD -- src/vf-tool-m3u8.php > /tmp/m3u8-main.diff
          ! grep -E '^[-+].*(require_once|register_activation_hook|VF_TOOLS_M3U8_(CANONICAL|LEGACY)_SLUG|vf_m3u8_settings_|vf_m3u8_mounts_|vf_tools_m3u8_v6_)' /tmp/m3u8-main.diff
          echo PASS_M3U8_PROVIDER_UPDATE_MIGRATION_BOUNDARY
