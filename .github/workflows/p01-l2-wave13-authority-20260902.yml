name: P01 L2 Wave 1-13 Authority Closure
on:
  push:
    branches: [run/p01-l2-wave13-authority-20260902]
    paths:
      - .github/workflows/p01-l2-wave13-authority-20260902.yml
      - scripts/p01_l2_wave13_authority.py
permissions:
  contents: read
jobs:
  authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Runner branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: runner
      - name: Checkout P01 docs candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: docs/p01-l2-wave13-current-truth-20260902
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Fresh remote fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = f036cd0f5833ef2639970db336c62393cf43cce0
          test "$(git -C product ls-remote origin refs/heads/develop | cut -f1)" = f036cd0f5833ef2639970db336c62393cf43cce0
          test "$(git -C product ls-remote origin refs/heads/main | cut -f1)" = 4a41d3533fe8450c3f491d5aaf28417536012ba0
          test -z "$(git -C product status --porcelain)"
      - name: Write Wave 1-13 Current Truth
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 runner/scripts/p01_l2_wave13_authority.py product
      - name: Exact docs-only boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          git diff --check
          mapfile -t actual < <(git status --porcelain | sed -E 's/^.. //' | sort)
          expected=(
            CHANGELOG.md
            README.md
            VF_PROJECT.json
            docs/README.md
            docs/authority/ACCEPTANCE_MATRIX.md
            docs/authority/CURRENT.md
            docs/authority/P01_FUNCTIONAL_CONTRACT_20260829.md
            docs/authority/P01_L2_PRODUCT_OPT_CHECKPOINT_20260902.md
            docs/authority/RPD.md
            docs/authority/SSOT.md
            docs/evidence/P01_L2_PERSONAL_INTERNET_JOURNEY_WAVE_1_13_20260902.md
            docs/handoff/CURRENT_STATE.md
            docs/handoff/P01_L2_CURRENT_CHECKPOINT_20260902.md
          )
          mapfile -t expected < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#actual[@]}" -eq 13
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${actual[@]}")
          ! printf '%s\n' "${actual[@]}" | grep -Eq '^(src/|VERSION$|migrations?/|schema/)'
          test "$(cat VERSION)" = 2.36.4
          test "$(cat src/VERSION.txt)" = 2.36.4
          python3 - <<'PY'
          import json
          d=json.load(open('VF_PROJECT.json',encoding='utf-8'))
          assert d['production_version']=='2.36.5'
          assert d['working_version']=='2.36.4'
          assert d['schema_version']=='2026082901'
          assert d['production_release']['release_source']=='ef86eba16aec71c1d0dabc16ad23089a78ee5057'
          assert d['production_release']['runtime_tree']=='a7f472ec1f449ada1152d271f2723c52e7b58144'
          assert d['current_change']['develop_exact_source_before_docs_checkpoint']=='f036cd0f5833ef2639970db336c62393cf43cce0'
          assert d['current_change']['product_prs']==list(range(202,212))+[213,214,215]
          assert d['current_change']['journey_gate_r3']==33565412715
          assert d['current_change']['journey_closure']=='PASS'
          assert d['authority']['current_l2_develop_evidence']=='docs/evidence/P01_L2_PERSONAL_INTERNET_JOURNEY_WAVE_1_13_20260902.md'
          PY
          grep -F 'Wave 1–13' docs/authority/CURRENT.md >/dev/null
          grep -F '33565412715' docs/authority/CURRENT.md >/dev/null
          grep -F 'Wave 1–13' docs/handoff/CURRENT_STATE.md >/dev/null
          grep -F '33565412715' docs/evidence/P01_L2_PERSONAL_INTERNET_JOURNEY_WAVE_1_13_20260902.md >/dev/null
          grep -F '33564418437' docs/evidence/P01_L2_PERSONAL_INTERNET_JOURNEY_WAVE_1_13_20260902.md >/dev/null
          grep -F '33565270107' docs/evidence/P01_L2_PERSONAL_INTERNET_JOURNEY_WAVE_1_13_20260902.md >/dev/null
      - name: Commit and push docs candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add CHANGELOG.md README.md VF_PROJECT.json docs/README.md docs/authority/ACCEPTANCE_MATRIX.md docs/authority/CURRENT.md docs/authority/P01_FUNCTIONAL_CONTRACT_20260829.md docs/authority/P01_L2_PRODUCT_OPT_CHECKPOINT_20260902.md docs/authority/RPD.md docs/authority/SSOT.md docs/evidence/P01_L2_PERSONAL_INTERNET_JOURNEY_WAVE_1_13_20260902.md docs/handoff/CURRENT_STATE.md docs/handoff/P01_L2_CURRENT_CHECKPOINT_20260902.md
          git commit -m 'docs(P01): close L2 Wave 1-13 journey truth'
          git push origin HEAD:docs/p01-l2-wave13-current-truth-20260902
