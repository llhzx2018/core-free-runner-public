name: P07 M03 D04 release142 exact-source formal safety and two-repo release
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p07-m03-release142-formal-sign-20261120.yml
      - scripts/p07_m03_release142_formal_promote.py
      - scripts/p07_m03_release142_wrapper.py
permissions:
  contents: read
jobs:
  release:
    if: github.repository == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      NO_COLOR: '1'
      PRODUCT_SHA: '1bf38aa07cc4a2a560da4cc73e4d622bdcdd5c71'
      PRODUCT_BASE: '45a67013630734119e021e013f5ddcb0b0ddff3d'
      RC_SHA: '34eb9bf1a6185038c29279d4a47a218562d405807a417c436297bc41d00a821f'
      TAG: 'p07-m03-v0.1.0-release142-20261120'
      ZIP: 'P07-M03-0.1.0-release142.zip'
    steps:
      - name: Checkout trusted public release-only code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact approved private P07 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 1bf38aa07cc4a2a560da4cc73e4d622bdcdd5c71
          fetch-depth: 0
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: .product
      - name: Checkout live shared architecture and delivery authorities
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: .gov
      - name: Product exact source all owning migration UX safety and negative gates
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C .product rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(cat .product/BUILD_ID)" = 0.1.0-release140
          bash -n .product/bin/vfops-migrate-ui .product/components/p07-m03-migration-readiness.sh
          (cd .product && python3 -B scripts/check_p07_modules.py) > "$RUNNER_TEMP/p07-142-modules.log" 2>&1
          for suite in test_p07_m03_trial_builder_142.py test_p07_m03_terminal_ux_v3.py test_p07_m03_d04_preparation_checklist.py test_migration_no_overwrite_resume.py test_p07_m03_release141_limited_engine_gate.py test_p07_m03_d04_release_scope.py; do
            if (cd .product && python3 -B -m unittest discover -s tests -p "$suite" -q) > "$RUNNER_TEMP/p07-142-$suite.log" 2>&1; then
              echo "P07_M03_FORMAL142_SUITE_PASS=$suite"
            else
              echo "P07_M03_FORMAL142_SUITE_BLOCKED=$suite"
              grep -E '^(FAIL|ERROR):|^Ran [0-9]+ tests|^FAILED' "$RUNNER_TEMP/p07-142-$suite.log" | cut -c1-145 || true
              exit 1
            fi
          done
          python3 -B .product/.github/checks/architecture_gate.py \
            --manifest .product/.github/checks/code_architecture.json \
            --gov-root .gov --git-root .product \
            --base-sha "$PRODUCT_BASE" --head-sha "$PRODUCT_SHA" > "$RUNNER_TEMP/p07-142-architecture.log" 2>&1 || {
              echo P07_M03_FORMAL142_ARCHITECTURE=BLOCKED; exit 1;
            }
          echo P07_M03_FORMAL142_EXACT_SOURCE_MODULE_UX_SQL_SAFETY=PASS
      - name: Build exact formal142 ZIP twice from genuinely published141 signed archive
        shell: bash
        run: |
          set -Eeuo pipefail
          w="$RUNNER_TEMP/p07-m03-142"; mkdir -p "$w"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 2 --max-time 120 \
            'https://github.com/llhzx2018/core-free-runner-public/releases/download/p07-m03-v0.1.0-release141-limited-20261119/P07-M03-0.1.0-release141.zip' -o "$w/141.zip"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 2 --max-time 120 \
            'https://github.com/llhzx2018/core-free-runner-public/releases/download/p07-all-ux-v0.1.0-20261118/P07-M03-0.1.0-release140.zip' -o "$w/140.zip"
          echo '22c23818bc7268e6d3d95bc2552f42a5a3c12e97e387fdc542d59934c658b6d1  '"$w/141.zip" | sha256sum -c -
          echo '8633631f76ca5ecd1a3c79e2edb64438eb920b6c5407fa5d5057611f9a7e77b8  '"$w/140.zip" | sha256sum -c -
          unzip -q "$w/141.zip" -d "$w/141"
          unzip -q "$w/140.zip" -d "$w/140"
          python3 -B .product/scripts/p07_m03_trial_from_official.py \
            --official-zip "$w/141.zip" --official-build 0.1.0-release141 \
            --product-root .product --product-sha "$PRODUCT_SHA" \
            --build 0.1.0-release142-rc1 --output "$w/rc.zip" > "$w/rc.log" 2>&1 || {
              echo P07_M03_FORMAL142_RC_SOURCE=BLOCKED; exit 1;
            }
          test "$(sha256sum "$w/rc.zip" | cut -d' ' -f1)" = "$RC_SHA"
          for name in first second; do
            python3 -B scripts/p07_m03_release142_formal_promote.py --rc "$w/rc.zip" \
              --out "$w/$name.zip" > "$w/promotion-$name.log" 2>&1 || {
                echo P07_M03_FORMAL142_PACKAGE=BLOCKED
                grep '^P07_M03_FORMAL142_BUILD=' "$w/promotion-$name.log" || true
                exit 1
              }
          done
          cmp -s "$w/first.zip" "$w/second.zip"
          cp "$w/first.zip" "$w/$ZIP"
          unzip -q "$w/$ZIP" -d "$w/142"
          bash -n "$w/142/installers/p07-final.sh" "$w/142/dist/p07/0.1.0/overlay/bin/vfops-migrate-ui" \
            "$w/142/dist/p07/0.1.0/overlay/components/p07-m03-migration-readiness.sh"
          python3 -B - "$w/rc.zip" "$w/$ZIP" "$w/identity.env" <<'PY'
          import hashlib,sys,zipfile
          rc,final,out=sys.argv[1:]
          def blob(b):return hashlib.sha1(b"blob "+str(len(b)).encode()+b"\0"+b).hexdigest()
          with zipfile.ZipFile(rc) as f,zipfile.ZipFile(final) as g:
              a={i.filename:f.read(i) for i in f.infolist()}
              b={i.filename:g.read(i) for i in g.infolist()}
          prefix='dist/p07/0.1.0/overlay/'
          allowed={prefix+'BUILD_ID',prefix+'RUNTIME.gitblob','installers/p07-final.sh'}
          assert set(a)==set(b)
          assert {k for k in a if a[k]!=b[k]}==allowed
          assert b[prefix+'BUILD_ID']==b'0.1.0-release142\n'
          for k in a:
              if k not in allowed: assert a[k]==b[k]
          manifest=blob(b[prefix+'RUNTIME.gitblob'])
          installer=blob(b['installers/p07-final.sh'])
          sha=hashlib.sha256(open(final,'rb').read()).hexdigest()
          script=b['installers/p07-final.sh']
          assert ('RUNTIME_MANIFEST_BLOB="'+manifest+'"').encode() in script
          assert b'EXPECTED_BUILD_ID="0.1.0-release142"' in script
          open(out,'w').write('ZIP_SHA='+sha+'\nRUNTIME_BLOB='+manifest+'\nINSTALLER_BLOB='+installer+'\n')
          print('P07_M03_FORMAL142_SHA256='+sha)
          print('P07_M03_FORMAL142_RUNTIME_BLOB='+manifest)
          print('P07_M03_FORMAL142_INSTALLER_BLOB='+installer)
          print('P07_M03_FORMAL142_IDENTITY_ONLY_CHANGES=PASS')
          PY
          echo P07_M03_FORMAL142_DETERMINISTIC_REAL_ZIP=PASS
      - name: Prove real 141 to official142 Atomic, corrupt-file rejection, old141 rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          w="$RUNNER_TEMP/p07-m03-142"
          install_pkg() {
            local pkg="$1" root="$2" out="$3"
            P07_INSTALL_DIR="$root/current" P07_PREVIOUS_DIR="$root/previous" \
            P07_BIN_LINK="$root/bin/vfops" P07_ALLOW_NONROOT=1 P07_NO_EXEC=1 \
            P07_PUBLIC_ROOT="file://$pkg" \
            bash "$pkg/installers/p07-final.sh" > "$out" 2>&1
          }
          root="$w/isolated"; mkdir -p "$root"
          install_pkg "$w/141" "$root" "$w/base.log"
          test "$(cat "$root/current/BUILD_ID")" = 0.1.0-release141
          before="$(sha256sum "$root/current/.runtime-manifest.gitblob" | cut -d' ' -f1)"
          cp -a "$w/142" "$w/corrupt"
          printf 'TAMPERED\n' >> "$w/corrupt/dist/p07/0.1.0/overlay/lib/migration_target_inventory_guard.py"
          if install_pkg "$w/corrupt" "$root" "$w/corrupt.log"; then echo P07_M03_FORMAL142_TAMPER_ACCEPTED; exit 1; fi
          test "$(cat "$root/current/BUILD_ID")" = 0.1.0-release141
          test ! -e "$root/previous"
          test "$(sha256sum "$root/current/.runtime-manifest.gitblob" | cut -d' ' -f1)" = "$before"
          install_pkg "$w/142" "$root" "$w/upgrade.log" || { echo P07_M03_FORMAL142_ATOMIC=BLOCKED; exit 1; }
          test "$(cat "$root/current/BUILD_ID")" = 0.1.0-release142
          test "$(cat "$root/previous/BUILD_ID")" = 0.1.0-release141
          test "$(NO_COLOR=1 "$root/bin/vfops" --build-id)" = 0.1.0-release142
          for file in bin/vfops-migrate-ui components/p07-m03-migration-readiness.sh lib/migration_preparation_checklist.py lib/migration_target_inventory_guard.py lib/server_migration_pull.py; do
            cmp -s ".product/$file" "$root/current/$file"
          done
          echo P07_M03_FORMAL142_CORRUPT_FILE_STOP_AND_ATOMIC_141_TO_142=PASS
          rollback="$w/rollback";mkdir -p "$rollback"
          install_pkg "$w/141" "$rollback" "$w/rollbackbase.log"
          cp -a "$w/142" "$w/fault"
          python3 -B - "$w/fault/installers/p07-final.sh" <<'PY'
          import pathlib,sys
          path=pathlib.Path(sys.argv[1]);s=path.read_text()
          marker='if ! verify_installed_current; then'
          assert s.count(marker)==1
          path.write_text(s.replace(marker,'if true; then',1))
          PY
          if install_pkg "$w/fault" "$rollback" "$w/fault.log"; then echo P07_M03_FORMAL142_FAULT_BYPASS; exit 1; fi
          test "$(cat "$rollback/current/BUILD_ID")" = 0.1.0-release141
          test ! -e "$rollback/previous" && test ! -e "$rollback/current.new"
          echo P07_M03_FORMAL142_POST_SWAP_ROLLBACK_TO141=PASS
      - name: Verify historical 140 recovery rotation using exact final142 preview wrapper
        shell: bash
        run: |
          set -Eeuo pipefail
          w="$RUNNER_TEMP/p07-m03-142"; source "$w/identity.env"
          python3 -B scripts/p07_m03_release142_wrapper.py \
            --base-wrapper installers/p07-m03-release141-atomic.sh \
            --out "$w/wrapper-preview.sh" --asset-id 0 \
            --zip-sha256 "$ZIP_SHA" --runtime-blob "$RUNTIME_BLOB" --installer-blob "$INSTALLER_BLOB"
          bash -n "$w/wrapper-preview.sh"
          mkdir -p "$w/fakebin"
          cat > "$w/fakebin/curl" <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          dest=''
          while (( $# )); do
            if [[ "$1" == -o ]]; then dest="$2";shift 2; else shift;fi
          done
          test -n "$dest" && cp -- "$P07_TEST_ZIP" "$dest"
          SH
          chmod 700 "$w/fakebin/curl"
          install_pkg() {
            local pkg="$1" root="$2"
            P07_INSTALL_DIR="$root/current" P07_PREVIOUS_DIR="$root/previous" \
            P07_BIN_LINK="$root/bin/vfops" P07_ALLOW_NONROOT=1 P07_NO_EXEC=1 \
            P07_PUBLIC_ROOT="file://$pkg" \
            bash "$pkg/installers/p07-final.sh" > "$w/inner.log" 2>&1
          }
          preview() {
            local root="$1" zip="$2" log="$3"
            PATH="$w/fakebin:$PATH" P07_TEST_ZIP="$zip" \
            P07_INSTALL_DIR="$root/current" P07_PREVIOUS_DIR="$root/previous" \
            P07_BIN_LINK="$root/bin/vfops" P07_ALLOW_NONROOT=1 P07_NO_EXEC=1 \
            bash "$w/wrapper-preview.sh" install > "$log" 2>&1
          }
          seed="$w/seed140";mkdir -p "$seed";install_pkg "$w/140" "$seed"
          test "$(cat "$seed/current/BUILD_ID")" = 0.1.0-release140
          host="$w/history";mkdir -p "$host";install_pkg "$w/141" "$host"
          cp -a "$seed/current" "$host/previous"
          mkdir -p "$host/previous.preserved-0.1.0-release139"
          echo KEEP > "$host/previous.preserved-0.1.0-release139/OWNER_CANARY"
          if preview "$host" "$w/140.zip" "$w/bad-wrapper.log"; then echo P07_M03_FORMAL142_WRAPPER_SHA_BYPASS; exit 1;fi
          test "$(cat "$host/current/BUILD_ID")" = 0.1.0-release141
          preview "$host" "$w/$ZIP" "$w/history.log" || { echo P07_M03_FORMAL142_HISTORY_UPGRADE=BLOCKED;exit 1; }
          test "$(cat "$host/current/BUILD_ID")" = 0.1.0-release142
          test "$(cat "$host/previous/BUILD_ID")" = 0.1.0-release141
          test "$(cat "$host/previous.preserved-0.1.0-release140/BUILD_ID")" = 0.1.0-release140
          test "$(cat "$host/previous.preserved-0.1.0-release139/OWNER_CANARY")" = KEEP
          echo P07_M03_FORMAL142_HISTORY_139_140_141_PRESERVED=PASS
          clash="$w/clash";mkdir -p "$clash";install_pkg "$w/141" "$clash"
          cp -a "$seed/current" "$clash/previous"
          mkdir -p "$clash/previous.preserved-0.1.0-release140"
          echo KEEP > "$clash/previous.preserved-0.1.0-release140/OWNER_CANARY"
          if preview "$clash" "$w/$ZIP" "$w/collision.log"; then echo P07_M03_FORMAL142_COLLISION_OVERWRITE;exit 1;fi
          test "$(cat "$clash/current/BUILD_ID")" = 0.1.0-release141
          test "$(cat "$clash/previous/BUILD_ID")" = 0.1.0-release140
          test "$(cat "$clash/previous.preserved-0.1.0-release140/OWNER_CANARY")" = KEEP
          echo P07_M03_FORMAL142_HISTORY_COLLISION_FAIL_CLOSED=PASS
          unknown="$w/unknown";mkdir -p "$unknown";install_pkg "$w/141" "$unknown"
          mkdir -p "$unknown/previous"
          echo UNKNOWN > "$unknown/previous/BUILD_ID"
          if preview "$unknown" "$w/$ZIP" "$w/unknown.log";then echo P07_M03_FORMAL142_UNKNOWN_RECOVERY_OVERWRITE;exit 1;fi
          test "$(cat "$unknown/previous/BUILD_ID")" = UNKNOWN
          test "$(cat "$unknown/current/BUILD_ID")" = 0.1.0-release141
          echo P07_M03_FORMAL142_UNKNOWN_RECOVERY_FAIL_CLOSED=PASS
      - name: Mandatory actual ZIP Public Authority structural delivery gate before release writes
        shell: bash
        run: |
          set -Eeuo pipefail
          w="$RUNNER_TEMP/p07-m03-142";source "$w/identity.env"
          printf '%s  %s\n' "$ZIP_SHA" "$ZIP" > "$w/SHA256SUMS"
          (cd "$w" && sha256sum -c SHA256SUMS)
          python3 -B - "$PRODUCT_SHA" "$ZIP" "$ZIP_SHA" "$w/task-delivery.json" <<'PY'
          import json,sys
          product,zip_name,sha,out=sys.argv[1:]
          receipt={"schema":"vf.public-authority.task-delivery-check.v1",
            "project":"P07","source":product,
            "project_authority":{"agents":"AGENTS.md","rpd":"docs/authority/RPD.md",
             "acceptance":"docs/authority/ACCEPTANCE_MATRIX.md",
             "applicability":"docs/authority/PUBLIC_AUTHORITY_APPLICABILITY.md"},
            "required_domains":["INSTALL","SECURITY","TESTING","UPGRADE","DATA_SCHEMA","GIT","UA_UI"],
            "delivery":{"profile":"static_bundle_zip","entrypoint":"installers/p07-final.sh",
            "artifact":zip_name,"sha256":sha,"requires_git":False,"requires_manual_source_copy":False}}
          open(out,'w').write(json.dumps(receipt))
          PY
          python3 -B .gov/governance/public-authority/tools/task_delivery_contract_lint.py \
            --phase delivery --receipt "$w/task-delivery.json" \
            --project-root "$PWD/.product" --artifact-root "$w" \
            --public-router "$PWD/.gov/governance/public-authority/VF_PUBLIC_AUTHORITY_APPLICABILITY_ROUTER_V1.0.json" \
            > "$w/delivery.log" 2>&1 || { echo P07_M03_FORMAL142_DELIVERY_GATE=BLOCKED; exit 1; }
          echo P07_M03_FORMAL142_REAL_ZIP_DELIVERY_CONTRACT=PASS
          echo P07_M03_FORMAL142_ALL_PRE_RELEASE_GATES=PASS
      - name: Create verified twin DRAFT releases after all machine gates
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          w="$RUNNER_TEMP/p07-m03-142";source "$w/identity.env"
          test -n "$GH_TOKEN" || { echo P07_M03_FORMAL142_WRITE_AUTH=BLOCKED;exit 78; }
          product=llhzx2018/vf-server-ops
          public=llhzx2018/core-free-runner-public
          for repo in "$product" "$public"; do
            access="$(gh api "repos/$repo" --jq .permissions.push 2>/dev/null)" || { echo "P07_M03_FORMAL142_REPO=BLOCKED:$repo";exit 78; }
            test "$access" = true || { echo "P07_M03_FORMAL142_WRITE_SCOPE=BLOCKED:$repo";exit 78; }
            used="$(gh api --paginate "repos/$repo/releases?per_page=100" | jq -r --arg t "$TAG" '.[]|select(.tag_name==$t)|.id')"
            test -z "$used" || { echo "P07_M03_FORMAL142_RELEASE_ALREADY_EXISTS=$repo";exit 78; }
            if gh api "repos/$repo/git/ref/tags/$TAG" >/dev/null 2>&1;then echo "P07_M03_FORMAL142_TAG_ALREADY_EXISTS=$repo";exit 78;fi
            echo "P07_M03_FORMAL142_RELEASE_WRITE_PROVEN=$repo"
          done
          test "$(gh api "repos/$product/git/ref/heads/main" --jq .object.sha)" = "$PRODUCT_SHA"
          public_sha="$(gh api "repos/$public/git/ref/heads/main" --jq .object.sha)"
          printf 'PUBLIC_SHA=%s\n' "$public_sha" >> "$w/identity.env"
          cat > "$w/notes.md" <<'NOTES'
          P07-M03 网站与数据 / D04 服务器迁移 release142
          Based exclusively on merged P07 PR #371 and #372, exact SHA 1bf38aa07cc4a2a560da4cc73e4d622bdcdd5c71.
          Whole VPS or single-site migration now starts read-only source and target
          environment/inventory checks automatically. Conflicts and old task
          hints are presented inline without assuming ownership or replaying.
          MySQL↔MariaDB cross-engine automatic SQL migration remains disabled.
          Owner CP2/Production, actual VPS migration, old VPS and DNS are manual.
          Only M03 changes. No other four module updates.
          NOTES
          gh release create "$TAG" "$w/$ZIP" "$w/SHA256SUMS" \
            --repo "$product" --target "$PRODUCT_SHA" --draft \
            --title 'P07-M03 网站与数据 release142' --notes-file "$w/notes.md"
          gh release create "$TAG" "$w/$ZIP" "$w/SHA256SUMS" \
            --repo "$public" --target "$public_sha" --draft \
            --title 'P07-M03 网站与数据 release142' --notes-file "$w/notes.md"
          for repo in "$product" "$public"; do
            rec="$(gh api --paginate "repos/$repo/releases?per_page=100" | jq -c --arg t "$TAG" '.[]|select(.tag_name==$t)')"
            test -n "$rec" && test "$(jq -r .draft <<< "$rec")" = true
            test "$(jq -r '.assets|length' <<< "$rec")" = 2
            test "$(jq -r --arg n "$ZIP" '.assets[]|select(.name==$n)|.digest' <<< "$rec")" = "sha256:$ZIP_SHA"
            test "$(jq -r --arg n "$ZIP" '.assets[]|select(.name==$n)|.size' <<< "$rec")" = "$(wc -c < "$w/$ZIP")"
            echo "P07_M03_FORMAL142_DRAFT_DIGEST_VERIFIED=$repo"
          done
      - name: Publish two proven drafts then re-download exact real remote assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          w="$RUNNER_TEMP/p07-m03-142";source "$w/identity.env"
          product=llhzx2018/vf-server-ops
          public=llhzx2018/core-free-runner-public
          gh release edit "$TAG" --repo "$product" --draft=false
          gh release edit "$TAG" --repo "$public" --draft=false
          for repo in "$product" "$public"; do
            result="$(gh api "repos/$repo/releases/tags/$TAG")"
            test "$(jq -r .draft <<< "$result")" = false
            test "$(jq -r .prerelease <<< "$result")" = false
            test "$(jq -r '.assets|length' <<< "$result")" = 2
            test "$(jq -r --arg n "$ZIP" '.assets[]|select(.name==$n)|.digest' <<< "$result")" = "sha256:$ZIP_SHA"
            expected="$PRODUCT_SHA"
            if [[ "$repo" == "$public" ]];then expected="$PUBLIC_SHA";fi
            test "$(gh api "repos/$repo/git/ref/tags/$TAG" --jq .object.sha)" = "$expected"
            folder="$w/remote-$(basename "$repo")";mkdir -p "$folder"
            gh release download "$TAG" --repo "$repo" --dir "$folder"
            (cd "$folder" && sha256sum -c SHA256SUMS)
            cmp -s "$w/$ZIP" "$folder/$ZIP"
            echo "P07_M03_FORMAL142_OFFICIAL_REMOTE_READBACK=PASS:$repo"
          done
          curl --proto '=https' --tlsv1.2 -fsSL --retry 2 --max-time 120 \
            "https://github.com/llhzx2018/core-free-runner-public/releases/download/$TAG/$ZIP" -o "$w/anon142.zip"
          test "$(sha256sum "$w/anon142.zip" | cut -d' ' -f1)" = "$ZIP_SHA"
          echo P07_M03_FORMAL142_PUBLIC_ANONYMOUS_RELEASE=PASS
          echo P07_M03_FORMAL142_TWIN_GITHUB_RELEASES=PASS
      - name: Erase temporary private source and package workspace
        if: always()
        shell: bash
        run: |
          rm -rf -- .product .gov "$RUNNER_TEMP/p07-m03-142"
          echo P07_M03_FORMAL142_TEMP_PRIVATE_AND_PACKAGE_CLEANUP=PASS
