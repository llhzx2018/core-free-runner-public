name: TEMP S01-C02 Ops 1.21.827 Source Rebind Gate
on:
  push:
    branches:
      - temp/s01-c02-v121827-source-rebind-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121827-source-rebind-gate.yml'
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PRODUCT_COMMIT: 3a59068c8e9c6adc533e37883f48bd38224e7362
      BASE_COMMIT: eb41c358d106ec5deea36d88ee426bd63aee973d
    steps:
      - name: Checkout exact Ops candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.PRODUCT_COMMIT }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops
      - name: Verify identity syntax and exact scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$PRODUCT_COMMIT"
          test "$(tr -d '\r\n' < ops/VERSION)" = '1.21.827'
          grep -Fq 'Version: 1.21.827' ops/vf-ops.php
          grep -Fq "VF_OPS_VERSION', '1.21.827'" ops/vf-ops.php
          php -l ops/includes/site-release/s01-static-failed-candidate-source-rebind-v121827.php
          php -l ops/vf-ops.php
          mapfile -t files < <(git -C ops diff --name-only "$BASE_COMMIT..$PRODUCT_COMMIT")
          test "${#files[@]}" = 4
          printf '%s\n' "${files[@]}" | grep -Fxq '.github/phase3/v121827-failed-candidate-source-rebind.php'
          printf '%s\n' "${files[@]}" | grep -Fxq 'VERSION'
          printf '%s\n' "${files[@]}" | grep -Fxq 'includes/site-release/s01-static-failed-candidate-source-rebind-v121827.php'
          printf '%s\n' "${files[@]}" | grep -Fxq 'vf-ops.php'
      - name: Run source rebind contract and adjacent Candidate regression
        shell: bash
        run: |
          set -Eeuo pipefail
          php ops/.github/phase3/v121827-failed-candidate-source-rebind.php | grep -Fxq PASS_V121827_FAILED_CANDIDATE_SOURCE_REBIND
          php ops/.github/phase3/v121826-candidate-route-normalization.php | grep -Fxq PASS_V121826_CANDIDATE_ROUTE_NORMALIZATION
          php ops/.github/phase3/v121825-internal-link-target-family-readback.php | grep -Fxq PASS_V121825_INTERNAL_LINK_TARGET_FAMILY_READBACK
      - name: Verify fail-closed boundaries
        shell: bash
        run: |
          set -Eeuo pipefail
          F=ops/includes/site-release/s01-static-failed-candidate-source-rebind-v121827.php
          grep -Fq "job_mode'] ?? '')" "$F"
          grep -Fq "create_inspection_from_trusted_source_v121814" "$F"
          grep -Fq "vf_ops_s01_static_source_recovery_v2_sha_authority_v121814" "$F"
          grep -Fq 'hash_equals($expectedSha, $actualSha)' "$F"
          grep -Fq "add_action('admin_init', 'vf_ops_s01_failed_candidate_source_rebind_v121827', 27)" "$F"
          ! grep -Eq 'move_uploaded_file|\$_FILES|candidatePackageReady[^\n]*true|finalOnlinePass[^\n]*YES|update_option\([^,]*final' "$F"
          ! git -C ops diff "$BASE_COMMIT..$PRODUCT_COMMIT" -- includes/release includes/cf-static-downloads | grep -q '^[-+]'
      - name: Verify Production still requires a new job
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-static-candidate-readiness' -o /tmp/static.json
          jq -e '.pluginVersion=="1.21.826" and .activeStaticJobMode=="candidate" and .activeStaticJobStatus=="FAIL" and .activeStaticJobAuditFailureCount==202 and .candidatePackageReady==false and .manualSourceUploadRequired==false and .finalOnlinePass=="NO"' /tmp/static.json >/dev/null
      - name: Verify runner main untouched
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          J="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/core-free-runner-public/git/ref/heads/main)"
          test "$(jq -r .object.sha <<<"$J")" = '0160b557ad4ae0e8c6acd97e7551285bc05870bd'
      - name: Seal result
        run: echo PASS_V121827_SOURCE_REBIND_GATE
