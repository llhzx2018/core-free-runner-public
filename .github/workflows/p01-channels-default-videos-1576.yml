name: P01 Channels Default Videos One-shot #1576
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-channels-default-videos-1576.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      EXACT_SHA: 9f7c1d8609470c84829c30d9237ac63eff6f6254
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl,mbstring,sqlite3,pdo_sqlite,SimpleXML,zip
          coverage: none
      - name: Bind exact P01 candidate in disposable checkout
        shell: bash
        env:
          TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$TOKEN"
          ROOT="$RUNNER_TEMP/p01-channels-owner-default"
          mkdir -p "$ROOT"
          chmod 700 "$ROOT"
          echo "P01_WORK=$ROOT" >> "$GITHUB_ENV"
          git clone -q --no-checkout "https://x-access-token:${TOKEN}@github.com/$PRODUCT_REPO.git" "$ROOT/candidate"
          git -C "$ROOT/candidate" checkout -q --detach "$EXACT_SHA"
          git -C "$ROOT/candidate" remote set-url origin "https://github.com/$PRODUCT_REPO.git"
          test "$(git -C "$ROOT/candidate" rev-parse HEAD)" = "$EXACT_SHA"
          echo P01_DEFAULT_VIDEO_EXACT_SHA=PASS
      - name: Focused PHP/native UX and cache contract
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$P01_WORK/candidate"
          php -l src/app/ChannelLibraryPage.php
          php -l src/app/SubjectPageChrome.php
          php -l tests/unit/channels_owner_default_video_view_native.php
          php -l tests/unit/channels_reader_shell_r2_contract.php
          php -l tests/unit/channel_video_feed_owner_cache_native.php
          php tests/unit/channels_owner_default_video_view_native.php
          php tests/unit/channels_reader_shell_r2_contract.php
          php tests/unit/channel_video_feed_owner_cache_native.php
          php tests/unit/channels_guest_readonly_layout_v247390_contract.php
          php tests/unit/channels_page_full_polish_contract.php
          php tests/unit/channels_v247125_mature_source_library_contract.php
          php tests/unit/youtube_manual_updates_cache_native.php
          php tests/unit/youtube_batch_server_contract_native.php
          node tests/integration/channel_video_feed_layout_node.js
          node tests/integration/youtube_batch_sequential_node.js
          echo P01_CHANNEL_DEFAULT_VIDEOS_FOCUSED=PASS
      - name: Remove private candidate bytes
        if: always()
        shell: bash
        run: |
          if [ -n "${P01_WORK:-}" ]; then rm -rf -- "$P01_WORK"; fi
          echo P01_CHANNEL_DEFAULT_VIDEOS_EPHEMERAL=PASS
