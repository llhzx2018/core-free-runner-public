name: P01 channel visibility disclosure exact-source proof (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-channel-scope-1715-once.yml'

permissions:
  contents: read

jobs:
  channel-scope:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/p01-channel-scope-1715-once-20261025'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout public runner controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact P01 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 382616a13a32bf1a1889da35816ac6476e5eb7c6
          path: product
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: PHP syntax and focused channel UX contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = 382616a13a32bf1a1889da35816ac6476e5eb7c6
          php -l product/src/app/ChannelLibraryPage.php
          php -l product/tests/unit/channel_scope_disclosure_contract.php
          cd product
          php tests/unit/channel_scope_disclosure_contract.php
          php tests/unit/channels_page_full_polish_contract.php
          php tests/unit/p01_scalable_workspace_ia_v4_contract.php
          echo P01_CHANNEL_SCOPE_EXACT_SOURCE_FOCUSED_PASS
