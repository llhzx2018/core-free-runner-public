name: P08 R201 official issued v0.1.10 PHP Owner live v0.1.11 channel discovery
on:
  pull_request:
    paths:
      - .github/workflows/p08-v011-live-official-discovery.yml
permissions:
  contents: read
jobs:
  shipped-old-owner-real-https-github-check:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-v011-live-channel-20261119' && github.event.pull_request.base.ref == 'main' && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout actual issued v0.1.10 PHP Owner client (not target head)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: ef78dcb21117c822e2756360280f2418f794704f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p08
      - name: PHP 8.4 exact shipped client with real curl HTTPS
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl,openssl
          coverage: none
      - name: Independent remote channel, tag and genuine final asset identity
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git -C p08 rev-parse HEAD)" = ef78dcb21117c822e2756360280f2418f794704f
          test "$(gh api repos/llhzx2018/core-updates/contents/projects/P08-ADOPS.json --jq .sha)" = 368cc70658048bfe160d498b01f6a585fa0f15a5
          test "$(gh api repos/llhzx2018/vf-adops/git/ref/tags/v0.1.11 --jq .object.sha)" = 1de00a198add963c2e87779e71f8d564e67c5328
          test "$(gh api repos/llhzx2018/vf-adops/releases/tags/v0.1.11 --jq .id)" = 450980192
          test "$(gh api repos/llhzx2018/vf-adops/releases/tags/v0.1.10 --jq .id)" = 450188625
          echo P08_R201_REAL_OFFICIAL_CHANNEL_TAG_ASSET_TRUST=PASS
      - name: Execute true shipped v0.1.10 PHP Owner check over private GitHub HTTPS and reject bad versions
        shell: bash
        env:
          P08_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          php <<'PHP'
          <?php
          declare(strict_types=1);
          require 'p08/src/Upgrade/OwnerNextReleaseGateway.php';
          $token=(string)getenv('P08_PRIVATE_READ_TOKEN');
          if(strlen($token)<20)throw new RuntimeException('P08_R201_READ_CREDENTIAL_REQUIRED');
          $gateway=new VF\AdOps\Upgrade\OwnerNextReleaseGateway();
          $installed=[
            'version'=>'0.1.10',
            'source_sha'=>'ef78dcb21117c822e2756360280f2418f794704f',
            'source_full_manifest_sha256'=>'ab7f6b6f5e484c8efdf96d1b0a531b114d2ac1b1a3b45e52a072345a2ea0f110'
          ];
          $new=$gateway->check($token,$installed);
          if(($new['status']??null)!=='OFFICIAL_NEXT_VERIFIED_NOT_STAGED'
             ||($new['target_version']??null)!=='0.1.11'
             ||($new['target_sha']??null)!=='1de00a198add963c2e87779e71f8d564e67c5328'
             ||($new['source_version']??null)!=='0.1.10'
             ||($new['source_sha']??null)!==$installed['source_sha']
             ||($new['source_full_manifest_sha256']??null)!==$installed['source_full_manifest_sha256']
             ||($new['asset_sha256']??null)!=='5d2ddeab283f0220dcc90d1f163d392c203677995518bcda6d77f60b8c6b1d08'
             ||($new['can_install']??true)!==false)
             throw new RuntimeException('P08_R201_REAL_010_TO_011_INTAKE_MISMATCH');
          echo "P08_R201_V010_PHP_TRUE_OFFICIAL_011_NEXT_OFFER_NOT_STAGED=PASS\n";
          $current=$installed;
          $current['version']='0.1.11';
          $current['source_sha']='1de00a198add963c2e87779e71f8d564e67c5328';
          $current['source_full_manifest_sha256']=str_repeat('a',64);
          $same=$gateway->check($token,$current);
          if(($same['status']??null)!=='OFFICIAL_VERSION_CURRENT'
              ||($same['can_install']??true)!==false)
              throw new RuntimeException('P08_R201_NO_DOWNGRADE_OR_SAME_VERSION_FAILURE');
          echo "P08_R201_V011_CURRENT_NO_REINSTALL_NO_DOWNGRADE=PASS\n";
          foreach(['source_sha'=>str_repeat('f',40),'source_full_manifest_sha256'=>str_repeat('a',64)] as $field=>$badValue){
            $bad=$installed;
            $bad[$field]=$badValue;
            try{
              $gateway->check($token,$bad);
              throw new RuntimeException('P08_R201_UNTRUSTED_SOURCE_ACCEPTED');
            }catch(RuntimeException $e){
              if($e->getMessage()!=='P08_NEXT_SOURCE_OR_SCHEMA_UNSUPPORTED')throw $e;
            }
          }
          echo "P08_R201_OLD_SOURCE_MANIFEST_TAMPER_DENIED=PASS\n";
          echo "P08_R201_NO_BACKUP_NO_DOWNLOAD_NO_APPLY_PRODUCTION_UNTOUCHED=PASS\n";
          PHP
      - name: Always cleanup temporary private source
        if: always()
        shell: bash
        run: |
          rm -rf -- p08
          test ! -e p08
