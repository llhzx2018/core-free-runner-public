name: GOV-BOOK A3 v1.0.2 independent reader feedback gate
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/govbook-a3-v102-proof-20261015.yml']
permissions:
  contents: read
jobs:
  exact-source:
    if: >-
      github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public' &&
      github.event.pull_request.user.login == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout only private exact A3 candidate
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          umask 077
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/gov-book.git" book
          git -C book fetch -q origin draft/a3-v58-r2-self-contained-feedback-20261015
          git -C book fetch -q origin draft/a3-skill-book-v58-depth-20261015
          git -C book checkout -q de23569ec5c03564b9191374b8520950e73d1614
          test "$(git -C book rev-parse HEAD)" = de23569ec5c03564b9191374b8520950e73d1614
          echo GOVBOOK_A3_PINNED_SOURCE=PASS
      - name: Independent ZIP source, links, feedback and qualification
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,zipfile,pathlib,hashlib,subprocess
          root=pathlib.Path('book')
          sha=lambda b:hashlib.sha256(b).hexdigest()
          base=root/'distribution/p01/books/A3'
          old,new=base/'v1.0.1',base/'v1.0.2'
          prev=json.loads((old/'asset.json').read_text('utf-8'))
          meta=json.loads((new/'asset.json').read_text('utf-8'))
          catalog=json.loads((root/'distribution/p01/catalog.json').read_text('utf-8'))
          source=json.loads((root/'books/A3/revisions/skill-book-v5.8-r2/SOURCE_MANIFEST.json').read_text('utf-8'))
          revisions={x['book_id']:x for x in catalog['internal_revisions']}
          assert len(catalog['books'])==9 and len(catalog['internal_books'])==2 and len(revisions)==8
          assert {x['book_id'] for x in catalog['internal_books']}=={'D1','D2'}
          assert revisions['A3']['book_version']=='v1.0.2'
          assert meta['book_version']=='v1.0.2' and meta['base_book_version']=='v1.0.0'
          assert meta['qualification']=='INTERNAL' and meta['publication_status']=='NOT_PUBLISHED'
          assert meta['source_commit']==source['source_commit']=='0e6141df4329896757724311d87611d520bd303e'
          assert sha((old/'reader.zip').read_bytes())==prev['zip']['sha256']
          assert sha((old/'cover.png').read_bytes())==sha((new/'cover.png').read_bytes())==meta['cover']['sha256']
          payload=(new/'reader.zip').read_bytes()
          assert len(payload)==meta['zip']['bytes']==109928 and sha(payload)==meta['zip']['sha256']
          assert meta['zip']['sha256']=='7cdf4abba35ed10ce72e687f9c44e76dd98243d58c205675c697804e3d5da205'
          assert len(source['entries'])==20
          changed=[]
          with zipfile.ZipFile(new/'reader.zip') as z:
            assert z.testzip() is None
            infos=z.infolist()
            assert len(infos)==20 and len(set(i.filename for i in infos))==20
            for info in infos:
              assert info.compress_type==zipfile.ZIP_STORED
              assert info.flag_bits & 0x800
              assert not info.filename.startswith('/') and '..' not in pathlib.PurePosixPath(info.filename).parts
              assert info.filename.endswith('.md')
            for e in source['entries']:
              name=e['name']
              body=(root/e['source']).read_bytes()
              assert body==z.read(name) and len(body)==e['bytes']
              assert (zipfile.crc32(body)&0xffffffff)==int(e['crc32'],16)
              assert hashlib.sha1(f"blob {len(body)}\\0".replace("\\0","\0").encode()+body).hexdigest()==e['git_blob']
              if name.startswith('Training/') or name=='TRAINING_RESPONSE.md':
                continue
              original=subprocess.check_output(['git','-C','book','show','b79e5a0f0d812c7016043543e153ebbd9f3aca49:books/A3/revisions/skill-book-v5.8-r1/p01_course/md/'+name])
              if original!=body:
                expected=original.replace(b'`Training/CORE_DRILL_FEEDBACK.md`','[《分轮反馈》](Training/CORE_DRILL_FEEDBACK.md)'.encode('utf-8')).replace(b'`TRAINING_RESPONSE`','[训练作答卡](TRAINING_RESPONSE.md)'.encode('utf-8'))
                assert body==expected,name
                changed.append(name)
            assert len(changed)==12
            assert set(x['name'] for x in source['entries'])==set(z.namelist())
            for n in range(1,13):
              name=f'{n:02d}_第{n:02d}章.md'
              s=z.read(name).decode('utf-8')
              assert '[《分轮反馈》](Training/CORE_DRILL_FEEDBACK.md)' in s
              assert '[训练作答卡](TRAINING_RESPONSE.md)' in s
            feedback=z.read('Training/CORE_DRILL_FEEDBACK.md')
            orig=subprocess.check_output(['git','-C','book','show','b79e5a0f0d812c7016043543e153ebbd9f3aca49:books/A3/versions/v0.9.0/reader/08_其他Reader资产/Training/CORE_DRILL_FEEDBACK.md'])
            assert feedback==orig
            worksheet=z.read('TRAINING_RESPONSE.md').decode('utf-8')
            assert 'FIRST_JUDGMENT' in worksheet and 'RECOMMIT_JUDGMENT' in worksheet
            assert 'REAL_READER_NOT_RUN' in worksheet
          print('GOVBOOK_A3_20_MD_ZIP_SHA_CRC=PASS')
          print('GOVBOOK_A3_12_LINK_ONLY_EDITS_6_UNCHANGED=PASS')
          print('GOVBOOK_A3_FEEDBACK_SOURCE_EXACT=PASS')
          print('GOVBOOK_A3_INTERNAL_LINKS_AND_TRAINING_CARD=PASS')
          print('GOVBOOK_A3_IDENTITY_AND_OLD_VERSIONS=PASS')
          PY
      - name: Regression of all 8 private revisions and formal protection
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 book/tools/verify_p01_internal_revisions.py
          echo GOVBOOK_ALL_REVISIONS_REGRESSION=PASS
      - name: Remove private checkout
        if: always()
        run: rm -rf book
