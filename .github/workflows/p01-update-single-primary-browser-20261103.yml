name: P01 one primary upgrade CTA native and Chromium regression
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-update-single-primary-browser-20261103.yml'
permissions:
  contents: read
jobs:
  focused:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'test(P01):')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      PRODUCT_BRANCH: fix/p01-update-single-primary-ui-20261103
      PRODUCT_SHA: 2d41368fbeac5a9edb7662f561a83ee4db723ae5
      TARGET_VERSION: 2.47.490
    steps:
      - name: Checkout existing public runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Resolve exactly one private product source in disposable workspace
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          remote="$(git ls-remote "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')"
          test "$remote" = "$PRODUCT_SHA"
          git clone -q --no-checkout "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" candidate
          git -C candidate fetch -q --depth 1 origin "$PRODUCT_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "$TARGET_VERSION"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "$TARGET_VERSION"
          echo P01_IA6_UPDATE_EXACT_SOURCE=PASS
      - name: Run bounded native updater UX and safe-failure regression
        shell: bash
        run: |
          set -Eeuo pipefail
          command -v node
          command -v php
          node --check candidate/src/assets/update-core.js
          node --check candidate/src/assets/local-subsite-management.js
          php -l candidate/src/app/FunctionalWorkspaceShell.php >/dev/null
          for test in \
            p01_ia6_update_oneclick_modal_return_native.cjs \
            p01_ia5_global_update_readcost_r49_contract.cjs \
            update_check_stale_install_native.cjs \
            update_release_notes_progressive_native.cjs \
            p01_ia5_unified_management_r1_contract.cjs; do
            node "candidate/tests/unit/$test"
          done
          echo P01_IA6_UPDATE_MODAL_ONECLICK_NATIVE=PASS
      - name: Chromium verifies one-shot reopened global update task after reload
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip >/dev/null
          npm install --no-audit --no-fund --no-save playwright@1.57.0 >/dev/null
          npx playwright install chromium >/dev/null
          ROOT=/tmp/p01-update-dialog-gate
          mkdir -p "$ROOT"
          cp -a candidate/src/. "$ROOT/"
          php -S 127.0.0.1:19491 -t "$ROOT" >/tmp/p01-update-dialog-php.log 2>&1 &
          echo $! >/tmp/p01-update-dialog-php.pid
          for i in $(seq 1 40); do
            if curl -fsS -c /tmp/p01-update-browser-cookies -b /tmp/p01-update-browser-cookies http://127.0.0.1:19491/setup.php -o /tmp/p01-update-setup.html >/dev/null 2>&1; then break; fi
            sleep 1
          done
          test -s /tmp/p01-update-setup.html
          CSRF="$(python3 -c 'import re; s=open("/tmp/p01-update-setup.html",encoding="utf-8").read(); m=re.search(r"name=\"setup_csrf\"\s+value=\"([^\"]+)\"",s); assert m; print(m.group(1))')"
          curl -fsS -c /tmp/p01-update-browser-cookies -b /tmp/p01-update-browser-cookies -X POST http://127.0.0.1:19491/setup.php \
            --data-urlencode "setup_csrf=$CSRF" \
            --data-urlencode 'site_title=IA6 One Click Browser Test' \
            --data-urlencode 'admin_password=BrowserGate!2026' \
            --data-urlencode 'admin_password_confirm=BrowserGate!2026' >/dev/null
          (cd "$ROOT" && php cli/verify.php) | grep -Fx VERIFY_PASS=YES
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          try{
            const context=await browser.newContext({viewport:{width:1440,height:900}});
            const origin='http://127.0.0.1:19491';
            const login=await context.request.post(origin+'/api.php?action=login',{data:{password:'BrowserGate!2026'}});
            assert.equal(login.status(),200);
            assert.equal((await login.json()).ok,true);
            const page=await context.newPage();
            const guardedCalls=[];
            await page.route('**/api.php?action=update_status*',route=>route.fulfill({
              status:200,contentType:'application/json',
              body:JSON.stringify({ok:true,status:{
                current_version:'2.47.490',latest_version:'2.47.491',available:true,can_update:true,
                reason:'可直接更新。',update_priority:'normal',history:[]
              }})
            }));
            await page.route('**/api.php?action=update_prepare*',route=>{
              guardedCalls.push('prepare');
              return route.fulfill({status:409,contentType:'application/json',
                body:JSON.stringify({ok:false,error:'Synthetic preflight denied; no write'})});
            });
            await page.route('**/api.php?action=update_install*',route=>{
              guardedCalls.push('install');return route.abort();
            });
            await page.goto(origin+'/start.php',{waitUntil:'domcontentloaded'});
            const opener=page.locator('[data-vf-global-manage-open]').first();
            await opener.waitFor({state:'visible',timeout:15000});
            await opener.click();
            await page.locator('[data-vf-global-group="update"]').first().click();
            await page.waitForFunction(()=>document.querySelector('[data-vf-local-management]')?.open &&
              document.querySelector('[data-vf-global-group="update"]')?.getAttribute('aria-pressed')==='true');
            await page.waitForFunction(()=>{
              const update=document.querySelector('#installUpdate');
              const check=document.querySelector('#checkUpdate');
              return update&&!update.hidden&&check?.classList.contains('vf-update-secondary');
            },null,{timeout:15000});
            const hierarchy=await page.evaluate(()=>({
              checkBackground:getComputedStyle(document.querySelector('#checkUpdate')).backgroundColor,
              installBackground:getComputedStyle(document.querySelector('#installUpdate')).backgroundColor,
              duplicateHeading:!!document.querySelector('[data-vf-global-group-panel="update"] > h3'),
              legacyConfirmation:!!document.querySelector('[data-vf-update-confirm]')
            }));
            assert.notEqual(hierarchy.checkBackground,hierarchy.installBackground,'one visually distinct primary install action');
            assert.equal(hierarchy.duplicateHeading,false,'no duplicate update task heading');
            assert.equal(hierarchy.legacyConfirmation,false,'no hidden second confirmation');
            await page.locator('#installUpdate').click();
            await page.waitForFunction(()=>document.querySelector('#updateState')?.textContent?.includes('更新失败'),null,{timeout:10000});
            assert.deepEqual(guardedCalls,['prepare'],'single click triggers one protected prepare but never install on synthetic failure');
            assert.equal(await page.locator('[data-vf-local-management]').evaluate(el=>el.open),true,'failure keeps native management dialog');
            console.log('P01_UPDATE_REAL_BROWSER_ONE_PRIMARY_AND_FAIL_CLOSED=PASS');
            const written=await page.evaluate(()=>{
              window.dispatchEvent(new CustomEvent('vf:update-installed',{detail:{version:'2.47.490'}}));
              return window.sessionStorage.getItem('vf-local-management-update-return-v1');
            });
            assert(written,'success event persists one-shot return location');
            await page.reload({waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>{
              const dialog=document.querySelector('[data-vf-local-management]');
              const selected=document.querySelector('[data-vf-global-group="update"]');
              const updatePanel=document.querySelector('#updatePanel');
              return !!(dialog?.open&&selected?.getAttribute('aria-pressed')==='true'&&
                updatePanel&&!updatePanel.closest('[hidden]'));
            },null,{timeout:15000});
            assert.equal(await page.evaluate(()=>window.sessionStorage.getItem('vf-local-management-update-return-v1')),null,'one-time bookmark removed');
            assert.equal(await page.locator('[data-vf-management-tab="global"]').getAttribute('aria-selected'),'true');
            console.log('P01_IA6_UPDATE_CHROMIUM_ONE_DIALOG_REOPENS=PASS');
            await context.close();
          } finally {await browser.close();}
          JS
      - name: Erase private source and temporary request evidence
        if: always()
        shell: bash
        run: |
          if test -f /tmp/p01-update-dialog-php.pid; then kill "$(cat /tmp/p01-update-dialog-php.pid)" >/dev/null 2>&1 || true; fi
          rm -rf /tmp/p01-update-dialog-gate
          rm -f /tmp/p01-update-dialog-php.pid /tmp/p01-update-dialog-php.log /tmp/p01-update-browser-cookies /tmp/p01-update-setup.html
          rm -rf candidate
          echo P01_IA6_UPDATE_PRIVATE_SOURCE_CLEANUP=PASS
