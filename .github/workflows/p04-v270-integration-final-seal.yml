name: P04 V2.7 Integration Final Seal
on:
  push:
    branches: [p04-v270-integration-gate]
    paths: [.github/workflows/p04-v270-integration-final-seal.yml]
permissions:
  contents: write
jobs:
  seal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: p04-v270-integration-gate}
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: integration/v2.7.0-personal-infra
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: private
          fetch-depth: 0
      - name: Final seal
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            evidence/p04-v270-runtime-contract.PASS \
            evidence/p04-v270-integrated-flow-v2.PASS \
            evidence/p04-v270-full-regression.PASS \
            evidence/p04-v270-ua-direction.PASS \
            evidence/p04-v270-browser-evidence-v2.PASS; do test -f "$f"; done
          cd private
          test "$(tr -d '\r\n' < VERSION)" = '2.7.0'
          test "$(find database/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)" -eq 14
          tested=dced36fd638d54b54741404430965164108d66f7
          runtime_paths=(VERSION public/index.php public/advanced.php public/experience.php public/assets/v270-personal-infra.css public/assets/v270-app.js src/app/Core/GlobalSearchService.php src/app/Core/PersonalInfraExperienceService.php src/app/Core/PersonalInfraTodayTrait.php src/app/Core/PersonalInfraMoneyTrait.php src/app/Core/PersonalInfraPortfolioTrait.php src/app/Core/PersonalInfraDomainTrait.php src/app/Core/PersonalInfraInfraTrait.php src/app/Core/PersonalInfraSupportTrait.php)
          git diff --quiet "$tested" HEAD -- "${runtime_paths[@]}"
          head=$(git rev-parse HEAD); tree=$(git rev-parse 'HEAD^{tree}')
          main=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          develop=$(git ls-remote origin refs/heads/develop | awk '{print $1}')
          cand=$(git ls-remote origin refs/heads/candidate/v2.7.0 refs/heads/candidate/v2.7.0-personal-infra | wc -l)
          test "$main" = '248035651a359142e576f24ef3479d7af82964db'
          test "$develop" = '248035651a359142e576f24ef3479d7af82964db'
          test "$cand" -eq 0
          cd ..
          flow=$(cat evidence/p04-v270-integrated-flow-v2.json)
          reg=$(cat evidence/p04-v270-full-regression.json)
          browser=$(cat evidence/p04-v270-browser-report-v2.json)
          ua=$(cat evidence/p04-v270-ua-direction.json)
          contract=$(cat evidence/p04-v270-runtime-contract.json)
          artifact=$(cat evidence/p04-v270-browser-artifact-v2.txt)
          jq -n \
            --arg head "$head" --arg tree "$tree" --arg main "$main" --arg develop "$develop" --arg artifact "$artifact" \
            --argjson flow "$flow" --argjson regression "$reg" --argjson browser "$browser" --argjson ua "$ua" --argjson contract "$contract" \
            '{status:"READY_FOR_MASTER_INTEGRATED_UA_UI_REVIEW",working_version:"2.7.0",schema:14,migration:"NONE",integration_branch:"integration/v2.7.0-personal-infra",integration_head:$head,integration_tree:$tree,tested_product_runtime_commit:"dced36fd638d54b54741404430965164108d66f7",runtime_exact_to_tested_commit:true,main:$main,develop:$develop,main_develop_unchanged:true,candidate_v2_7_0:"NOT_CREATED",formal_candidate:"NOT_AUTHORIZED",production_ready:"NOT_DECLARED",master_final_visual_gate:"PENDING",product_complete:"NO",production_write:0,user_engineering_action:0,force_push:"NO",history_rewrite:"NO",runtime_contract:$contract,flow:$flow,regression:$regression,browser:$browser,ua_direction:$ua,browser_artifact_metadata:$artifact}' > evidence/p04-v270-final-integration-state.json
          printf 'P04_V270_READY_FOR_MASTER_INTEGRATED_UA_UI_REVIEW\n' > evidence/p04-v270-final-integration-state.PASS
          rm -rf private
      - name: Publish final seal
        shell: bash
        run: |
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/p04-v270-final-integration-state.json evidence/p04-v270-final-integration-state.PASS
          git commit -m 'evidence(P04): seal V2.7 integrated UA review state' || exit 0
          git push origin HEAD:p04-v270-integration-gate
