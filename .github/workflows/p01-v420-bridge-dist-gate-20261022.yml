name: P01 V420 Bridge Distribution Gate (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v420-bridge-dist-gate-20261022.yml'
permissions:
  contents: read
jobs:
  bridge:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify staged P01 bridge channel and exact Release
        env:
          READ_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/core-updates.git" /tmp/update-source
          git -C /tmp/update-source fetch -q origin 2285b0dba5dac33ec592a40750399676d5397156
          git -C /tmp/update-source checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/update-source rev-parse HEAD)" = "2285b0dba5dac33ec592a40750399676d5397156"
          unset READ_TOKEN
          cd /tmp/update-source
          php -l update-core/php/src/UpdateCore.php
          php update-core/php/tests/run.php
          php -r '
            require "update-core/php/src/UpdateCore.php";
            $m=json_decode(file_get_contents("projects/P01.json"),true,512,JSON_THROW_ON_ERROR);
            if($m["target_version"]!=="2.47.420"||$m["from_versions"]!==["2.47.414"]||$m["product_identity"]!=="d8c618ff5e217d6792415172d46b8f8e5898744c")exit(3);
            $c=new \CoreUpdates\UpdateCore("P01","APP");
            if($c->check("2.47.414","2026090401",$m)["status"]!=="AVAILABLE")exit(4);
            foreach(["2.47.413","2.47.415","2.47.416","2.47.417","2.47.418","2.47.419"] as $v)
                if($c->check($v,"2026090401",$m)["status"]==="AVAILABLE")exit(5);
            if($c->check("2.47.414","99999",$m)["status"]==="AVAILABLE")exit(6);
            echo "P01_420_SOURCE_AND_SCHEMA_GATES=PASS\n";
          '
          mkdir /tmp/p01-release
          gh release download v2.47.420 -R llhzx2018/vf-start -D /tmp/p01-release -p VF_Start_V2.47.420_UPDATE.zip
          test "$(stat -c%s /tmp/p01-release/VF_Start_V2.47.420_UPDATE.zip)" = 2688324
          echo '282f9056e4b46dcca1955d7fc477a4bf4b386b8c6e79bc1af8dec81161d77054  /tmp/p01-release/VF_Start_V2.47.420_UPDATE.zip' | sha256sum -c
          test "$(gh api repos/llhzx2018/vf-start/releases/tags/v2.47.420 --jq '.id')" = 420431707
          test "$(gh api repos/llhzx2018/vf-start/releases/tags/v2.47.420 --jq '.assets[] | select(.name=="VF_Start_V2.47.420_UPDATE.zip") | .size')" = 2688324
          echo P01_420_BRIDGE_CHANNEL=PASS
