name: S01 Theme admin page discoverability candidate
# Navigation harness selects real close buttons; no backdrop-center clicks.
on:
  push:
    branches: [task/s01-admin-page-navigation-20261019]
    paths: ['.github/workflows/s01-admin-navigation.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.141
  TARGET_SHA: e4041fe7f2037b8042fa8a3a9c395be63725b52a
jobs:
  navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          ref: 02d4591eed025a3d3a67bc0a150b3ddc448c2ab8
          persist-credentials: false
          path: established
      - name: Reuse established isolated WordPress setup
        run: |
          mkdir -p proof
          cp -a established/lanes/s01-frontend-design-20261017 lane
          cp control/lanes/s01-admin-navigation-20261019/* lane/
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: e4041fe7f2037b8042fa8a3a9c395be63725b52a
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Scope, unchanged header navigation and PHP syntax
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(cat target/VERSION)" = "$TARGET_VERSION"
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,json,re
          base='127d9b7d7431f3ceab167318db44f4fb4b719907'
          changed=subprocess.check_output(['git','-C','target','diff','--name-only',base,'HEAD'],text=True).splitlines()
          expected=['src/inc/admin/admin-shell.php','src/inc/admin/admin-tab-registry.php','src/inc/admin/controllers/layout.php','src/inc/admin/views/layout.php','src/inc/admin/views/frontend-pages.php','src/inc/admin/views/frontend-page-progress-record.php','src/inc/admin/views/brand.php','src/inc/services/admin-workbench-service.php','src/inc/services/frontend-page-directory-service.php','src/assets/css/admin/pages/page-structure/admin-page-layout.css','tests/admin-page-discoverability-wordpress-check.php']
          assert sorted(changed)==sorted(expected),changed
          path='src/inc/admin/admin-shell.php'
          old=subprocess.check_output(['git','-C','target','show',base+':'+path],text=True)
          new=Path('target',path).read_text()
          marker='function vf_theme_admin_primary_nav_items()'
          assert old.split(marker,1)[1]==new.split(marker,1)[1],'shared header navigation changed'
          css='src/assets/css/admin/pages/page-structure/admin-page-layout.css'
          oldcss=subprocess.check_output(['git','-C','target','show',base+':'+css],text=True)
          assert Path('target',css).read_text().startswith(oldcss),'existing layout styles changed'
          Path('proof/source-boundary.json').write_text(json.dumps({'status':'PASS','sha':'e4041fe7f2037b8042fa8a3a9c395be63725b52a','version':'1.35.141','unversioned_working_candidate':True,'changed_files':changed,'shared_header_navigation':'BYTE_IDENTICAL','existing_layout_css':'UNCHANGED_PREFIX','production':'NOT_EXECUTED'},indent=2))
          # Inventory from the existing owner registries/views, not a new runtime registry.
          surfaces=[]
          for name in ['brand','layout','seo','preview','recovery-v510']:
           s=Path('target/src/inc/admin/views',name+'.php').read_text()
           for tag in re.findall(r'<(?:section|div|aside)\b[^>]*\brole="dialog"[^>]*>',s):
            attrs=dict(re.findall(r'([\w-]+)="([^"]*)"',tag))
            identity=attrs.get('id')or next((k+('='+v if v else '')for k,v in attrs.items()if k.startswith('data-vf-')),name)
            surfaces.append({'surface_id':identity,'family':name,'status':'canonical_auxiliary','owning_ui':'existing Theme page CSS and specialized JS','precondition':'safe opener, valid selection or pending dirty/danger operation; do not execute writes in navigation test'})
          Path('proof/auxiliary-source-inventory.json').write_text(json.dumps({'source':'canonical view declarations','count':len(surfaces),'surfaces':surfaces,'dynamic_module_editor':'existing layout editor control; not a separate URL','recovery_tasks':['status','export','import','restore'],'compatibility':[{'surface_id':'Appearance fallback','successor':'Theme component workspace in Ops','status':'intentional compatibility host'},{'surface_id':'ads','successor':'render','status':'registered alias'}],'retired_source_files':'unregistered historical view files are not new live pages'},indent=2))
          PY
          git -C target diff --name-only 127d9b7d7431f3ceab167318db44f4fb4b719907 HEAD | while read -r file;do case "$file" in *.php) php -l "target/$file";;esac;done
          php -l lane/admin-nav-fixture.php
          php -l lane/admin-nav-seed.php
          node --check lane/admin-nav-browser.cjs
      - name: Exact M3U8 fixture dependency
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          mkdir -p provider
          gh release download v1.25.91 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.91.zip --dir provider
          echo 'fcb56d605550c5b04a3ff8b3b78b8bf86ca11b77e0aa22334fa67e675b01d6df  provider/vf-tools-m3u8_V1.25.91.zip' | sha256sum -c
      - name: Chromium and Chinese font
        run: |
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -g -fsSL --retry 2 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC[wght].ttf' -o "$HOME/.local/share/fonts/NotoSansSC.ttf"
          fc-cache -f
      - name: Focused navigation and directory checks in real WordPress
        run: |
          python3 - <<'PY'
          from pathlib import Path
          script=Path('lane/native.sh').read_text()
          fixture='docker cp lane/fixture.php "$WP:/var/www/html/wp-content/mu-plugins/progress-fixture.php"'
          assert script.count(fixture)==1
          script=script.replace(fixture,fixture+'\ndocker cp lane/admin-nav-fixture.php "$WP:/var/www/html/wp-content/mu-plugins/admin-nav-fixture.php"')
          seed='docker cp lane/extra-seed.php "$WP:/tmp/extra-seed.php"'
          assert script.count(seed)==1
          script=script.replace(seed,'docker cp lane/admin-nav-seed.php "$WP:/tmp/admin-nav-seed.php";cli eval-file /tmp/admin-nav-seed.php > proof/admin-nav-seed.json\n'+seed)
          marker='if [ "${VF_REVIEW_ONLY_STATE:-0}" = "1" ];then'
          assert script.count(marker)==1
          script=script.split(marker)[0]+'docker cp target/tests/admin-page-discoverability-wordpress-check.php "$WP:/tmp/admin-check.php"\ncli eval-file /tmp/admin-check.php > proof/admin-route-contract.json\nnode lane/admin-nav-browser.cjs\ncli eval-file /tmp/snapshot.php > proof/state-after.sha256\ncmp proof/state-before.sha256 proof/state-after.sha256\necho PROTECTED_STATE_BYTE_IDENTICAL\n'
          Path('lane/admin-nav-native.sh').write_text(script)
          PY
          bash lane/admin-nav-native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-admin-navigation-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Remove temporary private source
        if: always()
        run: rm -rf target provider
