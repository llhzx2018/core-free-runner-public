name: p01-247495-real-existing-client-discovery-temporary
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-247495-live-discovery.yml']
permissions:
  contents: read
jobs:
  synthetic-existing-installed-discovery:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout public temporary test control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Read-only actual v2.47.494 updater discovers canonical v2.47.495 channel
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          test -n "$GH_TOKEN" && test -n "$VF_PRIVATE_READ_TOKEN"
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd unzip curl >/dev/null
          ROOT="$(mktemp -d /tmp/p01-247495-discovery.XXXXXXXX)"
          SERVER_PID=''
          trap 'test -z "$SERVER_PID" || kill "$SERVER_PID" >/dev/null 2>&1 || true; rm -rf "$ROOT"' EXIT
          mkdir -p "$ROOT/download" "$ROOT/site"
          gh release download v2.47.494 -R llhzx2018/vf-start -D "$ROOT/download" -p 'VF-Start-V2.47.494-FULL.zip'
          unzip -q "$ROOT/download/VF-Start-V2.47.494-FULL.zip" -d "$ROOT/site"
          test "$(tr -d '\r\n ' < "$ROOT/site/VERSION.txt")" = 2.47.494
          php -S 127.0.0.1:18693 -t "$ROOT/site" >"$ROOT/server.log" 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 70); do
            if curl -fsS -c "$ROOT/cookie.txt" -b "$ROOT/cookie.txt" http://127.0.0.1:18693/setup.php -o "$ROOT/setup.html" 2>/dev/null; then break; fi
            sleep 0.2
          done
          test -s "$ROOT/setup.html"
          CSRF="$(python3 -c 'import re,sys;s=open(sys.argv[1]).read();m=re.search(r"name=\"setup_csrf\"\s+value=\"([^\"]+)\"",s);assert m;print(m.group(1))' "$ROOT/setup.html")"
          curl -fsS -b "$ROOT/cookie.txt" -c "$ROOT/cookie.txt" -X POST http://127.0.0.1:18693/setup.php \
            --data-urlencode "setup_csrf=$CSRF" \
            --data-urlencode 'site_title=P01 Atomic Discovery Synthetic' \
            --data-urlencode 'admin_password=P01Synthetic-Discovery-Only!' \
            --data-urlencode 'admin_password_confirm=P01Synthetic-Discovery-Only!' >"$ROOT/installed.html"
          (cd "$ROOT/site" && php cli/verify.php) | grep -Fx VERIFY_PASS=YES
          php -r '
            require $argv[1]."/app/bootstrap.php";
            require_once $argv[1]."/app/UpdateManager.php";
            $manager=new VfUpdateManager(vf_db());
            $r=$manager->check(true);
            if(($r["ok"]??false)!==true ||
               ($r["current_version"]??"")!=="2.47.494" ||
               ($r["latest_version"]??"")!=="2.47.495" ||
               ($r["available"]??false)!==true ||
               ($r["can_update"]??false)!==true ||
               ($r["requirements"]["source_allowed"]??false)!==true){
              fwrite(STDERR,"P01_495_REAL_DISCOVERY=FAIL_REASON_".str_replace("\n"," ",(string)($r["reason"]??"unknown"))."\n");
              exit(1);
            }
            echo "P01_495_REAL_PREVIOUS_INSTALL_DISCOVERY=PASS\n";
            echo "P01_495_REAL_UPDATER_CAN_UPDATE=PASS\n";
            echo "P01_495_REAL_FROM_VERSION_ONLY=PASS\n";
          ' "$ROOT/site"
          test "$(tr -d '\r\n ' < "$ROOT/site/VERSION.txt")" = 2.47.494
          echo P01_495_ONLINE_DISCOVERY_READONLY_NO_INSTALL=PASS
