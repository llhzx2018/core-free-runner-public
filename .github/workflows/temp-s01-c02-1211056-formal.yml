name: S01-C02 V1.21.1056 Formal Release
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: fixture-root
          MARIADB_DATABASE: vf_ops_1056_upgrade
          MARIADB_USER: vf
          MARIADB_PASSWORD: vf-fixture-db
        ports: ["3306:3306"]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      TARGET_REPOSITORY: llhzx2018/vf-tools-ops
      TARGET_SHA: 8873c079039ec44b401c0a706736cdf2d1d1b132
      TARGET_VERSION: 1.21.1056
      RELEASE_TAG: v1.21.1056
      ASSET_NAME: vf-tools-ops_V1.21.1056.zip
      TESTED_RUN_ID: 37710046837
      TESTED_SOURCE_SHA: 0967da760ea9362a3890abb171453b398912f64f
      TESTED_SOURCE_TREE: 64b621debef68cad30f66fc3e7d516a6d95851cd
      TESTED_ARTIFACT: s01-c02-1211056-quality-entry-evidence
      EXPECTED_BYTES: 3528980
      EXPECTED_SHA256: 784ffed0d4587120994f00cc4fe467e8cd0609bfffea0b2c75b8e286026bff72
      EXPECTED_RUNTIME_FILES: 987
      EXPECTED_RUNTIME_FP: 849acedf9fe8860ececf9229874038d98643de310dc1ee7ed2b237953912ef93
      PREVIOUS_TAG: v1.21.1055
      PREVIOUS_ASSET: vf-tools-ops_V1.21.1055.zip
      PREVIOUS_SHA256: 17f3616ae49dd44181011e30468d7eb94a8807d6382d4a22086f45fc09285524
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ env.READ_TOKEN }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, zip, sodium, mbstring

      - name: Verify exact Candidate promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p tested evidence
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TESTED_SOURCE_TREE"
          test "$(tr -d '\r\n' < target/VERSION)" = "$TARGET_VERSION"
          grep -F "Version: $TARGET_VERSION" target/vf-ops.php >/dev/null
          grep -F "S01-V10-QUALITY-TASK-ENTRY-FEEDBACK-CLOSURE" target/vf-ops.php >/dev/null
          test "$(GH_TOKEN="$READ_TOKEN" gh api "repos/$TARGET_REPOSITORY/branches/main" --jq '.commit.sha')" = "$TARGET_SHA"

          gh run download "$TESTED_RUN_ID" --repo llhzx2018/core-free-runner-public --name "$TESTED_ARTIFACT" --dir tested
          test "$(gh run view "$TESTED_RUN_ID" --repo llhzx2018/core-free-runner-public --json conclusion --jq '.conclusion')" = "success"
          jq -e --arg sha "$TESTED_SOURCE_SHA" --arg tree "$TESTED_SOURCE_TREE" --arg ver "$TARGET_VERSION" '
            .status=="PASS"
            and .source_sha==$sha
            and .source_tree==$tree
            and .version==$ver
            and .contracts=="PASS"
            and .browser_task_entry=="PASS"
            and .browser_visual_regression=="PASS"
            and .browser_compact_regression=="PASS"
            and .owner_product_pass==false
            and .production=="NOT_TOUCHED"
          ' tested/FINAL_EVIDENCE.json >/dev/null

          test "$(jq -r '.asset_bytes' tested/package.json)" = "$EXPECTED_BYTES"
          test "$(jq -r '.asset_sha256' tested/package.json)" = "$EXPECTED_SHA256"
          test "$(jq -r '.runtime_files' tested/package.json)" = "$EXPECTED_RUNTIME_FILES"
          test "$(jq -r '.runtime_fingerprint' tested/package.json)" = "$EXPECTED_RUNTIME_FP"

          php target/tests/s01-c02-1211056-quality-task-entry-contract.php
          php target/tests/s01-c02-1211055-quality-center-final-visual-contract.php
          php target/tests/s01-c02-1211054-quality-center-visual-hierarchy-contract.php
          php target/tests/s01-c02-1211053-quality-task-compact-contract.php
          php target/tests/s01-c02-1211052-quality-center-flat-contract.php
          php target/tests/s01-c02-1211051-source-real-run-contract.php
          php target/tests/s01-c02-121934-shell-header-visual-lock-r45-contract.php
          echo EXACT_TESTED_SOURCE=PASS

      - name: Public Authority gate
        run: |
          set -Eeuo pipefail
          jq -e '.owner_delivery_policy.continuous_delivery_for_bounded_mature_admin_iterations==true' target/VF_PROJECT.json >/dev/null
          jq -e '.owner_delivery_policy.OWNER_PREVIEW_RUNTIME_APPLICABILITY=="N_A"' target/VF_PROJECT.json >/dev/null
          test -z "$(git -C target diff --name-only "$PREVIOUS_TAG" "$TARGET_SHA" -- includes/v6/schema.php includes/v6/upgrade-service.php includes/wp-update config | tr -d '\r\n')"
          echo INSTALL=REQUIRED_PASS
          echo SECURITY=REQUIRED_PASS
          echo TESTING=REQUIRED_PASS
          echo UPGRADE=REQUIRED_PASS
          echo DATA_SCHEMA=N_A_NO_SCHEMA_CHANGE
          echo OBSERVABILITY=REQUIRED_PASS
          echo GIT=REQUIRED_PASS
          echo UA_UI=REQUIRED_PASS
          echo PRODUCTION_AUTO_APPLY=NO

      - name: Rebuild exact package and prove rollback source
        env:
          GH_TOKEN: ${{ env.READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          python3 target/.github/release/build-ops-package.py --source target --output "/tmp/$ASSET_NAME" > evidence/package.json
          test "$(jq -r '.asset_bytes' evidence/package.json)" = "$EXPECTED_BYTES"
          test "$(jq -r '.asset_sha256' evidence/package.json)" = "$EXPECTED_SHA256"
          test "$(jq -r '.runtime_files' evidence/package.json)" = "$EXPECTED_RUNTIME_FILES"
          test "$(jq -r '.runtime_fingerprint' evidence/package.json)" = "$EXPECTED_RUNTIME_FP"
          unzip -tq "/tmp/$ASSET_NAME" >/dev/null

          mkdir -p previous
          gh release download "$PREVIOUS_TAG" --repo "$TARGET_REPOSITORY" --pattern "$PREVIOUS_ASSET" --dir previous --clobber
          test "$(sha256sum "previous/$PREVIOUS_ASSET" | awk '{print $1}')" = "$PREVIOUS_SHA256"
          unzip -tq "previous/$PREVIOUS_ASSET" >/dev/null
          echo PACKAGE_AND_ROLLBACK_SOURCE=PASS

      - name: Clean install, upgrade and rollback proof
        run: |
          set -Eeuo pipefail
          TASK_ROOT="$RUNNER_TEMP/s01-ops-1056"
          mkdir -p "$TASK_ROOT"
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o "$TASK_ROOT/wp"
          chmod +x "$TASK_ROOT/wp"

          mysql -h127.0.0.1 -P3306 -uroot -pfixture-root -e 'CREATE DATABASE IF NOT EXISTS vf_ops_1056_clean CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;'

          WP1="$TASK_ROOT/clean"
          mkdir -p "$WP1"
          wp1(){ php "$TASK_ROOT/wp" --path="$WP1" "$@"; }
          wp1 core download --version=7.0.2 --force >/dev/null
          wp1 config create --dbname=vf_ops_1056_clean --dbuser=root --dbpass=fixture-root --dbhost=127.0.0.1:3306 --skip-check >/dev/null
          wp1 core install --url=http://127.0.0.1:18170 --title='Ops Clean 1056' --admin_user=admin --admin_password='Fixture-Ops-1056!' --admin_email=fixture@example.invalid --skip-email >/dev/null
          wp1 plugin install "/tmp/$ASSET_NAME" --activate >/dev/null
          wp1 eval 'if(VF_OPS_VERSION!=="1.21.1056")throw new RuntimeException("CLEAN_VERSION");echo "CLEAN_INSTALL=PASS\n";'

          WP2="$TASK_ROOT/upgrade"
          mkdir -p "$WP2"
          wp2(){ php "$TASK_ROOT/wp" --path="$WP2" "$@"; }
          wp2 core download --version=7.0.2 --force >/dev/null
          wp2 config create --dbname=vf_ops_1056_upgrade --dbuser=vf --dbpass=vf-fixture-db --dbhost=127.0.0.1:3306 --skip-check >/dev/null
          wp2 core install --url=http://127.0.0.1:18171 --title='Ops Upgrade 1056' --admin_user=admin --admin_password='Fixture-Ops-1056!' --admin_email=fixture@example.invalid --skip-email >/dev/null
          wp2 plugin install "$GITHUB_WORKSPACE/previous/$PREVIOUS_ASSET" --activate >/dev/null
          wp2 option update vf_ops_release_1056_sentinel preserve >/dev/null
          wp2 eval 'if(VF_OPS_VERSION!=="1.21.1055")throw new RuntimeException("BASE_VERSION");'

          wp2 plugin install "/tmp/$ASSET_NAME" --force >/dev/null
          wp2 eval 'if(VF_OPS_VERSION!=="1.21.1056")throw new RuntimeException("UPGRADE_VERSION");if(get_option("vf_ops_release_1056_sentinel")!=="preserve")throw new RuntimeException("STATE_CHANGED");echo "UPGRADE=PASS\n";'

          wp2 plugin install "$GITHUB_WORKSPACE/previous/$PREVIOUS_ASSET" --force >/dev/null
          wp2 eval 'if(VF_OPS_VERSION!=="1.21.1055")throw new RuntimeException("ROLLBACK_VERSION");if(get_option("vf_ops_release_1056_sentinel")!=="preserve")throw new RuntimeException("ROLLBACK_STATE");echo "ROLLBACK=PASS\n";'

      - name: Publish formal release
        env:
          GH_TOKEN: ${{ env.WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          cat > notes.md <<'EOF'
          S01-C02 · VF Tools Ops · V1.21.1056

          质量中心任务进入反馈收口
          - 修复 OWNER 点击阶段“处理”后感觉没有反应的问题：质量中心内部任务链接直接落到当前任务区。
          - 点击时按钮立即显示“正在打开…”，加载后自动定位并聚焦当前任务区，同时短暂高亮确认已进入。
          - 源站旧任务已完成且证据过期时，隐藏大块历史进度、路径和耗时，只保留必要控制与当前问题；运行中/暂停中的真实进度保持完整。
          - 1.21.1055 视觉层级、1.21.1053 canonical 证据刷新和成熟 Source/Online/Components/Export 语义保持不变。
          - Shell / Header / Header Menu、Schema、Auth、Updater 与 Production 边界保持不变。
          - Candidate Run: 37710046837
          - exact promoted main: 8873c079039ec44b401c0a706736cdf2d1d1b132
          - tested source: 0967da760ea9362a3890abb171453b398912f64f
          - tested tree: 64b621debef68cad30f66fc3e7d516a6d95851cd
          - SHA256: 784ffed0d4587120994f00cc4fe467e8cd0609bfffea0b2c75b8e286026bff72

          Production remains OWNER-manual; OWNER Product Acceptance remains post-Production.
          EOF

          if gh release view "$RELEASE_TAG" --repo "$TARGET_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh api "repos/$TARGET_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$TARGET_SHA"
          else
            gh release create "$RELEASE_TAG" "/tmp/$ASSET_NAME" --repo "$TARGET_REPOSITORY" --target "$TARGET_SHA" --title "VF Tools Ops V1.21.1056" --notes-file notes.md
          fi

      - name: Remote readback
        env:
          GH_TOKEN: ${{ env.WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          J="$(gh api "repos/$TARGET_REPOSITORY/releases/tags/$RELEASE_TAG")"
          RID="$(jq -r '.id' <<<"$J")"
          AID="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.id' <<<"$J")"
          SIZE="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.size' <<<"$J")"
          test "$(gh api "repos/$TARGET_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$TARGET_SHA"
          test "$SIZE" = "$EXPECTED_BYTES"
          mkdir -p readback evidence
          gh release download "$RELEASE_TAG" --repo "$TARGET_REPOSITORY" --pattern "$ASSET_NAME" --dir readback --clobber
          test "$(sha256sum "readback/$ASSET_NAME" | awk '{print $1}')" = "$EXPECTED_SHA256"
          jq -n --arg release_id "$RID" --arg asset_id "$AID" --arg sha "$EXPECTED_SHA256" --argjson bytes "$EXPECTED_BYTES"             '{status:"PASS",release_id:$release_id,asset_id:$asset_id,asset_sha256:$sha,asset_bytes:$bytes,production:"NOT_TOUCHED",owner_product_pass:false}'             > evidence/FINAL_RELEASE_EVIDENCE.json
          cat evidence/FINAL_RELEASE_EVIDENCE.json
          echo FORMAL_RELEASE_REMOTE_READBACK=PASS

      - name: Upload formal release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s01-c02-1211056-formal-release-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
