name: S01 Article ad layout prototype render
on:
  push:
    branches: [design/s01-article-ad-prototype-20261025]
    paths: ['.github/workflows/s01-article-ad-prototype-20261025.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.188
  TARGET_SHA: 317b59a1c1a5285843a4f20c55611682ac0816c2
  TARGET_TREE: 2da66f8a9d3bdd0d5a689dd2466b8b472f6d1c02
  BASE_SHA: 9c8877792e4af5aef2be1409ee3648c560452d89
jobs:
  prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - name: Exact identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-article-ad-prototype-20261025/spec.json --input control/.github/workflows/s01-article-ad-prototype-20261025.yml
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 317b59a1c1a5285843a4f20c55611682ac0816c2
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: theme
      - name: Render exact offline prototype without a web server
        run: |
          set -euo pipefail
          test "$(git -C theme rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C theme rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(cat theme/VERSION)" = "$TARGET_VERSION"
          python3 - <<'PYSCOPE'
          import subprocess
          files=subprocess.check_output(['git','-C','theme','diff','--name-only','9c8877792e4af5aef2be1409ee3648c560452d89','HEAD']).decode().splitlines()
          assert len(files)==10
          assert all(p.startswith('docs/prototypes/2026-10-25-article-ads/') for p in files)
          print('PROTOTYPE_ONLY_VERSION_AND_RUNTIME_UNCHANGED_PASS')
          PYSCOPE
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts" proof
          curl -g -fsSL --retry 2 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC[wght].ttf' -o "$HOME/.local/share/fonts/NotoSansSC.ttf"
          fc-cache -f
          PROOF_DIR="$PWD/proof" NODE_PATH="$PWD/node_modules" node theme/docs/prototypes/2026-10-25-article-ads/render-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-article-ad-prototype-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private prototype source
        if: always()
        run: rm -rf theme
