name: P05 Classic Retirement Audit
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p05-classic-retirement-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    if: github.event.pull_request.head.ref == 'audit/p05-classic-retirement-20260902'
    runs-on: ubuntu-24.04
    steps:
      - name: Verify private read capability
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo 'P05_CLASSIC_AUDIT_READ_CAPABILITY=PASS'
      - name: Checkout exact P05 main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: cdf194b9a88d29ecda4cd48523d67eb240f0fe7c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Audit classic runtime reachability and references
        run: |
          set -Eeuo pipefail
          echo '=== ROOT ENTRY ==='
          sed -n '1,220p' src/client/main.tsx
          echo '=== CLASSIC SOURCE REFERENCES ==='
          grep -RIn --exclude='App.tsx' --exclude='ProductWorkspaceShortcut.tsx' --exclude='DemoDatasetShortcut.tsx' \
            -E "from ['\"]\./App['\"]|from ['\"].*App['\"]|ProductWorkspaceShortcut|DemoDatasetShortcut|新版工作区 Preview|返回经典工作区|product-v2" \
            src tests || true
          echo '=== CLASSIC EXPORTED UTIL REFERENCES ==='
          for sym in observedNumber keywordTrendCoverage fmtNumber fmtPercent; do
            echo "--- $sym ---"
            grep -RIn --exclude='App.tsx' "$sym" src tests || true
          done
          echo '=== COMMON SYSTEM / PRODUCT PARITY MARKERS ==='
          grep -n "p05v2-secondary\|系统维护\|系统信息\|系统基线\|在线升级\|备份与恢复\|运行健康" src/client/CommonSystemCenter.tsx | head -n 80
          grep -n "Site Portfolio\|全局搜索\|数据源\|设置\|Demo Dataset\|系统与更新" src/client/ProductApp.tsx src/client/UpdateShortcut.tsx | head -n 120
          echo '=== FILE SIZES ==='
          wc -c src/client/App.tsx src/client/ProductWorkspaceShortcut.tsx src/client/DemoDatasetShortcut.tsx
          echo 'P05_CLASSIC_RETIREMENT_AUDIT=PASS'
