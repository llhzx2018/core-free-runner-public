name: P01 V2.47.442 exact update-channel proof (one-shot)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-update-channel-proof-v247442.yml'

permissions:
  contents: read

jobs:
  exact-channel-proof:
    if: github.actor == 'llhzx2018' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Read exact P01 channel candidate from private authoritative repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: 7b32ecbac36de130bfc956d6797521f8b7930875
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false

      - name: Check immutable source and exact formal release asset manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 7b32ecbac36de130bfc956d6797521f8b7930875
          python3 scripts/check_manifest_contract.py
          jq -e '
            .project_id == "P01" and .component_id == "APP" and .enabled == true and
            .current_version == "2.47.441" and .target_version == "2.47.442" and
            .from_versions == ["2.47.441"] and .schema_from == .schema_to and
            .release_tag == "v2.47.442" and .release_id == 421701332 and
            .product_identity == "3d7a408f26b7061076f8c188dc89918520193c91" and
            .asset_name == "VF_Start_V2.47.442_UPDATE.zip" and .asset_bytes == 2876746 and
            .asset_sha256 == "ea3a917cab9e7cda2172dc9272e09904a377e274917af37bd0c346f0e1974a08" and
            .backup_required == true and .rollback_supported == true
          ' projects/P01.json
          echo P01_CHANNEL_CONTRACT=PASS

      - name: Check PHP updater syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          echo P01_UPDATE_CORE_PHP_SYNTAX=PASS

      - name: Run native Update Core V1 regression
        shell: bash
        run: |
          set -Eeuo pipefail
          php update-core/php/tests/run.php
          echo P01_UPDATE_CORE_TEST=PASS

      - name: Confirm formal Release is bound to exact product commit and zip digest
        shell: bash
        env:
          GH_READ: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_READ"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_READ" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/llhzx2018/vf-start/releases/tags/v2.47.442 \
            | jq -e '
              .id == 421701332 and .tag_name == "v2.47.442" and
              (.assets | any(.name == "VF_Start_V2.47.442_UPDATE.zip" and
                .size == 2876746 and
                .digest == "sha256:ea3a917cab9e7cda2172dc9272e09904a377e274917af37bd0c346f0e1974a08"))
            '
          echo P01_FORMAL_ASSET_MATCH=PASS
