name: P07 release93 sealed formal publication (manual archive)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p07-release93-formal-publication
  cancel-in-progress: false
jobs:
  publish:
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_REPO: llhzx2018/core-free-runner-public
      RELEASE_TAG: p07-v0.1.0-release93
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact merged bytes and fail-closed trust chain
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN" || { echo P07_RELEASE_WRITE_CAPABILITY_MISSING; exit 78; }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api repos/$RELEASE_REPO/git/ref/heads/main --jq '.object.sha')" = "$GITHUB_SHA" || { echo P07_MAIN_MOVED; exit 78; }
          root=dist/p07/0.1.0/overlay
          care=packages/p07-system-care/0.1.0-rc62
          test "$(cat "$root/BUILD_ID")" = '0.1.0-release93'
          test "$(cat "$care/VERSION")" = '0.1.0-rc62'
          test "$(git hash-object "$root/RUNTIME.gitblob")" = 0063428e1441e22d40612fd49321d77feaf29522
          test "$(git hash-object "$root/MANIFEST.gitblob")" = 5c36c5796cad55c0f11b66046b7e9b76a2a38ac1
          test "$(git hash-object "$care/MANIFEST.gitblob")" = bdae0b9f6cc3cd2ed521fcdfb97e028ece620477
          (cd "$root"; while read -r sha file; do test "$(git hash-object "$file")" = "$sha"; done < RUNTIME.gitblob)
          (cd "$root"; while read -r sha file; do test "$(git hash-object "$file")" = "$sha"; done < MANIFEST.gitblob)
          (cd "$care"; while read -r sha file; do test "$(git hash-object "$file")" = "$sha"; done < MANIFEST.gitblob)
          test "$(git hash-object installers/p07-final.sh)" = 5ffee8aced253bd4efb7c4a739b5eb3ae08d784b
          test "$(git hash-object installers/p07.sh)" = c09767a6bd8179b0cc8bce31a90a2c88dead2b21
          test "$(git hash-object installers/p07-toolbox.sh)" = 7213b629537a658a588b0afab16139b52a230041
          test "$(git hash-object installers/p07-system-care.sh)" = f945d75172542ee57d5c4f5669fc73375a9a1e04
          grep -Fq 'EXPECTED_BLOB="5ffee8aced253bd4efb7c4a739b5eb3ae08d784b"' installers/p07.sh
          grep -Fq 'EXPECTED_BUILD_ID="0.1.0-release93"' installers/p07-final.sh
          grep -Fq 'RUNTIME_MANIFEST_BLOB="0063428e1441e22d40612fd49321d77feaf29522"' installers/p07-final.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release93"' installers/p07-toolbox.sh
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc62"' installers/p07-toolbox.sh
          grep -Fq "MANIFEST_BLOB='bdae0b9f6cc3cd2ed521fcdfb97e028ece620477'" installers/p07-system-care.sh
          bash -n installers/p07.sh installers/p07-final.sh installers/p07-toolbox.sh installers/p07-system-care.sh
          echo P07_RELEASE93_EXACT_MERGED_PREFLIGHT_PASS
      - name: Formal GitHub release with exact target readback
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view "$RELEASE_TAG" -R "$RELEASE_REPO" >/dev/null 2>&1; then
            test "$(gh api repos/$RELEASE_REPO/git/ref/tags/$RELEASE_TAG --jq '.object.sha')" = "$GITHUB_SHA" || { echo P07_RELEASE_TAG_COLLISION; exit 81; }
          else
            gh release create "$RELEASE_TAG" -R "$RELEASE_REPO" --target "$GITHUB_SHA" \
              --title 'P07 · release93 · 正式网站数据工具与 System Care rc62' \
              --notes 'P07 release93 / System Care rc62. Exact private candidate 740e3f0adbf656f06bfcffa8016cff08f1c541ad; merged private source main a14a80d2693fa9326e4b6262ffbbb0f03fdc1348 same source tree. Registered Public Runner SQL diagnostic confidentiality and conditional trigger loss rejection PASS. Isolated clean install, release92 to release93 upgrade, idempotence, corrupt-download rejection and rollback PASS. On mismatched conditional DDL, verification still fails closed and reports bounded SQL_DIFF_V1 line-category equality only; never suppresses schema, trigger, row or index mismatch. Production CP2 manual upgrade, resumed migration and DNS cutover are separate OWNER gates.'
          fi
          test "$(gh api repos/$RELEASE_REPO/git/ref/tags/$RELEASE_TAG --jq '.object.sha')" = "$GITHUB_SHA"
          test "$(gh api repos/$RELEASE_REPO/releases/tags/$RELEASE_TAG --jq '.target_commitish')" = "$GITHUB_SHA"
          test "$(gh api repos/$RELEASE_REPO/releases/tags/$RELEASE_TAG --jq '.draft')" = false
          test "$(gh api repos/$RELEASE_REPO/releases/tags/$RELEASE_TAG --jq '.prerelease')" = false
          echo P07_RELEASE93_GITHUB_RELEASE_PASS
      - name: Upload exact installer assets and read back identities
        shell: bash
        run: |
          set -Eeuo pipefail
          gh release upload "$RELEASE_TAG" -R "$RELEASE_REPO" --clobber installers/p07.sh installers/p07-final.sh installers/p07-toolbox.sh installers/p07-system-care.sh
          mkdir -p /tmp/p07-release93-assets
          gh release download "$RELEASE_TAG" -R "$RELEASE_REPO" --dir /tmp/p07-release93-assets
          for name in p07.sh p07-final.sh p07-toolbox.sh p07-system-care.sh; do
            test -f "/tmp/p07-release93-assets/$name"
            test "$(git hash-object "/tmp/p07-release93-assets/$name")" = "$(git hash-object "installers/$name")"
          done
          echo P07_RELEASE93_ASSET_READBACK_PASS
      - name: Public installer raw-byte distribution readback
        shell: bash
        run: |
          set -Eeuo pipefail
          remote="https://raw.githubusercontent.com/$RELEASE_REPO/$GITHUB_SHA"
          for item in 'installers/p07.sh c09767a6bd8179b0cc8bce31a90a2c88dead2b21' 'installers/p07-final.sh 5ffee8aced253bd4efb7c4a739b5eb3ae08d784b' 'installers/p07-toolbox.sh 7213b629537a658a588b0afab16139b52a230041' 'installers/p07-system-care.sh f945d75172542ee57d5c4f5669fc73375a9a1e04' 'dist/p07/0.1.0/overlay/RUNTIME.gitblob 0063428e1441e22d40612fd49321d77feaf29522'; do
            read -r file sha <<< "$item"
            curl -fsSL --retry 5 --retry-delay 2 --proto '=https' --tlsv1.2 "$remote/$file" -o /tmp/p07-release93-remote
            test "$(git hash-object /tmp/p07-release93-remote)" = "$sha"
          done
          echo P07_RELEASE93_REMOTE_DISTRIBUTION_READBACK_PASS
