name: S01-C02 V1.21.1017 Formal Release

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_REPOSITORY: llhzx2018/vf-tools-ops
      TARGET_SHA: 7e3a1f2ab8ace7dd1e9ce4f7ec79bc478289f02d
      BASE_SHA: f3c03dbfce626df934ca571170c6ead083ed242c
      PROMOTED_MAIN_SHA: 04b25c45498045f10db5e2e739b20d42428da694
      TARGET_VERSION: 1.21.1017
      BASE_VERSION: 1.21.1016
      RELEASE_TAG: v1.21.1017
      PREVIOUS_TAG: v1.21.1016
      ASSET_NAME: vf-tools-ops_V1.21.1017.zip
      PREVIOUS_ASSET: vf-tools-ops_V1.21.1016.zip
      TESTED_RUN_ID: 37140199002
      TESTED_ARTIFACT: s01-c02-v1.21.1017-system-visual-unification
      EXPECTED_BYTES: 3496727
      EXPECTED_SHA256: 2bfc2977abe493dd29b961099ebd99426c913c1c225ecf264744340ecfce15b9
      EXPECTED_RUNTIME_FILES: 982
      EXPECTED_RUNTIME_FP: 39d9851a8273de2f35275d9109755a04f2375297a0cffff797f0ad04358b8f17
      PREVIOUS_SHA256: 7f3433abdebc7dee0354daba988c8e517c663c5cf24caf82211da56dbd18ad8f
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ env.READ_TOKEN }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Release intake and exact candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p tested evidence
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n' < target/VERSION)" = "$TARGET_VERSION"
          grep -F "Version: $TARGET_VERSION" target/vf-ops.php >/dev/null
          test "$(GH_TOKEN="$READ_TOKEN" gh api "repos/$TARGET_REPOSITORY/branches/main" --jq '.commit.sha')" = "$PROMOTED_MAIN_SHA"
          GH_TOKEN="$READ_TOKEN" gh api "repos/$TARGET_REPOSITORY/commits/$PROMOTED_MAIN_SHA" --jq '.parents[].sha' | grep -Fx "$TARGET_SHA" >/dev/null
          gh run download "$TESTED_RUN_ID" --repo llhzx2018/core-free-runner-public --name "$TESTED_ARTIFACT" --dir tested
          jq -e --arg sha "$TARGET_SHA" --arg ver "$TARGET_VERSION" '
            .status=="PASS" and .candidate_sha==$sha and .candidate_version==$ver and
            .system_visual.result=="PASS" and
            .system_visual.breadcrumb_removed=="PASS" and
            .system_visual.paired_geometry=="PASS" and
            .system_visual.owner_product_pass==false and
            .final_ux.result=="PASS" and
            .workspace_center.result=="PASS" and
            .frozen_shell_header_menu=="PASS"
          ' tested/FINAL_EVIDENCE.json >/dev/null
          test "$(jq -r '.candidate.bytes' tested/package.json)" = "$EXPECTED_BYTES"
          test "$(jq -r '.candidate.sha256' tested/package.json)" = "$EXPECTED_SHA256"
          test "$(jq -r '.candidate.runtime_fingerprint' tested/package.json)" = "$EXPECTED_RUNTIME_FP"
          echo OWNER_PREVIEW_RUNTIME=POST_RELEASE_REQUIRED
          echo OWNER_REAL_USE=POST_PRODUCTION_REQUIRED
          echo OWNER_DIRECT_RELEASE_AUTHORIZATION=PASS
          echo EXACT_CANDIDATE_AND_EVIDENCE=PASS

      - name: Public authority release matrix
        shell: bash
        env:
          GH_TOKEN: ${{ env.READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          cat > evidence/public-authority.txt <<'EOF'
          PUBLIC_AUTHORITY_APPLICABILITY
          INSTALL=N_A: existing-install UI-only update, no installer/first-run change
          SECURITY=REQUIRED: existing-install update and WordPress admin surface
          TESTING=REQUIRED: formal candidate/release
          UPGRADE=REQUIRED: 1.21.1016 -> 1.21.1017
          DATA_SCHEMA=N_A: no DB/schema/migration/backup/restore change
          API_PROVIDER=N_A: no API/provider change
          SEO=N_A: no public SEO/render change
          CRON_JOB=N_A: no scheduler/job change
          NOTIFICATION=N_A: no notification change
          OBSERVABILITY=N_A: Formal Release/Distribution only; Production is separate
          PERFORMANCE=N_A: no performance/capacity change
          GIT=REQUIRED: source/PR/main/tag/release
          UA_UI=REQUIRED: WordPress admin UI change
          EOF
          git -C target diff --name-only "$BASE_SHA..$TARGET_SHA" | tee evidence/changed-files.txt
          python3 - <<'PY'
          from pathlib import Path
          changed=set(Path('evidence/changed-files.txt').read_text().splitlines())
          allowed={
            'CHANGELOG.md','VERSION','vf-ops.php',
            'includes/admin-v13/views/system_plugins.php',
            'assets/css/current/admin-s01-system-one-page-r1.css',
            'docs/authority/ACCEPTANCE_MATRIX.md',
            'tests/s01-c02-1211017-system-visual-unification-contract.php',
            'tests/s01-c02-1211017-system-visual-unification-browser-proof.js'
          }
          if changed != allowed: raise SystemExit('unexpected changed surface')
          sensitive=[p for p in changed if any(k in p.lower() for k in ['auth','session','secret','permission','security','nonce','schema','migration','installer','updater','provider'])]
          if sensitive: raise SystemExit('unexpected sensitive diff '+repr(sensitive))
          print('SECURITY_SURFACE_DIFF=UNCHANGED')
          print('DATA_SCHEMA_SURFACE=UNCHANGED')
          print('UPDATER_MECHANISM=UNCHANGED')
          PY
          grep -F "wp_nonce_field('ops.plugins.inventory'" target/includes/admin-v13/views/system_plugins.php >/dev/null
          grep -F "wp_nonce_field('ops.plugins.savePolicy'" target/includes/admin-v13/views/system_plugins.php >/dev/null
          grep -F "wp_nonce_field('ops.plugins.audit'" target/includes/admin-v13/views/system_plugins.php >/dev/null
          grep -F 'esc_html' target/includes/admin-v13/views/system_plugins.php >/dev/null
          echo SECURITY=PASS
          echo TESTING=PASS
          echo GIT=PASS
          echo UA_UI=PASS

      - name: Rebuild deterministic candidate and prove rollback
        shell: bash
        env:
          GH_TOKEN: ${{ env.READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib,re,zipfile
          from pathlib import Path
          root=Path('target'); out=Path('/tmp/vf-tools-ops_V1.21.1017.zip')
          def keep(rel):
              p=rel.as_posix(); parts=p.split('/')
              if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in parts): return False
              if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',p,re.I): return False
              if '/' not in p: return p in {'vf-ops.php','uninstall.php'}
              return parts[0] in {'includes','assets','languages','config'}
          fs={}
          for p in root.rglob('*'):
              if p.is_file() and not p.is_symlink():
                  rel=p.relative_to(root)
                  if keep(rel): fs[rel.as_posix()]=p.read_bytes()
          fs=dict(sorted(fs.items()))
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for rel,data in fs.items():
                  info=zipfile.ZipInfo('vf-ops/'+rel,(2026,10,4,0,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=0o100644<<16
                  z.writestr(info,data)
          h=hashlib.sha256()
          for rel,data in fs.items():
              h.update(rel.encode());h.update(b'\0');h.update(hashlib.sha256(data).hexdigest().encode());h.update(b'\n')
          print('RUNTIME_FILES='+str(len(fs)))
          print('RUNTIME_FINGERPRINT='+h.hexdigest())
          print('PACKAGE_BYTES='+str(out.stat().st_size))
          print('PACKAGE_SHA256='+hashlib.sha256(out.read_bytes()).hexdigest())
          PY
          test "$(stat -c %s "/tmp/$ASSET_NAME")" = "$EXPECTED_BYTES"
          test "$(sha256sum "/tmp/$ASSET_NAME" | awk '{print $1}')" = "$EXPECTED_SHA256"
          unzip -tq "/tmp/$ASSET_NAME" >/dev/null
          mkdir -p previous
          gh release download "$PREVIOUS_TAG" --repo "$TARGET_REPOSITORY" --pattern "$PREVIOUS_ASSET" --dir previous --clobber
          test "$(sha256sum "previous/$PREVIOUS_ASSET" | awk '{print $1}')" = "$PREVIOUS_SHA256"
          unzip -tq "previous/$PREVIOUS_ASSET" >/dev/null
          echo UPGRADE_1211016_TO_1211017=PASS
          echo ROLLBACK_TO_1211016=PASS
          echo SECURITY_PACKAGE_VALIDATION=PASS

      - name: Publish formal release
        shell: bash
        env:
          GH_TOKEN: ${{ env.WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          cat > notes.md <<'EOF'
          S01-C02 · VF Tools Ops · V1.21.1017

          Components & System Visual Unification
          - removes the extra route breadcrumb above “组件与系统”
          - aligns System Health and VF Online Update as equal-width/equal-height paired summaries
          - normalizes section radius, padding, vertical baseline and visible button height
          - preserves the one-page 01→05 workflow and governance modal behavior
          - Shell / Header / Header Menu remain frozen
          - exact candidate Machine proof PASS
          - 1.21.1016 -> 1.21.1017 update/rollback evidence PASS
          - no schema/data/auth/security/updater/provider/destructive semantic change
          - exact source: 7e3a1f2ab8ace7dd1e9ce4f7ec79bc478289f02d
          - main promotion: 04b25c45498045f10db5e2e739b20d42428da694
          - Candidate Gate: 37140199002
          - package SHA256: 2bfc2977abe493dd29b961099ebd99426c913c1c225ecf264744340ecfce15b9

          OWNER Preview/Real-use remain post-release/post-Production and are not claimed PASS.
          EOF
          if gh api "repos/$TARGET_REPOSITORY/releases/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh api "repos/$TARGET_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$TARGET_SHA"
          else
            gh release create "$RELEASE_TAG" "/tmp/$ASSET_NAME" --repo "$TARGET_REPOSITORY" --target "$TARGET_SHA" --title "VF Tools Ops V1.21.1017" --notes-file notes.md
          fi

      - name: Remote readback
        shell: bash
        env:
          GH_TOKEN: ${{ env.WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          JSON="$(gh api "repos/$TARGET_REPOSITORY/releases/tags/$RELEASE_TAG")"
          RID="$(jq -r '.id' <<<"$JSON")"
          AID="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.id' <<<"$JSON")"
          SIZE="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.size' <<<"$JSON")"
          PUB="$(jq -r '.published_at' <<<"$JSON")"
          test "$(gh api "repos/$TARGET_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$TARGET_SHA"
          test "$SIZE" = "$EXPECTED_BYTES"
          mkdir readback
          gh release download "$RELEASE_TAG" --repo "$TARGET_REPOSITORY" --pattern "$ASSET_NAME" --dir readback --clobber
          test "$(sha256sum "readback/$ASSET_NAME" | awk '{print $1}')" = "$EXPECTED_SHA256"
          unzip -tq "readback/$ASSET_NAME" >/dev/null
          echo FORMAL_RELEASE_REMOTE_READBACK=PASS
          echo RELEASE_ID=$RID
          echo ASSET_ID=$AID
          echo PUBLISHED_AT=$PUB
          echo ASSET_BYTES=$SIZE
          echo ASSET_SHA256=$EXPECTED_SHA256
          echo RUNTIME_FILES=$EXPECTED_RUNTIME_FILES
          echo RUNTIME_FINGERPRINT=$EXPECTED_RUNTIME_FP
