name: P01 V2.32 Home Command Center Final Gate V7
on:
  push:
    branches: [task/p01-v232-home-command-center-20260829]
    paths:
      - .github/workflows/p01-v232-home-command-center-20260829.yml
      - scripts/p01-v232-home-command-center-v4.sh
      - scripts/p01-v232-home-command-center-v5.sh
      - scripts/p01-v232-home-command-center-v6.sh
      - scripts/p01-v232-home-command-center-v7.sh
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PRODUCT: ${{ github.workspace }}/product
      ROOT: ${{ github.workspace }}/product/src
      PORT: '18642'
      ADMIN_PASS: 'P01V232!HomeGate'
      EVID: /tmp/p01-v232-home-evidence
      SOURCE: 367050057ae5abfaad896d72337123d526de8b58
      SOURCE_TREE: 3fd3f613757d74230a3850be2842459149a0e1e4
      BASE_SOURCE: f7c14b70dda991ac5fc8b25140eb558fd54009d6
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: 367050057ae5abfaad896d72337123d526de8b58
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Home command center final authoritative machine and browser gate V7
        shell: bash
        run: bash runner/scripts/p01-v232-home-command-center-v7.sh
      - name: Upload V2.32 final Home evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-v232-home-command-center-v7-evidence-${{ github.run_id }}
          path: /tmp/p01-v232-home-evidence
          if-no-files-found: warn
          retention-days: 30
