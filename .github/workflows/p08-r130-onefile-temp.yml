name: P08 R130 onefile future official next package fail-closed source (TEMP)
on:
  pull_request:
    paths: [.github/workflows/p08-r130-onefile-temp.yml]
permissions:
  contents: read
jobs:
  template-and-negative:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - name: PHP8.4 and Python
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: sqlite3,pdo_sqlite,pdo_mysql,posix,zip
      - name: Exact private source temporary
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: ff049dfec15bd05adede69fb340d4d1cdf031269
          path: p08-source
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: New onefile R130 source syntax, refusal and old Worker regression
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rm -rf -- "$GITHUB_WORKSPACE/p08-source"' EXIT
          cd p08-source
          test "$(git rev-parse HEAD)" = ff049dfec15bd05adede69fb340d4d1cdf031269
          php -l src/Upgrade/R130Official013ForwardActivation.php
          php -l scripts/r130_owner_forward_once.php
          php -l scripts/R130OwnerWorkerFragment.php
          python3 -B -m py_compile scripts/build_r130_onefile.py
          python3 -B - <<'PY'
          from pathlib import Path
          p=Path('scripts/build_r130_onefile.py')
          t=p.read_text()
          assert 'R130_OFFICIAL_NEXT_FULL_REQUIRED' in t
          assert 'GITHUB_ACTIONS' in t and 'P08_R130_ISOLATED' in t
          assert 'OLD_ZIP_SHA256' in t and '80556ab606aec608' in t
          assert 'R130_ATOMIC_MEMBER_HASH_CHANGED' in t
          q=Path('scripts/r130_owner_forward_once.php').read_text()
          w=Path('scripts/R130OwnerWorkerFragment.php').read_text()
          assert '__halt_compiler();' in q and 'password_verify(' in q
          assert 'proc_open([' in q and "session.use_strict_mode" in q
          assert "R130_ACTIVE_SHA" in q and 'R130_SOURCE_SHA' in q
          assert "R130Official013ForwardActivation" in w
          assert "R130_BRIDGE_MANIFEST_SHA256" in w
          assert 'systemctl' not in q and '/etc/nginx' not in q
          print("P08_R130_OWNER_ONEFILE_SOURCE_AUTH_AND_ROOTLESS_CLI=PASS")
          PY
          php tests/test_r129_installed_013_source.php || true
          php tests/test_r128_official_forward_metadata.php
          php tests/test_r127_owner_cycle_handoff.php
          php tests/test_owner_site_worker_dispatcher.php
          echo P08_R130_PHP_ONEFILE_AND_BACKUP_HANDOFF_PRELIM=PASS
      - name: Always purge private source
        if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/p08-source"
