name: S01 Guides pagination focused proof
on:
  push:
    branches: [task/s01-guide-pagination184-20261024]
    paths: ['.github/workflows/s01-guide-pagination184-20261024.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.184
  TARGET_SHA: e7ce9abb45d853a5cf37eb1966a196e0f037ee1f
  TARGET_TREE: 19f0a0fc4a9976b8e9de344af5a757be49a608c4
  BASE_SHA: ba2d556e5f6eccd9c6a01d0b6d36d562f3014e3c
  SOURCE_VERSION: 1.35.183
  LANE_ID: s01-guide-pagination184-20261024
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          ref: 02d4591eed025a3d3a67bc0a150b3ddc448c2ab8
          persist-credentials: false
          path: established
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: e7ce9abb45d853a5cf37eb1966a196e0f037ee1f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact package and focused syntax checks
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider baseline
          python3 control/lanes/s01-guide-pagination184-20261024/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-guide-pagination184-20261024/spec.json --input control/.github/workflows/s01-guide-pagination184-20261024.yml
          python3 control/lanes/s01-guide-pagination184-20261024/package.py
          php -l target/src/inc/public-css-owner-registry.php
          node --check control/lanes/s01-guide-pagination184-20261024/pagination.cjs
          node --check control/lanes/s01-guide-pagination184-20261024/clean.cjs
          gh release download v1.35.183 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.183.zip --dir provider
          echo 'a219ab710ff1f80d4dd521a37d4a021c6475e6342d44997e7995a70350577cdb  provider/vf-tools-theme_V1.35.183.zip' | sha256sum -c
          gh release download v1.25.94 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.94.zip --dir provider
          echo '70b90d40da5d69fc7819bd7ada3f15fb0145e64822b788bd94956c7827b2df03  provider/vf-tools-m3u8_V1.25.94.zip' | sha256sum -c
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -g -fsSL --retry 2 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC[wght].ttf' -o "$HOME/.local/share/fonts/NotoSansSC.ttf"
          fc-cache -f
      - name: Native WordPress tools directory and upgrade rollback data protection
        run: |
          set -euo pipefail
          cp -a established/lanes/s01-frontend-design-20261017 lane
          cp control/lanes/s01-guide-pagination184-20261024/clean.cjs lane/warm-admin.cjs
          bash control/lanes/s01-guide-pagination184-20261024/native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-home-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target baseline provider

# Evidence capture uses viewport clip coordinates after scrollIntoView.
