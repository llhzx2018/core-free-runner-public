name: P04 VF Infra V2.7.2 Formal Release

on:
  pull_request:
    branches: [main]
    paths:
      - 'p04-v272-release-trigger.txt'

permissions:
  contents: read

concurrency:
  group: p04-v272-formal-release
  cancel-in-progress: false

jobs:
  formal-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact V2.7.2 candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: 979e2920326b00de1548e387a5f90bf6e22fd1d6
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
          fetch-depth: 2
          path: private-vf-infra-target

      - name: Checkout exact V2.7.1 production release source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: f14deef2748935069e17781d4a79214a2d8b8b5f
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-vf-infra-source

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, fileinfo, sodium, zip, curl, mbstring
          coverage: none

      - name: Derive V2.7.2 release harness from proven P04 Atomic contract
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/d02df7406a5eb3eb106e32754fac76f89a2dc897/.github/scripts/p04-v270-formal-release.sh' -o "$RUNNER_TEMP/p04-v272-formal-release.sh"
          python3 - "$RUNNER_TEMP/p04-v272-formal-release.sh" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text(encoding='utf-8')
          replacements={
            'TARGET_COMMIT="e2fd12cce0518333d7aa15e9d5babc5db0c9043b"':'TARGET_COMMIT="979e2920326b00de1548e387a5f90bf6e22fd1d6"',
            'TARGET_PARENT="f86d79b871cf05c90af922afeb9fca851faf7c54"':'TARGET_PARENT="b2ce521f77d6a14b939103a768e3e3ec76cda6e5"',
            'TARGET_TREE="0395a8b8b702faee2f7d2bbab7a3b65ee98915e9"':'TARGET_TREE="460bac9d24dbf0b5e3d77cac06685eb8ebed5a5b"',
            'SOURCE_COMMIT="b8d080e432ba811f6689372636022774e558ffc1"':'SOURCE_COMMIT="f14deef2748935069e17781d4a79214a2d8b8b5f"',
            'SOURCE_TREE="181cb02c1305500006f8cfe70a0e05bdf3ad7225"':'SOURCE_TREE="e0b1ed2c63584a477e65e0dae30cdc22dff60262"',
            'EXPECTED_RUNTIME_FILES="185"':'EXPECTED_RUNTIME_FILES="190"',
            'EXPECTED_RUNTIME_FINGERPRINT="996165dcadb5100fc68cd47515b28a6bc71e6e6f8b2fe7e7fe7713dcbe765401"':'EXPECTED_RUNTIME_FINGERPRINT="625a68e3e960904a709f9651fbb83a77b09af39416f25aac86589e4f70a032ef"',
            "'tested_runtime_parent':'f86d79b871cf05c90af922afeb9fca851faf7c54'":"'tested_runtime_source':'979e2920326b00de1548e387a5f90bf6e22fd1d6'",
          }
          for a,b in replacements.items():
              if a not in s: raise SystemExit('V272_RELEASE_SENTINEL_MISSING: '+a)
              s=s.replace(a,b,1)
          s=s.replace('vfi270','vfi272').replace('atomic_270','atomic_272')
          s=s.replace('P04_V270','P04_V272').replace('p04-v270','p04-v272').replace('V270_','V272_')
          s=s.replace('V2.7.0','__TARGET_UPPER__').replace('V2.6.0','__SOURCE_UPPER__')
          s=s.replace('v2.7.0','__TAG__').replace('2.7.0','__TARGET__').replace('2.6.0','__SOURCE__')
          s=s.replace('__TARGET_UPPER__','V2.7.2').replace('__SOURCE_UPPER__','V2.7.1')
          s=s.replace('__TAG__','v2.7.2').replace('__TARGET__','2.7.2').replace('__SOURCE__','2.7.1')
          s=s.replace('Reference-Locked Personal Infrastructure Runtime 与最终 UI 精修','个人后台细节 UX 治理')
          s=s.replace('完成 Reference-Locked Personal Infrastructure Runtime 与最终 UI 精修','完成分页、选择器、提醒节点与管理细节 UX 优化')
          p.write_text(s,encoding='utf-8')
          PY
          chmod +x "$RUNNER_TEMP/p04-v272-formal-release.sh"
          grep -F 'TARGET_VERSION="2.7.2"' "$RUNNER_TEMP/p04-v272-formal-release.sh"
          grep -F 'SOURCE_VERSION="2.7.1"' "$RUNNER_TEMP/p04-v272-formal-release.sh"
          grep -F 'TAG="v2.7.2"' "$RUNNER_TEMP/p04-v272-formal-release.sh"

      - name: Build verify publish and remote-readback V2.7.2
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: bash "$RUNNER_TEMP/p04-v272-formal-release.sh"

      - name: Remove private source and package bytes
        if: always()
        shell: bash
        run: |
          rm -rf private-vf-infra-target private-vf-infra-source
          rm -rf "$RUNNER_TEMP/p04-v272-formal" "$RUNNER_TEMP/p04-v272-assets"
          rm -f "$RUNNER_TEMP/p04-v272-formal-release.sh"

      - name: Upload public-safe release evidence only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: P04-VF-Infra-V2.7.2-Formal-Release-Evidence
          path: p04-v272-release-evidence
          if-no-files-found: error
          retention-days: 14
