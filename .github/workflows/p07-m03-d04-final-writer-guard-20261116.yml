name: P07 M03 D04 final writer guard exact private source offline gate
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p07-m03-d04-final-writer-guard-20261116.yml']
permissions:
  contents: read
jobs:
  d04-final-source-writer-safety:
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout temporary public verification harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact private P07 candidate only in transient workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 558e61debffe00d86f8a8a754c9783d33e50aa60
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: .p07-private
      - name: Read current GOV-DOC architecture authority transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: .gov-public
      - name: Run exact-source offline writer/failure tests, D04 regressions and architecture
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-private rev-parse HEAD)" = "558e61debffe00d86f8a8a754c9783d33e50aa60"
          PRIVATE="$PWD/.p07-private"
          GOV="$PWD/.gov-public"
          cd "$PRIVATE"
          for file in             test_p07_m03_d04_final_sync_guard.py             test_p07_m03_d04_single_site_cutover_guard.py             test_p07_m03_d04_prepared_static_online_snapshot.py             test_p07_m03_source_sql_safety_preimport.py             test_p07_m03_d04_matched_engine.py; do
            python3 -B -m unittest discover -s tests -p "$file" -q
          done
          echo P07_D04_FINAL_WRITER_GUARD_OFFLINE_NEGATIVE_REGRESSIONS=PASS
          python3 -B .github/checks/test_architecture_gate.py -q
          python3 -B scripts/check_p07_modules.py
          python3 -B scripts/check_p07_terminal_ux.py
          python3 -B .github/checks/architecture_gate.py             --manifest "$PRIVATE/.github/checks/code_architecture.json"             --gov-root "$GOV" --git-root "$PRIVATE"             --base-sha 905599e8ca6ac6fd766856c35301328388b3eb81             --head-sha 558e61debffe00d86f8a8a754c9783d33e50aa60
          echo P07_D04_FINAL_WRITER_GUARD_ARCH_NAMING_MODULE_UX=PASS
          echo P07_D04_TWO_CLOUDPANEL_FINAL_SYNC=NOT_RUN
          echo P07_D04_SOURCE_WRITER_QUIESCENCE=NOT_PROVEN
          echo P07_D04_SOURCE_OLD_VPS_CP2_DNS_PRODUCTION=UNCHANGED
      - name: Always remove transient private source and GOV checkout
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- .p07-private .gov-public
          test ! -e .p07-private
          test ! -e .gov-public
          echo P07_D04_FINAL_WRITER_PUBLIC_WORKSPACE_REMOVED=PASS
