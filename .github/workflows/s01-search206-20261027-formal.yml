name: S01 Theme exact formal release
on:
  push:
    branches: [task/s01-search206-20261027]
    paths: ['.github/workflows/s01-search206-20261027-formal.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.206
  TARGET_SHA: 86cc735ccd5c48e7dde07018f1b04562ac97b23d
  TARGET_TREE: 947f13af224a1944bc70261d6582d217d876a419
  BASE_SHA: 8804cd0b3db69440b204bf8b07879a29b9e93df2
  LANE_ID: s01-search206-20261027
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - name: Formal identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-search206-20261027/formal-spec.json --input control/.github/workflows/s01-search206-20261027-formal.yml
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 86cc735ccd5c48e7dde07018f1b04562ac97b23d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact candidate, merged tree and required evidence readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider candidate-proof
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40437341993 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40437341993 --jq .head_sha)" = 0be5952b361fba783337f69ad697edcf1f94a69f
          test "$(gh api repos/$TARGET_REPO/commits/main --jq .sha)" = "$TARGET_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$TARGET_SHA --jq .tree.sha)" = "$TARGET_TREE"
          gh run download 40437341993 --repo llhzx2018/core-free-runner-public --name s01-home-40437341993 --dir candidate-proof
          cmp candidate-proof/state-before.sha256 candidate-proof/state-after.sha256
          cmp candidate-proof/contracts-before.json candidate-proof/contracts-after.json
          python3 control/lanes/s01-search206-20261027/package.py
          python3 - <<'PYVERIFY'
          import json,pathlib,subprocess,urllib.parse
          r=pathlib.Path('candidate-proof')
          old=json.loads((r/'package.json').read_text());new=json.loads(pathlib.Path('proof/package.json').read_text())
          assert old['source']=='1ef3ff70569f97c53917f5818a1e41a7f0adb582'
          for phase in ['before','after','smoke']:
              result=json.loads((r/('search-'+phase+'.json')).read_text())
              assert result['status']=='PASS' and len(result['rows'])==2 and result['errors']==[] and result['writes']==[]
          result=json.loads((r/'search-after.json').read_text())
          assert result['checks']>=60
          assert result['operationalAcceptance']=='OWNER_REVIEW_REQUIRED_AFTER_MANUAL_UPGRADE'
          for lang in ['zh','en']:
              for width in [1440,1024]: assert (r/f'search-{lang}-{width}.png').stat().st_size>500
              assert (r/f'search-static-{lang}.png').stat().st_size>500
              repro=json.loads((r/f'reproduced-{lang}.json').read_text())
              assert repro['homeActive']=='page' and repro['excerpt']!=repro['expected']
          assert json.loads((r/'clean-install.json').read_text())['status']=='PASS'
          assert json.loads((r/'bootstrap.json').read_text())['status']=='PASS'
          for k in ['status','version','tree','sha256','bytes','files']: assert old[k]==new[k],k
          assert new['sha256']=='8e710ddfb5108933d9f1105d2a8df41971a6d459a543826395ef0a9a39d16655' and new['bytes']==2009057
          coverage=json.loads(pathlib.Path('control/lanes/s01-search206-20261027/release-authority.json').read_text())
          assert set(coverage['required'])=={'TESTING','GIT','UA_UI','SEO','SECURITY','INSTALL','UPGRADE','DATA_SCHEMA','PERFORMANCE'}
          assert coverage['source']=='1ef3ff70569f97c53917f5818a1e41a7f0adb582' and coverage['tree']=='947f13af224a1944bc70261d6582d217d876a419'
          assert coverage['owner_preview_runtime']=='N_A'
          assert coverage['release_mode']=='PROJECT_PREVIEW_N_A'
          assert coverage['owner_real_use']=='POST_PRODUCTION_REQUIRED'
          assert coverage['production_auto_apply'] is False
          for item in coverage['required'].values():
              assert item['sha'] and item['acceptance']
              endpoint='repos/llhzx2018/gov-doc/contents/'+urllib.parse.quote(item['path'],safe='/')+'?ref=main'
              live=json.loads(subprocess.check_output(['gh','api',endpoint]))
              assert live['sha']==item['sha'],item['path']
              item['evidence_status']='PASS_EXACT_CANDIDATE_MACHINE'
          coverage['candidate_status']='PASS_EXACT_CANDIDATE_MACHINE'
          coverage['candidate_run']='40437341993'
          coverage['merged_source']='86cc735ccd5c48e7dde07018f1b04562ac97b23d'
          coverage['formal_release_gate']='PASS'
          coverage['production_effect']='NOT_PROVEN_POST_MANUAL_UPGRADE_READBACK_REQUIRED'
          pathlib.Path('proof/public-authority-coverage.json').write_text(json.dumps(coverage,ensure_ascii=False,indent=2))
          print('MERGED_TREE_EQUALS_TESTED_TREE_AND_EXACT_PACKAGE_PASS')
          PYVERIFY
      - name: Publish only the exact verified package
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.35.206 --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create v1.35.206 provider/vf-tools-theme_V1.35.206.zip --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Theme V1.35.206' --notes '按Owner205正式站双语截图收口搜索摘要与菜单当前项。搜索原生结果和静态目录复用既有安全作者摘要路径，保留完整已填写摘要，正文回退使用既有CJK字符预算；不改写正文、摘要或菜单配置。原生搜索使用WordPress真实搜索状态，根路径与分页搜索不再误高亮首页；真实首页和工具目录当前项仍正常，外部链接保护保留。CSS/JS/205布局与分页完全不改。WordPress/Chromium双语1440/1024验证作者摘要/正文回退、静态目录hidden可见数、首尾分页、无脚本及非搜索导航；干净安装、205升级206/回退/重复安装与受保护数据保持。476运行文件，远端ZIP字节一致。后台历史区记录205实际截图确认范围及206待正式站人工复验，不写入独立人工备注。Production由Owner手工升级，手机暂缓，其它组件不改。' --latest
          fi
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/v1.35.206 --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh release view v1.35.206 --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - name: Authenticated remote ZIP byte comparison
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download v1.35.206 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.206.zip --dir remote
          cmp provider/vf-tools-theme_V1.35.206.zip remote/vf-tools-theme_V1.35.206.zip
          echo '8e710ddfb5108933d9f1105d2a8df41971a6d459a543826395ef0a9a39d16655  remote/vf-tools-theme_V1.35.206.zip' | sha256sum -c
          test "$(stat -c %s remote/vf-tools-theme_V1.35.206.zip)" = 2009057
          gh release view v1.35.206 --repo "$TARGET_REPO" --json url,publishedAt,tagName > proof/formal-release.json
          echo FORMAL_RELEASE_EXACT_REMOTE_ASSET_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-home-formal-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target provider remote candidate-proof
