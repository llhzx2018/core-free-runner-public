name: TEMP S01-C03 1.25.6 Gate Seal Fix

on:
  push:
    branches:
      - temp/s01-release-prep-gate-20260902
    paths:
      - '.github/workflows/temp-s01-c03-1.25.6-gate-seal-fix.yml'

permissions:
  contents: write

jobs:
  patch-seal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: temp/s01-release-prep-gate-20260902
          fetch-depth: 0
      - name: Patch exact seal assertion only
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/temp-s01-c03-1.25.6-formal-pre-release-gate.yml')
          s=p.read_text()
          old="grep -Fq 'update Schema Authority contract PASS' \"$EVIDENCE_DIR/update-schema-authority-contract.txt\""
          new="grep -Fq 'M3U8 update schema authority contract PASS' \"$EVIDENCE_DIR/update-schema-authority-contract.txt\""
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          test "$(git diff --name-only)" = '.github/workflows/temp-s01-c03-1.25.6-formal-pre-release-gate.yml'
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add .github/workflows/temp-s01-c03-1.25.6-formal-pre-release-gate.yml
          git commit -m 'ci(temp): fix S01-C03 1.25.6 evidence seal assertion'
          git push origin HEAD:temp/s01-release-prep-gate-20260902
