name: P01 Mobile Links Touch Targets Diagnostic
on:
  push:
    branches: [diagnostic/p01-mobile-links-touch-targets-20260831]
    paths: [.github/workflows/p01-mobile-links-touch-targets-20260831.yml]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE: c798eaea4b6892a2b6d550cb2162d60c6c18c6c6
      ROOT: ${{ github.workspace }}/product/src
      EVID: /tmp/p01-mobile-links-touch/evidence
      PORT: '18489'
      ADMIN_PASS: P01MobileLinksTouch
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - name: Checkout exact Product Source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Fresh setup and fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-mobile-links-touch; mkdir -p "$EVID"
          test "$(git -C product rev-parse HEAD)" = "$SOURCE"
          php -S 127.0.0.1:$PORT -t "$ROOT" >"$EVID/server.log" 2>&1 & echo $! >/tmp/p01-mobile-links-touch.pid
          COOKIE=/tmp/p01-mobile-links-touch.cookies
          for i in $(seq 1 60); do curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:$PORT/setup.php" -o "$EVID/setup.html" && break; sleep .25; done
          CSRF=$(python3 - "$EVID/setup.html" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:$PORT/setup.php" --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=P01 Mobile Touch Diagnostic' --data-urlencode "admin_password=$ADMIN_PASS" --data-urlencode "admin_password_confirm=$ADMIN_PASS" -o "$EVID/setup-post.html"
          ROOT="$ROOT" php <<'PHP'
          <?php require getenv('ROOT').'/app/bootstrap.php';$repo=new VfRepository(vf_db());$cat=$repo->createCategory(['name'=>'Touch','description'=>'','parent_id'=>null,'is_private'=>true]);$repo->saveLink(null,['category_id'=>$cat,'title'=>'Touch Target Alpha','url'=>'https://touch-target-alpha.example/','is_private'=>1,'is_pending'=>0],'admin');
          PHP
      - name: Chromium 390 touch measurement
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-mobile-links-touch/pw; cd /tmp/p01-mobile-links-touch/pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat >diag.cjs <<'JS'
          const {chromium}=require('playwright');const fs=require('fs');
          const base='http://127.0.0.1:18489/';
          (async()=>{const b=await chromium.launch({headless:true});const c=await b.newContext({viewport:{width:390,height:844}});const login=await c.request.post(base+'api.php?action=login',{data:{password:'P01MobileLinksTouch'}});if(!login.ok()||!(await login.json()).ok)throw Error('login');const p=await c.newPage();await p.goto(base+'links-admin.php',{waitUntil:'networkidle'});
          const row=p.locator('tr').filter({hasText:'Touch Target Alpha'});await row.locator('input[data-select]').check();
          const m=await p.evaluate(()=>{const rect=s=>{const e=document.querySelector(s),r=e?.getBoundingClientRect();if(!r)return null;const cs=getComputedStyle(e);return{width:+r.width.toFixed(1),height:+r.height.toFixed(1),paddingTop:cs.paddingTop,paddingBottom:cs.paddingBottom,fontSize:cs.fontSize,display:cs.display}};const batch=[...document.querySelectorAll('#batchBar [data-bulk]')].filter(x=>x.offsetWidth||x.offsetHeight).map(e=>{const r=e.getBoundingClientRect();return{action:e.dataset.bulk,text:e.textContent.trim(),width:+r.width.toFixed(1),height:+r.height.toFixed(1)}});return{open:rect('[data-open]'),edit:rect('[data-edit]'),selectPageMobile:rect('.vf-select-page-mobile'),prev:rect('#prevPage'),next:rect('#nextPage'),batch,documentOverflow:document.documentElement.scrollWidth-document.documentElement.clientWidth};});
          const rowSmall=[m.open,m.edit].filter(Boolean).some(x=>x.height<38);const batchSmall=m.batch.some(x=>x.height<38);const pagerSmall=[m.prev,m.next].filter(Boolean).some(x=>x.height<38);const out={source:process.env.SOURCE,baseline:38,measurement:m,rowSmall,batchSmall,pagerSmall};fs.writeFileSync(process.env.EVID+'/measurement.json',JSON.stringify(out,null,2));console.log('P01_MOBILE_ROW_ACTION_BELOW_38='+String(rowSmall).toUpperCase());console.log('P01_MOBILE_BATCH_ACTION_BELOW_38='+String(batchSmall).toUpperCase());console.log('P01_MOBILE_PAGER_ACTION_BELOW_38='+String(pagerSmall).toUpperCase());console.log(JSON.stringify(m));await p.screenshot({path:process.env.EVID+'/links-mobile-selected.png',fullPage:true});await b.close();})().catch(e=>{console.error(e);process.exit(1)});
          JS
          SOURCE="$SOURCE" EVID="$EVID" node diag.cjs | tee "$EVID/diagnostic.txt"
      - name: SQLite integrity
        shell: bash
        run: |
          ROOT="$ROOT" php <<'PHP' | tee "$EVID/db.txt"
          <?php require getenv('ROOT').'/app/bootstrap.php';$db=vf_db();echo 'INTEGRITY='.strtolower((string)$db->query('PRAGMA integrity_check')->fetchColumn())."\n";echo 'FK='.count($db->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC))."\n";
          PHP
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-mobile-links-touch-${{ github.run_id }}
          path: ${{ env.EVID }}
          if-no-files-found: error
          retention-days: 30
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/p01-mobile-links-touch.pid 2>/dev/null)" 2>/dev/null || true