name: S01 C03 Human Language Readonly Gate
on:
  push:
    branches: [temp/s01-final-ux-candidate-patch-20260907]
    paths: [.github/workflows/temp-s01-c03-recovery-runtime-human-readonly-20260907.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      HEAD_SHA: c457bd921a45442b60f2f4abac7e46cd8195c0dd
    steps:
      - name: Verify exact C03 source candidate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$READ_TOKEN"
          echo 'PRODUCT_WRITE_USED=NO MAIN_WRITE_USED=NO RELEASE_WRITE_USED=NO PRODUCTION_WRITE_USED=NO MIGRATION_USED=NO'
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-tools-m3u8.git" repo
          cd repo
          git checkout -q "$HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(cat VERSION)" = '1.25.27'
          node --check src/admin/admin-s01-human-language-final.js
          php -l src/admin/admin-s01-uiux-polish.php >/dev/null
          php tests/unit/settings-human-language-followup-contract.php
          php tests/unit/recovery-runtime-human-language-followup-contract.php
          php tests/unit/admin-human-language-contract.php
          php tests/unit/dashboard-human-language-contract.php
          php tests/unit/host-recovery-human-language-contract.php
          php tests/unit/package-physical-locator-contract.php
          php tests/frontend-s01-uiux-final-owner-contract.php
          git diff --exit-code
          echo 'PASS_S01_C03_HUMAN_LANGUAGE_READONLY_GATE'
