name: P01 V2.47.133 Favicon All View Gate

on:
  push:
    branches:
      - test-p01-v247133-favicon-all-view-20260930
    paths:
      - '.github/workflows/temp-p01-v247133-favicon-all-view.yml'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact P01 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: e36edd029010fc808e1d22a018ad6d0e593b4111
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product

      - name: Syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l product/src/app/FunctionalWorkspace.php
          node --check product/src/assets/workspace.js
          php -l product/tests/unit/navigation_v247133_favicon_all_view_recovery_contract.php
          echo P01_V247133_FAVICON_ALL_VIEW_SYNTAX=PASS

      - name: Focused favicon contracts
        shell: bash
        run: |
          set -euo pipefail
          cd product
          php tests/unit/navigation_v247127_favicon_reliability_contract.php
          php tests/unit/navigation_v247128_favicon_recovery_queue_contract.php
          php tests/unit/navigation_v247130_favicon_provider_generation_contract.php
          php tests/unit/navigation_v247131_favicon_stale_success_selfheal_contract.php
          php tests/unit/navigation_v247132_favicon_success_generation_refresh_contract.php
          php tests/unit/navigation_v247133_favicon_all_view_recovery_contract.php
          echo P01_V247133_FAVICON_ALL_VIEW_FOCUSED=PASS
