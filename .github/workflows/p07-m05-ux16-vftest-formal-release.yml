# P07-M05 新服务器初始化 UX16 Formal Release, Owner-approved VF测试 equivalent proof.
# Only the Owner-controlled merge of this exact workflow to public main can publish.
# Existing P07 private native checks remain BLOCKED_INFRA; never overwrite them.
name: P07-M05 UX16 VFTest exact Formal Release
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-m05-ux16-vftest-formal-release.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/p07-m05-ux16-vftest-formal-release.yml'
permissions:
  contents: read
jobs:
  ux16-exact-release:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      ((github.event_name == 'pull_request' &&
        github.actor == 'llhzx2018' &&
        github.event.pull_request.user.login == 'llhzx2018' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.head_ref == 'release/p07-m05-ux16-formal-20261126') ||
       (github.event_name == 'push' &&
        github.actor == 'llhzx2018' &&
        github.ref == 'refs/heads/main' &&
        startsWith(github.event.head_commit.message, 'P07 M05 UX16 formal publish')))
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      NO_COLOR: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      TARGET_VERSION: '0.1.0'
      TARGET_SHA: '908dfabaac86cf61eb8cf22c56b44a24cc7231ff'
      TARGET_TREE: 'fb4effd3035682e4e320675cde72f1abb48c15b7'
      BUILD: '0.1.0-m05-ux16-runtime-identity-catalog'
      EXPECTED_SHA: '5445a006327969ca9c3987680ae808def4a4991bd833a0ed176eeb5ab671c095'
      RELEASE_TAG: 'p07-m05-v0.1.0-ux16-runtime-identity-catalog-20261126'
      ASSET: 'P07-M05-0.1.0-m05-ux16-runtime-identity-catalog.zip'
      RECEIPT: 'P07-M05-UX16-FORMAL-RELEASE.json'
    steps:
      - name: Checkout exact public installer and release workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python 3.13 consistent with exact DEV archive
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Checkout merged P07 product source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-server-ops
          ref: '908dfabaac86cf61eb8cf22c56b44a24cc7231ff'
          path: private-src
          fetch-depth: 0
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Verify exact merged source and preserved case-only machine evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C private-src rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C private-src rev-parse 'HEAD^{tree}')" = "$TARGET_TREE"
          test "$(cat private-src/VERSION)" = "$TARGET_VERSION"
          grep -Fqx "BUILD_ID = \"$BUILD\"" private-src/scripts/build_p07_m05_bundle.py
          test -f private-src/lib/m05_python_cache_guard.py
          test -f private-src/lib/m05_installed_p07_guard.py
          echo P07_M05_FORMAL_MERGED_PRODUCT_IDENTITY=PASS
      - name: Rebuild final exact package twice and verify approved byte identity
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git hash-object installers/p07-toolbox.sh)" = 44e582d516b84bf81215c8416c58c7b8f75af720
          test "$(git hash-object installers/p07-m05-atomic.py)" = 17e47121ac27f31162d93a72aa0b1dbea602ea01
          root="$RUNNER_TEMP/p07-m05-package-proof"
          mkdir -m 700 "$root"
          cd private-src
          git diff --quiet c54f92ca845921e87b2d26cc87e5f54fe1f36978 HEAD
          test "$(git diff --name-only eec6fdb3bd50bdbe26e4ee492a74c07debb417b9 HEAD)" = "docs/ux-reviews/p07-m05-general-runtime-identity-20261126.json"
          python3 -B scripts/build_p07_m05_bundle.py --output "$root/$ASSET" >"$root/build.log"
          python3 -B scripts/build_p07_m05_bundle.py --output "$root/repeat.zip" >"$root/repeat.log"
          cmp "$root/$ASSET" "$root/repeat.zip"
          printf '%s  %s\n' "$EXPECTED_SHA" "$root/$ASSET" | sha256sum -c -
          echo P07_M05_FINAL_EXACT_ARCHIVE=PASS
      - name: Read actual anonymous issued archives and derive release catalog
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          root="$RUNNER_TEMP/p07-m05-package-proof"
          unset GH_TOKEN GITHUB_TOKEN
          base=https://github.com/llhzx2018/core-free-runner-public/releases/download
          asset() {
            curl -q --proto '=https' --tlsv1.2 -fsSL --connect-timeout 10 --max-time 95 "$base/$1/$2" -o "$root/$3"
            printf '%s  %s\n' "$4" "$root/$3" | sha256sum -c -
          }
          asset p07-all-ux-v0.1.0-20261118 P07-M01-0.1.0-ux3.zip m01.zip 13e79e7c7a4f1170c74da24e783804c3c2bda06fe6c46b768497694e826b3ed7
          asset p07-all-ux-v0.1.0-20261118 P07-M02-2.1.1-ux3.zip m02.zip 88da5b8219fb7e04d606eb3de998d872747cb05153bdd93c7351b46f957164b4
          asset p07-all-ux-v0.1.0-20261118 P07-M04-0.1.0-ux5.zip m04.zip 2ff45c263f930e258a3c323b6c009e0973531d3f90a2e432a66aed704c9baa7d
          asset p07-m03-v0.1.0-release146-20261122 P07-M03-0.1.0-release146.zip stable.zip 7b3e46c651c5ce3597e4ab535fbdc734023fc1b706fe85189a344ee600514321
          asset p07-m03-v0.1.0-release147-rc3-ownertrial-20261123 P07-M03-0.1.0-release147-rc3-OWNER-TRIAL.zip rc3.zip 3646285a2732c8249d0296a72c7ce6fae83be1e9564d76849e65bc396642672d
          asset p07-m03-v0.1.0-release147-rc4-maintenance-20261125 P07-M03-0.1.0-release147-rc4-MAINTENANCE.zip rc4.zip 85570da2d135e39ae3634e511298e50dede81015019e305c7de068e04ca93238
          asset p07-m05-v0.1.0-ux15-rc4-runtime-compat-20261126 P07-M05-0.1.0-m05-ux15-rc4-runtime-compat.zip ux15.zip fa67235dbc9fc7d132b057da7095d5064d1b72f7308a781aa7d616e942d27d99
          python3 -B - "$root" <<'PY'
          import hashlib, importlib.util, json, os, pathlib, stat, sys, zipfile
          root=pathlib.Path(sys.argv[1])
          repo=pathlib.Path.cwd()
          sys.path[:0]=[str(repo/"private-src"/p) for p in ("lib","scripts")]
          from build_p07_runtime_identity import build_record
          from m05_runtime_identity import parse_catalog, SCHEMA
          from secret_scan import scan_paths, TOKEN_RULES, ASSIGNMENT_RULES, PRIVATE_KEY_RE
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          new=root/os.environ["ASSET"]; old=root/"ux15.zip"
          spec=importlib.util.spec_from_file_location("atomic",repo/"installers/p07-m05-atomic.py")
          atomic=importlib.util.module_from_spec(spec);spec.loader.exec_module(atomic)
          assert atomic.read_verified_archive(new,sha(new))[0]==os.environ["BUILD"]
          with zipfile.ZipFile(old) as a,zipfile.ZipFile(new) as b:
              assert b.testzip() is None
              assert len(b.namelist())==len(set(b.namelist()))
              changes={n for n in set(a.namelist())|set(b.namelist()) if n not in a.namelist() or n not in b.namelist() or a.read(n)!=b.read(n)}
              expected={"BUILD_ID","MODULE_BUILD_ID","MODULE_MANIFEST.json","lib/m05_environment_guard.py","lib/m05_installed_p07_guard.py","lib/m05_runtime_identity.py","lib/m05_legacy_identity.py"}
              assert changes=={"p07-m05/"+n for n in expected}
              for info in b.infolist():
                  p=pathlib.PurePosixPath(info.filename)
                  assert not p.is_absolute() and ".." not in p.parts and stat.S_IFMT(info.external_attr>>16)==stat.S_IFREG
                  body=b.read(info).decode("utf8")
                  assert not PRIVATE_KEY_RE.search(body)
                  assert not any(pattern.search(body) for _,pattern in TOKEN_RULES+ASSIGNMENT_RULES)
              tampered=root/"tampered.zip"
              with zipfile.ZipFile(tampered,"w") as t:
                  for info in b.infolist():
                      t.writestr(info,b"invalid\n" if info.filename=="p07-m05/MODULE_BUILD_ID" else b.read(info))
              try: atomic.read_verified_archive(tampered,sha(tampered))
              except atomic.Unsafe: pass
              else: raise AssertionError("tampered archive accepted")
          print("P07_M05_FINAL_ARCHIVE_SCOPE_SECURITY=PASS")
          rows=[]
          for slot,archive,source in (
              ("m01",root/"m01.zip","cadbe0b84b9d39a70df7f6863ef6967449f90886"),
              ("m02",root/"m02.zip","cadbe0b84b9d39a70df7f6863ef6967449f90886"),
              ("m04",root/"m04.zip","cadbe0b84b9d39a70df7f6863ef6967449f90886"),
              ("m05",old,"51520a4422c87888f79e349b79914ca1f64826ef"),
              ("m05",new,os.environ["TARGET_SHA"])):
              with zipfile.ZipFile(archive) as z:
                  marker=f"p07-{slot}/MODULE_MANIFEST.json"
                  meta=json.loads(z.read(marker))
                  build=meta["module_build_id"]
                  version=z.read(f"p07-{slot}/VERSION").decode("ascii").strip()
              rows.append(build_record(archive,sha(archive),path=f"vfops-modules/{slot}/releases/{build}",build=build,version=version,marker="MODULE_MANIFEST.json",archive_marker=marker,roles=["current"],source_sha=source))
          for label,build,source,path in (
              ("stable","0.1.0-release146","e77ed2fb85e325959b37dab5f0a5ec846817dc5d","vf-server-ops"),
              ("rc3","0.1.0-release147-rc3","63758a0eb5424d321ca413831d1115514989f5c0","vf-server-ops-ownertrial147rc3"),
              ("rc4","0.1.0-release147-rc4","54c46dfa862a5c4a39020c1bd80a129bd992077b","vf-server-ops-ownertrial147rc3")):
              archive=root/(label+".zip")
              with zipfile.ZipFile(archive) as z:
                  markers=[n for n in z.namelist() if n.endswith("/RUNTIME.gitblob")]
                  bases=[n for n in z.namelist() if n.endswith(".tar.gz")]
                  assert len(markers)==len(bases)==1
              rows.append(build_record(archive,sha(archive),path=path,build=build,version="0.1.0",marker=".runtime-manifest.gitblob",archive_marker=markers[0],base_tar=bases[0],roles=["current","previous"] if label=="rc3" else ["current"],source_sha=source,predecessors=["0.1.0-release147-rc3"] if label=="rc4" else []))
          catalog=root/"p07-runtime-identities.json"
          catalog.write_text(json.dumps({"schema":SCHEMA,"records":rows},ensure_ascii=True,sort_keys=True,indent=2)+"\n",encoding="ascii")
          assert len(parse_catalog(catalog.read_bytes()))==8
          assert sha(catalog)=="ecef49d59325fec0d0eac8e56adada1bb77a748156f94afa64ed6ad6b12bef8a"
          print("P07_M05_FINAL_CATALOG_EIGHT_RECORDS=PASS")
          print("P07_M05_FINAL_CATALOG_SHA256="+sha(catalog))
          PY
      - name: Checkout pinned current GOV structural delivery authority transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/gov-doc
          ref: 4223ce80b2cf7945cff485ba9ff598d1ceef6a3b
          path: gov-rules
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Structural check of actual user public CLI entrypoint and source authority
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C gov-rules rev-parse HEAD)" = "4223ce80b2cf7945cff485ba9ff598d1ceef6a3b"
          python3 -B - <<'PY'
          import hashlib,json,os,pathlib
          script=pathlib.Path(os.environ["GITHUB_WORKSPACE"])/"installers"/"p07-toolbox.sh"
          assert script.is_file() and not script.is_symlink()
          script_sha256=hashlib.sha256(script.read_bytes()).hexdigest()
          assert len(script_sha256)==64 and script_sha256!=os.environ["EXPECTED_SHA"]
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"p07-m05-task-delivery-receipt.json"
          data={
            "schema":"vf.public-authority.task-delivery-check.v1",
            "project":"P07",
            "source":os.environ["TARGET_SHA"],
            "project_authority":{
              "agents":"AGENTS.md",
              "current":"docs/authority/CURRENT.md",
              "acceptance":"docs/authority/ACCEPTANCE_MATRIX.md",
              "applicability":"docs/authority/PUBLIC_AUTHORITY_APPLICABILITY.md"
            },
            "acceptance_markers":["P07-PUBLIC-01","P07-PUBLIC-03","P07-PUBLIC-05"],
            "delivery":{
              "profile":"cli_one_command",
              "entrypoint":"p07-toolbox.sh",
              "artifact":"installers/p07-toolbox.sh",
              "sha256":script_sha256,
              "requires_git":False,
              "requires_manual_source_copy":False
            },
            "required_domains":["INSTALL","SECURITY","TESTING","UPGRADE","DATA_SCHEMA","GIT"],
            "task_capabilities":["installer","candidate","existing_install_transition","database","release_source"]
          }
          p.write_text(json.dumps(data,ensure_ascii=False,sort_keys=True),encoding="utf8")
          PY
          python3 -B gov-rules/governance/public-authority/tools/task_delivery_contract_lint.py \
            --phase delivery --receipt "$RUNNER_TEMP/p07-m05-task-delivery-receipt.json" \
            --project-root "$GITHUB_WORKSPACE/private-src" --artifact-root "$GITHUB_WORKSPACE" \
            --public-router "$GITHUB_WORKSPACE/gov-rules/governance/public-authority/VF_PUBLIC_AUTHORITY_APPLICABILITY_ROUTER_V1.0.json"
          echo P07_M05_PUBLIC_TASK_DELIVERY_STRUCTURAL=PASS
      - name: Create immutable formal receipt and package checksums
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          python3 -B - "$RUNNER_TEMP/p07-m05-package-proof" <<'PY'
          import hashlib,json,os,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          target=root/os.environ["ASSET"]
          catalog=root/"p07-runtime-identities.json"
          assert sha(target)==os.environ["EXPECTED_SHA"]
          receipt={"schema":"vf.p07.m05.ux16.release/v1","module_id":"P07-M05","module_name":"新服务器初始化","build_id":os.environ["BUILD"],"source_commit":os.environ["TARGET_SHA"],"source_tree":os.environ["TARGET_TREE"],"formal_tag":os.environ["RELEASE_TAG"],"archive_name":target.name,"archive_sha256":sha(target),"catalog_sha256":sha(catalog),"catalog_records":8,"previous_formal_build":"0.1.0-m05-ux15-rc4-runtime-compat","previous_formal_sha256":"fa67235dbc9fc7d132b057da7095d5064d1b72f7308a781aa7d616e942d27d99","proofs":{"105_cases_and_root":"https://github.com/llhzx2018/core-free-runner-public/actions/runs/45802910594","architecture_and_security":"https://github.com/llhzx2018/core-free-runner-public/actions/runs/45803429453","terminal_and_scope":"https://github.com/llhzx2018/core-free-runner-public/actions/runs/45804080851","prior_unchanged_db_and_bootstrap":"https://github.com/llhzx2018/core-free-runner-public/actions/runs/45532493968"},"owner_preview":"N_A_SOURCE_ONLY_CLI","owner_real_use":"PENDING_MANUAL","native_product_checks":"BLOCKED_INFRA_NOT_RELABELED_PASS","production":"MANUAL_ONLY","distribution":"SEPARATE_GATE"}
          manifest=root/os.environ["RECEIPT"]
          manifest.write_text(json.dumps(receipt,ensure_ascii=False,indent=2,sort_keys=True)+"\n",encoding="utf8")
          (root/"SHA256SUMS").write_text("".join(f"{sha(p)}  {p.name}\n" for p in (target,catalog,manifest)),encoding="ascii")
          PY
          (cd "$RUNNER_TEMP/p07-m05-package-proof" && sha256sum -c SHA256SUMS)
          echo P07_M05_FORMAL_PREISSUE=PASS
      - name: Publish exact immutable product and public GitHub releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          test -n "$GH_TOKEN" || { echo P07_M05_RELEASE_WRITE_CAPABILITY_MISSING; exit 78; }
          p=llhzx2018/vf-server-ops
          r=llhzx2018/core-free-runner-public
          root="$RUNNER_TEMP/p07-m05-package-proof"
          test "$(gh api "repos/$p/branches/main" --jq '.commit.sha')" = "$TARGET_SHA" || {
            echo P07_M05_PRODUCT_MAIN_MOVED_STOP; exit 13; }
          if gh release view "$RELEASE_TAG" -R "$p" >/dev/null 2>&1; then
            test "$(gh api "repos/$p/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$TARGET_SHA" || exit 13
          else
            if gh api "repos/$p/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then exit 13; fi
            gh release create "$RELEASE_TAG" -R "$p" --target "$TARGET_SHA" \
              --title "P07-M05 新服务器初始化 UX16" \
              --notes "Only P07-M05. VF测试 exact-source gate and immutable SHA256. Source merge is separate from Production; Owner manually upgrades VPS."
          fi
          if gh release view "$RELEASE_TAG" -R "$r" >/dev/null 2>&1; then
            test "$(gh api "repos/$r/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$GITHUB_SHA" || exit 13
            test "$(gh api "repos/$r/releases/tags/$RELEASE_TAG" --jq '.assets|length')" = 4 || exit 13
          else
            if gh api "repos/$r/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then exit 13; fi
            gh release create "$RELEASE_TAG" -R "$r" --target "$GITHUB_SHA" \
              --title "P07-M05 UX16 verified module release" \
              --notes "Only the new server initialization module. Current public toolbox pin remains UX15 until separate artifact-readback and upgrade gate."
            gh release upload "$RELEASE_TAG" -R "$r" \
              "$root/$ASSET" "$root/$RECEIPT" "$root/p07-runtime-identities.json" "$root/SHA256SUMS"
          fi
          dest="$RUNNER_TEMP/p07-m05-remote-proof"
          mkdir -p "$dest"
          gh release download "$RELEASE_TAG" -R "$r" --dir "$dest"
          (cd "$dest" && sha256sum -c SHA256SUMS)
          cmp "$root/$RECEIPT" "$dest/$RECEIPT"
          cmp "$root/p07-runtime-identities.json" "$dest/p07-runtime-identities.json"
          test "$(gh api "repos/$p/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$TARGET_SHA"
          test "$(gh api "repos/$r/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$GITHUB_SHA"
          echo P07_M05_UX16_BOTH_RELEASES_REMOTE_READBACK=PASS
          echo P07_M05_PUBLIC_TOOLBOX_PIN=UX15_UNCHANGED
      - name: Always erase private source and transient test/archive bytes
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          rm -rf -- "$GITHUB_WORKSPACE/private-src" "$GITHUB_WORKSPACE/gov-rules" "$RUNNER_TEMP/p07-m05-package-proof" "$RUNNER_TEMP/p07-m05-remote-proof"
          test ! -e "$GITHUB_WORKSPACE/private-src"
          test ! -e "$GITHUB_WORKSPACE/gov-rules"
          rm -f -- "$RUNNER_TEMP/p07-m05-task-delivery-receipt.json"
          test ! -e "$RUNNER_TEMP/p07-m05-package-proof"
          test ! -e "$RUNNER_TEMP/p07-m05-remote-proof"
          echo P07_M05_PRIVATE_SOURCE_AND_ARCHIVE_CLEANUP=PASS
