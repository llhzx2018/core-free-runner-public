name: P01 D14 isolated encrypted snapshot and empty-clone restore (temporary)
on:
  push:
    branches:
      - test/p01-d14-recovery-20261112
permissions:
  contents: read
jobs:
  p01-d14:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: p01-only-synthetic-test
          MYSQL_DATABASE: p01_d14_source_mysql_20261112
        ports:
          - 3306:3306
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: p01-only-synthetic-test
          MARIADB_DATABASE: p01_d14_source_maria_20261112
        ports:
          - 3307:3306
    steps:
      - name: Check trusted runner and isolated fixture policy
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "$GITHUB_REF_NAME" = "test/p01-d14-recovery-20261112"
          echo P01_D14_INPUT_DATA=SYNTHETIC_ONLY
      - name: Registered private exact-source checkout capability
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo P01_D14_PRIVATE_READ=AVAILABLE
      - name: Checkout exact P01 source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 9d13fc8503552b34a814585b3dc5821b8b823e59
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
      - name: Validate exact source and native PHP runtime
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "9d13fc8503552b34a814585b3dc5821b8b823e59"
          test "$(cat candidate/VERSION)" = "2.47.515"
          echo P01_D14_EXACT_SOURCE=9d13fc8503552b34a814585b3dc5821b8b823e59
          if ! command -v php >/dev/null || ! php -r 'exit(PHP_VERSION_ID >= 80300 && extension_loaded("pdo_sqlite") && extension_loaded("pdo_mysql") ? 0 : 1);'; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php8.3-cli php8.3-sqlite3 php8.3-mysql php8.3-mbstring php8.3-xml >/dev/null
          fi
          php -l candidate/src/app/next/runtime/IsolatedRecoverySnapshot.php
          php -l candidate/tests/compatibility/p01_d14_isolated_recovery_smoke.php
          php -l candidate/src/app/next/runtime/CloudPanelSiteActivation.php
          php candidate/tests/unit/p01_d10_cli_activation_contract.php
          echo P01_D14_SOURCE_LINT_AND_D10_REGRESSION=PASS
      - name: Execute real SQLite sealed snapshot and isolated recovery
        run: |
          set -Eeuo pipefail
          php candidate/tests/compatibility/p01_d14_isolated_recovery_smoke.php sqlite
      - name: Prepare independent disposable SQL restore databases
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mysql-client >/dev/null
          for port in 3306 3307; do
            ok=no
            for i in $(seq 1 45); do
              if mysql --protocol=tcp -h127.0.0.1 -P "$port" -uroot -pp01-only-synthetic-test -e 'SELECT 1' >/dev/null 2>&1; then
                ok=yes
                break
              fi
              sleep 1
            done
            test "$ok" = yes
          done
          mysql --protocol=tcp -h127.0.0.1 -P3306 -uroot -pp01-only-synthetic-test -e 'CREATE DATABASE p01_d14_restore_mysql_20261112;'
          mysql --protocol=tcp -h127.0.0.1 -P3307 -uroot -pp01-only-synthetic-test -e 'CREATE DATABASE p01_d14_restore_maria_20261112;'
          echo P01_D14_BOTH_ISOLATED_SQL_RESTORE_SCHEMAS=READY
      - name: Exercise actual MariaDB 11.8 and MySQL 8.4 snapshot and empty clone recovery
        run: |
          set -Eeuo pipefail
          php candidate/tests/compatibility/p01_d14_isolated_recovery_smoke.php mariadb
          php candidate/tests/compatibility/p01_d14_isolated_recovery_smoke.php mysql
          echo P01_D14_REAL_ENGINE_ISOLATED_CLONE_RESTORE=3_OF_3
          echo P01_D14_PRODUCTION_ATOMIC_READY=NO
      - name: Cleanup transient source
        if: always()
        run: |
          rm -rf -- candidate
          echo P01_D14_PRIVATE_SOURCE_PERSISTED=NO
