name: P05 V1.2.2 Production Closure Writer R2

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p05-v122-production-closure-writer-r2-20260902.yml']

permissions:
  contents: read
  actions: read

jobs:
  write-closure-r2:
    if: github.event_name == 'pull_request' && github.head_ref == 'tmp/p05-v122-production-closure-writer-r2-20260902'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCT_SOURCE: 04e4b8546357301e90b6ab7d9b50907369ea58eb
      PRODUCT_TREE: 0822f722244724c666d7aa660634e247436f1c12
      PRODUCT_BRANCH: governance/p05-v122-production-closure-20260902
      RELEASE_ID: '380671190'
      RELEASE_TAG: v1.2.2
      FULL_ID: '539843543'
      FULL_BYTES: '512336'
      FULL_SHA256: fb2bdcd4efb6edd408fb81635b488415d756622f031897acb89021747bf6b297
      REPAIR_ID: '539856093'
      REPAIR_BYTES: '3651613'
      REPAIR_SHA256: 5ad86463cafc28642f8782069393d9464308aada75617a053c58d51983f12901
      UPDATE_ID: '539856092'
      UPDATE_BYTES: '1162103'
      UPDATE_SHA256: 078fccae7e3097d842b15233d5325c174abc711d891fe1c9e3952325738a09a2
      CORE_UPDATES_MAIN: e93f07c5ee84e114e0829ea65f217e768b21ce44
      NATIVE_RUN: '33532595870'
      NATIVE_JOB: '99939127603'
      FINAL_RUN: '33532743356'
      FINAL_JOB: '99939619178'
      FORMAL_RUN: '33533485831'
      FORMAL_JOB: '99942039835'
      ATOMIC_RUN: '33533825437'
      ATOMIC_JOB: '99943145098'
      SUPPLEMENT_RUN: '33534562135'
      SUPPLEMENT_JOB: '99945575241'
      MANIFEST_RUN: '33534786090'
      MANIFEST_JOB: '99946331208'
    steps:
      - name: Checkout frozen Runner R1 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          path: runner

      - name: Extract frozen R1 scripts
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('runner/.github/workflows/p05-v122-production-closure-writer-20260902.yml').read_text().splitlines()
          names={
            'Bind exact live Release and core-updates truth':'/tmp/live.sh',
            'Bind terminal machine evidence':'/tmp/machine.sh',
            'Write exact four-file Production Closure authority':'/tmp/write.sh',
            'Commit and push closure candidate to private P05 branch':'/tmp/push.sh',
          }
          for name,out in names.items():
              marker='      - name: '+name
              i=src.index(marker)
              while i < len(src) and src[i].strip()!='run: |': i+=1
              assert i < len(src), name
              i+=1; body=[]
              while i < len(src) and not src[i].startswith('      - name:') and not src[i].startswith('      - uses:'):
                  line=src[i]
                  if line.startswith('          '): body.append(line[10:])
                  elif line.strip(): raise AssertionError((name,line))
                  else: body.append('')
                  i+=1
              Path(out).write_text('\n'.join(body)+'\n')
              Path(out).chmod(0o700)
          print('P05_V122_R1_FROZEN_SCRIPTS=PASS')
          PY

      - name: Rebind live Release and core-updates truth
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: /tmp/live.sh

      - name: Rebind terminal machine evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: /tmp/machine.sh

      - name: Verify private closure branch through GitHub API
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api "repos/llhzx2018/vf-seo/branches/$PRODUCT_BRANCH" > /tmp/branch.json
          python3 - <<'PY'
          import json,os
          b=json.load(open('/tmp/branch.json'))
          assert b['name']==os.environ['PRODUCT_BRANCH']
          assert b['commit']['sha']==os.environ['PRODUCT_SOURCE'], (b['commit']['sha'],os.environ['PRODUCT_SOURCE'])
          print('P05_V122_CLOSURE_BRANCH_API_BINDING=PASS')
          PY

      - name: Checkout exact P05 release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.PRODUCT_SOURCE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: p05

      - name: Verify exact release source and tree
        working-directory: p05
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$PRODUCT_TREE"
          echo P05_V122_CLOSURE_BASE_R2=PASS

      - name: Execute frozen exact four-file closure mutation
        working-directory: p05
        run: /tmp/write.sh

      - name: Commit and push exact closure candidate
        working-directory: p05
        env:
          PUSH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: /tmp/push.sh
