name: P01 V2.35.0 Formal Artifact Gate

on:
  push:
    branches: [release/p01-v2350-orchestrator-20260831]
    paths: [.github/workflows/p01-v2350-formal-artifact-gate-20260831.yml]

permissions:
  contents: read

jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RELEASE_SOURCE: d20f8e964455c7238b66c6ff6ab2e7d732d315e2
      RELEASE_TREE: 1d9c8a11f1e8ddb7bb775b28592459f754c2c59b
      RUNTIME_TREE: 24953b64762b2d17076e4149a2aa49a492316477
      SOURCE: 518d10f446ea85445d1110a3defafc5bcbece473
      SOURCE_TREE: 90ffab51a20640a4e3f6f07122a8e6e147592f64
      SOURCE_RUNTIME_TREE: f3eeb66fbce3949ef50483ac4c5a821edbd15d35
      MAIN_PREPROMOTION: 84f7ba02a8ab79ba6d7675c76b7d07e4895a3436
      VERSION: 2.35.0
      SOURCE_VERSION: 2.34.0
      SCHEMA: '2026082901'
      OUT: /tmp/p01-v2350-formal-artifacts
      EVID: /tmp/p01-v2350-formal-evidence
      CONTRACT: /tmp/p01-v2350-formal-contract
      UPGRADE: /tmp/p01-v2350-formal-upgrade
    steps:
      - name: Checkout gate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: runner

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none

      - name: Checkout exact formal release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: d20f8e964455c7238b66c6ff6ab2e7d732d315e2
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: candidate

      - name: Checkout immutable V2.34 predecessor
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.34.0
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: production

      - name: Checkout proven Atomic builder
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: agent/p01-22121-formal-artifact-gate-20260819
          path: proven

      - name: Bind formal release boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$OUT" "$EVID" "$CONTRACT" "$UPGRADE"; mkdir -p "$EVID"
          test "$(git -C candidate rev-parse HEAD)" = "$RELEASE_SOURCE"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "$RELEASE_TREE"
          test "$(git -C candidate rev-parse HEAD:src)" = "$RUNTIME_TREE"
          test "$(git -C production rev-parse HEAD)" = "$SOURCE"
          test "$(git -C production rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test "$(git -C production rev-parse HEAD:src)" = "$SOURCE_RUNTIME_TREE"
          test "$(cat candidate/VERSION)" = "$VERSION"
          test "$(cat candidate/src/VERSION.txt)" = "$VERSION"
          grep -Fx "define('VF_VERSION', '2.35.0');" candidate/src/app/bootstrap.php >/dev/null
          git -C candidate fetch origin main --quiet
          test "$(git -C candidate rev-parse refs/remotes/origin/main)" = "$MAIN_PREPROMOTION"
          if git -C candidate ls-remote --exit-code --tags origin refs/tags/v2.35.0 >/dev/null 2>&1; then echo UNEXPECTED_V2350_TAG; exit 1; fi
          python3 - <<'PY'
          import json
          d=json.load(open('candidate/VF_PROJECT.json',encoding='utf-8'))
          assert d['production_version']=='2.34.0'
          assert d['working_version']=='2.35.0'
          assert d['candidate_readiness']['run']==33331921219 if 'candidate_readiness' in d else d['current_change']['candidate_readiness']['run']==33331921219
          assert d['current_change']['candidate_readiness']['result']=='PASS'
          assert d['v2_35_tag_state']=='NOT_CREATED'
          assert d['core_updates_v2_35_state']=='NOT_PUBLISHED'
          print('P01_V2350_FORMAL_METADATA=PASS')
          PY
          echo P01_V2350_MAIN_PREPROMOTION_AUTHORITY=PASS | tee "$EVID/boundary.txt"
          echo P01_V2350_TAG_ABSENT=PASS | tee -a "$EVID/boundary.txt"
          echo OWNER_PRODUCTION_WRITE=NO | tee -a "$EVID/boundary.txt"

      - name: Build deterministic formal artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/p01-v2350-formal-build.py <<'PY'
          from pathlib import Path
          import hashlib,importlib.util,json,os
          ROOT=Path(os.environ['GITHUB_WORKSPACE']); VERSION='2.35.0'; SOURCE_VERSION='2.34.0'; SCHEMA='2026082901'
          def load(name,path):
              s=importlib.util.spec_from_file_location(name,path); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); return m
          base=load('base',ROOT/'proven/scripts/p01-build-release.py'); v2=load('v2',ROOT/'proven/scripts/p01-build-release-v2.py')
          sha=lambda b:hashlib.sha256(b).hexdigest(); gate_only={'.gitignore','CHANGELOG.md','DEPLOY-HERE.txt','FULL-PACKAGE-NOTES.txt','README.md','UPGRADE-V2.txt','robots.txt'}
          def runtime(files): return {k:v for k,v in files.items() if k!='release-manifest.json' and k not in gate_only and k!='VF-Start-Browser-Extension.zip'}
          td=base.collect(ROOT/'candidate/src'); sd=base.collect(ROOT/'production/src'); target=runtime(td); source=runtime(sd)
          assert td['VERSION.txt'].strip()==VERSION.encode(); assert sd['VERSION.txt'].strip()==SOURCE_VERSION.encode()
          changed=sorted(k for k in target if k not in source or sha(target[k])!=sha(source[k])); added=sorted(set(target)-set(source)); removed=sorted(set(source)-set(target))
          if removed: raise SystemExit('unexpected removed runtime files '+json.dumps(removed));
          if not changed: raise SystemExit('empty runtime delta')
          manifest={'project':'VF Start','project_id':'P01','component_id':'APP','version':VERSION,'source_version':SOURCE_VERSION,'schema_version':SCHEMA,'source_schema_version':SCHEMA,'release_type':'formal','stage':'FORMAL_RELEASE_ARTIFACT','deployable':True,'release_authorized':True,'release_source_commit':os.environ['RELEASE_SOURCE'],'release_source_tree':os.environ['RELEASE_TREE'],'runtime_source_tree':os.environ['RUNTIME_TREE'],'production_source_commit':os.environ['SOURCE'],'production_source_tree':os.environ['SOURCE_TREE'],'production_runtime_tree':os.environ['SOURCE_RUNTIME_TREE'],'schema_change':False,'schema_migrations':[],'runtime_data_included':False,'candidate_readiness_gate':33331921219,'final_visual_sweep_gate':33330543623,'runtime_files':{k:sha(v) for k,v in sorted(target.items())},'atomic_runtime_boundary':{'source_version':SOURCE_VERSION,'target_version':VERSION,'source_schema':SCHEMA,'target_schema':SCHEMA,'added_files':added,'removed_files':removed,'runtime_delta':changed},'update':{'asset_name':'VF_Start_V2.35.0_UPDATE.zip','supported_from':[SOURCE_VERSION],'backup_required':True,'rollback_supported':True},'ux_v235':{'five_domain_consistency':True,'drawer_hierarchy':True,'sidebar_productization':True,'feedback_semantics':True,'private_protected_state':True,'mobile_command_row':True,'desktop_bulkbar':True,'dark_watch_states':True,'topics_dark_tokens':True}}
          mb=(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n').encode(); full=dict(td); full['release-manifest.json']=mb; atomic=dict(target); atomic['release-manifest.json']=mb
          repair=v2.build_repair(source,atomic,sha(target['app/UpdateManager.php']))
          old="public const SOURCE_VERSION='2.21.14';\n    public const TARGET_VERSION='2.21.15';\n    public const TARGET_SCHEMA='2026080902';"
          new="public const SOURCE_VERSION='2.34.0';\n    public const TARGET_VERSION='2.35.0';\n    public const TARGET_SCHEMA='2026082901';"
          if repair.count(old)!=1: raise SystemExit('repair constant anchor mismatch')
          repair=repair.replace(old,new,1)
          out=Path(os.environ['OUT']); out.mkdir(parents=True,exist_ok=True); rp=out/'repair-v2.35.0.php'; rp.write_text(repair,encoding='utf-8',newline='\n')
          base.deterministic_zip(out/'VF-Start-V2.35.0-FULL.zip',full); base.deterministic_zip(out/'VF_Start_V2.35.0_UPDATE.zip',{rp.name:rp.read_bytes()})
          result={'status':'FORMAL_ARTIFACT_BUILD_PASS','release_source':os.environ['RELEASE_SOURCE'],'release_tree':os.environ['RELEASE_TREE'],'runtime_tree':os.environ['RUNTIME_TREE'],'source_commit':os.environ['SOURCE'],'version':VERSION,'source_version':SOURCE_VERSION,'schema':SCHEMA,'runtime_delta_count':len(changed),'runtime_delta':changed,'runtime_added':added,'runtime_removed':removed,'release_published':False,'owner_production_write':False}
          (out/'P01-V2.35.0-FORMAL-GATE.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'); print(json.dumps(result,ensure_ascii=False))
          PY
          python3 /tmp/p01-v2350-formal-build.py | tee "$EVID/build-1.json"
          REPAIR="$OUT/repair-v2.35.0.php"; FULL="$OUT/VF-Start-V2.35.0-FULL.zip"; UPDATE="$OUT/VF_Start_V2.35.0_UPDATE.zip"
          php -l "$REPAIR" >/dev/null
          php "$REPAIR" --self-test | tee "$EVID/repair-self-test.json" | jq -e '.ok==true and .global_barrier==true and .interruption_recovery==true' >/dev/null
          sha256sum "$FULL" "$UPDATE" "$REPAIR" > "$EVID/artifacts-sha-1.txt"
          cp -a "$OUT" /tmp/p01-v2350-formal-first; rm -rf "$OUT"
          python3 /tmp/p01-v2350-formal-build.py | tee "$EVID/build-2.json"
          sha256sum "$FULL" "$UPDATE" "$REPAIR" > "$EVID/artifacts-sha-2.txt"
          diff -u "$EVID/artifacts-sha-1.txt" "$EVID/artifacts-sha-2.txt"
          unzip -Z1 "$UPDATE" | grep -Fx repair-v2.35.0.php >/dev/null
          echo P01_V2350_FORMAL_DETERMINISTIC=PASS | tee "$EVID/artifact-verdict.txt"

      - name: Actual formal V2.34 to V2.35 upgrade
        shell: bash
        run: |
          set -Eeuo pipefail
          REPAIR="$OUT/repair-v2.35.0.php"
          setup_root(){
            local root="$1" src="$2" port="$3" label="$4" cookie="$EVID/$label.cookies"
            rm -rf "$root"; cp -a "$src" "$root"; rm -f "$cookie"
            php -S 127.0.0.1:$port -t "$root" >"$EVID/$label-server.log" 2>&1 & local pid=$!
            local ready=0; for i in $(seq 1 60); do if curl -fsS -c "$cookie" -b "$cookie" "http://127.0.0.1:$port/setup.php" -o "$EVID/$label-setup.html"; then ready=1; break; fi; sleep .25; done; test "$ready" = 1
            local csrf=$(python3 - "$EVID/$label-setup.html" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read(); print(re.search(r'name="setup_csrf"\s+value="([^"]+)"',s).group(1))
          PY
            )
            curl -fsS -c "$cookie" -b "$cookie" -X POST "http://127.0.0.1:$port/setup.php" --data-urlencode "setup_csrf=$csrf" --data-urlencode 'site_title=V235 Formal' --data-urlencode 'admin_password=V235Formal!2026' --data-urlencode 'admin_password_confirm=V235Formal!2026' -o "$EVID/$label-setup-post.html"
            kill "$pid" || true
            php "$root/cli/verify.php" | grep -Fx VERIFY_PASS=YES >/dev/null
          }
          setup_root "$UPGRADE" production/src 18376 source
          ROOT="$UPGRADE" php <<'PHP' | tee "$EVID/seed.txt"
          <?php
          require getenv('ROOT').'/app/bootstrap.php'; require_once getenv('ROOT').'/app/SurfaceRepository.php';
          $r=new VfRepository(vf_db());$s=new VfSurfaceRepository(vf_db());$c=$r->createCategory(['name'=>'正式发布验证','description'=>'','is_private'=>false]);
          $domains=['start','channels','watch','topics'];
          for($i=1;$i<=50;$i++){ $x=$r->saveLink(null,['category_id'=>$c,'title'=>'Formal '.$i,'url'=>'https://example.com/v235-formal-'.$i,'description'=>'preserve','tags'=>'formal','is_private'=>$i%4===0],'manual'); $d=$domains[($i-1)%4]; if($d!=='start')$s->upsertProfile((int)$x['id'],['surface'=>$d,'resource_kind'=>$d==='channels'?'creator':($d==='watch'?'movie':'guide')]); }
          echo "P01_V2350_FORMAL_SEED_50=PASS\n";
          PHP
          grep -Fx P01_V2350_FORMAL_SEED_50=PASS "$EVID/seed.txt"
          php "$REPAIR" --verify-source="$UPGRADE" | tee "$EVID/verify-source.json" | jq -e '.ok==true' >/dev/null
          php "$REPAIR" --run="$UPGRADE" | tee "$EVID/upgrade-run.json" | jq -e '.ok==true and .already_current==false and .schema=="2026082901"' >/dev/null
          test "$(cat "$UPGRADE/VERSION.txt")" = '2.35.0'; grep -Fx "define('VF_VERSION', '2.35.0');" "$UPGRADE/app/bootstrap.php" >/dev/null
          ROOT="$UPGRADE" php <<'PHP' | tee "$EVID/data-preservation.txt"
          <?php
          require getenv('ROOT').'/app/bootstrap.php';$db=vf_db();
          if((int)$db->query("SELECT COUNT(*) FROM links WHERE lifecycle_state='active'")->fetchColumn()!==50)exit(1);
          if(strtolower((string)$db->query('PRAGMA integrity_check')->fetchColumn())!=='ok')exit(2);
          if($db->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC))exit(3);
          echo "P01_V2350_FORMAL_DATA_PRESERVATION=PASS\n";
          PHP
          php "$REPAIR" --run="$UPGRADE" | tee "$EVID/idempotent.json" | jq -e '.ok==true and .already_current==true' >/dev/null
          php "$REPAIR" --verify-target="$UPGRADE" | tee "$EVID/verify-target.json" | jq -e '.ok==true' >/dev/null
          php "$UPGRADE/cli/verify.php" | grep -Fx VERIFY_PASS=YES >/dev/null
          php "$UPGRADE/cli/surface-verify.php" | grep -E 'MULTI_SURFACE_PASS=YES|CURRENT_DOMAIN_PASS=YES' >/dev/null
          php "$UPGRADE/cli/baseline-verify.php" | tee "$EVID/baseline.txt"
          grep -Fx BASELINE_CORE_PASS=YES "$EVID/baseline.txt"; grep -Fx DRIFT_COUNT=0 "$EVID/baseline.txt"; grep -Fx UNKNOWN_COUNT=0 "$EVID/baseline.txt"
          echo P01_V2350_FORMAL_ACTUAL_UPGRADE=PASS | tee "$EVID/upgrade-verdict.txt"

      - name: Assemble immutable formal artifact contract
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$CONTRACT"; mkdir -p "$CONTRACT"
          cp "$OUT/VF-Start-V2.35.0-FULL.zip" "$CONTRACT/"
          cp "$OUT/VF_Start_V2.35.0_UPDATE.zip" "$CONTRACT/"
          cp "$OUT/VF_Start_V2.35.0_UPDATE.zip" "$CONTRACT/VF-Start-V2.35.0-UPDATE.zip"
          cp "$OUT/repair-v2.35.0.php" "$CONTRACT/"
          cp "$EVID/repair-self-test.json" "$CONTRACT/atomic-self-test.json"
          cp "$OUT/P01-V2.35.0-FORMAL-GATE.json" "$CONTRACT/P01-V2.35.0-ARTIFACT-GATE.json"
          FULL_SHA=$(sha256sum "$CONTRACT/VF-Start-V2.35.0-FULL.zip"|awk '{print $1}'); UPDATE_SHA=$(sha256sum "$CONTRACT/VF_Start_V2.35.0_UPDATE.zip"|awk '{print $1}'); REPAIR_SHA=$(sha256sum "$CONTRACT/repair-v2.35.0.php"|awk '{print $1}')
          FULL_BYTES=$(stat -c%s "$CONTRACT/VF-Start-V2.35.0-FULL.zip"); UPDATE_BYTES=$(stat -c%s "$CONTRACT/VF_Start_V2.35.0_UPDATE.zip"); REPAIR_BYTES=$(stat -c%s "$CONTRACT/repair-v2.35.0.php")
          jq -n --arg project_id P01 --arg version 2.35.0 --arg source_version 2.34.0 --arg release_source "$RELEASE_SOURCE" --arg release_tree "$RELEASE_TREE" --arg runtime_tree "$RUNTIME_TREE" --arg source_commit "$SOURCE" --arg schema "$SCHEMA" --arg full_sha "$FULL_SHA" --arg update_sha "$UPDATE_SHA" --arg repair_sha "$REPAIR_SHA" --argjson full_bytes "$FULL_BYTES" --argjson update_bytes "$UPDATE_BYTES" --argjson repair_bytes "$REPAIR_BYTES" '{project_id:$project_id,version:$version,source_version:$source_version,release_source:$release_source,release_tree:$release_tree,runtime_tree:$runtime_tree,source_commit:$source_commit,source_schema:$schema,schema:$schema,schema_change:false,schema_migrations:[],formal_artifact_gate:"PASS",candidate_readiness_gate:"33331921219 PASS",final_visual_sweep:"33330543623 PASS",actual_upgrade:"PASS",data_preservation:"PASS",idempotence:"PASS",repair_self_test:"PASS",strict_fresh_install:"PENDING_SEPARATE_FENCE",remote_online_update_http:"PENDING_AFTER_PUBLICATION",release_published:false,owner_production_write:false,full:{name:"VF-Start-V2.35.0-FULL.zip",bytes:$full_bytes,sha256:$full_sha},update:{name:"VF_Start_V2.35.0_UPDATE.zip",bytes:$update_bytes,sha256:$update_sha,inner:"repair-v2.35.0.php"},repair:{name:"repair-v2.35.0.php",bytes:$repair_bytes,sha256:$repair_sha}}' > "$CONTRACT/P01-V2.35.0-FORMAL-METADATA.json"
          (cd "$CONTRACT" && sha256sum P01-V2.35.0-ARTIFACT-GATE.json P01-V2.35.0-FORMAL-METADATA.json VF-Start-V2.35.0-FULL.zip VF-Start-V2.35.0-UPDATE.zip VF_Start_V2.35.0_UPDATE.zip atomic-self-test.json repair-v2.35.0.php > SHA256SUMS.txt)
          test "$(find "$CONTRACT" -maxdepth 1 -type f | wc -l)" = 8
          php -l "$CONTRACT/repair-v2.35.0.php" >/dev/null
          unzip -Z1 "$CONTRACT/VF_Start_V2.35.0_UPDATE.zip" | grep -Fx repair-v2.35.0.php >/dev/null
          printf 'FORMAL_FULL_SHA256=%s\nFORMAL_FULL_BYTES=%s\nFORMAL_UPDATE_SHA256=%s\nFORMAL_UPDATE_BYTES=%s\nFORMAL_REPAIR_SHA256=%s\nFORMAL_REPAIR_BYTES=%s\nP01_V2350_FORMAL_ARTIFACT_CONTRACT=PASS\n' "$FULL_SHA" "$FULL_BYTES" "$UPDATE_SHA" "$UPDATE_BYTES" "$REPAIR_SHA" "$REPAIR_BYTES" | tee "$EVID/formal-contract.txt"

      - name: Upload formal artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2350-formal-artifacts-d20f8e964455c7238b66c6ff6ab2e7d732d315e2
          path: /tmp/p01-v2350-formal-contract
          if-no-files-found: error
          retention-days: 90

      - name: Upload formal evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2350-formal-evidence-d20f8e964455c7238b66c6ff6ab2e7d732d315e2
          path: /tmp/p01-v2350-formal-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Verdict
        shell: bash
        run: |
          echo P01_V2350_FORMAL_RELEASE_SOURCE=$RELEASE_SOURCE
          echo P01_V2350_FORMAL_RELEASE_TREE=$RELEASE_TREE
          echo P01_V2350_RUNTIME_TREE=$RUNTIME_TREE
          echo P01_V2350_FORMAL_ARTIFACT_GATE=PASS
          echo P01_V2350_READY_FOR_STRICT_FRESH=YES
          echo RELEASE_PUBLISHED=NO
          echo OWNER_PRODUCTION_WRITE=NO
