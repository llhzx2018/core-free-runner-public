name: P01 V2.35.1 Formal Artifact Gate

on:
  push:
    branches: [release/p01-v2350-orchestrator-20260831]
    paths: [.github/workflows/p01-v2350-formal-artifact-gate-20260831.yml]

permissions:
  contents: read

jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RELEASE_SOURCE: eb36fd19d269aed4ef4246c2c18f172b2c761bde
      RELEASE_TREE: 00aca451804db5ebf9260d8101dfe829789c4f24
      RUNTIME_TREE: 3cdfa02d8c19ae5e771b7d4abff69a670ac4396c
      SOURCE: d20f8e964455c7238b66c6ff6ab2e7d732d315e2
      SOURCE_TREE: 1d9c8a11f1e8ddb7bb775b28592459f754c2c59b
      SOURCE_RUNTIME_TREE: 24953b64762b2d17076e4149a2aa49a492316477
      MAIN_PREPROMOTION: 0bd93177ce3d8bc16f41162859d62b799a5a7d4c
      VERSION: 2.35.1
      SOURCE_VERSION: 2.35.0
      SCHEMA: '2026082901'
      OUT: /tmp/p01-v2351-formal-artifacts
      EVID: /tmp/p01-v2351-formal-evidence
      UPGRADE: /tmp/p01-v2351-formal-upgrade
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none

      - name: Checkout exact formal release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.RELEASE_SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: candidate

      - name: Checkout immutable V2.35.0 predecessor
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.35.0
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: production

      - name: Checkout proven Atomic builder
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: agent/p01-22121-formal-artifact-gate-20260819
          path: proven

      - name: Bind formal release boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$OUT" "$EVID" "$UPGRADE"; mkdir -p "$OUT" "$EVID"
          test "$(git -C candidate rev-parse HEAD)" = "$RELEASE_SOURCE"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "$RELEASE_TREE"
          test "$(git -C candidate rev-parse HEAD:src)" = "$RUNTIME_TREE"
          test "$(git -C production rev-parse HEAD)" = "$SOURCE"
          test "$(git -C production rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test "$(git -C production rev-parse HEAD:src)" = "$SOURCE_RUNTIME_TREE"
          test "$(cat candidate/VERSION)" = "$VERSION"
          test "$(cat candidate/src/VERSION.txt)" = "$VERSION"
          grep -Fx "define('VF_VERSION', '2.35.1');" candidate/src/app/bootstrap.php >/dev/null
          git -C candidate fetch origin develop main --quiet
          test "$(git -C candidate rev-parse refs/remotes/origin/develop)" = "$RELEASE_SOURCE"
          test "$(git -C candidate rev-parse refs/remotes/origin/main)" = "$MAIN_PREPROMOTION"
          if git -C candidate ls-remote --exit-code --tags origin refs/tags/v2.35.1 >/dev/null 2>&1; then echo UNEXPECTED_V2351_TAG; exit 1; fi
          grep -F 'Candidate Readiness Run: 33339734236 / PASS' candidate/docs/evidence/P01_V2.35.1_CANDIDATE_READINESS_20260831.md >/dev/null
          echo P01_V2351_FORMAL_BOUNDARY=PASS | tee "$EVID/boundary.txt"
          echo P01_V2351_TAG_ABSENT=PASS | tee -a "$EVID/boundary.txt"
          echo OWNER_PRODUCTION_WRITE=NO | tee -a "$EVID/boundary.txt"

      - name: Build deterministic formal runtime artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/p01-v2351-formal-build.py <<'PY'
          from pathlib import Path
          import hashlib,importlib.util,json,os
          ROOT=Path(os.environ['GITHUB_WORKSPACE']); VERSION='2.35.1'; SOURCE_VERSION='2.35.0'; SCHEMA='2026082901'
          def load(name,path):
              s=importlib.util.spec_from_file_location(name,path); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); return m
          base=load('base',ROOT/'proven/scripts/p01-build-release.py'); v2=load('v2',ROOT/'proven/scripts/p01-build-release-v2.py')
          sha=lambda b:hashlib.sha256(b).hexdigest(); gate_only={'.gitignore','CHANGELOG.md','DEPLOY-HERE.txt','FULL-PACKAGE-NOTES.txt','README.md','UPGRADE-V2.txt','robots.txt'}
          def runtime(files): return {k:v for k,v in files.items() if k!='release-manifest.json' and k not in gate_only and k!='VF-Start-Browser-Extension.zip'}
          td=base.collect(ROOT/'candidate/src'); sd=base.collect(ROOT/'production/src'); target=runtime(td); source=runtime(sd)
          assert td['VERSION.txt'].strip()==VERSION.encode(); assert sd['VERSION.txt'].strip()==SOURCE_VERSION.encode()
          changed=sorted(k for k in target if k not in source or sha(target[k])!=sha(source[k])); added=sorted(set(target)-set(source)); removed=sorted(set(source)-set(target))
          if removed: raise SystemExit('unexpected removed runtime files '+json.dumps(removed))
          if not changed: raise SystemExit('empty runtime delta')
          manifest={'project':'VF Start','project_id':'P01','component_id':'APP','version':VERSION,'source_version':SOURCE_VERSION,'schema_version':SCHEMA,'source_schema_version':SCHEMA,'release_type':'formal','stage':'FORMAL_RELEASE_ARTIFACT','deployable':True,'release_authorized':True,'release_source_commit':os.environ['RELEASE_SOURCE'],'release_source_tree':os.environ['RELEASE_TREE'],'runtime_source_tree':os.environ['RUNTIME_TREE'],'production_source_commit':os.environ['SOURCE'],'production_source_tree':os.environ['SOURCE_TREE'],'production_runtime_tree':os.environ['SOURCE_RUNTIME_TREE'],'schema_change':False,'schema_migrations':[],'runtime_data_included':False,'candidate_readiness_gate':33339734236,'final_visual_sweep_gate':33338822193,'home_action_priority_gate':33338635840,'runtime_files':{k:sha(v) for k,v in sorted(target.items())},'atomic_runtime_boundary':{'source_version':SOURCE_VERSION,'target_version':VERSION,'source_schema':SCHEMA,'target_schema':SCHEMA,'added_files':added,'removed_files':removed,'runtime_delta':changed},'update':{'asset_name':'VF_Start_V2.35.1_UPDATE.zip','supported_from':[SOURCE_VERSION],'backup_required':True,'rollback_supported':True}}
          mb=(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n').encode(); full=dict(td); full['release-manifest.json']=mb; atomic=dict(target); atomic['release-manifest.json']=mb
          repair=v2.build_repair(source,atomic,sha(target['app/UpdateManager.php']))
          old="public const SOURCE_VERSION='2.21.14';\n    public const TARGET_VERSION='2.21.15';\n    public const TARGET_SCHEMA='2026080902';"
          new="public const SOURCE_VERSION='2.35.0';\n    public const TARGET_VERSION='2.35.1';\n    public const TARGET_SCHEMA='2026082901';"
          if repair.count(old)!=1: raise SystemExit('repair constant anchor mismatch')
          repair=repair.replace(old,new,1)
          out=Path(os.environ['OUT']); out.mkdir(parents=True,exist_ok=True)
          rp=out/'repair-v2.35.1.php'; rp.write_text(repair,encoding='utf-8',newline='\n')
          base.deterministic_zip(out/'VF-Start-V2.35.1-FULL.zip',full)
          base.deterministic_zip(out/'VF_Start_V2.35.1_UPDATE.zip',{rp.name:rp.read_bytes()})
          (out/'VF-Start-V2.35.1-UPDATE.zip').write_bytes((out/'VF_Start_V2.35.1_UPDATE.zip').read_bytes())
          result={'status':'FORMAL_ARTIFACT_BUILD_PASS','release_source':os.environ['RELEASE_SOURCE'],'release_tree':os.environ['RELEASE_TREE'],'runtime_tree':os.environ['RUNTIME_TREE'],'source_commit':os.environ['SOURCE'],'version':VERSION,'source_version':SOURCE_VERSION,'schema':SCHEMA,'runtime_delta_count':len(changed),'runtime_delta':changed,'runtime_added':added,'runtime_removed':removed,'release_published':False,'owner_production_write':False}
          (out/'P01-V2.35.1-ARTIFACT-GATE.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False))
          PY
          python3 /tmp/p01-v2351-formal-build.py | tee "$EVID/build-1.json"
          php -l "$OUT/repair-v2.35.1.php" >/dev/null
          php "$OUT/repair-v2.35.1.php" --self-test >"$EVID/atomic-self-test-1.json"
          jq -e '.ok==true and .global_barrier==true and .interruption_recovery==true' "$EVID/atomic-self-test-1.json" >/dev/null
          sha256sum "$OUT/VF-Start-V2.35.1-FULL.zip" "$OUT/VF_Start_V2.35.1_UPDATE.zip" "$OUT/VF-Start-V2.35.1-UPDATE.zip" "$OUT/repair-v2.35.1.php" >"$EVID/runtime-sha-1.txt"
          rm -rf /tmp/p01-v2351-formal-first; cp -a "$OUT" /tmp/p01-v2351-formal-first
          rm -rf "$OUT"; mkdir -p "$OUT"
          python3 /tmp/p01-v2351-formal-build.py | tee "$EVID/build-2.json"
          php "$OUT/repair-v2.35.1.php" --self-test >"$EVID/atomic-self-test-2.json"
          sha256sum "$OUT/VF-Start-V2.35.1-FULL.zip" "$OUT/VF_Start_V2.35.1_UPDATE.zip" "$OUT/VF-Start-V2.35.1-UPDATE.zip" "$OUT/repair-v2.35.1.php" >"$EVID/runtime-sha-2.txt"
          diff -u "$EVID/runtime-sha-1.txt" "$EVID/runtime-sha-2.txt"
          cmp "$OUT/VF_Start_V2.35.1_UPDATE.zip" "$OUT/VF-Start-V2.35.1-UPDATE.zip"
          unzip -Z1 "$OUT/VF_Start_V2.35.1_UPDATE.zip" | grep -Fx repair-v2.35.1.php >/dev/null
          echo P01_V2351_FORMAL_DETERMINISTIC=PASS | tee "$EVID/artifact-verdict.txt"

      - name: Actual formal V2.35.0 to V2.35.1 upgrade
        shell: bash
        run: |
          set -Eeuo pipefail
          REPAIR="$OUT/repair-v2.35.1.php"; rm -rf "$UPGRADE"; cp -a production/src "$UPGRADE"
          COOKIE="$EVID/source.cookies"; rm -f "$COOKIE"
          php -S 127.0.0.1:18386 -t "$UPGRADE" >"$EVID/source-server.log" 2>&1 & PID=$!
          for i in $(seq 1 60); do curl -fsS -c "$COOKIE" -b "$COOKIE" http://127.0.0.1:18386/setup.php -o "$EVID/source-setup.html" && break; sleep .25; done
          CSRF=$(python3 - "$EVID/source-setup.html" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST http://127.0.0.1:18386/setup.php --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=V2351 Formal' --data-urlencode 'admin_password=V2351Formal!2026' --data-urlencode 'admin_password_confirm=V2351Formal!2026' -o "$EVID/source-setup-post.html"
          kill "$PID" || true
          php "$UPGRADE/cli/verify.php" | grep -Fx VERIFY_PASS=YES >/dev/null
          ROOT="$UPGRADE" php <<'PHP' | tee "$EVID/seed.txt"
          <?php
          require getenv('ROOT').'/app/bootstrap.php';require_once getenv('ROOT').'/app/SurfaceRepository.php';$r=new VfRepository(vf_db());$s=new VfSurfaceRepository(vf_db());$c=$r->createCategory(['name'=>'V2351 Formal','description'=>'','is_private'=>false]);$domains=['start','channels','watch','topics'];for($i=1;$i<=50;$i++){ $x=$r->saveLink(null,['category_id'=>$c,'title'=>'Formal '.$i,'url'=>'https://example.com/v2351-formal-'.$i,'description'=>'preserve','tags'=>'formal','is_private'=>$i%4===0,'is_favorite'=>$i<=5],'manual');$d=$domains[($i-1)%4];if($d!=='start')$s->upsertProfile((int)$x['id'],['surface'=>$d,'resource_kind'=>$d==='channels'?'creator':($d==='watch'?'movie':'guide')]);}echo "P01_V2351_FORMAL_SEED_50=PASS\n";
          PHP
          grep -Fx P01_V2351_FORMAL_SEED_50=PASS "$EVID/seed.txt"
          php "$REPAIR" --verify-source="$UPGRADE" | tee "$EVID/verify-source.json" | jq -e '.ok==true' >/dev/null
          php "$REPAIR" --run="$UPGRADE" | tee "$EVID/upgrade-run.json" | jq -e '.ok==true and .already_current==false and .schema=="2026082901"' >/dev/null
          test "$(cat "$UPGRADE/VERSION.txt")" = '2.35.1'; grep -Fx "define('VF_VERSION', '2.35.1');" "$UPGRADE/app/bootstrap.php" >/dev/null
          ROOT="$UPGRADE" php <<'PHP' | tee "$EVID/data-preservation.txt"
          <?php
          require getenv('ROOT').'/app/bootstrap.php';$db=vf_db();if((int)$db->query("SELECT COUNT(*) FROM links WHERE lifecycle_state='active'")->fetchColumn()!==50)exit(1);if((int)$db->query("SELECT COUNT(*) FROM links WHERE is_favorite=1 AND lifecycle_state='active'")->fetchColumn()!==5)exit(2);if(strtolower((string)$db->query('PRAGMA integrity_check')->fetchColumn())!=='ok')exit(3);if($db->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC))exit(4);echo "P01_V2351_FORMAL_DATA_PRESERVATION=PASS\n";
          PHP
          php "$REPAIR" --run="$UPGRADE" | tee "$EVID/idempotent.json" | jq -e '.ok==true and .already_current==true' >/dev/null
          php "$REPAIR" --verify-target="$UPGRADE" | tee "$EVID/verify-target.json" | jq -e '.ok==true' >/dev/null
          php "$UPGRADE/cli/verify.php" | tee "$EVID/upgrade-verify.txt" | grep -Fx VERIFY_PASS=YES
          php "$UPGRADE/cli/surface-verify.php" | tee "$EVID/upgrade-surface.txt" | grep -Fx CURRENT_DOMAIN_PASS=YES
          echo P01_V2351_FORMAL_ACTUAL_UPGRADE=PASS | tee "$EVID/upgrade-verdict.txt"

      - name: Finalize eight-file formal contract
        shell: bash
        run: |
          set -Eeuo pipefail
          cp "$EVID/atomic-self-test-2.json" "$OUT/atomic-self-test.json"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          out=Path(os.environ['OUT']); sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          full=out/'VF-Start-V2.35.1-FULL.zip'; upd=out/'VF_Start_V2.35.1_UPDATE.zip'; repair=out/'repair-v2.35.1.php'
          meta={'project_id':'P01','version':'2.35.1','source_version':'2.35.0','release_source':os.environ['RELEASE_SOURCE'],'release_tree':os.environ['RELEASE_TREE'],'runtime_tree':os.environ['RUNTIME_TREE'],'source_commit':os.environ['SOURCE'],'source_schema':'2026082901','schema':'2026082901','schema_change':False,'schema_migrations':[],'formal_artifact_gate':'PASS','candidate_readiness_gate':'33339734236 PASS','final_visual_sweep':'33338822193 PASS','home_action_priority_gate':'33338635840 PASS','actual_upgrade':'PASS','data_preservation':'PASS','idempotence':'PASS','repair_self_test':'PASS','strict_fresh_install':'PENDING_SEPARATE_FENCE','remote_online_update_http':'PENDING_AFTER_PUBLICATION','release_published':False,'owner_production_write':False,'full':{'name':full.name,'bytes':full.stat().st_size,'sha256':sha(full)},'update':{'name':upd.name,'bytes':upd.stat().st_size,'sha256':sha(upd),'inner':'repair-v2.35.1.php'},'repair':{'name':repair.name,'bytes':repair.stat().st_size,'sha256':sha(repair)}}
          (out/'P01-V2.35.1-FORMAL-METADATA.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          files=['P01-V2.35.1-ARTIFACT-GATE.json','P01-V2.35.1-FORMAL-METADATA.json','VF-Start-V2.35.1-FULL.zip','VF-Start-V2.35.1-UPDATE.zip','VF_Start_V2.35.1_UPDATE.zip','atomic-self-test.json','repair-v2.35.1.php']
          lines=[f"{sha(out/n)}  {n}" for n in files]
          (out/'SHA256SUMS.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          assert len(list(out.iterdir()))==8, sorted(p.name for p in out.iterdir())
          print(json.dumps(meta,ensure_ascii=False))
          PY
          (cd "$OUT" && sha256sum -c SHA256SUMS.txt)
          test "$(find "$OUT" -maxdepth 1 -type f | wc -l)" = 8
          echo P01_V2351_FORMAL_CONTRACT=PASS | tee "$EVID/formal-contract.txt"

      - name: Formal verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fx P01_V2351_FORMAL_BOUNDARY=PASS "$EVID/boundary.txt"
          grep -Fx P01_V2351_FORMAL_DETERMINISTIC=PASS "$EVID/artifact-verdict.txt"
          grep -Fx P01_V2351_FORMAL_ACTUAL_UPGRADE=PASS "$EVID/upgrade-verdict.txt"
          grep -Fx P01_V2351_FORMAL_CONTRACT=PASS "$EVID/formal-contract.txt"
          echo P01_V2351_FORMAL_ARTIFACT_GATE=PASS | tee "$EVID/verdict.txt"
          cat "$OUT/P01-V2.35.1-FORMAL-METADATA.json" | tee -a "$EVID/verdict.txt"

      - name: Upload formal artifact contract
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2351-formal-artifact-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload formal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2351-formal-evidence-${{ github.run_id }}
          path: ${{ env.EVID }}
          if-no-files-found: error
          retention-days: 30
