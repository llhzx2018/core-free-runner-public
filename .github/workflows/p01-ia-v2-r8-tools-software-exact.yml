name: P01 IA V2 R8 Tools Software derived exact proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-ia-v2-r8-tools-software-exact.yml'
permissions:
  contents: read
jobs:
  p01-r8-derived-tools-software:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      REPO: llhzx2018/vf-start
      CANDIDATE_SHA: e7c37523de981a9813153036801e7c2ac61dc404
      BASELINE_SHA: 4e174a38b0ff139d4a43212f25d1b789ffc53295
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, mbstring, curl, zip, openssl
          coverage: none
      - name: Fetch exact private source then drop credential remote
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          for pair in "candidate $CANDIDATE_SHA" "stable $BASELINE_SHA"; do
            set -- $pair
            git init -q "$1"
            git -C "$1" remote add origin "https://x-access-token:$READ_TOKEN@github.com/$REPO.git"
            git -C "$1" -c advice.detachedHead=false fetch -q --depth 1 origin "$2"
            git -C "$1" checkout -q --detach FETCH_HEAD
            test "$(git -C "$1" rev-parse HEAD)" = "$2"
            git -C "$1" remote remove origin
          done
          echo P01_R8_EXACT_SOURCE_PIN=PASS
      - name: R8 PHP JavaScript and owned surface contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          test "$(tr -d '\r\n ' < VERSION)" = '2.47.444'
          test "$(tr -d '\r\n ' < src/VERSION.txt)" = '2.47.444'
          for file in src/app/SoftwareProductPage.php src/app/SoftwareWorkspaceHome.php src/app/SubsiteAdminCatalog.php tests/unit/p01_ia_v2_r8_derived_tool_software_contract.php; do
            php -l "$file" >/dev/null
          done
          node --check src/assets/software-group-editor.js
          node --check src/assets/software-workspace.js
          php tests/unit/p01_ia_v2_r8_derived_tool_software_contract.php
          php tests/unit/frontstage_tools_software_r2_contract.php
          php tests/unit/software_workspace_contract.php
          php tests/unit/software_detail_context_contract.php
          php tests/unit/tools_toolbox_manager_v247210_contract.php
          node tests/unit/software_owner_guest_install_profiles_native.js
          echo P01_R8_DERIVED_SURFACE_FOCUSED=PASS
      - name: Canonical regression against exact R7 main
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate stable --require-zero-debt
          echo P01_R8_CANONICAL_ZERO_DEBT=PASS
      - name: Remove transient private source
        if: always()
        shell: bash
        run: |
          rm -rf candidate stable
          echo P01_R8_PRIVATE_SOURCE_CLEANUP=PASS
