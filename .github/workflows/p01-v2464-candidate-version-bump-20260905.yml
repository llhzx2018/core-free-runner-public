name: P01 V2.46.4 Candidate Version Identity

on:
  push:
    branches:
      - gate/p01-v2464-candidate-version-bump-20260905
    paths:
      - .github/workflows/p01-v2464-candidate-version-bump-20260905.yml

permissions:
  contents: read

jobs:
  stage-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE_SHA: a82ca05d5db1d507b6d4c9bf2c20e273e319cc30
      CANDIDATE_BRANCH: release/p01-v2464-maintenance-candidate-20260905
    steps:
      - name: Checkout exact P01 candidate base
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: release/p01-v2464-maintenance-candidate-20260905
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 2
          persist-credentials: true
          path: source

      - name: Verify exact base and stage version identity
        shell: bash
        run: |
          set -Eeuo pipefail
          cd source
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "$(cat VERSION)" = '2.46.3'
          test "$(cat src/VERSION.txt)" = '2.46.3'
          grep -Fqx "define('VF_VERSION', '2.46.3');" <(grep "define('VF_VERSION'" src/app/bootstrap.php)

          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              Path('VERSION'): ('2.46.3\n','2.46.4\n'),
              Path('src/VERSION.txt'): ('2.46.3\n','2.46.4\n'),
              Path('src/app/bootstrap.php'): ("define('VF_VERSION', '2.46.3');", "define('VF_VERSION', '2.46.4');"),
          }
          for path,(old,new) in replacements.items():
              data=path.read_text(encoding='utf-8')
              if data.count(old)!=1:
                  raise SystemExit(f'{path}: expected exactly one version identity occurrence')
              path.write_text(data.replace(old,new),encoding='utf-8')
          PY

          test "$(cat VERSION)" = '2.46.4'
          test "$(cat src/VERSION.txt)" = '2.46.4'
          grep -Fqx "define('VF_VERSION', '2.46.4');" <(grep "define('VF_VERSION'" src/app/bootstrap.php)
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          test "$changed" = $'VERSION\nsrc/VERSION.txt\nsrc/app/bootstrap.php'
          ! git diff --name-only | grep -q '^src/migrations/'

      - name: Candidate source regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          cd source
          php -l src/app/bootstrap.php
          php tests/unit/consolidated_product_acceptance_contract.php
          for f in \
            tests/unit/uxui_round1_home_root_contract.php \
            tests/unit/uxui_round2_subject_identity_contract.php \
            tests/unit/uxui_round3_course_identity_contract.php \
            tests/unit/uxui_round4_tools_identity_contract.php \
            tests/unit/uxui_round5_software_identity_contract.php \
            tests/unit/uxui_round6_channels_watch_identity_contract.php \
            tests/unit/uxui_round7_navigation_home_identity_contract.php \
            tests/unit/uxui_round8_visual_system_contract.php; do
            php "$f"
          done

      - name: Commit candidate identity to candidate branch only
        shell: bash
        run: |
          set -Eeuo pipefail
          cd source
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add VERSION src/VERSION.txt src/app/bootstrap.php
          git commit -m 'release(P01): stage V2.46.4 maintenance candidate'
          NEW_SHA="$(git rev-parse HEAD)"
          test -n "$NEW_SHA"
          git push origin "HEAD:$CANDIDATE_BRANCH"
          echo "P01_V2464_CANDIDATE_SHA=$NEW_SHA"
          echo "P01_V2464_VERSION_IDENTITY=PASS"
          echo 'SCHEMA=2026090401'
          echo 'MIGRATION=NONE'
          echo 'RELEASE_MUTATION=NO'
          echo 'CORE_UPDATES_MUTATION=NO'
          echo 'PRODUCTION_MUTATION=NO'
