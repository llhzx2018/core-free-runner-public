name: P07 M03-D04 independent SQLite and no-DB two-CloudPanel migration tests
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-m03-d04-independent-sqlite-static-20261115.yml'
      - 'tests/p07_m03_d04_independent_sqlite_static_dualvm.sh'
permissions:
  contents: read
jobs:
  independent-sqlite-static:
    if: github.event.action == 'opened'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout temporary public synthetic harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact private P07 M03-D04 product source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 472db71d1162a2701f393a298df198316bbbc0e9
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: .p07-private-exact
      - name: Run independent SQLite and static site migrations on two native CloudPanel VMs
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-private-exact rev-parse HEAD)" = 472db71d1162a2701f393a298df198316bbbc0e9
          bash -n tests/p07_m03_d04_independent_sqlite_static_dualvm.sh
          timeout --signal=TERM --kill-after=60s 3100s bash tests/p07_m03_d04_independent_sqlite_static_dualvm.sh
      - name: Remove temporary private product source
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- .p07-private-exact
          test ! -e .p07-private-exact
          echo P07_M03_D04_PRIVATE_SOURCE_REMOVED=PASS
