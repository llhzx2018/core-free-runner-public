name: P01 V2.26 Raindrop Screenshot Audit
on:
  push:
    branches: [task/p01-v222-multi-surface-gate-20260828]
    paths: ['.github/workflows/p01-v226-raindrop-screenshot-audit-20260828.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXACT_SOURCE: c6a889b5496a29d848f2d9c5ab5d333d501fad48
      SOURCE_TREE: b05ecd02b6ce571e8709c154cbfc1f377f2f4db5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.EXACT_SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: p01
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - name: Exact source and syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p01 rev-parse HEAD)" = "$EXACT_SOURCE"
          test "$(git -C p01 rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          find p01/src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          grep -F 'surface-workspace.css' p01/src/app/SurfaceShell.php >/dev/null
          grep -F '全部收藏' p01/src/app/SurfaceShell.php >/dev/null
          echo P01_V226_SCREENSHOT_SOURCE=PASS
      - name: Fresh runtime and representative seed
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT=/tmp/p01-v226-shot; COOKIE=/tmp/p01-v226-shot.cookies
          rm -rf "$ROOT" "$COOKIE" /tmp/p01-v226-shots
          cp -a p01/src "$ROOT"
          php -S 127.0.0.1:18311 -t "$ROOT" >/tmp/p01-v226-shot.log 2>&1 & echo $! >/tmp/p01-v226-shot.pid
          for i in $(seq 1 30); do curl -fsS -c "$COOKIE" -b "$COOKIE" http://127.0.0.1:18311/setup.php -o /tmp/setup.html && break; sleep 1; done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -sS -c "$COOKIE" -b "$COOKIE" -X POST http://127.0.0.1:18311/setup.php --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=VF Start V226 UI Audit' --data-urlencode 'admin_password=P01V226!Audit' --data-urlencode 'admin_password_confirm=P01V226!Audit' -o /tmp/setup-post.html
          curl -fsS -c "$COOKIE" -b "$COOKIE" -H 'Content-Type: application/json' -X POST 'http://127.0.0.1:18311/api.php?action=login' --data '{"password":"P01V226!Audit"}' | jq -e '.ok==true' >/dev/null
          cat >/tmp/p01-v226-seed.php <<'PHP'
          <?php
          require '/tmp/p01-v226-shot/app/bootstrap.php'; require_once '/tmp/p01-v226-shot/app/SurfaceRepository.php';
          $r=new VfRepository(vf_db());$s=new VfSurfaceRepository(vf_db());
          $cats=[];foreach(['开发与 API','服务器与运维','AI 与自动化','资源与工具','影视与片源','生活与效率'] as $n){$cats[$n]=$r->createCategory(['name'=>$n,'description'=>'','is_private'=>false]);}
          $titles=['GitHub','Cloudflare Dashboard','Vercel','Notion','ChatGPT','Archivebate','WildAI','AdsPower','PingMe','Hubstudio','Xesim','GoLogin','Linken Sphere','Hushed','Multilogin','BrowserScan','NameSilo','Dynadot','Vultr','Linode','CloudPanel','Uptime Kuma','Plausible','Sentry'];
          for($i=0;$i<72;$i++){$name=$titles[$i%count($titles)].' '.($i>=count($titles)?(intdiv($i,count($titles))+1):'');$c=array_values($cats)[$i%count($cats)];$r->saveLink(null,['category_id'=>$c,'title'=>trim($name),'url'=>'https://example.com/site-'.$i,'description'=>'这是用于真实高密度收藏库审计的一行说明，验证列表扫描、字号和截断是否舒适。','click_count'=>180-$i,'is_favorite'=>$i<8],'import');}
          foreach([['硅谷101','科技 / 商业','科技与商业长期内容源'],['蜉蝣天地 Meanders','访谈 / 社会','适合后台收听的长访谈'],['大问题 Dialectic','哲学 / 思想','长期思考型频道'],['小约翰可汗','历史 / 社会','历史与社会叙事'],['疯投圈','投资 / 商业','商业与投资播客'],['枫言枫语','科技 / 互联网','科技访谈与播客'],['自说自话的总裁','历史 / 世界','长篇叙事频道'],['脑洞乌托邦','案件 / 调查','案例与调查内容']] as $idx=>$x){$z=$r->saveLink(null,['category_id'=>$cats['资源与工具'],'title'=>$x[0],'url'=>'https://www.youtube.com/@channel'.$idx,'description'=>$x[2],'is_private'=>true],'manual');$s->upsertProfile((int)$z['id'],['surface'=>'channels','resource_kind'=>'youtube','background_friendly'=>true,'note'=>$x[1]]);}
          foreach([['奥本海默','2023','want'],['信条','2020','watched'],['布达佩斯大饭店','2014','favorite'],['流浪地球 2','2023','want'],['盗梦空间','2010','watched'],['无间道','2002','favorite'],['宇宙探索编辑部','2023','want'],['沙丘 2','2024','want']] as $idx=>$x){$z=$r->saveLink(null,['category_id'=>$cats['影视与片源'],'title'=>$x[0],'url'=>'https://example.com/watch-'.$idx,'description'=>'私人影视索引','is_private'=>true],'manual');$s->upsertProfile((int)$z['id'],['surface'=>'watch','resource_kind'=>'movie','media_year'=>$x[1],'media_status'=>$x[2]]);}
          foreach([['Anh Tung 5566','https://www.youtube.com/@pending1'],['Keihidupan Aviasi','https://www.youtube.com/@pending2'],['Raja Video Shorts ID','https://www.youtube.com/@pending3'],['村花胡胡','https://www.youtube.com/@pending4']] as $x){$r->saveLink(null,['category_id'=>$cats['影视与片源'],'title'=>$x[0],'url'=>$x[1],'description'=>'等待归属建议','is_private'=>true],'manual');}
          echo "SEED=PASS\n";
          PHP
          php /tmp/p01-v226-seed.php
          php "$ROOT/cli/verify.php" | grep -Fx 'VERIFY_PASS=YES'
          php "$ROOT/cli/surface-verify.php" | grep -Fx 'MULTI_SURFACE_PASS=YES'
      - name: Capture desktop and mobile screenshots
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT=/tmp/p01-v226-shot; COOKIE=/tmp/p01-v226-shot.cookies
          mkdir -p /tmp/p01-v226-shots
          for spec in 'all:surfaces.php' 'start:start.php' 'channels:channels.php' 'watch:watch.php' 'inbox:surface-manager.php'; do
            name=${spec%%:*};url=${spec#*:};curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:18311/$url" -o "$ROOT/audit-$name.html";
            grep -F 'surface-workspace.css' "$ROOT/audit-$name.html" >/dev/null;
          done
          BROWSER=$(command -v google-chrome || command -v chromium || command -v chromium-browser); test -n "$BROWSER"
          for name in all start channels watch inbox; do "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars --window-size=1365,768 --screenshot="/tmp/p01-v226-shots/${name}-1365x768.png" "http://127.0.0.1:18311/audit-${name}.html"; done
          for name in all channels watch; do "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars --window-size=390,844 --screenshot="/tmp/p01-v226-shots/${name}-390x844.png" "http://127.0.0.1:18311/audit-${name}.html"; done
          test "$(find /tmp/p01-v226-shots -type f -name '*.png' -size +10k | wc -l)" -eq 8
          printf 'EXACT_SOURCE=%s\nTREE=%s\nDESKTOP=1365x768\nMOBILE=390x844\n' "$EXACT_SOURCE" "$SOURCE_TREE" >/tmp/p01-v226-shots/MANIFEST.txt
      - name: Browser layout assertions
        shell: bash
        run: |
          set -Eeuo pipefail
          BROWSER=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          # Static contract: private workspace is one shell and old dashboard identity is absent.
          for f in /tmp/p01-v226-shot/audit-{all,start,channels,watch,inbox}.html; do grep -F 'vf-app-sidebar' "$f" >/dev/null; grep -F '搜索全部收藏' "$f" >/dev/null; ! grep -F '你的互联网，从这里继续。' "$f"; done
          ! grep -F 'Classic Start' /tmp/p01-v226-shot/audit-start.html
          ! grep -F 'vf-space-switcher' /tmp/p01-v226-shot/audit-all.html
          grep -F 'vf-channel-row' /tmp/p01-v226-shot/audit-channels.html >/dev/null
          grep -F 'vf-watch-grid' /tmp/p01-v226-shot/audit-watch.html >/dev/null
          grep -F '系统认出的内容' /tmp/p01-v226-shot/audit-inbox.html >/dev/null
          ! grep -F 'vf-editor-row' /tmp/p01-v226-shot/audit-inbox.html
          echo P01_V226_SCREENSHOT_CONTRACT=PASS
      - uses: actions/upload-artifact@v4
        with:
          name: p01-v226-raindrop-screenshot-audit-${{ env.EXACT_SOURCE }}
          path: /tmp/p01-v226-shots
          if-no-files-found: error
          retention-days: 7
      - name: Verdict
        run: |
          echo P01_V226_RAINDROP_SCREENSHOT_AUDIT=PASS
          echo RELEASE=NO
          echo PRODUCTION=NO
