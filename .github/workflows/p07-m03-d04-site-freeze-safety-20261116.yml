name: P07 D04 site-scoped final freeze safety proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-m03-d04-site-freeze-safety-20261116.yml'
permissions:
  contents: read
jobs:
  selected-site-safety:
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout public runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Transient exact P07 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: b00a2c32ae9f2e5320533b0a86f4faaa13261eaa
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: .p07-private-site-guard
      - name: Verify fail-closed selected-site final cutover and bounded UX
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-private-site-guard rev-parse HEAD)" = b00a2c32ae9f2e5320533b0a86f4faaa13261eaa
          cd .p07-private-site-guard
          export PYTHONPATH="$PWD/lib"
          python3 -B -m unittest discover -s tests -p test_p07_m03_d04_single_site_cutover_guard.py -v
          python3 -B scripts/check_p07_modules.py --module P07-M03-D04 \
            --pr-title 'P07-M03-D04 服务器迁移：单站停写保护' \
            --changed-file lib/server_migration_pull.py --changed-file tests/test_p07_m03_d04_single_site_cutover_guard.py \
            --affected P07-M03-D04 --shared-reason '限制 D04 原有全局 Nginx freeze，避免影响其他网站'
          python3 -B scripts/check_p07_terminal_ux.py
          echo P07_M03_D04_SELECTED_SITE_FINAL_FREEZE_FAIL_CLOSED=PASS
      - name: Remove private checkout
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- .p07-private-site-guard
          test ! -e .p07-private-site-guard
          echo P07_M03_D04_PRIVATE_SOURCE_CLEAN=PASS
