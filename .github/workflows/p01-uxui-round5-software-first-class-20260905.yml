name: P01 UXUI Round5 Software First Class

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p01-uxui-round5-software-first-class-20260905.yml

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_SHA: 0b2945648dd1613322a95858649ed9dbff26fe11
      BASE_SHA: ea84e990baa6fdc3b63389e585f990a825f4dfbf
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: feature/p01-uxui-round5-software-first-class-20260905
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_sqlite,sqlite3
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exact source and no-release boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(cat VERSION)" = '2.46.3'
          test "$(cat src/VERSION.txt)" = '2.46.3'
          changed="$(git diff --name-only "$BASE_SHA"..HEAD | sort)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | wc -l)" -eq 8
          ! printf '%s\n' "$changed" | grep -Eq '(^VERSION$|^src/VERSION.txt$|^src/migrations/|^src/app/bootstrap.php$)'
          ! grep -Fq 'surface.php' src/software.php
      - name: Syntax and Round 5 identity
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in src/software.php src/app/SubjectPageChrome.php src/app/SoftwareProductPage.php src/app/SoftwareWorkspaceHome.php src/app/SoftwareWorkspaceDetail.php tests/unit/uxui_round5_software_identity_contract.php tests/unit/software_workspace_contract.php tests/unit/software_workspace_source_contract.php tests/unit/consolidated_product_acceptance_contract.php; do php -l "$f"; done
          php tests/unit/uxui_round5_software_identity_contract.php
          php tests/unit/software_workspace_contract.php
          php tests/unit/software_workspace_source_contract.php
          find src -name '*.php' -type f -print0 | xargs -0 -n1 php -l >/dev/null
      - name: Product regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in tests/unit/consolidated_product_acceptance_contract.php tests/unit/consolidated_product_model_contract.php tests/unit/workspace_view_catalog_contract.php tests/unit/workspace_nine_entry_source_contract.php tests/unit/global_page_size_authority_contract.php tests/unit/uxui_round1_home_root_contract.php tests/unit/uxui_round2_subject_identity_contract.php tests/unit/uxui_round3_course_identity_contract.php tests/unit/uxui_round4_tools_identity_contract.php; do
            [ -f "$f" ] && php "$f"
          done
      - name: Static first-class Software assertions
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'VfSoftwareProductPage::render()' src/software.php
          grep -Fq "VfSubjectPageChrome::context('software')" src/app/SoftwareProductPage.php
          for group in '系统基础' '浏览器扩展' '开发 / 编程' '服务器 / SSH' '文件 / 办公 / 知识' '下载 / 影音' '网络' '远程 / 设备' '装机 / 救援'; do grep -Fq "$group" src/app/SoftwareWorkspaceHome.php; done
          grep -Fq 'vf-software-profiles:v1' src/assets/software-workspace.js
          grep -Fq 'vf-software-install-run:v1:' src/assets/software-workspace.js
          grep -Fq 'items:[]' src/assets/software-workspace.js
          grep -Fq 'window.open(asset.href' src/assets/software-workspace.js
          grep -Fq '来源待确认' src/app/SoftwareWorkspaceHome.php src/assets/software-workspace.js
          ! grep -Fq 'navigator.userAgent' src/assets/software-workspace.js
          grep -Fq 'vf-software-row-hit' src/app/SoftwareWorkspaceDetail.php
          ! grep -Fq '.vf-workspace-list' src/assets/software-workspace.css
          ! grep -Fq '.vf-functional-head' src/assets/software-workspace.css
          ! grep -Fq '.vf-workspace-list' src/assets/software-detail.css
          ! grep -Fq '.vf-functional-head' src/assets/software-detail.css
          ! grep -Fq 'overflow-x:auto' src/assets/software-workspace.css
          ! grep -Fq 'overflow-x:auto' src/assets/software-detail.css
          grep -Fq '@media(max-width:700px)' src/assets/software-workspace.css
          grep -Fq '@media(max-width:700px)' src/assets/software-detail.css
          echo P01_UXUI_ROUND5_SOFTWARE_FIRST_CLASS=PASS
