name: P08 source and shared rules exact proof (temporary)
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/p08-public-authority-source-proof.yml]

permissions:
  contents: read

jobs:
  p08-public-authority:
    if: >-
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'maintenance/p08-public-authority-source-proof-20261112'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      P08_SHA: 160c8bbab6b250924d507663f59f0f1603d2b684
      GOV_SHA: 3c08fdd80063d5e3eab4409d9d6934b1f4c11761
    steps:
      - name: Checkout P08 exact private source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: ${{ env.P08_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p08

      - name: Checkout canonical GOV-DOC main exact source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: ${{ env.GOV_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov

      - name: P08 project source gate, negative fixtures and live public rule routing
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p08 rev-parse HEAD)" = "$P08_SHA"
          test "$(git -C gov rev-parse HEAD)" = "$GOV_SHA"
          test -z "$(git -C p08 status --porcelain --untracked-files=all)"
          echo P08_GOV_SOURCE_EXACTNESS=PASS

          if PYTHONDONTWRITEBYTECODE=1 python3 -B p08/scripts/check_stack_contract.py \
             --root p08 --phase foundation > "$RUNNER_TEMP/p08-stack.log" 2>&1; then
             echo P08_PUBLIC_AUTHORITY_SOURCE_GATE=PASS
          else
             echo P08_PUBLIC_AUTHORITY_SOURCE_GATE=FAIL
             exit 1
          fi
          if (cd p08 && PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover \
              -s tests -p test_stack_contract.py -v) > "$RUNNER_TEMP/p08-fixtures.log" 2>&1; then
             echo P08_PUBLIC_AUTHORITY_NEGATIVE_FIXTURES=PASS
          else
             echo P08_PUBLIC_AUTHORITY_NEGATIVE_FIXTURES=FAIL
             exit 1
          fi

          cat > "$RUNNER_TEMP/p08-receipt.json" <<'P08_RECEIPT'
          {
            "schema": "vf.public-authority.task-delivery-check.v1",
            "project": "P08",
            "source": "160c8bbab6b250924d507663f59f0f1603d2b684",
            "project_authority": {
              "agents": "AGENTS.md",
              "current": "docs/authority/CURRENT.md",
              "acceptance": "docs/authority/RPD.md",
              "applicability": "docs/authority/PUBLIC_AUTHORITY_APPLICABILITY.md"
            },
            "acceptance_markers": ["WordPress-simple", "CloudPanel"],
            "required_domains": [
              "INSTALL", "SECURITY", "TESTING", "UPGRADE",
              "DATA_SCHEMA", "GIT", "UA_UI"
            ],
            "task_capabilities": [
              "formal_development", "source_change", "full_package",
              "clean_install", "auth", "database", "installer_ui"
            ],
            "delivery": {
              "profile": "web_full_zip",
              "entrypoint": "public/index.php",
              "requires_git": false,
              "requires_manual_source_copy": false
            }
          }
          P08_RECEIPT

          python3 -B gov/governance/public-authority/tools/task_delivery_contract_lint.py \
            --phase resolve \
            --receipt "$RUNNER_TEMP/p08-receipt.json" \
            --project-root p08 \
            --artifact-root "$RUNNER_TEMP" \
            --public-router gov/governance/public-authority/VF_PUBLIC_AUTHORITY_APPLICABILITY_ROUTER_V1.0.json \
            > "$RUNNER_TEMP/p08-public-router.log" 2>&1
          grep -q '^CONTRACT_CHECK=RULES_RESOLVED$' "$RUNNER_TEMP/p08-public-router.log"
          echo P08_CANONICAL_PUBLIC_AUTHORITY_RESOLVE=PASS
          echo P08_FIRST_FULL_ARTIFACT=NOT_PROVEN
          echo P08_PRODUCTION=NOT_AUTHORIZED

      - name: Remove private source and temporary fixtures
        if: always()
        shell: bash
        run: |
          rm -rf p08 gov
          rm -f "$RUNNER_TEMP/p08-stack.log" "$RUNNER_TEMP/p08-fixtures.log" \
                "$RUNNER_TEMP/p08-receipt.json" "$RUNNER_TEMP/p08-public-router.log"
          echo P08_PRIVATE_SOURCE_CLEANUP=ATTEMPTED
