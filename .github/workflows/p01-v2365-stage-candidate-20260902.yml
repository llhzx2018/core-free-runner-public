name: P01 V2.36.5 Stage Composite Candidate
on:
  push:
    branches: [release/p01-v2365-candidate-20260902]
    paths: [.github/workflows/p01-v2365-stage-candidate-20260902.yml]
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: release/v2.36.5-formal-candidate-20260902
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: candidate
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: 1abe3f8808faf43d0214ec98840f0573f5216adb
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: develop
      - name: Build exact V2.36.5 composite candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          MAIN=4760b152fdf7f2ea2866c8fa04dfee873fb3ee3b
          DEVELOP=1abe3f8808faf43d0214ec98840f0573f5216adb
          test "$(git -C candidate rev-parse HEAD)" = "$MAIN"
          test "$(git -C develop rev-parse HEAD)" = "$DEVELOP"
          test "$(git -C candidate rev-parse HEAD:src/assets/update-core.js)" != "$(git -C develop rev-parse HEAD:src/assets/update-core.js)"
          declare -A EXPECTED=(
            [src/assets/update-core.js]=f18284aefac9d02294be9667631d3ffdbb7de6d9
            [src/app/ResourceCoverCache.php]=629a3a8b964fcfd3c75728d2ca66070a900c7e1b
            [src/app/FunctionalWorkspace.php]=54df2b995db32d6de2b9e593e04037a1bf4eb610
            [src/assets/resource-media.css]=ec8ca1a7e2ab4a829f939bb2442ea9af8297b873
            [src/assets/workspace-rebaseline.css]=2eeb8b057d96bb04222f14d2cb02fa48089a882e
          )
          for f in "${!EXPECTED[@]}"; do
            test "$(git -C develop rev-parse HEAD:$f)" = "${EXPECTED[$f]}"
            cp "develop/$f" "candidate/$f"
          done
          cd candidate
          python3 - <<'PY'
          from pathlib import Path
          import json
          Path('VERSION').write_text('2.36.5\n')
          Path('src/VERSION.txt').write_text('2.36.5\n')
          p=Path('src/app/bootstrap.php'); s=p.read_text(); n=s.replace("define('VF_VERSION', '2.36.4');","define('VF_VERSION', '2.36.5');",1)
          if n==s: raise SystemExit('VF_VERSION source drift')
          p.write_text(n)
          c=Path('CHANGELOG.md'); old=c.read_text(); block='''## V2.36.5 · Patch Release Candidate · 2026-09-02\n\n- 修复在线升级 Atomic 成功后首次自动刷新仍可能显示旧 Runtime 的终态一致性问题；现在确认服务端已加载目标版本后再自动刷新。\n- 修复 YouTube 频道/@handle 自动封面元数据可能位于 512 KiB 之后而被提前放弃的问题。\n- 修复 Apple Podcasts 页面较大导致已经存在的 artwork 元数据因通用 512 KiB 上限被丢弃的问题。\n- 修复 resource-actions.css 相对 @import 被解析为错误根路径、实际操作样式未加载的问题，统一经 Asset Authority 加载。\n- 修复 390/360 手机端选择超长三级分类路径后页面出现横向溢出的问题。\n- Runtime delta 已由 PR #192/#195/#196/#197/#198 与对应 Fresh Runtime/Browser Gate 验证；unknown runtime bytes = 0。\n- Schema 保持 `2026082901`，无 Migration；正式升级路径仅允许 V2.36.4 → V2.36.5。\n\n'''
          if old.startswith('## V2.36.5 · Patch Release Candidate'): raise SystemExit('duplicate candidate changelog')
          c.write_text(block+old)
          q=Path('VF_PROJECT.json'); d=json.loads(q.read_text())
          if d.get('production_version')!='2.36.4' or d.get('schema_version')!='2026082901': raise SystemExit('production/schema drift')
          if d.get('production_release',{}).get('version')!='2.36.4' or d.get('published_release',{}).get('version')!='2.36.4': raise SystemExit('release authority drift')
          d['status']='V2.36.4 OWNER PRODUCTION / PUBLISHED / V2.36.5 RELEASE CANDIDATE'
          d['working_version']='2.36.5'; d['target_release_version']='2.36.5'
          d['current_phase']='V2.36.5 PATCH RELEASE / CANDIDATE READINESS PENDING'
          d['candidate_version']='2.36.5'; d['candidate_schema_version']='2026082901'
          d['candidate_state']='V2.36.5 OWNER-AUTHORIZED PATCH CANDIDATE / READINESS PENDING'
          d['formal_release_state']='V2.36.4 PUBLISHED + OWNER PRODUCTION / V2.36.5 NOT YET RELEASED'
          d['develop_state']='V2.36.5 VERIFIED FIVE-FILE RUNTIME DELTA / RELEASE AUTHORIZED'
          d['current_authority']='Owner Production V2.36.4 / Published Latest V2.36.4 / V2.36.5 owner-authorized patch candidate prepared'
          d['next_action']='Run V2.36.5 Candidate Readiness and formal release gates. No main/Tag/Release/core-updates/Owner Production write before gates pass.'
          scope=['src/assets/update-core.js','src/app/ResourceCoverCache.php','src/app/FunctionalWorkspace.php','src/assets/resource-media.css','src/assets/workspace-rebaseline.css']
          d['current_change']={'change_id':'P01-V2365-VERIFIED-L2-PATCH-BUNDLE-20260902','type':'PATCH RELEASE / VERIFIED BUG FIX BUNDLE','production_base':'4760b152fdf7f2ea2866c8fa04dfee873fb3ee3b','develop_authority':'1abe3f8808faf43d0214ec98840f0573f5216adb','scope':scope,'product_prs':[192,195,196,197,198],'product_gates':[33528457499,33533134083,33535563405,33538869534,33540239877],'schema_change':False,'migration':None,'version_change':True,'release_authorized_by_owner':True,'main_write':False,'production_write':False,'runner_main_write':False}
          d['v2_36_5_release_candidate']={'version':'2.36.5','production_version':'2.36.4','published_predecessor_version':'2.36.4','predecessor_tag':'v2.36.4','predecessor_source':'6b321422bce5a834521786d8233149c7624aa014','production_main':'4760b152fdf7f2ea2866c8fa04dfee873fb3ee3b','develop_authority':'1abe3f8808faf43d0214ec98840f0573f5216adb','schema_version':'2026082901','schema_change':False,'migration':None,'scope':'PATCH / FIVE VERIFIED POST-V2.36.4 BUG FIXES','runtime_scope':scope,'product_prs':[192,195,196,197,198],'product_gates':[33528457499,33533134083,33535563405,33538869534,33540239877],'unknown_runtime_bytes':0,'state':'CANDIDATE READINESS PENDING','main_write':False,'core_updates_write':False,'owner_production_write':False}
          q.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          python3 -m json.tool VF_PROJECT.json >/dev/null
          php -l src/app/bootstrap.php
          find src -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.txt
          find src/assets -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/tmp/js-check.txt
          git diff --check
          test "$(cat VERSION)" = 2.36.5
          test "$(cat src/VERSION.txt)" = 2.36.5
          grep -Fx "define('VF_VERSION', '2.36.5');" src/app/bootstrap.php >/dev/null
          git diff --name-only "$MAIN" -- src | sort >/tmp/runtime-delta.txt
          expected=$(printf '%s\n' src/VERSION.txt src/app/FunctionalWorkspace.php src/app/ResourceCoverCache.php src/app/bootstrap.php src/assets/resource-media.css src/assets/update-core.js src/assets/workspace-rebaseline.css | sort)
          test "$(cat /tmp/runtime-delta.txt)" = "$expected"
          test "$(git rev-parse HEAD:database)" = "$(git rev-parse "$MAIN":database)"
          git config user.name VictorForge; git config user.email llhzx2018@gmail.com
          git add CHANGELOG.md VERSION VF_PROJECT.json src/VERSION.txt src/app/bootstrap.php src/assets/update-core.js src/app/ResourceCoverCache.php src/app/FunctionalWorkspace.php src/assets/resource-media.css src/assets/workspace-rebaseline.css
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 10
          git commit -m 'release(P01): prepare V2.36.5 composite candidate'
          echo "CANDIDATE=$(git rev-parse HEAD)"
          echo "TREE=$(git rev-parse HEAD^{tree})"
          echo "RUNTIME_TREE=$(git rev-parse HEAD:src)"
          echo "PARENT=$(git rev-parse HEAD^)"
          git push origin HEAD:release/v2.36.5-formal-candidate-20260902
