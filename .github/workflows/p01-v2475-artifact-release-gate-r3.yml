name: P01 V2.47.5 Artifact Release Gate R3

on:
  pull_request:
    paths:
      - '.github/workflows/p01-v2475-artifact-release-gate-r3.yml'

permissions:
  contents: read

concurrency:
  group: p01-v2475-artifact-release-r3
  cancel-in-progress: false

jobs:
  artifact-release:
    if: github.head_ref == 'temp/p01-v2475-preview-gate-20260910'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      BASE_SHA: caf6994d2689fc30d52cd12d71f82310f4fb2d2b
      CANDIDATE_SHA: 55be083da7263fef21b850ca11e7c167cb6b5cf4
      TARGET_BRANCH: release/v2.47.5-preview-20260910
      SOURCE_TAG: v2.47.4
      SOURCE_SHA: f24b01af34b173aef3ae6a7ecb5489aa6df19cc8
      SOURCE_VERSION: 2.47.4
      TARGET_VERSION: 2.47.5
      EXPECTED_SCHEMA: '2026090401'
      PREVIEW_TAG: v2.47.5-preview.1
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}

    steps:
      - name: Exact live release preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN" && test -n "$RELEASE_TOKEN"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/main" --jq '.object.sha')" = "$BASE_SHA"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/${TARGET_BRANCH}" --jq '.object.sha')" = "$CANDIDATE_SHA"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/tags/${SOURCE_TAG}" --jq '.object.sha')" = "$SOURCE_SHA"
          if GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/tags/${PREVIEW_TAG}" >/dev/null 2>&1; then echo PREVIEW_BLOCK=TAG_ALREADY_EXISTS; exit 81; fi
          echo P01_V2475_R3_PREFLIGHT=PASS

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.CANDIDATE_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          path: vf-start

      - name: Checkout exact V2.47.4 baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: baseline

      - name: Checkout proven artifact helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 1dd635d8e8d4485736458672fb7a5be397d94f89
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: helper

      - name: Checkout proven artifact template
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 0439b0df027ae0bc6c21a8dbf91b066a564130f9
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: template

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd
          coverage: none

      - name: Bind exact candidate and baseline identities
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C vf-start rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C baseline rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n ' < vf-start/VERSION)" = "$TARGET_VERSION"
          test "$(tr -d '\r\n ' < baseline/VERSION)" = "$SOURCE_VERSION"
          test "$(php -r '$p=json_decode(file_get_contents("vf-start/VF_PROJECT.json"),true); echo $p["working_schema_version"];')" = "$EXPECTED_SCHEMA"
          test "$(php -r '$p=json_decode(file_get_contents("baseline/VF_PROJECT.json"),true); echo $p["working_schema_version"];')" = "$EXPECTED_SCHEMA"
          echo P01_V2475_R3_IDENTITIES=PASS

      - name: Deterministic FULL and ATOMIC UPDATE including real-data preservation
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf formal candidate proven
          cp -a vf-start formal
          cp -a vf-start candidate
          cp -a template proven
          cp helper/scripts/_tmp_p01_v2470_formal_artifact_gate.sh /tmp/p01-v2475-r3-gate.sh
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path('/tmp/p01-v2475-r3-gate.sh'); s=p.read_text(encoding='utf-8')
          repl=[
            ('7f3492f70276d83efed371296d69709c1e991350',os.environ['CANDIDATE_SHA']),
            ('b70971514ccf1c6b8f3793bfc5a2200cad47dfe9',os.environ['CANDIDATE_SHA']),
            ('1bd95e8777e72f6cd89206ddb9daf934ad4e6b9e',os.environ['SOURCE_SHA']),
            ('33993725218',os.environ['GITHUB_RUN_ID']),
            ('BIND_PR=416','BIND_PR=0'),
            ('OWNER_AUTHORIZED_V2470_RELEASE_CHAIN_20260906','OWNER_AUTHORIZED_V2475_CONTENT_FIRST_RELEASE_20260910'),
            ('V2470','V2475'),('v2470','v2475')]
          for a,b in repl:
              if a not in s: raise SystemExit('missing helper anchor '+a)
              s=s.replace(a,b)
          s=s.replace('2.47.0','__TARGET__').replace('2.46.4','2.47.4').replace('__TARGET__','2.47.5')
          old="src=src.replace(\"'release_type':'patch'\",\"'release_type':'minor'\")"
          if old not in s: raise SystemExit('release-type helper anchor missing')
          s=s.replace(old,"src=src.replace('V2.46.1 之后 Consolidated L2 Product Optimization 的正式发布版本。','V2.47.4 之后 content-first shell / Navigation-only taxonomy rail 的维护版本。')",1)
          p.write_text(s,encoding='utf-8')
          PY
          chmod +x /tmp/p01-v2475-r3-gate.sh
          bash /tmp/p01-v2475-r3-gate.sh | tee /tmp/p01-v2475-r3-artifact.log
          ASSETS=/tmp/p01-v2475-formal-artifacts
          for f in VF-Start-V2.47.5-FULL.zip VF-Start-V2.47.5-FULL.zip.sha256 VF_Start_V2.47.5_UPDATE.zip VF_Start_V2.47.5_UPDATE.zip.sha256; do test -f "$ASSETS/$f"; done
          (cd "$ASSETS" && sha256sum -c VF-Start-V2.47.5-FULL.zip.sha256 && sha256sum -c VF_Start_V2.47.5_UPDATE.zip.sha256)
          ! unzip -Z1 "$ASSETS/VF-Start-V2.47.5-FULL.zip" | grep -Eq '(^|/)(private|backups|uploads|runtime-data)(/|$)'
          echo P01_V2475_R3_ARTIFACT_UPGRADE_GATE=PASS

      - name: Publish exact preview prerelease
        env:
          GH_TOKEN: ${{ env.RELEASE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ASSETS=/tmp/p01-v2475-formal-artifacts
          gh api --method POST "repos/${PRODUCT_REPO}/git/refs" -f ref="refs/tags/${PREVIEW_TAG}" -f sha="$CANDIDATE_SHA" >/dev/null
          test "$(gh api "repos/${PRODUCT_REPO}/git/ref/tags/${PREVIEW_TAG}" --jq '.object.sha')" = "$CANDIDATE_SHA"
          cat >/tmp/notes.md <<EOF
          P01 · VF Start V2.47.5 Preview 1

          Exact candidate: ${CANDIDATE_SHA}
          Previous formal release: ${SOURCE_TAG} / ${SOURCE_SHA}
          Navigation keeps the desktop taxonomy rail; Home and subject product pages are content-first/full-width.
          Schema ${EXPECTED_SCHEMA}; migration NONE.
          Exact candidate UA/UI Chromium proof: Runner 34555855409 PASS.
          Deterministic FULL / ATOMIC UPDATE / existing-data preservation / security: Runner ${GITHUB_RUN_ID} PASS.
          Stable distribution NOT UPDATED. Production NOT WRITTEN / NOT VERIFIED.
          EOF
          gh release create "$PREVIEW_TAG" "$ASSETS/VF-Start-V2.47.5-FULL.zip" "$ASSETS/VF-Start-V2.47.5-FULL.zip.sha256" "$ASSETS/VF_Start_V2.47.5_UPDATE.zip" "$ASSETS/VF_Start_V2.47.5_UPDATE.zip.sha256" --repo "$PRODUCT_REPO" --title 'VF Start V2.47.5 Preview 1' --notes-file /tmp/notes.md --prerelease --verify-tag
          echo P01_V2475_R3_PREVIEW=PASS

      - name: Remote byte identity readback
        env:
          GH_TOKEN: ${{ env.PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api "repos/${PRODUCT_REPO}/releases/tags/${PREVIEW_TAG}" --jq '.prerelease')" = true
          rm -rf /tmp/remote; mkdir /tmp/remote
          gh release download "$PREVIEW_TAG" --repo "$PRODUCT_REPO" --dir /tmp/remote
          LOCAL=/tmp/p01-v2475-formal-artifacts REMOTE=/tmp/remote python3 - <<'PY'
          from pathlib import Path
          import hashlib,os
          l=Path(os.environ['LOCAL']); r=Path(os.environ['REMOTE']); names=['VF-Start-V2.47.5-FULL.zip','VF-Start-V2.47.5-FULL.zip.sha256','VF_Start_V2.47.5_UPDATE.zip','VF_Start_V2.47.5_UPDATE.zip.sha256']
          assert sorted(p.name for p in r.iterdir() if p.is_file())==sorted(names)
          for n in names:
              a,b=l/n,r/n; ha=hashlib.sha256(a.read_bytes()).hexdigest(); hb=hashlib.sha256(b.read_bytes()).hexdigest(); assert a.stat().st_size==b.stat().st_size and ha==hb; print(f'REMOTE_ASSET={n}|{a.stat().st_size}|{ha}')
          print('P01_V2475_R3_REMOTE_BYTES=PASS')
          PY

      - name: Upload closure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: P01-V2.47.5-ARTIFACT-RELEASE-R3-${{ github.run_id }}
          path: |
            /tmp/p01-v2475-r3-artifact.log
            /tmp/p01-v2475-formal-artifacts/*.sha256
          if-no-files-found: warn
          retention-days: 14

      - name: Final verdict
        run: |
          echo P01_V2475_PREVIEW_CANDIDATE_GATE=PASS
          echo INSTALL_GATE=PASS
          echo UPGRADE_GATE=PASS
          echo DATA_PRESERVATION_GATE=PASS
          echo SECURITY_GATE=PASS
          echo TESTING_GATE=PASS
          echo UA_UI_GATE=PASS_FROM_RUN_34555855409
          echo STABLE_DISTRIBUTION_UPDATED=false
          echo PRODUCTION_WRITE=false

      - name: Cleanup
        if: always()
        run: rm -rf vf-start baseline helper template formal candidate proven /tmp/p01-v2475-* /tmp/remote