name: P02 V2.5.14 Formal Verify And Publish

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v2514-formal-release.yml'

permissions:
  contents: read

jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require registered capabilities
        env:
          RELEASE_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
        run: test -n "$RELEASE_TOKEN"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: 21bdc9e7de1490898db327567638f42e753112c5
          token: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
          path: product
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize sealed formal pipeline for V2.5.14
        env:
          PRODUCT_REF: 21bdc9e7de1490898db327567638f42e753112c5
          RELEASE_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
        run: |
          set -Eeuo pipefail
          git fetch origin task/p02-v2511-formal-release
          git show FETCH_HEAD:scripts/p02-v2510-formal-release.sh > "$RUNNER_TEMP/p02-v2514-formal.sh"
          python3 - "$RUNNER_TEMP/p02-v2514-formal.sh" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]);s=p.read_text(encoding='utf-8')
          # Build the immutable direct path from authenticated Production V2.5.12 to V2.5.14.
          s=s.replace('2.5.10','2.5.14')
          s=s.replace('2.5.9','2.5.12')
          s=s.replace('32225789953','32238547521')
          s=s.replace('test "$(jq -r .runtime_source_file_count SOURCE_MANIFEST.json)" = 72','test "$(jq -r .runtime_source_file_count SOURCE_MANIFEST.json)" = 74')
          marker="notes=out/f'VF_Library_V{VER}_RELEASE_NOTES.md'; notes.write_text(f'''"
          end="''')\n arts=[sz,fz,uz,az,rf,notes]"
          if marker in s and end in s:
              i=s.index(marker);j=s.index(end,i)
              notes="""notes=out/f'VF_Library_V{VER}_RELEASE_NOTES.md'; notes.write_text(f'''# VF Library V{VER}\n\nV2.5.14 supersedes V2.5.13 before OWNER production upgrade and provides the direct authenticated Production V2.5.12 upgrade path.\n\n- Includes all already-verified V2.5.13 personal workflow refinements: notebook category/scope switches reset the title list to top, Scratch pin/reorder and safe shortcuts, /scratch/ direct entry, deliberate reader resume, and H2/image folding.\n- Refines the Scratch writing surface for long-term viewing and editing: Chinese-first writing font stack, Desktop 17px / 1.88 line-height, no extra letter spacing, and approximately 920px centered text measure on large screens.\n- Mobile remains 16px / 1.82 with 18px safe side padding.\n- Writing Typography Runner 32238547521 PASS: source/privacy gates, 74-file SOURCE_MANIFEST, Fresh Install, real Chromium desktop computed typography, real Scratch autosave, 390px mobile and SQLite integrity/FK.\n- V2.5.13 Release remains immutable historical evidence and is not rewritten. OWNER has not upgraded Production to V2.5.13.\n- Schema remains {SCHEMA}; no migration. Existing {SRCVER} sites use UPDATE.\n''')\n arts=[sz,fz,uz,az,rf,notes]"""
              s=s[:i]+notes+s[j+len(end):]
          p.write_text(s,encoding='utf-8')
          PY
          bash "$RUNNER_TEMP/p02-v2514-formal.sh"
