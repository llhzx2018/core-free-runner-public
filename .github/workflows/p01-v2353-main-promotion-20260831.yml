name: P01 V2.35.3 Main Promotion Gate
on:
  push:
    branches: [release/p01-v2353-main-promotion-20260831]
    paths: [.github/workflows/p01-v2353-main-promotion-20260831.yml]
permissions:
  contents: read
jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FORMAL_SOURCE: 8f1073120f8096fc23554906615601752feb036d
      EXPECTED_MAIN: 3c9239be8bba34637411110f7fdb43f6e494c880
      HOTFIX_RUN: '33358556905'
      CANDIDATE_RUN: '33358914290'
      FORMAL_RUN: '33359124042'
      STRICT_RUN: '33360911751'
    steps:
      - name: Checkout exact formal source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.FORMAL_SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01
      - name: Exact Promotion Gate and fast-forward main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          for run in "$HOTFIX_RUN" "$CANDIDATE_RUN" "$FORMAL_RUN" "$STRICT_RUN"; do test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$run --jq .conclusion)" = success; done
          cd p01
          test "$(git rev-parse HEAD)" = "$FORMAL_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = ece02ef928ad5b119e2b0237e7963a607865ddbb
          test "$(git rev-parse HEAD:src)" = 7f181909c7ccd3179491f21cfca426008de4295f
          MAIN=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          DEVELOP=$(git ls-remote origin refs/heads/develop | awk '{print $1}')
          test "$MAIN" = "$EXPECTED_MAIN"
          test "$DEVELOP" = "$FORMAL_SOURCE"
          if git ls-remote --exit-code --tags origin refs/tags/v2.35.3 >/dev/null 2>&1; then echo UNEXPECTED_V2353_TAG; exit 20; fi
          git fetch origin "$EXPECTED_MAIN" --quiet
          git merge-base --is-ancestor "$EXPECTED_MAIN" "$FORMAL_SOURCE"
          test "$(cat VERSION)" = 2.35.3
          test "$(cat src/VERSION.txt)" = 2.35.3
          grep -Fx "define('VF_VERSION', '2.35.3');" src/app/bootstrap.php >/dev/null
          test "$(jq -r .schema_version VF_PROJECT.json)" = 2026082901
          test "$(jq -r .production_version VF_PROJECT.json)" = 2.35.2
          test "$(jq -r .candidate_state VF_PROJECT.json)" = PASS
          git push origin "$FORMAL_SOURCE:refs/heads/main"
          REMOTE_MAIN=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          REMOTE_DEVELOP=$(git ls-remote origin refs/heads/develop | awk '{print $1}')
          test "$REMOTE_MAIN" = "$FORMAL_SOURCE"
          test "$REMOTE_DEVELOP" = "$FORMAL_SOURCE"
          printf 'P01_V2353_MAIN_PROMOTION=PASS\nMAIN=%s\nDEVELOP=%s\nHOTFIX_RUN=%s\nCANDIDATE_RUN=%s\nFORMAL_RUN=%s\nSTRICT_FRESH_RUN=%s\nTAG=ABSENT\nOWNER_PRODUCTION_WRITE=NO\n' "$REMOTE_MAIN" "$REMOTE_DEVELOP" "$HOTFIX_RUN" "$CANDIDATE_RUN" "$FORMAL_RUN" "$STRICT_RUN" | tee /tmp/p01-v2353-main-promotion.txt
      - name: Upload promotion evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2353-main-promotion-${{ github.run_id }}
          path: /tmp/p01-v2353-main-promotion.txt
          if-no-files-found: error
          retention-days: 90
