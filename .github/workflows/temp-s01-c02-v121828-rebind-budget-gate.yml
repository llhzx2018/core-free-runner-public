name: TEMP S01-C02 Ops 1.21.828 Rebind Budget Gate
on:
  push:
    branches:
      - temp/s01-c02-v121828-rebind-budget-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121828-rebind-budget-gate.yml'
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PRODUCT_REPO: llhzx2018/vf-tools-ops
      BASE: 3a59068c8e9c6adc533e37883f48bd38224e7362
      CANDIDATE: f5bb1b29969a983aaa5fe0f5fba3b0785fe3d514
    steps:
      - name: Checkout exact 1.21.828 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.CANDIDATE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops
      - name: Verify identity syntax and exact scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$CANDIDATE"
          test "$(tr -d '\r\n' < ops/VERSION)" = '1.21.828'
          grep -Fq 'Version: 1.21.828' ops/vf-ops.php
          grep -Fq "define('VF_OPS_VERSION', '1.21.828')" ops/vf-ops.php
          grep -Fq "TRUSTED-SOURCE-REBIND-BUDGET-V1" ops/vf-ops.php
          php -l ops/vf-ops.php >/dev/null
          php -l ops/includes/site-release/s01-static-failed-candidate-source-rebind-v121827.php >/dev/null
          php -l ops/.github/phase3/v121828-trusted-source-rebind-budget.php >/dev/null
          mapfile -t files < <(git -C ops diff --name-only "$BASE" "$CANDIDATE")
          printf '%s\n' "${files[@]}"
          test "${#files[@]}" -eq 4
          printf '%s\n' "${files[@]}" | grep -Fxq '.github/phase3/v121828-trusted-source-rebind-budget.php'
          printf '%s\n' "${files[@]}" | grep -Fxq 'VERSION'
          printf '%s\n' "${files[@]}" | grep -Fxq 'includes/site-release/s01-static-failed-candidate-source-rebind-v121827.php'
          printf '%s\n' "${files[@]}" | grep -Fxq 'vf-ops.php'
          test -z "$(git -C ops diff --name-only "$BASE" "$CANDIDATE" -- includes/release/builders includes/cf-static-downloads/repair-parts/final-audit-records-parts includes/release/steps/class-step-final-audit.php)"
      - name: Run 1.21.828 contract and Candidate route regression
        shell: bash
        run: |
          set -Eeuo pipefail
          php ops/.github/phase3/v121828-trusted-source-rebind-budget.php | grep -Fxq PASS_V121828_TRUSTED_SOURCE_REBIND_BUDGET
          php ops/.github/phase3/v121826-candidate-route-normalization.php | grep -Fxq PASS_V121826_CANDIDATE_ROUTE_NORMALIZATION
      - name: Verify pre-copy resource gate and fail-closed marker scope
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('ops/includes/site-release/s01-static-failed-candidate-source-rebind-v121827.php').read_text()
          gate=s.index('VF_Ops_Release_Zip::assert_source_archive_safe_v121376($trustedPath, $sourceName, $root);')
          copy=s.index('if (!@copy($trustedPath, $newSource))')
          sha=s.index('hash_equals($expectedSha, $copiedSha)')
          reopen=s.index('VF_Ops_Release_Zip::count_entries($newSource)')
          assert gate < copy < sha < reopen
          assert 'create_inspection_from_trusted_source_v121814(' not in s
          assert "sanitize_key((string)($job['job_mode'] ?? '')) !== 'inspect_only'" in s
          assert "remove_action('admin_init', 'vf_ops_s01_static_inspection_failure_marker_reconcile_v121815', 27)" in s
          assert 'FAILED_CANDIDATE_SOURCE_REBIND_DISK_BUDGET' in s
          for forbidden in ['candidatePackageReady=true','finalOnlinePass=YES','force_pass','skip_final_audit']:
              assert forbidden not in s
          print('V121828_ORDER_AND_FAIL_CLOSED=PASS')
          PY
      - name: Verify Production remains fail-closed before 1.21.828 owner upgrade
        shell: bash
        run: |
          set -Eeuo pipefail
          S="$(curl -fsSL --retry 2 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-static-candidate-readiness')"
          D="$(curl -fsSL --retry 2 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-domain-authority')"
          test "$(jq -r .pluginVersion <<<"$S")" = '1.21.827'
          test "$(jq -r .activeStaticJobMode <<<"$S")" = 'candidate'
          test "$(jq -r .activeStaticJobStatus <<<"$S")" = 'FAIL'
          test "$(jq -r '.candidatePackageReady==false' <<<"$S")" = true
          test "$(jq -r '.manualSourceUploadRequired==false' <<<"$S")" = true
          test "$(jq -r .authorityFinalHost <<<"$D")" = 'https://ilovem3u8.com'
          test "$(jq -r '.authorityMatch==true' <<<"$D")" = true
      - name: Verify runner main untouched
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          J="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/core-free-runner-public/git/ref/heads/main)"
          test "$(jq -r .object.sha <<<"$J")" = '0160b557ad4ae0e8c6acd97e7551285bc05870bd'
      - name: Seal result
        run: echo 'PASS_V121828_TRUSTED_SOURCE_REBIND_BUDGET_GATE'
