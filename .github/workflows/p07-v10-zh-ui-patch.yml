name: P07 v1.0 中文界面补丁

on:
  push:
    branches:
      - experiment/p07-oneshot-bench-v05
    paths:
      - .github/workflows/p07-v10-zh-ui-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/p07-oneshot-bench-v05
      - name: 全量中文化用户可见界面
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('experiments/p07-bench.sh')
          s=p.read_text(encoding='utf-8')

          def must(old,new):
              global s
              if old not in s:
                  raise SystemExit('missing patch anchor: '+old[:100])
              s=s.replace(old,new,1)

          must('APP="P07 Enhanced Bench"','APP="P07 VPS 一键验机"')
          must('VERSION="1.0.0-rc2"','VERSION="1.0.0-rc3-zh"')

          old_help="""P07 Enhanced Bench
          Usage:
            p07-bench.sh              Run complete one-shot VPS acceptance
            p07-bench.sh --demo       Render a no-impact demo
            p07-bench.sh --self-test  Run internal logic tests
            p07-bench.sh --version

          Environment:
            P07_BENCH_IO_MIB=256      Per-round disk write size (3 rounds)
            P07_BENCH_DIR=/var/tmp    Real filesystem path used for I/O"""
          new_help="""P07 VPS 一键验机
          用法：
            p07-bench.sh              自动完成整台 VPS 验机
            p07-bench.sh --demo       显示无影响演示结果
            p07-bench.sh --self-test  运行内部自检
            p07-bench.sh --version    显示版本

          可选环境变量：
            P07_BENCH_IO_MIB=256      每轮磁盘写入大小（共 3 轮）
            P07_BENCH_DIR=/var/tmp    磁盘测速使用的真实目录"""
          must(old_help,new_help)
          must("*) printf 'Unknown option: %s\\n' \"$1\" >&2; exit 2 ;;","*) printf '未知参数：%s\\n' \"$1\" >&2; exit 2 ;;")

          old_color="""color_state(){
            case \"$1\" in
              PASS|NORMAL) printf '%s%s%s' \"$GREEN\" \"$1\" \"$RESET\" ;;
              RISK|PARTIAL|INCONCLUSIVE|UNKNOWN|SKIPPED|UNAVAILABLE) printf '%s%s%s' \"$YELLOW\" \"$1\" \"$RESET\" ;;
              FAIL|HIGH_RISK) printf '%s%s%s' \"$RED\" \"$1\" \"$RESET\" ;;
              *) printf '%s' \"$1\" ;;
            esac
          }"""
          new_color="""zh_state(){
            case \"$1\" in
              PASS|NORMAL) printf '正常' ;;
              FAIL) printf '失败' ;;
              RISK) printf '有风险' ;;
              HIGH_RISK) printf '高风险' ;;
              PARTIAL) printf '部分有效' ;;
              INCONCLUSIVE) printf '证据不足' ;;
              UNKNOWN) printf '未知' ;;
              SKIPPED) printf '已跳过' ;;
              UNAVAILABLE) printf '不可用' ;;
              NOT_RUN) printf '未执行' ;;
              GOOD) printf '良好' ;;
              LOW) printf '较低' ;;
              *) printf '%s' \"$1\" ;;
            esac
          }
          zh_reason(){
            case \"$1\" in
              NONE) printf '-' ;;
              TIMEOUT) printf '超时' ;;
              RATE_LIMITED) printf '测速平台限流' ;;
              BACKEND_UNAVAILABLE) printf '测速平台暂不可用' ;;
              BACKEND_FAILURE) printf '测速平台异常' ;;
              NODE_UNAVAILABLE) printf '测速节点不可用' ;;
              DNS_FAILURE) printf 'DNS 解析失败' ;;
              TLS_FAILURE) printf 'TLS 连接失败' ;;
              CONNECTION_FAILED) printf '连接失败' ;;
              PARSE_ERROR) printf '结果解析失败' ;;
              SPEEDTEST_UNAVAILABLE) printf 'Ookla 测速不可用' ;;
              TIMEOUT_COMMAND_MISSING) printf '系统缺少超时控制命令' ;;
              LIBRESPEED_FALLBACK) printf '全球备用测速' ;;
              LIBRESPEED_UNAVAILABLE) printf '备用测速节点不可用' ;;
              SUPPLEMENTAL) printf '补充基准' ;;
              *) printf '%s' \"$1\" ;;
            esac
          }
          zh_name(){
            case \"$1\" in
              'Speedtest.net') printf '自动测速节点' ;;
              'Los Angeles, US') printf '美国西部·洛杉矶' ;;
              'Dallas, US') printf '美国中部·达拉斯' ;;
              'Montreal, CA') printf '加拿大·蒙特利尔' ;;
              'Paris, FR') printf '欧洲·巴黎' ;;
              'Amsterdam, NL') printf '欧洲·阿姆斯特丹' ;;
              'China Unicom, CN') printf '中国联通' ;;
              'China Telecom, CN') printf '中国电信' ;;
              'China Backup, CN') printf '中国大陆备用' ;;
              'Hong Kong, CN') printf '中国香港' ;;
              'Singapore, SG') printf '新加坡' ;;
              'Taipei, CN') printf '台北' ;;
              'Tokyo, JP'|'Tokyo') printf '日本·东京' ;;
              'US West') printf '美国西部' ;;
              'US Central') printf '美国中部' ;;
              'US East') printf '美国东部' ;;
              'Europe') printf '欧洲' ;;
              'Asia South') printf '亚洲南部' ;;
              'Cloudflare Edge') printf 'Cloudflare 边缘基准' ;;
              *) printf '%s' \"$1\" ;;
            esac
          }
          color_state(){
            local shown; shown=\"$(zh_state \"$1\")\"
            case \"$1\" in
              PASS|NORMAL) printf '%s%s%s' \"$GREEN\" \"$shown\" \"$RESET\" ;;
              FAIL|HIGH_RISK) printf '%s%s%s' \"$RED\" \"$shown\" \"$RESET\" ;;
              *) printf '%s%s%s' \"$YELLOW\" \"$shown\" \"$RESET\" ;;
            esac
          }"""
          must(old_color,new_color)
          must("trap 'printf \"\\n%sTest interrupted. Cleaning up...%s\\n\" \"$RED\" \"$RESET\"; exit 130' INT TERM","trap 'printf \"\\n%s测速已中断，正在清理临时文件……%s\\n\" \"$RED\" \"$RESET\"; exit 130' INT TERM")

          start=s.index('print_system(){')
          end=s.index('\n\nrate_to_mb(){',start)
          s=s[:start]+'''print_system(){
            printf '%s%s-------------------- P07 VPS 一键验机 --------------------%s\\n' "$BOLD" "$BLUE" "$RESET"
            printf ' 版本               : %s%s%s\\n' "$GREEN" "$VERSION" "$RESET"
            printf ' CPU 型号           : %s%s%s\\n' "$BLUE" "${CPU:-未知}" "$RESET"
            printf ' CPU 核心           : %s%s%s @ %s\\n' "$GREEN" "$CORES" "$RESET" "$FREQ"
            printf ' CPU 缓存           : %s\\n' "${CACHE:-未知}"
            printf ' AES-NI             : %s\\n' "$([[ "$AES" == Enabled ]] && printf '已启用' || printf '未启用')"
            printf ' 硬件虚拟化         : %s\\n' "$([[ "$NESTED" == Enabled ]] && printf '已启用' || printf '未启用')"
            printf ' 磁盘总量           : %s%s%s  （已用 %s）\\n' "$YELLOW" "$DISK_TOTAL" "$RESET" "$DISK_USED"
            printf ' 内存总量           : %s%s%s  （已用 %s）\\n' "$YELLOW" "$RAM_TOTAL" "$RESET" "$RAM_USED"
            printf ' Swap               : %s  （已用 %s）\\n' "$SWAP_TOTAL" "$SWAP_USED"
            printf ' 运行时间           : %s\\n' "$UPTIME"
            printf ' 系统负载           : %s\\n' "$LOAD"
            printf ' 操作系统           : %s\\n' "$OS"
            printf ' 系统架构           : %s（%s 位）\\n' "$ARCH" "$BITS"
            printf ' 内核版本           : %s\\n' "$KERNEL"
            printf ' TCP 拥塞控制       : %s%s%s\\n' "$YELLOW" "$TCP" "$RESET"
            printf ' 虚拟化类型         : %s%s%s\\n' "$BLUE" "$VIRT" "$RESET"
            if [[ "$CLOUDPANEL_STATE" == Installed ]]; then
              printf ' CloudPanel         : %s已安装%s · %s 个网站\\n' "$GREEN" "$RESET" "$CLOUDPANEL_SITES"
            else
              printf ' CloudPanel         : %s未检测到%s\\n' "$GRAY" "$RESET"
            fi
            if [[ "$IPV4" == OFFLINE || "$IPV4" == UNAVAILABLE ]]; then
              printf ' IPv4               : %s不可用%s\\n' "$RED" "$RESET"
            else
              printf ' IPv4               : %s%s%s  （在线）\\n' "$GREEN" "$IPV4" "$RESET"
            fi
            if [[ "$IPV6" == OFFLINE || "$IPV6" == UNAVAILABLE ]]; then
              printf ' IPv6               : %s不可用%s\\n' "$RED" "$RESET"
            else
              printf ' IPv6               : %s%s%s  （在线）\\n' "$GREEN" "$IPV6" "$RESET"
            fi
            printf ' 网络运营商/组织    : %s%s%s\\n' "$BLUE" "$ORG" "$RESET"
            printf ' 机房位置           : %s / %s\\n' "$CITY" "$COUNTRY"
            printf ' 地区               : %s%s%s\\n' "$YELLOW" "$REGION" "$RESET"
          }'''+s[end:]

          s=s.replace("printf '%s%s I/O Speed%s  %s(3 x %s MiB, %s)%s\\n' \"$BOLD\" \"$MAGENTA\" \"$RESET\" \"$GRAY\" \"$IO_MIB\" \"$BENCH_DIR\" \"$RESET\"","printf '%s%s 磁盘 I/O 测速%s  %s（3 轮 × %s MiB，目录：%s）%s\\n' \"$BOLD\" \"$MAGENTA\" \"$RESET\" \"$GRAY\" \"$IO_MIB\" \"$BENCH_DIR\" \"$RESET\"")
          s=s.replace("printf ' %-18s: invalid P07_BENCH_IO_MIB (64-1024 required)\\n' 'I/O Test'","printf ' 磁盘测速           : 参数无效（P07_BENCH_IO_MIB 必须为 64-1024）\\n'")
          s=s.replace("printf ' %-18s: directory not writable\\n' 'I/O Test'","printf ' 磁盘测速           : 目录不可写，已跳过\\n'")
          s=s.replace("printf ' %-18s: blocked on %s (not real disk)\\n' 'I/O Test' \"$fs\"","printf ' 磁盘测速           : %s 不是真实磁盘，已跳过\\n' \"$fs\"")
          s=s.replace("printf ' %-18s: insufficient free space\\n' 'I/O Test'","printf ' 磁盘测速           : 可用空间不足，已跳过\\n'")
          s=s.replace("printf ' I/O #%-13s: %sFAIL%s\\n' \"$i\" \"$RED\" \"$RESET\"","printf ' 第 %-2s 轮            : %s失败%s\\n' \"$i\" \"$RED\" \"$RESET\"")
          s=s.replace("printf ' I/O Speed(%s run)  : %s%s%s\\n' \"$i\" \"$GREEN\" \"$(format_mb_rate \"$mb\")\" \"$RESET\"","printf ' 第 %-2s 轮            : %s%s%s\\n' \"$i\" \"$GREEN\" \"$(format_mb_rate \"$mb\")\" \"$RESET\"")
          s=s.replace("printf ' I/O Speed(average) : %s%s%s\\n' \"$GREEN\" \"$(format_mb_rate \"$IO_AVG_MB\")\" \"$RESET\"","printf ' 三轮平均           : %s%s%s\\n' \"$GREEN\" \"$(format_mb_rate \"$IO_AVG_MB\")\" \"$RESET\"")
          s=s.replace("printf '%sSpeedtest checksum mismatch; network benchmark skipped.%s\\n' \"$RED\" \"$RESET\"","printf '%s测速组件校验失败，网络测速已安全跳过。%s\\n' \"$RED\" \"$RESET\"")
          s=s.replace("printf '%sLibreSpeed checksum mismatch; global fallback skipped.%s\\n' \"$RED\" \"$RESET\"","printf '%s备用测速组件校验失败，全球备用测速已跳过。%s\\n' \"$RED\" \"$RESET\"")

          # Network row rendering: keep machine TSV values English, render terminal in Chinese.
          s=s.replace('''    printf ' %s%-17s%s %s%-13s%s %s%-15s%s %s%-9s%s %s%-7s%s %-18s\\n' \\
              "$YELLOW" "$name" "$RESET" "$GREEN" "$up Mbps" "$RESET" "$RED" "$down Mbps" "$RESET" "$BLUE" "$lat ms" "$RESET" "$GREEN" "PASS" "$RESET" '-' ''','''    printf ' %s%-22s%s %s%-13s%s %s%-15s%s %s%-9s%s %s%-9s%s %-18s\\n' \\
              "$YELLOW" "$(zh_name "$name")" "$RESET" "$GREEN" "$up Mbps" "$RESET" "$RED" "$down Mbps" "$RESET" "$BLUE" "$lat ms" "$RESET" "$GREEN" "正常" "$RESET" '-' ''')
          s=s.replace('''    printf ' %s%-17s%s %-13s %-15s %-9s %s%-7s%s %s%-18s%s\\n' \\
              "$YELLOW" "$name" "$RESET" '-' '-' '-' "$RED" "$state" "$RESET" "$YELLOW" "$reason" "$RESET"''','''    printf ' %s%-22s%s %-13s %-15s %-9s %s%-9s%s %s%-18s%s\\n' \\
              "$YELLOW" "$(zh_name "$name")" "$RESET" '-' '-' '-' "$RED" "$(zh_state "$state")" "$RESET" "$YELLOW" "$(zh_reason "$reason")" "$RESET"''')
          s=s.replace('''      printf ' %s%-17s%s %s%-13s%s %s%-15s%s %s%-9s%s %s%-7s%s %-18s\\n' \\
                "$YELLOW" "$display" "$RESET" "$GREEN" "$up Mbps" "$RESET" "$RED" "$down Mbps" "$RESET" "$BLUE" "$lat ms" "$RESET" "$GREEN" "PASS" "$RESET" '-' ''','''      printf ' %s%-22s%s %s%-13s%s %s%-15s%s %s%-9s%s %s%-9s%s %-18s\\n' \\
                "$YELLOW" "$(zh_name "$display")" "$RESET" "$GREEN" "$up Mbps" "$RESET" "$RED" "$down Mbps" "$RESET" "$BLUE" "$lat ms" "$RESET" "$GREEN" "正常" "$RESET" '-' ''')
          s=s.replace('''  printf ' %s%-17s%s %-13s %-15s %-9s %s%-7s%s %s%-18s%s\\n' \\
            "$YELLOW" "$display" "$RESET" '-' '-' '-' "$RED" "FAIL" "$RESET" "$YELLOW" "$best_reason" "$RESET"''','''  printf ' %s%-22s%s %-13s %-15s %-9s %s%-9s%s %s%-18s%s\\n' \\
            "$YELLOW" "$(zh_name "$display")" "$RESET" '-' '-' '-' "$RED" "失败" "$RESET" "$YELLOW" "$(zh_reason "$best_reason")" "$RESET"''')

          # LibreSpeed and Cloudflare user-facing rows.
          s=s.replace("printf ' %sGlobal fallback     : LibreSpeed multi-region quick test%s\\n' \"$BLUE\" \"$RESET\"","printf ' %s全球备用测速       : 正在使用多地区备用节点%s\\n' \"$BLUE\" \"$RESET\"")
          s=s.replace("printf ' %sLibreSpeed fallback unavailable.%s\\n' \"$YELLOW\" \"$RESET\"","printf ' %s全球备用测速暂不可用。%s\\n' \"$YELLOW\" \"$RESET\"")
          s=s.replace("'US West'","'美国西部'",1)
          s=s.replace("'US Central'","'美国中部'",1)
          s=s.replace("'US East'","'美国东部'",1)
          s=s.replace("'Europe'","'欧洲'",1)
          s=s.replace("'Asia South'","'亚洲南部'",1)
          # Restore internal demo case names by accepting both languages.
          s=s.replace("case \"$display\" in\n      '美国西部')","case \"$display\" in\n      'US West'|'美国西部')")
          s=s.replace("      '美国中部')","      'US Central'|'美国中部')")
          s=s.replace("      '美国东部')","      'US East'|'美国东部')")
          s=s.replace("      '欧洲')","      'Europe'|'欧洲')")
          s=s.replace("      '亚洲南部')","      'Asia South'|'亚洲南部')")

          s=s.replace("printf ' %sSupplemental        : Cloudflare Edge single-edge baseline%s\\n' \"$BLUE\" \"$RESET\"","printf ' %s补充基准           : Cloudflare 单边缘节点（仅作参考）%s\\n' \"$BLUE\" \"$RESET\"")
          s=s.replace("cloudflare_fallback || printf ' %sCloudflare supplemental baseline unavailable.%s\\n' \"$YELLOW\" \"$RESET\"","cloudflare_fallback || printf ' %sCloudflare 补充基准暂不可用。%s\\n' \"$YELLOW\" \"$RESET\"")

          # Replace network heading and provider messages.
          must("printf '%s Node Name         Upload        Download        Latency   State   Reason%s\\n' \"$BOLD$YELLOW\" \"$RESET\"","printf '%s 节点/地区              上传          下载            延迟      状态       原因%s\\n' \"$BOLD$YELLOW\" \"$RESET\"")
          s=s.replace("printf ' %sSpeedtest backend unavailable; Ookla node tests skipped.%s\\n' \"$YELLOW\" \"$RESET\"","printf ' %sOokla 测速平台当前不可用，已自动切换全球备用测速。%s\\n' \"$YELLOW\" \"$RESET\"")
          s=s.replace("printf ' %sSpeedtest backend preflight failed: %s. Remaining Ookla nodes skipped.%s\\n' \"$YELLOW\" \"$pre_reason\" \"$RESET\"","printf ' %sOokla 预检未通过：%s。已自动切换全球备用测速。%s\\n' \"$YELLOW\" \"$(zh_reason \"$pre_reason\")\" \"$RESET\"")

          # Chinese assessment recommendations and terminal labels.
          s=s.replace('CHINA_RECOMMENDATION="OOKLA RATE LIMITED; NO IP-BLOCKING VERDICT FROM SPEEDTEST"','CHINA_RECOMMENDATION="Ookla 当前被限流；这不代表服务器 IP 被中国大陆屏蔽"')
          s=s.replace('CHINA_RECOMMENDATION="OOKLA BACKEND UNAVAILABLE; NO IP-BLOCKING VERDICT FROM SPEEDTEST"','CHINA_RECOMMENDATION="Ookla 平台当前不可用；这不代表服务器 IP 被中国大陆屏蔽"')
          s=s.replace('CHINA_RECOMMENDATION="CARRIER SPEED NOT RUN; VERIFY FROM MAINLAND"','CHINA_RECOMMENDATION="运营商测速未完成，建议补充中国大陆到 VPS 的真实访问验证"')
          s=s.replace('CHINA_RECOMMENDATION="OUTBOUND LOOKS NORMAL; VERIFY MAINLAND -> VPS BEFORE CUTOVER"','CHINA_RECOMMENDATION="当前出站访问看起来正常；正式迁移前仍建议验证中国大陆到 VPS"')
          s=s.replace('CHINA_RECOMMENDATION="CHANGE IP BEFORE MIGRATION"','CHINA_RECOMMENDATION="风险较高，建议迁移前更换 IP"')
          s=s.replace('CHINA_RECOMMENDATION="VERIFY FROM MAINLAND BEFORE MIGRATION"','CHINA_RECOMMENDATION="存在风险，建议迁移前从中国大陆真实访问验证"')
          s=s.replace('CHINA_RECOMMENDATION="CARRIER NODES UNAVAILABLE; VERIFY FROM MAINLAND"','CHINA_RECOMMENDATION="运营商测速节点不可用，建议从中国大陆真实访问验证"')
          s=s.replace('CHINA_RECOMMENDATION="MAINLAND SIGNAL INCONCLUSIVE"','CHINA_RECOMMENDATION="现有证据不足，暂时不能判断中国大陆访问质量"')
          s=s.replace('carrier_line="NOT_RUN (Ookla ${OOKLA_PROVIDER_REASON})"','carrier_line="未执行（Ookla：$(zh_reason \"$OOKLA_PROVIDER_REASON\")）"')
          s=s.replace('carrier_line="${cn_speed_pass}/${cn_speed_total} PASS | Fallback ${fallback_pass} PASS"','carrier_line="主要运营商 ${cn_speed_pass}/${cn_speed_total} 正常｜备用 ${fallback_pass} 个正常"')
          s=s.replace("printf '%s%s China Access Assessment%s\\n' \"$BOLD\" \"$BLUE\" \"$RESET\"","printf '%s%s 中国大陆访问评估%s\\n' \"$BOLD\" \"$BLUE\" \"$RESET\"")
          s=s.replace("printf ' Outbound HTTPS      : Overseas %s/3 | Mainland %s/6\\n' \"$overseas_http\" \"$mainland_http\"","printf ' VPS 出站 HTTPS     : 海外 %s/3｜中国大陆 %s/6\\n' \"$overseas_http\" \"$mainland_http\"")
          s=s.replace("printf ' Mainland HTTPS Fail : %s\\n' \"$mainland_failed\"","printf ' 大陆站点失败       : %s\\n' \"$mainland_failed\"")
          s=s.replace("printf ' Carrier Speed       : %s\\n' \"$carrier_line\"","printf ' 运营商测速         : %s\\n' \"$carrier_line\"")
          s=s.replace("printf ' Evidence Quality    : %s\\n' \"$evidence_quality\"","printf ' 证据质量           : %s\\n' \"$(zh_state \"$evidence_quality\")\"")
          s=s.replace("printf ' Mainland -> VPS     : %sNOT_RUN%s\\n' \"$YELLOW\" \"$RESET\"","printf ' 大陆 → VPS         : %s未执行%s（当前还没有大陆入口探针）\\n' \"$YELLOW\" \"$RESET\"")
          s=s.replace("printf ' China IP Risk       : '; color_state \"$CHINA_VERDICT\"; printf '\\n'","printf ' 中国大陆访问风险   : '; color_state \"$CHINA_VERDICT\"; printf '\\n'")
          s=s.replace("printf ' Advice              : %s%s%s\\n' \"$YELLOW\" \"$CHINA_RECOMMENDATION\" \"$RESET\"","printf ' 建议               : %s%s%s\\n' \"$YELLOW\" \"$CHINA_RECOMMENDATION\" \"$RESET\"")
          s=s.replace("printf ' %sNote: Ookla provider failure is test-platform evidence, not IP-blocking evidence.%s\\n' \"$GRAY\" \"$RESET\"","printf ' %s说明：Ookla 平台故障/限流只是测速平台问题，不能据此判断 IP 被屏蔽。%s\\n' \"$GRAY\" \"$RESET\"")
          s=s.replace("printf ' %sNote: fallback-only evidence cannot produce NORMAL; NODE_UNAVAILABLE is neutral.%s\\n' \"$GRAY\" \"$RESET\"","printf ' %s说明：仅有备用测速时不会强行判定“正常”；测速节点不可用也不会被当成 IP 风险。%s\\n' \"$GRAY\" \"$RESET\"")

          s=s.replace("printf ' Finished in        : %s%s min %s sec%s\\n' \"$GREEN\" \"$((ELAPSED/60))\" \"$((ELAPSED%60))\" \"$RESET\"","printf ' 总耗时             : %s%s 分 %s 秒%s\\n' \"$GREEN\" \"$((ELAPSED/60))\" \"$((ELAPSED%60))\" \"$RESET\"")
          s=s.replace("printf ' Timestamp          : %s\\n' \"$(date '+%Y-%m-%d %H:%M:%S %Z')\"","printf ' 完成时间           : %s\\n' \"$(date '+%Y-%m-%d %H:%M:%S %Z')\"")
          s=s.replace("printf ' Report saved       : %s%s%s\\n' \"$BLUE\" \"$REPORT_TXT\" \"$RESET\"","printf ' 中文报告           : %s%s%s\\n' \"$BLUE\" \"$REPORT_TXT\" \"$RESET\"")
          s=s.replace("printf ' JSON report        : %s%s%s\\n' \"$BLUE\" \"$REPORT_JSON\" \"$RESET\"","printf ' 机器数据（JSON）   : %s%s%s\\n' \"$BLUE\" \"$REPORT_JSON\" \"$RESET\"")

          # Translate Cloudflare terminal presentation without changing internal TSV identity.
          s=s.replace("\"$YELLOW\" 'Cloudflare Edge' \"$RESET\" \"$GREEN\" '850.0 Mbps'","\"$YELLOW\" 'Cloudflare 边缘基准' \"$RESET\" \"$GREEN\" '850.0 Mbps'")
          s=s.replace("\"$GREEN\" 'PASS' \"$RESET\" 'SUPPLEMENTAL'","\"$GREEN\" '正常' \"$RESET\" '补充基准'")
          s=s.replace("\"$YELLOW\" 'Cloudflare Edge' \"$RESET\" \"$GREEN\" \"$up_mbps Mbps\"","\"$YELLOW\" 'Cloudflare 边缘基准' \"$RESET\" \"$GREEN\" \"$up_mbps Mbps\"")
