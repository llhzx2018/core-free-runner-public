name: P02 R52 Scratch Ownership Convergence

on:
  push:
    branches:
      - run/p02-r52-scratch-ownership

permissions:
  contents: read

jobs:
  converge:
    runs-on: ubuntu-24.04
    env:
      BASE_REF: 72a78edbce44a9f9bd4ee18c58bc99387cbd485d
      EXPECTED_VERSION: 2.5.32
      PORT: '18100'
      POST_PORT: '18101'
    steps:
      - name: Checkout exact current develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.BASE_REF }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product

      - name: Converge Scratch ownership
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_REF"
          test "$(tr -d '\r\n' < VERSION)" = "$EXPECTED_VERSION"
          python3 - <<'PY'
          from pathlib import Path
          import json

          common=Path('public/assets/v254-common-branding.js')
          text=common.read_text(encoding='utf-8')
          loader_start="\n\n(function(){\n  function loadScratchAssets(){"
          model_marker="\n\n/* V2.5.17_LIBRARY_MODEL_CONVERGENCE */"
          overflow_marker="\n\n/* V2.5.18_SCRATCH_TAB_OVERFLOW_UX */"
          if text.count(loader_start)!=1 or text.count(model_marker)!=1 or text.count(overflow_marker)!=1:
              raise SystemExit('v254 ownership markers changed unexpectedly')
          head,rest=text.split(loader_start,1)
          _,after_loader=rest.split(model_marker,1)
          without_loader=head+model_marker+after_loader
          common_part,overflow=without_loader.split(overflow_marker,1)
          common.write_text(common_part.rstrip()+"\n",encoding='utf-8')

          scratch=Path('public/assets/scratch-tabs.js')
          scratch_text=scratch.read_text(encoding='utf-8').rstrip()
          scratch_text += "\n\n/* P02 V2.5.32 R52 · Scratch tab overflow native domain ownership */\n"
          scratch_text += "/* V2.5.18_SCRATCH_TAB_OVERFLOW_UX */"+overflow.rstrip()+"\n"
          scratch.write_text(scratch_text,encoding='utf-8')

          index=Path('public/index.php')
          lines=index.read_text(encoding='utf-8').splitlines()
          if any('/assets/scratch-tabs.js' in line for line in lines):
              raise SystemExit('scratch-tabs already has static runtime entry')
          out=[]
          inserted=False
          for line in lines:
              out.append(line)
              if '/assets/app.js' in line:
                  out.append('<script src="/assets/scratch-tabs.js?v=<?=rawurlencode(VFTB_VERSION)?>" defer></script>')
                  inserted=True
          if not inserted: raise SystemExit('app.js runtime entry missing')
          index.write_text('\n'.join(out)+'\n',encoding='utf-8')

          authority=Path('docs/authority/P02_DEVELOP_CANDIDATE_IDENTITY.json')
          data=json.loads(authority.read_text(encoding='utf-8'))
          if data.get('runtime_source_file_count')!=67: raise SystemExit('unexpected runtime count')
          conv=data.setdefault('convergence',{})
          conv['scratch_runtime_static_entry']=True
          conv['scratch_dynamic_loader_retired']=True
          conv['scratch_tab_overflow_domain_owned']=True
          data['next_gate']='POST_SCRATCH_OWNERSHIP_REVIEW'
          authority.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          Path('docs/evidence/P02_SCRATCH_RUNTIME_OWNERSHIP_CONVERGENCE_20260831.md').write_text('''# P02 Scratch Runtime Ownership Convergence · 2026-08-31\n\n## Decision\n\nScratch is a cohesive domain module. Its runtime loading and tab-overflow behavior must be owned by `scratch-tabs.js`, not by historical `v254-common-branding.js`.\n\n## Change\n\n- `scratch-tabs.js` becomes a static runtime entry immediately after `app.js`.\n- The historical dynamic `loadScratchAssets()` loader is removed from `v254-common-branding.js`.\n- Scratch tab overflow controls move intact into `scratch-tabs.js`.\n- Runtime source count remains 67; this is ownership convergence, not file-count reduction.\n- Favicon and Library Model behavior in `v254-common-branding.js` remain untouched for later independent review.\n\n## Boundary\n\nNo schema, main, tag, release, update-channel or production write.\n''',encoding='utf-8')

          Path('tests/unit/p02_scratch_runtime_ownership_contract.mjs').write_text('''import fs from 'node:fs';\nimport assert from 'node:assert/strict';\nconst read=p=>fs.readFileSync(new URL('../../'+p,import.meta.url),'utf8');\nconst index=read('public/index.php');\nassert.equal((index.match(/\\/assets\\/scratch-tabs\\.js/g)||[]).length,1);\nassert(index.indexOf('/assets/scratch-tabs.js')>index.indexOf('/assets/app.js'));\nconst common=read('public/assets/v254-common-branding.js');\nassert.equal(common.includes('loadScratchAssets'),false);\nassert.equal(common.includes('data-scratch-v259'),false);\nassert.equal(common.includes('tabOverflowUxV2518'),false);\nassert.equal(common.includes('V2.5.18_SCRATCH_TAB_OVERFLOW_UX'),false);\nconst scratch=read('public/assets/scratch-tabs.js');\nfor(const token of ['tabOverflowUxV2518','scratch-tab-scroll-v2518','EDGE_DRAG_ZONE','leaveScratchThenActivate']) assert(scratch.includes(token),token);\nconst candidate=JSON.parse(read('docs/authority/P02_DEVELOP_CANDIDATE_IDENTITY.json'));\nassert.equal(candidate.runtime_source_file_count,67);\nfor(const key of ['scratch_runtime_static_entry','scratch_dynamic_loader_retired','scratch_tab_overflow_domain_owned']) assert.equal(candidate.convergence[key],true,key);\nconsole.log('P02_SCRATCH_RUNTIME_OWNERSHIP_CONTRACT=PASS');\n''',encoding='utf-8')
          PY
          python3 scripts/generate-source-manifest.py
          python3 scripts/verify-source-manifest.py
          echo P02_R52_TRANSFORM=PASS

      - name: Full contracts and repository gates
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check public/assets/scratch-tabs.js
          node --check public/assets/v254-common-branding.js
          node --check public/assets/app.js
          bash scripts/verify-repository.sh
          for t in tests/unit/p02_*.mjs tests/unit/v2523_unified_content_workspace_contract.mjs; do node "$t"; done
          test "$(node -e "console.log(JSON.parse(require('fs').readFileSync('SOURCE_MANIFEST.json','utf8')).runtime_source_file_count)")" = '67'
          ! grep -F 'loadScratchAssets' public/assets/v254-common-branding.js
          grep -F '/assets/scratch-tabs.js' public/index.php
          git diff --check
          echo P02_R52_STATIC_GATES=PASS

      - name: Source Manifest regenerate identity
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          cp SOURCE_MANIFEST.json "$RUNNER_TEMP/r52-manifest.json"
          cp SOURCE_MANIFEST.txt "$RUNNER_TEMP/r52-manifest.txt"
          python3 scripts/generate-source-manifest.py
          cmp -s SOURCE_MANIFEST.json "$RUNNER_TEMP/r52-manifest.json"
          cmp -s SOURCE_MANIFEST.txt "$RUNNER_TEMP/r52-manifest.txt"
          python3 scripts/verify-source-manifest.py
          echo P02_R52_MANIFEST_REGEN_IDENTITY=PASS

      - name: Install isolated browser runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 sqlite3 curl >/dev/null
          cd product
          npm install --no-save --package-lock=false playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Build and boot prewrite site
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          RUN_ROOT="$RUNNER_TEMP/p02-r52"; SITE="$RUN_ROOT/site"; mkdir -p "$RUN_ROOT"
          bash scripts/build-deploy-tree.sh "$SITE"
          php -d display_errors=0 -S "127.0.0.1:$PORT" -t "$SITE" >"$RUN_ROOT/php.log" 2>&1 & echo $! > "$RUN_ROOT/php.pid"
          BASE_URL="http://127.0.0.1:$PORT"
          for _ in $(seq 1 80); do curl -fsS "$BASE_URL/setup.php" >/dev/null 2>&1 && break; sleep .25; done
          PASSWORD="VF-R52-${GITHUB_RUN_ID}!"; printf '%s' "$PASSWORD" > "$RUN_ROOT/password"
          curl -fsS -c "$RUN_ROOT/cookie" "$BASE_URL/setup.php" > "$RUN_ROOT/setup.html"
          SETUP_CSRF="$(python3 - "$RUN_ROOT/setup.html" <<'PY'
          import html,re,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf" value="([^"]+)"',s)
          if not m:raise SystemExit('setup csrf missing')
          print(html.unescape(m.group(1)))
          PY
          )"
          STATUS="$(curl -sS -o "$RUN_ROOT/setup-post.html" -w '%{http_code}' -b "$RUN_ROOT/cookie" -c "$RUN_ROOT/cookie" -H "Origin: $BASE_URL" --data-urlencode "setup_csrf=$SETUP_CSRF" --data-urlencode "password=$PASSWORD" --data-urlencode "password_confirm=$PASSWORD" "$BASE_URL/setup.php")"
          test "$STATUS" = '303'
          echo P02_R52_SITE_READY=PASS

      - name: Standard Chromium regression
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          RUN_ROOT="$RUNNER_TEMP/p02-r52"
          VF_UX_E2E_BASE_URL="http://127.0.0.1:$PORT" VF_UX_E2E_PASSWORD="$(cat "$RUN_ROOT/password")" VF_UX_E2E_VERSION="$EXPECTED_VERSION" node tests/e2e/p02_ux_task_flow.mjs
          echo P02_R52_STANDARD_CHROMIUM=PASS

      - name: Scratch ownership specialized Chromium
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > r52-scratch-proof.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844}});
          const base=process.env.BASE_URL,password=process.env.PASSWORD;
          const assert=(v,m)=>{if(!v)throw new Error(m);};
          await page.goto(base+'/',{waitUntil:'networkidle'});
          if(await page.locator('[data-open-login]').count()){
            await page.locator('[data-open-login]').click();
            await page.locator('#loginForm input[name="password"]').fill(password);
            await page.locator('#loginSubmit').click();
            await page.waitForFunction(async()=>Boolean((await(await fetch('/api.php?action=session')).json())?.site?.auth));
          }
          await page.waitForSelector('#scratchLaunchV259',{timeout:10000});
          const load=await page.evaluate(()=>({
            scripts:[...document.scripts].filter(x=>x.src.includes('/assets/scratch-tabs.js')).map(x=>({src:x.src,dynamic:x.dataset.scratchV259||''})),
            resources:performance.getEntriesByType('resource').filter(x=>x.name.includes('/assets/scratch-tabs.js')).map(x=>x.name)
          }));
          console.log('R52_SCRATCH_LOAD='+JSON.stringify(load));
          assert(load.scripts.length===1,'scratch static script count');
          assert(load.scripts[0].dynamic==='','legacy dynamic scratch marker remains');
          assert(load.resources.length===1,'scratch resource must load once');
          await page.locator('#scratchLaunchV259').click();
          await page.waitForSelector('#scratchWorkspaceV259');
          await page.evaluate(()=>{
            const scroller=document.querySelector('#scratchWorkspaceV259 .scratch-tabs-scroll-v259');
            const tabs=document.querySelector('#scratchWorkspaceV259 [data-scratch-tabs]');
            scroller.style.width='220px';scroller.style.maxWidth='220px';
            const seed=tabs.querySelector('.scratch-tab-v259')||document.createElement('button');
            for(let i=0;i<18;i++){const c=seed.cloneNode(true);c.className='scratch-tab-v259'+(i===17?' active':'');c.dataset.scratchTab=String(9000+i);c.textContent='R52 overflow tab '+i;tabs.appendChild(c);}
          });
          await page.waitForSelector('#scratchWorkspaceV259 .scratch-tab-scroll-v2518.next',{timeout:10000});
          await page.waitForFunction(()=>{const s=document.querySelector('#scratchWorkspaceV259 .scratch-tabs-scroll-v259');const w=document.querySelector('#scratchWorkspaceV259');return w?.dataset.tabOverflowUxV2518==='1'&&s&&s.scrollWidth>s.clientWidth;});
          const before=await page.locator('#scratchWorkspaceV259 .scratch-tabs-scroll-v259').evaluate(n=>n.scrollLeft);
          await page.locator('#scratchWorkspaceV259 .scratch-tab-scroll-v2518.next').click();
          await page.waitForTimeout(500);
          const after=await page.locator('#scratchWorkspaceV259 .scratch-tabs-scroll-v259').evaluate(n=>n.scrollLeft);
          assert(after>before,'scratch overflow next control did not scroll');
          await page.locator('#settingsBtn').click();
          await page.waitForFunction(()=>!document.querySelector('#scratchWorkspaceV259'));
          await page.waitForSelector('#settingsPanel',{timeout:10000});
          console.log('P02_R52_SCRATCH_SPECIALIZED_BROWSER=PASS');
          await browser.close();
          JS
          RUN_ROOT="$RUNNER_TEMP/p02-r52"; BASE_URL="http://127.0.0.1:$PORT" PASSWORD="$(cat "$RUN_ROOT/password")" node r52-scratch-proof.mjs
          rm r52-scratch-proof.mjs

      - name: Final verification before develop write
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_REF"
          bash scripts/verify-repository.sh
          for t in tests/unit/p02_*.mjs tests/unit/v2523_unified_content_workspace_contract.mjs; do node "$t" >/dev/null; done
          git diff --check
          echo P02_R52_PREWRITE_VERIFY=PASS

      - name: Commit and push develop only
        id: write
        working-directory: product
        shell: bash
        env:
          VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          git config user.name 'VictorForge'; git config user.email 'llhzx2018@gmail.com'
          git add -A; git commit -m 'refactor(P02): converge scratch runtime ownership'
          NEW_SHA="$(git rev-parse HEAD)"
          git remote set-url origin "https://x-access-token:${VF_RELEASE_WRITE_TOKEN}@github.com/llhzx2018/vf-library.git"
          git fetch origin develop --depth=1
          test "$(git rev-parse origin/develop)" = "$BASE_REF"
          git push origin HEAD:refs/heads/develop
          git remote set-url origin 'https://github.com/llhzx2018/vf-library.git'
          echo "sha=$NEW_SHA" >> "$GITHUB_OUTPUT"; echo "P02_R52_NEW_SHA=$NEW_SHA"; echo P02_R52_DEVELOP_WRITE=PASS

      - name: Stop prewrite site
        if: always()
        shell: bash
        run: |
          RUN_ROOT="$RUNNER_TEMP/p02-r52"; if test -f "$RUN_ROOT/php.pid";then kill "$(cat "$RUN_ROOT/php.pid")" 2>/dev/null||true;fi

      - name: Checkout exact post-write SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: ${{ steps.write.outputs.sha }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: post

      - name: Exact-SHA readonly static closure
        working-directory: post
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.write.outputs.sha }}"
          cp SOURCE_MANIFEST.json "$RUNNER_TEMP/r52-post-manifest.json"; cp SOURCE_MANIFEST.txt "$RUNNER_TEMP/r52-post-manifest.txt"
          bash scripts/verify-repository.sh
          for t in tests/unit/p02_*.mjs tests/unit/v2523_unified_content_workspace_contract.mjs; do node "$t"; done
          python3 scripts/generate-source-manifest.py
          cmp -s SOURCE_MANIFEST.json "$RUNNER_TEMP/r52-post-manifest.json"; cmp -s SOURCE_MANIFEST.txt "$RUNNER_TEMP/r52-post-manifest.txt"
          python3 scripts/verify-source-manifest.py
          ! grep -F 'loadScratchAssets' public/assets/v254-common-branding.js
          grep -F '/assets/scratch-tabs.js' public/index.php
          git diff --exit-code
          echo P02_R52_EXACT_SHA_STATIC_CLOSURE=PASS

      - name: Build and boot exact post-write site
        working-directory: post
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0 >/dev/null
          RUN_ROOT="$RUNNER_TEMP/p02-r52-post";SITE="$RUN_ROOT/site";mkdir -p "$RUN_ROOT";bash scripts/build-deploy-tree.sh "$SITE"
          php -d display_errors=0 -S "127.0.0.1:$POST_PORT" -t "$SITE" >"$RUN_ROOT/php.log" 2>&1 & echo $! > "$RUN_ROOT/php.pid"
          BASE_URL="http://127.0.0.1:$POST_PORT";for _ in $(seq 1 80);do curl -fsS "$BASE_URL/setup.php" >/dev/null 2>&1&&break;sleep .25;done
          PASSWORD="VF-R52-POST-${GITHUB_RUN_ID}!";printf '%s' "$PASSWORD" > "$RUN_ROOT/password";curl -fsS -c "$RUN_ROOT/cookie" "$BASE_URL/setup.php" > "$RUN_ROOT/setup.html"
          SETUP_CSRF="$(python3 - "$RUN_ROOT/setup.html" <<'PY'
          import html,re,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf" value="([^"]+)"',s)
          if not m:raise SystemExit('setup csrf missing')
          print(html.unescape(m.group(1)))
          PY
          )"
          STATUS="$(curl -sS -o "$RUN_ROOT/setup-post.html" -w '%{http_code}' -b "$RUN_ROOT/cookie" -c "$RUN_ROOT/cookie" -H "Origin: $BASE_URL" --data-urlencode "setup_csrf=$SETUP_CSRF" --data-urlencode "password=$PASSWORD" --data-urlencode "password_confirm=$PASSWORD" "$BASE_URL/setup.php")";test "$STATUS" = '303';echo P02_R52_POST_SITE_READY=PASS

      - name: Exact-SHA standard Chromium closure
        working-directory: post
        shell: bash
        run: |
          set -Eeuo pipefail
          RUN_ROOT="$RUNNER_TEMP/p02-r52-post"; VF_UX_E2E_BASE_URL="http://127.0.0.1:$POST_PORT" VF_UX_E2E_PASSWORD="$(cat "$RUN_ROOT/password")" VF_UX_E2E_VERSION="$EXPECTED_VERSION" node tests/e2e/p02_ux_task_flow.mjs
          echo P02_R52_EXACT_SHA_STANDARD_CHROMIUM=PASS

      - name: Exact-SHA Scratch specialized Chromium closure
        working-directory: post
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > r52-scratch-proof.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});const page=await browser.newPage({viewport:{width:390,height:844}});const base=process.env.BASE_URL,password=process.env.PASSWORD;const assert=(v,m)=>{if(!v)throw new Error(m);};
          await page.goto(base+'/',{waitUntil:'networkidle'});if(await page.locator('[data-open-login]').count()){await page.locator('[data-open-login]').click();await page.locator('#loginForm input[name="password"]').fill(password);await page.locator('#loginSubmit').click();await page.waitForFunction(async()=>Boolean((await(await fetch('/api.php?action=session')).json())?.site?.auth));}
          await page.waitForSelector('#scratchLaunchV259',{timeout:10000});const load=await page.evaluate(()=>({scripts:[...document.scripts].filter(x=>x.src.includes('/assets/scratch-tabs.js')).map(x=>x.dataset.scratchV259||''),resources:performance.getEntriesByType('resource').filter(x=>x.name.includes('/assets/scratch-tabs.js')).length}));assert(load.scripts.length===1&&load.scripts[0]==='','post scratch static entry invalid');assert(load.resources===1,'post scratch resource count invalid');
          await page.locator('#scratchLaunchV259').click();await page.waitForSelector('#scratchWorkspaceV259');await page.evaluate(()=>{const s=document.querySelector('#scratchWorkspaceV259 .scratch-tabs-scroll-v259'),tabs=document.querySelector('#scratchWorkspaceV259 [data-scratch-tabs]');s.style.width='220px';s.style.maxWidth='220px';const seed=tabs.querySelector('.scratch-tab-v259')||document.createElement('button');for(let i=0;i<18;i++){const c=seed.cloneNode(true);c.className='scratch-tab-v259'+(i===17?' active':'');c.dataset.scratchTab=String(9500+i);c.textContent='post overflow '+i;tabs.appendChild(c);}});await page.waitForSelector('#scratchWorkspaceV259 .scratch-tab-scroll-v2518.next',{timeout:10000});await page.waitForFunction(()=>{const s=document.querySelector('#scratchWorkspaceV259 .scratch-tabs-scroll-v259'),w=document.querySelector('#scratchWorkspaceV259');return w?.dataset.tabOverflowUxV2518==='1'&&s&&s.scrollWidth>s.clientWidth;});const before=await page.locator('#scratchWorkspaceV259 .scratch-tabs-scroll-v259').evaluate(n=>n.scrollLeft);await page.locator('#scratchWorkspaceV259 .scratch-tab-scroll-v2518.next').click();await page.waitForTimeout(500);const after=await page.locator('#scratchWorkspaceV259 .scratch-tabs-scroll-v259').evaluate(n=>n.scrollLeft);assert(after>before,'post overflow scroll failed');await page.locator('#settingsBtn').click();await page.waitForFunction(()=>!document.querySelector('#scratchWorkspaceV259'));await page.waitForSelector('#settingsPanel',{timeout:10000});console.log('P02_R52_EXACT_SHA_SCRATCH_SPECIALIZED_BROWSER=PASS');await browser.close();
          JS
          RUN_ROOT="$RUNNER_TEMP/p02-r52-post";BASE_URL="http://127.0.0.1:$POST_PORT" PASSWORD="$(cat "$RUN_ROOT/password")" node r52-scratch-proof.mjs;rm r52-scratch-proof.mjs;git diff --exit-code;echo P02_R52_EXACT_SHA_READONLY_CLOSURE=PASS

      - name: Boundaries
        if: always()
        shell: bash
        run: |
          RUN_ROOT="$RUNNER_TEMP/p02-r52-post";if test -f "$RUN_ROOT/php.pid";then kill "$(cat "$RUN_ROOT/php.pid")" 2>/dev/null||true;fi
          echo PRIVATE_SOURCE_PERSISTED=NO;echo MAIN_WRITE=NO;echo RELEASE_WRITE=NO;echo TAG_WRITE=NO;echo UPDATE_CHANNEL_WRITE=NO;echo PRODUCTION_WRITE=NO
