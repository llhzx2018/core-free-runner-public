name: TEMP S01-C02 Ops 1.21.846 Production Fresh Read
on:
  push:
    paths:
      - '.github/workflows/temp-s01-c02-v121846-production-fresh-read.yml'
permissions:
  contents: read
jobs:
  readback:
    runs-on: ubuntu-24.04
    env:
      ENDPOINT: https://www3.m3u8.one/wp-json/vf-ops/v1/s01-static-candidate-readiness
      RUNNER_MAIN: 0160b557ad4ae0e8c6acd97e7551285bc05870bd
    steps:
      - name: Poll privacy-safe Production state
        shell: bash
        run: |
          set -Eeuo pipefail
          for i in 1 2 3 4 5 6 7 8; do
            curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 "$ENDPOINT" -o /tmp/static.json
            echo "=== SAMPLE_${i} ==="
            jq '{pluginVersion,currentAuthorityHost,apexAuthorityHost,activeStaticJobStatus,activeStaticJobMode,activeStaticJobFirstFailedStep,activeStaticJobAuditFailureCount,activeStaticJobInternalLinkFailureLeafCount,sourcePackageAvailable,sourcePackageReusable,manualSourceUploadRequired,candidatePackageReady,finalOnlinePass,sourceRecoveryStructuralRetryStatus,sourceRecoveryStructuralRetryCode,sourceRecoveryStructuralRetryCandidateStatus,sourceRecoveryStructuralRetryCandidateCurrentStage,sourceRecoveryStructuralRetryCandidateAuditFailureCount,sourceRecoveryStructuralRetryCandidateBuildOffset,sourceRecoveryStructuralRetryCandidateBuildTotal,sourceRecoveryStructuralRetryCandidateHelperPhase,sourceRecoveryStructuralRetryCandidateHelpersWritten,sourceRecoveryStructuralRetryCandidateCompletenessStatus}' /tmp/static.json
            test "$(jq -r '.pluginVersion // empty' /tmp/static.json)" = "1.21.846"
            status="$(jq -r '.sourceRecoveryStructuralRetryStatus // ""' /tmp/static.json)"
            cstatus="$(jq -r '.sourceRecoveryStructuralRetryCandidateStatus // ""' /tmp/static.json)"
            if [[ "$status" =~ ^(done|fail|failed|blocked|error|cancelled|timeout)$ ]] || [[ "$cstatus" =~ ^(done|fail|failed|blocked|error|cancelled|timeout)$ ]]; then
              break
            fi
            if [[ "$(jq -r '.candidatePackageReady // false' /tmp/static.json)" == "true" ]]; then
              break
            fi
            sleep 15
          done
      - name: Verify runner main unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git ls-remote https://github.com/llhzx2018/core-free-runner-public.git refs/heads/main | awk '{print $1}')" = "$RUNNER_MAIN"
          echo PASS_V121846_PRODUCTION_FRESH_READ
