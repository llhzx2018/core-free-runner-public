name: p01-channel-143-owner-guest-directory-parity
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-channel-143-parity-temp.yml'
      - 'scripts/p01-channel-143-parity-browser-temp.py'
permissions:
  contents: read
jobs:
  p01-channel-143-exact-source-parity:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      PRODUCT_SHA: b6c0f279d44404210d5a6b1e2da6d0b44d02fedb
      PRODUCT_BASE: 11d2fe8554fb45c3365c771ab686343207dcde81
      WORK: /tmp/p01-channel-143-${{ github.run_id }}
    steps:
      - name: Checkout registered public proof repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: PHP SQLite and synthetic test requirements
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$WORK/official"
          python3 -m py_compile scripts/p01-channel-143-parity-browser-temp.py
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-zip php-mbstring php-gd unzip >/dev/null
          echo P01_CHANNEL_SYNTHETIC_TEST_RUNTIME=PASS
      - name: Exact product branch and five-file source diff
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          test -n "$READ_TOKEN"
          remote="$(git ls-remote "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" refs/heads/fix/p01-channel-inventory-owner-parity-20261107 | awk '{print $1}')"
          test "$remote" = "$PRODUCT_SHA"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" "$WORK/product"
          git -C "$WORK/product" fetch -q --depth 16 origin "$PRODUCT_SHA"
          git -C "$WORK/product" checkout -q --detach "$PRODUCT_SHA"
          git -C "$WORK/product" remote set-url origin https://github.com/llhzx2018/vf-start.git
          test "$(git -C "$WORK/product" rev-parse HEAD)" = "$PRODUCT_SHA"
          git -C "$WORK/product" merge-base --is-ancestor "$PRODUCT_BASE" "$PRODUCT_SHA"
          test "$(git -C "$WORK/product" diff --name-only "$PRODUCT_BASE" "$PRODUCT_SHA")" = "$(printf 'src/app/ChannelLibraryPage.php\nsrc/app/SurfaceRepository.php\nsrc/assets/global-remote-channels.js\ntests/integration/p01_channels_130_parity_fixture.php\ntests/unit/p01_ia5_remote_channels_r34_contract.cjs')"
          test "$(tr -d '\r\n ' < "$WORK/product/VERSION")" = 2.47.501
          echo P01_CHANNEL_EXACT_SOURCE_FIVE_FILE_NO_SCHEMA_OR_VERSION_CHANGE=PASS
      - name: Scoped channel privacy pagination and manual inventory contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$WORK/product"
          php -l src/app/ChannelLibraryPage.php
          php -l src/app/SurfaceRepository.php
          php -l tests/integration/p01_channels_130_parity_fixture.php
          node --check src/assets/global-remote-channels.js
          node tests/unit/p01_ia5_remote_channels_r34_contract.cjs
          php tests/unit/channel_scope_disclosure_contract.php
          php tests/unit/channels_owner_default_video_view_native.php
          php tests/unit/channel_type_context_count_contract.php
          echo P01_CHANNEL_FOCUSED_NATIVE_NODE_PHP_CONTRACT=PASS
      - name: Official clean installed v501 public artifact fixture
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          gh release download v2.47.501 -R llhzx2018/vf-start -D "$WORK/official" \
            -p VF-Start-V2.47.501-FULL.zip
          printf '%s  %s\n' \
            387d48f9d94d479b71ffff4c28bef703a5c8ceed95f5ebee9498603006b75b5c \
            "$WORK/official/VF-Start-V2.47.501-FULL.zip" | sha256sum -c -
          echo P01_CHANNEL_TEST_INSTALL_SOURCE_OFFICIAL_V501=PASS
      - name: Real synthetic HTTP 143 canonical resources 130 organized 104 guest
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/p01-channel-143-parity-browser-temp.py \
            --work "$WORK" \
            --official-full "$WORK/official/VF-Start-V2.47.501-FULL.zip" \
            --candidate "$WORK/product"
          echo P01_CHANNEL_FIVE_FILE_EXACT_SOURCE_143_HTTP_COMPLETE=PASS
      - name: Cleanup private product checkout and synthetic state
        if: always()
        shell: bash
        run: |
          echo P01_CHANNEL_PRODUCTION_WRITE=NONE
          echo P01_CHANNEL_PRIVATE_SOURCE_PUBLIC_ARTIFACT=NONE
          case "$WORK" in /tmp/p01-channel-143-*) rm -rf -- "$WORK";; *) exit 66;; esac
