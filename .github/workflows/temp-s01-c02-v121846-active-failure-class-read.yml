name: TEMP S01-C02 Ops 1.21.846 Active Failure Class Read
on:
  push:
    paths:
      - '.github/workflows/temp-s01-c02-v121846-active-failure-class-read.yml'
permissions:
  contents: read
jobs:
  readback:
    runs-on: ubuntu-24.04
    env:
      ENDPOINT: https://www3.m3u8.one/wp-json/vf-ops/v1/s01-static-candidate-readiness
      RUNNER_MAIN: 0160b557ad4ae0e8c6acd97e7551285bc05870bd
    steps:
      - name: Read allowlisted active failure classification
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 "$ENDPOINT" -o /tmp/static.json
          jq '{pluginVersion,activeStaticJobStatus,activeStaticJobMode,activeStaticJobFirstFailedStep,activeStaticJobFailureClass,activeStaticJobFailureCodes,activeStaticJobFailureCount,activeStaticJobClassifiedFailureCount,activeStaticJobNonAuditFailureCount,activeStaticJobAuditFailureCount,activeStaticJobFailureSegmentStatus,activeStaticJobFailureSegmentCounts,activeStaticJobFailureSubtypeStatus,activeStaticJobFailureSubtypeLeafCount,activeStaticJobFailureSubtypeKnownCount,activeStaticJobFailureSubtypeOtherCount,activeStaticJobFailureSubtypeCounts,sourceRecoveryStructuralRetryStatus,sourceRecoveryStructuralRetryCode,sourceRecoveryStructuralRetryCandidateCurrentStage,sourceRecoveryStructuralRetryCandidateBuildOffset,sourceRecoveryStructuralRetryCandidateBuildTotal,sourceRecoveryStructuralRetryCandidateHelperPhase,sourceRecoveryStructuralRetryCandidateHelpersWritten,sourceRecoveryStructuralRetryCandidateCompletenessStatus}' /tmp/static.json
          jq -e '.pluginVersion=="1.21.846" and .activeStaticJobStatus=="FAIL" and .activeStaticJobMode=="candidate" and .activeStaticJobFirstFailedStep=="candidate_build" and .sourceRecoveryStructuralRetryCandidateCurrentStage==4 and .sourceRecoveryStructuralRetryCandidateBuildOffset==231 and .sourceRecoveryStructuralRetryCandidateBuildTotal==231 and .sourceRecoveryStructuralRetryCandidateHelperPhase=="helper_root_prepare" and .sourceRecoveryStructuralRetryCandidateHelpersWritten==false and .sourceRecoveryStructuralRetryCandidateCompletenessStatus=="pass"' /tmp/static.json >/dev/null
      - name: Verify runner main unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git ls-remote https://github.com/llhzx2018/core-free-runner-public.git refs/heads/main | awk '{print $1}')" = "$RUNNER_MAIN"
          echo PASS_V121846_ACTIVE_FAILURE_CLASS_READ
