name: P02 V2.5.7 UAUI Friction Reduction R3

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v257-uaui-friction-reduction-r3.yml'

permissions:
  contents: read

jobs:
  implement-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: task/v2.5.7-uaui-friction-reduction
          token: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'
          path: p02
          fetch-depth: 0
          persist-credentials: false
      - name: Apply V2.5.7 UX delta
        working-directory: p02
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/assets/app.js'); s=p.read_text(encoding='utf-8')
          a=s.index('function openPresetTemplatePicker(kind){'); b=s.index('function escapeRegExp',a)
          block="""function presetBlankCardMarkup(kind){const label=kind==='article'?'文章':'便签';return '<button type=\"button\" class=\"preset-template-card is-blank\" data-preset-kind=\"'+kind+'\" data-preset-template=\"blank\"><strong>空白'+label+'</strong><span>不套结构，直接开始输入</span><small>直接进入编辑</small></button>';}
          function presetTemplateGroupMarkup(kind){const label=kind==='article'?'文章':'便签';const hint=kind==='article'?'资料整理与长期查阅':'快速记录与日常使用';const cards=presetBlankCardMarkup(kind)+PRESET_CONTENT_TEMPLATES[kind].map(template=>presetTemplateCardMarkup(kind,template)).join('');return '<section class=\"preset-template-section\"><div class=\"preset-template-section-head\"><strong>'+label+'</strong><span>'+hint+'</span></div><div class=\"preset-template-grid\">'+cards+'</div></section>';}
          function openPresetTemplatePicker(kind){const requested=(kind==='article'||kind==='quick')?kind:'all';const kinds=requested==='all'?['quick','article']:[requested];const body='<div class=\"preset-template-intro\"><p>直接选择要用的结构。空白和常用模板都在这一页，不再先选择类型再跳一次。</p></div><div class=\"preset-template-sections\">'+kinds.map(presetTemplateGroupMarkup).join('')+'</div>';const title=requested==='all'?'新建内容':'新建'+(requested==='article'?'文章':'便签');const root=modal(title,body,'<button class=\"btn secondary\" type=\"button\" data-close>取消</button>',{variant:'preset-template-dialog'});$$('[data-preset-template]',root).forEach(button=>button.onclick=()=>{const targetKind=button.dataset.presetKind==='article'?'article':'quick';const id=button.dataset.presetTemplate;const template=PRESET_CONTENT_TEMPLATES[targetKind].find(entry=>entry.id===id)||null;const close=$('[data-close]',root);if(close)close.click();openEditor(null,{forceContentMode:targetKind,forceContentFormat:template?'markdown':(targetKind==='article'?'markdown':null),initialContent:template?template.content:'',skipDraft:Boolean(template)});});}
          function openContentKindPicker(){openPresetTemplatePicker('all');}
          function openNewContent(kind){openPresetTemplatePicker(kind);}
          """
          s=s[:a]+block+s[b:]
          a=s.index("$('#addContentBtn').onclick=()=>openNewContent('');const addMenuBtn=$('#addContentMenuBtn');"); b=s.index("$('#menuBtn').onclick=",a)
          s=s[:a]+"$('#addContentBtn').onclick=()=>openNewContent('');const addMenuBtn=$('#addContentMenuBtn');if(addMenuBtn)addMenuBtn.onclick=e=>{e.preventDefault();e.stopPropagation();closeContext();addMenuBtn.setAttribute('aria-expanded','false');openNewContent('');};"+s[b:]
          a=s.index('function settingsNavMarkup(nav){'); b=s.index('function selectOptions',a)
          s=s[:a]+"function settingsNavMarkup(nav){let group='';return nav.map(x=>{const label=x.group!==group?'<div class=\\\"settings-nav-label\\\">'+esc(x.group)+'</div>':'';group=x.group;return label+'<button data-settings-section=\\\"'+x.id+'\\\" class=\\\"'+(state.settingsSection===x.id?'active':'')+'\\\"><span>'+esc(x.label)+'</span></button>';}).join('');}\n"+s[b:]
          p.write_text(s,encoding='utf-8')
          PY
          cat >> public/assets/app.css <<'CSS'

          /* V2.5.7 · one-page create + quiet settings navigation */
          #addContentMenuBtn{display:none!important}
          .modal.preset-template-dialog{width:min(820px,calc(100vw - 32px))}
          .preset-template-sections{display:grid;gap:18px}
          .preset-template-section{display:grid;gap:8px}
          .preset-template-section+.preset-template-section{padding-top:16px;border-top:1px solid var(--border)}
          .preset-template-section-head{display:flex;align-items:baseline;gap:8px}
          .preset-template-section-head strong{color:var(--strong);font-size:14px}
          .preset-template-section-head span{color:var(--muted2);font-size:11px}
          .preset-template-card{min-height:84px;padding:11px 13px}
          .settings-nav button{min-height:40px!important;padding:6px 10px!important;gap:0!important}
          .settings-nav button small{display:none!important}
          @media(max-width:620px){.modal.preset-template-dialog{width:min(96vw,560px)}.preset-template-grid{grid-template-columns:1fr}.preset-template-card{min-height:70px}.preset-template-section-head{display:grid;gap:2px;align-items:start}}
          CSS
          printf '2.5.7\n' > VERSION
          python3 - <<'PY'
          from pathlib import Path
          p=Path('CHANGELOG.md'); s=p.read_text(encoding='utf-8'); entry='''# VF Library V2.5.7 · UA/UI Friction Reduction · Candidate · 2026-08-19\n\n- 新建内容一页完成：便签与文章的空白/常用模板同时展示，取消二次跳转。\n- 顶栏新增入口统一为一页式选择器，冗余下拉按钮退场。\n- 设置中心菜单移除每项重复说明，只保留分组与名称。\n- 保持现有 4 个便签预设 + 4 个文章预设，不增加凑数模板。\n- Schema 2401，无 Migration。\n\n'''; p.write_text(entry+s,encoding='utf-8')
          PY
          node --check public/assets/app.js
      - name: Regenerate manifest and verify
        working-directory: p02
        env:
          AUDIT_PASSWORD: 'P02-V257-UAUI-R3!'
        run: |
          set -Eeuo pipefail
          DEP="$RUNNER_TEMP/deploy257"; bash scripts/build-deploy-tree.sh "$DEP" >/dev/null
          python3 - "$DEP" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          dep=Path(sys.argv[1]); repo=Path.cwd(); old=json.loads((repo/'SOURCE_MANIFEST.json').read_text(encoding='utf-8')); mapping={e['full_path']:e['repo_path'] for e in old['entries']}; out=[]
          for f in sorted(x for x in dep.rglob('*') if x.is_file()):
              rel=f.relative_to(dep).as_posix(); assert rel in mapping; rp=repo/mapping[rel]; b=f.read_bytes(); rb=rp.read_bytes(); h=lambda x:hashlib.sha256(x).hexdigest(); out.append({'full_path':rel,'repo_path':mapping[rel],'bytes':len(b),'sha256':h(b),'repo_sha256':h(rb)})
          (repo/'SOURCE_MANIFEST.json').write_text(json.dumps({'project':'P02 · VF Library','version':'2.5.7','schema':2401,'source_baseline_full_sha256':'PENDING_FORMAL_CANDIDATE_ARTIFACT','mapping_contract':'Each declared runtime source file must exist exactly once at repo_path; hashes bind the Git-native V2.5.7 candidate deploy tree. Formal release identity is not assigned by this candidate manifest.','runtime_source_file_count':len(out),'entries':out},ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          PY
          python3 scripts/repository-gates.py
          ROOT="$RUNNER_TEMP/site257"; mkdir -p "$ROOT"; bash scripts/build-deploy-tree.sh "$ROOT" >/dev/null; php -S 127.0.0.1:18273 -t "$ROOT" >/dev/null 2>&1 & PID=$!
          for _ in $(seq 1 80); do curl -fsS http://127.0.0.1:18273/setup.php >/dev/null 2>&1 && break; sleep .25; done
          curl -fsS -c "$RUNNER_TEMP/cookie257" http://127.0.0.1:18273/setup.php > "$RUNNER_TEMP/setup257"
          TOKEN=$(python3 - "$RUNNER_TEMP/setup257" <<'PY'
          import re,html,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf" value="([^"]+)"',s);assert m;print(html.unescape(m.group(1)))
          PY
          )
          test "$(curl -sS -o /dev/null -w '%{http_code}' -b "$RUNNER_TEMP/cookie257" -c "$RUNNER_TEMP/cookie257" -H 'Origin: http://127.0.0.1:18273' --data-urlencode "setup_csrf=$TOKEN" --data-urlencode "password=$AUDIT_PASSWORD" --data-urlencode "password_confirm=$AUDIT_PASSWORD" http://127.0.0.1:18273/setup.php)" = 303
          npm install --no-save playwright-core@1.55.0 >/dev/null
          cat > .verify257.mjs <<'JS'
          import {chromium} from 'playwright-core';const b=await chromium.launch({channel:'chrome',headless:true});const p=await b.newPage({viewport:{width:1440,height:900}});await p.goto('http://127.0.0.1:18273/',{waitUntil:'networkidle'});let s=await p.evaluate(async()=>await(await fetch('/api.php?action=session')).json());if(!s.site.auth){await p.locator('[data-open-login]').click();await p.locator('#loginForm input[name="password"]').fill(process.env.AUDIT_PASSWORD);await p.locator('#loginSubmit').click();await p.waitForFunction(async()=>Boolean((await(await fetch('/api.php?action=session')).json()).site.auth));}await p.locator('#addContentBtn').click();const m=p.locator('.modal.preset-template-dialog');await m.waitFor();if(await m.locator('.preset-template-section').count()!==2||await m.locator('[data-preset-template]').count()!==10)throw Error('unified picker mismatch');if(await p.locator('[data-preset-kind-choice]').count())throw Error('legacy two-step picker present');await p.locator('[data-preset-kind="article"][data-preset-template="howto"]').click();if(!(await p.locator('.content-editor').inputValue()).includes('## 操作步骤'))throw Error('template direct open failed');await p.locator('#editorCancel').click();if(await p.locator('#addContentMenuBtn').isVisible())throw Error('redundant dropdown visible');await p.locator('#settingsBtn').click();await p.waitForSelector('.settings-nav');if(await p.locator('.settings-nav small').count())throw Error('settings descriptions remain');console.log('V257_R3_BROWSER=PASS');await b.close();
          JS
          node .verify257.mjs
          php "$ROOT/cli/verify.php" | jq -e '.ok==true and .version=="2.5.7" and .schema_version==2401 and .integrity=="ok" and .foreign_key_errors==0' >/dev/null
          kill "$PID"
          echo V257_R3_VERIFY=PASS
          echo PRODUCTION_WRITE=NO
      - name: Push verified candidate
        working-directory: p02
        env:
          GH_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"; git config user.name 'VF Release Bot'; git config user.email 'vf-release-bot@users.noreply.github.com'; git add public/assets/app.js public/assets/app.css VERSION CHANGELOG.md SOURCE_MANIFEST.json; git diff --cached --check; git commit -m 'feat(v2.5.7): simplify creation and settings navigation'; gh auth setup-git; git push https://github.com/llhzx2018/vf-library.git HEAD:task/v2.5.7-uaui-friction-reduction; echo PRODUCT_CANDIDATE_COMMIT=$(git rev-parse HEAD)
