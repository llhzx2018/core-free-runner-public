name: P01 2.47.404 Core Updates One-shot CI
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-core-updates-247404.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UPDATE_REPO: llhzx2018/core-updates
      UPDATE_SHA: 93cc6958a400bd9a4fed7f39385061923f896118
    steps:
      - name: Checkout public one-shot control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Bind exact private update manifest source
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          ROOT="$RUNNER_TEMP/p01-coreupdate-247404"
          echo "P01_UPDATES_ROOT=$ROOT" >> "$GITHUB_ENV"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/$UPDATE_REPO.git" "$ROOT"
          git -C "$ROOT" checkout -q --detach "$UPDATE_SHA"
          git -C "$ROOT" remote set-url origin "https://github.com/$UPDATE_REPO.git"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$UPDATE_SHA"
          echo "P01_UPDATES_EXACT_SOURCE=PASS"
      - name: Run native core-updates contract and PHP checks
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$P01_UPDATES_ROOT"
          python3 scripts/check_manifest_contract.py | tee "$P01_UPDATES_ROOT/check.json"
          grep -F '"status": "PASS"' "$P01_UPDATES_ROOT/check.json" >/dev/null
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php update-core/php/tests/run.php
          python3 - <<'PY'
          import json
          x=json.load(open('projects/P01.json'))
          assert x['target_version']=='2.47.404'
          assert x['from_versions']==['2.47.403']
          assert x['release_tag']=='v2.47.404'
          assert x['release_id']==419313181
          assert x['product_identity']=='747458ed589869a07d23bc175b20b476186a504f'
          assert x['asset_name']=='VF_Start_V2.47.404_UPDATE.zip'
          assert x['asset_bytes']==2620953
          assert x['asset_sha256']=='768dd12b07692e03e7277acb7741e38ccbbefb9a7ec857f1097e6d89adcdf7d8'
          print('P01_UPDATES_247404_RELEASE_IDENTITY=PASS')
          PY
          echo 'P01_UPDATES_247404_EQUIVALENT_CI=PASS'
      - name: Remove disposable checkout
        if: always()
        shell: bash
        run: |
          if [ -n "${P01_UPDATES_ROOT:-}" ]; then rm -rf -- "$P01_UPDATES_ROOT"; fi
          echo 'P01_UPDATES_EPHEMERAL=PASS'
