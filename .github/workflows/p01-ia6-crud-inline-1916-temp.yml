name: p01-ia6-crud-inline-1916-temporary
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-ia6-crud-inline-1916-temp.yml']
permissions:
  contents: read
jobs:
  inline-crud-proof:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_SHA: f8de0240dde908f794f80a71f0432220f0d81257
      BASE_SHA: f9b71d59ee239be952f8495f2a0cc381e3497a3e
    steps:
      - name: Checkout public-safe Runner lane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact P01 source syntax and owner CRUD inline regression
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          ROOT="$(mktemp -d /tmp/p01-crud-1916.XXXXXXXX)"
          trap 'rm -rf "$ROOT"' EXIT
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd >/dev/null
          git clone -q --depth 1 --branch fix/p01-ia6-owner-crud-inline-feedback-20261105 \
            "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" "$ROOT/candidate"
          git clone -q --depth 1 --branch main \
            "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" "$ROOT/stable"
          test "$(git -C "$ROOT/candidate" rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C "$ROOT/stable" rev-parse HEAD)" = "$BASE_SHA"
          git -C "$ROOT/candidate" remote set-url origin https://github.com/llhzx2018/vf-start.git
          git -C "$ROOT/stable" remote set-url origin https://github.com/llhzx2018/vf-start.git
          unset READ_TOKEN
          echo "P01_TARGET_SHA=$TARGET_SHA"
          for part in local-subsite-management music-home-manage global-remote-categories global-remote-software frontend-start-actions tool-scene-detail course-experience; do
            node --check "$ROOT/candidate/src/assets/$part.js"
          done
          node "$ROOT/candidate/tests/unit/p01_owner_crud_inline_no_browser_confirm.cjs"
          echo P01_CRUD_INLINE_SOURCE=PASS
          set +e
          bash "$ROOT/candidate/tests/canonical_release_regression.sh" \
            "$ROOT/candidate" "$ROOT/stable" --require-zero-debt >"$ROOT/canonical.log" 2>&1
          RC=$?
          set -e
          grep -E '^P01_CANONICAL_(BASELINE_TEST_COUNT|CURRENT_TEST_COUNT|BASELINE_FAILURE_COUNT|CURRENT_FAILURE_COUNT|NEW_REGRESSION_COUNT|REMOVED_BASELINE_TEST_COUNT|LEGACY_TEST_DEBT_COUNT|UNIT_REGRESSION|ZERO_DEBT_REQUIRED)=' "$ROOT/canonical.log" || true
          if [ "$RC" -ne 0 ]; then
            grep -E '(FAIL|ERROR|CHANGED_TEST_FAILURE|NEW_UNIT_REGRESSION)' "$ROOT/canonical.log" | tail -90 || true
            exit "$RC"
          fi
          echo P01_CRUD_CANONICAL_ZERO_DEBT=PASS
      - name: Isolated PHP setup and real Chromium in-pane Owner CRUD flow
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          P01_TEST_ORIGIN: http://127.0.0.1:18681
          P01_TEST_PASSWORD: P01Synthetic-18681!
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          ROOT="$(mktemp -d /tmp/p01-crud-browser.XXXXXXXX)"
          trap 'test -z "${SERVER_PID:-}" || kill "$SERVER_PID" >/dev/null 2>&1 || true; rm -rf "$ROOT"' EXIT
          git clone -q --depth 1 --branch fix/p01-ia6-owner-crud-inline-feedback-20261105 \
            "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" "$ROOT/candidate"
          test "$(git -C "$ROOT/candidate" rev-parse HEAD)" = "$TARGET_SHA"
          git -C "$ROOT/candidate" remote set-url origin https://github.com/llhzx2018/vf-start.git
          unset READ_TOKEN
          cp -a "$ROOT/candidate/src" "$ROOT/runtime"
          php -S 127.0.0.1:18681 -t "$ROOT/runtime" >"$ROOT/php.log" 2>&1 &
          SERVER_PID=$!
          for attempt in $(seq 1 80); do
            if curl -fsS -c "$ROOT/cookie" -b "$ROOT/cookie" "$P01_TEST_ORIGIN/setup.php" -o "$ROOT/setup.html" 2>/dev/null; then break; fi
            sleep 0.3
          done
          test -s "$ROOT/setup.html"
          CSRF="$(python3 - "$ROOT/setup.html" <<'PY'
          import re,sys
          text=open(sys.argv[1],encoding='utf8').read()
          match=re.search(r'name="setup_csrf"\s+value="([^"]+)"',text)
          assert match
          print(match.group(1))
          PY
          )"
          curl -fsS -c "$ROOT/cookie" -b "$ROOT/cookie" -X POST "$P01_TEST_ORIGIN/setup.php" \
            --data-urlencode "setup_csrf=$CSRF" \
            --data-urlencode 'site_title=P01 Isolated CRUD' \
            --data-urlencode "admin_password=$P01_TEST_PASSWORD" \
            --data-urlencode "admin_password_confirm=$P01_TEST_PASSWORD" -o "$ROOT/setup-result.html"
          (cd "$ROOT/runtime" && php cli/verify.php) | grep -Fx 'VERIFY_PASS=YES'
          cd "$ROOT/candidate"
          npm install --no-save --no-audit --no-fund --silent playwright@1.56.1
          npx --no-install playwright install --with-deps chromium >/dev/null
          timeout 120s node tests/integration/p01_ia6_crud_inline_owner_browser.mjs
          echo P01_OWNER_CRUD_CHROMIUM=PASS
      - name: Public Runner cleanup acknowledgement
        if: always()
        run: |
          echo P01_CRUD_EPHEMERAL_PRIVATE_CHECKOUT=TRAP_REMOVED
