name: P05 V1.2.4 VPS Atomic Gate

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p05-v124-vps-atomic-20260903.yml']

permissions:
  contents: read
  actions: read

jobs:
  atomic:
    if: github.event_name == 'pull_request' && github.head_ref == 'tmp/p05-v124-vps-atomic-20260903'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_VERSION: 1.2.3
      TARGET_VERSION: 1.2.4
      SOURCE_SHA256: 66621da7ed5d426cc7c1367a37ac5bbf463617daa5e71745a462f2c3ced44112
      TARGET_SHA256: f318f75a34c1a7b0f731c0e7ab81e42846cf43aaee1b16ec38f0fd94606741c4
      SOURCE_RELEASE_ID: '380755611'
      SOURCE_FULL_ASSET_ID: '540005215'
      TARGET_RELEASE_ID: '381599672'
      TARGET_FULL_ASSET_ID: '541815708'
      TARGET_RELEASE_SOURCE: f752c13b44fb624924926a49197ebe9519ec3f28
      FORMAL_RUN: '33688012617'
      FORMAL_JOB: '100439992986'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact v1.2.3 and v1.2.4 formal Release truth
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$FORMAL_RUN" > /tmp/formal-run.json
          gh api "repos/llhzx2018/core-free-runner-public/actions/jobs/$FORMAL_JOB" > /tmp/formal-job.json
          gh api "repos/llhzx2018/vf-seo/releases/tags/v$SOURCE_VERSION" > /tmp/source-release.json
          gh api "repos/llhzx2018/vf-seo/releases/tags/v$TARGET_VERSION" > /tmp/target-release.json
          python3 - <<'PY'
          import json,os
          run=json.load(open('/tmp/formal-run.json')); job=json.load(open('/tmp/formal-job.json'))
          sr=json.load(open('/tmp/source-release.json')); tr=json.load(open('/tmp/target-release.json'))
          assert run['id']==int(os.environ['FORMAL_RUN']) and run['conclusion']=='success'
          assert job['id']==int(os.environ['FORMAL_JOB']) and job['run_id']==int(os.environ['FORMAL_RUN']) and job['conclusion']=='success' and job['name']=='publish'
          assert sr['id']==int(os.environ['SOURCE_RELEASE_ID']) and sr['tag_name']=='v'+os.environ['SOURCE_VERSION']
          assert tr['id']==int(os.environ['TARGET_RELEASE_ID']) and tr['tag_name']=='v'+os.environ['TARGET_VERSION'] and tr['target_commitish']==os.environ['TARGET_RELEASE_SOURCE']
          sa={a['name']:a for a in sr['assets']}; ta={a['name']:a for a in tr['assets']}
          sf=sa['VF_SEO_V'+os.environ['SOURCE_VERSION']+'_FULL.zip']; tf=ta['VF_SEO_V'+os.environ['TARGET_VERSION']+'_FULL.zip']
          assert sf['id']==int(os.environ['SOURCE_FULL_ASSET_ID']) and sf.get('digest')=='sha256:'+os.environ['SOURCE_SHA256']
          assert tf['id']==int(os.environ['TARGET_FULL_ASSET_ID']) and tf.get('digest')=='sha256:'+os.environ['TARGET_SHA256']
          print('P05_V124_FORMAL_RELEASE_BINDING=PASS')
          PY

      - name: Install Atomic gate runtime
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-curl php-zip sqlite3 jq unzip
          php -r 'if(!extension_loaded("pdo_sqlite"))exit(1);'
          gh --version

      - name: Restore proven P05 Atomic builder authority
        run: |
          set -Eeuo pipefail
          mkdir -p scripts
          git fetch --no-tags origin refs/pull/439/head
          git show FETCH_HEAD:scripts/p05-v1111-standard-atomic-builder-bootstrap.py > scripts/p05-v1111-standard-atomic-builder-bootstrap.py
          git show FETCH_HEAD:scripts/p05-v1111-standard-atomic-current-gate.sh > scripts/p05-v1111-standard-atomic-current-gate.sh
          test -s scripts/p05-v1111-standard-atomic-builder-bootstrap.py
          test -s scripts/p05-v1111-standard-atomic-current-gate.sh
          echo P05_PROVEN_ATOMIC_BUILDER_READBACK=PASS

      - name: Adapt proven builder to v1.2.3 to v1.2.4
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          SOURCE='1.2.3'; TARGET='1.2.4'
          SOURCE_HASH='66621da7ed5d426cc7c1367a37ac5bbf463617daa5e71745a462f2c3ced44112'
          TARGET_HASH='f318f75a34c1a7b0f731c0e7ab81e42846cf43aaee1b16ec38f0fd94606741c4'
          for name in ['scripts/p05-v1111-standard-atomic-builder-bootstrap.py','scripts/p05-v1111-standard-atomic-current-gate.sh']:
              p=Path(name); s=p.read_text()
              s=s.replace('1.1.11','__P05_TARGET__').replace('1.1.10',SOURCE).replace('__P05_TARGET__',TARGET)
              if name.endswith('.sh'):
                  s=s.replace('b24bbbeb997fa6414689a01b32eb70a7bf20c82ffeec8761fea4b69612629ce8','__P05_TARGET_HASH__')
                  s=s.replace('16448869130988685c5fadb42f50362dfac08d6b2dd8657394b8a43c7787ba5d',SOURCE_HASH)
                  s=s.replace('__P05_TARGET_HASH__',TARGET_HASH)
              p.write_text(s)
          p=Path('scripts/p05-v1111-standard-atomic-current-gate.sh'); s=p.read_text()
          old='''curl -fsSL "$BASE/p05-dist-v${SOURCE_VERSION}/VF_SEO_V${SOURCE_VERSION}_FULL.zip" -o "$WORK/VF_SEO_V${SOURCE_VERSION}_FULL.zip"\ncurl -fsSL "$BASE/p05-dist-v${TARGET_VERSION}/VF_SEO_V${TARGET_VERSION}_FULL.zip" -o "$WORK/VF_SEO_V${TARGET_VERSION}_FULL.zip"'''
          new='''gh release download "v${SOURCE_VERSION}" --repo llhzx2018/vf-seo --pattern "VF_SEO_V${SOURCE_VERSION}_FULL.zip" --dir "$WORK"\ngh release download "v${TARGET_VERSION}" --repo llhzx2018/vf-seo --pattern "VF_SEO_V${TARGET_VERSION}_FULL.zip" --dir "$WORK"'''
          assert old in s
          s=s.replace(old,new)
          s=s.replace('curl -fsS -c "$WORK/repair.cookie"','curl -sS -c "$WORK/repair.cookie"')
          p.write_text(s)
          PY
          grep -F "SOURCE_VERSION='1.2.3'" scripts/p05-v1111-standard-atomic-current-gate.sh >/dev/null
          grep -F "TARGET_VERSION='1.2.4'" scripts/p05-v1111-standard-atomic-current-gate.sh >/dev/null
          grep -F "$SOURCE_SHA256" scripts/p05-v1111-standard-atomic-current-gate.sh >/dev/null
          grep -F "$TARGET_SHA256" scripts/p05-v1111-standard-atomic-current-gate.sh >/dev/null

      - name: Apply proven reverse-proxy HTTPS origin fix
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/p05-v1111-standard-atomic-builder-bootstrap.py'); s=p.read_text()
          old="""    private static function originAllowed(): bool
              {
                  if (strtolower((string) ($_SERVER['HTTP_SEC_FETCH_SITE'] ?? '')) === 'cross-site') return false;
                  $origin = trim((string) ($_SERVER['HTTP_ORIGIN'] ?? ''));
                  if ($origin === '') return true;
                  $parts = parse_url($origin);
                  if (!is_array($parts) || !isset($parts['scheme'], $parts['host'])) return false;
                  $host = strtolower((string) ($_SERVER['HTTP_HOST'] ?? ''));
                  $originHost = strtolower((string) $parts['host']) . (isset($parts['port']) ? ':' . (int) $parts['port'] : '');
                  return strtolower((string) $parts['scheme']) === (self::isHttps() ? 'https' : 'http') && $originHost === $host;
              }
          """
          new="""    private static function originAllowed(): bool
              {
                  $fetchSite = strtolower(trim((string) ($_SERVER['HTTP_SEC_FETCH_SITE'] ?? '')));
                  if ($fetchSite === 'cross-site') return false;
                  $origin = trim((string) ($_SERVER['HTTP_ORIGIN'] ?? ''));
                  if ($origin === '') return true;
                  $parts = parse_url($origin);
                  if (!is_array($parts) || !isset($parts['scheme'], $parts['host'])) return false;
                  $scheme = strtolower((string) $parts['scheme']);
                  if (!in_array($scheme, ['http', 'https'], true)) return false;
                  $requestHost = strtolower(trim((string) ($_SERVER['HTTP_HOST'] ?? '')));
                  $originHost = strtolower((string) $parts['host']) . (isset($parts['port']) ? ':' . (int) $parts['port'] : '');
                  return $requestHost !== '' && hash_equals($requestHost, $originHost);
              }
          """
          assert old in s
          p.write_text(s.replace(old,new))
          PY

      - name: Execute formal v1.2.3 to v1.2.4 Atomic bridge gate
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          bash scripts/p05-v1111-standard-atomic-current-gate.sh

      - name: Verify proxy-origin regression and seal Atomic gate
        run: |
          set -Eeuo pipefail
          php -r '
          define("P05_ATOMIC_LIBRARY_MODE", true);
          require "/tmp/p05-atomic/out1/repair-v1.2.4.php";
          $m = new ReflectionMethod("P05AtomicPackage", "originAllowed");
          $_SERVER=["HTTP_SEC_FETCH_SITE"=>"same-origin","HTTP_ORIGIN"=>"https://seo.kewaro.com","HTTP_HOST"=>"seo.kewaro.com"];
          if($m->invoke(null)!==true) exit(1);
          $_SERVER=["HTTP_SEC_FETCH_SITE"=>"cross-site","HTTP_ORIGIN"=>"https://evil.example","HTTP_HOST"=>"seo.kewaro.com"];
          if($m->invoke(null)!==false) exit(1);
          echo "P05_V124_PROXY_ORIGIN=PASS\n";'
          python3 - <<'PY'
          import json,pathlib
          out=pathlib.Path('/tmp/p05-atomic/out1')
          for name in ['P05-V1.2.4-ATOMIC-METADATA.json','P05-V1.2.4-ATOMIC-GATE.json']:
              p=out/name; x=json.loads(p.read_text()); x['proxy_https_same_origin']='PASS'; x['distribution_revision']='R1'; p.write_text(json.dumps(x,ensure_ascii=False,indent=2)+'\n')
          PY
          sha256sum /tmp/p05-atomic/out1/repair-v1.2.4.php /tmp/p05-atomic/out1/VF_SEO_V1.2.4_UPDATE.zip /tmp/p05-atomic/out1/atomic-self-test.json /tmp/p05-atomic/out1/P05-V1.2.4-ATOMIC-METADATA.json /tmp/p05-atomic/out1/P05-V1.2.4-ATOMIC-GATE.json > /tmp/p05-atomic/out1/SHA256SUMS.txt

      - name: Seal Atomic artifact authority
        run: |
          set -Eeuo pipefail
          test -s /tmp/p05-atomic/out1/repair-v1.2.4.php
          test -s /tmp/p05-atomic/out1/VF_SEO_V1.2.4_UPDATE.zip
          jq -e '.project_id=="P05" and .source_version=="1.2.3" and .target_version=="1.2.4" and .result=="PASS" and .source_formal_sha256=="66621da7ed5d426cc7c1367a37ac5bbf463617daa5e71745a462f2c3ced44112" and .target_formal_sha256=="f318f75a34c1a7b0f731c0e7ab81e42846cf43aaee1b16ec38f0fd94606741c4" and .actual_upgrade=="PASS" and .data_preservation=="PASS" and .idempotence=="PASS" and .rollback=="PASS" and .interruption_recovery=="PASS" and .browser_single_php=="PASS" and .proxy_https_same_origin=="PASS" and .production_write==0' /tmp/p05-atomic/out1/P05-V1.2.4-ATOMIC-GATE.json >/dev/null
          UPDATE_SHA="$(sha256sum /tmp/p05-atomic/out1/VF_SEO_V1.2.4_UPDATE.zip | awk '{print $1}')"
          UPDATE_BYTES="$(stat -c%s /tmp/p05-atomic/out1/VF_SEO_V1.2.4_UPDATE.zip)"
          REPAIR_SHA="$(sha256sum /tmp/p05-atomic/out1/repair-v1.2.4.php | awk '{print $1}')"
          REPAIR_BYTES="$(stat -c%s /tmp/p05-atomic/out1/repair-v1.2.4.php)"
          echo "P05_V124_UPDATE_SHA256=$UPDATE_SHA"
          echo "P05_V124_UPDATE_BYTES=$UPDATE_BYTES"
          echo "P05_V124_REPAIR_SHA256=$REPAIR_SHA"
          echo "P05_V124_REPAIR_BYTES=$REPAIR_BYTES"
          echo P05_V124_ATOMIC_GATE=PASS
          echo P05_RELEASE_WRITE=0
          echo P05_CORE_UPDATES_WRITE=0
          echo P05_PRODUCTION_WRITE=0

      - name: Upload exact v1.2.4 Atomic artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: P05_V1.2.4_VPS_ATOMIC_${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/p05-atomic/out1/repair-v1.2.4.php
            /tmp/p05-atomic/out1/VF_SEO_V1.2.4_UPDATE.zip
            /tmp/p05-atomic/out1/atomic-self-test.json
            /tmp/p05-atomic/out1/P05-V1.2.4-ATOMIC-METADATA.json
            /tmp/p05-atomic/out1/P05-V1.2.4-ATOMIC-GATE.json
            /tmp/p05-atomic/out1/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
