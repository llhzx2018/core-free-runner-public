name: temp-s01-m3u8-12530-postpush-readback-20260908
on:
  push:
    branches:
      - temp/s01-page-update-center-v4-20260907
    paths:
      - .github/workflows/temp-s01-m3u8-12530-postpush-readback-20260908.yml
permissions:
  contents: read
jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      REPO: llhzx2018/vf-tools-m3u8
      BRANCH: work/s01-m3u8-provider-dashboard-visible-ui-20260908
      EXPECTED_HEAD: df0c0b4203be8f9e9cc1411ccae9199dd0c7188b
      BASE_SHA: f806ad64447cdd84c664dcfa19ad52ab4fd45e17
    steps:
      - name: Verify remote candidate bytes and boundaries
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'READBACK_MODE=REMOTE_EXACT_HEAD WRITE_USED=NO RELEASE_WRITE_USED=NO DISTRIBUTION_WRITE_USED=NO PRODUCTION_WRITE_USED=NO'
          rm -rf /tmp/m3u8-readback
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/${REPO}.git" /tmp/m3u8-readback
          git -C /tmp/m3u8-readback checkout -q "$BRANCH"
          test "$(git -C /tmp/m3u8-readback rev-parse HEAD)" = "$EXPECTED_HEAD"
          cd /tmp/m3u8-readback
          test "$(tr -d '\r\n' < VERSION)" = '1.25.30'
          grep -q 'Version: 1.25.30' src/vf-tool-m3u8.php
          grep -q "VF_TOOL_M3U8_VERSION', '1.25.30" src/vf-tool-m3u8.php
          grep -q "VF_TOOL_M3U8_ROUND', 'R254" src/vf-tool-m3u8.php
          grep -q 'R254_S01_PROVIDER_DASHBOARD_VISIBLE_UI_CLOSURE' src/vf-tool-m3u8.php
          php -l src/vf-tool-m3u8.php >/dev/null
          php -l src/admin/Controller/class-v6-provider-operations-controller.php >/dev/null
          php tests/provider-dashboard-visible-ui-contract.php
          php tests/frontend-s01-uiux-final-owner-contract.php
          for f in tests/unit/*.php; do php "$f"; done
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          git diff --exit-code "$BASE_SHA"..HEAD -- src/config src/database src/migrations docs/authority/CURRENT.md
          test "$(git diff --name-only "$BASE_SHA"..HEAD | grep -Ec '^admin/ui-v4/phase4-component-workspace\.css$')" = '1'
          test "$(git diff --name-only "$BASE_SHA"..HEAD | grep -Ec '^src/admin/Controller/class-v6-provider-operations-controller\.php$')" = '1'
          test "$(git diff --name-only "$BASE_SHA"..HEAD | grep -Ec '^VERSION$')" = '1'
          echo 'VERSION=1.25.30 ROUND=R254'
          echo 'SCHEMA_LOCATOR_MIGRATION_BOUNDARY=UNCHANGED'
          echo 'PASS_S01_C03_M3U8_12530_POSTPUSH_READBACK'
