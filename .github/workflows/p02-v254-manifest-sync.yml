name: P02 V2.5.4 Candidate Manifest Sync

on:
  pull_request:
    branches: [gate/p02-v254-common-baseline]
    paths:
      - triggers/p02-v254-manifest-sync.txt

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact private candidate with registered write route
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: maintenance/common-baseline-v2.5.4
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: product

      - name: Generate and commit only source manifests
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '86fa4e6016e88ec1bab738afa1879ded6d8cffa0'
          python scripts/generate-source-manifest.py
          python scripts/verify-source-manifest.py
          changed="$(git status --porcelain | awk '{print $2}')"
          test -n "$changed"
          if printf '%s\n' "$changed" | grep -Ev '^(SOURCE_MANIFEST\.json|SOURCE_MANIFEST\.txt)$'; then
            echo P02_MANIFEST_SYNC_SCOPE_VIOLATION
            exit 79
          fi
          git config user.name 'VF Agent Runner'
          git config user.email 'vf-agent@users.noreply.github.com'
          git add SOURCE_MANIFEST.json SOURCE_MANIFEST.txt
          git commit -m 'build(P02): sync V2.5.4 source manifest'
          git push origin HEAD:maintenance/common-baseline-v2.5.4
          echo P02_V254_SOURCE_MANIFEST_SYNC=PASS

      - name: Safety
        if: always()
        shell: bash
        run: |
          echo TOKEN_EXPOSED=NO
          echo MAIN_WRITE=NO
          echo PRODUCTION_WRITE=NO
