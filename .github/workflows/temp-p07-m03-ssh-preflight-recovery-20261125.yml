name: TEMP P07 M03 RC4 immutable archive and bulk runtime closure
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p07-m03-ssh-preflight-recovery-20261125.yml'
permissions:
  contents: read
jobs:
  p07-m03-bulk-source:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.actor == 'llhzx2018' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'test/p07-m03-ssh-preflight-recovery-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_REPO: 'llhzx2018/vf-server-ops'
      TARGET_VERSION: '0.1.0'
      TARGET_SHA: 'bd3db8f77a738b7c0bbcc43ba5e91e6735346edc'
      TARGET_TREE: '327cccefceb34d4555a52cd528c4118a1485947f'
      BASE_SHA: 'de09de2f480de246af7b99c330d5d95c1e3c0bc8'
      GOV_SHA: '5afe0d29a5a401db80ecdb981038b89a8cefed0a'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout existing public-safe harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact lane identity
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B scripts/ephemeral_lane_spec.py validate --spec .github/ephemeral/p07-m03-ssh-preflight-recovery-20261125.json >/dev/null
          python3 -B scripts/ephemeral_lane_spec.py audit-rendered --spec .github/ephemeral/p07-m03-ssh-preflight-recovery-20261125.json --input .github/workflows/temp-p07-m03-ssh-preflight-recovery-20261125.yml >/dev/null
          echo P07_BULK_EXACT_LANE=PASS
      - name: Transient exact private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 'bd3db8f77a738b7c0bbcc43ba5e91e6735346edc'
          path: .p07-private
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - name: Transient exact GOV authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: '5afe0d29a5a401db80ecdb981038b89a8cefed0a'
          path: .gov-private
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Verify actual issued RC4 archive and stage noninstallable bulk overlay
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          p="$GITHUB_WORKSPACE/.p07-private"
          g="$GITHUB_WORKSPACE/.gov-private"
          test "$(git -C "$p" rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C "$p" rev-parse 'HEAD^{tree}')" = "$TARGET_TREE"
          test "$(git -C "$g" rev-parse HEAD)" = "$GOV_SHA"
          test "$(cat "$p/VERSION")" = "$TARGET_VERSION"
          root="$RUNNER_TEMP/p07-bulk-package"
          mkdir -m 700 "$root"
          unset GH_TOKEN GITHUB_TOKEN GH_ENTERPRISE_TOKEN
          curl -q --proto '=https' --tlsv1.2 -fsSL --connect-timeout 10 --max-time 90 'https://github.com/llhzx2018/core-free-runner-public/releases/download/p07-m03-v0.1.0-release147-rc4-maintenance-20261125/P07-M03-0.1.0-release147-rc4-MAINTENANCE.zip' -o "$root/rc4.zip"
          printf '%s  %s\n' '85570da2d135e39ae3634e511298e50dede81015019e305c7de068e04ca93238' "$root/rc4.zip" | sha256sum -c -
          python3 -B - "$p" "$root" <<'PY'
          import ast,hashlib,io,json,pathlib,stat,sys,tarfile,zipfile
          p,root=map(pathlib.Path,sys.argv[1:])
          sys.path.insert(0,str(p/"scripts"))
          import p07_m03_rc3_recovery_bundle as rc
          import p07_m03_trial_from_official as trial
          def need(ok,code):
              if not ok: raise SystemExit("P07_PACKAGE_BLOCKED:"+code)
          with zipfile.ZipFile(root/"rc4.zip") as z:
              items=z.infolist()
              need(50<=len(items)<=250 and sum(x.file_size for x in items)<=rc.MAX_SIZE,"ARCHIVE_SIZE")
              need(len({x.filename for x in items})==len(items),"DUPLICATE")
              need(all(rc._safe_member(x.filename) and stat.S_IFMT(x.external_attr>>16)==stat.S_IFREG for x in items),"PATH_TYPE")
              old={x.filename:z.read(x) for x in items}
          names=rc._verified_rows(old,expected_build=rc.RC4_BUILD)
          print("P07_RC4_ISSUED_MANIFEST=PASS")
          base={}
          with tarfile.open(fileobj=io.BytesIO(old[rc.BASE_PACKAGE]),mode="r:gz") as t:
              members=t.getmembers()
              need(len(members)<=10000 and sum(m.size for m in members)<=rc.MAX_SIZE,"BASE_LIMIT")
              for m in members:
                  path=pathlib.PurePosixPath(m.name)
                  need(not path.is_absolute() and ".." not in path.parts and not m.issym() and not m.islnk(),"BASE_PATH")
                  if m.isfile() and len(path.parts)>1:
                      rel="/".join(path.parts[1:])
                      need(rel not in base,"BASE_DUPLICATE")
                      base[rel]=t.extractfile(m).read()
          patches=set(trial.PATCH_FILES_146)
          need(len(patches)==12 and "lib/migration_clean_bulk.py" in patches,"EXACT_PATCH_SCOPE")
          source={}
          for rel in sorted(patches):
              fp=p/rel
              need(fp.is_file() and not fp.is_symlink(),"SOURCE_FILE")
              source[rel]=fp.read_bytes()
          overlay={n:old[rc.PREFIX+n] for n in names}
          overlay.update(source)
          changed={n for n in patches if old.get(rc.PREFIX+n)!=source[n]}
          preserved=all(overlay[n]==old[rc.PREFIX+n] for n in names if n not in patches)
          need(preserved and overlay["BUILD_ID"]==old[rc.PREFIX+"BUILD_ID"],"RC4_PRESERVATION")
          full={**base,**overlay}
          local_names={x.stem for x in (p/"lib").glob("*.py")}
          missing=set()
          for rel in sorted(source):
              if not rel.endswith(".py"):continue
              syntax=ast.parse(source[rel].decode("utf8"))
              for node in ast.walk(syntax):
                  if isinstance(node,ast.Import): ns=[x.name.split(".")[0] for x in node.names]
                  elif isinstance(node,ast.ImportFrom) and node.module:ns=[node.module.split(".")[0]]
                  else:continue
                  missing.update("lib/"+n+".py" for n in ns if n in local_names and "lib/"+n+".py" not in full)
          need(not missing,"LOCAL_IMPORT_CLOSURE")
          print("P07_BULK_RC4_DEPENDENCY_CLOSURE=PASS")
          print("P07_BULK_SCOPE_COUNT="+str(len(patches)))
          print("P07_BULK_CHANGED_OVERLAY_COUNT="+str(len(changed)))
          print("P07_BULK_PRESERVED_ISSUED_OVERLAY_COUNT="+str(len(set(names)-patches)))
          # DELIBERATELY NOT an installer or a runtime distribution. Preserve
          # signed RC4 assets and derive a separate development-only delta.
          receipt={"schema":"p07.m03.bulk-overlay-proof.v1","status":"NOT_INSTALLABLE_NOT_PUBLISHED","source_commit":"bd3db8f77a738b7c0bbcc43ba5e91e6735346edc","source_tree":"327cccefceb34d4555a52cd528c4118a1485947f","base_sha256":rc.sha256((root/"rc4.zip").read_bytes()),"files":{n:rc.gitblob(source[n]) for n in sorted(source)}}
          def pack(dst):
              with zipfile.ZipFile(dst,"x",compression=zipfile.ZIP_DEFLATED,compresslevel=9) as out:
                  for n,data in sorted({"receipt.json":(json.dumps(receipt,sort_keys=True)+"\n").encode(),**{"candidate-delta/"+k:v for k,v in source.items()}}.items()):
                      i=zipfile.ZipInfo(n,(2026,11,26,0,0,0));i.create_system=3;i.external_attr=0o100644<<16
                      out.writestr(i,data,compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          pack(root/"delta.zip");pack(root/"repeat.zip")
          need((root/"delta.zip").read_bytes()==(root/"repeat.zip").read_bytes(),"DETERMINISM")
          with zipfile.ZipFile(root/"delta.zip") as out:
              need(out.testzip() is None and len(out.namelist())==13,"DELTA_INTEGRITY")
          print("P07_BULK_DEVELOPMENT_DELTA_SHA256="+rc.sha256((root/"delta.zip").read_bytes()))
          print("P07_BULK_DEVELOPMENT_DELTA=PASS_NOT_INSTALLABLE")
          print("P07_RC4_INSTALLER_UNCHANGED=YES")
          PY
      - name: Erase all transient private source and candidate bytes
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- "$GITHUB_WORKSPACE/.p07-private" "$GITHUB_WORKSPACE/.gov-private" "$RUNNER_TEMP/p07-bulk-package"
          test ! -e "$GITHUB_WORKSPACE/.p07-private" && test ! -e "$GITHUB_WORKSPACE/.gov-private" && test ! -e "$RUNNER_TEMP/p07-bulk-package"
          echo P07_BULK_PACKAGE_CLEANUP=PASS
