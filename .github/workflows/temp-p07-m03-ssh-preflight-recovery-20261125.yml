name: TEMP P07 M03 exact RC4 to bulk candidate isolated installer
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p07-m03-ssh-preflight-recovery-20261125.yml'
permissions:
  contents: read
jobs:
  p07-m03-bulk-source:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.actor == 'llhzx2018' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'test/p07-m03-ssh-preflight-recovery-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_REPO: 'llhzx2018/vf-server-ops'
      TARGET_VERSION: '0.1.0'
      TARGET_SHA: '1524fcbd128ab32834b7c6ff077930676a9c2b29'
      TARGET_TREE: '87028f377a46bae3fa8304d8471be8f678595695'
      BASE_SHA: 'de09de2f480de246af7b99c330d5d95c1e3c0bc8'
      GOV_SHA: '5afe0d29a5a401db80ecdb981038b89a8cefed0a'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout existing public-safe harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact lane identity
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B scripts/ephemeral_lane_spec.py validate --spec .github/ephemeral/p07-m03-ssh-preflight-recovery-20261125.json >/dev/null
          python3 -B scripts/ephemeral_lane_spec.py audit-rendered --spec .github/ephemeral/p07-m03-ssh-preflight-recovery-20261125.json --input .github/workflows/temp-p07-m03-ssh-preflight-recovery-20261125.yml >/dev/null
          echo P07_BULK_EXACT_LANE=PASS
      - name: Transient exact private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: '1524fcbd128ab32834b7c6ff077930676a9c2b29'
          path: .p07-private
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - name: Transient exact GOV authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: '5afe0d29a5a401db80ecdb981038b89a8cefed0a'
          path: .gov-private
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Exact RC4 archive to isolated disposable CLI install and upgrade
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          p="$GITHUB_WORKSPACE/.p07-private"
          g="$GITHUB_WORKSPACE/.gov-private"
          test "$(git -C "$p" rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C "$p" rev-parse 'HEAD^{tree}')" = "$TARGET_TREE"
          test "$(git -C "$g" rev-parse HEAD)" = "$GOV_SHA"
          test "$(git -C "$p" diff --name-only bd3db8f77a738b7c0bbcc43ba5e91e6735346edc HEAD | sort | tr '\n' ' ')" = "scripts/p07_m03_bulk_candidate.py tests/test_p07_m03_bulk_real_installer.py "
          root="$RUNNER_TEMP/p07-bulk-package"
          mkdir -m 700 "$root"
          unset GH_TOKEN GITHUB_TOKEN GH_ENTERPRISE_TOKEN
          curl -q --proto '=https' --tlsv1.2 -fsSL --connect-timeout 10 --max-time 90 'https://github.com/llhzx2018/core-free-runner-public/releases/download/p07-m03-v0.1.0-release147-rc4-maintenance-20261125/P07-M03-0.1.0-release147-rc4-MAINTENANCE.zip' -o "$root/rc4.zip"
          printf '%s  %s\n' '85570da2d135e39ae3634e511298e50dede81015019e305c7de068e04ca93238' "$root/rc4.zip" | sha256sum -c -
          cd "$p"
          test "$(id -u)" != 0
          export P07_M03_OFFICIAL_RC4="$root/rc4.zip" P07_M03_CANDIDATE_SHA="$TARGET_SHA"
          export TMPDIR="$root"
          if ! python3 -B -m unittest -v tests.test_p07_m03_bulk_real_installer >"$root/results.log" 2>&1; then
            grep -E '^(FAIL|ERROR):|^Ran [0-9]+ tests?|^FAILED|^P07_BULK_INSTALLABLE_DEV_SHA256=|^(AssertionError|.*BulkBundleBlocked|.*TrialBundleBlocked|.*RC3RecoveryBlocked):' "$root/results.log" | head -30 || true
            exit 13
          fi
          grep -E '^test_.* \.\.\. ok$|^Ran [0-9]+ tests?|^OK$|^P07_BULK_INSTALLABLE_DEV_SHA256=' "$root/results.log"
          grep -q '^Ran 7 tests ' "$root/results.log"
          echo P07_BULK_REAL_ISOLATED_INSTALLER=PASS
          echo P07_BULK_PRIOR_PRODUCT_EVIDENCE_REUSED=YES
          python3 -B .github/checks/architecture_gate.py --manifest .github/checks/code_architecture.json --gov-root "$g" --base-sha "$BASE_SHA" --head-sha "$TARGET_SHA" --git-root "$p"
      - name: Erase all transient private source and candidate bytes
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- "$GITHUB_WORKSPACE/.p07-private" "$GITHUB_WORKSPACE/.gov-private" "$RUNNER_TEMP/p07-bulk-package"
          test ! -e "$GITHUB_WORKSPACE/.p07-private" && test ! -e "$GITHUB_WORKSPACE/.gov-private" && test ! -e "$RUNNER_TEMP/p07-bulk-package"
          echo P07_BULK_PACKAGE_CLEANUP=PASS
