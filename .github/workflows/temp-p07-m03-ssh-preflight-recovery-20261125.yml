name: TEMP P07 M03 clean bulk source-only focused gate
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p07-m03-ssh-preflight-recovery-20261125.yml'
permissions:
  contents: read
jobs:
  p07-m03-bulk-source:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.actor == 'llhzx2018' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'test/p07-m03-ssh-preflight-recovery-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_REPO: 'llhzx2018/vf-server-ops'
      TARGET_VERSION: '0.1.0'
      TARGET_SHA: '93c205728282ebee4c5f0b8763103173d2f5c574'
      TARGET_TREE: '9901b5745fa16ec87050dde404cf585aca6983a7'
      BASE_SHA: 'de09de2f480de246af7b99c330d5d95c1e3c0bc8'
      GOV_SHA: '5afe0d29a5a401db80ecdb981038b89a8cefed0a'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout existing public-safe harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact lane identity
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B scripts/ephemeral_lane_spec.py validate --spec .github/ephemeral/p07-m03-ssh-preflight-recovery-20261125.json >/dev/null
          python3 -B scripts/ephemeral_lane_spec.py audit-rendered --spec .github/ephemeral/p07-m03-ssh-preflight-recovery-20261125.json --input .github/workflows/temp-p07-m03-ssh-preflight-recovery-20261125.yml >/dev/null
          echo P07_BULK_EXACT_LANE=PASS
      - name: Transient exact private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: '93c205728282ebee4c5f0b8763103173d2f5c574'
          path: .p07-private
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - name: Transient exact GOV authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: '5afe0d29a5a401db80ecdb981038b89a8cefed0a'
          path: .gov-private
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Exact source and focused synthetic tests only
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          p="$GITHUB_WORKSPACE/.p07-private"
          g="$GITHUB_WORKSPACE/.gov-private"
          test "$(git -C "$p" rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C "$p" rev-parse 'HEAD^{tree}')" = "$TARGET_TREE"
          test "$(git -C "$g" rev-parse HEAD)" = "$GOV_SHA"
          test "$(cat "$p/VERSION")" = "$TARGET_VERSION"
          cd "$p"
          bash -n bin/vfops-migrate-ui components/p07-m03-safe-batch-ui.sh
          python3 -B - <<'PY'
          import ast,pathlib
          for path in ('lib/migration_clean_bulk.py','lib/migration_safe_batch_cli.py','lib/migration_safe_batch_io.py','tests/test_p07_m03_clean_bulk.py','tests/test_p07_m03_safe_batch_terminal_ux.py'):
              ast.parse(pathlib.Path(path).read_text(encoding="utf8"))
          PY
          echo P07_BULK_SYNTAX=PASS
          failed=0
          gate() {
            local name="$1"; shift
            local log="$RUNNER_TEMP/p07-bulk-$name.log"
            if "$@" >"$log" 2>&1; then
              echo "P07_BULK_GATE=$name:PASS"
              grep -E '^Ran [0-9]+ tests? |^OK$|^PROJECT_ARCHITECTURE=STRUCTURAL_PASS|^PR_UX_EVIDENCE=STRUCTURAL_PASS' "$log" | head -4 || true
            else
              echo "P07_BULK_GATE=$name:FAIL"
              grep -E '^(FAIL|ERROR): test_|^Ran [0-9]+ tests? |^FAILED \(' "$log" | head -20 || true
              failed=1
            fi
          }
          gate new_bulk python3 -B -m unittest -q tests.test_p07_m03_clean_bulk
          gate impacted_trial python3 -B -m unittest -q tests.test_p07_m03_safe_batch
          gate terminal python3 -B -m unittest -q tests.test_p07_m03_safe_batch_terminal_ux
          gate historical_builder python3 -B -m unittest -q tests.test_p07_m03_trial_builder_146
          gate architecture python3 -B .github/checks/architecture_gate.py --manifest .github/checks/code_architecture.json --gov-root "$g" --base-sha "$BASE_SHA" --head-sha "$TARGET_SHA" --git-root "$p"
          gate module_contract python3 -B scripts/check_p07_modules.py
          gate terminal_contract python3 -B scripts/check_p07_terminal_ux.py --base-ref "$BASE_SHA" --module P07-M03-D04 --evidence-file docs/ux-reviews/p07-m03-d04-clean-bulk-20261126.json
          test "$failed" = 0
          echo P07_BULK_FOCUSED_SOURCE_ONLY=PASS
      - name: Always erase transient private workspaces and logs
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- "$GITHUB_WORKSPACE/.p07-private" "$GITHUB_WORKSPACE/.gov-private"
          rm -f -- "$RUNNER_TEMP"/p07-bulk-*.log
          test ! -e "$GITHUB_WORKSPACE/.p07-private" && test ! -e "$GITHUB_WORKSPACE/.gov-private"
          echo P07_BULK_TRANSIENT_CLEANUP=PASS
