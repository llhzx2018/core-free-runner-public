name: P02 Generate Source Manifest

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p02-generate-source-manifest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CANDIDATE_REF: 16e91f12f9701d87a6da27751eb6fc43af794076
      CANDIDATE_VERSION: 2.4.25
    steps:
      - name: Checkout public shell
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Require private read token
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_TOKEN" || exit 78
      - name: Checkout exact private candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.CANDIDATE_REF }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p02
          fetch-depth: 1
          persist-credentials: false
      - name: Generate metadata-only manifests
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p02 rev-parse HEAD)" = "$CANDIDATE_REF"
          test "$(tr -d '\r\n' < p02/VERSION)" = "$CANDIDATE_VERSION"
          python3 - <<'PY'
          import hashlib,json,pathlib,os
          root=pathlib.Path('p02')
          current=json.loads((root/'SOURCE_MANIFEST.json').read_text(encoding='utf-8'))
          mapping=[(e['full_path'],e['repo_path']) for e in current['entries']]
          new=('assets/navigation-refresh-policy.js','public/assets/navigation-refresh-policy.js')
          if new not in mapping: mapping.append(new)
          entries=[]
          for full_path,repo_path in sorted(mapping):
              p=root/repo_path
              if not p.is_file() or p.is_symlink(): raise SystemExit(f'invalid runtime path: {repo_path}')
              b=p.read_bytes(); h=hashlib.sha256(b).hexdigest()
              entries.append({'full_path':full_path,'repo_path':repo_path,'bytes':len(b),'sha256':h,'repo_sha256':h})
          version=os.environ['CANDIDATE_VERSION']
          out={'project':'P02 · VF Library','version':version,'schema':2401,'source_baseline_full_sha256':'PENDING_FORMAL_CANDIDATE_ARTIFACT','mapping_contract':'Each declared runtime source file must exist exactly once at repo_path; hashes bind the Git-native V2.4.25 Product Optimization Candidate derived from Production V2.4.24. Formal release identity is not assigned by this candidate manifest.','runtime_source_file_count':len(entries),'entries':entries}
          pathlib.Path('metadata').mkdir(exist_ok=True)
          pathlib.Path('metadata/SOURCE_MANIFEST.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          lines=[f'VF Library V{version} CANDIDATE SOURCE_MANIFEST','FULL_SHA256  PENDING_FORMAL_CANDIDATE_ARTIFACT',f'RUNTIME_SOURCE_FILES  {len(entries)}','MAPPING_STATUS  CURRENT_GIT_CANDIDATE','']
          lines += [f"{e['sha256']}  {e['repo_path']}  <=  {e['full_path']}" for e in entries]
          pathlib.Path('metadata/SOURCE_MANIFEST.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          assert len(entries)==53
          print('RUNTIME_SOURCE_FILES='+str(len(entries)))
          print('NAV_POLICY='+next(e['sha256'] for e in entries if e['repo_path']=='public/assets/navigation-refresh-policy.js'))
          print('VERSION='+next(e['sha256'] for e in entries if e['repo_path']=='VERSION'))
          print('SOURCE_MANIFEST_GENERATION=PASS')
          PY
      - name: Metadata privacy gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(find metadata -type f | wc -l)" = 2
          if find metadata -type f \( -name '*.php' -o -name '*.js' -o -name '*.css' -o -name '*.sqlite' -o -name '*.db' -o -name '*.zip' \) -print -quit | grep -q .; then exit 91; fi
          echo 'METADATA_PRIVACY=PASS'
      - name: Upload metadata-only manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p02-v2.4.25-source-manifest-${{ github.run_id }}
          path: metadata/
          if-no-files-found: error
          retention-days: 3
      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf p02 metadata
