name: P02 Generate Source Manifest

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p02-generate-source-manifest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CANDIDATE_COMMIT: 1657c1ba951ca4513f9f05554a15b758feed323b
    steps:
      - name: Checkout public shell
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Require private read token
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_TOKEN" || exit 78

      - name: Checkout exact private candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: 1657c1ba951ca4513f9f05554a15b758feed323b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p02
          fetch-depth: 1
          persist-credentials: false

      - name: Generate metadata-only manifests
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p02 rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('p02')
          current=json.loads((root/'SOURCE_MANIFEST.json').read_text(encoding='utf-8'))
          by_repo={e['repo_path']:e for e in current['entries']}
          by_repo['public/assets/update-core-ui.js']={'full_path':'assets/update-core-ui.js','repo_path':'public/assets/update-core-ui.js'}
          entries=[]
          for repo_path,entry in by_repo.items():
              p=root/repo_path
              if not p.is_file() or p.is_symlink(): raise SystemExit(f'invalid runtime path: {repo_path}')
              b=p.read_bytes(); h=hashlib.sha256(b).hexdigest()
              entries.append({'full_path':entry['full_path'],'repo_path':repo_path,'bytes':len(b),'sha256':h,'repo_sha256':h})
          entries.sort(key=lambda x:x['full_path'])
          out={
            'project':'P02 · VF Library','version':'2.4.23','schema':2401,
            'source_baseline_full_sha256':current['source_baseline_full_sha256'],
            'mapping_contract':current['mapping_contract'],
            'runtime_source_file_count':len(entries),'entries':entries
          }
          pathlib.Path('metadata').mkdir(exist_ok=True)
          pathlib.Path('metadata/SOURCE_MANIFEST.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          lines=['VF Library V2.4.23 CANDIDATE SOURCE_MANIFEST','FULL_SHA256  PENDING_FORMAL_RELEASE',f'RUNTIME_SOURCE_FILES  {len(entries)}','MAPPING_STATUS  CURRENT_GIT_CANDIDATE','']
          lines += [f"{e['sha256']}  {e['repo_path']}  <=  {e['full_path']}" for e in entries]
          pathlib.Path('metadata/SOURCE_MANIFEST.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print('RUNTIME_SOURCE_FILES='+str(len(entries)))
          print('METADATA_ONLY_MANIFEST=PASS')
          PY

      - name: Metadata privacy gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(find metadata -type f | wc -l)" = 2
          if find metadata -type f \( -name '*.php' -o -name '*.js' -o -name '*.css' -o -name '*.sqlite' -o -name '*.db' -o -name '*.zip' \) -print -quit | grep -q .; then exit 91; fi
          echo 'METADATA_PRIVACY=PASS'

      - name: Upload metadata-only manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p02-source-manifest-${{ github.run_id }}
          path: metadata/
          if-no-files-found: error
          retention-days: 3

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf p02 metadata
