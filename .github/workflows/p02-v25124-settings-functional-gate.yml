name: P02 V2.5.124 Settings Functional Content Gate

on:
  push:
    branches:
      - run/p02-v25124-settings-functional-content-20260926
    paths:
      - '.github/workflows/p02-v25124-settings-functional-gate.yml'
      - 'requests/p02-v25124-settings-functional-browser.sh'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout runner carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner

      - name: Checkout exact P02 V2.5.124 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: db9a28b262597a89c79f8d0e88b01b3d5aea18da
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product

      - name: Install PHP SQLite and Chromium runtime
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-zip sqlite3 unzip curl jq
          cd product
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Exact-source repository and Settings contracts
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "db9a28b262597a89c79f8d0e88b01b3d5aea18da"
          test "$(git show -s --format=%T HEAD)" = "e0b1d9e3948df19e60fbcc292b663f00836ce907"
          test "$(cat VERSION)" = "2.5.124"
          python3 scripts/generate-source-manifest.py
          git diff --exit-code -- SOURCE_MANIFEST.json SOURCE_MANIFEST.txt
          python3 scripts/verify-source-manifest.py
          bash scripts/verify-repository.sh
          node tests/unit/p02_v25121_settings_ia_functional_closure.mjs
          node tests/unit/p02_v25122_settings_production_closure.mjs
          node tests/unit/p02_v25123_runtime_health_worker_closure.mjs
          node tests/unit/p02_v25124_settings_functional_content_closure.mjs
          echo P02_V25124_SETTINGS_SOURCE_CONTRACT=PASS

      - name: Settings browser matrix
        run: |
          set -Eeuo pipefail
          bash runner/requests/p02-v25124-settings-functional-browser.sh

      - name: Closure marker
        run: |
          cat <<'EOF'
          TESTING=PASS
          DATA_SCHEMA=PASS
          GIT=PASS
          UI_SETTINGS=PASS
          RELEASE=N_A_NOT_AUTHORIZED
          PRODUCTION=N_A_NOT_AUTHORIZED
          P02_V25124_SETTINGS_FUNCTIONAL_CONTENT_GATE=PASS
          EOF
