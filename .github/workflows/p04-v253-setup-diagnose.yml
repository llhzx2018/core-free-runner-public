name: P04 V2.5.3 Setup Diagnose

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p04-v253-setup-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Prepare and inspect setup GET
        env:
          TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$TOKEN"
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-zip >/dev/null
          git clone -q "https://x-access-token:${TOKEN}@github.com/llhzx2018/vf-infra.git" repo
          cd repo
          git checkout -q 91984268ffe66781700db9da10de8d509c878c0b
          ROOT="$RUNNER_TEMP/p04-setup-diag"; SITE="$ROOT/site"
          rm -rf "$ROOT"; mkdir -p "$SITE"
          python3 scripts/build-release-tree.py "$SITE" >/tmp/p04-build.txt
          PORT=$(python3 -c 'import socket;s=socket.socket();s.bind(("127.0.0.1",0));print(s.getsockname()[1]);s.close()')
          php -d display_errors=1 -d log_errors=1 -S 127.0.0.1:$PORT -t "$SITE" >"$RUNNER_TEMP/p04-setup-http.log" 2>&1 & PID=$!
          trap 'kill $PID 2>/dev/null || true; rm -rf "$ROOT" repo' EXIT
          sleep .5
          echo "SERVER_ALIVE=$(kill -0 $PID 2>/dev/null && echo YES || echo NO) PORT=$PORT"
          curl -sS -D "$RUNNER_TEMP/p04-setup.headers" -o "$RUNNER_TEMP/p04-setup.body" -w 'SETUP_HTTP=%{http_code}\n' "http://127.0.0.1:$PORT/setup.php" || true
          echo '--- HEADERS ---'
          sed -n '1,30p' "$RUNNER_TEMP/p04-setup.headers"
          echo '--- BODY HEAD ---'
          sed -n '1,80p' "$RUNNER_TEMP/p04-setup.body" | sed -E 's#(/[A-Za-z0-9._-]+){3,}#[ABSOLUTE_PATH_REDACTED]#g'
          echo '--- SERVER LOG ---'
          sed -n '1,120p' "$RUNNER_TEMP/p04-setup-http.log" | sed -E 's#(/[A-Za-z0-9._-]+){3,}#[ABSOLUTE_PATH_REDACTED]#g'
          echo 'DIAG_COMPLETE=PASS'
