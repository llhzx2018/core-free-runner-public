name: P08 R93 VPS Static Nginx atomic deploy exact-source proof (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p08-r93-vps-atomic-once.yml'
permissions:
  contents: read
jobs:
  p08-r93:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout public-safe test harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Transient checkout exact P08 private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-adops
          ref: 965a8aaa14f3f31f90608938885bc2b0f34f5430
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-p08-r93
      - name: Reject wrong SHA or installed Owner state
        run: |
          set -euo pipefail
          test "$(git -C private-p08-r93 rev-parse HEAD)" = 965a8aaa14f3f31f90608938885bc2b0f34f5430
          test "$(cat private-p08-r93/VERSION)" = 0.1.1
          test ! -e private-p08-r93/.env
          test ! -e private-p08-r93/storage/app/private/adops/installation/installed.json
          echo P08_R93_EXACT_SOURCE=PASS
      - name: Transient canonical GOV-DOC checkout for mandatory FULL gates
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/gov-doc
          ref: f84c0d22769520cea1becccd9e277b9753cc3912
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov-doc-r93
      - name: PHP 8.4 and pinned Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: zip, mbstring, dom, fileinfo, pdo_sqlite, sqlite3, pdo_mysql, intl, sodium
      - name: Node 22 for locked Vue build
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Genuine Laravel and Vite locked build, typecheck and unit tests
        run: |
          set -euo pipefail
          cd private-p08-r93
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          composer install --no-interaction --no-progress --prefer-dist --no-scripts > "$RUNNER_TEMP/p08-r93-composer.log" 2>&1 || { tail -n 25 "$RUNNER_TEMP/p08-r93-composer.log"; exit 1; }
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-r93-npm.log" 2>&1 || { tail -n 25 "$RUNNER_TEMP/p08-r93-npm.log"; exit 1; }
          npm run build
          npm run typecheck
          npm run test:unit
          python3 scripts/check_stack_contract.py --phase foundation
          echo P08_R93_VUE_LOCKED_BUILD_AND_TYPES=PASS
      - name: PHP lint and Owner VPS SSH static deployment, staging, recovery and rollback
        run: |
          set -euo pipefail
          cd private-p08-r93
          php -l src/Landing/LandingBuilder.php
          php -l app/Http/Controllers/LandingController.php
          php -l app/Modules/Landing/Actions/CreateLanding.php
          php -l app/Modules/Landing/Actions/LandingAssetLibrary.php
          php -l app/Http/Controllers/LandingAssetController.php
          php -l database/migrations/2026_11_13_000003_create_landing_assets.php
          php -l app/Modules/StaticDeployment/Actions/CloudflarePagesGateway.php
          php -l app/Http/Controllers/StaticPagesController.php
          php -l app/Http/Controllers/TrackerCenterController.php
          php -l app/Modules/Tracker/Actions/TrackerEndpointPolicy.php
          php -l app/Modules/Tracker/Actions/SimpleKumaReadAdapter.php
          php -l database/migrations/2026_11_13_000005_create_tracker_connections.php
          php -l tests/Feature/TrackerCenterWorkflowTest.php
          php -l app/Http/Controllers/VpsStaticController.php
          php -l app/Modules/StaticDeployment/Actions/VpsTargetPolicy.php
          php -l app/Modules/StaticDeployment/Actions/VpsRemoteExecutor.php
          php -l app/Modules/StaticDeployment/Actions/OpenSshRemoteExecutor.php
          php -l app/Modules/StaticDeployment/Actions/VpsAtomicGateway.php
          php -l database/migrations/2026_11_14_000006_create_static_vps_targets.php
          php -l tests/Feature/VpsStaticWorkflowTest.php
          bash -n scripts/prepare-vps-static.sh
          php -l database/migrations/2026_11_13_000004_create_static_pages_targets.php
          php -l tests/Feature/StaticPagesWorkflowTest.php
          php -l tests/Feature/LandingAssetWorkflowTest.php
          php -l tests/Feature/LandingHistoryPreviewTest.php
          php tests/run.php
          ./vendor/bin/phpunit --no-progress tests/Feature/LandingAssetWorkflowTest.php
          ./vendor/bin/phpunit --no-progress tests/Feature/LandingHistoryPreviewTest.php
          ./vendor/bin/phpunit --no-progress tests/Feature/StaticPagesWorkflowTest.php
          ./vendor/bin/phpunit --no-progress tests/Feature/TrackerCenterWorkflowTest.php
          ./vendor/bin/phpunit --no-progress tests/Feature/VpsStaticWorkflowTest.php
          php -l tests/runtime/vps_atomic_native.php
          echo P08_R93_OWNER_SQLITE_SYNTHETIC=PASS
          echo P08_R93_STATIC_LAYOUTS_OWNER_REVISION_SQLITE=PASS
      - name: Native non-root Linux TAR checksum version switch and rollback
        run: |
          set -euo pipefail
          cd private-p08-r93
          if id vpsr93 >/dev/null 2>&1; then echo "TEST_USER_ALREADY_EXISTS"; exit 1; fi
          sudo useradd -m -s /bin/bash vpsr93
          cleanup() { sudo userdel -r vpsr93 >/dev/null 2>&1 || true; sudo rm -f /tmp/p08-r93-prepare.sh; }
          trap cleanup EXIT
          sudo install -m 0755 scripts/prepare-vps-static.sh /tmp/p08-r93-prepare.sh
          sudo -u vpsr93 -H bash /tmp/p08-r93-prepare.sh smoke
          php tests/runtime/vps_atomic_native.php
          echo P08_R93_UNPRIVILEGED_NATIVE_RELEASE_ROLLBACK=PASS
      - name: Real isolated Chromium Owner VPS Static Provider same-page responsive workflow
        run: |
          set -euo pipefail
          cd private-p08-r93
          site="$PWD"
          db="$RUNNER_TEMP/p08-r93-browser.sqlite"
          test ! -e "$site/.env"
          test ! -e "$db"
          touch "$db"
          chmod 0600 "$db"
          key="$(php -r 'echo base64_encode(random_bytes(32));')"
          cat > "$site/.env" <<EOF
          APP_NAME=R93_Isolated_Browser
          APP_ENV=testing
          APP_DEBUG=false
          APP_KEY=base64:$key
          APP_URL=http://127.0.0.1:18989
          APP_LOCALE=zh_CN
          DB_CONNECTION=sqlite
          DB_DATABASE=$db
          DB_FOREIGN_KEYS=true
          SESSION_DRIVER=database
          SESSION_ENCRYPT=true
          SESSION_SECURE_COOKIE=false
          CACHE_STORE=database
          QUEUE_CONNECTION=sync
          LOG_CHANNEL=stack
          EOF
          chmod 0600 "$site/.env"
          php artisan migrate --force --no-interaction >/dev/null
          php -r '
            require "vendor/autoload.php";
            $app=require "bootstrap/app.php";
            $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            Illuminate\Support\Facades\DB::table("users")->insert([
              "name"=>"Synthetic Owner", "email"=>"owner@isolated.example",
              "password"=>Illuminate\Support\Facades\Hash::make("Synthetic-SQLite-Owner-12345!"),
              "created_at"=>now(), "updated_at"=>now()
            ]);
            echo "P08_R93_SYNTHETIC_SQLITE_OWNER_FIXTURE=PASS\n";
          '
          # Synthetic Owner fixture must include the same sealed install
          # marker that public/index.php correctly requires for all /app URLs.
          mkdir -p "$site/storage/app/private/adops/installation"
          printf '%s\n' '{"status":"INSTALLED","project_id":"P08","database_driver":"sqlite","owner_id":1,"domain":"127.0.0.1"}' > "$site/storage/app/private/adops/installation/installed.json"
          chmod 0600 "$site/storage/app/private/adops/installation/installed.json"
          cat > "$RUNNER_TEMP/p08-r93-router.php" <<'PHP'
          <?php
          $site=(string)getenv('P08_R93_BROWSER_SITE');
          $path=parse_url((string)($_SERVER['REQUEST_URI']??''),PHP_URL_PATH);
          if (!is_string($path) || !str_starts_with($path,'/') || str_contains($path,'..')) {
              http_response_code(404); return true;
          }
          $public=$site.'/public';
          $candidate=$public.$path;
          if (is_file($candidate) && str_starts_with((string)realpath($candidate),$public.'/')) return false;
          require $public.'/index.php';
          PHP
          export P08_R93_BROWSER_SITE="$site"
          php -S 127.0.0.1:18989 -t "$site/public" "$RUNNER_TEMP/p08-r93-router.php" > "$RUNNER_TEMP/p08-r93-php.log" 2>&1 &
          server_pid="$!"
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:18989/login -o /dev/null; then break; fi
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:18989/login -o /dev/null
          npx playwright install chromium > "$RUNNER_TEMP/p08-r93-playwright.log" 2>&1 || { tail -n 25 "$RUNNER_TEMP/p08-r93-playwright.log"; exit 1; }
          P08_TEST_BASE_URL=http://127.0.0.1:18989 npx playwright test tests/e2e/owner-workspace.spec.ts --grep 'Owner login, Landing create' --workers=1
          echo P08_R93_CHROMIUM_CPS_OFFER_MEDIA_RESPONSIVE=PASS
          kill "$server_pid" >/dev/null 2>&1 || true
          trap - EXIT
          rm -f "$site/.env" "$db" "$RUNNER_TEMP/p08-r93-router.php" "$RUNNER_TEMP/p08-r93-php.log" "$RUNNER_TEMP/p08-r93-playwright.log"
      - name: Always delete private checkout and temporary output
        if: always()
        run: |
          rm -rf private-p08-r93 gov-doc-r93
          rm -f "$RUNNER_TEMP/p08-r93-composer.log" "$RUNNER_TEMP/p08-r93-npm.log"
          rm -rf "$RUNNER_TEMP/p08-r93-local-browser-site"
          rm -f "$RUNNER_TEMP/p08-r93-local-browser-full.zip" "$RUNNER_TEMP/p08-r93-router.php" "$RUNNER_TEMP/p08-r93-local-build.json" "$RUNNER_TEMP/p08-r93-php.log" "$RUNNER_TEMP/p08-r93-playwright.log" "$RUNNER_TEMP/p08-r93-browser.sqlite"
  p08-r93-real-sql-schema-and-image:
    name: P08 R93 SQL ${{ matrix.driver }} VPS schema and prior landing revisions
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - driver: mysql
            image: mysql:8.4
            health: mysqladmin ping --silent
          - driver: mariadb
            image: mariadb:11.8
            health: healthcheck.sh --connect --innodb_initialized
    services:
      sql:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: synthetic-only-p08-ci-pass
          MARIADB_ROOT_PASSWORD: synthetic-only-p08-ci-pass
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Transient checkout pinned private P08 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-adops
          ref: 965a8aaa14f3f31f90608938885bc2b0f34f5430
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-p08-r93
      - name: Real PHP 8.4 with MySQL PDO and matching locked Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: zip, mbstring, dom, fileinfo, pdo_mysql, intl, sodium
      - name: Real SQL ${{ matrix.driver }} schema Owner Tracker and prior CPS revision
        env:
          R93_ENGINE: ${{ matrix.driver }}
        run: |
          set -euo pipefail
          cd private-p08-r93
          test "$(git rev-parse HEAD)" = 965a8aaa14f3f31f90608938885bc2b0f34f5430
          test ! -e .env
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs storage/app/private/adops
          composer install --no-interaction --no-progress --prefer-dist --no-scripts > "$RUNNER_TEMP/p08-r93-sql-composer.log" 2>&1 || { tail -n 25 "$RUNNER_TEMP/p08-r93-sql-composer.log"; exit 1; }
          php -r '
            $db=new PDO("mysql:host=127.0.0.1;port=3306;charset=utf8mb4","root","synthetic-only-p08-ci-pass", [PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);
            $db->exec("CREATE DATABASE p08_r93_sql CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci");
          '
          key="$(php -r 'echo base64_encode(random_bytes(32));')"
          cat > .env <<EOF
          APP_NAME=P08_R93_Isolated_SQL
          APP_ENV=testing
          APP_DEBUG=false
          APP_KEY=base64:$key
          APP_URL=http://localhost
          DB_CONNECTION=$R93_ENGINE
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=p08_r93_sql
          DB_USERNAME=root
          DB_PASSWORD=synthetic-only-p08-ci-pass
          SESSION_DRIVER=array
          CACHE_STORE=array
          QUEUE_CONNECTION=sync
          LOG_CHANNEL=stack
          EOF
          chmod 0600 .env
          php artisan migrate --force --no-interaction >/dev/null
          php -r '
            require "vendor/autoload.php";
            $app=require "bootstrap/app.php";
            $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            $db=Illuminate\Support\Facades\DB::connection();
            $owner=$db->table("users")->insertGetId([
              "name"=>"Synthetic R93 Owner",
              "email"=>"r93-native-sql@isolated.example",
              "password"=>Illuminate\Support\Facades\Hash::make("Synthetic-pass-12345678"),
              "created_at"=>now(),"updated_at"=>now()
            ]);
            if(!Illuminate\Support\Facades\Schema::hasTable("landing_assets"))throw new RuntimeException("R93_MISSING_NATIVE_SQL_IMAGE_SCHEMA");
            if(!Illuminate\Support\Facades\Schema::hasTable("static_pages_targets"))throw new RuntimeException("R93_MISSING_NATIVE_SQL_PAGES_TARGET_SCHEMA");
            if(!Illuminate\Support\Facades\Schema::hasTable("tracker_connections"))throw new RuntimeException("R93_MISSING_NATIVE_SQL_TRACKER_SCHEMA");
            if(!Illuminate\Support\Facades\Schema::hasTable("static_vps_targets"))throw new RuntimeException("R93_MISSING_NATIVE_SQL_VPS_SCHEMA");
            $bytes=base64_decode("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+a6eoAAAAASUVORK5CYII=",true);
            $tmp=tempnam(sys_get_temp_dir(),"r93native");
            try {
              file_put_contents($tmp,$bytes);
              $upload=new Illuminate\Http\UploadedFile($tmp,"native.png","image/png",null,true);
              $asset=(new App\Modules\Landing\Actions\LandingAssetLibrary())->upload((int)$owner,$upload);
              $payload=["kind"=>"cps","template"=>"focus",
                "title"=>"SQL isolated CPS","headline"=>"CPS isolated header",
                "body"=>"Synthetic only","cta_text"=>"View",
                "cta_url"=>"https://example.com/offer",
                "offer_reference"=>"OFFER-NATIVE-SQL-90",
                "image_asset_id"=>$asset["id"],"image_alt"=>"Native SQL test image"];
              $id=(new App\Modules\Landing\Actions\CreateLanding())->execute($payload,(int)$owner);
              $page=$db->table("landing_pages")->where("id",$id)->first();
              $revision=$db->table("landing_revisions")->where("landing_page_id",$id)->where("revision",1)->first();
              if($page===null||$revision===null||$page->kind!=="cps"
                 ||json_decode((string)$revision->source_payload,true)["offer_reference"]!=="OFFER-NATIVE-SQL-90")throw new RuntimeException("R93_CPS_SQL_PERSISTENCE_FAIL");
              $root=storage_path("app/private/adops/landings/".$id);
              $manifest=(new VF\AdOps\Landing\LandingVersionStore())->verify($root,1,(string)$revision->bundle_sha256);
              if($manifest["file_count"]!==3||!isset($manifest["files"]["media/hero.png"]))throw new RuntimeException("R93_SQL_IMAGE_MANIFEST_FAIL");
              if(file_get_contents($root."/versions/1/media/hero.png")!==$bytes)throw new RuntimeException("R93_SQL_IMAGE_BYTES_FAIL");
              (new App\Modules\Landing\Actions\LandingAssetLibrary())->archive((int)$owner,$asset["id"]);
              if(!is_file($root."/versions/1/media/hero.png"))throw new RuntimeException("R93_SQL_ARCHIVE_REMOVED_IMMUTABLE_IMAGE");
              echo "P08_R93_".strtoupper(getenv("R93_ENGINE"))."_SQL_SCHEMA_OWNER_CPS_IMAGE_REVISION=PASS\n";
            } finally { @unlink($tmp); }
          '
      - name: Always clean private source and disposable credentials
        if: always()
        run: |
          rm -rf private-p08-r93
          rm -f "$RUNNER_TEMP/p08-r93-sql-composer.log"
