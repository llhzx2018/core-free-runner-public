name: P01 Round 2 Nine Entry PR Gate

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p01-round2-nine-entry-pr-gate-20260905.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_REF: feature/p01-nine-entry-query-foundation-20260905
      BASE_SHA: e32c6487b00105992689ecca0b078a64fa91ae7e
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Exact source and boundary
        shell: bash
        run: |
          set -euo pipefail
          cd product
          echo "TESTED_SHA=$(git rev-parse HEAD)"
          test "$(cat VERSION)" = "2.46.0"
          changed="$(git diff --name-only "${BASE_SHA}..HEAD")"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(VERSION|src/VERSION\.txt|src/migrations/|src/app/bootstrap\.php)$'; then exit 1; fi
      - name: PHP syntax and focused contracts
        shell: bash
        run: |
          set -euo pipefail
          cd product
          for file in src/app/WorkspaceViewCatalog.php src/app/FunctionalWorkspaceCore.php src/app/FunctionalWorkspaceShell.php src/app/FunctionalWorkspace.php src/app/SurfaceShell.php src/app/ResourceSearch.php src/surface.php src/books.php src/courses.php src/tools.php src/software.php tests/unit/workspace_view_catalog_contract.php tests/unit/workspace_nine_entry_source_contract.php tests/unit/resource_search_contract.php; do php -l "$file"; done
          php tests/unit/workspace_view_catalog_contract.php
          php tests/unit/workspace_nine_entry_source_contract.php
          php tests/unit/resource_search_contract.php
          php tests/unit/quick_open_global_contract.php
