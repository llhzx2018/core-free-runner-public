name: S01 exact Theme channel contract
on:
  push:
    branches: [task/s01-article-polish191-channel-20261025]
    paths: ['.github/workflows/s01-article-polish191-20261025-channel.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.191
  TARGET_SHA: 427eb34ef03f93887028df1865eabe2241f9ad33
  UPDATE_SHA: 0ab088ffa24faf02ad40c9d17be63638292deb8d
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: 0ab088ffa24faf02ad40c9d17be63638292deb8d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: source
      - name: Channel identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-article-polish191-20261025/channel-spec.json --input control/.github/workflows/s01-article-polish191-20261025-channel.yml
      - name: Exact changed manifest and native protocol tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          test "$(git -C source diff --name-only 84355d14967515a0e893186c0ce3afcb7805491e 0ab088ffa24faf02ad40c9d17be63638292deb8d)" = projects/S01-C01.json
          git -C source diff --exit-code 84355d14967515a0e893186c0ce3afcb7805491e 0ab088ffa24faf02ad40c9d17be63638292deb8d -- projects/S01-C03.json
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PYCHANNEL'
          import json,os
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']==os.environ['TARGET_VERSION']
          assert m['asset_sha256']=='97f3a8186bd4d69bb16cd882586c42933a7dfd92c722ae8e2afd84e1b821ac22' and m['asset_bytes']==1997062
          assert m['runtime_files']==476 and '1.35.190' in m['from_versions']
          assert m['release_tag']=='v'+os.environ['TARGET_VERSION']
          print('EXACT_CHANNEL_CONTRACT_PASS')
          PYCHANNEL
      - name: Cleanup
        if: always()
        run: rm -rf source
