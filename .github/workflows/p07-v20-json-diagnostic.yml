name: P07 V20 RC2 JSON Diagnostic

on:
  push:
    branches: [experiment/p07-vps-audit-v20]
    paths:
      - '.github/workflows/p07-v20-json-diagnostic.yml'
      - '.github/scripts/p07_patch_v20_rc1.py'
      - '.github/scripts/p07_patch_v20_rc1_fixup.py'
      - '.github/scripts/p07_patch_v20_rc2.py'
      - 'experiments/p07-bench.sh'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/p07-vps-audit-v20
      - name: Build RC2
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/p07_patch_v20_rc1.py
          python3 .github/scripts/p07_patch_v20_rc1_fixup.py
          python3 .github/scripts/p07_patch_v20_rc2.py
          chmod +x experiments/p07-bench.sh
          bash -n experiments/p07-bench.sh
      - name: Generate demo JSON and print contract
        shell: bash
        run: |
          set -euo pipefail
          NO_COLOR=1 P07_BENCH_FORCE_FALLBACK=1 experiments/p07-bench.sh --demo >/tmp/p07-demo.txt
          report=""
          for d in "$HOME/.local/state/p07-bench/reports" /var/lib/p07-bench/reports; do
            if [[ -d "$d" ]]; then
              x="$(find "$d" -maxdepth 1 -type f -name 'p07-bench_*.json' 2>/dev/null | sort | tail -n1 || true)"
              [[ -n "$x" ]] && report="$x"
            fi
          done
          test -n "$report"
          python3 - "$report" <<'PY'
          import json,sys
          p=sys.argv[1]
          d=json.load(open(p,encoding='utf-8'))
          print('schema_version=',repr(d.get('schema_version')))
          v=d.get('vps_audit_v20',{})
          print('top_keys=',sorted(v))
          print('cpu=',v.get('cpu'))
          print('disk=',v.get('disk'))
          print('stability=',v.get('stability'))
          print('network_quality=',v.get('network_quality'))
          print('resource_constraints=',v.get('resource_constraints'))
          print('mainland_inbound_probe=',repr(v.get('mainland_inbound_probe')))
          print('verdict=',v.get('verdict'))
          checks=[]
          checks.append(('schema', d.get('schema_version')==4))
          checks.append(('bench_state', v.get('cpu',{}).get('bench_state')=='PASS'))
          checks.append(('cpu_single', float(v.get('cpu',{}).get('sha256_single_mb_s',0))>0))
          checks.append(('cpu_multi', float(v.get('cpu',{}).get('sha256_multi_mb_s',0))>0))
          checks.append(('load_steal', 'load_steal_percent' in v.get('cpu',{})))
          checks.append(('disk_iops', float(v.get('disk',{}).get('sync_4k_iops',0))>0))
          checks.append(('icmp_state', v.get('stability',{}).get('icmp_state') in {'PASS','ICMP_BLOCKED','NOT_RUN'}))
          nq=v.get('network_quality',{})
          for k in ('global_median_upload_mbps','global_median_download_mbps','sea_median_upload_mbps','sea_median_download_mbps'):
              try: ok=float(nq.get(k,0))>0
              except Exception: ok=False
              checks.append((k,ok))
          checks.append(('resource_state', v.get('resource_constraints',{}).get('state') in {'NORMAL','PARTIAL','LIMITED','UNKNOWN'}))
          checks.append(('mainland', v.get('mainland_inbound_probe')=='NOT_RUN'))
          checks.append(('grade', v.get('verdict',{}).get('grade') in {'GOOD','FAIR','CAUTION','POOR'}))
          checks.append(('score', isinstance(v.get('verdict',{}).get('score'),int) and 0<=v['verdict']['score']<=100))
          checks.append(('completeness', isinstance(v.get('verdict',{}).get('evidence_completeness_percent'),int) and 0<=v['verdict']['evidence_completeness_percent']<=100))
          print('CHECKS')
          bad=[]
          for name,ok in checks:
              print(name, 'PASS' if ok else 'FAIL')
              if not ok: bad.append(name)
          if bad:
              raise SystemExit('FAILED_FIELDS=' + ','.join(bad))
          print('JSON_DIAGNOSTIC=PASS')
          PY
