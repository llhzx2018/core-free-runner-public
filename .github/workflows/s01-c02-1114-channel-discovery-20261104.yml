name: S01 Ops 1.21.1114 exact channel and native update
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/s01-c02-1114-channel-discovery-20261104.yml]
permissions:
  contents: read
jobs:
  channel-premerge:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: e4bb4e70de714895d213e510adfd46df8f330644
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: channel
          persist-credentials: false
      - name: Check exact channel proposal, original manifest contract and PHP update core
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C channel rev-parse HEAD)" = e4bb4e70de714895d213e510adfd46df8f330644
          (cd channel && python3 scripts/check_manifest_contract.py)
          (cd channel && find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null)
          (cd channel && php update-core/php/tests/run.php)
          echo S01_C02_1114_CHANNEL_SOURCE_CONTRACT_PASS
      - name: Independently compare formal GitHub asset, published digest and proposed channel
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          mkdir -p "$RUNNER_TEMP/ops-release"
          gh release download v1.21.1114 -R llhzx2018/vf-tools-ops -p vf-tools-ops_V1.21.1114.zip -D "$RUNNER_TEMP/ops-release"
          gh api repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.1114 --jq '{tag_name,draft,prerelease,published_at,assets:[.assets[]|{name,size,digest}]}' > "$RUNNER_TEMP/release.json"
          python3 - <<'PY'
          import json,os,pathlib,hashlib,zipfile
          m=json.loads(pathlib.Path('channel/projects/S01-C02.json').read_text())
          r=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'release.json').read_text())
          asset=pathlib.Path(os.environ['RUNNER_TEMP'],'ops-release','vf-tools-ops_V1.21.1114.zip')
          b=asset.read_bytes()
          assert m['target_version']=='1.21.1114' and m['release_tag']==r['tag_name']=='v1.21.1114'
          assert m['asset_name']==asset.name and m['plugin_file']=='vf-ops/vf-ops.php'
          assert m['schema_from']==m['schema_to']=='6.0.0'
          assert '1.21.1113' in m['from_versions']
          assert not r['draft'] and not r['prerelease']
          a=[x for x in r['assets'] if x['name']==asset.name]
          assert len(a)==1 and a[0]['size']==m['asset_bytes']==len(b)==3583672
          digest=hashlib.sha256(b).hexdigest()
          assert digest==m['asset_sha256']=='07accbb20cb23fae08d308f23be729a62daadc6d252c3a4ff213d550030e49a3'
          assert a[0]['digest']=='sha256:'+digest
          with zipfile.ZipFile(asset) as z:
           assert z.testzip() is None
           names=z.namelist()
           assert len(names)==m['runtime_files']==m['runtime_file_count']==990
           assert 'vf-ops/vf-ops.php' in names and 'vf-ops/plugin-manifest.json' not in names
           assert b'Version: 1.21.1114' in z.read('vf-ops/vf-ops.php')
          print('S01_C02_1114_OFFICIAL_ASSET_AND_CHANNEL_PREMERGE=PASS')
          PY
      - name: Erase transient private manifest and formal ZIP
        if: always()
        run: rm -rf channel "$RUNNER_TEMP/ops-release" "$RUNNER_TEMP/release.json"
  published-wordpress-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_DATABASE: vf_ops_discovery
          MARIADB_USER: vf
          MARIADB_PASSWORD: vf
          MARIADB_ROOT_PASSWORD: fixture-only-root
        ports: ['3306:3306']
        options: >-
          --health-cmd "mariadb-admin ping -h 127.0.0.1 -uroot -pfixture-only-root"
          --health-interval 10s --health-timeout 5s --health-retries 20
    env:
      SOURCE_VERSION: '1.21.1113'
      TARGET_VERSION: '1.21.1114'
      CHANNEL_SHA: 7e968e869b0aa522d04968c71fa4c1aac28d8093
      EXPECTED_BYTES: '3583672'
      EXPECTED_SHA: 07accbb20cb23fae08d308f23be729a62daadc6d252c3a4ff213d550030e49a3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 10c7f2fc1e92d37c8e71bb9633cddd4f59c1cd63
          persist-credentials: false
          path: runner
      - name: Prepare real isolated WordPress and MariaDB
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f runner/lanes/s01-c02-1211094/published-native.sh
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mariadb-client php8.3-mysql php8.3-zip php8.3-xml php8.3-mbstring php8.3-curl unzip curl >/dev/null
          curl -fsSLo /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          sudo install -m 0755 /tmp/wp-cli.phar /usr/local/bin/wp
          mysql --protocol=tcp -h127.0.0.1 -uvf -pvf -e 'SELECT 1' vf_ops_discovery
          bash -n runner/lanes/s01-c02-1211094/published-native.sh
          echo S01_C02_1114_NATIVE_SANDBOX_PREFLIGHT_PASS
      - name: True live online channel and WordPress native offer and real updater
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          bash runner/lanes/s01-c02-1211094/published-native.sh
      - name: Check exact old to new offer, activation and user-data persistence
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('proof-native/FINAL_DISCOVERY.json')
          assert p.is_file(), 'missing WordPress real-evidence receipt'
          d=json.loads(p.read_text())
          assert d['result']=='PASS' and d['component_id']=='S01-C02'
          assert d['source_version']=='1.21.1113' and d['target_version']=='1.21.1114'
          assert d['channel_main_sha']=='7e968e869b0aa522d04968c71fa4c1aac28d8093'
          assert d['formal_asset_sha256']=='07accbb20cb23fae08d308f23be729a62daadc6d252c3a4ff213d550030e49a3'
          for f in ('native_manual_check','wp_update_plugins_offer','real_release_asset_upgrade','business_preservation','post_update_activation_and_authority'):
           assert d[f]=='PASS',f
          assert d['production']=='UNCHANGED'
          print('S01_C02_1114_LIVE_NATIVE_WORDPRESS_UPDATE_AND_PRESERVATION=PASS')
          PY
      - name: Remove all transient project bytes and synthetic data
        if: always()
        shell: bash
        run: rm -rf runner proof-native "$RUNNER_TEMP/s01-c02-published-native" /tmp/wp-cli.phar
