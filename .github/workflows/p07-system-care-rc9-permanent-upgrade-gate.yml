name: P07 System Care RC9 Permanent Upgrade Gate

on:
  push:
    branches: [gate/p07-system-care-rc9-permanent-upgrade-20260908]
    paths:
      - '.github/workflows/p07-system-care-rc9-permanent-upgrade-gate.yml'

permissions:
  contents: read

jobs:
  permanent-fresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Verify raw-main Toolbox and package identity
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/p07-toolbox.sh -o /tmp/p07-toolbox.sh
          curl -fsSL --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/p07-system-care.sh -o /tmp/p07-system-care.sh
          bash -n /tmp/p07-toolbox.sh
          bash -n /tmp/p07-system-care.sh
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc9"' /tmp/p07-toolbox.sh
          grep -Fq "VERSION='0.1.0-rc9'" /tmp/p07-system-care.sh
          grep -Fq "MANIFEST_BLOB='a6f75e96cf9b6971b6a431309f72f629ef6ed931'" /tmp/p07-system-care.sh
          curl -fsSL --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/packages/p07-system-care/0.1.0-rc9/MANIFEST.gitblob -o /tmp/MANIFEST.gitblob
          bytes="$(wc -c < /tmp/MANIFEST.gitblob | tr -d '[:space:]')"
          actual="$( { printf 'blob %s\0' "$bytes"; cat /tmp/MANIFEST.gitblob; } | sha1sum | awk '{print $1}')"
          test "$actual" = a6f75e96cf9b6971b6a431309f72f629ef6ed931
          test "$(wc -l < /tmp/MANIFEST.gitblob | tr -d '[:space:]')" = 15
          echo P07_RC9_PERMANENT_RAW_MAIN_IDENTITY=PASS

      - name: Fresh install current RC9
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo bash /tmp/p07-system-care.sh status >/tmp/fresh-status.txt
          test "$(NO_COLOR=1 /usr/local/bin/vf-system-care --version | awk '{print $NF}')" = 0.1.0-rc9
          grep -Fq '服务器      %b需检查%b · 按 1 查看' /opt/vf-system-care/vf-system-care.sh
          grep -Fq 'SELECT domain_name, user FROM "site"' /opt/vf-system-care/lib/intrusion_scan.py
          echo P07_RC9_PERMANENT_FRESH_INSTALL=PASS

      - name: Prove installed RC9 CloudPanel-aware baseline path
        shell: bash
        run: |
          set -Eeuo pipefail
          tmp=/tmp/p07-rc9-live-package-fixture
          home="$tmp/home"; nginx="$tmp/nginx"; db="$tmp/cloudpanel.sq3"; state="$tmp/state"; systemd="$tmp/systemd"; cron="$tmp/cron/p07"
          mkdir -p "$home/alice/htdocs/example.com/wp-content/uploads" "$home/bob/htdocs/stale.example" "$nginx" "$systemd" "$(dirname "$cron")"
          printf '%s\n' '<?php define("DB_NAME","fixture");' > "$home/alice/htdocs/example.com/wp-config.php"
          printf '%s\n' '<?php echo "ok";' > "$home/alice/htdocs/example.com/index.php"
          ln -s /etc/passwd "$home/bob/htdocs/stale.example/wp-config.php"
          python3 -c "import sqlite3; c=sqlite3.connect('$db'); c.execute('CREATE TABLE site (id INTEGER PRIMARY KEY, domain_name TEXT, user TEXT)'); c.execute('INSERT INTO site(domain_name,user) VALUES (?,?)',('example.com','alice')); c.commit(); c.close()"
          printf '1\n' | sudo script -qec "env NO_COLOR=1 P07_IE_STATE_DIR='$state' P07_IE_DISCOVERY_HOME='$home' P07_IE_CLOUDPANEL_DB='$db' P07_IE_NGINX_SITES_DIR='$nginx' P07_IE_SYSTEMD_DIR='$systemd' P07_IE_CRON_FILE='$cron' P07_IE_ENTRY=/bin/true /usr/local/bin/vf-system-care evidence enable" /dev/null > /tmp/rc9-enable.txt 2>&1
          grep -Fq '网站安全保护已开启' /tmp/rc9-enable.txt
          sudo test -f "$state/baseline.json"
          sudo python3 -c "import json; d=json.load(open('$state/baseline.json')); assert list(d['sites']) == ['$home/alice/htdocs/example.com'], d['sites']"
          sudo env NO_COLOR=1 P07_IE_STATE_DIR="$state" P07_IE_DISCOVERY_HOME="$home" P07_IE_CLOUDPANEL_DB="$db" P07_IE_NGINX_SITES_DIR="$nginx" P07_IE_SYSTEMD_DIR="$systemd" P07_IE_CRON_FILE="$cron" P07_IE_ENTRY=/bin/true /usr/local/bin/vf-system-care evidence status > /tmp/rc9-evidence-status.txt
          grep -Fq '网站安全   正常' /tmp/rc9-evidence-status.txt
          grep -Fq '自动检查   已开启' /tmp/rc9-evidence-status.txt
          echo P07_RC9_INSTALLED_CLOUDPANEL_BASELINE=PASS

  failed-baseline-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install historical RC8
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/099a6207767b3bd110f3a3d3b32cbffdd9e96f50/installers/p07-system-care.sh -o /tmp/p07-system-care-rc8.sh
          grep -Fq "VERSION='0.1.0-rc8'" /tmp/p07-system-care-rc8.sh
          sudo bash /tmp/p07-system-care-rc8.sh status >/dev/null
          test "$(NO_COLOR=1 /usr/local/bin/vf-system-care --version | awk '{print $NF}')" = 0.1.0-rc8
          echo P07_RC9_FAILED_BASELINE_START_RC8=PASS

      - name: Reproduce RC8 failed-baseline residue
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo rm -rf /var/lib/vf-system-care/intrusion-evidence
          mkdir -p /tmp/empty-home
          set +e
          sudo env P07_IE_DISCOVERY_HOME=/tmp/empty-home python3 /opt/vf-system-care/lib/intrusion_evidence.py --state-dir /var/lib/vf-system-care/intrusion-evidence baseline >/tmp/rc8-fail.out 2>/tmp/rc8-fail.err
          rc=$?
          set -e
          test "$rc" = 20
          grep -Fq 'P07_IE_ERROR=ValueError' /tmp/rc8-fail.err
          sudo test -f /var/lib/vf-system-care/intrusion-evidence/.lock
          sudo test ! -e /var/lib/vf-system-care/intrusion-evidence/baseline.json
          sudo test ! -e /var/lib/vf-system-care/intrusion-evidence/scan_state.json
          sudo test ! -e /etc/systemd/system/vf-system-care-intrusion-evidence.service
          sudo test ! -e /etc/systemd/system/vf-system-care-intrusion-evidence.timer
          echo P07_RC9_RC8_FAILED_BASELINE_RESIDUE=PASS

      - name: Upgrade failed-baseline RC8 state through permanent RC9
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/p07-system-care.sh -o /tmp/p07-system-care-rc9.sh
          sudo bash /tmp/p07-system-care-rc9.sh status >/tmp/rc9-after-failed.txt
          test "$(NO_COLOR=1 /usr/local/bin/vf-system-care --version | awk '{print $NF}')" = 0.1.0-rc9
          sudo test -f /var/lib/vf-system-care/intrusion-evidence/.lock
          sudo test ! -e /var/lib/vf-system-care/intrusion-evidence/baseline.json
          sudo test ! -e /var/lib/vf-system-care/intrusion-evidence/scan_state.json
          sudo NO_COLOR=1 /usr/local/bin/vf-system-care evidence status > /tmp/rc9-evidence.txt
          grep -Fq '网站安全   未开启' /tmp/rc9-evidence.txt
          sudo test ! -e /etc/systemd/system/vf-system-care-intrusion-evidence.service
          sudo test ! -e /etc/systemd/system/vf-system-care-intrusion-evidence.timer
          sudo grep -Fq 'STATUS=NOT_ENABLED' /tmp/p07-system-care-intrusion-0.cache
          sudo grep -Fq 'SCHEDULER=none' /tmp/p07-system-care-intrusion-0.cache
          echo P07_RC9_FAILED_BASELINE_UPGRADE_SAFE=PASS

  valid-state-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install RC8 and create valid evidence state
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/099a6207767b3bd110f3a3d3b32cbffdd9e96f50/installers/p07-system-care.sh -o /tmp/p07-system-care-rc8.sh
          sudo bash /tmp/p07-system-care-rc8.sh status >/dev/null
          site=/tmp/rc8-valid-site
          mkdir -p "$site/wp-content/uploads"
          printf '%s\n' '<?php define("DB_NAME","fixture");' > "$site/wp-config.php"
          printf '%s\n' '<?php echo "ok";' > "$site/index.php"
          sudo python3 /opt/vf-system-care/lib/intrusion_evidence.py --state-dir /var/lib/vf-system-care/intrusion-evidence baseline --site-root "$site" >/dev/null
          printf '%s\n' '[Unit]' 'Description=P07 upgrade fixture' | sudo tee /etc/systemd/system/vf-system-care-intrusion-evidence.service >/dev/null
          printf '%s\n' '[Timer]' 'OnCalendar=daily' | sudo tee /etc/systemd/system/vf-system-care-intrusion-evidence.timer >/dev/null
          sudo sha256sum /var/lib/vf-system-care/intrusion-evidence/baseline.json /var/lib/vf-system-care/intrusion-evidence/scan_state.json /etc/systemd/system/vf-system-care-intrusion-evidence.service /etc/systemd/system/vf-system-care-intrusion-evidence.timer | sudo tee /tmp/rc8-before.sha256 >/dev/null
          echo P07_RC9_VALID_STATE_START_RC8=PASS

      - name: Upgrade RC8 valid state to current RC9 without rewriting it
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/p07-system-care.sh -o /tmp/p07-system-care-rc9.sh
          sudo bash /tmp/p07-system-care-rc9.sh status >/dev/null
          test "$(NO_COLOR=1 /usr/local/bin/vf-system-care --version | awk '{print $NF}')" = 0.1.0-rc9
          sudo sha256sum -c /tmp/rc8-before.sha256
          test "$(sudo stat -c '%a' /var/lib/vf-system-care/intrusion-evidence)" = 700
          test "$(sudo stat -c '%a' /var/lib/vf-system-care/intrusion-evidence/baseline.json)" = 600
          test "$(sudo stat -c '%a' /var/lib/vf-system-care/intrusion-evidence/scan_state.json)" = 600
          echo P07_RC9_VALID_EVIDENCE_STATE_PRESERVED=PASS
          echo P07_RC9_SCHEDULER_BYTES_PRESERVED=PASS

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          sudo rm -f /etc/systemd/system/vf-system-care-intrusion-evidence.service /etc/systemd/system/vf-system-care-intrusion-evidence.timer
          sudo rm -rf /var/lib/vf-system-care/intrusion-evidence /tmp/rc8-valid-site

  final:
    needs: [permanent-fresh, failed-baseline-upgrade, valid-state-upgrade]
    runs-on: ubuntu-24.04
    steps:
      - run: echo P07_SYSTEM_CARE_RC9_PERMANENT_AND_UPGRADE_GATE=PASS
