name: P01 V2.21.22 PHP80 Diagnostic

on:
  pull_request:
    paths:
      - 'requests/p01-v22122-php80-diag-*.txt'

permissions:
  contents: read

jobs:
  diagnose:
    if: startsWith(github.head_ref, 'agent/p01-v22122-php80-diag-')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      CANDIDATE_BRANCH: maintenance/admin-consolidation-2.21.22-20260820
      CANDIDATE: 84ed48f5208f23e63e4e92c98695d53af6f278a7
      CANDIDATE_TREE: 49bc9b9d040f17fdbb370a9167e3e75cf38b8b4f
      SOURCE_TAG: v2.21.21
      SOURCE_COMMIT: 0b62c96b787e03b0dda6ef8493d29755b6baf83e
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Clone exact sources
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone -q --depth 1 --branch "$CANDIDATE_BRANCH" "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" candidate
          git clone -q --depth 1 --branch "$SOURCE_TAG" "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" production
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE"
          test "$(git -C production rev-parse HEAD)" = "$SOURCE_COMMIT"
      - name: Build exact repair
        run: |
          set -Eeuo pipefail
          git clone -q --depth 1 --branch agent/p01-22121-formal-artifact-gate-20260819 https://github.com/llhzx2018/core-free-runner-public.git runner-old
          mkdir -p runner/scripts /tmp/p01-v22122-diag
          cp runner-old/scripts/p01-build-release.py runner/scripts/
          cp runner-old/scripts/p01-build-release-v2.py runner/scripts/
          cp runner-old/scripts/p01-build-maintenance-candidate-22121.py runner/scripts/p01-build-maintenance-candidate-22122.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('runner/scripts/p01-build-maintenance-candidate-22122.py');s=p.read_text()
          s=s.replace("VERSION = '2.21.21'","VERSION = '2.21.22'",1).replace("SOURCE_VERSION = '2.21.20'","SOURCE_VERSION = '2.21.21'",1)
          rep="""EXPECTED_ADDED = {
              'assets/admin-consolidation.css',
              'assets/admin-consolidation.js',
              'assets/favorite-affordance.css',
          }
          EXPECTED_RUNTIME_DELTA = {
              'VERSION.txt','app/AdminShell.php','app/bootstrap.php',
              'assets/admin-consolidation.css','assets/admin-consolidation.js','assets/favorite-affordance.css',
              'data-safety.php','index.php','links-admin.php','settings.php',
          }
          """
          s,n=re.subn(r"EXPECTED_ADDED = \{.*?\n\}\nEXPECTED_RUNTIME_DELTA = \{.*?\n\}\n",rep,s,count=1,flags=re.S)
          assert n==1
          p.write_text(s)
          PY
          python3 runner/scripts/p01-build-maintenance-candidate-22122.py --candidate candidate/src --production production/src --out /tmp/p01-v22122-diag --candidate-commit "$CANDIDATE" --candidate-tree "$CANDIDATE_TREE" --production-commit "$SOURCE_COMMIT"
      - name: PHP 8.0 parse diagnostic
        shell: bash
        run: |
          set +e
          docker run --rm -v /tmp/p01-v22122-diag:/work:ro -w /work php:8.0-cli php -l repair-v2.21.22.php 2>&1 | tee /tmp/php80-lint.txt
          rc=${PIPESTATUS[0]}
          echo "PHP80_LINT_RC=$rc"
          exit 0
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: p01-v22122-php80-diagnostic-${{ github.run_id }}
          path: |
            /tmp/php80-lint.txt
            /tmp/p01-v22122-diag/repair-v2.21.22.php
            /tmp/p01-v22122-diag/SHA256SUMS.txt
