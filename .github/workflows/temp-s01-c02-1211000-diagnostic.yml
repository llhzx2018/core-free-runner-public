name: S01-C02 V1.21.1000 Diagnostic Gate

on:
  push:
    branches:
      - release/s01-c02-1211000-diag
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REPOSITORY: llhzx2018/vf-tools-ops
  TARGET_SHA: c8c788f6ebf88d666ff5a3de41ce600f902e87ee
  BASE_SHA: 9e5018c47c9298c21581de49ca51925d098273c9
  TARGET_VERSION: 1.21.1000

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Exact diagnostic proof
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n' < target/VERSION)" = "$TARGET_VERSION"
          git -C target diff --name-only "$BASE_SHA..$TARGET_SHA" | tee evidence/changed-files.txt
          php -l target/includes/seo-data/keyword-authority-closure-service.php
          php target/tests/s01-c02-121999-technical-gate-state-contract.php
          php target/tests/s01-c02-121998-technical-production-polish-contract.php
          php target/tests/s01-c02-121934-shell-header-visual-lock-r45-contract.php
          python3 - <<'PY' | tee evidence/diagnostic.json
          import json,re
          from pathlib import Path
          src=Path('target/includes/seo-data/keyword-authority-closure-service.php').read_text()
          changed=set(Path('evidence/changed-files.txt').read_text().splitlines())
          allowed={'CHANGELOG.md','VERSION','vf-ops.php','includes/seo-data/keyword-authority-closure-service.php'}
          false_positive_fixed=(
              "status === 'GATE_BLOCKED' && (" in src
              and "routeKey === 'seo_technical'" in src
              and "workspace === 'technical'" in src
              and re.search(r"GATE_BLOCKED'\s*&&\s*\([^\n]+seo_technical[^\n]+technical[^\n]+\)\)\s*\{\s*return;",src) is not None
          )
          true_positive_preserved=(
              "if ($status === 'GATE_BLOCKED')" in src
              and "notice notice-error vf-s01-seo-closure-notice" in src
              and "SEO Gate 已自动运行并保持阻断。" in src
          )
          result={
              'pass':changed==allowed and false_positive_fixed and true_positive_preserved,
              'changed_files':sorted(changed),
              'false_positive_fixed':false_positive_fixed,
              'true_positive_fail_closed_preserved':true_positive_preserved,
              'frozen_shell_header_menu_changed':False
          }
          print(json.dumps(result,ensure_ascii=False,indent=2))
          if not result['pass']: raise SystemExit(1)
          PY
          echo OWNER_DIRECT_DIAGNOSTIC_RELEASE_PROOF=PASS

      - name: Build deterministic candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY' | tee evidence/package.json
          import hashlib,json,re,zipfile
          from pathlib import Path
          root=Path('target')
          def keep(rel):
              p=rel.as_posix(); parts=p.split('/')
              if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in parts): return False
              if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',p,re.I): return False
              if '/' not in p: return p in {'vf-ops.php','uninstall.php'}
              return parts[0] in {'includes','assets','languages','config'}
          files={}
          for p in root.rglob('*'):
              if p.is_file() and not p.is_symlink():
                  rel=p.relative_to(root)
                  if keep(rel): files[rel.as_posix()]=p.read_bytes()
          out=Path('evidence/vf-tools-ops_V1.21.1000.zip')
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for rel,data in sorted(files.items()):
                  info=zipfile.ZipInfo('vf-ops/'+rel,(2026,10,2,0,0,0));info.compress_type=zipfile.ZIP_DEFLATED;info.external_attr=0o100644<<16;z.writestr(info,data)
          h=hashlib.sha256()
          for rel,data in sorted(files.items()):
              h.update(rel.encode());h.update(b'\0');h.update(hashlib.sha256(data).hexdigest().encode());h.update(b'\n')
          row={'version':'1.21.1000','files':len(files),'bytes':out.stat().st_size,'sha256':hashlib.sha256(out.read_bytes()).hexdigest(),'runtime_fingerprint':h.hexdigest()}
          print(json.dumps(row,indent=2))
          PY
          unzip -tq evidence/vf-tools-ops_V1.21.1000.zip
          sha256sum evidence/vf-tools-ops_V1.21.1000.zip | tee evidence/SHA256SUMS.txt

      - name: Upload evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-v1.21.1000-diagnostic
          path: evidence/
          retention-days: 30
