name: P01 public-safe portable upstream PHP runtime for private local proof
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  upstream-php:
    if: github.head_ref == 'test/p01-portable-php-sqlite-zip-runtime-20261120' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - name: Install upstream public PHP binaries and SQLite ZIP extensions
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            php8.3-cli php8.3-fpm php8.3-sqlite3 php8.3-zip php8.3-mbstring php8.3-xml php8.3-curl php8.3-mysql >/dev/null
          php8.3 -r 'if(!in_array("sqlite",PDO::getAvailableDrivers(),true)||!class_exists("ZipArchive"))exit(9);'
          echo P01_PUBLIC_THIRDPARTY_NATIVE_PHP_SQLITE_AND_ZIP=PASS
      - name: Package portable third-party binaries ONLY (no private source or Owner backups)
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-upstream-php-runtime/bin /tmp/p01-upstream-php-runtime/modules /tmp/p01-upstream-php-runtime/lib
          cp /usr/bin/php8.3 /tmp/p01-upstream-php-runtime/bin/php8.3
          cp /usr/sbin/php-fpm8.3 /tmp/p01-upstream-php-runtime/bin/php-fpm8.3
          cp -L /usr/lib/php/20230831/*.so /tmp/p01-upstream-php-runtime/modules/
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,re,shutil
          root=Path('/tmp/p01-upstream-php-runtime')
          objects=list((root/'bin').iterdir())+list((root/'modules').glob('*.so'))
          exclude={'libc.so.6','libm.so.6','libpthread.so.0','libdl.so.2',
            'librt.so.1','libresolv.so.2','ld-linux-x86-64.so.2','libgcc_s.so.1'}
          sources={}
          for obj in objects:
              s=subprocess.run(['ldd',str(obj)],capture_output=True,text=True)
              if s.returncode!=0:continue
              for line in s.stdout.splitlines():
                  if '=>' not in line: continue
                  name,right=line.split('=>',1)
                  name=name.strip()
                  path=right.strip().split(' ',1)[0]
                  if not path.startswith('/'):continue
                  if name in exclude:continue
                  sources.setdefault(name,Path(path))
          for name,path in sorted(sources.items()):
              shutil.copyfile(path,root/'lib'/name)
          print('P01_PORTABLE_PHP_PUBLIC_LINKED_LIBS='+str(len(sources)),flush=True)
          print('P01_PORTABLE_PHP_MODULES='+str(len(list((root/'modules').glob('*.so')))),flush=True)
          PY
          printf '%s\n' 'P01 PUBLIC UPSTREAM PHP BINARIES ONLY - no P01 source, no Owner data.' > /tmp/p01-upstream-php-runtime/README.txt
          chmod -R a+rX /tmp/p01-upstream-php-runtime
          du -sh /tmp/p01-upstream-php-runtime
          echo P01_PUBLIC_PORTABLE_PHP_PACKAGE_CREATED=PASS
      - name: Upload one-day public upstream runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: p01-upstream-php83-sqlite-zip-runtime
          path: /tmp/p01-upstream-php-runtime/
          retention-days: 1
