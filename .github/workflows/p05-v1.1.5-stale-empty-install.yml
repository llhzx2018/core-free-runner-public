name: P05 V1.1.5 Stale Empty Install Gate

on:
  push:
    branches:
      - gate/p05-v115-stale-empty-install-20260830
    paths:
      - '.github/workflows/p05-v1.1.5-stale-empty-install.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      P05_SHA: 37c35d7efafb78087518fb3ecc1b3dde546a9081
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Checkout exact P05 candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.P05_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Verify targeted fresh-install recovery
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$P05_SHA"
          php -r 'if (PHP_VERSION_ID < 80200 || !extension_loaded("pdo_sqlite")) exit(1);'
          php -l php/src/FreshInstallRecovery.php
          php -l php/src/setup-bootstrap.php
          bash php/tests/stale-empty-install-smoke.sh
          echo P05_V115_TARGETED_MACHINE=PASS
