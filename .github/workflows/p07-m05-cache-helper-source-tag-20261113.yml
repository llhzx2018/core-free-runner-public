name: P07-M05 新服务器初始化 · 固定恢复助手源码提交
on:
  push:
    branches: [fix/p07-m05-cache-recovery-20261113]
    paths:
      - .github/workflows/p07-m05-cache-helper-source-tag-20261113.yml
permissions:
  contents: read
jobs:
  immutable-source-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Pin exact audited standalone helper source SHA in durable Git tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN" || exit 13
          repo=llhzx2018/core-free-runner-public
          tag=p07-m05-pycache-cache-helper-v1-20261113
          sha=6d525294fdeed38f84c4848a65481407dae3840f
          if gh api "repos/$repo/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo P07_M05_HELPER_TAG_EXISTS_REFUSE_DUPLICATE; exit 13
          fi
          test "$(git hash-object installers/p07-m05-cache-recovery.py)" = ab185d13f3db07b76bd2ccc5da80263acbeffa3c
          gh api -X POST "repos/$repo/git/refs" \
            -f "ref=refs/tags/$tag" -f "sha=$sha" > /dev/null
          actual="$(gh api "repos/$repo/git/ref/tags/$tag" --jq .object.sha)"
          test "$actual" = "$sha"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            --location --retry 2 --max-time 50 \
            "https://raw.githubusercontent.com/$repo/$tag/installers/p07-m05-cache-recovery.py" \
            -o "$RUNNER_TEMP/official-helper.py"
          test "$(git hash-object "$RUNNER_TEMP/official-helper.py")" = ab185d13f3db07b76bd2ccc5da80263acbeffa3c
          test "$(git hash-object installers/p07-m05-cache-recovery.py)" = "$(git hash-object "$RUNNER_TEMP/official-helper.py")"
          rm -f "$RUNNER_TEMP/official-helper.py"
          echo P07_M05_HELPER_IMMUTABLE_COMMIT_DURABLY_TAGGED=PASS
          echo P07_M05_HELPER_PUBLIC_BYTES_EXACT=PASS
          echo P07_OWNER_PRODUCTION=NOT_TOUCHED
