name: P08 v013 official channel 607b only distribution candidate machine gate
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/p08-v013-channel-candidate.yml]
permissions:
  contents: read
jobs:
  exact-channel-source-manifest:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-v013-channel-candidate-proof-20261120' && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact P08-only core-updates distribution candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: d0b9a27be19bf5173cae4d661e3ed11c52ff8f82
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: updates
      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Exact candidate manifest and original Update Core CI tests
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(id -u)" -ne 0
          test "$(git -C updates rev-parse HEAD)" = d0b9a27be19bf5173cae4d661e3ed11c52ff8f82
          cd updates
          python3 scripts/check_manifest_contract.py > "$RUNNER_TEMP/channel-contract-output.json"
          python3 - "$RUNNER_TEMP/channel-contract-output.json" <<'PY'
          import json,sys
          from pathlib import Path
          report=json.loads(Path(sys.argv[1]).read_text())
          assert report['status']=='PASS', 'GLOBAL_MANIFEST_SCHEMA_FAILED'
          a=[x for x in report['results'] if x['path']=='projects/P08-ADOPS.json']
          assert len(a)==1 and a[0]['failures']==[], 'P08_SCHEMA_FAILED'
          print('P08_V013_ALL_CHANNELS_SCHEMA_AND_P08_LEGACY_COMPAT=PASS')
          PY
          find update-core/php -type f -name '*.php' -print0 | xargs -0 -n1 php -l > "$RUNNER_TEMP/p08-php-lint.txt"
          php update-core/php/tests/run.php
          python3 - <<'PY'
          from pathlib import Path
          import json
          j=json.loads(Path('projects/P08-ADOPS.json').read_text())
          assert j['target_version']=='0.1.13'
          assert j['release_tag']=='v0.1.13'
          assert j['release_id']==452233612
          assert j['target_sha']=='8b385fecd132a02ac79f5b67e670783e98997c3e'
          assert j['from_versions']==['0.1.12']
          assert j['source_sha']=='dac7bc1d5410c077f32e522eb5740537f618ef9d'
          assert j['source_full_manifest_sha256']=='607b3a02a20021c0747d42440497b7e9e3e0fe39040869f475ba22f9f19437e9'
          assert j['source_full_manifest_sha256']!='4df28b7a9dcfbaf4c0bec18009955fe1b0c7764ccfe94f4257ae2ca0dc3794cc'
          assert j['schema_from']==j['schema_to']=='1.1'
          assert j['production_auto_apply'] is False
          assert j['backup_required'] is True and j['rollback_supported'] is True
          assert j['signature_required'] is False
          assert j['asset_id']==770296935 and j['full_asset_id']==770296940
          assert j['asset_bytes']==8355163 and j['full_asset_bytes']==8366960
          assert j['asset_sha256']=='6982a7b44873ac825e6c252b309d8f11a9ade67e67f5b8b6467538a46ef71b2a'
          assert j['full_asset_sha256']=='f8075f065d1413c984f80ef7531242cfc894bf272e90f6d89282074f6617c1ec'
          print('P08_V013_EXACT_607B_ONLY_CHANNEL_SAFETY=PASS')
          PY
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Verify actual remote official v013 release/tag/asset IDs and immutable old v012
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          test "$(gh api repos/llhzx2018/vf-adops/git/ref/tags/v0.1.13 --jq '.object.sha')" = 8b385fecd132a02ac79f5b67e670783e98997c3e
          test "$(gh api repos/llhzx2018/vf-adops/releases/tags/v0.1.13 --jq '.id')" = 452233612
          test "$(gh api repos/llhzx2018/vf-adops/releases/tags/v0.1.13 --jq '[.draft,.prerelease] | all(. == false)')" = true
          for entry in "770296935:8355163:6982a7b44873ac825e6c252b309d8f11a9ade67e67f5b8b6467538a46ef71b2a" "770296940:8366960:f8075f065d1413c984f80ef7531242cfc894bf272e90f6d89282074f6617c1ec"; do
            IFS=: read -r id bytes digest <<< "$entry"
            test "$(gh api repos/llhzx2018/vf-adops/releases/assets/"$id" --jq .size)" = "$bytes"
            test "$(gh api repos/llhzx2018/vf-adops/releases/assets/"$id" --jq .digest)" = "sha256:$digest"
          done
          test "$(gh api repos/llhzx2018/vf-adops/git/ref/tags/v0.1.12 --jq '.object.sha')" = dac7bc1d5410c077f32e522eb5740537f618ef9d
          echo P08_V013_ACTUAL_REMOTE_GITHUB_ASSET_IDS_AND_SHA=PASS
      - name: Always remove checked-out P08 distribution and validation traces
        if: always()
        shell: bash
        run: |
          rm -rf -- updates
          rm -f -- "$RUNNER_TEMP/channel-contract-output.json" "$RUNNER_TEMP/p08-php-lint.txt"
          test ! -e updates
          echo P08_V013_CHANNEL_TEST_PRIVATE_SOURCES_CLEANED=PASS
