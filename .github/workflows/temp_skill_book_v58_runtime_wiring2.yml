name: TEMP skill-book V5.8 runtime wiring 2

on:
  pull_request:

permissions:
  contents: read

jobs:
  wire:
    runs-on: ubuntu-24.04
    env:
      GOV_REPO: llhzx2018/gov-doc
      TARGET_BRANCH: work/skill-book-v58-reader-first-rebalance
    steps:
      - name: Check capabilities
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$VF_PRIVATE_READ_TOKEN"
          test -n "$VF_RELEASE_WRITE_TOKEN"

      - name: Checkout V5.8 work branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.GOV_REPO }}
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: gov

      - name: Patch runtime identity and V5.8 gates
        working-directory: gov
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('skills/skill-book/V5.8/scripts/runtime_acceptance_audit.py')
          s=p.read_text(encoding='utf-8')
          old="AUTH=ROOT/'runtime_authority_fidelity_audit.py'\nRUNTIME_CONTRACT_ID='SB57-RUNTIME-CONTRACT-8ADCAF17'\nEXPECTED_SKILL_VERSION='5.7'"
          new="AUTH=ROOT/'runtime_authority_fidelity_audit.py'\nSUBSTANCE=ROOT/'full_book_substance_audit.py'\nCONTREAD=ROOT/'continuous_reading_audit.py'\nPACKAGING=ROOT/'reader_facing_packaging_audit.py'\nRUNTIME_CONTRACT_ID='SB58-RUNTIME-CONTRACT-BF41D2E7'\nEXPECTED_SKILL_VERSION='5.8'"
          assert old in s
          s=s.replace(old,new,1)
          a=s.index('REQUIRED_RECEIPT_EVIDENCE=('); b=s.index('\n\ndef read_json',a)
          receipt="""REQUIRED_RECEIPT_EVIDENCE=(
           'evidence/reader_transformation_contract.json','evidence/baseline_applicability_pre_draft.json',
           'evidence/full_book_substance_contract.json','evidence/full_book_substance_audit.json','evidence/continuous_reading_audit.json',
           'evidence/training_feedback_pre_freeze.json','evidence/operational_closure_pre_freeze.json','evidence/reader_facing_packaging_audit.json',
           'evidence/freeze_record.json','evidence/freeze_integrity_audit.json','evidence/reader_transfer_contract.json',
           'evidence/runtime_authority_status.json','evidence/runtime_acceptance_audit.json')"""
          s=s[:a]+receipt+s[b:]
          needle="    runtime_authority_status=root/'evidence'/'runtime_authority_status.json'\n    if not runtime_authority_status.exists(): blocks.append('RUNTIME_AUTHORITY_STATUS_EVIDENCE_MISSING')"
          add="""    runtime_authority_status=root/'evidence'/'runtime_authority_status.json'
    if not runtime_authority_status.exists(): blocks.append('RUNTIME_AUTHORITY_STATUS_EVIDENCE_MISSING')
    substance_contract=root/'evidence'/'full_book_substance_contract.json'
    substance_audit=root/'evidence'/'full_book_substance_audit.json'
    continuous_audit=root/'evidence'/'continuous_reading_audit.json'
    packaging_audit=root/'evidence'/'reader_facing_packaging_audit.json'
    for path,block in ((substance_contract,'FULL_BOOK_SUBSTANCE_CONTRACT_EVIDENCE_MISSING'),(substance_audit,'FULL_BOOK_SUBSTANCE_AUDIT_EVIDENCE_MISSING'),(continuous_audit,'CONTINUOUS_READING_AUDIT_EVIDENCE_MISSING'),(packaging_audit,'READER_FACING_PACKAGING_AUDIT_EVIDENCE_MISSING')):
        if not path.exists(): blocks.append(block)"""
          assert needle in s
          s=s.replace(needle,add,1)
          needle="        if cpa.returncode!=0 or not ausp or ausp.get('decision')!='PASS': blocks.append('RUNTIME_AUTHORITY_FIDELITY_BLOCK')\n        ao=Path(td)/'adequacy.json'"
          add="""        if cpa.returncode!=0 or not ausp or ausp.get('decision')!='PASS': blocks.append('RUNTIME_AUTHORITY_FIDELITY_BLOCK')
        fbo=Path(td)/'full_book_substance.json'
        if substance_audit.exists():
            cpfb,fbr=run_json([sys.executable,str(SUBSTANCE),'--new',str(root),'--audit',str(substance_audit),'--json',str(fbo)],fbo)
            if cpfb.returncode!=0 or not fbr or fbr.get('decision')!='PASS': blocks.append('FULL_BOOK_SUBSTANCE_EXTERNAL_REAUDIT_BLOCK')
        cro=Path(td)/'continuous_reading.json'
        if continuous_audit.exists():
            cpcr,crr=run_json([sys.executable,str(CONTREAD),'--audit',str(continuous_audit),'--json',str(cro)],cro)
            if cpcr.returncode!=0 or not crr or crr.get('decision')!='PASS': blocks.append('CONTINUOUS_READING_EXTERNAL_REAUDIT_BLOCK')
        pko=Path(td)/'reader_facing_packaging.json'
        if packaging_audit.exists():
            pk=read_json(packaging_audit) or {}
            title=str(pk.get('book_title') or mget(manifest,'BOOK_TITLE','book_title',default='') or '')
            lang=str(pk.get('language') or mget(manifest,'LANGUAGE','language',default='') or '')
            if not title or not lang:
                blocks.append('READER_FACING_PACKAGING_IDENTITY_MISSING')
            else:
                cppk,pkr=run_json([sys.executable,str(PACKAGING),'--new',str(root),'--book-title',title,'--language',lang,'--json',str(pko)],pko)
                if cppk.returncode!=0 or not pkr or pkr.get('decision')!='PASS': blocks.append('READER_FACING_PACKAGING_EXTERNAL_REAUDIT_BLOCK')
        ao=Path(td)/'adequacy.json'"""
          assert needle in s
          s=s.replace(needle,add,1)
          s=s.replace("'version':'V5.5_RUNTIME_ACCEPTANCE_AUDIT'","'version':'V5.8_RUNTIME_ACCEPTANCE_AUDIT'")
          p.write_text(s,encoding='utf-8')
          for rel in ('skills/skill-book/V5.8/tests/test_runtime_acceptance_audit.py','skills/skill-book/V5.8/tests/test_runtime_authority_fidelity_audit.py'):
              q=Path(rel);t=q.read_text(encoding='utf-8')
              t=t.replace('SB57-RUNTIME-CONTRACT-8ADCAF17','SB58-RUNTIME-CONTRACT-BF41D2E7')
              t=t.replace("'5.7'","'5.8'").replace('"5.7"','"5.8"')
              q.write_text(t,encoding='utf-8')
          PY

      - name: Add V5.8 Runtime wiring regression
        working-directory: gov
        run: |
          cat > skills/skill-book/V5.8/tests/test_v58_runtime_gate_presence.py <<'PY'
          import unittest
          from pathlib import Path
          R=Path(__file__).parents[1]
          class T(unittest.TestCase):
           def test_runtime_wiring(self):
            s=(R/'scripts/runtime_acceptance_audit.py').read_text()
            for x in ['SB58-RUNTIME-CONTRACT-BF41D2E7','full_book_substance_audit.py','continuous_reading_audit.py','reader_facing_packaging_audit.py','FULL_BOOK_SUBSTANCE_EXTERNAL_REAUDIT_BLOCK','CONTINUOUS_READING_EXTERNAL_REAUDIT_BLOCK','READER_FACING_PACKAGING_EXTERNAL_REAUDIT_BLOCK']:
             self.assertIn(x,s)
           def test_authority_identity(self):
            s=(R/'scripts/runtime_authority_fidelity_audit.py').read_text()
            self.assertIn("RID='SB58-RUNTIME-CONTRACT-BF41D2E7'",s)
            self.assertIn("VERSION='5.8'",s)
          if __name__=='__main__': unittest.main()
          PY

      - name: Compile and test
        working-directory: gov
        run: |
          set -Eeuo pipefail
          python -m compileall -q skills/skill-book/V5.8/scripts skills/skill-book/V5.8/tests
          python -m unittest discover -s skills/skill-book/V5.8/tests -p 'test*.py' -v

      - name: Commit and push only V5.8
        working-directory: gov
        env:
          VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add skills/skill-book/V5.8
          mapfile -t changed < <(git diff --cached --name-only)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -ge 3
          for f in "${changed[@]}"; do [[ "$f" == skills/skill-book/V5.8/* ]]; done
          git commit -m 'skill-book V5.8: wire reader-first runtime acceptance gates'
          git push "https://x-access-token:${VF_RELEASE_WRITE_TOKEN}@github.com/${GOV_REPO}.git" "HEAD:refs/heads/${TARGET_BRANCH}"
