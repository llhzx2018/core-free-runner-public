name: P01 Channels Header Toolbar One-shot #1578
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-channels-header-toolbar-1578.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_REPO: llhzx2018/vf-start
      EXACT_SHA: f6e69c8eec7e44c11e1d5c14b934c8856b699754
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl,mbstring,sqlite3,pdo_sqlite,SimpleXML,zip
          coverage: none
      - name: Bind exact P01 UX candidate without permanent artifact
        shell: bash
        env:
          TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$TOKEN"
          ROOT="$RUNNER_TEMP/p01-header-toolbar-r3"
          mkdir -p "$ROOT"
          chmod 700 "$ROOT"
          echo "P01_WORK=$ROOT" >> "$GITHUB_ENV"
          git clone -q --no-checkout "https://x-access-token:${TOKEN}@github.com/$SOURCE_REPO.git" "$ROOT/candidate"
          git -C "$ROOT/candidate" checkout -q --detach "$EXACT_SHA"
          git -C "$ROOT/candidate" remote set-url origin "https://github.com/$SOURCE_REPO.git"
          test "$(git -C "$ROOT/candidate" rev-parse HEAD)" = "$EXACT_SHA"
          echo P01_CHANNELS_TOOLBAR_EXACT_SOURCE=PASS
      - name: Focused PHP, UI and manual-check regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$P01_WORK/candidate"
          php -l src/app/ChannelLibraryPage.php
          php -l tests/unit/channels_owner_header_toolbar_r3_contract.php
          php tests/unit/channels_owner_header_toolbar_r3_contract.php
          php tests/unit/channels_reader_shell_r2_contract.php
          php tests/unit/channels_page_full_polish_contract.php
          php tests/unit/channel_video_feed_owner_cache_native.php
          php tests/unit/channels_owner_default_video_view_native.php
          php tests/unit/youtube_batch_server_contract_native.php
          node tests/integration/youtube_batch_sequential_node.js
          node tests/integration/channel_video_feed_layout_node.js
          echo P01_CHANNELS_HEADER_TOOLBAR_FOCUSED=PASS
      - name: Remove private bytes
        if: always()
        shell: bash
        run: |
          if [ -n "${P01_WORK:-}" ]; then rm -rf -- "$P01_WORK"; fi
          echo P01_CHANNELS_HEADER_TOOLBAR_EPHEMERAL=PASS
