name: p01-tools-header-r2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-tools-header-r2.yml'

permissions:
  contents: read

jobs:
  exact-source-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      TARGET_SHA: 6141c889b0c6a9fdb8ff3678903fd83ba314d93b
      BASE_SHA: ddae0e01334291d6995d9bb72c4a44cff744e0c4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd unzip >/dev/null
          php -m | grep -Fx pdo_sqlite
          php -m | grep -Fx sqlite3
          echo P01_TOOLS_HEADER_RUNTIME=PASS

      - name: Resolve exact private source
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" candidate
          git -C candidate fetch -q --depth 1 origin "$TARGET_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" stable
          git -C stable fetch -q --depth 1 origin "$BASE_SHA"
          git -C stable checkout -q --detach FETCH_HEAD
          test "$(git -C stable rev-parse HEAD)" = "$BASE_SHA"
          echo P01_TOOLS_HEADER_EXACT_SOURCE=PASS

      - name: Syntax and focused Tools contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          find src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          php tests/unit/tools_header_mature_r2_contract.php
          php tests/unit/tools_mature_subsite_nav_v247207_contract.php
          php tests/unit/tools_nav_alignment_v247206_contract.php
          php tests/unit/tools_subsite_ux_v247200_contract.php
          php tests/unit/tools_toolbox_manager_v247210_contract.php
          php tests/unit/tool_scene_context_consistency_contract.php
          echo P01_TOOLS_HEADER_FOCUSED=PASS

      - name: Canonical zero-debt regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          bash tests/canonical_release_regression.sh . "$GITHUB_WORKSPACE/stable" --require-zero-debt | tee /tmp/p01-tools-header-canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/p01-tools-header-canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/p01-tools-header-canonical.txt
          echo P01_TOOLS_HEADER_CANONICAL=PASS
