name: TEMP S01-C02 Ops 1.21.801 SEO Owner Action Gate

on:
  push:
    branches:
      - temp/s01-c02-v121801-owner-action-gate-20260904
    paths:
      - '.github/workflows/temp-s01-c02-v121801-owner-action-gate.yml'

permissions:
  contents: read

jobs:
  owner-action-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: vf_ops_gate
          MARIADB_USER: vf
          MARIADB_PASSWORD: vf
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      OPS_BASE_SHA: 7f7babb6a92ea297dc99e86ac632fcef22c96319
      OPS_CANDIDATE_SHA: 897d34c3153ca2a6d7cfa289cca7fd9966062f17
      OPS_CANDIDATE_TREE: df5c1d60cd944bc630b817852da5cec3e92c536d
      BASE_RELEASE_ASSET_ID: '543854527'
      BASE_RELEASE_BYTES: '3202939'
      BASE_RELEASE_SHA256: e2d96560a2bc9dfb2779e07d6754cd3fa21bbf74ad23ebbe4de3a5ec975e0510
      WP_PATH: /tmp/vf-ops-v121801-wp
      EVIDENCE_DIR: /tmp/vf-ops-v121801-evidence
      CANDIDATE_ZIP: /tmp/vf-tools-ops_V1.21.801.zip
      OWNER_ACTION: vf_ops_s01_seo_confirm_formal_primary_v121798
    steps:
      - name: Checkout exact base source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.OPS_BASE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: ops-base
      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.OPS_CANDIDATE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: ops-candidate
      - name: Verify bounded source and standalone contract
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          test "$(git -C ops-base rev-parse HEAD)" = "$OPS_BASE_SHA"
          test "$(git -C ops-candidate rev-parse HEAD)" = "$OPS_CANDIDATE_SHA"
          test "$(git -C ops-candidate rev-parse HEAD^{tree})" = "$OPS_CANDIDATE_TREE"
          test "$(tr -d '\r\n' < ops-base/VERSION)" = 1.21.800
          test "$(tr -d '\r\n' < ops-candidate/VERSION)" = 1.21.801
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os
          def files(root):
              out={}
              for p in Path(root).rglob('*'):
                  if p.is_file() and '.git' not in p.parts:
                      out[p.relative_to(root).as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
              return out
          a,b=files('ops-base'),files('ops-candidate')
          changed=sorted(k for k in set(a)|set(b) if a.get(k)!=b.get(k))
          expected=sorted(['.github/phase3/v121801-seo-owner-action-bootstrap.php','VERSION','vf-ops.php'])
          Path(os.environ['EVIDENCE_DIR']+'/changed-files.txt').write_text('\n'.join(changed)+'\n')
          assert changed==expected,(changed,expected)
          PY
          cmp ops-base/includes/site-release/s01-project-authority.runtime.json ops-candidate/includes/site-release/s01-project-authority.runtime.json
          cmp ops-base/includes/site-release/final-domain-authority.php ops-candidate/includes/site-release/final-domain-authority.php
          cmp ops-base/includes/seo-data/keyword-authority-closure-service.php ops-candidate/includes/seo-data/keyword-authority-closure-service.php
          cmp ops-base/includes/seo-data/keyword-planner-bridge-service.php ops-candidate/includes/seo-data/keyword-planner-bridge-service.php
          cmp ops-base/includes/s01/tool-workbench.php ops-candidate/includes/s01/tool-workbench.php
          cmp ops-base/includes/plugins-governance/inventory-readback-compat-v121794.php ops-candidate/includes/plugins-governance/inventory-readback-compat-v121794.php
          php -l ops-candidate/vf-ops.php
          php ops-candidate/.github/phase3/v121801-seo-owner-action-bootstrap.php | tee "$EVIDENCE_DIR/source-contract.txt"
          grep -Fxq PASS_V121801_SEO_OWNER_ACTION_BOOTSTRAP "$EVIDENCE_DIR/source-contract.txt"
          echo SOURCE_SCOPE_AND_OWNER_ACTION_CONTRACT=PASS
      - name: Download exact current Production 1.21.800 release asset
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          curl -fsSL -L --retry 3 \
            -H "Authorization: Bearer $READ_TOKEN" \
            -H 'Accept: application/octet-stream' \
            "https://api.github.com/repos/llhzx2018/vf-tools-ops/releases/assets/${BASE_RELEASE_ASSET_ID}" \
            -o /tmp/vf-tools-ops_V1.21.800.zip
          test "$(stat -c '%s' /tmp/vf-tools-ops_V1.21.800.zip)" = "$BASE_RELEASE_BYTES"
          test "$(sha256sum /tmp/vf-tools-ops_V1.21.800.zip | awk '{print $1}')" = "$BASE_RELEASE_SHA256"
          unzip -tq /tmp/vf-tools-ops_V1.21.800.zip >/dev/null
          echo EXACT_PRODUCTION_BASE_ARTIFACT=PASS
      - name: Build exact candidate runtime artifact with formal release filter
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import re, hashlib, zipfile, json, os
          from pathlib import Path
          root=Path('ops-candidate')
          files={}
          def ok(rel):
              p=rel.as_posix(); parts=p.split('/')
              if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in parts): return False
              if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',p,re.I): return False
              if '/' not in p: return p in {'vf-ops.php','uninstall.php'}
              return parts[0] in {'includes','assets','languages','config'}
          for src in root.rglob('*'):
              if src.is_file() and not src.is_symlink():
                  rel=src.relative_to(root)
                  if ok(rel): files[rel.as_posix()]=src.read_bytes()
          files=dict(sorted(files.items()))
          assert len(files)==895, len(files)
          assert 'includes/site-release/s01-project-authority.runtime.json' in files
          fp=hashlib.sha256()
          for rel,b in files.items(): fp.update((rel+'\0'+hashlib.sha256(b).hexdigest()+'\n').encode())
          zpath=Path(os.environ['CANDIDATE_ZIP'])
          with zipfile.ZipFile(zpath,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for rel,b in files.items():
                  zi=zipfile.ZipInfo('vf-ops/'+rel,(2026,9,4,0,0,0)); zi.compress_type=zipfile.ZIP_DEFLATED; zi.external_attr=0o100644<<16; z.writestr(zi,b)
          meta={'target_commit':os.environ['OPS_CANDIDATE_SHA'],'target_tree':os.environ['OPS_CANDIDATE_TREE'],'version':'1.21.801','asset_name':'vf-tools-ops_V1.21.801.zip','asset_bytes':zpath.stat().st_size,'asset_sha256':hashlib.sha256(zpath.read_bytes()).hexdigest(),'runtime_files':len(files),'runtime_fingerprint':fp.hexdigest()}
          Path(os.environ['EVIDENCE_DIR']+'/candidate-artifact.json').write_text(json.dumps(meta,indent=2)+'\n')
          print(json.dumps(meta,indent=2))
          PY
          unzip -tq "$CANDIDATE_ZIP" >/dev/null
          unzip -Z1 "$CANDIDATE_ZIP" | grep -Fxq 'vf-ops/includes/site-release/s01-project-authority.runtime.json'
          echo EXACT_PACKAGED_CANDIDATE=PASS
      - name: Install WordPress 7.1
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y php-cli php-mysql php-curl php-zip php-mbstring php-xml php-gd unzip curl jq mariadb-client rsync >/dev/null
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp
          chmod +x /tmp/wp && sudo mv /tmp/wp /usr/local/bin/wp
          mkdir -p "$WP_PATH"
          wp core download --path="$WP_PATH" --version=7.1 --force
          wp config create --path="$WP_PATH" --dbname=vf_ops_gate --dbuser=vf --dbpass=vf --dbhost=127.0.0.1:3306 --skip-check
          wp core install --path="$WP_PATH" --url=http://127.0.0.1:8080 --title='VF Gate' --admin_user=owner --admin_password='gate-only-not-production' --admin_email=owner@example.invalid --skip-email
          test "$(wp core version --path="$WP_PATH")" = 7.1
          mariadb -h127.0.0.1 -P3306 -uvf -pvf -Nse 'SELECT VERSION()' vf_ops_gate | tee "$EVIDENCE_DIR/mariadb.txt"
          grep -q '^11\.4\.' "$EVIDENCE_DIR/mariadb.txt"
      - name: Install exact packaged 1.21.800 and seed one OWNER candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/base-unzip "$WP_PATH/wp-content/plugins/vf-ops"
          mkdir -p /tmp/base-unzip "$WP_PATH/wp-content/plugins"
          unzip -q /tmp/vf-tools-ops_V1.21.800.zip -d /tmp/base-unzip
          mv /tmp/base-unzip/vf-ops "$WP_PATH/wp-content/plugins/vf-ops"
          wp plugin activate vf-ops --path="$WP_PATH"
          wp eval --path="$WP_PATH" '
            global $wpdb; $now=current_time("mysql");
            $life=vf_ops_lifecycle_apply_version_v121377("v121801-base"); if(empty($life["ok"])) exit(2);
            $post=wp_insert_post(["post_title"=>"Tools Owner Action Gate","post_content"=>str_repeat("tools owner action content ",220),"post_status"=>"publish","post_type"=>"page","post_name"=>"tools"]); if(is_wp_error($post)||$post<1) exit(3);
            update_post_meta($post,"rank_math_title","Tools Owner Action Gate"); update_post_meta($post,"rank_math_description","Tools owner action gate description"); update_post_meta($post,"rank_math_rich_snippet","article");
            $family=vf_ops_seo_table_name_v121439("page_family"); $member=vf_ops_seo_table_name_v121439("page_member"); $assign=vf_ops_seo_table_name_v121439("keyword_assignment");
            $wpdb->insert($family,["family_key"=>"tools","family_name"=>"Tools","family_type"=>"language_specific","core_task"=>"Use tools","family_status"=>"active","owner_id"=>1,"created_at"=>$now,"updated_at"=>$now]); $fid=(int)$wpdb->insert_id; if($fid<1) exit(4);
            $wpdb->insert($member,["family_id"=>$fid,"post_id"=>$post,"language"=>"en","locale"=>"en_US","url"=>home_url("/tools/"),"url_path"=>"/tools/","page_type"=>"page","user_task"=>"Use tools","primary_search_intent"=>"transactional","primary_keyword"=>"","content_status"=>"publish","member_status"=>"active","created_at"=>$now,"updated_at"=>$now]); $mid=(int)$wpdb->insert_id; if($mid<1) exit(5);
            $assignment=wp_generate_uuid4();
            $wpdb->insert($assign,["assignment_id"=>$assignment,"research_job_id"=>0,"keyword"=>"owner action gate keyword","normalized_keyword"=>"owner action gate keyword","query_language"=>"en","target_language"=>"en","locale"=>"en_US","country"=>"US","source"=>"manual_entry","source_date"=>"2026-09-04","source_reference"=>"runner fixture","cluster_id"=>"tools-owner-action","page_family_id"=>$fid,"page_member_id"=>$mid,"search_intent"=>"transactional","page_type"=>"page","target_url"=>home_url("/tools/"),"role"=>"long_tail","candidate_status"=>"accepted","confidence"=>"low","owner_id"=>1,"status"=>"active","notes"=>"isolated runner fixture","created_at"=>$now,"updated_at"=>$now]);
            update_option("vf_gate_owner_assignment",$assignment,false);
            $state=vf_ops_s01_seo_closure_run_v121798("gate_base"); echo json_encode(["installed"=>$life["state"]["installed_version"]??"","assignment"=>$assignment,"closure"=>$state["closureStatus"]??"","ownerRequired"=>!empty($state["ownerActionRequired"]),"candidates"=>(int)($state["ownerCandidateCount"]??0)]);' > "$EVIDENCE_DIR/base-state.json"
          jq -e '.installed=="1.21.800" and .closure=="OWNER_CONFIRMATION_REQUIRED" and .ownerRequired==true and .candidates==1' "$EVIDENCE_DIR/base-state.json" >/dev/null
          wp option get vf_ops_plugins --path="$WP_PATH" --format=json | jq -cS . > "$EVIDENCE_DIR/plugins-before.json"
      - name: Reproduce exact Production 1.21.800 admin-post bootstrap failure
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/base-owner-post.php <<PHP
          <?php
          define('WP_ADMIN', true);
          \$_SERVER['REQUEST_METHOD']='POST';
          \$_SERVER['HTTP_HOST']='127.0.0.1';
          \$_SERVER['REQUEST_URI']='/wp-admin/admin-post.php';
          \$_POST=['action'=>'${OWNER_ACTION}'];
          \$_REQUEST=\$_POST;
          require '${WP_PATH}/wp-load.php';
          echo 'BASE_BOOTSTRAP_SURVIVED';
          PHP
          php /tmp/base-owner-post.php > "$EVIDENCE_DIR/base-admin-post.txt" 2>&1 || true
          cat "$EVIDENCE_DIR/base-admin-post.txt"
          grep -Fq 'VF Tools Ops 未注册后台动作' "$EVIDENCE_DIR/base-admin-post.txt"
          ! grep -Fq 'BASE_BOOTSTRAP_SURVIVED' "$EVIDENCE_DIR/base-admin-post.txt"
          echo PACKAGED_1_21_800_ADMIN_POST_FAILURE_REPRODUCED=PASS
      - name: Direct upgrade exact packaged 1.21.800 to exact packaged 1.21.801
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/candidate-unzip
          mkdir -p /tmp/candidate-unzip
          unzip -q "$CANDIDATE_ZIP" -d /tmp/candidate-unzip
          rsync -a --delete /tmp/candidate-unzip/vf-ops/ "$WP_PATH/wp-content/plugins/vf-ops/"
          wp eval --path="$WP_PATH" '$l=vf_ops_lifecycle_apply_version_v121377("v121801-packaged-direct-upgrade"); echo json_encode($l); if(empty($l["ok"])) exit(6);' > "$EVIDENCE_DIR/upgrade-lifecycle.json"
          jq -e '.state.installed_version=="1.21.801" and .state.previous_version=="1.21.800"' "$EVIDENCE_DIR/upgrade-lifecycle.json" >/dev/null
      - name: Execute exact OWNER admin-post route with nonce and capability
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/candidate-owner-post.php <<PHP
          <?php
          define('WP_ADMIN', true);
          \$_SERVER['REQUEST_METHOD']='POST';
          \$_SERVER['HTTP_HOST']='127.0.0.1';
          \$_SERVER['REQUEST_URI']='/wp-admin/admin-post.php';
          \$_POST=['action'=>'${OWNER_ACTION}'];
          \$_REQUEST=\$_POST;
          require '${WP_PATH}/wp-load.php';
          wp_set_current_user(1);
          \$assignment=(string)get_option('vf_gate_owner_assignment','');
          if (\$assignment==='') { fwrite(STDERR,'ASSIGNMENT_MISSING'); exit(7); }
          \$_POST=['action'=>'${OWNER_ACTION}','assignment_id'=>\$assignment,'_wpnonce'=>wp_create_nonce('${OWNER_ACTION}')];
          \$_REQUEST=\$_POST;
          do_action('admin_post_${OWNER_ACTION}');
          echo 'HANDLER_DID_NOT_EXIT';
          PHP
          php /tmp/candidate-owner-post.php > "$EVIDENCE_DIR/candidate-admin-post.txt" 2>&1 || true
          cat "$EVIDENCE_DIR/candidate-admin-post.txt"
          ! grep -Fq 'VF Tools Ops 未注册后台动作' "$EVIDENCE_DIR/candidate-admin-post.txt"
          ! grep -Fq 'HANDLER_DID_NOT_EXIT' "$EVIDENCE_DIR/candidate-admin-post.txt"
          wp eval --path="$WP_PATH" '
            global $wpdb; $assignment=(string)get_option("vf_gate_owner_assignment",""); $assign=vf_ops_seo_table_name_v121439("keyword_assignment"); $row=$wpdb->get_row($wpdb->prepare("SELECT assignment_id,role,candidate_status,status,record_sha256 FROM {$assign} WHERE assignment_id=%s LIMIT 1",$assignment),ARRAY_A); $plan=vf_ops_seo_plan_readback(); $gate=vf_ops_seo_gate(); $pre=vf_ops_seo_publish_precheck_v121459("full"); $public=vf_ops_s01_seo_closure_public_readback_v121798(); $domain=vf_ops_s01_domain_authority_state_v121799(); echo json_encode(["row"=>$row,"plannerRows"=>count((array)($plan["keywordMap"]??[])),"plannerRevision"=>(int)($plan["revision"]??0),"gateStatus"=>strtoupper((string)($gate["status"]??"")),"gateHash"=>(string)($gate["gateHash"]??""),"preflightStatus"=>strtoupper((string)($pre["status"]??"")),"preflightCode"=>strtoupper((string)($pre["code"]??"")),"public"=>$public,"domain"=>$domain]);' > "$EVIDENCE_DIR/after-owner-post.json"
          cat "$EVIDENCE_DIR/after-owner-post.json"
          jq -e '.row.role=="primary" and .row.candidate_status=="accepted" and .row.status=="active" and (.row.record_sha256|length)==64 and .plannerRows==1 and (.gateHash|length)==64 and .preflightCode!="SEO_GATE_NOT_RUN" and .preflightCode!="SEO_GATE_STALE" and .public.pluginVersion=="1.21.801" and .public.formalPrimaryCount==1 and .public.plannerRows==1 and .public.ownerActionRequired==false and .domain.pluginVersion=="1.21.801"' "$EVIDENCE_DIR/after-owner-post.json" >/dev/null
          jq -c '.public' "$EVIDENCE_DIR/after-owner-post.json" > "$EVIDENCE_DIR/public-safe.json"
          ! grep -q 'owner action gate keyword' "$EVIDENCE_DIR/public-safe.json"
          ! grep -q '/tools/' "$EVIDENCE_DIR/public-safe.json"
          wp option get vf_ops_plugins --path="$WP_PATH" --format=json | jq -cS . > "$EVIDENCE_DIR/plugins-after.json"
          cmp "$EVIDENCE_DIR/plugins-before.json" "$EVIDENCE_DIR/plugins-after.json"
          echo PASS_V121801_EXACT_PACKAGED_OWNER_ADMIN_POST_GATE | tee "$EVIDENCE_DIR/final.txt"
      - name: Upload evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-v121801-owner-action-gate
          path: ${{ env.EVIDENCE_DIR }}/
          retention-days: 14
