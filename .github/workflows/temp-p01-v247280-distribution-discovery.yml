name: TEMP P01 V2.47.280 Distribution Discovery Proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p01-v247280-distribution-discovery.yml'

permissions:
  contents: read

jobs:
  discovery:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'proof(P01): V2.47.280 distribution discovery')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      EXPECTED_SOURCE: 2.47.279
      EXPECTED_TARGET: 2.47.280
      EXPECTED_RELEASE_ID: '406319874'
      EXPECTED_PRODUCT_IDENTITY: ba86dd9279890751b68a6d57edb508c90c153e7e
      EXPECTED_ASSET: VF_Start_V2.47.280_UPDATE.zip
      EXPECTED_ASSET_BYTES: '2361564'
      EXPECTED_ASSET_SHA256: f47e05c5ba4013542ea5a9ef998b8af49c9ae9e44baf177a7547743220fe7f2f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare runtime
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-curl jq >/dev/null
      - name: Installed-source discovery
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone -q --depth 1 --branch "v$EXPECTED_SOURCE" "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" source
          READ_TOKEN="$READ_TOKEN" php -r '
            require "source/src/app/CoreUpdates/UpdateCore.php";
            require "source/src/app/CoreUpdates/GitHubClient.php";
            $client=new \CoreUpdates\GitHubClient((string)getenv("READ_TOKEN"),"p01-v247280-discovery-proof");
            $m=$client->fetchProjectManifest("llhzx2018/core-updates","P01.json","main");
            $core=new \CoreUpdates\UpdateCore("P01","APP");
            $result=$core->check("2.47.279","2026090401",$m);
            if(($result["status"]??"")!=="AVAILABLE"||($result["target_version"]??"")!=="2.47.280") exit(12);
            if(($m["release_id"]??0)!==406319874||($m["product_identity"]??"")!=="ba86dd9279890751b68a6d57edb508c90c153e7e") exit(13);
            if(($m["asset_sha256"]??"")!=="f47e05c5ba4013542ea5a9ef998b8af49c9ae9e44baf177a7547743220fe7f2f") exit(14);
            foreach(["浏览器本地时区","默认折叠"] as $must) if(strpos((string)($m["notes"]??""),$must)===false) exit(15);
            echo "P01_UPDATER_DISCOVERY=PASS\nP01_UPDATER_STATUS=AVAILABLE\nP01_UPDATER_TARGET=2.47.280\n";
          '
      - name: Remote release readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$PRODUCT_REPO/releases/tags/v$EXPECTED_TARGET" >/tmp/release.json
          jq -e --argjson id "$EXPECTED_RELEASE_ID" --arg tag "v$EXPECTED_TARGET" '.id==$id and .tag_name==$tag and .draft==false and .prerelease==false' /tmp/release.json >/dev/null
          test "$(gh api "repos/$PRODUCT_REPO/git/ref/tags/v$EXPECTED_TARGET" --jq '.object.sha')" = "$EXPECTED_PRODUCT_IDENTITY"
          jq -e --arg n "$EXPECTED_ASSET" --argjson s "$EXPECTED_ASSET_BYTES" --arg d "sha256:$EXPECTED_ASSET_SHA256" '.assets[]|select(.name==$n)|(.size==$s and .digest==$d)' /tmp/release.json >/dev/null
          echo P01_RELEASE_IDENTITY_READBACK=PASS
          echo PRODUCTION_WRITE=NO
          echo P01_V247280_DISTRIBUTION_DISCOVERY=PASS
