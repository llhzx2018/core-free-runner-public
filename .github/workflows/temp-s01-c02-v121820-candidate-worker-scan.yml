name: TEMP S01-C02 v1.21.820 Candidate Worker Scan
on:
  push:
    branches: [temp/s01-c02-production-readback-20260904-current]
    paths: ['.github/workflows/temp-s01-c02-v121820-candidate-worker-scan.yml']
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact Ops 1.21.820
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 562827263f4d8fe93aee3ea6fb445164cfa5242a
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: ops
      - name: Locate candidate worker frontend and server stages
        shell: bash
        run: |
          set -Eeuo pipefail
          cd ops
          echo '=== FRONTEND LOCATIONS ==='
          grep -RInE --exclude-dir=.git --exclude-dir=.github 'data-vf-publish-autostart|runJobLoop|autostart|vf_ops_release_job_run|继续当前任务|release_job_run' . || true
          echo '=== SERVER RUN NEXT STAGE ==='
          grep -RInE --exclude-dir=.git --exclude-dir=.github 'run_next_stage|progress_percent|percent|stage_index|current_stage|worker_lock|acquire.*lock|release.*lock' includes | head -n 400 || true
          echo '=== ASYNC CLASS FILES ==='
          grep -RIl --exclude-dir=.git --exclude-dir=.github 'class VF_Ops_Release_Async_Job' . || true
          echo 'PASS_V121820_CANDIDATE_WORKER_SOURCE_SCAN'
