name: TEMP S01-C02 1.21.926 Distribution Proof

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  exact-distribution-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UPDATES_SHA: ab80c5ca7c521c1554219041f5db1e335d43734f
      PRODUCT_REPO: llhzx2018/vf-tools-ops
      TAG: v1.21.926
      ASSET: vf-tools-ops_V1.21.926.zip

    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ab80c5ca7c521c1554219041f5db1e335d43734f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: updates
          persist-credentials: false

      - name: Assert exact manifest identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C updates rev-parse HEAD)" = "$UPDATES_SHA"
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("updates/projects/S01-C02.json").read_text())
          assert m["target_version"]=="1.21.926"
          assert m["release_tag"]=="v1.21.926"
          assert m["asset_name"]=="vf-tools-ops_V1.21.926.zip"
          assert m["asset_bytes"]==3474964
          assert m["asset_sha256"]=="ee59514e63f84b3f4cbd952f0021a03e7bd9b4e7de14e211909ee2261a889221"
          assert m["runtime_files"]==974
          assert m["runtime_fingerprint"]=="4dd19cee1b04eb6f6cf64ab681df526676e86fff4475c7f5c95ea323e7473156"
          assert "1.21.925" in m["from_versions"]
          assert m["schema_from"]=="6.0.0"
          assert m["schema_to"]=="6.0.0"
          assert m["backup_required"] is True
          assert m["rollback_supported"] is True
          print("S01-C02 1.21.926 manifest identity PASS")
          PY

      - name: Manifest contract audit
        working-directory: updates
        run: python3 scripts/check_manifest_contract.py

      - name: PHP syntax and Update Core regression
        shell: bash
        working-directory: updates
        run: |
          set -euo pipefail
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php

      - name: Exact Formal Release readback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          JSON="$(gh api "repos/$PRODUCT_REPO/releases/tags/$TAG")"
          test "$(jq -r '.target_commitish' <<<"$JSON")" = "08ec70e29a4fddeba4f949bf40e190ee39cb61a2"
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.size' <<<"$JSON")" = "3474964"
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.digest' <<<"$JSON")" = "sha256:ee59514e63f84b3f4cbd952f0021a03e7bd9b4e7de14e211909ee2261a889221"
          echo "S01-C02 1.21.926 Distribution exact-source proof PASS"

      - name: Cleanup
        if: always()
        run: rm -rf updates

# synchronize distribution proof
