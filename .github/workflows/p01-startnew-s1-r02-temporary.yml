name: TEMP P01 synthetic DDL and independent FULL
on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/p01-startnew-s1-r02-temporary.yml
permissions:
  contents: read
concurrency:
  group: p01-locked-regression-c0b65cae
  cancel-in-progress: false
jobs:
  product:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.actor == 'llhzx2018' &&
      github.triggering_actor == 'llhzx2018' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/p01-startnew-ddl-full-20261128'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        php: ['8.4']
        engine: [sqlite, mysql]
    env:
      P01_SOURCE: c0b65caef21ce6db745454dc7de01098df2b5334
      P01_TREE: fa9a3dbe870f85af67da3bd9feb27312f77da2d8
      GOV_SOURCE: 438472239efbb9d5fc07e6cb2bb233133fe5066c
      P01_PHP: ${{ matrix.php }}
      P01_ENGINE: ${{ matrix.engine }}
    steps:
      - name: Transient exact P01 source without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-startnew
          ref: c0b65caef21ce6db745454dc7de01098df2b5334
          path: target
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact private inputs
        shell: bash
        working-directory: target
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P01_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$P01_TREE"
          test -z "$(git status --porcelain)"
          test "$(git hash-object composer.json)" = 67f056f508636f59f5fff1c078b2ec497b0baf49
          test "$(git hash-object package.json)" = 7ea28678c37964f9b4f2e7fee3e857f7110d9ebf
          test ! -e .env
          test ! -L composer.json
          test ! -L package.json
          echo P01_EXACT_RESOLVER_INPUT=PASS
      - name: Official PHP compatibility runtime and exact Composer
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          tools: composer:2.11.3
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_mysql, dom, xml, curl, zip, openssl, sodium, pcntl, posix
          coverage: none
      - name: Exact Node toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
      - name: Install exact resolver and assert real executable versions
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          php -r 'exit((getenv("P01_PHP")==="8.4" && PHP_VERSION_ID>=80428 && PHP_VERSION_ID<80500)||(getenv("P01_PHP")==="8.5" && PHP_VERSION_ID>=80513 && PHP_VERSION_ID<80600)?0:2);'
          test "$(node --version)" = v24.22.3
          composer --no-plugins --no-scripts --no-ansi --version | grep -Eq '^Composer version 2\.11\.3( |$)'
          mkdir -p "$RUNNER_TEMP/p01-resolver-tools"
          if ! npm install --prefix "$RUNNER_TEMP/p01-resolver-tools" --ignore-scripts --save-exact --no-fund pnpm@11.29.0 > "$RUNNER_TEMP/p01-bootstrap.log" 2>&1; then
            echo P01_PNPM_BOOTSTRAP=FAIL
            exit 1
          fi
          test "$("$RUNNER_TEMP/p01-resolver-tools/node_modules/.bin/pnpm" --version)" = 11.29.0
          printf '%s\n' "$RUNNER_TEMP/p01-resolver-tools/node_modules/.bin" >> "$GITHUB_PATH"
          echo P01_REAL_RESOLVER_TOOLS=PASS
      - name: Transient trusted GOV baseline checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 438472239efbb9d5fc07e6cb2bb233133fe5066c
          path: authority
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Real frozen dependency install and canonical version gate
        working-directory: target
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          test "$(git rev-parse HEAD)" = "$P01_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$P01_TREE"
          test "$(git hash-object composer.lock)" = b4b7dbd432f45a8190df282a669560a93ae2dff9
          test "$(git hash-object pnpm-lock.yaml)" = 0d2d9c2386a96802cc5ba8b737a2dca56e1a2026
          test ! -e package-lock.json
          test "$(git -C ../authority rev-parse HEAD)" = "$GOV_SOURCE"
          test "$(git -C ../authority hash-object governance/agent/validate_repository_entry.py)" = 664a1404890399c13b79d33e5faf9673d281cb64
          test "$(git -C ../authority hash-object governance/agent/VF_WEB_APP_TECHNOLOGY_BASELINE_V1.json)" = 3f7c88c5c437cd19ec3d01a58b1ed44023cd3325
          mkdir -p "$RUNNER_TEMP/p01-evidence"
          phase() {
            local label="$1"; shift
            local log="$RUNNER_TEMP/p01-evidence/$label.log"
            if "$@" >"$log" 2>&1; then echo "$label=PASS"; return; fi
            if grep -Eiq 'could not resolve host|temporary failure in name resolution|EAI_AGAIN|ECONNRESET|ETIMEDOUT|connection timed out|connection reset by peer' "$log"; then
              echo "$label=TRANSIENT_RETRY_ONCE"
              sleep 3
              if "$@" >"$log" 2>&1; then echo "$label=PASS"; return; fi
            fi
            echo "$label=FAIL"
            exit 1
          }
          phase P01_LOCK_PROVENANCE python3 -B scripts/check_dependency_lock.py
          phase P01_COMPOSER_FROZEN composer install --no-plugins --no-scripts --no-interaction --prefer-dist --no-progress
          phase P01_COMPOSER_PLATFORM composer --no-plugins --no-scripts check-platform-reqs
          phase P01_PNPM_FROZEN pnpm install --frozen-lockfile --ignore-scripts --store-dir "$RUNNER_TEMP/p01-pnpm-store"
          phase P01_CANONICAL_GATE python3 -E -s -B ../authority/governance/agent/validate_repository_entry.py --gov-root "$GITHUB_WORKSPACE/authority" --web-stack-root "$GITHUB_WORKSPACE/target"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"p01-evidence/P01_CANONICAL_GATE.log").read_text())
          assert r.get("result")=="VERSION_CHECK_PASS" and r.get("pnpm_lock_and_runtime")=="CHECKED" and not r.get("errors")
          print("P01_REAL_VERSION_GATE=PASS:"+os.environ["P01_PHP"]+":"+os.environ["P01_ENGINE"])
          PY
          git diff --exit-code
      - name: Exact previously failing native SQL cases
        if: matrix.engine != 'sqlite'
        working-directory: target
        shell: bash
        id: regression
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          set +x
          python3 - <<'PY'
          import base64,json,os,re,secrets,shutil,signal,subprocess,sys,time,xml.etree.ElementTree as ET
          from pathlib import Path
          root=Path.cwd(); scope=Path(os.environ["RUNNER_TEMP"])/"p01-evidence"
          engine=os.environ["P01_ENGINE"]; minor=os.environ["P01_PHP"]
          assert engine in {"sqlite","mysql","mariadb"} and minor in {"8.4","8.5"}
          env=dict(os.environ,APP_ENV="testing",APP_DEBUG="false",APP_URL="http://localhost",APP_ALLOWED_HOSTS="localhost",APP_KEY="base64:"+base64.b64encode(secrets.token_bytes(32)).decode(),VF_INSTALL_ALLOW_UNMARKED_DEV="true",VF_INSTALL_DEV_CLAIM_ENABLED="false",DB_CONNECTION="sqlite",DB_DATABASE=":memory:",DB_URL="",CACHE_STORE="array",SESSION_DRIVER="array",QUEUE_CONNECTION="sync",MAIL_MAILER="array",PYTHONDONTWRITEBYTECODE="1")
          for rel in ("bootstrap/cache","storage/framework/cache/data","storage/framework/sessions","storage/framework/views","storage/logs"):
              (root/rel).mkdir(parents=True,exist_ok=True)
          failures=[]
          def run(label,args,extra=None,timeout=600):
              with (scope/(label+".log")).open("wb") as out:
                  p=subprocess.Popen(args,cwd=root,env=dict(env,**(extra or {})),stdout=out,stderr=subprocess.STDOUT,stdin=subprocess.DEVNULL,start_new_session=True)
                  try: return p.wait(timeout=timeout)
                  except subprocess.TimeoutExpired:
                      os.killpg(p.pid,signal.SIGKILL); p.wait(); return 124
          def phpunit(label,args,extra=None,one=None):
              report=scope/(label+".xml")
              rc=run(label,["php","vendor/bin/phpunit","--no-progress","--colors=never","--fail-on-skipped","--fail-on-incomplete","--fail-on-risky","--fail-on-empty-test-suite","--log-junit",str(report),*args],extra,900)
              if not report.is_file():
                  print("P01_TEST_RECEIPT="+json.dumps({"phase":label,"rc":rc,"junit":False}),flush=True);failures.append(label);return
              cases=list(ET.parse(report).iter("testcase"))
              bad=[];skipped=0;assertions=0;errors=0
              for c in cases:
                  assertions+=int(c.get("assertions","0"))
                  if c.find("skipped") is not None: skipped+=1
                  if any(c.find(t) is not None for t in ("failure","error","skipped")):
                      errors+=1
                      name=re.match(r"test[A-Za-z0-9_]+",c.get("name",""))
                      if name:bad.append(name.group())
                      for tag in ("failure","error"):
                          node=c.find(tag)
                          if node is None:continue
                          raw=(node.get("message") or "")+" "+(node.text or "")
                          codes=sorted(set(re.findall(r"\b(?:SQL|ATOMIC|RESTORE|BACKUP|RECOVERY)_[A-Z_]{3,70}\b",raw)))[:8]
                          states=sorted(set(re.findall(r"SQLSTATE\[([0-9A-Z]{5})\]",raw)))[:3]
                          kind=next((k for k in ("PDOException","RuntimeException","AssertionFailedError","TypeError","ErrorException","QueryException") if k in raw),"OTHER")
                          print("P01_SAFE_SQL_DIAGNOSTIC="+json.dumps({"phase":label,"kind":kind,"codes":codes,"states":states}),flush=True)
                          if one=="test_native_v2_matches_original_rows_schema_and_uploads":
                              allowed={"create","table","probe","id","value","int","integer","varchar","not","null","primary","key","engine","innodb","default","charset","character","set","utf8mb4","collate","utf8mb4_unicode_ci","utf8mb4_0900_ai_ci","row_format","dynamic","auto_increment","unsigned","visible","invisible","constraint","encryption","n","y","comment","using","btree","utf8mb4_general_ci"}
                              for slot,hextext in re.findall(r"SQL_TEST_SYNTHETIC_DDL_(SOURCE|OK)=([a-f0-9]{2,1024})\b",raw):
                                  ddl=bytes.fromhex(hextext).decode("ascii")
                                  if re.fullmatch(r"[A-Za-z0-9_ \n\r\t(),=\x60\x27/*!.]+",ddl) and set(re.findall(r"[A-Za-z_][A-Za-z_0-9]*",ddl.lower())).issubset(allowed):
                                      print("P01_SYNTHETIC_PROBE_DDL="+json.dumps({"side":slot,"ddl":ddl}),flush=True)
              ok=rc==0 and len(cases)>0 and assertions>0 and errors==0
              if one:ok=ok and len(cases)==1 and cases[0].get("name","").startswith(one)
              print("P01_TEST_RECEIPT="+json.dumps({"phase":label,"cases":len(cases),"assertions":assertions,"skipped":skipped,"errors":errors,"bad":bad[:40],"rc":rc,"result":"PASS" if ok else "FAIL"}),flush=True)
              if not ok:failures.append(label)
          if run("P01_PACKAGE_DISCOVERY",["php","artisan","package:discover","--ansi"],timeout=90):
              raise SystemExit("P01_PACKAGE_DISCOVERY=FAIL")
          # Fixed original fixture-only cases, from the existing P01 test scope.
          def cases_for(db):
              rows=[]
              def add(file,method,slots):rows.append((file,method,slots))
              for method in ("test_unregistered_sql_writer_while_php_backup_lock_is_held_is_detected","test_unregistered_sql_insert_is_rejected_by_final_complete_table_inventory","test_native_v2_matches_original_rows_schema_and_uploads","test_native_v2_same_row_count_but_changed_values_fail_closed"):
                  add("InstalledSqlV2NativeRestoreTest.php",method,{"P01_S8_NATIVE_SQL_SOURCE_JSON":("restore",True),"P01_S8_NATIVE_SQL_TARGET_OK_JSON":("restore",False),"P01_S8_NATIVE_SQL_TARGET_BAD_JSON":("restore",False)})
              for method in ("test_actual_native_sql_installed_capture_seals_and_offline_reviews_before_ready","test_native_sql_reservation_blocks_existing_table_writes_and_releases_on_exception"):
                  add("InstalledBackupCaptureSyntheticEndToEndTest.php",method,{"P01_S8_NATIVE_SQL_SOURCE_JSON":("restore",True)})
              suffix=db.upper()
              migration={"P01_S8_LARAVEL_"+suffix+"_SOURCE_JSON":("source",True),"P01_S8_DISPOSABLE_"+suffix+"_JSON":("restore",False)}
              add("IsolatedSqlLaravelMigrationRehearsalTest.php","test_native_"+db+"_v2_restore_then_real_laravel_migration_only_with_isolated_credentials",migration)
              add("IsolatedSqlLaravelMigrationRehearsalTest.php","test_"+db+"_encrypted_preupgrade_generation_rebuilds_without_reusing_dirty_ddl_database",{**migration,"P01_S8_RECOVERY_"+suffix+"_JSON":("restore",False)})
              for method,ending in (("v2_paired_restore_can_gate_only_synthetic_code_swap","_RESTORE_JSON"),("failed_code_swap_requires_exact_sql_and_uploads_recovery","_FAIL_RESTORE_JSON"),("committed_ddl_drift_refuses_false_code_recovery_receipt","_DIRTY_RESTORE_JSON")):
                  add("IsolatedAtomicUpgradeCycleTest.php","test_native_"+db+"_"+method,{"P01_S8_ATOMIC_"+suffix+"_SOURCE_JSON":("source",True),"P01_S8_ATOMIC_"+suffix+ending:("restore",False)})
              add("InstalledSqlIsolatedRestoreCycleTest.php","test_native_mysql_round_trip_can_run_only_with_explicit_disposable_credentials" if db=="mysql" else "test_native_mariadb_row_restore_and_matching_uploads_require_disposable_server",{"P01_S8_DISPOSABLE_"+suffix+"_JSON":("restore",False)})
              if db=="mysql":add("InstalledSqlSourceWitnessTest.php","test_native_source_row_inventory_requires_explicit_isolated_fixture",{"P01_S8_SOURCE_WITNESS_MYSQL_JSON":("source",True)})
              assert len(rows)==(13 if db=="mysql" else 12)
              return rows
          native={(f,m) for db in ("mysql","mariadb") for f,m,_ in cases_for(db)}
          assert len(native)==19
          for file,method in native:
              p=root/"tests/Unit"/file
              assert p.is_file() and not p.is_symlink() and method in set(re.findall(r"\bfunction\s+(test[A-Za-z0-9_]+)\s*\(",p.read_text()))
          if engine=="sqlite":
              phpunit("P01_FEATURE_SQLITE",["--testsuite","Feature"])
              omit="|".join(sorted({m for _,m in native}))
              phpunit("P01_UNIT_WITH_EXACT_NATIVE_SPLIT",["--testsuite","Unit","--filter",r"/^(?!.*::(?:"+omit+r")(?:\s|$)).+$/"])
              print("P01_REQUIRED_NATIVE_SPLIT=19_DISTINCT_25_ENGINE_CASES",flush=True)
          else:
              name="vf-p01-regression-"+os.environ["GITHUB_RUN_ID"]+"-"+minor.replace(".","")+engine
              cli="mysql" if engine=="mysql" else "mariadb"; dump="mysqldump" if engine=="mysql" else "mariadb-dump"
              if not shutil.which(cli) or not shutil.which(dump):
                  if run("P01_CLIENT_APT_UPDATE",["sudo","apt-get","-o","Acquire::Retries=1","update"],timeout=180) or run("P01_CLIENT_APT_INSTALL",["sudo","apt-get","-o","Acquire::Retries=1","install","-y","--no-install-recommends","mysql-client" if engine=="mysql" else "mariadb-client"],timeout=180):
                      raise SystemExit("P01_NATIVE_CLIENT=FAIL")
              assert shutil.which(cli) and shutil.which(dump)
              rootpass=secrets.token_hex(24);password=secrets.token_hex(24)
              image="mysql:8.4" if engine=="mysql" else "mariadb:11.8"; prefix="MYSQL" if engine=="mysql" else "MARIADB"
              def docker(args,stdin=None,timeout=90):
                  return subprocess.run(["docker",*args],input=stdin,capture_output=True,text=True,timeout=timeout,check=True).stdout
              def owned():
                  r=subprocess.run(["docker","inspect",name],capture_output=True,text=True,timeout=15)
                  if r.returncode:return None
                  info=json.loads(r.stdout)[0]
                  assert info["Config"]["Labels"].get("vf-p01-regression")==name
                  assert not info["HostConfig"].get("Privileged") and not info["HostConfig"].get("Binds")
                  assert info["HostConfig"]["PortBindings"]=={"3306/tcp":[{"HostIp":"127.0.0.1","HostPort":"3306"}]}
                  return info["Id"]
              assert owned() is None
              try:
                  docker(["run","--rm","-d","--name",name,"--label","vf-p01-regression="+name,"--publish","127.0.0.1:3306:3306","--memory","1536m","--cpus","2","--pids-limit","256","-e",prefix+"_ROOT_PASSWORD="+rootpass,"-e",prefix+"_DATABASE=vfstartnew_test_business","-e",prefix+"_USER=vf_p01_fixture","-e",prefix+"_PASSWORD="+password,image],timeout=180)
                  cid=owned();assert cid
                  db_env={"DB_CONNECTION":engine,"DB_HOST":"127.0.0.1","DB_PORT":"3306","DB_DATABASE":"vfstartnew_test_business","DB_USERNAME":"vf_p01_fixture","DB_PASSWORD":password}
                  deadline=time.monotonic()+120
                  while True:
                      r=subprocess.run(["php","-r",'try{$d=new PDO("mysql:host=127.0.0.1;port=3306;dbname=vfstartnew_test_business",getenv("DB_USERNAME"),getenv("DB_PASSWORD"));echo $d->query("SELECT VERSION()")->fetchColumn();}catch(Throwable $e){exit(2);}'],env=dict(env,**db_env),capture_output=True,text=True,timeout=8)
                      if r.returncode==0:
                          v=r.stdout.lower(); assert (v.startswith("8.4.") and "mariadb" not in v) if engine=="mysql" else (v.startswith("11.8.") and "mariadb" in v)
                          print("P01_REAL_DB_ENGINE="+engine+":PASS",flush=True);break
                      assert time.monotonic()<deadline,"DB_NOT_READY";time.sleep(2)
                  def fixture(kind,seeded):
                      assert owned()==cid and kind in {"source","restore"}
                      dbname="vfstartnew_test_"+kind+"_"+secrets.token_hex(4);pw=secrets.token_hex(24)
                      assert re.fullmatch(r"vfstartnew_test_(source|restore)_[a-f0-9]{8}",dbname) and len(dbname)<=32
                      q=chr(96)+dbname+chr(96)
                      sql="CREATE DATABASE "+q+" CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; CREATE USER '"+dbname+"'@'%' IDENTIFIED BY '"+pw+"'; GRANT ALL PRIVILEGES ON "+q+".* TO '"+dbname+"'@'%';"
                      if seeded:sql+=" USE "+q+"; CREATE TABLE probe (id INT PRIMARY KEY, value VARCHAR(80) NOT NULL) ENGINE=InnoDB; INSERT INTO probe VALUES (1,'first'),(2,'second');"
                      docker(["exec","-i","-e","MYSQL_PWD="+rootpass,cid,cli,"-uroot","--protocol=socket"],sql,30)
                      return json.dumps({"driver":engine,"host":"127.0.0.1","port":3306,"database":dbname,"username":dbname,"password":pw})
                  for i,(file,method,slots) in enumerate(cases_for(engine)):
                      if i != 2:continue
                      extra={"P01_S8_NATIVE_SQL_ENGINE":engine}
                      extra.update({key:fixture(*spec) for key,spec in slots.items()})
                      phpunit("P01_NATIVE_SQL_"+engine.upper()+"_"+str(i),["--filter","^(?:.*::)?"+method+"$","tests/Unit/"+file],extra,method)
                  print("P01_DIAGNOSTIC_SQL_CASES="+engine+":"+str(1),flush=True)
              finally:
                  cid=owned()
                  if cid:docker(["rm","-f","-v",cid],timeout=60)
                  assert owned() is None
                  print("P01_OWNED_DB_CLEANUP=PASS",flush=True)
          if failures:raise SystemExit("P01_REGRESSION_FAILED:"+",".join(failures))
          print("P01_FAILED_CASE_RECHECK=PASS:"+minor+":"+engine)
          PY
      - name: Actual frontend build
        if: matrix.engine == 'sqlite'
        working-directory: target
        shell: bash
        id: frontend
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          set +x
          failures=0
          phase() {
            local label="$1"; shift
            if "$@" >"$RUNNER_TEMP/p01-evidence/$label.log" 2>&1; then echo "$label=PASS"; else echo "$label=FAIL"; failures=1; fi
          }
          phase P01_TYPESCRIPT pnpm run typecheck
          python3 - <<'PY'
          import re,os,hashlib,json
          from pathlib import Path
          log=(Path(os.environ["RUNNER_TEMP"])/"p01-evidence/P01_TYPESCRIPT.log").read_text(errors="replace")
          for m in re.finditer(r"(?m)^([^\r\n]+?)\((\d+),(\d+)\): error TS(\d+):",log):
              path=m.group(1).replace("\\","/")
              if not path.startswith("resources/"):continue
              print("P01_SAFE_TS_DIAGNOSTIC="+json.dumps({"file_sha256":hashlib.sha256(path.encode()).hexdigest()[:16],"line":int(m.group(2)),"col":int(m.group(3)),"code":int(m.group(4))}))
          PY
          phase P01_VITE_BUILD pnpm run build
          exit "$failures"
      - name: Actual isolated SQLite FULL from production vendor
        if: matrix.engine == 'sqlite' && steps.frontend.outcome == 'success'
        working-directory: target
        shell: bash
        id: full
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          set +x
          scope="$RUNNER_TEMP/p01-evidence"
          full="$RUNNER_TEMP/p01-full-source"
          archive="$RUNNER_TEMP/p01-full.zip"
          phase() {
            local label="$1"; shift
            if "$@" >"$scope/$label.log" 2>&1; then echo "$label=PASS"; else echo "$label=FAIL"; return 1; fi
          }
          git clone --local --no-hardlinks --no-checkout --no-recurse-submodules "$PWD" "$full" >"$scope/full-clone.log" 2>&1
          git -C "$full" checkout --detach "$P01_SOURCE" >"$scope/full-checkout.log" 2>&1
          test "$(git -C "$full" rev-parse HEAD^{tree})" = "$P01_TREE"
          mkdir -p "$full/public/build"
          cp -a public/build/. "$full/public/build/"
          cd "$full"
          phase P01_FULL_PROD_VENDOR composer install --no-dev --no-scripts --no-plugins --no-interaction --prefer-dist --no-progress
          phase P01_FULL_PLATFORM composer --no-plugins --no-scripts check-platform-reqs --no-dev
          phase P01_FULL_BUILD python3 -B scripts/build_clean_full.py --root "$full" --output "$archive" --source-sha "$P01_SOURCE"
          sha="$(sha256sum "$archive" | cut -d' ' -f1)"
          phase P01_FULL_SQLITE_RUNTIME python3 -B scripts/verify_clean_full_install.py --archive "$archive" --source-sha "$P01_SOURCE" --sha256 "$sha"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"p01-evidence/P01_FULL_SQLITE_RUNTIME.log").read_text())
          assert r["status"]=="FULL_RUNTIME_PASS" and r["engine"]=="sqlite" and r["source_sha"]==os.environ["P01_SOURCE"]
          print("P01_REAL_SQLITE_FULL=PASS:"+os.environ["P01_PHP"])
          PY
      - name: Always remove only run-owned private inputs and synthetic resources
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          name="vf-p01-regression-$GITHUB_RUN_ID-$(printf '%s' "$P01_PHP" | tr -d .)$P01_ENGINE"
          if docker inspect "$name" >/dev/null 2>&1; then
            test "$(docker inspect --format '{{ index .Config.Labels "vf-p01-regression" }}' "$name")" = "$name"
            docker rm -f -v "$name" >/dev/null
          fi
          rm -rf -- target authority "$RUNNER_TEMP/p01-resolver-tools" "$RUNNER_TEMP/p01-evidence" "$RUNNER_TEMP/p01-pnpm-store" "$RUNNER_TEMP/p01-full-source" "$RUNNER_TEMP/p01-full.zip"
          rm -f -- "$RUNNER_TEMP/p01-bootstrap.log"
          test ! -e target && test ! -e authority
          echo P01_PRIVATE_REGRESSION_CLEANUP=PASS
      - name: Preserve all required phase failures
        if: always()
        shell: bash
        env:
          REGRESSION: ${{ steps.regression.outcome }}
          FRONTEND: ${{ steps.frontend.outcome }}
          FULL: ${{ steps.full.outcome }}
        run: |
          set -Eeuo pipefail
          if [ "$P01_ENGINE" = sqlite ]; then
            test "$FRONTEND" = success
            test "$FULL" = success
          else
            test "$REGRESSION" = success
          fi
          echo P01_TARGETED_DIAGNOSTIC_PHASES=PASS
