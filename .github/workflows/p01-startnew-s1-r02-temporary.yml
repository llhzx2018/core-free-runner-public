name: TEMP P01 actual installed two-generation recovery
on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/p01-startnew-s1-r02-temporary.yml
permissions:
  contents: read
concurrency:
  group: p01-installed-generations-00582511
  cancel-in-progress: false
jobs:
  product:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.actor == 'llhzx2018' &&
      github.triggering_actor == 'llhzx2018' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/p01-startnew-installed-native-sql-protocol-corrected-20261128'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {php: '8.4', engine: sqlite}
    env:
      P01_SOURCE: 00582511f67971b6b7c8f27d698eaa490b550eb2
      P01_TREE: 878a1845e040f8b1bf2f60e79dc8e610ee05bc79
      GOV_SOURCE: f7e967fc6fa590942b7cecfb1407ec25f1eaf320
      OLD_SOURCE: a56e340e47cd069a8bb342b04ea79141f24a2b7b
      OLD_TREE: 9286008197fe371dcc69db24db211a3c0bab8ad1
      P01_PHP: ${{ matrix.php }}
      P01_ENGINE: ${{ matrix.engine }}
    steps:
      - name: Transient exact P01 source without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-startnew
          ref: ${{ env.P01_SOURCE }}
          path: target
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 3
      - name: Verify exact private inputs
        shell: bash
        working-directory: target
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P01_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$P01_TREE"
          test -z "$(git status --porcelain)"
          test "$(git hash-object composer.json)" = 67f056f508636f59f5fff1c078b2ec497b0baf49
          test "$(git hash-object package.json)" = 7ea28678c37964f9b4f2e7fee3e857f7110d9ebf
          test ! -e .env
          test ! -L composer.json
          test ! -L package.json
          echo P01_EXACT_RESOLVER_INPUT=PASS
      - name: Official PHP compatibility runtime and exact Composer
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          tools: composer:2.11.3
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_mysql, dom, xml, curl, zip, openssl, sodium, pcntl, posix
          coverage: none
      - name: Exact Node toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
      - name: Install exact resolver and assert real executable versions
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          php -r 'exit((getenv("P01_PHP")==="8.4" && PHP_VERSION_ID>=80428 && PHP_VERSION_ID<80500)||(getenv("P01_PHP")==="8.5" && PHP_VERSION_ID>=80513 && PHP_VERSION_ID<80600)?0:2);'
          test "$(node --version)" = v24.22.3
          composer --no-plugins --no-scripts --no-ansi --version | grep -Eq '^Composer version 2\.11\.3( |$)'
          mkdir -p "$RUNNER_TEMP/p01-resolver-tools"
          if ! npm install --prefix "$RUNNER_TEMP/p01-resolver-tools" --ignore-scripts --save-exact --no-fund pnpm@11.29.0 > "$RUNNER_TEMP/p01-bootstrap.log" 2>&1; then
            echo P01_PNPM_BOOTSTRAP=FAIL
            exit 1
          fi
          test "$("$RUNNER_TEMP/p01-resolver-tools/node_modules/.bin/pnpm" --version)" = 11.29.0
          printf '%s\n' "$RUNNER_TEMP/p01-resolver-tools/node_modules/.bin" >> "$GITHUB_PATH"
          echo P01_REAL_RESOLVER_TOOLS=PASS
      - name: Transient trusted GOV baseline checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: ${{ env.GOV_SOURCE }}
          path: authority
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Real frozen dependency install and canonical version gate
        working-directory: target
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          test "$(git rev-parse HEAD)" = "$P01_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$P01_TREE"
          test "$(git hash-object composer.lock)" = b4b7dbd432f45a8190df282a669560a93ae2dff9
          test "$(git hash-object pnpm-lock.yaml)" = 0d2d9c2386a96802cc5ba8b737a2dca56e1a2026
          test ! -e package-lock.json
          test "$(git -C ../authority rev-parse HEAD)" = "$GOV_SOURCE"
          test "$(git -C ../authority hash-object governance/agent/validate_repository_entry.py)" = 664a1404890399c13b79d33e5faf9673d281cb64
          test "$(git -C ../authority hash-object governance/agent/VF_WEB_APP_TECHNOLOGY_BASELINE_V1.json)" = 3f7c88c5c437cd19ec3d01a58b1ed44023cd3325
          mkdir -p "$RUNNER_TEMP/p01-evidence"
          phase() {
            local label="$1"; shift
            local log="$RUNNER_TEMP/p01-evidence/$label.log"
            if "$@" >"$log" 2>&1; then echo "$label=PASS"; return; fi
            if grep -Eiq 'could not resolve host|temporary failure in name resolution|EAI_AGAIN|ECONNRESET|ETIMEDOUT|connection timed out|connection reset by peer' "$log" && ! grep -Eiq '401|403|404|certificate|integrity|checksum|authentication|authorization|permission denied|security advisory|security advisories' "$log"; then
              echo "$label=TRANSIENT_RETRY_ONCE"
              sleep 90
              if "$@" >"$log" 2>&1; then echo "$label=PASS"; return; fi
            fi
            echo "$label=FAIL"
            exit 1
          }
          phase P01_LOCK_PROVENANCE python3 -B scripts/check_dependency_lock.py
          phase P01_COMPOSER_FROZEN composer install --no-plugins --no-scripts --no-interaction --prefer-dist --no-progress
          phase P01_COMPOSER_PLATFORM composer --no-plugins --no-scripts check-platform-reqs
          phase P01_PNPM_FROZEN pnpm install --frozen-lockfile --ignore-scripts --store-dir "$RUNNER_TEMP/p01-pnpm-store"
          phase P01_CANONICAL_GATE python3 -E -s -B ../authority/governance/agent/validate_repository_entry.py --gov-root "$GITHUB_WORKSPACE/authority" --web-stack-root "$GITHUB_WORKSPACE/target"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"p01-evidence/P01_CANONICAL_GATE.log").read_text())
          assert r.get("result")=="VERSION_CHECK_PASS" and r.get("pnpm_lock_and_runtime")=="CHECKED" and not r.get("errors")
          print("P01_REAL_VERSION_GATE=PASS:"+os.environ["P01_PHP"]+":"+os.environ["P01_ENGINE"])
          PY
          git diff --exit-code
      - name: Actual locked FULL pair and installed generation rollback
        working-directory: target
        shell: bash
        id: full
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          scope="$RUNNER_TEMP/p01-evidence"
          phase() {
            local label="$1"; shift
            if "$@" >"$scope/$label.log" 2>&1; then echo "$label=PASS"; else echo "$label=FAIL"; return 1; fi
          }
          test "$(git rev-parse "$P01_SOURCE~2")" = "$OLD_SOURCE"
          test "$(git rev-parse "$OLD_SOURCE^{tree}")" = "$OLD_TREE"
          git diff --exit-code "$OLD_SOURCE" "$P01_SOURCE" -- composer.json composer.lock package.json pnpm-lock.yaml database/migrations
          phase P01_R24_WORKER_SYNTAX php -l tests/evolution/p01_installed_generation_worker.php
          phase P01_R24_PYTHON_SYNTAX python3 -B -c 'import ast,pathlib; ast.parse(pathlib.Path("tests/evolution/p01_installed_generation_rehearsal.py").read_text())'
          phase P01_R24_PRODUCTION_VENDOR composer install --no-dev --no-plugins --no-scripts --no-interaction --prefer-dist --no-progress
          phase P01_R24_NEW_VITE pnpm run build
          phase P01_R24_NEW_FULL python3 -B scripts/build_clean_full.py --root "$PWD" --output "$scope/new.zip" --source-sha "$P01_SOURCE"
          git checkout --detach "$OLD_SOURCE" >"$scope/old-checkout.log" 2>&1
          test "$(git rev-parse HEAD^{tree})" = "$OLD_TREE"
          test "$(cat VERSION)" = 0.1.0
          phase P01_R24_OLD_VITE pnpm run build
          phase P01_R24_OLD_FULL python3 -B scripts/build_clean_full.py --root "$PWD" --output "$scope/old.zip" --source-sha "$OLD_SOURCE"
          git checkout --detach "$P01_SOURCE" >"$scope/new-checkout.log" 2>&1
          test "$(git rev-parse HEAD^{tree})" = "$P01_TREE"
          test "$(cat VERSION)" = 0.1.1
          phase P01_R24_ATOMIC python3 -B scripts/build_new_atomic.py --from-full "$scope/old.zip" --to-full "$scope/new.zip" --output "$scope/atomic.zip"
          old_sha="$(sha256sum "$scope/old.zip" | cut -d' ' -f1)"
          new_sha="$(sha256sum "$scope/new.zip" | cut -d' ' -f1)"
          atomic_sha="$(sha256sum "$scope/atomic.zip" | cut -d' ' -f1)"
          echo "P01_R24_OLD_FULL_SHA256=$old_sha"
          echo "P01_R24_NEW_FULL_SHA256=$new_sha"
          echo "P01_R24_ATOMIC_SHA256=$atomic_sha"
          result=0
          timeout 2400s python3 -B tests/evolution/p01_installed_generation_rehearsal.py \
            --old-archive "$scope/old.zip" --old-sha256 "$old_sha" --old-source "$OLD_SOURCE" \
            --new-archive "$scope/new.zip" --new-sha256 "$new_sha" --new-source "$P01_SOURCE" \
            --atomic-archive "$scope/atomic.zip" --atomic-sha256 "$atomic_sha" >"$scope/generation.log" 2>&1 || result=$?
          grep -E '^P01_R24_ACTUAL_[A-Z_]+=(PASS|NOT_PROVEN|[A-Z0-9_]{2,110})$' "$scope/generation.log" || true
          test "$result" = 0
          grep -Fxq 'P01_R24_ACTUAL_TWO_FULL_SQLITE_GENERATIONS=PASS' "$scope/generation.log"
          git diff --exit-code
          echo P01_R24_ACTUAL_TEST_ONLY=PASS
      - name: Always erase run-owned private checkouts and package bytes
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          rm -rf -- target authority "$RUNNER_TEMP/p01-resolver-tools" "$RUNNER_TEMP/p01-evidence" "$RUNNER_TEMP/p01-pnpm-store"
          rm -f -- "$RUNNER_TEMP/p01-bootstrap.log"
          test ! -e target && test ! -e authority && test ! -e "$RUNNER_TEMP/p01-evidence"
          echo P01_PRIVATE_REGRESSION_CLEANUP=PASS
