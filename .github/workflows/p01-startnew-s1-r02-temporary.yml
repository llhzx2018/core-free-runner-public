name: TEMP P01 old software native populated platform three widths
on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/p01-startnew-s1-r02-temporary.yml
permissions:
  contents: read
concurrency:
  group: p01-s6-state-8bde9472
  cancel-in-progress: false
jobs:
  browser:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.actor == 'llhzx2018' &&
      github.triggering_actor == 'llhzx2018' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/p01-startnew-install-fault-s5-strict-20261128'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        php: ['8.4']
        engine: [sqlite]
    env:
      P01_SOURCE: 8bde947223d1e846d190091c6640ead339bf72a2
      P01_TREE: dfab044c525dff348d68dad889cd67a40c8b4db2
      GOV_SOURCE: cf6d84ab4efcaee16566a56744d7a363692dfab4
      P01_PHP: ${{ matrix.php }}
      P01_ENGINE: ${{ matrix.engine }}
    steps:
      - name: Transient exact P01 source without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-startnew
          ref: 8bde947223d1e846d190091c6640ead339bf72a2
          path: target
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Read-only legacy exact source in disposable checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 158c3d75378c235720727fe9f29fb28e02e7b6c9
          path: legacy
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact private inputs
        shell: bash
        working-directory: target
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P01_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$P01_TREE"
          test -z "$(git status --porcelain)"
          test "$(git hash-object composer.json)" = 67f056f508636f59f5fff1c078b2ec497b0baf49
          test "$(git hash-object package.json)" = 7ea28678c37964f9b4f2e7fee3e857f7110d9ebf
          test ! -e .env
          test ! -L composer.json
          test ! -L package.json
          echo P01_EXACT_RESOLVER_INPUT=PASS
      - name: Official PHP compatibility runtime and exact Composer
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          tools: composer:2.11.3
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_mysql, dom, xml, curl, zip, openssl, sodium, pcntl, posix
          coverage: none
      - name: Exact Node toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
      - name: Install exact resolver and assert real executable versions
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          php -r 'exit((getenv("P01_PHP")==="8.4" && PHP_VERSION_ID>=80428 && PHP_VERSION_ID<80500)||(getenv("P01_PHP")==="8.5" && PHP_VERSION_ID>=80513 && PHP_VERSION_ID<80600)?0:2);'
          test "$(node --version)" = v24.22.3
          composer --no-plugins --no-scripts --no-ansi --version | grep -Eq '^Composer version 2\.11\.3( |$)'
          mkdir -p "$RUNNER_TEMP/p01-resolver-tools"
          if ! npm install --prefix "$RUNNER_TEMP/p01-resolver-tools" --ignore-scripts --save-exact --no-fund pnpm@11.29.0 > "$RUNNER_TEMP/p01-bootstrap.log" 2>&1; then
            echo P01_PNPM_BOOTSTRAP=FAIL
            exit 1
          fi
          test "$("$RUNNER_TEMP/p01-resolver-tools/node_modules/.bin/pnpm" --version)" = 11.29.0
          printf '%s\n' "$RUNNER_TEMP/p01-resolver-tools/node_modules/.bin" >> "$GITHUB_PATH"
          echo P01_REAL_RESOLVER_TOOLS=PASS
      - name: Transient trusted GOV baseline checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: cf6d84ab4efcaee16566a56744d7a363692dfab4
          path: authority
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Real frozen dependency install and canonical version gate
        working-directory: target
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          test "$(git rev-parse HEAD)" = "$P01_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$P01_TREE"
          test "$(git hash-object composer.lock)" = b4b7dbd432f45a8190df282a669560a93ae2dff9
          test "$(git hash-object pnpm-lock.yaml)" = 0d2d9c2386a96802cc5ba8b737a2dca56e1a2026
          test ! -e package-lock.json
          test "$(git -C ../authority rev-parse HEAD)" = "$GOV_SOURCE"
          test "$(git -C ../authority hash-object governance/agent/validate_repository_entry.py)" = 664a1404890399c13b79d33e5faf9673d281cb64
          test "$(git -C ../authority hash-object governance/agent/VF_WEB_APP_TECHNOLOGY_BASELINE_V1.json)" = 3f7c88c5c437cd19ec3d01a58b1ed44023cd3325
          mkdir -p "$RUNNER_TEMP/p01-evidence"
          phase() {
            local label="$1"; shift
            local log="$RUNNER_TEMP/p01-evidence/$label.log"
            if "$@" >"$log" 2>&1; then echo "$label=PASS"; return; fi
            if grep -Eiq 'could not resolve host|temporary failure in name resolution|EAI_AGAIN|ECONNRESET|ETIMEDOUT|connection timed out|connection reset by peer' "$log"; then
              echo "$label=TRANSIENT_RETRY_ONCE"
              sleep 90
              if "$@" >"$log" 2>&1; then echo "$label=PASS"; return; fi
            fi
            echo "$label=FAIL"
            exit 1
          }
          phase P01_LOCK_PROVENANCE python3 -B scripts/check_dependency_lock.py
          phase P01_COMPOSER_FROZEN composer install --no-plugins --no-scripts --no-interaction --prefer-dist --no-progress
          phase P01_COMPOSER_PLATFORM composer --no-plugins --no-scripts check-platform-reqs
          phase P01_PNPM_FROZEN pnpm install --frozen-lockfile --ignore-scripts --store-dir "$RUNNER_TEMP/p01-pnpm-store"
          phase P01_CANONICAL_GATE python3 -E -s -B ../authority/governance/agent/validate_repository_entry.py --gov-root "$GITHUB_WORKSPACE/authority" --web-stack-root "$GITHUB_WORKSPACE/target"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"p01-evidence/P01_CANONICAL_GATE.log").read_text())
          assert r.get("result")=="VERSION_CHECK_PASS" and r.get("pnpm_lock_and_runtime")=="CHECKED" and not r.get("errors")
          print("P01_REAL_VERSION_GATE=PASS:"+os.environ["P01_PHP"]+":"+os.environ["P01_ENGINE"])
          PY
          git diff --exit-code
      - name: Existing actual product flows across 390 768 1440
        if: matrix.engine == 'sqlite'
        working-directory: target
        shell: bash
        id: frontend
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          scope="$RUNNER_TEMP/p01-evidence"
          export PLAYWRIGHT_BROWSERS_PATH="$scope/browsers"
          if ! pnpm exec playwright install --with-deps chromium >"$scope/browser-install.log" 2>&1; then
            echo P01_REAL_BROWSER_TOOLCHAIN=FAIL; exit 1
          fi
          echo P01_REAL_BROWSER_TOOLCHAIN=PASS
          if ! pnpm run build >"$scope/browser-build.log" 2>&1; then
            echo P01_REAL_BROWSER_BUILD=FAIL; exit 1
          fi
          echo P01_REAL_BROWSER_BUILD=PASS
          export APP_ENV=testing APP_DEBUG=false APP_URL=http://127.0.0.1:8777 APP_ALLOWED_HOSTS=127.0.0.1
          export VF_INSTALL_ALLOW_UNMARKED_DEV=true VF_INSTALL_DEV_CLAIM_ENABLED=false
          export APP_KEY="base64:$(openssl rand -base64 32)"
          export DB_CONNECTION=sqlite SESSION_DRIVER=file CACHE_STORE=array QUEUE_CONNECTION=sync MAIL_MAILER=array
          export P01_S3_REAL_URL="$APP_URL" P01_S3_SYNTH_PASS="$(openssl rand -hex 32)"
          export P01_LEGACY_DISPOSABLE_ROOT="$GITHUB_WORKSPACE/legacy"
          test "$(git -C "$P01_LEGACY_DISPOSABLE_ROOT" rev-parse HEAD)" = 158c3d75378c235720727fe9f29fb28e02e7b6c9
          export P01_S6_OLD_PLATFORM_ONLY=yes
          node --check tests/browser/p01_s6_state_comparison.mjs
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          if ! php artisan package:discover --ansi >"$scope/browser-discovery.log" 2>&1; then
            echo P01_REAL_BROWSER_PACKAGE_DISCOVERY=FAIL; exit 1
          fi
          failures=0
          SERVER_PID=
          stop_server() {
            if [ -n "$SERVER_PID" ]; then
              kill -- "-$SERVER_PID" 2>/dev/null || true
              wait "$SERVER_PID" 2>/dev/null || true
              SERVER_PID=
            fi
          }
          trap stop_server EXIT
          for stage in s6state; do
            export APP_ENV=testing DB_DATABASE="$scope/p01-s3-$stage.sqlite"
            touch "$DB_DATABASE"
            if ! php artisan migrate --force --no-interaction >"$scope/$stage-migrate.log" 2>&1 || ! php tests/browser/p01_s3_seed_synthetic.php >"$scope/$stage-seed.log" 2>&1; then
              echo "P01_REAL_BROWSER_$stage=FIXTURE_FAIL"; failures=1; continue
            fi
            test ! -e storage/app/private/vf-startnew/installed.json
            export APP_ENV=local
            setsid php artisan serve --host=127.0.0.1 --port=8777 >"$scope/$stage-server.log" 2>&1 &
            SERVER_PID=$!
            ready=no
            for i in $(seq 1 35); do
              if curl --noproxy '*' -s -o /dev/null "$APP_URL/login"; then ready=yes; break; fi
              sleep 1
            done
            if [ "$ready" != yes ]; then
              echo "P01_REAL_BROWSER_$stage=SERVER_FAIL"; failures=1; stop_server; continue
            fi
            script=p01_s6_state_comparison.mjs
            marker=P01_S6_STATE_COMPARISON=PASS
            args=()
            if timeout 540s node "tests/browser/$script" "${args[@]}" >"$scope/$stage-browser.log" 2>&1 && grep -Fxq "$marker" "$scope/$stage-browser.log"; then
              grep -E '^P01_S6_STATE_[A-Z0-9_]+=(PASS|[a-f0-9]{64}|OLD_PLATFORM_THREE_WIDTHS_WITH_NATIVE_FIXTURE)$' "$scope/$stage-browser.log"
              echo "P01_REAL_BROWSER_$stage=PASS"
            else
              echo "P01_REAL_BROWSER_$stage=FAIL"; failures=1
              python3 - "$scope/$stage-browser.log" <<'PY'
          import pathlib,re,sys
          text=pathlib.Path(sys.argv[1]).read_text(errors="replace")
          for line in text.splitlines():
              if re.fullmatch(r"P01_S6_STATE_[A-Z0-9_]+=(?:PASS|FAIL:(?:TIMEOUT|ASSERTION|OTHER)|[a-f0-9]{64}|[A-Z0-9_]{3,96}|[0-9]+:[0-9]+)",line): print(line)
          print("P01_REAL_BROWSER_FAILURE_CLASS="+("TIMEOUT" if "TimeoutError" in text else "ASSERTION" if "AssertionError" in text else "OTHER"))
          for line in text.splitlines():
              if re.fullmatch(r"P01_S5_REAL_(?:FAILURE_CODE|FAIL_WIDTH)=[0-9]{1,4}",line): print(line)
              if re.fullmatch(r"P01_S5_REAL_FAIL_STAGE=[a-z-]{1,32}",line): print(line)
              if re.fullmatch(r"P01_S3_LOGIN_HTTP_[0-9]{3,4}=[0-9]{3}",line): print(line)
          for line in text.splitlines():
              if re.fullmatch(r"P01_S5_REAL_FAILURE_LINE=[0-9]{1,4}:[0-9]{1,4}",line): print(line)
          for f,ln,col in sorted(set(re.findall(r"(p01_s[3567]_[a-z0-9_]+\.mjs):([0-9]{1,4}):([0-9]{1,4})",text)))[:12]:
              print("P01_BROWSER_FAILURE_LOCATION="+f+":"+ln+":"+col)
          for kind in ("strict mode violation","TimeoutError","AssertionError","TypeError","SyntaxError","ReferenceError","ENOENT","ERR_ASSERTION","ERR_MODULE_NOT_FOUND"):
              if kind in text: print("P01_BROWSER_FAILURE_KIND="+kind.replace(" ","_"))
          PY
            fi
            stop_server
            test ! -e storage/app/private/vf-startnew/installed.json
          done
          echo P01_REAL_BROWSER_NO_FIRST_CLAIM=PASS
          exit "$failures"
      - name: Always remove only run-owned private inputs and synthetic resources
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          name="vf-p01-regression-$GITHUB_RUN_ID-$(printf '%s' "$P01_PHP" | tr -d .)$P01_ENGINE"
          if docker inspect "$name" >/dev/null 2>&1; then
            test "$(docker inspect --format '{{ index .Config.Labels "vf-p01-regression" }}' "$name")" = "$name"
            docker rm -f -v "$name" >/dev/null
          fi
          rm -rf -- target authority legacy "$RUNNER_TEMP/p01-resolver-tools" "$RUNNER_TEMP/p01-evidence" "$RUNNER_TEMP/p01-pnpm-store" "$RUNNER_TEMP/p01-full-source" "$RUNNER_TEMP/p01-full.zip"
          rm -f -- "$RUNNER_TEMP/p01-bootstrap.log"
          test ! -e target && test ! -e authority && test ! -e legacy
          echo P01_PRIVATE_REGRESSION_CLEANUP=PASS
      - name: Preserve all required phase failures
        if: always()
        shell: bash
        env:
          REGRESSION: ${{ steps.regression.outcome }}
          FRONTEND: ${{ steps.frontend.outcome }}
        run: |
          set -Eeuo pipefail
          if [ "$P01_ENGINE" = sqlite ]; then
            test "$FRONTEND" = success
          else
            test "$REGRESSION" = success
          fi
          echo P01_TARGETED_DIAGNOSTIC_PHASES=PASS
