name: TEMP P01 legacy current confirmation and original CRUD path
on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/p01-startnew-s1-r02-temporary.yml
permissions:
  contents: read
concurrency:
  group: p01-original-legacy-channel-crud-319a8b8c
  cancel-in-progress: false
jobs:
  browser:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.actor == 'llhzx2018' &&
      github.triggering_actor == 'llhzx2018' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/p01-startnew-installed-native-sql-protocol-corrected-20261128'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        php: ['8.4']
        engine: [sqlite]
    env:
      P01_SOURCE: 319a8b8c7d001501e0c05aa4e2458c555b5f1a85
      P01_TREE: 2a44c0daf856bc85dc02af0eb677d6afc3451b08
      GOV_SOURCE: f7e967fc6fa590942b7cecfb1407ec25f1eaf320
      P01_PHP: ${{ matrix.php }}
      P01_ENGINE: ${{ matrix.engine }}
    steps:
      - name: Transient exact P01 source without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-startnew
          ref: 319a8b8c7d001501e0c05aa4e2458c555b5f1a85
          path: target
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Read-only legacy exact source in disposable checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 158c3d75378c235720727fe9f29fb28e02e7b6c9
          path: legacy
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact private inputs
        shell: bash
        working-directory: target
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P01_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$P01_TREE"
          test -z "$(git status --porcelain)"
          test "$(git hash-object composer.json)" = 67f056f508636f59f5fff1c078b2ec497b0baf49
          test "$(git hash-object package.json)" = 7ea28678c37964f9b4f2e7fee3e857f7110d9ebf
          test ! -e .env
          test ! -L composer.json
          test ! -L package.json
          echo P01_EXACT_RESOLVER_INPUT=PASS
      - name: Official PHP compatibility runtime and exact Composer
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          tools: composer:2.11.3
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_mysql, dom, xml, curl, zip, openssl, sodium, pcntl, posix
          coverage: none
      - name: Exact Node toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
      - name: Install exact resolver and assert real executable versions
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          php -r 'exit((getenv("P01_PHP")==="8.4" && PHP_VERSION_ID>=80428 && PHP_VERSION_ID<80500)||(getenv("P01_PHP")==="8.5" && PHP_VERSION_ID>=80513 && PHP_VERSION_ID<80600)?0:2);'
          test "$(node --version)" = v24.22.3
          composer --no-plugins --no-scripts --no-ansi --version | grep -Eq '^Composer version 2\.11\.3( |$)'
          mkdir -p "$RUNNER_TEMP/p01-resolver-tools"
          if ! npm install --prefix "$RUNNER_TEMP/p01-resolver-tools" --ignore-scripts --save-exact --no-fund pnpm@11.29.0 > "$RUNNER_TEMP/p01-bootstrap.log" 2>&1; then
            echo P01_PNPM_BOOTSTRAP=FAIL
            exit 1
          fi
          test "$("$RUNNER_TEMP/p01-resolver-tools/node_modules/.bin/pnpm" --version)" = 11.29.0
          printf '%s\n' "$RUNNER_TEMP/p01-resolver-tools/node_modules/.bin" >> "$GITHUB_PATH"
          echo P01_REAL_RESOLVER_TOOLS=PASS
      - name: Original legacy tests using locked browser dependency
        working-directory: target
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          test "$(git -C ../legacy rev-parse HEAD)" = 158c3d75378c235720727fe9f29fb28e02e7b6c9
          test -z "$(git -C ../legacy status --porcelain)"
          test "$(git hash-object pnpm-lock.yaml)" = 0d2d9c2386a96802cc5ba8b737a2dca56e1a2026
          test ! -e ../legacy/src/app/.runtime.php
          scope="$RUNNER_TEMP/p01-evidence"
          mkdir -p "$scope"
          export PLAYWRIGHT_BROWSERS_PATH="$scope/browsers"
          if ! pnpm install --frozen-lockfile --ignore-scripts --store-dir "$RUNNER_TEMP/p01-pnpm-store" >"$scope/pnpm.log" 2>&1; then echo P01_LEGACY_LOCKED_BROWSER_DEPENDENCY=FAIL; exit 1; fi
          if ! pnpm exec playwright install --with-deps chromium >"$scope/chromium.log" 2>&1; then echo P01_LEGACY_CHROMIUM=FAIL; exit 1; fi
          echo P01_LEGACY_LOCKED_BROWSER_DEPENDENCY=PASS
          python3 -B - <<'PY'
          import contextlib,html,http.cookiejar,os,pathlib,re,secrets,shutil,socket,subprocess,tempfile,time,urllib.request,urllib.parse
          from pathlib import Path
          workspace=Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          target=Path.cwd().resolve()
          legacy=workspace/"legacy"
          assert target==workspace/"target" and not (legacy/"src/app/.runtime.php").exists()
          scripts=legacy/"tests/integration"
          testroot=target/".git/p01-legacy-original"
          copy=testroot/"tests/integration"
          copy.mkdir(mode=0o700,parents=True)
          (testroot/"src").symlink_to(legacy/"src",target_is_directory=True)
          modules=target/"node_modules/.pnpm/node_modules"
          assert (modules/"playwright/package.json").is_file()
          (testroot/"node_modules").symlink_to(modules,target_is_directory=True)
          # Copy original test programs verbatim, never mutate the legacy checkout.
          specs=[
            ("channel","p01-ia6-channel-","",["p01_channels_130_parity_fixture.php"],["channels_directory_trash_browser.mjs","channels_undo_inline_browser.mjs"]),
            ("crud","p01-ia6-crud-","",[],["p01_ia6_crud_inline_owner_browser.mjs"]),
          ]
          allow=re.compile(r"^P01_[A-Z0-9_]+=(?:PASS|TRUE)$")
          failures=[]
          def execute(path,env,cwd):
              cmd={"php":["php"],"py":["python3","-B"],"mjs":["node"]}[path.suffix[1:]]
              result=subprocess.run(cmd+[str(path)],cwd=cwd,env=env,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=180)
              raw=result.stdout.decode(errors="replace")
              for line in raw.splitlines():
                  if allow.fullmatch(line): print(line,flush=True)
                  elif line.startswith("P01_CHANNEL_DIRECTORY_TRASH_BROWSER=PASS "): print("P01_CHANNEL_DIRECTORY_TRASH_BROWSER=PASS",flush=True)
              if result.returncode:
                  print("P01_LEGACY_FAILURE_KIND="+("TIMEOUT" if "TimeoutError" in raw else "ASSERTION" if "AssertionError" in raw else "OTHER"),flush=True)
                  for x in re.findall(r"(?:p01_[a-z0-9_]+|channels_[a-z0-9_]+)\.mjs:[0-9]{1,4}:[0-9]{1,4}",raw)[:3]: print("P01_LEGACY_FAILURE_LOCATION="+x,flush=True)
              return result.returncode==0
          for stage,prefix,ack,fixtures,programs in specs:
              print("P01_LEGACY_STAGE_START="+stage.upper(),flush=True)
              # Each old test receives a distinct fresh installation. No old data.
              root=Path(tempfile.mkdtemp(prefix=prefix,dir="/tmp"))
              server=None
              try:
                  assert root.parent==Path("/tmp") and not root.is_symlink() and re.fullmatch(r"[a-z0-9_-]+",root.name)
                  shutil.copytree(legacy/"src",root,dirs_exist_ok=True)
                  assert not (root/"app/.runtime.php").exists()
                  with socket.socket() as sock:
                      sock.bind(("127.0.0.1",0));port=sock.getsockname()[1]
                  origin="http://127.0.0.1:"+str(port)
                  password="Synthetic-"+secrets.token_hex(24)
                  env={"PATH":os.environ["PATH"],"HOME":str(root),"VF_SETUP_REQUIRE_KEY":"0","P01_TEST_ORIGIN":origin,"P01_TEST_PASSWORD":password,"VF_E2E_RUNTIME_ROOT":str(root),"VF_IA6_DISPOSABLE_ACK":ack,"P01_SYNTHETIC_CHANNEL_PARITY":"YES","P01_CHANNEL_SITE_ROOT":str(root),"PLAYWRIGHT_BROWSERS_PATH":os.environ["PLAYWRIGHT_BROWSERS_PATH"]}
                  with (root/"qa-http.log").open("wb") as log:
                      server=subprocess.Popen(["php","-S","127.0.0.1:"+str(port),"-t",str(root)],cwd=root,env=env,stdout=log,stderr=log)
                      client=urllib.request.build_opener(urllib.request.ProxyHandler({}),urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
                      for attempt in range(100):
                          assert server.poll() is None
                          try:
                              with client.open(origin+"/setup.php",timeout=2) as response: body=response.read(2*1024*1024).decode()
                              break
                          except OSError:time.sleep(.2)
                      else:raise RuntimeError("OLD_SETUP_NOT_READY")
                      nonce=re.search(r'name="setup_csrf" value="([a-f0-9]{48})"',body)
                      assert nonce
                      form=urllib.parse.urlencode({"setup_csrf":nonce.group(1),"site_title":"P01 synthetic legacy baseline","admin_password":password,"admin_password_confirm":password}).encode()
                      with client.open(origin+"/setup.php",data=form,timeout=60) as response: response.read(2*1024*1024)
                      assert (root/"app/.runtime.php").is_file()
                      witness=subprocess.run(["php","-r",'require $argv[1]."/app/bootstrap.php"; exit(vf_is_installed() && str_starts_with((string)realpath(VF_PRIVATE_ROOT),$argv[1]."/.vfnav-data-") && (int)vf_db()->query("SELECT COUNT(*) FROM links")->fetchColumn()===0 ? 0:2);',str(root)],env=env,cwd=root,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=30)
                      assert witness.returncode==0
                      print("P01_LEGACY_SYNTHETIC_INSTALL_"+stage.upper()+"=PASS",flush=True)
                      for fixture in fixtures:
                          if not execute(scripts/fixture,env,root):raise RuntimeError("ORIGINAL_FIXTURE_FAILED")
                      ok=True
                      for program in programs:
                          out=copy/program;shutil.copyfile(scripts/program,out)
                          assert out.read_bytes()==(scripts/program).read_bytes()
                          # Original legacy channel tests predate same-page confirmation.
                          # Adjust only the obsolete interaction in the disposable copy.
                          # Preserve the original guest/cancel/trash/restore/geometry assertions.
                          if program=="channels_directory_trash_browser.mjs":
                              raw=out.read_text()
                              start=raw.index(" let dialogs=0;")
                              end=raw.index(" await page.waitForLoadState('domcontentloaded');",start)
                              raw=raw[:start]+"""
           let dialogs=0;
           page.on('dialog',async d=>{dialogs++;await d.dismiss();});
           await menu.locator('[data-delete-id]').click();
           const decision=page.getByRole('group',{name:'确认回收站操作',exact:true});
           await decision.waitFor();
           assert.equal(await page.locator('[data-asset-row="'+id+'"]').count(),1);
           await decision.getByRole('button',{name:'取消',exact:true}).click();
           await decision.waitFor({state:'hidden'});
           assert.equal(await page.locator('[data-asset-row="'+id+'"]').count(),1);
           if(!(await menu.locator('[data-delete-id]').isVisible()))await menu.locator('summary').click();
           await menu.locator('[data-delete-id]').click();
           await decision.waitFor();
           await decision.getByRole('button',{name:'确认移入回收站',exact:true}).click();
           await page.locator('[data-asset-row="'+id+'"]').waitFor({state:'detached'});
           assert.equal(dialogs,0,'Inline confirmation must not open a native dialog');
           """+raw[end:]
                              out.write_text(raw)
                          elif program=="channels_undo_inline_browser.mjs":
                              raw=out.read_text()
                              start=raw.index("  page.once('dialog',")
                              end=raw.index("  const undo=",start)
                              raw=raw[:start]+"""
           let dialogs=0;
           page.on('dialog',async d=>{dialogs++;await d.dismiss();});
           await row.locator('[data-delete-id]').click();
           const decision=page.getByRole('group',{name:'确认回收站操作',exact:true});
           await decision.waitFor();
           await decision.getByRole('button',{name:'确认移入回收站',exact:true}).click();
           assert.equal(dialogs,0,'Inline confirmation must not open a native dialog');
           """+raw[end:]
                              out.write_text(raw)
                          result=execute(out,env,root)
                          print("P01_LEGACY_ORIGINAL_"+program.removesuffix(".mjs").upper()+"="+("PASS" if result else "FAIL"),flush=True)
                          ok=ok and result
                      if not ok:failures.append(stage)
              except Exception as error:
                  failures.append(stage)
                  print("P01_LEGACY_STAGE_FAILURE="+stage.upper()+":"+("TIMEOUT" if isinstance(error,subprocess.TimeoutExpired) else "ASSERTION" if isinstance(error,AssertionError) else "OTHER"),flush=True)
              finally:
                  if server:
                      server.terminate()
                      try:server.wait(timeout=5)
                      except subprocess.TimeoutExpired:server.kill();server.wait()
                  assert root.parent==Path("/tmp") and root.name.startswith(prefix) and not root.is_symlink()
                  shutil.rmtree(root)
                  assert not root.exists()
                  print("P01_LEGACY_CLEANUP_"+stage.upper()+"=PASS",flush=True)
          assert not failures
          print("P01_LEGACY_POPULATED_BASELINE=PASS")
          PY
      - name: Always remove only run-owned private inputs
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          rm -rf -- target legacy "$RUNNER_TEMP/p01-resolver-tools" "$RUNNER_TEMP/p01-evidence" "$RUNNER_TEMP/p01-pnpm-store"
          rm -f -- "$RUNNER_TEMP/p01-bootstrap.log"
          test ! -e target && test ! -e legacy
          echo P01_PRIVATE_REGRESSION_CLEANUP=PASS
