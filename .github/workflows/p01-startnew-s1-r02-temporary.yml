name: TEMP P01 targeted native witness and encrypted recovery regression
on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/p01-startnew-s1-r02-temporary.yml
permissions:
  contents: read
concurrency:
  group: p01-native-witness-4de38ec2
  cancel-in-progress: false
jobs:
  product:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.actor == 'llhzx2018' &&
      github.triggering_actor == 'llhzx2018' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/p01-installed-native-sql-replay-20261128'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {php: '8.4', engine: mysql}
          - {php: '8.5', engine: mariadb}
    env:
      P01_SOURCE: 4de38ec2813f1ffce01fe0af7f4572888acfe1ec
      P01_TREE: 6de37c7c7f76e92496b6517ebd9e9667e9684178
      P01_PHP: ${{ matrix.php }}
      P01_ENGINE: ${{ matrix.engine }}
    steps:
      - name: Transient exact P01 source without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-startnew
          ref: ${{ env.P01_SOURCE }}
          path: target
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact private inputs
        shell: bash
        working-directory: target
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P01_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$P01_TREE"
          test -z "$(git status --porcelain)"
          test "$(git hash-object composer.json)" = 67f056f508636f59f5fff1c078b2ec497b0baf49
          test "$(git hash-object package.json)" = 7ea28678c37964f9b4f2e7fee3e857f7110d9ebf
          test ! -e .env
          test ! -L composer.json
          test ! -L package.json
          echo P01_EXACT_RESOLVER_INPUT=PASS
      - name: Official PHP compatibility runtime for changed recovery source
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          tools: none
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_mysql, dom, xml, curl, zip, openssl, sodium, pcntl, posix
          coverage: none
      - name: Changed source recovery protocol only (no application build)
        shell: bash
        working-directory: target
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          test "$(git rev-parse HEAD)" = "$P01_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$P01_TREE"
          test "$(git hash-object app/Modules/Operations/Infrastructure/InstalledSqlSourceWitness.php)" = 6a8c9eb5ff2b980ae8e1b212ed914830fcb9f8ab
          test "$(git hash-object app/Modules/Operations/Infrastructure/IsolatedRecoveryCycle.php)" = 874dc4592af757f1247591d7987153ac13871b17
          test "$(git hash-object tests/evolution/test_installed_sql_witness_native.php)" = e3c0bfd191961031a9cc828ca92fc0fe4ed09839
          php -r 'exit(((getenv("P01_PHP")==="8.4" && PHP_VERSION_ID>=80428 && PHP_VERSION_ID<80500)||(getenv("P01_PHP")==="8.5" && PHP_VERSION_ID>=80513 && PHP_VERSION_ID<80600))&&extension_loaded("pdo_mysql")&&extension_loaded("sodium")?0:2);'
          mkdir -m 700 "$RUNNER_TEMP/p01-witness-evidence"
          for f in test_isolated_database_restore.php test_isolated_recovery_cycle.php; do
            php -l "tests/evolution/$f" >/dev/null
            if php "tests/evolution/$f" >"$RUNNER_TEMP/p01-witness-evidence/$f.log" 2>&1; then
              printf '%s_ASSERTIONS=%s\n' "$f" "$(grep -c '^PASS ' "$RUNNER_TEMP/p01-witness-evidence/$f.log")"
            else
              printf '%s=FAIL\n' "$f"
              exit 1
            fi
          done
          php -l tests/evolution/test_installed_sql_witness_native.php >/dev/null
          echo P01_CHANGED_RECOVERY_PROTOCOL=PASS
      - name: Actual native engine schema and row witness regression
        if: always() && !cancelled()
        shell: bash
        working-directory: target
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          test "$(git rev-parse HEAD)" = "$P01_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$P01_TREE"
          test "$(git hash-object tests/evolution/test_installed_sql_witness_native.php)" = e3c0bfd191961031a9cc828ca92fc0fe4ed09839
          python3 -I -B - <<'PY'
          import json,os,re,secrets,subprocess,time
          engine=os.environ["P01_ENGINE"]; minor=os.environ["P01_PHP"]
          assert (engine,minor) in {("mysql","8.4"),("mariadb","8.5")}
          name="vf-p01-witness-"+os.environ["GITHUB_RUN_ID"]+"-"+engine
          def docker(args,timeout=90):
              return subprocess.run(["docker",*args],capture_output=True,text=True,timeout=timeout,check=True).stdout
          def owned():
              r=subprocess.run(["docker","inspect",name],capture_output=True,text=True,timeout=15)
              if r.returncode:return None
              info=json.loads(r.stdout)[0]
              assert info["Config"]["Labels"].get("vf-p01-witness")==name
              assert not info["HostConfig"]["Privileged"] and not info["HostConfig"]["Binds"]
              assert info["HostConfig"]["PortBindings"]=={"3306/tcp":[{"HostIp":"127.0.0.1","HostPort":"3306"}]}
              return info["Id"]
          try:
              assert owned() is None
              prefix="MYSQL" if engine=="mysql" else "MARIADB"
              image="mysql:8.4" if engine=="mysql" else "mariadb:11.8"
              db="vfstartnew_test_full_"+secrets.token_hex(4); pw=secrets.token_hex(24); rootpw=secrets.token_hex(24)
              docker(["run","--rm","-d","--name",name,"--label","vf-p01-witness="+name,"--publish","127.0.0.1:3306:3306","--memory","1536m","--cpus","2","--pids-limit","256","-e",prefix+"_ROOT_PASSWORD="+rootpw,"-e",prefix+"_DATABASE="+db,"-e",prefix+"_USER="+db,"-e",prefix+"_PASSWORD="+pw,image],180)
              assert owned()
              cfg={"driver":engine,"host":"127.0.0.1","port":3306,"database":db,"username":db,"password":pw}
              deadline=time.monotonic()+180
              code='try{$c=json_decode(stream_get_contents(STDIN),true);$d=new PDO("mysql:host=127.0.0.1;port=3306;dbname=".$c["database"],$c["username"],$c["password"],[PDO::ATTR_TIMEOUT=>5]);echo $d->query("SELECT VERSION()")->fetchColumn();}catch(Throwable $e){exit(2);}'
              while True:
                  probe=subprocess.run(["php","-r",code],input=json.dumps(cfg),capture_output=True,text=True,timeout=8)
                  if probe.returncode==0:
                      v=probe.stdout.lower()
                      assert (v.startswith("8.4.") and "mariadb" not in v) if engine=="mysql" else (v.startswith("11.8.") and "mariadb" in v)
                      print("P01_NATIVE_ENGINE=PASS:"+engine,flush=True);break
                  assert time.monotonic()<deadline,"DB_NOT_READY";time.sleep(2)
              env={**os.environ,"APP_ENV":"testing","P01_FULL_SYNTHETIC_DB_JSON":json.dumps(cfg)}
              result=subprocess.run(["php","tests/evolution/test_installed_sql_witness_native.php"],env=env,capture_output=True,text=True,timeout=90)
              for line in result.stdout.splitlines():
                  if re.fullmatch(r"P01_NATIVE_(?:WITNESS_(?:COUNTER|COLUMN_COMMENT|TABLE_COMMENT|DEFAULT|ROW_BYTES)=PASS|SQL_WITNESS=PASS:(?:mysql|mariadb)|SQL_WITNESS_FAILURE=(?:ADMISSION|FIXTURE|COUNTER_ONLY|COLUMN_COMMENT|TABLE_COMMENT|DEFAULT|ROW_BYTES))",line):
                      print(line,flush=True)
              assert result.returncode==0 and "P01_NATIVE_SQL_WITNESS=PASS:"+engine in result.stdout.splitlines()
          finally:
              cid=owned()
              if cid:docker(["rm","-f","-v",cid],60)
              assert owned() is None
              print("P01_OWNED_DB_CLEANUP=PASS",flush=True)
          PY
      - name: Always remove only run-owned private inputs
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          name="vf-p01-witness-$GITHUB_RUN_ID-$P01_ENGINE"
          if docker inspect "$name" >/dev/null 2>&1; then
            test "$(docker inspect --format '{{ index .Config.Labels "vf-p01-witness" }}' "$name")" = "$name"
            docker rm -f -v "$name" >/dev/null
          fi
          rm -rf -- target "$RUNNER_TEMP/p01-witness-evidence"
          test ! -e target && test ! -e "$RUNNER_TEMP/p01-witness-evidence"
          echo P01_PRIVATE_REGRESSION_CLEANUP=PASS
