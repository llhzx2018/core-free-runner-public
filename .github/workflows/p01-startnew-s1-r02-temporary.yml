name: TEMP P01 normal FULL HTTPS three-engine installation
on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/p01-startnew-s1-r02-temporary.yml
permissions:
  contents: read
concurrency:
  group: p01-normal-install-acbd76b3
  cancel-in-progress: false
jobs:
  product:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.actor == 'llhzx2018' &&
      github.triggering_actor == 'llhzx2018' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/p01-startnew-install-fault-s5-strict-20261128'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {php: '8.4', engine: sqlite}
          - {php: '8.4', engine: mysql}
          - {php: '8.5', engine: mariadb}
    env:
      P01_SOURCE: acbd76b3826d054a88c1c2b987a6da010f60be20
      P01_TREE: bbb8c670e8368cbad6aa92abacf00e40c81a1cf7
      GOV_SOURCE: f7e967fc6fa590942b7cecfb1407ec25f1eaf320
      P01_PHP: ${{ matrix.php }}
      P01_ENGINE: ${{ matrix.engine }}
    steps:
      - name: Transient exact P01 source without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-startnew
          ref: ${{ env.P01_SOURCE }}
          path: target
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact private inputs
        shell: bash
        working-directory: target
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P01_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$P01_TREE"
          test -z "$(git status --porcelain)"
          test "$(git hash-object composer.json)" = 67f056f508636f59f5fff1c078b2ec497b0baf49
          test "$(git hash-object package.json)" = 7ea28678c37964f9b4f2e7fee3e857f7110d9ebf
          test ! -e .env
          test ! -L composer.json
          test ! -L package.json
          echo P01_EXACT_RESOLVER_INPUT=PASS
      - name: Official PHP compatibility runtime and exact Composer
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          tools: composer:2.11.3
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_mysql, dom, xml, curl, zip, openssl, sodium, pcntl, posix
          coverage: none
      - name: R06 original source guards and exact failure names
        if: matrix.engine == 'sqlite'
        working-directory: target
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          scope="$RUNNER_TEMP/p01-evidence"
          mkdir -p "$scope"
          rc=0
          python3 -B -m unittest discover -s tests -p test_installer_source.py -v >"$scope/source-guards.log" 2>&1 || rc=$?
          python3 - "$scope/source-guards.log" <<'PY'
          import pathlib,re,sys
          raw=pathlib.Path(sys.argv[1]).read_text(errors="replace")
          for line in raw.splitlines():
              m=re.match(r"^(test_[a-z0-9_]+) \(test_installer_source\.[A-Za-z0-9_.]+\) \.\.\. (ok|FAIL|ERROR)$",line)
              if m:print("P01_R06_SOURCE_TEST="+m[1]+":"+m[2].upper())
              if re.fullmatch(r"Ran [0-9]+ tests? in [0-9.]+s",line):print("P01_R06_SOURCE_TEST_COUNT="+line.split()[1])
              if line.startswith("FAIL: ") or line.startswith("ERROR: "):
                  m=re.match(r"^(FAIL|ERROR): (test_[a-z0-9_]+) ",line)
                  if m:print("P01_R06_SOURCE_FAILURE="+m[2]+":"+m[1])
          for marker in ("UPDATE_OWNER_ROUTE_MISSING","UPDATE_OWNER_UI_SAFETY_MISSING","INSTALL_NORMAL_ADMISSION_GUARD_MISSING","INSTALL_NORMAL_FULL_INVENTORY_GUARD_MISSING","INSTALL_SOURCE_INCOMPLETE","INSTALL_OPTIONAL_TOKEN_BEFORE_CLAIM"):
              if marker in raw and "FAILED (" in raw: print("P01_R06_SOURCE_MARKER="+marker)
          PY
          test "$rc" = 0
          echo P01_R06_ORIGINAL_SOURCE_GUARDS=PASS
      - name: Exact Node toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
      - name: Install exact resolver and assert real executable versions
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          php -r 'exit((getenv("P01_PHP")==="8.4" && PHP_VERSION_ID>=80428 && PHP_VERSION_ID<80500)||(getenv("P01_PHP")==="8.5" && PHP_VERSION_ID>=80513 && PHP_VERSION_ID<80600)?0:2);'
          test "$(node --version)" = v24.22.3
          composer --no-plugins --no-scripts --no-ansi --version | grep -Eq '^Composer version 2\.11\.3( |$)'
          mkdir -p "$RUNNER_TEMP/p01-resolver-tools"
          if ! npm install --prefix "$RUNNER_TEMP/p01-resolver-tools" --ignore-scripts --save-exact --no-fund pnpm@11.29.0 > "$RUNNER_TEMP/p01-bootstrap.log" 2>&1; then
            echo P01_PNPM_BOOTSTRAP=FAIL
            exit 1
          fi
          test "$("$RUNNER_TEMP/p01-resolver-tools/node_modules/.bin/pnpm" --version)" = 11.29.0
          printf '%s\n' "$RUNNER_TEMP/p01-resolver-tools/node_modules/.bin" >> "$GITHUB_PATH"
          echo P01_REAL_RESOLVER_TOOLS=PASS
      - name: Transient trusted GOV baseline checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: ${{ env.GOV_SOURCE }}
          path: authority
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Real frozen dependency install and canonical version gate
        working-directory: target
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          test "$(git rev-parse HEAD)" = "$P01_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$P01_TREE"
          test "$(git hash-object composer.lock)" = b4b7dbd432f45a8190df282a669560a93ae2dff9
          test "$(git hash-object pnpm-lock.yaml)" = 0d2d9c2386a96802cc5ba8b737a2dca56e1a2026
          test ! -e package-lock.json
          test "$(git -C ../authority rev-parse HEAD)" = "$GOV_SOURCE"
          test "$(git -C ../authority hash-object governance/agent/validate_repository_entry.py)" = 664a1404890399c13b79d33e5faf9673d281cb64
          test "$(git -C ../authority hash-object governance/agent/VF_WEB_APP_TECHNOLOGY_BASELINE_V1.json)" = 3f7c88c5c437cd19ec3d01a58b1ed44023cd3325
          mkdir -p "$RUNNER_TEMP/p01-evidence"
          phase() {
            local label="$1"; shift
            local log="$RUNNER_TEMP/p01-evidence/$label.log"
            if "$@" >"$log" 2>&1; then echo "$label=PASS"; return; fi
            if grep -Eiq 'could not resolve host|temporary failure in name resolution|EAI_AGAIN|ECONNRESET|ETIMEDOUT|connection timed out|connection reset by peer' "$log" && ! grep -Eiq '401|403|404|certificate|integrity|checksum|authentication|authorization|permission denied|security advisory|security advisories' "$log"; then
              echo "$label=TRANSIENT_RETRY_ONCE"
              sleep 90
              if "$@" >"$log" 2>&1; then echo "$label=PASS"; return; fi
            fi
            echo "$label=FAIL"
            exit 1
          }
          phase P01_LOCK_PROVENANCE python3 -B scripts/check_dependency_lock.py
          phase P01_COMPOSER_FROZEN composer install --no-plugins --no-scripts --no-interaction --prefer-dist --no-progress
          phase P01_COMPOSER_PLATFORM composer --no-plugins --no-scripts check-platform-reqs
          phase P01_PNPM_FROZEN pnpm install --frozen-lockfile --ignore-scripts --store-dir "$RUNNER_TEMP/p01-pnpm-store"
          phase P01_CANONICAL_GATE python3 -E -s -B ../authority/governance/agent/validate_repository_entry.py --gov-root "$GITHUB_WORKSPACE/authority" --web-stack-root "$GITHUB_WORKSPACE/target"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"p01-evidence/P01_CANONICAL_GATE.log").read_text())
          assert r.get("result")=="VERSION_CHECK_PASS" and r.get("pnpm_lock_and_runtime")=="CHECKED" and not r.get("errors")
          print("P01_REAL_VERSION_GATE=PASS:"+os.environ["P01_PHP"]+":"+os.environ["P01_ENGINE"])
          PY
          git diff --exit-code
      - name: Build frontend assets for actual FULL
        working-directory: target
        shell: bash
        id: frontend
        run: |
          set -Eeuo pipefail
          set +x
          if ! pnpm run build >"$RUNNER_TEMP/p01-evidence/full-vite.log" 2>&1; then
            echo P01_FULL_VITE=FAIL; exit 1
          fi
          echo P01_FULL_VITE=PASS
      - name: Actual normal FULL HTTPS native installation
        if: steps.frontend.outcome == 'success'
        working-directory: target
        shell: bash
        id: full
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          set +x
          scope="$RUNNER_TEMP/p01-evidence"
          full="$RUNNER_TEMP/p01-full-source"
          archive="$RUNNER_TEMP/p01-full.zip"
          phase() {
            local label="$1"; shift
            if "$@" >"$scope/$label.log" 2>&1; then echo "$label=PASS"; else echo "$label=FAIL"; return 1; fi
          }
          git clone --local --no-hardlinks --no-checkout --no-recurse-submodules "$PWD" "$full" >"$scope/full-clone.log" 2>&1
          git -C "$full" checkout --detach "$P01_SOURCE" >"$scope/full-checkout.log" 2>&1
          test "$(git -C "$full" rev-parse HEAD^{tree})" = "$P01_TREE"
          mkdir -p "$full/public/build"
          cp -a public/build/. "$full/public/build/"
          cd "$full"
          phase P01_FULL_PROD_VENDOR composer install --no-dev --no-scripts --no-plugins --no-interaction --prefer-dist --no-progress
          phase P01_FULL_PLATFORM composer --no-plugins --no-scripts check-platform-reqs --no-dev
          phase P01_FULL_BUILD python3 -B scripts/build_clean_full.py --root "$full" --output "$archive" --source-sha "$P01_SOURCE" --installation-profile normal
          if ! command -v certutil >/dev/null; then
            phase P01_TLS_CLIENT_TOOLS sudo apt-get install -y --no-install-recommends libnss3-tools
          fi
          command -v certutil >/dev/null
          command -v openssl >/dev/null
          sha="$(sha256sum "$archive" | cut -d' ' -f1)"
          python3 - "$archive" "$sha" <<'PY'
          import os,json,secrets,subprocess,sys,time,shutil,re
          from pathlib import Path
          engine=os.environ["P01_ENGINE"]; minor=os.environ["P01_PHP"]
          assert engine in {"sqlite","mysql","mariadb"}
          scope=Path(os.environ["RUNNER_TEMP"])/"p01-evidence"
          name="vf-p01-regression-"+os.environ["GITHUB_RUN_ID"]+"-"+minor.replace(".","")+engine
          def docker(args,timeout=90):
              return subprocess.run(["docker",*args],capture_output=True,text=True,timeout=timeout,check=True).stdout
          def owned():
              r=subprocess.run(["docker","inspect",name],capture_output=True,text=True,timeout=15)
              if r.returncode:return None
              info=json.loads(r.stdout)[0]
              assert info["Config"]["Labels"].get("vf-p01-regression")==name
              assert not info["HostConfig"].get("Privileged") and not info["HostConfig"].get("Binds")
              assert info["HostConfig"]["PortBindings"]=={"3306/tcp":[{"HostIp":"127.0.0.1","HostPort":"3306"}]}
              return info["Id"]
          env=dict(os.environ)
          try:
              if engine!="sqlite":
                  assert owned() is None
                  cli="mysql" if engine=="mysql" else "mariadb"
                  dump="mysqldump" if engine=="mysql" else "mariadb-dump"
                  if not shutil.which(cli) or not shutil.which(dump):
                      for label,args in [("UPDATE",["sudo","apt-get","-o","Acquire::Retries=0","-o","Acquire::http::Timeout=90","-o","Acquire::https::Timeout=90","update"]),("INSTALL",["sudo","apt-get","-o","Acquire::Retries=0","-o","Acquire::http::Timeout=90","-o","Acquire::https::Timeout=90","install","-y","--no-install-recommends","mysql-client" if engine=="mysql" else "mariadb-client"])]:
                          for attempt in range(2):
                              proc=subprocess.run(args,capture_output=True,timeout=300)
                              if proc.returncode==0:break
                              transient=re.search(rb"(?i)temporary failure resolving|connection timed out|could not connect|connection reset by peer",proc.stdout+proc.stderr)
                              if attempt==0 and transient:
                                  time.sleep(90);continue
                              raise SystemExit("P01_NATIVE_CLIENT_"+label+"_FAIL")
                  assert shutil.which(cli) and shutil.which(dump)
                  prefix="MYSQL" if engine=="mysql" else "MARIADB"
                  image="mysql:8.4" if engine=="mysql" else "mariadb:11.8"
                  db="vfstartnew_test_full_"+secrets.token_hex(4); pw=secrets.token_hex(24); rootpw=secrets.token_hex(24)
                  docker(["run","--rm","-d","--name",name,"--label","vf-p01-regression="+name,"--publish","127.0.0.1:3306:3306","--memory","1536m","--cpus","2","--pids-limit","256","-e",prefix+"_ROOT_PASSWORD="+rootpw,"-e",prefix+"_DATABASE="+db,"-e",prefix+"_USER="+db,"-e",prefix+"_PASSWORD="+pw,image],180)
                  assert owned()
                  cfg={"driver":engine,"host":"127.0.0.1","port":3306,"database":db,"username":db,"password":pw}
                  env["P01_FULL_SYNTHETIC_DB_JSON"]=json.dumps(cfg)
                  deadline=time.monotonic()+180
                  code='try{$c=json_decode(stream_get_contents(STDIN),true);$d=new PDO("mysql:host=127.0.0.1;port=3306;dbname=".$c["database"],$c["username"],$c["password"],[PDO::ATTR_TIMEOUT=>5]);echo $d->query("SELECT VERSION()")->fetchColumn();}catch(Throwable $e){exit(2);}'
                  while True:
                      probe=subprocess.run(["php","-r",code],input=json.dumps(cfg),capture_output=True,text=True,timeout=8)
                      if probe.returncode==0:
                          v=probe.stdout.lower()
                          assert (v.startswith("8.4.") and "mariadb" not in v) if engine=="mysql" else (v.startswith("11.8.") and "mariadb" in v)
                          print("P01_FULL_NATIVE_ENGINE=PASS:"+engine,flush=True);break
                      assert time.monotonic()<deadline,"FULL_DB_NOT_READY";time.sleep(2)
              target=Path(os.environ["GITHUB_WORKSPACE"])/"target"
              args=["python3","-B",str(target/"scripts/verify_clean_full_install.py"),"--archive",sys.argv[1],"--source-sha",os.environ["P01_SOURCE"],"--sha256",sys.argv[2],"--engine",engine]
              args.append("--normal-install")
              with (scope/"full-runtime.log").open("wb") as out:
                  proc=subprocess.run(args,env=env,stdout=out,stderr=subprocess.STDOUT,timeout=420)
              if proc.returncode:
                  import re
                  raw=(scope/"full-runtime.log").read_text(errors="replace")
                  for line in raw.splitlines():
                      if re.fullmatch(r"P01_SQL_DIAG_(?:INSERT_SYNTHETIC|INSERT_OTHER|COMMENT|DDL|OTHER|OTHER_TUPLE_SYNTHETIC|OTHER_TUPLE_OTHER|OTHER_SET|OTHER_VALUES|OTHER_INSERT|OTHER_UNCLASSIFIED|SOURCE_UNCHANGED|SCHEMA_MISMATCH|ROWS_MISMATCH|COUNT_MISMATCH|UNAVAILABLE)=[0-9]{1,6}",line): print(line,flush=True)
                  codes=re.findall(r"RuntimeError: ([A-Z_0-9]{3,80})",raw)
                  print("P01_FULL_RUNTIME_FAILURE="+(codes[-1] if codes else "UNCLASSIFIED"),flush=True)
                  raise SystemExit("P01_FULL_RUNTIME=FAIL")
              result=json.loads((scope/"full-runtime.log").read_text())
              assert result["status"]=="FULL_RUNTIME_PASS" and result["scope"]=="ISOLATED_NORMAL_ENV_HTTPS" and result["engine"]==engine and result["source_sha"]==os.environ["P01_SOURCE"] and result["archive_sha256"]==sys.argv[2] and result["production_install_authorized"] is False
              proof=result["normal_install_receipt"]
              for key in ("production_app_env","canonical_https","exact_extracted_full","tamper_refused_before_write","dev_profile_refused","login_and_reclaim_protection"):
                  assert proof[key] is True
              assert proof["dev_claim"] is False and proof["engine"]==engine
              print("P01_R06_NORMAL_FULL_SHA256="+sys.argv[2],flush=True)
              print("P01_R06_NORMAL_HTTPS_INSTALL=PASS:"+engine,flush=True)
          finally:
              if engine!="sqlite":
                  cid=owned()
                  if cid:docker(["rm","-f","-v",cid],60)
                  assert owned() is None
                  print("P01_OWNED_DB_CLEANUP=PASS",flush=True)
          PY
      - name: Always remove only run-owned private inputs and synthetic resources
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          name="vf-p01-regression-$GITHUB_RUN_ID-$(printf '%s' "$P01_PHP" | tr -d .)$P01_ENGINE"
          if docker inspect "$name" >/dev/null 2>&1; then
            test "$(docker inspect --format '{{ index .Config.Labels "vf-p01-regression" }}' "$name")" = "$name"
            docker rm -f -v "$name" >/dev/null
          fi
          rm -rf -- target authority "$RUNNER_TEMP/p01-resolver-tools" "$RUNNER_TEMP/p01-evidence" "$RUNNER_TEMP/p01-pnpm-store" "$RUNNER_TEMP/p01-full-source" "$RUNNER_TEMP/p01-full.zip"
          rm -f -- "$RUNNER_TEMP/p01-bootstrap.log"
          test ! -e target && test ! -e authority
          echo P01_PRIVATE_REGRESSION_CLEANUP=PASS
      - name: Preserve actual FULL runtime outcome
        if: always()
        shell: bash
        env:
          FULL: ${{ steps.full.outcome }}
        run: |
          set -Eeuo pipefail
          test "$FULL" = success
          echo P01_FULL_PHASES=PASS
