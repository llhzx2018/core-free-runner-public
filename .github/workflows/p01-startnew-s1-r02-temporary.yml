name: TEMP P01 Inbox repeat capture S6 and actual extension authorization
on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/p01-startnew-s1-r02-temporary.yml
permissions:
  contents: read
concurrency:
  group: p01-capture-s6-helper-4703b172
  cancel-in-progress: false
jobs:
  browser:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.actor == 'llhzx2018' &&
      github.triggering_actor == 'llhzx2018' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/p01-startnew-capture-s6-helper-20261128'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        php: ['8.4']
        engine: [sqlite]
    env:
      P01_SOURCE: 4703b172c57a4b0be915d0df6272cc694f863626
      P01_TREE: 5c620b264f9884594ceb279a03f83776785d5f66
      GOV_SOURCE: 438472239efbb9d5fc07e6cb2bb233133fe5066c
      P01_PHP: ${{ matrix.php }}
      P01_ENGINE: ${{ matrix.engine }}
    steps:
      - name: Transient exact P01 source without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-startnew
          ref: 4703b172c57a4b0be915d0df6272cc694f863626
          path: target
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact private inputs
        shell: bash
        working-directory: target
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P01_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$P01_TREE"
          test -z "$(git status --porcelain)"
          test "$(git hash-object composer.json)" = 67f056f508636f59f5fff1c078b2ec497b0baf49
          test "$(git hash-object package.json)" = 7ea28678c37964f9b4f2e7fee3e857f7110d9ebf
          test ! -e .env
          test ! -L composer.json
          test ! -L package.json
          echo P01_EXACT_RESOLVER_INPUT=PASS
      - name: Official PHP compatibility runtime and exact Composer
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          tools: composer:2.11.3
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_mysql, dom, xml, curl, zip, openssl, sodium, pcntl, posix
          coverage: none
      - name: Exact Node toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
      - name: Install exact resolver and assert real executable versions
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          php -r 'exit((getenv("P01_PHP")==="8.4" && PHP_VERSION_ID>=80428 && PHP_VERSION_ID<80500)||(getenv("P01_PHP")==="8.5" && PHP_VERSION_ID>=80513 && PHP_VERSION_ID<80600)?0:2);'
          test "$(node --version)" = v24.22.3
          composer --no-plugins --no-scripts --no-ansi --version | grep -Eq '^Composer version 2\.11\.3( |$)'
          mkdir -p "$RUNNER_TEMP/p01-resolver-tools"
          if ! npm install --prefix "$RUNNER_TEMP/p01-resolver-tools" --ignore-scripts --save-exact --no-fund pnpm@11.29.0 > "$RUNNER_TEMP/p01-bootstrap.log" 2>&1; then
            echo P01_PNPM_BOOTSTRAP=FAIL
            exit 1
          fi
          test "$("$RUNNER_TEMP/p01-resolver-tools/node_modules/.bin/pnpm" --version)" = 11.29.0
          printf '%s\n' "$RUNNER_TEMP/p01-resolver-tools/node_modules/.bin" >> "$GITHUB_PATH"
          echo P01_REAL_RESOLVER_TOOLS=PASS
      - name: Transient trusted GOV baseline checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 438472239efbb9d5fc07e6cb2bb233133fe5066c
          path: authority
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Real frozen dependency install and canonical version gate
        working-directory: target
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          test "$(git rev-parse HEAD)" = "$P01_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$P01_TREE"
          test "$(git hash-object composer.lock)" = b4b7dbd432f45a8190df282a669560a93ae2dff9
          test "$(git hash-object pnpm-lock.yaml)" = 0d2d9c2386a96802cc5ba8b737a2dca56e1a2026
          test ! -e package-lock.json
          test "$(git -C ../authority rev-parse HEAD)" = "$GOV_SOURCE"
          test "$(git -C ../authority hash-object governance/agent/validate_repository_entry.py)" = 664a1404890399c13b79d33e5faf9673d281cb64
          test "$(git -C ../authority hash-object governance/agent/VF_WEB_APP_TECHNOLOGY_BASELINE_V1.json)" = 3f7c88c5c437cd19ec3d01a58b1ed44023cd3325
          mkdir -p "$RUNNER_TEMP/p01-evidence"
          phase() {
            local label="$1"; shift
            local log="$RUNNER_TEMP/p01-evidence/$label.log"
            if "$@" >"$log" 2>&1; then echo "$label=PASS"; return; fi
            if grep -Eiq 'could not resolve host|temporary failure in name resolution|EAI_AGAIN|ECONNRESET|ETIMEDOUT|connection timed out|connection reset by peer' "$log"; then
              echo "$label=TRANSIENT_RETRY_ONCE"
              sleep 3
              if "$@" >"$log" 2>&1; then echo "$label=PASS"; return; fi
            fi
            echo "$label=FAIL"
            exit 1
          }
          phase P01_LOCK_PROVENANCE python3 -B scripts/check_dependency_lock.py
          phase P01_COMPOSER_FROZEN composer install --no-plugins --no-scripts --no-interaction --prefer-dist --no-progress
          phase P01_COMPOSER_PLATFORM composer --no-plugins --no-scripts check-platform-reqs
          phase P01_PNPM_FROZEN pnpm install --frozen-lockfile --ignore-scripts --store-dir "$RUNNER_TEMP/p01-pnpm-store"
          phase P01_CANONICAL_GATE python3 -E -s -B ../authority/governance/agent/validate_repository_entry.py --gov-root "$GITHUB_WORKSPACE/authority" --web-stack-root "$GITHUB_WORKSPACE/target"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"p01-evidence/P01_CANONICAL_GATE.log").read_text())
          assert r.get("result")=="VERSION_CHECK_PASS" and r.get("pnpm_lock_and_runtime")=="CHECKED" and not r.get("errors")
          print("P01_REAL_VERSION_GATE=PASS:"+os.environ["P01_PHP"]+":"+os.environ["P01_ENGINE"])
          PY
          git diff --exit-code
      - name: Existing actual product flows across 390 768 1440
        if: matrix.engine == 'sqlite'
        working-directory: target
        shell: bash
        id: frontend
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          scope="$RUNNER_TEMP/p01-evidence"
          export PLAYWRIGHT_BROWSERS_PATH="$scope/browsers"
          if ! pnpm exec playwright install --with-deps chromium >"$scope/browser-install.log" 2>&1; then
            echo P01_REAL_BROWSER_TOOLCHAIN=FAIL; exit 1
          fi
          echo P01_REAL_BROWSER_TOOLCHAIN=PASS
          if ! pnpm run build >"$scope/browser-build.log" 2>&1; then
            echo P01_REAL_BROWSER_BUILD=FAIL; exit 1
          fi
          echo P01_REAL_BROWSER_BUILD=PASS
          if ! pnpm run typecheck >"$scope/typecheck.log" 2>&1; then
            echo P01_CAPTURE_TYPESCRIPT=FAIL; exit 1
          fi
          echo P01_CAPTURE_TYPESCRIPT=PASS
          if ! node --test tests/browser/p01_browser_helper_transport.test.mjs >"$scope/transport.log" 2>&1; then
            echo P01_CAPTURE_TRANSPORT=FAIL; exit 1
          fi
          echo P01_CAPTURE_TRANSPORT=PASS
          export APP_ENV=testing APP_DEBUG=false APP_URL=http://127.0.0.1:8777 APP_ALLOWED_HOSTS=127.0.0.1
          export VF_INSTALL_ALLOW_UNMARKED_DEV=true VF_INSTALL_DEV_CLAIM_ENABLED=false
          export APP_KEY="base64:$(openssl rand -base64 32)"
          export DB_CONNECTION=sqlite SESSION_DRIVER=file CACHE_STORE=array QUEUE_CONNECTION=sync MAIL_MAILER=array
          export P01_S3_REAL_URL="$APP_URL" P01_S3_SYNTH_PASS="$(openssl rand -hex 32)"
          export P01_S5_TEXTBOOK_SYNTH_ZIP="$scope/p01-m08-synthetic-textbook.zip"
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          if ! php artisan package:discover --ansi >"$scope/browser-discovery.log" 2>&1; then
            echo P01_REAL_BROWSER_PACKAGE_DISCOVERY=FAIL; exit 1
          fi
          python3 - <<'PY'
          import os,zipfile
          with zipfile.ZipFile(os.environ["P01_S5_TEXTBOOK_SYNTH_ZIP"],"x",compression=zipfile.ZIP_DEFLATED) as z:
              z.writestr("book/01-intro.md","# 教材第一章\n\n真正的私密 Markdown 教材内容\n\n**真实文字**")
              z.writestr("book/02-followup.md","# 教材第二章\n\n继续学习内容")
          PY
          failures=0
          SERVER_PID=
          stop_server() {
            if [ -n "$SERVER_PID" ]; then
              kill -- "-$SERVER_PID" 2>/dev/null || true
              wait "$SERVER_PID" 2>/dev/null || true
              SERVER_PID=
            fi
          }
          trap stop_server EXIT
          for stage in s3 s6; do
            export APP_ENV=testing DB_DATABASE="$scope/p01-s3-$stage.sqlite"
            touch "$DB_DATABASE"
            if ! php artisan migrate --force --no-interaction >"$scope/$stage-migrate.log" 2>&1 || ! php tests/browser/p01_s3_seed_synthetic.php >"$scope/$stage-seed.log" 2>&1; then
              echo "P01_REAL_BROWSER_$stage=FIXTURE_FAIL"; failures=1; continue
            fi
            test ! -e storage/app/private/vf-startnew/installed.json
            export APP_ENV=local
            setsid php artisan serve --host=127.0.0.1 --port=8777 >"$scope/$stage-server.log" 2>&1 &
            SERVER_PID=$!
            ready=no
            for i in $(seq 1 35); do
              if curl --noproxy '*' -s -o /dev/null "$APP_URL/login"; then ready=yes; break; fi
              sleep 1
            done
            if [ "$ready" != yes ]; then
              echo "P01_REAL_BROWSER_$stage=SERVER_FAIL"; failures=1; stop_server; continue
            fi
            case "$stage" in
              s3) script=p01_s3_real_laravel_browser.mjs; marker=P01_S3_REAL_LARAVEL_CHROMIUM=PASS; args=() ;;
              s4) script=p01_s4_real_laravel_browser.mjs; marker=P01_S4_REAL_LARAVEL_CHROMIUM=PASS; args=() ;;
              s5) script=p01_s5_real_laravel_browser.mjs; marker=P01_S5_APPLIED_CRITERIA_ONLY=PASS; args=(criteria-only) ;;
              s6) script=p01_s6_s7_real_laravel_browser.mjs; marker=P01_S6_SCOPED_REAL_BROWSER=PASS; args=(s6) ;;
              s7) script=p01_s6_s7_real_laravel_browser.mjs; marker=P01_S7_SCOPED_REAL_BROWSER=PASS; args=(s7) ;;
            esac
            if timeout 420s node "tests/browser/$script" "${args[@]}" >"$scope/$stage-browser.log" 2>&1 && grep -Fxq "$marker" "$scope/$stage-browser.log"; then
              printf '%s\n' "$marker"
              echo "P01_REAL_BROWSER_$stage=PASS"
            else
              echo "P01_REAL_BROWSER_$stage=FAIL"; failures=1
              python3 - "$scope/$stage-browser.log" <<'PY'
          import pathlib,re,sys
          text=pathlib.Path(sys.argv[1]).read_text(errors="replace")
          for line in text.splitlines():
              if re.fullmatch(r"P01_[A-Z0-9_]+=(?:PASS|FAIL|[A-Z_]{3,64})",line): print(line)
          print("P01_REAL_BROWSER_FAILURE_CLASS="+("TIMEOUT" if "TimeoutError" in text else "ASSERTION" if "AssertionError" in text else "OTHER"))
          for line in text.splitlines():
              if re.fullmatch(r"P01_S5_REAL_(?:FAILURE_CODE|FAIL_WIDTH)=[0-9]{1,4}",line): print(line)
              if re.fullmatch(r"P01_S5_REAL_FAIL_STAGE=[a-z-]{1,32}",line): print(line)
              if re.fullmatch(r"P01_S3_LOGIN_HTTP_[0-9]{3,4}=[0-9]{3}",line): print(line)
          for line in text.splitlines():
              if re.fullmatch(r"P01_S5_REAL_FAILURE_LINE=[0-9]{1,4}:[0-9]{1,4}",line): print(line)
          for f,ln,col in sorted(set(re.findall(r"(p01_s[3567]_[a-z0-9_]+\.mjs):([0-9]{1,4}):([0-9]{1,4})",text)))[:12]:
              print("P01_BROWSER_FAILURE_LOCATION="+f+":"+ln+":"+col)
          for kind in ("strict mode violation","TimeoutError","AssertionError","TypeError","SyntaxError","ReferenceError","ENOENT","ERR_ASSERTION","ERR_MODULE_NOT_FOUND"):
              if kind in text: print("P01_BROWSER_FAILURE_KIND="+kind.replace(" ","_"))
          PY
            fi
            stop_server
            test ! -e storage/app/private/vf-startnew/installed.json
          done
          echo P01_REAL_BROWSER_NO_FIRST_CLAIM=PASS
          exit "$failures"
      - name: Always remove only run-owned private inputs and synthetic resources
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          name="vf-p01-regression-$GITHUB_RUN_ID-$(printf '%s' "$P01_PHP" | tr -d .)$P01_ENGINE"
          if docker inspect "$name" >/dev/null 2>&1; then
            test "$(docker inspect --format '{{ index .Config.Labels "vf-p01-regression" }}' "$name")" = "$name"
            docker rm -f -v "$name" >/dev/null
          fi
          rm -rf -- target authority "$RUNNER_TEMP/p01-resolver-tools" "$RUNNER_TEMP/p01-evidence" "$RUNNER_TEMP/p01-pnpm-store" "$RUNNER_TEMP/p01-full-source" "$RUNNER_TEMP/p01-full.zip"
          rm -f -- "$RUNNER_TEMP/p01-bootstrap.log"
          test ! -e target && test ! -e authority
          echo P01_PRIVATE_REGRESSION_CLEANUP=PASS
      - name: Preserve all required phase failures
        if: always()
        shell: bash
        env:
          REGRESSION: ${{ steps.regression.outcome }}
          FRONTEND: ${{ steps.frontend.outcome }}
        run: |
          set -Eeuo pipefail
          if [ "$P01_ENGINE" = sqlite ]; then
            test "$FRONTEND" = success
          else
            test "$REGRESSION" = success
          fi
          echo P01_TARGETED_DIAGNOSTIC_PHASES=PASS
  extension:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.actor == 'llhzx2018' &&
      github.triggering_actor == 'llhzx2018' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/p01-startnew-capture-s6-helper-20261128'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        php: ['8.4']
        engine: [sqlite]
    env:
      P01_SOURCE: 4703b172c57a4b0be915d0df6272cc694f863626
      P01_TREE: 5c620b264f9884594ceb279a03f83776785d5f66
      GOV_SOURCE: 438472239efbb9d5fc07e6cb2bb233133fe5066c
      P01_PHP: ${{ matrix.php }}
      P01_ENGINE: ${{ matrix.engine }}
    steps:
      - name: Transient exact P01 source without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-startnew
          ref: 4703b172c57a4b0be915d0df6272cc694f863626
          path: target
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact private inputs
        shell: bash
        working-directory: target
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P01_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$P01_TREE"
          test -z "$(git status --porcelain)"
          test "$(git hash-object composer.json)" = 67f056f508636f59f5fff1c078b2ec497b0baf49
          test "$(git hash-object package.json)" = 7ea28678c37964f9b4f2e7fee3e857f7110d9ebf
          test ! -e .env
          test ! -L composer.json
          test ! -L package.json
          echo P01_EXACT_RESOLVER_INPUT=PASS
      - name: Official PHP compatibility runtime and exact Composer
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          tools: composer:2.11.3
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_mysql, dom, xml, curl, zip, openssl, sodium, pcntl, posix
          coverage: none
      - name: Exact Node toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
      - name: Install exact resolver and assert real executable versions
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          php -r 'exit((getenv("P01_PHP")==="8.4" && PHP_VERSION_ID>=80428 && PHP_VERSION_ID<80500)||(getenv("P01_PHP")==="8.5" && PHP_VERSION_ID>=80513 && PHP_VERSION_ID<80600)?0:2);'
          test "$(node --version)" = v24.22.3
          composer --no-plugins --no-scripts --no-ansi --version | grep -Eq '^Composer version 2\.11\.3( |$)'
          mkdir -p "$RUNNER_TEMP/p01-resolver-tools"
          if ! npm install --prefix "$RUNNER_TEMP/p01-resolver-tools" --ignore-scripts --save-exact --no-fund pnpm@11.29.0 > "$RUNNER_TEMP/p01-bootstrap.log" 2>&1; then
            echo P01_PNPM_BOOTSTRAP=FAIL
            exit 1
          fi
          test "$("$RUNNER_TEMP/p01-resolver-tools/node_modules/.bin/pnpm" --version)" = 11.29.0
          printf '%s\n' "$RUNNER_TEMP/p01-resolver-tools/node_modules/.bin" >> "$GITHUB_PATH"
          echo P01_REAL_RESOLVER_TOOLS=PASS
      - name: Transient trusted GOV baseline checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 438472239efbb9d5fc07e6cb2bb233133fe5066c
          path: authority
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Real frozen dependency install and canonical version gate
        working-directory: target
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          test "$(git rev-parse HEAD)" = "$P01_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$P01_TREE"
          test "$(git hash-object composer.lock)" = b4b7dbd432f45a8190df282a669560a93ae2dff9
          test "$(git hash-object pnpm-lock.yaml)" = 0d2d9c2386a96802cc5ba8b737a2dca56e1a2026
          test ! -e package-lock.json
          test "$(git -C ../authority rev-parse HEAD)" = "$GOV_SOURCE"
          test "$(git -C ../authority hash-object governance/agent/validate_repository_entry.py)" = 664a1404890399c13b79d33e5faf9673d281cb64
          test "$(git -C ../authority hash-object governance/agent/VF_WEB_APP_TECHNOLOGY_BASELINE_V1.json)" = 3f7c88c5c437cd19ec3d01a58b1ed44023cd3325
          mkdir -p "$RUNNER_TEMP/p01-evidence"
          phase() {
            local label="$1"; shift
            local log="$RUNNER_TEMP/p01-evidence/$label.log"
            if "$@" >"$log" 2>&1; then echo "$label=PASS"; return; fi
            if grep -Eiq 'could not resolve host|temporary failure in name resolution|EAI_AGAIN|ECONNRESET|ETIMEDOUT|connection timed out|connection reset by peer' "$log"; then
              echo "$label=TRANSIENT_RETRY_ONCE"
              sleep 3
              if "$@" >"$log" 2>&1; then echo "$label=PASS"; return; fi
            fi
            echo "$label=FAIL"
            exit 1
          }
          phase P01_LOCK_PROVENANCE python3 -B scripts/check_dependency_lock.py
          phase P01_COMPOSER_FROZEN composer install --no-plugins --no-scripts --no-interaction --prefer-dist --no-progress
          phase P01_COMPOSER_PLATFORM composer --no-plugins --no-scripts check-platform-reqs
          phase P01_PNPM_FROZEN pnpm install --frozen-lockfile --ignore-scripts --store-dir "$RUNNER_TEMP/p01-pnpm-store"
          phase P01_CANONICAL_GATE python3 -E -s -B ../authority/governance/agent/validate_repository_entry.py --gov-root "$GITHUB_WORKSPACE/authority" --web-stack-root "$GITHUB_WORKSPACE/target"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"p01-evidence/P01_CANONICAL_GATE.log").read_text())
          assert r.get("result")=="VERSION_CHECK_PASS" and r.get("pnpm_lock_and_runtime")=="CHECKED" and not r.get("errors")
          print("P01_REAL_VERSION_GATE=PASS:"+os.environ["P01_PHP"]+":"+os.environ["P01_ENGINE"])
          PY
          git diff --exit-code
      - name: Build frontend assets for actual FULL
        working-directory: target
        shell: bash
        id: frontend
        run: |
          set -Eeuo pipefail
          set +x
          if ! pnpm run build >"$RUNNER_TEMP/p01-evidence/full-vite.log" 2>&1; then
            echo P01_FULL_VITE=FAIL; exit 1
          fi
          echo P01_FULL_VITE=PASS
      - name: Prepare locked Chromium and isolated certificate tooling
        if: matrix.engine == 'sqlite'
        working-directory: target
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          scope="$RUNNER_TEMP/p01-evidence"
          if ! command -v certutil >/dev/null; then
            if ! sudo apt-get -o Acquire::Retries=0 update >"$scope/nss-update.log" 2>&1 || ! sudo apt-get -o Acquire::Retries=0 install -y --no-install-recommends libnss3-tools >"$scope/nss-install.log" 2>&1; then
              echo P01_HTTPS_CERT_TOOL=FAIL; exit 1
            fi
          fi
          export PLAYWRIGHT_BROWSERS_PATH="$scope/browsers"
          if ! pnpm exec playwright install --with-deps chromium >"$scope/chromium.log" 2>&1; then
            echo P01_HTTPS_CHROMIUM_TOOL=FAIL; exit 1
          fi
          echo P01_HTTPS_CHROMIUM_TOOL=PASS
      - name: Actual isolated FULL from production vendor
        if: steps.frontend.outcome == 'success'
        working-directory: target
        shell: bash
        id: full
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          set +x
          scope="$RUNNER_TEMP/p01-evidence"
          full="$RUNNER_TEMP/p01-full-source"
          archive="$RUNNER_TEMP/p01-full.zip"
          phase() {
            local label="$1"; shift
            if "$@" >"$scope/$label.log" 2>&1; then echo "$label=PASS"; else echo "$label=FAIL"; return 1; fi
          }
          git clone --local --no-hardlinks --no-checkout --no-recurse-submodules "$PWD" "$full" >"$scope/full-clone.log" 2>&1
          git -C "$full" checkout --detach "$P01_SOURCE" >"$scope/full-checkout.log" 2>&1
          test "$(git -C "$full" rev-parse HEAD^{tree})" = "$P01_TREE"
          mkdir -p "$full/public/build"
          cp -a public/build/. "$full/public/build/"
          cd "$full"
          phase P01_FULL_PROD_VENDOR composer install --no-dev --no-scripts --no-plugins --no-interaction --prefer-dist --no-progress
          phase P01_FULL_PLATFORM composer --no-plugins --no-scripts check-platform-reqs --no-dev
          phase P01_FULL_BUILD python3 -B scripts/build_clean_full.py --root "$full" --output "$archive" --source-sha "$P01_SOURCE"
          sha="$(sha256sum "$archive" | cut -d' ' -f1)"
          python3 - "$archive" "$sha" <<'PY'
          import os,json,secrets,subprocess,sys,time
          from pathlib import Path
          engine=os.environ["P01_ENGINE"]; minor=os.environ["P01_PHP"]
          assert engine in {"sqlite","mysql","mariadb"}
          scope=Path(os.environ["RUNNER_TEMP"])/"p01-evidence"
          name="vf-p01-regression-"+os.environ["GITHUB_RUN_ID"]+"-"+minor.replace(".","")+engine
          def docker(args,timeout=90):
              return subprocess.run(["docker",*args],capture_output=True,text=True,timeout=timeout,check=True).stdout
          def owned():
              r=subprocess.run(["docker","inspect",name],capture_output=True,text=True,timeout=15)
              if r.returncode:return None
              info=json.loads(r.stdout)[0]
              assert info["Config"]["Labels"].get("vf-p01-regression")==name
              assert not info["HostConfig"].get("Privileged") and not info["HostConfig"].get("Binds")
              assert info["HostConfig"]["PortBindings"]=={"3306/tcp":[{"HostIp":"127.0.0.1","HostPort":"3306"}]}
              return info["Id"]
          env=dict(os.environ)
          try:
              if engine!="sqlite":
                  assert owned() is None
                  prefix="MYSQL" if engine=="mysql" else "MARIADB"
                  image="mysql:8.4" if engine=="mysql" else "mariadb:11.8"
                  db="vfstartnew_test_full_"+secrets.token_hex(4); pw=secrets.token_hex(24); rootpw=secrets.token_hex(24)
                  docker(["run","--rm","-d","--name",name,"--label","vf-p01-regression="+name,"--publish","127.0.0.1:3306:3306","--memory","1536m","--cpus","2","--pids-limit","256","-e",prefix+"_ROOT_PASSWORD="+rootpw,"-e",prefix+"_DATABASE="+db,"-e",prefix+"_USER="+db,"-e",prefix+"_PASSWORD="+pw,image],180)
                  assert owned()
                  cfg={"driver":engine,"host":"127.0.0.1","port":3306,"database":db,"username":db,"password":pw}
                  env["P01_FULL_SYNTHETIC_DB_JSON"]=json.dumps(cfg)
                  deadline=time.monotonic()+180
                  code='try{$c=json_decode(stream_get_contents(STDIN),true);$d=new PDO("mysql:host=127.0.0.1;port=3306;dbname=".$c["database"],$c["username"],$c["password"],[PDO::ATTR_TIMEOUT=>5]);echo $d->query("SELECT VERSION()")->fetchColumn();}catch(Throwable $e){exit(2);}'
                  while True:
                      probe=subprocess.run(["php","-r",code],input=json.dumps(cfg),capture_output=True,text=True,timeout=8)
                      if probe.returncode==0:
                          v=probe.stdout.lower()
                          assert (v.startswith("8.4.") and "mariadb" not in v) if engine=="mysql" else (v.startswith("11.8.") and "mariadb" in v)
                          print("P01_FULL_NATIVE_ENGINE=PASS:"+engine,flush=True);break
                      assert time.monotonic()<deadline,"FULL_DB_NOT_READY";time.sleep(2)
              target=Path(os.environ["GITHUB_WORKSPACE"])/"target"
              args=["python3","-B",str(target/"scripts/verify_clean_full_install.py"),"--archive",sys.argv[1],"--source-sha",os.environ["P01_SOURCE"],"--sha256",sys.argv[2],"--engine",engine]
              if engine=="sqlite":
                  env["PLAYWRIGHT_BROWSERS_PATH"]=str(scope/"browsers")
                  args.append("--browser-helper")
              with (scope/"full-runtime.log").open("wb") as out:
                  proc=subprocess.run(args,env=env,stdout=out,stderr=subprocess.STDOUT,timeout=420)
              if proc.returncode:
                  import re
                  raw=(scope/"full-runtime.log").read_text(errors="replace")
                  codes=re.findall(r"RuntimeError: ([A-Z_0-9]{3,160})",raw)
                  print("P01_FULL_RUNTIME_FAILURE="+(codes[-1] if codes else "UNCLASSIFIED"),flush=True)
                  raise SystemExit("P01_FULL_RUNTIME=FAIL")
              result=json.loads((scope/"full-runtime.log").read_text())
              assert result["status"]=="FULL_RUNTIME_PASS" and result["engine"]==engine and result["source_sha"]==os.environ["P01_SOURCE"] and result["archive_sha256"]==sys.argv[2]
              if engine=="sqlite":
                  assert result["scope"]=="ISOLATED_LOOPBACK_HTTPS" and "INSTALLED_FULL_LINK" in result["browser_helper"]
                  print("P01_REAL_INSTALLED_EXTENSION=PASS",flush=True)
              print("P01_REAL_FULL_RUNTIME=PASS:"+minor+":"+engine,flush=True)
          finally:
              if engine!="sqlite":
                  cid=owned()
                  if cid:docker(["rm","-f","-v",cid],60)
                  assert owned() is None
                  print("P01_OWNED_DB_CLEANUP=PASS",flush=True)
          PY
      - name: Always remove only run-owned private inputs and synthetic resources
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          name="vf-p01-regression-$GITHUB_RUN_ID-$(printf '%s' "$P01_PHP" | tr -d .)$P01_ENGINE"
          if docker inspect "$name" >/dev/null 2>&1; then
            test "$(docker inspect --format '{{ index .Config.Labels "vf-p01-regression" }}' "$name")" = "$name"
            docker rm -f -v "$name" >/dev/null
          fi
          rm -rf -- target authority "$RUNNER_TEMP/p01-resolver-tools" "$RUNNER_TEMP/p01-evidence" "$RUNNER_TEMP/p01-pnpm-store" "$RUNNER_TEMP/p01-full-source" "$RUNNER_TEMP/p01-full.zip"
          rm -f -- "$RUNNER_TEMP/p01-bootstrap.log"
          test ! -e target && test ! -e authority
          echo P01_PRIVATE_REGRESSION_CLEANUP=PASS
      - name: Preserve actual FULL runtime outcome
        if: always()
        shell: bash
        env:
          FULL: ${{ steps.full.outcome }}
        run: |
          set -Eeuo pipefail
          test "$FULL" = success
          echo P01_FULL_PHASES=PASS
