name: TEMP P01 legacy visible confirmation bounded replay
on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/p01-startnew-s1-r02-temporary.yml
permissions:
  contents: read
concurrency:
  group: p01-legacy-visible-b91a567d
  cancel-in-progress: false
jobs:
  browser:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.actor == 'llhzx2018' &&
      github.triggering_actor == 'llhzx2018' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/p01-legacy-channel-visible-confirm-20261128'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        php: ['8.4']
        engine: [sqlite]
    env:
      P01_SOURCE: b91a567d1a542e10f012de3b4f364ba4028c5712
      P01_TREE: 4de45bff01bcbbd7ded661933768f77c1cac57e1
      GOV_SOURCE: f7e967fc6fa590942b7cecfb1407ec25f1eaf320
      P01_PHP: ${{ matrix.php }}
      P01_ENGINE: ${{ matrix.engine }}
    steps:
      - name: Transient exact P01 source without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-startnew
          ref: b91a567d1a542e10f012de3b4f364ba4028c5712
          path: target
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Read-only legacy exact source in disposable checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 158c3d75378c235720727fe9f29fb28e02e7b6c9
          path: legacy
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact private inputs
        shell: bash
        working-directory: target
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P01_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$P01_TREE"
          test -z "$(git status --porcelain)"
          test "$(git hash-object composer.json)" = 67f056f508636f59f5fff1c078b2ec497b0baf49
          test "$(git hash-object package.json)" = 7ea28678c37964f9b4f2e7fee3e857f7110d9ebf
          test "$(cat VERSION)" = 0.1.0-dev
          test ! -e .env
          test ! -L composer.json
          test ! -L package.json
          echo P01_EXACT_RESOLVER_INPUT=PASS
      - name: Official PHP compatibility runtime and exact Composer
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          tools: composer:2.11.3
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_mysql, dom, xml, curl, zip, openssl, sodium, pcntl, posix
          coverage: none
      - name: Exact Node toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
      - name: Install exact resolver and assert real executable versions
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          php -r 'exit((getenv("P01_PHP")==="8.4" && PHP_VERSION_ID>=80428 && PHP_VERSION_ID<80500)||(getenv("P01_PHP")==="8.5" && PHP_VERSION_ID>=80513 && PHP_VERSION_ID<80600)?0:2);'
          test "$(node --version)" = v24.22.3
          composer --no-plugins --no-scripts --no-ansi --version | grep -Eq '^Composer version 2\.11\.3( |$)'
          mkdir -p "$RUNNER_TEMP/p01-resolver-tools"
          if ! npm install --prefix "$RUNNER_TEMP/p01-resolver-tools" --ignore-scripts --save-exact --no-fund pnpm@11.29.0 > "$RUNNER_TEMP/p01-bootstrap.log" 2>&1; then
            echo P01_PNPM_BOOTSTRAP=FAIL
            exit 1
          fi
          test "$("$RUNNER_TEMP/p01-resolver-tools/node_modules/.bin/pnpm" --version)" = 11.29.0
          printf '%s\n' "$RUNNER_TEMP/p01-resolver-tools/node_modules/.bin" >> "$GITHUB_PATH"
          echo P01_REAL_RESOLVER_TOOLS=PASS
      - name: Transient trusted GOV baseline checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: f7e967fc6fa590942b7cecfb1407ec25f1eaf320
          path: authority
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Real frozen dependency install and canonical version gate
        id: deps
        working-directory: target
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          test "$(git rev-parse HEAD)" = "$P01_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$P01_TREE"
          test "$(git hash-object composer.lock)" = b4b7dbd432f45a8190df282a669560a93ae2dff9
          test "$(git hash-object pnpm-lock.yaml)" = 0d2d9c2386a96802cc5ba8b737a2dca56e1a2026
          test ! -e package-lock.json
          test "$(git -C ../authority rev-parse HEAD)" = "$GOV_SOURCE"
          test "$(git -C ../authority hash-object governance/agent/validate_repository_entry.py)" = 664a1404890399c13b79d33e5faf9673d281cb64
          test "$(git -C ../authority hash-object governance/agent/VF_WEB_APP_TECHNOLOGY_BASELINE_V1.json)" = 3f7c88c5c437cd19ec3d01a58b1ed44023cd3325
          mkdir -p "$RUNNER_TEMP/p01-evidence"
          phase() {
            local label="$1"; shift
            local log="$RUNNER_TEMP/p01-evidence/$label.log"
            if "$@" >"$log" 2>&1; then echo "$label=PASS"; return; fi
            if grep -Eiq 'could not resolve host|temporary failure in name resolution|EAI_AGAIN|ECONNRESET|ETIMEDOUT|connection timed out|connection reset by peer' "$log"; then
              echo "$label=TRANSIENT_RETRY_ONCE"
              sleep 90
              if "$@" >"$log" 2>&1; then echo "$label=PASS"; return; fi
            fi
            echo "$label=FAIL"
            exit 1
          }
          phase P01_LOCK_PROVENANCE python3 -B scripts/check_dependency_lock.py
          phase P01_COMPOSER_FROZEN composer install --no-plugins --no-scripts --no-interaction --prefer-dist --no-progress
          phase P01_COMPOSER_PLATFORM composer --no-plugins --no-scripts check-platform-reqs
          phase P01_PNPM_FROZEN pnpm install --frozen-lockfile --ignore-scripts --store-dir "$RUNNER_TEMP/p01-pnpm-store"
          phase P01_CANONICAL_GATE python3 -E -s -B ../authority/governance/agent/validate_repository_entry.py --gov-root "$GITHUB_WORKSPACE/authority" --web-stack-root "$GITHUB_WORKSPACE/target"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"p01-evidence/P01_CANONICAL_GATE.log").read_text())
          assert r.get("result")=="VERSION_CHECK_PASS" and r.get("pnpm_lock_and_runtime")=="CHECKED" and not r.get("errors")
          print("P01_REAL_VERSION_GATE=PASS:"+os.environ["P01_PHP"]+":"+os.environ["P01_ENGINE"])
          PY
          git diff --exit-code
      - name: Exact source Chromium
        id: browsers
        working-directory: target
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          scope="$RUNNER_TEMP/p01-evidence"
          export PLAYWRIGHT_BROWSERS_PATH="$scope/browsers"
          if ! pnpm exec playwright install --with-deps chromium >"$scope/chromium.log" 2>&1; then echo P01_CHANNEL_CHROMIUM=FAIL; exit 1; fi
          echo P01_CHANNEL_CHROMIUM=PASS
      - name: Bounded old channel runtime diagnosis, no old source modification
        if: always() && steps.browsers.outcome == 'success'
        id: legacy
        working-directory: target
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          test "$(git -C ../legacy rev-parse HEAD)" = 158c3d75378c235720727fe9f29fb28e02e7b6c9
          test -z "$(git -C ../legacy status --porcelain)"
          test ! -e ../legacy/src/app/.runtime.php
          node --check tests/browser/p01_legacy_channel_runtime_diagnostic.mjs
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/p01-evidence/browsers"
          python3 -B - <<'PY'
          import http.cookiejar,json,os,re,secrets,shutil,socket,subprocess,tempfile,time,urllib.request,urllib.parse
          from pathlib import Path
          workspace=Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          target=workspace/"target";legacy=workspace/"legacy"
          assert Path.cwd().resolve()==target and not (legacy/"src/app/.runtime.php").exists()
          root=Path(tempfile.mkdtemp(prefix="p01-ia6-channel-",dir="/tmp"))
          server=None
          try:
              assert root.parent==Path("/tmp") and root.name.startswith("p01-ia6-channel-") and not root.is_symlink()
              shutil.copytree(legacy/"src",root,dirs_exist_ok=True)
              with socket.socket() as sock:
                  sock.bind(("127.0.0.1",0));port=sock.getsockname()[1]
              origin="http://127.0.0.1:"+str(port);password="Synthetic-"+secrets.token_hex(24)
              env={"PATH":os.environ["PATH"],"HOME":str(root),"VF_SETUP_REQUIRE_KEY":"0","P01_TEST_ORIGIN":origin,"P01_TEST_PASSWORD":password,"VF_E2E_RUNTIME_ROOT":str(root),"P01_SYNTHETIC_CHANNEL_PARITY":"YES","P01_CHANNEL_SITE_ROOT":str(root),"PLAYWRIGHT_BROWSERS_PATH":os.environ["PLAYWRIGHT_BROWSERS_PATH"]}
              with (root/"qa-http.log").open("wb") as log:
                  server=subprocess.Popen(["php","-S","127.0.0.1:"+str(port),"-t",str(root)],cwd=root,env=env,stdout=log,stderr=log)
                  client=urllib.request.build_opener(urllib.request.ProxyHandler({}),urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
                  for _ in range(100):
                      assert server.poll() is None
                      try:
                          with client.open(origin+"/setup.php",timeout=2) as response:body=response.read(2*1024*1024).decode()
                          break
                      except OSError:time.sleep(.2)
                  else:raise RuntimeError("OLD_SETUP_NOT_READY")
                  nonce=re.search(r'name="setup_csrf" value="([a-f0-9]{48})"',body);assert nonce
                  form=urllib.parse.urlencode({"setup_csrf":nonce.group(1),"site_title":"P01 synthetic legacy channel","admin_password":password,"admin_password_confirm":password}).encode()
                  with client.open(origin+"/setup.php",data=form,timeout=60) as response:response.read(2*1024*1024)
                  assert (root/"app/.runtime.php").is_file()
                  witness=subprocess.run(["php","-r",'require $argv[1]."/app/bootstrap.php"; exit(vf_is_installed() && str_starts_with((string)realpath(VF_PRIVATE_ROOT),$argv[1]."/.vfnav-data-") && (int)vf_db()->query("SELECT COUNT(*) FROM links")->fetchColumn()===0 ? 0:2);',str(root)],env=env,cwd=root,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=30)
                  assert witness.returncode==0
                  fixture=subprocess.run(["php",str(legacy/"tests/integration/p01_channels_130_parity_fixture.php")],env=env,cwd=root,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=120)
                  assert fixture.returncode==0
                  print("P01_LEGACY_CHANNEL_SYNTHETIC_INSTALL_AND_FIXTURE=PASS",flush=True)
                  run=subprocess.run(["node",str(target/"tests/browser/p01_legacy_channel_runtime_diagnostic.mjs")],env=env,cwd=target,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=360)
                  raw=run.stdout.decode(errors="replace")
                  for line in raw.splitlines():
                      if re.fullmatch(r"P01_LEGACY_CHANNEL_(?:RUNTIME(?:_(?:390|768|1440))?=PASS|FAILURE_(?:390|768|1440)=(?:TIMEOUT|ASSERTION|OTHER))",line):print(line,flush=True)
                      elif re.match(r"^P01_LEGACY_CHANNEL_RUNTIME_(390|768|1440)=\{",line):
                          name,raw_json=line.split("=",1);value=json.loads(raw_json)
                          assert set(value)=={"scriptStatuses","errors","nativeDialogs","state"}
                          assert all(type(x) is int and 100<=x<=599 for x in value["scriptStatuses"])
                          assert type(value["nativeDialogs"]) is int
                          for error in value["errors"]:
                              assert error["name"] in ("ReferenceError","TypeError","SyntaxError","RangeError","OTHER")
                              assert error["location"] is None or re.fullmatch(r"\d{1,5}:\d{1,5}",error["location"])
                          assert set(value["state"])=={"payload","parsed","csrf","assetCount","toast","confirmation","visible"}
                          assert all(type(x) in (int,bool) for x in value["state"].values())
                          print(name+"="+json.dumps(value,sort_keys=True),flush=True)
                  assert run.returncode==0 and "P01_LEGACY_CHANNEL_RUNTIME=PASS" in raw.splitlines()
          finally:
              if server:
                  server.terminate()
                  try:server.wait(timeout=5)
                  except subprocess.TimeoutExpired:server.kill();server.wait()
              assert root.parent==Path("/tmp") and root.name.startswith("p01-ia6-channel-") and not root.is_symlink()
              shutil.rmtree(root);assert not root.exists()
              print("P01_LEGACY_CHANNEL_CLEANUP=PASS",flush=True)
          PY
          test -z "$(git -C ../legacy status --porcelain)"
      - name: Always remove only run-owned private inputs and synthetic resources
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          name="vf-p01-regression-$GITHUB_RUN_ID-$(printf '%s' "$P01_PHP" | tr -d .)$P01_ENGINE"
          if docker inspect "$name" >/dev/null 2>&1; then
            test "$(docker inspect --format '{{ index .Config.Labels "vf-p01-regression" }}' "$name")" = "$name"
            docker rm -f -v "$name" >/dev/null
          fi
          rm -rf -- target authority legacy "$RUNNER_TEMP/p01-resolver-tools" "$RUNNER_TEMP/p01-evidence" "$RUNNER_TEMP/p01-pnpm-store" "$RUNNER_TEMP/p01-full-source" "$RUNNER_TEMP/p01-full.zip"
          rm -f -- "$RUNNER_TEMP/p01-bootstrap.log"
          test ! -e target && test ! -e authority && test ! -e legacy
          echo P01_PRIVATE_REGRESSION_CLEANUP=PASS
      - name: Preserve all required phase failures
        if: always()
        shell: bash
        env:
          LEGACY: ${{ steps.legacy.outcome }}
        run: |
          set -Eeuo pipefail
          test "$LEGACY" = success
          echo P01_TARGETED_DIAGNOSTIC_PHASES=PASS
