name: S01 M3U8 Primary Header R18 Candidate Gate

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/s01-c03-primary-nav-r18-gate-20260925.yml'

permissions:
  contents: read

jobs:
  gate:
    if: github.head_ref == 'task/s01-c03-primary-nav-r18-gate-20260925'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      M3U8_SHA: dcf2e50ef5ffa374682c61ff6b3f9a241f0b489b
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: ${{ env.M3U8_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: m3u8

      - name: R18 Header contract
        working-directory: m3u8
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$M3U8_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "1.25.45"
          php tests/s01-c03-admin-shell-alignment-r1-contract.php
          grep -Fq 'R18 · Compact primary nav hit-area parity' src/admin/ui-v4/admin-s01-shell-header-final-r14.css
          grep -Fq 'width:112px!important' src/admin/ui-v4/admin-s01-shell-header-final-r14.css
          grep -Fq 'width:132px!important' src/admin/ui-v4/admin-s01-shell-header-final-r14.css
          grep -Fq 'justify-self:center!important' src/admin/ui-v4/admin-s01-shell-header-final-r14.css
          grep -Fq 'R17 · Unified compact Professional Mode dropdown' src/admin/ui-v4/admin-s01-shell-header-final-r14.css
          grep -Fq 'width:272px!important' src/admin/ui-v4/admin-s01-shell-header-final-r14.css

      - name: PHP syntax
        working-directory: m3u8
        run: find src -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
