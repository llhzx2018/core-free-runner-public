name: P01 V2.36.2 Remote Release Truth
on:
  push:
    branches: [release/p01-v2362-candidate-20260901]
    paths: [.github/workflows/p01-v2362-remote-release-truth-20260901.yml]
permissions:
  contents: read
  actions: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FORMAL: 4fd25a5ce4383dc456e755fc2e031a861d6ff655
      FORMAL_TREE: 0f0e5329098ad5a87a4a72dbd368c88d7a44b339
      RUNTIME_TREE: 55bc3143df6ca4e8e66b3e8d3e0f01b3ec343424
      DEVELOP: d3b6f4af92cbfab28df465938ea8348a35909052
      CORE_LIVE: 416cc8089b39349eb7ee62638b5267335d406320
      CORE_CANDIDATE: 3ddf344872744ba4e9e407c99fe704b90a4cda97
      RELEASE_ID: '380317968'
      EVID: /tmp/p01-v2362-remote-release-truth
    steps:
      - name: Checkout exact v2.36.2 tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.36.2
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: target
      - name: Checkout live core-updates
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CORE_LIVE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          path: live
      - name: Checkout staged V2.36.2 manifest
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CORE_CANDIDATE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          path: candidate
      - name: Remote truth fence
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVID/download"
          test "$(git -C target rev-parse HEAD)" = "$FORMAL"
          test "$(git -C target rev-parse HEAD^{tree})" = "$FORMAL_TREE"
          test "$(git -C target rev-parse HEAD:src)" = "$RUNTIME_TREE"
          test "$(gh api repos/llhzx2018/vf-start/branches/main --jq .commit.sha)" = "$FORMAL"
          DEV=$(gh api repos/llhzx2018/vf-start/branches/develop --jq .commit.sha); test "$DEV" = "$DEVELOP"
          git -C target fetch origin "$DEV" --quiet
          git -C target merge-base --is-ancestor "$FORMAL" "$DEV"
          test "$(git -C target rev-parse "$DEV:src")" = "$RUNTIME_TREE"
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.36.2 --jq .object.sha)" = "$FORMAL"
          gh api repos/llhzx2018/vf-start/releases/tags/v2.36.2 > "$EVID/release.json"
          test "$(jq -r .id "$EVID/release.json")" = "$RELEASE_ID"
          test "$(jq -r .draft "$EVID/release.json")" = false
          test "$(jq -r .prerelease "$EVID/release.json")" = false
          test "$(jq '.assets|length' "$EVID/release.json")" = 8
          jq -e '.assets[]|select(.name=="VF-Start-V2.36.2-FULL.zip" and .size==649250 and .digest=="sha256:4a2defd88b5e25d8a5a431dfa00a23cea9370d9ea4f0f68255e483b25f2ff90c")' "$EVID/release.json" >/dev/null
          jq -e '.assets[]|select(.name=="VF_Start_V2.36.2_UPDATE.zip" and .size==1396364 and .digest=="sha256:1718db148ea91987a8b3dee2474892b3df84b4b93cd8298e2e261153fa99c3ea")' "$EVID/release.json" >/dev/null
          gh release download v2.36.2 --repo llhzx2018/vf-start --pattern 'VF_Start_V2.36.2_UPDATE.zip' --dir "$EVID/download"
          test "$(sha256sum "$EVID/download/VF_Start_V2.36.2_UPDATE.zip"|awk '{print $1}')" = 1718db148ea91987a8b3dee2474892b3df84b4b93cd8298e2e261153fa99c3ea
          test "$(git -C live rev-parse HEAD)" = "$CORE_LIVE"
          test "$(gh api repos/llhzx2018/core-updates/branches/main --jq .commit.sha)" = "$CORE_LIVE"
          jq -e '.current_version=="2.36.0" and .target_version=="2.36.1" and .from_versions==["2.36.0"] and .release_tag=="v2.36.1"' live/projects/P01.json >/dev/null
          test "$(git -C candidate rev-parse HEAD)" = "$CORE_CANDIDATE"
          jq -e '.current_version=="2.36.1" and .target_version=="2.36.2" and .from_versions==["2.36.1"] and .release_tag=="v2.36.2" and .release_id==380317968 and .product_identity=="4fd25a5ce4383dc456e755fc2e031a861d6ff655" and .asset_name=="VF_Start_V2.36.2_UPDATE.zip" and .asset_bytes==1396364 and .asset_sha256=="1718db148ea91987a8b3dee2474892b3df84b4b93cd8298e2e261153fa99c3ea"' candidate/projects/P01.json >/dev/null
          for run in 33478737169 33479052985 33485021418 33485364786 33485493941 33485613966 33486145556; do test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$run --jq .conclusion)" = success; done
          test "$(gh api repos/llhzx2018/core-free-runner-public/branches/main --jq .commit.sha)" = e569c491506e2a367d01a18cfa89a234a22abb79
          cat > "$EVID/verdict.txt" <<'EOF'
          P01_V2362_REMOTE_RELEASE_TRUTH=PASS
          PUBLISHED_LATEST=2.36.2
          RELEASE_ID=380317968
          VF_START_MAIN=4fd25a5ce4383dc456e755fc2e031a861d6ff655
          OWNER_PRODUCTION=2.36.0
          LIVE_ONLINE_NEXT_HOP=2.36.1
          V2362_MANIFEST_CANDIDATE=READY
          V2362_MANIFEST_PROMOTION=HELD_UNTIL_OWNER_REACHES_2.36.1
          OWNER_PRODUCTION_WRITE=NO
          RUNNER_MAIN_UNCHANGED=YES
          EOF
          cat "$EVID/verdict.txt"
      - name: Upload remote truth evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2362-remote-release-truth-${{ github.run_id }}
          path: ${{ env.EVID }}
          if-no-files-found: error
          retention-days: 90
