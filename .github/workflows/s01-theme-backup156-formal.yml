name: S01 Theme 1.35.156 formal release
on:
  push:
    branches: [task/s01-theme-backup156-20261021]
    paths: ['.github/workflows/s01-theme-backup156-formal.yml']
permissions:
  contents: read
jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 74818819cd0bd6ac36d05eea97a83efea4654325
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Check merged main matches tested candidate tree
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          mkdir -p proof
          set -euo pipefail
          test "$(git -C target rev-parse HEAD^{tree})" = 'ecde3793c222a1d3944f7ccc1acfe81989b62eb1'
          test "$(gh api repos/llhzx2018/vf-tools-theme/commits/main --jq .sha)" = '9b6eab29445fa80297f7fe06d8f283b262e1c374'
          test "$(gh api repos/llhzx2018/vf-tools-theme/git/commits/9b6eab29445fa80297f7fe06d8f283b262e1c374 --jq .tree.sha)" = 'ecde3793c222a1d3944f7ccc1acfe81989b62eb1'
          echo MERGED_TREE_EQUALS_TESTED_TREE_PASS
      - name: Validate exact owner CSS and deterministic Theme release package
        run: |
          set -euo pipefail
          php -l target/src/inc/runtime-constants.php
          python3 - <<'PY_PACKAGE'
          from pathlib import Path,PurePosixPath
          import subprocess,hashlib,zipfile,json
          root=Path('target');base='5fc738ac42d71898da146b6fedc70a4ad7ec1a43';sha='74818819cd0bd6ac36d05eea97a83efea4654325'
          def git(*args):return subprocess.check_output(['git','-C',str(root),*args])
          assert git('rev-parse','HEAD').decode().strip()==sha
          assert git('rev-parse','HEAD^{tree}').decode().strip()=='ecde3793c222a1d3944f7ccc1acfe81989b62eb1'
          assert (root/'VERSION').read_text().strip()=='1.35.156'
          changed=set(git('diff','--name-only',base,sha).decode().splitlines())
          owner='src/assets/css/public/pages/families/public-family-02-tool-directory-detail-operations-closure.css'
          bundle='src/assets/css/public/vf-theme-public-runtime.css'
          assert changed=={owner,bundle,'VERSION','src/style.css','src/inc/runtime-constants.php','CHANGELOG.md'},changed
          old=git('show',base+':'+owner)
          new=(root/owner).read_bytes()
          baseline=git('show',base+':'+bundle)
          actual=(root/bundle).read_bytes()
          assert baseline.count(old)==1
          assert actual==baseline.replace(old,new,1)
          assert 'Version: 1.35.156' in (root/'src/style.css').read_text()
          assert "VF_THEME_VERSION', '1.35.156'" in (root/'src/inc/runtime-constants.php').read_text()
          assert 'S01-C01: readable backup workbench on desktop' in new.decode()
          assert new.count(b'.vf-backup-restore[data-vf-module="backup-restore"]')>=5
          print('CSS_OWNER_BUNDLE_EXACT_BYTE_CLOSURE_PASS')
          files=sorted(x for x in (root/'src').rglob('*') if x.is_file())
          assert len(files)==476,len(files)
          out=Path('vf-tools-theme_V1.35.156.zip')
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
           for p in files:
            assert not p.is_symlink()
            inf=zipfile.ZipInfo(str(PurePosixPath('vf-tools-theme')/p.relative_to(root/'src')),date_time=(1980,1,1,0,0,0))
            inf.compress_type=zipfile.ZIP_DEFLATED
            inf.external_attr=(p.stat().st_mode&0o777)<<16
            z.writestr(inf,p.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          with zipfile.ZipFile(out) as z:
           assert z.testzip() is None
           assert 'Version: 1.35.156' in z.read('vf-tools-theme/style.css').decode()
          proof={'version':'1.35.156','source':sha,'tree':'ecde3793c222a1d3944f7ccc1acfe81989b62eb1','fileCount':476,'bytes':out.stat().st_size,'sha256':hashlib.sha256(out.read_bytes()).hexdigest(),'scope':'backup desktop CSS presentation only','status':'PASS'}
          Path('proof/theme156-package.json').write_text(json.dumps(proof,indent=2))
          print('THEME156_EXACT_PACKAGE_PASS',json.dumps(proof))
          PY_PACKAGE
      - name: Publish tested exact archive as formal Release
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          echo '1afacdf813b2b757623ce278f253bd565d8f5274a97798c367f5a90e5cbd4193  vf-tools-theme_V1.35.156.zip' | sha256sum -c
          test "$(stat -c %s vf-tools-theme_V1.35.156.zip)" = 1969093
          if ! gh release view v1.35.156 --repo llhzx2018/vf-tools-theme >/dev/null 2>&1; then
            gh release create v1.35.156 vf-tools-theme_V1.35.156.zip --repo llhzx2018/vf-tools-theme --target 9b6eab29445fa80297f7fe06d8f283b262e1c374 --title 'VF Tools Theme V1.35.156' --notes '仅备份恢复页面桌面 UX/UI 精修：操作与说明字号、状态对比度、任务切换及按钮可读性。中英文桌面定向20/20 PASS，Theme原生升级/回退/重装、数据库状态保留 PASS，CSS 实际加载总包精确闭合。M3U8 领域运行时完全未改。正式网站由 Owner 手工升级。' --latest
          fi
      - name: Verify authenticated remote release bytes and status
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof/release-readback
          gh release download v1.35.156 --repo llhzx2018/vf-tools-theme --pattern vf-tools-theme_V1.35.156.zip --dir proof/release-readback
          cmp vf-tools-theme_V1.35.156.zip proof/release-readback/vf-tools-theme_V1.35.156.zip
          test "$(gh release view v1.35.156 --repo llhzx2018/vf-tools-theme --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
          echo THEME156_FORMAL_REMOTE_BYTES_IDENTICAL_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-theme156-formal-${{ github.run_id }}
          path: proof/theme156-package.json
          retention-days: 14
      - name: Cleanup
        if: always()
        run: rm -rf target vf-tools-theme_V1.35.156.zip proof/release-readback
