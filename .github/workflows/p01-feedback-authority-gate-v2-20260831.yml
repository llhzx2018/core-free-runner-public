name: P01 Feedback Authority Gate V2

on:
  push:
    branches: [task/p01-feedback-authority-gate-20260831]
    paths:
      - .github/workflows/p01-feedback-authority-gate-v2-20260831.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE: ce6d80970cbc017b5c7a464a74a2ed037d09457c
      TREE: aa8824785560c60cae328339521c0dd63c1bd396
      BASE_SOURCE: 97b98f498adac4d7a0a633d84b12092b5325e049
      JS_BLOB: 603a8facb63711eb356728285aef100df873dc7d
      ROOT: /tmp/p01-feedback-authority-v2
      PORT: '18360'
      EVID: /tmp/p01-feedback-authority-v2-evid
      COOKIE: /tmp/p01-feedback-authority-v2.cookies
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none

      - name: Checkout exact P01 source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: product

      - name: Exact source and syntax fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$SOURCE"
          test "$(git -C product rev-parse HEAD^{tree})" = "$TREE"
          test "$(git -C product rev-parse HEAD:src/assets/workspace-rebaseline.js)" = "$JS_BLOB"
          test "$(cat product/VERSION)" = '2.34.0'
          test "$(git -C product diff --name-only "$BASE_SOURCE"..HEAD)" = 'src/assets/workspace-rebaseline.js'
          test "$(git -C product diff --numstat "$BASE_SOURCE"..HEAD)" = $'6\t0\tsrc/assets/workspace-rebaseline.js'
          git -C product diff --check "$BASE_SOURCE"..HEAD
          node --check product/src/assets/workspace-rebaseline.js
          echo P01_FEEDBACK_AUTHORITY_SOURCE=PASS

      - name: Fresh runtime fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$ROOT" "$COOKIE"
          cp -a product/src "$ROOT"
          php -S 127.0.0.1:$PORT -t "$ROOT" >/tmp/p01-feedback-authority-v2-server.log 2>&1 & echo $! >/tmp/p01-feedback-authority-v2.pid
          for i in $(seq 1 30); do curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:$PORT/setup.php" -o /tmp/p01-feedback-authority-v2-setup.html && break || sleep 1; done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-feedback-authority-v2-setup.html',encoding='utf-8').read(); m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s); assert m; print(m.group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:$PORT/setup.php" \
            --data-urlencode "setup_csrf=$CSRF" \
            --data-urlencode 'site_title=Feedback Authority Gate V2' \
            --data-urlencode 'admin_password=P01Feedback!Authority' \
            --data-urlencode 'admin_password_confirm=P01Feedback!Authority' \
            -o /tmp/p01-feedback-authority-v2-setup-post.html
          cat >/tmp/p01-feedback-authority-v2-seed.php <<'PHP'
          <?php
          require '/tmp/p01-feedback-authority-v2/app/bootstrap.php';
          require_once '/tmp/p01-feedback-authority-v2/app/SurfaceRepository.php';
          $r=new VfRepository(vf_db());$s=new VfSurfaceRepository(vf_db());
          $category=$r->createCategory(['name'=>'反馈验证','description'=>'','is_private'=>false]);
          $x=$r->saveLink(null,['category_id'=>$category,'title'=>'Feedback Authority Seed','url'=>'https://youtube.com/@feedback-authority-seed','description'=>'seed','tags'=>'','is_private'=>false],'manual');
          $s->upsertProfile((int)$x['id'],['surface'=>'channels','resource_kind'=>'creator','surface_note'=>'feedback gate','background_friendly'=>false]);
          echo "P01_FEEDBACK_AUTHORITY_SEED=PASS\n";
          PHP
          php /tmp/p01-feedback-authority-v2-seed.php | grep -Fx P01_FEEDBACK_AUTHORITY_SEED=PASS
          echo P01_FEEDBACK_AUTHORITY_RUNTIME=PASS

      - name: Chromium feedback authority
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVID" /tmp/p01-feedback-authority-v2-playwright
          cd /tmp/p01-feedback-authority-v2-playwright
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat >gate.cjs <<'JS'
          const {chromium}=require('playwright'),fs=require('fs');
          const base='http://127.0.0.1:18360',evid=process.env.EVID;
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:1440,height:1000}});
            const login=await context.request.post(base+'/api.php?action=login',{data:{password:'P01Feedback!Authority'}});
            if(!login.ok()||!(await login.json()).ok) throw new Error('login failed');
            const page=await context.newPage(),errors=[];page.on('pageerror',e=>errors.push(String(e)));
            const semantic=async(locator)=>locator.evaluate(el=>({role:el.getAttribute('role'),live:el.getAttribute('aria-live'),atomic:el.getAttribute('aria-atomic'),error:el.classList.contains('error'),text:el.textContent.trim()}));
            const assertOk=(s,label)=>{if(s.role!=='status'||s.live!=='polite'||s.atomic!=='true'||s.error)throw new Error(label+' '+JSON.stringify(s))};
            const assertError=(s,label)=>{if(s.role!=='alert'||s.live!=='assertive'||s.atomic!=='true'||!s.error)throw new Error(label+' '+JSON.stringify(s))};

            await page.goto(base+'/channels.php',{waitUntil:'networkidle'});await page.locator('[data-open-add]:visible').click();
            const add=page.locator('[data-panel="add"]:not([hidden])');await add.waitFor();
            await add.locator('input[name="url"]').fill('https://youtube.com/@feedback-authority-success');
            await add.locator('input[name="title"]').fill('Feedback Authority Success');
            await add.locator('[data-add-continue]').click();
            const bundleOk=page.locator('.vf-workspace-toast.show:not(.error)').last();await bundleOk.waitFor();
            const bundleOkSem=await semantic(bundleOk);assertOk(bundleOkSem,'bundle success');

            await page.route('**/workspace-create.php',route=>route.fulfill({status:500,contentType:'application/json',body:JSON.stringify({ok:false,error:'模拟创建失败'})}),{times:1});
            await add.locator('input[name="url"]').fill('https://youtube.com/@feedback-authority-error');
            await add.locator('input[name="title"]').fill('Feedback Authority Error');
            await add.locator('[data-add-continue]').click();
            const bundleErr=page.locator('.vf-workspace-toast.show.error').last();await bundleErr.waitFor();
            const bundleErrSem=await semantic(bundleErr);assertError(bundleErrSem,'bundle error');
            await page.screenshot({path:evid+'/bundle-feedback.png'});

            await page.goto(base+'/channels.php',{waitUntil:'networkidle'});await page.waitForTimeout(100);
            await page.locator('[data-select-asset]').first().check();
            const bulkPrivacy=page.locator('[data-bulk-privacy]');await bulkPrivacy.waitFor();await bulkPrivacy.selectOption('private');
            const bulkOk=page.locator('.vf-workspace-toast.show:not(.error)').last();await bulkOk.waitFor();
            const bulkOkSem=await semantic(bulkOk);assertOk(bulkOkSem,'bulk privacy success');

            await page.goto(base+'/channels.php',{waitUntil:'networkidle'});await page.waitForTimeout(100);
            await page.route('**/workspace-visibility-action.php',route=>route.fulfill({status:500,contentType:'application/json',body:JSON.stringify({ok:false,error:'模拟可见范围失败'})}),{times:1});
            await page.locator('[data-select-asset]').first().check();
            const bulkPrivacyFail=page.locator('[data-bulk-privacy]');await bulkPrivacyFail.waitFor();await bulkPrivacyFail.selectOption('public');
            const bulkErr=page.locator('.vf-workspace-toast.show.error').last();await bulkErr.waitFor();
            const bulkErrSem=await semantic(bulkErr);assertError(bulkErrSem,'bulk privacy error');
            await page.screenshot({path:evid+'/bulk-feedback.png'});

            if(errors.length)throw new Error('page errors '+errors.join(' | '));
            fs.writeFileSync(evid+'/metrics.json',JSON.stringify({bundleOk:bundleOkSem,bundleError:bundleErrSem,bulkOk:bulkOkSem,bulkError:bulkErrSem},null,2));
            fs.writeFileSync(evid+'/verdict.txt',`P01_FEEDBACK_AUTHORITY=PASS\nSOURCE=${process.env.SOURCE}\n`);
            await browser.close();console.log('P01_FEEDBACK_AUTHORITY_UI=PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          EVID="$EVID" SOURCE="$SOURCE" node gate.cjs 2>&1 | tee "$EVID/result.txt"
          grep -Fx P01_FEEDBACK_AUTHORITY_UI=PASS "$EVID/result.txt"

      - name: Regression baseline and data integrity
        shell: bash
        run: |
          set -Eeuo pipefail
          php "$ROOT/cli/verify.php" | grep -Fx VERIFY_PASS=YES
          php "$ROOT/cli/surface-verify.php" | grep -Fx MULTI_SURFACE_PASS=YES
          php "$ROOT/cli/baseline-verify.php" | tee /tmp/p01-feedback-authority-v2-baseline.txt
          grep -Fx BASELINE_CORE_PASS=YES /tmp/p01-feedback-authority-v2-baseline.txt
          grep -Fx DRIFT_COUNT=0 /tmp/p01-feedback-authority-v2-baseline.txt
          grep -Fx UNKNOWN_COUNT=0 /tmp/p01-feedback-authority-v2-baseline.txt
          php -r 'require "/tmp/p01-feedback-authority-v2/app/bootstrap.php";$db=vf_db();if(strtolower((string)$db->query("PRAGMA integrity_check")->fetchColumn())!=="ok")exit(1);if($db->query("PRAGMA foreign_key_check")->fetchAll(PDO::FETCH_ASSOC))exit(2);echo "P01_FEEDBACK_AUTHORITY_SQLITE=PASS\n";' | grep -Fx P01_FEEDBACK_AUTHORITY_SQLITE=PASS
          echo P01_FEEDBACK_AUTHORITY_REGRESSION=PASS

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-feedback-authority-v2-${{ github.run_id }}
          path: /tmp/p01-feedback-authority-v2-evid
          if-no-files-found: error
          retention-days: 30

      - name: Verdict
        run: |
          echo P01_FEEDBACK_AUTHORITY_SOURCE=$SOURCE
          echo P01_FEEDBACK_AUTHORITY_TREE=$TREE
          echo P01_FEEDBACK_AUTHORITY_GATE=PASS
          echo PRODUCT_FILES_CHANGED=1
          echo SCHEMA_CHANGE=NO
          echo PRODUCTION_WRITE=NO

      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/p01-feedback-authority-v2.pid 2>/dev/null)" 2>/dev/null || true
