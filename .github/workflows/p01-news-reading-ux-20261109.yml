name: P01 News reading 20-item UX exact browser regression
on:
  push:
    branches:
      - task/p01-news-reading-ux-proof-20261109
permissions:
  contents: read
concurrency:
  group: p01-news-reading-ux-20261109
  cancel-in-progress: false
jobs:
  news-reading:
    if: github.repository == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PRODUCT_SHA: 84538cb8dd24f67281f2f60afbf26bd805e39065
      VF_NEWS_BROWSER_MODULE: /tmp/p01-news-reading-browser
      PLAYWRIGHT_BROWSERS_PATH: /tmp/p01-news-reading-chromium
    steps:
      - name: Checkout registered runner entry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare isolated local PHP/SQLite and browser dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-curl php-xml php-mbstring php-sqlite3 php-zip php-gd unzip >/dev/null
          php -m | grep -Fxi pdo_sqlite
          php -m | grep -Fxi SimpleXML
          echo P01_NEWS_UX_RUNTIME=PASS
      - name: Checkout precise P01 product source into disposable workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 84538cb8dd24f67281f2f60afbf26bd805e39065
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p01-exact
          persist-credentials: false
      - name: Scope, PHP, JavaScript and existing News rights checks
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p01-exact rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(tr -d '\r\n ' < p01-exact/VERSION)" = "2.47.506"
          test "$(tr -d '\r\n ' < p01-exact/src/VERSION.txt)" = "2.47.506"
          php -l p01-exact/src/app/NewsFeedPage.php >/dev/null
          node --check p01-exact/src/assets/news-feed.js
          node --check p01-exact/tests/browser/p01_news_r4_chromium.cjs
          php p01-exact/tests/unit/p01_news_release_surface_contract.php | tee /tmp/p01-news-rights.txt
          grep -F 'P01_NEWS_R9_PUBLIC_SECURITY_API_SEO=PASS checks=114' /tmp/p01-news-rights.txt
          echo P01_NEWS_UX_RIGHTS_AND_SOURCE=PASS
      - name: Real Chromium Owner Guest 1440 768 390 and progressive reading
        shell: bash
        timeout-minutes: 15
        run: |
          set -Eeuo pipefail
          mkdir -p "$VF_NEWS_BROWSER_MODULE" "$PLAYWRIGHT_BROWSERS_PATH"
          npm install --silent --no-audit --no-fund --prefix "$VF_NEWS_BROWSER_MODULE" playwright@1.56.1
          "$VF_NEWS_BROWSER_MODULE/node_modules/.bin/playwright" install chromium-headless-shell >/dev/null
          node p01-exact/tests/browser/p01_news_r4_chromium.cjs | tee /tmp/p01-news-ux-browser.txt
          grep -F 'P01_NEWS_CHROMIUM_CHECK=first-paint-only-twenty-rows' /tmp/p01-news-ux-browser.txt
          grep -F 'P01_NEWS_CHROMIUM_CHECK=paging-never-contacts-rss-provider' /tmp/p01-news-ux-browser.txt
          grep -F 'P01_NEWS_CHROMIUM_CHECK=category-reset-batch-to-twenty' /tmp/p01-news-ux-browser.txt
          grep -F 'P01_NEWS_CHROMIUM_CHECK=refresh-failure-names-source-and-retains-cache' /tmp/p01-news-ux-browser.txt
          grep -F 'P01_NEWS_CHROMIUM_CHECK=unlicensed-guest-still-sees-no-news-rows' /tmp/p01-news-ux-browser.txt
          grep -F 'P01_NEWS_R4_CHROMIUM=PASS checks=' /tmp/p01-news-ux-browser.txt
          echo P01_NEWS_UX_BROWSER=PASS
          echo P01_PROVIDER_WRITES=NONE
          echo P01_PRODUCTION_WRITES=NONE
      - name: Delete transient private checkout and browser environment
        if: always()
        shell: bash
        run: |
          rm -rf p01-exact "$VF_NEWS_BROWSER_MODULE" "$PLAYWRIGHT_BROWSERS_PATH"
          echo P01_PRIVATE_SOURCE_PERSISTED=NO
