name: P07 #293 Known Unsafe SQL No Repair Attempt Proof
on:
  pull_request:
    paths: ['.github/workflows/p07-293-unsafe-sql-no-attempt.yml']
permissions:
  contents: read
jobs:
  exact-source:
    if: ${{ github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Ephemeral exact P07 private candidate checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: d0f0bc9d6388ee48f4590dbe46b783133a909ea7
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p07-exact
          fetch-depth: 1
      - name: Run only failed one-shot repair guard tests
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd p07-exact
          test "$(git rev-parse HEAD)" = d0f0bc9d6388ee48f4590dbe46b783133a909ea7
          export PYTHONDONTWRITEBYTECODE=1
          python3 -B -m unittest -q tests.test_migration_failed_laravel_recovery
          echo 'P07_293_UNSAFE_SQL_NO_ATTEMPT_OR_OLD_VPS_STAGE_PASS'
      - name: Clean temporary private source even on failure
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- p07-exact
          echo 'P07_PRIVATE_SOURCE_CLEANED'
