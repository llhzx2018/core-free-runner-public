name: S01-C02 V1.21.997 Technical Page Family Candidate Gate

on:
  push:
    branches:
      - release/s01-c02-121997-technical-page-family
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REPOSITORY: llhzx2018/vf-tools-ops
  TARGET_SHA: 0827591bbec98fec16cb6fcfd1d1174c3dc64bcc
  BASE_SHA: 3694998ec9b9a42109e8d9caac6bcf6f78a327d3
  TARGET_VERSION: 1.21.997
  BASE_VERSION: 1.21.996
  ARTIFACT_NAME: vf-tools-ops_V1.21.997.zip

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.BASE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: baseline
          fetch-depth: 1
          persist-credentials: false

      - name: Exact bounded diff and contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n' < target/VERSION)" = "$TARGET_VERSION"
          grep -Fq "Version: $TARGET_VERSION" target/vf-ops.php
          grep -Fq "S01-V9-TECHNICAL-INDEX-PAGE-FAMILY" target/vf-ops.php
          git -C target diff --name-only "$BASE_SHA..$TARGET_SHA" | tee evidence/changed-files.txt
          php target/tests/s01-c02-121997-technical-page-family-contract.php
          php target/tests/s01-c02-page-body-system-v2-full-surface-contract.php
          php target/tests/s01-c02-121934-shell-header-visual-lock-r45-contract.php
          php target/tests/s01-c02-prod-realuse-r18-unified-page-frame-contract.php
          php target/tests/s01-c02-prod-realuse-r20-production-screenshot-closure-contract.php
          node --check target/tests/s01-c02-121997-technical-page-family-browser-proof.js
          docker run --rm -v "$PWD/target:/src:ro" -w /src php:8.2-cli sh -lc 'find . -path "./.git" -prune -o -name "*.php" -print0 | xargs -0 -n1 php -l >/dev/null'
          echo PAGE_SOURCE_CONTRACT=PASS

      - name: Build deterministic packages
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib,json,re,zipfile
          from pathlib import Path
          def keep(rel):
              p=rel.as_posix(); parts=p.split('/')
              if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in parts): return False
              if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',p,re.I): return False
              if '/' not in p: return p in {'vf-ops.php','uninstall.php'}
              return parts[0] in {'includes','assets','languages','config'}
          def files(root):
              out={}
              for p in root.rglob('*'):
                  if p.is_file() and not p.is_symlink():
                      rel=p.relative_to(root)
                      if keep(rel): out[rel.as_posix()]=p.read_bytes()
              return dict(sorted(out.items()))
          def fp(fs):
              h=hashlib.sha256()
              for rel,data in sorted(fs.items()):
                  h.update(rel.encode());h.update(b'\0');h.update(hashlib.sha256(data).hexdigest().encode());h.update(b'\n')
              return h.hexdigest()
          def pack(root,out):
              fs=files(root)
              with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
                  for rel,data in sorted(fs.items()):
                      info=zipfile.ZipInfo('vf-ops/'+rel,(2026,10,2,0,0,0));info.compress_type=zipfile.ZIP_DEFLATED;info.external_attr=0o100644<<16;z.writestr(info,data)
              return fs
          rows={}
          for label,root,ver,out in [('baseline',Path('baseline'),'1.21.996',Path('/tmp/vf-tools-ops_V1.21.996.zip')),('candidate',Path('target'),'1.21.997',Path('/tmp/vf-tools-ops_V1.21.997.zip'))]:
              fs=pack(root,out)
              rows[label]={'version':ver,'files':len(fs),'bytes':out.stat().st_size,'sha256':hashlib.sha256(out.read_bytes()).hexdigest(),'runtime_fingerprint':fp(fs)}
          Path('evidence/package.json').write_text(json.dumps(rows,indent=2)+'\n')
          print(json.dumps(rows,indent=2))
          PY
          cp "/tmp/$ARTIFACT_NAME" "evidence/$ARTIFACT_NAME"
          unzip -tq "evidence/$ARTIFACT_NAME"

      - name: Upgrade preservation
        shell: bash
        run: |
          set -Eeuo pipefail
          NET="vf-ti-${GITHUB_RUN_ID}"; DB="vf-ti-db-${GITHUB_RUN_ID}"; WP="vf-ti-wp-${GITHUB_RUN_ID}"
          PORT="$((19000 + (GITHUB_RUN_ID % 9000)))"
          cleanup(){ docker rm -f "$WP" "$DB" >/dev/null 2>&1 || true; docker network rm "$NET" >/dev/null 2>&1 || true; }
          trap cleanup EXIT; cleanup; docker network create "$NET" >/dev/null
          docker run -d --name "$DB" --network "$NET" -e MARIADB_DATABASE=vf_test -e MARIADB_USER=vf_runner -e MARIADB_PASSWORD=vf_runner_ephemeral -e MARIADB_ROOT_PASSWORD=vf_root_ephemeral mariadb:11.8.8 >/dev/null
          for i in $(seq 1 40); do docker exec "$DB" mariadb-admin ping -uroot -pvf_root_ephemeral --silent >/dev/null 2>&1 && break || sleep 2; done
          docker run -d --name "$WP" --network "$NET" -p "127.0.0.1:${PORT}:80" -e WORDPRESS_DB_HOST="$DB:3306" -e WORDPRESS_DB_USER=vf_runner -e WORDPRESS_DB_PASSWORD=vf_runner_ephemeral -e WORDPRESS_DB_NAME=vf_test wordpress:7.1.2-php8.3-apache >/dev/null
          for i in $(seq 1 40); do curl -fsS "http://127.0.0.1:${PORT}/wp-login.php" >/dev/null 2>&1 && break || sleep 2; done
          curl -fsSL https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar -o /tmp/wp-cli.phar
          docker cp /tmp/wp-cli.phar "$WP:/usr/local/bin/wp"; docker exec "$WP" chmod +x /usr/local/bin/wp
          docker cp /tmp/vf-tools-ops_V1.21.996.zip "$WP:/tmp/base.zip"
          docker cp "/tmp/$ARTIFACT_NAME" "$WP:/tmp/candidate.zip"
          BASE_URL="http://127.0.0.1:${PORT}"
          docker exec "$WP" wp core install --allow-root --path=/var/www/html --url="$BASE_URL" --title='VF Technical Gate' --admin_user=admin --admin_password='VF-TI-Gate!' --admin_email=fixture@example.invalid --skip-email >/dev/null
          docker exec "$WP" wp plugin install /tmp/base.zip --activate --force --allow-root --path=/var/www/html >/dev/null
          docker exec "$WP" wp option update vf_ops_v121997_fixture '{"keep":"yes"}' --format=json --allow-root --path=/var/www/html >/dev/null
          docker exec "$WP" wp plugin install /tmp/candidate.zip --activate --force --allow-root --path=/var/www/html >/dev/null
          test "$(docker exec "$WP" wp plugin get vf-ops --field=version --allow-root --path=/var/www/html)" = "$TARGET_VERSION"
          test "$(docker exec "$WP" wp option get vf_ops_v121997_fixture --format=json --allow-root --path=/var/www/html | jq -r '.keep')" = "yes"
          echo UPGRADE_PRESERVATION=PASS
          echo "VF_BASE_URL=$BASE_URL" >> "$GITHUB_ENV"; echo "VF_WP_CONTAINER=$WP" >> "$GITHUB_ENV"; echo "VF_DB_CONTAINER=$DB" >> "$GITHUB_ENV"; echo "VF_DOCKER_NETWORK=$NET" >> "$GITHUB_ENV"
          trap - EXIT

      - name: Authenticated browser regression
        shell: bash
        env:
          WP_ADMIN_PASSWORD: VF-TI-Gate!
        run: |
          set -Eeuo pipefail
          cd target/.github/phase3
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.58.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          node browser-e2e.js "$VF_BASE_URL" "$GITHUB_WORKSPACE/evidence/browser.json"
          jq -e '.result=="PASS" and .login=="PASS" and .blocking_errors==0 and .responsive_failures==0' "$GITHUB_WORKSPACE/evidence/browser.json" >/dev/null

      - name: Technical page-family browser proof
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/ti-node
          cd /tmp/ti-node
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.58.2 >/dev/null
          npx playwright install chromium >/dev/null
          cd "$GITHUB_WORKSPACE/target"
          export NODE_PATH=/tmp/ti-node/node_modules
          node tests/s01-c02-121997-technical-page-family-browser-proof.js | tee "$GITHUB_WORKSPACE/evidence/technical-page-family-browser.json"
          jq -e '.pass==true and ([.checks[]|select(.fixture=="technical")]|length)==6 and ([.checks[]|select(.fixture=="refine-selector")]|length)==6 and ([.checks[]|select(.fixture=="refine-detail")]|length)==6 and ([.checks[].failures[]]|length)==0 and .owner_product_pass==false' "$GITHUB_WORKSPACE/evidence/technical-page-family-browser.json" >/dev/null
          echo TECHNICAL_PAGE_FAMILY_18_CASES=PASS

      - name: Security and page-family boundary proof
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          changed=set(Path('evidence/changed-files.txt').read_text().splitlines())
          allowed={
            'CHANGELOG.md','VERSION','vf-ops.php',
            'assets/css/current/admin-s01-seo-refine-r1.css',
            'assets/css/current/admin-s01-technical-index-r1.css',
            'includes/admin-v13/views/seo_refine.php',
            'includes/admin-v13/views/seo_technical.php',
            'includes/views/admin-style-helpers/admin-s01-uiux-polish.php',
            'tests/s01-c02-121997-technical-page-family-browser-proof.js',
            'tests/s01-c02-121997-technical-page-family-contract.php'
          }
          if changed != allowed:
              raise SystemExit('unexpected release diff: '+repr(sorted(changed-allowed)))
          for p in ['target/assets/css/current/admin-s01-technical-index-r1.css','target/assets/css/current/admin-s01-seo-refine-r1.css']:
              css=Path(p).read_text()
              for forbidden in ['.vf-v6-shell-header','.vf-v6-domain-nav','.vf-v6-domain-menu','.vf-ops-s01-shell']:
                  assert forbidden not in css, forbidden
          route=Path('target/includes/admin-v13/route-contract.php').read_text()
          assert "'acceptance_source'=>['page'=>'vf-toolsite-online-acceptance'" in route
          assert "'acceptance_online'=>['page'=>'vf-toolsite-online-acceptance'" in route
          assert "'publish_zip' => ['key'=>'publish_zip','page'=>'vf-toolsite-publish'" in route
          assert "'system_plugins' => ['key'=>'system_plugins','page'=>'vf-toolsite-system-settings'" in route
          print('TECHNICAL_PAGE_FAMILY_BOUNDARY=PASS')
          print('FROZEN_SHELL_HEADER_MENU=PASS')
          PY
          test ! -e target/.env
          test ! -e target/private

      - name: Final evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -n --arg sha "$TARGET_SHA" --arg version "$TARGET_VERSION" --argjson package "$(cat evidence/package.json)" --argjson browser "$(cat evidence/browser.json)" --argjson pagefamily "$(cat evidence/technical-page-family-browser.json)" '{status:"PASS",candidate_sha:$sha,candidate_version:$version,package:$package,browser:$browser,page_family:{result:($pagefamily.pass|if . then "PASS" else "FAIL" end),technical_checks:([$pagefamily.checks[]|select(.fixture=="technical")]|length),refine_selector_checks:([$pagefamily.checks[]|select(.fixture=="refine-selector")]|length),refine_detail_checks:([$pagefamily.checks[]|select(.fixture=="refine-detail")]|length)},upgrade:"PASS",security_boundary:"PASS",cross_domain_destinations:"PRESERVED",frozen_shell_header_menu:"PASS",owner_real_use:"POST_PRODUCTION_REQUIRED",production:"NOT_EXECUTED"}' | tee evidence/FINAL_EVIDENCE.json
          sha256sum "evidence/$ARTIFACT_NAME" | tee evidence/SHA256SUMS.txt
          echo 'S01-C02 V1.21.997 TECHNICAL PAGE FAMILY MACHINE PASS'

      - name: Upload exact candidate
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-v1.21.997-technical-page-family-candidate
          path: evidence/
          retention-days: 30

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          docker rm -f "${VF_WP_CONTAINER:-}" "${VF_DB_CONTAINER:-}" >/dev/null 2>&1 || true
          docker network rm "${VF_DOCKER_NETWORK:-}" >/dev/null 2>&1 || true
