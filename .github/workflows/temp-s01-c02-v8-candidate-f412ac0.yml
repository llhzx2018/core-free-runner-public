name: S01-C02 V8 Candidate Proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-s01-c02-v8-candidate-f412ac0.yml'

permissions:
  contents: read

env:
  TARGET_REPOSITORY: llhzx2018/vf-tools-ops
  TARGET_SHA: f412ac03f93fc37a46d8f6986f476b4f2bd2a531
  BASE_SHA: dae5e45099c3eb7f892ea6a67b4b0212a4235246

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout runner control repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Credential and runner allocation gate
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo "PRIVATE_READ_TOKEN_PRESENT=PASS"
          echo "RUNNER_OS=$RUNNER_OS"
          php -v
          node --version
          google-chrome --version || google-chrome-stable --version || chromium --version

      - name: Checkout exact private candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          path: target
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Exact source and frozen-boundary gate
        shell: bash
        working-directory: target
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          python3 - <<'PY'
          import os, subprocess
          base=os.environ["BASE_SHA"]; head=os.environ["TARGET_SHA"]
          changed=set(subprocess.check_output(["git","diff","--name-only",base,head], text=True).splitlines())
          expected={
            "assets/css/v13/seo/keywords.css",
            "assets/css/v13/system/plugins.css",
            "assets/js/admin-s01-page-frame-r18.js",
            "assets/js/v13/system/plugins.js",
            "includes/admin-v13/views/seo_keywords.php",
            "includes/admin-v13/views/system_plugins.php",
            "tests/s01-c02-v8-reference-body-contract.php",
          }
          if changed != expected:
              raise SystemExit("changed-file set mismatch: "+repr(sorted(changed)))
          forbidden=("shell","header-menu","header_menu","global-header","admin-shell")
          bad=[p for p in changed if any(x in p.lower() for x in forbidden)]
          if bad:
              raise SystemExit("frozen boundary touched: "+repr(bad))
          print("EXACT_SOURCE=PASS")
          print("FROZEN_SHELL_HEADER_MENU_BOUNDARY=PASS")
          PY

      - name: PHP and JS syntax
        shell: bash
        working-directory: target
        run: |
          set -Eeuo pipefail
          php -l includes/admin-v13/views/system_plugins.php
          php -l includes/admin-v13/views/seo_keywords.php
          php -l tests/s01-c02-v8-reference-body-contract.php
          node --check assets/js/v13/system/plugins.js
          node --check assets/js/admin-s01-page-frame-r18.js
          echo "SOURCE_SYNTAX=PASS"

      - name: Focused V8 contract
        shell: bash
        working-directory: target
        run: |
          set -Eeuo pipefail
          php tests/s01-c02-v8-reference-body-contract.php

      - name: Install browser driver library
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --user playwright==1.55.0 >/dev/null
          echo "PLAYWRIGHT_PY=READY"

      - name: Responsive browser proof
        shell: bash
        working-directory: target
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/v8-proof
          cat >/tmp/v8-proof/proof.py <<'PY'
          import json, os, shutil
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          root=Path.cwd()
          kw_css=(root/"assets/css/v13/seo/keywords.css").read_text()
          sys_css=(root/"assets/css/v13/system/plugins.css").read_text()
          chrome=next((p for p in ["/usr/bin/google-chrome","/usr/bin/google-chrome-stable","/usr/bin/chromium"] if Path(p).exists()),None)
          if not chrome:
              raise SystemExit("system Chrome missing")

          base_css="*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;font-family:Arial,sans-serif}.proof-shell{max-width:1600px;margin:auto;padding:24px}.button{display:inline-flex;align-items:center;text-decoration:none;border:1px solid #ccd5d9;padding:0 12px;background:#fff;color:#263b43}"

          keyword_body="""
          <section class="vf-keyword-map is-workspace-map" data-vf-native-body-v8="keywords">
            <header class="vf-v8-keyword-pagebar"><h1>页面与关键词地图</h1><div class="vf-v8-keyword-pagebar-actions"><a class="button">导出</a><a class="button button-primary">进入页面策划</a></div></header>
            <div class="vf-v8-keyword-viewbar"><nav class="vf-v8-keyword-tabs"><a class="is-active">全部 <b>120</b></a><a>阻断 <b>4</b></a><a>待分配 <b>18</b></a><a>已归属 <b>102</b></a></nav><nav class="vf-v8-keyword-secondary"><a>关键词研究</a><a>历史迁移</a></nav></div>
            <section class="vf-keyword-map-console" id="vf-keyword-map">
              <form class="vf-keyword-map-filters">
                <label><span>搜索</span><input type="search" value="download"></label>
                <label><span>语言</span><select><option>全部</option></select></label>
                <label><span>角色</span><select><option>全部</option></select></label>
                <label><span>状态</span><select><option>全部</option></select></label>
                <label><span>页面类型</span><select><option>全部</option></select></label>
                <label><span>每页</span><select><option>20 条</option></select></label>
                <button class="button">应用筛选</button><a class="button">重置</a>
              </form>
              <div class="vf-keyword-map-result"><strong>120 条记录</strong><span>第 1 / 6 页</span></div>
              <div class="vf-keyword-map-table-wrap">
                <table class="vf-keyword-map-table"><thead><tr><th>关键词与角色</th><th>目标页面</th><th>搜索意图</th><th>竞争诊断</th><th>证据</th><th>操作</th></tr></thead><tbody>
                <tr><td><b>m3u8 downloader</b><span>EN · 主关键词</span></td><td><strong>M3U8 Downloader</strong><span>已绑定页面家族</span></td><td><strong>工具使用</strong><span>集群：download</span></td><td><span>当前未发现冲突。</span></td><td><strong>已有验证证据</strong><small>20 点击 · 300 展现</small></td><td><a class="button">调整归属</a></td></tr>
                </tbody></table>
              </div>
            </section>
          </section>
          """

          system_body="""
          <div class="vf-plugin-page" data-vf-plugin-root data-vf-native-body-v8="system">
            <header class="vf-v8-system-pagebar"><h1>组件与系统</h1><button class="button button-primary">刷新组件状态</button></header>
            <div class="vf-v8-system-layout">
              <nav class="vf-v8-system-localnav" data-vf-v8-system-localnav><span>组件与系统</span><a class="is-active" href="#vf-plugin-inventory">组件 <b>12</b></a><a href="#vf-system-updates">更新 <b>2</b></a><a href="#vf-plugin-policy">治理</a><a href="#vf-plugin-dependency">依赖与移除</a><i></i><a href="#vf-plugin-professional">审计与证据</a></nav>
              <div class="vf-v8-system-content">
                <section class="vf-plugin-section" id="vf-plugin-inventory"><div class="vf-plugin-section-head"><div><h2>当前安装、启用与策略冲突</h2><p>版本与启用状态直接读取当前 WordPress。</p></div></div><div class="vf-plugin-inventory-list vf-plugin-inventory-scroll"><div class="vf-plugin-list-head"><span>插件与文件</span><span>运行状态</span><span>版本与更新</span><span>治理策略</span><span>当前问题</span></div><article class="vf-plugin-inventory-row"><div><strong>VF Tools Ops</strong><code>vf-ops/vf-ops.php</code></div><div><span class="vf-plugin-chip is-pass">已启用</span><small>人工控制</small></div><div><strong>1.21.969</strong><small>暂无候选更新</small></div><div><span class="vf-plugin-chip is-pass">必须保留</span></div><div><strong>通过</strong><small>无策略冲突</small></div></article></div></section>
                <section class="vf-system-overview" id="vf-system-updates"><div class="vf-system-health"><strong>正常</strong></div><div class="vf-system-updates"><div class="vf-system-updates-head"><div><strong>VF 在线更新</strong><small>唯一 OWNER 更新入口。</small></div><a class="button">打开 VF 在线更新</a></div><div class="vf-system-component-list"><article><div><strong>VF Tools Ops</strong><small>S01-C02</small></div><code>1.21.969</code><span class="vf-plugin-chip is-warn">有可用更新</span><div class="vf-system-component-action"><a class="button">管理组件</a></div></article></div></div></section>
                <details class="vf-plugin-section vf-plugin-product-disclosure" id="vf-plugin-policy"><summary><span>治理策略</span><strong>按需编辑</strong></summary></details>
                <details class="vf-plugin-section vf-plugin-product-disclosure" id="vf-plugin-dependency"><summary><span>依赖与移除门禁</span><strong>通过</strong></summary></details>
                <details class="vf-plugin-professional vf-plugin-product-disclosure" id="vf-plugin-professional"><summary><span>专业信息与审计</span><strong>Revision 1</strong></summary></details>
              </div>
            </div>
          </div>
          """

          def html(css,body):
              return '<!doctype html><html><head><meta charset="utf-8"><style>'+base_css+'\\n'+css+'</style></head><body><main class="proof-shell">'+body+'</main></body></html>'

          specs=[
              {"name":"keywords","css":kw_css,"body":keyword_body,"root":'[data-vf-native-body-v8="keywords"]',"bar":".vf-v8-keyword-pagebar"},
              {"name":"system","css":sys_css,"body":system_body,"root":'[data-vf-native-body-v8="system"]',"bar":".vf-v8-system-pagebar"},
          ]
          results=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True, executable_path=chrome, args=["--no-sandbox"])
              for spec in specs:
                  for width in [1440,1024,768,390]:
                      page=browser.new_page(viewport={"width":width,"height":1200})
                      page.set_content(html(spec["css"],spec["body"]),wait_until="load")
                      m=page.evaluate("""({rootSel,barSel,width})=>{
                        const root=document.querySelector(rootSel),h1=root.querySelector('h1'),bar=root.querySelector(barSel);
                        const doc=document.documentElement,body=document.body;
                        const outer=Math.max(doc.scrollWidth,body.scrollWidth);
                        return {width,outerWidth:outer,clientWidth:doc.clientWidth,outerOverflow:outer>doc.clientWidth+1,rootFont:parseFloat(getComputedStyle(root).fontSize),h1Font:parseFloat(getComputedStyle(h1).fontSize),pagebarHeight:bar.getBoundingClientRect().height};
                      }""",{"rootSel":spec["root"],"barSel":spec["bar"],"width":width})
                      if m["outerOverflow"]:
                          raise RuntimeError(f'{spec["name"]} {width}: outer overflow {m["outerWidth"]}>{m["clientWidth"]}')
                      if m["rootFont"] < 14:
                          raise RuntimeError(f'{spec["name"]} {width}: root font too small {m["rootFont"]}')
                      if m["h1Font"] < 24:
                          raise RuntimeError(f'{spec["name"]} {width}: h1 too small {m["h1Font"]}')
                      if m["pagebarHeight"] > 150:
                          raise RuntimeError(f'{spec["name"]} {width}: pagebar too tall {m["pagebarHeight"]}')
                      page.screenshot(path=f'/tmp/v8-proof/{spec["name"]}-{width}.png',full_page=True)
                      results.append({"surface":spec["name"],**m})
                      page.close()
              browser.close()
          Path("/tmp/v8-proof/browser-proof.json").write_text(json.dumps({"status":"PASS","proof_kind":"SYNTHETIC_ACTUAL_CSS","widths":[1440,1024,768,390],"results":results},ensure_ascii=False,indent=2))
          print("RESPONSIVE_BROWSER_PROOF=PASS")
          PY
          python3 /tmp/v8-proof/proof.py
          cat /tmp/v8-proof/browser-proof.json

      - name: Build public-safe candidate receipt
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/v8-proof
          cat >/tmp/v8-proof/CANDIDATE_RECEIPT.txt <<EOF
          PROJECT=S01-C02
          TARGET_REPOSITORY=$TARGET_REPOSITORY
          TARGET_SHA=$TARGET_SHA
          BASE_SHA=$BASE_SHA
          PRIVATE_SOURCE_PERSISTED=NO
          PRODUCT_WRITE=NO
          MERGE=NO
          RELEASE=NO
          DISTRIBUTION=NO
          PRODUCTION=NO
          OWNER_PRODUCT_PASS=NOT_CLAIMED
          BROWSER_PROOF_KIND=SYNTHETIC_ACTUAL_CSS
          EOF

      - name: Upload public-safe proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-v8-candidate-proof-${{ github.run_id }}
          path: /tmp/v8-proof
          retention-days: 14
          if-no-files-found: error
