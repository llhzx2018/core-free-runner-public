name: P01 V2.47.9 Distribution Discovery

on:
  pull_request:
    paths:
      - '.github/workflows/p01-v2479-distribution-discovery.yml'

permissions:
  contents: read

jobs:
  discovery:
    if: github.head_ref == 'temp/p01-v2479-distribution-discovery-20260911'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Read stable updater authority through installed-client API route
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN"
          curl -fsSL --retry 3 --retry-delay 1 --connect-timeout 10 \
            -H "Authorization: Bearer $PRIVATE_READ_TOKEN" \
            -H 'Accept: application/vnd.github.raw+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'User-Agent: vf-start-core-updates-v1' \
            'https://api.github.com/repos/llhzx2018/core-updates/contents/projects/P01.json?ref=main' \
            -o /tmp/P01.json
          jq -e '
            .schema_version=="1.0" and
            .project_id=="P01" and
            .component_id=="APP" and
            .enabled==true and
            .current_version=="2.47.8" and
            .target_version=="2.47.9" and
            .update_type=="ATOMIC" and
            .from_versions==["2.47.8"] and
            .schema_from=="2026090401" and
            .schema_to=="2026090401" and
            .repository=="llhzx2018/vf-start" and
            .release_tag=="v2.47.9" and
            .release_id==387408254 and
            .product_identity=="89df52cede9f03c88627396e66afe97325214353" and
            .asset_name=="VF_Start_V2.47.9_UPDATE.zip" and
            .asset_bytes==1842494 and
            .asset_sha256=="25c289d783a3371e0ea8c30159fad382b4da0469ef3d804299cbaccaa82ef6d4" and
            .backup_required==true and
            .rollback_supported==true
          ' /tmp/P01.json >/dev/null
          echo P01_V2479_CHANNEL_DISCOVERY=PASS

      - name: Verify stable tag and release identity through installed-client API route
        shell: bash
        run: |
          set -Eeuo pipefail
          common=(-H "Authorization: Bearer $PRIVATE_READ_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' -H 'User-Agent: vf-start-core-updates-v1')
          curl -fsSL --retry 3 "${common[@]}" 'https://api.github.com/repos/llhzx2018/vf-start/git/ref/tags/v2.47.9' -o /tmp/tag.json
          test "$(jq -r '.object.sha' /tmp/tag.json)" = '89df52cede9f03c88627396e66afe97325214353'
          curl -fsSL --retry 3 "${common[@]}" 'https://api.github.com/repos/llhzx2018/vf-start/releases/tags/v2.47.9' -o /tmp/release.json
          jq -e '.id==387408254 and .draft==false and .prerelease==false and .tag_name=="v2.47.9" and .name=="VF Start V2.47.9"' /tmp/release.json >/dev/null
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.47.9_UPDATE.zip")|.id' /tmp/release.json)" = '558334273'
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.47.9_UPDATE.zip")|.size' /tmp/release.json)" = '1842494'
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.47.9_UPDATE.zip")|.digest' /tmp/release.json)" = 'sha256:25c289d783a3371e0ea8c30159fad382b4da0469ef3d804299cbaccaa82ef6d4'
          echo P01_V2479_RELEASE_DISCOVERY=PASS

      - name: Download release bytes through installed-client asset route
        shell: bash
        run: |
          set -Eeuo pipefail
          UPDATE_URL=$(jq -r '.assets[]|select(.name=="VF_Start_V2.47.9_UPDATE.zip")|.url' /tmp/release.json)
          FULL_URL=$(jq -r '.assets[]|select(.name=="VF-Start-V2.47.9-FULL.zip")|.url' /tmp/release.json)
          test -n "$UPDATE_URL" && test "$UPDATE_URL" != null && test -n "$FULL_URL" && test "$FULL_URL" != null
          curl -fL --retry 3 --retry-delay 1 --connect-timeout 10 \
            -H "Authorization: Bearer $PRIVATE_READ_TOKEN" \
            -H 'Accept: application/octet-stream' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'User-Agent: vf-start-core-updates-v1' \
            "$UPDATE_URL" -o /tmp/VF_Start_V2.47.9_UPDATE.zip
          test "$(stat -c %s /tmp/VF_Start_V2.47.9_UPDATE.zip)" = '1842494'
          test "$(sha256sum /tmp/VF_Start_V2.47.9_UPDATE.zip | awk '{print $1}')" = '25c289d783a3371e0ea8c30159fad382b4da0469ef3d804299cbaccaa82ef6d4'
          test "$(unzip -Z1 /tmp/VF_Start_V2.47.9_UPDATE.zip | wc -l | tr -d ' ')" = '1'
          unzip -Z1 /tmp/VF_Start_V2.47.9_UPDATE.zip | grep -Fxq 'repair-v2.47.9.php'
          curl -fL --retry 3 --retry-delay 1 --connect-timeout 10 \
            -H "Authorization: Bearer $PRIVATE_READ_TOKEN" \
            -H 'Accept: application/octet-stream' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'User-Agent: vf-start-core-updates-v1' \
            "$FULL_URL" -o /tmp/VF-Start-V2.47.9-FULL.zip
          test "$(stat -c %s /tmp/VF-Start-V2.47.9-FULL.zip)" = '863602'
          test "$(sha256sum /tmp/VF-Start-V2.47.9-FULL.zip | awk '{print $1}')" = 'a09eea1c38b1283f416ff3c9182f7f8eb523a5a1425e4c49ac74669cada8755a'
          echo P01_V2479_REMOTE_UPDATE_BYTES=PASS

      - name: Final distribution verdict
        run: |
          echo P01_V2479_DISTRIBUTION_DISCOVERY=PASS
          echo FORMAL_RELEASE=true
          echo DISTRIBUTION=true
          echo PRODUCTION=false
