name: P01 V2.37.4 Manifest Gate
on:
  push:
    branches: [release/p01-v2374-hotfix-20260902]
    paths: [.github/workflows/p01-v2374-manifest-gate-20260902.yml]
permissions:
  contents: read
jobs:
  manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: dac1d05f3273daa7760b2f1820163df21116a145
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          path: live
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: 727a092e0d23855c2866fa4d86d0a04720820b44
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: candidate
      - name: Exact manifest boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = 727a092e0d23855c2866fa4d86d0a04720820b44
          test "$(git -C candidate rev-parse HEAD^)" = dac1d05f3273daa7760b2f1820163df21116a145
          test "$(git -C candidate diff --name-only HEAD^ HEAD)" = projects/P01.json
          jq -e '.current_version=="2.37.2" and .target_version=="2.37.3" and .from_versions==["2.37.2"]' live/projects/P01.json >/dev/null
          jq -e '.enabled==true and .current_version=="2.37.3" and .target_version=="2.37.4" and .from_versions==["2.37.3"] and .update_type=="ATOMIC" and .schema_from=="2026082901" and .schema_to=="2026082901" and .release_tag=="v2.37.4" and .release_id==381061019 and .product_identity=="4532e6443805cefe141efc1f70f1689e532450b9" and .asset_name=="VF_Start_V2.37.4_UPDATE.zip" and .asset_bytes==1271825 and .asset_sha256=="6937373fefbdf6f1f8b7b52cf715db4f61bbdbca36c8032cd6db67ba41084c69"' candidate/projects/P01.json >/dev/null
          ! jq -e '.from_versions|index("2.37.2")' candidate/projects/P01.json >/dev/null
      - name: Release asset readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          REL="$(gh api repos/llhzx2018/vf-start/releases/381061019)"
          test "$(jq -r .tag_name <<<"$REL")" = v2.37.4
          test "$(jq -r .draft <<<"$REL")" = false
          test "$(jq -r .prerelease <<<"$REL")" = false
          test "$(jq '.assets|length' <<<"$REL")" = 8
          ID="$(jq -r '.assets[]|select(.name=="VF_Start_V2.37.4_UPDATE.zip")|.id' <<<"$REL")"
          test -n "$ID"
          curl -L --fail-with-body --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/octet-stream' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/llhzx2018/vf-start/releases/assets/$ID" -o /tmp/update.zip
          test "$(stat -c%s /tmp/update.zip)" = 1271825
          test "$(sha256sum /tmp/update.zip | cut -d' ' -f1)" = 6937373fefbdf6f1f8b7b52cf715db4f61bbdbca36c8032cd6db67ba41084c69
          printf 'P01_V2374_MANIFEST_GATE=PASS\nSTRICT_HOP=2.37.3_TO_2.37.4\nCROSS_VERSION=NO\nSCHEMA_CHANGE=NO\nMIGRATION=NONE\nRELEASE_ID=381061019\nUPDATE_BYTES=1271825\nUPDATE_SHA256=6937373fefbdf6f1f8b7b52cf715db4f61bbdbca36c8032cd6db67ba41084c69\nOWNER_PRODUCTION_WRITE=NO\n'
