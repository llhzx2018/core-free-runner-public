name: p01-ia6-single-frontstage-proof-temporary

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-ia6-single-frontstage-proof.yml'

permissions:
  contents: read

jobs:
  source-bound-regression:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      TARGET_SHA: dcc86edc073a85cf7766e049bc6a140d70cf87f1
    steps:
      - name: Checkout public temporary harness only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Source-bound P01 isolated PHP and Node regression
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd jq >/dev/null
          ROOT="$(mktemp -d /tmp/p01-single-frontstage.XXXXXXXX)"
          trap 'rm -rf "$ROOT"' EXIT
          git clone -q --depth 1 --branch fix/p01-v247493-owner-dialog-save-ux "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "$ROOT/candidate"
          git -C "$ROOT/candidate" remote set-url origin "https://github.com/${PRODUCT_REPO}.git"
          test "$(git -C "$ROOT/candidate" rev-parse HEAD)" = "$TARGET_SHA"
          unset READ_TOKEN
          cd "$ROOT/candidate"
          test "$(tr -d '\r\n ' < VERSION)" = 2.47.493
          test "$(tr -d '\r\n ' < src/VERSION.txt)" = 2.47.493
          echo "P01_IA6_EXACT_SOURCE=$TARGET_SHA"
          for old in src/data-safety.php src/update.php src/update-credential.php             src/surface-manager.php src/all-resources.php src/workbench.php src/app/AdminShell.php; do
            test ! -e "$old"
          done
          echo P01_IA6_OLD_GUI_FILES_ABSENT=PASS
          find src -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          echo P01_IA6_PHP_LINT=PASS
          for test in             tests/unit/p01_ia6_four_fallbacks_contract.cjs             tests/unit/p01_single_frontstage_gui_retirement_gate.cjs             tests/unit/p01_ia6_legacy_route_retirement_inventory.cjs             tests/unit/p01_ia6_final_native_resource_parity.cjs             tests/unit/p01_ia6_resource_suggestions_r14_contract.cjs             tests/unit/p01_ia6_resource_bulk_r12_contract.cjs             tests/unit/p01_ia6_inbox_batch_atomic_server_contract.cjs             tests/unit/p01_owner_realuse_save_timeout_contract.cjs             tests/unit/p01_owner_no_auto_management_on_load_contract.cjs             tests/unit/p01_owner_canonical_drawer_save_state_machine.cjs; do
            node "$test"
          done
          node tests/unit/p01_ia6_legacy_route_retirement_inventory.cjs --require-fully-retired
          echo P01_IA6_FRONTSTAGE_SOURCE_GATE=PASS

          # Real localhost install and HTTP readback. No Production, external
          # credentials, or user data. The synthetic password never leaves this job.
          LOCAL="$ROOT/clean-install"
          mkdir -p "$LOCAL"
          cp -a src/. "$LOCAL/"
          ORIGIN="http://127.0.0.1:18641"
          COOKIE="$ROOT/cookie.txt"
          PASSWORD='SyntheticOneUI!18641'
          php -S 127.0.0.1:18641 -t "$LOCAL" >"$ROOT/php-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" >/dev/null 2>&1 || true; rm -rf "$ROOT"' EXIT
          for i in $(seq 1 60); do
            if curl -fsS -c "$COOKIE" -b "$COOKIE" "$ORIGIN/setup.php" -o "$ROOT/setup.html" 2>/dev/null; then break; fi
            sleep 0.25
          done
          test -s "$ROOT/setup.html"
          CSRF="$(python3 -c 'import re,sys; s=open(sys.argv[1],encoding="utf8").read(); m=re.search(r"name=\"setup_csrf\"\s+value=\"([^\"]+)\"",s); assert m,"setup csrf not found";print(m.group(1))' "$ROOT/setup.html")"
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "$ORIGIN/setup.php" \
            --data-urlencode "setup_csrf=$CSRF" \
            --data-urlencode "site_title=IA6 Synthetic Owner" \
            --data-urlencode "admin_password=$PASSWORD" \
            --data-urlencode "admin_password_confirm=$PASSWORD" \
            -o "$ROOT/installed.html"
          test -f "$LOCAL/app/.runtime.php"
          (cd "$LOCAL" && php cli/verify.php) | grep -Fx 'VERIFY_PASS=YES'
          echo P01_IA6_CLEAN_INSTALL_VERIFY=PASS
          python3 -c 'import json,sys;open(sys.argv[1],"w").write(json.dumps({"password":sys.argv[2]}))' "$ROOT/login.json" "$PASSWORD"
          curl -fsS -c "$COOKIE" -b "$COOKIE" -H 'Content-Type: application/json' \
            --data-binary "@$ROOT/login.json" "$ORIGIN/api.php?action=login" -o "$ROOT/login-response.json"
          jq -e '.ok==true' "$ROOT/login-response.json" >/dev/null
          curl -fsS -c "$COOKIE" -b "$COOKIE" "$ORIGIN/start.php" -o "$ROOT/front.html"
          for marker in data-vf-recovery-files data-vf-global-inventory-root \
            data-vf-global-bulk-root data-vf-suggestion-root data-vf-uc-root; do
            grep -Fq "$marker" "$ROOT/front.html"
          done
          echo P01_IA6_OWNER_FRONTSTAGE_READBACK=PASS
          for old in data-safety.php update.php update-credential.php \
            surface-manager.php all-resources.php workbench.php; do
            STATUS="$(curl -sS -b "$COOKIE" -o /dev/null -w '%{http_code}' "$ORIGIN/$old")"
            test "$STATUS" = 404 -o "$STATUS" = 410
            printf "%s\n" "<?php require __DIR__.'/app/bootstrap.php'; echo 'LEGACY_REACHED';" > "$LOCAL/$old"
            STATUS="$(curl -sS -b "$COOKIE" -o "$ROOT/stale-response.txt" -w '%{http_code}' "$ORIGIN/$old")"
            test "$STATUS" = 410
            if grep -Fq 'LEGACY_REACHED' "$ROOT/stale-response.txt"; then exit 91; fi
            rm -f "$LOCAL/$old"
          done
          echo P01_IA6_ATOMIC_STALE_GUI_GUARD_HTTP=PASS
          curl -fsS -c "$COOKIE" -b "$COOKIE" \
            "$ORIGIN/api.php?action=update_credential_status" -o "$ROOT/credential.json"
          jq -e '.ok==true and (.status.configured|type=="boolean") and (.status|has("token")|not)' "$ROOT/credential.json" >/dev/null
          DENIED="$(curl -sS -c "$COOKIE" -b "$COOKIE" -o "$ROOT/denied.json" -w '%{http_code}' \
            -H 'Content-Type: application/json' -H 'X-CSRF-Token: intentionally-invalid' \
            --data '{}' "$ORIGIN/api.php?action=update_credential_save")"
          test "$DENIED" = 403 -o "$DENIED" = 419
          echo P01_IA6_NATIVE_CREDENTIAL_READ_AND_CSRF_DENY=PASS
