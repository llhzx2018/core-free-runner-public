name: p01-ia6-single-frontstage-proof-temporary

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-ia6-single-frontstage-proof.yml'

permissions:
  contents: read

jobs:
  source-bound-regression:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      TARGET_SHA: dcc86edc073a85cf7766e049bc6a140d70cf87f1
    steps:
      - name: Checkout public temporary harness only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Source-bound P01 isolated PHP and Node regression
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd >/dev/null
          ROOT="$(mktemp -d /tmp/p01-single-frontstage.XXXXXXXX)"
          trap 'rm -rf "$ROOT"' EXIT
          git clone -q --no-checkout --depth 1             "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "$ROOT/candidate"
          git -C "$ROOT/candidate" remote set-url origin "https://github.com/${PRODUCT_REPO}.git"
          git -C "$ROOT/candidate" fetch -q --depth 1 origin "$TARGET_SHA"
          git -C "$ROOT/candidate" checkout -q --detach "$TARGET_SHA"
          test "$(git -C "$ROOT/candidate" rev-parse HEAD)" = "$TARGET_SHA"
          unset READ_TOKEN
          cd "$ROOT/candidate"
          test "$(tr -d '\r\n ' < VERSION)" = 2.47.493
          test "$(tr -d '\r\n ' < src/VERSION.txt)" = 2.47.493
          echo "P01_IA6_EXACT_SOURCE=$TARGET_SHA"
          for old in src/data-safety.php src/update.php src/update-credential.php             src/surface-manager.php src/all-resources.php src/workbench.php src/app/AdminShell.php; do
            test ! -e "$old"
          done
          echo P01_IA6_OLD_GUI_FILES_ABSENT=PASS
          find src -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          echo P01_IA6_PHP_LINT=PASS
          for test in             tests/unit/p01_ia6_four_fallbacks_contract.cjs             tests/unit/p01_single_frontstage_gui_retirement_gate.cjs             tests/unit/p01_ia6_legacy_route_retirement_inventory.cjs             tests/unit/p01_ia6_final_native_resource_parity.cjs             tests/unit/p01_ia6_resource_suggestions_r14_contract.cjs             tests/unit/p01_ia6_resource_bulk_r12_contract.cjs             tests/unit/p01_ia6_inbox_batch_atomic_server_contract.cjs             tests/unit/p01_owner_realuse_save_timeout_contract.cjs             tests/unit/p01_owner_no_auto_management_on_load_contract.cjs             tests/unit/p01_owner_canonical_drawer_save_state_machine.cjs; do
            node "$test"
          done
          node tests/unit/p01_ia6_legacy_route_retirement_inventory.cjs --require-fully-retired
          echo P01_IA6_FRONTSTAGE_SOURCE_GATE=PASS
