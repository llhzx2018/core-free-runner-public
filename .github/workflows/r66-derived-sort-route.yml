name: R66 Focused Derived Sort Route Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r66-derived-sort-route.yml'

permissions:
  contents: read

jobs:
  r66-focused-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ef24b447f744599210f22f82d56069c527b6e608
    steps:
      - name: Checkout exact private P01 candidate transiently
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: ef24b447f744599210f22f82d56069c527b6e608
          path: vf-start
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_sqlite,sqlite3,curl
          coverage: none

      - name: Exact source and focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd vf-start
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(cat VERSION)" = '2.47.0'
          php -l src/app/ToolWorkspaceHome.php
          php -l src/app/SoftwareWorkspaceHome.php
          php -l tests/unit/derived_sort_route_continuity_contract.php
          php tests/unit/derived_sort_route_continuity_contract.php
          php tests/unit/uxui_round4_tools_identity_contract.php
          php tests/unit/uxui_round5_software_identity_contract.php
          php tests/unit/start_favorite_sort_reset_contract.php
          echo R66_DERIVED_SORT_ROUTE_CONTINUITY_PASS
          echo R66_EXACT_CANDIDATE_GATE_PASS

      - name: Cleanup transient private source
        if: always()
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/vf-start"
