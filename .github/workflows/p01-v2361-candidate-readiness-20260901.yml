name: P01 V2.36.1 Candidate Readiness
on:
  push:
    branches: [release/p01-v2361-candidate-20260901]
    paths: [.github/workflows/p01-v2361-candidate-readiness-20260901.yml]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CANDIDATE: 411404af399fc13856d71faec1ab4a6633a73ba3
      CANDIDATE_TREE: d09ddb545c0c46cc2076ac1836c7857af31bc6e2
      CANDIDATE_RUNTIME_TREE: 91f92c5d3e7080469a7f5ab1497145454014c87a
      SOURCE: 225780b1ed56bbcc8e62ba465b1129e1c22ee60a
      SOURCE_TREE: 8af6d8ea6168fae52988cae8272a19073a0a7a2e
      SOURCE_RUNTIME_TREE: ad3f96345ead330adffb20c7ecb3cdf6537036b6
      VERSION: 2.36.1
      SOURCE_VERSION: 2.36.0
      SCHEMA: '2026082901'
      OUT: /tmp/p01-v2361-candidate-artifacts
      EVID: /tmp/p01-v2361-candidate-evidence
      UPGRADE: /tmp/p01-v2361-upgrade
      FRESH: /tmp/p01-v2361-fresh
      ROOT: ${{ github.workspace }}/candidate/src
      PORT: 18561
      ADMIN_PASS: P01V2361SingleSystem2026
    steps:
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - name: Checkout release runner
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: release/p01-v2361-candidate-20260901
          path: runner
      - name: Checkout proven V2.36.0 candidate template
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 0fe72c7981f5f2b6ddd51bf4cfa5d6c014c9b0d3
          path: template
      - name: Checkout proven single-system auth gate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 1d671366f6cca1762d9258b586000309314edf38
          path: auth
      - name: Checkout exact V2.36.1 candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.CANDIDATE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: candidate
      - name: Checkout immutable V2.36.0 predecessor
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.36.0
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: production
      - name: Checkout proven Atomic builder
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: agent/p01-22121-formal-artifact-gate-20260819
          path: proven
      - name: Generate fenced V2.36.1 gates
        shell: bash
        run: python3 runner/scripts/p01_v2361_candidate_readiness_generate.py
      - name: Exact source runtime authority fence
        shell: bash
        run: bash /tmp/p01-v2361-generated/01-exact.sh
      - name: Build deterministic candidate artifacts
        shell: bash
        run: bash /tmp/p01-v2361-generated/02-build.sh
      - name: Actual V2.36.0 to V2.36.1 Atomic upgrade
        shell: bash
        run: bash /tmp/p01-v2361-generated/03-atomic.sh
      - name: Strict fresh candidate runtime
        shell: bash
        run: bash /tmp/p01-v2361-generated/04-fresh.sh
      - name: Fresh auth runtime and seed
        shell: bash
        run: bash /tmp/p01-v2361-generated/05-auth-seed.sh
      - name: Chromium single-system auth contract
        shell: bash
        run: bash /tmp/p01-v2361-generated/06-auth-browser.sh
      - name: Final SQLite and release boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$ROOT" EVID="$EVID" php <<'PHP'
          <?php
          require getenv('ROOT').'/app/bootstrap.php';
          $db=vf_db();
          if(strtolower((string)$db->query('PRAGMA integrity_check')->fetchColumn())!=='ok') exit(1);
          if($db->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC)) exit(2);
          file_put_contents(getenv('EVID').'/final-db.txt',"INTEGRITY=ok\nFK=0\n");
          echo "P01_V2361_SQLITE=PASS\n";
          PHP
          printf 'P01_V2361_CANDIDATE_READINESS=PASS\nSOURCE=%s\nTREE=%s\nRUNTIME_TREE=%s\nSCHEMA=%s\nSINGLE_SYSTEM_AUTH=PASS\nOWNER_PRODUCTION_WRITE=NO\n' "$CANDIDATE" "$CANDIDATE_TREE" "$CANDIDATE_RUNTIME_TREE" "$SCHEMA" | tee "$EVID/verdict.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-v2361-candidate-readiness-${{ github.run_id }}
          path: |
            /tmp/p01-v2361-candidate-evidence
            /tmp/p01-v2361-candidate-artifacts
          if-no-files-found: error
          retention-days: 90
      - name: Stop servers
        if: always()
        shell: bash
        run: |
          kill "$(cat /tmp/p01-v2361-upgrade.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat /tmp/p01-v2361-fresh.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat /tmp/p01-v2361-auth.pid 2>/dev/null)" 2>/dev/null || true
