name: TEMP S01-C02 Ops 1.21.844 Production Fresh Read
on:
  push:
    branches:
      - temp/s01-c02-v121844-record-isolation-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121844-production-fresh-read.yml'
jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Fresh read Production
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-domain-authority' -o /tmp/domain.json
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-static-candidate-readiness' -o /tmp/static.json
          echo '=== DOMAIN ==='
          jq '{pluginVersion,status,authorityFinalHost,configuredPublicBaseUrl,authorityMatch}' /tmp/domain.json
          echo '=== STATIC CORE ==='
          jq '{pluginVersion,sourceArtifactAvailable,manualSourceUploadRequired,activeStaticJobStatus,activeStaticJobMode,activeStaticJobFirstFailedStep,activeStaticJobAuditFailureCount,activeStaticJobInternalLinkFailureLeafCount,activeStaticJobInternalLinkFailureUniqueTargetCount,candidatePackageReady,finalOnlinePass}' /tmp/static.json
          echo '=== V844 RECORD ISOLATION ==='
          jq '{sourceRecoveryRecordIsolationStatus,sourceRecoveryRecordIsolationCode,sourceRecoveryRecordIsolationCandidateStatus,sourceRecoveryRecordIsolationCandidateCurrentStage,sourceRecoveryRecordIsolationCandidateAuditFailureCount,sourceRecoveryRecordIsolationCandidateBuildOffset,sourceRecoveryRecordIsolationCandidateBuildTotal,sourceRecoveryRecordIsolationCandidateHelperPhase,sourceRecoveryRecordIsolationCandidateHelpersWritten,sourceRecoveryRecordIsolationCandidateCompletenessStatus}' /tmp/static.json
          echo '=== RELATED RECOVERY ==='
          jq '{sourceRecoveryDurableKickStatus,sourceRecoveryDurableKickCode,sourceRecoveryRootItemStatus,sourceRecoveryRootItemCode,sourceRecoveryRootItemCandidateStatus,sourceRecoveryRootItemCandidateCurrentStage,sourceRecoveryRootItemCandidateAuditFailureCount,sourceRecoveryCanonicalFinalAuditRetryStatus,sourceRecoveryCanonicalFinalAuditRetryCode,sourceRecoveryCanonicalFinalAuditRetryEligibleCount,sourceRecoveryFinalAuditPackageContractLeafCount,sourceRecoveryFinalAuditPackageContractUnclassifiedCount,sourceRecoveryFinalAuditPackageContractPrimaryClass}' /tmp/static.json
          jq -e '.pluginVersion=="1.21.844"' /tmp/domain.json >/dev/null
          jq -e '.pluginVersion=="1.21.844"' /tmp/static.json >/dev/null
          echo PRODUCTION_V121844_VERSION=PASS
