name: TEMP P01 V2.47.279 Distribution Discovery Proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p01-v247279-distribution-discovery.yml'

permissions:
  contents: read

jobs:
  discovery:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'proof(P01): V2.47.279 distribution discovery')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      EXPECTED_SOURCE: 2.47.278
      EXPECTED_TARGET: 2.47.279
      EXPECTED_RELEASE_ID: '406309336'
      EXPECTED_PRODUCT_IDENTITY: ffbb50140f935fdf59a5bbed1b6e72257470ccd0
      EXPECTED_ASSET: VF_Start_V2.47.279_UPDATE.zip
      EXPECTED_ASSET_BYTES: '2360327'
      EXPECTED_ASSET_SHA256: 9c9f6e1c4cf613b52d4cbf21b809ae5a56ad48679813e18ffc7879cb22ae8a99
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare runtime
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-curl jq >/dev/null
      - name: Installed-source discovery
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone -q --depth 1 --branch "v$EXPECTED_SOURCE" "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" source
          READ_TOKEN="$READ_TOKEN" php -r '
            require "source/src/app/CoreUpdates/UpdateCore.php";
            require "source/src/app/CoreUpdates/GitHubClient.php";
            $client=new \CoreUpdates\GitHubClient((string)getenv("READ_TOKEN"),"p01-v247279-discovery-proof");
            $m=$client->fetchProjectManifest("llhzx2018/core-updates","P01.json","main");
            $core=new \CoreUpdates\UpdateCore("P01","APP");
            $result=$core->check("2.47.278","2026090401",$m);
            if(($result["status"]??"")!=="AVAILABLE"||($result["target_version"]??"")!=="2.47.279") exit(12);
            if(($m["release_id"]??0)!==406309336||($m["product_identity"]??"")!=="ffbb50140f935fdf59a5bbed1b6e72257470ccd0") exit(13);
            if(($m["asset_sha256"]??"")!=="9c9f6e1c4cf613b52d4cbf21b809ae5a56ad48679813e18ffc7879cb22ae8a99") exit(14);
            foreach(["积压推进过慢","正在补跑和待处理数量"] as $must) if(strpos((string)($m["notes"]??""),$must)===false) exit(15);
            echo "P01_UPDATER_DISCOVERY=PASS\nP01_UPDATER_STATUS=AVAILABLE\nP01_UPDATER_TARGET=2.47.279\n";
          '
      - name: Remote release readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$PRODUCT_REPO/releases/tags/v$EXPECTED_TARGET" >/tmp/release.json
          jq -e --argjson id "$EXPECTED_RELEASE_ID" --arg tag "v$EXPECTED_TARGET" '.id==$id and .tag_name==$tag and .draft==false and .prerelease==false' /tmp/release.json >/dev/null
          test "$(gh api "repos/$PRODUCT_REPO/git/ref/tags/v$EXPECTED_TARGET" --jq '.object.sha')" = "$EXPECTED_PRODUCT_IDENTITY"
          jq -e --arg n "$EXPECTED_ASSET" --argjson s "$EXPECTED_ASSET_BYTES" --arg d "sha256:$EXPECTED_ASSET_SHA256" '.assets[]|select(.name==$n)|(.size==$s and .digest==$d)' /tmp/release.json >/dev/null
          echo P01_RELEASE_IDENTITY_READBACK=PASS
          echo PRODUCTION_WRITE=NO
          echo P01_V247279_DISTRIBUTION_DISCOVERY=PASS
