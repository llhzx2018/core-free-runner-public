name: P02 V2.5.32 Release Closure
on:
  push:
    branches:
      - run/p02-v2532-release
  workflow_dispatch:
permissions:
  contents: read
jobs:
  closure:
    runs-on: ubuntu-24.04
    env:
      SEALED_SHA: 978548735263e10ab5e084fa0d8e67a600a5cad3
      SEALED_TREE: 8a04d5e481520e6a21900c29997e7430ae3150d8
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Checkout sealed release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 978548735263e10ab5e084fa0d8e67a600a5cad3
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          path: product
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare exact published-state Authority reader
        run: |
          cat > /tmp/p02_closure_authority.py <<'PY'
          import argparse,base64,json,os,urllib.request
          ap=argparse.ArgumentParser();ap.add_argument('--dev',required=True);ap.add_argument('--main',required=True);ap.add_argument('--state',required=True);a=ap.parse_args();token=os.environ['VF_RELEASE_WRITE_TOKEN'];H={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def get(u):
              with urllib.request.urlopen(urllib.request.Request(u,headers=H)) as x:return json.load(x)
          def content(repo,path,ref):
              x=get(f'https://api.github.com/repos/{repo}/contents/{path}?ref={ref}');return base64.b64decode(x['content']).decode(),x['sha']
          dev=get('https://api.github.com/repos/llhzx2018/vf-library/branches/develop')['commit']['sha'];main=get('https://api.github.com/repos/llhzx2018/vf-library/branches/main')['commit']['sha'];version,_=content('llhzx2018/vf-library','VERSION','develop');sm,_=content('llhzx2018/vf-library','SOURCE_MANIFEST.json','develop');sm=json.loads(sm);smt,_=content('llhzx2018/vf-library','SOURCE_MANIFEST.txt','develop');cand,_=content('llhzx2018/vf-library','docs/authority/P02_DEVELOP_CANDIDATE_IDENTITY.json','develop');cand=json.loads(cand);idx,_=content('llhzx2018/vf-library','public/index.php','develop');runner=get('https://api.github.com/repos/llhzx2018/core-free-runner-public/branches/main')['commit'];updates=get('https://api.github.com/repos/llhzx2018/core-updates/branches/main')['commit']['sha'];p02,_=content('llhzx2018/core-updates','projects/P02.json','main');p02=json.loads(p02);tag=get('https://api.github.com/repos/llhzx2018/vf-library/git/ref/tags/v2.5.32');rel=get('https://api.github.com/repos/llhzx2018/vf-library/releases/tags/v2.5.32')
          assert dev==a.dev and main==a.main,(dev,main,a.dev,a.main);assert version.strip()=='2.5.32';assert sm['version']=='2.5.32' and sm['schema']==2401 and sm['runtime_source_file_count']==67;assert 'RUNTIME_SOURCE_FILES  67' in smt;assert cand['candidate_version']=='2.5.32' and cand['candidate_state']==a.state;assert '/assets/favicon-settings.js' in idx and '/assets/scratch-tabs.js' in idx;assert runner['sha']=='e569c491506e2a367d01a18cfa89a234a22abb79' and runner['commit']['tree']['sha']=='9d4f71422cbdaf58b615087dd2685f52a57e8dee';assert p02['current_version']=='2.5.31' and p02['target_version']=='2.5.32' and p02['release_tag']=='v2.5.32' and p02['release_id']==rel['id'];assert rel['id']==380213819 and rel['tag_name']=='v2.5.32' and len(rel['assets'])==8;assert tag['ref']=='refs/tags/v2.5.32'
          print(json.dumps({'develop':dev,'main':main,'version':'2.5.32','runtime_sources':67,'runner_main':runner['sha'],'core_updates_main':updates,'p02_target':p02['target_version'],'release_id':rel['id'],'assets':len(rel['assets']),'state':cand['candidate_state']},indent=2));print('P02_RELEASE_CLOSURE_AUTHORITY_10_OF_10=PASS')
          PY

      - name: Live-read published Authority before local closure
        run: python3 /tmp/p02_closure_authority.py --dev "$SEALED_SHA" --main "$SEALED_SHA" --state PRODUCT_OPTIMIZATION_CONVERGED_AWAITING_OWNER_EXPERIENCE

      - name: Build governance-only closure and run all contracts
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SEALED_SHA"
          test "$(git show -s --format=%T HEAD)" = "$SEALED_TREE"
          python3 - <<'PY'
          from pathlib import Path
          import json,os,urllib.request
          token=os.environ['VF_RELEASE_WRITE_TOKEN'];H={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def get(u):
              with urllib.request.urlopen(urllib.request.Request(u,headers=H)) as x:return json.load(x)
          rel=get('https://api.github.com/repos/llhzx2018/vf-library/releases/tags/v2.5.32');p02=get('https://api.github.com/repos/llhzx2018/core-updates/contents/projects/P02.json?ref=main');import base64;p02=json.loads(base64.b64decode(p02['content']).decode());assets={a['name']:a for a in rel['assets']};upd=assets['VF_Library_V2.5.32_UPDATE.zip'];assert upd['size']==p02['asset_bytes'];assert upd.get('digest') in (None,'sha256:'+p02['asset_sha256'])
          cp=Path('docs/authority/P02_DEVELOP_CANDIDATE_IDENTITY.json');c=json.loads(cp.read_text());c['candidate_state']='FORMAL_RELEASE_PUBLISHED_AWAITING_OWNER_POST_RELEASE_TEST';c['formal_main_version']='2.5.32';c['formal_main_tag']='v2.5.32';c['owner_test_requested']=True;c['owner_test_policy']='POST_RELEASE_OWNER_REAL_USE';c['next_gate']='OWNER_POST_RELEASE_REAL_USE_TEST';c['release_prep_allowed']=False;c['formal_release_created']=True;c['update_channel_change_allowed']=False;c['production_write']=False;c['release']={'tag':'v2.5.32','release_id':rel['id'],'published_at':rel['published_at'],'source_commit':os.environ['SEALED_SHA'],'source_tree':os.environ['SEALED_TREE'],'product_identity':p02['product_identity'],'update_asset':{'path':p02['asset_name'],'bytes':p02['asset_bytes'],'sha256':p02['asset_sha256']},'update_channel':'PUBLISHED','owner_post_release_test':'PENDING'};c['final_acceptance']['release_boundary']='FORMAL_RELEASE_PUBLISHED_AWAITING_OWNER_POST_RELEASE_TEST';cp.write_text(json.dumps(c,ensure_ascii=False,indent=2)+'\n')
          reps={
          'tests/unit/p02_candidate_version_identity_contract.mjs':[("if(candidate.release_prep_allowed!==false||candidate.formal_release_created!==false||candidate.update_channel_change_allowed!==false||candidate.production_write!==false)throw new Error('release boundary must remain closed');if(candidate.candidate_state!=='PRODUCT_OPTIMIZATION_CONVERGED_AWAITING_OWNER_EXPERIENCE'||candidate.owner_test_requested!==true||candidate.owner_test_policy!=='FINAL_OWNER_EXPERIENCE_AFTER_PRODUCT_CONVERGENCE'||candidate.next_gate!=='OWNER_FINAL_EXPERIENCE_TEST')throw new Error('converged owner experience gate mismatch');","if(candidate.release_prep_allowed!==false||candidate.formal_release_created!==true||candidate.update_channel_change_allowed!==false||candidate.production_write!==false)throw new Error('post-release boundary mismatch');if(candidate.candidate_state!=='FORMAL_RELEASE_PUBLISHED_AWAITING_OWNER_POST_RELEASE_TEST'||candidate.owner_test_requested!==true||candidate.owner_test_policy!=='POST_RELEASE_OWNER_REAL_USE'||candidate.next_gate!=='OWNER_POST_RELEASE_REAL_USE_TEST')throw new Error('post-release owner experience gate mismatch');")],
          'tests/unit/p02_formal_release_prep_contract.mjs':[("assert.equal(candidate.formal_release_created,false);","assert.equal(candidate.formal_release_created,true);")],
          'tests/unit/p02_owner_preview_handoff_contract.mjs':[("assert.equal(candidate.next_gate,'OWNER_FINAL_EXPERIENCE_TEST');","assert.equal(candidate.next_gate,'OWNER_POST_RELEASE_REAL_USE_TEST');")],
          'tests/unit/p02_release_readiness_owner_preview_contract.mjs':[("assert.equal(candidate.owner_test_policy,'FINAL_OWNER_EXPERIENCE_AFTER_PRODUCT_CONVERGENCE');assert.equal(candidate.release_prep_allowed,false);","assert.equal(candidate.owner_test_policy,'POST_RELEASE_OWNER_REAL_USE');assert.equal(candidate.release_prep_allowed,false);assert.equal(candidate.formal_release_created,true);")],
          'tests/unit/p02_v2532_product_convergence_seal_contract.mjs':[("assert.equal(c.candidate_state,'PRODUCT_OPTIMIZATION_CONVERGED_AWAITING_OWNER_EXPERIENCE');","assert.equal(c.candidate_state,'FORMAL_RELEASE_PUBLISHED_AWAITING_OWNER_POST_RELEASE_TEST');"),("assert.equal(c.owner_test_policy,'FINAL_OWNER_EXPERIENCE_AFTER_PRODUCT_CONVERGENCE');","assert.equal(c.owner_test_policy,'POST_RELEASE_OWNER_REAL_USE');"),("assert.equal(c.next_gate,'OWNER_FINAL_EXPERIENCE_TEST');","assert.equal(c.next_gate,'OWNER_POST_RELEASE_REAL_USE_TEST');"),("assert.equal(c.release_prep_allowed,false);assert.equal(c.formal_release_created,false);assert.equal(c.update_channel_change_allowed,false);assert.equal(c.production_write,false);","assert.equal(c.release_prep_allowed,false);assert.equal(c.formal_release_created,true);assert.equal(c.update_channel_change_allowed,false);assert.equal(c.production_write,false);")]
          }
          for name,pairs in reps.items():
              q=Path(name);s=q.read_text()
              for old,new in pairs:assert s.count(old)==1,(name,old);s=s.replace(old,new)
              q.write_text(s)
          Path('docs/evidence/P02_V2532_FORMAL_RELEASE_20260831.md').write_text(f'''# P02 · VF Library V2.5.32 Formal Release\n\nStatus: `PUBLISHED / AWAITING_OWNER_POST_RELEASE_REAL_USE`\n\n- Formal tag: `v2.5.32`\n- Release ID: `{rel['id']}`\n- Release source commit: `{os.environ['SEALED_SHA']}`\n- Release source tree: `{os.environ['SEALED_TREE']}`\n- Update channel: `2.5.31 → 2.5.32`\n- Update asset: `{p02['asset_name']}`\n- Update SHA256: `{p02['asset_sha256']}`\n- Product identity: `{p02['product_identity']}`\n- OWNER authorization: explicit publish-then-test.\n- OWNER post-release real-use: `PENDING`.\n- Production runtime write by publication workflow: `NO`.\n''')
          Path('tests/unit/p02_v2532_formal_release_contract.mjs').write_text("""import assert from 'node:assert/strict';\nimport fs from 'node:fs';\nconst c=JSON.parse(fs.readFileSync('docs/authority/P02_DEVELOP_CANDIDATE_IDENTITY.json','utf8'));const e=fs.readFileSync('docs/evidence/P02_V2532_FORMAL_RELEASE_20260831.md','utf8');assert.equal(c.candidate_state,'FORMAL_RELEASE_PUBLISHED_AWAITING_OWNER_POST_RELEASE_TEST');assert.equal(c.formal_main_version,'2.5.32');assert.equal(c.formal_main_tag,'v2.5.32');assert.equal(c.formal_release_created,true);assert.equal(c.release.tag,'v2.5.32');assert.equal(c.release.release_id,380213819);assert.equal(c.release.update_channel,'PUBLISHED');assert.equal(c.release.owner_post_release_test,'PENDING');assert.equal(c.production_write,false);assert.match(e,/PUBLISHED \/ AWAITING_OWNER_POST_RELEASE_REAL_USE/);console.log('P02_V2532_FORMAL_RELEASE_CONTRACT=PASS');\n""")
          PY
          git diff --exit-code "$SEALED_SHA" -- public src VERSION SOURCE_MANIFEST.json SOURCE_MANIFEST.txt
          python3 scripts/verify-source-manifest.py
          bash scripts/verify-repository.sh
          for t in tests/unit/*.mjs; do echo "UNIT $t";node "$t";done
          git config user.name VictorForge;git config user.email llhzx2018@gmail.com
          git add docs/authority/P02_DEVELOP_CANDIDATE_IDENTITY.json docs/evidence/P02_V2532_FORMAL_RELEASE_20260831.md tests/unit/p02_candidate_version_identity_contract.mjs tests/unit/p02_formal_release_prep_contract.mjs tests/unit/p02_owner_preview_handoff_contract.mjs tests/unit/p02_release_readiness_owner_preview_contract.mjs tests/unit/p02_v2532_product_convergence_seal_contract.mjs tests/unit/p02_v2532_formal_release_contract.mjs
          git commit -m "governance(P02): record V2.5.32 formal release"
          echo "CLOSURE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "CLOSURE_TREE=$(git show -s --format=%T HEAD)" >> "$GITHUB_ENV"
          echo P02_V2532_RELEASE_CLOSURE_LOCAL=PASS

      - name: Live-read before develop closure write
        run: python3 /tmp/p02_closure_authority.py --dev "$SEALED_SHA" --main "$SEALED_SHA" --state PRODUCT_OPTIMIZATION_CONVERGED_AWAITING_OWNER_EXPERIENCE

      - name: Publish closure to develop
        working-directory: product
        run: |
          set -Eeuo pipefail
          git config --global url."https://x-access-token:${VF_RELEASE_WRITE_TOKEN}@github.com/".insteadOf "https://github.com/"
          git push origin "$CLOSURE_SHA:refs/heads/develop"
          test "$(git ls-remote origin refs/heads/develop | awk '{print $1}')" = "$CLOSURE_SHA"
          echo P02_V2532_CLOSURE_DEVELOP=PASS

      - name: Live-read before main closure write
        run: python3 /tmp/p02_closure_authority.py --dev "$CLOSURE_SHA" --main "$SEALED_SHA" --state FORMAL_RELEASE_PUBLISHED_AWAITING_OWNER_POST_RELEASE_TEST

      - name: Publish closure to main
        working-directory: product
        run: |
          set -Eeuo pipefail
          git push origin "$CLOSURE_SHA:refs/heads/main"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$CLOSURE_SHA"
          echo P02_V2532_CLOSURE_MAIN=PASS

      - name: Final release Authority readback
        run: |
          python3 /tmp/p02_closure_authority.py --dev "$CLOSURE_SHA" --main "$CLOSURE_SHA" --state FORMAL_RELEASE_PUBLISHED_AWAITING_OWNER_POST_RELEASE_TEST
          echo P02_V2532_FORMAL_RELEASE_CLOSED=PASS
          echo P02_V2532_PRODUCTION_RUNTIME_WRITE=NO
