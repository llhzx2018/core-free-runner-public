name: TEMP S01-C02 Ops 1.21.846 Root Helper Source Trace
on:
  push:
    paths:
      - '.github/workflows/temp-s01-c02-v121846-root-helper-source-trace.yml'
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    env:
      PRODUCT_COMMIT: b6745c09ecaa7a27deed3c970f683d86425fcc35
      RUNNER_MAIN: 0160b557ad4ae0e8c6acd97e7551285bc05870bd
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.PRODUCT_COMMIT }}
          persist-credentials: false
          path: ops
      - name: Locate exact root-helper dependency definitions
        shell: bash
        run: |
          set -Eeuo pipefail
          cd ops
          for sym in \
            vf_ops_ads_candidate_root_files_v1 \
            vf_toolsite_cf_release_candidate_actions_bump \
            vf_toolsite_cf_release_candidate_actions_plain_text \
            vf_toolsite_cf_release_candidate_actions_json \
            vf_toolsite_cf_release_report_template_json \
            vf_toolsite_cf_release_headers_template_text \
            vf_toolsite_cf_release_redirects_template_text \
            vf_toolsite_cf_release_health_template_json \
            vf_toolsite_cf_release_version_file_text; do
            echo "=== SYMBOL:$sym ==="
            git grep -n -C 8 "$sym" -- '*.php' || true
          done
          echo '=== PREPARE_ROOT_HELPERS ==='
          git grep -n -C 35 'function prepare_root_helpers\|public static function prepare_root_helpers' -- '*.php' || true
          echo '=== RECENT ROOT HELPER HISTORY ==='
          git log --oneline -12 -- includes/release/builders/class-candidate-helper-writer.php includes/release/builders/class-candidate-batch-builder.php
      - name: Verify runner main unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git ls-remote https://github.com/llhzx2018/core-free-runner-public.git refs/heads/main | awk '{print $1}')" = "$RUNNER_MAIN"
          echo PASS_V121846_ROOT_HELPER_SOURCE_TRACE
