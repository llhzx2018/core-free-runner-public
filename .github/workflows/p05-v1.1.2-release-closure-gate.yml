name: P05 V1.1.2 Release Closure Gate

on:
  push:
    branches:
      - release/p05-v1.1.2-orchestrator-20260830
    paths:
      - '.github/workflows/p05-v1.1.2-release-closure-gate.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOSURE_SHA: 95b7c59d8766246566fe1e62b4a8bb66c00c906b
      RELEASE_SOURCE: 37c2f50b178c18feed26cbb82a6abc5bb9fc576b
      RELEASE_TREE: 644136d1c486d67f1b3f4bde87b0e4e4b7cee9f4
      RELEASE_ID: '379237052'
      FULL_ASSET_ID: '536415428'
      FULL_SHA256: 34c9a88e01197eb6f4ee8943c33d38f832246e72e965e574c9766dbf5ace15fa
      CORE_UPDATES_MAIN: 377549c35aef8f78a76a9b6bec09376aff6ce4e9
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Checkout exact closure source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: 95b7c59d8766246566fe1e62b4a8bb66c00c906b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0

      - name: Closure scope and authority gate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CLOSURE_SHA"
          git diff --name-only "$RELEASE_SOURCE"..HEAD | sort > /tmp/actual
          cat > /tmp/expected <<'EOF'
          CHANGELOG.md
          README.md
          VF_PROJECT.json
          docs/README.md
          docs/authority/BROWSER_FIRST_INSTALL_MAIN_CURRENT.md
          docs/authority/RELEASE_V1.1.2_CURRENT.md
          EOF
          diff -u /tmp/expected /tmp/actual
          test "$(cat VERSION)" = '1.1.2'
          test "$(jq -r .formal_release VF_PROJECT.json)" = 'v1.1.2'
          test "$(jq -r .formal_release_state VF_PROJECT.json)" = 'RELEASED_CURRENT'
          test "$(jq -r .formal_release_source VF_PROJECT.json)" = "$RELEASE_SOURCE"
          test "$(jq -r .formal_release_tree VF_PROJECT.json)" = "$RELEASE_TREE"
          test "$(jq -r .formal_release_id VF_PROJECT.json)" = "$RELEASE_ID"
          test "$(jq -r .formal_release_asset_id VF_PROJECT.json)" = "$FULL_ASSET_ID"
          test "$(jq -r .formal_release_asset_sha256 VF_PROJECT.json)" = "$FULL_SHA256"
          test "$(jq -r .production_deployment VF_PROJECT.json)" = 'NOT_DEPLOYED'
          test "$(jq -r .production_write VF_PROJECT.json)" = '0'
          grep -F 'Current Formal Release: v1.1.2 · Browser-first Zero-SSH Install' README.md
          grep -F 'P05 V1.1.2 RELEASE = PASS / CLOSED' docs/authority/RELEASE_V1.1.2_CURRENT.md
          R="$(gh api repos/llhzx2018/vf-seo/releases/tags/v1.1.2)"
          test "$(printf '%s' "$R" | jq -r .id)" = "$RELEASE_ID"
          test "$(printf '%s' "$R" | jq -r .target_commitish)" = "$RELEASE_SOURCE"
          A="$(printf '%s' "$R" | jq -c --arg n 'VF_SEO_V1.1.2_FULL.zip' '.assets[]|select(.name==$n)')"
          test "$(printf '%s' "$A" | jq -r .id)" = "$FULL_ASSET_ID"
          test "$(printf '%s' "$A" | jq -r .digest)" = "sha256:$FULL_SHA256"
          C="$(gh api repos/llhzx2018/core-updates/branches/main --jq '.commit.sha')"
          test "$C" = "$CORE_UPDATES_MAIN"
          echo P05_V112_RELEASE_CLOSURE_MACHINE=PASS
          echo RELEASE_WRITE=0
          echo PRODUCTION_WRITE=0
