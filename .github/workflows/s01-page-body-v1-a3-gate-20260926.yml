name: S01 Page Body V1 A3 Candidate Gate

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/s01-page-body-v1-a3-gate-20260926.yml'

permissions:
  contents: read

jobs:
  gate:
    if: github.head_ref == 'task/s01-page-body-v1-a3-gate-20260926'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      OPS_SHA: c7fba954cba55f37f1d98c861eb7455e1d6f8747
      M3U8_SHA: be47ff3625411632399b63e6d6617b967bcbd612
    steps:
      - name: Credential presence
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: test -n "$READ_TOKEN"

      - name: Checkout exact OPS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.OPS_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: ops

      - name: Checkout exact M3U8
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: ${{ env.M3U8_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: m3u8

      - name: OPS A1 + A2 + A3 contracts
        working-directory: ops
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$OPS_SHA"
          php -l includes/views/admin-content-tabs/content-management.php
          php -l includes/admin-v13/views/seo_keywords.php
          php -l includes/admin-v13/views/seo_links_redirects.php
          php -l includes/views/admin-style-helpers/admin-s01-uiux-polish.php
          php -l tests/s01-c02-page-body-system-v1-a3-contract.php
          php tests/s01-c02-page-body-system-v1-a1-baseline-contract.php
          php tests/s01-c02-page-body-system-v1-a2-baseline-contract.php
          php tests/s01-c02-page-body-system-v1-a3-contract.php
          grep -Fq "['content_articles','seo_keywords','seo_links_redirects']" includes/views/admin-style-helpers/admin-s01-uiux-polish.php
          grep -Fq 'data-vf-page-archetype="a3"' includes/admin-v13/views/seo_keywords.php
          grep -Fq 'data-vf-page-archetype="a3"' includes/admin-v13/views/seo_links_redirects.php
          ! grep -Eq '\.vf-v6-shell-header|\.vf-v6-domain-nav|\.vf-ops-s01-shell|\.vf-v6-domain-menu' assets/css/current/admin-s01-page-body-system-v1.css

      - name: M3U8 A1 + A2 + A3 contracts
        working-directory: m3u8
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$M3U8_SHA"
          php -l src/admin/Controller/class-v6-provider-contracts-controller.php
          php -l src/admin/Controller/class-v6-provider-fixtures-controller.php
          php -l tests/s01-c03-page-body-system-v1-a3-contract.php
          php tests/s01-c03-page-body-system-v1-a1-contract.php
          php tests/s01-c03-page-body-system-v1-a2-contract.php
          php tests/s01-c03-page-body-system-v1-a3-contract.php
          php tests/s01-c03-page-visual-closure-r5-contract.php
          grep -Fq 'data-vf-entity-kind="capability"' src/admin/Controller/class-v6-provider-contracts-controller.php
          grep -Fq 'data-vf-entity-kind="pipeline"' src/admin/Controller/class-v6-provider-contracts-controller.php
          grep -Fq 'data-vf-entity-kind="fixture"' src/admin/Controller/class-v6-provider-fixtures-controller.php
          test "$(grep -o 'data-vf-page-archetype="a3"' src/admin/Controller/class-v6-provider-contracts-controller.php | wc -l)" = "2"
          test "$(grep -o 'data-vf-page-archetype="a3"' src/admin/Controller/class-v6-provider-fixtures-controller.php | wc -l)" = "1"
          ! grep -Fq '.vf-m3u8-a3-workspace' src/admin/ui-v4/admin-s01-page-body-system-v1.css
          ! grep -Fq '.vf-m3u8-a3-editor' src/admin/ui-v4/admin-s01-page-body-system-v1.css
          ! grep -Eq '\.vf-v6-shell-header|\.vf-v6-domain-nav|\.vf-v6-domain-menu|\.vf-m3u8-console-head|\.vf-m3u8-primary-nav' src/admin/ui-v4/admin-s01-page-body-system-v1.css

      - name: CSS balance
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for path in [
              Path('ops/assets/css/current/admin-s01-page-body-system-v1.css'),
              Path('m3u8/src/admin/ui-v4/admin-s01-page-body-system-v1.css'),
          ]:
              c=path.read_text()
              assert c.count('{')==c.count('}'), path
          print('PASS_CSS_BALANCE')
          PY
