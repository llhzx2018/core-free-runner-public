name: S01-C02 1078 Publish P0 P1 Verdict Gate
on:
  push:
    branches: [test/s01-c02-1211078-publish-severity-20261009]
jobs:
  isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      db:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: fixture-root
          MARIADB_DATABASE: ops_1078
          MARIADB_USER: vf
          MARIADB_PASSWORD: fixture-pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - name: Exact Ops 1078 checkout
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 5934db6ba92e91a2486a18302709b01d1f747dee
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: PHP and WordPress runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, pdo_mysql, zip, curl, mbstring
          coverage: none
      - name: Headless Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate source and PHP syntax
        run: |
          test "$(cat VERSION)" = "1.21.1078"
          php -l includes/admin-v13/views/publish_zip_v6.php
          php -l tests/s01-c02-1211078-publish-severity-fixture.php
          node --check tests/s01-c02-1211078-publish-severity-browser.js
          node --check assets/js/admin-publish-zip.js
      - name: Actual PHP UI with P1 FAIL P0 FAIL summary mismatch and stale ZIP
        run: node tests/s01-c02-1211078-publish-severity-browser.js
      - name: Preserve old preflight and ZIP operator UI
        run: |
          node tests/s01-c02-1211073-publish-preflight-browser.js
          node tests/s01-c02-1211067-zip-input-browser-e2e.js
          node tests/s01-c02-1211066-publish-zip-operator-resume-browser.js
      - name: Isolated real WordPress Publish CSS queue and system isolation
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/wp1078"; mkdir -p "$ROOT"; WP="$ROOT/site"; mkdir -p "$WP"
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o "$ROOT/wp"
          wpqa(){ php "$ROOT/wp" --path="$WP" "$@"; }
          wpqa core download --version=7.0.2 --force
          wpqa config create --dbname=ops_1078 --dbuser=vf --dbpass=fixture-pass --dbhost=127.0.0.1 --skip-check
          wpqa core install --url=https://fixture.invalid --title=Isolated --admin_user=admin --admin_password=fixture-admin --admin_email=qa@example.invalid --skip-email
          mkdir -p "$WP/wp-content/plugins/vf-ops"
          rsync -a --exclude='.git' --exclude='node_modules' ./ "$WP/wp-content/plugins/vf-ops/"
          wpqa plugin activate vf-ops
          wpqa eval-file "$WP/wp-content/plugins/vf-ops/tests/s01-c02-1211075-publish-asset-wordpress.php" publish
          wpqa eval-file "$WP/wp-content/plugins/vf-ops/tests/s01-c02-1211075-publish-asset-wordpress.php" system
      - name: Deterministic exact candidate ZIP
        run: |
          mkdir -p /tmp/s01-c02-1078
          python3 .github/release/build-ops-package.py --output /tmp/s01-c02-1078/vf-tools-ops_V1.21.1078.zip > /tmp/s01-c02-1078/manifest.json
          unzip -tq /tmp/s01-c02-1078/vf-tools-ops_V1.21.1078.zip
          cat /tmp/s01-c02-1078/manifest.json
      - name: Seal exact tested ZIP candidate
        uses: actions/upload-artifact@v4
        with:
          name: s01-c02-v1.21.1078-publish-verdict-candidate
          path: /tmp/s01-c02-1078/
          retention-days: 30
