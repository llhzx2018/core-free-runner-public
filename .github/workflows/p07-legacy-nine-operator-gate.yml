name: P07 release113 owner-authorized nine-site operator synthetic gate
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-legacy-nine-operator-gate.yml'
      - 'experiments/p07-release113-legacy-nine-stage.py'
      - 'experiments/p07-legacy-nine-operator-tests.py'
      - 'experiments/p07-14-site-private-assets-guarded-install.py'
      - 'experiments/p07-14-site-private-assets-guarded-install-tests.py'
      - 'experiments/p07-17-site-staged-local-evidence.py'
      - 'experiments/p07-17-site-staged-local-evidence-tests.py'
      - 'experiments/p07-14-site-local-http-fpm-smoke.py'
      - 'experiments/p07-14-site-local-http-fpm-smoke-tests.py'
      - 'experiments/p07-three-pending-db-recovery-evidence.py'
      - 'experiments/p07-three-pending-db-recovery-evidence-tests.py'
      - 'experiments/p07-www3-restored-readback.py'
      - 'experiments/p07-www3-restored-readback-tests.py'
      - 'experiments/p07-www3-isolated-restore.py'
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Pin exact public-safe operator source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git hash-object experiments/p07-release113-legacy-nine-stage.py)" = f7972057333001f2ff9cf4fe8cb0fa0f73792d4c
          ! grep -E -i '-----BEGIN (RSA|OPENSSH|PRIVATE)|password=[^$]' experiments/p07-release113-legacy-nine-stage.py
          python3 -m py_compile experiments/p07-release113-legacy-nine-stage.py experiments/p07-legacy-nine-operator-tests.py
          echo P07_LEGACY_NINE_OPERATOR_BYTES_AND_SYNTAX_PASS
      - name: Negative legacy-state and child-identity synthetic fixtures
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 experiments/p07-legacy-nine-operator-tests.py -v
          echo P07_LEGACY_NINE_FAIL_CLOSED_TESTS_PASS
      - name: Partial 5-of-30 resume with nested SQLite and no-clobber guards
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B experiments/p07-14-site-private-assets-guarded-install-tests.py -v
          echo P07_PARTIAL_INSTALL_RECOVERY_SYNTHETIC_PASS
      - name: Current CP2 17-site three-owner state and stage scope regression
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B experiments/p07-17-site-staged-local-evidence-tests.py -v
          echo P07_CURRENT_CP2_17_SITE_OWNER_SCOPE_SYNTHETIC_PASS
      - name: CP2 scoped 14-site HTTP HEAD PHP-FPM synthetic safety gate
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B experiments/p07-14-site-local-http-fpm-smoke-tests.py -v
          echo P07_14_SITE_LOCAL_HTTP_FPM_SMOKE_SYNTHETIC_PASS
      - name: Three pending-site private DB evidence synthetic safe probe
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B experiments/p07-three-pending-db-recovery-evidence-tests.py -v
          echo P07_THREE_PENDING_DB_EVIDENCE_READONLY_SYNTHETIC_PASS
      - name: www3 existing isolated scratch SQL readback-only gate
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B experiments/p07-www3-restored-readback-tests.py -v
          test "$(git hash-object experiments/p07-www3-isolated-restore.py)" = 1b3b9285853cc99e467f70d92c7d2b0222874018
          echo P07_WWW3_EXISTING_SCRATCH_READBACK_SYNTHETIC_PASS
      - name: Ensure public operator has no production or source credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          ! grep -E -i 'ssh-rsa|ssh-ed25519 [A-Za-z0-9]|BEGIN PRIVATE KEY|GITHUB_TOKEN|API_KEY' experiments/p07-release113-legacy-nine-stage.py
          test "$(git show HEAD:dist/p07/0.1.0/overlay/BUILD_ID | tr -d '\n')" = 0.1.0-release113
          echo P07_NINE_OPERATOR_NO_PRODUCTION_WRITE_IN_RUNNER_PASS
