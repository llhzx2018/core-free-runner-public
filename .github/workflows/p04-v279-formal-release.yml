name: P04 V2.7.9 Formal Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p04-v279-formal-release.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  SOURCE_REPOSITORY: llhzx2018/vf-infra
  SOURCE_COMMIT: 63069f57986646cfb245ecac68200f2a82be7fe0
  SOURCE_TREE: ec830fc7c4a320d25357b3fdbe7218f7b335db6c
  BASE_TAG: v2.7.8
  BASE_COMMIT: ec133d34c1f27098a01aa7b5e9f8e77ba8e847a2
  TARGET_VERSION: 2.7.9
  SOURCE_VERSION: 2.7.8
  SCHEMA: '14'
  VERIFIED_RUN: '32203985284'
  VERIFIED_JOB: '95923423931'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Checkout public runner evidence repository
        uses: actions/checkout@v4
        with:
          path: runner

      - name: Registered capability gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VF_PRIVATE_READ_TOKEN" || { echo VF_PRIVATE_READ_TOKEN_MISSING; exit 78; }
          test -n "$VF_RELEASE_WRITE_TOKEN" || { echo VF_RELEASE_WRITE_TOKEN_MISSING; exit 79; }
          echo REGISTERED_RELEASE_CAPABILITIES=PASS

      - name: Checkout exact promoted P04 source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_COMMIT }}
          token: ${{ env.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: candidate

      - name: Prepare PHP runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, fileinfo, sodium, zip, curl
          coverage: none

      - name: Verify exact source and common baseline scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test "$(tr -d '\r\n' < candidate/VERSION)" = "$TARGET_VERSION"
          test "$(git -C candidate rev-parse "$BASE_TAG^{commit}")" = "$BASE_COMMIT"
          php -l candidate/src/app/BrandAssetService.php
          php -l candidate/public/branding-status.php
          php -l candidate/public/branding-upload.php
          php -l candidate/public/branding-reset.php
          php -l candidate/public/branding-asset.php
          node --check candidate/public/assets/v279-common-branding.js
          echo EXACT_SOURCE_AND_SCOPE=PASS

      - name: Build deterministic FULL and Atomic UPDATE
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/p04-v279-release"
          TARGET_RT="$OUT/runtime"
          BASE_WT="$RUNNER_TEMP/p04-v278-base"
          BASE_RT="$OUT/base-runtime"
          RESULT_RT="$OUT/result-runtime"
          PKG="$OUT/package"
          rm -rf "$OUT" "$BASE_WT"
          mkdir -p "$OUT" "$PKG"

          python3 candidate/scripts/build-release-tree.py "$TARGET_RT" --source-root "$GITHUB_WORKSPACE/candidate"
          git -C candidate worktree add --detach "$BASE_WT" "$BASE_TAG" >/dev/null
          python3 candidate/scripts/build-release-tree.py "$BASE_RT" --source-root "$BASE_WT"
          test "$(tr -d '\r\n' < "$TARGET_RT/VERSION.txt")" = "$TARGET_VERSION"
          test "$(tr -d '\r\n' < "$BASE_RT/VERSION.txt")" = "$SOURCE_VERSION"

          php candidate/tests/integration/common_branding_contract_v279.php "$TARGET_RT"

          python3 - "$TARGET_RT" "$OUT" <<'PY'
          from pathlib import Path
          import hashlib, json, sys, zipfile
          runtime=Path(sys.argv[1]); out=Path(sys.argv[2]); target='2.7.9'
          mp=runtime/'release-manifest.json'
          m=json.loads(mp.read_text(encoding='utf-8'))
          m.update({
              'release_kind':'common_baseline_maintenance',
              'phase':'FORMAL_RELEASE','phase_status':'RELEASE',
              'release_candidate':False,'production_release':True,'final_release':True,
              'schema_change':False,'business_model_change':False,
              'provider_write_authority_change':False,
          })
          m['notes']=[
              'V2.7.9 adopts VF-COMMON-PRODUCT-BASELINE@1.0 and closes the only real P04 runtime gap: configurable Logo and Favicon assets.',
              'Brand assets are validated, previewable/resettable, cache-busted and stored in the private external data path so normal online runtime replacement does not overwrite them.',
              'Existing Import/Export, Backup/Restore, Install, Online Update, Migration/Rollback and Security/Test capabilities are retained; Schema remains 14 and Provider authority remains read-only first.',
          ]
          entries=[]
          for q in sorted(x for x in runtime.rglob('*') if x.is_file() and x.name!='release-manifest.json'):
              rel=q.relative_to(runtime).as_posix(); data=q.read_bytes()
              entries.append((rel,hashlib.sha256(data).hexdigest(),len(data)))
          fp=hashlib.sha256(''.join(f'{sha}  {rel}\n' for rel,sha,_ in entries).encode()).hexdigest()
          m['file_count']=len(entries); m['source_fingerprint']=fp
          m['files']=[{'path':r,'sha256':s,'size':n} for r,s,n in entries]
          mp.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          full=out/f'VF_Infra_V{target}_FULL.zip'
          with zipfile.ZipFile(full,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9,strict_timestamps=True) as z:
              for q in sorted(x for x in runtime.rglob('*') if x.is_file()):
                  rel=q.relative_to(runtime).as_posix()
                  info=zipfile.ZipInfo(rel,date_time=(1980,1,1,0,0,0)); info.compress_type=zipfile.ZIP_DEFLATED
                  info.create_system=3; info.external_attr=(0o100644<<16)
                  z.writestr(info,q.read_bytes())
          print('RUNTIME_FINGERPRINT='+fp)
          PY

          python3 - "$TARGET_RT" "$PKG" "$GITHUB_WORKSPACE/candidate" <<'PY'
          from pathlib import Path
          import hashlib, json, re, shutil, sys
          rt=Path(sys.argv[1]); out=Path(sys.argv[2]); root=Path(sys.argv[3])
          target='2.7.9'; source='2.7.8'; schema=14
          payload=[
              'VERSION.txt',
              'assets/v279-common-branding.css',
              'assets/v279-common-branding.js',
              'branding-asset.php',
              'branding-reset.php',
              'branding-status.php',
              'branding-upload.php',
              'index.php',
              'login.php',
              'app/BrandAssetService.php',
              'release-manifest.json',
          ]
          src=(root/'scripts/build-v251-maintenance-release.py').read_text(encoding='utf-8')
          old="PAYLOAD_PATHS=['VERSION.txt','login.php','maintenance.php','app/Core/MaintenanceUpdateService.php','release-manifest.json']"
          new='PAYLOAD_PATHS='+repr(payload).replace(' ','')
          old_self="foreach(['VERSION.txt','login.php','maintenance.php','app/Core/MaintenanceUpdateService.php','release-manifest.json'] as $r)"
          new_self="foreach(["+','.join("'"+x+"'" for x in payload)+"] as $r)"
          if src.count(old)!=1 or src.count(old_self)!=1: raise SystemExit('PROVEN_TEMPLATE_DRIFT')
          src=src.replace(old,new).replace(old_self,new_self)
          src=src.replace('2.5.1','__T__').replace('2.5.0','__S__').replace('__T__',target).replace('__S__',source)
          src=src.replace('vfi251','vfi279').replace('atomic_251','atomic_279')
          gen=out/'builder.py'; gen.write_text(src,encoding='utf-8')
          argv=sys.argv[:]
          try:
              sys.argv=[str(gen),'--target-runtime',str(rt),'--output',str(out)]
              scope={'__name__':'__main__','__file__':str(gen)}
              exec(compile(src,str(gen),'exec'),scope,scope)
          finally: sys.argv=argv
          atomic=out/f'VF_Infra_V{target}_ATOMIC.zip'; repair=out/f'repair-v{target}.php'; manifest=out/'PACKAGE_MANIFEST.json'
          if not atomic.is_file() or not repair.is_file() or not manifest.is_file(): raise SystemExit('BUILDER_OUTPUT_INCOMPLETE')
          update=out/f'VF_Infra_V{target}_UPDATE.zip'; shutil.copyfile(atomic,update)
          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          m=json.loads(manifest.read_text(encoding='utf-8'))
          m.update({
              'project':'P04 · VF Infra','package_id':'vf-infra','package_type':'app',
              'version':target,'schema':schema,'allowed_source_versions':[source],
              'changed_files':payload,'payload_file_count':len(payload),
              'schema_change':False,'business_model_change':False,'provider_write_authority_change':False,
              'maintenance_only':True,'release_kind':'common_baseline_maintenance',
              'update_infrastructure':'core-updates + GitHub Release',
              'atomic_asset_name':atomic.name,'atomic_sha256':sha(atomic),'atomic_bytes':atomic.stat().st_size,
              'update_asset_name':update.name,'update_sha256':sha(update),'update_bytes':update.stat().st_size,
              'update_and_atomic_bytes_identical':atomic.read_bytes()==update.read_bytes(),
          })
          contract=(rt/'app/Core/Update/UpdateContract.php').read_text(encoding='utf-8')
          mm=re.search(r"public\s+const\s+HANDOFF_MARKER\s*=\s*'([^']+)'\s*;",contract)
          if not mm: raise SystemExit('HANDOFF_CONTRACT_MISSING')
          marker=mm.group(1); raw=repair.read_text(encoding='utf-8')
          if marker not in raw: raise SystemExit('HANDOFF_MARKER_MISSING')
          for required in ['OnlineUpdateHandoff::authorize','OnlineUpdateHandoff::recordRepairResult','vf_online_handoff']:
              if required not in raw: raise SystemExit('HANDOFF_BEHAVIOR_MISSING '+required)
          m['online_handoff_marker']=marker; m['online_handoff_gate']='PASS'
          manifest.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          files=[atomic,update,repair,manifest]
          (out/'SHA256SUMS.txt').write_text(''.join(f'{sha(p)}  {p.name}\n' for p in files),encoding='utf-8')
          print('UPDATE_SHA256='+sha(update)); print('UPDATE_BYTES='+str(update.stat().st_size))
          PY

          php -l "$PKG/repair-v2.7.9.php"
          php "$PKG/repair-v2.7.9.php" --self-test
          unzip -t "$PKG/VF_Infra_V2.7.9_UPDATE.zip" >/dev/null
          (cd "$PKG" && sha256sum -c SHA256SUMS.txt)

          cp -a "$BASE_RT" "$RESULT_RT"
          for rel in VERSION.txt assets/v279-common-branding.css assets/v279-common-branding.js branding-asset.php branding-reset.php branding-status.php branding-upload.php index.php login.php app/BrandAssetService.php release-manifest.json; do
            mkdir -p "$RESULT_RT/$(dirname "$rel")"
            cp "$TARGET_RT/$rel" "$RESULT_RT/$rel"
          done
          diff -qr "$RESULT_RT" "$TARGET_RT"
          echo FULL_RUNTIME_VS_UPDATE_RESULT_SOURCE_EXACT=PASS

          ! unzip -Z1 "$PKG/VF_Infra_V2.7.9_UPDATE.zip" | grep -Ei '(^|/)(config\.php|\.env|private_data|backup|backups|cache|session|sessions|log|logs|temp|tmp)(/|$)|\.(sqlite3?|db)$'
          cp "$PKG/VF_Infra_V2.7.9_UPDATE.zip" "$OUT/"
          cp "$PKG/VF_Infra_V2.7.9_ATOMIC.zip" "$OUT/"
          cp "$PKG/repair-v2.7.9.php" "$OUT/"
          cp "$PKG/PACKAGE_MANIFEST.json" "$OUT/"
          cp "$PKG/SHA256SUMS.txt" "$OUT/"
          sha256sum "$OUT/VF_Infra_V2.7.9_FULL.zip" "$OUT/VF_Infra_V2.7.9_UPDATE.zip"
          git -C candidate worktree remove --force "$BASE_WT" >/dev/null

      - name: Publish private GitHub Release v2.7.9
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          REPO="$SOURCE_REPOSITORY"
          OUT="$RUNNER_TEMP/p04-v279-release"
          if gh release view "v$TARGET_VERSION" --repo "$REPO" >/dev/null 2>&1; then
            TARGET=$(gh release view "v$TARGET_VERSION" --repo "$REPO" --json targetCommitish --jq .targetCommitish)
            test "$TARGET" = "$SOURCE_COMMIT"
            echo RELEASE_ALREADY_EXISTS_EXACT=PASS
          else
            gh release create "v$TARGET_VERSION" \
              "$OUT/VF_Infra_V2.7.9_UPDATE.zip" \
              "$OUT/VF_Infra_V2.7.9_ATOMIC.zip" \
              "$OUT/VF_Infra_V2.7.9_FULL.zip" \
              "$OUT/repair-v2.7.9.php" \
              "$OUT/PACKAGE_MANIFEST.json" \
              "$OUT/SHA256SUMS.txt" \
              --repo "$REPO" --target "$SOURCE_COMMIT" --title "VF Infra V2.7.9" \
              --notes "V2.7.8 → V2.7.9 Common Product Baseline maintenance release. Adds configurable Logo/Favicon with validated private external storage and online-update persistence. Existing Import/Export, Backup/Restore, Install, Online Update, Migration/Rollback and Security/Test contracts are retained. Schema 14 unchanged; Provider remains READ-ONLY FIRST. Verified by core-free-runner-public run $VERIFIED_RUN / job $VERIFIED_JOB. Production upgrade is not executed by this release workflow."
          fi

      - name: Remote release and artifact exact readback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/p04-v279-release"
          READ="$RUNNER_TEMP/p04-v279-readback"
          mkdir -p "$READ"
          gh api "repos/$SOURCE_REPOSITORY/releases/tags/v$TARGET_VERSION" > "$READ/release.json"
          jq -e --arg t "v$TARGET_VERSION" --arg s "$SOURCE_COMMIT" '.tag_name==$t and .target_commitish==$s and .draft==false and .prerelease==false' "$READ/release.json" >/dev/null
          for NAME in VF_Infra_V2.7.9_UPDATE.zip VF_Infra_V2.7.9_FULL.zip VF_Infra_V2.7.9_ATOMIC.zip repair-v2.7.9.php PACKAGE_MANIFEST.json SHA256SUMS.txt; do
            COUNT=$(jq --arg n "$NAME" '[.assets[]|select(.name==$n)]|length' "$READ/release.json")
            test "$COUNT" = 1
            ID=$(jq -r --arg n "$NAME" '.assets[]|select(.name==$n)|.id' "$READ/release.json")
            gh api -H 'Accept: application/octet-stream' "repos/$SOURCE_REPOSITORY/releases/assets/$ID" > "$READ/$NAME"
            test "$(wc -c < "$READ/$NAME" | tr -d ' ')" = "$(jq -r --arg n "$NAME" '.assets[]|select(.name==$n)|.size' "$READ/release.json")"
            test "$(sha256sum "$READ/$NAME" | awk '{print $1}')" = "$(sha256sum "$OUT/$NAME" | awk '{print $1}')"
          done
          unzip -t "$READ/VF_Infra_V2.7.9_UPDATE.zip" >/dev/null
          unzip -t "$READ/VF_Infra_V2.7.9_FULL.zip" >/dev/null
          php "$READ/repair-v2.7.9.php" --self-test
          echo REMOTE_RELEASE_AND_ASSET_READBACK=PASS

      - name: Seal public-safe release evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/p04-v279-release"
          READ="$RUNNER_TEMP/p04-v279-readback"
          mkdir -p runner/evidence/p04
          python3 - "$READ/release.json" "$OUT" "$GITHUB_WORKSPACE/runner/evidence/p04/P04_V279_RELEASE_LATEST.json" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          release=json.load(open(sys.argv[1],encoding='utf-8')); out=Path(sys.argv[2]); dest=Path(sys.argv[3])
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          def asset(name): return next(x for x in release['assets'] if x['name']==name)
          u=asset('VF_Infra_V2.7.9_UPDATE.zip'); f=asset('VF_Infra_V2.7.9_FULL.zip')
          payload={
            'status':'PASS','project':'P04','version':'2.7.9','source_version':'2.7.8','schema':14,'migration':'NONE',
            'source_commit':'63069f57986646cfb245ecac68200f2a82be7fe0','source_tree':'ec830fc7c4a320d25357b3fdbe7218f7b335db6c',
            'candidate_gate_run':32203985284,'candidate_gate_job':95923423931,
            'release_tag':'v2.7.9','release_name':release['name'],'release_id':release['id'],'released_at':release.get('published_at') or release.get('created_at'),
            'update_asset':u['name'],'update_asset_id':u['id'],'update_bytes':u['size'],'update_sha256':sha(out/u['name']),
            'full_asset':f['name'],'full_asset_id':f['id'],'full_bytes':f['size'],'full_sha256':sha(out/f['name']),
            'artifact_readback':'PASS','atomic_self_test':'PASS','source_exact':'PASS','common_baseline':'7_OF_7_COMPLIANT',
            'private_source_persisted':False,'token_exposed':False,'production_write':0,'production_upgrade':'NOT_EXECUTED'
          }
          dest.write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git -C runner config user.name 'vf-runner'
          git -C runner config user.email 'vf-runner@users.noreply.github.com'
          git -C runner add evidence/p04/P04_V279_RELEASE_LATEST.json
          if ! git -C runner diff --cached --quiet; then
            git -C runner commit -m 'evidence(P04): seal V2.7.9 formal release'
            git -C runner push origin HEAD:main
          fi

      - name: Upload public-safe evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P04-VF-INFRA-V2.7.9-RELEASE-EVIDENCE
          path: runner/evidence/p04/P04_V279_RELEASE_LATEST.json
          if-no-files-found: warn
          retention-days: 30
