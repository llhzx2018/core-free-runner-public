name: P04 VF Infra V2.7.0 Distribution and Production Discovery

on:
  push:
    branches:
      - p04-v270-formal-release-tmp
    paths:
      - '.github/workflows/p04-v270-distribution-production-discovery.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p04-v270-distribution-production-discovery
  cancel-in-progress: false

jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VF_RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      VF_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify immutable V2.7.0 Release and downloadable UPDATE
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VF_RELEASE_TOKEN"
          TAG="$RUNNER_TEMP/tag.json"; REL="$RUNNER_TEMP/release.json"; ZIP="$RUNNER_TEMP/VF_Infra_V2.7.0_UPDATE.zip"
          curl -fsSL -H "Authorization: Bearer $VF_RELEASE_TOKEN" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/vf-infra/git/ref/tags/v2.7.0 -o "$TAG"
          curl -fsSL -H "Authorization: Bearer $VF_RELEASE_TOKEN" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/vf-infra/releases/tags/v2.7.0 -o "$REL"
          python3 - "$TAG" "$REL" <<'PY'
          import json,sys
          tag=json.load(open(sys.argv[1])); rel=json.load(open(sys.argv[2]))
          assert tag['object']['sha']=='e2fd12cce0518333d7aa15e9d5babc5db0c9043b'
          assert rel['id']==372012152 and rel['tag_name']=='v2.7.0' and rel['name']=='VF Infra V2.7.0'
          assert rel['draft'] is False and rel['prerelease'] is False
          a=next(x for x in rel['assets'] if x['name']=='VF_Infra_V2.7.0_UPDATE.zip')
          assert a['id']==518668721 and a['size']==140557
          assert a.get('digest')=='sha256:34d34daf9641c21c5387363136f5297b37af2cc6722e41f8967358a04ef3c559'
          print('RELEASE_REMOTE_IDENTITY=PASS')
          PY
          curl -fsSL -H "Authorization: Bearer $VF_RELEASE_TOKEN" -H 'Accept: application/octet-stream' https://api.github.com/repos/llhzx2018/vf-infra/releases/assets/518668721 -o "$ZIP"
          test "$(stat -c %s "$ZIP")" = '140557'
          test "$(sha256sum "$ZIP" | awk '{print $1}')" = '34d34daf9641c21c5387363136f5297b37af2cc6722e41f8967358a04ef3c559'
          echo 'UPDATE_DOWNLOAD=PASS'
          echo 'UPDATE_SHA256=PASS'

      - name: Verify core-updates V2.7.0 exact metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          TOKEN="$VF_READ_TOKEN"; [ -n "$TOKEN" ] || TOKEN="$VF_RELEASE_TOKEN"
          META="$RUNNER_TEMP/p04.json"
          curl -fsSL -H "Authorization: Bearer $TOKEN" -H 'Accept: application/vnd.github.raw+json' 'https://api.github.com/repos/llhzx2018/core-updates/contents/projects/P04.json?ref=main' -o "$META"
          python3 - "$META" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['enabled'] is True
          assert d['target_version']=='2.7.0' and d['from_versions']==['2.6.0'] and d['update_type']=='ATOMIC'
          assert d['schema_from']=='14' and d['schema_to']=='14'
          assert d['release_tag']=='v2.7.0' and d['release_id']==372012152
          assert d['release_product_commit']=='e2fd12cce0518333d7aa15e9d5babc5db0c9043b'
          assert d['release_product_tree']=='0395a8b8b702faee2f7d2bbab7a3b65ee98915e9'
          assert d['asset_name']=='VF_Infra_V2.7.0_UPDATE.zip' and d['asset_id']==518668721 and d['asset_bytes']==140557
          assert d['asset_sha256']=='34d34daf9641c21c5387363136f5297b37af2cc6722e41f8967358a04ef3c559'
          assert d['backup_required'] is True and d['rollback_supported'] is True
          print('CORE_UPDATES_REMOTE_IDENTITY=PASS')
          print('VERSION_ELIGIBILITY=PASS')
          print('SCHEMA_COMPATIBILITY=PASS')
          PY

      - name: Read Production installed version with GET only
        shell: bash
        run: |
          set -Eeuo pipefail
          HTML="$RUNNER_TEMP/login.html"
          curl -fsSL --max-time 20 'https://infra.kewaro.com/login.php' -o "$HTML"
          grep -Fq 'VF Infra · V2.6.0' "$HTML"
          echo 'PRODUCTION_CURRENT=2.6.0'
          echo 'PRODUCTION_PUBLIC_READBACK=PASS'
          echo 'PRODUCTION_NETWORK_WRITE=0'
          echo 'NO_PRODUCTION_LOGIN_POST_EXECUTED=TRUE'
          echo 'NO_UPDATE_CHECK_POST_EXECUTED=TRUE'
          echo 'NO_PRODUCTION_FILE_WRITE_EXECUTED=TRUE'
          echo 'NO_PRODUCTION_DATABASE_WRITE_EXECUTED=TRUE'
          echo 'NO_PRODUCTION_UPGRADE_EXECUTED=TRUE'

      - name: Publish public-safe discovery result
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > p04-v270-production-discovery-status.json <<'EOF'
          {
            "project": "P04 · VF Infra",
            "production_discovery": "PASS",
            "production_current": "2.6.0",
            "target": "2.7.0",
            "update_available": true,
            "version_eligibility": "PASS",
            "schema_compatibility": "PASS",
            "release_asset_identity": "PASS",
            "release_id": 372012152,
            "release_product_commit": "e2fd12cce0518333d7aa15e9d5babc5db0c9043b",
            "asset_name": "VF_Infra_V2.7.0_UPDATE.zip",
            "asset_id": 518668721,
            "asset_bytes": 140557,
            "asset_sha256": "34d34daf9641c21c5387363136f5297b37af2cc6722e41f8967358a04ef3c559",
            "schema_from": 14,
            "schema_to": 14,
            "migration": "NONE",
            "production_login_post_executed": false,
            "update_check_post_executed": false,
            "production_file_write": 0,
            "production_database_write": 0,
            "production_upgrade": "NOT_EXECUTED",
            "main_alignment": "NOT_EXECUTED"
          }
          EOF
          git config user.name 'VF P04 Discovery Readback'
          git config user.email 'actions@users.noreply.github.com'
          git add p04-v270-production-discovery-status.json
          git commit -m 'chore(P04): record V2.7.0 production discovery [skip ci]'
          git push origin HEAD:p04-v270-formal-release-tmp
          cat p04-v270-production-discovery-status.json

      - name: Upload public-safe discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: P04-VF-Infra-V2.7.0-Distribution-Discovery-Evidence
          path: p04-v270-production-discovery-status.json
          if-no-files-found: error
          retention-days: 14
