name: P07 release86 archived exact formal release (manual historical recheck only)
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p07-release86-mariadb-formal
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_TAG: p07-v0.1.0-release86-mariadb-1011
      RELEASE_REPO: llhzx2018/core-free-runner-public
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Exact merged source and immutable distribution preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN" || { echo 'P07_RELEASE_TOKEN_MISSING'; exit 78; }
          test "$GITHUB_REPOSITORY" = "$RELEASE_REPO"
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_main="$(gh api "repos/$RELEASE_REPO/git/ref/heads/main" --jq '.object.sha')"
          test "$remote_main" = "$GITHUB_SHA"
          pkg='packages/p07-system-care/0.1.0-rc55'
          test "$(cat "$pkg/VERSION")" = '0.1.0-rc55'
          test "$(git hash-object "$pkg/MANIFEST.gitblob")" = 'ca90c397ed139d0d74e3f70f8653efd220082e93'
          (cd "$pkg" && while read -r sha name; do test "$(git hash-object "$name")" = "$sha"; done < MANIFEST.gitblob)
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc55"' installers/p07-toolbox.sh
          grep -Fq "VERSION='0.1.0-rc55'" installers/p07-system-care.sh
          grep -Fq "BEGINNER_UI_BLOB='2b9ba0e4b98457a81bfd1b2dd70a94746307fb94'" installers/p07-system-care.sh
          test "$(git hash-object installers/p07-system-care.sh)" = 3eb66ee76eb278ce478774199f99467f78c6d644
          grep -Fq "MANIFEST_BLOB='ca90c397ed139d0d74e3f70f8653efd220082e93'" installers/p07-system-care.sh
          test "$(cat dist/p07/0.1.0/overlay/BUILD_ID)" = '0.1.0-release86'
          test "$(git hash-object dist/p07/0.1.0/overlay/RUNTIME.gitblob)" = 'b6bef5d07e9dccfaa72aa599add9aceaef7ecb8d'
          test "$(git hash-object dist/p07/0.1.0/overlay/MANIFEST.gitblob)" = '20ca384068ed618f72cd4352a8faa195fdbd2938'
          (cd dist/p07/0.1.0/overlay && while read -r sha name; do test "$(git hash-object "$name")" = "$sha"; done < RUNTIME.gitblob)
          (cd dist/p07/0.1.0/overlay && while read -r sha name; do test "$(git hash-object "$name")" = "$sha"; done < MANIFEST.gitblob)
          test "$(git hash-object installers/p07-final.sh)" = '34c1f41d2ce8b5a8b928b16f91808a1cd3f89c54'
          grep -Fq 'EXPECTED_BLOB="34c1f41d2ce8b5a8b928b16f91808a1cd3f89c54"' installers/p07.sh
          grep -Fq 'EXPECTED_BUILD_ID="0.1.0-release86"' installers/p07-final.sh
          grep -Fq 'RUNTIME_MANIFEST_BLOB="b6bef5d07e9dccfaa72aa599add9aceaef7ecb8d"' installers/p07-final.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release86"' installers/p07-toolbox.sh
          grep -Fq 'CLOUDPANEL_BOOTSTRAP_DB_ENGINE = "MARIADB_10.11"' dist/p07/0.1.0/overlay/lib/server_migration.py
          grep -Fq 'NEW_SERVER_REQUIRES_MARIADB_10_11' dist/p07/0.1.0/overlay/lib/server_migration_pull.py
          grep -Fq "VFOPS_BUILD_EXPECTED='0.1.0-release86'" "$pkg/vf-system-care.sh"
          bash -n "$pkg/intrusion-evidence.sh" installers/p07-system-care.sh installers/p07-toolbox.sh installers/p07-final.sh installers/p07.sh dist/p07/0.1.0/overlay/bin/vfops-init-ui
          (cd dist/p07/0.1.0/overlay && PYTHONPATH=lib python3 -m unittest -q tests.test_mariadb_owner_policy tests.test_server_migration tests.test_server_migration_pull)
          python3 -m unittest discover -s tests -p 'test_p07_wp_owner_baseline_rc50.py' -q
          python3 -m unittest discover -s tests -p 'test_p07_wp_owner_status_rc51.py' -q
          python3 -m unittest discover -s tests -p 'test_p07_wp_owner_overview_rc52.py' -q
          python3 -m unittest discover -s tests -p 'test_p07_wp_owner_verify_rc53.py' -q
          python3 -m unittest discover -s tests -p 'test_p07_wp_owner_triage_rc48.py' -q
          echo 'P07_RELEASE85_MERGED_EXACT_SOURCE=PASS'

      - name: Formal Release through registered VF release credential
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! gh release view "$RELEASE_TAG" -R "$RELEASE_REPO" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" -R "$RELEASE_REPO" --target "$GITHUB_SHA" \
              --title 'P07 · release86 · 新服务器默认 MariaDB 10.11' \
              --notes 'CloudPanel 全新服务器默认 MariaDB 10.11。目标迁移检查、断点恢复及最终切换均拒绝错误数据库引擎，永不自动替换已有 MySQL/Percona。System Care rc55 对齐 release86。当前版本代码已完成隔离机器集成验证；产品仓原生 CI 存在历史基础设施失败，未声称原生 CI PASS。新 VPS MariaDB 10.11 实机及跨引擎迁移 E2E 均未执行；DNS、旧机及生产操作均需 Owner 手工确认。'
          fi
          tag_sha="$(gh api "repos/$RELEASE_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          test "$tag_sha" = "$GITHUB_SHA" || { echo 'P07_RELEASE85_TAG_IDENTITY_MISMATCH'; exit 81; }
          release_data="$(gh api "repos/$RELEASE_REPO/releases/tags/$RELEASE_TAG")"
          test "$(jq -r '.tag_name' <<< "$release_data")" = "$RELEASE_TAG"
          test "$(jq -r '.target_commitish' <<< "$release_data")" = "$GITHUB_SHA"
          test "$(jq -r '.draft' <<< "$release_data")" = false
          test "$(jq -r '.prerelease' <<< "$release_data")" = false
          echo 'P07_RELEASE85_FORMAL_RELEASE_REMOTE_READBACK=PASS'

      - name: Published public distribution and raw-byte readback
        shell: bash
        run: |
          set -Eeuo pipefail
          manifest_url="https://raw.githubusercontent.com/$RELEASE_REPO/$GITHUB_SHA/packages/p07-system-care/0.1.0-rc55/MANIFEST.gitblob"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 5 --retry-delay 2 "$manifest_url" -o /tmp/p07-release86-manifest
          test "$(git hash-object /tmp/p07-release86-manifest)" = 'ca90c397ed139d0d74e3f70f8653efd220082e93'
          url="https://raw.githubusercontent.com/$RELEASE_REPO/main/installers/p07-system-care.sh"
          good=0
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL --proto '=https' --tlsv1.2 "$url" -o /tmp/p07-public-installer &&
              grep -Fq "VERSION='0.1.0-rc55'" /tmp/p07-public-installer &&
              grep -Fq "MANIFEST_BLOB='ca90c397ed139d0d74e3f70f8653efd220082e93'" /tmp/p07-public-installer; then
              good=1
              break
            fi
            sleep 3
          done
          test "$good" = 1 || { echo P07_RELEASE85_PUBLIC_INSTALLER_NOT_CURRENT; exit 85; }
          live_base="https://raw.githubusercontent.com/$RELEASE_REPO/$GITHUB_SHA"
          curl -fsSL --proto '=https' --tlsv1.2 "$live_base/installers/p07-final.sh" -o /tmp/p07-release86-final
          test "$(git hash-object /tmp/p07-release86-final)" = '34c1f41d2ce8b5a8b928b16f91808a1cd3f89c54'
          curl -fsSL --proto '=https' --tlsv1.2 "$live_base/dist/p07/0.1.0/overlay/RUNTIME.gitblob" -o /tmp/p07-release86-runtime
          test "$(git hash-object /tmp/p07-release86-runtime)" = 'b6bef5d07e9dccfaa72aa599add9aceaef7ecb8d'
          curl -fsSL --proto '=https' --tlsv1.2 "$live_base/installers/p07-toolbox.sh" -o /tmp/p07-release86-toolbox
          test "$(git hash-object /tmp/p07-release86-toolbox)" = '4972b57d25adbf4cbe58272a33b07cadb3572086'
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release86"' /tmp/p07-release86-toolbox
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc55"' /tmp/p07-release86-toolbox
          echo 'P07_RELEASE85_PUBLIC_DISTRIBUTION_REMOTE_READBACK=PASS'
