name: P02 V2.5.41 Main UX Gate

on:
  push:
    branches:
      - run/p02-v2541-main-ux-20260920
    paths:
      - '.github/workflows/p02-v2541-main-ux.yml'

permissions:
  contents: read

jobs:
  ux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_SHA: 186ebdaac96bc2b7eec64322664bc3662eae4dbb
      TARGET_VERSION: 2.5.41
    steps:
      - name: Checkout exact P02 main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 186ebdaac96bc2b7eec64322664bc3662eae4dbb
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product

      - name: Install runtime and Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-zip sqlite3 curl
          cd product
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify exact main
        shell: bash
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "$TARGET_VERSION"
          bash scripts/verify-repository.sh
          node tests/unit/p02_candidate_version_identity_contract.mjs
          node tests/unit/p02_v2540_final_ux_convergence.mjs
          node tests/unit/p02_inkstone_shell_parity.mjs
          echo P02_V2541_MAIN_SOURCE=PASS

      - name: Real Chromium UX regression
        shell: bash
        working-directory: product
        run: |
          set -Eeuo pipefail
          bash scripts/ux-browser-reverify.sh | tee /tmp/p02-v2541-main-browser.log
          grep -Fx 'P02_V2541_CONDITIONAL_EDITOR_OUTLINE=PASS' /tmp/p02-v2541-main-browser.log
          echo P02_V2541_MAIN_BROWSER=PASS
