name: P04 V2.5.3 Gate 9 Diagnose

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p04-v253-gate9-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Prepare runtime
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-zip sqlite3 >/dev/null
      - name: Capture Gate 9 outputs
        env:
          VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone -q https://github.com/llhzx2018/core-free-runner-public.git runner-tools
          python3 - runner-tools/ops/p04/v253_hotfix_execute_v2.sh <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]);s=p.read_text()
          old='''POST_CODE=$(curl -sS -b "$WORK/cookie" -o "$WORK/settings-after.json" -w '%{http_code}' "$BASE/api.php?action=settings")\ntest "$POST_CODE" = 200\npython3 - "$WORK/settings-after.json" <<'PY'\nimport json,sys\nd=json.load(open(sys.argv[1],encoding='utf-8'))\nassert d.get('ok') is True,d\nassert d['system']['version']=='2.5.3' and d['system']['schema_version']==14\nut=d['update_trust']; assert ut['required_key_id']=='core-updates + GitHub Release' and 'ready' in ut\nassert 'backups' in d and 'diagnostics' in d and 'provider_accounts' in d\nprint('SETTINGS_V253=PASS')\nPY\ncurl -sS -D "$WORK/maint.headers" -b "$WORK/cookie" "$BASE/maintenance.php" -o "$WORK/maint.html"\ngrep -Fiq "style-src 'self' 'nonce-" "$WORK/maint.headers"\ngrep -Fq '<style nonce=' "$WORK/maint.html"\n! grep -Fq '<footer style=' "$WORK/maint.html"\ncat > "$WORK/source-manifest.php" <<'PHP'\n<?php\nrequire $argv[1].'/bootstrap.php';\n$m=(new \\VFInfra\\Core\\MaintenanceUpdateService())->productionSourceManifest();\necho $m['sha256'],'|',$m['file_count'],'|',$m['version'],'|',$m['schema'],PHP_EOL;\nPHP\nACTUAL_MANIFEST=$(php "$WORK/source-manifest.php" "$SITE")\ntest "$ACTUAL_MANIFEST" = "$TARGET_MANIFEST_SHA|$TARGET_SOURCE_FILES|2.5.3|14"\necho 'SETTINGS_MAINTENANCE_SOURCE_EXACT=PASS' '''.rstrip()
          new='''POST_CODE=$(curl -sS -b "$WORK/cookie" -o "$WORK/settings-after.json" -w '%{http_code}' "$BASE/api.php?action=settings")\necho "SETTINGS_HTTP=$POST_CODE"\npython3 - "$WORK/settings-after.json" <<'PY'\nimport json,sys\nd=json.load(open(sys.argv[1],encoding='utf-8'))\nprint('SETTINGS_OK='+str(d.get('ok')))\nprint('SYSTEM_VERSION='+str((d.get('system') or {}).get('version')))\nprint('SYSTEM_SCHEMA='+str((d.get('system') or {}).get('schema_version')))\nprint('UPDATE_TRUST='+json.dumps(d.get('update_trust'),ensure_ascii=False))\nprint('HAS_BACKUPS='+str('backups' in d))\nprint('HAS_DIAGNOSTICS='+str('diagnostics' in d))\nprint('HAS_PROVIDER_ACCOUNTS='+str('provider_accounts' in d))\nprint('ERROR_CODE='+str(d.get('error_code')))\nPY\ncurl -sS -D "$WORK/maint.headers" -b "$WORK/cookie" "$BASE/maintenance.php" -o "$WORK/maint.html"\necho 'MAINTENANCE_CSP:'\ngrep -i '^Content-Security-Policy:' "$WORK/maint.headers" || true\necho "MAINT_STYLE_NONCE=$(grep -Fq '<style nonce=' "$WORK/maint.html" && echo YES || echo NO)"\necho "MAINT_INLINE_FOOTER=$(grep -Fq '<footer style=' "$WORK/maint.html" && echo YES || echo NO)"\ncat > "$WORK/source-manifest.php" <<'PHP'\n<?php\nrequire $argv[1].'/bootstrap.php';\n$m=(new \\VFInfra\\Core\\MaintenanceUpdateService())->productionSourceManifest();\necho $m['sha256'],'|',$m['file_count'],'|',$m['version'],'|',$m['schema'],PHP_EOL;\nPHP\nACTUAL_MANIFEST=$(php "$WORK/source-manifest.php" "$SITE")\necho "ACTUAL_MANIFEST=$ACTUAL_MANIFEST"\necho "EXPECTED_MANIFEST=$TARGET_MANIFEST_SHA|$TARGET_SOURCE_FILES|2.5.3|14"\necho 'GATE9_DIAG_COMPLETE=PASS'\nexit 0'''
          if s.count(old)!=1: raise SystemExit(f'gate9 sentinel count={s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          bash runner-tools/ops/p04/v253_hotfix_execute_v2.sh
      - name: Cleanup
        if: always()
        run: rm -rf runner-tools
