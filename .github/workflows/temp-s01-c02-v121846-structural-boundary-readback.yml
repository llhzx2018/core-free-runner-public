name: TEMP S01-C02 Ops V1.21.846 Structural Boundary Readback
on:
  push:
    branches:
      - temp/s01-c02-v121845-runtime-suffix-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121846-structural-boundary-readback.yml'
jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      RUNNER_MAIN: 0160b557ad4ae0e8c6acd97e7551285bc05870bd
    steps:
      - name: Read privacy-safe structural boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-static-candidate-readiness' -o /tmp/static.json
          jq '{pluginVersion,activeStaticJobStatus,activeStaticJobMode,activeStaticJobFirstFailedStep,activeStaticJobAuditFailureCount,activeStaticJobInternalLinkFailureLeafCount,sourceRecoveryRuntimeSuffixRetryStatus,sourceRecoveryRuntimeSuffixRetryCode,sourceRecoveryFinalAuditOtherStatus,sourceRecoveryFinalAuditOtherLeafCount,sourceRecoveryFinalAuditOtherClassifiedCount,sourceRecoveryFinalAuditOtherUnclassifiedCount,sourceRecoveryFinalAuditOtherPrimaryClass,sourceRecoveryFinalAuditPackageContractStatus,sourceRecoveryFinalAuditPackageContractLeafCount,sourceRecoveryFinalAuditPackageContractClassifiedCount,sourceRecoveryFinalAuditPackageContractUnclassifiedCount,sourceRecoveryFinalAuditPackageContractPrimaryClass,sourceRecoveryFinalAuditPackageContractClassCounts}' /tmp/static.json
          jq -e '.pluginVersion=="1.21.845" and .activeStaticJobStatus=="FAIL" and .activeStaticJobMode=="candidate" and .activeStaticJobFirstFailedStep=="final_decision" and .activeStaticJobAuditFailureCount==1 and .activeStaticJobInternalLinkFailureLeafCount==0 and .sourceRecoveryRuntimeSuffixRetryStatus=="blocked" and .sourceRecoveryRuntimeSuffixRetryCode=="runtime_suffix_final_audit_boundary_changed" and .sourceRecoveryFinalAuditOtherLeafCount==1 and .sourceRecoveryFinalAuditOtherPrimaryClass=="candidate_package_contract" and .sourceRecoveryFinalAuditPackageContractLeafCount==1 and .sourceRecoveryFinalAuditPackageContractUnclassifiedCount==1 and .sourceRecoveryFinalAuditPackageContractPrimaryClass=="candidate_package_contract_unclassified"' /tmp/static.json >/dev/null
      - name: Verify runner main unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git ls-remote https://github.com/llhzx2018/core-free-runner-public.git refs/heads/main | awk '{print $1}')" = "$RUNNER_MAIN"
          echo PASS_V121846_STRUCTURAL_BOUNDARY_READBACK
