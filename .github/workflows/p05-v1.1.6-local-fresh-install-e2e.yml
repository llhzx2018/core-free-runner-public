name: P05 V1.1.6 Fresh Install E2E
on:
  push:
    branches: [gate/p05-v115-stale-empty-install-20260830]
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-24.04
    env:
      P05_SHA: 4c91a990c4e451af2aa12f13aa59c5538fd1416f
    steps:
      - name: Checkout P05 exact candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.P05_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify source state matrix
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$P05_SHA"
          php -l php/src/FreshInstallRecovery.php
          bash php/tests/fresh-install-state-matrix-smoke.sh
      - name: Build release staging
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run release:source:gate
          npm run build:php-release
          npm run php:release:gate
          test -f build/vf-seo-php-release/php/src/FreshInstallRecovery.php
      - name: Test staged FULL as installed app
        shell: bash
        run: |
          set -euo pipefail
          VF_INSTALL_ROOT="$(pwd)/build/vf-seo-php-release" bash php/tests/fresh-install-state-matrix-smoke.sh
      - name: Test actual ZIP extraction as fresh site
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/full.zip"
          STAGE="$(pwd)/build/vf-seo-php-release" OUT_FILE="$OUT" python3 - <<'PY'
          import os,pathlib,zipfile
          stage=pathlib.Path(os.environ['STAGE']); out=pathlib.Path(os.environ['OUT_FILE'])
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9,strict_timestamps=True) as z:
              for p in sorted(x for x in stage.rglob('*') if x.is_file()):
                  rel=p.relative_to(stage).as_posix()
                  info=zipfile.ZipInfo(rel,date_time=(1980,1,1,0,0,0)); info.compress_type=zipfile.ZIP_DEFLATED; info.create_system=3
                  info.external_attr=((0o100755 if rel=='install-cloudpanel-php.sh' else 0o100644)<<16)
                  z.writestr(info,p.read_bytes())
          PY
          mkdir "$RUNNER_TEMP/unpacked"
          unzip -q "$OUT" -d "$RUNNER_TEMP/unpacked"
          VF_INSTALL_ROOT="$RUNNER_TEMP/unpacked" bash php/tests/fresh-install-state-matrix-smoke.sh
          echo "P05_V116_OWN_ENV_FRESH_INSTALL_E2E=PASS"
