name: TEMP P08 R43 SQLite native DB exclusive probe and MySQL MariaDB refusal
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p08-r43-db-level-writer-isolation-20261124.yml'
permissions:
  contents: read
concurrency:
  group: p08-r43-schema-archive-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  TARGET_REPO: llhzx2018/vf-adops
  TARGET_VERSION: '0.1.18'
  TARGET_SHA: 3fe0acb3eed6bf8171246bb82e5e963c0e292345
  BRIDGE_VERSION: '0.1.17'
  BRIDGE_SHA: d095c596df668dc4684563dcb3326d89db12c2e8
jobs:
  identity-preflight:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/p08-r43-db-level-writer-isolation-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 scripts/ephemeral_lane_spec.py audit-rendered --spec specs/ephemeral/p08-r43-db-level-writer-isolation-20261124.json --input .github/workflows/temp-p08-r43-db-level-writer-isolation-20261124.yml
  schema-atomic-archive:
    needs: identity-preflight
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/p08-r43-db-level-writer-isolation-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      P08_ISOLATED_INSTALL_TEST: 'YES'
      P08_R43_DISPOSABLE_SCHEMA: 'YES'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.BRIDGE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-p08-bridge
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-p08-target
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: gov-proof
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_mysql, pdo_sqlite, sqlite3, zip, mbstring, intl, bcmath, dom, fileinfo, posix
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source locked dependencies and two real source-built FULL archives
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C private-p08-bridge rev-parse HEAD)" = "$BRIDGE_SHA"
          test "$(git -C private-p08-target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(cat private-p08-bridge/VERSION)" = "$BRIDGE_VERSION"
          test "$(cat private-p08-target/VERSION)" = "$TARGET_VERSION"
          php -l private-p08-bridge/src/Upgrade/R43IsolatedSchemaTransaction.php > "$RUNNER_TEMP/r43-php-syntax.log" 2>&1 || { echo R43_TRANSACTION_PHP_SYNTAX=FAIL; exit 1; }
          php -l private-p08-bridge/tests/compatibility/r43_isolated_installed_transaction.php >> "$RUNNER_TEMP/r43-php-syntax.log" 2>&1 || { echo R43_TEST_PHP_SYNTAX=FAIL; exit 1; }
          for d in private-p08-bridge private-p08-target; do
            mkdir -p "$d/bootstrap/cache" "$d/storage/framework/cache/data" "$d/storage/framework/sessions" "$d/storage/framework/views" "$d/storage/logs"
            (cd "$d" && composer install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/r43-$d-composer.log" 2>&1) || { echo R43_COMPOSER_LOCK=FAIL; exit 1; }
            (cd "$d" && npm ci --no-audit --no-fund > "$RUNNER_TEMP/r43-$d-npm.log" 2>&1 && npm run build > "$RUNNER_TEMP/r43-$d-vite.log" 2>&1) || { echo R43_NPM_VITE=FAIL; exit 1; }
          done
          python3 private-p08-bridge/scripts/build_full.py --source private-p08-bridge --output "$RUNNER_TEMP/r43-bridge.zip" --version "$BRIDGE_VERSION" --source-sha "$BRIDGE_SHA" --governance-root gov-proof > "$RUNNER_TEMP/r43-bridge-package.log" 2>&1 || { echo R43_BRIDGE_CANONICAL_FULL=FAIL; exit 1; }
          python3 private-p08-target/scripts/build_full.py --source private-p08-target --output "$RUNNER_TEMP/r43-target.zip" --version "$TARGET_VERSION" --source-sha "$TARGET_SHA" --governance-root gov-proof > "$RUNNER_TEMP/r43-target-package.log" 2>&1 || { echo R43_TARGET_CANONICAL_FULL=FAIL; exit 1; }
          mkdir -m 700 "$RUNNER_TEMP/p08-r43-target-extract"
          unzip -q "$RUNNER_TEMP/r43-target.zip" -d "$RUNNER_TEMP/p08-r43-target-extract"
          mkdir -m 700 "$RUNNER_TEMP/p08-r43-bridge-extract"
          unzip -q "$RUNNER_TEMP/r43-bridge.zip" -d "$RUNNER_TEMP/p08-r43-bridge-extract"
          echo P08_R43_CANONICAL_DEV_FULLS_EXTRACTED=PASS
      - name: PHP Python syntax and exact-source schema provenance
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          php -l private-p08-bridge/src/Upgrade/R43SchemaAtomicArchive.php > "$RUNNER_TEMP/r43-archive-php.log" 2>&1 || { echo P08_R43_ATOMIC_VERIFIER_SYNTAX=FAIL; exit 1; }
          php -l private-p08-bridge/tests/compatibility/r43_schema_atomic_zip.php >> "$RUNNER_TEMP/r43-archive-php.log" 2>&1 || { echo P08_R43_ATOMIC_TEST_SYNTAX=FAIL; exit 1; }
          python3 -m py_compile private-p08-bridge/scripts/build_r43_schema_atomic.py > "$RUNNER_TEMP/r43-archive-python.log" 2>&1 || { echo P08_R43_ATOMIC_BUILDER_SYNTAX=FAIL; exit 1; }
          echo P08_R43_ATOMIC_CODE_SYNTAX=PASS
      - name: Two identical 21-migration schema UPDATE archives with verified source FULL
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          old_manifest="$(sha256sum "$RUNNER_TEMP/p08-r43-bridge-extract/FULL_MANIFEST.json" | cut -d' ' -f1)"
          for suffix in a b; do
            python3 private-p08-bridge/scripts/build_r43_schema_atomic.py --source-full "$RUNNER_TEMP/p08-r43-bridge-extract" --target-runtime private-p08-target --output "$RUNNER_TEMP/p08-r43-schema-$suffix.zip" --source-sha "$BRIDGE_SHA" --source-full-sha256 "$old_manifest" --target-sha "$TARGET_SHA" > "$RUNNER_TEMP/r43-schema-$suffix-build.log" 2>&1 || { echo P08_R43_SCHEMA_ATOMIC_BUILD=FAIL; exit 1; }
          done
          cmp -s "$RUNNER_TEMP/p08-r43-schema-a.zip" "$RUNNER_TEMP/p08-r43-schema-b.zip" || { echo P08_R43_SCHEMA_ATOMIC_DETERMINISM=FAIL; exit 1; }
          echo P08_R43_SCHEMA_ATOMIC_DETERMINISTIC_DOUBLE_BUILD=PASS
          zip_sha="$(sha256sum "$RUNNER_TEMP/p08-r43-schema-a.zip" | cut -d' ' -f1)"
          php private-p08-bridge/tests/compatibility/r43_schema_atomic_zip.php "$RUNNER_TEMP/p08-r43-bridge-extract" "$RUNNER_TEMP/p08-r43-schema-a.zip" "$BRIDGE_SHA" "$old_manifest" "$TARGET_SHA" "$zip_sha" > "$RUNNER_TEMP/r43-schema-archive-test.log" 2>&1 || { echo P08_R43_SCHEMA_ATOMIC_ARCHIVE_VERIFIER=FAIL; exit 1; }
          grep -qx 'P08_R43_SCHEMA_ATOMIC_DEV_ARCHIVE_GATE=PASS' "$RUNNER_TEMP/r43-schema-archive-test.log"
          echo P08_R43_SCHEMA_ATOMIC_FULL_ZIP_AND_TAMPER_MATRIX=PASS
      - name: Refuse forged prior FULL digest and changed additive migration source
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          old_manifest="$(sha256sum "$RUNNER_TEMP/p08-r43-bridge-extract/FULL_MANIFEST.json" | cut -d' ' -f1)"
          bad_digest="$(printf 'f%.0s' {1..64})"
          if python3 private-p08-bridge/scripts/build_r43_schema_atomic.py --source-full "$RUNNER_TEMP/p08-r43-bridge-extract" --target-runtime private-p08-target --output "$RUNNER_TEMP/r43-rejected.zip" --source-sha "$BRIDGE_SHA" --source-full-sha256 "$bad_digest" --target-sha "$TARGET_SHA" > "$RUNNER_TEMP/r43-bad-full.log" 2>&1; then echo P08_R43_FORGED_FULL_ACCEPTED; exit 1; fi
          test ! -e "$RUNNER_TEMP/r43-rejected.zip"
          mutation='private-p08-target/database/migrations/2026_11_23_000017_create_automation_local_safety_and_rule_versions.php'
          cp "$mutation" "$RUNNER_TEMP/r43-original-migration.php"
          printf '\n// disposable unauthorized migration change\n' >> "$mutation"
          if python3 private-p08-bridge/scripts/build_r43_schema_atomic.py --source-full "$RUNNER_TEMP/p08-r43-bridge-extract" --target-runtime private-p08-target --output "$RUNNER_TEMP/r43-rejected.zip" --source-sha "$BRIDGE_SHA" --source-full-sha256 "$old_manifest" --target-sha "$TARGET_SHA" > "$RUNNER_TEMP/r43-bad-migration.log" 2>&1; then echo P08_R43_CHANGED_SCHEMA_ACCEPTED; exit 1; fi
          test ! -e "$RUNNER_TEMP/r43-rejected.zip"
          cp "$RUNNER_TEMP/r43-original-migration.php" "$mutation"
          echo P08_R43_SCHEMA_ATOMIC_SOURCE_TAMPER_REFUSED=PASS
      - name: Owner authenticated intent and site-user isolated private schema asset intake
        shell: bash
        env:
          P08_R145_ISOLATED: 'YES'
          P08_R43_DISPOSABLE: 'YES'
        run: |
          set -Eeuo pipefail
          set +x
          php -l private-p08-bridge/src/Upgrade/R43OwnerSchemaPreparation.php > "$RUNNER_TEMP/r43-owner-prep-syntax.log" 2>&1 || { echo P08_R43_OWNER_PREP_SYNTAX=FAIL; exit 1; }
          php -l private-p08-bridge/tests/compatibility/r43_owner_schema_preparation.php >> "$RUNNER_TEMP/r43-owner-prep-syntax.log" 2>&1 || { echo P08_R43_OWNER_PREP_TEST_SYNTAX=FAIL; exit 1; }
          php -l private-p08-bridge/src/Upgrade/r43-owner-schema-prepare-worker.php >> "$RUNNER_TEMP/r43-owner-prep-syntax.log" 2>&1 || { echo P08_R43_SCHEMA_CLI_WORKER_SYNTAX=FAIL; exit 1; }
          for mode in good bad; do
            site="$RUNNER_TEMP/p08-r43-site-owner-$mode"
            mkdir -m 700 "$site"
            unzip -q "$RUNNER_TEMP/r43-bridge.zip" -d "$site"
            php private-p08-bridge/tests/compatibility/r43_isolated_installed_transaction.php setup "$site" "$RUNNER_TEMP/p08-r43-target-extract" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/r43-owner-install-$mode.log" 2>&1 || { echo P08_R43_OWNER_INSTALLED_FULL_SETUP=FAIL; exit 1; }
            if ! php private-p08-bridge/tests/compatibility/r43_owner_schema_preparation.php "$mode" "$site" "$RUNNER_TEMP/p08-r43-schema-a.zip" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/r43-owner-prep-$mode.log" 2>&1; then
              safe_reason="$(sed -nE 's/.*(RuntimeException|Error): ([A-Z][A-Z0-9_]{5,120}).*/\2/p' "$RUNNER_TEMP/r43-owner-prep-$mode.log" | head -1 || true)"
              if [[ ! "$safe_reason" =~ ^[A-Z][A-Z0-9_]{5,120}$ ]]; then safe_reason=PRIVATE_FAILURE_UNKNOWN; fi
              echo "P08_R43_OWNER_PREP_FAIL_MODE=$mode"
              echo "P08_R43_OWNER_PREP_FAIL_CODE=$safe_reason"
              exit 1
            fi
            grep -qx "P08_R43_OWNER_SCHEMA_PRIVATE_PREPARATION_$mode=PASS" "$RUNNER_TEMP/r43-owner-prep-$mode.log"
          done
          echo P08_R43_OWNER_SCHEMA_TWO_INSTALLED_OWNER_PREPARATIONS=PASS
      - name: Real prepared Owner isolated APPLY fault rollback and separate-process SIGKILL recovery
        shell: bash
        env:
          P08_R145_ISOLATED: 'YES'
          P08_R43_DISPOSABLE: 'YES'
        run: |
          set -Eeuo pipefail
          set +x
          php -l private-p08-bridge/src/Upgrade/R43IsolatedOwnerSchemaApply.php > "$RUNNER_TEMP/r43-owner-apply-syntax.log" 2>&1 || { echo P08_R43_OWNER_APPLY_SYNTAX=FAIL; exit 1; }
          php -l private-p08-bridge/tests/compatibility/r43_isolated_owner_schema_apply.php >> "$RUNNER_TEMP/r43-owner-apply-syntax.log" 2>&1 || { echo P08_R43_OWNER_APPLY_TEST_SYNTAX=FAIL; exit 1; }
          for case in success fault kill; do
            site="$RUNNER_TEMP/p08-r43-site-owner-apply-$case"
            mkdir -m 700 "$site"
            unzip -q "$RUNNER_TEMP/r43-bridge.zip" -d "$site"
            if ! php private-p08-bridge/tests/compatibility/r43_isolated_installed_transaction.php setup "$site" "$RUNNER_TEMP/p08-r43-target-extract" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/r43-owner-apply-install-$case.log" 2>&1; then echo P08_R43_OWNER_APPLY_INSTALL_REFUSED; exit 1; fi
            if ! php private-p08-bridge/tests/compatibility/r43_owner_schema_preparation.php good "$site" "$RUNNER_TEMP/p08-r43-schema-a.zip" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/r43-owner-apply-prep-$case.log" 2>&1; then echo P08_R43_OWNER_APPLY_PRIVATE_PREP_FAILED; exit 1; fi
            for phase in unconfirmed bad-witness; do
              if ! php private-p08-bridge/tests/compatibility/r43_isolated_owner_schema_apply.php "$phase" "$site" "$RUNNER_TEMP/p08-r43-target-extract" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/r43-owner-apply-$case-$phase.log" 2>&1; then
                safe_reason="$(sed -nE 's/.*(RuntimeException|Error): ([A-Z][A-Z0-9_]{5,120}).*/\2/p' "$RUNNER_TEMP/r43-owner-apply-$case-$phase.log" | head -1 || true)"
                if [[ ! "$safe_reason" =~ ^[A-Z][A-Z0-9_]{5,120}$ ]]; then safe_reason=PRIVATE_FAILURE_UNKNOWN; fi
                echo "P08_R43_OWNER_APPLY_ADMISSION_FAIL=$phase"
                echo "P08_R43_OWNER_APPLY_ADMISSION_REASON=$safe_reason"
                grep -E '^P08_R43_OWNER_APPLY_[A-Z0-9_]+=PASS$' "$RUNNER_TEMP/r43-owner-apply-$case-$phase.log" || true
                if grep -q 'Class .*not found' "$RUNNER_TEMP/r43-owner-apply-$case-$phase.log"; then echo P08_R43_OWNER_APPLY_FAILURE_TYPE=CLASS_NOT_FOUND; fi
                if grep -q 'Fatal error' "$RUNNER_TEMP/r43-owner-apply-$case-$phase.log"; then echo P08_R43_OWNER_APPLY_FAILURE_TYPE=FATAL; fi
                if grep -q 'Uncaught TypeError' "$RUNNER_TEMP/r43-owner-apply-$case-$phase.log"; then echo P08_R43_OWNER_APPLY_FAILURE_TYPE=TYPE_ERROR; fi
                if grep -q 'Uncaught RuntimeException' "$RUNNER_TEMP/r43-owner-apply-$case-$phase.log"; then echo P08_R43_OWNER_APPLY_FAILURE_TYPE=RUNTIME_EXCEPTION; fi
                safe_type="$(sed -nE 's/.*Uncaught ([A-Za-z_]{3,40}):.*/\1/p' "$RUNNER_TEMP/r43-owner-apply-$case-$phase.log" | head -1 || true)"
                if [[ "$safe_type" =~ ^[A-Za-z_]{3,40}$ ]]; then echo "P08_R43_OWNER_APPLY_THROWABLE_TYPE=$safe_type"; fi
                safe_code="$(grep -oE '(R43|P08)_[A-Z][A-Z0-9_]{5,120}' "$RUNNER_TEMP/r43-owner-apply-$case-$phase.log" | head -1 || true)"
                if [[ "$safe_code" =~ ^(R43|P08)_[A-Z][A-Z0-9_]{5,120}$ ]]; then echo "P08_R43_OWNER_APPLY_THROWABLE_CODE=$safe_code"; fi
                exit 1
              fi
            done
            if [[ "$case" == "kill" ]]; then
              set +e
              php private-p08-bridge/tests/compatibility/r43_isolated_owner_schema_apply.php kill "$site" "$RUNNER_TEMP/p08-r43-target-extract" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/r43-owner-apply-kill.log" 2>&1
              killed=$?
              set -e
              if [[ "$killed" -ne 137 ]]; then echo P08_R43_OWNER_APPLY_REAL_SIGKILL_NOT_137; exit 1; fi
              echo P08_R43_OWNER_APPLY_SIGKILL137_ACTUAL_PROCESS=PASS
              phase=recover
            else
              phase="$case"
            fi
            if ! php private-p08-bridge/tests/compatibility/r43_isolated_owner_schema_apply.php "$phase" "$site" "$RUNNER_TEMP/p08-r43-target-extract" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/r43-owner-apply-$case-$phase.log" 2>&1; then
              safe_reason="$(sed -nE 's/.*(RuntimeException|Error): ([A-Z][A-Z0-9_]{5,120}).*/\2/p' "$RUNNER_TEMP/r43-owner-apply-$case-$phase.log" | head -1 || true)"
              if [[ ! "$safe_reason" =~ ^[A-Z][A-Z0-9_]{5,120}$ ]]; then safe_reason=PRIVATE_FAILURE_UNKNOWN; fi
              echo "P08_R43_OWNER_APPLY_FAILURE_CLASS=$safe_reason"
              exit 1
            fi
            if [[ "$case" == "success" ]]; then
              if ! php private-p08-bridge/tests/compatibility/r43_isolated_owner_schema_apply.php replay "$site" "$RUNNER_TEMP/p08-r43-target-extract" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/r43-owner-apply-$case-replay.log" 2>&1; then echo P08_R43_OWNER_APPLY_REPLAY_GATE_FAILED; exit 1; fi
            fi
            phase_upper="$(printf '%s' "$phase" | tr '[:lower:]' '[:upper:]')"
            grep -qx "P08_R43_OWNER_ISOLATED_SCHEMA_$phase_upper=PASS" "$RUNNER_TEMP/r43-owner-apply-$case-$phase.log"
            echo "P08_R43_OWNER_DISPOSABLE_APPLY_CASE_$case=PASS"
          done
          echo P08_R43_OWNER_ISOLATED_APPLY_SUCCESS_FAULT_SIGKILL_RECOVERY=PASS
      - name: New Owner schema HTTP routes and Vue same-page state positive and negative checks
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          for code in app/Http/Controllers/OwnerFutureUpdateController.php routes/web.php src/Upgrade/R43OwnerSchemaPreparation.php src/Upgrade/R43OwnerSchemaPrepareDispatcher.php tests/compatibility/r43_owner_schema_preparation.php; do
            php -l "private-p08-bridge/$code" > "$RUNNER_TEMP/r43-web-syntax.log" 2>&1 || { echo P08_R43_OWNER_SCHEMA_HTTP_PHP_SYNTAX=FAIL; exit 1; }
          done
          echo P08_R43_OWNER_SCHEMA_HTTP_PHP_SYNTAX=PASS
          (cd private-p08-bridge && npm run typecheck > "$RUNNER_TEMP/r43-schema-typecheck.log" 2>&1) || { echo P08_R43_OWNER_SCHEMA_TYPESCRIPT=FAIL; exit 1; }
          echo P08_R43_OWNER_SCHEMA_TYPESCRIPT=PASS
          (cd private-p08-bridge && npx vitest run tests/js/future-update-check-feedback.test.ts tests/js/r43-schema-owner-prepare-page.test.ts > "$RUNNER_TEMP/r43-schema-vue-tests.log" 2>&1) || { echo P08_R43_OWNER_SCHEMA_UI_VITEST=FAIL; exit 1; }
          echo P08_R43_OWNER_SCHEMA_UI_VITEST=PASS
          (cd private-p08-bridge && npm run build > "$RUNNER_TEMP/r43-schema-build.log" 2>&1) || { echo P08_R43_OWNER_SCHEMA_VITE_BUILD=FAIL; exit 1; }
          echo P08_R43_OWNER_SCHEMA_VITE_BUILD=PASS
      - name: Real installed site-user exclusive HTTP gate, native locked snapshot, HTTP503 drain, fault refusals
        shell: bash
        env:
          P08_R145_ISOLATED: 'YES'
          P08_R43_DISPOSABLE: 'YES'
        run: |
          set -Eeuo pipefail
          set +x
          php -l private-p08-bridge/src/Upgrade/R43AppLocalWriteGate.php > "$RUNNER_TEMP/r43-app-local-gate-syntax.log" 2>&1 || { echo P08_R43_APP_GATE_SOURCE_SYNTAX=FAIL; exit 1; }
          php -l private-p08-bridge/tests/compatibility/r43_app_local_write_gate.php >> "$RUNNER_TEMP/r43-app-local-gate-syntax.log" 2>&1 || { echo P08_R43_APP_GATE_FIXTURE_SYNTAX=FAIL; exit 1; }
          echo P08_R43_APP_GATE_PHP_SYNTAX=PASS
          site="$RUNNER_TEMP/p08-r43-site-app-gate"
          mkdir -m 0700 "$site"
          unzip -q "$RUNNER_TEMP/r43-bridge.zip" -d "$site"
          php private-p08-bridge/tests/compatibility/r43_isolated_installed_transaction.php setup "$site" "$RUNNER_TEMP/p08-r43-target-extract" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/r43-app-gate-full-setup.log" 2>&1 || { echo P08_R43_APP_GATE_FULL_OWNER_INSTALL=FAIL; exit 1; }
          php private-p08-bridge/tests/compatibility/r43_app_local_write_gate.php suite "$site" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/r43-app-gate-native-suite.log" 2>&1 || { echo P08_R43_APP_GATE_NATIVE_SUITE=FAIL; exit 1; }
          grep -qx 'P08_R43_APP_GATE_ROOTLESS_HTTP_GATE_AND_NATIVE_BACKUP_STAGE_DONE=PASS' "$RUNNER_TEMP/r43-app-gate-native-suite.log"
          echo P08_R43_APP_GATE_OWNER_SOURCE_NATIVE_BACKUP_AND_NEGATIVES=PASS
          cat > "$RUNNER_TEMP/r43-app-gate-http-prepend.php" <<'PHP'
          <?php
          $_SERVER['HTTPS']='on';
          $_SERVER['SERVER_PORT']='443';
          PHP
          php -d "auto_prepend_file=$RUNNER_TEMP/r43-app-gate-http-prepend.php" -S 127.0.0.1:19377 -t "$site/public" "$site/public/index.php" > "$RUNNER_TEMP/r43-app-gate-http.log" 2>&1 &
          http_pid=$!
          holder_pid=''
          trap 'kill "$http_pid" "$holder_pid" >/dev/null 2>&1 || true' EXIT
          before=000
          for i in $(seq 1 65); do
            before="$(curl -s --noproxy '*' -o /dev/null -w '%{http_code}' -m 2 http://127.0.0.1:19377/up || true)"
            [[ "$before" == 200 ]] && break
            sleep 0.2
          done
          if [[ "$before" != 200 ]]; then echo P08_R43_APP_GATE_HTTP_BASELINE_NOT_200; exit 1; fi
          php private-p08-bridge/tests/compatibility/r43_app_local_write_gate.php hold "$site" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/r43-app-gate-holder.log" 2>&1 &
          holder_pid=$!
          held="$RUNNER_TEMP/r43-app-local-gate-held"
          for i in $(seq 1 55); do
            [[ -f "$held" ]] && break
            if ! kill -0 "$holder_pid" 2>/dev/null; then break; fi
            sleep 0.2
          done
          if [[ ! -f "$held" ]]; then echo P08_R43_APP_GATE_REAL_EXCLUSIVE_NOT_HELD; exit 1; fi
          blocked="$(curl -s --noproxy '*' -o /dev/null -w '%{http_code}' -m 2 http://127.0.0.1:19377/up || true)"
          if [[ "$blocked" != 503 ]]; then echo P08_R43_APP_GATE_HTTP_DURING_EXCLUSIVE_NOT_503; exit 1; fi
          echo P08_R43_APP_GATE_VERSIONED_HTTP_REAL_503_WHILE_EXCLUSIVE=PASS
          wait "$holder_pid" || { echo P08_R43_APP_GATE_HOLDER_EXIT_FAILED; exit 1; }
          holder_pid=''
          after="$(curl -s --noproxy '*' -o /dev/null -w '%{http_code}' -m 2 http://127.0.0.1:19377/up || true)"
          if [[ "$after" != 200 ]]; then echo P08_R43_APP_GATE_HTTP_NOT_RESUMED_AFTER_GATE; exit 1; fi
          echo P08_R43_APP_GATE_HTTP_200_RESUMED_AND_NO_ROOT_SERVICE_CHANGES=PASS
          kill "$http_pid" >/dev/null 2>&1 || true
          trap - EXIT
      - name: Actual non-HTTP shared lock, isolated CLI writer and stable artisan against exclusive Schema gate
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          site="$RUNNER_TEMP/p08-r43-site-app-gate"
          php -l private-p08-bridge/src/Upgrade/R43NonHttpWriterGate.php > "$RUNNER_TEMP/r43-nonhttp-syntax.log" 2>&1 || { echo P08_R43_NONHTTP_SOURCE_SYNTAX=FAIL; exit 1; }
          php -l private-p08-bridge/tests/compatibility/r43_nonhttp_writer_gate.php >> "$RUNNER_TEMP/r43-nonhttp-syntax.log" 2>&1 || { echo P08_R43_NONHTTP_TEST_SYNTAX=FAIL; exit 1; }
          echo P08_R43_NONHTTP_PHP_SYNTAX=PASS
          if [[ ! -f "$site/artisan" || ! -f "$site/routes/console.php" || -e "$site/app/Jobs" ]] ||
             [[ "$(grep -c 'Artisan::command' "$site/routes/console.php")" -ne 1 ]]; then
            echo P08_R43_NONHTTP_UNEXPECTED_LOCAL_SCHEDULER_INVENTORY; exit 1
          fi
          echo P08_R43_NONHTTP_CURRENT_SOURCE_NO_CUSTOM_QUEUE_JOBS_OR_SCHEDULED_TASKS=PASS
          cli="private-p08-bridge/tests/compatibility/r43_nonhttp_writer_gate.php"
          php "$cli" suite "$site" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/r43-nonhttp-suite.log" 2>&1 || { echo P08_R43_NONHTTP_SOURCE_NEGATIVES=FAIL; exit 1; }
          php "$cli" once "$site" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/r43-nonhttp-once.log" 2>&1 || { echo P08_R43_NONHTTP_ONCE=FAIL; exit 1; }
          echo P08_R43_NONHTTP_REAL_SITE_USER_SHARED_WRITE=PASS
          php "$cli" hold "$site" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/r43-nonhttp-hold.log" 2>&1 &
          shared_pid=$!
          exclusive_pid=''
          trap 'kill "$shared_pid" "$exclusive_pid" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 55); do
            [[ -f "$RUNNER_TEMP/r43-nonhttp-shared-held" ]] && break
            kill -0 "$shared_pid" 2>/dev/null || break
            sleep 0.2
          done
          if [[ ! -f "$RUNNER_TEMP/r43-nonhttp-shared-held" ]]; then echo P08_R43_NONHTTP_CLI_SHARED_NOT_HELD; exit 1; fi
          set +e
          php -r 'require $argv[1]."/src/Support/Autoload.php"; (new VF\AdOps\Upgrade\R43AppLocalWriteGate())->withExclusiveGate($argv[1],$argv[2],static fn($fd)=>true);' "$site" "$BRIDGE_SHA" > "$RUNNER_TEMP/r43-nonhttp-ex-deny.log" 2>&1
          code=$?
          set -e
          if [[ "$code" -eq 0 ]] || ! grep -q 'R43_APP_GATE_ACTIVE_HTTP_OR_WRITER' "$RUNNER_TEMP/r43-nonhttp-ex-deny.log"; then echo P08_R43_NONHTTP_SHARED_DID_NOT_BLOCK_EX=FAIL; exit 1; fi
          echo P08_R43_NONHTTP_RUNNING_CLI_WRITER_BLOCKS_SCHEMA_EXCLUSIVE=PASS
          wait "$shared_pid" || { echo P08_R43_NONHTTP_SHARED_PROCESS_FAILED; exit 1; }
          shared_pid=''
          rm -f -- "$site/storage/app/private/adops/upgrade/r43-nonhttp-test-write.txt"
          php private-p08-bridge/tests/compatibility/r43_app_local_write_gate.php hold "$site" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/r43-nonhttp-exclusive-hold.log" 2>&1 &
          exclusive_pid=$!
          for i in $(seq 1 55); do
            [[ -f "$RUNNER_TEMP/r43-app-local-gate-held" ]] && break
            kill -0 "$exclusive_pid" 2>/dev/null || break
            sleep 0.2
          done
          if [[ ! -f "$RUNNER_TEMP/r43-app-local-gate-held" ]]; then echo P08_R43_NONHTTP_SCHEMA_EXCLUSIVE_NOT_HELD; exit 1; fi
          php "$cli" deny "$site" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/r43-nonhttp-deny.log" 2>&1 || { echo P08_R43_NONHTTP_RUNNING_SCHEMA_ALLOWED_CLI_WRITER=FAIL; exit 1; }
          echo P08_R43_NONHTTP_SCHEMA_EXCLUSIVE_REFUSES_NEW_CLI_WRITE=PASS
          set +e
          php "$site/artisan" --version > "$RUNNER_TEMP/r43-nonhttp-artisan-deny.log" 2>&1
          artisan_code=$?
          set -e
          if [[ "$artisan_code" -eq 0 ]] || ! grep -q 'R27_STABLE_CLI_MAINTENANCE_OR_LAYOUT_INVALID' "$RUNNER_TEMP/r43-nonhttp-artisan-deny.log"; then echo P08_R43_NONHTTP_STABLE_ARTISAN_BYPASSED_EXCLUSIVE=FAIL; exit 1; fi
          echo P08_R43_NONHTTP_STABLE_ARTISAN_BLOCKED_BY_SCHEMA_EXCLUSIVE=PASS
          wait "$exclusive_pid" || { echo P08_R43_NONHTTP_EXCLUSIVE_PROCESS_FAILED; exit 1; }
          exclusive_pid=''
          php "$site/artisan" --version > "$RUNNER_TEMP/r43-nonhttp-artisan-ready.log" 2>&1 || { echo P08_R43_NONHTTP_STABLE_ARTISAN_NOT_RESUMED=FAIL; exit 1; }
          php "$cli" once "$site" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/r43-nonhttp-once-after.log" 2>&1 || { echo P08_R43_NONHTTP_NEW_CLI_NOT_RESUMED=FAIL; exit 1; }
          echo P08_R43_NONHTTP_CLI_AND_STABLE_ARTISAN_RESUME_AFTER_GATE=PASS
          trap - EXIT
      - name: Prove an unregistered SQLite writer bypasses advisory flock and no Schema APPLY becomes authorized
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          site="$RUNNER_TEMP/p08-r43-site-app-gate"
          php -l private-p08-bridge/src/Upgrade/R43UnmanagedWriterAdmission.php > "$RUNNER_TEMP/r43-unknown-writer-syntax.log" 2>&1 || { echo P08_R43_EXTERNAL_SOURCE_SYNTAX=FAIL; exit 1; }
          php -l private-p08-bridge/tests/compatibility/r43_unmanaged_writer_admission.php >> "$RUNNER_TEMP/r43-unknown-writer-syntax.log" 2>&1 || { echo P08_R43_EXTERNAL_FIXTURE_SYNTAX=FAIL; exit 1; }
          echo P08_R43_EXTERNAL_PHP_SYNTAX=PASS
          check="private-p08-bridge/tests/compatibility/r43_unmanaged_writer_admission.php"
          php "$check" audit "$site" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/r43-unmanaged-audit.log" 2>&1 || { echo P08_R43_EXTERNAL_ADMISSION_AUDIT=FAIL; exit 1; }
          grep -qx 'P08_R43_UNMANAGED_WRITER_PINNED_LOCAL_SOURCE_BUT_EXTERNAL_WRITERS_BLOCKED=PASS' "$RUNNER_TEMP/r43-unmanaged-audit.log"
          grep -qx 'P08_R43_UNMANAGED_WRITER_REFUSED_R43_EXTERNAL_WRITER_ATTESTATION_REQUIRED=PASS' "$RUNNER_TEMP/r43-unmanaged-audit.log"
          echo P08_R43_EXTERNAL_WRITERS_CONSERVATIVELY_BLOCKED=PASS
          php "$check" negative "$site" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/r43-unmanaged-tamper.log" 2>&1 || { echo P08_R43_EXTERNAL_CHANGED_JOB_INVENTORY=FAIL; exit 1; }
          grep -qx 'P08_R43_UNMANAGED_WRITER_REFUSED_R43_LOCAL_UNREGISTERED_JOB_SOURCE=PASS' "$RUNNER_TEMP/r43-unmanaged-tamper.log"
          grep -qx 'P08_R43_UNMANAGED_WRITER_REFUSED_R43_LOCAL_ENTRYPOINT_UNTRUSTED=PASS' "$RUNNER_TEMP/r43-unmanaged-tamper.log"
          echo P08_R43_EXTERNAL_NEW_JOB_AND_CLI_TAMPER_REFUSED=PASS
          hold="$RUNNER_TEMP/r43-app-local-gate-held"
          if [[ -e "$hold" ]]; then echo P08_R43_EXTERNAL_TEST_HOLD_STALE; exit 1; fi
          php private-p08-bridge/tests/compatibility/r43_app_local_write_gate.php hold "$site" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/r43-unmanaged-holder.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 55); do
            [[ -f "$hold" ]] && break
            kill -0 "$pid" 2>/dev/null || break
            sleep 0.2
          done
          if [[ ! -f "$hold" ]]; then echo P08_R43_EXTERNAL_EXCLUSIVE_NOT_HELD; exit 1; fi
          php "$check" noncooperative-write "$site" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/r43-unmanaged-bypass.log" 2>&1 || { echo P08_R43_EXTERNAL_SYNTHETIC_DB_WRITE_TEST=FAIL; exit 1; }
          grep -qx 'P08_R43_UNMANAGED_WRITER_REAL_NONCOOPERATIVE_SQLITE_DB_WRITE_WHILE_APP_EXCLUSIVE_HELD=PASS' "$RUNNER_TEMP/r43-unmanaged-bypass.log"
          echo P08_R43_EXTERNAL_REAL_DB_WRITER_CAN_BYPASS_APP_FLOCK=PASS
          wait "$pid" || { echo P08_R43_EXTERNAL_EXCLUSIVE_HOLDER=FAIL; exit 1; }
          pid=''
          trap - EXIT
          php "$check" verify-write "$site" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/r43-unmanaged-cleanup.log" 2>&1 || { echo P08_R43_EXTERNAL_DB_READBACK=FAIL; exit 1; }
          grep -qx 'P08_R43_UNMANAGED_WRITER_ACTUAL_EXTERNAL_WRITE_CONFIRMS_APP_FLOCK_NOT_UNIVERSAL=PASS' "$RUNNER_TEMP/r43-unmanaged-cleanup.log"
          grep -qx 'P08_R43_UNMANAGED_WRITER_BUSINESS_SCHEMA_AND_POINTER_UNCHANGED_AFTER_DEMONSTRATION=PASS' "$RUNNER_TEMP/r43-unmanaged-cleanup.log"
          test ! -e "$hold"
          echo P08_R43_EXTERNAL_NO_FALSE_SCHEMA_APPLY_READINESS_AND_CLEANUP=PASS
      - name: SQLite database EXCLUSIVE transaction blocks independent unregistered DB writer and refuses a busy client
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          for p in src/Upgrade/R43SqliteWriterIsolationProbe.php tests/compatibility/r43_sqlite_writer_isolation_probe.php; do
            php -l "private-p08-bridge/$p" > "$RUNNER_TEMP/r43-db-fence-lint.log" 2>&1 || { echo P08_R43_DB_FENCE_PHP_SYNTAX=FAIL; exit 1; }
          done
          echo P08_R43_DB_FENCE_PHP_SYNTAX=PASS
          site="$RUNNER_TEMP/p08-r43-site-app-gate"
          t="private-p08-bridge/tests/compatibility/r43_sqlite_writer_isolation_probe.php"
          php "$t" negative "$site" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/r43-db-fence-negative.log" 2>&1 || { echo P08_R43_DB_FENCE_BAD_FD_REFUSED=FAIL; exit 1; }
          grep -qx 'P08_R43_SQLITE_DB_FENCE_NO_SCHEMA_APPLY_ADMISSION=PASS' "$RUNNER_TEMP/r43-db-fence-negative.log"
          php "$t" fence-hold "$site" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/r43-db-fence-hold.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 65); do
            [[ -f "$RUNNER_TEMP/r43-sqlite-db-fence-held" ]] && break
            kill -0 "$pid" 2>/dev/null || break
            sleep 0.2
          done
          [[ -f "$RUNNER_TEMP/r43-sqlite-db-fence-held" ]] || { echo P08_R43_DB_FENCE_NOT_HELD=FAIL; exit 1; }
          php "$t" outside-denied "$site" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/r43-db-fence-blocked.log" 2>&1 || { echo P08_R43_DB_FENCE_UNMANAGED_WRITER_WAS_NOT_BLOCKED=FAIL; exit 1; }
          grep -qx 'P08_R43_SQLITE_DB_FENCE_REAL_INDEPENDENT_NONCOOPERATIVE_PDO_WRITE_SQLITE_BUSY=PASS' "$RUNNER_TEMP/r43-db-fence-blocked.log"
          echo P08_R43_DB_FENCE_UNMANAGED_SQLITE_WRITER_DENIED_BY_DATABASE=PASS
          wait "$pid" || { echo P08_R43_DB_FENCE_HOLDER_FAILED=FAIL; exit 1; }
          pid=''
          trap - EXIT
          php "$t" after-release "$site" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/r43-db-fence-after.log" 2>&1 || { echo P08_R43_DB_FENCE_RELEASE_PARITY=FAIL; exit 1; }
          grep -qx 'P08_R43_SQLITE_DB_FENCE_ORIGINAL_OWNER_SCHEMA_AND_POINTER_PRESERVED=PASS' "$RUNNER_TEMP/r43-db-fence-after.log"
          echo P08_R43_DB_FENCE_AFTER_ROLLBACK_EXTERNAL_SQLITE_WRITE_RESUMES=PASS
          php "$t" external-hold "$site" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/r43-db-fence-external.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 65); do
            [[ -f "$RUNNER_TEMP/r43-sqlite-db-external-held" ]] && break
            kill -0 "$pid" 2>/dev/null || break
            sleep 0.2
          done
          [[ -f "$RUNNER_TEMP/r43-sqlite-db-external-held" ]] || { echo P08_R43_DB_FENCE_EXTERNAL_NOT_HELD=FAIL; exit 1; }
          php "$t" busy-denied "$site" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/r43-db-fence-busy.log" 2>&1 || { echo P08_R43_DB_FENCE_BUSY_WRITER_ADMITTED=FAIL; exit 1; }
          grep -qx 'P08_R43_SQLITE_DB_FENCE_EXTERNAL_ACTIVE_SQL_WRITE_BLOCKS_FENCE_PREPARE=PASS' "$RUNNER_TEMP/r43-db-fence-busy.log"
          echo P08_R43_DB_FENCE_ACTIVE_SQLITE_WRITER_FAIL_CLOSED=PASS
          wait "$pid" || { echo P08_R43_DB_FENCE_EXTERNAL_EXIT_FAILED=FAIL; exit 1; }
          pid=''
          trap - EXIT
          php "$t" idle-proof "$site" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/r43-db-fence-idle.log" 2>&1 || { echo P08_R43_DB_FENCE_FINAL_EXCLUSIVE_PROBE=FAIL; exit 1; }
          test ! -e "$RUNNER_TEMP/r43-sqlite-db-fence-held"
          test ! -e "$RUNNER_TEMP/r43-sqlite-db-external-held"
          echo P08_R43_DB_FENCE_ROLLBACK_ONLY_NO_SCHEMA_APPLY=PASS
      - name: Verify standalone test cannot execute outside registered disposable machine
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          if env -u P08_R43_DISPOSABLE_SCHEMA -u P08_ISOLATED_INSTALL_TEST php private-p08-bridge/tests/compatibility/r43_schema_atomic_zip.php >/dev/null 2>&1; then echo P08_R43_NON_ISOLATED_ACCEPTED; exit 1; fi
          echo P08_R43_SCHEMA_ATOMIC_TEST_ISOLATION=PASS
      - name: Clean private sources, all development ZIPs and synthetic negative fixtures
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- private-p08-bridge private-p08-target gov-proof
          rm -rf -- "$RUNNER_TEMP/p08-r43-target-extract" "$RUNNER_TEMP/p08-r43-bridge-extract"
          rm -rf -- "$RUNNER_TEMP/p08-r43-site-owner-good" "$RUNNER_TEMP/p08-r43-site-owner-bad"
          rm -rf -- "$RUNNER_TEMP/p08-r43-site-owner-apply-success" "$RUNNER_TEMP/p08-r43-site-owner-apply-fault" "$RUNNER_TEMP/p08-r43-site-owner-apply-kill"
          rm -rf -- "$RUNNER_TEMP/p08-r43-site-owner-http" "$RUNNER_TEMP/p08-r43-owner-https-stack" "$RUNNER_TEMP/p08-r43-owner-https-wire"
          rm -rf -- "$RUNNER_TEMP/p08-r43-site-app-gate"
          rm -f -- "$RUNNER_TEMP/r43-nonhttp-shared-held"
          rm -f -- "$RUNNER_TEMP/r43-app-local-gate-held" "$RUNNER_TEMP"/r43-unmanaged-*.log "$RUNNER_TEMP/r43-unknown-writer-syntax.log"
          rm -f -- "$RUNNER_TEMP/r43-app-local-gate-held" "$RUNNER_TEMP/r43-app-gate-http-prepend.php"
          rm -f -- "$RUNNER_TEMP/p08-r43-owner-https-events.log" "$RUNNER_TEMP/r43-owner-browser-run.log"
          rm -f -- "$RUNNER_TEMP"/p08-r43-schema-*.zip "$RUNNER_TEMP"/r43-*.zip "$RUNNER_TEMP"/r43-*.log "$RUNNER_TEMP"/r43-*.php
          test ! -e private-p08-bridge && test ! -e private-p08-target && test ! -e gov-proof && test ! -e "$RUNNER_TEMP/p08-r43-schema-a.zip"
          rm -f -- "$RUNNER_TEMP/r43-sqlite-db-fence-held" "$RUNNER_TEMP/r43-sqlite-db-external-held" "$RUNNER_TEMP"/r43-db-fence-*.log
          echo P08_R43_SCHEMA_ATOMIC_EPHEMERAL_CLEANUP=PASS
  native-installed-schema-transaction:
    needs: identity-preflight
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/p08-r43-db-level-writer-isolation-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        engine: [mysql, mariadb]
    services:
      db:
        image: ${{ matrix.engine == 'mysql' && 'mysql:8.4' || 'mariadb:11.8' }}
        env:
          MYSQL_ROOT_PASSWORD: isolated-p08-r43-native-db
          MYSQL_ROOT_HOST: '%'
          MARIADB_ROOT_PASSWORD: isolated-p08-r43-native-db
          MARIADB_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="sh -c 'mariadb-admin ping --silent || mysqladmin ping --silent'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=25
    env:
      GITHUB_ACTIONS: 'true'
      P08_ISOLATED_INSTALL_TEST: 'YES'
      P08_R43_DISPOSABLE_SCHEMA: 'YES'
      P08_R43_NATIVE_ENGINE: ${{ matrix.engine }}
      P08_R43_NATIVE_DB_PASSWORD: isolated-p08-r43-native-db
    steps:
      - name: Checkout exact v017 bridge candidate (private transient checkout)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.BRIDGE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-p08-bridge
      - name: Checkout exact v018 integrated target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-p08-target
      - name: Checkout current GOV-doc delivery contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: gov-proof
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_mysql, pdo_sqlite, sqlite3, zip, mbstring, intl, bcmath, dom, fileinfo, posix
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native SQL backup client on disposable runner
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          if command -v mysqldump >/dev/null && command -v mysql >/dev/null; then
            echo P08_R43_NATIVE_PREINSTALLED_MYSQL_CLIENT=PASS
          elif command -v mariadb-dump >/dev/null && command -v mariadb >/dev/null; then
            echo P08_R43_NATIVE_PREINSTALLED_MARIADB_CLIENT=PASS
          else
            timeout 75s sudo apt-get -o Acquire::Retries=0 update -qq > "$RUNNER_TEMP/p08-r43-apt.log" 2>&1 || { echo P08_R43_NATIVE_CLIENT_APT_NETWORK=BLOCKED; exit 1; }
            timeout 85s sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mariadb-client >> "$RUNNER_TEMP/p08-r43-apt.log" 2>&1 || { echo P08_R43_NATIVE_CLIENT_INSTALL=FAIL; exit 1; }
          fi
          (command -v mariadb-dump || command -v mysqldump) >/dev/null || { echo P08_R43_NATIVE_DUMP_CLIENT_MISSING; exit 1; }
          (command -v mariadb || command -v mysql) >/dev/null || { echo P08_R43_NATIVE_RESTORE_CLIENT_MISSING; exit 1; }
          echo P08_R43_NATIVE_BACKUP_CLIENT_PRESENT=PASS
      - name: Exact source, vendor and Vite build + real source-locked dev Clean FULL archives
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C private-p08-bridge rev-parse HEAD)" = "$BRIDGE_SHA"
          test "$(git -C private-p08-target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(cat private-p08-bridge/VERSION)" = "$BRIDGE_VERSION"
          test "$(cat private-p08-target/VERSION)" = "$TARGET_VERSION"
          php -l private-p08-bridge/tests/compatibility/r43_isolated_installed_native_transaction.php > "$RUNNER_TEMP/p08-r43-native-lint.log" 2>&1 || { echo P08_R43_NATIVE_DRIVER_TEST_SYNTAX=FAIL; exit 1; }
          php -l private-p08-bridge/src/Upgrade/R43IsolatedSchemaTransaction.php >> "$RUNNER_TEMP/p08-r43-native-lint.log" 2>&1 || { echo P08_R43_NATIVE_TRANSACTION_SYNTAX=FAIL; exit 1; }
          for d in private-p08-bridge private-p08-target; do
            mkdir -p "$d/bootstrap/cache" "$d/storage/framework/cache/data" "$d/storage/framework/sessions" "$d/storage/framework/views" "$d/storage/logs"
            (cd "$d" && composer install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/p08-r43-$d-composer.log" 2>&1) || { echo P08_R43_NATIVE_LOCKED_COMPOSER=FAIL; exit 1; }
            (cd "$d" && npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-r43-$d-npm.log" 2>&1 && npm run build > "$RUNNER_TEMP/p08-r43-$d-vite.log" 2>&1) || { echo P08_R43_NATIVE_LOCKED_VITE=FAIL; exit 1; }
          done
          python3 private-p08-bridge/scripts/build_full.py --source private-p08-bridge --output "$RUNNER_TEMP/p08-r43-bridge.zip" --version "$BRIDGE_VERSION" --source-sha "$BRIDGE_SHA" --governance-root gov-proof > "$RUNNER_TEMP/p08-r43-bridge-builder.log" 2>&1 || { echo P08_R43_NATIVE_BRIDGE_FULL=FAIL; exit 1; }
          python3 private-p08-target/scripts/build_full.py --source private-p08-target --output "$RUNNER_TEMP/p08-r43-target.zip" --version "$TARGET_VERSION" --source-sha "$TARGET_SHA" --governance-root gov-proof > "$RUNNER_TEMP/p08-r43-target-builder.log" 2>&1 || { echo P08_R43_NATIVE_TARGET_FULL=FAIL; exit 1; }
          mkdir -m 700 "$RUNNER_TEMP/p08-r43-target-extract"
          unzip -q "$RUNNER_TEMP/p08-r43-target.zip" -d "$RUNNER_TEMP/p08-r43-target-extract"
          echo P08_R43_NATIVE_TWO_CANONICAL_DEV_FULLS=PASS
      - name: Set up separate empty synthetic native databases and 5 independent real Owner FULL installations
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          php -r '$c=new PDO("mysql:host=127.0.0.1;port=3306", "root", getenv("P08_R43_NATIVE_DB_PASSWORD"), [PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]); foreach(["native","restored"] as $prefix) foreach(["success","fault","kill","pre","uncommitted"] as $mode) {$n="p08_ci_r43_".$prefix."_".$mode; $c->exec("CREATE DATABASE ".$n." CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci");}' > "$RUNNER_TEMP/p08-r43-db-create.log" 2>&1 || { echo P08_R43_NATIVE_FIXTURE_DB_CREATE=FAIL; exit 1; }
          for mode in success fault kill pre uncommitted; do
            site="$RUNNER_TEMP/p08-r43-site-${{ matrix.engine }}-$mode"
            mkdir -m 700 "$site"
            unzip -q "$RUNNER_TEMP/p08-r43-bridge.zip" -d "$site"
            php private-p08-bridge/tests/compatibility/r43_isolated_installed_native_transaction.php setup "$site" "$RUNNER_TEMP/p08-r43-target-extract" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/p08-r43-native-setup-$mode.log" 2>&1 || { echo P08_R43_NATIVE_OWNER_INSTALL=FAIL_$mode; exit 1; }
            grep -q '^P08_R43_NATIVE_REAL_FULL_017_OWNER_FIRST_INSTALL=PASS' "$RUNNER_TEMP/p08-r43-native-setup-$mode.log"
          done
          for mode in success fault kill pre uncommitted; do
            grep -qx 'P08_R43_NATIVE_NONEMPTY_LANDING_ASSET_AUTOMATION_SEEDED=PASS' "$RUNNER_TEMP/p08-r43-native-setup-$mode.log" || { echo P08_R43_NATIVE_BUSINESS_SEED_MISSING; exit 1; }
          done
          for mode in success fault kill pre uncommitted; do
            grep -qx 'P08_R43_NATIVE_WRITER_FENCE_MYSQL_MARIADB_REMAINS_BLOCKED=PASS' "$RUNNER_TEMP/p08-r43-native-setup-$mode.log" || { echo P08_R43_NATIVE_FALSE_SQLITE_FENCE=FAIL; exit 1; }
          done
          echo P08_R43_NATIVE_FIVE_REAL_SQLITE_FENCE_REFUSALS=PASS engine=${{ matrix.engine }}
          echo P08_R43_NATIVE_FIVE_REAL_FULL_OWNER_INSTALLS=PASS engine=${{ matrix.engine }}
      - name: Actual installed native Owner schema + source-pointer upgrade success and independent scratch restore
