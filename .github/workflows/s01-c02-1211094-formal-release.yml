name: S01 C02 1211094 Formal Release
on:
  push:
    branches: [task/s01-c02-1211094-formal-publish-20261011]
permissions:
  contents: read
  actions: read
jobs:
  formal-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_VERSION: '1.21.1094'
      TARGET_SHA: 'c9df5265407726ad8aec28bbdb4e374de4496d76'
      MAIN_SHA: '5ccda4d2253cd6ceeb0986b06f41b0a1ab57ef1c'
      TARGET_TREE: '757e2cc851a97349752ebcae919f7871d19415bf'
      RELEASE_TAG: 'v1.21.1094'
      EXPECTED_BYTES: '3564094'
      EXPECTED_SHA: 'dbf081c2a15baac634552e5f0ada2ba2ca7bfbe2206b649c8c6e1b6bdcf49372'
      EXPECTED_FILES: '989'
      EXPECTED_FINGERPRINT: 'f79fa6258d204580c2b2a9f84a016f17f28234453aca1055bee08139fb71497d'
      RUN_ID: '38127619127'
      ARTIFACT_ID: '11698065144'
    steps:
      - name: Checkout public scoped release harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Checkout exact machine-proven private product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: c9df5265407726ad8aec28bbdb4e374de4496d76
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Perform verified formal release and remote asset readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          bash -n runner/lanes/s01-c02-1211094/formal-release.sh
          bash runner/lanes/s01-c02-1211094/formal-release.sh
      - name: Upload only public-safe release receipt (never binary)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-1211094-formal-${{ github.run_id }}
          path: |
            proof-formal/stage.txt
            proof-formal/build.json
            proof-formal/gate-readback.json
            proof-formal/promoted-main.json
            proof-formal/release.json
            proof-formal/FINAL_FORMAL_RELEASE.json
          if-no-files-found: warn
          retention-days: 30
