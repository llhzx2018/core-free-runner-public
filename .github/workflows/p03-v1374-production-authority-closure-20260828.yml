name: P03 V1.37.4 Production Authority Closure
on:
  push:
    paths:
      - '.github/workflows/p03-v1374-production-authority-closure-20260828.yml'
jobs:
  close:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Close P03 production authority only
        env:
          TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone "https://x-access-token:${TOKEN}@github.com/llhzx2018/vf-forge.git" p03 >/dev/null 2>&1
          cd p03
          git checkout closure/p03-v1374-production-authority-20260828
          test "$(git rev-parse HEAD)" = "216944156c94c743f3e13635a6e4a0ac7ef5a313"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('VF_PROJECT.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['project_id']=='P03'
          assert d['production_version']=='1.37.3'
          assert d['candidate_version']=='1.37.4'
          assert d['schema_version']==30
          d['status']='V1.37.4 PRODUCTION / COMMON BASELINE V2 CURRENT'
          d['project_status']='PRODUCTION_CURRENT'
          d['lifecycle']='PRODUCTION'
          d['production_version']='1.37.4'
          d['product_identity']['installed_production_version']='1.37.4'
          d['product_identity']['release_tag']='v1.37.4'
          d['product_identity']['release_asset']='VF_Forge_V1.37.4_UPDATE.zip'
          d['product_identity']['meaning']='V1.37.4 is current Production Truth. Common Product Baseline V2 is live; release/tag/update channel remain bound to the machine-verified source.'
          pt=d['production_truth']
          pt['installed_version']='1.37.4'
          pt['owner_real_use_status']='RUNNING / OWNER VERIFIED / SCREENSHOT 2026-08-28'
          pt['remaining_issue']='NONE'
          pt['production_upgrade_to_1_37_3']='HISTORICAL_COMPLETE'
          pt['production_write']='OWNER_EXECUTED / AGENT_NO'
          pt['production_upgrade_to_1_37_4']='OWNER_COMPLETED / VERIFIED'
          pt['evidence']='Owner screenshot: Settings > 更新与维护 shows 当前版本 V1.37.4, Schema 30, core-updates, 当前没有可安装的正式更新; footer V1.37.4.'
          v=d['verification']
          v['final_exact']='PASS'
          v['formal_release']='PUBLISHED / v1.37.4'
          v['core_updates']='PUBLISHED / 1.37.3 -> 1.37.4'
          v['production_write']='OWNER_EXECUTED / AGENT_NO'
          v['publication_run_id']=33124512145
          v['release_id']=378169091
          v['release_tag']='v1.37.4'
          v['release_asset_id']=532974500
          v['release_asset_sha256']='2605364ccb380fe9244be3fd2d4d071ec242141ae71b04c40bbea35278b4ea93'
          r=d['release']
          r['installed_production_version']='1.37.4'
          r['release_ready']='PUBLISHED / OWNER UPGRADED / CURRENT'
          r['release_tag']='v1.37.4'
          r['asset_name']='VF_Forge_V1.37.4_UPDATE.zip'
          r['core_updates']='PUBLISHED / CURRENT'
          r['owner_upgrade_authorized']=True
          r['production_write']=False
          r['owner_upgrade_completed']=True
          r['owner_upgrade_verified_at']='2026-08-28'
          d['git_alignment']['mode']='PRODUCTION CURRENT'
          d['git_alignment']['production_main_version']='1.37.4'
          d['current_phase']='V1.37.4 PRODUCTION CURRENT'
          d['current_verdict']='PRODUCTION CURRENT / OWNER VERIFIED'
          d['production_real_use_pass']='V1.37.4 RUNNING / OWNER VERIFIED'
          d['runtime_change']='COMMON PRODUCT BASELINE V2 PRODUCTION CURRENT'
          d['version_change']='1.37.3 -> 1.37.4 PRODUCTION COMPLETE'
          d['production_write']='OWNER_EXECUTED / AGENT_NO'
          d['user_engineering_action']=1
          d['next_action']='NONE / P03 PRODUCTION CLOSED'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python3 -m json.tool VF_PROJECT.json >/dev/null
          test "$(git diff --name-only)" = "VF_PROJECT.json"
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VF_PROJECT.json
          git commit -m "authority(P03): close V1.37.4 production truth"
          git push origin HEAD:closure/p03-v1374-production-authority-20260828
          echo P03_V1374_PRODUCTION_AUTHORITY_WRITE=PASS
