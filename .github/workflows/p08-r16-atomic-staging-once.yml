name: P08 R16 code-only Atomic staged package real negative proof (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p08-r16-atomic-staging-once.yml'
permissions:
  contents: read
jobs:
  exact-source:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      P08_ISOLATED_INSTALL_TEST: YES
      P08_SOURCE_SHA: c9567c073fb0cceb3eb5b24589d83163d95baa46
    steps:
      - name: Transient checkout of exact private P08 branch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-adops
          ref: c9567c073fb0cceb3eb5b24589d83163d95baa46
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-product
      - name: Prove source, candidate version, and no installed data
        run: |
          set -euo pipefail
          test "$(git -C private-product rev-parse HEAD)" = "$P08_SOURCE_SHA"
          test "$(cat private-product/VERSION)" = "0.1.0"
          test ! -e private-product/.env
          echo "P08_R16_EXACT_PRIVATE_SOURCE=$P08_SOURCE_SHA"
      - name: PHP 8.4 + Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_mysql, pdo_sqlite, sqlite3, zip, mbstring, intl, bcmath, dom, fileinfo
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Runtime install and R16 fail-closed source, package builder tests
        working-directory: private-product
        run: |
          set -euo pipefail
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          composer install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/p08-composer-r16.log" 2>&1
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-npm-r16.log" 2>&1
          npm run build
          npm run typecheck
          python3 scripts/check_stack_contract.py --phase full
          python3 -m unittest discover -s tests -p test_stack_contract.py -q
          python3 -m unittest discover -s tests -p test_atomic_builder.py -q
          php -l src/Upgrade/AtomicPackageStage.php
          php -l tests/test_atomic_package_staging_e2e.php
          echo P08_R16_STATIC_AND_PYTHON_ATOMIC_TESTS=PASS
      - name: Create exact-source FULL then install synthetic SQLite Owner
        working-directory: private-product
        run: |
          set -euo pipefail
          python3 scripts/build_full.py --source "$PWD" --output "$RUNNER_TEMP/p08-r16-full.zip" --version 0.1.0 --source-sha "$P08_SOURCE_SHA"
          mkdir "$RUNNER_TEMP/p08-r16-extracted"
          unzip -qq "$RUNNER_TEMP/p08-r16-full.zip" -d "$RUNNER_TEMP/p08-r16-extracted"
          php tests/test_extracted_full_sqlite_e2e.php "$RUNNER_TEMP/p08-r16-extracted"
          echo P08_R16_ACTUAL_EXTRACTED_OWNER_INSTALL=PASS
      - name: Verify real Atomic ZIP stage and negative safeguards against installed FULL
        working-directory: private-product
        run: |
          set -euo pipefail
          php tests/test_atomic_package_staging_e2e.php "$RUNNER_TEMP/p08-r16-extracted"
          echo P08_R16_ATOMIC_STAGE_ACTUAL_INSTALL=PASS
      - name: Remove private source and synthetic files
        if: always()
        run: |
          rm -rf private-product "$RUNNER_TEMP/p08-r16-extracted"
          rm -f "$RUNNER_TEMP/p08-r16-full.zip" "$RUNNER_TEMP/p08-composer-r16.log" "$RUNNER_TEMP/p08-npm-r16.log" "$RUNNER_TEMP"/p08-r16-atomic-*.zip
