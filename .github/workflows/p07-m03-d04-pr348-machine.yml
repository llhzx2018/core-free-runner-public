name: P07-M03-D04 PR348 exact-source and unchanged-main baseline machine gate
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-m03-d04-pr348-machine.yml'
permissions:
  contents: read
jobs:
  p07-m03-d04-sqlite:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout approved public evidence harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact baseline P07 main transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 905599e8ca6ac6fd766856c35301328388b3eb81
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: .p07-baseline
          fetch-depth: 1
      - name: Checkout exact private P07 PR348 source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: fc346593199b98198819a609103d774f3145e7e9
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: .p07-private-exact
          fetch-depth: 1
      - name: Compare 212 existing tests to identical baseline; run 8 new SQLite cases
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-baseline rev-parse HEAD)" = 905599e8ca6ac6fd766856c35301328388b3eb81
          test "$(git -C .p07-private-exact rev-parse HEAD)" = fc346593199b98198819a609103d774f3145e7e9
          run_suite() {
            local directory="$1" destination="$2" mode="$3"
            (cd "$directory"; P07_RESULT_FILE="$destination" P07_SUITE_MODE="$mode" python3 -B - <<'PY'
          import io
          import json
          import os
          import unittest
          modules = [
              "tests.test_server_migration",
              "tests.test_server_migration_pull",
              "tests.test_p07_m03_site_overview_paging",
              "tests.test_backup_frontend",
              "tests.test_restore_new",
          ]
          if os.environ["P07_SUITE_MODE"] == "new":
              modules = ["tests.test_p07_m03_dynamic_sqlite_scope"]
          suite = unittest.defaultTestLoader.loadTestsFromNames(modules)
          result = unittest.TextTestRunner(stream=io.StringIO(), verbosity=0).run(suite)
          output = {
              "count": result.testsRun,
              "failed": sorted(test.id().split(".")[-1] for test, _ in result.failures + result.errors),
          }
          with open(os.environ["P07_RESULT_FILE"], "w", encoding="utf-8") as handle:
              json.dump(output, handle)
          PY
            )
          }
          run_suite .p07-baseline "$RUNNER_TEMP/p07-baseline-results.json" existing
          run_suite .p07-private-exact "$RUNNER_TEMP/p07-candidate-results.json" existing
          run_suite .p07-private-exact "$RUNNER_TEMP/p07-new-results.json" new
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          base = json.loads((root / "p07-baseline-results.json").read_text())
          curr = json.loads((root / "p07-candidate-results.json").read_text())
          new = json.loads((root / "p07-new-results.json").read_text())
          print("P07_M03_PR348_BASELINE_TEST_COUNT=" + str(base["count"]))
          print("P07_M03_PR348_CANDIDATE_EXISTING_COUNT=" + str(curr["count"]))
          print("P07_M03_PR348_NEW_TEST_COUNT=" + str(new["count"]))
          print("P07_M03_PR348_BASELINE_FAILURES=" + ",".join(base["failed"]))
          print("P07_M03_PR348_CANDIDATE_FAILURES=" + ",".join(curr["failed"]))
          print("P07_M03_PR348_NEW_FAILURES=" + ",".join(new["failed"]))
          if (base["count"] != curr["count"]
                  or base["failed"] != curr["failed"]
                  or new["count"] != 8 or new["failed"]):
              print("P07_M03_PR348_REGRESSION_OR_NEW_CASES=FAIL")
              raise SystemExit(1)
          print("P07_M03_PR348_EXACT_SOURCE=fc346593199b98198819a609103d774f3145e7e9")
          print("P07_M03_PR348_NEW_SQLITE_CASES_AND_BASELINE_NO_REGRESSION=PASS")
          print("P07_M03_PR348_REAL_CLOUDPANEL_MIGRATION=NOT_RUN")
          PY
      - name: Remove transient private sources and fixture reports
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- .p07-baseline .p07-private-exact
          rm -f -- "$RUNNER_TEMP/p07-baseline-results.json" "$RUNNER_TEMP/p07-candidate-results.json" "$RUNNER_TEMP/p07-new-results.json"
          test ! -e .p07-private-exact
          test ! -e .p07-baseline
          echo P07_M03_PR348_PRIVATE_SOURCE_CLEANUP=PASS
