name: P07-M03-D04 PR348 exact-source SQLite and backup-restore machine gate
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-m03-d04-pr348-machine.yml'
permissions:
  contents: read
jobs:
  p07-m03-d04-sqlite:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout approved public evidence harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact private P07 PR348 source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: fc346593199b98198819a609103d774f3145e7e9
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: .p07-private-exact
          fetch-depth: 1
      - name: Prove exact source identity and run isolated Python integration tests
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          test -d .p07-private-exact/.git
          test "$(git -C .p07-private-exact rev-parse HEAD)" = "fc346593199b98198819a609103d774f3145e7e9"
          cd .p07-private-exact
          python3 -B - <<'PY'
          import io
          import sys
          import unittest
          modules = [
              "tests.test_p07_m03_dynamic_sqlite_scope",
              "tests.test_server_migration",
              "tests.test_server_migration_pull",
              "tests.test_p07_m03_site_overview_paging",
              "tests.test_backup_frontend",
              "tests.test_restore_new",
          ]
          suite = unittest.defaultTestLoader.loadTestsFromNames(modules)
          report = unittest.TextTestRunner(stream=io.StringIO(), verbosity=0).run(suite)
          print("P07_M03_PR348_EXACT_SOURCE=fc346593199b98198819a609103d774f3145e7e9")
          print("P07_M03_PR348_TEST_COUNT=" + str(report.testsRun))
          if not report.wasSuccessful():
              cases = [test.id().split(".")[-1] for test, _ in report.failures + report.errors]
              print("P07_M03_PR348_FAILED_TESTS=" + ",".join(cases[:24]))
              print("P07_M03_PR348_MACHINE_GATE=FAIL")
              sys.exit(1)
          print("P07_M03_PR348_SQLITE_INVENTORY_BACKUP_RESTORE_MACHINE=PASS")
          print("P07_M03_PR348_REAL_VPS_DB_CUTOVER=NOT_RUN")
          PY
      - name: Remove transient private sources, no artifacts or public source persistence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- .p07-private-exact
          test ! -e .p07-private-exact
          echo P07_M03_PR348_PRIVATE_SOURCE_CLEANUP=PASS
