name: TEMP P07-M05 Native Bootstrap exact-source stage classifier
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p07-m05-native-bootstrap-replay-20261124.yml'
      - '.github/ephemeral/p07-m05-native-bootstrap-replay-20261124.json'
permissions:
  contents: read
jobs:
  p07-m05-bootstrap-replay:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'test/p07-m05-native-bootstrap-replay-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_REPO: 'llhzx2018/vf-server-ops'
      TARGET_VERSION: '0.1.0'
      TARGET_SHA: 'b4b8f193544475df2e9fcbaa02c1159b332209f6'
      TARGET_TREE: '67ff29bfa8ac65448cf038ab03e686f20e854208'
      BASE_SHA: 'fd113376cf8e44c6a3bc00fbe47f34c2a354726a'
      GOV_SHA: '74db859d21b0f93c7c2230d13eae9de8f0fd576a'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout registered public runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact ephemeral lane validation
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B scripts/ephemeral_lane_spec.py validate \
            --spec .github/ephemeral/p07-m05-native-bootstrap-replay-20261124.json \
            > "$RUNNER_TEMP/p07-m03-lane-validate.log"
          python3 -B scripts/ephemeral_lane_spec.py audit-rendered \
            --spec .github/ephemeral/p07-m05-native-bootstrap-replay-20261124.json \
            --input .github/workflows/temp-p07-m05-native-bootstrap-replay-20261124.yml \
            > "$RUNNER_TEMP/p07-m03-lane-audit.json"
          python3 -B - "$RUNNER_TEMP/p07-m03-lane-audit.json" "$TARGET_SHA" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding='utf-8') as f: result=json.load(f)
          assert result.get('status')=='PASS' and result.get('target_sha')==sys.argv[2]
          print('P07_M05_EPHEMERAL_SPEC=PASS')
          PY
          echo P07_M05_NO_CLOUDPANEL_NO_MIGRATION=YES
      - name: Transient exact private product source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: 'llhzx2018/vf-server-ops'
          ref: 'b4b8f193544475df2e9fcbaa02c1159b332209f6'
          path: .p07-private
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - name: Transient pinned governance source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 74db859d21b0f93c7c2230d13eae9de8f0fd576a
          path: .gov-private
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Verify exact source bytes and no writes
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          P="$GITHUB_WORKSPACE/.p07-private"
          G="$GITHUB_WORKSPACE/.gov-private"
          test "$(git -C "$P" rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C "$P" rev-parse 'HEAD^{tree}')" = "$TARGET_TREE"
          test "$(git -C "$G" rev-parse HEAD)" = "$GOV_SHA"
          test "$(cat "$P/VERSION")" = "$TARGET_VERSION"
          git -C "$P" cat-file -e "$BASE_SHA^{commit}"
          test -f "$P/lib/migration_safe_batch_io.py"
          test -f "$P/lib/m05_owner_trial_guard.py"
          test -f "$P/tests/test_p07_m05_isolated_module.py"
          test -f "$G/governance/agent/code_architecture_lint.py"
          echo P07_M05_EXACT_PRIVATE_SOURCE_AND_GOV=PASS
      - name: Parse precise M03 Python source without bytecode
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          python3 -B - "$GITHUB_WORKSPACE/.p07-private" <<'PY'
          import ast,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          paths=('lib/m05_owner_trial_guard.py','lib/m05_passive_image_helpers.py',
                 'scripts/build_p07_m05_bundle.py',
                 'tests/test_p07_m05_isolated_module.py',
                 '.github/checks/architecture_gate.py')
          for path in paths:
              ast.parse((root/path).read_text(encoding='utf-8'),filename=path)
          print('P07_M05_PYTHON_SYNTAX='+str(len(paths)))
          PY
      - name: GOV-DOC architecture and source naming diff gate
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          P="$GITHUB_WORKSPACE/.p07-private"
          G="$GITHUB_WORKSPACE/.gov-private"
          if ! (cd "$P" && python3 -B .github/checks/architecture_gate.py \
              --manifest .github/checks/code_architecture.json \
              --gov-root "$G" \
              --base-sha "$BASE_SHA" --head-sha "$TARGET_SHA" \
              --git-root "$P") > "$RUNNER_TEMP/p07-m03-architecture.log" 2>&1; then
            python3 -B - "$RUNNER_TEMP/p07-m03-architecture.log" <<'PY'
          import pathlib,re,sys
          text=pathlib.Path(sys.argv[1]).read_text(encoding='utf-8',errors='replace')
          match=re.search(r'PROJECT_ARCHITECTURE=BLOCKED:([A-Z][A-Z0-9_]*)',text)
          print('P07_M05_ARCHITECTURE_BLOCK_CLASS='+(
              match.group(1) if match else 'UNCLASSIFIED'))
          PY
            echo P07_M05_ARCHITECTURE_AND_NAMING_GATE=FAIL
            exit 37
          fi
          grep -q '^PROJECT_ARCHITECTURE=STRUCTURAL_PASS' "$RUNNER_TEMP/p07-m03-architecture.log"
          echo P07_M05_ARCHITECTURE_AND_NAMING_GATE=PASS
          echo P07_M05_UNIT_RUN_ONLY_NO_SERVER_OR_SQL_WRITES=PASS
      - name: Replay native bootstrap stages against exact M05 product source
        shell: bash
        env:
          TEST_GOV_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          P="$GITHUB_WORKSPACE/.p07-private"
          export PYTHONDONTWRITEBYTECODE=1
          python3 -B -c 'import yaml'
          python3 -B "$GITHUB_WORKSPACE/.github/ephemeral/p07-m05-native-bootstrap-replay-20261124.py" "$P"
      - name: Always wipe transient private and governance sources
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- "$GITHUB_WORKSPACE/.p07-private" "$GITHUB_WORKSPACE/.gov-private"
          rm -f -- "$RUNNER_TEMP"/p07-m03-*.log "$RUNNER_TEMP"/p07-m03-*.json
          echo P07_M05_TRANSIENT_PRIVATE_WORKSPACE_CLEANUP=PASS
