name: S01 Theme SEO167 exact formal release
on:
  push:
    branches: [task/s01-render-verify-20261022]
    paths: ['.github/workflows/s01-seo167-formal.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.167
  TARGET_SHA: 7157611969d6a7aeb0784778ac048713015dc540
  TARGET_TREE: d283bb1cf8c7a64fab0a6a620edd9190060265ac
  CANDIDATE_SHA: 4ed20edecb66d5c928ce8baa07c0d8eb355cc736
  PACKAGE_HASH: 5525d09da700e2051b1ca0521eaabdca21a11077a22c0de04a6de29514ee2a34
  PACKAGE_BYTES: 1971274
jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 7157611969d6a7aeb0784778ac048713015dc540
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Verify merged tree exact native-tested candidate
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git -C target rev-parse "$CANDIDATE_SHA^{tree}")" = "$TARGET_TREE"
          test "$(gh api repos/$TARGET_REPO/commits/main --jq .sha)" = "$TARGET_SHA"
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/39719767105 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/39718361157 --jq .conclusion)" = success
          python3 control/lanes/s01-render166/package.py
          echo "$PACKAGE_HASH  provider/vf-tools-theme_V1.35.167.zip" | sha256sum -c
          test "$(stat -c %s provider/vf-tools-theme_V1.35.167.zip)" = "$PACKAGE_BYTES"
          echo THEME167_EXACT_MERGED_TESTED_TREE_PASS
      - name: Formal GitHub Release candidate only
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.35.167 --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create v1.35.167 provider/vf-tools-theme_V1.35.167.zip --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Theme V1.35.167' --notes '技术 SEO 后台“重新检查已保存配置”真正只读；保留原有保存、权限与并发保护。新增 WordPress 最小 AJAX Action Bootstrap 登记。独立PHP零写入、Chromium交互、真实WordPress AJAX、165/166→167 原生升级回退重复安装及受保护数据验收通过。M3U8 保持1.25.94，Production由Owner手工升级；手机暂缓。' --latest
          fi
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/v1.35.167 --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh release view v1.35.167 --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - name: Remote release ZIP byte identity
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download v1.35.167 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.167.zip --dir remote
          cmp provider/vf-tools-theme_V1.35.167.zip remote/vf-tools-theme_V1.35.167.zip
          echo "$PACKAGE_HASH  remote/vf-tools-theme_V1.35.167.zip" | sha256sum -c
          test "$(stat -c %s remote/vf-tools-theme_V1.35.167.zip)" = "$PACKAGE_BYTES"
          gh release view v1.35.167 --repo "$TARGET_REPO" --json url,publishedAt,tagName > proof/formal-release.json
          echo THEME167_FORMAL_REMOTE_ASSET_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-seo167-formal
          path: proof/
          retention-days: 14
      - name: Cleanup
        if: always()
        run: rm -rf target provider remote
