name: TEMP P08 PHP 8.5 clean FULL compatibility only
on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/p08-php85-full-once.yml
permissions:
  contents: read
concurrency:
  group: p08-php85-full-once-723d9b0
  cancel-in-progress: false
jobs:
  compatibility:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.actor == 'llhzx2018' &&
      github.triggering_actor == 'llhzx2018' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/p08-php85-full-20261128'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_REPO: llhzx2018/vf-adops
      TARGET_VERSION: '0.1.18'
      TARGET_SHA: 723d9b0b7db58528c3d40ff6c15f931cd4e025ad
      TARGET_TREE: 30d6746cf60165d7fbe99adb0f3051ed1db5ee06
      GOV_SHA: cf6d84ab4efcaee16566a56744d7a363692dfab4
    steps:
      - name: Verify one-time hosted scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(id -u)" != 0
          test ! -e private-p08
          test ! -e private-gov-p08
      - name: Verified existing hosted PHP compatibility mechanism
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.5'
          tools: composer:2.11.3
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_mysql, dom, xml, curl, zip, openssl, sodium, pcntl, posix, intl, bcmath
          coverage: none
      - name: Exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
      - name: Transient exact private source without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 723d9b0b7db58528c3d40ff6c15f931cd4e025ad
          path: private-p08
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
      - name: Transient canonical authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: cf6d84ab4efcaee16566a56744d7a363692dfab4
          path: private-gov-p08
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
      - name: Exact frozen runtime and original isolated three-engine FULL
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          repo="$GITHUB_WORKSPACE/private-p08"
          gov="$GITHUB_WORKSPACE/private-gov-p08"
          test ! -L "$repo"
          test ! -L "$gov"
          chmod 700 "$repo" "$gov"
          test "$(git -C "$repo" rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C "$repo" rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(cat "$repo/VERSION")" = "$TARGET_VERSION"
          test "$(git -C "$gov" rev-parse HEAD)" = "$GOV_SHA"
          test -z "$(git -C "$repo" status --porcelain)"
          test ! -e "$repo/.env"
          test "$(sha256sum "$repo/composer.lock" | cut -d ' ' -f1)" = 296d8a84c18ad455bb1b8ba5aee6d4aeba5a4fe65318b411858f25c4466e8dfb
          test "$(sha256sum "$repo/pnpm-lock.yaml" | cut -d ' ' -f1)" = f1c202dded939747999517db3169a5688f067ef6b2b1e6b9625cf2cf89d8b42e
          echo P08_PHP85_EXACT_SOURCE=PASS
          work="$(mktemp -d "$repo/vf-install-3db-XXXXXXXX")"
          export HOME="$work/home" TMPDIR="$work/tmp" COMPOSER_HOME="$work/home/composer" COMPOSER_CACHE_DIR="$work/home/composer-cache"
          export npm_config_cache="$work/home/npm-cache" npm_config_userconfig="$work/home/npmrc" npm_config_globalconfig="$work/home/npm-globalrc" npm_config_fetch_retries=0
          export npm_config_registry=https://registry.npmjs.org GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          export CI=true GITHUB_ACTIONS=true P08_ISOLATED_INSTALL_TEST=YES PYTHONDONTWRITEBYTECODE=1
          mkdir -p "$HOME" "$TMPDIR" "$work/tools" "$work/logs"
          export PATH="$work/tools/node_modules/.bin:$PATH"
          # No source output, credentials, private ZIP, DB or logs may be retained publicly.
          phase() {
            local id="$1" network="$2" limit="$3" rc=0 attempt
            shift 3
            local -a extra_env=()
            local key
            for key in P08_INSTALL_TEST_FULL_SOURCE P08_TEST_DB_HOST P08_TEST_DB_DRIVER P08_TEST_DB_CLEAN P08_TEST_DB_DIRTY P08_TEST_DB_USER P08_TEST_DB_PASSWORD; do
              if [[ -v "$key" ]]; then extra_env+=("$key=${!key}"); fi
            done
            for attempt in 1 2; do
              if timeout --kill-after=15s "$limit" env -i PATH="$PATH" HOME="$HOME" TMPDIR="$TMPDIR" LANG=C.UTF-8 \
                 CI=true GITHUB_ACTIONS=true P08_ISOLATED_INSTALL_TEST=YES PYTHONDONTWRITEBYTECODE=1 \
                 COMPOSER_HOME="$COMPOSER_HOME" COMPOSER_CACHE_DIR="$COMPOSER_CACHE_DIR" COMPOSER_NO_INTERACTION=1 \
                 npm_config_cache="$npm_config_cache" npm_config_userconfig="$npm_config_userconfig" \
                 npm_config_globalconfig="$npm_config_globalconfig" npm_config_fetch_retries=0 npm_config_registry=https://registry.npmjs.org \
                 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 \
                 TARGET_VERSION="$TARGET_VERSION" TARGET_SHA="$TARGET_SHA" TARGET_TREE="$TARGET_TREE" \
                 P08_PROOF_WORK="$work" P08_PROOF_GOV="$gov" \
                 "${extra_env[@]}" \
                 "$@" >"$work/logs/$id" 2>&1; then
                printf 'P08_PHP85_PHASE=%s:PASS\n' "$id"
                return 0
              else rc=$?; fi
              if [[ "$network" = yes && "$attempt" = 1 ]] &&
                 grep -Eiq 'could not resolve (host|proxy)|temporary failure in name resolution|EAI_AGAIN|ECONNRESET|ETIMEDOUT|connection timed out|operation timed out|connection reset by peer' "$work/logs/$id" &&
                 ! grep -Eiq '401|403|404|certificate|TLS|authentication|authorization|integrity|checksum|security advisories|permission denied|no matching version' "$work/logs/$id"; then
                printf 'P08_PHP85_PHASE_RETRY=%s;WAIT=90\n' "$id"
                sleep 90
              else
                printf 'P08_PHP85_PHASE=%s:FAIL;EXIT=%s\n' "$id" "$rc"
                return "$rc"
              fi
            done
            return "$rc"
          }
          php -r 'exit(PHP_VERSION_ID>=80513 && PHP_VERSION_ID<80600 && count(array_diff(["pdo_mysql","pdo_sqlite","zip","mbstring","dom","xmlwriter","xml","curl","openssl","sodium","pcntl","posix"],array_map("strtolower",get_loaded_extensions())))===0 ? 0:2);'
          test "$(node --version)" = v24.22.3
          composer --no-plugins --no-scripts --no-ansi --version | grep -Eq '^Composer version 2\.11\.3( |$)'
          phase asset_discovery no 60 python3 -B "$gov/governance/agent/test_reuse_growth_gate.py" --gov-root "$gov" --asset-kind dual-php-three-db --asset-repository llhzx2018/vf-adops
          python3 -c 'import json,sys;x=json.load(open(sys.argv[1]));assert x["historical_status"]=="OBSERVED_SCOPED" and x["current_product_pass"]=="NOT_PROVEN" and x["auto_dispatch"] is False' "$work/logs/asset_discovery"
          phase pnpm_bootstrap yes 240 npm install --prefix "$work/tools" --ignore-scripts --no-fund --no-audit pnpm@11.29.0
          test "$(pnpm --version)" = 11.29.0
          echo P08_PHP85_RUNTIME_EXTENSIONS=PASS
          phase guard_clone no 120 git clone --local --no-hardlinks --no-recurse-submodules "$repo" "$work/guard"
          cd "$work/guard"
          phase guard_checkout no 60 git checkout --detach "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          phase dev_composer yes 600 composer install --no-scripts --no-plugins --prefer-dist --no-interaction --no-progress --classmap-authoritative
          phase dev_pnpm yes 600 pnpm install --frozen-lockfile
          phase version_gate no 180 python3 -B "$gov/governance/agent/validate_repository_entry.py" --gov-root "$gov" --web-stack-root "$work/guard"
          python3 -c 'import json,sys;x=json.load(open(sys.argv[1]));assert x["result"]=="VERSION_CHECK_PASS" and x["pnpm_lock_and_runtime"]=="CHECKED"' "$work/logs/version_gate"
          phase original_dev_check no 900 bash scripts/dev_check.sh
          grep -Fxq 'R1_LOCAL_SOURCE_TESTS=PASS' "$work/logs/original_dev_check"
          phase workspace_phpunit no 180 php vendor/bin/phpunit --no-coverage --colors=never --do-not-cache-result --fail-on-empty-test-suite --fail-on-skipped --fail-on-incomplete --fail-on-risky tests/Feature/WorkspaceInertiaTest.php
          phase guard_diff no 30 git diff --exit-code HEAD --
          cd "$repo"
          phase full_clone no 120 git clone --local --no-hardlinks --no-recurse-submodules "$repo" "$work/source"
          cd "$work/source"
          phase full_checkout no 60 git checkout --detach "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          phase full_composer yes 600 composer install --no-dev --no-scripts --no-plugins --prefer-dist --no-interaction --no-progress
          phase platform_lock no 60 composer check-platform-reqs --format=json --lock --no-dev
          phase platform_installed no 60 composer check-platform-reqs --format=json --no-dev
          phase full_pnpm yes 600 pnpm install --frozen-lockfile
          phase vite_assets no 180 pnpm run build
          phase lock_unchanged no 30 git diff --exit-code HEAD --
          export P08_INSTALL_TEST_FULL_SOURCE="$TARGET_SHA"
          export P08_PROOF_WORK="$work" P08_PROOF_GOV="$gov"
          phase clean_full no 420 python3 -B -c '
          import sys,json,os,hashlib
          from pathlib import Path
          source=Path.cwd(); work=Path(os.environ["P08_PROOF_WORK"]); gov=Path(os.environ["P08_PROOF_GOV"])
          sys.path.insert(0,str(source/"scripts"))
          from build_full import verify_canonical_full_contract,write_full
          version=os.environ["TARGET_VERSION"]; sha=os.environ["TARGET_SHA"]; tree=os.environ["TARGET_TREE"]
          archive=work/"p08-dev-full.zip"; scope=work/"prototype-scope.json"
          scope.write_text(json.dumps({"category":"B","scope_source":sha,"scope_tree":tree,"scope_ref":"P08 independent PHP8.5 synthetic FULL compatibility"}))
          verify_canonical_full_contract(source,archive,sha,gov,"resolve")
          receipt=write_full(source,archive,version,sha)
          verify_canonical_full_contract(source,archive,sha,gov,"delivery",ux_baseline=scope,owner_ux_status="PENDING",dev_pending=True)
          assert receipt["sha256"]==hashlib.sha256(archive.read_bytes()).hexdigest()
          print("P08_DEV_FULL_SHA256="+receipt["sha256"])
          '
          grep -E '^P08_DEV_FULL_SHA256=[0-9a-f]{64}$' "$work/logs/clean_full"
          for db in sqlite mysql mariadb; do
            site="$work/$db"
            mkdir -m 700 "$site"
            phase extract_$db no 120 python3 -B -c '
          import json,os,stat,sys,zipfile
          from pathlib import Path
          archive=Path(sys.argv[1]); site=Path(sys.argv[2])
          with zipfile.ZipFile(archive) as z:
              members=z.infolist(); names=[x.filename for x in members]
              assert 10<len(names)<=25001 and len(set(names))==len(names)
              assert all(x.filename and not x.filename.startswith("/") and "\\" not in x.filename and all(p not in ("",".","..") for p in x.filename.split("/")) and stat.S_ISREG(x.external_attr>>16) and 0<=x.file_size<=75*1024*1024 for x in members)
              assert sum(x.file_size for x in members)<=366*1024*1024 and "FULL_MANIFEST.json" in names
              assert not any(x.startswith(("tests/","scripts/","docs/")) or x==".env" for x in names)
              z.extractall(site)
          m=json.loads((site/"FULL_MANIFEST.json").read_text())
          assert m["source_sha"]==os.environ["TARGET_SHA"] and m["target_version"]==os.environ["TARGET_VERSION"] and m["type"]=="CLEAN_FULL_ONLY" and m["data_included"] is False and m["owner_setup_completed"] is False
          ' "$work/p08-dev-full.zip" "$site"
            cd "$site"
            if [[ "$db" = sqlite ]]; then
              phase sqlite_original no 240 php "$repo/tests/test_install_sqlite_e2e.php"
              for marker in R101_REAL_FIRST_INSTALL_COMPLETE_SCHEMA_SQLITE P08_TEST_DOMAIN_LANLIHONG_FIRST_INSTALL_APP_URL_AND_MARKER P08_SQLITE_ONE_OWNER_FIRST_INSTALL_AND_REVISION P08_INSTALL_VALID_TOKEN_PRIVATE_CONNECTED P08_SQLITE_MISSING_PROOF_DIRTY_DB_REINSTALL_REFUSALS; do grep -Fxq "$marker=PASS" "$work/logs/sqlite_original"; done
            else
              if [[ "$db" = mysql ]]; then image=mysql:8.4; prefix=MYSQL; else image=mariadb:11.8; prefix=MARIADB; fi
              name="p08-php85-$GITHUB_RUN_ID"
              export P08_TEST_DB_HOST=127.0.0.1 P08_TEST_DB_DRIVER="$db" P08_TEST_DB_CLEAN=p08_ci_clean P08_TEST_DB_DIRTY=p08_ci_dirty P08_TEST_DB_USER=root
              export P08_TEST_DB_PASSWORD="synthetic-$(openssl rand -hex 18)"
              # Docker is the existing hosted VM service, not a new runner.
              phase pull_$db yes 360 docker pull "$image"
              if docker inspect "$name" >/dev/null 2>&1; then exit 2; fi
              phase docker_$db no 45 docker run --pull=never --rm -d --name "$name" --label "p08-owner-proof=$GITHUB_RUN_ID" --network bridge --publish 127.0.0.1:3306:3306 --memory 1536m --memory-swap 1536m --cpus 2 --pids-limit 256 -e "$prefix"_ROOT_PASSWORD="$P08_TEST_DB_PASSWORD" -e "$prefix"_ROOT_HOST=% "$image"
              phase container_inspect_$db no 30 docker inspect "$name"
              python3 -c 'import json,sys;x=json.load(open(sys.argv[1]))[0];c=x["HostConfig"];assert x["Config"]["Labels"]["p08-owner-proof"]==sys.argv[2] and c["PortBindings"]=={"3306/tcp":[{"HostIp":"127.0.0.1","HostPort":"3306"}]} and c["NetworkMode"]=="bridge" and not c["Privileged"] and not c["Binds"] and c["Memory"]==1536*1024*1024 and c["MemorySwap"]==c["Memory"] and c["NanoCpus"]==2000000000 and c["PidsLimit"]==256 and all(m["Type"]=="volume" for m in x["Mounts"])' "$work/logs/container_inspect_$db" "$GITHUB_RUN_ID"
              ready=0
              for attempt in $(seq 1 50); do
                if php -r 'try{$p=new PDO("mysql:host=127.0.0.1;port=3306",getenv("P08_TEST_DB_USER"),getenv("P08_TEST_DB_PASSWORD"));$v=strtolower($p->query("SELECT VERSION()")->fetchColumn());exit(getenv("P08_TEST_DB_DRIVER")==="mysql"?(str_starts_with($v,"8.4.")&&!str_contains($v,"mariadb")?0:2):(str_starts_with($v,"11.8.")&&str_contains($v,"mariadb")?0:2));}catch(Throwable $e){exit(2);}' >"$work/logs/db_ready" 2>&1; then ready=1; break; fi
                sleep 2
              done
              test "$ready" = 1
              phase fixtures_$db no 90 php "$repo/tests/fixtures/create_ci_databases.php"
              grep -Fxq P08_ISOLATED_DB_FIXTURES_CREATED=2 "$work/logs/fixtures_$db"
              phase original_$db no 240 php "$repo/tests/test_install_mysql_e2e.php"
              grep -Fxq "R101_REAL_FIRST_INSTALL_COMPLETE_SCHEMA_$(echo "$db" | tr a-z A-Z)=PASS" "$work/logs/original_$db"
              for marker in P08_ISOLATED_FIRST_INSTALL_MYSQL_FAMILY P08_LANDING_ACTION_MYSQL_FAMILY_CREATE_AND_ROLLBACK P08_INSTALL_INVALID_TOKEN_SKIP_NO_SECRET P08_DIRTY_DATABASE_REFUSAL P08_PASSWORD_HASH_AND_ONE_OWNER P08_REPEAT_INSTALL_BLOCKED; do grep -Fxq "$marker=PASS" "$work/logs/original_$db"; done
              test "$(docker inspect --format '{{index .Config.Labels "p08-owner-proof"}}' "$name")" = "$GITHUB_RUN_ID"
              phase remove_$db no 45 docker rm -f -v "$name"
              if docker inspect "$name" >/dev/null 2>&1; then exit 2; fi
              unset P08_TEST_DB_PASSWORD
            fi
            printf 'P08_PHP85_ORIGINAL_FIRST_INSTALL=%s:PASS\n' "$db"
          done
          test "$(git -C "$repo" rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C "$repo" rev-parse HEAD^{tree})" = "$TARGET_TREE"
          git -C "$repo" diff --quiet HEAD --
          echo P08_PHP85_THREE_DB_FULL=PASS
      - name: Always erase private source, logs, clean FULL and synthetic DB
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          name="p08-php85-$GITHUB_RUN_ID"
          if docker inspect "$name" >/dev/null 2>&1; then
            test "$(docker inspect --format '{{index .Config.Labels "p08-owner-proof"}}' "$name")" = "$GITHUB_RUN_ID"
            docker rm -f -v "$name" >/dev/null
          fi
          for dir in private-p08 private-gov-p08; do
            path="$GITHUB_WORKSPACE/$dir"
            test ! -L "$path"
            if test -e "$path"; then
              test -d "$path"
              test "$(stat -c %u "$path")" = "$(id -u)"
              rm -rf -- "$path"
            fi
            test ! -e "$path"
          done
          echo TRANSIENT_PRIVATE_CHECKOUT_CLEANUP=PASS
