name: P01 V2.47.132 Production Postman Readback

on:
  push:
    branches:
      - test-p01-v247132-production-postman-readback-20260930b
    paths:
      - '.github/workflows/temp-p01-v247132-production-postman-readback.yml'

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe public Production Postman row and icon asset
        shell: bash
        run: |
          set -Eeuo pipefail
          PAGE=/tmp/postman-page.html
          ASSET=/tmp/postman-asset.bin
          curl -L -sS --max-time 20 -D /tmp/page-headers.txt -o "$PAGE" 'https://start.kewaro.com/start.php?q=Postman'
          python3 - <<'PY'
          import re, html as h
          html=open('/tmp/postman-page.html',encoding='utf-8',errors='replace').read()
          m=re.search(r'<article\b[^>]*data-asset-row="619"[^>]*>.*?</article>',html,re.S|re.I)
          if not m:
              print('POSTMAN_ROW_FOUND=NO')
          else:
              row=m.group(0)
              print('POSTMAN_ROW_FOUND=YES')
              status=re.search(r'data-icon-cache-status="([^"]*)"',row,re.I)
              print('POSTMAN_ROW_STATUS='+(status.group(1) if status else ''))
              img=re.search(r'<img\b[^>]*src="([^"]+)"',row,re.I)
              print('POSTMAN_ROW_IMG='+(h.unescape(img.group(1)) if img else ''))
              txt=re.search(r'<span class="vf-asset-icon"[^>]*>\s*<span>(.*?)</span>',row,re.S|re.I)
              print('POSTMAN_ROW_INITIAL='+(re.sub(r'<[^>]+>','',txt.group(1)).strip() if txt else ''))
          PY

          code=$(curl -L -sS --max-time 20 -D /tmp/asset-headers.txt -o "$ASSET" -w '%{http_code}' 'https://start.kewaro.com/api.php?action=icon_asset&id=619')
          echo "POSTMAN_ASSET_HTTP=$code"
          grep -iE '^(content-type|content-length|etag|cache-control):' /tmp/asset-headers.txt || true
          echo "POSTMAN_ASSET_BYTES=$(stat -c %s "$ASSET")"
          echo "POSTMAN_ASSET_SHA256=$(sha256sum "$ASSET" | awk '{print $1}')"
          file "$ASSET" || true

          curl -L -sS --max-time 20 -o /tmp/provider.bin 'https://a.favicon.im/www.postman.com?throw-error-on-404=true'
          echo "POSTMAN_PROVIDER_BYTES=$(stat -c %s /tmp/provider.bin)"
          echo "POSTMAN_PROVIDER_SHA256=$(sha256sum /tmp/provider.bin | awk '{print $1}')"
          file /tmp/provider.bin || true
          if cmp -s "$ASSET" /tmp/provider.bin; then
            echo POSTMAN_PRODUCTION_EQUALS_CURRENT_PROVIDER=YES
          else
            echo POSTMAN_PRODUCTION_EQUALS_CURRENT_PROVIDER=NO
          fi
          echo P01_V247132_POSTMAN_PRODUCTION_READBACK=PASS
