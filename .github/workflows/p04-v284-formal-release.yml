name: P04 V2.8.4 Formal Release
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p04-v284-formal-release.yml'
      - 'requests/p04-v284-formal-release.txt'
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      SOURCE_SHA: 165fd09f591dddbf6c5e1337734fcd31b09a47ae
      FULL_BYTES: 575136
      FULL_SHA: 9b4683c6ffe35a2860a9f0f1febb7b62acc24335404080b805cc8bba56c77f2f
      UPDATE_BYTES: 1243266
      UPDATE_SHA: a1776cd99bbcd8c8402621af6c3e21b52f35ca5a37b29521a25575008d821eda
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Checkout exact V2.8.4
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, fileinfo, sodium, zip, curl, mbstring
      - name: Publish exact V2.8.4
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' < VERSION)" = '2.8.4'
          test "$(gh api repos/llhzx2018/vf-infra/branches/main --jq .commit.sha)" = "$SOURCE_SHA"
          ! gh release view v2.8.4 -R llhzx2018/vf-infra >/dev/null 2>&1
          ! gh api repos/llhzx2018/vf-infra/git/ref/tags/v2.8.4 >/dev/null 2>&1
          R="$RUNNER_TEMP/runtime"; O="$RUNNER_TEMP/update"
          python3 scripts/build-release-tree.py "$R"
          python3 - "$R" "$RUNNER_TEMP/VF_Infra_V2.8.4_FULL.zip" <<'PY'
          import pathlib,sys,zipfile
          root=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9,strict_timestamps=True) as z:
            for p in sorted(x for x in root.rglob('*') if x.is_file()):
              i=zipfile.ZipInfo(p.relative_to(root).as_posix(),date_time=(1980,1,1,0,0,0)); i.compress_type=zipfile.ZIP_DEFLATED; i.create_system=3; i.external_attr=(0o100644<<16); z.writestr(i,p.read_bytes())
          PY
          python3 scripts/build-v284-update-release.py --target-runtime "$R" --output "$O"
          cp "$O/VF_Infra_V2.8.4_UPDATE.zip" "$RUNNER_TEMP/VF_Infra_V2.8.4_UPDATE.zip"
          test "$(stat -c %s "$RUNNER_TEMP/VF_Infra_V2.8.4_FULL.zip")" = "$FULL_BYTES"
          test "$(sha256sum "$RUNNER_TEMP/VF_Infra_V2.8.4_FULL.zip"|awk '{print $1}')" = "$FULL_SHA"
          test "$(stat -c %s "$RUNNER_TEMP/VF_Infra_V2.8.4_UPDATE.zip")" = "$UPDATE_BYTES"
          test "$(sha256sum "$RUNNER_TEMP/VF_Infra_V2.8.4_UPDATE.zip"|awk '{print $1}')" = "$UPDATE_SHA"
          php "$O/repair-v2.8.4.php" --self-test | grep -F 'ATOMIC_SELF_TEST_PASS target=2.8.4 schema=14'
          gh release create v2.8.4 "$RUNNER_TEMP/VF_Infra_V2.8.4_FULL.zip#VF Infra V2.8.4 FULL" "$RUNNER_TEMP/VF_Infra_V2.8.4_UPDATE.zip#VF Infra V2.8.4 UPDATE" -R llhzx2018/vf-infra --target "$SOURCE_SHA" --title 'VF Infra V2.8.4' --notes-file docs/operations/package/RELEASE_NOTES.md
          mkdir -p "$RUNNER_TEMP/readback" evidence
          gh release download v2.8.4 -R llhzx2018/vf-infra --dir "$RUNNER_TEMP/readback" --pattern 'VF_Infra_V2.8.4_*.zip'
          gh api repos/llhzx2018/vf-infra/releases/tags/v2.8.4 > evidence/release.json
          gh api repos/llhzx2018/vf-infra/git/ref/tags/v2.8.4 > evidence/tag.json
          test "$(jq -r .object.sha evidence/tag.json)" = "$SOURCE_SHA"
          test "$(sha256sum "$RUNNER_TEMP/readback/VF_Infra_V2.8.4_FULL.zip"|awk '{print $1}')" = "$FULL_SHA"
          test "$(sha256sum "$RUNNER_TEMP/readback/VF_Infra_V2.8.4_UPDATE.zip"|awk '{print $1}')" = "$UPDATE_SHA"
          echo 'P04_V284_FORMAL_RELEASE=PASS'
          echo "RELEASE_ID=$(jq -r .id evidence/release.json)"
          jq -r '.assets[]|"ASSET_ID="+(.id|tostring)+" NAME="+.name+" BYTES="+(.size|tostring)' evidence/release.json
          echo "TAG_SOURCE=$SOURCE_SHA"
          echo "FULL_SHA256=$FULL_SHA"
          echo "UPDATE_SHA256=$UPDATE_SHA"
          echo 'PRODUCTION_WRITE=0'
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: P04-V2.8.4-FORMAL-RELEASE-EVIDENCE
          path: evidence/
          retention-days: 30
