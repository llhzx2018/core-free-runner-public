      - name: Official-source W4 SQLite bridge and five real SIGKILL points
        working-directory: vf-library
        shell: bash
        env:
          P02_W3_SYNTHETIC_ONLY: '1'
          P02_W4_SYNTHETIC_ONLY: '1'
