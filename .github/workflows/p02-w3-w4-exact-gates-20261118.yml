# Temporary registered Public Runner proof; no public source, fixtures or private artifacts.
name: P02 W3 W4 exact-source isolated 3DB integration
on:
  pull_request:
    paths:
      - '.github/workflows/p02-w3-w4-exact-gates-20261118.yml'
      - 'proof/p02-w3-w4-exact-gates-20261118.json'
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-library
  TARGET_VERSION: '2.5.133'
  TARGET_SHA: '05ad4d15369bb6aa86d13ef2d245fd55d27cbd35'
concurrency:
  group: p02-w3-w4-exact-gates-20261118
  cancel-in-progress: false
jobs:
  native-three-engine:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p02-w3-w4-exact-gates-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: p02_w3_disposable_only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: p02_w3_mysql
        ports: ['33306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=25
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: p02_w3_disposable_only
          MARIADB_ROOT_HOST: '%'
          MARIADB_DATABASE: p02_w3_mariadb
        ports: ['33307:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=25
    steps:
      - name: Checkout public-safe registered harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: ${{ github.event.pull_request.head.sha }}
          path: runner-lane
          persist-credentials: false
          fetch-depth: 1
      - name: Audit target-owned identity before private checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 runner-lane/scripts/ephemeral_lane_spec.py audit-rendered \
            --spec runner-lane/proof/p02-w3-w4-exact-gates-20261118.json \
            --input runner-lane/.github/workflows/p02-w3-w4-exact-gates-20261118.yml >/dev/null
          test "$TARGET_SHA" = "05ad4d15369bb6aa86d13ef2d245fd55d27cbd35"
          echo P02_W3_W4_LANE_IDENTITY=PASS
      - name: Transient exact-source private P02 checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.TARGET_SHA }}
          path: vf-library
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify cloned exact source and clean lifecycle
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C vf-library rev-parse HEAD)" = "$TARGET_SHA"
          test "$(cat vf-library/VERSION)" = "$TARGET_VERSION"
          test "$TARGET_REPO" = "llhzx2018/vf-library"
          echo P02_EXACT_PRIVATE_SOURCE_PIN=PASS
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native 3DB PHP, Composer and real Vue
        shell: bash
        working-directory: vf-library
        run: |
          set -Eeuo pipefail
          set +x
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php-cli php-sqlite3 php-mysql php-mbstring php-xml php-curl php-zip composer python3-venv sqlite3 >/dev/null
          php -r 'exit(PHP_VERSION_ID>=80300 && extension_loaded("pdo_sqlite") && extension_loaded("pdo_mysql") ? 0 : 1);'
          composer --working-dir=modern/laravel install --no-dev --no-scripts --no-plugins --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/p02-composer.log" 2>&1 || { echo P02_LARAVEL_DEPENDENCIES=FAIL; exit 1; }
          npm ci --prefix modern/inertia-page --no-audit --no-fund > "$RUNNER_TEMP/p02-npm.log" 2>&1 || { echo P02_NPM_INSTALL=FAIL; exit 1; }
          npm run build --prefix modern/inertia-page > "$RUNNER_TEMP/p02-vue.log" 2>&1 || { echo P02_VUE_BUILD=FAIL; exit 1; }
          test -s modern/laravel/vendor/autoload.php
          test -s public/assets/w2d/inertia-material.js
          echo P02_NATIVE_PHP_LARAVEL_VUE_BUILD=PASS
      - name: Real SQLite 2401 clean install and browser HTTP ownership
        id: sqlite_proof
        continue-on-error: true
        working-directory: vf-library
        shell: bash
        env:
          P02_W3_SYNTHETIC_ONLY: '1'
          P02_W3_ENGINE: sqlite
          P02_W3_TRUE_2401_CLI: '1'
          P02_W3_VENDOR_AUTOLOAD: ${{ github.workspace }}/vf-library/modern/laravel/vendor/autoload.php
        run: |
          set -Eeuo pipefail
          set +x
          python3 -B scripts/p02_w3_source_gate.py > "$RUNNER_TEMP/p02-source.log" 2>&1 || { echo P02_W3_SOURCE_CONTRACT=FAIL; exit 1; }
          php tests/integration/p02_w3_cloudpanel_fresh_install.php > "$RUNNER_TEMP/p02-sqlite.log" 2>&1 || {
            code=$?
            echo P02_W3_REAL_SQLITE_INSTALL_EXIT_CODE="$code"
            grep -Eo "P02_W3_INSTALLED_BACKUP_SQLITE_FAIL_PHASE=[0-9]+( CAPTURE=[A-Z0-9_]+)?" "$RUNNER_TEMP/p02-sqlite.log" | head -1 || true
            # Diagnostic-only test-driver instrumentation, never product source
            # or a machine PASS. Prints a bounded synthetic error reason only.
            python3 - <<'PY'
          from pathlib import Path
          f=Path("tests/integration/p02_w3_cloudpanel_fresh_install.php")
          s=f.read_text()
          old="}catch(Throwable $error){\n    $failure="
          new="""}catch(Throwable $error){
              $reason=$error->getMessage();
              if(preg_match('/^[A-Za-z0-9 _.:(),-]{1,130}$/D',$reason)===1)
                  fwrite(STDERR,'P02_W3_SYNTHETIC_DEBUG_REASON='.$reason.PHP_EOL);
              else fwrite(STDERR,'P02_W3_SYNTHETIC_DEBUG_CLASS='.get_class($error).PHP_EOL);
              $failure="""
          assert s.count(old)==1
          f.write_text(s.replace(old,new))
          PY
            php tests/integration/p02_w3_cloudpanel_fresh_install.php > "$RUNNER_TEMP/p02-sqlite-diagnostic.log" 2>&1 || true
            grep -Eo '^P02_W3_SYNTHETIC_DEBUG_(REASON|CLASS)=[A-Za-z0-9 _.:(),-]{1,130}' "$RUNNER_TEMP/p02-sqlite-diagnostic.log" | head -1 || true
            echo P02_W3_SQLITE_DIAGNOSTIC_NOT_MACHINE_PASS
            exit 1
          }
          python3 -B tests/integration/p02_w3_native_setup_http.py sqlite > "$RUNNER_TEMP/p02-sqlite-http.log" 2>&1 || { echo P02_W3_SQLITE_NATIVE_HTTP=FAIL; exit 1; }
          python3 -B tests/integration/p02_w3_clean_full_from_bundle.py > "$RUNNER_TEMP/p02-sqlite-full.log" 2>&1 || { echo P02_W3_EXTRACTED_SQLITE_FULL=FAIL; exit 1; }
          echo P02_W3_EXACT_NATIVE_SQLITE_INSTALL_HTTP_CLEAN_FULL=PASS
      - name: Real MySQL 8.4 native installation, extracted FULL and CRUD
        id: mysql_proof
        continue-on-error: true
        working-directory: vf-library
        shell: bash
        env:
          P02_W3_SYNTHETIC_ONLY: '1'
          P02_W3_ENGINE: mysql
          P02_W3_DSN: 'mysql:host=127.0.0.1;port=33306;dbname=p02_w3_mysql;charset=utf8mb4'
          P02_W3_USER: root
          P02_W3_PASS: p02_w3_disposable_only
          P02_W3_VENDOR_AUTOLOAD: ${{ github.workspace }}/vf-library/modern/laravel/vendor/autoload.php
        run: |
          set -Eeuo pipefail
          set +x
          php tests/integration/p02_w3_cloudpanel_fresh_sql.php > "$RUNNER_TEMP/p02-mysql.log" 2>&1 || { code=$?; echo P02_W3_MYSQL_NATIVE_INSTALL_EXIT_CODE="$code"; grep -Eo 'CLOUDPANEL_REAL_SQL_FRESH_(ASSERT|UNSAFE_ACCEPTED):[A-Z0-9_]+' "$RUNNER_TEMP/p02-mysql.log" | head -1 || true; python3 - "$RUNNER_TEMP/p02-mysql.log" <<'PY'
          import re,sys
          text=open(sys.argv[1],errors='replace').read()
          first=re.search(r'Uncaught ([A-Za-z0-9_\\\\]+): ([^\\r\\n]+)',text)
          if first:
              category=first.group(1).split('\\\\')[-1]
              message=first.group(2).split(' in /')[0]
              message=re.sub(r'(?i)(password|token|secret)[^ ]*','REDACTED',message)
              message=re.sub(r'[^A-Za-z0-9 _.,:\\[\\]()-]','_',message)[:120]
              print('P02_SQL_MYSQL_SYNTHETIC_ERROR_CLASS='+category)
              print('P02_SQL_MYSQL_SYNTHETIC_ERROR_REASON='+message)
          else:
              print('P02_SQL_MYSQL_SYNTHETIC_ERROR=UNCLASSIFIED')
          PY
          exit 1; }
          python3 -B tests/integration/p02_w3_clean_full_extracted_sql.py > "$RUNNER_TEMP/p02-mysql-extracted.log" 2>&1 || { echo P02_W3_MYSQL_EXTRACTED_FULL=FAIL; exit 1; }
          python3 -B tests/integration/p02_w3_native_setup_http.py mysql > "$RUNNER_TEMP/p02-mysql-http.log" 2>&1 || { echo P02_W3_MYSQL_NATIVE_HTTP=FAIL; exit 1; }
          echo P02_W3_EXACT_NATIVE_MYSQL_INSTALL_HTTP_CLEAN_FULL=PASS
      - name: Real MariaDB 11.8 native installation, extracted FULL and CRUD
        id: mariadb_proof
        continue-on-error: true
        working-directory: vf-library
        shell: bash
        env:
          P02_W3_SYNTHETIC_ONLY: '1'
          P02_W3_ENGINE: mariadb
          P02_W3_DSN: 'mysql:host=127.0.0.1;port=33307;dbname=p02_w3_mariadb;charset=utf8mb4'
          P02_W3_USER: root
          P02_W3_PASS: p02_w3_disposable_only
          P02_W3_VENDOR_AUTOLOAD: ${{ github.workspace }}/vf-library/modern/laravel/vendor/autoload.php
        run: |
          set -Eeuo pipefail
          set +x
          php tests/integration/p02_w3_cloudpanel_fresh_sql.php > "$RUNNER_TEMP/p02-mariadb.log" 2>&1 || { code=$?; echo P02_W3_MARIADB_NATIVE_INSTALL_EXIT_CODE="$code"; grep -Eo 'CLOUDPANEL_REAL_SQL_FRESH_(ASSERT|UNSAFE_ACCEPTED):[A-Z0-9_]+' "$RUNNER_TEMP/p02-mariadb.log" | head -1 || true; python3 - "$RUNNER_TEMP/p02-mariadb.log" <<'PY'
          import re,sys
          text=open(sys.argv[1],errors='replace').read()
          first=re.search(r'Uncaught ([A-Za-z0-9_\\\\]+): ([^\\r\\n]+)',text)
          if first:
              category=first.group(1).split('\\\\')[-1]
              message=first.group(2).split(' in /')[0]
              message=re.sub(r'(?i)(password|token|secret)[^ ]*','REDACTED',message)
              message=re.sub(r'[^A-Za-z0-9 _.,:\\[\\]()-]','_',message)[:120]
              print('P02_SQL_MARIADB_SYNTHETIC_ERROR_CLASS='+category)
              print('P02_SQL_MARIADB_SYNTHETIC_ERROR_REASON='+message)
          else:
              print('P02_SQL_MARIADB_SYNTHETIC_ERROR=UNCLASSIFIED')
          PY
          exit 1; }
          python3 -B tests/integration/p02_w3_clean_full_extracted_sql.py > "$RUNNER_TEMP/p02-mariadb-extracted.log" 2>&1 || { echo P02_W3_MARIADB_EXTRACTED_FULL=FAIL; exit 1; }
          python3 -B tests/integration/p02_w3_native_setup_http.py mariadb > "$RUNNER_TEMP/p02-mariadb-http.log" 2>&1 || { echo P02_W3_MARIADB_NATIVE_HTTP=FAIL; exit 1; }
          echo P02_W3_EXACT_NATIVE_MARIADB_INSTALL_HTTP_CLEAN_FULL=PASS
      - name: Require all three independent native database engines
        shell: bash
        run: |
          set -Eeuo pipefail
          for stage in '${{ steps.sqlite_proof.outcome }}' '${{ steps.mysql_proof.outcome }}' '${{ steps.mariadb_proof.outcome }}'; do
            if [ "$stage" != success ]; then
              echo P02_W3_EXACT_THREE_ENGINE_MACHINE=FAIL
              exit 1
            fi
          done
          echo P02_W3_EXACT_THREE_ENGINE_MACHINE=PASS
      - name: Erase transient private checkout and temp proof logs
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- vf-library
          rm -f -- "$RUNNER_TEMP"/p02-*.log
          test ! -e vf-library && echo P02_TRANSIENT_PRIVATE_SOURCE_CLEANUP=PASS
