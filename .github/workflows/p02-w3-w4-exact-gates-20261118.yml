          php tests/integration/p02_w4_legacy_sqlite_bridge.php > "$RUNNER_TEMP/p02-w4-bridge.log" 2>&1 || { code=$?; echo P02_W4_NATIVE_BRIDGE_EXIT_PHASE="$code"; exit 1; }
