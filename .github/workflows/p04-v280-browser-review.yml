name: P04 V280 Public Browser Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  p04-v280-browser:
    if: contains(github.head_ref, 'p04-v280-browser-gate')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout runner bridge
        uses: actions/checkout@v4
      - name: Checkout P04 develop
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: develop
          path: vf-infra
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN || github.token }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, fileinfo, sodium, zip, curl, mbstring
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser runtime
        working-directory: vf-infra
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-save --silent playwright
          npx playwright install --with-deps chromium >/dev/null
      - name: Run P04 V280 synthetic browser gate
        working-directory: vf-infra
        shell: bash
        env:
          VF_V280_TESTED_RUNTIME_COMMIT: 155351e8f2eee9d8720090f905758f324aa29ead
          VF_V280_EVIDENCE_DIR: ${{ github.workspace }}/evidence-p04-v280
        run: |
          set -Eeuo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$VF_V280_TESTED_RUNTIME_COMMIT"
          bash scripts/run-v280-navigation-simplify-gate.sh
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P04-V280-PUBLIC-BROWSER-REVIEW
          path: evidence-p04-v280/
          if-no-files-found: error
          retention-days: 30
