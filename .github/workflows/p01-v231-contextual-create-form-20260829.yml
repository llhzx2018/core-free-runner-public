name: P01 V2.31 Contextual Create Form Gate
on:
  push:
    branches: [task/p01-v231-contextual-create-form-20260829]
    paths:
      - .github/workflows/p01-v231-contextual-create-form-20260829.yml
      - scripts/p01-v231-contextual-create-form.sh
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PRODUCT: ${{ github.workspace }}/product
      ROOT: ${{ github.workspace }}/product/src
      PORT: '18631'
      ADMIN_PASS: 'P01V231!Context'
      EVID: /tmp/p01-v231-context-evidence
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: 08a24118fc660f5c9b937866d4b58aeba36c15c3
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Contextual create form machine gate
        shell: bash
        run: bash runner/scripts/p01-v231-contextual-create-form.sh
      - name: Upload V2.31 contextual form evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-v231-contextual-form-evidence-${{ github.run_id }}
          path: /tmp/p01-v231-context-evidence
          if-no-files-found: warn
          retention-days: 30
