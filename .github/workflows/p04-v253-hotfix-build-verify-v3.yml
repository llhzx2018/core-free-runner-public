name: P04 V2.5.3 Hotfix Build Verify V3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p04-v253-hotfix-build-verify-v3.yml'

permissions:
  contents: read

jobs:
  hotfix:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Prepare runtime
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-zip sqlite3 >/dev/null
          php -r 'foreach(["pdo_sqlite","sqlite3","curl","openssl","json","sodium"] as $x)if(!extension_loaded($x))exit(2);if(!class_exists("ZipArchive"))exit(3);echo "RUNTIME_GATE=PASS\n";'
      - name: Execute verified hotfix harness
        env:
          VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$VF_RELEASE_WRITE_TOKEN"
          git clone -q https://github.com/llhzx2018/core-free-runner-public.git runner-tools
          bash runner-tools/ops/p04/v253_hotfix_execute.sh
      - name: Cleanup
        if: always()
        run: rm -rf runner-tools
