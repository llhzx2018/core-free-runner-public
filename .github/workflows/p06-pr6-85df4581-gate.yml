name: P06 PR6 Exact Source Gate 85df4581

on:
  push:
    branches:
      - run/p06-pr6-85df4581
    paths:
      - .github/workflows/p06-pr6-85df4581-gate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p06-pr6-85df4581
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_REPO: llhzx2018/vf-press
      SOURCE_SHA: 85df4581affa35d9106de6d55dfa110797f39e3a
      EXPECTED_VERSION: 0.1.6
      EXPECTED_SCHEMA: '2'
    steps:
      - name: Checkout runner control
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          path: runner-control

      - name: Require private read capability
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo PRIVATE_READ_CAPABILITY=PASS

      - name: Checkout exact private source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 php-mbstring php-zip php-curl sqlite3 composer >/dev/null
          php -v
          composer --version
          echo MACHINE_RUNTIME=PASS

      - name: Exact identity and PHP syntax
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "$EXPECTED_VERSION"
          test "$(jq -r .version VF_PROJECT.json)" = "$EXPECTED_VERSION"
          test "$(jq -r .schema VF_PROJECT.json)" = "$EXPECTED_SCHEMA"
          composer validate --strict
          composer dump-autoload --no-dev --optimize --no-interaction
          find src bin public -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          echo SOURCE_IDENTITY=PASS
          echo PHP_SYNTAX=PASS

      - name: Fresh migration
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf storage storage-restore-*
          php bin/migrate.php | tee /tmp/migrate
          grep -Fq MIGRATION_PASS /tmp/migrate
          echo FRESH_MIGRATION=PASS

      - name: Current formal regression contract
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          php bin/self-test.php | tee /tmp/foundation
          grep -Fq FOUNDATION_SELF_TEST_PASS /tmp/foundation
          php bin/security-self-test.php | tee /tmp/security
          grep -Fq SECURITY_SELF_TEST_PASS /tmp/security
          php bin/research-self-test.php | tee /tmp/research
          grep -Fq RESEARCH_SELF_TEST_PASS /tmp/research
          php bin/publication-self-test.php | tee /tmp/publication
          grep -Fq PUBLICATION_MANUSCRIPT_SELF_TEST=PASS /tmp/publication
          php bin/reader-self-test.php | tee /tmp/reader
          grep -Fq PUBLISHER_READER_SELF_TEST=PASS /tmp/reader
          php bin/edition-self-test.php | tee /tmp/edition
          grep -Fq EDITION_SELF_TEST=PASS /tmp/edition
          php bin/living-publishing-self-test.php | tee /tmp/living
          grep -Fq LIVING_PUBLISHING_SELF_TEST=PASS /tmp/living
          php bin/operations-self-test.php | tee /tmp/operations
          grep -Fq OPERATIONS_SELF_TEST=PASS /tmp/operations
          php bin/update-self-test.php | tee /tmp/update
          grep -Fq UPDATE_SELF_TEST=PASS /tmp/update
          echo FORMAL_REGRESSION_CONTRACT=PASS

      - name: Backoffice and Operations UI
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          php bin/backoffice-self-test.php | tee /tmp/backoffice
          grep -Fq 'Backoffice self-test PASS' /tmp/backoffice
          php bin/backoffice-catalog-self-test.php | tee /tmp/backoffice-catalog
          grep -Fq BACKOFFICE_CATALOG_SELF_TEST=PASS /tmp/backoffice-catalog
          php bin/operations-ui-self-test.php | tee /tmp/operations-ui
          grep -Fq OPERATIONS_UI_SELF_TEST=PASS /tmp/operations-ui
          php bin/public-asset-self-test.php | tee /tmp/public-assets
          grep -Fq PUBLIC_ASSET_HTTP_SELF_TEST=PASS /tmp/public-assets
          echo BACKOFFICE_OPERATIONS_UI=PASS

      - name: Job self test
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          php bin/job-self-test.php | tee /tmp/jobs
          grep -Fq JOB_QUEUE_SELF_TEST=PASS /tmp/jobs
          echo JOB_SELF_TEST=PASS

      - name: Final migration and SQLite integrity
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          php bin/migrate.php | tee /tmp/migrate-final
          grep -Fq MIGRATION_PASS /tmp/migrate-final
          php -r '$pdo=new PDO("sqlite:storage/app.db"); if($pdo->query("PRAGMA integrity_check")->fetchColumn()!=="ok") exit(1); if((int)$pdo->query("SELECT MAX(version) FROM schema_migrations")->fetchColumn()!==2) exit(2); echo "SQLITE_INTEGRITY=PASS\n";'
          echo MACHINE_GATE=PASS

      - name: Product repository cleanliness
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf storage storage-restore-*
          STATUS="$(git status --short --untracked-files=all)"
          printf '%s\n' "$STATUS"
          test -z "$STATUS"
          echo PRODUCT_REPOSITORY_CLEAN=PASS
