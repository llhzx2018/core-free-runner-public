name: P07 D04 MariaDB matched CloudPanel application database E2E
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-m03-d04-mariadb-e2e-20261116.yml'
      - 'tests/p07_m03_d04_mariadb_e2e_20261116.sh'
permissions:
  contents: read
jobs:
  native-mariadb-dual-vm:
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Public synthetic harness checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Transient exact private product checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 80e70ba47a1f0a8dc399e0381aeb29a66a7e6c4e
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: .p07-private-exact
      - name: Exact-source MariaDB 11.8 dual CloudPanel pull plus PHP database read
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-private-exact rev-parse HEAD)" = 80e70ba47a1f0a8dc399e0381aeb29a66a7e6c4e
          bash -n tests/p07_m03_d04_mariadb_e2e_20261116.sh
          timeout --signal=TERM --kill-after=60s 3100s bash tests/p07_m03_d04_mariadb_e2e_20261116.sh
      - name: Always remove private checkout
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- .p07-private-exact
          test ! -e .p07-private-exact
          echo P07_D04_MARIADB_PRIVATE_SOURCE_CLEAN=PASS
