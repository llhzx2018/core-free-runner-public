name: S01 Theme exact formal release
on:
  push:
    branches: [task/s01-faq198-formal-20261026]
    paths: ['.github/workflows/s01-faq198-20261026-formal.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.198
  TARGET_SHA: 94f6b93eea0759b3ad5cccc06fe68409bdd71e98
  TARGET_TREE: 20c040e8d6520702cfab3260a960522a6bc69f2d
  BASE_SHA: af4b8b0b4b76285d2f402a570b2bb460ba6829ad
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - name: Formal identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-faq198-20261026/formal-spec.json --input control/.github/workflows/s01-faq198-20261026-formal.yml
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 94f6b93eea0759b3ad5cccc06fe68409bdd71e98
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact candidate, merged tree and required evidence readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider candidate-proof
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40287219001 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40287219001 --jq .head_sha)" = 611a3c41d56e349f5e06a9732d039a4bec30ed41
          test "$(gh api repos/$TARGET_REPO/commits/main --jq .sha)" = "$TARGET_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$TARGET_SHA --jq .tree.sha)" = "$TARGET_TREE"
          gh run download 40287219001 --repo llhzx2018/core-free-runner-public --name s01-home-40287219001 --dir candidate-proof
          cmp candidate-proof/state-before.sha256 candidate-proof/state-after.sha256
          cmp candidate-proof/contracts-before.json candidate-proof/contracts-after.json
          python3 control/lanes/s01-faq198-20261026/package.py
          python3 - <<'PYVERIFY'
          import json,pathlib,subprocess,urllib.parse
          r=pathlib.Path('candidate-proof')
          old=json.loads((r/'package.json').read_text());new=json.loads(pathlib.Path('proof/package.json').read_text())
          assert old['source']=='7e60fc98797fdbb77b14404a544ad6d84721a1f8'
          for phase in ['before','after','smoke']:
              result=json.loads((r/('faq-'+phase+'.json')).read_text())
              assert result['status']=='PASS' and result['rows']==2
          result=json.loads((r/'faq-after.json').read_text())
          assert result['status']=='PASS' and result['errors']==[] and result['checks']>=44
          assert result['ownerContentSEO']=='BYTE_IDENTICAL'
          assert result['layout']=='SINGLE_RAIL_ZH_EN_1440_1024'
          assert result['cta']=='QUIET_AND_WHITE_BUTTON_TEXT'
          assert result['customAndHeroOff']=='PRESERVED'
          assert result['interaction']=='SEARCH_CLEAR_ESCAPE_KEYBOARD_CATEGORY_SINGLE_MULTIPLE_NOJS_PASS'
          for lang in ['zh','en']:
              for width in [1440,1024]:
                  assert (r/f'faq-{lang}-{width}.png').stat().st_size>1000
                  assert (r/f'faq-empty-{lang}-{width}.png').stat().st_size>1000
          assert json.loads((r/'clean-install.json').read_text())['status']=='PASS'
          assert json.loads((r/'bootstrap.json').read_text())['status']=='PASS'
          for k in ['status','version','tree','sha256','bytes','files']: assert old[k]==new[k],k
          assert new['sha256']=='d322a2f0c3d137f91a8c45a21863df2a41a64aa419654129b4e5c735a26be1a0' and new['bytes']==2002625
          coverage=json.loads(pathlib.Path('control/lanes/s01-faq198-20261026/release-authority.json').read_text())
          assert set(coverage['required'])=={'TESTING','GIT','UA_UI','SEO','SECURITY','INSTALL','UPGRADE','DATA_SCHEMA','PERFORMANCE'}
          assert coverage['source']=='7e60fc98797fdbb77b14404a544ad6d84721a1f8' and coverage['tree']=='20c040e8d6520702cfab3260a960522a6bc69f2d'
          assert coverage['owner_preview_runtime']=='N_A'
          assert coverage['release_mode']=='PROJECT_PREVIEW_N_A'
          assert coverage['owner_real_use']=='POST_PRODUCTION_REQUIRED'
          assert coverage['production_auto_apply'] is False
          for item in coverage['required'].values():
              assert item['sha'] and item['acceptance']
              endpoint='repos/llhzx2018/gov-doc/contents/'+urllib.parse.quote(item['path'],safe='/')+'?ref=main'
              live=json.loads(subprocess.check_output(['gh','api',endpoint]))
              assert live['sha']==item['sha'],item['path']
              item['evidence_status']='PASS_EXACT_CANDIDATE_MACHINE'
          coverage['candidate_run']='40287219001'
          coverage['merged_source']='94f6b93eea0759b3ad5cccc06fe68409bdd71e98'
          coverage['formal_release_gate']='PASS'
          coverage['production_effect']='NOT_PROVEN_POST_MANUAL_UPGRADE_READBACK_REQUIRED'
          pathlib.Path('proof/public-authority-coverage.json').write_text(json.dumps(coverage,ensure_ascii=False,indent=2))
          print('MERGED_TREE_EQUALS_TESTED_TREE_AND_EXACT_PACKAGE_PASS')
          PYVERIFY
      - name: Publish only the exact verified package
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.35.198 --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create v1.35.198 provider/vf-tools-theme_V1.35.198.zip --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Theme V1.35.198' --notes '常见问答参照iLoveIMG FAQ进行桌面精修：标题、搜索、分类、问答与收尾入口共用一个居中的阅读区域，问题单列就近展开；有真实首屏时收敛默认重复标题与固定引导按钮，自定义说明及隐藏/后置首屏保持。真实WordPress/Chromium中英文1440/1024、搜索/无结果/清除焦点/Escape、键盘/分类/单多展开/无JS、自定义和hero状态、197升级198/回退/重复安装及保护数据通过。问答与Head保持，476运行文件。文章正文及SEO内容按Owner决定统一后置；Production由Owner手工升级，最终截图验收待完成，手机暂缓。' --latest
          fi
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/v1.35.198 --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh release view v1.35.198 --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - name: Authenticated remote ZIP byte comparison
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download v1.35.198 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.198.zip --dir remote
          cmp provider/vf-tools-theme_V1.35.198.zip remote/vf-tools-theme_V1.35.198.zip
          echo 'd322a2f0c3d137f91a8c45a21863df2a41a64aa419654129b4e5c735a26be1a0  remote/vf-tools-theme_V1.35.198.zip' | sha256sum -c
          test "$(stat -c %s remote/vf-tools-theme_V1.35.198.zip)" = 2002625
          gh release view v1.35.198 --repo "$TARGET_REPO" --json url,publishedAt,tagName > proof/formal-release.json
          echo FORMAL_RELEASE_EXACT_REMOTE_ASSET_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-home-formal-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target provider remote candidate-proof
