name: P01 V229 Changelog Fix V2

on:
  push:
    branches:
      - "task/p01-v229-changelog-authority-fix-v2-20260829"

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HEAD_B64: ""
    steps:
      - name: Checkout P01 develop
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: develop
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
      - name: Replace only V229 top changelog block
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "442b609c3049aff54ee653a80e167b2b6bd9d519"
          python3 - <<'PY'
          import os,base64
          from pathlib import Path
          p=Path('CHANGELOG.md')
          s=p.read_text(encoding='utf-8')
          marker='## V2.28.0 · Formal Release · 2026-08-29'
          assert s.startswith('## V2.29.0 · Functional Rebaseline Candidate · 2026-08-29')
          assert marker in s
          tail=s.split(marker,1)[1]
          head=base64.b64decode(os.environ['HEAD_B64']).decode('utf-8')
          p.write_text(head+marker+tail,encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = "CHANGELOG.md"
      - name: Commit docs-only correction
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add CHANGELOG.md
          git commit -m 'docs(P01): align V2.29 changelog with resource domain closure'
          git push origin HEAD:develop
          echo "P01_CHANGELOG_PATCH=$(git rev-parse HEAD)"
