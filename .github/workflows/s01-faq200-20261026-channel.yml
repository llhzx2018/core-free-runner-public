name: S01 exact Theme channel contract
on:
  push:
    branches: [task/s01-faq200-channel-20261026]
    paths: ['.github/workflows/s01-faq200-20261026-channel.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.200
  TARGET_SHA: 24d48f2b403df78d2610dc84aa19f49c198d6292
  UPDATE_SHA: f2e671881f4ff878f9fa638dca202c688984b380
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: f2e671881f4ff878f9fa638dca202c688984b380
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: source
      - name: Channel identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-faq200-20261026/channel-spec.json --input control/.github/workflows/s01-faq200-20261026-channel.yml
      - name: Exact changed manifest and native protocol tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          test "$(git -C source diff --name-only a25f11be4fbd8ce151d4ba909b31fae73fc8f763 f2e671881f4ff878f9fa638dca202c688984b380)" = projects/S01-C01.json
          git -C source diff --exit-code a25f11be4fbd8ce151d4ba909b31fae73fc8f763 f2e671881f4ff878f9fa638dca202c688984b380 -- projects/S01-C03.json
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PYCHANNEL'
          import json,os
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']==os.environ['TARGET_VERSION']
          assert m['asset_sha256']=='fd70d4ef0cd4b314e41d7d4dabb5723153978f70cf3925321b4287e6f1ed76d8' and m['asset_bytes']==2003813
          assert m['runtime_files']==476 and '1.35.199' in m['from_versions']
          assert m['release_tag']=='v'+os.environ['TARGET_VERSION']
          print('EXACT_CHANNEL_CONTRACT_PASS')
          PYCHANNEL
      - name: Cleanup
        if: always()
        run: rm -rf source
