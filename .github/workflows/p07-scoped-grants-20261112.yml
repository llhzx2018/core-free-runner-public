name: P07 original 18 scoped grant protection
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - task/p07-scoped-grants-20261112
permissions:
  contents: read
jobs:
  exact-scoped-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      P07_SOURCE_SHA: 5d094e3b2d84a8d50b8a36991f3c93ee59c81d20
    steps:
      - name: Exact transient product checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 5d094e3b2d84a8d50b8a36991f3c93ee59c81d20
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product
      - name: Byte-locked scope guard and original18 failure-chain regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C product rev-parse HEAD)" = "$P07_SOURCE_SHA"
          test "$(cat product/BUILD_ID)" = "0.1.0-release146"
          python3 -B -m compileall -q product/lib product/tests
          (cd product && python3 -B -m unittest -q tests.test_cloudpanel tests.test_p07_original_db_restore_drill tests.test_p07_original_18_sql_binary_integrity)
          (cd product && python3 -B -m unittest discover -s tests -p 'test_p07_original_18*.py' -q)
          echo P07_SCOPED_GRANT_UNIT_PROOF=PASS
          echo P07_OWNER_CP2_MIGRATION=NOT_RUN
          echo P07_FORMAL_RELEASE=NO
      - name: Always cleanup private source
        if: always()
        shell: bash
        run: |
          rm -rf -- product
          echo P07_PRIVATE_SOURCE_CLEANUP=YES
  exact-real-mariadb:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      P07_SOURCE_SHA: 5d094e3b2d84a8d50b8a36991f3c93ee59c81d20
      P07_SYNTHETIC_MARIADB: "1"
      P07_DB_TEST_HOST: 127.0.0.1
      P07_DB_TEST_PORT: "63306"
      P07_DB_TEST_PASSWORD: p07-disposable-mariadb-test-only
    steps:
      - name: Exact transient product checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 5d094e3b2d84a8d50b8a36991f3c93ee59c81d20
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product
      - name: Start disposable MariaDB 11.8 and install only native client
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C product rev-parse HEAD)" = "$P07_SOURCE_SHA"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mariadb-client
          docker pull mariadb:11.8
          docker run --rm -d --name p07-scoped-grants-maria118 -p 127.0.0.1:63306:3306 -e "MARIADB_ROOT_PASSWORD=$P07_DB_TEST_PASSWORD" mariadb:11.8 >/dev/null
          for i in $(seq 1 100); do
            if MYSQL_PWD="$P07_DB_TEST_PASSWORD" mariadb --no-defaults -h 127.0.0.1 -P 63306 -uroot -N -e 'SELECT 1' >/dev/null 2>&1; then
              echo P07_SYNTHETIC_DB_READY=YES
              break
            fi
            sleep 2
          done
          test "$(MYSQL_PWD="$P07_DB_TEST_PASSWORD" mariadb --no-defaults -h 127.0.0.1 -P 63306 -uroot -N -e 'SELECT VERSION()' | cut -d. -f1-2)" = "11.8"
      - name: Original 4 archive restore and foreign grant refusal real client
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          (cd product && python3 -B -m unittest -v tests.test_p07_original_db_restore_real_mariadb)
          echo P07_SCOPED_REAL_DB_GRANTS_PROOF=PASS
          echo P07_CP2_EXISTING_DB_WRITES=NONE
          echo P07_FORMAL_RELEASE=NO
      - name: Always cleanup synthetic container and private checkout
        if: always()
        shell: bash
        run: |
          docker rm -f p07-scoped-grants-maria118 >/dev/null 2>&1 || true
          rm -rf -- product
          echo P07_REAL_GRANTS_TEST_CLEANUP=YES
