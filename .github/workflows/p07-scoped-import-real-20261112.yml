name: P07 original18 scoped MySQL import exact-source proof
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - task/p07-scoped-import-real-20261112
permissions:
  contents: read
concurrency:
  group: p07-scoped-import-real-20261112
  cancel-in-progress: false
jobs:
  scoped-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      P07_EXACT_SHA: 9bd1c3270f4a157e0fc236f3ae9561a946dbf3a5
    steps:
      - name: Transient exact private product checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 9bd1c3270f4a157e0fc236f3ae9561a946dbf3a5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product
      - name: Exact source syntax and unit regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C product rev-parse HEAD)" = "$P07_EXACT_SHA"
          test "$(cat product/BUILD_ID)" = "0.1.0-release146"
          python3 -B -m compileall -q product/lib product/tests
          (cd product && python3 -B -m unittest -v tests.test_cloudpanel tests.test_p07_original_db_restore_drill tests.test_migration_final_db_shadow tests.test_migration_final_db_batch)
          (cd product && python3 -B -m unittest discover -s tests -p 'test_p07_original_18*.py' -q)
          echo P07_SCOPED_IMPORT_EXACT_SOURCE_UNITS=PASS
      - name: Always remove transient private source
        if: always()
        shell: bash
        run: |
          rm -rf -- product
          echo P07_PRIVATE_CHECKOUT_CLEANED=YES
  scoped-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      P07_EXACT_SHA: 9bd1c3270f4a157e0fc236f3ae9561a946dbf3a5
      P07_SYNTHETIC_MARIADB: "1"
      P07_DB_TEST_HOST: 127.0.0.1
      P07_DB_TEST_PORT: "63306"
      P07_DB_TEST_PASSWORD: p07-synthetic-disposable-only-20261112
    steps:
      - name: Transient exact private product checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 9bd1c3270f4a157e0fc236f3ae9561a946dbf3a5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product
      - name: Start disposable MySQL84 and MariaDB118
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C product rev-parse HEAD)" = "$P07_EXACT_SHA"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mariadb-client
          docker pull mysql:8.4
          docker pull mariadb:11.8
          docker run --rm -d --name p07-scoped-maria118 --network bridge -p 127.0.0.1:63306:3306 -e "MARIADB_ROOT_PASSWORD=$P07_DB_TEST_PASSWORD" mariadb:11.8 >/dev/null
          for i in $(seq 1 100); do
            if MYSQL_PWD="$P07_DB_TEST_PASSWORD" mariadb --no-defaults -h 127.0.0.1 -P 63306 -uroot -N -e "SELECT 1" >/dev/null 2>&1; then
              echo P07_SCOPED_DISPOSABLE_MARIA118_READY=YES
              break
            fi
            sleep 2
          done
          test "$(MYSQL_PWD="$P07_DB_TEST_PASSWORD" mariadb --no-defaults -h 127.0.0.1 -P 63306 -uroot -N -e 'SELECT VERSION()' | cut -d. -f1-2)" = "11.8"
      - name: Independent disposable local DB-user authentication and gzip pipe proof
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          db=p07scopedprobe
          usr=p07probeonly
          pw=p07-synthetic-scoped-only
          MYSQL_PWD="$P07_DB_TEST_PASSWORD" mariadb --no-defaults -h 127.0.0.1 -P 63306 -uroot -e "CREATE DATABASE $db; CREATE USER '$usr'@'localhost' IDENTIFIED BY '$pw'; CREATE USER '$usr'@'127.0.0.1' IDENTIFIED BY '$pw'; GRANT ALL PRIVILEGES ON $db.* TO '$usr'@'localhost'; GRANT ALL PRIVILEGES ON $db.* TO '$usr'@'127.0.0.1';" >/dev/null
          log=$(mktemp)
          data=$(mktemp --suffix=.sql.gz)
          trap 'rm -f "$log" "$data"' EXIT
          chmod 600 "$log" "$data"
          if MYSQL_PWD="$pw" mariadb --no-defaults --protocol=tcp --host=127.0.0.1 --port=63306 --binary-mode --default-character-set=utf8mb4 --user="$usr" --database="$db" -N -e 'SELECT 1' >/dev/null 2>"$log"; then
            echo P07_SCOPED_TEST_ACCOUNT_LOGIN=PASS
          else
            code=$(grep -oE 'ERROR [0-9]+' "$log" | head -1 || true)
            echo "P07_SCOPED_TEST_ACCOUNT_LOGIN=FAIL:$code"
            exit 1
          fi
          printf 'CREATE TABLE scopeproof (id INT);\nINSERT INTO scopeproof VALUES (1);\n' | gzip -c >"$data"
          if gzip -dc -- "$data" | MYSQL_PWD="$pw" mariadb --no-defaults --protocol=tcp --host=127.0.0.1 --port=63306 --binary-mode --default-character-set=utf8mb4 --user="$usr" --database="$db" >/dev/null 2>"$log"; then
            echo P07_SCOPED_TEST_ACCOUNT_GZIP_IMPORT=PASS
          else
            code=$(grep -oE 'ERROR [0-9]+' "$log" | head -1 || true)
            echo "P07_SCOPED_TEST_ACCOUNT_GZIP_IMPORT=FAIL:$code"
            exit 1
          fi
          value=$(MYSQL_PWD="$P07_DB_TEST_PASSWORD" mariadb --no-defaults -h 127.0.0.1 -P 63306 -uroot -N -e "SELECT COUNT(*) FROM $db.scopeproof")
          test "$value" = "1"
          echo P07_SCOPED_TEST_ACCOUNT_DATABASE_READBACK=PASS
      - name: Native original four DB restore and foreign-write refusal
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          (cd product && python3 -B -m unittest -v tests.test_p07_original_db_restore_real_mariadb)
          echo P07_SCOPED_REAL_MARIADB_IMPORT=PASS
      - name: Native isolated MySQL84 to MariaDB118 shadow/rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          (cd product && python3 -B -m unittest -v tests.test_p07_original_18_native_mysql84_to_mariadb118)
          echo P07_SCOPED_NATIVE_CROSS_ENGINE=PASS
          echo P07_OWNER_CP2_MIGRATION=NOT_RUN
          echo P07_FORMAL_RELEASE=NO
      - name: Always clean test engines and private source
        if: always()
        shell: bash
        run: |
          docker rm -f p07-scoped-maria118 >/dev/null 2>&1 || true
          rm -rf -- product
          echo P07_SCOPED_REAL_ENGINE_CLEANUP=YES
