name: TEMP P07 new site rollback recovery exact-source test
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-new-site-rollback-recovery-temporary.yml'
permissions:
  contents: read
concurrency:
  group: temp-p07-new-site-rollback-recovery-20261017
  cancel-in-progress: false
jobs:
  focused-regression:
    if: github.repository == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Check registered private read capability
        shell: bash
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          test -n "$PRIVATE_READ_TOKEN" || exit 78
      - name: Fetch exact P07 private candidate to transient runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 88cf25a8402275400575cbbaabc80b3d843033be
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: p07-private
      - name: Run target-only recovery fail-closed regression
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p07-private rev-parse HEAD)" = '88cf25a8402275400575cbbaabc80b3d843033be'
          test "$(cat p07-private/BUILD_ID)" = '0.1.0-release87'
          cd p07-private
          export PYTHONPATH="$PWD/lib"
          python3 -m py_compile lib/restore_new.py tests/test_restore_new.py
          log="$RUNNER_TEMP/p07-recovery-regression.log"
          if timeout --signal=TERM --kill-after=5s 750 python3 -m unittest -q tests.test_restore_new tests.test_restore_apply tests.test_restore tests.test_backup >"$log" 2>&1; then
            echo 'P07_NEW_SITE_ROLLBACK_RECOVERY=PASS'
            grep -E '^Ran [0-9]+ tests? in ' "$log" | tail -n1 || true
          else
            rc=$?
            echo "P07_NEW_SITE_ROLLBACK_RECOVERY=FAIL_$rc"
            grep -E '^Ran [0-9]+ tests? in |^FAILED \(' "$log" | tail -n2 || true
            exit "$rc"
          fi
      - name: Erase transient source and private logs
        if: always()
        shell: bash
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/p07-private"
          rm -f -- "$RUNNER_TEMP/p07-recovery-regression.log"
          echo 'P07_PRIVATE_SOURCE_PERSISTED=NO'
          echo 'P07_PRIVATE_LOG_PERSISTED=NO'
