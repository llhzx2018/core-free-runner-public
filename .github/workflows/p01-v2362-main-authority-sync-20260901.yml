name: P01 V2.36.2 Main Authority Sync
on:
  push:
    branches: [release/p01-v2362-candidate-20260901]
    paths: [.github/workflows/p01-v2362-main-authority-sync-20260901.yml]
permissions:
  contents: read
  actions: read
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MAIN_SOURCE: 4fd25a5ce4383dc456e755fc2e031a861d6ff655
      DEVELOP_SOURCE: 4ec93adad93977a519675b55806866c896bad09f
      RUNTIME_TREE: 55bc3143df6ca4e8e66b3e8d3e0f01b3ec343424
      TARGET_BRANCH: docs/p01-v2362-main-authority-sync-20260901
      EVID: /tmp/p01-v2362-main-authority-sync
    steps:
      - name: Checkout main authority sync branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01
      - name: Exact five-file sync
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVID"
          cd p01
          test "$(git rev-parse HEAD)" = "$MAIN_SOURCE"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN_SOURCE"
          test "$(git ls-remote origin refs/heads/develop | awk '{print $1}')" = "$DEVELOP_SOURCE"
          test "$(git ls-remote origin refs/tags/v2.36.2 | awk '{print $1}')" = "$MAIN_SOURCE"
          git fetch origin "$DEVELOP_SOURCE"
          FILES=(README.md VF_PROJECT.json docs/authority/CURRENT.md docs/evidence/P01_V2.36.2_RELEASE_CLOSURE_20260901.md docs/handoff/CURRENT_STATE.md)
          for f in "${FILES[@]}"; do
            mkdir -p "$(dirname "$f")"
            git show "$DEVELOP_SOURCE:$f" > "$f"
            test "$(sha256sum "$f" | awk '{print $1}')" = "$(git show "$DEVELOP_SOURCE:$f" | sha256sum | awk '{print $1}')"
          done
          ACTUAL="$(git status --short | sed 's/^...//' | sort)"
          EXPECTED=$'README.md\nVF_PROJECT.json\ndocs/authority/CURRENT.md\ndocs/evidence/P01_V2.36.2_RELEASE_CLOSURE_20260901.md\ndocs/handoff/CURRENT_STATE.md'
          test "$ACTUAL" = "$EXPECTED"
          test -z "$(git diff --name-only -- src)"
          python3 -m json.tool VF_PROJECT.json >/dev/null
          test "$(jq -r .published_release.version VF_PROJECT.json)" = 2.36.2
          test "$(jq -r .production_version VF_PROJECT.json)" = 2.36.0
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add "${FILES[@]}"
          git commit -m 'docs(P01): sync V2.36.2 release authority to main'
          NEW=$(git rev-parse HEAD)
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          git push origin HEAD:"refs/heads/$TARGET_BRANCH"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | awk '{print $1}')" = "$NEW"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN_SOURCE"
          test "$(git ls-remote origin refs/heads/develop | awk '{print $1}')" = "$DEVELOP_SOURCE"
          test "$(git ls-remote origin refs/tags/v2.36.2 | awk '{print $1}')" = "$MAIN_SOURCE"
          printf 'P01_V2362_MAIN_AUTHORITY_SYNC_PREP=PASS\nBRANCH_SHA=%s\nMAIN_BEFORE=%s\nDEVELOP=%s\nRUNTIME_TREE=%s\nFILES=5\nSRC_CHANGE=0\nTAG_V2362=%s\nOWNER_PRODUCTION_WRITE=NO\n' "$NEW" "$MAIN_SOURCE" "$DEVELOP_SOURCE" "$RUNTIME_TREE" "$MAIN_SOURCE" | tee "$EVID/verdict.txt"
          git diff --name-only "$MAIN_SOURCE..$NEW" | sort | tee "$EVID/files.txt"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2362-main-authority-sync-${{ github.run_id }}
          path: /tmp/p01-v2362-main-authority-sync
          if-no-files-found: warn
          retention-days: 90
