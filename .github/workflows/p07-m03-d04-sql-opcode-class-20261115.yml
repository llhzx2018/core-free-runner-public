name: P07 M03 D04 isolated RC137 release-candidate build gate TEMP
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-m03-d04-sql-opcode-class-20261115.yml'
permissions:
  contents: read
jobs:
  exact-rc137-build:
    if: github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'synchronize'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      NO_COLOR: '1'
    steps:
      - name: Checkout exact P07 private source temporary
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 362f5be0fa31da1420dbeb223640837321daf8e6
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: .p07-private
      - name: Checkout current public released install source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: main
          persist-credentials: false
          path: .p07-public
      - name: Checkout GOV-DOC architecture authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: .p07-gov
      - name: Exact candidate builder static and full release architecture
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-private rev-parse HEAD)" = 362f5be0fa31da1420dbeb223640837321daf8e6
          cd .p07-private
          export PYTHONPATH="$PWD/lib"
          python3 -B -m unittest discover -s tests -p test_p07_m03_candidate_runtime_closure.py -v
          python3 -B scripts/check_p07_modules.py
          python3 -B .github/checks/test_architecture_gate.py
          python3 -B .github/checks/architecture_gate.py \
            --manifest .github/checks/code_architecture.json \
            --gov-root ../.p07-gov --git-root . \
            --base-sha a6da82f35fdbd06020a7e65c8cbd5717f617f2f3 --head-sha 362f5be0fa31da1420dbeb223640837321daf8e6
          python3 - <<'PY'
          import ast,subprocess
          from pathlib import Path
          ast.parse(Path("scripts/p07_candidate_bundle.py").read_text())
          changed=set(subprocess.check_output([
              "git","diff","--name-only","fbe8066673d1717a558f089fb650f0c1e051869a","362f5be0fa31da1420dbeb223640837321daf8e6"
          ],text=True).splitlines())
          assert changed=={"scripts/p07_candidate_bundle.py","scripts/p07_m03_runtime_closure.py","tests/test_p07_m03_candidate_runtime_closure.py","docs/authority/P07_MODULE_REGISTRY.json"}, changed
          old=subprocess.check_output([
              "git","show","fbe8066673d1717a558f089fb650f0c1e051869a:scripts/p07_candidate_bundle.py"
          ],text=True)
          newer=Path("scripts/p07_candidate_bundle.py").read_text()
          assert len(newer.splitlines())<=len(old.splitlines())
          print("P07_D04_PACKAGER_SCOPE_AND_NO_GROWTH=PASS")
          PY
      - name: Build and inspect exact D04 RC137 isolated M03 candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-private rev-parse HEAD)" = 362f5be0fa31da1420dbeb223640837321daf8e6
          mkdir -p "$RUNNER_TEMP/p07-m03-rc137"
          python3 -B .p07-private/scripts/p07_candidate_bundle.py \
            --product-root .p07-private --public-root .p07-public \
            --output "$RUNNER_TEMP/p07-m03-rc137/package" \
            --product-sha 362f5be0fa31da1420dbeb223640837321daf8e6 \
            --build 0.1.0-release137-rc1 --care 0.1.0-rc85
          python3 - <<'PY'
          import json,hashlib,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"p07-m03-rc137/package"
          a=json.loads((root/"candidate_attestation.json").read_text())
          overlay=root/"dist/p07/0.1.0/overlay"
          assert a["status"]=="CANDIDATE_ONLY_NOT_PUBLISHED"
          assert a["product_source_sha"]=="362f5be0fa31da1420dbeb223640837321daf8e6"
          assert a["product_build"]=="0.1.0-release137-rc1"
          expected={"lib/server_migration_pull.py","lib/migration_target_inventory_guard.py",
                    "bin/vfops-migrate-ui"}
          manifest=(overlay/"RUNTIME.gitblob").read_text()
          actual={s.split("  ",1)[1] for s in manifest.splitlines()}
          assert expected <= actual, expected-actual
          assert (overlay/"BUILD_ID").read_text().strip()==a["product_build"]
          for line in manifest.splitlines():
            sha,rel=line.split("  ",1);data=(overlay/rel).read_bytes()
            assert hashlib.sha1(b"blob "+str(len(data)).encode()+b"\x00"+data).hexdigest()==sha
          for entry in expected:
            print("P07_D04_CANDIDATE_RUNTIME_ENTRY="+entry)
          print("P07_D04_CANDIDATE_RUNTIME_FILES="+str(len(actual)))
          print("P07_D04_CANDIDATE_MANIFEST_BLOB="+a["runtime_manifest_blob"])
          print("P07_D04_CANDIDATE_PACKAGE_LOCAL_ONLY_NOT_PUBLISHED=PASS")
          PY
      - name: Always clean private material and staged RC candidate
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- .p07-private .p07-gov .p07-public "$RUNNER_TEMP/p07-m03-rc137"
          test ! -e .p07-private && test ! -e .p07-gov && test ! -e .p07-public
          echo P07_PRIVATE_SOURCE_AND_CANDIDATE_CLEAN=PASS
