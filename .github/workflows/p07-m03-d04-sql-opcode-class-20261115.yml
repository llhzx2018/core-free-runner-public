name: P07 M03 D04 isolated RC137 release-candidate build gate TEMP
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-m03-d04-sql-opcode-class-20261115.yml'
permissions:
  contents: read
jobs:
  exact-rc137-build:
    if: github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'synchronize'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      NO_COLOR: '1'
    steps:
      - name: Checkout exact P07 private source temporary
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: deecb4b621957f847fa68224508d83d024d282b1
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: .p07-private
      - name: Checkout current public released install source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: main
          persist-credentials: false
          path: .p07-public
      - name: Checkout GOV-DOC architecture authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: .p07-gov
      - name: Exact candidate builder static and full release architecture
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-private rev-parse HEAD)" = deecb4b621957f847fa68224508d83d024d282b1
          cd .p07-private
          export PYTHONPATH="$PWD/lib"
          python3 -B -m unittest discover -s tests -p test_p07_m03_candidate_runtime_closure.py -v
          python3 -B scripts/check_p07_modules.py
          python3 -B .github/checks/test_architecture_gate.py
          python3 -B .github/checks/architecture_gate.py \
            --manifest .github/checks/code_architecture.json \
            --gov-root ../.p07-gov --git-root . \
            --base-sha a6da82f35fdbd06020a7e65c8cbd5717f617f2f3 --head-sha deecb4b621957f847fa68224508d83d024d282b1
          python3 - <<'PY'
          import ast,subprocess
          from pathlib import Path
          ast.parse(Path("scripts/p07_candidate_bundle.py").read_text())
          changed=set(subprocess.check_output([
              "git","diff","--name-only","fbe8066673d1717a558f089fb650f0c1e051869a","deecb4b621957f847fa68224508d83d024d282b1"
          ],text=True).splitlines())
          assert changed=={"scripts/p07_candidate_bundle.py","scripts/p07_m03_runtime_closure.py","tests/test_p07_m03_candidate_runtime_closure.py","docs/authority/P07_MODULE_REGISTRY.json"}, changed
          old=subprocess.check_output([
              "git","show","fbe8066673d1717a558f089fb650f0c1e051869a:scripts/p07_candidate_bundle.py"
          ],text=True)
          newer=Path("scripts/p07_candidate_bundle.py").read_text()
          assert len(newer.splitlines())<=len(old.splitlines())
          print("P07_D04_PACKAGER_SCOPE_AND_NO_GROWTH=PASS")
          PY
      - name: Build and inspect exact D04 RC137 isolated M03 candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-private rev-parse HEAD)" = deecb4b621957f847fa68224508d83d024d282b1
          mkdir -p "$RUNNER_TEMP/p07-m03-rc137"
          python3 -B .p07-private/scripts/p07_candidate_bundle.py \
            --product-root .p07-private --public-root .p07-public \
            --output "$RUNNER_TEMP/p07-m03-rc137/package" \
            --product-sha deecb4b621957f847fa68224508d83d024d282b1 \
            --build 0.1.0-release137-rc1 --care 0.1.0-rc85
          python3 - <<'PY'
          import json,hashlib,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"p07-m03-rc137/package"
          a=json.loads((root/"candidate_attestation.json").read_text())
          overlay=root/"dist/p07/0.1.0/overlay"
          assert a["status"]=="CANDIDATE_ONLY_NOT_PUBLISHED"
          assert a["product_source_sha"]=="deecb4b621957f847fa68224508d83d024d282b1"
          assert a["product_build"]=="0.1.0-release137-rc1"
          expected={"lib/server_migration_pull.py","lib/migration_target_inventory_guard.py",
                    "bin/vfops-migrate-ui"}
          manifest=(overlay/"RUNTIME.gitblob").read_text()
          actual={s.split("  ",1)[1] for s in manifest.splitlines()}
          assert expected <= actual, expected-actual
          assert (overlay/"BUILD_ID").read_text().strip()==a["product_build"]
          for line in manifest.splitlines():
            sha,rel=line.split("  ",1);data=(overlay/rel).read_bytes()
            assert hashlib.sha1(b"blob "+str(len(data)).encode()+b"\x00"+data).hexdigest()==sha
          for entry in expected:
            print("P07_D04_CANDIDATE_RUNTIME_ENTRY="+entry)
          print("P07_D04_CANDIDATE_RUNTIME_FILES="+str(len(actual)))
          print("P07_D04_CANDIDATE_MANIFEST_BLOB="+a["runtime_manifest_blob"])
          print("P07_D04_CANDIDATE_PACKAGE_LOCAL_ONLY_NOT_PUBLISHED=PASS")
          PY
      - name: Actual isolated M03 candidate installation, idempotence and rollback slot
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$RUNNER_TEMP/p07-m03-rc137/package"
          sandbox="$RUNNER_TEMP/p07-m03-rc137/isolated-install"
          mkdir -p "$sandbox/bin" "$sandbox/business"
          printf 'OWNER_BUSINESS_KEEP' > "$sandbox/business/unchanged.txt"
          export P07_ALLOW_NONROOT=1 P07_NO_EXEC=1
          export P07_INSTALL_DIR="$sandbox/live"
          export P07_PREVIOUS_DIR="$sandbox/previous"
          export P07_BIN_LINK="$sandbox/bin/vfops-rc"
          export P07_PUBLIC_ROOT="file://$stage"
          bash "$stage/installers/p07.sh" > "$sandbox/first-install.out"
          test "$(cat "$sandbox/live/BUILD_ID")" = "0.1.0-release137-rc1"
          test "$(NO_COLOR=1 "$sandbox/bin/vfops-rc" --build-id)" = "0.1.0-release137-rc1"
          test -f "$sandbox/live/.runtime-manifest.gitblob"
          test ! -e "$sandbox/previous"
          bash "$stage/installers/p07.sh" > "$sandbox/idempotent.out"
          test ! -e "$sandbox/previous"
          test "$(cat "$sandbox/business/unchanged.txt")" = OWNER_BUSINESS_KEEP
          echo P07_M03_RC137_FRESH_INSTALL_AND_IDEMPOTENCE=PASS
      - name: Official M03 release136 to RC137 isolated upgrade and tamper refusal
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$RUNNER_TEMP/p07-m03-rc137/package"
          sandbox="$RUNNER_TEMP/p07-m03-rc137/isolated-upgrade"
          mkdir -p "$sandbox/bin" "$sandbox/business"
          printf 'KEEP_OWNER_ASSET' > "$sandbox/business/unchanged.txt"
          export P07_ALLOW_NONROOT=1 P07_NO_EXEC=1
          export P07_INSTALL_DIR="$sandbox/live"
          export P07_PREVIOUS_DIR="$sandbox/previous"
          export P07_BIN_LINK="$sandbox/bin/vfops-rc"
          bash .p07-public/installers/p07-m03-release136-atomic.sh install > "$sandbox/stable-install.out"
          test "$(cat "$sandbox/live/BUILD_ID")" = "0.1.0-release136"
          export P07_PUBLIC_ROOT="file://$stage"
          bash "$stage/installers/p07.sh" > "$sandbox/upgrade.out"
          test "$(cat "$sandbox/live/BUILD_ID")" = "0.1.0-release137-rc1"
          test "$(cat "$sandbox/previous/BUILD_ID")" = "0.1.0-release136"
          test "$(NO_COLOR=1 "$sandbox/bin/vfops-rc" --build-id)" = "0.1.0-release137-rc1"
          test "$(cat "$sandbox/business/unchanged.txt")" = KEEP_OWNER_ASSET
          echo P07_M03_STABLE136_TO_RC137_ATOMIC_UPGRADE=PASS
          bash "$stage/installers/p07.sh" > "$sandbox/second.out"
          test "$(cat "$sandbox/previous/BUILD_ID")" = "0.1.0-release136"
          echo P07_M03_PREVIOUS_ROLLBACK_SNAPSHOT_RETAINED=PASS
      - name: Seal reproducible M03-only owner trial ZIP in ephemeral private checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$RUNNER_TEMP/p07-m03-rc137/package"
          export P07_OWNER_TRIAL_STAGE="$stage"
          python3 - <<'PY'
          import hashlib,json,os,stat,zipfile
          from pathlib import Path
          root=Path(os.environ["P07_OWNER_TRIAL_STAGE"])
          out=root.parent/"private-release"
          out.mkdir(mode=0o700)
          att=json.loads((root/"candidate_attestation.json").read_text("utf-8"))
          assert att["status"]=="CANDIDATE_ONLY_NOT_PUBLISHED"
          assert att["product_source_sha"]=="deecb4b621957f847fa68224508d83d024d282b1"
          assert att["product_build"]=="0.1.0-release137-rc1"
          assert att["independent_module_only"] and not att["other_modules_changed"]
          overlay=root/"dist/p07/0.1.0/overlay"
          manifest=overlay/"RUNTIME.gitblob"
          files=[
              ("candidate/candidate_attestation.json",root/"candidate_attestation.json"),
              ("candidate/installers/p07-final.sh",root/"installers/p07-final.sh"),
              ("candidate/installers/p07.sh",root/"installers/p07.sh"),
              ("candidate/dist/p07/0.1.0/overlay/RUNTIME.gitblob",manifest),
              ("candidate/dist/p07/0.1.0-rc2/P07_VF_SERVER_OPS_0.1.0-rc2.tar.gz",
               root/"dist/p07/0.1.0-rc2/P07_VF_SERVER_OPS_0.1.0-rc2.tar.gz"),
          ]
          present=set()
          for row in manifest.read_text(encoding="utf-8").splitlines():
              digest,name=row.split("  ",1)
              data=(overlay/name).read_bytes()
              blob=hashlib.sha1(b"blob "+str(len(data)).encode()+b"\x00"+data).hexdigest()
              assert blob==digest,"M03_RUNTIME_BLOB_INVALID"
              present.add(name)
              files.append(("candidate/dist/p07/0.1.0/overlay/"+name,overlay/name))
          assert {"bin/vfops-migrate-ui","lib/server_migration_pull.py",
                  "lib/migration_target_inventory_guard.py"}<=present
          instructions=(
              "P07 M03-D04 release137-rc1 OWNER TRIAL ONLY\n"
              "This is a private isolated development candidate, NOT FORMAL RELEASE.\n"
              "Product source: deecb4b621957f847fa68224508d83d024d282b1\n"
              "Published M03 release136 remains official and unaffected.\n"
              "Do not install or run on existing owner CP2, production VPS or DNS.\n"
              "Requires a separate owner-authorized, UNUSED test target.\n"
              "Do not replay legacy original 18-site migration task or failed prepare.\n"
              "No production migration, cross-engine conversion, site cutover or DNS proven.\n"
              "Other P07 modules M01/M02/M04/M05 unchanged.\n"
          ).encode("utf-8")
          files.append(("candidate/OWNER_TRIAL_SCOPE.txt",instructions))
          artifact=out/"P07-M03-D04-0.1.0-release137-rc1-OWNER-TRIAL.zip"
          def bundle(path):
              with zipfile.ZipFile(path,"x",compression=zipfile.ZIP_DEFLATED,
                                   compresslevel=9,allowZip64=False) as z:
                  for name,source in sorted(files):
                      item=source if isinstance(source,bytes) else source.read_bytes()
                      assert not name.startswith("/") and ".." not in Path(name).parts
                      mode=0o755 if name.endswith(".sh") else 0o644
                      info=zipfile.ZipInfo(name,(2026,1,1,0,0,0))
                      info.compress_type=zipfile.ZIP_DEFLATED
                      info.external_attr=(stat.S_IFREG|mode)<<16
                      z.writestr(info,item)
          bundle(artifact)
          check=out/"rebuild.zip"
          bundle(check)
          digest=hashlib.sha256(artifact.read_bytes()).hexdigest()
          assert hashlib.sha256(check.read_bytes()).hexdigest()==digest
          check.unlink()
          with zipfile.ZipFile(artifact) as z:
              assert len(z.namelist())==len(files)==len(set(z.namelist()))
              for name,source in files:
                  assert z.read(name)==(source if isinstance(source,bytes) else source.read_bytes())
          (out/"SHA256SUMS").write_text(digest+"  "+artifact.name+"\n",encoding="ascii")
          print("P07_M03_D04_PRIVATE_RELEASE_ZIP_SHA256="+digest)
          print("P07_M03_D04_PRIVATE_RELEASE_ENTRIES="+str(len(files)))
          print("P07_M03_D04_PRIVATE_RELEASE_NO_PUBLIC_ARTIFACT=PASS")
          PY
      - name: Verify PRIVATE owner trial draft by release ID before publication
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN" || { echo "P07_TRIAL_RELEASE_WRITE_CAPABILITY_NOT_AVAILABLE"; exit 78; }
          repo="llhzx2018/vf-server-ops"
          tag="p07-m03-d04-v0.1.0-release137-rc1-owner-trial"
          target="deecb4b621957f847fa68224508d83d024d282b1"
          dir="$RUNNER_TEMP/p07-m03-rc137/private-release"
          name="P07-M03-D04-0.1.0-release137-rc1-OWNER-TRIAL.zip"
          test "$(gh api "repos/$repo/git/ref/heads/p07-m03-d04-source-sqlite-coverage-20261114" --jq .object.sha)" = "$target"
          existing="$(gh api "repos/$repo/releases?per_page=100")"
          count="$(jq --arg tag "$tag" '[.[]|select(.tag_name==$tag)]|length' <<< "$existing")"
          test "$count" = 1 || { echo P07_TRIAL_DRAFT_UNIQUE_ID_REQUIRED; exit 77; }
          entry="$(jq -c --arg tag "$tag" '.[]|select(.tag_name==$tag)' <<< "$existing")"
          id="$(jq -r .id <<< "$entry")"
          test "$(jq -r .draft <<< "$entry")" = true
          test "$(jq -r .prerelease <<< "$entry")" = true
          test "$(jq -r .target_commitish <<< "$entry")" = "$target"
          test "$(jq -r '.assets|length' <<< "$entry")" = 2
          asset="$(jq -c --arg name "$name" '.assets[]|select(.name==$name)' <<< "$entry")"
          test -n "$asset" || { echo P07_TRIAL_ZIP_ASSET_MISSING; exit 77; }
          test "$(jq -r .size <<< "$asset")" = "$(stat -c %s "$dir/$name")"
          digest="$(sha256sum "$dir/$name" | cut -d ' ' -f1)"
          test "$(cut -d ' ' -f1 "$dir/SHA256SUMS")" = "$digest"
          test "$(jq -r --arg name "$name" '[.assets[].name]|index($name)!=null' <<< "$entry")" = true
          mkdir -p "$dir/readback"
          asset_id="$(jq -r .id <<< "$asset")"
          gh api "repos/$repo/releases/assets/$asset_id" \
            -H 'Accept: application/octet-stream' \
            > "$dir/readback/$name"
          (cd "$dir/readback" && sha256sum -c "../SHA256SUMS")
          echo P07_PRIVATE_DRAFT_RELEASE_ASSET_READBACK_SHA256=PASS
          gh api --method PATCH "repos/$repo/releases/$id" \
            -F draft=false -F prerelease=true > "$dir/release-patch.json"
          test "$(jq -r .draft "$dir/release-patch.json")" = false
          test "$(jq -r .prerelease "$dir/release-patch.json")" = true
          published="$(gh api "repos/$repo/releases/tags/$tag")"
          test "$(jq -r .draft <<< "$published")" = false
          test "$(jq -r .prerelease <<< "$published")" = true
          test "$(jq -r '.assets|length' <<< "$published")" = 2
          echo P07_PRIVATE_OWNER_TRIAL_PUBLISHED_VERIFIED=PASS
          echo "P07_PRIVATE_OWNER_TRIAL_SHA256=$digest"
          echo "P07_PRIVATE_OWNER_TRIAL_RELEASE_TAG=$tag"
          echo P07_PRIVATE_OWNER_TRIAL_FORMAL_RELEASE=NO
          echo P07_PRIVATE_OWNER_TRIAL_PRODUCTION_CHANGED=NO
      - name: Always clean private material and staged RC candidate
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- .p07-private .p07-gov .p07-public "$RUNNER_TEMP/p07-m03-rc137"
          test ! -e .p07-private && test ! -e .p07-gov && test ! -e .p07-public
          echo P07_PRIVATE_SOURCE_AND_CANDIDATE_CLEAN=PASS
