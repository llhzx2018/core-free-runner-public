name: P07 D04 one-site and whole-VPS occupied-target inventory guard TEMP
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-m03-d04-sql-opcode-class-20261115.yml'
permissions:
  contents: read
jobs:
  migration-target-inventory-guard:
    if: github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'synchronize'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact private P07 D04 source in ephemeral workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: fbe8066673d1717a558f089fb650f0c1e051869a
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: .p07-private-exact
      - name: Checkout shared GOV source for actual architecture validation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: .p07-gov
      - name: New D04 single and whole migration guard regression and architecture
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-private-exact rev-parse HEAD)" = fbe8066673d1717a558f089fb650f0c1e051869a
          cd .p07-private-exact
          export PYTHONPATH="$PWD/lib"
          python3 -B -m unittest discover -s tests \
            -p test_p07_m03_d04_target_inventory_guard.py -v
          python3 -B scripts/check_p07_modules.py
          python3 -B .github/checks/test_architecture_gate.py
          python3 -B .github/checks/architecture_gate.py \
            --manifest .github/checks/code_architecture.json \
            --gov-root ../.p07-gov --git-root . \
            --base-sha a6da82f35fdbd06020a7e65c8cbd5717f617f2f3 --head-sha fbe8066673d1717a558f089fb650f0c1e051869a
          python3 - <<'PY'
          import subprocess
          changes=set(subprocess.check_output([
              "git","diff","--name-only","232354f425c90296efb793f95b942a15fd95f06b","fbe8066673d1717a558f089fb650f0c1e051869a"
          ], text=True).splitlines())
          expected={"lib/migration_target_inventory_guard.py",
                    "lib/server_migration_pull.py",
                    "tests/test_p07_m03_d04_target_inventory_guard.py",
                    "docs/authority/P07_MODULE_REGISTRY.json",
                    "docs/authority/RPD.md"}
          assert changes==expected, "P07_D04_SCOPE_DRIFT"
          base=subprocess.check_output(
              ["git","show","232354f425c90296efb793f95b942a15fd95f06b:lib/server_migration_pull.py"],
              text=True)
          new=open("lib/server_migration_pull.py",encoding="utf-8").read()
          assert len(new.splitlines()) <= len(base.splitlines()), "D04_LEGACY_FILE_GREW"
          print("P07_D04_SINGLE_AND_FULL_TARGET_SCOPE_GUARD=PASS")
          print("P07_D04_D05_AND_FOUR_MODULES_UNCHANGED=PASS")
          PY
      - name: Always scrub private checkouts
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- .p07-private-exact .p07-gov
          test ! -e .p07-private-exact && test ! -e .p07-gov
          echo P07_D04_PRIVATE_WORKSPACE_CLEAN=PASS
