name: P07-M03-D04 source SQL redacted classification exact-source proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-m03-d04-sql-opcode-class-20261115.yml'
permissions:
  contents: read
jobs:
  source-sql-class-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact private P07 product source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: e5a4d6828962d33733bcc7f2216a067b048c35b4
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: .p07-private-exact
      - name: Verify fixed-class diagnostics and unchanged SQL guards
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-private-exact rev-parse HEAD)" = e5a4d6828962d33733bcc7f2216a067b048c35b4
          (
            cd .p07-private-exact
            export PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 PYTHONPATH="$PWD/lib"
            python3 -B -m unittest discover -s tests -p test_p07_m03_source_sql_safety_preimport.py -v
            python3 -B -m unittest discover -s tests -p test_migration_safe_session_guard.py -v
            python3 -B -m unittest discover -s tests -p test_cross_engine_sql_format.py -v
            python3 -B -m unittest discover -s tests -p test_p07_m03_dynamic_sqlite_scope.py -v
          )
          echo P07_M03_D04_SOURCE_SQL_COMMAND_CLASS_EXACT_SOURCE=PASS
      - name: Scrub transient product checkout
        if: always()
        shell: bash
        run: |
          rm -rf -- .p07-private-exact
          test ! -e .p07-private-exact
          echo P07_M03_D04_PRIVATE_SOURCE_CLEANED=PASS
