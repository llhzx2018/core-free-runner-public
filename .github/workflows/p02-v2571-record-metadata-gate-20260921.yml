name: P02 V2.5.71 Record Metadata Gate

on:
  push:
    branches:
      - task/p02-v2571-record-metadata-gate-20260921
    paths:
      - '.github/workflows/p02-v2571-record-metadata-gate-20260921.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PRODUCT_BRANCH: p02-inkstone-fine-polish-r9-record-metadata
      EXPECTED_SOURCE: 9cd3f813cc9ee26633947bdef71488eac48f7d74
      EXPECTED_VERSION: 2.5.71
    steps:
      - name: Require registered private read capability
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: test -n "$PRIVATE_READ_TOKEN"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, zip, curl, mbstring, openssl
          coverage: none

      - name: Checkout exact P02 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.PRODUCT_BRANCH }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product

      - name: Verify exact source identity
        working-directory: product
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test "$(tr -d '\r\n' < VERSION)" = "$EXPECTED_VERSION"
          echo "P02_V2571_EXACT_SOURCE=$EXPECTED_SOURCE"

      - name: Repository and unit gates
        working-directory: product
        run: |
          bash scripts/verify-repository.sh
          while IFS= read -r cmd; do
            test -n "$cmd"
            eval "$cmd"
          done < <(awk '/run: node tests\/unit\//{sub(/^.*run: /,""); print}' .github/workflows/repository-health.yml)
          node --check public/assets/app.js
          node --check public/assets/system-theme.js
          node --check public/assets/v2537-inkstone-shell.js
          git diff --check
          echo P02_V2571_REPOSITORY_AND_UNIT_GATE=PASS

      - name: Install Chromium harness
        working-directory: product
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Real Chromium UX gate
        working-directory: product
        run: |
          bash scripts/ux-browser-reverify.sh
          echo P02_V2571_REAL_CHROMIUM_GATE=PASS

      - name: Remove transient private checkout
        if: always()
        run: rm -rf product
