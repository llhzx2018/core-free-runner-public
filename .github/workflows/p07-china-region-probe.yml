name: P07 China Region Probe

on:
  push:
    branches: [feature/p07-vps-audit-rc4-china-regions]
    paths:
      - '.github/workflows/p07-china-region-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Download verified speedtest-go
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/showwin/speedtest-go/releases/download/v1.8.3/speedtest-go_1.8.3_Linux_x86_64.tar.gz'
          expected='c55caae22927cd719a2f8c0bef96ecf74b5fe8ca919ff9200d76328ae5de9477'
          curl -fsSL "$url" -o /tmp/stg.tgz
          test "$(sha256sum /tmp/stg.tgz | awk '{print $1}')" = "$expected"
          mkdir -p /tmp/stg
          tar -xzf /tmp/stg.tgz -C /tmp/stg
          chmod +x /tmp/stg/speedtest-go

      - name: Real China region probe
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            local name="$1" coords="$2" out="/tmp/${1}.json"
            echo "=== $name ($coords) ==="
            set +e
            timeout 90s /tmp/stg/speedtest-go --json --saving-mode --thread 1 --location="$coords" --ping-mode http >"$out" 2>"${out}.err"
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              echo "RESULT=FAIL rc=$rc"
              sed -n '1,8p' "${out}.err" || true
              return 0
            fi
            python3 -c 'import json,sys; p=json.load(open(sys.argv[1])); s=(p.get("servers") or [None])[0];
if s is None: print("RESULT=FAIL no_servers"); raise SystemExit(0)
try:
 u=float(s["ul_speed"])/125000; d=float(s["dl_speed"])/125000; l=float(s["latency"])/1000000; print(f"RESULT=PASS up={u:.2f}Mbps down={d:.2f}Mbps latency={l:.2f}ms server={s.get(\"name\",\"\")} sponsor={s.get(\"sponsor\",\"\")}")
except Exception as e: print("RESULT=FAIL parse",type(e).__name__)' "$out"
          }
          probe Beijing  '39.9042,116.4074'
          probe Shanghai '31.2304,121.4737'
          probe Guangzhou '23.1291,113.2644'
          probe Chengdu '30.5728,104.0668'
