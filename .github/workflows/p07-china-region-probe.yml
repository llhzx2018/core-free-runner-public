name: P07 China Region Probe

on:
  push:
    branches: [feature/p07-vps-audit-rc4-china-regions]
    paths:
      - '.github/workflows/p07-china-region-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Download verified speedtest-go
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/showwin/speedtest-go/releases/download/v1.8.3/speedtest-go_1.8.3_Linux_x86_64.tar.gz'
          expected='c55caae22927cd719a2f8c0bef96ecf74b5fe8ca919ff9200d76328ae5de9477'
          curl -fsSL "$url" -o /tmp/stg.tgz
          test "$(sha256sum /tmp/stg.tgz | awk '{print $1}')" = "$expected"
          mkdir -p /tmp/stg
          tar -xzf /tmp/stg.tgz -C /tmp/stg
          chmod +x /tmp/stg/speedtest-go

      - name: Real China region probe
        shell: bash
        run: |
          set -euo pipefail
          : >/tmp/p07-china-results.txt
          probe() {
            local name="$1" coords="$2" out="/tmp/${1}.json" line
            echo "=== $name ($coords) ===" | tee -a /tmp/p07-china-results.txt
            set +e
            timeout 90s /tmp/stg/speedtest-go --json --saving-mode --thread 1 --location="$coords" --ping-mode http >"$out" 2>"${out}.err"
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              line="RESULT=FAIL region=$name rc=$rc"
              echo "$line" | tee -a /tmp/p07-china-results.txt
              sed -n '1,8p' "${out}.err" | tee -a /tmp/p07-china-results.txt || true
              return 0
            fi
            line="$(python3 -c 'import json,sys; p=json.load(open(sys.argv[1])); s=(p.get("servers") or [{}])[0]; print("RESULT=PASS region=%s up=%.2fMbps down=%.2fMbps latency=%.2fms server=%s sponsor=%s"%(sys.argv[2],float(s["ul_speed"])/125000,float(s["dl_speed"])/125000,float(s["latency"])/1000000,s.get("name",""),s.get("sponsor","")))' "$out" "$name" 2>/dev/null || echo "RESULT=FAIL region=$name parse")"
            echo "$line" | tee -a /tmp/p07-china-results.txt
          }
          probe Beijing  '39.9042,116.4074'
          probe Shanghai '31.2304,121.4737'
          probe Guangzhou '23.1291,113.2644'
          probe Chengdu '30.5728,104.0668'
          echo '--- SUMMARY ---' | tee -a /tmp/p07-china-results.txt
          cat /tmp/p07-china-results.txt

      - name: Upload China probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: p07-china-region-probe-${{ github.run_id }}
          path: /tmp/p07-china-results.txt
          if-no-files-found: error
          retention-days: 14
