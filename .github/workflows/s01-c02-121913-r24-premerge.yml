name: S01-C02 1.21.913 R24 Pre-Merge Gate

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CANDIDATE_SHA: 1b13f2af88b8d5649ba7fd1f13aaada4a7c5965a
      BASE_SHA: 3677940d4c60f04a0d744d4accbb6884bcd4fa07

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 1b13f2af88b8d5649ba7fd1f13aaada4a7c5965a
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: ops
          persist-credentials: false

      - name: Verify R24 exact scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(tr -d '\r\n' < ops/VERSION)" = "1.21.913"
          grep -Fq 'S01-INTERACTION-LANGUAGE-R24' ops/vf-ops.php
          php ops/tests/s01-c02-121913-interaction-language-r24-contract.php
          php -l ops/vf-ops.php >/dev/null

          actual="$(git -C ops diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" | sort)"
          expected="$(printf '%s\n'             CHANGELOG.md             VERSION             assets/css/current/admin-s01-content-seo-r16.css             assets/css/current/admin-s01-dashboard-r14.css             assets/css/current/admin-s01-quality-r17.css             assets/css/current/admin-s01-system-publish-r13.css             assets/css/current/admin-s01-tools-r15.css             assets/css/current/admin-s01-v6-shell-r1.css             tests/s01-c02-121913-interaction-language-r24-contract.php             vf-ops.php | sort)"
          test "$actual" = "$expected"

          python3 - <<'PY'
          from pathlib import Path
          files=[
            'admin-s01-dashboard-r14.css',
            'admin-s01-tools-r15.css',
            'admin-s01-content-seo-r16.css',
            'admin-s01-quality-r17.css',
            'admin-s01-system-publish-r13.css',
          ]
          for name in files:
              s=(Path('ops/assets/css/current')/name).read_text(encoding='utf-8')
              assert s.count('{')==s.count('}'), name
              assert 'var(--vf-v6-brand)' in s, name
              assert 'var(--vf-v6-brand-deep)' in s, name
              assert 'var(--vf-v6-control-border)' in s, name
              assert 'var(--vf-v6-control-radius)' in s, name

          system=Path('ops/assets/css/current/admin-s01-system-publish-r13.css').read_text(encoding='utf-8')
          assert 'font-size:var(--vf-v6-state-font-size)!important' in system
          assert 'width:var(--vf-v6-state-dot-size)!important' in system
          assert '.vf-v9-state.is-pass{border-color:#c8e4d8' not in system
          assert 'min-height:var(--vf-v6-table-head-min-height)!important' in system
          assert 'font-size:var(--vf-v6-table-head-font-size)!important' in system
          print('PASS_R24_INTERACTION_LANGUAGE')
          PY

          test "$(git -C ops diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" -- database config includes/v6 includes/wp-update docs/authority | wc -l)" = "0"
          echo PASS_S01_C02_121913_R24_PREMERGE
