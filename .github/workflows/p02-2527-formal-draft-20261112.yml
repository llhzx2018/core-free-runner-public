name: P02 v2.5.127 19-source verified formal artifacts to PRIVATE DRAFT ONLY
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p02-2527-formal-draft-20261112.yml']
permissions:
  contents: read
jobs:
  private-formal-preparation:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - name: Exact immutable PRIVATE P02 source checkout
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-library
          ref: c0cc9412a684aa463c3cbf3a63483ea0dacb25a2
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: product
          persist-credentials: false
      - name: Confirm completed all-source machine evidence before any draft write
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = 'c0cc9412a684aa463c3cbf3a63483ea0dacb25a2'
          test "$(cat product/VERSION)" = '2.5.127'
          result="$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/43134717031 --jq .conclusion)"
          test "$result" = success
          test -n "${GH_TOKEN:-}"
          test "$(gh api repos/llhzx2018/vf-library/branches/main --jq .commit.sha)" = 'c0cc9412a684aa463c3cbf3a63483ea0dacb25a2'
          test "$(gh api repos/llhzx2018/core-updates/contents/projects/P02.json?ref=main --jq .content | base64 -d | python3 -c 'import sys,json;print(json.load(sys.stdin)["target_version"])')" = '2.5.124'
          if gh api repos/llhzx2018/vf-library/git/ref/tags/v2.5.127 >/dev/null 2>&1; then
            echo P02_FORMAL_TAG_EXISTS_STOP
            exit 1
          fi
          if gh api repos/llhzx2018/vf-library/releases/tags/v2.5.127 >/dev/null 2>&1; then
            echo P02_FORMAL_DRAFT_ALREADY_EXISTS_STOP
            exit 1
          fi
          echo P02_FORMAL_19_SOURCE_PREPUB_PROOF=PASS
          echo P02_FORMAL_RELEASE_COLLISION=NONE
      - name: Reproduce 19-source formal assets twice, bind source and no private files
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/build-release.py --out build/formal-2527-ready --source-version 2.5.81 --source-version 2.5.82 --source-version 2.5.102 --source-version 2.5.103 --source-version 2.5.104 --source-version 2.5.105 --source-version 2.5.111 --source-version 2.5.112 --source-version 2.5.113 --source-version 2.5.114 --source-version 2.5.115 --source-version 2.5.116 --source-version 2.5.117 --source-version 2.5.118 --source-version 2.5.119 --source-version 2.5.120 --source-version 2.5.121 --source-version 2.5.122 --source-version 2.5.124 --source-commit 'c0cc9412a684aa463c3cbf3a63483ea0dacb25a2' --source-ref main > "${RUNNER_TEMP}/p02-build-a.json"
          python3 scripts/build-release.py --out build/formal-2527-repeat --source-version 2.5.81 --source-version 2.5.82 --source-version 2.5.102 --source-version 2.5.103 --source-version 2.5.104 --source-version 2.5.105 --source-version 2.5.111 --source-version 2.5.112 --source-version 2.5.113 --source-version 2.5.114 --source-version 2.5.115 --source-version 2.5.116 --source-version 2.5.117 --source-version 2.5.118 --source-version 2.5.119 --source-version 2.5.120 --source-version 2.5.121 --source-version 2.5.122 --source-version 2.5.124 --source-commit 'c0cc9412a684aa463c3cbf3a63483ea0dacb25a2' --source-ref main > "${RUNNER_TEMP}/p02-build-b.json"
          python3 - <<'PY'
          import json,hashlib,zipfile
          from pathlib import Path
          a=Path('build/formal-2527-ready');b=Path('build/formal-2527-repeat')
          def sha(p):return hashlib.sha256(p.read_bytes()).hexdigest()
          aFiles={p.name:(p.stat().st_size,sha(p)) for p in a.iterdir() if p.is_file()}
          bFiles={p.name:(p.stat().st_size,sha(p)) for p in b.iterdir() if p.is_file()}
          assert len(aFiles)==8 and aFiles==bFiles,('FORMAL_NONDETERMINISTIC',len(aFiles))
          def ver(s):return tuple(map(int,s.split('.')))
          expected=['2.5.81','2.5.82','2.5.102','2.5.103','2.5.104','2.5.105','2.5.111','2.5.112','2.5.113','2.5.114','2.5.115','2.5.116','2.5.117','2.5.118','2.5.119','2.5.120','2.5.121','2.5.122','2.5.124']
          m=json.loads((a/'VF_Library_V2.5.127_RELEASE_MANIFEST.json').read_text())
          assert m['source']['candidate_commit']=='c0cc9412a684aa463c3cbf3a63483ea0dacb25a2'
          assert m['build']['runtime_source_files']==73 and m['version']=='2.5.127'
          assert m['compatibility']['supported_from']==expected
          assert m['compatibility']['schema_migration'] is False
          assert m['git']['formal_tag'] is None and m['deployment']['status']=='NOT_EXECUTED'
          with zipfile.ZipFile(a/'VF_Library_V2.5.127_UPDATE.zip') as z:
            zmap=json.loads(z.read('atomic-manifest.json'))
            assert zmap['source_versions']==expected and zmap['target_version']=='2.5.127'
            assert len(zmap['files'])==73 and z.testzip() is None
          with zipfile.ZipFile(a/'VF_Library_V2.5.127_FULL.zip') as z:
            assert json.loads(z.read('release-manifest.json'))['release_state']=='FORMAL_RELEASE'
            assert z.testzip() is None
          for line in (a/'SHA256SUMS.txt').read_text().strip().splitlines():
            digest,name=line.split('  ',1)
            assert sha(a/name)==digest
          print('P02_FORMAL_19_SOURCE_ARTIFACT_REPRODUCIBILITY=PASS')
          print('P02_FORMAL_SOURCE_AND_PRIVACY_IDENTITIES=PASS')
          for name in sorted(aFiles):
            print('P02_FORMAL_PREPARED_ASSET='+name+';BYTES='+str(aFiles[name][0])+';SHA256='+aFiles[name][1])
          PY
      - name: Upload immutable artifacts to P02 PRIVATE DRAFT without publishing
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          repo=llhzx2018/vf-library
          tag=v2.5.127
          cd product/build/formal-2527-ready
          test -n "${GH_TOKEN:-}"
          cat > "${RUNNER_TEMP}/p02-2527-formal-draft-notes.txt" <<'EOF'
          VF LIBRARY v2.5.127 - FORMAL PUBLICATION PREPARATION DRAFT
          NOT PUBLISHED, NOT A LIVE TAG, NOT IN CORE-UPDATES. No Production operation.
          Exact source: c0cc9412a684aa463c3cbf3a63483ea0dacb25a2. Schema 2401, same SQLite authority, no migration.
          Contains W1 opt-in Vue search 390/768/1440 and D3 bounded 24-hour idempotent Quick capture.
          From_versions = 2.5.81, 2.5.82, 2.5.102, 2.5.103, 2.5.104, 2.5.105, 2.5.111, 2.5.112, 2.5.113, 2.5.114, 2.5.115, 2.5.116, 2.5.117, 2.5.118, 2.5.119, 2.5.120, 2.5.121, 2.5.122, 2.5.124 (19 source formal upgrade matrix).
          Isolated full 19-source real upgrades and synthetic Material + Scratch preservation,
          rollback and official old FULL digest test: https://github.com/llhzx2018/core-free-runner-public/actions/runs/43134717031
          Clean FULL, deterministic release artifacts, Public Authority structural lint PASS in same runner.
          Real W1 isolated Chromium 37 checks: https://github.com/llhzx2018/core-free-runner-public/actions/runs/43129516583
          Release/Channel/Production are strictly separate. Await independently authorized Publication and
          live Production current version check, then verify Git tag, assets, core-updates and real discovery.
          FULL is ONLY for empty site. Existing site must use verified Atomic/Update via official channel.
          OWNER will perform Production upgrade and real-use acceptance separately; NO automatic apply.
          EOF
          gh release create "$tag" -R "$repo" --draft --prerelease --target 'c0cc9412a684aa463c3cbf3a63483ea0dacb25a2'             --title 'VF Library v2.5.127 - FORMAL PREPARATION DRAFT' --notes-file "${RUNNER_TEMP}/p02-2527-formal-draft-notes.txt"
          gh release upload "$tag" -R "$repo"             VF_Library_V2.5.127_FULL.zip VF_Library_V2.5.127_ATOMIC.zip             VF_Library_V2.5.127_UPDATE.zip VF_Library_V2.5.127_SOURCE.zip             repair-v2.5.127.php VF_Library_V2.5.127_RELEASE_MANIFEST.json             VF_Library_V2.5.127_RELEASE_NOTES.md SHA256SUMS.txt
          gh api repos/$repo/releases/tags/$tag > "${RUNNER_TEMP}/p02-2527-draft-record.json"
          python3 - <<'PY'
          import os,hashlib,json
          from pathlib import Path
          r=json.loads(Path(os.environ['RUNNER_TEMP'],'p02-2527-draft-record.json').read_text())
          assert r['draft'] is True and r['prerelease'] is True and r['published_at'] is None
          assert r['target_commitish']=='c0cc9412a684aa463c3cbf3a63483ea0dacb25a2' and r['tag_name']=='v2.5.127'
          expected={p.name:(p.stat().st_size,'sha256:'+hashlib.sha256(p.read_bytes()).hexdigest()) for p in Path('.').iterdir() if p.is_file()}
          assert len(expected)==8
          assets={a['name']:a for a in r['assets']}
          assert set(assets)==set(expected)
          for name,(size,digest) in expected.items():
            assert assets[name]['state']=='uploaded' and assets[name]['size']==size
            assert assets[name]['digest']==digest
            print('P02_FORMAL_DRAFT_ASSET='+name+';ID='+str(assets[name]['id'])+';BYTES='+str(size)+';SHA256='+digest[7:])
          print('P02_FORMAL_19_SOURCE_PRIVATE_DRAFT_READBACK=PASS')
          print('P02_FORMAL_DRAFT_ID='+str(r['id']))
          print('P02_FORMAL_DRAFT_URL='+str(r['html_url']))
          print('P02_FORMAL_RELEASE_PUBLISHED=NO')
          print('P02_FORMAL_CHANNEL_UPDATED=NO')
          print('P02_FORMAL_PRODUCTION_UPDATED=NO')
          PY
      - name: Remove transient private source and asset bytes
        if: always()
        shell: bash
        run: |
          rm -rf product
          echo PRIVATE_SOURCE_AND_FORMAL_BYTES_IN_PUBLIC_ARTIFACT=NO
