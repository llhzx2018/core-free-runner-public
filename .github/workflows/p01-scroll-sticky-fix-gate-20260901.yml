name: P01 Scroll Sticky Fix Gate
on:
  push:
    branches: [release/p01-v2362-candidate-20260901]
    paths: [.github/workflows/p01-scroll-sticky-fix-gate-20260901.yml]
permissions:
  contents: read
  actions: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BASE: 4ec93adad93977a519675b55806866c896bad09f
      BRANCH: product/p01-scroll-sticky-clarity-20260901
      ROOT: ${{ github.workspace }}/product/src
      EVID: /tmp/p01-scroll-sticky-fix
      PORT: '18831'
      ADMIN_PASS: P01ScrollFix2026
    steps:
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - name: Checkout exact Product branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Apply one-file shared sticky repair
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$EVID"; mkdir -p "$EVID/screens"
          cd product
          test "$(git rev-parse HEAD)" = "$BASE"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/assets/workspace-domain-nav.css')
          s=p.read_text(encoding='utf-8')
          old='.vf-functional-workspace .vf-workspace-toolbar{top:calc(var(--ws-domain-nav) + var(--ws-topbar) + 8px);padding:4px 0;border-left:0;border-right:0;border-radius:0;background:transparent}'
          new='.vf-functional-workspace .vf-workspace-toolbar{top:calc(var(--ws-domain-nav) + var(--ws-topbar));padding:4px 0;border-left:0;border-right:0;border-radius:0;background:var(--ws-bg)}'
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          test "$(git diff --name-only)" = src/assets/workspace-domain-nav.css
          git diff --check
          grep -F 'top:calc(var(--ws-domain-nav) + var(--ws-topbar));padding:4px 0;border-left:0;border-right:0;border-radius:0;background:var(--ws-bg)' src/assets/workspace-domain-nav.css >/dev/null
          ! grep -F 'top:calc(var(--ws-domain-nav) + var(--ws-topbar) + 8px);padding:4px 0;border-left:0;border-right:0;border-radius:0;background:transparent' src/assets/workspace-domain-nav.css >/dev/null
          test "$(cat VERSION)" = 2.36.2
          test "$(cat src/VERSION.txt)" = 2.36.2
          test -z "$(git diff --name-only -- database)"
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add src/assets/workspace-domain-nav.css
          git commit -m 'fix(P01): keep sticky filters opaque while scrolling'
          CANDIDATE=$(git rev-parse HEAD)
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git diff --name-only "$BASE..HEAD")" = src/assets/workspace-domain-nav.css
          printf 'BASE=%s\nCANDIDATE=%s\nTREE=%s\nRUNTIME_TREE=%s\nSCOPE=src/assets/workspace-domain-nav.css\nSCHEMA_CHANGE=NO\nMIGRATION=NONE\n' "$BASE" "$CANDIDATE" "$(git rev-parse HEAD^{tree})" "$(git rev-parse HEAD:src)" | tee "$EVID/source.txt"
      - name: Fresh runtime and long-page seed
        shell: bash
        run: |
          set -Eeuo pipefail
          php -S 127.0.0.1:$PORT -t "$ROOT" >"$EVID/server.log" 2>&1 & echo $! >/tmp/p01-scroll-sticky-fix.pid
          C="$EVID/setup.cookies"
          for i in $(seq 1 60); do curl -fsS -c "$C" -b "$C" "http://127.0.0.1:$PORT/setup.php" -o "$EVID/setup.html" && break; sleep .25; done
          CSRF=$(python3 - "$EVID/setup.html" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c "$C" -b "$C" -X POST "http://127.0.0.1:$PORT/setup.php" --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=P01 Scroll Fix Gate' --data-urlencode "admin_password=$ADMIN_PASS" --data-urlencode "admin_password_confirm=$ADMIN_PASS" -o "$EVID/setup-post.html"
          ROOT="$ROOT" php <<'PHP' | tee "$EVID/seed.txt"
          <?php
          require getenv('ROOT').'/app/bootstrap.php'; require getenv('ROOT').'/app/SurfaceRepository.php';
          $db=vf_db();$r=new VfRepository($db);$s=new VfSurfaceRepository($db);$cats=[];
          for($c=1;$c<=8;$c++)$cats[]=$r->createCategory(['name'=>'滚动分类'.$c,'description'=>'','icon'=>'','is_private'=>0,'sort_order'=>$c]);
          $save=function($title,$url,$cat)use($r){return (int)$r->saveLink(null,['category_id'=>$cat,'title'=>$title,'url'=>$url,'description'=>'滚动修复门禁','tags'=>'scroll-fix','is_private'=>0],'manual')['id'];};
          for($i=1;$i<=96;$i++)$save('导航测试 '.$i,'https://example.com/start-'.$i,$cats[$i%8]);
          for($i=1;$i<=48;$i++){ $id=$save('频道测试 '.$i,'https://www.youtube.com/@scroll-fix-'.$i,$cats[$i%8]);$s->upsertProfile($id,['surface'=>'channels','resource_kind'=>'频道']); }
          for($i=1;$i<=48;$i++){ $id=$save('影视测试 '.$i,'https://example.com/watch-'.$i,$cats[$i%8]);$s->upsertProfile($id,['surface'=>'watch','resource_kind'=>'电影','media_year'=>(string)(2000+$i%26)]); }
          for($i=1;$i<=40;$i++){ $id=$save('专题测试 '.$i,'https://example.com/topic-'.$i,$cats[$i%8]);$s->upsertProfile($id,['surface'=>'topics','resource_kind'=>'专题']); }
          echo "LONG_PAGE_SEED=PASS\n";
          PHP
      - name: Chromium 390 and 1440 sticky geometry gate
        shell: bash
        run: |
          set -Eeuo pipefail
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"; test -n "$CHROME"
          mkdir -p /tmp/p01-scroll-fix-pw; cd /tmp/p01-scroll-fix-pw
          npm init -y >/dev/null 2>&1; npm install playwright-core@1.55.0 >/dev/null 2>&1
          cat >gate.cjs <<'JS'
          const {chromium}=require('playwright-core'),fs=require('fs'),path=require('path');
          const base=`http://127.0.0.1:${process.env.PORT}/`,E=process.env.EVID,pass=process.env.ADMIN_PASS,routes=['start.php','channels.php','watch.php','topics.php'];
          const A=(v,m)=>{if(!v)throw Error(m)};
          const opaque=bg=>{const m=bg.match(/rgba?\(([^)]+)\)/);if(!m)return bg!=='transparent';const p=m[1].split(',').map(x=>x.trim());return p.length<4||Number(p[3])>0.98};
          (async()=>{const b=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox']});const out={};
            for(const width of [390,1440]){const ctx=await b.newContext({viewport:{width,height:width===390?844:900}});let q=await ctx.request.post(base+'api.php?action=login',{data:{password:pass}});A(q.ok()&&(await q.json()).ok,'login');const p=await ctx.newPage();out[width]={};
              for(const route of routes){await p.goto(base+route,{waitUntil:'domcontentloaded'});await p.waitForTimeout(180);const max=await p.evaluate(()=>Math.max(0,document.documentElement.scrollHeight-innerHeight));A(max>500,`page not long ${width} ${route} max=${max}`);await p.evaluate(y=>scrollTo(0,y),Math.round(max*.55));await p.waitForTimeout(180);
                const g=await p.evaluate(()=>{const q=s=>document.querySelector(s),r=e=>e?e.getBoundingClientRect():null,c=e=>e?getComputedStyle(e):null;const t=q('.vf-workspace-toolbar'),n=q('.vf-global-domain-nav'),s=q('.vf-app-topbar.vf-domain-subbar');return{toolbar:r(t),toolbarBg:c(t)?.backgroundColor||'',toolbarPos:c(t)?.position||'',toolbarZ:c(t)?.zIndex||'',nav:r(n),subbar:r(s),subbarDisplay:c(s)?.display||'',overflowX:document.documentElement.scrollWidth-document.documentElement.clientWidth,scrollY}});
                A(g.toolbar&&g.nav,`geometry missing ${width} ${route}`);A(g.toolbarPos==='sticky',`toolbar not sticky ${width} ${route}`);A(opaque(g.toolbarBg),`transparent toolbar ${width} ${route} ${g.toolbarBg}`);A(g.overflowX<=1,`overflow ${width} ${route} ${g.overflowX}`);
                if(width===1440){A(g.subbar&&g.subbarDisplay!=='none',`desktop subbar missing ${route}`);A(Math.abs(g.toolbar.y-g.subbar.bottom)<=1.5,`desktop gap/overlap ${route} toolbar=${g.toolbar.y} subbarBottom=${g.subbar.bottom}`);}else{A(Math.abs(g.toolbar.y-g.nav.bottom)<=1.5,`mobile gap/overlap ${route} toolbar=${g.toolbar.y} navBottom=${g.nav.bottom}`);}
                out[width][route]=g;await p.screenshot({path:path.join(E,'screens',`${width}-${route.replace('.php','')}-mid.png`),fullPage:false});
                await p.evaluate(y=>scrollTo(0,y),Math.round(max*.82));await p.waitForTimeout(120);const deep=await p.evaluate(()=>({overflowX:document.documentElement.scrollWidth-document.documentElement.clientWidth,bg:getComputedStyle(document.querySelector('.vf-workspace-toolbar')).backgroundColor,y:document.querySelector('.vf-workspace-toolbar').getBoundingClientRect().y}));A(opaque(deep.bg),`deep transparent ${width} ${route}`);A(deep.overflowX<=1,`deep overflow ${width} ${route}`);await p.screenshot({path:path.join(E,'screens',`${width}-${route.replace('.php','')}-deep.png`),fullPage:false});
              }await ctx.close();}
            fs.writeFileSync(path.join(E,'browser.json'),JSON.stringify(out,null,2));await b.close();console.log('P01_SCROLL_STICKY_FIX_BROWSER=PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          PORT="$PORT" EVID="$EVID" ADMIN_PASS="$ADMIN_PASS" CHROME="$CHROME" node gate.cjs | tee "$EVID/browser.txt"
          grep -Fx P01_SCROLL_STICKY_FIX_BROWSER=PASS "$EVID/browser.txt"
      - name: SQLite and publish candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$ROOT" php <<'PHP' | tee "$EVID/db.txt"
          <?php require getenv('ROOT').'/app/bootstrap.php';$d=vf_db();$i=strtolower((string)$d->query('PRAGMA integrity_check')->fetchColumn());$fk=$d->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC);if($i!=='ok'||$fk)exit(1);echo "INTEGRITY=ok\nFK=0\n";
          PHP
          cd product
          CANDIDATE=$(git rev-parse HEAD)
          test "$(git ls-remote origin refs/heads/$BRANCH | awk '{print $1}')" = "$BASE"
          git push origin HEAD:"refs/heads/$BRANCH"
          test "$(git ls-remote origin refs/heads/$BRANCH | awk '{print $1}')" = "$CANDIDATE"
          test "$(git ls-remote origin refs/heads/develop | awk '{print $1}')" = "$BASE"
          printf 'P01_SCROLL_STICKY_FIX_GATE=PASS\nCANDIDATE=%s\nBASE=%s\nSCOPE=ONE_CSS_FILE\nBROWSER=390+1440/4_ROUTES/MID+DEEP/PASS\nSQLITE=PASS\nDEVELOP_WRITE=NO\nMAIN_WRITE=NO\nOWNER_PRODUCTION_WRITE=NO\n' "$CANDIDATE" "$BASE" | tee "$EVID/verdict.txt"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-scroll-sticky-fix-${{ github.run_id }}
          path: /tmp/p01-scroll-sticky-fix
          if-no-files-found: warn
          retention-days: 30
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/p01-scroll-sticky-fix.pid 2>/dev/null)" 2>/dev/null || true
