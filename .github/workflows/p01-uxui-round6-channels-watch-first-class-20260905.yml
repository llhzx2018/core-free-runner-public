name: P01 UXUI Round6 Channels Watch First Class

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p01-uxui-round6-channels-watch-first-class-20260905.yml

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_SHA: b09a845f7d6ff37340616d61e95f92036b56b92a
      BASE_SHA: e649ad898face640b1cd1afe7d38bfeb93ebaa56
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: feature/p01-uxui-round6-channels-watch-first-class-20260905
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_sqlite,sqlite3,curl
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exact source and no-release boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(cat VERSION)" = '2.46.3'
          test "$(cat src/VERSION.txt)" = '2.46.3'
          changed="$(git diff --name-only "$BASE_SHA"..HEAD | sort)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | wc -l)" -eq 9
          ! printf '%s\n' "$changed" | grep -Eq '(^VERSION$|^src/VERSION.txt$|^src/migrations/|^src/app/bootstrap.php$)'
          ! grep -Fq 'surface.php' src/channels.php
          ! grep -Fq 'surface.php' src/watch.php
      - name: Syntax and Round 6 identity
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in src/channels.php src/watch.php src/app/ChannelLibraryPage.php src/app/WatchMediaLibraryPage.php src/app/SubjectPageChrome.php tests/unit/uxui_round6_channels_watch_identity_contract.php tests/unit/consolidated_product_acceptance_contract.php; do php -l "$f"; done
          php tests/unit/uxui_round6_channels_watch_identity_contract.php
          php tests/unit/consolidated_product_acceptance_contract.php
          find src -name '*.php' -type f -print0 | xargs -0 -n1 php -l >/dev/null
          node --check src/assets/watch-metadata.js
      - name: Existing Watch metadata and poster regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in tests/unit/tmdb_watch_match_safety_r15.php tests/unit/tmdb_watch_metadata_behavior.php tests/unit/tmdb_watch_poster_contract.php tests/unit/watch_metadata_r12_contract.php tests/unit/watch_metadata_r14_coverage_contract.php tests/unit/watch_metadata_r14_status_behavior.php tests/unit/watch_r13_auto_detail_contract.php; do php "$f"; done
      - name: Product and R1-R5 regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in tests/unit/workspace_view_catalog_contract.php tests/unit/workspace_nine_entry_source_contract.php tests/unit/global_page_size_authority_contract.php tests/unit/resource_action_semantics_contract.php tests/unit/primary_open_semantics_contract.php tests/unit/uxui_round1_home_root_contract.php tests/unit/uxui_round2_subject_identity_contract.php tests/unit/uxui_round3_course_identity_contract.php tests/unit/uxui_round4_tools_identity_contract.php tests/unit/uxui_round5_software_identity_contract.php tests/unit/software_workspace_contract.php tests/unit/software_workspace_source_contract.php tests/unit/tool_home_source_contract.php tests/unit/tool_scene_detail_source_contract.php; do [ -f "$f" ] && php "$f"; done
      - name: Static first-class Channels and Watch assertions
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'VfChannelLibraryPage::render()' src/channels.php
          grep -Fq 'VfWatchMediaLibraryPage::render()' src/watch.php
          grep -Fq "context('channels')" src/app/ChannelLibraryPage.php
          grep -Fq "context('watch')" src/app/WatchMediaLibraryPage.php
          grep -Fq "rediscovery('channels'" src/app/ChannelLibraryPage.php
          grep -Fq 'data-watch-detail-open' src/app/WatchMediaLibraryPage.php
          grep -Fq 'data-watch-tmdb-id' src/app/WatchMediaLibraryPage.php
          grep -Fq 'tmdb_rating' src/app/WatchMediaLibraryPage.php
          grep -Fq 'assets/channel-library.css' src/app/SubjectPageChrome.php
          grep -Fq 'assets/watch-library.css' src/app/SubjectPageChrome.php
          grep -Fq 'assets/watch-metadata.js' src/app/SubjectPageChrome.php
          ! grep -Eq 'subscriber[_-]?(count|total)|follower[_-]?(count|total)|activity[_-]?score' src/app/ChannelLibraryPage.php
          ! grep -Eq 'progress[_-]?(percent|percentage)|completion[_-]?(percent|percentage)' src/app/WatchMediaLibraryPage.php
          ! grep -Fq 'overflow-x:auto' src/assets/channel-library.css
          ! grep -Fq 'overflow-x:auto' src/assets/watch-library.css
          grep -Fq '@media(max-width:700px)' src/assets/channel-library.css
          grep -Fq '@media(max-width:700px)' src/assets/watch-library.css
          echo P01_UXUI_ROUND6_CHANNELS_WATCH_FIRST_CLASS=PASS
