name: temp-s01-m3u8-12530-runtime-authority-20260908
on:
  push:
    branches:
      - temp/s01-page-update-center-v4-20260907
    paths:
      - .github/workflows/temp-s01-m3u8-12530-runtime-authority-20260908.yml
permissions:
  contents: read
jobs:
  authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      REPO: llhzx2018/vf-tools-m3u8
      TAG: v1.25.30
      ASSET: vf-tools-m3u8_V1.25.30.zip
      EXPECTED_BYTES: '3583558'
      EXPECTED_SHA: 8426926e2781603ff0be1d5cd6b5352606be507150d808f2dc156834c5ec1711
      EXPECTED_SOURCE: 22247609c95e1c2bf5a85e81c6ebb2c8caac3f6b
    steps:
      - name: Compute runtime authority from delivered release asset
        shell: bash
        env:
          GH_TOKEN: ${{ env.READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          echo 'AUTHORITY_MODE=DELIVERED_ASSET_READ_ONLY MAIN_WRITE_USED=NO RELEASE_WRITE_USED=NO DISTRIBUTION_WRITE_USED=NO PRODUCTION_WRITE_USED=NO'
          rm -rf "$RUNNER_TEMP/m3u8-authority"; mkdir -p "$RUNNER_TEMP/m3u8-authority"
          test "$(gh api repos/$REPO/git/ref/tags/$TAG --jq '.object.sha')" = "$EXPECTED_SOURCE"
          gh release download "$TAG" --repo "$REPO" --pattern "$ASSET" --dir "$RUNNER_TEMP/m3u8-authority"
          asset="$RUNNER_TEMP/m3u8-authority/$ASSET"
          test "$(stat -c %s "$asset")" = "$EXPECTED_BYTES"
          test "$(sha256sum "$asset"|awk '{print $1}')" = "$EXPECTED_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re,zipfile,os
          p=Path(os.environ['RUNNER_TEMP'])/'m3u8-authority'/os.environ['ASSET']
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              names=[n for n in z.namelist() if not n.endswith('/')]
              assert len(names)==561, len(names)
              rows=[]
              for n in sorted(names):
                  if not n.startswith('vf-tool-m3u8/'): continue
                  rel=n[len('vf-tool-m3u8/'):]
                  parts=rel.split('/'); low=[x.lower() for x in parts]; bn=parts[-1].lower()
                  if any(x in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in low): continue
                  if bn in {'readme.md','changelog.md','license','license.txt','package_profile.json'} or bn.endswith(('.sql','.sqlite','.sqlite3','.db','.log','.zip','.tar','.gz','.bak','.tmp')): continue
                  ok=(rel in {'vf-tool-m3u8.php','uninstall.php','plugin-manifest.json','tool-settings.schema.json'}) if len(parts)==1 else parts[0] in {'admin','config','includes','public','templates','tools'}
                  if ok: rows.append((rel,z.read(n)))
              rows.sort(); h=hashlib.sha256()
              for rel,b in rows: h.update((rel+'\0'+hashlib.sha256(b).hexdigest()+'\n').encode())
              assert len(rows)==559, len(rows)
              main=z.read('vf-tool-m3u8/vf-tool-m3u8.php')
              assert b'Version: 1.25.30' in main and b'R254_S01_PROVIDER_DASHBOARD_VISIBLE_UI_CLOSURE' in main
              css=z.read('vf-tool-m3u8/admin/ui-v4/phase4-component-workspace.css')
              assert b'.vf-m3u8-v6-dashboard__hero' in css and b'.vf-m3u8-v6-next-step' in css
              controller=z.read('vf-tool-m3u8/admin/Controller/class-v6-provider-operations-controller.php')
              assert 'Provider 工作台'.encode() in controller and '当前下一步'.encode() in controller
              print('ZIP_FILES=561')
              print('RUNTIME_FILES=559')
              print('RUNTIME_FP='+h.hexdigest())
          PY
          echo 'PHYSICAL_LOCATOR=vf-tool-m3u8/vf-tool-m3u8.php'
          echo 'SCHEMA=1.3.0 LOCATOR_CUTOVER=false MIGRATION=CLOSED'
          echo 'PASS_S01_C03_M3U8_12530_DELIVERED_RUNTIME_AUTHORITY'
