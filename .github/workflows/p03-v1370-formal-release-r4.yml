name: P03 V1.37.0 Formal Release Bridge R4

on:
  pull_request:
    branches: [main]
    paths:
      - 'ops/p03/release-r4/**'
      - '.github/workflows/p03-v1370-formal-release-r4.yml'

permissions:
  contents: read

concurrency:
  group: p03-v1370-formal-release-r4
  cancel-in-progress: false

env:
  P03_REPOSITORY: llhzx2018/vf-forge
  CANDIDATE_COMMIT: 2bb335d346d8fbf7bae80f48fdbe564826215bcd
  PRODUCT_EXACT_COMMIT: 9506ee1d76cb0782f1053b66536d31f8c5273fdf
  PRODUCTION_MAIN_BEFORE: 3962a68bbbcfbfc5aece6a338effebcafac759a9
  SOURCE_VERSION: 1.36.2
  TARGET_VERSION: 1.37.0
  TARGET_SCHEMA: '30'
  RELEASE_TAG: v1.37.0
  ASSET_NAME: VF_Forge_V1.37.0_UPDATE.zip
  PHP_TEST_IMAGE: vf-forge-php84-v1370-r4
  FIXTURE_PASS: VfM-2026-Test-Fixture!

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Checkout public runner scripts
        uses: actions/checkout@v4

      - name: Require release credentials
        shell: bash
        env:
          RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$RELEASE_TOKEN"
          test -n "$READ_TOKEN"
          code=$(curl -sS -o "$RUNNER_TEMP/p03-perm.json" -w '%{http_code}' -H "Authorization: Bearer $RELEASE_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$P03_REPOSITORY")
          test "$code" = '200'

      - name: Prepare release tools and PHP 8.4 runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-zip sqlite3 unzip zip curl >/dev/null
          cat >"$RUNNER_TEMP/Dockerfile.v1370" <<'EOF'
          FROM php:8.4-cli-bookworm@sha256:5380a7dd17b978cd14fb2c84cd67ddc47adaf079b240f8138224bbadefae46f7
          RUN apt-get update && apt-get install -y --no-install-recommends libzip-dev sqlite3 && docker-php-ext-install zip && rm -rf /var/lib/apt/lists/*
          EOF
          docker build -t "$PHP_TEST_IMAGE" -f "$RUNNER_TEMP/Dockerfile.v1370" "$RUNNER_TEMP" >/dev/null
          docker run --rm "$PHP_TEST_IMAGE" php -r 'foreach(["pdo_sqlite","sqlite3","zip","fileinfo","sodium"] as $x){if(!extension_loaded($x)){fwrite(STDERR,"missing:$x\n");exit(1);}} echo "PHP84_RUNTIME=PASS\n";'

      - name: Checkout exact P03 candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ env.P03_REPOSITORY }}
          ref: ${{ env.CANDIDATE_COMMIT }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: candidate

      - name: Checkout sealed P03 Production baseline
        uses: actions/checkout@v4
        with:
          repository: ${{ env.P03_REPOSITORY }}
          ref: ${{ env.PRODUCTION_MAIN_BEFORE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: production

      - name: Execute canonical V1.37.0 release gate
        shell: bash
        env:
          RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: bash ops/p03/release-r4/run_v1370_release.sh
