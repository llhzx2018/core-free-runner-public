name: P01 v517 merge exact published v516 main into existing Laravel work branch
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  v517-merge-readonly:
    if: github.event.pull_request.number == 4145 && github.actor == 'llhzx2018' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact P01 Laravel current PR #1973 HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 45f524adabc2427a454bcfc48df1063102a34344
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: v517-src
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact published PHP v516 main as independent source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ab49e83c4715cc9246c4333679fc5388e554cc98
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: v516-src
          fetch-depth: 0
          persist-credentials: false
      - name: Real Git merge dry run, preserve v517 and report actual conflicts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C v517-src rev-parse HEAD)" = 45f524adabc2427a454bcfc48df1063102a34344
          test "$(git -C v516-src rev-parse HEAD)" = ab49e83c4715cc9246c4333679fc5388e554cc98
          test "$(git -C v516-src rev-parse HEAD^{tree})" = 20820cabb6c018e7e2f34bfa04dcc7e604835de3
          test "$(cat v517-src/VERSION)" = 2.47.517
          test "$(cat v516-src/VERSION)" = 2.47.516
          git -C v517-src config user.name 'VF isolated merge probe'
          git -C v517-src config user.email 'vf-merge-probe@users.noreply.github.com'
          git -C v517-src fetch --no-tags ../v516-src ab49e83c4715cc9246c4333679fc5388e554cc98
          set +e
          git -C v517-src merge --no-ff --no-commit --no-edit FETCH_HEAD \
            >"$RUNNER_TEMP/p01-v517-merge-log.txt" 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            git -C v517-src diff --name-only --diff-filter=U \
              >"$RUNNER_TEMP/p01-v517-merge-conflicts.txt" || true
            echo P01_V517_REAL_V516_MAIN_MERGE=BLOCKED_SOURCE_CONFLICT
            sed -n '1,75p' "$RUNNER_TEMP/p01-v517-merge-conflicts.txt"
            if [ -f v517-src/.git/MERGE_HEAD ]; then git -C v517-src merge --abort; fi
            exit 1
          fi
          test "$(cat v517-src/VERSION)" = 2.47.517
          test "$(cat v517-src/src/VERSION.txt)" = 2.47.517
          test -f v517-src/src/app/LegacyMajorOwnerApiActions.php
          test -f v517-src/src/app/LegacyMajorFinalOwnerConsent.php
          test -f v517-src/src/assets/update-core.js
          test -f v517-src/scripts/build_p01_247516_legacy_atomic.py
          test -f v517-src/config/p01-fullstack-target.json
          test -f v517-src/docs/authority/ACCEPTANCE_MATRIX.md
          grep -Fq '| RP-07S |' v517-src/docs/authority/ACCEPTANCE_MATRIX.md
          git -C v517-src diff --cached --name-only >"$RUNNER_TEMP/p01-v517-merge-new-files.txt"
          test -s "$RUNNER_TEMP/p01-v517-merge-new-files.txt"
          echo P01_V517_REAL_V516_MAIN_MERGE_DRY_RUN=PASS
          echo P01_V517_MERGE_FILE_COUNT="$(wc -l <"$RUNNER_TEMP/p01-v517-merge-new-files.txt")"
          cat "$RUNNER_TEMP/p01-v517-merge-new-files.txt"
          git -C v517-src merge --abort
          test "$(git -C v517-src rev-parse HEAD)" = 45f524adabc2427a454bcfc48df1063102a34344
          echo P01_V517_PRODUCT_BRANCH_UNTOUCHED_DRY_RUN_ONLY=PASS
      - name: Cleanup private P01 source and merge diagnostics
        if: always()
        shell: bash
        run: |
          rm -rf -- v516-src v517-src
          rm -f -- "$RUNNER_TEMP/p01-v517-merge-log.txt" \
            "$RUNNER_TEMP/p01-v517-merge-conflicts.txt" \
            "$RUNNER_TEMP/p01-v517-merge-new-files.txt"
          echo P01_V517_PRIVATE_SOURCE_PERSISTENCE=NONE
