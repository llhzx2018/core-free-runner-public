name: P01 v517 reconcile and merge exact published v516 main into existing Laravel PR
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  v517-safe-merge:
    if: github.event.pull_request.number == 4145 && github.actor == 'llhzx2018' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact P01 Laravel current PR #1973 HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 45f524adabc2427a454bcfc48df1063102a34344
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: v517-src
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact published PHP v516 main as independent source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ab49e83c4715cc9246c4333679fc5388e554cc98
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: v516-src
          fetch-depth: 0
          persist-credentials: false
      - name: Real Git merge; allow only known API conflict with v517 Owner security retained
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C v517-src rev-parse HEAD)" = 45f524adabc2427a454bcfc48df1063102a34344
          test "$(git -C v516-src rev-parse HEAD)" = ab49e83c4715cc9246c4333679fc5388e554cc98
          test "$(git -C v516-src rev-parse HEAD^{tree})" = 20820cabb6c018e7e2f34bfa04dcc7e604835de3
          test "$(cat v517-src/VERSION)" = 2.47.517
          test "$(cat v516-src/VERSION)" = 2.47.516
          git -C v517-src config user.name 'VF isolated merge probe'
          git -C v517-src config user.email 'vf-merge-probe@users.noreply.github.com'
          git -C v517-src fetch --no-tags ../v516-src ab49e83c4715cc9246c4333679fc5388e554cc98
          set +e
          git -C v517-src merge --no-ff --no-commit --no-edit FETCH_HEAD \
            >"$RUNNER_TEMP/p01-v517-merge-log.txt" 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            git -C v517-src diff --name-only --diff-filter=U \
              >"$RUNNER_TEMP/p01-v517-merge-conflicts.txt"
            test "$(cat "$RUNNER_TEMP/p01-v517-merge-conflicts.txt")" = src/api.php || {
              echo P01_V517_MAIN_MERGE=BLOCKED_UNREVIEWED_CONFLICTS
              sed -n '1,30p' "$RUNNER_TEMP/p01-v517-merge-conflicts.txt"
              exit 1
            }
            test "$(git -C v517-src hash-object src/app/LegacyMajorOwnerApiActions.php)" = 8dcc03149fdf325d712fc4683dd365f51afa522a
            test "$(git -C v516-src hash-object src/app/LegacyMajorOwnerApiActions.php)" = 8dcc03149fdf325d712fc4683dd365f51afa522a
            # A real 517 change intentionally protects private Owner-only actions
            # and disables public SEO. Preserve this reviewed existing code and
            # integrate the officially published bridge's remaining changes.
            git -C v517-src checkout --ours -- src/api.php
            git -C v517-src add -- src/api.php
            echo P01_V517_SINGLE_API_CONFLICT_RESOLVED_WITH_OWNER_ONLY_SECURITY=PASS
          fi
          test -z "$(git -C v517-src diff --name-only --diff-filter=U)"
          test -f v517-src/.git/MERGE_HEAD
          test "$(cat v517-src/VERSION)" = 2.47.517
          test "$(cat v517-src/src/VERSION.txt)" = 2.47.517
          test "$(git -C v517-src hash-object src/api.php)" = 389a1f3eecae86d3239e5835212cc3a03041b8e4
          grep -Fq '$publicProtocolActions' v517-src/src/api.php
          grep -Fq "return ['enabled'=>false" v517-src/src/api.php
          grep -Fq "VfLegacyMajorOwnerApiActions::dispatch" v517-src/src/api.php
          test -f v517-src/src/app/LegacyMajorFinalOwnerConsent.php
          test -f v517-src/src/assets/update-core.js
          test -f v517-src/config/p01-fullstack-target.json
          grep -Fq '| RP-07S |' v517-src/docs/authority/ACCEPTANCE_MATRIX.md
          php -l v517-src/src/api.php >/dev/null
          php -l v517-src/src/app/LegacyMajorOwnerApiActions.php >/dev/null
          php -l v517-src/src/app/LegacyMajorFinalOwnerConsent.php >/dev/null
          php -l v517-src/src/app/Platform/Barrier.php >/dev/null
          node --check v517-src/src/assets/update-core.js
          PYTHONDONTWRITEBYTECODE=1 python3 -B v517-src/scripts/check_p01_fullstack_contract.py \
            >"$RUNNER_TEMP/p01-v517-integration-static.txt" 2>&1 || {
              grep -E 'ERROR|FAIL|BLOCK|DRIFT|Traceback' "$RUNNER_TEMP/p01-v517-integration-static.txt" | tail -n 15 || true
              exit 1
            }
          git -C v517-src diff --cached --name-only >"$RUNNER_TEMP/p01-v517-merge-new-files.txt"
          test -s "$RUNNER_TEMP/p01-v517-merge-new-files.txt"
          echo P01_V517_PUBLISHED_516_MAIN_INTEGRATION_STATIC_AND_PHP_JS=PASS
          echo P01_V517_INTEGRATED_FILES="$(wc -l <"$RUNNER_TEMP/p01-v517-merge-new-files.txt")"
          # The remote product working branch is the only write target. No
          # merge of PR #1973 into main, Release, migration or Production.
          git -C v517-src commit -m 'merge(P01 v517): integrate issued v2.47.516 main; preserve Owner-only API'
          NEW_SHA="$(git -C v517-src rev-parse HEAD)"
          test "$(git -C v517-src rev-parse HEAD^1)" = 45f524adabc2427a454bcfc48df1063102a34344
          test "$(git -C v517-src rev-parse HEAD^2)" = ab49e83c4715cc9246c4333679fc5388e554cc98
          test -z "$(git -C v517-src status --porcelain --untracked-files=all)"
          printf '%s\n' "$NEW_SHA" >"$RUNNER_TEMP/P01_V517_MERGE_NEW_SHA.txt"
          echo P01_V517_REAL_MAIN_MERGE_COMMIT_LOCAL=PASS
      - name: Push validated v517 merge to existing single product PR branch once
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          test -n "$GH_TOKEN"
          EXPECTED=45f524adabc2427a454bcfc48df1063102a34344
          BRANCH=feat/p01-three-engine-schema-baseline-d1
          PROJECT=llhzx2018/vf-start
          test "$(gh api "repos/$PROJECT/git/ref/heads/$BRANCH" --jq .object.sha)" = "$EXPECTED"
          test "$(git -C v517-src rev-parse HEAD^1)" = "$EXPECTED"
          test "$(git -C v517-src rev-parse HEAD^2)" = ab49e83c4715cc9246c4333679fc5388e554cc98
          NEW="$(cat "$RUNNER_TEMP/P01_V517_MERGE_NEW_SHA.txt")"
          HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -C v517-src -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $HEADER" \
            push -q "https://github.com/$PROJECT.git" "HEAD:refs/heads/$BRANCH"
          test "$(gh api "repos/$PROJECT/git/ref/heads/$BRANCH" --jq .object.sha)" = "$NEW"
          echo "P01_V517_RECONCILED_BRANCH_SHA=$NEW"
          echo P01_V517_EXISTING_PRODUCT_PR_UPDATED_NO_RELEASE_NO_PRODUCTION=PASS
      - name: Cleanup private P01 source and merge diagnostics
        if: always()
        shell: bash
        run: |
          rm -rf -- v516-src v517-src
          rm -f -- "$RUNNER_TEMP/p01-v517-merge-log.txt" \
            "$RUNNER_TEMP/p01-v517-merge-conflicts.txt" \
            "$RUNNER_TEMP/p01-v517-merge-new-files.txt"
          echo P01_V517_PRIVATE_SOURCE_PERSISTENCE=NONE
