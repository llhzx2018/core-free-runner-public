name: P06 VF Press V0.1.13 Temporary Formal Release

on:
  pull_request:
    paths:
      - .github/workflows/temp-p06-v0113-formal-release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p06-v0113-formal-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_REPO: llhzx2018/vf-press
      SOURCE_SHA: cec5ecd28b3cdc585d1b7cac17a9e2167d520ea1
      SOURCE_TREE: d18120324236d9459ca6522c007580355fc04b26
      VERSION: 0.1.13
      TAG: v0.1.13
      CORE_REPO: llhzx2018/core-updates
    steps:
      - name: Require registered release capabilities
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"
          echo PRIVATE_READ_CAPABILITY=PASS
          echo RELEASE_WRITE_CAPABILITY=PASS

      - name: Checkout exact release candidate source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Checkout core-updates channel
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.CORE_REPO }}
          ref: main
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: core-updates

      - name: Prepare release runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 php-mbstring php-zip php-curl sqlite3 composer >/dev/null
          php -v
          composer --version
          command -v gh
          echo MACHINE_RUNTIME=PASS

      - name: Exact source and pre-release authority gate
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test "$(tr -d '\r\n' < VERSION)" = "$VERSION"
          test "$(jq -r .version VF_PROJECT.json)" = "$VERSION"
          test "$(jq -r .schema VF_PROJECT.json)" = '3'
          test "$(jq -r .lifecycle VF_PROJECT.json)" = 'CANDIDATE'
          test "$(jq -r .current_phase VF_PROJECT.json)" = 'V0_1_13_EXACT_SOURCE_PASS_RELEASE_AUTHORIZED'
          test "$(jq -r .next_gate VF_PROJECT.json)" = 'FORMAL_RELEASE_V0_1_13'
          test "$(jq -r .release_gates.owner_preview_runtime_applicability VF_PROJECT.json)" = 'N/A'
          test -n "$(jq -r .release_gates.owner_preview_runtime_reason VF_PROJECT.json)"
          test "$(jq -r .release_gates.owner_formal_release_approval VF_PROJECT.json)" = 'PASS'
          test "$(jq -r .release_gates.whole_site_reader_demo_remediation_v0_1_13 VF_PROJECT.json)" = 'PASS_MACHINE_EXACT_SOURCE_RUN_32760852765'
          test "$(jq -r .product_gates.neutral_single_column_reader_v0_1_13 VF_PROJECT.json)" = 'PASS_MACHINE_EXACT_SOURCE_RUN_32760852765'
          test "$(jq -r .product_gates.long_form_demo_dataset_v2 VF_PROJECT.json)" = 'PASS_MACHINE_EXACT_SOURCE_RUN_32760852765'
          grep -Fq 'EXACT-SOURCE V0.1.13 = PASS / RUN 32760852765 / JOB 97539086697' docs/authority/ACCEPTANCE_MATRIX.md
          echo OWNER_PREVIEW_RUNTIME=N_A_AUTHORITY_REASON_PRESENT
          echo DYNAMIC_STATE_IN_STABLE_AUTHORITY=NO
          echo HISTORICAL_STATE_AS_CURRENT=NO
          echo DUPLICATE_CURRENT_TRUTH=NO
          echo README_AS_RUNTIME_AUTHORITY=NO
          echo BRANCH_SNAPSHOT_AS_LONG_TERM_CONTRACT=NO
          echo CHANNEL_SNAPSHOT_AS_LONG_TERM_CONTRACT=NO
          echo PRODUCTION_SNAPSHOT_AS_LONG_TERM_CONTRACT=NO
          echo EVIDENCE_SNAPSHOT_AS_CURRENT=NO
          echo SOURCE_IDENTITY_DRIFT=NO
          echo PRE_RELEASE_AUTHORITY_DRIFT_GATE=PASS
          echo PRODUCTION_WRITE=0

      - name: Composer PHP and complete regression
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          composer validate --strict
          composer dump-autoload --no-dev --optimize --no-interaction
          find src bin public -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          rm -rf storage dist storage-restore-*
          php bin/migrate.php | grep -Fq MIGRATION_PASS
          php bin/self-test.php | grep -Fq FOUNDATION_SELF_TEST_PASS
          php bin/security-self-test.php | grep -Fq SECURITY_SELF_TEST_PASS
          php bin/research-self-test.php | grep -Fq RESEARCH_SELF_TEST_PASS
          php bin/publication-self-test.php | grep -Fq PUBLICATION_MANUSCRIPT_SELF_TEST=PASS
          php bin/markdown-import-self-test.php | grep -Fq MARKDOWN_IMPORT_SELF_TEST=PASS
          php bin/reader-self-test.php | grep -Fq PUBLISHER_READER_SELF_TEST=PASS
          php bin/reader-ux-self-test.php | grep -Fq READER_UX_SELF_TEST=PASS
          php bin/edition-self-test.php | grep -Fq EDITION_SELF_TEST=PASS
          php bin/living-publishing-self-test.php | grep -Fq LIVING_PUBLISHING_SELF_TEST=PASS
          php bin/operations-self-test.php | grep -Fq OPERATIONS_SELF_TEST=PASS
          php bin/operations-ui-self-test.php | grep -Fq OPERATIONS_UI_SELF_TEST=PASS
          php bin/admin-shell-book-overview-self-test.php | grep -Fq ADMIN_SHELL_BOOK_OVERVIEW_SELF_TEST=PASS
          php bin/admin-shell-unification-self-test.php | grep -Fq ADMIN_SHELL_UNIFICATION_SELF_TEST=PASS
          php bin/whole-site-refoundation-self-test.php | grep -Fq WHOLE_SITE_REFOUNDATION_SELF_TEST=PASS
          php bin/whole-site-ui-redevelopment-self-test.php | grep -Fq WHOLE_SITE_UI_REDEVELOPMENT_SELF_TEST=PASS
          php bin/book-outline-self-test.php | tee /tmp/p06-v0113-outline
          grep -Fq CANONICAL_MARKDOWN_NO_OVERWRITE=PASS /tmp/p06-v0113-outline
          grep -Fq PROVIDER_OPTIONAL_DEGRADATION=PASS /tmp/p06-v0113-outline
          php bin/demo-data-self-test.php | tee /tmp/p06-v0113-demo
          grep -Fq DEMO_LONG_FORM_READING=PASS /tmp/p06-v0113-demo
          grep -Fq DEMO_DATA_REFRESH=PASS /tmp/p06-v0113-demo
          php bin/public-asset-self-test.php | grep -Fq PUBLIC_ASSET_HTTP_SELF_TEST=PASS
          php bin/job-self-test.php | grep -Fq JOB_QUEUE_SELF_TEST=PASS
          php bin/update-self-test.php | grep -Fq UPDATE_SELF_TEST=PASS
          php -r '$pdo=new PDO("sqlite:storage/app.db"); if($pdo->query("PRAGMA integrity_check")->fetchColumn()!=="ok") exit(1); if($pdo->query("PRAGMA foreign_key_check")->fetchAll()!==[]) exit(2); if((int)$pdo->query("SELECT MAX(version) FROM schema_migrations")->fetchColumn()!==3) exit(3);'
          rm -rf storage dist storage-restore-*
          test -z "$(git status --short --untracked-files=all)"
          echo COMPOSER_VALIDATE=PASS
          echo PHP_SYNTAX=PASS
          echo EXACT_SOURCE_FULL_REGRESSION=PASS
          echo PRODUCT_REPOSITORY_CLEAN=PASS

      - name: Build exact formal assets
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT=/tmp/p06-v0113-release
          rm -rf "$OUT"
          mkdir -p "$OUT"
          php bin/build-release.php "$OUT" | tee /tmp/p06-v0113-release-build
          grep -Fq RELEASE_BUILD=PASS /tmp/p06-v0113-release-build
          (cd "$OUT" && sha256sum -c SHA256SUMS.txt)
          FULL="$OUT/VF_Press_V0.1.13_FULL.zip"
          UPDATE="$OUT/VF_Press_V0.1.13_UPDATE.zip"
          test -s "$FULL" && test -s "$UPDATE"
          test "$(jq -r .version "$OUT/RELEASE_INFO.json")" = "$VERSION"
          test "$(jq -r .schema "$OUT/RELEASE_INFO.json")" = '3'
          unzip -p "$UPDATE" VF_UPDATE.json >/tmp/p06-v0113-update.json
          test "$(jq -r .target_version /tmp/p06-v0113-update.json)" = "$VERSION"
          unzip -l "$UPDATE" | grep -Fq 'payload/src/Http/Studio/AdminShell.php'
          unzip -l "$UPDATE" | grep -Fq 'payload/src/Http/Studio/BookController.php'
          unzip -l "$UPDATE" | grep -Fq 'payload/src/Http/Studio/ResearchController.php'
          unzip -l "$UPDATE" | grep -Fq 'payload/src/Application/Demo/DemoDataService.php'
          unzip -l "$UPDATE" | grep -Fq 'payload/src/Http/Preview/PublisherReaderPreviewController.php'
          unzip -l "$UPDATE" | grep -Fq 'payload/public/assets/operations.css'
          unzip -l "$UPDATE" | grep -Fq 'payload/public/assets/reader.css'
          unzip -l "$UPDATE" | grep -Fq 'payload/public/assets/reader.js'
          echo "FULL_BYTES=$(stat -c%s "$FULL")" >> "$GITHUB_ENV"
          echo "FULL_SHA=$(sha256sum "$FULL" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "UPDATE_BYTES=$(stat -c%s "$UPDATE")" >> "$GITHUB_ENV"
          echo "UPDATE_SHA=$(sha256sum "$UPDATE" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo FORMAL_ASSET_BUILD=PASS

      - name: Publish and remote-readback formal GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          OUT=/tmp/p06-v0113-release
          NOTES=/tmp/p06-v0113-notes.md
          printf '%s\n' \
            '## VF Press V0.1.13 · Reader & Whole-Site Remediation' \
            '' \
            '- 私人 Reader 改为中性浅灰白、720px 单栏沉浸阅读，目录收进可关闭抽屉。' \
            '- 默认 18px、1.9 行距与清晰中文无衬线正文；暖色仅作为可选主题。' \
            '- Library 与 Book Workspace 统一为锁定母原型的 224px Shell，导入和新建研究按需展开。' \
            '- 演示数据 V2 提供 3 本书、11 个可滚动长文章节，并支持隔离刷新。' \
            '- Schema 保持 3；AI Candidate 不覆盖 Accepted Canonical Markdown。' \
            '- 未配置 AI Provider 时仍可导入、编辑、阅读与长期保存。' \
            '' \
            '本发布不执行 Production 升级或 Production 数据写入。' > "$NOTES"

          if gh release view "$TAG" --repo "$SOURCE_REPO" >/dev/null 2>&1; then
            TAG_SHA=$(gh api "repos/$SOURCE_REPO/git/ref/tags/$TAG" --jq .object.sha)
            test "$TAG_SHA" = "$SOURCE_SHA"
            gh release upload "$TAG" \
              "$OUT/VF_Press_V0.1.13_FULL.zip" \
              "$OUT/VF_Press_V0.1.13_UPDATE.zip" \
              "$OUT/SHA256SUMS.txt" \
              "$OUT/RELEASE_INFO.json" \
              --repo "$SOURCE_REPO" --clobber
          else
            gh release create "$TAG" \
              "$OUT/VF_Press_V0.1.13_FULL.zip" \
              "$OUT/VF_Press_V0.1.13_UPDATE.zip" \
              "$OUT/SHA256SUMS.txt" \
              "$OUT/RELEASE_INFO.json" \
              --repo "$SOURCE_REPO" \
              --target "$SOURCE_SHA" \
              --title "VF Press V0.1.13 · Reader & Whole-Site Remediation" \
              --notes-file "$NOTES"
          fi

          RELEASE_JSON=$(gh api "repos/$SOURCE_REPO/releases/tags/$TAG")
          test "$(jq -r .draft <<<"$RELEASE_JSON")" = false
          test "$(jq -r .prerelease <<<"$RELEASE_JSON")" = false
          test "$(jq -r .tag_name <<<"$RELEASE_JSON")" = "$TAG"
          TAG_SHA=$(gh api "repos/$SOURCE_REPO/git/ref/tags/$TAG" --jq .object.sha)
          test "$TAG_SHA" = "$SOURCE_SHA"

          READBACK=/tmp/p06-v0113-readback
          rm -rf "$READBACK"
          mkdir -p "$READBACK"
          gh release download "$TAG" --repo "$SOURCE_REPO" --dir "$READBACK"
          test "$(stat -c%s "$READBACK/VF_Press_V0.1.13_FULL.zip")" = "$FULL_BYTES"
          test "$(sha256sum "$READBACK/VF_Press_V0.1.13_FULL.zip" | awk '{print $1}')" = "$FULL_SHA"
          test "$(stat -c%s "$READBACK/VF_Press_V0.1.13_UPDATE.zip")" = "$UPDATE_BYTES"
          test "$(sha256sum "$READBACK/VF_Press_V0.1.13_UPDATE.zip" | awk '{print $1}')" = "$UPDATE_SHA"
          (cd "$READBACK" && sha256sum -c SHA256SUMS.txt)
          echo "RELEASE_URL=$(jq -r .html_url <<<"$RELEASE_JSON")" >> "$GITHUB_ENV"
          echo FORMAL_RELEASE_REMOTE_READBACK=PASS

      - name: Publish core-updates P06 manifest
        working-directory: core-updates
        shell: bash
        run: |
          set -Eeuo pipefail
          RELEASED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq -n \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            --arg sha "$UPDATE_SHA" \
            --arg released_at "$RELEASED_AT" \
            --arg source_sha "$SOURCE_SHA" \
            --argjson bytes "$UPDATE_BYTES" \
            '{
              schema_version:"1.0",
              project_id:"P06",
              component_id:"APP",
              enabled:true,
              target_version:$version,
              update_type:"ATOMIC",
              from_versions:["0.1.12"],
              schema_from:"3",
              schema_to:"3",
              repository:"llhzx2018/vf-press",
              release_tag:$tag,
              asset_name:"VF_Press_V0.1.13_UPDATE.zip",
              asset_bytes:$bytes,
              asset_sha256:$sha,
              backup_required:true,
              rollback_supported:true,
              minimum_php:"8.2.0",
              released_at:$released_at,
              product_identity:"VF Press / P06",
              notes:("V0.1.13 repairs the whole-site Reader, neutral palette and long-form Demo V2 from exact source " + $source_sha + ".")
            }' > projects/P06.json
          jq -e '.project_id=="P06" and .target_version=="0.1.13" and .from_versions==["0.1.12"] and .schema_from=="3" and .schema_to=="3" and .backup_required==true and .rollback_supported==true and .asset_bytes>0 and (.asset_sha256|test("^[a-f0-9]{64}$"))' projects/P06.json >/dev/null
          git config user.name 'VF Public Runner'
          git config user.email 'vf-public-runner@users.noreply.github.com'
          git add projects/P06.json
          git commit -m "release(P06): publish V0.1.13 update manifest"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "MANIFEST_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo CORE_UPDATES_MANIFEST_PUBLISHED=PASS

      - name: Verify online discovery and release boundary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$CORE_REPO/contents/projects/P06.json?ref=main" --jq .content | tr -d '\n' | base64 -d >/tmp/P06-online.json
          jq -e \
            --arg sha "$UPDATE_SHA" \
            --argjson bytes "$UPDATE_BYTES" \
            '.target_version=="0.1.13" and .from_versions==["0.1.12"] and .schema_from=="3" and .schema_to=="3" and .release_tag=="v0.1.13" and .asset_bytes==$bytes and .asset_sha256==$sha' \
            /tmp/P06-online.json >/dev/null
          cd source
          php -r 'require "vendor/autoload.php"; $m=json_decode(file_get_contents("/tmp/P06-online.json"),true,512,JSON_THROW_ON_ERROR); $r=(new CoreUpdates\UpdateCore("P06"))->check("0.1.12","3",$m); if(($r["status"]??"")!=="AVAILABLE"){fwrite(STDERR,json_encode($r));exit(1);} echo "ONLINE_DISCOVERY=AVAILABLE\n";'
          echo ONLINE_UPDATE_DISCOVERY=PASS
          echo NO_INVALID_DYNAMIC_SNAPSHOT=YES
          echo NO_HISTORICAL_STATE_AS_CURRENT=YES
          echo NO_DUPLICATE_CURRENT_TRUTH=YES
          echo DISTRIBUTION_STATE_CANONICAL=YES
          echo PRODUCTION_STATE_CANONICAL=YES
          echo README_NOT_RUNTIME_AUTHORITY=YES
          echo REMOTE_READBACK_PASS=YES
          echo RELEASE_AUTHORITY_CLOSURE=PASS
          echo FORMAL_RELEASE=PASS
          echo PRODUCTION_WRITE=NO
