name: p01-ia5-v247472-candidate-gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-ia5-v247472-candidate-gate.yml'

permissions:
  contents: read

concurrency:
  group: p01-ia5-candidate-3fec9fe
  cancel-in-progress: false

jobs:
  candidate-gate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'test(P01):')
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      VERSION: 2.47.472
      SOURCE: 2.47.471
      TARGET_SHA: 3fec9fed6614539e0e3131017cb41acdab1a7689
      TAG: v2.47.472
      BASE_TAG: v2.47.471
      ART: /tmp/p01-ia5-candidate-artifacts
      REL: /tmp/p01-ia5-stable-release
    steps:
      - name: Checkout registered Runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd unzip jq >/dev/null
          php -m | grep -Fx pdo_sqlite
          php -m | grep -Fx sqlite3
          php -m | grep -Fx curl
          echo P01_RELEASE_RUNTIME=PASS

      - name: Resolve exact product source and prior formal release
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$GH_TOKEN"

          remote_candidate="$(git ls-remote "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" refs/heads/feat/p01-frontstage-ia5-reconciled-20261028 | awk '{print $1}')"
          test "$remote_candidate" = "$TARGET_SHA"

          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" candidate
          git -C candidate fetch -q --depth 1 origin "$TARGET_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "$VERSION"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "$VERSION"

          TARGET_TREE="$(git -C candidate rev-parse HEAD^{tree})"
          echo "TARGET_TREE=$TARGET_TREE" >> "$GITHUB_ENV"

          git clone -q --depth 1 --branch "$BASE_TAG" "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" stable
          test "$(tr -d '\r\n ' < stable/VERSION)" = "$SOURCE"
          BASE_COMMIT="$(git -C stable rev-parse HEAD)"
          echo "BASE_COMMIT=$BASE_COMMIT" >> "$GITHUB_ENV"

          rm -rf "$REL"
          mkdir -p "$REL/full" "$REL/update"
          gh release download "$BASE_TAG" -R "$PRODUCT_REPO" -D "$REL"             -p "VF-Start-V${SOURCE}-FULL.zip"             -p "VF_Start_V${SOURCE}_UPDATE.zip"
          unzip -q "$REL/VF-Start-V${SOURCE}-FULL.zip" -d "$REL/full"
          unzip -q "$REL/VF_Start_V${SOURCE}_UPDATE.zip" -d "$REL/update"
          test "$(tr -d '\r\n ' < "$REL/full/VERSION.txt")" = "$SOURCE"
          test -f "$REL/update/repair-v${SOURCE}.php"
          echo P01_EXACT_SOURCE_AND_BASELINE=PASS

      - name: Canonical regression in isolated worktree
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/p01-maintenance-lane.json <<EOF
          {
            "schema": "vf-ephemeral-lane-spec/v1",
            "lane_id": "p01-maintenance-release",
            "project_id": "P01",
            "repository": "$PRODUCT_REPO",
            "target_version": "$VERSION",
            "target_sha": "$TARGET_SHA",
            "target_tree": "$TARGET_TREE",
            "source_versions": ["$SOURCE"],
            "schema_version": "",
            "candidate_run": "${{ github.run_id }}",
            "previous_lane": {},
            "extra": {}
          }
          EOF
          python3 scripts/ephemeral_lane_spec.py validate --spec /tmp/p01-maintenance-lane.json >/tmp/p01-lane-spec.json
          python3 scripts/ephemeral_lane_worktree.py run-isolated             --spec /tmp/p01-maintenance-lane.json             --repo candidate             --label p01-canonical-release             -- bash tests/canonical_release_regression.sh . "$GITHUB_WORKSPACE/stable" --require-zero-debt             | tee /tmp/p01-canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/p01-canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/p01-canonical.txt
          test -z "$(git -C candidate status --porcelain)"
          echo P01_CANONICAL_RELEASE_PROOF=PASS

      - name: Classify canonical failures safely (no private source artifact)
        if: failure()
        shell: bash
        run: |
          set -u
          cd candidate
          for file in tests/unit/p01_frontstage_icon_management_contract.php tests/unit/admin_all_resources_route_v247285_contract.php tests/unit/admin_eight_resource_tasks_v247286_contract.php tests/unit/admin_ia_v247253_contract.php tests/unit/admin_plain_language_17_tasks_v247287_contract.php tests/unit/admin_resource_health_closure_contract.php tests/unit/admin_secondary_nav_focus_contract.php tests/unit/admin_url_health_page5_polish_contract.php tests/unit/backend_ia_round1_v247269_contract.php tests/unit/backend_ia_round3_resource_maintenance_v247271_contract.php tests/unit/frontend_channels_watch_r3_contract.php tests/unit/p01_ia_v2_r10_admin_closure_contract.php tests/unit/p01_ia_v2_r9_resource_center_17_task_contract.php tests/unit/shared_dialog_foundation_r1_contract.php tests/unit/url_availability_human_verdict_v247288_contract.php tests/unit/watch_cinema_rebuild_contract.php tests/unit/watch_page_filter_hierarchy_contract.php tests/unit/watch_page_full_polish_contract.php; do
            echo "::group::DIAG:$file"
            set +e
            output="$(timeout 15s php "$file" 2>&1)"
            rc=$?
            set -e
            echo "EXIT_CODE=$rc"
            printf '%s\n' "$output" | tail -n 6 | cut -c1-240
            echo "::endgroup::"
          done
          echo P01_IA5_CANONICAL_FAILURE_DIAG_COMPLETE=YES

      - name: Focused frontstage JS and PHP syntax contract
        shell: bash
        run: |
          set -Eeuo pipefail
          find candidate/src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find candidate/src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          (
            cd candidate
            node tests/unit/channels_create_state_machine.cjs
            node tests/unit/p01_native_source_dirty_guard_contract.cjs
            node tests/unit/p01_home_favorites_native_contract.cjs
            node tests/unit/p01_channels_native_source_results_contract.cjs
            node tests/unit/p01_watch_native_metadata_zero_load_contract.cjs
            node tests/unit/p01_music_advanced_native_contract.cjs
          )
          echo P01_IA5_FOCUSED_SOURCE_CONTRACTS=PASS

      - name: Build exact maintenance artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$ART"
          python3 scripts/p01-maintenance-release.py             --candidate candidate/src             --baseline-full "$REL/full"             --baseline-repair "$REL/update/repair-v${SOURCE}.php"             --out "$ART"             --version "$VERSION"             --source-version "$SOURCE"             --target-sha "$TARGET_SHA"             --target-tree "$TARGET_TREE" | tee /tmp/p01-maintenance-build.json

          test -f "$ART/VF-Start-V${VERSION}-FULL.zip"
          test -f "$ART/VF_Start_V${VERSION}_UPDATE.zip"
          test -f "$ART/P01_MAINTENANCE_ARTIFACT_RECEIPT.json"
          echo P01_MAINTENANCE_BUILD=PASS

      - name: Verify clean FULL and Atomic UPDATE
        shell: bash
        run: |
          set -Eeuo pipefail
          FULL="$ART/VF-Start-V${VERSION}-FULL.zip"
          UPDATE="$ART/VF_Start_V${VERSION}_UPDATE.zip"
          WORK="/tmp/p01-maintenance-gate"
          rm -rf "$WORK"
          mkdir -p "$WORK/update"
          unzip -q "$UPDATE" -d "$WORK/update"
          REPAIR="$WORK/update/repair-v${VERSION}.php"

          test -f "$REPAIR"
          test "$(unzip -Z1 "$UPDATE")" = "repair-v${VERSION}.php"
          unzip -t "$FULL" >/dev/null
          unzip -t "$UPDATE" >/dev/null
          php -l "$REPAIR" >/dev/null
          php "$REPAIR" --self-test | tee /tmp/p01-atomic-selftest.json
          grep -Fq '"ok":true' /tmp/p01-atomic-selftest.json

          assert_no_private_payload() {
            local zip="$1"
            if unzip -Z1 "$zip" | grep -Ei '(^|/)(\.runtime\.php|.*\.sqlite3?$|.*\.db$|private/|backups?/|sessions?/|tokens?/|staging/)' >/tmp/p01-private-hits.txt; then
              cat /tmp/p01-private-hits.txt
              echo PRIVATE_PAYLOAD_LEAK
              exit 90
            fi
          }
          assert_no_private_payload "$FULL"
          assert_no_private_payload "$UPDATE"

          install_full() {
            local zip="$1" root="$2" port="$3" title="$4"
            local cookie="/tmp/cookie-$port.txt"
            rm -rf "$root" "$cookie"
            mkdir -p "$root"
            unzip -q "$zip" -d "$root"
            (
              cd "$root"
              php -S 127.0.0.1:"$port" -t . >"/tmp/server-$port.log" 2>&1 &
              echo $! >"/tmp/server-$port.pid"
            )
            local pid
            pid="$(cat "/tmp/server-$port.pid")"
            trap 'kill "$pid" >/dev/null 2>&1 || true' RETURN
            for _ in $(seq 1 50); do
              if curl -fsS -c "$cookie" -b "$cookie" "http://127.0.0.1:$port/setup.php" -o "/tmp/setup-$port.html"; then break; fi
              sleep 1
            done
            local csrf
            csrf="$(python3 - "/tmp/setup-$port.html" <<'PY'
          import re,sys
          text=open(sys.argv[1],encoding="utf-8").read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',text)
          assert m
          print(m.group(1))
          PY
          )"
            local pass="ReleaseGate!${port}"
            curl -fsS -c "$cookie" -b "$cookie" -X POST "http://127.0.0.1:$port/setup.php"               --data-urlencode "setup_csrf=$csrf"               --data-urlencode "site_title=$title"               --data-urlencode "admin_password=$pass"               --data-urlencode "admin_password_confirm=$pass"               -o "/tmp/setup-post-$port.html"
            (cd "$root" && php cli/verify.php) | tee "/tmp/verify-$port.txt"
            grep -Fx 'VERIFY_PASS=YES' "/tmp/verify-$port.txt"
            local revisit
            revisit="$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:$port/setup.php")"
            test "$revisit" = 302
            local body status
            body="$(php -r 'echo json_encode(["password"=>$argv[1]], JSON_UNESCAPED_SLASHES);' "$pass")"
            status="$(curl -sS -c "$cookie" -b "$cookie" -o "/tmp/login-$port.json" -w '%{http_code}' -H 'Content-Type: application/json' --data "$body" "http://127.0.0.1:$port/api.php?action=login")"
            test "$status" = 200
            grep -Fq '"ok":true' "/tmp/login-$port.json"
            kill "$pid" >/dev/null 2>&1 || true
            trap - RETURN
          }

          install_full "$FULL" "$WORK/target-full" 18511 "VF Start V$VERSION FULL Gate"
          test "$(tr -d '\r\n ' < "$WORK/target-full/VERSION.txt")" = "$VERSION"
          echo P01_CLEAN_FULL_INSTALL=PASS

          install_full "$REL/VF-Start-V${SOURCE}-FULL.zip" "$WORK/upgrade" 18512 "VF Start V$SOURCE Upgrade Source"
          cat >"$WORK/upgrade/sentinel.php" <<'PHP'
          <?php
          declare(strict_types=1);
          require __DIR__.'/app/bootstrap.php';
          $repo=new VfRepository(vf_db());
          $cat=$repo->createCategory(['name'=>'Release Sentinel','description'=>'','icon'=>'','is_private'=>1,'sort_order'=>0]);
          $link=$repo->saveLink(null,['surface'=>'start','category_id'=>$cat,'title'=>'Release Sentinel Link','url'=>'https://example.com/release-sentinel','description'=>'must survive atomic','tags'=>['release-sentinel'],'is_private'=>1,'is_pending'=>0]);
          file_put_contents('/tmp/p01-sentinel-id.txt',(string)$link['id']);
          PHP
          php "$WORK/upgrade/sentinel.php"
          rm "$WORK/upgrade/sentinel.php"
          cp "$REPAIR" "$WORK/upgrade/repair-v${VERSION}.php"
          php "$WORK/upgrade/repair-v${VERSION}.php" --verify-source="$WORK/upgrade" | tee /tmp/p01-source-verify.json
          grep -Fq '"ok":true' /tmp/p01-source-verify.json
          php "$WORK/upgrade/repair-v${VERSION}.php" --run="$WORK/upgrade" | tee /tmp/p01-atomic-success.json
          grep -Fq '"ok":true' /tmp/p01-atomic-success.json
          test "$(tr -d '\r\n ' < "$WORK/upgrade/VERSION.txt")" = "$VERSION"
          (cd "$WORK/upgrade" && php cli/verify.php) | grep -Fx 'VERIFY_PASS=YES'
          php -r 'require $argv[1]."/app/bootstrap.php"; $id=(int)trim(file_get_contents("/tmp/p01-sentinel-id.txt")); $s=vf_db()->prepare("SELECT title,is_private FROM links WHERE id=?"); $s->execute([$id]); $r=$s->fetch(PDO::FETCH_ASSOC); if(!$r||$r["title"]!=="Release Sentinel Link"||(int)$r["is_private"]!==1) exit(1); echo "SENTINEL_PRESERVED\n";' "$WORK/upgrade"

          cp "$REPAIR" "$WORK/upgrade/repair-v${VERSION}.php"
          php "$WORK/upgrade/repair-v${VERSION}.php" --run="$WORK/upgrade" | tee /tmp/p01-atomic-repeat.json
          grep -Fq '"already_current":true' /tmp/p01-atomic-repeat.json
          echo P01_ATOMIC_UPGRADE_AND_IDEMPOTENCY=PASS

          install_full "$REL/VF-Start-V${SOURCE}-FULL.zip" "$WORK/rollback" 18513 "VF Start V$SOURCE Rollback Source"
          cat >"$WORK/rollback/sentinel.php" <<'PHP'
          <?php
          declare(strict_types=1);
          require __DIR__.'/app/bootstrap.php';
          $repo=new VfRepository(vf_db());
          $cat=$repo->createCategory(['name'=>'Rollback Sentinel','description'=>'','icon'=>'','is_private'=>1,'sort_order'=>0]);
          $link=$repo->saveLink(null,['surface'=>'start','category_id'=>$cat,'title'=>'Rollback Sentinel Link','url'=>'https://example.com/rollback-sentinel','description'=>'must survive rollback','tags'=>['rollback-sentinel'],'is_private'=>1,'is_pending'=>0]);
          file_put_contents('/tmp/p01-rollback-id.txt',(string)$link['id']);
          PHP
          php "$WORK/rollback/sentinel.php"
          rm "$WORK/rollback/sentinel.php"
          cp "$REPAIR" "$WORK/rollback/repair-v${VERSION}.php"
          set +e
          VF_ATOMIC_TEST_FAIL_AFTER_APPLY=1 php "$WORK/rollback/repair-v${VERSION}.php" --run="$WORK/rollback" >/tmp/p01-rollback.out 2>/tmp/p01-rollback.err
          rollback_rc=$?
          set -e
          test "$rollback_rc" -ne 0
          test "$(tr -d '\r\n ' < "$WORK/rollback/VERSION.txt")" = "$SOURCE"
          (cd "$WORK/rollback" && php cli/verify.php) | grep -Fx 'VERIFY_PASS=YES'
          php -r 'require $argv[1]."/app/bootstrap.php"; $id=(int)trim(file_get_contents("/tmp/p01-rollback-id.txt")); $s=vf_db()->prepare("SELECT title FROM links WHERE id=?"); $s->execute([$id]); if($s->fetchColumn()!=="Rollback Sentinel Link") exit(1); echo "ROLLBACK_SENTINEL_PRESERVED\n";' "$WORK/rollback"
          echo P01_ATOMIC_ROLLBACK=PASS

          unzip -p "$FULL" VERSION.txt | tr -d '\r\n ' | grep -Fx "$VERSION"
          unzip -p "$FULL" release-manifest.json | php -r '$m=json_decode(stream_get_contents(STDIN),true); if(($m["version"]??"")!==$argv[1]||($m["source_version"]??"")!==$argv[2]||empty($m["maintenance_release"]["schema_unchanged"])) exit(1); echo "P01_RELEASE_MANIFEST=PASS\n";' "$VERSION" "$SOURCE"
          echo P01_MAINTENANCE_ARTIFACT_GATE=PASS


      - name: Isolated desktop browser and frontstage save gate
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-ia5-browser-deps
          npm install --prefix /tmp/p01-ia5-browser-deps --no-audit --no-fund playwright@1.56.1 >/tmp/p01-npm-install.log
          PLAYWRIGHT_BROWSERS_PATH=/tmp/p01-ia5-browsers /tmp/p01-ia5-browser-deps/node_modules/.bin/playwright install --with-deps chromium >/tmp/p01-browser-install.log
          (cd /tmp/p01-maintenance-gate/target-full && php -S 127.0.0.1:18521 -t . >/tmp/p01-ia5-browser-server.log 2>&1) &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18521/channels.php -o /dev/null; then break; fi
            sleep 1
          done
          export NODE_PATH=/tmp/p01-ia5-browser-deps/node_modules
          export PLAYWRIGHT_BROWSERS_PATH=/tmp/p01-ia5-browsers
          node <<'JS'
          'use strict';
          const assert=require('node:assert/strict');
          const {chromium}=require('playwright');
          const origin='http://127.0.0.1:18521';
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            try{
              const context=await browser.newContext({viewport:{width:1440,height:900}});
              await context.route(/https?:\/\/(?!127\.0\.0\.1)/,route=>route.abort());
              const login=await context.request.post(origin+'/api.php?action=login',{data:{password:'ReleaseGate!18511'}});
              assert.equal(login.status(),200,'synthetic Owner login');
              assert.match(await login.text(),/"ok":true/);
              const page=await context.newPage();
              const failures=[];
              page.on('pageerror',e=>failures.push(String(e).slice(0,180)));
              for(const width of [1440,768]){
                await page.setViewportSize({width,height:900});
                for(const route of ['index.php','start.php','channels.php','watch.php','music-home.php']){
                  const resp=await page.goto(origin+'/'+route,{waitUntil:'domcontentloaded'});
                  assert.ok(resp&&resp.status()<400,route+' HTTP');
                  const count=await page.locator('.vf-global-domain-links>a').count();
                  assert.equal(count,11,route+' complete Owner subsite navigation');
                  const opener=page.locator('[data-vf-local-manage-open]');
                  assert.equal(await opener.count(),1,route+' local management entry');
                  await opener.click();
                  const dialog=page.locator('dialog[data-vf-local-management]');
                  assert.equal(await dialog.evaluate(e=>e.open),true,route+' native dialog open');
                  assert.equal(await dialog.locator('iframe').count(),0,route+' no embedded backstage');
                  assert.ok(await dialog.locator('[data-vf-local-manage-list]').count()>0,route+' local task list');
                  const boxes=await page.locator('dialog[open]').count();
                  assert.equal(boxes,1,route+' single native modal');
                  await page.keyboard.press('Escape');
                  assert.equal(await dialog.evaluate(e=>e.open),false,route+' closes');
                  const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-innerWidth);
                  assert.ok(overflow<=8,route+'/'+width+' overflow '+overflow);
                }
                console.log('P01_IA5_BROWSER_SHELL_'+width+'=PASS');
              }
              await page.setViewportSize({width:1440,height:900});
              await page.goto(origin+'/channels.php?view=directory',{waitUntil:'domcontentloaded'});
              await page.locator('[data-vf-local-manage-open]').click();
              const hub=page.locator('dialog[data-vf-local-management]');
              await hub.locator('[data-vf-local-task="channel"]').click();
              await hub.locator('[data-vf-local-channel-add]').click();
              const form=page.locator('[data-add-form]');
              const url=form.locator('[name=url]');
              await url.waitFor({state:'visible'});
              const draft='https://example.com/p01-ia5-candidate-channel';
              await url.fill(draft);
              await form.locator('[name=title]').fill('IA5 Release Synthetic Channel');
              const submits=form.locator('button[type=submit]');
              assert.ok(await submits.count()>=2,'Save and add-and-continue both available');
              let unexpected=[];
              page.on('dialog',d=>{unexpected.push(d.message());d.dismiss().catch(()=>{});});
              await form.locator('button[type=submit]:not([data-add-continue])').click();
              await page.waitForTimeout(1100);
              console.log('P01_IA5_BROWSER_CHANNEL_SAVE_DIAGNOSTIC='+JSON.stringify(await page.evaluate(()=>({
                url:location.pathname+location.search,
                hubOpen:document.querySelector('[data-vf-local-management]')?.open,
                addPanelHidden:document.querySelector('[data-panel="add"]')?.hidden,
                actionStatus:document.querySelector('[data-vf-local-action-status]')?.textContent?.slice(0,180),
                toast:document.querySelector('.vf-workspace-toasts')?.textContent?.slice(-250),
                formError:document.querySelector('[data-add-form]')?.querySelector(':invalid')?.getAttribute('name'),
                rowTitles:[...document.querySelectorAll('.vf-channel-source-row h3')].map(e=>e.textContent?.trim()).slice(0,6)
              }))));
              await page.getByText('IA5 Release Synthetic Channel',{exact:false}).first().waitFor({state:'visible',timeout:20000});
              assert.equal(unexpected.length,0,'successful save cannot trigger discard confirm');
              assert.equal(await hub.evaluate(e=>e.open),false,'save closes native hub');
              assert.ok(page.url().includes('/channels.php'),'save stays in Channels');
              console.log('P01_IA5_BROWSER_CHANNEL_SAVE_CLOSE_REFRESH=PASS');
              await page.locator('[data-vf-local-manage-open]').click();
              await hub.locator('[data-vf-local-task="channel"]').click();
              await hub.locator('[data-vf-local-channel-add]').click();
              await url.waitFor({state:'visible'});
              await url.fill('https://example.com/p01-ia5-second-channel');
              await form.locator('[name=title]').fill('IA5 Release Synthetic Continue');
              await form.locator('[data-add-continue]').click();
              await page.getByText(/可继续添加下一项/).first().waitFor({state:'visible',timeout:15000});
              assert.equal(await url.inputValue(),'','continue resets URL');
              assert.equal(await form.locator('[name=title]').inputValue(),'','continue resets title');
              assert.equal(await hub.evaluate(e=>e.open),true,'continue keeps one native hub');
              assert.equal(unexpected.length,0,'continue does not warn of discard');
              await page.keyboard.press('Escape');
              assert.equal(unexpected.length,0,'clean continue closes without discard');
              console.log('P01_IA5_BROWSER_CHANNEL_ADD_CONTINUE=PASS');
              const guest=await browser.newContext({viewport:{width:1440,height:900}});
              await guest.route(/https?:\/\/(?!127\.0\.0\.1)/,route=>route.abort());
              const gp=await guest.newPage();
              await gp.goto(origin+'/channels.php?view=directory',{waitUntil:'domcontentloaded'});
              assert.equal(await gp.locator('[data-vf-local-manage-open]').count(),0,'guest no native Owner management');
              assert.equal(await gp.getByText('IA5 Release Synthetic Channel').count(),0,'private channel hidden from guest');
              assert.equal(await gp.locator('.vf-global-domain-links>a').count(),9,'guest 9 public entries');
              await guest.close();
              assert.deepEqual(failures,[],'no JavaScript runtime errors');
              console.log('P01_IA5_BROWSER_PRIVATE_PROJECTION=PASS');
              await context.close();
            }finally{await browser.close();}
          })().catch(e=>{console.error('P01_IA5_BROWSER_FAILURE',e.stack||e);process.exitCode=1;});
          JS
          echo P01_IA5_EXACT_BROWSER_GATE=PASS

      - name: Finish without publishing
        shell: bash
        run: |
          set -Eeuo pipefail
