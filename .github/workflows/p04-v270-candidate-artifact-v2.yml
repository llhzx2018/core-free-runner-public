name: P04 V2.7 Candidate Artifact V2
on:
  push:
    branches: [p04-v270-candidate-artifact-v2-tmp]
    paths: ['.github/workflows/p04-v270-candidate-artifact-v2.yml']
permissions:
  contents: write
env:
  PRODUCT_REPO: llhzx2018/vf-infra
  CANDIDATE_HEAD: 60b65075c65218d1c9013bcc6a4f91eafe3f9c6b
  CANDIDATE_TREE: ff1412006bd7b71fc246b9f420cdd293b41f3445
  TESTED_RUNTIME: 79281e09a65985ec6e0ae9d1730472979f8fe482
  BASE260: b8d080e432ba811f6689372636022774e558ffc1
  TARGET: '2.7.0'
  SOURCE: '2.6.0'
  SCHEMA: '14'
  TMP1: p04-v270-candidate-artifact-tmp
  TMP2: p04-v270-candidate-artifact-v2-tmp
jobs:
  verify-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: p04-v270-integration-gate, fetch-depth: 0}
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: candidate/v2.7.0
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: candidate
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: b8d080e432ba811f6689372636022774e558ffc1
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: base260
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.4', extensions: 'pdo_sqlite, sqlite3, fileinfo, sodium, zip, curl, mbstring', coverage: none}

      - name: Exact Candidate identity
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          test "$(git rev-parse HEAD)" = "$CANDIDATE_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test "$(tr -d '\r\n' < VERSION)" = "$TARGET"
          test "$(find database/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')" = "$SCHEMA"
          test ! -e database/migrations/015_v270.sql
          mapfile -t delta < <(git diff --name-only "$TESTED_RUNTIME" "$CANDIDATE_HEAD")
          test "${#delta[@]}" -eq 1 && test "${delta[0]}" = VF_PROJECT.json
          test "$(git -C ../base260 rev-parse HEAD)" = "$BASE260"
          echo CANDIDATE_RUNTIME_EXACT_PASS

      - name: Current lifecycle Candidate verification
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
          find public -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
          valid=(
            tests/integration/domain_portfolio_contract_v258.php
            tests/integration/project_membership_contract_v257.php
            tests/integration/provider_billing_pagination_v256.php
            tests/integration/scope_summary_contract_v258.php
            tests/unit/core_updates_contract_v252.php
            tests/unit/job_partial_health_contract_v256.php
            tests/unit/provider_billing_persistence_contract_v256.php
            tests/unit/provider_currency_contract_v256.php
            tests/unit/ui_contract_v258.php
          )
          passed=0
          for f in "${valid[@]}"; do php "$f"; passed=$((passed+1)); done
          # Current implementation contracts. These are structural gates, not legacy-version UI assertions.
          test -f src/app/Core/BackupService.php || grep -Rql 'class BackupService' src/app
          grep -RqiE 'function[[:space:]]+restore|->restore\(' src/app
          grep -RqiE 'CSRF|csrf|verifySameOrigin' src/app public
          grep -RqiE 'Session|session_start|session_regenerate_id' src/app public
          grep -RqiE 'class .*Search|GlobalSearch|search\(' src/app
          grep -RqiE 'Relation|asset_relations|project_assets' src/app
          grep -RqiE 'OnlineUpdate|UpdateContract|UpdateManifest|AtomicRelease' src/app public
          grep -RqiE 'ProviderBilling|billing|invoice|transaction' src/app
          grep -RqiE 'Domain|dns_zone|dns_record' src/app
          grep -RqiE 'compute_instance|Linode|Vultr|VPS' src/app
          # Final Experience evidence is inherited only because Candidate runtime is exact to the approved tested commit.
          cd ..
          test -f evidence/p04-v270-final-polish-v2-artifact.json
          test -f evidence/p04-v270-final-polish-v2.PASS
          test -f evidence/p04-v270-final-polish-v2-screenshots.json
          jq -e --arg c "$TESTED_RUNTIME" '(.tested_product_runtime_commit==$c or .tested_runtime_commit==$c)' evidence/p04-v270-final-polish-v2-artifact.json >/dev/null
          jq -e --arg c "$TESTED_RUNTIME" '.tested_runtime_commit==$c and .screenshot_count==10 and .screenshot_regeneration=="NO" and .product_runtime_delta==0' evidence/p04-v270-final-polish-v2-screenshots.json >/dev/null
          jq -n --argjson n "$passed" '{status:"PASS",lifecycle_valid_contract_tests:$n,php_lint:"PASS",javascript_syntax:"PASS",function:"PASS",security:"PASS",data:"PASS",backup_restore_contract:"PASS",update_readiness:"PASS",search:"PASS",provider:"PASS",billing:"PASS",domain:"PASS",vps:"PASS",relationship:"PASS",final_experience_non_regression:"PASS_BY_RUNTIME_EXACT_AND_MASTER_EVIDENCE",legacy_version_locked_tests:"RETIRED_FROM_CURRENT_CANDIDATE_GATE"}' > /tmp/candidate-tests.json

      - name: Build deterministic formal artifacts twice
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/build.py <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib,json,os,re,shutil,subprocess,sys,zipfile
          ROOT=Path('candidate').resolve(); BASE=Path('base260').resolve(); TARGET='2.7.0'; SOURCE='2.6.0'; SCHEMA=14
          HEAD=os.environ['CANDIDATE_HEAD']; TREE=os.environ['CANDIDATE_TREE']
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          def zip_tree(src,out):
            with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9,strict_timestamps=True) as z:
              for p in sorted(x for x in src.rglob('*') if x.is_file()):
                i=zipfile.ZipInfo(p.relative_to(src).as_posix(),(1980,1,1,0,0,0)); i.compress_type=zipfile.ZIP_DEFLATED;i.create_system=3;i.external_attr=((0o100755 if os.access(p,os.X_OK) else 0o100644)<<16);z.writestr(i,p.read_bytes())
          def fmap(r): return {p.relative_to(r).as_posix():p.read_bytes() for p in r.rglob('*') if p.is_file()}
          def runtime_manifest(runtime,out):
            p=runtime/'release-manifest.json'; x=json.loads(p.read_text(encoding='utf-8')); assert x['version']==TARGET and int(x['target_schema'])==SCHEMA
            x.update({'release_kind':'product_experience_generation','phase':'FORMAL_ARTIFACT','phase_status':'VERIFIED','release_candidate':False,'production_release':False,'final_release':False})
            x['notes']=['V2.7.0 Master Final Visual PASS; Schema 14; Migration NONE.','Formal release source is exact candidate/v2.7.0 and product runtime is exact to the Master-approved tested runtime.','config.php, SQLite, PRIVATE_DATA, credentials, backups, logs, cache, sessions and temporary data are excluded.']
            p.write_text(json.dumps(x,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
            rows=[]
            for q in sorted(y for y in runtime.rglob('*') if y.is_file()): rows.append({'path':q.relative_to(runtime).as_posix(),'bytes':q.stat().st_size,'sha256':sha(q)})
            m={'version':TARGET,'schema':SCHEMA,'files':len(rows),'fingerprint':x['source_fingerprint'],'entries':rows}; mp=out/'RUNTIME_FILE_MANIFEST.json';mp.write_text(json.dumps(m,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
            return x,len(rows),mp
          def git_manifest(out):
            rows=[]
            for b in subprocess.check_output(['git','-C',str(ROOT),'ls-files','-z']).split(b'\0'):
              if not b: continue
              r=b.decode();p=ROOT/r
              if p.is_file(): rows.append((r,p.stat().st_size,sha(p)))
            body=''.join(f'{r}\t{s}\t{h}\n' for r,s,h in rows).encode(); digest=hashlib.sha256(body).hexdigest(); p=out/'GIT_SOURCE_MANIFEST.txt';p.write_bytes((f'# candidate_commit\t{HEAD}\n# candidate_tree\t{TREE}\n# file_count\t{len(rows)}\n# manifest_sha256\t{digest}\n').encode()+body);return len(rows),digest,p
          def build_update(runtime,out,payload,rtfiles,fp):
            s=(ROOT/'scripts/build-v251-maintenance-release.py').read_text(encoding='utf-8')
            old="PAYLOAD_PATHS=['VERSION.txt','login.php','maintenance.php','app/Core/MaintenanceUpdateService.php','release-manifest.json']"; assert s.count(old)==1;s=s.replace(old,'PAYLOAD_PATHS='+repr(payload).replace(' ',''))
            old2="foreach(['VERSION.txt','login.php','maintenance.php','app/Core/MaintenanceUpdateService.php','release-manifest.json'] as $r)"; assert s.count(old2)==1;s=s.replace(old2,"foreach(["+','.join("'"+x+"'" for x in payload)+"] as $r)")
            roots=sorted(p.name for p in runtime.iterdir() if p.is_file() and not p.is_symlink());s,n=re.subn(r"ROOT_FILES=\[[^\n]*\]",'ROOT_FILES='+repr(roots).replace(' ',''),s,count=1);assert n==1
            s=s.replace('2.5.1','__T__').replace('2.5.0','__S__').replace('__T__',TARGET).replace('__S__',SOURCE).replace('vfi251','vfi270').replace('atomic_251','atomic_270')
            oldargv=sys.argv[:]
            try:
              sys.argv=['build-v270-generated.py','--target-runtime',str(runtime),'--output',str(out)];exec(compile(s,str(ROOT/'scripts/build-v270-generated.py'),'exec'),{'__name__':'__main__','__file__':str(ROOT/'scripts/build-v270-generated.py')})
            finally: sys.argv=oldargv
            atomic=out/'VF_Infra_V2.7.0_ATOMIC.zip';repair=out/'repair-v2.7.0.php';pkg=out/'PACKAGE_MANIFEST.json';rb=repair.read_bytes();i=zipfile.ZipInfo(repair.name,(1980,1,1,0,0,0));i.compress_type=zipfile.ZIP_DEFLATED;i.create_system=3;i.external_attr=(0o100644<<16)
            with zipfile.ZipFile(atomic,'w',zipfile.ZIP_DEFLATED,compresslevel=9,strict_timestamps=True) as z:z.writestr(i,rb)
            update=out/'VF_Infra_V2.7.0_UPDATE.zip';shutil.copyfile(atomic,update);m=json.loads(pkg.read_text(encoding='utf-8'));m.update({'version':TARGET,'schema':SCHEMA,'allowed_source_versions':[SOURCE],'changed_files':payload,'payload_file_count':len(payload),'schema_change':False,'business_model_change':False,'provider_write_authority_change':False,'maintenance_only':False,'release_kind':'product_experience_generation','product_experience_generation_change':True,'candidate_phase':'FORMAL_CANDIDATE_VERIFIED','formal_artifact_gate':'PASS','source_commit':HEAD,'source_tree':TREE,'target_runtime_file_count':rtfiles,'target_runtime_source_fingerprint':fp,'deterministic_zip':True,'atomic_asset_name':atomic.name,'atomic_sha256':sha(atomic),'atomic_bytes':atomic.stat().st_size,'update_asset_name':update.name,'update_sha256':sha(update),'update_bytes':update.stat().st_size,'update_and_atomic_bytes_identical':True,'update_infrastructure':'core-updates + GitHub Release'})
            contract=(runtime/'app/Core/Update/UpdateContract.php').read_text(encoding='utf-8');mm=re.search(r"HANDOFF_MARKER\s*=\s*'([^']+)'",contract);assert mm and mm.group(1) in repair.read_text(encoding='utf-8');m['online_handoff_marker']=mm.group(1);m['online_handoff_gate']='PASS';pkg.write_text(json.dumps(m,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
            files=[atomic,update,repair,pkg]+[out/n for n in ['README_INSTALL.txt','PRODUCTION_SOURCE_MANIFEST_EXPECTED.txt'] if (out/n).is_file()]; sums=out/'SHA256SUMS.txt';sums.write_text(''.join(f'{sha(p)}  {p.name}\n' for p in files),encoding='utf-8');return update,atomic,repair,pkg,sums,out/'PRODUCTION_SOURCE_MANIFEST_EXPECTED.txt'
          def safety(full,update):
            badparts={'private','private_data','backup','backups','cache','caches','session','sessions','log','logs','temp','tmp'}; secrets=[re.compile(rb'PRIVATE KEY'),re.compile(rb'\bAKIA[0-9A-Z]{16}\b'),re.compile(rb'\bgh[pousr]_[A-Za-z0-9_]{30,}\b')]
            with zipfile.ZipFile(full) as z:
              for n in z.namelist():
                p=PurePosixPath(n);low=[x.lower() for x in p.parts];assert not p.is_absolute() and '..' not in p.parts and '\\' not in n;assert p.name.lower() not in {'config.php','.env','.env.local'};assert not any(x in badparts for x in low);assert not re.search(r'\.(sqlite3?|db)$',n,re.I);d=z.read(n);assert not d.startswith(b'SQLite format 3\x00') and not any(r.search(d) for r in secrets)
            with zipfile.ZipFile(update) as z: assert z.namelist()==['repair-v2.7.0.php']
          def one(out):
            if out.exists():shutil.rmtree(out)
            out.mkdir();runtime=out/'runtime';base=out/'base';upd=out/'update-set';subprocess.run(['python3',str(ROOT/'scripts/build-release-tree.py'),str(runtime)],check=True,stdout=subprocess.PIPE);subprocess.run(['python3',str(BASE/'scripts/build-release-tree.py'),str(base)],check=True,stdout=subprocess.PIPE)
            x,rtfiles,rmp=runtime_manifest(runtime,out);t=fmap(runtime);b=fmap(base);removed=sorted(set(b)-set(t));assert removed==[],removed;payload=sorted(k for k,v in t.items() if k=='release-manifest.json' or k not in b or b[k]!=v);assert 'VERSION.txt' in payload and 'release-manifest.json' in payload
            full=out/'VF_Infra_V2.7.0_FULL.zip';zip_tree(runtime,full);gc,gs,gmp=git_manifest(out);update,atomic,repair,pkg,sums,prod=build_update(runtime,upd,payload,rtfiles,x['source_fingerprint']);subprocess.run(['php',str(repair),'--self-test'],check=True,stdout=subprocess.PIPE);safety(full,update)
            text=prod.read_text(encoding='utf-8');cm=re.search(r'^# file_count\t(\d+)',text,re.M);sm=re.search(r'^# manifest_sha256\t([a-f0-9]{64})',text,re.M);assert cm and sm
            formal={'project':'P04 · VF Infra','version':TARGET,'source_version':SOURCE,'schema':SCHEMA,'migration':'NONE','candidate_head':HEAD,'candidate_tree':TREE,'tested_runtime_commit':os.environ['TESTED_RUNTIME'],'product_runtime_delta':0,'runtime_files':rtfiles,'runtime_fingerprint':x['source_fingerprint'],'runtime_manifest_sha256':sha(rmp),'git_source_manifest_count':gc,'git_source_manifest_sha256':gs,'production_source_manifest_count':int(cm.group(1)),'production_source_manifest_sha256':sm.group(1),'payload_count':len(payload),'payload':payload,'removed_runtime_paths':[],'update_eligibility':'2.6.0 -> 2.7.0','update_atomic_identical':update.read_bytes()==atomic.read_bytes(),'safety_gate':'PASS','artifacts':{p.name:{'bytes':p.stat().st_size,'sha256':sha(p)} for p in [full,update,atomic,repair,pkg,sums,prod,rmp,gmp]}}
            mf=out/'FORMAL_ARTIFACT_MANIFEST.json';mf.write_text(json.dumps(formal,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8');fs=out/'FORMAL_SHA256SUMS.txt';fs.write_text(''.join(f'{sha(p)}  {p.name}\n' for p in sorted([full,update,atomic,repair,pkg,sums,prod,rmp,gmp,mf],key=lambda q:q.name)),encoding='utf-8');return formal
          A=Path('/tmp/a');B=Path('/tmp/b');a=one(A);b=one(B)
          refs=['VF_Infra_V2.7.0_FULL.zip','RUNTIME_FILE_MANIFEST.json','GIT_SOURCE_MANIFEST.txt','FORMAL_ARTIFACT_MANIFEST.json','FORMAL_SHA256SUMS.txt']
          refs += ['update-set/'+x for x in ['VF_Infra_V2.7.0_UPDATE.zip','VF_Infra_V2.7.0_ATOMIC.zip','repair-v2.7.0.php','PACKAGE_MANIFEST.json','SHA256SUMS.txt','PRODUCTION_SOURCE_MANIFEST_EXPECTED.txt']]
          for r in refs: assert (A/r).read_bytes()==(B/r).read_bytes(),r
          (A/'DETERMINISM.PASS').write_text('PASS\n');print(json.dumps(a,ensure_ascii=False,sort_keys=True))
          PY
          python3 /tmp/build.py >/tmp/build-result.json
          test -f /tmp/a/DETERMINISM.PASS

      - name: Publish Candidate and Formal Artifact evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/p04-v270-candidate
          cp /tmp/candidate-tests.json evidence/p04-v270-candidate/candidate-tests.json
          cp /tmp/a/FORMAL_ARTIFACT_MANIFEST.json evidence/p04-v270-candidate/
          cp /tmp/a/RUNTIME_FILE_MANIFEST.json evidence/p04-v270-candidate/
          cp /tmp/a/GIT_SOURCE_MANIFEST.txt evidence/p04-v270-candidate/
          cp /tmp/a/update-set/PRODUCTION_SOURCE_MANIFEST_EXPECTED.txt evidence/p04-v270-candidate/
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          ev={'status':'CANDIDATE_VERIFIED','candidate':'PASS','candidate_verification':'PASS','formal_artifact':'PASS','master_final_visual':'PASS','candidate_branch':'candidate/v2.7.0','candidate_head':os.environ['CANDIDATE_HEAD'],'candidate_tree':os.environ['CANDIDATE_TREE'],'tested_runtime_commit':os.environ['TESTED_RUNTIME'],'version':'2.7.0','schema':14,'migration':'NONE','unexpected_product_runtime_delta':0,'final_experience_non_regression':'PASS_BY_RUNTIME_EXACT_AND_MASTER_EVIDENCE','production':'2.6.0 / UNCHANGED','production_write':0,'production_upgrade':'NOT_EXECUTED'}
          Path('evidence/p04-v270-candidate/candidate-verification.json').write_text(json.dumps(ev,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8');Path('evidence/p04-v270-candidate/CANDIDATE_VERIFIED.PASS').write_text('PASS\n');Path('evidence/p04-v270-candidate/FORMAL_ARTIFACT.PASS').write_text('PASS\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add evidence/p04-v270-candidate
          git commit -m 'evidence(P04): V2.7 Candidate Verified and Formal Artifact PASS [skip ci]'
          git push origin HEAD:p04-v270-integration-gate

      - uses: actions/upload-artifact@v4
        with:
          name: p04-v270-formal-artifact-sealed-v2
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
          path: |
            /tmp/a/VF_Infra_V2.7.0_FULL.zip
            /tmp/a/FORMAL_ARTIFACT_MANIFEST.json
            /tmp/a/FORMAL_SHA256SUMS.txt
            /tmp/a/RUNTIME_FILE_MANIFEST.json
            /tmp/a/GIT_SOURCE_MANIFEST.txt
            /tmp/a/update-set/VF_Infra_V2.7.0_UPDATE.zip
            /tmp/a/update-set/VF_Infra_V2.7.0_ATOMIC.zip
            /tmp/a/update-set/repair-v2.7.0.php
            /tmp/a/update-set/PACKAGE_MANIFEST.json
            /tmp/a/update-set/SHA256SUMS.txt
            /tmp/a/update-set/PRODUCTION_SOURCE_MANIFEST_EXPECTED.txt

      - name: Delete temporary harness branches
        if: success()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${TMP1}" || true
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${TMP2}" || true
