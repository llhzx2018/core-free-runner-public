name: S01-C02 1.21.913 Distribution R24 Gate

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CORE_UPDATES_SHA: 711128b2f2e4967c1e9de495c1ac7c753dbdc689
      PRODUCT_SHA: a35dada3e273ff6bb3015353224da39b849ba57a
      TAG: v1.21.913
      ASSET: vf-tools-ops_V1.21.913.zip
      ASSET_BYTES: "3480687"
      ASSET_SHA256: aaa31761c743597f2892a1a498f1fbd1ecf0704f331419d4afcb5c05fbe7f12d
      RUNTIME_FINGERPRINT: f9d355bffe97a54532c4203c8440115a1a816d5d1dad437d558d0f9d6310eaf7

    steps:
      - name: Checkout exact distribution candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: 711128b2f2e4967c1e9de495c1ac7c753dbdc689
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: dist
          persist-credentials: false

      - name: Checkout exact product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: a35dada3e273ff6bb3015353224da39b849ba57a
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: ops
          persist-credentials: false

      - name: Verify manifest updater and R24
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C dist rev-parse HEAD)" = "$CORE_UPDATES_SHA"
          python3 dist/scripts/check_manifest_contract.py >/tmp/manifest.json
          grep -Fq '"status": "PASS"' /tmp/manifest.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          m=json.loads(Path('dist/projects/S01-C02.json').read_text())
          assert m['target_version']=='1.21.913'
          assert m['release_tag']==os.environ['TAG']
          assert m['asset_name']==os.environ['ASSET']
          assert m['asset_bytes']==int(os.environ['ASSET_BYTES'])
          assert m['asset_sha256']==os.environ['ASSET_SHA256']
          assert m['runtime_files']==972
          assert m['runtime_fingerprint']==os.environ['RUNTIME_FINGERPRINT']
          assert '1.21.912' in m['from_versions']
          assert m['schema_from']=='6.0.0' and m['schema_to']=='6.0.0'
          PY
          find dist/update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php dist/update-core/php/tests/run.php
          php ops/tests/s01-c02-121913-interaction-language-r24-contract.php

      - name: Verify Formal Release binding
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          JSON="$(gh api "repos/llhzx2018/vf-tools-ops/releases/tags/$TAG")"
          test "$(jq -r '.target_commitish' <<<"$JSON")" = "$PRODUCT_SHA"
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.size' <<<"$JSON")" = "$ASSET_BYTES"
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.digest' <<<"$JSON")" = "sha256:$ASSET_SHA256"
          mkdir -p /tmp/release
          gh release download "$TAG" --repo llhzx2018/vf-tools-ops --pattern "$ASSET" --dir /tmp/release
          test "$(sha256sum "/tmp/release/$ASSET" | awk '{print $1}')" = "$ASSET_SHA256"
          echo PASS_DISTRIBUTION_R24
