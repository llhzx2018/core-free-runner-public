name: S01 Theme Dropdown R15 Candidate Gate

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/s01-c01-dropdown-r15-gate-20260925.yml'

permissions:
  contents: read

jobs:
  gate:
    if: github.head_ref == 'task/s01-c01-dropdown-r15-gate-20260925'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      THEME_SHA: 31323a2b6cc347b29044a6a4aa19313a66540876
    steps:
      - name: Credential presence
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: test -n "$READ_TOKEN"

      - name: Checkout exact Theme candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: ${{ env.THEME_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: theme

      - name: Exact source
        run: |
          set -Eeuo pipefail
          test "$(git -C theme rev-parse HEAD)" = "$THEME_SHA"
          test "$(tr -d '\r\n' < theme/VERSION)" = "1.35.41"

      - name: PHP syntax
        run: |
          set -Eeuo pipefail
          php -l theme/tests/s01-c01-admin-shell-alignment-r1-contract.php

      - name: Header R15 source contract
        working-directory: theme
        run: |
          set -Eeuo pipefail
          php tests/s01-c01-admin-shell-alignment-r1-contract.php
          grep -Fq 'R15 · Production-open dropdown visibility closure' src/assets/css/admin/admin-s01-shell-header-final-r12.css
          grep -Fq 'overflow-x:visible!important' src/assets/css/admin/admin-s01-shell-header-final-r12.css
          grep -Fq 'overflow-y:visible!important' src/assets/css/admin/admin-s01-shell-header-final-r12.css
          grep -Fq 'isolation:isolate!important' src/assets/css/admin/admin-s01-shell-header-final-r12.css
          grep -Fq 'z-index:120!important' src/assets/css/admin/admin-s01-shell-header-final-r12.css
          grep -Fq 'pointer-events:auto!important' src/assets/css/admin/admin-s01-shell-header-final-r12.css
          grep -Fq 'overflow-y:hidden!important' src/assets/css/admin/admin-phase4.css

      - name: Adjacent Theme shell regressions
        working-directory: theme
        run: |
          set -Eeuo pipefail
          php tests/visible-console-v2-contract.php
          php tests/final-admin-human-closure-contract.php
