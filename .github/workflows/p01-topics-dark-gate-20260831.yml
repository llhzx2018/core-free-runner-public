name: P01 Topics Dark Token Gate
on:
  push:
    branches: [task/p01-topics-dark-gate-20260831]
    paths: [.github/workflows/p01-topics-dark-gate-20260831.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE: cb9586da3dd072cead6233f1043c7b91d0e819d1
      TREE: fd722846bd280459466ab1650afc5f4958f6e934
      BASE_SOURCE: 312a22a1a1ea005e28e5b93d879e1d0cb128ad6f
      CSS_BLOB: 61d0b6c6ab210c32881f54842f01eaf6919f6897
      ROOT: /tmp/p01-topics-dark
      EVID: /tmp/p01-topics-dark-evid
      PORT: '18381'
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Exact source fence
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$SOURCE"
          test "$(git -C product rev-parse HEAD^{tree})" = "$TREE"
          test "$(git -C product rev-parse HEAD:src/assets/resource-media.css)" = "$CSS_BLOB"
          test "$(cat product/VERSION)" = '2.34.0'
          test "$(git -C product diff --name-only "$BASE_SOURCE"..HEAD)" = 'src/assets/resource-media.css'
          test "$(git -C product diff --numstat "$BASE_SOURCE"..HEAD)" = $'1\t1\tsrc/assets/resource-media.css'
          git -C product diff --check "$BASE_SOURCE"..HEAD
          echo P01_TOPICS_DARK_SOURCE=PASS
      - name: Fresh runtime fixture
        run: |
          set -Eeuo pipefail
          rm -rf "$ROOT" "$EVID"
          cp -a product/src "$ROOT"
          php -S 127.0.0.1:$PORT -t "$ROOT" >/tmp/p01-topics-dark-server.log 2>&1 & echo $! >/tmp/p01-topics-dark.pid
          sleep 1
          curl -fsS -c /tmp/p01-topics-dark.cookies -b /tmp/p01-topics-dark.cookies "http://127.0.0.1:$PORT/setup.php" -o /tmp/p01-topics-dark-setup.html
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-topics-dark-setup.html',encoding='utf-8').read()
          print(re.search(r'name="setup_csrf"\s+value="([^"]+)"',s).group(1))
          PY
          )
          curl -fsS -c /tmp/p01-topics-dark.cookies -b /tmp/p01-topics-dark.cookies -X POST "http://127.0.0.1:$PORT/setup.php" --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=Topics Dark Gate' --data-urlencode 'admin_password=TopicsDark2026' --data-urlencode 'admin_password_confirm=TopicsDark2026' -o /tmp/p01-topics-dark-post.html
          cat >/tmp/p01-topics-dark-seed.php <<'PHP'
          <?php
          require '/tmp/p01-topics-dark/app/bootstrap.php';
          require_once '/tmp/p01-topics-dark/app/SurfaceRepository.php';
          $r=new VfRepository(vf_db());$s=new VfSurfaceRepository(vf_db());
          $c=$r->createCategory(['name'=>'专题验证','description'=>'','is_private'=>false]);
          foreach(['独立网站出海指南','VPS 迁移专题','Web 安全学习路线','SEO 赚钱完整指南'] as $i=>$title){
            $x=$r->saveLink(null,['category_id'=>$c,'title'=>$title,'url'=>'https://example.com/topic-dark-'.$i,'description'=>'用于专题深色模式视觉验证的长期知识页','tags'=>'专题,指南','is_private'=>$i===3,'is_favorite'=>$i===0],'manual');
            $s->upsertProfile((int)$x['id'],['surface'=>'topics','resource_kind'=>$i%2?'学习路线':'指南','surface_note'=>'长期维护']);
          }
          echo "P01_TOPICS_DARK_SEED=PASS\n";
          PHP
          php /tmp/p01-topics-dark-seed.php | grep -Fx P01_TOPICS_DARK_SEED=PASS
          echo P01_TOPICS_DARK_RUNTIME=PASS
      - name: Chromium Topics theme authority
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVID" /tmp/p01-topics-dark-pw
          cd /tmp/p01-topics-dark-pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat >gate.cjs <<'JS'
          const {chromium}=require('playwright'),fs=require('fs');
          const rgb=s=>{const m=String(s).match(/rgba?\((\d+(?:\.\d+)?)[, ]+(\d+(?:\.\d+)?)[, ]+(\d+(?:\.\d+)?)/);return m?[+m[1],+m[2],+m[3]]:null};
          const lum=c=>{const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(c[0])+.7152*f(c[1])+.0722*f(c[2])};
          const contrast=(a,b)=>{const A=lum(a),B=lum(b);return (Math.max(A,B)+.05)/(Math.min(A,B)+.05)};
          (async()=>{
            const b=await chromium.launch({headless:true});
            const c=await b.newContext({viewport:{width:1440,height:1000}});
            const login=await c.request.post('http://127.0.0.1:18381/api.php?action=login',{data:{password:'TopicsDark2026'}});
            if(!login.ok()||!(await login.json()).ok)throw Error('login failed');
            const p=await c.newPage(),errors=[];p.on('pageerror',e=>errors.push(String(e)));
            const read=()=>p.evaluate(()=>{
              const card=document.querySelector('.vf-topic-card'),cover=document.querySelector('.vf-topic-cover'),title=document.querySelector('.vf-topic-copy strong'),grid=document.querySelector('.vf-topic-grid'),sel=document.querySelector('.vf-topic-card>.vf-asset-select');
              if(!card||!cover||!title||!grid) return null;
              const cr=card.getBoundingClientRect(),gr=grid.getBoundingClientRect();
              return {cardBg:getComputedStyle(card).backgroundColor,cardBorder:getComputedStyle(card).borderColor,coverBg:getComputedStyle(cover).backgroundImage,titleColor:getComputedStyle(title).color,selectBg:sel?getComputedStyle(sel).backgroundColor:'',cardWidth:cr.width,gridWidth:gr.width,cols:getComputedStyle(grid).gridTemplateColumns,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth};
            });
            await p.goto('http://127.0.0.1:18381/topics.php',{waitUntil:'networkidle'});await p.waitForTimeout(160);
            const light=await read();if(!light||light.overflow>1)throw Error('light shell '+JSON.stringify(light));
            const lbg=rgb(light.cardBg),lt=rgb(light.titleColor);if(!lbg||!lt||lum(lbg)<.80||contrast(lbg,lt)<4.0)throw Error('light contrast '+JSON.stringify(light));
            await p.screenshot({path:process.env.EVID+'/topics-1440-light.png'});
            await p.evaluate(()=>document.documentElement.setAttribute('data-theme','dark'));await p.waitForTimeout(120);
            const dark=await read();if(!dark||dark.overflow>1)throw Error('dark shell '+JSON.stringify(dark));
            const dbg=rgb(dark.cardBg),dt=rgb(dark.titleColor);if(!dbg||!dt||lum(dbg)>.18||contrast(dbg,dt)<4.0)throw Error('dark contrast '+JSON.stringify(dark));
            if(dark.coverBg.includes('244, 246, 248')||dark.coverBg.includes('232, 237, 241'))throw Error('dark cover remains light '+dark.coverBg);
            await p.screenshot({path:process.env.EVID+'/topics-1440-dark.png'});
            await p.setViewportSize({width:390,height:844});await p.goto('http://127.0.0.1:18381/topics.php',{waitUntil:'networkidle'});await p.waitForTimeout(120);
            const mobileLight=await read();if(!mobileLight||mobileLight.overflow>1||mobileLight.cardWidth<150||mobileLight.cardWidth>190)throw Error('mobile light '+JSON.stringify(mobileLight));
            await p.screenshot({path:process.env.EVID+'/topics-390-light.png'});
            await p.evaluate(()=>document.documentElement.setAttribute('data-theme','dark'));await p.waitForTimeout(100);
            const mobileDark=await read();const mdbg=mobileDark&&rgb(mobileDark.cardBg),mdt=mobileDark&&rgb(mobileDark.titleColor);if(!mobileDark||mobileDark.overflow>1||!mdbg||!mdt||lum(mdbg)>.18||contrast(mdbg,mdt)<4.0)throw Error('mobile dark '+JSON.stringify(mobileDark));
            await p.screenshot({path:process.env.EVID+'/topics-390-dark.png'});
            if(errors.length)throw Error('page errors '+errors.join(' | '));
            fs.writeFileSync(process.env.EVID+'/metrics.json',JSON.stringify({light,dark,mobileLight,mobileDark},null,2));
            fs.writeFileSync(process.env.EVID+'/verdict.txt',`P01_TOPICS_DARK=PASS\nSOURCE=${process.env.SOURCE}\n`);
            await b.close();console.log('P01_TOPICS_DARK_UI=PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          EVID="$EVID" SOURCE="$SOURCE" node gate.cjs 2>&1 | tee "$EVID/result.txt"
          grep -Fx P01_TOPICS_DARK_UI=PASS "$EVID/result.txt"
      - name: Regression baseline and data integrity
        run: |
          set -Eeuo pipefail
          php "$ROOT/cli/verify.php" | grep -Fx VERIFY_PASS=YES
          php "$ROOT/cli/surface-verify.php" | grep -Fx MULTI_SURFACE_PASS=YES
          php "$ROOT/cli/baseline-verify.php" | tee /tmp/p01-topics-dark-baseline.txt
          grep -Fx BASELINE_CORE_PASS=YES /tmp/p01-topics-dark-baseline.txt
          grep -Fx DRIFT_COUNT=0 /tmp/p01-topics-dark-baseline.txt
          grep -Fx UNKNOWN_COUNT=0 /tmp/p01-topics-dark-baseline.txt
          php -r 'require "/tmp/p01-topics-dark/app/bootstrap.php";$db=vf_db();if(strtolower((string)$db->query("PRAGMA integrity_check")->fetchColumn())!=="ok")exit(1);if($db->query("PRAGMA foreign_key_check")->fetchAll(PDO::FETCH_ASSOC))exit(2);echo "SQLITE_PASS\n";' | grep -Fx SQLITE_PASS
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-topics-dark-${{ github.run_id }}
          path: ${{ env.EVID }}
          if-no-files-found: error
          retention-days: 30
      - name: Verdict
        run: |
          echo P01_TOPICS_DARK_GATE=PASS
          echo PRODUCT_FILES_CHANGED=1
          echo SCHEMA_CHANGE=NO
          echo PRODUCTION_WRITE=NO
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/p01-topics-dark.pid 2>/dev/null)" 2>/dev/null || true
