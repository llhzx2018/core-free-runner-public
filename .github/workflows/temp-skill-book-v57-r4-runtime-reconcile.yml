name: TEMP skill-book V5.7 Current R4 runtime reconciliation
on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/temp-skill-book-v57-r4-runtime-reconcile.yml'
permissions:
  contents: read
jobs:
  reconcile-runtime:
    runs-on: ubuntu-24.04
    env:
      GOV_REPO: llhzx2018/gov-doc
      EXPECTED_MAIN_SHA: c171efbf04fa02947e21dd10eab04fbd2646235a
    steps:
      - name: Require registered VF capabilities
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$VF_PRIVATE_READ_TOKEN"
          test -n "$VF_RELEASE_WRITE_TOKEN"
          echo 'REGISTERED_CAPABILITIES=PASS'
      - name: Checkout exact GOV-DOC main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/gov-doc
          ref: c171efbf04fa02947e21dd10eab04fbd2646235a
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: gov
      - name: Verify pre-reconciliation authority
        working-directory: gov
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          grep -F '| skill-book | V5.7 | V5.7 CANDIDATE（已安装；Source / Distribution Current 均为 V5.7） |' CURRENT.md
          grep -F 'INSTALLED_RUNTIME_OBSERVATION = V5.7 CANDIDATE INSTALL' mother-specs/skill-book/V5.7/CURRENT_STATE.md
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('distribution/skills/CURRENT_SKILL_DISTRIBUTION.json').read_text(encoding='utf-8'))
          b=next(x for x in d['skills'] if x['name']=='skill-book')
          assert b['version']=='V5.7'
          assert b['install_package']=='skill-book_V5.7_INSTALL_20260829r4.zip'
          assert b['bytes']==216743
          assert b['sha256']=='1672b2b53c035da7aae398c610315df9a52da51bafa62ec9358a9c2c4c0a0b0e'
          assert b['asset_state']=='PUBLISHED_REMOTE_VERIFIED'
          print('R4_RUNTIME_RECONCILIATION_PREFLIGHT=PASS')
          PY
      - name: Apply runtime observation only
        working-directory: gov
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          current=Path('CURRENT.md')
          text=current.read_text(encoding='utf-8')
          old='| skill-book | V5.7 | V5.7 CANDIDATE（已安装；Source / Distribution Current 均为 V5.7） |'
          new='| skill-book | V5.7 | V5.7 CURRENT R4（已安装；OWNER UI VERIFIED） |'
          assert text.count(old)==1
          text=text.replace(old,new)
          old2='当前个人运行层仍记录为已安装的 V5.7 Candidate bytes，直到 OWNER 重新安装 Current R4 build 后才可更新 Installed Runtime Observation。'
          new2='OWNER 已确认重新安装 V5.7 Current R4 build；当前个人运行层记录为 V5.7 Current R4（OWNER UI VERIFIED）。'
          assert text.count(old2)==1
          current.write_text(text.replace(old2,new2),encoding='utf-8')

          state=Path('mother-specs/skill-book/V5.7/CURRENT_STATE.md')
          s=state.read_text(encoding='utf-8')
          assert s.count('INSTALLED_RUNTIME_OBSERVATION = V5.7 CANDIDATE INSTALL')==1
          s=s.replace('INSTALLED_RUNTIME_OBSERVATION = V5.7 CANDIDATE INSTALL','INSTALLED_RUNTIME_OBSERVATION = V5.7 CURRENT R4 / OWNER_UI_VERIFIED')
          old3='The installed runtime observation does not silently become the R4 Current install build merely because Source/Distribution Current changed. OWNER installation/readback is a separate runtime gate. AI blind-reader evidence remains proxy evidence only; `REAL_READER_EVIDENCE = NOT_RUN`.'
          new3='OWNER explicitly confirmed installation of `skill-book_V5.7_INSTALL_20260829r4.zip`. Runtime self-introspection remains `NOT_EXPOSED`, so this installed identity is recorded as operator UI evidence, not independent model introspection. AI blind-reader evidence remains proxy evidence only; `REAL_READER_EVIDENCE = NOT_RUN`.'
          assert s.count(old3)==1
          state.write_text(s.replace(old3,new3),encoding='utf-8')

          rec=Path('mother-specs/skill-book/V5.7/V57_INSTALLED_RUNTIME_RECONCILIATION_20260829.json')
          rec.write_text(json.dumps({
            'schema':'skill-book-installed-runtime-reconciliation/v1',
            'skill':'skill-book',
            'version':'V5.7',
            'distribution_build':'R4',
            'install_package':'skill-book_V5.7_INSTALL_20260829r4.zip',
            'bytes':216743,
            'sha256':'1672b2b53c035da7aae398c610315df9a52da51bafa62ec9358a9c2c4c0a0b0e',
            'source_current':'V5.7',
            'current_distribution':'V5.7 / R4 / PUBLISHED_REMOTE_VERIFIED',
            'installation_evidence':'OWNER_UI_VERIFIED_CURRENT_R4',
            'runtime_self_introspection':'NOT_EXPOSED',
            'installed_runtime_observation':'V5.7 CURRENT R4 / OWNER_UI_VERIFIED',
            'real_reader_evidence':'NOT_RUN'
          },ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('V57_CURRENT_R4_RUNTIME_RECONCILIATION=PREPARED')
          PY
      - name: Guard scope and push exact main
        working-directory: gov
        env:
          VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add CURRENT.md mother-specs/skill-book/V5.7/CURRENT_STATE.md mother-specs/skill-book/V5.7/V57_INSTALLED_RUNTIME_RECONCILIATION_20260829.json
          mapfile -t changed < <(git diff --cached --name-only)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 3
          git diff --cached --exit-code -- skills/skill-book/V5.7 distribution/skills
          git commit -m 'skill-book: reconcile installed V5.7 Current R4 runtime'
          NEW_SHA="$(git rev-parse HEAD)"
          git push "https://x-access-token:${VF_RELEASE_WRITE_TOKEN}@github.com/${GOV_REPO}.git" "HEAD:refs/heads/main"
          echo "V57_R4_RUNTIME_RECONCILIATION_SHA=$NEW_SHA"
      - name: Remote main readback
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GOV_REPO']; token=os.environ['VF_PRIVATE_READ_TOKEN']
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/git/ref/heads/main',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=30) as r: data=json.load(r)
          sha=data['object']['sha']
          assert sha != os.environ['EXPECTED_MAIN_SHA']
          print(f'REMOTE_MAIN_V57_R4_RUNTIME_RECONCILIATION={sha}')
          PY