name: P02 V2.5.17 Trusted Dispatcher

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v2517-dispatch.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch trusted engineering workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh workflow run p02-v2517-library-model-convergence.yml --repo llhzx2018/core-free-runner-public --ref main
          echo P02_V2517_DISPATCH=PASS
