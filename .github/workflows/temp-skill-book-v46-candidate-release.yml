name: TEMP skill-book V4.6 Candidate Release

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-skill-book-v46-candidate-release.yml'
      - 'requests/skill-book-v46-candidate-release-*.txt'

permissions:
  contents: read

concurrency:
  group: temp-skill-book-v46-candidate-release
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: llhzx2018/gov-doc
  SOURCE_COMMIT: '27ca368b9f7bc8d6160ff5049562c74cb440144b'
  SOURCE_PATH: skills/skill-book/V4.6
  TARGET_VERSION: '4.6'
  SOURCE_CURRENT: '3.5'
  TAG: skill-book-v4.6-candidate-20260827
  ASSET_NAME: skill-book_V4.6_CANDIDATE_20260827.zip
  SHA_NAME: skill-book_V4.6_CANDIDATE_20260827.zip.sha256

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Registered release capabilities
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN" || { echo 'VF_PRIVATE_READ_TOKEN_MISSING' >&2; exit 78; }
          test -n "$RELEASE_TOKEN" || { echo 'VF_RELEASE_WRITE_TOKEN_MISSING' >&2; exit 78; }
          echo 'REGISTERED_RELEASE_CAPABILITIES=PASS'

      - name: Checkout exact GOV-DOC Candidate source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_COMMIT }}
          token: ${{ env.READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: source

      - name: Exact source preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(tr -d '\r\n' < source/$SOURCE_PATH/VERSION)" = "$TARGET_VERSION"
          jq -e '.version=="4.6" and .status=="CANDIDATE_NOT_CURRENT" and .source_current_skill=="3.5" and .validation.python_unit_tests=="27/27 PASS" and .current_promotion=="NOT_AUTHORIZED"' source/$SOURCE_PATH/MANIFEST.json >/dev/null
          grep -Fq 'SEALED_STANDALONE_FORWARD' source/$SOURCE_PATH/SKILL.md
          grep -Fq 'BOOK-GATE-PRACTICAL-ASSET-ADEQUACY' source/$SOURCE_PATH/SKILL.md
          echo 'EXACT_SOURCE_PREFLIGHT=PASS'

      - name: Run V4.6 source tests and syntax
        shell: bash
        working-directory: source/skills/skill-book/V4.6
        run: |
          set -Eeuo pipefail
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/v46-tests.txt"
          grep -Eq 'Ran 27 tests' "$RUNNER_TEMP/v46-tests.txt"
          grep -Eq '^OK$' "$RUNNER_TEMP/v46-tests.txt"
          python -m compileall -q scripts tests
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          echo 'V46_SOURCE_TESTS=27/27_PASS'
          echo 'V46_PYTHON_SYNTAX=PASS'

      - name: Build deterministic Candidate ZIP twice
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$RUNNER_TEMP/v46-build-a" "$RUNNER_TEMP/v46-build-b" "$RUNNER_TEMP/v46-release"
          mkdir -p "$RUNNER_TEMP/v46-build-a" "$RUNNER_TEMP/v46-build-b" "$RUNNER_TEMP/v46-release"
          for out in "$RUNNER_TEMP/v46-build-a/$ASSET_NAME" "$RUNNER_TEMP/v46-build-b/$ASSET_NAME"; do
            SRC="source/$SOURCE_PATH" OUT="$out" python3 - <<'PY'
          from pathlib import Path
          import os, zipfile
          src=Path(os.environ['SRC']); out=Path(os.environ['OUT'])
          prefix='skill-book_V4.6_CANDIDATE'
          files=sorted(p for p in src.rglob('*') if p.is_file() and '__pycache__' not in p.parts and p.suffix!='.pyc')
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9,strict_timestamps=True) as z:
              for p in files:
                  rel=p.relative_to(src).as_posix()
                  info=zipfile.ZipInfo(f'{prefix}/{rel}',date_time=(1980,1,1,0,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.create_system=3
                  info.external_attr=(0o100644<<16)
                  z.writestr(info,p.read_bytes())
          PY
          done
          cmp "$RUNNER_TEMP/v46-build-a/$ASSET_NAME" "$RUNNER_TEMP/v46-build-b/$ASSET_NAME"
          cp "$RUNNER_TEMP/v46-build-a/$ASSET_NAME" "$RUNNER_TEMP/v46-release/$ASSET_NAME"
          ASSET="$RUNNER_TEMP/v46-release/$ASSET_NAME" python3 - <<'PY'
          from pathlib import Path
          import hashlib, os, zipfile
          p=Path(os.environ['ASSET'])
          sha=hashlib.sha256(p.read_bytes()).hexdigest()
          with zipfile.ZipFile(p) as z:
              bad=z.testzip(); assert bad is None,bad
              names=z.namelist(); assert len(names)==len(set(names)),'duplicate path'
              assert not any(n.startswith('/') or '..' in Path(n).parts for n in names),'unsafe path'
              assert not any('__pycache__' in n or n.endswith('.pyc') for n in names),'pycache/pyc'
              assert len([n for n in names if not n.endswith('/')])==34,len(names)
          print(f'ASSET_BYTES={p.stat().st_size}')
          print(f'ASSET_SHA256={sha}')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write(f'ASSET_BYTES={p.stat().st_size}\nASSET_SHA256={sha}\n')
          PY
          printf '%s  %s\n' "$ASSET_SHA256" "$ASSET_NAME" > "$RUNNER_TEMP/v46-release/$SHA_NAME"
          echo 'DETERMINISTIC_BUILD_TWICE=PASS'

      - name: Create exact Candidate tag and prerelease
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C source config user.name 'VF Release Automation'
          git -C source config user.email 'release@kewaro.com'
          if git -C source show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git -C source rev-list -n1 "$TAG")" = "$SOURCE_COMMIT"
          else
            git -C source tag -a "$TAG" "$SOURCE_COMMIT" -m 'skill-book V4.6 Candidate'
            git -C source remote set-url origin "https://x-access-token:${RELEASE_TOKEN}@github.com/${SOURCE_REPOSITORY}.git"
            git -C source push origin "refs/tags/$TAG"
          fi
          cat > "$RUNNER_TEMP/v46-release/release-notes.md" <<EOF
          skill-book V4.6 Candidate / NOT CURRENT.

          Source authority: ${SOURCE_REPOSITORY}@${SOURCE_COMMIT}
          Source path: ${SOURCE_PATH}
          Source Current remains: skill-book V${SOURCE_CURRENT}
          Unit tests: 27/27 PASS
          Reader Outcome Doctrine: READ / LEARN / TRAIN / DO
          Added: complexity-calibrated depth, practical-asset adequacy, training-instrument strength, sealed standalone forward + post-draft baseline differential.
          Real Reader Forward Evidence: NOT_RUN
          Current Promotion: NOT_AUTHORIZED
          EOF
          if gh release view "$TAG" --repo "$SOURCE_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/v46-release/$ASSET_NAME#$ASSET_NAME" "$RUNNER_TEMP/v46-release/$SHA_NAME#$SHA_NAME" --repo "$SOURCE_REPOSITORY" --clobber
          else
            gh release create "$TAG" \
              "$RUNNER_TEMP/v46-release/$ASSET_NAME#$ASSET_NAME" \
              "$RUNNER_TEMP/v46-release/$SHA_NAME#$SHA_NAME" \
              --repo "$SOURCE_REPOSITORY" \
              --title 'skill-book V4.6 Candidate' \
              --notes-file "$RUNNER_TEMP/v46-release/release-notes.md" \
              --prerelease --verify-tag
          fi
          echo 'V46_CANDIDATE_PRERELEASE_CREATED=PASS'

      - name: Remote Release Asset readback and verification
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$RUNNER_TEMP/v46-readback" && mkdir -p "$RUNNER_TEMP/v46-readback"
          gh release download "$TAG" --repo "$SOURCE_REPOSITORY" --pattern "$ASSET_NAME" --pattern "$SHA_NAME" --dir "$RUNNER_TEMP/v46-readback"
          ASSET="$RUNNER_TEMP/v46-readback/$ASSET_NAME" EXPECTED_SHA="$ASSET_SHA256" EXPECTED_BYTES="$ASSET_BYTES" python3 - <<'PY'
          from pathlib import Path
          import hashlib, os, zipfile
          p=Path(os.environ['ASSET'])
          assert p.stat().st_size==int(os.environ['EXPECTED_BYTES']),(p.stat().st_size,os.environ['EXPECTED_BYTES'])
          got=hashlib.sha256(p.read_bytes()).hexdigest(); assert got==os.environ['EXPECTED_SHA'],(got,os.environ['EXPECTED_SHA'])
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              names=z.namelist(); assert len(names)==len(set(names))
              assert not any(n.startswith('/') or '..' in Path(n).parts for n in names)
              assert not any('__pycache__' in n or n.endswith('.pyc') for n in names)
          print('REMOTE_ASSET_BYTES_SHA256_CRC_PATHS=PASS')
          PY
          grep -Fq "$ASSET_SHA256  $ASSET_NAME" "$RUNNER_TEMP/v46-readback/$SHA_NAME"

      - name: Read Release identity
        shell: bash
        run: |
          set -Eeuo pipefail
          release_json="$(gh api "repos/$SOURCE_REPOSITORY/releases/tags/$TAG")"
          RELEASE_ID="$(jq -r '.id' <<<"$release_json")"
          ASSET_ID="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.id' <<<"$release_json")"
          SHA_ASSET_ID="$(jq -r --arg n "$SHA_NAME" '.assets[]|select(.name==$n)|.id' <<<"$release_json")"
          REMOTE_DIGEST="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.digest' <<<"$release_json")"
          test "$REMOTE_DIGEST" = "sha256:$ASSET_SHA256"
          {
            echo "RELEASE_ID=$RELEASE_ID"
            echo "ASSET_ID=$ASSET_ID"
            echo "SHA_ASSET_ID=$SHA_ASSET_ID"
          } >> "$GITHUB_ENV"
          echo "RELEASE_ID=$RELEASE_ID ASSET_ID=$ASSET_ID SHA_ASSET_ID=$SHA_ASSET_ID"

      - name: Checkout current GOV-DOC for distribution reconciliation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: main
          token: ${{ env.RELEASE_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: gov-main

      - name: Reconcile V4.6 distribution authority
        shell: bash
        working-directory: gov-main
        run: |
          set -Eeuo pipefail
          SOURCE_COMMIT="$SOURCE_COMMIT" TAG="$TAG" ASSET_NAME="$ASSET_NAME" SHA_NAME="$SHA_NAME" ASSET_SHA256="$ASSET_SHA256" ASSET_BYTES="$ASSET_BYTES" RELEASE_ID="$RELEASE_ID" ASSET_ID="$ASSET_ID" SHA_ASSET_ID="$SHA_ASSET_ID" RUN_ID="${{ github.run_id }}" JOB_ID="${{ job.check_run_id }}" python3 - <<'PY'
          from pathlib import Path
          import os
          source=os.environ['SOURCE_COMMIT']; tag=os.environ['TAG']; name=os.environ['ASSET_NAME']; shaname=os.environ['SHA_NAME']
          sha=os.environ['ASSET_SHA256']; size=os.environ['ASSET_BYTES']; rid=os.environ['RELEASE_ID']; aid=os.environ['ASSET_ID']; said=os.environ['SHA_ASSET_ID']; run=os.environ['RUN_ID']; job=os.environ.get('JOB_ID','')
          release=f'https://github.com/llhzx2018/gov-doc/releases/tag/{tag}'
          dl=f'https://github.com/llhzx2018/gov-doc/releases/download/{tag}/{name}'
          shadl=f'https://github.com/llhzx2018/gov-doc/releases/download/{tag}/{shaname}'

          cur=Path('CURRENT.md'); s=cur.read_text(encoding='utf-8')
          old='`skill-book V4.0/V4.1/V4.2/V4.3/V4.4` 为保留的历史 Candidate，`V4.5` 为最新 Candidate；六者均未晋升 Source Current，也未进入 Current Distribution。'
          new='`skill-book V4.0/V4.1/V4.2/V4.3/V4.4/V4.5` 为保留的历史 Candidate，`V4.6` 为最新 Candidate；七者均未晋升 Source Current，也未进入 Current Distribution。'
          assert old in s or new in s
          cur.write_text(s.replace(old,new),encoding='utf-8')

          status=Path('distribution/skills/candidates/skill-book/V4.6/RUNTIME_ZIP_MIRROR_STATUS.md')
          status.write_text(f'''# Runtime ZIP Mirror Status · skill-book V4.6

状态：`PUBLISHED_REMOTE_VERIFIED`

V4.6 Candidate 已通过 `core-free-runner-public` 临时机器 Release Gate 完成远端 Candidate Asset 发布；临时 Workflow 只用于本次发布验证，不进入 Public Runner Current。

## Published Distribution Authority

- Release：`skill-book V4.6 Candidate`（prerelease）
- Tag：`{tag}`
- Release ID：`{rid}`
- File：`{name}`
- Remote Asset ID：`{aid}`
- Bytes：`{size}`
- SHA-256：`{sha}`
- SHA Asset ID：`{said}`
- Source Commit：`{source}`
- Runner Run：`{run}`
- Remote download readback：PASS
- ZIP CRC：PASS
- Unsafe Path：0
- Duplicate Path：0
- pycache/pyc：0
- Production Write：0

下载地址：

`{dl}`

SHA 文件：

`{shadl}`

## Authority Boundary

- Source：`skills/skill-book/V4.6/`
- Mother Overlay：`mother-specs/skill-book/V4.6/SKILL_BOOK_V4.6_CANDIDATE_OVERLAY.md`
- Source Current：`skill-book V3.5`
- Installed Runtime Observation：仍为已实际安装的V4.5 Candidate，直到OWNER安装V4.6并回读
- V4.6：`CANDIDATE / NOT CURRENT`
- Current Promotion：`NOT_AUTHORIZED`

发布前本地构建 `aa7909d64928dfe59ec0aee8383d3d1efd89ad67aa92ffaf847a2ce9e43b5d4e` 只保留为pre-release local identity；从本状态生效起，远端回读验证通过的 `{sha}` 为Published Distribution Authority。
''',encoding='utf-8')

          readme=Path('distribution/skills/candidates/skill-book/V4.6/README.md')
          r=readme.read_text(encoding='utf-8')
          marker='## Candidate ZIP\n'
          head=r.split(marker,1)[0]
          readme.write_text(head+f'''## Candidate ZIP

- [直接下载 V4.6 Candidate ZIP]({dl})
- [下载 SHA-256 文件]({shadl})
- [查看 Candidate Release]({release})

Published Distribution Identity：

- Bytes：`{size}`
- SHA-256：`{sha}`
- Release ID：`{rid}`
- Remote Asset ID：`{aid}`
- Exact Source Commit：`{source}`
- Runner Run：`{run}`
- Remote Download Readback：`PASS`
- ZIP CRC / Unsafe Path / Duplicate Path：`PASS`
- Status：`PUBLISHED_REMOTE_VERIFIED`

V4.6仍是`CANDIDATE / NOT CURRENT`；Source Current保持V3.5，Real Reader Forward Evidence与V4.6 Backend Runtime Forward Test仍未运行。
''',encoding='utf-8')

          idx=Path('distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md')
          s=idx.read_text(encoding='utf-8')
          marker='## Candidate（不改变 Current）'
          assert marker in s
          prefix=s.split(marker,1)[0]
          section=f'''## Candidate（不改变 Current）

`skill-book V4.6` 是最新 `CANDIDATE / NOT CURRENT`；Source Current 仍为 V3.5，且 V4.6 不包含在 Current 总包中。Installed Runtime Observation仍保持V4.5，直到OWNER实际安装V4.6并回读。

- [直接下载 skill-book V4.6 Candidate ZIP]({dl})
- [下载 SHA-256 文件]({shadl})
- [查看 V4.6 Candidate Release]({release})
- [查看 V4.6 Candidate Source](https://github.com/llhzx2018/gov-doc/tree/main/skills/skill-book/V4.6)
- [查看 V4.6 Candidate Mother Overlay](https://github.com/llhzx2018/gov-doc/blob/main/mother-specs/skill-book/V4.6/SKILL_BOOK_V4.6_CANDIDATE_OVERLAY.md)
- [查看 V4.6 Candidate 分发说明](https://github.com/llhzx2018/gov-doc/blob/main/distribution/skills/candidates/skill-book/V4.6/README.md)

Published Distribution Identity：

- Bytes：`{size}`
- SHA-256：`{sha}`
- Release ID：`{rid}`
- Remote Asset ID：`{aid}`
- Exact Source Commit：`{source}`
- Runner Run：`{run}`
- Remote Download Readback：`PASS`
- ZIP CRC / Unsafe Path / Duplicate Path：`PASS`
- Status：`PUBLISHED_REMOTE_VERIFIED`

发布前本地V4.6构建SHA `aa7909d64928dfe59ec0aee8383d3d1efd89ad67aa92ffaf847a2ce9e43b5d4e` 只保留为pre-release local build identity；正式Candidate Distribution以远端回读SHA `{sha}` 为Authority。

历史 Candidate：

- [skill-book V4.5](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.5)
- [skill-book V4.4](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.4)
- [skill-book V4.3](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.3)
- [skill-book V4.2](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.2)
- [skill-book V4.1](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.1)
- [skill-book V4.0](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.0)
'''
          idx.write_text(prefix+section,encoding='utf-8')
          print('V46_DISTRIBUTION_RECONCILIATION_PREPARED=PASS')
          PY
          git config user.name 'VF Release Automation'
          git config user.email 'release@kewaro.com'
          git add CURRENT.md distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md distribution/skills/candidates/skill-book/V4.6/README.md distribution/skills/candidates/skill-book/V4.6/RUNTIME_ZIP_MIRROR_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m 'skill-book: publish V4.6 candidate distribution authority'
            git remote set-url origin "https://x-access-token:${RELEASE_TOKEN}@github.com/${SOURCE_REPOSITORY}.git"
            git push origin HEAD:main
          fi
          echo 'V46_GOV_DOC_DISTRIBUTION_RECONCILED=PASS'

      - name: Online authority readback
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/$SOURCE_REPOSITORY/contents/distribution/skills/candidates/skill-book/V4.6/RUNTIME_ZIP_MIRROR_STATUS.md?ref=main" --jq .content | tr -d '\n' | base64 -d > "$RUNNER_TEMP/v46-status.md"
          grep -Fq 'PUBLISHED_REMOTE_VERIFIED' "$RUNNER_TEMP/v46-status.md"
          grep -Fq "$ASSET_SHA256" "$RUNNER_TEMP/v46-status.md"
          gh api "repos/$SOURCE_REPOSITORY/contents/CURRENT.md?ref=main" --jq .content | tr -d '\n' | base64 -d > "$RUNNER_TEMP/v46-current.md"
          grep -Fq '`V4.6` 为最新 Candidate' "$RUNNER_TEMP/v46-current.md"
          grep -Fq '| skill-book | V3.5 | V4.5 CANDIDATE（非 Current） |' "$RUNNER_TEMP/v46-current.md"
          release_json="$(gh api "repos/$SOURCE_REPOSITORY/releases/tags/$TAG")"
          test "$(jq -r '.prerelease' <<<"$release_json")" = true
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.digest' <<<"$release_json")" = "sha256:$ASSET_SHA256"
          echo 'V46_ONLINE_AUTHORITY_READBACK=PASS'
          echo 'PRODUCTION_WRITE=0'

      - name: Build public-safe release evidence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p public-evidence
          {
            echo 'SKILL=skill-book'
            echo 'VERSION=4.6'
            echo "SOURCE_COMMIT=$SOURCE_COMMIT"
            echo 'SOURCE_CURRENT=3.5'
            echo 'STATUS=CANDIDATE_NOT_CURRENT'
            echo 'UNIT_TESTS=27/27_PASS'
            echo "ASSET_NAME=$ASSET_NAME"
            echo "ASSET_BYTES=${ASSET_BYTES:-UNKNOWN}"
            echo "ASSET_SHA256=${ASSET_SHA256:-UNKNOWN}"
            echo "RELEASE_ID=${RELEASE_ID:-UNKNOWN}"
            echo "ASSET_ID=${ASSET_ID:-UNKNOWN}"
            echo 'REAL_READER_FORWARD_EVIDENCE=NOT_RUN'
            echo 'CURRENT_PROMOTION=NOT_AUTHORIZED'
            echo 'PRODUCTION_WRITE=0'
            echo "JOB_STATUS=${{ job.status }}"
          } > public-evidence/SKILL_BOOK_V46_CANDIDATE_RELEASE.txt

      - name: Upload public-safe release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SKILL-BOOK-V4.6-CANDIDATE-RELEASE-EVIDENCE
          path: public-evidence/SKILL_BOOK_V46_CANDIDATE_RELEASE.txt
          if-no-files-found: error
          retention-days: 30
