name: P01 Add Drawer Efficiency Gate
on:
  push:
    branches: [task/p01-add-drawer-gate-20260828]
    paths:
      - .github/workflows/p01-add-drawer-efficiency-gate-20260828.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE: cd995cde98004d11a8dc5d92fc585a0e25eebeef
      TREE: f03dc08ca886d13c77c20f979493db1fa3074f60
      BASE_SOURCE: f4c0ab6265e4c8c72a9f6f34b4980692483e5f6d
      ROOT: /tmp/p01-add-drawer
      PORT: '18334'
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Exact source fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$SOURCE"
          test "$(git -C product rev-parse HEAD^{tree})" = "$TREE"
          test "$(cat product/VERSION)" = '2.27.0'
          node --check product/src/assets/workspace.js
          git -C product diff --name-only "$BASE_SOURCE"..HEAD | tee /tmp/p01-add-drawer-files.txt
          test "$(cat /tmp/p01-add-drawer-files.txt)" = 'src/assets/workspace.js'
          ! find product/database/migrations -type f -newer product/src/assets/workspace.js 2>/dev/null | grep .
          echo P01_ADD_DRAWER_EXACT=PASS
      - name: Fresh runtime with representative data
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$ROOT" /tmp/p01-add-drawer-ids.json /tmp/p01-add-drawer.cookies
          cp -a product/src "$ROOT"
          php -S 127.0.0.1:$PORT -t "$ROOT" >/tmp/p01-add-drawer-server.log 2>&1 & echo $! >/tmp/p01-add-drawer.pid
          for i in $(seq 1 30); do curl -fsS -c /tmp/p01-add-drawer.cookies -b /tmp/p01-add-drawer.cookies "http://127.0.0.1:$PORT/setup.php" -o /tmp/p01-add-drawer-setup.html && break || sleep 1; done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-add-drawer-setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c /tmp/p01-add-drawer.cookies -b /tmp/p01-add-drawer.cookies -X POST "http://127.0.0.1:$PORT/setup.php" \
            --data-urlencode "setup_csrf=$CSRF" \
            --data-urlencode 'site_title=Add Drawer Gate' \
            --data-urlencode 'admin_password=P01Add!Drawer' \
            --data-urlencode 'admin_password_confirm=P01Add!Drawer' \
            -o /tmp/p01-add-drawer-setup-post.html
          cat >/tmp/p01-add-drawer-seed.php <<'PHP'
          <?php
          require '/tmp/p01-add-drawer/app/bootstrap.php';
          require_once '/tmp/p01-add-drawer/app/SurfaceRepository.php';
          $r=new VfRepository(vf_db());$s=new VfSurfaceRepository(vf_db());
          $dev=$r->createCategory(['name'=>'开发工具','description'=>'','is_private'=>false]);
          $ai=$r->createCategory(['name'=>'AI 资料','description'=>'','is_private'=>false]);
          $channel=$r->createCategory(['name'=>'频道','description'=>'','is_private'=>false]);
          $watch=$r->createCategory(['name'=>'影视','description'=>'','is_private'=>false]);
          for($i=1;$i<=110;$i++)$r->saveLink(null,['category_id'=>$dev,'title'=>'Dev Tool '.str_pad((string)$i,3,'0',STR_PAD_LEFT),'url'=>'https://dev'.$i.'.example.com','description'=>'developer tool','tags'=>'工具','is_private'=>true],'manual');
          for($i=1;$i<=40;$i++)$r->saveLink(null,['category_id'=>$ai,'title'=>'AI Resource '.str_pad((string)$i,3,'0',STR_PAD_LEFT),'url'=>'https://ai'.$i.'.example.com','description'=>'ai resource','tags'=>'AI','is_private'=>true],'manual');
          for($i=1;$i<=12;$i++){ $x=$r->saveLink(null,['category_id'=>$channel,'title'=>'Channel '.str_pad((string)$i,2,'0',STR_PAD_LEFT),'url'=>'https://youtube.com/@drawer'.$i,'description'=>'channel','tags'=>'频道','is_private'=>true],'manual');$s->upsertProfile((int)$x['id'],['surface'=>'channels','resource_kind'=>'creator','background_friendly'=>$i%2===0]); }
          for($i=1;$i<=12;$i++){ $x=$r->saveLink(null,['category_id'=>$watch,'title'=>'Movie '.str_pad((string)$i,2,'0',STR_PAD_LEFT),'url'=>'https://movie'.$i.'.example.com','description'=>'movie','tags'=>'影视','is_private'=>true],'manual');$s->upsertProfile((int)$x['id'],['surface'=>'watch','resource_kind'=>'movie','media_status'=>'want']); }
          file_put_contents('/tmp/p01-add-drawer-ids.json',json_encode(['dev'=>$dev,'ai'=>$ai,'channel'=>$channel,'watch'=>$watch],JSON_THROW_ON_ERROR));
          echo "P01_ADD_DRAWER_SEED=PASS\n";
          PHP
          php /tmp/p01-add-drawer-seed.php | grep -Fx P01_ADD_DRAWER_SEED=PASS
          echo P01_ADD_DRAWER_RUNTIME=PASS
      - name: Browser interaction and UI evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-add-drawer-ui /tmp/p01-playwright
          cd /tmp/p01-playwright
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          cat >gate.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const ids=JSON.parse(fs.readFileSync('/tmp/p01-add-drawer-ids.json','utf8'));
            const base='http://127.0.0.1:18334';
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:1440,height:1000}});
            const login=await context.request.post(base+'/api.php?action=login',{data:{password:'P01Add!Drawer'}});
            if(!login.ok()) throw new Error('login http '+login.status());
            const loginBody=await login.json();if(!loginBody.ok)throw new Error('login rejected');
            const page=await context.newPage();
            const errors=[];page.on('pageerror',e=>errors.push(String(e)));
            const openAdd=async()=>{await page.locator('[data-open-add]').click();await page.locator('[data-panel="add"]:not([hidden])').waitFor();};
            const assertAddDefaults=async(surface,categoryId)=>{
              const gotSurface=await page.locator('[data-add-form] select[name="surface"]').inputValue();if(gotSurface!==surface)throw new Error(`surface default ${gotSurface} != ${surface}`);
              if(categoryId!==undefined){const gotCategory=await page.locator('[data-add-form] select[name="category_id"]').inputValue();if(String(gotCategory)!==String(categoryId))throw new Error(`category default ${gotCategory} != ${categoryId}`)}
              await page.locator('[data-panel="add"] header [data-close-panel]').click();await page.waitForTimeout(180);
            };

            await page.goto(base+'/channels.php',{waitUntil:'networkidle'});await openAdd();await assertAddDefaults('channels');
            await page.goto(base+'/watch.php',{waitUntil:'networkidle'});await openAdd();await assertAddDefaults('watch');
            await page.goto(base+`/surfaces.php?surface=channels&category=${ids.channel}`,{waitUntil:'networkidle'});await openAdd();await assertAddDefaults('channels',ids.channel);
            await page.goto(base+'/start.php?category='+encodeURIComponent('AI 资料'),{waitUntil:'networkidle'});await openAdd();await assertAddDefaults('start',ids.ai);

            await page.goto(base+`/surfaces.php?surface=channels&category=${ids.channel}`,{waitUntil:'networkidle'});await openAdd();
            const add=page.locator('[data-add-form]');
            await add.locator('input[name="url"]').fill('https://batch-channel.example.com');
            await add.locator('input[name="title"]').fill('Batch Channel Z');
            await add.locator('input[name="tags"]').fill('频道, 批量');
            const continueButton=add.locator('[data-add-continue]');await continueButton.waitFor();await continueButton.click();
            await page.locator('.vf-workspace-toast.show').waitFor();
            if(await page.locator('[data-panel="add"]').getAttribute('hidden')!==null)throw new Error('add panel closed after continue');
            if((await add.locator('input[name="url"]').inputValue())!=='')throw new Error('url not cleared after continue');
            if((await add.locator('input[name="title"]').inputValue())!=='')throw new Error('title not cleared after continue');
            if((await add.locator('select[name="surface"]').inputValue())!=='channels')throw new Error('surface not retained after continue');
            if((await add.locator('select[name="category_id"]').inputValue())!==String(ids.channel))throw new Error('category not retained after continue');
            if((await add.locator('input[name="tags"]').inputValue())!=='频道, 批量')throw new Error('tags not retained after continue');
            await page.screenshot({path:'/tmp/p01-add-drawer-ui/desktop-add-continue.png',fullPage:true});
            await page.locator('[data-panel="add"] header [data-close-panel]').click();await page.waitForTimeout(750);

            await page.goto(base+'/start.php?per=30&page=3',{waitUntil:'networkidle'});
            await page.evaluate(()=>window.scrollTo(0,700));await page.waitForTimeout(100);const before=await page.evaluate(()=>window.scrollY);
            const row=page.locator('[data-asset-row]').nth(8);const rowId=await row.getAttribute('data-asset-row');await row.click();
            const detail=page.locator('[data-detail-form]');await detail.locator('textarea[name="description"]').fill('drawer keyboard save marker');await detail.locator('textarea[name="description"]').focus();
            const req=page.waitForRequest(r=>r.url().includes('/workspace-action.php')&&r.method()==='POST');await page.keyboard.press('Control+Enter');await req;await page.waitForTimeout(1000);
            const after=await page.evaluate(()=>window.scrollY);if(before>400&&after<before-180)throw new Error(`scroll not restored: ${before} -> ${after}`);
            const reopened=page.locator(`[data-asset-row="${rowId}"]`);await reopened.click();await page.locator('[data-panel="detail"]:not([hidden])').waitFor();
            if((await detail.locator('textarea[name="description"]').inputValue())!=='drawer keyboard save marker')throw new Error('keyboard save did not persist');
            await page.screenshot({path:'/tmp/p01-add-drawer-ui/desktop-detail-drawer.png',fullPage:true});
            await page.locator('[data-panel="detail"] header [data-close-panel]').click();

            await page.setViewportSize({width:390,height:844});await page.goto(base+'/channels.php',{waitUntil:'networkidle'});await openAdd();
            const rect=await page.locator('[data-panel="add"]').evaluate(el=>{const r=el.getBoundingClientRect();return {left:r.left,right:r.right,width:r.width,win:innerWidth}});if(rect.left<0||rect.right>rect.win+1)throw new Error('mobile add dialog overflow '+JSON.stringify(rect));
            await page.screenshot({path:'/tmp/p01-add-drawer-ui/mobile-channels-add.png',fullPage:true});
            if(errors.length)throw new Error('page errors: '+errors.join(' | '));
            await browser.close();console.log('P01_ADD_DRAWER_UI=PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node gate.js | tee /tmp/p01-add-drawer-ui/result.txt
          grep -Fx P01_ADD_DRAWER_UI=PASS /tmp/p01-add-drawer-ui/result.txt
      - name: Regression baseline and data integrity
        shell: bash
        run: |
          set -Eeuo pipefail
          php "$ROOT/cli/verify.php" | grep -Fx VERIFY_PASS=YES
          php "$ROOT/cli/surface-verify.php" | grep -Fx MULTI_SURFACE_PASS=YES
          php "$ROOT/cli/baseline-verify.php" | tee /tmp/p01-add-drawer-baseline.txt
          grep -Fx BASELINE_CORE_PASS=YES /tmp/p01-add-drawer-baseline.txt
          grep -Fx DRIFT_COUNT=0 /tmp/p01-add-drawer-baseline.txt
          grep -Fx UNKNOWN_COUNT=0 /tmp/p01-add-drawer-baseline.txt
          php -r 'require "/tmp/p01-add-drawer/app/bootstrap.php";$db=vf_db();if(strtolower((string)$db->query("PRAGMA integrity_check")->fetchColumn())!=="ok")exit(1);if($db->query("PRAGMA foreign_key_check")->fetchAll(PDO::FETCH_ASSOC))exit(2);$n=(int)$db->query("SELECT COUNT(*) FROM links WHERE url=\"https://batch-channel.example.com\"")->fetchColumn();if($n!==1)exit(3);echo "P01_ADD_DRAWER_SQLITE=PASS\n";' | grep -Fx P01_ADD_DRAWER_SQLITE=PASS
          echo P01_ADD_DRAWER_REGRESSION=PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P01-add-drawer-efficiency-ui-evidence
          path: /tmp/p01-add-drawer-ui
          if-no-files-found: error
          retention-days: 30
      - name: Verdict
        run: |
          echo P01_ADD_DRAWER_SOURCE=$SOURCE
          echo P01_ADD_DRAWER_TREE=$TREE
          echo P01_ADD_DRAWER_GATE=PASS
          echo PRODUCT_FILES_CHANGED=1
          echo SCHEMA_CHANGE=NO
          echo PRODUCTION_WRITE=NO
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/p01-add-drawer.pid 2>/dev/null)" 2>/dev/null || true
