name: temp-s01-ops-121860-m3u8-12531-postpush-bump-gates-20260908
on:
  push:
    branches: [temp/s01-page-update-center-v4-20260907]
    paths: [.github/workflows/temp-s01-ops-121860-m3u8-12531-postpush-bump-gates-20260908.yml]
permissions:
  contents: read
jobs:
  ops-bump-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      REPO: llhzx2018/vf-tools-ops
      BASE: fed61edd6df2f8bdd07d8b3f18707fcb33e412bf
      HEAD: e476546e83da9848122e472bd5699c9370cafeaa
      BRANCH: work/s01-ops-top-domains-visible-refinement-20260908
    steps:
      - name: Ops exact post-push bump gate
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/ops-post
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/${REPO}.git" /tmp/ops-post
          cd /tmp/ops-post
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$BASE"
          test "$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')" = "$HEAD"
          git checkout -q "$HEAD"
          test "$(tr -d '\r\n' < VERSION)" = 1.21.860
          expected=(
            VERSION
            assets/css/current/admin-s01-top-domains-v3.css
            includes/admin-v13/views/dashboard.php
            includes/views/admin-style-helpers/admin-s01-uiux-polish.php
            tests/admin-human-language-contract.php
            tests/dashboard-visible-ui-contract.php
            tests/system-components-human-language-contract.php
            tests/top-domains-visible-ui-contract.php
            tests/update-refresh-policy-current-contract.php
            tests/visible-console-v2-contract.php
            vf-ops.php
          )
          mapfile -t got < <(git diff --name-only "$BASE" "$HEAD" | sort)
          mapfile -t want < <(printf '%s\n' "${expected[@]}" | sort)
          test "$(printf '%s\n' "${got[@]}")" = "$(printf '%s\n' "${want[@]}")"
          test -z "$(grep -RIl --exclude-dir=.git --exclude-dir=vendor --exclude-dir=node_modules --exclude='*.md' --exclude='*.json' --exclude='*.lock' '1\.21\.859' VERSION vf-ops.php includes/admin-v13/views/dashboard.php tests 2>/dev/null || true)"
          grep -F 'Version: 1.21.860' vf-ops.php >/dev/null
          grep -F "VF_OPS_VERSION', '1.21.860" vf-ops.php >/dev/null
          php tests/top-domains-visible-ui-contract.php
          php tests/dashboard-visible-ui-contract.php
          php tests/admin-human-language-contract.php
          php tests/system-components-human-language-contract.php
          php tests/update-refresh-policy-current-contract.php
          php tests/visible-console-v2-contract.php
          php tests/update-compat-human-language-contract.php
          python3 - <<'PY'
          from pathlib import Path
          s=Path('assets/css/current/admin-s01-top-domains-v3.css').read_text()
          assert s.count('{') == s.count('}')
          for x in ('.vf-v13-publish-single','.vf-accept-product','.vf-site-release',':focus-visible','@media (max-width:782px)'): assert x in s
          PY
          ! git diff "$BASE" "$HEAD" -- includes/wp-update | grep -E '^[+-].*(6\.0\.0|vf-ops/vf-ops\.php|locator|migration)' >/dev/null
          echo 'OPS_SCHEMA=6.0.0 OPS_LOCATOR=vf-ops/vf-ops.php OPS_LOCATOR_CUTOVER=false'
          echo 'PASS_S01_C02_121860_POSTPUSH_BUMP_GATE'

  m3u8-bump-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      REPO: llhzx2018/vf-tools-m3u8
      BASE: 22247609c95e1c2bf5a85e81c6ebb2c8caac3f6b
      HEAD: b59268d6bc16cd9e7aed575ce78b30d965ecb3bd
      BRANCH: work/s01-m3u8-routine-surfaces-visible-refinement-20260908
    steps:
      - name: M3U8 exact post-push bump gate
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/m3u8-post /tmp/m3u8-delivered-sim
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/${REPO}.git" /tmp/m3u8-post
          cd /tmp/m3u8-post
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$BASE"
          test "$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')" = "$HEAD"
          git checkout -q "$HEAD"
          test "$(tr -d '\r\n' < VERSION)" = 1.25.31
          expected=(
            VERSION
            src/admin/admin-s01-uiux-polish.php
            src/admin/ui-v4/pages/r78-routine-surfaces-visible-v4.css
            src/admin/ui-v4/phase4-component-workspace.css
            src/vf-tool-m3u8.php
            tests/provider-dashboard-visible-ui-contract.php
            tests/routine-surfaces-visible-ui-contract.php
            tests/unit/dashboard-human-language-contract.php
            tests/unit/host-recovery-human-language-contract.php
            tests/unit/package-physical-locator-contract.php
            tests/unit/recovery-runtime-human-language-followup-contract.php
            tests/unit/settings-human-language-followup-contract.php
            tests/unit/update-refresh-policy-contract.php
            tests/unit/visible-console-v2-contract.php
          )
          mapfile -t got < <(git diff --name-only "$BASE" "$HEAD" | sort)
          mapfile -t want < <(printf '%s\n' "${expected[@]}" | sort)
          test "$(printf '%s\n' "${got[@]}")" = "$(printf '%s\n' "${want[@]}")"
          test -z "$(grep -RIl --exclude-dir=.git --exclude-dir=vendor --exclude-dir=node_modules --exclude='*.md' --exclude='*.json' --exclude='*.lock' '1\.25\.30' VERSION src/vf-tool-m3u8.php src/admin/ui-v4/phase4-component-workspace.css tests 2>/dev/null || true)"
          grep -F 'Version: 1.25.31' src/vf-tool-m3u8.php >/dev/null
          grep -F "VF_TOOL_M3U8_VERSION', '1.25.31" src/vf-tool-m3u8.php >/dev/null
          php tests/routine-surfaces-visible-ui-contract.php
          php tests/provider-dashboard-visible-ui-contract.php
          php tests/frontend-s01-uiux-final-owner-contract.php
          php tests/unit/dashboard-human-language-contract.php
          php tests/unit/host-recovery-human-language-contract.php
          php tests/unit/package-physical-locator-contract.php
          php tests/unit/recovery-runtime-human-language-followup-contract.php
          php tests/unit/settings-human-language-followup-contract.php
          php tests/unit/update-refresh-policy-contract.php
          php tests/unit/visible-console-v2-contract.php
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/admin/ui-v4/pages/r78-routine-surfaces-visible-v4.css').read_text()
          assert s.count('{') == s.count('}')
          for x in ('.vf-v510-settings','.vf-preview','.vf-recovery',':focus-visible','@media (max-width:782px)'): assert x in s
          PY
          mkdir -p /tmp/m3u8-delivered-sim/vf-tool-m3u8
          cp -a src/. /tmp/m3u8-delivered-sim/vf-tool-m3u8/
          test -f /tmp/m3u8-delivered-sim/vf-tool-m3u8/admin/ui-v4/pages/r78-routine-surfaces-visible-v4.css
          test -f /tmp/m3u8-delivered-sim/vf-tool-m3u8/vf-tool-m3u8.php
          ! git diff "$BASE" "$HEAD" -- src/includes/update | grep -E '^[+-].*(1\.3\.0|vf-tool-m3u8/vf-tool-m3u8\.php|locator|migration)' >/dev/null
          echo 'M3U8_SCHEMA=1.3.0 M3U8_LOCATOR=vf-tool-m3u8/vf-tool-m3u8.php M3U8_LOCATOR_CUTOVER=false M3U8_MIGRATION=CLOSED'
          echo 'PASS_S01_C03_12531_POSTPUSH_BUMP_GATE'
