name: P07 Care rc52 one-page WordPress evidence overview
on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/p07-system-care/0.1.0-rc52/**'
      - 'tests/test_p07_wp_owner_overview_rc52.py'
      - 'installers/p07-toolbox.sh'
      - 'installers/p07-system-care.sh'
      - '.github/workflows/p07-care-rc52-owner-status-gate.yml'
permissions:
  contents: read
jobs:
  owner-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify frozen menu and immutable package
        shell: bash
        run: |
          set -Eeuo pipefail
          pkg='packages/p07-system-care/0.1.0-rc52'
          test "$(cat "$pkg/VERSION")" = '0.1.0-rc52'
          test "$(git hash-object "$pkg/MANIFEST.gitblob")" = 'd32c9dc5eba1e517e2cc5f7f3876d6bf694dcc4b'
          (cd "$pkg" && while read -r hash file; do test "$(git hash-object "$file")" = "$hash"; done < MANIFEST.gitblob)
          bash -n "$pkg/intrusion-evidence.sh" "$pkg/vf-system-care.sh"
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc52"' installers/p07-toolbox.sh
          grep -Fq 'VF_NODE_EXPECTED="0.1.0-rc13"' installers/p07-toolbox.sh
          grep -Fq 'VPS_AUDIT_EXPECTED="V2.1.0"' installers/p07-toolbox.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release84"' installers/p07-toolbox.sh
          grep -Fq "VERSION='0.1.0-rc52'" installers/p07-system-care.sh
          grep -Fq "MANIFEST_BLOB='d32c9dc5eba1e517e2cc5f7f3876d6bf694dcc4b'" installers/p07-system-care.sh
          echo P07_RC52_IMMUTABLE_DISTRIBUTION=PASS
      - name: Isolated pseudo-TTY dangerous write gating and one-screen status
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s tests -p test_p07_wp_owner_baseline_rc50.py -v
          python3 -m unittest discover -s tests -p test_p07_wp_owner_status_rc51.py -v
          python3 -m unittest discover -s tests -p test_p07_wp_owner_overview_rc52.py -v
          python3 -m unittest discover -s tests -p test_p07_wp_owner_triage_rc48.py -v
          bash -n packages/p07-system-care/0.1.0-rc52/intrusion-evidence.sh
          echo P07_RC52_RISK_GATE_AND_STATUS=PASS
