name: P07 M03 141 real CloudPanel Laravel document root proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-m03-laravel-live-cloudpanel-create-141-20261119.yml'
permissions:
  contents: read
jobs:
  actual-cloudpanel:
    if: github.repository == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Public workflow checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact private product transient checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 3c82ed9597eb6aae4aa0fcda45dc7425376b9985
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: .p07-private-exact
      - name: Pin and reduce already proven QEMU fixture to empty CloudPanel receiver
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-private-exact rev-parse HEAD)" = 3c82ed9597eb6aae4aa0fcda45dc7425376b9985
          mkdir -m 0700 -p "$RUNNER_TEMP/p07-laravel"
          curl --retry 2 --connect-timeout 15 --max-time 120 -fsSLo "$RUNNER_TEMP/p07-laravel/original.sh" \
            https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/83a8fbf80760040a4f97a1299207625704680c49/tests/p07_m03_d04_mariadb_e2e_20261116.sh
          python3 -B - "$RUNNER_TEMP/p07-laravel/original.sh" "$RUNNER_TEMP/p07-laravel/run.sh" <<'PY'
          import hashlib,pathlib,sys
          raw=pathlib.Path(sys.argv[1]).read_bytes()
          assert hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()=="bdc78b71162e6e6ae2174a7ace8486ad6b6b012c"
          s=raw.decode()
          end='ssh_vm "$OLD" \x27bash -se\x27 <<\x27SOURCE\x27'.replace("\x27","'")
          assert s.count(end)==1
          s=s.split(end,1)[0]
          old="80e70ba47a1f0a8dc399e0381aeb29a66a7e6c4e"
          assert s.count(old)==1
          s=s.replace(old,"3c82ed9597eb6aae4aa0fcda45dc7425376b9985")
          assert s.count("for vm in old new; do")==2
          s=s.replace("for vm in old new; do","for vm in new; do")
          assert s.count('for ip in "$OLD" "$NEW"; do')==2
          s=s.replace('for ip in "$OLD" "$NEW"; do','for ip in "$NEW"; do')
          pathlib.Path(sys.argv[2]).write_text(s)
          print("P07_LARAVEL_PINNED_DISPOSABLE_VM=PASS")
          PY
          cat >> "$RUNNER_TEMP/p07-laravel/run.sh" <<'PROOF'
          cd "$ROOT"
          rsync -aq -e "ssh -i $KEY -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$WORK/known_hosts" \
            "$ROOT/.p07-private-exact/lib" root@"$NEW":/opt/vf-server-ops/
          ssh_vm "$NEW" 'bash -se' <<'REAL'
          set -Eeuo pipefail
          stage=INIT
          fail() { rc=$?; echo "P07_LARAVEL_PROOF_FAILED_STAGE=$stage"; exit "$rc"; }
          trap fail ERR
          stage=PRODUCT_CREATION_AND_CLOUDPANEL_READBACK
          python3 -B - <<'PY' >/root/p07-laravel-real.log 2>&1
          import json,sys
          from pathlib import Path
          sys.path.insert(0,"/opt/vf-server-ops/lib")
          import inventory,cutover,server_migration as migration
          import migration_php_site_template as template
          for n in (12,13):
              label=f"Laravel {n}"
              domain=f"laravel{n}.p07.example.com"
              user=f"p07laravel{n}"
              base=f"/home/{user}/htdocs/{domain}"
              item={"domain":domain,"site_user":user,"site_root":base,
                    "document_root":base+"/public","domains":[domain],
                    "runtime":{"type":"php","version":"8.4"},
                    "migration_vhost_template":label}
              assert template.template_shape_proven(label), "TEMPLATE_NOT_VERIFIED"
              path=Path(f"/root/p07-{n}.json")
              path.write_text(json.dumps(item));path.chmod(0o600)
              created=migration.target_create_site_local("p07-laravel-proof",path)
              assert created["status"]=="CREATED" and not created["resumed"]
              found=cutover.find_site(inventory.build_manifest(Path("/")),domain)
              assert found and found["document_root"]==base+"/public"
              assert migration.verify_target_site_creation(item)==[]
              Path(base+"/index.php").write_text("<?php echo 'WRONG_ROOT';")
              Path(base+"/public/index.php").write_text("<?php echo 'P07_LARAVEL_ROOT_OK';")
              print(f"P07_LARAVEL_{n}_CREATED_AND_READBACK=PASS")
          PY
          stage=HTTPS_PUBLIC_ROOT
          for n in 12 13; do
            site="laravel$n.p07.example.com"
            curl -kfsS --max-time 30 --resolve "$site:443:127.0.0.1" "https://$site/" >"/root/p07-$n.html"
            test "$(cat "/root/p07-$n.html")" = P07_LARAVEL_ROOT_OK
            printf 'P07_LARAVEL_%s_REAL_HTTPS_ROOT=PASS\n' "$n"
          done
          echo P07_LARAVEL_REAL_CLOUDPANEL_PRODUCT_PROOF=PASS
          REAL
          PROOF
          bash -n "$RUNNER_TEMP/p07-laravel/run.sh"
      - name: Execute real isolated CloudPanel site creation and HTTPS readback
        shell: bash
        run: |
          set -Eeuo pipefail
          bash "$RUNNER_TEMP/p07-laravel/run.sh"
      - name: Cleanup all temporary private source and test artifacts
        if: always()
        shell: bash
        run: |
          rm -rf -- .p07-private-exact "$RUNNER_TEMP/p07-laravel"
          echo P07_LARAVEL_PRIVATE_TEST_CLEANUP=PASS
