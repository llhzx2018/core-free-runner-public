name: Core Updates S01 Theme 1.35.37 M3U8 1.25.41 Exact Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/core-updates-s01-c01-c03-13537-12541-exact-gate-20260924.yml'

permissions:
  contents: read

jobs:
  exact-core-updates-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_SHA: 6491738c313517dd4853dd9151cfda65d2f2e69d
    steps:
      - name: Credential presence
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"

      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: core-updates

      - name: Verify exact source and S01 manifests
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C core-updates rev-parse HEAD)" = "$TARGET_SHA"
          test "$(jq -r '.target_version' core-updates/projects/S01-C01.json)" = "1.35.37"
          test "$(jq -r '.release_tag' core-updates/projects/S01-C01.json)" = "v1.35.37"
          test "$(jq -r '.asset_name' core-updates/projects/S01-C01.json)" = "vf-tools-theme_V1.35.37.zip"
          test "$(jq -r '.asset_bytes' core-updates/projects/S01-C01.json)" = "1737821"
          test "$(jq -r '.asset_sha256' core-updates/projects/S01-C01.json)" = "c61ae45dbacc5bbc631829511f203901e0956468cb4784963dffd87aa1a0047f"
          test "$(jq -r '.runtime_files' core-updates/projects/S01-C01.json)" = "459"
          test "$(jq -r '.runtime_fingerprint' core-updates/projects/S01-C01.json)" = "faf10186b774fce38b74969bf5d9904e97f5b8b36c59747f56b018068c0894e3"
          jq -e '.from_versions | index("1.35.36") != null' core-updates/projects/S01-C01.json >/dev/null

          test "$(jq -r '.target_version' core-updates/projects/S01-C03.json)" = "1.25.41"
          test "$(jq -r '.release_tag' core-updates/projects/S01-C03.json)" = "v1.25.41"
          test "$(jq -r '.asset_name' core-updates/projects/S01-C03.json)" = "vf-tools-m3u8_V1.25.41.zip"
          test "$(jq -r '.asset_bytes' core-updates/projects/S01-C03.json)" = "3598135"
          test "$(jq -r '.asset_sha256' core-updates/projects/S01-C03.json)" = "14a022e23aa0fe06981fdb5f8e0277fdf59de30a33ee98b3e8ac476c5e8ea765"
          test "$(jq -r '.runtime_files' core-updates/projects/S01-C03.json)" = "563"
          test "$(jq -r '.runtime_fingerprint' core-updates/projects/S01-C03.json)" = "3797c527ad295e83433bc813577f94768c9f14eaee47246673583db70af6cb95"
          test "$(jq -r '.schema_from + "->" + .schema_to' core-updates/projects/S01-C03.json)" = "1.3.0->1.3.0"
          jq -e '.from_versions | index("1.25.40") != null' core-updates/projects/S01-C03.json >/dev/null

      - name: Manifest Contract Audit
        shell: bash
        run: |
          set -Eeuo pipefail
          cd core-updates
          python3 scripts/check_manifest_contract.py

      - name: PHP syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          cd core-updates
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Update Core V1 regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd core-updates
          php update-core/php/tests/run.php
