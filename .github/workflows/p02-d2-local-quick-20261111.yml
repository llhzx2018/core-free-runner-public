name: P02 D2 exact-source local UI tests and Cargo lock generation (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-d2-local-quick-20261111.yml'
permissions:
  contents: read
jobs:
  generate-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Verify private readonly capability
        env:
          PRIVATE_READ: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          if test -z "$PRIVATE_READ"; then echo BLOCKED_PRIVATE_READ_CAPABILITY; exit 78; fi
          echo PRIVATE_READ_CAPABILITY=PRESENT
      - name: Checkout exact P02 private source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-library
          ref: 72b77b0ea6565913fe3bec5015a9c85bebb9e677
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Verify exact identity and Node integration
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 72b77b0ea6565913fe3bec5015a9c85bebb9e677
          node --test tests/unit/p02_d2_windows_quick_panel.test.mjs
          bash scripts/verify-repository.sh
      - name: Generate true Cargo.lock via Rust package resolution
        working-directory: product/desktop/windows-quick/src-tauri
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo --version
          cargo generate-lockfile
          test -s Cargo.lock
          echo P02_D2_CARGO_LOCK_GENERATION=PASS
      - name: Read back generated lock as public dependency metadata
        working-directory: product/desktop/windows-quick/src-tauri
        shell: bash
        run: |
          set -Eeuo pipefail
          echo P02_CARGO_LOCK_BEGIN_20261111
          cat Cargo.lock
          echo P02_CARGO_LOCK_END_20261111
          sha256sum Cargo.lock
      - name: Cleanup checkout; do not upload private artifacts
        if: always()
        shell: bash
        run: |
          rm -rf product
          echo PRIVATE_SOURCE_PERSISTED_IN_PUBLIC_GIT_OR_ARTIFACT=NO
