name: P02 D2 exact Windows Cargo test (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-d2-local-quick-20261111.yml'
permissions:
  contents: read
jobs:
  windows-rust:
    name: P02 trusted quick panel Rust compilation and URL denials
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Verify private read secret present
        shell: pwsh
        env:
          PRIVATE_READ: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          if ([string]::IsNullOrEmpty($env:PRIVATE_READ)) { throw "BLOCKED_PRIVATE_READ_CAPABILITY" }
          Write-Output "PRIVATE_READ_CAPABILITY=PRESENT"
      - name: Checkout private P02 exact product source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-library
          ref: 09700417139cd6a81edc9d5c5b9861b3f94bb756
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Rust toolchain and exact Git identity
        shell: pwsh
        working-directory: product
        run: |
          if ((git rev-parse HEAD).Trim() -ne '09700417139cd6a81edc9d5c5b9861b3f94bb756') { throw "SOURCE_DRIFT" }
          rustup update stable
          cargo --version
      - name: Compile and run exact Tauri Rust negative origin tests
        shell: pwsh
        working-directory: product/desktop/windows-quick/src-tauri
        run: cargo test --locked --verbose
      - name: Cleanup checkout without binary publication
        if: always()
        shell: pwsh
        run: |
          if (Test-Path product) { Remove-Item -Force -Recurse product }
          Write-Output "PRIVATE_SOURCE_PERSISTED_IN_PUBLIC_ARTIFACT=NO"
