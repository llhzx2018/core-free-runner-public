name: P07 Beginner Menu Gate
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check beginner labels
        run: |
          set -Eeuo pipefail
          bash -n installers/p07-toolbox.sh
          bash -n installers/p07-system-care.sh
          version="$(sed -n "s/^VERSION='\\([^']*\\)'/\\1/p" installers/p07-system-care.sh | head -n1)"
          pkg="packages/p07-system-care/$version"
          test -f "$pkg/vf-system-care.sh"
          bash -n "$pkg/vf-system-care.sh"
          grep -Eq '网络代理节点.*V2Ray代理' installers/p07-toolbox.sh
          grep -Eq '服务器性能检测.*VPS验机' installers/p07-toolbox.sh
          grep -Eq '网站与数据.*网站/数据库/备份' installers/p07-toolbox.sh
          grep -Eq '服务器维护与安全.*更新/清理/安全' installers/p07-toolbox.sh
          grep -Eq '新服务器初始化.*更新/面板/优化' installers/p07-toolbox.sh
          grep -Fq 'ensure_system_care_current' installers/p07-toolbox.sh
          grep -Fq "1 '服务器健康检查'" "$pkg/vf-system-care.sh"
          grep -Fq "ui_menu_warn 2 '系统更新'" "$pkg/vf-system-care.sh"
          grep -Fq "ui_menu_warn 3 '磁盘空间清理'" "$pkg/vf-system-care.sh"
          grep -Fq "ui_menu_good 4 '性能配置'" "$pkg/vf-system-care.sh"
          grep -Fq "ui_menu_warn 5 '服务器登录安全'" "$pkg/vf-system-care.sh"
          grep -Fq "ui_menu_info 6 'WordPress 网站安全'" "$pkg/vf-system-care.sh"
          grep -Fq "ui_menu_good 7 '工具检查 / 修复'" "$pkg/vf-system-care.sh"
          grep -Fq "ui_menu_info 8 '最近操作'" "$pkg/vf-system-care.sh"
          grep -Fq 'updates_flow_beginner()' "$pkg/vf-system-care.sh"
          grep -Fq 'cleanup_flow_beginner()' "$pkg/vf-system-care.sh"
          grep -Fq 'resource_flow_beginner()' "$pkg/vf-system-care.sh"
          grep -Fq "VFOPS_BUILD_EXPECTED='0.1.0-release84'" "$pkg/vf-system-care.sh"
          ! grep -Fq '当前监听端口' "$pkg/security-audit.sh"
          grep -Fq '当前只建议查看，不自动调整' "$pkg/lib/resource_profile.py"
          grep -Fq '当前不适合自动调整' "$pkg/lib/resource_apply.py"
          grep -Fq 'run_action_friendly updates.sh security' "$pkg/vf-system-care.sh"
          grep -Fq 'run_action_friendly updates.sh all' "$pkg/vf-system-care.sh"
          grep -Fq 'run_action_friendly cleanup.sh safe' "$pkg/vf-system-care.sh"
          grep -Fq 'run_action_friendly resource-apply.sh apply' "$pkg/vf-system-care.sh"
          grep -Fq 'run_action intrusion-evidence-entry.sh menu' "$pkg/vf-system-care.sh"
          grep -Fq 'VFOPS_DIR="${P07_VFOPS_DIR:-/opt/vf-server-ops}"' "$pkg/vf-system-care.sh"
          ! grep -Fq 'VFOPS_DIR="\${P07_VFOPS_DIR:-/opt/vf-server-ops}"' "$pkg/vf-system-care.sh"
          grep -Fq 'safe) clean_safe' "$pkg/cleanup.sh"
          grep -Fq 'direct)' "$pkg/intrusion-evidence-entry.sh"
          ! grep -Fq 'maintenance_menu()' "$pkg/vf-system-care.sh"
          ! grep -Fq 'security_menu()' "$pkg/vf-system-care.sh"
          ! grep -Fq "ui_menu_info 3 '内存检查'" "$pkg/vf-system-care.sh"
          ! grep -Fq "ui_menu_info 4 '异常服务检查'" "$pkg/vf-system-care.sh"
          grep -Fq '当前没有可安装更新' "$pkg/vf-system-care.sh"
          grep -Fq 'wordpress_present()' "$pkg/vf-system-care.sh"
          ! grep -Fq "新服务器初始化" "$pkg/vf-system-care.sh"
          grep -Fq '只读检查不改配置；清理、更新和安全应用均需确认。' "$pkg/vf-system-care.sh"
          grep -Fq 'P07_BEGINNER_ZH_V1' "$pkg/vf-system-care.sh"
