name: P07 Beginner Menu Gate
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check beginner labels
        run: |
          set -Eeuo pipefail
          bash -n installers/p07-toolbox.sh
          bash -n installers/p07-system-care.sh
          version="$(sed -n "s/^VERSION='\\([^']*\\)'/\\1/p" installers/p07-system-care.sh | head -n1)"
          pkg="packages/p07-system-care/$version"
          test -f "$pkg/vf-system-care.sh"
          bash -n "$pkg/vf-system-care.sh"
          grep -Eq '网络代理节点.*V2Ray代理' installers/p07-toolbox.sh
          grep -Eq '服务器性能检测.*VPS验机' installers/p07-toolbox.sh
          grep -Eq '网站与数据.*网站/数据库/备份' installers/p07-toolbox.sh
          grep -Eq '服务器维护与安全.*更新/清理/安全' installers/p07-toolbox.sh
          grep -Eq '新服务器初始化.*更新/面板/优化' installers/p07-toolbox.sh
          grep -Fq 'ensure_system_care_current' installers/p07-toolbox.sh
          grep -Fq "1 '服务器健康检查'" "$pkg/vf-system-care.sh"
          grep -Fq "ui_menu_warn 2 '系统更新'" "$pkg/vf-system-care.sh"
          grep -Fq "ui_menu_warn 3 '磁盘空间清理'" "$pkg/vf-system-care.sh"
          grep -Fq "ui_menu_good 4 '性能配置'" "$pkg/vf-system-care.sh"
          grep -Fq "ui_menu_warn 5 '服务器登录安全'" "$pkg/vf-system-care.sh"
          grep -Fq "ui_menu_info 6 'WordPress 网站安全'" "$pkg/vf-system-care.sh"
          grep -Fq "ui_menu_good 7 '工具检查 / 修复'" "$pkg/vf-system-care.sh"
          grep -Fq "ui_menu_info 8 '最近操作'" "$pkg/vf-system-care.sh"
          grep -Fq 'updates_flow_beginner()' "$pkg/vf-system-care.sh"
          grep -Fq 'cleanup_flow_beginner()' "$pkg/vf-system-care.sh"
          grep -Fq 'resource_flow_beginner()' "$pkg/vf-system-care.sh"
          grep -Fq "VFOPS_BUILD_EXPECTED='0.1.0-release98'" "$pkg/vf-system-care.sh"
          ! grep -Fq '当前监听端口' "$pkg/security-audit.sh"
          grep -Fq '当前只建议查看，不自动调整' "$pkg/lib/resource_profile.py"
          grep -Fq '当前不适合自动调整' "$pkg/lib/resource_apply.py"
          grep -Fq 'run_action_friendly updates.sh security' "$pkg/vf-system-care.sh"
          grep -Fq 'run_action_friendly updates.sh all' "$pkg/vf-system-care.sh"
          grep -Fq 'run_action_friendly cleanup.sh safe' "$pkg/vf-system-care.sh"
          grep -Fq 'run_action_friendly resource-apply.sh apply' "$pkg/vf-system-care.sh"
          grep -Fq 'run_action intrusion-evidence-entry.sh menu' "$pkg/vf-system-care.sh"
          grep -Fq 'VFOPS_DIR="${P07_VFOPS_DIR:-/opt/vf-server-ops}"' "$pkg/vf-system-care.sh"
          ! grep -Fq 'VFOPS_DIR="\${P07_VFOPS_DIR:-/opt/vf-server-ops}"' "$pkg/vf-system-care.sh"
          grep -Fq 'safe) clean_safe' "$pkg/cleanup.sh"
          grep -Fq 'direct)' "$pkg/intrusion-evidence-entry.sh"
          ! grep -Fq 'maintenance_menu()' "$pkg/vf-system-care.sh"
          ! grep -Fq 'security_menu()' "$pkg/vf-system-care.sh"
          ! grep -Fq "ui_menu_info 3 '内存检查'" "$pkg/vf-system-care.sh"
          ! grep -Fq "ui_menu_info 4 '异常服务检查'" "$pkg/vf-system-care.sh"
          grep -Fq '当前没有可安装更新' "$pkg/vf-system-care.sh"
          grep -Fq 'wordpress_present()' "$pkg/vf-system-care.sh"
          ! grep -Fq "新服务器初始化" "$pkg/vf-system-care.sh"
          grep -Fq '只读检查不改配置；清理、更新和安全应用均需确认。' "$pkg/vf-system-care.sh"
          grep -Fq 'P07_BEGINNER_ZH_V1' "$pkg/vf-system-care.sh"
  verify-stage:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.head_ref == 'test/p07-r99-release-gate' && github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PRODUCT_SHA: 253393dc4f225d7cb4f7b7f9288c52d100141af5
      PUBLIC_SHA: f5948929bd6a31475e325856519e3bcce7e9fc54
      PRODUCT: ${{ github.workspace }}/p07-private
      PUBLIC: ${{ github.workspace }}/p07-public
      STAGE: ${{ github.workspace }}/p07-release99-stage
    steps:
      - name: Verify configured private-read capability
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          test -n "$VF_PRIVATE_READ_TOKEN" || { echo P07_PRIVATE_READ_UNAVAILABLE; exit 78; }
      - name: Checkout immutable product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 253393dc4f225d7cb4f7b7f9288c52d100141af5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p07-private
      - name: Checkout immutable public release98 baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: f5948929bd6a31475e325856519e3bcce7e9fc54
          persist-credentials: false
          path: p07-public
      - name: Verify candidate, build exact package and test isolated install/upgrade/rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C "$PRODUCT" rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git -C "$PUBLIC" rev-parse HEAD)" = "$PUBLIC_SHA"
          test "$(cat "$PRODUCT/BUILD_ID")" = 0.1.0-release99
          cd "$PRODUCT"
          export PYTHONPATH="$PWD/lib:$PWD"
          python3 -m compileall -q lib/verify.py lib/server_migration_pull.py scripts/p07_candidate_bundle.py
          for module in test_cross_engine_sql_format.py test_server_migration_pull.py test_server_migration.py test_p07_bundle_identity.py test_mariadb_owner_policy.py test_verify.py test_release13_mysql_snapshot.py test_restore_as_real_db_compat.py test_secret_scan.py; do
            python3 -m unittest discover -s tests -p "$module" -v
          done
          echo P07_R99_EXACT_SOURCE_TESTS_PASS
          test ! -e "$STAGE"
          published="$PUBLIC/installers/p07-final.sh"
          grep -Fq 'OLD_MOVED=0' "$published"
          grep -Fq 'NEW_INSTALLED=0' "$published"
          test "$(git -C "$PUBLIC" hash-object "$published")" = "$(git -C "$PUBLIC" rev-parse HEAD:installers/p07-final.sh)"
          cp "$published" "$PUBLIC/experiments/p07-installer-rollback-candidate.sh"
          python3 "$PRODUCT/scripts/p07_candidate_bundle.py" --product-root "$PRODUCT" --public-root "$PUBLIC" --output "$STAGE" --product-sha "$PRODUCT_SHA" --build 0.1.0-release99 --care 0.1.0-rc68
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          stage=Path(os.environ['STAGE'])
          product=Path(os.environ['PRODUCT'])
          a=json.loads((stage/'candidate_attestation.json').read_text())
          assert (a['product_source_sha'],a['product_build'],a['system_care_build'],a['status'])==(os.environ['PRODUCT_SHA'],'0.1.0-release99','0.1.0-rc68','FORMAL_STAGING_NOT_PUBLISHED')
          def blob(p):
              b=p.read_bytes()
              return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          for root,manifests in ((stage/'dist/p07/0.1.0/overlay',('RUNTIME.gitblob','MANIFEST.gitblob')),(stage/'packages/p07-system-care/0.1.0-rc68',('MANIFEST.gitblob',))):
              for manifest in manifests:
                  seen=set()
                  for line in (root/manifest).read_text().splitlines():
                      sha,rel=line.split('  ',1)
                      assert rel not in seen and '..' not in Path(rel).parts
                      seen.add(rel)
                      assert blob(root/rel)==sha,(manifest,rel)
          assert blob(stage/'dist/p07/0.1.0/overlay/lib/verify.py')==blob(product/'lib/verify.py')
          assert blob(stage/'installers/p07-final.sh')==a['final_installer_blob']
          assert blob(stage/'dist/p07/0.1.0/overlay/RUNTIME.gitblob')==a['runtime_manifest_blob']
          assert blob(stage/'dist/p07/0.1.0/overlay/MANIFEST.gitblob')==a['overlay_manifest_blob']
          print('P07_R99_MANIFEST_EXACT_SOURCE_PASS')
          PY
          bash -n "$STAGE/installers/p07.sh" "$STAGE/installers/p07-final.sh" "$STAGE/installers/p07-system-care.sh" "$STAGE/installers/p07-toolbox.sh"
          proof="$RUNNER_TEMP/p07-r99-isolated"
          mkdir -p "$proof"
          old="file://$PUBLIC"
          new="file://$STAGE"
          # Clean install: one disposable root, no real VPS or services.
          sudo env P07_ALLOW_NONROOT=1 P07_NO_EXEC=1 P07_TOOLBOX_PARENT=1 P07_INSTALL_DIR="$proof/clean" P07_PREVIOUS_DIR="$proof/clean.previous" P07_BIN_LINK="$proof/clean-vfops" P07_PUBLIC_ROOT="$new" bash "$STAGE/installers/p07-final.sh" >"$proof/clean.log" 2>&1 || { tail -n 40 "$proof/clean.log"; exit 1; }
          test "$("$proof/clean-vfops" --build-id)" = 0.1.0-release99
          sudo env P07_ALLOW_NONROOT=1 P07_NO_EXEC=1 P07_TOOLBOX_PARENT=1 P07_INSTALL_DIR="$proof/live" P07_PREVIOUS_DIR="$proof/previous" P07_BIN_LINK="$proof/vfops" P07_PUBLIC_ROOT="$old" bash "$PUBLIC/installers/p07-final.sh" >"$proof/old.log" 2>&1 || { tail -n 40 "$proof/old.log"; exit 1; }
          test "$("$proof/vfops" --build-id)" = 0.1.0-release98
          printf 'PRESERVED\n' > "$proof/owner-sentinel"
          sudo env P07_ALLOW_NONROOT=1 P07_NO_EXEC=1 P07_TOOLBOX_PARENT=1 P07_INSTALL_DIR="$proof/live" P07_PREVIOUS_DIR="$proof/previous" P07_BIN_LINK="$proof/vfops" P07_PUBLIC_ROOT="$new" bash "$STAGE/installers/p07-final.sh" >"$proof/upgrade.log" 2>&1 || { tail -n 40 "$proof/upgrade.log"; exit 1; }
          test "$("$proof/vfops" --build-id)" = 0.1.0-release99
          test "$(cat "$proof/previous/BUILD_ID")" = 0.1.0-release98
          test "$(cat "$proof/owner-sentinel")" = PRESERVED
          sudo env P07_ALLOW_NONROOT=1 P07_NO_EXEC=1 P07_TOOLBOX_PARENT=1 P07_INSTALL_DIR="$proof/live" P07_PREVIOUS_DIR="$proof/previous" P07_BIN_LINK="$proof/vfops" P07_PUBLIC_ROOT="$new" bash "$STAGE/installers/p07-final.sh" >"$proof/repeat.log" 2>&1
          grep -Fq '已是当前版本，无需下载或重复安装' "$proof/repeat.log"
          # A tampered payload cannot be installed.
          cp "$STAGE/dist/p07/0.1.0/overlay/lib/verify.py" "$proof/verify.saved"
          printf '\n# CHANGED\n' >> "$STAGE/dist/p07/0.1.0/overlay/lib/verify.py"
          if P07_ALLOW_NONROOT=1 P07_NO_EXEC=1 P07_TOOLBOX_PARENT=1 P07_INSTALL_DIR="$proof/tampered" P07_PREVIOUS_DIR="$proof/tampered.previous" P07_BIN_LINK="$proof/tampered-vfops" P07_PUBLIC_ROOT="$new" bash "$STAGE/installers/p07-final.sh" >"$proof/tampered.log" 2>&1; then echo TAMPER_ALLOWED; exit 1; fi
          test ! -e "$proof/tampered"
          cp "$proof/verify.saved" "$STAGE/dist/p07/0.1.0/overlay/lib/verify.py"
          # Inject a post-swap link failure: both upgrade and clean-install rollback.
          for mode in upgrade clean; do
            case_root="$proof/fail-$mode"
            mkdir -p "$case_root"
            if [[ "$mode" == upgrade ]]; then mkdir -p "$case_root/runtime"; printf 'OLD\n' > "$case_root/runtime/sentinel"; fi
            : > "$case_root/not-directory"
            if P07_ALLOW_NONROOT=1 P07_NO_EXEC=1 P07_TOOLBOX_PARENT=1 P07_INSTALL_DIR="$case_root/runtime" P07_PREVIOUS_DIR="$case_root/previous" P07_BIN_LINK="$case_root/not-directory/vfops" P07_PUBLIC_ROOT="$new" bash "$STAGE/installers/p07-final.sh" >"$case_root/abort.log" 2>&1; then echo ROLLBACK_FAILURE; exit 1; fi
            test ! -e "$case_root/previous"
            test ! -e "$case_root/runtime.new"
            if [[ "$mode" == upgrade ]]; then test "$(cat "$case_root/runtime/sentinel")" = OLD; else test ! -e "$case_root/runtime"; fi
          done
          sudo mv "$proof/live" "$proof/failed-r99"
          sudo mv "$proof/previous" "$proof/live"
          test "$("$proof/vfops" --build-id)" = 0.1.0-release98
          test "$(cat "$proof/owner-sentinel")" = PRESERVED
          echo P07_R99_CLEAN_INSTALL_UPGRADE_IDEMPOTENCE_CORRUPTION_ATOMIC_ROLLBACK_PASS
      - name: Stage exact tested bytes on separate branch, without merging
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN" || { echo P07_RELEASE_WRITE_UNAVAILABLE; exit 78; }
          git -C "$PUBLIC" restore -- experiments/p07-installer-rollback-candidate.sh
          test -z "$(git -C "$PUBLIC" status --porcelain)"
          git -C "$PUBLIC" switch -c release/p07-r99-staging
          cp -a "$STAGE/dist/p07/0.1.0/overlay/." "$PUBLIC/dist/p07/0.1.0/overlay/"
          mkdir -p "$PUBLIC/packages/p07-system-care/0.1.0-rc68"
          cp -a "$STAGE/packages/p07-system-care/0.1.0-rc68/." "$PUBLIC/packages/p07-system-care/0.1.0-rc68/"
          for n in p07.sh p07-final.sh p07-toolbox.sh p07-system-care.sh; do cp "$STAGE/installers/$n" "$PUBLIC/installers/$n"; done
          cp "$STAGE/candidate_attestation.json" "$PUBLIC/experiments/p07-release99-attestation.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['PUBLIC'])
          a=json.loads((root/'experiments/p07-release99-attestation.json').read_text())
          mapping={'release98':'release99','0.1.0-rc67':'0.1.0-rc68','4342c6dcf7e8b39d1e0401b90d21aa2a712bad35':a['product_source_sha'],'35da613085a1c19ec1efc5b14d26b0321d17a5e0':a['runtime_manifest_blob'],'433f686d3d7dcd637e18df29a97ff74ab1156cd9':a['final_installer_blob'],'42cfbd8de6e241e92f0e19890590fde4d7952bc4':a['system_care_manifest_blob']}
          for name in ('p07-distribution-gate.yml','p07-beginner-menu-gate.yml','p07-system-care-smoke.yml'):
              path=root/'.github/workflows'/name
              previous=path.read_text()
              new=previous
              for a,b in mapping.items(): new=new.replace(a,b)
              assert new!=previous,name
              path.write_text(new)
          PY
          git -C "$PUBLIC" add dist/p07/0.1.0/overlay packages/p07-system-care/0.1.0-rc68 installers/p07.sh installers/p07-final.sh installers/p07-toolbox.sh installers/p07-system-care.sh experiments/p07-release99-attestation.json .github/workflows/p07-distribution-gate.yml .github/workflows/p07-beginner-menu-gate.yml .github/workflows/p07-system-care-smoke.yml
          git -C "$PUBLIC" diff --cached --check
          git -C "$PUBLIC" config user.name 'github-actions[bot]'
          git -C "$PUBLIC" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$PUBLIC" commit -m 'stage(P07): exact-source release99 SQL migration fix'
          gh auth setup-git
          git -C "$PUBLIC" push origin HEAD:refs/heads/release/p07-r99-staging
          echo P07_R99_STAGED_BRANCH_PUSHED
      - name: Clear private checkout
        if: always()
        run: rm -rf p07-private
