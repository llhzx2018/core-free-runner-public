name: P07 Beginner Menu Gate
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check beginner labels
        run: |
          set -Eeuo pipefail
          bash -n installers/p07-toolbox.sh
          bash -n installers/p07-system-care.sh
          version="$(sed -n "s/^VERSION='\\([^']*\\)'/\\1/p" installers/p07-system-care.sh | head -n1)"
          pkg="packages/p07-system-care/$version"
          test -f "$pkg/vf-system-care.sh"
          bash -n "$pkg/vf-system-care.sh"
          grep -Eq '网络代理节点.*V2Ray' installers/p07-toolbox.sh
          grep -Eq '服务器性能检测.*VPS' installers/p07-toolbox.sh
          grep -Eq '网站与数据.*CloudPanel' installers/p07-toolbox.sh
          grep -Eq '日常维护与安全.*Linux' installers/p07-toolbox.sh
          grep -Eq '新服务器初始化.*CloudPanel' installers/p07-toolbox.sh
          grep -Fq "1 '服务器健康检查'" "$pkg/vf-system-care.sh"
          grep -Fq "2 '日常维护'" "$pkg/vf-system-care.sh"
          grep -Fq "3 '安全检查'" "$pkg/vf-system-care.sh"
          grep -Fq "4 '工具检查 / 修复'" "$pkg/vf-system-care.sh"
          grep -Fq "5 '最近操作'" "$pkg/vf-system-care.sh"
          ! grep -Fq "新服务器初始化" "$pkg/vf-system-care.sh"
          grep -Fq '初始化服务器已独立放在一级菜单 5' "$pkg/vf-system-care.sh"
          grep -Fq 'P07_BEGINNER_ZH_V1' "$pkg/vf-system-care.sh"
