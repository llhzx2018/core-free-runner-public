name: P07 Beginner Menu Gate
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check beginner labels
        run: |
          set -Eeuo pipefail
          bash -n installers/p07-toolbox.sh
          bash -n installers/p07-system-care.sh
          bash -n packages/p07-system-care/0.1.0-rc17/vf-system-care.sh
          grep -Fq '网络代理节点（V2Ray）' installers/p07-toolbox.sh
          grep -Fq '服务器性能检测（VPS 验机）' installers/p07-toolbox.sh
          grep -Fq '登录与安全检查' packages/p07-system-care/0.1.0-rc17/vf-system-care.sh
          grep -Fq '磁盘空间清理' packages/p07-system-care/0.1.0-rc17/vf-system-care.sh
          grep -Fq 'P07_BEGINNER_ZH_V1' packages/p07-system-care/0.1.0-rc17/vf-system-care.sh
