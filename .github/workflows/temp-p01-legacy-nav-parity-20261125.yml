name: TEMP P01 legacy R9 Navigation layout scoped Chromium
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p01-legacy-nav-parity-20261125.yml'
permissions:
  contents: read
concurrency:
  group: temp-p01-legacy-nav-parity-20261125-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  compiled-populated-ui:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'test/p01-legacy-nav-parity-')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact private P01 candidate only into ephemeral runner workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-startnew
          ref: 56145ab8030df81b2c7e8ae840bfe6a531d2b834
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
          fetch-depth: 1
      - name: Check exact product source binding
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C private-src rev-parse HEAD)" = "56145ab8030df81b2c7e8ae840bfe6a531d2b834"
          echo 'P01_POPULATED_EXACT_SOURCE=PASS'
      - name: Compile original Vue and test read-only local empty/populated Chromium
        working-directory: private-src
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          if ! npm ci --no-audit --no-fund >"$RUNNER_TEMP/p01-npm.log" 2>&1; then echo 'P01_POPULATED_NPM=FAIL'; exit 1; fi
          if ! npm run typecheck >"$RUNNER_TEMP/p01-typecheck.log" 2>&1; then echo 'P01_POPULATED_TYPECHECK=FAIL'; exit 1; fi
          if ! npm run build >"$RUNNER_TEMP/p01-build.log" 2>&1; then echo 'P01_POPULATED_BUILD=FAIL'; exit 1; fi
          if ! npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.55.0 >"$RUNNER_TEMP/p01-playwright.log" 2>&1; then echo 'P01_POPULATED_DEP=FAIL'; exit 1; fi
          if ! npx playwright install --with-deps chromium >"$RUNNER_TEMP/p01-chrome.log" 2>&1; then echo 'P01_POPULATED_CHROME=FAIL'; exit 1; fi
          echo 'P01_POPULATED_COMPILE=PASS'
          if node tests/browser/p01_synthetic_inertia_browser.mjs >"$RUNNER_TEMP/p01-browser.log" 2>&1; then
            grep '^P01_BROWSER_' "$RUNNER_TEMP/p01-browser.log" || true
            grep -q '^P01_BROWSER_SYNTHETIC_COMPILED_SOURCE=PASS$' "$RUNNER_TEMP/p01-browser.log"
            grep -q '^P01_BROWSER_POPULATED_INTERACTIONS=PASS ' "$RUNNER_TEMP/p01-browser.log"
            grep -q '^P01_BROWSER_ROUTE_WIDTHS=60 ' "$RUNNER_TEMP/p01-browser.log"
            grep -q '^P01_BROWSER_LEGACY_NAV_LAYOUT=PASS ' "$RUNNER_TEMP/p01-browser.log"
            echo 'P01_LEGACY_NAV_TEST=PASS'
          else
            grep '^P01_BROWSER_' "$RUNNER_TEMP/p01-browser.log" || true
            echo 'P01_LEGACY_NAV_TEST=FAIL'
            exit 1
          fi
      - name: Remove private test checkout and logs
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- private-src
          rm -f -- "$RUNNER_TEMP/p01-npm.log" "$RUNNER_TEMP/p01-typecheck.log" "$RUNNER_TEMP/p01-build.log" "$RUNNER_TEMP/p01-playwright.log" "$RUNNER_TEMP/p01-chrome.log" "$RUNNER_TEMP/p01-browser.log"
          test ! -e private-src
          echo 'P01_POPULATED_PRIVATE_CLEANUP=PASS'
