# Temporary public-safe machine test; private P07 source is never uploaded.
name: P07 M03 M05 real owner terminal UI and safe DB-first proof
on:
  push:
    branches: [test/p07-owner-m03-m05-ux-regression-20261114]
    paths: ['.github/workflows/p07-owner-m03-m05-private-ux-isolated.yml']
permissions:
  contents: read
jobs:
  exact-source-ux:
    name: P07 UX ${{ matrix.module }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: P07-M03
            source_sha: 71c5c37d0ffe7aee3e279720e34e7689f252e9a6
            sources: 'bin/vfops-user bin/vfops-site-ui'
            evidence: 'docs/ux-reviews/p07-m03-readable-overview-20261114.json'
            tests: 'test_p07_m03_parent_terminal_ux_v3.py test_p07_m03_site_overview_paging.py'
          - module: P07-M03-D04
            source_sha: e6d519396f9600899ce94673c083dc759fdb306f
            sources: 'bin/vfops-migrate-ui'
            evidence: 'docs/ux-reviews/p07-m03-d04-readable-migration-20261114.json'
            tests: 'test_p07_m03_terminal_ux_v3.py'
          - module: P07-M05
            source_sha: 4027b19a082d671235e00c81b96a02fa9261e399
            sources: 'bin/vfops-init-ui'
            evidence: 'docs/ux-reviews/p07-m05-database-first-20261114.json'
            tests: 'test_p07_m05_host_write_gate.py test_p07_m05_first_install_order.py test_p07_m05_reinstall_plan.py test_p07_m05_db_engine_boundary.py'
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      NO_COLOR: '1'
    steps:
      - name: Exact private source transient checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: ${{ matrix.source_sha }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Verify exact source and no Owner VPS access
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = '${{ matrix.source_sha }}'
          test "$(cat product/VERSION)" = 0.1.0
          test ! -e /home/clp
          test ! -e /opt/vf-server-ops
          echo P07_OWNER_UX_EXACT_SOURCE=PASS
      - name: Source-specific terminal scenario/negative tests
        shell: bash
        working-directory: product
        env:
          MODULE: ${{ matrix.module }}
          SOURCES: ${{ matrix.sources }}
          EVIDENCE: ${{ matrix.evidence }}
          TESTS: ${{ matrix.tests }}
        run: |
          set -Eeuo pipefail
          read -r -a source_paths <<< "$SOURCES"
          read -r -a test_names <<< "$TESTS"
          bash -n "${source_paths[@]}"
          cmd=(python3 -B scripts/check_p07_terminal_ux.py --module "$MODULE")
          for name in "${source_paths[@]}"; do cmd+=(--changed-file "$name"); done
          cmd+=(--evidence-file "$EVIDENCE")
          "${cmd[@]}"
          python3 -B scripts/check_p07_modules.py
          for name in "${test_names[@]}"; do
            python3 -B -m unittest discover -s tests -p "$name" -q
          done
          echo P07_OWNER_REAL_UI_AND_NEGATIVE_CASES=PASS
          echo P07_PRODUCTION_DB_MIGRATION_DNS=NOT_RUN
      - name: Clean up private checkout; no public artifact
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- product
          echo PRIVATE_SOURCE_PUBLIC_ARTIFACT=NONE

  merged-five-module-regression:
    name: P07 merged main · M03 overview / M03-D04 / M05 DB-first and 5-module safety
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      NO_COLOR: '1'
    steps:
      - name: Checkout immutable merged private P07 main, temporary only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 5e587a24bc566bf1cf509225a6cae7b76d26f7ea
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Verify merged exact source and run real functional UI cases without user VPS
        shell: bash
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 5e587a24bc566bf1cf509225a6cae7b76d26f7ea
          test "$(cat VERSION)" = 0.1.0
          test ! -e /home/clp
          test ! -e /opt/vf-server-ops
          bash -n bin/vfops-user bin/vfops-site-ui bin/vfops-migrate-ui bin/vfops-init-ui bin/vfops-init-entry bin/vfops-init-core
          python3 -B scripts/check_p07_modules.py
          python3 -B scripts/check_p07_terminal_ux.py
          for item in \
            test_p07_m03_parent_terminal_ux_v3.py \
            test_p07_m03_terminal_ux_v3.py \
            test_p07_m03_site_overview_paging.py \
            test_p07_m05_host_write_gate.py \
            test_p07_m05_first_install_order.py \
            test_p07_m05_db_engine_boundary.py \
            test_p07_m05_reinstall_plan.py \
            test_p07_m05_dirty_host_guard.py \
            test_p07_m05_isolated_module.py \
            test_p07_module_contract.py \
            test_p07_terminal_ux_contract.py; do
            python3 -B -m unittest discover -s tests -p "$item" -q
          done
          echo P07_MERGED_EXACT_SOURCE_MAIN=PASS
          echo P07_M03_D01_D04_M05_SHELL_REAL_UI=PASS
          echo P07_M05_CLEAN_INSTALL_DB_FIRST_NO_SYSTEM_WRITE_ON_CANCEL=PASS
          echo P07_FIVE_MODULE_INDEPENDENCE_GUARD=PASS
          echo P07_OWNER_PRODUCTION_INSTALL_MIGRATION_DNS=NOT_RUN
      - name: Delete merged private P07 source, retain NO artifact
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- product
          echo PRIVATE_SOURCE_PERSISTED_TO_PUBLIC=NO

  m05-official-old-to-new:
    name: P07-M05 新服务器初始化 · real previous official ZIP to new DB-first UX2
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      NO_COLOR: '1'
    steps:
      - name: Checkout exact new M05 private source only in temporary worker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 8ee3567054a09d50ce33d6c47cebb183be7adc33
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Fetch real previous public P07-M05 official ZIP with independent SHA256
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = 8ee3567054a09d50ce33d6c47cebb183be7adc33
          mkdir -p "$RUNNER_TEMP/m05"
          source='https://github.com/llhzx2018/core-free-runner-public/releases/download/p07-v0.1.0-five-modules-ux3-20261113/P07-M05-0.1.0-m05-compact-ux1.zip'
          curl --proto '=https' --tlsv1.2 -fsSL --max-time 90 "$source" -o "$RUNNER_TEMP/m05/old.zip"
          echo "36e46e487ce90d01391639806e0dd659ba8881a5235bc5b89459f4da572a11e7  $RUNNER_TEMP/m05/old.zip" | sha256sum -c -
          echo P07_M05_REAL_PREVIOUS_OFFICIAL_SHA256=PASS
      - name: Deterministic new M05 full ZIP from new exact source
        shell: bash
        working-directory: product
        run: |
          set -Eeuo pipefail
          python3 -B scripts/build_p07_m05_bundle.py --output "$RUNNER_TEMP/m05/new-a.zip"
          python3 -B scripts/build_p07_m05_bundle.py --output "$RUNNER_TEMP/m05/new-b.zip"
          cmp "$RUNNER_TEMP/m05/new-a.zip" "$RUNNER_TEMP/m05/new-b.zip"
          python3 -B -m unittest discover -s tests -p 'test_p07_m05_isolated_module.py' -q
          python3 -B -m unittest discover -s tests -p 'test_p07_m05_first_install_order.py' -q
          echo P07_M05_DB_FIRST_UX2_DETERMINISTIC_PACKAGE_AND_SHELL=PASS
      - name: Actual old official ZIP install, new independent upgrade, rollback and four sibling hashes
        shell: bash
        working-directory: product
        run: |
          set -Eeuo pipefail
          python3 - "$RUNNER_TEMP/m05/old.zip" "$RUNNER_TEMP/m05/new-a.zip" <<'PY'
          import hashlib,os,sys,tempfile
          from pathlib import Path
          import subprocess
          sys.path.insert(0,"scripts")
          import install_p07_m05_bundle as installer
          old,new=map(Path,sys.argv[1:])
          sha=lambda file:hashlib.sha256(file.read_bytes()).hexdigest()
          os.environ["P07_M05_DISPOSABLE_TEST"]="1"
          with tempfile.TemporaryDirectory(prefix="p07-m05-official-to-ux2-") as folder:
              root=Path(folder)/"modules"
              markers={}
              for idx in range(1,5):
                  name=f"m0{idx}"
                  path=root/name
                  path.mkdir(parents=True)
                  marker=path/"KEEP"
                  marker.write_text(f"{name}:OWNER-UNCHANGED")
                  markers[str(marker)]=sha(marker)
              first=installer.install(old,sha(old),root,test_mode=True)
              assert first["installed_build"]=="0.1.0-m05-compact-ux1",first
              second=installer.install(new,sha(new),root,test_mode=True)
              assert second["installed_build"]=="0.1.0-m05-db-first-ux2",second
              current=root/"m05/current"
              assert current.readlink().as_posix()=="releases/0.1.0-m05-db-first-ux2"
              version=subprocess.run(["bash",str(current/"bin/vfops-init-entry"),"--version"],capture_output=True,text=True,timeout=5)
              assert version.returncode==0,version.stderr
              assert "0.1.0-m05-db-first-ux2" in version.stdout
              assert installer.install(new,sha(new),root,test_mode=True)["already_current"] is True
              try:
                  installer.install(new,"0"*64,root,test_mode=True)
              except installer.IsolatedInstallError:
                  pass
              else:
                  raise AssertionError("WRONG_HASH_ACCEPTED")
              assert current.readlink().as_posix()=="releases/0.1.0-m05-db-first-ux2"
              restored=installer.rollback("0.1.0-m05-compact-ux1",root,test_mode=True)
              assert restored["restored_build"]=="0.1.0-m05-compact-ux1"
              assert current.readlink().as_posix()=="releases/0.1.0-m05-compact-ux1"
              assert {p:sha(Path(p)) for p in markers}==markers
          print("P07_M05_OFFICIAL_OLD_ZIP_TO_UX2_ROLLBACK_IDEMPOTENT_BAD_HASH=PASS")
          print("P07_M05_FOUR_OTHER_MODULES_UNCHANGED=PASS")
          print("P07_M05_OWNER_VPS_CLOUDPANEL_DNS=NOT_RUN")
          PY
      - name: Erase private checkout, temporary old/new packages and no public artifact
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- product "$RUNNER_TEMP/m05"
          echo P07_M05_PRIVATE_TEST_ARTIFACT_PUBLICATION=NONE

  m03-real-official135-to-136:
    name: P07-M03 网站与数据 · previous official release135 ZIP to new exact UX release136
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NO_COLOR: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      P07_ALLOW_NONROOT: '1'
      P07_NO_EXEC: '1'
    steps:
      - name: Exact private P07 source only in temporary Runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 36b9818b5132695f75bc1d0f0e6c1b6f51fdbfb8
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Locked published public baseline used by candidate builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 3cacb9e9ccbe60f76e4b4ac90920bc9d06ead877
          persist-credentials: false
          path: public_baseline
      - name: Build exact source M03 current newer installer and read official previous release ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = 36b9818b5132695f75bc1d0f0e6c1b6f51fdbfb8
          test "$(git -C public_baseline rev-parse HEAD)" = 3cacb9e9ccbe60f76e4b4ac90920bc9d06ead877
          test "$(cat product/BUILD_ID)" = 0.1.0-release136
          t="$RUNNER_TEMP/p07-m03-ux136"
          mkdir -p "$t/old" "$t/new" "$t/bin" "$t/data"
          curl --proto '=https' --tlsv1.2 -fsSL --max-time 120 \
            'https://github.com/llhzx2018/core-free-runner-public/releases/download/p07-v0.1.0-five-modules-ux3-20261113/P07-M03-0.1.0-release135.zip' \
            -o "$t/previous-official.zip"
          echo "2e5509bf7f2d36c5bc9f4ec9e2e05016e9e30f94cff546880e93e441af8af866  $t/previous-official.zip" | sha256sum -c - >/dev/null
          python3 - "$t/previous-official.zip" "$t/old" <<'PY'
          from pathlib import Path
          import sys,zipfile
          target=Path(sys.argv[2])
          with zipfile.ZipFile(sys.argv[1]) as z:
              for item in z.infolist():
                  if item.filename.startswith("/") or ".." in Path(item.filename).parts or item.is_dir(): raise ValueError("unsafe old release")
                  path=target/item.filename
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_bytes(z.read(item))
          PY
          python3 -B product/scripts/p07_candidate_bundle.py \
            --product-root "$GITHUB_WORKSPACE/product" \
            --public-root "$GITHUB_WORKSPACE/public_baseline" \
            --output "$t/new" \
            --product-sha 36b9818b5132695f75bc1d0f0e6c1b6f51fdbfb8 \
            --build 0.1.0-release136 --care 0.1.0-rc84
          bash -n "$t/old/installers/p07-final.sh" "$t/new/installers/p07-final.sh"
          echo P07_M03_NEW136_SOURCE_EXACT_CANDIDATE_BUILD=PASS
      - name: Run actual official previous release135→new release136 and failure/rollback paths, M01/M02/M04/M05 untouched
        shell: bash
        run: |
          set -Eeuo pipefail
          t="$RUNNER_TEMP/p07-m03-ux136"
          export P07_INSTALL_DIR="$t/current"
          export P07_PREVIOUS_DIR="$t/previous"
          export P07_BIN_LINK="$t/bin/vfops"
          for m in m01 m02 m04 m05; do
            mkdir -p "$t/$m"
            echo "$m UNCHANGED" > "$t/$m/MARKER"
          done
          echo 'website data untouched' > "$t/data/site"
          echo 'DB data untouched' > "$t/data/database"
          (cd "$t"; sha256sum data/* m01/* m02/* m04/* m05/*) > "$t/before.sha256"
          P07_PUBLIC_ROOT="file://$t/old" bash "$t/old/installers/p07-final.sh" > "$t/old-install.log"
          test "$(bash "$P07_INSTALL_DIR/bin/vfops-user" --build-id)" = 0.1.0-release135
          # Broken blob must stop before switching from verified old.
          mkdir -p "$t/broken"
          cp -a "$t/new/." "$t/broken/"
          echo corrupt > "$t/broken/dist/p07/0.1.0/overlay/RUNTIME.gitblob"
          if P07_PUBLIC_ROOT="file://$t/broken" bash "$t/new/installers/p07-final.sh" >/dev/null 2>&1; then exit 41; fi
          test "$(bash "$P07_INSTALL_DIR/bin/vfops-user" --build-id)" = 0.1.0-release135
          P07_PUBLIC_ROOT="file://$t/new" bash "$t/new/installers/p07-final.sh" > "$t/new-install.log"
          test "$(bash "$P07_INSTALL_DIR/bin/vfops-user" --build-id)" = 0.1.0-release136
          test "$(cat "$P07_PREVIOUS_DIR/BUILD_ID")" = 0.1.0-release135
          (cd "$t"; sha256sum -c before.sha256 >/dev/null)
          # The new installed binary must carry real shorter menu and paging source.
          grep -Fq '查看网站和数据库' "$P07_INSTALL_DIR/bin/vfops-user"
          grep -Fq "输入 n / p 翻页，0 返回" "$P07_INSTALL_DIR/bin/vfops-site-ui"
          grep -Fq '复制旧 VPS 的全部网站' "$P07_INSTALL_DIR/bin/vfops-migrate-ui"
          echo P07_M03_OLD_OFFICIAL_RELEASE135_TO_NEW136_AND_BAD_MANIFEST=PASS
          echo P07_M03_NEW_REAL_INSTALLED_UI=PASS
          echo P07_M03_SIBLING_FOUR_MODULES_AND_WEBSITE_DB_MARKERS_UNCHANGED=PASS
          echo P07_M03_OWNER_PRODUCTION_MIGRATION_DNS=NOT_RUN
      - name: Delete private source, official old ZIP and staged private candidate
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- product public_baseline "$RUNNER_TEMP/p07-m03-ux136"
          echo P07_PRIVATE_PACKAGE_PUBLIC_ARTIFACT=NO
