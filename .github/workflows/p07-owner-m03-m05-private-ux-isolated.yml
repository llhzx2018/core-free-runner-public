# Temporary public-safe machine test; private P07 source is never uploaded.
name: P07 M03 M05 real owner terminal UI and safe DB-first proof
on:
  push:
    branches: [test/p07-owner-m03-m05-ux-regression-20261114]
    paths: ['.github/workflows/p07-owner-m03-m05-private-ux-isolated.yml']
permissions:
  contents: read
jobs:
  exact-source-ux:
    name: P07 UX ${{ matrix.module }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: P07-M03
            source_sha: 71c5c37d0ffe7aee3e279720e34e7689f252e9a6
            sources: 'bin/vfops-user bin/vfops-site-ui'
            evidence: 'docs/ux-reviews/p07-m03-readable-overview-20261114.json'
            tests: 'test_p07_m03_parent_terminal_ux_v3.py test_p07_m03_site_overview_paging.py'
          - module: P07-M03-D04
            source_sha: cf23dc33db14b3709d1817738f52c0a550bc948d
            sources: 'bin/vfops-migrate-ui'
            evidence: 'docs/ux-reviews/p07-m03-d04-readable-migration-20261114.json'
            tests: 'test_p07_m03_terminal_ux_v3.py'
          - module: P07-M05
            source_sha: 4027b19a082d671235e00c81b96a02fa9261e399
            sources: 'bin/vfops-init-ui'
            evidence: 'docs/ux-reviews/p07-m05-database-first-20261114.json'
            tests: 'test_p07_m05_host_write_gate.py test_p07_m05_first_install_order.py test_p07_m05_reinstall_plan.py test_p07_m05_db_engine_boundary.py'
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      NO_COLOR: '1'
    steps:
      - name: Exact private source transient checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: ${{ matrix.source_sha }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Verify exact source and no Owner VPS access
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = '${{ matrix.source_sha }}'
          test "$(cat product/VERSION)" = 0.1.0
          test ! -e /home/clp
          test ! -e /opt/vf-server-ops
          echo P07_OWNER_UX_EXACT_SOURCE=PASS
      - name: Source-specific terminal scenario/negative tests
        shell: bash
        working-directory: product
        env:
          MODULE: ${{ matrix.module }}
          SOURCES: ${{ matrix.sources }}
          EVIDENCE: ${{ matrix.evidence }}
          TESTS: ${{ matrix.tests }}
        run: |
          set -Eeuo pipefail
          read -r -a source_paths <<< "$SOURCES"
          read -r -a test_names <<< "$TESTS"
          bash -n "${source_paths[@]}"
          cmd=(python3 -B scripts/check_p07_terminal_ux.py --module "$MODULE")
          for name in "${source_paths[@]}"; do cmd+=(--changed-file "$name"); done
          cmd+=(--evidence-file "$EVIDENCE")
          "${cmd[@]}"
          python3 -B scripts/check_p07_modules.py
          for name in "${test_names[@]}"; do
            python3 -B -m unittest discover -s tests -p "$name" -q
          done
          echo P07_OWNER_REAL_UI_AND_NEGATIVE_CASES=PASS
          echo P07_PRODUCTION_DB_MIGRATION_DNS=NOT_RUN
      - name: Clean up private checkout; no public artifact
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- product
          echo PRIVATE_SOURCE_PUBLIC_ARTIFACT=NONE
