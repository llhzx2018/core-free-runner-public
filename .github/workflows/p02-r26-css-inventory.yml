name: P02 R26 CSS Inventory
on:
  push:
    branches: [run/p02-r26-css-inventory]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 7dff06b2fe73afb41ff58c9e2f53d988c4a3cec2
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Inventory stylesheet references and sizes
        working-directory: product
        run: |
          set -Eeuo pipefail
          echo '=== PHP_STYLESHEET_REFERENCES ==='
          grep -RIn --include='*.php' --include='*.html' 'stylesheet' public || true
          echo '=== INDEX_STYLE_ORDER ==='
          grep -oE '/assets/[^"?]+\.css' public/index.php | nl -ba
          echo '=== CSS_FILES ==='
          find public/assets -maxdepth 1 -type f -name '*.css' -printf '%f %s bytes\n' | sort
          echo '=== CSS_REFERENCE_COUNTS ==='
          for f in public/assets/*.css; do b=$(basename "$f"); c=$(grep -RIl --exclude="$b" --include='*.php' --include='*.html' --include='*.js' "$b" public | wc -l); printf '%s refs=%s\n' "$b" "$c"; done
          echo P02_R26_CSS_INVENTORY=PASS
