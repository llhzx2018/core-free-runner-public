name: P03 V1.36.0 High-Fi Mobile Overflow Debug
on:
  push:
    branches: [p03-v1360-highfi-review]
permissions:
  contents: read
jobs:
  debug-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN || secrets.CORE_AGENT_RUNNER_TOKEN || secrets.VF_START_RUNNER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Fetch prototype
        run: |
          mkdir -p dbg/evidence
          curl -fsSL -H "Authorization: Bearer ${PRIVATE_READ_TOKEN}" -H "Accept: application/vnd.github.raw+json" "https://api.github.com/repos/llhzx2018/vf-forge/contents/docs/ua-ui/high-fi/index.html?ref=prototype/v1.36.0-flow-approved-highfi" -o dbg/index.html
      - name: Install browser
        working-directory: dbg
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@latest >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Inspect overflow
        working-directory: dbg
        shell: bash
        run: |
          python3 -m http.server 8765 > evidence/server.log 2>&1 &
          sleep 1
          cat > mobile.mjs <<'JS'
          import {chromium} from 'playwright'; import fs from 'node:fs';
          const b=await chromium.launch({headless:true}); const p=await b.newPage({viewport:{width:390,height:844}});
          await p.goto('http://127.0.0.1:8765/#/project/P03/overview',{waitUntil:'networkidle'});
          const report=await p.evaluate(()=>{
            const vw=document.documentElement.clientWidth;
            const all=[...document.querySelectorAll('*')];
            const offenders=all.map(el=>{const r=el.getBoundingClientRect();return {tag:el.tagName,cls:el.className||'',id:el.id||'',text:(el.textContent||'').trim().slice(0,80),left:r.left,right:r.right,width:r.width,scrollWidth:el.scrollWidth,clientWidth:el.clientWidth,overflowX:getComputedStyle(el).overflowX}}).filter(x=>x.right>vw+1||x.left<-1||x.scrollWidth>x.clientWidth+1).sort((a,b)=>Math.max(b.right-vw,b.scrollWidth-b.clientWidth)-Math.max(a.right-vw,a.scrollWidth-a.clientWidth));
            return {innerWidth:innerWidth,clientWidth:vw,scrollWidth:document.documentElement.scrollWidth,bodyScrollWidth:document.body.scrollWidth,offenders:offenders.slice(0,40)};
          });
          fs.writeFileSync('evidence/overflow.json',JSON.stringify(report,null,2));
          await p.screenshot({path:'evidence/mobile-overflow.png',fullPage:true});
          console.log(JSON.stringify(report,null,2)); await b.close();
          JS
          node mobile.mjs 2>&1 | tee evidence/stdout.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P03_HIGHFI_MOBILE_OVERFLOW_DEBUG
          path: dbg/evidence
          retention-days: 1
