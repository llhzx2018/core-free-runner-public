name: P01 Upload Cache Patch

on:
  push:
    branches:
      - vf-agent-operations-v1
    paths:
      - '.github/workflows/p01-upload-cache-patch.yml'
      - '.github/scripts/p01-upload-cache-patch.py'
      - 'requests/p01-upload-cache-patch-*.txt'

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: 928f262e89b29e4933a26148c123863b9b5b18d5
      TARGET_BRANCH: maintenance/common-product-baseline-v2-20260827
    steps:
      - name: Checkout runner scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: runner
      - name: Checkout exact P01 maintenance source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: maintenance/common-product-baseline-v2-20260827
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
          path: p01
      - name: Exact source guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C p01 rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(cat p01/VERSION)" = '2.21.24'
          test "$(cat p01/src/VERSION.txt)" = '2.21.24'
          echo PATCH_BASE=$EXPECTED_HEAD
      - name: Apply upload and cache contract patch
        shell: bash
        run: |
          set -euo pipefail
          python3 runner/.github/scripts/p01-upload-cache-patch.py
          find p01/src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find p01/src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          python3 -m json.tool p01/docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION_CANDIDATE.json >/dev/null
          git -C p01 diff --check
          echo PATCH_SYNTAX_PASS
      - name: Commit and push maintenance branch
        shell: bash
        run: |
          set -euo pipefail
          cd p01
          git diff --exit-code -- VERSION src/VERSION.txt >/dev/null
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add src/app/bootstrap.php src/app/CommonBaseline.php src/app/DisasterRecovery.php src/app/AdminShell.php src/api.php src/index.php src/assets/update.js src/assets/reference-ui.js src/asset.php src/.user.ini src/cli/baseline-verify.php docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION_CANDIDATE.json
          git diff --cached --quiet && { echo NO_CHANGES; exit 1; }
          git commit -m 'p01: resolve upload and cache baseline contracts'
          git push origin HEAD:"$TARGET_BRANCH"
          echo NEW_EXACT_SOURCE=$(git rev-parse HEAD)
