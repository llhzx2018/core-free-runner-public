name: P01 Topics public update-date exact-source test-only
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-topics-date-test-only.yml']
permissions:
  contents: read
jobs:
  topics-public-date:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout existing public Runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact P01 private candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 9ddb7a755482138b7698907a61872e187e2e33c4
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Configure PHP with SQLite
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,curl,mbstring,zip,openssl
          coverage: none
      - name: Exact source date privacy and retained Topics contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "9ddb7a755482138b7698907a61872e187e2e33c4"
          php -l product/src/app/TopicLibraryPage.php
          php -l product/tests/unit/topics_public_date_privacy_v247390_contract.php
          for t in \
            topics_public_date_privacy_v247390_contract.php \
            topics_page_context_closure_contract.php \
            topics_page_full_polish_contract.php \
            topics_v247150_terminal_library_contract.php \
            topics_v247153_editorial_reference_index_contract.php \
            topics_v247154_production_density_contract.php \
            topics_v247155_metadata_rail_contract.php \
            topics_v247156_wide_two_column_index_contract.php \
            topics_v247157_tag_dedup_contract.php \
            topics_v247158_inline_metadata_contract.php \
            topics_v247174_cover_legibility_r1_contract.php \
            topics_v247175_text_balance_r2_contract.php \
            topic_project_filter_context_contract.php \
            topic_quick_context_contract.php \
            topic_single_library_surface_contract.php \
            topic_course_search_chip_count_contract.php; do
            php "product/tests/unit/$t"
          done
          echo P01_TOPICS_PUBLIC_UPDATE_EXACT_SOURCE=PASS
      - name: Clear ephemeral private source
        if: always()
        shell: bash
        run: rm -rf product
