name: S01 exact clean first request and setup closure
on:
  push:
    branches: [task/s01-history162-20261022]
    paths: ['.github/workflows/s01-history162-clean.yml']
permissions:
  contents: read
jobs:
  clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          ref: 02d4591eed025a3d3a67bc0a150b3ddc448c2ab8
          persist-credentials: false
          path: established
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 2be0168bce3d4ba4e9880f06bff532479a3c5ad0
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
      - name: Exact clean setup proof
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test "$(cat target/VERSION)" = 1.35.162
          mkdir -p provider proof
          gh release download v1.25.94 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.94.zip --dir provider
          echo '70b90d40da5d69fc7819bd7ada3f15fb0145e64822b788bd94956c7827b2df03  provider/vf-tools-m3u8_V1.25.94.zip' | sha256sum -c
          cp -a established/lanes/s01-frontend-design-20261017 lane
          cp control/lanes/s01-history162-20261022/clean.cjs lane/warm-admin.cjs
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          python3 - <<'PYCLEAN'
          from pathlib import Path
          s=Path('lane/native.sh').read_text().replace('provider/vf-tools-m3u8_V1.25.91.zip','provider/vf-tools-m3u8_V1.25.94.zip')
          installer='cli plugin install polylang --version=3.8.10 --activate >/dev/null'
          s=s.replace(installer,'for attempt in 1 2 3; do '+installer+' && break; test "$attempt" -lt 3 || exit 1; sleep 3; done')
          s=s.split('if [ "${VF_REVIEW_ONLY_STATE:-0}" = "1" ];then')[0]
          s+='\ntest "$(cli theme get vf-tools-theme --field=version)" = 1.35.162\necho EXACT_CLEAN_INSTALL_162_PASS\n'
          Path('lane/clean.sh').write_text(s)
          PYCLEAN
          bash lane/clean.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-history-clean-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private runtime
        if: always()
        run: rm -rf target provider lane
