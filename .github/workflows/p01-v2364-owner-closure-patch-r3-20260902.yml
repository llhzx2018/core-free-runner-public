name: P01 V2.36.4 Owner Closure Docs Patch R3
on:
  push:
    branches: [tmp/p01-v2364-owner-closure-patch-20260902]
    paths: [.github/workflows/p01-v2364-owner-closure-patch-r3-20260902.yml]
permissions:
  contents: read
jobs:
  build-patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      P01_SOURCE: 0b7aa173d51ee17239716242e3e6b6f375428d2c
      P01_MAIN: 7edb03c97e036a6b1b646e9ee863e327fa8984e8
      FORMAL_SOURCE: 6b321422bce5a834521786d8233149c7624aa014
      FORMAL_TREE: 86c01bf1b5ee7c3ad3954e6ab9485734cb744d05
      RUNTIME_TREE: e1ee914a6d9e61bac7931b1f5363a8c7e24e925a
      RELEASE_ID: '380614937'
      CORE_P01_PROMOTION: 135f66c4eca08819840001f28dcd89869770085c
      CORE_REPO_HEAD: 36d700db5b63e079c2ca725544fe9f7b8e9ff024
      CORE_P01_BLOB: de1c805d55a4dbb52298ecc45625d2b7e9f43578
      OWNER_FINAL_SHA: 78e6af3e3fb189994cfe11a63bdd91889747c081ea223ded3390030bc7407271
      OWNER_PRECLOSURE_SHA: dd74207b93c45afa6e9277a49a875dc6cea01f8c0e31194d8b1e74df7c178cf0
      TERMINAL_FIX_CANDIDATE: 2f6b290c1bc86b3d961ef48d17e844cd269242db
      TERMINAL_FIX_MERGE: 0b7aa173d51ee17239716242e3e6b6f375428d2c
      TERMINAL_FIX_GATE: '33528457499'
      TERMINAL_FIX_ARTIFACT: '9808693721'
      TERMINAL_FIX_DIGEST: sha256:c487cfca3f35714a05871d68dd4e01fafb0b44e5b92c502b7b42f5552b11412e
      TERMINAL_FIX_R1: '33528294725'
      OUT: /tmp/p01-v2364-owner-closure-patch
    steps:
      - name: Checkout exact runner harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          path: gatehelper
      - name: Checkout exact P01 develop truth
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.P01_SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01
      - name: Reuse R2 generator with untracked-file fence fix
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('gatehelper/.github/workflows/p01-v2364-owner-closure-patch-20260902.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i,l in enumerate(src) if l.strip() == '- name: Generate docs-only closure patch')
          run_idx = next(i for i in range(start + 1, len(src)) if src[i].strip() == 'run: |')
          body = []
          for line in src[run_idx + 1:]:
              if line.startswith('          '):
                  body.append(line[10:])
                  continue
              if line.strip() == '':
                  body.append('')
                  continue
              break
          script = '\n'.join(body) + '\n'
          old = 'git diff --name-only | sort | tee "$OUT/changed.txt"'
          new = '{ git diff --name-only; git ls-files --others --exclude-standard; } | sort | tee "$OUT/changed.txt"'
          if old not in script:
              raise SystemExit('expected R2 changed-list line not found')
          script = script.replace(old, new, 1)
          Path('/tmp/p01-v2364-owner-closure-r3.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/p01-v2364-owner-closure-r3.sh
          grep -Fx 'P01_V2364_OWNER_CLOSURE_DOCS_PATCH=PASS' "$OUT/verdict.txt"
          grep -Fx 'DOCS_ONLY=YES' "$OUT/verdict.txt"
          grep -Fx 'OWNER_PRODUCTION_WRITE=NO' "$OUT/verdict.txt"
          grep -Fx 'RUNNER_MAIN_WRITE=NO' "$OUT/verdict.txt"
      - name: Upload exact docs patch R3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2364-owner-closure-docs-r3-${{ github.run_id }}
          path: /tmp/p01-v2364-owner-closure-patch
          if-no-files-found: error
          retention-days: 90
