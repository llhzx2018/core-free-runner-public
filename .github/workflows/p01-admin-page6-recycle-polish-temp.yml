name: p01-admin-page6-recycle-polish-temp

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-admin-page6-recycle-polish-temp.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      BASE_SHA: 3698379e420d23966e3ed48b9a1f03a89813d281
      TARGET_SHA: 0fef24508f13a8afa7f6287e86b3a549f1a9d1a2
    steps:
      - name: Checkout exact P01 sources
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          for name in baseline current; do
            git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "$name"
          done
          git -C baseline fetch -q --depth 1 origin "$BASE_SHA"
          git -C baseline checkout -q --detach FETCH_HEAD
          git -C current fetch -q --depth 1 origin "$TARGET_SHA"
          git -C current checkout -q --detach FETCH_HEAD
          echo P01_ADMIN_PAGE6_EXACT_SOURCE=PASS

      - name: Verify bounded four-file diff
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C current fetch -q --depth 1 origin "$BASE_SHA"
          git -C current diff --name-only "$BASE_SHA" "$TARGET_SHA" | sort > /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          src/assets/admin-consolidation.css
          src/assets/recycle-bin.js
          src/recycle-bin.php
          tests/unit/admin_recycle_bin_page6_polish_contract.php
          EOF
          sed -i 's/^          //' /tmp/expected.txt
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          test "$(tr -d '\r\n ' < current/VERSION)" = "2.47.42"
          echo P01_ADMIN_PAGE6_BOUNDED_DIFF=PASS

      - name: Lint and focused Recycle Bin contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l current/src/recycle-bin.php
          node --check current/src/assets/recycle-bin.js
          tests=(
            tests/unit/admin_recycle_bin_r11_contract.php
            tests/unit/admin_recycle_bin_r12_pagination_contract.php
            tests/unit/recycle_bin_admin_return_contract.php
            tests/unit/recycle_bin_direct_open_contract.php
            tests/unit/recycle_mobile_card_labels_contract.php
            tests/unit/admin_recycle_bin_page6_polish_contract.php
          )
          for t in "${tests[@]}"; do
            php -l "current/$t"
            php "current/$t"
          done
          echo P01_ADMIN_PAGE6_FOCUSED=PASS

      - name: Canonical zero-debt guard
        shell: bash
        run: |
          set -Eeuo pipefail
          bash current/tests/canonical_release_regression.sh current baseline --require-zero-debt | tee /tmp/canonical.txt
          grep -q '^P01_CANONICAL_CURRENT_FAILURE_COUNT=0$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_NEW_REGRESSION_COUNT=0$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_LEGACY_TEST_DEBT_COUNT=0$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS$' /tmp/canonical.txt
          echo P01_ADMIN_PAGE6_CANONICAL=PASS
