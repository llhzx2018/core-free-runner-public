name: S01 M3U8 Browser Stream Master Child Integrity
on:
  push:
    branches: [task/s01-c03-stream-child-integrity-20261013]
    paths: [.github/workflows/s01-c03-stream-child-integrity-exact-20261013.yml]
permissions:
  contents: read
jobs:
  child-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Exact transient M3U8 private checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: 6996a2c8fccbc1daf39085d1c46ef45084d97271
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - name: Node syntax and browser-stream runtime regression
        run: |
          set -Eeuo pipefail
          test "$(git -C private-source rev-parse HEAD)" = 6996a2c8fccbc1daf39085d1c46ef45084d97271
          node --version
          node --check private-source/src/public/js/modules/browser-stream-test.js
          node --check private-source/tests/browser-stream-safety.node.cjs
          (cd private-source && node tests/browser-stream-safety.node.cjs)
          (cd private-source && node tests/three-tool-recovery.node.cjs)
          (cd private-source && node tests/playlist-checker-completion-state.node.cjs)
          echo S01_C03_EXACT_BROWSER_STREAM_CHILD_INTEGRITY_PASS
      - name: Clean temporary private checkout
        if: always()
        run: rm -rf private-source
