name: P02 R54 Exact SHA Readonly Closure
on:
  push:
    branches:
      - run/p02-r54-favicon-ownership
  workflow_dispatch:
permissions:
  contents: read
jobs:
  closure:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout P02 exact R54 SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: e0bac8f6ec30df94e626e07821ae3c39cbcd7f59
          path: product
          persist-credentials: false
          fetch-depth: 0
      - name: Exact SHA static closure
        run: |
          set -Eeuo pipefail
          cd product
          test "$(git rev-parse HEAD)" = 'e0bac8f6ec30df94e626e07821ae3c39cbcd7f59'
          test "$(tr -d '\r\n' < VERSION)" = '2.5.32'
          test -f public/assets/favicon-settings.js
          test ! -e public/assets/v254-common-branding.js
          cp SOURCE_MANIFEST.json "$RUNNER_TEMP/r54-manifest.json"
          cp SOURCE_MANIFEST.txt "$RUNNER_TEMP/r54-manifest.txt"
          python3 scripts/generate-source-manifest.py
          cmp -s SOURCE_MANIFEST.json "$RUNNER_TEMP/r54-manifest.json"
          cmp -s SOURCE_MANIFEST.txt "$RUNNER_TEMP/r54-manifest.txt"
          python3 scripts/verify-source-manifest.py
          bash scripts/verify-repository.sh
          for t in tests/unit/p02_*.mjs tests/unit/v2523_unified_content_workspace_contract.mjs; do node "$t"; done
          git diff --exit-code
          test "$(node -e "console.log(JSON.parse(require('fs').readFileSync('SOURCE_MANIFEST.json','utf8')).runtime_source_file_count)")" = 67
          echo P02_R54_EXACT_STATIC=PASS
      - name: Install browser runtime
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 sqlite3 curl >/dev/null
          cd product
          npm install --no-save --package-lock=false playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Standard and specialized Chromium closure
        run: |
          set -Eeuo pipefail
          ROOT="$GITHUB_WORKSPACE/product"
          RUN_ROOT="$RUNNER_TEMP/p02-r54-closure"
          PORT=18155
          mkdir -p "$RUN_ROOT/site-root"
          cd "$ROOT"
          bash scripts/build-deploy-tree.sh "$RUN_ROOT/site-root/site"
          php -d display_errors=0 -S "127.0.0.1:$PORT" -t "$RUN_ROOT/site-root/site" >"$RUN_ROOT/php.log" 2>&1 &
          PHP_PID=$!
          trap 'kill "$PHP_PID" 2>/dev/null || true' EXIT
          BASE_URL="http://127.0.0.1:$PORT"
          for _ in $(seq 1 80); do curl -fsS "$BASE_URL/setup.php" >/dev/null 2>&1 && break; sleep .25; done
          PASSWORD="VF-R54-CLOSURE-${GITHUB_RUN_ID}!"
          curl -fsS -c "$RUN_ROOT/cookie" "$BASE_URL/setup.php" > "$RUN_ROOT/setup.html"
          CSRF="$(python3 - "$RUN_ROOT/setup.html" <<'PY'
          import html,re,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf" value="([^"]+)"',s);assert m;print(html.unescape(m.group(1)))
          PY
          )"
          STATUS="$(curl -sS -o /dev/null -w '%{http_code}' -b "$RUN_ROOT/cookie" -c "$RUN_ROOT/cookie" -H "Origin: $BASE_URL" --data-urlencode "setup_csrf=$CSRF" --data-urlencode "password=$PASSWORD" --data-urlencode "password_confirm=$PASSWORD" "$BASE_URL/setup.php")"
          test "$STATUS" = 303
          VF_UX_E2E_BASE_URL="$BASE_URL" VF_UX_E2E_PASSWORD="$PASSWORD" VF_UX_E2E_VERSION='2.5.32' node tests/e2e/p02_ux_task_flow.mjs
          echo P02_R54_EXACT_STANDARD_CHROMIUM=PASS
          cat > "$RUN_ROOT/proof.mjs" <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1280,height:820}});
          const base=process.env.BASE_URL,password=process.env.PASSWORD,ok=(v,m)=>{if(!v)throw new Error(m)};
          await page.goto(base+'/',{waitUntil:'networkidle'});
          if(await page.locator('[data-open-login]').count()){
            await page.locator('[data-open-login]').click();
            await page.locator('#loginForm input[name="password"]').fill(password);
            await page.locator('#loginSubmit').click();
            await page.waitForFunction(async()=>Boolean((await(await fetch('/api.php?action=session')).json())?.site?.auth));
          }
          const resources=await page.evaluate(()=>performance.getEntriesByType('resource').map(x=>x.name));
          ok(resources.filter(x=>x.includes('/assets/favicon-settings.js')).length===1,'favicon-settings must load once');
          ok(resources.filter(x=>x.includes('/assets/v254-common-branding.js')).length===0,'retired v254 requested');
          const asset=await page.evaluate(async()=>await(await fetch('/assets/favicon-settings.js')).text());
          ok(asset.includes('favicon-action.php?action=status'),'favicon status seam missing');
          for(const token of ['faviconSettingV254','faviconFileV254','deleteFaviconV254','loadScratchAssets','data-scratch-v259'])ok(!asset.includes(token),'retired token '+token);
          ok(await page.evaluate(async()=>{const r=await fetch('/favicon-action.php?action=status');return r.ok;}),'favicon endpoint failed');
          ok((await page.locator('[data-mode="quick"], [data-mode="article"]').count())===0,'retired modes exposed');
          await page.locator('#settingsBtn').click();
          await page.waitForSelector('#settingsPanel');
          ok((await page.locator('#faviconSetting').count())===1,'favicon setting missing');
          ok((await page.locator('#faviconFile').count())===1,'favicon file missing');
          ok((await page.locator('#deleteFavicon').count())===1,'favicon delete missing');
          ok((await page.locator('#faviconSettingV254,#faviconFileV254,#deleteFaviconV254').count())===0,'old ids exposed');
          await page.setViewportSize({width:390,height:844});
          await page.waitForTimeout(150);
          const m=await page.evaluate(()=>({scroll:document.documentElement.scrollWidth,width:document.documentElement.clientWidth,control:document.querySelector('#faviconSetting')?.getBoundingClientRect().width||0}));
          ok(m.scroll<=m.width+1,'390px overflow '+JSON.stringify(m));
          ok(m.control>0&&m.control<=390,'favicon control invalid '+JSON.stringify(m));
          await browser.close();
          console.log('P02_R54_EXACT_SPECIALIZED_CHROMIUM=PASS');
          JS
          ln -s "$ROOT/node_modules" "$RUN_ROOT/node_modules"
          BASE_URL="$BASE_URL" PASSWORD="$PASSWORD" node "$RUN_ROOT/proof.mjs"
      - name: Canonical boundary closure
        run: |
          set -Eeuo pipefail
          DEV="$(git ls-remote https://github.com/llhzx2018/vf-library.git refs/heads/develop | awk '{print $1}')"
          MAIN="$(git ls-remote https://github.com/llhzx2018/vf-library.git refs/heads/main | awk '{print $1}')"
          test "$DEV" = 'e0bac8f6ec30df94e626e07821ae3c39cbcd7f59'
          test "$MAIN" = '6a43f76308f6ba3e4fd675d121ba9fe7be7f3ddd'
          test -z "$(git ls-remote --tags https://github.com/llhzx2018/vf-library.git refs/tags/v2.5.32)"
          curl -fsSL https://raw.githubusercontent.com/llhzx2018/core-updates/main/projects/P02.json > "$RUNNER_TEMP/p02.json"
          python3 - "$RUNNER_TEMP/p02.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d['target_version']=='2.5.31'
          assert d['release_tag']=='v2.5.31-rc.1'
          PY
          echo P02_R54_BOUNDARY_MAIN_WRITE=NO
          echo P02_R54_BOUNDARY_RELEASE_WRITE=NO
          echo P02_R54_BOUNDARY_TAG_WRITE=NO
          echo P02_R54_BOUNDARY_UPDATE_CHANNEL_WRITE=NO
          echo P02_R54_BOUNDARY_PRODUCTION_WRITE=NO
          echo P02_R54_EXACT_CLOSURE=PASS
