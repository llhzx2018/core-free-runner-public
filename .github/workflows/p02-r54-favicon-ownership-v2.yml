name: P02 R54 Favicon Ownership Gate V2
on:
  push:
    branches:
      - run/p02-r54-favicon-ownership
  workflow_dispatch:
permissions:
  contents: read
jobs:
  converge:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runner
          persist-credentials: false
      - name: Checkout P02 exact R53 base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 4e179cca6fd8a83b527401bc65e8d78d8753a106
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          path: product
          persist-credentials: false
          fetch-depth: 0
      - name: Execute R54 gate
        env:
          VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/p02-r54"
          bash runner/.github/runner/p02-r54-gate.sh
