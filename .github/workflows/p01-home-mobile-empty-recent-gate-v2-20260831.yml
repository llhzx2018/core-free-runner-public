name: P01 Home Action Priority Gate
on:
  push:
    branches: [task/p01-home-mobile-empty-recent-gate-20260831]
    paths: [.github/workflows/p01-home-mobile-empty-recent-gate-v2-20260831.yml]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE: 834d2ea10441576536ef176f9ad9e4df44257530
      TREE: 13401c579b11ea78592826fed943036b06c9fa71
      BASE: 459a7c438886facfb67494ddd3275be050c8faad
      ROOT: /tmp/p01-home-action-priority
      EVID: /tmp/p01-home-action-priority-evid
      PORT: '18423'
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Exact source and one-file fence
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$ROOT" "$EVID" /tmp/p01-home-action.cookies
          mkdir -p "$EVID"
          test "$(git -C product rev-parse HEAD)" = "$SOURCE"
          test "$(git -C product rev-parse HEAD^{tree})" = "$TREE"
          test "$(git -C product merge-base "$BASE" HEAD)" = "$BASE"
          test "$(git -C product diff --name-only "$BASE"...HEAD)" = src/app/FunctionalHome.php
          test "$(cat product/VERSION)" = '2.35.0'
          php -l product/src/app/FunctionalHome.php >/dev/null
          grep -F '$healthPriorityCount = $healthNeedsAction > 0 ? $healthNeedsAction : $healthRestricted;' product/src/app/FunctionalHome.php >/dev/null
          grep -F '<span>网址健康</span>' product/src/app/FunctionalHome.php >/dev/null
          echo P01_HOME_ACTION_PRIORITY_SOURCE_FENCE=PASS | tee "$EVID/source-fence.txt"
      - name: Fresh runtime and representative resources
        shell: bash
        run: |
          set -Eeuo pipefail
          cp -a product/src "$ROOT"
          php -S 127.0.0.1:$PORT -t "$ROOT" >"$EVID/server.log" 2>&1 & echo $! >/tmp/p01-home-action.pid
          for i in $(seq 1 60); do curl -fsS -c /tmp/p01-home-action.cookies -b /tmp/p01-home-action.cookies "http://127.0.0.1:$PORT/setup.php" -o /tmp/p01-home-action-setup.html && break; sleep .25; done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-home-action-setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c /tmp/p01-home-action.cookies -b /tmp/p01-home-action.cookies -X POST "http://127.0.0.1:$PORT/setup.php" --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=Home Action Priority Gate' --data-urlencode 'admin_password=HomeAction2026' --data-urlencode 'admin_password_confirm=HomeAction2026' -o /tmp/p01-home-action-post.html
          php "$ROOT/cli/verify.php" | tee "$EVID/verify-initial.txt" | grep -Fx VERIFY_PASS=YES >/dev/null
          cat >/tmp/p01-home-action-seed.php <<'PHP'
          <?php
          require '/tmp/p01-home-action-priority/app/bootstrap.php';
          $r=new VfRepository(vf_db());$c=$r->createCategory(['name'=>'首页任务验证','description'=>'','is_private'=>false]);$ids=[];
          foreach(['确认异常','疑似异常','临时异常','访问受限','正常资源'] as $i=>$title){$x=$r->saveLink(null,['category_id'=>$c,'title'=>$title,'url'=>'https://example.com/home-action-'.$i,'description'=>'Home action priority','tags'=>'验证','is_private'=>false],'manual');$ids[]=(int)$x['id'];}
          file_put_contents('/tmp/p01-home-action-ids',implode(',',$ids));echo "P01_HOME_ACTION_SEED=PASS\n";
          PHP
          php /tmp/p01-home-action-seed.php | tee "$EVID/seed.txt" | grep -Fx P01_HOME_ACTION_SEED=PASS
      - name: Seed actionable health state
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/p01-home-action-state.php <<'PHP'
          <?php
          require '/tmp/p01-home-action-priority/app/bootstrap.php';
          $ids=array_map('intval',explode(',',trim(file_get_contents('/tmp/p01-home-action-ids'))));$state=$argv[1]??'';$db=vf_db();$now=gmdate('c');
          $db->exec('DELETE FROM link_health');
          $ins=$db->prepare("INSERT INTO link_health(link_id,status,http_status,last_checked_at,updated_at,ignore_auto) VALUES(?,?,?,?,?,0)");
          if($state==='actionable'){$statuses=['confirmed','suspected','temporary','restricted','healthy'];$codes=[410,404,503,403,200];}
          elseif($state==='restricted'){$statuses=['restricted','restricted','restricted','restricted','healthy'];$codes=[403,429,401,403,200];}
          elseif($state==='clear'){$statuses=['healthy','healthy','healthy','healthy','healthy'];$codes=[200,200,200,200,200];}
          else exit(2);
          foreach($ids as $i=>$id)$ins->execute([$id,$statuses[$i],$codes[$i],$now,$now]);
          $s=(new VfLinkHealth($db))->status();echo json_encode($s,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n";
          PHP
          php /tmp/p01-home-action-state.php actionable | tee "$EVID/actionable-status.json"
          jq -e '.needsAction==3 and .restrictedReview==1 and .confirmedReview==1 and .suspectedReview==1 and .temporaryReview==1' "$EVID/actionable-status.json" >/dev/null
      - name: Chromium priority state matrix
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-home-action-pw && cd /tmp/p01-home-action-pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat >matrix.cjs <<'JS'
          const {chromium}=require('playwright'),fs=require('fs'),cp=require('child_process');
          (async()=>{const b=await chromium.launch({headless:true});const c=await b.newContext({viewport:{width:1440,height:1000}});const login=await c.request.post('http://127.0.0.1:18423/api.php?action=login',{data:{password:'HomeAction2026'}});if(!login.ok()||!(await login.json()).ok)throw Error('login');const p=await c.newPage(),metrics={};
          async function read(){return p.evaluate(()=>{const first=document.querySelector('.vf-home-status-grid>a'),rail=[...document.querySelectorAll('.vf-home-rail>.vf-home-section')],firstRail=rail[0];return{overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,firstText:first?.innerText.replace(/\s+/g,' ').trim()||'',firstHref:first?.getAttribute('href')||'',firstAttention:first?.classList.contains('needs-attention')||false,railFirst:firstRail?.className||'',railFirstText:firstRail?.innerText.replace(/\s+/g,' ').trim()||'',healthIndex:rail.findIndex(x=>x.classList.contains('vf-home-health-section')),domainIndex:rail.findIndex(x=>x.classList.contains('vf-home-domain-section'))};});}
          async function state(name){cp.execFileSync('php',['/tmp/p01-home-action-state.php',name]);await p.goto('http://127.0.0.1:18423/home.php',{waitUntil:'networkidle'});await p.waitForTimeout(120);}
          await state('actionable');for(const [w,h,size] of [[1440,1000,'1440'],[390,844,'390']]){await p.setViewportSize({width:w,height:h});for(const theme of ['light','dark']){await p.evaluate(t=>document.documentElement.setAttribute('data-theme',t),theme);await p.waitForTimeout(70);const m=await read();if(m.overflow>1||!m.firstText.startsWith('网址健康 3')||m.firstHref!=='health.php'||!m.firstAttention||m.healthIndex!==0||m.domainIndex!==1)throw Error(`actionable ${size} ${theme} ${JSON.stringify(m)}`);metrics[`actionable-${size}-${theme}`]=m;await p.screenshot({path:`${process.env.EVID}/home-actionable-${size}-${theme}.png`,fullPage:false});}}
          await state('restricted');let m=await read();if(!m.firstText.startsWith('网址健康 4')||!m.firstText.includes('人工确认')||m.firstHref!=='health.php'||m.healthIndex!==0||m.domainIndex!==1)throw Error('restricted '+JSON.stringify(m));metrics.restricted=m;await p.screenshot({path:`${process.env.EVID}/home-restricted-390-light.png`,fullPage:false});
          await state('clear');m=await read();if(!m.firstText.startsWith('归属建议')||m.firstHref!=='surface-manager.php'||m.healthIndex!==-1||m.domainIndex!==0)throw Error('clear '+JSON.stringify(m));metrics.clear=m;await p.screenshot({path:`${process.env.EVID}/home-clear-390-light.png`,fullPage:false});
          fs.writeFileSync(process.env.EVID+'/matrix-metrics.json',JSON.stringify(metrics,null,2));await b.close();console.log('P01_HOME_ACTION_PRIORITY_MATRIX=PASS');})().catch(e=>{console.error(e);process.exit(1)});
          JS
          EVID="$EVID" node matrix.cjs 2>&1 | tee "$EVID/matrix-result.txt"
          grep -Fx P01_HOME_ACTION_PRIORITY_MATRIX=PASS "$EVID/matrix-result.txt"
      - name: Regression and SQLite
        shell: bash
        run: |
          set -Eeuo pipefail
          php "$ROOT/cli/verify.php" | tee "$EVID/verify.txt" | grep -Fx VERIFY_PASS=YES
          php "$ROOT/cli/surface-verify.php" | tee "$EVID/surface-verify.txt" | grep -Fx CURRENT_DOMAIN_PASS=YES
          cat >/tmp/p01-home-action-dbcheck.php <<'PHP'
          <?php
          require '/tmp/p01-home-action-priority/app/bootstrap.php';$db=vf_db();if((string)$db->query('PRAGMA integrity_check')->fetchColumn()!=='ok')exit(2);if($db->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC))exit(3);echo "P01_HOME_ACTION_PRIORITY_SQLITE=PASS\n";
          PHP
          php /tmp/p01-home-action-dbcheck.php | tee "$EVID/sqlite.txt" | grep -Fx P01_HOME_ACTION_PRIORITY_SQLITE=PASS
          printf 'P01_HOME_ACTION_PRIORITY=PASS\nSOURCE=%s\nTREE=%s\n' "$SOURCE" "$TREE" | tee "$EVID/verdict.txt"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-home-action-priority-${{ github.run_id }}
          path: ${{ env.EVID }}
          if-no-files-found: warn
          retention-days: 30
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/p01-home-action.pid 2>/dev/null)" 2>/dev/null || true
