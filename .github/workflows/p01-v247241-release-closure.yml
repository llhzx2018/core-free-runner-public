name: P01 V2.47.241 Course Reader Release Closure Proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v247241-release-closure.yml'
      - 'proof-triggers/p01-v247241-release-closure.json'

permissions:
  contents: read

jobs:
  course-reader-release-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout proof control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd unzip nodejs >/dev/null
          php -m | grep -Fx pdo_sqlite
          php -m | grep -Fx zip
          php -m | grep -Fx gd
          echo P01_V247241_RUNTIME=PASS

      - name: Clone exact candidate and stable baseline
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" candidate
          git -C candidate fetch -q origin 04a32dd0fac96dfddf6359d0d791b0db28f7317a
          git -C candidate checkout -q --detach 04a32dd0fac96dfddf6359d0d791b0db28f7317a
          test "$(git -C candidate rev-parse HEAD)" = "04a32dd0fac96dfddf6359d0d791b0db28f7317a"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.241"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "2.47.241"

          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" baseline
          git -C baseline fetch -q origin 0b6bd7212066abd5ae6938344e538f5dd977c0be
          git -C baseline checkout -q --detach 0b6bd7212066abd5ae6938344e538f5dd977c0be
          echo P01_V247241_EXACT_SOURCE=PASS

      - name: Syntax gates
        shell: bash
        run: |
          set -Eeuo pipefail
          files=(
            candidate/src/app/CourseLibraryPage.php
            candidate/src/app/CourseMarkdownRenderer.php
            candidate/src/app/CoursePackageStore.php
            candidate/src/app/DisasterRecovery.php
            candidate/src/course-package-upload.php
            candidate/src/course-package-file.php
            candidate/tests/unit/course_markdown_reader_contract.php
            candidate/tests/unit/course_package_security_contract.php
            candidate/tests/unit/course_personal_study_r1_contract.php
            candidate/tests/integration/resource_asset_disaster_recovery_contract.php
          )
          for file in "${files[@]}"; do php -l "$file"; done
          node --check candidate/src/assets/course-experience.js
          echo P01_V247241_SYNTAX=PASS

      - name: Canonical zero-debt regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate baseline --require-zero-debt | tee /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/canonical.txt
          echo P01_V247241_CANONICAL=PASS

      - name: Focused Course Reader contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          php candidate/tests/unit/course_markdown_reader_contract.php
          php candidate/tests/unit/course_package_security_contract.php
          php candidate/tests/unit/course_personal_study_r1_contract.php
          php candidate/tests/integration/resource_asset_disaster_recovery_contract.php
          echo P01_V247241_FOCUSED=PASS

      - name: Schema and authority guard
        shell: bash
        run: |
          set -Eeuo pipefail
          changed="$(git -C candidate diff --name-only 0b6bd7212066abd5ae6938344e538f5dd977c0be..HEAD)"
          if printf '%s\n' "$changed" | grep -E '(^|/)(migrations?|schema)(/|\.|$)'; then
            echo "Unexpected Schema/Migration change"
            exit 1
          fi
          grep -F "private const ASSET_KIND = 'course_package';" candidate/src/app/CoursePackageStore.php
          grep -F 'resource_asset_files' candidate/docs/authority/SSOT.md
          echo P01_V247241_NO_SCHEMA_SECOND_AUTHORITY=PASS

      - name: Mutation boundary
        shell: bash
        run: |
          echo FORMAL_RELEASE_CALLED=NO
          echo DISTRIBUTION_WRITE=NO
          echo PRODUCTION_WRITE=NO
