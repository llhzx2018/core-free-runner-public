name: P05 V1.1.7 Release Prep

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout P05 release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: release/p05-v1.1.7-cloudpanel-fpm-20260830
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set V1.1.7 release identity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          version='1.1.7'
          Path('VERSION').write_text(version+'\n', encoding='utf-8')
          pkg=json.loads(Path('package.json').read_text(encoding='utf-8'))
          pkg['version']=version
          Path('package.json').write_text(json.dumps(pkg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          project=json.loads(Path('VF_PROJECT.json').read_text(encoding='utf-8'))
          project['status']='V1.1.7_RELEASE_CANDIDATE / DEPLOYMENT_READY / PRODUCTION_NOT_DEPLOYED'
          project['version']=version
          project['target_version']=version
          project['working_version']=version
          project['v1_1_7_cloudpanel_fpm_home_cache_fix']={
            'state':'RELEASE_CANDIDATE',
            'capability':'CLOUDPANEL_FPM_HOME_RESOLUTION_AND_DYNAMIC_CDN_NOSTORE',
            'verified_feature_source':'27c18c1545b0439e5e0df20be2c4eb152db72437',
            'verified_feature_gate_run':33309851385,
            'home_unset':'PASS',
            'legacy_shared_state_ignored':'PASS',
            'cloudflare_nostore':'PASS',
            'browser_first_install':'PASS',
            'chrome_e2e':'PASS',
            'production_state':'NOT_DEPLOYED'
          }
          Path('VF_PROJECT.json').write_text(json.dumps(project,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add VERSION package.json VF_PROJECT.json
          git diff --cached --quiet && exit 0
          git commit -m 'release(P05): prepare V1.1.7 CloudPanel FPM fix'
          git push origin HEAD:release/p05-v1.1.7-cloudpanel-fpm-20260830
