name: S01 C02 1098 Recovery Readonly Browser
on:
  push:
    branches: [task/s01-c02-recovery-1098-readonly-browser-20261012]
permissions:
  contents: read
jobs:
  recovery-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_SHA: bd85b7eb57a0fc84ee262fe27d08a826b5d7a409
    steps:
      - name: Checkout isolated runner lane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Checkout exact released product source read only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.PRODUCT_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Exact source PHP and JavaScript syntax
        run: |
          test "$(git -C product rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(cat product/VERSION)" = 1.21.1098
          php -l product/includes/admin-v13/views/system_recovery.php
          php -l product/includes/recovery/service.php
          php -l product/includes/v6/platform-backup-executor.php
          node --check product/assets/js/v13/system/recovery.js
      - name: Install disposable Chromium
        working-directory: product
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise published recovery UX and restore confirmation without a write
        working-directory: product
        run: |
          node tests/s01-c02-1211022-recovery-golden-path-browser-proof.js
          # 1211023 is archived evidence: its fixture still draws an inert
          # disabled "先扫描" button, which 1211024 explicitly removed.
          # Never convert that obsolete test failure into a Product FAIL.
          php -r '$v=file_get_contents("includes/admin-v13/views/system_recovery.php"); if(!str_contains($v,"if($"."seedScanned&&$"."seedCount>0)") || str_contains($v,"disabled(!$"."seedScanned||$"."seedCount<1)")) exit(1); echo "CURRENT_SOURCE_HISTORY_CLEANUP_GUARD_PASS\\n";'
          node tests/s01-c02-1211024-recovery-diagnostics-browser-proof.js
          echo RECOVERY_1098_CURRENT_READONLY_CHROMIUM_PASS
