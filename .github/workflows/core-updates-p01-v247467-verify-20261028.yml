name: P01 V247467 one-time independent update channel verification
on:
  push:
    branches: [task/core-updates-p01-v247467-verify-20261028]
    paths: ['.github/workflows/core-updates-p01-v247467-verify-20261028.yml']
  pull_request:
    branches: [main]
    paths: ['.github/workflows/core-updates-p01-v247467-verify-20261028.yml']
permissions:
  contents: read
env:
  CHANNEL_SHA: a9fd715f72dc344a496d1dc1fc2f435dc2bf41b3
  RELEASE_SHA: c7c17a052e11cfa557d16ae5019d418faf6a49b1
  RELEASE_ID: "426158086"
  TARGET_VERSION: "2.47.467"
  TARGET_ASSET_SHA: f53f6c761a2a7417b08d14c0d04bca712479dd6b3fa4971eb24799c82fa2bc39
  TARGET_ASSET_BYTES: "3123542"
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Transient exact-channel checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: a9fd715f72dc344a496d1dc1fc2f435dc2bf41b3
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: channel
      - name: Verify release metadata and channel source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git -C channel rev-parse HEAD)" = "$CHANNEL_SHA"
          python3 channel/scripts/check_manifest_contract.py
          jq -e --arg sha "$RELEASE_SHA" --argjson rel "$RELEASE_ID" --arg ver "$TARGET_VERSION" \
            '.project_id=="P01" and .target_version==$ver and .current_version=="2.47.466" and .update_type=="ATOMIC" and .product_identity==$sha and .release_id==$rel and .schema_from==.schema_to and .backup_required==true and .rollback_supported==true and (.from_versions==["2.47.466"])' channel/projects/P01.json >/dev/null
          gh api repos/llhzx2018/vf-start/releases/tags/v2.47.467 > /tmp/p01-release.json
          jq -e --arg sha "$RELEASE_SHA" --argjson rel "$RELEASE_ID" '.id==$rel and .tag_name=="v2.47.467" and .draft==false and .prerelease==false' /tmp/p01-release.json >/dev/null
          gh api repos/llhzx2018/vf-start/git/ref/tags/v2.47.467 --jq '.object.sha' | grep -Fx "$RELEASE_SHA"
          jq -e --arg name "VF_Start_V2.47.467_UPDATE.zip" --argjson bytes "$TARGET_ASSET_BYTES" --arg digest "sha256:$TARGET_ASSET_SHA" '.assets[] | select(.name==$name and .size==$bytes and .digest==$digest)' /tmp/p01-release.json >/dev/null
          echo P01_CHANNEL_EXACT_RELEASE_IDENTITY=PASS
      - name: Run canonical update contract and PHP regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd channel
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php update-core/php/tests/run.php
          echo P01_CHANNEL_PHP_AND_MANIFEST=PASS
      - name: Public metadata receipt
        if: success()
        shell: bash
        run: |
          mkdir -p proof
          printf '{"scope":"exact P01 channel, release digest, manifest/php","result":"PASS_INDEPENDENT","channel_sha":"%s","product_sha":"%s","run_id":"%s"}\n' "$CHANNEL_SHA" "$RELEASE_SHA" "$GITHUB_RUN_ID" > proof/metadata.json
      - name: Publish metadata only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: p01-v247467-channel-${{ github.run_id }}
          path: proof/metadata.json
          retention-days: 14
      - name: Remove transient private channel checkout
        if: always()
        shell: bash
        run: rm -rf -- channel
