name: P07 release115 private diagnostic authorized staging (exact-source)
on:
  push:
    branches: [release/p07-115-private-repro-20261106]
    paths: [.github/workflows/p07-release115-stage-once.yml]
permissions:
  contents: write
concurrency:
  group: p07-115-staging-once
  cancel-in-progress: false
jobs:
  stage:
    if: >-
      ${{ github.repository == 'llhzx2018/core-free-runner-public' && github.ref == 'refs/heads/release/p07-115-private-repro-20261106' && startsWith(github.event.head_commit.message, 'P07 release115 authorized exact staging') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout actual public release114 base and staging branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Checkout merged exact private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 02d64a008196ff46d7acb41fde0f4dab1df3c65e
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: _p07_private115
      - name: Verify exact tested tree and machine proof
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C _p07_private115 rev-parse HEAD)" = 02d64a008196ff46d7acb41fde0f4dab1df3c65e
          test "$(git -C _p07_private115 rev-parse HEAD^{tree})" = c81c687cb51f5542aa7a8a60b981f0f2a7b9dff6
          test "$(cat _p07_private115/BUILD_ID)" = '0.1.0-release115'
          test "$(cat dist/p07/0.1.0/overlay/BUILD_ID)" = '0.1.0-release114'
          echo P07_115_TESTED_MERGED_TREE_AND_114_BASE_EXACT=PASS
      - name: Build coordinated release115 candidate from main without production changes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B _p07_private115/scripts/p07_candidate_bundle.py \
            --product-root _p07_private115 --public-root . \
            --output "$RUNNER_TEMP/p07-candidate115" \
            --product-sha 02d64a008196ff46d7acb41fde0f4dab1df3c65e \
            --build 0.1.0-release115 --care 0.1.0-rc82
          python3 - "$RUNNER_TEMP/p07-candidate115" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          info=json.loads((root/'candidate_attestation.json').read_text())
          assert info['product_build']=='0.1.0-release115'
          assert info['product_source_sha']=='02d64a008196ff46d7acb41fde0f4dab1df3c65e'
          assert info['system_care_build']=='0.1.0-rc82'
          assert info['status']=='FORMAL_STAGING_NOT_PUBLISHED'
          assert not any(info['negative'].values())
          def blob(p):
            v=p.read_bytes()
            return hashlib.sha1(b'blob '+str(len(v)).encode()+b'\0'+v).hexdigest()
          overlay=root/'dist/p07/0.1.0/overlay'
          def verify(name):
            entries=set()
            for row in (overlay/name).read_text().splitlines():
              digest,rel=row.split('  ',1)
              assert rel not in entries
              entries.add(rel)
              path=overlay/rel
              assert path.is_file() and not path.is_symlink() and blob(path)==digest,rel
            return entries
          runtime=verify('RUNTIME.gitblob')
          complete=verify('MANIFEST.gitblob')
          assert runtime<=complete
          assert 'lib/migration_private_sql_repro.py' in runtime
          assert 'tests/test_issue287_private_repro.py' in complete
          assert info['runtime_file_count']==len(runtime)
          assert blob(overlay/'RUNTIME.gitblob')==info['runtime_manifest_blob']
          assert blob(overlay/'MANIFEST.gitblob')==info['overlay_manifest_blob']
          assert blob(root/'installers/p07-final.sh')==info['final_installer_blob']
          assert '--capture-private-repro' in (overlay/'bin/vfops-migrate-ui').read_text()
          print('P07_115_RELEASE_MANIFEST_PRIVATE_DIAGNOSTIC_INSTALLABLE_PASS')
          PY
          bash -n "$RUNNER_TEMP/p07-candidate115/installers/p07.sh" \
            "$RUNNER_TEMP/p07-candidate115/installers/p07-final.sh" \
            "$RUNNER_TEMP/p07-candidate115/installers/p07-toolbox.sh" \
            "$RUNNER_TEMP/p07-candidate115/installers/p07-system-care.sh"
      - name: Stage only P07 installable public program files
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/p07-candidate115"
          rsync -a "$root/dist/p07/0.1.0/overlay/" dist/p07/0.1.0/overlay/
          mkdir -p packages/p07-system-care/0.1.0-rc82
          rsync -a "$root/packages/p07-system-care/0.1.0-rc82/" packages/p07-system-care/0.1.0-rc82/
          cp "$root/installers/p07.sh" installers/p07.sh
          cp "$root/installers/p07-final.sh" installers/p07-final.sh
          cp "$root/installers/p07-toolbox.sh" installers/p07-toolbox.sh
          cp "$root/installers/p07-system-care.sh" installers/p07-system-care.sh
          cp "$root/candidate_attestation.json" experiments/p07-release115-attestation.json
          git add -- dist/p07/0.1.0/overlay \
            packages/p07-system-care/0.1.0-rc82 \
            installers/p07.sh installers/p07-final.sh \
            installers/p07-toolbox.sh installers/p07-system-care.sh \
            experiments/p07-release115-attestation.json
          python3 - <<'PY'
          import subprocess
          rows=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert rows
          for name in rows:
            assert (name.startswith('dist/p07/0.1.0/overlay/') or
                    name.startswith('packages/p07-system-care/0.1.0-rc82/') or
                    name in {'installers/p07.sh','installers/p07-final.sh',
                             'installers/p07-toolbox.sh','installers/p07-system-care.sh',
                             'experiments/p07-release115-attestation.json'}),name
          print('P07_115_PUBLIC_STAGE_ALLOWLIST_PASS')
          PY
          git -c user.name='P07 Release Builder' -c user.email='actions@users.noreply.github.com' \
            commit -m "P07 release115 staged only; product 02d64a00"
          git push origin HEAD:refs/heads/release/p07-115-private-repro-20261106
          echo P07_115_STAGED_TO_REVIEW_BRANCH_NOT_PUBLIC_MAIN=PASS
      - name: Always remove exact private source and generated package
        if: always()
        shell: bash
        run: |
          rm -rf -- _p07_private115 "$RUNNER_TEMP/p07-candidate115"
          echo P07_115_PRIVATE_SOURCE_CLEANED
