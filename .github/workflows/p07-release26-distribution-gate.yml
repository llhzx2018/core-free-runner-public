name: P07 Release26 Distribution Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'installers/p07.sh'
      - 'installers/p07-final.sh'
      - 'installers/p07-toolbox.sh'
      - 'dist/p07/0.1.0/overlay/**'
      - '.github/workflows/p07-release26-distribution-gate.yml'

permissions:
  contents: read

jobs:
  distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Release26 identity
        run: |
          set -Eeuo pipefail
          root='dist/p07/0.1.0/overlay'
          test "$(cat "$root/BUILD_ID")" = '0.1.0-release26'
          grep -Fq 'EXPECTED_BUILD_ID="0.1.0-release26"' installers/p07-final.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release26"' installers/p07-toolbox.sh
          grep -Fq 'RUNTIME_MANIFEST_BLOB="125b7d6c5a29f0c34f75418cf2f520cdd51633cd"' installers/p07-final.sh
          grep -Fq 'EXPECTED_BLOB="51f4ccd771cb6d9f2a9b48e8405e3c7111c034b6"' installers/p07.sh

      - name: Exact overlay and runtime manifests
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('dist/p07/0.1.0/overlay')
          def blob(path: Path) -> str:
              data=path.read_bytes()
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          for name in ('RUNTIME.gitblob','MANIFEST.gitblob'):
              seen=set()
              for line in (root/name).read_text(encoding='utf-8').splitlines():
                  if not line.strip():
                      continue
                  expected, rel=line.split('  ',1)
                  assert rel not in seen, (name, rel)
                  seen.add(rel)
                  path=root/rel
                  assert path.is_file(), (name, rel)
                  assert blob(path)==expected, (name, rel, blob(path), expected)
          PY

      - name: Beginner whole-site switch contract
        run: |
          set -Eeuo pipefail
          ui='dist/p07/0.1.0/overlay/bin/vfops-migrate-ui'
          engine='dist/p07/0.1.0/overlay/lib/server_migration_pull.py'
          grep -Fq '旧服务器网站开关' "$ui"
          grep -Fq '开启旧服务器全部网站' "$ui"
          grep -Fq '停止旧服务器全部网站' "$ui"
          grep -Fq '一次操作整台旧服务器的网站，不需要一个网站一个网站处理' "$ui"
          grep -Fq '不会影响 CloudPanel 后台，也不会修改 DNS' "$ui"
          grep -Fq 'source-nginx-start' "$ui"
          grep -Fq 'source-nginx-stop' "$ui"
          grep -Fq 'systemctl start nginx' "$engine"
          grep -Fq 'systemctl stop nginx' "$engine"
          ! grep -Fq 'systemctl start clp-nginx' "$engine"
          ! grep -Fq 'systemctl stop clp-nginx' "$engine"

      - name: Syntax and targeted tests
        run: |
          set -Eeuo pipefail
          root='dist/p07/0.1.0/overlay'
          bash -n "$root/bin/vfops"
          bash -n "$root/bin/vfops-migrate-ui"
          python3 -m py_compile "$root/lib/server_migration_pull.py"
          cd "$root"
          export PYTHONPATH="$PWD/lib"
          python3 -m unittest -q             tests.test_menu3_modular             tests.test_server_migration_pull             tests.test_p07_integration_manifest             tests.test_user_entry

      - name: Isolated current-runtime install
        run: |
          set -Eeuo pipefail
          root="$PWD"
          tmp="$(mktemp -d)"
          export P07_PUBLIC_ROOT="file://$root"
          export P07_INSTALL_DIR="$tmp/install"
          export P07_PREVIOUS_DIR="$tmp/previous"
          export P07_BIN_LINK="$tmp/vfops"
          export P07_ALLOW_NONROOT=1
          export P07_NO_EXEC=1
          bash installers/p07-final.sh >"$tmp/install.log"
          test "$("$tmp/vfops" --version)" = 'VF Server Ops 0.1.0'
          test "$("$tmp/vfops" --build-id)" = '0.1.0-release26'
          grep -Fq 'lib/server_migration_pull.py' "$tmp/install/.runtime-manifest.gitblob"

      - name: Safety boundary
        run: |
          set -Eeuo pipefail
          root='dist/p07/0.1.0/overlay'
          ! grep -R -n -E '(PRIVATE KEY|BEGIN OPENSSH|ghp_[A-Za-z0-9]|github_pat_)' "$root/bin" "$root/lib" installers/p07*.sh
          ! grep -R -n -E 'systemctl[[:space:]]+(start|stop|restart)[[:space:]]+clp-nginx' "$root/bin" "$root/lib"
          grep -Fq 'DNS 不自动修改' "$root/bin/vfops-migrate-ui"
          grep -Fq '旧服务器永不自动删除' "$root/bin/vfops-migrate-ui"

      - name: Result
        if: always()
        run: |
          echo 'P07_RELEASE26_DISTRIBUTION_GATE=COMPLETE'
          echo 'P07_PRODUCTION_WRITE=NOT_RUN'
          echo 'P07_REAL_SERVER_NGINX_SWITCH=NOT_RUN'
