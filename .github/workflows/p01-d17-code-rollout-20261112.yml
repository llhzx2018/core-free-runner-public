name: P01 D17 isolated code pointer Atomic rollback (temporary)
on:
  push:
    branches:
      - test/p01-d17-code-rollout-20261112
permissions:
  contents: read
jobs:
  d17-code-switch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify registered public-safe workflow identity
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "$GITHUB_REF_NAME" = "test/p01-d17-code-rollout-20261112"
          echo P01_D17_PRIVATE_USER_DATA=NONE
      - name: Verify temporary private checkout capability
        env:
          PRIVATE_READ: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ"
          echo P01_D17_REGISTERED_READ_CAPABILITY=PASS
      - name: Checkout exact private product candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 4a4a83fffdfaced8e72f4809f14a70da466d2569
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - name: Verify source and PHP compatibility
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "4a4a83fffdfaced8e72f4809f14a70da466d2569"
          test "$(cat candidate/VERSION)" = "2.47.515"
          php -l candidate/src/app/next/runtime/WriteGate.php
          php -l candidate/src/app/next/runtime/IsolatedAtomicCodeStage.php
          php -l candidate/tests/unit/p01_d17_isolated_code_switch_contract.php
          echo P01_D17_EXACT_SOURCE=4a4a83fffdfaced8e72f4809f14a70da466d2569
      - name: Isolated version staging and injected rollback
        run: |
          set -Eeuo pipefail
          php candidate/tests/unit/p01_d17_isolated_code_switch_contract.php
      - name: Existing D15 lock regression
        run: |
          set -Eeuo pipefail
          php candidate/tests/unit/p01_d15_write_gate_contract.php
          echo P01_D17_D15_LOCK_REGRESSION=PASS
      - name: Confirm not production Atomic
        run: |
          set -Eeuo pipefail
          echo P01_D17_FULL_ATOMIC_READY=NO
          echo P01_D17_RUNTIME_DATA_AND_MEDIA_RESTORE=NOT_PROVEN
      - name: Cleanup transient private source
        if: always()
        run: |
          rm -rf -- candidate
          echo P01_D17_PRIVATE_SOURCE_PERSISTED=NO
