name: temp-s01-ops-final-update-menu-inventory-20260908
on:
  push:
    branches:
      - temp/s01-page-update-center-v4-20260907
    paths:
      - .github/workflows/temp-s01-ops-final-update-menu-inventory-20260908.yml
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      REPO: llhzx2018/vf-tools-ops
      SHA: fed61edd6df2f8bdd07d8b3f18707fcb33e412bf
    steps:
      - name: Inventory whole-repo Ops update menu registrations
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'INVENTORY_MODE=READ_ONLY WRITE_USED=NO RELEASE_WRITE_USED=NO DISTRIBUTION_WRITE_USED=NO PRODUCTION_WRITE_USED=NO'
          rm -rf /tmp/ops-final-menu
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/${REPO}.git" /tmp/ops-final-menu
          git -C /tmp/ops-final-menu checkout -q "$SHA"
          test "$(git -C /tmp/ops-final-menu rev-parse HEAD)" = "$SHA"
          cd /tmp/ops-final-menu
          printf 'HEAD='; git rev-parse HEAD
          printf 'VERSION='; cat VERSION
          echo '===== MENU_CALLS ====='
          grep -RInE --include='*.php' --exclude-dir=.git --exclude-dir=vendor --exclude-dir=node_modules 'add_(menu_page|submenu_page|theme_page|management_page|plugins_page|options_page)\s*\(|remove_submenu_page\s*\(' . | head -n 500 || true
          echo '===== UPDATE_OWNERSHIP ====='
          grep -RInE --include='*.php' --include='*.js' --include='*.json' --exclude-dir=.git --exclude-dir=vendor --exclude-dir=node_modules 'VF 在线更新|vf-private-updates|在线更新|统一更新|tools\.php|update[-_](center|hub|admin)|更新中心' . | head -n 800 || true
          echo '===== NORMAL_MENU_ASSERTIONS ====='
          count_vf_private="$(grep -RIl --include='*.php' --exclude-dir=.git --exclude-dir=vendor --exclude-dir=node_modules 'vf-private-updates' . | wc -l | tr -d ' ')"
          echo "FILES_REFERENCING_VF_PRIVATE_UPDATES=$count_vf_private"
          echo 'PASS_S01_OPS_FINAL_UPDATE_MENU_INVENTORY'
