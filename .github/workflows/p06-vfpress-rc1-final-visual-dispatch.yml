name: P06 VF Press RC1 Final Visual Dispatcher

on:
  push:
    branches: [main]
    paths:
      - 'requests/p06-vfpress-rc1-final-visual-*.txt'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch final visual workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run p06-vfpress-rc1-final-visual.yml --repo llhzx2018/core-free-runner-public --ref main
