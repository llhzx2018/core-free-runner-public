name: P07 140 existing DB native readback synthetic proof
on:
  push:
    branches:
      - task/p07-138-source-schema-readonly-20261110
permissions:
  contents: read
concurrency:
  group: p07-140-native-readback-20261110
  cancel-in-progress: false
jobs:
  readback-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      PRODUCT_SHA: 8f0da799e5192201b2ec2cfd28b4da7d55d354b5
      WORK: /tmp/p07-140-readback-20261110
    steps:
      - name: Checkout exact private P07 source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 8f0da799e5192201b2ec2cfd28b4da7d55d354b5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product
      - name: Focused native readback / backup / security / no-reimport regression
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C product rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(cat product/BUILD_ID)" = '0.1.0-release140'
          (cd product && python3 -B -m unittest -q \
            tests.test_p07_original_db_protection \
            tests.test_p07_native_existing_db_adoption \
            tests.test_migration_laravel_live_parity \
            tests.test_migration_failed_prepare_audit \
            tests.test_p07_untouched_suffix \
            tests.test_p07_failed_whole_vps_native_readonly)
          echo P07_140_FOCUSED_SYNTHETIC=PASS
      - name: Exact private source real MariaDB 11.8 disposable check
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C product rev-parse HEAD)" = "$PRODUCT_SHA"
          docker run -d --rm --name p07-140-synthetic \
            -e MARIADB_ROOT_PASSWORD=p07-synthetic-only \
            -p 127.0.0.1:3306:3306 mariadb:11.8 >/dev/null
          trap 'docker rm -f p07-140-synthetic >/dev/null 2>&1 || true' EXIT
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mariadb-client >/dev/null
          for attempt in $(seq 1 60); do
            if MYSQL_PWD=p07-synthetic-only mariadb --no-defaults -h127.0.0.1 -P3306 -uroot --batch --skip-column-names -e 'SELECT 1' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          (cd product && P07_SYNTHETIC_MARIADB=1 P07_DB_TEST_HOST=127.0.0.1 P07_DB_TEST_PORT=3306 P07_DB_TEST_PASSWORD=p07-synthetic-only \
            python3 -B -m unittest -q tests.test_migration_laravel_readonly_engine tests.test_migration_laravel_mariadb_engine)
          echo P07_140_REAL_DISPOSABLE_MARIADB=PASS
      - name: Cleanup private source and transient files
        if: always()
        shell: bash
        run: |
          rm -rf -- product "$WORK"
          echo P07_140_PRIVATE_WORKSPACE_CLEANED=YES
          echo P07_140_OWNER_DB_WRITES=NONE
          echo P07_140_FORMAL_RELEASE=NO
  owner-trial:
    needs: readback-proof
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PRODUCT_SHA: 8f0da799e5192201b2ec2cfd28b4da7d55d354b5
      PUBLIC_BASE_SHA: 7c3f685465b0da9a4414a13b629ea599006019ae
      RELEASE_REPO: llhzx2018/core-free-runner-public
      TRIAL_TAG: p07-v0.1.0-release140-owner-trial
      FILE: p07-release140-rc140-owner-test.tar.gz
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Checkout public trial script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact private P07 source, transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 8f0da799e5192201b2ec2cfd28b4da7d55d354b5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product
      - name: Checkout immutable public base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 7c3f685465b0da9a4414a13b629ea599006019ae
          persist-credentials: false
          fetch-depth: 1
          path: public-base
      - name: Build, hash and install/rollback-test exact manifest runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C product rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git -C public-base rev-parse HEAD)" = "$PUBLIC_BASE_SHA"
          test "$(cat product/BUILD_ID)" = 0.1.0-release140
          bash -n installers/p07-owner-test140.sh
          work="$RUNNER_TEMP/p07-140-owner"
          mkdir -p "$work/out"
          python3 -B product/scripts/p07-owner-prebuilt140-package.py \
            --product-root "$PWD/product" --public-root "$PWD/public-base" \
            --product-sha "$PRODUCT_SHA" --output-dir "$work/out" > "$work/build.log"
          grep -Fxq P07_OWNER_PACKAGE_CREATED=YES "$work/build.log"
          grep -Fxq P07_OWNER_PACKAGE_FORMAL_RELEASE=NO "$work/build.log"
          (cd "$work/out" && sha256sum -c "$FILE.sha256")
          python3 -B - "$work/out/$FILE" "$PRODUCT_SHA" <<'PY'
          import hashlib,json,sys,tarfile
          archive,expected=sys.argv[1:3]
          def git_blob(b):return hashlib.sha1(b"blob "+str(len(b)).encode()+b"\0"+b).hexdigest()
          with tarfile.open(archive,"r:gz") as a:
              names=a.getnames()
              assert len(names)>100
              assert all(x=="candidate" or x.startswith("candidate/") for x in names)
              assert all(x.isfile() or x.isdir() for x in a.getmembers())
              att=json.loads(a.extractfile("candidate/candidate_attestation.json").read())
              assert att["product_source_sha"]==expected
              assert att["product_build"]=="0.1.0-release140"
              assert att["status"]=="FORMAL_STAGING_NOT_PUBLISHED"
              runtime="candidate/dist/p07/0.1.0/overlay/"
              manifest=a.extractfile(runtime+"RUNTIME.gitblob").read()
              assert git_blob(manifest)==att["runtime_manifest_blob"]
              for line in manifest.decode().splitlines():
                  expected_sha,path=line.split("  ",1)
                  assert path and ".." not in path.split("/") and not path.startswith("/")
                  assert git_blob(a.extractfile(runtime+path).read())==expected_sha
              assert runtime+"lib/migration_laravel_db_agent.py" in names
              assert runtime+"lib/migration_full_vps_native_readonly.py" in names
          PY
          mkdir -p "$work/unpack"
          tar -xzf "$work/out/$FILE" -C "$work/unpack"
          P07_ALLOW_NONROOT=1 P07_INSTALL_DIR="$work/installed" \
            P07_PREVIOUS_DIR="$work/installed.previous" \
            P07_BIN_LINK="$work/vfops" \
            P07_PUBLIC_ROOT="file://$work/unpack/candidate" P07_NO_EXEC=1 \
            bash "$work/unpack/candidate/installers/p07.sh" > "$work/install.log"
          test "$(NO_COLOR=1 "$work/vfops" --build-id)" = 0.1.0-release140
          mkdir -p "$work/fail-original" "$work/fail-link-directory"
          echo KEEP > "$work/fail-original/MARKER"
          if P07_ALLOW_NONROOT=1 P07_INSTALL_DIR="$work/fail-original" \
            P07_PREVIOUS_DIR="$work/fail-original.previous" \
            P07_BIN_LINK="$work/fail-link-directory" \
            P07_PUBLIC_ROOT="file://$work/unpack/candidate" P07_NO_EXEC=1 \
            bash "$work/unpack/candidate/installers/p07.sh" > "$work/fail.log" 2>&1; then
              echo EXPECTED_INSTALL_FAILURE_MISSING; exit 23
          fi
          grep -Fxq KEEP "$work/fail-original/MARKER"
          test ! -e "$work/fail-original.previous"
          echo P07_140_BUILD_SHA_INSTALL_ROLLBACK=PASS
      - name: Publish nonformal prerelease and verify anonymous asset bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test -n "$GH_TOKEN" || { echo P07_NO_RELEASE_WRITE_CAPABILITY; exit 78; }
          work="$RUNNER_TEMP/p07-140-owner"
          original_sha="$(sha256sum "$work/out/$FILE" | awk '{print $1}')"
          if gh api "repos/$RELEASE_REPO/releases/tags/$TRIAL_TAG" >/dev/null 2>&1; then
            echo P07_140_TAG_EXISTS_VERIFY_ONLY
          else
            gh release create "$TRIAL_TAG" "$work/out/$FILE" "$work/out/$FILE.sha256" \
              --repo "$RELEASE_REPO" --target "$GITHUB_SHA" --prerelease \
              --title "P07 0.1.0-release140 Owner trial — NOT FORMAL" \
              --notes "Optional manual owner candidate. P07 PR313 source 8f0da799e5192201b2ec2cfd28b4da7d55d354b5. Installable runtime only, no private full checkout, secret or production data; no automatic migration, source freeze, database writes, cutover or DNS. Not Formal Release or stable distribution."
          fi
          test "$(gh api "repos/$RELEASE_REPO/releases/tags/$TRIAL_TAG" --jq '.prerelease')" = true
          test "$(gh api "repos/$RELEASE_REPO/releases/tags/$TRIAL_TAG" --jq '.assets | length')" = 2
          actual_sha="$(gh api "repos/$RELEASE_REPO/releases/tags/$TRIAL_TAG" --jq '.assets[] | select(.name == "p07-release140-rc140-owner-test.tar.gz") | .digest')"
          test "$actual_sha" = "sha256:$original_sha" || { echo P07_140_ASSET_HASH_MISMATCH; exit 78; }
          asset_id="$(gh api "repos/$RELEASE_REPO/releases/tags/$TRIAL_TAG" --jq '.assets[] | select(.name == "p07-release140-rc140-owner-test.tar.gz") | .id')"
          [[ "$asset_id" =~ ^[0-9]+$ ]] || exit 78
          verified=''
          for url in \
            "https://github.com/$RELEASE_REPO/releases/download/$TRIAL_TAG/$FILE" \
            "https://api.github.com/repos/$RELEASE_REPO/releases/assets/$asset_id"; do
            if curl -fsSL --retry 2 --connect-timeout 15 --max-time 60 \
              -H 'Accept: application/octet-stream' "$url" -o "$work/remote.tar.gz" &&
              cmp -s "$work/remote.tar.gz" "$work/out/$FILE"; then
              verified="$url"; break
            fi
          done
          test -n "$verified" || { echo P07_140_ANONYMOUS_FETCH_FAILED; exit 78; }
          printf '%s\n' "$verified" > "$work/verified-url"
          printf 'P07_140_TRIAL_ASSET_ID=%s\n' "$asset_id"
          printf 'P07_140_TRIAL_ASSET_SHA256=%s\n' "$original_sha"
          echo P07_140_TRIAL_ASSET_REMOTE_VERIFIED=PASS
      - name: Root no-Git installer test preserving stable115
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          work="$RUNNER_TEMP/p07-140-owner"
          sudo install -d -m 755 /opt/vf-server-ops
          printf '%s\n' 0.1.0-release115 | sudo tee /opt/vf-server-ops/BUILD_ID >/dev/null
          test -s "$work/verified-url"
          test -s "$work/verified-url"
          grep -Fq "releases/assets/730637817" installers/p07-owner-test140.sh
          grep -Fq "cf123d714c67b467d8dad9c15e3d816e48c65afe679a3880a5a79719d367eb93" installers/p07-owner-test140.sh
          sudo bash installers/p07-owner-test140.sh > "$work/root-install.log"
          grep -Fxq P07_OWNER140_TEST_INSTALL=PASS "$work/root-install.log"
          test "$(sudo env NO_COLOR=1 /usr/local/bin/vfops-rc140 --build-id)" = 0.1.0-release140
          test "$(cat /opt/vf-server-ops/BUILD_ID)" = 0.1.0-release115
          echo P07_140_ANONYMOUS_NO_GIT_ROOT_INSTALL=PASS
          echo P07_140_OWNER_MIGRATION_AUTORUN=NO
          echo P07_140_OWNER_DNS_CHANGED=NO
      - name: Cleanup transient private checkout and package
        if: always()
        shell: bash
        run: |
          rm -rf -- product public-base "$RUNNER_TEMP/p07-140-owner"
          echo P07_140_PRIVATE_CHECKOUT_RETAINED=NO
