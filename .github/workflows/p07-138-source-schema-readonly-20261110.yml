name: P07 original 18-site mission and negative release gate
on:
  push:
    branches:
      - task/p07-138-source-schema-readonly-20261110
permissions:
  contents: read
concurrency:
  group: p07-143-native-readback-20261110
  cancel-in-progress: false
jobs:
  readback-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      PRODUCT_SHA: 8e8742834876770fac3e03dc43dee4534c97d0df
      WORK: /tmp/p07-143-readback-20261110
    steps:
      - name: Checkout exact private P07 source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 8e8742834876770fac3e03dc43dee4534c97d0df
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product
      - name: Independently check original 18-site mission lock and expected fail-closed readiness
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C product rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(cat product/BUILD_ID)" = 0.1.0-release143
          (cd product && python3 -B scripts/p07_task_lock_guard.py --mode scope --root .)
          (cd product && PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest -q tests.test_p07_task_lock_guard)
          python3 -B - <<'PY'
          import json,subprocess
          from pathlib import Path
          p=Path("product/docs/authority/P07_ACTIVE_TASK_LOCK.json")
          c=json.loads(p.read_text(encoding="utf-8"))
          assert c["original_migration_id"]=="pull-20261109T082020Z-7cca03ae"
          assert c["original_site_count"]==18
          assert c["pr_number"]==313
          assert c["implementation_state"]=="EXECUTOR_IN_DEVELOPMENT"
          assert c["milestones"]["database_protected_restore_drill"]=="CODED_NOT_VERIFIED"
          assert not any(v=="VERIFIED" for v in c["milestones"].values())
          assert c["operator_boundary"]["existing_cp2_database_overwrite"] is False
          assert c["operator_boundary"]["dns_auto"] is False
          baseline="bde107be3f8baf287f640ad2f8c107efc30e35fc"
          files=subprocess.check_output(["git","-C","product","diff","--name-only",baseline,"HEAD"],text=True).splitlines()
          assert "lib/migration_original_db_restore_drill.py" in files
          assert "tests/test_p07_original_db_restore_drill.py" in files
          assert "lib/server_migration_pull.py" in files
          assert "BUILD_ID" not in files
          print("P07_INDEPENDENT_OWNER_MISSION_LOCK=PASS")
          print("P07_EXECUTOR_CODE_DELTA=RESTORE_AND_EXISTING_CLI")
          print("P07_OWNER_VPS_MIGRATION_COMPLETED=NO")
          PY
          test_failure="$(mktemp)"
          trap 'rm -f "$test_failure"' EXIT
          (cd product && python3 -B scripts/p07_task_lock_guard.py --mode executor --root .) > "$test_failure"
          grep -Fxq P07_EXECUTOR_CODE_CHANGED=YES "$test_failure"
          if (cd product && python3 -B scripts/p07_task_lock_guard.py --mode release --root .) > "$test_failure"; then
            echo P07_UNPROVEN_RELEASE_WAS_INCORRECTLY_APPROVED
            exit 32
          fi
          grep -Fxq P07_TASK_LOCK_GATE=BLOCKED "$test_failure"
          echo P07_TASK_SCOPE_NEGATIVE_GATE=PASS
          echo P07_RELEASE_REQUIRES_NEW_EXECUTION_AND_INDEPENDENT_PROOF=YES
      - name: Focused native readback / backup / security / no-reimport regression
        if: false # unchanged readback engine; avoid irrelevant repeat
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C product rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(cat product/BUILD_ID)" = '0.1.0-release143'
          (cd product && python3 -B -m unittest -q \
            tests.test_p07_original_db_protection \
            tests.test_p07_native_existing_db_adoption \
            tests.test_migration_laravel_live_parity \
            tests.test_migration_failed_prepare_audit \
            tests.test_p07_untouched_suffix \
            tests.test_p07_failed_whole_vps_native_readonly)
          echo P07_143_FOCUSED_SYNTHETIC=PASS
      - name: Real MariaDB 11.8 protected original four-archive scratch recovery
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C product rev-parse HEAD)" = "$PRODUCT_SHA"
          docker run -d --rm --name p07-143-synthetic \
            -e MARIADB_ROOT_PASSWORD=p07-synthetic-only \
            -p 127.0.0.1:3306:3306 mariadb:11.8 >/dev/null
          trap 'docker rm -f p07-143-synthetic >/dev/null 2>&1 || true' EXIT
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mariadb-client >/dev/null
          for attempt in $(seq 1 60); do
            if MYSQL_PWD=p07-synthetic-only mariadb --no-defaults -h127.0.0.1 -P3306 -uroot --batch --skip-column-names -e 'SELECT 1' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          (cd product && P07_SYNTHETIC_MARIADB=1 P07_DB_TEST_HOST=127.0.0.1 P07_DB_TEST_PORT=3306 P07_DB_TEST_PASSWORD=p07-synthetic-only \
            python3 -B -m unittest -v tests.test_p07_original_db_restore_real_mariadb)
          echo P07_18_SITE_FOUR_DB_REAL_DISPOSABLE_MARIADB_RESTORE=PASS
      - name: Real recovery executor code — four already imported DB isolation and crash safety
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C product rev-parse HEAD)" = "$PRODUCT_SHA"
          (cd product && PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest -v \
            tests.test_p07_original_db_restore_drill \
            tests.test_p07_native_existing_db_adoption \
            tests.test_p07_original_db_protection)
          (cd product && python3 -B scripts/p07_task_lock_guard.py --mode executor --root .)
          if (cd product && python3 -B scripts/p07_task_lock_guard.py --mode release --root .); then
            echo P07_MISSING_FULL_MIGRATION_WAS_RELEASED
            exit 41
          fi
          echo P07_PROTECTED_FOUR_DB_RESTORE_EXECUTOR_SYNTHETIC=PASS
          echo P07_FULL_18_SITE_FINAL_SYNC=NOT_IMPLEMENTED
          echo P07_OWNER_PRODUCTION_DB_WRITES=NONE
      - name: Original 18-site source freeze and protected CLI integration
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C product rev-parse HEAD)" = "$PRODUCT_SHA"
          (cd product && PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest -v \
            tests.test_p07_original_18_source_freeze \
            tests.test_p07_source_pause \
            tests.test_p07_original_db_restore_drill)
          echo P07_ORIGINAL_18_SOURCE_FREEZE_AND_17_SITE_COMPAT=PASS
          echo P07_SOURCE_MYSQL_WRITER_FENCE=NOT_PROVEN
          echo P07_FULL_18_SITE_FINAL_SYNC=NOT_IMPLEMENTED
      - name: Cleanup private source and transient files
        if: always()
        shell: bash
        run: |
          rm -rf -- product "$WORK"
          echo P07_143_PRIVATE_WORKSPACE_CLEANED=YES
          echo P07_143_OWNER_DB_WRITES=NONE
          echo P07_143_FORMAL_RELEASE=NO
  owner-trial:
    if: false # task control only: NEVER publish a new Owner trial or update distribution
    needs: readback-proof
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PRODUCT_SHA: 8e8742834876770fac3e03dc43dee4534c97d0df
      PUBLIC_BASE_SHA: 7c3f685465b0da9a4414a13b629ea599006019ae
      RELEASE_REPO: llhzx2018/core-free-runner-public
      TRIAL_TAG: p07-v0.1.0-release143-owner-trial
      FILE: p07-release143-rc143-owner-test.tar.gz
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Checkout public trial script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact private P07 source, transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 8e8742834876770fac3e03dc43dee4534c97d0df
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product
      - name: Checkout immutable public base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 7c3f685465b0da9a4414a13b629ea599006019ae
          persist-credentials: false
          fetch-depth: 1
          path: public-base
      - name: Build, hash and install/rollback-test exact manifest runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C product rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git -C public-base rev-parse HEAD)" = "$PUBLIC_BASE_SHA"
          test "$(cat product/BUILD_ID)" = 0.1.0-release143
          bash -n installers/p07-owner-test143.sh
          work="$RUNNER_TEMP/p07-143-owner"
          mkdir -p "$work/out"
          python3 -B product/scripts/p07-owner-prebuilt143-package.py \
            --product-root "$PWD/product" --public-root "$PWD/public-base" \
            --product-sha "$PRODUCT_SHA" --output-dir "$work/out" > "$work/build.log"
          grep -Fxq P07_OWNER_PACKAGE_CREATED=YES "$work/build.log"
          grep -Fxq P07_OWNER_PACKAGE_FORMAL_RELEASE=NO "$work/build.log"
          (cd "$work/out" && sha256sum -c "$FILE.sha256")
          python3 -B - "$work/out/$FILE" "$PRODUCT_SHA" <<'PY'
          import hashlib,json,sys,tarfile
          archive,expected=sys.argv[1:3]
          def git_blob(b):return hashlib.sha1(b"blob "+str(len(b)).encode()+b"\0"+b).hexdigest()
          with tarfile.open(archive,"r:gz") as a:
              names=a.getnames()
              assert len(names)>100
              assert all(x=="candidate" or x.startswith("candidate/") for x in names)
              assert all(x.isfile() or x.isdir() for x in a.getmembers())
              att=json.loads(a.extractfile("candidate/candidate_attestation.json").read())
              assert att["product_source_sha"]==expected
              assert att["product_build"]=="0.1.0-release143"
              assert att["status"]=="FORMAL_STAGING_NOT_PUBLISHED"
              runtime="candidate/dist/p07/0.1.0/overlay/"
              manifest=a.extractfile(runtime+"RUNTIME.gitblob").read()
              assert git_blob(manifest)==att["runtime_manifest_blob"]
              for line in manifest.decode().splitlines():
                  expected_sha,path=line.split("  ",1)
                  assert path and ".." not in path.split("/") and not path.startswith("/")
                  assert git_blob(a.extractfile(runtime+path).read())==expected_sha
              assert runtime+"lib/migration_laravel_db_agent.py" in names
              assert runtime+"lib/migration_full_vps_native_readonly.py" in names
          PY
          mkdir -p "$work/unpack"
          tar -xzf "$work/out/$FILE" -C "$work/unpack"
          P07_ALLOW_NONROOT=1 P07_INSTALL_DIR="$work/installed" \
            P07_PREVIOUS_DIR="$work/installed.previous" \
            P07_BIN_LINK="$work/vfops" \
            P07_PUBLIC_ROOT="file://$work/unpack/candidate" P07_NO_EXEC=1 \
            bash "$work/unpack/candidate/installers/p07.sh" > "$work/install.log"
          test "$(NO_COLOR=1 "$work/vfops" --build-id)" = 0.1.0-release143
          mkdir -p "$work/fail-original" "$work/fail-link-directory"
          echo KEEP > "$work/fail-original/MARKER"
          if P07_ALLOW_NONROOT=1 P07_INSTALL_DIR="$work/fail-original" \
            P07_PREVIOUS_DIR="$work/fail-original.previous" \
            P07_BIN_LINK="$work/fail-link-directory" \
            P07_PUBLIC_ROOT="file://$work/unpack/candidate" P07_NO_EXEC=1 \
            bash "$work/unpack/candidate/installers/p07.sh" > "$work/fail.log" 2>&1; then
              echo EXPECTED_INSTALL_FAILURE_MISSING; exit 23
          fi
          grep -Fxq KEEP "$work/fail-original/MARKER"
          test ! -e "$work/fail-original.previous"
          echo P07_143_BUILD_SHA_INSTALL_ROLLBACK=PASS
      - name: Publish nonformal prerelease and verify anonymous asset bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test -n "$GH_TOKEN" || { echo P07_NO_RELEASE_WRITE_CAPABILITY; exit 78; }
          work="$RUNNER_TEMP/p07-143-owner"
          original_sha="$(sha256sum "$work/out/$FILE" | awk '{print $1}')"
          if gh api "repos/$RELEASE_REPO/releases/tags/$TRIAL_TAG" >/dev/null 2>&1; then
            echo P07_143_TAG_EXISTS_VERIFY_ONLY
          else
            gh release create "$TRIAL_TAG" "$work/out/$FILE" "$work/out/$FILE.sha256" \
              --repo "$RELEASE_REPO" --target "$GITHUB_SHA" --prerelease \
              --title "P07 0.1.0-release143 Owner trial — NOT FORMAL" \
              --notes "Optional manual owner candidate. P07 PR313 source 8e8742834876770fac3e03dc43dee4534c97d0df. Installable runtime only, no private full checkout, secret or production data; no automatic migration, source freeze, database writes, cutover or DNS. Not Formal Release or stable distribution."
          fi
          test "$(gh api "repos/$RELEASE_REPO/releases/tags/$TRIAL_TAG" --jq '.prerelease')" = true
          test "$(gh api "repos/$RELEASE_REPO/releases/tags/$TRIAL_TAG" --jq '.assets | length')" = 2
          actual_sha="$(gh api "repos/$RELEASE_REPO/releases/tags/$TRIAL_TAG" --jq '.assets[] | select(.name == "p07-release143-rc143-owner-test.tar.gz") | .digest')"
          test "$actual_sha" = "sha256:$original_sha" || { echo P07_143_ASSET_HASH_MISMATCH; exit 78; }
          asset_id="$(gh api "repos/$RELEASE_REPO/releases/tags/$TRIAL_TAG" --jq '.assets[] | select(.name == "p07-release143-rc143-owner-test.tar.gz") | .id')"
          [[ "$asset_id" =~ ^[0-9]+$ ]] || exit 78
          verified=''
          for url in \
            "https://github.com/$RELEASE_REPO/releases/download/$TRIAL_TAG/$FILE" \
            "https://api.github.com/repos/$RELEASE_REPO/releases/assets/$asset_id"; do
            if curl -fsSL --retry 2 --connect-timeout 15 --max-time 60 \
              -H 'Accept: application/octet-stream' "$url" -o "$work/remote.tar.gz" &&
              cmp -s "$work/remote.tar.gz" "$work/out/$FILE"; then
              verified="$url"; break
            fi
          done
          test -n "$verified" || { echo P07_143_ANONYMOUS_FETCH_FAILED; exit 78; }
          printf '%s\n' "$verified" > "$work/verified-url"
          printf 'P07_143_TRIAL_ASSET_ID=%s\n' "$asset_id"
          printf 'P07_143_TRIAL_ASSET_SHA256=%s\n' "$original_sha"
          echo P07_143_TRIAL_ASSET_REMOTE_VERIFIED=PASS
      - name: Root no-Git installer test preserving stable115
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          work="$RUNNER_TEMP/p07-143-owner"
          sudo install -d -m 755 /opt/vf-server-ops
          printf '%s\n' 0.1.0-release115 | sudo tee /opt/vf-server-ops/BUILD_ID >/dev/null
          test -s "$work/verified-url"
          grep -Fq "releases/assets/730894026" installers/p07-owner-test143.sh
          grep -Fq "d0e9ae98afd80be0f9421e16cbf40680b21baa73c8a73afee1ece9fe19c77c66" installers/p07-owner-test143.sh
          sudo bash installers/p07-owner-test143.sh > "$work/root-install.log"
          grep -Fxq P07_OWNER143_TEST_INSTALL=PASS "$work/root-install.log"
          test "$(sudo env NO_COLOR=1 /usr/local/bin/vfops-rc143 --build-id)" = 0.1.0-release143
          test "$(cat /opt/vf-server-ops/BUILD_ID)" = 0.1.0-release115
          echo P07_143_ANONYMOUS_NO_GIT_ROOT_INSTALL=PASS
          echo P07_143_OWNER_MIGRATION_AUTORUN=NO
          echo P07_143_OWNER_DNS_CHANGED=NO
      - name: Cleanup transient private checkout and package
        if: always()
        shell: bash
        run: |
          rm -rf -- product public-base "$RUNNER_TEMP/p07-143-owner"
          echo P07_143_PRIVATE_CHECKOUT_RETAINED=NO
