name: P07 Public Authority candidate package proof (temporary)
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/p07-public-authority-candidate-proof.yml]

permissions:
  contents: read

jobs:
  source-bound-p07-package:
    if: >-
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'maintenance/p07-public-authority-candidate-proof-20261112'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      P07_EXACT_SHA: 36690b0daf6b94a04a6d28426352ba83a5db222c
      GOV_EXACT_SHA: 3c08fdd80063d5e3eab4409d9d6934b1f4c11761
    steps:
      - name: Checkout exact GOV-DOC source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: ${{ env.GOV_EXACT_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov

      - name: Checkout exact P07 project source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: ${{ env.P07_EXACT_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p07

      - name: Checkout published public toolbox source read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: main
          persist-credentials: false
          path: public

      - name: Check exact sources and P07 focused unit regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C gov rev-parse HEAD)" = "$GOV_EXACT_SHA"
          test "$(git -C p07 rev-parse HEAD)" = "$P07_EXACT_SHA"
          test -z "$(git -C p07 status --porcelain --untracked-files=all)"
          echo P07_GOV_EXACT_SOURCE_IDENTITY=PASS
          if (cd p07 && PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover \
              -s tests -p test_p07_public_authority_candidate_gate.py -v) \
              > "$RUNNER_TEMP/p07-authority-tests.log" 2>&1; then
            grep -E '^(Ran [0-9]+ tests|OK)$' "$RUNNER_TEMP/p07-authority-tests.log" || true
            echo P07_GOV_CANDIDATE_HOOK_TESTS=PASS
          else
            echo P07_GOV_CANDIDATE_HOOK_TESTS=FAIL
            exit 1
          fi
          if (cd p07 && PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest \
              tests.test_p07_bundle_identity -v) \
              > "$RUNNER_TEMP/p07-bundle-regression.log" 2>&1; then
            grep -E '^(Ran [0-9]+ tests|OK)$' "$RUNNER_TEMP/p07-bundle-regression.log" || true
            echo P07_EXISTING_BUNDLE_REGRESSIONS=PASS
          else
            echo P07_EXISTING_BUNDLE_REGRESSIONS=FAIL
            exit 1
          fi

      - name: Real candidate stage with exact shared preflight and toolbox checksum
        shell: bash
        run: |
          set -Eeuo pipefail
          if python3 -B p07/scripts/p07_candidate_bundle.py \
             --product-root p07 --public-root public \
             --output "$RUNNER_TEMP/p07-candidate" \
             --product-sha "$P07_EXACT_SHA" \
             --build 0.1.0-release143 --care 0.1.0-rc83 \
             --governance-root gov \
             > "$RUNNER_TEMP/p07-candidate-build.log" 2>&1; then
            grep -E '^P07_PUBLIC_AUTHORITY_(RESOLVE|DELIVERY)=PASS$' "$RUNNER_TEMP/p07-candidate-build.log"
            grep -q '^P07_CANDIDATE_BUNDLE=PASS$' "$RUNNER_TEMP/p07-candidate-build.log"
            test -s "$RUNNER_TEMP/p07-candidate/installers/p07-toolbox.sh"
            echo P07_REAL_CANDIDATE_STRUCTURAL_GATE=PASS
          else
            echo P07_REAL_CANDIDATE_STRUCTURAL_GATE=NOT_PROVEN
            echo P07_REAL_CANDIDATE_STAGING=BLOCKED
            exit 1
          fi
          echo P07_FORMAL_RELEASE=NO
          echo P07_PRODUCTION_MIGRATION=NO

      - name: Delete transient private source and artifacts
        if: always()
        shell: bash
        run: |
          rm -rf gov p07 public "$RUNNER_TEMP/p07-candidate"
          rm -f "$RUNNER_TEMP/p07-authority-tests.log" \
                "$RUNNER_TEMP/p07-bundle-regression.log" \
                "$RUNNER_TEMP/p07-candidate-build.log"
          echo P07_TRANSIENT_SOURCE_CLEANUP=ATTEMPTED
