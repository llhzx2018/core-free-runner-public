name: P01 V2.35.1 Publication
on:
  push:
    branches: [release/p01-v2350-orchestrator-20260831]
    paths: [.github/workflows/p01-v2350-publication-20260831.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FORMAL_SOURCE: eb36fd19d269aed4ef4246c2c18f172b2c761bde
      PROMOTED_SOURCE: b48b1071b5b56d37d35e97b61e13d055a3d2c852
      FORMAL_TREE: 00aca451804db5ebf9260d8101dfe829789c4f24
      RUNTIME_TREE: 3cdfa02d8c19ae5e771b7d4abff69a670ac4396c
      FORMAL_ARTIFACT_ID: '9740268918'
      FORMAL_ARTIFACT_DIGEST: a51e413ada654307256bde4995dfea543c383e1b0e5989b0b9845db333a33ab0
      FULL_SHA: 7e6798dda14bbed004ae55c7679a2a6b6f6550b332ca9fdbf0c5d20984598e2a
      UPDATE_SHA: e6e40b77d75319f24ea4e0e803863a1b5ffffcdf2f3405d62dc9399cbc7114af
      REPAIR_SHA: ebe417aa7edb830d7a248faf7a88a5664e17aa9e7d47b529bd6b463499704342
    steps:
      - name: Publication precheck
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/vf-start/branches/main --jq .commit.sha)" = "$PROMOTED_SOURCE"
          test "$(gh api repos/llhzx2018/vf-start/branches/develop --jq .commit.sha)" = "$PROMOTED_SOURCE"
          test "$(gh api 'repos/llhzx2018/vf-start/contents/VERSION?ref=main' --jq .content | tr -d '\n' | base64 -d | tr -d '\r\n')" = 2.35.1
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33340105433 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33340185389 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33340313941 --jq .conclusion)" = success
          if gh api repos/llhzx2018/vf-start/git/ref/tags/v2.35.1 >/dev/null 2>&1; then echo 'v2.35.1 tag already exists'; exit 2; fi
          if gh api repos/llhzx2018/vf-start/releases/tags/v2.35.1 >/dev/null 2>&1; then echo 'v2.35.1 release already exists'; exit 3; fi
          echo P01_V2351_PUBLICATION_PRECHECK=PASS
      - name: Fetch exact PASS artifact
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-v2351-publish /tmp/p01-v2351-artifact.zip; mkdir -p /tmp/p01-v2351-publish
          gh api --method GET "repos/llhzx2018/core-free-runner-public/actions/artifacts/$FORMAL_ARTIFACT_ID/zip" > /tmp/p01-v2351-artifact.zip
          test "$(sha256sum /tmp/p01-v2351-artifact.zip | awk '{print $1}')" = "$FORMAL_ARTIFACT_DIGEST"
          unzip -q /tmp/p01-v2351-artifact.zip -d /tmp/p01-v2351-publish
          cd /tmp/p01-v2351-publish
          test "$(find . -maxdepth 1 -type f | wc -l)" = 8
          sha256sum -c SHA256SUMS.txt
          jq -e --arg source "$FORMAL_SOURCE" --arg tree "$FORMAL_TREE" --arg runtime "$RUNTIME_TREE" '.formal_artifact_gate=="PASS" and .release_source==$source and .release_tree==$tree and .runtime_tree==$runtime and .source_version=="2.35.0" and .version=="2.35.1" and .schema=="2026082901" and .schema_change==false and .owner_production_write==false' P01-V2.35.1-FORMAL-METADATA.json >/dev/null
          test "$(sha256sum VF-Start-V2.35.1-FULL.zip | awk '{print $1}')" = "$FULL_SHA"
          test "$(sha256sum VF_Start_V2.35.1_UPDATE.zip | awk '{print $1}')" = "$UPDATE_SHA"
          test "$(sha256sum VF-Start-V2.35.1-UPDATE.zip | awk '{print $1}')" = "$UPDATE_SHA"
          test "$(sha256sum repair-v2.35.1.php | awk '{print $1}')" = "$REPAIR_SHA"
          stat -c '%n %s' VF-Start-V2.35.1-FULL.zip VF_Start_V2.35.1_UPDATE.zip repair-v2.35.1.php | tee /tmp/p01-v2351-asset-sizes.txt
          printf 'FULL_SHA=%s\nUPDATE_SHA=%s\nREPAIR_SHA=%s\n' "$FULL_SHA" "$UPDATE_SHA" "$REPAIR_SHA" | tee /tmp/p01-v2351-publish-sha.env
          echo P01_V2351_EXACT_PASS_ARTIFACT=PASS
      - name: Create immutable tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          . /tmp/p01-v2351-publish-sha.env
          gh api --method POST repos/llhzx2018/vf-start/git/refs -f ref=refs/tags/v2.35.1 -f sha="$FORMAL_SOURCE" >/tmp/p01-v2351-tag.json
          test "$(jq -r .object.sha /tmp/p01-v2351-tag.json)" = "$FORMAL_SOURCE"
          cat >/tmp/p01-v2351-notes.md <<'EOF'
          VF Start V2.35.1 是 V2.35.0 之后的 UX Patch Release。

          - Topic 无真实封面时使用明确的专题身份 fallback，真实封面保持不变。
          - Watch 无真实海报时使用紧凑影视身份 fallback，真实 poster 路径保持不变。
          - 390px Home 在 Recent=0 时压缩空态，让收藏内容更早进入首屏；Recent 非空与桌面结构保持不变。
          - Home 复用现有网址健康 Authority：存在待处理/待人工确认状态时，首卡和右 Rail 优先显示网址健康；清零时恢复归属建议。
          - Schema 保持 2026082901，无 Migration。
          - Candidate Readiness 33339734236、Formal Artifact 33340105433、Strict Fresh 33340185389、Main Promotion 33340313941 均 PASS。
          - 正式 UPDATE 支持 V2.35.0 → V2.35.1 Atomic Upgrade。Owner Production 不在 Publication 步骤自动写入。
          EOF
          cd /tmp/p01-v2351-publish
          gh release create v2.35.1 P01-V2.35.1-ARTIFACT-GATE.json P01-V2.35.1-FORMAL-METADATA.json SHA256SUMS.txt VF-Start-V2.35.1-FULL.zip VF-Start-V2.35.1-UPDATE.zip VF_Start_V2.35.1_UPDATE.zip atomic-self-test.json repair-v2.35.1.php --repo llhzx2018/vf-start --title 'VF Start V2.35.1' --notes-file /tmp/p01-v2351-notes.md --verify-tag
          gh api repos/llhzx2018/vf-start/releases/tags/v2.35.1 > /tmp/p01-v2351-release.json
          test "$(jq -r .tag_name /tmp/p01-v2351-release.json)" = v2.35.1
          test "$(jq -r .draft /tmp/p01-v2351-release.json)" = false
          test "$(jq -r .prerelease /tmp/p01-v2351-release.json)" = false
          test "$(jq '.assets|length' /tmp/p01-v2351-release.json)" = 8
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.35.1_UPDATE.zip")|.digest' /tmp/p01-v2351-release.json)" = "sha256:${UPDATE_SHA}"
          test "$(jq -r '.assets[]|select(.name=="VF-Start-V2.35.1-UPDATE.zip")|.digest' /tmp/p01-v2351-release.json)" = "sha256:${UPDATE_SHA}"
          test "$(jq -r '.assets[]|select(.name=="VF-Start-V2.35.1-FULL.zip")|.digest' /tmp/p01-v2351-release.json)" = "sha256:${FULL_SHA}"
          test "$(jq -r '.assets[]|select(.name=="repair-v2.35.1.php")|.digest' /tmp/p01-v2351-release.json)" = "sha256:${REPAIR_SHA}"
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.35.1 --jq .object.sha)" = "$FORMAL_SOURCE"
          jq -r '.id, (.assets[] | [.name,.size,.digest] | @tsv)' /tmp/p01-v2351-release.json | tee /tmp/p01-v2351-publication-readback.txt
          echo P01_V2351_TAG_REMOTE_READBACK=PASS
          echo P01_V2351_GITHUB_RELEASE=PASS
          echo CORE_UPDATES_WRITE=NO
          echo OWNER_PRODUCTION_WRITE=NO
      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2351-publication-${{ github.run_id }}
          path: |
            /tmp/p01-v2351-tag.json
            /tmp/p01-v2351-release.json
            /tmp/p01-v2351-asset-sizes.txt
            /tmp/p01-v2351-publish-sha.env
            /tmp/p01-v2351-publication-readback.txt
          if-no-files-found: warn
          retention-days: 90
