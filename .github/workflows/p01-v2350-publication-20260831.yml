name: P01 V2.35.0 Publication
on:
  push:
    branches: [release/p01-v2350-orchestrator-20260831]
    paths: [.github/workflows/p01-v2350-publication-20260831.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Publication precheck
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/vf-start/branches/main --jq .commit.sha)" = d20f8e964455c7238b66c6ff6ab2e7d732d315e2
          test "$(gh api repos/llhzx2018/vf-start/branches/develop --jq .commit.sha)" = d20f8e964455c7238b66c6ff6ab2e7d732d315e2
          test "$(gh api 'repos/llhzx2018/vf-start/contents/VERSION?ref=main' --jq .content | tr -d '\n' | base64 -d | tr -d '\r\n')" = 2.35.0
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33332314263 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33332398277 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33332677330 --jq .conclusion)" = success
          if gh api repos/llhzx2018/vf-start/git/ref/tags/v2.35.0 >/dev/null 2>&1; then echo 'v2.35.0 tag already exists'; exit 2; fi
          if gh api repos/llhzx2018/vf-start/releases/tags/v2.35.0 >/dev/null 2>&1; then echo 'v2.35.0 release already exists'; exit 3; fi
          echo P01_V2350_PUBLICATION_PRECHECK=PASS
      - name: Fetch exact PASS artifact
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-v2350-publish /tmp/p01-v2350-artifact.zip
          mkdir -p /tmp/p01-v2350-publish
          gh api --method GET repos/llhzx2018/core-free-runner-public/actions/artifacts/9737997420/zip > /tmp/p01-v2350-artifact.zip
          test "$(sha256sum /tmp/p01-v2350-artifact.zip | awk '{print $1}')" = e3443b99e6105b237a8a6195a0bf677c6329d4aa7e54add7adf26c2e500ac691
          unzip -q /tmp/p01-v2350-artifact.zip -d /tmp/p01-v2350-publish
          cd /tmp/p01-v2350-publish
          test "$(find . -maxdepth 1 -type f | wc -l)" = 8
          sha256sum -c SHA256SUMS.txt
          jq -e '.formal_artifact_gate=="PASS" and .release_source=="d20f8e964455c7238b66c6ff6ab2e7d732d315e2" and .release_tree=="1d9c8a11f1e8ddb7bb775b28592459f754c2c59b" and .runtime_tree=="24953b64762b2d17076e4149a2aa49a492316477" and .source_version=="2.34.0" and .schema=="2026082901" and .schema_change==false and .owner_production_write==false' P01-V2.35.0-FORMAL-METADATA.json >/dev/null
          FULL_SHA=$(jq -r .full.sha256 P01-V2.35.0-FORMAL-METADATA.json)
          UPDATE_SHA=$(jq -r .update.sha256 P01-V2.35.0-FORMAL-METADATA.json)
          REPAIR_SHA=$(jq -r .repair.sha256 P01-V2.35.0-FORMAL-METADATA.json)
          test "$(sha256sum VF-Start-V2.35.0-FULL.zip | awk '{print $1}')" = "$FULL_SHA"
          test "$(sha256sum VF_Start_V2.35.0_UPDATE.zip | awk '{print $1}')" = "$UPDATE_SHA"
          test "$(sha256sum VF-Start-V2.35.0-UPDATE.zip | awk '{print $1}')" = "$UPDATE_SHA"
          test "$(sha256sum repair-v2.35.0.php | awk '{print $1}')" = "$REPAIR_SHA"
          stat -c '%n %s' VF-Start-V2.35.0-FULL.zip VF_Start_V2.35.0_UPDATE.zip repair-v2.35.0.php | tee /tmp/p01-v2350-asset-sizes.txt
          printf 'FULL_SHA=%s\nUPDATE_SHA=%s\nREPAIR_SHA=%s\n' "$FULL_SHA" "$UPDATE_SHA" "$REPAIR_SHA" | tee /tmp/p01-v2350-publish-sha.env
          echo P01_V2350_EXACT_PASS_ARTIFACT=PASS
      - name: Create immutable tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          . /tmp/p01-v2350-publish-sha.env
          gh api --method POST repos/llhzx2018/vf-start/git/refs -f ref=refs/tags/v2.35.0 -f sha=d20f8e964455c7238b66c6ff6ab2e7d732d315e2 >/tmp/p01-v2350-tag.json
          test "$(jq -r .object.sha /tmp/p01-v2350-tag.json)" = d20f8e964455c7238b66c6ff6ab2e7d732d315e2
          cat >/tmp/p01-v2350-notes.md <<'EOF'
          VF Start V2.35.0 完成五域 UX/UI 一致性与交互收口。

          - Home / 全局导航层级进一步统一，资源域切换更清楚。
          - Add / Edit Drawer、Sidebar 与中宽度布局完成产品化收口。
          - Toast、空状态与 Private protected state 语义统一，不再把“私人”误呈现为警告/错误状态。
          - Watch Dark 状态、Topics Dark token authority、移动命令区与桌面批量工具条完成一致性修正。
          - Schema 保持 2026082901，无 Migration。
          - 已通过 Candidate Readiness、Final Visual Sweep、Formal Artifact、Strict Fresh Install 与 Main Promotion Gate。
          - 支持从 V2.34.0 Atomic 升级；GitHub Release 发布后再执行公共在线更新通道 Gate，Owner Production 不在本步骤自动写入。
          EOF
          cd /tmp/p01-v2350-publish
          gh release create v2.35.0 \
            P01-V2.35.0-ARTIFACT-GATE.json \
            P01-V2.35.0-FORMAL-METADATA.json \
            SHA256SUMS.txt \
            VF-Start-V2.35.0-FULL.zip \
            VF-Start-V2.35.0-UPDATE.zip \
            VF_Start_V2.35.0_UPDATE.zip \
            atomic-self-test.json \
            repair-v2.35.0.php \
            --repo llhzx2018/vf-start --title 'VF Start V2.35.0' --notes-file /tmp/p01-v2350-notes.md --verify-tag
          gh api repos/llhzx2018/vf-start/releases/tags/v2.35.0 > /tmp/p01-v2350-release.json
          test "$(jq -r .tag_name /tmp/p01-v2350-release.json)" = v2.35.0
          test "$(jq -r .target_commitish /tmp/p01-v2350-release.json)" = main || true
          test "$(jq -r .draft /tmp/p01-v2350-release.json)" = false
          test "$(jq -r .prerelease /tmp/p01-v2350-release.json)" = false
          test "$(jq '.assets|length' /tmp/p01-v2350-release.json)" = 8
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.35.0_UPDATE.zip")|.digest' /tmp/p01-v2350-release.json)" = "sha256:${UPDATE_SHA}"
          test "$(jq -r '.assets[]|select(.name=="VF-Start-V2.35.0-UPDATE.zip")|.digest' /tmp/p01-v2350-release.json)" = "sha256:${UPDATE_SHA}"
          test "$(jq -r '.assets[]|select(.name=="VF-Start-V2.35.0-FULL.zip")|.digest' /tmp/p01-v2350-release.json)" = "sha256:${FULL_SHA}"
          test "$(jq -r '.assets[]|select(.name=="repair-v2.35.0.php")|.digest' /tmp/p01-v2350-release.json)" = "sha256:${REPAIR_SHA}"
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.35.0 --jq .object.sha)" = d20f8e964455c7238b66c6ff6ab2e7d732d315e2
          jq -r '.id, (.assets[] | [.name,.size,.digest] | @tsv)' /tmp/p01-v2350-release.json | tee /tmp/p01-v2350-publication-readback.txt
          echo P01_V2350_TAG_REMOTE_READBACK=PASS
          echo P01_V2350_GITHUB_RELEASE=PASS
          echo CORE_UPDATES_WRITE=NO
          echo OWNER_PRODUCTION_WRITE=NO
      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-v2350-publication-${{ github.run_id }}
          path: |
            /tmp/p01-v2350-tag.json
            /tmp/p01-v2350-release.json
            /tmp/p01-v2350-asset-sizes.txt
            /tmp/p01-v2350-publish-sha.env
            /tmp/p01-v2350-publication-readback.txt
          if-no-files-found: warn
          retention-days: 90
