name: P01 V2.37.0 Release Publish R3
on:
  push:
    branches: [release/p01-v2365-candidate-20260902]
    paths: [.github/workflows/p01-v2370-release-publish-r3-20260902.yml]
permissions:
  actions: read
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      FORMAL: 5172a497f7a2c9065880ae0d1257a15469917621
      FORMAL_TREE: eac2a8c76c49925bffbca9c23314ef90aec6f3bd
      FORMAL_RUNTIME_TREE: 057fbba8822950f163aa322d99b889ed3ab24842
      TAG: v2.37.0
      FORMAL_GATE: '33567419784'
      STRICT_FRESH_GATE: '33567802392'
      ARTIFACT_ID: '9823658330'
      ARTIFACT_DIGEST: 95f73a536461b6eeac28616ac8072d7433f194c6cb12c5b1a8d2e641629d6738
      FULL_BYTES: '601163'
      FULL_SHA: 0a7e74750fa22a68ec26a0a4e14e7852e8ad2bb5514ba8c262c804d40eda609b
      UPDATE_BYTES: '1270761'
      UPDATE_SHA: c416486d5ea1d68b87c1bdfebcc7de42729f1ff7655e3ded49ebd5a88d1e3b29
      REPAIR_BYTES: '3689853'
      REPAIR_SHA: 085c205c32ba0c4b4e0d2153f808964f4c301c123baec85ec0a9f11870c04154
    steps:
      - name: Verify immutable Runner gates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$FORMAL_GATE --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$STRICT_FRESH_GATE --jq .conclusion)" = success
          printf 'FORMAL_ARTIFACT_GATE=%s/PASS\nSTRICT_FRESH=%s/PASS\n' "$FORMAL_GATE" "$STRICT_FRESH_GATE" > /tmp/p01-v2370-runner-gates.txt
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: main
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Fresh product identity using Git transport
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$FORMAL"
          test "$(git -C product rev-parse HEAD^{tree})" = "$FORMAL_TREE"
          test "$(git -C product rev-parse HEAD:src)" = "$FORMAL_RUNTIME_TREE"
          test -z "$(git -C product ls-remote --tags origin refs/tags/$TAG)"
          printf 'MAIN=%s\nFORMAL_TREE=%s\nRUNTIME_TREE=%s\nTAG_BEFORE=ABSENT\n' "$FORMAL" "$FORMAL_TREE" "$FORMAL_RUNTIME_TREE" | tee /tmp/p01-v2370-promotion-readback.txt
      - name: Download exact frozen Formal Artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/frozen; mkdir -p /tmp/frozen
          meta=$(gh api repos/llhzx2018/core-free-runner-public/actions/artifacts/$ARTIFACT_ID)
          test "$(jq -r .digest <<<"$meta")" = "sha256:$ARTIFACT_DIGEST"
          test "$(jq -r .expired <<<"$meta")" = false
          curl --fail --silent --show-error --location -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/artifacts/$ARTIFACT_ID/zip" -o /tmp/formal-artifact.zip
          test "$(sha256sum /tmp/formal-artifact.zip|awk '{print $1}')" = "$ARTIFACT_DIGEST"
          unzip -qq /tmp/formal-artifact.zip -d /tmp/frozen
          FULL=$(find /tmp/frozen -type f -name 'VF-Start-V2.37.0-FULL.zip' -print -quit); test -n "$FULL"
          d=$(dirname "$FULL"); echo "$d" > /tmp/p01-v2370-art-dir
          (cd "$d" && sha256sum -c SHA256SUMS.txt)
          expected=(atomic-self-test.json P01-V2.37.0-ARTIFACT-GATE.json P01-V2.37.0-FORMAL-METADATA.json repair-v2.37.0.php SHA256SUMS.txt VF-Start-V2.37.0-FULL.zip VF-Start-V2.37.0-UPDATE.zip VF_Start_V2.37.0_UPDATE.zip)
          for f in "${expected[@]}"; do test -f "$d/$f"; done
          test "$(stat -c%s "$d/VF-Start-V2.37.0-FULL.zip")" = "$FULL_BYTES"; test "$(sha256sum "$d/VF-Start-V2.37.0-FULL.zip"|awk '{print $1}')" = "$FULL_SHA"
          for f in VF-Start-V2.37.0-UPDATE.zip VF_Start_V2.37.0_UPDATE.zip; do test "$(stat -c%s "$d/$f")" = "$UPDATE_BYTES"; test "$(sha256sum "$d/$f"|awk '{print $1}')" = "$UPDATE_SHA"; done
          test "$(stat -c%s "$d/repair-v2.37.0.php")" = "$REPAIR_BYTES"; test "$(sha256sum "$d/repair-v2.37.0.php"|awk '{print $1}')" = "$REPAIR_SHA"
      - name: Create exact tag and draft release
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api --method POST repos/$PRODUCT_REPO/git/refs -f ref="refs/tags/$TAG" -f sha="$FORMAL" >/tmp/tag-create.json
          for i in $(seq 1 20); do tag_sha=$(git -C product ls-remote --tags origin refs/tags/$TAG | awk '{print $1}'); test -n "$tag_sha" && break; sleep 1; done
          test "$tag_sha" = "$FORMAL"
          cat >/tmp/release-notes.md <<'EOF'
          V2.37.0 是 VF Start 的 Personal Internet Journey 产品收束版本，把分散能力连接成一条普通用户可以持续使用的主链。

          - 浏览器书签导入成为首次使用主路径：导入优先、预览确认。
          - 全局 Personal Search 支持 Ctrl/Cmd+K、相关性排序、Google fallback、URL 零结果直接保存。
          - Browser Helper 1.6.5 收敛安装、连接、失效重连和待整理入口。
          - 网址健康与重复网址统一为健康中心入口。
          - 首页增加数据安全状态与最多 6 条最近使用。
          - 导航新增改为 URL-first；删除后提供 30 秒页面内撤销。
          - 待整理以 is_pending 为准，并提供只建议、不自动移动的现有分类建议。
          - 新增 quick-save.php 手机快速收藏入口，始终进入私人待整理。

          Wave 1–13 Product Gate、Personal Internet Journey、V2.36.5 → V2.37.0 Atomic、Fresh Install、Strict Fresh Formal 全部 PASS。Schema 保持 2026082901，无 Migration。

          本 Release 直接发布冻结 Formal Artifact 原字节，没有重新构建。
          EOF
          gh release create "$TAG" --repo "$PRODUCT_REPO" --verify-tag --draft --title "VF Start V2.37.0" --notes-file /tmp/release-notes.md
      - name: Upload frozen eight release assets
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          d=$(cat /tmp/p01-v2370-art-dir)
          gh release upload "$TAG" --repo "$PRODUCT_REPO" "$d/atomic-self-test.json" "$d/P01-V2.37.0-ARTIFACT-GATE.json" "$d/P01-V2.37.0-FORMAL-METADATA.json" "$d/repair-v2.37.0.php" "$d/SHA256SUMS.txt" "$d/VF-Start-V2.37.0-FULL.zip" "$d/VF-Start-V2.37.0-UPDATE.zip" "$d/VF_Start_V2.37.0_UPDATE.zip"
      - name: Release byte readback and stable publication
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/release-readback; mkdir -p /tmp/release-readback
          gh release download "$TAG" --repo "$PRODUCT_REPO" --dir /tmp/release-readback
          d=/tmp/release-readback
          test "$(sha256sum "$d/VF-Start-V2.37.0-FULL.zip"|awk '{print $1}')" = "$FULL_SHA"; test "$(stat -c%s "$d/VF-Start-V2.37.0-FULL.zip")" = "$FULL_BYTES"
          for f in VF-Start-V2.37.0-UPDATE.zip VF_Start_V2.37.0_UPDATE.zip; do test "$(sha256sum "$d/$f"|awk '{print $1}')" = "$UPDATE_SHA"; test "$(stat -c%s "$d/$f")" = "$UPDATE_BYTES"; done
          test "$(sha256sum "$d/repair-v2.37.0.php"|awk '{print $1}')" = "$REPAIR_SHA"; test "$(stat -c%s "$d/repair-v2.37.0.php")" = "$REPAIR_BYTES"
          (cd "$d" && sha256sum -c SHA256SUMS.txt)
          gh release edit "$TAG" --repo "$PRODUCT_REPO" --draft=false --prerelease=false --latest
          gh release view "$TAG" --repo "$PRODUCT_REPO" --json isDraft,isPrerelease,assets --jq 'select(.isDraft==false and .isPrerelease==false and (.assets|length)==8)' >/tmp/release-view.json
          test "$(git -C product ls-remote --tags origin refs/tags/$TAG | awk '{print $1}')" = "$FORMAL"
          printf 'P01_V2370_RELEASE_PUBLISH_R3=PASS\nTAG=%s\nFORMAL=%s\nFULL_BYTES=%s\nFULL_SHA=%s\nUPDATE_BYTES=%s\nUPDATE_SHA=%s\nREPAIR_BYTES=%s\nREPAIR_SHA=%s\nASSETS=8\nR1_R2=HARNESS_ONLY\nOWNER_PRODUCTION_WRITE=NO\n' "$TAG" "$FORMAL" "$FULL_BYTES" "$FULL_SHA" "$UPDATE_BYTES" "$UPDATE_SHA" "$REPAIR_BYTES" "$REPAIR_SHA" | tee /tmp/p01-v2370-release-verdict.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-v2370-release-publish-r3-${{ github.run_id }}
          path: |
            /tmp/p01-v2370-runner-gates.txt
            /tmp/p01-v2370-promotion-readback.txt
            /tmp/p01-v2370-release-verdict.txt
          if-no-files-found: warn
          retention-days: 90
