name: S01 Theme211 current-main integration proof
on:
  push:
    branches: [task/s01-theme211-player-20261027]
    paths: ['.github/workflows/s01-theme211-player-20261027-integration.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.211
  TARGET_SHA: d237a46a62cdb36cae01f714dd60350814c22ac4
  TARGET_TREE: 34964ecba71b42ec38c1990db5e387504992ecdf
  BASE_SHA: ac47490a8cf42b0d42f8ccf5ee8f748bbc8e89cc
  LANE_ID: s01-theme211-player-20261027
jobs:
  integrated:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: d237a46a62cdb36cae01f714dd60350814c22ac4
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact identity and existing runtime proof
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-theme211-player-20261027/integration-spec.json --input control/.github/workflows/s01-theme211-player-20261027-integration.yml
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40531849420 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40531849420 --jq .head_sha)" = e73ef4d89e565fbe1ed19d0f54bb4a67fa862e2c
          test "$(git -C target rev-parse HEAD:src)" = c8676d3c7fc605555f698f7f402915ab48486a77
          test "$(gh api repos/$TARGET_REPO/git/trees/61b142fcc762cf57d2769d77b9451cd517527940 --jq '.tree[]|select(.path=="src")|.sha')" = c8676d3c7fc605555f698f7f402915ab48486a77
          mkdir -p proof provider runtime-proof
          gh run download 40531849420 --repo llhzx2018/core-free-runner-public --name s01-home-40531849420 --dir runtime-proof
          cp -a runtime-proof/. proof/
          mv proof/package.json proof/runtime-tested-package.json
          python3 control/lanes/s01-theme211-player-20261027/package.py
          php -l target/tests/frontend-pages-wordpress-check.php
          php -l target/tests/frontend-progress-history-projection.php
          php target/tests/frontend-progress-history-projection.php > proof/upstream-history-projection.json
          python3 - <<'PYVERIFY'
          import pathlib,json,subprocess
          r=pathlib.Path('proof');old=json.loads((r/'runtime-tested-package.json').read_text());new=json.loads((r/'package.json').read_text())
          assert old['source']=='61b142fcc762cf57d2769d77b9451cd517527940' and old['tree']=='8552a238b2394bec1d8dfae6d262fea0d8fe9d95'
          for k in ['version','sha256','bytes','files']:assert old[k]==new[k],k
          assert new['source']=='d237a46a62cdb36cae01f714dd60350814c22ac4' and new['tree']=='34964ecba71b42ec38c1990db5e387504992ecdf'
          changed=subprocess.check_output(['git','-C','target','diff','--name-only','adfe34a08c2ec2a541da3cf5f77248b6a40d1bdf','ac47490a8cf42b0d42f8ccf5ee8f748bbc8e89cc']).decode().splitlines()
          assert set(changed)=={'tests/frontend-pages-wordpress-check.php','tests/frontend-progress-history-projection.php'}
          for name in ['hero-parity.json','clean-install.json','bootstrap.json','native-lifecycle.json','progress-navigation.json']:
              assert json.loads((r/name).read_text())['status']=='PASS'
          assert (r/'state-before.sha256').read_bytes()==(r/'state-after.sha256').read_bytes()
          assert (r/'contracts-before.json').read_bytes()==(r/'contracts-after.json').read_bytes()
          assert json.loads((r/'after-results.json').read_text())['status']=='PASS'
          assert len(json.loads((r/'after-results.json').read_text())['rows'])==6
          assert json.loads((r/'upstream-history-projection.json').read_text())['status']=='PASS'
          (r/'integration.json').write_text(json.dumps({'status':'PASS','source':'d237a46a62cdb36cae01f714dd60350814c22ac4','tree':'34964ecba71b42ec38c1990db5e387504992ecdf','runtime_source':'61b142fcc762cf57d2769d77b9451cd517527940','runtime_src_tree':'c8676d3c7fc605555f698f7f402915ab48486a77','runtime_run':'40531849420','runtime_proof':'EXACT_SRC_TREE_AND_PACKAGE_BYTE_IDENTICAL','upstream_delta':'TWO_TEST_FILES_ONLY','production':'UNTOUCHED'},indent=2))
          print('CURRENT_MAIN_INTEGRATION_EXACT_RUNTIME_PACKAGE_AND_UPSTREAM_TEST_PASS')
          PYVERIFY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-home-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private source
        if: always()
        run: rm -rf target provider runtime-proof
