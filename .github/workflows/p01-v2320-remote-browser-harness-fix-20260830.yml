name: P01 V2.32 Remote Browser Harness Fix
on:
  push:
    branches: [task/p01-v2320-formal-release-20260830]
    paths: [.github/workflows/p01-v2320-remote-browser-harness-fix-20260830.yml]
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout runner branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: task/p01-v2320-formal-release-20260830
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
      - name: Move private visibility assertion to All Resources
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/p01-v2320-remote-final.sh')
          s=p.read_text(encoding='utf-8')
          old1="  if(!body.includes('V232私人导航资源 1'))throw new Error(label+' owner private missing');\n"
          old2="  if(!(await p.locator('body').innerText()).includes('全部资源'))throw new Error(label+' all resources missing');\n"
          new2="  const allBody=await p.locator('body').innerText();\n  if(!allBody.includes('全部资源'))throw new Error(label+' all resources missing');\n  if(!allBody.includes('V232私人导航资源 1'))throw new Error(label+' owner private missing in all resources');\n"
          if s.count(old1)!=1 or s.count(old2)!=1:
              raise SystemExit('browser harness anchors do not match exactly')
          s=s.replace(old1,'',1).replace(old2,new2,1)
          p.write_text(s,encoding='utf-8',newline='\n')
          PY
          git diff --check
          test "$(git diff --name-only)" = scripts/p01-v2320-remote-final.sh
          git diff -- scripts/p01-v2320-remote-final.sh | tee /tmp/browser-harness-fix.diff
          grep -F "owner private missing in all resources" scripts/p01-v2320-remote-final.sh >/dev/null
          if grep -F "owner private missing');" scripts/p01-v2320-remote-final.sh >/dev/null; then exit 1; fi
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add scripts/p01-v2320-remote-final.sh
          git commit -m 'test(P01): align remote Home private visibility assertion'
          git push origin HEAD:task/p01-v2320-formal-release-20260830
          echo P01_V2320_REMOTE_BROWSER_HARNESS_FIX=PASS
          echo PRODUCT_CHANGE=NO
          echo RELEASE_CHANGE=NO
          echo CORE_UPDATES_CHANGE=NO
          echo OWNER_PRODUCTION_WRITE=NO
