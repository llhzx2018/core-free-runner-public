name: P06 V0.1.15 Production Authority Closure Build

on:
  push:
    paths:
      - '.github/workflows/p06-v0115-human-ui-build-20260828.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BRANCH: governance/p06-v0115-production-closure-20260828
      BASE_MAIN: fab724702e519cf3003107f450a8437b1d9313a3
    steps:
      - uses: actions/checkout@v4
      - name: Checkout P06 production closure branch
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-press
          ref: ${{ env.BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
          path: p06
      - name: Apply authenticated Production truth
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p06 rev-parse HEAD)" = "$BASE_MAIN"
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('p06/VF_PROJECT.json')
          p=json.loads(path.read_text(encoding='utf-8'))
          assert p['version']=='0.1.15'
          assert p['schema']==3
          assert p['lifecycle']=='RELEASE_CURRENT_PRODUCTION_PENDING_OWNER_UPDATE'
          assert p['production_update_state']['observed_runtime_version']=='0.1.12'
          p['lifecycle']='PRODUCTION_CURRENT'
          p['release_gates']['production_update_v0_1_15']='PASS_OWNER_AUTHENTICATED_RUNTIME_SCREENSHOT_2026_08_28'
          p['release_evidence']['production_write']='OWNER_COMPLETED_OUTSIDE_GIT'
          s=p['production_update_state']
          s['observed_runtime_version']='0.1.15'
          s['observed_runtime_evidence']='OWNER_AUTHENTICATED_RUNTIME_SCREENSHOT_2026_08_28'
          s['observed_schema']=3
          s['target_version']='0.1.15'
          s['production_update']='PASS_OWNER_AUTHENTICATED_RUNTIME_SCREENSHOT_2026_08_28'
          s['owner_ui_observation']='PRODUCTION_V0_1_15_SCHEMA_3_UPDATE_CREDENTIAL_CONFIGURED_CHECK_STATUS_LATEST'
          s['latest_version_observed']='0.1.15'
          s['check_status_observed']='已是最新'
          s['update_credential_observed']='已配置'
          s['upgrade_history_observed']='NOT_PROVEN_IN_CURRENT_SCREENSHOT'
          s['agent_production_write']='NOT_EXECUTED_OWNER_COMPLETED_OUTSIDE_GIT'
          p['current_phase']='V0_1_15_PRODUCTION_CURRENT'
          p['next_gate']='NONE_V0_1_15_PRODUCTION_CLOSED'
          path.write_text(json.dumps(p,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          test "$(git -C p06 diff --name-only | wc -l)" = 1
          test "$(git -C p06 diff --name-only)" = 'VF_PROJECT.json'
          python3 -m json.tool p06/VF_PROJECT.json >/dev/null
          git -C p06 config user.name VictorForge
          git -C p06 config user.email llhzx2018@gmail.com
          git -C p06 add VF_PROJECT.json
          git -C p06 commit -m 'gov(P06): close V0.1.15 Production authority'
          git -C p06 push origin "HEAD:$BRANCH"
          echo P06_V0115_PRODUCTION_AUTHORITY_CANDIDATE=PASS
