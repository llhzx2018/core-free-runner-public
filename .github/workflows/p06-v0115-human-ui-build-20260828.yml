name: P06 V0.1.15 Release Authority Gate

on:
  push:
    paths:
      - '.github/workflows/p06-v0115-human-ui-build-20260828.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact P06 V0.1.15 release authority
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: bash scripts/p06-v0115-release-authority-gate.sh
