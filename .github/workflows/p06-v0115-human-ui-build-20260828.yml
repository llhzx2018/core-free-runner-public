name: P06 V0.1.15 Publication

on:
  push:
    paths:
      - '.github/workflows/p06-v0115-human-ui-build-20260828.yml'

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_SOURCE: a9300382d3a862fb599b8b928961ead38dee8f31
      VERIFIED_RUN: '33184343643'
      ARTIFACT_NAME: P06-V0.1.15-FORMAL-ATOMIC-RELEASE-SET
      FULL_SHA: 03702b4c0401f5777cfbe52702821f84a11a83e1ea2a06680b0ead3808820cd7
      FULL_BYTES: '271733'
      UPDATE_SHA: 152c44d18c55d9d022b8eabf71628d3faf9edc229a54badf1c9887fe8324e5fe
      UPDATE_BYTES: '278578'
    steps:
      - uses: actions/checkout@v4
      - name: Download exact verified release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir release-set
          gh run download "$VERIFIED_RUN" -R llhzx2018/core-free-runner-public -n "$ARTIFACT_NAME" -D release-set
          test "$(cat release-set/RELEASE_SOURCE.txt)" = "$RELEASE_SOURCE"
          test "$(cat release-set/FULL_BYTES.txt)" = "$FULL_BYTES"
          test "$(cat release-set/FULL_SHA256.txt)" = "$FULL_SHA"
          test "$(cat release-set/UPDATE_BYTES.txt)" = "$UPDATE_BYTES"
          test "$(cat release-set/UPDATE_SHA256.txt)" = "$UPDATE_SHA"
          test "$(stat -c %s release-set/VF_Press_V0.1.15_FULL.zip)" = "$FULL_BYTES"
          test "$(sha256sum release-set/VF_Press_V0.1.15_FULL.zip | awk '{print $1}')" = "$FULL_SHA"
          test "$(stat -c %s release-set/VF_Press_V0.1.15_UPDATE.zip)" = "$UPDATE_BYTES"
          test "$(sha256sum release-set/VF_Press_V0.1.15_UPDATE.zip | awk '{print $1}')" = "$UPDATE_SHA"
          echo P06_V0115_ARTIFACT_IDENTITY=PASS
      - name: Publish exact V0.1.15 release
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          MAIN="$(gh api repos/llhzx2018/vf-press/git/ref/heads/main --jq .object.sha)"
          test "$MAIN" = "$RELEASE_SOURCE"
          if gh api repos/llhzx2018/vf-press/releases/tags/v0.1.15 >/dev/null 2>&1; then
            echo 'v0.1.15 release already exists; refusing ambiguous publication' >&2
            exit 1
          fi
          gh release create v0.1.15 \
            -R llhzx2018/vf-press \
            --target "$RELEASE_SOURCE" \
            --title 'VF Press V0.1.15 · Human-readable System Baseline UI' \
            --notes 'V0.1.15 makes System Info / System Baseline / Runtime Health administrator-first while preserving all Common Product Baseline V2 machine truth and the two explicit TIME/API exceptions. Schema remains 3. Product Exact Source 561e59a82f035e2622c4567710bec06a1c50dab3 passed Human UI Formal Gate Run 33183662919. Release Source a9300382d3a862fb599b8b928961ead38dee8f31 is tree-identical. Real V0.1.14 -> V0.1.15 Atomic Gate Run 33184343643 passed with recovery point, user-data preservation, Schema 3, post-update HTTP and rollback contract. Production is not modified by this release.' \
            release-set/VF_Press_V0.1.15_FULL.zip \
            release-set/VF_Press_V0.1.15_UPDATE.zip \
            release-set/SHA256SUMS.txt \
            release-set/RELEASE_INFO.json
      - name: Remote publication readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          TAG_SHA="$(gh api repos/llhzx2018/vf-press/git/ref/tags/v0.1.15 --jq .object.sha)"
          test "$TAG_SHA" = "$RELEASE_SOURCE"
          gh api repos/llhzx2018/vf-press/releases/tags/v0.1.15 > release.json
          python3 - <<'PY'
          import json,os
          r=json.load(open('release.json'))
          assert r['tag_name']=='v0.1.15'
          assert not r['draft'] and not r['prerelease']
          expected={
            'VF_Press_V0.1.15_FULL.zip':(int(os.environ['FULL_BYTES']),os.environ['FULL_SHA']),
            'VF_Press_V0.1.15_UPDATE.zip':(int(os.environ['UPDATE_BYTES']),os.environ['UPDATE_SHA']),
          }
          assets={a['name']:a for a in r['assets']}
          for name,(size,sha) in expected.items():
            a=assets[name]; assert a['size']==size,(name,a['size'],size)
            digest=a.get('digest'); assert digest==f'sha256:{sha}',(name,digest,sha)
          print('P06_V0115_RELEASE_ID='+str(r['id']))
          print('P06_V0115_PUBLISHED_AT='+r['published_at'])
          for n in expected: print('P06_V0115_ASSET_ID_'+n+'='+str(assets[n]['id']))
          print('P06_V0115_PUBLICATION=PASS')
          PY
