name: P06 V0.1.15 Multi-From Atomic Gate

on:
  push:
    paths:
      - '.github/workflows/p06-v0115-human-ui-build-20260828.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y php-cli php-sqlite3 php-mbstring php-zip php-curl composer sqlite3 rsync >/dev/null
      - name: Verify V0.1.12 V0.1.13 V0.1.14 to V0.1.15 Atomic paths
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          P06_MULTIFROM_HARNESS_REVISION: full-clone-r2
        shell: bash
        run: bash scripts/p06-v0115-multifrom-atomic-gate.sh
