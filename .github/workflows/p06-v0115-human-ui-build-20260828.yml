name: P06 V0.1.15 Human Baseline UI Build

on:
  push:
    paths:
      - '.github/workflows/p06-v0115-human-ui-build-20260828.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BRANCH: ui/p06-human-baseline-v0115-20260828
      START_HEAD: 528c0f8afdf670c7ac84190954ac499631b2b678
      BASE_MAIN: d689b79a6f1d98f0bf5bccba438f3c9a74077782

    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact P06 UI branch with write authority
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-press
          ref: ${{ env.BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
          path: p06

      - name: Apply V0.1.15 Human UI closure
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p06 rev-parse HEAD)" = "$START_HEAD"
          test "$(git -C p06 rev-parse origin/main)" = "$BASE_MAIN"
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('p06')

          # VERSION
          (root/'VERSION').write_text('0.1.15\n', encoding='utf-8')

          # VF_PROJECT current candidate truth only; production truth is preserved.
          p_path=root/'VF_PROJECT.json'
          p=json.loads(p_path.read_text(encoding='utf-8'))
          p['version']='0.1.15'
          p['lifecycle']='CANDIDATE'
          p['current_phase']='V0_1_15_HUMAN_BASELINE_UI_CANDIDATE'
          p['next_gate']='EXACT_SOURCE_MACHINE_GATE_V0_1_15'
          p['human_ui_exposure_v0_1_15']={
              'state':'CANDIDATE',
              'scope':'SYSTEM_INFO_BASELINE_HEALTH_MAINTENANCE_PRESENTATION_ONLY',
              'baseline_resolver_change':False,
              'schema_change':False,
              'production_change':False,
              'owner_first_conclusion':True,
              'attention_summary':True,
              'domain_translation_count':15,
              'technical_details_default_collapsed':True,
              'explicit_exceptions_preserved':[
                  'P06-TIME-DISPLAY-CONVERSION-LEGACY-SURFACES',
                  'P06-API-RETRY-PROVIDER-SPECIFIC'
              ]
          }
          p_path.write_text(json.dumps(p,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # CHANGELOG
          c_path=root/'CHANGELOG.md'
          c=c_path.read_text(encoding='utf-8')
          heading='## 0.1.15 · Human-readable System Baseline UI（2026-08-28）'
          if heading not in c:
              block='''## 0.1.15 · Human-readable System Baseline UI（2026-08-28）\n\n- 系统信息、系统基线、运行健康改为管理员优先：先显示“管理员结论 / 你需要关注”，不再要求 OWNER 先读 Runtime 枚举和秒数。\n- Common Product Baseline V2 的 15 个 Domain 全部提供中文业务名称；PASS / EXCEPTION / DRIFT / UNKNOWN / N_A 分别展示为正常、已知限制、需要处理、待确认、当前不适用。\n- 两个正式显式例外继续保留：旧后台时间显示尚未全部转换、外部 API 尚无统一 Retry Wrapper；不把 EXCEPTION 美化成 PASS。\n- 原始 Domain / State / Reason / Details、Profile 与 Runtime 参数继续存在于默认折叠的“技术详情（开发 / 排障使用）”，Resolver 不变、Schema 保持 `3`。\n- 系统升级统一命名为“在线升级”；备份恢复与系统设置中的 SQLite / 状态首层改为中文可读表达。\n- 本版本不修改书稿、Reader、AI、Schema、CommonBaselineV2 Resolver 或 Production；Production 升级必须使用独立 Gate。\n\n'''
              c=c.replace('# 变更记录\n\n', '# 变更记录\n\n'+block,1)
              c_path.write_text(c,encoding='utf-8')

          # Maintenance page first-layer wording.
          m_path=root/'src/Http/Studio/MaintenanceController.php'
          m=m_path.read_text(encoding='utf-8')
          m=m.replace("$this->pageStart('系统升级', '只接受正式更新清单声明的升级路径，并在应用前自动建立恢复点。', $flash);", "$this->pageStart('在线升级', '只接受正式更新清单声明的升级路径，并在应用前自动建立恢复点。', $flash);")
          m=m.replace("<?= Escape::html((string)$backup['status']) ?></td><td><?= Escape::html((string)$backup['database_integrity']) ?>", "<?= Escape::html(UiText::label((string)$backup['status'])) ?></td><td><?= (string)$backup['database_integrity'] === 'ok' ? '正常' : Escape::html((string)$backup['database_integrity']) ?>")
          m=m.replace("<div><small>SQLite</small><strong class=\"<?= $integrity === 'ok' ? '' : 'maintenance-danger' ?>\"><?= Escape::html($integrity) ?></strong></div>", "<div><small>SQLite</small><strong class=\"<?= $integrity === 'ok' ? '' : 'maintenance-danger' ?>\"><?= $integrity === 'ok' ? '正常' : '异常' ?></strong></div>")
          m=m.replace("<div><dt>数据库完整性</dt><dd><?= Escape::html($integrity) ?></dd></div>", "<div><dt>数据库完整性</dt><dd><?= $integrity === 'ok' ? '正常' : '异常（请检查运行健康）' ?></dd></div>")
          m_path.write_text(m,encoding='utf-8')

          # CSS presentation layer only.
          css_path=root/'public/assets/maintenance.css'
          css=css_path.read_text(encoding='utf-8')
          marker='/* V0.1.15 human-readable baseline UI */'
          if marker not in css:
              css += r'''

/* V0.1.15 human-readable baseline UI */
.maintenance-owner-summary,
.maintenance-attention,
.maintenance-baseline-group,
.maintenance-tech-details {
    margin-bottom: 16px;
    border: 1px solid #dbe4e7;
    border-radius: 10px;
    background: #fff;
}

.maintenance-owner-summary {
    padding: 20px 22px;
    border-left-width: 4px;
}

.maintenance-owner-summary > span,
.maintenance-attention > div > span {
    display: block;
    color: #667a82;
    font-size: 10px;
    font-weight: 750;
    letter-spacing: .08em;
}

.maintenance-owner-summary h2 {
    margin: 5px 0 6px;
    font-size: 22px;
    line-height: 1.3;
}

.maintenance-owner-summary p,
.maintenance-attention p,
.maintenance-attention li,
.maintenance-known-limits li,
.maintenance-baseline-item p {
    color: #526970;
    font-size: 12px;
    line-height: 1.65;
}

.maintenance-owner-summary-ok { border-left-color: #21866d; background: #fbfefd; }
.maintenance-owner-summary-warn { border-left-color: #c98226; background: #fffdf8; }

.maintenance-attention {
    padding: 16px 18px;
}

.maintenance-attention > div:first-child {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
}

.maintenance-attention > div > strong { font-size: 13px; }
.maintenance-attention ul { margin: 10px 0 0; padding-left: 20px; }
.maintenance-attention-ok { border-color: #cfe3dc; background: #f8fcfa; }
.maintenance-attention-warn { border-color: #ead6b5; background: #fffaf1; }

.maintenance-known-limits {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #dfe8ea;
}

.maintenance-known-limits > strong { font-size: 12px; }

.maintenance-metrics-human {
    grid-template-columns: repeat(5, minmax(0, 1fr));
}

.maintenance-baseline-groups {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    margin-bottom: 16px;
}

.maintenance-baseline-group {
    margin: 0;
    padding: 16px;
}

.maintenance-baseline-list { display: grid; }

.maintenance-baseline-item {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 14px;
    align-items: start;
    padding: 12px 0;
    border-top: 1px solid #e6edef;
}

.maintenance-baseline-item:first-child { border-top: 0; }
.maintenance-baseline-item strong { font-size: 13px; }
.maintenance-baseline-item p { margin: 4px 0 0; }

.maintenance-state {
    display: inline-flex;
    align-items: center;
    min-height: 24px;
    padding: 3px 8px;
    border: 1px solid #cbdadd;
    border-radius: 999px;
    background: #f5f9fa;
    color: #415b62;
    font-size: 10px;
    font-weight: 700;
    white-space: nowrap;
}

.maintenance-state-pass { border-color: #bdddcf; background: #f1faf6; color: #27735f; }
.maintenance-state-exception { border-color: #ead2aa; background: #fff9ee; color: #9a6422; }
.maintenance-state-drift,
.maintenance-state-unknown { border-color: #e6c0c0; background: #fff5f5; color: #a73d3d; }
.maintenance-state-n-a { color: #687b81; background: #f4f7f8; }

.maintenance-tech-details {
    padding: 0;
    overflow: hidden;
}

.maintenance-tech-details > summary {
    padding: 13px 16px;
    color: #536970;
    background: #f8fafb;
    cursor: pointer;
    font-size: 11px;
    font-weight: 700;
}

.maintenance-tech-details[open] > summary { border-bottom: 1px solid #dfe7e9; }
.maintenance-tech-details > .maintenance-definition,
.maintenance-tech-details > .maintenance-table-wrap,
.maintenance-tech-meta { margin: 14px 16px; }

.maintenance-tech-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    color: #667a82;
    font-size: 10px;
}

.maintenance-definition-human dd { font-weight: 650; }

@media (max-width: 980px) {
    .maintenance-metrics-human { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .maintenance-baseline-groups { grid-template-columns: 1fr; }
}

@media (max-width: 720px) {
    .maintenance-metrics-human { grid-template-columns: 1fr 1fr; }
    .maintenance-owner-summary { padding: 17px; }
    .maintenance-baseline-item { grid-template-columns: 1fr; gap: 7px; }
    .maintenance-state { justify-self: start; }
}
'''
              css_path.write_text(css,encoding='utf-8')

          # Static human UI contract; browser/runtime gate follows on the exact source.
          t_path=root/'bin/common-baseline-human-ui-self-test.php'
          t_path.write_text(r'''<?php

declare(strict_types=1);

$base = dirname(__DIR__);
$system = file_get_contents($base . '/src/Http/Studio/SystemBaselineController.php');
$shell = file_get_contents($base . '/src/Http/Studio/BackofficeShell.php');
$resolver = file_get_contents($base . '/src/Application/Operations/CommonBaselineV2.php');
$maintenance = file_get_contents($base . '/src/Http/Studio/MaintenanceController.php');
$css = file_get_contents($base . '/public/assets/maintenance.css');
$version = trim((string) file_get_contents($base . '/VERSION'));

$failures = [];
$mustContain = [
    '管理员结论', '你需要关注', '技术详情（开发 / 排障使用）',
    '时间规则', '登录与高风险验证', '在线升级', '备份与恢复', '数据与 Schema',
    '外部接口保护', '后台任务', '外部通知', '操作与安全记录', '后台通用状态',
    '文件上传', '运行健康', '版本身份', '缓存策略', '界面语言',
    "'PASS' => '正常'", "'EXCEPTION' => '已知限制'", "'DRIFT' => '需要处理'",
    "'UNKNOWN' => '待确认'", "'N_A' => '当前不适用'",
];
foreach ($mustContain as $needle) {
    if (!str_contains((string) $system, $needle)) {
        $failures[] = 'System UI missing: ' . $needle;
    }
}
foreach (['系统信息','系统基线','在线升级','备份与恢复','运行健康'] as $entry) {
    if (!str_contains((string) $shell, $entry)) {
        $failures[] = 'Canonical maintenance entry missing: ' . $entry;
    }
}
if (!str_contains((string) $system, '<details class="maintenance-tech-details')) {
    $failures[] = 'Raw evidence is not collapsed in details';
}
if (!str_contains((string) $system, "['DRIFT', 'UNKNOWN']")) {
    $failures[] = 'Attention gate does not prioritize DRIFT/UNKNOWN';
}
if (!str_contains((string) $system, "'EXCEPTION'")) {
    $failures[] = 'Explicit exception presentation missing';
}
if (!str_contains((string) $resolver, "'P06-API-RETRY-PROVIDER-SPECIFIC'")) {
    $failures[] = 'API exception authority disappeared';
}
if (!str_contains((string) $resolver, "'P06-TIME-DISPLAY-CONVERSION-LEGACY-SURFACES'")) {
    $failures[] = 'TIME exception authority disappeared';
}
if (substr_count((string) $resolver, "'TIME',") < 2 || !str_contains((string) $resolver, "'NOTIFICATION'")) {
    $failures[] = 'Resolver domain contract changed unexpectedly';
}
if (!str_contains((string) $maintenance, "$this->pageStart('在线升级'")) {
    $failures[] = 'Online update naming is not canonical';
}
if (!str_contains((string) $css, 'V0.1.15 human-readable baseline UI')) {
    $failures[] = 'Human UI CSS missing';
}
if ($version !== '0.1.15') {
    $failures[] = 'VERSION is not 0.1.15';
}

if ($failures !== []) {
    foreach ($failures as $failure) {
        fwrite(STDERR, "FAIL: {$failure}\n");
    }
    exit(1);
}

fwrite(STDOUT, "P06_COMMON_BASELINE_HUMAN_UI=PASS\n");
''',encoding='utf-8')
          PY

      - name: Syntax and Human UI contract before commit
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p06
          php -l src/Http/Studio/SystemBaselineController.php
          php -l src/Http/Studio/MaintenanceController.php
          php -l bin/common-baseline-human-ui-self-test.php
          php bin/common-baseline-human-ui-self-test.php
          python3 -m json.tool VF_PROJECT.json >/dev/null
          test "$(tr -d '\r\n' < VERSION)" = '0.1.15'
          git diff --check
          git diff --quiet "$BASE_MAIN" HEAD -- src/Application/Operations/CommonBaselineV2.php database || true
          echo P06_V0115_PRECOMMIT_HUMAN_UI=PASS

      - name: Commit exact candidate scope
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p06
          test -z "$(git diff --name-only "$BASE_MAIN" HEAD -- src/Application/Operations/CommonBaselineV2.php database)"
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add VERSION VF_PROJECT.json CHANGELOG.md src/Http/Studio/SystemBaselineController.php src/Http/Studio/MaintenanceController.php public/assets/maintenance.css bin/common-baseline-human-ui-self-test.php
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = '6'
          git commit -m 'feat(P06): humanize Common Baseline V2 system UI'
          git push origin "HEAD:$BRANCH"
          echo P06_V0115_CANDIDATE_PUSH=PASS
