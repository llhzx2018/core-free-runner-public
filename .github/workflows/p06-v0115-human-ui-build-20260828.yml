name: P06 V0.1.12 Real Online Discovery Gate

on:
  push:
    paths:
      - '.github/workflows/p06-v0115-human-ui-build-20260828.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y php-cli php-sqlite3 php-mbstring php-zip php-curl composer sqlite3 rsync >/dev/null
      - name: Run exact V0.1.12 OnlineUpdateService against live channel
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: bash scripts/p06-v0115-v0112-discovery-gate.sh
