name: P01 R5 persistent Music dock import exact-source gate
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-r5-music-dock-import.yml'
permissions:
  contents: read
jobs:
  p01-r5-dock-gate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      REPO: llhzx2018/vf-start
      CANDIDATE_SHA: 5dabafb1152e340703b79e1a55f8999e7a2f5f1b
      BASELINE_SHA: 49b6b7331fc81f47f26dfe7832a39d1b2dc591e7
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,mbstring,zip,curl
          coverage: none
      - name: Fetch exact private sources only into ephemeral workspace
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          for pair in "candidate $CANDIDATE_SHA" "stable $BASELINE_SHA"; do
            set -- $pair
            git init -q "$1"
            git -C "$1" remote add origin "https://x-access-token:${READ_TOKEN}@github.com/${REPO}.git"
            git -C "$1" -c advice.detachedHead=false fetch -q --depth 1 origin "$2"
            git -C "$1" checkout -q --detach FETCH_HEAD
            test "$(git -C "$1" rev-parse HEAD)" = "$2"
            git -C "$1" remote remove origin
          done
          echo P01_R5_DOCK_EXACT_SOURCE_PIN=PASS
      - name: Check private dock routing and playback retention
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          test "$(tr -d '\r\n ' < VERSION)" = "2.47.444"
          php -l src/music-shell.php
          node --check src/assets/music-dock.js
          node tests/unit/music_dock_contract.js
          node tests/unit/music_shell_route_contract.js
          node tests/unit/music_interaction_quality_contract.js
          php tests/unit/music_security_contract.php
          grep -Fq 'data-dock-import="1"' src/music-shell.php
          grep -Fq "showView('home',route,true)" src/assets/music-dock.js
          echo P01_R5_DOCK_PLAYBACK_AND_PRIVATE_SCOPE=PASS
      - name: Canonical full PHP unit regression relative to main
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate stable --require-zero-debt
          echo P01_R5_DOCK_CANONICAL_REGRESSION=PASS
      - name: Remove private sources
        if: always()
        shell: bash
        run: |
          rm -rf candidate stable
          echo P01_R5_DOCK_TEMP_SOURCE_CLEANUP=PASS
