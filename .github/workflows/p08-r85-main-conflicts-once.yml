name: P08 PR22 exact main merge conflict paths one-off
on:
  push:
    branches: [test/p08-r85-main-reconcile-20261113]
permissions:
  contents: read
jobs:
  merge-tree-dry-run:
    if: ${{ github.repository == 'llhzx2018/core-free-runner-public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 344ce49c0b9ade98fc81208c67f7da3c71646f8e
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
      - name: Read current product main and list only merge conflicts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 344ce49c0b9ade98fc81208c67f7da3c71646f8e
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          BASE=$(git merge-base HEAD origin/main)
          echo "P08_R85_MERGE_BASE=$BASE"
          echo "P08_R85_MAIN_SHA=$(git rev-parse origin/main)"
          git merge --no-commit --no-ff origin/main >/dev/null 2>&1 || true
          git diff --name-only --diff-filter=U | tee "$RUNNER_TEMP/p08-merge-conflicts.txt"
          COUNT=$(wc -l < "$RUNNER_TEMP/p08-merge-conflicts.txt")
          echo "P08_R85_MAIN_CONFLICT_PATH_COUNT=$COUNT"
          git merge --abort >/dev/null 2>&1 || true
          test "$(git rev-parse HEAD)" = 344ce49c0b9ade98fc81208c67f7da3c71646f8e
      - name: Private checkout cleanup
        if: always()
        run: |
          cd "$RUNNER_TEMP"
          rm -rf "$GITHUB_WORKSPACE"
          rm -f "$RUNNER_TEMP/p08-merge-conflicts.txt"
          echo P08_R85_PRIVATE_SOURCE_PERSISTED=NO
