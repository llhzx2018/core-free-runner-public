name: P07 release95 exact formal publication
on:
  push:
    branches: [main]
    paths:
      - 'dist/p07/0.1.0/overlay/**'
      - 'packages/p07-system-care/0.1.0-rc64/**'
      - 'installers/p07.sh'
      - 'installers/p07-final.sh'
      - 'installers/p07-toolbox.sh'
      - 'installers/p07-system-care.sh'
      - '.github/workflows/p07-release95-formal-publish.yml'
permissions:
  contents: read
concurrency:
  group: p07-release95-formal-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_REPO: llhzx2018/core-free-runner-public
      RELEASE_TAG: p07-v0.1.0-release95
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact merged bytes and fail-closed trust chain
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN" || { echo P07_RELEASE_WRITE_CAPABILITY_MISSING; exit 78; }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api repos/$RELEASE_REPO/git/ref/heads/main --jq '.object.sha')" = "$GITHUB_SHA" || { echo P07_MAIN_MOVED; exit 78; }
          root=dist/p07/0.1.0/overlay
          care=packages/p07-system-care/0.1.0-rc64
          test "$(cat "$root/BUILD_ID")" = '0.1.0-release95'
          test "$(cat "$care/VERSION")" = '0.1.0-rc64'
          test "$(git hash-object "$root/RUNTIME.gitblob")" = 223a73c8b5d4ad95a630f53a36b6b41a7f779bf8
          test "$(git hash-object "$root/MANIFEST.gitblob")" = 0da990d16d35b1f13b3199adfeae7cf7109ea5b9
          test "$(git hash-object "$care/MANIFEST.gitblob")" = 4d5365bda02051b298f1bd9f4f52b245716a59ff
          (cd "$root"; while read -r sha file; do test "$(git hash-object "$file")" = "$sha"; done < RUNTIME.gitblob)
          (cd "$root"; while read -r sha file; do test "$(git hash-object "$file")" = "$sha"; done < MANIFEST.gitblob)
          (cd "$care"; while read -r sha file; do test "$(git hash-object "$file")" = "$sha"; done < MANIFEST.gitblob)
          test "$(git hash-object installers/p07-final.sh)" = 52dfcef6f2f85ce6581d8f9e5df6f4a2dacea652
          test "$(git hash-object installers/p07.sh)" = 496c93144cbba6a797744dd31cf1f2d11e4253f3
          test "$(git hash-object installers/p07-toolbox.sh)" = 855f23da84e111b6f41868e30588972770c8be16
          test "$(git hash-object installers/p07-system-care.sh)" = bf533b29b6e62e2957fe7e19db057269e7a3d395
          grep -Fq 'EXPECTED_BLOB="52dfcef6f2f85ce6581d8f9e5df6f4a2dacea652"' installers/p07.sh
          grep -Fq 'EXPECTED_BUILD_ID="0.1.0-release95"' installers/p07-final.sh
          grep -Fq 'RUNTIME_MANIFEST_BLOB="223a73c8b5d4ad95a630f53a36b6b41a7f779bf8"' installers/p07-final.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release95"' installers/p07-toolbox.sh
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc64"' installers/p07-toolbox.sh
          grep -Fq "MANIFEST_BLOB='4d5365bda02051b298f1bd9f4f52b245716a59ff'" installers/p07-system-care.sh
          bash -n installers/p07.sh installers/p07-final.sh installers/p07-toolbox.sh installers/p07-system-care.sh
          echo P07_RELEASE94_EXACT_MERGED_PREFLIGHT_PASS
      - name: Formal GitHub release with exact target readback
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view "$RELEASE_TAG" -R "$RELEASE_REPO" >/dev/null 2>&1; then
            test "$(gh api repos/$RELEASE_REPO/git/ref/tags/$RELEASE_TAG --jq '.object.sha')" = "$GITHUB_SHA" || { echo P07_RELEASE_TAG_COLLISION; exit 81; }
          else
            gh release create "$RELEASE_TAG" -R "$RELEASE_REPO" --target "$GITHUB_SHA" \
              --title 'P07 · release95 · 正式网站数据工具与 System Care rc64' \
              --notes 'P07 release95 / System Care rc64. Exact private candidate b546356de27615b3b756a9092962452f2ae26663; merged private source main b546356de27615b3b756a9092962452f2ae26663 has identical source tree. Strict privacy-safe SQL_CANON_V2 diagnostics PASS in public isolated synthetic tests, with changed SQL literals and guarded schema changes still blocked. Exact-source migration and package regression tests PASS; isolated clean install, release94 to release95 upgrade, idempotency, corrupt-download rejection, and rollback PASS. Strict known-format full SQL fingerprint retains every schema object, conditional ALTER, row literal and index. Unknown SQL differences still block. No old CP/CP2/DNS changes. Production CP2 manual upgrade, migration resume, and DNS cutover remain separate OWNER gates.'
          fi
          test "$(gh api repos/$RELEASE_REPO/git/ref/tags/$RELEASE_TAG --jq '.object.sha')" = "$GITHUB_SHA"
          test "$(gh api repos/$RELEASE_REPO/releases/tags/$RELEASE_TAG --jq '.target_commitish')" = "$GITHUB_SHA"
          test "$(gh api repos/$RELEASE_REPO/releases/tags/$RELEASE_TAG --jq '.draft')" = false
          test "$(gh api repos/$RELEASE_REPO/releases/tags/$RELEASE_TAG --jq '.prerelease')" = false
          echo P07_RELEASE94_GITHUB_RELEASE_PASS
      - name: Upload exact installer assets and read back identities
        shell: bash
        run: |
          set -Eeuo pipefail
          gh release upload "$RELEASE_TAG" -R "$RELEASE_REPO" --clobber installers/p07.sh installers/p07-final.sh installers/p07-toolbox.sh installers/p07-system-care.sh
          mkdir -p /tmp/p07-release95-assets
          gh release download "$RELEASE_TAG" -R "$RELEASE_REPO" --dir /tmp/p07-release95-assets
          for name in p07.sh p07-final.sh p07-toolbox.sh p07-system-care.sh; do
            test -f "/tmp/p07-release95-assets/$name"
            test "$(git hash-object "/tmp/p07-release95-assets/$name")" = "$(git hash-object "installers/$name")"
          done
          echo P07_RELEASE94_ASSET_READBACK_PASS
      - name: Public installer raw-byte distribution readback
        shell: bash
        run: |
          set -Eeuo pipefail
          remote="https://raw.githubusercontent.com/$RELEASE_REPO/$GITHUB_SHA"
          for item in 'installers/p07.sh 496c93144cbba6a797744dd31cf1f2d11e4253f3' 'installers/p07-final.sh 52dfcef6f2f85ce6581d8f9e5df6f4a2dacea652' 'installers/p07-toolbox.sh 855f23da84e111b6f41868e30588972770c8be16' 'installers/p07-system-care.sh bf533b29b6e62e2957fe7e19db057269e7a3d395' 'dist/p07/0.1.0/overlay/RUNTIME.gitblob 223a73c8b5d4ad95a630f53a36b6b41a7f779bf8'; do
            read -r file sha <<< "$item"
            curl -fsSL --retry 5 --retry-delay 2 --proto '=https' --tlsv1.2 "$remote/$file" -o /tmp/p07-release95-remote
            test "$(git hash-object /tmp/p07-release95-remote)" = "$sha"
          done
          echo P07_RELEASE94_REMOTE_DISTRIBUTION_READBACK_PASS
