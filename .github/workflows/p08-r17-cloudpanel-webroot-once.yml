name: P08 R17 CloudPanel clean webroot and installer regression (one-off)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p08-r17-cloudpanel-webroot-once.yml'
permissions:
  contents: read
jobs:
  exact-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Transient exact P08 candidate checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-adops
          ref: f37a5e7df8de4977e6deb0a3c37e95d7308c4f1b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-p08
      - name: Confirm source + PHP version
        run: |
          set -euo pipefail
          test "$(git -C private-p08 rev-parse HEAD)" = "f37a5e7df8de4977e6deb0a3c37e95d7308c4f1b"
          php --version | head -n 1
          python3 --version
          test -f private-p08/CLOUDPANEL_INSTALL.txt
          test -f private-p08/public/index.php
          echo P08_R17_SOURCE_AND_DELIVERY_GUIDE=PASS
      - name: Real localhost PHP installer redirection and lock protection
        working-directory: private-p08
        run: |
          set -euo pipefail
          php -l public/index.php
          php -l src/Installation/SetupGuard.php
          php tests/test_setup_guard.php
          python3 -m unittest discover -s tests -p test_cloudpanel_install_entry.py -v
          echo P08_R17_REAL_HTTP_FIRST_INSTALL_ENTRY=PASS
      - name: Clean FULL manifest contract and tamper tests
        working-directory: private-p08
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_full_builder.py -v
          php tests/test_full_integrity.php
          echo P08_R17_CLOUDPANEL_FULL_GUIDE_REQUIRED=PASS
      - name: Remove private source on any exit
        if: always()
        run: rm -rf private-p08
