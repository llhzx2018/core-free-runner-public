name: P01 V247288 Distribution exact-source proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v247288-distribution-proof.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: bbcbcfae24d039a81944425998ba79c95ef23e29
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,curl,zip,openssl
          coverage: none
      - name: Update Core canonical, product identity and asset SHA
        run: |
          set -Eeuo pipefail
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php update-core/php/tests/run.php
          python3 - <<'PY'
          import json
          p=json.load(open('projects/P01.json'))
          assert p['current_version']=='2.47.287'
          assert p['target_version']=='2.47.288'
          assert p['from_versions']==['2.47.287']
          assert p['product_identity']=='5e14de0aa2983b01e53aec15a6e776014c1f8fe1'
          assert p['release_id']==406648388
          assert p['asset_name']=='VF_Start_V2.47.288_UPDATE.zip'
          assert p['asset_sha256']=='800598a18ee133da09be040b2d868da1d6eda72f7ab1252b1b744daa1fcf10e9'
          assert p['asset_bytes']==2364573
          assert p['schema_from']==p['schema_to']=='2026090401'
          print('P01_V247288_DISTRIBUTION_IDENTITY=PASS')
          PY
          echo P01_V247288_DISTRIBUTION_CANONICAL=PASS
