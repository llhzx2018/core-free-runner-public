name: P01 Admin Public State Product Write R3
on:
  push:
    branches: [temp/p01-admin-public-state-clarity-20260901]
    paths: [.github/workflows/p01-admin-public-state-product-write-r3-20260901.yml]
permissions:
  contents: read
jobs:
  write:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: temp/p01-admin-public-state-clarity-20260901
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: product/p01-admin-public-state-clarity-20260901
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Reuse guarded mutation with exact JS indentation
        shell: bash
        env:
          EXPECTED_BASE: 5ee91a4e0c2ce66a5c22850ae09b1bd6c7cd8081
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$EXPECTED_BASE"
          test -z "$(git -C product status --porcelain)"
          python3 - <<'PY'
          from pathlib import Path
          source=Path('runner/.github/workflows/p01-admin-public-state-product-write-r2-20260901.yml').read_text()
          lines=source.splitlines(True); script=[]; capture=False
          for line in lines:
              if line.strip()=="python3 - <<'PY'": capture=True; continue
              if capture and line.strip()=='PY': break
              if capture:
                  script.append(line[10:] if line.startswith('          ') else line)
          code=''.join(script)
          old="function renderHeader() {\n    var auth=!!(state.site&&state.site.auth)"
          new="function renderHeader() {\n  var auth=!!(state.site&&state.site.auth)"
          if code.count(old)!=1: raise SystemExit(f'R3 renderHeader script patch fence failed: {code.count(old)}')
          code=code.replace(old,new,1)
          compile(code,'p01-admin-public-state-r3.py','exec')
          exec(code,{'__name__':'__main__'})
          PY
          for f in product/src/app/FunctionalWorkspaceCore.php product/src/app/FunctionalWorkspaceShell.php product/src/app/FunctionalWorkspace.php product/src/start.php product/src/index.php product/src/api.php; do php -l "$f"; done
          git -C product diff --check
          git -C product diff --name-only | sort | tee /tmp/changed.txt
          cat >/tmp/expected.txt <<'EOF'
          src/api.php
          src/app/FunctionalWorkspace.php
          src/app/FunctionalWorkspaceCore.php
          src/app/FunctionalWorkspaceShell.php
          src/assets/frontend.css
          src/assets/workspace-domain-nav.css
          src/index.php
          src/start.php
          EOF
          diff -u /tmp/expected.txt /tmp/changed.txt
          test -z "$(git -C product diff --name-only | grep -Ev '^(src/api.php|src/app/FunctionalWorkspace.php|src/app/FunctionalWorkspaceCore.php|src/app/FunctionalWorkspaceShell.php|src/assets/frontend.css|src/assets/workspace-domain-nav.css|src/index.php|src/start.php)$' || true)"
          git -C product config user.name VictorForge
          git -C product config user.email llhzx2018@gmail.com
          git -C product add src/api.php src/app/FunctionalWorkspace.php src/app/FunctionalWorkspaceCore.php src/app/FunctionalWorkspaceShell.php src/assets/frontend.css src/assets/workspace-domain-nav.css src/index.php src/start.php
          git -C product commit -m 'fix(P01): make admin and public view state explicit'
          git -C product push origin HEAD:product/p01-admin-public-state-clarity-20260901
          git -C product rev-parse HEAD
