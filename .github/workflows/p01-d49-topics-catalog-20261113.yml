name: P01 D49 Owner Topics cover-first catalog three-engine CloudPanel HTTP
on:
  push:
    branches:
      - test/p01-d49-topics-catalog-3db-20261113

permissions:
  contents: read

jobs:
  real-owner-topics:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: p01-only-synthetic-test
          MYSQL_DATABASE: p01_d1_test_mysql_20261111
        ports:
          - 3306:3306
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: p01-only-synthetic-test
          MARIADB_DATABASE: p01_d1_test_maria_20261111
        ports:
          - 3307:3306
    steps:
      - name: Bound synthetic route and source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "$GITHUB_REF_NAME" = "test/p01-d49-topics-catalog-3db-20261113"
          echo P01_D49_PRODUCTION_AND_RELEASE_WRITES=NONE

      - name: Registered private source read ability
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          test -n "$READ_TOKEN"
          echo P01_D49_TEMP_PRIVATE_READ=AVAILABLE

      - name: Exact private P01 source ephemeral
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 0f200e4dd3caad07a2cd4177e9bdc53b4a9b4717
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate

      - name: Install actual PHP FPM Nginx Composer runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            nginx php8.3-fpm php8.3-cli php8.3-mysql php8.3-sqlite3 \
            php8.3-mbstring php8.3-xml php8.3-curl php8.3-zip \
            composer openssl unzip >/dev/null
          command -v php-fpm8.3
          command -v nginx
          command -v composer

      - name: Exact source and new HTTP business lint
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "0f200e4dd3caad07a2cd4177e9bdc53b4a9b4717"
          test "$(cat candidate/VERSION)" = "2.47.516"
          test "$(cat candidate/src/VERSION.txt)" = "2.47.516"
          for src in \
            candidate/src/app/next/OwnerTopicsWorkspace.php \
            candidate/src/app/next/D2CanonicalConnectionScope.php \
            candidate/src/app/next/OwnerDataRuntime.php \
            candidate/src/app/next/http/OwnerHttpRoutes.php; do
            php -l "$src"
          done
          python3 -m py_compile candidate/tests/compatibility/laravel/http/run_d49_owner_topics_http.py
          echo P01_D49_SOURCE_AND_SYNTAX=PASS

      - name: Genuine Laravel Composer plus Vite self-contained FULL
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 scripts/build_p01_next_clean_full.py build \
            --source-sha 0f200e4dd3caad07a2cd4177e9bdc53b4a9b4717 \
            --output "$RUNNER_TEMP/p01-d49-full.zip" --composer composer
          python3 scripts/build_p01_next_clean_full.py verify \
            --zip "$RUNNER_TEMP/p01-d49-full.zip"
          python3 scripts/build_p01_next_cloudpanel_full.py build \
            --source-zip "$RUNNER_TEMP/p01-d49-full.zip" \
            --output "$RUNNER_TEMP/p01-d49-cloudpanel.zip"
          python3 scripts/build_p01_next_cloudpanel_full.py verify \
            --zip "$RUNNER_TEMP/p01-d49-cloudpanel.zip"
          echo P01_D49_REAL_SELF_CONTAINED_FULL_VERIFIED=PASS

      - name: Native Vue TS plus Topics Vitest and Chromium responsive Owner interactions
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate/src/app/next/frontend
          npm run typecheck
          npm run test:unit
          npx playwright install --with-deps chromium >/dev/null
          npm run test:e2e
          echo P01_D49_TOPICS_OWNER_UI_390_768_1440=PASS

      - name: Genuine MariaDB 11.8 Owner Topics cover-first catalog save read adopt update
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 candidate/tests/compatibility/laravel/http/run_d49_owner_topics_http.py \
            --bundle "$RUNNER_TEMP/p01-d49-cloudpanel.zip" --engine mariadb

      - name: Genuine SQLite Owner Topics cover-first catalog save read adopt update
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 candidate/tests/compatibility/laravel/http/run_d49_owner_topics_http.py \
            --bundle "$RUNNER_TEMP/p01-d49-cloudpanel.zip" --engine sqlite

      - name: Genuine MySQL 8.4 Owner Topics cover-first catalog save read adopt update
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 candidate/tests/compatibility/laravel/http/run_d49_owner_topics_http.py \
            --bundle "$RUNNER_TEMP/p01-d49-cloudpanel.zip" --engine mysql

      - name: Music Owner replay on SQLite (changed route registration)
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 candidate/tests/compatibility/laravel/http/run_d46_owner_music_http.py \
            --bundle "$RUNNER_TEMP/p01-d49-cloudpanel.zip" --engine sqlite
          echo P01_D49_EXISTING_MUSIC_OWNER_HTTP_REGRESSION=PASS

      - name: Reuse D45 nav and inbox HTTP regression on same selected SQLite engine
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 candidate/tests/compatibility/laravel/http/run_d45_owner_links_http.py \
            --bundle "$RUNNER_TEMP/p01-d49-cloudpanel.zip" --engine sqlite
          echo P01_D49_UNCHANGED_NAVIGATION_INBOX_CRITICAL_REGRESSION=PASS

      - name: Reuse D47 Channels on SQLite after shared Owner route integration
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 candidate/tests/compatibility/laravel/http/run_d47_owner_channels_http.py \
            --bundle "$RUNNER_TEMP/p01-d49-cloudpanel.zip" --engine sqlite
          echo P01_D49_EXISTING_CHANNELS_OWNER_HTTP_REGRESSION=PASS

      - name: D48 real Watch Owner HTTP regression after shared route registration
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 candidate/tests/compatibility/laravel/http/run_d48_owner_watch_http.py \
            --bundle "$RUNNER_TEMP/p01-d49-cloudpanel.zip" --engine sqlite
          echo P01_D49_EXISTING_WATCH_OWNER_HTTP_REGRESSION=PASS

      - name: Ephemeral private source and binary cleanup
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate
          rm -f -- "$RUNNER_TEMP/p01-d49-full.zip" "$RUNNER_TEMP/p01-d49-cloudpanel.zip"
          echo P01_D49_PRIVATE_SOURCE_PERSISTED=NO
          echo P01_D49_RELEASE_OR_TEST_ZIP_PERSISTED=NO
