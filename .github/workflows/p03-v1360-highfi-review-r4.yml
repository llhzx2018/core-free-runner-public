name: P03 V1.36.0 Flow-approved High-Fi Review R4

on:
  push:
    branches: [p03-v1360-highfi-review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  highfi-r4:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN || secrets.CORE_AGENT_RUNNER_TOKEN || secrets.VF_START_RUNNER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch exact private High-Fi review surface
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PRIVATE_READ_TOKEN:-}"
          mkdir -p p03-highfi/evidence/screenshots
          for file in index.html review.html; do
            curl -fsSL -H "Authorization: Bearer ${PRIVATE_READ_TOKEN}" -H "Accept: application/vnd.github.raw+json" \
              "https://api.github.com/repos/llhzx2018/vf-forge/contents/docs/ua-ui/high-fi/${file}?ref=prototype/v1.36.0-flow-approved-highfi" \
              -o "p03-highfi/${file}"
            test -s "p03-highfi/${file}"
          done
          sha256sum p03-highfi/index.html p03-highfi/review.html | tee p03-highfi/evidence/PROTOTYPE_SHA256.txt
          grep -F 'minmax(0,1fr)' p03-highfi/review.html >/dev/null
          grep -F '当前状态' p03-highfi/review.html >/dev/null
          echo 'PRIVATE_HIGHFI_REVIEW_FETCH=PASS' > p03-highfi/evidence/fetch-gate.txt
      - name: Install Playwright Chromium
        working-directory: p03-highfi
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@latest >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Start prototype server
        working-directory: p03-highfi
        shell: bash
        run: |
          python3 -m http.server 8765 > evidence/server.log 2>&1 &
          echo $! > evidence/server.pid
          for i in {1..20}; do curl -fsS http://127.0.0.1:8765/review.html >/dev/null && exit 0; sleep 0.5; done
          exit 1
      - name: Prepare render-safe browser harness
        shell: bash
        run: |
          cp p03/v1360-highfi/review-r3.mjs p03-highfi/review-r4.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('p03-highfi/review-r4.mjs')
          s=p.read_text(encoding='utf-8')
          old="async function waitHash(p,fragment){await p.waitForFunction(f=>location.hash.includes(f),fragment,{timeout:3000});ok(p.url().includes(fragment),`ROUTE ${fragment}`)}"
          new="async function waitHash(p,fragment){await p.waitForFunction(f=>location.hash.includes(f),fragment,{timeout:3000});await p.waitForTimeout(120);ok(p.url().includes(fragment),`ROUTE ${fragment}`)}"
          if old not in s:
              raise SystemExit('WAIT_HASH_PATCH_TARGET_MISSING')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          sha256sum p03-highfi/review-r4.mjs > p03-highfi/evidence/HARNESS_SHA256.txt
      - name: Run flow responsive cognition reverse-audit and screenshots
        working-directory: p03-highfi
        shell: bash
        run: |
          set -o pipefail
          node review-r4.mjs 2>&1 | tee evidence/browser-review.log
      - name: Evidence integrity
        if: success()
        working-directory: p03-highfi
        shell: bash
        run: |
          set -euo pipefail
          test "$(find evidence/screenshots -type f -name '*.png' | wc -l)" -eq 13
          grep -F 'TASK-V01=PASS' evidence/review-gates.txt
          grep -F 'TASK-V02=PASS' evidence/review-gates.txt
          grep -F 'TASK-V03=PASS' evidence/review-gates.txt
          grep -F 'ROUND-1_FLOW_REGRESSION=PASS' evidence/review-gates.txt
          grep -F 'ROUND-2_INFORMATION_HIERARCHY=PASS' evidence/review-gates.txt
          grep -F 'ROUND-3_PRODUCT_FEEL_MACHINE_HEURISTICS=PASS' evidence/review-gates.txt
          grep -F 'HIGHFI_BROWSER_GATE=PASS' evidence/verdict.txt
          sha256sum evidence/screenshots/*.png > evidence/SCREENSHOT_SHA256SUMS.txt
          echo 'P03_V1360_HIGHFI_REVIEW_R4=PASS' | tee evidence/final-gate.txt
      - name: Upload browser screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P03_V1.36.0_FLOW_APPROVED_HIGHFI_BROWSER_EVIDENCE_R4
          path: p03-highfi/evidence
          if-no-files-found: error
          retention-days: 3
