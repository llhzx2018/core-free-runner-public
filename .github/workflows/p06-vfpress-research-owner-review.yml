name: P06 VF Press Research Owner Review Runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p06-vfpress-research-owner-review.yml'
      - 'requests/p06-vfpress-research-owner-review-*.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p06-vfpress-research-owner-review
  cancel-in-progress: true

jobs:
  close-review-window:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout public-safe evidence repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1

      - name: Close superseded Research owner review window
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/p06/review
          cat > evidence/p06/review/P06_RESEARCH_OWNER_REVIEW_CLOSED.txt <<'EOF'
          STATUS=CLOSED_OWNER_CONTINUE
          REASON=OWNER_ACCEPTED_CURRENT_DIRECTION_AND_CONTINUED_TO_PHASE_C
          LONG_LIVED_HOSTED_RUNNER_TUNNEL=RETIRED
          SHARED_RUNNER_BLOCKING=NOT_ALLOWED
          PRODUCTION_WRITE=0
          PRIVATE_DATA_USED=NO
          USER_ACTION_REQUIRED=NO
          EOF
          git config user.name 'VF Public Runner'
          git config user.email 'vf-public-runner@users.noreply.github.com'
          git add evidence/p06/review/P06_RESEARCH_OWNER_REVIEW_CLOSED.txt
          if git diff --cached --quiet; then
            echo 'REVIEW_CLOSE_ALREADY_CURRENT=YES'
          else
            git commit -m 'evidence(P06): close Research owner review window'
            git push origin HEAD:main
          fi
          echo 'P06_RESEARCH_OWNER_REVIEW=CLOSED_OWNER_CONTINUE'
