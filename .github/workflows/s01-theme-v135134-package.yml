name: S01-C01 Theme v1.35.134 release package gate
on:
  push:
    branches: [task/s01-frontend-design-20261017]
    paths: ['.github/workflows/s01-theme-v135134-package.yml']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 5a47dd82d7bb04badcfe7fa6d0a2e43777317097
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
      - name: Exact source and theme PHP validation
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "5a47dd82d7bb04badcfe7fa6d0a2e43777317097"
          test "$(cat target/VERSION)" = "1.35.134"
          grep -q '^Version: 1.35.134$' target/src/style.css
          find target/src -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/s01-php-lint.txt
          echo "EXACT_SOURCE_PHP=PASS"
      - name: Deterministic WordPress ZIP integrity
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import zipfile,hashlib,json
          root=Path('target/src');dest=Path('vf-tools-theme_V1.35.134.zip')
          files=sorted(x for x in root.rglob('*') if x.is_file())
          assert len(files)>100
          with zipfile.ZipFile(dest,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in files:
                  name=str(PurePosixPath('vf-tools-theme') / p.relative_to(root))
                  info=zipfile.ZipInfo(name,date_time=(1980,1,1,0,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=(p.stat().st_mode & 0o777)<<16
                  z.writestr(info,p.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          with zipfile.ZipFile(dest) as z:
              assert z.testzip() is None
              assert 'vf-tools-theme/functions.php' in z.namelist()
              assert 'Version: 1.35.134' in z.read('vf-tools-theme/style.css').decode()
          receipt={'status':'PASS','version':'1.35.134','source_sha':'5a47dd82d7bb04badcfe7fa6d0a2e43777317097','file_count':len(files),'bytes':dest.stat().st_size,'sha256':hashlib.sha256(dest.read_bytes()).hexdigest(),'production':'UNTOUCHED'}
          Path('s01-theme-package-receipt.json').write_text(json.dumps(receipt,indent=2))
          print(json.dumps(receipt))
          PY
      - name: Upload private theme package for gated handoff
        uses: actions/upload-artifact@v4
        with:
          name: vf-tools-theme-v1.35.134-package
          path: |
            vf-tools-theme_V1.35.134.zip
            s01-theme-package-receipt.json
          retention-days: 7
      - name: Destroy transient private checkout
        if: always()
        run: rm -rf target
