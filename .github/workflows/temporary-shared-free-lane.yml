name: TEMP Shared Free Test — P01/P08/Private exact-source proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temporary-shared-free-lane.yml'

permissions:
  contents: read

jobs:
  p01_public_safe:
    if: github.event.pull_request.user.login == 'llhzx2018' && github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify trusted owner PR
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$AUTHOR" == llhzx2018 && "$HEAD_REPO" == llhzx2018/core-free-runner-public ]] || { echo BLOCKED_OWNER; exit 2; }

      - name: Checkout P01 source at immutable SHA without credentials persisted
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-startnew
          ref: 8463bee42e17353c094ae052363b47131c253f4e
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: transient-private-source
          persist-credentials: false
          fetch-depth: 1

      - name: Execute P01 public-safe source integrity
        shell: bash
        run: |
          set -euo pipefail
          set +x
          echo "P01_START_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cd transient-private-source
          [[ "$(git rev-parse HEAD)" == 8463bee42e17353c094ae052363b47131c253f4e ]]
          [[ -z "$(git status --porcelain)" ]]
          git fsck -q > /dev/null 2>&1
          sleep 12
          echo "P01_END_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "P01_EXACT_SOURCE_PUBLIC_SAFE=PASS"

      - name: Cleanup transient P01
        if: always()
        shell: bash
        run: rm -rf -- transient-private-source

  p08_public_safe:
    if: github.event.pull_request.user.login == 'llhzx2018' && github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify trusted owner PR
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$AUTHOR" == llhzx2018 && "$HEAD_REPO" == llhzx2018/core-free-runner-public ]] || { echo BLOCKED_OWNER; exit 2; }

      - name: Checkout P08 source at immutable SHA without credentials persisted
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-adops
          ref: 462e3dbb52ad122073ee3a614414263ffe5c2b02
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: transient-private-source
          persist-credentials: false
          fetch-depth: 1

      - name: Execute P08 public-safe source integrity
        shell: bash
        run: |
          set -euo pipefail
          set +x
          echo "P08_START_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cd transient-private-source
          [[ "$(git rev-parse HEAD)" == 462e3dbb52ad122073ee3a614414263ffe5c2b02 ]]
          [[ -z "$(git status --porcelain)" ]]
          git fsck -q > /dev/null 2>&1
          sleep 12
          echo "P08_END_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "P08_EXACT_SOURCE_PUBLIC_SAFE=PASS"

      - name: Cleanup transient P08
        if: always()
        shell: bash
        run: rm -rf -- transient-private-source

  private_adapter_machine:
    if: github.event.pull_request.user.login == 'llhzx2018' && github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify trusted owner PR
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$AUTHOR" == llhzx2018 && "$HEAD_REPO" == llhzx2018/core-free-runner-public ]] || { echo BLOCKED_OWNER; exit 2; }

      - name: Checkout Private PR #44 exact source in disposable workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/core-free-runner-private
          ref: 71eaed8d08044620db76b6ba511ba21cb1c7d385
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: transient-private-source
          persist-credentials: false
          fetch-depth: 1

      - name: Private synthetic test with no private logs
        shell: bash
        run: |
          set -euo pipefail
          set +x
          cd transient-private-source
          [[ "$(git rev-parse HEAD)" == 71eaed8d08044620db76b6ba511ba21cb1c7d385 ]]
          [[ -z "$(git status --porcelain)" ]]
          if python3 -m unittest discover -s tests -p test_shared_test_private.py > /dev/null 2>&1; then
            echo PRIVATE_ADAPTER_SOURCE_PINNED_SYNTHETIC=PASS
          else
            echo PRIVATE_ADAPTER_TEST_FAILURE_REDACTED
            exit 1
          fi
          echo PRIVATE_RAW_OUTPUT_UPLOADED=NO

      - name: Cleanup transient private adapter
        if: always()
        shell: bash
        run: rm -rf -- transient-private-source
