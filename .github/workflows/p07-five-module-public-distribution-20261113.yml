name: P07 五模块正式工具箱 - 公开制品实装及隔离回退验收
on:
  push:
    branches: [main, release/p07-five-modules-20261113]
    paths:
      - installers/p07-toolbox.sh
      - installers/p07.sh
      - installers/p07-final.sh
      - installers/p07-m05-atomic.py
      - .github/workflows/p07-five-module-public-distribution-20261113.yml
  pull_request:
    branches: [main]
    paths:
      - installers/p07-toolbox.sh
      - installers/p07.sh
      - installers/p07-final.sh
      - installers/p07-m05-atomic.py
      - .github/workflows/p07-five-module-public-distribution-20261113.yml
permissions:
  contents: read
jobs:
  official-public-release-smoke:
    if: github.repository == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact public source, one entry and all five release identities
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n installers/p07-toolbox.sh
          bash -n installers/p07.sh
          bash -n installers/p07-final.sh
          python3 -m py_compile installers/p07-m05-atomic.py
          test "$(NO_COLOR=1 bash installers/p07-toolbox.sh --version)" = '服务器工具箱 V0.1.0'
          grep -Fqx 'BUILD_ID="0.1.0-five-modules-release1"' installers/p07-toolbox.sh
          grep -Fqx 'M05_BUILD_EXPECTED="0.1.0-m05-candidate2"' installers/p07-toolbox.sh
          grep -Fqx 'M05_BUNDLE_SHA256="835356e2af2f89877e79d904f47b1ad38602983aa760978657ac4bb3c7593adb"' installers/p07-toolbox.sh
          grep -Fqx 'M05_BUNDLE_URL="https://github.com/llhzx2018/core-free-runner-public/releases/download/p07-v0.1.0-five-modules-20261113/P07-M05-0.1.0-m05-candidate2.zip"' installers/p07-toolbox.sh
          for name in '网络代理节点' '服务器性能检测' '网站与数据' '服务器维护与安全' '新服务器初始化'; do
            NO_COLOR=1 bash installers/p07-toolbox.sh --help | grep -Fq "$name"
          done
          NO_COLOR=1 bash installers/p07-toolbox.sh --modules > "$RUNNER_TEMP/p07-readonly-modules.txt"
          echo P07_FORMAL_PUBLIC_FIVE_SLOT_READONLY=PASS
      - name: Verify anonymous HTTP release download and immutable published SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          url='https://github.com/llhzx2018/core-free-runner-public/releases/download/p07-v0.1.0-five-modules-20261113/P07-M05-0.1.0-m05-candidate2.zip'
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 --max-time 70 "$url" -o "$RUNNER_TEMP/p07-m05-official.zip"
          echo "835356e2af2f89877e79d904f47b1ad38602983aa760978657ac4bb3c7593adb  $RUNNER_TEMP/p07-m05-official.zip" | sha256sum -c --status
          python3 - <<'PY'
          import json,os,zipfile,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"p07-m05-official.zip"
          with zipfile.ZipFile(p) as z:
              assert len(z.namelist())==88
              m=json.loads(z.read("p07-m05/MODULE_MANIFEST.json"))
              assert m["module_id"]=="P07-M05"
              assert m["module_build_id"]=="0.1.0-m05-candidate2"
          print("P07_M05_PUBLIC_ANONYMOUS_ZIP_SHA256=PASS")
          PY
      - name: Real root install through released public Toolbox slot 5 on disposable hosted machine
        shell: bash
        run: |
          set -Eeuo pipefail
          test ! -e /opt/vfops-modules/m01
          test ! -e /opt/vfops-modules/m02
          test ! -e /opt/vfops-modules/m04
          test ! -e /opt/vfops-modules/m05
          test ! -e /opt/vf-server-ops
          test ! -e /home/clp
          printf '5\n0\n0\n' | sudo env NO_COLOR=1 timeout 120 script -q -e \
            -c 'env NO_COLOR=1 bash installers/p07-toolbox.sh' /dev/null \
            >"$RUNNER_TEMP/p07-toolbox-real-m05.log" 2>&1 || {
              echo 'P07_RELEASE_TOOLBOX_M05_INSTALL_FAILED'
              tail -n 28 "$RUNNER_TEMP/p07-toolbox-real-m05.log" | sed -E 's/(password|token|secret)([^[:space:]]*)/[REDACTED]/Ig'
              exit 13
            }
          root=/opt/vfops-modules/m05
          test -L "$root/current"
          test "$(readlink "$root/current")" = "releases/0.1.0-m05-candidate2"
          test "$(cat "$root/current/MODULE_BUILD_ID")" = '0.1.0-m05-candidate2'
          test "$(bash "$root/current/bin/vfops-init-entry" --version)" = 'P07-M05 新服务器初始化 0.1.0-m05-candidate2'
          test ! -e /opt/vfops-modules/m01
          test ! -e /opt/vfops-modules/m02
          test ! -e /opt/vfops-modules/m04
          test ! -e /opt/vf-server-ops
          test ! -e /home/clp
          echo P07_M05_OFFICIAL_TOOLBOX_REAL_INSTALL=PASS
          echo P07_FOUR_SIBLING_MODULES_UNTOUCHED=PASS
          echo P07_CLOUDPANEL_NOT_AUTO_INSTALLED=PASS
      - name: Idempotency, bad public package rejection and isolated module recovery
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/p07-m05-official.zip"
          sha=835356e2af2f89877e79d904f47b1ad38602983aa760978657ac4bb3c7593adb
          sudo python3 -B installers/p07-m05-atomic.py install "$archive" "$sha" >/dev/null
          test "$(readlink /opt/vfops-modules/m05/current)" = releases/0.1.0-m05-candidate2
          cp "$archive" "$RUNNER_TEMP/p07-m05-corrupted.zip"
          printf X >> "$RUNNER_TEMP/p07-m05-corrupted.zip"
          if sudo python3 -B installers/p07-m05-atomic.py install "$RUNNER_TEMP/p07-m05-corrupted.zip" "$sha" >/dev/null 2>&1; then
            echo 'P07_UNSAFE_CORRUPT_PACKAGE_ACCEPTED'; exit 13
          fi
          test "$(readlink /opt/vfops-modules/m05/current)" = releases/0.1.0-m05-candidate2
          test ! -e /opt/vfops-modules/m01
          test ! -e /opt/vfops-modules/m02
          test ! -e /opt/vfops-modules/m04
          test ! -e /opt/vf-server-ops
          test ! -e /home/clp
          echo P07_M05_OFFICIAL_IDEMPOTENT_AND_FAIL_CLOSED=PASS
          echo P07_OWNER_VPS_AND_DATA_UNTOUCHED=YES
