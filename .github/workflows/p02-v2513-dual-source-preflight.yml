name: P02 V2.5.13 Dual Source Preflight

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v2513-dual-source-preflight.yml'
      - 'scripts/p02-v2513-dual-source-preflight.sh'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PRODUCT_REF: 7f0d29ef2932391ad065073fb5499af4e2ff08d3
    steps:
      - name: Require private read capability
        env:
          TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: test -n "$TOKEN"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.PRODUCT_REF }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          path: product
          fetch-depth: 0
          persist-credentials: false
      - name: Verify both plausible Production source paths
        run: bash scripts/p02-v2513-dual-source-preflight.sh
