name: P02 V2.5.13 Dual Source Preflight

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v2513-dual-source-preflight.yml'
      - 'scripts/p02-v2513-dual-source-preflight.sh'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PRODUCT_REF: 7f0d29ef2932391ad065073fb5499af4e2ff08d3
    steps:
      - name: Require private read capability
        env:
          TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: test -n "$TOKEN"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.PRODUCT_REF }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          path: product
          fetch-depth: 0
          persist-credentials: false
      - name: Verify both plausible Production source paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/p02-v2513-dual-source-preflight.sh');s=p.read_text(encoding='utf-8')
          s=s.replace('  local src="$1" out="$2" builder="$RUNNER_TEMP/build-v2513-${src}.py"','  local src="$1"; local out="$2"; local builder="$RUNNER_TEMP/build-v2513-${src}.py"')
          s=s.replace('  local src="$1" out="$2" tag="v$1" root="$RUNNER_TEMP/up-${src//./}" srcdir="$root/src" site="$root/site" pkg','  local src="$1"; local out="$2"; local tag="v$1"; local root="$RUNNER_TEMP/up-${src//./}"; local srcdir="$root/src"; local site="$root/site"; local pkg')
          s=s.replace('  install_site "$site" "18${src//./}" "P02-V2513-${src}-Preflight!"','  local port=18410; [ "$src" = "2.5.12" ] && port=18412\n  install_site "$site" "$port" "P02-V2513-${src}-Preflight!"')
          p.write_text(s,encoding='utf-8')
          PY
          bash scripts/p02-v2513-dual-source-preflight.sh
