name: P02 W3 staged 2.5.132 real FULL and app Atomic 3DB
on:
  pull_request:
    paths:
      - .github/workflows/p02-w3-25132-three-engine-exact.yml
permissions:
  contents: read
env:
  P02_EXACT_SHA: '5f408a3299fb9ceade35ccc48ed8c7a59326800c'
  P02_W3_SYNTHETIC_ONLY: '1'
jobs:
  sqlite-real-archive-and-rollback:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p02-w3-25132-three-engine-final-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact temporary private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.P02_EXACT_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p02-private
          persist-credentials: false
          fetch-depth: 1
      - name: Prepare real PHP SQLite Composer and Vue build
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C p02-private rev-parse HEAD)" = "$P02_EXACT_SHA"
          sudo apt-get update -qq > "$RUNNER_TEMP/p02-apt.log" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php-cli php-sqlite3 php-mysql php-mbstring php-xml php-curl php-zip composer sqlite3 >> "$RUNNER_TEMP/p02-apt.log" 2>&1
          php -r 'exit(PHP_VERSION_ID >= 80300 && extension_loaded("pdo_sqlite") ? 0 : 1);'
          composer --working-dir=p02-private/modern/laravel install --no-dev --no-scripts --no-plugins --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/p02-composer.log" 2>&1
          npm ci --prefix p02-private/modern/inertia-page --no-audit --no-fund > "$RUNNER_TEMP/p02-npm.log" 2>&1
          npm run build --prefix p02-private/modern/inertia-page > "$RUNNER_TEMP/p02-build.log" 2>&1
          echo P02_REAL_SQLITE_VENDOR_AND_VUE=PASS
      - name: Exact packaged clean FULL extracted site native SQLite
        shell: bash
        env:
          P02_W3_ENGINE: sqlite
        run: |
          set -Eeuo pipefail
          set +x
          cd p02-private
          python3 -B tests/integration/p02_w3_clean_full_from_bundle.py > "$RUNNER_TEMP/p02-sqlite-full.log" 2>&1 || { echo P02_SQLITE_EXTRACTED_FULL=FAIL; exit 51; }
          echo P02_SQLITE_EXTRACTED_FULL=PASS
      - name: Exact installed whole-application Atomic with SIGKILL and restore
        shell: bash
        env:
          P02_W3_ENGINE: sqlite
        run: |
          set -Eeuo pipefail
          set +x
          cd p02-private
          python3 -B tests/integration/p02_w3_app_atomic_from_bundle.py > "$RUNNER_TEMP/p02-sqlite-atomic.log" 2>&1 || { echo P02_SQLITE_ATOMIC_SIGKILL=FAIL; exit 52; }
          echo P02_SQLITE_ATOMIC_SIGKILL=PASS
      - name: Cleanup private checkout and synthetic logs
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- p02-private
          rm -f "$RUNNER_TEMP"/p02-*.log
          test ! -e p02-private
          echo P02_PRIVATE_CLEANUP_SQLITE=PASS
  sql-two-engines-real-archive-and-rollback:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p02-w3-25132-three-engine-final-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: p02_w3_disposable_only
          MYSQL_ROOT_HOST: '%'
        ports: [33306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=25
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: p02_w3_disposable_only
          MARIADB_ROOT_HOST: '%'
        ports: [33307:3306]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=25
    steps:
      - name: Checkout exact temporary private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.P02_EXACT_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p02-private
          persist-credentials: false
          fetch-depth: 1
      - name: Prepare real PHP SQL Composer Vue native drivers
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C p02-private rev-parse HEAD)" = "$P02_EXACT_SHA"
          sudo apt-get update -qq > "$RUNNER_TEMP/p02-apt.log" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php-cli php-sqlite3 php-mysql php-mbstring php-xml php-curl php-zip composer >> "$RUNNER_TEMP/p02-apt.log" 2>&1
          php -r 'exit(PHP_VERSION_ID >= 80300 && extension_loaded("pdo_mysql") && extension_loaded("pdo_sqlite") ? 0 : 1);'
          composer --working-dir=p02-private/modern/laravel install --no-dev --no-scripts --no-plugins --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/p02-composer.log" 2>&1
          npm ci --prefix p02-private/modern/inertia-page --no-audit --no-fund > "$RUNNER_TEMP/p02-npm.log" 2>&1
          npm run build --prefix p02-private/modern/inertia-page > "$RUNNER_TEMP/p02-build.log" 2>&1
          (cd p02-private && python3 -B -m unittest discover -s tests/unit -p test_p02_w3_build_atomic_candidate.py -q) > "$RUNNER_TEMP/p02-atomic-unit.log" 2>&1 || { echo P02_THREE_ENGINE_ATOMIC_UNIT=FAIL; exit 43; }
          echo P02_THREE_ENGINE_ATOMIC_UNIT=PASS
          echo P02_REAL_MYSQL_MARIADB_VENDOR_VUE=PASS
      - name: Extract and truly install MySQL 8.4 archive then full app Atomic
        shell: bash
        env:
          P02_W3_ENGINE: mysql
          P02_W3_USER: root
          P02_W3_PASS: p02_w3_disposable_only
          P02_W3_DSN: mysql:host=127.0.0.1;port=33306;dbname=p02_w3_mysql;charset=utf8mb4
        run: |
          set -Eeuo pipefail
          set +x
          cd p02-private
          python3 -B tests/integration/p02_w3_clean_full_extracted_sql.py > "$RUNNER_TEMP/p02-mysql-full.log" 2>&1 || { echo P02_MYSQL84_EXTRACTED_FULL=FAIL; exit 61; }
          echo P02_MYSQL84_EXTRACTED_FULL=PASS
          set +e
          python3 -B tests/integration/p02_w3_app_atomic_from_bundle.py > "$RUNNER_TEMP/p02-mysql-atomic.log" 2>&1
          native_rc=$?
          set -e
          if test "$native_rc" -ne 0; then echo "P02_MYSQL84_APP_ATOMIC_SIGKILL=FAIL_STAGE_$native_rc"; exit 62; fi
          echo P02_MYSQL84_APP_ATOMIC_SIGKILL=PASS
      - name: Extract and truly install MariaDB 11.8 archive then full app Atomic
        shell: bash
        env:
          P02_W3_ENGINE: mariadb
          P02_W3_USER: root
          P02_W3_PASS: p02_w3_disposable_only
          P02_W3_DSN: mysql:host=127.0.0.1;port=33307;dbname=p02_w3_mariadb;charset=utf8mb4
        run: |
          set -Eeuo pipefail
          set +x
          cd p02-private
          python3 -B tests/integration/p02_w3_clean_full_extracted_sql.py > "$RUNNER_TEMP/p02-mariadb-full.log" 2>&1 || { echo P02_MARIADB118_EXTRACTED_FULL=FAIL; exit 71; }
          echo P02_MARIADB118_EXTRACTED_FULL=PASS
          set +e
          python3 -B tests/integration/p02_w3_app_atomic_from_bundle.py > "$RUNNER_TEMP/p02-mariadb-atomic.log" 2>&1
          native_rc=$?
          set -e
          if test "$native_rc" -ne 0; then echo "P02_MARIADB118_APP_ATOMIC_SIGKILL=FAIL_STAGE_$native_rc"; exit 72; fi
          echo P02_MARIADB118_APP_ATOMIC_SIGKILL=PASS
      - name: Cleanup private checkout and synthetic logs
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- p02-private
          rm -f "$RUNNER_TEMP"/p02-*.log
          test ! -e p02-private
          echo P02_PRIVATE_CLEANUP_SQL=PASS
