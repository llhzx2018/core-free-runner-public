name: P01 V2.21.18 V2 Observer
on:
  push:
    branches: [vf-agent-operations-v1]
    paths: ['.github/workflows/p01-v2.21.18-v2-observer.yml']
permissions:
  actions: read
  contents: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    env:
      W: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      G: ${{ github.token }}
    steps:
      - shell: bash
        run: |
          python3 - <<'PY'
          import os,json,base64,urllib.request,urllib.error
          repo=os.environ['GITHUB_REPOSITORY'];h={'Authorization':'Bearer '+os.environ['G'],'Accept':'application/vnd.github+json'};u=f'https://api.github.com/repos/{repo}/actions/workflows/p01-v2.21.18-system-chrome-regression-v2.yml/runs?branch=vf-agent-operations-v1&per_page=3'
          with urllib.request.urlopen(urllib.request.Request(u,headers=h)) as r:d=json.load(r)
          p={'runs':[{k:x.get(k) for k in ['id','status','conclusion','head_sha','run_attempt']} for x in d.get('workflow_runs',[])]};c=json.dumps(p,indent=2)+'\n';t=os.environ['W'];path='vf-agent/results/P01-V2.21.18-V2-OBSERVER.json';api=f'https://api.github.com/repos/{repo}/contents/{path}';hh={'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json'};sha=None
          try:
            with urllib.request.urlopen(urllib.request.Request(api+'?ref=vf-agent-operations-v1',headers=hh)) as r:sha=json.load(r).get('sha')
          except urllib.error.HTTPError as e:
            if e.code!=404:raise
          b={'message':'evidence(P01): observe Chrome V2','content':base64.b64encode(c.encode()).decode(),'branch':'vf-agent-operations-v1'}
          if sha:b['sha']=sha
          urllib.request.urlopen(urllib.request.Request(api,data=json.dumps(b).encode(),method='PUT',headers={**hh,'Content-Type':'application/json'})).read()
          PY
