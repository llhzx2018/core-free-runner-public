name: P02 V2.5.0 Manifest Generator
on:
  pull_request:
    branches: [main]
    paths: ['p02-v250-manifest-trigger.txt']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  manifest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: task/v2.5.0-runtime-uaui
          token: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'
          path: p02
          fetch-depth: 0
          persist-credentials: false
      - name: Generate exact runtime manifest
        working-directory: p02
        run: |
          set -Eeuo pipefail
          DEPLOY="$RUNNER_TEMP/p02-v250-deploy"
          bash scripts/build-deploy-tree.sh "$DEPLOY" >/dev/null
          python3 - "$DEPLOY" "$(git rev-parse HEAD)" <<'PY'
          import sys,os,json,hashlib,datetime,base64
          root,commit=sys.argv[1:3]
          rows=[]
          for dp,_,fs in os.walk(root):
              for f in sorted(fs):
                  p=os.path.join(dp,f); rel=os.path.relpath(p,root).replace(os.sep,'/')
                  if rel.startswith('app/'): repo='src/'+rel
                  elif rel.startswith('cli/'): repo='src/'+rel
                  elif rel=='VERSION.txt': repo='VERSION'
                  else: repo='public/'+rel
                  b=open(p,'rb').read()
                  rows.append({'full_path':rel,'repo_path':repo,'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b)})
          rows.sort(key=lambda x:x['full_path'])
          data={'product':'VF Library','version':'2.5.0','schema_version':2401,'generated_at':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'),'source_commit':commit,'runtime_source_file_count':len(rows),'files':rows}
          raw=(json.dumps(data,ensure_ascii=False,indent=2)+'\n').encode()
          print('P02_MANIFEST_COMMIT='+commit)
          print('P02_MANIFEST_COUNT='+str(len(rows)))
          print('P02_MANIFEST_B64='+base64.b64encode(raw).decode())
          PY
