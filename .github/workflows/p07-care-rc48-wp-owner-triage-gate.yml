name: P07 Care rc48 owner-readable WP incident triage
on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/p07-system-care/0.1.0-rc48/**'
      - 'tests/test_p07_wp_owner_triage_rc48.py'
      - 'installers/p07-toolbox.sh'
      - 'installers/p07-system-care.sh'
      - '.github/workflows/p07-care-rc48-wp-owner-triage-gate.yml'
permissions:
  contents: read
jobs:
  bounded-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify immutable package and frozen unrelated features
        shell: bash
        run: |
          set -Eeuo pipefail
          pkg='packages/p07-system-care/0.1.0-rc48'
          test "$(cat "$pkg/VERSION")" = '0.1.0-rc48'
          test "$(git hash-object "$pkg/MANIFEST.gitblob")" = 'a393740832147180791ea4a66b81630a3c052583'
          (cd "$pkg" && while read -r hash file; do test "$(git hash-object "$file")" = "$hash"; done < MANIFEST.gitblob)
          bash -n "$pkg/intrusion-evidence.sh" "$pkg/intrusion-evidence-entry.sh" "$pkg/vf-system-care.sh"
          python3 -m py_compile "$pkg/lib/intrusion_evidence.py"
          grep -Fq "VERSION='0.1.0-rc50'" installers/p07-system-care.sh
          grep -Fq "MANIFEST_BLOB='ac2fb497b0b9b63884068d45d2f9a168bb186c71'" installers/p07-system-care.sh
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc50"' installers/p07-toolbox.sh
          grep -Fq 'VF_NODE_EXPECTED="0.1.0-rc13"' installers/p07-toolbox.sh
          grep -Fq 'VPS_AUDIT_EXPECTED="V2.1.0"' installers/p07-toolbox.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release84"' installers/p07-toolbox.sh
          echo P07_RC48_EXACT_DISTRIBUTION=PASS
      - name: 18-event WordPress owner decision and raw evidence preserved
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s tests -p test_p07_wp_owner_triage_rc48.py -v
          pkg='packages/p07-system-care/0.1.0-rc48'
          grep -Fq 'helper report --triage --page "$page"' "$pkg/intrusion-evidence.sh"
          grep -Fq 'helper report --limit 20' "$pkg/intrusion-evidence.sh"
          grep -Fq 'R 查看原始请求线索' "$pkg/intrusion-evidence.sh"
          grep -Fq '3) rebuild_baseline; pause_menu' "$pkg/intrusion-evidence.sh"
          grep -Fq 'confirm_numeric' "$pkg/intrusion-evidence.sh"
          ! grep -Fq 'run_action intrusion-evidence-entry.sh direct' "$pkg/vf-system-care.sh"
          echo P07_RC48_SAFE_TRIAGE_AND_EVIDENCE=PASS
