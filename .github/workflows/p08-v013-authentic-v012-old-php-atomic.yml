name: P08 v013 exact official 012 PHP atomic 3DB proof
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/p08-v013-authentic-v012-old-php-atomic.yml]
permissions:
  contents: read
jobs:
  authentic-old-php:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-v013-candidate-source-20261119'
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: sqlite
            image: mysql:8.4
            health: mysqladmin ping --silent
          - kind: mysql
            image: mysql:8.4
            health: mysqladmin ping --silent
          - kind: mariadb
            image: mariadb:11.8
            health: healthcheck.sh --connect --innodb_initialized
    services:
      db:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: p08-only-disposable-ci
          MYSQL_ROOT_HOST: '%'
          MARIADB_ROOT_PASSWORD: p08-only-disposable-ci
          MARIADB_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=10s
          --health-timeout=6s
          --health-retries=18
    env:
      P08_ISOLATED_INSTALL_TEST: 'YES'
      PYTHONDONTWRITEBYTECODE: '1'
      P08_TEST_DB_DRIVER: ${{ matrix.kind }}
      P08_TEST_DB_HOST: 127.0.0.1
      P08_TEST_DB_USER: root
      P08_TEST_DB_PASSWORD: p08-only-disposable-ci
      P08_TEST_DB_CLEAN: p08_013_native
      P08_TEST_DB_DIRTY: p08_013_native_dirty
    steps:
      - name: Exact target P08 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 11f1ca58849e4baf8283c33659863416e48b9c5d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
      - name: Original immutable v0.1.12 PHP client and installer tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: dac7bc1d5410c077f32e522eb5740537f618ef9d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: old
      - name: Exact one-case GOVERNANCE candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: a6e476ccc54fec29cf5264177cf65675b282d4da
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov
      - name: PHP 8.4 with native DB extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: zip,curl,mbstring,pdo_mysql,pdo_sqlite,sqlite3,openssl,posix,dom,intl,fileinfo
          coverage: none
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native DB SQL backup clients
        run: |
          set -Eeuo pipefail
          timeout 420 sudo apt-get -qq update
          timeout 420 sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y mariadb-client sqlite3
          command -v mariadb-dump && command -v sqlite3
      - name: Real official unmodified v012 FULL plus exact candidate v013 FULL/UPDATE
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C target rev-parse HEAD)" = 11f1ca58849e4baf8283c33659863416e48b9c5d
          test "$(git -C old rev-parse HEAD)" = dac7bc1d5410c077f32e522eb5740537f618ef9d
          test "$(git -C gov rev-parse HEAD)" = a6e476ccc54fec29cf5264177cf65675b282d4da
          tmp="$RUNNER_TEMP/p08-v013-authentic-${{ matrix.kind }}"
          mkdir -m 700 "$tmp"
          curl -fsSL --retry 2 --max-time 100 \
            -H "Authorization: Bearer $READ_TOKEN" \
            -H 'Accept: application/octet-stream' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/llhzx2018/vf-adops/releases/assets/766931640 \
            -o "$tmp/official-v012-full.zip"
          test "$(stat -c %s "$tmp/official-v012-full.zip")" = 8363606
          test "$(sha256sum "$tmp/official-v012-full.zip" | cut -d' ' -f1)" = 721aaad6ae41d1faedff80f06a78320d3bb86faf26ccd0f4917e5d4a2d94cca6
          unzip -p "$tmp/official-v012-full.zip" FULL_MANIFEST.json > "$tmp/old-manifest.json"
          test "$(sha256sum "$tmp/old-manifest.json" | cut -d' ' -f1)" = 4df28b7a9dcfbaf4c0bec18009955fe1b0c7764ccfe94f4257ae2ca0dc3794cc
          cd target
          npm ci --no-audit --no-fund
          npm run build
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          python3 scripts/check_stack_contract.py --phase full
          git diff --exit-code
          git diff --cached --exit-code
          mapfile -t generated < <(git ls-files --others --exclude-standard)
          for file in "${generated[@]}"; do
            case "$file" in
              bootstrap/cache/packages.php|bootstrap/cache/services.php)
                test -f "$file" && ! test -L "$file" && rm -- "$file" ;;
              *) echo 'P08_013_UNTRUSTED_BUILD_OUTPUT_REFUSED'; exit 31 ;;
            esac
          done
          test -z "$(git status --porcelain --untracked-files=all)"
          python3 scripts/build_full.py --source "$PWD" --output "$tmp/v013-full.zip" \
            --version 0.1.13 --source-sha 11f1ca58849e4baf8283c33659863416e48b9c5d \
            --governance-root "$GITHUB_WORKSPACE/gov"
          python3 scripts/build_atomic.py --source "$PWD" --output "$tmp/v013-update.zip" \
            --source-version 0.1.12 --source-sha dac7bc1d5410c077f32e522eb5740537f618ef9d \
            --source-full-manifest-sha256 4df28b7a9dcfbaf4c0bec18009955fe1b0c7764ccfe94f4257ae2ca0dc3794cc \
            --previous-full-manifest "$tmp/old-manifest.json" \
            --target-version 0.1.13 --target-sha 11f1ca58849e4baf8283c33659863416e48b9c5d
          test "$(sha256sum "$tmp/v013-full.zip" | cut -d' ' -f1)" = 66ce5a6b081d218ed54a8ec9903f0544dba577525398f23f3f630ad855367d25
          test "$(sha256sum "$tmp/v013-update.zip" | cut -d' ' -f1)" = f8dea861db4b7211a27a94c1fadd880f92a35c2bb8bb3ec42c91b261aa356900
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "P08_013_AUTHENTIC_ORIGIN_AND_REAL_CANDIDATE_PACKAGES=${{ matrix.kind }}:PASS"
      - name: Original v012 installed PHP applies true v013 code-only with native backup
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          tmp="$RUNNER_TEMP/p08-v013-authentic-${{ matrix.kind }}"
          site="$RUNNER_TEMP/p08-r129-real-issued-r131-r155-${{ matrix.kind }}-first"
          mkdir -m 700 "$site"
          unzip -q "$tmp/official-v012-full.zip" -d "$site"
          mkdir -p "$site/tests/compatibility"
          cp old/tests/test_install_sqlite_e2e.php old/tests/test_install_mysql_e2e.php "$site/tests/"
          cp old/tests/compatibility/r101_complete_schema.php "$site/tests/compatibility/"
          if [ "${{ matrix.kind }}" = sqlite ]; then
            php "$site/tests/test_install_sqlite_e2e.php"
          else
            mariadb -h127.0.0.1 -uroot -p"$P08_TEST_DB_PASSWORD" -e \
              'CREATE DATABASE p08_013_native; CREATE DATABASE p08_013_native_dirty; CREATE TABLE p08_013_native_dirty.synthetic_dirty(id integer primary key);'
            php "$site/tests/test_install_mysql_e2e.php"
          fi
          test "$(readlink "$site/current")" = "releases/dac7bc1d5410c077f32e522eb5740537f618ef9d"
          test "$(cat "$site/current/VERSION")" = 0.1.12
          test "$(sha256sum "$site/current/FULL_MANIFEST.json" | cut -d' ' -f1)" = 4df28b7a9dcfbaf4c0bec18009955fe1b0c7764ccfe94f4257ae2ca0dc3794cc
          token="$site/storage/app/private/adops/upgrade/github-read-token"
          mkdir -p "$(dirname "$token")"
          printf 'github_pat_%s\n' "$(printf '%040d' 0 | tr 0 Q)" > "$token"
          chmod 0600 "$token"
          media="$site/storage/app/private/adops/r202-media-proof.bin"
          printf 'SYNTHETIC_013_MEDIA_ONLY\n' > "$media"
          chmod 0600 "$media"
          P08_R205_CHAINED=YES php old/tests/compatibility/r205_chained_atomic_apply.php \
            "$site" dac7bc1d5410c077f32e522eb5740537f618ef9d \
            4df28b7a9dcfbaf4c0bec18009955fe1b0c7764ccfe94f4257ae2ca0dc3794cc \
            "$tmp/v013-update.zip" 11f1ca58849e4baf8283c33659863416e48b9c5d 0.1.13
          test "$(readlink "$site/current")" = "releases/11f1ca58849e4baf8283c33659863416e48b9c5d"
          cmp <(unzip -p "$tmp/v013-full.zip" FULL_MANIFEST.json) "$site/current/FULL_MANIFEST.json"
          echo "P08_013_AUTHENTIC_012_OLD_PHP_3DB_ATOMIC_OWNER_MEDIA_BACKUP=${{ matrix.kind }}:PASS"
      - name: Secure cleanup of original old PHP, source, files and SQL fixtures
        if: always()
        run: |
          rm -rf -- target old gov "$RUNNER_TEMP/p08-v013-authentic-${{ matrix.kind }}" \
            "$RUNNER_TEMP/p08-r129-real-issued-r131-r155-${{ matrix.kind }}-first"
          test ! -e target && test ! -e old && test ! -e gov
          echo "P08_013_AUTHENTIC_OLD_PHP_PRIVATE_CLEANUP=${{ matrix.kind }}:PASS"
