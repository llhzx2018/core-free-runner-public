name: P07 RC4 精确版本独立终检

on:
  push:
    branches:
      - experiment/p07-oneshot-bench-v05
    paths:
      - .github/workflows/p07-rc4-independent-gate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d450c0397639ca9bcb700b2a654fca9fec7204c8

      - name: 精确版本身份与自检
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "d450c0397639ca9bcb700b2a654fca9fec7204c8"
          grep -Fq 'VERSION="1.0.0-rc4-zh"' experiments/p07-bench.sh
          bash -n experiments/p07-bench.sh
          experiments/p07-bench.sh --self-test

      - name: 中文一键界面终检
        run: |
          set -euo pipefail
          out="$(P07_BENCH_FORCE_FALLBACK=1 experiments/p07-bench.sh --demo)"
          printf '%s\n' "$out"
          grep -q 'P07 VPS 一键验机' <<<"$out"
          grep -q '全球备用覆盖       : 6 个地区正常' <<<"$out"
          grep -q '中国香港' <<<"$out"
          grep -q '新加坡' <<<"$out"
          grep -q '日本·东京' <<<"$out"
          grep -q '中国大陆访问评估' <<<"$out"
          ! grep -Eq '^[[:space:]]*(US West|US East|Europe|Hong Kong|Singapore|Tokyo)[[:space:]]' <<<"$out"
          ! grep -Eq '[[:space:]](PASS|FAIL|RATE_LIMITED|BACKEND_FAILURE|SPEEDTESTGO_FALLBACK|LIBRESPEED_FALLBACK)[[:space:]]' <<<"$out"

      - name: 精确版本真实备用测速复核
        run: |
          set -euo pipefail
          mkdir -p /tmp/p07-rc4-home
          HOME=/tmp/p07-rc4-home P07_BENCH_FORCE_FALLBACK=1 P07_BENCH_IO_MIB=64 experiments/p07-bench.sh | tee /tmp/p07-rc4-real.txt
          grep -q '全球备用覆盖' /tmp/p07-rc4-real.txt
          REPORT="$(find /tmp/p07-rc4-home/.local/state/p07-bench/reports -name '*.json' -type f | sort | tail -n1)"
          python3 - "$REPORT" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          rows=d.get('network_nodes',[])
          ok=[r for r in rows if r.get('state')=='PASS' and r.get('reason') in ('SPEEDTESTGO_FALLBACK','LIBRESPEED_FALLBACK')]
          names={r.get('name') for r in ok}
          print('exact_rc4_fallback_regions=', sorted(names))
          assert len(names) >= 5
          assert ({'US West','US East','US Central'} & names)
          assert 'Europe' in names
          assert ({'Hong Kong','Singapore','Asia South','Tokyo'} & names)
          PY
