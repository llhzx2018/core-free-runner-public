name: p01-v24738-bind-temp

on:
  push:
    branches:
      - run/p01-v24738-bind

permissions:
  contents: read

jobs:
  bind-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: b86c11d7b93521221c3731b6f93504ef212ad20e
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: target
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout verified engineering base
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: 6452665ae997930707720d9791cef01ec4af5eac
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: base
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd,opcache
          coverage: none

      - name: Exact bind scope and contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "b86c11d7b93521221c3731b6f93504ef212ad20e"
          test "$(git -C base rev-parse HEAD)" = "6452665ae997930707720d9791cef01ec4af5eac"
          test "$(tr -d '\r\n ' < target/VERSION)" = "2.47.38"
          test "$(tr -d '\r\n ' < target/src/VERSION.txt)" = "2.47.38"
          grep -Fq "define('VF_VERSION', '2.47.38');" target/src/app/bootstrap.php
          test "$(tr -d '\r\n ' < base/VERSION)" = "2.47.37"
          test -f target/docs/release/V2.47.38_RELEASE_GATE.md
          mapfile -t changed < <(git -C target diff --name-only 6452665ae997930707720d9791cef01ec4af5eac..b86c11d7b93521221c3731b6f93504ef212ad20e | sort)
          test "${#changed[@]}" = 4
          printf '%s\n' "${changed[@]}" >/tmp/p01-v24738-bind-files.txt
          grep -Fxq VERSION /tmp/p01-v24738-bind-files.txt
          grep -Fxq src/VERSION.txt /tmp/p01-v24738-bind-files.txt
          grep -Fxq src/app/bootstrap.php /tmp/p01-v24738-bind-files.txt
          grep -Fxq docs/release/V2.47.38_RELEASE_GATE.md /tmp/p01-v24738-bind-files.txt
          find target/src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find target/src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          cd target
          php tests/unit/admin_data_safety_r14_runtime_retention_contract.php
          php tests/unit/admin_data_safety_r13_contract.php
          php tests/unit/admin_data_closure_contract.php
          php tests/unit/admin_navigation_consistency_contract.php
          php tests/unit/admin_secondary_nav_focus_contract.php
          php tests/unit/admin_backend_closure_contract.php
          grep -Fq 'OWNER_PREVIEW_RUNTIME_APPLICABILITY = N_A' docs/release/V2.47.38_RELEASE_GATE.md
          grep -Fq 'NO_UNKNOWN_APPLICABILITY = YES' docs/release/V2.47.38_RELEASE_GATE.md
          grep -Fq 'PRE_RELEASE_AUTHORITY_DRIFT_GATE = PASS' docs/release/V2.47.38_RELEASE_GATE.md
          echo P01_V24738_BIND_SCOPE_CONTRACTS=PASS

      - name: Fresh install authenticated data-safety smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          TEST_PASSWORD=$(python3 -c "import secrets; print('Aa1!'+secrets.token_urlsafe(24))")
          echo "::add-mask::$TEST_PASSWORD"
          rm -rf /tmp/p01-v24738-runtime
          cp -a target/src /tmp/p01-v24738-runtime
          cd /tmp/p01-v24738-runtime
          php -S 127.0.0.1:18129 -t . >/tmp/p01-v24738-server.log 2>&1 &
          echo $! >/tmp/p01-v24738.pid
          for i in $(seq 1 30); do
            if curl -fsS -c /tmp/p01-v24738.cookies -b /tmp/p01-v24738.cookies http://127.0.0.1:18129/setup.php -o /tmp/p01-v24738-setup.html; then break; fi
            sleep 1
          done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-v24738-setup.html',encoding='utf-8').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s)
          assert m
          print(m.group(1))
          PY
          )
          curl -fsS -c /tmp/p01-v24738.cookies -b /tmp/p01-v24738.cookies -X POST http://127.0.0.1:18129/setup.php \
            --data-urlencode "setup_csrf=$CSRF" \
            --data-urlencode 'site_title=VF V24738' \
            --data-urlencode "admin_password=$TEST_PASSWORD" \
            --data-urlencode "admin_password_confirm=$TEST_PASSWORD" \
            -o /tmp/p01-v24738-setup-post.html
          php cli/verify.php | tee /tmp/p01-v24738-verify.txt
          grep -Fx 'VERIFY_PASS=YES' /tmp/p01-v24738-verify.txt
          php cli/baseline-verify.php | tee /tmp/p01-v24738-baseline.txt
          grep -Fx 'BASELINE_CORE_PASS=YES' /tmp/p01-v24738-baseline.txt
          grep -Fx 'BASELINE_FULL_PASS=YES' /tmp/p01-v24738-baseline.txt

          TEST_PASSWORD="$TEST_PASSWORD" python3 - <<'PY' >/tmp/p01-v24738-login.json
          import json,os
          print(json.dumps({"password":os.environ["TEST_PASSWORD"]}))
          PY
          curl -fsS -c /tmp/p01-v24738.cookies -b /tmp/p01-v24738.cookies -H 'Content-Type: application/json' \
            -X POST 'http://127.0.0.1:18129/api.php?action=login' --data-binary @/tmp/p01-v24738-login.json             -o /tmp/p01-v24738-login-result.json
          grep -F '"ok":true' /tmp/p01-v24738-login-result.json >/dev/null

          curl -fsS -c /tmp/p01-v24738.cookies -b /tmp/p01-v24738.cookies 'http://127.0.0.1:18129/data-safety.php' -o /tmp/p01-v24738-data.html
          grep -F 'id="summary">正在读取备份状态' /tmp/p01-v24738-data.html >/dev/null
          grep -F '<details class="vf-data-settings" id="backupPolicyDetails">' /tmp/p01-v24738-data.html >/dev/null
          grep -F 'vf-disaster-tools' /tmp/p01-v24738-data.html >/dev/null
          grep -F 'vf-history-tools' /tmp/p01-v24738-data.html >/dev/null
          grep -F 'asset.php?file=data-recovery.js&amp;v=2.47.38' /tmp/p01-v24738-data.html >/dev/null
          curl -fsS -c /tmp/p01-v24738.cookies -b /tmp/p01-v24738.cookies 'http://127.0.0.1:18129/asset.php?file=data-recovery.js&v=2.47.38' -o /tmp/p01-v24738-data.js
          grep -F 'class="vf-data-safety-state ' /tmp/p01-v24738-data.js >/dev/null
          grep -F 'class="vf-data-row-more"><summary>更多</summary>' /tmp/p01-v24738-data.js >/dev/null
          grep -F '恢复这份备份' /tmp/p01-v24738-data.js >/dev/null
          grep -F '执行完整恢复' /tmp/p01-v24738-data.js >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          x=Path('/tmp/p01-v24738-data.js').read_text(encoding='utf-8')
          assert "$$('[data-verify]').forEach" in x
          assert "$$('[data-dr-restore]').forEach" in x
          assert '不参与自动清理' in x
          print('P01_V24738_DATA_SAFETY_RUNTIME=PASS')
          PY
          grep -F '受保护恢复点不会自动清理' /tmp/p01-v24738-data.html >/dev/null
          echo P01_V24738_BIND_AUTH_SMOKE=PASS

      - name: Verdict
        run: |
          echo P01_V24738_BOUND_CANDIDATE_GATE=PASS
          echo ENGINEERING_GATE=35497034328
          echo SCHEMA=2026090401
          echo MIGRATION=NONE
          echo PRODUCTION_BACKUP_DELETE=NONE
          echo RETENTION_BEHAVIOR=UNCHANGED
          echo PRODUCTION=NOT_WRITTEN

      - name: Cleanup
        if: always()
        run: |
          if [ -f /tmp/p01-v24738.pid ]; then kill "$(cat /tmp/p01-v24738.pid)" 2>/dev/null || true; fi
          rm -rf target base /tmp/p01-v24738-*
