name: P07 Release8 Terminal UX Distribution Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'installers/p07.sh'
      - 'installers/p07-final.sh'
      - 'installers/p07-toolbox.sh'
      - 'dist/p07/0.1.0/overlay/**'
      - '.github/workflows/p07-release8-terminal-ux-distribution-gate.yml'

permissions:
  contents: read

jobs:
  distribution-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Release8 identity
        run: |
          set -Eeuo pipefail
          test "$(cat dist/p07/0.1.0/overlay/BUILD_ID)" = '0.1.0-release8'
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release8"' installers/p07-toolbox.sh
          grep -Fq 'EXPECTED_BUILD_ID="0.1.0-release8"' installers/p07-final.sh
          grep -Fq 'RUNTIME_MANIFEST_BLOB="e7cee6c3614c00a51598f3ec2b4a57ccc9f344e4"' installers/p07-final.sh
          grep -Fq 'EXPECTED_BLOB="73fff27c1d9ca6d8c757813723228680495b05fc"' installers/p07.sh

      - name: Verify runtime manifest
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('dist/p07/0.1.0/overlay')
          def blob(path):
              data=path.read_bytes()
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          for line in (root/'RUNTIME.gitblob').read_text().splitlines():
              if not line.strip():
                  continue
              h,p=line.split('  ',1)
              path=root/p
              assert path.is_file(), p
              assert blob(path)==h, (p,blob(path),h)
          PY

      - name: Terminal UX V2 product contract
        run: |
          set -Eeuo pipefail
          python3 dist/p07/0.1.0/overlay/tests/test_terminal_ui_color_contract.py
          python3 dist/p07/0.1.0/overlay/tests/test_main_menu_routes.py
          grep -Fq 'ui_page()' dist/p07/0.1.0/overlay/lib/terminal_ui.sh
          grep -Fq "ui_page 'P07 · 备份网站'" dist/p07/0.1.0/overlay/bin/vfops-site-ui
          grep -Fq "ui_page 'P07 · 恢复网站'" dist/p07/0.1.0/overlay/bin/vfops-site-ui
          grep -Fq "ui_page 'P07 · 服务器迁移'" dist/p07/0.1.0/overlay/bin/vfops-migrate-ui
          grep -Fq "ui_page 'P07 · 自动备份 / 远程灾备'" dist/p07/0.1.0/overlay/bin/vfops-auto-backup
          grep -Fq "ui_page 'P07 · CloudPanel 管理'" dist/p07/0.1.0/overlay/bin/vfops-cloudpanel-ui
          grep -Fq 'Terminal UX System V2' dist/p07/0.1.0/overlay/docs/authority/RPD.md

      - name: Toolbox child-screen isolation
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          t=Path('installers/p07-toolbox.sh').read_text(encoding='utf-8')
          for fn in ('run_network_node()', 'run_vps_audit()', 'run_server_ops()', 'run_system_care()'):
              i=t.index(fn)
              body=t[i:i+300]
              assert 'screen_clear' in body, fn
          PY

      - name: Lazy installer and isolated upgrade
        run: |
          set -Eeuo pipefail
          ! grep -Fq 'guided-init' installers/p07-final.sh
          ! grep -Eq 'apt-get install.*(rclone|openssh-client|rsync)' installers/p07-final.sh
          root="$PWD"
          tmp="$(mktemp -d)"
          export P07_PUBLIC_ROOT="file://$root"
          export P07_INSTALL_DIR="$tmp/install"
          export P07_PREVIOUS_DIR="$tmp/previous"
          export P07_BIN_LINK="$tmp/vfops"
          export P07_ALLOW_NONROOT=1
          export P07_NO_EXEC=1
          bash installers/p07-final.sh >"$tmp/install.log"
          test "$("$tmp/vfops" --version)" = 'VF Server Ops 0.1.0'
          test "$("$tmp/vfops" --build-id)" = '0.1.0-release8'
          bash installers/p07-final.sh >"$tmp/second.log"
          grep -Fq '已是当前版本，无需下载或重复安装' "$tmp/second.log"

      - name: Syntax and safety boundary
        run: |
          set -Eeuo pipefail
          bash -n installers/p07.sh
          bash -n installers/p07-final.sh
          bash -n installers/p07-toolbox.sh
          echo 'P07_RELEASE8_TERMINAL_UX_DISTRIBUTION_GATE=PASS'
          echo 'P07_PRODUCTION_WRITE=NOT_RUN'
          echo 'P07_DNS_WRITE=NOT_RUN'
          echo 'P07_SOURCE_DELETE=NOT_RUN'
