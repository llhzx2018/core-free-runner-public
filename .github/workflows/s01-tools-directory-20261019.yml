name: S01-C01 English tools directory bounded UX and SEO
on:
  push:
    branches: [task/s01-frontend-design-20261017]
    paths: ['.github/workflows/s01-tools-directory-20261019.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: runner
      - name: Pin the real browser validation lane
        run: |
          set -Eeuo pipefail
          mkdir proof
          cp -a runner/lanes/s01-frontend-design-20261017 lane
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 9aea11c9faea1d4f4f92848ec39050462c52573b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact candidate boundary and owner-to-bundle identity
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = 9aea11c9faea1d4f4f92848ec39050462c52573b
          test "$(cat target/VERSION)" = 1.35.135
          python3 - <<'PY'
          import pathlib,subprocess
          root=pathlib.Path('target')
          parent='70a8574d8bc80e0ca392ab5697a408dc2040f622'
          changes=subprocess.check_output(['git','-C','target','diff','--name-only',parent,'HEAD'],text=True).splitlines()
          names=['src/assets/css/public/pages/families/public-family-02-tool-directory-detail-operations-closure.css','src/assets/css/public/vf-theme-public-runtime.css']
          assert sorted(changes)==sorted(names),changes
          oldowner=subprocess.check_output(['git','-C','target','show',parent+':'+names[0]],text=True)
          oldbundle=subprocess.check_output(['git','-C','target','show',parent+':'+names[1]],text=True)
          owner=(root/names[0]).read_text()
          bundle=(root/names[1]).read_text()
          assert oldbundle.count(oldowner)==1
          assert bundle==oldbundle.replace(oldowner,owner,1)
          assert 'vf-directory-tool-card h4{' in owner
          assert owner.count('S01-C01 tools directory desktop polish')==1
          print('DIRECTORY_OWNER_RUNTIME_CSS_SYNC_AND_SCOPE=PASS')
          PY
          php -l target/src/inc/modules/module-tool-grid.php
          node --check lane/r15-directory-check.cjs
          node --check lane/r10-technical-head.cjs
      - name: Real Provider fixture for seeded tool routes
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p provider
          gh release download v1.25.91 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.91.zip --dir provider
          echo 'fcb56d605550c5b04a3ff8b3b78b8bf86ca11b77e0aa22334fa67e675b01d6df  provider/vf-tools-m3u8_V1.25.91.zip' | sha256sum -c
      - name: Desktop Chromium dependencies
        run: |
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -g -fsSL --retry 2 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC[wght].ttf' -o "$HOME/.local/share/fonts/NotoSansSC.ttf"
          fc-cache -f
      - name: Real ephemeral WordPress/MariaDB tool directory and SEO
        env:
          BASE_SHA: 70a8574d8bc80e0ca392ab5697a408dc2040f622
          TARGET_SHA: 9aea11c9faea1d4f4f92848ec39050462c52573b
          VF_REVIEW_ONLY_STATE: '1'
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          content=Path('lane/native.sh').read_text()
          needle='cli eval-file /tmp/snapshot.php > proof/state-after.sha256'
          assert content.count(needle)==1
          scripts='node lane/r15-directory-check.cjs\nnode lane/r10-technical-head.cjs\n'
          Path('lane/native-directory.sh').write_text(content.replace(needle,scripts+needle))
          PY
          bash lane/native-directory.sh
      - name: Remove private transient source and ZIP
        if: always()
        run: rm -rf target provider
