name: S01 test links exact package lifecycle
on:
  push:
    branches: [task/s01-test-links-current-proof-20261102]
    paths: ['.github/workflows/s01-test-links-lifecycle-20261102.yml']
permissions:
  contents: read
  actions: read
jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 02d4591eed025a3d3a67bc0a150b3ddc448c2ab8
          persist-credentials: false
          path: established
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7a0fe3c12137bdeab82ddcd79d2deffed96c35dd
          persist-credentials: false
          path: prior
      - uses: actions/download-artifact@v4
        with:
          name: s01-iptv-41373522516
          path: provider
          run-id: 41373522516
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run isolated install, upgrade, rollback and repeat
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof
          gh release download v1.35.223 --repo llhzx2018/vf-tools-theme --pattern vf-tools-theme_V1.35.223.zip --dir provider
          echo '5ea5dbc5fda6a2f7ba0b318bb04f75cea2ab22e02ef88c39d9adf2a64c1f2221  provider/vf-tools-theme_V1.35.223.zip' | sha256sum -c
          gh release download v1.25.98 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.98.zip --dir provider
          echo '8804951ff582ab02e237e12a3bdefeb167c115f08b095ff7927921c8f1bffaf9  provider/vf-tools-m3u8_V1.25.98.zip' | sha256sum -c
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          cp -a established/lanes/s01-frontend-design-20261017 lane
          bash control/lanes/s01-test-links-browser/lifecycle.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: segment-lifecycle-${{ github.run_id }}
          path: proof/
          retention-days: 7

# Verify the expected version option transition independently.
