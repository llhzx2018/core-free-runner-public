name: S01-C02 title restore candidate
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: fixture-root
          MARIADB_DATABASE: vf_title
          MARIADB_USER: vf
          MARIADB_PASSWORD: vf-fixture-db
        ports: ["3306:3306"]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      TARGET_REPO: llhzx2018/vf-tools-ops
      TARGET_VERSION: 1.21.1031
      TARGET_SHA: 9cb852ddec4cbbf06719081412a5b48a74dd5679
      TARGET_TREE: cbd0a0e3e6227d8cf6650c1cdeac2a434588e76e
      BASE_SHA: 4ea70ae0e705ac4aabe82bada09bf1486c046e64
      BASE_VERSION: 1.21.1030
      GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Lane identity preflight
        run: python3 scripts/ephemeral_lane_spec.py audit-rendered --spec lane/spec.json --input .github/workflows/temp-s01-title-restore.yml
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 9cb852ddec4cbbf06719081412a5b48a74dd5679
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: target
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 4ea70ae0e705ac4aabe82bada09bf1486c046e64
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: baseline
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, zip, sodium
      - name: Exact identity and unchanged functional source
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(cat target/VERSION)" = "$TARGET_VERSION"
          php target/tests/s01-c02-1211030-tool-mount-freshness-unit.php
          php target/tests/s01-c02-1211025-content-freshness-unit.php
          php target/tests/s01-c02-121934-shell-header-visual-lock-r45-contract.php
          for p in includes/content-workflow/scanner.php includes/content-workflow/service.php includes/admin-v13/views/content_workflow_v6.php includes/views/admin-shell-tabs-parts/02-shell-navigation.php assets/js/admin-s01-page-frame-r18.js includes/wp-update; do diff -rq "baseline/$p" "target/$p"; done
          find target -type f -name '*.php' -print0 | xargs -0 -n1 php -l > /tmp/title-lint.txt
          echo PHP_83_SYNTAX=PASS
      - name: Browser with actual source and shared runtime cascade
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/title-node && cd /tmp/title-node
          npm init -y >/dev/null
          npm install --no-save playwright@1.58.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          export NODE_PATH=/tmp/title-node/node_modules
          cd "$GITHUB_WORKSPACE"
          cp target/tests/s01-c02-1211031-title-* baseline/tests/
          if node baseline/tests/s01-c02-1211031-title-cascade-browser-proof.js > evidence/baseline.json; then echo BASELINE_NOT_DETECTED; exit 1; fi
          jq -e '.failures|any(.case=="unique-visible-title")' evidence/baseline.json
          node target/tests/s01-c02-1211031-title-cascade-browser-proof.js > evidence/browser.json
          jq -e '.pass==true and (.failures|length)==0' evidence/browser.json
      - name: Exact package and current channel readback
        run: |
          set -Eeuo pipefail
          python3 target/.github/release/build-ops-package.py --source target --output "$RUNNER_TEMP/vf-tools-ops_V$TARGET_VERSION.zip" > package.json
          cp "$RUNNER_TEMP/vf-tools-ops_V$TARGET_VERSION.zip" candidate.zip
          gh release download "v$BASE_VERSION" --repo "$TARGET_REPO" --pattern "vf-tools-ops_V$BASE_VERSION.zip" --dir previous
          cp "previous/vf-tools-ops_V$BASE_VERSION.zip" baseline.zip
          test "$(sha256sum baseline.zip | cut -d' ' -f1)" = 9d7c60b29260d5d3953b6d0521a9d2813d685f65edbb45483922aa33b8836408
          gh api -H 'Accept: application/vnd.github.raw+json' repos/llhzx2018/core-updates/contents/projects/S01-C02.json?ref=main > channel.json
          cp package.json evidence/package.json
      - name: Native upgrade, actual WordPress browser and source rollback
        env:
          NODE_PATH: /tmp/title-node/node_modules
        run: bash lane/title-native.sh
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s01-title-restore
          path: evidence/
          retention-days: 30

