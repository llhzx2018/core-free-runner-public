name: P08 #77 archived previous success real old-cycle test under PHP 8.4
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p08-r217-archived-success-handoff.yml
permissions:
  contents: read
jobs:
  archived-success-handoff:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-r217-owner-archive-handoff-20261119' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact draft P08 #77 source from private repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 6bbf6e83e32ebb1e74d39cc9b4246cbefcb6e1c4
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p08
      - name: PHP 8.4 strict client
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip,curl,mbstring,openssl,pdo_mysql,pdo_sqlite,posix,fileinfo
          coverage: none
      - name: Source and isolated archiver real positive/negative native fixtures
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(id -u)" -ne 0
          test "$(git -C p08 rev-parse HEAD)" = 6bbf6e83e32ebb1e74d39cc9b4246cbefcb6e1c4
          test "$(cat p08/VERSION)" = 0.1.12
          php -l p08/src/Upgrade/OwnerPreviousCycleArchive.php
          php -l p08/tests/test_owner_previous_cycle_archive.php
          php p08/tests/test_owner_previous_cycle_archive.php
          php p08/tests/test_owner_future_repeat_cycle.php
          test -z "$(git -C p08 status --porcelain --untracked-files=all)"
          echo P08_R217_ARCHIVED_SUCCESS_HANDOFF_ROOTLESS_PHP84=PASS
      - name: Erase temporary private checkout
        if: always()
        shell: bash
        run: |
          rm -rf -- p08
          test ! -e p08
          echo P08_R217_PRIVATE_TEST_WORKTREE_DISPOSED=PASS
