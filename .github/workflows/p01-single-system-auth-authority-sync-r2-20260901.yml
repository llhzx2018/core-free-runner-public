name: P01 Single System Auth Authority Sync R2
on:
  push:
    branches: [temp/p01-single-system-auth-model-20260901]
    paths: [.github/workflows/p01-single-system-auth-authority-sync-r2-20260901.yml]
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-free-runner-public
          ref: temp/p01-single-system-auth-model-20260901
          path: runner
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: authority/p01-single-system-auth-model-restore-20260901
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01
      - name: Sync and fence Authority
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p01
          BASE='2b60b27c1e5cb53f841e9e7f0c8e521bacba1030'
          test "$(git rev-parse HEAD)" = "$BASE"
          python3 ../runner/scripts/p01_single_auth_authority_sync.py
          python3 -m json.tool VF_PROJECT.json >/dev/null
          git diff --check
          git add -N docs/evidence/P01_SINGLE_SYSTEM_AUTH_MODEL_RESTORE_20260901.md
          actual="$(git diff --name-only | sort | tr '\n' ' ')"
          expected='VF_PROJECT.json docs/authority/CURRENT.md docs/evidence/P01_SINGLE_SYSTEM_AUTH_MODEL_RESTORE_20260901.md docs/handoff/CURRENT_STATE.md '
          test "$actual" = "$expected"
          test -z "$(git diff --name-only -- src/)"
          git add VF_PROJECT.json docs/authority/CURRENT.md docs/handoff/CURRENT_STATE.md docs/evidence/P01_SINGLE_SYSTEM_AUTH_MODEL_RESTORE_20260901.md
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git commit -m 'docs(P01): restore single-system auth authority'
          echo "AUTH_SOURCE=$(git rev-parse HEAD)"
          echo "AUTH_TREE=$(git rev-parse HEAD^{tree})"
          echo "RUNTIME_TREE=$(git rev-parse HEAD:src)"
          git push origin HEAD:authority/p01-single-system-auth-model-restore-20260901
