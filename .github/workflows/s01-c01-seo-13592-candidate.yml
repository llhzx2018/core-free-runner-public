name: S01-C01 SEO exact candidate
on:
  push:
    branches: [task/s01-c01-seo-13592-candidate]
permissions:
  contents: read
  actions: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_REPO: 'llhzx2018/vf-tools-theme'
      TARGET_VERSION: '1.35.92'
      TARGET_SHA: 'fc3f078f0fa59fd8029dbf1c4a38cc23ea810789'
      TARGET_TREE: '87e6573770070cb7bdcf46be57588305b06c28c8'
      SOURCE_VERSION: '1.35.91'
      BASE_SHA: 'a9bd60c080d57fd7872fd2d5aadd9fb34b210ef2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact identity and focused contracts
        run: |
          set -Eeuo pipefail
          cp -a runner/lanes/s01-c01-seo-13592 lane
          mkdir -p proof
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find target/src -type f -name '*.php' -print0)
          php target/tests/seo-workflow-v4-contract.php
          cp target/tests/tool-sitemap-policy-contract.php /tmp/seo-policy-contract.php
          git -C target checkout "$BASE_SHA" -- src/inc/services/technical-seo-service.php src/inc/services/tool-seo-technical-service.php
          VF_EXPECT_BASELINE_BUG=1 php target/tests/tool-sitemap-policy-contract.php
          git -C target checkout "$TARGET_SHA" -- src/inc/services/technical-seo-service.php src/inc/services/tool-seo-technical-service.php
          php target/tests/tool-sitemap-policy-contract.php
          echo '{"baseline":"REPRODUCED","candidate":"PASS","checks":10,"scope":"synthetic Provider inputs, actual Theme Resolver and XML"}' > proof/tool-sitemap-policy.json
          node --check target/tests/seo-controls-browser-check.js
          node --check target/src/assets/js/admin/admin-seo.js
          python3 lane/build.py
      - name: Previous exact release recovery baseline
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir previous
          gh release download "v$SOURCE_VERSION" --repo "$TARGET_REPO" --pattern "vf-tools-theme_V${SOURCE_VERSION}.zip" --dir previous
          test "$(stat -c %s "previous/vf-tools-theme_V${SOURCE_VERSION}.zip")" = '1779951'
          test "$(sha256sum "previous/vf-tools-theme_V${SOURCE_VERSION}.zip" | awk '{print $1}')" = 'c6c6e053305c8997b552eabdd1494bac84f1f6f9f1270b9225d7dbcb75123eca'
      - name: Browser dependencies
        run: |
          set -Eeuo pipefail
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -g -fsSL --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC[wght].ttf' -o "$HOME/.local/share/fonts/NotoSansSC.ttf"
          fc-cache -f
      - name: Real WordPress upgrade recovery and browser proof
        run: bash lane/wordpress.sh
      - name: Public-safe evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c01-seo-candidate-${{ github.run_id }}
          path: |
            proof/*.json
            proof/*.png
          if-no-files-found: error
          retention-days: 30
      - name: Private workspace cleanup
        if: always()
        run: rm -rf target previous proof/*.zip /tmp/v8-mock.py /tmp/navigation-candidate.css /tmp/navigation-baseline.log
