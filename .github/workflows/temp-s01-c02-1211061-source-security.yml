name: S01-C02 1.21.1061 Source security candidate
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: c62e082c5bf11ee6817a83475d46e20f70526040
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: target
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, sodium, mbstring

      - name: Exact source and lifecycle contracts
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          test "$(git -C target rev-parse HEAD)" = "c62e082c5bf11ee6817a83475d46e20f70526040"
          test "$(git -C target rev-parse HEAD^{tree})" = "2bcac5111167b345a4de5b0bc7da4e5497d8a61d"
          test "$(cat target/VERSION)" = "1.21.1061"
          grep -F "Version: 1.21.1061" target/vf-ops.php >/dev/null
          grep -F "S01-V10-QUALITY-SOURCE-SECURITY-GATE" target/vf-ops.php >/dev/null
          php -l target/includes/acceptance-o11/source-acceptance-product.php
          php -l target/tests/s01-c02-1211060-source-lifecycle-isolated.php
          php target/tests/s01-c02-1211060-source-lifecycle-isolated.php | tee evidence/source-lifecycle-php.txt
          php -l target/tests/s01-c02-1211061-source-security-isolated.php
          php target/tests/s01-c02-1211061-source-security-isolated.php | tee evidence/source-security-php.txt
          node --check target/assets/js/admin-o11-source.js
          node --check target/tests/s01-c02-1211060-source-lifecycle-ajax-result.js
          node target/tests/s01-c02-1211060-source-lifecycle-ajax-result.js | tee evidence/source-lifecycle-js.txt
          php target/tests/s01-c02-1211059-quality-capability-runtime-contract.php
          php target/tests/s01-c02-1211058-quality-disclosure-contract.php
          php target/tests/s01-c02-1211057-active-quality-task-action-contract.php
          php target/tests/s01-c02-1211056-quality-task-entry-contract.php
          php target/tests/s01-c02-1211055-quality-center-final-visual-contract.php
          php target/tests/s01-c02-1211054-quality-center-visual-hierarchy-contract.php
          php target/tests/s01-c02-1211053-quality-task-compact-contract.php
          php target/tests/s01-c02-1211052-quality-center-flat-contract.php
          php target/tests/s01-c02-1211051-source-real-run-contract.php
          php target/tests/s01-c02-121934-shell-header-visual-lock-r45-contract.php
          echo CONTRACTS=PASS

      - name: Source browser and quality regressions
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/quality-node
          cd /tmp/quality-node
          npm init -y >/dev/null
          npm install --no-save playwright@1.58.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          export NODE_PATH=/tmp/quality-node/node_modules
          cd "$GITHUB_WORKSPACE"
          node target/tests/s01-c02-1211059-source-start-browser-proof.js > evidence/source-start-browser.json
          node target/tests/s01-c02-1211058-quality-disclosure-browser-proof.js > evidence/disclosure-browser.json
          node target/tests/s01-c02-1211057-active-quality-task-action-browser-proof.js > evidence/active-task-browser.json
          node target/tests/s01-c02-1211056-quality-task-entry-browser-proof.js > evidence/task-entry-browser.json
          jq -e '.pass==true' evidence/source-start-browser.json
          jq -e '.pass==true' evidence/disclosure-browser.json
          jq -e '.pass==true' evidence/active-task-browser.json
          jq -e '.pass==true' evidence/task-entry-browser.json
          echo BROWSER=PASS

      - name: Build exact candidate package
        run: |
          set -Eeuo pipefail
          python3 target/.github/release/build-ops-package.py --source target --output "$RUNNER_TEMP/vf-tools-ops_V1.21.1061.zip" > evidence/package.json
          unzip -tq "$RUNNER_TEMP/vf-tools-ops_V1.21.1060.zip" >/dev/null

      - name: Seal evidence
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('evidence')
          pkg=json.loads((root/'package.json').read_text()) if (root/'package.json').is_file() else {}
          browser=['source-start-browser','disclosure-browser','active-task-browser','task-entry-browser']
          try: bpass=all(json.loads((root/(n+'.json')).read_text()).get('pass') is True for n in browser)
          except Exception: bpass=False
          php=(root/'source-lifecycle-php.txt').read_text() if (root/'source-lifecycle-php.txt').is_file() else ''
          js=(root/'source-lifecycle-js.txt').read_text() if (root/'source-lifecycle-js.txt').is_file() else ''
          security=(root/'source-security-php.txt').read_text() if (root/'source-security-php.txt').is_file() else ''
          pass_closure='PASS s01-c02-1211060-source-lifecycle-isolated' in php and 'PASS s01-c02-1211060-source-lifecycle-ajax-result' in js and 'PASS s01-c02-1211061-source-security-isolated' in security
          evidence={'schema':'vf-s01-c02-source-security-candidate/v1','status':'PASS' if pass_closure and bpass and pkg.get('asset_sha256') else 'FAIL',
            'source_sha':'c62e082c5bf11ee6817a83475d46e20f70526040','source_tree':'2bcac5111167b345a4de5b0bc7da4e5497d8a61d','version':'1.21.1061',
            'lifecycle_php':'PASS' if 'PASS s01-c02-1211060-source-lifecycle-isolated' in php else 'FAIL',
            'lifecycle_js':'PASS' if 'PASS s01-c02-1211060-source-lifecycle-ajax-result' in js else 'FAIL','security_php':'PASS' if 'PASS s01-c02-1211061-source-security-isolated' in security else 'FAIL','browser_regression':'PASS' if bpass else 'FAIL',
            'asset_sha256':pkg.get('asset_sha256',''),'asset_bytes':pkg.get('asset_bytes',0),'runtime_files':pkg.get('runtime_files',0),
            'runtime_fingerprint':pkg.get('runtime_fingerprint',''),'production':'NOT_TOUCHED','owner_product_pass':False}
          (root/'FINAL_EVIDENCE.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(evidence,ensure_ascii=False))
          if evidence['status']!='PASS':raise SystemExit(1)
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s01-c02-1211061-source-security-evidence
          path: evidence/
          retention-days: 30
