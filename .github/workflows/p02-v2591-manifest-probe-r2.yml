name: P02 V2.5.91 Manifest Probe R2

on:
  push:
    branches:
      - run/p02-v2591-manifest-probe-r2-20260923
    paths:
      - '.github/workflows/p02-v2591-manifest-probe-r2.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 4c6060b71367804f60ee3e216538fbfd46f62455
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Print app digest
        shell: bash
        working-directory: product
        run: |
          set -Eeuo pipefail
          printf 'P02_V2591_APP bytes=%s sha256=%s\n' "$(wc -c < public/assets/app.js | tr -d ' ')" "$(sha256sum public/assets/app.js | awk '{print $1}')"
