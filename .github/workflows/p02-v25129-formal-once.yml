name: P02 v2.5.129 owner-authorized formal release (one-off)
on:
  push:
    branches:
      - release/p02-v25129-once-20261113
    paths:
      - .github/workflows/p02-v25129-formal-once.yml
permissions:
  contents: read
concurrency:
  group: p02-v25129-formal-publication-once
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ github.repository == 'llhzx2018/core-free-runner-public' && github.ref == 'refs/heads/release/p02-v25129-once-20261113' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PRODUCT_REPO: llhzx2018/vf-library
      PRODUCT_SHA: e297bd998df003725f641b358799b3bb1871fcfc
      PRODUCT_TREE: 564ac6b3150b33fadc4a603d6dabd8afbfc06f45
      P02_CHANNEL_BLOB: afcb28962178c1d43525b50b5d87468311a24ee3
      EXPECTED_UPDATE_SHA256: 2bb518b2a9c6946918dfb55d1789539e653a9b46345daa6f019f1f38dfebb371
      RELEASE_TAG: v2.5.129
    steps:
      - name: Verify registered exact source, channel, and prior isolated machine proof
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN" || { echo P02_PRIVATE_READ_CAPABILITY_MISSING; exit 78; }
          test "$(gh api repos/$PRODUCT_REPO/git/ref/heads/main --jq .object.sha)" = "$PRODUCT_SHA" || { echo P02_PRODUCT_MAIN_DRIFT; exit 78; }
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/43340794838 --jq .conclusion)" = success || { echo P02_PRIOR_MACHINE_PROOF_NOT_PASS; exit 78; }
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/43340794838 --jq .head_sha)" = 5c0d11cb4cbdfdf688234e05be181a2845d15ef8
          curl -fsSL --retry 4 https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/projects/P02.json -o "$RUNNER_TEMP/P02.json"
          test "$(git hash-object "$RUNNER_TEMP/P02.json")" = "$P02_CHANNEL_BLOB" || { echo P02_CHANNEL_CHANGED_BEFORE_RELEASE; exit 78; }
          python3 - "$RUNNER_TEMP/P02.json" <<'PY'
          import json,sys
          c=json.load(open(sys.argv[1]))
          assert c['target_version']=='2.5.128' and c['release_tag']=='v2.5.128'
          assert c['asset_name']=='VF_Library_V2.5.128_UPDATE.zip' and c['schema_to']=='2401'
          assert c['repository']=='llhzx2018/vf-library'
          print('P02_CURRENT_CHANNEL_IDENTITY=PASS')
          PY
      - name: Transient checkout exact P02 source without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: e297bd998df003725f641b358799b3bb1871fcfc
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Preflight exact main and build eight deterministic formal artifacts, clean FULL smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git -C product show -s --format=%T HEAD)" = "$PRODUCT_TREE"
          test "$(cat product/VERSION)" = 2.5.129
          if ! php -r 'exit(extension_loaded("pdo_sqlite") && extension_loaded("sqlite3") && extension_loaded("zip") ? 0 : 1);'; then
            sudo apt-get update -qq
            sudo apt-get install -y php-cli php-sqlite3 php-zip sqlite3 unzip
          fi
          (
            cd product
            VF_RELEASE_FROM_VERSIONS=2.5.128 \
            VF_RELEASE_OWNER_DECISION=config/p02-release-source-decision-2.5.129.json \
            VF_RELEASE_CHANNEL_JSON="$RUNNER_TEMP/P02.json" \
              bash scripts/verify-release-artifacts.sh
          )
          out=product/build/release-preflight
          test "$(find "$out" -maxdepth 1 -type f | wc -l)" -eq 8
          ( cd "$out" && sha256sum -c SHA256SUMS.txt )
          echo "$EXPECTED_UPDATE_SHA256  $out/VF_Library_V2.5.129_UPDATE.zip" | sha256sum -c - || { echo P02_EXPECTED_UPDATE_SHA_MISMATCH; exit 78; }
          python3 - "$out" "$PRODUCT_SHA" "$PRODUCT_TREE" <<'PY'
          import json,sys,zipfile,hashlib
          from pathlib import Path
          out=Path(sys.argv[1]); m=json.loads((out/'VF_Library_V2.5.129_RELEASE_MANIFEST.json').read_text())
          assert m['source']['candidate_commit']==sys.argv[2]
          assert m['source']['source_tree']==sys.argv[3]
          assert m['compatibility']['supported_from']==['2.5.128']
          with zipfile.ZipFile(out/'VF_Library_V2.5.129_UPDATE.zip') as z:
            u=json.loads(z.read('atomic-manifest.json'))
            assert u['format_version']==1 and u['source_version']=='2.5.128' and u['target_version']=='2.5.129'
          print('P02_FINAL_MAIN_8_ASSETS_AND_ATOMIC_V1_PASS')
          PY
      - name: Create protected draft, upload eight immutable asset names, remote verify, publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN" || { echo P02_RELEASE_WRITE_CAPABILITY_MISSING; exit 78; }
          test "$(gh api repos/$PRODUCT_REPO/git/ref/heads/main --jq .object.sha)" = "$PRODUCT_SHA" || { echo P02_PRODUCT_SOURCE_MOVED; exit 78; }
          out=product/build/release-preflight
          if gh api "repos/$PRODUCT_REPO/releases/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh api "repos/$PRODUCT_REPO/git/ref/tags/$RELEASE_TAG" --jq .object.sha)" = "$PRODUCT_SHA" || { echo P02_TAG_COLLISION; exit 81; }
            test "$(gh api "repos/$PRODUCT_REPO/releases/tags/$RELEASE_TAG" --jq .draft)" = true || { echo P02_EXISTING_NON_DRAFT_RELEASE; exit 81; }
            echo P02_PREEXISTING_OWN_DRAFT_REUSE
          else
            if gh api "repos/$PRODUCT_REPO/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              echo P02_ORPHAN_TAG_BLOCKED
              exit 81
            fi
            gh release create "$RELEASE_TAG" -R "$PRODUCT_REPO" --target "$PRODUCT_SHA" --draft \
              --title "VF Library V2.5.129 · current-only Atomic" \
              --notes "P02 VF Library 2.5.129. Exact source e297bd998df003725f641b358799b3bb1871fcfc, tree 564ac6b3150b33fadc4a603d6dabd8afbfc06f45. Supports direct Atomic v1 from 2.5.128 only, Schema 2401 to 2401 (no data migration). Includes Clean FULL and same-version SOURCE, UPDATE, ATOMIC, repair, checksums and manifest. Existing user data and Scratch protected by backup and rollback; prior isolated Runner 43340794838 PASS. Older versions not promised direct upgrade; no FULL overwrite. Formal release does not touch Production; Owner manually upgrades and verifies."
          fi
          gh release upload "$RELEASE_TAG" "$out"/* -R "$PRODUCT_REPO"
          mkdir -p "$RUNNER_TEMP/p02-remote-release"
          gh release download "$RELEASE_TAG" -R "$PRODUCT_REPO" -D "$RUNNER_TEMP/p02-remote-release"
          python3 - "$out" "$RUNNER_TEMP/p02-remote-release" <<'PY'
          from pathlib import Path
          import hashlib,sys
          local,remote=map(Path,sys.argv[1:3])
          a={p.name:(p.stat().st_size,hashlib.sha256(p.read_bytes()).hexdigest()) for p in local.iterdir() if p.is_file()}
          b={p.name:(p.stat().st_size,hashlib.sha256(p.read_bytes()).hexdigest()) for p in remote.iterdir() if p.is_file()}
          assert len(a)==8 and a==b,(a,b)
          print("P02_8_RELEASE_ASSETS_REMOTE_BYTES_AND_SHA_PASS")
          PY
          test "$(gh api "repos/$PRODUCT_REPO/git/ref/tags/$RELEASE_TAG" --jq .object.sha)" = "$PRODUCT_SHA"
          gh release edit "$RELEASE_TAG" -R "$PRODUCT_REPO" --draft=false --prerelease=false
          test "$(gh api "repos/$PRODUCT_REPO/releases/tags/$RELEASE_TAG" --jq .draft)" = false
          test "$(gh api "repos/$PRODUCT_REPO/releases/tags/$RELEASE_TAG" --jq '.assets | length')" -eq 8
          echo P02_V25129_FORMAL_GITHUB_RELEASE_REMOTE_VERIFIED=PASS
          echo P02_CORE_UPDATES_CHANNEL=NOT_YET_CHANGED
          echo P02_PRODUCTION_WRITES=NONE
      - name: Delete ephemeral private source, package, metadata and credentials
        if: always()
        shell: bash
        run: |
          rm -rf -- product "$RUNNER_TEMP/P02.json" "$RUNNER_TEMP/p02-remote-release"
          echo P02_PUBLIC_RUNNER_PRIVATE_WORKSPACE_CLEANED=YES
          echo P02_PRODUCTION_APPLY=NOT_EXECUTED
