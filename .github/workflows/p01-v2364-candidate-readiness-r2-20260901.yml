name: P01 V2.36.4 Candidate Readiness R2
on:
  push:
    branches: [release/p01-v2364-candidate-20260901]
    paths: [.github/workflows/p01-v2364-candidate-readiness-r2-20260901.yml]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CANDIDATE: 2e5f09e1c75eeaaa6d3ab3d98edf2773d30e0062
      CANDIDATE_TREE: 54dc8266d28f907991bb8d0a1be549a3890c3b6a
      CANDIDATE_RUNTIME_TREE: e1ee914a6d9e61bac7931b1f5363a8c7e24e925a
      SOURCE: 718e043e3715ef7b21849bc08634fca89bf92c1f
      SOURCE_TREE: 32e8afdd6d7cdd338c62fdafaedb200b127ca881
      SOURCE_RUNTIME_TREE: 820724b585cb59864211f77c4fb33537b2345029
      VERSION: 2.36.4
      SOURCE_VERSION: 2.36.3
      SCHEMA: '2026082901'
      OUT: /tmp/p01-v2364-candidate-artifacts
      EVID: /tmp/p01-v2364-candidate-evidence
      UPGRADE: /tmp/p01-v2364-upgrade
      FRESH: /tmp/p01-v2364-fresh
      PORT: '18594'
      ADMIN_PASS: P01V2364AnonGrid2026
    steps:
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: release/p01-v2364-candidate-20260901
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 0fe72c7981f5f2b6ddd51bf4cfa5d6c014c9b0d3
          path: template
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.CANDIDATE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: candidate
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.36.3
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: production
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: agent/p01-22121-formal-artifact-gate-20260819
          path: proven
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: tmp/p01-anonymous-grid-alignment-20260901
          path: gridhelper
      - name: Generate fenced gates
        run: python3 runner/scripts/p01_v2364_candidate_readiness_generate.py
      - name: Exact source runtime authority fence
        run: bash /tmp/p01-v2364-generated/01-exact.sh
      - name: Build deterministic candidate artifacts
        run: bash /tmp/p01-v2364-generated/02-build.sh
      - name: Actual V2.36.3 to V2.36.4 Atomic upgrade
        run: bash /tmp/p01-v2364-generated/03-atomic.sh
      - name: Strict fresh candidate runtime
        run: bash /tmp/p01-v2364-generated/04-fresh.sh
      - name: Fresh runtime seed for anonymous grid browser gate
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-v2364-browser /tmp/p01-v2364.cookies
          mkdir -p /tmp/p01-v2364-browser "$EVID/screens"
          cp -a candidate/src /tmp/p01-v2364-browser/runtime
          php -S 127.0.0.1:$PORT -t /tmp/p01-v2364-browser/runtime >"$EVID/browser-server.log" 2>&1 & echo $! >/tmp/p01-v2364-browser.pid
          for i in $(seq 1 60); do curl -fsS -c /tmp/p01-v2364.cookies -b /tmp/p01-v2364.cookies "http://127.0.0.1:$PORT/setup.php" -o "$EVID/setup.html" && break; sleep .25; done
          CSRF=$(python3 - "$EVID/setup.html" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -L -c /tmp/p01-v2364.cookies -b /tmp/p01-v2364.cookies -X POST "http://127.0.0.1:$PORT/setup.php" \
            --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=P01 V2.36.4 Candidate' \
            --data-urlencode "admin_password=$ADMIN_PASS" --data-urlencode "admin_password_confirm=$ADMIN_PASS" -o "$EVID/setup-post.html"
          P01_ROOT=/tmp/p01-v2364-browser/runtime php gridhelper/scripts/p01_anonymous_grid_seed.php | tee "$EVID/grid-seed.txt"
          grep -Fx P01_ANONYMOUS_GRID_SEED=PASS "$EVID/grid-seed.txt"
      - name: Install Chromium harness
        run: |
          python -m pip install --disable-pip-version-check --quiet playwright==1.55.0
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v google-chrome-stable >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1; then python -m playwright install chromium; fi
      - name: Anonymous authenticated logout grid browser gate
        run: |
          python gridhelper/scripts/p01_anonymous_grid_gate.py | tee "$EVID/grid-browser.txt"
          grep -Fx P01_ANONYMOUS_GRID_BROWSER=PASS "$EVID/grid-browser.txt"
      - name: Final release boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          P01_ROOT=/tmp/p01-v2364-browser/runtime php -r 'require getenv("P01_ROOT")."/app/bootstrap.php";$d=vf_db();if(strtolower((string)$d->query("PRAGMA integrity_check")->fetchColumn())!=="ok")exit(1);if($d->query("PRAGMA foreign_key_check")->fetchAll(PDO::FETCH_ASSOC))exit(2);echo "SQLITE=PASS\n";' | tee "$EVID/final-db.txt"
          printf 'P01_V2364_CANDIDATE_READINESS_R2=PASS\nCANDIDATE=%s\nTREE=%s\nRUNTIME_TREE=%s\nPREDECESSOR=%s\nSCHEMA=%s\nATOMIC_2363_TO_2364=PASS\nANONYMOUS_GRID_390_1319_1440=PASS\nLOGIN_LOGOUT=PASS\nONE_FRONTEND=PASS\nSTICKY=PASS\nSQLITE=PASS\nOWNER_PRODUCTION_WRITE=NO\n' "$CANDIDATE" "$CANDIDATE_TREE" "$CANDIDATE_RUNTIME_TREE" "$SOURCE" "$SCHEMA" | tee "$EVID/verdict.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-v2364-candidate-readiness-r2-${{ github.run_id }}
          path: |
            /tmp/p01-v2364-candidate-artifacts
            /tmp/p01-v2364-candidate-evidence
          if-no-files-found: error
          retention-days: 90
      - name: Stop browser server
        if: always()
        run: kill "$(cat /tmp/p01-v2364-browser.pid 2>/dev/null)" 2>/dev/null || true
