name: P02 V2.5.16 Eye Comfort Candidate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PRODUCT_REF: 8c1ec28e45212b733a449278874a942e9138c785
      TARGET_BRANCH: feature/v2.5.16-eye-comfort-surface
    steps:
      - name: Require registered private capability
        env:
          WRITE_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
        run: test -n "$WRITE_TOKEN"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: '${{ env.PRODUCT_REF }}'
          token: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
          path: product
          fetch-depth: 0
          persist-credentials: false

      - name: Build V2.5.16 eye-comfort candidate
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(tr -d '\r\n' < VERSION)" = 2.5.15
          git switch -c "$TARGET_BRANCH"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/assets/app.css')
          s=p.read_text(encoding='utf-8')
          marker='/* V2.5.16 · Eye Comfort Surface */'
          assert marker not in s
          s += '''\n\n/* V2.5.16 · Eye Comfort Surface */\nhtml:not([data-theme="dark"]){\n  --bg:#f2f2ef;\n  --surface:#fafaf8;\n  --surface-soft:#f6f6f3;\n  --surface-muted:#edede9;\n  --border:#e2e2dc;\n  --border-strong:#cecec6;\n}\nhtml:not([data-theme="dark"]) .main,\nhtml:not([data-theme="dark"]) .scratch-workspace-v259,\nhtml:not([data-theme="dark"]) .scratch-editor-wrap-v259,\nhtml:not([data-theme="dark"]) .scratch-editor-v259,\nhtml:not([data-theme="dark"]) .scratch-empty-v259{background:var(--surface)}\nhtml:not([data-theme="dark"]) .sidebar,\nhtml:not([data-theme="dark"]) .topbar{background:color-mix(in srgb,var(--surface) 96%,var(--bg))}\nhtml:not([data-theme="dark"]) .content-list,\nhtml:not([data-theme="dark"]) .modal,\nhtml:not([data-theme="dark"]) .login-card{background:color-mix(in srgb,var(--surface) 98%,var(--bg))}\n'''
          p.write_text(s,encoding='utf-8')
          Path('VERSION').write_text('2.5.16\n',encoding='utf-8')
          q=Path('public/VERSION.txt')
          if q.exists(): q.write_text('2.5.16\n',encoding='utf-8')
          ch=Path('CHANGELOG.md')
          old=ch.read_text(encoding='utf-8')
          entry='''## V2.5.16 — Eye Comfort Surface\n\n- Replaces large pure-white light-mode canvases with a restrained warm-neutral four-layer surface system for long reading and editing sessions.\n- Applies consistently to the main workspace, article/quick-note surfaces, Scratch editor, sidebar, settings and modal surfaces without changing IA or behavior.\n- Dark mode is intentionally unchanged.\n- Schema remains 2401; no migration.\n\n'''
          ch.write_text(entry+old,encoding='utf-8')
          PY
          grep -q 'V2.5.16 · Eye Comfort Surface' public/assets/app.css
          grep -q -- '--surface:#fafaf8' public/assets/app.css
          grep -q -- '--bg:#f2f2ef' public/assets/app.css
          test "$(tr -d '\r\n' < VERSION)" = 2.5.16
          git diff --check
          echo SOURCE_AND_PATCH_GATES=PASS

      - name: Real Chromium candidate versus sealed-baseline regression
        working-directory: product
        run: |
          set -Eeuo pipefail
          npm -g ls playwright >/dev/null 2>&1 || npm i -g playwright@1.55.0 >/dev/null
          playwright install chromium >/dev/null
          ROOT="$RUNNER_TEMP/vf2516"; mkdir -p "$ROOT/candidate" "$ROOT/baseline/assets"
          bash scripts/build-deploy-tree.sh "$ROOT/candidate" >/dev/null
          test "$(cat "$ROOT/candidate/VERSION.txt")" = 2.5.16
          git show "$PRODUCT_REF:public/assets/app.css" > "$ROOT/baseline/assets/app.css"
          git show "$PRODUCT_REF:public/assets/scratch-tabs.css" > "$ROOT/baseline/assets/scratch-tabs.css"
          FIXTURE='<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/PREFIX/assets/app.css"><link rel="stylesheet" href="/PREFIX/assets/scratch-tabs.css"></head><body><div class="shell"><header class="topbar"><div class="topbar-inner">VF Library</div></header><div class="workspace"><aside class="sidebar"><div class="side-scroll"><div class="side-item active">阅读分类</div></div></aside><main class="main"><div class="page"><div class="content-list"><div class="content-row"><div class="content-main"><div class="title-line"><strong>长期阅读测试文章</strong></div><div class="content-preview">用于验证主工作面不再是刺眼纯白，同时保留足够清晰的层级。</div></div></div></div></div></main></div></div><div class="scratch-workspace-v259" style="position:absolute;left:520px;top:520px;width:760px;height:300px"><div class="scratch-editor-wrap-v259"><textarea class="scratch-editor-v259">临时工作台长时间写作测试</textarea></div></div></body></html>'
          printf '%s' "${FIXTURE//PREFIX/candidate}" > "$ROOT/candidate/__eye.html"
          printf '%s' "${FIXTURE//PREFIX/baseline}" > "$ROOT/baseline/__eye.html"
          php -S 127.0.0.1:18716 -t "$ROOT" >"$RUNNER_TEMP/php.log" 2>&1 &
          PHP_PID=$!; trap 'kill $PHP_PID || true' EXIT; sleep 1
          cat > "$RUNNER_TEMP/check.cjs" <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const sample=async(page,path,theme)=>{
              await page.goto('http://127.0.0.1:18716/'+path+'/__eye.html',{waitUntil:'networkidle'});
              await page.evaluate(t=>t==='dark'?document.documentElement.setAttribute('data-theme','dark'):document.documentElement.removeAttribute('data-theme'),theme);
              return await page.evaluate(()=>{
                const root=getComputedStyle(document.documentElement),q=s=>getComputedStyle(document.querySelector(s)).backgroundColor;
                const vars={};for(const k of ['--bg','--surface','--surface-soft','--surface-muted','--border','--border-strong'])vars[k]=root.getPropertyValue(k).trim();
                return {vars,body:q('body'),main:q('.main'),sidebar:q('.sidebar'),card:q('.content-list'),scratch:q('.scratch-editor-v259')};
              });
            };
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            const baselineDark=await sample(page,'baseline','dark');
            const candidateDark=await sample(page,'candidate','dark');
            if(JSON.stringify(candidateDark.vars)!==JSON.stringify(baselineDark.vars)) throw new Error('DARK_MODE_DRIFT '+JSON.stringify({baselineDark,candidateDark}));
            const light=await sample(page,'candidate','light');
            const v=light.vars;
            if(v['--bg']!=='#f2f2ef'||v['--surface']!=='#fafaf8'||v['--surface-soft']!=='#f6f6f3'||v['--surface-muted']!=='#edede9') throw new Error('LIGHT_TOKENS_BAD '+JSON.stringify(light));
            for(const k of ['main','sidebar','card','scratch']) if(light[k]==='rgb(255, 255, 255)') throw new Error('PURE_WHITE_SURFACE '+k+' '+JSON.stringify(light));
            const mobile=await browser.newPage({viewport:{width:390,height:844}});
            await mobile.goto('http://127.0.0.1:18716/candidate/__eye.html',{waitUntil:'networkidle'});
            const overflow=await mobile.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
            if(overflow>1) throw new Error('MOBILE_OVERFLOW '+overflow);
            await browser.close();
            console.log('LIGHT_SURFACE_TOKENS=PASS',light);
            console.log('PURE_WHITE_LARGE_SURFACES=NONE');
            console.log('DARK_MODE_MATCHES_SEALED_V2515=PASS',candidateDark.vars);
            console.log('MOBILE_390_OVERFLOW=NONE');
          })().catch(err=>{console.error(err);process.exit(1)});
          JS
          NODE_PATH="$(npm root -g)" node "$RUNNER_TEMP/check.cjs"
          echo FRESH_BUILD=PASS
          echo REAL_CHROMIUM_EYE_COMFORT=PASS
          echo SCHEMA=2401
          echo PRODUCTION_WRITE=NO

      - name: Push verified private candidate
        working-directory: product
        env:
          WRITE_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
        run: |
          set -Eeuo pipefail
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VERSION public/VERSION.txt public/assets/app.css CHANGELOG.md
          git commit -m 'style(ui): add V2.5.16 eye comfort surfaces'
          git push "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/vf-library.git" HEAD:"$TARGET_BRANCH"
