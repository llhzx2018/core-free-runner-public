name: S01-C01 render formal release
on:
  push:
    branches: [task/s01-c01-render-13577-formal]
permissions:
  contents: read
  actions: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_REPO: 'llhzx2018/vf-tools-theme'
      TARGET_VERSION: '1.35.77'
      TARGET_SHA: '6cefc0fe5909e73a53387a10c052fe585bd93249'
      TARGET_TREE: 'b2b8c813b1db1ab141743e064c3ab4ddad757ac6'
      SOURCE_VERSION: '1.35.76'
      BASE_SHA: '3a16777a8f73c97f69a62fa640a96e83f4edef67'
      CANDIDATE_RUN: '37149092692'
      CANDIDATE_SHA: '4d3d946ec306ef9dfd4432ee4e96202a2cbaf76c'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runner
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Reverse verify exact tested tree and rebuilt bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$CANDIDATE_RUN --jq .conclusion)" = success
          gh run download "$CANDIDATE_RUN" --repo llhzx2018/core-free-runner-public --name "s01-c01-render-candidate-$CANDIDATE_RUN" --dir tested
          jq -e --arg sha "$CANDIDATE_SHA" --arg tree "$TARGET_TREE" --arg ver "$TARGET_VERSION" '.status=="PASS" and .source_sha==$sha and .source_tree==$tree and .version==$ver and .upgrade=="PASS" and .source_rollback=="PASS" and .wordpress_browser=="PASS" and .security_boundary=="PASS" and .frozen_shell_header_menu=="PASS" and .render_native_cases==6 and .render_controls=="PASS" and .render_draft_preservation=="PASS" and .render_form_preservation=="PASS" and .render_persistence=="PASS" and .render_csrf=="PASS" and .render_revision_conflict=="PASS" and .render_invalid_contract=="PASS" and .render_keyboard=="PASS" and .render_alignment=="PASS" and .render_disclosures=="PASS" and .render_network_failure=="PASS" and .render_busy_lock=="PASS" and .render_native_post=="PASS" and .render_true_blocked_state=="PASS"' tested/FINAL_EVIDENCE.json >/dev/null
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          cp -a runner/lanes/s01-c01-render-13577 lane
          python3 lane/build.py
          python3 - <<'PY'
          import json,pathlib
          tested=json.loads(pathlib.Path('tested/FINAL_EVIDENCE.json').read_text()); built=json.loads(pathlib.Path('proof/identity.json').read_text())
          for key in ['asset','asset_bytes','asset_sha256','source_tree','version']: assert tested[key]==built[key],key
          PY
      - name: Publish private formal Release and exact remote readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          ASSET="vf-tools-theme_V${TARGET_VERSION}.zip"; TAG="v$TARGET_VERSION"
          cat > /tmp/release-notes.md <<EOF
          VF Tools Theme V$TARGET_VERSION

          工具页渲染降噪：将多个卡片收敛为一个设置面，六个常用控件采用逐行设置，标签与控件分别对齐，保留15px控件/14px说明、桌面40px/手机44px控件、原生下拉与20px方形复选框。
          正常状态不再占用独立提示框；简化重复说明，取消独立配置摘要和结果类型标签墙，兼容字段/固定规则/运行检查统一到一个默认折叠区。保存与预览统一在主内容面页底，修改后显示保存与放弃，错误/真实阻断仍明确可见。
          原有后台保存、权限/nonce、渲染合同/工具逻辑和升级机制保持，壳、头部、主菜单冻结。
          Exact candidate Run: $CANDIDATE_RUN。六宽度真实隔离WordPress控件/键盘/未保存/放弃/保存中/实际保存与重载、网络失败/版本冲突输入保留、非法字段/nonce/guest拒绝、无脚本原生保存、真实阻断状态保持，以及$SOURCE_VERSION→$TARGET_VERSION原生升级/回退/重新应用通过。发布前Assistant复核最终桌面和手机截图，不据此声明OWNER UI通过。
          OWNER验收范围仅UX/UI；Production由OWNER手工升级，机器与Assistant检查不冒充OWNER实际使用PASS；独立Preview Runtime按SSOT为N_A。
          Exact promoted source: $TARGET_SHA; tree: $TARGET_TREE。
          EOF
          if gh release view "$TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            test "$(gh api repos/$TARGET_REPO/git/ref/tags/$TAG --jq .object.sha)" = "$TARGET_SHA"
          else
            gh release create "$TAG" "proof/$ASSET" --repo "$TARGET_REPO" --target "$TARGET_SHA" --title "VF Tools Theme V$TARGET_VERSION" --notes-file /tmp/release-notes.md
          fi
          gh api "repos/$TARGET_REPO/releases/tags/$TAG" > proof/remote-release.json
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/$TAG --jq .object.sha)" = "$TARGET_SHA"
          mkdir readback
          gh release download "$TAG" --repo "$TARGET_REPO" --pattern "$ASSET" --dir readback
          cmp "proof/$ASSET" "readback/$ASSET"
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('proof'); m=json.loads((p/'identity.json').read_text());r=json.loads((p/'remote-release.json').read_text());t=json.loads(pathlib.Path('tested/FINAL_EVIDENCE.json').read_text());assert not r['draft'] and not r['prerelease'];a=[a for a in r['assets'] if a['name']==m['asset']];assert len(a)==1 and a[0]['size']==m['asset_bytes'] and a[0]['digest']=='sha256:'+m['asset_sha256'];m.update(release_id=r['id'],asset_id=a[0]['id'],released_at=r['published_at'],runtime_files=t['runtime_files'],runtime_fingerprint=t['runtime_fingerprint'],candidate_run=t['candidate_run'],formal_release='PASS',remote_readback='PASS',distribution='NOT_EXECUTED',production='NOT_EXECUTED');(p/'RELEASE_RECEIPT.json').write_text(json.dumps(m,indent=2));print(json.dumps(m))
          PY
      - name: Public-safe receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c01-render-release-${{ github.run_id }}
          path: proof/RELEASE_RECEIPT.json
          retention-days: 30
          if-no-files-found: error
      - name: Private workspace cleanup
        if: always()
        run: rm -rf target readback proof/*.zip
