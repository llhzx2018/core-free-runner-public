name: TEMP P07 auto-backup UTF8 exact-source focused regression
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-auto-backup-utf8-temporary-regression.yml'
permissions:
  contents: read
concurrency:
  group: temp-p07-auto-backup-utf8-20261017
  cancel-in-progress: false
jobs:
  focused-regression:
    if: github.repository == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Require registered private read capability
        shell: bash
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          test -n "$PRIVATE_READ_TOKEN" || exit 78
      - name: Checkout P07 exact private candidate transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 00e358c3838ebcd9078aca697ce90ede911a2334
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: p07-private
      - name: Run backup/retention and related package tests
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p07-private rev-parse HEAD)" = '00e358c3838ebcd9078aca697ce90ede911a2334'
          test "$(cat p07-private/BUILD_ID)" = '0.1.0-release87'
          cd p07-private
          export PYTHONPATH="$PWD/lib"
          python3 -m py_compile lib/auto_backup.py tests/test_auto_backup.py
          log="$RUNNER_TEMP/p07-utf8-regression.log"
          if timeout --signal=TERM --kill-after=5s 750 python3 -m unittest -q tests.test_auto_backup tests.test_backup >"$log" 2>&1; then
            echo 'P07_AUTO_BACKUP_UTF8_REGRESSION=PASS'
            grep -E '^Ran [0-9]+ tests? in ' "$log" | tail -n1 || true
          else
            rc=$?
            echo "P07_AUTO_BACKUP_UTF8_REGRESSION=FAIL_$rc"
            grep -E '^Ran [0-9]+ tests? in |^FAILED \(' "$log" | tail -n2 || true
            exit "$rc"
          fi
      - name: Purge transient checkout and private logs
        if: always()
        shell: bash
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/p07-private"
          rm -f -- "$RUNNER_TEMP/p07-utf8-regression.log"
          echo 'P07_PRIVATE_SOURCE_PERSISTED=NO'
          echo 'P07_PRIVATE_LOG_PERSISTED=NO'
