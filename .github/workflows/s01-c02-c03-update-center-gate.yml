name: S01 C02 C03 Update Center Gate

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Checkout runner branch
        uses: actions/checkout@v4

      - name: Verify governed private-read capability
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VF_RELEASE_WRITE_TOKEN:-}"
          for repo in vf-tools-ops vf-tools-m3u8; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $VF_RELEASE_WRITE_TOKEN" "https://api.github.com/repos/llhzx2018/$repo" || true)"
            test "$code" = "200"
          done

      - name: Clone exact Ops candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ops
          git init -q ops
          cd ops
          git remote add origin https://github.com/llhzx2018/vf-tools-ops.git
          AUTH="$(printf 'x-access-token:%s' "$VF_RELEASE_WRITE_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" fetch --no-tags origin refs/heads/main:refs/remotes/origin/main refs/heads/fix/s01-update-center-state-contract-v121872-20260917:refs/remotes/origin/candidate
          git checkout --detach refs/remotes/origin/candidate
          test "$(git rev-parse HEAD)" = "30cb7d22370bf6a7c6e329daeb576ef3dd127243"
          test "$(git rev-parse refs/remotes/origin/main)" = "23a84186d6af03f10f5bc43d478cd3216940b28b"

      - name: Ops exact scope
        shell: bash
        run: |
          set -euo pipefail
          cd ops
          actual="$(git diff --name-only refs/remotes/origin/main HEAD | sort)"
          expected="$(printf '%s\n' VERSION includes/wp-update/class-vf-ops-update-admin-v1.php tests/s01-update-center-state-contract.php tests/s01-v6-r4-content-seo-contract.php tests/s01-v6-r41-content-seo-closure-contract.php vf-ops.php | sort)"
          test "$actual" = "$expected"

      - name: Ops identity predicates
        shell: bash
        run: |
          set -euo pipefail
          cd ops
          test "$(cat VERSION)" = "1.21.872"
          grep -Fq 'Version: 1.21.872' vf-ops.php
          grep -Fq "VF_OPS_VERSION', '1.21.872'" vf-ops.php

      - name: Ops semantic snapshot predicates
        shell: bash
        run: |
          set -euo pipefail
          cd ops
          f=includes/wp-update/class-vf-ops-update-admin-v1.php
          grep -Fq "COMPONENT_STATE_OPTION = 'vf_s01_c02_update_center_state_v1'" "$f"
          grep -Fq 'component_state_from_status' "$f"
          grep -Fq 'persist_component_state' "$f"
          grep -Fq "stored['current_version']" "$f"

      - name: Ops semantic state predicates
        shell: bash
        run: |
          set -euo pipefail
          cd ops
          f=includes/wp-update/class-vf-ops-update-admin-v1.php
          grep -Fq "'refresh_error_code'" "$f"
          grep -Fq "'DISCOVERY_FAILED'" "$f"
          grep -Fq "'SOURCE_VERSION_BLOCKED'" "$f"
          ! grep -Fq "last['result'] ?? (\$update['state']" "$f"

      - name: Ops ownership predicate
        shell: bash
        run: |
          set -euo pipefail
          cd ops
          grep -Fq "remove_submenu_page('tools.php', 'vf-ops-updates')" includes/wp-update/class-vf-ops-update-admin-v1.php

      - name: Ops semantic update-center contract
        shell: bash
        run: |
          set -euo pipefail
          cd ops
          php tests/s01-update-center-state-contract.php

      - name: Ops V6 current regression contracts
        shell: bash
        run: |
          set -euo pipefail
          cd ops
          php tests/s01-v6-r4-content-seo-contract.php
          php tests/s01-v6-r41-content-seo-closure-contract.php

      - name: Ops refresh path PHP and secret fence
        shell: bash
        run: |
          set -euo pipefail
          cd ops
          grep -Fq 'vf_ops_wp_update_force_refresh_v1' includes/wp-update/bootstrap.php
          grep -Fq 'VF_Ops_Update_Client_V1::clear_cache();' includes/wp-update/bootstrap.php
          grep -Fq "delete_site_transient('update_plugins');" includes/wp-update/bootstrap.php
          grep -Fq 'wp_update_plugins();' includes/wp-update/bootstrap.php
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find . -type f -name '*.php' -not -path './.git/*' -print0 | sort -z)
          ! git diff refs/remotes/origin/main HEAD -- | grep -E 'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]+' >/dev/null

      - name: Clone exact M3U8 candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf m3u8
          git init -q m3u8
          cd m3u8
          git remote add origin https://github.com/llhzx2018/vf-tools-m3u8.git
          AUTH="$(printf 'x-access-token:%s' "$VF_RELEASE_WRITE_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" fetch --no-tags origin refs/heads/main:refs/remotes/origin/main refs/heads/fix/s01-update-center-state-contract-v12532-20260917:refs/remotes/origin/candidate
          git checkout --detach refs/remotes/origin/candidate
          test "$(git rev-parse HEAD)" = "b3202cf57e239eec954ec86eea6c23d9e807aeae"
          test "$(git rev-parse refs/remotes/origin/main)" = "c164a9cc37fde9eee810fb417f98dfe2a02240e8"
          test "$(cat VERSION)" = "1.25.32"

      - name: M3U8 exact scope
        shell: bash
        run: |
          set -euo pipefail
          cd m3u8
          actual="$(git diff --name-only refs/remotes/origin/main HEAD | sort)"
          expected="$(printf '%s\n' VERSION src/includes/update/class-vf-m3u8-update-admin-v1.php src/vf-tool-m3u8.php tests/provider-dashboard-visible-ui-contract.php tests/unit/dashboard-human-language-contract.php tests/unit/host-recovery-human-language-contract.php tests/unit/package-physical-locator-contract.php tests/unit/recovery-runtime-human-language-followup-contract.php tests/unit/settings-human-language-followup-contract.php tests/unit/update-refresh-policy-contract.php tests/unit/visible-console-v2-contract.php | sort)"
          test "$actual" = "$expected"

      - name: M3U8 update refresh contract
        shell: bash
        run: |
          set -euo pipefail
          cd m3u8
          php tests/unit/update-refresh-policy-contract.php

      - name: M3U8 current UI and provider contracts
        shell: bash
        run: |
          set -euo pipefail
          cd m3u8
          php tests/provider-dashboard-visible-ui-contract.php
          php tests/unit/dashboard-human-language-contract.php
          php tests/unit/host-recovery-human-language-contract.php
          php tests/unit/package-physical-locator-contract.php
          php tests/unit/recovery-runtime-human-language-followup-contract.php
          php tests/unit/settings-human-language-followup-contract.php
          php tests/unit/visible-console-v2-contract.php

      - name: M3U8 PHP syntax and secret fence
        shell: bash
        run: |
          set -euo pipefail
          cd m3u8
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find src -type f -name '*.php' -print0 | sort -z)
          ! git diff refs/remotes/origin/main HEAD -- | grep -E 'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]+' >/dev/null

      - name: Gate result
        shell: bash
        run: echo "PASS S01 C02/C03 update-center exact-SHA gate"
