name: TEMP P02 vf-doc stage1 PHP83 compatible Composer lock evidence
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p02-vf-doc-stage1-dependency-lock-temporary.yml
permissions:
  contents: read
jobs:
  public-only-dependency-metadata:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/p02-vf-doc-stage1-dependency-lock-20261122'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout temporary public-safe test orchestrator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Transient checkout of exact private product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-doc
          ref: 3feb1ffd257347b7d9f4e79c2972864bc7b8f4c3
          path: target
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: PHP 8.4 and Composer toolchain
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring,pdo_sqlite,sqlite3,pdo_mysql,dom,xml,zip
          tools: composer:v2
          coverage: none
      - name: pnpm 10 toolchain
        uses: pnpm/action-setup@v4
        with:
          version: '10.20.0'
          run_install: false
      - name: Node 22 toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Resolve exact dependency graph into genuine lockfiles
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = 3feb1ffd257347b7d9f4e79c2972864bc7b8f4c3
          (
            cd target
            composer update --no-interaction --prefer-dist --no-progress --no-audit
            pnpm install --frozen-lockfile
            composer validate --strict
            python3 -B scripts/check_source_contract.py
            pnpm run typecheck
            pnpm run test:frontend
            pnpm run build
          ) >"$RUNNER_TEMP/p02-dependencies.log" 2>&1 || {
            echo P02_DEPENDENCY_LOCK_GENERATION=FAIL
            exit 1
          }
          test -s target/composer.lock && test -s target/pnpm-lock.yaml
          python3 - <<'PY'
          import json, pathlib, re
          base = pathlib.Path('target')
          composer = json.loads((base/'composer.lock').read_text())
          packages = composer.get('packages', [])+composer.get('packages-dev', [])
          assert len(packages) >= 25, 'real Composer resolution missing'
          assert composer.get('platform-overrides', {}).get('php') == '8.3.0', 'not PHP 8.3 compatible platform lock'
          for pkg in packages:
              n = pkg.get('name','')
              assert re.fullmatch(r'[a-z0-9_.-]+/[a-z0-9_.-]+', n), 'not a public package name'
              assert not n.startswith(('kewaro/','llhzx2018/','vf-doc/')), 'private package'
              for kind in ('source','dist'):
                  url = pkg.get(kind, {}).get('url','')
                  if url:
                      assert url.startswith('https://'), 'non-public package URL'
                      assert not re.search(r'https://[^/@\s]+@',url), 'embedded credentials'
                      assert not re.search('llhzx2018|kewaro|vf-doc',url,re.I), 'private repository'
          pnpm = (base/'pnpm-lock.yaml').read_text()
          assert pnpm.startswith('lockfileVersion:') and len(pnpm) > 10000, 'not a real pnpm lock'
          for text in ((base/'composer.lock').read_text(),pnpm):
              assert not re.search('llhzx2018|kewaro|vf-doc|ghp_[A-Za-z0-9]+|github_pat_',text,re.I), 'private marker'
              assert not re.search(r'\b(?:link:|file:|git\+ssh:)',text), 'local/private source dependency'
          print('P02_LOCK_PUBLIC_METADATA_ONLY=PASS')
          PY
          mkdir -p "/tmp/p02-public-metadata"
          cp target/composer.lock "/tmp/p02-public-metadata/"
          sha256sum "/tmp/p02-public-metadata/"* | sed "s|$RUNNER_TEMP/p02-public-metadata/||"
          echo P02_LOCK_GENERATION_AND_FRONTEND=PASS
      - name: One-day public-only third-party metadata evidence
        uses: actions/upload-artifact@v4
        with:
          name: p02-php83-composer-thirdparty-metadata
          path: |
            /tmp/p02-public-metadata/composer.lock
          retention-days: 1
          if-no-files-found: error
      - name: Always remove private checkout and temporary logs
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- target "/tmp/p02-public-metadata"
          rm -f -- "$RUNNER_TEMP/p02-dependencies.log"
          test ! -e target
          echo P02_TRANSIENT_PRIVATE_SOURCE_CLEANED=PASS
