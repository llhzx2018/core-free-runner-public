name: P07 Release16 Authority Readback Exact-source Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-release16-authority-readback.yml'

permissions:
  contents: read

jobs:
  exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Verify private read token
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: test -n "$PRIVATE_READ_TOKEN"

      - name: Checkout exact private authority candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 568c2acd606fa779fba8c9f05776377903f5d5cb
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Release16 authority readback
        working-directory: source
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '568c2acd606fa779fba8c9f05776377903f5d5cb'
          test "$(cat BUILD_ID)" = '0.1.0-release16'
          python3 -m json.tool docs/authority/P07_INTEGRATION_MANIFEST.json >/dev/null

          grep -Fq 'Slot 3 CloudPanel Ops                = 0.1.0-release16' docs/authority/CURRENT.md
          grep -Fq 'Public Distribution                   = 850e41b8aeb4d58f930e5e0f9ba432840c8f962e' docs/authority/CURRENT.md
          grep -Fq 'Release16 Distribution Gate           36809546508 PASS' docs/authority/CURRENT.md
          grep -Fq 'Production exact independently proven Slot 3 Build  0.1.0-release14' docs/authority/CURRENT.md
          grep -Fq 'release16 Production install                     NOT_YET_OWNER_VERIFIED' docs/authority/CURRENT.md

          grep -Fq '| B48 | Restore-As Canonical SQLite / Safe Stage Diagnosis |' docs/authority/ACCEPTANCE_MATRIX.md
          grep -Fq 'PUBLIC_DISTRIBUTED' docs/authority/ACCEPTANCE_MATRIX.md
          grep -Fq 'RELEASE16_OWNER_REAL_USE_PENDING' docs/authority/ACCEPTANCE_MATRIX.md

          python3 - <<'PY'
          import json
          p=json.load(open('docs/authority/P07_INTEGRATION_MANIFEST.json',encoding='utf-8'))
          slot3=next(x for x in p['slots'] if x['slot']==3)
          assert slot3['internal_version']=='0.1.0-release16'
          assert slot3['source_main_commit']=='bb5b92f2b6cfa2bd63a6dcca3d837f34bfb0ef88'
          assert slot3['restore_as_sqlite_contract']=='CANONICAL_MANIFEST_SNAPSHOT_BEFORE_VERIFY_V1'
          assert slot3['restore_failure_stage_contract']=='BEGINNER_ZH_SAFE_STAGE_V1'

          release=p['release']
          assert release['slot3_build']=='0.1.0-release16'
          assert release['slot3_source_main_commit']=='bb5b92f2b6cfa2bd63a6dcca3d837f34bfb0ef88'
          assert release['public_distribution_commit']=='850e41b8aeb4d58f930e5e0f9ba432840c8f962e'
          assert release['current_public_main_commit']=='850e41b8aeb4d58f930e5e0f9ba432840c8f962e'
          assert release['runtime_manifest_blob']=='3461782c9326bd599e841fa437477dabeb472f4c'
          assert release['overlay_manifest_blob']=='e71740c9614f500351b3375b35c7c870794e9217'
          assert release['final_installer_blob']=='867e5d99ba2eb6241caaafb94dc43753644cc2e4'
          assert release['stable_installer_blob']=='36d47f187d45a0f2129afc87a3717994466a5182'
          assert release['toolbox_blob']=='ca80a5d82c91f4adc757e69cc3c10f9731a816c4'

          prod=p['production']
          assert prod['slot3_build']=='0.1.0-release14'
          assert prod['release15_owner_real_use']=='BACKUP_PASS_RESTORE_LIST_PASS_RESTORE_AS_FAIL'
          assert prod['release16_install_status']=='NOT_YET_OWNER_VERIFIED'
          assert prod['release16_owner_real_use']=='PENDING'
          assert prod['migration_executed'] is False
          assert prod['dns_write'] is False
          assert prod['source_delete'] is False
          assert prod['resource_safe_apply_run'] is False
          assert 'source_candidate' not in p
          PY

      - name: Secret boundary
        working-directory: source
        run: |
          set -Eeuo pipefail
          python3 scripts/secret_scan.py --root docs

      - name: Result
        if: always()
        run: |
          echo 'P07_RELEASE16_AUTHORITY_SOURCE=568c2acd606fa779fba8c9f05776377903f5d5cb'
          echo 'P07_PRODUCTION_WRITE=NOT_RUN'
