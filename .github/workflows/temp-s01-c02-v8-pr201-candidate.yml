name: S01-C02 V8 PR201 Candidate Gate

on:
  push:
    branches:
      - task/s01-c02-v8-pr201-candidate
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REPOSITORY: llhzx2018/vf-tools-ops
  TARGET_SHA: daa7a8a85b89ac106a981000394de9199c31245c
  BASE_SHA: 5f15f8de9fc86a5cdb91c3cdee28d65c31c284db

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact private candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          path: target
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Exact identity and frozen boundary
        working-directory: target
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          python3 - <<'PY'
          import os, subprocess
          base=os.environ["BASE_SHA"]; head=os.environ["TARGET_SHA"]
          changed=set(subprocess.check_output(["git","diff","--name-only",base,head],text=True).splitlines())
          expected={
            "assets/css/v13/seo/keywords.css",
            "assets/css/v13/system/plugins.css",
            "assets/js/v13/system/plugins.js",
            "includes/admin-v13/views/seo_keywords.php",
            "includes/admin-v13/views/system_plugins.php",
            "tests/s01-c02-v8-browser-proof.js",
            "tests/s01-c02-v8-reference-body-contract.php",
            "tests/s01-c02-v8-render-fixture.php",
          }
          if changed != expected: raise SystemExit("changed set mismatch: "+repr(sorted(changed)))
          bad=[p for p in changed if any(x in p.lower() for x in ("shell","header-menu","header_menu","global-header","admin-shell"))]
          if bad: raise SystemExit("frozen boundary touched: "+repr(bad))
          print("EXACT_SOURCE=PASS")
          print("FROZEN_SHELL_HEADER_MENU_BOUNDARY=PASS")
          PY

      - name: Syntax and focused contracts
        working-directory: target
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l includes/admin-v13/views/system_plugins.php
          php -l includes/admin-v13/views/seo_keywords.php
          php -l tests/s01-c02-v8-reference-body-contract.php
          php -l tests/s01-c02-v8-render-fixture.php
          node --check assets/js/v13/system/plugins.js
          node --check tests/s01-c02-v8-browser-proof.js
          php tests/s01-c02-v8-reference-body-contract.php
          for test in \
            tests/s01-c02-121934-shell-header-visual-lock-r45-contract.php \
            tests/s01-c02-prod-realuse-r18-unified-page-frame-contract.php \
            tests/s01-c02-prod-realuse-r20-production-screenshot-closure-contract.php \
            tests/s01-c02-page-body-system-v2-full-surface-contract.php
          do php "$test"; done
          echo "SOURCE_AND_REGRESSION=PASS"

      - name: Browser dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/v8-node
          cd /tmp/v8-node
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          echo "NODE_PATH=/tmp/v8-node/node_modules" >> "$GITHUB_ENV"
          test -x /usr/bin/google-chrome
          echo "V8_CHROME=/usr/bin/google-chrome" >> "$GITHUB_ENV"

      - name: Source-render browser proof
        working-directory: target
        shell: bash
        run: |
          set -Eeuo pipefail
          export V8_PROOF_DIR=/tmp/v8-proof
          node tests/s01-c02-v8-browser-proof.js | tee /tmp/v8-browser-output.txt
          grep -q '"pass":true' /tmp/v8-browser-output.txt
          test -f /tmp/v8-proof/browser-proof.json
          python3 - <<'PY'
          import json
          p=json.load(open("/tmp/v8-proof/browser-proof.json"))
          assert p["pass"] is True
          assert len(p["checks"]) == 32
          assert all(not x["failures"] for x in p["checks"])
          assert p["owner_product_pass"] is False
          print("SOURCE_RENDER_BROWSER_32=PASS")
          PY

      - name: Candidate receipt
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/v8-proof
          cat >/tmp/v8-proof/CANDIDATE_RECEIPT.txt <<EOF
          PROJECT=S01-C02
          TARGET_SHA=$TARGET_SHA
          BASE_SHA=$BASE_SHA
          OWNER_PRODUCT_PASS=NOT_CLAIMED
          PRODUCT_WRITE=NO
          RELEASE=NO
          PRODUCTION=NO
          EOF

      - name: Upload public-safe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-v8-pr201-candidate-${{ github.run_id }}
          path: /tmp/v8-proof
          retention-days: 14
          if-no-files-found: error
