name: P07 Release18 Distribution Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'installers/p07.sh'
      - 'installers/p07-final.sh'
      - 'installers/p07-toolbox.sh'
      - 'dist/p07/0.1.0/overlay/**'
      - '.github/workflows/p07-release18-distribution-gate.yml'

permissions:
  contents: read

jobs:
  distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Release18 identity
        run: |
          set -Eeuo pipefail
          root='dist/p07/0.1.0/overlay'
          test "$(cat "$root/BUILD_ID")" = '0.1.0-release18'
          grep -Fq 'EXPECTED_BUILD_ID="0.1.0-release18"' installers/p07-final.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release18"' installers/p07-toolbox.sh
          grep -Fq 'RUNTIME_MANIFEST_BLOB="a7ae163c8c6ddbe402ad04797098e321d8f42e64"' installers/p07-final.sh
          grep -Fq 'EXPECTED_BLOB="3e5e6bf4cfbbf1232d3a28f9696efb29430d234c"' installers/p07.sh
          grep -Fq '## Restore-As Nginx Listener-aware Verification Contract' "$root/docs/authority/RPD.md"
          grep -Fq '| B50 | Restore-As Target Nginx Listener Discovery |' "$root/docs/authority/ACCEPTANCE_MATRIX.md"

      - name: Exact overlay and runtime manifests
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('dist/p07/0.1.0/overlay')
          def blob(path: Path) -> str:
              data=path.read_bytes()
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()

          for name in ('RUNTIME.gitblob','MANIFEST.gitblob'):
              seen=set()
              for line in (root/name).read_text(encoding='utf-8').splitlines():
                  if not line.strip():
                      continue
                  expected, rel=line.split('  ',1)
                  assert rel not in seen, (name, rel)
                  seen.add(rel)
                  path=root/rel
                  assert path.is_file(), (name, rel)
                  assert blob(path)==expected, (name, rel, blob(path), expected)

          runtime=(root/'RUNTIME.gitblob').read_text(encoding='utf-8')
          required={
              'BUILD_ID':'34af8b49433aeb8c0a6da0aae6231df191056721',
              'lib/restore_as_verified.py':'4283b7370dc6f1207f4ca6de282480492ce4a5e1',
              'lib/restore_failure_ui.sh':'0c16aa16ffe4cc4350301f5704b2bb9bf83ba13d',
          }
          for rel, expected in required.items():
              assert f'{expected}  {rel}' in runtime, rel
          PY

      - name: Release18 listener-aware contract
        run: |
          set -Eeuo pipefail
          root='dist/p07/0.1.0/overlay'
          grep -Fq 'def _nginx_target_listener_addresses' "$root/lib/restore_as_verified.py"
          grep -Fq 'def _nginx_target_server_blocks' "$root/lib/restore_as_verified.py"
          grep -Fq 'target_listener=UNREACHABLE' "$root/lib/restore_as_verified.py"
          grep -Fq 'target_listener=MISSING' "$root/lib/restore_as_verified.py"
          grep -Fq 'target_listener=UNREACHABLE' "$root/lib/restore_failure_ui.sh"
          grep -Fq 'target_listener=MISSING' "$root/lib/restore_failure_ui.sh"
          grep -Fq -- '"--noproxy",' "$root/lib/restore_as_verified.py"

      - name: Syntax and compile
        run: |
          set -Eeuo pipefail
          root='dist/p07/0.1.0/overlay'
          bash -n "$root/bin/vfops-site-ui"
          bash -n "$root/lib/restore_failure_ui.sh"
          python3 -m py_compile             "$root/lib/restore_as_verified.py"             "$root/lib/restore_as.py"             "$root/lib/restore_apply_core.py"             "$root/lib/verify.py"

      - name: Public overlay release18 regressions
        run: |
          set -Eeuo pipefail
          cd dist/p07/0.1.0/overlay
          export PYTHONPATH="$PWD/lib"
          python3 -m unittest -q             tests.test_restore_as_verified             tests.test_release16_restore_as_sqlite             tests.test_restore_as             tests.test_terminal_ui_color_contract             tests.test_user_entry

      - name: Listener parser and multi-address behavior
        run: |
          set -Eeuo pipefail
          root='dist/p07/0.1.0/overlay'
          export PYTHONPATH="$PWD/$root/lib"
          python3 - <<'PY'
          import subprocess
          from unittest import mock
          import restore_as_verified as r

          dump = """
          server {
              listen 80;
              listen [::]:80;
              server_name other.example.com;
          }
          server {
              listen 192.0.2.44:80;
              listen [2001:db8::44]:80;
              listen 443 ssl;
              server_name restore.example.com www.restore.example.com;
              location / { try_files $uri =404; }
          }
          """
          proc=subprocess.CompletedProcess([],0,stdout=dump,stderr="")
          with mock.patch.object(r,'_run',return_value=proc):
              http=r._nginx_target_listener_addresses('/usr/sbin/nginx','restore.example.com',80)
              https=r._nginx_target_listener_addresses('/usr/sbin/nginx','restore.example.com',443)
          assert http==['192.0.2.44','2001:db8::44'], http
          assert https==['127.0.0.1'], https
          assert '127.0.0.1' not in http

          with mock.patch.object(r,'_http_code',side_effect=[(7,'000'),(0,'200')]) as probe:
              rc,code=r._http_probe('/usr/bin/curl','restore.example.com','http',80,
                                    addresses=('192.0.2.44','192.0.2.45'),
                                    attempts_per_address=1)
          assert (rc,code)==(0,'200')
          assert probe.call_args_list[0].kwargs['address']=='192.0.2.44'
          assert probe.call_args_list[1].kwargs['address']=='192.0.2.45'
          PY

      - name: Isolated current-runtime install
        run: |
          set -Eeuo pipefail
          root="$PWD"
          tmp="$(mktemp -d)"
          export P07_PUBLIC_ROOT="file://$root"
          export P07_INSTALL_DIR="$tmp/install"
          export P07_PREVIOUS_DIR="$tmp/previous"
          export P07_BIN_LINK="$tmp/vfops"
          export P07_ALLOW_NONROOT=1
          export P07_NO_EXEC=1

          bash installers/p07-final.sh >"$tmp/install.log"
          test "$("$tmp/vfops" --version)" = 'VF Server Ops 0.1.0'
          test "$("$tmp/vfops" --build-id)" = '0.1.0-release18'
          grep -Fq 'lib/restore_as_verified.py' "$tmp/install/.runtime-manifest.gitblob"
          grep -Fq 'lib/restore_failure_ui.sh' "$tmp/install/.runtime-manifest.gitblob"

          bash installers/p07-final.sh >"$tmp/second.log"
          grep -Fq '已是当前版本，无需下载或重复安装' "$tmp/second.log"

      - name: Beginner listener failure classification
        run: |
          set -Eeuo pipefail
          root='dist/p07/0.1.0/overlay'
          tmp="$(mktemp -d)"

          cat >"$tmp/missing.err" <<'EOF'
          ERROR: Restore-As local verification failed; rollback=PASS; reason=local Host routing verification failed; target_vhost=PRESENT; target_listener=MISSING
          EOF
          NO_COLOR=1 bash -c "source '$root/lib/terminal_ui.sh'; source '$root/lib/restore_failure_ui.sh'; render_restore_failure '$tmp/missing.err'" >"$tmp/missing.out"
          grep -Fq '没有发现可用于本机 HTTP 验证的 80 端口监听' "$tmp/missing.out"
          ! grep -Fq 'target_listener=MISSING' "$tmp/missing.out"

          cat >"$tmp/unreachable.err" <<'EOF'
          ERROR: Restore-As local verification failed; rollback=PASS; reason=local Host routing verification failed; target_vhost=PRESENT; target_listener=UNREACHABLE
          EOF
          NO_COLOR=1 bash -c "source '$root/lib/terminal_ui.sh'; source '$root/lib/restore_failure_ui.sh'; render_restore_failure '$tmp/unreachable.err'" >"$tmp/unreachable.out"
          grep -Fq '找到了 Nginx 实际 HTTP 监听地址，但本机仍无法连通' "$tmp/unreachable.out"
          ! grep -Fq 'target_listener=UNREACHABLE' "$tmp/unreachable.out"

      - name: Safety boundary
        run: |
          set -Eeuo pipefail
          root='dist/p07/0.1.0/overlay'
          ! grep -R -n -E '(PRIVATE KEY|BEGIN OPENSSH|ghp_[A-Za-z0-9]|github_pat_)' "$root/bin" "$root/lib" installers/p07*.sh
          ! grep -R -n -E '(^|[^A-Za-z])(rm[[:space:]]+-rf[[:space:]]+/($|[[:space:]]))' installers/p07*.sh "$root/bin" "$root/lib"
          grep -Fq 'cleanup_database' "$root/lib/restore_as_verified.py"
          grep -Fq 'cleanup_site' "$root/lib/restore_as_verified.py"
          grep -Fq 'DNS 没有修改，原网站没有修改。' "$root/lib/restore_failure_ui.sh"

      - name: Result
        if: always()
        run: |
          echo 'P07_RELEASE18_DISTRIBUTION_GATE=COMPLETE'
          echo 'P07_PRODUCTION_WRITE=NOT_RUN'
