name: P01 Credential Runtime Adapter E2E

on:
  push:
    branches: [main]
    paths:
      - 'ops/p01/P01_V2.21.14_CREDENTIAL_RUNTIME_ACTIVATOR.php'
      - '.github/workflows/p01-credential-runtime-adapter-e2e.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout public runner
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: runner

      - name: Checkout exact P01 Production 2.21.14
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: 7c7ad1da3e8dcd49fa49313317c389948f40d4de
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: production

      - name: Checkout exact P01 Candidate 2.21.15 for sealed bridge bytes only
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: e6d71b3309fb24b11139c6febf7dcaf0f9106e87
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate

      - name: Prepare PHP runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-zip sqlite3 >/dev/null
          php -r 'foreach(["pdo_sqlite","curl","sodium","zip"] as $x){if(!extension_loaded($x)){fwrite(STDERR,"missing:$x\n");exit(1);}} echo "P01_CREDENTIAL_RUNTIME_DEPS=PASS\n";'

      - name: Assemble exact 2.21.14 + already-sealed Discovery Bridge fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          cp candidate/src/app/UpdateManager.php production/src/app/UpdateManager.php
          mkdir -p production/src/app/CoreUpdates
          cp candidate/src/app/CoreUpdates/UpdateCore.php production/src/app/CoreUpdates/UpdateCore.php
          cp candidate/src/app/CoreUpdates/GitHubClient.php production/src/app/CoreUpdates/GitHubClient.php
          cp runner/ops/p01/P01_V2.21.14_CREDENTIAL_RUNTIME_ACTIVATOR.php production/src/P01_V2.21.14_CREDENTIAL_RUNTIME_ACTIVATOR.php
          test "$(tr -d '\r\n' < production/src/VERSION.txt)" = '2.21.14'
          php -l production/src/P01_V2.21.14_CREDENTIAL_RUNTIME_ACTIVATOR.php >/dev/null
          echo 'P01_FIXTURE_BRIDGE_SOURCE=CORE-UPDATES'

      - name: Fresh-install exact Production fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          php -S 127.0.0.1:18131 -t production/src >/tmp/p01-credential-server-1.log 2>&1 &
          echo $! >/tmp/p01-credential-server-1.pid
          for i in $(seq 1 40); do
            if curl -fsS -c /tmp/p01-credential.cookies http://127.0.0.1:18131/setup.php -o /tmp/p01-credential-setup.html; then break; fi
            sleep 1
          done
          csrf="$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-credential-setup.html',encoding='utf-8').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s)
          print(m.group(1) if m else '')
          PY
          )"
          test -n "$csrf"
          curl -fsS -b /tmp/p01-credential.cookies -c /tmp/p01-credential.cookies -X POST http://127.0.0.1:18131/setup.php \
            --data-urlencode "setup_csrf=$csrf" \
            --data-urlencode 'site_title=P01 Credential Runtime E2E' \
            --data-urlencode 'admin_password=P01CredentialRuntime!22114' \
            --data-urlencode 'admin_password_confirm=P01CredentialRuntime!22114' \
            -o /tmp/p01-credential-setup-result.html
          test -f production/src/app/.runtime.php
          test "$(tr -d '\r\n' < production/src/VERSION.txt)" = '2.21.14'
          echo 'P01_FIXTURE_INSTALL=PASS'

      - name: Read one-time VPS public key and nonce
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsS 'http://127.0.0.1:18131/P01_V2.21.14_CREDENTIAL_RUNTIME_ACTIVATOR.php?relay=info' -o /tmp/p01-credential-info.json
          php -r '$d=json_decode(file_get_contents("/tmp/p01-credential-info.json"),true); if(!is_array($d)||($d["ok"]??false)!==true||($d["status"]??"")!=="ready"||($d["project_id"]??"")!=="P01"||($d["current_version"]??"")!=="2.21.14"||($d["bridge_source"]??"")!=="CORE-UPDATES"||empty($d["public_key_b64"])||empty($d["nonce"])) exit(1); echo "P01_RELAY_ENDPOINT_READY=PASS\n";'

      - name: Negative relay nonce fail-closed
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '%s' '{"nonce":"invalid","sealed_token_b64":"AA=="}' >/tmp/p01-invalid-relay.json
          code="$(curl -sS -o /tmp/p01-invalid-result.json -w '%{http_code}' -H 'Content-Type: application/json' --data-binary @/tmp/p01-invalid-relay.json 'http://127.0.0.1:18131/P01_V2.21.14_CREDENTIAL_RUNTIME_ACTIVATOR.php?relay=token')"
          test "$code" = '409'
          grep -q 'RELAY_NONCE_MISMATCH' /tmp/p01-invalid-result.json
          echo 'P01_INVALID_RELAY_FAIL_CLOSED=PASS'

      - name: Seal existing unified token in memory and relay to fixture
        shell: bash
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$VF_PRIVATE_READ_TOKEN"
          php -r '
          $info=json_decode(file_get_contents("/tmp/p01-credential-info.json"),true);
          $token=(string)getenv("VF_PRIVATE_READ_TOKEN");
          $pk=base64_decode((string)($info["public_key_b64"]??""),true);
          $nonce=(string)($info["nonce"]??"");
          if(!is_array($info)||$token===""||!is_string($pk)||strlen($pk)!==SODIUM_CRYPTO_BOX_PUBLICKEYBYTES||$nonce==="") throw new RuntimeException("relay input invalid");
          $sealed=sodium_crypto_box_seal($token,$pk);
          file_put_contents("/tmp/p01-credential-payload.json",json_encode(["nonce"=>$nonce,"sealed_token_b64"=>base64_encode($sealed)],JSON_UNESCAPED_SLASHES));
          sodium_memzero($token);
          '
          curl -fsS -H 'Content-Type: application/json' --data-binary @/tmp/p01-credential-payload.json 'http://127.0.0.1:18131/P01_V2.21.14_CREDENTIAL_RUNTIME_ACTIVATOR.php?relay=token' -o /tmp/p01-credential-activation.json
          php -r '$d=json_decode(file_get_contents("/tmp/p01-credential-activation.json"),true); if(!is_array($d)||($d["ok"]??false)!==true||($d["status"]??"")!=="success"||($d["credential_runtime"]??"")!=="PASS"||($d["current"]??"")!=="2.21.14"||($d["latest"]??"")!=="2.21.15"||empty($d["available"])||empty($d["can_update"])||($d["update_source"]??"")!=="core-updates"||($d["repository"]??"")!=="core-updates + GitHub Release"||($d["release"]??"")!=="v2.21.15"||($d["asset"]??"")!=="VF_Start_V2.21.15_UPDATE.zip"||(int)($d["asset_bytes"]??0)!==1073031||($d["asset_sha256"]??"")!=="7562fbc82b59de09c1f1b0dc77e0ca2e2f73ad556f969d6225a7cca5fd1b5947"||($d["production_upgrade"]??"")!=="NOT_EXECUTED") exit(1); echo "P01_SEALED_RELAY_ACTIVATION=PASS\n";'
          rm -f /tmp/p01-credential-payload.json

      - name: Restart PHP to prove persistent runtime loading without inherited secret
        shell: bash
        run: |
          set -Eeuo pipefail
          kill "$(cat /tmp/p01-credential-server-1.pid)" || true
          wait "$(cat /tmp/p01-credential-server-1.pid)" 2>/dev/null || true
          unset VF_PRIVATE_READ_TOKEN || true
          php -S 127.0.0.1:18132 -t production/src >/tmp/p01-credential-server-2.log 2>&1 &
          echo $! >/tmp/p01-credential-server-2.pid
          for i in $(seq 1 30); do
            if curl -fsS 'http://127.0.0.1:18132/P01_V2.21.14_CREDENTIAL_RUNTIME_ACTIVATOR.php?relay=verify' -o /tmp/p01-credential-verify.json; then break; fi
            sleep 1
          done
          php -r '$d=json_decode(file_get_contents("/tmp/p01-credential-verify.json"),true); if(!is_array($d)||($d["ok"]??false)!==true||empty($d["ready"])||($d["credential_runtime"]??"")!=="PASS"||($d["current"]??"")!=="2.21.14"||($d["latest"]??"")!=="2.21.15"||empty($d["available"])||empty($d["can_update"])||($d["update_source"]??"")!=="core-updates"||($d["repository"]??"")!=="core-updates + GitHub Release"||($d["production_upgrade"]??"")!=="NOT_EXECUTED") exit(1); echo "P01_FRESH_PROCESS_RUNTIME_CREDENTIAL=PASS\n";'
          sleep 1
          test ! -f production/src/P01_V2.21.14_CREDENTIAL_RUNTIME_ACTIVATOR.php

      - name: Runtime secret safety and invariants
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(tr -d '\r\n' < production/src/VERSION.txt)" = '2.21.14'
          runtime='production/src/app/.runtime.php'
          grep -q 'P01_VF_PRIVATE_READ_TOKEN_RUNTIME_ADAPTER_V1' "$runtime"
          secret="$(find production/src -maxdepth 3 -type f -path '*/runtime-secrets/vf-private-read-token.php' -print -quit)"
          test -n "$secret"
          test "$(stat -c '%a' "$secret")" = '600'
          test "$(stat -c '%a' "$(dirname "$secret")")" = '700'
          php -r '$p=$argv[1];$v=include $p;if(!is_string($v)||trim($v)==="")exit(1); echo "P01_PRIVATE_SECRET_FILE=PASS\n";' "$secret"
          php -r 'require $argv[1]; if((string)VF_VERSION!=="2.21.14")exit(1); $s=(new VfMigrationRunner(vf_db()))->schemaState(); if((string)($s["current_head"]??"")!=="2026080902")exit(2); if(trim((string)getenv("VF_PRIVATE_READ_TOKEN"))==="")exit(3); $u=new VfUpdateManager(vf_db()); $st=$u->status(); if(($st["update_source"]??"")!=="core-updates")exit(4); echo "P01_RUNTIME_INVARIANTS=PASS\n";' production/src/app/bootstrap.php
          echo 'P01_PRODUCTION_UPGRADE=NOT_EXECUTED'
          echo 'P01_CREDENTIAL_RUNTIME_ADAPTER_E2E=PASS'

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/p01-credential-server-1.pid ]; then kill "$(cat /tmp/p01-credential-server-1.pid)" 2>/dev/null || true; fi
          if [ -f /tmp/p01-credential-server-2.pid ]; then kill "$(cat /tmp/p01-credential-server-2.pid)" 2>/dev/null || true; fi
          rm -f /tmp/p01-credential-info.json /tmp/p01-invalid-relay.json /tmp/p01-invalid-result.json /tmp/p01-credential-payload.json /tmp/p01-credential-activation.json /tmp/p01-credential-verify.json
