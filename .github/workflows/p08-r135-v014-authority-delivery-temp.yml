name: P08 R135 v014 actual 13-domain authority and package delivery TEMP
on:
  pull_request:
    paths: [.github/workflows/p08-r135-v014-authority-delivery-temp.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    env:
      P08_R130_ISOLATED: "YES"
      P08_R132_ISOLATED: "YES"
      P08_ISOLATED_INSTALL_TEST: "YES"
      P08_CANDIDATE_SOURCE_SHA: b371cc6d8f52089b818bf1990f245bd25007f931
      P08_CANDIDATE_VERSION: "0.1.4"
    steps:
      - name: Setup PHP8.4 and isolated runtime extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip,sqlite3,pdo_sqlite,pdo_mysql,posix,mbstring,dom,curl
          coverage: none
          tools: composer:v2
      - name: Node22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checkout only exact private source temporarily
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: b371cc6d8f52089b818bf1990f245bd25007f931
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p08-source
          persist-credentials: false
      - name: Read exact effective GOV-DOC main current authority (transient)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 5aeb01605290e2170c98efda79afffb1cff7a206
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: gov
          persist-credentials: false
      - name: Compile locked Composer plus Vite source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p08-source rev-parse HEAD)" = "b371cc6d8f52089b818bf1990f245bd25007f931"
          test "$(cat p08-source/VERSION)" = '0.1.4'
          cd p08-source
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress > "$RUNNER_TEMP/p08-r132-composer.log" 2>&1
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-r132-node.log" 2>&1
          npm run build >> "$RUNNER_TEMP/p08-r132-node.log" 2>&1
          python3 -B -m unittest discover -s tests -p 'test_r132_live_release_proof.py' -v
          python3 -B -m py_compile scripts/build_r130_onefile.py scripts/r132_live_release_proof.py tests/compatibility/r132_candidate_package_gate.py
          echo P08_R132_LOCKED_CANDIDATE_RUNTIME_BUILD_AND_NEGATIVE_UNIT=PASS
      - name: Download exact issued official v0.1.3 FULL zip
        shell: bash
        env:
          P08_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --max-time 90 \
            --header "Authorization: Bearer $P08_PRIVATE_READ_TOKEN" \
            --header "Accept: application/octet-stream" \
            https://api.github.com/repos/llhzx2018/vf-adops/releases/assets/753599121 \
            --output "$RUNNER_TEMP/p08-r132-issued-013.zip"
          echo "80556ab606aec6080b05000b41073e597578544162ac918277bd0629cf020527  $RUNNER_TEMP/p08-r132-issued-013.zip" | sha256sum -c --status
          test "$(wc -c < "$RUNNER_TEMP/p08-r132-issued-013.zip")" -eq 8294042
          echo P08_R132_OFFICIAL_013_FULL_BYTES_AND_SHA256=PASS
      - name: Build exact candidate FULL and Atomic twice with source-bound old manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p08-source
          python3 -B - <<'PY'
          import hashlib,os,sys,zipfile
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from build_full import write_full
          from build_atomic import write_atomic
          t=Path(os.environ['RUNNER_TEMP'])
          root=Path('.')
          target='b371cc6d8f52089b818bf1990f245bd25007f931'
          with zipfile.ZipFile(t/'p08-r132-issued-013.zip') as z:
              oldhash=hashlib.sha256(z.read('FULL_MANIFEST.json')).hexdigest()
          write_full(root,t/'p08-r132-candidate-full.zip','0.1.4',target)
          write_atomic(root,t/'p08-r132-candidate-atomic.zip',
              source_version='0.1.3',
              source_sha='44d504185f0ac8cf4be552dc5adada989a08b40e',
              source_full_manifest_sha256=oldhash,
              target_version='0.1.4',target_sha=target)
          print('P08_R132_CANDIDATE_CODE_ONLY_FULL_ATOMIC_CREATED_NOT_RELEASED=PASS')
          PY
          python3 -B tests/compatibility/r132_candidate_package_gate.py \
            --full "$RUNNER_TEMP/p08-r132-candidate-full.zip" \
            --atomic "$RUNNER_TEMP/p08-r132-candidate-atomic.zip" \
            --old "$RUNNER_TEMP/p08-r132-issued-013.zip" \
            --source "$GITHUB_WORKSPACE/p08-source" --sha "b371cc6d8f52089b818bf1990f245bd25007f931"
          php -l "$RUNNER_TEMP/p08-owner-forward-once.php"
      - name: Apply current 13-domain authorities and canonical actual FULL plus Atomic delivery
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          python3 -B - <<'PY'
          from pathlib import Path
          import json,hashlib,os,sys,subprocess
          root=Path('p08-source').resolve(); gov=Path('gov').resolve(); t=Path(os.environ['RUNNER_TEMP']).resolve()
          source=os.environ['P08_CANDIDATE_SOURCE_SHA']
          assert subprocess.check_output(['git','-C',str(root),'rev-parse','HEAD'],text=True).strip()==source
          assert subprocess.check_output(['git','-C',str(gov),'rev-parse','HEAD'],text=True).strip()=='5aeb01605290e2170c98efda79afffb1cff7a206'
          assert (root/'VERSION').read_text().strip()=='0.1.4'
          acceptance=(root/'docs/authority/ACCEPTANCE_MATRIX.md').read_text()
          assert '## RP-07N' in acceptance and 'P08_RP07N_CASE=' in acceptance
          router=gov/'governance/public-authority/VF_PUBLIC_AUTHORITY_APPLICABILITY_ROUTER_V1.0.json'
          domains=json.loads(router.read_text())['domains']
          required={'INSTALL','SECURITY','TESTING','UPGRADE','DATA_SCHEMA','API_PROVIDER','CRON_JOB','OBSERVABILITY','GIT','UA_UI'}
          conditional={'NOTIFICATION','PERFORMANCE'}
          not_applicable={'SEO'}
          assert set(domains)==required|conditional|not_applicable
          for name,record in domains.items():
              assert (gov/record['authority']).is_file() and (gov/record['authority']).stat().st_size>0,name
              assert '| '+name+' |' in (root/'docs/authority/PUBLIC_AUTHORITY_APPLICABILITY.md').read_text(),name
          print('P08_R135_ACTUAL_13_DOMAIN_AUTHORITIES_READ_10_REQUIRED_2_CONDITIONAL_1_NA=PASS')
          sys.path.insert(0,str(root/'scripts'))
          from build_full import verify_canonical_full_contract
          full=t/'p08-r132-candidate-full.zip'; atom=t/'p08-r132-candidate-atomic.zip'
          for phase in ('resolve','delivery'):
              verify_canonical_full_contract(root,full,source,gov,phase)
              print('P08_R135_CANONICAL_FULL_'+phase.upper()+'=PASS')
          task=gov/'governance/public-authority/tools/task_delivery_contract_lint.py'
          caps=['source_change','full_package','installer_ui','auth','database','online_upgrade','external_api','background_job','release_visibility']
          paths={'agents':'AGENTS.md','current':'docs/authority/CURRENT.md','acceptance':'docs/authority/RPD.md','applicability':'docs/authority/PUBLIC_AUTHORITY_APPLICABILITY.md'}
          for kind,name in [('web_full_zip',full),('web_atomic_zip',atom)]:
              receipt={'schema':'vf.public-authority.task-delivery-check.v1','project':'P08','source':source,
                  'project_authority':paths,'acceptance_markers':['WordPress-simple','CloudPanel'],
                  'required_domains':sorted(required),'task_capabilities':caps,
                  'delivery':{'profile':kind,'entrypoint':'public/index.php','requires_git':False,
                      'requires_manual_source_copy':False,'artifact':name.name,'sha256':hashlib.sha256(name.read_bytes()).hexdigest()}}
              file=t/('p08-r135-'+kind+'.json'); file.write_text(json.dumps(receipt))
              for phase in ('resolve','delivery'):
                  proc=subprocess.run([sys.executable,'-B',str(task),'--phase',phase,'--receipt',str(file),
                    '--project-root',str(root),'--artifact-root',str(t),'--public-router',str(router)],
                    capture_output=True,text=True)
                  if proc.returncode:
                      print('P08_R135_'+kind+'_'+phase+'_FAIL '+proc.stdout[-500:].replace('\n','|'))
                      raise RuntimeError('R135_REQUIRED_DELIVERY_STRUCTURAL_GATE_FAIL')
                  print('P08_R135_'+kind.upper()+'_'+phase.upper()+'=PASS')
          print('P08_R135_CANDIDATE_AUTHORITY_AND_ACTUAL_PACKAGE_STRUCTURE=PASS')
          PY
      - name: Actual extracted candidate FULL clean Owner installation
        shell: bash
        run: |
          set -Eeuo pipefail
          site="$RUNNER_TEMP/p08-r132-sqlite-full"
          mkdir -m 0700 "$site"
          unzip -q "$RUNNER_TEMP/p08-r132-candidate-full.zip" -d "$site"
          php p08-source/tests/test_extracted_full_sqlite_e2e.php "$site"
          echo P08_R132_CANDIDATE_CLEAN_FULL_SQLITE_OWNER_INSTALL=PASS
      - name: Official release negative check (no new tag means no publishable onefile)
        shell: bash
        env:
          P08_RELEASE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          cd p08-source
          python3 -B - <<'PY'
          import hashlib,sys,os
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from r132_live_release_proof import require_official_next_release
          t=Path(os.environ['RUNNER_TEMP']); f=t/'p08-r132-candidate-full.zip';a=t/'p08-r132-candidate-atomic.zip'
          try:
              require_official_next_release('b371cc6d8f52089b818bf1990f245bd25007f931',hashlib.sha256(f.read_bytes()).hexdigest(),f.stat().st_size,hashlib.sha256(a.read_bytes()).hexdigest(),a.stat().st_size)
          except ValueError as e:
              if str(e)!='R132_OFFICIAL_NEXT_NOT_PUBLISHED': raise
          else:
              raise RuntimeError('R132_UNAUTHORIZED_RELEASE_EXISTS_REQUIRE_NEW_APPROVAL')
          print('P08_R132_REAL_GITHUB_UNISSUED_NEXT_BLOCKED=PASS')
          PY
      - name: Always purge transient private source, official zip and synthetic site
        if: always()
        shell: bash
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/p08-source" "$GITHUB_WORKSPACE/gov" "$RUNNER_TEMP"/p08-r132-* "$RUNNER_TEMP/p08-owner-forward-once.php"
