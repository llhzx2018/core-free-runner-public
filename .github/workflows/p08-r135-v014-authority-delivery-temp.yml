name: P08 R135 exact PR55-56-57 shared architecture gate TEMP
on:
  pull_request:
    paths: [.github/workflows/p08-r135-v014-authority-delivery-temp.yml]
permissions:
  contents: read
jobs:
  validate:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact private P08 candidate with all Git ancestors transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: f1d73d9b4fafd2c125a2060d11abdbce371c093f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: p08-source
          persist-credentials: false
      - name: Checkout exact GOV-DOC architecture and reuse source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 5aeb01605290e2170c98efda79afffb1cff7a206
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: gov
          persist-credentials: false
      - name: Node22 for precise changed UI source
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing architecture adapter actual Git diff and negative fixtures
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p08-source rev-parse HEAD)" = 'f1d73d9b4fafd2c125a2060d11abdbce371c093f'
          test "$(git -C gov rev-parse HEAD)" = '5aeb01605290e2170c98efda79afffb1cff7a206'
          git -C p08-source merge-base --is-ancestor 3d41b06c627fd6c7022d7a3eda01027bb272edeb f1d73d9b4fafd2c125a2060d11abdbce371c093f
          test -z "$(git -C p08-source status --porcelain)"
          python3 -B p08-source/.github/checks/architecture_gate.py \
            --manifest p08-source/.github/checks/code_architecture.json \
            --gov-root gov --git-root p08-source \
            --base-sha 3d41b06c627fd6c7022d7a3eda01027bb272edeb --head-sha f1d73d9b4fafd2c125a2060d11abdbce371c093f
          python3 -B -m unittest discover -s p08-source/.github/checks -p 'test_architecture_gate.py' -v
          echo P08_R135_GIT_ARCHITECTURE_NAMING_AND_REUSE_GROWTH=PASS
      - name: Existing Vue TS typecheck, Vitest unit and Vite actual built assets
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p08-source
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-r135-node.log" 2>&1
          npm run typecheck >> "$RUNNER_TEMP/p08-r135-node.log" 2>&1 || { echo P08_R135_UI_TYPECHECK_FAIL; tail -n 60 "$RUNNER_TEMP/p08-r135-node.log"; exit 1; }
          npm run test:unit >> "$RUNNER_TEMP/p08-r135-node.log" 2>&1 || { echo P08_R135_VITEST_FAIL; tail -n 60 "$RUNNER_TEMP/p08-r135-node.log"; exit 1; }
          npm run build >> "$RUNNER_TEMP/p08-r135-node.log" 2>&1 || { echo P08_R135_VITE_BUILD_FAIL; tail -n 60 "$RUNNER_TEMP/p08-r135-node.log"; exit 1; }
          echo P08_R135_UI_TYPECHECK_VITEST_VITE=PASS
      - name: Always purge transient private P08 source and GOV-DOC source
        if: always()
        shell: bash
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/p08-source" "$GITHUB_WORKSPACE/gov"
          rm -f -- "$RUNNER_TEMP/p08-r135-node.log"
