name: P01 IA6 487 unknown write dismissal matrix (test-only)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-ia6-487-unknown-dismiss-matrix-20261101.yml'
permissions:
  contents: read
jobs:
  verify:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'test(P01):')
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      PRODUCT_BRANCH: feat/ia-v6-frontstage-admin-parity-system-jobs-r1
      PRODUCT_SHA: 3df793c16beb07f6c2629c7d3545a37c75a79cd4
    steps:
      - name: Checkout public test controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact private P01 candidate without publishing assets
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          actual="$(git ls-remote "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')"
          test "$actual" = "$PRODUCT_SHA"
          git clone -q --no-checkout "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" candidate
          git -C candidate fetch -q --depth 1 origin "$PRODUCT_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = '2.47.487'
          echo P01_IA6_UNCERTAIN_EXACT_SHA=PASS
      - name: Native task syntax, unknown-write dismissal, related contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in frontstage-brand-assets frontstage-update-credentials frontstage-source-credentials frontstage-plugin-lifecycle frontstage-recovery-files frontstage-operation-history frontstage-recycle-bulk frontstage-recycle-purge frontstage-resource-bulk frontstage-resource-suggestions frontstage-system-operations frontstage-tmdb-settings global-remote-sources local-music-advanced; do
            node --check "candidate/src/assets/${f}.js"
          done
          node candidate/tests/unit/p01_ia6_uncertain_write_dismiss_matrix_contract.cjs
          for f in p01_ia6_brand_assets_r8_contract p01_ia6_plugin_lifecycle_r6_contract p01_ia6_secure_settings_r3_contract p01_ia6_source_credential_uncertain_reentry_contract p01_ia6_recovery_files_r2_contract p01_ia6_recycle_bulk_r17_contract p01_ia6_recycle_purge_r16_contract p01_ia6_resource_bulk_r12_contract p01_ia6_resource_suggestions_r14_contract p01_ia6_system_jobs_r1_contract p01_ia6_music_native_r15_contract; do
            node "candidate/tests/unit/${f}.cjs"
          done
          echo P01_IA6_UNCERTAIN_DISMISS_SCOPE_REGRESSION=PASS
      - name: Cleanup protected checkout
        if: always()
        shell: bash
        run: |
          rm -rf candidate
          echo P01_IA6_UNCERTAIN_PRIVATE_SOURCE_CLEANUP=PASS
