name: P04 V2.5.4 E2E Fixture Patch

on:
  push:
    paths:
      - '.github/workflows/p04-v254-e2e-fixture-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Schema14 alert fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/p04-v254-browser-e2e.mjs')
          s=p.read_text(encoding='utf-8')
          old="INSERT INTO alerts(domain_id,alert_type,reminder_days,severity,title,message,fingerprint,status,triggered_at,last_seen_at,handled_note) VALUES(1,'expiry',30,'warning','域名即将到期','请确认续费安排','e2e-alert-1','pending','2026-08-15 16:05:00','2026-08-15 16:05:00','');"
          new="INSERT INTO alerts(domain_id,alert_type,reminder_days,severity,title,message,fingerprint,status,triggered_at,last_seen_at,last_triggered_at,handled_note) VALUES(1,'expiry',30,'medium','域名即将到期','请确认续费安排','e2e-alert-1','pending','2026-08-15 16:05:00','2026-08-15 16:05:00','2026-08-15 16:05:00','');"
          if s.count(old)!=1: raise SystemExit('alert fixture sentinel mismatch')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          node --check scripts/p04-v254-browser-e2e.mjs
          git diff --check
      - name: Commit fixture correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add scripts/p04-v254-browser-e2e.mjs
          git commit -m 'runner(P04): align V2.5.4 browser fixture with Schema14 alerts'
          git push origin HEAD:main
