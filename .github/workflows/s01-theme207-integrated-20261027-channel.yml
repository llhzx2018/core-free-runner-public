name: S01 exact Theme channel contract
on:
  push:
    branches: [task/s01-theme207-integrated-20261027]
    paths: ['.github/workflows/s01-theme207-integrated-20261027-channel.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.207
  TARGET_SHA: 19d47c311d8d85c6b9e6fbc1cdd38781c736c55b
  UPDATE_SHA: 82ed7f1edf182355c27e0c7f6e2ec5fc5f81676a
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: 82ed7f1edf182355c27e0c7f6e2ec5fc5f81676a
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: source
      - name: Channel identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-theme207-integrated-20261027/channel-spec.json --input control/.github/workflows/s01-theme207-integrated-20261027-channel.yml
      - name: Exact changed manifest and native protocol tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          test "$(git -C source diff --name-only fd9c6562815900811dff13823a7ad9db7abec15a 82ed7f1edf182355c27e0c7f6e2ec5fc5f81676a)" = projects/S01-C01.json
          git -C source diff --exit-code fd9c6562815900811dff13823a7ad9db7abec15a 82ed7f1edf182355c27e0c7f6e2ec5fc5f81676a -- projects/S01-C03.json
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PYCHANNEL'
          import json,os
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']==os.environ['TARGET_VERSION']
          assert m['asset_sha256']=='eeaf5e4bb4794c6cd73525538d093119594fc00446039f848003fd65f3aadb0a' and m['asset_bytes']==2010566
          assert m['runtime_files']==476 and '1.35.206' in m['from_versions']
          assert m['release_tag']=='v'+os.environ['TARGET_VERSION']
          import pathlib,subprocess
          base=json.loads(subprocess.check_output(['git','show','fd9c6562815900811dff13823a7ad9db7abec15a:projects/S01-C01.json']))
          changed={k for k in set(base)|set(m)if base.get(k)!=m.get(k)}
          assert changed=={'target_version','from_versions','release_tag','asset_name','asset_bytes','asset_sha256','notes','released_at'}
          assert m['from_versions']==base['from_versions']+['1.35.206']
          pathlib.Path('../proof').mkdir(exist_ok=True)
          pathlib.Path('../proof/channel.json').write_text(json.dumps({'status':'PASS','source':'82ed7f1edf182355c27e0c7f6e2ec5fc5f81676a','version':m['target_version'],'sha256':m['asset_sha256'],'bytes':m['asset_bytes'],'runtime_files':m['runtime_files'],'changed_fields':sorted(changed),'protocol_tests':'PASS','production':'UNTOUCHED'},indent=2))
          print('EXACT_CHANNEL_CONTRACT_PASS')
          PYCHANNEL
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-theme207-channel-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup
        if: always()
        run: rm -rf source
