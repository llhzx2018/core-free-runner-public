name: S01 homepage operational details proof
on:
  push:
    branches: [task/s01-home177-20261023]
    paths: ['.github/workflows/s01-home177-20261023.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.177
  TARGET_SHA: e904dca2c40cefe4e490e10f3614466e2c5e6473
  TARGET_TREE: 8bbd1bda740789d275e6853015dda76f37a637ac
  BASE_SHA: 3d5c4ca2293cfcdc0d93fe43ad8e10e5439ffba0
  SOURCE_VERSION: 1.35.176
  LANE_ID: s01-home177-20261023
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          ref: 02d4591eed025a3d3a67bc0a150b3ddc448c2ab8
          persist-credentials: false
          path: established
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: e904dca2c40cefe4e490e10f3614466e2c5e6473
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact package and focused syntax checks
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider baseline
          python3 control/lanes/s01-home177-20261023/package.py
          php -l target/src/footer.php
          php -l target/src/inc/services/frontend-page-progress-service.php
          php -l target/src/inc/public-css-owner-registry.php
          node --check target/src/assets/js/modules/public-shell-navigation.js
          node --check target/tests/home-operations-browser-check.cjs
          node --check control/lanes/s01-home177-20261023/clean.cjs
          gh release download v1.35.176 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.176.zip --dir provider
          echo 'ce2dae77c9f5ca6996c940f33f1e9e5c9f86cbd8b1b1fe5d0f6f8bf5596366a2  provider/vf-tools-theme_V1.35.176.zip' | sha256sum -c
          gh release download v1.25.94 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.94.zip --dir provider
          echo '70b90d40da5d69fc7819bd7ada3f15fb0145e64822b788bd94956c7827b2df03  provider/vf-tools-m3u8_V1.25.94.zip' | sha256sum -c
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -g -fsSL --retry 2 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC[wght].ttf' -o "$HOME/.local/share/fonts/NotoSansSC.ttf"
          fc-cache -f
      - name: Native WordPress bilingual home and upgrade rollback data protection
        run: |
          set -euo pipefail
          cp -a established/lanes/s01-frontend-design-20261017 lane
          cp control/lanes/s01-home177-20261023/clean.cjs lane/warm-admin.cjs
          bash control/lanes/s01-home177-20261023/native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-home-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target baseline provider
