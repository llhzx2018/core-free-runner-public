name: p01-505-modef-security-prerelease
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-505-modef-security-temp.yml'
      - 'specs/p01_505_modef_security_preflight.json'
      - 'templates/p01_505_modef_security.yml.in'
permissions:
  contents: read
jobs:
  prerelease:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    env:
      WORK: /tmp/p01-505-modef-${{ github.run_id }}
      TARGET_REPO: llhzx2018/vf-start
      TARGET_VERSION: 2.47.505
      TARGET_SHA: 7891f0f73984c0c7c73e7f16dd31f9b5875eacd4
      TARGET_TREE: e9786ea4399755764bd701b268129b5425b41cd5
      SOURCE_VERSION: 2.47.504
      BASE_SHA: 465890414fa9981af3ac8797c65f84f75db0d946
    steps:
      - name: Checkout registered public-safe Runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Preflight single spec and rendered source identity
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$WORK"
          python3 scripts/ephemeral_lane_spec.py validate --spec specs/p01_505_modef_security_preflight.json >/dev/null
          python3 scripts/ephemeral_lane_spec.py audit-rendered --spec specs/p01_505_modef_security_preflight.json --input .github/workflows/p01-505-modef-security-temp.yml
          python3 scripts/ephemeral_lane_spec.py render --spec specs/p01_505_modef_security_preflight.json --template templates/p01_505_modef_security.yml.in --output "$WORK/rendered.yml"
          cmp "$WORK/rendered.yml" .github/workflows/p01-505-modef-security-temp.yml
          echo P01_505_MODEF_SPEC_PASS=YES
      - name: Isolated PHP and Chromium setup
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd php-xml unzip curl >/dev/null
          php -m | grep -Fxi pdo_sqlite
          mkdir -p "$WORK/deps"
          npm install --prefix "$WORK/deps" --no-save --ignore-scripts --silent playwright@1.56.1
          export PLAYWRIGHT_BROWSERS_PATH="$WORK/browsers"
          "$WORK/deps/node_modules/.bin/playwright" install chromium
          echo P01_505_MODEF_TEST_RUNTIME=PASS
      - name: Fetch exact private main source, no public code persistence
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          test -n "$READ_TOKEN"
          remote="$(git ls-remote "https://x-access-token:$READ_TOKEN@github.com/$TARGET_REPO.git" refs/heads/main | awk '{print $1}')"
          test "$remote" = "$TARGET_SHA"
          git clone -q --no-checkout "https://x-access-token:$READ_TOKEN@github.com/$TARGET_REPO.git" "$WORK/candidate"
          git -C "$WORK/candidate" checkout -q --detach "$TARGET_SHA"
          git -C "$WORK/candidate" remote set-url origin "https://github.com/$TARGET_REPO.git"
          test "$(git -C "$WORK/candidate" rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C "$WORK/candidate" rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(tr -d '\r\n ' < "$WORK/candidate/VERSION")" = "$TARGET_VERSION"
          test "$(tr -d '\r\n ' < "$WORK/candidate/src/VERSION.txt")" = "$TARGET_VERSION"
          test "$(git -C "$WORK/candidate" rev-parse refs/tags/v$SOURCE_VERSION^{commit})" = "$BASE_SHA"
          ln -s "$WORK/deps/node_modules" "$WORK/candidate/node_modules"
          echo P01_505_MODEF_EXACT_SOURCE_PRIOR_FORMAL=PASS
      - name: Real localhost Owner Guest CSRF CAS native views and music
        shell: bash
        run: |
          set -Eeuo pipefail
          export PLAYWRIGHT_BROWSERS_PATH="$WORK/browsers"
          cat >"$WORK/setup-site.sh" <<'SH'
          set -Eeuo pipefail
          root="$1"; port="$2"; pass="IA6DisposableOnly!2026"
          case "$root" in
            /tmp/p01-ia6-r3-release505|/tmp/p01-ia6-source-page-release505|/tmp/p01-ia6-music-proof-release505|/tmp/p01-ia6-disaster-parity-release505|/tmp/p01-ia6-r11-release505) ;;
            *) exit 71;;
          esac
          test ! -e "$root"
          mkdir -p "$root"
          cp -a "$WORK/candidate/src/." "$root/"
          (cd "$root"; php -S "127.0.0.1:$port" -t . >"$WORK/php-$port.log" 2>&1 & echo $! >>"$WORK/pids")
          html="$WORK/setup-$port.html"
          for n in $(seq 1 50); do
            if curl --max-time 4 -fsS -c "$WORK/cookie-$port" -b "$WORK/cookie-$port" "http://127.0.0.1:$port/setup.php" -o "$html"; then break; fi
            sleep 1
          done
          csrf="$(python3 - "$html" <<'PY'
          import re,sys
          t=open(sys.argv[1],encoding='utf8').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',t)
          assert m
          print(m.group(1))
          PY
          )"
          curl -fsS -c "$WORK/cookie-$port" -b "$WORK/cookie-$port" \
            -X POST "http://127.0.0.1:$port/setup.php" \
            --data-urlencode "setup_csrf=$csrf" \
            --data-urlencode "site_title=Disposable P01 505" \
            --data-urlencode "admin_password=$pass" \
            --data-urlencode "admin_password_confirm=$pass" \
            -o "$WORK/complete-$port.html"
          (cd "$root"; php cli/verify.php) | grep -Fx VERIFY_PASS=YES
          test -f "$root/app/.runtime.php"
          SH
          export WORK
          bash "$WORK/setup-site.sh" "/tmp/p01-ia6-r3-release505" 18965
          bash "$WORK/setup-site.sh" "/tmp/p01-ia6-source-page-release505" 18966
          bash "$WORK/setup-site.sh" "/tmp/p01-ia6-music-proof-release505" 18967
          bash "$WORK/setup-site.sh" "/tmp/p01-ia6-disaster-parity-release505" 18968
          bash "$WORK/setup-site.sh" "/tmp/p01-ia6-r11-release505" 18969
          export P01_TEST_ORIGIN=http://127.0.0.1:18965
          export P01_TEST_PASSWORD=IA6DisposableOnly!2026
          export VF_E2E_RUNTIME_ROOT=/tmp/p01-ia6-r3-release505
          export VF_IA6_DISPOSABLE_ACK=IA6-R3-SYNTHETIC-ONLY
          # The R3 HTTP contract starts from a synthetic existing category.
          # Clean FULL intentionally initializes no personal category data.
          php -r 'require $argv[1]."/app/bootstrap.php"; $r=new VfRepository(vf_db()); $id=$r->createCategory(["name"=>"Disposable R3 Guard Category","description"=>"","icon"=>"","is_private"=>1,"sort_order"=>0]); if((int)$id<=0) exit(1); echo "P01_505_ISOLATED_CATEGORY_FIXTURE=PASS\n";' "$VF_E2E_RUNTIME_ROOT"
          python3 "$WORK/candidate/tests/integration/p01_ia6_r3_http_owner_guest_disposable.py"
          echo P01_505_MODEF_REAL_HTTP_PERMISSIONS_AND_CAS=PASS
          cd "$WORK"
          node candidate/tests/integration/p01_ia6_four_fallbacks_http_browser.mjs
          node candidate/tests/integration/p01_ia6_legacy_bookmark_native_browser.mjs
          node candidate/tests/integration/p01_watch_tmdb_independent_menu_browser.mjs
          node candidate/tests/integration/p01_ia6_27_routes_11_tabs_browser.mjs
          echo P01_505_MODEF_REAL_NATIVE_BROWSER_AND_FALLBACK=PASS
          export P01_TEST_ORIGIN=http://127.0.0.1:18966
          export VF_E2E_RUNTIME_ROOT=/tmp/p01-ia6-source-page-release505
          export VF_IA6_DISPOSABLE_ACK=IA6-SOURCE-PAGES-ONLY
          # This legacy synthetic seed was version-locked to 2.47.489;
          # adapt ONLY its isolated test identity, never application source.
          fixture="$WORK/candidate/tests/integration/p01_ia6_governed_source_paging_seed.php"
          grep -Fq "VF_VERSION!=='2.47.489'" "$fixture"
          sed -i "s/VF_VERSION!=='2.47.489'/VF_VERSION!=='$TARGET_VERSION'/" "$fixture"
          grep -Fq "VF_VERSION!=='$TARGET_VERSION'" "$fixture"
          test -z "$(git -C "$WORK/candidate" diff --name-only -- src)"
          test "$(git -C "$WORK/candidate" diff --name-only)" = "tests/integration/p01_ia6_governed_source_paging_seed.php"
          echo P01_505_MODEF_DISPOSABLE_LEGACY_FIXTURE_VERSION_ONLY=PASS
          node candidate/tests/integration/p01_ia6_governed_source_paging_browser.mjs
          echo P01_505_MODEF_REAL_SOURCE_PAGING_OWNER_ONLY=PASS
          export P01_TEST_ORIGIN=http://127.0.0.1:18967
          export VF_E2E_RUNTIME_ROOT=/tmp/p01-ia6-music-proof-release505
          export VF_IA6_DISPOSABLE_ACK=IA6-MUSIC-ONLY
          node candidate/tests/integration/p01_ia6_music_unknown_native_browser.mjs
          echo P01_505_MODEF_REAL_MUSIC_UNKNOWN_WRITE=PASS
      - name: Private data disaster restore and interrupted restore safety
        shell: bash
        run: |
          set -Eeuo pipefail
          export VF_E2E_RUNTIME_ROOT=/tmp/p01-ia6-disaster-parity-release505
          export VF_IA6_DISPOSABLE_ACK=IA6-DISASTER-DISPOSABLE-ONLY
          php "$WORK/candidate/tests/integration/p01_ia6_disaster_roundtrip_disposable.php"
          export VF_E2E_RUNTIME_ROOT=/tmp/p01-ia6-r11-release505
          unset VF_IA6_DISPOSABLE_ACK
          php "$WORK/candidate/tests/integration/p01_ia6_interrupted_restore_disposable.php"
          echo P01_505_MODEF_REAL_DISASTER_AND_INTERRUPT_RECOVERY=PASS
      - name: Always clean all private runtime source and synthetic assets
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -f "$WORK/pids" ]; then while IFS= read -r pid; do kill "$pid" 2>/dev/null || true; done < "$WORK/pids"; fi
          rm -rf /tmp/p01-ia6-r3-release505 /tmp/p01-ia6-source-page-release505 \
            /tmp/p01-ia6-music-proof-release505 /tmp/p01-ia6-disaster-parity-release505 \
            /tmp/p01-ia6-r11-release505
          case "$WORK" in /tmp/p01-505-modef-*) rm -rf "$WORK";; *) exit 66;; esac
          echo P01_505_MODEF_PUBLIC_ARTIFACT=NONE
          echo P01_505_MODEF_PRODUCTION_WRITE=NONE
