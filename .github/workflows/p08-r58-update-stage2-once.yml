name: P08 R58 GitHub update Token old flat owner page (one-off)
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p08-r58-update-stage2-once.yml']
permissions:
  contents: read
jobs:
  owner-token-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Public temporary checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exact target source in disposable private workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-adops
          ref: a73149178672a877758b66cf75ea8758ab68f31c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-p08
      - name: Unchanged original 0.1.0 flat source (test fixture)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-adops
          ref: 55ecbc8461a4d90fe7241a00caffa55e557cde1c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-flat
      - name: PHP 8.4 Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: curl, zip, sodium, pdo_sqlite, sqlite3, mbstring
      - name: Source and vendor-free Owner token security regressions
        run: |
          set -euo pipefail
          test "$(git -C private-p08 rev-parse HEAD)" = 'a73149178672a877758b66cf75ea8758ab68f31c'
          test "$(git -C private-flat rev-parse HEAD)" = '55ecbc8461a4d90fe7241a00caffa55e557cde1c'
          cd private-p08
          php -l scripts/owner-github-update-once.php
          php -l app/Http/Controllers/OwnerGitHubTokenController.php
          php -l src/Upgrade/OwnerGitHubReadToken.php
          php tests/test_owner_github_read_token.php
          php tests/test_owner_github_token_transport.php
          bash scripts/dev_check.sh > "$RUNNER_TEMP/p08-r58-dev.log" 2>&1 || { tail -n 65 "$RUNNER_TEMP/p08-r58-dev.log"; exit 1; }
          grep -F 'R1_LOCAL_SOURCE_TESTS=PASS' "$RUNNER_TEMP/p08-r58-dev.log"
          echo P08_R58_FULL_VENDOR_FREE_SOURCE_GATE=PASS
      - name: Setup original flat Laravel in disposable SQLite site
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/p08-r58-flat-site"
          cp -a private-flat "$site"
          cp private-p08/scripts/owner-github-update-once.php "$site/public/owner-github-update-once.php"
          cd "$site"
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs storage/app/private/adops/installation storage/app/private/adops/maintenance database
          touch database/r58.sqlite
          secret=$(php -r 'echo base64_encode(str_repeat("T",32));')
          {
            echo "APP_NAME=VF_AdOps"
            echo "APP_ENV=testing"
            echo "APP_KEY=base64:$secret"
            echo "APP_URL=https://adops.kewaro.com"
            echo "APP_DEBUG=false"
            echo "LOG_CHANNEL=single"
            echo "DB_CONNECTION=sqlite"
            echo "DB_DATABASE=$site/database/r58.sqlite"
            echo "CACHE_STORE=file"
            echo "SESSION_DRIVER=file"
            echo "QUEUE_CONNECTION=sync"
          } > .env
          chmod 0600 .env
          composer install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/p08-r58-composer.log" 2>&1 || { tail -n 20 "$RUNNER_TEMP/p08-r58-composer.log"; exit 1; }
          php artisan migrate --force --no-interaction > "$RUNNER_TEMP/p08-r58-migrate.log" 2>&1 || { tail -n 20 "$RUNNER_TEMP/p08-r58-migrate.log"; exit 1; }
          php -r '
            require "vendor/autoload.php";
            $app=require "bootstrap/app.php";
            $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            $id=\Illuminate\Support\Facades\DB::table("users")->insertGetId([
              "name"=>"Owner", "email"=>"owner-r58@example.invalid",
              "password"=>\Illuminate\Support\Facades\Hash::make("r58-temporary-owner-pass"),
              "created_at"=>date("Y-m-d H:i:s"),"updated_at"=>date("Y-m-d H:i:s"),
            ]);
            file_put_contents("storage/app/private/adops/installation/installed.json",
              json_encode(["project_id"=>"P08","status"=>"INSTALLED","owner_id"=>$id,"database_driver"=>"sqlite"],JSON_THROW_ON_ERROR));
          '
          echo P08_R58_ACTUAL_010_FLAT_LARAVEL_INSTALL=PASS
      - name: Old flat real HTTP and authenticated GitHub private read credential test
        env:
          P08_TEST_GITHUB_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          python3 private-p08/tests/test_owner_github_flat_http.py "$RUNNER_TEMP/p08-r58-flat-site"
          echo P08_R58_REAL_OLD_FLAT_GITHUB_UPDATE_UI=PASS
          echo P08_R58_ATOMIC_APPLY_AND_PRODUCTION=NOT_PROVEN
      - name: Setup Node22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vue TypeScript Vitest Vite regression
        run: |
          set -euo pipefail
          cd private-p08
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-r58-npm.log" 2>&1 || { tail -n 25 "$RUNNER_TEMP/p08-r58-npm.log"; exit 1; }
          npm run typecheck
          npm run test:unit
          npm run build
          test -f public/build/manifest.json
          echo P08_R58_VUE_GITHUB_TOKEN_UI_BUILD=PASS
      - name: Clean private source and Owner test credentials
        if: always()
        run: |
          rm -rf private-p08 private-flat "$RUNNER_TEMP/p08-r58-flat-site"
          rm -f "$RUNNER_TEMP/p08-r58-dev.log" "$RUNNER_TEMP/p08-r58-composer.log" "$RUNNER_TEMP/p08-r58-migrate.log" "$RUNNER_TEMP/p08-r58-npm.log"
          echo P08_R58_TEST_SECRET_WORKSPACE_CLEANUP=COMPLETE
