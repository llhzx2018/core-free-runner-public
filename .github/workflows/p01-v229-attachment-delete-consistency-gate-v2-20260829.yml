name: P01 V2.29 Attachment Delete Consistency Gate V2
on:
  push:
    branches:
      - task/p01-v229-attachment-delete-gate-20260829
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: a4cd92ba0f577bce5922e5f6a6fb3d39e688b06d
      ROOT: /tmp/p01-v229-attachment-delete
      PORT: '18457'
      ADMIN_PASS: P01AttachmentDeleteGate!2026
    steps:
      - name: Checkout runner scripts
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - name: Checkout exact P01 source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: source
      - name: Run attachment delete consistency gate
        shell: bash
        run: bash gates/p01-v229-attachment-delete/gate.sh
      - name: Bind exact tree evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD)" = "$SOURCE_SHA"
          TREE=$(git -C "$GITHUB_WORKSPACE/source" rev-parse 'HEAD^{tree}')
          test -n "$TREE"
          printf 'SOURCE_SHA=%s\nSOURCE_TREE=%s\nP01_ATTACHMENT_DELETE_CONSISTENCY_GATE=PASS\n' "$SOURCE_SHA" "$TREE" > /tmp/p01-attachment-delete/evidence.txt
          grep -Fx "SOURCE_SHA=$SOURCE_SHA" /tmp/p01-attachment-delete/evidence.txt
          grep -Fx "SOURCE_TREE=$TREE" /tmp/p01-attachment-delete/evidence.txt
          grep -Fx 'P01_ATTACHMENT_DELETE_CONSISTENCY_GATE=PASS' /tmp/p01-attachment-delete/evidence.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-v229-attachment-delete-consistency-evidence
          path: /tmp/p01-attachment-delete
          if-no-files-found: warn
          retention-days: 14
