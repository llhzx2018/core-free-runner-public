name: TEMP S01 Final Domain Registry Probe

on:
  push:
    branches:
      - temp/s01-c02-v121798-production-readback-20260903
    paths:
      - '.github/workflows/temp-s01-final-domain-registry-probe.yml'

permissions:
  contents: read

jobs:
  registry-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Inspect delegation registry and DNS state
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y dnsutils whois jq >/dev/null
          echo '=== DNS status ==='
          for t in NS SOA A AAAA CNAME TXT; do
            echo "--- $t ---"
            dig +short ilovem3u8.com "$t" || true
          done
          echo '=== www DNS ==='
          for t in A AAAA CNAME; do
            echo "--- $t ---"
            dig +short www.ilovem3u8.com "$t" || true
          done
          echo '=== RDAP ==='
          CODE="$(curl -sS --max-time 20 -o /tmp/rdap.json -w '%{http_code}' 'https://rdap.verisign.com/com/v1/domain/ilovem3u8.com' || true)"
          echo "RDAP_HTTP=$CODE"
          if [ "$CODE" = 200 ]; then
            jq '{ldhName,status,nameservers:[.nameservers[]?.ldhName],events:[.events[]?|{eventAction,eventDate}]}' /tmp/rdap.json
          else
            head -c 1000 /tmp/rdap.json || true; echo
          fi
          echo '=== WHOIS summary ==='
          whois ilovem3u8.com 2>/dev/null | grep -Ei '^(Domain Name|Registrar:|Registry Expiry Date|Creation Date|Updated Date|Name Server|Domain Status):' | head -50 || true
          echo FINAL_DOMAIN_REGISTRY_PROBE=COMPLETE
