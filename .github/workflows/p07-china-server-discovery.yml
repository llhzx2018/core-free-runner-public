name: P07 China Server Discovery

on:
  push:
    branches: [feature/p07-vps-audit-rc4-china-regions]
    paths:
      - '.github/workflows/p07-china-server-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download verified speedtest-go
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/showwin/speedtest-go/releases/download/v1.8.3/speedtest-go_1.8.3_Linux_x86_64.tar.gz'
          expected='c55caae22927cd719a2f8c0bef96ecf74b5fe8ca919ff9200d76328ae5de9477'
          curl -fsSL "$url" -o /tmp/stg.tgz
          test "$(sha256sum /tmp/stg.tgz | awk '{print $1}')" = "$expected"
          mkdir -p /tmp/stg && tar -xzf /tmp/stg.tgz -C /tmp/stg
          chmod +x /tmp/stg/speedtest-go
      - name: Discover mainland servers
        shell: bash
        run: |
          set -euo pipefail
          : >/tmp/cn-servers.txt
          for q in Beijing Shanghai Guangzhou Chengdu; do
            echo "=== $q ===" | tee -a /tmp/cn-servers.txt
            set +e
            timeout 35s /tmp/stg/speedtest-go --list --filter-cc=CN --search="$q" 2>&1 | tee -a /tmp/cn-servers.txt
            echo "RC=${PIPESTATUS[0]}" | tee -a /tmp/cn-servers.txt
            set -e
          done
      - name: Upload discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: p07-china-server-discovery-${{ github.run_id }}
          path: /tmp/cn-servers.txt
          if-no-files-found: error
          retention-days: 14
