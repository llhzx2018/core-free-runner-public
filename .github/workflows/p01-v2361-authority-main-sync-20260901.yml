name: P01 V2.36.1 Release Authority Main Sync
on:
  push:
    branches: [release/p01-v2361-candidate-20260901]
    paths: [.github/workflows/p01-v2361-authority-main-sync-20260901.yml]
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FORMAL: 23321270d79fc98d529c2c5a0ef07e0f1012835a
      TARGET: e29e5f56ad74cb98841d01764d73b680bd8913ba
      RUNTIME_TREE: 91f92c5d3e7080469a7f5ab1497145454014c87a
      CORE_UPDATES: 416cc8089b39349eb7ee62638b5267335d406320
      AUTHORITY_PREP_RUN: '33474741180'
    steps:
      - name: Checkout exact closure target
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.TARGET }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01
      - name: Five-file Authority fence and fast-forward main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$AUTHORITY_PREP_RUN --jq .conclusion)" = success
          cd p01
          test "$(git rev-parse HEAD)" = "$TARGET"
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          MAIN=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          DEVELOP=$(git ls-remote origin refs/heads/develop | awk '{print $1}')
          test "$MAIN" = "$FORMAL"
          test "$DEVELOP" = "$TARGET"
          git merge-base --is-ancestor "$FORMAL" "$TARGET"
          ACTUAL=$(git diff --name-only "$FORMAL" "$TARGET" | sort)
          EXPECTED=$(printf '%s\n' README.md VF_PROJECT.json docs/authority/CURRENT.md docs/evidence/P01_V2.36.1_RELEASE_CLOSURE_20260901.md docs/handoff/CURRENT_STATE.md | sort)
          test "$ACTUAL" = "$EXPECTED"
          test -z "$(git diff --name-only "$FORMAL" "$TARGET" -- src)"
          test "$(git rev-parse "$FORMAL:src")" = "$RUNTIME_TREE"
          test "$(git rev-parse "$TARGET:src")" = "$RUNTIME_TREE"
          test "$(jq -r .production_version VF_PROJECT.json)" = 2.36.0
          test "$(jq -r .published_release.version VF_PROJECT.json)" = 2.36.1
          test "$(jq -r .published_release.release_source VF_PROJECT.json)" = "$FORMAL"
          test "$(git ls-remote --tags origin refs/tags/v2.36.1 | awk '{print $1}')" = "$FORMAL"
          test "$(gh api repos/llhzx2018/core-updates/branches/main --jq .commit.sha)" = "$CORE_UPDATES"
          git push origin "$TARGET:refs/heads/main"
          REMOTE_MAIN=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          REMOTE_DEVELOP=$(git ls-remote origin refs/heads/develop | awk '{print $1}')
          test "$REMOTE_MAIN" = "$TARGET"
          test "$REMOTE_DEVELOP" = "$TARGET"
          test "$(git ls-remote --tags origin refs/tags/v2.36.1 | awk '{print $1}')" = "$FORMAL"
          printf 'P01_V2361_RELEASE_AUTHORITY_MAIN_SYNC=PASS\nMAIN=%s\nDEVELOP=%s\nTAG_V2361=%s\nRUNTIME_TREE=%s\nOWNER_PRODUCTION_VERSION=2.36.0\nPUBLISHED_LATEST=2.36.1\nOWNER_PRODUCTION_WRITE=NO\n' "$REMOTE_MAIN" "$REMOTE_DEVELOP" "$FORMAL" "$RUNTIME_TREE" | tee /tmp/p01-v2361-authority-main-sync.txt
      - name: Upload sync evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2361-authority-main-sync-${{ github.run_id }}
          path: /tmp/p01-v2361-authority-main-sync.txt
          if-no-files-found: error
          retention-days: 90
