name: P04 V2.5.3 Hotfix Final E2E

# rerun-after-opcache-invalidation-fix: 2026-08-16
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p04-v253-hotfix-final-e2e.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Prepare real runtime
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-zip sqlite3 >/dev/null
          php -r 'foreach(["pdo_sqlite","sqlite3","curl","openssl","json","sodium"] as $x)if(!extension_loaded($x))exit(2);if(!class_exists("ZipArchive"))exit(3);echo "REAL_RUNTIME=PASS\n";'
      - name: Run V2.5.3 deterministic E2E
        env:
          VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$VF_RELEASE_WRITE_TOKEN"
          git clone -q https://github.com/llhzx2018/core-free-runner-public.git runner-tools
          bash runner-tools/ops/p04/v253_hotfix_execute_v2.sh
      - name: Cleanup
        if: always()
        run: rm -rf runner-tools
