name: TEMP VFTEST P01 synthetic real Chromium 15 workspaces responsive
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/temp-vftest-p01-s3s7-browser-smoke-20261124.yml]
permissions:
  contents: read
concurrency:
  group: vftest-p01-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  synthetic-frontend-chromium:
    name: VFTEST-P01-15-WORKSPACES-CHROMIUM
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'test/vftest-p01-s3s7-browser-smoke-')
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Checkout exact private P01 source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-startnew
          ref: d63df04a0f1f3e5ae0a7e8447ba7970fadd496de
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-src
      - name: Confirm exact candidate source without modifying Product
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C private-src rev-parse HEAD)" = "d63df04a0f1f3e5ae0a7e8447ba7970fadd496de"
          test "$(cat private-src/VERSION)" = "0.1.0-dev"
          test -z "$(git -C private-src status --porcelain)"
          echo P01_S3_S7_BROWSER_EXACT_SHA=d63df04a0f1f3e5ae0a7e8447ba7970fadd496de
      - name: Node 22 for real Vite and browser
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Real locked Vite frontend and safe ephemeral Playwright
        shell: bash
        working-directory: private-src
        run: |
          set -Eeuo pipefail
          set +x
          if ! npm ci --no-audit --no-fund --no-progress --quiet >"$RUNNER_TEMP/p01-browser-npm.log" 2>&1; then
            echo P01_BROWSER_LOCKED_DEPENDENCIES=FAIL; exit 1
          fi
          echo P01_BROWSER_LOCKED_DEPENDENCIES=PASS
          if ! npm run typecheck >"$RUNNER_TEMP/p01-browser-typecheck.log" 2>&1; then
            echo P01_BROWSER_TYPESCRIPT=FAIL; exit 1
          fi
          echo P01_BROWSER_TYPESCRIPT=PASS
          if ! npm run build >"$RUNNER_TEMP/p01-browser-vite.log" 2>&1; then
            echo P01_BROWSER_VITE=FAIL; exit 1
          fi
          echo P01_BROWSER_VITE=PASS
          if ! npm install --no-save --package-lock=false --no-audit --no-fund --no-progress --quiet playwright@1.55.0 >"$RUNNER_TEMP/p01-browser-playwright.log" 2>&1; then
            echo P01_BROWSER_PLAYWRIGHT_DEPENDENCY=FAIL; exit 1
          fi
          echo P01_BROWSER_PLAYWRIGHT_DEPENDENCY=PASS
          if ! command -v google-chrome-stable >/dev/null 2>&1 && ! command -v google-chrome >/dev/null 2>&1; then
            echo P01_BROWSER_CHROME_HOST_BINARY=NOT_PREINSTALLED
            if ! npx playwright install chromium >"$RUNNER_TEMP/p01-browser-chromium.log" 2>&1; then
              echo P01_BROWSER_CHROMIUM_INSTALL=FAIL; exit 1
            fi
          fi
          echo P01_BROWSER_CHROMIUM_READY=PASS
          set +e
          node tests/browser/p01_synthetic_inertia_browser.mjs >"$RUNNER_TEMP/p01-browser-exec.log" 2>&1
          exit_status=$?
          set -e
          if [ "$exit_status" -ne 0 ]; then
            grep -E '^P01_BROWSER_(CHROME_LAUNCH|DIAG_CODE|DIAG_STAGE|DIAG_ROUTE|DIAG_WIDTH)=' "$RUNNER_TEMP/p01-browser-exec.log" || true
            echo P01_BROWSER_COMPILED_CHROMIUM=FAIL
            # Do not expose proprietary page source/stack traces in Public CI.
            echo P01_BROWSER_SANITIZED_ERROR_CLASS=NODE_BROWSER_ASSERTION
            exit "$exit_status"
          fi
          grep -E '^P01_BROWSER_(SYNTHETIC_COMPILED_SOURCE|ROUTE_WIDTHS|LOCAL_INTERACTIONS|NO_INSTALL_OWNER_SQL_NETWORK|LEGACY_VISUAL_PARITY)=' "$RUNNER_TEMP/p01-browser-exec.log" || true
          echo P01_BROWSER_COMPILED_CHROMIUM=PASS
      - name: Always scrub transient private source and screenshots/logs
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- private-src
          rm -f -- "$RUNNER_TEMP"/p01-browser-*
          test ! -e private-src
          echo P01_BROWSER_PRIVATE_CLEANUP=PASS
