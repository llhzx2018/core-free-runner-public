name: P01 V2.25 Authority Sync V2
on:
  push:
    branches: [task/p01-v222-multi-surface-gate-20260828]
    paths: ['.github/workflows/p01-v225-authority-sync-v2-20260828.yml']
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      EXACT_SOURCE: d3904c4e7a9c44aaed5da9c4653c99c5a5a83bb8
      BRANCH: feature/p01-v2.25.0-vf-teal-rebaseline-20260828
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01
      - name: Verify exact source and generate docs
        run: |
          set -Eeuo pipefail
          test "$(git -C p01 rev-parse HEAD)" = "$EXACT_SOURCE"
          python3 runner/scripts/p01_v225_authority_sync.py
          git -C p01 diff --check
          python3 -m json.tool p01/VF_PROJECT.json >/dev/null
          python3 -m json.tool p01/docs/evidence/P01_V2.25.0_VF_TEAL_UI_AUDIT_20260828.json >/dev/null
          grep -F 'Owner Production Runtime: V2.24.0' p01/docs/authority/CURRENT.md >/dev/null
          grep -F 'V2.25.0 VF Teal Whole-site UX/UI Candidate' p01/docs/authority/ACCEPTANCE_MATRIX.md >/dev/null
      - name: Commit docs-only authority to feature branch
        run: |
          set -Eeuo pipefail
          git -C p01 config user.name VictorForge
          git -C p01 config user.email llhzx2018@gmail.com
          git -C p01 add README.md AGENTS.md CHANGELOG.md VF_PROJECT.json docs
          git -C p01 diff --cached --check
          git -C p01 commit -m 'docs(P01): sync V2.25 VF teal UX UI authority'
          git -C p01 push origin HEAD:"$BRANCH"
          echo "DOCS_HEAD=$(git -C p01 rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verdict
        run: |
          echo P01_V225_AUTHORITY_SYNC=PASS
          echo DOCS_HEAD="$DOCS_HEAD"
          echo RELEASE=NO
          echo PRODUCTION=NO
