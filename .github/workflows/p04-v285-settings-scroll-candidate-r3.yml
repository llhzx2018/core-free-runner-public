name: P04 V2.8.5 Settings and Route UX Candidate R3

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p04-v285-settings-scroll-candidate-r3.yml'
      - 'requests/p04-v285-settings-scroll-r3.txt'

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    env:
      P04_REPOSITORY: llhzx2018/vf-infra
      EXPECTED_BASE: 53ab528e0f8ec26d4f6f1f071e8ce268c364607d
      PUSH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Checkout P04 develop
        uses: actions/checkout@v4
        with:
          repository: ${{ env.P04_REPOSITORY }}
          ref: develop
          token: ${{ env.PUSH_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: source

      - name: Patch requested UX only
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PUSH_TOKEN"
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          python3 - <<'PY'
          from pathlib import Path

          p=Path('public/assets/v271-unified-shell.js')
          s=p.read_text(encoding='utf-8')
          reps=[
            ("    section = allowed.has(section) ? section : 'basic';", "    section = allowed.has(section) ? section : 'basic';\n    if (section === 'backup') section = 'data';\n    if (section === 'diagnostics') section = 'system';", 'alias'),
            ("    else if (section === 'data') body = renderData(payload);", "    else if (section === 'data') body = renderData(payload) + renderBackup(payload);", 'data'),
            ("    else if (section === 'system') body = renderSystem(payload);", "    else if (section === 'system') body = renderSystem(payload) + renderDiagnostics(payload);", 'system'),
            ("    const sub = ['data','backup','security'].includes(section) ? settingsSubtabs([['data','导入导出'],['backup','备份恢复'],['security','账号与安全']], section) : ['update','system','diagnostics'].includes(section) ? settingsSubtabs([['update','系统更新'],['system','系统信息'],['diagnostics','诊断']], section) : '';", "    const sub = '';", 'subtabs'),
          ]
          for old,new,label in reps:
              if s.count(old)!=1: raise SystemExit(f'V285_{label}_SENTINEL_{s.count(old)}')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('public/assets/v280-navigation-simplify.js')
          s=p.read_text(encoding='utf-8')
          old="    reconcileNestedNav(routeRoot.querySelector('.v271-settings-content'), section);"
          if s.count(old)!=1: raise SystemExit('V285_V280_SUBNAV_SENTINEL')
          p.write_text(s.replace(old,"    routeRoot.querySelector('.v280-settings-subnav')?.remove();",1),encoding='utf-8')

          Path('public/assets/v278-route-scroll-reset.js').write_text("""(() => {
            'use strict';
            if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
            const app = document.getElementById('v270-app');
            let pendingRouteReset = true;
            let pendingRaw = (location.hash || '#overview').slice(1);
            let settleTimer = null;

            function resetScrollPosition() {
              document.documentElement.scrollTop = 0;
              document.body.scrollTop = 0;
              window.scrollTo(0, 0);
              const workspace = document.querySelector('.v270-workspace');
              if (workspace) workspace.scrollTop = 0;
              if (app) app.scrollTop = 0;
            }
            function settleReset() {
              resetScrollPosition();
              requestAnimationFrame(() => { resetScrollPosition(); requestAnimationFrame(resetScrollPosition); });
              clearTimeout(settleTimer);
              settleTimer = window.setTimeout(resetScrollPosition, 120);
            }
            function expectRouteReset() {
              pendingRouteReset = true;
              pendingRaw = (location.hash || '#overview').slice(1);
              settleReset();
            }
            function routeRendered() {
              if (!pendingRouteReset || !app) return false;
              const route = app.querySelector('[data-v271-route]');
              if (!route || String(route.dataset.v271Route || '') !== pendingRaw) return false;
              pendingRouteReset = false;
              settleReset();
              return true;
            }
            window.addEventListener('hashchange', expectRouteReset, true);
            window.addEventListener('popstate', expectRouteReset, true);
            document.addEventListener('click', (event) => {
              if (!event.target.closest('[data-v270-nav]')) return;
              pendingRouteReset = true;
              queueMicrotask(() => {
                pendingRaw = (location.hash || '#overview').slice(1);
                settleReset();
                routeRendered();
              });
            }, true);
            if (app) new MutationObserver(() => routeRendered()).observe(app, { childList: true, subtree: true });
            settleReset();
            routeRendered();
          })();
          """,encoding='utf-8')

          Path('VERSION').write_text('2.8.5\n',encoding='utf-8')

          p=Path('scripts/build-release-tree.py')
          s=p.read_text(encoding='utf-8')
          old="'2.8.0','2.8.1','2.8.2','2.8.3'}"
          new="'2.8.0','2.8.1','2.8.2','2.8.3','2.8.4','2.8.5'}"
          if s.count(old)!=1: raise SystemExit('V285_RELEASE_KIND_SENTINEL')
          s=s.replace(old,new,1)
          old="if version=='2.8.3':\n    version_note='V2.8.3 fixes the Atomic post-repair integrity gate so target-file verification is independent from the stale in-process bootstrap version constant, while retaining full Source Exact Reconciliation, rollback, Schema 14 and read-only-first Provider authority.'"
          new="if version=='2.8.5':\n    version_note='V2.8.5 retains the primary Settings sidebar, removes only nested content tabs, combines Data Management and System Information subcontent into one continuous page per primary section, and resets async top-level routes after render so Provider opens at the page top without disrupting same-page refresh position.'\nelif version=='2.8.3':\n    version_note='V2.8.3 fixes the Atomic post-repair integrity gate so target-file verification is independent from the stale in-process bootstrap version constant, while retaining full Source Exact Reconciliation, rollback, Schema 14 and read-only-first Provider authority.'"
          if s.count(old)!=1: raise SystemExit('V285_NOTE_SENTINEL')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('docs/operations/package/RELEASE_NOTES.md')
          s=p.read_text(encoding='utf-8')
          prefix="# VF Infra V2.8.5\n\n- 设置保留左侧主分栏，只取消右侧二级 TAB。\n- 数据管理：导入导出与备份恢复在同一页连续显示。\n- 系统信息：系统信息与诊断在同一页连续显示。\n- 服务商等一级异步路由进入后，在内容真正渲染完成时复位到页面顶部；同页刷新/同步不强制改变当前位置。\n- Schema 14，无 Migration，保留 V2.8.4 长耗时操作反馈与防重复点击。\n\n"
          if not s.startswith('# VF Infra V2.8.5'): p.write_text(prefix+s,encoding='utf-8')

          p=Path('CHANGELOG.md')
          s=p.read_text(encoding='utf-8')
          prefix="## V2.8.5\n\n- 保留 Settings 左侧分栏，取消右侧嵌套 TAB；数据管理、系统信息分别改成单页连续内容。\n- 修复服务商等异步一级路由进入时继承旧滚动位置的问题。\n- Schema 14，无 Migration，无 Provider 写权限变化。\n\n"
          if not s.startswith('## V2.8.5'): p.write_text(prefix+s,encoding='utf-8')
          PY

      - name: Validate UX and runtime tree
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check public/assets/v271-unified-shell.js
          node --check public/assets/v278-route-scroll-reset.js
          node --check public/assets/v280-navigation-simplify.js
          node --check public/assets/v284-long-action-feedback.js
          php -l public/index.php >/dev/null
          python3 -m py_compile scripts/build-release-tree.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('public/assets/v271-unified-shell.js').read_text(encoding='utf-8')
          assert 'v271-settings-layout' in s and 'settingsNav(section)' in s
          assert "body = renderData(payload) + renderBackup(payload);" in s
          assert "body = renderSystem(payload) + renderDiagnostics(payload);" in s
          assert "if (section === 'backup') section = 'data';" in s
          assert "if (section === 'diagnostics') section = 'system';" in s
          assert "const sub = '';" in s
          n=Path('public/assets/v280-navigation-simplify.js').read_text(encoding='utf-8')
          assert "reconcileNestedNav(routeRoot.querySelector('.v271-settings-content'), section);" not in n
          sc=Path('public/assets/v278-route-scroll-reset.js').read_text(encoding='utf-8')
          assert 'MutationObserver' in sc and 'routeRendered()' in sc and 'pendingRouteReset' in sc
          assert 'fetch' not in sc
          print('P04_V285_SETTINGS_SCROLL_UX_PASS')
          PY
          rm -rf "$RUNNER_TEMP/v285-runtime"
          python3 scripts/build-release-tree.py "$RUNNER_TEMP/v285-runtime" > "$RUNNER_TEMP/release-tree.json"
          test "$(cat "$RUNNER_TEMP/v285-runtime/VERSION.txt")" = '2.8.5'
          jq -e '.version=="2.8.5" and .target_schema==14 and .release_kind=="maintenance_release"' "$RUNNER_TEMP/v285-runtime/release-manifest.json" >/dev/null
          mkdir -p "$GITHUB_WORKSPACE/evidence"
          cp "$RUNNER_TEMP/release-tree.json" "$GITHUB_WORKSPACE/evidence/"
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          runtime=Path(os.environ['RUNNER_TEMP'])/'v285-runtime'
          m=json.loads((runtime/'release-manifest.json').read_text(encoding='utf-8'))
          r={'status':'PASS','version':'2.8.5','schema':14,'left_settings_sidebar':'RETAINED','nested_settings_tabs':'REMOVED','data_management':'ONE_CONTINUOUS_PAGE','system_information':'ONE_CONTINUOUS_PAGE','owned_route_post_render_scroll_reset':'PASS','same_page_refresh_scroll':'PRESERVE_BY_CONTRACT','runtime_file_count':m['file_count']+1,'production_write':0}
          Path(os.environ['GITHUB_WORKSPACE'],'evidence','P04_V285_UX_CANDIDATE.json').write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Commit exact tested UX candidate
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VERSION CHANGELOG.md docs/operations/package/RELEASE_NOTES.md scripts/build-release-tree.py public/assets/v271-unified-shell.js public/assets/v278-route-scroll-reset.js public/assets/v280-navigation-simplify.js
          git commit -m 'fix(P04): simplify settings pages and route scroll behavior'
          git push origin HEAD:develop
          echo "P04_V285_UX_SOURCE=$(git rev-parse HEAD)" | tee "$GITHUB_WORKSPACE/evidence/identity.txt"
          echo 'PRODUCTION_WRITE=0' | tee -a "$GITHUB_WORKSPACE/evidence/identity.txt"

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: P04-V2.8.5-UX-CANDIDATE-EVIDENCE
          path: evidence/
          if-no-files-found: error
          retention-days: 30
