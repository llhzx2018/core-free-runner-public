name: P05 V1.2.3 Version Lock Writer R2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p05-v123-version-lock-writer-r2.yml'

permissions:
  contents: read

jobs:
  write-version-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      P05_BASE: f19f2b9c0819acf2fa19adb5d2b403a68b5d9352
      P05_BRANCH: release/p05-v1.2.3-readiness-20260902
    steps:
      - name: Checkout exact private P05 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: release/p05-v1.2.3-readiness-20260902
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact base
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_BASE"
          test "$(cat VERSION)" = '1.2.2'
          node -e "const p=require('./package.json'); if(p.version!=='1.2.2') process.exit(1)"
          git hash-object docs/authority/RELEASE_V1.2.2_CANDIDATE.md > /tmp/v122-candidate.hash
          git hash-object docs/authority/RELEASE_V1.2.2_PRODUCTION_CLOSURE.md > /tmp/v122-closure.hash

      - name: Write v1.2.3 authority
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          Path('VERSION').write_text('1.2.3\n')

          p=Path('package.json')
          d=json.loads(p.read_text())
          assert d['version']=='1.2.2'
          d['version']='1.2.3'
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n')

          p=Path('src/client/ProductApp.tsx')
          s=p.read_text()
          old='P05 · Product Optimization · v1.2.2'
          assert s.count(old)==1
          p.write_text(s.replace(old,'P05 · Product Optimization · v1.2.3',1))

          p=Path('VF_PROJECT.json')
          d=json.loads(p.read_text())
          assert d['version']=='1.2.2'
          assert d['production_version']=='1.2.2'
          assert d['formal_release']=='v1.2.2'
          d['status']='V1.2.3_RELEASE_CANDIDATE / FINAL_MACHINE_GATE_PENDING / RELEASE_AND_PRODUCTION_CLOSURE_AUTHORIZED / PRODUCTION_V1.2.2_OWNER_OBSERVED'
          d['version']='1.2.3'
          d['production_version']='1.2.2'
          d['target_version']='1.2.3'
          d['working_version']='1.2.3'
          d['version_change']=True
          d['working_branch']='release/p05-v1.2.3-readiness-20260902'
          d['candidate_authorization']='RELEASE_READINESS / OWNER_AUTHORIZED_V1.2.3'
          d['release_authorization']='OWNER_AUTHORIZED_V1.2.3 / EXECUTION_PENDING'
          d['production_deployment_authorization']='OWNER_AUTHORIZED_V1.2.3_FULL_CLOSURE / EXECUTION_PENDING'
          d['next_action']='V1.2.3 FINAL EXACT SOURCE GATE → MAIN PROMOTION → FORMAL FULL/TAG/RELEASE → V1.2.2→V1.2.3 ATOMIC → CORE-UPDATES → PRODUCTION CLOSURE'
          d['deployment_readiness']='V1.2.3_CANDIDATE_FINAL_GATE_PENDING / PRODUCTION_BASELINE_V1.2.2_OWNER_OBSERVED'
          d['authority']['release_candidate']='docs/authority/RELEASE_V1.2.3_CANDIDATE.md'
          q=d['post_v1_2_2_update_service']
          q['release_authorization']='OWNER_AUTHORIZED_V1.2.3 / EXECUTION_PENDING'
          q['production_adoption']='V1.2.3_RELEASE_AND_PRODUCTION_CLOSURE_AUTHORIZED / EXECUTION_PENDING'
          q['machine_production_readback']='NOT_CLAIMED'
          d['release_closure_authorization_20260902']={
            'version':'v1.2.3',
            'state':'OWNER_AUTHORIZED',
            'scope':'VERSION_LOCK_TO_PRODUCTION_CLOSURE',
            'frozen_pre_release_main':'f19f2b9c0819acf2fa19adb5d2b403a68b5d9352',
            'runtime_code_baseline':'5f1deb37a7f8b3828bd9617b6a0a14f045a3e096',
            'runtime_code_tree':'a467ab0a90656312bd297dfd5ecb51da396990b6'
          }
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n')

          Path('docs/authority/RELEASE_V1.2.3_CANDIDATE.md').write_text('''# P05 · VF SEO v1.2.3 Release Candidate

Status: `RELEASE_AND_PRODUCTION_CLOSURE_AUTHORIZED / FINAL_EXACT_SOURCE_GATE_PENDING`

## Release basis

- Frozen pre-release main: `f19f2b9c0819acf2fa19adb5d2b403a68b5d9352`
- Runtime code baseline after PR #139: `5f1deb37a7f8b3828bd9617b6a0a14f045a3e096`
- Runtime baseline tree: `a467ab0a90656312bd297dfd5ecb51da396990b6`
- Current formal Release / Production: `v1.2.2`
- Target: `v1.2.3`
- Schema: `VF-SEO-SCHEMA@1 / 1` unchanged
- Database: SQLite unchanged

## Patch

PR #138 keeps the missing-update-credential state truthful and forbids browser Secret collection. Exact Source R4 `33540256003 / 99964446091` PASS.

PR #139 adds CLI-only `php/bin/init-update-service.php`: server environment `VF_PRIVATE_READ_TOKEN` → verified private `core-updates`/P05 Release authority → Runtime Pointer-bound private `runtime.env`, without Secret response to browser. Native CI `33541470290 / 99968501815` PASS; Exact Source R2 `33541894604 / 99969918142` PASS.

PR #140/#141 are Current Truth documentation only.

## Version authority

`VERSION=1.2.3`; `package.json` mirrors it; `package-lock.json` stays unchanged; Product visible label becomes `v1.2.3`.

## Owner authorization

On 2026-09-02 the Owner explicitly authorized: `Version Lock → Final Exact Source Gate → Formal FULL / Tag / Release → v1.2.2→v1.2.3 Atomic → core-updates → Production Closure`.

Production PASS still requires real runtime evidence. If no proven machine→VPS execution channel exists, closure may stop only at the irreducible Owner VPS action.
''')
          PY

          test "$(cat VERSION)" = '1.2.3'
          node -e "const p=require('./package.json'); if(p.version!=='1.2.3') process.exit(1)"
          test "$(git hash-object docs/authority/RELEASE_V1.2.2_CANDIDATE.md)" = "$(cat /tmp/v122-candidate.hash)"
          test "$(git hash-object docs/authority/RELEASE_V1.2.2_PRODUCTION_CLOSURE.md)" = "$(cat /tmp/v122-closure.hash)"
          python3 - <<'PY'
          import json
          p=json.load(open('VF_PROJECT.json'))
          assert p['version']=='1.2.3'
          assert p['production_version']=='1.2.2'
          assert p['formal_release']=='v1.2.2'
          assert p['release_authorization']=='OWNER_AUTHORIZED_V1.2.3 / EXECUTION_PENDING'
          assert p['production_deployment_authorization']=='OWNER_AUTHORIZED_V1.2.3_FULL_CLOSURE / EXECUTION_PENDING'
          assert p['post_v1_2_2_update_service']['browser_secret_collection']=='FORBIDDEN_LOCKED'
          assert p['post_v1_2_2_update_service']['update_read_token']=='GLOBAL_VF_PRIVATE_READ_TOKEN_SERVER_SIDE_ONLY'
          assert p['post_v1_2_2_update_service']['third_project_token']=='FORBIDDEN_BY_CURRENT_GOVERNANCE'
          PY
          test "$(git diff --name-only | sort | tr '\n' ' ')" = 'VERSION VF_PROJECT.json docs/authority/RELEASE_V1.2.3_CANDIDATE.md package.json src/client/ProductApp.tsx '
          git diff --check

      - name: Commit and push exact candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add VERSION package.json VF_PROJECT.json src/client/ProductApp.tsx docs/authority/RELEASE_V1.2.3_CANDIDATE.md
          git commit -m 'release(P05): lock v1.2.3 release authority'
          git push origin "HEAD:${P05_BRANCH}"
          echo "P05_V123_CANDIDATE_SHA=$(git rev-parse HEAD)"
          echo "P05_V123_CANDIDATE_TREE=$(git rev-parse HEAD^{tree})"
          echo P05_V123_VERSION_LOCK_WRITER_R2=PASS
          echo P05_RELEASE_WRITE=0
          echo P05_PRODUCTION_WRITE=0
