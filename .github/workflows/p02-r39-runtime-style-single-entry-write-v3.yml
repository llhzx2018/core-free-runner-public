name: P02 R39 Runtime Style Single Entry Write V3
on:
  push:
    branches: [run/p02-r39-runtime-style-single-entry-write]
permissions:
  contents: read
jobs:
  converge:
    runs-on: ubuntu-24.04
    env:
      BASE_REF: b051cad84535f9f059ca36eb4a75e04292a22aac
      EXPECTED_VERSION: '2.5.32'
      PORT: '18080'
    steps:
      - name: Checkout exact current develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.BASE_REF }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: product

      - name: Apply R39 runtime style convergence
        working-directory: product
        run: |
          set -Eeuo pipefail
          test -f public/assets/scratch-tabs.css
          printf '\n/* V2.5.32 R39 consolidated source: scratch-tabs.css */\n' >> public/assets/app.css
          cat public/assets/scratch-tabs.css >> public/assets/app.css
          cat >> public/assets/app.css <<'CSS'

          /* V2.5.32 R39 consolidated source: V2.5.18 scratch overflow runtime style */
          .scratch-tab-scroll-v2518{width:30px;height:34px;flex:0 0 30px;border:1px solid transparent;border-radius:7px;background:transparent;color:var(--muted);display:grid;place-items:center;padding:0;font-size:22px;line-height:1;cursor:pointer;transition:background .14s,border-color .14s,color .14s,opacity .14s}
          .scratch-tab-scroll-v2518:hover:not(:disabled){background:var(--surface);border-color:var(--border);color:var(--strong)}
          .scratch-tab-scroll-v2518:focus-visible{outline:2px solid color-mix(in srgb,var(--primary) 55%,transparent);outline-offset:1px}
          .scratch-tab-scroll-v2518:disabled{opacity:.26;cursor:default}
          .scratch-tab-scroll-v2518[hidden]{display:none!important}
          .scratch-bar-v259.has-tab-overflow-v2518 .scratch-tabs-scroll-v259{scroll-behavior:smooth}
          @media(max-width:900px){.scratch-tab-scroll-v2518{order:1;width:28px;flex-basis:28px}.scratch-tabs-scroll-v259{min-width:0}}
          CSS
          rm public/assets/scratch-tabs.css
          rm -rf browser-evidence
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          css_path=Path('public/assets/app.css')
          css_path.write_text('\n'.join(line.rstrip() for line in css_path.read_text(encoding='utf-8').splitlines())+'\n',encoding='utf-8')

          p=Path('public/assets/v254-common-branding.js')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r"    if\(!document\.querySelector\('link\[data-scratch-v259\]'\)\)\{\n      const link=document\.createElement\('link'\);link\.rel='stylesheet';link\.href='/assets/scratch-tabs\.css\?v='\+encodeURIComponent\(version\);link\.dataset\.scratchV259='1';document\.head\.appendChild\(link\);\n    \}\n",'',s,count=1)
          if n!=1: raise SystemExit(f'loader css removal count={n}')
          pattern=r"  const STYLE_ID='scratchTabOverflowUxV2518';.*?\n\n  function navButton"
          replacement="  const BOUND_KEY='tabOverflowUxV2518';\n  const EDGE_PAD=10;\n  const EDGE_DRAG_ZONE=44;\n\n  function navButton"
          s,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'inline style removal count={n}')
          if s.count('    ensureStyle();\n\n')!=1: raise SystemExit('attach ensureStyle drift')
          s=s.replace('    ensureStyle();\n\n','',1)
          old="  function boot(){ensureStyle();scan();pageObserver.observe(document.body,{childList:true,subtree:true});}"
          new="  function boot(){scan();pageObserver.observe(document.body,{childList:true,subtree:true});}"
          if s.count(old)!=1: raise SystemExit('boot ensureStyle drift')
          s=s.replace(old,new,1)
          if '/assets/scratch-tabs.css' in s or 'scratchTabOverflowUxV2518' in s or 'ensureStyle()' in s: raise SystemExit('dynamic Scratch style ownership remains')
          p.write_text(s,encoding='utf-8')

          p=Path('tests/unit/v2523_unified_content_workspace_contract.mjs')
          s=p.read_text(encoding='utf-8')
          old="const scratchCss=read('public/assets/scratch-tabs.css');"
          if s.count(old)!=1: raise SystemExit('v2523 scratch CSS contract drift')
          p.write_text(s.replace(old,"const scratchCss=read('public/assets/app.css');",1),encoding='utf-8')

          p=Path('tests/unit/p02_css_convergence_contract.mjs')
          s=p.read_text(encoding='utf-8')
          if s.count('assert.equal(candidate.runtime_source_file_count,72);')!=1: raise SystemExit('css count contract drift')
          s=s.replace('assert.equal(candidate.runtime_source_file_count,72);','assert.equal(candidate.runtime_source_file_count,71);',1)
          anchor="assert.ok(index.includes('/assets/app.css'));"
          add=anchor+"\nassert.ok(!fs.existsSync('public/assets/scratch-tabs.css'),'scratch-tabs.css should be consolidated');\nassert.ok(css.includes('V2.5.32 R39 consolidated source: scratch-tabs.css'),'Scratch CSS boundary missing');\nassert.ok(css.includes('V2.5.32 R39 consolidated source: V2.5.18 scratch overflow runtime style'),'Scratch overflow CSS boundary missing');"
          if s.count(anchor)!=1: raise SystemExit('css convergence anchor drift')
          p.write_text(s.replace(anchor,add,1),encoding='utf-8')

          p=Path('tests/unit/p02_candidate_version_identity_contract.mjs')
          s=p.read_text(encoding='utf-8')
          if s.count('runtime_source_file_count!==72')!=2: raise SystemExit('candidate count contract drift')
          p.write_text(s.replace('runtime_source_file_count!==72','runtime_source_file_count!==71'),encoding='utf-8')

          ip=Path('docs/authority/P02_DEVELOP_CANDIDATE_IDENTITY.json')
          c=json.loads(ip.read_text(encoding='utf-8'))
          c['runtime_source_file_count']=71
          c['convergence']['scratch_css_merged_into_app_css']=True
          c['convergence']['scratch_overflow_inline_style_retired']=True
          c['convergence']['runtime_stylesheet_single_entry']=True
          if 'scratch-tabs.css' not in c['consolidated_css_assets']: c['consolidated_css_assets'].append('scratch-tabs.css')
          c['next_gate']='POST_RUNTIME_STYLE_CONVERGENCE_PRODUCT_REVIEW'
          ip.write_text(json.dumps(c,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          contract=[
            "import fs from 'node:fs';",
            "import assert from 'node:assert/strict';",
            "const index=fs.readFileSync('public/index.php','utf8');",
            "const css=fs.readFileSync('public/assets/app.css','utf8');",
            "const js=fs.readFileSync('public/assets/v254-common-branding.js','utf8');",
            "const manifest=JSON.parse(fs.readFileSync('SOURCE_MANIFEST.json','utf8'));",
            "const candidate=JSON.parse(fs.readFileSync('docs/authority/P02_DEVELOP_CANDIDATE_IDENTITY.json','utf8'));",
            "assert.equal((index.match(/<link rel=\\\"stylesheet\\\"/g)||[]).length,1);",
            "assert.ok(index.includes('/assets/app.css'));",
            "assert.equal(fs.existsSync('public/assets/scratch-tabs.css'),false);",
            "assert.ok(css.includes('V2.5.32 R39 consolidated source: scratch-tabs.css'));",
            "assert.ok(css.includes('.scratch-workspace-v259{'));",
            "assert.ok(css.includes('.scratch-tab-scroll-v2518{'));",
            "assert.ok(js.includes('/assets/scratch-tabs.js'));",
            "assert.ok(!js.includes('/assets/scratch-tabs.css'));",
            "assert.ok(!js.includes('scratchTabOverflowUxV2518'));",
            "assert.ok(!js.includes('ensureStyle()'));",
            "assert.equal(manifest.runtime_source_file_count,71);",
            "assert.ok(!manifest.entries.some(x=>x.repo_path==='public/assets/scratch-tabs.css'));",
            "assert.equal(candidate.runtime_source_file_count,71);",
            "assert.equal(candidate.convergence.runtime_stylesheet_single_entry,true);",
            "assert.equal(fs.existsSync('browser-evidence'),false);",
            "console.log('P02_RUNTIME_STYLE_SINGLE_ENTRY=PASS');",
          ]
          Path('tests/unit/p02_runtime_style_single_entry.mjs').write_text('\n'.join(contract)+'\n',encoding='utf-8')

          evidence=[
            '# P02 Runtime Style Single Entry · 2026-08-31','',
            '## Finding','',
            'R38 confirmed Scratch still owned a second dynamically loaded stylesheet and V2.5.18 injected a runtime style block for tab overflow controls.','',
            '## Convergence','',
            '- Scratch CSS and overflow CSS now live at the end of `app.css`, preserving their former late-cascade position.',
            '- `v254-common-branding.js` dynamically loads only `scratch-tabs.js`.',
            '- Runtime identity decreases from 72 to 71 files.',
            '- R37 isolated browser screenshots are removed from product Git.','',
            '## Acceptance','',
            '- All P02 contracts, Source Manifest, and repository gates pass.',
            '- Existing Chromium task flow passes.',
            '- Scratch overflow controls work with one runtime stylesheet.',
            '- 390px Scratch workspace has no horizontal page overflow.','',
            '## Boundary','',
            'No schema, API, content model, main, tag, release, update-channel, or production change.'
          ]
          Path('docs/evidence/P02_RUNTIME_STYLE_SINGLE_ENTRY_20260831.md').write_text('\n'.join(evidence)+'\n',encoding='utf-8')
          PY
          python3 scripts/generate-source-manifest.py
          python3 scripts/verify-source-manifest.py

      - name: Verify static contracts and repository gates
        working-directory: product
        run: |
          set -Eeuo pipefail
          node --check public/assets/app.js
          node --check public/assets/v254-common-branding.js
          node --check public/assets/scratch-tabs.js
          php -l public/index.php
          test "$(tr -d '\r\n' < VERSION)" = "$EXPECTED_VERSION"
          for t in tests/unit/p02_*.mjs tests/unit/v2523_unified_content_workspace_contract.mjs; do node "$t"; done
          python3 scripts/verify-source-manifest.py
          python3 scripts/repository-gates.py
          test ! -e public/assets/scratch-tabs.css
          test ! -e browser-evidence
          ! grep -RIn '/assets/scratch-tabs.css' public/assets public/index.php
          ! grep -RIn 'scratchTabOverflowUxV2518\|ensureStyle()' public/assets/v254-common-branding.js
          python3 - <<'PY'
          import json
          m=json.load(open('SOURCE_MANIFEST.json',encoding='utf-8'));c=json.load(open('docs/authority/P02_DEVELOP_CANDIDATE_IDENTITY.json',encoding='utf-8'))
          assert m['version']=='2.5.32' and m['runtime_source_file_count']==71
          assert c['candidate_version']=='2.5.32' and c['runtime_source_file_count']==71
          assert c['production_version']=='2.5.31'
          assert c['convergence']['runtime_stylesheet_single_entry'] is True
          print('P02_R39_V3_STATIC_GATES=PASS')
          PY

      - name: Install isolated browser runtime
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 sqlite3 curl >/dev/null
          cd product
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Build and boot transformed isolated site
        working-directory: product
        run: |
          set -Eeuo pipefail
          RUN_ROOT="$RUNNER_TEMP/p02-r39-v3"; SITE="$RUN_ROOT/site"; mkdir -p "$RUN_ROOT"
          bash scripts/build-deploy-tree.sh "$SITE"
          test "$(tr -d '\r\n' < "$SITE/VERSION.txt")" = "$EXPECTED_VERSION"
          test ! -e "$SITE/assets/scratch-tabs.css"
          php -d display_errors=0 -S "127.0.0.1:$PORT" -t "$SITE" >"$RUN_ROOT/php.log" 2>&1 &
          echo $! > "$RUN_ROOT/php.pid"
          BASE_URL="http://127.0.0.1:$PORT"
          for _ in $(seq 1 80); do curl -fsS "$BASE_URL/setup.php" >/dev/null 2>&1 && break; sleep .25; done
          PASSWORD="VF-R39V3-${GITHUB_RUN_ID}!"; printf '%s' "$PASSWORD" > "$RUN_ROOT/password"
          curl -fsS -c "$RUN_ROOT/cookie" "$BASE_URL/setup.php" > "$RUN_ROOT/setup.html"
          SETUP_CSRF="$(python3 - "$RUN_ROOT/setup.html" <<'PY'
          import html,re,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf" value="([^"]+)"',s)
          if not m: raise SystemExit('setup csrf missing')
          print(html.unescape(m.group(1)))
          PY
          )"
          STATUS="$(curl -sS -o "$RUN_ROOT/setup-post.html" -w '%{http_code}' -b "$RUN_ROOT/cookie" -c "$RUN_ROOT/cookie" -H "Origin: $BASE_URL" --data-urlencode "setup_csrf=$SETUP_CSRF" --data-urlencode "password=$PASSWORD" --data-urlencode "password_confirm=$PASSWORD" "$BASE_URL/setup.php")"
          test "$STATUS" = '303'
          echo P02_R39_V3_SITE_READY=PASS

      - name: Run existing Chromium task flow
        working-directory: product
        run: |
          set -Eeuo pipefail
          RUN_ROOT="$RUNNER_TEMP/p02-r39-v3"
          VF_UX_E2E_BASE_URL="http://127.0.0.1:$PORT" VF_UX_E2E_PASSWORD="$(cat "$RUN_ROOT/password")" VF_UX_E2E_VERSION="$EXPECTED_VERSION" node tests/e2e/p02_ux_task_flow.mjs

      - name: Prove Scratch single-style runtime in Chromium
        working-directory: product
        run: |
          set -Eeuo pipefail
          RUN_ROOT="$RUNNER_TEMP/p02-r39-v3"
          cat > r39-v3.mjs <<'JS'
          import { chromium } from 'playwright';
          const base=process.env.BASE_URL,password=process.env.PASSWORD;
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1024,height:820}});
          const page=await context.newPage();
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          await page.goto(base+'/',{waitUntil:'networkidle'});
          if(await page.locator('[data-open-login]').count()){
            await page.locator('[data-open-login]').click();
            await page.locator('#loginForm input[name="password"]').fill(password);
            await page.locator('#loginSubmit').click();
            await page.waitForFunction(async()=>Boolean((await (await fetch('/api.php?action=session')).json())?.site?.auth));
          }
          await page.waitForFunction(()=>Boolean(window.VfLibraryScratch));
          await page.evaluate(async()=>{await window.VfLibraryScratch.create();for(let i=0;i<11;i++)await window.VfLibraryScratch.create();});
          await page.waitForSelector('#scratchWorkspaceV259');
          await page.waitForFunction(()=>document.querySelectorAll('[data-scratch-tab]').length>=12);
          await page.waitForTimeout(280);
          const desktop=await page.evaluate(()=>{const ws=document.querySelector('#scratchWorkspaceV259'),prev=document.querySelector('[data-scratch-tab-scroll="prev"]'),next=document.querySelector('[data-scratch-tab-scroll="next"]');return {tabs:document.querySelectorAll('[data-scratch-tab]').length,position:getComputedStyle(ws).position,prevHidden:prev?.hidden,nextHidden:next?.hidden,prevDisplay:prev?getComputedStyle(prev).display:'missing',nextDisplay:next?getComputedStyle(next).display:'missing',links:[...document.querySelectorAll('link[rel="stylesheet"]')].map(x=>x.getAttribute('href')),styleIds:[...document.querySelectorAll('style')].map(x=>x.id).filter(Boolean)};});
          console.log('R39V3_SCRATCH_DESKTOP='+JSON.stringify(desktop));
          assert(desktop.tabs>=12,'Scratch tabs missing');
          assert(desktop.position==='absolute','consolidated Scratch CSS inactive');
          assert(desktop.prevDisplay!=='missing'&&desktop.nextDisplay!=='missing','overflow controls missing');
          assert(desktop.prevHidden===false&&desktop.nextHidden===false,'overflow controls hidden');
          assert(desktop.links.length===1&&desktop.links[0].includes('/assets/app.css'),'stylesheet runtime not singular '+JSON.stringify(desktop.links));
          assert(!desktop.links.some(x=>x.includes('scratch-tabs.css')),'legacy Scratch stylesheet loaded');
          assert(!desktop.styleIds.includes('scratchTabOverflowUxV2518'),'legacy inline Scratch style remains');
          await page.setViewportSize({width:390,height:780});await page.waitForTimeout(180);
          const mobile=await page.evaluate(()=>({inner:innerWidth,root:document.documentElement.scrollWidth,body:document.body.scrollWidth,workspace:Math.round(document.querySelector('#scratchWorkspaceV259').getBoundingClientRect().width)}));
          console.log('R39V3_SCRATCH_MOBILE='+JSON.stringify(mobile));
          assert(mobile.root<=mobile.inner+1&&mobile.body<=mobile.inner+1,'390px page overflow '+JSON.stringify(mobile));
          assert(Math.abs(mobile.workspace-mobile.inner)<=1,'390px workspace overflow '+JSON.stringify(mobile));
          console.log('P02_R39_V3_SCRATCH_BROWSER=PASS');
          await browser.close();
          JS
          BASE_URL="http://127.0.0.1:$PORT" PASSWORD="$(cat "$RUN_ROOT/password")" node r39-v3.mjs
          rm r39-v3.mjs

      - name: Final verification before develop write
        working-directory: product
        run: |
          set -Eeuo pipefail
          python3 scripts/verify-source-manifest.py
          for t in tests/unit/p02_*.mjs tests/unit/v2523_unified_content_workspace_contract.mjs; do node "$t"; done
          git diff --check
          test ! -e browser-evidence
          echo P02_R39_V3_FINAL_VERIFY=PASS

      - name: Commit and push develop only
        working-directory: product
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$WRITE_TOKEN"
          git remote set-url origin "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/vf-library.git"
          git fetch origin develop
          test "$(git rev-parse origin/develop)" = "$BASE_REF"
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add -A
          git diff --cached --check
          ! git diff --cached --name-only | grep '^browser-evidence/'
          git commit -m 'refactor(P02): converge runtime styles to app.css'
          git push origin HEAD:develop
          git remote set-url origin "https://github.com/llhzx2018/vf-library"
          echo P02_R39_V3_DEVELOP_WRITE=PASS
          echo MAIN_WRITE=NO
          echo TAG_WRITE=NO
          echo RELEASE_WRITE=NO
          echo UPDATE_CHANNEL_WRITE=NO
          echo PRODUCTION_WRITE=NO

      - name: Boundaries
        if: always()
        run: |
          RUN_ROOT="$RUNNER_TEMP/p02-r39-v3"; if test -f "$RUN_ROOT/php.pid"; then kill "$(cat "$RUN_ROOT/php.pid")" 2>/dev/null || true; fi
          echo MAIN_WRITE=NO
          echo TAG_WRITE=NO
          echo RELEASE_WRITE=NO
          echo UPDATE_CHANNEL_WRITE=NO
          echo PRODUCTION_WRITE=NO
