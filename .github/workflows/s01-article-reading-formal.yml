name: S01 Theme exact formal release
on:
  push:
    branches: [task/s01-article-reading159-20261021]
    paths: ['.github/workflows/s01-article-reading-formal.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.159
  TARGET_SHA: 81338ba905c3b57b62e9531a2f7d906cfbb778ed
  TARGET_TREE: 86304fb1234a33379f030ac0a25024027cb7c5d4
  BASE_SHA: d126c8b7b3a142456df2050ded051fa3d3b70e58
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 81338ba905c3b57b62e9531a2f7d906cfbb778ed
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact verified candidate and merged source readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider candidate-proof
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/39565717041 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/39565717041 --jq .head_sha)" = 5a3212272d00520d3e8038913834ce07cff3db19
          test "$(gh api repos/$TARGET_REPO/commits/main --jq .sha)" = "$TARGET_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$TARGET_SHA --jq .tree.sha)" = "$TARGET_TREE"
          gh run download 39565717041 --repo llhzx2018/core-free-runner-public --name s01-article-reading-39565717041 --dir candidate-proof
          python3 control/lanes/s01-article-reading159-20261021/package.py
          python3 - <<'PYVERIFY'
          import json,pathlib
          old=json.loads(pathlib.Path('candidate-proof/package.json').read_text())
          new=json.loads(pathlib.Path('proof/package.json').read_text())
          browser=json.loads(pathlib.Path('candidate-proof/browser-results.json').read_text())
          assert browser['status']=='PASS' and browser['passed']==browser['count']
          for k in ['status','version','tree','sha256','bytes','files']:assert old[k]==new[k],k
          assert new['sha256']=='031f216552632ec9f50c70eb4c803fe93f712021096e140ff4163223a29cb89a' and new['bytes']==1972334
          print('MERGED_TREE_EQUALS_TESTED_TREE_AND_EXACT_PACKAGE_PASS')
          PYVERIFY
      - name: Formal release only exact verified bytes
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.35.159 --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create v1.35.159 provider/vf-tools-theme_V1.35.159.zip --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Theme V1.35.159' --notes '博客文章详情将编辑用默认说明改为访客文案，通用工具问答明确标注，文章页底返回博客继续阅读，阅读辅助标签按语言输出。保留正文、URL、SEO元数据、目录/分享/复制/相邻文章及自定义配置。中英文定向浏览器、原生升级回退和数据保护PASS。M3U8保持1.25.94；Owner手工升级Production后验收，手机暂缓。' --latest
          fi
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/v1.35.159 --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh release view v1.35.159 --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - name: Authenticated formal asset remote bytes readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download v1.35.159 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.159.zip --dir remote
          cmp provider/vf-tools-theme_V1.35.159.zip remote/vf-tools-theme_V1.35.159.zip
          echo '031f216552632ec9f50c70eb4c803fe93f712021096e140ff4163223a29cb89a  remote/vf-tools-theme_V1.35.159.zip' | sha256sum -c
          test "$(stat -c %s remote/vf-tools-theme_V1.35.159.zip)" = 1972334
          gh release view v1.35.159 --repo "$TARGET_REPO" --json url,publishedAt,tagName > proof/formal-release.json
          echo FORMAL_RELEASE_EXACT_REMOTE_ASSET_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-article-formal-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources packages
        if: always()
        run: rm -rf target provider remote candidate-proof
