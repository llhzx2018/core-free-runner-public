name: P08 83 private native job annotation classification only
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p08-83-native-job-annotation.yml
permissions:
  contents: read
jobs:
  read-only-sanitized-native-check-reason:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-83-native-job-annotation-sanitized-20261120'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PRIVATE_REPO_READ: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Classify exact PR83 failing GitHub checks read-only, without raw messages or tokens
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(id -u)" != 0
          python3 - <<'PY'
          import os,json,re,urllib.error,urllib.request
          secret=os.environ.get('PRIVATE_REPO_READ','')
          if len(secret)<20:
              print('P08_CI_ANNOTATION_SOURCE=TOKEN_NOT_AVAILABLE')
              raise SystemExit(0)
          expected='77a32d85c24d9a5715c0831932108b8ac21df191'
          ids=[
              ('first-install',136142135554),
              ('sqlite-first-install',136142105714),
              ('mysql-first-install',136142105446),
          ]
          def api(path):
              req=urllib.request.Request(
                  'https://api.github.com/repos/llhzx2018/vf-adops/'+path,
                  headers={'Authorization':'Bearer '+secret,
                           'Accept':'application/vnd.github+json',
                           'X-GitHub-Api-Version':'2022-11-28',
                           'User-Agent':'P08-exact-check-classifier'})
              try:
                  with urllib.request.urlopen(req,timeout=18) as response:
                      raw=response.read(512*1024)
                      return json.loads(raw),200
              except urllib.error.HTTPError as e:
                  return None,e.code
              except Exception:
                  return None,0
          def classify(message):
              v=message.lower()
              if any(w in v for w in ('billing','payment','paid plan','account on hold','past due','credit card','credit balance')):
                  return 'ACCOUNT_BILLING_OR_PAYMENT'
              if any(w in v for w in ('quota','spending limit','usage limit','minutes limit','consumption limit','concurrent job limit','included minutes')):
                  return 'USAGE_OR_SPENDING_LIMIT'
              if any(w in v for w in ('runner','machine allocation','capacity','resource unavailable','hosted runner')):
                  return 'RUNNER_ALLOCATION_OR_CAPACITY'
              if any(w in v for w in ('permission','not permitted','access denied','organization policy','policy violation','disabled by','workflow disabled')):
                  return 'REPO_POLICY_OR_PERMISSION'
              if any(w in v for w in ('job was not started','job was not run','cannot run','could not be started')):
                  return 'JOB_START_UNCLASSIFIED'
              return 'UNKNOWN_ANNOTATION'
          for name,cid in ids:
              detail,status=api('check-runs/'+str(cid))
              if status!=200 or not isinstance(detail,dict):
                  print('P08_CI_'+name.upper().replace('-','_')+'_READ='+('HTTP_'+str(status) if status else 'API_ERROR'))
                  continue
              if detail.get('head_sha')!=expected or detail.get('name')!=name or detail.get('conclusion')!='failure':
                  print('P08_CI_'+name.upper().replace('-','_')+'_IDENTITY=STOP_MISMATCH')
                  raise SystemExit(21)
              records,st=api('check-runs/'+str(cid)+'/annotations?per_page=100')
              if st!=200 or not isinstance(records,list):
                  print('P08_CI_'+name.upper().replace('-','_')+'_ANNOTATION_ACCESS='+('HTTP_'+str(st) if st else 'API_ERROR'))
                  continue
              print('P08_CI_'+name.upper().replace('-','_')+'_ANNOTATION_COUNT='+str(len(records)))
              classes=sorted(set(classify(str(x.get('message',''))) for x in records if isinstance(x,dict)))
              for result in classes[:5]:
                  print('P08_CI_'+name.upper().replace('-','_')+'_CAUSE_CLASS='+result)
          print('P08_NATIVE_CHECK_READ_ONLY=COMPLETE_NO_RAW_MESSAGES')
          PY
      - name: Confirm no files or temporary private checkout are retained
        if: always()
        shell: bash
        run: |
          test ! -e target
          echo P08_NATIVE_ANNOTATION_DIAGNOSTIC_NO_PRIVATE_SOURCE=PASS
