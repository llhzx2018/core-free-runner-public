name: P08 PR83 exact-source 3DB native-equivalent development acceptance
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/p08-83-native-job-annotation.yml]
permissions:
  contents: read
jobs:
  isolated-mysql-and-sqlite:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-83-native-job-annotation-sanitized-20261120'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        kind: [sqlite, mysql]
    services:
      db:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: p08-83-isolated-test-only
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=6s
          --health-retries=20
    env:
      P08_ISOLATED_INSTALL_TEST: 'YES'
      P08_TEST_DB_DRIVER: '${{ matrix.kind }}'
      P08_TEST_DB_HOST: 127.0.0.1
      P08_TEST_DB_CLEAN: p08_ci_clean
      P08_TEST_DB_DIRTY: p08_ci_dirty
      P08_TEST_DB_USER: root
      P08_TEST_DB_PASSWORD: p08-83-isolated-test-only
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout ephemeral public-safe workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact private P08 PR83 development source (no stored credential)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 77a32d85c24d9a5715c0831932108b8ac21df191
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
      - name: Setup PHP 8.4 matching native P08
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: pdo_mysql,pdo_sqlite,sqlite3,zip,mbstring,intl,bcmath,dom,fileinfo
          coverage: none
      - name: Run exact native first-install MySQL or SQLite with private logs
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(id -u)" -ne 0
          test "$(git -C target rev-parse HEAD)" = 77a32d85c24d9a5715c0831932108b8ac21df191
          test "$(cat target/VERSION)" = 0.1.13
          umask 077
          log="$RUNNER_TEMP/p08-pr83-3db-${{ matrix.kind }}.log"
          cd target
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          if composer install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress > "$log" 2>&1; then
            echo "P08_PR83_${{ matrix.kind }}_LOCKED_COMPOSER_INSTALL=PASS"
          else
            echo "P08_PR83_${{ matrix.kind }}_LOCKED_COMPOSER_INSTALL=FAIL"
            exit 21
          fi
          if [ "${{ matrix.kind }}" = mysql ]; then
            if php tests/fixtures/create_ci_databases.php >> "$log" 2>&1 &&
               php tests/test_install_mysql_e2e.php >> "$log" 2>&1; then
              echo "P08_PR83_MYSQL8_REAL_INSTALL_AND_DIRTY_REFUSAL=PASS"
            else
              echo "P08_PR83_MYSQL8_REAL_INSTALL_AND_DIRTY_REFUSAL=FAIL"
              exit 22
            fi
          else
            if php tests/test_install_sqlite_e2e.php >> "$log" 2>&1; then
              echo "P08_PR83_SQLITE_REAL_INSTALL_AND_PRIVATE_DATA=PASS"
            else
              echo "P08_PR83_SQLITE_REAL_INSTALL_AND_PRIVATE_DATA=FAIL"
              exit 23
            fi
          fi
          echo "P08_PR83_${{ matrix.kind }}_EQUIVALENT_NATIVE_TEST_COMMAND=PASS"
      - name: Always destroy private checkout and test logs
        if: always()
        shell: bash
        run: |
          rm -rf -- target "$RUNNER_TEMP/p08-pr83-3db-${{ matrix.kind }}.log"
          test ! -e target
          test ! -e "$RUNNER_TEMP/p08-pr83-3db-${{ matrix.kind }}.log"
          echo "P08_PR83_${{ matrix.kind }}_PRIVATE_CLEANUP=PASS"
  isolated-mariadb-full-stack:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-83-native-job-annotation-sanitized-20261120'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: p08-83-isolated-maria-only
          MARIADB_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=6s
          --health-retries=18
    env:
      P08_ISOLATED_INSTALL_TEST: 'YES'
      P08_TEST_DB_HOST: 127.0.0.1
      P08_TEST_DB_CLEAN: p08_ci_clean
      P08_TEST_DB_DIRTY: p08_ci_dirty
      P08_TEST_DB_USER: root
      P08_TEST_DB_PASSWORD: p08-83-isolated-maria-only
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout disposable harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact P08 PR83 full source and Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 77a32d85c24d9a5715c0831932108b8ac21df191
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: target
      - name: Checkout canonical GOV-DOC rules into temporary private path
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          path: target/.gov-doc-policy
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Native PHP8.4 Composer modules
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: pdo_mysql,pdo_sqlite,sqlite3,zip,mbstring,intl,bcmath,dom,fileinfo
          coverage: none
      - name: Node22 matching original P08 native pipeline
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Run P08 original architecture, GOV, Composer, Vue and MariaDB first-install acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(id -u)" -ne 0
          test "$(git -C target rev-parse HEAD)" = 77a32d85c24d9a5715c0831932108b8ac21df191
          test "$(cat target/VERSION)" = 0.1.13
          umask 077
          log="$RUNNER_TEMP/p08-pr83-mariadb-full-private.log"
          cd target
          run_phase(){
            name="$1"; shift
            if "$@" >> "$log" 2>&1; then
              echo "P08_PR83_MARIA_PHASE_$name=PASS"
            else
              echo "P08_PR83_MARIA_PHASE_$name=FAIL"
              exit 31
            fi
          }
          run_phase ARCH_POS_NEG python3 -B -m unittest discover -s .github/checks -p test_architecture_gate.py -v
          run_phase GOV_POS_NEG python3 -B -m unittest discover -s .github/checks -p test_gov_doc_ci.py -v
          run_phase GOV_CANON python3 -B .github/checks/check_gov_doc_ci.py --project-root . --gov-root .gov-doc-policy --project-id P08 --profile web_existing --workflow .github/workflows/p08-isolated-first-install.yml --require-git
          run_phase GOV_ARCH python3 -B -m unittest discover -s .gov-doc-policy/governance/agent -p test_code_architecture_lint.py -q
          printf '.gov-doc-policy/\n' >> .git/info/exclude
          BASE_ARCH="$(git merge-base HEAD origin/main)"
          run_phase PROJECT_ARCH python3 -B .github/checks/architecture_gate.py --manifest .github/checks/code_architecture.json --gov-root .gov-doc-policy --git-root . --base-sha "$BASE_ARCH" --head-sha "$(git rev-parse HEAD)"
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          run_phase COMPOSER_VALIDATE composer validate --no-check-publish
          run_phase COMPOSER_INSTALL composer install --no-scripts --prefer-dist --no-interaction --no-progress --classmap-authoritative
          run_phase NPM_CI npm ci --no-audit --no-fund
          run_phase VITE_BUILD npm run build
          run_phase TYPECHECK npm run typecheck
          run_phase VITEST npm run test:unit
          test -f public/build/manifest.json
          run_phase DEV_CHECK bash scripts/dev_check.sh
          run_phase PHPUNIT php vendor/bin/phpunit tests/Feature/WorkspaceInertiaTest.php
          run_phase NATIVE_DB_CREATE php tests/fixtures/create_ci_databases.php
          run_phase MARIA_INSTALL php tests/test_install_mysql_e2e.php
          test -z "$(git status --porcelain --untracked-files=all)"
          echo P08_PR83_MARIADB_COMPLETE_NATIVE_EQUIVALENT=PASS
          echo P08_PR83_EQUIVALENCE_IS_NOT_GITHUB_NATIVE_STATUS=CONFIRMED
      - name: Always erase private Laravel/GOV source and output
        if: always()
        shell: bash
        run: |
          rm -rf -- target "$RUNNER_TEMP/p08-pr83-mariadb-full-private.log"
          test ! -e target
          test ! -e "$RUNNER_TEMP/p08-pr83-mariadb-full-private.log"
          echo P08_PR83_MARIA_PRIVATE_CLEANUP=PASS
