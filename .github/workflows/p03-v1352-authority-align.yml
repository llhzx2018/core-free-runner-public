name: P03 V1.35.2 Candidate Authority Alignment
on:
  push:
    branches: [main]
    paths: ['.github/workflows/p03-v1352-authority-align.yml']
permissions:
  contents: read
jobs:
  align:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_HEAD: ee3cabb849ac8820d5d69a68bf15830739f270ce
      TARGET_BRANCH: work/p03-v1.35.2-unified-update-core
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-forge
          ref: ee3cabb849ac8820d5d69a68bf15830739f270ce
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: p03
      - name: Align current candidate authority semantics
        shell: bash
        working-directory: p03
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(cat VERSION)" = '1.35.2'
          python3 - <<'PY'
          from pathlib import Path

          def replace_required(path, pairs):
              p=Path(path); s=p.read_text(encoding='utf-8')
              for old,new in pairs:
                  if old not in s:
                      raise SystemExit(f'{path}: missing required authority marker: {old!r}')
                  s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8',newline='\n')

          replace_required('docs/authority/SSOT.md',[
            ('**状态：** `CURRENT / GIT-GOVERNED / STABLE OPERATIONS`','**状态：** `CURRENT / GIT-GOVERNED / MAINTENANCE CANDIDATE VERIFIED`'),
            ('**Working：** NONE','**Working：** V1.35.2'),
            ('**Candidate：** NONE','**Candidate：** V1.35.2 / VERIFIED'),
            ('**当前阶段：** `PRODUCTION BASELINE EXACT RECONCILIATION / FINAL RE-SEAL`','**当前阶段：** `V1.35.2 UNIFIED UPDATE CORE / RELEASE PREPARATION`'),
          ])
          p=Path('docs/authority/SSOT.md'); s=p.read_text(encoding='utf-8')
          marker='## 1. 当前工程真相\n\n'
          block=(
            '### V1.35.2 当前 Candidate Truth\n\n'
            '- Candidate：V1.35.2 / VERIFIED。\n'
            '- Schema：29 → 29，No Migration。\n'
            '- Update Discovery：`core-updates/projects/P03.json`。\n'
            '- Formal Asset Truth：GitHub Release。\n'
            '- Integrity：Release Identity + exact bytes + SHA-256。\n'
            '- Apply / Recovery / Rollback：继续复用 VF Forge Atomic Engine。\n'
            '- Public Candidate Verification：Run `31895053003` / PASS。\n'
            '- Exact Candidate Verification：Commit `faada885e49bd57d4f03ed09ae4b2ac26f2321b9` / Run `31895247208` / PASS。\n'
            '- Runner 数据边界：synthetic / temporary；Production DB、PRIVATE_DATA、完整私有源码 Artifact 均未进入 Public Evidence。\n'
            '- Production：仍为 V1.35.1；V1.35.2 Production Upgrade 尚未授权、尚未执行。\n\n'
          )
          if block not in s:
              if marker not in s: raise SystemExit('SSOT section marker missing')
              p.write_text(s.replace(marker,marker+block,1),encoding='utf-8',newline='\n')

          replace_required('docs/authority/ACCEPTANCE_MATRIX.md',[
            ('**Working：** NONE','**Working：** V1.35.2'),
            ('**Candidate：** NONE','**Candidate：** V1.35.2 / VERIFIED'),
            ('**Lifecycle：** `STABLE_OPERATIONS`','**Lifecycle：** `MAINTENANCE CANDIDATE / RELEASE PREPARATION`'),
          ])
          p=Path('docs/authority/ACCEPTANCE_MATRIX.md'); s=p.read_text(encoding='utf-8')
          marker='|---|---|---|\n'
          rows=(
            '| V1.35.2 Unified Update Core | `core-updates` + GitHub Release + bytes / SHA-256 + P03 Adapter | PASS |\n'
            '| V1.35.2 Public Candidate Verification | Run `31895053003` / synthetic fixtures / ephemeral private checkout | PASS |\n'
            '| V1.35.2 Exact Candidate Verification | `faada885e49bd57d4f03ed09ae4b2ac26f2321b9` / Run `31895247208` | PASS |\n'
            '| Existing Data / Asset Reference Preservation | synthetic fixture + Backup / Restore | PASS |\n'
            '| Atomic Apply / Rollback / Recovery | 1.35.1 → 1.35.2 / Schema 29 → 29 | PASS |\n'
            '| Secret Missing Fail-Closed | Missing read credential blocks update before mutation | PASS |\n'
            '| Public Evidence Privacy | PRIVATE_DATA 0 / Private Source Artifact 0 / Secret Leakage 0 | PASS |\n'
            '| V1.35.2 Production Upgrade | 尚未授权 / 尚未执行 | NOT EXECUTED |\n'
          )
          if rows not in s:
              if marker not in s: raise SystemExit('acceptance table marker missing')
              p.write_text(s.replace(marker,marker+rows,1),encoding='utf-8',newline='\n')
          PY
          test -z "$(git diff -- src public database scripts tests)"
          git diff --check
          echo 'AUTHORITY_ONLY_ALIGNMENT=PASS'
      - name: Commit authority alignment privately
        shell: bash
        working-directory: p03
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          git config user.name 'VF Release Automation'
          git config user.email 'vf-release-automation@users.noreply.github.com'
          git add docs/authority/SSOT.md docs/authority/ACCEPTANCE_MATRIX.md
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = '2'
          git commit -m 'docs(authority): align P03 V1.35.2 candidate truth'
          gh auth setup-git
          git push https://github.com/llhzx2018/vf-forge.git "HEAD:$TARGET_BRANCH"
          echo "P03_FINAL_CANDIDATE_HEAD=$(git rev-parse HEAD)"
          echo 'AUTHORITY_PRIVATE_PUSH=PASS'
