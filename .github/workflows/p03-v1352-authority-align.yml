name: P03 V1.35.2 Candidate Authority Alignment
on:
  push:
    branches: [main]
    paths: ['.github/workflows/p03-v1352-authority-align.yml']
permissions:
  contents: read
jobs:
  align:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_HEAD: ee3cabb849ac8820d5d69a68bf15830739f270ce
      TARGET_BRANCH: work/p03-v1.35.2-unified-update-core
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-forge
          ref: ee3cabb849ac8820d5d69a68bf15830739f270ce
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: p03
      - name: Align candidate authority only
        shell: bash
        working-directory: p03
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(cat VERSION)" = '1.35.2'
          python3 - <<'PY'
          from pathlib import Path
          import json

          def exact(path, old, new, count=1):
              p=Path(path); s=p.read_text(encoding='utf-8'); n=s.count(old)
              if n != count: raise SystemExit(f'{path}: expected {count}, got {n}: {old!r}')
              p.write_text(s.replace(old,new),encoding='utf-8',newline='\n')

          # SSOT: preserve the sealed Production 1.35.1 evidence, only align Current Candidate semantics.
          exact('docs/authority/SSOT.md', '**状态：** `CURRENT / GIT-GOVERNED / STABLE OPERATIONS`  ', '**状态：** `CURRENT / GIT-GOVERNED / MAINTENANCE CANDIDATE VERIFIED`  ')
          exact('docs/authority/SSOT.md', '**Working：** NONE  ', '**Working：** V1.35.2  ')
          exact('docs/authority/SSOT.md', '**Candidate：** NONE  ', '**Candidate：** V1.35.2 / VERIFIED  ')
          exact('docs/authority/SSOT.md', '**当前阶段：** `PRODUCTION BASELINE EXACT RECONCILIATION / FINAL RE-SEAL`', '**当前阶段：** `V1.35.2 UNIFIED UPDATE CORE / RELEASE PREPARATION`')
          marker='## 1. 当前工程真相\n\n'
          p=Path('docs/authority/SSOT.md'); s=p.read_text(encoding='utf-8')
          insert=(
            'V1.35.2 已完成统一在线更新体系 Candidate 验证：`core-updates` 作为更新发现真相，GitHub Release 作为正式 UPDATE Asset 真相，bytes + SHA-256 作为完整性合同；P03 继续复用既有 Atomic / Recovery / Rollback。Schema 保持 29，不新增 Business Feature / Data-model Migration。\n\n'
            'Candidate 使用 `core-free-runner-public` + `VF_PRIVATE_READ_TOKEN` 对私有 Repository exact Commit 做 ephemeral checkout；测试数据全部为 synthetic / temporary，不使用 Production DB，不上传 PRIVATE_DATA 或完整私有源码 Artifact。Public Candidate Verification Run `31895053003` PASS；Exact Candidate Verification Run `31895247208` PASS。\n\n'
            '当前 Production 仍为 V1.35.1；V1.35.2 尚未执行 Production Upgrade。\n\n'
          )
          if insert not in s:
              if s.count(marker)!=1: raise SystemExit('SSOT current truth marker mismatch')
              p.write_text(s.replace(marker,marker+insert),encoding='utf-8',newline='\n')

          # Acceptance Matrix: add current candidate gates while retaining production evidence.
          exact('docs/authority/ACCEPTANCE_MATRIX.md', '**Working：** NONE  ', '**Working：** V1.35.2  ')
          exact('docs/authority/ACCEPTANCE_MATRIX.md', '**Candidate：** NONE  ', '**Candidate：** V1.35.2 / VERIFIED  ')
          exact('docs/authority/ACCEPTANCE_MATRIX.md', '**Lifecycle：** `STABLE_OPERATIONS`', '**Lifecycle：** `MAINTENANCE CANDIDATE / RELEASE PREPARATION`')
          p=Path('docs/authority/ACCEPTANCE_MATRIX.md'); s=p.read_text(encoding='utf-8')
          table='| 验收项 | 证据 | 结果 |\n|---|---|---|\n'
          rows=(
            '| V1.35.2 Unified Update Core | `core-updates` + GitHub Release + exact bytes / SHA-256 + P03 Adapter | PASS |\n'
            '| V1.35.2 Public Runner Candidate | Run `31895053003` / private exact-commit ephemeral checkout / synthetic fixtures | PASS |\n'
            '| V1.35.2 Exact Candidate | Commit `faada885e49bd57d4f03ed09ae4b2ac26f2321b9` / Run `31895247208` | PASS |\n'
            '| V1.35.2 Existing Data / Asset Reference | synthetic preservation + Backup / Restore | PASS |\n'
            '| V1.35.2 Atomic Apply / Rollback / Recovery | 1.35.1 → 1.35.2 / Schema 29 → 29 | PASS |\n'
            '| Secret Missing Fail-Closed | `VF_PRIVATE_READ_TOKEN` missing / no update mutation | PASS |\n'
            '| Public Evidence Privacy | PRIVATE_DATA 0 / Private Source Artifact 0 / Secret Leakage 0 | PASS |\n'
            '| V1.35.2 Production Upgrade | 尚未授权 / 尚未执行 | NOT EXECUTED |\n'
          )
          if rows not in s:
              if s.count(table)!=1: raise SystemExit('Acceptance table marker mismatch')
              p.write_text(s.replace(table,table+rows),encoding='utf-8',newline='\n')

          # VF_PROJECT: preserve Production, add exact-candidate evidence.
          p=Path('VF_PROJECT.json'); d=json.loads(p.read_text(encoding='utf-8'))
          cv=d.setdefault('current_verification',{})
          cv['exact_candidate_commit']='faada885e49bd57d4f03ed09ae4b2ac26f2321b9'
          cv['exact_candidate_verification_run']='31895247208'
          cv['exact_candidate_verification']='PASS'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8',newline='\n')
          PY
          test -z "$(git diff -- src public database scripts tests)"
          git diff --check
          echo 'AUTHORITY_ONLY_ALIGNMENT=PASS'
      - name: Commit authority alignment privately
        shell: bash
        working-directory: p03
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          git config user.name 'VF Release Automation'
          git config user.email 'vf-release-automation@users.noreply.github.com'
          git add VF_PROJECT.json docs/authority/SSOT.md docs/authority/ACCEPTANCE_MATRIX.md
          test -z "$(git diff --cached --name-only | grep -Ev '^(VF_PROJECT.json|docs/authority/SSOT.md|docs/authority/ACCEPTANCE_MATRIX.md)$' || true)"
          git commit -m 'docs(authority): align P03 V1.35.2 verified candidate'
          gh auth setup-git
          git push https://github.com/llhzx2018/vf-forge.git "HEAD:$TARGET_BRANCH"
          echo "P03_FINAL_CANDIDATE_HEAD=$(git rev-parse HEAD)"
          echo 'AUTHORITY_PRIVATE_PUSH=PASS'
