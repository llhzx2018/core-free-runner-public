name: P05 V1.1.1 Core Updates Manifest Gate

on:
  push:
    branches:
      - verify/p05-v1.1.0-release-source-20260830
    paths:
      - '.github/workflows/p05-v1.1.1-core-updates-manifest-gate.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CORE_UPDATES_SHA: 5ad1375064aff79bda30685543b8dcc846ac99a1
      P05_MAIN_SHA: ac8c3f2bedf3b1fe16f38ed079ffbe2f29e54cbc
      P05_TREE: 0012ca03e7a065a1d5866e1d6dcc62e79c901fff
      RELEASE_ID: '379069840'
      ASSET_ID: '535585680'
      ASSET_BYTES: '218144'
      ASSET_SHA256: 905f7381a5c2e526c585c578df58aa604fffbab457e96d47444f78a3ff885c4c
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Verify private read capability
        shell: bash
        run: test -n "$PRIVATE_READ_TOKEN" || { echo TOKEN_MISSING; exit 78; }
      - name: Checkout exact core-updates source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CORE_UPDATES_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify P05 V1.1.1 manifest and remote release
        shell: bash
        env:
          GH_TOKEN: ${{ env.PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CORE_UPDATES_SHA"
          node - <<'JS'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('projects/P05.json','utf8'));
          const must=(c,m)=>{if(!c) throw new Error(m)};
          must(p.schema_version==='1.0','schema_version');
          must(p.project_id==='P05'&&p.component_id==='APP'&&p.enabled===true,'identity');
          must(p.target_version==='1.1.1','target_version');
          must(p.update_type==='FULL_ONLY'&&Array.isArray(p.from_versions)&&p.from_versions.length===0,'distribution');
          must(p.schema_from==='1'&&p.schema_to==='1','schema');
          must(p.repository==='llhzx2018/vf-seo'&&p.release_tag==='v1.1.1','release ref');
          must(p.release_id===Number(process.env.RELEASE_ID),'release id');
          must(p.release_product_commit===process.env.P05_MAIN_SHA&&p.release_product_tree===process.env.P05_TREE,'source');
          must(p.asset_name==='VF_SEO_V1.1.1_FULL.zip'&&p.asset_id===Number(process.env.ASSET_ID),'asset id');
          must(p.asset_bytes===Number(process.env.ASSET_BYTES)&&p.asset_sha256===process.env.ASSET_SHA256,'asset digest');
          must(p.minimum_php==='8.2','php');
          must(p.deployment_state==='NOT_DEPLOYED','production');
          JS
          RELEASE="$(gh api repos/llhzx2018/vf-seo/releases/tags/v1.1.1)"
          test "$(printf '%s' "$RELEASE" | jq -r '.id')" = "$RELEASE_ID"
          test "$(printf '%s' "$RELEASE" | jq -r '.target_commitish')" = "$P05_MAIN_SHA"
          ASSET="$(printf '%s' "$RELEASE" | jq --argjson id "$ASSET_ID" '.assets[]|select(.id==$id)')"
          test "$(printf '%s' "$ASSET" | jq -r '.name')" = 'VF_SEO_V1.1.1_FULL.zip'
          test "$(printf '%s' "$ASSET" | jq -r '.size')" = "$ASSET_BYTES"
          DIGEST="$(printf '%s' "$ASSET" | jq -r '.digest // empty')"
          if [[ -n "$DIGEST" ]]; then test "$DIGEST" = "sha256:$ASSET_SHA256"; fi
          echo P05_V111_CORE_UPDATES_MANIFEST=PASS
          echo P05_V111_PRODUCTION=NOT_DEPLOYED
