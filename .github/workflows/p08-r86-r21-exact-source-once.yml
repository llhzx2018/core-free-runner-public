name: P08 R86 actual Owner R21 SHA256 predecessor reproduction (isolated)
on:
  push:
    branches: [test/p08-r86-r21-manifest-20261113]
permissions:
  contents: read
jobs:
  r21-manifest:
    if: ${{ github.repository == 'llhzx2018/core-free-runner-public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 917a28636e23c89a64b0f889ed103787fd6234b8
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,ctype,dom,xml,zip,curl,sodium,pdo_sqlite,pdo_mysql
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build exact historical R21 FULL and compare real Owner-reported identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 917a28636e23c89a64b0f889ed103787fd6234b8
          test "$(cat VERSION)" = 0.1.0
          composer install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress --classmap-authoritative >/dev/null
          npm ci --no-audit --no-fund >/dev/null
          npm run build >/dev/null
          python3 scripts/build_full.py --source "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/r21-full.zip" --version 0.1.0 --source-sha 917a28636e23c89a64b0f889ed103787fd6234b8
          python3 - <<'PY'
          import zipfile,hashlib,json,os
          with zipfile.ZipFile(os.environ['RUNNER_TEMP']+'/r21-full.zip') as z:
              raw=z.read('FULL_MANIFEST.json')
              manifest=json.loads(raw)
              digest=hashlib.sha256(raw).hexdigest()
              assert manifest['source_sha']=='917a28636e23c89a64b0f889ed103787fd6234b8'
              assert manifest['target_version']=='0.1.0'
              assert manifest['project_id']=='P08'
              print('P08_R21_REBUILD_MANIFEST_SHA256='+digest)
              print('P08_R21_OWNER_SOURCE_IDENTITY=VERIFIED')
              print('P08_R21_OWNER_MANIFEST_MATCH='+('YES' if digest=='562a664a27d1b632cc28e2225a9712c8ac670533a1e88f2e9dc41f14097f2acd' else 'NO'))
          PY
      - name: Do not persist any private source, binaries or tokens
        if: always()
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          rm -f "$RUNNER_TEMP/r21-full.zip"
          echo P08_R21_PUBLIC_RUNNER_PRIVATE_SOURCE_AND_BINARY_PERSISTED=NO
