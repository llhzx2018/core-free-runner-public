name: S01 R8 integrated exact-head gate (temporary)
on:
  push:
    branches: [task/s01-r8-exact-native-20261103]
    paths: ['.github/workflows/s01-r8-exact-native-20261103.yml']
permissions:
  contents: read
jobs:
  integrated:
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: synthetic-root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: synthetic-wp
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli,mbstring,intl,zip
          coverage: none
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: 55495428da43683f5e0bc6e6ec3d596a5c3e64e4
          fetch-depth: 0
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: fbe049dc18eb18eab21e9d8c3cededfe55b783e7
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: baseline
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: d44b6b148bcdf67c3908ff95678ea3528c1bb265
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: theme
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 3f22e61339f7c76eea2c4524885819b10ee59057
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: ops
      - name: Exact merge identity, inherited parents and native source regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "55495428da43683f5e0bc6e6ec3d596a5c3e64e4"
          test "$(git -C baseline rev-parse HEAD)" = "fbe049dc18eb18eab21e9d8c3cededfe55b783e7"
          test "$(git -C theme rev-parse HEAD)" = "d44b6b148bcdf67c3908ff95678ea3528c1bb265"
          test "$(git -C ops rev-parse HEAD)" = "3f22e61339f7c76eea2c4524885819b10ee59057"
          git -C candidate merge-base --is-ancestor 7deff508b541f579da78f911cae40d1768840c2b HEAD
          git -C candidate merge-base --is-ancestor 94320d371675d52a5e1dd5be85d2b99910399022 HEAD
          git -C candidate merge-base --is-ancestor 50a0c900c0e72d0286f056e301a44b2760f4768d HEAD
          for test in candidate/tests/skin-migration-snapshot-guard.php candidate/tests/s01-backup-copy-projection-r8.php; do php -l "$test"; done
          for f in candidate/src/includes/skin-seasonal.php candidate/src/includes/v510-copy.php; do php -l "$f"; done
          (cd candidate && php tests/skin-migration-snapshot-guard.php && php tests/s01-backup-copy-projection-r8.php)
          for f in candidate/tests/converter-golden-path-r3.node.cjs candidate/tests/live-map-rotation-r3.node.cjs candidate/tests/player-manifest-r3.node.cjs candidate/tests/playlist-checker-uri-r3.node.cjs candidate/tests/r3-output-and-cancel.node.cjs candidate/tests/vod-required-init-segment.node.cjs; do node "$f"; done
          echo "S01_R8_MERGED_EXACT_NATIVE=PASS"
      - name: Isolated FULL install and same-version replacement/rollback of user-owned state
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSLo /tmp/wp-cli-r8.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          php -r '$db=new mysqli("127.0.0.1","root","synthetic-root"); if(!$db->query("CREATE DATABASE wordpress_fresh")) exit(1);'
          setup_site(){
            local path="$1" db="$2" port="$3" source="$4"
            mkdir -p "$path"
            php /tmp/wp-cli-r8.phar core download --path="$path" --skip-content --quiet
            php /tmp/wp-cli-r8.phar config create --path="$path" --dbname="$db" --dbuser=root --dbpass=synthetic-root --dbhost=127.0.0.1:3306 --skip-check
            php /tmp/wp-cli-r8.phar core install --path="$path" --url="http://127.0.0.1:$port" --title=S01-Synthetic --admin_user=synthetic --admin_password=synthetic-only-password --admin_email=synthetic@example.invalid --skip-email
            mkdir -p "$path/wp-content/themes/vf-tools-theme" "$path/wp-content/plugins/vf-tools-ops" "$path/wp-content/plugins/vf-tools-m3u8"
            cp -a theme/src/. "$path/wp-content/themes/vf-tools-theme/"
            cp -a ops/. "$path/wp-content/plugins/vf-tools-ops/"
            cp -a "$source/src/." "$path/wp-content/plugins/vf-tools-m3u8/"
            php /tmp/wp-cli-r8.phar theme activate vf-tools-theme --path="$path"
            php /tmp/wp-cli-r8.phar plugin activate vf-tools-ops/vf-ops.php vf-tools-m3u8/vf-tool-m3u8.php --path="$path"
          }
          setup_site /tmp/s01-wp-fresh wordpress_fresh 18880 candidate
          setup_site /tmp/s01-wp-update wordpress 18881 baseline
          wp_fresh(){ php /tmp/wp-cli-r8.phar "$@" --path=/tmp/s01-wp-fresh; }
          wp_old(){ php /tmp/wp-cli-r8.phar "$@" --path=/tmp/s01-wp-update; }
          wp_fresh eval 'if (!function_exists("vf_m3u8_skin_seasonal_migrate_from_legacy_v12216")) throw new Exception("Provider absent"); echo "FRESH_PROVIDER=PASS\n";'
          wp_fresh eval-file "$GITHUB_WORKSPACE/candidate/tests/seasonal-empty-retry-wordpress.php"
          wp_old option update vf_r8_owner_canary 'stable-owner-canary'
          wp_old eval '$keys=["vf_r8_owner_canary","vf_tool_m3u8_settings","vf_m3u8_copy","vf_m3u8_skin_seasonal_migration_snapshot","vf_m3u8_custom_skin_registry"]; $s=[];foreach($keys as $k){$s[$k]=serialize(get_option($k,"__MISSING__"));} file_put_contents("/tmp/s01-r8-protected-before.json",json_encode($s));'
          cp -a candidate/src/. /tmp/s01-wp-update/wp-content/plugins/vf-tools-m3u8/
          cmp candidate/src/includes/skin-seasonal.php /tmp/s01-wp-update/wp-content/plugins/vf-tools-m3u8/includes/skin-seasonal.php
          wp_old eval '$s=json_decode(file_get_contents("/tmp/s01-r8-protected-before.json"),true);foreach($s as $k=>$v){if(serialize(get_option($k,"__MISSING__"))!==$v) throw new Exception("UPDATE_DATA_DRIFT:".$k);} echo "S01_R8_INPLACE_UPDATE_PROTECTED_STATE=PASS\n";'
          cp -a baseline/src/. /tmp/s01-wp-update/wp-content/plugins/vf-tools-m3u8/
          cmp baseline/src/includes/skin-seasonal.php /tmp/s01-wp-update/wp-content/plugins/vf-tools-m3u8/includes/skin-seasonal.php
          wp_old eval '$s=json_decode(file_get_contents("/tmp/s01-r8-protected-before.json"),true);foreach($s as $k=>$v){if(serialize(get_option($k,"__MISSING__"))!==$v) throw new Exception("ROLLBACK_DATA_DRIFT:".$k);} echo "S01_R8_INPLACE_ROLLBACK_PROTECTED_STATE=PASS\n";'
          echo "S01_R8_FULL_FRESH_INSTALL_AND_SAME_VERSION_REPLACEMENT=PASS"
      - name: Synthetic tool browser 1440/768 and real shortcode render
        shell: bash
        run: |
          set -Eeuo pipefail
          php /tmp/wp-cli-r8.phar rewrite structure '/%postname%/' --path=/tmp/s01-wp-fresh --hard
          php /tmp/wp-cli-r8.phar eval '$ids=["converter","backup-restore","playlist-checker"]; $specs=vf_m3u8_first_run_tool_specs(); foreach($ids as $id){if(!isset($specs[$id])) throw new Exception("MISSING_SPEC:".$id);$slug="r8-".$id; $post=get_page_by_path($slug);if(!$post){$p=wp_insert_post(["post_type"=>"page","post_status"=>"publish","post_title"=>"S01 ".$id,"post_name"=>$slug,"post_content"=>"[".$specs[$id]["shortcode"]."]"]);if(is_wp_error($p))throw new Exception("CREATE_PAGE_FAILED:".$id);} echo "S01_TOOL_ROUTE:".$slug."\n";}' --path=/tmp/s01-wp-fresh
          php -S 127.0.0.1:18880 -t /tmp/s01-wp-fresh /tmp/s01-wp-fresh/index.php > /tmp/s01-r8-php.log 2>&1 &
          for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:18880/ >/dev/null; then break; fi; sleep 2; done
          npm install --no-audit --no-fund --prefix /tmp/s01-browser-r8 playwright@1.62.1
          /tmp/s01-browser-r8/node_modules/.bin/playwright install chromium
          NODE_PATH=/tmp/s01-browser-r8/node_modules node - <<'NODE'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{const b=await chromium.launch({headless:true});try{
            for(const tool of ['converter','backup-restore','playlist-checker'])for(const width of [768,1440]){
              const p=await b.newPage({viewport:{width,height:900}});
              const response=await p.goto('http://127.0.0.1:18880/r8-'+tool+'/',{waitUntil:'domcontentloaded',timeout:30000});
              assert.equal(response.status(),200,tool+' HTTP');
              const page=await p.evaluate(()=>({scroll:document.documentElement.scrollWidth,width:document.documentElement.clientWidth,text:document.body.innerText.length,title:document.title}));
              assert.ok(page.text>100,tool+' nonempty render');
              assert.ok(page.scroll<=page.width+1,tool+' horizontal overflow '+width);
              assert.ok(page.title,tool+' title');
              console.log('S01_R8_BROWSER_'+tool+'_'+width+'=PASS');
              await p.close();
            }
          }finally{await b.close()}})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Cleanup all transient checkouts and isolated WordPress
        if: always()
        shell: bash
        run: rm -rf candidate baseline theme ops /tmp/s01-wp-fresh /tmp/s01-wp-update /tmp/s01-browser-r8 /tmp/s01-r8-protected-before.json
