name: S01 R8 exact JS error and EN ZH locale diagnostic (temporary)
on:
  push:
    branches: [task/s01-r8-exact-native-20261103]
    paths:
      - '.github/workflows/s01-r8-exact-native-20261103.yml'
      - 'lanes/s01-r8-20261103/**'
permissions:
  contents: read
jobs:
  browser-business:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: synthetic-root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: synthetic-wp
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: control
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli,mbstring,intl,zip
          coverage: none
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: 3ab0992fb4788b8b9d15d0e338040189b6fcdd8f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: d44b6b148bcdf67c3908ff95678ea3528c1bb265
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: theme
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 3f22e61339f7c76eea2c4524885819b10ee59057
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: ops
      - name: Verify exact participating sources
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "3ab0992fb4788b8b9d15d0e338040189b6fcdd8f"
          test "$(git -C theme rev-parse HEAD)" = "d44b6b148bcdf67c3908ff95678ea3528c1bb265"
          test "$(git -C ops rev-parse HEAD)" = "3f22e61339f7c76eea2c4524885819b10ee59057"
          node --check control/lanes/s01-r8-20261103/js-error-locale.cjs
          echo "S01_R8_BUSINESS_SOURCE_IDENTITY=PASS"
      - name: Assemble private transient isolated WordPress with 3 components
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSLo /tmp/wp-cli-r8.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          WP=/tmp/s01-r8-business-wp
          mkdir -p "$WP"
          php /tmp/wp-cli-r8.phar core download --path="$WP" --skip-content --quiet
          php /tmp/wp-cli-r8.phar config create --path="$WP" --dbname=wordpress --dbuser=wordpress --dbpass=synthetic-wp --dbhost=127.0.0.1:3306 --skip-check
          php /tmp/wp-cli-r8.phar core install --path="$WP" --url=http://127.0.0.1:18880 --title=S01-Local-Only --admin_user=synthetic --admin_password=synthetic-only-password --admin_email=test@example.invalid --skip-email
          php /tmp/wp-cli-r8.phar config set WP_CONTENT_URL http://127.0.0.1:18880/wp-content --path="$WP"
          php /tmp/wp-cli-r8.phar config set WP_PLUGIN_URL http://127.0.0.1:18880/wp-content/plugins --path="$WP"
          php /tmp/wp-cli-r8.phar config set WP_SITEURL http://127.0.0.1:18880 --path="$WP"
          php /tmp/wp-cli-r8.phar config set WP_HOME http://127.0.0.1:18880 --path="$WP"
          php /tmp/wp-cli-r8.phar eval 'if(includes_url("js/wp-emoji-release.min.js")!=="http://127.0.0.1:18880/wp-includes/js/wp-emoji-release.min.js")throw new Exception("WORDPRESS_INCLUDES_URL_NOT_ROOT:".includes_url());echo "S01_R8_WP_CORE_ASSET_ROOT=PASS\n";' --path="$WP"
          mkdir -p "$WP/wp-content/themes/vf-tools-theme" "$WP/wp-content/plugins/vf-tools-ops" "$WP/wp-content/plugins/vf-tools-m3u8"
          cp -a theme/src/. "$WP/wp-content/themes/vf-tools-theme/"
          cp -a ops/. "$WP/wp-content/plugins/vf-tools-ops/"
          cp -a candidate/src/. "$WP/wp-content/plugins/vf-tools-m3u8/"
          php /tmp/wp-cli-r8.phar theme activate vf-tools-theme --path="$WP"
          php /tmp/wp-cli-r8.phar plugin activate vf-tools-ops/vf-ops.php vf-tools-m3u8/vf-tool-m3u8.php --path="$WP"
          php /tmp/wp-cli-r8.phar rewrite structure '/%postname%/' --path="$WP" --hard
          php /tmp/wp-cli-r8.phar eval '$ids=["converter","backup-restore","playlist-checker"]; $specs=vf_m3u8_first_run_tool_specs(); foreach($ids as $id){if(!isset($specs[$id]))throw new Exception("MISSING_SPEC:".$id);$post=wp_insert_post(["post_type"=>"page","post_status"=>"publish","post_name"=>$specs[$id]["route"],"post_title"=>"R8 ".$id,"post_content"=>"[".$specs[$id]["shortcode"]."]"]);if(is_wp_error($post)||!$post)throw new Exception("PAGE_ERROR:".$id);}' --path="$WP"
          cat > "$WP/.s01-router.php" <<'PHP'
          <?php
          $path = parse_url($_SERVER['REQUEST_URI'], PHP_URL_PATH);
          if (is_string($path) && $path !== '/' && is_file(__DIR__ . $path)) { return false; }
          require __DIR__ . '/index.php';
          PHP
          php -S 127.0.0.1:18880 -t "$WP" "$WP/.s01-router.php" >/tmp/s01-r8-business-http.log 2>&1 &
          for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:18880/m3u8-playlist-checker/ >/dev/null;then break;fi;sleep 2;done
          echo "S01_R8_BROWSER_ISOLATED_WP_READY=PASS"
      - name: Verify real production bundles include final sources
        shell: bash
        run: |
          set -Eeuo pipefail
          node candidate/tests/r8-production-bundle-parity.node.cjs
          for file in converter playlist-checker player downloader; do
            node --check "candidate/src/public/dist/$file.js"
          done
          echo "S01_R8_PRODUCTION_BUNDLES_NATIVE=PASS"
      - name: Browser real interaction, download, error and preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-audit --no-fund --prefix /tmp/s01-r8-playwright playwright@1.62.1
          /tmp/s01-r8-playwright/node_modules/.bin/playwright install chromium
          NODE_PATH=/tmp/s01-r8-playwright/node_modules node control/lanes/s01-r8-20261103/js-error-locale.cjs
      - name: Public synthetic evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-r8-business-${{ github.run_id }}
          path: s01-r8-js-locale-evidence.json
          if-no-files-found: warn
          retention-days: 7
      - name: Destroy temporary private source and WordPress fixture
        if: always()
        shell: bash
        run: rm -rf candidate theme ops /tmp/s01-r8-business-wp /tmp/s01-r8-playwright
