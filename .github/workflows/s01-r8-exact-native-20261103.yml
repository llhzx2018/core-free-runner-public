name: S01 R8 bounded exact-head native proof (temporary)
on:
  push:
    branches: [task/s01-r8-exact-native-20261103]
    paths: ['.github/workflows/s01-r8-exact-native-20261103.yml']
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: PHP 8.3 and Node
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: S01 M3U8 R2 exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: 7deff508b541f579da78f911cae40d1768840c2b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: r2
      - name: S01 M3U8 R3 exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: 94320d371675d52a5e1dd5be85d2b99910399022
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: r3
      - name: S01 M3U8 R8 copy exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: 50a0c900c0e72d0286f056e301a44b2760f4768d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: r8
      - name: Theme #367 exact source (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 283411633eeb70888e0b8c26c6974d5d049bec02
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: theme
      - name: Ops main exact source (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 3f22e61339f7c76eea2c4524885819b10ee59057
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: ops
      - name: Assert five exact source identities
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C r2 rev-parse HEAD)" = "7deff508b541f579da78f911cae40d1768840c2b"
          test "$(git -C r3 rev-parse HEAD)" = "94320d371675d52a5e1dd5be85d2b99910399022"
          test "$(git -C r8 rev-parse HEAD)" = "50a0c900c0e72d0286f056e301a44b2760f4768d"
          test "$(git -C theme rev-parse HEAD)" = "283411633eeb70888e0b8c26c6974d5d049bec02"
          test "$(git -C ops rev-parse HEAD)" = "3f22e61339f7c76eea2c4524885819b10ee59057"
          echo "S01_R8_FIVE_SOURCE_IDENTITIES=PASS"
      - name: R2 immutable recovery snapshot native PHP
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l r2/src/includes/skin-seasonal.php
          (cd r2 && php tests/skin-migration-snapshot-guard.php)
      - name: R3 native Node regressions on shipped JavaScript
        shell: bash
        run: |
          set -Eeuo pipefail
          for file in r3/tests/converter-golden-path-r3.node.cjs r3/tests/live-map-rotation-r3.node.cjs r3/tests/player-manifest-r3.node.cjs r3/tests/playlist-checker-uri-r3.node.cjs r3/tests/r3-output-and-cancel.node.cjs r3/tests/vod-required-init-segment.node.cjs; do
            node "$file"
          done
          echo "S01_R8_M3U8_R3_NATIVE_NODE=PASS"
      - name: R8 backup-copy native PHP with saved-data protection
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l r8/src/includes/v510-copy.php
          (cd r8 && php tests/s01-backup-copy-projection-r8.php)
      - name: Theme backup-page changed PHP syntax (no protected writes)
        shell: bash
        run: |
          set -Eeuo pipefail
          for file in theme/src/inc/bootstrap/public-runtime.php theme/src/inc/frontend-seo-context.php theme/src/inc/modules/module-faq.php theme/src/inc/modules/module-steps.php theme/src/inc/public-css-owner-registry.php theme/src/inc/services/frontend-page-progress-service.php; do
            php -l "$file"
          done
          echo "S01_R8_THEME_PR367_PHP_LINT=PASS"
      - name: Public-safe evidence summary
        if: always()
        shell: bash
        run: |
          printf '%s\n' 'S01 R8 bounded native check; five exact refs above.' 'This does not prove merged source, isolated WordPress/MariaDB integration, Chromium, install/upgrade/rollback, or Release readiness.' 'No product or Production writes.' > s01-r8-evidence.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: s01-r8-native-${{ github.run_id }}
          path: s01-r8-evidence.txt
          retention-days: 7
