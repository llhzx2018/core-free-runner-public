name: P07 VPS 验机 2.0 RC3

on:
  push:
    branches: [experiment/p07-vps-audit-v20]
    paths:
      - '.github/workflows/p07-v20-rc3.yml'
      - '.github/scripts/p07_patch_v20_rc1.py'
      - '.github/scripts/p07_patch_v20_rc1_fixup.py'
      - '.github/scripts/p07_patch_v20_rc2.py'
      - '.github/scripts/p07_patch_v20_rc2_selftest.py'
      - '.github/scripts/p07_patch_v20_rc3.py'
      - '.github/scripts/p07_patch_v20_rc3_detail.py'
      - '.github/scripts/p07_patch_v20_rc3_fixup.py'
      - 'experiments/p07-bench.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quick-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/p07-vps-audit-v20
      - name: Build RC3 exact source
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/p07_patch_v20_rc1.py
          python3 .github/scripts/p07_patch_v20_rc1_fixup.py
          python3 .github/scripts/p07_patch_v20_rc2.py
          python3 .github/scripts/p07_patch_v20_rc2_selftest.py
          python3 .github/scripts/p07_patch_v20_rc3.py
          python3 .github/scripts/p07_patch_v20_rc3_detail.py
          python3 .github/scripts/p07_patch_v20_rc3_fixup.py
          chmod +x experiments/p07-bench.sh
          bash -n experiments/p07-bench.sh
          grep -q 'VERSION="2.0.0-rc3-zh"' experiments/p07-bench.sh
      - name: Existing and semantic self-tests
        shell: bash
        run: |
          set -euo pipefail
          experiments/p07-bench.sh --self-test | tee /tmp/self.txt
          grep -q 'SELF_TEST=PASS' /tmp/self.txt
          grep -q 'V20_SELF_TEST=PASS' /tmp/self.txt
          grep -q 'V20_RC2_SEMANTIC_SELF_TEST=PASS' /tmp/self.txt
      - name: Chinese one-screen UX gate
        shell: bash
        run: |
          set -euo pipefail
          NO_COLOR=1 P07_BENCH_FORCE_FALLBACK=1 experiments/p07-bench.sh --demo | tee /tmp/demo.txt
          grep -q 'P07 VPS 一键验机 2.0' /tmp/demo.txt
          grep -q 'CPU 有效配额' /tmp/demo.txt
          grep -q '多核扩展效率' /tmp/demo.txt
          grep -q '内存有效上限' /tmp/demo.txt
          grep -q 'Swap 有效上限' /tmp/demo.txt
          grep -q '进程数上限' /tmp/demo.txt
          grep -q '常规网站/WordPress' /tmp/demo.txt
          grep -q '东南亚业务' /tmp/demo.txt
          grep -q '数据库型负载' /tmp/demo.txt
          grep -q '晚高峰再运行同一命令复测' /tmp/demo.txt
          grep -q '最终验机结论' /tmp/demo.txt
          ! grep -qE '选择|请输入选项|^[[:space:]]*[0-9]+[.)][[:space:]]' /tmp/demo.txt
      - name: JSON schema V5 gate
        shell: bash
        run: |
          set -euo pipefail
          report=""
          for d in "$HOME/.local/state/p07-bench/reports" /var/lib/p07-bench/reports; do
            if [[ -d "$d" ]]; then
              x="$(find "$d" -maxdepth 1 -type f -name 'p07-bench_*.json' 2>/dev/null | sort | tail -n1 || true)"
              [[ -n "$x" ]] && report="$x"
            fi
          done
          test -n "$report"
          python3 - "$report" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d['schema_version']==5
          v=d['vps_audit_v20']
          c=v['cpu']
          assert c['bench_state']=='PASS'
          assert float(c['sha256_single_mb_s'])>0
          assert float(c['sha256_multi_mb_s'])>0
          assert float(c['multi_core_efficiency_percent'])>0
          nq=v['network_quality']
          assert float(nq['global_median_upload_mbps'])>0
          assert float(nq['global_median_download_mbps'])>0
          r=v['resource_constraints']
          assert r['state'] in {'NORMAL','PARTIAL','LIMITED','UNKNOWN'}
          assert r['scope']=='EFFECTIVE_CGROUP_LIMIT_SIGNALS'
          for k in ('cgroup_base','memory_limit','swap_limit','pids_limit'): assert k in r
          w=v['workload_fit']
          assert w['website_wordpress'] in {'适合','观察','不建议'}
          assert w['southeast_asia'] in {'良好','可用','较弱'}
          assert w['database'] in {'良好','一般','较弱'}
          assert v['mainland_inbound_probe']=='NOT_RUN'
          assert 0<=v['verdict']['score']<=100
          assert 0<=v['verdict']['evidence_completeness_percent']<=100
          print('JSON_V5_GATE=PASS')
          PY

  real-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/p07-vps-audit-v20
      - name: Build RC3 exact source
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/p07_patch_v20_rc1.py
          python3 .github/scripts/p07_patch_v20_rc1_fixup.py
          python3 .github/scripts/p07_patch_v20_rc2.py
          python3 .github/scripts/p07_patch_v20_rc2_selftest.py
          python3 .github/scripts/p07_patch_v20_rc3.py
          python3 .github/scripts/p07_patch_v20_rc3_detail.py
          python3 .github/scripts/p07_patch_v20_rc3_fixup.py
          chmod +x experiments/p07-bench.sh
          bash -n experiments/p07-bench.sh
      - name: Real CPU disk cgroup global-network gate
        shell: bash
        run: |
          set -euo pipefail
          NO_COLOR=1 P07_BENCH_FORCE_FALLBACK=1 P07_BENCH_IO_MIB=64 experiments/p07-bench.sh | tee /tmp/real.txt
          grep -q 'SHA256 单核.*MB/s' /tmp/real.txt
          grep -q 'SHA256 多核.*MB/s' /tmp/real.txt
          grep -Eq '多核扩展效率 +: [0-9.]+%' /tmp/real.txt
          grep -q 'CPU 有效配额' /tmp/real.txt
          ! grep -q 'CPU 有效配额.*未知' /tmp/real.txt
          grep -q '4K 同步写 IOPS' /tmp/real.txt
          grep -q 'fsync P95 延迟' /tmp/real.txt
          grep -q '全球上行中位数' /tmp/real.txt
          grep -q '东南亚上行中位数' /tmp/real.txt
          grep -q '内存有效上限' /tmp/real.txt
          grep -q 'Swap 有效上限' /tmp/real.txt
          grep -q '进程数上限' /tmp/real.txt
          grep -q '常规网站/WordPress' /tmp/real.txt
          grep -q '东南亚业务' /tmp/real.txt
          grep -q '数据库型负载' /tmp/real.txt
          grep -Eq 'ICMP 丢包（最差）|ICMP 丢包/抖动 +: 受限' /tmp/real.txt
          grep -q '最终验机结论' /tmp/real.txt

  publish-candidate:
    needs: [quick-gate, real-gate]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/p07-vps-audit-v20
          fetch-depth: 0
      - name: Rebuild and publish exact RC3 bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/p07_patch_v20_rc1.py
          python3 .github/scripts/p07_patch_v20_rc1_fixup.py
          python3 .github/scripts/p07_patch_v20_rc2.py
          python3 .github/scripts/p07_patch_v20_rc2_selftest.py
          python3 .github/scripts/p07_patch_v20_rc3.py
          python3 .github/scripts/p07_patch_v20_rc3_detail.py
          python3 .github/scripts/p07_patch_v20_rc3_fixup.py
          chmod +x experiments/p07-bench.sh
          cp experiments/p07-bench.sh experiments/p07-vps-audit-v20-rc3.sh
          bash -n experiments/p07-vps-audit-v20-rc3.sh
          sha256sum experiments/p07-vps-audit-v20-rc3.sh | tee experiments/p07-vps-audit-v20-rc3.sha256
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add experiments/p07-vps-audit-v20-rc3.sh experiments/p07-vps-audit-v20-rc3.sha256
          if git diff --cached --quiet; then
            echo 'RC3 candidate bytes already current'
          else
            git commit -m 'candidate(p07): publish VPS audit 2.0 rc3'
            git push origin HEAD:experiment/p07-vps-audit-v20
          fi
