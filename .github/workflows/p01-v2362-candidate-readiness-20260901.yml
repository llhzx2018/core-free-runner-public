name: P01 V2.36.2 Candidate Readiness
on:
  push:
    branches: [release/p01-v2362-candidate-20260901]
    paths:
      - .github/workflows/p01-v2362-candidate-readiness-20260901.yml
      - scripts/p01_v2362_candidate_readiness_generate.py
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CANDIDATE: 67b00fd8cdb20c18cd6dedf3b412aa007854fabe
      CANDIDATE_TREE: 5c72bb983a8e420898820a958fbc10f8ceca80c1
      CANDIDATE_RUNTIME_TREE: 55bc3143df6ca4e8e66b3e8d3e0f01b3ec343424
      SOURCE: 23321270d79fc98d529c2c5a0ef07e0f1012835a
      SOURCE_TREE: 889d7662cf7907cc93d958c5df31f7824faa050a
      SOURCE_RUNTIME_TREE: 91f92c5d3e7080469a7f5ab1497145454014c87a
      VERSION: 2.36.2
      SOURCE_VERSION: 2.36.1
      SCHEMA: '2026082901'
      OUT: /tmp/p01-v2362-candidate-artifacts
      EVID: /tmp/p01-v2362-candidate-evidence
      UPGRADE: /tmp/p01-v2362-upgrade
      FRESH: /tmp/p01-v2362-fresh
      ROOT: ${{ github.workspace }}/candidate/src
      PORT: '18574'
      ADMIN_PASS: P01V2362AuthEntry2026
    steps:
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - name: Checkout release runner
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: release/p01-v2362-candidate-20260901
          path: runner
      - name: Checkout proven V2.36.0 candidate template
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 0fe72c7981f5f2b6ddd51bf4cfa5d6c014c9b0d3
          path: template
      - name: Checkout proven visible auth-entry gate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 948e83dacef37a4ada98f69d7793f5f5ea1c9f0a
          path: auth
      - name: Checkout exact V2.36.2 candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.CANDIDATE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: candidate
      - name: Checkout immutable V2.36.1 predecessor
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.36.1
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: production
      - name: Checkout proven Atomic builder
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: agent/p01-22121-formal-artifact-gate-20260819
          path: proven
      - name: Generate fenced V2.36.2 gates
        shell: bash
        run: python3 runner/scripts/p01_v2362_candidate_readiness_generate.py
      - name: Exact source runtime authority fence
        shell: bash
        run: bash /tmp/p01-v2362-generated/01-exact.sh
      - name: Build deterministic candidate artifacts
        shell: bash
        run: bash /tmp/p01-v2362-generated/02-build.sh
      - name: Actual V2.36.1 to V2.36.2 Atomic upgrade
        shell: bash
        run: bash /tmp/p01-v2362-generated/03-atomic.sh
      - name: Strict fresh candidate runtime
        shell: bash
        run: bash /tmp/p01-v2362-generated/04-fresh.sh
      - name: Fresh auth runtime and seed
        shell: bash
        run: bash /tmp/p01-v2362-generated/05-auth-seed.sh
      - name: Chromium visible login logout contract
        shell: bash
        run: bash /tmp/p01-v2362-generated/06-auth-browser.sh
      - name: Final SQLite and release boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$ROOT" EVID="$EVID" php <<'PHP'
          <?php
          require getenv('ROOT').'/app/bootstrap.php';
          $db=vf_db();
          if(strtolower((string)$db->query('PRAGMA integrity_check')->fetchColumn())!=='ok') exit(1);
          if($db->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC)) exit(2);
          file_put_contents(getenv('EVID').'/final-db.txt',"INTEGRITY=ok\nFK=0\n");
          echo "P01_V2362_SQLITE=PASS\n";
          PHP
          printf 'P01_V2362_CANDIDATE_READINESS=PASS\nSOURCE=%s\nTREE=%s\nRUNTIME_TREE=%s\nSCHEMA=%s\nVISIBLE_AUTH_ENTRY=PASS\nOWNER_PRODUCTION_WRITE=NO\n' "$CANDIDATE" "$CANDIDATE_TREE" "$CANDIDATE_RUNTIME_TREE" "$SCHEMA" | tee "$EVID/verdict.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-v2362-candidate-readiness-${{ github.run_id }}
          path: |
            /tmp/p01-v2362-candidate-evidence
            /tmp/p01-v2362-candidate-artifacts
          if-no-files-found: error
          retention-days: 90
      - name: Stop servers
        if: always()
        shell: bash
        run: |
          kill "$(cat /tmp/p01-v2362-upgrade.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat /tmp/p01-v2362-fresh.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat /tmp/p01-v2362-auth.pid 2>/dev/null)" 2>/dev/null || true
