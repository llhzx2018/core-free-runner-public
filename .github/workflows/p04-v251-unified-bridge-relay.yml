name: P04 V2.5.1 Unified Bridge Sealed Relay

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p04-v251-unified-bridge-relay.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: p04-v251-unified-bridge-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BRIDGE_INFO_URL: https://infra.kewaro.com/P04_V2.5.1_TO_UNIFIED_UPDATE_BRIDGE.php?relay=info
      BRIDGE_TOKEN_URL: https://infra.kewaro.com/P04_V2.5.1_TO_UNIFIED_UPDATE_BRIDGE.php?relay=token
      WORKFLOW_PATH: .github/workflows/p04-v251-unified-bridge-relay.yml
    steps:
      - name: Checkout relay repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Probe one-time P04 Bridge
        id: probe
        shell: bash
        run: |
          set -Eeuo pipefail
          body="$RUNNER_TEMP/p04-bridge-info.json"
          code=$(curl --silent --show-error --max-time 20 --output "$body" --write-out '%{http_code}' "$BRIDGE_INFO_URL" || true)
          case "$code" in
            200)
              status=$(python3 - "$body" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          print(str(d.get('status','')))
          PY
          )
              if [ "$status" = 'ready' ]; then
                echo 'action=relay' >> "$GITHUB_OUTPUT"
              elif [ "$status" = 'already-success' ]; then
                echo 'action=cleanup' >> "$GITHUB_OUTPUT"
              else
                echo 'action=none' >> "$GITHUB_OUTPUT"
              fi
              ;;
            404|409|425)
              echo 'action=none' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Bridge probe HTTP $code; fail closed without Production write."
              echo 'action=none' >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Validate relay identity
        if: steps.probe.outputs.action == 'relay'
        shell: bash
        run: |
          set -Eeuo pipefail
          body="$RUNNER_TEMP/p04-bridge-info.json"
          python3 - "$body" <<'PY'
          import base64,json,sys,time
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d.get('ok') is True
          assert d.get('status')=='ready'
          assert d.get('project_id')=='P04'
          assert d.get('current_version')=='2.5.1'
          assert d.get('target_version')=='2.5.2'
          pk=base64.b64decode(d.get('public_key_b64',''),validate=True)
          assert len(pk)==32
          nonce=str(d.get('nonce',''))
          assert len(nonce)==48 and all(c in '0123456789abcdef' for c in nonce.lower())
          assert d.get('expires_at')
          print('P04_BRIDGE_RELAY_IDENTITY=PASS')
          PY

      - name: Seal existing unified private read token
        if: steps.probe.outputs.action == 'relay'
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          php -r '
            $info=json_decode(file_get_contents(getenv("RUNNER_TEMP")."/p04-bridge-info.json"),true,32,JSON_THROW_ON_ERROR);
            $pk=base64_decode((string)$info["public_key_b64"],true);
            if(!is_string($pk)||strlen($pk)!==SODIUM_CRYPTO_BOX_PUBLICKEYBYTES) throw new RuntimeException("bad public key");
            $token=(string)getenv("READ_TOKEN");
            if($token===""||strlen($token)>512||preg_match("/[\\r\\n\\0]/",$token)) throw new RuntimeException("bad token contract");
            $sealed=sodium_crypto_box_seal($token,$pk);
            $payload=json_encode(["nonce"=>(string)$info["nonce"],"sealed_token_b64"=>base64_encode($sealed)],JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR);
            file_put_contents(getenv("RUNNER_TEMP")."/p04-bridge-token.json",$payload,LOCK_EX);
          '
          echo 'SEALED_TOKEN_READY=PASS'

      - name: Deliver sealed token to one-time Bridge
        if: steps.probe.outputs.action == 'relay'
        id: deliver
        shell: bash
        run: |
          set -Eeuo pipefail
          response="$RUNNER_TEMP/p04-bridge-delivery.json"
          code=$(curl --silent --show-error --max-time 30 \
            -H 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/p04-bridge-token.json" \
            --output "$response" --write-out '%{http_code}' \
            "$BRIDGE_TOKEN_URL")
          test "$code" = '200'
          python3 - "$response" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d.get('ok') is True
          assert d.get('status') in ('success','already-success')
          assert d.get('project_id')=='P04'
          print('P04_SEALED_TOKEN_RELAY=PASS')
          PY
          rm -f "$RUNNER_TEMP/p04-bridge-token.json" "$response" "$RUNNER_TEMP/p04-bridge-info.json"
          echo 'delivered=true' >> "$GITHUB_OUTPUT"

      - name: Remove one-time relay workflow after delivery
        if: steps.probe.outputs.action == 'cleanup' || steps.deliver.outputs.delivered == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git pull --ff-only origin main
          if [ -f "$WORKFLOW_PATH" ]; then
            git rm "$WORKFLOW_PATH"
            git commit -m 'ops(P04): retire one-time sealed bridge relay [skip ci]'
            git push origin HEAD:main
          fi
          echo 'P04_ONE_TIME_RELAY_CLEANUP=PASS'

      - name: Safety statement
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/p04-bridge-token.json" "$RUNNER_TEMP/p04-bridge-delivery.json" "$RUNNER_TEMP/p04-bridge-info.json"
          echo 'PRODUCTION_SESSION_USED=NO'
          echo 'PRODUCTION_BACKUP_OR_UPGRADE_EXECUTED_BY_RUNNER=NO'
          echo 'PLAINTEXT_TOKEN_PRINTED=NO'
