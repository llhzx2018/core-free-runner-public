name: P02 V2.5.51 Reader Continuity Gate

on:
  push:
    branches:
      - run/p02-v2551-reader-continuity-20260920
    paths:
      - '.github/workflows/p02-v2551-reader-continuity.yml'

permissions:
  contents: read

jobs:
  ux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_SHA: 705c7895da797b85578cb630e8f50b9fa6d4bd72
      TARGET_VERSION: 2.5.51
    steps:
      - name: Checkout exact P02 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 705c7895da797b85578cb630e8f50b9fa6d4bd72
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product

      - name: Install runtime and Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-zip sqlite3 curl
          cd product
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify source and UX contracts
        shell: bash
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "$TARGET_VERSION"
          bash scripts/verify-repository.sh
          node tests/unit/p02_v2542_inkstone_reference_contract.mjs
          node tests/unit/p02_v2543_editor_list_continuity.mjs
          node tests/unit/p02_v2544_full_list_density.mjs
          node tests/unit/p02_v2545_settings_form_convergence.mjs
          node tests/unit/p02_v2546_mobile_settings_convergence.mjs
          node tests/unit/p02_v2547_note_rail_quiet_state.mjs
          node tests/unit/p02_v2548_workspace_toolbar_convergence.mjs
          node tests/unit/p02_v2549_sidebar_command_convergence.mjs
          node tests/unit/p02_v2550_new_editor_empty_state.mjs
          node tests/unit/p02_v2551_standalone_reader_convergence.mjs
          node tests/unit/p02_candidate_version_identity_contract.mjs
          echo P02_V2551_SOURCE_GATE=PASS

      - name: Real Chromium UX regression
        shell: bash
        working-directory: product
        run: |
          set -Eeuo pipefail
          bash scripts/ux-browser-reverify.sh | tee /tmp/p02-v2551-browser.log
          grep -Fx 'P02_V2551_STANDALONE_READER_CONTINUITY=PASS' /tmp/p02-v2551-browser.log
          grep -Fx 'P02_V2550_NEW_EDITOR_CONVERGENCE=PASS' /tmp/p02-v2551-browser.log
          echo P02_V2551_BROWSER_GATE=PASS
