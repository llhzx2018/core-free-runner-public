name: p01-channel-watch-browse-1921-temporary
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-channel-watch-1921-temp.yml']

permissions:
  contents: read

jobs:
  exact-source-browse-gate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_SHA: aac115465b29255e0d6c2a8af9c6d19337f334ba
      BASE_SHA: f64fcc150fe8a861543b0cbd49946c99e09e078b
      PRODUCT_REPO: llhzx2018/vf-start
      PRODUCT_BRANCH: feat/p01-channel-watch-browse-clarity-r1
    steps:
      - name: Checkout public Runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Exact-source PHP, focused UX contracts and canonical zero-debt regression
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          test -n "$READ_TOKEN"
          ROOT="$(mktemp -d /tmp/p01-browse-1921.XXXXXXXX)"
          trap 'rm -rf "$ROOT"' EXIT
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd >/dev/null
          git clone -q --depth 1 --branch "$PRODUCT_BRANCH" "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" "$ROOT/candidate"
          git clone -q --depth 1 --branch main "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" "$ROOT/stable"
          test "$(git -C "$ROOT/candidate" rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C "$ROOT/stable" rev-parse HEAD)" = "$BASE_SHA"
          git -C "$ROOT/candidate" remote set-url origin "https://github.com/$PRODUCT_REPO.git"
          git -C "$ROOT/stable" remote set-url origin "https://github.com/$PRODUCT_REPO.git"
          unset READ_TOKEN
          echo "P01_BROWSE_EXACT_SHA=$TARGET_SHA"
          test "$(tr -d '\r\n ' < "$ROOT/candidate/VERSION")" = "2.47.496"
          test "$(tr -d '\r\n ' < "$ROOT/candidate/src/VERSION.txt")" = "2.47.496"
          cd "$ROOT/candidate"
          for f in src/app/ChannelLibraryPage.php src/app/WatchMediaLibraryPage.php tests/unit/p01_channel_watch_browse_clarity_contract.php; do
            php -l "$f" >/dev/null
          done
          echo P01_BROWSE_PHP_SYNTAX=PASS
          for f in \
            tests/unit/p01_channel_watch_browse_clarity_contract.php \
            tests/unit/channels_reader_r4_single_toolbar_contract.php \
            tests/unit/channel_scope_disclosure_contract.php \
            tests/unit/channels_owner_default_video_view_native.php \
            tests/unit/watch_page_filter_hierarchy_contract.php \
            tests/unit/watch_page_context_count_contract.php \
            tests/unit/watch_status_transition_facets_contract.php \
            tests/unit/watch_page_full_polish_contract.php \
            tests/unit/watch_cinema_rebuild_contract.php; do
            php "$f"
          done
          node tests/unit/watch_filter_action_contract.cjs
          echo P01_BROWSE_FOCUSED_REGRESSION=PASS
          RC=0
          bash tests/canonical_release_regression.sh "$ROOT/candidate" "$ROOT/stable" --require-zero-debt >"$ROOT/canonical.log" 2>&1 || RC=$?
          grep -E '^(P01_CANONICAL_(BASELINE_TEST_COUNT|CURRENT_TEST_COUNT|CURRENT_FAILURE_COUNT|NEW_REGRESSION_COUNT|REMOVED_BASELINE_TEST_COUNT|LEGACY_TEST_DEBT_COUNT|ZERO_DEBT_REQUIRED)=|NEW_UNIT_REGRESSION=|CHANGED_TEST_FAILURE=)' "$ROOT/canonical.log" || true
          test "$RC" -eq 0
          echo P01_BROWSE_CANONICAL_ZERO_DEBT=PASS

      - name: Public-safe lifecycle acknowledgment
        if: always()
        shell: bash
        run: |
          echo P01_PRIVATE_SOURCE_PERSISTED_IN_PUBLIC_GIT=NO
          echo P01_PRIVATE_SOURCE_ARTIFACT=NONE
          echo P01_OWNER_PRODUCTION_CHANGED=NO
          echo P01_TEMPORARY_LANE_MUST_CLOSE_WITHOUT_MERGE=YES
