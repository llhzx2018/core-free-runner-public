name: S01 M3U8 Professional Dropdown R17 Candidate Gate

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/s01-c03-professional-dropdown-r17-gate-20260925.yml'

permissions:
  contents: read

jobs:
  gate:
    if: github.head_ref == 'task/s01-c03-professional-dropdown-r17-gate-20260925'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      M3U8_SHA: 52e772dc3b85f7321efa2cd0e3aa747c22b3bdef
    steps:
      - name: Credential presence
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: test -n "$READ_TOKEN"

      - name: Checkout exact M3U8 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: ${{ env.M3U8_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: m3u8

      - name: Exact source and R17 contract
        working-directory: m3u8
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$M3U8_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "1.25.44"
          php -l tests/s01-c03-admin-shell-alignment-r1-contract.php
          php tests/s01-c03-admin-shell-alignment-r1-contract.php
          grep -Fq 'R17 · Unified compact Professional Mode dropdown' src/admin/ui-v4/admin-s01-shell-header-final-r14.css
          grep -Fq 'width:272px!important' src/admin/ui-v4/admin-s01-shell-header-final-r14.css
          grep -Fq 'grid-template-columns:minmax(0,1fr)!important' src/admin/ui-v4/admin-s01-shell-header-final-r14.css
          grep -Fq 'display:contents!important' src/admin/ui-v4/admin-s01-shell-header-final-r14.css
          grep -Fq 'display:none!important' src/admin/ui-v4/admin-s01-shell-header-final-r14.css
          grep -Fq '272px 单列 Dropdown' docs/authority/PRD.md
          grep -Fq '272px 单列紧凑 Dropdown' docs/authority/ACCEPTANCE_MATRIX.md

      - name: IA invariants
        working-directory: m3u8
        run: |
          set -Eeuo pipefail
          grep -Fq "'主要能力' => ['capabilities','pipelines']" src/admin/Presentation/Components/class-admin-components.php
          grep -Fq "'运行与测试' => ['runtime_v6','playground','fixtures']" src/admin/Presentation/Components/class-admin-components.php
          grep -Fq "'维护' => ['diagnostics_v6','provider_backup']" src/admin/Presentation/Components/class-admin-components.php

      - name: PHP syntax
        working-directory: m3u8
        run: |
          set -Eeuo pipefail
          find src -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
