name: p01-r3-c2-diagnostic-temp

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-r3-c2-diagnostic-temp.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      TARGET_SHA: c50367c4a9e5130f4c83c37829e49e1377f4bfba
    steps:
      - name: Checkout runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout exact P01 main
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" product
          git -C product fetch -q --depth 1 origin "$TARGET_SHA"
          git -C product checkout -q --detach FETCH_HEAD
          test "$(git -C product rev-parse HEAD)" = "$TARGET_SHA"
          echo P01_R3_C2_EXACT_SOURCE=PASS

      - name: Capture remaining 22 debt signatures
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          tests=(
            tests/unit/channel_add_background_context_contract.php
            tests/unit/channel_kind_facet_context_contract.php
            tests/unit/channel_provider_context_facet_contract.php
            tests/unit/channel_provider_zero_result_contract.php
            tests/unit/channel_type_context_count_contract.php
            tests/unit/channel_watch_search_context_contract.php
            tests/unit/domain_add_context_contract.php
            tests/unit/platform_shortcut_hint_contract.php
            tests/unit/primary_open_semantics_contract.php
            tests/unit/project_check_time_semantics_contract.php
            tests/unit/project_fact_density_contract.php
            tests/unit/project_recent_check_tone_contract.php
            tests/unit/quick_open_accessible_hint_contract.php
            tests/unit/quick_open_global_contract.php
            tests/unit/quick_open_shortcut_ownership_guard_contract.php
            tests/unit/quick_open_single_authority_contract.php
            tests/unit/quick_save_prg_contract.php
            tests/unit/resource_action_semantics_contract.php
            tests/unit/subject_list_heading_context_contract.php
            tests/unit/subject_primary_open_contract.php
            tests/unit/summary_semantics_consistency_contract.php
            tests/unit/tag_add_context_contract.php
          )
          test "${#tests[@]}" -eq 22
          failures=0
          for t in "${tests[@]}"; do
            echo "P01_R3_C2_BEGIN=$t"
            set +e
            out="$(php "$t" 2>&1)"
            rc=$?
            set -e
            printf '%s\n' "$out" | sed 's/^/P01_R3_C2_OUTPUT=/'
            echo "P01_R3_C2_RC=$rc test=$t"
            [ "$rc" -eq 0 ] || failures=$((failures+1))
          done
          echo "P01_R3_C2_FAILURES=$failures"
          test "$failures" -eq 22