name: p01-r3-c2-verify-temp

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-r3-c2-diagnostic-temp.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      BASE_SHA: c50367c4a9e5130f4c83c37829e49e1377f4bfba
      TARGET_SHA: 4c0d8a93808afef9efd566189e5a6c64f20f654d
    steps:
      - name: Checkout runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout exact P01 sources
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          for name in baseline current; do git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "$name"; done
          git -C baseline fetch -q --depth 1 origin "$BASE_SHA"
          git -C baseline checkout -q --detach FETCH_HEAD
          git -C current fetch -q --depth 1 origin "$TARGET_SHA"
          git -C current checkout -q --detach FETCH_HEAD
          test "$(git -C baseline rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C current rev-parse HEAD)" = "$TARGET_SHA"
          echo P01_R3_C2_EXACT_SOURCES=PASS

      - name: Focused final 22
        shell: bash
        run: |
          set -Eeuo pipefail
          cd current
          tests=(
            tests/unit/channel_add_background_context_contract.php
            tests/unit/channel_kind_facet_context_contract.php
            tests/unit/channel_provider_context_facet_contract.php
            tests/unit/channel_provider_zero_result_contract.php
            tests/unit/channel_type_context_count_contract.php
            tests/unit/channel_watch_search_context_contract.php
            tests/unit/domain_add_context_contract.php
            tests/unit/platform_shortcut_hint_contract.php
            tests/unit/primary_open_semantics_contract.php
            tests/unit/project_check_time_semantics_contract.php
            tests/unit/project_fact_density_contract.php
            tests/unit/project_recent_check_tone_contract.php
            tests/unit/quick_open_accessible_hint_contract.php
            tests/unit/quick_open_global_contract.php
            tests/unit/quick_open_shortcut_ownership_guard_contract.php
            tests/unit/quick_open_single_authority_contract.php
            tests/unit/quick_save_prg_contract.php
            tests/unit/resource_action_semantics_contract.php
            tests/unit/subject_list_heading_context_contract.php
            tests/unit/subject_primary_open_contract.php
            tests/unit/summary_semantics_consistency_contract.php
            tests/unit/tag_add_context_contract.php
          )
          test "${#tests[@]}" -eq 22
          lint_fail=0
          for t in "${tests[@]}"; do
            echo "LINT=$t"
            php -l "$t" || lint_fail=$((lint_fail+1))
          done
          echo "P01_R3_C2_LINT_FAILURES=$lint_fail"
          test "$lint_fail" -eq 0
          for t in "${tests[@]}"; do echo "RUN=$t"; php "$t"; done
          echo P01_R3_C2_FOCUSED=PASS

      - name: Canonical zero-debt comparison
        shell: bash
        run: |
          set -Eeuo pipefail
          bash current/tests/canonical_release_regression.sh current baseline | tee /tmp/canonical.txt
          grep -q '^P01_CANONICAL_BASELINE_FAILURE_COUNT=22$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_CURRENT_FAILURE_COUNT=0$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_CHANGED_TEST_COUNT=22$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_RESOLVED_DEBT_COUNT=22$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_CHANGED_FAILURE_COUNT=0$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_NEW_REGRESSION_COUNT=0$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_LEGACY_TEST_DEBT_COUNT=0$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_UNIT_REGRESSION=PASS$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_LEGACY_TEST_DEBT=NONE$' /tmp/canonical.txt
          echo P01_R3_C2_CANONICAL_ZERO_DEBT=PASS

      - name: Runtime source unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C current fetch -q --depth 1 origin "$BASE_SHA"
          git -C current diff --exit-code "$BASE_SHA" "$TARGET_SHA" -- src
          test "$(cat current/VERSION)" = "2.47.41"
          test -z "$(git -C current status --porcelain --untracked-files=no)"
          echo P01_R3_C2_RUNTIME_UNCHANGED=PASS