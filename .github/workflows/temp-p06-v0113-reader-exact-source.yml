name: P06 V0.1.13 Reader and Whole-Site Exact Source Gate

on:
  pull_request:
    paths:
      - .github/workflows/temp-p06-v0113-reader-exact-source.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p06-v0113-reader-exact-source
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_REPO: llhzx2018/vf-press
      SOURCE_SHA: 436a07c4ffc6dbb4df24ec8309f0c75a5a5e64fa
      SOURCE_TREE: 7414f0d4f83dabff46722de88b6017b2d652de4c
    steps:
      - name: Require private read capability
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo PRIVATE_READ_CAPABILITY=PASS

      - name: Checkout exact P06 source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Prepare PHP SQLite runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 php-mbstring php-zip php-curl sqlite3 composer >/dev/null
          php -v
          composer --version
          echo MACHINE_RUNTIME=PASS

      - name: Exact source and authority gate
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test "$(tr -d '\r\n' < VERSION)" = '0.1.13'
          test "$(jq -r .version VF_PROJECT.json)" = '0.1.13'
          test "$(jq -r .schema VF_PROJECT.json)" = '3'
          test "$(jq -r .lifecycle VF_PROJECT.json)" = 'CANDIDATE'
          test "$(jq -r .current_phase VF_PROJECT.json)" = 'V0_1_13_WHOLE_SITE_READER_DEMO_REMEDIATION_CANDIDATE'
          test "$(jq -r .next_gate VF_PROJECT.json)" = 'EXACT_SOURCE_REGRESSION_V0_1_13'
          test "$(jq -r .production_update_state.observed_runtime_version VF_PROJECT.json)" = '0.1.12'
          test "$(jq -r .release_gates.owner_real_use_after_production_update VF_PROJECT.json)" = 'FAIL_V0_1_12_READER_NOT_SUITABLE_FOR_SUSTAINED_READING'
          grep -Fq 'OWNER Reader Real Use V0.1.12 | FAIL' docs/authority/ACCEPTANCE_MATRIX.md
          test -f docs/evidence/P06_V0112_OWNER_READER_REAL_USE_FAIL_20260824.md
          echo SOURCE_IDENTITY=PASS
          echo OWNER_FAILURE_PRESERVED=PASS
          echo AUTHORITY_DRIFT_GATE=PASS
          echo SCHEMA_MIGRATION=NOT_REQUIRED
          echo PRODUCTION_WRITE=0

      - name: Composer PHP and complete regression
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          composer validate --strict
          composer dump-autoload --no-dev --optimize --no-interaction
          find src bin public -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          rm -rf storage dist storage-restore-*
          php bin/migrate.php | grep -Fq MIGRATION_PASS
          php bin/self-test.php | grep -Fq FOUNDATION_SELF_TEST_PASS
          php bin/security-self-test.php | grep -Fq SECURITY_SELF_TEST_PASS
          php bin/research-self-test.php | grep -Fq RESEARCH_SELF_TEST_PASS
          php bin/publication-self-test.php | grep -Fq PUBLICATION_MANUSCRIPT_SELF_TEST=PASS
          php bin/markdown-import-self-test.php | grep -Fq MARKDOWN_IMPORT_SELF_TEST=PASS
          php bin/reader-self-test.php | grep -Fq PUBLISHER_READER_SELF_TEST=PASS
          php bin/reader-ux-self-test.php | grep -Fq READER_UX_SELF_TEST=PASS
          php bin/edition-self-test.php | grep -Fq EDITION_SELF_TEST=PASS
          php bin/living-publishing-self-test.php | grep -Fq LIVING_PUBLISHING_SELF_TEST=PASS
          php bin/operations-self-test.php | grep -Fq OPERATIONS_SELF_TEST=PASS
          php bin/operations-ui-self-test.php | grep -Fq OPERATIONS_UI_SELF_TEST=PASS
          php bin/admin-shell-book-overview-self-test.php | grep -Fq ADMIN_SHELL_BOOK_OVERVIEW_SELF_TEST=PASS
          php bin/admin-shell-unification-self-test.php | grep -Fq ADMIN_SHELL_UNIFICATION_SELF_TEST=PASS
          php bin/whole-site-refoundation-self-test.php | grep -Fq WHOLE_SITE_REFOUNDATION_SELF_TEST=PASS
          php bin/whole-site-ui-redevelopment-self-test.php | grep -Fq WHOLE_SITE_UI_REDEVELOPMENT_SELF_TEST=PASS
          php bin/book-outline-self-test.php | tee /tmp/p06-outline
          grep -Fq CANONICAL_MARKDOWN_NO_OVERWRITE=PASS /tmp/p06-outline
          grep -Fq PROVIDER_OPTIONAL_DEGRADATION=PASS /tmp/p06-outline
          php bin/demo-data-self-test.php | tee /tmp/p06-demo
          grep -Fq DEMO_LONG_FORM_READING=PASS /tmp/p06-demo
          grep -Fq DEMO_DATA_REFRESH=PASS /tmp/p06-demo
          grep -Fq DEMO_DATA_SELF_TEST=PASS /tmp/p06-demo
          php bin/public-asset-self-test.php | grep -Fq PUBLIC_ASSET_HTTP_SELF_TEST=PASS
          php bin/job-self-test.php | grep -Fq JOB_QUEUE_SELF_TEST=PASS
          php bin/update-self-test.php | grep -Fq UPDATE_SELF_TEST=PASS
          php -r '$pdo=new PDO("sqlite:storage/app.db"); if($pdo->query("PRAGMA integrity_check")->fetchColumn()!=="ok") exit(1); if($pdo->query("PRAGMA foreign_key_check")->fetchAll()!==[]) exit(2); if((int)$pdo->query("SELECT MAX(version) FROM schema_migrations")->fetchColumn()!==3) exit(3);'
          echo COMPOSER_VALIDATE=PASS
          echo PHP_SYNTAX=PASS
          echo EXACT_SOURCE_FULL_REGRESSION=PASS
          echo SQLITE_INTEGRITY=PASS
          echo SCHEMA=3_PASS

      - name: Reader and whole-site replacement contract
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'data-reader-theme="light" class="reader-font-18 reader-line-190 reader-width-720"' src/Http/Preview/PublisherReaderPreviewController.php
          grep -Fq 'vf_press_reader_preferences_v3' public/assets/reader.js
          grep -Fq "theme: 'light', font: 18, line: 1.9, width: 720" public/assets/reader.js
          grep -Fq '.reader-owner-main{width:100%;max-width:none' public/assets/reader.css
          grep -Fq 'font-family:var(--reader-ui);line-break:strict' public/assets/reader.css
          ! grep -Fq 'reader-desktop-toc' src/Http/Preview/PublisherReaderPreviewController.php
          ! grep -Fq 'reader-margin' src/Http/Preview/PublisherReaderPreviewController.php
          grep -Fq 'width:224px' public/assets/operations.css
          grep -Fq 'margin-left:224px' public/assets/operations.css
          grep -Fq 'class="ops-panel book-import-panel progressive-panel"' src/Http/Studio/BookController.php
          grep -Fq 'class="ops-panel research-create-panel progressive-panel"' src/Http/Studio/ResearchController.php
          grep -Fq 'vf-press-demo/v2' src/Application/Demo/DemoDataService.php
          grep -Fq '/studio/system/demo/refresh' src/Http/Studio/OperationsController.php
          echo NEUTRAL_READER_DEFAULT=PASS
          echo SINGLE_COLUMN_READER=PASS
          echo CLEAR_CHINESE_READING=PASS
          echo LIBRARY_BOOK_WORKSPACE_SHELL=PASS
          echo PROGRESSIVE_DISCLOSURE=PASS
          echo LONG_FORM_DEMO_V2=PASS
          echo PRODUCTION_WRITE=NOT_EXECUTED

      - name: Product repository cleanliness
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf storage dist storage-restore-*
          test -z "$(git status --short --untracked-files=all)"
          echo PRODUCT_REPOSITORY_CLEAN=PASS
          echo PRIVATE_DATA_PERSISTED=NO
          echo FORMAL_RELEASE=NOT_EXECUTED
          echo PRODUCTION_WRITE=NOT_EXECUTED
