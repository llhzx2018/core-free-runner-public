name: P07 bidirectional engine identity pin proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-bidirectional-pin-proof.yml'
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.repository == 'llhzx2018/core-free-runner-public' && github.head_ref == 'test/p07-bidirectional-pin-proof-20261030' && github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCT_SHA: 307459f37aaae2abefb6f430b2a1b6d8d6348c80
    steps:
      - name: Verify private source read capability
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          test -n "$VF_PRIVATE_READ_TOKEN" || { echo P07_PRIVATE_SOURCE_UNAVAILABLE; exit 78; }
      - name: Checkout pinned product draft head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 307459f37aaae2abefb6f430b2a1b6d8d6348c80
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p07-private
      - name: Exact source guards and affected tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p07-private
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(cat BUILD_ID)" = "0.1.0-release103"
          bash -n bin/vfops-init-ui
          python3 -B -m py_compile lib/server_migration.py lib/server_migration_pull.py
          export PYTHONPATH="$PWD/lib:$PWD"
          for pattern in test_bidirectional_engine_pins.py test_mariadb_owner_policy.py test_server_migration_pull.py; do
            python3 -B -m unittest discover -s tests -p "$pattern" -v
          done
          python3 -B scripts/secret_scan.py --root .
          git diff --exit-code
          echo P07_BIDIRECTIONAL_ENGINE_PIN_SOURCE_PASS
      - name: Remove private checkout
        if: always()
        shell: bash
        run: |
          rm -rf -- p07-private
          echo P07_PRIVATE_SOURCE_CLEANUP_PASS
