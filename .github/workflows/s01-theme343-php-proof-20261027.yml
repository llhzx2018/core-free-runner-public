name: S01 Theme PR343 exact-source PHP verification
on:
  push:
    branches: [task/s01-theme343-php-proof-20261027]
    paths: ['.github/workflows/s01-theme343-php-proof-20261027.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.210
  TARGET_SHA: bb310802ea23039260b2a85ebd9650ba8e261d84
  TARGET_TREE: d5a1c8d93046e91c8ba71cbab4a84b9c5bc84c06
  BASE_SHA: adfe34a08c2ec2a541da3cf5f77248b6a40d1bdf
jobs:
  focused-php:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: control
      - name: Preflight exact-source lane identity
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-theme343-php-proof-20261027/spec.json --input control/.github/workflows/s01-theme343-php-proof-20261027.yml
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: bb310802ea23039260b2a85ebd9650ba8e261d84
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact source and two-file test-only scope
        run: |
          set -euo pipefail
          mkdir -p proof
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse 'HEAD^{tree}')" = "$TARGET_TREE"
          test "$(tr -d '\r\n' < target/VERSION)" = "$TARGET_VERSION"
          git -C target diff --name-only "$BASE_SHA" HEAD | sort > proof/changed-files.txt
          test "$(wc -l < proof/changed-files.txt)" -eq 2
          grep -Fxq 'tests/frontend-pages-wordpress-check.php' proof/changed-files.txt
          grep -Fxq 'tests/frontend-progress-history-projection.php' proof/changed-files.txt
      - name: Lint both PHP tests and run independent synthetic behavior fixture
        run: |
          set -euo pipefail
          php -v | head -n 2
          php -l target/tests/frontend-pages-wordpress-check.php | tee proof/php-lint.txt
          php -l target/tests/frontend-progress-history-projection.php | tee -a proof/php-lint.txt
          php target/tests/frontend-progress-history-projection.php | tee proof/projection.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-theme343-php-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Clean temporary private source checkout
        if: always()
        run: rm -rf target
