name: P01 temporary IA proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-ia-candidate-20261008.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: f0701b8f9be13596de5825d26032f2f3ae3c02d3
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: v2.47.283
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: stable
      - name: Focused checks
        run: |
          set -eu
          php -l src/app/AdminShell.php
          php -l src/health.php
          php tests/unit/admin_ia_v247253_contract.php
          php tests/unit/admin_secondary_nav_focus_contract.php
          php tests/unit/backend_ia_round3_resource_maintenance_v247271_contract.php
          php tests/unit/admin_resource_health_closure_contract.php
          php tests/unit/admin_url_health_page5_polish_contract.php
          echo P01_RESOURCE_IA_FOCUSED=PASS
      - name: Full canonical regression
        run: |
          bash tests/canonical_release_regression.sh . stable --require-zero-debt
          echo P01_RESOURCE_IA_CANONICAL=PASS
      - name: Source lint and security boundary inventory
        run: |
          set -eu
          find src -name '*.php' -type f -print0 | xargs -0 -n1 php -l >/dev/null
          find src -name '*.js' -type f -print0 | xargs -0 -n1 node --check >/dev/null
          php src/cli/verify.php | grep -Fx VERIFY_PASS=YES
          echo P01_RESOURCE_IA_LINT_SEED=PASS
      - name: Isolated install, admin routing and CSRF smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f src/setup.php
          cp -a src /tmp/vf-p01-ia-runtime
          cd /tmp/vf-p01-ia-runtime
          php -S 127.0.0.1:18491 -t . >/tmp/p01-ia-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" >/dev/null 2>&1 || true; rm -rf /tmp/vf-p01-ia-runtime /tmp/vf-p01-ia-*.html /tmp/p01-ia.cookies' EXIT
          for n in $(seq 1 30); do
            if curl -fsS -c /tmp/p01-ia.cookies -b /tmp/p01-ia.cookies http://127.0.0.1:18491/setup.php -o /tmp/vf-p01-ia-setup.html; then break; fi
            sleep 1
          done
          csrf=$(python3 - <<'PY'
          import re
          t=open('/tmp/vf-p01-ia-setup.html',encoding='utf-8').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',t)
          assert m,'setup csrf missing'
          print(m.group(1))
          PY
          )
          curl -fsS -c /tmp/p01-ia.cookies -b /tmp/p01-ia.cookies -X POST http://127.0.0.1:18491/setup.php \
            --data-urlencode "setup_csrf=$csrf" \
            --data-urlencode 'site_title=Isolated P01 IA' \
            --data-urlencode 'admin_password=IsolatedTestOnly2026!' \
            --data-urlencode 'admin_password_confirm=IsolatedTestOnly2026!' -o /tmp/vf-p01-ia-installed.html
          php cli/verify.php | grep -Fx VERIFY_PASS=YES
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18491/health.php)" = 302
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18491/recycle-bin.php)" = 302
          curl -fsS -c /tmp/p01-ia.cookies -b /tmp/p01-ia.cookies \
            -H 'Content-Type: application/json' \
            -d '{"password":"IsolatedTestOnly2026!"}' \
            'http://127.0.0.1:18491/api.php?action=login' | grep -Fq '"ok":true'
          for p in health duplicates icons recycle-bin; do
            curl -fsS -c /tmp/p01-ia.cookies -b /tmp/p01-ia.cookies "http://127.0.0.1:18491/$p.php" -o "/tmp/vf-p01-ia-$p.html"
            ! grep -Fq 'vf-resource-maintenance-tabs' "/tmp/vf-p01-ia-$p.html"
          done
          grep -Fq 'href="recycle-bin.php"' /tmp/vf-p01-ia-health.html
          grep -Fq 'href="duplicates.php"' /tmp/vf-p01-ia-health.html
          grep -Fq 'href="icons.php"' /tmp/vf-p01-ia-health.html
          grep -Fq 'data-start="all"' /tmp/vf-p01-ia-health.html
          test "$(curl -sS -b /tmp/p01-ia.cookies -H 'Content-Type: application/json' -d '{}' -o /dev/null -w '%{http_code}' 'http://127.0.0.1:18491/api.php?action=link_health_job_stop')" = 403
          echo P01_RESOURCE_IA_ISOLATED_HTTP_CSRF=PASS
