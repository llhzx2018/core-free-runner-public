name: P01 temporary IA proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-ia-candidate-20261008.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: f0701b8f9be13596de5825d26032f2f3ae3c02d3
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: v2.47.283
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: stable
      - name: Focused checks
        run: |
          set -eu
          php -l src/app/AdminShell.php
          php -l src/health.php
          php tests/unit/admin_ia_v247253_contract.php
          php tests/unit/admin_secondary_nav_focus_contract.php
          php tests/unit/backend_ia_round3_resource_maintenance_v247271_contract.php
          php tests/unit/admin_resource_health_closure_contract.php
          php tests/unit/admin_url_health_page5_polish_contract.php
          echo P01_RESOURCE_IA_FOCUSED=PASS
      - name: Full canonical regression
        run: |
          bash tests/canonical_release_regression.sh . stable --require-zero-debt
          echo P01_RESOURCE_IA_CANONICAL=PASS
      - name: Source lint and security boundary inventory
        run: |
          set -eu
          find src -name '*.php' -type f -print0 | xargs -0 -n1 php -l >/dev/null
          find src -name '*.js' -type f -print0 | xargs -0 -n1 node --check >/dev/null
          php src/cli/verify.php | grep -Fx VERIFY_PASS=YES
          echo P01_RESOURCE_IA_LINT_SEED=PASS
