name: P01 V2.28 Publication
on:
  push:
    branches: [task/p01-v2280-publication-20260829]
    paths:
      - .github/workflows/p01-v2280-publication-20260829.yml
permissions:
  contents: read
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FORMAL_SOURCE: e010d484c8879737503a02612d0ba8cff1d2fd7d
      FORMAL_TREE: abb37ea592231a0076b96a5222fbd2e3d34a74cf
      PROMOTED_MAIN: 1905719531338d0e52237dfc7f496e5b3eb075ae
      FORMAL_RUN: '33190868178'
      FORMAL_ARTIFACT: p01-v228-formal-artifacts-e010d484c8879737503a02612d0ba8cff1d2fd7d
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: main
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Download exact Formal Artifact contract
        uses: actions/download-artifact@v4
        with:
          name: p01-v228-formal-artifacts-e010d484c8879737503a02612d0ba8cff1d2fd7d
          path: /tmp/formal
          github-token: ${{ github.token }}
          repository: llhzx2018/core-free-runner-public
          run-id: 33190868178
      - name: Publication preflight and byte fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$PROMOTED_MAIN"
          test "$(git -C product rev-parse HEAD^{tree})" = "$FORMAL_TREE"
          test "$(git -C product rev-parse "$FORMAL_SOURCE"^{tree})" = "$FORMAL_TREE"
          test "$(tr -d '\r\n' < product/VERSION)" = '2.28.0'
          test "$(git -C product ls-remote --tags origin refs/tags/v2.28.0 | wc -l)" = 0
          if gh release view v2.28.0 -R llhzx2018/vf-start >/dev/null 2>&1; then echo 'Release v2.28.0 already exists'; exit 1; fi
          test "$(find /tmp/formal -maxdepth 1 -type f | wc -l)" = 8
          test "$(stat -c%s /tmp/formal/VF-Start-V2.28.0-FULL.zip)" = 579671
          test "$(sha256sum /tmp/formal/VF-Start-V2.28.0-FULL.zip | awk '{print $1}')" = a00d72884b69d22affb33c9022829dbf9747849c5befad60d9b39f35609812b1
          test "$(stat -c%s /tmp/formal/VF_Start_V2.28.0_UPDATE.zip)" = 1255387
          test "$(sha256sum /tmp/formal/VF_Start_V2.28.0_UPDATE.zip | awk '{print $1}')" = 7a8f8ad9417edd6305494f1228b7953791b91afd539b31d9bac16490f089581f
          cmp -s /tmp/formal/VF_Start_V2.28.0_UPDATE.zip /tmp/formal/VF-Start-V2.28.0-UPDATE.zip
          unzip -Z1 /tmp/formal/VF_Start_V2.28.0_UPDATE.zip | grep -Fx repair-v2.28.0.php >/dev/null
          php -l /tmp/formal/repair-v2.28.0.php >/dev/null
          jq -e '.release_source=="e010d484c8879737503a02612d0ba8cff1d2fd7d" and .release_tree=="abb37ea592231a0076b96a5222fbd2e3d34a74cf" and .formal_artifact_gate=="PASS" and .actual_upgrade=="PASS" and .rollback=="PASS" and .interruption_recovery=="PASS" and .fresh_install_ui=="PASS"' /tmp/formal/P01-V2.28.0-FORMAL-METADATA.json >/dev/null
          (cd /tmp/formal && sha256sum -c SHA256SUMS.txt)
          echo P01_V228_PUBLICATION_PREFLIGHT=PASS
      - name: Create immutable tag on Formal Release Source
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C product config user.name VictorForge
          git -C product config user.email llhzx2018@gmail.com
          git -C product tag v2.28.0 "$FORMAL_SOURCE"
          git -C product push origin refs/tags/v2.28.0
          test "$(git -C product ls-remote --tags origin refs/tags/v2.28.0 | awk '{print $1}')" = "$FORMAL_SOURCE"
          echo P01_V228_TAG=PASS
      - name: Publish exact proven Release assets
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/release-notes.md <<'EOF'
          P01 · VF Start V2.28.0 formal release.

          本版本完成大收藏量浏览、Add/Detail 连续编辑、Bulk 效率，以及 Channels/Watch 日常工作流优化。

          Release Source: e010d484c8879737503a02612d0ba8cff1d2fd7d
          Formal Artifact Gate: 33190868178 / PASS
          Main Promotion Gate: 33191190948 / PASS
          Schema: 2026082801 / unchanged

          已机器验证 V2.27.0 → V2.28.0 Atomic Update、数据保留、失败自动回滚、硬中断恢复、Fresh Install、浏览器 UI Regression、SQLite/FK 与 Public/Private 隔离。

          Owner Production 不由 CI 自动升级。
          EOF
          gh release create v2.28.0 -R llhzx2018/vf-start --verify-tag --title 'VF Start V2.28.0' --notes-file /tmp/release-notes.md \
            /tmp/formal/P01-V2.28.0-ARTIFACT-GATE.json \
            /tmp/formal/P01-V2.28.0-FORMAL-METADATA.json \
            /tmp/formal/SHA256SUMS.txt \
            /tmp/formal/VF-Start-V2.28.0-FULL.zip \
            /tmp/formal/VF-Start-V2.28.0-UPDATE.zip \
            /tmp/formal/VF_Start_V2.28.0_UPDATE.zip \
            /tmp/formal/atomic-self-test.json \
            /tmp/formal/repair-v2.28.0.php
          R=$(gh api repos/llhzx2018/vf-start/releases/tags/v2.28.0)
          test "$(jq -r .tag_name <<<"$R")" = v2.28.0
          test "$(jq -r .draft <<<"$R")" = false
          test "$(jq -r .prerelease <<<"$R")" = false
          test "$(jq '.assets|length' <<<"$R")" = 8
          echo "P01_V228_RELEASE_ID=$(jq -r .id <<<"$R")"
          echo "P01_V228_RELEASE_PUBLISHED_AT=$(jq -r .published_at <<<"$R")"
          echo P01_V228_GITHUB_RELEASE=PASS
          echo OWNER_PRODUCTION_WRITE=NO
