name: S01-C02 1.21.909 Distribution + Shell Lock Gate

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CORE_UPDATES_REPO: llhzx2018/core-updates
      CORE_UPDATES_SHA: 2c7c2578b4b2ccc8b2959f931155d181e4e754a5
      PRODUCT_REPO: llhzx2018/vf-tools-ops
      PRODUCT_SHA: 50d13a6e2638fb8a3087bcc610ba02ebcb4d0138
      VERSION: 1.21.909
      TAG: v1.21.909
      ASSET: vf-tools-ops_V1.21.909.zip
      ASSET_BYTES: "3480086"
      ASSET_SHA256: f67d261642741392ee712520fddcb60dfbeb2c103c362ab2af88b7b8ea0010cf
      RUNTIME_FILES: "972"
      RUNTIME_FINGERPRINT: aa4e786f832553b1cc916c071496a53106cc0cc7c28cd805675e8fd1dcd3a777

    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: 2c7c2578b4b2ccc8b2959f931155d181e4e754a5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: dist

      - name: Checkout exact Ops source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 50d13a6e2638fb8a3087bcc610ba02ebcb4d0138
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops

      - name: Verify manifest + Update Core
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C dist rev-parse HEAD)" = "$CORE_UPDATES_SHA"
          python3 dist/scripts/check_manifest_contract.py >/tmp/manifest-audit.json
          grep -Fq '"status": "PASS"' /tmp/manifest-audit.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          m=json.loads(Path('dist/projects/S01-C02.json').read_text())
          assert m['target_version']==os.environ['VERSION']
          assert m['release_tag']==os.environ['TAG']
          assert m['asset_name']==os.environ['ASSET']
          assert m['asset_bytes']==int(os.environ['ASSET_BYTES'])
          assert m['asset_sha256']==os.environ['ASSET_SHA256']
          assert m['runtime_files']==int(os.environ['RUNTIME_FILES'])
          assert m['runtime_fingerprint']==os.environ['RUNTIME_FINGERPRINT']
          assert m['runtime_file_count']==int(os.environ['RUNTIME_FILES'])
          assert m['runtime_fingerprint_sha256']==os.environ['RUNTIME_FINGERPRINT']
          assert '1.21.908' in m['from_versions']
          assert m['schema_from']=='6.0.0' and m['schema_to']=='6.0.0'
          print('PASS_MANIFEST')
          PY
          find dist/update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php dist/update-core/php/tests/run.php

      - name: Verify single shell numeric authority
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$PRODUCT_SHA"
          SHELL=ops/assets/css/current/admin-s01-v6-shell-r1.css
          grep -Fq 'min-height: 82px !important' "$SHELL"
          grep -Fq 'font-size: 15px !important' "$SHELL"
          grep -Fq 'font-size: 13px !important' "$SHELL"
          grep -Fq 'min-height: 54px !important' "$SHELL"
          grep -Fq 'width: 42px !important' "$SHELL"

          for f in             ops/assets/css/current/admin-s01-dashboard-r14.css             ops/assets/css/current/admin-s01-tools-r15.css             ops/assets/css/current/admin-s01-content-seo-r16.css             ops/assets/css/current/admin-s01-quality-r17.css             ops/assets/css/current/admin-s01-system-publish-r13.css
          do
            ! grep -Eq '\.vf-v6-domain-nav[[:space:]]*>[[:space:]]*a|\.vf-v6-brand-copy[[:space:]]+strong|\.vf-v6-brand-mark[[:space:]]*\{' "$f"
          done

          grep -Fq 'function vf_ops_s01_v6_dequeue_legacy_visual_assets_v1' ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php
          grep -Fq 'wp_dequeue_style($handle);' ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php
          grep -Fq 'wp_deregister_style($handle);' ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php
          grep -Fq 'vf_ops_s01_v6_dequeue_legacy_visual_assets_v1(vf_ops_admin_request_tab_v121288())' ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php

          echo PASS_SINGLE_SHELL_AUTHORITY

      - name: Verify Formal Release binding
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          JSON="$(gh api "repos/$PRODUCT_REPO/releases/tags/$TAG")"
          test "$(jq -r '.target_commitish' <<<"$JSON")" = "$PRODUCT_SHA"
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.size' <<<"$JSON")" = "$ASSET_BYTES"
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.digest' <<<"$JSON")" = "sha256:$ASSET_SHA256"
          mkdir -p /tmp/release
          gh release download "$TAG" --repo "$PRODUCT_REPO" --pattern "$ASSET" --dir /tmp/release
          test "$(stat -c '%s' "/tmp/release/$ASSET")" = "$ASSET_BYTES"
          test "$(sha256sum "/tmp/release/$ASSET" | awk '{print $1}')" = "$ASSET_SHA256"
          echo PASS_FORMAL_RELEASE_BINDING
