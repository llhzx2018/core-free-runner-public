name: P03 V1.37.3 Seal Exact Candidate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p03-v1373-seal-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  P03_REPOSITORY: llhzx2018/vf-forge
  P03_BRANCH: maintenance/v1.37.3-portfolio-intelligence-bootstrap

jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout private V1.37.3 work branch
        uses: actions/checkout@v4
        with:
          repository: ${{ env.P03_REPOSITORY }}
          ref: ${{ env.P03_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: p03

      - name: Finalize and verify exact candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-zip sqlite3 zip unzip >/dev/null
          cd p03
          python3 scripts/finalize_v1373.py
          test "$(cat VERSION)" = '1.37.3'
          test "$(cat database/schema/SCHEMA_VERSION)" = '30'
          grep -Fq "define('VFAB_VERSION', '1.37.3');" src/app/bootstrap.php
          grep -Fq "TARGET_VERSION='1.37.3'" scripts/build_atomic.py
          grep -Fq "ALLOWED_SOURCES=['1.37.2']" scripts/build_atomic.py
          find src public -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          node --check public/assets/project-intelligence.js
          node --check public/assets/project-intelligence-v1372.js
          node --check public/assets/project-intelligence-v1373.js
          python3 tests/unit/schema_contract_test.py
          python3 tests/unit/project_intelligence_contract_test.py
          python3 tests/unit/project_intelligence_mcp_contract_test.py
          php tests/integration/portfolio_intelligence_bootstrap_test.php
          rm -rf "$RUNNER_TEMP/base-wt" "$RUNNER_TEMP/base-runtime" "$RUNNER_TEMP/target-runtime" "$RUNNER_TEMP/atomic"
          git worktree add --detach "$RUNNER_TEMP/base-wt" v1.37.2 >/dev/null
          python3 "$RUNNER_TEMP/base-wt/scripts/build_runtime.py" "$RUNNER_TEMP/base-runtime" >/dev/null
          python3 scripts/build_runtime.py "$RUNNER_TEMP/target-runtime" >/dev/null
          python3 scripts/build_atomic.py --base-runtime "$RUNNER_TEMP/base-runtime" --target-runtime "$RUNNER_TEMP/target-runtime" --output "$RUNNER_TEMP/atomic" >/dev/null
          cd "$RUNNER_TEMP/atomic"
          sha256sum -c SHA256SUMS.txt
          test "$(unzip -Z1 VF_Forge_V1.37.3_Atomic_Upgrade.zip)" = 'repair-v1.37.3.php'
          unzip -p VF_Forge_V1.37.3_Atomic_Upgrade.zip repair-v1.37.3.php > repair.php
          grep -Fq "const VFF_ATOMIC_TARGET='1.37.3';" repair.php
          grep -Fq 'const VFF_ATOMIC_ALLOWED=["1.37.2"];' repair.php
          grep -Fq 'const VFF_ATOMIC_SCHEMA=30;' repair.php
          SHA=$(sha256sum VF_Forge_V1.37.3_Atomic_Upgrade.zip | awk '{print $1}')
          SRC=$(python3 -c 'import json;print(json.load(open("PACKAGE_MANIFEST.json"))["source_manifest_sha256"])')
          COUNT=$(python3 -c 'import json;print(json.load(open("PACKAGE_MANIFEST.json"))["source_file_count"])')
          echo "P03_V1373_PRESEAL_ATOMIC_SHA=$SHA"
          echo "P03_V1373_PRESEAL_SOURCE_MANIFEST=$SRC"
          echo "P03_V1373_PRESEAL_SOURCE_FILES=$COUNT"
          test "$COUNT" = '55'
          cd "$GITHUB_WORKSPACE/p03"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION CHANGELOG.md src/app/bootstrap.php scripts/build_atomic.py
          if ! git diff --cached --quiet; then
            git commit -m 'release(P03): seal V1.37.3 portfolio intelligence candidate'
            git push origin HEAD:${P03_BRANCH}
          fi
          echo "P03_V1373_EXACT_CANDIDATE=$(git rev-parse HEAD)"
          echo 'P03_V1373_SEAL=PASS'
          echo 'SCHEMA=30'
          echo 'MIGRATION=NONE'
          echo 'PRODUCTION_WRITE=NO'
