name: TEMP S01-C02 Ops 1.21.798 SEO Authority Closure Gate R2

on:
  push:
    branches:
      - temp/s01-c02-v121798-seo-authority-closure-gate-20260903
    paths:
      - '.github/workflows/temp-s01-c02-v121798-seo-authority-closure-gate-r2.yml'

permissions:
  contents: read

jobs:
  seo-authority-closure-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: vf_ops_gate
          MARIADB_USER: vf
          MARIADB_PASSWORD: vf
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      OPS_BASE_SHA: ac7dc58d877473a8124f2478466470d3c59cd018
      OPS_CANDIDATE_SHA: c22d766338245d5dfac49a485129614c85001ee7
      WP_PATH: /tmp/vf-ops-v121798-wp
      EVIDENCE_DIR: /tmp/vf-ops-v121798-evidence-r2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.OPS_BASE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: ops-base
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.OPS_CANDIDATE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: ops-candidate
      - name: Verify exact candidate and bounded source scope
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          test "$(git -C ops-base rev-parse HEAD)" = "$OPS_BASE_SHA"
          test "$(git -C ops-candidate rev-parse HEAD)" = "$OPS_CANDIDATE_SHA"
          test "$(tr -d '\r\n' < ops-base/VERSION)" = 1.21.797
          test "$(tr -d '\r\n' < ops-candidate/VERSION)" = 1.21.798
          for f in contract.php validation.php repository.php audit.php manifest.php scanner.php service.php migration.php; do cmp "ops-base/includes/content-workflow/$f" "ops-candidate/includes/content-workflow/$f"; done
          cmp ops-base/includes/seo-data/keyword-planner-bridge-service.php ops-candidate/includes/seo-data/keyword-planner-bridge-service.php
          cmp ops-base/includes/seo-data/keyword-research-service.php ops-candidate/includes/seo-data/keyword-research-service.php
          cmp ops-base/includes/seo-data/keyword-map-service.php ops-candidate/includes/seo-data/keyword-map-service.php
          cmp ops-base/includes/s01/tool-workbench.php ops-candidate/includes/s01/tool-workbench.php
          cmp ops-base/includes/plugins-governance/inventory-readback-compat-v121794.php ops-candidate/includes/plugins-governance/inventory-readback-compat-v121794.php
          php -l ops-candidate/vf-ops.php
          php -l ops-candidate/includes/seo-data/keyword-authority-closure-service.php
          php ops-candidate/.github/phase3/v121798-seo-authority-closure.php | tee "$EVIDENCE_DIR/standalone.txt"
          grep -Fxq PASS_V121798_SEO_AUTHORITY_CLOSURE "$EVIDENCE_DIR/standalone.txt"
      - name: Install WordPress 7.1 and MariaDB verify
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y php-cli php-mysql php-curl php-zip php-mbstring php-xml php-gd unzip curl jq mariadb-client rsync >/dev/null
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp
          chmod +x /tmp/wp && sudo mv /tmp/wp /usr/local/bin/wp
          mkdir -p "$WP_PATH"
          wp core download --path="$WP_PATH" --version=7.1 --force
          wp config create --path="$WP_PATH" --dbname=vf_ops_gate --dbuser=vf --dbpass=vf --dbhost=127.0.0.1:3306 --skip-check
          wp core install --path="$WP_PATH" --url=http://127.0.0.1:8080 --title='VF Gate' --admin_user=owner --admin_password='gate-only-not-production' --admin_email=owner@example.invalid --skip-email
          test "$(wp core version --path="$WP_PATH")" = 7.1
          mariadb -h127.0.0.1 -P3306 -uvf -pvf -Nse 'SELECT VERSION()' vf_ops_gate | tee "$EVIDENCE_DIR/mariadb.txt"
          grep -q '^11\.4\.' "$EVIDENCE_DIR/mariadb.txt"
      - name: Seed 1.21.797 with one accepted mapped non-primary candidate on known tools family
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$WP_PATH/wp-content/plugins/vf-ops"
          rsync -a --delete --exclude=.git ops-base/ "$WP_PATH/wp-content/plugins/vf-ops/"
          wp plugin activate vf-ops --path="$WP_PATH"
          wp eval --path="$WP_PATH" '
            global $wpdb; $now=current_time("mysql");
            $l=vf_ops_lifecycle_apply_version_v121377("gate-base"); if(empty($l["ok"])) exit(2);
            $post=wp_insert_post(["post_title"=>"Tools Closure Gate","post_content"=>str_repeat("tools closure content ",220),"post_status"=>"publish","post_type"=>"page","post_name"=>"tools"]); if(is_wp_error($post)||$post<1) exit(3);
            update_post_meta($post,"rank_math_title","Tools Closure Gate"); update_post_meta($post,"rank_math_description","Tools closure gate description"); update_post_meta($post,"rank_math_rich_snippet","article");
            $family=vf_ops_seo_table_name_v121439("page_family"); $member=vf_ops_seo_table_name_v121439("page_member"); $assign=vf_ops_seo_table_name_v121439("keyword_assignment");
            $wpdb->insert($family,["family_key"=>"tools","family_name"=>"Tools","family_type"=>"language_specific","core_task"=>"Use tools","family_status"=>"active","owner_id"=>1,"created_at"=>$now,"updated_at"=>$now]); $fid=(int)$wpdb->insert_id; if($fid<1) exit(4);
            $wpdb->insert($member,["family_id"=>$fid,"post_id"=>$post,"language"=>"en","locale"=>"en_US","url"=>home_url("/tools/"),"url_path"=>"/tools/","page_type"=>"page","user_task"=>"Use tools","primary_search_intent"=>"transactional","primary_keyword"=>"","content_status"=>"publish","member_status"=>"active","created_at"=>$now,"updated_at"=>$now]); $mid=(int)$wpdb->insert_id; if($mid<1) exit(5);
            $assignment=wp_generate_uuid4();
            $wpdb->insert($assign,["assignment_id"=>$assignment,"research_job_id"=>0,"keyword"=>"closure gate keyword","normalized_keyword"=>"closure gate keyword","query_language"=>"en","target_language"=>"en","locale"=>"en_US","country"=>"US","source"=>"manual_entry","source_date"=>"2026-09-04","source_reference"=>"runner fixture","cluster_id"=>"tools-closure","page_family_id"=>$fid,"page_member_id"=>$mid,"search_intent"=>"transactional","page_type"=>"page","target_url"=>home_url("/tools/"),"role"=>"long_tail","candidate_status"=>"accepted","confidence"=>"low","owner_id"=>1,"status"=>"active","notes"=>"isolated runner fixture","created_at"=>$now,"updated_at"=>$now]);
            update_option("vf_gate_closure_assignment",$assignment,false);
            $plan=vf_ops_seo_plan_readback(); echo json_encode(["installed"=>$l["state"]["installed_version"]??"","assignment"=>$assignment,"plannerRows"=>count((array)($plan["keywordMap"]??[])),"policyRows"=>count((array)($plan["indexabilityPolicy"]??[]))]);' > "$EVIDENCE_DIR/base.json"
          jq -e '.installed=="1.21.797" and (.assignment|length)>10 and .plannerRows==0 and .policyRows>0' "$EVIDENCE_DIR/base.json" >/dev/null
          wp option get vf_ops_plugins --path="$WP_PATH" --format=json | jq -cS . > "$EVIDENCE_DIR/plugins-before.json"
      - name: Upgrade 1.21.798 and prove no semantic auto-promotion
        shell: bash
        run: |
          set -Eeuo pipefail
          rsync -a --delete --exclude=.git ops-candidate/ "$WP_PATH/wp-content/plugins/vf-ops/"
          wp eval --path="$WP_PATH" '
            $l=vf_ops_lifecycle_apply_version_v121377("gate-upgrade"); if(empty($l["ok"])) exit(6); $state=vf_ops_s01_seo_closure_run_v121798("gate_pre"); $public=vf_ops_s01_seo_closure_public_readback_v121798(); echo json_encode(["installed"=>$l["state"]["installed_version"]??"","previous"=>$l["state"]["previous_version"]??"","state"=>$state,"public"=>$public]);' > "$EVIDENCE_DIR/preconfirm.json"
          jq -e '.installed=="1.21.798" and .previous=="1.21.797" and .state.closureStatus=="OWNER_CONFIRMATION_REQUIRED" and .state.ownerActionRequired==true and .state.ownerCandidateCount==1 and .state.plannerRows==0 and .public.ownerActionRequired==true and .public.plannerRows==0' "$EVIDENCE_DIR/preconfirm.json" >/dev/null
      - name: Confirm exactly one OWNER decision and auto-close Bridge Gate Preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          wp eval --path="$WP_PATH" '
            global $wpdb; $assignment=(string)get_option("vf_gate_closure_assignment",""); $result=vf_ops_s01_seo_closure_confirm_assignment_v121798($assignment); $assign=vf_ops_seo_table_name_v121439("keyword_assignment"); $row=$wpdb->get_row($wpdb->prepare("SELECT assignment_id,role,candidate_status,status,record_sha256 FROM {$assign} WHERE assignment_id=%s LIMIT 1",$assignment),ARRAY_A); $plan=vf_ops_seo_plan_readback(); $gate=vf_ops_seo_gate(); $pre=vf_ops_seo_publish_precheck_v121459("full"); $public=vf_ops_s01_seo_closure_public_readback_v121798(); echo json_encode(["result"=>$result,"row"=>$row,"plannerRows"=>count((array)($plan["keywordMap"]??[])),"revision"=>(int)($plan["revision"]??0),"gateExists"=>!empty($gate),"gateStatus"=>strtoupper((string)($gate["status"]??"")),"gateHash"=>(string)($gate["gateHash"]??""),"preflight"=>$pre,"public"=>$public]); if(empty($result["ok"])) exit(7);' > "$EVIDENCE_DIR/confirmed.json"
          cat "$EVIDENCE_DIR/confirmed.json"
          jq -e '.row.role=="primary" and .row.candidate_status=="accepted" and .row.status=="active" and (.row.record_sha256|length)==64 and .plannerRows==1 and .gateExists==true and (.gateHash|length)==64 and (.preflight.code!="SEO_GATE_NOT_RUN") and (.preflight.code!="SEO_GATE_STALE") and .public.formalPrimaryCount==1 and .public.plannerRows==1 and .public.ownerActionRequired==false and (.public.gateStatus|length)>0' "$EVIDENCE_DIR/confirmed.json" >/dev/null
          jq -c '.public' "$EVIDENCE_DIR/confirmed.json" > "$EVIDENCE_DIR/public-readback.json"
          ! grep -q 'closure gate keyword' "$EVIDENCE_DIR/public-readback.json"
          ! grep -q '/tools/' "$EVIDENCE_DIR/public-readback.json"
          ! grep -q 'vf_gate_closure_assignment' "$EVIDENCE_DIR/public-readback.json"
          wp option get vf_ops_plugins --path="$WP_PATH" --format=json | jq -cS . > "$EVIDENCE_DIR/plugins-after.json"
          cmp "$EVIDENCE_DIR/plugins-before.json" "$EVIDENCE_DIR/plugins-after.json"
      - name: Verify aggregate REST readback and idempotence
        shell: bash
        run: |
          set -Eeuo pipefail
          wp eval --path="$WP_PATH" '
            $before=vf_ops_seo_plan_readback(); $gateBefore=vf_ops_seo_gate(); $again=vf_ops_s01_seo_closure_run_v121798("gate_idempotent"); $after=vf_ops_seo_plan_readback(); $gateAfter=vf_ops_seo_gate(); do_action("rest_api_init"); $request=new WP_REST_Request("GET","/vf-ops/v1/s01-seo-closure"); $response=rest_do_request($request); echo json_encode(["again"=>$again,"beforeRevision"=>(int)($before["revision"]??0),"afterRevision"=>(int)($after["revision"]??0),"gateBefore"=>(string)($gateBefore["gateHash"]??""),"gateAfter"=>(string)($gateAfter["gateHash"]??""),"restStatus"=>$response->get_status(),"rest"=>$response->get_data()]);' > "$EVIDENCE_DIR/idempotent.json"
          jq -e '.beforeRevision==.afterRevision and .gateBefore==.gateAfter and .restStatus==200 and .rest.pluginVersion=="1.21.798" and .rest.plannerRows==1 and .rest.ownerActionRequired==false' "$EVIDENCE_DIR/idempotent.json" >/dev/null
          jq -c '.rest' "$EVIDENCE_DIR/idempotent.json" > "$EVIDENCE_DIR/rest-public.json"
          ! grep -q 'closure gate keyword' "$EVIDENCE_DIR/rest-public.json"
          ! grep -q '/tools/' "$EVIDENCE_DIR/rest-public.json"
      - name: Verify ambiguous candidates remain OWNER-controlled
        shell: bash
        run: |
          set -Eeuo pipefail
          wp eval --path="$WP_PATH" '
            global $wpdb; $assign=vf_ops_seo_table_name_v121439("keyword_assignment"); $now=current_time("mysql"); $first=(string)get_option("vf_gate_closure_assignment",""); $wpdb->update($assign,["role"=>"long_tail","candidate_status"=>"accepted","updated_at"=>$now],["assignment_id"=>$first]); $base=$wpdb->get_row($wpdb->prepare("SELECT * FROM {$assign} WHERE assignment_id=%s LIMIT 1",$first),ARRAY_A); unset($base["id"]); $base["assignment_id"]=wp_generate_uuid4(); $base["keyword"]="second closure candidate"; $base["normalized_keyword"]="second closure candidate"; $base["record_sha256"]=""; $base["created_at"]=$now; $base["updated_at"]=$now; $wpdb->insert($assign,$base); delete_option("vf_ops_keyword_planner_bridge_v1"); $plan=vf_ops_seo_plan_readback(); $plan["keywordMap"]=[]; update_option("vf_ops_seo",$plan,false); $state=vf_ops_s01_seo_closure_run_v121798("gate_ambiguous"); $confirm=vf_ops_s01_seo_closure_confirm_assignment_v121798($first); $primaries=(int)$wpdb->get_var("SELECT COUNT(*) FROM {$assign} WHERE status='active' AND candidate_status IN ('accepted','adjusted') AND role='primary'"); echo json_encode(["state"=>$state,"confirm"=>$confirm,"primaries"=>$primaries]);' > "$EVIDENCE_DIR/ambiguous.json"
          jq -e '.state.closureStatus=="OWNER_SELECTION_REQUIRED" and .state.ownerActionRequired==true and .state.ownerCandidateCount==2 and .confirm.ok==false and .confirm.status=="OWNER_SELECTION_REQUIRED" and .primaries==0' "$EVIDENCE_DIR/ambiguous.json" >/dev/null
          echo PASS_V121798_WORDPRESS_SEO_AUTHORITY_CLOSURE_GATE_R2 | tee "$EVIDENCE_DIR/final.txt"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-v121798-seo-authority-closure-gate-r2
          path: /tmp/vf-ops-v121798-evidence-r2/
          if-no-files-found: warn
          retention-days: 14
