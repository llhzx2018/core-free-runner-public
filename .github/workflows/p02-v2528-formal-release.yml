name: P02 V2.5.28 Formal Release Readback

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v2528-formal-release.yml'
      - 'scripts/p02-v2528-formal-release.sh'
      - 'scripts/p02-v2528-release-readback.sh'

permissions:
  contents: read

jobs:
  remote-readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      PRODUCT_REF: 7861999d99a8de385bdd73f7892477e197c4559c
    steps:
      - name: Require registered release-read capability
        run: |
          set -Eeuo pipefail
          test -n "$RELEASE_TOKEN"
          echo RELEASE_READ_CAPABILITY=PASS

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read back immutable V2.5.28 release
        run: bash scripts/p02-v2528-release-readback.sh

      - name: Protected boundaries
        if: always()
        run: |
          echo RELEASE_CREATE=NO
          echo RELEASE_MUTATION=NO
          echo MAIN_WRITE=NO
          echo CHANNEL_WRITE=NO
          echo PRODUCTION_WRITE=NO
