name: P02 V2.5.28 Formal Release

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v2528-formal-release.yml'
      - 'scripts/p02-v2528-formal-release.sh'

permissions:
  contents: read

jobs:
  verify-publish-readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      PRODUCT_REF: 7861999d99a8de385bdd73f7892477e197c4559c
    steps:
      - name: Require registered release capability
        run: |
          set -Eeuo pipefail
          test -n "$RELEASE_TOKEN"
          echo RELEASE_CAPABILITY=PASS

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.PRODUCT_REF }}
          token: ${{ env.RELEASE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: product

      - name: Install formal release dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php8.3-cli php8.3-sqlite3 php8.3-zip curl jq unzip
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify publish and remote-readback V2.5.28
        run: bash scripts/p02-v2528-formal-release.sh

      - name: Protected boundaries
        if: always()
        run: |
          echo PRIVATE_SOURCE_PERSISTED_AS_PUBLIC_ARTIFACT=NO
          echo MAIN_PROMOTION=PASS_PREEXISTING_EXACT_REF
          echo FORMAL_RELEASE=WRITE_ONLY_AFTER_FULL_VERIFY
          echo CHANNEL_WRITE=NO
          echo PRODUCTION_WRITE=NO
