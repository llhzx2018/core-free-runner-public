name: P05 Global Search Truth Exact Source Gate
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p05-global-search-202a572.yml'
permissions:
  contents: read
jobs:
  p05-global-search-truth:
    if: github.event_name == 'pull_request' && github.head_ref == 'tmp/p05-global-search-202a572-20260831'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: vfseo_test
          POSTGRES_USER: vfseo
          POSTGRES_PASSWORD: vfseo-test-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vfseo -d vfseo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      P05_EXACT_SOURCE: 202a572b0beb612754cb37b17810853651b6b8ae
      P05_BASE_MAIN: b278fb06d73b579e603e501381002fd27fc48adf
      P05_PREVIOUS_MAIN_BYTES: '494476'
      DATABASE_URL: postgresql://vfseo:vfseo-test-password@127.0.0.1:5432/vfseo_test
      VF_MASTER_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NODE_ENV: test
      APP_ENV: test
      VF_DATABASE_PROVIDER: sqlite
      VF_SECURE_COOKIES: 'false'
      VF_REQUIRE_HTTPS: 'false'
      VF_ADMIN_USERNAME: admin
      VF_ADMIN_PASSWORD: php-ci-portable-password-123
    steps:
      - name: Checkout exact private P05 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.P05_EXACT_SOURCE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source and three-file scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_EXACT_SOURCE"
          git cat-file -e "$P05_BASE_MAIN^{commit}"
          git diff --check "$P05_BASE_MAIN" "$P05_EXACT_SOURCE" -- '*.ts' '*.tsx' '*.css' '*.mjs' '*.php' '*.json' '*.yml' '*.yaml'
          git diff --name-only "$P05_BASE_MAIN" "$P05_EXACT_SOURCE" | sort > /tmp/p05-changed.txt
          printf '%s\n' 'src/client/App.tsx' 'src/client/GlobalSearchSurface.tsx' 'tests/unit/global-search-truth.test.ts' | sort > /tmp/p05-expected.txt
          diff -u /tmp/p05-expected.txt /tmp/p05-changed.txt
          grep -F "import('./GlobalSearchSurface')" src/client/App.tsx >/dev/null
          ! grep -F 'api(`/api/search?q=' src/client/App.tsx
          grep -F 'new AbortController()' src/client/GlobalSearchSurface.tsx >/dev/null
          grep -F 'controller.abort();' src/client/GlobalSearchSurface.tsx >/dev/null
          echo 'P05_GLOBAL_SEARCH_EXACT_SOURCE_BINDING=PASS'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: 24, cache: npm }
      - name: Install exact dependencies
        run: npm ci
      - name: Engineering regression
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run lint
          npm run typecheck
          npm run migrate
          npm run verify:schema
          npm run test
          npm run build
          echo 'P05_GLOBAL_SEARCH_ENGINEERING=PASS'
      - name: Verify search truth contracts and bundle reduction
        shell: bash
        run: |
          set -Eeuo pipefail
          node --import tsx --test tests/unit/classic-truth-states.test.ts
          node --import tsx --test tests/unit/global-search-truth.test.ts
          MAIN_RECORD="$(find dist/client/assets -maxdepth 1 -type f -name 'index-*.js' -printf '%s %p\n' | sort -nr | head -n1)"
          test -n "$MAIN_RECORD"
          MAIN_BYTES="${MAIN_RECORD%% *}"
          MAIN_CHUNK="${MAIN_RECORD#* }"
          test "$MAIN_BYTES" -lt 500000
          test "$MAIN_BYTES" -lt "$P05_PREVIOUS_MAIN_BYTES"
          SEARCH_RECORD="$(find dist/client/assets -maxdepth 1 -type f -name 'GlobalSearchSurface-*.js' -printf '%s %p\n' | head -n1)"
          test -n "$SEARCH_RECORD"
          SEARCH_BYTES="${SEARCH_RECORD%% *}"
          SEARCH_CHUNK="${SEARCH_RECORD#* }"
          test "$SEARCH_BYTES" -gt 0
          echo "P05_CLASSIC_MAIN_CHUNK=$(basename "$MAIN_CHUNK")"
          echo "P05_CLASSIC_MAIN_CHUNK_BYTES=$MAIN_BYTES"
          echo "P05_GLOBAL_SEARCH_CHUNK=$(basename "$SEARCH_CHUNK")"
          echo "P05_GLOBAL_SEARCH_CHUNK_BYTES=$SEARCH_BYTES"
          echo 'P05_CLASSIC_TRUTH_STATES_8_OF_8=PASS'
          echo 'P05_GLOBAL_SEARCH_TRUTH_3_OF_3=PASS'
          echo 'P05_GLOBAL_SEARCH_LAZY_SPLIT=PASS'
          echo 'P05_CLASSIC_MAIN_REDUCED_FROM_494476=PASS'
      - name: Formal PHP staging regression
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run build:php-release
          npm run php:release:gate
          echo 'P05_GLOBAL_SEARCH_PHP_RELEASE_STAGING=PASS'
      - name: Source and security gates
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run source:gate
          npm run scope:gate
          npm run dependency:gate
          npm audit --audit-level=high
          npm run security:gate
          echo 'P05_GLOBAL_SEARCH_SOURCE_SECURITY=PASS'
      - name: Seal exact source result
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_EXACT_SOURCE"
          echo 'P05_GLOBAL_SEARCH_EXACT_SOURCE_GATE=PASS'
          echo "P05_EXACT_SOURCE=$P05_EXACT_SOURCE"
          echo 'P05_RELEASE_WRITE=0'
          echo 'P05_PRODUCTION_WRITE=0'
