name: P01 temporary Distribution exact-source proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-dist-manifest-proof-20261008.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: c941c65b332ec00087e36497da7da0c9228c7666
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,curl,zip,openssl
          coverage: none
      - name: Canonical distribution validation
        run: |
          set -Eeuo pipefail
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php update-core/php/tests/run.php
          python3 - <<'PY'
          import json
          p=json.load(open('projects/P01.json'))
          assert p['current_version']=='2.47.283'
          assert p['target_version']=='2.47.284'
          assert p['from_versions']==['2.47.283']
          assert p['product_identity']=='0017079f24996c1575a6fd3146199e836e8ee2d0'
          assert p['asset_sha256']=='c889902c14999d128ccf39b100dcb3df26bcc4d2f54a5e446fd8285e22bf9806'
          assert p['asset_bytes']==2362925
          assert p['schema_from']==p['schema_to']=='2026090401'
          print('P01_DISTRIBUTION_IDENTITY=PASS')
          PY
          echo P01_DISTRIBUTION_CANONICAL=PASS
