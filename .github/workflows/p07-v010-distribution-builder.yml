name: P07 V0.1.0 Distribution Builder

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-v010-distribution-builder.yml'

permissions:
  contents: write

jobs:
  build-distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout public release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/p07-v0.1.0-public
          persist-credentials: true
          fetch-depth: 0

      - name: Verify private-read capability
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN"

      - name: Checkout exact released P07 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 2aa67c64a317ea9d66371eed3bda9027e476eae5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Verify exact source + secret boundary
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = "2aa67c64a317ea9d66371eed3bda9027e476eae5"
          (cd source && python3 scripts/secret_scan.py --root .)
          echo "P07_DISTRIBUTION_SOURCE=PASS"

      - name: Build allowlisted runtime overlay
        run: |
          set -Eeuo pipefail
          rm -rf dist/p07/0.1.0
          mkdir -p dist/p07/0.1.0/overlay

          files=(
            bin/vfops
            bin/vfops-migrate-ui
            bin/vfops-user
            lib/app_config.py
            lib/backup_frontend.py
            lib/migrate.py
            lib/restore.py
            lib/restore_apply_core.py
            lib/restore_new.py
            lib/runtime.py
            lib/server_migration.py
            lib/transport.py
            lib/verify.py
            tests/test_app_config.py
            tests/test_auto_backup.py
            tests/test_google_device_oauth.py
            tests/test_menu3_modular.py
            tests/test_migrate_new.py
            tests/test_restore_new.py
            tests/test_runtime.py
            tests/test_server_migration.py
            tests/test_transport.py
            tests/test_verify.py
          )

          for rel in "${files[@]}"; do
            mkdir -p "dist/p07/0.1.0/overlay/$(dirname "$rel")"
            cp "source/$rel" "dist/p07/0.1.0/overlay/$rel"
          done

          cat > dist/p07/0.1.0/overlay/RELEASE_ID <<'EOF'
P07_V0.1.0_FINAL_INTEGRATION
SOURCE_MAIN=2aa67c64a317ea9d66371eed3bda9027e476eae5
EOF

          (
            cd dist/p07/0.1.0/overlay
            find . -type f ! -name MANIFEST.sha256 -print0 |
              sort -z |
              xargs -0 sha256sum |
              sed 's#  \./#  #' > MANIFEST.sha256
          )

          sha256sum dist/p07/0.1.0/overlay/MANIFEST.sha256 > dist/p07/0.1.0/MANIFEST.sha256.sum

          python3 -m py_compile             dist/p07/0.1.0/overlay/lib/app_config.py             dist/p07/0.1.0/overlay/lib/backup_frontend.py             dist/p07/0.1.0/overlay/lib/migrate.py             dist/p07/0.1.0/overlay/lib/restore.py             dist/p07/0.1.0/overlay/lib/restore_apply_core.py             dist/p07/0.1.0/overlay/lib/restore_new.py             dist/p07/0.1.0/overlay/lib/runtime.py             dist/p07/0.1.0/overlay/lib/server_migration.py             dist/p07/0.1.0/overlay/lib/transport.py             dist/p07/0.1.0/overlay/lib/verify.py
          bash -n dist/p07/0.1.0/overlay/bin/vfops
          bash -n dist/p07/0.1.0/overlay/bin/vfops-migrate-ui
          bash -n dist/p07/0.1.0/overlay/bin/vfops-user

          echo "P07_DISTRIBUTION_OVERLAY=PASS"

      - name: Commit generated public distribution
        run: |
          set -Eeuo pipefail
          rm -rf source
          git config user.name "P07 Release Builder"
          git config user.email "actions@users.noreply.github.com"
          git add dist/p07/0.1.0
          if git diff --cached --quiet; then
            echo "P07_DISTRIBUTION_COMMIT=NO_CHANGE"
            exit 0
          fi
          git commit -m "dist(p07): build V0.1.0 final integration overlay"
          git push origin HEAD:release/p07-v0.1.0-public
          echo "P07_DISTRIBUTION_COMMIT=PASS"
