name: P01 2.47.517 private media restoration focused exact-source proof
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  p01-media-native:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'test/p01-247517-media-recovery-20261119'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Verify fixed Runner and private test-only capability
        env:
          P01_PRIVATE_READ: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test -n "$P01_PRIVATE_READ"
          echo P01_MEDIA_RUNNER_SCOPE=EXACT_PRIVATE_SOURCE_SYNTHETIC_TEST_ONLY
      - name: Checkout exact P01 HEAD only, with nonpersistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: a1cabd7424ced3f0d980b0fb8cff72c762007c5c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - name: Verify native PHP and exact source identity
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "a1cabd7424ced3f0d980b0fb8cff72c762007c5c"
          test "$(cat candidate/VERSION)" = "2.47.517"
          test "$(cat candidate/src/VERSION.txt)" = "2.47.517"
          php -m | grep -Fx PDO
          php -m | grep -Fx pdo_sqlite
          php -m | grep -Fx zip
          php -l candidate/src/app/next/runtime/OwnerLegacyMediaArchive.php
          php -l candidate/src/app/next/runtime/OwnerSqliteUpload.php
          php -l candidate/src/app/next/http/OwnerSqliteRecoveryRoutes.php
          php -l candidate/tests/integration/owner_legacy_media_archive.php
          echo P01_V517_MEDIA_PHP_EXACT_SOURCE_SYNTAX=PASS
      - name: Verify real PHP SQLite ZIP file staging and hostile negatives
        run: |
          set -Eeuo pipefail
          cd candidate
          php tests/integration/owner_sqlite_chunk_transfer.php
          php tests/integration/owner_legacy_media_archive.php
          php tests/unit/p01_d25_private_media_contract.php
          echo P01_V517_MEDIA_NATIVE_SQLITE_ZIP_RESTORE=PASS
      - name: Verify exact Vue restore flow, TS and self-contained assets
        run: |
          set -Eeuo pipefail
          cd candidate/src/app/next/frontend
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
          echo P01_V517_MEDIA_VUE_TYPECHECK_BUILD=PASS
      - name: Private source and synthetic ZIP cleanup
        if: always()
        run: |
          rm -rf -- candidate
          echo P01_V517_MEDIA_PRIVATE_SOURCE_PERSISTED=NO
          echo P01_V517_MEDIA_PUBLIC_ARTIFACTS=NONE
