name: P06 VF Press Studio Auth Dispatcher

on:
  push:
    branches: [main]
    paths:
      - 'requests/p06-vfpress-studio-auth-dispatch-*.txt'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch Studio auth diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run p06-vfpress-rc1-studio-auth-diagnostic.yml --repo llhzx2018/core-free-runner-public --ref main
