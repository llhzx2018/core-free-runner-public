name: P04 VF Infra V2.5.8 Browser Debug

on:
  push:
    paths:
      - '.github/workflows/p04-v258-browser-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REPOSITORY: llhzx2018/vf-infra
  TARGET_COMMIT: 2852718062de33659057bbdf0bff55e627b2b172

jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_COMMIT }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-vf-infra
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, fileinfo, sodium, zip, curl, mbstring
          coverage: none
      - name: Install Browser
        shell: bash
        working-directory: private-vf-infra
        run: |
          set -Eeuo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Expand local-only billing failure text
        shell: bash
        working-directory: private-vf-infra
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/e2e/v258-personal-console.mjs')
          s=p.read_text(encoding='utf-8')
          old="assert(bill.includes('费用与续费')&&bill.includes('即将续费'),'finance renewal priority missing');"
          new="assert(bill.includes('费用与续费')&&bill.includes('即将续费'),`finance renewal priority missing :: ${bill.slice(0,1200)}`);"
          if old not in s: raise SystemExit('DEBUG_ANCHOR_MISSING')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          node --check tests/e2e/v258-personal-console.mjs
      - name: Run browser reproduction only
        shell: bash
        working-directory: private-vf-infra
        run: |
          set -Eeuo pipefail
          bash scripts/run-v258-browser-gate.sh
      - name: Cleanup private source
        if: always()
        shell: bash
        run: rm -rf private-vf-infra
