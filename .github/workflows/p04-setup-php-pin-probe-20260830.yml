name: P04 setup-php Full SHA Probe

on:
  push:
    branches:
      - candidate/p04-server-daily-ux-gate-20260830
    paths:
      - '.github/workflows/p04-setup-php-pin-probe-20260830.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Setup PHP from full immutable 2.37.2 SHA
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, sodium, zip, mbstring, fileinfo
          coverage: none
      - name: Prove PHP runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          php -v
          php -r 'exit(PHP_MAJOR_VERSION===8 && PHP_MINOR_VERSION===4 ? 0 : 1);'
          echo P04_SETUP_PHP_FULL_SHA=PASS
