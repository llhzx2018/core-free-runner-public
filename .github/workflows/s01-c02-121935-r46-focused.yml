name: S01-C02 1.21.935 R46 Focused Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/s01-c02-121935-r46-focused.yml'

permissions:
  contents: read

jobs:
  focused-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_REPOSITORY: llhzx2018/vf-tools-ops
      TARGET_SHA: 2362f61e2bbfa1f03b96a2489b48a4d3f4ffa5d7
      EXPECTED_VERSION: 1.21.935
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target

      - name: Verify exact identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n' < target/VERSION)" = "$EXPECTED_VERSION"
          grep -Fq "S01-PRODUCT-SURFACE-CONSOLIDATION-R46" target/vf-ops.php
          echo "CANDIDATE_IDENTITY=PASS"

      - name: PHP syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l target/vf-ops.php
          php -l target/includes/admin-v13/route-contract.php
          php -l target/includes/s01/admin-shell-domain-contract.php
          php -l target/includes/s01/tool-workbench.php
          php -l target/tests/s01-c02-121932-navigation-role-r43-contract.php
          php -l target/tests/s01-c02-121934-shell-header-visual-lock-r45-contract.php
          php -l target/tests/s01-c02-121935-product-surface-r46-contract.php
          echo "PHP_SYNTAX=PASS"

      - name: Product lineage contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          php target/tests/s01-c02-121932-navigation-role-r43-contract.php
          php target/tests/s01-c02-121933-navigation-flyout-r44-contract.php
          php target/tests/s01-c02-121934-shell-header-visual-lock-r45-contract.php
          php target/tests/s01-c02-121935-product-surface-r46-contract.php
          echo "R43_R46_LINEAGE=PASS"

      - name: No legacy M3U8 daily link
        shell: bash
        run: |
          set -Eeuo pipefail
          ! grep -Fq "page'=>'vf-tool-m3u8-tools'" target/includes/s01/tool-workbench.php
          grep -Fq "vf-tool-m3u8-runtime-v6" target/includes/s01/tool-workbench.php
          grep -Fq "vf-tool-m3u8-provider-backup" target/includes/s01/tool-workbench.php
          echo "M3U8_CANONICAL_DRILLDOWN=PASS"

      - name: Upload sanitized evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-121935-r46-focused-${{ github.run_id }}
          path: target/VERSION
          retention-days: 7
