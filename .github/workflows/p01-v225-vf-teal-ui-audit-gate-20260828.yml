name: P01 V2.25 VF Teal Whole-site UX UI Audit
on:
  push:
    branches: [task/p01-v222-multi-surface-gate-20260828]
    paths: ['.github/workflows/p01-v225-vf-teal-ui-audit-gate-20260828.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      EXACT_SOURCE: 9fd2f28ca62def392f56ed248387298bc71a2764
      SOURCE_BRANCH: feature/p01-v2.25.0-vf-teal-rebaseline-20260828
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.EXACT_SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: p01
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - name: Exact source, syntax, and visual authority contract
        env:
          READ_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p01
          test "$(git rev-parse HEAD)" = "$EXACT_SOURCE"
          test "$(git ls-remote "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "refs/heads/${SOURCE_BRANCH}" | awk '{print $1}')" = "$EXACT_SOURCE"
          find src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          test -f src/assets/surface-vf-theme.css
          grep -F -- '--vfui-sidebar:#fff' src/assets/surface-vf-theme.css >/dev/null
          grep -F -- '--vfui-teal:#0f766e' src/assets/surface-vf-theme.css >/dev/null
          grep -F 'surface-vf-theme.css' src/app/SurfaceShell.php >/dev/null
          ! grep -F 'PERSONAL INTERNET HOME' src/surfaces.php
          ! grep -F 'WEB START' src/start.php
          ! grep -F 'CONTENT MEMORY' src/surface.php
          ! grep -F 'RESOURCE INBOX' src/surface-manager.php
          echo P01_V225_SOURCE_AND_VF_THEME=PASS
      - name: Fresh runtime seed and regression
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-v225-ui /tmp/p01-v225-ui.cookies
          cp -a p01/src /tmp/p01-v225-ui
          cd /tmp/p01-v225-ui
          php -S 127.0.0.1:18250 -t . >/tmp/p01-v225-ui-server.log 2>&1 & echo $! >/tmp/p01-v225-ui.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18250/setup.php -o /tmp/p01-v225-ui-setup.html && break; sleep 1; done
          curl -fsS -c /tmp/p01-v225-ui.cookies -b /tmp/p01-v225-ui.cookies http://127.0.0.1:18250/setup.php -o /tmp/p01-v225-ui-setup.html
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-v225-ui-setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -sS -c /tmp/p01-v225-ui.cookies -b /tmp/p01-v225-ui.cookies -X POST http://127.0.0.1:18250/setup.php --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=VF Start UI Audit' --data-urlencode 'admin_password=P01V225!TealAudit' --data-urlencode 'admin_password_confirm=P01V225!TealAudit' -o /tmp/p01-v225-ui-setup-post.html
          curl -fsS -c /tmp/p01-v225-ui.cookies -b /tmp/p01-v225-ui.cookies -H 'Content-Type: application/json' -X POST 'http://127.0.0.1:18250/api.php?action=login' --data '{"password":"P01V225!TealAudit"}' -o /tmp/p01-v225-ui-login.json
          jq -e '.ok==true' /tmp/p01-v225-ui-login.json >/dev/null
          cat >/tmp/p01-v225-ui-seed.php <<'PHP'
          <?php
          require '/tmp/p01-v225-ui/app/bootstrap.php';
          require_once '/tmp/p01-v225-ui/app/SurfaceRepository.php';
          $r=new VfRepository(vf_db()); $s=new VfSurfaceRepository(vf_db());
          $work=$r->createCategory(['name'=>'桌面与文件','description'=>'','is_private'=>false]);
          $infra=$r->createCategory(['name'=>'服务器、域名与运维','description'=>'','is_private'=>false]);
          $media=$r->createCategory(['name'=>'影视与片源','description'=>'','is_private'=>true]);
          foreach([
            [$work,'Cloudflare Dashboard','https://dash.cloudflare.com/','基础设施控制台',18,1],
            [$work,'GitHub','https://github.com/','代码与项目',12,1],
            [$work,'OpenAI','https://openai.com/','AI 工具',8,0],
            [$infra,'DigitalOcean','https://www.digitalocean.com/','云服务器',6,0],
            [$infra,'Vultr','https://www.vultr.com/','云服务器',5,0],
            [$infra,'Linode','https://www.linode.com/','云服务器',4,0],
          ] as $x){$r->saveLink(null,['category_id'=>$x[0],'title'=>$x[1],'url'=>$x[2],'description'=>$x[3],'click_count'=>$x[4],'is_favorite'=>$x[5]],'import');}
          foreach([
            ['硅谷101','https://www.youtube.com/@TheValley101','科技与商业故事','科技,商业'],
            ['42章经','https://www.youtube.com/@42zhangjing','创业与投资访谈','创业,访谈'],
            ['蜉蝣天地 Meanders','https://www.youtube.com/@meanders','人物与社会长谈','访谈,社会'],
          ] as $x){$z=$r->saveLink(null,['category_id'=>$media,'title'=>$x[0],'url'=>$x[1],'description'=>$x[2],'tags'=>$x[3],'is_private'=>true],'manual');$s->upsertProfile((int)$z['id'],['surface'=>'channels','resource_kind'=>'youtube','note'=>'适合工作时听','background_friendly'=>true]);}
          foreach([
            ['流浪地球 2','https://example.com/watch/wandering-earth-2','科幻电影','2023'],
            ['宇宙探索编辑部','https://example.com/watch/journey-to-west','剧情电影','2023'],
            ['信条','https://example.com/watch/tenet','科幻动作','2020'],
          ] as $x){$z=$r->saveLink(null,['category_id'=>$media,'title'=>$x[0],'url'=>$x[1],'description'=>$x[2],'is_private'=>true],'manual');$s->upsertProfile((int)$z['id'],['surface'=>'watch','resource_kind'=>'movie','media_year'=>$x[3],'media_status'=>'want']);}
          $r->saveLink(null,['category_id'=>$media,'title'=>'未整理 YouTube 频道','url'=>'https://www.youtube.com/@unclassified-example','description'=>'等待归入 Channels','is_private'=>true],'manual');
          echo "P01_V225_UI_SEED=PASS\n";
          PHP
          php /tmp/p01-v225-ui-seed.php
          php cli/verify.php | grep -Fx 'VERIFY_PASS=YES'
          php cli/surface-verify.php | grep -Fx 'MULTI_SURFACE_PASS=YES'
          php cli/baseline-verify.php | tee /tmp/p01-v225-ui-baseline.txt
          grep -Fx 'BASELINE_CORE_PASS=YES' /tmp/p01-v225-ui-baseline.txt
          grep -Fx 'DRIFT_COUNT=0' /tmp/p01-v225-ui-baseline.txt
          grep -Fx 'UNKNOWN_COUNT=0' /tmp/p01-v225-ui-baseline.txt
          echo P01_V225_UI_RUNTIME=PASS
      - name: Authenticated whole-site UX contract and screenshots
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/p01-v225-ui
          for spec in 'home:surfaces.php' 'start:start.php' 'channels:channels.php' 'watch:watch.php' 'organizer:surface-manager.php'; do
            name=${spec%%:*}; url=${spec#*:}
            curl -fsS -c /tmp/p01-v225-ui.cookies -b /tmp/p01-v225-ui.cookies "http://127.0.0.1:18250/$url" -o "audit-$name.html"
            grep -F 'surface-vf-theme.css' "audit-$name.html" >/dev/null
            grep -F 'vf-app-sidebar' "audit-$name.html" >/dev/null
            grep -F 'vf-app-topbar' "audit-$name.html" >/dev/null
          done
          grep -F '个人互联网首页' audit-home.html >/dev/null
          grep -F '网站导航' audit-start.html >/dev/null
          grep -F '频道记忆' audit-channels.html >/dev/null
          grep -F '私人片单' audit-watch.html >/dev/null
          grep -F '资源收件箱' audit-organizer.html >/dev/null
          BROWSER=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$BROWSER"
          mkdir -p /tmp/p01-v225-ui-shots
          for name in home start channels watch organizer; do
            "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars --window-size=1440,1000 --screenshot="/tmp/p01-v225-ui-shots/${name}-desktop.png" "http://127.0.0.1:18250/audit-${name}.html"
          done
          "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars --window-size=390,844 --screenshot=/tmp/p01-v225-ui-shots/home-mobile.png http://127.0.0.1:18250/audit-home.html
          "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars --window-size=390,844 --screenshot=/tmp/p01-v225-ui-shots/start-mobile.png http://127.0.0.1:18250/audit-start.html
          test "$(find /tmp/p01-v225-ui-shots -type f -name '*.png' -size +10k | wc -l)" -eq 7
          printf 'EXACT_SOURCE=%s\nDESKTOP=1440x1000\nMOBILE=390x844\nVF_THEME=LIGHT_TEAL_DEFAULT\n' "$EXACT_SOURCE" >/tmp/p01-v225-ui-shots/MANIFEST.txt
          echo P01_V225_UI_SCREENSHOT_GATE=PASS
      - name: Final database integrity
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/p01-v225-ui
          test "$(php -r "require 'app/bootstrap.php'; echo strtolower((string)vf_db()->query('PRAGMA integrity_check')->fetchColumn());")" = ok
          test "$(php -r "require 'app/bootstrap.php'; echo count(vf_db()->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC));")" = 0
          kill "$(cat /tmp/p01-v225-ui.pid)" 2>/dev/null || true
          echo P01_V225_UI_DATABASE=PASS
      - uses: actions/upload-artifact@v4
        with:
          name: p01-v225-vf-teal-ui-audit-${{ env.EXACT_SOURCE }}
          path: /tmp/p01-v225-ui-shots
          if-no-files-found: error
          retention-days: 7
      - name: Verdict
        run: |
          echo P01_V225_VF_TEAL_UI_EXACT_SOURCE="$EXACT_SOURCE"
          echo P01_V225_VF_TEAL_UI_MACHINE=PASS
          echo RELEASE=NO
          echo PRODUCTION=NO
