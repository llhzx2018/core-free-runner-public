name: P01 V2.33 Strict Fresh Install Fence
on:
  push:
    branches: [task/p01-v2330-formal-release-20260830]
    paths:
      - .github/workflows/p01-v2330-strict-fresh-install-fence-20260830.yml
      - scripts/p01-v2330-formal-fresh-fence.sh
permissions:
  contents: read
jobs:
  fresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout gate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: runner
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - name: Checkout exact V2.33 formal source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: 8c819c8bfd055d16b3ac367cef15f723431d9a42
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: candidate
      - name: Strict fresh install verification
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-v2330-formal-evidence
          test "$(git -C candidate rev-parse HEAD)" = 8c819c8bfd055d16b3ac367cef15f723431d9a42
          test "$(git -C candidate rev-parse HEAD^{tree})" = db5a6e2b6a852e6925727b974fb7130359e3cdf8
          test "$(git -C candidate rev-parse HEAD:src)" = febc1b01a5b59963bc974cdc6455cfa824c0adc3
          bash runner/scripts/p01-v2330-formal-fresh-fence.sh
          grep -Fx P01_V2330_STRICT_FRESH_INSTALL=PASS /tmp/p01-v2330-formal-evidence/strict-fresh-verdict.txt >/dev/null
          echo P01_V2330_STRICT_FRESH_INSTALL_FENCE=PASS
          echo FORMAL_SOURCE=8c819c8bfd055d16b3ac367cef15f723431d9a42
          echo RUNTIME_TREE=febc1b01a5b59963bc974cdc6455cfa824c0adc3
          echo SCHEMA=2026082901
          echo PRODUCT_BYTES_CHANGED=NO
          echo OWNER_PRODUCTION_WRITE=NO
      - name: Upload strict fresh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-v2330-strict-fresh-install-${{ github.run_id }}
          path: /tmp/p01-v2330-formal-evidence
          if-no-files-found: warn
          retention-days: 30
