name: P02 v2.5.133 three-engine legacy foundations + CLI wake exact native proof
on:
  push:
    branches: [p02-25133-formal-preflight-20261120]
    paths: [.github/workflows/p02-25133-formal-preflight.yml]
permissions:
  contents: read
concurrency:
  group: p02-25133-sql-recovery-exact
  cancel-in-progress: false
jobs:
  p02-sql-runtime-recovery:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.ref == 'refs/heads/p02-25133-formal-preflight-20261120'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: p02_w3_disposable_only
          MYSQL_ROOT_HOST: '%'
        ports: [33306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=25
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: p02_w3_disposable_only
          MARIADB_ROOT_HOST: '%'
        ports: [33307:3306]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=25
    steps:
      - name: Check existing private source read credential without disclosure
        shell: bash
        env:
          READ_CAPABILITY: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_CAPABILITY" || { echo 'P02_READ_CAPABILITY=MISSING'; exit 61; }
          echo 'P02_READ_CAPABILITY=PRESENT'
      - name: Ephemeral checkout exact product and disable source persistence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 4869940b52466be8d6531cb0e8943bcf91131643
          path: p02-source
          fetch-depth: 0
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Install pinned native PHP Composer and compiled Vue dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          cd p02-source
          test "$(git rev-parse HEAD)" = "4869940b52466be8d6531cb0e8943bcf91131643"
          test "$(cat VERSION)" = "2.5.133"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php-cli php-cgi php-sqlite3 php-mysql php-mbstring php-xml php-curl php-zip composer python3-venv sqlite3 >/tmp/p02-native-deps.txt 2>&1
          php -r 'exit(PHP_VERSION_ID>=80300&&extension_loaded("pdo_sqlite")&&extension_loaded("pdo_mysql")&&extension_loaded("zip")?0:1);'
          composer --working-dir=modern/laravel install --no-dev --no-scripts --no-plugins --prefer-dist --no-interaction --no-progress >/tmp/p02-native-composer.txt 2>&1
          npm ci --prefix modern/inertia-page --no-audit --no-fund >/tmp/p02-native-npm.txt 2>&1
          npm run build --prefix modern/inertia-page >/tmp/p02-native-vue.txt 2>&1
          php -l modern/laravel/w3-install-preview-router.php >/dev/null
          python3 -B scripts/p02_w3_source_gate.py >/tmp/p02-sql-source-gate.txt 2>&1
          echo "P02_SQL_NATIVE_RUNTIME_LOCKED=PASS"
      - name: Native MySQL 8.4 and MariaDB 11.8 real FULL installed CLI job
        shell: bash
        env:
          P02_W3_SYNTHETIC_ONLY: '1'
          P02_W3_USER: root
          P02_W3_PASS: p02_w3_disposable_only
        run: |
          set -Eeuo pipefail
          umask 077
          cd p02-source
          test "$(git rev-parse HEAD)" = "4869940b52466be8d6531cb0e8943bcf91131643"
          php -l modern/laravel/P02W3InstalledJobWorker.php >/dev/null
          php -l modern/laravel/bootstrap/worker.php >/dev/null
          python3 -B -m py_compile tests/integration/p02_w3_installed_worker_sql_full.py
          for engine in mysql mariadb; do
            if P02_W3_ENGINE="$engine" python3 -B tests/integration/p02_w3_installed_worker_sql_full.py "$engine" >"/tmp/p02-native-worker-$engine.txt" 2>&1; then
              grep -Fqx "P02_W3_INSTALLED_FULL_${engine^^}_CLI_JOB=PASS" "/tmp/p02-native-worker-$engine.txt"
              grep -Fqx 'P02_W3_NATIVE_SQL_SCHEDULER_NOT_AUTOSTARTED=PASS' "/tmp/p02-native-worker-$engine.txt"
              grep -Fqx "P02_W3_NATIVE_${engine^^}_LEGACY_FOUNDATION_AND_CRON=PASS" "/tmp/p02-native-worker-$engine.txt"
              echo "P02_NATIVE_${engine^^}_INSTALLED_WORKER=PASS"
            else
              grep -E '^P02_W3_SQL_CLI_WORKER_STAGE=[A-Za-z_]{1,90}$' "/tmp/p02-native-worker-$engine.txt" || true
              echo "P02_NATIVE_${engine^^}_INSTALLED_WORKER=FAIL"
              exit 91
            fi
          done
      - name: Delete temporary private source and diagnostics
        if: always()
        shell: bash
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/p02-source"
          rm -f -- /tmp/p02-sql-source-gate.txt
          rm -f -- /tmp/p02-native-deps.txt /tmp/p02-native-composer.txt /tmp/p02-native-npm.txt /tmp/p02-native-vue.txt /tmp/p02-mysql-atomic.txt /tmp/p02-mysql-recovery.txt /tmp/p02-mariadb-atomic.txt /tmp/p02-mariadb-recovery.txt
          rm -f -- /tmp/p02-native-worker-mysql.txt /tmp/p02-native-worker-mariadb.txt
          echo "P02_PRIVATE_SOURCE_WORKSPACE_CLEANUP=PASS"
