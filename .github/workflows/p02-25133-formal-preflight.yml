name: P02 v2.5.133 exact-source attachment and SQL focused gate
on:
  push:
    branches: [p02-25133-formal-preflight-20261120]
    paths: [.github/workflows/p02-25133-formal-preflight.yml]
permissions:
  contents: read
concurrency:
  group: p02-25133-attachment-native
  cancel-in-progress: false
jobs:
  p02-bounded-machine-proof:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.ref == 'refs/heads/p02-25133-formal-preflight-20261120'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: p02_w3_disposable_only
          MYSQL_ROOT_HOST: '%'
        ports: [33306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=25
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: p02_w3_disposable_only
          MARIADB_ROOT_HOST: '%'
        ports: [33307:3306]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=25
    steps:
      - name: Verify registered private read capability without printing credential
        shell: bash
        env:
          READ_CAPABILITY: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_CAPABILITY" || { echo "P02_CAPABILITY=MISSING"; exit 61; }
          echo "P02_CAPABILITY=PRESENT"
      - name: Fetch current GOV source in disposable directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          path: gov-doc-policy
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Fetch exact private P02 candidate in disposable directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 7dfebb57a674ea1363d30e9424f9c013e76f0c0a
          path: p02-source
          fetch-depth: 0
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Native dependencies and exact source identity
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          cd p02-source
          test "$(git rev-parse HEAD)" = "7dfebb57a674ea1363d30e9424f9c013e76f0c0a"
          test "$(cat VERSION)" = "2.5.133"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php-cli php-sqlite3 php-mysql php-mbstring php-xml php-curl php-zip composer sqlite3 >/tmp/p02-probe-apt.txt 2>&1
          php -r 'exit(PHP_VERSION_ID>=80300 && extension_loaded("pdo_sqlite") && extension_loaded("pdo_mysql") && extension_loaded("zip")?0:1);'
          composer --working-dir=modern/laravel install --no-dev --no-scripts --no-plugins --prefer-dist --no-interaction --no-progress >/tmp/p02-probe-composer.txt 2>&1
          npm ci --prefix modern/inertia-page --no-audit --no-fund >/tmp/p02-probe-npm.txt 2>&1
          npm run build --prefix modern/inertia-page >/tmp/p02-probe-vue.txt 2>&1
          echo "P02_EXACT_CANDIDATE_RUNTIME_AND_COMPOSER=PASS"
      - name: Git architecture naming and focused source checks
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p02-source
          test -f ../gov-doc-policy/governance/agent/code_architecture_lint.py
          BASE="$(git merge-base HEAD origin/main)"
          if ! python3 -B -m unittest discover -s .github/checks -p test_architecture_gate.py >/tmp/p02-probe-architecture-units.txt 2>&1; then
            echo "P02_CHECK_FAILURE=ARCHITECTURE_UNITS"
            grep -E '^(FAIL|ERROR|Ran |AssertionError|ImportError|ModuleNotFoundError)' /tmp/p02-probe-architecture-units.txt | tail -n 16 || true
            exit 71
          fi
          echo "P02_GOV_ARCHITECTURE_UNITS=PASS"
          if ! python3 -B .github/checks/architecture_gate.py --manifest .github/checks/code_architecture.json --gov-root ../gov-doc-policy --git-root . --base-sha "$BASE" --head-sha "$(git rev-parse HEAD)" >/tmp/p02-probe-architecture.txt 2>&1; then
            echo "P02_CHECK_FAILURE=GOV_ARCHITECTURE_DIFF"
            grep -E '^PROJECT_ARCHITECTURE=BLOCKED:|^P02_ARCHITECTURE=' /tmp/p02-probe-architecture.txt | tail -n 16 || true
            exit 72
          fi
          echo "P02_GOV_ACTUAL_GIT_DIFF=PASS"
          if ! python3 -B -m unittest tests/unit/test_p02_w4_complete_backup_import_source.py >/tmp/p02-probe-w4-units.txt 2>&1; then
            echo "P02_CHECK_FAILURE=W4_SOURCE_UNITS"
            grep -E '^(FAIL|ERROR|Ran |AssertionError)' /tmp/p02-probe-w4-units.txt | tail -n 16 || true
            exit 73
          fi
          echo "P02_W4_SOURCE_UNIT=PASS"
          php -l modern/laravel/P02W4CompleteBackupV3Archive.php
          php -l modern/laravel/P02W4CompleteBackupV3Import.php
          php -l tests/integration/p02_w4_native_clean_full_v3_restore.php
          echo "P02_CURRENT_GOV_AND_W4_SOURCE_GATES=PASS"
      - name: Native SQLite original Complete Backup v3 including attachment file rollback
        shell: bash
        env:
          P02_W3_SYNTHETIC_ONLY: '1'
          P02_W3_ENGINE: sqlite
        run: |
          set -Eeuo pipefail
          umask 077
          cd p02-source
          export P02_W3_VENDOR_AUTOLOAD="$PWD/modern/laravel/vendor/autoload.php"
          if php tests/integration/p02_w4_native_clean_full_v3_restore.php >/tmp/p02-probe-w4-native.txt 2>&1; then
            grep -Fqx 'P02_W4_NATIVE_FRESH_FULL_TO_V3_RESTORE=PASS' /tmp/p02-probe-w4-native.txt
            grep -Fqx 'P02_W4_NATIVE_SEARCH_BRANDING_RESTORE=PASS' /tmp/p02-probe-w4-native.txt
            echo "P02_W4_V3_WITH_ATTACHMENT_NATIVE_SQLITE=PASS"
          else
            sed -E 's@[A-Za-z0-9+/]{40,}={0,2}@<redacted>@g' /tmp/p02-probe-w4-native.txt | tail -n 14
            echo "P02_W4_V3_WITH_ATTACHMENT_NATIVE_SQLITE=FAIL"
            exit 81
          fi
      - name: Native MySQL 8.4 exact Schema 2401 parity and first FULL install
        shell: bash
        env:
          P02_W3_SYNTHETIC_ONLY: '1'
          P02_W3_ENGINE: mysql
          P02_W3_USER: root
          P02_W3_PASS: p02_w3_disposable_only
          P02_W3_DSN: mysql:host=127.0.0.1;port=33306;dbname=p02_w3_mysql;charset=utf8mb4
        run: |
          set -Eeuo pipefail
          umask 077
          cd p02-source
          export P02_W3_VENDOR_AUTOLOAD="$PWD/modern/laravel/vendor/autoload.php"
          if php tests/integration/p02_w3_cloudpanel_fresh_sql.php >/tmp/p02-probe-mysql.txt 2>&1 &&
             php tests/integration/p02_w3_relational_schema_2401.php >>/tmp/p02-probe-mysql.txt 2>&1; then
            echo "P02_MYSQL_84_FIRST_FULL_AND_SCHEMA_PARITY=PASS"
          else
            sed -E 's@[A-Za-z0-9+/]{40,}={0,2}@<redacted>@g' /tmp/p02-probe-mysql.txt | tail -n 14
            echo "P02_MYSQL_84_FIRST_FULL_AND_SCHEMA_PARITY=FAIL"
            exit 82
          fi
      - name: Native MariaDB 11.8 exact Schema 2401 parity and first FULL install
        shell: bash
        env:
          P02_W3_SYNTHETIC_ONLY: '1'
          P02_W3_ENGINE: mariadb
          P02_W3_USER: root
          P02_W3_PASS: p02_w3_disposable_only
          P02_W3_DSN: mysql:host=127.0.0.1;port=33307;dbname=p02_w3_mariadb;charset=utf8mb4
        run: |
          set -Eeuo pipefail
          umask 077
          cd p02-source
          export P02_W3_VENDOR_AUTOLOAD="$PWD/modern/laravel/vendor/autoload.php"
          if php tests/integration/p02_w3_cloudpanel_fresh_sql.php >/tmp/p02-probe-mariadb.txt 2>&1 &&
             php tests/integration/p02_w3_relational_schema_2401.php >>/tmp/p02-probe-mariadb.txt 2>&1; then
            echo "P02_MARIADB_118_FIRST_FULL_AND_SCHEMA_PARITY=PASS"
          else
            sed -E 's@[A-Za-z0-9+/]{40,}={0,2}@<redacted>@g' /tmp/p02-probe-mariadb.txt | tail -n 14
            echo "P02_MARIADB_118_FIRST_FULL_AND_SCHEMA_PARITY=FAIL"
            exit 83
          fi
      - name: Destroy private source and synthetic diagnostic files
        if: always()
        shell: bash
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/p02-source" "$GITHUB_WORKSPACE/gov-doc-policy"
          rm -f -- /tmp/p02-probe-apt.txt /tmp/p02-probe-composer.txt /tmp/p02-probe-npm.txt /tmp/p02-probe-vue.txt /tmp/p02-probe-architecture.txt /tmp/p02-probe-architecture-units.txt /tmp/p02-probe-w4-units.txt /tmp/p02-probe-w4-native.txt /tmp/p02-probe-mysql.txt /tmp/p02-probe-mariadb.txt
          echo "P02_PRIVATE_SOURCE_WORKSPACE_CLEANUP=PASS"
