name: P02 v2.5.133 isolate one Laravel source unit assertion
on:
  push:
    branches: [p02-25133-formal-preflight-20261120]
    paths: [.github/workflows/p02-25133-formal-preflight.yml]
permissions:
  contents: read
jobs:
  p02-unit-diagnostic:
    if: github.repository == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Verify registered private read capability without printing credential
        shell: bash
        env:
          READ_CAPABILITY: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_CAPABILITY" || { echo "P02_CAPABILITY=MISSING"; exit 61; }
          echo "P02_CAPABILITY=PRESENT"
      - name: Fetch exact private P02 candidate in disposable directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 300b1b97cc2ec8e682dabd436e5c94ea109c0a9e
          path: p02-source
          fetch-depth: 0
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Identify exact failing Laravel portal source test without exposing source
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          cd "$GITHUB_WORKSPACE/p02-source"
          test "$(git rev-parse HEAD)" = "300b1b97cc2ec8e682dabd436e5c94ea109c0a9e"
          if python3 -B -m unittest discover -s tests/unit -p test_p02_w3_laravel_portal_source.py -v >/tmp/p02-portal-unit.txt 2>&1; then
            echo "P02_PORTAL_SOURCE_UNIT=PASS"
          else
            echo "P02_PORTAL_SOURCE_UNIT=FAIL"
            python3 - <<'PY'
          import re
          from pathlib import Path
          lines=Path('/tmp/p02-portal-unit.txt').read_text(errors='replace').splitlines()
          ids=[m.group(1) for s in lines if (m:=re.match(r'^(?:FAIL|ERROR): (test_[A-Za-z0-9_]+) \(',s))]
          print('P02_PORTAL_FAILED_TEST_IDS='+','.join(ids[:10]))
          print('P02_PORTAL_TOTAL_DECLARED=4')
          PY
            exit 83
          fi
      - name: Cleanup private checkout and diagnostics
        if: always()
        shell: bash
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/gov-doc-policy" "$GITHUB_WORKSPACE/p02-source" "$GITHUB_WORKSPACE/p02-legacy-main"
          rm -f -- /tmp/p02-naming-guard.txt /tmp/p02-gov-rule-test.txt /tmp/p02-workspace-tests.txt /tmp/p02-npm-dependencies.txt /tmp/p02-vue-build.txt /tmp/p02-w4-tests.txt
          rm -f -- /tmp/p02-native-deps-probe.txt /tmp/p02-native-composer-probe.txt /tmp/p02-atomic-policy-probe.txt /tmp/p02-atomic-runtime-probe.txt
          rm -f -- /tmp/p02-native-w4-legacy.txt /tmp/p02-native-w4-recovery.txt /tmp/p02-native-w3-assets.txt /tmp/p02-playwright-install.txt /tmp/p02-chromium-install.txt /tmp/p02-w3-browser-exact.txt
          rm -f -- /tmp/p02-w4-one-case.txt /tmp/p02-final-next-atomic.txt /tmp/p02-full-cgi-first-run.txt /tmp/p02-final-browser-install.txt /tmp/p02-final-browser-deps.txt /tmp/p02-final-tls-browser-proof.txt /tmp/p02-final-sql-mysql.txt /tmp/p02-final-sql-mariadb.txt
          rm -f -- /tmp/p02-package-apt.txt /tmp/p02-package-composer.txt /tmp/p02-package-npm.txt /tmp/p02-package-vue.txt
          rm -f -- /tmp/p02-probe-architecture.txt /tmp/p02-probe-architecture-units.txt /tmp/p02-probe-w4-units.txt
          rm -f -- /tmp/p02-release-regression.txt /tmp/p02-historical-main-source.txt "$RUNNER_TEMP/p02-v25133-release-profile-probe.sh"
          rm -f -- /tmp/p02-portal-unit.txt
          echo "P02_PRIVATE_SOURCE_WORKSPACE_CLEANUP=PASS"
