name: P02 2.5.133 final FULL exact-source package runtime acceptance
on:
  push:
    branches: [p02-25133-formal-preflight-20261120]
    paths: [.github/workflows/p02-25133-formal-preflight.yml]
permissions:
  contents: read
concurrency:
  group: p02-25133-exact-final-full-once
  cancel-in-progress: false
jobs:
  p02-final-full-real-runtime:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.ref == 'refs/heads/p02-25133-formal-preflight-20261120'
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - name: Verify existing private-read runtime capability without disclosure
        shell: bash
        env:
          READ_CAPABILITY: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$READ_CAPABILITY" ]]; then
            echo "P02_PRIVATE_READ_CAPABILITY=MISSING"
            exit 61
          fi
          echo "P02_PRIVATE_READ_CAPABILITY=PRESENT"
      - name: Check out exact P02 product candidate in disposable workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 7902c92aee6f5e20b1d5806ac173a2c96a7b1e6d
          path: p02-source
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install exact Laravel 13 PHP-CGI and compile Vue once
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          cd "$GITHUB_WORKSPACE/p02-source"
          test "$(git rev-parse HEAD)" = "7902c92aee6f5e20b1d5806ac173a2c96a7b1e6d"
          test "$(cat VERSION)" = "2.5.133"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php-cli php-cgi php-sqlite3 php-mysql php-mbstring php-xml php-curl php-zip composer python3-venv sqlite3 socat openssl mkcert libnss3-tools >/tmp/p02-package-apt.txt 2>&1
          php -r 'exit(PHP_VERSION_ID>=80300&&extension_loaded("pdo_sqlite")&&extension_loaded("pdo_mysql")&&extension_loaded("zip")?0:1);'
          composer --working-dir=modern/laravel install --no-dev --no-scripts --no-plugins --prefer-dist --no-interaction --no-progress >/tmp/p02-package-composer.txt 2>&1
          npm ci --prefix modern/inertia-page --no-audit --no-fund >/tmp/p02-package-npm.txt 2>&1
          npm run build --prefix modern/inertia-page >/tmp/p02-package-vue.txt 2>&1
          echo "P02_CURRENT_LARAVEL_AND_VUE_PACKAGE_INPUTS=PASS"
      - name: Verify actual v2.5.133 final FULL double-build and private-free manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          cd "$GITHUB_WORKSPACE/p02-source"
          python3 - <<'PY'
          import json
          import pathlib
          import sys
          import tempfile
          import zipfile
          source = pathlib.Path.cwd()
          expected = "7902c92aee6f5e20b1d5806ac173a2c96a7b1e6d"
          assert __import__("subprocess").check_output(
              ["git", "rev-parse", "HEAD"], text=True).strip() == expected
          sys.path.insert(0, str(source / "scripts"))
          import p02_w3_release_full as full
          with tempfile.TemporaryDirectory(prefix="p02-w3-formal-source-receipt-") as path:
              root = pathlib.Path(path)
              first = root / "VF_Library_V2.5.133_FULL_A.zip"
              second = root / "VF_Library_V2.5.133_FULL_B.zip"
              result_a = full.build(source, first, expected)
              result_b = full.build(source, second, expected)
              verified = full.verify(first, expected)
              assert result_a["verified"] and result_b["verified"]
              assert verified["source_commit"] == expected
              assert result_a["archive_sha256"] == result_b["archive_sha256"]
              assert first.read_bytes() == second.read_bytes()
              assert verified["archive_sha256"] == result_a["archive_sha256"]
              with zipfile.ZipFile(first) as archive:
                  manifest = json.loads(archive.read(full.MANIFEST))
                  names = set(archive.namelist())
              assert manifest["product_id"] == "P02"
              assert manifest["version"] == "2.5.133"
              assert manifest["schema"] == 2401
              assert manifest["runtime"] == "laravel-13-inertia-vue"
              assert manifest["document_root"] == "modern/laravel/public"
              assert manifest["fresh_install_engines"] == ["sqlite", "mysql", "mariadb"]
              assert manifest["upgrade_existing_site"] is False
              assert manifest["data_included"] is False
              assert verified["formal_release"] is False
              assert all(full.canonical.safe_name(name) for name in names if name != full.MANIFEST)
              assert not any(name.endswith((".sqlite", ".db", ".env", ".pem", ".key", ".bak", ".sql"))
                             or "/private/" in name or "/backups/" in name for name in names)
              assert len(manifest["files"]) == verified["files"]
              with zipfile.ZipFile(first) as final_archive:
                  for name in ("modern/laravel/P02W4CompleteBackupV3Import.php",
                               "modern/laravel/P02W4CompleteBackupV3Archive.php"):
                      assert name in names and final_archive.read(name) == (source / name).read_bytes()
              print("P02_V3_ATTACHMENT_RESTORE_INCLUDED_BYTE_EXACT=PASS")
              print("P02_W3_FINAL_FULL_DETERMINISTIC=PASS")
              print("P02_W3_FINAL_FULL_EXACT_SOURCE=" + expected)
              print("P02_W3_FINAL_FULL_EPHEMERAL_SHA256=" + verified["archive_sha256"])
              print("P02_W3_FINAL_FULL_EPHEMERAL_BYTES=" + str(first.stat().st_size))
              print("P02_W3_FINAL_FULL_ONLY_NEW_SITE_NO_DATA=PASS")
              print("P02_W3_FORMAL_RELEASE_ASSET=NOT_PUBLISHED")
          PY
      - name: Verify real PHP-CGI first install from final FULL ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          cd "$GITHUB_WORKSPACE/p02-source"
          test "$(git rev-parse HEAD)" = "7902c92aee6f5e20b1d5806ac173a2c96a7b1e6d"
          if python3 -B tests/integration/p02_w3_final_full_cgi_first_run.py >/tmp/p02-full-cgi-first-run.txt 2>&1; then
            grep -Fqx 'P02_W3_EXTRACTED_FINAL_FULL_REAL_PHP_CGI_SETUP_LOGIN=PASS' /tmp/p02-full-cgi-first-run.txt
            grep -Fqx 'P02_W3_REAL_CGI_CSRF_ORIGIN_LOCK_PRIVATE_2401=PASS' /tmp/p02-full-cgi-first-run.txt
            echo 'P02_W3_FINAL_FULL_REAL_PHP_CGI_OWNER_SETUP=PASS'
          else
            grep -E '^P02_W3_FINAL_FULL_CGI_STAGE=[0-9]{1,3}$|^P02_W3_FINAL_FULL_CGI_FAILURE_CLASS=[a-zA-Z]+$' /tmp/p02-full-cgi-first-run.txt || true
            echo 'P02_W3_FINAL_FULL_REAL_PHP_CGI_OWNER_SETUP=FAIL'
            exit 94
          fi
      - name: Verify genuine TLS HTTPS Chromium final FULL owner installation
        shell: bash
        env:
          P02_W3_SYNTHETIC_ONLY: '1'
        run: |
          set -Eeuo pipefail
          umask 077
          cd "$GITHUB_WORKSPACE/p02-source"
          test "$(git rev-parse HEAD)" = "7902c92aee6f5e20b1d5806ac173a2c96a7b1e6d"
          python3 -m venv "$RUNNER_TEMP/p02-final-tls-browser"
          if ! "$RUNNER_TEMP/p02-final-tls-browser/bin/python" -m pip install --disable-pip-version-check 'playwright==1.56.0' >/tmp/p02-final-browser-install.txt 2>&1; then
            echo 'P02_W3_FINAL_TLS_BROWSER_DEPENDENCY=FAIL'
            exit 95
          fi
          if ! "$RUNNER_TEMP/p02-final-tls-browser/bin/python" -m playwright install --with-deps chromium >/tmp/p02-final-browser-deps.txt 2>&1; then
            echo 'P02_W3_FINAL_TLS_CHROMIUM_DEPENDENCY=FAIL'
            exit 95
          fi
          if "$RUNNER_TEMP/p02-final-tls-browser/bin/python" tests/integration/p02_w3_final_full_https_browser.py >/tmp/p02-final-tls-browser-proof.txt 2>&1; then
            grep -Fqx 'P02_W3_FINAL_FULL_REAL_TLS_HTTPS_CHROMIUM_390_768_1440=PASS' /tmp/p02-final-tls-browser-proof.txt
            grep -Fqx 'P02_W3_FINAL_FULL_HTTPS_OWNER_INSTALL_LOGIN_UPDATES=PASS' /tmp/p02-final-tls-browser-proof.txt
            echo 'P02_W3_FINAL_FULL_REAL_HTTPS_OWNER_BROWSER=PASS'
          else
            grep -E '^P02_W3_HTTPS_BROWSER_(STAGE=[0-9]{1,3}|FAILURE_CLASS=[A-Za-z_]{1,80})' /tmp/p02-final-tls-browser-proof.txt || true
            grep -E '^P02_W3_HTTPS_INSTALL_(POST_STATUS=[0-9]{1,3}|PAGE_CLASS=(LOCKED|NOT_READY|ALREADY_INSTALLED|FORM_STILL_VISIBLE|INSTALLED|UNKNOWN))$' /tmp/p02-final-tls-browser-proof.txt || true
            grep -E '^P02_W3_HTTPS_REQUEST_(ORIGIN=(MATCH|MISMATCH|ABSENT)|FETCH=(same-origin|same-site|none|cross-site|OTHER)|COOKIE=(YES|NO)|FORM=(YES|NO)|BODY=(YES|NO))$' /tmp/p02-final-tls-browser-proof.txt || true
            grep -E '^P02_W3_HTTPS_REQUEST_ORIGIN_CLASS=(EXACT|OPAQUE_NULL|EXPLICIT_DEFAULT_443|TRAILING_SLASH|SAME_HOST_HTTPS_OTHER|SAME_HOST_WRONG_SCHEME|OTHER)$|^P02_W3_HTTPS_BROWSER_JS_ORIGIN_MATCH=(YES|NO)$' /tmp/p02-final-tls-browser-proof.txt || true
            grep -E '^P02_W3_HTTPS_BROWSER_NAV_FAILURE=(OTHER|ERR_[A-Z_]{3,50})$' /tmp/p02-final-tls-browser-proof.txt || true
            echo 'P02_W3_FINAL_FULL_REAL_HTTPS_OWNER_BROWSER=FAIL'
            exit 95
          fi
      - name: Cleanup private checkout and diagnostics
        if: always()
        shell: bash
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/gov-doc-policy" "$GITHUB_WORKSPACE/p02-source"
          rm -f -- /tmp/p02-naming-guard.txt /tmp/p02-gov-rule-test.txt /tmp/p02-workspace-tests.txt /tmp/p02-npm-dependencies.txt /tmp/p02-vue-build.txt /tmp/p02-w4-tests.txt
          rm -f -- /tmp/p02-native-deps-probe.txt /tmp/p02-native-composer-probe.txt /tmp/p02-atomic-policy-probe.txt /tmp/p02-atomic-runtime-probe.txt
          rm -f -- /tmp/p02-native-w4-legacy.txt /tmp/p02-native-w4-recovery.txt /tmp/p02-native-w3-assets.txt /tmp/p02-playwright-install.txt /tmp/p02-chromium-install.txt /tmp/p02-w3-browser-exact.txt
          rm -f -- /tmp/p02-w4-one-case.txt /tmp/p02-final-next-atomic.txt /tmp/p02-full-cgi-first-run.txt /tmp/p02-final-browser-install.txt /tmp/p02-final-browser-deps.txt /tmp/p02-final-tls-browser-proof.txt /tmp/p02-final-sql-mysql.txt /tmp/p02-final-sql-mariadb.txt
          rm -f -- /tmp/p02-package-apt.txt /tmp/p02-package-composer.txt /tmp/p02-package-npm.txt /tmp/p02-package-vue.txt
          echo "P02_PRIVATE_SOURCE_WORKSPACE_CLEANUP=PASS"
