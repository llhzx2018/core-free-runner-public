name: P02 v2.5.133 bounded private governance preflight
on:
  push:
    branches:
      - p02-25133-formal-preflight-20261120
    paths:
      - .github/workflows/p02-25133-formal-preflight.yml
permissions:
  contents: read
concurrency:
  group: p02-25133-temporary-governance
  cancel-in-progress: false
jobs:
  p02-governance-preflight:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.ref == 'refs/heads/p02-25133-formal-preflight-20261120'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Verify existing private-read runtime capability without disclosure
        shell: bash
        env:
          READ_CAPABILITY: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$READ_CAPABILITY" ]]; then
            echo "P02_PRIVATE_READ_CAPABILITY=MISSING"
            exit 61
          fi
          echo "P02_PRIVATE_READ_CAPABILITY=PRESENT"
      - name: Check out official private GOV-DOC in disposable workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          path: gov-doc-policy
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Check out exact P02 product candidate in disposable workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 949ad32e52a35d649cb4557a8d9bd3a7be985487
          path: p02-source
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact SOURCE, current GOV authority and architectural negative tests
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          cd "$GITHUB_WORKSPACE/p02-source"
          test "$(git rev-parse HEAD)" = 949ad32e52a35d649cb4557a8d9bd3a7be985487
          test "$(cat VERSION)" = 2.5.133
          test -f ../gov-doc-policy/governance/agent/code_architecture_lint.py
          test -f .github/checks/code_architecture.json
          BASE="$(git merge-base HEAD origin/main)"
          if ! python3 -B -m unittest discover -s .github/checks -p test_architecture_gate.py -v >/tmp/p02-naming-guard.txt 2>&1; then
            echo "P02_GOV_LOCAL_NEGATIVE=FAIL"; exit 62
          fi
          echo "P02_GOV_LOCAL_NEGATIVE=PASS"
          if ! python3 -B .github/checks/architecture_gate.py \
            --manifest .github/checks/code_architecture.json \
            --gov-root ../gov-doc-policy --git-root . \
            --base-sha "$BASE" --head-sha "$(git rev-parse HEAD)" \
            >/tmp/p02-gov-rule-test.txt 2>&1; then
            python3 - <<'PY'
          import re
          from pathlib import Path
          txt=Path('/tmp/p02-gov-rule-test.txt').read_text(errors='replace')
          codes=re.findall(r'PROJECT_ARCHITECTURE=BLOCKED:([A-Z][A-Z0-9_]+)', txt)
          print('P02_GOV_FAILURE_CATEGORY='+ (codes[0] if codes else 'UNCLASSIFIED'))
          PY
            echo "P02_GOV_MAIN_ARCHITECTURE_NAMING=FAIL"; exit 63
          fi
          echo "P02_GOV_MAIN_ARCHITECTURE_NAMING=PASS"
      - name: Cleanup private checkout and diagnostics
        if: always()
        shell: bash
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/gov-doc-policy" "$GITHUB_WORKSPACE/p02-source"
          rm -f -- /tmp/p02-naming-guard.txt /tmp/p02-gov-rule-test.txt
          echo "P02_PRIVATE_SOURCE_WORKSPACE_CLEANUP=PASS"
