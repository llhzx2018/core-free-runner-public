name: P02 v2.5.133 bounded private governance preflight
on:
  push:
    branches:
      - p02-25133-formal-preflight-20261120
    paths:
      - .github/workflows/p02-25133-formal-preflight.yml
permissions:
  contents: read
concurrency:
  group: p02-25133-temporary-governance
  cancel-in-progress: false
jobs:
  p02-governance-preflight:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.ref == 'refs/heads/p02-25133-formal-preflight-20261120'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Verify existing private-read runtime capability without disclosure
        shell: bash
        env:
          READ_CAPABILITY: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$READ_CAPABILITY" ]]; then
            echo "P02_PRIVATE_READ_CAPABILITY=MISSING"
            exit 61
          fi
          echo "P02_PRIVATE_READ_CAPABILITY=PRESENT"
      - name: Check out official private GOV-DOC in disposable workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          path: gov-doc-policy
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Check out exact P02 product candidate in disposable workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: eb03683ecddc4b3a5f2a9f9e61f4976299d77ca4
          path: p02-source
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact SOURCE, current GOV authority and architectural negative tests
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          cd "$GITHUB_WORKSPACE/p02-source"
          test "$(git rev-parse HEAD)" = eb03683ecddc4b3a5f2a9f9e61f4976299d77ca4
          test "$(cat VERSION)" = 2.5.133
          test -f ../gov-doc-policy/governance/agent/code_architecture_lint.py
          test -f .github/checks/code_architecture.json
          BASE="$(git merge-base HEAD origin/main)"
          if ! python3 -B -m unittest discover -s .github/checks -p test_architecture_gate.py -v >/tmp/p02-naming-guard.txt 2>&1; then
            echo "P02_GOV_LOCAL_NEGATIVE=FAIL"; exit 62
          fi
          echo "P02_GOV_LOCAL_NEGATIVE=PASS"
          if ! python3 -B .github/checks/architecture_gate.py \
            --manifest .github/checks/code_architecture.json \
            --gov-root ../gov-doc-policy --git-root . \
            --base-sha "$BASE" --head-sha "$(git rev-parse HEAD)" \
            >/tmp/p02-gov-rule-test.txt 2>&1; then
            python3 - <<'PY'
          import re
          from pathlib import Path
          txt=Path('/tmp/p02-gov-rule-test.txt').read_text(errors='replace')
          codes=re.findall(r'PROJECT_ARCHITECTURE=BLOCKED:([A-Z][A-Z0-9_]+)', txt)
          print('P02_GOV_FAILURE_CATEGORY='+ (codes[0] if codes else 'UNCLASSIFIED'))
          PY
            echo "P02_GOV_MAIN_ARCHITECTURE_NAMING=FAIL"; exit 63
          fi
          echo "P02_GOV_MAIN_ARCHITECTURE_NAMING=PASS"
      - name: Confirm refactor source contracts and language syntax in private workspace
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/p02-source"
          python3 -B scripts/p02_w3_source_gate.py
          if python3 -B -m unittest tests/unit/test_p02_w3_workspace_source.py >/tmp/p02-workspace-tests.txt 2>&1; then
            echo "P02_WORKSPACE_SOURCE_UNIT=PASS"
          else
            echo "P02_WORKSPACE_SOURCE_UNIT=FAIL"
            python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/p02-workspace-tests.txt').read_text(errors='replace')
          for test in re.findall(r'^(?:FAIL|ERROR): ([A-Za-z0-9_]+)',s,re.M)[:15]:
              print('P02_WORKSPACE_FAILED_CASE='+test)
          PY
            exit 71
          fi
          if python3 -B -m unittest tests/unit/test_p02_w4_live_snapshot.py tests/unit/test_p02_w4_complete_backup_import_source.py >/tmp/p02-w4-tests.txt 2>&1; then
            echo "P02_W4_SNAPSHOT_AND_V3_SOURCE_UNIT=PASS"
          else
            echo "P02_W4_SNAPSHOT_AND_V3_SOURCE_UNIT=FAIL"
            python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/p02-w4-tests.txt').read_text(errors='replace')
          for test in re.findall(r'^(?:FAIL|ERROR): ([A-Za-z0-9_]+)',s,re.M)[:12]:
              print('P02_W4_FAILED_CASE='+test)
          PY
            exit 74
          fi
          python3 -B -m py_compile scripts/p02_w3_source_gate_sql.py scripts/p02_w3_source_gate_cloudpanel.py scripts/p02_w4_live_snapshot.py scripts/p02_w4_snapshot_restore.py
          echo "P02_REFACTOR_PYTHON_SYNTAX=PASS"
          php -l modern/laravel/P02W4CompleteBackupV3Import.php >/dev/null
          php -l modern/laravel/P02W4CompleteBackupV3Archive.php >/dev/null
          echo "P02_REFACTOR_PHP_SYNTAX=PASS"
          if ! npm ci --prefix modern/inertia-page --no-audit --no-fund >/tmp/p02-npm-dependencies.txt 2>&1; then
            echo "P02_VUE_NPM_CI=FAIL"; exit 72
          fi
          echo "P02_VUE_NPM_CI=PASS"
          if npm run build --prefix modern/inertia-page >/tmp/p02-vue-build.txt 2>&1; then
            echo "P02_VUE_TYPECHECK_AND_VITE_BUILD=PASS"
          else
            python3 - <<'PY'
          from pathlib import Path
          import re
          log=Path('/tmp/p02-vue-build.txt').read_text(errors='replace')
          matches=re.findall(r'([A-Za-z0-9_./-]+\.(?:vue|ts|html))\((\d+),(\d+)\):\s*error\s*TS(\d+)', log)
          for filename,line,col,code in matches[:20]:
              print('P02_VUE_ERROR_LOCATION='+filename+':'+line+':TS'+code)
          for row in log.splitlines():
              if 'error TS' in row:
                  location=re.search(r'([A-Za-z0-9_./-]+\.(?:vue|ts|html))(?:\((\d+),(\d+)\)|:(\d+):(\d+))',row)
                  code=re.search(r'TS(\d+)',row)
                  print('P02_VUE_TYPE_ERROR='+((location.group(1)+':'+(location.group(2) or location.group(4))) if location else 'NO_LOCATION')+':'+(('TS'+code.group(1)) if code else 'UNKNOWN'))
          if 'error during build' in log or '[vite]' in log:
              print('P02_VUE_VITE_PHASE=ERROR')
              lines=log.splitlines()
              for i,line in enumerate(lines):
                  if 'error during build:' in line and i+1<len(lines):
                      reason=lines[i+1].strip()
                      reason=re.sub(r'(?i)(?:ghp|github_pat)_[A-Za-z0-9_]+','<redacted>',reason)
                      reason=re.sub(r'/(?:home|runner|tmp)/[^ ]+','<redacted-path>',reason)
                      reason=re.sub(r'[^A-Za-z0-9 _:.()/\\[\\]-]','',reason)
                      print('P02_VUE_VITE_ERROR_CLASS='+reason[:140])
                      break
          if 'Cannot find' in log or 'not found' in log:
              print('P02_VUE_RESOLVE_CLASS=ERROR')
          print('P02_VUE_TYPECHECK_AND_VITE_BUILD=FAIL')
          PY
            exit 73
          fi
      - name: Verify exact sealed W4 rollback candidate using bound private P02 commit
        shell: bash
        env:
          P02_W3_SYNTHETIC_ONLY: '1'
          P02_W3_ENGINE: sqlite
          P02_W4_SYNTHETIC_ONLY: '1'
          P02_W4_EXPECTED_SOURCE_SHA: eb03683ecddc4b3a5f2a9f9e61f4976299d77ca4
        run: |
          set -Eeuo pipefail
          umask 077
          cd "$GITHUB_WORKSPACE/p02-source"
          test "$(git rev-parse HEAD)" = "eb03683ecddc4b3a5f2a9f9e61f4976299d77ca4"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php-cli php-cgi php-sqlite3 php-mysql php-mbstring php-xml php-curl php-zip composer socat openssl >/tmp/p02-native-deps-probe.txt 2>&1
          if ! composer --working-dir=modern/laravel install --no-dev --no-scripts --no-plugins --prefer-dist --no-interaction --no-progress >/tmp/p02-native-composer-probe.txt 2>&1; then
            echo "P02_W4_NATIVE_COMPOSER=BLOCKED"; exit 91
          fi
          export P02_W3_VENDOR_AUTOLOAD="$PWD/modern/laravel/vendor/autoload.php"
          if python3 -B tests/integration/p02_w4_candidate_from_bundle.py >/tmp/p02-w4-one-case.txt 2>&1; then
            echo "P02_W4_EXACT_SOURCE_FINAL_FULL_BACKUP_ROLLBACK=PASS"
          else
            grep -E '^P02_W4_NATIVE_CHILD_STAGE=[0-9]{1,3}$' /tmp/p02-w4-one-case.txt || true
            echo "P02_W4_EXACT_SOURCE_FINAL_FULL_BACKUP_ROLLBACK=FAIL"; exit 92
          fi
      - name: Verify final actual FULL to next version app Atomic on native SQLite
        shell: bash
        env:
          P02_W3_SYNTHETIC_ONLY: '1'
          P02_W3_ENGINE: sqlite
        run: |
          set -Eeuo pipefail
          umask 077
          cd "$GITHUB_WORKSPACE/p02-source"
          test "$(git rev-parse HEAD)" = "eb03683ecddc4b3a5f2a9f9e61f4976299d77ca4"
          export P02_W3_VENDOR_AUTOLOAD="$PWD/modern/laravel/vendor/autoload.php"
          if python3 -B tests/integration/p02_w3_app_atomic_from_bundle.py >/tmp/p02-final-next-atomic.txt 2>&1; then
            grep -Fqx 'P02_W3_FINAL_FULL_TO_SYNTHETIC_NEXT_APP_ATOMIC_SIGKILL_SQLITE=PASS' /tmp/p02-final-next-atomic.txt
            grep -Fqx 'P02_W3_OFFICIAL_OWNER_CHECK_APPLY_RECHECK_ASSET_SQLITE_FROM_FINAL_FULL=PASS' /tmp/p02-final-next-atomic.txt
            echo 'P02_W3_FINAL_FULL_OWNER_CHECK_APPLY_REPLAY_DRIFT=PASS'
            echo 'P02_W3_FINAL_FULL_TO_SYNTHETIC_NEXT_APP_ATOMIC_SIGKILL_SQLITE=PASS'
          else
            result=$?
            grep -E 'P02_W3_APP_ATOMIC_FAIL_(PHASE|CLASS)=' /tmp/p02-final-next-atomic.txt || true
            echo "P02_W3_APP_ATOMIC_EXIT_CODE"="$result"
            echo 'P02_W3_FINAL_FULL_TO_SYNTHETIC_NEXT_APP_ATOMIC_SIGKILL_SQLITE=FAIL'
            exit 93
          fi
      - name: Verify real PHP-CGI first install from final FULL ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          cd "$GITHUB_WORKSPACE/p02-source"
          test "$(git rev-parse HEAD)" = "eb03683ecddc4b3a5f2a9f9e61f4976299d77ca4"
          if python3 -B tests/integration/p02_w3_final_full_cgi_first_run.py >/tmp/p02-full-cgi-first-run.txt 2>&1; then
            grep -Fqx 'P02_W3_EXTRACTED_FINAL_FULL_REAL_PHP_CGI_SETUP_LOGIN=PASS' /tmp/p02-full-cgi-first-run.txt
            grep -Fqx 'P02_W3_REAL_CGI_CSRF_ORIGIN_LOCK_PRIVATE_2401=PASS' /tmp/p02-full-cgi-first-run.txt
            echo 'P02_W3_FINAL_FULL_REAL_PHP_CGI_OWNER_SETUP=PASS'
          else
            grep -E '^P02_W3_FINAL_FULL_CGI_STAGE=[0-9]{1,3}$|^P02_W3_FINAL_FULL_CGI_FAILURE_CLASS=[a-zA-Z]+$' /tmp/p02-full-cgi-first-run.txt || true
            echo 'P02_W3_FINAL_FULL_REAL_PHP_CGI_OWNER_SETUP=FAIL'
            exit 94
          fi
      - name: Verify genuine TLS HTTPS Chromium final FULL owner installation
        shell: bash
        env:
          P02_W3_SYNTHETIC_ONLY: '1'
        run: |
          set -Eeuo pipefail
          umask 077
          cd "$GITHUB_WORKSPACE/p02-source"
          test "$(git rev-parse HEAD)" = "eb03683ecddc4b3a5f2a9f9e61f4976299d77ca4"
          python3 -m venv "$RUNNER_TEMP/p02-final-tls-browser"
          if ! "$RUNNER_TEMP/p02-final-tls-browser/bin/python" -m pip install --disable-pip-version-check 'playwright==1.56.0' >/tmp/p02-final-browser-install.txt 2>&1; then
            echo 'P02_W3_FINAL_TLS_BROWSER_DEPENDENCY=FAIL'
            exit 95
          fi
          if ! "$RUNNER_TEMP/p02-final-tls-browser/bin/python" -m playwright install --with-deps chromium >/tmp/p02-final-browser-deps.txt 2>&1; then
            echo 'P02_W3_FINAL_TLS_CHROMIUM_DEPENDENCY=FAIL'
            exit 95
          fi
          if "$RUNNER_TEMP/p02-final-tls-browser/bin/python" tests/integration/p02_w3_final_full_https_browser.py >/tmp/p02-final-tls-browser-proof.txt 2>&1; then
            grep -Fqx 'P02_W3_FINAL_FULL_REAL_TLS_HTTPS_CHROMIUM_390_768_1440=PASS' /tmp/p02-final-tls-browser-proof.txt
            grep -Fqx 'P02_W3_FINAL_FULL_HTTPS_OWNER_INSTALL_LOGIN_UPDATES=PASS' /tmp/p02-final-tls-browser-proof.txt
            echo 'P02_W3_FINAL_FULL_REAL_HTTPS_OWNER_BROWSER=PASS'
          else
            grep -E '^P02_W3_HTTPS_BROWSER_(STAGE=[0-9]{1,3}|FAILURE_CLASS=[A-Za-z_]{1,80})' /tmp/p02-final-tls-browser-proof.txt || true
            grep -E '^P02_W3_HTTPS_INSTALL_(POST_STATUS=[0-9]{1,3}|PAGE_CLASS=(LOCKED|NOT_READY|ALREADY_INSTALLED|FORM_STILL_VISIBLE|INSTALLED|UNKNOWN))$' /tmp/p02-final-tls-browser-proof.txt || true
            grep -E '^P02_W3_HTTPS_REQUEST_(ORIGIN=(MATCH|MISMATCH|ABSENT)|FETCH=(same-origin|same-site|none|cross-site|OTHER)|COOKIE=(YES|NO)|FORM=(YES|NO)|BODY=(YES|NO))$' /tmp/p02-final-tls-browser-proof.txt || true
            echo 'P02_W3_FINAL_FULL_REAL_HTTPS_OWNER_BROWSER=FAIL'
            exit 95
          fi
      - name: Verify actual v2.5.133 final FULL double-build and private-free manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          cd "$GITHUB_WORKSPACE/p02-source"
          python3 - <<'PY'
          import json
          import pathlib
          import sys
          import tempfile
          import zipfile
          source = pathlib.Path.cwd()
          expected = "eb03683ecddc4b3a5f2a9f9e61f4976299d77ca4"
          assert __import__("subprocess").check_output(
              ["git", "rev-parse", "HEAD"], text=True).strip() == expected
          sys.path.insert(0, str(source / "scripts"))
          import p02_w3_release_full as full
          with tempfile.TemporaryDirectory(prefix="p02-w3-formal-source-receipt-") as path:
              root = pathlib.Path(path)
              first = root / "VF_Library_V2.5.133_FULL_A.zip"
              second = root / "VF_Library_V2.5.133_FULL_B.zip"
              result_a = full.build(source, first, expected)
              result_b = full.build(source, second, expected)
              verified = full.verify(first, expected)
              assert result_a["verified"] and result_b["verified"]
              assert verified["source_commit"] == expected
              assert result_a["archive_sha256"] == result_b["archive_sha256"]
              assert first.read_bytes() == second.read_bytes()
              assert verified["archive_sha256"] == result_a["archive_sha256"]
              with zipfile.ZipFile(first) as archive:
                  manifest = json.loads(archive.read(full.MANIFEST))
                  names = set(archive.namelist())
              assert manifest["product_id"] == "P02"
              assert manifest["version"] == "2.5.133"
              assert manifest["schema"] == 2401
              assert manifest["runtime"] == "laravel-13-inertia-vue"
              assert manifest["document_root"] == "modern/laravel/public"
              assert manifest["fresh_install_engines"] == ["sqlite", "mysql", "mariadb"]
              assert manifest["upgrade_existing_site"] is False
              assert manifest["data_included"] is False
              assert verified["formal_release"] is False
              assert all(full.canonical.safe_name(name) for name in names if name != full.MANIFEST)
              assert not any(name.endswith((".sqlite", ".db", ".env", ".pem", ".key", ".bak", ".sql"))
                             or "/private/" in name or "/backups/" in name for name in names)
              assert len(manifest["files"]) == verified["files"]
              print("P02_W3_FINAL_FULL_DETERMINISTIC=PASS")
              print("P02_W3_FINAL_FULL_EXACT_SOURCE=" + expected)
              print("P02_W3_FINAL_FULL_EPHEMERAL_SHA256=" + verified["archive_sha256"])
              print("P02_W3_FINAL_FULL_EPHEMERAL_BYTES=" + str(first.stat().st_size))
              print("P02_W3_FINAL_FULL_ONLY_NEW_SITE_NO_DATA=PASS")
              print("P02_W3_FORMAL_RELEASE_ASSET=NOT_PUBLISHED")
          PY
      - name: Cleanup private checkout and diagnostics
        if: always()
        shell: bash
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/gov-doc-policy" "$GITHUB_WORKSPACE/p02-source"
          rm -f -- /tmp/p02-naming-guard.txt /tmp/p02-gov-rule-test.txt /tmp/p02-workspace-tests.txt /tmp/p02-npm-dependencies.txt /tmp/p02-vue-build.txt /tmp/p02-w4-tests.txt
          rm -f -- /tmp/p02-native-deps-probe.txt /tmp/p02-native-composer-probe.txt /tmp/p02-atomic-policy-probe.txt /tmp/p02-atomic-runtime-probe.txt
          rm -f -- /tmp/p02-native-w4-legacy.txt /tmp/p02-native-w4-recovery.txt /tmp/p02-native-w3-assets.txt /tmp/p02-playwright-install.txt /tmp/p02-chromium-install.txt /tmp/p02-w3-browser-exact.txt
          rm -f -- /tmp/p02-w4-one-case.txt /tmp/p02-final-next-atomic.txt /tmp/p02-full-cgi-first-run.txt /tmp/p02-final-browser-install.txt /tmp/p02-final-browser-deps.txt /tmp/p02-final-tls-browser-proof.txt
          echo "P02_PRIVATE_SOURCE_WORKSPACE_CLEANUP=PASS"
