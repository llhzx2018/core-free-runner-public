name: P02 one-time release writer discovery no mutations
on:
  push:
    branches: [p02-25133-formal-preflight-20261120]
    paths: [.github/workflows/p02-25133-formal-preflight.yml]
permissions:
  contents: read
jobs:
  p02-release-write-read-only-probe:
    if: github.repository == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check registered release capability without printing the secret
        shell: bash
        env:
          VF_RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [ -z "$VF_RELEASE_TOKEN" ]; then
            echo "P02_RELEASE_WRITER_SECRET=NOT_CONFIGURED_IN_PUBLIC_RUNNER"
            exit 66
          fi
          echo "P02_RELEASE_WRITER_SECRET=PRESENT"
          export GH_TOKEN="$VF_RELEASE_TOKEN"
          if gh api repos/llhzx2018/vf-library --jq '.permissions.push // false' >/tmp/p02-write-permission.txt 2>/dev/null; then
            if grep -Fqx true /tmp/p02-write-permission.txt; then
              echo "P02_RELEASE_REPO_PUSH_SCOPE=YES_READ_ONLY_PROBE"
            else
              echo "P02_RELEASE_REPO_PUSH_SCOPE=NO_OR_NOT_REPORTED"
              exit 67
            fi
          else
            echo "P02_RELEASE_REPO_ACCESS=READ_ONLY_PROBE_FAILED"
            exit 68
          fi
      - name: Clean tiny test output
        if: always()
        shell: bash
        run: |
          rm -f -- /tmp/p02-write-permission.txt
          echo "P02_NO_WRITE_OR_RELEASE_ATTEMPTED=YES"
