name: P02 v2.5.133 exact-source attachment and SQL focused gate
on:
  push:
    branches: [p02-25133-formal-preflight-20261120]
    paths: [.github/workflows/p02-25133-formal-preflight.yml]
permissions:
  contents: read
concurrency:
  group: p02-25133-attachment-native
  cancel-in-progress: false
jobs:
  p02-bounded-machine-proof:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.ref == 'refs/heads/p02-25133-formal-preflight-20261120'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Verify registered private read capability without printing credential
        shell: bash
        env:
          READ_CAPABILITY: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_CAPABILITY" || { echo "P02_CAPABILITY=MISSING"; exit 61; }
          echo "P02_CAPABILITY=PRESENT"
      - name: Fetch current GOV source in disposable directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          path: gov-doc-policy
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Fetch exact private P02 candidate in disposable directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 7902c92aee6f5e20b1d5806ac173a2c96a7b1e6d
          path: p02-source
          fetch-depth: 0
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Git architecture naming and focused source checks
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p02-source
          test -f ../gov-doc-policy/governance/agent/code_architecture_lint.py
          BASE="$(git merge-base HEAD origin/main)"
          if ! python3 -B -m unittest discover -s .github/checks -p test_architecture_gate.py >/tmp/p02-probe-architecture-units.txt 2>&1; then
            echo "P02_CHECK_FAILURE=ARCHITECTURE_UNITS"
            grep -E '^(FAIL|ERROR|Ran |AssertionError|ImportError|ModuleNotFoundError)' /tmp/p02-probe-architecture-units.txt | tail -n 16 || true
            exit 71
          fi
          echo "P02_GOV_ARCHITECTURE_UNITS=PASS"
          if ! python3 -B .github/checks/architecture_gate.py --manifest .github/checks/code_architecture.json --gov-root ../gov-doc-policy --git-root . --base-sha "$BASE" --head-sha "$(git rev-parse HEAD)" >/tmp/p02-probe-architecture.txt 2>&1; then
            echo "P02_CHECK_FAILURE=GOV_ARCHITECTURE_DIFF"
            grep -E '^PROJECT_ARCHITECTURE=BLOCKED:|^CODE_ARCHITECTURE=BLOCKED:' /tmp/p02-probe-architecture.txt | tail -n 16 || true
            tail -n 4 /tmp/p02-probe-architecture.txt | sed -E 's@([A-Za-z0-9_]+_[A-Za-z0-9_]+)=[^ ;]+@\1=<redacted>@g' || true
            exit 72
          fi
          echo "P02_GOV_ACTUAL_GIT_DIFF=PASS"
          if ! python3 -B -m unittest tests/unit/test_p02_w4_complete_backup_import_source.py >/tmp/p02-probe-w4-units.txt 2>&1; then
            echo "P02_CHECK_FAILURE=W4_SOURCE_UNITS"
            grep -E '^(FAIL|ERROR|Ran |AssertionError)' /tmp/p02-probe-w4-units.txt | tail -n 16 || true
            exit 73
          fi
          echo "P02_W4_SOURCE_UNIT=PASS"
          php -l modern/laravel/P02W4CompleteBackupV3Archive.php
          php -l modern/laravel/P02W4CompleteBackupV3Import.php
          php -l tests/integration/p02_w4_native_clean_full_v3_restore.php
          echo "P02_CURRENT_GOV_AND_W4_SOURCE_GATES=PASS"
      - name: Destroy private source and synthetic diagnostic files
        if: always()
        shell: bash
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/p02-source" "$GITHUB_WORKSPACE/gov-doc-policy"
          rm -f -- /tmp/p02-probe-apt.txt /tmp/p02-probe-composer.txt /tmp/p02-probe-npm.txt /tmp/p02-probe-vue.txt /tmp/p02-probe-architecture.txt /tmp/p02-probe-architecture-units.txt /tmp/p02-probe-w4-units.txt /tmp/p02-probe-w4-native.txt /tmp/p02-probe-mysql.txt /tmp/p02-probe-mariadb.txt
          echo "P02_PRIVATE_SOURCE_WORKSPACE_CLEANUP=PASS"
