name: P02 v2.5.133 bounded private governance preflight
on:
  push:
    branches:
      - p02-25133-formal-preflight-20261120
    paths:
      - .github/workflows/p02-25133-formal-preflight.yml
permissions:
  contents: read
concurrency:
  group: p02-25133-temporary-governance
  cancel-in-progress: false
jobs:
  p02-governance-preflight:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.ref == 'refs/heads/p02-25133-formal-preflight-20261120'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Verify existing private-read runtime capability without disclosure
        shell: bash
        env:
          READ_CAPABILITY: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$READ_CAPABILITY" ]]; then
            echo "P02_PRIVATE_READ_CAPABILITY=MISSING"
            exit 61
          fi
          echo "P02_PRIVATE_READ_CAPABILITY=PRESENT"
      - name: Check out official private GOV-DOC in disposable workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          path: gov-doc-policy
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Check out exact P02 product candidate in disposable workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: c30f27b628403b1e1731a8ff95d2d2184468739c
          path: p02-source
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact SOURCE, current GOV authority and architectural negative tests
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          cd "$GITHUB_WORKSPACE/p02-source"
          test "$(git rev-parse HEAD)" = c30f27b628403b1e1731a8ff95d2d2184468739c
          test "$(cat VERSION)" = 2.5.133
          test -f ../gov-doc-policy/governance/agent/code_architecture_lint.py
          test -f .github/checks/code_architecture.json
          BASE="$(git merge-base HEAD origin/main)"
          if ! python3 -B -m unittest discover -s .github/checks -p test_architecture_gate.py -v >/tmp/p02-naming-guard.txt 2>&1; then
            echo "P02_GOV_LOCAL_NEGATIVE=FAIL"; exit 62
          fi
          echo "P02_GOV_LOCAL_NEGATIVE=PASS"
          if ! python3 -B .github/checks/architecture_gate.py \
            --manifest .github/checks/code_architecture.json \
            --gov-root ../gov-doc-policy --git-root . \
            --base-sha "$BASE" --head-sha "$(git rev-parse HEAD)" \
            >/tmp/p02-gov-rule-test.txt 2>&1; then
            python3 - <<'PY'
          import re
          from pathlib import Path
          txt=Path('/tmp/p02-gov-rule-test.txt').read_text(errors='replace')
          codes=re.findall(r'PROJECT_ARCHITECTURE=BLOCKED:([A-Z][A-Z0-9_]+)', txt)
          print('P02_GOV_FAILURE_CATEGORY='+ (codes[0] if codes else 'UNCLASSIFIED'))
          PY
            echo "P02_GOV_MAIN_ARCHITECTURE_NAMING=FAIL"; exit 63
          fi
          echo "P02_GOV_MAIN_ARCHITECTURE_NAMING=PASS"
      - name: Confirm refactor source contracts and language syntax in private workspace
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/p02-source"
          python3 -B scripts/p02_w3_source_gate.py
          if python3 -B -m unittest tests/unit/test_p02_w3_workspace_source.py >/tmp/p02-workspace-tests.txt 2>&1; then
            echo "P02_WORKSPACE_SOURCE_UNIT=PASS"
          else
            echo "P02_WORKSPACE_SOURCE_UNIT=FAIL"
            python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/p02-workspace-tests.txt').read_text(errors='replace')
          for test in re.findall(r'^(?:FAIL|ERROR): ([A-Za-z0-9_]+)',s,re.M)[:15]:
              print('P02_WORKSPACE_FAILED_CASE='+test)
          PY
            exit 71
          fi
          if python3 -B -m unittest tests/unit/test_p02_w4_live_snapshot.py tests/unit/test_p02_w4_complete_backup_import_source.py >/tmp/p02-w4-tests.txt 2>&1; then
            echo "P02_W4_SNAPSHOT_AND_V3_SOURCE_UNIT=PASS"
          else
            echo "P02_W4_SNAPSHOT_AND_V3_SOURCE_UNIT=FAIL"
            python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/p02-w4-tests.txt').read_text(errors='replace')
          for test in re.findall(r'^(?:FAIL|ERROR): ([A-Za-z0-9_]+)',s,re.M)[:12]:
              print('P02_W4_FAILED_CASE='+test)
          PY
            exit 74
          fi
          python3 -B -m py_compile scripts/p02_w3_source_gate_sql.py scripts/p02_w3_source_gate_cloudpanel.py scripts/p02_w4_live_snapshot.py scripts/p02_w4_snapshot_restore.py
          echo "P02_REFACTOR_PYTHON_SYNTAX=PASS"
          php -l modern/laravel/P02W4CompleteBackupV3Import.php >/dev/null
          php -l modern/laravel/P02W4CompleteBackupV3Archive.php >/dev/null
          echo "P02_REFACTOR_PHP_SYNTAX=PASS"
          if ! npm ci --prefix modern/inertia-page --no-audit --no-fund >/tmp/p02-npm-dependencies.txt 2>&1; then
            echo "P02_VUE_NPM_CI=FAIL"; exit 72
          fi
          echo "P02_VUE_NPM_CI=PASS"
          if npm run build --prefix modern/inertia-page >/tmp/p02-vue-build.txt 2>&1; then
            echo "P02_VUE_TYPECHECK_AND_VITE_BUILD=PASS"
          else
            python3 - <<'PY'
          from pathlib import Path
          import re
          log=Path('/tmp/p02-vue-build.txt').read_text(errors='replace')
          matches=re.findall(r'([A-Za-z0-9_./-]+\.(?:vue|ts|html))\((\d+),(\d+)\):\s*error\s*TS(\d+)', log)
          for filename,line,col,code in matches[:20]:
              print('P02_VUE_ERROR_LOCATION='+filename+':'+line+':TS'+code)
          for row in log.splitlines():
              if 'error TS' in row:
                  location=re.search(r'([A-Za-z0-9_./-]+\.(?:vue|ts|html))(?:\((\d+),(\d+)\)|:(\d+):(\d+))',row)
                  code=re.search(r'TS(\d+)',row)
                  print('P02_VUE_TYPE_ERROR='+((location.group(1)+':'+(location.group(2) or location.group(4))) if location else 'NO_LOCATION')+':'+(('TS'+code.group(1)) if code else 'UNKNOWN'))
          if 'error during build' in log or '[vite]' in log:
              print('P02_VUE_VITE_PHASE=ERROR')
              lines=log.splitlines()
              for i,line in enumerate(lines):
                  if 'error during build:' in line and i+1<len(lines):
                      reason=lines[i+1].strip()
                      reason=re.sub(r'(?i)(?:ghp|github_pat)_[A-Za-z0-9_]+','<redacted>',reason)
                      reason=re.sub(r'/(?:home|runner|tmp)/[^ ]+','<redacted-path>',reason)
                      reason=re.sub(r'[^A-Za-z0-9 _:.()/\\[\\]-]','',reason)
                      print('P02_VUE_VITE_ERROR_CLASS='+reason[:140])
                      break
          if 'Cannot find' in log or 'not found' in log:
              print('P02_VUE_RESOLVE_CLASS=ERROR')
          print('P02_VUE_TYPECHECK_AND_VITE_BUILD=FAIL')
          PY
            exit 73
          fi
      - name: Identify the first failing real SQLite Step-5 command, not another guess
        shell: bash
        env:
          P02_W3_SYNTHETIC_ONLY: '1'
          P02_W3_ENGINE: sqlite
          P02_W3_TRUE_2401_CLI: '1'
        run: |
          set -Eeuo pipefail
          umask 077
          cd "$GITHUB_WORKSPACE/p02-source"
          test "$(git rev-parse HEAD)" = c30f27b628403b1e1731a8ff95d2d2184468739c
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php-cli php-sqlite3 php-mysql php-mbstring php-xml php-curl php-zip composer >/tmp/p02-native-deps-probe.txt 2>&1
          if ! composer --working-dir=modern/laravel install --no-dev --no-scripts --no-plugins --prefer-dist --no-interaction --no-progress >/tmp/p02-native-composer-probe.txt 2>&1; then
            echo "P02_NATIVE_SQLITE_DIAG_SETUP=COMPOSER_FAILED"; exit 81
          fi
          echo "P02_NATIVE_SQLITE_DIAG_SETUP=PASS"
          python3 - <<'PY'
          import os, subprocess, sys
          from pathlib import Path
          root = Path.cwd()
          workflow = (root / ".depot/workflows/p02-w3-integrated-exact.yml").read_text()
          lines = workflow.splitlines()
          index = next(i for i,line in enumerate(lines)
              if line.strip() == "- name: Native Laravel and real SQLite 2401 candidates")
          run_start = next(i for i in range(index+1,len(lines))
              if lines[i].strip() == "run: |")
          commands = []
          for i in range(run_start+1,len(lines)):
              line=lines[i]
              if line and not line.startswith("          "):
                  break
              if line.strip() and not line.strip().startswith("#"):
                  commands.append((i+1,line[10:]))
          if len(commands) < 45 or len(commands) > 110:
              print("P02_SQLITE_STAGE5_COMMAND_SET=INVALID")
              sys.exit(86)
          env = dict(os.environ)
          env["P02_W3_VENDOR_AUTOLOAD"] = str(root/"modern/laravel/vendor/autoload.php")
          env["GITHUB_WORKSPACE"] = str(root)
          allowed = {"set","python3","php","echo"}
          for line_no,command in commands:
              program=command.split()[0]
              if program not in allowed or "\\" in command or "<<" in command:
                  print(f"P02_SQLITE_STAGE5_COMMAND_UNSUPPORTED_LINE={line_no}")
                  sys.exit(85)
              if program == "set":
                  continue
              try:
                  result=subprocess.run(["bash","-Eeuo","pipefail","-c",command],
                      cwd=root,env=env,capture_output=True,text=True,timeout=240)
              except subprocess.TimeoutExpired:
                  print(f"P02_SQLITE_STAGE5_TIMEOUT_LINE={line_no}")
                  sys.exit(84)
              if result.returncode:
                  print(f"P02_SQLITE_STAGE5_FIRST_FAIL_LINE={line_no}")
                  print(f"P02_SQLITE_STAGE5_FIRST_FAIL_EXIT={result.returncode}")
                  print("P02_SQLITE_STAGE5_FIRST_FAIL_PROGRAM="+program)
                  sys.exit(1)
          print("P02_SQLITE_STAGE5_ALL_SOURCE_COMMANDS=PASS")
          PY

      - name: Cleanup private checkout and diagnostics
        if: always()
        shell: bash
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/gov-doc-policy" "$GITHUB_WORKSPACE/p02-source"
          rm -f -- /tmp/p02-naming-guard.txt /tmp/p02-gov-rule-test.txt /tmp/p02-workspace-tests.txt /tmp/p02-npm-dependencies.txt /tmp/p02-vue-build.txt /tmp/p02-w4-tests.txt
          rm -f -- /tmp/p02-native-deps-probe.txt /tmp/p02-native-composer-probe.txt /tmp/p02-atomic-policy-probe.txt /tmp/p02-atomic-runtime-probe.txt
          echo "P02_PRIVATE_SOURCE_WORKSPACE_CLEANUP=PASS"
