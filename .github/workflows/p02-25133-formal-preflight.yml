name: P02 v2.5.133 final SQL owner recovery and next-version proof
on:
  push:
    branches: [p02-25133-formal-preflight-20261120]
    paths: [.github/workflows/p02-25133-formal-preflight.yml]
permissions:
  contents: read
concurrency:
  group: p02-25133-sql-recovery-exact
  cancel-in-progress: false
jobs:
  p02-sql-runtime-recovery:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.ref == 'refs/heads/p02-25133-formal-preflight-20261120'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: p02_w3_disposable_only
          MYSQL_ROOT_HOST: '%'
        ports: [33306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=25
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: p02_w3_disposable_only
          MARIADB_ROOT_HOST: '%'
        ports: [33307:3306]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=25
    steps:
      - name: Check existing private source read credential without disclosure
        shell: bash
        env:
          READ_CAPABILITY: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_CAPABILITY" || { echo 'P02_READ_CAPABILITY=MISSING'; exit 61; }
          echo 'P02_READ_CAPABILITY=PRESENT'
      - name: Ephemeral checkout exact product and disable source persistence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: d0cac2fb109f20dc3a4e13ae7ec24443c277bbab
          path: p02-source
          fetch-depth: 0
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Install pinned native PHP Composer and compiled Vue dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          cd p02-source
          test "$(git rev-parse HEAD)" = "d0cac2fb109f20dc3a4e13ae7ec24443c277bbab"
          test "$(cat VERSION)" = "2.5.133"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php-cli php-cgi php-sqlite3 php-mysql php-mbstring php-xml php-curl php-zip composer python3-venv sqlite3 >/tmp/p02-native-deps.txt 2>&1
          php -r 'exit(PHP_VERSION_ID>=80300&&extension_loaded("pdo_sqlite")&&extension_loaded("pdo_mysql")&&extension_loaded("zip")?0:1);'
          composer --working-dir=modern/laravel install --no-dev --no-scripts --no-plugins --prefer-dist --no-interaction --no-progress >/tmp/p02-native-composer.txt 2>&1
          npm ci --prefix modern/inertia-page --no-audit --no-fund >/tmp/p02-native-npm.txt 2>&1
          npm run build --prefix modern/inertia-page >/tmp/p02-native-vue.txt 2>&1
          php -l modern/laravel/w3-install-preview-router.php >/dev/null
          python3 -B scripts/p02_w3_source_gate.py >/tmp/p02-sql-source-gate.txt 2>&1
          echo "P02_SQL_NATIVE_RUNTIME_LOCKED=PASS"
      - name: MySQL 8.4 real final FULL Owner Atomic and persisted SQL backup recovery
        shell: bash
        env:
          P02_W3_SYNTHETIC_ONLY: '1'
          P02_W3_ENGINE: mysql
          P02_W3_USER: root
          P02_W3_PASS: p02_w3_disposable_only
          P02_W3_DSN: mysql:host=127.0.0.1;port=33306;dbname=p02_w3_mysql;charset=utf8mb4
        run: |
          set -Eeuo pipefail
          umask 077
          cd p02-source
          export P02_W3_VENDOR_AUTOLOAD="$PWD/modern/laravel/vendor/autoload.php"
          if python3 -B tests/integration/p02_w3_app_atomic_from_bundle.py >/tmp/p02-mysql-atomic.txt 2>&1; then
            echo "P02_MYSQL_FINAL_FULL_NEXT_VERSION_ATOMIC=PASS"
          else
            echo "P02_MYSQL_SQL_GATE_FAILURE=FINAL_FULL_NEXT_ATOMIC"
            tail -n 8 /tmp/p02-mysql-atomic.txt | sed -E 's@/(home|tmp)/[^ :]+@<private-path>@g'
            exit 71
          fi
          if python3 -B tests/integration/p02_w3_persistent_http_sql.py mysql >/tmp/p02-mysql-recovery.txt 2>&1; then
            grep -Fqx 'P02_W3_SQL_PERSISTENT_MYSQL_HTTP_OWNER_CSRF_CUD_SEARCH_RESTART=PASS' /tmp/p02-mysql-recovery.txt
            echo "P02_MYSQL_SQL_PERSISTENT_HTTP_AND_BACKUP_RECOVERY=PASS"
          else
            echo "P02_MYSQL_SQL_GATE_FAILURE=PERSISTENT_HTTP_RECOVERY"
            tail -n 12 /tmp/p02-mysql-recovery.txt | sed -E 's@/(home|tmp)/[^ :]+@<private-path>@g'
            P02_W3_DSN='mysql:host=127.0.0.1;port=33306;dbname=p02_w3_persist_mysql;charset=utf8mb4' P02_W3_SQL_PERSISTENT_CANDIDATE=1 P02_W3_SQL_2401_CLI=1 php <<'PHP'
          <?php
          require_once getcwd().'/modern/laravel/vendor/autoload.php';
          require_once getcwd().'/modern/laravel/P02W3EngineSandbox.php';
          require_once getcwd().'/modern/laravel/P02W3PersistentSql.php';
          $stage='OPEN';
          try {
              $pdo=P02W3PersistentSql::open();
              $stage='STATE';
              $state=P02W3PersistentSql::state($pdo);
              echo "P02_MYSQL_DISPOSABLE_REOPEN=PASS;STATE=".$state."\n";
          }catch(Throwable $e){
              $message=$e->getMessage();
              $cause='OTHER';
              foreach ([
                  'SQL safety/search trigger'=>'TRIGGER',
                  'SQL 2401 active schema'=>'SCHEMA_MARKER',
                  'SQL 2401 migration registry'=>'MIGRATION',
                  'SQL 2401 Owner identity'=>'OWNER',
                  'Persistent SQL engine, DB or FK'=>'ENGINE',
                  'SQL structure'=>'STRUCTURE',
                  'SQL 2401'=>'SQL_2401',
                  'No authorized'=>'AUTHORIZATION',
              ] as $pattern=>$value)if(str_contains($message,$pattern)){$cause=$value;break;}
              echo "P02_MYSQL_DISPOSABLE_REOPEN=FAIL;STAGE=".$stage.";CAUSE=".$cause.";CLASS=".
                   ($e instanceof PDOException?'PDO':'RUNTIME')."\n";
          }
          PHP
            exit 72
          fi
      - name: MariaDB 11.8 real final FULL Owner Atomic and persisted SQL backup recovery
        shell: bash
        env:
          P02_W3_SYNTHETIC_ONLY: '1'
          P02_W3_ENGINE: mariadb
          P02_W3_USER: root
          P02_W3_PASS: p02_w3_disposable_only
          P02_W3_DSN: mysql:host=127.0.0.1;port=33307;dbname=p02_w3_mariadb;charset=utf8mb4
        run: |
          set -Eeuo pipefail
          umask 077
          cd p02-source
          export P02_W3_VENDOR_AUTOLOAD="$PWD/modern/laravel/vendor/autoload.php"
          if python3 -B tests/integration/p02_w3_app_atomic_from_bundle.py >/tmp/p02-mariadb-atomic.txt 2>&1; then
            echo "P02_MARIADB_FINAL_FULL_NEXT_VERSION_ATOMIC=PASS"
          else
            echo "P02_MARIADB_SQL_GATE_FAILURE=FINAL_FULL_NEXT_ATOMIC"
            tail -n 8 /tmp/p02-mariadb-atomic.txt | sed -E 's@/(home|tmp)/[^ :]+@<private-path>@g'
            exit 73
          fi
          if python3 -B tests/integration/p02_w3_persistent_http_sql.py mariadb >/tmp/p02-mariadb-recovery.txt 2>&1; then
            grep -Fqx 'P02_W3_SQL_PERSISTENT_MARIADB_HTTP_OWNER_CSRF_CUD_SEARCH_RESTART=PASS' /tmp/p02-mariadb-recovery.txt
            echo "P02_MARIADB_SQL_PERSISTENT_HTTP_AND_BACKUP_RECOVERY=PASS"
          else
            echo "P02_MARIADB_SQL_GATE_FAILURE=PERSISTENT_HTTP_RECOVERY"
            tail -n 12 /tmp/p02-mariadb-recovery.txt | sed -E 's@/(home|tmp)/[^ :]+@<private-path>@g'
            exit 74
          fi
      - name: Delete temporary private source and diagnostics
        if: always()
        shell: bash
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/p02-source"
          rm -f -- /tmp/p02-sql-source-gate.txt
          rm -f -- /tmp/p02-native-deps.txt /tmp/p02-native-composer.txt /tmp/p02-native-npm.txt /tmp/p02-native-vue.txt /tmp/p02-mysql-atomic.txt /tmp/p02-mysql-recovery.txt /tmp/p02-mariadb-atomic.txt /tmp/p02-mariadb-recovery.txt
          echo "P02_PRIVATE_SOURCE_WORKSPACE_CLEANUP=PASS"
