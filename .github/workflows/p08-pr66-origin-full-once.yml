name: P08 PR66 exact first-install HTTPS Origin full-package one-shot
on:
  pull_request:
    paths:
      - .github/workflows/p08-pr66-origin-full-once.yml
      - scripts/p08_pr66_origin_http_smoke.py
permissions:
  contents: read
jobs:
  isolated-first-install-origin:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-pr66-origin-first-install-20261118' && github.event.pull_request.base.ref == 'main' && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout registered disposable public test lane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact private P08 PR66 source into ephemeral workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 4fed45ddc013d3d4dc0f92345f78db3842616dde
          path: p08
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Checkout canonical GOV-DOC structural delivery gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          path: gov
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: PHP 8.4 Composer and runtime extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: zip,curl,mbstring,sqlite3,pdo_sqlite,pdo_mysql,openssl,dom,intl,fileinfo
          coverage: none
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: p08/package-lock.json
      - name: Exact branch PHP source and security regression tests
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(id -u)" -ne 0
          test "$(git -C p08 rev-parse HEAD)" = 4fed45ddc013d3d4dc0f92345f78db3842616dde
          test "$(cat p08/VERSION)" = "0.1.7"
          php -l p08/src/Installation/SetupGuard.php
          php -l p08/public/setup.php
          php -l p08/tests/test_setup_guard.php
          php -l p08/tests/test_setup_experience_contract.php
          (cd p08 && php tests/test_setup_guard.php && php tests/test_setup_experience_contract.php && php tests/test_site_domain_portability.php && php tests/test_setup_preflight.php)
          (cd p08 && python3 scripts/check_stack_contract.py --phase foundation)
          echo P08_R176_EXACT_PATCH_GUARD_AND_SECURITY_NEGATIVES=PASS
      - name: Build real source-bound disposable candidate Clean FULL
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --prefix p08 --ignore-scripts --no-audit --no-fund
          npm run build --prefix p08
          composer install --working-dir=p08 --no-dev --no-scripts --prefer-dist --no-interaction --no-progress --optimize-autoloader
          composer check-platform-reqs --working-dir=p08 --no-dev
          test -z "$(git -C p08 status --porcelain --untracked-files=all)"
          mkdir -m 700 "$RUNNER_TEMP/p08-pr66-zip" "$RUNNER_TEMP/p08-pr66-unpack"
          python3 p08/scripts/build_full.py --source p08 --output "$RUNNER_TEMP/p08-pr66-zip/P08_PR66_CANDIDATE_ONLY_FULL.zip" --version 0.1.7 --source-sha 4fed45ddc013d3d4dc0f92345f78db3842616dde --governance-root gov
          unzip -q "$RUNNER_TEMP/p08-pr66-zip/P08_PR66_CANDIDATE_ONLY_FULL.zip" -d "$RUNNER_TEMP/p08-pr66-unpack"
          test "$(sha256sum "$RUNNER_TEMP/p08-pr66-zip/P08_PR66_CANDIDATE_ONLY_FULL.zip" | cut -d' ' -f1)" != ""
          echo P08_R176_REAL_FULL_CANDIDATE_BUILD_STRUCTURAL_GATE=PASS_NO_RELEASE
      - name: Browser-like HTTPS GET POST actual extracted candidate and attacks
        shell: bash
        env:
          P08_ISOLATED_INSTALL_TEST: 'YES'
        run: |
          set -Eeuo pipefail
          python3 scripts/p08_pr66_origin_http_smoke.py "$RUNNER_TEMP/p08-pr66-unpack"
          echo P08_R176_OWNER_SITE_PRODUCTION=NOT_TOUCHED
      - name: Clean ephemeral private source and candidate artifacts
        if: always()
        shell: bash
        run: |
          rm -rf -- p08 gov "$RUNNER_TEMP/p08-pr66-zip" "$RUNNER_TEMP/p08-pr66-unpack"
          test ! -e p08 && test ! -e gov
