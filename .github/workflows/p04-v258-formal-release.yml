name: P04 VF Infra V2.5.8 Formal Release

on:
  push:
    paths:
      - '.github/workflows/p04-v258-formal-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p04-v258-formal-release
  cancel-in-progress: false

env:
  TARGET_REPOSITORY: llhzx2018/vf-infra
  TARGET_COMMIT: 4a18a61c21455184c67aa4a3e0957283674ae2d7
  TARGET_TREE: 89f322a309f8c51c9869864800a6980cb9bfbb94
  TARGET_TAG: v2.5.8
  TARGET_VERSION: 2.5.8
  SOURCE_VERSION: 2.5.7
  TARGET_SCHEMA: '14'
  EXPECTED_RUNTIME_FILES: '165'
  EXPECTED_RUNTIME_FINGERPRINT: 13e8eeaddf89837f2d370a2e15899e354402042d8bc0c27eccd130ec6ff2855a
  EXPECTED_SOURCE_MANIFEST: 4b4b52a5b0651aeca41433730fa53bbd96392524b6face44940f2405cf864203
  EXPECTED_FULL_BYTES: '445789'
  EXPECTED_FULL_SHA: 554e7dd006631bfbd8c0564452e908b73fe31d5c1c5115679f3fa995e7943e98
  EXPECTED_UPDATE_BYTES: '93560'
  EXPECTED_UPDATE_SHA: 4561bdc3b929e4be58a369cc25335ae4f6c12e9bcde836f7db2fb61eeaa04129
  EXPECTED_ATOMIC_BYTES: '93560'
  EXPECTED_ATOMIC_SHA: 4561bdc3b929e4be58a369cc25335ae4f6c12e9bcde836f7db2fb61eeaa04129
  EXPECTED_REPAIR_BYTES: '250521'
  EXPECTED_REPAIR_SHA: 23477a0d8475887d509a855bc8aaa1218333313a30df6fb9d9e3a627fffca7ad
  EXPECTED_PACKAGE_BYTES: '1661'
  EXPECTED_PACKAGE_SHA: c4f2b87abd9b951eff9291c5e5dd4d4068e4a77f1fd5fca09b73942f472ace99
  EXPECTED_SHA256SUMS_BYTES: '549'
  EXPECTED_SHA256SUMS_SHA: ee6ba104056596678cf1a86f46e32ec1b371ec51e6c0df410186fb4cb5d402e0

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact frozen Product Candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_COMMIT }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-vf-infra

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, fileinfo, sodium, zip, curl, mbstring
          coverage: none

      - name: Verify frozen Product Source Identity
        shell: bash
        working-directory: private-vf-infra
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(tr -d '\r\n' < VERSION)" = "$TARGET_VERSION"
          test "$(find database/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')" = "$TARGET_SCHEMA"
          test ! -e database/migrations/015_v258.sql
          echo P04_V258_FORMAL_EXACT_PRODUCT_IDENTITY_PASS

      - name: Formal rebuild from frozen Candidate and exact sealed identity
        shell: bash
        working-directory: private-vf-infra
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/p04-v258-formal"
          python3 scripts/build-v258-candidate-artifacts.py --output "$OUT"
          req=(
            "$OUT/VF_Infra_V2.5.8_FULL.zip"
            "$OUT/V258_CANDIDATE_ARTIFACT_MANIFEST.json"
            "$OUT/update-set/VF_Infra_V2.5.8_UPDATE.zip"
            "$OUT/update-set/VF_Infra_V2.5.8_ATOMIC.zip"
            "$OUT/update-set/repair-v2.5.8.php"
            "$OUT/update-set/PACKAGE_MANIFEST.json"
            "$OUT/update-set/SHA256SUMS.txt"
            "$OUT/update-set/PRODUCTION_SOURCE_MANIFEST_EXPECTED.txt"
          )
          for f in "${req[@]}"; do test -f "$f" || { echo "V258_FORMAL_ARTIFACT_MISSING $f" >&2; exit 31; }; done
          cmp -s "$OUT/update-set/VF_Infra_V2.5.8_UPDATE.zip" "$OUT/update-set/VF_Infra_V2.5.8_ATOMIC.zip"
          check(){
            local f="$1" bytes="$2" sha="$3"
            test "$(stat -c '%s' "$f")" = "$bytes"
            test "$(sha256sum "$f" | awk '{print $1}')" = "$sha"
          }
          check "$OUT/VF_Infra_V2.5.8_FULL.zip" "$EXPECTED_FULL_BYTES" "$EXPECTED_FULL_SHA"
          check "$OUT/update-set/VF_Infra_V2.5.8_UPDATE.zip" "$EXPECTED_UPDATE_BYTES" "$EXPECTED_UPDATE_SHA"
          check "$OUT/update-set/VF_Infra_V2.5.8_ATOMIC.zip" "$EXPECTED_ATOMIC_BYTES" "$EXPECTED_ATOMIC_SHA"
          check "$OUT/update-set/repair-v2.5.8.php" "$EXPECTED_REPAIR_BYTES" "$EXPECTED_REPAIR_SHA"
          check "$OUT/update-set/PACKAGE_MANIFEST.json" "$EXPECTED_PACKAGE_BYTES" "$EXPECTED_PACKAGE_SHA"
          check "$OUT/update-set/SHA256SUMS.txt" "$EXPECTED_SHA256SUMS_BYTES" "$EXPECTED_SHA256SUMS_SHA"
          (cd "$OUT/update-set" && sha256sum -c SHA256SUMS.txt)
          python3 - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'p04-v258-formal'
          cand=json.loads((root/'V258_CANDIDATE_ARTIFACT_MANIFEST.json').read_text(encoding='utf-8'))
          pkg=json.loads((root/'update-set/PACKAGE_MANIFEST.json').read_text(encoding='utf-8'))
          assert cand['version']=='2.5.8' and cand['source_version']=='2.5.7' and int(cand['schema'])==14
          assert int(cand['runtime_file_count'])==int(os.environ['EXPECTED_RUNTIME_FILES'])
          assert cand['runtime_fingerprint']==os.environ['EXPECTED_RUNTIME_FINGERPRINT']
          assert cand['production_source_manifest_sha256']==os.environ['EXPECTED_SOURCE_MANIFEST']
          assert cand['update_atomic_identical'] is True
          assert pkg['version']=='2.5.8' and pkg['allowed_source_versions']==['2.5.7'] and int(pkg['schema'])==14
          assert pkg.get('schema_change') is False and pkg.get('provider_write_authority_change') is False
          assert pkg['production_source_manifest_sha256']==os.environ['EXPECTED_SOURCE_MANIFEST']
          print('P04_V258_FORMAL_REBUILD_EXACT_SEALED_IDENTITY_PASS')
          PY

      - name: Stage complete formal Release assets
        shell: bash
        working-directory: private-vf-infra
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/p04-v258-formal"; ASSETS="$RUNNER_TEMP/p04-v258-assets"; EVIDENCE="$GITHUB_WORKSPACE/p04-v258-release-evidence"
          rm -rf "$ASSETS" "$EVIDENCE"; mkdir -p "$ASSETS" "$EVIDENCE"
          cp "$OUT/VF_Infra_V2.5.8_FULL.zip" "$ASSETS/"
          cp "$OUT/update-set/VF_Infra_V2.5.8_UPDATE.zip" "$ASSETS/"
          cp "$OUT/update-set/VF_Infra_V2.5.8_ATOMIC.zip" "$ASSETS/"
          cp "$OUT/update-set/repair-v2.5.8.php" "$ASSETS/"
          cp "$OUT/update-set/PACKAGE_MANIFEST.json" "$ASSETS/"
          cp "$OUT/update-set/SHA256SUMS.txt" "$ASSETS/"
          cp "$OUT/update-set/PRODUCTION_SOURCE_MANIFEST_EXPECTED.txt" "$ASSETS/"
          cat > "$ASSETS/RELEASE_NOTES.md" <<'EOF'
          # VF Infra V2.5.8

          V2.5.8 是 Personal Console Precision Optimization 正式维护版本。

          重点改进：
          - V258-DATA-001：建立 Global / Project Scope-aware Summary Contract，修复基础设施概览假 0，并明确区分真实 0 与数据合同错误。
          - Dashboard：完成 5 秒私人决策精修，优先到期、续费、费用与异常，同 Root Cause 告警聚合。
          - Domain Portfolio / Workspace：浅层展示到期、剩余天数、续费价格、自动续费、Registrar 与最高风险。
          - All Assets：统一为 Portfolio → Type-aware Workspace → Context，不再以 Table → Modal 作为主要浏览路径。
          - 费用与续费：风险优先；Provider 账号总费用不冒充 VPS 单机费用，无法可靠映射时显示“未知”。
          - Context Intelligence：只显示当前资源真实存在的提醒、异常、即将发生、关联、最近变化与数据更新时间。
          - 中文优先、导航收正、设计语言统一与 Mobile Portfolio-first 精修。

          Schema 保持 14，无 Migration；没有新增危险 Provider Remote Write 权限。
          正式在线升级仅允许 V2.5.7 → V2.5.8。

          Product Commit: 4a18a61c21455184c67aa4a3e0957283674ae2d7
          Product Tree: 89f322a309f8c51c9869864800a6980cb9bfbb94
          R6 Product Verification: PASS (31983037375)
          R7 Artifact Determinism: PASS (31983979534)
          EOF
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          out=Path(os.environ['RUNNER_TEMP'])/'p04-v258-formal'; assets=Path(os.environ['RUNNER_TEMP'])/'p04-v258-assets'
          cand=json.loads((out/'V258_CANDIDATE_ARTIFACT_MANIFEST.json').read_text(encoding='utf-8'))
          formal={
            'project':'P04 · VF Infra','version':'2.5.8','schema':14,
            'product_commit':os.environ['TARGET_COMMIT'],'product_tree':os.environ['TARGET_TREE'],
            'runtime_file_count':int(os.environ['EXPECTED_RUNTIME_FILES']),
            'runtime_fingerprint':os.environ['EXPECTED_RUNTIME_FINGERPRINT'],
            'production_source_manifest_sha256':os.environ['EXPECTED_SOURCE_MANIFEST'],
            'allowed_source_versions':['2.5.7'],'migration':'NONE','dangerous_provider_remote_write_added':False,
            'r6_product_verification_run':31983037375,'r7_artifact_determinism_run':31983979534,
            'formal_rebuild':'PASS_EXACT_MATCH_TO_SEALED_CANDIDATE','artifacts':cand['artifacts']
          }
          (assets/'FORMAL_ARTIFACT_MANIFEST.json').write_text(json.dumps(formal,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          rel={**formal,'tag':'v2.5.8','release_name':'VF Infra V2.5.8','update_type':'ATOMIC','backup_required':True,'rollback_supported':True,'production_upgrade':'NOT_EXECUTED_AT_RELEASE_TIME'}
          (assets/'RELEASE_MANIFEST.json').write_text(json.dumps(rel,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          names=[p.name for p in assets.iterdir() if p.is_file()]
          (assets/'FORMAL_SHA256SUMS.txt').write_text(''.join(f"{hashlib.sha256((assets/n).read_bytes()).hexdigest()}  {n}\n" for n in sorted(names)),encoding='utf-8')
          (Path(os.environ['GITHUB_WORKSPACE'])/'p04-v258-release-evidence'/'formal-build.json').write_text(json.dumps(formal,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Create immutable Tag and GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        working-directory: private-vf-infra
        run: |
          set -Eeuo pipefail
          ASSETS="$RUNNER_TEMP/p04-v258-assets"
          if gh api "repos/$TARGET_REPOSITORY/git/ref/tags/$TARGET_TAG" >/dev/null 2>&1; then echo V258_TAG_ALREADY_EXISTS_FAIL_CLOSED >&2; exit 70; fi
          if gh release view "$TARGET_TAG" --repo "$TARGET_REPOSITORY" >/dev/null 2>&1; then echo V258_RELEASE_ALREADY_EXISTS_FAIL_CLOSED >&2; exit 71; fi
          gh api --method POST "repos/$TARGET_REPOSITORY/git/refs" -f ref="refs/tags/$TARGET_TAG" -f sha="$TARGET_COMMIT" >/dev/null
          gh release create "$TARGET_TAG" --repo "$TARGET_REPOSITORY" --verify-tag --title 'VF Infra V2.5.8' --notes-file "$ASSETS/RELEASE_NOTES.md" "$ASSETS"/*
          echo P04_V258_FORMAL_RELEASE_CREATED_PASS

      - name: Remote exact Tag Release and Asset readback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        working-directory: private-vf-infra
        run: |
          set -Eeuo pipefail
          ASSETS="$RUNNER_TEMP/p04-v258-assets"; EVIDENCE="$GITHUB_WORKSPACE/p04-v258-release-evidence"
          gh api "repos/$TARGET_REPOSITORY/git/ref/tags/$TARGET_TAG" > "$EVIDENCE/tag.json"
          gh api "repos/$TARGET_REPOSITORY/releases/tags/$TARGET_TAG" > "$EVIDENCE/release.json"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          assets=Path(os.environ['RUNNER_TEMP'])/'p04-v258-assets'; evidence=Path(os.environ['GITHUB_WORKSPACE'])/'p04-v258-release-evidence'
          tag=json.loads((evidence/'tag.json').read_text()); rel=json.loads((evidence/'release.json').read_text())
          assert tag['object']['sha']==os.environ['TARGET_COMMIT']
          assert rel['tag_name']=='v2.5.8' and rel['name']=='VF Infra V2.5.8' and rel['draft'] is False and rel['prerelease'] is False
          remote={a['name']:a for a in rel['assets']}
          local={p.name:(p.stat().st_size,hashlib.sha256(p.read_bytes()).hexdigest()) for p in assets.iterdir() if p.is_file()}
          assert set(remote)==set(local),(sorted(remote),sorted(local))
          checked={}
          for name,(size,sha) in local.items():
            a=remote[name]
            assert a['size']==size,(name,a['size'],size)
            digest=a.get('digest') or ''
            assert digest=='sha256:'+sha,(name,digest,sha)
            checked[name]={'asset_id':a['id'],'bytes':size,'sha256':sha,'github_digest':digest}
          result={'tag':'v2.5.8','tag_target':tag['object']['sha'],'product_tree':os.environ['TARGET_TREE'],'release_id':rel['id'],'published_at':rel['published_at'],'assets':checked,'remote_readback':'PASS','immutable_policy':'DO_NOT_OVERWRITE'}
          (evidence/'remote-release-verification.json').write_text(json.dumps(result,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,sort_keys=True)); print('P04_V258_REMOTE_RELEASE_READBACK_PASS')
          PY

      - name: Remove all private source and formal package bytes
        if: always()
        shell: bash
        run: |
          rm -rf private-vf-infra
          test ! -e private-vf-infra
          rm -rf "$RUNNER_TEMP/p04-v258-formal" "$RUNNER_TEMP/p04-v258-assets"

      - name: Upload public-safe Formal Release evidence only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: P04-VF-Infra-V2.5.8-Formal-Release-Evidence
          path: p04-v258-release-evidence
          if-no-files-found: error
          retention-days: 14
