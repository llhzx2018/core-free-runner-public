name: P07 release97 sealed formal publication (manual archive)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p07-release97-formal-publication
  cancel-in-progress: false
jobs:
  publish:
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_REPO: llhzx2018/core-free-runner-public
      RELEASE_TAG: p07-v0.1.0-release97
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact merged bytes and fail-closed trust chain
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN" || { echo P07_RELEASE_WRITE_CAPABILITY_MISSING; exit 78; }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api repos/$RELEASE_REPO/git/ref/heads/main --jq '.object.sha')" = "$GITHUB_SHA" || { echo P07_MAIN_MOVED; exit 78; }
          root=dist/p07/0.1.0/overlay
          care=packages/p07-system-care/0.1.0-rc66
          test "$(cat "$root/BUILD_ID")" = '0.1.0-release97'
          test "$(cat "$care/VERSION")" = '0.1.0-rc66'
          test "$(git hash-object "$root/RUNTIME.gitblob")" = ace8208b99f523712cf4ffa842fab775aa0e20e2
          test "$(git hash-object "$root/MANIFEST.gitblob")" = fa96deffe34fd83651bc802b6d1a778df130c99d
          test "$(git hash-object "$care/MANIFEST.gitblob")" = 5ed5effc3ffe6df069123374d774c85d0470ff0f
          (cd "$root"; while read -r sha file; do test "$(git hash-object "$file")" = "$sha"; done < RUNTIME.gitblob)
          (cd "$root"; while read -r sha file; do test "$(git hash-object "$file")" = "$sha"; done < MANIFEST.gitblob)
          (cd "$care"; while read -r sha file; do test "$(git hash-object "$file")" = "$sha"; done < MANIFEST.gitblob)
          test "$(git hash-object installers/p07-final.sh)" = cf40589f1fd5e82f7b81ac8b4c523629476a2cc9
          test "$(git hash-object installers/p07.sh)" = a13884c690e6d530ea43acda8734ccabf8c22fb8
          test "$(git hash-object installers/p07-toolbox.sh)" = e44d04738c3370eef384acdca5864bb905393ee3
          test "$(git hash-object installers/p07-system-care.sh)" = af03aad9273c9eeaafa46b4ffac618d6ef367555
          grep -Fq 'EXPECTED_BLOB="cf40589f1fd5e82f7b81ac8b4c523629476a2cc9"' installers/p07.sh
          grep -Fq 'EXPECTED_BUILD_ID="0.1.0-release97"' installers/p07-final.sh
          grep -Fq 'RUNTIME_MANIFEST_BLOB="ace8208b99f523712cf4ffa842fab775aa0e20e2"' installers/p07-final.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release97"' installers/p07-toolbox.sh
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc66"' installers/p07-toolbox.sh
          grep -Fq "MANIFEST_BLOB='5ed5effc3ffe6df069123374d774c85d0470ff0f'" installers/p07-system-care.sh
          bash -n installers/p07.sh installers/p07-final.sh installers/p07-toolbox.sh installers/p07-system-care.sh
          echo P07_RELEASE97_EXACT_MERGED_PREFLIGHT_PASS
      - name: Formal GitHub release with exact target readback
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view "$RELEASE_TAG" -R "$RELEASE_REPO" >/dev/null 2>&1; then
            test "$(gh api repos/$RELEASE_REPO/git/ref/tags/$RELEASE_TAG --jq '.object.sha')" = "$GITHUB_SHA" || { echo P07_RELEASE_TAG_COLLISION; exit 81; }
          else
            gh release create "$RELEASE_TAG" -R "$RELEASE_REPO" --target "$GITHUB_SHA" \
              --title 'P07 · release97 · 正式网站数据工具与 System Care rc66' \
              --notes 'P07 release97 / System Care rc66. Exact private candidate 9ca2caac49fe79f9d10420d689cdf6b7a65047f5; merged private source main 8b037df9e993d4d5dc9b48feadf7653079825bdb. Disposable MySQL 8.4 → MariaDB 11.8 full 84-table schema and 9-data-table fixture parity PASS; strict altered row, index, collation, and trigger negative cases BLOCK. MariaDB 11.8 integer SHOW CREATE DEFAULT quote presentation is normalized only for canonical numeric defaults on integer-typed columns, never string defaults, expressions or changed numbers. SQL_SHAPE_V1 emits only fixed aggregate numeric categories for unresolved versioned guards; unknown DDL/guards remain blocked. Exact-source tests, clean install, release96 to release97 upgrade, idempotency, corrupt download rejection and rollback PASS. Real CP2 migration verification is NOT_PROVEN; user must manually install and resume after this release. Old CP, CP2 data and DNS have not been touched by publishing.'
          fi
          test "$(gh api repos/$RELEASE_REPO/git/ref/tags/$RELEASE_TAG --jq '.object.sha')" = "$GITHUB_SHA"
          test "$(gh api repos/$RELEASE_REPO/releases/tags/$RELEASE_TAG --jq '.target_commitish')" = "$GITHUB_SHA"
          test "$(gh api repos/$RELEASE_REPO/releases/tags/$RELEASE_TAG --jq '.draft')" = false
          test "$(gh api repos/$RELEASE_REPO/releases/tags/$RELEASE_TAG --jq '.prerelease')" = false
          echo P07_RELEASE97_GITHUB_RELEASE_PASS
      - name: Upload exact installer assets and read back identities
        shell: bash
        run: |
          set -Eeuo pipefail
          gh release upload "$RELEASE_TAG" -R "$RELEASE_REPO" --clobber installers/p07.sh installers/p07-final.sh installers/p07-toolbox.sh installers/p07-system-care.sh
          mkdir -p /tmp/p07-release97-assets
          gh release download "$RELEASE_TAG" -R "$RELEASE_REPO" --dir /tmp/p07-release97-assets
          for name in p07.sh p07-final.sh p07-toolbox.sh p07-system-care.sh; do
            test -f "/tmp/p07-release97-assets/$name"
            test "$(git hash-object "/tmp/p07-release97-assets/$name")" = "$(git hash-object "installers/$name")"
          done
          echo P07_RELEASE97_ASSET_READBACK_PASS
      - name: Public installer raw-byte distribution readback
        shell: bash
        run: |
          set -Eeuo pipefail
          remote="https://raw.githubusercontent.com/$RELEASE_REPO/$GITHUB_SHA"
          for item in 'installers/p07.sh a13884c690e6d530ea43acda8734ccabf8c22fb8' 'installers/p07-final.sh cf40589f1fd5e82f7b81ac8b4c523629476a2cc9' 'installers/p07-toolbox.sh e44d04738c3370eef384acdca5864bb905393ee3' 'installers/p07-system-care.sh af03aad9273c9eeaafa46b4ffac618d6ef367555' 'dist/p07/0.1.0/overlay/RUNTIME.gitblob ace8208b99f523712cf4ffa842fab775aa0e20e2'; do
            read -r file sha <<< "$item"
            curl -fsSL --retry 5 --retry-delay 2 --proto '=https' --tlsv1.2 "$remote/$file" -o /tmp/p07-release97-remote
            test "$(git hash-object /tmp/p07-release97-remote)" = "$sha"
          done
          echo P07_RELEASE97_REMOTE_DISTRIBUTION_READBACK_PASS
