name: P01 V2.47.282 Health Refresh Proof
on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/p01-v247282-health-refresh-proof.yml"]
permissions:
  contents: read
jobs:
  proof:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'proof(P01): V2.47.282 health refresh')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd nodejs >/dev/null
      - name: Clone candidate and stable
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" candidate
          git -C candidate fetch -q origin d2c00b0e033366df8d76e5dcf125daf909531469
          git -C candidate checkout -q --detach d2c00b0e033366df8d76e5dcf125daf909531469
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.282"
          git clone -q --depth 1 --branch v2.47.281 "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" stable
          echo P01_V247282_EXACT_SOURCE=PASS
      - name: Syntax and functional click proof
        run: |
          set -Eeuo pipefail
          php -l candidate/src/system-health.php
          node --check candidate/src/assets/system.js
          node --check candidate/tests/unit/system_health_manual_refresh_v247282_runtime.js
          cd candidate
          php tests/unit/system_health_manual_refresh_v247282_contract.php
          node tests/unit/system_health_manual_refresh_v247282_runtime.js
          php tests/unit/admin_system_health_page9_polish_contract.php
          php tests/unit/admin_system_health_r18_contract.php
          php tests/unit/admin_system_closure_contract.php
          php tests/unit/system_health_cron_diagnostic_contract.php
          php tests/unit/system_health_seo_root_privacy_false_positive_contract.php
          echo P01_V247282_FOCUSED=PASS
      - name: Canonical regression
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate stable --require-zero-debt | tee /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/canonical.txt
          echo P01_V247282_CANONICAL=PASS
      - name: Scope
        run: |
          set -Eeuo pipefail
          git -C candidate diff --name-only bf1371778a2a3c5402847d4b2d7bd5ef551af900..d2c00b0e033366df8d76e5dcf125daf909531469 | tee /tmp/changed
          grep -Fx 'src/system-health.php' /tmp/changed
          grep -Fx 'src/assets/system.js' /tmp/changed
          grep -Fx 'src/assets/admin-consolidation.css' /tmp/changed
          if grep -E '(^|/)(migrations|schema|auth|security|update-manager)(/|$)' /tmp/changed; then exit 1; fi
          echo P01_V247282_BOUNDED_SCOPE=PASS
          echo PRODUCTION_WRITE=NO
