name: P05 Provider Scoped Search Trust Exact Source Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p05-provider-trust-exact-86f48b9.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p05-provider-trust-exact:
    if: github.event_name == 'pull_request' && github.head_ref == 'tmp/p05-provider-trust-exact-86f48b9-20260831'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: vfseo_test
          POSTGRES_USER: vfseo
          POSTGRES_PASSWORD: vfseo-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vfseo -d vfseo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      P05_EXACT_SOURCE: 86f48b91f63324791cc1d5bf30109bb3e22ac101
      P05_BASE_MAIN: c4cd016446015523b48a2d9f5ade074e397b0278
      DATABASE_URL: postgresql://vfseo:vfseo-test-password@127.0.0.1:5432/vfseo_test
      VF_MASTER_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NODE_ENV: test
      APP_ENV: test
      VF_DATABASE_PROVIDER: sqlite
      VF_SECURE_COOKIES: 'false'
      VF_REQUIRE_HTTPS: 'false'
      VF_ADMIN_USERNAME: admin
      VF_ADMIN_PASSWORD: php-ci-portable-password-123

    steps:
      - name: Checkout exact private P05 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.P05_EXACT_SOURCE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact source and scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_EXACT_SOURCE"
          git cat-file -e "$P05_BASE_MAIN^{commit}"
          git diff --check "$P05_BASE_MAIN" "$P05_EXACT_SOURCE" -- '*.ts' '*.tsx' '*.css' '*.mjs' '*.php' '*.json' '*.yml' '*.yaml'
          test "$(cat VERSION)" = '1.1.12'
          node -e "const p=require('./package.json');if(p.version!=='1.1.12'||!p.scripts['test:php-product-parity'])process.exit(1)"
          grep -F "productProviderSourceState(sources, 'GSC')" src/server/product-optimization.ts >/dev/null
          grep -F "providerSourceState(\$sources, 'GSC')" php/src/ProductOptimizationService.php >/dev/null
          echo 'P05_PROVIDER_TRUST_EXACT_SOURCE_BINDING=PASS'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          echo 'P05_PROVIDER_TRUST_NPM_CI=PASS'

      - name: Engineering regression
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run lint
          npm run typecheck
          npm run migrate
          npm run verify:schema
          npm run test
          npm run build
          echo 'P05_PROVIDER_TRUST_ENGINEERING_REGRESSION=PASS'

      - name: PHP runtime syntax and extension gate
        shell: bash
        run: |
          set -Eeuo pipefail
          php -v
          php -r 'foreach(["pdo_sqlite","curl"] as $e){if(!extension_loaded($e)){fwrite(STDERR,"missing:$e\n");exit(1);}} if(!class_exists("ZipArchive")){fwrite(STDERR,"missing:ZipArchive\n");exit(1);}'
          npm run php:lint
          echo 'P05_PROVIDER_TRUST_PHP_LINT=PASS'

      - name: PHP provider-scoped Product Runtime parity contract
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run test:php-product-parity | tee /tmp/p05-provider-trust-php.log
          grep -F 'P05_PHP_PROVIDER_SCOPED_SEARCH_TRUST=PASS' /tmp/p05-provider-trust-php.log >/dev/null
          grep -F 'P05_PHP_PROTECTED_STATE=PASS' /tmp/p05-provider-trust-php.log >/dev/null
          echo 'P05_PROVIDER_TRUST_PHP_PARITY=PASS'

      - name: Existing PHP security and HTTP regression
        shell: bash
        run: |
          set -Eeuo pipefail
          php php/tests/security-interop.php
          bash php/tests/http-smoke.sh
          echo 'P05_PROVIDER_TRUST_PHP_HTTP_SECURITY=PASS'

      - name: Formal PHP staging and package gate
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run build:php-release
          npm run php:release:gate
          test -f build/vf-seo-php-release/php/src/ProductOptimizationService.php
          grep -F "providerSourceState(\$sources, 'GSC')" build/vf-seo-php-release/php/src/ProductOptimizationService.php >/dev/null
          echo 'P05_PROVIDER_TRUST_PHP_RELEASE_STAGING=PASS'

      - name: CloudPanel/browser-first compatibility baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          bash php/tests/cloudpanel-root-smoke.sh build/vf-seo-php-release
          VF_INSTALL_ROOT=build/vf-seo-php-release bash php/tests/browser-install-smoke.sh
          echo 'P05_PROVIDER_TRUST_CLOUDPANEL_BASELINE=PASS'

      - name: Source and security gates
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run source:gate
          npm run scope:gate
          if [ -f scripts/security-gate.mjs ]; then
            npm run dependency:gate
            npm audit --audit-level=high
            npm run security:gate
          fi
          echo 'P05_PROVIDER_TRUST_SOURCE_SECURITY=PASS'

      - name: Seal exact source result
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_EXACT_SOURCE"
          echo 'P05_PROVIDER_SCOPED_SEARCH_TRUST_EXACT_SOURCE_GATE=PASS'
          echo "P05_EXACT_SOURCE=$P05_EXACT_SOURCE"
          echo 'P05_RELEASE_WRITE=0'
          echo 'P05_PRODUCTION_WRITE=0'
