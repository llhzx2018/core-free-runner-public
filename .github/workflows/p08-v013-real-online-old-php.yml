name: P08 v013 original shipped v012 PHP REAL published 607b stable channel check
on:
  pull_request:
    paths: [.github/workflows/p08-v013-real-online-old-php.yml]
permissions:
  contents: read
jobs:
  official-online-old-v012-php:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-v013-real-issued-v012-online-channel-20261120' && github.event.pull_request.base.ref == 'main' && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - name: Exact unmodified official issued old v012 PHP
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: dac7bc1d5410c077f32e522eb5740537f618ef9d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: old
      - name: PHP 8.4 real system cURL HTTPS CA and OpenSSL
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl,openssl
          coverage: none
      - name: Verify published P08-only stable channel, official assets and immutable old Tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          test "$(id -u)" != 0
          test "$(git -C old rev-parse HEAD)" = dac7bc1d5410c077f32e522eb5740537f618ef9d
          test "$(gh api repos/llhzx2018/core-updates/contents/projects/P08-ADOPS.json --jq .sha)" = 288f2692060601c2493864de4b1323bbafeb6ce5
          test "$(gh api repos/llhzx2018/vf-adops/git/ref/tags/v0.1.13 --jq .object.sha)" = 8b385fecd132a02ac79f5b67e670783e98997c3e
          test "$(gh api repos/llhzx2018/vf-adops/releases/tags/v0.1.13 --jq .id)" = 452233612
          test "$(gh api repos/llhzx2018/vf-adops/git/ref/tags/v0.1.12 --jq .object.sha)" = dac7bc1d5410c077f32e522eb5740537f618ef9d
          gh api repos/llhzx2018/core-updates/contents/projects/P08-ADOPS.json --jq .content | base64 -d > "$RUNNER_TEMP/v013-channel-verified.json"
          python3 - "$RUNNER_TEMP/v013-channel-verified.json" <<'PY'
          import json,sys
          c=json.load(open(sys.argv[1]))
          assert c['project_id']=='P08' and c['component_id']=='APP'
          assert c['target_version']=='0.1.13'
          assert c['source_sha']=='dac7bc1d5410c077f32e522eb5740537f618ef9d'
          assert c['source_full_manifest_sha256']=='607b3a02a20021c0747d42440497b7e9e3e0fe39040869f475ba22f9f19437e9'
          assert c['from_versions']==['0.1.12']
          assert c['target_sha']=='8b385fecd132a02ac79f5b67e670783e98997c3e'
          assert c['asset_id']==770296935 and c['asset_bytes']==8355163
          assert c['asset_sha256']=='6982a7b44873ac825e6c252b309d8f11a9ade67e67f5b8b6467538a46ef71b2a'
          assert c['full_asset_id']==770296940 and c['full_asset_bytes']==8366960
          assert c['full_asset_sha256']=='f8075f065d1413c984f80ef7531242cfc894bf272e90f6d89282074f6617c1ec'
          assert c['schema_from']==c['schema_to']=='1.1'
          assert c['backup_required'] is True and c['rollback_supported'] is True and c['production_auto_apply'] is False
          print('P08_V013_ACTUAL_STABLE_CHANNEL_ONLY_AUTHENTIC_607B=PASS')
          PY
      - name: ORIGINAL v012 PHP actual online cURL GitHub check positive, current and wrong-source negatives
        shell: bash
        env:
          P08_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          php <<'PHP'
          <?php
          declare(strict_types=1);
          require 'old/src/Upgrade/OwnerNextReleaseGateway.php';
          $token=(string)getenv('P08_PRIVATE_READ_TOKEN');
          if(strlen($token)<20)throw new RuntimeException('P08_V013_READ_SECRET_UNAVAILABLE');
          // Unmodified ORIGINAL released v0.1.12 PHP, real cURL, system TLS
          // trust to official core-updates/main and official GitHub Release.
          $gw=new VF\AdOps\Upgrade\OwnerNextReleaseGateway();
          $origin=[
            'version'=>'0.1.12',
            'source_sha'=>'dac7bc1d5410c077f32e522eb5740537f618ef9d',
            'source_full_manifest_sha256'=>'607b3a02a20021c0747d42440497b7e9e3e0fe39040869f475ba22f9f19437e9',
          ];
          $x=$gw->check($token,$origin);
          if(($x['status']??null)!=='OFFICIAL_NEXT_VERIFIED_NOT_STAGED'
            ||($x['can_install']??null)!==false
            ||($x['source_version']??null)!=='0.1.12'
            ||($x['target_version']??null)!=='0.1.13'
            ||($x['source_sha']??null)!==$origin['source_sha']
            ||($x['source_full_manifest_sha256']??null)!==$origin['source_full_manifest_sha256']
            ||($x['target_sha']??null)!=='8b385fecd132a02ac79f5b67e670783e98997c3e'
            ||($x['release_id']??null)!==452233612
            ||($x['asset_id']??null)!==770296935
            ||($x['asset_bytes']??null)!==8355163
            ||($x['asset_sha256']??null)!=='6982a7b44873ac825e6c252b309d8f11a9ade67e67f5b8b6467538a46ef71b2a')
            throw new RuntimeException('P08_V013_ORIGINAL_V012_REAL_ONLINE_OFFER_NOT_VERIFIED');
          echo "P08_V013_ORIGINAL_SHIPPED_V012_PHP_REAL_ONLINE_607B_OFFER=PASS\n";
          $current=[
            'version'=>'0.1.13',
            'source_sha'=>'8b385fecd132a02ac79f5b67e670783e98997c3e',
            'source_full_manifest_sha256'=>'c7ea39bba377507c335031801a7f1d193de0ddd04715547abdb067928ef7cd5d',
          ];
          $now=$gw->check($token,$current);
          if(($now['status']??null)!=='OFFICIAL_VERSION_CURRENT'
             ||($now['can_install']??null)!==false)
             throw new RuntimeException('P08_V013_CURRENT_REINSTALL_REFUSAL_FAILED');
          echo "P08_V013_REAL_ONLINE_ALREADY_CURRENT_NO_REPEAT=PASS\n";
          foreach([
            'source_sha'=>str_repeat('a',40),
            'source_full_manifest_sha256'=>'4df28b7a9dcfbaf4c0bec18009955fe1b0a531b114d2ac1b1a3b45e52a072345a2ea0f110',
          ] as $k=>$v){
             $wrong=$origin;$wrong[$k]=$v;
             try{
                $gw->check($token,$wrong);
                throw new RuntimeException('P08_V013_UNSUPPORTED_ORIGIN_ACCEPTED');
             } catch(RuntimeException $e){
                if($e->getMessage()!=='P08_NEXT_SOURCE_OR_SCHEMA_UNSUPPORTED')throw $e;
             }
          }
          echo "P08_V013_REAL_ONLINE_WRONG_SHA_AND_CLEAN_FULL_REFUSED=PASS\n";
          echo "P08_V013_REAL_ONLINE_NO_DOWNLOAD_NO_APPLY_PRODUCTION_UNTOUCHED=PASS\n";
          PHP
      - name: Always dispose transient old private PHP and channel data
        if: always()
        shell: bash
        run: |
          rm -rf -- old
          rm -f -- "$RUNNER_TEMP/v013-channel-verified.json"
          test ! -e old
          echo P08_V013_REAL_ONLINE_OLD_SOURCE_CLEANUP=PASS
