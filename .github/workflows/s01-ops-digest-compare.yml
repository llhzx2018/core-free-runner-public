name: Compare Ops file digests
on:
  push:
    branches: [test/s01-directory-parity-release-20261114]
    paths: ['.github/workflows/s01-ops-digest-compare.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Summarize package file digests
        run: |
          python3 - <<'PY'
          import hashlib, os, subprocess
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "s01-ops-digest"
          h = lambda b: hashlib.sha256(b).hexdigest()
          def run(*args):
              return subprocess.run(args, capture_output=True, check=True).stdout
          run("gh","repo","clone","llhzx2018/vf-tools-ops",str(root),"--","--no-checkout","--quiet")
          def git(*args):
              return run("git","-C",str(root),*args)
          for entry in filter(None,git("ls-tree","-r","-z","f89086c790d9556961c37fc9bc5888343b80632f").split(bytes([0]))):
              meta,path=entry.decode().split(chr(9),1)
              _,typ,oid=meta.split()
              if path.startswith(("assets/","includes/","languages/","config/")) or path in ("vf-ops.php","uninstall.php"):
                  print("DIGEST",h(("vf-ops/"+path).encode())[:18],h(git("cat-file","blob",oid)))
          PY
      - name: Clean temporary source
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/s01-ops-digest"
