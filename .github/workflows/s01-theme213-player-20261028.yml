name: S01 player workbench exact populated-library proof
on:
  push:
    branches: [task/s01-theme213-player-20261028]
    paths: ['.github/workflows/s01-theme213-player-20261028.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.213
  TARGET_SHA: f3a29c612ca5cdeea79a513d00d781c70f3192c3
  TARGET_TREE: 83d7bc4fc0d69b05c2e2d09cb84280e879216a86
  BASE_SHA: a36a2b20812a49b1ceeb650fd37fc4a24c356062
  SOURCE_VERSION: 1.35.211
  LANE_ID: s01-theme213-player-20261028
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: control
      - name: Target identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-theme213-player-20261028/spec.json --input control/.github/workflows/s01-theme213-player-20261028.yml
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 02d4591eed025a3d3a67bc0a150b3ddc448c2ab8
          persist-credentials: false
          path: established
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: f3a29c612ca5cdeea79a513d00d781c70f3192c3
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact package and scoped syntax checks
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider baseline
          python3 control/lanes/s01-theme213-player-20261028/package.py
          python3 - <<'PYLIST'
          import subprocess,os
          files=subprocess.check_output(['git','-C','target','diff','--name-only',os.environ['BASE_SHA'],'HEAD']).decode().splitlines()
          for f in files:
              if f.endswith('.php'):subprocess.run(['php','-l','target/'+f],check=True)
          PYLIST
          node --check control/lanes/s01-theme213-player-20261028/check.cjs
          node --check target/src/assets/js/main.js
          php target/tests/tool-task-hero-compact-contract.php > proof/task-hero-regression.txt
          mkdir -p baseline/src/inc/modules
          git -C target show "$BASE_SHA:src/inc/modules/module-hero.php" > baseline/src/inc/modules/module-hero.php
          php control/lanes/s01-theme213-player-20261028/hero-contract.php baseline/src before > proof/before-hero.json
          php control/lanes/s01-theme213-player-20261028/hero-contract.php target/src after > proof/after-hero.json
          python3 - <<'PYHERO'
          import json,pathlib
          r=pathlib.Path('proof');a=json.loads((r/'before-hero.json').read_text());b=json.loads((r/'after-hero.json').read_text());assert a['cases']==b['cases']==16
          for k,v in a['hashes'].items():
              if '|m3u8-player|' not in k:assert b['hashes'][k]==v,k
          (r/'hero-parity.json').write_text(json.dumps({'status':'PASS','cases':16,'other_tool_hero':'BYTE_IDENTICAL','authored_copy':'PRESERVED'}))
          PYHERO
          gh release download v1.35.211 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.211.zip --dir provider
          echo '6b2439f2f6f88a6d44c60376fb930bd4a4b610c8aa16b3ca66f783e4c92a9578  provider/vf-tools-theme_V1.35.211.zip' | sha256sum -c
          gh release download v1.25.94 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.94.zip --dir provider
          echo '70b90d40da5d69fc7819bd7ada3f15fb0145e64822b788bd94956c7827b2df03  provider/vf-tools-m3u8_V1.25.94.zip' | sha256sum -c
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -g -fsSL --retry 2 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC[wght].ttf' -o "$HOME/.local/share/fonts/NotoSansSC.ttf"
          fc-cache -f
      - name: Native WordPress player workbench, populated library and update protection
        run: |
          set -euo pipefail
          cp -a established/lanes/s01-frontend-design-20261017 lane
          cp control/lanes/s01-theme213-player-20261028/clean.cjs lane/warm-admin.cjs
          bash control/lanes/s01-theme213-player-20261028/native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-home-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target baseline provider
