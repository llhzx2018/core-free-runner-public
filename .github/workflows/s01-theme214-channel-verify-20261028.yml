name: S01 Theme 214 update-channel independent verification
on:
  pull_request:
    types: [opened, synchronize]
    paths: ['.github/workflows/s01-theme214-channel-verify-20261028.yml']
permissions:
  contents: read
jobs:
  channel:
    if: github.event.pull_request.head.ref == 'task/s01-theme214-channel-proof-20261028' && github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_REPO: llhzx2018/core-updates
      PRODUCT_REPO: llhzx2018/vf-tools-theme
      TARGET_SHA: ba44a435c6a1c843f694fd935be113ab2374db27
      BASE_SHA: 281e2901b32a5abe903244d99a04aed3da519637
      TAG: v1.35.214
      ASSET: vf-tools-theme_V1.35.214.zip
      ASSET_SHA: 987d3211f496fa932035b5a83c5ab1afc1a90add2bd1bd876f7d1a2bf8b80c0f
      ASSET_BYTES: '2023115'
    steps:
      - name: Checkout public-safe test instructions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact independent channel request identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "$GITHUB_HEAD_REF" = "task/s01-theme214-channel-proof-20261028"
          test "$TARGET_SHA" = "ba44a435c6a1c843f694fd935be113ab2374db27"
          echo CHANNEL_PROOF_SCOPE_PASS
      - name: Transient exact channel checkout
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${TARGET_REPO}.git" candidate
          git -C candidate checkout -q "$TARGET_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C candidate diff --name-only "$BASE_SHA" HEAD)" = "projects/S01-C01.json"
          git -C candidate diff --check "$BASE_SHA" HEAD
          echo EXACT_CHANNEL_SOURCE_SCOPE_PASS
      - name: Update Core manifest contract and PHP regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/channel-php-lint.txt
          php update-core/php/tests/run.php
          jq -e '
            .schema_version=="wp-component-1.0" and
            .component_id=="S01-C01" and
            .component_type=="THEME" and
            .enabled==true and
            .target_version=="1.35.214" and
            (.from_versions|index("1.35.213")!=null) and
            .release_tag=="v1.35.214" and
            .asset_name=="vf-tools-theme_V1.35.214.zip" and
            .asset_bytes==2023115 and
            .asset_sha256=="987d3211f496fa932035b5a83c5ab1afc1a90add2bd1bd876f7d1a2bf8b80c0f" and
            .runtime_files==476 and
            .backup_required==true and .rollback_supported==true
          ' projects/S01-C01.json >/dev/null
          echo CHANNEL_MANIFEST_AND_UPDATE_CORE_PHP_REGRESSION_PASS
      - name: Formal release metadata and remote asset byte integrity
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          gh api "repos/$PRODUCT_REPO/releases/tags/$TAG" >/tmp/channel-release.json
          test "$(jq -r .tag_name /tmp/channel-release.json)" = "$TAG"
          test "$(jq -r .draft /tmp/channel-release.json)" = false
          test "$(jq -r .prerelease /tmp/channel-release.json)" = false
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.size' /tmp/channel-release.json)" = "$ASSET_BYTES"
          test "$(gh api "repos/$PRODUCT_REPO/git/ref/tags/$TAG" --jq .object.sha)" = "e1f67fb948367079bcd3b4daefb21171eae16046"
          mkdir -p /tmp/channel-remote
          gh release download "$TAG" -R "$PRODUCT_REPO" --pattern "$ASSET" -D /tmp/channel-remote
          test "$(sha256sum "/tmp/channel-remote/$ASSET" | cut -d ' ' -f1)" = "$ASSET_SHA"
          echo THEME_RELEASE_ASSET_CHANNEL_MAPPING_REMOTE_READBACK_PASS
      - name: Cleanup private candidate and package
        if: always()
        shell: bash
        run: |
          rm -rf candidate /tmp/channel-remote
