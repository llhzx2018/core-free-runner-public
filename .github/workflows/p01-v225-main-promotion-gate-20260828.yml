name: P01 V2.25.0 Main Promotion Gate
on:
  push:
    branches: [task/p01-v222-multi-surface-gate-20260828]
    paths: ['.github/workflows/p01-v225-main-promotion-gate-20260828.yml']
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE: 92c68ceae9af9e802017043478d37c5512cb3941
      TREE: 5db9ee2c6a7e58d44e40772cd5658fe4b85a87c1
      MAIN: c299c313559bbb4f58d9a7180fb482fae7ced67a
      DEVELOP: 19fc03dca150150e2bdedb34a49e145d8d9d03a0
      RELEASE_GATE: '33159328464'
      ARTIFACT_GATE: '33159480684'
      ARTIFACT_ID: '9681009915'
    steps:
      - name: Readback refs and PASS evidence
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/vf-start.git" product
          test "$(git -C product rev-parse origin/main)" = "$MAIN"
          test "$(git -C product rev-parse origin/develop)" = "$DEVELOP"
          test "$(git -C product rev-parse origin/release/p01-v2.25.0-20260828)" = "$RELEASE"
          git -C product cat-file -e "$RELEASE^{commit}"
          test "$(git -C product rev-parse "$RELEASE^{tree}")" = "$TREE"
          git -C product merge-base --is-ancestor "$MAIN" "$RELEASE"
          git -C product merge-base --is-ancestor "$DEVELOP" "$RELEASE"
          test "$(git -C product show "$RELEASE:VERSION"|tr -d '\r\n')" = 2.25.0
          for run in "$RELEASE_GATE" "$ARTIFACT_GATE"; do gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$run" | jq -e '.status=="completed" and .conclusion=="success"' >/dev/null; done
          gh api "repos/llhzx2018/core-free-runner-public/actions/artifacts/$ARTIFACT_ID" | jq -e '.name=="p01-v225-formal-artifacts-92c68ceae9af9e802017043478d37c5512cb3941" and .expired==false' >/dev/null
          echo P01_V225_MAIN_PROMOTION=PASS
