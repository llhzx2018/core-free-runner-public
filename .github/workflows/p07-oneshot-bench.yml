name: P07 OneShot Bench Experiment

on:
  push:
    branches:
      - experiment/p07-oneshot-bench-v01
    paths:
      - experiments/p07-bench.sh
      - experiments/p07-speedtest-sha256.txt
      - .github/workflows/p07-oneshot-bench.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oneshot-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NO_COLOR: "1"
      XDG_STATE_HOME: /tmp/p07-bench-state
    steps:
      - uses: actions/checkout@v4

      - name: Syntax and identity
        run: |
          bash -n experiments/p07-bench.sh
          chmod +x experiments/p07-bench.sh
          ./experiments/p07-bench.sh --version | grep -F 'P07 Enhanced Bench 0.1.0'
          ./experiments/p07-bench.sh --self-test | grep -F 'SELF_TEST=PASS'

      - name: One-shot demo surface
        run: |
          rm -rf /tmp/p07-bench-state
          ./experiments/p07-bench.sh --demo | tee /tmp/p07-bench-demo.txt
          grep -F -- 'P07 Enhanced Bench' /tmp/p07-bench-demo.txt
          grep -F 'CPU Model' /tmp/p07-bench-demo.txt
          grep -F 'CloudPanel' /tmp/p07-bench-demo.txt
          grep -F 'I/O #1' /tmp/p07-bench-demo.txt
          grep -F 'I/O #2' /tmp/p07-bench-demo.txt
          grep -F 'I/O #3' /tmp/p07-bench-demo.txt
          grep -F 'Average' /tmp/p07-bench-demo.txt
          grep -F 'Los Angeles, US' /tmp/p07-bench-demo.txt
          grep -F 'Suzhou, CN' /tmp/p07-bench-demo.txt
          grep -F 'Ningbo, CN' /tmp/p07-bench-demo.txt
          grep -F 'TIMEOUT' /tmp/p07-bench-demo.txt
          grep -F 'China IP Assessment' /tmp/p07-bench-demo.txt
          grep -F 'HIGH_RISK' /tmp/p07-bench-demo.txt
          grep -F 'CHANGE IP BEFORE MIGRATION' /tmp/p07-bench-demo.txt
          grep -F 'Report saved' /tmp/p07-bench-demo.txt

      - name: No menu regression
        run: |
          ! grep -Eq '请选择|按 Enter|read -r c|main_menu|interactive\(' experiments/p07-bench.sh
          lines=$(wc -l < /tmp/p07-bench-demo.txt)
          test "$lines" -lt 80

      - name: Report JSON contract
        run: |
          f=$(find /tmp/p07-bench-state -type f -name 'p07-bench_*.json' | head -1)
          test -n "$f"
          python3 - "$f" <<'PY'
import json,sys
p=json.load(open(sys.argv[1],encoding='utf-8'))
assert p['module']=='p07-bench'
assert p['version']=='0.1.0'
assert len(p['network_nodes'])==12
assert p['china_ip_assessment']['verdict']=='HIGH_RISK'
assert p['china_ip_assessment']['mainland_origin_probe']=='NOT_IMPLEMENTED'
assert float(p['io']['average_mb_s']) > 0
PY

      - name: Bounded I/O and filesystem guards
        run: |
          grep -F 'IO_MIB="${P07_BENCH_IO_MIB:-256}"' experiments/p07-bench.sh
          grep -F '3 x %s MiB' experiments/p07-bench.sh
          grep -F 'tmpfs' experiments/p07-bench.sh
          ! grep -F 'count=2048' experiments/p07-bench.sh

      - name: Official Speedtest supply chain pin
        run: |
          x=$(awk -F= '/^x86_64_sha256=/{print $2}' experiments/p07-speedtest-sha256.txt)
          a=$(awk -F= '/^aarch64_sha256=/{print $2}' experiments/p07-speedtest-sha256.txt)
          grep -F "$x" experiments/p07-bench.sh
          grep -F "$a" experiments/p07-bench.sh
          grep -F 'https://install.speedtest.net/app/cli/' experiments/p07-bench.sh
          ! grep -Eq 'curl[[:space:]].*(-k|--insecure)' experiments/p07-bench.sh
          ! grep -F -- '--no-check-certificate' experiments/p07-bench.sh
          ! grep -Eq 'apt(-get)? install|yum install|dnf install' experiments/p07-bench.sh

      - name: Safety boundary
        run: |
          ! grep -Eq 'sysctl[[:space:]]+-w|systemctl[[:space:]]+(restart|stop)|reboot|shutdown' experiments/p07-bench.sh
          ! grep -Eq 'cloudflare.*(put|post|patch)|delete.*server|rm -rf /home' experiments/p07-bench.sh
