name: P07 OneShot Bench Experiment

on:
  push:
    branches:
      - experiment/p07-oneshot-bench-v01
    paths:
      - experiments/p07-bench.sh
      - experiments/p07-speedtest-sha256.txt
      - .github/workflows/p07-oneshot-bench.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oneshot-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NO_COLOR: "1"
      XDG_STATE_HOME: /tmp/p07-bench-state
    steps:
      - uses: actions/checkout@v4

      - name: Syntax identity and internal logic
        run: |
          set -euo pipefail
          bash -n experiments/p07-bench.sh
          chmod +x experiments/p07-bench.sh
          ./experiments/p07-bench.sh --version | grep -F 'P07 Enhanced Bench 0.3.0'
          ./experiments/p07-bench.sh --self-test | grep -F 'SELF_TEST=PASS'

      - name: One-shot demo surface
        run: |
          set -euo pipefail
          rm -rf /tmp/p07-bench-state
          ./experiments/p07-bench.sh --demo | tee /tmp/p07-bench-demo.txt
          grep -F -- 'P07 Enhanced Bench' /tmp/p07-bench-demo.txt
          grep -F 'CPU Model' /tmp/p07-bench-demo.txt
          grep -F 'Total Disk' /tmp/p07-bench-demo.txt
          grep -E 'Arch[[:space:]]+: .*\([0-9]+ Bit\)' /tmp/p07-bench-demo.txt
          grep -F 'CloudPanel' /tmp/p07-bench-demo.txt
          grep -F 'IPv4' /tmp/p07-bench-demo.txt
          grep -F 'IPv6' /tmp/p07-bench-demo.txt
          grep -F 'I/O Speed(1 run)' /tmp/p07-bench-demo.txt
          grep -F 'I/O Speed(2 run)' /tmp/p07-bench-demo.txt
          grep -F 'I/O Speed(3 run)' /tmp/p07-bench-demo.txt
          grep -F 'I/O Speed(average)' /tmp/p07-bench-demo.txt
          grep -F 'Node Name' /tmp/p07-bench-demo.txt
          grep -F 'Reason' /tmp/p07-bench-demo.txt
          grep -F 'Speedtest.net' /tmp/p07-bench-demo.txt
          grep -F 'Los Angeles, US' /tmp/p07-bench-demo.txt
          grep -F 'Suzhou, CN' /tmp/p07-bench-demo.txt
          grep -F 'Ningbo, CN' /tmp/p07-bench-demo.txt
          grep -F 'TIMEOUT' /tmp/p07-bench-demo.txt
          grep -F 'China Access Assessment' /tmp/p07-bench-demo.txt
          grep -F 'VPS -> Overseas HTTPS' /tmp/p07-bench-demo.txt
          grep -F 'VPS -> Mainland HTTPS' /tmp/p07-bench-demo.txt
          grep -F 'VPS -> Mainland Speed' /tmp/p07-bench-demo.txt
          grep -F 'Mainland -> VPS Probe' /tmp/p07-bench-demo.txt
          grep -F 'Path failures' /tmp/p07-bench-demo.txt
          grep -F 'Node unavailable' /tmp/p07-bench-demo.txt
          grep -F 'HIGH_RISK' /tmp/p07-bench-demo.txt
          grep -F 'CHANGE IP BEFORE MIGRATION' /tmp/p07-bench-demo.txt
          grep -F 'Evidence scope: current VPS outbound only' /tmp/p07-bench-demo.txt
          grep -F 'Finished in' /tmp/p07-bench-demo.txt
          grep -F 'Timestamp' /tmp/p07-bench-demo.txt
          grep -F 'Report saved' /tmp/p07-bench-demo.txt

      - name: Screenshot regression contract
        run: |
          set -euo pipefail
          grep -F 'NODE_UNAVAILABLE is a test-node problem and is not counted as IP blocking evidence' experiments/p07-bench.sh
          grep -F 'china_verdict_from_counts 0 0 2 9 6 0 3' experiments/p07-bench.sh
          grep -F 'INCONCLUSIVE' experiments/p07-bench.sh
          grep -F 'RETRY WITH ALTERNATE MAINLAND SPEEDTEST NODES' experiments/p07-bench.sh
          grep -F 'tty_clean_line' experiments/p07-bench.sh
          grep -F 'drain_tty_input' experiments/p07-bench.sh

      - name: No menu regression
        run: |
          set -euo pipefail
          ! grep -Eq '请选择|按 Enter|read -r c|main_menu|interactive\(' experiments/p07-bench.sh
          lines=$(wc -l < /tmp/p07-bench-demo.txt)
          test "$lines" -lt 90

      - name: Report JSON contract
        run: |
          set -euo pipefail
          f=$(find /tmp/p07-bench-state -type f -name 'p07-bench_*.json' | head -1)
          test -n "$f"
          python3 - "$f" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          assert p['schema_version']==2
          assert p['module']=='p07-bench'
          assert p['version']=='0.3.0'
          assert len(p['network_nodes'])==12
          assert p['system']['total_disk']
          assert p['system']['disk_scope'] in ('SUPPORTED_FS_PLUS_SWAP_ZFS','ROOT_FALLBACK')
          assert p['china_ip_assessment']['verdict']=='HIGH_RISK'
          assert p['china_ip_assessment']['mainland_origin_probe']=='NOT_IMPLEMENTED'
          assert float(p['io']['average_mb_s']) > 0
          PY

      - name: Bounded I/O filesystem and unit guards
        run: |
          set -euo pipefail
          grep -F 'IO_MIB="${P07_BENCH_IO_MIB:-256}"' experiments/p07-bench.sh
          grep -F '3 x %s MiB' experiments/p07-bench.sh
          grep -F 'tmpfs' experiments/p07-bench.sh
          grep -F 'devtmpfs' experiments/p07-bench.sh
          grep -F 'format_mb_rate' experiments/p07-bench.sh
          ! grep -F 'count=2048' experiments/p07-bench.sh

      - name: Total disk aggregation contract
        run: |
          set -euo pipefail
          grep -F 'simfs|ext2|ext3|ext4|btrfs|xfs|vfat|ntfs|f2fs' experiments/p07-bench.sh
          grep -F 'SwapTotal' experiments/p07-bench.sh
          grep -F 'zpool list -Hp -o size' experiments/p07-bench.sh
          grep -F 'SUPPORTED_FS_PLUS_SWAP_ZFS' experiments/p07-bench.sh

      - name: Five-architecture official Speedtest pin
        run: |
          set -euo pipefail
          for arch in x86_64 i386 aarch64 armhf armel; do
            sha=$(awk -F= -v a="$arch" '$1==a"_sha256"{print $2}' experiments/p07-speedtest-sha256.txt)
            test ${#sha} -eq 64
            grep -F "$sha" experiments/p07-bench.sh
          done
          grep -F 'https://install.speedtest.net/app/cli/' experiments/p07-bench.sh
          ! grep -Eq 'curl[[:space:]].*(-k|--insecure)' experiments/p07-bench.sh
          ! grep -F -- '--no-check-certificate' experiments/p07-bench.sh
          ! grep -Eq 'apt(-get)? install|yum install|dnf install' experiments/p07-bench.sh

      - name: Virtualization fallback contract
        run: |
          set -euo pipefail
          grep -F 'systemd-detect-virt' experiments/p07-bench.sh
          grep -F 'OpenVZ' experiments/p07-bench.sh
          grep -F 'VirtualBox' experiments/p07-bench.sh
          grep -F 'Hyper-V' experiments/p07-bench.sh
          grep -F 'VMware' experiments/p07-bench.sh
          grep -F 'Xen' experiments/p07-bench.sh

      - name: Safety boundary
        run: |
          set -euo pipefail
          ! grep -Eq 'sysctl[[:space:]]+-w|systemctl[[:space:]]+(restart|stop)|reboot|shutdown' experiments/p07-bench.sh
          ! grep -Eq 'cloudflare.*(put|post|patch)|delete.*server|rm -rf /home' experiments/p07-bench.sh
