name: P02 W3 Settings 4MB exact-source private-safe proof
on:
  pull_request:
    paths:
      - .github/workflows/p02-w3-settings-exchange-exact-20261118.yml
permissions:
  contents: read
env:
  P02_TARGET_SHA: 'a16e26327db3ae0ec272b5ac3d340bd03909b282'
jobs:
  settings-native-source:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p02-w3-settings-exchange-4mb-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Checkout ephemeral public-only workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact private P02 source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.P02_TARGET_SHA }}
          path: vf-library
          persist-credentials: false
          fetch-depth: 1
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Verify exact source and syntax and Settings negative fixtures
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$GITHUB_REPOSITORY" = llhzx2018/core-free-runner-public
          test "$(git -C vf-library rev-parse HEAD)" = "$P02_TARGET_SHA"
          cd vf-library
          python3 -B -m py_compile tests/integration/p02_w3_native_laravel_http.py tests/e2e/p02_w3_inertia_workspace_browser.py scripts/p02_w3_clean_full_candidate.py
          php -l modern/laravel/P02W3LaravelPortal.php >/dev/null
          php -l modern/laravel/P02W3InstalledSiteEntry.php >/dev/null
          php -l modern/laravel/bootstrap/StandaloneProofGate.php >/dev/null
          php -l modern/laravel/P02W3WorkspacePage.php >/dev/null
          php -l modern/laravel/P02W3OwnerAtomicUpdate.php >/dev/null
          php -l modern/laravel/P02W3WorkspaceSettingsHttp.php >/dev/null
          if python3 -B -m unittest discover -s tests/unit -p test_p02_w3_workspace_source.py -q > "$RUNNER_TEMP/p02-settings-tests.log" 2>&1; then
            echo P02_SETTINGS_SOURCE_AND_DENIAL_TESTS=PASS
          else
            echo P02_SETTINGS_SOURCE_AND_DENIAL_TESTS=FAIL
            grep -E '^(FAIL|ERROR):' "$RUNNER_TEMP/p02-settings-tests.log" | head -15 || true
            exit 31
          fi
          echo P02_SETTINGS_PHP_AND_PYTHON_SYNTAX=PASS
      - name: Verify real locked Vue compilation and candidate asset markers
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          if npm ci --prefix vf-library/modern/inertia-page --no-audit --no-fund > "$RUNNER_TEMP/p02-settings-npm.log" 2>&1; then
            echo P02_SETTINGS_NPM_LOCKED_INSTALL=PASS
          else
            echo P02_SETTINGS_NPM_LOCKED_INSTALL=FAIL
            exit 32
          fi
          if npm run build --prefix vf-library/modern/inertia-page > "$RUNNER_TEMP/p02-settings-build.log" 2>&1; then
            echo P02_SETTINGS_VUE_PRODUCTION_BUILD=PASS
          else
            echo P02_SETTINGS_VUE_PRODUCTION_BUILD=FAIL
            grep -E '^([[:space:]]*error|[[:space:]]*Error|[[:space:]]*src/)' "$RUNNER_TEMP/p02-settings-build.log" | head -15 || true
            exit 33
          fi
          cd vf-library
          python3 -B scripts/p02_w3_source_gate.py > "$RUNNER_TEMP/p02-settings-gate.log" 2>&1 || { echo P02_SETTINGS_SOURCE_GATE=FAIL; exit 34; }
          test -s public/assets/w2d/inertia-material.js
          grep -q 'w3-updates-check' public/assets/w2d/inertia-material.js
          grep -q 'w3-updates-apply' public/assets/w2d/inertia-material.js
          echo P02_SETTINGS_VUE_ASSET_MARKERS=PASS
          echo P02_SETTINGS_SOURCE_GATE=PASS
      - name: Native installed Laravel Owner CSRF and unchecked Atomic denial
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          sudo apt-get update -qq > "$RUNNER_TEMP/p02-apt.log" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php-cli php-sqlite3 php-mbstring php-xml php-curl php-zip composer sqlite3 >> "$RUNNER_TEMP/p02-apt.log" 2>&1
          php -r 'exit(PHP_VERSION_ID >= 80300 && extension_loaded("pdo_sqlite") ? 0 : 1);'
          if composer --working-dir=vf-library/modern/laravel install --no-dev --no-scripts --no-plugins --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/p02-composer.log" 2>&1; then
            echo P02_SETTINGS_REAL_LARAVEL_VENDOR=PASS
          else
            echo P02_SETTINGS_REAL_LARAVEL_VENDOR=FAIL
            exit 41
          fi
          (cd vf-library && php tests/unit/p02_w3_laravel_standalone_gate.php > "$RUNNER_TEMP/p02-standalone-gate.log" 2>&1) || { echo P02_SETTINGS_LOOPBACK_GATE=FAIL; exit 40; }
          (cd vf-library && php tests/unit/p02_w3_installed_site_entry.php > "$RUNNER_TEMP/p02-installed-gate.log" 2>&1) || { echo P02_SETTINGS_4MB_INSTALLED_FPM_GATE=FAIL; exit 46; }
          echo P02_SETTINGS_4MB_INSTALLED_FPM_GATE=PASS
          echo P02_SETTINGS_LOOPBACK_GATE=PASS
          if (cd vf-library && P02_W3_SYNTHETIC_ONLY=1 P02_W3_ENGINE=sqlite php tests/integration/p02_w3_cloudpanel_fresh_install.php) > "$RUNNER_TEMP/p02-real-installed-service.log" 2>&1; then
            echo P02_SETTINGS_REAL_INSTALLED_VAULT_NO_TOKEN_AND_UNCHECKED_ATOMIC=PASS
          else
            echo P02_SETTINGS_REAL_INSTALLED_VAULT_NO_TOKEN_AND_UNCHECKED_ATOMIC=FAIL
            grep -E '^P02_W3_NATIVE|^CLEAN_FULL_' "$RUNNER_TEMP/p02-real-installed-service.log" | head -5 || true
            exit 45
          fi
          if (cd vf-library && P02_W3_SYNTHETIC_ONLY=1 python3 -B tests/integration/p02_w3_native_depot_boot.py) > "$RUNNER_TEMP/p02-native.log" 2>&1; then
            echo P02_SETTINGS_NATIVE_OWNER_CSRF_UNCHECKED_ATOMIC=PASS
          else
            echo P02_SETTINGS_NATIVE_OWNER_CSRF_UNCHECKED_ATOMIC=FAIL
            grep -E 'P02_W3_NATIVE_CHILD_PHASE|P02_W3_NATIVE_DEPOT_FAIL|P02_W3_SETUP_HTTP_FAIL' "$RUNNER_TEMP/p02-native.log" | head -8 || true
            exit 42
          fi
          if (cd vf-library && P02_W3_SYNTHETIC_ONLY=1 python3 -B tests/integration/p02_w3_native_setup_http.py sqlite) > "$RUNNER_TEMP/p02-installed-update.log" 2>&1; then
            echo P02_SETTINGS_INSTALLED_OWNER_TOKEN_ATOMIC_DENIAL=PASS
          else
            echo P02_SETTINGS_INSTALLED_OWNER_TOKEN_ATOMIC_DENIAL=FAIL
            grep -E '^P02_W3_SETUP_HTTP_FAIL=' "$RUNNER_TEMP/p02-installed-update.log" | head -5 || true
            exit 44
          fi
      - name: Native Chromium preview Settings and one-canonical-workspace test
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          python3 -m venv "$RUNNER_TEMP/p02-browser"
          "$RUNNER_TEMP/p02-browser/bin/python" -m pip install -q 'playwright==1.56.0'
          "$RUNNER_TEMP/p02-browser/bin/python" -m playwright install --with-deps chromium > "$RUNNER_TEMP/p02-browser-install.log" 2>&1
          if (cd vf-library && P02_W3_SYNTHETIC_ONLY=1 "$RUNNER_TEMP/p02-browser/bin/python" tests/e2e/p02_w3_inertia_workspace_browser.py) > "$RUNNER_TEMP/p02-browser-run.log" 2>&1; then
            echo P02_SETTINGS_CHROMIUM_390_768_1440=PASS
          else
            echo P02_SETTINGS_CHROMIUM_390_768_1440=FAIL
            grep -E '^P02_W3_BROWSER_BOUNDED_PHASE=' "$RUNNER_TEMP/p02-browser-run.log" | head -5 || true
            exit 43
          fi
      - name: Remove private checkout and temporary test logs
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf vf-library
          rm -f "$RUNNER_TEMP"/p02-settings-*.log
          test ! -e vf-library
          echo P02_SETTINGS_PRIVATE_SOURCE_REMOVED=YES
