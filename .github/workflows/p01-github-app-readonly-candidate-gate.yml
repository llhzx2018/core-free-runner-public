name: p01-ghapp-ia5-canonical-composite-unit-gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-github-app-readonly-candidate-gate.yml'

permissions:
  contents: read

concurrency:
  group: p01-ghapp-ia5-canonical-f952-ef4d
  cancel-in-progress: false

jobs:
  isolated-github-app:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'test(P01):')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      TARGET_SHA: f9521a2fe5d453ce41cca0f251d88d1e22cee029
      TARGET_BRANCH: feat/p01-project-github-app-readonly-20261029
      INTEGRATION_SHA: ef4d923e97a8371ba4a1ef10a9c6afc634d4825e
      INTEGRATION_BRANCH: feat/p01-ia5-current-v247477-r9-20261029
      VERSION: 2.47.483
      SOURCE: 2.47.482
      ART: /tmp/p01-ghapp-ia5-artifacts
      REL: /tmp/p01-ghapp-ia5-prior-release
    steps:
      - name: Checkout existing trusted public Runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install PHP test runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd php-xml unzip jq >/dev/null
          php -m | grep -Fx pdo_sqlite
          php -m | grep -Fx openssl
          php -m | grep -Fx curl
          echo P01_GITHUB_APP_TEST_RUNTIME=PASS

      - name: Resolve immutable P01 private source from authorized read channel
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          remote_sha="$(git ls-remote "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$remote_sha" = "$TARGET_SHA"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" candidate
          git -C candidate fetch -q origin "$TARGET_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.482"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "2.47.482"
          echo P01_GITHUB_APP_EXACT_SOURCE=PASS

      - name: Compose both pinned P01 Draft PRs in runner only
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          actual_ia_sha="$(git ls-remote "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "refs/heads/${INTEGRATION_BRANCH}" | awk '{print $1}')"
          if [ "$actual_ia_sha" != "$INTEGRATION_SHA" ]; then echo P01_IA5_ACTIVE_HEAD_MOVED_SNAPSHOT_PROOF_ONLY=YES; fi
          git -C candidate fetch -q origin "$INTEGRATION_SHA"
          test "$(git -C candidate rev-parse FETCH_HEAD)" = "$INTEGRATION_SHA"
          git -C candidate -c user.email=ci@localhost -c user.name=IsolatedCI merge --no-commit --no-ff "$INTEGRATION_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.483"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "2.47.483"
          test -f candidate/src/app/ProjectGithubApp.php
          test -f candidate/src/assets/project-github-app.js
          test -f candidate/src/assets/local-subsite-management.js
          test -f candidate/tests/unit/p01_ia5_no_backend_hops_r31_contract.cjs
          git -C candidate diff --check
          echo P01_GITHUB_APP_IA5_PINNED_PAIR=PASS
          COMBINED_TREE="$(git -C candidate write-tree)"
          COMBINED_SHA="$(git -C candidate -c user.name=IsolatedCI -c user.email=ci@localhost commit-tree "$COMBINED_TREE" -p "$TARGET_SHA" -p "$INTEGRATION_SHA" -m "test-only pinned P01 GitHub App plus IA V5")"
          test "$(git -C candidate cat-file -p "$COMBINED_SHA" | head -n1)" = "tree $COMBINED_TREE"
          echo "COMBINED_SHA=$COMBINED_SHA" >> "$GITHUB_ENV"
          echo "COMBINED_TREE=$COMBINED_TREE" >> "$GITHUB_ENV"
          echo P01_GITHUB_APP_IA5_RUNNER_ONLY_MERGE=PASS

      - name: P01 exact composite canonical unit regression against formal baseline
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --depth 1 --branch "v${SOURCE}" "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" stable
          test "$(tr -d '\r\n ' < stable/VERSION)" = "$SOURCE"
          git -C candidate worktree add -q --detach "$GITHUB_WORKSPACE/composite-unit" "$COMBINED_SHA"
          test "$(git -C composite-unit rev-parse HEAD)" = "$COMBINED_SHA"
          test "$(git -C composite-unit rev-parse HEAD^{tree})" = "$COMBINED_TREE"
          test -z "$(git -C composite-unit status --porcelain)"
          bash composite-unit/tests/canonical_release_regression.sh composite-unit stable --require-zero-debt | tee /tmp/p01-ghapp-ia5-canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/p01-ghapp-ia5-canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/p01-ghapp-ia5-canonical.txt
          echo P01_GHAPP_IA5_CANONICAL_EXACT_COMPOSITE=PASS

      - name: Finished isolated candidate validation
        shell: bash
        run: |
          echo P01_GHAPP_IA5_CANONICAL_MACHINE_GATE=PASS
