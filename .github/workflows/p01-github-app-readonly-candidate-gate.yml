name: p01-github-app-readonly-candidate-gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-github-app-readonly-candidate-gate.yml'

permissions:
  contents: read

concurrency:
  group: p01-github-app-candidate-e754715a
  cancel-in-progress: false

jobs:
  isolated-github-app:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'test(P01):')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      TARGET_SHA: e754715a761a1441a5c2b6f4b57a7650d15ec219
      TARGET_BRANCH: feat/p01-project-github-app-readonly-20261029
    steps:
      - name: Checkout existing trusted public Runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install PHP test runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd php-xml >/dev/null
          php -m | grep -Fx pdo_sqlite
          php -m | grep -Fx openssl
          php -m | grep -Fx curl
          echo P01_GITHUB_APP_TEST_RUNTIME=PASS

      - name: Resolve immutable P01 private source from authorized read channel
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          remote_sha="$(git ls-remote "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$remote_sha" = "$TARGET_SHA"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" candidate
          git -C candidate fetch -q --depth 1 origin "$TARGET_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.482"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "2.47.482"
          echo P01_GITHUB_APP_EXACT_SOURCE=PASS

      - name: PHP JavaScript syntax and scoped contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          find candidate/src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find candidate/src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          php -l candidate/tests/unit/project_github_app_security_contract.php >/dev/null
          node --check candidate/tests/unit/project_github_app_dialog_contract.cjs
          (
            cd candidate
            php tests/unit/project_github_app_security_contract.php
            php tests/unit/project_github_app_matching_contract.php
            php tests/unit/project_github_sync_v247177_contract.php
            node tests/unit/project_github_app_dialog_contract.cjs
            node tests/unit/project_github_app_account_links_contract.cjs
            node tests/unit/project_git_source_disclosure_contract.cjs
          )
          echo P01_GITHUB_APP_FOCUSED_CONTRACT=PASS

      - name: Verify private credentials never become repository assets
        shell: bash
        run: |
          set -Eeuo pipefail
          test ! -e candidate/src/app/.runtime.php
          test ! -d candidate/src/github-app
          test ! -e candidate/src/github-app/registration.php
          test -z "$(git -C candidate status --porcelain)"
          echo P01_GITHUB_APP_NO_PRIVATE_ASSET=PASS

      - name: Finished isolated candidate validation
        shell: bash
        run: |
          echo P01_GITHUB_APP_CANDIDATE_MACHINE_GATE=PASS
