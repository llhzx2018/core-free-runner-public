name: p01-github-app-ia5-isolated-integration-gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-github-app-readonly-candidate-gate.yml'

permissions:
  contents: read

concurrency:
  group: p01-ghapp-ia5-integration-f952-1468
  cancel-in-progress: false

jobs:
  isolated-github-app:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'test(P01):')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      TARGET_SHA: f9521a2fe5d453ce41cca0f251d88d1e22cee029
      TARGET_BRANCH: feat/p01-project-github-app-readonly-20261029
      INTEGRATION_SHA: 14687df0ac3203d0b50f43b81147ed8111d56e6e
      INTEGRATION_BRANCH: feat/p01-ia5-current-v247477-r9-20261029
    steps:
      - name: Checkout existing trusted public Runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install PHP test runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd php-xml >/dev/null
          php -m | grep -Fx pdo_sqlite
          php -m | grep -Fx openssl
          php -m | grep -Fx curl
          echo P01_GITHUB_APP_TEST_RUNTIME=PASS

      - name: Resolve immutable P01 private source from authorized read channel
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          remote_sha="$(git ls-remote "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$remote_sha" = "$TARGET_SHA"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" candidate
          git -C candidate fetch -q --depth 1 origin "$TARGET_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.482"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "2.47.482"
          echo P01_GITHUB_APP_EXACT_SOURCE=PASS

      - name: Compose both pinned P01 Draft PRs in runner only
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          actual_ia_sha="$(git ls-remote "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "refs/heads/${INTEGRATION_BRANCH}" | awk '{print $1}')"
          test "$actual_ia_sha" = "$INTEGRATION_SHA"
          git -C candidate fetch -q origin "$INTEGRATION_SHA"
          test "$(git -C candidate rev-parse FETCH_HEAD)" = "$INTEGRATION_SHA"
          git -C candidate -c user.email=ci@localhost -c user.name=IsolatedCI merge --no-commit --no-ff "$INTEGRATION_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.483"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "2.47.483"
          test -f candidate/src/app/ProjectGithubApp.php
          test -f candidate/src/assets/project-github-app.js
          test -f candidate/src/assets/local-subsite-management.js
          test -f candidate/tests/unit/p01_ia5_no_backend_hops_r31_contract.cjs
          git -C candidate diff --check
          echo P01_GITHUB_APP_IA5_PINNED_PAIR=PASS
          echo P01_GITHUB_APP_IA5_RUNNER_ONLY_MERGE=PASS

      - name: Cross-branch frontstage, Owner security and IA V5 focused regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          (
            cd candidate
            php tests/unit/frontend_subsite_shell_v247106_contract.php
            php tests/unit/global_account_actions_contract.php
            php tests/unit/p01_local_management_r1_contract.php
            php tests/unit/p01_local_management_r6_task_focus_contract.php
            php tests/unit/six_resource_frontend_admin_bridge_contract.php
            node tests/unit/p01_home_favorites_native_contract.cjs
            for contract in tests/unit/p01_ia5_*_contract.cjs; do
              node "$contract"
            done
          )
          echo P01_GITHUB_APP_IA5_CROSS_BRANCH_CONTRACTS=PASS

      - name: PHP JavaScript syntax and scoped contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          find candidate/src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find candidate/src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          php -l candidate/tests/unit/project_github_app_security_contract.php >/dev/null
          node --check candidate/tests/unit/project_github_app_dialog_contract.cjs
          (
            cd candidate
            php tests/unit/project_github_app_security_contract.php
            php tests/unit/project_github_app_csp_contract.php
            php tests/unit/project_github_app_matching_contract.php
            php tests/unit/project_github_app_write_contract.php
            php tests/unit/project_github_sync_v247177_contract.php
            node tests/unit/project_github_app_dialog_contract.cjs
            node tests/unit/project_github_app_account_links_contract.cjs
            node tests/unit/project_git_source_disclosure_contract.cjs
          )
          echo P01_GITHUB_APP_FOCUSED_CONTRACT=PASS

      - name: Verify private credentials never become repository assets
        shell: bash
        run: |
          set -Eeuo pipefail
          test ! -e candidate/src/app/.runtime.php
          test ! -d candidate/src/github-app
          test ! -e candidate/src/github-app/registration.php
          git -C candidate diff --check
          git -C candidate ls-files | grep -F "src/app/ProjectGithubApp.php" >/dev/null
          git -C candidate ls-files | grep -F "src/assets/local-subsite-management.js" >/dev/null
          echo P01_GITHUB_APP_NO_PRIVATE_ASSET=PASS

      - name: Finished isolated candidate validation
        shell: bash
        run: |
          echo P01_GITHUB_APP_IA5_INTEGRATION_MACHINE_GATE=PASS
