name: P01 V2.24.0 Owner Production Readback
on:
  push:
    branches: [task/p01-v222-multi-surface-gate-20260828]
    paths: ['.github/workflows/p01-v224-owner-production-readback-20260828.yml']
permissions:
  contents: read
jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read anonymous production runtime identity
        shell: bash
        run: |
          set -Eeuo pipefail
          URL='https://start.kewaro.com/api.php?action=bootstrap'
          curl -fsSL --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' "${URL}&cb=$(date +%s)" -o /tmp/bootstrap.json
          jq -e '.ok==true and .site.auth==false' /tmp/bootstrap.json >/dev/null
          VERSION=$(jq -r '.version' /tmp/bootstrap.json)
          echo OWNER_PRODUCTION_VERSION="$VERSION"
          echo OWNER_PRODUCTION_AUTH_ANON=PASS
          curl -fsSL --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' 'https://start.kewaro.com/api.php?action=health' | jq -e '.ok==true and .service=="VF Start"' >/dev/null
          echo OWNER_PRODUCTION_HEALTH=PASS
          echo READBACK_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
