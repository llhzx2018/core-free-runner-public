name: S01 Page Body V2 Exact Gate

on:
  push:
    branches:
      - task/s01-page-body-v2-exact-gate
    paths:
      - .github/workflows/s01-page-body-v2-exact-gate.yml

permissions:
  contents: read

jobs:
  exact:
    name: V2 Exact Gate (${{ matrix.component }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: OPS
            repo: llhzx2018/vf-tools-ops
            base: c0159b3cb58cfa6cc0d1bfc36e29ab8271d5e29b
            head: 56957170755ed958595f01430e2576ae104486d3
            test: tests/s01-c02-page-body-system-v2-full-surface-contract.php
            legacy1: tests/s01-c02-page-body-system-v1-phase3-contract.php
            legacy2: tests/s01-c02-page-body-system-v1-phase3-residue-contract.php
            allowed: assets/css/current/admin-s01-page-body-system-v2.css,includes/views/admin-style-helpers/admin-s01-uiux-polish.php,tests/s01-c02-page-body-system-v2-full-surface-contract.php
            phpfiles: includes/views/admin-style-helpers/admin-s01-uiux-polish.php,tests/s01-c02-page-body-system-v2-full-surface-contract.php
          - component: THEME
            repo: llhzx2018/vf-tools-theme
            base: d80e1681d0b69bfd3a9da915befb161273bce747
            head: 5e44748fc9ee2124ccd19b17452a28f110471020
            test: tests/s01-c01-page-body-system-v2-full-surface-contract.php
            legacy1: tests/s01-c01-page-body-system-v1-phase3-contract.php
            legacy2: tests/s01-c01-page-body-system-v1-phase3-residue-contract.php
            allowed: src/assets/css/admin/admin-s01-page-body-system-v2.css,src/inc/admin/admin-s01-uiux-polish.php,src/inc/admin/admin-router.php,tests/s01-c01-page-body-system-v2-full-surface-contract.php
            phpfiles: src/inc/admin/admin-s01-uiux-polish.php,src/inc/admin/admin-router.php,tests/s01-c01-page-body-system-v2-full-surface-contract.php
          - component: M3U8
            repo: llhzx2018/vf-tools-m3u8
            base: 1a86645b2677c75f196843eb82fdfb8b1f54990e
            head: 3dc40dbc320320c78004b76357c6019654a49a01
            test: tests/s01-c03-page-body-system-v2-full-surface-contract.php
            legacy1: tests/s01-c03-page-body-system-v1-phase3-contract.php
            legacy2: tests/s01-c03-page-body-system-v1-phase3-residue-contract.php
            allowed: src/admin/ui-v4/admin-s01-page-body-system-v2.css,src/admin/admin-s01-uiux-polish.php,src/admin/Controller/class-v6-provider-fixtures-controller.php,tests/s01-c03-page-body-system-v2-full-surface-contract.php
            phpfiles: src/admin/admin-s01-uiux-polish.php,src/admin/Controller/class-v6-provider-fixtures-controller.php,tests/s01-c03-page-body-system-v2-full-surface-contract.php

    steps:
      - name: Credential gate
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo "PRIVATE_READ_CREDENTIAL=PASS"

      - name: Exact-source bounded diff
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          REPO: ${{ matrix.repo }}
          BASE: ${{ matrix.base }}
          HEAD: ${{ matrix.head }}
          ALLOWED: ${{ matrix.allowed }}
        run: |
          set -Eeuo pipefail
          curl -fsSL             -H "Authorization: Bearer $READ_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/commits/$HEAD"             -o /tmp/head.json
          test "$(jq -r '.sha' /tmp/head.json)" = "$HEAD"

          curl -fsSL             -H "Authorization: Bearer $READ_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/compare/$BASE...$HEAD"             -o /tmp/compare.json
          test "$(jq -r '.status' /tmp/compare.json)" = "ahead"

          IFS=',' read -r -a EXPECTED <<< "$ALLOWED"
          mapfile -t ACTUAL < <(jq -r '.files[].filename' /tmp/compare.json | sort)
          mapfile -t WANT < <(printf '%s\n' "${EXPECTED[@]}" | sort)
          diff -u <(printf '%s\n' "${WANT[@]}") <(printf '%s\n' "${ACTUAL[@]}")
          echo "BOUNDED_DIFF=PASS"

      - name: Fetch exact private candidate
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          REPO: ${{ matrix.repo }}
          HEAD: ${{ matrix.head }}
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/src /tmp/src.tar.gz
          mkdir -p /tmp/src
          curl -fsSL -L             -H "Authorization: Bearer $READ_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/tarball/$HEAD"             -o /tmp/src.tar.gz
          tar -xzf /tmp/src.tar.gz -C /tmp/src
          SOURCE_DIR="$(find /tmp/src -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$SOURCE_DIR"
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          echo "EXACT_SOURCE_FETCH=PASS"

      - name: PHP syntax
        shell: bash
        env:
          PHPFILES: ${{ matrix.phpfiles }}
        run: |
          set -Eeuo pipefail
          IFS=',' read -r -a FILES <<< "$PHPFILES"
          for rel in "${FILES[@]}"; do
            php -l "$SOURCE_DIR/$rel"
          done
          echo "PHP_SYNTAX=PASS"

      - name: V2 full-surface contract
        shell: bash
        env:
          TEST_FILE: ${{ matrix.test }}
        run: |
          set -Eeuo pipefail
          php "$SOURCE_DIR/$TEST_FILE"

      - name: V1 compatibility regressions
        shell: bash
        env:
          LEGACY1: ${{ matrix.legacy1 }}
          LEGACY2: ${{ matrix.legacy2 }}
        run: |
          set -Eeuo pipefail
          php "$SOURCE_DIR/$LEGACY1"
          php "$SOURCE_DIR/$LEGACY2"
          echo "V1_COMPATIBILITY_REGRESSION=PASS"

      - name: Frozen boundary and anti-pattern source gate
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          set -Eeuo pipefail
          case "$COMPONENT" in
            OPS)
              css="$SOURCE_DIR/assets/css/current/admin-s01-page-body-system-v2.css"
              ! grep -F '.vf-v6-shell-header' "$css"
              ! grep -F '.vf-v6-domain-nav' "$css"
              ! grep -F '.vf-v6-domain-menu' "$css"
              grep -F '.vf-v9-dashboard .vf-v9-pagebar' "$css"
              ;;
            THEME)
              css="$SOURCE_DIR/src/assets/css/admin/admin-s01-page-body-system-v2.css"
              ! grep -F '.vf-v6-shell-header' "$css"
              ! grep -F '.vf-v6-domain-nav' "$css"
              ! grep -F '.vf-theme-admin-header' "$css"
              grep -F '.vf-brand-workflow' "$css"
              grep -F '.vf-layout-workflow-nav' "$css"
              grep -F '.vf-navigation-workflow' "$css"
              grep -F '.vf-seo-workflow' "$css"
              ;;
            M3U8)
              css="$SOURCE_DIR/src/admin/ui-v4/admin-s01-page-body-system-v2.css"
              ! grep -F '.vf-v6-shell-header' "$css"
              ! grep -F '.vf-v6-domain-nav' "$css"
              ! grep -F '.vf-m3u8-console-head' "$css"
              ! grep -F '.vf-m3u8-primary-nav' "$css"
              grep -F 'vf-m3u8-v2-advanced' "$SOURCE_DIR/src/admin/Controller/class-v6-provider-fixtures-controller.php"
              ;;
          esac
          echo "FROZEN_BOUNDARY_AND_ANTIPATTERN=PASS"

      - name: Gate summary
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "FULL_SURFACE_DENOMINATOR=34"
          echo "OPS=14"
          echo "THEME=8"
          echo "M3U8=12"
          echo "SOURCE_CLOSURE_MACHINE=PASS"
          echo "OWNER_PRODUCTION_REAL_USE=PENDING"
