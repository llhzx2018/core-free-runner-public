name: S01-C02 1.21.1072 isolated publish gate
on:
  push:
    branches: [test/s01-c02-1211072-zip-operator-20261009]
  workflow_dispatch:
jobs:
  isolated-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Exact product candidate checkout
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: f28b453d28445a9022fe755bcf3f6cf0983add91
      - name: Install PHP and Chromium test environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-zip zip
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: PHP + JS syntax and version guard
        run: |
          php -l includes/admin-v13/views/publish_zip_v6.php
          php -l tests/s01-c02-1211072-publish-gate-focus-fixture.php
          node --check assets/js/admin-publish-zip.js
          node --check tests/s01-c02-1211072-publish-gate-focus-browser.js
          test "$(cat VERSION)" = "1.21.1072"
      - name: Real PHP idle view and expired-gate focus
        run: node tests/s01-c02-1211072-publish-gate-focus-browser.js
      - name: Real PHP + JS ZIP selection, retry, and fail-closed gate
        run: node tests/s01-c02-1211067-zip-input-browser-e2e.js
      - name: Real PHP + JS saved task pause and resume
        run: node tests/s01-c02-1211066-publish-zip-operator-resume-browser.js
