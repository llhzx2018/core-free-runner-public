name: P04 V2.5.5 Production Discovery Only

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p04-v255-production-discovery.yml'

permissions:
  contents: read

concurrency:
  group: p04-v255-production-discovery-only
  cancel-in-progress: false

jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      BASE_URL: https://infra.kewaro.com
      VF_INFRA_ADMIN_PASSWORD: ${{ secrets.VF_INFRA_ADMIN_PASSWORD }}
      P04_ADMIN_PASSWORD: ${{ secrets.P04_ADMIN_PASSWORD }}
      P04_PRODUCTION_ADMIN_PASSWORD: ${{ secrets.P04_PRODUCTION_ADMIN_PASSWORD }}
      VF_PRODUCTION_ADMIN_PASSWORD: ${{ secrets.VF_PRODUCTION_ADMIN_PASSWORD }}
      VF_INFRA_PRODUCTION_PASSWORD: ${{ secrets.VF_INFRA_PRODUCTION_PASSWORD }}
    steps:
      - name: Resolve authenticated Production discovery channel
        id: channel
        shell: bash
        run: |
          set -Eeuo pipefail
          found=''
          for name in VF_INFRA_ADMIN_PASSWORD P04_ADMIN_PASSWORD P04_PRODUCTION_ADMIN_PASSWORD VF_PRODUCTION_ADMIN_PASSWORD VF_INFRA_PRODUCTION_PASSWORD; do
            if [ -n "${!name:-}" ]; then found="$name"; break; fi
          done
          if [ -z "$found" ]; then
            echo 'PRODUCTION_AUTHENTICATED_DISCOVERY_CHANNEL=UNAVAILABLE'
            echo 'available=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "PRODUCTION_AUTHENTICATED_DISCOVERY_CHANNEL=AVAILABLE via $found"
          echo 'available=true' >> "$GITHUB_OUTPUT"
          echo "secret_name=$found" >> "$GITHUB_OUTPUT"

      - name: Production login and forced update_check only
        if: steps.channel.outputs.available == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          name='${{ steps.channel.outputs.secret_name }}'
          password="${!name}"
          test -n "$password"
          jar="$RUNNER_TEMP/p04-v255.cookies"
          login_html="$RUNNER_TEMP/login.html"
          login_headers="$RUNNER_TEMP/login.headers"
          bootstrap_json="$RUNNER_TEMP/bootstrap.json"
          update_json="$RUNNER_TEMP/update-check.json"

          curl --fail --silent --show-error --location --max-time 30 \
            -c "$jar" -b "$jar" "$BASE_URL/login.php" -o "$login_html"

          csrf=$(python3 - "$login_html" <<'PY'
          import html,re,sys
          s=open(sys.argv[1],encoding='utf-8').read()
          m=re.search(r'name=["\']csrf["\'][^>]*value=["\']([^"\']+)',s,re.I)
          if not m:
              m=re.search(r'value=["\']([^"\']+)["\'][^>]*name=["\']csrf["\']',s,re.I)
          if not m: raise SystemExit('LOGIN_CSRF_NOT_FOUND')
          print(html.unescape(m.group(1)))
          PY
          )
          test -n "$csrf"

          code=$(curl --silent --show-error --max-time 30 \
            -c "$jar" -b "$jar" -D "$login_headers" -o /dev/null -w '%{http_code}' \
            -H "Origin: $BASE_URL" -H "Referer: $BASE_URL/login.php" \
            --data-urlencode "csrf=$csrf" --data-urlencode "password=$password" --data-urlencode 'return=index.php' \
            "$BASE_URL/login.php")
          test "$code" = '302' || { echo "PRODUCTION_LOGIN_HTTP=$code"; exit 21; }
          grep -Eiq '^location: (?:/?index\.php|https://infra\.kewaro\.com/?(?:index\.php)?)' "$login_headers" || { echo 'PRODUCTION_LOGIN_REDIRECT_UNEXPECTED'; exit 22; }
          echo 'PRODUCTION_LOGIN=PASS'

          curl --fail --silent --show-error --max-time 30 -c "$jar" -b "$jar" \
            "$BASE_URL/api.php?action=bootstrap" -o "$bootstrap_json"
          api_csrf=$(python3 - "$bootstrap_json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x.get('ok') is True, x
          assert x.get('version')=='2.5.3', x.get('version')
          c=x.get('csrf',''); assert isinstance(c,str) and c
          print(c)
          PY
          )
          echo 'PRODUCTION_INSTALLED_VERSION=2.5.3'

          curl --fail --silent --show-error --max-time 45 -c "$jar" -b "$jar" \
            -H "Origin: $BASE_URL" -H "Referer: $BASE_URL/index.php" \
            -H "X-CSRF-Token: $api_csrf" \
            -X POST --data '' "$BASE_URL/api.php?action=update_check" -o "$update_json"

          python3 - "$update_json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x.get('ok') is True, x
          u=x.get('update') or {}
          assert u.get('current_version')=='2.5.3', u
          assert u.get('latest_version')=='2.5.5', u
          assert u.get('status')=='update_available', u
          assert u.get('can_update') is True, u
          assert u.get('allowed_source_versions')==['2.5.3'], u
          assert u.get('release_tag')=='v2.5.5', u
          assert u.get('asset_name')=='VF_Infra_V2.5.5_UPDATE.zip', u
          assert int(u.get('update_bytes',0))==217485, u
          assert u.get('update_sha256')=='8a42054b0ae507fa1e91dd55884efea4d94c29cedf3375dade50bff17b14669a', u
          assert u.get('latest_version')!='2.5.4'
          print('PRODUCTION_DISCOVERY=PASS')
          print('PRODUCTION_TARGET=2.5.5')
          print('V254_OFFER=NOT_PRESENT')
          print('UPDATE_AVAILABLE=YES')
          PY
          echo 'PRODUCTION_OPERATIONAL_WRITE=ACCOUNTED_LOGIN_SESSION_UPDATE_CHECK_CACHE_SCHEDULE_AUDIT_SECURITY_LOG'
          echo 'PRODUCTION_PRODUCT_WRITE=0'
          echo 'PRODUCTION_BUSINESS_DATA_WRITE=0'
          echo 'UPDATE_PREPARE=NOT_CALLED'
          echo 'HANDOFF=NOT_CREATED'
          echo 'MAINTENANCE=NOT_ENTERED'
          echo 'ATOMIC_UPGRADE=NOT_EXECUTED'

      - name: Discovery stop ruling
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ '${{ steps.channel.outputs.available }}' = 'true' ]; then
            echo 'STOP_FOR_MASTER_PRODUCTION_UPGRADE_AUTHORIZATION'
          else
            echo 'PRODUCTION_DISCOVERY=BLOCKED_NOT_EXECUTED'
            echo 'WINDOW_EXECUTION_BLOCK=PRODUCTION_AUTHENTICATED_DISCOVERY_CHANNEL_UNAVAILABLE'
            echo 'PRODUCTION_OPERATIONAL_WRITE=0'
            echo 'PRODUCTION_PRODUCT_WRITE=0'
            echo 'PRODUCTION_BUSINESS_DATA_WRITE=0'
            echo 'ATOMIC_UPGRADE=NOT_EXECUTED'
          fi
