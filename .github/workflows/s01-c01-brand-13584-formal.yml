name: S01-C01 brand formal release
on:
  push:
    branches: [task/s01-c01-brand-13584-formal]
permissions:
  contents: read
  actions: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_REPO: 'llhzx2018/vf-tools-theme'
      TARGET_VERSION: '1.35.84'
      TARGET_SHA: '20ffe26fb4f76803a322d42858140070db089926'
      TARGET_TREE: 'c83eb641055d881c53e521e9079562da28afc813'
      SOURCE_VERSION: '1.35.83'
      BASE_SHA: '38826cea3ed5a89e23698280fa9dcfdd598f3170'
      CANDIDATE_RUN: '37220653980'
      CANDIDATE_SHA: '6b9346cf30ee4167a1eec1a6657cf37160f5b60b'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runner
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Reverse verify exact tested tree and rebuilt bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$CANDIDATE_RUN --jq .conclusion)" = success
          gh run download "$CANDIDATE_RUN" --repo llhzx2018/core-free-runner-public --name "s01-c01-brand-candidate-$CANDIDATE_RUN" --dir tested
          python3 - <<'PYREVERSE'
          import json,pathlib,os
          t=json.loads(pathlib.Path('tested/FINAL_EVIDENCE.json').read_text())
          assert t['status']=='PASS' and t['source_sha']==os.environ['CANDIDATE_SHA'] and t['source_tree']==os.environ['TARGET_TREE'] and t['version']==os.environ['TARGET_VERSION']
          for k in ['upgrade','source_rollback','wordpress_browser','security_boundary','frozen_shell_header_menu','recovery_data','baseline_reproduced']:assert t[k]=='PASS',k
          assert t['brand_viewports']==6 and t['recovery_data_check_count']==42
          live=json.loads(pathlib.Path('tested/live-browser.json').read_text());data=json.loads(pathlib.Path('tested/recovery-data.json').read_text());baseline=json.loads(pathlib.Path('tested/baseline.json').read_text())
          required=['empty_tagline_save_reload','invalid_empty_color_stays_dirty','five_color_pairs_save','font_presets_custom_save','six_numeric_controls_save','invalid_numeric_rejected','seven_recipes_candidate_only','readonly_diff_dialog_keyboard','busy_isolates_all_mutation_controls','network_retains_input_and_retry','invalid_json_retains_input_and_retry','incomplete_retains_input_and_retry','http_retains_input_and_retry','timeout_retains_input_and_retry','conflict_retry_cannot_overwrite','conflict_candidate_export','saved_candidate_exports','import_preflight_apply_save','import_invalid_preserves_form','import_latest_file_wins','media_select_modes_remove_save','reset_five_scopes_candidate_only','advanced_write_cannot_discard_brand_draft','preset_preflight_confirm_apply','no_javascript_native_save_reload','permission_denied_preserves_saved_state']
          assert set(t['brand_functional_checks'])==set(required) and t['brand_functional_checks']==live['functional'] and all(live['functional'][k]=='PASS' for k in required)
          assert all(baseline[k]=='REPRODUCED' for k in ['emptyTaglineBlocksSave','conflictRetryOverwritesOtherWindow','incompleteResponseClaimsSaved','editDuringSaveLost','titleInsetDiffersFromOverview'])
          assert len(live['checks'])==6 and all(c['save_reload']=='PASS' and c['advanced_interactions']=='PASS' and c['frozen_header_parity']=='PASS' for c in live['checks']) and not live['errors']
          assert data['status']=='PASS' and len(data['checks'])==42 and all(v=='PASS' for v in data['checks'].values())
          assert t['owner_preview_runtime']=='N_A' and t['owner_real_use']=='POST_PRODUCTION_REQUIRED' and t['production']=='NOT_EXECUTED'
          PYREVERSE
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          cp -a runner/lanes/s01-c01-brand-13584 lane
          python3 lane/build.py
          python3 - <<'PY'
          import json,pathlib
          tested=json.loads(pathlib.Path('tested/FINAL_EVIDENCE.json').read_text()); built=json.loads(pathlib.Path('proof/identity.json').read_text())
          for key in ['asset','asset_bytes','asset_sha256','source_tree','version']: assert tested[key]==built[key],key
          PY
      - name: Publish private formal Release and exact remote readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          ASSET="vf-tools-theme_V${TARGET_VERSION}.zip"; TAG="v$TARGET_VERSION"
          cat > /tmp/release-notes.md <<EOF
          VF Tools Theme V$TARGET_VERSION

          品牌与样式：标题、表单和高级设置统一对齐冻结壳的内容宽度；主设置与低频操作清晰分组，控件、字体和手机排版保持一致。
          修复空品牌说明无法保存、保存期间新输入丢失、冲突后重试覆盖其他窗口、不完整响应误报成功，以及导入文件异步竞态。Logo支持真实媒体选择、移除和三种显示模式，自定义字体入口可操作。高级写入会保护未保存草稿。
          仅品牌view/CSS/JS、版本三文件及验收矩阵，共7文件；壳/头部/主菜单、持久化服务、权限、继承与升级机制保持原字节。
          Exact candidate Run: $CANDIDATE_RUN。五个旧版问题复现；26项真实浏览器功能检查与六宽度截图通过。隔离真实WordPress42项数据回归与$SOURCE_VERSION→$TARGET_VERSION原生升级/回退/再应用通过。
          Production由OWNER手工升级；独立Preview Runtime按SSOT为N_A，机器与Assistant检查不代表OWNER真实使用PASS。
          Exact promoted source: $TARGET_SHA; tree: $TARGET_TREE。
          EOF
          if gh release view "$TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            test "$(gh api repos/$TARGET_REPO/git/ref/tags/$TAG --jq .object.sha)" = "$TARGET_SHA"
          else
            gh release create "$TAG" "proof/$ASSET" --repo "$TARGET_REPO" --target "$TARGET_SHA" --title "VF Tools Theme V$TARGET_VERSION" --notes-file /tmp/release-notes.md
          fi
          gh api "repos/$TARGET_REPO/releases/tags/$TAG" > proof/remote-release.json
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/$TAG --jq .object.sha)" = "$TARGET_SHA"
          mkdir readback
          gh release download "$TAG" --repo "$TARGET_REPO" --pattern "$ASSET" --dir readback
          cmp "proof/$ASSET" "readback/$ASSET"
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('proof'); m=json.loads((p/'identity.json').read_text());r=json.loads((p/'remote-release.json').read_text());t=json.loads(pathlib.Path('tested/FINAL_EVIDENCE.json').read_text());assert not r['draft'] and not r['prerelease'];a=[a for a in r['assets'] if a['name']==m['asset']];assert len(a)==1 and a[0]['size']==m['asset_bytes'] and a[0]['digest']=='sha256:'+m['asset_sha256'];m.update(release_id=r['id'],asset_id=a[0]['id'],released_at=r['published_at'],runtime_files=t['runtime_files'],runtime_fingerprint=t['runtime_fingerprint'],candidate_run=t['candidate_run'],formal_release='PASS',remote_readback='PASS',distribution='NOT_EXECUTED',production='NOT_EXECUTED');(p/'RELEASE_RECEIPT.json').write_text(json.dumps(m,indent=2));print(json.dumps(m))
          PY
      - name: Public-safe receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c01-brand-release-${{ github.run_id }}
          path: proof/RELEASE_RECEIPT.json
          retention-days: 30
          if-no-files-found: error
      - name: Private workspace cleanup
        if: always()
        run: rm -rf target readback proof/*.zip
