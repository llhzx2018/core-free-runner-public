name: P02 V2.4.25 Overlay Hash
on:
  push:
    branches: [main]
    paths: ['.github/workflows/p02-v2.4.25-overlay-hash.yml']
permissions:
  contents: read
jobs:
  hash:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: task/v2.4.25-attachment-ux
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p02
          persist-credentials: false
      - shell: bash
        run: |
          set -Eeuo pipefail
          echo "TASK_HEAD=$(git -C p02 rev-parse HEAD)"
          echo "ATTACHMENTS_BYTES=$(wc -c < p02/public/assets/attachments.js | tr -d ' ')"
          echo "ATTACHMENTS_SHA256=$(sha256sum p02/public/assets/attachments.js | awk '{print $1}')"
          node --check p02/public/assets/attachments.js
          grep -Fq "overlay.addEventListener('keydown',onKeydown,true)" p02/public/assets/attachments.js
          grep -Fq "overlay.removeEventListener('keydown',onKeydown,true)" p02/public/assets/attachments.js
          echo 'OVERLAY_ESCAPE_SCOPE=PASS'
      - if: always()
        run: rm -rf p02
