name: S01-C01 preview exact engine diagnostic
on:
  push:
    branches: [task/s01-c01-preview100-20261007-candidate]
permissions:
  contents: read
  actions: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TARGET_REPO: 'llhzx2018/vf-tools-theme'
      TARGET_VERSION: '1.35.100'
      TARGET_SHA: '6e806709e23c824f4c5f3bb69a40f0eb47dab19c'
      TARGET_TREE: '1a8c5c8f9cf6b0d76ef29c7816f06958a68acaae'
      SOURCE_VERSION: '1.35.99'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Target-owned lane identity preflight
        run: |
          set -Eeuo pipefail
          mkdir -p proof
          python3 runner/scripts/ephemeral_lane_spec.py render --spec runner/lanes/s01-c01-preview100-20261007/spec.json --template runner/lanes/s01-c01-preview100-20261007/diagnostic.template.yml --output /tmp/preview-candidate-rendered.yml >/dev/null
          cmp /tmp/preview-candidate-rendered.yml runner/.github/workflows/s01-c01-preview100-20261007-candidate.yml
          python3 runner/scripts/ephemeral_lane_spec.py audit-rendered --spec runner/lanes/s01-c01-preview100-20261007/spec.json --input runner/.github/workflows/s01-c01-preview100-20261007-candidate.yml > proof/lane-identity-audit.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact identity and focused contracts
        run: |
          set -Eeuo pipefail
          cp -a runner/lanes/s01-c01-preview100-20261007 lane
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find target/src -type f -name '*.php' -print0)
          php target/tests/preview-human-language-followup-contract.php
          php target/tests/preview-workflow-v4-contract.php
          node --check target/tests/preview-controls-browser-check.js
          node --check target/tests/preview-workflow-browser-check.js
          python3 lane/build.py
      - name: Previous exact formal asset
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          mkdir previous
          gh release download v1.35.99 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.99.zip --dir previous
          test "$(stat -c %s previous/vf-tools-theme_V1.35.99.zip)" = 1785921
          test "$(sha256sum previous/vf-tools-theme_V1.35.99.zip | awk '{print $1}')" = 4d66a813f233f8118b3e69d71ed000f53a8fc769a424d4f3f6116746048851df
      - name: Browser dependencies
        run: |
          set -Eeuo pipefail
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -g -fsSL --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC[wght].ttf' -o "$HOME/.local/share/fonts/NotoSansSC.ttf"
          fc-cache -f
      - name: Actual isolated preview controls and engine issues
        run: bash lane/wordpress-diagnostic.sh
      - name: Native upgrade rollback clean install and cross-page preservation
        run: bash lane/wordpress-chain.sh
      - name: Public-safe evidence only
        id: proof_artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c01-preview-diagnostic-${{ github.run_id }}
          path: |
            proof/**/*.json
            proof/**/*.png
            checks/**/*.json
            checks/**/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Read back actual uploaded evidence ZIP
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PROOF_ARTIFACT_ID: ${{ steps.proof_artifact.outputs.artifact-id }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PROOF_ARTIFACT_ID" > /tmp/public-proof-meta.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PROOF_ARTIFACT_ID/zip" > /tmp/public-proof-readback.zip
          python3 - <<'PYVERIFY'
          import json,hashlib,zipfile,pathlib,os,stat
          meta=json.loads(pathlib.Path('/tmp/public-proof-meta.json').read_text())
          data=pathlib.Path('/tmp/public-proof-readback.zip').read_bytes()
          digest='sha256:'+hashlib.sha256(data).hexdigest()
          assert meta['id']==int(os.environ['PROOF_ARTIFACT_ID'])
          assert meta['workflow_run']['id']==int(os.environ['GITHUB_RUN_ID'])
          assert meta['workflow_run']['head_sha']==os.environ['GITHUB_SHA']
          assert meta['size_in_bytes']==len(data) and meta['digest']==digest
          assert meta['expired'] is False
          with zipfile.ZipFile('/tmp/public-proof-readback.zip') as z:
              assert z.testzip() is None
              names=z.namelist()
              assert names and len(names)==len(set(names))
              for info in z.infolist():
                  p=pathlib.PurePosixPath(info.filename)
                  assert not p.is_absolute() and '..' not in p.parts and '\\' not in info.filename
                  assert not stat.S_ISLNK(info.external_attr>>16)
                  assert p.suffix in ['.json','.png']
                  if p.suffix=='.json': json.loads(z.read(info))
              final=json.loads(z.read('proof/FINAL_EVIDENCE.json'))
              assert final['status']=='PASS' and final['source_sha']==os.environ['TARGET_SHA'] and final['source_tree']==os.environ['TARGET_TREE']
          receipt={'status':'PASS','artifact_id':meta['id'],'run_id':int(os.environ['GITHUB_RUN_ID']),'runner_sha':os.environ['GITHUB_SHA'],'source_sha':os.environ['TARGET_SHA'],'source_tree':os.environ['TARGET_TREE'],'bytes':len(data),'digest':digest,'file_count':len(names),'crc':'PASS','safe_paths':'PASS','json_parse':'PASS'}
          print('VF_ARTIFACT_RECEIPT_BEGIN')
          print(json.dumps(receipt))
          print('VF_ARTIFACT_RECEIPT_END')
          PYVERIFY
      - name: Private workspace cleanup
        if: always()
        run: rm -rf target proof/*.zip /tmp/wp-cli.phar




