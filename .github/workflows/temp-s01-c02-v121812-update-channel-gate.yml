name: TEMP S01-C02 v1.21.812 Update Channel Gate
on:
  push:
    branches: [temp/s01-c02-v121812-shared-bootstrap-20260905]
    paths: ['.github/workflows/temp-s01-c02-v121812-update-channel-gate.yml']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CORE_BASE: 6c5f69c34d2604dcc03e7f16a0a2de625d2216b0
      CORE_CANDIDATE: 7856c85bdb8e62edeaf36d4110821ad32cc07052
      OPS_SOURCE: b32ea5d6012aa25305ed23b3aaadc4bf048e8c3c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CORE_CANDIDATE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: core
      - name: Verify exact channel scope and manifest
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          live_core="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/core-updates/branches/main | jq -r '.commit.sha')"
          test "$live_core" = "$CORE_BASE"
          test "$(git -C core diff --name-only "$CORE_BASE" "$CORE_CANDIDATE")" = 'projects/S01-C02.json'
          jq -e '.target_version=="1.21.812" and .from_versions==["1.21.811"] and .release_tag=="v1.21.812" and .asset_bytes==3219158 and .asset_sha256=="fe0e63128855cd86d0de3c0d44db5483d79b640bc84baee12c4740f34296a534" and .schema_from=="6.0.0" and .schema_to=="6.0.0" and .runtime_files==900 and .runtime_fingerprint=="3218240f84657b697ad489cc3e4fa9b7dcd585128f9888691c10b4c4476ba681"' core/projects/S01-C02.json >/dev/null
          echo EXACT_CHANNEL_SCOPE=PASS
      - name: Verify Release and promoted source authority
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          branch(){ curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/llhzx2018/vf-tools-ops/branches/$1" | jq -r '.commit.sha'; }
          test "$(branch main)" = "$OPS_SOURCE"
          test "$(branch develop)" = "$OPS_SOURCE"
          j="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.812)"
          test "$(jq -r '.target_commitish' <<<"$j")" = "$OPS_SOURCE"
          test "$(jq -r '.assets[]|select(.name=="vf-tools-ops_V1.21.812.zip")|.size' <<<"$j")" = 3219158
          test "$(jq -r '.assets[]|select(.name=="vf-tools-ops_V1.21.812.zip")|.digest' <<<"$j")" = sha256:fe0e63128855cd86d0de3c0d44db5483d79b640bc84baee12c4740f34296a534
          echo RELEASE_AND_SOURCE_AUTHORITY=PASS
      - name: Production source sanity
        run: |
          set -Eeuo pipefail
          p="$(curl -fsSL --retry 2 --max-time 20 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-domain-authority')"
          echo "$p" | jq -e '.pluginVersion=="1.21.811" and .status=="CURRENT" and .authorityFinalHost=="https://ilovem3u8.com"' >/dev/null
          echo PRODUCTION_OPS_1_21_811=PASS
          echo PASS_V121812_UPDATE_CHANNEL_GATE
