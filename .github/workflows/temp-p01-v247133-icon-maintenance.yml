name: P01 V2.47.133 Icon Maintenance Gate

on:
  push:
    branches:
      - test-p01-v247133-icon-maintenance-20260930
    paths:
      - '.github/workflows/temp-p01-v247133-icon-maintenance.yml'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact P01 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 4d2555f6b1213522b7e2cc219e61fccf5e980ff4
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate

      - name: Checkout exact P01 baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 6659197f722bc2d99082a8f88863d59e1cf09303
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: baseline

      - name: Syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l candidate/src/app/IconCache.php
          php -l candidate/src/api.php
          php -l candidate/src/icons.php
          php -l candidate/src/app/AdminShell.php
          php -l candidate/tests/unit/admin_icon_maintenance_v247133_contract.php
          node --check candidate/src/assets/icons.js
          echo P01_V247133_ICON_MAINTENANCE_SYNTAX=PASS

      - name: Focused contracts
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          php tests/unit/admin_icon_maintenance_v247133_contract.php
          php tests/unit/admin_retired_routes_css_r32_contract.php
          php tests/unit/admin_backend_coverage_r60_contract.php
          php tests/unit/admin_navigation_consistency_contract.php
          php tests/unit/navigation_v247127_favicon_reliability_contract.php
          php tests/unit/navigation_v247128_favicon_recovery_queue_contract.php
          php tests/unit/navigation_v247130_favicon_provider_generation_contract.php
          php tests/unit/navigation_v247131_favicon_stale_success_selfheal_contract.php
          php tests/unit/navigation_v247132_favicon_success_generation_refresh_contract.php
          php tests/unit/navigation_v247133_favicon_all_view_recovery_contract.php
          echo P01_V247133_ICON_MAINTENANCE_FOCUSED=PASS

      - name: Canonical zero-debt regression
        shell: bash
        run: |
          set -euo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate baseline --require-zero-debt
          echo P01_V247133_ICON_MAINTENANCE_CANONICAL=PASS
