name: P03 Project Intelligence MCP Diagnose

on:
  pull_request:
    branches: [main]
    paths: ['ops/p03/**', '.github/workflows/p03-project-intelligence-mcp-diagnose.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  P03_REPOSITORY: llhzx2018/vf-forge
  P03_COMMIT: 3be2ded75acb79172e0c81082d133e08b8d68bc5
  FIXTURE_PASS: VfM-2026-Test-Fixture!
  PHP_TEST_IMAGE: vf-forge-pi-mcp-diag-php84

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact private P03 source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.P03_REPOSITORY }}
          ref: ${{ env.P03_COMMIT }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p03

      - name: Prepare PHP 8.4 runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sqlite3 >/dev/null
          cat >"$RUNNER_TEMP/Dockerfile.p03-mcp-diag" <<'EOF'
          FROM php:8.4-cli-bookworm
          ARG HOST_UID=1001
          ARG HOST_GID=121
          RUN apt-get update \
            && apt-get install -y --no-install-recommends libzip-dev libsqlite3-dev sqlite3 curl \
            && docker-php-ext-install pdo_sqlite zip \
            && rm -rf /var/lib/apt/lists/*
          USER ${HOST_UID}:${HOST_GID}
          EOF
          docker build --build-arg "HOST_UID=$(id -u)" --build-arg "HOST_GID=$(id -g)" -t "$PHP_TEST_IMAGE" -f "$RUNNER_TEMP/Dockerfile.p03-mcp-diag" "$RUNNER_TEMP" >/dev/null

      - name: MCP exact diagnostic E2E
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p03
          test "$(git rev-parse HEAD)" = "$P03_COMMIT"
          python3 tests/unit/project_intelligence_mcp_contract_test.py
          php -l public/mcp/index.php
          php -l src/app/ProjectIntelligenceService.php
          bash tests/maintenance/project_intelligence_mcp.sh

      - name: Diagnostic final
        shell: bash
        run: |
          echo 'P03_MCP_DIAGNOSE=PASS'
          echo "P03_COMMIT=$P03_COMMIT"
          echo 'PRODUCTION_WRITE=NO'
