name: temp-s01-admin-surface-compact-map-20260908
on:
  push:
    branches: [temp/s01-page-update-center-v4-20260907]
    paths: [.github/workflows/temp-s01-admin-surface-compact-map-20260908.yml]
permissions:
  contents: read
jobs:
  map:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      OPS_SHA: fed61edd6df2f8bdd07d8b3f18707fcb33e412bf
      M3U8_SHA: 22247609c95e1c2bf5a85e81c6ebb2c8caac3f6b
    steps:
      - name: Compact map
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/ops /tmp/m3u8
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-tools-ops.git" /tmp/ops
          git -C /tmp/ops checkout -q "$OPS_SHA"
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-tools-m3u8.git" /tmp/m3u8
          git -C /tmp/m3u8 checkout -q "$M3U8_SHA"
          echo '=== OPS MENU CONTRACT ==='
          grep -RIn --include='*.php' 'vf_ops_v13_menu_contract_v121391' /tmp/ops/includes | cut -d: -f1-2 | head -n 20
          file=$(grep -Rl --include='*.php' 'function vf_ops_v13_menu_contract_v121391' /tmp/ops/includes | head -n1 || true)
          if [ -n "$file" ]; then
            line=$(grep -n 'function vf_ops_v13_menu_contract_v121391' "$file" | head -n1 | cut -d: -f1)
            sed -n "${line},$((line+95))p" "$file"
          fi
          echo '=== OPS VIEW FILES ==='
          find /tmp/ops/includes/admin-v13/views -maxdepth 1 -type f -name '*.php' -printf '%f\n' | sort
          echo '=== OPS CURRENT CSS ==='
          find /tmp/ops/assets/css/current -maxdepth 1 -type f -name '*.css' -printf '%f\n' | sort
          echo '=== OPS VIEW INCLUDE MAP ==='
          grep -RInE --include='*.php' "views/[a-zA-Z0-9_-]+\.php|require.*views|include.*views" /tmp/ops/includes/admin-v13 /tmp/ops/includes | sed 's#/tmp/ops/##' | head -n 120 || true

          echo '=== M3U8 ADMIN CONTROLLERS ==='
          find /tmp/m3u8/src/admin/Controller -maxdepth 1 -type f -name '*.php' -printf '%f\n' | sort
          echo '=== M3U8 MENU REGISTRATIONS ==='
          grep -RInE --include='*.php' 'add_(menu_page|submenu_page|management_page)\s*\(' /tmp/m3u8/src/admin /tmp/m3u8/src/includes | sed 's#/tmp/m3u8/##' | head -n 120 || true
          echo '=== M3U8 UI CSS ==='
          find /tmp/m3u8/src/admin -type f -name '*.css' -printf '%P\n' | sort
          echo '=== M3U8 HEADINGS ==='
          grep -RInE --include='*.php' '<h1|<h2|工作台|配置|来源|规则|日志|诊断|历史|监控|队列|验证|预览' /tmp/m3u8/src/admin/Controller /tmp/m3u8/src/admin | sed 's#/tmp/m3u8/##' | head -n 160 || true
          echo 'PASS_S01_ADMIN_SURFACE_COMPACT_MAP'
