name: S01 Theme M3U8 Dropdown Interaction Parity Gate

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/s01-dropdown-interaction-parity-gate-20260925.yml'

permissions:
  contents: read

jobs:
  gate:
    if: github.head_ref == 'task/s01-dropdown-interaction-parity-gate-20260925'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact Theme candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 0798e4b8494298999ed892da073ba988c7dcb761
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: theme

      - name: Theme interaction contract
        working-directory: theme
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "0798e4b8494298999ed892da073ba988c7dcb761"
          test "$(tr -d '\r\n' < VERSION)" = "1.35.42"
          php -l tests/s01-c01-admin-shell-alignment-r1-contract.php
          php tests/s01-c01-admin-shell-alignment-r1-contract.php
          grep -Fq 'R16 Header dropdown interaction parity with OPS' src/assets/js/admin/admin-console.js
          grep -Fq "document.addEventListener('pointerdown'" src/assets/js/admin/admin-console.js
          grep -Fq "event.key !== 'Escape'" src/assets/js/admin/admin-console.js
          grep -Fq '.vf-v6-domain-flyout a' src/assets/js/admin/admin-console.js
          grep -Fq 'details.open = false' src/assets/js/admin/admin-console.js

      - name: Checkout exact M3U8 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: 24f7009d9cd50f9fdbdbad176e4e005ccb5189fb
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: m3u8

      - name: M3U8 interaction contract
        working-directory: m3u8
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "24f7009d9cd50f9fdbdbad176e4e005ccb5189fb"
          test "$(tr -d '\r\n' < VERSION)" = "1.25.46"
          php -l tests/s01-c03-admin-shell-alignment-r1-contract.php
          php tests/s01-c03-admin-shell-alignment-r1-contract.php
          grep -Fq 'R19 Header dropdown interaction parity with OPS' src/admin/admin-s01-human-language-final.js
          grep -Fq "addEventListener('pointerdown'" src/admin/admin-s01-human-language-final.js
          grep -Fq "event.key !== 'Escape'" src/admin/admin-s01-human-language-final.js
          grep -Fq '.vf-v6-domain-flyout a' src/admin/admin-s01-human-language-final.js
          grep -Fq 'details.open = false' src/admin/admin-s01-human-language-final.js
          grep -Fq 'R17 · Unified compact Professional Mode dropdown' src/admin/ui-v4/admin-s01-shell-header-final-r14.css
          grep -Fq 'R18 · Compact primary nav hit-area parity' src/admin/ui-v4/admin-s01-shell-header-final-r14.css

      - name: Source syntax
        run: |
          set -Eeuo pipefail
          find theme/src -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          find m3u8/src -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
