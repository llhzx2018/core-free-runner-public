name: P01 V2.33 Publication
on:
  push:
    branches: [task/p01-v2330-formal-release-20260830]
    paths: [.github/workflows/p01-v2330-publication-20260830.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Publication precheck
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/vf-start/branches/main --jq .commit.sha)" = 8c819c8bfd055d16b3ac367cef15f723431d9a42
          test "$(gh api repos/llhzx2018/vf-start/branches/develop --jq .commit.sha)" = 8c819c8bfd055d16b3ac367cef15f723431d9a42
          test "$(gh api repos/llhzx2018/vf-start/contents/VERSION?ref=main --jq .content | tr -d '\n' | base64 -d | tr -d '\r\n')" = 2.33.0
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33268865316 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33269044619 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33269077239 --jq .conclusion)" = success
          if gh api repos/llhzx2018/vf-start/git/ref/tags/v2.33.0 >/dev/null 2>&1; then echo 'v2.33.0 tag already exists'; exit 2; fi
          if gh api repos/llhzx2018/vf-start/releases/tags/v2.33.0 >/dev/null 2>&1; then echo 'v2.33.0 release already exists'; exit 3; fi
          echo P01_V2330_PUBLICATION_PRECHECK=PASS
      - name: Fetch exact PASS artifact
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-v2330-publish /tmp/p01-v2330-artifact.zip
          mkdir -p /tmp/p01-v2330-publish
          gh api --method GET repos/llhzx2018/core-free-runner-public/actions/artifacts/9719477166/zip > /tmp/p01-v2330-artifact.zip
          unzip -q /tmp/p01-v2330-artifact.zip -d /tmp/p01-v2330-publish
          cd /tmp/p01-v2330-publish
          test "$(find . -maxdepth 1 -type f | wc -l)" = 8
          sha256sum -c SHA256SUMS.txt
          test "$(sha256sum VF-Start-V2.33.0-FULL.zip | awk '{print $1}')" = 0b7c7c2d43c4d399dff562a7b08d008bbe6019d1e04b6637cf0196278def5df0
          test "$(sha256sum VF_Start_V2.33.0_UPDATE.zip | awk '{print $1}')" = 9520e7f45b37341456fe9f1dba1f248fe02e84143c52230760fcddb307226a9c
          test "$(sha256sum VF-Start-V2.33.0-UPDATE.zip | awk '{print $1}')" = 9520e7f45b37341456fe9f1dba1f248fe02e84143c52230760fcddb307226a9c
          test "$(sha256sum repair-v2.33.0.php | awk '{print $1}')" = 7283a4f96dabb1ba926aad726f8021f1bbf8676982adfa6abee8df488f8dcab5
          jq -e '.formal_artifact_gate=="PASS" and .release_source=="8c819c8bfd055d16b3ac367cef15f723431d9a42" and .release_tree=="db5a6e2b6a852e6925727b974fb7130359e3cdf8" and .product_source=="faf853ab897c9e9b080dd365ab54df7698a8428c" and .runtime_tree=="febc1b01a5b59963bc974cdc6455cfa824c0adc3" and .source_version=="2.32.0" and .schema=="2026082901" and .schema_change==false and .owner_production_write==false' P01-V2.33.0-FORMAL-METADATA.json >/dev/null
          test "$(jq -r .full.sha256 P01-V2.33.0-FORMAL-METADATA.json)" = 0b7c7c2d43c4d399dff562a7b08d008bbe6019d1e04b6637cf0196278def5df0
          test "$(jq -r .update.sha256 P01-V2.33.0-FORMAL-METADATA.json)" = 9520e7f45b37341456fe9f1dba1f248fe02e84143c52230760fcddb307226a9c
          test "$(jq -r .repair.sha256 P01-V2.33.0-FORMAL-METADATA.json)" = 7283a4f96dabb1ba926aad726f8021f1bbf8676982adfa6abee8df488f8dcab5
          stat -c '%n %s' VF-Start-V2.33.0-FULL.zip VF_Start_V2.33.0_UPDATE.zip repair-v2.33.0.php | tee /tmp/p01-v2330-asset-sizes.txt
          echo P01_V2330_EXACT_PASS_ARTIFACT=PASS
      - name: Create immutable tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api --method POST repos/llhzx2018/vf-start/git/refs -f ref=refs/tags/v2.33.0 -f sha=8c819c8bfd055d16b3ac367cef15f723431d9a42 >/tmp/p01-v2330-tag.json
          test "$(jq -r .object.sha /tmp/p01-v2330-tag.json)" = 8c819c8bfd055d16b3ac367cef15f723431d9a42
          cat >/tmp/p01-v2330-notes.md <<'EOF'
          VF Start V2.33.0 继续把首页健康信号从“看到异常”推进到“能直接处理异常”。

          - 首页健康卡升级为可行动的健康分诊入口，直接连接到健康检查工作区。
          - 健康状态、异常数量与目标入口保持同一 LinkHealth / Resource Authority，不建立影子状态。
          - 保持 V2.32 Home Command Center 的收藏、最近资源、近期操作与移动端工作台结构。
          - 匿名 Public Navigator 与 Owner 私有工作区边界保持不变。
          - Schema 继续为 2026082901，无 Migration。
          - 支持从 V2.32.0 Atomic 升级；Formal Artifact Gate 33268865316 PASS，Strict Fresh Install Fence 33269044619 PASS。
          - 本 Release 不自动写 Owner Production。
          EOF
          cd /tmp/p01-v2330-publish
          gh release create v2.33.0 \
            P01-V2.33.0-ARTIFACT-GATE.json \
            P01-V2.33.0-FORMAL-METADATA.json \
            SHA256SUMS.txt \
            VF-Start-V2.33.0-FULL.zip \
            VF-Start-V2.33.0-UPDATE.zip \
            VF_Start_V2.33.0_UPDATE.zip \
            atomic-self-test.json \
            repair-v2.33.0.php \
            --repo llhzx2018/vf-start --title 'VF Start V2.33.0' --notes-file /tmp/p01-v2330-notes.md --verify-tag
          gh api repos/llhzx2018/vf-start/releases/tags/v2.33.0 > /tmp/p01-v2330-release.json
          test "$(jq -r .tag_name /tmp/p01-v2330-release.json)" = v2.33.0
          test "$(jq -r .draft /tmp/p01-v2330-release.json)" = false
          test "$(jq -r .prerelease /tmp/p01-v2330-release.json)" = false
          test "$(jq '.assets|length' /tmp/p01-v2330-release.json)" = 8
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.33.0_UPDATE.zip")|.digest' /tmp/p01-v2330-release.json)" = sha256:9520e7f45b37341456fe9f1dba1f248fe02e84143c52230760fcddb307226a9c
          test "$(jq -r '.assets[]|select(.name=="VF-Start-V2.33.0-UPDATE.zip")|.digest' /tmp/p01-v2330-release.json)" = sha256:9520e7f45b37341456fe9f1dba1f248fe02e84143c52230760fcddb307226a9c
          test "$(jq -r '.assets[]|select(.name=="VF-Start-V2.33.0-FULL.zip")|.digest' /tmp/p01-v2330-release.json)" = sha256:0b7c7c2d43c4d399dff562a7b08d008bbe6019d1e04b6637cf0196278def5df0
          test "$(jq -r '.assets[]|select(.name=="repair-v2.33.0.php")|.digest' /tmp/p01-v2330-release.json)" = sha256:7283a4f96dabb1ba926aad726f8021f1bbf8676982adfa6abee8df488f8dcab5
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.33.0 --jq .object.sha)" = 8c819c8bfd055d16b3ac367cef15f723431d9a42
          jq -r '.id, (.assets[] | [.name,.size,.digest] | @tsv)' /tmp/p01-v2330-release.json | tee /tmp/p01-v2330-publication-readback.txt
          echo P01_V2330_TAG_REMOTE_READBACK=PASS
          echo P01_V2330_GITHUB_RELEASE=PASS
          echo CORE_UPDATES_WRITE=NO
          echo OWNER_PRODUCTION_WRITE=NO
      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-v2330-publication-${{ github.run_id }}
          path: |
            /tmp/p01-v2330-tag.json
            /tmp/p01-v2330-release.json
            /tmp/p01-v2330-asset-sizes.txt
            /tmp/p01-v2330-publication-readback.txt
          if-no-files-found: warn
          retention-days: 90
