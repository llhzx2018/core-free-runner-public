name: P07 node rc13 no-backup formal delivery
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-node-rc13-no-backup-one-shot.yml'
permissions:
  contents: read
jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      github.event.pull_request.title == 'release(P07): remove standalone node backup rc13'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout canonical public distribution main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Verify exact release target and all 13 gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '64e8f7946f7f514fc189e6db96bc1cb7aaa2ee35'
          test "$(cat dist/p07/0.1.0/overlay/BUILD_ID)" = '0.1.0-release84'
          pkg='packages/p07-network-node/0.1.0-rc13'
          test "$(cat "$pkg/VERSION")" = '0.1.0-rc13'
          test ! -e "$pkg/backup.sh"
          (cd "$pkg" && sha256sum -c MANIFEST.sha256)
          test "$(sha256sum "$pkg/MANIFEST.sha256" | awk '{print $1}')" = '1ca3dc95a5cc6e5aa35c9b7ead415d3b6ea6c6eb9e8307a76310d146ab53c47f'
          grep -Fq "VERSION='0.1.0-rc13'" installers/vf-node.sh
          grep -Fq "MANIFEST_SHA256='1ca3dc95a5cc6e5aa35c9b7ead415d3b6ea6c6eb9e8307a76310d146ab53c47f'" installers/vf-node.sh
          grep -Fq 'VF_NODE_EXPECTED="0.1.0-rc13"' installers/p07-toolbox.sh
          grep -Fq 'VPS_AUDIT_EXPECTED="V2.1.0"' installers/p07-toolbox.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release84"' installers/p07-toolbox.sh
          grep -Fq '请选择 [0-4]' "$pkg/vf-node.sh"
          grep -Fq '4) run_and_pause bash "$SCRIPT_DIR/uninstall.sh"' "$pkg/vf-node.sh"
          ! grep -Fq 'backup.sh' "$pkg/vf-node.sh"
          ! grep -Fq 'backup.sh' installers/vf-node.sh
          grep -Fq 'create_uninstall_recovery_copy || exit 1' "$pkg/uninstall.sh"
          for id in 37747946428 37747946440 37747946474 37747946285 37747946283 37747946423 37747946516 37747946496 37747946472 37747946341 37747946335 37747946425 37747946416; do
            test "$(gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$id" --jq .head_sha)" = 'ccbfc7d45a57936aa98f82b3620e3051d379cc94'
            test "$(gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$id" --jq .conclusion)" = success
          done
          echo P07_NETWORK_NODE_RC13_FORMAL_PRECONDITIONS=PASS
      - name: Publish formal release and read back
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          repo='llhzx2018/core-free-runner-public'
          tag='p07-v0.1.0-release84-node-rc13-no-backup'
          target='64e8f7946f7f514fc189e6db96bc1cb7aaa2ee35'
          if gh release view "$tag" -R "$repo" >/dev/null 2>&1; then
            test "$(gh release view "$tag" -R "$repo" --json targetCommitish --jq .targetCommitish)" = "$target"
          else
            gh release create "$tag" -R "$repo" --target "$target" \
              --title 'P07 · 网络代理节点 rc13 · 删除独立备份入口' \
              --notes '应 OWNER 要求，正式删除网络代理节点中独立的「备份节点配置」功能及其 CLI、安装包备份脚本，卸载节点由 5 改为连续编号 4，菜单为 1/2/3/4/0，不占用空位。卸载前自动创建和校验私有安全恢复副本的风险保护仍保留，已有备份文件未删除。历史 rc12 作为不可变归档保留，现行正式入口为 rc13。其他菜单 2–5 和 VF Server Ops release84 未变更。13/13 公共隔离 Machine Gates PASS。Production 手工使用，OWNER 实机验收独立。' \
              --latest=false
          fi
          test "$(gh release view "$tag" -R "$repo" --json tagName --jq .tagName)" = "$tag"
          echo P07_NETWORK_NODE_RC13_FORMAL_RELEASE=PASS
