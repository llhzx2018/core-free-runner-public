name: TEMP S01-C02 1.21.798 Core Updates Gate

on:
  push:
    branches:
      - temp/s01-c02-v121798-core-updates-gate-20260903
    paths:
      - '.github/workflows/temp-s01-c02-v121798-core-updates-gate.yml'

permissions:
  contents: read

jobs:
  update-channel-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: 936261d12338c7eaac0d527dce4aa46a3ee778fc
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: updates

      - name: Verify candidate identity and UpdateCore regression
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C updates rev-parse HEAD)" = 936261d12338c7eaac0d527dce4aa46a3ee778fc
          jq empty updates/projects/S01-C02.json
          find updates/update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php updates/update-core/php/tests/run.php
          echo 'UPDATE_CORE_REGRESSION=PASS'

      - name: Verify S01-C02 manifest and released asset readback
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          FILE=updates/projects/S01-C02.json
          jq -e '.schema_version=="wp-component-1.0" and .project_id=="S01" and .component_id=="S01-C02" and .target_version=="1.21.798" and .from_versions==["1.21.797"] and .release_tag=="v1.21.798" and .asset_name=="vf-tools-ops_V1.21.798.zip" and .asset_bytes==3198663 and .asset_sha256=="7f00a1d75289c7e7221ec41bb84aa193c78234f4130752b54d95721340a956a6" and .runtime_files==893 and .runtime_fingerprint=="f68542afb8588c69a84c3bd3a59131a876628d3abd8784e78e8d6d50bcafd1b8" and .runtime_file_count==893 and .runtime_fingerprint_sha256=="f68542afb8588c69a84c3bd3a59131a876628d3abd8784e78e8d6d50bcafd1b8" and .schema_from=="6.0.0" and .schema_to=="6.0.0" and .backup_required==true and .rollback_supported==true and .physical_locator=="vf-ops/vf-ops.php" and .locator_cutover==false' "$FILE" >/dev/null
          REL="$(curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.798')"
          test "$(jq -r '.id' <<<"$REL")" = 382469380
          test "$(jq -r '.assets[]|select(.name=="vf-tools-ops_V1.21.798.zip")|.id' <<<"$REL")" = 543756854
          test "$(jq -r '.assets[]|select(.name=="vf-tools-ops_V1.21.798.zip")|.size' <<<"$REL")" = 3198663
          test "$(jq -r '.assets[]|select(.name=="vf-tools-ops_V1.21.798.zip")|.digest' <<<"$REL")" = 'sha256:7f00a1d75289c7e7221ec41bb84aa193c78234f4130752b54d95721340a956a6'
          TAG="$(curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/llhzx2018/vf-tools-ops/git/ref/tags/v1.21.798')"
          test "$(jq -r '.object.sha' <<<"$TAG")" = c22d766338245d5dfac49a485129614c85001ee7
          grep -Fq 'Candidate Gate run 33835130446 PASS' "$FILE"
          grep -Fq 'Formal Release run 33835285687 PASS' "$FILE"
          echo 'S01_C02_1_21_798_CHANNEL_IDENTITY=PASS'
