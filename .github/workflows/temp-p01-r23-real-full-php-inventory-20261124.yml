name: TEMP P01 R23 real Clean FULL against PHP installed-code full inventory

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p01-r23-real-full-php-inventory-20261124.yml'

permissions:
  contents: read
concurrency:
  group: p01-r23-real-full-php-inventory-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  package-code-inventory:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'test/p01-r23-real-full-php-inventory-')
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Exact private P01 source in transient workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-startnew
          ref: c29414327b51b0525d059d7ab9d20b1fbd76deb6
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
          fetch-depth: 1
      - name: Exact SHA, native PHP and Node
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C private-src rev-parse HEAD)" = "c29414327b51b0525d059d7ab9d20b1fbd76deb6"
          echo 'P01_R23_REAL_FULL_EXACT_SOURCE=PASS'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip, sodium, pdo_sqlite, sqlite3, mbstring, curl, openssl, fileinfo, dom, xml
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact-source real production Clean FULL + independent PHP byte inventory checks
        working-directory: private-src
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          python3 scripts/check_php_syntax.py >"$RUNNER_TEMP/p01-full-php-lint.log" 2>&1 || { echo 'P01_R23_PHP_LINT=FAIL'; exit 1; }
          echo 'P01_R23_PHP_LINT=PASS'
          composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader >"$RUNNER_TEMP/p01-full-composer.log" 2>&1 || { echo 'P01_R23_COMPOSER_PROD=FAIL'; exit 1; }
          echo 'P01_R23_COMPOSER_PROD=PASS'
          npm ci --no-audit --no-fund >"$RUNNER_TEMP/p01-full-npm.log" 2>&1 || { echo 'P01_R23_NPM=FAIL'; exit 1; }
          npm run build >"$RUNNER_TEMP/p01-full-vite.log" 2>&1 || { echo 'P01_R23_VITE=FAIL'; exit 1; }
          echo 'P01_R23_LOCKED_FRONTEND=PASS'
          python3 scripts/build_clean_full.py --root . --source-sha "c29414327b51b0525d059d7ab9d20b1fbd76deb6" --output "$RUNNER_TEMP/p01-r23-full.zip" >"$RUNNER_TEMP/p01-full-report.json" 2>"$RUNNER_TEMP/p01-full-error.log" || { echo 'P01_R23_FULL_BUILD=FAIL'; exit 1; }
          echo 'P01_R23_FULL_BUILD=PASS'
          mkdir "$RUNNER_TEMP/p01-full-installed"
          unzip -q "$RUNNER_TEMP/p01-r23-full.zip" -d "$RUNNER_TEMP/p01-full-installed"
          export P01_R23_FULL_ZIP="$RUNNER_TEMP/p01-r23-full.zip"
          export P01_R23_FULL_INSTALLED="$RUNNER_TEMP/p01-full-installed"
          export P01_R23_SOURCE_SHA="c29414327b51b0525d059d7ab9d20b1fbd76deb6"
          php <<'PHP' >"$RUNNER_TEMP/p01-full-php-output.log" 2>&1
          <?php
          declare(strict_types=1);
          require getenv('P01_R23_FULL_INSTALLED').'/vendor/autoload.php';
          use App\Support\InstalledFullGenerationInventory;
          $root = getenv('P01_R23_FULL_INSTALLED');
          $zip = getenv('P01_R23_FULL_ZIP');
          $source = getenv('P01_R23_SOURCE_SHA');
          $expectedSha = hash_file('sha256', $zip);
          $inventory = new InstalledFullGenerationInventory();
          $proof = $inventory->verify($root, $zip, $expectedSha, '0.1.0-dev', $source);
          if (($proof['files'] ?? 0) < 5000 || $proof['source_sha'] !== $source ||
              $proof['full_sha256'] !== $expectedSha) {
              throw new RuntimeException('P01_R23_REAL_INVENTORY_PROOF_INCOMPLETE');
          }
          echo "P01_R23_REAL_PHP_FULL_INVENTORY=PASS\n";
          echo 'P01_R23_CODE_FILES='.$proof['files']."\n";
          $changed = $root.'/public/build/manifest.json';
          $original = file_get_contents($changed);
          file_put_contents($changed, $original.'BAD');
          try {
              $inventory->verify($root, $zip, $expectedSha, '0.1.0-dev', $source);
              throw new RuntimeException('P01_R23_TAMPER_WAS_ACCEPTED');
          } catch (RuntimeException $e) {
              if ($e->getMessage() !== 'ATOMIC_FULL_BASELINE_INSTALLED_BYTES_CHANGED') throw $e;
          } finally {
              file_put_contents($changed, $original);
          }
          echo "P01_R23_TAMPERED_FRONTEND_DENIED=PASS\n";
          $extra = $root.'/app/UnexpectedVersionedFile.php';
          file_put_contents($extra, '<?php // injected');
          try {
              $inventory->verify($root, $zip, $expectedSha, '0.1.0-dev', $source);
              throw new RuntimeException('P01_R23_EXTRA_CODE_WAS_ACCEPTED');
          } catch (RuntimeException $e) {
              if ($e->getMessage() !== 'ATOMIC_FULL_BASELINE_INSTALLED_INVENTORY_CHANGED') throw $e;
          } finally {
              unlink($extra);
          }
          echo "P01_R23_EXTRA_SOURCE_DENIED=PASS\n";
          $forged = dirname($zip).'/p01-full-forged.zip';
          copy($zip,$forged);
          file_put_contents($forged,'CHANGED',FILE_APPEND);
          try {
              $inventory->verify($root, $forged, $expectedSha, '0.1.0-dev', $source);
              throw new RuntimeException('P01_R23_UNEXPECTED_ZIP_ACCEPTED');
          } catch (RuntimeException $e) {
              if ($e->getMessage() !== 'ATOMIC_FULL_BASELINE_UNVERIFIED') throw $e;
          }
          echo "P01_R23_TAMPERED_ZIP_DENIED=PASS\n";
          PHP
          if [ -s "$RUNNER_TEMP/p01-full-php-output.log" ]; then
            grep -E '^P01_R23_[A-Z0-9_]+=(PASS|[0-9]+)$' "$RUNNER_TEMP/p01-full-php-output.log" || true
          fi
          if ! grep -q '^P01_R23_TAMPERED_ZIP_DENIED=PASS$' "$RUNNER_TEMP/p01-full-php-output.log"; then
            echo 'P01_R23_REAL_PHP_BRIDGE=FAIL'
            exit 1
          fi
          echo 'P01_R23_REAL_PHP_BRIDGE=PASS'
          # Only temporary synthetic STABLE versions for exercising the
          # full-sized Python FULL -> Atomic -> existing PHP stager contract.
          # Their source_sha placeholders are QA identities, NOT real Git or
          # a released asset. The product itself stays VERSION=0.1.0-dev.
          python3 <<'PY' > "$RUNNER_TEMP/p01-r23-qa-python.log" 2>&1
          import os,pathlib,shutil
          from scripts.build_clean_full import build_full
          from scripts.build_new_atomic import build_atomic
          src=pathlib.Path(os.environ['P01_R23_FULL_INSTALLED'])
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'p01-r23-synthetic-qa'
          root.mkdir(mode=0o700)
          for name,version in (('old','0.1.0'),('new','0.1.1')):
              target=root/name
              shutil.copytree(src,target,symlinks=False)
              target.chmod(0o700)
              (target/'VERSION').write_text(version+'\n')
              if name=='new':
                  code=target/'app/Http/Controllers/SetupController.php'
                  code.write_bytes(code.read_bytes()+b'\n// P01 synthetic package-only QA delta\n')
              out=build_full(target,root/(name+'.zip'),('a' if name=='old' else 'b')*40)
              if out['files']<5000: raise AssertionError('synthetic full incomplete')
          report=build_atomic(root/'old.zip',root/'new.zip',root/'delta.zip')
          if report['from_version']!='0.1.0' or report['version']!='0.1.1':
              raise AssertionError('atomic synthetic version mismatch')
          if report['files']!=2 or report['remove_files']!=0:
              raise AssertionError('unexpected synthetic code changes')
          print('P01_R23_REAL_SIZE_SYNTHETIC_ATOMIC_BUILDER=PASS')
          print('P01_R23_REAL_SIZE_SYNTHETIC_CHANGED_FILES='+str(report['files']))
          PY
          if ! grep -q '^P01_R23_REAL_SIZE_SYNTHETIC_ATOMIC_BUILDER=PASS$' "$RUNNER_TEMP/p01-r23-qa-python.log"; then
            echo 'P01_R23_REAL_SIZE_SYNTHETIC_ATOMIC_BUILDER=FAIL'
            exit 1
          fi
          echo 'P01_R23_REAL_SIZE_SYNTHETIC_ATOMIC_BUILDER=PASS'
          php <<'PHP' >"$RUNNER_TEMP/p01-r23-qa-php.log" 2>&1
          <?php
          declare(strict_types=1);
          $root = getenv('RUNNER_TEMP').'/p01-r23-synthetic-qa';
          $old = $root.'/old';
          $new = $root.'/new';
          require $old.'/vendor/autoload.php';
          // Bootstrap real Laravel app config, not a synthetic source policy.
          $app = require $old.'/bootstrap/app.php';
          $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $oldSha = hash_file('sha256',$root.'/old.zip');
          $newSha = hash_file('sha256',$root.'/new.zip');
          $inventory = new \App\Support\InstalledFullGenerationInventory();
          $oldProof = $inventory->verify($old,$root.'/old.zip',$oldSha,'0.1.0',str_repeat('a',40));
          $atomic = $root.'/delta.zip';
          $channel = [
              'project_key'=>'P01_STARTNEW',
              'repository'=>'llhzx2018/vf-startnew',
              'artifact_type'=>'vf-startnew-atomic-v1',
              'version'=>'0.1.1','supported_from'=>['0.1.0'],
              'from_source_sha'=>str_repeat('a',40),
              'source_sha'=>str_repeat('b',40),
              'release_asset_bytes'=>filesize($atomic),
              'release_asset_sha256'=>hash_file('sha256',$atomic),
          ];
          $stage=$root.'/stage';
          if (!mkdir($stage,0700)) throw new \RuntimeException('stage creation failed');
          $result=(new \App\Support\AtomicCodeGenerationStager())->stage(
              $atomic,$stage,'0.1.1',$old,$channel,'0.1.0'
          );
          $newProof=$inventory->verify($stage,$root.'/new.zip',$newSha,'0.1.1',str_repeat('b',40));
          if ($oldProof['files']<5000 || $newProof['files']!==$oldProof['files']
              || $result['old_code_unmodified']!==true
              || $result['owner_apply_authorized']!==false
              || $result['data_schema_migration_executed']!==false
              || trim(file_get_contents($old.'/VERSION'))!=='0.1.0'
              || trim(file_get_contents($stage.'/VERSION'))!=='0.1.1') {
              throw new \RuntimeException('P01_R23_SYNTHETIC_FULL_SIZE_STAGE_MISMATCH');
          }
          echo 'P01_R23_FULL_SIZE_ATOMIC_PHP_STAGE=PASS'."\n";
          echo 'P01_R23_FULL_SIZE_ATOMIC_STAGE_FILES='.$result['files']."\n";
          PHP
          if ! grep -q '^P01_R23_FULL_SIZE_ATOMIC_PHP_STAGE=PASS$' "$RUNNER_TEMP/p01-r23-qa-php.log"; then
            python3 - "$RUNNER_TEMP/p01-r23-qa-php.log" <<'PY'
          import re,sys,pathlib
          s=pathlib.Path(sys.argv[1]).read_text(errors='replace')
          reasons=sorted(set(re.findall(r'\b(?:ATOMIC_[A-Z0-9_]{3,96}|P01_R23_[A-Z0-9_]{3,96})\b',s)))
          print('P01_R23_FULL_SIZE_ATOMIC_FAILURE_CODES='+(','.join(reasons[:6]) if reasons else 'UNKNOWN'))
          print('P01_R23_FULL_SIZE_ATOMIC_FATAL='+str('Fatal error' in s))
          PY
            echo 'P01_R23_FULL_SIZE_ATOMIC_PHP_STAGE=FAIL'
            exit 1
          fi
          grep -E '^P01_R23_FULL_SIZE_ATOMIC_(PHP_STAGE|STAGE_FILES)=(PASS|[0-9]+)$' "$RUNNER_TEMP/p01-r23-qa-php.log" || true
          # Now independently execute the two targeted PHPUnit security
          # regressions. This dev-dependency install occurs AFTER the real
          # production FULL and synthetic full-size stage are already built;
          # no dev vendor bytes enter any package.
          composer install --no-interaction --prefer-dist --no-progress --quiet >"$RUNNER_TEMP/p01-r23-test-composer.log" 2>&1 || { echo 'P01_R23_TARGETED_COMPOSER=FAIL'; exit 1; }
          set +e
          ./vendor/bin/phpunit --log-junit "$RUNNER_TEMP/p01-r23-stager-junit.xml" --filter='test_stager_(inherits|rejects)' tests/Unit/IsolatedAtomicUpgradeCycleTest.php >"$RUNNER_TEMP/p01-r23-stager-phpunit.log" 2>&1
          result=$?
          set -e
          python3 - "$RUNNER_TEMP/p01-r23-stager-junit.xml" <<'PY'
          import sys,pathlib,xml.etree.ElementTree as ET
          p=pathlib.Path(sys.argv[1])
          if not p.is_file():
              print('P01_R23_TARGETED_JUNIT=MISSING')
              sys.exit(1)
          cases=list(ET.parse(p).getroot().iter('testcase'))
          asserts=sum(int(c.get('assertions','0')) for c in cases)
          skipped=sum(c.find('skipped') is not None for c in cases)
          failed=sum(c.find('failure') is not None or c.find('error') is not None for c in cases)
          print('P01_R23_TARGETED_JUNIT='+','.join(map(str,(len(cases),asserts,skipped,failed))))
          if len(cases)!=2 or asserts<10 or skipped or failed: sys.exit(1)
          PY
          if [ "$result" -ne 0 ]; then
            echo 'P01_R23_FULL_PATH_PHPUNIT=FAIL'
            exit "$result"
          fi
          echo 'P01_R23_FULL_PATH_PHPUNIT=PASS'
      - name: Always clear private source, full ZIP, extracted private package and logs
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- private-src "$RUNNER_TEMP/p01-full-installed" "$RUNNER_TEMP/p01-r23-synthetic-qa"
          rm -f -- "$RUNNER_TEMP"/p01-full-* "$RUNNER_TEMP"/p01-r23-*
          test ! -e private-src
          echo 'P01_R23_REAL_FULL_CLEANUP=PASS'
