name: P02 V2.5.128 exact-main formal release prepublication verified artifacts

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v25128-formal-20261112.yml'
      - 'harness/p02_release_25128_recovery_perf.py'

permissions:
  contents: read

jobs:
  formal-gates:
    if: github.head_ref == 'verify/p02-v25128-formal-20261112'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      VF_RELEASE_SOURCE_SHA: 'bc7100b61963843cc6a71f4b8c81d35ea84894cf'
      VF_RELEASE_SOURCE_TREE: '882029c04fc9eedd3d40d2f2e92a102d8f7e6f1a'
      VF_RELEASE_SOURCE_REF: 'main'
      VF_RELEASE_FROM_VERSIONS: '2.5.81 2.5.82 2.5.102 2.5.103 2.5.104 2.5.105 2.5.111 2.5.112 2.5.113 2.5.114 2.5.115 2.5.116 2.5.117 2.5.118 2.5.119 2.5.120 2.5.121 2.5.122 2.5.124 2.5.127'
    steps:
      - name: Checkout existing PUBLIC runner with synthetic harness only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact PRIVATE P02 merged main with transient token
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-library
          ref: bc7100b61963843cc6a71f4b8c81d35ea84894cf
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Checkout exact GOV-DOC required public-authority source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/gov-doc
          ref: 7dd6815d1bb8de481ac74be21f4e68359aa15407
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: governance
      - name: Recheck exact main version source tree prior release channel and artifact collisions
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "${GH_TOKEN:-}" || { echo P02_RELEASE_WRITE_CAPABILITY_MISSING; exit 1; }
          test "$(git -C product rev-parse HEAD)" = 'bc7100b61963843cc6a71f4b8c81d35ea84894cf'
          test "$(git -C product show -s --format=%T HEAD)" = '882029c04fc9eedd3d40d2f2e92a102d8f7e6f1a'
          test "$(cat product/VERSION)" = '2.5.128'
          test "$(gh api repos/llhzx2018/vf-library/branches/main --jq .commit.sha)" = 'bc7100b61963843cc6a71f4b8c81d35ea84894cf'
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/43148918133 --jq .conclusion)" = success
          gh api repos/llhzx2018/core-updates/contents/projects/P02.json?ref=main --jq .content | base64 -d > "${RUNNER_TEMP}/previous-channel.json"
          gh api repos/llhzx2018/core-free-runner-public/contents/projects/P02.json?ref=main --jq .content | base64 -d > "${RUNNER_TEMP}/previous-mirror.json"
          cmp "${RUNNER_TEMP}/previous-channel.json" "${RUNNER_TEMP}/previous-mirror.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads(Path(os.environ['RUNNER_TEMP'],'previous-channel.json').read_text())
          assert j['target_version']=='2.5.127' and j['release_tag']=='v2.5.127'
          assert j['product_identity']=='c0cc9412a684aa463c3cbf3a63483ea0dacb25a2'
          assert j['schema_from']==j['schema_to']=='2401'
          assert len(j['from_versions'])==19
          print('P02_FORMAL_PREVIOUS_CHANNEL_MIRROR_AND_SOURCE=PASS')
          PY
          test "$(gh api repos/llhzx2018/vf-library/releases/tags/v2.5.127 --jq .draft)" = false
          if gh api repos/llhzx2018/vf-library/git/ref/tags/v2.5.128 >/dev/null 2>&1; then echo P02_FORMAL_TAG_COLLISION; exit 1; fi
          colliding="$(gh api 'repos/llhzx2018/vf-library/releases?per_page=100' --jq '[.[] | select(.tag_name=="v2.5.128")] | length')"
          test "$colliding" = 0 || { echo P02_FORMAL_RELEASE_COLLISION; exit 1; }
          if curl --max-time 12 --connect-timeout 5 --retry 0 -fsSL --proto '=https' https://lib.kewaro.com/VERSION.txt -o "${RUNNER_TEMP}/production-public-version.txt"; then
            live="$(tr -d '\r\n' < "${RUNNER_TEMP}/production-public-version.txt")"
            case " ${VF_RELEASE_FROM_VERSIONS} " in *" $live "*) echo "P02_PRODUCTION_PUBLIC_SOURCE_IN_TESTED_SET=$live";; *) echo "P02_PUBLIC_VERSION_NOT_IN_TESTED_SOURCE_SET"; exit 1;; esac
          else
            echo P02_PRODUCTION_PUBLIC_VERSION_NOT_ACCESSIBLE
          fi
          echo P02_PRODUCTION_AUTHENTICATED_CURRENT=OWNER_SCREENSHOT_2_5_127_NOT_NEW_RUNNER_SESSION
          echo P02_FORMAL_PREPUBLICATION_IDENTITY=PASS
      - name: Prepare PHP SQLite CLI and source exact manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! php -r 'exit(PHP_VERSION_ID>=80300&&extension_loaded("pdo_sqlite")&&extension_loaded("sqlite3")&&extension_loaded("zip")?0:1);'; then
            timeout 180s sudo apt-get install -y php8.3-cli php8.3-sqlite3 php8.3-zip
          fi
          php -r 'exit(PHP_VERSION_ID>=80300&&extension_loaded("pdo_sqlite")&&extension_loaded("sqlite3")&&extension_loaded("zip")?0:1);'
          python3 -m py_compile harness/p02_release_25128_recovery_perf.py
          ( cd product && python3 scripts/generate-source-manifest.py &&
            git diff --exit-code -- SOURCE_MANIFEST.json SOURCE_MANIFEST.txt &&
            bash scripts/verify-repository.sh &&
            node tests/unit/p02_candidate_version_identity_contract.mjs )
          echo P02_FORMAL_EXACT_MERGED_MAIN_SOURCE=PASS
      - name: Build 8 immutable FORMAL shaped assets twice verify ZIP privacy clean FULL login
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          bash scripts/verify-release-artifacts.sh
          echo P02_FORMAL_V25128_EXACT_SOURCE_PACKAGE=PASS
      - name: Actual Public Authority structural format on FULL UPDATE and ATOMIC packages
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib,json,subprocess,os
          from pathlib import Path
          root=Path('product');out=root/'build/release-preflight'
          sha=subprocess.check_output(['git','-C','product','rev-parse','HEAD'],text=True).strip()
          assert sha=='bc7100b61963843cc6a71f4b8c81d35ea84894cf'
          required=['INSTALL','SECURITY','TESTING','UPGRADE','DATA_SCHEMA','API_PROVIDER','CRON_JOB','NOTIFICATION','OBSERVABILITY','GIT','UA_UI']
          for label,profile,name,entry in [
            ('full','web_full_zip','VF_Library_V2.5.128_FULL.zip','setup.php'),
            ('update','web_atomic_zip','VF_Library_V2.5.128_UPDATE.zip','atomic-manifest.json'),
            ('atomic','web_atomic_zip','VF_Library_V2.5.128_ATOMIC.zip','repair-v2.5.128.php')]:
            asset=out/name
            rec={'schema':'vf.public-authority.task-delivery-check.v1','project':'P02','source':sha,
              'project_authority':{'agents':'AGENTS.md','current':'docs/authority/CURRENT.md','acceptance':'docs/authority/ACCEPTANCE_MATRIX.md','applicability':'docs/authority/PUBLIC_AUTHORITY_APPLICABILITY.md'},
              'acceptance_markers':['Exact Candidate','Source-set Matrix','Fresh Install','Rollback'],
              'required_domains':required,
              'task_capabilities':['candidate','source_change','full_package','admin','atomic','database','ui_change','release_visibility'],
              'delivery':{'profile':profile,'artifact':name,'entrypoint':entry,
               'sha256':hashlib.sha256(asset.read_bytes()).hexdigest(),
               'requires_git':False,'requires_manual_source_copy':False}}
            p=Path(os.environ['RUNNER_TEMP'],label+'-formal-receipt.json')
            p.write_text(json.dumps(rec))
            subprocess.run(['python3','-B','governance/governance/public-authority/tools/task_delivery_contract_lint.py',
               '--phase','delivery','--receipt',str(p),'--project-root',str(root),
               '--artifact-root',str(out),
               '--public-router','governance/governance/public-authority/VF_PUBLIC_AUTHORITY_APPLICABILITY_ROUTER_V1.0.json'],check=True)
          print('P02_FORMAL_PUBLIC_AUTHORITY_FULL_UPDATE_ATOMIC_STRUCTURE=PASS')
          PY
      - name: Real 20 official FULL releases to 2.5.128 and injection rollback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "${GH_TOKEN:-}" || { echo P02_PRIVATE_RELEASE_READ_NOT_AVAILABLE; exit 78; }
          mkdir -p "${RUNNER_TEMP}/p02-official-sources"
          for old in 2.5.81 2.5.82 2.5.102 2.5.103 2.5.104 2.5.105 2.5.111 2.5.112 2.5.113 2.5.114 2.5.115 2.5.116 2.5.117 2.5.118 2.5.119 2.5.120 2.5.121 2.5.122 2.5.124 2.5.127; do
            gh release download "v${old}" -R llhzx2018/vf-library -p "VF_Library_V${old}_FULL.zip" -D "${RUNNER_TEMP}/p02-official-sources"
          done
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('product/build/release-preflight')
          assert root.joinpath('VF_Library_V2.5.128_ATOMIC.zip').is_file()
          files={
            '2.5.81':(440049,'a420358244180dda056372432fd0b376404e451f87a5c586f4b7bdc1b9d6ca1e'),
            '2.5.82':(446918,'85039c94e2aed9a711d1a67b72678fb52a25c152c84d5a6eeb2029b399608ff5'),
            '2.5.102':(459993,'8ef6c1dd2b8e42925717b03f6d4b4778f7b92c8b877cacd388eb8d942125c9a0'),
            '2.5.103':(464931,'dd33af1b7dba0d22ec28aa5eb212e139d25d360e29a9c3ba627d6b7bbc8bd535'),
            '2.5.104':(465647,'994ebd2640b24fe6813b3f7f1d4a1475e3f81968c5578efdbb28c85bec9c00a1'),
            '2.5.105':(467596,'94f365e377e9423672455c66a67d2a31afa7587dce80b3c5ba97acb18234a936'),
            '2.5.111':(474502,'dab834093666171026b2e4e8526e68409c04c09ccb4e0980652262f48d663633'),
            '2.5.112':(480037,'0b3b7279bd7ea169de73153d593f3a6452c2cec2b0b8c73ca63b5ffd79983c3d'),
            '2.5.113':(481401,'ded849fab9e476042bb93daf379d97b25c2e1e2ccc8b2ba77c80e53b4b17cf3c'),
            '2.5.114':(484338,'376f24da5ae5e0869c598b72044c78420627138eda163a9d9d238afa4e1be607'),
            '2.5.115':(486198,'795ef929e71cbed189d60219cd6cc17b10ea015168d4f23ae2b1910176ba695f'),
            '2.5.116':(488425,'a0680c89da02f8a4b7e1ba15fe9e33416f6bad55c787fbb26899e9022b0480b9'),
            '2.5.117':(489412,'9978c77de565f11142fb3b48a8a2e523c948a4e8f687d4d6b7c5e33e5c8aa37a'),
            '2.5.118':(490452,'8be68d0995e80a5288c228fb580450be8f4f232bf9cc87f45ce9d80bbf04e14c'),
            '2.5.119':(490836,'1817f995bc0dea1fe6d3feb46c66f84bca9e6b3b4fb3cea335a7aef72f58bbbc'),
            '2.5.120':(491802,'ff0eb042a390cb1da02fbb32077cfd569e2088b687cc82a4ade82ecd24909961'),
            '2.5.121':(492433,'2d7564e798aba23c91764c9fa925cee264292106fb9731ac00d9e19e8f0d719e'),
            '2.5.122':(493073,'79a9e2e2a8e5aa29946bbdbf47cf6d34429fc23a67689cc611ef8daebae82387'),
            '2.5.124':(496067,'c30e9a5a5d8380443f564c0e56606c13edb31da3482c1704deecdcf9c1ff7a56'),
            '2.5.127':(532870,'bd90624278e570d4b01013f84dffce31367c601eaf785051d12db9d3dbf4d596'),
          }
          import os
          for v,(size,sha) in files.items():
            path=Path(os.environ['RUNNER_TEMP'],'p02-official-sources','VF_Library_V'+v+'_FULL.zip')
            assert path.is_file() and path.stat().st_size==int(size)
            assert hashlib.sha256(path.read_bytes()).hexdigest()==sha
          print('P02_FORMAL_20_OFFICIAL_SOURCE_ASSET_SHA=PASS')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, tempfile, zipfile, re, json, html, os, time, http.cookiejar
          import urllib.request, urllib.parse, urllib.error, sqlite3
          prior=Path(os.environ['RUNNER_TEMP'],'p02-official-sources')
          artifacts=Path('product/build/release-preflight')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args):return None
          def request(opener,url,data=None,headers=None):
              r=urllib.request.Request(url,data,headers or {},method='POST' if data is not None else 'GET')
              try:
                  resp=opener.open(r,timeout=35)
                  return resp.status,resp.read().decode('utf-8',errors='replace')
              except urllib.error.HTTPError as error:
                  return error.code,error.read().decode('utf-8',errors='replace')
          def marker(body,name):
              x=re.search(r'name="'+name+r'" value="([^"]+)"',body)
              if not x:raise RuntimeError('MISSING_HIDDEN_FIELD_'+name)
              return html.unescape(x.group(1))
          def do_post(opener,url,values,base):
              data=urllib.parse.urlencode(values).encode()
              return request(opener,url,data,{'Origin':base,'Content-Type':'application/x-www-form-urlencoded'})
          def post_json(opener,base,csrf,action,data):
              url=base+('/scratch-action.php?action='+action[8:] if action.startswith('scratch_') else '/api.php?action='+action)
              code,body=request(opener,url,json.dumps(data).encode(),
                {'Origin':base,'Content-Type':'application/json','X-CSRF-Token':csrf})
              try:result=json.loads(body)
              except ValueError:raise RuntimeError('BAD_JSON_RESPONSE_'+action+':'+str(code))
              if code not in (200,201) or not result.get('ok'):raise RuntimeError('CANONICAL_API_POST_FAILED_'+action+':'+str(code))
              return result
          with tempfile.TemporaryDirectory(prefix='p02-real-upgrade-') as temp:
              folder=Path(temp)
              for n,old in enumerate(["2.5.81","2.5.82","2.5.102","2.5.103","2.5.104","2.5.105","2.5.111","2.5.112","2.5.113","2.5.114","2.5.115","2.5.116","2.5.117","2.5.118","2.5.119","2.5.120","2.5.121","2.5.122","2.5.124","2.5.127"]):
                  site=folder/('source-'+old);site.mkdir()
                  with zipfile.ZipFile(prior/('VF_Library_V'+old+'_FULL.zip')) as z:z.extractall(site)
                  assert (site/'VERSION.txt').read_text().strip()==old
                  port=18971+n
                  base='http://127.0.0.1:'+str(port)
                  server=subprocess.Popen(['php','-S','127.0.0.1:'+str(port),'-t',str(site)],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                  opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()),NoRedirect())
                  try:
                      for _ in range(45):
                          try:
                              status,body=request(opener,base+'/setup.php')
                              if status==200:break
                          except Exception:pass
                          time.sleep(.1)
                      else:raise RuntimeError('OLD_INSTALL_HTTP_UNAVAILABLE')
                      csrf=marker(body,'setup_csrf')
                      status,body=do_post(opener,base+'/setup.php',{'setup_csrf':csrf,
                        'password':'P02-SYNTHETIC-OWNER-TRIAL-ONLY','password_confirm':'P02-SYNTHETIC-OWNER-TRIAL-ONLY'},base)
                      assert status==303,('OLD_INSTALL_FAILED',old,status)
                      status,body=request(opener,base+'/api.php?action=session')
                      auth=json.loads(body)
                      assert status==200 and auth.get('ok') is True and auth.get('site',{}).get('auth') is True
                      assert auth.get('version')==old
                      csrf=auth.get('csrf','')
                      category=post_json(opener,base,csrf,'category_save',{'name':'P02_W1_ONLY_SYNTHETIC','icon':'folder'})
                      item=post_json(opener,base,csrf,'content_save',{'category_id':category['id'],
                        'title':'P02_W1_PRESERVED_'+old,
                        'content':'Synthetic material remains after upgrade and failed injection.',
                        'content_mode':'article','content_format':'markdown',
                        'primary_action':'read','status':'active'})
                      itemid=int(item['id'])
                      scratch=post_json(opener,base,csrf,'scratch_create',{})
                      tabid=int(scratch['tab']['id'])
                      scratch_content='P02_SYNTHETIC_SCRATCH_PRESERVED_'+old
                      saved=post_json(opener,base,csrf,'scratch_save',
                        {'id':tabid,'content':scratch_content,'cursor_pos':11,'scroll_top':23})
                      assert saved['tab']['content']==scratch_content

                      sql=list(folder.rglob('textbox-*.sqlite'))
                      selected=[x for x in sql if x.parent.parent==folder or x.parent.parent==site.parent]
                      assert sql,'NO_SQLITE'
                      repair=artifacts/'repair-v2.5.128.php'
                      (site/repair.name).write_bytes(repair.read_bytes())
                      if old in ('2.5.81','2.5.124','2.5.127'):
                          stage=folder/('rollback-stage-'+old);stage.mkdir()
                          update=artifacts/'VF_Library_V2.5.128_UPDATE.zip'
                          with zipfile.ZipFile(update) as z:z.extractall(stage)
                          php=folder/'inject-rollback.php'
                          php.write_text("""<?php
          declare(strict_types=1);
          require $argv[1].'/app/bootstrap.php';
          $p=json_decode(file_get_contents($argv[2].'/atomic-manifest.json'),true);
          $map=[];
          foreach($p['files'] as $item)$map[$item['path']]=['bytes'=>$item['bytes'],'sha256'=>$item['sha256']];
          try{
            VfLibraryAtomicUpgradeService::fromCurrentRuntime()->upgrade('2.5.124','2.5.128',$argv[2].'/payload',$map,['source_schema'=>2401,'target_schema'=>2401,'fail_after_file'=>1]);
            fwrite(STDERR,'EXPECTED_FAULT_NOT_RAISED');exit(1);
          }catch(Throwable $e){
            if(strpos($e->getMessage(),'Atomic test fault: file replacement')===false){
              fwrite(STDERR,'UNEXPECTED_ATOMIC_FAULT_CLASS');exit(1);
            }
          }
          echo "P02_FORMAL_PARTIAL_FILE_ROLLBACK=PASS\\n";
          """)
                          if old=='2.5.81':
                              php.write_text(php.read_text().replace("upgrade('2.5.124','2.5.128'","upgrade('2.5.81','2.5.128'"))
                          if old=='2.5.127':
                              php.write_text(php.read_text().replace("upgrade('2.5.124','2.5.128'","upgrade('2.5.127','2.5.128'"))
                          proc=subprocess.run(['php',str(php),str(site),str(stage)],capture_output=True,text=True,timeout=80)
                          assert proc.returncode==0,('ROLLBACK_ENGINE_TEST_FAILED',proc.stderr[-200:])
                          assert (site/'VERSION.txt').read_text().strip()==old
                          status,body=request(opener,base+'/api.php?action=content_get&id='+str(itemid))
                          assert status==200 and json.loads(body).get('item',{}).get('title')=='P02_W1_PRESERVED_'+old,('ROLLBACK_DATA_LOSS',old)
                          scratch_status,scratch_body=request(opener,base+'/scratch-action.php?action=list')
                          assert scratch_status==200 and any(t['id']==tabid and t['content']==scratch_content
                            for t in json.loads(scratch_body)['data']['open']),('ROLLBACK_SCRATCH_LOSS',old)
                          print('P02_FORMAL_PARTIAL_FILE_ROLLBACK=PASS')
                      status,body=request(opener,base+'/'+repair.name)
                      assert status==200,('REPAIR_LOGIN_READ',old,status)
                      form_csrf=marker(body,'csrf')
                      status,body=do_post(opener,base+'/'+repair.name,{'action':'upgrade','csrf':form_csrf},base)
                      assert status==200 and '升级完成' in body,('REAL_REPAIR_FAILED',old,status,body[-200:])
                      assert (site/'VERSION.txt').read_text().strip()=='2.5.128'
                      status,body=request(opener,base+'/api.php?action=content_get&id='+str(itemid))
                      after=json.loads(body)
                      assert status==200 and after.get('item',{}).get('title')=='P02_W1_PRESERVED_'+old,('UPDATE_DATA_LOSS',old)
                      assert 'Synthetic material remains' in after.get('item',{}).get('content','')
                      scratch_status,scratch_body=request(opener,base+'/scratch-action.php?action=list')
                      assert scratch_status==200 and any(t['id']==tabid and t['content']==scratch_content
                        for t in json.loads(scratch_body)['data']['open']),('UPDATE_SCRATCH_LOSS',old)
                      assert not (site/'app/.runtime.php').is_symlink()
                      db_files=list(folder.rglob('textbox-*.sqlite'))
                      assert db_files
                      db_file=[x for x in db_files if x.parent.as_posix().startswith(folder.as_posix())][-1]
                      with sqlite3.connect(db_file) as db:
                          assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
                          assert db.execute('PRAGMA foreign_key_check').fetchall()==[]
                      assert (site/'assets/w1/w1-search.js').is_file()
                      print('P02_FORMAL_UPGRADE_FROM_'+old.replace('.','_')+'=PASS')
                      print('P02_FORMAL_DATA_RETAINED_FROM_'+old.replace('.','_')+'=PASS')
                      print('P02_FORMAL_SCRATCH_RETAINED_FROM_'+old.replace('.','_')+'=PASS')
                  finally:
                      server.terminate();server.wait(timeout=12)
          print('P02_FORMAL_ALL_20_SOURCE_DIRECT_UPGRADES=PASS')
          PY


      - name: Real v2.5.128 backup inspect restore private attachment rollback and search performance
        shell: bash
        run: |
          set -Eeuo pipefail
          target="product/build/release-preflight/VF_Library_V2.5.128_FULL.zip"
          test -f "$target"
          export P02_TARGET_FULL_SHA="$(sha256sum "$target" | cut -d' ' -f1)"
          python3 harness/p02_release_25128_recovery_perf.py \
            "${RUNNER_TEMP}/p02-official-sources/VF_Library_V2.5.124_FULL.zip" "$target"
          echo P02_FORMAL_MAIN_RECOVERY_MEDIA_PERFORMANCE=PASS
      - name: Create immutable 8 asset private formal DRAFT after all evidence gates
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "${GH_TOKEN:-}"
          test "$(gh api repos/llhzx2018/vf-library/branches/main --jq .commit.sha)" = 'bc7100b61963843cc6a71f4b8c81d35ea84894cf' || { echo P02_MAIN_DRIFT; exit 1; }
          test "$(gh api repos/llhzx2018/core-updates/contents/projects/P02.json?ref=main --jq .content | base64 -d | python3 -c 'import json,sys;print(json.load(sys.stdin)["target_version"])')" = '2.5.127' || { echo P02_CHANNEL_RACE; exit 1; }
          if gh api repos/llhzx2018/vf-library/git/ref/tags/v2.5.128 >/dev/null 2>&1; then echo P02_TAG_RACE; exit 1; fi
          colliding="$(gh api 'repos/llhzx2018/vf-library/releases?per_page=100' --jq '[.[] | select(.tag_name=="v2.5.128")] | length')"
          test "$colliding" = 0 || { echo P02_RELEASE_RACE; exit 1; }
          cd product/build/release-preflight
          ( sha256sum -c SHA256SUMS.txt )
          cat > "${RUNNER_TEMP}/p02-v25128-release-notes.md" <<'EOF'
          VF Library Web V2.5.128 · W1 Reader read-only in-place Preview.
          W1 Vue/TypeScript search now includes explicitly opt-in read-only Reader preview
          in the same search overlay; old PHP/SQLite Reader/Editor unaffected.
          Preserve one Canonical Material, Scratch, private files and schema 2401.
          Source bc7100b61963843cc6a71f4b8c81d35ea84894cf.
          Machine proof: 20/20 real official release source upgrades, Material and Scratch,
          SQLite integrity and injected rollback; real FULL clean install/login,
          exact PHP/SQLite backup inspect restore synthetic attachment bytes,
          failure/retry and search performance.
          W1 Reader 59/59 real Chromium at 390/768/1440 applies because identical runtime
          W1 assets/source tree from tested candidate, unchanged on merge.
          Evidence: https://github.com/llhzx2018/core-free-runner-public/actions/runs/43148918133
          Current Formal release gate: this same exact-source one-off workflow.
          This note does NOT authorize any automated Production upgrade or migration.
          FULL for clean first install only. Existing sites use background-safe Atomic update,
          with automatic pre-upgrade recovery point; Owner upgrades manually.
          EOF
          gh release create v2.5.128 -R llhzx2018/vf-library --draft --target 'bc7100b61963843cc6a71f4b8c81d35ea84894cf' \
            --title 'VF Library V2.5.128 · W1 Reader' --notes-file "${RUNNER_TEMP}/p02-v25128-release-notes.md"
          gh release upload v2.5.128 -R llhzx2018/vf-library \
            VF_Library_V2.5.128_FULL.zip VF_Library_V2.5.128_ATOMIC.zip \
            VF_Library_V2.5.128_UPDATE.zip VF_Library_V2.5.128_SOURCE.zip \
            repair-v2.5.128.php VF_Library_V2.5.128_RELEASE_MANIFEST.json \
            VF_Library_V2.5.128_RELEASE_NOTES.md SHA256SUMS.txt
          gh api 'repos/llhzx2018/vf-library/releases?per_page=100' > "${RUNNER_TEMP}/p02-formal-draft-list.json"
          python3 - <<'PY'
          import hashlib,os,json
          from pathlib import Path
          matches=[x for x in json.loads(Path(os.environ['RUNNER_TEMP'],'p02-formal-draft-list.json').read_text()) if x['tag_name']=='v2.5.128']
          assert len(matches)==1,'FORMAL_DRAFT_NOT_UNIQUE'
          r=matches[0]
          assert r['draft'] is True and r.get('published_at') is None
          assert r['target_commitish']=='bc7100b61963843cc6a71f4b8c81d35ea84894cf'
          wanted={p.name:(p.stat().st_size,'sha256:'+hashlib.sha256(p.read_bytes()).hexdigest()) for p in Path('.').iterdir() if p.is_file()}
          assert len(wanted)==8
          uploaded={a['name']:a for a in r['assets']}
          assert set(uploaded)==set(wanted)
          for name,(size,digest) in wanted.items():
            assert uploaded[name]['state']=='uploaded' and uploaded[name]['size']==size and uploaded[name].get('digest')==digest,('ASSET_MISMATCH',name)
            print('P02_FORMAL_DRAFT_ASSET='+name+';BYTES='+str(size)+';SHA256='+digest[7:])
          print('P02_FORMAL_DRAFT_8_8_REMOTE_SHA_BYTES=PASS')
          print('P02_FORMAL_DRAFT_RELEASE_ID='+str(r['id']))
          print('P02_FORMAL_DRAFT_TAG=v2.5.128')
          print('P02_FORMAL_DRAFT_PUBLISHED=NO')
          PY
