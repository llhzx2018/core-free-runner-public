name: TEMP skill-book V5.2 Governance Reconcile

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-skill-book-v52-gov-reconcile.yml'

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout temporary runner head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout exact live GOV-DOC main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          path: gov
          fetch-depth: 0

      - name: Guard exact publication authority
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          cd gov
          test "$(git rev-parse HEAD)" = '11b48ba32bab1f7be7c3ac284fe234757a5f783f'
          test ! -e mother-specs/skill-book/V5.2
          test ! -e distribution/skills/candidates/skill-book/V5.2
          grep -q '`V5.1` 为最新 Candidate' CURRENT.md
          grep -q 'skill-book V5.1.*最新.*CANDIDATE' distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md
          CURRENT_DIST_BEFORE="$(git hash-object distribution/skills/CURRENT_SKILL_DISTRIBUTION.json)"
          echo "CURRENT_DIST_BEFORE=$CURRENT_DIST_BEFORE" >> "$GITHUB_ENV"
          gh api 'repos/llhzx2018/gov-doc/releases/tags/skill-book-v5.2-candidate-20260828' > /tmp/v52-release.json
          jq -e '.id == 378609184 and .prerelease == true and .draft == false and .target_commitish == "11b48ba32bab1f7be7c3ac284fe234757a5f783f"' /tmp/v52-release.json >/dev/null
          jq -e '.assets | length == 2' /tmp/v52-release.json >/dev/null
          jq -e '.assets[] | select(.id==534042164 and .name=="skill-book_V5.2_CANDIDATE_20260828.zip" and .size==313673 and .digest=="sha256:28fb3d07cd77f957bd1e22730c9584f7a250f4acef8228663f71ba845942b1c7")' /tmp/v52-release.json >/dev/null
          jq -e '.assets[] | select(.id==534042163 and .name=="skill-book_V5.2_CANDIDATE_20260828.zip.sha256")' /tmp/v52-release.json >/dev/null

      - name: Write V5.2 governance reconciliation
        shell: bash
        run: |
          set -euo pipefail
          cd gov
          python3 - <<'PY'
          from pathlib import Path

          current = Path('CURRENT.md')
          text = current.read_text(encoding='utf-8')
          old = "`skill-book V4.0/V4.1/V4.2/V4.3/V4.4/V4.5/V4.6/V4.7/V4.8/V4.9/V5.0` 为保留的历史 Candidate，`V5.1` 为最新 Candidate；十二者均未晋升 Source Current。V5.1 已进入 Candidate Distribution，但未进入 Current Distribution。"
          new = "`skill-book V4.0/V4.1/V4.2/V4.3/V4.4/V4.5/V4.6/V4.7/V4.8/V4.9/V5.0/V5.1` 为保留的历史 Candidate，`V5.2` 为最新 Candidate；十三个 Candidate 版本均未晋升 Source Current。V5.2 已进入 Candidate Distribution，但未进入 Current Distribution。"
          assert text.count(old) == 1
          text = text.replace(old, new)
          text = text.replace('> 更新时间：2026-08-27', '> 更新时间：2026-08-28', 1)
          current.write_text(text, encoding='utf-8')

          idx = Path('distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md')
          text = idx.read_text(encoding='utf-8')
          start = text.index('## Candidate（不改变 Current）')
          hist = text.index('历史 Candidate：', start)
          old_hist_tail = text[hist:]
          assert '- [skill-book V5.1]' not in old_hist_tail
          block = '''## Candidate（不改变 Current）

