- [直接下载 skill-book V5.2 Candidate ZIP](https://github.com/llhzx2018/gov-doc/releases/download/skill-book-v5.2-candidate-20260828/skill-book_V5.2_CANDIDATE_20260828.zip)
- [下载 SHA-256 文件](https://github.com/llhzx2018/gov-doc/releases/download/skill-book-v5.2-candidate-20260828/skill-book_V5.2_CANDIDATE_20260828.zip.sha256)
