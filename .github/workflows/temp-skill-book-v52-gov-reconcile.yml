          overlay = Path('mother-specs/skill-book/V5.2/SKILL_BOOK_V5.2_CANDIDATE_OVERLAY.md')
          overlay.parent.mkdir(parents=True, exist_ok=True)
          overlay.write_text('''# skill-book V5.2 Candidate Overlay

