name: P01 L2 Mobile Quick Save Foundation
on:
  push:
    branches: [run/p01-mobile-quick-save-foundation-20260902]
    paths: [.github/workflows/p01-mobile-quick-save-foundation-20260902.yml]
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: run/p01-mobile-quick-save-foundation-20260902
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: product/p01-mobile-quick-save-foundation-20260902
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Fresh source fence
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C product fetch origin develop
          test "$(git -C product rev-parse HEAD)" = 7054ac145be3dd8bbfb8978c4e5356167e71aa61
          test "$(git -C product rev-parse origin/develop)" = 7054ac145be3dd8bbfb8978c4e5356167e71aa61
      - name: Apply product patch
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          python3 ../runner/scripts/p01_mobile_quick_save_foundation_patch.py
      - name: Verify exact product contract
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          php -l src/app/Repository.php >/dev/null
          php -l src/app/FunctionalHome.php >/dev/null
          php -l src/quick-save.php >/dev/null
          git diff --check
          grep -F "public function savePendingCapture" src/app/Repository.php >/dev/null
          grep -F "['browser-extension','browser-gateway','mobile-quick-save']" src/app/Repository.php >/dev/null
          grep -F "return \$this->savePendingCapture(\$data, 'browser-extension');" src/app/Repository.php >/dev/null
          grep -F "l.source_type IN ('browser-extension','browser-gateway','mobile-quick-save')" src/app/Repository.php >/dev/null
          grep -F "savePendingCapture(['url'=>\$url,'title'=>\$title], 'mobile-quick-save')" src/quick-save.php >/dev/null
          grep -F "hash_equals(\$csrf, \$provided)" src/quick-save.php >/dev/null
          grep -F "X-Robots-Tag: noindex, nofollow, noarchive" src/quick-save.php >/dev/null
          grep -F '不公开 · 不自动分类 · 不自动收藏置顶 · 不修改已有重复记录' src/quick-save.php >/dev/null
          grep -F '<a href="quick-save.php">＋ 快速收藏</a>' src/app/FunctionalHome.php >/dev/null
          grep -F '.vf-home-mobile-command>button,.vf-home-mobile-command>a' src/assets/workspace-home.css >/dev/null
          ! grep -R -F 'share_target' src --exclude='quick-save.php' >/dev/null
          test "$(cat VERSION)" = 2.36.4
          test "$(cat src/VERSION.txt)" = 2.36.4
          test -z "$(git diff --name-only -- VERSION src/VERSION.txt VF_PROJECT.json database src/migrations)"
          changed=$(git status --porcelain=v1 | sed -E 's/^.. //' | sort)
          expected=$(printf '%s\n' src/app/FunctionalHome.php src/app/Repository.php src/assets/workspace-home.css src/quick-save.php | sort)
          printf '%s\n' "$changed"
          test "$changed" = "$expected"
          echo 'MOBILE QUICK SAVE FOUNDATION PASS'
      - name: Commit and push candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add src/app/FunctionalHome.php src/app/Repository.php src/assets/workspace-home.css src/quick-save.php
          git commit -m 'feat(P01): add mobile quick-save foundation'
          git push origin HEAD:product/p01-mobile-quick-save-foundation-20260902
          echo "CANDIDATE=$(git rev-parse HEAD)"
          echo "TREE=$(git rev-parse HEAD^{tree})"
