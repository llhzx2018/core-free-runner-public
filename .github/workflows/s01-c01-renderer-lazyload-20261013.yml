name: S01 Theme Renderer Lazy-load Truth Gate
on:
  push:
    branches: [task/s01-c01-renderer-lazyload-20261013]
    paths: [.github/workflows/s01-c01-renderer-lazyload-20261013.yml]
permissions:
  contents: read
jobs:
  theme-renderer-truth:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Checkout exact transient Theme candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: c5e6f052b534f948a459f557093400d7d7d09319
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - name: Exact Theme PHP lint, Renderer validation, DB/readback and frontend consumption
        run: |
          set -Eeuo pipefail
          test "$(git -C private-source rev-parse HEAD)" = c5e6f052b534f948a459f557093400d7d7d09319
          php -l private-source/src/inc/services/renderer-config-service.php
          php -l private-source/src/inc/services/product-renderer-service.php
          php -l private-source/tests/s01-c01-renderer-lazyload-saved-frontend-truth.php
          php private-source/tests/s01-c01-renderer-lazyload-saved-frontend-truth.php
          php private-source/tests/renderer-revision-bootstrap-contract.php
          php private-source/tests/render-workflow-v4-contract.php
          echo S01_THEME_RENDERER_LAZYLOAD_EXACT_GATE_PASS
      - name: Cleanup transient private Theme checkout
        if: always()
        run: rm -rf private-source
