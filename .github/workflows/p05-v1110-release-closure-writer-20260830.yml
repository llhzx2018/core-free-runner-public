name: P05 V1.1.10 Release Closure Writer

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      P05_BASE: 5fa1a4a80f84201dcc1a4313c8d8d0ace05f3b00
      P05_BRANCH: governance/p05-v1110-release-closure-20260830
      VERSION: 1.1.10
      RELEASE_ID: '379314813'
      RELEASE_SOURCE: 5fa1a4a80f84201dcc1a4313c8d8d0ace05f3b00
      RELEASE_TREE: 9d653d36c51e87420b4f9932e777294ca4d300a8
      EXACT_SOURCE: c4fe3d5cf49fd33d0214f58244ccc112279944a5
      EXACT_GATE_RUN: '33318245543'
      EXACT_GATE_JOB: '99275513101'
      PUBLICATION_RUN: '33318510907'
      PUBLICATION_JOB: '99276224334'
      FULL_ASSET: VF_SEO_V1.1.10_FULL.zip
      FULL_ASSET_ID: '536734918'
      RECEIPT_ASSET: VF_SEO_V1.1.10_RELEASE_RECEIPT.txt
      RECEIPT_ASSET_ID: '536734919'
      FULL_FILES: '44'
      FULL_BYTES: '363138'
      FULL_SHA256: 16448869130988685c5fadb42f50362dfac08d6b2dd8657394b8a43c7787ba5d
      PUBLISHED_AT: 2026-08-30T15:03:32Z
    steps:
      - name: Checkout exact closure branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.P05_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
          path: p05

      - name: Verify immutable release truth before writing
        working-directory: p05
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$P05_BASE"
          test "$(git rev-parse origin/main)" = "$P05_BASE"
          gh api "repos/llhzx2018/vf-seo/releases/tags/v$VERSION" > /tmp/release.json
          python3 - <<'PY'
          import json, os
          r=json.load(open('/tmp/release.json'))
          assert str(r['id']) == os.environ['RELEASE_ID']
          assert r['tag_name'] == 'v'+os.environ['VERSION']
          assert r['target_commitish'] == os.environ['RELEASE_SOURCE']
          assert r['published_at'] == os.environ['PUBLISHED_AT']
          assets={a['name']:a for a in r['assets']}
          full=assets[os.environ['FULL_ASSET']]
          rec=assets[os.environ['RECEIPT_ASSET']]
          assert str(full['id']) == os.environ['FULL_ASSET_ID']
          assert int(full['size']) == int(os.environ['FULL_BYTES'])
          assert full.get('digest') == 'sha256:'+os.environ['FULL_SHA256']
          assert str(rec['id']) == os.environ['RECEIPT_ASSET_ID']
          print('P05_RELEASE_REMOTE_TRUTH=PASS')
          PY
          test "$(git rev-parse "$EXACT_SOURCE^{tree}")" = "$RELEASE_TREE"
          test "$(git rev-parse "$RELEASE_SOURCE^{tree}")" = "$RELEASE_TREE"

      - name: Write Current Truth and release authority
        working-directory: p05
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          p=Path('VF_PROJECT.json')
          data=json.loads(p.read_text())
          data.update({
            'status': 'V1.1.10_RELEASED / MACHINE_PASS / PRODUCTION_NOT_DEPLOYED',
            'version': '1.1.10',
            'target_version': '1.1.10',
            'working_version': '1.1.10',
            'version_change': False,
            'formal_release': 'v1.1.10',
            'formal_release_state': 'RELEASED_CURRENT_MACHINE_PASS_PRODUCTION_NOT_DEPLOYED',
            'formal_release_candidate_commit': os.environ['EXACT_SOURCE'],
            'formal_release_candidate_tree': os.environ['RELEASE_TREE'],
            'formal_release_source': os.environ['RELEASE_SOURCE'],
            'formal_release_tree': os.environ['RELEASE_TREE'],
            'formal_release_asset': os.environ['FULL_ASSET'],
            'formal_release_asset_files': int(os.environ['FULL_FILES']),
            'formal_release_asset_bytes': int(os.environ['FULL_BYTES']),
            'formal_release_asset_sha256': os.environ['FULL_SHA256'],
            'formal_release_id': int(os.environ['RELEASE_ID']),
            'formal_release_asset_id': int(os.environ['FULL_ASSET_ID']),
            'formal_release_receipt_asset_id': int(os.environ['RECEIPT_ASSET_ID']),
            'formal_release_exact_source_run': int(os.environ['EXACT_GATE_RUN']),
            'formal_release_exact_source_job': int(os.environ['EXACT_GATE_JOB']),
            'formal_release_publication_run': int(os.environ['PUBLICATION_RUN']),
            'formal_release_publication_job': int(os.environ['PUBLICATION_JOB']),
            'runtime_recovery_release': 'RELEASED_V1.1.10',
            'production_runtime_acceptance': 'V1.1.10_RELEASED_REAL_ENDPOINT_NOT_PROVEN',
            'production_deployment': 'NOT_DEPLOYED',
            'production_write': 0,
            'working_branch': 'main',
            'owner_real_use_review': 'V1.1.9_REAL_FAIL_HISTORICAL / V1.1.10_RELEASED_NOT_DEPLOYED',
            'owner_real_use_pass': 'NOT_PROVEN_FOR_V1.1.10',
            'candidate_authorization': 'CONSUMED_V1.1.10_RELEASED',
            'release_authorization': 'CONSUMED_V1.1.10_RELEASED',
            'product_failure': None,
            'last_historical_product_failure': 'V1.1.9_FIRST_REQUEST_MARKER_CREATION_PLUS_HOME_ENV_STORAGE_DISCOVERY_COULD_REBIND_OLD_STATE',
            'next_action': 'STOP_RELEASE_CLOSURE; PRODUCTION_REQUIRES_EXPLICIT_OWNER_AUTHORIZATION',
            'deployment_readiness': 'V1.1.10_RELEASED_AWAIT_EXPLICIT_PRODUCTION_DECISION',
          })
          data.setdefault('authority', {})['release'] = 'docs/authority/RELEASE_V1.1.10_CURRENT.md'
          data['authority']['release_candidate'] = 'docs/authority/RELEASE_V1.1.10_CANDIDATE.md'
          data['release_publication'] = {
            'tag': 'v1.1.10',
            'release_id': int(os.environ['RELEASE_ID']),
            'release_name': 'P05 · VF SEO v1.1.10 · Runtime Pointer Contract Closure',
            'target_commit': os.environ['RELEASE_SOURCE'],
            'target_tree': os.environ['RELEASE_TREE'],
            'published_at': os.environ['PUBLISHED_AT'],
            'full_asset': os.environ['FULL_ASSET'],
            'full_asset_id': int(os.environ['FULL_ASSET_ID']),
            'full_files': int(os.environ['FULL_FILES']),
            'full_bytes': int(os.environ['FULL_BYTES']),
            'full_sha256': os.environ['FULL_SHA256'],
            'receipt_asset': os.environ['RECEIPT_ASSET'],
            'receipt_asset_id': int(os.environ['RECEIPT_ASSET_ID']),
            'exact_candidate_source': os.environ['EXACT_SOURCE'],
            'exact_candidate_run': int(os.environ['EXACT_GATE_RUN']),
            'exact_candidate_job': int(os.environ['EXACT_GATE_JOB']),
            'publication_run': int(os.environ['PUBLICATION_RUN']),
            'publication_job': int(os.environ['PUBLICATION_JOB']),
            'private_ci': 'BLOCKED_INFRA_RUNNER_ID_0_STEPS_0',
            'state': 'PASS_CLOSED',
            'real_endpoint': 'NOT_PROVEN_V1.1.10',
            'production': 'NOT_DEPLOYED',
          }
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          readme=Path('README.md')
          text=readme.read_text()
          current='''## Current Truth

```text
Project: P05 · VF SEO
Repository: llhzx2018/vf-seo
Current Formal Release: v1.1.10 · RELEASED
Release Main: 5fa1a4a80f84201dcc1a4313c8d8d0ace05f3b00
Verified Exact Source: c4fe3d5cf49fd33d0214f58244ccc112279944a5
Verified Tree: 9d653d36c51e87420b4f9932e777294ca4d300a8
Final Closure Gate: 33318245543 / 99275513101 · PASS
Formal Publication: 33318510907 / 99276224334 · PASS
FULL SHA-256: 16448869130988685c5fadb42f50362dfac08d6b2dd8657394b8a43c7787ba5d
Formal Production Authority: NOT_DEPLOYED
Production Write: 0
Schema: VF-SEO-SCHEMA@1 / 1
Default Database: SQLite
```
'''
          text, n = re.subn(r'## Current Truth\n\n```text\n.*?```\n', current, text, count=1, flags=re.S)
          assert n == 1
          machine='''## Machine Evidence

V1.1.10 最终 Release Closure：

```text
Mechanism Gate: 33316433128 · PASS
Final Exact Source: c4fe3d5cf49fd33d0214f58244ccc112279944a5
Final Closure Gate: 33318245543 / 99275513101 · PASS
Release Main: 5fa1a4a80f84201dcc1a4313c8d8d0ace05f3b00
Release Tree: 9d653d36c51e87420b4f9932e777294ca4d300a8
Formal Publication: 33318510907 / 99276224334 · PASS
GitHub Release: v1.1.10 / 379314813
FULL Asset: VF_SEO_V1.1.10_FULL.zip / 536734918
FULL Files: 44
FULL Bytes: 363138
FULL SHA-256: 16448869130988685c5fadb42f50362dfac08d6b2dd8657394b8a43c7787ba5d
Receipt Asset ID: 536734919
Private CI: BLOCKED_INFRA · runner_id=0 · steps=[]
Production: NOT_DEPLOYED
Production Write: 0
```
'''
          text, n = re.subn(r'## Machine Evidence\n\nV1\.1\.10 机制 Gate：\n\n```text\n.*?```\n', machine, text, count=1, flags=re.S)
          assert n == 1
          old='当前没有任何授权去自动修改 Cloudflare、CloudPanel 或 Production。V1.1.10 只有最终 Exact Source FULL Gate 与 Formal Publication 都 PASS 后才允许发布。'
          new='V1.1.10 已完成正式发布与远端 digest 回读。当前没有任何授权去自动修改 Cloudflare、CloudPanel 或 Production；发布完成不等于 Production Deployment。Production 仍为 `NOT_DEPLOYED`。'
          assert old in text
          text=text.replace(old,new)
          readme.write_text(text)
          PY

          cat > docs/handoff/CURRENT_STATE.md <<'EOF'
          # P05 · VF SEO · Current State

          ```text
          Current Formal Release: v1.1.10 · RELEASED
          Release Main: 5fa1a4a80f84201dcc1a4313c8d8d0ace05f3b00
          Release Tree: 9d653d36c51e87420b4f9932e777294ca4d300a8
          Final Exact Source: c4fe3d5cf49fd33d0214f58244ccc112279944a5
          Final Closure Gate: 33318245543 / 99275513101 · PASS
          Formal Publication: 33318510907 / 99276224334 · PASS
          Release ID: 379314813
          FULL: VF_SEO_V1.1.10_FULL.zip
          FULL Asset ID: 536734918
          FULL Files: 44
          FULL Bytes: 363138
          FULL SHA-256: 16448869130988685c5fadb42f50362dfac08d6b2dd8657394b8a43c7787ba5d
          Receipt Asset ID: 536734919
          Private CI: BLOCKED_INFRA · runner_id=0 · steps=[]
          Production: NOT_DEPLOYED
          Production Write: 0
          Schema: VF-SEO-SCHEMA@1 / 1
          ```

          v1.1.10 已关闭 fresh-install/runtime identity 问题：Webroot Runtime Pointer 是唯一安装事实；pointer 缺失必定进入 fresh install；HOME、旧 runtime.env、旧 SQLite 与 storage-path 环境变量无权自动认领旧状态；Browser Setup 在 private runtime 完成后最后提交 pointer；CLI maintenance 只允许 pointer-bound runtime。

          正式 FULL 在所有 Browser/dirty-state/Chrome 测试结束后重新构建 pristine staging，最终 ZIP 不携带 runtime pointer、数据库、runtime.env、setup.lock 或历史 recovery helper。远端 Release asset digest 已与本地确定性 ZIP SHA-256 一致。

          历史真实用户证据仍保留：v1.1.9 fresh reinstall = FAIL。v1.1.10 当前只有正式 Machine/Release PASS，没有真实 Production endpoint 部署证据，因此不得写成 REAL_USER_PASS。

          Next: Release Closure STOP。任何首次正式 Production Deployment 都必须由 Owner 另行明确授权。
          EOF

          cat > docs/authority/RELEASE_V1.1.10_CURRENT.md <<'EOF'
          # P05 · VF SEO · V1.1.10 Current Release Authority

          ## Current Formal Release

          ```text
          Version: v1.1.10
          State: RELEASED_CURRENT_MACHINE_PASS
          Release Source / main: 5fa1a4a80f84201dcc1a4313c8d8d0ace05f3b00
          Release Tree: 9d653d36c51e87420b4f9932e777294ca4d300a8
          Verified Exact Source: c4fe3d5cf49fd33d0214f58244ccc112279944a5
          Final Exact Source Run: 33318245543
          Final Exact Source Job: 99275513101
          Publication Run: 33318510907
          Publication Job: 99276224334
          Release ID: 379314813
          Full Asset: VF_SEO_V1.1.10_FULL.zip
          Full Asset ID: 536734918
          Full Files: 44
          Full Bytes: 363138
          Full SHA-256: 16448869130988685c5fadb42f50362dfac08d6b2dd8657394b8a43c7787ba5d
          Receipt Asset: VF_SEO_V1.1.10_RELEASE_RECEIPT.txt
          Receipt Asset ID: 536734919
          Private CI: BLOCKED_INFRA · runner_id=0 · steps=[]
          Production: NOT_DEPLOYED
          Production Write: 0
          ```

          ## Release Verdict

          V1.1.10 的正式 Final Exact Source Gate 与 Formal Publication 均为 `PASS`。Merge 后 `main` tree 与已验证 Exact Source tree 完全一致，属于 tree-equivalent promotion。正式 Publication 从 Exact Main 重新执行完整 Engineering / PostgreSQL Integration / Security / PHP / Browser / dirty historical-state / Chrome 合同，并在所有测试结束后删除 test staging、重新构建 pristine release staging，再生成确定性 FULL。

          发布后的 GitHub Release remote readback 已确认：tag `v1.1.10` 精确指向 `5fa1a4a80f84201dcc1a4313c8d8d0ace05f3b00`；FULL asset size 为 `363138` bytes；远端 digest 为 `sha256:16448869130988685c5fadb42f50362dfac08d6b2dd8657394b8a43c7787ba5d`，与 Publication Machine Receipt 一致。

          ## Runtime Contract Closed

          ```text
          VF_INSTALL_INSTANCE.json absent
          → fresh install
          → historical HOME/env/SQLite cannot adopt state
          → pointer-less CLI maintenance fails closed

          Browser Setup success
          → random sibling private runtime completed
          → final self-test passed
          → VF_INSTALL_INSTANCE.json committed last
          → subsequent runtime and CLI maintenance are pointer-bound
          ```

          Formal release staging and final ZIP contain no runtime pointer, SQLite/DB/WAL/SHM, `runtime.env`, `setup.lock.json`, `.env`, or historical `FreshInstallRecovery.php`.

          ## Real User / Production Boundary

          V1.1.9 的 fresh-reinstall real-user verdict remains historical `FAIL`. V1.1.10 已达到 `MACHINE_PASS / RELEASED`，但当前没有 `seo.kewaro.com` 正式部署或真实 endpoint acceptance 证据，因此不得声明 `REAL_USER_PASS_V1.1.10`。

          ```text
          V1.1.10 Formal Release: PASS
          V1.1.10 Real Endpoint: NOT_PROVEN
          Production Deployment: NOT_DEPLOYED
          Production Write: 0
          ```

          Release Closure 到此停止。Production 需要新的、明确的 Owner 授权。
          EOF

          cat > docs/evidence/V1.1.10_FORMAL_RELEASE_20260830.md <<'EOF'
          # P05 · V1.1.10 Formal Release Evidence · 2026-08-30

          ## Source Binding

          ```text
          Exact Candidate: c4fe3d5cf49fd33d0214f58244ccc112279944a5
          Exact Main: 5fa1a4a80f84201dcc1a4313c8d8d0ace05f3b00
          Shared Tree: 9d653d36c51e87420b4f9932e777294ca4d300a8
          Final Closure Gate: 33318245543 / 99275513101 · PASS
          Publication: 33318510907 / 99276224334 · PASS
          ```

          ## Publication Receipt

          ```text
          P05_V1110_FORMAL_RELEASE=PASS
          P05_FILES=44
          P05_BYTES=363138
          P05_SHA256=16448869130988685c5fadb42f50362dfac08d6b2dd8657394b8a43c7787ba5d
          POINTERLESS_CLI_FAIL_CLOSED=PASS
          POINTER_BOUND_CLI_MAINTENANCE=PASS
          CLOUDPANEL_ROOT_STAGING_PRISTINE=PASS
          DIRTY_STATE_REINSTALL=PASS
          FORMAL_TEST_STAGING_IMMUTABLE=PASS
          POST_TEST_PRISTINE_REBUILD=PASS
          CHROME_E2E=PASS
          PRIVATE_CI=BLOCKED_INFRA_RUNNER_ID_0
          PRODUCTION_WRITE=0
          ```

          ## GitHub Release Remote Readback

          ```text
          Tag: v1.1.10
          Release ID: 379314813
          Target: 5fa1a4a80f84201dcc1a4313c8d8d0ace05f3b00
          Full Asset ID: 536734918
          Full Asset: VF_SEO_V1.1.10_FULL.zip
          Full Bytes: 363138
          Remote Digest: sha256:16448869130988685c5fadb42f50362dfac08d6b2dd8657394b8a43c7787ba5d
          Receipt Asset ID: 536734919
          Published At: 2026-08-30T15:03:32Z
          Remote Readback: PASS
          ```

          Private repository CI for PR #40 did not obtain a GitHub Runner (`runner_id=0`, `steps=[]`) and is therefore recorded as `BLOCKED_INFRA`, not product FAIL. The public Exact Source machine gate executed the complete contract and passed.

          Production remains `NOT_DEPLOYED`; this evidence does not authorize or claim a Production deployment.
          EOF

      - name: Validate release closure scope and truth
        working-directory: p05
        run: |
          set -euo pipefail
          python3 -m json.tool VF_PROJECT.json >/dev/null
          python3 - <<'PY'
          import json
          v=json.load(open('VF_PROJECT.json'))
          assert v['status']=='V1.1.10_RELEASED / MACHINE_PASS / PRODUCTION_NOT_DEPLOYED'
          assert v['formal_release']=='v1.1.10'
          assert v['formal_release_state']=='RELEASED_CURRENT_MACHINE_PASS_PRODUCTION_NOT_DEPLOYED'
          assert v['formal_release_source']=='5fa1a4a80f84201dcc1a4313c8d8d0ace05f3b00'
          assert v['formal_release_tree']=='9d653d36c51e87420b4f9932e777294ca4d300a8'
          assert v['formal_release_asset_sha256']=='16448869130988685c5fadb42f50362dfac08d6b2dd8657394b8a43c7787ba5d'
          assert v['authority']['release']=='docs/authority/RELEASE_V1.1.10_CURRENT.md'
          assert v['production_deployment']=='NOT_DEPLOYED' and v['production_write']==0
          assert v['release_publication']['state']=='PASS_CLOSED'
          assert v['release_publication']['production']=='NOT_DEPLOYED'
          PY
          git status --short
          git diff --name-only "$P05_BASE" | sort > /tmp/changed
          git ls-files --others --exclude-standard | sort >> /tmp/changed
          sort -u /tmp/changed -o /tmp/changed
          cat > /tmp/expected <<'EOF'
          README.md
          VF_PROJECT.json
          docs/authority/RELEASE_V1.1.10_CURRENT.md
          docs/evidence/V1.1.10_FORMAL_RELEASE_20260830.md
          docs/handoff/CURRENT_STATE.md
          EOF
          diff -u /tmp/expected /tmp/changed
          grep -Fq 'Current Formal Release: v1.1.10 · RELEASED' README.md
          grep -Fq 'Current Formal Release: v1.1.10 · RELEASED' docs/handoff/CURRENT_STATE.md
          grep -Fq 'Version: v1.1.10' docs/authority/RELEASE_V1.1.10_CURRENT.md
          grep -Fq 'Production remains `NOT_DEPLOYED`' docs/evidence/V1.1.10_FORMAL_RELEASE_20260830.md
          test "$(git show "$P05_BASE:docs/authority/RELEASE_V1.1.10_CANDIDATE.md" | sha256sum | awk '{print $1}')" = "$(sha256sum docs/authority/RELEASE_V1.1.10_CANDIDATE.md | awk '{print $1}')"
          echo 'P05_V1110_RELEASE_CLOSURE_SCOPE=PASS'
          echo 'P05_HISTORICAL_CANDIDATE_AUTHORITY_UNCHANGED=PASS'

      - name: Commit and push closure branch
        working-directory: p05
        run: |
          set -euo pipefail
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add README.md VF_PROJECT.json docs/handoff/CURRENT_STATE.md docs/authority/RELEASE_V1.1.10_CURRENT.md docs/evidence/V1.1.10_FORMAL_RELEASE_20260830.md
          git commit -m 'governance(P05): close V1.1.10 release truth'
          git push origin "HEAD:$P05_BRANCH"
          echo "P05_RELEASE_CLOSURE_HEAD=$(git rev-parse HEAD)"
          echo 'P05_RELEASE_WRITE=0'
          echo 'P05_PRODUCTION_WRITE=0'
