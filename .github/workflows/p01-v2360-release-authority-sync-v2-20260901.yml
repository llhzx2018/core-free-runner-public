name: P01 V2.36.0 Release Authority Sync V2
on:
  push:
    branches: [temp/p01-v2360-release-gate-20260901]
    paths:
      - .github/workflows/p01-v2360-release-authority-sync-v2-20260901.yml
      - scripts/p01-v2360-release-authority-sync.py
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AUTH_BASE: 225780b1ed56bbcc8e62ba465b1129e1c22ee60a
      AUTH_BRANCH: authority/p01-v2360-release-closure-20260901
    steps:
      - name: Checkout runner exact workflow source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: runner
      - name: Checkout authority branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.AUTH_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01
      - name: Update and exact-fence Current Authority files
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p01 rev-parse HEAD)" = "$AUTH_BASE"
          cd p01
          python3 ../runner/scripts/p01-v2360-release-authority-sync.py
          python3 -m json.tool VF_PROJECT.json >/dev/null
          git diff --check
          { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u > /tmp/p01-v2360-authority-changed.txt
          cat /tmp/p01-v2360-authority-changed.txt
          cat > /tmp/p01-v2360-authority-expected.txt <<'EOF'
          README.md
          VF_PROJECT.json
          docs/authority/CURRENT.md
          docs/evidence/P01_V2.36.0_RELEASE_CLOSURE_20260901.md
          docs/handoff/CURRENT_STATE.md
          EOF
          diff -u /tmp/p01-v2360-authority-expected.txt /tmp/p01-v2360-authority-changed.txt
          ! grep '^src/' /tmp/p01-v2360-authority-changed.txt
          test "$(git rev-parse HEAD:src)" = ad3f96345ead330adffb20c7ecb3cdf6537036b6
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add README.md VF_PROJECT.json docs/authority/CURRENT.md docs/evidence/P01_V2.36.0_RELEASE_CLOSURE_20260901.md docs/handoff/CURRENT_STATE.md
          git commit -m 'docs(P01): close V2.36.0 release chain'
          git push origin HEAD:"$AUTH_BRANCH"
          test "$(git rev-parse HEAD:src)" = ad3f96345ead330adffb20c7ecb3cdf6537036b6
          printf 'P01_V2360_RELEASE_AUTHORITY_SYNC=PASS\nAUTH_BRANCH=%s\nOWNER_PRODUCTION_WRITE=NO\n' "$AUTH_BRANCH" | tee /tmp/p01-v2360-authority-sync.txt
      - name: Upload authority sync evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2360-authority-sync-${{ github.run_id }}
          path: |
            /tmp/p01-v2360-authority-changed.txt
            /tmp/p01-v2360-authority-sync.txt
          if-no-files-found: warn
          retention-days: 90
