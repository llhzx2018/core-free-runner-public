name: P05 V1.0.2 Human UI Final Exact Source Gate R2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p05-v102-human-ui-final-exact-source-gate-r2-20260828.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: vfseo
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vfseo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      EXACT_SOURCE: e1c4b3239bba89eaa2603ee61d7dafd5d89b946f
      PRIOR_PASS_SOURCE: 557a9c72f8f9d8130a1dba77581b1d1ce340fb5f
      BASE_MAIN: 540ce8feae99d3451d0cc5597f5b231f077c7c9c
      TARGET_BRANCH: ui/p05-human-baseline-v102-20260828
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vfseo

    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact P05 R2 source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.EXACT_SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: p05
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: p05/package-lock.json

      - name: Exact source, eight-file scope, and lock-only delta fence
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p05
          test "$(git rev-parse HEAD)" = "$EXACT_SOURCE"
          test "$(git rev-parse origin/main)" = "$BASE_MAIN"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$EXACT_SOURCE"
          mapfile -t changed < <(git diff --name-only "$BASE_MAIN" "$EXACT_SOURCE")
          test "${#changed[@]}" -eq 8
          for file in CHANGELOG.md VERSION VF_PROJECT.json package.json package-lock.json src/client/CommonSystemCenter.tsx src/server/version.ts tests/contract/common-system-human-ui.test.ts; do
            printf '%s\n' "${changed[@]}" | grep -Fxq "$file"
          done
          test "$(git diff --name-only "$PRIOR_PASS_SOURCE" "$EXACT_SOURCE")" = 'package-lock.json'
          python3 - <<'PY'
          import json,subprocess
          old=json.loads(subprocess.check_output(['git','show',f'{__import__("os").environ["PRIOR_PASS_SOURCE"]}:package-lock.json']))
          new=json.load(open('package-lock.json'))
          assert old['version']=='1.0.1' and old['packages']['']['version']=='1.0.1'
          assert new['version']=='1.0.2' and new['packages']['']['version']=='1.0.2'
          old['version']='1.0.2'; old['packages']['']['version']='1.0.2'
          assert old==new, 'package-lock dependency graph changed'
          p=json.load(open('VF_PROJECT.json'))
          assert p['version']=='1.0.2' and p['schema_version']==1
          assert p['production_version'] is None and p['production_deployment']=='NOT_DEPLOYED' and p['production_write']==0
          h=p['human_ui_exposure_v1_0_2']; assert h['resolver_change'] is False and h['schema_change'] is False and h['primary_ia_change'] is False
          PY
          git diff --quiet "$BASE_MAIN" "$EXACT_SOURCE" -- src/server/common-baseline-v2.ts src/server/common-system-v2.ts src/server/database migrations install-cloudpanel.sh src/client/App.tsx src/client/main.tsx
          test "$(tr -d '\r\n' < VERSION)" = '1.0.2'
          test "$(node -p "require('./package.json').version")" = '1.0.2'
          test "$(node -p "require('./package-lock.json').version")" = '1.0.2'
          git diff --check "$BASE_MAIN" "$EXACT_SOURCE"
          echo P05_V102_R2_SCOPE=PASS

      - name: Full Node regression, integration, and build
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p05
          npm ci
          npm run lint
          npm run typecheck
          npm run test:unit
          npm run test:contract
          npm run test:integration
          npm run build
          node --input-type=module - <<'JS'
          import {resolveCommonBaselineV2} from './dist/src/server/common-baseline-v2.js';
          const r=resolveCommonBaselineV2({sessionTtlSeconds:2592000,sessionIdleSeconds:604800,sessionAbsoluteSeconds:2592000,sessionCookieSeconds:2592000,stepUpWindowSeconds:900,displayTimezone:'Asia/Shanghai',locale:'zh-CN'},'sqlite');
          if(r.version!=='1.0.2'||r.schema!==1||r.results.length!==15||r.summary.pass!==14||r.summary.exception!==0||r.summary.drift!==0||r.summary.unknown!==0||r.summary.nA!==1||!r.summary.fullPass) throw new Error(JSON.stringify(r));
          JS
          echo P05_V102_R2_REGRESSION=PASS

      - name: Build deterministic R2 release set
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p05
          OUT="$RUNNER_TEMP/p05-v102-r2-release"; A="$RUNNER_TEMP/p05-v102-r2-a"; B="$RUNNER_TEMP/p05-v102-r2-b"
          rm -rf "$OUT" "$A" "$B"; mkdir -p "$OUT" "$A" "$B"
          for STAGE in "$A" "$B"; do
            STAGE="$STAGE" python3 - <<'PY'
          import os,pathlib,shutil,subprocess
          root=pathlib.Path('.').resolve(); stage=pathlib.Path(os.environ['STAGE'])
          for raw in subprocess.check_output(['git','ls-files','-z']).split(b'\0'):
              if not raw: continue
              rel=raw.decode()
              if rel.startswith('.github/'): continue
              src=root/rel
              if src.is_file():
                  dst=stage/rel; dst.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(src,dst)
          shutil.copytree(root/'dist',stage/'dist',dirs_exist_ok=True)
          PY
          done
          diff -qr "$A" "$B"
          STAGE="$A" OUT="$OUT" python3 - <<'PY'
          import hashlib,os,pathlib,shutil,zipfile
          stage=pathlib.Path(os.environ['STAGE']); out=pathlib.Path(os.environ['OUT'])
          full=out/'VF_SEO_V1.0.2_FULL.zip'
          with zipfile.ZipFile(full,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9,strict_timestamps=True) as z:
              for p in sorted(x for x in stage.rglob('*') if x.is_file()):
                  rel=p.relative_to(stage).as_posix(); info=zipfile.ZipInfo(rel,date_time=(1980,1,1,0,0,0)); info.compress_type=zipfile.ZIP_DEFLATED; info.create_system=3
                  info.external_attr=((0o100755 if rel=='install-cloudpanel.sh' or rel.startswith('bin/') else 0o100644)<<16); z.writestr(info,p.read_bytes())
          update=out/'VF_SEO_V1.0.2_UPDATE.zip'; shutil.copyfile(full,update)
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          (out/'SHA256SUMS.txt').write_text(f'{sha(full)}  {full.name}\n{sha(update)}  {update.name}\n',encoding='utf-8')
          (out/'METADATA.txt').write_text(f'EXACT_SOURCE={os.environ.get("EXACT_SOURCE","")}\nFULL_BYTES={full.stat().st_size}\nFULL_SHA256={sha(full)}\nUPDATE_BYTES={update.stat().st_size}\nUPDATE_SHA256={sha(update)}\n',encoding='utf-8')
          print((out/'METADATA.txt').read_text())
          PY
          (cd "$OUT" && sha256sum -c SHA256SUMS.txt)
          cmp "$OUT/VF_SEO_V1.0.2_FULL.zip" "$OUT/VF_SEO_V1.0.2_UPDATE.zip"
          echo P05_V102_R2_ARTIFACT=PASS

      - name: Real first install from R2 FULL
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/p05-v102-r2-release"; ROOT="$RUNNER_TEMP/p05-v102-r2-install"; APP="$ROOT/app"; HOME_DIR="$ROOT/home"
          rm -rf "$ROOT"; mkdir -p "$APP" "$HOME_DIR"
          unzip -q "$OUT/VF_SEO_V1.0.2_FULL.zip" -d "$APP"
          if ! command -v crontab >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y -qq cron >/dev/null; fi
          export HOME="$HOME_DIR" VF_INSTALL_PORT=19054
          printf '1\n19054\nhttps://seo.example.test\nadmin\nP05-V102-R2-First-Install-Password-2026!\nP05-V102-R2-First-Install-Password-2026!\n' | bash "$APP/install-cloudpanel.sh"
          ENV_FILE="$HOME/.config/vf-seo/runtime.env"; test -f "$ENV_FILE"; set -a; source "$ENV_FILE"; set +a
          cd "$APP"; npm run verify:schema; npm run verify:admin-ready
          curl -fsS -H 'x-forwarded-proto: https' -H 'host: app' 'http://127.0.0.1:19054/api/health' > "$ROOT/health.json"
          ROOT="$ROOT" node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs'; const h=JSON.parse(readFileSync(process.env.ROOT+'/health.json','utf8'));
          if(!h.ok||h.version!=='1.0.2'||h.schema!==1||h.databaseProvider!=='sqlite') throw new Error(JSON.stringify(h));
          JS
          pm2 restart vf-seo vf-seo-worker >/dev/null
          for _ in $(seq 1 60); do curl -fsS -H 'x-forwarded-proto: https' -H 'host: app' 'http://127.0.0.1:19054/api/health' >/dev/null 2>&1 && break; sleep .5; done
          npm run verify:admin-ready
          pm2 delete vf-seo vf-seo-worker >/dev/null 2>&1 || true
          echo P05_V102_R2_FIRST_INSTALL=PASS

      - name: Install Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p05
          npm install --no-save --no-package-lock playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: R2 human-readable browser gate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p05
          ROOT="$RUNNER_TEMP/p05-v102-r2-browser"; mkdir -p "$ROOT"
          cat > .runner-p05-v102-r2.html <<'HTML'
          <!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"></head><body><div id="root"></div><script type="module" src="/.runner-p05-v102-r2.tsx"></script></body></html>
          HTML
          cat > .runner-p05-v102-r2.tsx <<'TSX'
          import {StrictMode} from 'react'; import {createRoot} from 'react-dom/client'; import {CommonSystemCenter} from './src/client/CommonSystemCenter';
          createRoot(document.getElementById('root')!).render(<StrictMode><CommonSystemCenter/></StrictMode>);
          TSX
          npx vite --host 127.0.0.1 --port 19055 --strictPort >"$ROOT/vite.log" 2>&1 & VITE_PID=$!; trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do curl -fsS 'http://127.0.0.1:19055/.runner-p05-v102-r2.html' >/dev/null 2>&1 && break; sleep .1; done
          cat > .runner-p05-v102-r2-browser.mjs <<'JS'
          import {chromium} from 'playwright'; import fs from 'node:fs';
          const results=[['TIME','PASS'],['AUTH','PASS'],['UPDATE','PASS'],['BACKUP','PASS'],['DATA','PASS'],['API','PASS'],['JOB','PASS'],['NOTIFICATION','N_A'],['LOGGING','PASS'],['UI_COMMON_STATES','PASS'],['FILE_UPLOAD','PASS'],['HEALTH','PASS'],['VERSION','PASS'],['CACHE','PASS'],['LOCALE','PASS']].map(([domain,state])=>({domain,state,reason:'raw machine reason',runtime:{machine:true}}));
          const payloads={
            '/api/auth/me':{csrfToken:'r2'},
            '/api/system/branding':{branding:{siteName:'VF SEO',logoDataUrl:null,faviconDataUrl:null,version:1},limits:{logoBytes:786432,faviconBytes:131072}},
            '/api/system/info':{version:'1.0.2',schema:1,profile:'PERSONAL_SINGLE_ADMIN',databaseProvider:'sqlite',time:{displayTimezone:'Asia/Shanghai'},locale:'zh-CN',auth:{idleSeconds:604800,absoluteSeconds:2592000,cookieSeconds:2592000,stepUpWindowSeconds:900},stepUp:{recent:false,windowSeconds:900}},
            '/api/system/baseline':{report:{baseline:'VF-COMMON-PRODUCT-BASELINE@2.0',profile:'PERSONAL_SINGLE_ADMIN',version:'1.0.2',schema:1,summary:{pass:14,exception:0,drift:0,unknown:0,nA:1,fullPass:true},results}},
            '/api/system/update/status':{currentVersion:'1.0.2',updateAvailable:false,channel:'UPDATE_CHANNEL_NOT_PUBLISHED',credentialConfigured:false,execution:{phase:'IDLE'}},
            '/api/backups':{provider:'sqlite',productionReady:true,backups:[]},
            '/api/system/health':{process:'healthy',database:'healthy',version:'1.0.2',schema:1,uptimeSeconds:93784,latencyMs:12,checkedAt:'2026-08-28T11:00:00Z'}
          };
          const report={status:'FAIL',page_errors:[],console_errors:[],bad_responses:[],mobile_overflow:null};
          const browser=await chromium.launch({headless:true}); const context=await browser.newContext({viewport:{width:1365,height:900}}); const page=await context.newPage();
          page.on('pageerror',e=>report.page_errors.push(String(e))); page.on('console',m=>{if(m.type()==='error')report.console_errors.push(m.text())}); page.on('response',r=>{if(r.status()>=400)report.bad_responses.push({url:r.url(),status:r.status()})});
          await page.route('**/api/**',async route=>{const p=new URL(route.request().url()).pathname;await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(payloads[p]??{})})});
          try{
            await page.goto('http://127.0.0.1:19055/.runner-p05-v102-r2.html',{waitUntil:'networkidle'}); await page.locator('.vf-common-launch').click(); const nav=page.locator('.vf-common-nav');
            for(const label of ['系统信息','系统基线','在线升级','备份与恢复','运行健康']) if(await nav.getByRole('button',{name:label,exact:true}).count()!==1) throw new Error('missing '+label);
            await nav.getByRole('button',{name:'系统基线',exact:true}).click(); await page.getByText('系统关键规则正常',{exact:true}).waitFor({state:'visible'}); await page.getByText('你需要关注',{exact:true}).waitFor({state:'visible'});
            if(await page.locator('.vf-common-row').count()!==15) throw new Error('baseline rows');
            if(await page.locator('details.vf-common-tech').first().getAttribute('open')!==null) throw new Error('details open');
            await page.screenshot({path:process.env.RUNNER_TEMP+'/p05-v102-r2-browser/desktop.png',fullPage:true});
            await page.setViewportSize({width:390,height:844}); const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth); report.mobile_overflow=overflow; if(overflow>2) throw new Error('mobile overflow');
            await page.screenshot({path:process.env.RUNNER_TEMP+'/p05-v102-r2-browser/mobile.png',fullPage:true});
            if(report.page_errors.length||report.console_errors.length||report.bad_responses.length) throw new Error(JSON.stringify(report)); report.status='PASS';
          }catch(e){report.error=String(e?.stack||e)}finally{fs.writeFileSync(process.env.RUNNER_TEMP+'/p05-v102-r2-browser/report.json',JSON.stringify(report,null,2));await browser.close()}
          if(report.status!=='PASS') process.exit(2);
          JS
          node .runner-p05-v102-r2-browser.mjs
          cat "$ROOT/report.json"
          echo P05_V102_R2_BROWSER=PASS

      - name: Final R2 exact-source verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p05
          test "$(git rev-parse HEAD)" = "$EXACT_SOURCE"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$EXACT_SOURCE"
          test "$(git rev-parse origin/main)" = "$BASE_MAIN"
          echo P05_V102_R2_EXACT_SOURCE="$EXACT_SOURCE"
          echo P05_V102_R2_SCHEMA=1
          echo P05_V102_R2_COMMON_BASELINE=PASS
          echo P05_V102_R2_FIRST_INSTALL=PASS
          echo P05_V102_R2_BROWSER=PASS
          echo P05_V102_R2_PRODUCTION=NOT_DEPLOYED
          echo P05_V102_R2_MACHINE=PASS

      - name: Upload R2 verified evidence and release set
        uses: actions/upload-artifact@v4
        with:
          name: P05-V1.0.2-HUMAN-UI-FINAL-R2-${{ env.EXACT_SOURCE }}
          path: |
            ${{ runner.temp }}/p05-v102-r2-release/VF_SEO_V1.0.2_FULL.zip
            ${{ runner.temp }}/p05-v102-r2-release/VF_SEO_V1.0.2_UPDATE.zip
            ${{ runner.temp }}/p05-v102-r2-release/SHA256SUMS.txt
            ${{ runner.temp }}/p05-v102-r2-release/METADATA.txt
            ${{ runner.temp }}/p05-v102-r2-browser/desktop.png
            ${{ runner.temp }}/p05-v102-r2-browser/mobile.png
            ${{ runner.temp }}/p05-v102-r2-browser/report.json
          if-no-files-found: error
          retention-days: 90
