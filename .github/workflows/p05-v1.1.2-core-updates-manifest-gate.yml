name: P05 V1.1.2 Core Updates Manifest Gate

on:
  push:
    branches:
      - release/p05-v1.1.2-orchestrator-20260830
    paths:
      - '.github/workflows/p05-v1.1.2-core-updates-manifest-gate.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CORE_UPDATES_SHA: 7f8aacfc757c913b2bfc6f35e87493f7907c2be6
      P05_MAIN_SHA: 37c2f50b178c18feed26cbb82a6abc5bb9fc576b
      P05_TREE: 644136d1c486d67f1b3f4bde87b0e4e4b7cee9f4
      RELEASE_ID: '379237052'
      ASSET_ID: '536415428'
      ASSET_BYTES: '231699'
      ASSET_SHA256: 34c9a88e01197eb6f4ee8943c33d38f832246e72e965e574c9766dbf5ace15fa
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: 7f8aacfc757c913b2bfc6f35e87493f7907c2be6
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0

      - name: Validate P05 manifest and remote release
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CORE_UPDATES_SHA"
          FILE=projects/P05.json
          jq -e . "$FILE" >/dev/null
          test "$(jq -r .target_version "$FILE")" = '1.1.2'
          test "$(jq -r .update_type "$FILE")" = 'FULL_ONLY'
          test "$(jq '.from_versions|length' "$FILE")" = '0'
          test "$(jq -r .schema_from "$FILE")" = '1'
          test "$(jq -r .schema_to "$FILE")" = '1'
          test "$(jq -r .release_tag "$FILE")" = 'v1.1.2'
          test "$(jq -r .release_id "$FILE")" = "$RELEASE_ID"
          test "$(jq -r .release_product_commit "$FILE")" = "$P05_MAIN_SHA"
          test "$(jq -r .release_product_tree "$FILE")" = "$P05_TREE"
          test "$(jq -r .asset_name "$FILE")" = 'VF_SEO_V1.1.2_FULL.zip'
          test "$(jq -r .asset_id "$FILE")" = "$ASSET_ID"
          test "$(jq -r .asset_bytes "$FILE")" = "$ASSET_BYTES"
          test "$(jq -r .asset_sha256 "$FILE")" = "$ASSET_SHA256"
          test "$(jq -r .deployment_state "$FILE")" = 'NOT_DEPLOYED'
          test "$(jq -r .production_verification "$FILE")" = 'NOT_APPLICABLE_UNTIL_FIRST_DEPLOYMENT'
          R="$(gh api repos/llhzx2018/vf-seo/releases/tags/v1.1.2)"
          test "$(printf '%s' "$R" | jq -r .id)" = "$RELEASE_ID"
          test "$(printf '%s' "$R" | jq -r .target_commitish)" = "$P05_MAIN_SHA"
          A="$(printf '%s' "$R" | jq -c --arg n 'VF_SEO_V1.1.2_FULL.zip' '.assets[]|select(.name==$n)')"
          test "$(printf '%s' "$A" | jq -r .id)" = "$ASSET_ID"
          test "$(printf '%s' "$A" | jq -r .size)" = "$ASSET_BYTES"
          test "$(printf '%s' "$A" | jq -r .digest)" = "sha256:$ASSET_SHA256"
          TAG_SHA="$(gh api repos/llhzx2018/vf-seo/git/ref/tags/v1.1.2 --jq '.object.sha')"
          test "$TAG_SHA" = "$P05_MAIN_SHA"
          echo P05_V112_CORE_UPDATES_MANIFEST_MACHINE=PASS
          echo P05_PRODUCTION=NOT_DEPLOYED
