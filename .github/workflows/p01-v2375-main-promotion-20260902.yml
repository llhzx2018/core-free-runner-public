name: P01 V2.37.5 Main Promotion
on:
  push:
    branches: [release/p01-v2375-hotfix-20260902]
    paths: [.github/workflows/p01-v2375-main-promotion-20260902.yml]
permissions:
  actions: read
  contents: read
jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OLD_MAIN: 58ed50f2d56afc04cfff467075fc7025306afeb5
      FORMAL_SOURCE: cefda28149dbf29164adc8ebfa57edacad122474
      RUNTIME_TREE: 467c56faa900a6bfcc7caadd0fd570b9c6a76567
      STRICT_RUN: '33611166304'
    steps:
      - name: Verify release gates
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -Eeuo pipefail
          for run in 33610132981 33610766833 33610944516 "$STRICT_RUN"; do
            test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$run --jq .conclusion)" = success
          done
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.FORMAL_SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Fast-forward exact Formal Source to main
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          test "$(git rev-parse HEAD)" = "$FORMAL_SOURCE"
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$OLD_MAIN"
          git merge-base --is-ancestor "$OLD_MAIN" "$FORMAL_SOURCE"
          test "$(git rev-list --count "$OLD_MAIN..$FORMAL_SOURCE")" = 3
          git push origin HEAD:main
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$FORMAL_SOURCE"
          test "$(git rev-parse origin/main:src)" = "$RUNTIME_TREE"
          printf 'P01_V2375_MAIN_PROMOTION=PASS\nOLD_MAIN=%s\nMAIN=%s\nRUNTIME_TREE=%s\nFAST_FORWARD=YES\nFORCE=NO\nSTRICT_RUN=%s\nOWNER_PRODUCTION_WRITE=NO\n' "$OLD_MAIN" "$FORMAL_SOURCE" "$RUNTIME_TREE" "$STRICT_RUN" | tee /tmp/p01-v2375-main-promotion.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-v2375-main-promotion-${{ github.run_id }}
          path: /tmp/p01-v2375-main-promotion.txt
          if-no-files-found: warn
          retention-days: 90
