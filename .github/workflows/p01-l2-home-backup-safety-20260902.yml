name: P01 L2 Home Backup Safety
on:
  push:
    branches: [run/p01-home-backup-safety-20260902]
    paths: [.github/workflows/p01-l2-home-backup-safety-20260902.yml]
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: run/p01-home-backup-safety-20260902
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: product/p01-home-backup-safety-20260902
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Fresh source fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = 65e6b882cee2ac20eb61bc3c959f16af005ef7a4
          test "$(git -C product rev-parse origin/develop)" = 65e6b882cee2ac20eb61bc3c959f16af005ef7a4
      - name: Apply product patch
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          python3 ../runner/scripts/p01_home_backup_safety_patch.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/assets/workspace-home.css')
          p.write_text(p.read_text(encoding='utf-8').rstrip()+'\n',encoding='utf-8')
          PY
      - name: Verify exact product contract
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          php -l src/app/FunctionalHome.php >/dev/null
          git diff --check
          grep -F 'function vf_home_backup_status' src/app/FunctionalHome.php >/dev/null
          grep -F "new VfBackupManager(\$db)" src/app/FunctionalHome.php >/dev/null
          grep -F "\$backupManager->policy(), \$backupManager->list()" src/app/FunctionalHome.php >/dev/null
          grep -F "'backup_status'=>\$backupStatus" src/app/FunctionalHome.php >/dev/null
          grep -F 'data-safety.php#backups-section' src/app/FunctionalHome.php >/dev/null
          grep -F '数据安全正常' src/app/FunctionalHome.php >/dev/null
          grep -F '最近一次备份需要检查' src/app/FunctionalHome.php >/dev/null
          grep -F '最近备份已超过计划周期' src/app/FunctionalHome.php >/dev/null
          grep -F '.vf-home-safety-status' src/assets/workspace-home.css >/dev/null
          test "$(git diff --name-only -- src/VERSION.txt VF_PROJECT.json database src/migrations | wc -l | tr -d ' ')" = 0
          git diff --name-only | sort | tee /tmp/changed.txt
          expected=$(printf '%s\n' src/app/FunctionalHome.php src/assets/workspace-home.css | sort)
          test "$(cat /tmp/changed.txt)" = "$expected"
          echo 'HOME BACKUP SAFETY PASS'
      - name: Commit and push candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add src/app/FunctionalHome.php src/assets/workspace-home.css
          git commit -m 'feat(P01): surface backup safety on home'
          git push origin HEAD:product/p01-home-backup-safety-20260902
          echo "CANDIDATE=$(git rev-parse HEAD)"
          echo "TREE=$(git rev-parse HEAD^{tree})"
