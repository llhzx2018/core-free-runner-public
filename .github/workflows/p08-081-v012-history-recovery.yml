name: P08 081 real issued 607b v012 native historical recovery three DB
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/p08-081-v012-history-recovery.yml, tests/p08-081-native-history-fixture.php]
permissions:
  contents: read
jobs:
  three-db-official-chain:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-081-native-v012-history-repair-20261120'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: sqlite
            image: mysql:8.4
            health: mysqladmin ping --silent
          - kind: mysql
            image: mysql:8.4
            health: mysqladmin ping --silent
          - kind: mariadb
            image: mariadb:11.8
            health: healthcheck.sh --connect --innodb_initialized
    services:
      db:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: p08-only-disposable-ci
          MYSQL_ROOT_HOST: '%'
          MARIADB_ROOT_PASSWORD: p08-only-disposable-ci
          MARIADB_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=10s
          --health-timeout=6s
          --health-retries=18
    env:
      P08_ISOLATED_INSTALL_TEST: 'YES'
      PYTHONDONTWRITEBYTECODE: '1'
      P08_TEST_DB_DRIVER: ${{ matrix.kind }}
      P08_TEST_DB_HOST: 127.0.0.1
      P08_TEST_DB_USER: root
      P08_TEST_DB_PASSWORD: p08-only-disposable-ci
      P08_TEST_DB_CLEAN: p08_ci_013_chain
      P08_TEST_DB_DIRTY: p08_ci_013_chain_dirty
    steps:
      - name: Checkout exact one-off Public Runner harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact v013 target source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 394c9cc5928ea35158428bbd2d4e1f03caf9d2b4
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
      - name: Exact original v012 PHP offline test harness and installed-engine code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: dac7bc1d5410c077f32e522eb5740537f618ef9d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: old
      - name: Exact GOV-DOC Mode U candidate authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 74c4090c93cea7ef6a55c7b17d39515e7ca8710c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov
      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: zip,curl,mbstring,pdo_mysql,pdo_sqlite,sqlite3,openssl,posix,dom,intl,fileinfo
          coverage: none
      - name: Native database clients and real original packages
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          timeout 420 sudo apt-get -qq update
          timeout 420 sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y mariadb-client sqlite3
          test "$(git -C target rev-parse HEAD)" = 394c9cc5928ea35158428bbd2d4e1f03caf9d2b4
          tmp="$RUNNER_TEMP/p08-081-chain-${{ matrix.kind }}"
          mkdir -m 700 "$tmp"
          while read -r id file sha; do
            curl -fsSL --retry 2 --max-time 100 \
              -H "Authorization: Bearer $READ_TOKEN" \
              -H 'Accept: application/octet-stream' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/llhzx2018/vf-adops/releases/assets/$id" -o "$tmp/$file"
            test "$(sha256sum "$tmp/$file" | cut -d' ' -f1)" = "$sha"
          done <<'ASSETS'
          763106581 v019-full.zip 91a37e0116066bf0df32341cc0708b8b52eaaa998ea556a920b72ff3863a9232
          763937408 v010-update.zip 3a9ceae0d6b928bc6871b8db900be421728be24c4500dc1c661463917ba4a827
          766931637 v012-update.zip 9a80f880a9cfbd22efce35383ee933766100e936fc6f99f89272237dd4e0ab56
          ASSETS
          python3 - <<'PY'
          import ast
          from pathlib import Path
          ast.parse(Path('target/scripts/p08_v012_previous_success_recover_once.py').read_text())
          print('P08_081_SCRIPT_SYNTAX=PASS')
          PY
      - name: Native original v019 FULL to v010 Atomic to v012 Atomic and phase-specific repair
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          tmp="$RUNNER_TEMP/p08-081-chain-${{ matrix.kind }}"
          site="$HOME/htdocs/adops-vf-081-${{ matrix.kind }}"
          mkdir -p -m 700 "$HOME/htdocs"
          mkdir -m 700 "$site"
          unzip -q "$tmp/v019-full.zip" -d "$site"
          mkdir -p "$site/tests/compatibility"
          cp old/tests/test_install_sqlite_e2e.php old/tests/test_install_mysql_e2e.php "$site/tests/"
          cp old/tests/compatibility/r101_complete_schema.php "$site/tests/compatibility/"
          if [ "${{ matrix.kind }}" = sqlite ]; then
            php "$site/tests/test_install_sqlite_e2e.php"
          else
            mariadb -h127.0.0.1 -uroot -p"$P08_TEST_DB_PASSWORD" -e \
              'CREATE DATABASE p08_ci_013_chain; CREATE DATABASE p08_ci_013_chain_dirty; CREATE TABLE p08_ci_013_chain_dirty.synthetic_dirty(id integer primary key);'
            php "$site/tests/test_install_mysql_e2e.php"
          fi
          test "$(readlink "$site/current")" = "releases/b77c7e8563d93255f5f4a60bb8c5736a994d8151"
          # Disposable SQLite installer fixture sets a known synthetic optional PAT.
          # R154 first-stage covers optional-no-PAT. Require exact known fixture
          # before removing; real Owner sites and actual secrets are never read.
          if [ "${{ matrix.kind }}" = sqlite ]; then
            synthetic="$site/storage/app/private/adops/upgrade/github-read-token"
            test -f "$synthetic" && test ! -L "$synthetic"
            test "$(stat -c %a "$synthetic")" = 600
            test "$(cat "$synthetic")" = "github_pat_$(printf 's%.0s' {1..42})"
            rm -- "$synthetic"
            test ! -e "$synthetic"
            echo P08_013_SQLITE_SYNTHETIC_OPTIONAL_TOKEN_VARIANT=PASS
          fi
          python3 - "$tmp/v019-to-v010.php" <<'PY'
          from pathlib import Path
          import sys
          s=Path('old/tests/compatibility/r154_clean_full_to_two_native_atomic_cycles.php').read_text()
          changes=[
            ("'0.1.5':($phase==='recover'?'0.1.7':'0.1.6')",
             "'0.1.9':($phase==='recover'?'0.1.10':'0.1.9')",1),
            ("trim((string)file_get_contents($site.'/current/VERSION'))!=='0.1.6'",
             "trim((string)file_get_contents($site.'/current/VERSION'))!=='0.1.10'",1),
            ("'target_version'=>'0.1.7'","'target_version'=>'0.1.10'",1),
            ("str_repeat('1',40)","'ef78dcb21117c822e2756360280f2418f794704f'",1),
            ("str_repeat('2',40)","'ef78dcb21117c822e2756360280f2418f794704f'",4),
          ]
          for before,after,n in changes:
            assert s.count(before)==n,(before,s.count(before))
            s=s.replace(before,after)
          Path(sys.argv[1]).write_text(s)
          PY
          P08_R154_NATIVE=YES php "$tmp/v019-to-v010.php" first "$site" \
            b77c7e8563d93255f5f4a60bb8c5736a994d8151 "$tmp/v010-update.zip"
          test "$(readlink "$site/current")" = "releases/ef78dcb21117c822e2756360280f2418f794704f"
          test "$(sha256sum "$site/current/FULL_MANIFEST.json" | cut -d' ' -f1)" = efebfefde3115864dba71c2e56fedae2f7ada8ad4064010473d716b689f67fe9
          # Genuine committed v010 stage; the synthetic Owner-job witness
          # is labeled as test-only. Unmodified original v010 PHP performs
          # strict receipt+native backup archival before v012 stage begins.
          php tests/p08-081-native-history-fixture.php "$site" archive_v010
          media="$site/storage/app/private/adops/r202-media-proof.bin"
          printf 'P08_CHAIN_REAL_ORIGIN_SYNTHETIC_MEDIA_ONLY\n' > "$media"
          chmod 0600 "$media"
          P08_R205_CHAINED=YES php old/tests/compatibility/r205_chained_atomic_apply.php \
            "$site" ef78dcb21117c822e2756360280f2418f794704f \
            efebfefde3115864dba71c2e56fedae2f7ada8ad4064010473d716b689f67fe9 \
            "$tmp/v012-update.zip" dac7bc1d5410c077f32e522eb5740537f618ef9d 0.1.12
          test "$(readlink "$site/current")" = "releases/dac7bc1d5410c077f32e522eb5740537f618ef9d"
          installed="$(sha256sum "$site/current/FULL_MANIFEST.json" | cut -d' ' -f1)"
          echo "P08_013_OFFICIAL_ATOMIC_INSTALLED_012_MANIFEST_SHA256=$installed"
          test "$installed" = 607b3a02a20021c0747d42440497b7e9e3e0fe39040869f475ba22f9f19437e9
          test "$installed" != 4df28b7a9dcfbaf4c0bec18009955fe1b0c7764ccfe94f4257ae2ca0dc3794cc
          # R205 commits issued v012 with true old backup/receipt.
          # Label a prior-job fixture; the new v013 click below is REAL.
          php tests/p08-081-native-history-fixture.php "$site" seed_v012_failed
          script=target/scripts/p08_v012_previous_success_recover_once.py
          up="$site/storage/app/private/adops/upgrade"
          nxt="$site/storage/app/private/adops/owner-next-update"
          digest(){ sha256sum "$1" | cut -d' ' -f1; }
          manifest="$(digest "$site/current/FULL_MANIFEST.json")"
          token="$(digest "$up/github-read-token")"
          media="$(digest "$site/storage/app/private/adops/r202-media-proof.bin")"
          failed="$(digest "$nxt/intent.json")"
          stage="$(find "$up" -mindepth 1 -maxdepth 1 -type d -printf '%f\n')"
          historical="$(find "$nxt/history" -maxdepth 1 -name 'intent-*.json' -print -quit)"
          oldstatus="$(dirname "$historical")/status-$(basename "$historical" | cut -c8-)"
          intentHistorical="$(digest "$historical")"
          statusHistorical="$(digest "$oldstatus")"
          test "$(python3 "$script" --audit "$site" | tail -n 1)" = P08_081_READ_ONLY_AUDIT=PASS
          test "$failed" = "$(digest "$nxt/intent.json")"
          test "$manifest" = "$(digest "$site/current/FULL_MANIFEST.json")"
          echo "P08_081_REAL_READ_ONLY_AUDIT_${{ matrix.kind }}=PASS"

          for mode in duplicate bad-manifest; do
            neg="$HOME/htdocs/adops-vf-081-${{ matrix.kind }}-$mode"
            mkdir -m 700 "$neg"
            cp -a "$site/." "$neg/"
            if [ "$mode" = duplicate ]; then
              php tests/p08-081-native-history-fixture.php "$neg" duplicate_history
              expected=MATCHING_SUCCESS_PAIR_COUNT_NOT_ONE
            else
              printf X | dd of="$neg/current/FULL_MANIFEST.json" bs=1 count=1 conv=notrunc status=none
              expected=ACTIVE_INSTALLED_ORIGIN_NOT_EXACT_607B
            fi
            if msg="$(python3 "$script" --audit "$neg" 2>&1)"; then
              echo P08_081_NEGATIVE_UNEXPECTEDLY_SUCCEEDED; exit 31
            fi
            grep -Fq "$expected" <<< "$msg"
            echo "P08_081_NATIVE_NEGATIVE_$mode=PASS"
          done

          out="$(python3 "$script" --apply "$site")"
          grep -Fq 'P08_081_REPAIR=PASS' <<< "$out"
          test "$(readlink "$site/current")" = releases/dac7bc1d5410c077f32e522eb5740537f618ef9d
          test "$(cat "$site/current/VERSION")" = 0.1.12
          test "$manifest" = "$(digest "$site/current/FULL_MANIFEST.json")"
          test "$token" = "$(digest "$up/github-read-token")"
          test "$media" = "$(digest "$site/storage/app/private/adops/r202-media-proof.bin")"
          test "$intentHistorical" = "$(digest "$historical")"
          test "$statusHistorical" = "$(digest "$oldstatus")"
          test ! -e "$nxt/intent.json" && test ! -e "$nxt/status.json"
          moved="$(find "$nxt/repair-history" -maxdepth 1 -name 'intent-*.json' -print -quit)"
          test "$failed" = "$(digest "$moved")"
          test -d "$site/storage/app/private/adops/upgrade-history/after-dac7bc1d5410c077f32e522eb5740537f618ef9d-$stage"
          test ! -e "$up/$stage"
          test "$(find "$up" -mindepth 1 -maxdepth 1 -printf '%f\n')" = github-read-token
          if python3 "$script" --apply "$site" >/dev/null 2>&1;then
            echo P08_081_REPLAY_UNSAFE;exit 32
          fi
          echo "P08_081_REAL_NATIVE_RECOVERY_${{ matrix.kind }}=PASS"
      - name: Always dispose all private code and synthetic site archives
        if: always()
        shell: bash
        run: |
          rm -rf -- target old gov "$RUNNER_TEMP/p08-081-chain-${{ matrix.kind }}" \
            "$HOME/htdocs/adops-vf-081-${{ matrix.kind }}" \
            "$HOME/htdocs/adops-vf-081-${{ matrix.kind }}-duplicate" \
            "$HOME/htdocs/adops-vf-081-${{ matrix.kind }}-bad-manifest"
          test ! -e target && test ! -e old && test ! -e gov
          echo "P08_081_NATIVE_PRIVATE_CLEANUP_${{ matrix.kind }}=PASS"
