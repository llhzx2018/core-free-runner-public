name: P02 V2.5.6 Preset Templates

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v256-preset-templates.yml'

permissions:
  contents: read

jobs:
  implement-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: task/v2.5.6-preset-templates
          token: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'
          path: p02
          fetch-depth: 0
          persist-credentials: false

      - name: Implement preset template quick start
        working-directory: p02
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/assets/app.js'); s=p.read_text(encoding='utf-8')
          old="function openNewContent(kind){const mode=kind==='article'?'article':kind==='quick'?'quick':'';const options=mode?{forceContentMode:mode,forceContentFormat:mode==='article'?'markdown':null}:{};openEditor(null,options);}"
          new=r'''const PRESET_CONTENT_TEMPLATES={
            quick:[
              {id:'todo',title:'待办清单',description:'任务、采购、待处理事项',content:'## 待办\\n\\n- [ ] \\n- [ ] \\n- [ ] \\n\\n## 备注\\n\\n'},
              {id:'quick-capture',title:'快速记录',description:'临时想法、电话记录、突然想到的事情',content:'## 重点\\n\\n\\n## 补充\\n\\n\\n## 下一步\\n\\n- [ ] \\n'},
              {id:'steps',title:'步骤清单',description:'安装步骤、操作流程、临时流程',content:'## 目标\\n\\n\\n## 步骤\\n\\n1. \\n2. \\n3. \\n\\n## 结果\\n\\n'},
              {id:'daily',title:'每日记录',description:'当天重点、待处理和随手记录',content:'## 今天\\n\\n\\n## 待处理\\n\\n- [ ] \\n\\n## 记录\\n\\n'}
            ],
            article:[
              {id:'general',title:'普通整理',description:'最通用的资料与长文整理',content:'> 一句话说明这篇资料是什么。\\n\\n## 概述\\n\\n\\n## 正文\\n\\n\\n## 补充\\n\\n'},
              {id:'howto',title:'教程 / 操作说明',description:'安装、设置、使用方法和操作教程',content:'## 目的\\n\\n\\n## 准备\\n\\n\\n## 操作步骤\\n\\n### 1. \\n\\n### 2. \\n\\n### 3. \\n\\n## 验证\\n\\n\\n## 注意事项\\n\\n'},
              {id:'research',title:'资料整理',description:'收藏资料、网页内容和信息归纳',content:'## 来源\\n\\n\\n## 核心内容\\n\\n\\n## 重点\\n\\n- \\n\\n## 我的备注\\n\\n\\n## 相关资料\\n\\n'},
              {id:'learning',title:'学习 / 课程笔记',description:'课程、视频、文章学习后的长期笔记',content:'## 本节内容\\n\\n\\n## 核心知识\\n\\n\\n## 示例\\n\\n\\n## 易错点\\n\\n- \\n\\n## 小结\\n\\n'}
            ]
          };
          function presetTemplateCardMarkup(kind,template){return '<button type="button" class="preset-template-card" data-preset-kind="'+kind+'" data-preset-template="'+template.id+'"><strong>'+esc(template.title)+'</strong><span>'+esc(template.description)+'</span><small>'+esc(template.content.split('\\n').filter(Boolean).slice(0,3).join('  ·  '))+'</small></button>';}
          function openPresetTemplatePicker(kind){
            kind=kind==='article'?'article':'quick';const label=kind==='article'?'文章':'便签';
            const blank='<button type="button" class="preset-template-card is-blank" data-preset-kind="'+kind+'" data-preset-template="blank"><strong>空白'+label+'</strong><span>不套结构，直接开始输入</span><small>最自由，也始终排在第一位</small></button>';
            const cards=blank+PRESET_CONTENT_TEMPLATES[kind].map(template=>presetTemplateCardMarkup(kind,template)).join('');
            const body='<div class="preset-template-intro"><p>先选一个常用结构，也可以直接空白开始。模板只负责预填 Markdown，保存后就是普通'+label+'。</p></div><div class="preset-template-grid">'+cards+'</div>';
            const root=modal('新建'+label,body,'<button class="btn secondary" type="button" data-close>取消</button>',{variant:'preset-template-dialog'});
            $$('[data-preset-template]',root).forEach(button=>button.onclick=()=>{const id=button.dataset.presetTemplate;const template=PRESET_CONTENT_TEMPLATES[kind].find(entry=>entry.id===id)||null;const close=$('[data-close]',root);if(close)close.click();openEditor(null,{forceContentMode:kind,forceContentFormat:template?'markdown':(kind==='article'?'markdown':null),initialContent:template?template.content:'',skipDraft:Boolean(template)});});
          }
          function openContentKindPicker(){const body='<div class="preset-kind-grid"><button type="button" class="preset-kind-card" data-preset-kind-choice="quick"><strong>便签</strong><span>快速记录、待办、步骤和每日记录</span></button><button type="button" class="preset-kind-card" data-preset-kind-choice="article"><strong>文章</strong><span>普通整理、教程、资料和学习笔记</span></button></div>';const root=modal('新建内容',body,'<button class="btn secondary" type="button" data-close>取消</button>',{small:true,variant:'preset-kind-dialog'});$$('[data-preset-kind-choice]',root).forEach(button=>button.onclick=()=>{const kind=button.dataset.presetKindChoice;const close=$('[data-close]',root);if(close)close.click();openPresetTemplatePicker(kind);});}
          function openNewContent(kind){if(kind==='article'||kind==='quick'){openPresetTemplatePicker(kind);return;}openContentKindPicker();}'''
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new)
          old_default="""  const defaultItem=Object.assign({},item||{\n    title:'',description:'',content:'',content_mode:rememberedMode,content_format:rememberedFormat,\n    primary_action:rememberedMode==='article'?'read':'copy',tags:[],aliases:[],is_favorite:0,is_pinned:0,\n    status:'active',category_id:selectedCategory\n  });\n  if(savedDraft){"""
          new_default="""  const defaultItem=Object.assign({},item||{\n    title:'',description:'',content:'',content_mode:rememberedMode,content_format:rememberedFormat,\n    primary_action:rememberedMode==='article'?'read':'copy',tags:[],aliases:[],is_favorite:0,is_pinned:0,\n    status:'active',category_id:selectedCategory\n  });\n  if(!item&&Object.prototype.hasOwnProperty.call(options,'initialContent'))defaultItem.content=String(options.initialContent||'');\n  if(!item&&Object.prototype.hasOwnProperty.call(options,'initialTitle'))defaultItem.title=String(options.initialTitle||'');\n  if(!item&&Object.prototype.hasOwnProperty.call(options,'initialDescription'))defaultItem.description=String(options.initialDescription||'');\n  if(savedDraft){"""
          assert s.count(old_default)==1, s.count(old_default)
          s=s.replace(old_default,new_default)
          p.write_text(s,encoding='utf-8')
          PY

          cat >> public/assets/app.css <<'CSS'

          /* V2.5.6 · Preset Template Quick Start */
          .preset-template-dialog .modal{width:min(780px,calc(100vw - 32px))}
          .preset-template-dialog .modal-body{padding-top:12px}
          .preset-template-intro{color:var(--muted);font-size:13px;line-height:1.65;margin-bottom:14px}
          .preset-template-intro p{margin:0}
          .preset-template-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
          .preset-template-card,.preset-kind-card{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;text-align:left;padding:14px 15px;cursor:pointer;display:flex;flex-direction:column;gap:5px;min-height:104px;transition:border-color .15s ease,background .15s ease,transform .15s ease}
          .preset-template-card:hover,.preset-kind-card:hover{border-color:color-mix(in srgb,var(--teal) 42%,var(--line));background:var(--hover);transform:translateY(-1px)}
          .preset-template-card strong,.preset-kind-card strong{font-size:14.5px;font-weight:650;line-height:1.4}
          .preset-template-card span,.preset-kind-card span{font-size:12.5px;color:var(--muted);line-height:1.5}
          .preset-template-card small{margin-top:auto;font-size:11px;line-height:1.45;color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          .preset-template-card.is-blank{border-style:dashed;background:color-mix(in srgb,var(--panel) 88%,var(--hover))}
          .preset-kind-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
          .preset-kind-card{min-height:112px;justify-content:center}
          @media(max-width:640px){.preset-template-grid,.preset-kind-grid{grid-template-columns:1fr}.preset-template-card,.preset-kind-card{min-height:90px}.preset-template-dialog .modal{width:min(94vw,520px)}}
          CSS

          printf '2.5.6\n' > VERSION
          python3 - <<'PY'
          from pathlib import Path
          p=Path('CHANGELOG.md'); s=p.read_text(encoding='utf-8')
          entry='''# VF Library V2.5.6 · Preset Template Quick Start · Candidate · 2026-08-19\n\n- 新增轻量预设模板选择：便签与文章使用各自模板库，空白始终排第一。\n- 便签仅保留 4 个个人高频模式：待办清单、快速记录、步骤清单、每日记录。\n- 文章仅保留 4 个个人高频模式：普通整理、教程 / 操作说明、资料整理、学习 / 课程笔记。\n- 模板仅在新建时预填 Markdown；保存后与模板完全脱钩，不新增模板数据表、绑定关系或 Schema。\n- 不提供“将当前文章保存为模板”，避免把个人资料库做成复杂模板管理系统。\n- Schema 保持 2401，无 Migration。\n\n'''
          p.write_text(entry+s,encoding='utf-8')
          PY
          node --check public/assets/app.js
          test "$(cat VERSION)" = 2.5.6

      - name: Regenerate source manifest
        working-directory: p02
        run: |
          set -Eeuo pipefail
          DEP="$RUNNER_TEMP/deploy256"; bash scripts/build-deploy-tree.sh "$DEP" >/dev/null
          python3 - "$DEP" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          dep=Path(sys.argv[1]); repo=Path.cwd(); old=json.loads((repo/'SOURCE_MANIFEST.json').read_text(encoding='utf-8'))
          mapping={e['full_path']:e['repo_path'] for e in old['entries']}
          out=[]
          for f in sorted(x for x in dep.rglob('*') if x.is_file()):
              rel=f.relative_to(dep).as_posix(); assert rel in mapping,rel
              rp=repo/mapping[rel]; b=f.read_bytes(); rb=rp.read_bytes(); h=lambda x:hashlib.sha256(x).hexdigest()
              out.append({'full_path':rel,'repo_path':mapping[rel],'bytes':len(b),'sha256':h(b),'repo_sha256':h(rb)})
          data={'project':'P02 · VF Library','version':'2.5.6','schema':2401,'source_baseline_full_sha256':'PENDING_FORMAL_CANDIDATE_ARTIFACT','mapping_contract':'Each declared runtime source file must exist exactly once at repo_path; hashes bind the Git-native V2.5.6 candidate deploy tree. Formal release identity is not assigned by this candidate manifest.','runtime_source_file_count':len(out),'entries':out}
          (repo/'SOURCE_MANIFEST.json').write_text(json.dumps(data,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          print('RUNTIME_FILES',len(out))
          PY

      - name: Fresh install and browser template regression
        working-directory: p02
        env:
          AUDIT_PASSWORD: P02-V256-TEMPLATE-${{ github.run_id }}!
        run: |
          set -Eeuo pipefail
          python3 scripts/repository-gates.py
          ROOT="$RUNNER_TEMP/v256"; SITE="$ROOT/site"; mkdir -p "$SITE"; bash scripts/build-deploy-tree.sh "$SITE" >/dev/null
          php -S 127.0.0.1:18261 -t "$SITE" >"$ROOT/server.log" 2>&1 & echo $! > "$ROOT/pid"
          for _ in $(seq 1 80); do curl -fsS http://127.0.0.1:18261/setup.php >/dev/null 2>&1 && break; sleep .25; done
          curl -fsS -c "$ROOT/cookie" http://127.0.0.1:18261/setup.php > "$ROOT/setup.html"
          TOKEN=$(python3 - "$ROOT/setup.html" <<'PY'
          import re,html,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf" value="([^"]+)"',s);assert m;print(html.unescape(m.group(1)))
          PY
          )
          test "$(curl -sS -o /dev/null -w '%{http_code}' -b "$ROOT/cookie" -c "$ROOT/cookie" -H 'Origin: http://127.0.0.1:18261' --data-urlencode "setup_csrf=$TOKEN" --data-urlencode "password=$AUDIT_PASSWORD" --data-urlencode "password_confirm=$AUDIT_PASSWORD" http://127.0.0.1:18261/setup.php)" = 303
          npm install --no-save playwright-core@1.55.0 >/dev/null
          cat > .v256-template.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({channel:'chrome',headless:true});const page=await browser.newPage({viewport:{width:1440,height:900}});const errors=[];page.on('pageerror',e=>errors.push(String(e)));
          await page.goto('http://127.0.0.1:18261/',{waitUntil:'networkidle'});let sess=await page.evaluate(async()=>await(await fetch('/api.php?action=session',{cache:'no-store'})).json());if(!sess?.site?.auth){await page.locator('[data-open-login]').click();await page.locator('#loginForm input[name="password"]').fill(process.env.AUDIT_PASSWORD);await page.locator('#loginSubmit').click();await page.waitForFunction(async()=>Boolean((await(await fetch('/api.php?action=session',{cache:'no-store'})).json())?.site?.auth));}
          const choose=async(kind,id,needle)=>{await page.locator('#addContentMenuBtn').click();await page.locator(`[data-new-kind="${kind}"]`).click();await page.locator(`[data-preset-template="${id}"]`).click();const ta=page.locator('.content-editor');await ta.waitFor({state:'visible'});const value=await ta.inputValue();if(!value.includes(needle))throw new Error(kind+' '+id+' missing '+needle+' => '+value);const mode=await page.locator('[name="content_mode"]').inputValue();const fmt=await page.locator('[name="content_format"]').inputValue();if(mode!==kind)throw new Error('wrong mode '+mode);if(fmt!=='markdown')throw new Error('wrong format '+fmt);await page.locator('#editorCancel').click();await page.waitForTimeout(120);};
          await choose('quick','quick-capture','## 重点');await choose('quick','todo','- [ ]');await choose('article','howto','## 操作步骤');await choose('article','research','## 核心内容');
          await page.locator('#addContentMenuBtn').click();await page.locator('[data-new-kind="quick"]').click();await page.locator('[data-preset-template="blank"]').click();if((await page.locator('.content-editor').inputValue())!=='')throw new Error('blank quick not blank');await page.locator('#editorCancel').click();
          await page.locator('#addContentBtn').click();await page.locator('[data-preset-kind-choice="article"]').click();if(await page.locator('[data-preset-template]').count()!==5)throw new Error('article picker must have blank + 4 presets');await page.locator('[data-preset-template="learning"]').click();if(!(await page.locator('.content-editor').inputValue()).includes('## 核心知识'))throw new Error('learning template missing');
          if(errors.length)throw new Error(errors.join(' | '));console.log('V256_PRESET_TEMPLATE_BROWSER=PASS');await browser.close();
          JS
          node .v256-template.mjs
          php "$SITE/cli/verify.php" | jq -e '.ok==true and .version=="2.5.6" and .schema_version==2401 and .integrity=="ok" and .foreign_key_errors==0' >/dev/null
          kill "$(cat "$ROOT/pid")"
          echo FRESH_INSTALL=PASS
          echo TEMPLATE_LIBRARY=QUICK_4_ARTICLE_4_PLUS_BLANK
          echo SCHEMA_MIGRATION=NO
          echo PRODUCTION_WRITE=NO

      - name: Push verified candidate to product branch
        working-directory: p02
        env:
          GH_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          git config user.name 'VF Release Bot'
          git config user.email 'vf-release-bot@users.noreply.github.com'
          git add public/assets/app.js public/assets/app.css VERSION CHANGELOG.md SOURCE_MANIFEST.json
          git diff --cached --check
          git commit -m 'feat(v2.5.6): add focused preset note and article templates'
          gh auth setup-git
          git push https://github.com/llhzx2018/vf-library.git HEAD:task/v2.5.6-preset-templates
          echo PRODUCT_CANDIDATE_COMMIT=$(git rev-parse HEAD)
          echo PRODUCTION_WRITE=NO
