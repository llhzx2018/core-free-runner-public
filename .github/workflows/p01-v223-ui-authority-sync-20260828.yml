## 5. Page Contract

- `src/index.php`：已安装且管理员、并非 Classic Entry 时 302 到 `surfaces.php`；匿名继续旧导航；
- `src/start.php`：定义 `VF_START_CLASSIC_ENTRY` 后复用 `index.php`；
- `src/surfaces.php`：Unified Dashboard；
- `src/surface.php`：Channels / Watch 统一 Shell 内核；
- `src/assets/surface-home.css`：Dashboard/Shell 布局与响应式；
- `src/assets/surface-home.js`：Theme + Cmd/Ctrl-K；
- 原 `SurfaceRepository` 与 Schema 不改。

## 6. Security / Privacy

私人 Surface metadata 继续服从 V2.22.1 Public Projection；UI 不得绕过 `vf_is_admin()`、Session、CSRF 或 SurfaceRepository 隐私投影。匿名根页不得自动进入 Owner Dashboard。

