name: TEMP P07 five candidate coexistence and unchanged toolbox
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p07-five-candidate-coexistence-temporary.yml']
permissions:
  contents: read
jobs:
  coexistence:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.actor == 'llhzx2018' && github.triggering_actor == 'llhzx2018' && github.event.pull_request.user.login == 'llhzx2018' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'temp/p07-five-candidate-coexistence-20261128'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE: 829d4fb55d7b06e2dd1397d673cc7a502a1ea83a
      TREE: 325cbb1ba4e0dfb01895036548ab060f068d6a87
      BUILD: 0.1.0-release146-dev829d4fb5
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1d8784c24ed6c293622ae1d744a98f89c3f317ad
          persist-credentials: false
          fetch-depth: 1
          path: m01-source
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: acb31acc2241ac7f58fd0daf235113ca55ae2009
          persist-credentials: false
          fetch-depth: 1
          path: m02-source
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          ref: 829d4fb55d7b06e2dd1397d673cc7a502a1ea83a
          persist-credentials: false
          fetch-depth: 1
          path: m03-source
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4d6cc374291f81893c0adfed02a03c06fa99a6c3
          persist-credentials: false
          fetch-depth: 1
          path: m04-source
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          ref: 5734f7e26abf23dd0e85e9970f2c3dbd2a298367
          persist-credentials: false
          fetch-depth: 1
          path: m05-source
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d67b30c1b03b7a473d9e742d147f9d6aa5960627
          persist-credentials: false
          fetch-depth: 1
          path: toolbox-source
      - name: Joint install original exact independent candidates
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          test "$(git -C "$GITHUB_WORKSPACE/m01-source" rev-parse HEAD)" = 1d8784c24ed6c293622ae1d744a98f89c3f317ad
          test -z "$(git -C "$GITHUB_WORKSPACE/m01-source" status --porcelain)"
          test "$(git -C "$GITHUB_WORKSPACE/m02-source" rev-parse HEAD)" = acb31acc2241ac7f58fd0daf235113ca55ae2009
          test -z "$(git -C "$GITHUB_WORKSPACE/m02-source" status --porcelain)"
          test "$(git -C "$GITHUB_WORKSPACE/m03-source" rev-parse HEAD)" = 829d4fb55d7b06e2dd1397d673cc7a502a1ea83a
          test -z "$(git -C "$GITHUB_WORKSPACE/m03-source" status --porcelain)"
          test "$(git -C "$GITHUB_WORKSPACE/m04-source" rev-parse HEAD)" = 4d6cc374291f81893c0adfed02a03c06fa99a6c3
          test -z "$(git -C "$GITHUB_WORKSPACE/m04-source" status --porcelain)"
          test "$(git -C "$GITHUB_WORKSPACE/m05-source" rev-parse HEAD)" = 5734f7e26abf23dd0e85e9970f2c3dbd2a298367
          test -z "$(git -C "$GITHUB_WORKSPACE/m05-source" status --porcelain)"
          test "$(git -C "$GITHUB_WORKSPACE/toolbox-source" rev-parse HEAD)" = d67b30c1b03b7a473d9e742d147f9d6aa5960627
          test -z "$(git -C "$GITHUB_WORKSPACE/toolbox-source" status --porcelain)"
          test ! -e /opt/vfops-modules && test ! -L /opt/vfops-modules
          test ! -e /opt/vf-server-ops && test ! -L /opt/vf-server-ops
          test ! -e /opt/vf-server-ops.previous && test ! -L /opt/vf-server-ops.previous
          test ! -e /opt/vf-server-ops.new && test ! -L /opt/vf-server-ops.new
          test ! -e /usr/local/bin/vfops && test ! -L /usr/local/bin/vfops
          work=$(mktemp -d "$RUNNER_TEMP/p07-five-coexistence.XXXXXX")
          printf '%s\n' "$work" >"$RUNNER_TEMP/p07-five-owned-$GITHUB_RUN_ID"
          export WORK="$work"
          python3 -B - <<'PY'
          import os
          from pathlib import Path
          print("P07_HOST_CPU_AFFINITY="+str(len(os.sched_getaffinity(0))))
          print("P07_HOST_"+next(x for x in Path("/proc/meminfo").read_text().splitlines() if x.startswith("MemTotal:")).replace(" ",""))
          try:
              fd=os.open("/dev/kvm",os.O_RDWR|os.O_CLOEXEC)
              os.close(fd)
              print("P07_KVM_DEVICE_OPEN=PASS_ONLY_NOT_VM_PROOF")
          except OSError as e:
              print("P07_KVM_DEVICE_OPEN=UNAVAILABLE_ERRNO_"+str(e.errno))
          PY
          cat >"$work/snapshot.py" <<'PY'
          import hashlib,json,os,stat,sys
          from pathlib import Path
          slots={'m01':'/opt/vfops-modules/m01','m02':'/opt/vfops-modules/m02','m03':'/opt/vf-server-ops','m04':'/opt/vfops-modules/m04','m05':'/opt/vfops-modules/m05'}
          def record(p):
              s=p.lstat();row=[stat.S_IMODE(s.st_mode),s.st_uid,s.st_gid]
              if p.is_symlink():return row+['link',os.readlink(p)]
              if p.is_dir():return row+['dir']
              if p.is_file():return row+['file',hashlib.sha256(p.read_bytes()).hexdigest()]
              raise ValueError("special entry")
          for slot in sys.argv[1:]:
              root=Path(slots[slot])
              assert root.is_dir() and not root.is_symlink()
              doc={'.':record(root)}
              for p in sorted(root.rglob('*')):doc[p.relative_to(root).as_posix()]=record(p)
              if slot=='m03':doc['@entry']=record(Path('/usr/local/bin/vfops'))
              print(slot+' '+hashlib.sha256(json.dumps(doc,sort_keys=True).encode()).hexdigest())
          PY
          snap() { sudo -n python3 -B "$work/snapshot.py" "$@"; }
          cd "$GITHUB_WORKSPACE/m01-source"
          python3 -B installers/p07-m01-ux4-atomic.py build "$work/m01.zip"
          sudo -n python3 -B installers/p07-m01-ux4-atomic.py install "$work/m01.zip" "$(sha256sum "$work/m01.zip"|cut -d' ' -f1)"
          snap m01 >"$work/one"
          cd "$GITHUB_WORKSPACE/m02-source"
          python3 -B - "$work/m02.zip" <<'PY'
          import importlib.util,sys
          from pathlib import Path
          def load(path,name):
              spec=importlib.util.spec_from_file_location(name,path);m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m);return m
          candidate=load(Path("installers/p07-m02-ux4-atomic.py"),"candidate")
          builder=load(Path("scripts/build_p07_ux_three_release_candidates.py"),"builder")
          script=Path("experiments/p07-vps-audit-v21-ux4.sh").read_bytes()
          files={candidate.ENTRY:script,"VERSION":(candidate.NEW+"\n").encode()}
          files[candidate.META]=candidate.manifest(candidate.NEW,script)
          candidate.check_payload(candidate.NEW,files)
          builder.output_zip(Path(sys.argv[1]),candidate.MODULE,files)
          PY
          sudo -n python3 -B installers/p07-m02-ux4-atomic.py install "$work/m02.zip" "$(sha256sum "$work/m02.zip"|cut -d' ' -f1)"
          snap m01 >"$work/one-after";cmp "$work/one" "$work/one-after"
          snap m01 m02 >"$work/two"
          cd "$GITHUB_WORKSPACE/m03-source"
          test "$(git rev-parse 'HEAD^{tree}')" = "$TREE"
          curl --proto '=https' --proto-redir '=https' --connect-timeout 15 --max-time 120 -fsSL \
            https://github.com/llhzx2018/core-free-runner-public/releases/download/p07-m03-v0.1.0-release146-20261122/P07-M03-0.1.0-release146.zip -o "$work/official.zip"
          echo "7b3e46c651c5ce3597e4ab535fbdc734023fc1b706fe85189a344ee600514321  $work/official.zip" | sha256sum -c >/dev/null
          python3 -B - <<'PY'
          import hashlib, os, re, stat, zipfile
          from pathlib import Path, PurePosixPath
          work=Path(os.environ['WORK']); src=Path.cwd()
          prefix='dist/p07/0.1.0/overlay/'
          manifest=prefix+'RUNTIME.gitblob'
          installer='installers/p07-final.sh'
          base='dist/p07/0.1.0-rc2/P07_VF_SERVER_OPS_0.1.0-rc2.tar.gz'
          def blob(b):return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          with zipfile.ZipFile(work/'official.zip') as z:
              infos=z.infolist(); names=[i.filename for i in infos]
              assert 50<=len(infos)<=240 and len(set(names))==len(names)
              assert sum(i.file_size for i in infos)<110*1024*1024
              for i in infos:
                  assert stat.S_IFMT(i.external_attr>>16)==stat.S_IFREG and i.file_size<64*1024*1024
                  assert not i.is_dir() and not i.filename.startswith('/') and '\\' not in i.filename and '..' not in PurePosixPath(i.filename).parts
              files={i.filename:z.read(i) for i in infos}
          assert blob(files[manifest])=='78caa4b85edc5441039483117e3f9660cf6e3af6'
          assert blob(files[installer])=='878135473e5b2bfaf7fe104821efb36121667f0f'
          rows={}
          for line in files[manifest].decode('ascii').splitlines():
              m=re.fullmatch(r'([a-f0-9]{40})  ((?:bin|lib|components)/[A-Za-z0-9_./-]+|BUILD_ID)',line)
              assert m and m[2] not in rows and '..' not in PurePosixPath(m[2]).parts
              assert blob(files[prefix+m[2]])==m[1]
              rows[m[2]]=m[1]
          assert set(files)=={prefix+n for n in rows}|{manifest,installer,base}
          assert files[prefix+'BUILD_ID']==b'0.1.0-release146\n'
          prior=dict(files)
          change={'bin/vfops-site-ui':'66a37cb5c8c538b5ebf3db2f6994c740b9ef78f0',
                  'lib/package_core.py':'6c03e27bde76f8bfaa9e12a1d9bd5118811b520c'}
          for n,digest in change.items():
              assert n in rows
              data=(src/n).read_bytes();assert blob(data)==digest
              files[prefix+n]=data
          # Unchanged runtime dependencies are independently compared. D04 stays
          # the immutable official release146 runtime, not the frozen RC5 trial.
          checked=['lib/inventory.py','lib/package.py','lib/restore.py','lib/restore_apply.py',
                   'lib/restore_apply_core.py','lib/terminal_ui.sh','lib/restore_failure_ui.sh',
                   'bin/vfops','lib/cloudpanel.py']
          matches=sum(n in rows and files[prefix+n]==(src/n).read_bytes() for n in checked)
          print(f'P07_M03_D01_D03_SUPPORT_FILE_MATCH={matches}/{len(checked)}',flush=True)
          files[prefix+'BUILD_ID']=(os.environ['BUILD']+'\n').encode('ascii')
          files[manifest]=''.join(blob(files[prefix+n])+'  '+n+'\n' for n in sorted(rows)).encode('ascii')
          script=files[installer]
          for old,new in ((b'EXPECTED_BUILD_ID="0.1.0-release146"',('EXPECTED_BUILD_ID="'+os.environ['BUILD']+'"').encode()),
                          (b'RUNTIME_MANIFEST_BLOB="78caa4b85edc5441039483117e3f9660cf6e3af6"',('RUNTIME_MANIFEST_BLOB="'+blob(files[manifest])+'"').encode())):
              assert script.count(old)==1;script=script.replace(old,new)
          files[installer]=script
          allowed={prefix+n for n in change}|{prefix+'BUILD_ID',manifest,installer}
          assert all(files[n]==v for n,v in prior.items() if n not in allowed)
          dest=work/'candidate';dest.mkdir(mode=0o700)
          for n,data in files.items():
              p=dest/n;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          archive=work/'candidate.zip'
          with zipfile.ZipFile(archive,'x',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for n,data in sorted(files.items()):
                  info=zipfile.ZipInfo(n,(2026,11,28,0,0,0));info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=(stat.S_IFREG|0o644)<<16;z.writestr(info,data)
          print('P07_M03_OFFICIAL146_AUTHENTIC_AND_UNCHANGED_D04=PASS',flush=True)
          print('P07_M03_DEV_OVERLAY_SOURCE='+os.environ['SOURCE']+'; TREE='+os.environ['TREE'],flush=True)
          print('P07_M03_DEV_ZIP_SHA256='+hashlib.sha256(archive.read_bytes()).hexdigest(),flush=True)
          print('P07_M03_SCOPE=SIGNED_RELEASE146_PLUS_EXACT_TWO_FILE_DEV_OVERLAY_NOT_FULL_SOURCE_TREE',flush=True)
          PY
          test "$(sha256sum "$work/candidate.zip"|cut -d' ' -f1)" = fe05e66d39462b81d9099869d4e25e9848172edb2b93cd0ba207c48df415ea08
          sudo -n env P07_NO_EXEC=1 P07_PUBLIC_ROOT="file://$work/candidate" P07_INSTALL_DIR=/opt/vf-server-ops P07_PREVIOUS_DIR=/opt/vf-server-ops.previous P07_BIN_LINK=/usr/local/bin/vfops bash "$work/candidate/installers/p07-final.sh" >"$work/install-m03.log" 2>&1
          test "$(sudo -n cat /opt/vf-server-ops/BUILD_ID)" = "$BUILD"
          snap m01 m02 >"$work/two-after";cmp "$work/two" "$work/two-after"
          snap m01 m02 m03 >"$work/three"
          cd "$GITHUB_WORKSPACE/m04-source"
          python3 -B installers/p07-m04-ux6-atomic.py build "$work/m04.zip"
          test "$(sha256sum "$work/m04.zip"|cut -d' ' -f1)" = 27413282414fff40557af99069ac6878f0bd05d20032b52378cd899fdb644355
          sudo -n python3 -B installers/p07-m04-ux6-atomic.py install "$work/m04.zip" "$(sha256sum "$work/m04.zip"|cut -d' ' -f1)"
          snap m01 m02 m03 >"$work/three-after";cmp "$work/three" "$work/three-after"
          snap m01 m02 m03 m04 >"$work/four"
          cd "$GITHUB_WORKSPACE/m05-source"
          python3 -B scripts/build_p07_m05_bundle.py --output "$work/m05.zip" >"$work/build-m05.log"
          test "$(sha256sum "$work/m05.zip"|cut -d' ' -f1)" = 397f1a366f0d8b931047ffb4f573690335a601324d07b3799a5aa506fd4d1332
          sudo -n python3 -B scripts/install_p07_m05_bundle.py --archive "$work/m05.zip" --sha256 "$(sha256sum "$work/m05.zip"|cut -d' ' -f1)" >"$work/install-m05.log"
          snap m01 m02 m03 m04 >"$work/four-after";cmp "$work/four" "$work/four-after"
          snap m01 m02 m03 m04 m05 >"$work/all-before"
          echo P07_FIVE_REAL_CANDIDATES_CO_INSTALLED_AND_PRIOR_SLOTS_UNCHANGED=PASS
          box="$GITHUB_WORKSPACE/toolbox-source/installers/p07-toolbox.sh"
          test "$(git hash-object "$box")" = 60e6e3b099391bf086cec633b6ec1547a8aec1f8
          sudo -n env NO_COLOR=1 PYTHONDONTWRITEBYTECODE=1 bash "$box" --modules >"$work/modules.log"
          grep -Fq 'P07-M01 网络代理节点（V2Ray）：0.1.0-ux4' "$work/modules.log"
          grep -Fq 'P07-M02 服务器性能检测（VPS 验机）：2.1.1-ux4' "$work/modules.log"
          grep -Fq 'P07-M03 网站与数据：0.1.0-release146-dev829d4fb5' "$work/modules.log"
          grep -Fq 'P07-M04 服务器维护与安全：0.1.0-ux6' "$work/modules.log"
          grep -Fq 'P07-M05 新服务器初始化：0.1.0-m05-ux16-runtime-identity-catalog' "$work/modules.log"
          echo P07_UNMODIFIED_CANDIDATE_TOOLBOX_ACTUAL_FIVE_MODULE_STATUS=PASS
          set +e
          sudo -n env NO_COLOR=1 PYTHONDONTWRITEBYTECODE=1 bash "$box" --check-m03 >"$work/reject-m03.log" 2>&1
          rc=$?
          set -e
          test "$rc" = 13
          grep -Fq '没有覆盖或升级' "$work/reject-m03.log"
          echo P07_FROZEN_OFFICIAL_PIN_REJECTS_UNISSUED_M03_NO_OVERWRITE=PASS
          sudo -n env PYTHONDONTWRITEBYTECODE=1 NO_COLOR=1 bash /opt/vfops-modules/m01/current/vf-node.sh --version
          sudo -n env PYTHONDONTWRITEBYTECODE=1 NO_COLOR=1 bash /opt/vfops-modules/m02/current/vps-audit.sh --build-id
          sudo -n env PYTHONDONTWRITEBYTECODE=1 NO_COLOR=1 /usr/local/bin/vfops --build-id
          sudo -n env PYTHONDONTWRITEBYTECODE=1 NO_COLOR=1 bash /opt/vfops-modules/m04/current/vf-system-care.sh --version
          sudo -n env PYTHONDONTWRITEBYTECODE=1 NO_COLOR=1 bash /opt/vfops-modules/m05/current/bin/vfops-init-entry --version
          snap m01 m02 m03 m04 m05 >"$work/all-after";cmp "$work/all-before" "$work/all-after"
          echo P07_FIVE_REAL_ENTRYPOINTS_AND_NO_CROSS_SLOT_CHANGE=PASS
          echo P07_SCOPE=ACTUAL_FIVE_CANDIDATE_COEXISTENCE_AND_UNCHANGED_TOOLBOX_READ_ONLY_STATUS_NOT_FULL_ROUTED_BUSINESS
      - name: Always clean owned modules and transient private checkouts
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          f="$RUNNER_TEMP/p07-five-owned-$GITHUB_RUN_ID"
          if [[ -f "$f" && ! -L "$f" ]]; then
            read -r work <"$f"
            [[ "$work" == "$RUNNER_TEMP"/p07-five-coexistence.* && -d "$work" && ! -L "$work" ]]
            [[ ! -L /opt/vfops-modules && ! -L /opt/vf-server-ops && ! -L /opt/vf-server-ops.previous && ! -L /opt/vf-server-ops.new ]]
            if [[ -L /usr/local/bin/vfops ]]; then
              test "$(readlink /usr/local/bin/vfops)" = /opt/vf-server-ops/bin/vfops-user
              sudo -n rm -- /usr/local/bin/vfops
            fi
            sudo -n rm -rf -- /opt/vfops-modules /opt/vf-server-ops /opt/vf-server-ops.previous /opt/vf-server-ops.new "$work"
            test ! -e /opt/vfops-modules;test ! -e /opt/vf-server-ops;test ! -e "$work"
            rm -- "$f"
          fi
          for slot in m01 m02 m03 m04 m05 toolbox; do
            p="$GITHUB_WORKSPACE/$slot-source"
            [[ ! -L "$p" ]]
            rm -rf -- "$p";test ! -e "$p"
          done
          echo P07_FIVE_OWNED_CANDIDATE_AND_PRIVATE_CHECKOUT_CLEANUP=PASS
