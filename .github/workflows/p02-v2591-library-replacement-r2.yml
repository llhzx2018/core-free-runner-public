name: P02 V2.5.91 Library Replacement R2

on:
  push:
    branches:
      - run/p02-v2591-library-replacement-r2-20260923
    paths:
      - '.github/workflows/p02-v2591-library-replacement-r2.yml'

permissions:
  contents: read

jobs:
  replacement-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact P02 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 769a95484cac082c79049df4090dd3a6bb8b90dc
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product
      - name: Install runtime and Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-zip sqlite3 unzip curl
          cd product
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Exact-source unit gate
        shell: bash
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "769a95484cac082c79049df4090dd3a6bb8b90dc"
          test "$(cat VERSION)" = "2.5.91"
          python3 scripts/generate-source-manifest.py
          git diff --exit-code -- SOURCE_MANIFEST.json SOURCE_MANIFEST.txt
          node --check public/assets/app.js
          node --check public/assets/maintenance.js
          node tests/unit/p02_v2591_library_replacement_resume_safety.mjs
          while IFS= read -r cmd; do test -n "$cmd"; eval "$cmd"; done < <(awk '/run: node tests\/unit\//{sub(/^.*run: /,""); print}' .github/workflows/repository-health.yml)
          bash scripts/verify-repository.sh
          echo P02_V2591_LIBRARY_REPLACEMENT_SOURCE=PASS
      - name: Maintenance baseline
        shell: bash
        working-directory: product
        env:
          TEST_PASSWORD: VF-P02-V2591-${{ github.run_id }}!
          EVIDENCE_DIR: ${{ runner.temp }}/p02-v2591-replacement
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          bash scripts/maintenance-reverify.sh
          echo P02_V2591_LIBRARY_REPLACEMENT_MAINTENANCE=PASS
      - name: Focused Chromium replacement safety
        shell: bash
        working-directory: product
        env:
          VF_UX_FOCUSED_LIBRARY_REPLACEMENT: "1"
          VF_UX_E2E_PASSWORD: VF-P02-V2591-${{ github.run_id }}!
        run: |
          set -Eeuo pipefail
          timeout 180s bash scripts/ux-browser-reverify.sh
          echo P02_V2591_LIBRARY_REPLACEMENT_BROWSER_GATE=PASS
      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p02-v2591-library-replacement-r2
          path: ${{ runner.temp }}/p02-v2591-replacement
          if-no-files-found: ignore
          retention-days: 7
