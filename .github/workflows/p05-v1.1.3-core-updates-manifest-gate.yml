name: P05 V1.1.3 Core Updates Manifest Gate

on:
  push:
    branches:
      - gate/p05-v113-login-repair-20260830
    paths:
      - '.github/workflows/p05-v1.1.3-core-updates-manifest-gate.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      CORE_UPDATES_SHA: 6501a06add8dc41c0fb135bda70c0702dcc85dd5
      P05_VERSION: 1.1.3
      RELEASE_ID: '379244584'
      RELEASE_SOURCE: 5e85172e86ab511849ab5f215378f2cfa8f26355
      RELEASE_TREE: cd725c4b55d989e44c73b46785403dc3f6910dd9
      ASSET_ID: '536448496'
      ASSET_BYTES: '234536'
      ASSET_SHA: 3fe69e0fe308cee05ec6eae456c28f423a54e37a7228163faad84792a1dcd253
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Verify private read capability
        run: test -n "$PRIVATE_READ_TOKEN"

      - name: Checkout exact core-updates candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CORE_UPDATES_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate P05 manifest and remote release
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CORE_UPDATES_SHA"
          M=projects/P05.json
          jq -e --arg v "$P05_VERSION" --arg s "$RELEASE_SOURCE" --arg t "$RELEASE_TREE" --arg sha "$ASSET_SHA" --argjson rid "$RELEASE_ID" --argjson aid "$ASSET_ID" --argjson bytes "$ASSET_BYTES" '
            .target_version==$v and .update_type=="FULL_ONLY" and .from_versions==[] and
            .schema_from=="1" and .schema_to=="1" and .release_tag==("v"+$v) and
            .release_id==$rid and .release_product_commit==$s and .release_product_tree==$t and
            .asset_name=="VF_SEO_V1.1.3_FULL.zip" and .asset_id==$aid and .asset_bytes==$bytes and .asset_sha256==$sha and
            .deployment_state=="NOT_DEPLOYED" and .production_verification=="NOT_APPLICABLE_UNTIL_FIRST_DEPLOYMENT"
          ' "$M" >/dev/null
          R="$(curl -fsSL https://api.github.com/repos/llhzx2018/vf-seo/releases/tags/v1.1.3)"
          test "$(jq -r .id <<<"$R")" = "$RELEASE_ID"
          test "$(jq -r .target_commitish <<<"$R")" = "$RELEASE_SOURCE"
          A="$(jq -c '.assets[] | select(.name=="VF_SEO_V1.1.3_FULL.zip")' <<<"$R")"
          test "$(jq -r .id <<<"$A")" = "$ASSET_ID"
          test "$(jq -r .size <<<"$A")" = "$ASSET_BYTES"
          test "$(jq -r .digest <<<"$A")" = "sha256:$ASSET_SHA"
          echo P05_V113_CORE_UPDATES_MANIFEST=PASS
          echo P05_PRODUCTION=NOT_DEPLOYED
