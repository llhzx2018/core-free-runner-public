name: P01 V2.32 Owner Production Closure
on:
  push:
    branches: [task/p01-v2320-formal-release-20260830]
    paths:
      - .github/workflows/p01-v2320-production-closure-20260830.yml
      - scripts/p01-v2320-production-closure.py
permissions:
  contents: read
jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout gate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: runner
      - name: Checkout exact production closure branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: closure/p01-v2.32.0-production-20260830
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Exact production truth and docs-only closure
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          test "$(git rev-parse HEAD)" = 3fd2d9a4a8de1c36a062183ee52db64872e56905
          test "$(git rev-parse HEAD^{tree})" = bcaa8187140523baba4f8d7adfa8a85775aa2f36
          test "$(git rev-parse HEAD:src)" = f348cb314623906acc851cb79d75b1c8f6637aff
          test "$(gh api repos/llhzx2018/vf-start/branches/main --jq .commit.sha)" = 3fd2d9a4a8de1c36a062183ee52db64872e56905
          test "$(gh api repos/llhzx2018/vf-start/branches/develop --jq .commit.sha)" = 3fd2d9a4a8de1c36a062183ee52db64872e56905
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.32.0 --jq .object.sha)" = 120a42667fce7357fdaef03b64cb7ea41392040d
          test "$(gh api repos/llhzx2018/vf-start/releases/tags/v2.32.0 --jq .id)" = 379046260
          test "$(gh api repos/llhzx2018/core-updates/branches/main --jq .commit.sha)" = e61b366d7d63faf19b895b8334c3b9900b83a7a8
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33264951077 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33265148601 --jq .conclusion)" = success
          python3 ../runner/scripts/p01-v2320-production-closure.py
          python3 -m json.tool VF_PROJECT.json >/dev/null
          tracked=$(git diff --name-only)
          untracked=$(git ls-files --others --exclude-standard)
          { printf '%s\n' "$tracked"; printf '%s\n' "$untracked"; } | sed '/^$/d' | sort -u >/tmp/p01-v2320-production-actual.txt
          printf '%s\n' \
            CHANGELOG.md \
            README.md \
            VF_PROJECT.json \
            docs/README.md \
            docs/authority/ACCEPTANCE_MATRIX.md \
            docs/authority/CURRENT.md \
            docs/authority/P01_FUNCTIONAL_CONTRACT_20260829.md \
            docs/authority/RPD.md \
            docs/authority/SSOT.md \
            docs/evidence/P01_V2.32.0_PRODUCTION_CLOSURE_20260830.md \
            docs/handoff/CURRENT_STATE.md | sort >/tmp/p01-v2320-production-expected.txt
          diff -u /tmp/p01-v2320-production-expected.txt /tmp/p01-v2320-production-actual.txt
          test -z "$(git diff --name-only -- src)"
          test "$(git rev-parse HEAD:src)" = f348cb314623906acc851cb79d75b1c8f6637aff
          test "$(jq -r .production_version VF_PROJECT.json)" = 2.32.0
          test "$(jq -r .working_version VF_PROJECT.json)" = 2.32.0
          test "$(jq -r .formal_release_state VF_PROJECT.json)" = 'PUBLISHED / CLOSED'
          test "$(jq -r .production_release.owner_production_runtime VF_PROJECT.json)" = 2.32.0
          test "$(jq -r .production_release.owner_production_schema VF_PROJECT.json)" = 2026082901
          test "$(jq -r .production_release.production_closure_gate VF_PROJECT.json)" = "$GITHUB_RUN_ID"
          test "$(jq -r .production_release.assistant_production_write VF_PROJECT.json)" = false
          grep -F 'V2.32.0 OWNER PRODUCTION / PRODUCTION CLOSED' docs/authority/CURRENT.md >/dev/null
          grep -F 'VF Start · V2.32.0' docs/evidence/P01_V2.32.0_PRODUCTION_CLOSURE_20260830.md >/dev/null
          grep -F 'stale pre-refresh DOM' CHANGELOG.md >/dev/null
          grep -F 'Current Production: `V2.32.0 / Schema 2026082901`' docs/authority/P01_FUNCTIONAL_CONTRACT_20260829.md >/dev/null
          git diff --check
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add CHANGELOG.md README.md VF_PROJECT.json docs/README.md docs/authority/ACCEPTANCE_MATRIX.md docs/authority/CURRENT.md docs/authority/P01_FUNCTIONAL_CONTRACT_20260829.md docs/authority/RPD.md docs/authority/SSOT.md docs/evidence/P01_V2.32.0_PRODUCTION_CLOSURE_20260830.md docs/handoff/CURRENT_STATE.md
          git commit -m 'docs(P01): close V2.32.0 owner production'
          git push origin HEAD:closure/p01-v2.32.0-production-20260830
          echo "PRODUCTION_CLOSURE_SOURCE=$(git rev-parse HEAD)"
          echo "PRODUCTION_CLOSURE_TREE=$(git rev-parse HEAD^{tree})"
          echo "RUNTIME_TREE=$(git rev-parse HEAD:src)"
          echo P01_V2320_OWNER_PRODUCTION_CLOSURE=PASS
          echo OWNER_PRODUCTION_RUNTIME=2.32.0
          echo OWNER_PRODUCTION_SCHEMA=2026082901
          echo ASSISTANT_PRODUCTION_WRITE=NO
