name: P01 Projects guest zero-scope exact-source test-only
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-projects-guest-zero-test-only.yml']
permissions:
  contents: read
jobs:
  projects-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout registered Public Runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact private P01 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: b3492a1c610777783383a87c016bcf4300136ad5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Configure PHP with SQLite
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,mbstring,curl,zip,openssl
          coverage: none
      - name: Exact-source guest permissions, action, and filter regression
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "b3492a1c610777783383a87c016bcf4300136ad5"
          php -l product/src/app/ProjectActionCenterPage.php
          php -l product/tests/unit/projects_guest_zero_public_scope_v247390_contract.php
          for file in \
            projects_guest_zero_public_scope_v247390_contract.php \
            project_page_context_closure_contract.php \
            projects_dashboard_reframe_v247181_contract.php \
            project_state_language_contract.php \
            project_github_sync_v247177_contract.php \
            project_zero_count_state_chip_contract.php \
            project_empty_current_state_context_contract.php \
            project_normal_state_search_context_contract.php \
            project_state_context_count_contract.php \
            project_state_facet_context_contract.php \
            project_action_hierarchy_contract.php \
            project_entry_source_semantics_contract.php \
            project_primary_action_click_contract.php \
            project_overview_entry_action_copy_contract.php \
            project_focus_visibility_contract.php; do
            php "product/tests/unit/$file"
          done
          echo P01_PROJECTS_PUBLIC_EMPTY_EXACT_SOURCE=PASS
      - name: Remove temporary private source
        if: always()
        shell: bash
        run: rm -rf product
