name: TEMP P07 M03 Percona84 Debian13 official-client native P07 import
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p07-m03-percona84-debian13-native-20261124.yml'
permissions:
  contents: read
jobs:
  isolated-atomic:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'test/p07-m03-percona84-debian13-native-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_REPO: 'llhzx2018/vf-server-ops'
      TARGET_VERSION: '0.1.0'
      TARGET_SHA: 'e044d8df3a5d6ddc21decbccdf9f5d3813e91d5b'
      TARGET_TREE: 'b2134f492a4b8d72beeb534fe9ca1bc8723a39db'
      PRODUCT_SHA: 'e044d8df3a5d6ddc21decbccdf9f5d3813e91d5b'
      NO_COLOR: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout public lane contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Public source-render audit before any private checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B scripts/ephemeral_lane_spec.py validate --spec .github/ephemeral/p07-m03-percona84-debian13-native-20261124.json > "$RUNNER_TEMP/p07-lane-check.json"
          python3 -B scripts/ephemeral_lane_spec.py audit-rendered --spec .github/ephemeral/p07-m03-percona84-debian13-native-20261124.json --input .github/workflows/temp-p07-m03-percona84-debian13-native-20261124.yml > "$RUNNER_TEMP/p07-lane-audit.json"
          python3 -B - "$RUNNER_TEMP/p07-lane-audit.json" "$TARGET_SHA" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          assert data['status']=='PASS' and data['target_sha']==sys.argv[2]
          print('P07_M03_RC4_SOURCE_LANE_PRECHECK=PASS')
          PY
      - name: Transient exact private source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: .p07-private
      - name: Exact-source selection, history guard, and release147 safe-batch SQL guard tests
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd "$GITHUB_WORKSPACE/.p07-private"
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          python3 -B -m unittest -q \
            tests.test_p07_m03_safe_batch \
            tests.test_p07_m03_trial_builder_146 \
            tests.test_p07_m03_safe_batch_terminal_ux \
            tests.test_p07_m03_resume_audit \
            tests.test_p07_m03_cloudpanel_sql_probe \
            > "$RUNNER_TEMP/p07-batch-order-tests.log" 2>&1 || {
              tail -n 50 "$RUNNER_TEMP/p07-batch-order-tests.log"
              exit 31
            }
          tail -n 3 "$RUNNER_TEMP/p07-batch-order-tests.log"
          echo BATCH_22SITE_HISTORY_UNVERIFIED_FAIL_CLOSED=PASS
          echo NINE_FILE_RELEASE147_RESUME_AUDIT_CLOSURE_UNIT=PASS
      - name: Exact Percona 8.4 source and target with Debian 13 native-client execution
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          command -v docker >/dev/null
          docker info >/dev/null
          percona='percona/percona-server:8.4.11-12'
          debian='debian:13'
          docker pull -q "$percona"
          docker pull -q "$debian"
          host_cli="$(command -v docker)"
          test -f "$host_cli"
          percona_id="$(docker image inspect "$percona" --format '{{.Id}}')"
          debian_id="$(docker image inspect "$debian" --format '{{.Id}}')"
          test -n "$percona_id" && test -n "$debian_id"
          base="p07-native-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "$base" > "$RUNNER_TEMP/p07-native-container-base"
          for side in source target; do
            docker run -d --name "$base-$side" -e MYSQL_ROOT_PASSWORD=SYNTHETIC_ci_root_2026 "$percona_id" >/dev/null
          done
          for side in source target; do
            ready=0
            for trial in $(seq 1 90); do
              if docker exec -e MYSQL_PWD=SYNTHETIC_ci_root_2026 "$base-$side" mysql --user=root --batch --skip-column-names --execute 'SELECT 1' >/dev/null 2>&1; then ready=1; break; fi
              sleep 3
            done
            test "$ready" = 1
          done
          src_version="$(docker exec -e MYSQL_PWD=SYNTHETIC_ci_root_2026 "$base-source" mysql --user=root --batch --skip-column-names --execute 'SELECT @@version, @@version_comment')"
          dst_version="$(docker exec -e MYSQL_PWD=SYNTHETIC_ci_root_2026 "$base-target" mysql --user=root --batch --skip-column-names --execute 'SELECT @@version, @@version_comment')"
          test "$src_version" = "$dst_version"
          case "$src_version" in 8.4.*Percona*) ;; *) echo P07_NOT_SAME_PERCONA84; exit 38 ;; esac
          echo P07_M03_NATIVE_SOURCE_TARGET_PERCONA84=PASS
          test -S /var/run/docker.sock
          driver="$base-debian13"
          echo "$driver" > "$RUNNER_TEMP/p07-native-driver"
          docker run --detach --name "$driver" --network bridge \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$host_cli:/usr/local/bin/docker:ro" \
            -v "$GITHUB_WORKSPACE/.p07-private:/p07-private:ro" \
            -e P07_MYSQL_NATIVE_CI=1 \
            -e P07_NATIVE_DB_ENGINE=MYSQL_8.4 \
            -e P07_NATIVE_DB_CONTAINER="$base" \
            -e PYTHONDONTWRITEBYTECODE=1 \
            "$debian_id" sleep infinity >/dev/null
          docker exec "$driver" bash -c '
            set -Eeuo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get -qq update >/dev/null
            apt-get -y -qq install --no-install-recommends python3 ca-certificates libaio1t64 libnuma1 >/dev/null
            test -x /usr/local/bin/docker
            mkdir -p -m 0700 /home/p07native/htdocs
            python3 -B -c "import sys;sys.path.insert(0, \"/p07-private/lib\");from migration_oracle_mysql84_deb import source_debian_release; assert source_debian_release() == \"13\""
          ' > "$RUNNER_TEMP/p07-debian-setup.log" 2>&1 || {
            echo P07_DEBIAN13_DRIVER_ENVIRONMENT_UNAVAILABLE
            exit 43
          }
          echo P07_M03_NATIVE_DEBIAN13_OFFICIAL_CLIENT_PATH=VERIFIED
          docker exec "$driver" /usr/local/bin/docker info >/dev/null 2>&1 || {
            if docker exec "$driver" test -S /var/run/docker.sock; then
              echo P07_DEBIAN13_DRIVER_SOCKET_PRESENT_CLI_UNAVAILABLE
            else
              echo P07_DEBIAN13_DRIVER_SOCKET_MISSING
            fi
            exit 45
          }
          docker exec "$driver" docker exec -e MYSQL_PWD=SYNTHETIC_ci_root_2026 "$base-source" \
            mysql --no-defaults --protocol=tcp --host=127.0.0.1 --user=root --default-character-set=utf8mb4 \
            --batch --raw --skip-column-names --execute 'SELECT 1' >/dev/null 2>&1 || {
            echo P07_PERCONA84_TEST_TCP_ADMIN_UNAVAILABLE; exit 46;
          }
          echo P07_M03_DEBIAN13_NESTED_DOCKER_AND_PERCONA_TCP_ACCESS=PASS
          if ! docker exec "$driver" bash -c 'cd /p07-private; python3 -B -m unittest -v tests.test_p07_m03_d04_native_restore_drill' > "$RUNNER_TEMP/p07-native-test.log" 2>&1; then
            # Only fixed exception classes/codes from synthetic test data;
            # never publish full tracebacks, dumps, private source or secrets.
            grep -E '^(test_|ERROR:|FAIL:|Ran [0-9]+ tests|FAILED|.*(OracleClientBlocked|HexExportBlocked|EvidenceBlocked|AssertionError|SYNTHETIC_DB_NATIVE_QUERY_FAILED|ORACLE_[A-Z_]+))' "$RUNNER_TEMP/p07-native-test.log" | cut -c1-220 | head -n 28 || true
            python3 -B - "$RUNNER_TEMP/p07-native-test.log" <<'PY'
            import pathlib,re,sys
            lines=pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines()
            known={'AssertionError','FileNotFoundError','PermissionError','RuntimeError',
                   'HexExportBlocked','OracleClientBlocked','DebianClientBlocked',
                   'CalledProcessError','OSError','TimeoutExpired','CloudPanelError'}
            for line in lines:
                m=re.match(r'^(?:[\w.]+\.)?([A-Za-z]+(?:Error|Blocked))(?::\s*(.+))?$',line.strip())
                if m and m.group(1) in known:
                    code=m.group(2) or ''
                    code=code if re.fullmatch(r'[A-Z0-9_]{3,110}',code) else 'DETAIL_REDACTED'
                    print('P07_NATIVE_ERROR_CLASS='+m.group(1)+' CODE='+code)
            PY
            exit 44
          fi
          grep -E '^(Ran [0-9]+ tests|OK)$' "$RUNNER_TEMP/p07-native-test.log" || true
          echo P07_M03_PERCONA84_ORACLE_DEBIAN13_NATIVE_P07_TARGET_IMPORT=PASS
          echo P07_M03_PERCONA84_EXISTING_DATABASE_NO_OVERWRITE=PASS
          echo P07_M03_PERCONA84_PARTIAL_IMPORT_NO_REPLAY=PASS
          echo P07_M03_REAL_DUAL_CLOUDPANEL_FULL_MIGRATION=NOT_RUN
          echo P07_M03_FORMAL_RELEASE=NOT_AUTHORIZED
      - name: Always erase synthetic Percona, Debian driver and private checkout
        if: always()
        shell: bash
        run: |
          set +e
          if test -f "$RUNNER_TEMP/p07-native-driver"; then
            name="$(cat "$RUNNER_TEMP/p07-native-driver")"
            case "$name" in p07-native-*-debian13) docker rm -f "$name" >/dev/null 2>&1 ;; esac
          fi
          if test -f "$RUNNER_TEMP/p07-native-container-base"; then
            base="$(cat "$RUNNER_TEMP/p07-native-container-base")"
            case "$base" in p07-native-*) docker rm -f "$base-source" "$base-target" >/dev/null 2>&1 ;; esac
          fi
          rm -f -- "$RUNNER_TEMP/p07-native-driver" "$RUNNER_TEMP/p07-native-container-base"
          rm -f -- "$RUNNER_TEMP/p07-debian-setup.log" "$RUNNER_TEMP/p07-native-test.log"
          rm -f -- "$RUNNER_TEMP/p07-batch-order-tests.log" "$RUNNER_TEMP/p07-lane-check.json" "$RUNNER_TEMP/p07-lane-audit.json"
          rm -rf -- "$GITHUB_WORKSPACE/.p07-private"
          test ! -e "$GITHUB_WORKSPACE/.p07-private"
          echo P07_M03_PERCONA84_TRANSIENT_SOURCE_AND_DRIVER_CLEANUP=PASS
