name: TEMP S01-C02 R6 Content SEO Browser Proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-s01-c02-r6-content-seo-browser.yml'

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PRODUCT_REPO: llhzx2018/vf-tools-ops
      PRODUCT_SHA: f2cdcf5f5fa7715ab38c51a48b843a5716b921df

    steps:
      - name: Checkout exact R6 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.PRODUCT_REPO }}
          ref: ${{ env.PRODUCT_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: target
          persist-credentials: false

      - name: Source contract and runtime package
        shell: bash
        run: |
          set -Eeuo pipefail
          php target/tests/s01-c02-prod-realuse-r6-content-seo-contract.php
          python3 - <<'PY'
          import re,zipfile
          from pathlib import Path
          root=Path('target'); out=Path('/tmp/vf-tools-ops-r6.zip')
          def keep(rel):
              p=rel.as_posix(); parts=p.split('/')
              if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in parts): return False
              if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',p,re.I): return False
              if '/' not in p: return p in {'vf-ops.php','uninstall.php'}
              return parts[0] in {'includes','assets','languages','config'}
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as z:
              for path in root.rglob('*'):
                  if path.is_file() and not path.is_symlink():
                      rel=path.relative_to(root)
                      if keep(rel): z.write(path,'vf-ops/'+rel.as_posix())
          PY
          unzip -tq /tmp/vf-tools-ops-r6.zip

      - name: Boot disposable WordPress
        shell: bash
        run: |
          set -Eeuo pipefail
          NET="vf-r6-${GITHUB_RUN_ID}"; DB="vf-r6-db-${GITHUB_RUN_ID}"; WP="vf-r6-wp-${GITHUB_RUN_ID}"
          PORT="$((21000 + (GITHUB_RUN_ID % 9000)))"
          cleanup(){ docker rm -f "$WP" "$DB" >/dev/null 2>&1 || true; docker network rm "$NET" >/dev/null 2>&1 || true; }
          trap cleanup EXIT; cleanup; docker network create "$NET" >/dev/null
          docker run -d --name "$DB" --network "$NET" -e MARIADB_DATABASE=vf_test -e MARIADB_USER=vf_runner -e MARIADB_PASSWORD=vf_runner_ephemeral -e MARIADB_ROOT_PASSWORD=vf_root_ephemeral mariadb:11.8.8 >/dev/null
          for i in $(seq 1 40); do docker exec "$DB" mariadb-admin ping -uroot -pvf_root_ephemeral --silent >/dev/null 2>&1 && break || sleep 2; done
          docker run -d --name "$WP" --network "$NET" -p "127.0.0.1:${PORT}:80" -e WORDPRESS_DB_HOST="$DB:3306" -e WORDPRESS_DB_USER=vf_runner -e WORDPRESS_DB_PASSWORD=vf_runner_ephemeral -e WORDPRESS_DB_NAME=vf_test wordpress:7.0.2-php8.4-apache >/dev/null
          for i in $(seq 1 40); do curl -fsS "http://127.0.0.1:${PORT}/wp-login.php" >/dev/null 2>&1 && break || sleep 2; done
          curl -fsSL https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar -o /tmp/wp-cli.phar
          docker cp /tmp/wp-cli.phar "$WP:/usr/local/bin/wp"; docker exec "$WP" chmod +x /usr/local/bin/wp
          docker cp /tmp/vf-tools-ops-r6.zip "$WP:/tmp/vf-tools-ops-r6.zip"
          BASE_URL="http://127.0.0.1:${PORT}"
          docker exec "$WP" wp core install --allow-root --path=/var/www/html --url="$BASE_URL" --title='VF R6' --admin_user=admin --admin_password='VF-R6-Proof!' --admin_email=fixture@example.invalid --skip-email >/dev/null
          docker exec "$WP" wp plugin install /tmp/vf-tools-ops-r6.zip --activate --force --allow-root --path=/var/www/html >/dev/null
          echo "VF_BASE_URL=$BASE_URL" >> "$GITHUB_ENV"; echo "VF_WP_CONTAINER=$WP" >> "$GITHUB_ENV"; echo "VF_DB_CONTAINER=$DB" >> "$GITHUB_ENV"; echo "VF_DOCKER_NETWORK=$NET" >> "$GITHUB_ENV"
          trap - EXIT

      - name: Authenticated content SEO route proof
        shell: bash
        env:
          WP_ADMIN_PASSWORD: VF-R6-Proof!
        run: |
          set -Eeuo pipefail
          cd target/.github/phase3
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.58.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cat > /tmp/r6.js <<'JS'
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:1440,height:1000}});
            const errors=[]; p.on('pageerror',e=>errors.push(String(e))); p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            const base=process.argv[2];
            await p.goto(base+'/wp-login.php'); await p.fill('#user_login','admin'); await p.fill('#user_pass',process.env.WP_ADMIN_PASSWORD);
            await Promise.all([p.waitForNavigation(),p.click('#wp-submit')]);
            const cases=[
              {name:'content',url:'/wp-admin/admin.php?page=vf-toolsite-content&tab=workflow&workspace=articles',title:'内容库',canvas:'content_articles'},
              {name:'keywords',url:'/wp-admin/admin.php?page=vf-toolsite-seo-keywords&tab=planner&workspace=keywords',title:'页面与关键词地图',canvas:'seo_keywords'},
              {name:'refine',url:'/wp-admin/admin.php?page=vf-toolsite-seo-keywords&tab=planner&workspace=refine',title:'单页精修',canvas:'seo_refine'},
              {name:'links',url:'/wp-admin/admin.php?page=vf-toolsite-seo-keywords&tab=planner&workspace=links',title:'内容集群与链接',canvas:'seo_links_redirects'}
            ];
            const out={cases:[],errors};
            for(const c of cases){
              const r=await p.goto(base+c.url,{waitUntil:'domcontentloaded'});
              const title=(await p.locator('.vf-v6-unified-pagehead h1').first().innerText()).trim();
              const canvas=await p.locator('.vf-page-canvas').first().getAttribute('data-vf-v13-route');
              const overflow=await p.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+1);
              out.cases.push({name:c.name,status:r.status(),title,canvas,overflow});
              if(r.status()>=400||title!==c.title||canvas!==c.canvas||overflow) throw new Error(JSON.stringify(out));
            }
            await p.goto(base+cases[1].url,{waitUntil:'domcontentloaded'});
            const direct=p.getByRole('link',{name:'内容集群与链接'}).last();
            if(await direct.count()<1) throw new Error('direct links workspace entry missing');
            await Promise.all([p.waitForNavigation({waitUntil:'domcontentloaded'}),direct.click()]);
            const clickedTitle=(await p.locator('.vf-v6-unified-pagehead h1').innerText()).trim();
            if(clickedTitle!=='内容集群与链接'||!p.url().includes('workspace=links')) throw new Error('direct links entry failed');
            if(errors.length) throw new Error('browser errors: '+JSON.stringify(errors));
            console.log(JSON.stringify(out,null,2));
            await b.close();
          })().catch(e=>{console.error(e);process.exit(2)});
          JS
          node /tmp/r6.js "$VF_BASE_URL"
          echo 'R6_CONTENT_SEO_BROWSER_PROOF=PASS'

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          docker rm -f "${VF_WP_CONTAINER:-}" "${VF_DB_CONTAINER:-}" >/dev/null 2>&1 || true
          docker network rm "${VF_DOCKER_NETWORK:-}" >/dev/null 2>&1 || true
