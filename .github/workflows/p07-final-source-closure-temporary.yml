name: TEMP P07 final full source gate
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-final-source-closure-temporary.yml'
permissions:
  contents: read
concurrency:
  group: temp-p07-final-source-closure-20261017
  cancel-in-progress: false
jobs:
  syntax-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Require private read
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: test -n "$PRIVATE_READ_TOKEN" || exit 78
      - name: Checkout exact P07 source privately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 20451b79c89e25e9d1969702a78767f26945e766
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: p07-private
      - name: Run tracked shell Python syntax smoke and secret scan
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p07-private rev-parse HEAD)" = '20451b79c89e25e9d1969702a78767f26945e766'
          cd p07-private
          export PYTHONPATH="$PWD/lib"
          for file in bin/vfops bin/vfops-user bin/vfops-site-ui bin/vfops-migrate-ui bin/vfops-cloudpanel-ui lib/cloudpanel_ui_common.sh lib/cloudpanel_ui_sites.sh lib/cloudpanel_ui_ops.sh lib/cloudpanel_ui_admin.sh bin/vfops-auto-backup bin/vfops-storage-setup; do
            bash -n "$file"
          done
          python3 -m compileall -q lib tests
          python3 -m json.tool VF_PROJECT.json >/dev/null
          python3 -m json.tool docs/authority/P07_INTEGRATION_MANIFEST.json >/dev/null
          log="$RUNNER_TEMP/p07-closure-checks.log"
          if timeout 420 bash tests/smoke.sh >"$log" 2>&1 && timeout 240 python3 scripts/secret_scan.py --root . >>"$log" 2>&1; then
            echo 'P07_FINAL_SYNTAX_SMOKE_SECRET_SCAN=PASS'
          else
            echo 'P07_FINAL_SYNTAX_SMOKE_SECRET_SCAN=FAIL'
            exit 1
          fi
      - name: Purge private source and outputs
        if: always()
        run: |
          rm -rf "$GITHUB_WORKSPACE/p07-private"
          rm -f "$RUNNER_TEMP/p07-closure-checks.log"
          echo 'P07_FINAL_SYNTAX_CLEANUP=PASS'
  python-tests:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 29
    steps:
      - name: Require private read
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: test -n "$PRIVATE_READ_TOKEN" || exit 78
      - name: Checkout exact P07 source privately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 20451b79c89e25e9d1969702a78767f26945e766
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: p07-private
      - name: All test modules in assigned shard
        shell: bash
        env:
          TEST_SHARD: ${{ matrix.shard }}
        run: |
          set -Eeuo pipefail
          test "$(git -C p07-private rev-parse HEAD)" = '20451b79c89e25e9d1969702a78767f26945e766'
          cd p07-private
          export PYTHONPATH="$PWD/lib"
          mapfile -t modules < <(python3 -c 'from pathlib import Path; import os; items=sorted(Path("tests").glob("test_*.py")); shard=int(os.environ["TEST_SHARD"]); print("\n".join("tests."+p.stem for i,p in enumerate(items) if i%3==shard))')
          test "${#modules[@]}" -gt 0
          echo "P07_FINAL_SHARD_${TEST_SHARD}_MODULES=${#modules[@]}"
          log="$RUNNER_TEMP/p07-final-shard-${TEST_SHARD}.log"
          if timeout --signal=TERM --kill-after=5s 1550 python3 -m unittest -q "${modules[@]}" >"$log" 2>&1; then
            echo "P07_FINAL_SHARD_${TEST_SHARD}=PASS"
            grep -E '^Ran [0-9]+ tests? in ' "$log" | tail -n1 || true
          else
            rc=$?
            echo "P07_FINAL_SHARD_${TEST_SHARD}=FAIL_${rc}"
            grep -E '^Ran [0-9]+ tests? in |^FAILED \(' "$log" | tail -n2 || true
            exit "$rc"
          fi
      - name: Purge private source and outputs
        if: always()
        shell: bash
        env:
          TEST_SHARD: ${{ matrix.shard }}
        run: |
          rm -rf "$GITHUB_WORKSPACE/p07-private"
          rm -f "$RUNNER_TEMP/p07-final-shard-${TEST_SHARD}.log"
          echo "P07_FINAL_SHARD_${TEST_SHARD}_CLEANUP=PASS"
