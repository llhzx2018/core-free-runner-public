name: TEMP S01-C02 Ops 1.21.800 Production Probe

on:
  push:
    branches:
      - temp/s01-c02-v121800-production-probe-20260903
    paths:
      - '.github/workflows/temp-s01-c02-v121800-production-probe.yml'

permissions:
  contents: read

jobs:
  production-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Read Production domain and SEO closure
        shell: bash
        run: |
          set -Eeuo pipefail
          D='https://www3.m3u8.one/wp-json/vf-ops/v1/s01-domain-authority'
          S='https://www3.m3u8.one/wp-json/vf-ops/v1/s01-seo-closure'
          DCODE="$(curl -sS --max-time 30 --retry 2 -o /tmp/domain.json -w '%{http_code}' "$D" || true)"
          SCODE="$(curl -sS --max-time 30 --retry 2 -o /tmp/seo.json -w '%{http_code}' "$S" || true)"
          echo "DOMAIN_HTTP=$DCODE"
          echo "SEO_HTTP=$SCODE"
          test "$DCODE" = 200
          test "$SCODE" = 200
          jq empty /tmp/domain.json
          jq empty /tmp/seo.json
          echo "DOMAIN=$(jq -c . /tmp/domain.json)"
          echo "SEO=$(jq -c . /tmp/seo.json)"
          DV="$(jq -r '.pluginVersion // empty' /tmp/domain.json)"
          SV="$(jq -r '.pluginVersion // empty' /tmp/seo.json)"
          test -n "$DV"; test "$DV" = "$SV"
          echo "PRODUCTION_PLUGIN_VERSION=$DV"
          echo "DOMAIN_STATUS=$(jq -r '.status' /tmp/domain.json)"
          echo "DOMAIN_AUTHORITY=$(jq -r '.authorityFinalHost' /tmp/domain.json)"
          echo "DOMAIN_CONFIGURED=$(jq -r '.configuredPublicBaseUrl' /tmp/domain.json)"
          echo "SEO_CLOSURE_STATUS=$(jq -r '.closureStatus' /tmp/seo.json)"
          echo "SEO_OWNER_ACTION_REQUIRED=$(jq -r '.ownerActionRequired' /tmp/seo.json)"
          echo "SEO_OWNER_CANDIDATE_COUNT=$(jq -r '.ownerCandidateCount' /tmp/seo.json)"
          echo 'PRODUCTION_PROBE=PASS'
