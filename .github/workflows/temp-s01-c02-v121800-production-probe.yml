name: TEMP S01-C02 Ops Production Probe

on:
  push:
    branches:
      - temp/s01-c02-v121800-production-probe-20260903
    paths:
      - '.github/workflows/temp-s01-c02-v121800-production-probe.yml'

permissions:
  contents: read

jobs:
  production-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Read Production after 1.21.801 channel publication
        shell: bash
        run: |
          set -Eeuo pipefail
          D='https://www3.m3u8.one/wp-json/vf-ops/v1/s01-domain-authority'
          S='https://www3.m3u8.one/wp-json/vf-ops/v1/s01-seo-closure'
          DCODE="$(curl -sS --max-time 30 --retry 2 --retry-delay 2 -o /tmp/domain.json -w '%{http_code}' "$D" || true)"
          SCODE="$(curl -sS --max-time 30 --retry 2 --retry-delay 2 -o /tmp/seo.json -w '%{http_code}' "$S" || true)"
          echo "DOMAIN_HTTP=$DCODE"; echo "SEO_HTTP=$SCODE"
          test "$DCODE" = 200; test "$SCODE" = 200
          jq empty /tmp/domain.json; jq empty /tmp/seo.json
          echo "DOMAIN=$(jq -c . /tmp/domain.json)"
          echo "SEO=$(jq -c . /tmp/seo.json)"
          DV="$(jq -r '.pluginVersion // empty' /tmp/domain.json)"; SV="$(jq -r '.pluginVersion // empty' /tmp/seo.json)"
          test -n "$DV"; test "$DV" = "$SV"
          jq -e '.status=="CURRENT" and .authorityFinalHost=="https://ilovem3u8.com" and .configuredPublicBaseUrl=="https://ilovem3u8.com" and .authorityMatch==true' /tmp/domain.json >/dev/null
          echo "PRODUCTION_PLUGIN_VERSION=$DV"
          echo "SEO_CLOSURE_STATUS=$(jq -r '.closureStatus' /tmp/seo.json)"
          echo "SEO_OWNER_ACTION_REQUIRED=$(jq -r '.ownerActionRequired' /tmp/seo.json)"
          echo "SEO_FORMAL_PRIMARY_COUNT=$(jq -r '.formalPrimaryCount' /tmp/seo.json)"
          echo "SEO_PLANNER_ROWS=$(jq -r '.plannerRows' /tmp/seo.json)"
          echo "SEO_GATE_STATUS=$(jq -r '.gateStatus' /tmp/seo.json)"
          echo "SEO_PREFLIGHT_STATUS=$(jq -r '.preflightStatus' /tmp/seo.json)"
          echo 'PRODUCTION_CHANNEL_PROBE=PASS'
