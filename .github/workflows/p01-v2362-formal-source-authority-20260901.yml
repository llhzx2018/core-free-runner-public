name: P01 V2.36.2 Formal Source Authority
on:
  push:
    branches: [temp/p01-v2362-formal-source-authority-20260901]
    paths: [.github/workflows/p01-v2362-formal-source-authority-20260901.yml]
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: docs/p01-v2362-formal-source-staged-20260901
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
      - name: Update exact Current Truth files
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('VF_PROJECT.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          if d.get('candidate_version')!='2.36.2': raise SystemExit('candidate version drift')
          if d.get('schema_version')!='2026082901': raise SystemExit('schema drift')
          gate=d.get('v2_36_2_candidate_gate') or {}
          if gate.get('state')!='PASS' or gate.get('candidate_readiness_run')!=33478737169: raise SystemExit('candidate gate drift')
          d['status']='V2.36.0 OWNER PRODUCTION / V2.36.1 PUBLISHED / V2.36.2 FORMAL SOURCE STAGED'
          d['working_version']='2.36.2'
          d['target_release_version']='2.36.2'
          d['current_phase']='V2.36.2 FORMAL SOURCE STAGED TO DEVELOP / PUBLICATION NOT AUTHORIZED'
          d['candidate_state']='FORMAL SOURCE STAGED TO DEVELOP / CANDIDATE + BIND GATES PASS'
          d['develop_state']='V2.36.2 FORMAL SOURCE STAGED / RELEASE PUBLICATION PENDING'
          d['formal_release_state']='V2.36.1 PUBLISHED / V2.36.2 FORMAL SOURCE READY / NOT YET RELEASED'
          d['current_authority']='Owner Production V2.36.0 / Published Latest V2.36.1 / V2.36.2 formal source staged on develop; Release publication not yet authorized'
          d['next_action']='Await explicit release authorization before any main merge, Tag, GitHub Release, core-updates write or Owner Production action. Once authorized, use the already PASSed V2.36.2 candidate evidence as release input.'
          d['v2_36_2_formal_source']={
            'state':'STAGED_TO_DEVELOP / RELEASE_NOT_PUBLISHED',
            'formal_source':'4fd25a5ce4383dc456e755fc2e031a861d6ff655',
            'formal_source_tree':'0f0e5329098ad5a87a4a72dbd368c88d7a44b339',
            'runtime_tree':'55bc3143df6ca4e8e66b3e8d3e0f01b3ec343424',
            'develop_merge_pr':172,
            'develop_merge':'4eb2a37074f643fcccedfdd78c65c525a0e0eab6',
            'candidate_readiness_run':33478737169,
            'candidate_artifact':9789120412,
            'candidate_artifact_sha256':'42c39e68648784c56cbd443258f40346966573d0da4baa0fcb6217719bf2dde3',
            'formal_bind_gate_run':33479052985,
            'formal_bind_artifact':9789217182,
            'formal_bind_artifact_sha256':'89ab141eaeced9f4e626f7905f865d6b9b38c7d7bb92d5075ebda87d0aa681a4',
            'full_zip_sha256':'2ac81cb8fba0815e006170a897017ea14ca8a6c77e41dfcfe0332f64c4604870',
            'update_zip_sha256':'8ab1a12d23ad50276e26ae773bcf97feac0bb97198ab65b3e68c93889362e121',
            'schema':'2026082901',
            'migration':None,
            'main_write':False,
            'tag_write':False,
            'github_release_write':False,
            'core_updates_write':False,
            'owner_production_write':False
          }
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          section='''<!-- P01_V2362_FORMAL_SOURCE_STAGED -->\n## V2.36.2 Formal Source 已进入 develop · 2026-09-01\n\n- 当前 Owner Production：`V2.36.0 / Schema 2026082901`；Published Latest：`V2.36.1`。\n- V2.36.2 可见登录 / 退出修复已完成 Product PR `#170` 与 Authority PR `#171`。\n- Candidate Readiness：Run `33478737169` = **PASS**；Artifact `9789120412`；Digest `sha256:42c39e68648784c56cbd443258f40346966573d0da4baa0fcb6217719bf2dde3`。\n- 已真实验证：`V2.36.1 → V2.36.2` Atomic 升级、Fresh Install、390 / 1440 登录→私人内容→退出→公开状态、SQLite/FK、数据保持与确定性制品。\n- Formal Bind Gate：Run `33479052985` = **PASS**；Artifact `9789217182`；Digest `sha256:89ab141eaeced9f4e626f7905f865d6b9b38c7d7bb92d5075ebda87d0aa681a4`。\n- Formal Source：`4fd25a5ce4383dc456e755fc2e031a861d6ff655`；Runtime Tree：`55bc3143df6ca4e8e66b3e8d3e0f01b3ec343424`。\n- Formal Source PR `#172` 已合并到 `develop`：`4eb2a37074f643fcccedfdd78c65c525a0e0eab6`。\n- 候选制品 SHA256：FULL `2ac81cb8fba0815e006170a897017ea14ca8a6c77e41dfcfe0332f64c4604870`；UPDATE `8ab1a12d23ad50276e26ae773bcf97feac0bb97198ab65b3e68c93889362e121`。\n- `main` / Tag / GitHub Release / core-updates / Owner Production：**均未写入**。\n- 当前边界：**V2.36.2 已具备正式发布输入，但尚未正式发布；需显式 Release 授权后才能继续发布链。**\n\n> 以下旧段落保留历史证据；如与本段冲突，以本段为 Current Authority。\n\n'''
          heads={
            'docs/authority/CURRENT.md':'# P01 · VF Start · Current Authority\n',
            'docs/handoff/CURRENT_STATE.md':'# CURRENT STATE · P01 VF Start\n'
          }
          for rel,title in heads.items():
            f=Path(rel); txt=f.read_text(encoding='utf-8')
            if '<!-- P01_V2362_FORMAL_SOURCE_STAGED -->' not in txt:
              if not txt.startswith(title): raise SystemExit('header drift '+rel)
              f.write_text(title+'\n'+section+txt[len(title):].lstrip('\n'),encoding='utf-8')
          ev=Path('docs/evidence/P01_SINGLE_SYSTEM_AUTH_MODEL_RESTORE_20260901.md')
          et=ev.read_text(encoding='utf-8')
          append='''\n\n## V2.36.2 Release Preparation Follow-up\n\n```text\nCandidate Readiness: 33478737169 / PASS\nCandidate Artifact: 9789120412\nCandidate Digest: sha256:42c39e68648784c56cbd443258f40346966573d0da4baa0fcb6217719bf2dde3\nFormal Source: 4fd25a5ce4383dc456e755fc2e031a861d6ff655\nRuntime Tree: 55bc3143df6ca4e8e66b3e8d3e0f01b3ec343424\nFormal Bind Gate: 33479052985 / PASS\nFormal Bind Artifact: 9789217182\nFormal Bind Digest: sha256:89ab141eaeced9f4e626f7905f865d6b9b38c7d7bb92d5075ebda87d0aa681a4\nFormal Source PR: #172 / MERGED\nDevelop merge: 4eb2a37074f643fcccedfdd78c65c525a0e0eab6\nPublished: NO\nOwner Production Write: NO\n```\n\nV2.36.2 is now a fully validated formal source on `develop`, but this evidence does **not** authorize `main`, Tag, GitHub Release, core-updates or Owner Production writes.\n'''
          if '## V2.36.2 Release Preparation Follow-up' not in et:
            ev.write_text(et.rstrip()+append+'\n',encoding='utf-8')
          PY
          python3 -m json.tool VF_PROJECT.json >/dev/null
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 4
          printf '%s\n' "${changed[@]}" | sort >/tmp/actual
          printf '%s\n' VF_PROJECT.json docs/authority/CURRENT.md docs/handoff/CURRENT_STATE.md docs/evidence/P01_SINGLE_SYSTEM_AUTH_MODEL_RESTORE_20260901.md | sort >/tmp/expected
          diff -u /tmp/expected /tmp/actual
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VF_PROJECT.json docs/authority/CURRENT.md docs/handoff/CURRENT_STATE.md docs/evidence/P01_SINGLE_SYSTEM_AUTH_MODEL_RESTORE_20260901.md
          git commit -m 'docs(P01): stage V2.36.2 formal-source truth'
          echo "AUTHORITY_SOURCE=$(git rev-parse HEAD)"
          git push origin HEAD:docs/p01-v2362-formal-source-staged-20260901
