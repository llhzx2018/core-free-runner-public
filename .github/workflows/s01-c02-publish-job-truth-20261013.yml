name: S01 Ops Publish Current ZIP Evidence Gate
on:
  push:
    branches: [task/s01-c02-publish-job-truth-20261013]
    paths: [.github/workflows/s01-c02-publish-job-truth-20261013.yml]
permissions:
  contents: read
jobs:
  zip-current-job:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Exact transient private Ops checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: b07bd7e373275a0c8daf44292b4c8c1f35043af7
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - name: Exact-source PHP lint and current ZIP evidence regression
        run: |
          set -Eeuo pipefail
          test "$(git -C private-source rev-parse HEAD)" = b07bd7e373275a0c8daf44292b4c8c1f35043af7
          php -l private-source/includes/publish-o10/publish-zip-product.php
          php -l private-source/tests/s01-c02-publish-current-job-evidence-unit.php
          php private-source/tests/s01-c02-publish-current-job-evidence-unit.php
          echo S01_C02_PUBLISH_CURRENT_JOB_EXACT_PASS
      - name: Remove transient private checkout
        if: always()
        run: rm -rf private-source
