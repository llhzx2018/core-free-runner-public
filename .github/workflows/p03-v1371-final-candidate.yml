name: P03 V1.37.1 Final Candidate Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p03-v1371-final-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  P03_REPOSITORY: llhzx2018/vf-forge
  P03_COMMIT: c7bc5216af5363b4524611595418e8e67edb55e6
  BASE_SHA: 296675dde8d2d76a48ffae603af5e911586be748
  FIXTURE_PASS: VfM-2026-Test-Fixture!
  PHP_TEST_IMAGE: vf-forge-v1371-final-php84

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact private V1.37.1 candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ env.P03_REPOSITORY }}
          ref: ${{ env.P03_COMMIT }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: p03

      - name: Exact identity and source contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p03
          test "$(git rev-parse HEAD)" = "$P03_COMMIT"
          test "$(cat VERSION)" = '1.37.1'
          test "$(cat database/schema/SCHEMA_VERSION)" = '30'
          grep -Fq "define('VFAB_VERSION', '1.37.1');" src/app/bootstrap.php
          grep -Fq "TARGET_VERSION='1.37.1'" scripts/build_atomic.py
          grep -Fq "ALLOWED_SOURCES=['1.37.0']" scripts/build_atomic.py
          grep -Fq "function sourceUrl(s){const u=String(s?.canonical_url||'')" public/assets/project-intelligence.js
          grep -Fq 'overflow-y:auto' public/assets/project-intelligence-shell.css
          python3 scripts/repo_health.py .
          python3 tests/integration/source_integrity_test.py
          python3 tests/unit/schema_contract_test.py
          python3 tests/unit/project_intelligence_contract_test.py
          python3 tests/unit/project_intelligence_mcp_contract_test.py
          python3 tests/integration/schema_sqlite_test.py
          node --check public/assets/project-intelligence.js
          find src public -type f -name '*.php' -print0 | xargs -0 -n1 php -l > "$RUNNER_TEMP/php-lint.log"
          echo "P03_V1371_EXACT_SOURCE=PASS php=$(wc -l < "$RUNNER_TEMP/php-lint.log")"

      - name: Prepare PHP 8.4 runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-zip sqlite3 zip unzip >/dev/null
          cat > "$RUNNER_TEMP/Dockerfile.p03-v1371" <<'EOF'
          FROM php:8.4-cli-bookworm
          ARG HOST_UID=1001
          ARG HOST_GID=121
          RUN apt-get update \
            && apt-get install -y --no-install-recommends libzip-dev libsqlite3-dev sqlite3 curl \
            && docker-php-ext-install pdo_sqlite zip \
            && rm -rf /var/lib/apt/lists/*
          USER ${HOST_UID}:${HOST_GID}
          EOF
          docker build --build-arg "HOST_UID=$(id -u)" --build-arg "HOST_GID=$(id -g)" -t "$PHP_TEST_IMAGE" -f "$RUNNER_TEMP/Dockerfile.p03-v1371" "$RUNNER_TEMP" >/dev/null
          docker run --rm "$PHP_TEST_IMAGE" php -r 'foreach(["pdo_sqlite","zip","fileinfo","sodium"] as $x){if(!extension_loaded($x)){fwrite(STDERR,"missing:$x\n");exit(1);}} echo "PHP84_RUNTIME=PASS\n";'

      - name: Fresh install backup restore and MCP regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p03
          cp tests/maintenance/current_reverify.sh "$RUNNER_TEMP/current-reverify-v1371.sh"
          python3 - "$RUNNER_TEMP/current-reverify-v1371.sh" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]);s=p.read_text(encoding='utf-8')
          s=s.replace("assert d['ok'] and d['version']=='1.35.0'","assert d['ok'] and d['version']=='1.37.1'",1)
          p.write_text(s,encoding='utf-8')
          PY
          bash "$RUNNER_TEMP/current-reverify-v1371.sh"
          bash tests/maintenance/project_intelligence_mcp.sh
          echo 'P03_V1371_RUNTIME_MCP_REGRESSION=PASS'

      - name: Build and verify V1.37.0 to V1.37.1 Atomic
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p03
          rm -rf "$RUNNER_TEMP/base-wt" "$RUNNER_TEMP/base-runtime" "$RUNNER_TEMP/target-runtime" "$RUNNER_TEMP/v1371-release"
          git worktree add --detach "$RUNNER_TEMP/base-wt" "$BASE_SHA" >/dev/null
          python3 "$RUNNER_TEMP/base-wt/scripts/build_runtime.py" "$RUNNER_TEMP/base-runtime" >/dev/null
          python3 scripts/build_runtime.py "$RUNNER_TEMP/target-runtime" >/dev/null
          grep -Fq "define('VFAB_VERSION', '1.37.0');" "$RUNNER_TEMP/base-runtime/app/bootstrap.php"
          grep -Fq "define('VFAB_VERSION', '1.37.1');" "$RUNNER_TEMP/target-runtime/app/bootstrap.php"
          python3 scripts/build_atomic.py --base-runtime "$RUNNER_TEMP/base-runtime" --target-runtime "$RUNNER_TEMP/target-runtime" --output "$RUNNER_TEMP/v1371-release" | tee "$RUNNER_TEMP/package.json"
          cd "$RUNNER_TEMP/v1371-release"
          sha256sum -c SHA256SUMS.txt
          unzip -t VF_Forge_V1.37.1_Atomic_Upgrade.zip
          test "$(unzip -Z1 VF_Forge_V1.37.1_Atomic_Upgrade.zip)" = 'repair-v1.37.1.php'
          grep -Fq "const VFF_ATOMIC_TARGET='1.37.1';" repair-v1.37.1.php
          grep -Fq 'const VFF_ATOMIC_ALLOWED=["1.37.0"];' repair-v1.37.1.php
          ! unzip -Z1 VF_Forge_V1.37.1_Atomic_Upgrade.zip | grep -E '(^|/)(database|PRIVATE_DATA|storage/private|uploads|backup|cache|session|logs|tmp)(/|$)|\.sqlite3?$|\.db$|(^|/)\.env$'
          echo 'P03_V1371_ATOMIC_BUILD=PASS'

      - name: Atomic success data preservation and failure rollback
        shell: bash
        env:
          V1370_RELEASE_DIR: ${{ runner.temp }}/v1371-release
          V1370_TARGET_RUNTIME: ${{ runner.temp }}/target-runtime
        run: |
          set -Eeuo pipefail
          cd p03
          cp tests/maintenance/v1370_atomic_e2e.sh "$RUNNER_TEMP/v1371-atomic-e2e.sh"
          python3 - "$RUNNER_TEMP/v1371-atomic-e2e.sh" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]);s=p.read_text(encoding='utf-8')
          s=s.replace("BASE_VERSION='1.36.2'","BASE_VERSION='1.37.0'",1)
          s=s.replace("TARGET_VERSION='1.37.0'","TARGET_VERSION='1.37.1'",1)
          s=s.replace("VF_Forge_V1.37.0_Atomic_Upgrade.zip","VF_Forge_V1.37.1_Atomic_Upgrade.zip")
          s=s.replace("repair-v1.37.0.php","repair-v1.37.1.php")
          s=s.replace("define('VFAB_VERSION', '1.36.2');","define('VFAB_VERSION', '1.37.0');")
          s=s.replace("define('VFAB_VERSION', '1.37.0');","define('VFAB_VERSION', '1.37.1');",1)
          s=s.replace("d['version']=='1.36.2'","d['version']=='1.37.0'")
          s=s.replace("V1370 Preserve Project","V1371 Preserve Project")
          s=s.replace("version']=='1.37.0'","version']=='1.37.1'")
          p.write_text(s,encoding='utf-8')
          PY
          bash -n "$RUNNER_TEMP/v1371-atomic-e2e.sh"
          BASE_SHA="$BASE_SHA" bash "$RUNNER_TEMP/v1371-atomic-e2e.sh"
          echo 'P03_V1371_ATOMIC_E2E=PASS'

      - name: Chromium owner-reported UI regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p03
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cat > final-ui.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';
          const css=['public/assets/experience.css','public/assets/project-intelligence.css','public/assets/project-intelligence-shell.css'].map(p=>fs.readFileSync(p,'utf8')).join('\n');
          const browser=await chromium.launch({headless:true});

          // Screenshot-1 regression: dense sidebar at the owner's viewport height.
          const p1=await browser.newPage({viewport:{width:1319,height:652}});
          const projects=Array.from({length:16},(_,i)=>`<button class="nav-item project-shortcut"><span>P${i+1} · Project ${i+1}</span></button>`).join('');
          await p1.setContent(`<!doctype html><style>${css}</style><div class="app-shell"><aside class="sidebar"><button class="brand"><strong>VF Forge</strong></button><nav class="primary-nav"><button class="nav-item">概览</button><button class="nav-item">项目</button><button class="nav-item">关注</button><button class="nav-item">动态</button><button class="nav-item">关系</button></nav><div class="sidebar-divider"></div><div class="sidebar-label">当前项目</div><div id="projectShortcuts">${projects}</div><div class="sidebar-spacer"></div><button class="nav-item settings-entry">设置</button><div class="runtime-card"><span>Runtime</span><strong>V1.37.1</strong></div><button class="nav-item logout-entry">退出</button></aside><main class="main-shell"></main></div>`);
          const before=await p1.evaluate(()=>{const x=document.querySelector('#projectShortcuts'),r=document.querySelector('.runtime-card').getBoundingClientRect(),n=document.querySelector('.primary-nav').getBoundingClientRect();return{client:x.clientHeight,scroll:x.scrollHeight,top:x.scrollTop,runtimeBottom:r.bottom,navTop:n.top,overflow:getComputedStyle(x).overflowY}});
          if(before.overflow!=='auto'||before.scroll<=before.client||before.runtimeBottom>innerHeight+.5) throw new Error('sidebar precondition failed '+JSON.stringify(before));
          await p1.evaluate(()=>{const x=document.querySelector('#projectShortcuts');x.scrollTop=x.scrollHeight});
          const after=await p1.evaluate(()=>{const x=document.querySelector('#projectShortcuts'),r=document.querySelector('.runtime-card').getBoundingClientRect(),n=document.querySelector('.primary-nav').getBoundingClientRect();return{top:x.scrollTop,runtimeBottom:r.bottom,navTop:n.top}});
          if(after.top<=0||after.runtimeBottom>652.5||Math.abs(after.navTop-before.navTop)>.5) throw new Error('sidebar scroll failed '+JSON.stringify(after));
          console.log('OWNER_SCREENSHOT_1_SIDEBAR=PASS',JSON.stringify({before,after}));

          // Screenshot-2 regression: project has no PRODUCTION/GITHUB Authority at all.
          const p2=await browser.newPage({viewport:{width:1319,height:652}});const errors=[];p2.on('pageerror',e=>errors.push(String(e.message||e)));
          await p2.setContent(`<!doctype html><body><div id="toast"></div><div id="app"><button data-route="overview">概览</button><button data-route="projects"><b id="navProjectCount"></b></button><button data-route="attention"><b id="navAttentionCount"></b></button><button data-route="activity">动态</button><button data-route="relations">关系</button><button data-route="search">搜索</button><button id="toolsite" data-open-project="7">VF ToolSite</button><div id="breadcrumb"></div><div id="view" tabindex="-1"></div></div></body>`);
          await p2.evaluate(()=>{const json=(body,status=200)=>Promise.resolve(new Response(JSON.stringify(body),{status,headers:{'Content-Type':'application/json'}}));window.fetch=(url)=>{const u=new URL(String(url),'http://forge.local/'),a=u.searchParams.get('action');if(a==='portfolio')return json({ok:true,data:{projects:[],attention:[],recent_activity:[]}});if(a==='project')return json({ok:true,data:{context:{project:{id:7,code:'S01',name:'VF ToolSite',description:'无 Authority 项目'},production:null,current_state:'正常项目上下文',requires_user:false,block:'',health_attention:{}},sources:[],truth:{truth:{}},decisions:[],relations:[],activity:[],declaration:{schema_version:30,lifecycle:'STABLE_OPERATIONS'}}});return json({ok:true,events:[],relations:[],results:[]})}});
          await p2.addScriptTag({path:path.resolve('public/assets/project-intelligence.js')});
          await p2.waitForTimeout(850);await p2.click('#toolsite');await p2.waitForTimeout(180);
          const state=await p2.evaluate(()=>({crumb:document.querySelector('#breadcrumb')?.textContent||'',text:document.querySelector('#view')?.textContent||'',toast:document.querySelector('#toast')?.textContent||'',cls:document.querySelector('#toast')?.className||''}));
          if(errors.length||!state.crumb.includes('VF ToolSite')||!state.text.includes('VF ToolSite')||state.text.includes('无法恢复项目上下文')||state.toast.includes('canonical_url')||state.cls.includes('error'))throw new Error('null Authority regression '+JSON.stringify({errors,state}));
          if(state.text.includes('打开 Production')||state.text.includes('GitHub ↗'))throw new Error('missing Authority link rendered');
          console.log('OWNER_SCREENSHOT_2_NULL_AUTHORITY=PASS',JSON.stringify(state));
          await browser.close();
          EOF
          node final-ui.mjs

      - name: Final V1.37.1 candidate evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/v1371-release"
          SHA=$(sha256sum VF_Forge_V1.37.1_Atomic_Upgrade.zip | awk '{print $1}')
          BYTES=$(stat -c%s VF_Forge_V1.37.1_Atomic_Upgrade.zip)
          SRC=$(python3 -c 'import json;print(json.load(open("PACKAGE_MANIFEST.json"))["source_manifest_sha256"])')
          echo 'P03_V1371_FINAL_CANDIDATE_GATE=PASS'
          echo "P03_COMMIT=$P03_COMMIT"
          echo 'FROM=1.37.0'
          echo 'TARGET=1.37.1'
          echo 'SCHEMA=30_TO_30'
          echo 'MIGRATION=NONE'
          echo 'SIDEBAR_SCROLL=PASS'
          echo 'NULL_AUTHORITY_DETAIL=PASS'
          echo 'RUNTIME_MCP_REGRESSION=PASS'
          echo 'ATOMIC_SUCCESS_ROLLBACK=PASS'
          echo "ATOMIC_SHA256=$SHA"
          echo "ATOMIC_BYTES=$BYTES"
          echo "SOURCE_MANIFEST_SHA256=$SRC"
          echo 'PRODUCTION_WRITE=NO'
