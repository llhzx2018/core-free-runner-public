name: P02 V2.5.1 Core Updates Readiness
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p02-v251-readiness.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CORE_UPDATES_REF: 22ebdc2098b8f2ae8bf8bd0421f831070701a4f7
      PRODUCT_REF: 0c1abb08456a102517badf4f0d4b3da4eff3dd4a
      RELEASE_ID: '372302737'
      UPDATE_NAME: VF_Library_V2.5.1_UPDATE.zip
      UPDATE_BYTES: '307383'
      UPDATE_SHA256: 5486b00477ed4fff08d13fef856298a4c88f73fbd9ef4d8ab81ea282279259df
    steps:
      - name: Require registered private read capability
        env: {READ_TOKEN: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN" || exit 78
          echo REGISTERED_PRIVATE_READ=PASS
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CORE_UPDATES_REF }}
          token: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'
          fetch-depth: 1
          persist-credentials: false
          path: updates
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: v2.5.1
          token: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'
          fetch-depth: 1
          persist-credentials: false
          path: product
      - name: Validate update authority identity
        run: |
          set -Eeuo pipefail
          test "$(git -C updates rev-parse HEAD)" = "$CORE_UPDATES_REF"
          test "$(git -C product rev-parse HEAD)" = "$PRODUCT_REF"
          python3 - <<'PY'
          import json,os
          m=json.load(open('updates/projects/P02.json',encoding='utf-8'))
          expected={'schema_version':'1.0','project_id':'P02','component_id':'APP','enabled':True,'current_version':'2.5.0','target_version':'2.5.1','update_type':'ATOMIC','from_versions':['2.5.0'],'schema_from':'2401','schema_to':'2401','repository':'llhzx2018/vf-library','release_tag':'v2.5.1','release_id':int(os.environ['RELEASE_ID']),'product_identity':os.environ['PRODUCT_REF'],'asset_name':os.environ['UPDATE_NAME'],'asset_bytes':int(os.environ['UPDATE_BYTES']),'asset_sha256':os.environ['UPDATE_SHA256'],'backup_required':True,'rollback_supported':True,'released_at':'2026-08-18T11:44:42Z'}
          for k,v in expected.items(): assert m.get(k)==v,(k,m.get(k),v)
          print('CORE_UPDATES_AUTHORITY=PASS')
          PY
      - name: Remote GitHub Release and update asset readback
        env: {GH_TOKEN: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'}
        run: |
          set -Eeuo pipefail
          gh release view v2.5.1 --repo llhzx2018/vf-library --json databaseId,tagName,isDraft,isPrerelease,assets > "$RUNNER_TEMP/release.json"
          python3 - "$RUNNER_TEMP/release.json" <<'PY'
          import json,os,sys
          x=json.load(open(sys.argv[1])); assert int(x['databaseId'])==int(os.environ['RELEASE_ID']); assert x['tagName']=='v2.5.1' and not x['isDraft'] and not x['isPrerelease']; assets={a['name']:a for a in x['assets']}; assert int(assets[os.environ['UPDATE_NAME']]['size'])==int(os.environ['UPDATE_BYTES']); print('REMOTE_RELEASE_METADATA=PASS')
          PY
          mkdir -p "$RUNNER_TEMP/readback"; gh release download v2.5.1 --repo llhzx2018/vf-library --pattern "$UPDATE_NAME" --dir "$RUNNER_TEMP/readback"
          test "$(stat -c %s "$RUNNER_TEMP/readback/$UPDATE_NAME")" = "$UPDATE_BYTES"
          test "$(sha256sum "$RUNNER_TEMP/readback/$UPDATE_NAME" | awk '{print $1}')" = "$UPDATE_SHA256"
          echo REMOTE_UPDATE_BYTES_SHA256=PASS
      - name: UpdateCore availability and package verification
        run: |
          set -Eeuo pipefail
          cat > "$RUNNER_TEMP/check.php" <<'PHP'
          <?php
          require getcwd().'/product/src/app/CoreUpdates/UpdateCore.php';
          $manifest=json_decode(file_get_contents(getcwd().'/updates/projects/P02.json'),true);
          $core=new \CoreUpdates\UpdateCore('P02','APP');
          $available=$core->check('2.5.0','2401',$manifest);
          $verified=$core->verifyPackage(getenv('RUNNER_TEMP').'/readback/'.getenv('UPDATE_NAME'),$manifest);
          $latest=$core->check('2.5.1','2401',$manifest);
          $wrongSchema=$core->check('2.5.0','9999',$manifest);
          echo json_encode(['available'=>$available,'verified'=>$verified,'latest'=>$latest,'wrong_schema'=>$wrongSchema],JSON_PRETTY_PRINT|JSON_UNESCAPED_UNICODE),"\n";
          if(($available['status']??'')!=='AVAILABLE')exit(2);
          if(($verified['status']??'')!=='VERIFIED')exit(3);
          if(($latest['status']??'')!=='UP_TO_DATE')exit(4);
          if(($wrongSchema['status']??'')!=='BLOCKED_SCHEMA')exit(5);
          PHP
          RUNNER_TEMP="$RUNNER_TEMP" UPDATE_NAME="$UPDATE_NAME" php "$RUNNER_TEMP/check.php"
          echo CORE_UPDATES_RUNTIME_READINESS=PASS
      - name: Public-safe readiness summary
        run: |
          echo P02=VF_LIBRARY
          echo CURRENT=2.5.0
          echo TARGET=2.5.1
          echo CORE_UPDATES_REF=$CORE_UPDATES_REF
          echo RELEASE_ID=$RELEASE_ID
          echo UPDATE_BYTES=$UPDATE_BYTES
          echo UPDATE_SHA256=$UPDATE_SHA256
          echo PRODUCTION_WRITE=NO
          echo PRIVATE_SOURCE_PERSISTED=NO
