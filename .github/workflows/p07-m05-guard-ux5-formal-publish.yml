# TEMPORARY NEVER-MERGE public-safe P07-M05 PR #365 DEV-only proof lane.
# Only this PR's exact private-source tests. No release/tag/distribution.
name: P07 M05 PR365 UX8 one-shot dev proof (never merge)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-m05-guard-ux5-formal-publish.yml'
permissions:
  contents: read
jobs:
  private-synthetic-only:
    if: github.repository == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      NO_COLOR: '1'
      P07_EXACT: 22039326d93807ec7031c9c1ffcc2068a26a1f8d
    steps:
      - name: Checkout exact private PR source, ephemeral and no persistence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 22039326d93807ec7031c9c1ffcc2068a26a1f8d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product
      - name: Verify exact source and existing M05 synthetic safety tests
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$P07_EXACT"
          cd product
          test "$(grep -E '^BUILD_ID = ' scripts/build_p07_m05_bundle.py)" = 'BUILD_ID = "0.1.0-m05-ux8-atomic-backup-guard"'
          python3 -B -m unittest discover -s tests -p 'test_p07_m05_dirty_host_guard.py' -q
          python3 -B -m unittest discover -s tests -p 'test_p07_m05_host_write_gate.py' -q
          python3 -B -m unittest discover -s tests -p 'test_p07_m05_isolated_module.py' -q
          echo P07_M05_UX8_EXACT_SYNTHETIC_SAFE_TESTS=PASS
      - name: Verify isolated M05 candidate deterministic ZIP and module contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          python3 -B scripts/check_p07_modules.py
          python3 -B scripts/check_p07_terminal_ux.py
          python3 -B scripts/build_p07_m05_bundle.py --output "$RUNNER_TEMP/p07-m05-ux8-once.zip" >/dev/null
          python3 -B scripts/build_p07_m05_bundle.py --output "$RUNNER_TEMP/p07-m05-ux8-again.zip" >/dev/null
          cmp "$RUNNER_TEMP/p07-m05-ux8-once.zip" "$RUNNER_TEMP/p07-m05-ux8-again.zip"
          python3 - "$RUNNER_TEMP/p07-m05-ux8-once.zip" <<'PY'
          import json, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              j = json.loads(z.read('p07-m05/MODULE_MANIFEST.json'))
              assert j['module_id'] == 'P07-M05'
              assert j['module_build_id'] == '0.1.0-m05-ux8-atomic-backup-guard'
              assert 'p07-m05/lib/m05_environment_guard.py' in z.namelist()
          print('P07_M05_UX8_REPRODUCIBLE_DEV_ZIP=PASS')
          PY
          echo P07_M01_M02_M03_M04_WRITES=NONE
          echo P07_PRODUCTION_RELEASE_DNS_MIGRATION=NOT_RUN
      - name: Erase private checkout and temporary package bytes
        if: always()
        shell: bash
        run: |
          rm -rf -- product
          rm -f -- "$RUNNER_TEMP/p07-m05-ux8-once.zip" "$RUNNER_TEMP/p07-m05-ux8-again.zip"
