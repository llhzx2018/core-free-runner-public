name: TEMP P01 R03 old UI synthetic browser baseline (exact old source)
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p01-startnew-r03-legacy-ui-temporary.yml
permissions:
  contents: read
jobs:
  old-ui-synthetic:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/p01-startnew-r03-legacy-ui-20261122'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout public temporary orchestration only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact old P01 source into transient isolated sandbox
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 158c3d75378c235720727fe9f29fb28e02e7b6c9
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: target
          persist-credentials: false
      - name: PHP 8.4 and SQLite for synthetic-only old install
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, mbstring, curl, json, dom, xml, zip, openssl
          coverage: none
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install isolated Chromium browser driver
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --prefix "$RUNNER_TEMP/p01-browser" playwright@1.56.1 --no-audit --no-fund >/dev/null
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/p01-browsers"
          "$RUNNER_TEMP/p01-browser/node_modules/.bin/playwright" install chromium >/dev/null
          echo P01_R03_BROWSER_DEPENDENCIES=PASS
      - name: Execute 12 owner page / 3 width synthetic UI matrix and guest checks
        shell: bash
        env:
          VF_SETUP_REQUIRE_KEY: '0'
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = 158c3d75378c235720727fe9f29fb28e02e7b6c9
          export PW_MODULE="$RUNNER_TEMP/p01-browser/node_modules/playwright"
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/p01-browsers"
          node > "$RUNNER_TEMP/p01-r03-synthetic.log" 2>&1 <<'NODE'
          'use strict';
          const assert=require('node:assert/strict'),cp=require('node:child_process'),path=require('node:path'),fs=require('node:fs'),crypto=require('node:crypto');
          const {setTimeout:pause}=require('node:timers/promises');
          const {chromium}=require(process.env.PW_MODULE);
          const root=path.resolve('target'), site=path.join(root,'src'), origin='http://127.0.0.1:18337';
          const entries=[
          ['home','home.php'],['start','start.php'],['inbox','inbox.php'],['channels','channels.php'],
          ['watch','watch.php'],['news','news.php'],['music','music-shell.php?view=home'],
          ['topics','topics.php'],['courses','courses.php'],['projects','projects.php'],['tools','tools.php'],['software','software.php']
          ];
          const script=fs.readFileSync(path.join(site,'app/WorkspaceViewCatalog.php'),'utf8');
          const b=script.slice(script.indexOf('public static function entries(bool $admin)'),script.indexOf('public static function normalizeMode('));
          const matches=[...b.matchAll(/\['mode'=>'([^']+)','label'=>'([^']+)','route'=>'([^']+)'/g)].map(m=>[m[1],m[3]]);
          assert.deepEqual(matches,entries,'Exact legacy runtime 12-entry owner catalog must match observed source');
          const catalog=fs.readFileSync(path.join(site,'app/SubsiteAdminCatalog.php'),'utf8');
          const l=catalog.slice(catalog.indexOf('function vf_subsite_admin_legacy_tasks()'));
          const oldTasks=[...l.matchAll(/'([^']+)'=>'([^']+)'/g)].map(m=>m[2]);
          assert.equal(oldTasks.length,17);
          const missing=oldTasks.filter(p=>!fs.existsSync(path.join(site,p.split('?')[0])));
          assert.deepEqual(missing,['all-resources.php?advanced=1','data-safety.php','update.php']);
          console.log('P01_R03_LEGACY_CATALOG=12_OWNER_AND_17_HISTORICAL; HISTORICAL_MISSING=3');
          const server=cp.spawn('php',['-S','127.0.0.1:18337','-t',site],{cwd:site,env:{...process.env,VF_SETUP_REQUIRE_KEY:'0'},stdio:'ignore'});
          let browser;
          async function ready(){for(let i=0;i<70;i++){try{let r=await fetch(origin+'/setup.php',{redirect:'manual'});if(r.status>0)return}catch{}await pause(300)}throw Error('isolated old-site PHP failed to start')}
          async function pageMetric(page,mode,viewport){
           const m=await page.evaluate(()=>{
             const nav=document.querySelector('[data-vf-domain-links]');
             const dialogs=document.querySelectorAll('dialog');
             const root=document.documentElement;
             return {width:window.innerWidth,scroll:root.scrollWidth,bodyScroll:document.body.scrollWidth,
               navCount:nav?nav.querySelectorAll('a').length:0,dialogs:dialogs.length,
               mode:document.body?.dataset?.vfMode||'',noindex:!!document.querySelector('meta[name=robots][content*=noindex]'),
               management:!!document.querySelector('[data-vf-local-management]')};
           });
           if(m.width !== viewport)throw Error('viewport mismatch '+mode);
           return {mode,viewport,overflow:Math.max(0,m.scroll-m.width,m.bodyScroll-m.width),nav:m.navCount,dialogs:m.dialogs,
             bodyMode:m.mode,management:m.management};
          }
          (async()=>{
           await ready();
           browser=await chromium.launch({headless:true,args:['--no-sandbox']});
           const owner=await browser.newContext({viewport:{width:1440,height:900},locale:'zh-CN'});
           await owner.route('**/*',route=>route.request().url().startsWith(origin+'/')?route.continue():route.abort());
           const page=await owner.newPage();
           const pw='Synthetic-only-'+crypto.randomBytes(14).toString('hex');
           await page.goto(origin+'/setup.php',{waitUntil:'domcontentloaded'});
           await page.locator('[name=admin_password]').fill(pw);
           await page.locator('[name=admin_password_confirm]').fill(pw);
           await page.getByRole('button',{name:'开始安装'}).click();
           await page.waitForTimeout(650);
           assert.ok(fs.existsSync(path.join(site,'app','.runtime.php')),'isolated synthetic install runtime');
           const login=await owner.request.post(origin+'/api.php?action=login',{data:{password:pw}});
           assert.equal(login.status(),200,'owner login');
           console.log('P01_R03_SYNTHETIC_OLD_INSTALL=PASS; PRIVATE_DATA=NONE');
           const table=[];
           for(const width of [1440,768,390]){
             await page.setViewportSize({width,height:860});
             for(const [mode,url] of entries){
               let result=await page.goto(origin+'/'+url,{waitUntil:'domcontentloaded',timeout:20000});
               assert.ok(result && result.status()<500,'old route 5xx '+mode);
               let m=await pageMetric(page,mode,width);
               m.status=result.status();
               m.redirect=new URL(page.url()).pathname.split('/').pop();
               table.push(m);
             }
           }
           const ok=table.filter(x=>x.status===200);
           const other=table.filter(x=>x.status!==200);
           const overflow=table.filter(x=>x.overflow>2);
           console.log('P01_R03_OWNER_BROWSER_MATRIX='+JSON.stringify({total:table.length,http200:ok.length,non200:other,
             overflowCases:overflow.map(({mode,viewport,overflow})=>({mode,viewport,overflow})),
             dialogs:[...new Set(table.map(x=>x.dialogs))],navCounts:[...new Set(table.map(x=>x.nav))]}));
           const guest=await browser.newContext({viewport:{width:390,height:844}});
           const guestPage=await guest.newPage();const guestRes=[];
           for(const [mode,url] of [['public-home','index.php'],['public-navigation','start.php'],['private-inbox','inbox.php'],
             ['private-music','music-shell.php?view=home']]){
             const result=await guestPage.goto(origin+'/'+url,{waitUntil:'domcontentloaded'});
             guestRes.push({mode,status:result.status(),redirect:new URL(guestPage.url()).pathname.split('/').pop(),
               management:await guestPage.locator('[data-vf-local-management]').count()});
           }
           console.log('P01_R03_GUEST_BROWSER_MATRIX='+JSON.stringify(guestRes));
           if(table.length!==36 || ok.length<32)throw Error('insufficient owner browser baseline: '+ok.length);
           console.log('P01_R03_BROWSER_BASELINE_CAPTURE=PASS; NEW_UI_VISUAL_PARITY=NOT_PROVEN');
          })().catch(e=>{console.log('P01_R03_BROWSER_BASELINE_CAPTURE=FAIL TYPE='+e.name+' '+String(e.message).slice(0,180));process.exitCode=1})
          .finally(async()=>{await browser?.close().catch(()=>{});server.kill('SIGTERM');});
          NODE
          grep '^P01_R03_' "$RUNNER_TEMP/p01-r03-synthetic.log" || true
      - name: Always scrub ephemeral private source, synthetic DB, browser traces and logs
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- target "$RUNNER_TEMP/p01-browser" "$RUNNER_TEMP/p01-browsers"
          rm -f "$RUNNER_TEMP/p01-r03-synthetic.log"
          test ! -e target
          echo P01_R03_PRIVATE_BROWSER_CLEANUP=PASS
