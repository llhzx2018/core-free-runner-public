name: P01 IA6 487 native operation parity batch (test-only)
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-ia6-487-operation-parity-batch-20261101.yml', 'experiments/p01-ia6-487-operation-parity-batch-20261101.mjs']
permissions:
  contents: read
jobs:
  read-only-parity:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'test(P01):')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      PRODUCT_BRANCH: feat/ia-v6-frontstage-admin-parity-system-jobs-r1
      PRODUCT_SHA: 3df793c16beb07f6c2629c7d3545a37c75a79cd4
      PRODUCT_VERSION: 2.47.487
      P01_TEST_ORIGIN: http://127.0.0.1:18621
      VF_E2E_RUNTIME_ROOT: /tmp/p01-ia6-487-parity
      VF_IA6_DISPOSABLE_ACK: IA6-487-DOMAIN-BATCH-ONLY
      P01_TEST_PASSWORD: P01Ia6SyntheticBrowser2026!
    steps:
      - name: Checkout registered public runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install isolated test runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd php-xml >/dev/null
          php -m | grep -Fx pdo_sqlite
          npm install --no-audit --no-fund --no-save playwright@1.57.0 >/dev/null
          npx playwright install chromium >/dev/null
      - name: Read exact private candidate source, never publish
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          actual="$(git ls-remote "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')"
          test "$actual" = "$PRODUCT_SHA"
          git clone -q --no-checkout "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" candidate
          git -C candidate fetch -q --depth 1 origin "$PRODUCT_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "$PRODUCT_VERSION"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "$PRODUCT_VERSION"
          echo P01_IA6_487_EXACT_SOURCE=PASS
      - name: PHP JS syntax and focused scope contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          find candidate/src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find candidate/src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          node --check candidate/tests/integration/p01_ia6_27_routes_11_tabs_browser.mjs
          (cd candidate && for t in tests/unit/p01_ia6_*.cjs; do node "$t"; done)
          echo P01_IA6_487_FOCUSED_SOURCE=PASS
      - name: Fresh synthetic localhost installation
        shell: bash
        run: |
          set -Eeuo pipefail
          root=/tmp/p01-ia6-487-parity
          rm -rf "$root"
          mkdir -p "$root"
          cp -a candidate/src/. "$root/"
          (cd "$root" && php -S 127.0.0.1:18621 -t . >/tmp/p01-ia6-487-php.log 2>&1 & echo $! >/tmp/p01-ia6-487-php.pid)
          for i in $(seq 1 35); do
            if curl -fsS -c /tmp/p01-ia6-487-cookie -b /tmp/p01-ia6-487-cookie "$P01_TEST_ORIGIN/setup.php" -o /tmp/p01-ia6-487-setup.html; then break; fi
            sleep 1
          done
          csrf="$(python3 - <<'PY'
          import re
          value=open('/tmp/p01-ia6-487-setup.html',encoding='utf-8').read()
          match=re.search(r'name="setup_csrf"\s+value="([^"]+)"',value)
          assert match
          print(match.group(1))
          PY
          )"
          curl -fsS -X POST -c /tmp/p01-ia6-487-cookie -b /tmp/p01-ia6-487-cookie "$P01_TEST_ORIGIN/setup.php" \
            --data-urlencode "setup_csrf=$csrf" \
            --data-urlencode "site_title=IA V6 Browser Isolated Fixture" \
            --data-urlencode "admin_password=$P01_TEST_PASSWORD" \
            --data-urlencode "admin_password_confirm=$P01_TEST_PASSWORD" \
            >/tmp/p01-ia6-487-installed.html
          (cd "$root" && php cli/verify.php) | grep -Fx VERIFY_PASS=YES
          echo P01_IA6_487_DISPOSABLE_INSTALL=PASS
      - name: Execute canonical category, Watch and Global action browser checks
        shell: bash
        run: |
          set -Eeuo pipefail
          # Previous exact SHA 27-route/12-tab browser already PASS; isolate the failing real action.
          node --check experiments/p01-ia6-487-operation-parity-batch-20261101.mjs
          node experiments/p01-ia6-487-operation-parity-batch-20261101.mjs
          echo P01_IA6_487_DOMAIN_ACTIONS_BROWSER=PASS

      - name: Native icon duplicate health baseline unknown-write browser coverage
        shell: bash
        run: |
          set -Eeuo pipefail
          run_one() {
            local label="$1" root="$2" port="$3" ack="$4" script="$5"
            [[ "$root" == /tmp/p01-ia6-* && "$port" =~ ^[0-9]+$ ]]
            mkdir -p "$root"
            cp -a candidate/src/. "$root/"
            php -S 127.0.0.1:"$port" -t "$root" >"/tmp/p01-ia6-batch-$port.log" 2>&1 &
            local pid=$!
            local cookie="/tmp/p01-ia6-batch-cookie-$port" setup="/tmp/p01-ia6-batch-setup-$port"
            for i in $(seq 1 45); do
              if curl -fsS -c "$cookie" -b "$cookie" "http://127.0.0.1:$port/setup.php" -o "$setup" >/dev/null 2>&1; then break; fi
              sleep 1
            done
            test -s "$setup"
            local csrf
            csrf="$(python3 - "$setup" <<'PY'
          import re,sys
          t=open(sys.argv[1],encoding="utf-8").read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',t)
          assert m
          print(m.group(1))
          PY
            )"
            curl -fsS -c "$cookie" -b "$cookie" -X POST "http://127.0.0.1:$port/setup.php" \
              --data-urlencode "setup_csrf=$csrf" --data-urlencode "site_title=IA6 isolated browser" \
              --data-urlencode "admin_password=$P01_TEST_PASSWORD" \
              --data-urlencode "admin_password_confirm=$P01_TEST_PASSWORD" \
              >/tmp/p01-ia6-batch-installed-$port
            (cd "$root" && php cli/verify.php) | grep -Fx 'VERIFY_PASS=YES'
            P01_TEST_ORIGIN="http://127.0.0.1:$port" VF_E2E_RUNTIME_ROOT="$root" \
              VF_IA6_DISPOSABLE_ACK="$ack" node "candidate/tests/integration/$script"
            kill "$pid" >/dev/null 2>&1 || true
            rm -rf "$root"
            echo "P01_IA6_BROWSER_ACTION_$label=PASS"
          }
          run_one ICON /tmp/p01-ia6-icons-20261101 19371 IA6-ICONS-SYNTHETIC-ONLY p01_ia6_icon_inline_review_browser.mjs
          run_one DUPLICATE /tmp/p01-ia6-duplicate-20261101 19372 IA6-DUPLICATE-SYNTHETIC-ONLY p01_ia6_duplicate_final_review_unknown_browser.mjs
          run_one HEALTH /tmp/p01-ia6-health-20261101 19373 IA6-HEALTH-SYNTHETIC-ONLY p01_ia6_health_queued_unknown_browser.mjs
          run_one BASELINE /tmp/p01-ia6-baseline-20261101 19374 IA6-BASELINE-SYNTHETIC-ONLY p01_ia6_baseline_unknown_dismiss_browser.mjs
      - name: Clean synthetic fixture and private checkout
        if: always()
        shell: bash
        run: |
          if test -f /tmp/p01-ia6-487-php.pid; then kill "$(cat /tmp/p01-ia6-487-php.pid)" >/dev/null 2>&1 || true; fi
          rm -rf /tmp/p01-ia6-487-parity /tmp/p01-ia6-icons-20261101 /tmp/p01-ia6-duplicate-20261101 /tmp/p01-ia6-health-20261101 /tmp/p01-ia6-baseline-20261101 candidate
          echo P01_IA6_487_CLEANUP=PASS
