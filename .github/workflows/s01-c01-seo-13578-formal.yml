name: S01-C01 seo formal release
on:
  push:
    branches: [task/s01-c01-seo-13578-formal]
permissions:
  contents: read
  actions: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_REPO: 'llhzx2018/vf-tools-theme'
      TARGET_VERSION: '1.35.78'
      TARGET_SHA: 'd5cba97885a090247c574c00b40bccf45a63d653'
      TARGET_TREE: '2f4038fa929f44cf0c71d027c69d46332c5bee7a'
      SOURCE_VERSION: '1.35.77'
      BASE_SHA: '7a60db829a1e3a4424a32720efd7dc1dcf4972f8'
      CANDIDATE_RUN: '37186384320'
      CANDIDATE_SHA: 'dda4283dc1c4a7d0a2f7fbc8352a01634cbc22c0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runner
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Reverse verify exact tested tree and rebuilt bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$CANDIDATE_RUN --jq .conclusion)" = success
          gh run download "$CANDIDATE_RUN" --repo llhzx2018/core-free-runner-public --name "s01-c01-seo-candidate-$CANDIDATE_RUN" --dir tested
          jq -e --arg sha "$CANDIDATE_SHA" --arg tree "$TARGET_TREE" --arg ver "$TARGET_VERSION" '.status=="PASS" and .source_sha==$sha and .source_tree==$tree and .version==$ver and .upgrade=="PASS" and .source_rollback=="PASS" and .wordpress_browser=="PASS" and .security_boundary=="PASS" and .frozen_shell_header_menu=="PASS" and .seo_native_cases==6 and .seo_controls=="PASS" and .seo_draft_preservation=="PASS" and .seo_form_preservation=="PASS" and .seo_persistence=="PASS" and .seo_csrf=="PASS" and .seo_revision_conflict=="PASS" and .seo_invalid_contract=="PASS" and .seo_keyboard=="PASS" and .seo_alignment=="PASS" and .seo_disclosures=="PASS" and .seo_network_failure=="PASS" and .seo_busy_lock=="PASS" and .seo_native_post=="PASS" and .seo_runtime_failure_visible=="PASS"' tested/FINAL_EVIDENCE.json >/dev/null
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          cp -a runner/lanes/s01-c01-seo-13578 lane
          python3 lane/build.py
          python3 - <<'PY'
          import json,pathlib
          tested=json.loads(pathlib.Path('tested/FINAL_EVIDENCE.json').read_text()); built=json.loads(pathlib.Path('proof/identity.json').read_text())
          for key in ['asset','asset_bytes','asset_sha256','source_tree','version']: assert tested[key]==built[key],key
          PY
      - name: Publish private formal Release and exact remote readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          ASSET="vf-tools-theme_V${TARGET_VERSION}.zip"; TAG="v$TARGET_VERSION"
          cat > /tmp/release-notes.md <<EOF
          VF Tools Theme V$TARGET_VERSION

          技术 SEO 与路由页整理为一个设置面：公开路径、页面类型与技术输出逐行对齐；标签/控件15px、说明14px，桌面40px/手机44px，保留原生下拉箭头。清除贴边、错位和正常状态摘要，系统规则与专业检查默认折叠，只读规则使用正文展示。
          恢复切换/添加路由入口，修正移除确认引用丢失，选择/新增/移除弹窗统一排版、按内容收缩并支持键盘操作。未保存时显示保存与放弃；保存中锁定编辑，失败/冲突保留输入；保存后同步权威回读字段及配置版本，放弃回到最近一次保存值。成功提示保持短小，失败只在表单顶部提示，不遮挡输入或重复显示同一错误。
          原有字段、枚举、权限/nonce、路由/Head/Robots/Sitemap/Schema处理器和升级机制保持；壳、头部、主菜单及其它页面冻结。
          Exact candidate Run: $CANDIDATE_RUN。六宽度真实隔离WordPress控件/键盘/弹窗/草稿/放弃、实际AJAX保存与重载、网络失败/并发冲突保留、非法枚举/nonce/guest拒绝、no-JS原生保存、真实运行回读失败可见，以及$SOURCE_VERSION→$TARGET_VERSION原生升级/回退/重新应用验证通过。发布前Assistant复核桌面/手机最终截图，不据此声明OWNER产品通过。
          Production由OWNER手工升级；独立Preview Runtime按SSOT为N_A，最终UX/UI待OWNER复验。
          Exact promoted source: $TARGET_SHA; tree: $TARGET_TREE。
          EOF
          if gh release view "$TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            test "$(gh api repos/$TARGET_REPO/git/ref/tags/$TAG --jq .object.sha)" = "$TARGET_SHA"
          else
            gh release create "$TAG" "proof/$ASSET" --repo "$TARGET_REPO" --target "$TARGET_SHA" --title "VF Tools Theme V$TARGET_VERSION" --notes-file /tmp/release-notes.md
          fi
          gh api "repos/$TARGET_REPO/releases/tags/$TAG" > proof/remote-release.json
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/$TAG --jq .object.sha)" = "$TARGET_SHA"
          mkdir readback
          gh release download "$TAG" --repo "$TARGET_REPO" --pattern "$ASSET" --dir readback
          cmp "proof/$ASSET" "readback/$ASSET"
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('proof'); m=json.loads((p/'identity.json').read_text());r=json.loads((p/'remote-release.json').read_text());t=json.loads(pathlib.Path('tested/FINAL_EVIDENCE.json').read_text());assert not r['draft'] and not r['prerelease'];a=[a for a in r['assets'] if a['name']==m['asset']];assert len(a)==1 and a[0]['size']==m['asset_bytes'] and a[0]['digest']=='sha256:'+m['asset_sha256'];m.update(release_id=r['id'],asset_id=a[0]['id'],released_at=r['published_at'],runtime_files=t['runtime_files'],runtime_fingerprint=t['runtime_fingerprint'],candidate_run=t['candidate_run'],formal_release='PASS',remote_readback='PASS',distribution='NOT_EXECUTED',production='NOT_EXECUTED');(p/'RELEASE_RECEIPT.json').write_text(json.dumps(m,indent=2));print(json.dumps(m))
          PY
      - name: Public-safe receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c01-seo-release-${{ github.run_id }}
          path: proof/RELEASE_RECEIPT.json
          retention-days: 30
          if-no-files-found: error
      - name: Private workspace cleanup
        if: always()
        run: rm -rf target readback proof/*.zip
