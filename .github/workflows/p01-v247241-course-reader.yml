name: P01 V2.47.241 Course Reader Proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v247241-course-reader.yml'
      - 'proof-triggers/p01-v247241-course-reader.json'

permissions:
  contents: read

jobs:
  course-reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout proof control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare PHP runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd unzip >/dev/null
          php -m | grep -Fx pdo_sqlite
          php -m | grep -Fx zip
          php -m | grep -Fx gd
          echo P01_COURSE_READER_RUNTIME=PASS

      - name: Clone exact candidate and baseline
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" candidate
          git -C candidate fetch -q origin c2ae251f56bd71b439e60bf4b4f6d0017e0d587a
          git -C candidate checkout -q --detach c2ae251f56bd71b439e60bf4b4f6d0017e0d587a
          test "$(git -C candidate rev-parse HEAD)" = "c2ae251f56bd71b439e60bf4b4f6d0017e0d587a"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.241"

          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" baseline
          git -C baseline fetch -q origin 0b6bd7212066abd5ae6938344e538f5dd977c0be
          git -C baseline checkout -q --detach 0b6bd7212066abd5ae6938344e538f5dd977c0be
          echo P01_COURSE_READER_EXACT_SOURCE=PASS

      - name: PHP syntax gate
        shell: bash
        run: |
          set -Eeuo pipefail
          files=(
            candidate/src/app/CourseLibraryPage.php
            candidate/src/app/CourseMarkdownRenderer.php
            candidate/src/app/CoursePackageStore.php
            candidate/src/app/DisasterRecovery.php
            candidate/src/course-package-upload.php
            candidate/src/course-package-file.php
          )
          for file in "${files[@]}"; do php -l "$file"; done
          echo P01_COURSE_READER_PHP_LINT=PASS

      - name: Canonical zero-debt regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate baseline --require-zero-debt | tee /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/canonical.txt
          echo P01_COURSE_READER_CANONICAL=PASS

      - name: Focused course reader and ZIP security proof
        shell: bash
        run: |
          set -Eeuo pipefail
          php candidate/tests/unit/course_markdown_reader_contract.php
          php candidate/tests/unit/course_package_security_contract.php
          php candidate/tests/integration/resource_asset_disaster_recovery_contract.php
          echo P01_COURSE_READER_FOCUSED=PASS

      - name: No release or production mutation
        shell: bash
        run: |
          echo FORMAL_RELEASE_CALLED=NO
          echo DISTRIBUTION_WRITE=NO
          echo PRODUCTION_WRITE=NO
