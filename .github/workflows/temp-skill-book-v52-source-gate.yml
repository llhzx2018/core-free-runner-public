name: TEMP skill-book V5.2 Source Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-skill-book-v52-source-gate.yml'
      - '.temp/v52/**'

permissions:
  contents: read

jobs:
  v52-source-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout temporary runner head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout live GOV-DOC main read-only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/gov-doc
          ref: main
          path: gov-read
          fetch-depth: 1

      - name: Guard canonical authority and reconstruct sealed V5.2 source
        shell: bash
        run: |
          set -euo pipefail
          GOV_BASE_SHA="$(git -C gov-read rev-parse HEAD)"
          echo "GOV_BASE_SHA=$GOV_BASE_SHA" >> "$GITHUB_ENV"
          grep -q '| skill-book | V3.5 | V4.7 CANDIDATE' gov-read/CURRENT.md
          grep -q '`V5.1` 为最新 Candidate' gov-read/CURRENT.md
          test -d gov-read/skills/skill-book/V5.1
          test ! -e gov-read/skills/skill-book/V5.2

          mkdir -p work
          cp -a gov-read/skills/skill-book/V5.1 work/V5.2
          cat .temp/v52/payload.part*.b64 | base64 -d > /tmp/v52-delta.tar.xz
          echo '8c8cf5ca484a286c21347704de9c24d7e8ea8ff411035688ae0d662d882a6e57  /tmp/v52-delta.tar.xz' | sha256sum -c -
          tar -xJf /tmp/v52-delta.tar.xz -C work/V5.2
          test "$(cat work/V5.2/VERSION)" = '5.2'
          cd work/V5.2
          sha256sum -c SHA256SUMS.txt
          test "$(find . -type f | wc -l)" -eq 79
          test "$(find . -type f -name '*.py' | wc -l)" -eq 33

      - name: Python syntax 33 of 33
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('work/V5.2')
          files=sorted(root.rglob('*.py'))
          assert len(files)==33, len(files)
          for p in files:
              compile(p.read_text(encoding='utf-8'), str(p), 'exec')
          print('PYTHON_SYNTAX_PASS=33/33')
          PY

      - name: Install pytest
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -q 'pytest>=8,<9'

      - name: Reconstructed source full regression 81 of 81
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          cd work/V5.2
          python3 -m pytest -q | tee /tmp/v52-reconstructed-pytest.log
          grep -Eq '81 passed' /tmp/v52-reconstructed-pytest.log

      - name: Rebuild deterministic Candidate and match sealed identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, zipfile
          root=Path('work/V5.2')
          sums=(root/'SHA256SUMS.txt').read_text(encoding='utf-8').splitlines()
          rels=[]
          for line in sums:
              digest, rel=line.split('  ',1)
              p=root/rel
              assert hashlib.sha256(p.read_bytes()).hexdigest()==digest, rel
              rels.append(rel)
          rels.append('SHA256SUMS.txt')
          rels=sorted(rels)
          assert len(rels)==79, len(rels)
          out=Path('/tmp/skill-book_V5.2_CANDIDATE_20260828.zip')
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_STORED) as z:
              for rel in rels:
                  pp=PurePosixPath(rel)
                  assert not pp.is_absolute() and '..' not in pp.parts
                  info=zipfile.ZipInfo('skill-book_V5.2_CANDIDATE/'+rel, date_time=(1980,1,1,0,0,0))
                  info.compress_type=zipfile.ZIP_STORED
                  info.create_system=3
                  info.external_attr=(0o100644 << 16)
                  z.writestr(info,(root/rel).read_bytes())
          data=out.read_bytes()
          sha=hashlib.sha256(data).hexdigest()
          assert len(data)==313673, len(data)
          assert sha=='28fb3d07cd77f957bd1e22730c9584f7a250f4acef8228663f71ba845942b1c7', sha
          with zipfile.ZipFile(out) as z:
              infos=z.infolist()
              assert len(infos)==79
              assert z.testzip() is None
              names=[i.filename for i in infos]
              assert names==sorted(names)
              assert len(names)==len(set(names))
              assert all(i.compress_type==zipfile.ZIP_STORED for i in infos)
              assert all(i.date_time==(1980,1,1,0,0,0) for i in infos)
              assert all((i.external_attr>>16)==0o100644 for i in infos)
              assert not any('__pycache__' in n or n.endswith('.pyc') for n in names)
          print('LOCAL_REMOTE_REBUILD_IDENTITY=MATCH')
          print('BYTES=313673')
          print('SHA256='+sha)
          PY

      - name: Checkout GOV-DOC main for staging write
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          path: gov-write
          fetch-depth: 0

      - name: Push validated source to isolated GOV staging branch
        shell: bash
        env:
          GIT_AUTHOR_NAME: VictorForge
          GIT_AUTHOR_EMAIL: llhzx2018@gmail.com
          GIT_COMMITTER_NAME: VictorForge
          GIT_COMMITTER_EMAIL: llhzx2018@gmail.com
        run: |
          set -euo pipefail
          cd gov-write
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GOV_BASE_SHA"
          test ! -e skills/skill-book/V5.2
          STAGING_BRANCH='staging/skill-book-v52-candidate-20260828'
          if git ls-remote --exit-code --heads origin "refs/heads/$STAGING_BRANCH" >/dev/null 2>&1; then
            echo 'staging branch already exists; refusing overwrite' >&2
            exit 1
          fi
          git checkout -b "$STAGING_BRANCH" "$GOV_BASE_SHA"
          cp -a ../work/V5.2 skills/skill-book/V5.2
          git add skills/skill-book/V5.2
          test "$(git diff --cached --name-only | wc -l)" -eq 79
          git commit -m 'skill-book: stage V5.2 candidate source'
          GOV_STAGING_COMMIT="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$STAGING_BRANCH"
          echo "GOV_STAGING_COMMIT=$GOV_STAGING_COMMIT" >> "$GITHUB_ENV"
          echo "GOV_STAGING_BRANCH=$STAGING_BRANCH" >> "$GITHUB_ENV"

      - name: Exact remote staging readback and full regression
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          git -C gov-write fetch origin "$GOV_STAGING_BRANCH"
          test "$(git -C gov-write rev-parse FETCH_HEAD)" = "$GOV_STAGING_COMMIT"
          git -C gov-write worktree add --detach ../gov-verify "$GOV_STAGING_COMMIT"
          cd gov-verify/skills/skill-book/V5.2
          test "$(cat VERSION)" = '5.2'
          sha256sum -c SHA256SUMS.txt
          test "$(find . -type f | wc -l)" -eq 79
          test "$(find . -type f -name '*.py' | wc -l)" -eq 33
          python3 -m pytest -q | tee /tmp/v52-staging-pytest.log
          grep -Eq '81 passed' /tmp/v52-staging-pytest.log

      - name: Exact staging deterministic identity seal
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, zipfile
          root=Path('gov-verify/skills/skill-book/V5.2')
          rels=[]
          for line in (root/'SHA256SUMS.txt').read_text(encoding='utf-8').splitlines():
              digest, rel=line.split('  ',1)
              assert hashlib.sha256((root/rel).read_bytes()).hexdigest()==digest, rel
              rels.append(rel)
          rels=sorted(rels+['SHA256SUMS.txt'])
          assert len(rels)==79
          out=Path('/tmp/skill-book_V5.2_CANDIDATE_STAGING.zip')
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_STORED) as z:
              for rel in rels:
                  info=zipfile.ZipInfo('skill-book_V5.2_CANDIDATE/'+rel,date_time=(1980,1,1,0,0,0))
                  info.compress_type=zipfile.ZIP_STORED
                  info.create_system=3
                  info.external_attr=(0o100644 << 16)
                  z.writestr(info,(root/rel).read_bytes())
          data=out.read_bytes()
          sha=hashlib.sha256(data).hexdigest()
          assert len(data)==313673
          assert sha=='28fb3d07cd77f957bd1e22730c9584f7a250f4acef8228663f71ba845942b1c7'
          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None
          print('REMOTE_STAGING_EXACT_SOURCE=PASS')
          print('REMOTE_STAGING_SHA256='+sha)
          PY

      - name: Source gate summary
        shell: bash
        run: |
          set -euo pipefail
          echo 'V5.2_SOURCE_GATE=PASS'
          echo "GOV_BASE_SHA=$GOV_BASE_SHA"
          echo "GOV_STAGING_BRANCH=$GOV_STAGING_BRANCH"
          echo "GOV_STAGING_COMMIT=$GOV_STAGING_COMMIT"
          echo 'REGRESSION=81/81 PASS reconstructed + 81/81 PASS exact remote staging'
          echo 'PYTHON_SYNTAX=33/33 PASS'
          echo 'ZIP_IDENTITY=313673 bytes / 28fb3d07cd77f957bd1e22730c9584f7a250f4acef8228663f71ba845942b1c7'
