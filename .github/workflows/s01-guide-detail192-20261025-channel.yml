name: S01 exact Theme channel contract
on:
  push:
    branches: [task/s01-guide-detail192-channel-20261025]
    paths: ['.github/workflows/s01-guide-detail192-20261025-channel.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.192
  TARGET_SHA: 63f06a94a38fb124bf67af8e81bd2e1180ba925d
  UPDATE_SHA: 1bf4da14e8317ec926ce1ce1d44f801e3688659e
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: 1bf4da14e8317ec926ce1ce1d44f801e3688659e
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: source
      - name: Channel identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-guide-detail192-20261025/channel-spec.json --input control/.github/workflows/s01-guide-detail192-20261025-channel.yml
      - name: Exact changed manifest and native protocol tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          test "$(git -C source diff --name-only e64149ae6118baf5401ddd1f32ff2ae188916f61 1bf4da14e8317ec926ce1ce1d44f801e3688659e)" = projects/S01-C01.json
          git -C source diff --exit-code e64149ae6118baf5401ddd1f32ff2ae188916f61 1bf4da14e8317ec926ce1ce1d44f801e3688659e -- projects/S01-C03.json
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PYCHANNEL'
          import json,os
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']==os.environ['TARGET_VERSION']
          assert m['asset_sha256']=='38e16a2399e860c204d6dbd7ec10378eae04bb8b94233edeb4f79ae95dce3c8a' and m['asset_bytes']==1998283
          assert m['runtime_files']==476 and '1.35.191' in m['from_versions']
          assert m['release_tag']=='v'+os.environ['TARGET_VERSION']
          print('EXACT_CHANNEL_CONTRACT_PASS')
          PYCHANNEL
      - name: Cleanup
        if: always()
        run: rm -rf source
