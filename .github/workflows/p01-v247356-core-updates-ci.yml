name: P01 V247356 Core Updates Exact-Manifest CI (Nonpublishing)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v247356-core-updates-ci.yml'
permissions:
  contents: read
jobs:
  core-updates-ci:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch exact distribution proposal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: 0aa2e635b8e625ecac3347851635e73899229eea
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Prepare compatible PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,curl,mbstring,zip
          coverage: none
      - name: Assert exact P01 distribution identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 0aa2e635b8e625ecac3347851635e73899229eea
          jq -e '.project_id=="P01" and .current_version=="2.47.355" and .target_version=="2.47.356" and .release_tag=="v2.47.356" and .product_identity=="6330ffcd368b41ad808505ef57f1faca56785a10" and .asset_bytes==2458839 and .asset_sha256=="5382c88768df95ac0d5b28ed487bd02bfc67e8c05f81b9a3d94bfef3f54b5b46" and .from_versions==["2.47.355"]' projects/P01.json >/dev/null
          echo P01_EXACT_UPDATE_MANIFEST_IDENTITY=PASS
      - name: Execute canonical manifest contract audit
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/check_manifest_contract.py | tee /tmp/p01-update-manifest-contract.json
          jq -e '.status=="PASS"' /tmp/p01-update-manifest-contract.json >/dev/null
          echo P01_UPDATE_MANIFEST_CONTRACT=PASS
      - name: Execute PHP syntax checks
        shell: bash
        run: |
          set -Eeuo pipefail
          find update-core/php -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/tmp/p01-update-php-lint.log
          test -s /tmp/p01-update-php-lint.log
          echo P01_UPDATE_PHP_SYNTAX=PASS
      - name: Execute Update Core regression
        shell: bash
        run: |
          set -Eeuo pipefail
          php update-core/php/tests/run.php | tee /tmp/p01-update-core-test.log
          echo P01_UPDATE_CORE_REGRESSION=PASS
