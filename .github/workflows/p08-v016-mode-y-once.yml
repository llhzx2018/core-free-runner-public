name: P08 v016 Mode Y one-case official issue after all exact final machine hard gates
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p08-v016-mode-y-once.yml
permissions:
  contents: read
jobs:
  issue-official-v016-once:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'release/p08-v016-mode-y-once-20261121' && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout isolated, non-merged publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Checkout P08 exact final main only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: ed96b18627cd0a63b1da20a1fd8c9b6c1808f159
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
      - name: Checkout effective GOV Mode Y
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 80ab251e15e63fc01a4e587e93054b0f6d0179a5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov
      - name: Native PHP 8.4 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: zip,curl,mbstring,pdo_mysql,pdo_sqlite,sqlite3,openssl,posix,dom,intl,fileinfo,bcmath
          coverage: none
      - name: Native Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Rebuild official exact-source PHP and Vue dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(id -u)" != 0
          test "$(git -C target rev-parse HEAD)" = ed96b18627cd0a63b1da20a1fd8c9b6c1808f159
          test "$(git -C gov rev-parse HEAD)" = 80ab251e15e63fc01a4e587e93054b0f6d0179a5
          test "$(cat target/VERSION)" = 0.1.16
          npm ci --prefix target --ignore-scripts --no-fund --no-audit
          npm run build --prefix target
          composer --working-dir=target install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress --optimize-autoloader
          python3 -B target/scripts/check_stack_contract.py --phase full --root target
          (cd target && git diff --exit-code && test -z "$(git status --porcelain --untracked-files=all)")
          echo P08_V016_MODE_Y_EXACT_PRODUCT_DEPENDENCIES=PASS
      - name: All final live proof gates then one-shot official Release and independent redownload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          P08_MODE_Y_ISSUE_ONCE: 'YES'
        run: |
          set -Eeuo pipefail
          set +x
          python3 -B runner/scripts/p08_v016_mode_y_issue_once.py
      - name: Always erase private source, preissue packages and credentials-bearing fixtures
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          rm -rf -- runner target gov "$RUNNER_TEMP/p08-v016-mode-y-official"
          test ! -e target && test ! -e gov
          echo P08_V016_MODE_Y_PRIVATE_SOURCE_AND_PACKAGE_CLEANUP=PASS
