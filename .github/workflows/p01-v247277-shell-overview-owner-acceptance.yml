name: P01 V2.47.277 Shell Overview Owner Acceptance Proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p01-v247277-shell-overview-owner-acceptance.yml"

permissions:
  contents: read

jobs:
  proof:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'proof(P01): V2.47.277 shell overview owner acceptance')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd nodejs >/dev/null

      - name: Clone exact candidate and stable
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" candidate
          git -C candidate fetch -q origin 378939f8f3c24de4d5742c3f4a814313c37c3743
          git -C candidate checkout -q --detach 378939f8f3c24de4d5742c3f4a814313c37c3743
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.277"
          git clone -q --depth 1 --branch v2.47.276 "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" stable
          echo P01_V247277_EXACT_SOURCE=PASS

      - name: Syntax and focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l candidate/src/manage.php
          php -l candidate/tests/unit/admin_overview_owner_acceptance_v247277_contract.php
          cd candidate
          php tests/unit/admin_overview_owner_acceptance_v247277_contract.php
          php tests/unit/admin_overview_ia_contract.php
          php tests/unit/admin_overview_actionable_health_contract.php
          php tests/unit/admin_overview_page1_polish_contract.php
          php tests/unit/backend_ia_round2_overview_v247270_contract.php
          php tests/unit/admin_visual_system_r4_contract.php
          php tests/unit/admin_backend_closure_contract.php
          echo P01_V247277_FOCUSED=PASS

      - name: Canonical regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate stable --require-zero-debt | tee /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/canonical.txt
          echo P01_V247277_CANONICAL=PASS

      - name: Bounded scope
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C candidate diff --name-only 95a62329dd756d0eb58c5dc3a2a3f6be1d8a2b50..378939f8f3c24de4d5742c3f4a814313c37c3743 | tee /tmp/changed.txt
          if grep -E '(^|/)(migrations|schema|auth|security|provider|server|install|setup)' /tmp/changed.txt; then
            echo "Unexpected high-risk scope"; exit 1
          fi
          grep -Fx 'src/manage.php' /tmp/changed.txt
          grep -Fx 'src/assets/admin-consolidation.css' /tmp/changed.txt
          echo OWNER_DIRECT_RELEASE_ELIGIBLE=YES
          echo PRODUCTION_WRITE=NO
