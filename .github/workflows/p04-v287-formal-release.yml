name: P04 V2.8.7 Formal Release and Channel

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p04-v287-formal-release.yml'
      - 'requests/p04-v287-formal-release-*.txt'

permissions:
  contents: read

concurrency:
  group: p04-v287-formal-release
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: llhzx2018/vf-infra
  CHANNEL_REPOSITORY: llhzx2018/core-updates
  SOURCE_COMMIT: '4bdbad4671a3409a01b4c33cbd41dfd73837b4ae'
  TARGET_VERSION: '2.8.7'
  TAG: 'v2.8.7'
  SCHEMA: '14'
  FULL_NAME: 'VF_Infra_V2.8.7_FULL.zip'
  UPDATE_NAME: 'VF_Infra_V2.8.7_UPDATE.zip'
  FULL_BYTES: '580385'
  FULL_SHA256: 'e11c966c7e570c18e9da54c7c713e4859dcf150d4059c7fe22217d3e323dd5da'
  UPDATE_BYTES: '1251974'
  UPDATE_SHA256: 'e707c5d576e51ec586111c43ca9c0fbae6fc242729d47695cdf6377c6e10d85d'

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Registered release capabilities
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN" || { echo 'VF_PRIVATE_READ_TOKEN_MISSING' >&2; exit 78; }
          test -n "$RELEASE_TOKEN" || { echo 'VF_RELEASE_WRITE_TOKEN_MISSING' >&2; exit 78; }
          echo 'REGISTERED_RELEASE_CAPABILITIES=PASS'

      - name: Checkout exact P04 release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_COMMIT }}
          token: ${{ env.READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: source

      - name: Checkout current distribution channel
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.CHANNEL_REPOSITORY }}
          ref: main
          token: ${{ env.RELEASE_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: channel

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, fileinfo, sodium, zip, curl, mbstring

      - name: Exact release input and channel preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(tr -d '\r\n' < source/VERSION)" = "$TARGET_VERSION"
          test "$(git -C source rev-parse refs/remotes/origin/main)" = "$SOURCE_COMMIT"
          test "$(git -C source rev-parse refs/remotes/origin/develop)" = "$SOURCE_COMMIT"
          jq -e '.version=="2.8.7" and .schema==14 and .release_source_contract.migration=="NONE" and .technical_baseline.provider_authority=="READ_ONLY_FIRST"' source/VF_PROJECT.json >/dev/null
          current="$(jq -r '.target_version' channel/projects/P04.json)"
          test "$current" = '2.8.6' || test "$current" = '2.8.7'
          echo "SOURCE_AND_CHANNEL_PREFLIGHT=PASS current_channel=$current"

      - name: Rebuild deterministic formal assets
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail
          rm -rf "$RUNNER_TEMP/v287-runtime-a" "$RUNNER_TEMP/v287-runtime-b" "$RUNNER_TEMP/v287-update-a" "$RUNNER_TEMP/v287-update-b" "$RUNNER_TEMP/v287-formal"
          mkdir -p "$RUNNER_TEMP/v287-formal"
          python scripts/build-release-tree.py "$RUNNER_TEMP/v287-runtime-a" >/dev/null
          python scripts/build-release-tree.py "$RUNNER_TEMP/v287-runtime-b" >/dev/null
          diff -qr "$RUNNER_TEMP/v287-runtime-a" "$RUNNER_TEMP/v287-runtime-b"
          python scripts/build-v287-update-release.py --target-runtime "$RUNNER_TEMP/v287-runtime-a" --output "$RUNNER_TEMP/v287-update-a" >/dev/null
          python scripts/build-v287-update-release.py --target-runtime "$RUNNER_TEMP/v287-runtime-a" --output "$RUNNER_TEMP/v287-update-b" >/dev/null
          cmp "$RUNNER_TEMP/v287-update-a/$UPDATE_NAME" "$RUNNER_TEMP/v287-update-b/$UPDATE_NAME"
          php "$RUNNER_TEMP/v287-update-a/repair-v2.8.7.php" --self-test | tee "$RUNNER_TEMP/v287-formal/atomic-self-test.txt"
          grep -Fq 'ATOMIC_SELF_TEST_PASS target=2.8.7 schema=14' "$RUNNER_TEMP/v287-formal/atomic-self-test.txt"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,os,zipfile
          runtime=Path(os.environ['RUNNER_TEMP'])/'v287-runtime-a'
          full=Path(os.environ['RUNNER_TEMP'])/'v287-formal'/os.environ['FULL_NAME']
          with zipfile.ZipFile(full,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9,strict_timestamps=True) as z:
              for f in sorted(x for x in runtime.rglob('*') if x.is_file()):
                  rel=f.relative_to(runtime).as_posix()
                  info=zipfile.ZipInfo(rel,date_time=(1980,1,1,0,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED; info.create_system=3; info.external_attr=(0o100644<<16)
                  z.writestr(info,f.read_bytes())
          update_src=Path(os.environ['RUNNER_TEMP'])/'v287-update-a'/os.environ['UPDATE_NAME']
          update=Path(os.environ['RUNNER_TEMP'])/'v287-formal'/os.environ['UPDATE_NAME']
          update.write_bytes(update_src.read_bytes())
          def verify(path,bytes_env,sha_env):
              assert path.stat().st_size==int(os.environ[bytes_env]),(path,path.stat().st_size)
              got=hashlib.sha256(path.read_bytes()).hexdigest()
              assert got==os.environ[sha_env],(path,got)
          verify(full,'FULL_BYTES','FULL_SHA256')
          verify(update,'UPDATE_BYTES','UPDATE_SHA256')
          print('FORMAL_ASSET_IDENTITY=PASS')
          PY

      - name: Create exact tag and GitHub Release
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C source config user.name 'VF Release Automation'
          git -C source config user.email 'release@kewaro.com'
          if git -C source show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git -C source rev-list -n1 "$TAG")" = "$SOURCE_COMMIT"
          else
            git -C source tag -a "$TAG" "$SOURCE_COMMIT" -m "VF Infra V2.8.7"
            git -C source remote set-url origin "https://x-access-token:${RELEASE_TOKEN}@github.com/${SOURCE_REPOSITORY}.git"
            git -C source push origin "refs/tags/$TAG"
          fi

          cat > "$RUNNER_TEMP/v287-formal/release-notes.md" <<'EOF'
          V2.8.7 修复服务商详情错位，补齐官方账户余额，并将已确认不续费域名从日常关注、费用预测及到期/续费提醒中移出；删除、Hold 等危险状态提醒继续保留。

          - Schema 14
          - Migration NONE
          - Provider Authority READ_ONLY_FIRST
          - Atomic UPDATE 支持 V2.7.9–V2.8.6 → V2.8.7
          EOF

          if gh release view "$TAG" --repo "$SOURCE_REPOSITORY" >/dev/null 2>&1; then
            release_json="$(gh api "repos/$SOURCE_REPOSITORY/releases/tags/$TAG")"
            test "$(jq -r '.tag_name' <<<"$release_json")" = "$TAG"
          else
            gh release create "$TAG"               "$RUNNER_TEMP/v287-formal/$FULL_NAME#$FULL_NAME"               "$RUNNER_TEMP/v287-formal/$UPDATE_NAME#$UPDATE_NAME"               --repo "$SOURCE_REPOSITORY"               --title 'VF Infra V2.8.7'               --notes-file "$RUNNER_TEMP/v287-formal/release-notes.md"               --verify-tag
          fi
          echo 'P04_V287_FORMAL_RELEASE_CREATED=PASS'

      - name: Remote asset readback
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$RUNNER_TEMP/v287-readback"
          mkdir -p "$RUNNER_TEMP/v287-readback"
          gh release download "$TAG" --repo "$SOURCE_REPOSITORY" --pattern "$FULL_NAME" --pattern "$UPDATE_NAME" --dir "$RUNNER_TEMP/v287-readback"
          FULL="$RUNNER_TEMP/v287-readback/$FULL_NAME" UPDATE="$RUNNER_TEMP/v287-readback/$UPDATE_NAME" python3 - <<'PY'
          import hashlib,os
          from pathlib import Path
          for key,bkey,skey in [('FULL','FULL_BYTES','FULL_SHA256'),('UPDATE','UPDATE_BYTES','UPDATE_SHA256')]:
              p=Path(os.environ[key])
              assert p.stat().st_size==int(os.environ[bkey]),(key,p.stat().st_size)
              assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ[skey],key
          print('REMOTE_ASSET_BYTES_SHA256=PASS')
          PY
          mkdir -p "$RUNNER_TEMP/v287-atomic-readback"
          unzip -q "$RUNNER_TEMP/v287-readback/$UPDATE_NAME" -d "$RUNNER_TEMP/v287-atomic-readback"
          php "$RUNNER_TEMP/v287-atomic-readback/repair-v2.8.7.php" --self-test | tee "$RUNNER_TEMP/v287-formal/remote-atomic-self-test.txt"
          grep -Fq 'ATOMIC_SELF_TEST_PASS target=2.8.7 schema=14' "$RUNNER_TEMP/v287-formal/remote-atomic-self-test.txt"

      - name: Publish core-updates P04 channel
        shell: bash
        run: |
          set -Eeuo pipefail
          release_json="$(gh api "repos/$SOURCE_REPOSITORY/releases/tags/$TAG")"
          export RELEASE_ID="$(jq -r '.id' <<<"$release_json")"
          export RELEASED_AT="$(jq -r '.published_at' <<<"$release_json")"
          export FULL_ASSET_ID="$(jq -r --arg n "$FULL_NAME" '.assets[]|select(.name==$n)|.id' <<<"$release_json")"
          export UPDATE_ASSET_ID="$(jq -r --arg n "$UPDATE_NAME" '.assets[]|select(.name==$n)|.id' <<<"$release_json")"
          export PRODUCT_TREE="$(git -C source rev-parse "$SOURCE_COMMIT^{tree}")"
          test -n "$RELEASE_ID" && test -n "$FULL_ASSET_ID" && test -n "$UPDATE_ASSET_ID" && test -n "$PRODUCT_TREE"

          python3 - <<'PY'
          import json,os
          from pathlib import Path
          path=Path('channel/projects/P04.json')
          current=json.loads(path.read_text(encoding='utf-8'))
          if current.get('target_version')=='2.8.7':
              assert current['release_product_commit']==os.environ['SOURCE_COMMIT']
              assert current['asset_sha256']==os.environ['UPDATE_SHA256']
              print('CORE_UPDATES_ALREADY_EXACT=PASS')
          else:
              assert current.get('target_version')=='2.8.6',current
              payload={
                'schema_version':'1.0','project_id':'P04','component_id':'APP','enabled':True,
                'target_version':'2.8.7','update_type':'ATOMIC',
                'from_versions':['2.7.9','2.8.0','2.8.1','2.8.2','2.8.3','2.8.4','2.8.5','2.8.6'],
                'schema_from':'14','schema_to':'14','repository':os.environ['SOURCE_REPOSITORY'],
                'release_tag':'v2.8.7','release_name':'VF Infra V2.8.7',
                'release_id':int(os.environ['RELEASE_ID']),
                'release_product_commit':os.environ['SOURCE_COMMIT'],
                'release_product_tree':os.environ['PRODUCT_TREE'],
                'asset_name':os.environ['UPDATE_NAME'],'asset_id':int(os.environ['UPDATE_ASSET_ID']),
                'asset_bytes':int(os.environ['UPDATE_BYTES']),'asset_sha256':os.environ['UPDATE_SHA256'],
                'backup_required':True,'rollback_supported':True,'released_at':os.environ['RELEASED_AT'],
                'minimum_php':'8.0.0',
                'notes':'V2.8.7 修复服务商详情错位，补齐官方账户余额；确认不续费域名默认退出日常关注、费用预测与到期/续费提醒，危险状态提醒继续保留。Schema 14，无 Migration；Provider 继续 READ-ONLY FIRST。'
              }
              path.write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              print('CORE_UPDATES_MANIFEST_PREPARED=PASS')
          PY

          if ! git -C channel diff --quiet -- projects/P04.json; then
            git -C channel config user.name 'VF Release Automation'
            git -C channel config user.email 'release@kewaro.com'
            git -C channel add projects/P04.json
            git -C channel commit -m 'release(P04): publish VF Infra V2.8.7'
            git -C channel remote set-url origin "https://x-access-token:${RELEASE_TOKEN}@github.com/${CHANNEL_REPOSITORY}.git"
            git -C channel push origin HEAD:main
          fi
          echo 'P04_V287_CORE_UPDATES_PUBLISHED=PASS'

      - name: Online discovery and channel readback
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL "https://raw.githubusercontent.com/$CHANNEL_REPOSITORY/main/projects/P04.json?run=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/v287-formal/P04-online.json"
          jq -e --arg sha "$SOURCE_COMMIT" --arg asset "$UPDATE_SHA256" '.target_version=="2.8.7" and .schema_from=="14" and .schema_to=="14" and .release_product_commit==$sha and .asset_sha256==$asset and .from_versions[-1]=="2.8.6" and .backup_required==true and .rollback_supported==true' "$RUNNER_TEMP/v287-formal/P04-online.json" >/dev/null
          release_json="$(gh api "repos/$SOURCE_REPOSITORY/releases/tags/$TAG")"
          test "$(jq -r '.tag_name' <<<"$release_json")" = "$TAG"
          test "$(jq -r '.assets|length' <<<"$release_json")" -ge 2
          echo 'P04_V287_ONLINE_DISCOVERY=PASS'
          echo 'PRODUCTION_WRITE=0'

      - name: Build public-safe release evidence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p public-evidence
          {
            echo 'PROJECT=P04'
            echo 'VERSION=2.8.7'
            echo "SOURCE_SHA=$SOURCE_COMMIT"
            echo 'SCHEMA=14'
            echo 'MIGRATION=NONE'
            echo "FULL_SHA256=$FULL_SHA256"
            echo "UPDATE_SHA256=$UPDATE_SHA256"
            echo 'PROVIDER_AUTHORITY=READ_ONLY_FIRST'
            echo 'PRODUCTION_WRITE=0'
            echo "JOB_STATUS=${{ job.status }}"
          } > public-evidence/P04_V287_FORMAL_RELEASE.txt

      - name: Upload public-safe release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P04-V2.8.7-FORMAL-RELEASE-EVIDENCE
          path: public-evidence/P04_V287_FORMAL_RELEASE.txt
          if-no-files-found: error
          retention-days: 30
