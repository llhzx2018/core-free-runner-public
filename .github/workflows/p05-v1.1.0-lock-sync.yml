name: P05 V1.1.0 Lock Sync Helper

on:
  push:
    branches:
      - verify/p05-v1.1.0-lock-sync-20260830
    paths:
      - '.github/workflows/p05-v1.1.0-lock-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      P05_SOURCE_SHA: 801baa4529bcf8f5e8c1692bbb1e844e42951771
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Verify private read capability
        shell: bash
        run: |
          if [ -z "$PRIVATE_READ_TOKEN" ]; then
            echo "RUNNER_INFRASTRUCTURE_BLOCK=VF_PRIVATE_READ_TOKEN_MISSING"
            exit 78
          fi

      - name: Checkout exact P05 release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.P05_SOURCE_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: source

      - name: Verify source identity
        working-directory: source
        run: test "$(git rev-parse HEAD)" = "$P05_SOURCE_SHA"

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 Node24
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Generate synchronized package lock
        working-directory: source
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import fs from 'node:fs';
          const original = JSON.parse(execFileSync('git', ['show', 'HEAD:package-lock.json'], { encoding: 'utf8' }));
          const generated = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          original.version = '1.1.0';
          original.packages[''].version = '1.1.0';
          if (generated.version !== '1.1.0' || generated.packages?.['']?.version !== '1.1.0') {
            throw new Error('LOCK_VERSION_NOT_1_1_0');
          }
          if (JSON.stringify(original) !== JSON.stringify(generated)) {
            throw new Error('LOCK_DRIFT_BEYOND_VERSION_METADATA');
          }
          console.log('P05_LOCK_SYNC=PASS');
          NODE
          git diff -- package-lock.json

      - name: Upload generated package lock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p05-v1.1.0-package-lock
          path: source/package-lock.json
          if-no-files-found: error
          retention-days: 1
