name: S01 C02 1211096 Formal Release
on:
  push:
    branches: [task/s01-c02-1211096-formal-release-20261011]
permissions:
  contents: read
  actions: read
jobs:
  formal-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_VERSION: '1.21.1096'
      TARGET_SHA: 'a4dbee1f6cdf3029c2cd8646a261b8ef05e35f0f'
      MAIN_SHA: '1378d824c7fa65e5ae416199746d7d17ed0e8511'
      TARGET_TREE: '84353117f2944ab011fad85f4f67d891baa51f1f'
      RELEASE_TAG: 'v1.21.1096'
      EXPECTED_BYTES: '3565116'
      EXPECTED_SHA: 'cc89270652c29afce736f609c4097fad8c9050559bd9cd570f344f3e2d0f3fa8'
      EXPECTED_FILES: '989'
      EXPECTED_FINGERPRINT: 'b8a107b961961d7aeee2da932f534345cb608ff65b3d98ae7e6f1968166d35db'
      RUN_ID: '38132165502'
      ARTIFACT_ID: '11700115179'
    steps:
      - name: Checkout public scoped release harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Checkout exact machine-proven private product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: a4dbee1f6cdf3029c2cd8646a261b8ef05e35f0f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Perform verified formal release and remote asset readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          bash -n runner/lanes/s01-c02-1211096/formal-release.sh
          bash runner/lanes/s01-c02-1211096/formal-release.sh
      - name: Upload only public-safe release receipt (never binary)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-1211096-formal-${{ github.run_id }}
          path: |
            proof-formal/stage.txt
            proof-formal/build.json
            proof-formal/gate-readback.json
            proof-formal/promoted-main.json
            proof-formal/release.json
            proof-formal/FINAL_FORMAL_RELEASE.json
          if-no-files-found: warn
          retention-days: 30
