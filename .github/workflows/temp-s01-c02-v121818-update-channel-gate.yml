name: TEMP S01-C02 v1.21.818 Update Channel Gate
on:
  push:
    branches: [temp/s01-c02-v121818-build-20260905]
    paths: ['.github/workflows/temp-s01-c02-v121818-update-channel-gate.yml']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact update candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: 5befa261d9c9968b71665b538123d27451e57db9
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: updates
      - name: Gate update channel
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          CORE_BASE=25b3cdda0494dff26e57f9e8a8a206cf9e6ac1a9
          CORE_SHA=5befa261d9c9968b71665b538123d27451e57db9
          OPS_SHA=2380c5cb29fbf60b3af3f99ae93ea6717dbc34dd
          OPS_TREE=b4146ed42a4f93d244e8c28b2a67c0c50091ad7b
          ASSET_NAME=vf-tools-ops_V1.21.818.zip
          ASSET_BYTES=3233896
          ASSET_SHA=ef4679d191dde5722ff4130ab56a147a775068fa27e38f0a641fa6be58e3ccc5
          RUNTIME_FP=c34775dcc578e9093a75824400d35d6f0c5b75121ea4b0918ac45520e39655c6
          test "$(git -C updates rev-parse HEAD)" = "$CORE_SHA"
          test "$(git -C updates rev-list --count "$CORE_BASE..$CORE_SHA")" = 1
          test "$(git -C updates diff --name-only "$CORE_BASE" "$CORE_SHA")" = 'projects/S01-C02.json'
          m=updates/projects/S01-C02.json
          jq -e '.target_version=="1.21.818" and .from_versions==["1.21.817"] and .release_tag=="v1.21.818" and .asset_name=="vf-tools-ops_V1.21.818.zip" and .asset_bytes==3233896 and .asset_sha256=="ef4679d191dde5722ff4130ab56a147a775068fa27e38f0a641fa6be58e3ccc5" and .schema_from=="6.0.0" and .schema_to=="6.0.0" and .physical_locator=="vf-ops/vf-ops.php" and .runtime_files==905 and .runtime_file_count==905 and .runtime_fingerprint=="c34775dcc578e9093a75824400d35d6f0c5b75121ea4b0918ac45520e39655c6" and .runtime_fingerprint_sha256=="c34775dcc578e9093a75824400d35d6f0c5b75121ea4b0918ac45520e39655c6" and .released_at=="2026-09-05T08:29:57Z"' "$m" >/dev/null
          core_main=$(gh api repos/llhzx2018/core-updates/branches/main --jq '.commit.sha')
          test "$core_main" = "$CORE_BASE"
          rel=$(gh api repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.818)
          test "$(jq -r '.target_commitish' <<<"$rel")" = "$OPS_SHA"
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.size' <<<"$rel")" = "$ASSET_BYTES"
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.digest' <<<"$rel")" = "sha256:$ASSET_SHA"
          test "$(gh api repos/llhzx2018/vf-tools-ops/branches/main --jq '.commit.sha')" = "$OPS_SHA"
          test "$(gh api repos/llhzx2018/vf-tools-ops/branches/develop --jq '.commit.sha')" = "$OPS_SHA"
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/commits/$OPS_SHA --jq '.tree.sha')" = "$OPS_TREE"
          prod=$(curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-domain-authority')
          test "$(jq -r '.pluginVersion' <<<"$prod")" = '1.21.817'
          test "$(jq -r '.status' <<<"$prod")" = 'CURRENT'
          test "$(jq -r '.authorityFinalHost' <<<"$prod")" = 'https://ilovem3u8.com'
          test "$(jq -r '.authorityMatch' <<<"$prod")" = 'true'
          echo FORMAL_RELEASE_ASSET=PASS
          echo DIRECT_PRODUCTION_1_21_817_ONLY=PASS
          echo PASS_V121818_UPDATE_CHANNEL_GATE
