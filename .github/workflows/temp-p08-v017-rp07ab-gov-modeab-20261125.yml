name: TEMP P08 v017 GOV Mode AB and project RP07AB current rule equivalence
on:
  pull_request:
    paths:
      - .github/workflows/temp-p08-v017-rp07ab-gov-modeab-20261125.yml
permissions:
  contents: read
concurrency:
  group: temp-p08-v017-rp07ab-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  official-gov-contract-negative-regression:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/p08-v017-rule-pair-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BASE_SHA: e57edc475b44df7d682c857703dabc3d75fc8193
      HEAD_SHA: 05021e94b3bc598a7d856ae0f16891b73edaa195
      PR_BODY: |-
        PUBLIC_AUTHORITY_IMPACT: REVIEWED_NO_CHANGE
        AFFECTED_DOMAINS: NONE
        IMPACT_REASON: P08 v017 Mode AB changes human preview timing only. All 13 canonical Public Authority domains and their machine-release hard gates remain unchanged; no public body/trigger changed.
        Owner approval is single case PR114 code-only and previous v016 source remains immutable.
    steps:
      - name: Source exact active GOV-DOC proposed authority under runtime-only secret
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 05021e94b3bc598a7d856ae0f16891b73edaa195
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: gov-proof
      - name: Run exact native GOV-DOC job's 29 python checks
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd gov-proof
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse "$BASE_SHA")" = "$BASE_SHA"
          echo "P08_AB_GOV_NATIVE_EQUIVALENT_STEP_01=START"
          python3 -B governance/agent/takeover_context_budget_lint.py
          echo "P08_AB_GOV_NATIVE_EQUIVALENT_STEP_02=START"
          python3 -B -m unittest discover -s governance/agent -p 'test_takeover_context_budget_lint.py' -v
          echo "P08_AB_GOV_NATIVE_EQUIVALENT_STEP_03=START"
          python3 -B governance/public-authority/tools/public_authority_router_lint.py
          echo "P08_AB_GOV_NATIVE_EQUIVALENT_STEP_04=START"
          python3 -B governance/public-authority/tools/public_authority_skill_bridge_lint.py
          echo "P08_AB_GOV_NATIVE_EQUIVALENT_STEP_05=START"
          python3 -B -m unittest discover -s governance/public-authority/tools -p 'test_public_authority_skill_bridge_lint.py' -v
          echo "P08_AB_GOV_NATIVE_EQUIVALENT_STEP_06=START"
          python3 -B governance/catalog/tools/doc_structure_lint.py
          echo "P08_AB_GOV_NATIVE_EQUIVALENT_STEP_07=START"
          python3 -B -m unittest discover -s governance/catalog/tools -p 'test_doc_structure_lint.py' -v
          echo "P08_AB_GOV_NATIVE_EQUIVALENT_STEP_08=START"
          python3 -B governance/public-authority/tools/current_dependency_lint.py
          echo "P08_AB_GOV_NATIVE_EQUIVALENT_STEP_09=START"
          python3 -B -m unittest discover -s governance/public-authority/tools -p 'test_current_dependency_lint.py' -v
          echo "P08_AB_GOV_NATIVE_EQUIVALENT_STEP_10=START"
          python3 -B -m unittest discover -s governance/public-authority/tools -p 'test_public_authority_router_lint.py' -v
          echo "P08_AB_GOV_NATIVE_EQUIVALENT_STEP_11=START"
          python3 -B governance/public-authority/tools/current_dependency_lint.py --git-base "$BASE_SHA" --git-head "$HEAD_SHA"
          echo "P08_AB_GOV_NATIVE_EQUIVALENT_STEP_12=START"
          python3 -B -m unittest discover -s governance/public-authority/tests -p 'test_task_delivery_contract_lint.py' -v
          echo "P08_AB_GOV_NATIVE_EQUIVALENT_STEP_13=START"
          python3 -B -m unittest discover -s governance/public-authority/tests -p 'test_first_release_upgrade_evidence.py' -v
          echo "P08_AB_GOV_NATIVE_EQUIVALENT_STEP_14=START"
          python3 -B -m unittest discover -s governance/public-authority/tests -p 'test_task_rule_read_order_lint.py' -v
          echo "P08_AB_GOV_NATIVE_EQUIVALENT_STEP_15=START"
          python3 -B -m unittest discover -s governance/agent -p 'test_task_scope_action_lint.py' -v
          echo "P08_AB_GOV_NATIVE_EQUIVALENT_STEP_16=START"
          python3 -B -m unittest discover -s governance/agent -p 'test_module_boundary_lint.py' -v
          echo "P08_AB_GOV_NATIVE_EQUIVALENT_STEP_17=START"
          python3 -B -m unittest discover -s governance/agent -p 'test_code_architecture_lint.py' -v
          echo "P08_AB_GOV_NATIVE_EQUIVALENT_STEP_18=START"
          python3 -B -m unittest discover -s governance/agent -p 'test_project_evolvability_gate.py' -v
          echo "P08_AB_GOV_NATIVE_EQUIVALENT_STEP_19=START"
          python3 -B -m unittest discover -s governance/agent -p 'test_repository_entry.py' -v
          echo "P08_AB_GOV_NATIVE_EQUIVALENT_STEP_20=START"
          python3 -B -m unittest discover -s governance/agent -p 'test_portfolio_coverage_gate.py' -v
          echo "P08_AB_GOV_NATIVE_EQUIVALENT_STEP_21=START"
          python3 -B -m unittest discover -s governance/agent -p 'test_repository_source_adoption_gate.py' -v
          echo "P08_AB_GOV_NATIVE_EQUIVALENT_STEP_22=START"
          python3 -B -m unittest discover -s governance/agent -p 'test_project_test_install_receipt_gate.py' -v
          echo "P08_AB_GOV_NATIVE_EQUIVALENT_STEP_23=START"
          python3 -B -m unittest discover -s governance/agent -p 'test_test_reuse_growth_gate.py' -v
          echo "P08_AB_GOV_NATIVE_EQUIVALENT_STEP_24=START"
          python3 -B governance/public-authority/tools/system_install_upgrade_contract_lint.py
          echo "P08_AB_GOV_NATIVE_EQUIVALENT_STEP_25=START"
          python3 -B -m unittest discover -s governance/public-authority/tools -p 'test_system_install_upgrade_contract_lint.py' -v
          echo "P08_AB_GOV_NATIVE_EQUIVALENT_STEP_26=START"
          python3 -B governance/public-authority/tools/global_closure_lint.py
          echo "P08_AB_GOV_NATIVE_EQUIVALENT_STEP_27=START"
          python3 -B governance/public-authority/tools/global_closure_lint.py --resolve-trigger bootstrap
          echo "P08_AB_GOV_NATIVE_EQUIVALENT_STEP_28=START"
          python3 -B -m unittest discover -s governance/public-authority/tools -p 'test_global_closure_lint.py' -v
          echo "P08_AB_GOV_NATIVE_EQUIVALENT_STEP_29=START"
          python3 -B governance/public-authority/tools/global_closure_lint.py --git-base "$BASE_SHA" --git-head "$HEAD_SHA"
          echo P08_MODE_AB_GOV_29_EXACT_NATIVE_CONTRACT_STEPS=PASS
      - name: Isolated GOV checkout cleanup
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- gov-proof
          test ! -e gov-proof
          echo P08_MODE_AB_GOV_PRIVATE_CHECKOUT_CLEANUP=PASS
  p08-project-project-authority-scope:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/p08-v017-rule-pair-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Exact P08 RP07AB docs-only scoped checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 6910b1dd20584f0fd3b1ea66bc03707c4903de77
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: p08-proof
      - name: Verify separate-main-only RP07AB no code or VERSION changes, pair and all safety strings
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd p08-proof
          test "$(git rev-parse HEAD)" = "6910b1dd20584f0fd3b1ea66bc03707c4903de77"
          test "$(cat VERSION)" = "0.1.16"
          git diff --name-only 462e3dbb52ad122073ee3a614414263ffe5c2b02 HEAD > "$RUNNER_TEMP/p08-modeab-files.log"
          python3 - <<'PY'
          from pathlib import Path
          import re
          required = {"AGENTS.md", "docs/authority/CURRENT.md", "docs/authority/ACCEPTANCE_MATRIX.md"}
          observed = set(Path(__import__("os").environ["RUNNER_TEMP"],"p08-modeab-files.log").read_text().splitlines())
          assert observed == required, "P08_AB_UNAUTHORIZED_CODE_OR_SCHEMA_DIFF"
          for file in required:
              data = Path(file).read_text()
              for token in ["RP-07AB","Mode AB","V3.27", "0.1.17", "0.1.16", "7ed1bf09655ea3b2a5c2d720bc73435e70c6a3ff","POST_RELEASE_REQUIRED_NOT_PASS","SIGKILL","13"]:
                  assert token in data, "P08_AB_AUTHORITY_REQUIRED_TOKEN_MISSING"
              assert data.index("RP-07AB") < data.index("RP-07AA"), "P08_AB_AUTHORITY_ORDER_INVALID"
          assert "0.1.17" not in Path("VERSION").read_text(), "P08_AB_UPGRADED_MAIN_UNAUTHORIZED"
          print("P08_MODE_AB_PROJECT_MAIN_RULE_DOCS_ONLY_AND_TRUTHFUL=PASS")
          PY
      - name: Delete private app source and any evidence after verification
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- p08-proof
          rm -f -- "$RUNNER_TEMP/p08-modeab-files.log"
          test ! -e p08-proof
          echo P08_MODE_AB_P08_PRIVATE_CHECKOUT_CLEANUP=PASS
