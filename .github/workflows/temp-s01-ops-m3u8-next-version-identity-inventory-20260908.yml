name: temp-s01-ops-m3u8-next-version-identity-inventory-20260908
on:
  push:
    branches: [temp/s01-page-update-center-v4-20260907]
    paths: [.github/workflows/temp-s01-ops-m3u8-next-version-identity-inventory-20260908.yml]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      OPS_HEAD: 63ca3d9094ca13d3eead74cf28aa470827b5831d
      M3U8_HEAD: 3ad5754dd8f9ea80eb72fab1961d629fe4cfe628
    steps:
      - name: Exact version identity inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/ops-id /tmp/m3u8-id
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-tools-ops.git" /tmp/ops-id
          git -C /tmp/ops-id checkout -q "$OPS_HEAD"
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-tools-m3u8.git" /tmp/m3u8-id
          git -C /tmp/m3u8-id checkout -q "$M3U8_HEAD"
          echo '=== OPS 1.21.859 LIVE REFERENCES ==='
          cd /tmp/ops-id
          grep -RIl --exclude-dir=.git --exclude-dir=vendor --exclude-dir=node_modules --exclude='*.md' --exclude='*.json' --exclude='*.lock' '1\.21\.859' . | sort
          echo '=== OPS VERSION-LIKE DEFINITIONS ==='
          grep -RInE --include='*.php' --exclude-dir=.git "Version: 1\.21\.859|VF_OPS_VERSION[^\n]*1\.21\.859|=== '1\.21\.859'|== '1\.21\.859'|data-vf-dashboard-product" . | head -n 120 || true
          echo '=== M3U8 1.25.30 LIVE REFERENCES ==='
          cd /tmp/m3u8-id
          grep -RIl --exclude-dir=.git --exclude-dir=vendor --exclude-dir=node_modules --exclude='*.md' --exclude='*.json' --exclude='*.lock' '1\.25\.30' . | sort
          echo '=== M3U8 VERSION-LIKE DEFINITIONS ==='
          grep -RInE --include='*.php' --exclude-dir=.git "Version: 1\.25\.30|VF_TOOL_M3U8_VERSION[^\n]*1\.25\.30|=== '1\.25\.30'|== '1\.25\.30|1\.25\.30'" . | head -n 180 || true
          echo 'PASS_S01_NEXT_VERSION_IDENTITY_INVENTORY'
