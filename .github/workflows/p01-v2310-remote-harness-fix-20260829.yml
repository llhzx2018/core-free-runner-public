name: P01 V2.31 Remote Harness Privacy Fix
on:
  push:
    branches: [task/p01-v2310-formal-release-20260829]
    paths: [.github/workflows/p01-v2310-remote-harness-fix-20260829.yml]
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
      - name: Exact one-clause harness correction
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/task/p01-v2310-formal-release-20260829)"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/p01-v2310-remote-final.sh')
          s=p.read_text()
          old="await box.uncheck();await box.dispatchEvent('change');await p.waitForTimeout(50);const pubTruth=await hint.evaluate(el=>({text:el.textContent||'',private:el.classList.contains('private')}));if(pubTruth.private||!pubTruth.text.includes('有效可见：公开'))throw Error('public semantic '+JSON.stringify(pubTruth));"
          new="const cat=form.locator('select[name=\"category_id\"]');await cat.selectOption({label:'公开导航'});await box.uncheck();await box.dispatchEvent('change');await p.waitForTimeout(80);const pubTruth=await hint.evaluate(el=>({text:el.textContent||'',private:el.classList.contains('private')}));if(pubTruth.private||!pubTruth.text.includes('有效可见：公开'))throw Error('public semantic '+JSON.stringify(pubTruth));"
          if s.count(old)!=1:
              raise SystemExit('privacy harness anchor mismatch')
          p.write_text(s.replace(old,new,1))
          PY
          test "$(git diff --name-only)" = scripts/p01-v2310-remote-final.sh
          grep -F "selectOption({label:'公开导航'})" scripts/p01-v2310-remote-final.sh >/dev/null
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add scripts/p01-v2310-remote-final.sh
          git commit -m 'test(P01): honor category privacy inheritance in V2.31 remote gate'
          git push origin HEAD:task/p01-v2310-formal-release-20260829
