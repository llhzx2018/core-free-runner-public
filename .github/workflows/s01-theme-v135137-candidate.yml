name: S01-C01 1.35.137 exact Guides candidate WP upgrade gate
on:
  push:
    branches: [task/s01-frontend-design-20261017]
    paths: ['.github/workflows/s01-theme-v135137-candidate.yml']
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: e9608d0c5a9ce88252c0275a9d6031132f683063
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
          fetch-depth: 0
      - name: Exact candidate identity version-only delta and package build
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = e9608d0c5a9ce88252c0275a9d6031132f683063
          test "$(cat target/VERSION)" = 1.35.137
          grep -q '^Version: 1.35.137$' target/src/style.css
          python3 - <<'PY'
          import subprocess
          changed=subprocess.check_output(['git','-C','target','diff','--name-only','5eab60b767f6d8cb171c092830023a35e400fa86','HEAD'],text=True).splitlines()
          assert sorted(changed)==['VERSION','src/style.css'],changed
          print('ONLY_VERSION_CHANGED_AFTER_DESKTOP_BROWSER_QA=PASS')
          PY
          find target/src -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
          python3 - <<'PY'
          import pathlib,zipfile,hashlib,json
          root=pathlib.Path('target/src');out=pathlib.Path('vf-tools-theme_V1.35.137.zip')
          fs=sorted(p for p in root.rglob('*') if p.is_file())
          assert len(fs)==476,len(fs)
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
            for p in fs:
              i=zipfile.ZipInfo('vf-tools-theme/'+p.relative_to(root).as_posix(),date_time=(1980,1,1,0,0,0))
              i.compress_type=zipfile.ZIP_DEFLATED
              i.external_attr=(p.stat().st_mode & 0o777)<<16
              z.writestr(i,p.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          with zipfile.ZipFile(out) as z:
            assert z.testzip() is None
            assert 'Version: 1.35.137' in z.read('vf-tools-theme/style.css').decode()
            assert b'S01 Guides directory desktop legibility' in z.read('vf-tools-theme/assets/css/public/vf-theme-public-runtime.css')
          print('CANDIDATE_ZIP_SHA256='+hashlib.sha256(out.read_bytes()).hexdigest())
          print('CANDIDATE_ZIP_BYTES='+str(out.stat().st_size))
          PY
      - name: Retrieve exact previous private release
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh release download v1.35.136 --repo llhzx2018/vf-tools-theme --pattern vf-tools-theme_V1.35.136.zip
          echo '12be51d1b5cac6139194b16b7833e2457d17e8c2dbba235720ad6a2830e1ca3c  vf-tools-theme_V1.35.136.zip' | sha256sum -c
      - name: Real isolated WP install upgrade rollback and preservation
        run: |
          set -Eeuo pipefail
          docker run -d --name s01-c135-db -e MARIADB_ROOT_PASSWORD=synthetic -e MARIADB_DATABASE=wordpress -e MARIADB_USER=wp -e MARIADB_PASSWORD=synthetic mariadb:11.8.8 >/dev/null
          docker run -d --name s01-c135-wp --link s01-c135-db:db -e WORDPRESS_DB_HOST=db -e WORDPRESS_DB_USER=wp -e WORDPRESS_DB_PASSWORD=synthetic -e WORDPRESS_DB_NAME=wordpress wordpress:7.1.2-php8.3-apache >/dev/null
          for i in $(seq 1 80); do docker exec s01-c135-db mariadb-admin ping -uroot -psynthetic --silent >/dev/null 2>&1 && break; sleep 2; done
          curl -fsSLo wp.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          docker cp wp.phar s01-c135-wp:/usr/local/bin/wp
          docker cp vf-tools-theme_V1.35.136.zip s01-c135-wp:/tmp/old.zip
          docker cp vf-tools-theme_V1.35.137.zip s01-c135-wp:/tmp/new.zip
          cli(){ docker exec --user www-data s01-c135-wp php /usr/local/bin/wp "$@" --path=/var/www/html; }
          for i in $(seq 1 80); do docker exec s01-c135-wp test -f /var/www/html/wp-settings.php && break; sleep 2; done
          cli core install --url=http://example.test --title=Synthetic --admin_user=admin --admin_password=synthetic-only --admin_email=test@example.invalid --skip-email >/dev/null
          cli theme install /tmp/old.zip --activate >/dev/null
          test "$(cli theme get vf-tools-theme --field=version)" = '1.35.136'
          cli option update s01_135_preserve 'unchanged test content' >/dev/null
          cli theme install /tmp/new.zip --force >/dev/null
          test "$(cli theme get vf-tools-theme --field=version)" = '1.35.137'
          test "$(cli option get s01_135_preserve)" = 'unchanged test content'
          cli theme install /tmp/old.zip --force >/dev/null
          test "$(cli theme get vf-tools-theme --field=version)" = '1.35.136'
          cli theme install /tmp/new.zip --force >/dev/null
          test "$(cli theme get vf-tools-theme --field=version)" = '1.35.137'
          test "$(cli option get s01_135_preserve)" = 'unchanged test content'
          echo 'REAL_WP_136_TO_137_ROLLBACK_REAPPLY_PRESERVE=PASS'
      - name: Remove private transient source ZIPs and containers
        if: always()
        run: |
          docker rm -f s01-c135-wp s01-c135-db >/dev/null 2>&1 || true
          rm -rf target vf-tools-theme_V1.35.136.zip vf-tools-theme_V1.35.137.zip wp.phar
