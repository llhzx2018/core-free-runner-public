name: TEMP P01 V22119 Smoke Observer
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-p01-v22119-smoke-observer.yml']
permissions:
  contents: write
  actions: read
jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          sleep 3
          gh api -X GET repos/llhzx2018/core-free-runner-public/actions/workflows/temp-p01-v22119-ui-smoke-run.yml/runs -f branch=main -f per_page=5 >/tmp/runs.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/runs.json'));runs=[{k:r.get(k) for k in ['id','status','conclusion','run_attempt','head_sha','created_at','updated_at']} for r in x.get('workflow_runs',[])[:5]]
          open('/tmp/out.json','w').write(json.dumps({'schema':'vf-public-runner-observation/v1','project_id':'P01','target_version':'2.21.19','gate':'UI_SMOKE_OBSERVER','query_rc':0,'query_error':'','runs':runs},indent=2)+'\n')
          PY
          git clone -q --depth 1 --branch vf-agent-operations-v1 https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/core-free-runner-public.git out
          mkdir -p out/vf-agent/results;cp /tmp/out.json out/vf-agent/results/P01-V2.21.19-UI-SMOKE-OBSERVER.json
          git -C out config user.name VictorForge;git -C out config user.email llhzx2018@gmail.com;git -C out add vf-agent/results/P01-V2.21.19-UI-SMOKE-OBSERVER.json;git -C out commit -q -m 'evidence(P01): observe V2.21.19 UI smoke';git -C out pull -q --rebase origin vf-agent-operations-v1;git -C out push -q origin HEAD:vf-agent-operations-v1
# observer refresh 4
