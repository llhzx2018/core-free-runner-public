name: P01 Channel Feedback UX Exact Source 1598
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-feedback-ux-1598.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3,pdo_sqlite
          coverage: none
      - name: Validate exact P01 source contract
        shell: bash
        env:
          TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$TOKEN"
          ROOT="$RUNNER_TEMP/p01-feedback-1598"
          git clone -q --no-checkout "https://x-access-token:${TOKEN}@github.com/llhzx2018/vf-start.git" "$ROOT"
          git -C "$ROOT" checkout -q --detach b8e2f23b9815c5700d5bf5b00c90c632d4aab7fd
          git -C "$ROOT" remote set-url origin https://github.com/llhzx2018/vf-start.git
          test "$(git -C "$ROOT" rev-parse HEAD)" = b8e2f23b9815c5700d5bf5b00c90c632d4aab7fd
          php -l "$ROOT/src/app/ChannelLibraryPage.php"
          node --check "$ROOT/src/assets/workspace.js"
          php "$ROOT/tests/unit/channels_nonblocking_feedback_contract.php"
          php "$ROOT/tests/unit/channels_directory_trash_action_contract.php"
          php "$ROOT/tests/unit/channels_owner_video_manual_sync_native.php"
          php -l "$ROOT/src/app/YouTubeManualUpdates.php"
          node --check "$ROOT/src/assets/channel-youtube-updates.js"
          node tests/integration/channels_upstream_warning_node.js
          node tests/integration/youtube_batch_sequential_node.js
          node tests/integration/youtube_video_reader_sync_node.js
          echo P01_CHANNEL_FEEDBACK_SOURCE_AND_NODE_PASS
          echo "P01_TEST_ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Install synthetic instance
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$P01_TEST_ROOT/src"
          php -S 127.0.0.1:18621 -t . > "$P01_TEST_ROOT/php.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS -c "$P01_TEST_ROOT/cookies" -b "$P01_TEST_ROOT/cookies" http://127.0.0.1:18621/setup.php -o "$P01_TEST_ROOT/setup.html"; then break; fi
            sleep 1
          done
          CSRF=$(sed -n 's/.*name="setup_csrf" value="\([^"]*\)".*/\1/p' "$P01_TEST_ROOT/setup.html" | head -1)
          test -n "$CSRF"
          curl -fsS -b "$P01_TEST_ROOT/cookies" -c "$P01_TEST_ROOT/cookies" -X POST http://127.0.0.1:18621/setup.php --data-urlencode "setup_csrf=$CSRF" --data-urlencode "site_title=VF Test" --data-urlencode "admin_password=IsolatedAudit2026" --data-urlencode "admin_password_confirm=IsolatedAudit2026" -o "$P01_TEST_ROOT/installed.html"
          test -f app/.runtime.php
          cd "$P01_TEST_ROOT"
          P01_SYNTHETIC_PAGINATION=YES php tests/integration/p01_populated_pagination_fixture.php
          echo P01_ISOLATED_CHANNEL_DATA_READY
      - name: Chromium browser inline undo and upstream state UI
        shell: bash
        env:
          P01_TEST_ORIGIN: http://127.0.0.1:18621
          P01_TEST_PASSWORD: IsolatedAudit2026
        run: |
          set -Eeuo pipefail
          cd "$P01_TEST_ROOT"
          npm install --no-save --ignore-scripts --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
          node tests/integration/channels_undo_inline_browser.mjs
          echo P01_CHANNEL_NONBLOCKING_BROWSER_PASS
      - name: Remove synthetic installation
        if: always()
        run: |
          if [ -n "${P01_TEST_ROOT:-}" ]; then rm -rf "$P01_TEST_ROOT"; fi
