name: TEMP P01 V2.47.104 UI exact gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p01-v247104-ui-exact-gate.yml'

permissions:
  contents: read

jobs:
  exact-ui-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      CANDIDATE_SHA: d0b8915bd042f7a45d5d223bc06a0d539878d9e0
      BASELINE_SHA: cb3013232c0530028101a73a9d77eb8dfb7b9eed
      VERSION: 2.47.104
    steps:
      - name: Checkout verification control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare PHP runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd >/dev/null
          php -m | grep -Fx pdo_sqlite
          php -m | grep -Fx sqlite3
          echo P01_UI_RUNTIME=PASS

      - name: Resolve exact candidate and baseline
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          rm -rf /tmp/p01-ui-candidate /tmp/p01-ui-baseline
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" /tmp/p01-ui-candidate
          git -C /tmp/p01-ui-candidate fetch -q --depth 1 origin "$CANDIDATE_SHA"
          git -C /tmp/p01-ui-candidate checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/p01-ui-candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(tr -d '\r\n ' < /tmp/p01-ui-candidate/VERSION)" = "$VERSION"
          test "$(tr -d '\r\n ' < /tmp/p01-ui-candidate/src/VERSION.txt)" = "$VERSION"

          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" /tmp/p01-ui-baseline
          git -C /tmp/p01-ui-baseline fetch -q --depth 1 origin "$BASELINE_SHA"
          git -C /tmp/p01-ui-baseline checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/p01-ui-baseline rev-parse HEAD)" = "$BASELINE_SHA"
          echo P01_UI_EXACT_SOURCE=PASS

      - name: PHP syntax and mature-layer binding
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/p01-ui-candidate
          php -l src/app/FunctionalHome.php >/dev/null
          php -l src/app/FunctionalWorkspace.php >/dev/null
          php -l src/app/SubjectPageChrome.php >/dev/null
          php -l src/index.php >/dev/null
          php -l src/app/bootstrap.php >/dev/null
          php tests/unit/frontend_mature_product_v247104_contract.php | tee /tmp/p01-ui-mature.txt
          grep -Fx 'P01_FRONTEND_MATURE_PRODUCT_V247104=PASS' /tmp/p01-ui-mature.txt
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/assets/frontend-mature.css').read_text(encoding='utf-8')
          depth=0
          for c in s:
              if c=='{': depth+=1
              elif c=='}': depth-=1
              if depth<0: raise SystemExit('CSS_BRACE_UNDERFLOW')
          if depth!=0: raise SystemExit('CSS_BRACE_UNBALANCED')
          print('P01_FRONTEND_MATURE_CSS_STRUCTURE=PASS')
          PY

      - name: Canonical zero-debt regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/p01-ui-candidate
          bash tests/canonical_release_regression.sh /tmp/p01-ui-candidate /tmp/p01-ui-baseline --require-zero-debt | tee /tmp/p01-ui-canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/p01-ui-canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/p01-ui-canonical.txt
          echo P01_V247104_UI_EXACT_GATE=PASS

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf /tmp/p01-ui-candidate /tmp/p01-ui-baseline /tmp/p01-ui-mature.txt /tmp/p01-ui-canonical.txt
