name: TEMP P08 R43 real issued v016 FULL native independent clone to 018
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p08-r43-issued-real-native-clone-20261125.yml'
permissions:
  contents: read
concurrency:
  group: p08-r43-issued-clone-native-20261125
  cancel-in-progress: false
env:
  TARGET_REPO: llhzx2018/vf-adops
  TARGET_SHA: 7b9f06a31ed605a7ea3230c87b807941a99f7765
  TARGET_VERSION: '0.1.18'
jobs:
  identity-preflight:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/p08-r43-issued-real-native-clone-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact project and lane metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ephemeral_lane_spec.py audit-rendered --spec specs/ephemeral/p08-r43-issued-real-native-clone-20261125.json --input .github/workflows/temp-p08-r43-issued-real-native-clone-20261125.yml
          echo P08_R43_ISSUED_OWNER_SOURCE_PREFLIGHT=PASS
  genuine-issued-v016-owner-native-clone:
    needs: identity-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        engine: [mariadb]
    services:
      sql:
        image: ${{ matrix.engine == 'mariadb' && 'mariadb:11.8' || 'mysql:8.4' }}
        env:
          MYSQL_ROOT_PASSWORD: 'p08_r43_disposable_only_2026'
          MYSQL_DATABASE: p08_r43_issued_main
        ports:
          - 3306:3306
        options: >-
          --health-cmd="sh -c 'mariadb-admin ping --silent || mysqladmin ping --silent'"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      P08_R43_ENGINE: ${{ matrix.engine }}
      GITHUB_ACTIONS: 'true'
      CI: 'true'
      P08_R43_DISPOSABLE_SCHEMA: 'YES'
      P08_R43_ISSUED_OLD_CLIENT: 'YES'
      P08_TEST_BASE_URL: https://127.0.0.1:18443
      APP_URL: https://127.0.0.1:18443
      DB_HOST: '127.0.0.1'
      DB_PASSWORD: 'p08_r43_disposable_only_2026'
    steps:
      - name: Exact transient private P08 candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 7b9f06a31ed605a7ea3230c87b807941a99f7765
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: private-p08
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_sqlite, sqlite3, pdo_mysql, zip, mbstring, intl, bcmath, dom, fileinfo, pcntl
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build exact dev runtime without publishing a release
        shell: bash
        working-directory: private-p08
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(cat VERSION)" = "$TARGET_VERSION"
          php -l tests/native/r43_issued_full_owner_install.php > /dev/null
          php -l src/Upgrade/R43Issued016OwnerBridgeAdmission.php > /dev/null
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          composer install --no-scripts --no-interaction --no-progress --prefer-dist > "$RUNNER_TEMP/p08-r43-old-composer.log" 2>&1 || { echo P08_R43_OLD_RUNTIME_COMPOSER=FAIL; exit 1; }
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-r43-old-npm.log" 2>&1 || { echo P08_R43_OLD_RUNTIME_NPM=FAIL; exit 1; }
          npm run build > "$RUNNER_TEMP/p08-r43-old-vite.log" 2>&1 || { echo P08_R43_OLD_RUNTIME_VITE=FAIL; exit 1; }
          echo P08_R43_EXACT_DEV_BUILD_FOR_CANDIDATE=PASS
      - name: Fetch unmodified official issued 0.1.16 FULL by GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          mkdir -p "$RUNNER_TEMP/p08-r43-issued"
          gh release download v0.1.16 --repo llhzx2018/vf-adops --pattern 'VF_AdOps_V0.1.16_FULL.zip' --dir "$RUNNER_TEMP/p08-r43-issued" > "$RUNNER_TEMP/p08-r43-release-reader.log" 2>&1 || { echo P08_R43_ISSUED_ZIP_DOWNLOAD=NOT_PROVEN; exit 1; }
          test "$(sha256sum "$RUNNER_TEMP/p08-r43-issued/VF_AdOps_V0.1.16_FULL.zip" | cut -d' ' -f1)" = '7f6a3050db060448df391f0dc5a8a3a2de45c9f28a704cb76606694b82bd084f' || { echo P08_R43_ISSUED_FULL_SHA=FAIL; exit 1; }
          echo P08_R43_GENUINE_OFFICIAL_016_FULL_BYTES=PASS
      - name: Build and cross-check unshippable schema-changing v018 dev ZIP
        working-directory: private-p08
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          python3 scripts/build_s9_r43_schema_dev_archive.py --source . --issued-full "$RUNNER_TEMP/p08-r43-issued/VF_AdOps_V0.1.16_FULL.zip" --output "$RUNNER_TEMP/p08-r43-dev-one.zip" --target-sha "$TARGET_SHA" > "$RUNNER_TEMP/p08-r43-dev-build.log" 2>&1 || { echo P08_R43_OLD_CLIENT_DEV_ZIP_BUILD=FAIL; exit 1; }
          unzip -p "$RUNNER_TEMP/p08-r43-dev-one.zip" ATOMIC_MANIFEST.json | python3 -c 'import json,sys; m=json.load(sys.stdin); assert m["can_upgrade"] is False and m["schema_changes"] is True and m["type"]=="P08_SCHEMA_CHANGING_DEV_NOT_INSTALLABLE_V1"'
          echo P08_R43_NON_INSTALLABLE_018_SCHEMA_ZIP=VERIFIED
      - name: Run AUTHENTIC issued v016 Owner first install and code-only refusal
        working-directory: private-p08
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          site="$RUNNER_TEMP/p08-r43-issued-v016-site"
          test ! -e "$site"
          mkdir -m 700 "$site"
          unzip -q "$RUNNER_TEMP/p08-r43-issued/VF_AdOps_V0.1.16_FULL.zip" -d "$site"
          php tests/native/r43_issued_full_owner_install.php "$site" "$RUNNER_TEMP/p08-r43-dev-one.zip" "$TARGET_SHA" > "$RUNNER_TEMP/p08-r43-old-install-raw.log" 2>&1 || { echo P08_R43_ISSUED_OLD_OWNER_AND_ADMISSION=FAIL; exit 1; }
          grep -x 'P08_R43_AUTHENTIC_ISSUED_V016_FULL_OWNER_INSTALL=PASS' "$RUNNER_TEMP/p08-r43-old-install-raw.log" >/dev/null
          grep -x 'P08_R43_ISSUED_V016_15_DDL_OWNER_AND_LANDING=PASS' "$RUNNER_TEMP/p08-r43-old-install-raw.log" >/dev/null
          grep -x 'P08_R43_REAL_ISSUED_V016_PHP_REFUSES_V018_SCHEMA_ZIP=PASS' "$RUNNER_TEMP/p08-r43-old-install-raw.log" >/dev/null
          grep -x 'P08_R43_ORIGINAL_OLD_INSTALL_SOURCE_AND_DATA_UNTOUCHED=PASS' "$RUNNER_TEMP/p08-r43-old-install-raw.log" >/dev/null
          grep -x 'P08_R43_REAL_INSTALLED_016_OWNER_TO_018_BRIDGE_AUDIT=PASS_READ_ONLY' "$RUNNER_TEMP/p08-r43-old-install-raw.log" >/dev/null
          grep -x 'P08_R43_ISSUED_SCHEMA_BRIDGE_WRONG_OWNER_PASSWORD_REFUSED=PASS' "$RUNNER_TEMP/p08-r43-old-install-raw.log" >/dev/null
          grep -x 'P08_R43_UNTRUSTED_018_SOURCE_ADMISSION_REFUSED=PASS' "$RUNNER_TEMP/p08-r43-old-install-raw.log" >/dev/null
          echo P08_R43_GENUINE_ISSUED_OWNER_CI_BRIDGE_READ_ONLY=PASS
          echo P08_R43_REAL_V016_INSTALLED_OWNER_AND_OLD_PHP_ADMISSION=PASS
      - name: Prepare only disposable native SQL backup and import client
        if: matrix.engine != 'sqlite'
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq > "$RUNNER_TEMP/p08-r43-sql-client.log" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mariadb-client >> "$RUNNER_TEMP/p08-r43-sql-client.log" 2>&1
          command -v mariadb && command -v mariadb-dump
          echo P08_R43_NATIVE_SQL_RESTORE_CLIENT=PASS
      - name: Real published-v016 Owner native DB and private snapshot into isolated clone; source-pinned 8-DDL
        shell: bash
        working-directory: private-p08
        run: |
          set -Eeuo pipefail
          set +x
          php -l tests/native/r43_issued_full_owner_cloned_data.php > /dev/null
          bash -n tests/native/r43_rehearse_genuine_full_clone.sh
          if bash tests/native/r43_rehearse_genuine_full_clone.sh > "$RUNNER_TEMP/p08-r43-genuine-native-clone-run.log" 2>&1; then
            grep '^P08_R43_' "$RUNNER_TEMP/p08-r43-genuine-native-clone-run.log" | tail -13
            echo P08_R43_GENUINE_016_NATIVE_OLD_DATA_CLONE_3DB=PASS_NOT_INSTALLABLE
          else
            grep -E '^P08_R43_ISSUED_CLONE=FAIL_[A-Z0-9_]+$' "$RUNNER_TEMP/p08-r43-genuine-native-clone-run.log" | tail -2 || true
            if [ -f "$RUNNER_TEMP/p08-r43-clone-before.log" ]; then
              grep -oE 'R43_AUTHENTIC_CLONE_[A-Z0-9_]+' "$RUNNER_TEMP/p08-r43-clone-before.log" | head -3 || true
            fi
            echo P08_R43_GENUINE_016_NATIVE_OLD_DATA_CLONE_3DB=FAIL
            exit 1
          fi
      - name: Destroy all synthetic old sites, source, ZIPs, credentials
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- private-p08
          rm -rf -- "$RUNNER_TEMP"/p08-r43-*
          test ! -e private-p08
          echo P08_R43_OLD_ISSUED_PRIVATE_SOURCE_AND_SITE_CLEANUP=PASS
