name: S01 Theme 1.35.24 Formal Release

on:
  push:
    paths:
      - '.github/workflows/s01-theme-13524-formal-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formal-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_REPO: llhzx2018/vf-tools-theme
      TARGET_SHA: da88d874793a6459d5d3687266b1238f8bfa62df
      TARGET_VERSION: 1.35.24
      TARGET_TAG: v1.35.24
      ASSET_NAME: vf-tools-theme_V1.35.24.zip
    steps:
      - name: Checkout exact main release source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: da88d874793a6459d5d3687266b1238f8bfa62df
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product

      - name: Verify exact source and release contract
        shell: bash
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "$TARGET_VERSION"
          grep -F "Version: $TARGET_VERSION" src/style.css
          grep -F 'V1.35.24_S01_REFERENCE_FIRST_TECHNICAL_SEO_PREVIEW' src/style.css
          php tests/seo-reference-prototype-v3-contract.php
          echo PASS_FORMAL_SOURCE_IDENTITY

      - name: Build deterministic package twice
        shell: bash
        working-directory: product
        run: |
          set -Eeuo pipefail
          TMP="${RUNNER_TEMP}/s01-theme-13524"
          rm -rf "$TMP"
          mkdir -p "$TMP/root/vf-tools-theme" "$TMP/build1" "$TMP/build2"
          cp -a src/. "$TMP/root/vf-tools-theme/"
          python3 - "$TMP/root/vf-tools-theme" "$TMP/build1/$ASSET_NAME" "$TMP/build2/$ASSET_NAME" <<'PY'
          import pathlib,sys,zipfile,hashlib
          root=pathlib.Path(sys.argv[1])
          outputs=[pathlib.Path(sys.argv[2]),pathlib.Path(sys.argv[3])]
          files=sorted(p for p in root.rglob('*') if p.is_file())
          for out in outputs:
              with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
                  for p in files:
                      rel=pathlib.PurePosixPath('vf-tools-theme')/p.relative_to(root)
                      info=zipfile.ZipInfo(str(rel),date_time=(1980,1,1,0,0,0))
                      info.compress_type=zipfile.ZIP_DEFLATED
                      info.create_system=3
                      info.external_attr=(p.stat().st_mode & 0xFFFF) << 16
                      z.writestr(info,p.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          a,b=outputs
          assert sha(a)==sha(b), (sha(a),sha(b))
          print('DETERMINISTIC_BUILD_SHA256='+sha(a))
          print('PACKAGE_FILES='+str(len(files)))
          PY
          cmp "$TMP/build1/$ASSET_NAME" "$TMP/build2/$ASSET_NAME"
          echo "RELEASE_ASSET=$TMP/build1/$ASSET_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_ROOT=$TMP/root/vf-tools-theme" >> "$GITHUB_ENV"
          echo PASS_DETERMINISTIC_DOUBLE_BUILD

      - name: Inspect package safety and runtime identity
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$RELEASE_ASSET" <<'PY'
          import zipfile,sys,pathlib,hashlib
          zpath=pathlib.Path(sys.argv[1])
          with zipfile.ZipFile(zpath) as z:
              names=z.namelist()
              assert names, 'empty zip'
              assert all(n.startswith('vf-tools-theme/') for n in names)
              assert all(not n.startswith('/') and '..' not in pathlib.PurePosixPath(n).parts for n in names)
              assert 'vf-tools-theme/style.css' in names
              style=z.read('vf-tools-theme/style.css').decode('utf-8')
              assert 'Version: 1.35.24' in style
              assert all('/.git/' not in n and not n.endswith('/.git') for n in names)
              assert all('/tests/' not in n for n in names)
              files=[n for n in names if not n.endswith('/')]
              manifest=[]
              for n in sorted(files):
                  rel=n[len('vf-tools-theme/'):]
                  manifest.append(hashlib.sha256(z.read(n)).hexdigest()+'  '+rel+'\n')
              fp=hashlib.sha256(''.join(manifest).encode()).hexdigest()
              print('ZIP_FILES='+str(len(files)))
              print('RUNTIME_FILES='+str(len(files)))
              print('RUNTIME_FINGERPRINT='+fp)
          print('ZIP_BYTES='+str(zpath.stat().st_size))
          print('ZIP_SHA256='+hashlib.sha256(zpath.read_bytes()).hexdigest())
          print('PASS_ZIP_PATH_AND_VERSION_SAFETY')
          PY

      - name: Create exact GitHub release
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          gh api "repos/${TARGET_REPO}" >/dev/null
          if gh release view "$TARGET_TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            echo "Release $TARGET_TAG already exists; refusing overwrite." >&2
            exit 31
          fi
          created=0
          cleanup() {
            rc=$?
            if [ "$rc" -ne 0 ] && [ "$created" -eq 1 ]; then
              gh release delete "$TARGET_TAG" --repo "$TARGET_REPO" --cleanup-tag -y >/dev/null 2>&1 || true
            fi
            exit "$rc"
          }
          trap cleanup EXIT
          gh release create "$TARGET_TAG" "$RELEASE_ASSET#$ASSET_NAME" \
            --repo "$TARGET_REPO" \
            --target "$TARGET_SHA" \
            --title 'VF Tools Theme V1.35.24' \
            --notes 'Reference-first Technical SEO preview release using canonical VF cyan. Candidate Gate 34410369582 PASS; Release Gate 34410942148 PASS. OWNER visual acceptance pending. Production installation not executed.'
          created=1
          trap - EXIT
          echo PASS_RELEASE_CREATED

      - name: Remote release asset readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          REMOTE_DIR="${RUNNER_TEMP}/remote-readback"
          mkdir -p "$REMOTE_DIR"
          JSON="$(gh api "repos/${TARGET_REPO}/releases/tags/${TARGET_TAG}")"
          python3 - "$JSON" "$ASSET_NAME" <<'PY'
          import json,sys
          x=json.loads(sys.argv[1]); asset=sys.argv[2]
          assert x['tag_name']=='v1.35.24'
          assert x['target_commitish'] in ('da88d874793a6459d5d3687266b1238f8bfa62df','main')
          matches=[a for a in x.get('assets',[]) if a['name']==asset]
          assert len(matches)==1, matches
          print('REMOTE_ASSET_ID='+str(matches[0]['id']))
          print('REMOTE_ASSET_BYTES='+str(matches[0]['size']))
          PY
          gh release download "$TARGET_TAG" --repo "$TARGET_REPO" --pattern "$ASSET_NAME" --dir "$REMOTE_DIR"
          LOCAL_SHA="$(sha256sum "$RELEASE_ASSET" | awk '{print $1}')"
          REMOTE_SHA="$(sha256sum "$REMOTE_DIR/$ASSET_NAME" | awk '{print $1}')"
          test "$LOCAL_SHA" = "$REMOTE_SHA"
          cmp "$RELEASE_ASSET" "$REMOTE_DIR/$ASSET_NAME"
          TAG_SHA="$(gh api "repos/${TARGET_REPO}/git/ref/tags/${TARGET_TAG}" --jq '.object.sha')"
          test "$TAG_SHA" = "$TARGET_SHA"
          echo "FORMAL_RELEASE_SHA256=$LOCAL_SHA"
          echo "FORMAL_RELEASE_BYTES=$(stat -c '%s' "$RELEASE_ASSET")"
          echo "FORMAL_RELEASE_FILES=$(find "$RELEASE_ROOT" -type f | wc -l | tr -d ' ')"
          echo "FORMAL_RELEASE_TAG_SHA=$TAG_SHA"
          echo PASS_FORMAL_RELEASE_REMOTE_READBACK
