name: P08 release issuer storage capability preflight (no secrets exported)
on:
  push:
    branches: [test/p08-pr22-release-key-capability-20261113]
permissions:
  contents: read
jobs:
  capability:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.ref == 'refs/heads/test/p08-pr22-release-key-capability-20261113'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Probe only managed GitHub Secrets public-key and configured-name capability
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = llhzx2018/core-free-runner-public
          if [ -z "${GH_TOKEN:-}" ]; then
            echo 'P08_GITHUB_RELEASE_WRITE_CAPABILITY=NOT_INJECTED'
            echo 'P08_SIGNER_DURABLE_SECRET_MANAGEMENT=NOT_PROVEN'
            exit 0
          fi
          echo 'P08_GITHUB_RELEASE_WRITE_CAPABILITY=INJECTED'
          if gh api repos/llhzx2018/vf-adops/actions/secrets/public-key --jq '.key_id' > /dev/null 2>&1; then
            echo 'P08_SIGNER_SECRET_ENCRYPTION_PUBLIC_KEY_API=ACCESSIBLE'
            if gh api repos/llhzx2018/vf-adops/actions/secrets --jq '.secrets[].name' 2>/dev/null | grep -Fxq P08_OFFICIAL_ED25519_SIGNER_SECRET_HEX; then
              echo 'P08_OFFICIAL_ED25519_SIGNER_SECRET_NAME=PRESENT'
            else
              echo 'P08_OFFICIAL_ED25519_SIGNER_SECRET_NAME=ABSENT_OR_UNREADABLE'
            fi
          else
            echo 'P08_SIGNER_SECRET_ENCRYPTION_PUBLIC_KEY_API=ACCESS_DENIED'
            echo 'P08_OFFICIAL_ED25519_SIGNER_SECRET_NAME=UNKNOWN'
          fi
          echo 'P08_SIGNING_SECRET_VALUE_EXPORTED=NO'
          echo 'P08_SIGNER_CREATED_OR_CHANGED=NO'
          echo 'P08_PRODUCTION_TAG_RELEASE_CHANNEL_CHANGED=NO'
