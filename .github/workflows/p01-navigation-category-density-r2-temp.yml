name: p01-navigation-category-density-r2-temp

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-navigation-category-density-r2-temp.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      BASE_SHA: 109aecb8b6b86dc3ceb6192a1e94c849d5850e55
      TARGET_SHA: 78f8a1241a93b4a253f9b5a3c639ed182e9f30ed
    steps:
      - name: Checkout runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout exact P01 sources
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          for name in baseline current; do
            git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "${name}"
          done
          git -C baseline fetch -q --depth 1 origin "${BASE_SHA}"
          git -C baseline checkout -q --detach FETCH_HEAD
          git -C current fetch -q --depth 1 origin "${TARGET_SHA}"
          git -C current checkout -q --detach FETCH_HEAD
          test "$(git -C current rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n ' < current/VERSION)" = "2.47.57"
          echo P01_NAVIGATION_CATEGORY_DENSITY_R2_EXACT_SOURCE=PASS

      - name: Verify bounded diff
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C current fetch -q --depth 1 origin "$BASE_SHA"
          git -C current diff --name-only "$BASE_SHA" "$TARGET_SHA" | sort >/tmp/actual.txt
          cat >/tmp/expected.txt <<'EOF'
          src/assets/admin-consolidation.css
          src/assets/admin-pages.css
          src/assets/links-admin.js
          tests/unit/navigation_category_workspace_tabs_contract.php
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          echo P01_NAVIGATION_CATEGORY_DENSITY_R2_BOUNDED_DIFF=PASS

      - name: Focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          tests=(
            tests/unit/navigation_category_workspace_tabs_contract.php
            tests/unit/navigation_header_spacing_r1_contract.php
            tests/unit/navigation_url_table_production_r1_contract.php
            tests/unit/navigation_page_visual_closure_contract.php
            tests/unit/shared_dialog_foundation_r1_contract.php
            tests/unit/session_csrf_contract.php
          )
          for t in "${tests[@]}"; do
            php -l "current/${t}"
            php "current/${t}"
          done
          echo P01_NAVIGATION_CATEGORY_DENSITY_R2_FOCUSED=PASS

      - name: PHP and JavaScript syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l current/src/links-admin.php >/dev/null
          node --check current/src/assets/links-admin.js >/dev/null
          echo P01_NAVIGATION_CATEGORY_DENSITY_R2_SYNTAX=PASS

      - name: Canonical zero-debt
        shell: bash
        run: |
          set -Eeuo pipefail
          bash current/tests/canonical_release_regression.sh current baseline --require-zero-debt | tee /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_CURRENT_FAILURE_COUNT=0' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_NEW_REGRESSION_COUNT=0' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_LEGACY_TEST_DEBT_COUNT=0' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/canonical.txt
          echo P01_NAVIGATION_CATEGORY_DENSITY_R2_CANONICAL=PASS
