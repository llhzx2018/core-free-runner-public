name: P01 2.47.412 Channels Default View Distribution One-shot Gate
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-v247412-channels-distribution.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UPDATE_REPO: llhzx2018/core-updates
      UPDATE_SHA: bd9854d6a3c50110c889610dbe8edf8118c7558d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Bind exact private update candidate in ephemeral checkout
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          ROOT="$RUNNER_TEMP/p01-412-distribution"
          echo "P01_UPDATES_ROOT=$ROOT" >> "$GITHUB_ENV"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/$UPDATE_REPO.git" "$ROOT"
          git -C "$ROOT" checkout -q --detach "$UPDATE_SHA"
          git -C "$ROOT" remote set-url origin "https://github.com/$UPDATE_REPO.git"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$UPDATE_SHA"
          echo P01_412_DIST_EXACT_SOURCE=PASS
      - name: Full core-updates contract and exact P01 release coordinates
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$P01_UPDATES_ROOT"
          python3 scripts/check_manifest_contract.py | tee "$P01_UPDATES_ROOT/manifest-result.json"
          grep -F '"status": "PASS"' "$P01_UPDATES_ROOT/manifest-result.json" >/dev/null
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php update-core/php/tests/run.php
          python3 - <<'PY'
          import json
          m=json.load(open('projects/P01.json'))
          assert m['target_version']=='2.47.412'
          assert m['current_version']=='2.47.411'
          assert m['from_versions']==['2.47.411']
          assert m['release_tag']=='v2.47.412'
          assert m['release_id']==419724905
          assert m['product_identity']=='cbad227a76fe016b6fd2c725553ff299d01abefd'
          assert m['asset_name']=='VF_Start_V2.47.412_UPDATE.zip'
          assert m['asset_bytes']==2670505
          assert m['asset_sha256']=='1a5b0d462aff2ade761a7cabd39a0f815d0f485995a4c150f129b9f1f2113b4e'
          assert m['schema_from']==m['schema_to']=='2026090401'
          assert m['update_type']=='ATOMIC'
          assert m['backup_required'] is True and m['rollback_supported'] is True
          print('P01_412_DISTRIBUTION_COORDINATES=PASS')
          PY
          echo P01_412_DISTRIBUTION_EQUIVALENT_CI=PASS
      - name: Delete private checkout
        if: always()
        shell: bash
        run: |
          if [ -n "${P01_UPDATES_ROOT:-}" ]; then rm -rf -- "$P01_UPDATES_ROOT"; fi
          echo P01_412_DIST_EPHEMERAL=PASS
