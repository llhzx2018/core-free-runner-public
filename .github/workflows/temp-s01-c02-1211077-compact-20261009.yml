name: S01-C02 1077 Publish compact owner gate
on:
  push:
    branches: [test/s01-c02-1211077-publish-compact-20261009]
jobs:
  isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      db:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: fixture-root
          MARIADB_DATABASE: ops_1077_ui
          MARIADB_USER: vf
          MARIADB_PASSWORD: fixture-pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - name: Checkout exact Ops source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 7b82a0093d9b5e4e5cd1222e6a0d7b63c10ac2cb
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: PHP and browser runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, pdo_mysql, zip, curl, mbstring
          coverage: none
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Static source and PHP validations
        run: |
          test "$(cat VERSION)" = "1.21.1077"
          php -l includes/admin-v13/views/publish_zip_v6.php
          php -l tests/s01-c02-1211077-publish-compact-fixture.php
          node --check tests/s01-c02-1211077-publish-compact-browser.js
          node --check assets/js/admin-publish-zip.js
      - name: Real PHP and 10 CSS UX with historical evidence stress
        run: node tests/s01-c02-1211077-publish-compact-browser.js
      - name: Existing publishing preflight browser regression
        run: node tests/s01-c02-1211073-publish-preflight-browser.js
      - name: ZIP upload error, retry and fail closed
        run: node tests/s01-c02-1211067-zip-input-browser-e2e.js
      - name: Saved ZIP task pause resume
        run: node tests/s01-c02-1211066-publish-zip-operator-resume-browser.js
      - name: Isolated real WordPress route CSS queue
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/wp1077"; mkdir -p "$ROOT"; WP="$ROOT/site"; mkdir -p "$WP"
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o "$ROOT/wp"
          wpqa(){ php "$ROOT/wp" --path="$WP" "$@"; }
          wpqa core download --version=7.0.2 --force
          wpqa config create --dbname=ops_1077_ui --dbuser=vf --dbpass=fixture-pass --dbhost=127.0.0.1 --skip-check
          wpqa core install --url=https://fixture.invalid --title=Isolated --admin_user=admin --admin_password=fixture-admin --admin_email=qa@example.invalid --skip-email
          mkdir -p "$WP/wp-content/plugins/vf-ops"
          rsync -a --exclude='.git' --exclude='node_modules' ./ "$WP/wp-content/plugins/vf-ops/"
          wpqa plugin activate vf-ops
          wpqa eval-file "$WP/wp-content/plugins/vf-ops/tests/s01-c02-1211075-publish-asset-wordpress.php" publish
          wpqa eval-file "$WP/wp-content/plugins/vf-ops/tests/s01-c02-1211075-publish-asset-wordpress.php" system
      - name: Deterministic tested ZIP and manifest
        run: |
          mkdir -p /tmp/s01-1077
          python3 .github/release/build-ops-package.py --output /tmp/s01-1077/vf-tools-ops_V1.21.1077.zip > /tmp/s01-1077/manifest.json
          unzip -tq /tmp/s01-1077/vf-tools-ops_V1.21.1077.zip
          cat /tmp/s01-1077/manifest.json
      - name: Seal tested candidate
        uses: actions/upload-artifact@v4
        with:
          name: s01-c02-v1.21.1077-publish-compact-candidate
          path: /tmp/s01-1077/
          retention-days: 30
