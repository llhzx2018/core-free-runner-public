name: P07 release87 Security and Care rc56 Formal Release
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p07-release87-mariadb-formal
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_TAG: p07-v0.1.0-release87-security-hardening
      RELEASE_REPO: llhzx2018/core-free-runner-public
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Exact merged source and immutable distribution preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN" || { echo 'P07_RELEASE_TOKEN_MISSING'; exit 78; }
          test "$GITHUB_REPOSITORY" = "$RELEASE_REPO"
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_main="$(gh api "repos/$RELEASE_REPO/git/ref/heads/main" --jq '.object.sha')"
          test "$remote_main" = "$GITHUB_SHA"
          pkg='packages/p07-system-care/0.1.0-rc56'
          test "$(cat "$pkg/VERSION")" = '0.1.0-rc56'
          test "$(git hash-object "$pkg/MANIFEST.gitblob")" = '30c17c1cf7781fdfcc52dddf19720e0ae15bb542'
          (cd "$pkg" && while read -r sha name; do test "$(git hash-object "$name")" = "$sha"; done < MANIFEST.gitblob)
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc56"' installers/p07-toolbox.sh
          grep -Fq "VERSION='0.1.0-rc56'" installers/p07-system-care.sh
          grep -Fq "BEGINNER_UI_BLOB='097a60416fc84856e5f0220441fa967e7c3a8688'" installers/p07-system-care.sh
          test "$(git hash-object installers/p07-system-care.sh)" = 6cd0cdf36d8b2384b553793e0ef1006221c052d5
          grep -Fq "MANIFEST_BLOB='30c17c1cf7781fdfcc52dddf19720e0ae15bb542'" installers/p07-system-care.sh
          test "$(cat dist/p07/0.1.0/overlay/BUILD_ID)" = '0.1.0-release87'
          test "$(git hash-object dist/p07/0.1.0/overlay/RUNTIME.gitblob)" = '5cbbd927920be86d4e42d39a15abcbb445531a4d'
          test "$(git hash-object dist/p07/0.1.0/overlay/MANIFEST.gitblob)" = 'aecbf8129dc432764fc914a4d1ba75b8e3627dd4'
          (cd dist/p07/0.1.0/overlay && while read -r sha name; do test "$(git hash-object "$name")" = "$sha"; done < RUNTIME.gitblob)
          (cd dist/p07/0.1.0/overlay && while read -r sha name; do test "$(git hash-object "$name")" = "$sha"; done < MANIFEST.gitblob)
          test "$(git hash-object installers/p07-final.sh)" = '77e44f55182aec282877b95d921af60cbfae0bd3'
          grep -Fq 'EXPECTED_BLOB="77e44f55182aec282877b95d921af60cbfae0bd3"' installers/p07.sh
          grep -Fq 'EXPECTED_BUILD_ID="0.1.0-release87"' installers/p07-final.sh
          grep -Fq 'RUNTIME_MANIFEST_BLOB="5cbbd927920be86d4e42d39a15abcbb445531a4d"' installers/p07-final.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release87"' installers/p07-toolbox.sh
          grep -Fq 'CLOUDPANEL_BOOTSTRAP_DB_ENGINE = "MARIADB_10.11"' dist/p07/0.1.0/overlay/lib/server_migration.py
          grep -Fq 'NEW_SERVER_REQUIRES_MARIADB_10_11' dist/p07/0.1.0/overlay/lib/server_migration_pull.py
          grep -Fq "VFOPS_BUILD_EXPECTED='0.1.0-release87'" "$pkg/vf-system-care.sh"
          bash -n "$pkg/intrusion-evidence.sh" installers/p07-system-care.sh installers/p07-toolbox.sh installers/p07-final.sh installers/p07.sh dist/p07/0.1.0/overlay/bin/vfops-init-ui
          (cd dist/p07/0.1.0/overlay && PYTHONPATH=lib python3 -m unittest -q tests.test_mariadb_owner_policy tests.test_server_migration tests.test_server_migration_pull)
          python3 -m unittest discover -s tests -p 'test_p07_wp_owner_baseline_rc50.py' -q
          python3 -m unittest discover -s tests -p 'test_p07_wp_owner_status_rc51.py' -q
          python3 -m unittest discover -s tests -p 'test_p07_wp_owner_overview_rc52.py' -q
          python3 -m unittest discover -s tests -p 'test_p07_wp_owner_verify_rc53.py' -q
          python3 -m unittest discover -s tests -p 'test_p07_wp_owner_triage_rc48.py' -q
          echo 'P07_RELEASE87_MERGED_EXACT_SOURCE=PASS'

      - name: Formal Release through registered VF release credential
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! gh release view "$RELEASE_TAG" -R "$RELEASE_REPO" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" -R "$RELEASE_REPO" --target "$GITHUB_SHA" \
              --title 'P07 · release87 · 备份恢复安全加固及 System Care rc56' \
              --notes 'P07 release87 修复备份校验清单完整性、恢复事务误清理保护、自动备份删除前 fresh verify、旧服务器迁移预检临时辅助程序授权与清理；CloudPanel timeout 异常密码泄露已收敛，但 clpctl 官方密码 argv 限制仍需后续解决。System Care rc56 兼容 release87。独立 Public Runner exact-source 669 项回归、隔离安装升级及回滚 PASS。原生私仓 CI 阻断未宣称 PASS；真实新 VPS MariaDB 及 SOURCE→TARGET 迁移、Production Restore、DNS/旧机均需 Owner 独立手工验收。'
          fi
          tag_sha="$(gh api "repos/$RELEASE_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          test "$tag_sha" = "$GITHUB_SHA" || { echo 'P07_RELEASE87_TAG_IDENTITY_MISMATCH'; exit 81; }
          release_data="$(gh api "repos/$RELEASE_REPO/releases/tags/$RELEASE_TAG")"
          test "$(jq -r '.tag_name' <<< "$release_data")" = "$RELEASE_TAG"
          test "$(jq -r '.target_commitish' <<< "$release_data")" = "$GITHUB_SHA"
          test "$(jq -r '.draft' <<< "$release_data")" = false
          test "$(jq -r '.prerelease' <<< "$release_data")" = false
          echo 'P07_RELEASE87_FORMAL_RELEASE_REMOTE_READBACK=PASS'

      - name: Published public distribution and raw-byte readback
        shell: bash
        run: |
          set -Eeuo pipefail
          manifest_url="https://raw.githubusercontent.com/$RELEASE_REPO/$GITHUB_SHA/packages/p07-system-care/0.1.0-rc56/MANIFEST.gitblob"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 5 --retry-delay 2 "$manifest_url" -o /tmp/p07-release87-manifest
          test "$(git hash-object /tmp/p07-release87-manifest)" = '30c17c1cf7781fdfcc52dddf19720e0ae15bb542'
          url="https://raw.githubusercontent.com/$RELEASE_REPO/main/installers/p07-system-care.sh"
          good=0
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL --proto '=https' --tlsv1.2 "$url" -o /tmp/p07-public-installer &&
              grep -Fq "VERSION='0.1.0-rc56'" /tmp/p07-public-installer &&
              grep -Fq "MANIFEST_BLOB='30c17c1cf7781fdfcc52dddf19720e0ae15bb542'" /tmp/p07-public-installer; then
              good=1
              break
            fi
            sleep 3
          done
          test "$good" = 1 || { echo P07_RELEASE87_PUBLIC_INSTALLER_NOT_CURRENT; exit 85; }
          live_base="https://raw.githubusercontent.com/$RELEASE_REPO/$GITHUB_SHA"
          curl -fsSL --proto '=https' --tlsv1.2 "$live_base/installers/p07-final.sh" -o /tmp/p07-release87-final
          test "$(git hash-object /tmp/p07-release87-final)" = '77e44f55182aec282877b95d921af60cbfae0bd3'
          curl -fsSL --proto '=https' --tlsv1.2 "$live_base/dist/p07/0.1.0/overlay/RUNTIME.gitblob" -o /tmp/p07-release87-runtime
          test "$(git hash-object /tmp/p07-release87-runtime)" = '5cbbd927920be86d4e42d39a15abcbb445531a4d'
          curl -fsSL --proto '=https' --tlsv1.2 "$live_base/installers/p07-toolbox.sh" -o /tmp/p07-release87-toolbox
          test "$(git hash-object /tmp/p07-release87-toolbox)" = '6ac64f5d9e632ef0bc150bb9a548d3b476a125dd'
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release87"' /tmp/p07-release87-toolbox
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc56"' /tmp/p07-release87-toolbox
          echo 'P07_RELEASE87_PUBLIC_DISTRIBUTION_REMOTE_READBACK=PASS'
