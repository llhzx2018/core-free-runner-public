name: P08 R70 exact private source real FULL Atomic builder and Worker regression
on:
  push:
    branches: [test/p08-r70-exact-build-20261113]

permissions:
  contents: read

concurrency:
  group: p08-r70-real-branch-build
  cancel-in-progress: false

jobs:
  isolated-owner-upgrade-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Verify workflow scope and temp branch
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = llhzx2018/core-free-runner-public
          test "$GITHUB_REF_NAME" = test/p08-r70-exact-build-20261113
          echo 'P08_R70_PRODUCTION_MUTATION=NO'
      - name: Checkout approved exact private P08 PR22 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 31cd1e0ed43d625625091bf4a71ac30f1eb69e66
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm exact original Git SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = 31cd1e0ed43d625625091bf4a71ac30f1eb69e66
          test "$(cat source/VERSION)" = 0.1.1
          git -C source cat-file -e ed71631fea3eb22bf73661e290b6d5e67e81aa2b^{commit}
          echo 'P08_R70_EXACT_PRIVATE_CHECKOUT=PASS'
      - name: Setup PHP 8.4 with required test modules
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: sqlite3,pdo_sqlite,pdo_mysql,zip,curl,sodium,mbstring,dom,xml,intl,bcmath,fileinfo
      - name: R66 R67 R68 R69 real code syntax and developer regression tests
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail
          php -l src/Upgrade/FreshOwnerUpgradeBackup.php
          php -l src/Upgrade/OwnerUpgradeJob.php
          php -l src/Upgrade/AtomicReleasePointer.php
          php -l src/Upgrade/ReleaseCandidatePublicationGate.php
          php -l tests/test_fresh_owner_upgrade_backup.php
          php -l tests/test_owner_upgrade_job.php
          php -l tests/test_release_candidate_publication_gate.php
          php tests/test_fresh_owner_upgrade_backup.php
          php tests/test_atomic_release_pointer.php
          php tests/test_owner_upgrade_job.php
          php tests/test_release_candidate_publication_gate.php
          python3 -m unittest discover -s tests -p 'test_owner_atomic_pair_builder.py' -v
          python3 -m unittest discover -s tests -p 'test_verify_owner_atomic_pair.py' -v
          echo 'P08_R70_REAL_CHECKED_OUT_PHP_AND_PYTHON_REGRESSIONS=PASS'
      - name: Clean private source even when test fails
        if: always()
        shell: bash
        run: |
          rm -rf source
          echo 'P08_R70_PRIVATE_SOURCE_PERSISTED=NO'

  actual-composer-vite-full-and-atomic-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Verify scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = llhzx2018/core-free-runner-public
          test "$GITHUB_REF_NAME" = test/p08-r70-exact-build-20261113
      - name: Checkout approved exact private P08 source with Bridge history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 31cd1e0ed43d625625091bf4a71ac30f1eb69e66
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Configure real PHP 8.4 Composer and Node 22
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: sqlite3,pdo_sqlite,pdo_mysql,zip,curl,sodium,mbstring,dom,xml,intl,bcmath,fileinfo
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build REAL Bridge FULL target FULL and Atomic from pinned Git commits
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 31cd1e0ed43d625625091bf4a71ac30f1eb69e66
          git cat-file -e ed71631fea3eb22bf73661e290b6d5e67e81aa2b^{commit}
          php -r 'if(!class_exists("ZipArchive") || !extension_loaded("sodium"))exit(2);'
          python3 scripts/build_owner_atomic_pair.py \
            --repo "$PWD" \
            --target-sha 31cd1e0ed43d625625091bf4a71ac30f1eb69e66 \
            --output-dir "$RUNNER_TEMP/p08-r70-unsigned-trio"
          python3 scripts/verify_owner_atomic_pair.py \
            "$RUNNER_TEMP/p08-r70-unsigned-trio" \
            ed71631fea3eb22bf73661e290b6d5e67e81aa2b \
            31cd1e0ed43d625625091bf4a71ac30f1eb69e66
          echo 'P08_R70_REAL_LARAVEL_VITE_THREE_ZIP_AND_R69_AUDIT=PASS'
          echo 'P08_R70_RELEASE_SIGNED=NO'
          echo 'P08_R70_PRODUCTION_CHANGED=NO'
      - name: Remove generated ZIPs and ephemeral private checkout
        if: always()
        shell: bash
        run: |
          rm -rf source "$RUNNER_TEMP/p08-r70-unsigned-trio"
          echo 'P08_R70_PRIVATE_SOURCE_AND_ZIP_PERSISTED=NO'
