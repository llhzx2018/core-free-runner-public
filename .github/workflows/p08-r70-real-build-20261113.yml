name: P08 R70 MariaDB 11.8 exact source real recovery retry healthcheck
on:
  push:
    branches: [test/p08-r70-exact-build-20261113]
permissions:
  contents: read
jobs:
  mariadb-recovery-after-healthcheck-correction:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: synthetic-only-p08-ci-pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      P08_ISOLATED_INSTALL_TEST: YES
      P08_TEST_DB_DRIVER: mariadb
      P08_TEST_DB_HOST: 127.0.0.1
      P08_TEST_DB_CLEAN: p08_ci_clean
      P08_TEST_DB_DIRTY: p08_ci_dirty
      P08_TEST_DB_RESTORE: p08_ci_restore
      P08_TEST_DB_FULL_RESTORE: p08_ci_full_restore
      P08_TEST_DB_USER: root
      P08_TEST_DB_PASSWORD: synthetic-only-p08-ci-pass
    steps:
      - name: Check temporary infrastructure-only route
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = llhzx2018/core-free-runner-public
          test "$GITHUB_REF_NAME" = test/p08-r70-exact-build-20261113
      - name: Checkout exact private P08 PR22 commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 31cd1e0ed43d625625091bf4a71ac30f1eb69e66
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_mysql,zip,curl,sodium,mbstring,dom,xml,intl,bcmath,fileinfo
      - name: Install actual dependencies and exercise real MariaDB 11.8
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 31cd1e0ed43d625625091bf4a71ac30f1eb69e66
          mkdir -p bootstrap/cache storage/framework/{cache/data,sessions,views} storage/logs
          composer install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress >/dev/null
          php tests/fixtures/create_ci_databases.php
          php tests/test_install_mysql_e2e.php
          php tests/test_recovery_sql_e2e.php
          php tests/test_recovery_private_payload_e2e.php
          echo 'P08_R70_REAL_MARIADB_11_8_NATIVE_PRIVATE_RECOVERY=PASS'
          echo 'P08_R70_FORMAL_RELEASE_AND_PRODUCTION=NO'
      - name: Cleanup source and synthetic database containers
        if: always()
        run: rm -rf source
