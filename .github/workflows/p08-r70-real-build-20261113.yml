name: P08 R70 three-engine installed Owner and private recovery exact source
on:
  push:
    branches: [test/p08-r70-exact-build-20261113]
permissions:
  contents: read
jobs:
  sqlite-owner-private-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      P08_ISOLATED_INSTALL_TEST: YES
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 31cd1e0ed43d625625091bf4a71ac30f1eb69e66
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: sqlite3,pdo_sqlite,zip,curl,sodium,mbstring,dom,xml,intl,bcmath,fileinfo
      - name: Real SQLite WAL first install and private recovery
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = llhzx2018/core-free-runner-public
          test "$(git rev-parse HEAD)" = 31cd1e0ed43d625625091bf4a71ac30f1eb69e66
          mkdir -p bootstrap/cache storage/framework/{cache/data,sessions,views} storage/logs
          composer install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress >/dev/null
          php tests/test_install_sqlite_e2e.php
          php tests/test_recovery_sqlite_e2e.php
          php tests/test_recovery_private_payload_e2e.php
          echo P08_R70_EXACT_SOURCE_SQLITE_WAL_REAL_RECOVERY=PASS
      - name: Wipe transient private source
        if: always()
        run: rm -rf source
  mysql-mariadb-owner-private-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - driver: mariadb
            image: mariadb:11.8
          - driver: mysql
            image: mysql:8.4
    services:
      db:
        image: ${{ matrix.image }}
        env:
          MARIADB_ROOT_PASSWORD: synthetic-only-p08-ci-pass
          MYSQL_ROOT_PASSWORD: synthetic-only-p08-ci-pass
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      P08_ISOLATED_INSTALL_TEST: YES
      P08_TEST_DB_DRIVER: ${{ matrix.driver }}
      P08_TEST_DB_HOST: 127.0.0.1
      P08_TEST_DB_CLEAN: p08_ci_clean
      P08_TEST_DB_DIRTY: p08_ci_dirty
      P08_TEST_DB_RESTORE: p08_ci_restore
      P08_TEST_DB_FULL_RESTORE: p08_ci_full_restore
      P08_TEST_DB_USER: root
      P08_TEST_DB_PASSWORD: synthetic-only-p08-ci-pass
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 31cd1e0ed43d625625091bf4a71ac30f1eb69e66
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_mysql,zip,curl,sodium,mbstring,dom,xml,intl,bcmath,fileinfo
      - name: Real SQL first install private recovery tamper and dirty-refusal
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = llhzx2018/core-free-runner-public
          test "$(git rev-parse HEAD)" = 31cd1e0ed43d625625091bf4a71ac30f1eb69e66
          mkdir -p bootstrap/cache storage/framework/{cache/data,sessions,views} storage/logs
          composer install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress >/dev/null
          php tests/fixtures/create_ci_databases.php
          php tests/test_install_mysql_e2e.php
          php tests/test_recovery_sql_e2e.php
          php tests/test_recovery_private_payload_e2e.php
          echo "P08_R70_EXACT_SOURCE_SQL_ENGINE=$P08_TEST_DB_DRIVER"
          echo P08_R70_EXACT_SOURCE_SQL_REAL_RECOVERY=PASS
      - name: Wipe transient private source
        if: always()
        run: rm -rf source
