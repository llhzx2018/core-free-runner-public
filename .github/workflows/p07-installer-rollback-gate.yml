name: p07-installer-rollback-gate

on:
  pull_request:
    paths:
      - 'installers/p07-final.sh'
      - 'experiments/p07-installer-rollback-gate.sh'
      - '.github/workflows/p07-installer-rollback-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  abort-rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Isolated installer abort rollback
        run: |
          bash -n installers/p07-final.sh
          bash -n experiments/p07-installer-rollback-gate.sh
          bash experiments/p07-installer-rollback-gate.sh
