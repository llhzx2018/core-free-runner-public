name: P01 D13 pinned Composer lock and isolated bundle proof (temporary)
on:
  push:
    branches:
      - test/p01-d13-bundle-20261112
permissions:
  contents: read
jobs:
  p01-d13-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Assert registered public-safe runner and no Owner data
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "$GITHUB_REF_NAME" = "test/p01-d13-bundle-20261112"
          echo P01_D13_FIXTURES=SYNTHETIC_ONLY
      - name: Verify private source read runtime capability
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo P01_D13_PRIVATE_READ=AVAILABLE
      - name: Checkout exact product code in temporary private workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: c3dd150c87fdedf1fba1c7c51dc053d3c93805f7
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
      - name: Verify exact source SHA and run package negative tests
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "c3dd150c87fdedf1fba1c7c51dc053d3c93805f7"
          test "$(cat candidate/VERSION)" = "2.47.515"
          echo P01_D13_EXACT_SOURCE=c3dd150c87fdedf1fba1c7c51dc053d3c93805f7
          cd candidate
          python3 -m py_compile scripts/build_p01_next_clean_full.py
          python3 -m unittest discover -s tests/architecture -p test_p01_next_full_bundle.py -v
          echo P01_D13_PACKAGE_NEGATIVE_TESTS=PASS
      - name: Resolve pinned public Composer packages for source lock
        run: |
          set -Eeuo pipefail
          if ! command -v composer >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq composer >/dev/null
          fi
          test ! -e candidate/src/app/next/composer.lock
          export COMPOSER_NO_INTERACTION=1
          composer install --working-dir=candidate/src/app/next --no-dev --no-plugins --no-scripts --prefer-dist --no-progress -q
          php -r '$o=json_decode(file_get_contents("candidate/src/app/next/composer.lock"),true,512,JSON_THROW_ON_ERROR);$ok=false;foreach($o["packages"] as $v){if($v["name"]==="laravel/framework"&&$v["version"]==="v13.42.0"){$ok=true;break;}}exit($ok?0:1);'
          echo "P01_D13_PUBLIC_LOCK_SHA256=$(sha256sum candidate/src/app/next/composer.lock | cut -d' ' -f1)"
          echo P01_D13_PUBLIC_LOCK_BASE64_START
          base64 -w0 candidate/src/app/next/composer.lock | fold -w120
          echo P01_D13_PUBLIC_LOCK_BASE64_END
      - name: Cleanup transient private checkout
        if: always()
        run: |
          rm -rf -- candidate
          echo P01_D13_PRIVATE_SOURCE_PERSISTED=NO
