name: S01 tools directory edge and spacing proof
on:
  push:
    branches: [task/s01-tools181-20261024]
    paths: ['.github/workflows/s01-tools181-20261024.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.181
  TARGET_SHA: 181929c9cfb35c379277099c0e5ff966c4ecd4ec
  TARGET_TREE: 8efdcc6f74598259ee207d85a76b84bafecd52da
  BASE_SHA: 3c227bcf8cfed885ac1cb290a250eda91fcf1445
  SOURCE_VERSION: 1.35.180
  LANE_ID: s01-tools181-20261024
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          ref: 02d4591eed025a3d3a67bc0a150b3ddc448c2ab8
          persist-credentials: false
          path: established
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 181929c9cfb35c379277099c0e5ff966c4ecd4ec
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact package and focused syntax checks
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider baseline
          python3 control/lanes/s01-tools181-20261024/package.py
          php -l target/src/inc/services/frontend-page-progress-service.php
          php -l target/src/inc/public-css-owner-registry.php
          node --check target/tests/tools-directory-desktop-browser-check.cjs
          node --check control/lanes/s01-tools181-20261024/clean.cjs
          gh release download v1.35.180 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.180.zip --dir provider
          echo '39bd2d187f51e8c2c0a9e140e02fa7bcad6fc555f635ff84699fc6c4b280db85  provider/vf-tools-theme_V1.35.180.zip' | sha256sum -c
          gh release download v1.25.94 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.94.zip --dir provider
          echo '70b90d40da5d69fc7819bd7ada3f15fb0145e64822b788bd94956c7827b2df03  provider/vf-tools-m3u8_V1.25.94.zip' | sha256sum -c
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -g -fsSL --retry 2 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC[wght].ttf' -o "$HOME/.local/share/fonts/NotoSansSC.ttf"
          fc-cache -f
      - name: Native WordPress tools directory and upgrade rollback data protection
        run: |
          set -euo pipefail
          cp -a established/lanes/s01-frontend-design-20261017 lane
          cp control/lanes/s01-tools181-20261024/clean.cjs lane/warm-admin.cjs
          bash control/lanes/s01-tools181-20261024/native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-home-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target baseline provider
