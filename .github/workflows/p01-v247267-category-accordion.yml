name: P01 V2.47.267 Category Accordion Proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p01-v247267-category-accordion.yml"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout proof control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd nodejs >/dev/null

      - name: Clone exact candidate and baseline
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" candidate
          git -C candidate fetch -q origin c912d80f79f256b9b940f264c836f48847a7c37a
          git -C candidate checkout -q --detach c912d80f79f256b9b940f264c836f48847a7c37a
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.267"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "2.47.267"

          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" baseline
          git -C baseline fetch -q origin 6f88ddaf53fc1a342e61e3302f10a1fbe6d681fd
          git -C baseline checkout -q --detach 6f88ddaf53fc1a342e61e3302f10a1fbe6d681fd
          echo P01_V247267_EXACT_SOURCE=PASS

      - name: Syntax and focused category contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check candidate/src/assets/links-admin.js
          php -l candidate/src/links-admin.php
          php -l candidate/src/app/bootstrap.php
          php candidate/tests/unit/navigation_category_accordion_v247267_contract.php
          php candidate/tests/unit/navigation_category_editor_v247265_contract.php
          php candidate/tests/unit/navigation_category_sort_v247263_contract.php
          php candidate/tests/unit/navigation_category_runtime_binding_v247264_contract.php
          php candidate/tests/unit/navigation_category_workspace_tabs_contract.php
          php candidate/tests/unit/admin_navigation_categories_page4_polish_contract.php
          php candidate/tests/unit/admin_navigation_consistency_contract.php
          php candidate/tests/unit/admin_pages_css_scope_v247266_contract.php
          echo P01_V247267_FOCUSED=PASS

      - name: Mature accordion guards
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -F 'expandedCategoryRootId=null' candidate/src/assets/links-admin.js
          grep -F 'function toggleCategoryAccordion(id)' candidate/src/assets/links-admin.js
          grep -F 'data-category-toggle-row=' candidate/src/assets/links-admin.js
          ! grep -F 'function expandAllCategories()' candidate/src/assets/links-admin.js
          ! grep -F 'function collapseAllCategories()' candidate/src/assets/links-admin.js
          ! grep -F 'id="expandCategories"' candidate/src/links-admin.php
          ! grep -F 'id="collapseCategories"' candidate/src/links-admin.php
          grep -F 'P01 V2.47.267 — mature category accordion closure.' candidate/src/assets/admin-pages.css
          echo P01_V247267_ACCORDION=PASS

      - name: Canonical regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate baseline --require-zero-debt | tee /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/canonical.txt
          echo P01_V247267_CANONICAL=PASS

      - name: Bounded scope
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C candidate diff --name-only 6f88ddaf53fc1a342e61e3302f10a1fbe6d681fd..c912d80f79f256b9b940f264c836f48847a7c37a | tee /tmp/changed.txt
          if grep -E '(^|/)(migrations|schema|auth|security|update|install|setup)' /tmp/changed.txt; then
            echo "Unexpected high-risk scope"
            exit 1
          fi
          echo FORMAL_RELEASE_CALLED=NO
          echo DISTRIBUTION_WRITE=NO
          echo PRODUCTION_WRITE=NO
