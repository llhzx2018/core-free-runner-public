name: P04 V2.8.6 Diagnostics Hotfix Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p04-v286-diagnostics-hotfix.yml'
      - 'requests/p04-v286-diagnostics-hotfix.txt'

permissions:
  contents: read

jobs:
  hotfix:
    runs-on: ubuntu-24.04
    env:
      SOURCE_REPOSITORY: llhzx2018/vf-infra
      SOURCE_BRANCH: hotfix/v2.8.6-diagnostics-run
      EXPECTED_HEAD: 7542c023234d37823d12ea839cbafc476ca57474
      TARGET_VERSION: 2.8.6
      PUSH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Checkout exact P04 hotfix branch
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_BRANCH }}
          token: ${{ env.PUSH_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, zip, sodium, pdo_sqlite, sqlite3
          ini-file: production

      - name: Patch diagnostics resilience and feedback
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PUSH_TOKEN"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          from pathlib import Path

          # Backend: preserve partial diagnostic results instead of collapsing the whole panel.
          p=Path('src/app/SystemDiagnosticsService.php')
          s=p.read_text(encoding='utf-8')
          old="""        $pdo = Database::connection();
                  $checks = [];
                  $add = static function (string $key, string $label, string $status, string $detail, string $next = '') use (&$checks): void {
                      $checks[] = compact('key', 'label', 'status', 'detail', 'next');
                  };
          
                  $add('php', 'PHP 运行环境',"""
          new="""        $checks = [];
                  $cron = [];
                  $add = static function (string $key, string $label, string $status, string $detail, string $next = '') use (&$checks): void {
                      $checks[] = compact('key', 'label', 'status', 'detail', 'next');
                  };
          
                  try {
                      $pdo = Database::connection();
          
                  $add('php', 'PHP 运行环境',"""
          if s.count(old)!=1: raise SystemExit('V286_DIAGNOSTICS_OPEN_SENTINEL_DRIFT')
          s=s.replace(old,new,1)
          old2="""        $summary = ['ok' => 0, 'warning' => 0, 'blocked' => 0];
          """
          new2="""        } catch (Throwable $e) {
                      $reference = Support::randomHex(6);
                      error_log('[VF Infra][' . $reference . '] diagnostics: ' . Support::sanitizeError($e->getMessage()));
                      $add(
                          'diagnostics_internal',
                          '诊断执行完整性',
                          'blocked',
                          '部分检查未完成 · 参考 ' . $reference,
                          '请先处理已显示检查项；如持续出现，请使用参考编号定位服务器日志。'
                      );
                  }
          
                  $summary = ['ok' => 0, 'warning' => 0, 'blocked' => 0];
          """
          if s.count(old2)!=1: raise SystemExit('V286_DIAGNOSTICS_CLOSE_SENTINEL_DRIFT')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')

          # Frontend: plug the V2.7.1 diagnostics action into the existing V2.8.4 long-action feedback engine.
          p=Path('public/assets/v284-long-action-feedback.js')
          s=p.read_text(encoding='utf-8')
          domain_block="""    domain_check: {
                title: '正在检查域名',
                detail: '正在查询 RDAP，请勿重复点击。',
                selectors: ['[data-action=\"check-domain\"]'],
                clickedOnly: true,
              },
          """
          diag_block=domain_block+"""    diagnostics_run: {
                title: '正在检查系统',
                detail: '正在执行完整诊断，请稍候，不要重复点击。',
                selectors: ['[data-v271-action=\"diagnostics-run\"]'],
                clickedOnly: true,
              },
          """
          if s.count(domain_block)!=1: raise SystemExit('V286_FEEDBACK_KNOWN_SENTINEL_DRIFT')
          s=s.replace(domain_block,diag_block,1)
          old="""    'check-domain': 'domain_check',
            };"""
          new="""    'check-domain': 'domain_check',
              'diagnostics-run': 'diagnostics_run',
            };"""
          if s.count(old)!=1: raise SystemExit('V286_FEEDBACK_MAP_SENTINEL_DRIFT')
          s=s.replace(old,new,1)
          old="event.target instanceof Element ? event.target.closest('[data-action]') : null;"
          new="event.target instanceof Element ? event.target.closest('[data-action], [data-v271-action=\"diagnostics-run\"]') : null;"
          if s.count(old)!=1: raise SystemExit('V286_FEEDBACK_SELECTOR_SENTINEL_DRIFT')
          s=s.replace(old,new,1)
          old="String(button.dataset.action || '')"
          new="String(button.dataset.action || button.dataset.v271Action || '')"
          if s.count(old)!=1: raise SystemExit('V286_FEEDBACK_DATASET_SENTINEL_DRIFT')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          Path('VERSION').write_text('2.8.6\n',encoding='utf-8')

          p=Path('CHANGELOG.md'); s=p.read_text(encoding='utf-8')
          s="""## V2.8.6

- 修复“重新检查系统”在诊断异常时看起来没有反应：单个检查失败不再让整块诊断退化为“未知 / 0”，已完成检查继续显示，并给出安全参考编号。
- “重新检查系统”正式接入 V2.8.4 长耗时操作反馈：立即 Busy、显示等待时间、阻止重复点击，不伪造百分比。
- Schema 14，无 Migration，无 Provider 写权限变化。

"""+s
          p.write_text(s,encoding='utf-8')

          p=Path('docs/operations/package/RELEASE_NOTES.md'); s=p.read_text(encoding='utf-8')
          s="""# VF Infra V2.8.6

- Diagnostics resilience hotfix：任何单项运行时诊断异常都不会再吞掉整块诊断结果；页面保留已完成检查，并显示“诊断执行完整性”阻断项与安全参考编号。
- “重新检查系统”接入统一长耗时反馈：点击后立即显示“正在检查系统”、等待秒数和 Indeterminate Progress，并防止重复提交。
- 保留 V2.8.5 设置左侧主分栏 / 无二级 TAB / 数据管理与系统信息单页连续内容，以及 V2.8.4 长耗时反馈合同。
- Schema 14，无 Migration，无 Provider 写权限变化。

"""+s
          p.write_text(s,encoding='utf-8')

          p=Path('scripts/build-release-tree.py'); s=p.read_text(encoding='utf-8')
          old="'2.8.3','2.8.4','2.8.5'}"
          new="'2.8.3','2.8.4','2.8.5','2.8.6'}"
          if s.count(old)!=1: raise SystemExit('V286_RELEASE_TREE_SET_SENTINEL_DRIFT')
          s=s.replace(old,new,1)
          old="""if version=='2.8.5':
              version_note='V2.8.5 retains the primary Settings sidebar, removes only nested content tabs, combines Data Management and System Information subcontent into one continuous page per primary section, and resets async top-level routes after render so Provider opens at the page top without disrupting same-page refresh position.'
          """
          new="""if version=='2.8.6':
              version_note='V2.8.6 makes System Diagnostics fail-partial instead of fail-silent and connects the manual diagnostics action to the established long-running-operation feedback contract; Schema remains 14 and Provider authority remains read-only first.'
          elif version=='2.8.5':
              version_note='V2.8.5 retains the primary Settings sidebar, removes only nested content tabs, combines Data Management and System Information subcontent into one continuous page per primary section, and resets async top-level routes after render so Provider opens at the page top without disrupting same-page refresh position.'
          """
          if s.count(old)!=1: raise SystemExit('V286_RELEASE_TREE_NOTE_SENTINEL_DRIFT')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # V2.8.6 uses the V2.8.4 proven Source-Exact/backup/rollback engine, as V2.8.5 did,
          # adding 2.8.5 as an eligible source and diagnostics-specific evidence flags.
          b=Path('scripts/build-v285-update-release.py').read_text(encoding='utf-8')
          b=b.replace("TARGET = '2.8.5'", "TARGET = '2.8.6'", 1)
          b=b.replace("ALLOWED_SOURCES = ['2.7.9', '2.8.0', '2.8.1', '2.8.2', '2.8.3', '2.8.4']", "ALLOWED_SOURCES = ['2.7.9', '2.8.0', '2.8.1', '2.8.2', '2.8.3', '2.8.4', '2.8.5']", 1)
          b=b.replace("source = source.replace('2.8.4', '2.8.5').replace('V284', 'V285').replace('v284', 'v285')", "source = source.replace('2.8.4', '2.8.6').replace('V284', 'V286').replace('v284', 'v286')", 1)
          b=b.replace("generated_builder = root / 'scripts/build-v285-generated.py'", "generated_builder = root / 'scripts/build-v286-generated.py'", 1)
          b=b.replace("repair = out / 'repair-v2.8.5.php'", "repair = out / 'repair-v2.8.6.php'", 1)
          b=b.replace("atomic = out / 'VF_Infra_V2.8.5_ATOMIC.zip'", "atomic = out / 'VF_Infra_V2.8.6_ATOMIC.zip'", 1)
          b=b.replace("update = out / 'VF_Infra_V2.8.5_UPDATE.zip'", "update = out / 'VF_Infra_V2.8.6_UPDATE.zip'", 1)
          b=b.replace("new_allowed = \"const VF_INFRA_ATOMIC_ALLOWED_SOURCES_JSON='[\\\"2.7.9\\\",\\\"2.8.0\\\",\\\"2.8.1\\\",\\\"2.8.2\\\",\\\"2.8.3\\\",\\\"2.8.4\\\"]';\"", "new_allowed = \"const VF_INFRA_ATOMIC_ALLOWED_SOURCES_JSON='[\\\"2.7.9\\\",\\\"2.8.0\\\",\\\"2.8.1\\\",\\\"2.8.2\\\",\\\"2.8.3\\\",\\\"2.8.4\\\",\\\"2.8.5\\\"]';\"", 1)
          b=b.replace("'settings_single_page_route_scroll_source_exact_runtime_safe_verify'", "'diagnostics_resilience_feedback_source_exact_runtime_safe_verify'", 1)
          marker="package_manifest['long_action_feedback_contract'] = 'V284_IMMEDIATE_BUSY_INDETERMINATE_PROGRESS_DUPLICATE_GUARD_GENERIC_SLOW_POST'"
          if marker not in b: raise SystemExit('V286_BUILDER_MANIFEST_SENTINEL_DRIFT')
          b=b.replace(marker, marker+"\npackage_manifest['diagnostics_partial_failure_resilience'] = True\npackage_manifest['diagnostics_manual_run_busy_feedback'] = True", 1)
          b=b.replace("'settings_primary_sidebar_retained': True,", "'settings_primary_sidebar_retained': True,\n    'diagnostics_partial_failure_resilience': True,\n    'diagnostics_manual_run_busy_feedback': True,", 1)
          b=b.replace('V285_', 'V286_').replace('v285', 'v286')
          Path('scripts/build-v286-update-release.py').write_text(b,encoding='utf-8')
          PY

      - name: Validate hotfix and formal package contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(cat VERSION)" = "$TARGET_VERSION"
          php -l src/app/SystemDiagnosticsService.php >/dev/null
          node --check public/assets/v284-long-action-feedback.js
          python3 -m py_compile scripts/build-release-tree.py scripts/build-v286-update-release.py
          grep -Fq "diagnostics_internal" src/app/SystemDiagnosticsService.php
          grep -Fq "'diagnostics-run': 'diagnostics_run'" public/assets/v284-long-action-feedback.js
          grep -Fq 'data-v271-action=\"diagnostics-run\"' public/assets/v284-long-action-feedback.js
          php -r '
            class Database { public static function connection(){ throw new RuntimeException("forced diagnostic failure"); } }
            class Support { public static function randomHex($b=8){ return "abc123def456"; } public static function sanitizeError($v){ return "sanitized"; } public static function now(){ return "2026-08-19 11:18:00"; } }
            require "src/app/SystemDiagnosticsService.php";
            $r=(new SystemDiagnosticsService())->run(true);
            if(($r["status"]??"")!=="blocked" || ($r["summary"]["blocked"]??0)!==1 || ($r["checks"][0]["key"]??"")!=="diagnostics_internal") exit(2);
            echo "V286_DIAGNOSTICS_FAIL_PARTIAL_PASS\n";
          '
          find src public -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          find public/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          rm -rf "$RUNNER_TEMP/v286-runtime" "$RUNNER_TEMP/v286-a" "$RUNNER_TEMP/v286-b"
          python3 scripts/build-release-tree.py "$RUNNER_TEMP/v286-runtime" | tee /tmp/v286-release-tree.json
          jq -e '.version=="2.8.6" and .target_schema==14 and .release_kind=="maintenance_release"' "$RUNNER_TEMP/v286-runtime/release-manifest.json" >/dev/null
          python3 scripts/build-v286-update-release.py --target-runtime "$RUNNER_TEMP/v286-runtime" --output "$RUNNER_TEMP/v286-a" | tee /tmp/v286-build.json
          python3 scripts/build-v286-update-release.py --target-runtime "$RUNNER_TEMP/v286-runtime" --output "$RUNNER_TEMP/v286-b" >/dev/null
          cmp "$RUNNER_TEMP/v286-a/VF_Infra_V2.8.6_UPDATE.zip" "$RUNNER_TEMP/v286-b/VF_Infra_V2.8.6_UPDATE.zip"
          php "$RUNNER_TEMP/v286-a/repair-v2.8.6.php" --self-test | tee /tmp/v286-selftest.txt
          grep -Fq 'ATOMIC_SELF_TEST_PASS target=2.8.6 schema=14' /tmp/v286-selftest.txt
          jq -e '.version=="2.8.6" and .schema==14 and .allowed_source_versions==["2.7.9","2.8.0","2.8.1","2.8.2","2.8.3","2.8.4","2.8.5"] and .diagnostics_partial_failure_resilience==true and .diagnostics_manual_run_busy_feedback==true and .source_exact_reconciliation==true and .post_repair_manifest_integrity_required==true' "$RUNNER_TEMP/v286-a/PACKAGE_MANIFEST.json" >/dev/null
          unzip -t "$RUNNER_TEMP/v286-a/VF_Infra_V2.8.6_UPDATE.zip" >/dev/null
          test "$(unzip -Z1 "$RUNNER_TEMP/v286-a/VF_Infra_V2.8.6_UPDATE.zip")" = 'repair-v2.8.6.php'
          echo P04_V286_DIAGNOSTICS_HOTFIX_GATE_PASS
          echo PRODUCTION_WRITE=0

      - name: Commit exact tested hotfix to P04 branch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VERSION CHANGELOG.md docs/operations/package/RELEASE_NOTES.md src/app/SystemDiagnosticsService.php public/assets/v284-long-action-feedback.js scripts/build-release-tree.py scripts/build-v286-update-release.py
          test -n "$(git diff --cached --name-only)"
          git commit -m 'fix(P04): make system diagnostics responsive and resilient'
          git push origin HEAD:"$SOURCE_BRANCH"
          echo "P04_V286_TESTED_COMMIT=$(git rev-parse HEAD)"
          echo PRODUCTION_WRITE=0
