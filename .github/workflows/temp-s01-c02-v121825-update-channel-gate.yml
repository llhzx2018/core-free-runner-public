name: TEMP S01-C02 Ops 1.21.825 Update Channel Gate
on:
  push:
    branches: [temp/s01-c02-v121825-update-channel-gate-20260905]
    paths: ['.github/workflows/temp-s01-c02-v121825-update-channel-gate.yml']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UPDATE_REPO: llhzx2018/core-updates
      UPDATE_SHA: 9a7e5ff528c0d2c920b30ce7ecc0e8fa8b219fa5
      UPDATE_BASE: cf46456a7e594c5a57459b16c13fae21219f8a41
      PRODUCT_REPO: llhzx2018/vf-tools-ops
      PRODUCT_SHA: 28e979580704fb9f6936a0f02d478cf8871ad15d
      PRODUCT_TREE: 2982a422a92b10965431bede6f1480b995ef1c12
      TAG: v1.21.825
      ASSET: vf-tools-ops_V1.21.825.zip
      BYTES: '3242663'
      SHA256: c71fe90ccc4a7d5dcad039e37d4f5787cac0e09b45f7819f50971fb835dc5360
      FP: b6fd6f281a6226861ebfb13594e3228e7d3fd8168e49707b4b317cd158b30341
    steps:
      - name: Checkout exact update candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.UPDATE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: updates
      - name: Verify manifest source scope and formal release
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C updates rev-parse HEAD)" = "$UPDATE_SHA"
          test "$(git -C updates rev-list --count "$UPDATE_BASE".."$UPDATE_SHA")" = 1
          test "$(git -C updates rev-list --count "$UPDATE_SHA".."$UPDATE_BASE")" = 0
          test "$(git -C updates diff --name-only "$UPDATE_BASE".."$UPDATE_SHA")" = projects/S01-C02.json
          M=updates/projects/S01-C02.json
          test "$(jq -r .target_version "$M")" = 1.21.825
          test "$(jq -r '.from_versions|join(",")' "$M")" = 1.21.824
          test "$(jq -r .release_tag "$M")" = "$TAG"
          test "$(jq -r .asset_name "$M")" = "$ASSET"
          test "$(jq -r .asset_bytes "$M")" = "$BYTES"
          test "$(jq -r .asset_sha256 "$M")" = "$SHA256"
          test "$(jq -r .runtime_file_count "$M")" = 907
          test "$(jq -r .runtime_fingerprint_sha256 "$M")" = "$FP"
          L="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$PRODUCT_REPO/releases/tags/$TAG")"
          test "$(jq -r .draft <<<"$L")" = false
          test "$(jq -r .prerelease <<<"$L")" = false
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.size' <<<"$L")" = "$BYTES"
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.digest' <<<"$L")" = "sha256:$SHA256"
          for b in main develop; do
            B="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$PRODUCT_REPO/branches/$b")"
            test "$(jq -r .commit.sha <<<"$B")" = "$PRODUCT_SHA"
            test "$(jq -r .commit.commit.tree.sha <<<"$B")" = "$PRODUCT_TREE"
          done
          echo MANIFEST_RELEASE_AUTHORITY=PASS
      - name: Verify direct Production source authority
        shell: bash
        run: |
          set -Eeuo pipefail
          D="$(curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-domain-authority')"
          S="$(curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-static-candidate-readiness')"
          test "$(jq -r .pluginVersion <<<"$D")" = 1.21.824
          test "$(jq -r .authorityFinalHost <<<"$D")" = https://ilovem3u8.com
          test "$(jq -r .configuredPublicBaseUrl <<<"$D")" = https://ilovem3u8.com
          test "$(jq -r .authorityMatch <<<"$D")" = true
          test "$(jq -r .candidatePackageReady <<<"$S")" = false
          test "$(jq -r .activeStaticJobStatus <<<"$S")" = FAIL
          test "$(jq -r .manualSourceUploadRequired <<<"$S")" = false
          test "$(jq -r .finalOnlinePass <<<"$S")" = NO
          echo PRODUCTION_PREUPDATE_AUTHORITY=PASS
