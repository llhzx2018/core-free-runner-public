name: P01 V2.37.1 Published Authority Checkpoint R2
on:
  push:
    branches:
      - run/p01-v2371-published-checkpoint-20260902
    paths:
      - .github/workflows/p01-v2371-published-checkpoint-20260902.yml
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE: 0838e47ec49bb961131da81b0b314ebf77f1e126
      BRANCH: docs/p01-v2371-published-checkpoint-20260902
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: run/p01-v2371-published-checkpoint-20260902
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: docs/p01-v2371-published-checkpoint-20260902
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Fresh source fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$BASE"
          git -C product fetch origin main
          test "$(git -C product rev-parse origin/main)" = "$BASE"
          test "$(cat product/VERSION)" = 2.37.1
      - name: Write published authority checkpoint
        run: python3 runner/scripts/p01_v2371_published_checkpoint.py
      - name: Exact docs-only gate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          python3 -m json.tool VF_PROJECT.json >/dev/null
          test "$(cat VERSION)" = 2.37.1
          jq -e '.production_version=="2.37.0" and .published_release.version=="2.37.1" and .published_release.release_id==380993116 and .published_release.live_core_updates_commit=="1f640592e97a5e670c75cb00cf89adf661f07a16" and .published_release.production_closure=="PENDING OWNER UPDATE" and .schema_version=="2026082901" and .current_change.production_write==false and .current_change.release_completed==true' VF_PROJECT.json >/dev/null
          grep -q 'Owner Production: V2.37.0' README.md
          grep -q 'Published Latest: V2.37.1' README.md
          grep -q 'V2.37.0 → V2.37.1' docs/README.md
          grep -q 'P01_V2371_PUBLISHED_PENDING_OWNER_PRODUCTION' docs/authority/CURRENT.md
          grep -q 'P01_V2371_PUBLISHED_PENDING_OWNER_PRODUCTION' docs/handoff/CURRENT_STATE.md
          grep -q 'P01_V2371_PUBLISHED_CHANGELOG' CHANGELOG.md
          grep -q '33594521454' docs/evidence/P01_V2.37.1_PUBLISHED_PENDING_OWNER_PRODUCTION_20260902.md
          git diff --check
          EXPECTED=$(printf '%s\n' CHANGELOG.md README.md VF_PROJECT.json docs/README.md docs/authority/CURRENT.md docs/evidence/P01_V2.37.1_PUBLISHED_PENDING_OWNER_PRODUCTION_20260902.md docs/handoff/CURRENT_STATE.md | sort)
          ACTUAL=$(git diff --name-only "$BASE" | sort)
          test "$ACTUAL" = "$EXPECTED"
          test -z "$(git diff --name-only "$BASE" -- src VERSION)"
          printf 'P01_V2371_PUBLISHED_AUTHORITY=PASS\nOWNER_PRODUCTION=2.37.0\nPUBLISHED_LATEST=2.37.1\nONLINE_UPDATE=2.37.0_TO_2.37.1_ONLY\nRUNTIME_WRITE=NO\nOWNER_PRODUCTION_WRITE=NO\n'
      - name: Commit authority checkpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add CHANGELOG.md README.md VF_PROJECT.json docs/README.md docs/authority/CURRENT.md docs/evidence/P01_V2.37.1_PUBLISHED_PENDING_OWNER_PRODUCTION_20260902.md docs/handoff/CURRENT_STATE.md
          git commit -m 'docs(P01): record V2.37.1 published checkpoint'
          git push origin HEAD:"$BRANCH"
