name: P01 v516 to v517 exact-current full installed MAJOR offline recovery
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  bridge-atomic:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BRIDGE_SHA: cc92515a4eb782a48b47db7f30703a7fbceb6cf7
      SOURCE_TAG: v2.47.515
      BRIDGE_VERSION: 2.47.516
      TARGET_VERSION: 2.47.517
      TARGET_SHA: 8b613e25b0351f22f0963c5509415fd9747e1f98
      NEXT_SHA: 8b613e25b0351f22f0963c5509415fd9747e1f98
      NEXT_VERSION: 2.47.517
    steps:
      - name: Checkout registered public-safe Runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate ephemeral lane contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_HEAD_REF" = "test/p01-517-current-major-full-integrated-20261116"
          python3 scripts/ephemeral_lane_spec.py validate --spec scripts/ephemeral/p01-v517-full-owner-media-seal.json >"$RUNNER_TEMP/p01-bridge-lane.txt"
          python3 scripts/ephemeral_lane_spec.py audit-rendered --spec scripts/ephemeral/p01-v517-full-owner-media-seal.json --input .github/workflows/p01-v517-full-owner-media-seal.yml >>"$RUNNER_TEMP/p01-bridge-lane.txt"
          grep -F '"status": "PASS"' "$RUNNER_TEMP/p01-bridge-lane.txt" >/dev/null
          echo P01_PHP_BRIDGE_SAFE_ONEOFF_LANE=PASS
      - name: Checkout bridge from exact immutable SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.BRIDGE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: bridge-src
      - name: Checkout Laravel exact immutable SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.NEXT_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: next-src
      - name: PHP extensions and exact source identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C bridge-src rev-parse HEAD)" = "$BRIDGE_SHA"
          test "$(git -C next-src rev-parse HEAD)" = "$NEXT_SHA"
          test "$(cat next-src/VERSION)" = "$NEXT_VERSION"
          test "$(cat next-src/src/VERSION.txt)" = "$NEXT_VERSION"
          test "$(cat bridge-src/VERSION)" = "$BRIDGE_VERSION"
          test "$(cat bridge-src/src/VERSION.txt)" = "$BRIDGE_VERSION"
          test "$(grep -Foc "define('VF_VERSION', '2.47.516');" bridge-src/src/app/bootstrap.php)" = 1
          sudo apt-get update -qq > "$RUNNER_TEMP/p01-bridge-apt.txt" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php8.3-cli php8.3-curl php8.3-zip php8.3-mbstring php8.3-sqlite3 php8.3-gd php8.3-xml composer unzip curl >> "$RUNNER_TEMP/p01-bridge-apt.txt" 2>&1
          php8.3 -l bridge-src/src/app/LegacyMajorWriteFreeze.php >/dev/null
          php8.3 -l bridge-src/src/app/LegacyMajorFullRestorePoint.php >/dev/null
          php8.3 -l bridge-src/src/app/LegacyMajorVerifiedFullExtractor.php >/dev/null
          php8.3 -l bridge-src/src/app/bin/p01-major-apply-worker.php >/dev/null
          php8.3 -l bridge-src/tests/compatibility/laravel/http/p01_bridge_v516_major_package_stage.php >/dev/null
          php8.3 -l bridge-src/src/app/LegacyMajorManualRootReadiness.php >/dev/null
          php8.3 -l next-src/src/app/next/runtime/MajorBridgeRestoreIntake.php >/dev/null
          php8.3 -l next-src/src/app/next/runtime/MajorOfflineNextInstall.php >/dev/null
          php8.3 -l next-src/tests/compatibility/laravel/http/p01_bridge_archive_intake.php >/dev/null
          php8.3 -l bridge-src/src/app/LegacyMajorMigrationReadiness.php >/dev/null
          php8.3 -l bridge-src/src/app/LegacyMajorOwnerHandoff.php >/dev/null
          php8.3 -l bridge-src/src/api.php >/dev/null
          php8.3 -l bridge-src/src/app/UpdateManager.php >/dev/null
          php8.3 -l bridge-src/src/app/CoreUpdates/GitHubClient.php >/dev/null
          PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile bridge-src/scripts/build_p01_247516_legacy_atomic.py
          echo P01_BRIDGE_EXACT_SOURCE_AND_PHP83_SYNTAX=PASS
      - name: Download official immutable v515 FULL and UPDATE assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          BASE="$RUNNER_TEMP/p01-bridge-base"
          mkdir -p "$BASE/full" "$BASE/repair"
          gh release download v2.47.515 -R llhzx2018/vf-start -D "$BASE" -p 'VF-Start-V2.47.515-FULL.zip' -p 'VF_Start_V2.47.515_UPDATE.zip' >"$RUNNER_TEMP/p01-bridge-download.txt" 2>&1
          test "$(sha256sum "$BASE/VF-Start-V2.47.515-FULL.zip" | cut -d' ' -f1)" = 5ee0c031dda82c53353929dc4519b0cc1b647b2af82a1bcd8a27a03ab7866778
          test "$(sha256sum "$BASE/VF_Start_V2.47.515_UPDATE.zip" | cut -d' ' -f1)" = 3a5e6528e8ef1204ef1fc4f6d4568aad0634dced649200f5744df5cb9c082556
          unzip -q "$BASE/VF-Start-V2.47.515-FULL.zip" -d "$BASE/full"
          unzip -q "$BASE/VF_Start_V2.47.515_UPDATE.zip" -d "$BASE/repair"
          test -f "$BASE/repair/repair-v2.47.515.php"
          echo P01_BRIDGE_REAL_OLD_RELEASE_FULL_UPDATE_SHA=PASS
      - name: Build bounded bridge FULL and journal capable Atomic ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE="$RUNNER_TEMP/p01-bridge-base"
          PYTHONDONTWRITEBYTECODE=1 python3 -B bridge-src/scripts/build_p01_247516_legacy_atomic.py --candidate bridge-src/src --baseline-full-dir "$BASE/full" --baseline-repair "$BASE/repair/repair-v2.47.515.php" --runner-atomic-engine scripts/p01-build-release-v2.py --target-sha "$BRIDGE_SHA" --output-dir "$RUNNER_TEMP/p01-bridge-out" >"$RUNNER_TEMP/p01-bridge-build.txt" 2>&1 || {
            grep -Eo '(P01_247516_BRIDGE_[A-Z0-9_]{4,96}|BridgeError|Traceback|RuntimeError)' "$RUNNER_TEMP/p01-bridge-build.txt" | sort -u | head -n 12 || true
            exit 1
          }
          test -f "$RUNNER_TEMP/p01-bridge-out/VF_Start_V2.47.516_UPDATE-DEV-ONLY.zip"
          test -f "$RUNNER_TEMP/p01-bridge-out/VF-Start-V2.47.516-FULL-DEV-ONLY.zip"
          test "$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['status'])" "$RUNNER_TEMP/p01-bridge-out/bridge-candidate-receipt.json")" = DEVELOPER_ISOLATED_ONLY
          echo P01_BRIDGE_516_DEVELOPER_ATOMIC_FULL_ARTIFACTS=PASS
      - name: Prepare official-named v516 FULL and UPDATE content without publishing GitHub
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE="$RUNNER_TEMP/p01-bridge-base"
          OUT="$RUNNER_TEMP/p01-bridge-official-content"
          PYTHONDONTWRITEBYTECODE=1 python3 -B bridge-src/scripts/build_p01_247516_legacy_atomic.py --candidate bridge-src/src --baseline-full-dir "$BASE/full" --baseline-repair "$BASE/repair/repair-v2.47.515.php" --runner-atomic-engine scripts/p01-build-release-v2.py --target-sha "$BRIDGE_SHA" --output-dir "$OUT" --prepare-official-content >"$RUNNER_TEMP/p01-v516-official-contents.txt" 2>&1 || {
            grep -Eo '(P01_247516_BRIDGE_[A-Z0-9_]{4,96}|BridgeError|RuntimeError|AssertionError)' "$RUNNER_TEMP/p01-v516-official-contents.txt" | sort -u | head -n 14 || true
            exit 1
          }
          export P01_OFFLINE_RELEASE_OUT="$OUT"
          python3 - <<'PY'
          import json,os,zipfile
          from pathlib import Path
          p=Path(os.environ["P01_OFFLINE_RELEASE_OUT"])
          full=p/"VF-Start-V2.47.516-FULL.zip"
          update=p/"VF_Start_V2.47.516_UPDATE.zip"
          result=json.loads((p/"bridge-candidate-receipt.json").read_text())
          assert result["status"]=="OFFICIAL_CONTENT_PREPARED_NOT_PUBLISHED"
          assert result["source_git_sha"]==os.environ["BRIDGE_SHA"]
          assert result["real_github_release_or_channel_verified"] is False
          assert result["owner_prod_installable"] is False
          assert result["can_publish"] is False
          assert full.is_file() and update.is_file()
          with zipfile.ZipFile(full) as z:
              m=json.loads(z.read("release-manifest.json"))
              assert m["stage"]=="OFFICIAL_ARTIFACT_CONTENT"
              assert m["deployable"] is True
              assert m["source_commit"]==os.environ["BRIDGE_SHA"]
              assert m["version"]=="2.47.516"
              assert "app/bin/p01-major-apply-worker.php" in m["runtime_files"]
              assert "app/LegacyMajorFullRestorePoint.php" in m["runtime_files"]
              assert "app/LegacyMajorVerifiedFullExtractor.php" in m["runtime_files"]
              assert not any(".vfnav-data-" in n or "private/" in n for n in z.namelist())
          with zipfile.ZipFile(update) as z:
              assert z.namelist()==["repair-v2.47.516.php"]
          PY
          echo P01_516_OFFICIAL_NAMED_CONTENT_AND_SOURCE_LEDGER_UNPUBLISHED=PASS
      - name: Real old v515 install then v516 Atomic success and interrupted rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          export BASE="$RUNNER_TEMP/p01-bridge-base" OUT="$RUNNER_TEMP/p01-bridge-out" WORK="$RUNNER_TEMP/p01-bridge-work"
          mkdir -p "$WORK"/{upgrade,rollback,repair}
          unzip -q "$OUT/VF_Start_V2.47.516_UPDATE-DEV-ONLY.zip" -d "$WORK/repair"
          REPAIR="$WORK/repair/repair-v2.47.516.php"
          test "$(unzip -Z1 "$OUT/VF_Start_V2.47.516_UPDATE-DEV-ONLY.zip")" = repair-v2.47.516.php
          php8.3 -l "$REPAIR" >/dev/null
          php8.3 "$REPAIR" --self-test >"$RUNNER_TEMP/p01-bridge-selftest.txt"
          grep -Fq '"ok":true' "$RUNNER_TEMP/p01-bridge-selftest.txt"
          test -z "$(unzip -Z1 "$OUT/VF-Start-V2.47.516-FULL-DEV-ONLY.zip" | grep -Ei '(^|/)(\.runtime\.php|.*\.sqlite3?$|.*\.db$|private/|backups?/|sessions?/|tokens?/|staging/)' || true)"
          cp -a "$BASE/full/." "$WORK/upgrade/"
          cp -a "$BASE/full/." "$WORK/rollback/"
          install_old() {
            local dir="$1" port="$2"
            (cd "$dir" && php8.3 -S 127.0.0.1:"$port" -t . > "$RUNNER_TEMP/p01-bridge-http-$port.txt" 2>&1 & echo $! > "$RUNNER_TEMP/p01-bridge-http-$port.pid")
            local cookie="$RUNNER_TEMP/p01-bridge-cookie-$port.txt"
            local ready=0
            for i in $(seq 1 35); do
              if curl -fsS -c "$cookie" -b "$cookie" "http://127.0.0.1:$port/setup.php" > "$RUNNER_TEMP/p01-bridge-page-$port.html" 2>/dev/null; then ready=1;break;fi
              sleep 1
            done
            test "$ready" -eq 1
            local csrf
            csrf="$(python3 - "$RUNNER_TEMP/p01-bridge-page-$port.html" <<'PY'
          import re,sys
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',open(sys.argv[1],encoding="utf-8").read())
          assert m, "missing old setup csrf"
          print(m.group(1))
          PY
          )"
            curl -fsS -c "$cookie" -b "$cookie" -X POST "http://127.0.0.1:$port/setup.php" --data-urlencode "setup_csrf=$csrf" --data-urlencode "site_title=Bridge Test" --data-urlencode "admin_password=BridgePassword-2026!" --data-urlencode "admin_password_confirm=BridgePassword-2026!" > "$RUNNER_TEMP/p01-bridge-setup-$port.html"
            (cd "$dir" && php8.3 cli/verify.php) | grep -Fx VERIFY_PASS=YES
            kill "$(cat "$RUNNER_TEMP/p01-bridge-http-$port.pid")" || true
          }
          install_old "$WORK/upgrade" 19416
          install_old "$WORK/rollback" 19417
          cp "$REPAIR" "$WORK/upgrade/repair-v2.47.516.php"
          php8.3 "$WORK/upgrade/repair-v2.47.516.php" --verify-source="$WORK/upgrade" > "$RUNNER_TEMP/p01-bridge-verify-source.txt"
          grep -Fq '"ok":true' "$RUNNER_TEMP/p01-bridge-verify-source.txt"
          php8.3 "$WORK/upgrade/repair-v2.47.516.php" --run="$WORK/upgrade" > "$RUNNER_TEMP/p01-bridge-success.txt"
          grep -Fq '"ok":true' "$RUNNER_TEMP/p01-bridge-success.txt"
          test "$(cat "$WORK/upgrade/VERSION.txt")" = 2.47.516
          (cd "$WORK/upgrade" && php8.3 cli/verify.php) | grep -Fx VERIFY_PASS=YES
          php8.3 -r 'require $argv[1]."/app/bootstrap.php"; $m=new VfUpdateManager(vf_db()); $x=$m->status(); if(($x["major_migration"]["from_version"]??"")!=="2.47.516"||($x["major_migration"]["to_version"]??"")!=="2.47.517"||($x["major_migration"]["can_execute"]??true)!==false) exit(33); echo "P01_BRIDGE_MAJOR_STATUS_NOT_EXECUTABLE=PASS\n";' "$WORK/upgrade"
          echo P01_BRIDGE_OLD_515_TO_516_REAL_ATOMIC_INSTALL=PASS
          cp "$REPAIR" "$WORK/rollback/repair-v2.47.516.php"
          set +e
          VF_ATOMIC_TEST_FAIL_AFTER_APPLY=1 php8.3 "$WORK/rollback/repair-v2.47.516.php" --run="$WORK/rollback" >"$RUNNER_TEMP/p01-bridge-failure.txt" 2>&1
          code=$?
          set -e
          test "$code" -ne 0
          test "$(cat "$WORK/rollback/VERSION.txt")" = 2.47.515
          (cd "$WORK/rollback" && php8.3 cli/verify.php) | grep -Fx VERIFY_PASS=YES
          echo P01_BRIDGE_FAILURE_INJECTION_ROLLBACK=PASS
          # New official-named package bytes must pass REAL 515→516
          # Owner install and injected rollback, not merely ZIP metadata.
          mkdir -m 700 "$WORK/release-success" "$WORK/release-failure"
          cp -a "$BASE/full/." "$WORK/release-success/"
          cp -a "$BASE/full/." "$WORK/release-failure/"
          install_old "$WORK/release-success" 19418
          install_old "$WORK/release-failure" 19419
          OFF="$RUNNER_TEMP/p01-bridge-official-content"
          mkdir -m 700 "$WORK/release-repair"
          unzip -q "$OFF/VF_Start_V2.47.516_UPDATE.zip" -d "$WORK/release-repair"
          cp "$WORK/release-repair/repair-v2.47.516.php" "$WORK/release-success/repair-v2.47.516.php"
          cp "$WORK/release-repair/repair-v2.47.516.php" "$WORK/release-failure/repair-v2.47.516.php"
          php8.3 "$WORK/release-success/repair-v2.47.516.php" --verify-source="$WORK/release-success" > "$RUNNER_TEMP/p01-release-verify.txt"
          grep -Fq '"ok":true' "$RUNNER_TEMP/p01-release-verify.txt"
          php8.3 "$WORK/release-success/repair-v2.47.516.php" --run="$WORK/release-success" > "$RUNNER_TEMP/p01-release-apply.txt"
          grep -Fq '"ok":true' "$RUNNER_TEMP/p01-release-apply.txt"
          (cd "$WORK/release-success" && php8.3 cli/verify.php) | grep -Fx VERIFY_PASS=YES
          python3 - "$WORK/release-success/release-manifest.json" "$BRIDGE_SHA" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x["stage"]=="OFFICIAL_ARTIFACT_CONTENT"
          assert x["deployable"] is True
          assert x["source_commit"]==sys.argv[2]
          PY
          set +e
          VF_ATOMIC_TEST_FAIL_AFTER_APPLY=1 php8.3 "$WORK/release-failure/repair-v2.47.516.php" --run="$WORK/release-failure" > "$RUNNER_TEMP/p01-release-rollback.txt" 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          test "$(cat "$WORK/release-failure/VERSION.txt")" = "2.47.515"
          (cd "$WORK/release-failure" && php8.3 cli/verify.php) | grep -Fx VERIFY_PASS=YES
          echo P01_516_OFFICIAL_NAMED_FULL_REAL_ATOMIC_AND_ROLLBACK=PASS

      - name: Real installed PHP v516 Owner HTTP availability and no guest stage
        shell: bash
        run: |
          set -Eeuo pipefail
          SITE="$RUNNER_TEMP/p01-bridge-work/upgrade"
          test "$(cat "$SITE/VERSION.txt")" = "2.47.516"
          php8.3 -S 127.0.0.1:19425 -t "$SITE" >"$RUNNER_TEMP/p01-bridge-http-stage.txt" 2>&1 &
          echo $! >"$RUNNER_TEMP/p01-bridge-http-stage.pid"
          ready=0
          for attempt in $(seq 1 35); do
            if curl --noproxy '*' -fsS 'http://127.0.0.1:19425/api.php?action=health' >/dev/null; then ready=1;break;fi
            sleep 1
          done
          test "$ready" -eq 1
          guest="$(curl --noproxy '*' -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' 'http://127.0.0.1:19425/api.php?action=update_major_stage')"
          case "$guest" in 401|403) ;; *) echo 'P01_MAJOR_STAGE_GUEST_AUTH=FAIL'; exit 1;; esac
          cookies="$RUNNER_TEMP/p01-bridge-stage.cookie"
          curl --noproxy '*' -fsS -b "$cookies" -c "$cookies"             -X POST -H 'Content-Type: application/json'             --data '{"password":"BridgePassword-2026!"}'             'http://127.0.0.1:19425/api.php?action=login'             >"$RUNNER_TEMP/p01-bridge-stage-login.json"
          csrf="$(python3 -c 'import json,sys;r=json.load(open(sys.argv[1]));assert r.get("ok") and r.get("csrf");print(r["csrf"])' "$RUNNER_TEMP/p01-bridge-stage-login.json")"
          curl --noproxy '*' -fsS -b "$cookies" -c "$cookies"             -X POST -H "X-CSRF-Token: $csrf" -H 'Content-Type: application/json'             --data '{}'             'http://127.0.0.1:19425/api.php?action=update_major_available'             >"$RUNNER_TEMP/p01-bridge-stage-available.json"
          python3 -c 'import json,sys;r=json.load(open(sys.argv[1]));assert r.get("ok") is True and r.get("available") is False and r.get("can_execute") is False' "$RUNNER_TEMP/p01-bridge-stage-available.json"
          test -z "$(find "$SITE" -maxdepth 3 -name p01-major-owner-intent.json -o -name p01-major-package-stage.json)"
          echo P01_V516_REAL_OWNER_HTTP_UNPUBLISHED_NO_INTENT_GUEST_DENIED=PASS
      - name: Add synthetic Owner media and otherwise-unmapped private fixture BEFORE authenticated v516 backup
        shell: bash
        run: |
          set -Eeuo pipefail
          php8.3 -r '
            require $argv[1]."/app/bootstrap.php";
            if(!vf_is_installed())exit(33);
            $dir=VF_PRIVATE_ROOT."/user-icons";
            if(!is_dir($dir)&&!mkdir($dir,0700))exit(34);
            if(file_exists($dir."/d65-synthetic.png")
               ||file_exists(VF_PRIVATE_ROOT."/owner-unknown-note.txt"))exit(35);
            file_put_contents($dir."/d65-synthetic.png",
                "P01 synthetic Owner icon bytes only - no personal data");
            file_put_contents(VF_PRIVATE_ROOT."/owner-unknown-note.txt",
                "P01 synthetic unclassified protected file");
            chmod($dir."/d65-synthetic.png",0600);
            chmod(VF_PRIVATE_ROOT."/owner-unknown-note.txt",0600);
          ' "$RUNNER_TEMP/p01-bridge-work/upgrade"
          echo P01_V516_SYNTHETIC_ICON_AND_PRIVATE_UNMAPPED_INPUT=PASS
      - name: Real installed Owner stage CLI and unpublished major fail closed
        shell: bash
        run: |
          set -Eeuo pipefail
          for file in bridge-src/src/app/LegacyMajorPackageStage.php bridge-src/src/app/LegacyMajorTrustedOwnerReleaseGate.php bridge-src/src/app/bin/p01-major-stage-worker.php bridge-src/tests/compatibility/laravel/http/p01_bridge_v516_major_package_stage.php; do
            php8.3 -l "$file" >/dev/null
          done
          node --check bridge-src/src/assets/update-core.js
          if ! P01_BRIDGE_STAGE_ISOLATED=YES php8.3 bridge-src/tests/compatibility/laravel/http/p01_bridge_v516_major_package_stage.php "$RUNNER_TEMP/p01-bridge-work/upgrade" >"$RUNNER_TEMP/p01-bridge-major-test.txt" 2>&1; then
            grep -Eo '(MAJOR_[A-Z_]{3,85}|P01_MAJOR_STAGE_TEST_[A-Z0-9_]{3,95}|Fatal error|Uncaught [A-Za-z0-9_]+|TypeError)' "$RUNNER_TEMP/p01-bridge-major-test.txt" | sort -u | head -n 12 || true
            exit 1
          fi
          grep -Fx 'P01_V516_APPLY_SEALED_NATIVE_MANUAL_ROOT_ONLY_GUARD=PASS' "$RUNNER_TEMP/p01-bridge-major-test.txt"
          grep -Fx 'P01_V516_REAL_INSTALLED_FULL_RESCUE_POINT=PASS' "$RUNNER_TEMP/p01-bridge-major-test.txt"
          grep -Fx 'P01_V516_REAL_SQLITE_WAL_AND_INDEPENDENT_RESTORE=PASS' "$RUNNER_TEMP/p01-bridge-major-test.txt"
          grep -Fx 'P01_V516_RESCUE_OFF_WEBROOT_TAMPER_REPLAY_DENIED=PASS' "$RUNNER_TEMP/p01-bridge-major-test.txt"
          grep -Fx 'P01_V516_CLOUDPANEL_AND_PRODUCTION_NOT_TOUCHED=PASS' "$RUNNER_TEMP/p01-bridge-major-test.txt"
          grep -Fx 'P01_V516_MANUAL_CP_MAINTENANCE_PAGE_READY_ONLY=PASS' "$RUNNER_TEMP/p01-bridge-major-test.txt"
          grep -Fx 'P01_V516_NO_CLOUDPANEL_CONTROL_AND_NO_PREMATURE_SWITCH=PASS' "$RUNNER_TEMP/p01-bridge-major-test.txt"
          grep -Fx 'P01_V516_ACTUAL_OWNER_INTENT_STAGE_ONE_USE=PASS' "$RUNNER_TEMP/p01-bridge-major-test.txt"
          grep -Fx 'P01_V516_UNPUBLISHED_OFFICIAL_MAJOR_BLOCKED=PASS' "$RUNNER_TEMP/p01-bridge-major-test.txt"
          grep -Fx 'P01_V516_SPOOF_REPLAY_TAMPER_FAIL_CLOSED=PASS' "$RUNNER_TEMP/p01-bridge-major-test.txt"
          grep -Fx 'P01_V516_OLD_SQLITE_OWNER_CODE_UNTOUCHED=PASS' "$RUNNER_TEMP/p01-bridge-major-test.txt"
          grep -Fx 'P01_V516_PRODUCTION_CLOUDPANEL_MIGRATION_EXECUTED=NO' "$RUNNER_TEMP/p01-bridge-major-test.txt"
      - name: Build and verify exact native Laravel 13 CloudPanel FULL; extract only in disposable private root
        shell: bash
        run: |
          set -Eeuo pipefail
          (cd next-src && python3 scripts/build_p01_next_clean_full.py build --source-sha "$NEXT_SHA" --output "$RUNNER_TEMP/p01-v517-clean-full.zip" --composer composer >"$RUNNER_TEMP/p01-v517-build.txt" 2>&1) || {
            grep -Eo '(P01_[A-Z0-9_]{4,90}|BuildError|Traceback|error:)' "$RUNNER_TEMP/p01-v517-build.txt" | sort -u | head -n 10 || true
            exit 1
          }
