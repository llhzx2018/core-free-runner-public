name: TEMP S01-C03 1.25.6 Recovery Bridge Formal Gate

on:
  push:
    branches:
      - temp/s01-release-prep-gate-20260902
    paths:
      - .github/workflows/temp-s01-c03-v1256-recovery-bridge-gate.yml

permissions:
  contents: read

concurrency:
  group: temp-s01-c03-v1256-recovery-bridge-gate
  cancel-in-progress: true

env:
  BASE_SHA: 2551f1f0a4045012eea5759169cd96d07aab8215
  CANDIDATE_SHA: 72d2a1ca9400a3a3530a90974758b7135a7039d2
  WP_VERSION: '7.1'
  WP_PATH: /tmp/vf-s01-v1256-wp
  EVIDENCE_DIR: /tmp/vf-s01-v1256-formal-gate-evidence
  PACKAGE_DIR: /tmp/vf-s01-v1256-packages
  V1254_ASSET_ID: '540225036'
  V1254_BYTES: '3524539'
  V1254_SHA256: 797ee12ea864219880792d7c23530d1df15a609f6792f7bb5fa79361fbbe1c84

jobs:
  recovery-bridge-formal-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: vf_s01_v1256
          MARIADB_USER: vf
          MARIADB_PASSWORD: vf
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout exact 1.25.6 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: ${{ env.CANDIDATE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: m3u8

      - name: Provision PHP 8.3 gate runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: mysqli,curl,zip,mbstring,xml,json,openssl
          coverage: none

      - name: Exact identity and four-file release boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR" "$PACKAGE_DIR"
          test "$(git -C m3u8 rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C m3u8 rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git -C m3u8 merge-base "$BASE_SHA" "$CANDIDATE_SHA")" = "$BASE_SHA"
          git -C m3u8 fetch origin main --quiet
          test "$(git -C m3u8 rev-parse origin/main)" = "$BASE_SHA"
          git -C m3u8 diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" | LC_ALL=C sort > /tmp/v1256-actual.txt
          printf '%s\n' VERSION src/PACKAGE_PROFILE.json src/plugin-manifest.json src/vf-tool-m3u8.php | LC_ALL=C sort > /tmp/v1256-expected.txt
          diff -u /tmp/v1256-expected.txt /tmp/v1256-actual.txt
          test "$(git -C m3u8 diff --numstat "$BASE_SHA" "$CANDIDATE_SHA" | awk '{a+=$1;d+=$2} END{print a ":" d}')" = '11:11'
          git -C m3u8 diff --check "$BASE_SHA" "$CANDIDATE_SHA"
          test "$(tr -d '\r\n' < m3u8/VERSION)" = '1.25.6'
          grep -Fq ' * Version: 1.25.6' m3u8/src/vf-tool-m3u8.php
          grep -Fq "define('VF_TOOL_M3U8_VERSION', '1.25.6')" m3u8/src/vf-tool-m3u8.php
          grep -Fq "define('VF_TOOL_M3U8_ROUND', 'R230')" m3u8/src/vf-tool-m3u8.php
          grep -Fq "return 'R230_ONLINE_UPDATE_CONTRACT_RECOVERY';" m3u8/src/vf-tool-m3u8.php
          php -r '$j=json_decode(file_get_contents("m3u8/src/PACKAGE_PROFILE.json"),true,512,JSON_THROW_ON_ERROR); if(($j["pluginVersion"]??"")!=="1.25.6"||($j["version"]??"")!=="1.25.6"||($j["round"]??"")!=="R230") exit(1);'
          php -r '$j=json_decode(file_get_contents("m3u8/src/plugin-manifest.json"),true,512,JSON_THROW_ON_ERROR); if(($j["pluginVersion"]??"")!=="1.25.6"||($j["version"]??"")!=="1.25.6"||($j["round"]??"")!=="R230") exit(1);'
          php -r 'define("ABSPATH","/tmp/wp/"); require "m3u8/src/includes/v6-provider-schema.php"; if(vf_tools_m3u8_v6_schema_version()!=="1.3.0") exit(1); echo "PROVIDER_SCHEMA=1.3.0\n";'
          printf '%s\n' "BASE_SHA=$BASE_SHA" "CANDIDATE_SHA=$CANDIDATE_SHA" "CANDIDATE_TREE=$(git -C m3u8 rev-parse HEAD^{tree})" "DIFF=4_FILES_11_11" > "$EVIDENCE_DIR/identity.txt"

      - name: PHP lint and recovery contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          php -v | tee "$EVIDENCE_DIR/php-version.txt"
          find m3u8/src -type f -name '*.php' -print0 | LC_ALL=C sort -z | xargs -0 -n1 php -l > "$EVIDENCE_DIR/php-lint-src.txt"
          php -l m3u8/scripts/s01-c03-bootstrap-upgrade-1254.php | tee "$EVIDENCE_DIR/lint-bootstrap.txt"
          php -l m3u8/tests/unit/update-schema-authority-contract.php | tee "$EVIDENCE_DIR/lint-schema-authority.txt"
          php -l m3u8/tests/unit/bootstrap-upgrade-contract.php | tee "$EVIDENCE_DIR/lint-bootstrap-contract.txt"
          php -l m3u8/tests/unit/schema-repair-contract.php | tee "$EVIDENCE_DIR/lint-schema-repair.txt"
          php m3u8/tests/unit/update-schema-authority-contract.php | tee "$EVIDENCE_DIR/schema-authority-contract.txt"
          php m3u8/tests/unit/bootstrap-upgrade-contract.php | tee "$EVIDENCE_DIR/bootstrap-contract.txt"
          php m3u8/tests/unit/schema-repair-contract.php | tee "$EVIDENCE_DIR/schema-repair-contract.txt"

      - name: Build deterministic 1.25.6 package and seal runtime fingerprint
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          m3=Path('m3u8'); root=m3/'src'; out=Path('/tmp/vf-s01-v1256-packages'); ev=Path('/tmp/vf-s01-v1256-formal-gate-evidence')
          files={p.relative_to(root).as_posix():p.read_bytes() for p in root.rglob('*') if p.is_file() and not p.is_symlink()}
          files=dict(sorted(files.items()))
          assert len(files)==550, len(files)
          canon=''.join(f'{rel}\0{hashlib.sha256(data).hexdigest()}\n' for rel,data in files.items())
          runtime_fp=hashlib.sha256(canon.encode()).hexdigest()
          zpath=out/'vf-tools-m3u8_V1.25.6.zip'
          with zipfile.ZipFile(zpath,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for rel,data in files.items():
                  zi=zipfile.ZipInfo(f'vf-tool-m3u8/{rel}',(2026,9,2,0,0,0))
                  zi.compress_type=zipfile.ZIP_DEFLATED
                  zi.external_attr=0o100644<<16
                  z.writestr(zi,data)
          with zipfile.ZipFile(zpath) as z:
              assert z.testzip() is None
              assert len([i for i in z.infolist() if not i.is_dir()])==550
              main=z.read('vf-tool-m3u8/vf-tool-m3u8.php').decode('utf-8')
              assert main.count(' * Version: 1.25.6')==1
              assert "define('VF_TOOL_M3U8_ROUND', 'R230')" in main
              assert "R230_ONLINE_UPDATE_CONTRACT_RECOVERY" in main
              assert 'scripts/s01-c03-bootstrap-upgrade-1254.php' not in z.namelist()
          audit={
            'status':'PASS','source_sha':'72d2a1ca9400a3a3530a90974758b7135a7039d2','base_sha':'2551f1f0a4045012eea5759169cd96d07aab8215',
            'version':'1.25.6','round':'R230','provider_schema':'1.3.0','package':'vf-tools-m3u8_V1.25.6.zip',
            'zip_files':len(files),'zip_bytes':zpath.stat().st_size,'zip_sha256':hashlib.sha256(zpath.read_bytes()).hexdigest(),
            'runtime_files':len(files),'runtime_fingerprint_sha256':runtime_fp,
            'bootstrap_script_in_plugin_zip':False
          }
          (ev/'release-package-audit.json').write_text(json.dumps(audit,indent=2)+'\n')
          pkgdir=ev/'package'; pkgdir.mkdir(exist_ok=True); (pkgdir/zpath.name).write_bytes(zpath.read_bytes())
          print(json.dumps(audit,indent=2))
          PY
          jq -e '.status=="PASS" and .version=="1.25.6" and .round=="R230" and .provider_schema=="1.3.0" and .zip_files==550 and .runtime_files==550 and .bootstrap_script_in_plugin_zip==false' "$EVIDENCE_DIR/release-package-audit.json"

      - name: Download and verify official v1.25.4 release source
        shell: bash
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          OLDZIP="$PACKAGE_DIR/vf-tools-m3u8_V1.25.4.zip"
          curl -fsSL \
            -H "Authorization: Bearer $VF_PRIVATE_READ_TOKEN" \
            -H 'Accept: application/octet-stream' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/llhzx2018/vf-tools-m3u8/releases/assets/$V1254_ASSET_ID" \
            -o "$OLDZIP"
          test "$(stat -c%s "$OLDZIP")" = "$V1254_BYTES"
          test "$(sha256sum "$OLDZIP" | awk '{print $1}')" = "$V1254_SHA256"
          python3 - "$OLDZIP" <<'PY'
          import sys,zipfile,re
          p=sys.argv[1]
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              names=z.namelist()
              assert 'vf-tool-m3u8/vf-tool-m3u8.php' in names
              main=z.read('vf-tool-m3u8/vf-tool-m3u8.php').decode('utf-8')
              assert re.search(r'^ \* Version: 1\.25\.4$',main,re.M)
          PY
          printf '%s\n' "asset_id=$V1254_ASSET_ID" "bytes=$V1254_BYTES" "sha256=$V1254_SHA256" > "$EVIDENCE_DIR/v1254-official-source.txt"

      - name: Install WordPress 7.1 and official v1.25.4
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp
          chmod +x /tmp/wp
          sudo mv /tmp/wp /usr/local/bin/wp
          for i in $(seq 1 30); do mysqladmin ping -h127.0.0.1 -P3306 -uvf -pvf --silent >/dev/null 2>&1 && break; sleep 1; done
          mysqladmin ping -h127.0.0.1 -P3306 -uvf -pvf --silent
          rm -rf "$WP_PATH"
          wp core download --path="$WP_PATH" --version="$WP_VERSION" --force
          wp config create --path="$WP_PATH" --dbname=vf_s01_v1256 --dbuser=vf --dbpass=vf --dbhost=127.0.0.1:3306 --skip-check
          wp config set FS_METHOD direct --path="$WP_PATH"
          wp config set WP_DEBUG true --raw --path="$WP_PATH"
          wp config set WP_DEBUG_LOG true --raw --path="$WP_PATH"
          wp config set WP_DEBUG_DISPLAY false --raw --path="$WP_PATH"
          wp core install --path="$WP_PATH" --url=http://127.0.0.1:8086 --title='VF S01 C03 Recovery Bridge Gate' --admin_user=owner --admin_password='gate-only-1256' --admin_email=owner@example.invalid --skip-email
          wp plugin install "$PACKAGE_DIR/vf-tools-m3u8_V1.25.4.zip" --path="$WP_PATH" --activate --force | tee "$EVIDENCE_DIR/install-v1254.txt"
          test "$(wp plugin get vf-tool-m3u8 --field=version --path="$WP_PATH" | tr -d '\r')" = '1.25.4'
          wp plugin is-active vf-tool-m3u8 --path="$WP_PATH"
          test "$(wp option get vf_tools_m3u8_v6_schema_version --path="$WP_PATH" | tr -d '\r')" = '1.3.0'
          wp core version --path="$WP_PATH" | tee "$EVIDENCE_DIR/wp-version.txt"
          php -r 'echo PHP_VERSION,"\n";' | tee "$EVIDENCE_DIR/php-runtime-version.txt"

      - name: Seal pre-bootstrap schema and source fingerprints
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/vf-schema-fingerprint.php <<'PHP'
          <?php
          $tables=function_exists('vf_tools_m3u8_v6_table_names')?vf_tools_m3u8_v6_table_names():[];
          if(count($tables)!==14){fwrite(STDERR,"expected 14 provider tables\n");exit(2);}
          ksort($tables,SORT_STRING);
          global $wpdb;
          $payload=['tables'=>[],'options'=>[]];
          foreach($tables as $key=>$table){
              $create=$wpdb->get_row('SHOW CREATE TABLE `'.str_replace('`','``',$table).'`',ARRAY_N);
              $rows=$wpdb->get_results('SELECT * FROM `'.str_replace('`','``',$table).'`',ARRAY_A);
              usort($rows,static fn($a,$b)=>strcmp(wp_json_encode($a),wp_json_encode($b)));
              $payload['tables'][$key]=['name'=>$table,'create'=>$create,'rows'=>$rows];
          }
          $payload['options']['schema_version']=get_option('vf_tools_m3u8_v6_schema_version',null);
          $payload['options']['migration']=get_option('vf_tools_m3u8_v6_private_schema_migration',null);
          $json=wp_json_encode($payload,JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE);
          echo wp_json_encode(['sha256'=>hash('sha256',$json),'table_count'=>count($tables),'schema'=>$payload['options']['schema_version']],JSON_UNESCAPED_SLASHES),"\n";
          PHP
          source_fp(){ python3 - "$1" <<'PY'
          import hashlib,sys
          from pathlib import Path
          root=Path(sys.argv[1]); files={p.relative_to(root).as_posix():p.read_bytes() for p in root.rglob('*') if p.is_file() and not p.is_symlink()}; files=dict(sorted(files.items())); canon=''.join(f'{k}\0{hashlib.sha256(v).hexdigest()}\n' for k,v in files.items()); print(hashlib.sha256(canon.encode()).hexdigest())
          PY
          }
          wp eval-file /tmp/vf-schema-fingerprint.php --path="$WP_PATH" > "$EVIDENCE_DIR/schema-before.json"
          jq -e '.table_count==14 and .schema=="1.3.0"' "$EVIDENCE_DIR/schema-before.json"
          source_fp "$WP_PATH/wp-content/plugins/vf-tool-m3u8" > "$EVIDENCE_DIR/source-v1254-before.sha256"

      - name: Verify-only bootstrap must be zero mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          NEWZIP="$PACKAGE_DIR/vf-tools-m3u8_V1.25.6.zip"
          NEWBYTES="$(jq -r .zip_bytes "$EVIDENCE_DIR/release-package-audit.json")"
          NEWSHA="$(jq -r .zip_sha256 "$EVIDENCE_DIR/release-package-audit.json")"
          wp --path="$WP_PATH" eval-file "$GITHUB_WORKSPACE/m3u8/scripts/s01-c03-bootstrap-upgrade-1254.php" -- --zip="$NEWZIP" --sha256="$NEWSHA" --bytes="$NEWBYTES" --target=1.25.6 --verify-only | tee "$EVIDENCE_DIR/bootstrap-verify-only.txt"
          test "$(wp plugin get vf-tool-m3u8 --field=version --path="$WP_PATH" | tr -d '\r')" = '1.25.4'
          wp eval-file /tmp/vf-schema-fingerprint.php --path="$WP_PATH" > "$EVIDENCE_DIR/schema-after-verify-only.json"
          cmp "$EVIDENCE_DIR/schema-before.json" "$EVIDENCE_DIR/schema-after-verify-only.json"
          python3 - "$WP_PATH/wp-content/plugins/vf-tool-m3u8" > "$EVIDENCE_DIR/source-after-verify-only.sha256" <<'PY'
          import hashlib,sys
          from pathlib import Path
          root=Path(sys.argv[1]); files={p.relative_to(root).as_posix():p.read_bytes() for p in root.rglob('*') if p.is_file() and not p.is_symlink()}; files=dict(sorted(files.items())); canon=''.join(f'{k}\0{hashlib.sha256(v).hexdigest()}\n' for k,v in files.items()); print(hashlib.sha256(canon.encode()).hexdigest())
          PY
          cmp "$EVIDENCE_DIR/source-v1254-before.sha256" "$EVIDENCE_DIR/source-after-verify-only.sha256"

      - name: Fault injection must rollback after source quarantine
        shell: bash
        run: |
          set -Eeuo pipefail
          cp m3u8/scripts/s01-c03-bootstrap-upgrade-1254.php /tmp/vf-bootstrap-fault.php
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/vf-bootstrap-fault.php'); s=p.read_text(); needle="            $mutated = true;\n\n            $stagedPlugin ="; repl="            $mutated = true;\n            throw new RuntimeException('FORMAL_GATE_FAULT_AFTER_QUARANTINE');\n\n            $stagedPlugin ="; assert s.count(needle)==1; p.write_text(s.replace(needle,repl,1))
          PY
          NEWZIP="$PACKAGE_DIR/vf-tools-m3u8_V1.25.6.zip"
          NEWBYTES="$(jq -r .zip_bytes "$EVIDENCE_DIR/release-package-audit.json")"
          NEWSHA="$(jq -r .zip_sha256 "$EVIDENCE_DIR/release-package-audit.json")"
          set +e
          wp --path="$WP_PATH" eval-file /tmp/vf-bootstrap-fault.php -- --zip="$NEWZIP" --sha256="$NEWSHA" --bytes="$NEWBYTES" --target=1.25.6 > "$EVIDENCE_DIR/bootstrap-fault.txt" 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -Fq 'FORMAL_GATE_FAULT_AFTER_QUARANTINE' "$EVIDENCE_DIR/bootstrap-fault.txt"
          test "$(wp plugin get vf-tool-m3u8 --field=version --path="$WP_PATH" | tr -d '\r')" = '1.25.4'
          wp plugin is-active vf-tool-m3u8 --path="$WP_PATH"
          wp eval-file /tmp/vf-schema-fingerprint.php --path="$WP_PATH" > "$EVIDENCE_DIR/schema-after-fault.json"
          cmp "$EVIDENCE_DIR/schema-before.json" "$EVIDENCE_DIR/schema-after-fault.json"
          python3 - "$WP_PATH/wp-content/plugins/vf-tool-m3u8" > "$EVIDENCE_DIR/source-after-fault.sha256" <<'PY'
          import hashlib,sys
          from pathlib import Path
          root=Path(sys.argv[1]); files={p.relative_to(root).as_posix():p.read_bytes() for p in root.rglob('*') if p.is_file() and not p.is_symlink()}; files=dict(sorted(files.items())); canon=''.join(f'{k}\0{hashlib.sha256(v).hexdigest()}\n' for k,v in files.items()); print(hashlib.sha256(canon.encode()).hexdigest())
          PY
          cmp "$EVIDENCE_DIR/source-v1254-before.sha256" "$EVIDENCE_DIR/source-after-fault.sha256"
          test -z "$(find "$WP_PATH/wp-content/plugins" -maxdepth 1 \( -name '.vf-s01-c03-bootstrap-stage-*' -o -name '.vf-s01-c03-bootstrap-old-*' \) -print -quit)"
          test "$(find /tmp/vf-private-update-bootstrap-recovery -maxdepth 1 -type f -name '*.json' | wc -l)" -ge 1

      - name: Exact bootstrap success and Schema no-write readback
        shell: bash
        run: |
          set -Eeuo pipefail
          NEWZIP="$PACKAGE_DIR/vf-tools-m3u8_V1.25.6.zip"
          NEWBYTES="$(jq -r .zip_bytes "$EVIDENCE_DIR/release-package-audit.json")"
          NEWSHA="$(jq -r .zip_sha256 "$EVIDENCE_DIR/release-package-audit.json")"
          wp --path="$WP_PATH" eval-file "$GITHUB_WORKSPACE/m3u8/scripts/s01-c03-bootstrap-upgrade-1254.php" -- --zip="$NEWZIP" --sha256="$NEWSHA" --bytes="$NEWBYTES" --target=1.25.6 | tee "$EVIDENCE_DIR/bootstrap-success.txt"
          test "$(wp plugin get vf-tool-m3u8 --field=version --path="$WP_PATH" | tr -d '\r')" = '1.25.6'
          wp plugin is-active vf-tool-m3u8 --path="$WP_PATH"
          diff -qr m3u8/src "$WP_PATH/wp-content/plugins/vf-tool-m3u8" > "$EVIDENCE_DIR/source-candidate-diff.txt"
          wp eval-file /tmp/vf-schema-fingerprint.php --path="$WP_PATH" > "$EVIDENCE_DIR/schema-after-success.json"
          cmp "$EVIDENCE_DIR/schema-before.json" "$EVIDENCE_DIR/schema-after-success.json"
          test -z "$(find "$WP_PATH/wp-content/plugins" -maxdepth 1 \( -name '.vf-s01-c03-bootstrap-stage-*' -o -name '.vf-s01-c03-bootstrap-old-*' \) -print -quit)"
          wp eval --path="$WP_PATH" 'if(VF_TOOL_M3U8_VERSION!=="1.25.6"||VF_TOOL_M3U8_ROUND!=="R230"||vf_tool_m3u8_install_status_marker()!=="R230_ONLINE_UPDATE_CONTRACT_RECOVERY"||VF_M3U8_Update_Contract_V1::schema_version()!=="1.3.0"){exit(2);} $a=VF_M3U8_Runtime_Authority_V1::stored(); if(($a["version"]??"")!=="1.25.6"||empty($a["fingerprint_sha256"])) exit(3); echo "TARGET_RUNTIME_AUTHORITY=PASS\n";' | tee "$EVIDENCE_DIR/target-runtime-authority.txt"
          wp eval --path="$WP_PATH" 'require_once WP_PLUGIN_DIR."/vf-tool-m3u8/includes/v6-provider-schema-repair-admin.php"; $d=vf_tools_m3u8_v6_schema_repair_diagnostics(); echo wp_json_encode($d,JSON_UNESCAPED_SLASHES),"\n"; if(($d["code"]??"")!=="READY"||!empty($d["repairAllowed"])) exit(4);' | tee "$EVIDENCE_DIR/diagnostic-readback.json"

      - name: Future Native Update compatibility from 1.25.6
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/vf-native-future.php <<'PHP'
          <?php
          require_once WP_PLUGIN_DIR.'/vf-tool-m3u8/includes/update/class-vf-m3u8-update-source-v1.php';
          $m=[
            'schema_version'=>'wp-component-1.0','project_id'=>'S01','component_id'=>'S01-C03','component_type'=>'PLUGIN','package_slug'=>'vf-tool-m3u8','enabled'=>true,
            'target_version'=>'1.25.7','from_versions'=>['1.25.6'],'repository'=>'llhzx2018/vf-tools-m3u8','release_tag'=>'v1.25.7','asset_name'=>'vf-tools-m3u8_V1.25.7.zip',
            'asset_bytes'=>12345,'asset_sha256'=>str_repeat('a',64),'schema_from'=>'1.3.0','schema_to'=>'1.3.0','minimum_wordpress'=>'6.5','minimum_php'=>'8.2',
            'backup_required'=>true,'rollback_supported'=>true,'runtime_contract'=>'VF_WP_COMPONENT_RUNTIME_AUTHORITY_V1','released_at'=>'2026-09-02T00:00:00Z'
          ];
          $s=new VF_M3U8_Update_Source_V1('1.25.6'); $r=$s->validate_manifest($m); if($r!==true){fwrite(STDERR,is_wp_error($r)?$r->get_error_code():'UNKNOWN');exit(2);} echo "NATIVE_UPDATE_1.25.6_TO_FUTURE=PASS\n";
          PHP
          wp eval-file /tmp/vf-native-future.php --path="$WP_PATH" | tee "$EVIDENCE_DIR/native-future-compatibility.txt"

      - name: Verify retained source recovery artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          root=Path('/tmp/vf-private-update-bootstrap-recovery'); metas=sorted(root.glob('*.json'))
          assert len(metas)>=2, len(metas)
          out=[]
          for mp in metas:
              m=json.load(open(mp)); assert m['component_id']=='S01-C03'; assert m['recovery_scope']=='SOURCE_ONLY_NO_PROVIDER_SCHEMA_OR_DATA_ROLLBACK'; assert m['source_version']=='1.25.4'; assert m['target_version']=='1.25.6'
              zp=Path(m['zip']); assert zp.is_file(); assert hashlib.sha256(zp.read_bytes()).hexdigest()==m['sha256']
              with zipfile.ZipFile(zp) as z:
                  assert z.testzip() is None
                  main=z.read('vf-tool-m3u8/vf-tool-m3u8.php').decode('utf-8'); assert ' * Version: 1.25.4' in main
              out.append({'metadata':str(mp),'zip':str(zp),'sha256':m['sha256']})
          Path('/tmp/vf-s01-v1256-formal-gate-evidence/recovery-artifacts.json').write_text(json.dumps(out,indent=2)+'\n')
          print(f'RECOVERY_ARTIFACTS={len(out)} PASS')
          PY

      - name: Seal Formal Recovery Bridge Gate evidence
