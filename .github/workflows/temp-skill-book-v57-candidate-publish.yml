name: TEMP skill-book V5.7 Candidate publish

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

env:
  GOV_REPO: llhzx2018/gov-doc
  SOURCE_RUNNER_REPO: llhzx2018/core-free-runner-public
  SOURCE_RUN_ID: '33263610287'
  SOURCE_ARTIFACT: skill-book-v57-candidate-20260829
  V57_CANDIDATE_SOURCE: 885d43a70100911531b7bc38833355e559a90b1d
  RELEASE_TAG: skill-book-v5.7-candidate-20260829
  RELEASE_TITLE: skill-book V5.7 Candidate · 2026-08-29
  ZIP_NAME: skill-book_V5.7_CANDIDATE_20260829.zip
  ZIP_BYTES: '208937'
  ZIP_SHA256: 0b36523a4ed54b28677fb08a87540ba6074aa8a31ba72a4cc4d4d0b6e2bffa4e

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      RUNNER_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Download exact successful Candidate artifact
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VF_RELEASE_WRITE_TOKEN"
          mkdir artifact
          GH_TOKEN="$RUNNER_GITHUB_TOKEN" gh run download "$SOURCE_RUN_ID" --repo "$SOURCE_RUNNER_REPO" --name "$SOURCE_ARTIFACT" --dir artifact
          test -f "artifact/$ZIP_NAME"
          test -f "artifact/$ZIP_NAME.sha256"
          test "$(stat -c %s "artifact/$ZIP_NAME")" = "$ZIP_BYTES"
          got="$(sha256sum "artifact/$ZIP_NAME" | awk '{print $1}')"
          test "$got" = "$ZIP_SHA256"
          grep -qx "$ZIP_SHA256  $ZIP_NAME" "artifact/$ZIP_NAME.sha256"
          test "$(unzip -l "artifact/$ZIP_NAME" | tail -n 1 | awk '{print $2}')" = '102'
          echo 'V57_RELEASE_ARTIFACT_IDENTITY=PASS'

      - name: Verify exact Candidate source exists
        shell: bash
        run: |
          set -euo pipefail
          GH_TOKEN="$VF_RELEASE_WRITE_TOKEN" gh api "repos/$GOV_REPO/commits/$V57_CANDIDATE_SOURCE" --jq '.sha' | grep -qx "$V57_CANDIDATE_SOURCE"
          echo 'V57_RELEASE_SOURCE_COMMIT=PASS'

      - name: Publish V5.7 Candidate prerelease
        shell: bash
        run: |
          set -euo pipefail
          if GH_TOKEN="$VF_RELEASE_WRITE_TOKEN" gh release view "$RELEASE_TAG" --repo "$GOV_REPO" >/dev/null 2>&1; then
            echo 'RELEASE_TAG_ALREADY_EXISTS_BLOCK'
            exit 9
          fi
          cat > /tmp/notes.md <<'EOF'
          skill-book V5.7 Candidate · Reader Transfer / Blind Reader Outcome Validation

          Candidate scope:
          - READ orientation transfer
          - LEARN changed-case and plausible near-miss judgment transfer
          - TRAIN feedback/retry responsibility transfer
          - DO operator-handoff transfer

          Candidate evidence:
          - fresh isolated blind proxy: PASS
          - proxy receipt authority validation: PASS
          - exact Candidate Python compile: 42/42 PASS
          - exact Candidate full regression: 140/140 PASS
          - package integrity: PASS

          Authority boundary:
          - Real Reader Evidence: NOT_RUN
          - Source Current remains V3.5
          - Source Current promotion: NOT_AUTHORIZED
          - Current Distribution promotion: NOT_AUTHORIZED
          EOF
          GH_TOKEN="$VF_RELEASE_WRITE_TOKEN" gh release create "$RELEASE_TAG" \
            --repo "$GOV_REPO" \
            --target "$V57_CANDIDATE_SOURCE" \
            --title "$RELEASE_TITLE" \
            --notes-file /tmp/notes.md \
            --prerelease \
            "artifact/$ZIP_NAME" \
            "artifact/$ZIP_NAME.sha256"
          echo 'V57_CANDIDATE_PRERELEASE_CREATED=PASS'

      - name: Remote release readback
        shell: bash
        run: |
          set -euo pipefail
          GH_TOKEN="$VF_RELEASE_WRITE_TOKEN" gh release view "$RELEASE_TAG" --repo "$GOV_REPO" --json tagName,name,isPrerelease,targetCommitish,assets > /tmp/release.json
          python - <<'PY'
          import json,os
          d=json.load(open('/tmp/release.json'))
          assert d['tagName']==os.environ['RELEASE_TAG']
          assert d['name']==os.environ['RELEASE_TITLE']
          assert d['isPrerelease'] is True
          names={a['name']:a for a in d['assets']}
          z=os.environ['ZIP_NAME']
          assert z in names and z+'.sha256' in names
          assert int(names[z]['size'])==int(os.environ['ZIP_BYTES'])
          print('V57_RELEASE_REMOTE_READBACK=PASS')
          print('V57_RELEASE_ZIP_ASSET_ID='+str(names[z].get('id','UNKNOWN')))
          print('V57_RELEASE_SHA_ASSET_ID='+str(names[z+'.sha256'].get('id','UNKNOWN')))
          PY
