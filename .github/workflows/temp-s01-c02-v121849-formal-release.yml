name: TEMP S01-C02 Ops 1.21.849 Formal Release

on:
  push:
    branches:
      - temp/s01-c02-v121849-formal-release-20260906
    paths:
      - '.github/workflows/temp-s01-c02-v121849-formal-release.yml'

permissions:
  contents: read
  actions: read

env:
  TARGET_REPOSITORY: llhzx2018/vf-tools-ops
  TARGET_COMMIT: ca87ee6a6dd1139dab6fe33f20b64d537b1a2b20
  TARGET_TREE: 9ecefb081daf8a8563746601522678d8f93e67f8
  BASE_RELEASE_COMMIT: 7f0f6808c7a9fa076c58cf87776666fbdf38be6d
  PRE_GATE_RUN: '34030966883'
  PRE_GATE_RUNNER_SHA: 253142fa63110c9e218d8fedd6f29d86455fc069
  BASE_ASSET_BYTES: '3325498'
  BASE_ASSET_SHA256: 930adaf339fc1e47dfb84c056d548f5ca818cf5233eefc60d71c48b26570bfdc
  ASSET_BYTES: '3325881'
  ASSET_SHA256: d4feb6bac88022a0abfc7fccf17471bdbedaa518e45821b8436ad17b514d2b67
  RUNTIME_FILES: '930'
  RUNTIME_FP: 02bc476b22d8664d4387c271cf354fc548d705468f2e0f6181177c16d6392372
  VERSION: 1.21.849
  TAG: v1.21.849
  RELEASE_NAME: VF Tools Ops V1.21.849
  ASSET_NAME: vf-tools-ops_V1.21.849.zip

jobs:
  formal-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Credential presence gate
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"
          echo RELEASE_CREDENTIALS=PASS

      - name: Verify exact formal pre-gate PASS
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          JSON="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/runs/${PRE_GATE_RUN}")"
          test "$(jq -r '.status' <<<"$JSON")" = completed
          test "$(jq -r '.conclusion' <<<"$JSON")" = success
          test "$(jq -r '.head_sha' <<<"$JSON")" = "$PRE_GATE_RUNNER_SHA"
          echo FORMAL_PRE_GATE=PASS

      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.TARGET_COMMIT }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops

      - name: Verify main source identity and bounded delta
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$TARGET_COMMIT"
          test "$(git -C ops rev-parse HEAD^{tree})" = "$TARGET_TREE"
          MAIN_JSON="$(curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${TARGET_REPOSITORY}/branches/main")"
          test "$(jq -r '.commit.sha' <<<"$MAIN_JSON")" = "$TARGET_COMMIT"
          test "$(tr -d '\r\n' < ops/VERSION)" = "$VERSION"
          grep -Fq 'Version: 1.21.849' ops/vf-ops.php
          git -C ops diff --name-only "$BASE_RELEASE_COMMIT" "$TARGET_COMMIT" | sort >/tmp/changed-files.txt
          cat >/tmp/expected-files.txt <<'EOF'
          .github/phase3/r6-static-token-integrity.php
          VERSION
          includes/cf-release/checker-html-parts/04-residue-target.php
          includes/cf-release/repair-core-parts/cleanup-parts/02-shadow-terms.php
          includes/cf-release/repair-core-parts/cleanup-parts/03-public-residue.php
          vf-ops.php
          EOF
          diff -u /tmp/expected-files.txt /tmp/changed-files.txt
          echo MAIN_EXACT_TESTED_SOURCE=PASS

      - name: Re-run focused source contract
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l ops/vf-ops.php
          php -l ops/includes/cf-release/repair-core-parts/cleanup-parts/02-shadow-terms.php
          php -l ops/includes/cf-release/repair-core-parts/cleanup-parts/03-public-residue.php
          php -l ops/includes/cf-release/checker-html-parts/04-residue-target.php
          php ops/.github/phase3/r6-static-token-integrity.php | tee /tmp/token.txt
          grep -Fxq PASS_R6_STATIC_TOKEN_INTEGRITY /tmp/token.txt
          echo RELEASE_SOURCE_CONTRACT=PASS

      - name: Rebuild and verify exact release artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/base-source /tmp/candidate-source /tmp/base-runtime /tmp/candidate-runtime /tmp/release
          mkdir -p /tmp/base-source /tmp/candidate-source /tmp/base-runtime /tmp/candidate-runtime /tmp/release
          git -C ops archive "$BASE_RELEASE_COMMIT" | tar -x -C /tmp/base-source
          git -C ops archive "$TARGET_COMMIT" | tar -x -C /tmp/candidate-source
          python3 - <<'PY'
          import re, shutil, hashlib, zipfile, os
          from pathlib import Path
          def runtime_files(root_path,out_path):
              root=Path(root_path); out=Path(out_path); files={}
              def ok(rel):
                  p=rel.as_posix(); parts=p.split('/')
                  if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in parts): return False
                  if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',p,re.I): return False
                  if '/' not in p: return p in {'vf-ops.php','uninstall.php'}
                  return parts[0] in {'includes','assets','languages','config'}
              for src in root.rglob('*'):
                  if src.is_file() and not src.is_symlink():
                      rel=src.relative_to(root)
                      if ok(rel):
                          dst=out/rel; dst.parent.mkdir(parents=True,exist_ok=True); shutil.copyfile(src,dst)
                          files[rel.as_posix()]=src.read_bytes()
              return dict(sorted(files.items()))
          def identity(files):
              fp=hashlib.sha256()
              for rel,b in files.items(): fp.update((rel+'\0'+hashlib.sha256(b).hexdigest()+'\n').encode())
              return len(files),fp.hexdigest()
          def build_zip(files,zpath):
              zpath=Path(zpath)
              with zipfile.ZipFile(zpath,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
                  for rel,b in files.items():
                      zi=zipfile.ZipInfo('vf-ops/'+rel,(2026,9,6,0,0,0)); zi.compress_type=zipfile.ZIP_DEFLATED; zi.external_attr=0o100644<<16; z.writestr(zi,b)
              return zpath.stat().st_size,hashlib.sha256(zpath.read_bytes()).hexdigest()
          base=runtime_files('/tmp/base-source','/tmp/base-runtime')
          base_bytes,base_sha=build_zip(base,'/tmp/base-release.zip')
          assert base_bytes==int(os.environ['BASE_ASSET_BYTES'])
          assert base_sha==os.environ['BASE_ASSET_SHA256']
          cand=runtime_files('/tmp/candidate-source','/tmp/candidate-runtime')
          count,fp=identity(cand)
          assert count==int(os.environ['RUNTIME_FILES']), (count,os.environ['RUNTIME_FILES'])
          assert fp==os.environ['RUNTIME_FP'], (fp,os.environ['RUNTIME_FP'])
          zpath='/tmp/release/'+os.environ['ASSET_NAME']
          asset_bytes,asset_sha=build_zip(cand,zpath)
          assert asset_bytes==int(os.environ['ASSET_BYTES']), (asset_bytes,os.environ['ASSET_BYTES'])
          assert asset_sha==os.environ['ASSET_SHA256'], (asset_sha,os.environ['ASSET_SHA256'])
          print('EXACT_ASSET_BYTES='+str(asset_bytes))
          print('EXACT_ASSET_SHA256='+asset_sha)
          PY
          unzip -tq "/tmp/release/$ASSET_NAME" >/dev/null
          echo EXACT_RELEASE_ARTIFACT=PASS

      - name: Verify release absence
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(curl -sS -o /tmp/tag.json -w '%{http_code}' -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${TARGET_REPOSITORY}/git/ref/tags/${TAG}")" = 404
          test "$(curl -sS -o /tmp/release.json -w '%{http_code}' -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${TARGET_REPOSITORY}/releases/tags/${TAG}")" = 404
          echo RELEASE_ABSENCE=PASS

      - name: Create exact tag and release
        shell: bash
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          jq -n --arg ref "refs/tags/${TAG}" --arg sha "$TARGET_COMMIT" '{ref:$ref,sha:$sha}' >/tmp/tag-create.json
          curl -fsSL -X POST -H "Authorization: Bearer $WRITE_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' "https://api.github.com/repos/${TARGET_REPOSITORY}/git/refs" --data-binary @/tmp/tag-create.json >/tmp/tag-created.json
          test "$(jq -r '.object.sha' /tmp/tag-created.json)" = "$TARGET_COMMIT"
          cat >/tmp/release-body.md <<EOF
          VF Tools Ops V1.21.849 fixes Static Candidate technical-token integrity discovered by real Cloudflare Preview browser acceptance.

          - Preserves identifiers such as data-vf-shortcode-tool across HTML/JS/CSS/JSON static repair.
          - Stops whole-asset shortcode-to-prose rewriting that inserted whitespace into selectors and attributes.
          - Keeps executable shortcode payload removal and standalone public shortcode residue fail-closed.
          - Exact token-integrity Machine Gate: 34030876496 PASS.
          - Exact Formal Release Pre-Gate: ${PRE_GATE_RUN} PASS.
          - Release source commit: ${TARGET_COMMIT}.
          - Release source tree: ${TARGET_TREE}.
          - Asset SHA256: ${ASSET_SHA256}.
          - Asset bytes: ${ASSET_BYTES}.
          - Runtime files: ${RUNTIME_FILES}.
          - Runtime fingerprint: ${RUNTIME_FP}.
          - Production WordPress upgrade, Static Candidate regeneration, Cloudflare Preview promotion, DNS and finalOnlinePass are NOT performed by this GitHub Release.
          EOF
          jq -n --arg tag "$TAG" --arg name "$RELEASE_NAME" --rawfile body /tmp/release-body.md '{tag_name:$tag,name:$name,body:$body,draft:false,prerelease:false}' >/tmp/release-create.json
          curl -fsSL -X POST -H "Authorization: Bearer $WRITE_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' "https://api.github.com/repos/${TARGET_REPOSITORY}/releases" --data-binary @/tmp/release-create.json >/tmp/release-created.json
          RID="$(jq -r '.id' /tmp/release-created.json)"
          test -n "$RID"; test "$RID" != null
          echo "RELEASE_ID=$RID" >> "$GITHUB_ENV"
          echo "RELEASE_ID=$RID"

      - name: Upload exact tested artifact
        shell: bash
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          curl -fsSL -X POST -H "Authorization: Bearer $WRITE_TOKEN" -H 'Content-Type: application/zip' "https://uploads.github.com/repos/${TARGET_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${ASSET_NAME}" --data-binary "@/tmp/release/$ASSET_NAME" >/tmp/asset-created.json
          AID="$(jq -r '.id' /tmp/asset-created.json)"
          test -n "$AID"; test "$AID" != null
          test "$(jq -r '.name' /tmp/asset-created.json)" = "$ASSET_NAME"
          test "$(jq -r '.size' /tmp/asset-created.json)" = "$ASSET_BYTES"
          echo "ASSET_ID=$AID" >> "$GITHUB_ENV"
          echo "ASSET_ID=$AID"

      - name: Remote exact release readback and download hash
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          TAG_JSON="$(curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${TARGET_REPOSITORY}/git/ref/tags/${TAG}")"
          REL_JSON="$(curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${TARGET_REPOSITORY}/releases/tags/${TAG}")"
          test "$(jq -r '.object.sha' <<<"$TAG_JSON")" = "$TARGET_COMMIT"
          test "$(jq -r '.id' <<<"$REL_JSON")" = "$RELEASE_ID"
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[] | select(.name==$n) | .id' <<<"$REL_JSON")" = "$ASSET_ID"
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[] | select(.name==$n) | .size' <<<"$REL_JSON")" = "$ASSET_BYTES"
          API_URL="$(jq -r --arg n "$ASSET_NAME" '.assets[] | select(.name==$n) | .url' <<<"$REL_JSON")"
          curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/octet-stream' "$API_URL" -o /tmp/readback.zip
          test "$(stat -c%s /tmp/readback.zip)" = "$ASSET_BYTES"
          test "$(sha256sum /tmp/readback.zip | awk '{print $1}')" = "$ASSET_SHA256"
          unzip -tq /tmp/readback.zip >/dev/null
          echo RELEASE_REMOTE_READBACK=PASS
          echo RELEASE_ID=$RELEASE_ID
          echo ASSET_ID=$ASSET_ID
          echo ASSET_SHA256=$ASSET_SHA256
          echo PASS_V121849_FORMAL_RELEASE
