name: P04 V2.8.0 Online Channel E2E

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    if: contains(github.head_ref, 'p04-v280-online-channel-e2e')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_REPOSITORY: llhzx2018/vf-infra
      SOURCE_COMMIT: 7009c10ea1d588ca54d76b0860b9834fc9a8f2c5
      AUTHORITY_PUBLICATION_COMMIT: faff2f0ebc16bf7c2106b9f6b017b3190e465a1b
      TARGET_VERSION: 2.8.0
      SOURCE_VERSION: 2.7.9
      EXPECTED_RELEASE_ID: '372833932'
      EXPECTED_ASSET_ID: '520471675'
      EXPECTED_ASSET_BYTES: '42318'
      EXPECTED_ASSET_SHA256: 33bdb59d31c9bef5cc647385bbc2c0c0cef4d07814ea0120488dd7a2d712d5d7
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Require private read channel
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VF_PRIVATE_READ_TOKEN" || { echo VF_PRIVATE_READ_TOKEN_MISSING; exit 78; }

      - name: Checkout exact V2.8.0 product update client
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: 7009c10ea1d588ca54d76b0860b9834fc9a8f2c5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, zip, sodium, pdo_sqlite, sqlite3

      - name: Verify current Authority and Release identity
        shell: bash
        run: |
          set -Eeuo pipefail
          DIR="$RUNNER_TEMP/v280-channel"
          mkdir -p "$DIR" evidence
          gh api repos/llhzx2018/core-updates/contents/projects/P04.json -H 'Accept: application/vnd.github.raw+json' > "$DIR/P04.json"
          gh api "repos/$SOURCE_REPOSITORY/releases/tags/v$TARGET_VERSION" > "$DIR/release.json"
          gh api repos/llhzx2018/core-updates/commits/main --jq .sha > "$DIR/core-updates-main-sha.txt"
          jq -e --arg v "$TARGET_VERSION" --arg s "$SOURCE_VERSION" --arg c "$SOURCE_COMMIT" --arg sha "$EXPECTED_ASSET_SHA256" --argjson rid "$EXPECTED_RELEASE_ID" --argjson aid "$EXPECTED_ASSET_ID" --argjson bytes "$EXPECTED_ASSET_BYTES" '
            .schema_version=="1.0" and .project_id=="P04" and .component_id=="APP" and .enabled==true and
            .target_version==$v and .from_versions==[$s] and .schema_from=="14" and .schema_to=="14" and .update_type=="ATOMIC" and
            .release_tag==("v"+$v) and .release_id==$rid and .release_product_commit==$c and
            .asset_name==("VF_Infra_V"+$v+"_UPDATE.zip") and .asset_id==$aid and .asset_bytes==$bytes and .asset_sha256==$sha and
            .backup_required==true and .rollback_supported==true
          ' "$DIR/P04.json" >/dev/null
          jq -e --arg v "v$TARGET_VERSION" --arg c "$SOURCE_COMMIT" --argjson rid "$EXPECTED_RELEASE_ID" '
            .tag_name==$v and .target_commitish==$c and .id==$rid and .draft==false and .prerelease==false
          ' "$DIR/release.json" >/dev/null
          echo MANIFEST_AND_RELEASE_READBACK=PASS

      - name: Exercise real V2.8.0 UpdateRepositoryClient and UpdateManifestService
        shell: bash
        run: |
          set -Eeuo pipefail
          DIR="$RUNNER_TEMP/v280-channel"
          cat > "$DIR/evaluate.php" <<'PHP'
          <?php
          declare(strict_types=1);
          final class Support { public static function randomHex(int $bytes=8): string { return bin2hex(random_bytes($bytes)); } }
          $root=getenv('SOURCE_ROOT');
          require $root.'/src/app/Core/Update/UpdateContract.php';
          require $root.'/src/app/Core/Update/UpdateTransportInterface.php';
          require $root.'/src/app/Core/Update/UpdateSourceInterface.php';
          require $root.'/src/app/Core/Update/UpdateRepositoryClient.php';
          require $root.'/src/app/Core/Update/UpdateManifestService.php';
          $client=new \VFInfra\Core\Update\UpdateRepositoryClient();
          $source=$client->fetchProjectManifest();
          $manifest=$source['manifest'];
          $asset=$client->resolveReleaseAsset((string)$manifest['repository'],(string)$manifest['release_tag'],(string)$manifest['asset_name']);
          if((int)$asset['id']!==(int)getenv('EXPECTED_ASSET_ID')) throw new RuntimeException('asset id mismatch');
          if((int)$asset['size']!==(int)getenv('EXPECTED_ASSET_BYTES')) throw new RuntimeException('asset bytes mismatch');
          $dest=getenv('DOWNLOAD_PATH');
          $download=$client->download((string)$asset['url'],$dest,(int)$manifest['asset_bytes'],(string)$manifest['asset_sha256']);
          if((int)$download['bytes']!==(int)getenv('EXPECTED_ASSET_BYTES')) throw new RuntimeException('download bytes mismatch');
          if(!hash_equals(strtolower((string)getenv('EXPECTED_ASSET_SHA256')),strtolower((string)$download['sha256']))) throw new RuntimeException('download sha mismatch');

          $available=(new \VFInfra\Core\Update\UpdateManifestService($client,'2.7.9',14))->evaluate($manifest);
          if(($available['status']??'')!=='update_available'||empty($available['can_update'])) throw new RuntimeException('2.7.9 -> 2.8.0 not AVAILABLE');
          if(($available['latest_version']??'')!=='2.8.0'||($available['latest_schema']??0)!==14) throw new RuntimeException('available identity mismatch');

          $current=(new \VFInfra\Core\Update\UpdateManifestService($client,'2.8.0',14))->evaluate($manifest);
          if(($current['status']??'')!=='up_to_date'||!empty($current['can_update'])) throw new RuntimeException('2.8.0 not UP_TO_DATE');

          $stale=(new \VFInfra\Core\Update\UpdateManifestService($client,'2.7.8',14))->evaluate($manifest);
          if(($stale['status']??'')!=='intermediate_required'||!empty($stale['can_update'])) throw new RuntimeException('stale source not fail-closed');

          $wrongSchema=(new \VFInfra\Core\Update\UpdateManifestService($client,'2.7.9',13))->evaluate($manifest);
          if(($wrongSchema['status']??'')!=='schema_incompatible'||!empty($wrongSchema['can_update'])) throw new RuntimeException('wrong schema not fail-closed');

          $result=[
            'status'=>'PASS','project'=>'P04','source_version'=>'2.7.9','target_version'=>'2.8.0','schema'=>14,
            'manifest_sha256'=>$source['sha256'],'manifest_status_279'=>$available['status'],'can_update_279'=>$available['can_update'],
            'manifest_status_280'=>$current['status'],'can_update_280'=>$current['can_update'],
            'stale_278_status'=>$stale['status'],'stale_278_can_update'=>$stale['can_update'],
            'wrong_schema_13_status'=>$wrongSchema['status'],'wrong_schema_13_can_update'=>$wrongSchema['can_update'],
            'asset_id'=>$asset['id'],'asset_bytes'=>$download['bytes'],'asset_sha256'=>$download['sha256'],
            'backup_required'=>$available['backup_required'],'rollback_supported'=>$available['rollback_supported'],
            'real_update_repository_client'=>'PASS','real_update_manifest_service'=>'PASS','production_write'=>0,'production_upgrade'=>'NOT_EXECUTED'
          ];
          file_put_contents(getenv('REPORT_PATH'),json_encode($result,JSON_UNESCAPED_SLASHES|JSON_PRETTY_PRINT)."\n");
          echo "P04_V280_REAL_UPDATE_CLIENT=PASS\n";
          echo "P04_V280_279_AVAILABLE=PASS\n";
          echo "P04_V280_280_UP_TO_DATE=PASS\n";
          echo "P04_V280_STALE_SOURCE_FAIL_CLOSED=PASS\n";
          echo "P04_V280_SCHEMA_FAIL_CLOSED=PASS\n";
          PHP
          SOURCE_ROOT="$GITHUB_WORKSPACE/source" \
          DOWNLOAD_PATH="$DIR/VF_Infra_V2.8.0_UPDATE.zip" \
          REPORT_PATH="$GITHUB_WORKSPACE/evidence/P04_V280_ONLINE_CHANNEL.json" \
          EXPECTED_ASSET_ID="$EXPECTED_ASSET_ID" EXPECTED_ASSET_BYTES="$EXPECTED_ASSET_BYTES" EXPECTED_ASSET_SHA256="$EXPECTED_ASSET_SHA256" \
          php "$DIR/evaluate.php"

      - name: Verify downloaded Atomic package and handoff contract
        shell: bash
        run: |
          set -Eeuo pipefail
          DIR="$RUNNER_TEMP/v280-channel"
          test "$(wc -c < "$DIR/VF_Infra_V2.8.0_UPDATE.zip" | tr -d ' ')" = "$EXPECTED_ASSET_BYTES"
          test "$(sha256sum "$DIR/VF_Infra_V2.8.0_UPDATE.zip" | awk '{print $1}')" = "$EXPECTED_ASSET_SHA256"
          unzip -t "$DIR/VF_Infra_V2.8.0_UPDATE.zip" >/dev/null
          unzip -p "$DIR/VF_Infra_V2.8.0_UPDATE.zip" repair-v2.8.0.php > "$DIR/repair-v2.8.0.php"
          unzip -p "$DIR/VF_Infra_V2.8.0_UPDATE.zip" PACKAGE_MANIFEST.json > "$DIR/PACKAGE_MANIFEST.json"
          php "$DIR/repair-v2.8.0.php" --self-test
          jq -e '.allowed_source_versions==["2.7.9"] and .version=="2.8.0" and .schema==14 and .online_handoff_gate=="PASS" and .update_and_atomic_bytes_identical==true' "$DIR/PACKAGE_MANIFEST.json" >/dev/null
          echo V280_UPDATE_ASSET_EXACT=PASS
          echo V280_ONLINE_HANDOFF_MARKER=PASS

      - name: Seal Online Channel evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,os
          p=pathlib.Path('evidence/P04_V280_ONLINE_CHANNEL.json')
          r=json.loads(p.read_text())
          r['release_id']=int(os.environ['EXPECTED_RELEASE_ID'])
          r['release_product_commit']=os.environ['SOURCE_COMMIT']
          r['authority_publication_commit']=os.environ['AUTHORITY_PUBLICATION_COMMIT']
          r['core_updates_main_at_test']=pathlib.Path(os.environ['RUNNER_TEMP'],'v280-channel','core-updates-main-sha.txt').read_text().strip()
          r['manifest_readback']='PASS'; r['release_readback']='PASS'; r['zip_integrity']='PASS'; r['repair_self_test']='PASS'; r['online_handoff_marker']='PASS'
          p.write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          pathlib.Path('evidence/SHA256SUMS').write_text(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n")
          print(json.dumps(r,sort_keys=True))
          print('P04_V280_ONLINE_CHANNEL_E2E_PASS')
          PY

      - name: Upload Online Channel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P04-V2.8.0-ONLINE-CHANNEL-EVIDENCE
          path: evidence/
          if-no-files-found: error
          retention-days: 30
