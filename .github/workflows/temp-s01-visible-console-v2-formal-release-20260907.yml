name: S01 Visible Console V2 Coordinated Formal Release

on:
  push:
    branches: [temp/s01-visible-console-v2-formal-release-20260907]
    paths:
      - '.github/workflows/temp-s01-visible-console-v2-formal-release-20260907.yml'

permissions:
  contents: read

concurrency:
  group: s01-visible-console-v2-formal-release-20260907
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      THEME_SHA: de57f823e2d91963305b64a3c75fb1daaf93b9ba
      OPS_SHA: 0956117c8d56aa82e13b5f658c8d51ba41eaee55
      M3U8_SHA: fda320e63e135489a3d46aed1c107aa48114ee86
      THEME_BASE: 1337c9c65a453b15496b1f645a45ede70afe060a
      OPS_BASE: e13191ff2efcb98d8a2866f85e3f9272a2aa49c8
      M3U8_BASE: 466e9ecb97b4d7e03aeadc0533bcef6ecda9346e

    steps:
      - name: Credential authority gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"
          echo 'CREDENTIAL_MODEL=READ_WRITE_SEPARATED'

      - name: Checkout exact Theme source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-tools-theme
          ref: ${{ env.THEME_SHA }}
          token: ${{ env.READ_TOKEN }}
          path: theme
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact Ops source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.OPS_SHA }}
          token: ${{ env.READ_TOKEN }}
          path: ops
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact M3U8 source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: ${{ env.M3U8_SHA }}
          token: ${{ env.READ_TOKEN }}
          path: m3u8
          fetch-depth: 0
          persist-credentials: false

      - name: Visible Console V2 source gates
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C theme rev-parse HEAD)" = "$THEME_SHA"
          test "$(git -C ops rev-parse HEAD)" = "$OPS_SHA"
          test "$(git -C m3u8 rev-parse HEAD)" = "$M3U8_SHA"

          test "$(tr -d '\r\n' < theme/VERSION)" = '1.35.14'
          grep -Eq '^Version: 1\.35\.14$' theme/src/style.css
          grep -Fq 'admin-s01-console-v2.css' theme/src/inc/admin/admin-s01-uiux-polish.php
          grep -Fq 'admin-update-center-console-v2.css' theme/src/inc/admin/admin-s01-uiux-polish.php
          php theme/tests/visible-console-v2-contract.php
          php theme/tests/update-refresh-policy-contract.php
          php theme/tests/public-reading-final-owner-contract.php

          test "$(tr -d '\r\n' < ops/VERSION)" = '1.21.852'
          grep -Fq 'Version: 1.21.852' ops/vf-ops.php
          grep -Fq "VF_OPS_VERSION', '1.21.852'" ops/vf-ops.php
          grep -Fq 'admin-s01-console-v2.css' ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php
          php ops/tests/visible-console-v2-contract.php
          php ops/tests/update-refresh-policy-current-contract.php

          test "$(tr -d '\r\n' < m3u8/VERSION)" = '1.25.23'
          grep -Fq "VF_TOOL_M3U8_VERSION', '1.25.23'" m3u8/src/vf-tool-m3u8.php
          grep -Fq "VF_TOOL_M3U8_ROUND', 'R247'" m3u8/src/vf-tool-m3u8.php
          grep -Fq 'admin-s01-console-v2.css' m3u8/src/admin/admin-s01-uiux-polish.php
          php m3u8/tests/unit/visible-console-v2-contract.php
          php m3u8/tests/unit/update-refresh-policy-contract.php
          php m3u8/tests/frontend-s01-uiux-final-owner-contract.php

          find theme ops m3u8 -type f -name '*.php' -not -path '*/.git/*' -print0 | xargs -0 -n1 php -l >/dev/null

          python3 - <<'PY'
          import os,subprocess
          checks=[
            ('theme',os.environ['THEME_BASE'],{
              'VERSION','src/assets/css/admin/admin-s01-console-v2.css','src/assets/css/admin/admin-update-center-console-v2.css',
              'src/inc/admin/admin-s01-uiux-polish.php','src/style.css','tests/update-refresh-policy-contract.php','tests/visible-console-v2-contract.php'}),
            ('ops',os.environ['OPS_BASE'],{
              'VERSION','assets/css/current/admin-s01-console-v2.css','includes/views/admin-style-helpers/admin-s01-uiux-polish.php',
              'tests/update-refresh-policy-current-contract.php','tests/visible-console-v2-contract.php','vf-ops.php'}),
            ('m3u8',os.environ['M3U8_BASE'],{
              'VERSION','src/admin/admin-s01-uiux-polish.php','src/admin/ui-v4/admin-s01-console-v2.css','src/vf-tool-m3u8.php',
              'tests/unit/update-refresh-policy-contract.php','tests/unit/visible-console-v2-contract.php'}),
          ]
          for repo,base,expected in checks:
              out=subprocess.check_output(['git','-C',repo,'diff','--name-only',base+'..HEAD'],text=True)
              got={x for x in out.splitlines() if x}
              assert got==expected,(repo,got,expected)
              assert not any('migration' in x.lower() or 'schema' in x.lower() or 'database' in x.lower() for x in got),(repo,got)
          print('EXACT_CHANGED_FILE_FENCE=PASS')
          print('NO_SCHEMA_MIGRATION_DELTA=PASS')
          PY
          echo 'VISIBLE_CONSOLE_V2_SOURCE_GATE=PASS'

      - name: Build deterministic candidates twice and lock runtime authority
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/release-a" "$RUNNER_TEMP/release-b" "$RUNNER_TEMP/authority"

          cat > /tmp/theme-authority.php <<'PHP'
          <?php
          define('ABSPATH','/');
          class WP_Error { public function __construct(...$x){} }
          require $argv[1].'/src/inc/update/class-vf-theme-runtime-authority-v1.php';
          $s=VF_Theme_Runtime_Authority_V1::snapshot($argv[1].'/src');
          unset($s['files']);
          echo json_encode($s, JSON_UNESCAPED_SLASHES), "\n";
          PHP
          php /tmp/theme-authority.php theme > "$RUNNER_TEMP/authority/theme.json"

          python3 - <<'PY' > "$RUNNER_TEMP/metrics.env"
          from pathlib import Path
          import hashlib,json,os,re,zipfile

          def ident(items):
              h=hashlib.sha256()
              for rel,b in sorted(items):
                  h.update((rel+'\0'+hashlib.sha256(b).hexdigest()+'\n').encode())
              return len(items),h.hexdigest()

          def zip_tree(src,prefix,out):
              rows=[(p.relative_to(src).as_posix(),p.read_bytes()) for p in sorted(src.rglob('*'),key=lambda x:x.relative_to(src).as_posix()) if p.is_file()]
              dirs={prefix+'/'}
              for rel,_ in rows:
                  cur=prefix
                  for part in rel.split('/')[:-1]:
                      cur += '/'+part; dirs.add(cur+'/')
              with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
                  for d in sorted(dirs):
                      zi=zipfile.ZipInfo(d); zi.date_time=(1980,1,1,0,0,0); zi.external_attr=(0o40755<<16)|0x10; z.writestr(zi,b'')
                  for rel,b in rows:
                      zi=zipfile.ZipInfo(prefix+'/'+rel); zi.date_time=(1980,1,1,0,0,0); zi.compress_type=zipfile.ZIP_DEFLATED; zi.external_attr=0o100644<<16; z.writestr(zi,b)
              return rows

          def build(outdir):
              out=Path(outdir); out.mkdir(parents=True,exist_ok=True)
              result={}

              theme_zip=out/'vf-tools-theme_V1.35.14.zip'
              trows=zip_tree(Path('theme/src'),'vf-tools-theme',theme_zip)
              tc,tfp=ident(trows)
              ta=json.load(open(Path(os.environ['RUNNER_TEMP'])/'authority/theme.json'))
              result.update(THEME_FILES=str(tc),THEME_RUNTIME_FILES=str(ta['file_count']),THEME_BYTES=str(theme_zip.stat().st_size),
                            THEME_SHA256=hashlib.sha256(theme_zip.read_bytes()).hexdigest(),THEME_FP=tfp,THEME_RUNTIME_FP=ta['fingerprint_sha256'])

              root=Path('ops'); orows=[]
              for p in root.rglob('*'):
                  if not p.is_file() or p.is_symlink(): continue
                  rel=p.relative_to(root).as_posix(); parts=rel.split('/')
                  if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in parts): continue
                  if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',rel,re.I): continue
                  ok=(rel in {'vf-ops.php','uninstall.php'}) if '/' not in rel else parts[0] in {'includes','assets','languages','config'}
                  if ok: orows.append((rel,p.read_bytes()))
              orows.sort(); ops_zip=out/'vf-tools-ops_V1.21.852.zip'
              with zipfile.ZipFile(ops_zip,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
                  for rel,b in orows:
                      zi=zipfile.ZipInfo('vf-ops/'+rel,(2026,9,6,0,0,0)); zi.compress_type=zipfile.ZIP_DEFLATED; zi.external_attr=0o100644<<16; z.writestr(zi,b)
              oc,ofp=ident(orows)
              result.update(OPS_FILES=str(oc),OPS_RUNTIME_FILES=str(oc),OPS_BYTES=str(ops_zip.stat().st_size),
                            OPS_SHA256=hashlib.sha256(ops_zip.read_bytes()).hexdigest(),OPS_RUNTIME_FP=ofp)

              m3_zip=out/'vf-tools-m3u8_V1.25.23.zip'
              mrows=zip_tree(Path('m3u8/src'),'vf-tool-m3u8',m3_zip)
              runtime=[]
              for rel,b in mrows:
                  parts=rel.split('/'); low=[x.lower() for x in parts]; bn=parts[-1].lower()
                  if any(x in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in low): continue
                  if bn in {'readme.md','changelog.md','license','license.txt','package_profile.json'} or bn.endswith(('.sql','.sqlite','.sqlite3','.db','.log','.zip','.tar','.gz','.bak','.tmp')): continue
                  ok=(rel in {'vf-tool-m3u8.php','uninstall.php','plugin-manifest.json','tool-settings.schema.json'}) if len(parts)==1 else parts[0] in {'admin','config','includes','public','templates','tools'}
                  if ok: runtime.append((rel,b))
              mc,mfp=ident(mrows); mrc,mrfp=ident(runtime)
              result.update(M3U8_FILES=str(mc),M3U8_RUNTIME_FILES=str(mrc),M3U8_BYTES=str(m3_zip.stat().st_size),
                            M3U8_SHA256=hashlib.sha256(m3_zip.read_bytes()).hexdigest(),M3U8_FP=mfp,M3U8_RUNTIME_FP=mrfp)

              for p in (theme_zip,ops_zip,m3_zip):
                  with zipfile.ZipFile(p) as z: assert z.testzip() is None
              return result

          a=build(os.environ['RUNNER_TEMP']+'/release-a')
          b=build(os.environ['RUNNER_TEMP']+'/release-b')
          assert a==b,(a,b)
          for k in sorted(a): print(f'{k}={a[k]}')
          PY

          cat "$RUNNER_TEMP/metrics.env"
          cat "$RUNNER_TEMP/metrics.env" >> "$GITHUB_ENV"
          cmp "$RUNNER_TEMP/release-a/vf-tools-theme_V1.35.14.zip" "$RUNNER_TEMP/release-b/vf-tools-theme_V1.35.14.zip"
          cmp "$RUNNER_TEMP/release-a/vf-tools-ops_V1.21.852.zip" "$RUNNER_TEMP/release-b/vf-tools-ops_V1.21.852.zip"
          cmp "$RUNNER_TEMP/release-a/vf-tools-m3u8_V1.25.23.zip" "$RUNNER_TEMP/release-b/vf-tools-m3u8_V1.25.23.zip"
          echo 'DOUBLE_BUILD_DETERMINISM=PASS'
          echo 'RUNTIME_AUTHORITY=PASS'

      - name: Coordinated tag, draft, remote readback and publish transaction
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          created_tags=()
          created_releases=()
          cleanup(){
            rc=$?
            if [ "$rc" -ne 0 ]; then
              for spec in "${created_releases[@]:-}"; do repo="${spec%%|*}"; tag="${spec#*|}"; gh release delete "$tag" --repo "$repo" --cleanup-tag --yes >/dev/null 2>&1 || true; done
              for spec in "${created_tags[@]:-}"; do repo="${spec%%|*}"; tag="${spec#*|}"; gh api --method DELETE "repos/$repo/git/refs/tags/$tag" >/dev/null 2>&1 || true; done
            fi
            exit "$rc"
          }
          trap cleanup EXIT

          preflight(){ repo="$1"; tag="$2"; ! gh release view "$tag" --repo "$repo" >/dev/null 2>&1; ! gh api "repos/$repo/git/ref/tags/$tag" >/dev/null 2>&1; }
          preflight llhzx2018/vf-tools-theme v1.35.14
          preflight llhzx2018/vf-tools-ops v1.21.852
          preflight llhzx2018/vf-tools-m3u8 v1.25.23
          echo 'REMOTE_RELEASE_PREFLIGHT=PASS'

          mk_tag(){ repo="$1"; tag="$2"; sha="$3"; gh api --method POST "repos/$repo/git/refs" -f ref="refs/tags/$tag" -f sha="$sha" >/dev/null; created_tags+=("$repo|$tag"); test "$(gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.sha')" = "$sha"; }
          mk_tag llhzx2018/vf-tools-theme v1.35.14 "$THEME_SHA"
          mk_tag llhzx2018/vf-tools-ops v1.21.852 "$OPS_SHA"
          mk_tag llhzx2018/vf-tools-m3u8 v1.25.23 "$M3U8_SHA"
          echo 'COORDINATED_TAG_CREATE=PASS'

          gh release create v1.35.14 "$RUNNER_TEMP/release-a/vf-tools-theme_V1.35.14.zip" --repo llhzx2018/vf-tools-theme --title 'VF Tools Theme V1.35.14' --notes 'S01-C01 · Visible Console V2. Theme admin and the unified VF update center now use the explicit final Console V2 owner with a navy product rail, blue primary actions, stronger page hierarchy and responsive component cards. Registry/update semantics remain unchanged. Git/Release PASS does not claim Production visibility.' --draft
          created_releases+=("llhzx2018/vf-tools-theme|v1.35.14")
          gh release create v1.21.852 "$RUNNER_TEMP/release-a/vf-tools-ops_V1.21.852.zip" --repo llhzx2018/vf-tools-ops --title 'VF Tools Ops V1.21.852' --notes 'S01-C02 · Visible Console V2. VF Tools Ops admin now has one explicit final visual owner with a navy product rail, blue primary actions, white page heroes and unified cards/status/data surfaces. Routes, schema and update semantics are unchanged. Canonical physical locator remains vf-ops/vf-ops.php. Git/Release PASS does not claim Production visibility.' --draft
          created_releases+=("llhzx2018/vf-tools-ops|v1.21.852")
          gh release create v1.25.23 "$RUNNER_TEMP/release-a/vf-tools-m3u8_V1.25.23.zip" --repo llhzx2018/vf-tools-m3u8 --title 'VF Tools M3U8 V1.25.23' --notes 'S01-C03 · Visible Console V2 loaded from the actual src runtime owner. The admin gets the same strong product rail, page hierarchy, action and data surfaces. Provider schema remains 1.3.0 and M3U8 migration remains CLOSED. Canonical physical locator remains vf-tool-m3u8/vf-tool-m3u8.php. Git/Release PASS does not claim Production visibility.' --draft
          created_releases+=("llhzx2018/vf-tools-m3u8|v1.25.23")
          echo 'COORDINATED_DRAFT_RELEASE_CREATE=PASS'

          mkdir -p "$RUNNER_TEMP/readback/theme" "$RUNNER_TEMP/readback/ops" "$RUNNER_TEMP/readback/m3u8"
          gh release download v1.35.14 --repo llhzx2018/vf-tools-theme --pattern vf-tools-theme_V1.35.14.zip --dir "$RUNNER_TEMP/readback/theme"
          gh release download v1.21.852 --repo llhzx2018/vf-tools-ops --pattern vf-tools-ops_V1.21.852.zip --dir "$RUNNER_TEMP/readback/ops"
          gh release download v1.25.23 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.23.zip --dir "$RUNNER_TEMP/readback/m3u8"
          test "$(stat -c %s "$RUNNER_TEMP/readback/theme/vf-tools-theme_V1.35.14.zip")" = "$THEME_BYTES"
          test "$(sha256sum "$RUNNER_TEMP/readback/theme/vf-tools-theme_V1.35.14.zip"|awk '{print $1}')" = "$THEME_SHA256"
          test "$(stat -c %s "$RUNNER_TEMP/readback/ops/vf-tools-ops_V1.21.852.zip")" = "$OPS_BYTES"
          test "$(sha256sum "$RUNNER_TEMP/readback/ops/vf-tools-ops_V1.21.852.zip"|awk '{print $1}')" = "$OPS_SHA256"
          test "$(stat -c %s "$RUNNER_TEMP/readback/m3u8/vf-tools-m3u8_V1.25.23.zip")" = "$M3U8_BYTES"
          test "$(sha256sum "$RUNNER_TEMP/readback/m3u8/vf-tools-m3u8_V1.25.23.zip"|awk '{print $1}')" = "$M3U8_SHA256"

          python3 - <<'PY'
          import os,zipfile
          items=[
            (os.environ['RUNNER_TEMP']+'/readback/theme/vf-tools-theme_V1.35.14.zip','vf-tools-theme','vf-tools-theme/style.css',b'Version: 1.35.14',int(os.environ['THEME_FILES'])),
            (os.environ['RUNNER_TEMP']+'/readback/ops/vf-tools-ops_V1.21.852.zip','vf-ops','vf-ops/vf-ops.php',b'Version: 1.21.852',int(os.environ['OPS_FILES'])),
            (os.environ['RUNNER_TEMP']+'/readback/m3u8/vf-tools-m3u8_V1.25.23.zip','vf-tool-m3u8','vf-tool-m3u8/vf-tool-m3u8.php',b'Version: 1.25.23',int(os.environ['M3U8_FILES'])),
          ]
          for p,root,main,needle,count in items:
              with zipfile.ZipFile(p) as z:
                  assert z.testzip() is None
                  files=[x for x in z.infolist() if not x.is_dir()]
                  assert len(files)==count
                  assert sorted({x.filename.split('/')[0] for x in files})==[root]
                  assert needle in z.read(main)
          print('REMOTE_ASSET_EXACT_READBACK_BEFORE_PUBLISH=PASS')
          PY

          gh release edit v1.35.14 --repo llhzx2018/vf-tools-theme --draft=false
          gh release edit v1.21.852 --repo llhzx2018/vf-tools-ops --draft=false
          gh release edit v1.25.23 --repo llhzx2018/vf-tools-m3u8 --draft=false

          test "$(gh api repos/llhzx2018/vf-tools-theme/branches/main --jq '.commit.sha')" = "$THEME_SHA"
          test "$(gh api repos/llhzx2018/vf-tools-ops/branches/main --jq '.commit.sha')" = "$OPS_SHA"
          test "$(gh api repos/llhzx2018/vf-tools-m3u8/branches/main --jq '.commit.sha')" = "$M3U8_SHA"
          test "$(gh api repos/llhzx2018/vf-tools-theme/releases/tags/v1.35.14 --jq '.assets[]|select(.name=="vf-tools-theme_V1.35.14.zip")|.digest')" = "sha256:$THEME_SHA256"
          test "$(gh api repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.852 --jq '.assets[]|select(.name=="vf-tools-ops_V1.21.852.zip")|.digest')" = "sha256:$OPS_SHA256"
          test "$(gh api repos/llhzx2018/vf-tools-m3u8/releases/tags/v1.25.23 --jq '.assets[]|select(.name=="vf-tools-m3u8_V1.25.23.zip")|.digest')" = "sha256:$M3U8_SHA256"

          trap - EXIT
          echo "THEME_RELEASE_ID=$(gh api repos/llhzx2018/vf-tools-theme/releases/tags/v1.35.14 --jq '.id')"
          echo "THEME_ASSET_ID=$(gh api repos/llhzx2018/vf-tools-theme/releases/tags/v1.35.14 --jq '.assets[]|select(.name=="vf-tools-theme_V1.35.14.zip")|.id')"
          echo "OPS_RELEASE_ID=$(gh api repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.852 --jq '.id')"
          echo "OPS_ASSET_ID=$(gh api repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.852 --jq '.assets[]|select(.name=="vf-tools-ops_V1.21.852.zip")|.id')"
          echo "M3U8_RELEASE_ID=$(gh api repos/llhzx2018/vf-tools-m3u8/releases/tags/v1.25.23 --jq '.id')"
          echo "M3U8_ASSET_ID=$(gh api repos/llhzx2018/vf-tools-m3u8/releases/tags/v1.25.23 --jq '.assets[]|select(.name=="vf-tools-m3u8_V1.25.23.zip")|.id')"
          echo 'COORDINATED_FORMAL_RELEASE=PASS'
          echo 'REMOTE_ASSET_EXACT_READBACK=PASS'
          echo 'TESTED_ARTIFACT_EQUALS_DELIVERED_ARTIFACT=PASS'
