name: P08 R123 official asset provenance and channel preflight readback
on:
  pull_request:
    paths: [.github/workflows/p08-r123-v013-distribution-asset-readback.yml]
permissions:
  contents: read
jobs:
  remote-asset-provenance:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Download real official P08 private provenance and verify all six exact asset records
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test -n "$GH_TOKEN"
          test "$(gh api repos/llhzx2018/vf-adops/git/ref/tags/v0.1.3 --jq '.object.sha')" = 44d504185f0ac8cf4be552dc5adada989a08b40e
          test "$(gh api repos/llhzx2018/vf-adops/releases/tags/v0.1.3 --jq '.id')" = 446643823
          work="$RUNNER_TEMP/p08-remote-v013"
          mkdir -m 0700 "$work"
          gh release download v0.1.3 -R llhzx2018/vf-adops -D "$work" -p 'RELEASE_PROVENANCE.json' -p 'SHA256SUMS' >/dev/null
          gh api repos/llhzx2018/vf-adops/releases/tags/v0.1.3 --jq '[.assets[]|{id,name,size,digest}]' > "$work/REMOTE_ASSETS.json"
          python3 -B - <<'PY'
          import json,hashlib,os
          from pathlib import Path
          work=Path(os.environ['RUNNER_TEMP'])/'p08-remote-v013'
          p=work/'RELEASE_PROVENANCE.json'
          j=json.loads(p.read_text())
          assert j['schema']=='p08-adops-release-provenance/v1'
          assert j['tag']=='v0.1.3' and j['target_version']=='0.1.3'
          assert j['target_sha']=='44d504185f0ac8cf4be552dc5adada989a08b40e'
          assert j['source_version']=='0.1.2' and j['source_sha']=='da36b736e075ea0908aa38f896162cac8651f289'
          assert j['production_auto_apply'] is False
          assets=json.loads((work/'REMOTE_ASSETS.json').read_text())
          names={'VF_AdOps_V0.1.3_FULL.zip','VF_AdOps_V0.1.3_UPDATE.zip','p08-owner-atomic-once.php','SHA256SUMS','RELEASE_PROVENANCE.json','CHANGELOG.md'}
          assert len(assets)==6 and {a['name'] for a in assets}==names
          sums={name:digest for digest,name in (v.split('  ',1) for v in (work/'SHA256SUMS').read_text().splitlines())}
          assert set(sums)==names-{'SHA256SUMS'}
          for a in assets:
              assert a['id']>0 and a['size']>0 and isinstance(a['digest'],str)
              if a['name']!='SHA256SUMS':
                  assert a['digest']=='sha256:'+sums[a['name']]
              if a['name'] in j['assets']:
                  v=j['assets'][a['name']]
                  assert (v['bytes'],v['sha256'])==(a['size'],a['digest'][7:])
          for local in ('RELEASE_PROVENANCE.json','SHA256SUMS'):
              digest=hashlib.sha256((work/local).read_bytes()).hexdigest()
              assert next(a for a in assets if a['name']==local)['digest']=='sha256:'+digest
          for key in ('source_full_manifest_sha256','target_full_manifest_sha256'):
              assert len(j[key])==64 and all(z in '0123456789abcdef' for z in j[key])
              print('R123_'+key.upper()+'='+j[key])
          for name in sorted(j['assets']):
              meta=next(a for a in assets if a['name']==name)
              print('R123_ASSET='+name+':'+str(meta['id'])+':'+str(meta['size'])+':'+meta['digest'][7:])
          print('R123_OFFICIAL_TAG_RELEASE_SIX_REMOTE_METADATA_PROVENANCE_AND_SHA256=PASS')
          PY
      - name: Fetch exact final P08 installed updater discovery source temporarily
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 44d504185f0ac8cf4be552dc5adada989a08b40e
          path: p08
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Real PHP 8.4 HTTPS cURL runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: curl, mbstring, zip
      - name: Real nonproduction read-only PHP official 0.1.2 bridge to 0.1.3 discovery and installed-current check
        shell: bash
        env:
          P08_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C p08 rev-parse HEAD)" = 44d504185f0ac8cf4be552dc5adada989a08b40e
          php <<'PHP' || { echo R123_REAL_LIVE_PHP_DISCOVERY=FAIL; exit 1; }
          <?php
          declare(strict_types=1);
          require 'p08/src/Upgrade/R105OfficialNextRelease.php';
          use VF\AdOps\Upgrade\R105OfficialNextRelease;
          $token=(string)getenv('P08_READ_TOKEN');
          $u=new R105OfficialNextRelease();
          try {
              $m=new ReflectionMethod($u,'inspect');
              $m->setAccessible(true);
              $new=$m->invoke($u,$token,false,
                  'da36b736e075ea0908aa38f896162cac8651f289',
                  'e9d5a9b1c63b054b8bae193e5a66746fd9bf2ce9e1e5adbaacbe25a91991ade5');
              if (($new['status']??'')!=='OFFICIAL_NEXT_METADATA_VERIFIED_NOT_STAGED'
                  || ($new['target_version']??null)!=='0.1.3'
                  || ($new['target_sha']??null)!=='44d504185f0ac8cf4be552dc5adada989a08b40e'
                  || ($new['can_install']??true)!==false)
                  throw new RuntimeException('R123_NEXT_READ_ONLY_STATUS');
              echo "R123_REAL_LIVE_OFFICIAL_012_BRIDGE_DISCOVERS_013_NO_APPLY=PASS\n";
              $current=$u->checkInstalled013($token,
                  'da36b736e075ea0908aa38f896162cac8651f289',
                  'e9d5a9b1c63b054b8bae193e5a66746fd9bf2ce9e1e5adbaacbe25a91991ade5',
                  '44d504185f0ac8cf4be552dc5adada989a08b40e');
              if (($current['status']??'')!=='CURRENT_VERSION_NO_NEWER_RELEASE'
                  || ($current['target_version']??null)!=='0.1.3'
                  || ($current['can_install']??true)!==false)
                  throw new RuntimeException('R123_CURRENT_READ_ONLY_STATUS');
              echo "R123_REAL_LIVE_013_INSTALLED_READS_CURRENT_NO_DOWNGRADE=PASS\n";
          } catch (Throwable $e) {
              echo "R123_REAL_CHANNEL_CONTRACT_FAIL_CLOSED=YES\n";
              exit(1);
          }
          PHP
          echo R123_TRUE_OFFICIAL_GITHUB_P08_APP_DISCOVERY=PASS
      - name: Purge downloaded private release metadata after proof
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- "$RUNNER_TEMP/p08-remote-v013" p08
          echo R123_PRIVATE_RELEASE_METADATA_PURGED=YES
