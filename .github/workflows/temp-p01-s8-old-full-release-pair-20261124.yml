name: TEMP P01 S8 old FULL release pair revalidation proof
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temp-p01-s8-old-full-release-pair-20261124.yml
permissions:
  contents: read
concurrency:
  group: p01-s8-old-full-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  old-full-source-recheck:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'test/p01-s8-old-full-release-pair-')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Transient exact P01 private source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-startnew
          ref: e0ddad49f48aa375981cb30a808b250b538af72b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
          fetch-depth: 1
      - name: Verify source SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C private-src rev-parse HEAD)" = "e0ddad49f48aa375981cb30a808b250b538af72b"
          echo P01_S8_OLD_FULL_EXACT_SOURCE=PASS
      - name: PHP 8.4 isolated test runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, zip, sodium, dom, xml, fileinfo, curl, openssl
          tools: composer:v2
          coverage: none
      - name: Old FULL source freshness and owner prepare gate targeted tests
        working-directory: private-src
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          python3 scripts/check_php_syntax.py >"$RUNNER_TEMP/p01-oldfull-lint.log" 2>&1
          echo P01_S8_OLD_FULL_PHP_LINT=PASS
          composer install --no-interaction --prefer-dist --no-progress --quiet >"$RUNNER_TEMP/p01-oldfull-composer.log" 2>&1
          echo P01_S8_OLD_FULL_COMPOSER=PASS
          export APP_ENV=testing DB_CONNECTION=sqlite DB_DATABASE=:memory:
          export APP_KEY="base64:$(openssl rand -base64 32)"
          export CACHE_STORE=array SESSION_DRIVER=array QUEUE_CONNECTION=sync
          set +e
          ./vendor/bin/phpunit --log-junit "$RUNNER_TEMP/p01-oldfull-junit.xml" \
            tests/Unit/NewOfficialPreviousFullReleaseVerifierTest.php \
            tests/Feature/OwnerUpdatePageTest.php >"$RUNNER_TEMP/p01-oldfull-phpunit.log" 2>&1
          rc=$?
          set -e
          python3 - "$RUNNER_TEMP/p01-oldfull-junit.xml" <<'PY'
          import pathlib,sys,re,xml.etree.ElementTree as ET
          p=pathlib.Path(sys.argv[1])
          if not p.is_file():
              print('P01_S8_OLD_FULL_JUNIT=MISSING')
              sys.exit(1)
          cases=list(ET.parse(p).getroot().iter('testcase'))
          skipped=sum(c.find('skipped') is not None for c in cases)
          failed=sum(c.find('failure') is not None or c.find('error') is not None for c in cases)
          assertions=sum(int(c.get('assertions','0')) for c in cases)
          print('P01_S8_OLD_FULL_JUNIT='+','.join(map(str,(len(cases),assertions,skipped,failed))))
          for c in cases:
              if c.find('failure') is None and c.find('error') is None: continue
              print('P01_S8_OLD_FULL_FAILED_METHOD='+re.sub('[^A-Za-z0-9_]', '',c.get('name',''))[:115])
          if len(cases)<22 or assertions<60 or skipped or failed: sys.exit(1)
          PY
          if [ "$rc" -ne 0 ]; then echo P01_S8_OLD_FULL_NATIVE_TEST=FAIL; exit "$rc"; fi
          echo P01_S8_OLD_FULL_NATIVE_TEST=PASS
      - name: Always scrub exact private source and test outputs
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- private-src
          rm -f -- "$RUNNER_TEMP"/p01-oldfull-*
          test ! -e private-src
          echo P01_S8_OLD_FULL_CLEANUP=PASS
