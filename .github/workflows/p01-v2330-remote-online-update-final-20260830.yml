name: P01 V2.33 Final Remote Online Update Gate
on:
  push:
    branches: [task/p01-v2330-formal-release-20260830]
    paths:
      - .github/workflows/p01-v2330-remote-online-update-final-20260830.yml
      - scripts/p01-v2330-remote-final.sh
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      ROOT: /tmp/p01-v2330-final-owner
      PORT: '18685'
      ADMIN_PASS: 'P01V2330!FinalRemote'
      EVID: /tmp/p01-v2330-final-evidence
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - name: Checkout gate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: runner
      - name: Checkout immutable V2.32 source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.32.0
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: production
      - name: Checkout published V2.33 core-updates authority
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: 7d0949e2b8e5fa11e53286685fb7fc8635b04974
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: updates
      - name: Exact publication and discovery fence
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVID"
          test "$(git -C production rev-parse HEAD)" = 120a42667fce7357fdaef03b64cb7ea41392040d
          test "$(git -C production rev-parse HEAD^{tree})" = d0fa7c87ebefef083712ec0b7707a6c4273943f2
          test "$(git -C production rev-parse HEAD:src)" = f348cb314623906acc851cb79d75b1c8f6637aff
          test "$(git -C updates rev-parse HEAD)" = 7d0949e2b8e5fa11e53286685fb7fc8635b04974
          test "$(gh api repos/llhzx2018/core-updates/contents/projects/P01.json?ref=main --jq .sha)" = ea2baed6a9fe48237934fe1ac7200140a417b30f
          test "$(gh api repos/llhzx2018/vf-start/branches/main --jq .commit.sha)" = 8c819c8bfd055d16b3ac367cef15f723431d9a42
          test "$(gh api repos/llhzx2018/vf-start/branches/develop --jq .commit.sha)" = 8c819c8bfd055d16b3ac367cef15f723431d9a42
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.33.0 --jq .object.sha)" = 8c819c8bfd055d16b3ac367cef15f723431d9a42
          test "$(gh api repos/llhzx2018/vf-start/releases/tags/v2.33.0 --jq .id)" = 379071259
          for run in 33267181746 33268162412 33268277822 33268865316 33269044619 33269077239 33269116444 33269187425; do test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$run --jq .conclusion)" = success; done
          jq -e '.current_version=="2.32.0" and .target_version=="2.33.0" and .from_versions==["2.32.0"] and .schema_from=="2026082901" and .schema_to=="2026082901" and .release_tag=="v2.33.0" and .release_id==379071259 and .product_identity=="8c819c8bfd055d16b3ac367cef15f723431d9a42" and .asset_name=="VF_Start_V2.33.0_UPDATE.zip" and .asset_bytes==1343451 and .asset_sha256=="9520e7f45b37341456fe9f1dba1f248fe02e84143c52230760fcddb307226a9c"' updates/projects/P01.json >/dev/null
          REL=$(gh api repos/llhzx2018/vf-start/releases/tags/v2.33.0)
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.33.0_UPDATE.zip")|.size' <<<"$REL")" = 1343451
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.33.0_UPDATE.zip")|.digest' <<<"$REL")" = sha256:9520e7f45b37341456fe9f1dba1f248fe02e84143c52230760fcddb307226a9c
          echo P01_V2330_FINAL_REMOTE_TRUTH_FENCE=PASS | tee "$EVID/truth-fence.txt"
      - name: Real remote online update and V2.33 runtime gate
        shell: bash
        run: bash runner/scripts/p01-v2330-remote-final.sh
      - name: Final verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fx P01_V2320_TO_V2330_REMOTE_ONLINE_UPDATE=PASS "$EVID/runtime-verdict.txt"
          grep -Fx P01_V2330_REMOTE_HEALTH_TRIAGE=PASS "$EVID/runtime-verdict.txt"
          grep -Fx P01_V2330_REMOTE_HOME_NEEDS_ACTION_6=PASS "$EVID/browser-verdict.txt"
          grep -Fx P01_V2330_REMOTE_RESTRICTED_REVIEW_42=PASS "$EVID/browser-verdict.txt"
          cat > "$EVID/verdict.txt" <<'EOF'
          P01_V2320_TO_V2330_REMOTE_ONLINE_UPDATE_GATE=PASS
          P01_V2330_SCHEMA_UNCHANGED_2026082901=PASS
          P01_V2330_DATA_PRESERVATION=PASS
          P01_V2330_SQLITE_INTEGRITY=PASS
          P01_V2330_PUBLIC_PRIVATE_HTTP=PASS
          P01_V2330_HEALTH_TRIAGE_REMOTE=PASS
          P01_V2330_HOME_NEEDS_ACTION_6=PASS
          P01_V2330_RESTRICTED_REVIEW_42=PASS
          P01_V2330_DESKTOP_MOBILE=PASS
          P01_V2330_STRICT_FRESH_GATE_33269044619=BOUND_PASS
          P01_V2330_READY_FOR_OWNER_PRODUCTION_UPGRADE=YES
          OWNER_PRODUCTION_WRITE=NO
          EOF
          cat "$EVID/verdict.txt"
      - name: Upload final remote evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-v2330-final-remote-evidence-${{ github.run_id }}
          path: /tmp/p01-v2330-final-evidence
          if-no-files-found: warn
          retention-days: 90
