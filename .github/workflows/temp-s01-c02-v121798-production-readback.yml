name: TEMP S01-C02 1.21.798 Production Readback

on:
  push:
    branches:
      - temp/s01-c02-v121798-production-readback-20260903
    paths:
      - '.github/workflows/temp-s01-c02-v121798-production-readback.yml'

permissions:
  contents: read

jobs:
  production-readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Probe public-safe Production SEO closure endpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          URL='https://www3.m3u8.one/wp-json/vf-ops/v1/s01-seo-closure'
          CODE="$(curl -sS --max-time 30 --retry 2 --retry-delay 2 -o /tmp/body.txt -w '%{http_code}' "$URL" || true)"
          echo "HTTP_STATUS=$CODE"
          echo '--- BODY ---'
          cat /tmp/body.txt || true
          echo
          if [ "$CODE" = 200 ]; then
            jq empty /tmp/body.txt
            jq -c '{pluginVersion,closureStatus,ownerActionRequired,formalPrimaryCount,ownerCandidateCount,plannerRows,plannerRevision,bridgeStatus,gateStatus,gateBlocking,gateWarnings,preflightStatus,preflightCode,readyForPublish,authorityActive,authoritySourceRows,authorityPrimaryRows,updatedAt}' /tmp/body.txt
          fi
          echo 'PRODUCTION_READBACK_PROBE=COMPLETE'
