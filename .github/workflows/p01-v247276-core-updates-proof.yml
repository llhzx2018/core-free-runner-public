name: P01 V2.47.276 Core Updates Proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p01-v247276-core-updates-proof.yml"

permissions:
  contents: read

jobs:
  proof:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'proof(P01): V2.47.276 core-updates')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli jq >/dev/null
      - name: Clone exact candidate
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/core-updates.git" candidate
          git -C candidate fetch -q origin b95914fabd682bdce0cee30e3ed73b8e8e106cb6
          git -C candidate checkout -q --detach b95914fabd682bdce0cee30e3ed73b8e8e106cb6
          echo CORE_UPDATES_EXACT_SOURCE=PASS
      - name: Canonical CI equivalent
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 scripts/check_manifest_contract.py
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find update-core/php -type f -name '*.php' -print0)
          php update-core/php/tests/run.php
          echo CORE_UPDATES_CANONICAL_CI_EQUIVALENT=PASS
      - name: Verify identity
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          jq -e '
            .current_version=="2.47.275" and
            .target_version=="2.47.276" and
            .from_versions==["2.47.275"] and
            .release_id==405631327 and
            .product_identity=="95a62329dd756d0eb58c5dc3a2a3f6be1d8a2b50" and
            .asset_name=="VF_Start_V2.47.276_UPDATE.zip" and
            .asset_bytes==2353761 and
            .asset_sha256=="3e17ae87376bfda27381ec0f78bdc8596f91667274fa0aca9eef71d1e2bedf77" and
            (.notes|contains("中文一致性收口"))
          ' projects/P01.json >/dev/null
          echo P01_V247276_MANIFEST_IDENTITY=PASS
      - name: Verify bounded delta
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          git fetch -q origin main
          mapfile -t changed < <(git diff --name-only origin/main...HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "projects/P01.json"
          echo CORE_UPDATES_BOUNDED_DELTA=PASS
          echo PRODUCTION_WRITE=NO
