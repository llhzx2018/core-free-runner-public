name: S01 Ops 1.21.907 Non-PASS Refinement R18 Release Gate

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_REPO: llhzx2018/vf-tools-ops
      CANDIDATE_SHA: 10bfca7353b4a242e7840bb5e68f6390e71f7538
      BASE_SHA: 2747ce0d8ca5ffc29fe459fcfa865ea80f39d5b0
      VERSION: 1.21.907
      PREVIOUS_TAG: v1.21.902
      PREVIOUS_ASSET: vf-tools-ops_V1.21.902.zip
      ASSET: vf-tools-ops_V1.21.907.zip

    steps:
      - name: Checkout exact Ops main
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 10bfca7353b4a242e7840bb5e68f6390e71f7538
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: ops
          persist-credentials: false

      - name: Identity scope and release applicability gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(tr -d '\r\n' < ops/VERSION)" = "$VERSION"
          grep -Fq 'Version: 1.21.907' ops/vf-ops.php
          grep -Fq "VF_OPS_VERSION', '1.21.907'" ops/vf-ops.php
          grep -Fq 'S01-NONPASS-R18' ops/vf-ops.php

          actual="$(git -C ops diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" | sort)"
          expected="$(printf '%s\n'             CHANGELOG.md             VERSION             assets/css/current/admin-s01-content-seo-r16.css             assets/css/current/admin-s01-dashboard-r14.css             assets/css/current/admin-s01-quality-r17.css             assets/css/current/admin-s01-system-publish-r13.css             assets/css/current/admin-s01-tools-r15.css             includes/admin-v13/views/acceptance.php             includes/views/admin-style-helpers/admin-s01-uiux-polish.php             tests/s01-c02-121903-dashboard-r14-contract.php             tests/s01-c02-121904-tools-r15-contract.php             tests/s01-c02-121905-content-seo-r16-contract.php             tests/s01-c02-121906-clean-authority-closure-contract.php             tests/s01-c02-121906-quality-r17-contract.php             tests/s01-c02-121907-nonpass-r18-contract.php             vf-ops.php | sort)"
          test "$actual" = "$expected"

          # Public Authority Applicability for this exact release:
          # TESTING + GIT + UPGRADE + SECURITY are REQUIRED.
          # DATA_SCHEMA is N_A because schema/data/migration are unchanged.
          # OWNER preview is N_A pre-release under the bounded mature-admin
          # continuous-delivery class; post-release OWNER real-use remains open.
          test "$(git -C ops diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" -- database config includes/v6 includes/wp-update | wc -l)" = "0"
          test "$(git -C ops diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" -- docs/authority | wc -l)" = "0"

          php ops/tests/s01-c02-121907-nonpass-r18-contract.php
          php -l ops/vf-ops.php >/dev/null
          php -l ops/includes/admin-v13/views/acceptance.php >/dev/null
          php -l ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php >/dev/null

          python3 - <<'PY'
          from pathlib import Path
          files = [
              Path('ops/assets/css/current/admin-s01-dashboard-r14.css'),
              Path('ops/assets/css/current/admin-s01-tools-r15.css'),
              Path('ops/assets/css/current/admin-s01-content-seo-r16.css'),
              Path('ops/assets/css/current/admin-s01-quality-r17.css'),
              Path('ops/assets/css/current/admin-s01-system-publish-r13.css'),
          ]
          for p in files:
              text=p.read_text(encoding='utf-8')
              if text.count('{') != text.count('}'):
                  raise SystemExit(f'css balance failed: {p}')
              if 'prefers-reduced-motion' not in text:
                  raise SystemExit(f'reduced motion missing: {p}')
          PY

          ! grep -RInE 'gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY'             ops/vf-ops.php             ops/includes/admin-v13/views/acceptance.php             ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php             ops/assets/css/current/admin-s01-dashboard-r14.css             ops/assets/css/current/admin-s01-tools-r15.css             ops/assets/css/current/admin-s01-content-seo-r16.css             ops/assets/css/current/admin-s01-quality-r17.css             ops/assets/css/current/admin-s01-system-publish-r13.css

          echo PASS_IDENTITY_SCOPE_PUBLIC_AUTHORITY_DRIFT_SECURITY

      - name: Build deterministic runtime-only package
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf stage dist
          mkdir -p stage/vf-ops dist
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re,zipfile
          root=Path('ops'); stage=Path('stage/vf-ops')
          def runtime(rel):
              rel=rel.replace('\\','/').lstrip('/')
              if not rel or '../' in rel:return False
              if re.search(r'(^|/)(?:\.git|\.github|tests?|docs?|evidence|private|tmp|temp|cache|logs?)(/|$)',rel,re.I):return False
              if re.search(r'\.(?:sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',rel,re.I):return False
              if '/' not in rel:return rel in ('vf-ops.php','uninstall.php')
              return re.match(r'^(?:includes|assets|languages|config)/',rel) is not None
          files=[]
          for p in sorted((x for x in root.rglob('*') if x.is_file()),key=lambda x:x.relative_to(root).as_posix()):
              rel=p.relative_to(root).as_posix()
              if not runtime(rel):continue
              if p.is_symlink():raise SystemExit('runtime symlink forbidden: '+rel)
              data=p.read_bytes(); files.append((rel,data))
              q=stage/rel; q.parent.mkdir(parents=True,exist_ok=True); q.write_bytes(data)
          canonical=b''.join(rel.encode()+b'\0'+hashlib.sha256(data).hexdigest().encode()+b'\n' for rel,data in files)
          Path('/tmp/runtime_count').write_text(str(len(files)))
          Path('/tmp/runtime_fp').write_text(hashlib.sha256(canonical).hexdigest())
          for out in ('dist/vf-tools-ops_V1.21.907.zip','dist/rebuild-vf-tools-ops_V1.21.907.zip'):
              with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
                  for rel,data in files:
                      info=zipfile.ZipInfo('vf-ops/'+rel,date_time=(2020,1,1,0,0,0))
                      info.compress_type=zipfile.ZIP_DEFLATED
                      info.external_attr=(0o100644 & 0xFFFF)<<16
                      z.writestr(info,data)
          PY
          cmp "dist/$ASSET" "dist/rebuild-$ASSET"
          unzip -tq "dist/$ASSET" >/dev/null
          unzip -p "dist/$ASSET" vf-ops/vf-ops.php | grep -Fq 'Version: 1.21.907'
          unzip -Z1 "dist/$ASSET" | grep -Fxq 'vf-ops/assets/css/current/admin-s01-dashboard-r14.css'
          unzip -Z1 "dist/$ASSET" | grep -Fxq 'vf-ops/assets/css/current/admin-s01-tools-r15.css'
          unzip -Z1 "dist/$ASSET" | grep -Fxq 'vf-ops/assets/css/current/admin-s01-content-seo-r16.css'
          unzip -Z1 "dist/$ASSET" | grep -Fxq 'vf-ops/assets/css/current/admin-s01-quality-r17.css'
          unzip -Z1 "dist/$ASSET" | grep -Fxq 'vf-ops/assets/css/current/admin-s01-system-publish-r13.css'
          test "$(cat /tmp/runtime_count)" = "972"
          sha256sum "dist/$ASSET" | awk '{print $1}' >/tmp/asset_sha
          stat -c '%s' "dist/$ASSET" >/tmp/asset_bytes
          echo PASS_PACKAGE

      - name: Previous release upgrade compatibility
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p previous
          gh release download "$PREVIOUS_TAG" --repo "$TARGET_REPO" --pattern "$PREVIOUS_ASSET" --dir previous
          test "$(stat -c '%s' "previous/$PREVIOUS_ASSET")" = "3463022"
          test "$(sha256sum "previous/$PREVIOUS_ASSET" | awk '{print $1}')" = "fb8c9eec909c9da57e1900288973a2297895597e9801d53aaf2062f91d63e58c"

          unzip -Z1 "previous/$PREVIOUS_ASSET" | grep -v '/$' | sort >/tmp/prev.txt
          unzip -Z1 "dist/$ASSET" | grep -v '/$' | sort >/tmp/new.txt
          comm -13 /tmp/prev.txt /tmp/new.txt >/tmp/added.txt
          comm -23 /tmp/prev.txt /tmp/new.txt >/tmp/removed.txt

          expected_added="$(printf '%s\n'             vf-ops/assets/css/current/admin-s01-content-seo-r16.css             vf-ops/assets/css/current/admin-s01-dashboard-r14.css             vf-ops/assets/css/current/admin-s01-quality-r17.css             vf-ops/assets/css/current/admin-s01-tools-r15.css | sort)"
          test "$(cat /tmp/added.txt)" = "$expected_added"
          test ! -s /tmp/removed.txt
          echo PASS_UPGRADE_COMPAT

      - name: Candidate receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > dist/candidate-receipt.txt <<EOF
          COMPONENT=S01-C02
          VERSION=$VERSION
          SOURCE_SHA=$CANDIDATE_SHA
          BASE_RELEASE=v1.21.902
          ASSET=$ASSET
          BYTES=$(cat /tmp/asset_bytes)
          SHA256=$(cat /tmp/asset_sha)
          RUNTIME_FILES=$(cat /tmp/runtime_count)
          RUNTIME_FINGERPRINT=$(cat /tmp/runtime_fp)
          RELEASE_CLASS=FILES_ONLY_ADMIN_UX_UI
          OWNER_PREVIEW_RUNTIME=N_A_PRE_RELEASE_CONTINUOUS_DELIVERY
          OWNER_REAL_USE=POST_RELEASE_REQUIRED
          PUBLIC_AUTHORITY_TESTING=PASS
          PUBLIC_AUTHORITY_GIT=PASS
          PUBLIC_AUTHORITY_UPGRADE=PASS
          PUBLIC_AUTHORITY_SECURITY=PASS
          PUBLIC_AUTHORITY_DATA_SCHEMA=N_A
          AUTHORITY_DRIFT=NONE
          SCHEMA=6.0.0_TO_6.0.0
          DATA_MIGRATION=NONE
          M3U8_OWNERSHIP=UNCHANGED
          THEME_OWNERSHIP=UNCHANGED
          SHARED_UPDATER=UNCHANGED
          RESULT=PASS
          EOF
          cat dist/candidate-receipt.txt

      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: s01-c02-121907-r18-candidate
          path: |
            dist/vf-tools-ops_V1.21.907.zip
            dist/candidate-receipt.txt
          if-no-files-found: error
          retention-days: 14

  formal-release:
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_REPO: llhzx2018/vf-tools-ops
      SOURCE_SHA: 10bfca7353b4a242e7840bb5e68f6390e71f7538
      VERSION: 1.21.907
      TAG: v1.21.907
      ASSET: vf-tools-ops_V1.21.907.zip

    steps:
      - name: Download exact tested candidate
        uses: actions/download-artifact@v4
        with:
          name: s01-c02-121907-r18-candidate
          path: tested

      - name: Verify tested artifact identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f "tested/$ASSET"
          test -f tested/candidate-receipt.txt
          grep -Fqx "VERSION=$VERSION" tested/candidate-receipt.txt
          grep -Fqx "SOURCE_SHA=$SOURCE_SHA" tested/candidate-receipt.txt
          grep -Fqx "ASSET=$ASSET" tested/candidate-receipt.txt
          grep -Fqx 'RESULT=PASS' tested/candidate-receipt.txt
          grep -Fqx 'PUBLIC_AUTHORITY_UPGRADE=PASS' tested/candidate-receipt.txt
          grep -Fqx 'PUBLIC_AUTHORITY_SECURITY=PASS' tested/candidate-receipt.txt
          unzip -tq "tested/$ASSET" >/dev/null
          unzip -p "tested/$ASSET" vf-ops/vf-ops.php | grep -Fq 'Version: 1.21.907'
          echo PASS_EXACT_TESTED_ARTIFACT

      - name: Create exact formal release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          if gh release view "$TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            echo "Release already exists; refusing overwrite." >&2
            exit 31
          fi
          test "$(gh api "repos/$TARGET_REPO/commits/$SOURCE_SHA" --jq '.sha')" = "$SOURCE_SHA"
          BYTES="$(stat -c '%s' "tested/$ASSET")"
          SHA="$(sha256sum "tested/$ASSET" | awk '{print $1}')"
          RUNTIME_FILES="$(awk -F= '$1=="RUNTIME_FILES"{print $2}' tested/candidate-receipt.txt)"
          RUNTIME_FP="$(awk -F= '$1=="RUNTIME_FINGERPRINT"{print $2}' tested/candidate-receipt.txt)"
          cat > /tmp/release-notes.md <<EOF
          # VF Tools Ops V1.21.907

          **S01-C02 · Six-domain UX/UI Refinement R14-R18**

          Continuous Mature Admin UX/UI release after 1.21.902.

          Product refinement:
          - Dashboard R14: deterministic clean authority, readable task-first operations layout
          - Tools R15: deterministic Tool Workbench visual authority, M3U8 canonical ownership preserved
          - Content + SEO R16/R18: unified clean authority and inline header status
          - Quality R17/R18: acceptance overview aligned to current DOM and human-readable gate semantics
          - Publish + System R18: duplicate current-domain label removed and shell/readability aligned across domains

          Safety:
          - Six-domain IA unchanged
          - Canonical routes unchanged
          - Schema 6.0.0 -> 6.0.0
          - Data Migration NONE
          - Business write semantics unchanged
          - M3U8 ownership unchanged
          - Theme ownership unchanged
          - Shared updater unchanged
          - Rollback v1.21.902
          - OWNER visual acceptance remains post-update

          Exact asset:
          - $ASSET
          - Bytes $BYTES
          - SHA-256 $SHA
          - Runtime files $RUNTIME_FILES
          - Runtime Fingerprint $RUNTIME_FP
          EOF
          created=0
          cleanup(){ rc=$?; if [ "$rc" -ne 0 ] && [ "$created" -eq 1 ]; then gh release delete "$TAG" --repo "$TARGET_REPO" --cleanup-tag -y >/dev/null 2>&1 || true; fi; exit "$rc"; }
          trap cleanup EXIT
          gh release create "$TAG" "tested/$ASSET#VF Tools Ops $VERSION"             --repo "$TARGET_REPO"             --target "$SOURCE_SHA"             --title "VF Tools Ops V$VERSION"             --notes-file /tmp/release-notes.md
          created=1
          trap - EXIT
          echo PASS_FORMAL_RELEASE_CREATED

      - name: Independent remote release readback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          JSON="$(gh api "repos/$TARGET_REPO/releases/tags/$TAG")"
          RID="$(jq -r '.id' <<<"$JSON")"
          AID="$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.id' <<<"$JSON")"
          REMOTE_BYTES="$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.size' <<<"$JSON")"
          test -n "$RID" && test "$RID" != null
          test -n "$AID" && test "$AID" != null
          test "$REMOTE_BYTES" = "$(stat -c '%s' "tested/$ASSET")"
          test "$(gh api "repos/$TARGET_REPO/git/ref/tags/$TAG" --jq '.object.sha')" = "$SOURCE_SHA"
          mkdir -p remote
          gh release download "$TAG" --repo "$TARGET_REPO" --pattern "$ASSET" --dir remote
          test "$(sha256sum "remote/$ASSET" | awk '{print $1}')" = "$(sha256sum "tested/$ASSET" | awk '{print $1}')"
          cmp "tested/$ASSET" "remote/$ASSET"
          cat > formal-release-receipt.txt <<EOF
          COMPONENT=S01-C02
          VERSION=$VERSION
          SOURCE_SHA=$SOURCE_SHA
          TAG=$TAG
          RELEASE_ID=$RID
          ASSET=$ASSET
          ASSET_ID=$AID
          BYTES=$REMOTE_BYTES
          SHA256=$(sha256sum "remote/$ASSET" | awk '{print $1}')
          RUNTIME_FILES=$(awk -F= '$1=="RUNTIME_FILES"{print $2}' tested/candidate-receipt.txt)
          RUNTIME_FINGERPRINT=$(awk -F= '$1=="RUNTIME_FINGERPRINT"{print $2}' tested/candidate-receipt.txt)
          PUBLIC_AUTHORITY_RELEASE_COVERAGE=PASS
          NO_REQUIRED_GATE_MISSING=YES
          NO_UNKNOWN_APPLICABILITY=YES
          NO_INVALID_DYNAMIC_SNAPSHOT=YES
          NO_HISTORICAL_STATE_AS_CURRENT=YES
          REMOTE_READBACK=PASS
          PRODUCTION=NOT_YET_CLAIMED
          OWNER_VISUAL_ACCEPTANCE=OPEN
          RESULT=PASS
          EOF
          cat formal-release-receipt.txt

      - name: Upload formal release receipt
        uses: actions/upload-artifact@v4
        with:
          name: s01-c02-121907-r18-formal-release
          path: formal-release-receipt.txt
          if-no-files-found: error
          retention-days: 30
