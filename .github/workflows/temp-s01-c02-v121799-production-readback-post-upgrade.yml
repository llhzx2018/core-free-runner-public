name: TEMP S01-C02 1.21.799 Production Readback Post Upgrade

on:
  push:
    branches:
      - temp/s01-c02-v121799-production-readback-post-upgrade-20260903
    paths:
      - '.github/workflows/temp-s01-c02-v121799-production-readback-post-upgrade.yml'

permissions:
  contents: read

jobs:
  production-readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Enumerate public VF Ops REST routes
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT='https://www3.m3u8.one/wp-json/'
          curl -fsSL --max-time 30 --retry 2 --retry-delay 2 "$ROOT" -o /tmp/root.json
          jq empty /tmp/root.json
          echo '--- VF OPS ROUTES ---'
          jq -r '.routes|keys[]|select(test("vf-ops|seo|closure|release|static";"i"))' /tmp/root.json | tee /tmp/routes.txt
          echo "VF_OPS_ROUTE_COUNT=$(wc -l < /tmp/routes.txt)"

      - name: Read public-safe S01 domain authority
        shell: bash
        run: |
          set -Eeuo pipefail
          URL='https://www3.m3u8.one/wp-json/vf-ops/v1/s01-domain-authority'
          CODE="$(curl -sS --max-time 30 --retry 2 --retry-delay 2 -o /tmp/domain.json -w '%{http_code}' "$URL" || true)"
          echo "DOMAIN_AUTHORITY_HTTP=$CODE"
          cat /tmp/domain.json || true
          echo
          test "$CODE" = 200
          jq empty /tmp/domain.json
          jq -e '.pluginVersion=="1.21.799" and .status=="CURRENT" and .authorityFinalHost=="https://ilovem3u8.com" and .configuredPublicBaseUrl=="https://ilovem3u8.com" and .authorityMatch==true' /tmp/domain.json >/dev/null
          echo 'PRODUCTION_S01_DOMAIN_AUTHORITY=PASS'

      - name: Read public-safe S01 SEO closure
        shell: bash
        run: |
          set -Eeuo pipefail
          URL='https://www3.m3u8.one/wp-json/vf-ops/v1/s01-seo-closure'
          CODE="$(curl -sS --max-time 30 --retry 2 --retry-delay 2 -o /tmp/closure.json -w '%{http_code}' "$URL" || true)"
          echo "SEO_CLOSURE_HTTP=$CODE"
          cat /tmp/closure.json || true
          echo
          test "$CODE" = 200
          jq empty /tmp/closure.json
          jq -e '.pluginVersion=="1.21.799"' /tmp/closure.json >/dev/null
          echo 'PRODUCTION_S01_SEO_CLOSURE_READBACK=PASS'

      - name: Confirm Production runtime and current closure frontier
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "EXPOSED_PLUGIN_VERSION=$(jq -r '.pluginVersion' /tmp/closure.json)"
          echo "DOMAIN_STATUS=$(jq -r '.status' /tmp/domain.json)"
          echo "DOMAIN_REVISION=$(jq -r '.revision' /tmp/domain.json)"
          echo "SEO_CLOSURE_STATUS=$(jq -r '.closureStatus' /tmp/closure.json)"
          echo "SEO_OWNER_ACTION_REQUIRED=$(jq -r '.ownerActionRequired' /tmp/closure.json)"
          echo "SEO_OWNER_CANDIDATE_COUNT=$(jq -r '.ownerCandidateCount' /tmp/closure.json)"
          echo "SEO_FORMAL_PRIMARY_COUNT=$(jq -r '.formalPrimaryCount' /tmp/closure.json)"
          echo "SEO_PLANNER_ROWS=$(jq -r '.plannerRows' /tmp/closure.json)"
          echo "SEO_BRIDGE_STATUS=$(jq -r '.bridgeStatus' /tmp/closure.json)"
          echo "SEO_GATE_STATUS=$(jq -r '.gateStatus' /tmp/closure.json)"
          echo "SEO_PREFLIGHT_STATUS=$(jq -r '.preflightStatus' /tmp/closure.json)"
          echo "SEO_READY_FOR_PUBLISH=$(jq -r '.readyForPublish' /tmp/closure.json)"
          echo 'PRODUCTION_POST_UPGRADE_READBACK=PASS'
