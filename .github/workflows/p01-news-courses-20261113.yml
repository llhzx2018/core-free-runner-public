name: P01 News Courses private Owner exact-source browser verification 20261113
on:
  push:
    branches:
      - test/p01-news-courses-ui-20261113-f9da9

permissions:
  contents: read

jobs:
  exact-owner-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Validate temporary public-safe Runner lane
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "$GITHUB_REF_NAME" = "test/p01-news-courses-ui-20261113-f9da9"
          echo "P01_SCOPE=PRIVATE_SOURCE_EPHEMERAL_CHECKOUT_D53_NEWS_COURSES"
          echo "P01_PRODUCTION=UNTOUCHED"

      - name: Require registered private source read capability
        shell: bash
        env:
          PRIVATE_READ: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ"
          echo "P01_REGISTERED_PRIVATE_READ=PRESENT"

      - name: Checkout exact private candidate transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 8b8162add252c7cf4ed57eaad6daa55c35f8b5b5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false

      - name: Verify exact source and future-only version
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "8b8162add252c7cf4ed57eaad6daa55c35f8b5b5"
          test "$(cat candidate/VERSION)" = "2.47.516"
          test "$(cat candidate/src/VERSION.txt)" = "2.47.516"
          test -f candidate/src/app/next/frontend/tests/subsite-switcher.spec.ts
          test -f candidate/src/app/next/frontend/tests/personal.spec.ts
          test -f candidate/src/app/next/frontend/tests/personal.test.ts
          test -f candidate/src/app/next/OwnerPersonalCatalog.php
          test -f candidate/src/app/next/OwnerNewsWorkspace.php
          test -f candidate/src/app/next/OwnerCoursesWorkspace.php
          test -f candidate/src/app/next/frontend/tests/news-courses.spec.ts
          test -f candidate/src/app/next/frontend/tests/news-courses.test.ts
          echo "P01_EXACT_SOURCE=8b8162add252c7cf4ed57eaad6daa55c35f8b5b5"

      - name: PHP syntax contract for new protected read surfaces
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in candidate/src/app/next/OwnerPersonalCatalog.php candidate/src/app/next/OwnerNewsWorkspace.php candidate/src/app/next/OwnerCoursesWorkspace.php candidate/src/app/next/D2CanonicalConnectionScope.php candidate/src/app/next/OwnerDataRuntime.php candidate/src/app/next/http/OwnerHttpRoutes.php; do
            php -l "$f" > "$RUNNER_TEMP/p01-php-lint.txt" 2>&1
          done
          echo "P01_NEWS_COURSES_PHP_SYNTAX=PASS"

      - name: Install isolated frontend lockfile dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate/src/app/next/frontend
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/p01-npm-ci.txt" 2>&1
          echo "P01_FRONTEND_LOCKFILE_INSTALL=PASS"

      - name: Vue TypeScript typecheck
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate/src/app/next/frontend
          if ! npm run typecheck > "$RUNNER_TEMP/p01-typecheck.txt" 2>&1; then
            echo "P01_FRONTEND_VUE_TYPECHECK=FAIL"
            grep -oE 'error TS[0-9]+' "$RUNNER_TEMP/p01-typecheck.txt" | sort | uniq -c | tail -n 12 || true
            exit 1
          fi
          echo "P01_FRONTEND_VUE_TYPECHECK=PASS"

      - name: Focused existing frontend unit regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate/src/app/next/frontend
          if ! npm run test:unit > "$RUNNER_TEMP/p01-unit.txt" 2>&1; then
            echo "P01_FRONTEND_UNIT=FAIL"
            grep -E '^ FAIL |Test Files|Tests  ' "$RUNNER_TEMP/p01-unit.txt" | tail -n 15 || true
            exit 1
          fi
          echo "P01_FRONTEND_UNIT=PASS"

      - name: Actual production-mode Vite build
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate/src/app/next/frontend
          npm run build > "$RUNNER_TEMP/p01-build.txt" 2>&1
          test -f ../public/build/.vite/manifest.json
          echo "P01_FRONTEND_VITE_BUILD=PASS"

      - name: Chromium availability for 390 768 1440 testing
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate/src/app/next/frontend
          npx playwright install --with-deps chromium > "$RUNNER_TEMP/p01-browser-setup.txt" 2>&1
          echo "P01_CHROMIUM_INSTALLED=PASS"

      - name: Actual subsite and existing UX browser regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate/src/app/next/frontend
          if ! npm run test:e2e > "$RUNNER_TEMP/p01-playwright.txt" 2>&1; then
            echo "P01_CHROMIUM_UI_REGRESSION=FAIL_SANITIZED_TEST_NAMES_ONLY"
            grep -E '^  [0-9]+\\)|chromium|failed|passed|Error:' "$RUNNER_TEMP/p01-playwright.txt" | sed -E 's#/(home|tmp|mnt)/[^ :]+#<PRIVATE_PATH>#g' | tail -n 65 || true
            exit 1
          fi
          echo "P01_NEWS_COURSES_390_768_1440_BROWSER=PASS"

      - name: Clean private source and logs without artifacts
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate
          rm -f -- "$RUNNER_TEMP"/p01-*.txt
          echo "P01_PRIVATE_SOURCE_PERSISTED=NO"
          echo "P01_PRIVATE_LOGS_OR_ARTIFACTS=PERSISTED_NO"

  exact-news-courses-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Validate exact backend test lane
        shell: bash
        env:
          PRIVATE_READ: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "$GITHUB_REF_NAME" = "test/p01-news-courses-ui-20261113-f9da9"
          test -n "$PRIVATE_READ"
          echo "P01_PRODUCTION=UNTOUCHED"
          echo "P01_PRIVATE_CHECKOUT=TRANSIENT"
      - name: Checkout exact private News Courses candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 8b8162add252c7cf4ed57eaad6daa55c35f8b5b5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
      - name: Verify final source and synthetic fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "8b8162add252c7cf4ed57eaad6daa55c35f8b5b5"
          test "$(cat candidate/VERSION)" = "2.47.516"
          test "$(cat candidate/src/VERSION.txt)" = "2.47.516"
          test -f candidate/tests/p01_d53_news_courses.php
          test -f candidate/src/app/next/OwnerNewsWorkspace.php
          test -f candidate/src/app/next/OwnerCoursesWorkspace.php
          echo "P01_EXACT_SOURCE=8b8162add252c7cf4ed57eaad6daa55c35f8b5b5"
      - name: Prepare isolated PHP SQLite and ZIP support
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! php -r 'exit(extension_loaded("pdo_sqlite") && class_exists("ZipArchive") ? 0 : 1);'; then
            sudo apt-get update -qq > "$RUNNER_TEMP/p01-apt.txt" 2>&1
            sudo apt-get install -y php8.3-sqlite3 php8.3-zip >> "$RUNNER_TEMP/p01-apt.txt" 2>&1
          fi
          php -r 'exit(extension_loaded("pdo_sqlite") && class_exists("ZipArchive") ? 0 : 1);'
          for f in candidate/tests/p01_d53_news_courses.php candidate/src/app/next/OwnerNewsWorkspace.php candidate/src/app/next/OwnerCoursesWorkspace.php candidate/src/app/next/OwnerDataRuntime.php candidate/src/app/next/D2CanonicalConnectionScope.php candidate/src/app/next/http/OwnerHttpRoutes.php; do
            php -l "$f" > "$RUNNER_TEMP/p01-lint.txt" 2>&1
          done
          echo "P01_D53_BACKEND_PHP_SYNTAX=PASS"
      - name: Install pinned Laravel framework in throwaway workspace
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate/src/app/next
          composer install --no-dev --no-interaction --no-scripts --no-progress --prefer-dist > "$RUNNER_TEMP/p01-composer.txt" 2>&1
          test -f vendor/autoload.php
          echo "P01_D53_LARAVEL_LOCKED_DEPENDENCIES=PASS"
      - name: Test cache, bookmarks, read CAS and ZIP course on real SQLite
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! php candidate/tests/p01_d53_news_courses.php > "$RUNNER_TEMP/p01-integration.txt" 2>&1; then
            echo "P01_D53_SQLITE_BUSINESS_INTEGRATION=FAIL"
            grep -E 'D53 FAIL|D53 UNSAFE PASS|Fatal error|Uncaught' "$RUNNER_TEMP/p01-integration.txt" | tail -n 8 || true
            exit 1
          fi
          grep '^P01_D53_.*=PASS$' "$RUNNER_TEMP/p01-integration.txt"
          echo "P01_D53_SQLITE_BUSINESS_INTEGRATION=PASS"
      - name: Always clean private candidate and temporary output
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate
          rm -f -- "$RUNNER_TEMP"/p01-*.txt
          echo "P01_PRIVATE_SOURCE_PERSISTED=NO"
          echo "P01_PRIVATE_ARTIFACTS_CREATED=NO"
