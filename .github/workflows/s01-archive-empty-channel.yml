name: S01 exact Theme channel contract
on:
  push:
    branches: [task/s01-archive-empty161-20261021]
    paths: ['.github/workflows/s01-archive-empty-channel.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.161
  TARGET_SHA: 3fb4432fa30faabf6c61574f62a4d0bc796e2cc0
  UPDATE_SHA: 328ab6778ce510ad0b092f53f8a2b86fa6b9465a
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: 328ab6778ce510ad0b092f53f8a2b86fa6b9465a
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Exact changed manifest and native protocol tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PYCHANNEL'
          import json,os
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']==os.environ['TARGET_VERSION']
          assert m['asset_sha256']=='09fddf0506c741f7e0deec6f8bcbf5ebd5d3c2a3cecb381a6e0645bc01b379ee' and m['asset_bytes']==1974754
          assert m['runtime_files']==476 and '1.35.160' in m['from_versions']
          assert m['release_tag']=='v'+os.environ['TARGET_VERSION']
          print('EXACT_CHANNEL_CONTRACT_PASS')
          PYCHANNEL
      - name: Cleanup
        if: always()
        run: rm -rf source
