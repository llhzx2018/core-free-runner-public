name: S01 homepage brand and contrast focused proof
on:
  push:
    branches: [task/s01-home174-20261023]
    paths: ['.github/workflows/s01-home174-20261023.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.174
  TARGET_SHA: 25c808d2b5d4dddddd276c1deac2a55a872dc3ab
  TARGET_TREE: adc81f6254f2087a8a276d53461d65d16f541dab
  BASE_SHA: a04063727eacbd8c1c033c0a115f6a3b2cff4faf
  SOURCE_VERSION: 1.35.173
  LANE_ID: s01-home174-20261023
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          ref: 02d4591eed025a3d3a67bc0a150b3ddc448c2ab8
          persist-credentials: false
          path: established
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 25c808d2b5d4dddddd276c1deac2a55a872dc3ab
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact package and focused syntax checks
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider baseline
          python3 control/lanes/s01-home174-20261023/package.py
          php -l target/src/footer.php
          php -l target/src/inc/services/frontend-page-progress-service.php
          php -l target/src/inc/public-css-owner-registry.php
          node --check target/tests/home-entry-brand-browser-check.cjs
          node --check control/lanes/s01-home174-20261023/clean.cjs
          gh release download v1.35.173 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.173.zip --dir provider
          echo '54dd502e45f6d254a80034b305e5264b5ffa854ee7a1bf9da04c70afc54545c2  provider/vf-tools-theme_V1.35.173.zip' | sha256sum -c
          gh release download v1.25.94 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.94.zip --dir provider
          echo '70b90d40da5d69fc7819bd7ada3f15fb0145e64822b788bd94956c7827b2df03  provider/vf-tools-m3u8_V1.25.94.zip' | sha256sum -c
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -g -fsSL --retry 2 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC[wght].ttf' -o "$HOME/.local/share/fonts/NotoSansSC.ttf"
          fc-cache -f
      - name: Native WordPress bilingual home and upgrade rollback data protection
        run: |
          set -euo pipefail
          cp -a established/lanes/s01-frontend-design-20261017 lane
          cp control/lanes/s01-home174-20261023/clean.cjs lane/warm-admin.cjs
          bash control/lanes/s01-home174-20261023/native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-home-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target baseline provider
