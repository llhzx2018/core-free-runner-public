name: P01 V2.46.3 Post Merge Online Readback

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p01-v2463-post-merge-online-readback-20260905.yml

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      CORE_MAIN: ccecf180742724abed7e85d1561c905cee7b0e85
      OWNER_REF: 87edfd46ad61afba23b6998f4d0ccd9a8eabc5ad
      FORMAL_SOURCE: 494b7a9a497fed050885f27ccad3a280ba53b0ce
      ASSET: VF_Start_V2.46.3_UPDATE.zip
      ASSET_ID: '545327284'
      ASSET_BYTES: '1609058'
      ASSET_SHA: b17da14ff7b0a0b598d55b0fc968a3cf1137e2e62fa73a3e99d109965c86a5ff
      RELEASE_ID: '383126819'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, mbstring, openssl, fileinfo
          coverage: none
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CORE_MAIN }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          path: core
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.OWNER_REF }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          path: owner
          fetch-depth: 1
          persist-credentials: false

      - name: Exact merged main manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE_MAIN"
          test "$(git -C owner rev-parse HEAD)" = "$OWNER_REF"
          python3 - <<'PY'
          import json,os
          p=json.load(open('core/projects/P01.json',encoding='utf-8'))
          e={'current_version':'2.46.1','target_version':'2.46.3','from_versions':['2.46.1'],'schema_from':'2026090401','schema_to':'2026090401','release_tag':'v2.46.3','release_id':int(os.environ['RELEASE_ID']),'product_identity':os.environ['FORMAL_SOURCE'],'asset_name':os.environ['ASSET'],'asset_bytes':int(os.environ['ASSET_BYTES']),'asset_sha256':os.environ['ASSET_SHA'],'backup_required':True,'rollback_supported':True}
          for k,v in e.items(): assert p.get(k)==v,(k,p.get(k),v)
          print('P01_V2463_POST_MERGE_MANIFEST=PASS')
          PY

      - name: Exact V2.46.1 remembered V2.46.2 to merged V2.46.3
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/check.php <<'PHP'
          <?php
          declare(strict_types=1);
          define('VF_ROOT','/tmp/p01-post-root'); define('VF_PRIVATE_ROOT','/tmp/p01-post-private');
          if(!function_exists('vf_write_storage_guards')){function vf_write_storage_guards(string $dir):void{}}
          if(!function_exists('vf_clean_text')){function vf_clean_text(string $value,int $max=600):string{return mb_substr(trim($value),0,$max);}}
          final class VfMigrationRunner{public function __construct(private PDO $db){} public function schemaState():array{return ['current_head'=>'2026090401'];}}
          require getcwd().'/owner/src/app/UpdateManager.php';
          $manifest=json_decode(file_get_contents(getcwd().'/core/projects/P01.json'),true,512,JSON_THROW_ON_ERROR);
          $pdo=new PDO('sqlite::memory:'); $pdo->setAttribute(PDO::ATTR_ERRMODE,PDO::ERRMODE_EXCEPTION);
          $pdo->exec('CREATE TABLE update_state(state_key TEXT PRIMARY KEY,state_value TEXT NOT NULL DEFAULT "",updated_at TEXT NOT NULL DEFAULT "")');
          $s=$pdo->prepare('INSERT INTO update_state(state_key,state_value,updated_at) VALUES(?,?,?)');
          $s->execute(['highest_verified_release_version','2.46.2',gmdate('c')]);
          $s->execute(['highest_verified_release_manifest_sha256',str_repeat('a',64),gmdate('c')]);
          $m=new VfUpdateManager($pdo,['root'=>'/tmp/p01-post-root','private_root'=>'/tmp/p01-post-private','current_version'=>'2.46.1','manifest_fetcher'=>static fn(string $r,string $p,string $ref):array=>$manifest,'capabilities'=>['curl'=>true,'zip'=>true],'randomizer'=>static fn(int $a,int $b):int=>0]);
          $r=$m->check(true);
          if(($r['ok']??false)!==true||($r['current_version']??'')!=='2.46.1'||($r['latest_version']??'')!=='2.46.3'||($r['available']??false)!==true||($r['can_update']??false)!==true||($r['requirements']['source_allowed']??false)!==true||($r['requirements']['schema']['ok']??false)!==true){throw new RuntimeException(json_encode($r,JSON_UNESCAPED_UNICODE));}
          echo "P01_V2463_POST_MERGE_CLIENT=PASS\n";
          PHP
          php /tmp/check.php

      - name: Exact formal release and canonical bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api repos/llhzx2018/vf-start/releases/tags/v2.46.3 >/tmp/release.json
          jq -e --arg s "$FORMAL_SOURCE" --argjson rid "$RELEASE_ID" '.id==$rid and .tag_name=="v2.46.3" and .target_commitish==$s and .draft==false and .prerelease==false and (.assets|length)==8' /tmp/release.json >/dev/null
          jq -e --argjson id "$ASSET_ID" --arg n "$ASSET" --argjson b "$ASSET_BYTES" --arg d "sha256:$ASSET_SHA" '.assets[]|select(.id==$id)|.name==$n and .size==$b and .digest==$d' /tmp/release.json >/dev/null
          mkdir -p /tmp/asset
          gh release download v2.46.3 --repo llhzx2018/vf-start --pattern "$ASSET" --dir /tmp/asset
          test "$(stat -c %s /tmp/asset/$ASSET)" = "$ASSET_BYTES"
          test "$(sha256sum /tmp/asset/$ASSET | awk '{print $1}')" = "$ASSET_SHA"
          test "$(unzip -Z1 /tmp/asset/$ASSET)" = 'repair-v2.46.3.php'
          unzip -p /tmp/asset/$ASSET repair-v2.46.3.php >/tmp/repair.php
          grep -Fq "public const SOURCE_VERSION='2.46.1';" /tmp/repair.php
          grep -Fq "public const TARGET_VERSION='2.46.3';" /tmp/repair.php
          php /tmp/repair.php --self-test | jq -e '.ok==true and .global_barrier==true and .interruption_recovery==true' >/dev/null
          echo P01_V2463_POST_MERGE_RELEASE=PASS

      - name: Update Core merged routing
        shell: bash
        run: |
          set -Eeuo pipefail
          php core/update-core/php/tests/run.php
          cat >/tmp/core.php <<'PHP'
          <?php
          require 'core/update-core/php/src/UpdateAdapter.php'; require 'core/update-core/php/src/UpdateCore.php';
          $m=json_decode(file_get_contents('core/projects/P01.json'),true,512,JSON_THROW_ON_ERROR); $c=new CoreUpdates\UpdateCore('P01','APP');
          foreach([['2.46.1','2026090401','AVAILABLE'],['2.46.2','2026090401','BLOCKED_SOURCE_VERSION'],['2.46.3','2026090401','UP_TO_DATE']] as [$v,$s,$w]){if(($g=$c->check($v,$s,$m)['status'])!==$w) throw new RuntimeException("$v expected $w got $g");}
          echo "P01_V2463_POST_MERGE_CORE=PASS\n";
          PHP
          php /tmp/core.php

      - name: Post merge online readback PASS
        run: echo P01_V2463_POST_MERGE_ONLINE_READBACK=PASS
