name: S01-C02 V1.21.1004 Accepted Pages Consistency

on:
  push:
    branches:
      - release/s01-c02-1211004-accepted-pages-consistency
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REPO: llhzx2018/vf-tools-ops
  TARGET_SHA: 74278ece1d5de97861f6c2a44b8062066b2614bb
  BASE_SHA: 29e3176533f5219791b6ab25868ddeed090fefde
  TARGET_VERSION: 1.21.1004

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.BASE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: baseline
          fetch-depth: 1
          persist-credentials: false

      - name: Exact source and bounded surface gate
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n' < target/VERSION)" = "$TARGET_VERSION"
          grep -Fq "Version: $TARGET_VERSION" target/vf-ops.php
          grep -Fq "S01-V9-ACCEPTED-PAGES-CONSISTENCY" target/vf-ops.php
          git -C target diff --name-only "$BASE_SHA..$TARGET_SHA" | tee evidence/changed-files.txt

          php target/tests/s01-c02-1211004-accepted-pages-consistency-contract.php
          php target/tests/s01-c02-1211004-keyword-reading-scale-contract.php
          php target/tests/s01-c02-121994-keyword-map-mature-ui-contract.php
          php target/tests/s01-c02-121995-keyword-research-mature-ui-contract.php
          php target/tests/s01-c02-v9-batch1-body-contract.php
          php target/tests/s01-c02-1211003-technical-readability-contract.php
          php target/tests/s01-c02-1211002-technical-state-matrix-contract.php
          php target/tests/s01-c02-1211001-technical-responsive-consistency-contract.php
          php target/tests/s01-c02-121934-shell-header-visual-lock-r45-contract.php

          docker run --rm -v "$PWD/target:/src:ro" -w /src php:8.2-cli sh -lc 'find . -path "./.git" -prune -o -name "*.php" -print0 | xargs -0 -n1 php -l >/dev/null'

          python3 - <<'PY'
          from pathlib import Path
          changed=set(Path('evidence/changed-files.txt').read_text().splitlines())
          allowed={
            'CHANGELOG.md','VERSION','vf-ops.php',
            'assets/css/current/admin-s01-integrations-r4.css',
            'assets/css/current/admin-s01-keyword-map-r1.css',
            'assets/css/current/admin-s01-keyword-research-r1.css',
            'assets/css/current/admin-s01-links-body-r10.css',
            'assets/css/current/admin-s01-tools-r16.css',
            'tests/s01-c02-1211004-accepted-pages-consistency-contract.php',
            'tests/s01-c02-1211004-accepted-pages-surface-inventory.json',
            'tests/s01-c02-1211004-keyword-reading-scale-contract.php',
            'tests/s01-c02-121995-keyword-research-mature-ui-contract.php',
            'tests/s01-c02-v8-browser-proof.js',
            'tests/s01-c02-v9-batch1-browser-proof.js'
          }
          if changed != allowed:
              raise SystemExit('unexpected diff: '+repr(sorted(changed ^ allowed)))
          frozen=[
            'assets/css/current/admin-s01-v6-shell-r1.css',
            'includes/views/admin-shell-tabs-parts/02-shell-navigation.php',
            'assets/js/admin-s01-page-frame-r18.js'
          ]
          if changed.intersection(frozen):
              raise SystemExit('frozen shell/header/menu boundary changed')
          print('SIX_SURFACE_DENOMINATOR=PASS')
          print('BOUNDED_DIFF=PASS')
          print('FROZEN_SHELL_HEADER_MENU=PASS')
          PY

      - name: Browser proof dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/vf-node
          cd /tmp/vf-node
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.58.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: V9 accepted surfaces browser proof
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/target"
          export NODE_PATH=/tmp/vf-node/node_modules
          export V9_PROOF_DIR="$GITHUB_WORKSPACE/evidence/v9"
          node tests/s01-c02-v9-batch1-browser-proof.js | tee "$GITHUB_WORKSPACE/evidence/v9-console.json"
          jq -e '.pass==true and (.checks|length)==18 and ([.checks[].failures[]]|length)==0' "$GITHUB_WORKSPACE/evidence/v9/browser-proof.json" >/dev/null
          echo V9_TOOLS_INTEGRATIONS_LINKS=PASS

      - name: Keyword family browser proof
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/target"
          export NODE_PATH=/tmp/vf-node/node_modules
          export V8_PROOF_DIR="$GITHUB_WORKSPACE/evidence/v8"
          node tests/s01-c02-v8-browser-proof.js | tee "$GITHUB_WORKSPACE/evidence/v8-console.json"
          jq -e '.pass==true and ([.checks[].failures[]]|length)==0 and .owner_product_pass==false' "$GITHUB_WORKSPACE/evidence/v8/browser-proof.json" >/dev/null
          echo KEYWORD_MAP_RESEARCH=PASS

      - name: Technical regression proof
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/target"
          export NODE_PATH=/tmp/vf-node/node_modules
          node tests/s01-c02-1211003-technical-readability-browser-proof.js | tee "$GITHUB_WORKSPACE/evidence/technical-readability.json"
          jq -e '.pass==true and (.checks|length)==5 and ([.checks[].failures[]]|length)==0 and .owner_product_pass==false' "$GITHUB_WORKSPACE/evidence/technical-readability.json" >/dev/null
          node tests/s01-c02-1211002-technical-state-matrix-browser-proof.js | tee "$GITHUB_WORKSPACE/evidence/technical-matrix.json"
          jq -e '.pass==true and (.matrix|length)==49 and ([.matrix[].failures[]]|length)==0 and .owner_product_pass==false' "$GITHUB_WORKSPACE/evidence/technical-matrix.json" >/dev/null
          echo TECHNICAL_REGRESSION=PASS

      - name: Final evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -n             --arg sha "$TARGET_SHA"             --arg version "$TARGET_VERSION"             --argjson v9 "$(cat evidence/v9/browser-proof.json)"             --argjson v8 "$(cat evidence/v8/browser-proof.json)"             --argjson tech "$(cat evidence/technical-readability.json)"             --argjson matrix "$(cat evidence/technical-matrix.json)"             '{
              status:"PASS",
              candidate_sha:$sha,
              candidate_version:$version,
              surface_denominator:6,
              v9:{result:($v9.pass|if . then "PASS" else "FAIL" end),checks:($v9.checks|length)},
              keyword:{result:($v8.pass|if . then "PASS" else "FAIL" end),checks:($v8.checks|length)},
              technical:{result:($tech.pass|if . then "PASS" else "FAIL" end),checks:($tech.checks|length)},
              technical_matrix:{result:($matrix.pass|if . then "PASS" else "FAIL" end),checks:($matrix.matrix|length)},
              frozen_shell_header_menu:"PASS",
              owner_product_pass:false,
              production:"NOT_EXECUTED"
            }' | tee evidence/FINAL_EVIDENCE.json
          echo 'S01-C02 V1.21.1004 ACCEPTED PAGES CONSISTENCY MACHINE PASS'

      - name: Upload evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-v1.21.1004-accepted-pages-consistency
          path: evidence/
          retention-days: 30
