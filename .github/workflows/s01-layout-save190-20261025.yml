name: S01 legacy TOC layout save persistence
on:
  push:
    branches: [task/s01-layout-save190-parity-20261025]
    paths: ['.github/workflows/s01-layout-save190-20261025.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.190
  TARGET_SHA: 1baf83e577b3799b390b1a6f3466c094890af241
  TARGET_TREE: 90cd51f555f03b04b1df80974f3bcb3bb73c48c3
  BASE_SHA: 58438a8b2e70808e5c155db9425e05e8e10b73e7
  SOURCE_VERSION: 1.35.189
  LANE_ID: s01-layout-save190-20261025
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - name: Target identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-layout-save190-20261025/spec.json --input control/.github/workflows/s01-layout-save190-20261025.yml
      - uses: actions/checkout@v4
        with:
          ref: 02d4591eed025a3d3a67bc0a150b3ddc448c2ab8
          persist-credentials: false
          path: established
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 1baf83e577b3799b390b1a6f3466c094890af241
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact package and scoped syntax checks
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider baseline
          python3 control/lanes/s01-layout-save190-20261025/package.py
          python3 - <<'PYLIST'
          import subprocess,os
          files=subprocess.check_output(['git','-C','target','diff','--name-only',os.environ['BASE_SHA'],'HEAD']).decode().splitlines()
          for f in files:
              if f.endswith('.php'):subprocess.run(['php','-l','target/'+f],check=True)
          PYLIST
          node --check target/tests/layout-legacy-toc-browser-check.cjs
          node --check target/src/assets/js/main.js
          gh release download v1.35.189 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.189.zip --dir provider
          echo '9510212164cf0c84f59eeace71c99f59b079816734219af28f573328c6734b5e  provider/vf-tools-theme_V1.35.189.zip' | sha256sum -c
          gh release download v1.25.94 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.94.zip --dir provider
          echo '70b90d40da5d69fc7819bd7ada3f15fb0145e64822b788bd94956c7827b2df03  provider/vf-tools-m3u8_V1.25.94.zip' | sha256sum -c
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -g -fsSL --retry 2 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC[wght].ttf' -o "$HOME/.local/share/fonts/NotoSansSC.ttf"
          fc-cache -f
      - name: Actual WordPress Article UX SEO upgrade rollback and data protection
        run: |
          set -euo pipefail
          cp -a established/lanes/s01-frontend-design-20261017 lane
          cp control/lanes/s01-layout-save190-20261025/clean.cjs lane/warm-admin.cjs
          bash control/lanes/s01-layout-save190-20261025/native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-home-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target baseline provider
