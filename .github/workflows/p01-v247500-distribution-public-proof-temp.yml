name: p01-v247500-distribution-exact-public-proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v247500-distribution-public-proof-temp.yml'
      - 'scripts/p01-v247500-live-online-discovery-temp.py'
permissions:
  contents: read
jobs:
  p01-distribution-exact-source-asset-proof:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CHANNEL_SHA: c46d2a9fcf323235182ecbe5a87ba373108e547c
      CHANNEL_BASE: d4f762d12ae1e7720e652f80e64043ee5cc409aa
      WORK: /tmp/p01-v247500-channel-${{ github.run_id }}
    steps:
      - name: Checkout registered Public Runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Transient exact channel checkout and official 500 asset
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          test -n "$READ_TOKEN"
          mkdir -p "$WORK"/{archive,release}
          remote="$(git ls-remote "https://x-access-token:$READ_TOKEN@github.com/llhzx2018/core-updates.git" refs/heads/dist/p01-v247500-499-only-atomic-20261107 | awk '{print $1}')"
          test "$remote" = "$CHANNEL_SHA"
          git clone -q --no-checkout "https://x-access-token:$READ_TOKEN@github.com/llhzx2018/core-updates.git" "$WORK/channel"
          git -C "$WORK/channel" fetch -q --depth 2 origin "$CHANNEL_SHA"
          git -C "$WORK/channel" checkout -q --detach "$CHANNEL_SHA"
          git -C "$WORK/channel" remote set-url origin https://github.com/llhzx2018/core-updates.git
          test "$(git -C "$WORK/channel" rev-parse HEAD)" = "$CHANNEL_SHA"
          test "$(git -C "$WORK/channel" rev-parse HEAD^)" = "$CHANNEL_BASE"
          test "$(git -C "$WORK/channel" diff --name-only HEAD^ HEAD)" = projects/P01.json
          gh release download v2.47.500 -R llhzx2018/vf-start -D "$WORK/release" \
            -p VF-Start-V2.47.500-FULL.zip -p VF_Start_V2.47.500_UPDATE.zip
          printf '%s  %s\n' \
            9a712e7cc1202babb2518670377171b0f2a7705286bdd1dc8ebbb7b55be59227 "$WORK/release/VF-Start-V2.47.500-FULL.zip" \
            26d8b2261413883eee452868357c8d79a8972c60c854f8a25b27ace7377e7c9d "$WORK/release/VF_Start_V2.47.500_UPDATE.zip" |
            sha256sum -c -
          test "$(gh api repos/llhzx2018/vf-start/releases/tags/v2.47.500 --jq .id)" = 437446677
          echo P01_V500_DISTRIBUTION_EXACT_SOURCE_OFFICIAL_RELEASE_ASSET=PASS
      - name: Run core-updates own stable contract and PHP Update Core tests on exact P01 PR
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$WORK/channel"
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
          php update-core/php/tests/run.php
          echo P01_V500_CORE_UPDATES_NATIVE_CONTRACT_AND_PHP=PASS
      - name: Explicit P01 compatibility, hashes, private-state and single upgrade source
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$WORK/channel/projects/P01.json" "$WORK/release" <<'PY'
          import hashlib,json,pathlib,sys,zipfile
          p=pathlib.Path(sys.argv[1]);r=pathlib.Path(sys.argv[2])
          m=json.loads(p.read_text())
          assert m['project_id']=='P01' and m['component_id']=='APP'
          assert m['current_version']=='2.47.499' and m['target_version']=='2.47.500'
          assert m['from_versions']==['2.47.499'] and m['update_type']=='ATOMIC'
          assert m['schema_from']==m['schema_to']=='2026102201'
          assert m['repository']=='llhzx2018/vf-start'
          assert m['release_tag']=='v2.47.500' and m['release_id']==437446677
          assert m['product_identity']=='e8b13aeb13f5fbc9c3f2808acccab69fd05e542a'
          assert m['asset_name']=='VF_Start_V2.47.500_UPDATE.zip'
          assert m['backup_required'] is True and m['rollback_supported'] is True
          asset=(r/m['asset_name']).read_bytes()
          assert len(asset)==m['asset_bytes']==3785946
          assert hashlib.sha256(asset).hexdigest()==m['asset_sha256']=='26d8b2261413883eee452868357c8d79a8972c60c854f8a25b27ace7377e7c9d'
          with zipfile.ZipFile(r/m['asset_name']) as z:
              assert z.namelist()==['repair-v2.47.500.php']
          print('P01_V500_CHANNEL_499_ONLY_ATOMIC_VERIFIED_REAL_ZIP=PASS')
          PY
      - name: Real installed 499 online GitHub discovery, signed download, synthetic Atomic apply
        shell: bash
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh release download v2.47.499 -R llhzx2018/vf-start -D "$WORK/archive" \
            -p VF-Start-V2.47.499-FULL.zip
          printf '%s  %s\n' \
            eb8752f5ba448c2588fb1981e6a71ffa16b4cd8004bb55b0512c978784352904 \
            "$WORK/archive/VF-Start-V2.47.499-FULL.zip" | sha256sum -c -
          python3 scripts/p01-v247500-live-online-discovery-temp.py \
            --source-full "$WORK/archive/VF-Start-V2.47.499-FULL.zip" \
            --work "$WORK"
          echo P01_V500_REMOTE_CHANNEL_499_INSTALLED_MANAGER_END_TO_END=PASS
      - name: Cleanup no private source persistence
        if: always()
        shell: bash
        run: |
          echo P01_V500_PUBLIC_ARTIFACT_PRIVATE_SOURCE=NONE
          echo P01_V500_PRODUCTION_AUTO_APPLY=NO
          case "$WORK" in /tmp/p01-v247500-channel-*) rm -rf -- "$WORK";; *) exit 88;; esac
