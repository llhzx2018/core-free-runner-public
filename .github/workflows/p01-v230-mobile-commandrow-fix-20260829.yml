name: P01 V2.30 Mobile Command Row Fix
on:
  push:
    branches: [task/p01-v230-domain-nav-shell-20260829]
    paths:
      - .github/workflows/p01-v230-mobile-commandrow-fix-20260829.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: d6bbbbe618cd87bf5dc405514a71729d6d72d02c
      PRODUCT_BRANCH: feature/p01-v230-domain-nav-shell-20260829
      PORT: '18580'
      ROOT: /tmp/p01-v230-commandrow
      ADMIN_PASS: 'P01V230!Row'
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.PRODUCT_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: source
      - name: Exact source fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' < source/VERSION)" = 2.30.0
          grep -F -- '--ws-mobile-commandbar:48px' source/src/assets/workspace-domain-nav.css >/dev/null
          echo P01_V230_COMMANDROW_SOURCE_FENCE=PASS
      - name: Patch mobile command row
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          shell=Path('source/src/app/FunctionalWorkspaceShell.php')
          text=shell.read_text(encoding='utf-8')
          old="""    $rangeEnd = (int)$context['range_end'];\n    ?>\n<section class=\"vf-workspace-head vf-functional-head\">"""
          new="""    $rangeEnd = (int)$context['range_end'];\n    $mode = (string)($context['mode'] ?? vf_fw_mode());\n    $categoryId = (int)($context['category_id'] ?? 0);\n    ?>\n<div class=\"vf-mobile-command-row\" aria-label=\"移动端快速操作\">\n  <form class=\"vf-mobile-command-search\" action=\"<?=vf_fw_h(vf_fw_base_route($mode))?>\" method=\"get\">\n    <?php if($admin&&$scope!=='all'): ?><input type=\"hidden\" name=\"scope\" value=\"<?=vf_fw_h($scope)?>\"><?php endif; ?>\n    <?php if($categoryId>0): ?><input type=\"hidden\" name=\"category\" value=\"<?=$categoryId?>\"><?php endif; ?>\n    <?php if($kind!==''): ?><input type=\"hidden\" name=\"kind\" value=\"<?=vf_fw_h($kind)?>\"><?php endif; ?>\n    <span aria-hidden=\"true\">⌕</span><input type=\"search\" name=\"q\" value=\"<?=vf_fw_h($q)?>\" placeholder=\"搜索当前资源\" autocomplete=\"off\"><button type=\"submit\">搜索</button>\n  </form>\n  <?php if($admin): ?><button type=\"button\" class=\"vf-mobile-command-add\" data-open-add>＋ 添加</button><?php endif; ?>\n</div>\n<section class=\"vf-workspace-head vf-functional-head\">"""
          assert old in text
          text=text.replace(old,new,1)
          old_add="""  <?php if($admin): ?><button type=\"button\" class=\"vf-mobile-add-action\" data-open-add>＋ 添加</button><?php endif; ?>\n</section>"""
          new_add="""</section>"""
          assert old_add in text
          text=text.replace(old_add,new_add,1)
          shell.write_text(text,encoding='utf-8')

          workspace=Path('source/src/app/FunctionalWorkspace.php')
          text=workspace.read_text(encoding='utf-8')
          old_call="""<?php vf_fw_render_head(['title'=>$title,'scope'=>$scope,'admin'=>$admin,'category_name'=>$categoryName,'kind'=>$kind,'kind_label'=>vf_fw_kind_label($mode),'q'=>$q,'total'=>$total,'range_start'=>$rangeStart,'range_end'=>$rangeEnd]); ?>"""
          new_call="""<?php vf_fw_render_head(['mode'=>$mode,'title'=>$title,'scope'=>$scope,'admin'=>$admin,'category_id'=>$categoryId,'category_name'=>$categoryName,'kind'=>$kind,'kind_label'=>vf_fw_kind_label($mode),'q'=>$q,'total'=>$total,'range_start'=>$rangeStart,'range_end'=>$rangeEnd]); ?>"""
          assert old_call in text
          workspace.write_text(text.replace(old_call,new_call,1),encoding='utf-8')

          css=Path('source/src/assets/workspace-domain-nav.css')
          text=css.read_text(encoding='utf-8')
          start=text.index('@media(max-width:760px){')
          prefix=text[:start]
          mobile=r'''@media(max-width:760px){
  :root{--ws-domain-nav:40px}
  .vf-global-domain-nav-inner{padding:0 8px;gap:0}
  .vf-global-domain-nav a{padding:0 12px;font-size:12.5px}
  .vf-global-domain-nav a.active::after{left:10px;right:10px}

  /* Mobile uses an in-content command row; the desktop sticky topbar stays desktop-only. */
  .vf-functional-workspace .vf-app-topbar.vf-domain-subbar{display:none!important}
  .vf-functional-workspace .vf-workspace-toolbar{top:var(--ws-domain-nav);padding-inline:0}
  .vf-mobile-add-action{display:none!important}
  .vf-mobile-command-row{margin:0 0 10px;display:flex;align-items:center;gap:7px}
  .vf-mobile-command-search{height:38px;min-width:0;flex:1;padding:0 5px 0 9px;display:flex;align-items:center;gap:6px;border:1px solid var(--ws-line-strong);border-radius:8px;background:var(--ws-panel)}
  .vf-mobile-command-search>span{color:var(--ws-muted-2);font-size:13px}
  .vf-mobile-command-search input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:var(--ws-text);font-size:12.5px}
  .vf-mobile-command-search button{height:28px;padding:0 8px;border:0;border-radius:6px;background:var(--ws-soft);color:var(--ws-muted);font-size:11.5px;cursor:pointer}
  .vf-mobile-command-search:focus-within{border-color:#7cbdb6;box-shadow:0 0 0 3px color-mix(in srgb,var(--ws-teal) 9%,transparent)}
  .vf-mobile-command-add{height:38px;flex:0 0 auto;padding:0 10px;border:1px solid var(--ws-teal);border-radius:8px;background:var(--ws-teal);color:#fff;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
}
'''
          # Desktop declaration defaults to hidden.
          if '.vf-mobile-command-row{display:none}' not in prefix:
              anchor='.vf-mobile-add-action{display:none}\n'
              assert anchor in prefix
              prefix=prefix.replace(anchor,anchor+'.vf-mobile-command-row{display:none}\n',1)
          css.write_text(prefix+mobile,encoding='utf-8')
          PY
          php -l source/src/app/FunctionalWorkspaceShell.php >/dev/null
          php -l source/src/app/FunctionalWorkspace.php >/dev/null
          grep -F 'vf-mobile-command-row' source/src/app/FunctionalWorkspaceShell.php >/dev/null
          grep -F "'category_id'=>$categoryId" source/src/app/FunctionalWorkspace.php >/dev/null
          grep -F '.vf-functional-workspace .vf-app-topbar.vf-domain-subbar{display:none!important}' source/src/assets/workspace-domain-nav.css >/dev/null
          git -C source diff --check
          echo P01_V230_COMMANDROW_PATCH=PASS
      - name: Fresh runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$ROOT" /tmp/p01-v230-row.cookies evidence
          cp -a source/src "$ROOT"
          php -S "127.0.0.1:${PORT}" -t "$ROOT" >/tmp/p01-v230-row-server.log 2>&1 &
          COOKIE=/tmp/p01-v230-row.cookies
          for i in $(seq 1 30); do curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:${PORT}/setup.php" -o /tmp/setup.html && break || sleep 1; done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:${PORT}/setup.php" --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=VF Start V2.30 Row' --data-urlencode "admin_password=$ADMIN_PASS" --data-urlencode "admin_password_confirm=$ADMIN_PASS" -o /tmp/setup-post.html
          grep -F 'VF Start 安装完成' /tmp/setup-post.html >/dev/null
          php "$ROOT/cli/verify.php" | grep -Fx VERIFY_PASS=YES
          curl -fsS -c "$COOKIE" -b "$COOKIE" -H 'Content-Type: application/json' -d "{\"password\":\"$ADMIN_PASS\"}" "http://127.0.0.1:${PORT}/api.php?action=login" -o /tmp/login.json
          jq -e '.ok==true' /tmp/login.json >/dev/null
          jq -r '.csrf' /tmp/login.json >/tmp/csrf
          CSRF=$(cat /tmp/csrf)
          curl -fsS -c "$COOKIE" -b "$COOKIE" -H 'Content-Type: application/json' -H "X-CSRF-Token: $CSRF" -d '{"name":"开发工具","description":"命令行测试","is_private":false,"sort_order":100}' "http://127.0.0.1:${PORT}/api.php?action=category_save" -o /tmp/cat.json
          CAT=$(jq -r '.id' /tmp/cat.json); test "$CAT" -gt 0
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:${PORT}/workspace-create.php" -F "csrf=$CSRF" -F "category_id=$CAT" -F 'surface=channels' -F 'title=科技漫谈' -F 'url=https://example.com/channel/tech' -F 'resource_kind=科技' -F 'tags=AI,科技' -F 'is_private=0' -F 'source_kind=remote_url' -o /tmp/create.json
          jq -e '.ok==true' /tmp/create.json >/dev/null
          echo P01_V230_COMMANDROW_RUNTIME=PASS
      - name: Install Playwright
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-playwright && cd /tmp/p01-playwright
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null 2>&1
      - name: Browser visual gate
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          cat >/tmp/p01-playwright/gate.js <<'JS'
          const { chromium } = require('playwright');
          const fs=require('fs');
          (async()=>{
            const base='http://127.0.0.1:18580',password='P01V230!Row';
            const browser=await chromium.launch({headless:true});
            const mobile=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:1});
            let r=await mobile.request.post(base+'/api.php?action=login',{data:{password}});if(!r.ok())throw new Error('mobile login');
            const page=await mobile.newPage();await page.goto(base+'/channels.php',{waitUntil:'networkidle'});
            if(await page.locator('.vf-domain-subbar:visible').count())throw new Error('desktop topbar visible on mobile');
            const row=page.locator('.vf-mobile-command-row');await row.waitFor({state:'visible'});
            const input=row.locator('input[name="q"]');await input.waitFor({state:'visible'});
            const add=row.locator('[data-open-add]');await add.waitFor({state:'visible'});
            if((await input.getAttribute('placeholder'))!=='搜索当前资源')throw new Error('mobile placeholder');
            const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);if(overflow>1)throw new Error('mobile overflow '+overflow);
            await input.fill('科技');await input.press('Enter');await page.waitForLoadState('networkidle');if(!page.url().includes('q='))throw new Error('mobile search submit');
            await page.goto(base+'/channels.php',{waitUntil:'networkidle'});
            await page.screenshot({path:'/home/runner/work/core-free-runner-public/core-free-runner-public/evidence/mobile-channels.png',fullPage:true});
            await mobile.close();
            const desktop=await browser.newContext({viewport:{width:1440,height:960},deviceScaleFactor:1});
            r=await desktop.request.post(base+'/api.php?action=login',{data:{password}});if(!r.ok())throw new Error('desktop login');
            const dp=await desktop.newPage();await dp.goto(base+'/channels.php',{waitUntil:'networkidle'});
            if(await dp.locator('.vf-mobile-command-row:visible').count())throw new Error('mobile row visible desktop');
            await dp.locator('.vf-domain-subbar .vf-global-search').waitFor({state:'visible'});
            await dp.locator('.vf-domain-subbar [data-open-add]').waitFor({state:'visible'});
            await dp.screenshot({path:'/home/runner/work/core-free-runner-public/core-free-runner-public/evidence/desktop-channels.png',fullPage:true});
            await browser.close();
            fs.writeFileSync('/home/runner/work/core-free-runner-public/core-free-runner-public/evidence/verdict.txt','P01_V230_MOBILE_COMMANDROW_UI=PASS\n');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          cd /tmp/p01-playwright && node gate.js
          echo P01_V230_MOBILE_COMMANDROW_UI=PASS
      - name: Commit product branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          cd source
          git status --short
          test "$(git status --short | wc -l)" -eq 3
          git diff --check
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add src/app/FunctionalWorkspace.php src/app/FunctionalWorkspaceShell.php src/assets/workspace-domain-nav.css
          git commit -m "refine(P01): add compact mobile search and add row"
          git push origin "HEAD:${PRODUCT_BRANCH}"
          echo "PRODUCT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PRODUCT_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: P01-v230-mobile-commandrow-evidence
          path: evidence
          retention-days: 7
      - name: Final verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "P01_V230_MOBILE_COMMANDROW_SOURCE=${PRODUCT_SHA}"
          echo "P01_V230_MOBILE_COMMANDROW_TREE=${PRODUCT_TREE}"
          echo P01_V230_MOBILE_COMMANDROW_GATE=PASS
