name: P01 V2.47.246 Course Empty State Proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p01-v247246-course-empty-state.yml"
      - "proof-triggers/p01-v247246-course-empty-state.json"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout proof control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd >/dev/null
      - name: Clone exact candidate and baseline
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" candidate
          git -C candidate fetch -q origin d6dafaee781ba4bad97392f379a66d4b315d9835
          git -C candidate checkout -q --detach d6dafaee781ba4bad97392f379a66d4b315d9835
          test "$(git -C candidate rev-parse HEAD)" = "d6dafaee781ba4bad97392f379a66d4b315d9835"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.246"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "2.47.246"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" baseline
          git -C baseline fetch -q origin 78c21b3413ec040a95d65ed9960deeca30134d65
          git -C baseline checkout -q --detach 78c21b3413ec040a95d65ed9960deeca30134d65
          echo P01_V247246_EXACT_SOURCE=PASS
      - name: Empty state UX contract
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l candidate/src/app/CourseLibraryPage.php
          php candidate/tests/unit/course_markdown_reader_contract.php | tee /tmp/reader.txt
          grep -Fx 'P01_COURSE_MARKDOWN_READER=PASS' /tmp/reader.txt
          grep -Fq 'class="vf-course-upload-file"' candidate/src/app/CourseLibraryPage.php
          grep -Fq '最大 20 MB' candidate/src/app/CourseLibraryPage.php
          grep -Fq '课程 ZIP 应该怎么放' candidate/src/app/CourseLibraryPage.php
          grep -Fq 'grid-template-columns:minmax(0,1.6fr) minmax(300px,.9fr)' candidate/src/assets/course-study.css
          echo P01_V247246_EMPTY_UPLOAD_UX=PASS
      - name: Reader PASS surface preserved
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'grid-column:1;' candidate/src/assets/course-study.css
          grep -Fq 'grid-column:2;' candidate/src/assets/course-study.css
          grep -Fq 'grid-row:1;' candidate/src/assets/course-study.css
          grep -Fq 'overflow:visible;' candidate/src/assets/course-study.css
          grep -Fq "更新课程 ZIP" candidate/src/app/CourseLibraryPage.php
          echo P01_V247246_READER_PRESERVED=PASS
      - name: Canonical regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate baseline --require-zero-debt | tee /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/canonical.txt
          echo P01_V247246_CANONICAL=PASS
      - name: No release write
        shell: bash
        run: |
          echo FORMAL_RELEASE_CALLED=NO
          echo DISTRIBUTION_WRITE=NO
          echo PRODUCTION_WRITE=NO
