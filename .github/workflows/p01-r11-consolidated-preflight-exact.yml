name: P01 R11 IA V2 plus Music exact source technical preflight
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-r11-consolidated-preflight-exact.yml'
permissions:
  contents: read
jobs:
  p01-r11-consolidated:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      REPO: llhzx2018/vf-start
      CANDIDATE_SHA: 5bcb44a527755135fdd8620bec41fc2bacdfe045
      BASELINE_SHA: 46386fbcec592a8225f97b92acda766f1389c057
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, mbstring, curl, zip, openssl
          coverage: none
      - name: Fetch exact private source then drop credential remote
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          for pair in "candidate refs/heads/main" "stable refs/tags/v2.47.444"; do
            set -- $pair
            git init -q "$1"
            git -C "$1" remote add origin "https://x-access-token:$READ_TOKEN@github.com/$REPO.git"
            git -C "$1" -c advice.detachedHead=false fetch -q --depth 1 origin "$2"
            git -C "$1" checkout -q --detach FETCH_HEAD
            if [ "$1" = candidate ]; then
              test "$(git -C "$1" rev-parse HEAD)" = "$CANDIDATE_SHA"
            else
              test "$(git -C "$1" rev-parse HEAD)" = "$BASELINE_SHA"
            fi
            git -C "$1" remote remove origin
          done
          echo P01_R11_EXACT_SOURCE_AND_STABLE_TAG_PIN=PASS
      - name: IA V2 all rounds and Music exact-source focused safety contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          test "$(tr -d '\r\n ' < VERSION)" = '2.47.444'
          test "$(tr -d '\r\n ' < src/VERSION.txt)" = '2.47.444'
          for file in src/app/AdminShell.php src/app/SubsiteAdminCatalog.php src/manage.php src/transfer.php src/data-safety.php src/system-health.php src/jobs.php src/plugins.php src/settings.php tests/unit/p01_ia_v2_r10_admin_closure_contract.php; do
            php -l "$file" >/dev/null
          done
          node --check src/assets/admin-shell.js
          php tests/unit/p01_ia_v2_r10_admin_closure_contract.php
          php tests/unit/p01_ia_v2_r9_resource_center_17_task_contract.php
          php tests/unit/admin_ia_v247253_contract.php
          php tests/unit/admin_navigation_consistency_contract.php
          php tests/unit/admin_overview_ia_contract.php
          php tests/unit/admin_secondary_nav_focus_contract.php
          php tests/unit/engineering_consistency_r80_contract.php
          php tests/unit/backend_ia_round1_v247269_contract.php
          php tests/unit/six_resource_admin_manager_contract.php
          php tests/unit/admin_plain_language_17_tasks_v247287_contract.php
          php tests/unit/admin_backend_closure_contract.php
          php tests/unit/admin_navigation_task_separation_contract.php
          php tests/unit/recycle_bin_safe_selection_v247291_contract.php
          php tests/unit/music_security_contract.php
          php tests/unit/admin_overview_action_board_v247321_contract.php
          php tests/unit/admin_special_primary_nav_r76_contract.php
          php tests/unit/pending_entry_unification_r4_contract.php
          find src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          for script in src/assets/music-dock.js src/assets/music-library-notify.js src/assets/music-home-manage.js src/assets/frontstage-panel-controller.js; do node --check "$script"; done
          for contract in \
            tests/unit/p01_r1_subsite_admin_catalog_contract.php \
            tests/unit/p01_r2_frontstage_panel_lifecycle_contract.php \
            tests/unit/p01_ia_v2_r3_frontstage_contract.php \
            tests/unit/p01_ia_v2_r4_channels_watch_frontstage_contract.php \
            tests/unit/p01_ia_v2_r5_music_frontstage_contract.php \
            tests/unit/p01_ia_v2_r6_gov_source_ownership_contract.php \
            tests/unit/ia_v2_r7_project_source_contract.php \
            tests/unit/p01_ia_v2_r8_derived_tool_software_contract.php \
            tests/unit/music_playlist_import_contract.php; do php "$contract"; done
          node tests/unit/music_dock_contract.js
          node tests/unit/p01_r2_frontstage_panel_behavior.cjs
          echo P01_R11_IA_MUSIC_FOCUSED=PASS
      - name: Synthetic Music restore and owner HTTP safety
        shell: bash
        run: |
          set -Eeuo pipefail
          php candidate/tests/integration/music_portable_sqlite_roundtrip.php
          bash candidate/tests/integration/music_portable_http_roundtrip.sh candidate
          bash candidate/tests/integration/p01_ia_v2_r5_music_http_roundtrip.sh candidate
          bash candidate/tests/integration/p01_ia_v2_r6_gov_source_http.sh candidate
          echo P01_R11_SYNTHETIC_DATA_HTTP=PASS
      - name: Canonical regression against last formal stable tag
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate stable --require-zero-debt
          echo P01_R11_CANONICAL_ZERO_DEBT=PASS
      - name: Remove transient private source
        if: always()
        shell: bash
        run: |
          rm -rf candidate stable
          echo P01_R11_PRIVATE_SOURCE_CLEANUP=PASS
