name: S01 embed reference candidate proof
on:
  push:
    branches: [task/s01-embed-recheck-20261031]
    paths: ['.github/workflows/s01-embed-20261029.yml', 'lanes/s01-embed-20261029/**']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.220
  TARGET_SHA: 1aeb7bac7f9834211bd47479b2abf757f9eb2a26
  TARGET_TREE: ab314d5206b8320721c41ffe93fad1812b3a657e
  BASE_SHA: 696e32e0a368aeef5f1dd557cfd319d032619db7
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: control
      - name: Identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-embed-20261029/spec.json --input control/.github/workflows/s01-embed-20261029.yml
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 02d4591eed025a3d3a67bc0a150b3ddc448c2ab8
          persist-credentials: false
          path: established
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 1aeb7bac7f9834211bd47479b2abf757f9eb2a26
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: 521efcc568cf6b12640681ba5002f4112f7c809e
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: provider-source
      - name: Verify candidate and unchanged source boundary
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git -C provider-source rev-parse HEAD)" = 521efcc568cf6b12640681ba5002f4112f7c809e
          node --check provider-source/src/public/js/tool-runtime-i18n.js
          node --check provider-source/src/public/dist/embed.js
          mkdir -p proof provider
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          php -l target/src/inc/modules/module-faq.php
          node --check control/lanes/s01-embed-20261029/check.cjs
          python3 - <<'PY'
          import subprocess,pathlib,hashlib,os
          files=set(subprocess.check_output(['git','-C','target','diff','--name-only',os.environ['BASE_SHA'],'HEAD']).decode().splitlines())
          assert files=={'src/inc/modules/module-faq.php','src/inc/public-css-owner-registry.php','src/assets/css/public/pages/families/public-family-02-tool-directory-detail-operations-closure.css','src/assets/css/public/vf-theme-public-runtime.css'},files
          src=pathlib.Path('target/src'); family=(src/'assets/css/public/pages/families/public-family-02-tool-directory-detail-operations-closure.css').read_bytes();bundle=(src/'assets/css/public/vf-theme-public-runtime.css').read_bytes();assert bundle.count(family)==1
          assert hashlib.sha256(bundle).hexdigest()=='d9c69f8c362d10f29784525dbb2969219061262deedc7a17f4a3f3e8376d3454'
          assert hashlib.sha256(bundle).hexdigest() in (src/'inc/public-css-owner-registry.php').read_text()
          PY
          gh release download v1.25.96 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.96.zip --dir provider
          echo 'c49b51b8d4f92acb88fe5b1f1f6a2dc9ce523a49a394425f2123d1e9bed24723  provider/vf-tools-m3u8_V1.25.96.zip' | sha256sum -c
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -fsSL https://github.com/googlefonts/noto-cjk/raw/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf -o "$HOME/.local/share/fonts/NotoSansCJKsc-Regular.otf"
          fc-cache -f
          cp -a established/lanes/s01-frontend-design-20261017 lane
      - name: WordPress bilingual layouts and controls
        run: bash control/lanes/s01-embed-20261029/native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-downloader-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Clean private source and provider
        if: always()
        run: rm -rf target provider provider-source lane
