name: R85 Focused Project State Context Count Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r85-project-state-context-counts.yml'

permissions:
  contents: read

jobs:
  r85-focused-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: 36d692f951efb675a3c4612f7efc5157d3891449
    steps:
      - name: Checkout exact private P01 candidate transiently
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: 36d692f951efb675a3c4612f7efc5157d3891449
          path: vf-start
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Exact source and focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd vf-start
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(cat VERSION)" = '2.47.0'
          php -l tests/unit/project_state_context_count_contract.php
          php tests/unit/project_state_context_count_contract.php
          php tests/unit/sidebar_context_count_contract.php
          php tests/unit/scope_context_count_contract.php
          php tests/unit/software_os_context_count_contract.php
          php tests/unit/tools_facet_context_count_contract.php
          echo R85_PROJECT_STATE_CONTEXT_COUNT_PASS
          echo R85_EXACT_CANDIDATE_GATE_PASS

      - name: Cleanup transient private source
        if: always()
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/vf-start"
