name: TEMP P08 R43 exact current 21 vs 22 migration package refusal
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p08-r43-current-package-lineage-20261125.yml'
permissions:
  contents: read
concurrency:
  group: p08-r43-package-lineage-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  TARGET_REPO: llhzx2018/vf-adops
  TARGET_VERSION: '0.1.18'
  TARGET_SHA: 8506cb999e380c958ede43502d6abd5ed2917298
  BRIDGE_VERSION: '0.1.17'
  BRIDGE_SHA: 7ed1bf09655ea3b2a5c2d720bc73435e70c6a3ff
  EXTENDED_SHA: 97ec4e43f857f4705765fac163d382d31b43c9ac
jobs:
  identity-preflight:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/p08-r43-current-package-lineage-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 scripts/ephemeral_lane_spec.py audit-rendered --spec specs/ephemeral/p08-r43-current-package-lineage-20261125.json --input .github/workflows/temp-p08-r43-current-package-lineage-20261125.yml
  package-lineage:
    needs: identity-preflight
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/p08-r43-current-package-lineage-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 36
    env:
      P08_R43_DISPOSABLE_SCHEMA: 'YES'
      P08_R43_DISPOSABLE: 'YES'
      P08_ISOLATED_INSTALL_TEST: 'YES'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: ${{ env.BRIDGE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-p08-bridge
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-p08-target
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: ${{ env.EXTENDED_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-p08-extended
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: gov-proof
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_mysql, pdo_sqlite, sqlite3, zip, mbstring, intl, bcmath, dom, fileinfo
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source-identity, real locked dependencies and three candidate FULLs
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C private-p08-bridge rev-parse HEAD)" = "$BRIDGE_SHA"
          test "$(git -C private-p08-target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C private-p08-extended rev-parse HEAD)" = "$EXTENDED_SHA"
          test "$(cat private-p08-bridge/VERSION)" = "$BRIDGE_VERSION"
          test "$(cat private-p08-target/VERSION)" = "$TARGET_VERSION"
          test "$(cat private-p08-extended/VERSION)" = "$TARGET_VERSION"
          php -l private-p08-bridge/src/Upgrade/R43SchemaUpgradeAdmission.php >/dev/null
          php -l private-p08-bridge/src/Upgrade/R43SchemaAtomicArchive.php >/dev/null
          php -l private-p08-bridge/tests/compatibility/r43_schema_upgrade_admission.php >/dev/null
          php -l private-p08-bridge/tests/compatibility/r43_schema_atomic_zip.php >/dev/null
          for d in private-p08-bridge private-p08-target private-p08-extended; do
            mkdir -p "$d/bootstrap/cache" "$d/storage/framework/cache/data" "$d/storage/framework/sessions" "$d/storage/framework/views" "$d/storage/logs"
            (cd "$d" && composer install --no-scripts --no-dev --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/r43-$d-composer.log" 2>&1) || { echo P08_R43_SOURCE_COMPOSER=FAIL; exit 1; }
            (cd "$d" && npm ci --no-audit --no-fund > "$RUNNER_TEMP/r43-$d-npm.log" 2>&1 && npm run build > "$RUNNER_TEMP/r43-$d-vite.log" 2>&1) || { echo P08_R43_SOURCE_VITE=FAIL; exit 1; }
          done
          python3 private-p08-bridge/scripts/build_full.py --source private-p08-bridge --output "$RUNNER_TEMP/p08-r43-bridge.zip" --version "$BRIDGE_VERSION" --source-sha "$BRIDGE_SHA" --governance-root gov-proof > "$RUNNER_TEMP/r43-bridge-build.log" 2>&1 || { echo P08_R43_BRIDGE_FULL=FAIL; exit 1; }
          python3 private-p08-target/scripts/build_full.py --source private-p08-target --output "$RUNNER_TEMP/p08-r43-target.zip" --version "$TARGET_VERSION" --source-sha "$TARGET_SHA" --governance-root gov-proof > "$RUNNER_TEMP/r43-target-build.log" 2>&1 || { echo P08_R43_TARGET_FULL=FAIL; exit 1; }
          python3 private-p08-extended/scripts/build_full.py --source private-p08-extended --output "$RUNNER_TEMP/p08-r43-extended.zip" --version "$TARGET_VERSION" --source-sha "$EXTENDED_SHA" --governance-root gov-proof > "$RUNNER_TEMP/r43-extended-build.log" 2>&1 || { echo P08_R43_EXTENDED_FULL=FAIL; exit 1; }
          for name in bridge target extended; do
            mkdir -m 700 "$RUNNER_TEMP/p08-r43-$name-extract"
            unzip -q "$RUNNER_TEMP/p08-r43-$name.zip" -d "$RUNNER_TEMP/p08-r43-$name-extract"
          done
          echo P08_R43_EXACT_THREE_REAL_FULLS=PASS
      - name: Exact S9 21 migrations accepted read-only and 22 migration BeMob denied
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          php private-p08-bridge/tests/compatibility/r43_schema_upgrade_admission.php "$RUNNER_TEMP/p08-r43-bridge-extract" "$RUNNER_TEMP/p08-r43-target-extract" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/r43-s9-inventory.log" 2>&1 || { echo P08_R43_S9_21_MIGRATION_ADMISSION=FAIL; exit 1; }
          echo P08_R43_S9_21_MIGRATION_ADMISSION_READ_ONLY=PASS
          php -r '
            require "private-p08-bridge/src/Upgrade/R43SchemaUpgradeAdmission.php";
            $gate=new VF\AdOps\Upgrade\R43SchemaUpgradeAdmission();
            try {
                $gate->inspect(getenv("RUNNER_TEMP")."/p08-r43-bridge-extract",
                    getenv("RUNNER_TEMP")."/p08-r43-extended-extract",
                    getenv("BRIDGE_SHA"),getenv("EXTENDED_SHA"));
                exit(51);
            } catch (RuntimeException $e) {
                if ($e->getMessage()!=="R43_SCHEMA_MIGRATION_SET_CHANGED") exit(52);
                echo "P08_R43_BEMOB_22_MIGRATION_SAME_VERSION_DENIED=PASS\n";
            }
          '
      - name: Deterministic current-S9-only schema ZIP and old-code-only explicit refusal
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          source_manifest="$(sha256sum "$RUNNER_TEMP/p08-r43-bridge-extract/FULL_MANIFEST.json" | cut -d ' ' -f1)"
          python3 private-p08-bridge/scripts/build_r43_schema_atomic.py --source-full "$RUNNER_TEMP/p08-r43-bridge-extract" --target-runtime private-p08-target --output "$RUNNER_TEMP/p08-r43-schema-a.zip" --source-sha "$BRIDGE_SHA" --source-full-sha256 "$source_manifest" --target-sha "$TARGET_SHA" > "$RUNNER_TEMP/r43-schema-build-a.log" 2>&1 || { echo P08_R43_S9_SCHEMA_ZIP=FAIL; exit 1; }
          python3 private-p08-bridge/scripts/build_r43_schema_atomic.py --source-full "$RUNNER_TEMP/p08-r43-bridge-extract" --target-runtime private-p08-target --output "$RUNNER_TEMP/p08-r43-schema-b.zip" --source-sha "$BRIDGE_SHA" --source-full-sha256 "$source_manifest" --target-sha "$TARGET_SHA" > "$RUNNER_TEMP/r43-schema-build-b.log" 2>&1 || { echo P08_R43_S9_SCHEMA_ZIP_REPEAT=FAIL; exit 1; }
          cmp -s "$RUNNER_TEMP/p08-r43-schema-a.zip" "$RUNNER_TEMP/p08-r43-schema-b.zip" || { echo P08_R43_S9_SCHEMA_ZIP_DETERMINISM=FAIL; exit 1; }
          zip_sha="$(sha256sum "$RUNNER_TEMP/p08-r43-schema-a.zip" | cut -d ' ' -f1)"
          php private-p08-bridge/tests/compatibility/r43_schema_atomic_zip.php "$RUNNER_TEMP/p08-r43-bridge-extract" "$RUNNER_TEMP/p08-r43-schema-a.zip" "$BRIDGE_SHA" "$source_manifest" "$TARGET_SHA" "$zip_sha" > "$RUNNER_TEMP/r43-schema-archive-audit.log" 2>&1 || { echo P08_R43_S9_ARCHIVE_AUDIT=FAIL; exit 1; }
          echo P08_R43_CURRENT_S9_BYTE_IDENTICAL_SCHEMA_ZIP_VERIFIED_NOT_INSTALLABLE=PASS
          if python3 private-p08-bridge/scripts/build_r43_schema_atomic.py --source-full "$RUNNER_TEMP/p08-r43-bridge-extract" --target-runtime private-p08-extended --output "$RUNNER_TEMP/p08-r43-schema-extended-unsafe.zip" --source-sha "$BRIDGE_SHA" --source-full-sha256 "$source_manifest" --target-sha "$EXTENDED_SHA" > "$RUNNER_TEMP/r43-schema-extended-denial.log" 2>&1; then echo P08_R43_EXTENDED_22_MIGRATION_ZIP_UNSAFE_ACCEPTED=FAIL; exit 1; fi
          grep -q R43_SCHEMA_ATOMIC_MIGRATION_SET_CHANGED "$RUNNER_TEMP/r43-schema-extended-denial.log" || { echo P08_R43_EXTENDED_DENIAL_REASON_UNKNOWN=FAIL; exit 1; }
          test ! -f "$RUNNER_TEMP/p08-r43-schema-extended-unsafe.zip"
          echo P08_R43_EXTENDED_22_MIGRATION_ATOMIC_BUILD_DENIED=PASS
      - name: Erase private checkouts, extracted sites, packages and logs
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- private-p08-bridge private-p08-target private-p08-extended gov-proof
          rm -rf -- "$RUNNER_TEMP"/p08-r43-bridge-extract "$RUNNER_TEMP"/p08-r43-target-extract "$RUNNER_TEMP"/p08-r43-extended-extract
          rm -f -- "$RUNNER_TEMP"/p08-r43-*.zip "$RUNNER_TEMP"/r43-*.log
          test ! -e private-p08-bridge && test ! -e private-p08-target && test ! -e private-p08-extended && test ! -e gov-proof
          echo P08_R43_TEMP_PRIVATE_CLEANUP=PASS
