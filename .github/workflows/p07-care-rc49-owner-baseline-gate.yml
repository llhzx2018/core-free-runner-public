name: P07 Care rc49 WP owner baseline and status regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/p07-system-care/0.1.0-rc49/**'
      - 'tests/test_p07_wp_owner_baseline_rc49.py'
      - 'installers/p07-toolbox.sh'
      - 'installers/p07-system-care.sh'
      - '.github/workflows/p07-care-rc49-owner-baseline-gate.yml'
permissions:
  contents: read
jobs:
  owner-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify frozen menu and immutable package
        shell: bash
        run: |
          set -Eeuo pipefail
          pkg='packages/p07-system-care/0.1.0-rc49'
          test "$(cat "$pkg/VERSION")" = '0.1.0-rc49'
          test "$(git hash-object "$pkg/MANIFEST.gitblob")" = 'f959600602521be6d912223ff045af2d09d00fc9'
          (cd "$pkg" && while read -r hash file; do test "$(git hash-object "$file")" = "$hash"; done < MANIFEST.gitblob)
          bash -n "$pkg/intrusion-evidence.sh" "$pkg/vf-system-care.sh"
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc54"' installers/p07-toolbox.sh
          grep -Fq 'VF_NODE_EXPECTED="0.1.0-rc13"' installers/p07-toolbox.sh
          grep -Fq 'VPS_AUDIT_EXPECTED="V2.1.0"' installers/p07-toolbox.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release85"' installers/p07-toolbox.sh
          grep -Fq "VERSION='0.1.0-rc54'" installers/p07-system-care.sh
          grep -Fq "MANIFEST_BLOB='e9ccedae9232d345ebbe945ee37197f030ce2ea5'" installers/p07-system-care.sh
          echo P07_RC49_IMMUTABLE_DISTRIBUTION=PASS
      - name: Isolated pseudo-TTY dangerous write gating and one-screen status
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s tests -p test_p07_wp_owner_baseline_rc49.py -v
          python3 -m unittest discover -s tests -p test_p07_wp_owner_triage_rc48.py -v
          bash -n packages/p07-system-care/0.1.0-rc49/intrusion-evidence.sh
          echo P07_RC49_RISK_GATE_AND_STATUS=PASS
