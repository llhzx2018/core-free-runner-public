name: S01 downloader reference candidate proof
on:
  push:
    branches: [task/s01-downloader-proof-20261029]
    paths: ['.github/workflows/s01-downloader-20261029.yml', 'lanes/s01-downloader-20261029/**']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.217
  TARGET_SHA: bbcc1fffe494ce101015ac592201c988cfef9243
  TARGET_TREE: 6d4daee3c88e3abc27183516bb515decab666a1c
  BASE_SHA: 858e9db51ff7c3f3ed9611512c4a0da673333e7f
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: control
      - name: Identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-downloader-20261029/spec.json --input control/.github/workflows/s01-downloader-20261029.yml
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 02d4591eed025a3d3a67bc0a150b3ddc448c2ab8
          persist-credentials: false
          path: established
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: bbcc1fffe494ce101015ac592201c988cfef9243
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Verify candidate and unchanged source boundary
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          php -l target/src/inc/modules/module-faq.php
          php -l target/src/inc/services/frontend-page-progress-service.php
          test "$(cat target/VERSION)" = "$TARGET_VERSION"
          php control/lanes/s01-downloader-20261029/faq-contract.php > proof/faq-contract.json
          node --check control/lanes/s01-downloader-20261029/check.cjs
          python3 - <<'PY'
          import subprocess,pathlib,hashlib,os
          files=set(subprocess.check_output(['git','-C','target','diff','--name-only',os.environ['BASE_SHA'],'HEAD']).decode().splitlines())
          assert files=={'src/inc/modules/module-faq.php','src/inc/public-css-owner-registry.php','src/assets/css/public/pages/families/public-family-02-tool-directory-detail-operations-closure.css','src/assets/css/public/vf-theme-public-runtime.css','VERSION','src/style.css','src/inc/runtime-constants.php','CHANGELOG.md','src/inc/services/frontend-page-progress-service.php'},files
          src=pathlib.Path('target/src'); family=(src/'assets/css/public/pages/families/public-family-02-tool-directory-detail-operations-closure.css').read_bytes();bundle=(src/'assets/css/public/vf-theme-public-runtime.css').read_bytes();assert bundle.count(family)==1
          assert hashlib.sha256(bundle).hexdigest()=='86e3e966cf7d54770a538d49842ea7cc561289a1974aa6216cd5b376a56085de'
          assert hashlib.sha256(bundle).hexdigest() in (src/'inc/public-css-owner-registry.php').read_text()
          PY
          gh release download v1.25.94 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.94.zip --dir provider
          echo '70b90d40da5d69fc7819bd7ada3f15fb0145e64822b788bd94956c7827b2df03  provider/vf-tools-m3u8_V1.25.94.zip' | sha256sum -c
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          cp -a established/lanes/s01-frontend-design-20261017 lane
      - name: WordPress bilingual layouts and controls
        run: bash control/lanes/s01-downloader-20261029/native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-downloader-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Clean private source and provider
        if: always()
        run: rm -rf target provider lane
