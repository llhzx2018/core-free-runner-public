name: P01 V2.47.444 channel exact-SHA contract recovery
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v247444-channel-recovery.yml'
permissions:
  contents: read
jobs:
  channel-contract:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact private core-updates PR commit
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git init -q channel
          git -C channel remote add origin "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/core-updates.git"
          git -C channel fetch -q --depth 1 origin f962f678886e16c735d92af6d1c8ea717f514396
          git -C channel checkout -q --detach FETCH_HEAD
          test "$(git -C channel rev-parse HEAD)" = f962f678886e16c735d92af6d1c8ea717f514396
          git -C channel remote remove origin
          echo P01_CHANNEL_EXACT_SHA_CHECKOUT=PASS
      - name: Original core-updates contract and PHP regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd channel
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php update-core/php/tests/run.php
          python3 - <<'PY'
          import json
          x=json.load(open('projects/P01.json',encoding='utf-8'))
          assert x['project_id']=='P01' and x['target_version']=='2.47.444'
          assert x['current_version']=='2.47.443' and x['from_versions']==['2.47.443']
          assert x['release_tag']=='v2.47.444' and x['release_id']==421771332
          assert x['product_identity']=='46386fbcec592a8225f97b92acda766f1389c057'
          assert x['schema_to']==x['schema_from']=='2026102201'
          assert x['update_type']=='ATOMIC' and x['backup_required'] and x['rollback_supported']
          assert x['asset_name']=='VF_Start_V2.47.444_UPDATE.zip'
          assert x['asset_bytes']==2880700 and x['asset_sha256']=='140bdb344a5f741dacf8ee050396e5f224751d1aa8512722f4bf6d7a75049c62'
          print('P01_CHANNEL_MANIFEST_EXACT_IDENTITY=PASS')
          PY
          echo P01_CORE_UPDATES_NATIVE_TESTS=PASS
      - name: Official P01 Release Tag and UPDATE remote digest readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          gh api repos/llhzx2018/vf-start/releases/tags/v2.47.444 >/tmp/p01-release.json
          test "$(jq -r .id /tmp/p01-release.json)" = 421771332
          test "$(jq -r .tag_name /tmp/p01-release.json)" = v2.47.444
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.47.444 --jq .object.sha)" = 46386fbcec592a8225f97b92acda766f1389c057
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.47.444_UPDATE.zip")|.size' /tmp/p01-release.json)" = 2880700
          mkdir -p /tmp/p01-channel-asset
          gh release download v2.47.444 -R llhzx2018/vf-start -p VF_Start_V2.47.444_UPDATE.zip -D /tmp/p01-channel-asset
          echo "140bdb344a5f741dacf8ee050396e5f224751d1aa8512722f4bf6d7a75049c62  /tmp/p01-channel-asset/VF_Start_V2.47.444_UPDATE.zip" | sha256sum -c -
          echo P01_RELEASE_ASSET_REMOTE_SHA256=PASS
      - name: Ephemeral data cleanup
        if: always()
        shell: bash
        run: |
          rm -rf channel /tmp/p01-channel-asset /tmp/p01-release.json
          echo P01_CHANNEL_RECOVERY_NO_SOURCE_LEAK=PASS
