name: P01 2.47.516 real local TLS maintenance root proof
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  active-https-root:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TARGET_VERSION: 2.47.516
      TARGET_SHA: 1b8027456465e36b55ecd05c52cd8e2680dd6f5a
    steps:
      - name: Checkout public one-off lane auditor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Audit exact source before private checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "$GITHUB_HEAD_REF" = "test/p01-247516-active-https-root-20261115"
          python3 scripts/ephemeral_lane_spec.py validate --spec scripts/ephemeral/p01-247516-active-https-root.json >"$RUNNER_TEMP/p01-active-spec.txt"
          python3 scripts/ephemeral_lane_spec.py audit-rendered --spec scripts/ephemeral/p01-247516-active-https-root.json --input .github/workflows/p01-247516-active-https-root-oneoff.yml >"$RUNNER_TEMP/p01-active-audit.txt"
          grep -F '"status": "PASS"' "$RUNNER_TEMP/p01-active-audit.txt" >/dev/null
          echo P01_MAJOR_ACTIVE_ROOT_EXACT_LANE_AUDIT=PASS
      - name: Checkout exact P01 private candidate transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - name: Install isolated PHP and Nginx verification tools
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(cat candidate/VERSION)" = "$TARGET_VERSION"
          test "$(cat candidate/src/VERSION.txt)" = "$TARGET_VERSION"
          sudo apt-get update -qq >"$RUNNER_TEMP/p01-active-apt.txt" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php8.3-cli php8.3-zip php8.3-curl php8.3-sqlite3 php8.3-mbstring php8.3-xml composer nginx openssl >>"$RUNNER_TEMP/p01-active-apt.txt" 2>&1
          echo "P01_MAJOR_ACTIVE_ROOT_EXACT_SOURCE_SHA=$TARGET_SHA"
      - name: Exact PHP source, handoff and test syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          php8.3 -l candidate/src/app/next/runtime/MajorActiveHttpsRootEvidence.php >"$RUNNER_TEMP/p01-active-lint.txt"
          php8.3 -l candidate/src/app/next/runtime/CloudPanelManualHandoff.php >>"$RUNNER_TEMP/p01-active-lint.txt"
          php8.3 -l candidate/tests/compatibility/laravel/http/p01_major_active_https_root.php >>"$RUNNER_TEMP/p01-active-lint.txt"
          PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile candidate/tests/compatibility/laravel/http/run_p01_major_active_https_root.py
          echo P01_MAJOR_ACTIVE_ROOT_PHP_PY_SYNTAX=PASS
      - name: Genuine TLS Nginx localhost GET HEAD GET plus cert and privacy negatives
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! PYTHONDONTWRITEBYTECODE=1 python3 -B candidate/tests/compatibility/laravel/http/run_p01_major_active_https_root.py >"$RUNNER_TEMP/p01-active-proof.txt" 2>&1; then
            grep -Eo '(P01_ACTIVE_HTTPS_[A-Z0-9_]{5,100}|MAJOR_ACTIVE_HTTPS_[A-Z0-9_]{5,100}|RuntimeError|Fatal error|TypeError)' "$RUNNER_TEMP/p01-active-proof.txt" | sort -u | head -n 15 || true
            echo P01_MAJOR_ACTIVE_ROOT_NATIVE_TLS=FAIL
            exit 1
          fi
          grep -Fx P01_MAJOR_ACTIVE_NGINX_REAL_LOCAL_TLS_503_PROOF=PASS "$RUNNER_TEMP/p01-active-proof.txt"
          grep -Fx P01_MAJOR_ACTIVE_HTTPS_WRONG_TLS_HOSTNAME_REFUSED=PASS "$RUNNER_TEMP/p01-active-proof.txt"
          grep -Fx P01_MAJOR_ACTIVE_HTTPS_SAFETY_NEGATIVE_MATRIX=PASS "$RUNNER_TEMP/p01-active-proof.txt"
          grep -Fx P01_MAJOR_CLOUDPANEL_UI_CONTROL_PLANE=NOT_PROVEN "$RUNNER_TEMP/p01-active-proof.txt"
          grep -Fx P01_MAJOR_PRODUCTION_CHANGED=NO "$RUNNER_TEMP/p01-active-proof.txt"
          echo P01_MAJOR_ACTIVE_ROOT_ISOLATED_MACHINE=PASS
      - name: Full and MAJOR and Atomic runtime required inventory contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B candidate/tests/architecture/test_p01_shared_helpers_manifest.py >"$RUNNER_TEMP/p01-active-inventory.txt" 2>&1 || {
            grep -E 'FAIL|ERROR|AssertionError' "$RUNNER_TEMP/p01-active-inventory.txt" | head -n 8 || true
            exit 1
          }
          grep -F 'OK' "$RUNNER_TEMP/p01-active-inventory.txt" >/dev/null
          echo P01_MAJOR_ACTIVE_ROOT_REQUIRED_ALL_PACKAGE_FAMILIES=PASS
      - name: Build exact-source self-contained Laravel Clean FULL and CloudPanel FULL
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 scripts/build_p01_next_clean_full.py build \
            --source-sha "$TARGET_SHA" \
            --output "$RUNNER_TEMP/p01-active-clean-full.zip" --composer composer \
            >"$RUNNER_TEMP/p01-active-build.txt" 2>&1 || {
              grep -Eo '(BuildError|Error:|ERROR|AssertionError)' "$RUNNER_TEMP/p01-active-build.txt" | sort -u | head -n 9 || true
              exit 1
            }
          python3 scripts/build_p01_next_clean_full.py verify \
            --zip "$RUNNER_TEMP/p01-active-clean-full.zip" >>"$RUNNER_TEMP/p01-active-build.txt" 2>&1
          python3 scripts/build_p01_next_cloudpanel_full.py build \
            --source-zip "$RUNNER_TEMP/p01-active-clean-full.zip" \
            --output "$RUNNER_TEMP/p01-active-cloudpanel-full.zip" \
            >>"$RUNNER_TEMP/p01-active-build.txt" 2>&1
          python3 scripts/build_p01_next_cloudpanel_full.py verify \
            --zip "$RUNNER_TEMP/p01-active-cloudpanel-full.zip" \
            >>"$RUNNER_TEMP/p01-active-build.txt" 2>&1
          echo P01_MAJOR_ACTIVE_ROOT_GENUINE_LARAVEL_CLOUDPANEL_FULL=PASS
      - name: Verify actual nested FULL in isolated MAJOR consumer
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! P01_MAJOR_REAL_FULL_ISOLATED_TEST=YES php8.3 \
            candidate/tests/compatibility/laravel/run_major_signed_real_full_contract.php \
            --developer-full "$RUNNER_TEMP/p01-active-cloudpanel-full.zip" \
            >"$RUNNER_TEMP/p01-active-major.txt" 2>&1; then
            grep -Eo '(MAJOR_[A-Z0-9_]{5,100}|P01_MAJOR_[A-Z0-9_]{5,100}|TypeError|Fatal error)' "$RUNNER_TEMP/p01-active-major.txt" | sort -u | head -n 12 || true
            exit 1
          fi
          grep -Fx 'P01_MAJOR_REAL_CLOUDPANEL_FULL_SYNTHETIC_SIGNED_CONSUMER=PASS' "$RUNNER_TEMP/p01-active-major.txt"
          grep -Fx 'P01_MAJOR_REAL_RELEASE_SIGNING_KEY_AND_GITHUB_ASSET=NOT_PROVEN' "$RUNNER_TEMP/p01-active-major.txt"
          echo P01_MAJOR_ACTIVE_ROOT_REAL_FULL_NESTED_LEDGER_SYNTHETIC=PASS
      - name: Wipe private candidate and ephemeral proof
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate
          rm -f -- "$RUNNER_TEMP"/p01-active-*.txt "$RUNNER_TEMP"/p01-active-*.zip
          echo P01_MAJOR_ACTIVE_ROOT_PRIVATE_SOURCE_PERSISTENCE=NONE
