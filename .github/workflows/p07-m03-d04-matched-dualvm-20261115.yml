name: P07 D04 matched MySQL8.4 two-CloudPanel migration
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-m03-d04-matched-dualvm-20261115.yml'
permissions:
  contents: read
jobs:
  dual-vm:
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Public synthetic harness checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Transient exact P07 private source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: d0b7f9b0ac89aba1ae630128cd32878c5844bb6d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: .p07-private-exact
      - name: MySQL8.4 matched CloudPanel source and receiver full test
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-private-exact rev-parse HEAD)" = d0b7f9b0ac89aba1ae630128cd32878c5844bb6d
          (cd .p07-private-exact; export PYTHONPATH="$PWD/lib"; python3 -B -m unittest discover -s tests -p test_p07_m03_d04_matched_engine.py -v)
          bash -n tests/p07_m03_d04_matched_dualvm_20261115.sh
          timeout --signal=TERM --kill-after=60s 3100s bash tests/p07_m03_d04_matched_dualvm_20261115.sh
      - name: Remove private product checkout
        if: always()
        shell: bash
        run: |
          rm -rf -- .p07-private-exact
          test ! -e .p07-private-exact
          echo P07_D04_MYSQL84_PRIVATE_SOURCE_CLEAN=PASS
