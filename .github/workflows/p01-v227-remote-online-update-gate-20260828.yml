name: P01 V2.27.0 Remote Online Update Gate
on:
  push:
    branches: [task/p01-v222-multi-surface-gate-20260828]
    paths: ['.github/workflows/p01-v227-remote-online-update-gate-20260828.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_TAG: v2.26.0
      SOURCE_COMMIT: c97a362fc574cd80349526fca016f9e0e6a9c472
      SOURCE_TREE: 784fbbb4b3612145cdfa424659ddc6e843d3694b
      TARGET_VERSION: 2.27.0
      TARGET_SCHEMA: '2026082801'
      RELEASE_SOURCE: 8c3d18e1243d4b6ddc40bc7922746131a5d0d9c3
      RELEASE_TREE: 6e9fb22d146b6b1e9ab276100331043c8ec647aa
      MAIN_SHA: 3bf8fe79b9901c70fe45185efd0f36cf2df3077e
      RELEASE_ID: '378559380'
      CORE_UPDATES_COMMIT: 4da2ad06331f7b2940cd767545612707635835d6
      ASSET_NAME: VF_Start_V2.27.0_UPDATE.zip
      ASSET_BYTES: '1246236'
      ASSET_SHA: bec0e6d60a5d1a7ac537ee30f50fd0889fb812303d84871445fd26d06a363002
      PUBLICATION_GATE: '33182758610'
      ASSET_CLOSURE_GATE: '33183112266'
      ROOT: /tmp/p01-v227-remote-online
      COOKIE: /tmp/p01-v227-remote-online.cookies
      PORT: '18331'
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE_TAG }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: source
      - name: Immutable remote publication fence
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git -C source rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test "$(git ls-remote https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/vf-start.git refs/heads/main | awk '{print $1}')" = "$MAIN_SHA"
          git -C source fetch -q https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/vf-start.git "$MAIN_SHA"
          test "$(git -C source rev-parse FETCH_HEAD^{tree})" = "$RELEASE_TREE"
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.27.0 | jq -r '.object.sha')" = "$RELEASE_SOURCE"
          REL=$(gh api "repos/llhzx2018/vf-start/releases/$RELEASE_ID")
          test "$(jq -r '.tag_name' <<<"$REL")" = v2.27.0
          test "$(jq -r '.target_commitish' <<<"$REL")" = "$RELEASE_SOURCE"
          test "$(jq '.assets | length' <<<"$REL")" = 8
          for f in P01-V2.27.0-ARTIFACT-GATE.json P01-V2.27.0-FORMAL-METADATA.json SHA256SUMS.txt VF-Start-V2.27.0-FULL.zip VF-Start-V2.27.0-UPDATE.zip VF_Start_V2.27.0_UPDATE.zip atomic-self-test.json repair-v2.27.0.php; do
            jq -e --arg f "$f" '.assets[] | select(.name==$f and .state=="uploaded")' <<<"$REL" >/dev/null
          done
          ASSET=$(jq -c --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)' <<<"$REL")
          test "$(jq -r '.size' <<<"$ASSET")" = "$ASSET_BYTES"
          test "$(jq -r '.digest' <<<"$ASSET")" = "sha256:$ASSET_SHA"
          rm -rf /tmp/p01-v227-remote-core
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/core-updates.git" /tmp/p01-v227-remote-core
          test "$(git -C /tmp/p01-v227-remote-core rev-parse HEAD)" = "$CORE_UPDATES_COMMIT"
          jq -e --arg rid "$RELEASE_ID" --arg rs "$RELEASE_SOURCE" --arg ah "$ASSET_SHA" --argjson ab "$ASSET_BYTES" '.target_version=="2.27.0" and .from_versions==["2.26.0"] and .schema_from=="2026082801" and .schema_to=="2026082801" and .release_tag=="v2.27.0" and .asset_name=="VF_Start_V2.27.0_UPDATE.zip" and .asset_bytes==$ab and .asset_sha256==$ah and (.release_id|tostring)==$rid and .release_identity==("v2.27.0@"+$rs)' /tmp/p01-v227-remote-core/projects/P01.json >/dev/null
          gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$PUBLICATION_GATE" | jq -e '.status=="completed" and .conclusion=="success"' >/dev/null
          gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$ASSET_CLOSURE_GATE" | jq -e '.status=="completed" and .conclusion=="success"' >/dev/null
          echo P01_V227_REMOTE_FENCE=PASS
      - name: Fresh V2.26.0 runtime and representative owner data
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$ROOT" "$COOKIE" /tmp/p01-v227-remote-online-anon.cookies /tmp/p01-v227-remote-ids.json
          cp -a source/src "$ROOT"
          php -S 127.0.0.1:$PORT -t "$ROOT" >/tmp/p01-v227-remote-online-server.log 2>&1 & echo $! >/tmp/p01-v227-remote-online.pid
          for i in $(seq 1 30); do curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:$PORT/setup.php" -o /tmp/p01-v227-remote-setup.html && break || sleep 1; done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-v227-remote-setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:$PORT/setup.php" \
            --data-urlencode "setup_csrf=$CSRF" \
            --data-urlencode 'site_title=V227 Remote Online Gate' \
            --data-urlencode 'admin_password=P01V227!RemoteOnline' \
            --data-urlencode 'admin_password_confirm=P01V227!RemoteOnline' \
            -o /tmp/p01-v227-remote-setup-post.html
          test -f "$ROOT/app/.runtime.php"
          test "$(tr -d '\r\n' < "$ROOT/VERSION.txt")" = 2.26.0
          cat >/tmp/p01-v227-remote-seed.php <<'PHP'
          <?php
          require '/tmp/p01-v227-remote-online/app/bootstrap.php';
          require_once '/tmp/p01-v227-remote-online/app/SurfaceRepository.php';
          $r=new VfRepository(vf_db()); $s=new VfSurfaceRepository(vf_db());
          $c=$r->createCategory(['name'=>'Remote Gate Keep','description'=>'must survive','is_private'=>false]);
          $a=$r->saveLink(null,['category_id'=>$c,'title'=>'Keep Start V226','url'=>'https://example.com/keep-start-v226','description'=>'preserve start','tags'=>'keep,start','is_private'=>false,'is_favorite'=>true],'manual');
          $b=$r->saveLink(null,['category_id'=>$c,'title'=>'Keep Channel V226','url'=>'https://www.youtube.com/@keep-channel-v226','description'=>'preserve channel','tags'=>'keep,channel','is_private'=>true],'manual');
          $s->upsertProfile((int)$b['id'],['surface'=>'channels','resource_kind'=>'youtube','background_friendly'=>true,'note'=>'remote channel note']);
          $w=$r->saveLink(null,['category_id'=>$c,'title'=>'Keep Watch V226','url'=>'https://example.com/keep-watch-v226','description'=>'preserve watch','tags'=>'keep,watch','is_private'=>true],'manual');
          $s->upsertProfile((int)$w['id'],['surface'=>'watch','resource_kind'=>'movie','media_year'=>'2024','media_status'=>'want','note'=>'remote watch note']);
          $p=$r->saveLink(null,['category_id'=>$c,'title'=>'Pending V226','url'=>'https://www.youtube.com/@pending-v226','description'=>'pending','is_private'=>true,'is_pending'=>true],'manual');
          file_put_contents('/tmp/p01-v227-remote-ids.json',json_encode(['category'=>$c,'start'=>$a['id'],'channel'=>$b['id'],'watch'=>$w['id'],'pending'=>$p['id']],JSON_THROW_ON_ERROR));
          echo "P01_V226_SEED=PASS\n";
          PHP
          php /tmp/p01-v227-remote-seed.php | grep -Fx 'P01_V226_SEED=PASS'
          php "$ROOT/cli/verify.php" | grep -Fx 'VERIFY_PASS=YES'
          php "$ROOT/cli/surface-verify.php" | tee /tmp/p01-v227-pre-surface.txt
          grep -Fx 'MULTI_SURFACE_PASS=YES' /tmp/p01-v227-pre-surface.txt
          grep -Fx 'WORKING_SCHEMA=2026082801' /tmp/p01-v227-pre-surface.txt
          echo P01_V226_REMOTE_SOURCE_READY=PASS
      - name: Real default-network V2.26 updater check prepare install
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/p01-v227-real-online.php <<'PHP'
          <?php
          require '/tmp/p01-v227-remote-online/app/bootstrap.php';
          $m=new VfUpdateManager(vf_db());
          $status=$m->status();
          if(empty($status['credential_configured'])) throw new RuntimeException('credential not configured');
          $check=$m->check(true);
          if(empty($check['ok']) || ($check['current_version']??'')!=='2.26.0' || ($check['latest_version']??'')!=='2.27.0' || empty($check['available']) || empty($check['can_update'])) {
              throw new RuntimeException('remote check failed: '.json_encode($check,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES));
          }
          echo 'P01_V227_REMOTE_CHECK=PASS'.PHP_EOL;
          $prepared=$m->prepare();
          if(empty($prepared['ok']) || ($prepared['from_version']??'')!=='2.26.0' || ($prepared['to_version']??'')!=='2.27.0') {
              throw new RuntimeException('remote prepare failed: '.json_encode($prepared,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES));
          }
          echo 'P01_V227_REMOTE_PREPARE=PASS'.PHP_EOL;
          $installed=$m->install((string)$prepared['operation_id']);
          if(empty($installed['ok']) || empty($installed['updated']) || ($installed['from_version']??'')!=='2.26.0' || ($installed['to_version']??'')!=='2.27.0') {
              throw new RuntimeException('remote install failed: '.json_encode($installed,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES));
          }
          echo 'P01_V227_REMOTE_INSTALL=PASS'.PHP_EOL;
          PHP
          php /tmp/p01-v227-real-online.php | tee /tmp/p01-v227-real-online-result.txt
          grep -Fx 'P01_V227_REMOTE_CHECK=PASS' /tmp/p01-v227-real-online-result.txt
          grep -Fx 'P01_V227_REMOTE_PREPARE=PASS' /tmp/p01-v227-real-online-result.txt
          grep -Fx 'P01_V227_REMOTE_INSTALL=PASS' /tmp/p01-v227-real-online-result.txt
          test "$(tr -d '\r\n' < "$ROOT/VERSION.txt")" = "$TARGET_VERSION"
          grep -F "define('VF_VERSION', '2.27.0');" "$ROOT/app/bootstrap.php" >/dev/null
          echo P01_V227_REAL_DEFAULT_NETWORK_UPDATER=PASS
      - name: Post-install preservation baseline and V2.27 workspace mutations
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(tr -d '\r\n' < "$ROOT/VERSION.txt")" = "$TARGET_VERSION"
          php "$ROOT/cli/verify.php" | grep -Fx 'VERIFY_PASS=YES'
          php "$ROOT/cli/surface-verify.php" | tee /tmp/p01-v227-post-surface.txt
          grep -Fx 'MULTI_SURFACE_PASS=YES' /tmp/p01-v227-post-surface.txt
          grep -Fx 'WORKING_SCHEMA=2026082801' /tmp/p01-v227-post-surface.txt
          php "$ROOT/cli/baseline-verify.php" | tee /tmp/p01-v227-post-base.txt
          grep -Fx 'BASELINE_CORE_PASS=YES' /tmp/p01-v227-post-base.txt
          grep -Fx 'DRIFT_COUNT=0' /tmp/p01-v227-post-base.txt
          grep -Fx 'UNKNOWN_COUNT=0' /tmp/p01-v227-post-base.txt
          cat >/tmp/p01-v227-post-assert.php <<'PHP'
          <?php
          require '/tmp/p01-v227-remote-online/app/bootstrap.php';
          $ids=json_decode(file_get_contents('/tmp/p01-v227-remote-ids.json'),true,512,JSON_THROW_ON_ERROR);
          $db=vf_db();
          $stmt=$db->prepare('SELECT title,is_favorite,is_pending FROM links WHERE id=?');
          foreach ([['start','Keep Start V226'],['channel','Keep Channel V226'],['watch','Keep Watch V226'],['pending','Pending V226']] as [$k,$title]) {
              $stmt->execute([(int)$ids[$k]]); $row=$stmt->fetch(PDO::FETCH_ASSOC); if(!$row || ($row['title']??'')!==$title) throw new RuntimeException('lost '.$k);
          }
          $stmt=$db->prepare('SELECT surface,note FROM resource_surface_profiles WHERE link_id=?');
          $stmt->execute([(int)$ids['channel']]); $x=$stmt->fetch(PDO::FETCH_ASSOC); if(($x['surface']??'')!=='channels'||($x['note']??'')!=='remote channel note') throw new RuntimeException('channel profile lost');
          $stmt->execute([(int)$ids['watch']]); $x=$stmt->fetch(PDO::FETCH_ASSOC); if(($x['surface']??'')!=='watch'||($x['note']??'')!=='remote watch note') throw new RuntimeException('watch profile lost');
          if(strtolower((string)$db->query('PRAGMA integrity_check')->fetchColumn())!=='ok') throw new RuntimeException('integrity failed');
          if($db->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC)) throw new RuntimeException('foreign key failed');
          echo 'P01_V227_REMOTE_DATA_PRESERVED=PASS'.PHP_EOL;
          PHP
          php /tmp/p01-v227-post-assert.php | grep -Fx 'P01_V227_REMOTE_DATA_PRESERVED=PASS'
          curl -fsS -c "$COOKIE" -b "$COOKIE" -H 'Content-Type: application/json' -X POST "http://127.0.0.1:$PORT/api.php?action=login" --data '{"password":"P01V227!RemoteOnline"}' | jq -e '.ok==true' >/dev/null
          curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:$PORT/surfaces.php" -o /tmp/p01-v227-post-all.html
          grep -F '全部收藏' /tmp/p01-v227-post-all.html >/dev/null
          grep -F 'data-workspace-overlay' /tmp/p01-v227-post-all.html >/dev/null
          grep -F 'data-open-add' "$ROOT/app/SurfaceShell.php" >/dev/null
          grep -F 'data-detail-form' "$ROOT/app/SurfaceShell.php" >/dev/null
          grep -F 'data-bulkbar' "$ROOT/app/SurfaceShell.php" >/dev/null
          BASE="http://127.0.0.1:$PORT"
          CSRF=$(python3 - <<'PY'
          import re,json,html
          s=open('/tmp/p01-v227-post-all.html',encoding='utf-8').read();m=re.search(r'<script type="application/json" id="vf-workspace-data">(.*?)</script>',s,re.S);assert m;print(json.loads(html.unescape(m.group(1)))['csrf'])
          PY
          )
          CAT=$(jq -r '.category' /tmp/p01-v227-remote-ids.json)
          test "$(curl -sS -o /tmp/p01-v227-unauth.json -w '%{http_code}' -X POST "$BASE/workspace-action.php" --data 'action=favorite&id=1')" = 403
          test "$(curl -sS -o /tmp/p01-v227-badcsrf.json -w '%{http_code}' -b "$COOKIE" -X POST "$BASE/workspace-action.php" --data 'csrf=nope&action=favorite&id=1')" = 403
          curl -fsS -b "$COOKIE" -c "$COOKIE" -X POST "$BASE/workspace-action.php" --data-urlencode "csrf=$CSRF" --data-urlencode action=create --data-urlencode "category_id=$CAT" --data-urlencode 'title=Remote V227 Added' --data-urlencode 'url=https://remote-v227-added.example.com' --data-urlencode 'tags=remote,v227' --data-urlencode surface=start --data-urlencode is_private=1 | tee /tmp/p01-v227-create.json | jq -e '.ok==true and .duplicate==false' >/dev/null
          ID=$(jq -r .id /tmp/p01-v227-create.json)
          curl -fsS -b "$COOKIE" -c "$COOKIE" -X POST "$BASE/workspace-action.php" --data-urlencode "csrf=$CSRF" --data-urlencode action=favorite --data-urlencode "id=$ID" --data-urlencode favorite=1 | jq -e '.ok==true' >/dev/null
          curl -fsS -b "$COOKIE" -c "$COOKIE" -X POST "$BASE/workspace-action.php" --data-urlencode "csrf=$CSRF" --data-urlencode action=save --data-urlencode "id=$ID" --data-urlencode "category_id=$CAT" --data-urlencode 'title=Remote V227 Edited' --data-urlencode 'url=https://remote-v227-added.example.com' --data-urlencode 'tags=edited,v227' --data-urlencode surface=channels --data-urlencode resource_kind=creator --data-urlencode background_friendly=1 --data-urlencode is_private=1 --data-urlencode is_favorite=1 | jq -e '.ok==true' >/dev/null
          IDS=$(jq -cn --argjson a "$ID" --argjson b "$(jq -r '.start' /tmp/p01-v227-remote-ids.json)" '[$a,$b]')
          curl -fsS -b "$COOKIE" -c "$COOKIE" -X POST "$BASE/workspace-action.php" --data-urlencode "csrf=$CSRF" --data-urlencode action=bulk_favorite --data-urlencode "ids=$IDS" --data-urlencode favorite=1 | jq -e '.ok==true' >/dev/null
          cat >/tmp/p01-v227-mutation-assert.php <<'PHP'
          <?php
          require '/tmp/p01-v227-remote-online/app/bootstrap.php';
          $db=vf_db();$stmt=$db->prepare('SELECT id,title,is_favorite FROM links WHERE url=? LIMIT 1');$stmt->execute(['https://remote-v227-added.example.com']);$row=$stmt->fetch(PDO::FETCH_ASSOC);
          if(!$row||$row['title']!=='Remote V227 Edited'||(int)$row['is_favorite']!==1)throw new RuntimeException('workspace mutation failed');
          $p=$db->query('SELECT surface,resource_kind,background_friendly FROM resource_surface_profiles WHERE link_id='.(int)$row['id'])->fetch(PDO::FETCH_ASSOC);
          if(!$p||$p['surface']!=='channels'||$p['resource_kind']!=='creator'||(int)$p['background_friendly']!==1)throw new RuntimeException('surface mutation failed');
          if(strtolower((string)$db->query('PRAGMA integrity_check')->fetchColumn())!=='ok')throw new RuntimeException('post mutation integrity failed');
          if($db->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC))throw new RuntimeException('post mutation foreign key failed');
          echo "P01_V227_REMOTE_WORKSPACE_MUTATION=PASS\n";
          PHP
          php /tmp/p01-v227-mutation-assert.php | grep -Fx 'P01_V227_REMOTE_WORKSPACE_MUTATION=PASS'
          for page in start.php channels.php watch.php surface-manager.php; do curl -fsS -b "$COOKIE" "$BASE/$page" -o "/tmp/p01-v227-${page//./-}.html"; done
          grep -F '<h1>Start</h1>' /tmp/p01-v227-start-php.html >/dev/null
          grep -F '<h1>Channels</h1>' /tmp/p01-v227-channels-php.html >/dev/null
          grep -F '<h1>Watch</h1>' /tmp/p01-v227-watch-php.html >/dev/null
          grep -F '<h1>待整理</h1>' /tmp/p01-v227-surface-manager-php.html >/dev/null
          curl -fsS -c /tmp/p01-v227-remote-online-anon.cookies "$BASE/" -o /tmp/p01-v227-post-public.html
          ! grep -F 'vf-app-sidebar' /tmp/p01-v227-post-public.html
          echo P01_V227_REMOTE_POST_INSTALL=PASS
      - name: Final remote online verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          echo P01_V227_REMOTE_ONLINE_UPDATE_GATE=PASS
          echo SOURCE=v2.26.0@$SOURCE_COMMIT
          echo TARGET=v2.27.0@$RELEASE_SOURCE
          echo MAIN=$MAIN_SHA
          echo RELEASE_ID=$RELEASE_ID
          echo CORE_UPDATES=$CORE_UPDATES_COMMIT
          echo ASSET_SHA=$ASSET_SHA
          echo ASSET_BYTES=$ASSET_BYTES
          echo OWNER_PRODUCTION_UPGRADE=PENDING
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/p01-v227-remote-online.pid 2>/dev/null)" 2>/dev/null || true
