name: S01 C02 PR408 exact content scan cap PHP tests
on:
  push:
    branches: [task/s01-c02-pr408-content-scan-cap-20261013]
    paths: [.github/workflows/s01-c02-pr408-content-scan-cap.yml]
permissions:
  contents: read
jobs:
  content-scan-cap:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact private Ops PR408 head transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 71e30fd1b64943de732f49b23f4081304542553b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - name: Assert exact source and run focused PHP gates
        run: |
          set -Eeuo pipefail
          test "$(git -C private-source rev-parse HEAD)" = 71e30fd1b64943de732f49b23f4081304542553b
          php -v | head -n 1
          php -l private-source/includes/content-workflow/scanner.php
          php -l private-source/tests/s01-c02-content-scan-coverage-limit-unit.php
          php private-source/tests/s01-c02-content-scan-coverage-limit-unit.php
          php private-source/tests/s01-c02-1211025-content-freshness-unit.php
          php private-source/tests/s01-c02-1211030-tool-mount-freshness-unit.php
          echo S01_C02_PR408_EXACT_PHP_GATE_PASS
      - name: Remove temporary private checkout
        if: always()
        run: rm -rf private-source
