name: S01-C01 exact channel isolated regression
on:
  push:
    branches: [task/s01-c01-recovery-13595-channel-check]
permissions:
  contents: read
  actions: read
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_REPO: 'llhzx2018/core-updates'
      TARGET_VERSION: '1.3.0'
      TARGET_SHA: '85e51cffe0ebc1f1d214853b43f3358f0278560a'
      TARGET_TREE: '170d27b84f1c6fdf67932e49c86a82e29612a579'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runner
          persist-credentials: false
      - name: Exact spec identity
        run: |
          set -Eeuo pipefail
          mkdir -p proof
          python3 runner/scripts/ephemeral_lane_spec.py render --spec runner/lanes/s01-c01-recovery-13595-channel/spec.json --template runner/lanes/s01-c01-recovery-13595-channel/channel.template.yml --output /tmp/channel-check.yml >/dev/null
          cmp /tmp/channel-check.yml runner/.github/workflows/s01-c01-recovery-13595-channel-check.yml
          python3 runner/scripts/ephemeral_lane_spec.py audit-rendered --spec runner/lanes/s01-c01-recovery-13595-channel/spec.json --input runner/.github/workflows/s01-c01-recovery-13595-channel-check.yml > proof/identity-audit.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: 'llhzx2018/core-updates'
          ref: '85e51cffe0ebc1f1d214853b43f3358f0278560a'
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Unchanged native CI and exact manifest
        working-directory: target
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '85e51cffe0ebc1f1d214853b43f3358f0278560a'
          test "$(git rev-parse HEAD^{tree})" = '170d27b84f1c6fdf67932e49c86a82e29612a579'
          test "$(git diff --name-only 'ddc8e11a4b1144f92fcf7f6fd6f8837c03af1af8' HEAD)" = projects/S01-C01.json
          test "$(cat VERSION)" = '1.3.0'
          git diff --exit-code 'ddc8e11a4b1144f92fcf7f6fd6f8837c03af1af8' HEAD -- .github/workflows/update-core-ci.yml update-core/php scripts/check_manifest_contract.py schemas
          python3 scripts/check_manifest_contract.py
          php -v
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PY'
          import pathlib,json
          m=json.loads(pathlib.Path('projects/S01-C01.json').read_text())
          assert m['target_version']=='1.35.95' and m['asset_sha256']=='47e12ef95993da8dcf271b9ab93bd3ac2e8b147a4e336e78d301ea414d6824a7' and m['asset_bytes']==1784408
          assert m['from_versions'][-1]=='1.35.94' and len(m['from_versions'])==len(set(m['from_versions']))==87
          assert m['backup_required'] and m['rollback_supported'] and m['schema_from']==m['schema_to']=='N/A'
          print('VF_CHANNEL_NATIVE_BEGIN')
          r={'status':'PASS','repository':'llhzx2018/core-updates','source_sha':'85e51cffe0ebc1f1d214853b43f3358f0278560a','source_tree':'170d27b84f1c6fdf67932e49c86a82e29612a579','native_ci_unmodified':'PASS','manifest_contract':'PASS','php_syntax':'PASS','update_core_regression':'PASS','scope_one_manifest':'PASS','production':'NOT_EXECUTED'}
          pathlib.Path('../proof/channel.json').write_text(json.dumps(r,indent=2));print(json.dumps(r))
          print('VF_CHANNEL_NATIVE_END')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c01-channel-${{ github.run_id }}
          path: proof/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Cleanup transient target
        if: always()
        run: rm -rf target
