name: P02 V2.5.118 Formal Release + Publish

on:
  push:
    branches:
      - run/p02-v25118-release-20260925
    paths:
      - '.github/workflows/p02-v25118-release-publish.yml'
      - 'requests/p02-v25118-release-gate.sh'
      - 'requests/p02-v25118-formal-release.sh'

permissions:
  contents: read

jobs:
  release-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout runner carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner

      - name: Checkout exact merged P02 V2.5.118 main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 5e49ad7300059321e877a402fbfcf174c39ad5b2
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product

      - name: Checkout V2.5.81 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 9290f8d583312524b728288a39f9c493654ccce6
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: old81-src

      - name: Checkout V2.5.82 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 0411c3fbf36a896f0aaaa693e7f077ac9acfb143
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: old82-src

      - name: Checkout V2.5.102 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 430d0e7d7a1f47e2d444f57ac615e6bdabb53823
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: old102-src

      - name: Checkout V2.5.103 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 2c8a75f4fbe391a3beddafe977ebca33ddfd8e1a
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: old103-src

      - name: Checkout V2.5.104 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: c91758d59ded8a7b0df385920cdaf76a0a40e5a0
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: old104-src

      - name: Checkout V2.5.105 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: c103134ba9e23f83d68c9676cdf892fb2629e8f8
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: old105-src

      - name: Checkout V2.5.111 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: a4d55bd24824e7ca61e2fb79cd0d0e20e708279c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: old111-src

      - name: Checkout V2.5.112 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 0f721794483789ac3b6b7f7510ee582f333cd614
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: old112-src

      - name: Checkout V2.5.113 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 4b2c6f2671d910cb2f5b45702466c44103b7340f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: old113-src

      - name: Checkout V2.5.114 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 47322276f6c0405943692585d51fd80973ee60a6
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: old114-src

      - name: Checkout V2.5.115 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: fb58fe97e9a7132c8d9ae1727183809eba7c460b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: old115-src

      - name: Checkout V2.5.116 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: fcea97c157a7bb2c864df0ae5fcb99c2c3950536
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: old116-src

      - name: Checkout V2.5.117 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 25832773eaa5ee2898cd1005369c8649a808d7bf
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: old117-src

      - name: Install runtime and Chromium
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-zip sqlite3 unzip curl
          cd product
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          gh --version

      - name: Release authority applicability gate
        working-directory: product
        run: |
          set -Eeuo pipefail
          grep -q 'OWNER_PREVIEW_RUNTIME_APPLICABILITY = N_A' docs/authority/ACCEPTANCE_MATRIX.md
          echo 'PUBLIC_AUTHORITY_APPLICABILITY INSTALL=REQUIRED SECURITY=REQUIRED TESTING=REQUIRED UPGRADE=REQUIRED DATA_SCHEMA=REQUIRED GIT=REQUIRED UA_UI=REQUIRED API_PROVIDER=N_A SEO=N_A CRON_JOB=N_A NOTIFICATION=N_A OBSERVABILITY=N_A PERFORMANCE=N_A'
          echo P02_V25118_OWNER_PREVIEW_APPLICABILITY=N_A
          echo P02_V25118_PUBLIC_AUTHORITY_GATE=PASS

      - name: Exact-source repository and unit closure
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "5e49ad7300059321e877a402fbfcf174c39ad5b2"
          test "$(git show -s --format=%T HEAD)" = "5856b0b0e2b65887548da5cf0fbdb68175f1ce3c"
          test "$(cat VERSION)" = "2.5.118"
          python3 scripts/generate-source-manifest.py
          git diff --exit-code -- SOURCE_MANIFEST.json SOURCE_MANIFEST.txt
          python3 scripts/verify-source-manifest.py
          python3 -m py_compile scripts/build-candidate.py scripts/build-release.py scripts/build-multisource-update.py scripts/build-multisource-repair.py
          bash -n scripts/verify-release-artifacts.sh
          while IFS= read -r cmd; do test -n "$cmd"; eval "$cmd"; done < <(awk '/run: node tests\/unit\//{sub(/^.*run: /,""); print}' .github/workflows/repository-health.yml)
          bash scripts/verify-repository.sh
          echo P02_V25118_EXACT_SOURCE=PASS

      - name: Maintenance clean FULL browser E2E privacy
        working-directory: product
        env:
          TEST_PASSWORD: "VF-P02-V25112-MAINT-${{ github.run_id }}!"
          EVIDENCE_DIR: "${{ runner.temp }}/p02-v25118-maintenance"
        run: |
          set -Eeuo pipefail
          bash scripts/maintenance-reverify.sh
          echo P02_V25118_MAINTENANCE_BROWSER=PASS

      - name: Settings refinement batch real Chromium regression
        working-directory: product
        env:
          TEST_PASSWORD: "VF-P02-V25112-UX-${{ github.run_id }}!"
        run: |
          set -Eeuo pipefail
          SITE="${RUNNER_TEMP}/p02-v25118-ux-site"
          COOKIE="${RUNNER_TEMP}/p02-v25118-ux-cookie.txt"
          BASE="http://127.0.0.1:18115"
          bash scripts/build-deploy-tree.sh "$SITE"
          php -d display_errors=0 -S 127.0.0.1:18115 -t "$SITE" >"${RUNNER_TEMP}/p02-v25118-ux-server.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 80); do curl -fsS "$BASE/setup.php" >/dev/null 2>&1 && break; sleep .25; done
          curl -fsS -c "$COOKIE" "$BASE/setup.php" > "${RUNNER_TEMP}/p02-v25118-ux-setup.html"
          SETUP_CSRF="$(python3 -c 'import re,html,sys;s=open(sys.argv[1],encoding="utf-8").read();m=re.search(r"name=\"setup_csrf\" value=\"([^\"]+)\"",s);assert m;print(html.unescape(m.group(1)))' "${RUNNER_TEMP}/p02-v25118-ux-setup.html")"
          STATUS="$(curl -sS -o /dev/null -w '%{http_code}' -b "$COOKIE" -c "$COOKIE" -H "Origin: $BASE" --data-urlencode "setup_csrf=$SETUP_CSRF" --data-urlencode "password=$TEST_PASSWORD" --data-urlencode "password_confirm=$TEST_PASSWORD" "$BASE/setup.php")"
          test "$STATUS" = "303"
          VF_UX_E2E_BASE_URL="$BASE" VF_UX_E2E_PASSWORD="$TEST_PASSWORD" node tests/e2e/p02_v25106_basic_settings_ux.mjs
          VF_UX_E2E_BASE_URL="$BASE" VF_UX_E2E_PASSWORD="$TEST_PASSWORD" node tests/e2e/p02_v25107_content_categories_ux.mjs
          VF_UX_E2E_BASE_URL="$BASE" VF_UX_E2E_PASSWORD="$TEST_PASSWORD" node tests/e2e/p02_v25108_display_sort_ux.mjs
          VF_UX_E2E_BASE_URL="$BASE" VF_UX_E2E_PASSWORD="$TEST_PASSWORD" node tests/e2e/p02_v25109_search_use_ux.mjs
          VF_UX_E2E_BASE_URL="$BASE" VF_UX_E2E_PASSWORD="$TEST_PASSWORD" node tests/e2e/p02_v25110_transfer_ux.mjs
          VF_UX_E2E_BASE_URL="$BASE" VF_UX_E2E_PASSWORD="$TEST_PASSWORD" node tests/e2e/p02_v25112_system_overview_inline_ux.mjs
          VF_UX_E2E_BASE_URL="$BASE" VF_UX_E2E_PASSWORD="$TEST_PASSWORD" node tests/e2e/p02_v25115_settings_layout.mjs
          VF_UX_E2E_BASE_URL="$BASE" VF_UX_E2E_PASSWORD="$TEST_PASSWORD" node tests/e2e/p02_v25116_inkstone_settings_surface.mjs
          VF_UX_E2E_BASE_URL="$BASE" VF_UX_E2E_PASSWORD="$TEST_PASSWORD" node tests/e2e/p02_v25117_settings_final_closure.mjs
          VF_UX_E2E_BASE_URL="$BASE" VF_UX_E2E_PASSWORD="$TEST_PASSWORD" node tests/e2e/p02_v25118_updates_production_closure.mjs
          kill "$PID"
          wait "$PID" 2>/dev/null || true
          trap - EXIT
          echo P02_V25118_SETTINGS_BATCH_BROWSER=PASS

      - name: Deterministic formal release preflight
        working-directory: product
        env:
          TEST_PASSWORD: "VF-P02-V25112-RELEASE-${{ github.run_id }}!"
          VF_RELEASE_SOURCE_SHA: 5e49ad7300059321e877a402fbfcf174c39ad5b2
          VF_RELEASE_SOURCE_TREE: 5856b0b0e2b65887548da5cf0fbdb68175f1ce3c
          VF_RELEASE_SOURCE_REF: main
          VF_RELEASE_FROM_VERSIONS: "2.5.81 2.5.82 2.5.102 2.5.103 2.5.104 2.5.105 2.5.111 2.5.112 2.5.113 2.5.114 2.5.115 2.5.116 2.5.117"
        run: |
          set -Eeuo pipefail
          bash scripts/verify-release-artifacts.sh
          echo P02_V25118_RELEASE_PREFLIGHT=PASS

      - name: Real-data direct upgrade matrix
        env:
          TEST_PASSWORD: "VF-P02-V25112-UPGRADE-${{ github.run_id }}!"
        run: |
          set -Eeuo pipefail
          bash runner/requests/p02-v25118-release-gate.sh

      - name: Publish formal release and remote readback
        env:
          VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          bash runner/requests/p02-v25118-formal-release.sh

      - name: Final release marker
        run: echo P02_V25118_FORMAL_RELEASE_GATE=PASS
