name: P06 VF Press RC1 Final Visual Self Dispatcher

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p06-vfpress-rc1-final-visual-self-dispatch.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch final visual evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run p06-vfpress-rc1-final-visual.yml --repo llhzx2018/core-free-runner-public --ref main
