name: P05 Classic Retirement Phase2 Writer
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/p05-classic-retirement-phase2.py'
      - '.github/workflows/p05-classic-retirement-phase2.yml'
permissions:
  contents: read
jobs:
  write:
    if: github.event.pull_request.head.ref == 'write/p05-classic-retirement-phase2-20260902'
    runs-on: ubuntu-24.04
    steps:
      - name: Verify private write capability
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$WRITE_TOKEN"
      - name: Checkout disposable writer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout exact P05 Phase2 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: product/classic-retirement-phase2-20260902
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 2
          path: p05
      - name: Bind exact Phase1 main
        run: |
          set -Eeuo pipefail
          test "$(git -C p05 rev-parse HEAD)" = 'cdf194b9a88d29ecda4cd48523d67eb240f0fe7c'
          test "$(cat p05/VERSION)" = '1.2.3'
      - name: Apply Classic retirement Phase2
        run: |
          set -Eeuo pipefail
          python3 scripts/p05-classic-retirement-phase2.py
          git -C p05 diff --check
          mapfile -t changed < <(git -C p05 status --porcelain | sed -E 's/^.. //' | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 9
          expected=(
            'src/client/App.tsx'
            'src/client/DemoDatasetShortcut.tsx'
            'src/client/ProductApp.tsx'
            'src/client/ProductWorkspaceShortcut.tsx'
            'src/client/product-metric-truth.ts'
            'tests/contract/single-product-shell.test.ts'
            'tests/unit/classic-keyword-trend-coverage.test.ts'
            'tests/unit/classic-nullable-metric-truth.test.ts'
            'tests/unit/product-metric-truth.test.ts'
          )
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done
          test "$(cat p05/VERSION)" = '1.2.3'
          test ! -e p05/src/client/App.tsx
          test ! -e p05/src/client/ProductWorkspaceShortcut.tsx
          test ! -e p05/src/client/DemoDatasetShortcut.tsx
          grep -q "from './product-metric-truth'" p05/src/client/ProductApp.tsx
          echo 'P05_CLASSIC_RETIREMENT_SCOPE=PASS'
      - name: Focused Product truth tests
        working-directory: p05
        run: |
          set -Eeuo pipefail
          npm ci
          node --import tsx --test tests/unit/product-metric-truth.test.ts tests/contract/single-product-shell.test.ts tests/unit/product-preview-loading.test.ts tests/contract/common-system-human-ui.test.ts
      - name: Commit and push Product candidate
        run: |
          set -Eeuo pipefail
          git -C p05 config user.name 'VictorForge'
          git -C p05 config user.email 'llhzx2018@gmail.com'
          git -C p05 add -A src/client tests/contract/single-product-shell.test.ts tests/unit/classic-keyword-trend-coverage.test.ts tests/unit/classic-nullable-metric-truth.test.ts tests/unit/product-metric-truth.test.ts
          git -C p05 commit -m 'refactor(P05): retire Classic workspace sources'
          git -C p05 push origin HEAD:product/classic-retirement-phase2-20260902
          echo "P05_CLASSIC_RETIREMENT_SHA=$(git -C p05 rev-parse HEAD)"
          echo "P05_CLASSIC_RETIREMENT_TREE=$(git -C p05 rev-parse HEAD^{tree})"
          echo 'P05_CLASSIC_RETIREMENT_RELEASE_WRITE=0'
          echo 'P05_CLASSIC_RETIREMENT_PRODUCTION_WRITE=0'
