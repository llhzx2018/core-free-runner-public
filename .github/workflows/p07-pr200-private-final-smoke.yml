name: TEMP P07 PR200 exact-source final smoke and secret gate
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-pr200-private-final-smoke.yml'

permissions:
  contents: read

jobs:
  source-smoke:
    if: github.repository == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Verify private read capability
        shell: bash
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          test -n "$PRIVATE_READ_TOKEN" || exit 78
      - name: Checkout P07 exact private candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 1cfeaa3da4ff9a01ee8f5b089168030343d47cde
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: p07-private
      - name: Validate exact identity and syntax/configuration inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p07-private rev-parse HEAD)" = '1cfeaa3da4ff9a01ee8f5b089168030343d47cde'
          test "$(cat p07-private/BUILD_ID)" = '0.1.0-release86'
          cd p07-private
          bash -n bin/vfops bin/vfops-user bin/vfops-migrate-ui bin/vfops-init-ui
          python3 -m compileall -q lib tests scripts
          for cfg in VF_PROJECT.json config/storage.example.json config/policy.example.json docs/authority/P07_INTEGRATION_MANIFEST.json; do
            python3 -m json.tool "$cfg" >/dev/null
          done
          echo 'P07_PR200_EXACT_IDENTITY_AND_SYNTAX=PASS'
      - name: Source native smoke and menu contractual sanity
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p07-private
          log="$RUNNER_TEMP/p07-pr200-smoke.log"
          if timeout --signal=TERM --kill-after=5s 450 bash tests/smoke.sh >"$log" 2>&1; then
            echo 'P07_PR200_NATIVE_SMOKE=PASS'
          else
            rc=$?
            echo "P07_PR200_NATIVE_SMOKE=UNRESOLVED_FAILURE_RC_$rc"
            exit "$rc"
          fi
      - name: Scan tracked source for secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p07-private
          log="$RUNNER_TEMP/p07-pr200-secret-scan.log"
          if timeout 180 python3 scripts/secret_scan.py --root . >"$log" 2>&1; then
            echo 'P07_PR200_TRACKED_SOURCE_SECRET_GATE=PASS'
          else
            rc=$?
            echo "P07_PR200_TRACKED_SOURCE_SECRET_GATE=FAIL_RC_$rc"
            exit "$rc"
          fi
      - name: Erase transient source and raw logs
        if: always()
        shell: bash
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/p07-private"
          rm -f -- "$RUNNER_TEMP/p07-pr200-smoke.log" "$RUNNER_TEMP/p07-pr200-secret-scan.log"
          echo 'P07_PRIVATE_SOURCE_PERSISTED=NO'
          echo 'P07_PRIVATE_RAW_LOGS_PERSISTED=NO'
