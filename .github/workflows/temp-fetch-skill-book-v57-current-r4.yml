name: TEMP fetch skill-book V5.7 Current R4

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fetch-current-install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      EXPECTED_GOV_SHA: c171efbf04fa02947e21dd10eab04fbd2646235a
      EXPECTED_BYTES: '216743'
      EXPECTED_SHA256: 1672b2b53c035da7aae398c610315df9a52da51bafa62ec9358a9c2c4c0a0b0e
    steps:
      - name: Require read capability
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VF_PRIVATE_READ_TOKEN"

      - name: Checkout exact GOV-DOC Current
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/gov-doc
          ref: ${{ env.EXPECTED_GOV_SHA }}
          token: ${{ env.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov

      - name: Verify exact Current R4 install asset
        shell: bash
        run: |
          set -Eeuo pipefail
          FILE='gov/distribution/skills/current/skill-book_V5.7_INSTALL_20260829r4.zip'
          test -f "$FILE"
          test "$(stat -c%s "$FILE")" = "$EXPECTED_BYTES"
          test "$(sha256sum "$FILE" | awk '{print $1}')" = "$EXPECTED_SHA256"
          python3 - <<'PY'
          import zipfile
          p='gov/distribution/skills/current/skill-book_V5.7_INSTALL_20260829r4.zip'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              names=z.namelist()
              assert len(names)==len(set(names))
          print('CURRENT_R4_INSTALL_READBACK=PASS')
          PY

      - name: Upload exact Current R4 install asset
        uses: actions/upload-artifact@v4
        with:
          name: skill-book-V5.7-CURRENT-R4-exact
          path: gov/distribution/skills/current/skill-book_V5.7_INSTALL_20260829r4.zip
          if-no-files-found: error
          retention-days: 1
