name: P07 M05 新服务器初始化 · DB selection isolated proof
on:
  push:
    branches: [task/p07-m05-db-choice-20261112]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  m05-explicit-engine-and-module-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      P07_EXACT_SOURCE_SHA: 7371f897605701011ba4b3bc18721b9966babbea
    steps:
      - name: Checkout exact private P07 M05 candidate transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 7371f897605701011ba4b3bc18721b9966babbea
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product
      - name: Verify exact source and no-CloudPanel synthetic unit tests
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C product rev-parse HEAD)" = "$P07_EXACT_SOURCE_SHA"
          bash -n product/bin/vfops-init-ui product/bin/vfops-init-core product/bin/vfops-init-entry
          python3 -B -m compileall -q product/scripts/build_p07_m05_bundle.py product/scripts/install_p07_m05_bundle.py product/lib/server_migration.py product/lib/server_migration_pull.py product/tests/test_p07_m05_db_engine_boundary.py
          (cd product && python3 -B -m unittest -v tests.test_p07_m05_db_engine_boundary tests.test_p07_m05_isolated_module)
          echo P07_M05_EXPLICIT_DATABASE_SELECTION=PASS
          echo P07_M05_FOREIGN_MODULE_INSTALL=NONE
          echo P07_CLOUDPANEL_INSTALL=NOT_RUN
          echo P07_OWNER_VPS=NOT_TOUCHED
      - name: Verify original DB policy regression without installation
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          (cd product && python3 -B -m unittest -v tests.test_server_migration tests.test_server_migration_pull)
          echo P07_M05_AND_BACKEND_DB_POLICY_TESTS=PASS
      - name: Always clear private checkout
        if: always()
        shell: bash
        run: |
          rm -rf -- product
          echo P07_PRIVATE_M05_SOURCE_CLEANUP=YES
