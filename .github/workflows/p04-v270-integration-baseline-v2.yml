name: P04 V2.7 Integration Baseline V2
on:
  push:
    branches: [p04-v270-integration-gate]
    paths: [.github/workflows/p04-v270-integration-baseline-v2.yml]
permissions:
  contents: write
jobs:
  baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: p04-v270-integration-gate}
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: integration/v2.7.0-personal-infra
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: private
          persist-credentials: false
      - name: Gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          result=/tmp/result.txt
          fail(){ printf 'STATUS=FAIL\nFAILED_GATE=%s\n' "$1" > "$result"; exit 1; }
          trap 'rc=$?; if [ $rc -ne 0 ] && [ ! -s "$result" ]; then printf "STATUS=FAIL\nFAILED_GATE=UNCLASSIFIED\n" > "$result"; fi' EXIT
          find private -type f -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 php -l >/dev/null || fail PHP_SYNTAX
          node --check private/public/assets/v270-app.js >/dev/null || fail JS_SYNTAX
          test "$(tr -d '\r\n' < private/VERSION)" = '2.7.0' || fail VERSION
          test "$(find private/database/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)" -eq 14 || fail SCHEMA_MIGRATION
          paths=(private/public/index.php private/public/experience.php private/public/assets/v270-app.js private/src/app/Core/PersonalInfraExperienceService.php private/src/app/Core/PersonalInfraTodayTrait.php private/src/app/Core/PersonalInfraMoneyTrait.php private/src/app/Core/PersonalInfraPortfolioTrait.php private/src/app/Core/PersonalInfraDomainTrait.php private/src/app/Core/PersonalInfraInfraTrait.php private/src/app/Core/PersonalInfraSupportTrait.php private/src/app/Core/GlobalSearchService.php)
          for needle in '今天有 3 件事' 'USD 36.40' 'USD 46.20' 'USD 82.19' 'Tokyo-01'; do grep -Fq "$needle" "${paths[@]}" && fail HARDCODE; done
          grep -Fq "if ($method !== 'GET')" private/public/experience.php || fail GET_ONLY
          grep -Eiq '\b(INSERT|UPDATE|DELETE|REPLACE|VACUUM|ATTACH|DETACH)\b' private/src/app/Core/PersonalInfra*.php private/src/app/Core/GlobalSearchService.php && fail READ_ONLY_SOURCE
          printf 'STATUS=PASS\nVERSION=2.7.0\nSCHEMA=14\nMIGRATION=NONE\nSYNTAX=PASS\nHARDCODE=PASS\nREAD_ONLY=PASS\n' > "$result"
      - name: Publish safe result
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          cp /tmp/result.txt evidence/p04-v270-baseline-result.txt || printf 'STATUS=FAIL\nFAILED_GATE=RUNNER_SETUP\n' > evidence/p04-v270-baseline-result.txt
          rm -rf private /tmp/result.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/p04-v270-baseline-result.txt
          git commit -m 'evidence(P04): V2.7 integration baseline result' || exit 0
          git push origin HEAD:p04-v270-integration-gate
