name: S01-C01 Formal Release Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/s01-c01-formal-release-bridge.yml'

permissions:
  contents: read

env:
  PRODUCT_REPOSITORY: llhzx2018/vf-tools-theme
  RELEASE_SOURCE: 20c935524702d26ce9389f0406052c79d52d77aa
  TESTED_PRODUCT_SOURCE: 1ddeed816aa2eddf2849b0e987e87671a090a0d6
  VERSION: 1.35.8
  TAG: v1.35.8
  ASSET_NAME: vf-tools-theme_V1.35.8.zip
  EXPECTED_BYTES: '1766099'
  EXPECTED_SHA256: 82cfd4fd7bc78fdcafbe5ce0bf1255545311d89786c2f81a29200bb19bda9a59
  EXPECTED_FILES: '441'
  RUNTIME_FILES: '437'
  RUNTIME_FINGERPRINT: fd01891ba3f14c0f886788f7fadc5d4dcff5c795c07399fe74111a9d8ac1a2a5

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Existing credential authority gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"
          echo 'PRIVATE_READ_CREDENTIAL=VF_PRIVATE_READ_TOKEN'
          echo 'RELEASE_WRITE_CREDENTIAL=VF_RELEASE_WRITE_TOKEN'
          echo 'NEW_CREDENTIAL_CREATED=NO'

      - name: Checkout exact prepared release source with READ credential
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-tools-theme
          ref: ${{ env.RELEASE_SOURCE }}
          token: ${{ env.READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product

      - name: Verify source identity and build exact locked asset
        shell: bash
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE"
          test "$(tr -d '\r\n' < VERSION)" = "$VERSION"
          git diff --exit-code "$TESTED_PRODUCT_SOURCE" HEAD -- src
          TMPDIR="${RUNNER_TEMP}/vf-theme-release"
          ROOT="${TMPDIR}/vf-tools-theme"
          ZIP="${TMPDIR}/${ASSET_NAME}"
          rm -rf "$TMPDIR"
          mkdir -p "$ROOT"
          cp -a src/. "$ROOT/"
          python3 - "$ROOT" "$ZIP" <<'PY'
          import pathlib,sys,zipfile
          root=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(x for x in root.rglob('*') if x.is_file()):
                  rel=pathlib.PurePosixPath('vf-tools-theme')/p.relative_to(root)
                  info=zipfile.ZipInfo(str(rel),date_time=(1980,1,1,0,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.create_system=3
                  info.external_attr=(p.stat().st_mode & 0xFFFF) << 16
                  z.writestr(info,p.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          PY
          BYTES="$(stat -c '%s' "$ZIP")"
          SHA="$(sha256sum "$ZIP" | awk '{print $1}')"
          FILES="$(find "$ROOT" -type f | wc -l | tr -d ' ')"
          test "$BYTES" = "$EXPECTED_BYTES"
          test "$SHA" = "$EXPECTED_SHA256"
          test "$FILES" = "$EXPECTED_FILES"
          test -f "$ROOT/style.css"
          test -f "$ROOT/functions.php"
          test -f "$ROOT/index.php"
          echo "RELEASE_ASSET=$ZIP" >> "$GITHUB_ENV"
          echo 'PRODUCT_SOURCE_MODIFIED=NO'
          echo "EXACT_ARTIFACT_IDENTITY=PASS $SHA"

      - name: Preflight remote release identity with WRITE credential
        env:
          GH_TOKEN: ${{ env.WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/${PRODUCT_REPOSITORY}" >/dev/null
          ! gh api "repos/${PRODUCT_REPOSITORY}/releases/tags/${TAG}" >/dev/null 2>&1
          ! gh api "repos/${PRODUCT_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1
          echo 'FORMAL_RELEASE_PREFLIGHT=PASS'

      - name: Create exact Tag and private GitHub Release with WRITE credential
        env:
          GH_TOKEN: ${{ env.WRITE_TOKEN }}
        shell: bash
        working-directory: product
        run: |
          set -Eeuo pipefail
          git remote set-url origin "https://x-access-token:${WRITE_TOKEN}@github.com/${PRODUCT_REPOSITORY}.git"
          git tag "$TAG" "$RELEASE_SOURCE"
          git push origin "refs/tags/${TAG}"
          gh release create "$TAG" "$RELEASE_ASSET#${ASSET_NAME}" \
            --repo "$PRODUCT_REPOSITORY" \
            --verify-tag \
            --target "$RELEASE_SOURCE" \
            --title 'VF Tools Theme V1.35.8' \
            --notes 'S01-C01 formal private release. Exact locked artifact: 1,766,099 bytes; SHA-256 82cfd4fd7bc78fdcafbe5ce0bf1255545311d89786c2f81a29200bb19bda9a59. Production bootstrap already executed separately by WordPress Native Theme Upload / Replace; this workflow performs no Production write.'

      - name: Authenticated private Release and Asset readback with READ credential
        env:
          GH_TOKEN: ${{ env.READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/${PRODUCT_REPOSITORY}/git/ref/tags/${TAG}" > /tmp/tag.json
          test "$(jq -r '.object.sha' /tmp/tag.json)" = "$RELEASE_SOURCE"
          gh api "repos/${PRODUCT_REPOSITORY}/releases/tags/${TAG}" > /tmp/release.json
          jq -e --arg tag "$TAG" '.tag_name==$tag and .draft==false and .prerelease==false' /tmp/release.json >/dev/null
          ASSET_ID="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.id' /tmp/release.json)"
          test -n "$ASSET_ID" && test "$ASSET_ID" != null
          REMOTE_SIZE="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.size' /tmp/release.json)"
          test "$REMOTE_SIZE" = "$EXPECTED_BYTES"
          REMOTE_DIGEST="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.digest // empty' /tmp/release.json)"
          if [ -n "$REMOTE_DIGEST" ]; then test "$REMOTE_DIGEST" = "sha256:${EXPECTED_SHA256}"; fi
          gh api -H 'Accept: application/octet-stream' "repos/${PRODUCT_REPOSITORY}/releases/assets/${ASSET_ID}" > /tmp/remote-asset.zip
          test "$(stat -c '%s' /tmp/remote-asset.zip)" = "$EXPECTED_BYTES"
          test "$(sha256sum /tmp/remote-asset.zip | awk '{print $1}')" = "$EXPECTED_SHA256"
          echo "RELEASE_PUBLISHED_AT=$(jq -r '.published_at' /tmp/release.json)" >> "$GITHUB_ENV"
          echo 'PRIVATE_AUTHENTICATED_ASSET_READBACK=PASS'

      - name: Checkout core-updates main with existing WRITE credential
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: main
          token: ${{ env.WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: updates

      - name: Publish S01-C01 wp-component-1.0 Manifest only after Release PASS
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f updates/schemas/wp-component-1.0.schema.json
          test ! -e updates/projects/S01-C01.json
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('updates/projects/S01-C01.json')
          x={
            'schema_version':'wp-component-1.0',
            'project_id':'S01',
            'component_id':'S01-C01',
            'component_type':'THEME',
            'package_slug':'vf-tools-theme',
            'enabled':True,
            'target_version':'1.35.8',
            'from_versions':['1.35.8'],
            'repository':'llhzx2018/vf-tools-theme',
            'release_tag':'v1.35.8',
            'asset_name':'vf-tools-theme_V1.35.8.zip',
            'asset_bytes':1766099,
            'asset_sha256':'82cfd4fd7bc78fdcafbe5ce0bf1255545311d89786c2f81a29200bb19bda9a59',
            'schema_from':'N/A',
            'schema_to':'N/A',
            'minimum_wordpress':'6.5',
            'minimum_php':'8.2',
            'backup_required':True,
            'rollback_supported':True,
            'runtime_contract':'VF_WP_COMPONENT_RUNTIME_AUTHORITY_V1',
            'runtime_files':437,
            'runtime_fingerprint':'fd01891ba3f14c0f886788f7fadc5d4dcff5c795c07399fe74111a9d8ac1a2a5',
            'released_at':os.environ['RELEASE_PUBLISHED_AT'],
            'notes':'S01-C01 1.35.8 ONLINE UPDATE BOOTSTRAP BASELINE. Production is already 1.35.8 after one-time WordPress Native Theme Upload/Replace; from_versions intentionally contains only the existing updater-capable baseline 1.35.8. Because target_version equals installed baseline, no update offer is expected.'
          }
          p.write_text(json.dumps(x,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python3 -m json.tool updates/projects/S01-C01.json >/dev/null
          cd updates
          git config user.name 'VF Release Automation'
          git config user.email 'vf-release-automation@users.noreply.github.com'
          git add projects/S01-C01.json
          git commit -m 'release(S01-C01): publish VF Tools Theme V1.35.8 bootstrap manifest'
          git push origin main
          echo "S01_C01_MANIFEST_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Manifest remote readback with READ credential
        env:
          GH_TOKEN: ${{ env.READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api 'repos/llhzx2018/core-updates/contents/projects/S01-C01.json?ref=main' --jq .content | tr -d '\n' | base64 -d > /tmp/S01-C01.json
          jq -e '
            .schema_version=="wp-component-1.0" and
            .project_id=="S01" and
            .component_id=="S01-C01" and
            .component_type=="THEME" and
            .package_slug=="vf-tools-theme" and
            .target_version=="1.35.8" and
            .from_versions==["1.35.8"] and
            .repository=="llhzx2018/vf-tools-theme" and
            .release_tag=="v1.35.8" and
            .asset_name=="vf-tools-theme_V1.35.8.zip" and
            .asset_bytes==1766099 and
            .asset_sha256=="82cfd4fd7bc78fdcafbe5ce0bf1255545311d89786c2f81a29200bb19bda9a59" and
            .runtime_contract=="VF_WP_COMPONENT_RUNTIME_AUTHORITY_V1" and
            .runtime_files==437 and
            .runtime_fingerprint=="fd01891ba3f14c0f886788f7fadc5d4dcff5c795c07399fe74111a9d8ac1a2a5" and
            .minimum_wordpress=="6.5" and .minimum_php=="8.2" and
            .schema_from=="N/A" and .schema_to=="N/A"
          ' /tmp/S01-C01.json >/dev/null
          echo 'S01_C01_MANIFEST_REMOTE_READBACK=PASS'

      - name: Production public runtime readback only
        shell: bash
        run: |
          set -Eeuo pipefail
          code="$(curl -L -sS -o /tmp/prod.html -w '%{http_code}' https://www3.m3u8.one/)"
          test "$code" = '200'
          test -s /tmp/prod.html
          ! grep -Eqi 'Fatal error|Critical error|There has been a critical error' /tmp/prod.html
          echo 'PRODUCTION_FRONTEND_RUNTIME_READBACK=PASS_HTTP_200'
          echo 'PRODUCTION_ADDITIONAL_WRITE=0'
          echo 'SECOND_BOOTSTRAP=0'
