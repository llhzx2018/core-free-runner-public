name: P01 Mode Batch Context Diagnostic
on:
  push:
    branches: [diagnostic/p01-mode-batch-context-20260831]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE: fe152259bef2ad0e2c8f0eac81d02277ddab587e
      ROOT: ${{ github.workspace }}/product/src
      EVID: /tmp/p01-mode-batch/evidence
      PORT: '18482'
      ADMIN_PASS: P01ModeBatchDiag
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - name: Checkout exact develop truth
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Fresh setup and seed
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-mode-batch; mkdir -p "$EVID"
          test "$(git -C product rev-parse HEAD)" = "$SOURCE"
          php -S 127.0.0.1:$PORT -t "$ROOT" >"$EVID/server.log" 2>&1 & echo $! >/tmp/p01-mode-batch.pid
          COOKIE=/tmp/p01-mode-batch.cookies
          for i in $(seq 1 60); do curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:$PORT/setup.php" -o "$EVID/setup.html" && break; sleep .25; done
          CSRF=$(python3 - "$EVID/setup.html" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:$PORT/setup.php" --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=P01 Mode Batch Diagnostic' --data-urlencode "admin_password=$ADMIN_PASS" --data-urlencode "admin_password_confirm=$ADMIN_PASS" -o "$EVID/setup-post.html"
          ROOT="$ROOT" php <<'PHP' | tee "$EVID/seed.txt"
          <?php
          require getenv('ROOT').'/app/bootstrap.php';
          $repo=new VfRepository(vf_db());
          $a=$repo->createCategory(['name'=>'工作分类 A','description'=>'','parent_id'=>null,'is_private'=>true]);
          $b=$repo->createCategory(['name'=>'工作分类 B','description'=>'','parent_id'=>null,'is_private'=>true]);
          $repo->saveLink(null,['category_id'=>$a,'title'=>'Active Alpha','url'=>'https://active-alpha.example/','is_private'=>1,'is_pending'=>0],'admin');
          $repo->saveLink(null,['category_id'=>$b,'title'=>'Active Beta','url'=>'https://active-beta.example/','is_private'=>1,'is_pending'=>0],'admin');
          $repo->saveLink(null,['category_id'=>$a,'title'=>'Pending Alpha','url'=>'https://pending-alpha.example/','is_private'=>1,'is_pending'=>1],'admin');
          $repo->saveLink(null,['category_id'=>$b,'title'=>'Pending Beta','url'=>'https://pending-beta.example/','is_private'=>1,'is_pending'=>1],'admin');
          echo "SEED=PASS\n";
          PHP
      - name: Chromium mode and mobile batch readback
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-mode-batch/pw; cd /tmp/p01-mode-batch/pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat >diag.cjs <<'JS'
          const {chromium}=require('playwright');const fs=require('fs');
          const base='http://127.0.0.1:18482/';
          (async()=>{const b=await chromium.launch({headless:true});const c=await b.newContext({viewport:{width:390,height:844}});
          const login=await c.request.post(base+'api.php?action=login',{data:{password:'P01ModeBatchDiag'}});if(!login.ok()||!(await login.json()).ok)throw Error('login');
          const p=await c.newPage();
          const read=()=>p.evaluate(()=>({hash:location.hash,linkMode:document.querySelector('#linkMode')?.classList.contains('active')||false,categoryMode:document.querySelector('#categoryMode')?.classList.contains('active')||false,batchShown:document.querySelector('#batchBar')?.classList.contains('show')||false,batchText:document.querySelector('#batchCount')?.textContent?.trim()||'',visibleChecked:document.querySelectorAll('[data-select]:checked').length,actions:[...document.querySelectorAll('#batchBar [data-bulk]')].filter(x=>!!(x.offsetWidth||x.offsetHeight||x.getClientRects().length)).map(x=>x.textContent.trim()),overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}));
          await p.goto(base+'links-admin.php',{waitUntil:'networkidle'});await p.locator('tr').filter({hasText:'Active Alpha'}).locator('input[data-select]').check();
          const activeSelected=await read();await p.screenshot({path:process.env.EVID+'/active-mobile-selected.png',fullPage:true});
          await p.evaluate(()=>{location.hash='#categories'});await p.waitForTimeout(100);const categories=await read();
          await p.evaluate(()=>{location.hash=''});await p.waitForTimeout(100);const returned=await read();await p.screenshot({path:process.env.EVID+'/active-mobile-returned.png',fullPage:true});
          await p.goto(base+'links-admin.php?view=pending',{waitUntil:'networkidle'});await p.locator('#selectPageMobile').check();const pendingSelected=await read();await p.screenshot({path:process.env.EVID+'/pending-mobile-selected.png',fullPage:true});
          const stale=categories.categoryMode===true&&returned.linkMode===true&&returned.batchShown===true&&returned.visibleChecked>0;
          fs.writeFileSync(process.env.EVID+'/state.json',JSON.stringify({activeSelected,categories,returned,pendingSelected,modeSelectionPersists:stale},null,2));
          console.log('P01_MODE_SELECTION_PERSISTS='+String(stale).toUpperCase());console.log(JSON.stringify({activeSelected,categories,returned,pendingSelected}));await b.close();})().catch(e=>{console.error(e);process.exit(1)});
          JS
          EVID="$EVID" node diag.cjs | tee "$EVID/diagnostic.txt"
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-mode-batch-context-${{ github.run_id }}
          path: ${{ env.EVID }}
          if-no-files-found: error
          retention-days: 30
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/p01-mode-batch.pid 2>/dev/null)" 2>/dev/null || true