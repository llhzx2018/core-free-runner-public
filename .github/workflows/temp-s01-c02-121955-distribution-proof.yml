name: TEMP S01-C02 1.21.955 Distribution Proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-s01-c02-121955-distribution-proof.yml'

permissions:
  contents: read

jobs:
  exact-distribution-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      UPDATES_SHA: bf6bee51528369533949b9bbb288599cea4ecc65
      PRODUCT_REPO: llhzx2018/vf-tools-ops
      CURRENT_PRODUCT_SHA: 9da7abfd6a3cfb692685f65f6dd63fb49d6c327b
      RELEASE_TARGET_SHA: b08ad8aa9b5650d544daff647bd2cfa5b56cde3b
      TAG: v1.21.955
      ASSET: vf-tools-ops_V1.21.955.zip
      ASSET_BYTES: '3406465'
      ASSET_SHA256: ceadf9e5c1ec2f7f4a51d6e4f1a9b619028cd97921e7ee1f10ad17eca910f668
      RUNTIME_FILES: '961'
      RUNTIME_FP: 5f7867ec4ed083e3ab34263ed5dfc347c142abaef056891c48f125dd6fd4bc90

    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.UPDATES_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: updates
          persist-credentials: false

      - name: Assert exact manifest identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C updates rev-parse HEAD)" = "$UPDATES_SHA"
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("updates/projects/S01-C02.json").read_text())
          assert m["target_version"]=="1.21.955"
          assert m["release_tag"]=="v1.21.955"
          assert m["asset_name"]=="vf-tools-ops_V1.21.955.zip"
          assert m["asset_bytes"]==3406465
          assert m["asset_sha256"]=="ceadf9e5c1ec2f7f4a51d6e4f1a9b619028cd97921e7ee1f10ad17eca910f668"
          assert m["runtime_files"]==961
          assert m["runtime_fingerprint"]=="5f7867ec4ed083e3ab34263ed5dfc347c142abaef056891c48f125dd6fd4bc90"
          assert m["runtime_file_count"]==961
          assert m["runtime_fingerprint_sha256"]=="5f7867ec4ed083e3ab34263ed5dfc347c142abaef056891c48f125dd6fd4bc90"
          assert "1.21.954" in m["from_versions"]
          assert m["schema_from"]=="6.0.0" and m["schema_to"]=="6.0.0"
          assert m["backup_required"] is True and m["rollback_supported"] is True
          print("S01-C02 1.21.955 manifest identity PASS")
          PY

      - name: Manifest contract audit
        working-directory: updates
        run: python3 scripts/check_manifest_contract.py

      - name: PHP syntax and Update Core regression
        shell: bash
        working-directory: updates
        run: |
          set -euo pipefail
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php

      - name: Formal Release and current-main content identity
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          JSON="$(gh api "repos/$PRODUCT_REPO/releases/tags/$TAG")"
          test "$(jq -r '.target_commitish' <<<"$JSON")" = "$RELEASE_TARGET_SHA"
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.size' <<<"$JSON")" = "$ASSET_BYTES"
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.digest' <<<"$JSON")" = "sha256:$ASSET_SHA256"

          rm -rf product
          git clone -q "https://x-access-token:$GH_TOKEN@github.com/$PRODUCT_REPO.git" product
          git -C product checkout -q "$CURRENT_PRODUCT_SHA"
          test "$(git -C product rev-parse HEAD)" = "$CURRENT_PRODUCT_SHA"
          git -C product diff --quiet "$RELEASE_TARGET_SHA..$CURRENT_PRODUCT_SHA"
          echo "FORMAL_RELEASE_ASSET_AND_CURRENT_TREE=PASS"

      - name: Cleanup
        if: always()
        run: rm -rf updates product
