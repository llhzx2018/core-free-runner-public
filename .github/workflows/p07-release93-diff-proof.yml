name: TEMP P07 SQL diff exact-source gate
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-release93-diff-proof.yml'
permissions:
  contents: read
jobs:
  p07-sql-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_P07_SHA: 27241574a8c9544e336a3ea4c1404dc7605378a0
    steps:
      - name: Verify public Runner private-source access
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          test -n "$VF_PRIVATE_READ_TOKEN" || { echo P07_PRIVATE_READ_CAPABILITY_MISSING; exit 78; }
      - name: Checkout exact private P07 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 27241574a8c9544e336a3ea4c1404dc7605378a0
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p07
      - name: Verify syntax and bounded SQL migration regression
        working-directory: p07
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_P07_SHA"
          python3 -m compileall -q lib/server_migration_pull.py lib/verify.py tests/test_server_migration_pull.py
          PYTHONPATH=lib python3 -m unittest -v tests.test_server_migration_pull tests.test_verify
          echo P07_SQL_DIFF_PRIVATE_EXACT_SOURCE_PASS
