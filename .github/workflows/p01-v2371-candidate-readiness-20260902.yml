name: P01 V2.37.1 Candidate Readiness
on:
  push:
    branches: [release/p01-v2371-hotfix-20260902]
    paths: [.github/workflows/p01-v2371-candidate-readiness-20260902.yml]
permissions:
  actions: read
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CANDIDATE: de5d8cadbfb8a5d289c5fbeb7293e25f097989a8
      CANDIDATE_TREE: 7767528d379070722c7adc1ad8804dc2b677cf6e
      CANDIDATE_RUNTIME_TREE: 37f3be264892224e2f3041564844c2aebd471064
      HOTFIX: 0fdf3746d1b218b0781bac44bd3079ef5582e044
      MAIN: fe0aaef44b163c4b899d802e73faa69d06b0f285
      SOURCE: 5172a497f7a2c9065880ae0d1257a15469917621
      SOURCE_TREE: eac2a8c76c49925bffbca9c23314ef90aec6f3bd
      SOURCE_RUNTIME_TREE: 057fbba8822950f163aa322d99b889ed3ab24842
      VERSION: 2.37.1
      SOURCE_VERSION: 2.37.0
      SCHEMA: '2026082901'
      OUT: /tmp/p01-v2371-candidate-artifacts
      EVID: /tmp/p01-v2371-candidate-evidence
      UPGRADE: /tmp/p01-v2371-upgrade
      FRESH: /tmp/p01-v2371-fresh
    steps:
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: release/p01-v2371-hotfix-20260902
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 0fe72c7981f5f2b6ddd51bf4cfa5d6c014c9b0d3
          path: template
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: agent/p01-22121-formal-artifact-gate-20260819
          path: proven
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.CANDIDATE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: candidate
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.37.0
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: production
      - name: Verify hotfix evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33591472844 --jq .conclusion)" = failure
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33591609518 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33592368667 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33592546995 --jq .conclusion)" = success
          printf 'HOTFIX_R1=HARNESS_ONLY\nHOTFIX_R2=PASS\nFOUR_SITE=PASS\nDETAIL_LEVEL=PASS\n' | tee "$EVID/prior-gates.txt"
      - name: Generate readiness gates
        run: python3 runner/scripts/p01_v2371_candidate_readiness_generate.py
      - name: Exact source fence
        run: bash /tmp/p01-v2371-generated/01-exact.sh
      - name: Build deterministic candidate artifacts
        run: bash /tmp/p01-v2371-generated/02-build.sh
      - name: Actual V2.37.0 to V2.37.1 Atomic upgrade
        run: bash /tmp/p01-v2371-generated/03-atomic.sh
      - name: Strict fresh candidate runtime
        run: bash /tmp/p01-v2371-generated/04-fresh.sh
      - name: Hotfix blob and provider contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD:src/app/ResourceCoverCache.php)" = 3bf6e8a069b683038540525f51175df4e505be6b
          test "$(git -C candidate rev-parse HEAD:src/assets/workspace.js)" = f34b3916672569c21e609cda263466a70a95013f
          PAGE='https://xiaoheimi.cc/index.php/vod/detail/id/220543.html'
          curl -fsSL --max-time 20 -A 'VF-Start/2.37.1 CoverCache' "$PAGE" -o /tmp/v2371-xhm.html
          php -r "require 'candidate/src/app/ResourceCoverCache.php'; \$c=VfResourceCoverCache::extractCoverCandidates(file_get_contents('/tmp/v2371-xhm.html'),'$PAGE'); if(!isset(\$c[0])||!str_contains(\$c[0],'/upload/vod/')){var_export(\$c);exit(21);} echo \$c[0],PHP_EOL;" | tee "$EVID/xiaoheimi-first.txt"
          POSTER="$(tail -n1 "$EVID/xiaoheimi-first.txt")"
          curl -fsSL --max-time 20 -A 'VF-Start/2.37.1 CoverCache' "$POSTER" -o /tmp/v2371-poster.bin
          file --mime-type -b /tmp/v2371-poster.bin | grep -Eq '^image/(jpeg|png|webp)$'
          printf 'HOTFIX_BLOBS_EXACT=PASS\nREAL_XIAOHEIMI=PASS\n' | tee "$EVID/provider-contract.txt"
      - name: Final candidate verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(cat candidate/VERSION)" = 2.37.1
          jq -e '.production_version=="2.37.0" and .published_release.version=="2.37.0" and .candidate_version=="2.37.1" and .current_change.release_authorized_by_owner==true' candidate/VF_PROJECT.json >/dev/null
          printf 'P01_V2371_CANDIDATE_READINESS=PASS\nCANDIDATE=%s\nTREE=%s\nRUNTIME_TREE=%s\nSOURCE=%s\nSCHEMA=%s\nATOMIC_2370_TO_2371=PASS\nFRESH_INSTALL=PASS\nHOTFIX_BLOBS_EXACT=PASS\nOWNER_PRODUCTION_WRITE=NO\n' "$CANDIDATE" "$CANDIDATE_TREE" "$CANDIDATE_RUNTIME_TREE" "$SOURCE" "$SCHEMA" | tee "$EVID/verdict.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-v2371-candidate-readiness-${{ github.run_id }}
          path: |
            /tmp/p01-v2371-candidate-artifacts
            /tmp/p01-v2371-candidate-evidence
          if-no-files-found: warn
          retention-days: 90
