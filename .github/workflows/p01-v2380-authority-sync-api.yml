name: P01 V2.38.0 Authority Sync API

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v2380-authority-sync-api.yml'
      - 'scripts/p01_v2380_authority_sync_api.py'

permissions:
  contents: read

jobs:
  authority-sync-api:
    if: github.event.pull_request.head.ref == 'test/p01-v2380-authority-sync-api-20260902'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout disposable public Runner branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Create atomic metadata-only authority commit
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          python3 scripts/p01_v2380_authority_sync_api.py | tee /tmp/p01-v2380-authority-sync.txt
          grep -qx 'P01_V2380_AUTHORITY_SYNC=PASS' /tmp/p01-v2380-authority-sync.txt
          grep -qx 'P01_V2380_METADATA_FILES=9' /tmp/p01-v2380-authority-sync.txt
          grep -qx 'P01_V2380_MAIN_WRITE=0' /tmp/p01-v2380-authority-sync.txt
          grep -qx 'P01_V2380_FORMAL_RELEASE_WRITE=0' /tmp/p01-v2380-authority-sync.txt
          grep -qx 'P01_V2380_PRODUCTION_WRITE=0' /tmp/p01-v2380-authority-sync.txt
