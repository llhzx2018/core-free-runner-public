name: P01 V2.38.0 Authority Sync API

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v2380-authority-sync-api.yml'

permissions:
  contents: read

jobs:
  authority-sync-api:
    if: github.event.pull_request.head.ref == 'test/p01-v2380-authority-sync-api-20260902'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      REPO: llhzx2018/vf-start
      BRANCH: release/v2.38.0-authority-sync-20260902
      START: 44a13c13585e82c2061657e78d06055f0879a60f
    steps:
      - name: Create atomic metadata-only authority commit
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          HEAD_SHA="$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq .object.sha)"
          test "$HEAD_SHA" = "$START"
          ! gh api "repos/$REPO/git/ref/tags/v2.38.0" >/dev/null 2>&1
          BASE_TREE="$(gh api "repos/$REPO/git/commits/$START" --jq .tree.sha)"
          BASE_SRC="$(gh api "repos/$REPO/git/trees/$BASE_TREE" --jq '.tree[]|select(.path=="src")|.sha')"
          test -n "$BASE_SRC"

          ROOT=/tmp/p01-v2380-authority
          rm -rf "$ROOT"; mkdir -p "$ROOT"
          files=(
            CHANGELOG.md
            README.md
            VF_PROJECT.json
            docs/architecture/P01_MULTI_SURFACE_ARCHITECTURE.md
            docs/authority/ACCEPTANCE_MATRIX.md
            docs/authority/CURRENT.md
            docs/authority/RPD.md
            docs/authority/SSOT.md
          )
          for p in "${files[@]}"; do
            mkdir -p "$ROOT/$(dirname "$p")"
            gh api "repos/$REPO/contents/$p?ref=$START" --jq .content | base64 -d > "$ROOT/$p"
            test -s "$ROOT/$p"
          done
          mkdir -p "$ROOT/docs/decisions"

          ROOT="$ROOT" python3 - <<'PY'
          from pathlib import Path
          import json, os, re
          root=Path(os.environ['ROOT'])
          VERSION='2.38.0'; PUBLISHED='2.37.5'; OWNER_PROD='2.37.4'; SCHEMA='2026082901'
          CANDIDATE='869178a4c8144a0760ea489936c4bde5efa989d2'
          FORMAL='44a13c13585e82c2061657e78d06055f0879a60f'
          READINESS='33619802724'; BIND='33620070855'
          BEGIN='<!-- V2380-AUTHORITY:BEGIN -->'; END='<!-- V2380-AUTHORITY:END -->'

          def replace_block(rel, body):
              p=root/rel; text=p.read_text(encoding='utf-8')
              text=re.sub(re.escape(BEGIN)+r'.*?'+re.escape(END)+r'\n*','',text,flags=re.S)
              block=f'{BEGIN}\n{body.strip()}\n{END}\n\n'
              lines=text.splitlines(True)
              if lines and lines[0].startswith('# '):
                  text=lines[0]+'\n'+block+''.join(lines[1:]).lstrip('\n')
              else: text=block+text.lstrip('\n')
              p.write_text(text,encoding='utf-8')

          common=f'''## V2.38.0 · Projects Workspace Release Candidate

- 状态：`FORMAL RELEASE PREPARATION / NOT PUBLISHED`
- Published Latest：`V{PUBLISHED}`
- Owner Production Observed：`V{OWNER_PROD}`
- R2 Candidate：`{CANDIDATE}` / Candidate Readiness `{READINESS}` = `PASS`
- R2 Formal Source：`{FORMAL}` / Formal Bind `{BIND}` = `PASS`
- 版本围栏：root `VERSION` = runtime `src/VERSION.txt` = `{VERSION}`
- Schema：`{SCHEMA}` / Migration：`NONE`
- `v2.38.0` Tag / GitHub Release / core-updates / Production：`NOT_RUN`

本次把原独立 `kewaro` 项目入口职责并入 P01 的登录后「项目」工作区。「项目」是个人系统/项目入口，不是新的 URL Resource Domain，不增加第二套数据 Authority。P01/P02/P04/P05 保持当前项目入口；P03/P06 只显示 `RETIRED` 历史状态，不恢复旧项目路由。旧 `kewaro` 仓只能在 V2.38.0 上线且 Owner 实际确认导航与页面后，另行获得 destructive approval 才能删除。'''

          replace_block('README.md', common)
          replace_block('docs/authority/CURRENT.md', common+'''\n\n### Current Next Action\n\n构建 deterministic Formal Artifact 与 Strict Fresh。全部 PASS 后停在 Formal Release Owner Gate，不提前创建 Tag/Release。''')
          replace_block('docs/authority/RPD.md', common+'''\n\n### Product Shape Addendum\n\n登录后顶级导航为 `首页 / 导航 / 频道 / 影视 / 专题 / 项目 / 退出`。其中「项目」只聚合个人系统入口与状态；它不写入 `links`、不增加 Resource Domain Profile、不改变导航/频道/影视/专题四个内容域的数据模型。''')
          replace_block('docs/authority/SSOT.md', common+'''\n\n### SSOT Addendum\n\n`src/projects.php` 是 authenticated presentation/workspace entry。项目清单当前由该页面的受控配置呈现；不新增 SQLite 表、不复制 URL Identity、不改变 `links` / `resource_domain_profiles` / privacy authority。P03/P06 不得成为 active route。''')
          replace_block('docs/authority/ACCEPTANCE_MATRIX.md', common+f'''\n\n### V2.38.0 Acceptance Addendum\n\n- [x] 登录后导航顺序为 `首页 → 导航 → 频道 → 影视 → 专题 → 项目 → 退出`。\n- [x] 匿名访问 `projects.php` 重定向到登录入口。\n- [x] P01/P02/P04/P05 为当前入口；P03/P06 仅 RETIRED。\n- [x] 390px viewport 无 document horizontal overflow。\n- [x] Schema / Migration 不变。\n- [x] R2 Candidate Readiness `{READINESS}` PASS。\n- [x] R2 Formal Bind `{BIND}` PASS。\n- [ ] Formal Artifact。\n- [ ] Strict Fresh。\n- [ ] Formal Release Owner approval。\n- [ ] Owner Production verification。''')
          replace_block('docs/architecture/P01_MULTI_SURFACE_ARCHITECTURE.md', common+'''\n\n### Projects Workspace Architecture Addendum\n\n`projects.php` 位于现有 authenticated P01 shell 内，复用相同 Session、安全 Header、Sidebar、Theme 与全局导航。它是 portfolio/workspace presentation，不建立新数据库或第二前端 Authority。外部 P02/P04/P05 入口使用受控外链；P01 回到本地 Home；P03/P06 仅保留退役说明。''')

          ch=root/'CHANGELOG.md'; text=ch.read_text(encoding='utf-8')
          heading='## V2.38.0 · Projects Workspace Release Candidate · 2026-09-02'
          if heading not in text:
              entry=f'''{heading}\n\n- 原独立 `kewaro` 项目索引职责并入 P01，新增登录后 `projects.php` 与顶部「项目」入口。\n- 顶级导航：`首页 / 导航 / 频道 / 影视 / 专题 / 项目 / 退出`。\n- P01/P02/P04/P05 保留为当前项目；P03/P06 仅 RETIRED，不恢复旧路由。\n- `项目` 是 portfolio/workspace presentation，不新增 Resource Domain、SQLite 表、URL Identity 或 Privacy Authority。\n- root/runtime 双版本围栏均为 `2.38.0`；Schema `{SCHEMA}` 不变，无 Migration。\n- Candidate Readiness `{READINESS}` PASS；Formal Bind `{BIND}` PASS；Formal Artifact / Strict Fresh / Formal Release 尚未执行。\n\n'''
              ch.write_text(entry+text,encoding='utf-8')

          (root/'docs/decisions/ADR-20260902-projects-workspace.md').write_text(f'''# ADR · 2026-09-02 · Kewaro Project Index Consolidation into P01\n\n## Status\n\n`ACCEPTED / RELEASE CANDIDATE V2.38.0`\n\n## Decision\n\n把原独立 `kewaro` 静态项目入口职责并入 P01，作为登录后的「项目」工作区。P01/P02/P04/P05 保持当前入口；P03/P06 仅展示 RETIRED 历史状态。\n\n## Architectural Boundary\n\n- 不新增数据库表、URL Identity、Resource Domain 或 Privacy Authority。\n- `projects.php` 复用 P01 当前认证、安全 Header、Shell、Theme 与导航。\n- `项目` 是 portfolio/workspace presentation，不是第五个内容资源域。\n- Kewaro 独立仓在 V2.38.0 Production 实际验证前不得删除；删除仍需单独 destructive approval。\n\n## Evidence\n\n- Product PR `#224` merged to main as `00216560e47a6b8e629ee8b03f63462d02d18c7b`.\n- R2 Candidate `{CANDIDATE}` / Readiness `{READINESS}` PASS.\n- R2 Formal Source `{FORMAL}` / Formal Bind `{BIND}` PASS.\n- Schema `{SCHEMA}` / Migration `NONE`.\n''',encoding='utf-8')

          vp=root/'VF_PROJECT.json'; data=json.loads(vp.read_text(encoding='utf-8'))
          data.update({
            'status':'V2.37.4 OWNER PRODUCTION OBSERVED / V2.37.5 PUBLISHED / V2.38.0 PROJECTS RELEASE CANDIDATE',
            'production_version':OWNER_PROD,'working_version':VERSION,'target_release_version':VERSION,
            'current_phase':'V2.38.0 PROJECTS WORKSPACE / FORMAL RELEASE PREPARATION',
            'candidate_version':VERSION,'candidate_schema_version':SCHEMA,
            'candidate_state':'V2.38.0 R2 CANDIDATE READINESS + FORMAL BIND PASS / NOT PUBLISHED',
            'formal_release_state':'V2.38.0 PRE-RELEASE GATES IN PROGRESS / NOT PUBLISHED',
            'current_authority':'Owner Production V2.37.4 OBSERVED / Published Latest V2.37.5 / V2.38.0 Projects Candidate',
            'next_action':'Build deterministic V2.38.0 Formal Artifact and Strict Fresh; request explicit Owner Formal Release approval only after PASS.'})
          auth=data.get('authority') if isinstance(data.get('authority'),dict) else {}; data['authority']=auth
          auth['current_formal_release_evidence']='docs/evidence/P01_V2.38.0_FORMAL_BIND_R2_20260902.md'
          data['current_change']={'change_id':'P01-V2380-PROJECTS-WORKSPACE-20260902','type':'MINOR FEATURE / PROJECTS WORKSPACE + KEWARO CONSOLIDATION','published_base_version':PUBLISHED,'product_main_merge':'00216560e47a6b8e629ee8b03f63462d02d18c7b','r2_candidate_source':CANDIDATE,'r2_candidate_readiness_run':int(READINESS),'r2_candidate_readiness':'PASS','r2_formal_source':FORMAL,'r2_formal_bind_run':int(BIND),'r2_formal_bind':'PASS','schema_change':False,'migration':None,'version_change':True,'release_authorized_by_owner':False,'main_write':False,'production_write':False,'runner_main_write':False,'release_completed':False}
          data['v2_38_0_release_candidate']={'version':VERSION,'source_version':PUBLISHED,'schema_version':SCHEMA,'candidate_source':CANDIDATE,'candidate_readiness_run':int(READINESS),'candidate_readiness':'PASS','formal_source':FORMAL,'formal_bind_run':int(BIND),'formal_bind':'PASS','formal_artifact':'NOT_RUN','strict_fresh':'NOT_RUN','tag_state':'NOT_CREATED','release_state':'NOT_PUBLISHED','core_updates_state':'NOT_RUN','production_write':False,'kewaro_repository_delete':'NOT_AUTHORIZED'}
          vp.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          python3 -m json.tool "$ROOT/VF_PROJECT.json" >/dev/null
          expected=(CHANGELOG.md README.md VF_PROJECT.json docs/architecture/P01_MULTI_SURFACE_ARCHITECTURE.md docs/authority/ACCEPTANCE_MATRIX.md docs/authority/CURRENT.md docs/authority/RPD.md docs/authority/SSOT.md docs/decisions/ADR-20260902-projects-workspace.md)
          entries='[]'
          for p in "${expected[@]}"; do
            test -s "$ROOT/$p"
            payload="$(jq -Rs '{content:.,encoding:"utf-8"}' "$ROOT/$p")"
            blob="$(gh api -X POST "repos/$REPO/git/blobs" --input - <<<"$payload" --jq .sha)"
            entries="$(jq --arg p "$p" --arg s "$blob" '. + [{path:$p,mode:"100644",type:"blob",sha:$s}]' <<<"$entries")"
          done
          jq -n --arg base "$BASE_TREE" --argjson tree "$entries" '{base_tree:$base,tree:$tree}' >/tmp/tree.json
          NEW_TREE="$(gh api -X POST "repos/$REPO/git/trees" --input /tmp/tree.json --jq .sha)"
          jq -n --arg msg 'docs(P01): sync V2.38.0 Projects release authority' --arg tree "$NEW_TREE" --arg parent "$START" '{message:$msg,tree:$tree,parents:[$parent]}' >/tmp/commit.json
          NEW_COMMIT="$(gh api -X POST "repos/$REPO/git/commits" --input /tmp/commit.json --jq .sha)"
          jq -n --arg sha "$NEW_COMMIT" '{sha:$sha,force:false}' >/tmp/ref.json
          gh api -X PATCH "repos/$REPO/git/refs/heads/$BRANCH" --input /tmp/ref.json >/dev/null
          test "$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq .object.sha)" = "$NEW_COMMIT"
          NEW_SRC="$(gh api "repos/$REPO/git/trees/$NEW_TREE" --jq '.tree[]|select(.path=="src")|.sha')"
          test "$NEW_SRC" = "$BASE_SRC"
          gh api "repos/$REPO/compare/$START...$NEW_COMMIT" --jq '.files[].filename' | sort >/tmp/actual.txt
          printf '%s\n' "${expected[@]}" | sort >/tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          test "$(gh api "repos/$REPO/contents/VERSION?ref=$NEW_COMMIT" --jq .content | base64 -d)" = '2.38.0'
          test "$(gh api "repos/$REPO/contents/src/VERSION.txt?ref=$NEW_COMMIT" --jq .content | base64 -d)" = '2.38.0'
          echo P01_V2380_AUTHORITY_SYNC=PASS
          echo P01_V2380_AUTHORITY_SOURCE=$NEW_COMMIT
          echo P01_V2380_AUTHORITY_TREE=$NEW_TREE
          echo P01_V2380_SRC_TREE_UNCHANGED=$NEW_SRC
          echo P01_V2380_METADATA_FILES=9
          echo P01_V2380_MAIN_WRITE=0
          echo P01_V2380_FORMAL_RELEASE_WRITE=0
          echo P01_V2380_PRODUCTION_WRITE=0
